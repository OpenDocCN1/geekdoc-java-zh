  trans: "\n\n# 方法参考\n\n* `addActionListener(ActionListener)` - 向此文本字段添加动作监听器的方法，用于处理动作事件。在此字段中按“回车”键将触发一个动作事件。\n\
    * `getDocuement()` - 返回用于持有此字段文本的文档对象的方法。\n* `getText()` - 以字符串对象形式返回此字段文本的方法。\n\
    \n* `javax.swing.text.PlainDocument` - 映一个表示纯文本文档的 Swing 类。`PlainDocument` 被用作\
    \ `JTextField` 的默认文档以存储其文本。包含的方法有：\n\n* `addDocumentListener(DocumentListener)`\
    \ - 向此文档添加文档监听器的方法。\n\n* `javax.swing.event.DocumentListener` - 一个 Swing 接口，供实现类使用用以处理文档事件。包含的方法有：\n\
    \n* `changeUpdate(DocumentEvent)` - 当文档的任何属性发生变化时被调用的方法。\n* `insertUpdate(DocumentEvent)`\
    \ - 当文本插入到文档中时被调用的方法。\n* `removeUpdate(DocumentEvent)` - 当文本从文档中移除时被调用的方法。\n\n\
    Java Swing 教程 - Herong 的教程示例\n\n∟JTextField - Swing 文本字段类\n\n∟ActionListener 和\
    \ DocumentListener\n\n本节提供了一个教程示例，介绍如何创建一个既实现了 `ActionListener` 监听器又实现了 `DocumentListener`\
    \ 监听器的事件处理器的文本字段。\n\n正如你在上一节中看到的，文本字段可以直接触发动作事件。它也可以通过其关联的文档间接触发文档事件。这里有一个示例程序，向你展示这些事件是如何以及何时被触发的：\n\
    \n```java\n /* JTextFieldTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\nimport javax.swing.event.*;\nimport javax.swing.text.*;\npublic\
    \ class JTextFieldTest {\n   public static void main(String[] a) {\n      JFrame\
    \ f = new JFrame(\"Text Field Test\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      MyTextField t = new MyTextField(16);\n      f.getContentPane().add(t,BorderLayout.CENTER);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyTextField\
    \ extends JTextField \n      implements ActionListener, DocumentListener  {\n\
    \      static int count = 0;\n      public MyTextField(int l) {\n         super(l);\n\
    \         addActionListener(this);\n         Document doc = this.getDocument();\n\
    \         System.out.println(\"The document object: \"+doc);\n         doc.addDocumentListener(this);\n\
    \      }\n      public void actionPerformed(ActionEvent e) {\n         count++;\n\
    \         System.out.println(count+\": Action performed - \"+getText());\n   \
    \   }\n      public void insertUpdate(DocumentEvent e) {\n         count++;\n\
    \         System.out.println(count+\": Insert update - \"+getText());\n      }\n\
    \      public void removeUpdate(DocumentEvent e) {\n         count++;\n      \
    \   System.out.println(count+\": Remove update - \"+getText());\n      }\n   \
    \   public void changedUpdate(DocumentEvent e) {\n         count++;\n        \
    \ System.out.println(count+\": Change update - \"+getText());\n      }\n   }\n\
    }\n```\n\n运行此程序并在文本字段中执行以下操作：\n\n* 输入 \"h\"。\n* 输入 \"i\"。\n* 按退格键删除 \"i\"。\n*\
    \ 输入 \"e\"。\n* 按回车键。\n\n文本字段看起来应该像这样：\n\n![](img/image00150.jpeg)\n\n## JTextField\
    \ 监听器\n\n你应该会在控制台窗口看到以下输出：\n\n```\n The document object: javax.swing.text.PlainDocument@79\n\
    1: Insert update - h\n2: Insert update - i\n3: Remove update - h\n4: Insert update\
    \ - e\n5: Action performed - e\n```\n\n输出确认：\n\n* `TextField` 类使用 `PlainDocument`\
    \ 作为文档。\n* `ActionListener` 在按下回车键时被调用。\n* `changeUpdate()` 被调用。\n\nJava Swing\
    \ 教程 - Herong 的教程示例\n\n∟JComboBox - Swing 组合框类\n\n本章提供了关于 `JComboBox` 类的教程说明和代码。主题包括\
    \ `JComboBox` 类的描述、创建组合框、从组合框中获取选项以及将组合框用作文本字段。\n\n> javax.swing.JComboBox 相关方法\n\
    > ActionListener 和 ItemListener\n> getSelectedItem() - 组合框的选中项\n> setEditable()\
    \ - 将组合框作为文本字段\n\n### 结论：\n\n* `javax.swing.JComboBox` 类表示一个 组合框。\n* `ActionListener`、`ChangeListener`\
    \ 或 `ItemListener` 接口可以处理组合框的操作。\n* `getSelectedItem()` 方法可以从组合框中获取选中或输入的项。\n\
    * `setEditable()` 方法可以开启或关闭组合框的文本输入部分。\n\n本章列出的示例已在 Windows 和 macOS 计算机上通过 JDK\
    \ 1.3.1 到 17 的测试。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JComboBox - Swing 组合框类\n\
    \n∟javax.swing.JComboBox 相关方法\n\n本节描述了 `javax.swing.JComboBox` 类及其常用的方法。\n\n`javax.swing.JComboBox`\
    \ - 一个表示 UI 下拉按钮的 Swing 类，也称为组合框。一些有趣的方法：\n\n* `JComboBox(String[])` - 创建在组合框旁边显示指定字符串的组合框的构造函数。默认未选中。\n\
    * `addActionListener(ActionListener)` - 向此组合框添加动作监听器的方法，用于处理动作事件。点击此组合框将触发一个动作事件。\n\
    * `addItemListener(ItemListener)` - 向此组合框添加项目监听器的方法，用于处理项目事件。点击此组合框将触发一个项目事件。\n\
    * `setSelectedIndex(index)` - 将选择设置为给定索引的选项的方法。如果 `index` 为 -1，则未选中任何选项。\n* `getSelectedItem()`\
    \ - 返回组合框中第一个选中项的方法。如果没有选中项，则返回 `null`。\n* `getSelectedObjects()` - 返回组合框中所有选中项的方法。\n\
    * `setEditable()` - 将组合框设置为可编辑的方法，以便户可以像文本字段一样向组合框中输入文本。\n\n"
- fmt: "\n```java\n /* JComboBoxTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\nimport javax.swing.event.*;\npublic class JComboBoxTest {\n\
    \   public static void main(String[] a) {\n      JFrame f = new JFrame(\"My Combo\
    \ Box\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\n      JLabel\
    \ color = new JLabel(\"Colors:\");\n      f.getContentPane().add(color,BorderLayout.NORTH);\n\
    \      String[] options = {\"Red\", \"Green\", \"Blue\"};\n      MyComboBox list\
