    # Java Swing 教程 - Herong 的教程示例


    ## JDK (Java 开发包)(part0003.xhtml)

    ### 什么是 JDK

    本节描述了 JDK（Java 开发包）——使用 Java 语言构建软件组件的开发环境。

    JDK（Java 开发包）是 Oracle 开发的 Java 标准版开发包（JDK™）的简称。它是使用 Java 语言构建软件组件的开发环境。

    JDK 包含以下组件：

    - JRE（Java 运行时环境）：JRE 允许你运行 Java 程序。JRE 使用实现 JVM 规范的 HotSpot 作为 JVM（虚拟机）。访问 herongyang.com/JVM
    了解更多关于 JRE 的教程。

    - JCL（Java 类库）：JCL 是一组 Java 程序可以在运行时调用的可加载库。JCL 被组织成 Java 包。某些包是访问 `java.io.*`、`java.net.*`、`java.awt`
    等原生系统 API 的封装。本书提供了 JCL 教程。

    - Java 开发工具：工具包括 Java 编译器、JAR 工具、类文件反汇编器、调试器、JRE 构建器等。访问 herongyang.com/Java-Tools
    了解更多关于 Java 工具的教程。


