    \ - Takes unlimited number of components and let them flow horizontally or vertically\
    \ in one direction.\n\n*   java.awt.GridLayout - Divides the container into rows\
    \ and columns and assigns one component for each cell.\n\n*   java.awt.GridBagLayout\
    \ - Divides the container into rows and columns and assigns one component for\
    \ each cell with cell sizes not equal.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Layout of Components in a Container](#part0071.xhtml)\n\
    \n∟java.awt.BorderLayout - Border Layout\n\nThis section provides a tutorial example\
    \ on how to create a BorderLayout to layout components in a container. BorderLayout\
    \ has 5 fixed sections - north, south, west, east and center.\n\n**java.awt.BorderLayout**\
    \ - A very simple layout that:\n\n*   Divides the container into five regions:\
    \ east, south, west, north, and center.\n\n*   Takes maximum 5 components only,\
    \ one per region.\n\n*   Resizes each component to match the size of its region.\n\
    \n*   Acts as the default layout in a container.\n\n*   Resizes each region when\
    \ the container is resized.\n\nHere is an example program I wrote to test the\
    \ BorderLayout:"
