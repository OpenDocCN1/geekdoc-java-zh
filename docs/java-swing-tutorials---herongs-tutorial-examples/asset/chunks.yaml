    while he was learning Java Swing and AWT himself. Topics include Swing and AWT
    (Abstract Windows Toolkit) class library; graphical components: `JButton`, `JCheckbox`,
    `JComboBox`, `JFrame`, `JLabel`, `JRadioButton`, `JTextField`; frame layouts;
    menus; dialog boxes; editor pane; Unicode and Chinese. Updated in 2022 (Version
