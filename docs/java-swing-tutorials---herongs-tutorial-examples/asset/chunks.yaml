- fmt: "\nThe picture below shows you how the JDK 15 Installation Screen looks like:\n\
    \n![](Images/image00128.jpeg)\n\n# JDK 12 Installation Screen\n\nTo test the installation,\
    \ open a command window to try the `java` command. If you are getting the following\
    \ output, your installation is good:\n\n```\n herong> java -version \n\njava version\
    \ \"15\" 2020-09-15\nJava(TM) SE Runtime Environment (build 15+36-1562)\nJava\
    \ HotSpot(TM) 64-Bit Server VM (build 15+36-1562, mixed mode, sharing)\n```\n\n\
    [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JDK\
    \ (Java Development Kit)](#part0003.xhtml)\n\n## Writing My First Java Program\n\
    \nThis section provides a tutorial example on how to write, compile, and execute\
    \ the first Java program with JDK 1.8.0.\n\nWhen JDK is installed on your machine,\
    \ it provides two commands for you to compile and run Java programs.\n\n- `javac\
    \ class_name.java` - Compiles a Java program stored a file named with the program\
    \ class name.\n- `java -classpath . class_name` - Runs a compiled Java program.\
    \ `-classpath .` specifies the current directory as the class path.\n\nLet's try\
    \ these commands with a very simple Java program. Use NotePad to enter the following\
    \ Java program into a file called `Hello.java`:\n\n```\n class Hello {\n   public\
    \ static void main(String[] a) {\n      System.out.println(\"Hello world!\");\
    \ \n   }\n}\n```\n\nThen compile this program in a command window with the `javac`\
    \ command:\n\n```\n herong> javac Hello.java\n```\n\nTo execute the program, use\
    \ the `java` command:\n\n```\n herong> java Hello\nHello world!\n```\n\nCongratulations,\
    \ you have successfully entered, compiled and executed your first Java program.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JDK\
    \ (Java Development Kit)](#part0003.xhtml)\n\n## Adding JDK \"bin\" Directory\
    \ to Path Setting\n\nThis section provides a tutorial on how to add JDK 'bin'\
    \ directory to the 'path' system environment variable.\n\nIf you are using a Windows\
    \ computer and want to run Java compiler and JVM by typing their program file\
    \ name without the directory path name, you may need to update the \"path\" environment\
    \ variable on your Windows computer:\n\n- Open \"Control Panel > System and Security\
    \ > System\".\n- Click \"Advanced system settings\".\n- Click \"Environment Variables\"\
    .\n- Select \"System variables > Path\" and click \"Edit\".\n- Add `C:\\Progra~1\\\
    java\\jdk-17.0.1\\bin;` to the beginning of the current path list.\n- Click \"\
    OK\" to save the change.\n\nThen I ran the `echo %path%` command in a new command\
    \ window to confirm the change:\n\n```\n herong> echo %path%\n\n   C:\\Progra~1\\\
    java\\jdk-17.0.1\\bin;\n   C:\\WINDOWS\\system32;C:\\WINDOWS;\n   ...\n```\n\n\
    Now I should be able to run Java commands without the directory path name:\n\n\
    ```\n herong> java -version\njava version \"17.0.1\" 2021-10-19 LTS\n\nherong>\
    \ javac hello.java\n\nherong> java Hello\nHello world!\n```\n\nNow I am ready\
    \ to play with Java Swing functionalities included in Oracle JDK package!\n\n\
    ![](Images/image00129.jpeg)\n\n### Setting java_home\n\nYou can also set a new\
    \ environment variable called `java_home` to avoid typing the full path name to\
    \ access Java tool program files:\n\n```\n herong> set java_home=C:\\Progra~1\\\
    java\\jdk-17.0.1\n\nherong> %java_home%\\bin\\java -version\njava version \"17.0.1\"\
    \ 2021-10-19 LTS\n```\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JDK (Java Development Kit)](#part0003.xhtml)\n\n## JDK Documentation Installation\n\
    \nThis section describes how to install JDK Documentation on your own machine.\n\
    \nTo learn JDK more effectively, you definitely need to have a copy of the JDK\
    \ Documentation installed on your own machine. JDK Documentation provides you\
    \ detailed information of all classes and methods used in JDK. Here is what I\
    \ did to download and install JDK 17 Documentation on my local machine.\n\n- Open\
    \ the Java download home page with this URL: `https://www.oracle.com/java/technologies/downloads/`.\n\
    - Click the \"Documentation Download\" button near the bottom of the page. You\
    \ will see \"Java SE Development Kit 17 Documentation\" page showing up.\n- Click\
    \ the hyper link of `jdk-17.0.1_doc-all.zip`.\n- Save the download file `jdk-17.0.1_doc-all.zip`\
    \ to a temporary directory.\n- Double-click on `jdk-17.0.1_doc-all.zip` to extract\
    \ all files to `C:\\Program Files\\Java\\jdk-17.0.1 directory`.\n\nTo verify the\
    \ installation, open the `C:\\Program Files\\Java\\jdk-17.0.1\\docs\\index.html`\
    \ with a Web browser.\n\nThe JDK documentation provides you detailed information\
    \ of all classes and methods used in JDK. The Swing documentation provides the\
    \ `java.logging` module.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Introduction of Swing Package](#part009.xhtml)\n\n### What Is Swing\n\nThis\
    \ section describes what is Swing - a Java package that implements a set of components\
    \ for building graphical interfaces (GUIs) and adding rich functionality and interactivity\
    \ to Java applications.\n\n**What Is Swing?** Swing is a Java package, `javax.swing`,\
    \ provided in J2SDK (Java 2 Software Kit). It provides many enhancements to the\
    \ existing graphics package, AWT (Abstract Windows Toolkit) package, `java.awt`.\n\
    \n`javax.swing` and `java.awt` together offer a complete API (Application Interface)\
    \ for Java applications to operate graphical devices and create GUI (Graphical\
    \ Interfaces).\n\nThe JDK documentation offers another description of Swing: \"\
    The Swing classes (part of the Java Foundation Classes (JFC) software) implement\
    \ a set of components for building graphical interfaces (GUIs) and adding rich\
    \ functionality and interactivity to Java applications. The Swing components are\
    \ implemented entirely in the Java programming language. The pluggable look and\
    \ feel lets you create GUIs that can either look the same across platforms or\
    \ can assume the look and feel of the OS platform (such as Microsoft Windows,\
    \ Solaris or Linux).\"\n\nThe Swing package contains following subpackages:\n\n\
    - `javax.swing` - Provides a set of \"lightweight\" (written in Java with no native\
    \ code) components that, to the maximum degree possible, work the same on all\
    \ platforms.\n- `javax.swing.border` - Provides classes and interfaces for drawing\
    \ specialized borders around a Swing component.\n- `javax.swing.colorchooser`\
    \ - Contains classes and interfaces used by the `JColorChooser` component.\n-\
    \ `javax.swing.event` - Provides support for events fired by Swing components.\n\
    - `javax.swing.filechooser` - Contains classes and interfaces used by the `JFileChooser`\
    \ component.\n- `javax.swing.plaf` - Provides one interface and many abstract\
    \ classes that Swing uses to provide its pluggable look and feel capabilities.\n\
    - `javax.swing.plaf.basic` - Provides user interface objects built according to\
    \ the Basic look and feel.\n- `javax.swing.plaf.metal` - Provides user interface\
    \ objects built according to the Java look and feel (once codenamed Metal), which\
    \ is the default look and feel.\n- `javax.swing.plaf.multi` - Provides user interface\
    \ objects that combine two or more look and feels.\n- `javax.swing.plaf.synth`\
    \ - Provides user interface objects for a skinnable look and feel in which all\
    \ painting is delegated.\n"
