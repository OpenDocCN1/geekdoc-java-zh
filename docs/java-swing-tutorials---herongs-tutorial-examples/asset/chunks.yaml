    \ Unicode 字符。\n\n本章列出的示例程序已 Windows 和 macOS 电脑上通过了 JDK 1.3.1 到 JDK 17 的测试。\n\n\
    Java Swing 教程 - Herong 的教程示例\n\n∟JLabel - Swing 标签类\n\n### 使用 javax.swing.JLabel\
    \ 类创建标签\n\n本节内容提供了一个教程示例，演示如何使用 `javax.swing.JLabel` 类创建一个标签。\n\n**问题**：我想创建一个带有文本字符串的标签。\n\
    \n**解决方案**：这很简单，只需实例化 `javax.swing.JLabel` 对象并将其添加到任何容器中。这里有一个示例程序向你展示如何操作：\n\n\
    ```java\n /* JLabelHello.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
    \ Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class\
    \ JLabelHello {\n   public static void main(String[] a) {\n      JFrame f = new\
    \ JFrame();\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      JLabel\
    \ l = new JLabel(\"Hello world!\");\n      f.getContentPane().add(l);\n      f.pack();\
    \      \n      f.setVisible(true);\n   }\n}\n```\n\n运行此示例，你将得到：\n\n![](img/image00139.jpeg)\n\
    \nJLabel 测试\n\n注意：`pack()` 方法会导致窗口调整大小以适应其子组件的优选布局。\n\nJava Swing 教程 - Herong\
    \ 的教程示例\n\n∟JLabel - Swing 标签类\n\n### 使用中文字符创建标签\n\n本节内容提供了一个教程示例，演示如何使用 `javax.swing.JLabel`\
    \ 类创建一个带有中文字符的标签。\n\n**问题**：我想创建一个带有中文字符的标签。\n\n**解决方案**：并不难。请看以下示例程序：\n\n```java\n\
    \ /* JLabelChinese.java\n * Copyright (c) 2014-2018 HerongYang.com All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JLabelChinese\
    \ {\n   public static void main(String[] a) {\n      JLabel l = new JLabel();\n\
    \      l.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n      l.setText(\"Hello\
    \ world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\");\n      JFrame f = new JFrame();\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.getContentPane().add(l);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n}\n```\n\n运行此示例，你将得到：\n\n![](img/image00140.jpeg)\n\
    \n中文 JLabel 测试\n\nJava Swing 教程 - Herong 的教程示例\n\n∟ - Swing 按钮类\n\n本章提供了关于 `JButton`\
    \ 类的教程笔记和示例代码。主题包括使用 `JButton` 类创建按钮组件；带图标的按钮；在组件级和框架级添加按钮点击器。\n\n> 使用 JButton\
    \ 类创建按钮\n\n> 创建带图标的按钮\n\n> 组件级按钮处理器\n\n> 框架级按钮处理器\n\n> 框架级鼠标点击处理器\n\n结论：\n\n*\
    \ `JButton` 类表示一个 UI 按钮。\n* 按钮可以使用文本标签或图标来创建。\n* `ActionListener` 接口可以处理按钮的动作。\n\
    * `MouseAdapter` 接口可以处理按钮的鼠标点击。\n\n本章列出的程序已在 Windows 和 macOS 电脑上通过测试。\n\nJava\
    \ Swing 教程 - Herong 的教程示例\n\n∟JButton - Swing 按钮类](#part0030.xhtml)\n\n### 使用\
    \ javax.swing.JButton 创建按钮\n\n本节内容提供了一个教程示例，演示如何使用 `javax.swing.JButton` 类创建一个按钮。\n\
    \n使用 `javax.swing.JButton` 类创建按钮非常简单。这里有一个示例程序：\n\n```java\n /* JButtonOk.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport javax.swing.*;\npublic class JButtonOk {\n   public static\
    \ void main(String[] a) {\n      JFrame f = new JFrame(\"My First Button\");\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      JButton b = new\
    \ JButton(\"OK\");\n      f.getContentPane().add(b);\n      f.pack();      \n\
    \      f.setVisible(true);\n   }\n}\n```\n\n运行此示例，你将得到：\n\n![](img/image00141.jpeg)\n\
    \n注意：点击 OK 按钮不会触发任何动作，因为没有在按钮上添加事件监听器。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JButton\
    \ - Swing 按钮类\n\n### 使用 javax.swing.JButton 创建图标按钮\n\n本节内容提供了一个教程示例，演示如何使用 `JButton`\
    \ 类和 `ImageIcon` 类创建一个图标按钮。\n\n你也可以使用自己的图片创建按钮。这里有一个示例程序：\n\n```java\n /* JButtonIcon.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport javax.swing.*;\npublic class JButtonIcon {\n   public static\
    \ void main(String[] a) {\n      JFrame f = new JFrame(\"My Icon Button\");\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      JButton b = new\
    \ JButton(new ImageIcon(\"java.gif\"));\n      f.getContentPane().add(b);\n  \
    \    f.pack();      \n      f.setVisible(true);\n   }\n}\n```\n\n运行此示例，你将得到：\n\
    \n![](img/image00142.jpeg)\n\nJLabel 图标按钮\n\n"
- fmt: "\nThis section provides a tutorial example on how to create a button to handle\
    \ actions by adding the `ActionListener` interface to the button component.\n\n\
    One way to handle button actions is to add an action listener to the button object.\
    \ An action listener is an object of any class that implements the `ActionListener`\
    \ interface.\n\nThe following program shows you how to extend the `JButton` class\
    \ to implement the `ActionListener` class:\n\n```java\n /* JButtonAction1.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\npublic class JButtonAction1\
    \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame(\"\
    My Switch Button\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      JButton b = new MyButton();\n      f.getContentPane().add(b);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   private static class MyButton extends JButton\
    \ \n      implements ActionListener {\n       String text = \"On\";\n       public\
    \ MyButton() {\n          super();\n          setText(text);\n          addActionListener(this);\n\
    \       }\n       public void actionPerformed(ActionEvent e) {\n          if (text.equals(\"\
    On\")) text = \"Off\";\n          else text = \"On\"; \n          setText(text);\n\
    \       }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00143.jpeg)\n\
    \n### Button Action Handler at Component\n\nThe button works well. If you click\
    \ the button, the button label text will change from \"On\" to \"Off\"; and from\
    \ \"Off\" to \"On\", if you click it again.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[JButton - Swing Button Class](#part0030.xhtml)\n\
    \n### Button Action Handler at the Frame Level\n\nThis section provides a tutorial\
    \ example on how to create a button to handle actions by adding the `ActionListener`\
    \ interface to the frame that contains the button component.\n\nIn the previous\
    \ section, we extended the button to handle its own action. That works fine, if\
    \ the action only requires modifying the behavior of the same button.\n\nBut if\
    \ the action requires modifying the behavior of other components, you need to\
    \ implement the action listener as a higher level. The following program shows\
    \ you how to use the action handler to modify the text of a label component:\n\
    \n```java\n /* JButtonAction2.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JButtonAction2 implements ActionListener {\n  \
    \ JButton myButton = null;\n   JLabel myLabel = null;\n   String text = null;\n\
    \   public static void main(String[] a) {\n      JButtonAction2 myTest = new JButtonAction2();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      JFrame\
    \ f = new JFrame(\"My Switch Button\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container c = f.getContentPane();\n      c.setLayout(new GridLayout(2,1));\n\
    \      text = \"On\";\n      myButton = new JButton(text);\n      myButton.addActionListener(this);\n\
    \      c.add(myButton);\n      myLabel = new JLabel(text,SwingConstants.CENTER);\n\
    \      c.add(myLabel);\n      f.pack();\n      f.setVisible(true);\n   }\n   public\
    \ void actionPerformed(ActionEvent e) {\n      if (text.equals(\"On\")) text =\
    \ \"Off\";\n      else text = \"On\"; \n      myButton.setText(text);\n      myLabel.setText(text);\n\
    \   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00144.jpeg)\n\
    \n### Button Action Handler at Frame\n\nThe button works nicely. If you click\
    \ the button, the button label text will change from \"On\" to \"Off\", and the\
    \ text of the label component will also change.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[JButton - Swing Button Class](#part0030.xhtml)\n\
    \n### Mouse Click Handler at the Frame Level\n\nThis section provides a tutorial\
    \ example on how to create a button to handle actions by adding the `MouseAdapter`\
    \ interface to the frame that contains the button component.\n\nOf course, using\
    \ `ActionListeners` is not the only way to handle user clicks on buttons. You\
    \ can also use `MouseListeners` to handle user clicks. Here is an example program:\n\
    \n```java\n /* JButtonAction3.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JButtonAction3 extends MouseAdapter {\n   JButton\
    \ myButton = null;\n   JLabel myLabel = null;\n   String text = null;\n   public\
    \ static void main(String[] a) {\n      JButtonAction3 myTest = new JButtonAction3();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      JFrame\
    \ f = new JFrame(\"My Switch Button\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container c = f.getContentPane();\n      c.setLayout(new GridLayout(2,1));\n\
    \      text = \"On\";\n      myButton = new JButton(text);\n      myButton.addMouseListener(this);\n\
    \      c.add(myButton);\n      myLabel = new JLabel(text,SwingConstants.CENTER);\n\
    \      c.add(myLabel);\n      f.pack();\n      f.setVisible(true);\n   }\n   public\
    \ void mouseClicked(MouseEvent e) {\n      if (text.equals(\"On\")) text = \"\
    Off\";\n      else text = \"On\"; \n      myButton.setText(text);\n      myLabel.setText(text);\n\
    \   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00145.jpeg)\n\
    \n### Button with Mouse Adapter\n\nThe button works nicely. If you click the button,\
    \ the button label text will change from \"On\" to \"Off\", and the text of the\
    \ label component will also change.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n### JCheckBox - Swing Check Box Class\n\nThis\
    \ chapter provides tutorial notes and example codes on `JCheckBox` class. Topics\
    \ include description of the `javax.swing.JCheckBox` class and its methods; example\
    \ program of creating check boxes and event listeners; example program of identify\
    \ selected check boxes.\n\n- [`javax.swing.JCheckBox and Related Methods](#part0037.xhtml)\n\
    - [`ActionListener, ChangeListener and ItemListener](#part0038.xhtml)\n- [`isSelected()\
    \ - Getting State of Check Box](#part0039.xhtml)\n\n#### Conclusions:\n\n- `javax.swing.JCheckBox`\
    \ class represents a check box.\n- `ActionListener`, `ChangeListener`, or `ItemListener`\
    \ interface can be used handle actions on a check box.\n- `isSelected()` method\
    \ can be used to detect the state of a check box.\n\nSample programs listed in\
    \ this chapter have been tested with JDK 1.3.1 to 17 on Windows and macOS computers.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JCheckBox\
    \ - Swing Check Box Class](#part0036.xhtml)\n\n### javax.swing.JCheckBox and Related\
    \ Methods\n\nThis section describes the `javax.swing.JCheckBox` class, and its\
    \ commonly used methods.\n\n`javax.swing.JCheckBox` - A Swing class representing\
    \ a UI check box. Some interesting methods are:\n\n- `JCheckBox(String)` - Constructor\
    \ to create a check box with the specified string displayed next to the check\
    \ box. The check box is unchecked by default.\n- `addActionListener(ActionListener)`\
    \ - Method to add an action listener to this check box to handle action events.\
    \ A mouse click on this check box will trigger one action event.\n- `addChangeListener(ChangeListener)`\
    \ - Method to add a change listener to this check box to handle change events.\
    \ A mouse click on this check box will trigger many change events.\n- `addItemListener(ItemListener)`\
    \ - Method to add an item listener to this check box to handle item events. A\
    \ mouse click on this check box will trigger one item event.\n- `setActionCommand(String)`\
    \ - Method to set an action command string to this check box.\n- `isSelected()`\
    \ - Method to return the state of the check box.\n\n### ActionListener, ChangeListener\
    \ and ItemListener\n\nThis section provides a tutorial example on how to use `ActionListener`,\
    \ `ChangeListener`, and `ItemListener` interfaces to handle different types of\
    \ events generated on check boxes.\n"
