    ```\n\n### 关于此教程示例的有趣说明：\n\n*  Yes 按钮返回的代码是 `JOptionPane.OK_OPTION`，而不是 `JOptionPane.YES_OPTION`。我不知道为什么。\n\
    \nJava Swing 教程 - Herong 的教程示例\n\n∟选项对话框\n\n∟`showInputDialog()` - 显示输入对话框\n\n\
    本节提供了一个教程示例，演示了如何使用静态方法 `showInputDialog()` 来创建并显示输入对话框，以获取用户的文本字符串输入。\n\n你可以使用\
    \ `javax.swing.JOptionPane` 类创建并显示的第三种类型的对话框是输入对话框。可以通过静态方法实现：`answer = showInputDialog(frame,\
    \ message, title, type)`，其中：\n\n* `\"frame\"` 是用作父帧的帧对象。\n* `\"message\"` 是要显示在对话框上的消息字符串。\n\
    * `\"title\"` 是用作对话框标题的字符串。\n* `\"type\"` 是一个表示特定消息对话框类型的整数代码。有效的类型代码被定义为 `JOptionPane`\
    \ 类中的常量：`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`ERROR_MESSAGE` 和 `PLAIN_MESSAGE`。\n\
    * `\"answer\"` 是用户在输入对话框上输入的返回字符串。如果没有输入内容，则将返回 `null`。\n\n这里我编写的用于测试 `showInputDialog()`\
    \ 方法的示例程序：\n\n```\n /* JOptionPaneInputDialog.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\nimport javax.swing.event.*;\npublic class JOptionPaneInputDialog\
    \ implements ActionListener {\n   JFrame myFrame = null;\n   public static void\
    \ main(String[] a) {\n      (new JOptionPaneInputDialog()).test();\n   }\n   private\
    \ void test() {\n      myFrame = new JFrame(\"showInputDialog() Test\");\n   \
    \   myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container myPane\
    \ = myFrame.getContentPane();\n      JButton myButton = new JButton(\"Show\");\n\
    \      myButton.addActionListener(this);\n      myPane.add(myButton);\n      myFrame.pack();\n\
    \      myFrame.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent\
    \ e) {\n      int messageType = JOptionPane.INFORMATION_MESSAGE;\n      String\
    \ answer = JOptionPane.showInputDialog(myFrame, \n         \"What's you name?\"\
    , \n         \"Input Dialog Box\", messageType);\n      System.out.println(\"\
    Answer: \"+answer);\n   }\n}\n```\n\n如果你运行此示例并点击 Show 按钮，你将看到一个如下所示的输入对话框：\n\n\
    ![](img/image00181.jpeg)\n\n### 确认对话框输入\n\n在输入对话框的输入字段中输入 \"Herong Yang\" 并点击\
    \ OK。用 Cancel 按钮和关闭对话框图标重复测试。你将看到 Java 控制台窗口打印出一些消息：\n\n```\n Answer: Herong Yang\n\
    Answer: null\nAnswer: null\n```\n"
- fmt: "\nSelect \"Perl\" on the option dialog box. Repeat the test with the \"Java\"\
    \ option button and the close dialog box icon. You will see some messages printed\
    \ on the Java console window:\n\n```\nAnswer: 4\nAnswer: 0\nAnswer: -1\n```\n\n\
    Interesting notes about this tutorial example:\n\n*   If closes the option dialog\
    \ box, `showOptionDialog()` returns `JOptionPane.CLOSED_OPTION`, which is -1.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Option\
    \ Dialog Boxes](#part0079.xhtml)\n\n### showInternalDialog() - Displaying Internal\
    \ Dialog Boxes\n\nThis section provides a tutorial example on how to use the static\
    \ methods, `showInternal*Dialog()`, to create and display internal dialog boxes\
    \ inside a parent container.\n\nDialog boxes can also be created and displayed\
    \ inside a panel. To do this, you need to call the \"Internal\" version of `show*Dialog()`\
    \ methods:\n\n*   `showInternalMessageDialog()` - Method to create and display\
    \ an internal message dialog box to present regular, warning or error messages.\n\
    *   `showInternalConfirmDialog()` - Method to create and display an internal confirmation\
    \ dialog box with yes, no and cancel buttons.\n*   `showInternalInputDialog()`\
    \ - Method to create and display an internal input dialog box to prompt for some\
    \ input.\n*   `showInternalOptionDialog()` - Method to create and display an internal\
    \ generic dialog box to present message, take a confirmation, or take some input.\n\
    \nNote that you can not use a `JFrame` object directly as the \"parent\" for internal\
    \ dialog boxes. If you do, you will get a runtime exception like this:\n\n```\n\
    Exception in thread \"AWT-EventQueue-0\" java.lang.RuntimeException: \nJOptionPane:\
    \ parentComponent does not have a valid parent\n   at javax.swing.JOptionPane.createInternalFrame(\n\
    \      JOptionPane.java:1486)\n   ...\n```\n\nThe \"parent\" input parameter should\
    \ be the content pane, or other containers.\n\nHere is an example program I wrote\
    \ to test the `showInternalOptionDialog()` method:\n\n```\n /* JOptionPaneInternalOptionDialog.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
    public class JOptionPaneInternalOptionDialog \n   implements ActionListener {\n\
    \   JFrame myFrame = null;\n   public static void main(String[] a) {\n      (new\
    \ JOptionPaneInternalOptionDialog()).test();\n   }\n   private void test() {\n\
    \      myFrame = new JFrame(\"showInternalOptionDialog() Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      myFrame.setSize(300,200);      \n      Container myPane = myFrame.getContentPane();\n\
    \      JButton myButton = new JButton(\"Show\");\n      myButton.addActionListener(this);\n\
    \      myPane.add(myButton);\n      myFrame.setVisible(true);\n   }\n   public\
    \ void actionPerformed(ActionEvent e) {\n      int messageType = JOptionPane.QUESTION_MESSAGE;\n\
    \      String[] options = {\"Java\", \"C++\", \"VB\", \"PHP\", \"Perl\"};\n  \
    \    int code = JOptionPane.showInternalOptionDialog(\n         myFrame.getContentPane(),\
    \ \n         \"What language do you prefer?\", \n         \"Option Dialog Box\"\
    , 0, messageType, \n         null, options, \"PHP\");\n      System.out.println(\"\
    Answer: \"+code);\n   }\n}\n```\n\nIf you run this example, and click the Show\
    \ button, you will see an input dialog box showing up like this:\n\n![](Images/image00183.jpeg)\n\
    \nInternal Dialog Box\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Option Dialog Boxes](#part0079.xhtml)\n\n### createDialog() - Creating Dialog\
    \ Boxes Directly\n\nThis section provides a tutorial example on how to use the\
    \ static method, `showInputDialog()`, to create and display input dialog boxes\
    \ to take text string input from the user.\n\nIf you don't want to use `show*Dialog()`\
    \ methods to create and display dialog boxes automatically, you can use the `createDialog()`\
    \ method to create dialog boxes manually.\n\n1.  Use `myPane = new JOptionPane()`\
    \ to create an empty option pane object, which represents content pane of the\
    \ dialog box.\n2.  Use `myPane.setMessageType(type)` to set the message type on\
    \ the option pane with a type code, `INFORMATION_MESSAGE`, `WARNING_MESSAGE`,\
    \ `ERROR_MESSAGE`, `PLAIN_MESSAGE`, or `QUESTION_MESSAGE`.\n3.  Use `myPane.setMessage(message)`\
    \ to set the message text on the option pane with a string.\n4.  Use `myPane.setOptionType(type)`\
    \ to set the option type on the option pane with an option code, `YES_NO_OPTION`,\
    \ `YES_NO_CANCEL_OPTION`, or `OK_CANCEL_OPTION`. This is not needed if you are\
    \ setting your own options.\n5.  Use `myPane.setOptions(options)` to set options\
    \ on the option pane with a string array. This will override options created by\
    \ the option type.\n6.  Use `myPane.setInitialValue(default)` to set the default\
    \ option on the option pane with a string.\n7.  Use `myDialog = myPane.createDialog(parent,\
    \ title)` to create the final dialog box with a parent frame and a title string.\n\
    8.  Use `myDialog.setVisible(true)` to set the final dialog box visible.\n9. \
    \ Use `answer = myPane.getValue()` to get the answer selected/entered by the user\
    \ on the dialog box.\n\nHere is an example program I wrote to test the `createDialog()`\
    \ method:\n\n```\n /* JOptionPaneCreateDialog.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\nimport javax.swing.event.*;\npublic class JOptionPaneCreateDialog\
    \ \n   implements ActionListener {\n   JFrame myFrame = null;\n   public static\
    \ void main(String[] a) {\n      (new JOptionPaneCreateDialog()).test();\n   }\n\
    \   private void test() {\n      myFrame = new JFrame(\"createDialog() Test\"\
    );\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container\
    \ myPane = myFrame.getContentPane();\n      JButton myButton = new JButton(\"\
    Create\");\n      myButton.addActionListener(this);\n      myPane.add(myButton);\n\
    \      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   public void\
    \ actionPerformed(ActionEvent e) {\n      String[] options = {\"Java\", \"C++\"\
    , \"VB\", \"PHP\", \"Perl\"};\n      JOptionPane myPane = new JOptionPane();\n\
    \      myPane.setMessageType(JOptionPane.QUESTION_MESSAGE);\n      myPane.setMessage(\"\
    What language do you prefer?\");\n      myPane.setOptions(options);\n      myPane.setInitialValue(\"\
    PHP\");\n      JDialog myDialog = myPane.createDialog(myFrame, \"Option Dialog\
    \ Box\");\n      myDialog.setVisible(true);\n      Object answer = myPane.getValue();\n\
    \      System.out.println(\"Answer: \"+answer);\n   }\n}\n```\n\nIf you run this\
    \ example, and click the Create button, you will see an input dialog box showing\
    \ up like this:\n\n![](Images/image00184.jpeg)\n\nSelect \"Perl\" on the option\
    \ dialog box. Repeat the test with the \"Java\" option button and the close dialog\
    \ box icon. You will see some messages printed on the Java console window:\n\n\
    ```\nAnswer: Perl\nAnswer: Java\nAnswer: null\n```\n\nInteresting notes about\
    \ this tutorial example:\n\n*   The dialog box created in this example is identical\
    \ to the one created in the `showOptionDialog()` method in the `JOptionPaneOptionDialog.java`\
    \ example.\n*   But `showOptionDialog()` method returns integer indexes of the\
    \ option array. But `myPane.getValue()` returns string elements of the option\
    \ array.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### JEditorPane - The Editor Pane Class\n\nThis chapter provides tutorial notes\
    \ and example codes on the editor pane class. Topics include a simple text editor\
    \ pane; saving text from the editor pane to a file; editing HTML content and Chinese\
    \ characters in editor pane; using file chooser dialog boxes.\n\n> [Creating a\
    \ Simple Plain Text Editor Pane](#part0089.xhtml)\n\n> \n\n> [Saving Text from\
    \ an Editor Pane](#part0090.xhtml)\n\n> \n> [Editing HTML in an Editor Pane](#part0091.xhtml)\n\
    \n> \n> [Editing Unicode Characters in an Editor Pane](#part0092.xhtml)\n\n> \n\
    > [javax.swing.JFileChooser - File Chooser Dialog Box](#part0093.xhtml)\n\nConclusions:\n"
