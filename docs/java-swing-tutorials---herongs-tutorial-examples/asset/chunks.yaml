    \ clicked: Close\nItem clicked: Red\nItem clicked: Green\nItem clicked: Blue\n\
    ```\n\n### 关于此教程示例的一些有趣说明：\n\n* `private class MyMenuItem extends MenuItem implements\
    \ ActionListener` 声明用于创建一个内部类 `MyMenuItem`，该类继承自 `MenuItem`，实现 `ActionListener`，并将自身添加以处理动作事件。\n\
    \n* `addActionListener(this);` 语句用于将我的内部类 `MyMenuItem` 自身添加以处理动作事件。\n\n* `e.getActionCommand()`\
    \ 表达式用于获取动作命令字符串，在此情况下为菜单项的按钮文本。\n\nJava Swing 教程 - Herong 的教程示例\n\n ∟ 与桌面系统的集成\n\
    \n本章提供了关于与本地桌面系统集成的教程笔记和示例代码。主题包括 `javax.awt.Desktop` 类及其方法的描述；启动默认 浏览器、电子邮件程序和本地桌面系统文件编辑器的示例程序。\n\
    \n> javax.awt.Desktop 及相关方法\n\n> browse() - 启动默认 浏览器\n\n> mail() - 启动默认电子邮件程序\n\
    \n> edit() - 启动给定文件的默认编辑器\n\n## 结论：\n\n* `javax.awt.Desktop` 类代表本地桌面系统。\n* `getDesktop()`\
    \ 方法可以用于获取当前本地桌面系统的实例。\n* `browse(URI)` 方法可以用于使用给定的 `URI` 启动默认 浏览器。\n* `mail(URI)`\
    \ 方法可以用于使用给定的 `mailto` `URI` 启动默认电子邮件程序。\n* `edit(File)` 方法可以用于启动给定文件的默认编辑器。\n\
    \n本章列出的示例程序已通过 JDK 1.6 到 JDK 12 的测试。\n\nJava Swing 教程 - Herong 的教程示例\n\n ∟与桌面系统的集成\n\
    \n ∟javax.awt.Desktop 及相关方法\n\n本节描述了 `javax.awt.Desktop` 类及其常用的方法。\n\n`java.awt.Desktop`\
    \ - 一个 AWT 类，有助于将 Java GUI 应用程序与操作系统的桌面功能集成。它提供了以下有趣的方法：\n\n* `getDesktop()` -\
    \ 返回代表操作系统当前桌面的 `Desktop` 对象的方法。\n* `browse(URI)` - 使用给定的 `URI` 启动默认 浏览器的方法。\n\
    * `mail(URI)` - 使用给定的 `mailto` `URI` 启动默认电子邮件程序的方法。\n* `edit(File)` - 使用给定文件启动默认编辑器的方法。\n\
    \nJava Swing 教程 - Herong 的教程示例\n\n ∟与桌面系统的集成](#part0115.xhtml)\n\n ∟javax.awt.Desktop\
    \ 及相关方法\n\n本节提供了如何使用 `Desktop.browse()` 方法在桌面启动启动默认浏览器的教程示例。要启动默认浏览器，你可以获取 `Desktop`\
    \ 对象。这是一个示例程序：\n\n```java\n /* DesktopBrowser.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import java.swing.*;\nimport java.swing.event.*;\nimport java.net.URI;\npublic\
    \ class DesktopBrowser {\n   public static void main(String[] a) {\n      try\
    \ {\n         URI uri = new URI(\"https://www.herongyang.com\");\n         Desktop\
    \ desktop = Desktop.getDesktop();\n         if (desktop != null) {\n         \
    \   desktop.browse(uri);\n         }\n      } catch (Exception e) {\n        e.printStackTrace();\n\
    \      }\n   }\n}\n```\n\n如果你运行这个程序，你将看到默认浏览器启动。在我的 Windows 10 电脑上，我看到 Edge 启动了。\n\
    \n![](img/image00206.jpeg)\n\n# 启动浏览器\n\nJava Swing 教程 - Herong 的教程示例\n\n ∟与桌面系统的集成\n\
    \n ∟mail() - 默认电子邮件程序\n\n本节提供了如何使用 `Desktop.mail()` 方法在桌面启动默认电子邮件程序的教程示例。要启动默认电子邮件程序，你可以获取\
    \ `Desktop` 对象。这是一个示例程序：\n\n```java\n /* DesktopSendEmail.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport\
    \ java.awt.event.*;\nimport java.swing.*;\nimport java.swing.event.*;\nimport\
    \ java.net.URI;\npublic class DesktopSendEmail {\n   public static void main(String[]\
    \ a) {\n      try {\n         String address = \"herong_yang@yahoo.com\";\n  \
    \       String subject = \"Java%20Swing%20Tutorials\";\n         String body =\
    \ \"I%20like%20your%20tutorial%20book!\";\n         URI uri = new URI(\"mailto:\"\
    +address+\"?subject=\"+subject\n        +\"&body=\"+body);\n         Desktop desktop\
    \ = Desktop.getDesktop();\n         if (desktop != null) {\n            desktop.mail(uri);\n\
    \         }\n      } catch (Exception e) {\n        e.printStackTrace();\n   \
    \   }\n   }\n}\n```\n\n注意我在 `mailto` `URI` 字符串中对电子邮件地址、主题和消息主体进行了编码。如果你运行这个程序，你将看到默认电子邮件程序带有给定的电子邮件内容启动。在我的\
    \ Windows 10 电脑上，我看到 Outlook 应用启动了。\n\n![](img/image00207.jpeg)\n\n# 启动电子邮件程序在桌面\n\
    \n"
- fmt: "\n# edit() - Launch Default Editor for Given File\n\nThis section provides\
    \ a tutorial example on how to use `Desktop.edit()` method to launch the default\
    \ editor for the given file based on the file type.\n\nIf you have a file and\
    \ want to launch its associated default editor on the current desktop of the operating\
    \ system, you can get the default `Desktop` object and call its `edit()` method.\
    \ Here is a sample program:\n\n```java\n /* DesktopEditFile.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
    import java.io.File;\npublic class DesktopEditFile {\n   public static void main(String[]\
    \ a) {\n      try {\n     File file = new File(\"Swing.jpg\");\n         Desktop\
    \ desktop = Desktop.getDesktop();\n         if (desktop != null) desktop.edit(file);\n\
    \      } catch (Exception e) {\n        e.printStackTrace();\n      }\n   }\n\
    }\n```\n\nMake sure you have image file called `Swing.jpg` in the working directory.\
    \ Then run this program, you will see the default image editor program is started\
    \ with the given image file. On my Windows 10 computer, I am getting the \"Paint\"\
    \ app launched.\n\n![](Images/image00208.jpeg)\n\n## Launch File Editor on Desktop\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n# Archived\
    \ Tutorials\n\nThis chapter contains some outdated tutorial notes and example\
    \ codes from previous versions of this book.\n\n> [Archived: Downloading and Installing\
    \ JDK 12](#part0121.xhtml)\n\n> [Archived: Downloading and Installing JDK 10](#part0122.xhtml)\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Archived\
    \ Tutorials](part0120.xhtml)\n\n## Archived: Downloading and Installing JDK 12\n\
    \nThis section describes how to download and install JDK 12 on a Windows system.\n\
    \nThe current version of JDK is `JDK 12`, which is also called Java SE (Standard\
    \ Edition) 12. Here is what I did to download and install JDK 12 on my Windows\
    \ machine.\n\n*   Open the Java SE Download page with this URL: [https://www.oracle.com/technetwork/java/javase/downloads/](https://www.oracle.com/technetwork/java/javase/downloads/).\n\
    *   Click the download button next to \"Java Platform (JDK) 12\". You will see\
    \ a new page with a list of different download files of JDK 12.\n*   Accept the\
    \ license agreement.\n*   Click the hyper link of `jdk-12.0.1_windows-x64_bin.exe`,\
    \ next to \"Windows 158.49 MB\".\n*   Save `jdk-12.0.1_windows-x64_bin.exe` to\
    \ a temporary directory.\n*   Double-click on `jdk-12.0.1_windows-x64_bin.exe`\
    \ to start the installation wizard.\n*   The installation wizard will guide you\
    \ to finish the installation.\n\nThe picture below shows you how the JDK 12 Installation\
    \ Screen looks like:\n\n![](Images/image00209.jpeg)\n\n### JDK 12 Installation\
    \ Screen\n\nTo test the installation, open a command window to try the `java`\
    \ command. If you are getting the following output, your installation is good:\n\
    \n```\nherong> \\progra~1\\java\\jdk-12.0.1\\bin\\java -version\n\njava version\
    \ \"12.0.1\" 2019-04-16\nJava(TM) SE Runtime Environment (build 12.0.1+12)\nJava\
    \ HotSpot(TM) 64-Bit Server VM (build 12.0.1+12, mixed mode, sharing)\n```\n\n\
    [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Archived\
    \ Tutorials](part0120.xhtml)\n\n## Archived: Downloading and Installing JDK 10\n\
    \nThis section describes how to download and install JDK 10 on a Windows system.\n\
    \nHere is what I did to download and install JDK 10 on my Windows machine.\n\n\
    *   Open the Java SE Download page with this URL: [http://www.oracle.com/technetwork/java/javase/downloads/](http://www.oracle.com/technetwork/java/javase/downloads/).\n\
    *   Click the download button next to \"Java Platform (JDK) 10\". You will see\
    \ a new page with a list of different download files of JDK 10.\n*   Accept the\
    \ license agreement.\n*   Click the hyper link of `jdk-10.0.1_windows-x64_bin.exe`,\
    \ next to \"Windows 390.19 MB\".\n*   Save `jdk-10.0.1_windows-x64_bin.exe` to\
    \ a temporary directory.\n*   Double-click on `jdk-10.0.1_windows-x64_bin.exe`\
    \ to start the installation wizard.\n*   The installation wizard will guide you\
    \ to finish the installation.\n\nTo test the installation, open a command window\
    \ to try the `java` command. If you are getting the following output, your installation\
    \ was ok:\n\n```\nherong> \\progra~1\\java\\jdk-10.0.1\\bin\\java -version\n\n\
    java version \"10.0.1\" 2018-04-17\nJava(TM) SE Runtime Environment 18.3 (build\
    \ 10.0.1+10)\nherong> java HotSpot(TM) 64-Bit Server VM 18.3 (build 10.0.1+10,\
    \ mixed mode)\n```\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n# References\n\nList of reference materials used in this book.\n\n*   *The Java\
    \ Tutorials Trail: Creating a GUI With JFC/Swing*, Oracle, [docs.oracle.com/javase/tutorial/uiswing/](https://docs.oracle.com/javase/tutorial/uiswing/)\n\
    *   *Java Swing tutorial*, Jan Bodnar, [zetcode.com/tutorials/javaswingtutorial/](http://zetcode.com/tutorials/javaswingtutorial/)\n\
    *   *Package javax.swing*, Oracle, [docs.oracle.com/en/java/javase/12/docs/api/java.desktop/module-summary.html](https://docs.oracle.com/en/java/javase/12/docs/api/java.desktop/module-summary.html)\n\
    *   *Java Swing Icon* (Website not available anymore), [http://www.jsrsoft.com](http://www.jsrsoft.com)\n\
    \n![The Front Cover](Images/cover00210.jpeg)\n"
  raw: "∟edit() - Launch Default Editor for Given File\n\nThis section provides a\
    \ tutorial example on how to use Desktop.edit() method to launch the default editor\
    \ for the given file based on the file type.\n\nIf you have a file and want to\
    \ launch its associated default editor on the current desktop of the operating\
    \ system, you can get the default Desktop object and call its edit() method. Here\
    \ is a sample program:\n\n```\n /* DesktopEditFile.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\nimport javax.swing.event.*;\nimport java.io.File;\npublic\
    \ class DesktopEditFile {\n   public static void main(String[] a) {\n      try\
    \ {\n     File file = new File(\"Swing.jpg\");\n         Desktop desktop = Desktop.getDesktop();\n\
    \         if (desktop != null) desktop.edit(file);\n      } catch (Exception e)\
    \ {\n        e.printStackTrace();\n      }\n   }\n}\n```\n\nMake sure you have\
    \ image file called Swing.jpg in the working directory. Then run this program,\
    \ you will see the default image editor program is started with the given image\
    \ file. On my Windows 10 computer, I am getting the \"Paint\" app launched.\n\n\
