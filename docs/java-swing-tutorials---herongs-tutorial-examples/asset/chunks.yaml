- fmt: "\n- `Launching thread`: The thread that creates a `SwingWorker` instance and\
    \ calls the `execute()` on the instance.\n- `Worker thread`: The thread that actually\
    \ performs the bask by executing the `doInBackground()` method.\n- `Dispatch thread`:\
    \ The thread that is used by the `Worker thread` to send out information.\n\n\
    To extending the `SwingWorker` class, you need to consider the following:\n\n\
    - Implementing the `doInBackground()` method to perform the actual task.\n- Implementing\
    \ the `done()` method, if you want to do something when the task is done.\n- Calling\
    \ the `get()` method on the `SwingWorker` instance, if you want to retrieve the\
    \ result returned by the `doInBackground()` method. Note that you should call\
    \ the `get()` method after the task is done. If you call it too early, it will\
    \ wait for the task to finish.\n- Calling the `publish()` method while performing\
    \ calculation inside the `doInBackground()` method any time when you want to publish\
    \ intermediate values. Of course, you need to implement the `process()` method\
    \ to receive those intermediate values.\n- Dividing the task in multiple equal\
    \ units in the `doInBackground()` method and calling the `setProgress()` method\
    \ to update the \"progress\" property with a percentage value after each unit\
    \ is completed. Of course, you need to implement a `java.beans.PropertyChangeListener`\
    \ class to get notified about the \"progress\" value changes.\n- Implementing\
    \ a `java.beans.PropertyChangeListener` class to get notified about the \"status\"\
    \ value changes of the `SwingWorker` instance, going from `PENDING`, `STARTED`,\
    \ to `DONE`.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[SwingWorker - The Background Task Worker](#part0094.xhtml)\n\n### SwingWorker\
    \ Example using done() Method\n\nThis section provides a tutorial example on how\
    \ to use `java.swing.SwingWorker` class with the `done()` method to communicate\
    \ the calculation result out into a dispatch thread.\n\nThere are several ways\
    \ to use the `SwingWorker` class. Let's start with the simplest one first.\n\n\
    #### Example 1: Get notified when task is done and retrieve the result\n\nThis\
    \ example shows the simplest way of using the `SwingWorker` class to just launch\
    \ the `Worker thread` and catch the result in the `Dispatch thread`. Only 2 methods\
    \ need to be implemented:\n\n- `T doInBackground()` - Instance method to be implemented\
