    public class JInternalFrameTest {\n   public static void main(String[] a) {\n\
    \      JFrame myFrame = new JFrame(\"Internal Frames\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      myFrame.setSize(300,300);\n      JDesktopPane myDesktop = new JDesktopPane();\n\
    \      myFrame.setContentPane(myDesktop);\n      JInternalFrame f = createFrame(\"\
    Frame 1\");\n      f.setLocation(10,10);\n      myDesktop.add(f);\n      f = createFrame(\"\
    Frame 2\");\n      f.setLocation(60,60);\n      myDesktop.add(f);\n      myFrame.setVisible(true);\n\
    \   }\n   private static JInternalFrame createFrame(String t) {\n      JInternalFrame\
    \ f = new JInternalFrame(t);\n      f.setResizable(true);\n      f.setClosable(true);\n\
    \      f.setMaximizable(true);\n      f.setIconifiable(true);\n      f.setSize(200,200);\n\
    \      f.setVisible(true);\n      return f;\n   }\n}\n```\n\n运行此程序，你应该看到两个内部帧。你可以调整大小、关闭、最大化和最小化内部帧：\n\
    \n![](img/image00170.jpeg)\n\n内部测试\n\nJava Swing 教程 - Herong 示例\n\n在主框架中创建内部帧\n\
