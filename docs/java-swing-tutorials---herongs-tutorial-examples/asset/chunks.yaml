- fmt: "\n* `AWT (Abstract Windows Toolkit)` is a Java package, `java.awt.*` that\
    \ allows Java applications to operate graphical devices and create GUI (Graphical\
    \ User Interfaces).\n* `java.awt.Frame` - Represents a top-level window with a\
    \ title and a border.\n* You can override the `paint()` method to draw graphics\
    \ on the frame or any components.\n* `java.awt.Button` and `java.awt.Label` represent\
    \ standard button and label GUI components.\n* `Button` can generate action events,\
    \ when clicked. You can add action listeners to handle action events with your\
    \ own logics.\n* `TextField` can also generate action events, when \"Enter\" key\
    \ is pressed.\n* `java.awt.MenuBar`, `java.awt.Menu` and `java.awt.MenuItem` can\
    \ be used to create a menu system and added to a frame.\n\nSample programs listed\
    \ in this chapter have been tested with `JDK 1.0` to `JDK 15` on Windows and macOS\
    \ computers.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\n### What Is AWT (Abstract\
    \ Windows Toolkit)\n\nThis section describes what is AWT (Abstract Windows Toolkit)\
    \ - A Java package, `java.awt.*` that allows Java applications to operate graphical\
    \ devices and create GUI (Graphical User Interfaces).\n\n**What Is AWT (Abstract\
    \ Windows Toolkit)**? `AWT` is a Java package, `java.awt.*` that allows Java applications\
    \ to operate graphical devices and create GUI (Graphical User Interfaces).\n\n\
    The `JDK` documentation offers another description of `AWT`: \"AWT contains all\
    \ of the classes for creating user interfaces and for painting graphics and images.\
    \ A user interface object such as a button or a scrollbar is called, in AWT terminology,\
    \ a component. The `Component` class is the root of all AWT components. See `Component`\
    \ for a detailed description of properties that all AWT components share.\"\n\n\
    The `AWT` package, `java.awt.*` was introduced in `JDK 1.0`. Later in `JDK 1.2`,\
    \ the `Swing` package, `javax.swing.*`, was introduced to provide a richer API\
    \ and hiding `AWT` behind a wrapper layer.\n\nThe `AWT` package contains following\
    \ major class:\n* `java.awt.AWTEvent` - The root class of all SWT event classes.\n\
    * `java.awt.Button` - Represents a labeled button.\n* `java.awt.Canvas` - Represents\
    \ a blank rectangular area of the screen onto which the application can draw or\
    \ from which the application can trap input events from the user.\n* `java.awt.Checkbox`\
    \ - Represents a graphical component with either an \"on\" (true) or \"off\" (false)\
    \ state.\n* `java.awt.Color` - Encapsulates colors in the default sRGB color space.\n\
    * `java.awt.Component` - A graphical representation that can be displayed on the\
    \ screen and that can interact with the user.\n* `java.awt.Container` - A logical\
    \ component that can hold other components as a group.\n* `java.awt.Desktop` -\
    \ Allows the application to interact with various desktop capabilities.\n* `java.awt.Dialog`\
    \ - Represents a top-level window with a title and a border that is typically\
    \ used to take some form of input from the user.\n* `java.awt.Event` - Represents\
    \ a labeled button.\n* `java.awt.FlowLayout` - Arranges components in a directional\
    \ flow, much like lines of text in a paragraph.\n* `java.awt.Font` - Represents\
    \ fonts, which are used to render text in a visible way.\n* `java.awt.Frame` -\
    \ Represents a top-level window with a title and a border.\n* `java.awt.Graphics`\
    \ - An abstract base class for all graphics contexts that allow an application\
    \ to draw onto components that are realized on various devices, as well as onto\
    \ off-screen images.\n* `java.awt.GraphicsEnvironment` - Describes the collection\
    \ of `GraphicsDevice` objects and `Font` objects available to a Java(tm) application\
    \ on a particular platform.\n* `java.awt.GridBagLayout` - A flexible layout manager\
    \ that aligns components vertically, horizontally or along their baseline without\
    \ requiring that the components be of the same size.\n* `java.awt.GridLayout`\
    \ - A layout manager that lays out a container's components in a rectangular grid.\n\
    * `java.awt.Image` - An abstract class acting as the superclass of all classes\
    \ that represent graphical images.\n* `java.awt.Label` - A component for placing\
    \ text in a container.\n* `java.awt.List` - A component presenting the user with\
    \ a scrolling list of text items.\n* `java.awt.Menu` - A pull-down menu component\
    \ that is deployed from a menu bar.\n* `java.awt.MenuBar` - Encapsulates the platform's\
    \ concept of a menu bar bound to a frame.\n* `java.awt.MenuItem` - An item associated\
    \ to the `MenuBar`.\n* `java.awt.MouseInfo` - Provides methods for getting information\
    \ about the mouse, such as mouse pointer location and the number of mouse buttons.\n\
    * `java.awt.Panel` - The simplest container class.\n* `java.awt.Point` - Represents\
    \ a location in (x,y) coordinate space, specified in integer precision.\n* `java.awt.Polygon`\
    \ - Encapsulates a description of a closed, two-dimensional region within a coordinate\
    \ space.\n* `java.awt.Rectangle` - Specifies an area in a coordinate space that\
    \ is enclosed by the `Rectangle` object's upper-left point (x,y) in the coordinate\
    \ space, its width, and its height.\n* `java.awt.Robot` - Generates native system\
    \ input events for the purposes of test automation, self-running demos, and other\
    \ applications where control of the mouse and keyboard is needed.\n* `java.awt.Scrollbar`\
    \ - Embodies a scroll bar, a familiar user interface.\n* `java.awt.ScrollPane`\
    \ - A container class which implements horizontal and vertical scrolling for a\
    \ single child component.\n* `java.awt.SystemTray` - Represents the system tray.\n\
    * `java.awt.Taskbar` - Allows a Java application to interact with the task area\
    \ (taskbar, etc.).\n* `java.awt.TextArea` - A multi-line region that displays\
    \ text.\n* `java.awt.TextField` - A text component that allows the editing of\
    \ a single line of text.\n* `java.awt.Toolkit` - The abstract superclass of all\
    \ actual implementations of the Abstract Window Toolkit.\n* `java.awt.TrayIcon`\
    \ - Represents a tray icon that can be added to the system tray.\n* `java.awt.Window`\
    \ object - A top-level window with no borders and no menubar.\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\
    \n### HelloAWT.java - My First AWT Program\n\nThis section provides a tutorial\
    \ example on how to write a simple AWT program. `HelloAWT.java` is my first AWT\
    \ program that displays a blank window with 'Hello world!' in the window title\
    \ bar.\n\nBelow is my first AWT program, `HelloAWT.java`:\n\n```java\nimport java.awt.Frame;\n\
    public class HelloAWT {\n   public static void main(String[] a) {\n      Frame\
    \ f = new Frame(\"Hello world!\");\n      f.setVisible(true);\n   }\n}\n```\n\n\
    If you have `JDK` installed on your system, you can compile and run this program\
    \ in a command window:\n\n```\nherong> javac HelloAWT.java\nherong> java HelloAWT\n\
    ```\n\nOnce the program is running, you will see a small new window showing up\
    \ on your screen. If use the mouse pointer to drag its edges to make it larger,\
    \ you can see the hello text in the title area as shown in this picture:\n\n![](Images/image0194.jpeg)\n\
    \nFirst AWT - Hello World!\n\nThe new window will stay on your screen until you\
    \ press `Ctrl-C` in the command window to terminate the running program.\n\n###\
    \ Closing AWT Frame and Terminating Application\n\n**Problem**: I have a frame\
    \ window displayed on the screen and I want to close the frame and terminate the\
    \ application, when user invokes the close command from the window's system menu,\
    \ or clicks on the close icon from the window's system icon list.\n"
