  trans: "\n\n下面的图片显示了 JDK 15 安装界面的外观：\n\n![](img/image00128.jpeg)\n\n# JDK 12 安装界面\n\
    \n要测试安装，请打开命令行窗口并尝试 `java` 命令。如果你得到以下输出，说明你的安装是成功的：\n\n```\n herong> java -version\
    \ \n\njava version \"15\" 2020-09-15\nJava(TM) SE Runtime Environment (build 15+36-1562)\n\
    Java HotSpot(TM) 64-Bit Server VM (build 15+36-1562, mixed mode, sharing)\n```\n\
    \nJava Swing 教程 - Herong 教程示例\n\n∟JDK (Java 开发工具包)\n\n## 编写我的第一个 Java 程序\n\n本节提供了一个如何使用\
    \ JDK 1.8.0 编写、编译和执行第一个 Java 程序的教程示例。\n\n当你的机器上安装了 JDK 后，它提供了两个命令供你编译和运行 Java\
    \ 程序。\n\n- `javac class_name.java` - 编译存储在以程序类同名文件中的 Java 程序。\n- `java -classpath\
    \ . class_name` - 运行编译后的 Java 程序。`-classpath .` 指定当前目录为类路径。\n\n让我们用一个非常简单的 Java\
    \ 程序来尝试这些命令。使用记事本将以下 Java 程序输入到名为 `Hello.java` 的文件中：\n\n```\n class Hello {\n\
    \   public static void main(String[] a) {\n      System.out.println(\"Hello world!\"\
    ); \n   }\n}\n```\n\n然后在命令行窗口中使用 `javac` 命令编译此程序：\n\n```\n herong> javac Hello.java\n\
    ```\n\n要执行该程序，请使用 `java` 命令：\n\n```\n herong> java Hello\nHello world!\n```\n\n\
    恭喜，你已成功地输入、编译并执行了你的第一个 Java 程序。\n\nJava Swing 教程 - Herong 教程示例\n\n∟JDK (Java 开发工具包)\n\
    \n## 将 JDK 的 \"bin\" 目录添加到 Path 设置\n\n本节提供了关于如何将 JDK 的 'bin' 目录添加到系统环境变量 'path'\
    \ 中的教程。\n\n如果你正在使用 Windows 电脑，并希望通过输入程序文件名（无需目录路径）来运行 Java 编译器和 JVM，你可能需要更新 Windows\
    \ 电脑上的 \"path\" 环境变量：\n\n- 打开“控制面板 > 系统和安全 > 系统”。\n- 点击“高级系统设置”。\n- 点击“环境变量”。\n\
    - 选择“系统变量 > Path”并点击“编辑”。\n- 将 `C:\\Progra~1\\java\\jdk-17.0.1\\bin;` 添加到当前路径列表的开头。\n\
    - 点击“确定”保存更改。\n\n然后我在新的命令行窗口中运行了 `echo %path%` 命令来确认更改：\n\n```\n herong> echo\
    \ %path%\n\n   C:\\Progra~1\\java\\jdk-17.0.1\\bin;\n   C:\\WINDOWS\\system32;C:\\\
    WINDOWS;\n   ...\n```\n\n现在我应该可以在不需要目录路径名的情况下运行 Java 命令了：\n\n```\n herong> java\
    \ -version\njava version \"17.0.1\" 2021-10-19 LTS\n\nherong> javac hello.java\n\
    \nherong> java Hello\nHello world!\n```\n\n现在我准备好玩 Oracle JDK 包中包含的 Java Swing\
    \ 功能了！\n\n![](img/image00129.jpeg)\n\n### 设置 java_home\n\n你也可以设置名为 `java_home`\
    \ 的新环境变量，以避免输入完整路径来访问 Java 工具程序文件：\n\n```\n herong> set java_home=C:\\Progra~1\\\
    java\\jdk-17.0.1\n\nherong> %java_home%\\bin\\java -version\njava version \"17.0.1\"\
    \ 2021-10-19 LTS\n```\n\nJava Swing 教程 - Herong 教程示例\n\n∟JDK (Java 开发工具包)\n\n\
    ## JDK 文档安装\n\n本节描述了如何在自己的机器上安装 JDK 文档。\n\n为了更有效地学习 JDK，你绝对需要在本地机器安装一份 JDK 文档。JDK\
    \ 文档提供了 JDK 中使用的所有类和方法的详细信息。以下是我在本地机器上下载并安装 JDK 17 文档的操作：\n\n- 使用此 URL 访问 Java\
    \ 下载主页：`https://www.oracle.com/java/technologies/downloads/`。\n- 点击页面底部的“Documentation\
    \ Download”按钮。你会看到出现“Java SE Development Kit 17 Documentation”页面。\n- 点击 `jdk-17.0.1_doc-all.zip`\
    \ 的超链接。\n- 将下载文件 `jdk-17.0.1_doc-all.zip` 保存到临时目录。\n- 双击 `jdk-17.0.1_doc-all.zip`\
    \ 将所有文件提取到 `C:\\Program Files\\Java\\jdk-17.0.1 directory`。\n\n要验证安装，请用浏览器打开 `C:\\\
    Program Files\\Java\\jdk-17.0.1\\docs\\index.html`。\n\nJDK 文档提供了 JDK 中使用的所有类和方法的详细信息。Swing\
    \ 文档提供了 `java.logging` 模块。\n\nJava Swing 教程 - Herong 教程示例\n\n∟Swing 包介绍\n\n###\
    \ 什么是 Swing\n\n本节描述了 Swing —— 一个用于构建图形界面 (GUI) 并为 Java 程序添加丰富功能和交互性的 Java 包。\n\
    \n**什么是 Swing？** Swing 是一个 Java 包 `javax.swing`，位于 J2SDK（Java 2 Software Kit）。它对现有的图形包\
    \ AWT（Abstract Windows Toolkit）`java.awt` 提供了许多增强。\n\n`javax.swing` 和 `java.awt`\
    \ 共同为 Java 程序操作图形设备和创建 GUI 提供了 API。\n\nJDK 文档对 Swing 有另一种描述：“Swing 类（Java 基础类\
    \ JFC 软件的一部分）实现了一用于构建图形界面 (GUI) 并为 Java 程序添加丰富功能和交互性的组件。Swing 组件完全用 Java 语言实现。可插的外观和感觉（look\
    \ and feel）允许你创建跨平台外观相同的 GUI，也可以采用操作系统的外观（如 Microsoft Windows、Solaris 或 Linux）。”\n\
    \nSwing 包包含以下子包：\n\n- `javax.swing` - 提供一组“轻量级”（用 Java 编写，无原生代码）组件，这些组件在最大程度上在所有平台上运行相同。\n\
    - `javax.swing.border` - 提供为 Swing 组件绘制特殊边框的类和接口。\n- `javax.swing.colorchooser`\
    \ - 包含 `JColorChooser` 组件使用的类和接口。\n- `javax.swing.event` - 提供对 Swing 组件触发的事件的支持。\n\
    - `javax.swing.filechooser` - 包含 `JFileChooser` 组件使用的类和接口。\n- `javax.swing.plaf`\
    \ - 提供 Swing 用于提供可插拔外观和感觉的一个接口和许多抽象类。\n- `javax.swing.plaf.basic` - 提供根据基础外观感觉构建的用户界面对象。\n\
    - `javax.swing.plaf.metal` - 提供根据 Java 外观感觉（以前称为 Metal）构建的用户界面对象，这是默认的外观感觉。\n\
    - `javax.swing.plaf.multi` - 提供结合两个或多个外观感觉的用户界面对象。\n- `javax.swing.plaf.synth`\
    \ - 提供可皮肤外观和感觉的用户界面对象，其中所有绘制操作都委托出去。\n\n"
- fmt: "\n* `javax.swing.table` - Provides classes and interfaces for dealing with\
    \ `JTable`.\n* `javax.swing.text` - Provides classes and interfaces that deal\
    \ with editable and non-editable text components.\n* `javax.swing.text.html` -\
    \ Provides the class `HTMLEditorKit` and supporting classes for creating HTML\
    \ text editors.\n* `javax.swing.text.html.parser` - Provides the default HTML\
    \ parser, along with support classes.\n* `javax.swing.text.rtf` - Provides a class\
    \ (`RTFEditorKit`) for creating Rich Text Format text editors.\n* `javax.swing.tree`\
    \ - Provides classes and interfaces for dealing with `JTree`.\n* `javax.swing.undo`\
    \ - Allows developers to provide support for undo/redo in applications such as\
    \ text editors.\n\n## [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟Introduction of Java Swing Package](#part0009.xhtml)\n\n#### SwingHello.java\
    \ - My First Swing Program\n\nThis section provides a tutorial example on how\
    \ to a simple Java Swing program. `SwingHello.java` is my first Swing program\
    \ that displays a blank window with 'Hello world!' in the window title bar.\n\n\
    Below is my first Swing program, `SwingHello.java`:\n\n```\n import javax.swing.*;\n\
    public class SwingHello {\n   public static void main(String[] a) {\n      JFrame\
    \ f = new JFrame(\"Hello world!\");\n      f.setVisible(true);\n   }\n}\n```\n\
    \nIf you have `JDK` installed on your system, you can compile and run this program\
    \ in a command window:\n\n```\n herong> javac SwingHello.java\nherong> java SwingHello\n\
    ```\n\nOnce the program is running, you will see a small new window showing up\
    \ on your screen. If use the mouse pointer to drag its edges to make it larger,\
    \ you can see the hello text in the title area as shown in this picture:\n\n![](Images/image0013.jpeg)\n\
    \nFirst Swing (on Windows) - Hello World!\n\nThe new window will stay on your\
    \ screen until you press `Ctrl-C` in the command window to terminate the running\
    \ program.\n\nIf you are using a macOS computer, the Java Swing window will look\
    \ differently:\n\n![](Images/image00131.jpeg)\n\nFirst Swing (on macOS) - Hello\
    \ World!\n\n## [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟Graphics Environment of the Local System\n\nThis chapter provides tutorial\
    \ notes and example codes on local graphics environment. Topics include `java.awt.GraphicsEnvironment`\
    \ class description and example; `java.awt.Toolkit` class description and example;\
    \ calculating screen resolution with the default `Toolkit` object.\n\n> [java.awt.GraphicsEnvironment\
    \ - Graphics Environment Class](#part0013.xhtml)\n> [java.awt.Toolkit - AWT Base\
    \ Class](#part0014.xhtml)\n> [Testing Screen Resolution](#part0015.xhtml)\n\n\
    Conclusion:\n\n* `java.awt.GraphicsEnvironment.getLocalGraphicsEnvironment()`\
    \ returns the local graphics environment object.\n* `java.awt.Toolkit.getDefaultToolkit()`\
    \ returns the default `Toolkit` object.\n\nSample programs listed in this chapter\
    \ have been tested with `JDK 1.3.1` to `JDK 17` on Windows and macOS computers.\n\
    \n## [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n\
    ### ∟Graphics Environment of the Local System](#part0012.xhtml)\n\n### ∟java.awt.GraphicsEnvironment\
    \ - Graphics Environment Class\n\nThis section describes `java.awt.GraphicsEnvironment`\
    \ - Graphics Environment Class. You can use this class to get a lot of information\
    \ about your local graphics device, which is really your computer screen.\n\n\
    `java.awt.GraphicsEnvironment` is an `AWT` class representing graphics environment\
    \ that are accessible by the local operating system. This class also offers a\
    \ static method, `getLocalGraphicsEnvironment()`, to return an object representing\
    \ the local default graphics environment.\n\nYou can use this local graphics environment\
    \ object to get a lot of information about your local system. For example, you\
    \ can find out what text fonts are available, and what is maximum size of the\
    \ graphical drawing area on the screen.\n\nTo show you how to use the `getLocalGraphicsEnvironment()`\
    \ method, I wrote the following sample program:\n\n```\n /* LocalGraphicsEnvironment.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\npublic class LocalGraphicsEnvironment {\n   public static void\
    \ main(String[] a) {\n      GraphicsEnvironment e \n         = GraphicsEnvironment.getLocalGraphicsEnvironment();\n\
    \      String n[] = e.getAvailableFontFamilyNames();\n      System.out.println(\"\
    Font families:\");\n      for (int i=0; i<n.length; i++) {\n         System.out.println(\"\
    \   \"+n[i]);\n      }\n      Point p = e.getCenterPoint();\n      System.out.println(\"\
    Window center point: \"+p.x+\", \"+p.y);\n      Rectangle r = e.getMaximumWindowBounds();\n\
    \      System.out.println(\"Maximum window bounds: \"+r.x+\", \"+r.y\n       \
    \  +\", \"+r.width+\", \"+r.height);\n      GraphicsDevice g = e.getDefaultScreenDevice();\n\
    \      System.out.println(\"Device ID: \"+g.getIDstring());\n   }\n}\n```\n\n\
    Output:\n\n```\n herong> java LocalGraphicsEnvironment.java\n\nFont families:\n\
    \   Albertus Extra Bold\n   Albertus Medium\n   Antique Olive\n   Arial\n   Arial\
    \ Black\n   Arial Narrow\n   ......\nWindow center point: 512, 296\nMaximum window\
    \ bounds: 0, 0, 1024, 592\nDevice ID: Display0\n```\n\n## [Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n### ∟Graphics Environment\
    \ of the Local System](#part0012.xhtml)\n\n### ∟java.awt.Toolkit - AWT Base Class\n\
    \nThis section provides a tutorial example on how to use `java.awt.Toolkit` class\
    \ to obtain the default `Toolkit` object, which also can provide information about\
    \ the default graphics environment, local screen.\n\n`java.awt.Toolkit` is an\
    \ `AWT` class acting as a base class for all implementations of `AWT`. This class\
    \ also offers a static method, `getDefaultToolkit()`, to return a `Toolkit` object\
    \ representing the default implementation of `AWT`.\n\nTo show you how to use\
    \ the `getDefaultToolkit()` method, I wrote the following sample program:\n\n\
    ```\n /* DefaultToolkit.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights\
    \ Reserved.\n */\nimport java.awt.*;\npublic class DefaultToolkit {\n   public\
    \ static void main(String[] a) {\n      Toolkit t = Toolkit.getDefaultToolkit();\n\
    \      Dimension d = t.getScreenSize();\n      System.out.println(\"Screen size:\
    \ \"+d.width+\", \"+d.height);\n      System.out.println(\"Screen resolution:\
    \ \"+t.getScreenResolution());\n   }\n}\n```\n\nOutput:\n\n```\n herong> java\
    \ DefaultToolkit.java \n\nScreen size: 1024, 640\nScreen resolution: 120\n```\n\
    \nComparing the output of `DefaultToolkit.java` with `LocalGraphicsEnvironment.java`,\
    \ the toolkit screen size doesn't match the environment window bounds. I don't\
    \ know why. I also don't know how to read the screen resolution value. Is it 120\
    \ DPI (Dots Per Inch)?\n\n## [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n### ∟Graphics Environment of the Local System](#part0012.xhtml)\n\n### ∟Testing\
    \ Screen Resolution\n\nThis section provides a tutorial example on how to test\
    \ the graphics resolution of the local screen using the default `Toolkit` object\
    \ returned by the `Toolkit.getDefaultToolkit()` static method.\n\nTo answer my\
    \ question raised in the previous section, I wrote the following program and did\
    \ some tests:\n"
