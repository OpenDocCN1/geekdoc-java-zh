    );\n      JMenuItem myItem = new JMenuItem(\"Sound\");\n      myMenu.add(myItem);\n\
    \      myItem = new JMenuItem(\"Auto save\");\n      myMenu.add(myItem);\n   \
    \   return myMenu;\n   }\n   public void actionPerformed(ActionEvent e) {\n  \
