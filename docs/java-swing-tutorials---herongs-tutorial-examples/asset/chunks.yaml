    \      Container myPane = myFrame.getContentPane();\n      JButton myButton =\
    \ new JButton(\"Show\");\n      myButton.addActionListener(this);\n      myPane.add(myButton);\n\
    \      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   public void\
    \ actionPerformed(ActionEvent e) {\n      int messageType = JOptionPane.INFORMATION_MESSAGE;\n\
    \      int optionType = JOptionPane.YES_NO_CANCEL_OPTION;\n      int code = JOptionPane.showConfirmDialog(myFrame,\
    \ \n         \"Do you want to continue?\", \n         \"Confirmation Dialog Box\"\
    , optionType, messageType);\n\n      String answer = \"Unknown\";\n      if (code\
    \ == JOptionPane.OK_OPTION) {\n         answer = \"Ok\";\n      } else if (code\
    \ == JOptionPane.YES_OPTION) {\n         answer = \"Yes\";\n      } else if (code\
    \ == JOptionPane.NO_OPTION) {\n         answer = \"No\";\n      } else if (code\
    \ == JOptionPane.CANCEL_OPTION) {\n         answer = \"Cancel\";\n      } else\
    \ if (code == JOptionPane.CLOSED_OPTION) {\n         answer = \"Closed\";\n  \
    \    }\n      System.out.println(\"Answer: \"+answer);\n   }\n}\n```\n\nIf you\
    \ run this example, and click the Show button, you will see a confirmation dialog\
    \ box showing up like this:\n\n![](Images/image0018.jpeg)\n\n### Congirmation\
    \ Dialog Box Input\n\nClick the Yes button on the confirmation dialog box. Click\
    \ the Show button on the main frame window, then the No button on the confirmation\
    \ dialog box again. Repeat the test with the Cancel button and the close dialog\
    \ box icon. You will see some messages printed on the Java console window:\n\n\
    ```\n Answer: Ok\nAnswer: No\nAnswer: Cancel\nAnswer: Closed\n```\n\n### Interesting\
    \ notes about this tutorial example:\n\n* The returned code of the Yes button\
    \ is `JOptionPane.OK_OPTION`, not `JOptionPane.YES_OPTION`. I don't know why.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Option\
    \ Dialog Boxes](#part0079.xhtml)\n\n∟`showInputDialog()` - Displaying Input Dialog\
    \ Boxes\n\nThis section provides a tutorial example on how to use the static method,\
    \ `showInputDialog()`, to create and display input dialog boxes to take text string\
    \ input from the user.\n\nThe third type of dialog boxes you can create and display\
    \ with the `javax.swing.JOptionPane` class is the input dialog box. This can be\
    \ done with the static method: `answer = showInputDialog(frame, message, title,\
    \ type)`, where:\n\n* `\"frame\"` is a frame object to be used as the parent frame.\n\
    * `\"message\"` is the message string to be display on the dialog box.\n* `\"\
    title\"` is the title string to be used as the dialog box title.\n* `\"type\"\
    ` is an integer code representing a specific message dialog box type. Valid type\
    \ codes are predefined as constants in the `JOptionPane` class: `INFORMATION_MESSAGE`,\
    \ `WARNING_MESSAGE`, `ERROR_MESSAGE` and `PLAIN_MESSAGE`.\n* `\"answer\"` is the\
    \ returned string entered by the user on the input dialog box. If no input entered,\
    \ `null` will be returned.\n\nHere is an example program I wrote to test the `showInputDialog()`\
    \ method:\n\n```\n /* JOptionPaneInputDialog.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\nimport javax.swing.event.*;\npublic class JOptionPaneInputDialog\
    \ implements ActionListener {\n   JFrame myFrame = null;\n   public static void\
    \ main(String[] a) {\n      (new JOptionPaneInputDialog()).test();\n   }\n   private\
    \ void test() {\n      myFrame = new JFrame(\"showInputDialog() Test\");\n   \
    \   myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container myPane\
    \ = myFrame.getContentPane();\n      JButton myButton = new JButton(\"Show\");\n\
    \      myButton.addActionListener(this);\n      myPane.add(myButton);\n      myFrame.pack();\n\
    \      myFrame.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent\
    \ e) {\n      int messageType = JOptionPane.INFORMATION_MESSAGE;\n      String\
    \ answer = JOptionPane.showInputDialog(myFrame, \n         \"What's you name?\"\
    , \n         \"Input Dialog Box\", messageType);\n      System.out.println(\"\
    Answer: \"+answer);\n   }\n}\n```\n\nIf you run this example, and click the Show\
    \ button, you will see an input dialog box showing up like this:\n\n![](Images/image00181.jpeg)\n\
    \n### Congirmation Dialog Box Input\n\nEnter \"Herong Yang\" in the input field\
    \ on the input dialog box and click OK. Repeat the test with the Cancel button\
    \ and the close dialog box icon. You will see some messages printed on the Java\
    \ console window:\n\n```\n Answer: Herong Yang\nAnswer: null\nAnswer: null\n```\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Option\
    \ Dialog Boxes](#part0079.xhtml)\n\n### showInputDialog() - Displaying Input Dialog\
    \ Boxes\n\nThis section provides a tutorial example on how to use the static method,\
