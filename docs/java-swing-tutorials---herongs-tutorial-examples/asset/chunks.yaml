  trans: "\n\n本节提供了一个教程示例，介绍如何通过向按钮组件添加 `ActionListener` 接口来创建一个按钮以处理动作。\n\n处理按钮动作的一种方法是在按钮对象上添加动作监听器（action\
    \ listener）。动作监听器是实现了 `ActionListener` 接口的任意对象。\n\n以下程序展示了如何扩展 `JButton` 类来实现\
    \ `ActionListener` 类：\n\n```java\n /* JButtonAction1.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\npublic class JButtonAction1 {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame(\"My Switch Button\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      JButton b = new MyButton();\n      f.getContentPane().add(b);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   private static class MyButton extends JButton\
    \ \n      implements ActionListener {\n       String text = \"On\";\n       public\
    \ MyButton() {\n          super();\n          setText(text);\n          addActionListener(this);\n\
    \       }\n       public void actionPerformed(ActionEvent e) {\n          if (text.equals(\"\
    On\")) text = \"Off\";\n          else text = \"On\"; \n          setText(text);\n\
    \       }\n   }\n}\n```\n\n如果你运行此示例，你将得到：\n\n![](img/image00143.jpeg)\n\n### 组件级的按钮动作处理器\n\
    \n按钮工作正常。如果你点击按钮，按钮标签文本将从 \"On\" 变为 \"Off\"；如果你再次点击它，它将从 \"Off\" 变为 \"On\"。\n\n\
    Java Swing 教程 - Herong 的教程示例\n\n∟JButton - Swing 按钮类\n\n### 帧级别的按钮动作处理器\n\n本节提供了一个教程示例，介绍如何通过向包含按钮组件的帧添加\
    \ `ActionListener` 接口来创建一个按钮以处理动作。\n\n在上一节中，我们扩展了按钮来处理其自身的动作。如果动作只需要修改同一个按钮的行为，那么这种方法运行良好。\n\
    \n但如果动作需要修改其他组件的行为，你需要在更高级别实现动作监听器。以下程序展示了如何使用动作处理器修改标签组件的文本：\n\n```java\n /*\
    \ JButtonAction2.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n\
    \ */\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\npublic\
    \ class JButtonAction2 implements ActionListener {\n   JButton myButton = null;\n\
    \   JLabel myLabel = null;\n   String text = null;\n   public static void main(String[]\
    \ a) {\n      JButtonAction2 myTest = new JButtonAction2();\n      myTest.createFrame();\n\
    \   }\n   public void createFrame() {\n      JFrame f = new JFrame(\"My Switch\
    \ Button\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container\
    \ c = f.getContentPane();\n      c.setLayout(new GridLayout(2,1));\n      text\
    \ = \"On\";\n      myButton = new JButton(text);\n      myButton.addActionListener(this);\n\
    \      c.add(myButton);\n      myLabel = new JLabel(text,SwingConstants.CENTER);\n\
    \      c.add(myLabel);\n      f.pack();\n      f.setVisible(true);\n   }\n   public\
    \ void actionPerformed(ActionEvent e) {\n      if (text.equals(\"On\")) text =\
    \ \"Off\";\n      else text = \"On\"; \n      myButton.setText(text);\n      myLabel.setText(text);\n\
    \   }\n}\n```\n\n如果你运行此示例，你将得到：\n\n![](img/image00144.jpeg)\n\n### 帧上的按钮动作处理器\n\
    \n按钮工作得很好。如果你点击按钮，按钮标签文本将从 \"On\" 变为 \"Off\"，且标签组件的文本也会发生改变。\n\nJava Swing 教程\
    \ - Herong 的教程示例\n\n∟JButton - Swing 按钮类\n\n### 帧级别的鼠标点击处理器\n\n本节提供了一个教程示例，介绍如何通过向包含按钮组件的帧添加\
    \ `MouseAdapter` 接口来创建一个按钮以处理动作。\n\n当然，使用 `ActionListeners` 不是处理用户点击按钮的唯一方法。你也可以使用\
    \ `MouseListeners` 来处理用户点击。这是一个示例程序：\n\n```java\n /* JButtonAction3.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport javax.swing.*;\npublic class JButtonAction3 extends\
    \ MouseAdapter {\n   JButton myButton = null;\n   JLabel myLabel = null;\n   String\
    \ text = null;\n   public static void main(String[] a) {\n      JButtonAction3\
    \ myTest = new JButtonAction3();\n      myTest.createFrame();\n   }\n   public\
    \ void createFrame() {\n      JFrame f = new JFrame(\"My Switch Button\");\n \
    \     f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container c = f.getContentPane();\n\
    \      c.setLayout(new GridLayout(2,1));\n      text = \"On\";\n      myButton\
    \ = new JButton(text);\n      myButton.addMouseListener(this);\n      c.add(myButton);\n\
    \      myLabel = new JLabel(text,SwingConstants.CENTER);\n      c.add(myLabel);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   public void mouseClicked(MouseEvent\
    \ e) {\n      if (text.equals(\"On\")) text = \"Off\";\n      else text = \"On\"\
    ; \n      myButton.setText(text);\n      myLabel.setText(text);\n   }\n}\n```\n\
    \n如果你运行此示例，你将得到：\n\n![](img/image00145.jpeg)\n\n### 使用鼠标适配器的按钮\n\n按钮工作正常。如果你点击按钮，按钮标签文本将从\
    \ \"On\" 变为 \"Off\"。\n\nJava Swing 教程 - Herong 的教程示例\n\n### JCheckBox - Swing\
    \ 复选框类\n\n本章提供了 `JCheckBox` 类的注释和示例代码。主题包括 `javax.swing.JCheckBox` 类的描述；创建复选框和事件监听器的示例程序。\n\
    \n- JCheckBox 及相关方法\n- ActionListener, ChangeListener 和 ItemListener\n- isSelected()\
    \ - 获取复选框状态\n\n#### 结论：\n\n- `javax.swing.JCheckBox` 类表示复选框。\n- `ActionListener`、`ChangeListener`\
    \ 或 `ItemListener` 接口可用于复选框上的动作。\n- `isSelected()` 方法用于检测复选框的状态。\n\n本章列出的示例程序已在\
    \ Windows 和 macOS 上通过了 JDK 1.3.1 到 17 的测试。\n\nJava Swing 教程 - Herong 的教程示例\n\n\
    ∟JCheckBox - Swing 复选框类\n\n### javax.swing.JCheckBox 相关方法\n\n本节介绍了 `javax.swing.JCheckBox`\
    \ 类及其常用方法。\n\n`javax.swing.JCheckBox` - 代表 UI 复选框的 Swing 类。一些有趣的方法包括：\n\n- `JCheckBox(String)`\
    \ - 创建带有指定字符串的复选框的构造函数。复选框默认未选中。\n- `addActionListener(ActionListener)` - 为此复选框添加动作监听器以处理动作事件。点击此复选框将触发一次动作事件。\n\
    - `addChangeListener(ChangeListener)` - 为此复选框添加变化监听器以处理变化事件。点击此复选框将触发多次变化事件。\n\
    - `addItemListener(ItemListener)` - 为此复选框添加项目监听器以处理项目事件。点击此复选框将触发一次项目事件。\n- `setActionCommand(String)`\
    \ - 为此复选框设置动作命令字符串的方法。\n- `isSelected()` - 返回复选框状态的方法。\n\n### ActionListener,\
    \ ChangeListener 和 ItemListener\n\n本节提供了一个教程示例，介绍如何使用 `ActionListener`、`ChangeListener`\
    \ 和 `ItemListener` 接口来处理复选框上产生的不同类型的事件。\n\n"
- fmt: "\nAs you can see from the previous section, a check box can have 3 types of\
    \ event listeners: `ActionListener`, `ChangeListener`, and `ItemListener`. The\
    \ following sample program shows you when those listeners are called, and how\
    \ many times:\n\n```java\n /* JCheckBoxTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\nimport javax.swing.event.*;\npublic class JCheckBoxTest {\n\
    \   public static void main(String[] a) {\n      JFrame f = new JFrame(\"My Check\
    \ Boxes\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\n     \
    \ MyCheckBox red = new MyCheckBox(\"Red\");\n      f.getContentPane().add(red,BorderLayout.NORTH);\n\
    \n      MyCheckBox green = new MyCheckBox(\"Green\");\n      f.getContentPane().add(green,BorderLayout.CENTER);\n\
    \n      MyCheckBox blue = new MyCheckBox(\"Blue\");\n      f.getContentPane().add(blue,BorderLayout.SOUTH);\n\
    \n      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyCheckBox\
    \ extends JCheckBox \n      implements ActionListener, ChangeListener, ItemListener\
    \  {\n      static int count = 0;\n      String text = null;\n      public MyCheckBox(String\
    \ t) {\n         super(t);\n         text = t;\n         addActionListener(this);\n\
    \         addChangeListener(this);\n         addItemListener(this);\n      }\n\
    \      public void actionPerformed(ActionEvent e) {\n         count++;\n     \
    \    System.out.println(count+\": Action performed - \"+text);\n      }\n    \
    \  public void stateChanged(ChangeEvent e) {\n         count++;\n         System.out.println(count+\"\
    : State changed - \"+text);\n      }\n      public void itemStateChanged(ItemEvent\
    \ e) {\n         count++;\n         System.out.println(count+\": Item state changed\
    \ - \"+text);\n      }\n   }\n}\n```\n\nThis example program creates 3 check boxes.\
    \ Each button has 3 listeners to handle 3 different types of events. A counter\
    \ is used in the listener class to help to identify the order of events.\n\nIf\
    \ you run this program, you will see 3 check boxes: \"Red\", \"Green\" and \"\
    Blue\":\n\n![](Images/image00146.jpeg)\n\n### JCheckBox Listeners\n\nIf you move\
    \ your mouse to the \"Red\" check box, you see 1 \"State changed\" message. If\
    \ you press the \"Red\" check box, you see 2 more \"State changed\" messages.\
    \ If you release the \"Red\" check box, you see 5 more messages. If you move your\
    \ mouse away from the \"Red\" check box, you see 1 more \"State changed\" message.\n\
    \n```\n1: State changed - Red\n\n2: State changed - Red\n3: State changed - Red\n\
    \n4: State changed on - Red\n5: Item state changed - Red\n6: State changed on\
    \ - Red\n7: Action performed - Red\n8: State changed on - Red\n\n9: State changed\
    \ on - Red\n\n10: State changed on - Green\n\n11: State changed on - Green\n12:\
    \ State changed on - Green\n\n13: State changed on - Green\n14: Item state changed\
    \ - Green\n15: State changed on - Green\n16: Action performed - Green\n\n17: State\
    \ changed on - Green\n\n18: State changed on - Green\n```\n\nNote that:\n\n* Action\
    \ event raised only once when you release a check box.\n* Item event (`itemStateChanged`\
    \ method call) is raised only once when you release a check box.\n* Change event\
    \ (`stateChanged` method call) is raised many times, when you move your mouse\
    \ in to and out of a check box, press and release a check box.\n\n[Java Swing\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JCheckBox - Swing\
    \ Check Box Class](#part0036.xhtml)\n\n### isSelected() - Getting State of Check\
    \ Box\n\nThis section provides a tutorial example on how to use the `isSelected()`\
    \ method to know the state of a check box.\n\nIf you are using multiple check\
    \ boxes, you need to keep track of them and use the `isSelected()` method to get\
    \ the state of each of them. Here is a sample program:\n\n```java\n /* JRadioButtonAction.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\npublic class JCheckBoxAction\
    \ implements ActionListener {\n   JCheckBox red; \n   JCheckBox green; \n   JCheckBox\
    \ blue;\n   JLabel myLabel = null;\n   public static void main(String[] a) {\n\
    \      JCheckBoxAction myTest = new JCheckBoxAction();\n      myTest.createFrame();\n\
    \   }\n   public void createFrame() {\n      JFrame f = new JFrame(\"My Check\
    \ Boxes\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container\
    \ c = f.getContentPane();\n      c.setLayout(new BoxLayout(c,BoxLayout.Y_AXIS));\n\
    \      JPanel p = new JPanel();\n      p.setLayout(new GridLayout(3,1));\n\n \
    \   red = new JCheckBox(\"Red\");\n      green = new JCheckBox(\"Green\");\n \
    \     blue = new JCheckBox(\"Blue\");\n      p.add(red);\n      p.add(green);\n\
    \      p.add(blue);\n\n      c.add(p);\n      JButton b = new JButton(\"Done\"\
    );\n      b.addActionListener(this);\n      c.add(b);\n      myLabel = new JLabel(\"\
    Please select\",SwingConstants.CENTER);\n      c.add(myLabel);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent e)\
    \ {\n    String t = \"\";\n    if (red.isSelected()) t += \"Red \";\n    if (green.isSelected())\
    \ t += \"Green \";\n    if (blue.isSelected()) t += \"Blue \";\n    if (t.equals(\"\
    \")) t = \"Nothing selected\";\n      myLabel.setText(t);\n   }\n}\n```\n\nIf\
    \ you run this program, you will see none of the check boxes is selected initially.\
    \ If you click \"Done\", you will get the \"Nothing selected\" message. If you\
    \ select some check boxes, then click \"Done\", you will get all selected items:\n\
    \n![](Images/image00147.jpeg)\n\n### JCheckBox Selected Items\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟JRadioButton - Swing Button\
    \ Class\n\nThis chapter provides tutorial notes and example codes on `JRadioButton`.\
    \ Topics include description of the `JRadioButton` class; example program of creating\
    \ radio buttons and event listeners; example program of identify the selected\
    \ button in a group.\n\n> [javax.swing.JRadioButton and Related Classes](#part0041.xhtml)\n\
    \n> [ActionListener, ChangeListener and ItemListener](#part0042.xhtml)\n\n> [getSelection()\
    \ - Getting Selected Button](#part0043.xhtml)\n\n#### Conclusions:\n\n* `JRadioButton`\
    \ class represents a radio button.\n* `ActionListener`, `ChangeListener`, or `ItemListener`\
    \ interface can be used handle user actions on a radio button.\n* `getSelection()`\
    \ method can be used to detect the selected option in a `ButtonGroup`.\n\nSample\
    \ programs listed in this chapter have been tested with JDK 1.3.1 to 17 on Windows\
    \ and macOS computers.\n"
