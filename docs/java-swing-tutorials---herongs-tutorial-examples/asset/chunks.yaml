  raw: "**Solution 3**: You can create a new window event listener class and add an\
    \ object of this listener class to the JFrame object. In the new window event\
    \ listener, you can implement your owner version of windowClosing() handler method.\
    \ Of course, the quickest way to create a new window event listener class is to\
    \ extend the WindowAdapter class. The following sample code, JFrameClose3.java,\
    \ shows you how to do this.\n\n```\n /* JFrameClose3.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JFrameClose3  {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n      f.setTitle(\"Closing Frame with\
    \ Window Listener\");\n      f.setBounds(100,50,500,300);\n      f.addWindowListener(new\
    \ MyWindowListener());\n      f.setVisible(true);\n   }\n   static class MyWindowListener\
    \ extends WindowAdapter {\n      public void windowClosing(WindowEvent e) {\n\
    \         System.exit(0);\n      }\n   }\n}\n```\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n∟Listing and Interrupting AWT Threads\n\nThis section provides a tutorial example\
    \ on how to list AWT threads and how to interrupt AWT threads with the interrupt()\
    \ method.\n\n**Problem**: I want to know how many threads are created by the Swing\
    \ package and the AWT package. And what will happen if I send the interrupt signal\
    \ to all of them.\n\n**Solution**: This is easy. Just get the list of all threads\
    \ of the current thread group, and interrupt them one by one. Here is a sample\
    \ program to show you how to do this:\n\n```\n /* FrameThreads.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
    import javax.swing.*;\npublic class FrameThreads {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame(\"Frame 1\");\n      f.setBounds(0,0,100,100);\n\
    \      f.setVisible(true);\n      f = new JFrame(\"Frame 2\");\n      f.setBounds(50,50,100,100);\n\
    \      f.setVisible(true);\n      f = new JFrame(\"Frame 3\");\n      f.setBounds(100,100,100,100);\n\
    \      f.setVisible(true);\n      Thread[] l = new Thread[100];\n      int n =\
    \ Thread.enumerate(l);\n      Thread g = null;\n      for (int i=0; i<n; i++)\
    \ {\n         System.out.println(\"Active thread = \"+l[i].getName());\n     \
    \ }\n      Thread t = Thread.currentThread();\n      for (int i=0; i<n; i++) {\n\
    \         try {\n            Thread.sleep(1000*30);\n         } catch (Exception\
    \ e) {\n            System.out.println(\"Interrupted.\");\n         }\n      \
    \   if (t != l[i]) {\n            System.out.println(\"Interrupting thread = \"\
    \n               +l[i].getName());\n            l[i].interrupt();\n         }\n\
    \      }\n   }\n}\n```\n\nIf you run this program with JDK 1.5 or older, you will\
    \ see 3 frame windows showing up on the screen. After every 30 seconds, my program\
    \ will send an interrupt signal to each thread. When the interrupt signal reaches\
    \ the \"Java2D Disposer\" thread, a run-time exception occurs forcing the application\
    \ to terminate. The following list shows you the output of my program:\n\n```\n\
    \ herong> \\Progra~1\\Java\\jdk1.5.0_09\\bin\\java FrameThreads\n\nActive thread\
    \ = main\nActive thread = AWT-Windows\nActive thread = AWT-Shutdown\nActive thread\
    \ = AWT-EventQueue-0\nActive thread = Java2D Disposer\nInterrupting thread = AWT-Windows\n\
    Interrupting thread = AWT-Shutdown\nInterrupting thread = AWT-EventQueue-0\nInterrupting\
    \ thread = Java2D Disposer\nException while removing reference: java.lang.InterruptedException\n\
    java.lang.InterruptedException\n   at java.lang.Object.wait(Native Method)\n \
    \  at java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:111)\n   at java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:127)\n\
    \   at sun.java2d.Disposer.run(Disposer.java:100)\n   at java.lang.Thread.run(Thread.java:534)\n\
    AWT blocker activation interrupted:\njava.lang.InterruptedException\n   at java.lang.Object.wait(Native\
    \ Method)\n   at java.lang.Object.wait(Object.java:429)\n   at sun.awt.AWTAutoShutdown.activateBlockerThread(AWTAutoShut...\n\
    \   at sun.awt.AWTAutoShutdown.setToolkitBusy(AWTAutoShutdown.ja...\n   at sun.awt.AWTAutoShutdown.notifyToolkitThreadBusy(AWTAutoSh...\n\
    \   at sun.awt.windows.WToolkit.eventLoop(Native Method)\n   at sun.awt.windows.WToolkit.run(WToolkit.java:262)\n\
    \   at java.lang.Thread.run(Thread.java:534)\n```\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n∟\"AWT blocker activation interrupted\" Error in JDK 1.6\n\nThis section provides\
    \ a tutorial example on the condition for the 'AWT blocker activation interrupted'\
    \ error in JDK 1.6.0.\n\nWhen I ran the same test program, FrameThreads.java,\
    \ listed in the previous tutorial with JDK 1.6 or JDK 1.7, I got some interesting\
    \ results.\n\nTest 1 - Run FrameThreads.java in a command window and wait:\n\n\
    ```\n herong> \\progra~1\\java\\jdk1.6.0_02\\bin\\java FrameThreads\n\nActive\
    \ thread = main\nActive thread = AWT-Shutdown\nActive thread = AWT-Windows\nActive\
    \ thread = AWT-EventQueue-0\nInterrupting thread = AWT-Shutdown\nInterrupting\
    \ thread = AWT-Windows\nInterrupting thread = AWT-EventQueue-0\n```\n\nAll three\
    \ AWT threads are terminated. But 3 frame windows are still displayed on the screen\
    \ forever. That means the run-time exception issue is fixed now.\n\nNoticed that\
    \ the \"Java2D Disposer\" thread is not there anymore in JDK 1.6.0\\. But if you\
    \ check the parent thread group, the \"system\" thread group, you will see the\
    \ \"Java2D Disposer\" thread. In other words, the \"Java2D Disposer\" thread is\
    \ moved from the \"main\" thread group to its parent, the \"system\" thread group.\n\
    \nTest 2 - Run FrameThreads.java in a command window and run Internet Explorer\
    \ in full screen to hide those 3 frame windows. About 3 minutes later, all 3 frame\
    \ windows are terminated. The console window shows:\n\n```\n herong> \\progra~1\\\
    java\\jdk1.6.0_02\\bin\\java FrameThreads\n\nActive thread = main\nActive thread\
    \ = AWT-Shutdown\nActive thread = AWT-Windows\nActive thread = AWT-EventQueue-0\n\
    Interrupting thread = AWT-Shutdown\nInterrupting thread = AWT-Windows\nInterrupting\
    \ thread = AWT-EventQueue-0\nAWT blocker activation interrupted:\njava.lang.InterruptedException\n\
    \   at java.lang.Object.wait(Native Method)\n   at java.lang.Object.wait(Object.java:485)\n\
    \   at sun.awt.AWTAutoShutdown.activateBlockerThread(AWTAutoShutdow...\n   at\
    \ sun.awt.AWTAutoShutdown.setToolkitBusy(AWTAutoShutdown.java:...\n   at sun.awt.AWTAutoShutdown.notifyToolkitThreadBusy(AWTAutoShutd...\n\
    \   at sun.awt.windows.WToolkit.eventLoop(Native Method)\n   at sun.awt.windows.WToolkit.run(WToolkit.java:290)\n\
    \   at java.lang.Thread.run(Thread.java:619)\n```\n\nThis tells me that the AWT\
    \ package in JDK 1.6 is still having some issues if its threads are interrupted.\
    \ So do not interrupt AWT threads.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n∟JFrame Thread Behavior with JDK 8 to 12\n\nThis section provides a tutorial\
    \ example on JFrame Thread behavior with JDK 1.8 to JDK 12.\n\nI also tested the\
    \ same program in JDK 8 to JDK 15\\. The result is different:\n\nTest 1 - Run\
    \ FrameThreads.java with JDK 15 in a command window and wait:\n\n```\n herong>\
    \ java -version \njava version \"15\" 2020-09-15\nJava(TM) SE Runtime Environment\
    \ (build 15+36-1562)\nJava HotSpot(TM) 64-Bit Server VM (build 15+36-1562, mixed\
    \ mode, sharing)\n\nherong> java FrameThreads.java\nActive thread = main\nActive\
    \ thread = AWT-EventQueue-0\nInterrupting thread = AWT-EventQueue-0\n```\n\nNoticed\
    \ that the \"AWT-Shutdown\" and \"AWT-Windows\" threads are not there anymore.\
    \ They are probably moved to the \"system\" thread group now from the \"main\"\
    \ thread group. The interruption did sent to the AWT-EventQueue-0 threat. But\
    \ the 3 Swing frames were displayed on the screen forever.\n\nTest 2 - Run FrameThreads.java\
    \ in a command window, hide 3 frames behind another window and wait. I got the\
    \ same results as test 1.\n\nThis tells me that AWT packages in JDK 1.8 to JDK\
    \ 15 are still having some issues if its threads are interrupted. But it behaves\
    \ consistently now."
