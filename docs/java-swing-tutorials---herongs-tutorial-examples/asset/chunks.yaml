    \n![](img/image00159.jpeg)\n\n### 作为菜单项的复选框（在 macOS）\n\n关于此教程示例的一些有趣说明：\n\n- 如果对项目项调用了\
    \ `setSelected(true)` 方法，则复选框项可以被列为默认选中状态。在本示例中，“Sound（声音）”复选框项默认是被选中的。\n\n在 macOS\
    \ 电脑上的复选框菜单项似乎存在问题。它们显示时不带复选框图标。如果你在 Windows 电脑上运行相同的程序，将看到如下所示的复选框图标。\n\n![](img/image0160.jpeg)\n\
