    \n### javax.swing.event.MenuListener - 监听器接口\n\n本节提供了一个教程示例，演示了如何使用监听器接口 `javax.swing.event.MenuListener`\
    \ 来捕获由 `JMenu` 对象触发的事件。\n\n与其他任何用户界面组件一样，`JMenu` 对象在用户与之交互时会触发事件。如果你想在 `JMenu`\
    \ 对象发生事件时执行任务，你需要为该 `JMenu` 对象添加事件监听器。为了实现这一点，你需要了解这些 Swing 类、接口和方法：\n\n`javax.swing.event.MenuListener`\
    \ - 一个允许你实现自己的菜单事件处理方法的 Swing 接口：\n\n- `menuSelected(MenuEvent)` - 当菜单被选中时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\
    - `menuDeselected(MenuEvent)` - 当菜单取消选中时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n- `menuCanceled(MenuEvent)`\
    \ - 当菜单被取消时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\n`javax.swing.event.MenuEvent` - 一个代表菜单上发生事件的\
    \ Swing 类。该类最重要的方法是：\n\n- `getSource()` - 方法返回发生事件的 `JMenu` 对象。\n\n"
