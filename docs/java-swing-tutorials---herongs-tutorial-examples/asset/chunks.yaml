    Java Swing 教程 - Herong's 教程示例\n\n∟菜单栏、菜单、菜单项和监听器\n\n∟`javax.swing.event.MenuKeyListener`\
    \ - 菜单按键监听器接口\n\n本节提供了一个教程示例，介绍如何使用 `javax.swing.event.MenuKeyListener` 菜单按键监听器接口，来捕捉在键盘上输入时由\
    \ `JMenuItem` 对象触发的事件。\n\n`JMenuItem` 对象在用户通过在键盘上输入键与其交互时也会触发事件。如果你想在 `JMenuItem`\
    \ 对象发生事件时执行某些任务，你需要为该 `JMenuItem` 对象添加一个事件监听器。要做到这一点，你需要了解以下 Swing 类、接口和方法：\n\n\
    `javax.swing.event.MenuKeyListener` - 一个 Swing 接口，允许你实现自己的菜单项事件处理方法：\n\n*   `menuKeyTyped(MenuKeyEvent)`\
    \ - 当在菜单项按钮上输入按键时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\n*   `menuKeyPressed(MenuKeyEvent)`\
    \ - 当在菜单项按钮上按下按键时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\n*   `menuKeyReleased(MenuKeyEvent)`\
    \ - 当在菜单项按钮上释放按键时调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\n`javax.swing.event.MenuKeyEvent`\
    \ - 一个表示在菜单项上发生事件的 Swing 类。该类中最重要的方法是：\n\n*   `getSource()` - 返回发生事件的 `JRootPane`\
    \ 对象。没有太大用。\n\n*   `getKeyChar()` - 返回触发事件的按键所代表的字符。\n\n*   `getKeyCode()` - 返回触发事件的按键所代表的代码值。\n\
    \n*   `getKeyText()` - 返回给定按键代码值的文本名称。\n\n*   `getPath()` - 返回一个菜单对象列表，表示菜单树中的一条路径。最后一个对象是触发事件的\
    \ `JMenuItem` 对象。\n\n这里我写的一个用于测试 `MenuKeyListener` 接口的示例程序：\n\n```\n /* MenuKeyListenerTest.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ javax.swing.*;\nimport javax.swing.event.*;\npublic class MenuKeyListenerTest\
    \ implements MenuKeyListener {\n   JFrame myFrame = null;\n   public static void\
