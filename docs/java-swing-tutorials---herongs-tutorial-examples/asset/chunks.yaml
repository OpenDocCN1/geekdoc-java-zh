    所以，`BoxLayout` 对于我的例子仍然不够好。\n\n关于 `BoxLayout` 的另一个问题是，为什么构造函数需要容器作为输入。其他布局的构造函数不需要容器。这使得语句看起来非常奇怪：`p.setLayout(new\
    \ BoxLayout(p,...))`。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟容器中的组件布局\n\n∟java.awt.GridLayout`\
    \ - 网格布局\n\n本节提供了一个教程示例，演示了如何创建一个 `GridLayout` 来布局容器中的组件。`GridLayout` 可以将许多元素按预定义的行和列进行排列。\n\
    \n### `java.awt.GridLayout` - 一种具有以下特征的布局：\n\n*   将容器分为行和列。行数和列数是可以配置的。行和列等等划分。\n\
    *   将组件放置在指定的单元格中。\n*   调整每个组件的大小以匹配其单元格的大小。\n*   当容器调整大小时，所有组件都会之调整大小。\n\n再次，我写了另一个程序来尝试使用\
    \ `GridLayout` 显示我的窗口：\n\n```\n /* GridLayoutTest2.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\n\
    public class GridLayoutTest2 {\n   public static void main(String[] a) {\n   \
    \   JFrame myFrame = new JFrame(\"GridLayout Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container myPane = myFrame.getContentPane();\n      myPane.setLayout(new\
    \ GridLayout(2,1));\n      myPane.add(getFieldPanel());\n      myPane.add(getButtonPanel());\n\
    \      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   private static\
    \ JPanel getFieldPanel() {\n      JPanel p = new JPanel();\n      p.setLayout(new\
    \ GridLayout(4,2));\n      p.setBorder(BorderFactory.createTitledBorder(\"Details\"\
    ));\n      p.add(new JLabel(\"Name:\"));\n      p.add(new JTextField(16));\n \
    \     p.add(new JLabel(\"System:\"));\n      p.add(getSystemPanel());\n      p.add(new\
    \ JLabel(\"Language:\"));\n      p.add(getLanguagePanel());\n      p.add(new JLabel(\"\
    Year:\"));\n      p.add(new JComboBox<String>(\n         new String[] {\"2021\"\
    ,\"2022\",\"2023\"}));\n      return p;\n   }\n   private static JPanel getButtonPanel()\
    \ {\n      JPanel p = new JPanel();\n      p.setLayout(new GridLayout(1,2));\n\
    \      p.add(new JButton(\"OK\"));\n      p.add(new JButton(\"Cancel\"));\n  \
    \    return p;\n   }\n   private static JPanel getSystemPanel() {\n      JPanel\
    \ p = new JPanel();\n      p.setLayout(new GridLayout(1,2));\n      JRadioButton\
    \ unixButton = new JRadioButton(\"Unix\",true);\n      JRadioButton winButton\
    \ = new JRadioButton(\"Window\",false);\n      ButtonGroup systemGroup = new ButtonGroup();\n\
    \      systemGroup.add(unixButton);\n      systemGroup.add(winButton);\n     \
    \ p.add(unixButton);\n      p.add(winButton);\n      return p;\n   }\n   private\
    \ static JPanel getLanguagePanel() {\n      JPanel p = new JPanel();\n      p.setLayout(new\
    \ GridLayout(1,3));\n      p.add(new JCheckBox(\"Java\",true));\n      p.add(new\
    \ JCheckBox(\"C++\",true));\n      p.add(new JCheckBox(\"Perl\",false));\n   \
    \   return p;\n   }\n}\n```\n\n运行它。你觉得结果怎么样？你不喜欢，对吧？\n\n![](img/image175.jpeg)\n\
    \n## 布局 - GridLayout\n\n所有组件在两个方向上都正确对齐了。但所有组件的大小都是错误的。\n\n所以，`GridLayout` 对于我的例子仍然不够好。\n\
