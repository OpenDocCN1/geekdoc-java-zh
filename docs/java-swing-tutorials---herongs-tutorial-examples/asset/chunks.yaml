    \ Tutorial Examples](#part0001.xhtml)\n\n∟SwingWorker - The Background Task Worker\n\
    \nThis chapter provides tutorial notes and example codes on the java.swing.SwingWorker\
    \ class. Topics include quick introduction of java.swing.SwingWorker; Example\
    \ programs for catching final result, publishing intermediate values, updating\
    \ progress property value, and connecting to JProgressBar components.\n\n> [What\
    \ Is SwingWorker Class?](#part0095.xhtml)\n\n> \n\n> [SwingWorker Example using\
    \ done() Method](#part0096.xhtml)\n\n> \n\n> [SwingWorker Example using publish()\
    \ Method](#part0097.xhtml)\n\n> \n\n> [SwingWorker Example using \"progress\"\
    \ Property](#part0098.xhtml)\n\n> \n\n> [SwingWorker Example using JProgressBar](#part0099.xhtml)\n\
    \nConclusion:\n\n*   The java.swing.SwingWorker class is a task worker, which\
    \ performs time consuming tasks in background.\n\n*   A SwingWorker instance interacts\
    \ with 3 threads: the Launching thread, the Worker thread and the Dispatch thread.\n\
    \n*   The Launching thread calls the execute() method to kickoff the task to background\
    \ and returns immediately.\n\n*   The Worker thread executes your own version\
    \ of the doInBackground() method continuously in the background.\n\n*   The Dispatch\
    \ thread wakes up from time to time to notify you on what happened in the Worker\
    \ thread.\n\n*   When doInBackground() is ended, the Dispatch thread notifies\
    \ you by call your version of the done() method.\n\n*   To publish intermediate\
    \ values, you can call the publish(V) method in doInBackground(). The Dispatch\
    \ thread notifies you by calling your version of the process(List<V>) method.\n\
    \n*   To update the progress property, you can call the setProgress(i) method\
    \ in doInBackground(). The Dispatch thread notifies you by calling your version\
    \ of a PropertyChangeListener class.\n\n*   The java.swing.JProgressbar class\
    \ is a UI component designed to show the progress of a background task implemented\
    \ as SwingWorker instance.\n\nSample programs listed in this chapter have been\
    \ tested with JDK 1.3.1 to JDK 17 on Windows and macOS computers.\n\n[Java Swing\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[SwingWorker -\
    \ The Background Task Worker](#part0094.xhtml)\n\n∟What Is SwingWorker Class?\n\
    \nThis section describes what is javax.swing.SwingWorker class - An abstract class\
    \ introduced in JDK 1.6 as part of the Swing package, that you can extend the\
    \ SwingWorker class to perform a time intensive computing task in the background\
    \ to avoid holding the UI component response time for too long.\n\n**What Is SwingWorker\
    \ Class?** javax.swing.SwingWorker class is an abstract class introduced in JDK\
    \ 1.6 as part of the Swing package. You can extend the SwingWorker class to perform\
    \ a time intensive computing task in the background to avoid holding the UI component\
    \ response time for too long.\n\nWhen using the SwingWorker class to perform a\
    \ background task, there are three threads involved in the execution flow:"
