    and install `JDK 15` on my macOS computer.

    - Open the Java SE Download page with this URL: [https://www.oracle.com/technetwork/java/javase/downloads/](https://www.oracle.com/technetwork/java/javase/downloads/).

    - Click "JDK Download" under "Java SE 15". You will see a new page with a list
    of different download files of "Java SE Development Kit 15 Downloads".

    - Click the hyper link of `jdk-15_osx-x64_bin.dmg`, next to "macOS Installer -
    179.31 MB".

    - Accept the license agreement and finish the download. The download file `jdk-15_osx-x64_bin.dmg`
    will be saved in your `~/Downloads` folder.

    - Double-click on `jdk-15_osx-x64_bin.dmg` to open the installation package.

    - Double-click `JDK 15.pkg` to start the installation wizard.

    - The installation wizard will guide you to finish the installation.

