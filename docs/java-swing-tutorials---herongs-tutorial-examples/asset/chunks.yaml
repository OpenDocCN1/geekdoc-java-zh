    \n∟Creating Frames with Sizes and Locations\n\nThis section provides a tutorial\
    \ example on how to create a frame with a given size and a given location with\
    \ setBounds() and setVisible() methods.\n\n**Problem**: I want to create a frame\
    \ window with a specific size and display it on the screen at a specific location.\n\
    \n**Solution**: You can use the JFrame.setBounds() method define the frame location\
    \ and size. Then use the setVisible() method to make the frame visible on the\
    \ screen. The following sample code, JFrameTest.java, shows you how to do this.\n\
    \n```\n import javax.swing.*;\npublic class JFrameTest {\n   public static void\
    \ main(String[] a) {\n      JFrame f = new JFrame(\"Frame Title\");\n      f.setBounds(50,50,150,150);\n\
    \      f.setVisible(true);\n   }\n}\n```\n\nIf you run this example, you will\
    \ get:\n\n![](Images/image00133.jpeg)\n\nJFrame Test\n\nNote 1: The size specified\
    \ in the setBounds() method includes both the content area and the title area\
    \ of the frame.\n\nNote 2: After executing the f.setVisible(true) statement, the\
    \ main() method reaches the end of execution. But the execution of the entire\
    \ program is not terminated. This is due the fact that the f.setVisible(true)\
    \ statement actually launches new execution threads, AWT threads. Those threads\
    \ are still running even after the main thread reaches the end.\n\nNote 3: When\
    \ you click the close icon, the frame will be removed from the screen. But the\
    \ execution of the entire program is not terminated. Removing all frames from\
    \ the screen does not force all AWT threads to end.\n\n[Java Swing Tutorials -\
    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n∟Closing Frame and Terminating Application\n\nThis section provides 3 solutions\
    \ and sample programs on how to close the main frame and terminate the application.\n\
    \n**Problem**: I have a frame window displayed on the screen and I want to close\
    \ the frame and terminate the application, when user invokes the close command\
    \ from the window's system menu, or clicks on the close icon from the window's\
    \ system icon list.\n\n**Solution 1**: You can use the JFrame.setDefaultCloseOperation()\
    \ method to change the default behavior option of JFrame responding to the window\
    \ closing event. Select the EXIT_ON_CLOSE option will terminate the application\
    \ immediately. Of course, when the application is terminated, all frames will\
    \ be closed automatically. The following sample code, JFrameClose1.java, shows\
    \ you how to do this.\n\n```\n /* JFrameClose1.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport javax.swing.*;\npublic class\
    \ JFrameClose1 {\n   public static void main(String[] a) {\n      JFrame f = new\
    \ JFrame();\n      f.setTitle(\"Closing Frame with Default Close Operation\");\n\
    \      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n}\n```\n\n**Solution 2**: You can extend JFrame\
    \ class to have your own frame class, so that you can override the default processWindowEvent()\
    \ method to terminate the application. Of course, calling System.exit(0) is the\
    \ quickest way to terminate an application. The following sample code, JFrameClose2.java,\
    \ shows you how to do this.\n\n```\n /* JFrameClose2.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JFrameClose2  {\n   public static void main(String[]\
    \ a) {\n      MyJFrame f = new MyJFrame();\n      f.setTitle(\"Closing Frame with\
    \ Process Window Event\");\n      f.setBounds(100,50,500,300);\n      f.setVisible(true);\n\
    \   }\n   static class MyJFrame extends JFrame {\n      protected void processWindowEvent(WindowEvent\
    \ e) {\n         if (e.getID() == WindowEvent.WINDOW_CLOSING) {\n            System.exit(0);\n\
    \         }\n      }\n   }\n}\n```"
