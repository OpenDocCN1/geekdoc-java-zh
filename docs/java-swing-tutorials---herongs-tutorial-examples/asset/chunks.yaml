- fmt: "\nThis section provides a tutorial example on how to use `java.awt.event.ItemListener`,\
    \ radio button and check box item listener interface, to catch state changed item\
    \ vents on radio button menu item objects.\n\nSince `JRadioButtonMenuItem` class\
    \ is a special menu item class, it supports another event listener, `ItemListener`,\
    \ which allows you to catch radio button state changed events:\n\n`java.awt.event.ItemListener`\
    \ - An AWT interface that allows you to implement your own radio button state\
    \ changed event handler methods:\n\n- `itemStateChanged(ItemEvent)` - Event handler\
    \ method called when the state of the associated button is changed. You need to\
    \ implement this method to perform your own task.\n\n`java.awt.event.ItemEvent`\
    \ - An AWT class that represents an event occurred on a radio button. The most\
    \ important method in this class is:\n\n- `getStateChange()` - Method returns\
    \ an integer: 1 if state is changed to selected or 2 if state is changed to deselected.\n\
    \nHere is an example program I wrote to test the `ItemListener` interface:\n\n\
    ```java\n /* JRadioButtonMenuItemListenerTest.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JRadioButtonMenuItemListenerTest {\n   JFrame myFrame\
    \ = null;\n   public static void main(String[] a) {\n      (new JRadioButtonMenuItemListenerTest()).test();\n\
    \   }\n   private void test() {\n      myFrame = new JFrame(\"Menu Listener Test\"\
    );\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      myFrame.setBounds(50,50,250,150);\n\
    \      myFrame.setContentPane(new JDesktopPane());\n\n      JMenuBar myMenuBar\
    \ = new JMenuBar();\n      JMenu myMenu = getFileMenu();\n      myMenuBar.add(myMenu);\n\
    \      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\n      MyMenuItem\
    \ myItem = new MyMenuItem(\"Help\");\n      myMenuBar.add(myItem);\n\n      myFrame.setJMenuBar(myMenuBar);\n\
    \      myFrame.setVisible(true);\n   }\n   private JMenu getFileMenu() {\n   \
    \   JMenu myMenu = new JMenu(\"File\");\n      MyMenuItem myItem = new MyMenuItem(\"\
    Open\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"Close\");\n\
    \      myMenu.add(myItem);\n      myMenu.addSeparator();\n      myItem = new MyMenuItem(\"\
    Exit\");\n      myMenu.add(myItem);\n      return myMenu;\n   }\n   private JMenu\
    \ getColorMenu() {\n      JMenu myMenu = new JMenu(\"Color\");\n      ButtonGroup\
    \ myGroup = new ButtonGroup();\n      MyRadioButtonMenuItem myItem \n        \
    \ = new MyRadioButtonMenuItem(\"Red\");\n      myItem.setSelected(true);\n   \
    \   myGroup.add(myItem);\n      myMenu.add(myItem);\n      myItem = new MyRadioButtonMenuItem(\"\
    Green\");\n      myGroup.add(myItem);\n      myMenu.add(myItem);\n      myItem\
    \ = new MyRadioButtonMenuItem(\"Blue\");\n      myGroup.add(myItem);\n      myMenu.add(myItem);\n\
    \      return myMenu;\n   }\n   private class MyMenuItem extends JMenuItem \n\
    \      implements ActionListener {\n      public MyMenuItem(String text) {\n \
    \        super(text);\n         addActionListener(this);\n      }\n      public\
    \ void actionPerformed(ActionEvent e) {\n         System.out.println(\"Item clicked:\
    \ \"+e.getActionCommand());\n      }\n   }\n   private class MyRadioButtonMenuItem\
    \ extends JRadioButtonMenuItem\n      implements ActionListener, ItemListener\
    \ {\n      public MyRadioButtonMenuItem(String text) {\n         super(text);\n\
    \         addActionListener(this);\n         addItemListener(this);\n      }\n\
    \      public void actionPerformed(ActionEvent e) {\n         System.out.println(\"\
    Item clicked: \"+e.getActionCommand());\n      }\n      public void itemStateChanged(ItemEvent\
    \ e) {\n         System.out.println(\"State changed: \"+e.getStateChange()\n \
    \           +\" on \"+((MyRadioButtonMenuItem) e.getItem()).getText());\n    \
    \  }\n   }\n}\n```\n\nIf you run this example, you will see the frame window shows\
    \ up with the menu bar like this:\n\n![](Images/image00163.jpeg)\n\nRadio Button\
    \ Menu Item Listener Test\n\nIf you click the \"Help\" menu item and click menu\
    \ items in the \"Color\" menu, you will see some messages printed on the Java\
    \ console window:\n\n```\n State changed: 1 on Red\nItem clicked: Help\nItem clicked:\
    \ Red\nItem clicked: Red\nState changed: 2 on Red\nState changed: 1 on Green\n\
    Item clicked: Green\nState changed: 2 on Green\nState changed: 1 on Blue\nItem\
    \ clicked: Blue\n```\n\nInteresting notes about this tutorial example:\n\n- I\
    \ used inner class `MyRadioButtonMenuItem` to create radio button menu items with\
    \ both `ActionListener` and `ItemListener` interfaces implemented in the inner\
    \ class.\n\n- `e.getActionCommand()` expression is used to get action command\
    \ string, the menu item button text in this case.\n\n- `e.getStateChange()` expression\
    \ is used to get state changed signal\n\n- Clicking on a selected radio button\
    \ does not trigger any item events.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[Menu Bar, Menus, Menu Items and Listeners](#part0052.xhtml)\n\
    \n∟Item Listener on Check Box Menu Items\n\nThis section provides a tutorial example\
    \ on how to use `java.awt.event.ItemListener`, radio button and check box item\
    \ listener interface, to catch state changed item vents on radio button menu item\
    \ objects.\n\nSince `JRadioButtonMenuItem` class is a special menu item class,\
    \ it supports another event listener, `ItemListener`, which allows you to catch\
    \ radio button state changed events:\n\n`java.awt.event.ItemListener` - An AWT\
    \ interface that allows you to implement your own radio button state changed event\
    \ handler methods:\n\n- `itemStateChanged(ItemEvent)` - Event handler method called\
    \ when the state of the associated button is changed. You need to implement this\
    \ method to perform your own task.\n\n`java.awt.event.ItemEvent` - An AWT class\
    \ that represents an event occurred on a radio button. The most important method\
    \ in this class is:\n\n- `getStateChange()` - Method returns an integer: 1 if\
    \ state is changed to selected or 2 if state is changed to deselected.\n"
