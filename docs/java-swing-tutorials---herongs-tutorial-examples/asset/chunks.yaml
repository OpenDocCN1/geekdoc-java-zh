    \n# Internal Frame Listener\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## Layout of Components in a Container\n\nThis chapter provides tutorial notes\
    \ and example codes on component layout. Topics include introduction of component\
    \ layout; tutorial examples of BorderLayout, FlowLayout, BoxLayout, GridLayout,\
    \ and GridBagLayout.\n\n> [What Is Layout?](#part0072.xhtml)\n> [java.awt.BorderLayout\
    \ - Border Layout](#part0073.xhtml)\n> [java.awt.FlowLayout - Flow Layout](#part0074.xhtml)\n\
    > [java.awt.BoxLayout - Box Layout](#part0075.xhtml)\n> [java.awt.GridLayout -\
    \ Grid Layout](#part0076.xhtml)\n> [java.awt.GridBagLayout - Grid Bag Layout](#part0077.xhtml)\n\
    \n### Conclusions:\n\n*   A layout is a set of rules that defines how graphical\
    \ components should be positioned in a container.\n*   Java provides 5 built-in\
    \ layouts: Border, Flow, Box, Grid, and Grid Bag layouts.\n*   `java.awt.BorderLayout`\
    \ class allows you to manage the Border layout, which displays 5 components in\
    \ east, south, west, north, and center regions.\n*   `java.awt.FlowLayout` class\
    \ allows you to manage the Flow layout, which displays unlimited number of components\
    \ in sequentially in the horizontal direction and wraps around at the right edge\
    \ of the container.\n*   `java.awt.BoxLayout` class allows you to manage the Box\
    \ layout, which displays unlimited number of components in sequentially in the\
    \ horizontal or vertical direction. Components are resized to fit the container\
    \ width.\n*   `java.awt.GridLayout` class allows you to manage the Grid layout,\
    \ which displays unlimited number of components in rows and columns. Components\
    \ are resized to fit the container.\n*   `java.awt.GridBagLayout` class allows\
    \ you to manage the Grid Bag layout, which displays components in rows and columns.\n\
    \nSample programs in this chapter have been tested with JDK 1.3 on Windows and\
    \ macOS.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n## Layout of Components in a Container](#part0071.xhtml)\n\n### What Is Layout?\n\
    \nA layout is a set of rules that defines how graphical components should be positioned\
    \ in a container.\n\nThere two ways to position a component is a container:\n\n\
    *   Using a predefined layout and allowing the layout to decide where to position\
    \ it. This is a soft way of positioning a component. If the container changes\
    \ its size, the component's position will be adjusted. But you may not able to\
    \ get precisely where you want to be.\n*   Specifying the position of the component\
    \ using the container's coordinates. This is a hard way of positioning a component.\
    \ You can get precisely where you want to be. But if the container changes its\
    \ size, the component's position will not be adjusted.\n\nAWT offers a number\
    \ of predefined layouts for you to use:\n\n*   `java.awt.BorderLayout` - Divides\
    \ the container into five regions: east, south, west, north, and center and assigns\
    \ one component for each region.\n*   `java.awt.FlowLayout` - Takes unlimited\
    \ number of components and let them flow naturally horizontally, then vertically.\n\
    *   `java.awt.BoxLayout` - Takes unlimited number of components and let them flow\
    \ horizontally or vertically in one direction.\n*   `java.awt.GridLayout` - Divides\
    \ the container into rows and columns and assigns one component for each cell.\n\
    *   `java.awt.GridBagLayout` - Divides the container into rows and columns and\
    \ assigns one component for each cell with cell sizes not equal.\n\n### Border\
    \ Layout\n\nThis section provides a tutorial example on how to create a BorderLayout\
    \ to layout components in a container. BorderLayout has 5 fixed sections - north,\
    \ south, west, east and center.\n\n**java.awt.BorderLayout** - A very simple layout\
    \ that:\n\n*   Divides the container into five regions: east, south, west, north,\
    \ and center.\n*   Takes maximum 5 components only, one per region.\n*   Resizes\
    \ each component to match the size of its region.\n*   Acts as the default layout\
    \ in a container.\n*   Resizes each region when the container is resized.\n"
