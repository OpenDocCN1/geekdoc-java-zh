  trans: "\n解决方案：你可以创建一个新的窗口事件监听器类，并将该监听器类的对象添加到 `Frame` 对象中。在新的窗口事件监听器中，你可以实现你自己的版本的\
    \ `windowClosing()` 处理器方法。当然，创建新窗口事件监听器类最快的方法是扩展 `WindowAdapter` 类。\n\n下面的示例代码\
    \ `FrameClose.java` 展示了如何实现这一点。\n\n```java\n /* FrameClose.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\n\
    import java.awt.event.WindowAdapter;\nimport java.awt.event.WindowEvent;\npublic\
    \ class FrameClose  {\n   public static void main(String[] a) {\n      Frame f\
    \ = new Frame();\n      f.setTitle(\"Closing Frame with Window Listener\");\n\
    \      f.setBounds(100,50,500,300);\n      f.addWindowListener(new MyWindowListener());\n\
    \      f.setVisible(true);\n   }\n   static class MyWindowListener extends WindowAdapter\
    \ {\n      public void windowClosing(WindowEvent e) {\n         System.exit(0);\n\
    \      }\n   }\n}\n```\n\nJava Swing 教程 - Herong 的教程示例\n\n∟AWT (抽象窗口工具包)\n\n∟绘制图形\
    \ - 在 Frame 或 Component 上使用 `paint()`\n\n本节提供了一个教程示例，介绍如何重写 `javax.awt.Frame`\
    \ 类中的 `paint()` 方法在帧窗口上绘制图形（矩形），或者重写 `java.awt.Component` 类中的 `paint()` 方法来绘制图形并将组件添加到帧窗口中。\n\
    \n### 问题：我想在在帧中绘制一些图形。\n\n### 解决方案 1：你可以通过扩展 Frame 类来创建你自己的帧类，从而重写 `paint()` 方法，非常容易地实现这一点。`paint()`\
    \ 方法提供了一个 `Graphics` 对象，它将为你提供绘制各种类型图形的实用方法。下面的示例代码 `FramePaint1.java` 展示了如何实现这一点。\n\
    \n```java\n /* FramePaint1.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
    \ Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Graphics;\npublic\
    \ class FramePaint1 {\n   public static void main(String[] a) {\n      MyFrame\
    \ f = new MyFrame();\n      f.setTitle(\"Drawing Graphics in a Frame Directly\"\
    );\n      f.setBounds(100,50,500,300);\n      f.setVisible(true);\n   }\n   static\
    \ class MyFrame extends Frame {\n      public void paint(Graphics g) {\n     \
    \    g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\n如果你运行这个示例，你将得到：\n\n![](img/image00135.jpeg)\n\
    \n在 Frame 上使用 `paint()`\n\n注意 1：`paint()` 方法是 `Frame` 类继承自 `Component` 类的。每当该组件需要绘制时，它就会被调用。\n\
    \n注意 2：如果你查看帧上显示的矩形，你会发现绘制坐标的原点位于整个帧的左上角，包括标题栏。\n\n注意 3：在默认情况下，在 JDK 1.4、1.5 和\
    \ 1.6 中，`paint()` 方法提供透明背景。这就是为什么你在图片中看到了一个网页。\n\n注意 4：在 JDK 7 及更高版本中，`paint()`\
    \ 方法不再提供透明背景。\n\n不推荐使用这种解决方案。我们不想在帧的标题栏区域绘制图形。\n\n### 解决方案 2：显然，解决方案 1 并不理想，因为我们是在帧本身的\
    \ UI 元素上绘制图形。为了只在帧的内容区域绘制图形，我们可以创建一个带有其自己的 `paint()` 方法的新组件，并将其添加到帧中。下面的示例代码 `FramePaint2.java`\
    \ 展示了如何实现这一点。\n\n```java\n /* FramePaint2.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Graphics;\n\
    import java.awt.Component;\npublic class FramePaint2 {\n   public static void\
    \ main(String[] a) {\n      Frame f = new Frame();\n      f.setTitle(\"Drawing\
    \ Graphics in a Frame\"\n         +\" by Adding a Component\");\n      f.setBounds(100,50,500,300);\n\
    \      f.add(new MyComponent());\n      f.setVisible(true);\n   }\n   static class\
    \ MyComponent extends Component {\n      public void paint(Graphics g) {\n   \
    \      g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\n如果你运行这个示例，你将得到：\n\n\
    ![](img/image00195.jpeg)\n\n在 Component 上使用 `paint()`\n\n注意 1：由于新添加的组件没有尺寸和位置，它占据了内容面板的整个区域，即不包含标题栏在内的整个区域。\n\
    \n注意 2：现在绘制坐标的原点位于内容面板的左上角，比解决方案 1 好得多。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟AWT\
    \ (抽象窗口工具包)\n\n∟带有 java.awt.Label\n\n本节提供了一个教程示例，介绍如何通过 `java.awt.Label` 来创建一个标签。\n\
    \n问题：我想在帧中创建一个标签。\n\n解决方案：通过扩展 Frame 类来创建你自己的帧类，从而重写 `paint()` 方法，非常容易地实现这一点。`paint()`\
    \ 方法提供了一个 `Graphics` 对象，它将为你提供绘制各种类型图形的实用方法。这里有一个示例程序：\n\n```java\n /* LabelHello.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.Frame;\nimport java.awt.Label;\npublic class LabelHello {\n   public\
    \ static void main(String[] a) {\n      Frame f = new Frame(\"Label\");\n    \
    \  Label l = new Label(\"Hello!\");\n      f.add(l);\n      f.pack();\n      f.setVisible(true);\n\
    \   }\n}\n```\n\n如果你运行这个示例，你将得到：\n\n![](img/image00135.jpeg)\n\nAWT 测试\n\n注意：`pack()`\
    \ 方法使窗口大小适应其子组件。\n\n"
- fmt: "\nThe button works well. If you click the button, the button label text will\
    \ change from \"On\" to \"Off\"; and from \"Off\" to \"On\", if you click it again.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[AWT\
    \ (Abstract Windows Toolkit)](#part0100.xhtml)\n\n### AWT Button Action Handler\
    \ at the Frame Level\n\nThis section provides a tutorial example on how to create\
    \ an AWT button to handle actions by adding the `ActionListener` interface to\
    \ the frame that contains the button component.\n\nIn the previous section, we\
    \ extended the button to handle its own action. That works fine, if the action\
    \ only requires modifying the behavior of the same button.\n\nBut if the action\
    \ requires modifying the behavior of other components, you need to implement the\
    \ action listener as a higher level. The following program shows you how to use\
    \ the action handler to modify the text of a label component:\n\n```java\n /*\
    \ ButtonAction2.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n\
    \ */\nimport java.awt.Frame;\nimport java.awt.Button;\nimport java.awt.Label;\n\
    import java.awt.GridLayout;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    public class ButtonAction2 implements ActionListener {\n   Button myButton = null;\n\
    \   Label myLabel = null;\n   String text = null;\n   public static void main(String[]\
    \ a) {\n      ButtonAction2 myTest = new ButtonAction2();\n      myTest.createFrame();\n\
    \   }\n   public void createFrame() {\n      Frame f = new Frame(\"My Switch Button\"\
    );\n      f.setLayout(new GridLayout(2,1));\n      text = \"On\";\n      myButton\
    \ = new Button(text);\n      myButton.addActionListener(this);\n      f.add(myButton);\n\
    \      myLabel = new Label(text);\n      f.add(myLabel);\n      f.pack();\n  \
    \    f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent e)\
    \ {\n      if (text.equals(\"On\")) text = \"Off\";\n      else text = \"On\"\
    ; \n      myButton.setLabel(text);\n      myLabel.setText(text);\n   }\n}\n```\n\
    \nIf you run this example, you will get:\n\n![](Images/image00199.jpeg)\n\n####\
    \ AWT Button Action Handler\n\nThe button works nicely. If you click the button,\
    \ the button label text will change from \"On\" to \"Off\", and the text of the\
    \ label component will also change.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\
    \n### AWT Button Mouse Click Handler at the Frame Level\n\nThis section provides\
    \ a tutorial example on how to create an AWT button to handle actions by adding\
    \ the `MouseAdapter` interface to the frame that contains the button component.\n\
    \nOf course, using `ActionListeners` is not the only way to handle user clicks\
    \ on buttons. You can also use `MouseListeners` to handle user clicks. Here is\
    \ an example program:\n\n```java\n /* ButtonAction3.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Button;\n\
    import java.awt.Label;\nimport java.awt.GridLayout;\nimport java.awt.event.MouseEvent;\n\
    import java.awt.event.MouseAdapter;\npublic class ButtonAction3 extends MouseAdapter\
    \ {\n   Button myButton = null;\n   Label myLabel = null;\n   String text = null;\n\
    \   public static void main(String[] a) {\n      ButtonAction3 myTest = new ButtonAction3();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      Frame\
    \ f = new Frame(\"My Switch Button\");\n      f.setLayout(new GridLayout(2,1));\n\
    \      text = \"On\";\n      myButton = new Button(text);\n      myButton.addMouseListener(this);\n\
    \      f.add(myButton);\n      myLabel = new Label(text);\n      f.add(myLabel);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   public void mouseClicked(MouseEvent\
    \ e) {\n      if (text.equals(\"On\")) text = \"Off\";\n      else text = \"On\"\
    ; \n      myButton.setLabel(text);\n      myLabel.setText(text);\n   }\n}\n```\n\
    \nIf you run this example, you will get:\n\n![](Images/image00200.jpeg)\n\n####\
    \ AWT Button Mouse Adapter\n\nThe button works nicely. If you click the button,\
    \ the button label text will change from \"On\" to \"Off\", and the text of the\
    \ label component will also change.\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n\
    \n### AWT TextField and ActionListener\n\nThis section provides a tutorial example\
    \ on how to create an AWT text field with an event handler implemented as the\
    \ `ActionListener` listener.\n\nAWT `TextField` component can trigger `ActionEvent`\
    \ directly. Here is a sample program to show you how `TextField` `ActionEvent`\
    \ works:\n\n```java\n /* TextFieldTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.TextField;\n\
    import java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\npublic\
    \ class TextFieldTest {\n   public static void main(String[] a) {\n      Frame\
    \ f = new Frame(\"Text Test\");\n      TextField t = new TextField(16);\n    \
    \  f.add(t);\n      f.pack();\n      f.setVisible(true);\n   }\n   private static\
    \ class MyTextField extends TextField\n      implements ActionListener {\n   \
    \   static int count = 0;\n      public MyTextField(int l) {\n         super(l);\n\
    \         addActionListener(this);\n      }\n      public void actionPerformed(ActionEvent\
    \ e) {\n         count++;\n         System.out.println(count+\": Action performed\
    \ - \"+getText());\n      }\n   }\n}\n```\n\nRun this program and do the following\
    \ in the text field:\n\n* Type \"Hello\".\n* Press the key.\n\n* Type \"World!\"\
    .\n* Press the key.\n\nThe text field should look like:\n\n![](Images/image00201.jpeg)\n\
    \n#### AWT TextField ActionListener\n\nAnd you should get the following output\
    \ in the console:\n\n```\n1: Action performed - Hello\n2: Action performed - World!\n\
    ```\n\nThe output confirms that:\n\n* `ActionListener` is called when the key\
    \ is pressed.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[AWT (Abstract Windows Toolkit)](#part0100.xhtml)\n"
