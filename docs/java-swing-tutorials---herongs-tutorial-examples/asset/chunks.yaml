    \      JMenuItem item = (JMenuItem) path[path.length-1];\n      System.out.println(\"\
    Key typed: \"+e.getKeyChar()\n         + \", \"+e.getKeyText(e.getKeyCode())\n\
    \         + \" on \"+item.getText());\n   }\n   public void menuKeyPressed(MenuKeyEvent\
    \ e) {\n      MenuElement[] path = e.getPath();\n      JMenuItem item = (JMenuItem)\
    \ path[path.length-1];\n      System.out.println(\"Key typed: \"+e.getKeyChar()\n\
    \         + \", \"+e.getKeyText(e.getKeyCode())\n         + \" on \"+item.getText());\n\
    \   }\n   public void menuKeyReleased(MenuKeyEvent e) {\n      MenuElement[] path\
    \ = e.getPath();\n      JMenuItem item = (JMenuItem) path[path.length-1];\n  \
    \    System.out.println(\"Key typed: \"+e.getKeyChar()\n         + \", \"+e.getKeyText(e.getKeyCode())\n\
    \         + \" on \"+item.getText());\n   }\n}\n```\n\nInteresting notes about\
    \ this example:\n\n* I implemented two interfaces on the main class: `ActionListener`\
    \ and `MenuKeyListener`.\n* `myItem.setMnemonic(KeyEvent.VK_*)` statement is used\
    \ to assign a specific mnemonic to a menu item.\n* When the \"b\" key was typed,\
    \ 3 menu pressed events were fired from \"Red\", \"Green\", and \"Bleu\" menu\
    \ items. 1 action event was fired from the \"Blue\" menu item, because \"b\" matches\
    \ its mnemonic.\n* When the action event was fired, it stopped key typed and key\
    \ released events by the \"b\" key.\n* When the \"s\" key is typed, no action\
    \ event was fired, because it did not match any mnemonics defined on menu items.\n\
    \nThere seems to be a problem with the `setMnemonic()` method on macOS computers.\
    \ It is not adding the underscore sign to the mapped key in the menu item. If\
    \ you run the same program on a Windows computer, you will see underscore displayed\
    \ as shown below.\n\n![](Images/image0166.jpeg)\n\nMenu Item Mnemonic Test (on\
    \ macOS)\n\nIf you run this example, you will see the frame shows like this:\n\
    \n![](Images/image0167.jpeg)\n\nMenu Item Mnemonic Test (on Windows)\n\nIf you\
    \ click the \"Color\" menu then type the \"b\" key. Or type the \"s\" key again.\
    \ You will see some messages printed on Java console:\n\n```\n Item clicked: Blue\n\
    \ Key pressed: b, Red\n Key pressed: b, Green\n Key pressed: b, Blue\n Key pressed:\
    \ s, Red\n Key pressed: s, Green\n Key pressed: s, Blue\n Key pressed: s, Help\n\
    \ Key typed: s, Unknown 0 on Red\n Key typed: s, Unknown 0 on Green\n Key typed:\
    \ s, Unknown 0 on Blue\n Key typed: s, Unknown 0 on Help\n Key released: s, S\
    \ on Red\n Key released: s, S on Green\n Key released: s, S on Blue\n Key released:\
    \ s, S on Help\n```\n\n## setAccelerator() - Setting Keyboard Accelerators on\
    \ Menu Items\n\nFor users to invoke a menu item without its menu popped up, we\
    \ need to assign an accelerator, key combination, to that menu item with the `setAccelerator()`\
    \ method.\n"
