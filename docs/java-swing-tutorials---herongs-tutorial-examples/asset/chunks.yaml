    \ thread）。\n- 输出中的日志消息“22:50:44.236 AWT-EventQueue-0: process() receiving values:\
    \ 4”同样显示在调用 4 次 `publish()` 后，`process()` 方法仅被调用一次，因为 4 个中间值作为参数传递了。\n- 输出中的日志消息“22:50:45.236”显示\
    \ `process()` 的最后一次调用发生在 doInBackground()` 结束后。\n\n下面的图片让你了解启动线程（Launching thread）、工作线程（Worker\
    \ thread）和调度线程是如何协作工作的。在这个示例中，我在 `doInBackground()` 方法中反复发布中间值，并使用 `process()`\
    \ 方法获取它们：\n\n![](img/image0191.jpeg)\n\n### 使用 publish() 方法的 SwingWorker 线程\n\n\
    - Java Swing 教程 - Herong 的教程示例\n- SwingWorker - 后台任务线程\n\n### 使用 \"progress\"\
    \ 属性的 SwingWorker 示例\n\n本节提供了一个教程示例，介绍如何使用 `java.swing.SwingWorker` 类配合 `setProgress()`\
    \ 方法从 `doInBackground()` 方法更新 'progress' 属性值。必须实现 `PropertyChangeListener` 类来捕获调度线程中\
    \ 'progress' 属性的更新值。\n\n**示例 3：更新 \"progress\" 属性并使用它显示进度** - 此示例展示了如何向调度线程通信后台任务的“进度”。只需要实现\
    \ 1 个方法和 1 个监听器类：\n\n- `T doInBackground()` - 要实现的实例方法以执行任务。在 `doInBackground()`\
    \ 中，多次调用 `setProgress(int)` 方法来发布一个整数，用百分比表示后台任务的进度。\n- `class ... implements\
    \ PropertyChangeListener {}` - 监听器类，实现 `propertyChange()` 方法以捕获更新的百分比值。\n\n以下是示例程序的源代码，SwingWorkerUsingProgress.java:\n\
    \n"
- fmt: "\n```java\n /* SwingWorkerUsingProgress.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport javax.swing.SwingWorker;\nimport java.util.Random;\n\
    import java.time.LocalTime;\nimport java.beans.*;\npublic class SwingWorkerUsingProgress\
    \ \n   extends SwingWorker<Object, Object> {\n   int total = 100;\n   int wait\
    \ = 10;\n\n// Extending the SwingWorker class\n   protected Object doInBackground()\
    \ {\n      logMessage(\"doInBackground() started\");\n      int i = 0;\n     \
    \ Random r = new Random();\n      try {\n         while (i<total) {\n        \
    \    Thread.sleep(wait);\n            Integer n = Integer.valueOf(r.nextInt());\n\
    \            setProgress((100*(i+1))/total);\n            i++;\n         }\n \
    \     } catch (Exception e) {\n         e.printStackTrace();\n      }\n      logMessage(\"\
    doInBackground() ended\");\n      return null;\n   }\n\n// Launching my extended\
    \ SwingWorker class\n   public static void main(String[] a) {\n      try {\n \
    \        SwingWorker<Object, Object> worker \n            = new SwingWorkerUsingProgress();\n\
    \         dumpThreads();\n         worker.addPropertyChangeListener(new myListener());\n\
    \         worker.execute();\n         while (true) {\n            dumpThreads();\n\
    \            Thread.sleep(200);\n         }\n      } catch (Exception e) {\n \
    \        e.printStackTrace();\n      }\n   }\n   public static void dumpThreads()\
    \ {\n      System.out.println(LocalTime.now()+\" Thread dump:\");\n      Thread.currentThread().getThreadGroup().list();\n\
    \   }\n   public static void logMessage(String s) {\n      System.out.println(LocalTime.now()+\"\
    \ \"\n         +Thread.currentThread().getName()+\": \"+s);\n   }\n   static class\
    \ myListener implements PropertyChangeListener {\n      public void propertyChange(PropertyChangeEvent\
    \ e) {\n         if (\"progress\".equals(e.getPropertyName())) {\n           \
    \ logMessage(\"propertyChange() \"+e.getNewValue()+\"%\");\n         }\n     \
    \ }\n   }\n}\n```\n\n### Notes on the sample program:\n\n- When extending `SwingWorker<T,V>`,\
    \ I am setting `T` to be `Object` because I am not returning any result; and setting\
    \ `V` to be `Object` because I am not publish any intermediate values.\n\n- `Object\
    \ doInBackground()` is implemented to generate some random numbers. Whenever a\
    \ random number is generated, I call the `setProgress()` method to update the\
    \ property called `\"progress\"` with an integer between 0 and 100 to indicate\
    \ the percentage of the task progress.\n\n- `class myListener {}` is implemented\
    \ with the `java.beans.PropertyChangeListener` interface to be attached to my\
    \ `SwingWorker` instance to listen to value change events on the `\"progress\"\
    ` property.\n\n- `void propertyChange()` is implemented inside `myListener{}`\
    \ to catch the updated `\"progress\"` property value.\n\nIf you compile and run\
    \ this example with JDK 10 or higher, you should get output messages similar to\
    \ these:\n\n```\n herong> java SwingWorkerUsingProgress\n\n20:45:52.387317 Thread\
