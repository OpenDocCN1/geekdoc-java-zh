  trans: "\n\n如果你按下 `<Alt>-f`、`<Alt>-c`、`<Alt>-o` 和 `<Alt>-h`，你将在 Java 控制台窗口中看到一些消息：\n\
    \n```\n Menu Selected: File\nMenu deselected: File\nMenu Selected: Color\nMenu\
    \ deselected: Color\nMenu Selected: Option\nMenu deselected: Option\nMenu Selected:\
    \ Help\nMenu deselected: Help\n```\n\nJava Swing 教程 - Herong 示例\n\n# 在主框架中创建内部帧\n\
    \n本章节提供了关于内部帧（internal frames）的教程笔记和示例代码。主题包括 `javax.swing.JInternalFrame` 类和\
    \ `javax.swing.JInternalFrameListener` 接口的快速介绍；在主框架内部内部帧的示例；添加内部帧监听器的示例。\n\n>\
    \ javax.swing.JInternalFame - 内部帧类\n> JInternalFameTest.java - 内部帧类测试\n> javax.swing.InternalFrameListener\
    \ - 内部帧监听器接口\n\n## 结论\n\n- `javax.swing.JInternalFrame` 类对象代表主框架内部的内部帧。\n- 创建实现\
    \ `javax.swing.JInternalFrameListener` 接口的类允许你添加逻辑来响应由内部帧生成的事件。\n\n本章列出的示例程序已经在\
    \ Windows 和 macOS 电脑上的 JDK 1.3.1 到 JDK 17 上进行了测试。\n\nJava Swing 教程 - Herong 示例\n\
    \n在主框架中创建内部帧\n\n## javax.swing.JInternalFame - 内部帧类\n\n本节描述了 `javax.swing.JInternalFame`\
    \ - 内部帧类，代表普通框架内部的 UI 内部帧。\n\n`javax.swing.JInternalFrame` - 代表普通框架内部 UI 内部帧的\
    \ Swing 类。内部帧支持普通框架几乎的所有功能。将内部帧添加到普通框架中，应该先将内部帧添加到桌面面板（desktop pane），然后将桌面面板作为普通框架的内容面板（content\
    \ pane）。`JInternalFrame` 的有趣方法包括：\n\n- `JInternalFrame(String)` - 构造函数，使用指定的字符串作为帧标题创建内部帧。\n\
    - `setResizable(boolean)` - 设置此帧是否可调整大小的方法。\n- `setClosable(boolean)` - 设置此帧是否可关闭的方法。\n\
    - `setMaximizable(boolean)` - 设置此帧是否可最大化的方法。\n- `setIconifiable(boolean)` - 设置此帧是否可最小化为图标的方法。\n\
    - `setSize(int, int)` - 设置此帧大小的方法。如果不设置，内部帧的大小将为 0 且不可见。\n- `setVisible(boolean)`\
    \ - 设置此帧是否可见的方法。默认设置为不可见，你必须调用 `setVisible(true)` 来显示内部帧。\n- `addInternalFrameListener(InternalFrameListener)`\
    \ - 向此内部帧添加内部帧监听器的方法。\n\n`javax.swing.JDesktopPane` - 代表托管内部帧的容器的 Swing 类。\n\n\
    - `getSelectedFrame()` - 返回被选中的内部帧的方法。\n\n`javax.swing.event.InternalFrameListener`\
    \ - 用于让实现类处理内部帧事件的 Swing 接口。方法包括：\n\n- `internalFrameActivated(InternalFrameEvent)`\
    \ - 当内部帧被激活时调用的方法。\n- `internalFrameClosed(InternalFrameEvent)` - 当内部帧被关闭时调用的方法。\n\
    - `internalFrameClosing(InternalFrameEvent)` - 当内部帧处于关闭过程中调用的方法。\n- `internalFrameDeactivated(InternalFrameEvent)`\
    \ - 当内部帧被取消激活时调用的方法。\n- `internalFrameDeiconified(InternalFrameEvent)` - 当内部帧恢复图标时调用的方法。\n\
    - `internalFrameIconified(InternalFrameEvent)` - 当内部帧最小化为图标时调用的方法。\n- `internalFrameOpened(InternalFrameEvent)`\
    \ - 当内部帧打开时调用的方法。\n\nJava Swing 教程 - Herong 示例\n\n在主框架中创建内部帧\n\n## JInternalFameTest.java\
    \ - 内部帧类测试\n\n本节提供了关于如何使用 `javax.swing.JInternalFame` 类在主框架中创建 2 个内部帧的教程示例。\n\n\
    以下程序展示了如何创建内部帧：\n\n```\n /* JInternalFrameTest.java\n * Copyright (c) 1997-2018\
