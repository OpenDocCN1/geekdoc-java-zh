    \      myFrame.setVisible(true);\n   }\n   private Menu getFileMenu() {\n    \
    \  Menu myMenu = new Menu(\"File\");\n      MyMenuItem myItem = new MyMenuItem(\"\
    Open\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"Close\");\n\
    \      myMenu.add(myItem);\n      myMenu.addSeparator();\n      myItem = new MyMenuItem(\"\
    Exit\");\n      myMenu.add(myItem);\n      return myMenu;\n   }\n   private Menu\
    \ getColorMenu() {\n      Menu myMenu = new Menu(\"Color\");\n      MenuItem myItem\
    \ = new MyMenuItem(\"Red\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"\
    Green\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"Blue\");\n\
    \      myMenu.add(myItem);\n      return myMenu;\n   }\n   private Menu getOptionMenu()\
    \ {\n      Menu myMenu = new Menu(\"Option\");\n      MenuItem myItem = new MyMenuItem(\"\
    Sound\");\n      myMenu.add(myItem);\n      myItem = new MyMenuItem(\"Auto save\"\
    );\n      myMenu.add(myItem);\n      return myMenu;\n   }\n   private class MyMenuItem\
    \ extends MenuItem \n      implements ActionListener {\n      public MyMenuItem(String\
    \ text) {\n         super(text);\n         addActionListener(this);\n      }\n\
    \      public void actionPerformed(ActionEvent e) {\n         System.out.println(\"\
    Item clicked: \"+e.getActionCommand());\n      }\n   }\n}\n```\n\nIf you run this\
    \ example, you will see the frame window shows up with the menu bar like this:\n\
    \n![](Images/image00205.jpeg)\n\n# AWT Menu Item Action Listener Test\n\nIf you\
    \ click the \"Help\" menu item, click \"Open\" and \"Close\" in the \"File\" menu,\
    \ then click \"Red\", \"Green\" and \"Blue\" in the \"Color\" menu, you will see\
    \ some messages printed on the Java console window:\n\n```\n Item clicked: Help\n\
    Item clicked: Open\nItem clicked: Close\nItem clicked: Red\nItem clicked: Green\n\
    Item clicked: Blue\n```\n\n### Interesting notes about this tutorial example:\n\
    \n* `private class MyMenuItem extends MenuItem implements ActionListener` declaration\
    \ is used to create an inner class, `MyMenuItem`, which extends `MenuItem`, implements\
    \ `ActionListener`, and adds itself to handle action events.\n\n* `addActionListener(this);`\
    \ statement is used to add my inner class, `MyMenuItem`, itself to handle action\
    \ events.\n\n* `e.getActionCommand()` expression is used to get action command\
    \ string, the menu item button text in this case.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n ∟ Integration with Desktop System\n\n\
    This chapter provides tutorial notes and example codes on integration with the\
    \ local desktop system. Topics include description of the `javax.awt.Desktop`\
    \ class and its methods; example programs of launch default Web browser, email\
    \ program and file editors of the local desktop system.\n\n> [javax.awt.Desktop\
    \ and Related Methods](#part0116.xhtml)\n\n> [browse() - Launch Default Web Browser](#part0117.xhtml)\n\
    \n> [mail() - Launch Default Email Program](#part0118.xhtml)\n\n> [edit() - Launch\
    \ Default Editor for Given File](#part0119.xhtml)\n\n## Conclusions:\n\n* `javax.awt.Desktop`\
    \ class represents the local desktop system.\n* `getDesktop()` method can be used\
    \ to get an instance of the current local desktop system.\n* `browse(URI)` method\
    \ can be used to launch the default Web browser with the given `URI`.\n* `mail(URI)`\
    \ method can be used to launch the default email program with the given `mailto`\
    \ `URI`.\n* `edit(File)` method can be used to launch the default editor with\
    \ the given file.\n\nSample programs listed in this chapter have been tested with\
    \ JDK 1.6 to JDK 12.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n ∟[Integration with Desktop System](#part0115.xhtml)\n\n ∟javax.awt.Desktop\
    \ and Related Methods\n\nThis section describes the `javax.awt.Desktop` class,\
    \ and its commonly used methods.\n\n`java.awt.Desktop` - An AWT class that helps\
    \ to integrate Java GUI applications with desktop functionalities of the operating\
    \ system. It offers the following interesting methods:\n\n* `getDesktop()` - Method\
    \ to return a `Desktop` object representing the current desktop of the operating\
    \ system.\n* `browse(URI)` - Method to launch the default Web browser with the\
    \ given `URI`.\n* `mail(URI)` - Method to launch the default email program with\
    \ the given `mailto` `URI`.\n* `edit(File)` - Method to launch the default editor\
    \ with the given file.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n ∟[Integration with Desktop System](#part0115.xhtml)\n\n ∟javax.awt.Desktop\
    \ and Related Methods\n\nThis section provides tutorial example on how to use\
    \ `Desktop.browse()` method to launch the default browser on the desktop of the\
    \ operating system. To launch the default browser, you can get the `Desktop` object.\
    \ Here is a sample program:\n\n```java\n /* DesktopBrowser.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
    import java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
    import java.net.URI;\npublic class DesktopBrowser {\n   public static void main(String[]\
    \ a) {\n      try {\n         URI uri = new URI(\"https://www.herongyang.com/Swing\"\
    );\n         Desktop desktop = Desktop.getDesktop();\n         if (desktop !=\
    \ null) {\n            desktop.browse(uri);\n         }\n      } catch (Exception\
    \ e) {\n        e.printStackTrace();\n      }\n   }\n}\n```\n\nIf you run this\
    \ program, you will see the default browser is started with the given Website.\
    \ On my Windows 10 computer, I am getting the Edge launched.\n\n![](Images/image00206.jpeg)\n\
    \n# Launch Web Browser on Desktop\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n ∟[Integration with Desktop System](#part0115.xhtml)\n\
    \n ∟mail() - Default Email Program\n\nThis section provides tutorial example on\
    \ how to use `Desktop.mail()` method to launch the default email program on the\
    \ desktop of the operating system. To launch the default email program, you can\
    \ get the `Desktop` object. Here is a sample program:\n\n```java\n /* DesktopSendEmail.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\n\
    import java.net.URI;\npublic class DesktopSendEmail {\n   public static void main(String[]\
    \ a) {\n      try {\n         String address = \"herong_yang@yahoo.com\";\n  \
    \       String subject = \"Java%20Swing%20Tutorials\";\n         String body =\
    \ \"I%20like%20your%20tutorial%20book!\";\n         URI uri = new URI(\"mailto:\"\
    +address+\"?subject=\"+subject\n        +\"&body=\"+body);\n         Desktop desktop\
    \ = Desktop.getDesktop();\n         if (desktop != null) {\n            desktop.mail(uri);\n\
    \         }\n      } catch (Exception e) {\n        e.printStackTrace();\n   \
    \   }\n   }\n}\n```\n\nNote that I have encoded the email address, subject and\
    \ message body in the `mailto` `URI` string. If you run this program, you will\
    \ see the default email program is started with the given email content. On my\
    \ Windows 10 computer, I am getting the Outlook app launched.\n\n![](Images/image00207.jpeg)\n\
    \n# Launch Email Program on Desktop\n"
