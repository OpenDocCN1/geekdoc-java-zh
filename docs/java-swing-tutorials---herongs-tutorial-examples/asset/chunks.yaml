    \ Worker thread, and the Dispatch thread worked together in this example where\
    \ I am repeatedly publishing intermediate values inside the doInBackground() method,\
    \ and using the process() method to catch them:\n\n![](Images/image00191.jpeg)\n\
    \nSwingWorker Threads using publish() Method\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[SwingWorker - The Background Task Worker](#part0094.xhtml)\n\
    \n∟SwingWorker Example using \"progress\" Property\n\nThis section provides a\
    \ tutorial example on how to use java.swing.SwingWorker class with the setProgress()\
    \ method to update the 'progress' property value from the doInBackground() method.\
    \ A PropertyChangeListener class must be implemented to catch the updated value\
    \ of the 'progress' property in the dispatch thread.\n\n**Example 3: Update \"\
    progress\" property and use it to show progress** - This example shows you how\
    \ to communicate the \"progress\" of a background task to a Dispatch thread. Only\
    \ 1 method and 1 listener class need to be implemented:\n\n*   T doInBackground()\
    \ - Instance method to be implemented to perform the task. Inside doInBackground(),\
    \ the setProgress(int) method is called multiple times to publish an integer to\
    \ indicate the progress of the background task as a percentage number.\n\n*  \
    \ class ... implements PropertyChangeListener {} - Listener class that implements\
    \ the propertyChange() method to catch the updated percentage value.\n\nHere is\
    \ the source code of the example program, SwingWorkerUsingProgress.java:"
