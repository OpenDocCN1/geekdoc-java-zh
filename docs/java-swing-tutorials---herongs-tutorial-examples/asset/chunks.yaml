    \ types of events generated on radio buttons.\n\nAs you can see from the previous\
    \ section, a radio button can have 3 types of event listeners: `ActionListener`,\
    \ `ChangeListener`, and `ItemListener`. The following sample program shows you\
    \ when those listeners are called, and how many times:\n\n```\n /* JRadioButtonTest.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
