    ## JDK (Java Development Kit)(part0003.xhtml)

    ### What Is JDK

    This section describes what `JDK` (Java Development Kit) - a development environment
    for building software applications and components using the Java language.

    `JDK` (Java Development Kit)? `JDK` is short name for Java Platform, Standard
    Edition Development Kit (`JDK™`), developed by Oracle. It is a development environment
    for building software applications and components using the Java language.

    `JDK` includes the following components:

    - `JRE` (Java Runtime Environment) - `JRE` allows you to run Java applications.
    The `JRE` uses `HotSpot` as the `JVM` (Java Virtual Machine) implementing the
    `JVM` specification. See "JVM Tutorials - Herong''s Tutorial Examples" at `herongyang.com/JVM`
    for more tutorials on `JRE`.

    - `JCL` (Java Class Library) - `JCL` is a set of loadable libraries that Java
    applications can call at runtime. `JCL` is organized into Java packages. Some
    packages are wrappers to access native system APIs like `java.io.*`, `java.net.*`,
    `java.awt`, etc. Tutorials on `JCL` are provided in this book.

    - `Java Development Tools` - Tools includes Java compiler, `JAR` tool, class file
    disassembler, debugger, `JRE` builder, etc. See "Java Tools - Herong''s Tutorial
    Examples" at `herongyang.com/Java-Tools` for more tutorials on Java tools.


