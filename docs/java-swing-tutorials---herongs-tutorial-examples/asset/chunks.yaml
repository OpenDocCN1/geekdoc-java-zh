  trans: "\n\n注意：内容面板被我们创建的、带有自定义 `paint()` 方法的新组件对象所取代。\n\nJava Swing 教程 - Herong\
    \ 的教程示例\n\n∟JFrame - 主框架类\n\n### 在框架上绘制中文字符\n\n本节内容提供了一个教程示例，演示了如何使用 `drawString()`\
    \ 方法并选择中文字体在框架上绘制中文字符。\n\n**问题**：我想在框架中绘制一些中文字符。\n\n**解决方案**：你可以按照上一个问题解决方案中的描述进行操作。在\
    \ `paint()` 方法中，首先将 `Graphics` 对象的字体更改为支持中文字符的 Unicode 字体。然后使用 `drawString()`\
    \ 工具方法绘制带有中文字符的字符串。以下示例代码 `JFramePaintChinese.java` 展示了如何实现这一点。\n\n```java\n /*\
    \ JFramePaintChinese.java\n * Copyright (c) 2014-2018 HerongYang.com All Rights\
