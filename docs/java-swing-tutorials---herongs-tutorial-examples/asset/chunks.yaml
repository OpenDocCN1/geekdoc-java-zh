    \ Blue\nKey released: s, S on Help\n```\n\nInteresting notes about this tutorial\
    \ example:\n\n*   I implemented two interfaces on the main class: ActionListener\
    \ and MenuKeyListener.\n\n*   \"myItem.setMnemonic(KeyEvent.VK_*);\" statement\
    \ is used to assign a specific mnemonic to a menu item.\n\n*   When the \"b\"\
    \ key was typed, 3 menu key pressed events were fired from \"Red\", \"Green\"\
    , and \"Bleu\" menu items. 1 action event was fired from the \"Blue\" menu item,\
    \ because \"b\" matches its mnemonic.\n\n*   When the action event was fired,\
    \ it stopped key typed and key released events triggered by the \"b\" key.\n\n\
    *   When the \"s\" key is typed, no action event was fired, because it did not\
    \ match any mnemonics defined on menu items.\n\nThere seems to be a problem with\
    \ the setMnemonic() method on macOS computers. It is not adding the underscore\
    \ sign to the mapped key in the menu item. If you run the same program on a Windows\
    \ computer, you will see underscore signed displayed as shown below.\n\n![](Images/image00167.jpeg)\n\
    \nMenu Item setMnemonic Test (on Windows)\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[Menu Bar, Menus, Menu Items and Listeners](#part0052.xhtml)\n\
    \n∟setAccelerator() - Setting Keyboard Accelerators on Menu Items\n\nThis section\
    \ provides a tutorial example on how to use setAccelerator() method to associate\
    \ accelerators to menu items. Accelerators allows user to interact with menu items\
    \ using keys on keyboard.\n\nKeyboard mnemonics allows users to invoke a menu\
    \ item with a single key. But the menu contains that menu item must be popped\
    \ up first.\n\nFor users to invoke a menu item without its menu popped up, we\
    \ need to assign an accelerator, key combination, to that menu item with the setAccelerator()\
    \ method. Here is how it works:\n\n1\\. Assign difference accelerators, representing\
    \ different key combinations, to different menu items.\n\n2\\. Adding an action\
    \ listener to each menu item.\n\n3\\. When an accelerator, key combination, is\
    \ pressed at any time, the menu item with the matching accelerator will fire an\
    \ action event.\n\nHere is an example program I wrote to test the setAccelerator()\
    \ method:"
