    \n## JComboBox 作为文本字段\n\nJava Swing 教程 - Herong 的教程示例\n\n∟菜单栏、菜单、项目和监听器\n\n本章提供了关于菜单栏、菜单和项目的教程笔记和示例代码。包括\
    \ `JMenuBar`、`JMenu` 和 `JMenuItem` 类介绍；菜单栏、菜单和项目的测试程序；单选框和复选框项目；使用菜单、项目和动作监听器；快捷键和加速键。\n\
    \n> JMenuBar, JMenu, and JMenuItem\n\n> - `JMenuBarTest.java` - 菜单栏测试程序\n\n> -\
    \ `JMenuTest.java` - 菜单测试程序\n\n> - `JMenuItemTest.java` - 项目测试程序\n\n> - `JRadioButtonMenuItemTest.java`\
