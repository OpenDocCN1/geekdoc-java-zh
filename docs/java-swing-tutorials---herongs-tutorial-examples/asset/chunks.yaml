    \nJava Swing 教程 - Herong 的教程示例\n\n## JFrame - 主帧类\n\n本章提供了 `JFrame` 类的教程笔记和示例代码。主题包括：创建指定大小和位置的帧；关闭帧时终止程序；列出\
    \ AWT 线程；在帧上显示中文字；在帧上绘制图形。\n\n- 创建指定大小和位置的帧\n- 关闭帧并终止应用程序\n- 列出和中断 AWT 线程\n- JDK\
    \ 1.6 中的 \"AWT blocker activation interrupted\" 错误\n- JDK 8 到 12 中的 JFrame 线程行为\n\
    - 在帧标题中显示中文字符\n- 绘制图形 - 在帧上使用 paint()\n- 绘制图形 - 在组件上使用 paint()\n- 绘制图形 - 在内容面板上使用\
    \ paint()\n- 在帧上绘制中文字符\n\n### 结论\n\n- `JFrame.setVisible()` 启动 AWT 线程并在屏幕上显示帧。\n\
    - `JFrame.setDefaultCloseOperation()` 可在帧关闭时终止程序。\n- `JFrame.setContentPane()`\
    \ 可用于你自己的组件替换内容面板。\n- 在帧上绘制图形的最佳方法是在其内容面板组件上绘制图形。\n- `JComponent.setFont()` 可用于设置中文字并绘制中文字符。\n\
    \n本章列出的示例程序已在 Windows 和 macOS 电脑上通过了 `JDK 1.3.1` 到 `JDK 17` 的测试。\n\nJava Swing\
    \ 教程 - Herong 的教程示例\n\n### JFrame - 主帧类](#part0016.xhtml)\n\n#### 创建指定大小和位置的帧\n\
    \n本节提供了一个教程示例，介绍如何使用 `setBounds()` 和 `setVisible()` 方法创建一个指定大小和位置的帧。\n\n**问题**：我想创建一个特定大小的帧窗口，并将其显示在屏幕上的特定位置。\n\
    \n**解决方案**：你可以使用 `JFrame.setBounds()` 方法定义帧的位置和大小。然后使用 `setVisible()` 方法使帧可见。\n\
    \n```java\nimport javax.swing.*;\npublic class JFrameTest {\n   public static\
    \ void main(String[] a) {\n      JFrame f = new JFrame(\"Frame\");\n      f.setBounds(50,50,150,150);\n\
    \      f.setVisible(true);\n   }\n}\n```\n\n如果你运行此示例，你将得到：\n\n![](img/image00132.jpeg)\n\
    \n### JFrame 测试\n\n笔记 1：`JFrame.setVisible()` 启动 AWT 线程并在屏幕上显示帧。\n笔记 2：`JFrame.setDefaultCloseOperation()`\
    \ 可在帧关闭时终止程序。\n笔记 3：`JFrame.setContentPane()` 可用于你自己的组件替换内容面板。\n\n"
- fmt: "\n## Solution 3\n\nYou can create a new window event listener class and add\
    \ an object of this listener class to the `JFrame` object. In the new window event\
    \ listener, you can implement your owner version of `windowClosing()` handler\
    \ method. Of course, the quickest way to create a new window event listener class\
    \ is to extend the `WindowAdapter` class. The following sample code, `JFrameClose3.java`,\
    \ shows you how to do this.\n\n```java\n /* JFrameClose3.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.event.*;\n\
    import javax.swing.*;\npublic class JFrameClose3  {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n      f.setTitle(\"Closing Frame with\
    \ Window Listener\");\n      f.setBounds(100,50,500,300);\n      f.addWindowListener(new\
    \ MyWindowListener());\n      f.setVisible(true);\n   }\n   static class MyWindowListener\
    \ extends WindowAdapter {\n      public void windowClosing(WindowEvent e) {\n\
    \         System.exit(0);\n      }\n   }\n}\n```\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[JFrame - Main Frame Class](#part0016.xhtml)\n\
    \n## Listing and Interrupting AWT Threads\n\nThis section provides a tutorial\
    \ example on how to list AWT threads and how to interrupt AWT threads with the\
    \ `interrupt()` method.\n\n**Problem**: I want to know how many threads are created\
    \ by the `Swing` package and the `AWT` package. And what will happen if I send\
    \ the interrupt signal to all of them.\n\n**Solution**: This is easy. Just get\
    \ the list of all threads of the current thread group, and interrupt them one\
    \ by one. Here is a sample program to show you how to do this:\n\n```java\n /*\
    \ FrameThreads.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n\
    \ */\nimport java.awt.*;\nimport javax.swing.*;\npublic class FrameThreads {\n\
    \   public static void main(String[] a) {\n      JFrame f = new JFrame(\"Frame\
    \ 1\");\n      f.setBounds(0,0,100,100);\n      f.setVisible(true);\n      f =\
    \ new JFrame(\"Frame 2\");\n      f.setBounds(50,50,100,100);\n      f.setVisible(true);\n\
    \      f = new JFrame(\"Frame 3\");\n      f.setBounds(100,100,100,100);\n   \
    \   f.setVisible(true);\n      Thread[] l = new Thread[100];\n      int n = Thread.enumerate(l);\n\
    \      Thread g = null;\n      for (int i=0; i<n; i++) {\n         System.out.println(\"\
    Active thread = \"+l[i].getName());\n      }\n      Thread t = Thread.currentThread();\n\
    \      for (int i=0; i<n; i++) {\n         try {\n            Thread.sleep(1000*30);\n\
    \         } catch (Exception e) {\n            System.out.println(\"Interrupted.\"\
    );\n         }\n         if (t != l[i]) {\n            System.out.println(\"Interrupting\
    \ thread = \"\n               +l[i].getName());\n            l[i].interrupt();\n\
    \         }\n      }\n   }\n}\n```\n\nIf you run this program with `JDK 1.5 or\
    \ older, you will see 3 frame windows showing up on the screen. After every 30\
    \ seconds, my program will send an interrupt signal to each thread. When the interrupt\
    \ signal reaches the \"Java2D Disposer\" thread, a run-time exception occurs forcing\
    \ the application to terminate. The following list shows you the output of my\
    \ program:\n\n```\n herong> \\Progra~1\\Java\\jdk1.5.0_09\\bin\\java FrameThreads\n\
    \nActive thread = main\nActive thread = AWT-Windows\nActive thread = AWT-Shutdown\n\
    Active thread = AWT-EventQueue-0\nActive thread = Java2D Disposer\nInterrupting\
    \ thread = AWT-Windows\nInterrupting thread = AWT-Shutdown\nInterrupting thread\
    \ = AWT-EventQueue-0\nInterrupting thread = Java2D Disposer\nException while removing\
