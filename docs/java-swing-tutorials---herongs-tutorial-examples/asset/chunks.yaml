  trans: "\n\n按钮工作正常。如果你点击按钮，按钮的标签文本将从“On”变为“Off”；如果你再次点击它，它将从“Off”变为“On”。\n\nJava\
    \ Swing Tutorials - Herong's Tutorial Examples\n\n∟AWT (Abstract Windows Toolkit)\n\
    \n### 窗口层面的 AWT 按钮动作处理器\n\n本节提供了一个教程示例，展示了如何创建一个 AWT 按钮，通过在包含该按钮组件的窗口上添加 `ActionListener`\
    \ 接口来处理动作。\n\n在上一节中，我们扩展了按钮以以处理其自身的动作。如果动作只需要修改按钮本身的行为，这种方法运行良好良好。\n\n但如果动作需要修改其他组件的行为，你需要在更高层级实现动作监听器。以下程序展示了如何使用动作处理器来修改标签组件的文本：\n\
    \n```java\n /* ButtonAction2.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Button;\n\
    import java.awt.Label;\nimport java.awt.GridLayout;\nimport java.awt.event.ActionEvent;\n\
    import java.awt.event.ActionListener;\npublic class ButtonAction2 implements ActionListener\
    \ {\n   Button myButton = null;\n   Label myLabel = null;\n   String text = null;\n\
    \   public static void main(String[] a) {\n      ButtonAction2 myTest = new ButtonAction2();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      Frame\
    \ f = new Frame(\"My Switch Button\");\n      f.setLayout(new GridLayout(2,1));\n\
    \      text = \"On\";\n      myButton = new Button(text);\n      myButton.addActionListener(this);\n\
    \      f.add(myButton);\n      myLabel = new Label(text);\n      f.add(myLabel);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent\
    \ e) {\n      if (text.equals(\"On\")) text = \"Off\";\n      else text = \"On\"\
    ; \n      myButton.setLabel(text);\n      myLabel.setText(text);\n   }\n}\n```\n\
    \n如果你运行此示例，你将得到：\n\n![](img/image00199.jpeg)\n\n#### AWT 按钮动作处理器\n\n按钮工作良好。如果你点击按钮，按钮的标签文本将从“On”变为“Off”，标签组件的文本也会随之改变。\n\
    \nJava Swing Tutorials - Herong's Tutorial Examples\n\n∟AWT (Abstract Windows\
    \ Toolkit)\n\n### 窗口层面的 AWT 按钮鼠标点击处理器\n\n本节提供了一个教程示例，展示了如何创建一个 AWT 按钮，通过在包含该按钮组件的窗口上添加\
    \ `MouseAdapter` 接口来处理动作。\n\n当然，使用 `ActionListeners`并不是处理用户点击按钮唯一的方法。你也可以使用 `MouseListeners`\
    \ 来处理用户点击。这是一个示例程序：\n\n```java\n /* ButtonAction3.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.Button;\n\
    import java.awt.Label;\nimport java.awt.GridLayout;\nimport java.awt.event.MouseEvent;\n\
    import java.awt.event.MouseAdapter;\npublic class ButtonAction3 extends MouseAdapter\
    \ {\n   Button myButton = null;\n   Label myLabel = null;\n   String text = null;\n\
    \   public static void main(String[] a) {\n      ButtonAction3 myTest = new ButtonAction3();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      Frame\
    \ f = new Frame(\"My Switch Button\");\n      f.setLayout(new GridLayout(2,1));\n\
    \      text = \"On\";\n      myButton = new Button(text);\n      myButton.addMouseListener(this);\n\
    \      f.add(myButton);\n      myLabel = new Label(text);\n      f.add(myLabel);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   public void mouseClicked(MouseEvent\
    \ e) {\n      if (text.equals(\"On\")) text = \"Off\";\n      else text = \"On\"\
    ; \n      myButton.setLabel(text);\n      myLabel.setText(text);\n   }\n}\n```\n\
    \n如果你运行此示例，你将得到：\n\n![](img/image00200.jpeg)\n\n#### AWT 按钮鼠标适配器\n\n按钮工作良好。如果你点击按钮，按钮的标签文本将从“On”变为“Off”，标签组件的文本也会随之改变。\n\
    \nJava Swing Tutorials - Herong's Tutorial Examples\n\n∟AWT (Abstract Windows\
    \ Toolkit)\n\n### AWT 文本字段和 ActionListener\n\n本节提供了一个教程示例，展示了如何创建一个 AWT 文本字段，并实现\
    \ `ActionListener` 监听器作为事件处理器。\n\nAWT `TextField` 组件可以直接触发 `ActionEvent`。这是一个示例程序，向你展示\
    \ `TextField` 的 `ActionEvent` 是如何工作的：\n\n```java\n /* TextFieldTest.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\n\
    import java.awt.TextField;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    public class TextFieldTest {\n   public static void main(String[] a) {\n     \
    \ Frame f = new Frame(\"Text Test\");\n      TextField t = new TextField(16);\n\
    \      f.add(t);\n      f.pack();\n      f.setVisible(true);\n   }\n   private\
    \ static class MyTextField extends TextField\n      implements ActionListener\
    \ {\n      static int count = 0;\n      public MyTextField(int l) {\n        \
    \ super(l);\n         addActionListener(this);\n      }\n      public void actionPerformed(ActionEvent\
    \ e) {\n         count++;\n         System.out.println(count+\": Action performed\
    \ - \"+getText());\n      }\n   }\n}\n```\n\n运行此程序并在文本字段执行以下操作：\n\n* 输入“Hello”。\n\
    * 按回键。\n\n* 输入“World!”.\n* 按回键。\n\n文本字段看起来应该是：\n\n![](img/image00201.jpeg)\n\n\
    #### AWT 文本字段 ActionListener\n\n你会在控制台中得到以下输出：\n\n```\n1: Action performed - Hello\n\
    2: Action performed - World!\n```\n\n输出确认了：\n\n* 当按下按键时会调用 `ActionListener`。\n\
    \nJava Swing Tutorials - Herong's Tutorial Examples\n\n∟AWT (Abstract Windows\
    \ Toolkit)\n\n"
- fmt: "\n# MenuTest.java - AWT Menu Test Program\n\nThis section provides a tutorial\
    \ example on how to use the `java.awt.Menu` class to create multiple menus and\
    \ how to add them to the menu bar. Sub menus and menu items added to a menu will\
    \ be listed vertically when the menu is selected.\n\nHere is an example program\
    \ I wrote to test the `java.awt.Menu` class:\n\n```\n /* MenuTest.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\
    \ \nimport java.awt.MenuBar; \nimport java.awt.Menu; \nimport java.awt.MenuItem;\
    \ \npublic class MenuTest {\n   Frame myFrame = null;\n   public static void main(String[]\
    \ a) {\n      (new MenuTest()).test();\n   }\n   private void test() {\n     \
    \ myFrame = new Frame(\"Menu Test\");\n      myFrame.setBounds(50,50,250,150);\n\
    \      MenuBar myMenuBar = new MenuBar();\n      Menu myMenu = getFileMenu();\n\
    \      myMenuBar.add(myMenu);\n      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\
    \n      myFrame.setMenuBar(myMenuBar);\n      myFrame.setVisible(true);\n   }\n\
    \   private Menu getFileMenu() {\n      Menu myMenu = new Menu(\"File\");\n  \
    \    Menu mySubMenu = getOpenMenu();\n      myMenu.add(mySubMenu);\n      MenuItem\
    \ myItem = new MenuItem(\"Close\");\n      myMenu.add(myItem);\n      myMenu.addSeparator();\n\
    \      myItem = new MenuItem(\"Exit\");\n      myMenu.add(myItem);\n      return\
    \ myMenu;\n   }\n   private Menu getColorMenu() {\n      Menu myMenu = new Menu(\"\
    Color\");\n      MenuItem myItem = new MenuItem(\"Red\");\n      myMenu.add(myItem);\n\
    \      myItem = new MenuItem(\"Green\");\n      myMenu.add(myItem);\n      myItem\
    \ = new MenuItem(\"Blue\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n   private Menu getOpenMenu() {\n      Menu myMenu = new Menu(\"Open\"\
    );\n      MenuItem myItem = new MenuItem(\"Java\");\n      myMenu.add(myItem);\n\
    \      myItem = new MenuItem(\"HTML\");\n      myMenu.add(myItem);\n      myItem\
    \ = new MenuItem(\"GIF\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n}\n```\n\nIf you run this example, you will see frame window shows up with\
    \ the menu bar like this:\n\n![](Images/image0203.jpeg)\n\n## AWT Menu Test\n\n\
    Interesting notes about this tutorial example:\n\n- Multiple menus can be added\
    \ to a menu bar. The \"File\" menu and the \"Color\" menu are added to the menu\
    \ bar in this example.\n- A menu can have a child menu included in the same way\
    \ as a menu item. The \"Open\" menu is added as a child menu to the \"File\" menu\
    \ in this example.\n- Calling the `addSeparator()` method on a `Menu` object does\
    \ add a line in the menu element.\n\n# MenuItemTest.java - AWT Menu Item Program\n\
    \nThis section provides a tutorial example on how to use `java.awt.MenuItem` class\
    \ to create menu items and add them to different menus, sub menus, or the menu\
    \ bar. Sub menus and menu items added to a menu will be listed vertically when\
    \ the menu is selected.\n\nHere is an example program I wrote to test the `java.awt.MenuItem`\
    \ class:\n\n```\n /* MenuItemTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.MenuBar;\n\
    import java.awt.Menu;\nimport java.awt.MenuItem;\npublic class MenuItemTest {\n\
    \   Frame myFrame = null;\n   public static void main(String[] a) {\n      (new\
    \ MenuItemTest()).test();\n   }\n   private void test() {\n      myFrame = new\
