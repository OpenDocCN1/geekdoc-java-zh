    # Creating Internal Frames inside the Main Frame\n\nThis chapter provides tutorial\
    \ notes and example codes on internal frames. Topics include quick introduction\
    \ of the `javax.swing.JInternalFrame` class and the `javax.swing.JInternalFrameListener`\
    \ interface; examples of creating internal frames inside the main frame; examples\
    \ of adding internal frame listeners.\n\n> [javax.swing.JInternalFame - Internal\
    \ Frame Class](#part0068.xhtml)\n> [JInternalFameTest.java - Internal Frame Class\
    \ Test](#part0069.xhtml)\n> [javax.swing.InternalFrameListener - Internal Frame\
    \ Listener Interface](#part0070.xhtml)\n\n## Conclusion\n\n- An object of the\
    \ `javax.swing.JInternalFrame` class represents an internal frame inside the main\
    \ frame.\n- Creating a class to implement the `javax.swing.JInternalFrameListener`\
    \ interface allows you to add logics to react to events generated by internal\
    \ frames.\n\nSample programs listed in this chapter have been tested with JDK\
    \ 1.3.1 to JDK 17 on Windows and macOS computers.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n[Creating Internal Frames inside the\
    \ Main Frame](#part0067.xhtml)\n\n## javax.swing.JInternalFame - Internal Frame\
    \ Class\n\nThis section describes `javax.swing.JInternalFame` - Internal Frame\
    \ Class, representing a UI internal frame inside a regular frame.\n\n`javax.swing.JInternalFrame`\
    \ - A Swing class representing a UI internal frame inside a regular frame. An\
    \ internal frame supports almost all the features a regular frame does. Adding\
    \ an internal frame to a regular frame should be done by adding the internal frame\
    \ to a desktop pane first, then using the desktop pane as the content pane of\
    \ the regular frame. Interesting methods of `JInternalFrame` include:\n\n- `JInternalFrame(String)`\
    \ - Constructor to create an internal frame with the specified string as the frame\
    \ title.\n- `setResizable(boolean)` - Method to set this frame to be resizable\
    \ or not.\n- `setClosable(boolean)` - Method to set this frame to be closable\
    \ or not.\n- `setMaximizable(boolean)` - Method to set this frame to be maximizable\
    \ or not.\n- `setIconifiable(boolean)` - Method to set this frame to be iconifiable\
    \ or not.\n- `setSize(int, int)` - Method to set the size of this frame. If not\
    \ set, an internal frame will have zero size and not visible.\n- `setVisible(boolean)`\
    \ - Method to set this frame to be visible or not. The default setting is not\
    \ visible, you must call `setVisible(true)` to show an internal frame.\n- `addInternalFrameListener(InternalFrameListener)`\
    \ - Method to add internal frame listeners to this internal frame.\n\n`javax.swing.JDesktopPane`\
    \ - A Swing class representing a container to host internal frames.\n\n- `getSelectedFrame()`\
    \ - Method to return the selected internal frame.\n\n`javax.swing.event.InternalFrameListener`\
    \ - A Swing interface for the implementing class to handle internal frame events.\
    \ Methods include:\n\n- `internalFrameActivated(InternalFrameEvent)` - Method\
    \ to be called when the internal frame is activated.\n- `internalFrameClosed(InternalFrameEvent)`\
    \ - Method to be called when the internal frame has been closed.\n- `internalFrameClosing(InternalFrameEvent)`\
    \ - Method to be called when the internal frame is in the process of being closed.\n\
    - `internalFrameDeactivated(InternalFrameEvent)` - Method to be called when the\
    \ internal frame is de-activated.\n- `internalFrameDeiconified(InternalFrameEvent)`\
    \ - Method to be called when the internal frame is de-iconified.\n- `internalFrameIconified(InternalFrameEvent)`\
    \ - Method to be called when the internal frame is iconified.\n- `internalFrameOpened(InternalFrameEvent)`\
    \ - Method to be called when the internal frame is opened.\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n[Creating Internal Frames\
    \ inside the Main Frame](#part0067.xhtml)\n\n## JInternalFameTest.java - Internal\
    \ Frame Class Test\n\nThis section provides a tutorial example on how to use `javax.swing.JInternalFame`\
    \ class to create 2 internal frames in the main frame.\n\nThe following program\
    \ shows you how to create internal frames:\n\n```\n /* JInternalFrameTest.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
    \ java.awt.*;\nimport javax.swing.*;\npublic class JInternalFrameTest {\n   public\
    \ static void main(String[] a) {\n      JFrame myFrame = new JFrame(\"Internal\
    \ Frames\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      myFrame.setSize(300,300);\n      JDesktopPane myDesktop = new JDesktopPane();\n\
    \      myFrame.setContentPane(myDesktop);\n      JInternalFrame f = createFrame(\"\
    Frame 1\");\n      f.setLocation(10,10);\n      myDesktop.add(f);\n      f = createFrame(\"\
    Frame 2\");\n      f.setLocation(60,60);\n      myDesktop.add(f);\n      myFrame.setVisible(true);\n\
    \   }\n   private static JInternalFrame createFrame(String t) {\n      JInternalFrame\
    \ f = new JInternalFrame(t);\n      f.setResizable(true);\n      f.setClosable(true);\n\
    \      f.setMaximizable(true);\n      f.setIconifiable(true);\n      f.setSize(200,200);\n\
    \      f.setVisible(true);\n      return f;\n   }\n}\n```\n\nRun this program\
    \ and you should see two internal frames. You can resize, close, maximize, and\
    \ minimize the internal frame:\n\n![](Images/image00170.jpeg)\n\nInternal Frame\
    \ Test\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n[Creating Internal Frames inside the Main Frame](#part0067.xhtml)\n\n## javax.swing.InternalFrameListener\
    \ - Internal Frame Listener Interface\n\nThis section provides a tutorial example\
    \ on how to use `javax.swing.JInternalFameListener` interface that allows implementing\
    \ classes to handle internal frame events.\n\nThe following program shows you\
    \ how to create internal frame listeners:\n"
