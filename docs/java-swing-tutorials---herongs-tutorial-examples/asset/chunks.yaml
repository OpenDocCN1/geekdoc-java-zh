- fmt: "\n* `javax.swing.JMenuBar` class allows you to create and manage the menu\
    \ bar on the main frame.\n* `javax.swing.JMenu` class allows you to create and\
    \ manage a single menu linked to the menu bar.\n* `javax.swing.JMenuItem` class\
    \ allows you to create and manage a standard menu item linked to a menu.\n* `javax.swing.JRadioButtonMenuItem`\
    \ class allows you to create and manage a radio button menu item.\n* `javax.swing.JCheckBoxMenuItem`\
    \ class allows you to create and manage a checkbox menu item.\n* `javax.swing.event.MenuListener`\
    \ Swing interface allows you to implement your own menu event handler methods.\n\
    * `java.awt.event.ActionListener` AWT interface allows you to implement your own\
    \ event handler methods.\n* `javax.swing.event.MenuKeyListener` Swing interface\
    \ allows you to implement your own handlers for keyboard inputs.\n\nSample programs\
    \ listed in this chapter have been tested with `JDK 1.6.0` to `JDK 15`.\n\n[Java\
    \ Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Menu Bar,\
    \ Menus, Menu Items and Listeners](#part0052.xhtml)\n\n## JMenuBar, JMenu, and\
    \ JMenuItem Classes\n\nThis section describes 3 Swing classes, `JMenuBar`, `JMenu`,\
    \ and `JMenuItem`, to build a menu interface for a frame window. A typical menu\
    \ interface has a menu bar with multiple menus or menu items. A menu can have\
    \ multiple sub menus or menu items.\n\n### `javax.swing.JMenuBar`\nA Swing class\
    \ representing the menu bar on the main frame. `javax.swing.JMenu` objects added\
    \ a `JMenuBar` object will be displayed horizontally. Interesting methods of `JMenuBar`\
    \ include:\n\n* `JMenuBar()` - Constructor to create a menu bar which can be added\
    \ to a frame window.\n* `add(JMenu)` - Method to add a new `JMenu` object to the\
    \ end of the menu be list.\n* `getMenuCount()` - Method to return the number of\
    \ menus in this menu bar.\n* `getMenu(int)` - Method to return the `JMenu` object\
    \ of the specified position index. Of course, index `0` is the first menu.\n*\
    \ `getSubElements()` - Method to return an array of `MenuElement` objects.\n*\
    \ `isSelected()` - Method to return true if an element is currently selected in\
    \ the menu bar.\n\n### `javax.swing.JMenu`\nA Swing class representing a user\
    \ interface menu. A `JMenu` object can be added to a `JMenuBar` or another `JMenu`\
    \ object to form a menu tree structure. A `JMenu` object actually has two graphical\
    \ components, a clickable button displayed in the parent `JMenu` or `JMenuBar`\
    \ and a popup window. When its button is clicked, its pop up window will be displayed.\
    \ Interesting methods of `JMenu` include:\n\n* `JMenu(String)` - Constructor to\
    \ create a menu with the specified string as its button text.\n* `add(JMenuItem)`\
    \ - Method to add a `JMenuItem` object to the end of its current menu item list.\n\
    * `addSeparator()` - Method to add a menu separator to the end of its current\
    \ menu item list.\n* `getItemCount()` - Method to return the number of its menu\
    \ items.\n* `getItem(int pos)` - Method to return the `JMenuItem` object of the\
    \ specified position index. Of course, index `0` is the first menu item.\n* `isSelected()`\
    \ - Method to return true if this menu is selected.\n* `isTopLevelMenu()` - Method\
    \ to return true if this menu is a top menu. A top menu is a menu added to the\
    \ menu bar, not to another menu.\n* `doClick(int)` - Method to simulate a user\
