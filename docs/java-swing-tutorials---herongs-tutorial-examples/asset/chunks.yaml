  trans: "\n\n# MenuTest.java - AWT 菜单程序\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.Menu` 类创建多个菜单，以及如何将它们添加到菜单栏中。当选中菜单时，添加到菜单中的子菜单和菜单项将垂直列出。\n\
    \n以下我编写的一个用于测试 `java.awt.Menu` 类的示例程序：\n\n```\n /* MenuTest.java\n * Copyright\
    \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\
    \ \nimport java.awt.MenuBar; \nimport java.awt.Menu; \nimport java.awt.MenuItem;\
    \ \npublic class MenuTest {\n   Frame myFrame = null;\n   public static void main(String[]\
    \ a) {\n      (new MenuTest()).test();\n   }\n   private void test() {\n     \
    \ myFrame = new Frame(\"Menu Test\");\n      myFrame.setBounds(50,50,250,150);\n\
    \      MenuBar myMenuBar = new MenuBar();\n      Menu myMenu = getFileMenu();\n\
    \      myMenuBar.add(myMenu);\n      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\
    \n      myFrame.setMenuBar(myMenuBar);\n      myFrame.setVisible(true);\n   }\n\
    \   private Menu getFileMenu() {\n      Menu myMenu = new Menu(\"File\");\n  \
    \    Menu mySubMenu = getOpenMenu();\n      myMenu.add(mySubMenu);\n      MenuItem\
    \ myItem = new MenuItem(\"Close\");\n      myMenu.add(myItem);\n      myMenu.addSeparator();\n\
    \      myItem = new MenuItem(\"Exit\");\n      myMenu.add(myItem);\n      return\
    \ myMenu;\n   }\n   private Menu getColorMenu() {\n      Menu myMenu = new Menu(\"\
    Color\");\n      MenuItem myItem = new MenuItem(\"Red\");\n      myMenu.add(myItem);\n\
    \      myItem = new MenuItem(\"Green\");\n      myMenu.add(myItem);\n      myItem\
    \ = new MenuItem(\"Blue\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n   private Menu getOpenMenu() {\n      Menu myMenu = new Menu(\"Open\"\
    );\n      MenuItem myItem = new MenuItem(\"Java\");\n      myMenu.add(myItem);\n\
    \      myItem = new MenuItem(\"HTML\");\n      myMenu.add(myItem);\n      myItem\
    \ = new MenuItem(\"GIF\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n}\n```\n\n如果你运行此示例，你将看到一个带有如下菜单栏的窗口：\n\n![](img/image0203.jpeg)\n\n## AWT\
    \ 菜单测试\n\n关于此教程示例的有趣说明：\n\n- 多个菜单可以添加到菜单栏中。在本示例中，“文件”（File）菜单和“颜色”（Color）菜单被添加到菜单栏。\n\
    - 菜单可以像菜单项一样包含一个子菜单。在本示例中，“打开”（Open）菜单作为子菜单被添加到“文件”菜单中。\n- 在 `Menu` 对象上调用 `addSeparator()`\
    \ 方法会在菜单元素中添加一条线。\n\n# MenuItemTest.java - AWT 菜单项程序\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.MenuItem`\
    \ 类创建菜单项，并将它们添加到不同的菜单、子菜单或菜单栏中。当选中菜单时，添加到菜单中的子菜单和菜单项将垂直列出。\n\n以下我编写的一个用于测试 `java.awt.MenuItem`\
    \ 类的示例程序：\n\n```\n /* MenuItemTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.MenuBar;\n\
    import java.awt.Menu;\nimport java.awt.MenuItem;\npublic class MenuItemTest {\n\
    \   Frame myFrame = null;\n   public static void main(String[] a) {\n      (new\
    \ MenuItemTest()).test();\n   }\n   private void test() {\n      myFrame = new\
    \ Frame(\"Menu Item Test\");\n      myFrame.setBounds(50,50,250,150);\n\n    \
    \  MenuBar myMenuBar = new MenuBar();\n      Menu myMenu = getFileMenu();\n  \
    \    myMenuBar.add(myMenu);\n      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\
    \      myMenu = getOptionMenu();\n      myMenuBar.add(myMenu);\n\n      myFrame.setMenuBar(myMenuBar);\n\
    \      myFrame.setVisible(true);\n   }\n   private Menu getFileMenu() {\n    \
    \  Menu myMenu = new Menu(\"File\");\n      MenuItem myItem = new MenuItem(\"\
    Open\");\n      myMenu.add(myItem);\n      myItem = new MenuItem(\"Close\");\n\
    \      myItem.setEnabled(false);\n      myMenu.add(myItem);\n      myMenu.addSeparator();\n\
    \      myItem = new MenuItem(\"Exit\");\n      myMenu.add(myItem);\n      return\
    \ myMenu;\n   }\n   private Menu getColorMenu() {\n      Menu myMenu = new Menu(\"\
    Color\");\n      MenuItem myItem = new MenuItem(\"Red\");\n      myMenu.add(myItem);\n\
    \      myItem = new MenuItem(\"Green\");\n      myMenu.add(myItem);\n      myItem\
    \ = new MenuItem(\"Blue\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n   private Menu getOptionMenu() {\n      Menu myMenu = new Menu(\"Option\"\
    );\n      Menu mySubMenu = getOnOffMenu(\"Sound\");\n      myMenu.add(mySubMenu);\n\
    \      mySubMenu = getOnOffMenu(\"Auto save\");\n      mySubMenu.setEnabled(false);\n\
    \      myMenu.add(mySubMenu);\n      return myMenu;\n   }\n   private Menu getOnOffMenu(String\
    \ title) {\n      Menu myMenu = new Menu(title);\n      MenuItem myItem = new\
    \ MenuItem(\"On\");\n      myMenu.add(myItem);\n      myItem = new MenuItem(\"\
    Off\");\n      myMenu.add(myItem);\n      return myMenu;\n   }\n}\n```\n\n如果你运行此示例，你将看到一个带有如下菜单栏的窗口：\n\
    \n![](img/image0204.jpeg)\n\n## AWT 菜单项测试\n\n关于此教程示例的有趣说明：\n\n- 菜单项可以通过调用 `setEnabled(false)`\
    \ 方法来禁用。禁用的菜单项将以灰色显示且不可点击。在本示例中，“关闭”（Close）菜单项是被禁用的。\n- 菜单也可以通过调用 `setEnabled(false)`\
    \ 方法来禁用。禁用的菜单将以灰色显示且不可点击。在本示例中，“自动保存”（Auto save）菜单项是被禁用的。\n\n# MenuItemActionListenerTest.java\
    \ - AWT 菜单项动作监听器\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.event.ActionListener`（按钮动作监听器接口）来捕获\
    \ `MenuItem` 对象触发的事件。\n\n与其他任何用户界面组件一样，`MenuItem` 对象在用户交互时也会触发事件。如果你希望在 `MenuItem`\
    \ 对象发生事件时执行任务，你需要为该 `MenuItem` 对象添加一个事件监听器。由于 `MenuItem` 是 `AbstractButton` 的子类，它与\
    \ `AbstractButton` 共享监听器接口和事件类：\n\n`java.awt.event.ActionListener` - 一个 AWT 接口，允许你实现自己的事件处理方法：\n\
    \n- `actionPerformed(ActionEvent)` - 当关联的组件被点击时调用的事件处理方法。你需要实现此方法来执行你自己的任务。\n\n\
    `java.awt.event.ActionEvent` - 一个表示组件上发生事件的 AWT 类。该类中最重要的方法是：\n\n- `getActionCommand()`\
    \ - 返回动作命令字符串。\n\n以下我编写的一个用于测试 ActionListener 接口的示例程序：\n\n"
- fmt: "\n```java\n /* MenuItemActionListenerTest.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.MenuBar;\n\
    import java.awt.Menu;\nimport java.awt.MenuItem;\nimport java.awt.event.ActionEvent;\n\
    import java.awt.event.ActionListener;\npublic class MenuItemActionListenerTest\
