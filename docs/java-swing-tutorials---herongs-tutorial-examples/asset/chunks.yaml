  trans: "\n\n- `Launching thread`（启动线程）：创建 `SwingWorker` 实例并在该实例上调用 `execute()` 的线程。\n\
    - `Worker thread`（工作线程）：通过执行 `doInBackground()` 方法实际执行任务的线程。\n- `Dispatch thread`（分发线程）：`Worker\
    \ thread` 用于发送信息的线程。\n\n扩展 `SwingWorker` 类时，你需要考虑以下几点：\n\n- 实现 `doInBackground()`\
    \ 方法以执行实际任务。\n- 实现 `done()` 方法，如果你在任务完成后执行某些操作。\n- 在 `SwingWorker` 实例上调用 `get()`\
    \ 方法，如果你想检索 `doInBackground()` 方法返回的结果。请注意，你应该在任务完成后调用 `get()` 方法。如果调用得太早，它将等待任务完成。\n\
    - 在 `doInBackground()` 方法中执行计算时，在任何你想发布中间值的时间点调用 `publish()` 方法。当然，你需要实现 `process()`\
    \ 方法来接收这些中间值。\n- 在 `doInBackground()` 方法中将任务分为多个相等的单元，并在每个单元完成后调用 `setProgress()`\
    \ 方法用百分比值更新“进度”属性。当然，你需要实现一个 `java.beans.PropertyChangeListener` 类来获取“进度”值变化的通知。\n\
    - 实现一个 `java.beans.PropertyChangeListener` 类，以获取 `SwingWorker` 实例“状态”值变化的通知，从\
    \ `PENDING` 变为 `STARTED` 再到 `DONE`。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟SwingWorker\
    \ - 后台任务工作人员\n\n### 使用 done() 方法的 SwingWorker 示例\n\n本节提供了一个如何使用 `java.swing.SwingWorker`\
    \ 类配合 `done()` 方法将计算结果通信到分发线程的教程示例。\n\n有几种方法可以使用 `SwingWorker` 类。让我们从最简单的开始。\n\
    \n#### 示例 1：在任务完成后接收通知并检索结果\n\n此示例展示了使用 `SwingWorker` 类的简单方法，只需启动 `Worker thread`\
    \  `Dispatch thread` 中捕获结果。只需要实现两个方法：\n\n- `T doInBackground()` - 需要实现的实例方法，用于执行任务。`doInBackground()`\
    \ 方法将在 `Worker thread` 中执行。\n- `void done()` - 需要实现的实例方法，如果你想在任务完成后执行某些操作。`done()`\
    \ 方法将在 `Dispatch thread` 中执行。\n\n以下是示例程序的源代码，`SwingWorkerUsingDone.java`：\n\n\
    ```java\n /* SwingWorkerUsingDone.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport javax.swing.SwingWorker;\nimport java.util.List;\n\
    import java.util.Random;\nimport java.time.LocalTime;\npublic class SwingWorkerUsingDone\
    \ \n   extends SwingWorker<Integer[], Object> {\n   int total = 100;\n   int wait\
    \ = 10;\n\n// Extending the SwingWorker class\n   protected Integer[] doInBackground()\
    \ {\n      logMessage(\"doInBackground() started\");\n      int i = 0;\n     \
    \ Integer[] l = new Integer[total];\n      Random r = new Random();\n      try\
    \ {\n         while (i<total) {\n            Thread.sleep(wait);\n           \
    \ Integer n = Integer.valueOf(r.nextInt());\n            l[i] = n;\n         \
    \   i++;\n         }\n      } catch (Exception e) {\n         e.printStackTrace();\n\
    \      }\n      logMessage(\"doInBackground() ended\");\n      return l;\n   }\n\
    \n   protected void done() {\n      logMessage(\"done() started\");\n      try\
    \ {\n        Integer[] r = get();\n        System.out.println(\"# of element in\
    \ the result: \"+r.length);\n      System.out.println(\"First element: \"+r[0]);\n\
    \      System.out.println(\"Last element: \"+r[total-1]);\n      } catch (Exception\
    \ e) {\n         e.printStackTrace();\n      }\n      logMessage(\"done() ended\"\
    );\n   }\n\n// Launching my extended SwingWorker class\n   public static void\
    \ main(String[] a) {\n      try {\n         SwingWorker<Integer[], Object> worker\
    \ \n            = new SwingWorkerUsingDone();\n         dumpThreads();\n     \
    \    worker.execute();\n         while (true) {\n            dumpThreads();\n\
    \            Thread.sleep(200);\n         }\n      } catch (Exception e) {\n \
    \        e.printStackTrace();\n      }\n   }\n   public static void dumpThreads()\
    \ {\n      System.out.println(LocalTime.now()+\" Thread dump:\");\n      Thread.currentThread().getThreadGroup().list();\n\
    \   }\n   public static void logMessage(String s) {\n      System.out.println(LocalTime.now()+\"\
    \ \"\n         +Thread.currentThread().getName()+\": \"+s);\n   }\n}\n```\n\n\
    关于示例程序的说明：\n\n- 本示例中的类类 `SwingWorkerUsingDone` 承担了双重角色，既作为 `java.swing.SwingWorker`\
    \ 的扩展类，又作为启动应用程序的主类。\n- 注意，`SwingWorker` 类是一个泛型类，它接受两个类型参数 `<T,V>`，其中 `T` 是 `doInBackground()`\
    \ 方法返回的结果的数据类型；`V` 是由 `doInBackground()` 方法发布的中间值的数据类型。在本示例中，我将 `T` 设置为 `Integer[]`\
    \ 以以 Integer 数组的形式返回结果；并将 `V` 设置为 `Object` 以发布中间值。\n- 实现 `Integer[] doInBackground()`\
    \ 用于生成一些数字。\n- 实现 `void done()` 用于检索 `Integer[]` 数组。\n- 实现 `void main()` 方法以便\
    \ `SwingWorkerUsingDone` 可以启动应用程序。\n\n"
