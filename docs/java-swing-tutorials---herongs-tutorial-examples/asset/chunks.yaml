    \ Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[SwingWorker - The Background\
    \ Task Worker](#part0094.xhtml)\n\n## SwingWorker Example using JProgressBar\n\
    \nThis section provides a tutorial example on how to use `java.swing.SwingWorker`\
    \ class and the `JProgressBar` component on the UI. All main features of the `SwingWorker`\
    \ class are demonstrated.\n\n**Example 4: Put everything together** - This example\
    \ shows you how to all features of the `SwingWorker` class together to create\
    \ more real Swing GUI application to generate random numbers as a background task.\n\
    \nHere is the source code of the example program, `SwingWorkerUsingProgress.java`:\n\
    \n```java\n /* SwingWorkerUsingProgressBar.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.beans.*;\nimport java.awt.*;\nimport\
    \ java.awt.event.*;\nimport java.util.*;\nimport javax.swing.*;\npublic class\
    \ SwingWorkerUsingProgressBar {\n   static JButton myButton;\n   static JProgressBar\
    \ myProgressBar;\n   static JLabel myUpdate;\n   static JTextArea myTextArea;\n\
    \   public static void main(String[] a) {\n      JFrame myFrame = new JFrame(\"\
    Random Number Generator\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container myPane = myFrame.getContentPane();\n      myPane.setLayout(new\
    \ GridBagLayout());\n      GridBagConstraints c = new GridBagConstraints();\n\
    \      setMyConstraints(c,0,0,GridBagConstraints.CENTER);\n      myPane.add(getFieldPanel(),c);\n\
    \      setMyConstraints(c,0,1,GridBagConstraints.CENTER);\n      myPane.add(getButtonPanel(),c);\n\
    \n      JMenuBar myMenuBar = new JMenuBar();\n      myMenuBar.add(getFileMenu());\n\
    \      myMenuBar.add(getColorMenu());\n      JMenuItem myItem = new JMenuItem(\"\
    Help\");\n      myMenuBar.add(myItem);\n      myFrame.setJMenuBar(myMenuBar);\n\
    \n      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   private static\
    \ JMenu getFileMenu() {\n      JMenu myMenu = new JMenu(\"File\");\n      JMenuItem\
    \ myItem = new JMenuItem(\"Open\");\n      myMenu.add(myItem);\n      myItem =\
