    \      String text = null;\n      public MyRadioButton(String t) {\n         super(t);\n\
    \         text = t;\n         addActionListener(this);\n         addChangeListener(this);\n\
    \         addItemListener(this);\n      }\n      public void actionPerformed(ActionEvent\
    \ e) {\n         count++;\n         System.out.println(count+\": Action performed\
    \ - \"+text);\n      }\n      public void stateChanged(ChangeEvent e) {\n    \
    \     count++;\n         System.out.println(count+\": State changed on - \"+text);\n\
    \      }\n      public void itemStateChanged(ItemEvent e) {\n         count++;\n\
    \         System.out.println(count+\": Item state changed - \"+text);\n      }\n\
    \   }\n}\n```\n\nThis example program creates two radio buttons and puts them\
    \ in a single button group. Each button has 3 listeners to handle 3 different\
    \ types of events. A counter is used in the listener class to help to identify\
    \ the order of events.\n\nIf you run this program, you will see two radio buttons:\
    \ one labeled as \"On\" and the other labeled as \"Off\":\n\n![](Images/image00148.jpeg)\n\
    \n#### JRadioButton Listeners\n\nIf you press the \"On\" button and hold it, you\
    \ will see 2 messages showing in command window. If you release the \"On\" button,\
    \ you will see 5 more messages. If you continue to press the \"Off\" button and\
    \ hold it, you will see 2 more messages. If you release the \"Off\" button, you\
    \ will see 7 more messages. Here is the list of all the messages:\n\n```\n 1:\
    \ State changed on - On\n2: State changed on - On     - \"On\" pressed\n3: State\
    \ changed on - On\n4: Item state changed - On\n5: State changed on - On\n6: Action\
    \ performed - On\n7: State changed on - On     - \"On\" released\n8: State changed\
    \ on - Off\n9: State changed on - Off    - \"Off\" pressed\n10: State changed\
    \ on - On\n11: Item state changed - On\n12: State changed on - Off\n13: Item state\
    \ changed - Off\n14: State changed on - Off\n15: Action performed - Off\n16: State\
    \ changed on - Off   - \"Off\" released\n```\n\nNote that:\n\n*   Action event\
    \ raised only once when you release a button.\n*   Change event (`stateChanged`\
    \ method call) is raised 2 times when you press a button; and raised 2 time again\
    \ when you release a button. This tells us that a button has more than 2 states:\
    \ selected and deselected.\n*   Item event (`itemStateChanged` method call) is\
    \ raised only once when you release a button.\n*   In a button group, if one button\
    \ is selected, other selected buttons will be deselected. Events #10 and #11 show\
    \ that when \"Off\" is selected, \"On\" is deselected.\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JRadioButton - Swing Radio\
    \ Button Class](#part0040.xhtml)\n\n### `getSelection()` - Getting Selected Button\n\
    \nThis section provides a tutorial example on how to use the `getSelection()`\
    \ method to know which button is selected in a button group.\n\nIf there are many\
    \ radio buttons in a button group, how do you find the one that is currently selected?\
    \ One way is to use the `getSelection()` method of `ButtonGroup` class. Here is\
    \ a sample program:\n\n```\n /* JRadioButtonAction.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\npublic class JRadioButtonAction implements ActionListener\
    \ {\n   ButtonGroup myGroup = null;\n   JLabel myLabel = null;\n   public static\
    \ void main(String[] a) {\n      JRadioButtonAction myTest = new JRadioButtonAction();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      JFrame\
    \ f = new JFrame(\"My Radio Buttons\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container c = f.getContentPane();\n      c.setLayout(new BoxLayout(c,BoxLayout.AXIS));\n\
    \      myGroup = new ButtonGroup();\n      JPanel p = new JPanel();\n      c.setLayout(new\
    \ GridLayout(3,1));\n      addOption(p,myGroup,\"Red\");\n      addOption(p,myGroup,\"\
    Green\");\n      addOption(p,myGroup,\"Blue\");\n      c.add(p);\n      JButton\
    \ b = new JButton(\"Select\");\n      b.addActionListener(this);\n      c.add(b);\n\
    \      myLabel = new JLabel(\"Please select\",SwingConstants.CENTER);\n      c.add(myLabel);\n\
    \      f.pack();\n      f.setVisible(true);\n   }\n   public void addOption(JPanel\
    \ p, ButtonGroup g, String t) {\n      JRadioButton b = new JRadioButton(t);\n\
    \      b.setActionCommand(t);\n      p.add(b);\n      g.add(b);\n   }\n   public\
    \ void actionPerformed(ActionEvent e) {\n      ButtonModel b = myGroup.getSelection();\n\
    \      String t = \"Not selected\";\n      if (b!=null) t = b.getActionCommand();\n\
    \      myLabel.setText(t);\n   }\n}\n```\n\nIf you run this program, you will\
    \ see none of the radio buttons is selected initially. If you click \"Select\"\
    , you will get the \"Not selected\" message. If you select any of the radio buttons,\
    \ then click \"Select\", you will get the correct message:\n\n![](Images/image0019.jpeg)\n\
    \n#### JRadioButton Selected Button\n\n[Java Swing Tutorials - Herong's Tutorial\
    \ Examples](#part0001.xhtml)\n\n∟`JTextField` - Swing Text Field Class\n\nThis\
    \ chapter provides tutorial notes and example codes on `JTextField` class. Topics\
    \ include description of the `javax.swing.JTextField` class and its methods; example\
    \ program of creating text fields with event listeners.\n\n> [`javax.swing.JTextField\
    \ and Related Classes`](part0045.xhtml)\n> \n\n> [`ActionListener` and `DocumentListener`](part0046.xhtml)\n\
    \nConclusions:\n\n*   `javax.swing.JTextField` class represents a UI text input\
    \ field.\n*   `java.awt.event.ActionListener` interface allows you to create your\
    \ own handler to respond to keyboard inputs.\n\nSample programs listed in this\
    \ chapter have been tested with JDK 1.3.1 to JDK 17 on Windows and macOS computers.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[`JTextField`\
    \ - Swing Text Field Class](#part0044.xhtml)\n\n### `javax.swing.JTextField` and\
    \ Related Classes\n\nThis section describes the `javax.swing.JTextField` class,\
    \ the `javax.swing.text.PlainDocument` class, and the `javax.swing.event.DocumentListener`\
    \ class.\n\n`javax.swing.JTextField` - A Swing class representing a UI text field.\
    \ Some interesting methods are:\n\n*   `JTextField(int)` - Constructor to create\
    \ a text field with the specified number of columns.\n*   `JTextField(String)`\
    \ - Constructor to create a text field with the specified string as the initial\
    \ text.\n"
