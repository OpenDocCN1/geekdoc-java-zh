    \ - 菜单监听器接口\n\n> - `JMenuItemActionListenerTest.java` - 项目动作监听器测试程序\n\n> - 单选框项目项监听器\n\
    \n> - 复选框项目项监听器\n\n> - `javax.swing.event.MenuKeyListener` - 菜单键盘监听器接口\n\n> -\
    \ `setMnemonic()` - 为项目设置快捷键\n\n> - `setAccelerator()` - 为项目设置加速键\n\n> - `setMnemonic()`\
