    \      myFrame.setBounds(50,50,250,150);\n      myFrame.setContentPane(new JDesktopPane());\n\
    \n      JMenuBar myMenuBar = new JMenuBar();\n      JMenu myMenu = getFileMenu();\n\
    \      myMenuBar.add(myMenu);\n      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\
    \      myMenu = getOptionMenu();\n      myMenuBar.add(myMenu);\n\n      JMenuItem\
    \ myItem = new JMenuItem(\"Help\");\n      myItem.addMenuKeyListener(this);\n\
    \      myMenuBar.add(myItem);\n\n      myFrame.setJMenuBar(myMenuBar);\n     \
    \ myFrame.setVisible(true);\n   }\n   private JMenu getFileMenu() {\n      JMenu\
    \ myMenu = new JMenu(\"File\");\n      JMenuItem myItem = new JMenuItem(\"Open\"\
    );\n      myItem.addMenuKeyListener(this);\n      myMenu.add(myItem);\n      myItem\
    \ = new JMenuItem(\"Close\");\n      myItem.addMenuKeyListener(this);\n      myMenu.add(myItem);\n\
    \      myMenu.addSeparator();\n      myItem.addMenuKeyListener(this);\n      myItem\
    \ = new JMenuItem(\"Exit\");\n      myMenu.add(myItem);\n      return myMenu;\n\
    \   }\n   private JMenu getColorMenu() {\n      JMenu myMenu = new JMenu(\"Color\"\
    );\n      ButtonGroup myGroup = new ButtonGroup();\n      JRadioButtonMenuItem\
    \ myItem = new JRadioButtonMenuItem(\"Red\");\n      myItem.setSelected(true);\n\
    \      myItem.addMenuKeyListener(this);\n      myGroup.add(myItem);\n      myMenu.add(myItem);\n\
    \      myItem = new JRadioButtonMenuItem(\"Green\");\n      myItem.addMenuKeyListener(this);\n\
    \      myGroup.add(myItem);\n      myMenu.add(myItem);\n      myItem = new JRadioButtonMenuItem(\"\
    Blue\");\n      myItem.addMenuKeyListener(this);\n      myGroup.add(myItem);\n\
    \      myMenu.add(myItem);\n      return myMenu;\n   }\n   private JMenu getOptionMenu()\
    \ {\n      JMenu myMenu = new JMenu(\"Option\");\n      JMenuItem myItem = new\
    \ JMenuItem(\"Sound\");\n      myItem.addMenuKeyListener(this);\n      myMenu.add(myItem);\n\
    \      myItem = new JMenuItem(\"Auto save\");\n      myItem.addMenuKeyListener(this);\n\
    \      myMenu.add(myItem);\n      return myMenu;\n   }\n   public void menuKeyTyped(MenuKeyEvent\
    \ e) {\n      MenuElement[] path = e.getPath();\n      JMenuItem item = (JMenuItem)\
