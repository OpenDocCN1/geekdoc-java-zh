    \n### Layout - BorderLayout\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[Layout of Components in a Container](#part0071.xhtml)\n\n∟java.awt.FlowLayout\
    \ - Flow Layout\n\nThis section provides a tutorial example on how to create a\
    \ `FlowLayout` to layout components in a container. `FlowLayout` can have many\
    \ elements arranged horizontally first, then vertically.\n\n`java.awt.FlowLayout`\
    \ - Another very simple layout that:\n\n* Takes unlimited number of components.\n\
    * Uses the default size of each component.\n* Positions each component next to\
    \ each other in a row. If there is not enough room in the current row, the component\
    \ will be positioned at the beginning of the next row.\n* Re-arranges the flow\
    \ when the container is resized.\n\nI don't see any potential use of this layout.\
    \ But I am interested to see how it re-arranges the flow when the container is\
    \ resized. So I decided to use `FlowLayout` to layout a window of several different\
    \ types of components. I wanted the window to look like this:\n\n```\n - Details\
    \ ----------------\n|     Name: Text         |||   System: Radio button |\n| Language:\
    \ Check box    |\n|     Year: Dropdown     |\n--------------------------\n   \
    \     OK  Cancel\n```\n\nHere is an example program I wrote to do this with `FlowLayout`:\n\
    \n```java\n /* FlowLayoutTest2.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic\
    \ class FlowLayoutTest2 {\n   public static void main(String[] a) {\n      JFrame\
    \ myFrame = new JFrame(\"FlowLayout Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container myPane = myFrame.getContentPane();\n      myPane.setLayout(new\
    \ FlowLayout(FlowLayout.CENTER));\n      myPane.add(getFieldPanel());\n      myPane.add(getButtonPanel());\n\
    \      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   private static\
    \ JPanel getFieldPanel() {\n      JPanel p = new JPanel(new FlowLayout());\n \
    \     p.setBorder(BorderFactory.createTitledBorder(\"Details\"));\n      p.add(new\
    \ JLabel(\"Name:\"));\n      p.add(new JTextField(16));\n      p.add(new JLabel(\"\
    System:\"));\n      p.add(getSystemPanel());\n      p.add(new JLabel(\"Language:\"\
    ));\n      p.add(getLanguagePanel());\n      p.add(new JLabel(\"Year:\"));\n \
    \     p.add(new JComboBox<String>(\n         new String[] {\"2021\",\"2022\",\"\
    2023\"}));\n      return p;\n   }\n   private static JPanel getButtonPanel() {\n\
    \      JPanel p = new JPanel(new FlowLayout());\n      p.add(new JButton(\"OK\"\
    ));\n      p.add(new JButton(\"Cancel\"));\n      return p;\n   }\n   private\
    \ static JPanel getSystemPanel() {\n      JRadioButton unixButton = new JRadioButton(\"\
    Unix\",true);\n      JRadioButton winButton = new JRadioButton(\"Window\",false);\n\
    \      ButtonGroup systemGroup = new ButtonGroup();\n      systemGroup.add(unixButton);\n\
    \      systemGroup.add(winButton);\n      JPanel p = new JPanel(new FlowLayout());\n\
    \      p.add(unixButton);\n      p.add(winButton);\n      return p;\n   }\n  \
    \ private static JPanel getLanguagePanel() {\n      JPanel p = new JPanel(new\
    \ FlowLayout());\n      p.add(new JCheckBox(\"Java\",true));\n      p.add(new\
    \ JCheckBox(\"C++\",true));\n      p.add(new JCheckBox(\"Perl\",false));\n   \
    \   return p;\n   }\n}\n```\n\nRun it. What do you think about the result? Pretty\
    \ bad, right?\n\n![](Images/image00173.jpeg)\n\n### Layout - FlowLayout\n\nInitially\
    \ all components are positioned in a single row. If you narrow the window, \"\
    OK\" and \"Cancel\" buttons will be wrapped to the next row. If you narrow it\
    \ further, no change will happen on positions. Because the top container, the\
    \ window, really contains only two components: the field panel and the button\
    \ panel.\n\nSo, `FlowLayout` is not good for my example.\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[Layout of Components in\
    \ a Container](#part0071.xhtml)\n\n∟java.awt.BoxLayout - Box Layout\n\nThis section\
    \ provides a tutorial example on how to create a `BoxLayout` to layout components\
    \ in a container. `BoxLayout` can have many elements arranged in one direction\
    \ only: horizontally or vertically.\n\n`java.awt.BoxLayout` - A layout that:\n\
    \n* Takes unlimited number of components.\n* Positions each component next to\
    \ each other only in one direction, horizontal or vertical.\n* Resizes components\
    \ that are resizable to fill entire container.\n* Resizes components that are\
    \ resizable when the container is resized.\n\nTo test BoxLayout, I wrote another\
    \ program to try to display my window with `BoxLayout`:\n"
