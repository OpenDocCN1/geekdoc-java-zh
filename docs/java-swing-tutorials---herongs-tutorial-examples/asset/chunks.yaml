    \ performed - On\n7: State changed on - On     - \"On\" released\n8: State changed\
    \ on - Off\n9: State changed on - Off    - \"Off\" pressed\n10: State changed\
    \ on - On\n11: Item state changed - On\n12: State changed on - Off\n13: Item state\
    \ changed - Off\n14: State changed on - Off\n15: Action performed - Off\n16: State\
    \ changed on - Off   - \"Off\" released\n```\n\nNote that:\n\n*   Action event\
    \ raised only once when you release a button.\n\n*   Change event (stateChanged\
    \ method call) is raised 2 times when you press a button; and raised 2 time again\
    \ when you release a button. This tells us that a button has more than 2 states:\
    \ selected and deselected.\n\n*   Item event (itemStateChanged method call) is\
