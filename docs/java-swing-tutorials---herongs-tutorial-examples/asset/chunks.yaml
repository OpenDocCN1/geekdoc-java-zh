    \      myTest.createFrame();\n   }\n   public void createFrame() {\n      JFrame\
    \ f = new JFrame(\"My Check Boxes\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container c = f.getContentPane();\n      c.setLayout(new BoxLayout(c,BoxLayout.Y_AXIS));\n\
    \      JPanel p = new JPanel();\n      p.setLayout(new GridLayout(3,1));\n\n \
    \   red = new JCheckBox(\"Red\");\n      green = new JCheckBox(\"Green\");\n \
    \     blue = new JCheckBox(\"Blue\");\n      p.add(red);\n      p.add(green);\n\
    \      p.add(blue);\n\n      c.add(p);\n      JButton b = new JButton(\"Done\"\
    );\n      b.addActionListener(this);\n      c.add(b);\n      myLabel = new JLabel(\"\
    Please select\",SwingConstants.CENTER);\n      c.add(myLabel);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent e)\
    \ {\n    String t = \"\";\n    if (red.isSelected()) t += \"Red \";\n    if (green.isSelected())\
    \ t += \"Green \";\n    if (blue.isSelected()) t += \"Blue \";\n    if (t.equals(\"\
    \")) t = \"Nothing selected\";\n      myLabel.setText(t);\n   }\n}\n```\n\n如果你运行这个程序，最初没有任何复选框被选中。如果你点击“Done”，你会得到“Nothing\
    \ selected”消息。如果你选择了一些复选框然后点击“Done”，你会得到所有选中的项目：\n\n![](img/image0147.jpeg)\n\n\
    ### JCheckBox Selected Items\n\nJava Swing Tutorials - Herong's Tutorial Examples\n\
    \n∟JRadioButton - Swing Button Class\n\n本章提供了 `JRadioButton` 的教程笔记和示例代码。主题包括 `JRadioButton`\
    \ 类描述；创建单选按钮和监听器的示例程序；识别组中被选中按钮的示例程序。\n\n> javax.swing.JRadioButton and Related\
    \ Classes\n\n> ActionListener, ChangeListener and ItemListener\n\n> getSelection()\
    \ - Getting Selected Button\n\n#### 结论：\n\n* `JRadioButton` 类表示单选按钮。\n* `ActionListener`、`ChangeListener`\
    \ 或 `ItemListener` 接口可处理单选按钮上的用户操作。\n* `getSelection()` 方法可检测 `ButtonGroup` 中的被选中选项。\n\
    \n本章列出的示例程序已在 Windows 和 macOS 电脑上的 JDK 1.3.1 到 17 进行过测试。\n\n"
