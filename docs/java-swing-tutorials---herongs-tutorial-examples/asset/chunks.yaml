  trans: "\n\n# Java Swing 教程 - Herong 示例\n\n## JFrame - 主框架类\n\n### 在框架标题栏中显示中文\n\
    \n本节提供了一个教程示例，介绍如何使用指定的中文字体在框架窗口的标题栏中显示中文。\n\n**问题**：我想框架窗口的标题中显示中文。\n\n**解决方案\
    \ 1**：如果你在较新的电脑上使用 `JDK` 9 或更高版本，你可以在 Java 源代码中包含中文字符并以 `UTF-8` 编码保存，这是大多数编程编辑器的默认行为。不需要指定\
    \ `SimSun` 字体名称，系统将选取默认字体来支持中文字符。仍然可以使用 Unicode `/uxxxx` ASCII 格式提供中文字符，但 `UTF-8`\
    \ 编码是一个更好的选项。\n\n```\n /* JFrameChinese2.java\n * Copyright (c) 2014-2018 HerongYang.com\
    \ All Rights Reserved.\n*/\nimport java.awt.*;\nimport javax.swing.*;\npublic\
    \ class JFrameChinese2 {\n   public static void main(String[] a) {\n      JFrame\
    \ f = new JFrame();\n//    f.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n//\
    \    f.setTitle(\"Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\");\n   \
    \   f.setTitle(\"Hello world! - 电脑你好！\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setVisible(true);\n\
    \   }\n}\n```\n\n**解决方案 2**：如果你在旧电脑上仍使用旧版本的 `JDK`，你可能需要自己安装中文字体。在我下面列出的示例代码中，我使用了字体\
    \ `SimSun`，它是作为 Windows 多语言支持的一部分安装的。你可能还需要 Java 源代码中使用 `/uxxxx` ASCII 格式输入中文字符。\n\
    \n```\n /* JFrameChinese.java\n * Copyright (c) 2014-2018 HerongYang.com All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JFrameChinese\
    \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame();\n\
    \      f.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n      f.setTitle(\"Hello\
    \ world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setVisible(true);\n\
    \   }\n}\n```\n\n如果你运行这两个示例，将得到相同的结果：\n\n![](img/image00134.jpeg)\n\n### 标题栏中的中文\n\
    \n**注意 1**：使用 `JDK` 1.4.1 或更低版本，字符将显示为 `?`。我没有办法。如果你有任何建议，请与我分享。\n\n**注意 2**：要检查\
    \ Windows 电脑是否安装了 `SimSun` 字体，可以在系统目录树中查找 `%windir%\\fonts\\simsun.ttc` 文件。\n\n\
    ## 绘制图形 - 在框架上使用 paint()\n\n本节提供了一个教程示例，介绍如何重写 `javax.swing.JFrame` 类中的 `paint()`\
    \ 方法以在框架窗口上绘制图形（矩形）。不推荐这种解决方案。\n\n**问题**：我想在框架中绘制一些图形。\n\n**解决方案 1**：你可以通过扩展 `JFrame`\
    \ 类创建你自己的框架类来轻松实现这一点，这样就可以重写 `paint()` 方法。`paint()` 方法提供了一个 `Graphics` 对象，该对象将为你提供绘制各种类型图形的实用方法。下面的示例代码\
    \ `JFramePaint1.java` 展示了如何如何操作。\n\n```\n /* JFramePaint1.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport\
    \ javax.swing.*;\npublic class JFramePaint1 {\n   public static void main(String[]\
    \ a) {\n      MyJFrame f = new MyJFrame();\n      f.setTitle(\"Drawing Graphics\
    \ in Frames\");\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setVisible(true);\n   }\n   static class MyJFrame extends JFrame {\n\
    \      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n \
    \     }\n   }\n}\n```\n\n如果你运行此示例，将得到：\n\n![](img/image00135.jpeg)\n\n### 在框架上使用\
    \ paint()\n\n**注意 1**：`paint()` 方法是 `JFrame` 类从 `Component` 类继承的。每当该组件应该绘制时，它就会被调用。\n\
    \n**注意 2**：如果你查看框架上显示的矩形，你会发现绘制坐标的原点位于整个框架的左上角，包括标题栏。\n\n**注意 3**：默认情况下，`paint()`\
    \ 方法提供透明背景。\n\n**注意 4**：在 `JDK` 7 及更高版本中，`paint()` 方法不提供背景。\n\n## 在组件上使用 paint()\n\
    \n本节提供了一个教程示例，介绍如何重写 `javax.swing.JFrame` 类中的 `paint()` 方法以在框架窗口上绘制图形（矩形）。\n\n\
    **问题**：我想在框架中绘制一些图形。\n\n**解决方案 2**：解决方案 1 并不理想，因为我们需要添加另一个组件。为了在框架中绘制，我们创建一个新组件并将其添加到内容区域。\n\
    \n```\n /* JFramePaint2.java\n * Copyright (c) 2014-2018 HerongYang.com All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JFramePaint2\
    \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame();\n\
    \      f.setTitle(\"Drawing Graphics in Frames\"\n         +\" by Adding Component\"\
    );\n      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.getContentPane().add(new MyComponent());\n      f.setVisible(true);\n\
    \   }\n   static class MyComponent extends JComponent {\n    b  paint(Graphics\
    \ g) {\n         g.drawRect(20,10,100,60);\n      }\n   }\n}\n```\n\n如果你运行此示例，将得到：\n\
    \n![](img/image00136.jpeg)\n\n**注意 1**：由于没有给新组件指定大小，它占据了整个内容区域，即整个框架区域。\n\n**注意\
    \ 2**：现在绘制坐标的原点在左上角，比解决方案 1 好得多。\n\n## 在内容区域上使用 paint()\n\n本节提供了一个教程示例，介绍如何重写\
    \ `javax.swing.JFrame` 类中的 `paint()` 方法以绘制图形（矩形）并将其作为框架的内容区域。\n\n**问题**：我想在框架中绘制一些图形。\n\
    \n**解决方案 3**：解决方案 2 还不够完美。我们为什么需要为绘制添加另一个组件？我们可以直接在内容区域上绘制图形吗？答案是定的，我们可以直接在内容区域上绘制。下面的示例代码\
    \ `JFramePaint3.java` 展示了如何操作。\n\n```\n /* JFramePaint3.java\n * Copyright (c)\
    \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport\
    \ javax.swing.*;\npublic class JFramePaint3 {\n   public static void main(String[]\
    \ a) {\n      JFrame f = new JFrame();\n      f.setTitle(\"Drawing Graphics in\
    \ Frame\"\n         +\" by Replacing the Content Pane\");\n      f.setBounds(100,50,500,300);\n\
    \      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      f.setContentPane(new\
    \ MyComponent());\n      f.setVisible(true);\n   }\n   static class MyComponent\
    \ extends JComponent {\n      public void paint(Graphics g) {\n         g.drawRect(20,10,100,60);\n\
    \      }\n   }\n}\n```\n\n如果你运行此示例，将得到：\n\n![](img/image00137.jpeg)\n\n"
