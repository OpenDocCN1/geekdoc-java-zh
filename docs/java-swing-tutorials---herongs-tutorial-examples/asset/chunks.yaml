    \ create a simple plain text editor pane with a call of `setText()` to set initial\
    \ text content.\n\n`javax.swing.JEditorPane` class can be used to create a simple\
    \ text editor window with two method calls:\n\n* `setContentType(\"text/plain\"\
    )` - Setting the content type to be plain text.\n* `setText(text)` - Setting the\
    \ initial text content.\n\nHere is an example program I wrote to test the `JEditorPane`\
    \ class:\n\n```java\n /* JEditorPaneTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport javax.swing.*;\npublic class JEditorPaneTest\
    \ {\n   JFrame myFrame = null;\n   public static void main(String[] a) {\n   \
    \   (new JEditorPaneTest()).test();\n   }\n   private void test() {\n      myFrame\
    \ = new JFrame(\"JEditorPane Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      myFrame.setSize(300,200);\n\n      JEditorPane myPane = new JEditorPane();\n\
    \      myPane.setContentType(\"text/plain\");\n      myPane.setText(\n       \
    \  \"JEditorPane is a text component to edit various kinds of\"\n         +\"\
    \ content.\\n\\nThis component uses implementations of the\"\n         +\" EditorKit\
    \ to accomplish its behavior.\");\n\n      myFrame.setContentPane(myPane);\n \
    \     myFrame.setVisible(true);\n   }\n}\n```\n\nIf you run this example, you\
    \ will see a text editor pane displayed with the initial text content.\n\nYou\
    \ can edit initial text or add more text. You can also select a part of the text\
    \ as shown in the picture below:\n\n![](Images/image00185.jpeg)\n\nEditor Pane\
    \ Test\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JEditorPane - The Editor Pane Class](#part0088.xhtml)\n\n## Saving Text from\
    \ an Editor Pane\n\nThis section provides a tutorial example on how to use the\
    \ `getText()` method of the `javax.swing.JEditorPane` class to implement a save\
    \ file function.\n\nIn the next tutorial example, I want to show you how to use\
    \ the `setText()` method and the `getText()` method of the `javax.swing.JEditorPane`\
    \ class to implement the \"Open\" function and the \"Save\" function of my text\
    \ editor.\n\n```java\n /* JEditorPaneSave.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.io.*;\nimport java.nio.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\npublic class JEditorPaneSave implements ActionListener\
    \ {\n   JFrame myFrame = null;\n   JEditorPane myPane = null;\n   public static\
    \ void main(String[] a) {\n      (new JEditorPaneSave()).test();\n   }\n   private\
    \ void test() {\n      myFrame = new JFrame(\"JEditorPane Save Test\");\n    \
    \  myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      myFrame.setSize(300,200);\n\
    \n      myPane = new JEditorPane();\n      myPane.setContentType(\"text/plain\"\
    );\n      myPane.setText(\n         \"JEditorPane is a text component to edit\
    \ various kinds of\"\n         +\" content.\\n\\nThis component uses implementations\
    \ of the\"\n         +\" EditorKit to accomplish its behavior.\");\n      myFrame.setContentPane(myPane);\n\
    \n      JMenuBar myBar = new JMenuBar();\n      JMenu myMenu = getFileMenu();\n\
    \      myBar.add(myMenu); \n      myFrame.setJMenuBar(myBar);\n      myFrame.setVisible(true);\n\
    \   }\n   private JMenu getFileMenu() {\n      JMenu myMenu = new JMenu(\"File\"\
    );\n      JMenuItem myItem = new JMenuItem(\"Open\");\n      myItem.addActionListener(this);\n\
    \      myMenu.add(myItem);\n\n      myItem = new JMenuItem(\"Save\");\n      myItem.addActionListener(this);\n\
    \      myMenu.add(myItem);\n      return myMenu;\n   }\n   public void actionPerformed(ActionEvent\
    \ e) {\n      String cmd = ((AbstractButton) e.getSource()).getText();\n     \
    \ try {\n         if (cmd.equals(\"Open\")) {\n            FileReader in = new\
    \ FileReader(\"JEditorPane.txt\");\n            char[] buffer = new char[1024];\n\
    \            int n = in.read(buffer);\n            String text = new String(buffer,\
    \ 0, n);\n            myPane.setText(text);\n            in.close();\n       \
    \  } else if (cmd.equals(\"Save\")) {\n            FileWriter out = new FileWriter(\"\
    JEditorPane.txt\");\n            out.write(myPane.getText());\n            out.close();\n\
    \         }\n      } catch (Exception f) {\n         f.printStackTrace();\n  \
    \    }\n   }\n}\n```\n\nIf you run this example, you will see a text editor pane\
    \ displayed with the initial text content and a menu bar with the \"File\" menu.\n\
    \nYou can edit the text in the editor pane, use the menu to save the changes,\
    \ and open it again. See the picture below:\n\n![](Images/image00186.jpeg)\n\n\
    Editor Pane - Save Changes\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JEditorPane - The Editor Pane Class](#part0088.xhtml)\n\n## Editing HTML in\
    \ an Editor Pane\n\nThis section provides a tutorial example on how to use the\
    \ `setContentType()` method of the `javax.swing.JEditorPane` class to set force\
    \ the editor pane to display content in HTML format.\n\nNow I want to try the\
    \ `text/html` content type with the `javax.swing.JEditorPane` class. In this tutorial\
    \ example, I want to add a new menu, \"View\", with two functions, \"HTML\" and\
    \ \"Plain\". If you click HTML, the text in the editor pane will be displayed\
    \ in HTML format. If you click Plain, the text in the editor pane will be displayed\
    \ in plain text format. Of course, this is done by using the `setContentType()`\
    \ of the `JEditorPane` class.\n"
