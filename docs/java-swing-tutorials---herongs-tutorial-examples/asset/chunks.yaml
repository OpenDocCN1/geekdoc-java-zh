- fmt: "\nThis chapter provides tutorial notes and example codes on option dialog\
    \ box. Topics include creating and displaying message, confirmation, input and\
    \ option dialog boxes; receiving input values from option dialog boxes; creating\
    \ and display internal dialog boxes; creating option dialog box directly.\n\n\
    > [javax.swing.JOptionPane - Creating and Displaying Option Dialog Boxes](#part0080.xhtml)\n\
    > [showMessageDialog() - Displaying Message Dialog Boxes](#part0081.xhtml)\n>\
    \ [showConfirmDialog() - Displaying Confirmation Dialog Boxes](#part0082.xhtml)\n\
    > [Receiving Inputs from Confirmation Dialog Boxes](#part0083.xhtml)\n> [showInputDialog()\
    \ - Displaying Input Dialog Boxes](#part0084.xhtml)\n> [showOptionDialog() - Displaying\
    \ Option Dialog Boxes](#part0085.xhtml)\n> [showInternal*Dialog() - Displaying\
    \ Internal Dialog Boxes](#part0086.xhtml)\n> [createDialog() - Creating Dialog\
    \ Boxes Directly](#part0087.xhtml)\n\n## Conclusions\n\n*   `javax.swing.JOptionPane`\
    \ class can be used to display different types of simple dialog boxes with `showMessageDialog()`,\
    \ `showConfirmDialog()`, `showInputDialog()`, and `showOptionDialog()` methods.\n\
    *   `showMessageDialog()` method displays a dialog box with a text message only.\n\
    *   `showConfirmDialog()` method displays a dialog box with a text message and\
    \ prompts for a confirmation button click from the user.\n*   `showInputDialog()`\
    \ method displays a dialog box with a text message only and prompts for the user\
    \ to enter a text input.\n*   `showOptionDialog()` method displays a dialog box\
    \ with a list of options for the user to select.\n*   By default, dialog boxes\
    \ are created as standalone windows floating outside the parent panel. If you\
    \ want to create dialog boxes restricted inside the parent panel, you need to\
    \ use `showInternal*Dialog()` methods.\n\nSample programs listed in this chapter\
    \ have been tested with JDK 1.3.1 to JDK 17 on Windows and macOS computers.\n\n\
    [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n∟[Option\
    \ Dialog Boxes](#part0079.xhtml)\n\n## javax.swing.JOptionPane - Creating and\
    \ Displaying Option Dialog Boxes\n\nThis section describes some static methods\
    \ in the `JOptionPane` class that can be used to create and display different\
    \ types of option dialog boxes.\n\n`javax.swing.JOptionPane` - A Swing class that\
    \ allows you to create and display option dialog boxes. Interesting methods of\
    \ `JOptionPane` include:\n\n*   `showMessageDialog()` - Method to create and display\
    \ a message dialog box to present regular, warning or error messages.\n*   `showConfirmDialog()`\
    \ - Method to create and display a confirmation dialog box with yes, no and cancel\
    \ buttons.\n*   `showInputDialog()` - Method to create and display an input dialog\
    \ box to prompt for some input.\n*   `showOptionDialog()` - Method to create and\
    \ display a generic dialog box to present message, take a confirmation, or take\
    \ some input.\n*   `showInternal*Dialog()` - Methods to create and display internal\
    \ dialog boxes, displayed inside the main frame.\n\nAll dialog boxes created with\
    \ the `JOptionPane` class are modal, disabling all other user interface components\
    \ on other frames. Each call of `show*Dialog()` method blocks the execution until\
    \ the dialog box is closed.\n\nAll dialog boxes must be created with parent frame.\n\
    \nThe message type of an option dialog box controls the icon used on the left\
    \ side of the message text.\n\nThe option type of an option dialog box controls\
    \ what option buttons to be displayed.\n\nThe option buttons can be customized\
    \ with your own option strings.\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    ∟[Option Dialog Boxes](#part0079.xhtml)\n\n## showMessageDialog() - Displaying\
    \ Message Dialog Boxes\n\nThis section provides a tutorial example on how to use\
    \ the static method, `showMessageDialog()`, to create and display message dialog\
    \ boxes for 4 different type of messages: information, warning, error, and plain.\n\
    \nThe simplest dialog box you can create and display with the `javax.swing.JOptionPane`\
    \ class is the message dialog box. This can be done with the static method: `showMessageDialog(frame,\
    \ message, title, type)`, where:\n\n*   \"frame\" is a frame object to be used\
    \ as the parent frame.\n*   \"message\" is the message string to be display on\
    \ the dialog box.\n*   \"title\" is the title string to be used as the dialog\
    \ box title.\n*   \"type\" is an integer code representing a specific message\
    \ dialog box type. Valid type codes are predefined as constants in the `JOptionPane`\
    \ class: `INFORMATION_MESSAGE`, `WARNING_MESSAGE`, `ERROR_MESSAGE` and `PLAIN_MESSAGE`.\n\
    \nHere is an example program I wrote to test the `showMessageDialog()` method:\n\
    \n```\n /* JOptionPaneShowMessageDialog.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    import javax.swing.event.*;\npublic class JOptionPaneShowMessageDialog implements\
    \ ActionListener {\n   JFrame myFrame = null;\n   public static void main(String[]\
    \ a) {\n      (new JOptionPaneShowMessageDialog()).test();\n   }\n   private void\
    \ test() {\n      myFrame = new JFrame(\"showMessageDialog Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      myFrame.setBounds(50,50,250,150);\n      myFrame.setContentPane(new JDesktopPane());\n\
    \      JMenuBar myMenuBar = new JMenuBar();\n      JMenu myMenu = getDialogMenu();\n\
    \      myMenuBar.add(myMenu);\n      myFrame.setJMenuBar(myMenuBar);\n      myFrame.setVisible(true);\n\
    \   }\n   private JMenu getDialogMenu() {\n      JMenu myMenu = new JMenu(\"Dialogs\"\
    );\n      JMenuItem myItem = new JMenuItem(\"Information\");\n      myItem.addActionListener(this);\n\
    \      myMenu.add(myItem);\n      myItem = new JMenuItem(\"Warning\");\n     \
    \ myItem.addActionListener(this);\n      myMenu.add(myItem);\n      myItem = new\
    \ JMenuItem(\"Error\");\n      myItem.addActionListener(this);\n      myMenu.add(myItem);\n\
    \      myItem = new JMenuItem(\"Plain\");\n      myItem.addActionListener(this);\n\
    \      myMenu.add(myItem);\n      return myMenu;\n   }\n   public void actionPerformed(ActionEvent\
    \ e) {\n      String menuText = ((JMenuItem) e.getSource()).getText();\n     \
    \ int messageType = JOptionPane.INFORMATION_MESSAGE;\n      if (menuText.equals(\"\
    Information\")) {\n         messageType = JOptionPane.INFORMATION_MESSAGE;\n \
    \     } else if (menuText.equals(\"Warning\")) {\n         messageType = JOptionPane.WARNING_MESSAGE;\n\
    \      } else if (menuText.equals(\"Error\")) {\n         messageType = JOptionPane.ERROR_MESSAGE;\n\
    \      } else if (menuText.equals(\"Plain\")) {\n         messageType = JOptionPane.PLAIN_MESSAGE;\n\
    \      }\n\n      System.out.println(\"Before displaying the dialog: \"+menuText);\n\
    \      JOptionPane.showMessageDialog(myFrame, \n         \"This is message dialog\
    \ box of type: \"+menuText,\n         menuText+\" Message\", messageType);\n \
    \     System.out.println(\"After displaying the dialog: \"+menuText);\n   }\n\
    }\n```\n\nIf you run this example, open the \"Dialogs\" menu, and click \"Information\"\
    , \"Warning\" or \"Error\" menu item, you will see a message dialog box showing\
    \ up like this:\n\n![](Images/image00178.jpeg)\n\nMessage Dialog Box\n\nJava Swing\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n∟[Option Dialog Boxes](#part0079.xhtml)\n\
    \n## showConfirmDialog() - Displaying Confirmation Dialog Boxes\n\nThis section\
    \ provides a tutorial example on how to use the static method, `showConfirmDialog()`,\
    \ to create and display confirmation dialog boxes for 3 different types of options\
    \ and 4 different types of messages: information, warning, error, and plain.\n"
