    \nSwingWorker Threads using done() Method\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n∟[SwingWorker - The Background Task Worker](#part0094.xhtml)\n\
    \n∟SwingWorker Example using publish() Method\n\nThis section provides a tutorial\
    \ example on how to use java.swing.SwingWorker class with the publish() method\
    \ to send out intermediate values from the doInBackground() method. The process()\
    \ method must be implemented to catch those intermediate values in the dispatch\
    \ thread.\n\n**Example 2: Publish intermediate values and catch them** - This\
    \ example shows the another way of using the SwingWorker class to just publish\
    \ intermediate values while performing the background task and catch them result\
    \ in the Dispatch thread. Only 2 methods need to be implemented:\n\n*   T doInBackground()\
    \ - Instance method to be implemented to perform the task. Inside doInBackground(),\
    \ the publish(V...) method is called multiple times to publish intermediate values.\n\
    \n*   void process(List<V>) - Instance method to be implemented, if you want to\
    \ catch intermediate values published by the publish() method calls inside doInBackground().\n\
    \nHere is the source code of the example program, SwingWorkerUsingPublish.java:\n\
    \n```\n /* SwingWorkerUsingPublish.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport javax.swing.SwingWorker;\nimport java.util.List;\n\
    import java.util.Random;\nimport java.time.LocalTime;\npublic class SwingWorkerUsingPublish\
    \ \n   extends SwingWorker<Object, Integer> {\n   int total = 100;\n   int wait\
    \ = 10;\n\n// Extending the SwingWorker class\n   protected Object doInBackground()\
    \ {\n      logMessage(\"doInBackground() started\");\n      int i = 0;\n     \
    \ Random r = new Random();\n      try {\n         while (i<total) {\n        \
    \    Thread.sleep(wait);\n            Integer n = Integer.valueOf(r.nextInt());\n\
    \            publish(n);\n            i++;\n         }\n      } catch (Exception\
    \ e) {\n         e.printStackTrace();\n      }\n      logMessage(\"doInBackground()\
    \ ended\");\n      return null;\n   }\n\n   protected void process(List<Integer>\
    \ v) {\n      logMessage(\"process() receiving values: \"+v.size());\n   }\n\n\
    // Launching my extended SwingWorker class\n   public static void main(String[]\
    \ a) {\n      try {\n         SwingWorker<Object, Integer> worker \n         \
    \   = new SwingWorkerUsingPublish();\n         dumpThreads();\n         worker.execute();\n\
    \         while (true) {\n            dumpThreads();\n            Thread.sleep(200);\n\
    \         }\n      } catch (Exception e) {\n         e.printStackTrace();\n  \
    \    }\n   }\n   public static void dumpThreads() {\n      System.out.println(LocalTime.now()+\"\
    \ Thread dump:\");\n      Thread.currentThread().getThreadGroup().list();\n  \
    \ }\n   public static void logMessage(String s) {\n      System.out.println(LocalTime.now()+\"\
    \ \"\n         +Thread.currentThread().getName()+\": \"+s);\n   }\n}\n```\n\n\
    Notes on the sample program:\n\n*   When extending SwingWorker<T,V>, I am setting\
    \ T to be Object because I am not returning any result; and setting V to be Integer\
    \ to publish intermediate values.\n\n*   Object doInBackground() is implemented\
    \ to generate some random numbers. Whenever a random number is generated, I call\
    \ the publish() method to publish it the Dispatch thread.\n\n*   void process(List<V>)\
    \ is implemented to catch intermediate values published by the Worker thread.\
    \ Note that this publish-catch process is an asynchronous process. One invocation\
    \ of process() could catch multiple intermediate values from multiple publish()\
    \ calls. This is why received intermediate values are passed in as a List<V> object.\n\
    \nIf you compile and run this example with JDK 10 or higher, you should get output\
    \ messages similar to these:"
