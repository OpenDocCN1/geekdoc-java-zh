    \ - \");\n      }\n      public void itemStateChanged(ItemEvent e) {\n       \
    \  count++;\n         System.out.println(count+\": Item state changed - \");\n\
    \      }\n   }\n}\n```\n\nThis example program creates a combo box with 3 options.\
    \ It has 2 listeners to handle 2 different types of events. A counter is used\
    \ in the listener class to help to identify the order of events.\n\nIf you run\
    \ this program, you will see a combo box with 3 options: \"Red\", \"Green\" and\
    \ \"Blue\". By default, the first option will be selected. But I called the setSelectedIndex(-1)\
    \ to removed the selection.\n\n![](Images/image00151.jpeg)\n\nJComboBox Listeners\n\
    \nIf you open the drop-down list, you see messages 1 and 2\\. If you select the\
    \ \"Red\" option, you see messages 3 and 4\\. If you change the selection to \"\
    Green\", you see messages 5, 6, and 7.\n\n```\n 1: Item state changed -\n2: Action\
    \ performed -\n\n3: Item state changed -\n4: Action performed -\n\n5: Item state\
    \ changed -\n6: Item state changed -\n7: Action performed -\n```\n\nNote that:\n\
    \n*   Action event raised only once when you select an option.\n\n*   Item event\
    \ (itemStateChanged method call) is raised when change is made on the combo box.\n\
    \n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JComboBox\
    \ - Swing Combo Box Class](#part0047.xhtml)\n\n∟getSelectedItem() - Selected Item\
    \ of Combo Box\n\nThis section provides a tutorial example on how to use the getSelectedItem()\
    \ method to know which option is selected from a combo box.\n\nIf you are using\
    \ a combo box with multiple options, you can use the getSelectedItem() method\
    \ to find out which option is selected. Here is a sample program:\n\n```\n /*\
    \ JComboBoxAction.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights\
    \ Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\n\
    public class JComboBoxAction implements ActionListener {\n   JComboBox<String>\
    \ combo;\n   JLabel myLabel = null;\n   public static void main(String[] a) {\n\
    \      JComboBoxAction myTest = new JComboBoxAction();\n      myTest.createFrame();\n\
    \   }\n   public void createFrame() {\n    JFrame f = new JFrame(\"My Combo Box\"\
    );\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container c\
    \ = f.getContentPane();\n      c.setLayout(new BoxLayout(c,BoxLayout.Y_AXIS));\n\
    \n      JLabel color = new JLabel(\"Colors:\");\n      c.add(color);\n\n     \
    \ String[] options = {\"Red\", \"Green\", \"Blue\"};\n      combo = new JComboBox<String>(options);\n\
    \    combo.setSelectedIndex(-1);\n      c.add(combo);\n\n      JButton b = new\
    \ JButton(\"Done\");\n      b.addActionListener(this);\n      c.add(b);\n\n  \
    \    myLabel = new JLabel(\"Please select\");\n      c.add(myLabel);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent e)\
    \ {\n    String t = (String) combo.getSelectedItem();\n    if (t == null) t =\
    \ \"Nothing selected\";\n      myLabel.setText(t);\n   }\n}\n```\n\nIf you run\
    \ this program, you will see none of the options is selected initially. If you\
    \ click \"Done\", you will get the \"Nothing selected\" message. If you select\
    \ an option then click \"Done\", you will get the selected color:\n\n![](Images/image00152.jpeg)\n\
    \nJComboBox Selected Option\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟[JComboBox - Swing Combo Box Class](#part0047.xhtml)\n\n∟setEditable() - Use\
    \ Combo Box as Text Field\n\nThis section provides a tutorial example on how to\
    \ call the setEditable(true) method to use a combo box as a dropdown list and\
    \ text field at the same time.\n\nIf you want to use a combo box as both a dropdown\
    \ list and a text text field, you can call the getEditable(true) method on the\
    \ combo box. Here is a sample program:\n\n```\n /* JComboBoxAsEditable.java\n\
    \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport\
