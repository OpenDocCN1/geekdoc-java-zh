    \n### Drawing Chinese Characters on Frames\n\nThis section provides a tutorial\
    \ example on how to draw Chinese characters on frame using the `drawString()`\
    \ method with a Chinese font selected.\n\n**Problem**: I want to draw some Chinese\
    \ characters in a frame.\n\n**Solution**: You can do in the same way as described\
    \ in the solution of the previous question. In the `paint()` method, first change\
    \ the font of the `Graphics` object to a Unicode font that supports Chinese characters.\
    \ Then use `drawString()` utility method to draw the string with Chinese characters.\
    \ The following sample code, `JFramePaintChinese.java`, shows you how to do this.\n\
    \n```java\n /* JFramePaintChinese.java\n * Copyright (c) 2014-2018 HerongYang.com\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic\
    \ class JFramePaintChinese {\n   public static void main(String[] a) {\n     \
    \ JFrame f = new JFrame();\n      f.setTitle(\"Drawing Graphics in Frames\");\n\
    \      f.setBounds(100,50,500,300);\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.setContentPane(new MyComponent());\n      f.setVisible(true);\n   }\n\
    \   static class MyComponent extends JComponent {\n      public void paint(Graphics\
    \ g) {\n         g.setFont(new Font(\"SimSun\",Font.PLAIN, 12));\n         g.drawString(\"\
    Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\",\n            100,50);\n\
    \      }\n   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00138.jpeg)\n\
    \n### Draw Chinese on Frame\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟JLabel - Swing Label Class\n\nThis chapter provides tutorial notes and example\
    \ codes on `JLabel` class. Topics include creating label components with the `javax.swing.JLabel`\
    \ class; creating labels with Chinese characters.\n\n> [Creating Labels with javax.swing.JLabel\
    \ Class](#part0028.xhtml)\n\n> [Creating Labels with Chinese Characters](#part0029.xhtml)\n\
    \nConclusions:\n\n* `javax.swing.JLabel` class represents a UI label.\n* A label\
    \ can have Unicode characters of any language as long as there is font file to\
    \ support it.\n\nSample programs listed in this chapter have been tested with\
    \ JDK 1.3.1 to JDK 17 on Windows and macOS computers.\n\n[Java Swing Tutorials\
    \ - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JLabel - Swing Label Class](#part0027.xhtml)\n\
    \n### Creating Labels with javax.swing.JLabel Class\n\nThis section provides a\
    \ tutorial example on how to create a label with the `javax.swing.JLabel` class.\n\
    \n**Problem**: I want to create a label with a text string.\n\n**Solution**: This\
    \ is easy, just instantiate an object of `javax.swing.JLabel`, and add it to any\
    \ container. Here is a sample program to show you how to do this:\n\n```java\n\
    \ /* JLabelHello.java\n * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n\
    \ */\nimport java.awt.*;\nimport javax.swing.*;\npublic class JLabelHello {\n\
    \   public static void main(String[] a) {\n      JFrame f = new JFrame();\n  \
    \    f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      JLabel l = new JLabel(\"\
    Hello world!\");\n      f.getContentPane().add(l);\n      f.pack();      \n  \
    \    f.setVisible(true);\n   }\n}\n```\n\nIf you run this example, you will get:\n\
    \n![](Images/image00139.jpeg)\n\nJLabel Test\n\nNote: `pack()` method causes the\
    \ window to resize to fit preferred layouts of its subcomponents.\n\n[Java Swing\
    \ Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JLabel - Swing\
    \ Label Class](#part0027.xhtml)\n\n### Creating Labels with Chinese Characters\n\
    \nThis section provides a tutorial example on how to create a label with Chinese\
    \ characters with the `javax.swing.JLabel` class.\n\n**Problem**: I want to create\
    \ a label with Chinese characters.\n\n**Solution**: Not very hard to do. See the\
    \ following sample program:\n\n```java\n /* JLabelChinese.java\n * Copyright (c)\
    \ 2014-2018 HerongYang.com All Rights Reserved.\n */\nimport java.awt.*;\nimport\
    \ javax.swing.*;\npublic class JLabelChinese {\n   public static void main(String[]\
    \ a) {\n      JLabel l = new JLabel();\n      l.setFont(new Font(\"SimSun\",Font.PLAIN,\
    \ 12));\n      l.setText(\"Hello world! - \\u7535\\u8111\\u4F60\\u597D\\uFF01\"\
    );\n      JFrame f = new JFrame();\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      f.getContentPane().add(l);\n      f.pack();\n      f.setVisible(true);\n\
    \   }\n}\n```\n\nIf you run this example, you will get:\n\n![](Images/image00140.jpeg)\n\
    \nJLabel Test in Chinese\n\n[Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\
    \n∟JButton - Swing Button Class\n\nThis chapter provides tutorial notes and example\
    \ codes on `JButton` class. Topics include creating button components with the\
    \ `javax.swing.JButton` class; creating buttons with image icons; adding button\
    \ handler at the component level and the frame level; adding mouse click to handle\
    \ button actions.\n\n> [Creating Buttons with javax.swing.JButton Class](#part0031.xhtml)\n\
    \n> [Creating Image Buttons with javax.swing.JButton Class](#part0032.xhtml)\n\
    \n> [Button Action Handler at the Component Level](#part0033.xhtml)\n\n> [Button\
    \ Action Handler at the Frame Level](#part0034.xhtml)\n\n> [Mouse Click Handler\
    \ at the Frame Level](#part0035.xhtml)\n\nConclusions:\n\n* `javax.swing.JButton`\
    \ class represents a UI action button.\n* An action button can be created with\
    \ a text label or an image icon.\n* `ActionListener` interface can be used to\
    \ handle the user action on the button.\n* `MouseAdapter` interface can be used\
    \ to handle user clicks on the button.\n\nSample programs listed in this chapter\
    \ have been tested with JDK 1.3.1 to JDK 17 on Windows and macOS computers.\n\n\
    [Java Swing Tutorials - Herong's Tutorial Examples](#part0001.xhtml)\n\n∟[JButton\
