    \n### Confirm Dialog Box\n\nInteresting notes about this tutorial example:\n\n\
    * I used several panels and layouts to organize the settings area.\n* An action\
    \ listener has been added to all radio buttons and the \"Show\" button.\n* The\
    \ `actionPerformed()` method in the action listener is implemented to handle all\
    \ changes.\n* What is missing in this example is how to catch input on option\
    \ buttons on the confirmation dialog box.\n\n[Java Swing Tutorials - Herong's\
    \ Tutorial Examples](#part0001.xhtml)\n\n#### [Option Dialog Boxes](#part0079.xhtml)\n\
    \n##### Receiving Inputs from Confirmation Dialog Boxes\n\nThis section provides\
    \ a tutorial example on how to use the static method, `showConfirmDialog()`, to\
    \ create and display confirmation dialog boxes and receive input code to know\
    \ which button was clicked by the user.\n\nIn the previous tutorial example, when\
    \ users click the one of option buttons like Ok, Yes, No or Cancel on confirmation\
    \ dialog boxes, the `showConfirmDialog()` method will actually returns an integer\
    \ code representing the clicked button. Valid type codes are predefined as constants\
    \ in the `JOptionPane` class:\n\n* `JOptionPane.OK_OPTION` - User clicked the\
    \ Ok button.\n* `JOptionPane.YES_OPTION` - User clicked the Yes button.\n* `JOptionPane.NO_OPTION`\
    \ - User clicked the No button.\n* `JOptionPane.CANCEL_OPTION` - User clicked\
    \ the Cancel button.\n* `JOptionPane.CLOSED_OPTION` - User closed the confirmation\
    \ dialog box.\n"
