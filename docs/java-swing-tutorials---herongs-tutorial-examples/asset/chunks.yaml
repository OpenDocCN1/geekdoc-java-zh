    \ super(l);\n         addActionListener(this);\n         addItemListener(this);\n\
    \         this.setSelectedIndex(-1);\n      }\n      public void actionPerformed(ActionEvent\
    \ e) {\n         count++;\n         System.out.println(count+\": Action performed\
    \ - \");\n      }\n      public void itemStateChanged(ItemEvent e) {\n       \
    \  count++;\n         System.out.println(count+\": Item state changed - \");\n\
    \      }\n   }\n}\n```\n\n此示例程序创建一个包含 3 个选项的组合框。它有 2 个监听器来处理 2 种不同的事件。监听器类中使用计数器来帮助识别事件发生的顺序。\n\
    \n如果你运行此程序，你将看到一个带有 3 个选项的组合框：“Red”、“Green”和“Blue”。默认情况下，第一个选项会被选中。但我调用了 `setSelectedIndex(-1)`\
    \ 来移除移除选择。\n\n![](img/image00151.jpeg)\n\n## JComboBox 监听器\n\n如果你打开下拉列表，你会看到消息\
    \ 1 和 2。如果你选择“Red”选项，你会看到消息 3 和 4。如果你将选择更改为“Green”，你将看到消息 5、6 和 7。\n\n```\n 1:\
    \ Item state changed -\n2: Action performed -\n\n3: Item state changed -\n4: Action\
    \ performed -\n\n5: Item state changed -\n6: Item state changed -\n7: Action performed\
    \ -\n```\n\n注意：\n\n- 当你选择一个选项时，动作事件（Action event）仅触发一次。\n- 当组合框上发生更改时，会触发项事件（`itemStateChanged`\
    \ 方法调用）。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JComboBox - Swing 组合框类\n\n∟`getSelectedItem()`\
    \ - 组合框选中项\n\n## getSelectedItem() 方法\n\n本节提供了一个教程示例，介绍了如何使用 `getSelectedItem()`\
    \ 方法来获取组合框中选中的哪个选项。\n\n如果你正在使用带有多个选项的组合框，可以使用 `getSelectedItem()` 方法来查找哪个选项被选中了。这里有一个示例程序：\n\
    \n```java\n /* JComboBoxAction.java\n * Copyright (c) 1997-2018 HerongYang.com.\
    \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
    \ javax.swing.*;\npublic class JComboBoxAction implements ActionListener {\n \
    \  JComboBox<String> combo;\n   JLabel myLabel = null;\n   public static void\
    \ main(String[] a) {\n      JComboBoxAction myTest = new JComboBoxAction();\n\
    \      myTest.createFrame();\n   }\n   public void createFrame() {\n    JFrame\
    \ f = new JFrame(\"My Combo Box\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \      Container c = f.getContentPane();\n      c.setLayout(new BoxLayout(c,BoxLayout.Y_AXIS));\n\
    \n      JLabel color = new JLabel(\"Colors:\");\n      c.add(color);\n\n     \
    \ String[] options = {\"Red\", \"Green\", \"Blue\"};\n      combo = new JComboBox<String>(options);\n\
    \    combo.setSelectedIndex(-1);\n      c.add(combo);\n\n      JButton b = new\
    \ JButton(\"Done\");\n      b.addActionListener(this);\n      c.add(b);\n\n  \
    \    myLabel = new JLabel(\"Please select\");\n      c.add(myLabel);\n      f.pack();\n\
    \      f.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent e)\
    \ {\n    String t = (String) combo.getSelectedItem();\n    if (t == null) t =\
    \ \"Nothing selected\";\n      myLabel.setText(t);\n   }\n}\n```\n\n如果你运行此程序，你会发现最初没有任何选项被选中。如果你点击“Done”，你会得到“Nothing\
    \ selected”消息。如果你选择一个选项然后点击“Done”，你将得到选中的颜色：\n\n![](img/image00152.jpeg)\n\n##\
    \ JComboBox 选中选项\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JComboBox - Swing 组合框类\n\n\
    ∟`setEditable()` - 将组合框作为文本字段使用\n\n本节提供了一个教程示例，介绍了如何调用 `setEditable(true)` 方法将组合框同时作为下拉列表和文本字段使用。\n\
    \n如果你想将组合框既作为下拉列表又作为文本字段，可以在组合框上调用 `setEditable(true)` 方法。这里是一个示例程序：\n\n```java\n\
