  trans: "\n\n本章提供了关于选项对话框（option dialog box）的教程笔记和示例代码。主题包括创建和显示消息、确认、输入和选项对话框；从选项对话框接收输入值；创建和显示内部对话框；直接创建选项对话框。\n\
    \n> javax.swing.JOptionPane - 创建和显示选项对话框\n> showMessageDialog() - 显示消息对话框\n> showConfirmDialog()\
    \ - 显示确认对话框\n> 从确认对话框接收输入\n> showInputDialog() - 显示输入对话框\n> showOptionDialog()\
    \ - 显示选项对话框\n> showInternal*Dialog() - 显示内部对话框\n> createDialog() - 直接创建对话框\n\n\
    ## 结论\n\n*   可以使用 `javax.swing.JOptionPane` 类通过 `showMessageDialog()`、`showConfirmDialog()`、`showInputDialog()`\
    \ 和 `showOptionDialog()` 方法显示不同类型的简单对话框。\n*   `showMessageDialog()` 方法显示一个仅带有文本消息的对话框。\n\
    *   `showConfirmDialog()` 方法显示一个带有文本消息的对话框，并提示用户点击确认按钮。\n*   `showInputDialog()`\
    \ 方法显示一个仅带有文本消息的对话框，并提示用户输入文本内容。\n*   `showOptionDialog()` 方法显示一个包含选项列表的对话框，供用户选择。\n\
    *   默认情况下，对话框被创建为悬浮在父面板之外的独立窗口。如果你想创建限制在父面板内部的对话框，需要使用 `showInternal*Dialog()`\
    \ 方法。\n\n本章列出的示例程序已在 Windows 和 macOS 计算机的 JDK 1.3.1 到 JDK 17 上通过测试。\n\nJava Swing\
    \ 教程 - Herong 的 教程示例\n∟选项对话框\n\n## javax.swing.JOptionPane - 创建和显示选项对话框\n\n本节描述了\
    \ `JOptionPane` 类中的一些静态方法，这些方法用于创建和显示不同类型的选项对话框。\n\n`javax.swing.JOptionPane`\
    \ - 一个允许你创建和显示选项对话框的 Swing 类。`JOptionPane` 的常用方法包括：\n\n*   `showMessageDialog()`\
    \ - 用于创建并显示消息对话框，以展示普通、警告或错误消息。\n*   `showConfirmDialog()` - 用于创建并显示带有“是”、“否”和“取消”按钮的确认对话框。\n\
    *   `showInputDialog()` - 用于创建并显示输入对话框，以提示某些输入。\n*   `showOptionDialog()` - 用于创建并显示通用对话框，以展示消息、获取确认或获取某些输入。\n\
    *   `showInternal*Dialog()` - 用于创建并显示内部对话框，显示在主框架内部。\n\n使用 `JOptionPane` 类创建的所有对话框都是模态的（modal），会禁用其他帧上的所有其他用户界面组件。每次调用\
    \ `show*Dialog()` 方法都会阻塞执行，直到对话框关闭。\n\n所有对话框都必须带有父帧创建。\n\n选项对话框的消息类型（message type）控制在消息文本左侧使用的图标。\n\
    \n选项对话框的选项类型（option type）控制显示哪些选项按钮。\n\n可以使用你自己的选项字符串来自定义选项按钮。\n\nJava Swing 教程\
    \ - Herong 的 教程示例\n∟选项对话框\n\n## showMessageDialog() - 显示消息对话框\n\n本节提供了一个教程示例，说明如何使用静态方法\
    \ `showMessageDialog()` 创建并显示用于 4 种不同类型消息的消息框：信息、警告、错误和普通。\n\n使用 `javax.swing.JOptionPane`\
    \ 类创建和显示的最简单的对话框是消息对话框。可以通过静态方法实现：`showMessageDialog(frame, message, title, type)`，其中：\n\
    \n*   \"frame\" 是作为父帧使用的帧对象。\n*   \"message\" 是要在对话框上显示的消息字符串。\n*   \"title\"\
    \ 是用于对话框标题的标题字符串。\n*   \"type\" 是表示特定消息对话框类型的整数代码。有效的类型代码被预定义为 `JOptionPane` 类中的常量：`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`ERROR_MESSAGE`\
    \ 和 `PLAIN_MESSAGE`。\n\n这里我写了一个用于测试 `showMessageDialog()` 方法的示例程序：\n\n```\n /*\
    \ JOptionPaneShowMessageDialog.java\n * Copyright (c) 1997-2018 HerongYang.com.\
