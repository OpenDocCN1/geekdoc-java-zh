    ### 菜单监听器测试\n\n如果你点击“File”（文件）菜单，移动到“Color”（颜色）菜单，然后移动到“Option”（选项）菜单，你会在 Java\
    \ 控制台窗口上看到一些消息：\n\n```\n Menu Selected: File\nMenu deselected: File\nMenu Selected:\
    \ Color\nMenu deselected: Color\nMenu Selected: Option\n```\n\n关于此教程示例的一些趣味说明：\n\
    \n*   `public class MenuListenerTest implements MenuListener` 声明用于使我的 `MenuListenerTest`\
    \ 对象成为一个 `MenuListener` 对象。\n*   `myMenu.addMenuListener(this);` 语句用于将 `MenuListener`\
    \ 对象添加到 `JMenu` 对象中。\n*   `JMenu myMenu = (JMenu) e.getSource();` 语句用于获取触发事件的\
    \ `JMenu` 对象。\n*   `myMenu.getText()` 表达式用于获取菜单按钮的文本。\n\nJava Swing 教程 - Herong's\
    \ 教程示例\n\n∟菜单栏、菜单、菜单项和监听器\n\n∟JMenuItemActionListenerTest.java - 菜单项动作监听器测试\n\n\
    此节提供了一个教程示例，演示了如何使用 `java.awt.event.ActionListener`（按钮动作监听器接口）来捕获由 `JMenuItem`\
    \ 对象触发的事件。\n\n与任何其他用户界面组件一样，`JMenuItem` 对象在用户与其交互时也会触发事件。如果你想在 `JMenuItem` 对象上发生事件时执行某个任务，你需要为该\
    \ `JMenuItem` 项对象添加一个事件监听器。由于 `JMenuItem` 是 `AbstractButton` 的子类，它与 `AbstractButton`\
    \ 共享监听器接口和事件类：\n\n`java.awt.event.ActionListener` - 一个 AWT 接口，允许你实现自己的事件处理方法：\n\
    \n*   `actionPerformed(ActionEvent)` - 当关联的组件被点击时被调用的事件处理方法。你需要实现此方法来执行自己的任务。\n\
    \n`java.awt.event.ActionEvent` - 一个 AWT 类，表示在组件上发生的事件。该类中最重要的方法是：\n\n*   `getActionCommand()`\
    \ - 返回动作命令字符串的方法。\n\n这里我写了一个测试 `ActionListener` 接口的示例程序：\n\n```java\n /* JMenuItemActionListenerTest.java\n\
