    \      myMenuBar.add(myItem);\n\n      myFrame.setJMenuBar(myMenuBar);\n     \
    \ myFrame.setVisible(true);\n   }\n   private JMenu getFileMenu() {\n      JMenu\
    \ myMenu = new JMenu(\"File\");\n      JMenuItem myItem = new JMenuItem(\"Open\"\
    );\n      myMenu.add(myItem);\n      myItem = new JMenuItem(\"Close\");\n    \
