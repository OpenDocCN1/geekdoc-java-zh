    \nJava Swing 教程 - Herong's Tutorial Examples\n\n∟菜单栏、菜单、菜单项和监听器\n\n∟`setMnemonic()`\
    \ - 在菜单上设置键盘助记键\n\n本节提供了一个教程示例，演示了如何使用 `setMnemonic()` 方法将助记键与菜单关联。助记键允许用户使用键盘上的按键与菜单进行交互。\n\
    \n键盘助记键也可以用于菜单栏中列出的菜单。但它们的行为与菜单项上的助记键不同。\n\n1. 为菜单栏中的菜单分配不同的助记键。\n\n2. 为每个菜单调用\
    \ `setMnemonic()` 方法。\n\n3. 使用 `setMnemonic()` 方法后，菜单项中的文本将带有下划线。\n\n4. 按下 `setMnemonic()`\
    \ 设置的字符将触发一个菜单事件。\n\n"
