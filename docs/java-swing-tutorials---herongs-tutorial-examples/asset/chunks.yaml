    \n![](img/image0179.jpeg)\n\n### 确认对话框\n\n关于这个教程示例的几个有趣的说明：\n\n*   我使用了几个面板和布局来组织设置区域。\n\
    *   为所有的单选按钮和“Show”按钮都添加了动作监听器（action listener）。\n*   监听器中的 `actionPerformed()`\
    \ 方法已实现以处理所有更改。\n*   这个示例缺失的是如何捕获确认对话框上选项按钮的输入。\n\nJava Swing 教程 - Herong 的教程示例\n\
    \n#### 选项对话框\n\n##### 接收确认对话框的输入\n\n本节提供了一个教程示例，介绍如何使用静态方法 `showConfirmDialog()`\
    \ 创建并显示确认对话框，并接收输入以知道点击了哪个按钮。\n\n在之前的教程示例中，当用户点击确认对话框上的 Ok、Yes、No 或 Cancel 等选项按钮时，`showConfirmDialog()`\
    \ 方法实际上返回一个表示所点击按钮的整数代码。有效的类型代码在 `JOptionPane` 类中预定义的常量：\n\n*   `JOptionPane.OK_OPTION`\
    \ - 用户点击了 Ok 按钮。\n*   `JOptionPane.YES_OPTION` - 用户点击了 Yes 按钮。\n*   `JOptionPane.NO_OPTION`\
    \ - 用户点击了 No 按钮。\n*   `JOptionPane.CANCEL_OPTION` - 用户点击了 Cancel 按钮。\n*   `JOptionPane.CLOSED_OPTION`\
    \ - 用户关闭了确认对话框。\n\n"
- fmt: "\n```\n /* JOptionPaneConfirmDialogInput.java\n * Copyright (c) 1997-2018\
    \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\nimport javax.swing.event.*;\npublic class JOptionPaneConfirmDialogInput\
    \ implements ActionListener {\n   JFrame myFrame = null;\n   public static void\
    \ main(String[] a) {\n      (new JOptionPaneConfirmDialogInput()).test();\n  \
    \ }\n   private void test() {\n      myFrame = new JFrame(\"showConfirmDialog()\
