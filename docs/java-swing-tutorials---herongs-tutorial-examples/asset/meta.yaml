  - 问题：我想在帧中绘制一些图形。
- - '###'
  - 解决方案 1：你可以通过扩展 Frame 类来创建你自己的帧类，从而重写 paint() 方法，非常容易地实现这一点。paint() 方法提供了一个 Graphics
    对象，它将为你提供绘制各种类型图形的实用方法。下面的示例代码 FramePaint1.java 展示了如何实现这一点。
- - '###'
  - 解决方案 2：显然，解决方案 1 并不理想，因为我们是在帧本身的 UI 元素上绘制图形。为了只在帧的内容区域绘制图形，我们可以创建一个带有自己的 paint()
    方法的新组件，并将其添加到帧中。下面的示例代码 FramePaint2.java 展示了如何实现这一点。
