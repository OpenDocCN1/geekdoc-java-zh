  \ JCheckBox - Swing 复选框类\n\n本章提供了 `JCheckBox` 类的注释和示例代码。主题包括 `javax.swing.JCheckBox`\
  \ 类的描述；创建复选框和事件监听器的示例程序。\n\n- JCheckBox 及相关方法\n- ActionListener, ChangeListener\
  \ 和 ItemListener\n- isSelected() - 获取复选框状态\n\n## 结论：\n\n- `javax.swing.JCheckBox`\
  \ 类表示复选框。\n- `ActionListener`、`ChangeListener` 或 `ItemListener` 接口可用于复选框上的动作。\n\
  - `isSelected()` 方法用于检测复选框的状态。\n\n本章列出的示例程序已在 Windows 和 macOS 上通过了 JDK 1.3.1 到 17\
  \ 的测试。\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JCheckBox - Swing 复选框类\n\n### javax.swing.JCheckBox\
  \ 相关方法\n\n本节介绍了 `javax.swing.JCheckBox` 类及其常用方法。\n\n`javax.swing.JCheckBox` - 代表\
  \ UI 复选框的 Swing 类。一些有趣的方法包括：\n\n- `JCheckBox(String)` - 创建带有指定字符串的复选框的构造函数。复选框默认未选中。\n\
  - `addActionListener(ActionListener)` - 为此复选框添加动作监听器以处理动作事件。点击此复选框将触发一次动作事件。\n-\
  \ `addChangeListener(ChangeListener)` - 为此复选框添加变化监听器以处理变化事件。点击此复选框将触发多次变化事件。\n-\
  \ `addItemListener(ItemListener)` - 为此复选框添加项目监听器以处理项目事件。点击此复选框将触发一次项目事件。\n- `setActionCommand(String)`\
  \ - 为此复选框设置动作命令字符串的方法。\n- `isSelected()` - 返回复选框状态的方法。\n\n### ActionListener, ChangeListener\
  \ 和 ItemListener\n\n本节提供了一个教程示例，介绍如何使用 `ActionListener`、`ChangeListener` 和 `ItemListener`\
  \ 接口来处理复选框上产生的不同类型的事件。\n\n\n\n\n\n如你从上一节所示，复选框（check box）可以具有 3 种监听器：`ActionListener`、`ChangeListener`\
  \ 和 `ItemListener`。下面的示例程序展示了这些监听器何时被调用以及被调用多少次：\n\n```java\n /* JCheckBoxTest.java\n\
  \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\npublic\
  \ class JCheckBoxTest {\n   public static void main(String[] a) {\n      JFrame\
  \ f = new JFrame(\"My Check Boxes\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \n      MyCheckBox red = new MyCheckBox(\"Red\");\n      f.getContentPane().add(red,BorderLayout.NORTH);\n\
  \n      MyCheckBox green = new MyCheckBox(\"Green\");\n      f.getContentPane().add(green,BorderLayout.CENTER);\n\
  \n      MyCheckBox blue = new MyCheckBox(\"Blue\");\n      f.getContentPane().add(blue,BorderLayout.SOUTH);\n\
  \n      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyCheckBox\
  \ extends JCheckBox \n      implements ActionListener, ChangeListener, ItemListener\
  \  {\n      static int count = 0;\n      String text = null;\n      public MyCheckBox(String\
  \ t) {\n         super(t);\n         text = t;\n         addActionListener(this);\n\
  \         addChangeListener(this);\n         addItemListener(this);\n      }\n \
  \     public void actionPerformed(ActionEvent e) {\n         count++;\n        \
  \ System.out.println(count+\": Action performed - \"+text);\n      }\n      public\
  \ void stateChanged(ChangeEvent e) {\n         count++;\n         System.out.println(count+\"\
  : State changed - \"+text);\n      }\n      public void itemStateChanged(ItemEvent\
  \ e) {\n         count++;\n         System.out.println(count+\": Item state changed\
  \ - \"+text);\n      }\n   }\n}\n```\n\n此示例程序创建了 3 个复选框。每个按钮都有 3 个监听器来处理 3 种不同的事件。监听器类中使用了一个计数器来帮助识别事件的顺序。\n\
  \n如果你运行这个程序，将看到 3 个复选框：“Red”、“Green” 和 “Blue”：\n\n![](img/image00146.jpeg)\n\n###\
  \ JCheckBox Listeners\n\n如果你将鼠标移动到“Red”复选框上，你会看到 1 条“State changed”消息。当你按下“Red”复选框时，你会看到额外的\
  \ 2 条“State changed”消息。当你松开“Red”复选框时，你会看到额外的 5 条消息。当你把鼠标离开“Red”复选框时，你会看到额外的 1 条“State\
  \ changed”消息。\n\n```\n1: State changed - Red\n\n2: State changed - Red\n3: State\
  \ changed - Red\n\n4: State changed on - Red\n5: Item state changed - Red\n6: State\
  \ changed on - Red\n7: Action performed - Red\n8: State changed on - Red\n\n9: State\
  \ changed on - Red\n\n10: State changed on - Green\n\n11: State changed on - Green\n\
  12: State changed on - Green\n\n13: State changed on - Green\n14: Item state changed\
  \ - Green\n15: State changed on - Green\n16: Action performed - Green\n\n17: State\
  \ changed on - Green\n\n18: State changed on - Green\n```\n\n注意：\n\n* Action event（动作事件）仅在你松开复选框时触发一次。\n\
  * Item event（项目事件，`itemStateChanged` 方法调用）仅在你松开复选框时触发一次。\n* Change event（改变事件，`stateChanged`\
  \ 方法调用）会触发多次，当鼠标移入或移出复选框、按下和松开复选框时。\n\nJava Swing Tutorials - Herong's Tutorial\
  \ Examples\n\n∟JCheckBox - Swing Check Box Class\n\n### isSelected() - 获取复选框状态\n\
  \n本节提供了一个关于如何使用 `isSelected()` 方法获取复选框状态的教程示例。\n\n如果你正在使用多个复选框，你需要跟踪它们并使用 `isSelected()`\
  \ 方法获取每个框的状态。这里有一个示例程序：\n```java\n /* JRadioButtonAction.java\n * Copyright (c)\
  \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport javax.swing.*;\npublic class JCheckBoxAction implements\
  \ ActionListener {\n   JCheckBox red; \n   JCheckBox green; \n   JCheckBox blue;\n\
  \   JLabel myLabel = null;\n   public static void main(String[] a) {\n      JCheckBoxAction\
  \ myTest = new JCheckBoxAction();\n      myTest.createFrame();\n   }\n   public\
  \ void createFrame() {\n      JFrame f = new JFrame(\"My Check Boxes\");\n     \
  \ f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container c = f.getContentPane();\n\
  \      c.setLayout(new BoxLayout(c,BoxLayout.Y_AXIS));\n      JPanel p = new JPanel();\n\
  \      p.setLayout(new GridLayout(3,1));\n\n    red = new JCheckBox(\"Red\");\n\
  \      green = new JCheckBox(\"Green\");\n      blue = new JCheckBox(\"Blue\");\n\
  \      p.add(red);\n      p.add(green);\n      p.add(blue);\n\n      c.add(p);\n\
  \      JButton b = new JButton(\"Done\");\n      b.addActionListener(this);\n  \
  \    c.add(b);\n      myLabel = new JLabel(\"Please select\",SwingConstants.CENTER);\n\
  \      c.add(myLabel);\n      f.pack();\n      f.setVisible(true);\n   }\n   public\
  \ void actionPerformed(ActionEvent e) {\n    String t = \"\";\n    if (red.isSelected())\
  \ t += \"Red \";\n    if (green.isSelected()) t += \"Green \";\n    if (blue.isSelected())\
  \ t += \"Blue \";\n    if (t.equals(\"\")) t = \"Nothing selected\";\n      myLabel.setText(t);\n\
  \   }\n}\n```\n\n如果你运行这个程序，最初没有任何复选框被选中。如果你点击“Done”，你会得到“Nothing selected”消息。如果你选择了一些复选框然后点击“Done”，你会得到所有选中的项目：\n\
