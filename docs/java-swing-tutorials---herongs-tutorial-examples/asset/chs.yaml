  \n![](img/image0191.jpeg)\n\n### 使用 publish() 方法的 SwingWorker 线程\n\n- Java Swing\
  \ 教程 - Herong 的教程示例\n- SwingWorker - 后台任务线程\n\n### 使用 \"progress\" 属性的 SwingWorker\
  \ 示例\n\n本节提供了一个教程示例，介绍如何使用 `java.swing.SwingWorker` 类配合 `setProgress()` 方法从 `doInBackground()`\
  \ 方法更新 'progress' 属性值。必须实现 `PropertyChangeListener` 类来捕获调度线程中 'progress' 属性的更新值。\n\
  \n**示例 3：更新 \"progress\" 属性并使用它显示进度** - 此示例展示了如何向调度线程通信后台任务的“进度”。只需要实现 1 个方法和 1\
  \ 个监听器类：\n\n- `T doInBackground()` - 要实现的实例方法以执行任务。在 `doInBackground()` 中，多次调用 `setProgress(int)`\
  \ 方法来发布一个整数，用百分比表示后台任务的进度。\n- `class ... implements PropertyChangeListener {}` -\
  \ 监听器类，实现 `propertyChange()` 方法以捕获更新的百分比值。\n\n以下是示例程序的源代码，SwingWorkerUsingProgress.java:\n\
  \n\n\n\n\n```java\n /* SwingWorkerUsingProgress.java\n * Copyright (c) 1997-2018\
  \ HerongYang.com. All Rights Reserved.\n */\nimport javax.swing.SwingWorker;\nimport\
  \ java.util.Random;\nimport java.time.LocalTime;\nimport java.beans.*;\npublic class\
  \ SwingWorkerUsingProgress \n   extends SwingWorker<Object, Object> {\n   int total\
  \ = 100;\n   int wait = 10;\n\n// 扩展 SwingWorker 类\n   protected Object doInBackground()\
  \ {\n      logMessage(\"doInBackground() started\");\n      int i = 0;\n      Random\
  \ r = new Random();\n      try {\n         while (i<total) {\n            Thread.sleep(wait);\n\
  \            Integer n = Integer.valueOf(r.nextInt());\n            setProgress((100*(i+1))/total);\n\
  \            i++;\n         }\n      } catch (Exception e) {\n         e.printStackTrace();\n\
  \      }\n      logMessage(\"doInBackground() ended\");\n      return null;\n  \
  \ }\n\n// 启动我的扩展 SwingWorker 类\n   public static void main(String[] a) {\n     \
  \ try {\n         SwingWorker<Object, Object> worker \n            = new SwingWorkerUsingProgress();\n\
  \         dumpThreads();\n         worker.addPropertyChangeListener(new myListener());\n\
  \         worker.execute();\n         while (true) {\n            dumpThreads();\n\
  \            Thread.sleep(200);\n         }\n      } catch (Exception e) {\n   \
  \      e.printStackTrace();\n      }\n   }\n   public static void dumpThreads()\
  \ {\n      System.out.println(LocalTime.now()+\" Thread dump:\");\n      Thread.currentThread().getThreadGroup().list();\n\
  \   }\n   public static void logMessage(String s) {\n      System.out.println(LocalTime.now()+\"\
  \ \"\n         +Thread.currentThread().getName()+\": \"+s);\n   }\n   static class\
  \ myListener implements PropertyChangeListener {\n      public void propertyChange(PropertyChangeEvent\
  \ e) {\n         if (\"progress\".equals(e.getPropertyName())) {\n            logMessage(\"\
  propertyChange() \"+e.getNewValue()+\"%\");\n         }\n      }\n   }\n}\n```\n\
  \n### 示例程序的说明：\n\n- 当扩展 `SwingWorker<T,V>` 时，我将 `T` 设置为 `Object`，因为我没有返回任何结果；将 `V`\
  \ 设置为 `Object`，因为我没有发布任何中间值。\n\n- `Object doInBackground()` 的实现用于生成一些随机数。每当生成一个随机数时，我调用\
  \ `setProgress()` 方法来更新名为 `\"progress\"` 的属性，使用一个 0 到 100 之间的整数来表示任务进度的百分比。\n\n\
  - `class myListener {}` 使用 `java.beans.PropertyChangeListener` 接口实现，并挂载到我的 `SwingWorker`\
  \ 实例上，以监听 `\"progress\"` 属性的值变化事件。\n\n- `void propertyChange()` 在 `myListener{}`\
  \ 内部实现，用于捕获更新后的 `\"progress\"` 属性值。\n\n如果你使用 JDK 10 或更高版本编译并运行此示例，你应该得到类似下面的输出消息：\n\
