  \n> - 复选框项目项监听器\n\n> - `javax.swing.event.MenuKeyListener` - 菜单键盘监听器接口\n\n> - `setMnemonic()`\
  \ - 为项目设置快捷键\n\n> - `setAccelerator()` - 为项目设置加速键\n\n> - `setMnemonic()` - 为菜单设置快捷键\n\
  \n结论：\n\n\n\n\n\n* `javax.swing.JMenuBar` 类允许你在主窗框上创建和管理菜单栏。\n* `javax.swing.JMenu`\
  \ 类允许你创建和管理与菜单栏关联的单个菜单。\n* `javax.swing.JMenuItem` 类允许你创建和管理与菜单关联的标准菜单项。\n* `javax.swing.JRadioButtonMenuItem`\
  \ 类允许你创建和管理单选按钮菜单项。\n* `javax.swing.JCheckBoxMenuItem` 类允许你创建和管理复选框菜单项。\n* `javax.swing.event.MenuListener`\
  \ Swing 接口允许你实现自己的菜单事件处理器方法。\n* `java.awt.event.ActionListener` AWT 接口允许你实现自己的事件处理器方法。\n\
  * `javax.swing.event.MenuKeyListener` Swing 接口允许你为键盘输入实现自己的处理器。\n\n本章列出的示例程序已在 `JDK\
  \ 1.6.0` 到 `JDK 15` 环境下经过过测试。\n\nJava Swing 教程 - Herong 的 教程示例\n\n∟菜单栏、菜单、菜单项和监听器\n\
  \n## JMenuBar, JMenu 和 JMenuItem 类\n\n此节描述了 3 种 Swing 类：`JMenuBar`、`JMenu` 和 `JMenuItem`，用于为窗框窗口构建菜单界面。典型的菜单界面具有一个包含多个菜单或菜单项的菜单栏。菜单可以有多个子菜单或菜单项。\n\
  \n### `javax.swing.JMenuBar`\n代表主窗框上菜单栏的 Swing 类。添加到 `JMenuBar` 对象的 `JMenu` 对象将水平显示。`JMenuBar`\
  \ 的一些有趣方法包括：\n\n* `JMenuBar()` - 构造函数，用于创建一个可以添加到窗框窗口的菜单栏。\n* `add(JMenu)` - 向菜单列表的末尾添加新\
  \ `JMenu` 对象的方法。\n* `getMenuCount()` - 返回此菜单栏中菜单数量的方法。\n* `getMenu(int)` - 返回指定位置索引位置的\
  \ `JMenu` 对象的方法。当然，索引 `0` 是第一个菜单。\n* `getSubElements()` - 返回 `MenuElement` 对象数组的方法。\n\
  * `isSelected()` - 如果菜单栏中当前选中了某个元素，则返回 true。\n\n### `javax.swing.JMenu`\n代表用户界面菜单的\
  \ Swing 类。`JMenu` 对象可以添加到 `JMenuBar` 或另一个 `JMenu` 对象中，以形成菜单树结构。`JMenu` 对象实际上有两个图形组件：显示在父级\
  \ `JMenu` 或 `JMenuBar` 中的可点击按钮以及一个弹出窗口。当它的按钮被点击时，它的弹出窗口将显示。`JMenu` 的一些有趣方法包括：\n\n\
  * `JMenu(String)` - 构造函数，使用指定的字符串作为按钮文本来创建菜单。\n* `add(JMenuItem)` - 向当前菜单项列表的末尾添加\
  \ `JMenuItem` 对象的方法。\n* `addSeparator()` - 向当前菜单项列表的末尾添加菜单分隔符的方法。\n* `getItemCount()`\
  \ - 返回其菜单项数量的方法。\n* `getItem(int pos)` - 返回指定位置索引位置的 `JMenuItem` 对象的方法。当然，索引 `0`\
  \ 是第一个菜单项。\n* `isSelected()` - 如果此菜单被选中，则返回 true。\n* `isTopLevelMenu()` - 如果此菜单是顶级菜单，则返回\
  \ true。顶级菜单是添加到菜单栏的菜单，而不是添加到另一个菜单中的。\n* `doClick(int)` - 模拟用户点击此菜单的方法。\n\n### `javax.swing.JMenuItem`\n\
  代表用户界面菜单项的 Swing 类。`JMenuItem` 对象可以按菜单树结构添加到 `JMenuBar` 或另一个 `JMenu` 对象中。`JMenuItem`\
  \ 应该与 `MenuKeyListener` 对象关联，以便在点击菜单项时可以执行相应任务。`JMenuItem` 的有趣方法包括：\n\n* `JMenuItem(String)`\
  \ - 构造函数，使用指定的字符串作为按钮文本来创建菜单项。\n* `addMenuKeyListener(MenuKeyListener)` - 为此菜单项添加\
  \ `MenuKeyListener` 对象的方法。\n* `setEnabled(boolean)` - 根据指定的布尔值设置此菜单项为启用或禁用。\n\n\
