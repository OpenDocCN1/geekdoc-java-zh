  \n## AWT 菜单项测试\n\n关于此教程示例的有趣说明：\n\n- 菜单项可以通过调用 `setEnabled(false)` 方法来禁用。禁用的菜单项将以灰色显示且不可点击。在本示例中，“关闭”（Close）菜单项是被禁用的。\n\
  - 菜单也可以通过调用 `setEnabled(false)` 方法来禁用。禁用的菜单将以灰色显示且不可点击。在本示例中，“自动保存”（Auto save）菜单项是被禁用的。\n\
  \n# MenuItemActionListenerTest.java - AWT 菜单项动作监听器\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.event.ActionListener`（按钮动作监听器接口）来捕获\
  \ `MenuItem` 对象触发的事件。\n\n与其他任何用户界面组件一样，`MenuItem` 对象在用户交互时也会触发事件。如果你希望在 `MenuItem`\
  \ 对象发生事件时执行任务，你需要为该 `MenuItem` 对象添加一个事件监听器。由于 `MenuItem` 是 `AbstractButton` 的子类，它与\
  \ `AbstractButton` 共享监听器接口和事件类：\n\n`java.awt.event.ActionListener` - 一个 AWT 接口，允许你实现自己的事件处理方法：\n\
  \n- `actionPerformed(ActionEvent)` - 当关联的组件被点击时调用的事件处理方法。你需要实现此方法来执行你自己的任务。\n\n\
  `java.awt.event.ActionEvent` - 一个表示组件上发生事件的 AWT 类。该类中最重要的方法是：\n\n- `getActionCommand()`\
  \ - 返回动作命令字符串。\n\n以下我编写的一个用于测试 ActionListener 接口的示例程序：\n\n\n\n\n\n```java\n /* MenuItemActionListenerTest.java\n\
  \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\n\
  import java.awt.MenuBar;\nimport java.awt.Menu;\nimport java.awt.MenuItem;\nimport\
  \ java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\npublic class\
  \ MenuItemActionListenerTest {\n   Frame myFrame = null;\n   public static void\
  \ main(String[] a) {\n      (new MenuItemActionListenerTest()).test();\n   }\n \
  \  private void test() {\n      myFrame = new Frame(\"Menu Listener Test\");\n \
  \     myFrame.setBounds(50,50,250,150);\n\n      MenuBar myMenuBar = new MenuBar();\n\
  \      Menu myMenu = getFileMenu();\n      myMenuBar.add(myMenu);\n      myMenu\
  \ = getColorMenu();\n      myMenuBar.add(myMenu);\n      myMenu = getOptionMenu();\n\
  \      myMenuBar.add(myMenu);\n\n      myFrame.setMenuBar(myMenuBar);\n      myFrame.setVisible(true);\n\
  \   }\n   private Menu getFileMenu() {\n      Menu myMenu = new Menu(\"File\");\n\
  \      MyMenuItem myItem = new MyMenuItem(\"Open\");\n      myMenu.add(myItem);\n\
  \      myItem = new MyMenuItem(\"Close\");\n      myMenu.add(myItem);\n      myMenu.addSeparator();\n\
  \      myItem = new MyMenuItem(\"Exit\");\n      myMenu.add(myItem);\n      return\
  \ myMenu;\n   }\n   private Menu getColorMenu() {\n      Menu myMenu = new Menu(\"\
  Color\");\n      MenuItem myItem = new MyMenuItem(\"Red\");\n      myMenu.add(myItem);\n\
  \      myItem = new MyMenuItem(\"Green\");\n      myMenu.add(myItem);\n      myItem\
  \ = new MyMenuItem(\"Blue\");\n      myMenu.add(myItem);\n      return myMenu;\n\
  \   }\n   private Menu getOptionMenu() {\n      Menu myMenu = new Menu(\"Option\"\
  );\n      MenuItem myItem = new MyMenuItem(\"Sound\");\n      myMenu.add(myItem);\n\
  \      myItem = new MyMenuItem(\"Auto save\");\n      myMenu.add(myItem);\n    \
  \  return myMenu;\n   }\n   private class MyMenuItem extends MenuItem \n      implements\
  \ ActionListener {\n      public MyMenuItem(String text) {\n         super(text);\n\
  \         addActionListener(this);\n      }\n      public void actionPerformed(ActionEvent\
  \ e) {\n         System.out.println(\"Item clicked: \"+e.getActionCommand());\n\
  \      }\n   }\n}\n```\n\n如果你运行这个示例，你将看到窗口显示出如下的菜单栏：\n\n![](img/image00205.jpeg)\n\
  \n# AWT 菜单项监听器测试\n\n如果你点击“Help”菜单项，在“File”菜单中点击“Open”和“Close”，然后在“Color”菜单中点击“Red”、“Green”和“Blue”，你会在\
  \ Java 控制台窗口上看到打印的一些消息：\n\n```\n Item clicked: Help\nItem clicked: Open\nItem clicked:\
  \ Close\nItem clicked: Red\nItem clicked: Green\nItem clicked: Blue\n```\n\n###\
  \ 关于此教程示例的一些有趣说明：\n\n* `private class MyMenuItem extends MenuItem implements ActionListener`\
  \ 声明用于创建一个内部类 `MyMenuItem`，该类继承自 `MenuItem`，实现 `ActionListener`，并将自身添加以处理动作事件。\n\
  \n* `addActionListener(this);` 语句用于将我的内部类 `MyMenuItem` 自身添加以处理动作事件。\n\n* `e.getActionCommand()`\
  \ 表达式用于获取动作命令字符串，在此情况下为菜单项的按钮文本。\n\nJava Swing 教程 - Herong 的教程示例\n\n ∟ 与桌面系统的集成\n\
  \n本章提供了关于与本地桌面系统集成的教程笔记和示例代码。主题包括 `javax.awt.Desktop` 类及其方法的描述；启动默认 浏览器、电子邮件程序和本地桌面系统文件编辑器的示例程序。\n\
  \n> javax.awt.Desktop 及相关方法\n\n> browse() - 启动默认 浏览器\n\n> mail() - 启动默认电子邮件程序\n\n\
  > edit() - 启动给定文件的默认编辑器\n\n## 结论：\n\n* `javax.awt.Desktop` 类代表本地桌面系统。\n* `getDesktop()`\
  \ 方法可以用于获取当前本地桌面系统的实例。\n* `browse(URI)` 方法可以用于使用给定的 `URI` 启动默认 浏览器。\n* `mail(URI)`\
  \ 方法可以用于使用给定的 `mailto` `URI` 启动默认电子邮件程序。\n* `edit(File)` 方法可以用于启动给定文件的默认编辑器。\n\n\
  本章列出的示例程序已通过 JDK 1.6 到 JDK 12 的测试。\n\nJava Swing 教程 - Herong 的教程示例\n\n ∟与桌面系统的集成\n\
  \n ∟javax.awt.Desktop 及相关方法\n\n本节描述了 `javax.awt.Desktop` 类及其常用的方法。\n\n`java.awt.Desktop`\
  \ - 一个 AWT 类，有助于将 Java GUI 应用程序与操作系统的桌面功能集成。它提供了以下有趣的方法：\n\n* `getDesktop()` - 返回代表操作系统当前桌面的\
  \ `Desktop` 对象的方法。\n* `browse(URI)` - 使用给定的 `URI` 启动默认 浏览器的方法。\n* `mail(URI)` -\
  \ 使用给定的 `mailto` `URI` 启动默认电子邮件程序的方法。\n* `edit(File)` - 使用给定文件启动默认编辑器的方法。\n\nJava\
  \ Swing 教程 - Herong 的教程示例\n\n ∟与桌面系统的集成](#part0115.xhtml)\n\n ∟javax.awt.Desktop\
  \ 及相关方法\n\n本节提供了如何使用 `Desktop.browse()` 方法在桌面启动启动默认浏览器的教程示例。要启动默认浏览器，你可以获取 `Desktop`\
  \ 对象。这是一个示例程序：\n\n```java\n /* DesktopBrowser.java\n * Copyright (c) 1997-2018 HerongYang.com.\
  \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ java.swing.*;\nimport java.swing.event.*;\nimport java.net.URI;\npublic class\
  \ DesktopBrowser {\n   public static void main(String[] a) {\n      try {\n    \
  \     URI uri = new URI(\"https://www.herongyang.com\");\n         Desktop desktop\
  \ = Desktop.getDesktop();\n         if (desktop != null) {\n            desktop.browse(uri);\n\
  \         }\n      } catch (Exception e) {\n        e.printStackTrace();\n     \
  \ }\n   }\n}\n```\n\n如果你运行这个程序，你将看到默认浏览器启动。在我的 Windows 10 电脑上，我看到 Edge 启动了。\n\n\
