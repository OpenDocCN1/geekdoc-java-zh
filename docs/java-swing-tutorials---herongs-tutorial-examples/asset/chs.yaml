  \ 64-Bit Server VM (build 15+36-1562, mixed mode, sharing)\n```\n\nJava Swing 教程\
  \ - Herong 教程示例\n\n∟JDK (Java 开发工具包)\n\n## 编写我的第一个 Java 程序\n\n本节提供了一个如何使用 JDK 1.8.0\
  \ 编写、编译和执行第一个 Java 程序的教程示例。\n\n当你的机器上安装了 JDK 后，它提供了两个命令供你编译和运行 Java 程序。\n\n- `javac\
  \ class_name.java` - 编译存储在以程序类同名文件中的 Java 程序。\n- `java -classpath . class_name`\
  \ - 运行编译后的 Java 程序。`-classpath .` 指定当前目录为类路径。\n\n让我们用一个非常简单的 Java 程序来尝试这些命令。使用记事本将以下\
  \ Java 程序输入到名为 `Hello.java` 的文件中：\n\n```\n class Hello {\n   public static void\
  \ main(String[] a) {\n      System.out.println(\"Hello world!\"); \n   }\n}\n```\n\
  \n然后在命令行窗口中使用 `javac` 命令编译此程序：\n\n```\n herong> javac Hello.java\n```\n\n要执行该程序，请使用\
  \ `java` 命令：\n\n```\n herong> java Hello\nHello world!\n```\n\n恭喜，你已成功地输入、编译并执行了你的第一个\
  \ Java 程序。\n\nJava Swing 教程 - Herong 教程示例\n\n∟JDK (Java 开发工具包)\n\n## 将 JDK 的 \"\
