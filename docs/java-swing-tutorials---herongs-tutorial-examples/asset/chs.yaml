  \ HTML\n\n> \n> 在编辑器面板中编辑 Unicode 字符\n\n> \n> javax.swing.JFileChooser - 文件选择对话框\n\
  \n结论：\n\n\n\n\n\n* `javax.swing.JEditorPane` 类可以用于创建一个简单的文本编辑器窗口。\n* `setText()`\
  \ 和 `getText()` 方法可以用于交换 `JEditorPane` 窗口的文本内容。\n* `setContentType()` 方法可以用于在 `JEditorPane`\
  \ 窗口的 `text/html` 和 `text/plain` 显示模式之间进行切换。\n* `javax.swing.JFileChooser` 类可以用于显示一个对话框，以便在本地计算机上选择文件。\n\
  \n本章列出的示例程序已 Windows 和 macOS 计算机上通过 JDK `1.3.1` 到 JDK `17` 的测试。\n\nJava Swing 教程\
  \ - Herong's 教程示例\n\n∟JEditorPane - 编辑器面板类\n\n## 创建一个简单的纯文本编辑器面板\n\n本节提供了一个教程示例，介绍如何通过调用\
  \ `setText()` 设置初始文本内容来创建一个简单的纯文本编辑器面板。\n\n`javax.swing.JEditorPane` 类可以通过两个方法调用来创建一个简单的文本编辑器窗口：\n\
  \n* `setContentType(\"text/plain\")` - 将内容类型设置为纯文本。\n* `setText(text)` - 设置初始文本内容。\n\
