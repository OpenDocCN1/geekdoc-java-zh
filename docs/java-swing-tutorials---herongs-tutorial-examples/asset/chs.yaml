  \ `JButton`。\n* 添加到内容区的“Check” `JButton` 是窗框的孙孙孙子。因此内容区有 3 层组件，因为我必须使用 `this.getParent().getParent()).getParent()`\
  \ 从按钮对象获取窗框对象。\n* `getMenuCount()` 和 `isSelected()` 方法按预期工作。\n\nJava Swing 教程 -\
