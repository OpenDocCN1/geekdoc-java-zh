  \n ∟mail() - 默认电子邮件程序\n\n本节提供了如何使用 `Desktop.mail()` 方法在桌面启动默认电子邮件程序的教程示例。要启动默认电子邮件程序，你可以获取\
  \ `Desktop` 对象。这是一个示例程序：\n\n```java\n /* DesktopSendEmail.java\n * Copyright (c)\
  \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\nimport java.swing.*;\nimport java.swing.event.*;\nimport java.net.URI;\n\
  public class DesktopSendEmail {\n   public static void main(String[] a) {\n    \
  \  try {\n         String address = \"herong_yang@yahoo.com\";\n         String\
  \ subject = \"Java%20Swing%20Tutorials\";\n         String body = \"I%20like%20your%20tutorial%20book!\"\
  ;\n         URI uri = new URI(\"mailto:\"+address+\"?subject=\"+subject\n      \
  \  +\"&body=\"+body);\n         Desktop desktop = Desktop.getDesktop();\n      \
  \   if (desktop != null) {\n            desktop.mail(uri);\n         }\n      }\
  \ catch (Exception e) {\n        e.printStackTrace();\n      }\n   }\n}\n```\n\n\
  注意我在 `mailto` `URI` 字符串中对电子邮件地址、主题和消息主体进行了编码。如果你运行这个程序，你将看到默认电子邮件程序带有给定的电子邮件内容启动。在我的\
  \ Windows 10 电脑上，我看到 Outlook 应用启动了。\n\n![](img/image00207.jpeg)\n\n# 启动电子邮件程序在桌面\n\
  \n\n\n\n\n## edit() - 为指定文件启动默认编辑器\n\n本节提供了一个教程示例，演示了如何使用 `Desktop.edit()` 方法根据文件类型为指定的文件启动默认编辑器。\n\
  \n如果你有一个文件，并想在操作系统的当前桌面上启动与其关联的默认编辑器，可以获取默认 `Desktop` 对象并调用它的 `edit()` 方法。以下是一个示例程序：\n\
  \n```java\n /* DesktopEditFile.java\n * Copyright (c) 1997-2018 HerongYang.com.\
  \ All Rights Reserved.\n */\nimport java.awt.*;\nimport java.awt.event.*;\nimport\
  \ javax.swing.*;\nimport javax.swing.event.*;\nimport java.io.File;\npublic class\
  \ DesktopEditFile {\n   public static void main(String[] a) {\n      try {\n   \
  \  File file = new File(\"Swing.jpg\");\n         Desktop desktop = Desktop.getDesktop();\n\
  \         if (desktop != null) desktop.edit(file);\n      } catch (Exception e)\
  \ {\n        e.printStackTrace();\n      }\n   }\n}\n```\n\n确保你的工作目录下有一个名为 `Swing.jpg`\
  \ 的图像文件。然后运行此程序，你将看到默认图像编辑器启动并打开指定的图像文件。在我的 Windows 10 电脑上，启动的是“画图”程序。\n\n![](img/image00208.jpeg)\n\
