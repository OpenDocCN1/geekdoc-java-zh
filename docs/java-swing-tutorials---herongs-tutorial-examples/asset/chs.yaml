  \n#### 选项对话框\n\n##### 接收确认对话框的输入\n\n本节提供了一个教程示例，介绍如何使用静态方法 `showConfirmDialog()`\
  \ 创建并显示确认对话框，并接收输入以知道点击了哪个按钮。\n\n在之前的教程示例中，当用户点击确认对话框上的 Ok、Yes、No 或 Cancel 等选项按钮时，`showConfirmDialog()`\
  \ 方法实际上返回一个表示所点击按钮的整数代码。有效的类型代码在 `JOptionPane` 类中预定义的常量：\n\n*   `JOptionPane.OK_OPTION`\
  \ - 用户点击了 Ok 按钮。\n*   `JOptionPane.YES_OPTION` - 用户点击了 Yes 按钮。\n*   `JOptionPane.NO_OPTION`\
  \ - 用户点击了 No 按钮。\n*   `JOptionPane.CANCEL_OPTION` - 用户点击了 Cancel 按钮。\n*   `JOptionPane.CLOSED_OPTION`\
  \ - 用户关闭了确认对话框。\n\n\n\n\n```\n /* JOptionPaneConfirmDialogInput.java\n * Copyright\
  \ (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\npublic\
  \ class JOptionPaneConfirmDialogInput implements ActionListener {\n   JFrame myFrame\
  \ = null;\n   public static void main(String[] a) {\n      (new JOptionPaneConfirmDialogInput()).test();\n\
  \   }\n   private void test() {\n      myFrame = new JFrame(\"showConfirmDialog()\
  \ Input Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \      Container myPane = myFrame.getContentPane();\n      JButton myButton = new\
  \ JButton(\"Show\");\n      myButton.addActionListener(this);\n      myPane.add(myButton);\n\
  \      myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent\
  \ e) {\n      int messageType = JOptionPane.INFORMATION_MESSAGE;\n      int optionType\
  \ = JOptionPane.YES_NO_CANCEL_OPTION;\n      int code = JOptionPane.showConfirmDialog(myFrame,\
  \ \n         \"Do you want to continue?\", \n         \"Confirmation Dialog Box\"\
  , optionType, messageType);\n\n      String answer = \"Unknown\";\n      if (code\
  \ == JOptionPane.OK_OPTION) {\n         answer = \"Ok\";\n      } else if (code\
  \ == JOptionPane.YES_OPTION) {\n         answer = \"Yes\";\n      } else if (code\
  \ == JOptionPane.NO_OPTION) {\n         answer = \"No\";\n      } else if (code\
  \ == JOptionPane.CANCEL_OPTION) {\n         answer = \"Cancel\";\n      } else if\
  \ (code == JOptionPane.CLOSED_OPTION) {\n         answer = \"Closed\";\n      }\n\
  \      System.out.println(\"Answer: \"+answer);\n   }\n}\n```\n\n如果你运行此示例并点击 Show\
