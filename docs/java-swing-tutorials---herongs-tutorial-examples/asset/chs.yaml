  ∟选项对话框\n\n## showConfirmDialog() - 显示确认对话框\n\n本节提供了一个教程示例，说明如何使用静态方法 `showConfirmDialog()`\
  \ 创建并显示用于 3 种不同选项和 4 种不同类型消息的确认对话框：信息、警告、错误和普通。\n\n\n\n\n\n*   `\"option\"` 是一个整数代码，表示特定的确认选项类型。有效的类型代码在\
  \ `JOptionPane` 类中预定义的常量：`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION` 和 `OK_CANCEL_OPTION`。\n\
