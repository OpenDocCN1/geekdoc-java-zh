  \      String[] options = {\"Java\", \"C++\", \"VB\", \"PHP\", \"Perl\"};\n    \
  \  int code = JOptionPane.showInternalOptionDialog(\n         myFrame.getContentPane(),\
  \ \n         \"What language do you prefer?\", \n         \"Option Dialog Box\"\
  , 0, messageType, \n         null, options, \"PHP\");\n      System.out.println(\"\
  Answer: \"+code);\n   }\n}\n```\n\n如果你运行此示例并点击“Show”按钮，你将看到一个如下所示输入对话框：\n\n![](img/image00183.jpeg)\n\
  \n内部对话框\n\nJava Swing 教程 - Herong 的教程示例\n\n∟选项对话框\n\n### createDialog() - 直接创建对话框\n\
  \n本节提供了一个教程示例，阐述如何使用静态方法 `showInputDialog()` 创建并显示输入对话框，以从用户获取文本字符串输入。\n\n如果你不想使用\
  \ `show*Dialog()` 方法自动创建和显示对话框，可以使用 `createDialog()` 方法手动创建对话框。\n\n1.  使用 `myPane\
  \ = new JOptionPane()` 创建一个空的选项面板（option pane）对象，该对象代表对话框的内容面板。\n2.  使用 `myPane.setMessageType(type)`\
  \ 使用类型代码 `INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`ERROR_MESSAGE`、`PLAIN_MESSAGE`\
  \ 或 `QUESTION_MESSAGE` 在选项面板上设置消息类型。\n3.  使用 `myPane.setMessage(message)` 使用字符串在选项面板上设置消息文本。\n\
  4.  使用 `myPane.setOptionType(type)` 使用选项代码 `YES_NO_OPTION`、`YES_NO_CANCEL_OPTION`\
  \ 或 `OK_CANCEL_OPTION` 在选项面板上设置选项类型。如果你正在设置自己的选项，则不需要此操作。\n5.  使用 `myPane.setOptions(options)`\
  \ 使用字符串数组在选项面板上设置选项。这将覆盖由选项类型创建的选项。\n6.  使用 `myPane.setInitialValue(default)` 使用字符串在选项面板上设置默认选项。\n\
  7.  使用 `myDialog = myPane.createDialog(parent, title)` 使用父级框架和标题字符串创建最终的对话框。\n8.\
  \  使用 `myDialog.setVisible(true)` 设置最终对话框可见。\n9.  使用 `answer = myPane.getValue()`\
  \ 获取用户在对话框上选择/输入的答案。\n\n这是一个我编写的用于测试 `createDialog()` 方法的示例程序：\n\n```\n /* JOptionPaneCreateDialog.java\n\
  \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.*;\nimport javax.swing.event.*;\npublic\
  \ class JOptionPaneCreateDialog \n   implements ActionListener {\n   JFrame myFrame\
  \ = null;\n   public static void main(String[] a) {\n      (new JOptionPaneCreateDialog()).test();\n\
  \   }\n   private void test() {\n      myFrame = new JFrame(\"createDialog() Test\"\
  );\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n      Container\
  \ myPane = myFrame.getContentPane();\n      JButton myButton = new JButton(\"Create\"\
  );\n      myButton.addActionListener(this);\n      myPane.add(myButton);\n     \
  \ myFrame.pack();\n      myFrame.setVisible(true);\n   }\n   public void actionPerformed(ActionEvent\
  \ e) {\n      String[] options = {\"Java\", \"C++\", \"VB\", \"PHP\", \"Perl\"};\n\
  \      JOptionPane myPane = new JOptionPane();\n      myPane.setMessageType(JOptionPane.QUESTION_MESSAGE);\n\
  \      myPane.setMessage(\"What language do you prefer?\");\n      myPane.setOptions(options);\n\
  \      myPane.setInitialValue(\"PHP\");\n      JDialog myDialog = myPane.createDialog(myFrame,\
  \ \"Option Dialog Box\");\n      myDialog.setVisible(true);\n      Object answer\
  \ = myPane.getValue();\n      System.out.println(\"Answer: \"+answer);\n   }\n}\n\
  ```\n\n如果你运行此示例并点击“Create”按钮，你将看到一个如下所示输入对话框：\n\n![](img/image0184.jpeg)\n\n在选项对话框上选择“Perl”。重复使用“Java”选项按钮和关闭对话框图标进行测试。你将看到在\
  \ Java 控制台窗口上打印了一些消息：\n\n```\nAnswer: Perl\nAnswer: Java\nAnswer: null\n```\n\n\
  关于此教程示例的一些有趣说明：\n\n*   在此示例中创建的对话框与 `JOptionPaneOptionDialog.java` 示例中 `showOptionDialog()`\
  \ 方法创建的对话框相同。\n*   但 `showOptionDialog()` 方法返回数组的整数索引。而 `myPane.getValue()` 返回数组的字符串元素。\n\
  \nJava Swing 教程 - Herong 的教程示例\n\n### JEditorPane - 编辑器面板类\n\n本章提供了关于编辑器面板类的教程说明和示例代码。主题包括简单的文本编辑器面板；从编辑器面板保存文本到文件；在编辑器面板中编辑\
