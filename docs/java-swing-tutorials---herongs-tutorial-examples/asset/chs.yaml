  \ - Herong 的教程示例\n\n## 容器中组件的布局\n\n本章提供了关于组件布局的教程笔记和示例代码。主题包括组件布局的介绍；BorderLayout、FlowLayout、BoxLayout、GridLayout\
  \ 和 GridBagLayout 的教程示例。\n\n> 什么是布局？\n> java.awt.BorderLayout - 边界布局\n> java.awt.FlowLayout\
  \ - 流式布局\n> java.awt.BoxLayout - 盒子布局\n> java.awt.GridLayout - 网格布局\n> java.awt.GridBagLayout\
  \ - 网格袋布局\n\n## 结论：\n\n*   布局是一组规则，定义了图形组件应该如何在容器中进行对齐。\n*   Java 提供了 5 种内置布局：Border、Flow、Box、Grid\
  \ 和 Grid Bag 布局。\n*   `java.awt.BorderLayout` 类允许你管理边界布局，该布局在东、南、西、北和中心五个区域显示 5\
  \ 个组件。\n*   `java.awt.FlowLayout` 类允许你管理流式布局，该布局在水平方向上顺序显示无限数量的组件并在容器的右边缘换行。\n*\
  \   `java.awt.BoxLayout` 类允许你管理盒子布局，该布局在水平或垂直方向上顺序显示无限数量的组件。组件调整大小以适应容器宽度。\n*  \
  \ `java.awt.GridLayout` 类允许你管理网格布局，该布局按行和列显示无限数量的组件。组件会调整大小以适应容器。\n*   `java.awt.GridBagLayout`\
  \ 类允许你管理网格袋布局，该布局按行和列显示组件。\n\n示例程序在 Windows 和 macOS 上通过了测试。\n\nJava Swing 教程 - Herong\
  \ 的教程示例\n\n## 容器中组件的布局](#part0071.xhtml)\n\n### 什么是布局？\n\n布局是一组定义了图形组件应该如何在容器中进行对齐的规则。\n\
  \n在容器中放置组件有两种方法：\n\n*   使用预定义布局并允许布局决定放置位置。这是一种软性放置方法。如果容器更改大小，组件的位置将被调整。但你可能无法精确地达到想要的位置。\n\
  *   使用容器坐标指定组件的位置。这是一种硬性放置方法。你可以精确地达到想要的位置。但如果容器更改大小，组件的位置将不会调整。\n\nAWT 提供了许多预定义布局供你使用：\n\
  \n*   `java.awt.BorderLayout` - 将容器划分为东、南、西、北和中心五个区域，并每个区域分配一个组件。\n*   `java.awt.FlowLayout`\
  \ - 取无限数量的组件，让它们自然地水平流动，然后垂直流动。\n*   `java.awt.BoxLayout` - 取无限数量的组件，让它们在一个方向上水平或垂直流动。\n\
  *   `java.awt.GridLayout` - 将容器划分为行和列，并每个单元格分配一个组件。\n*   `java.awt.GridBagLayout`\
  \ - 将容器划分为行和列，并为大小不等的单元格分配一个组件。\n\n### 边界布局\n\n本节提供了一个教程示例，说明如何创建 BorderLayout 来在容器中布局组件。BorderLayout\
  \ 有 5 个固定部分：北、南、西、东和中心。\n\n**java.awt.BorderLayout** - 一个非常简单的布局，其功能如下：\n\n*   将容器划分为五个区域：东、南、西、北和中心。\n\
  *   最多只接受 5 个组件，每个区域一个。\n*   调整每个组件的大小以匹配其区域的大小。\n*   作为容器的默认布局。\n*   当容器调整大小时，调整每个区域的大小。\n\
  \n\n\n\n\n```java\n /* BorderLayoutTest.java\n * Copyright (c) 1997-2018 HerongYang.com.\
  \ All Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class\
  \ BorderLayoutTest {\n   public static void main(String[] a) {\n      JFrame myFrame\
  \ = new JFrame(\"FlowLayout Test\");\n      myFrame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \      Container myPane = myFrame.getContentPane();\n\n      myPane.setLayout(new\
  \ BorderLayout());\n      myPane.add(new JButton(\"North\"), BorderLayout.NORTH);\n\
  \      myPane.add(new JButton(\"South\"), BorderLayout.SOUTH);\n      myPane.add(new\
  \ JButton(\"East\"), BorderLayout.EAST);\n      myPane.add(new JButton(\"West\"\
  ), BorderLayout.WEST);\n      myPane.add(new JButton(new ImageIcon(\"java.gif\"\
  )), \n         BorderLayout.CENTER);\n      myFrame.pack();\n      myFrame.setVisible(true);\n\
  \   }\n}\n```\n\n如果你运行这个示例，你将得到：\n\n![](img/image00172.jpeg)\n\n### 布局 - BorderLayout\n\
  \nJava Swing 教程 - Herong 的教程示例\n\n∟容器中组件的布局\n\n∟java.awt.FlowLayout - 流布局布局\n\n\
  本节提供了一个教程示例，介绍如何创建一个 `FlowLayout` 来在容器中布局组件。`FlowLayout` 可以包含许多元素，先水平排列，然后垂直排列。\n\
  \n`java.awt.FlowLayout` - 另一种非常简单的布局，它：\n\n* 接受无限数量的组件。\n* 使用每个组件的默认尺寸。\n* 将每个组件在行中相邻排列。如果当前行空间不足，组件将放置在下一行的开头。\n\
  * 当容器调整大小时，会重新排列流布局。\n\n我没有看到这种布局的任何潜在用途。但我很有兴趣看当容器调整大小时它是如何重新排列流的。因此，我决定使用 `FlowLayout`\
  \ 来布局包含几种不同类型组件的窗口。我希望窗口看起来像这样：\n\n```\n - Details ----------------\n|     Name:\
