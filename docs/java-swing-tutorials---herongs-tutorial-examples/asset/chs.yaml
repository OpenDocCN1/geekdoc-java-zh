  \ Red\nItem clicked: Green\nItem clicked: Blue\nItem clicked: Help\n```\n\n### 关于此教程示例的的一些有趣说明：\n\
  \n* 我在主类上只实现了一个接口：`ActionListener`。\n\n* 使用语句 `myItem.setAccelerator( KeyStroke.getKeyStroke(\
  \ KeyEvent.VK_*, ActionEvent.CTRL_MASK ) );` 来为菜单项分配特定的快捷键。\n\n* 大多数 GUI 都遵循使用 `<Ctrl>`\
  \ 作为菜单项快捷键修饰键的惯例。\n\n* 当按下快捷键 `<Ctrl>-d` 时，“Red（红色）”菜单项触发了一个动作事件（action event），因为它分配了匹配的快捷键。\n\
  \n* 菜单栏中列出的“Help（帮助）”菜单项的快捷键也能正常工作。\n\nJava Swing 教程 - Herong's Tutorial Examples\n\
  \n∟菜单栏、菜单、菜单项和监听器\n\n∟`setMnemonic()` - 在菜单上设置键盘助记键\n\n本节提供了一个教程示例，演示了如何使用 `setMnemonic()`\
  \ 方法将助记键与菜单关联。助记键允许用户使用键盘上的按键与菜单进行交互。\n\n键盘助记键也可以用于菜单栏中列出的菜单。但它们的行为与菜单项上的助记键不同。\n\
  \n1. 为菜单栏中的菜单分配不同的助记键。\n\n2. 为每个菜单调用 `setMnemonic()` 方法。\n\n3. 使用 `setMnemonic()`\
  \ 方法后，菜单项中的文本将带有下划线。\n\n4. 按下 `setMnemonic()` 设置的字符将触发一个菜单事件。\n\n\n\n\n\n如果你按下 `<Alt>-f`、`<Alt>-c`、`<Alt>-o`\
  \ 和 `<Alt>-h`，你将在 Java 控制台窗口中看到一些消息：\n\n```\n Menu Selected: File\nMenu deselected:\
