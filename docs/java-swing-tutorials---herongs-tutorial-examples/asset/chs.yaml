  \n### AWT 文本字段和 ActionListener\n\n本节提供了一个教程示例，展示了如何创建一个 AWT 文本字段，并实现 `ActionListener`\
  \ 监听器作为事件处理器。\n\nAWT `TextField` 组件可以直接触发 `ActionEvent`。这是一个示例程序，向你展示 `TextField`\
  \ 的 `ActionEvent` 是如何工作的：\n\n```java\n /* TextFieldTest.java\n * Copyright (c) 1997-2018\
  \ HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame;\nimport java.awt.TextField;\n\
  import java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\npublic\
  \ class TextFieldTest {\n   public static void main(String[] a) {\n      Frame f\
  \ = new Frame(\"Text Test\");\n      TextField t = new TextField(16);\n      f.add(t);\n\
  \      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyTextField\
  \ extends TextField\n      implements ActionListener {\n      static int count =\
  \ 0;\n      public MyTextField(int l) {\n         super(l);\n         addActionListener(this);\n\
  \      }\n      public void actionPerformed(ActionEvent e) {\n         count++;\n\
  \         System.out.println(count+\": Action performed - \"+getText());\n     \
  \ }\n   }\n}\n```\n\n运行此程序并在文本字段执行以下操作：\n\n* 输入“Hello”。\n* 按回键。\n\n* 输入“World!”.\n\
  * 按回键。\n\n文本字段看起来应该是：\n\n![](img/image00201.jpeg)\n\n#### AWT 文本字段 ActionListener\n\
  \n你会在控制台中得到以下输出：\n\n```\n1: Action performed - Hello\n2: Action performed - World!\n\
  ```\n\n输出确认了：\n\n* 当按下按键时会调用 `ActionListener`。\n\nJava Swing Tutorials - Herong's\
  \ Tutorial Examples\n\n∟AWT (Abstract Windows Toolkit)\n\n\n\n\n\n# MenuTest.java\
  \ - AWT 菜单程序\n\n本节提供了一个教程示例，介绍如何使用 `java.awt.Menu` 类创建多个菜单，以及如何将它们添加到菜单栏中。当选中菜单时，添加到菜单中的子菜单和菜单项将垂直列出。\n\
  \n以下我编写的一个用于测试 `java.awt.Menu` 类的示例程序：\n\n```\n /* MenuTest.java\n * Copyright (c)\
  \ 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.Frame; \n\
  import java.awt.MenuBar; \nimport java.awt.Menu; \nimport java.awt.MenuItem; \n\
  public class MenuTest {\n   Frame myFrame = null;\n   public static void main(String[]\
  \ a) {\n      (new MenuTest()).test();\n   }\n   private void test() {\n      myFrame\
  \ = new Frame(\"Menu Test\");\n      myFrame.setBounds(50,50,250,150);\n      MenuBar\
  \ myMenuBar = new MenuBar();\n      Menu myMenu = getFileMenu();\n      myMenuBar.add(myMenu);\n\
  \      myMenu = getColorMenu();\n      myMenuBar.add(myMenu);\n\n      myFrame.setMenuBar(myMenuBar);\n\
  \      myFrame.setVisible(true);\n   }\n   private Menu getFileMenu() {\n      Menu\
  \ myMenu = new Menu(\"File\");\n      Menu mySubMenu = getOpenMenu();\n      myMenu.add(mySubMenu);\n\
