  \n### JFrame - 主帧类](#part0016.xhtml)\n\n### 创建指定大小和位置的帧\n\n本节提供了一个教程示例，介绍如何使用 `setBounds()`\
  \ 和 `setVisible()` 方法创建一个指定大小和位置的帧。\n\n**问题**：我想创建一个特定大小的帧窗口，并将其显示在屏幕上的特定位置。\n\n\
  **解决方案**：你可以使用 `JFrame.setBounds()` 方法定义帧的位置和大小。然后使用 `setVisible()` 方法使帧可见。\n\n\
  ```java\nimport javax.swing.*;\npublic class JFrameTest {\n   public static void\
  \ main(String[] a) {\n      JFrame f = new JFrame(\"Frame\");\n      f.setBounds(50,50,150,150);\n\
  \      f.setVisible(true);\n   }\n}\n```\n\n如果你运行此示例，你将得到：\n\n![](img/image00132.jpeg)\n\
  \n### JFrame 测试\n\n笔记 1：`JFrame.setVisible()` 启动 AWT 线程并在屏幕上显示帧。\n笔记 2：`JFrame.setDefaultCloseOperation()`\
  \ 可在帧关闭时终止程序。\n笔记 3：`JFrame.setContentPane()` 可用于你自己的组件替换内容面板。\n\n\n\n\n\n## 解决方案\
  \ 3\n\n你可以创建一个新的窗口事件监听器类，并将该类的类的对象添加到 `JFrame` 对象中。在新的窗口事件监听器中，你可以实现自定义的 `windowClosing()`\
  \ 处理器方法。当然，创建新窗口事件监听类最快的方法是扩展 `WindowAdapter` 类。下面的示例代码 `JFrameClose3.java` 展示了如何实现。\n\
  \n```java\n /* JFrameClose3.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.awt.event.*;\nimport javax.swing.*;\npublic\
  \ class JFrameClose3  {\n   public static void main(String[] a) {\n      JFrame\
  \ f = new JFrame();\n      f.setTitle(\"Closing Frame with Window Listener\");\n\
  \      f.setBounds(100,50,500,300);\n      f.addWindowListener(new MyWindowListener());\n\
  \      f.setVisible(true);\n   }\n   static class MyWindowListener extends WindowAdapter\
  \ {\n      public void windowClosing(WindowEvent e) {\n         System.exit(0);\n\
  \      }\n   }\n}\n```\n\nJava Swing 教程 - Herong 的教程示例\n\n∟JFrame - 主窗口类\n\n## 列出和中断\
  \ AWT 线程\n\n本节提供了一个关于如何列出 AWT 线程以及如何使用 `interrupt()` 方法中断 AWT 线程的教程示例。\n\n**问题**：我想知道由\
  \ `Swing` 包和 `AWT` 包共创建了多少线程。如果我向所有这些线程发送中断信号，会发生什么？\n\n**解决方案**：这很简单。只需获取当前线程组的所有线程列表，然后一个一个地中断它们。这里有一个示例程序展示如何如何操作：\n\
  \n```java\n /* FrameThreads.java\n * Copyright (c) 1997-2018 HerongYang.com. All\
  \ Rights Reserved.\n */\nimport java.awt.*;\nimport javax.swing.*;\npublic class\
  \ FrameThreads {\n   public static void main(String[] a) {\n      JFrame f = new\
  \ JFrame(\"Frame 1\");\n      f.setBounds(0,0,100,100);\n      f.setVisible(true);\n\
  \      f = new JFrame(\"Frame 2\");\n      f.setBounds(50,50,100,100);\n      f.setVisible(true);\n\
  \      f = new JFrame(\"Frame 3\");\n      f.setBounds(100,100,100,100);\n     \
  \ f.setVisible(true);\n      Thread[] l = new Thread[100];\n      int n = Thread.enumerate(l);\n\
  \      Thread g = null;\n      for (int i=0; i<n; i++) {\n         System.out.println(\"\
  Active thread = \"+l[i].getName());\n      }\n      Thread t = Thread.currentThread();\n\
  \      for (int i=0; i<n; i++) {\n         try {\n            Thread.sleep(1000*30);\n\
  \         } catch (Exception e) {\n            System.out.println(\"Interrupted.\"\
  );\n         }\n         if (t != l[i]) {\n            System.out.println(\"Interrupting\
  \ thread = \"\n               +l[i].getName());\n            l[i].interrupt();\n\
  \         }\n      }\n   }\n}\n```\n\n如果你使用 `JDK 1.5 或更高版本` 运行此程序，你将看到屏幕上出现 3 个窗口。每隔\
  \ 30 秒，我的程序就会向每个线程发送一个中断信号。当中断信号到达“Java2D Disposer”线程时，会发生运行时异常并强制应用程序终止。以下列表显示了我程序的输出：\n\
  \n```\n herong> \\Progra~1\\Java\\jdk1.5.0_09\\bin\\java FrameThreads\n\nActive\
  \ thread = main\nActive thread = AWT-Windows\nActive thread = AWT-Shutdown\nActive\
  \ thread = AWT-EventQueue-0\nActive thread = Java2D Disposer\nInterrupting thread\
  \ = AWT-Windows\nInterrupting thread = AWT-Shutdown\nInterrupting thread = AWT-EventQueue-0\n\
  Interrupting thread = Java2D Disposer\nException while removing reference: java.lang.InterruptedException\n\
  java.lang.InterruptedException\n   at java.lang.Object.wait(Native Method)\n   at\
  \ java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:111)\n   at java.lang.ref.ReferenceQueue.remove(ReferenceQueue.java:127)\n\
  \   at sun.java2d.Disposer.run(Disposer.java:100)\n   at java.lang.Thread.run(Thread.java:534)\n\
  AWT blocker activation interrupted:\njava.lang.InterruptedException\n   at java.lang.Object.wait(Native\
  \ Method)\n   at java.lang.Object.wait(Object.java:429)\n   at sun.awt.AWTAutoShutdown.activateBlockerThread(AWTAutoShut...\n\
  \   at sun.awt.AWTAutoShutdown.setToolkitBusy(AWTAutoShutdown.ja...\n   at sun.awt.AWTAutoShutdown.notifyToolkitThreadBusy(AWTAutoSh...\n\
  \   at sun.awt.windows.WToolkit.eventLoop(Native Method)\n   at sun.awt.windows.WToolkit.run(WToolkit.java:534)\n\
  ```\n\n\n\n\n\n# Java Swing 教程 - Herong 示例\n\n## JFrame - 主框架类\n\n### 在框架标题栏中显示中文\n\
