  \ 进行过测试。\n\n\n\n\n\n### javax.swing.JToggleButton.ToggleButtonModel\n\n`ToggleButtonModel`:\
  \ 一个 Swing 类，表示切换按钮数据模型的默认实现。`ToggleButtonModel` 是嵌套在 `javax.swing.JToggleButton`\
  \ 内部的内部类，而后者是 `JRadioButton` 的基类。\n\n*   `getActionCommand()` - 用于返回关联按钮的动作命令字符串的方法。\n\
  \nJava Swing 教程 - Herong 的教程示例\n\n∟JRadioButton - Swing 单选按钮类\n\n### ActionListener,\
  \ `ChangeListener` 和 `ItemListener`\n\n本节提供了一个教程示例，展示了如何使用 `ActionListener`、`ChangeListener`\
  \ 和 `ItemListener` 接口来处理单选按钮上生成的不同类型的事件。\n\n正如前一节所示，单选按钮可以有 3 种事件监听器：`ActionListener`、`ChangeListener`\
  \ 和 `ItemListener`。下面的示例程序向你展示了这些监听器何时被调用以及调用几次：\n\n```\n /* JRadioButtonTest.java\n\
  \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.event.*;\npublic class JRadioButtonTest\
  \ {\n   public static void main(String[] a) {\n      JFrame f = new JFrame(\"My\
  \ Radio Buttons\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n \
  \     ButtonGroup g = new ButtonGroup();\n      MyRadioButton b1 = new MyRadioButton(\"\
  On\");\n      g.add(b1);\n      f.getContentPane().add(b1,BorderLayout.NORTH);\n\
  \      MyRadioButton b2 = new MyRadioButton(\"Off\");\n      g.add(b2);\n      f.getContentPane().add(b2,BorderLayout.SOUTH);\n\
  \      f.pack();\n      f.setVisible(true);\n   }\n   private static class MyRadioButton\
  \ extends JRadioButton \n      implements ActionListener, ChangeListener, ItemListener\
  \  {\n      static int count = 0;\n      String text = null;\n      public MyRadioButton(String\
  \ t) {\n         super(t);\n         text = t;\n         addActionListener(this);\n\
  \         addChangeListener(this);\n         addItemListener(this);\n      }\n \
  \     public void actionPerformed(ActionEvent e) {\n         count++;\n        \
  \ System.out.println(count+\": Action performed - \"+text);\n      }\n      public\
  \ void stateChanged(ChangeEvent e) {\n         count++;\n         System.out.println(count+\"\
  : State changed on - \"+text);\n      }\n      public void itemStateChanged(ItemEvent\
  \ e) {\n         count++;\n         System.out.println(count+\": Item state changed\
  \ - \"+text);\n      }\n   }\n}\n```\n\n此示例程序创建两个单选按钮并将它们放入同一个按钮组中。每个按钮都有 3 个监听器来处理\
  \ 3 种不同类型的事件。监听器类中使用计数器来帮助识别事件的顺序。\n\n如果你运行此程序，将看到两个单选按钮：一个标记为 \"On\"，另一个标记为 \"\
  Off\"：\n\n![](img/image00148.jpeg)\n\n#### JRadioButton 监听器\n\n如果你按下并按住 \"On\" 按钮，将在命令行窗口看到\
  \ 2 条消息。如果你松开 \"On\" 按钮，将看到额外的 5 条新消息。如果你继续按下并按住 \"Off\" 按钮，将看到额外的 2 条消息。如果你松开 \"\
  Off\" 按钮，将看到额外的 7 条消息。以下是所有消息列表：\n\n```\n 1: State changed on - On\n2: State changed\
  \ on - On     - \"On\" pressed\n3: State changed on - On\n4: Item state changed\
  \ - On\n5: State changed on - On\n6: Action performed - On\n7: State changed on\
  \ - On     - \"On\" released\n8: State changed on - Off\n9: State changed on - Off\
  \    - \"Off\" pressed\n10: State changed on - On\n11: Item state changed - On\n\
  12: State changed on - Off\n13: Item state changed - Off\n14: State changed on -\
  \ Off\n15: Action performed - Off\n16: State changed on - Off   - \"Off\" released\n\
  ```\n\n注意：\n\n*   当你松开按钮时，动作事件仅触发一次。\n*   改变事件（`stateChanged` 方法调用）在按下按钮时触发 2 次；在松开按钮时再次触发\
  \ 2 次。这告诉我们按钮有多于 2 个状态：选中和未选中。\n*   项目事件（`itemStateChanged` 方法调用）在松开按钮时仅触发一次。\n\
  *   在按钮组中，如果一个按钮被选中，其他被选中的按钮将取消选中。事件 #10 和 #11 显示，当 \"Off\" 被选中时，“On\" 会被取消选中。\n\
  \nJava Swing 教程 - Herong 的教程示例\n\n∟JRadioButton - Swing 单选按钮类\n\n### `getSelection()`\
  \ - 获取选中的按钮\n\n本节提供了一个教程示例，展示了如何使用 `getSelection()` 方法来确定按钮组中哪个按钮被选中了。\n\n如果按钮组中有许多单选按钮，你如何找到当前选中的那个？一种方法是使用\
  \ `ButtonGroup` 类的 `getSelection()` 方法。这里有一个示例程序：\n\n```\n /* JRadioButtonAction.java\n\
  \ * Copyright (c) 1997-2018 HerongYang.com. All Rights Reserved.\n */\nimport java.awt.*;\n\
  import java.awt.event.*;\nimport javax.swing.*;\npublic class JRadioButtonAction\
  \ implements ActionListener {\n   ButtonGroup myGroup = null;\n   JLabel myLabel\
  \ = null;\n   public static void main(String[] a) {\n      JRadioButtonAction myTest\
  \ = new JRadioButtonAction();\n      myTest.createFrame();\n   }\n   public void\
  \ createFrame() {\n      JFrame f = new JFrame(\"My Radio Buttons\");\n      f.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \      Container c = f.getContentPane();\n      c.setLayout(new BoxLayout(c,AXIS));\n\
  \      myGroup = new ButtonGroup();\n      JPanel p = new JPanel();\n      c.setLayout(new\
  \ GridLayout(3,1));\n      addOption(p,myGroup,\"Red\");\n      addOption(p,myGroup,\"\
  Green\");\n      addOption(p,myGroup,\"Blue\");\n      c.add(p);\n      JButton\
  \ b = new JButton(\"Select\");\n      b.addActionListener(this);\n      c.add(b);\n\
  \      myLabel = new JLabel(\"Please select\",SwingConstants.CENTER);\n      c.add(myLabel);\n\
  \      f.pack();\n      f.setVisible(true);\n   }\n   public void addOption(JPanel\
  \ p, ButtonGroup g, String t) {\n      JRadioButton b = new JRadioButton(t);\n \
  \     b.setActionCommand(t);\n      p.add(b);\n      g.add(b);\n   }\n   public\
  \ void actionPerformed(ActionEvent e) {\n      ButtonModel b = myGroup.getSelection();\n\
  \      String t = \"Not selected\";\n      if (b!=null) t = b.getActionCommand();\n\
  \      myLabel.setText(t);\n   }\n}\n```\n\n如果你运行此程序，你会看到没有任何单选按钮被选中。点击 \"Select\"\
  ，你会得到 \"Not selected\" 消息。如果你选择任何单选按钮，然后点击 \"Select\"，将得到正确的消息：\n\n![](img/image0019.jpeg)\n\
