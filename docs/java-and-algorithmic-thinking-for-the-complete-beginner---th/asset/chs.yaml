  \ 所有递归算法必须遵循的三个规则是什么？\n\n# 第八部分：面向对象编程\n\n## 第 39 章：面向对象编程简介\n\n### 39.1 什么是面向对象编程？\n\
  \n在[第七部分]中，你读过甚至编写过的所有程序都在使用子程序（方法和 void 方法）。这种编程风格被称为过程化编程，在大多数情况下它是完全没问题的！但当编写大型程序，或者在像微软、Facebook\
  \ 或 Google 这样的大公司工作时，面向对象编程是必须使用的编程风格！\n\n面向对象编程通常称为 `OOP`，是一种关注对象的编程风格。在 `OOP`\
  \ 中，数据和功能被结合在一起并封装在一个名为“对象”的实体内部。应用面向对象编程原则可以让你更轻松地维护代码，并编写出他人易于理解和使用的代码。\n\n“OOP\
  \ 关注对象”这句话真正意味着什么？让我们考虑一个现实世界的例子。想象一辆汽车。你会如何描述一辆特定的车？它有特定的属性，例如品牌、型号、颜色和车牌号。此外，这辆车还可以执行或执行过某些特定动作。例如，有人可以启动或关闭它、加速或刹车或停车。\n\
  \n在 `OOP` 中，这辆车可以表示为一个具有特定属性（通常称为字段）并可以执行特定动作（称为方法）的对象。\n\n显然，你现在可能在问自己：“起初该如何创建对象呢？”答案很简单！你只需要一个类。类就像一个“橡皮印水印章”！在图\
  \ 39-1 中，有一个印章（这就是类），带有四个空字段和三个动作（方法）。\n\n![Image](img/chapter39-01.png)\n\n图 39-1\
  \ 类像一个“橡皮印水印章”\n\n使用这个印章的人可以盖出很多辆汽车（这些就是对象）。在图 39-2 中，例如，一个小男孩盖出了那两辆车，然后给它们上色，并用特定的属性填充了每辆汽车的字段。\n\
  \n![Image](img/chapter39-02.png)\n\n图 39-2 你可以使用同一个橡皮印章作为模板来盖出很多辆汽车\n\n创建新对象（类的的新实例）的过程被称为“实例化”。\n\
  \n类是一个模板，每个对象都是从类中创建的。每个类都应该设计为执行一项且仅此一项任务！这就是为什么在大多数情况下，会使用多个一个类来构建整个应用程序！\n\n\
  在 `OOP` 中，橡皮印章就是类。你可以使用同一个类作为模板来创建（实例化）许多对象！\n\n### 39.2 Java 中的类和对象\n\n现在你已经掌握了类和对象背后的理论概念，让我们深入到\
  \ Java 中编写一个真实的类吧！以下代码段创建了 `Car` 类。类中有四个字段和三个方法。\n\n```java\nclass Car {\n    //\
  \ 定义四个字段（属性）\n    public String brand = \"\";\n    public String model = \"\";\n\
  \    public String color = \"\";\n    public String licensePlate = \"\";\n\n   \
  \ // 定义方法 turnOn()\n    public void turnOn() {\n        System.out.println(\"The\
  \ car turns on\");\n    }\n\n    // 定义方法 turnOff()\n    public void turnOff() {\n\
  \        System.out.println(\"The car turns off\");\n    }\n\n    // 定义方法 accelerate()\n\
  \    public void accelerate() {\n        System.out.println(\"The car accelerates\"\
  );\n    }\n}\n```\n\n这里有一个有趣的知识点：类中的字段和方法本质上只是普通的变量和子程序！\n\n`Car` 类只是一个模板。还没有创建任何对象！\n\
  \n字段前面的 `public` 关键字表示该字段可以从类外部访问。\n\n通过类的实例可以访问该类的字段或方法。\n\n类的名称应该遵循大驼峰命名法。\n\n\
  要创建类的实例，需要以下代码行：\n\n```java\nCar car1 = new Car();\nCar car2 = new Car();\n```\n\
  \n对象仅仅是类的实例，这就是为什么很多时候它被被称为“类实例”或“类对象”。\n\n当你创建一个新对象（类的实例）时的过程被称为“实例化”。\n\n当你已经实例化了对象后，可以使用点符号来给字段赋值。这意味着你需要写对象名，然后是你想访问的字段或方法。\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    Car car1\
  \ = new Car();\n    Car car2 = new Car();\n    car1.brand = \"Mazda\";\n    car1.model\
  \ = \"6\";\n    car1.color = \"Gray\";\n    car1.licensePlate = \"AB1234\";\n  \
  \  car2.brand = \"Ford\";\n    car2.model = \"Focus\";\n    car2.color = \"Blue\"\
  ;\n    car2.licensePlate = \"XY9876\";\n    System.out.println(car1.brand); // 输出\
  \ Mazda\n    System.out.println(car2.brand); // 输出 Ford\n}\n```\n\n在前面的例子中，`car1`\
  \ 和 `car2` 是同一个类的两个实例。使用点符号 `car1` 和 `car2` 你一次引用一个实例。如果你对一个实例进行任何更改，都不会影响另一个！\n\
  \n接下来的代码段分别调用对象 `car1` 和 `car2` 的 `turnOff()` 和 `accelerate()` 方法。\n\n```java\n\
  car1.turnOff();\ncar2.accelerate();\n```\n\n类是一个不可执行的模板，而对象是可执行的类实例！\n\n一个类可以用来创建（实例化）任意数量的对象！\n\
  \n### 39.3 构造方法和关键字 `this`\n\n在 Java 中，有一种方法具有特殊的角色，称为构造方法。每当创建类的实例（对象）时，构造方法就会自动执行。你想对对象进行的任何初始化都在此方法内完成。在\
  \ Java 中，构造方法的名称与其所属类的名称相同。\n\n看下面的例子。构造方法 `Person()` 会自动调用两次，一次是在创建对象 `p1` 时，另是在创建对象\
  \ `p2` 时，这意味着消息“An object was created”会被显示两次。\n\n```java\nclass Person {\n    //\
  \ 定义构造方法\n    public Person() {\n```\n\n\n\n\n```java\nSystem.out.println(\"An object\
  \ was created\");\n```\n\npublic class `App` {\n    public static void main(String[]\
  \ args) throws Exception {\n\n        Person p1 = new Person();\n        Person\
  \ p2 = new Person();\n    }\n}\n```\n\n![](img/notice.jpg)注意，构造函数名称前面没有 `void` 关键字。\n\
  \n在 Java 的面向对象编程 (OOP) 中，有一个名为 `this` 的关键字，它是一个指向当前对象的引用变量。请看下面的示例。\n\n![](img/my_exercise_header.png)\
  \ Project_39.3b\n```java\nclass Person {\n    public String name;\n    public int\
  \ age;\n    //定义构造函数\n    public Person() {\n        System.out.println(\"An object\
  \ was created\");\n    }\n    public void sayInfo() {\n        System.out.println(\"\
  I am \" + this.name);\n        System.out.println(\"I am \" + this.age + \" years\
  \ old\");\n    }\n}\n\npublic class App {\n    public static void main(String[]\
  \ args) throws Exception {\n        Person person1 = new Person();\n        //给字段赋值\n\
  \        person1.name = \"John\";\n        person1.age = 14;\n        person1.sayInfo();\
  \   //调用对象 person1 的 sayInfo() 方法\n    }\n}\n```\n\n![](img/notice.jpg)注意，在方法外部（但在类内部）声明字段\
  \ `name` 和 `age` 时，你需要直接写字段名，不使用点符号表示法。然而，当从方法内部访问字段时，应该使用点符号表示法（例如，`this.name`\
  \ 和 `this.age`）。\n\n你现在脑海中可能正在旋转的问题是：“为什么在 `sayInfo()` 方法内部必须用 `this.name` 和 `this.age`\
  \ 来引用这些 `name` 和 `age` 字段呢？真的必要在它们前面使用 `this` 关键字吗？”一个简单的回答是，方法内部始终可能存在两个同名的额外局部变量（`name`\
  \ 和 `age`）。因此，你需要一种方法来区分这些局部变量和对象的字段。如果你感到困惑，请尝试理解以下示例。在 `MyClass` 类中有一个字段 `b`，在类的方法\
  \ `myMethod()` 中也有一个局部变量 `b`。`this` 关键字被用来区分局部变量和字段。\n\n![](img/my_exercise_header.png)\
  \ Project_39.3c\n```java\nclass FooClass {\n    public String b;   //这是一个字段\n  \
  \  public void myMethod() {\n        String b = \" *** \";  //这是一个局部变量\n       \
  \ System.out.println(b + this.b + b);\n    }\n}\n\npublic class App {\n    public\
  \ static void main(String[] args) throws Exception {\n        MyClass x = new FooClass();\
  \    //创建对象 x\n        x.b = \"Hello!\";   //给其字段赋值\n        x.myMethod();     //它显示：***\
  \ Hello! ***\n    }\n}\n```\n\n![](img/notice.jpg)`this` 关键字可以从类的方法内部引用该类的任何成员（字段或方法）。\n\
  \n### 39.4 向构造函数传递初始值\n\n任何方法，甚至是构造方法，都可以在其形式参数列表中包含形式参数。例如，在构造方法中，你可以使用参数在创建对象期间向对象传递一些初始值。接下来的示例创建了四个对象，每个对象代表希腊神话中的一个\
  \ `Titan`([[24]](#footnotes.xhtml_Endnote_24))。\n\n![](img/my_exercise_header.png)\
  \ Project_39.4\n```java\nclass Titan {\n    public String name;\n    public String\
  \ gender;\n    //定义构造函数\n    public Titan(String n, String g) {\n        this.name\
  \ = n;\n        this.gender = g;\n    }\n}\n\npublic class App {\n    public static\
  \ void main(String[] args) throws Exception {\n        Titan titan1 = new Titan(\"\
  Cronus\", \"male\");\n        Titan titan2 = new Titan(\"Oceanus\", \"male\");\n\
  \        Titan titan3 = new Titan(\"Rhea\", \"female\");\n        Titan titan4 =\
  \ new Titan(\"Phoebe\", \"female\");\n    }\n}\n```\n\n在 Java 中，拥有同名的字段和局部变量（甚至是形式参数）是合法的。因此，`Titan`\
  \ 类也可以写成如下形式：\n\n```java\nclass Titan {\n    public String name;\n    public String\
  \ gender;\n    //定义构造函数\n    public Titan(String name, String gender) {\n      \
  \  this.name = name;     //字段和参数可以有相同的名字\n        this.gender = gender;\n    }\n\
  }\n```\n\n变量 `name` 和 `gender` 是用于向构造函数传递值的参数，而 `this.name` 和 `this.gender` 是用于在对象内部存储值的字段。\n\
