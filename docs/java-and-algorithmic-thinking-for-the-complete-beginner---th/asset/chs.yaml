  \n## 11.1 引言\n\n就像每种高级编程语言一样，Java 提供了许多随取随用的子程序（称为 `methods`，方法），你可以在任何时候、任何地方使用它们。\n\
  \n![](img/notice.jpg)“子程序”简单来说封装成单个单元的语句组。每个子程序都有一个描述性名称并执行特定任务。\n\n为了更好地理解 Java\
  \ 的 `methods`，让我们来看看计算正数平方根的海伦迭代公式。\n\n![Image](img/chapter11-01.png)\n\n其中\n- `y`\
  \ 是你想要求其平方根的数字\n- `x[n]` 是 `y` 的平方根的第 n 次迭代值\n\n你现在可能感到有些沮丧。你可能认为应该写一个程序来通过海伦公式计算数字的平方根，但事实并非如此！目前，没有人用这种方法计算数字的平方根。幸运的是，Java\
  \ 包含了为此的方法！`Math.sqrt` 可以给你正确的结果。虽然 Java 支持许多 `methods`，本章仅涵盖\n\n## 11.2 有用的数学方法（子程序）及\n\
  \n### 绝对值\n`Math.abs(number)`\n该方法返回 `number` 的绝对值。\n\n示例\n```java\npublic static\
  \ void main(String[] args) {\n    int a = -5;\n    System.out.println(Math.abs(a));\
  \ // 输出: 5\n    double b = -5.2;\n    System.out.println(Math.abs(b)); // 输出: 5.2\n\
  }\n```\n\n### 圆周率\n`Math.PI`\n包含 π 值。\n\n![](img/notice.jpg)包含 π 值。注意 `Math.PI`\
  \ 是一个常量，而不是方法。这就是为什么没有使用括号。\n\n示例\n```java\npublic static void main(String[] args)\
  \ {\n    System.out.println(Math.PI); // 输出: 3.141592653589793\n}\n```\n\n### 正弦\n\
  `Math.sin(number)`\n该方法返回 `number` 的正弦。`number` 必须以弧度表示。你可以乘以 `Math.PI / 180` 将角度转换为弧度。\n\
  \n示例\n```java\npublic static void main(String[] args) {\n    double a, b;\n    a\
  \ = Math.sin(3 * Math.PI / 2); // 3π/2 弧度的正弦\n    b = Math.sin(270 * Math.PI / 180);\
  \ // 270 度的正弦\n    System.out.println(a + \" \" + b); // 输出: -1.0 -1.0\n}\n```\n\
  \n### 余弦\n`Math.cos(number)`\n由于该方法返回 `number` 的余弦。`number` 必须以弧度表示。你可以乘以 `Math.PI\
  \ / 180` 将角度转换为弧度。\n\n示例\n```java\npublic static void main(String[] args) {\n  \
  \  double a, b;\n    a = Math.cos(2 * Math.PI); // 2π 弧度的余弦\n    b = Math.cos(360\
  \ * Math.PI / 180); // 360 度的余弦\n    System.out.println(a + \" \" + b); // 输出: 1.0\
  \ 1.0\n}\n```\n\n\n\n\n\n### 正切\n\n`Math.tan(number)`\n\n该方法返回 `number` 的正切值。`number`\
  \ 的值必须以弧度表示。你可以乘以 `Math.PI / 180` 将角度转换为弧度。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double a;\n    a = Math.tan(10 * Math.PI / 180);  //10 度的正切值\n    System.out.println(a);\
  \             //显示为: 0.17632698070846498\n}\n```\n\n### 字符串转整数\n\n`Integer.parseInt(value)`\n\
  \n该方法将整数的字符串表示转换为数值等效值。\n\n### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String s1\
  \ = \"5\";\n    String s2 = \"3\";\n    int k;\n    k = Integer.parseInt(s1);\n\
  \    System.out.println(k);                         //显示为: 5\n    System.out.println(Integer.parseInt(s2));\
  \     //显示为: 3\n    System.out.println(s1 + s2);                   //显示为: 53\n \
  \   System.out.println(Integer.parseInt(s1) + Integer.parseInt(s2)); //显示为: 8\n\
  }\n```\n\n### 字符串转实数\n\n`Double.parseDouble(value)`\n\n该方法将实数的字符串表示转换为其数值等效值。\n\n\
  ### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    String s1 = \"6.5\";\n    String s2\
  \ = \"3.4\";\n    double x;\n    x = Double.parseDouble(s1);\n    System.out.println(x);\
  \                          //显示为: 6.5\n    System.out.println(Double.parseDouble(s2));\
  \     //显示为: 3.4\n    System.out.println(s1 + s2);                   //显示为: 6.53.4\n\
  \    System.out.println(Double.parseDouble(s1) + Double.parseDouble(s2)); //显示为:\
  \ 9.9\n}\n```\n\n### 整数值（类型转换）\n\n`(int)number`\n\n这返回 `number` 的整数部分。如果 `number`\
  \ 包含小数部分，该部分在转换过程中会丢失。\n\n### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double a\
  \ = 5.4;\n    System.out.println((int)a);          //显示为: 5\n    System.out.println((int)34);\
  \         //显示为: 34\n    System.out.println((int)34.9);       //显示为: 34\n    System.out.println((int)-34.999);\
  \    //显示为: -34\n}\n```\n\n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意\
  \ `(int)` 不是一个方法。它只是 Java 中将实数转换为整数的方法。同样注意，如果实数包含小数部分，该部分在转换过程中会丢失。\n\n### 实值（类型转换）\n\
  \n`(double)number`\n\n这以实数形式返回该数字。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a = 5;\n    System.out.println((double)a);      //显示为: 5.0\n    System.out.println((double)34);\
  \     //显示为: 34.0\n    System.out.println((double)-34);    //显示为: -34.0\n    System.out.println(a\
  \ / 2);           //显示为: 2\n    System.out.println((double)a / 2);         //显示为:\
  \ 2.5\n    System.out.println((double)a / 2);         //显示为: 2.5\n    System.out.println(a\
  \ / (double)2);         //显示为: 2.5\n    System.out.println((double)a / (double)2);\
  \ //显示为: 2.5\n    System.out.println(a / 2.0);               //显示为: 2.5\n}\n```\n\
  \n![](img/notice.jpg)在计算机科学中，类型转换是将一种数据类型的变量转换为另一种类型的方法。注意 `(double)` 不是一个方法。它只是\
  \ Java 中将整数转换为实数（浮点）的方法。\n\n![](img/notice.jpg)在 Java 中，两个整数相除的结果总是整数。因此，在表达式 `a\
  \ / 2` 中，`a` 和 `2` 都是整数，结果也是整数。如果你希望结果为 `double` 类型，除操作数中至少有一个必须是 `double` 类型。\n\
  \n# \n\n`Math.pow(number, exp)`\n\n该方法返回 `number` 的 `exp` 次幂的结果。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double a, b, c;\n    a = 2;\n    b = 3;\n    c = Math.pow(a, b);\n    System.out.println(c);\
  \ //显示为: 8.0\n}\n```\n\n### 随机\n\n`Math.random()`\n\n该方法返回一个 `0.0` 到 `1.0` 之间的随机\
  \ `double` 值（包含 0.0 但不包含 1.0）。如果要特定范围内的整数，可以使用 `(int)(Math.random() * (max - min)\
  \ + min)`。\n\n### 示例\n\n![](img/my_exercise_header.png) Project_11.2\n```java\n\
  public static void main(String[] args) throws Exception {\n    double a;\n    a\
  \ = Math.random();\n    System.out.println(a); //显示 0.0 到 1.0 之间的随机数\n}\n```\n\n\
  ### 四舍五入\n\n`Math.round(number)`\n\n该方法返回 `number` 最近的整数。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double a = 5.5;\n    System.out.println(Math.round(a)); //显示为: 6\n    double\
  \ b = 5.4;\n    System.out.println(Math.round(b)); //显示为: 5\n    double c = -5.5;\n\
  \    System.out.println(Math.round(c)); //显示为: -5\n}\n```\n\n### 平方\n\n`Math.sqrt(number)`\n\
  \n该方法返回 `number` 的平方根，其中 `number` 可以是正值或零。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ Project_11.2\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double x, y;\n    System.out.println(Math.sqrt(9)); //显示为: 3.0\n    System.out.println(Math.sqrt(2));\
  \ //显示为: 1.4142135623730951\n    x = Math.sqrt(8);\n    System.out.println(x); //显示为:\
  \ 2.8284271247461903\n    y = Math.round(Math.sqrt(8));\n    System.out.println(y);\
  \ //显示为: 3\n}\n```\n\n\n\n\n\n![](img/my_exercise_header.png) Project_11.2-1\n\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double d,\
  \ x1, x2, xTemp, y1, y2, yTemp;\n    System.out.println(\"Enter coordinates for\
  \ point A:\");\n    x1 = Double.parseDouble(cin.nextLine());\n    y1 = Double.parseDouble(cin.nextLine());\n\
  \    System.out.println(\"Enter coordinates for point B:\");\n    x2 = Double.parseDouble(cin.nextLine());\n\
  \    y2 = Double.parseDouble(cin.nextLine());\n    xTemp = Math.pow(x1 - x2, 2);\n\
  \    yTemp = Math.pow(y1 - y2, 2);\n    d = Math.sqrt(xTemp + yTemp);\n    System.out.println(\"\
  Distance between points: \" + d);\n}\n```\n\n现在，让我们来看另一种方法。实际上，可以在方法调用中执行所有操作。这样做，操作的结果将作为方法的参数使用。这是大多数程序员倾向于遵循的编写风格，因为可以节省大量的变量和代码行。这里的\
  \ Java 程序所示。\n\n![](img/my_exercise_header.png) Project_11.2-1b\n\n```java\npublic\
