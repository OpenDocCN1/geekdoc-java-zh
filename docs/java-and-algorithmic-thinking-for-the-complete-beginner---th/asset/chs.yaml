- "# Java 与算法思维：初学者指南 - 第三版\n\n\n\n![](img/Covers.jpg)\n\n为了获得最佳阅读体验，请将设备旋转至横向模式。\n\
  \n| 3 | a = b | 将变量 b 的值赋值给变量 a。值 5 丢失了！ | 7 | 7 |\n| 4 | b = a | 将变量 a 的值赋值给变量\
  \ b | 7 | 7 |\n| 5 | .println(a) | 显示：7 | | |\n| 6 | .println(b) | 显示：7 | | |\n\n\
  哎呀！值 5 在哪里？\n\n解决方案终究并不那么明显！那么，到底如何交换值呢？\n\n考虑两个杯子：一杯橙子汁（称为 A 杯）和一杯柠檬汁（称为 B 杯）。如果你想交换它们的内容，你只需要找到并使用一个额外的空杯子（称为\
  \ C 杯）。\n\n![Image](img/chapter08-01.png)\n\n必须遵循的步骤是：\n\n1)将 A 杯的内容（橙子汁）倒到 C 杯中。\n\
  \n![Image](img/chapter08-02.png)\n2)将 B 杯的内容（柠檬汁）倒到 A 杯中。\n\n![Image](img/chapter08-03.png)\n\
  3)将 C 杯的内容（橙子汁）倒到 B 杯中。\n\n![Image](img/chapter08-04.png)\n\n交换成功！\n\n你可以按照相同的步骤在\
  \ Java 中交换两个变量的内容。\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {int a, b, c;a = Integer.parseInt(cin.nextLine());b = Integer.parseInt(cin.nextLine());c\
  \ = a;   //将 A 杯的内容（橙子汁）倒到 C 杯中 a = b;   //将 B 杯的内容（柠檬汁）倒到 A 杯中 b = c;   //将 C 杯的内容（橙子汁）倒到\
  \ B 杯 System.out.println(a);System.out.println(b);}\n```\n\n![](img/remember.jpg)双斜杠\
  \ ( // ) 之后的文本被视为注释，永远不会执行。\n\n## 练习题 8.1-4 交换变量的值 – 另一种方法\n\n\n\n\n\n编写一个 Java\
  \ 程序，让用户输入两个整数值并存储在变量 `a` 和 `b` 中。最后，这两个变量必须交换它们的值。然后，使用输入值为 `5` 和 `7` 的追踪表（trace\
  \ table）来确认代码的正确性。\n\n##### 解决方案\n\n由于变量包含数值，你可以使用以下 Java 程序（另一种方法）。\n\n```java\n\
  public static void main(String[] args) throws Exception {int a, b;a = Integer.parseInt(cin.nextLine());b\
  \ = Integer.parseInt(cin.nextLine());a = a + b;b = a - b;a = a - b;System.out.println(a\
  \ + \" \" + b);}\n```\n\n现在，让我们使用输入值为 `5` 和 `7` 的追踪表来确认变量 `a` 和 `b` 是否正确地交换了内容。\n\
  \n| 步骤 | 语句 | 注释 | a | b |\n| --- | --- | --- | --- | --- |\n| 1 | `a = Integer.parseI…`\
  \ | 用户输入值 5 | 5 | ? |\n| 2 | `b = Integer.parseI…` | 用户输入值 7 | 5 | 7 |\n| 3 | `a\
  \ = a + b` | | 12 | 7 |\n| 4 | `b = a ‑ b` | | 12 | 5 |\n| 5 | `a = a ‑ b` | | 7\
  \ | 5 |\n| 6 | `.println(a + \" \" + b)` | 显示为：7 5 | | |\n\n![](img/notice.jpg)这种方法的缺点是它不能交换字母数字型变量（字符串）的内容。\n\
  \n## 8.2 复习思考题：判断对错\n\n对以下每个陈述判断对或错。\n\n1) 追踪表是一种测试计算机的技巧。\n2) 追踪表帮助程序员在计算机程序中找到错误。\n\
  3) 在没有先创建对应的追踪表的情况下，你无法执行计算机程序。\n4) 为了交换两个整数变量的值，你总是需要一个额外的变量。\n\n## 8.3 复习练习\n\n\
  完成以下练习。\n\n1) 创建一个追踪表，确定当输入值为 `3` 时，Java 程序中每一步中变量的值。\n```java\npublic static void\
  \ main(String[] args) throws Exception {double a, b, c, d;a = Double.parseDouble(cin.nextLine());b\
  \ = a + 10;a = b * (a - 3);c = 3 * b / 6;d = c * c;d--;System.out.println(d);}\n\
  ```\n\n2) 创建一个追踪表，确定在三次不同执行情况下，Java 程序中每一步中变量的值。\n\n三次执行的输入值为：(i) `3`，(ii) `4` 和\
  \ (iii) `1`。\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {int a, b, c, d;a = Integer.parseInt(cin.nextLine());a = (a + 1) * (a + 1) + 6\
  \ / 3 * 2 + 20;b = a % 13;c = b % 7;d = a * b * c;System.out.println(a + \", \"\
  \ + b + \", \" + c + \", \" + d);}\n```\n\n3) 创建一个追踪表，确定在两种不同执行情况下，Java 程序中每一步中变量的值。\n\
  \n两次执行的输入值为：(i) `8, 4`；(ii) `4, 4`。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {int a, b, c, d, e;a = Integer.parseInt(cin.nextLine());b\
  \ = Integer.parseInt(cin.nextLine());c = a + b;d = 1 + a / b * c + 2;e = c + d;c\
  \ += d + e;e--;d -= c + d % c;System.out.println(c + \", \" + d + \", \" + e);}\n\
  ```\n\n## 第 9 章：使用 Visual Studio Code\n\n### 9.1 编写、执行和调试 Java 程序\n\n到目前，你已经学习了\
