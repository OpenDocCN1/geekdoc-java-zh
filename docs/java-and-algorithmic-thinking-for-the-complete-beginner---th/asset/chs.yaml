  \n### 37.1 两个子程序可以使用相同的变量名吗？\n\n每个子程序都使用自己的内存空间来存储变量的值。即使主代码也有自己的内存空间！这意味着你可以在主代码中有一个名为\
  \ `test` 的变量，在一个子程序中有另一个名为 `test` 的变量，在另一个子程序中有第三个名为 `test` 的变量。注意！这三个变量是完全不同的变量，位于不同的内存位置，并且可以持有完全不同的值。\n\
  \n如接下来的程序所示，在三个不同的内存位置上有三个名为 `test` 的变量，每个变量都有一个完全不同的值。下方的跟踪表可以帮助你理解发生了什么。\n\n![](img/my_exercise_header.png)\n\
  \nProject_37.1\n```javastatic void f1() {\n    String test;\n    test = \"Testing!\"\
  ;\n    System.out.println(test);\n}\nstatic void f2(int test) {\n    System.out.println(test);\n\
  }\n//主代码开始此处\npublic static void main(String[] args) throws Exception {\n    int\
  \ test;\n    test = 5;\n    System.out.println(test);\n    f1();\n    f2(10);\n\
  \    System.out.println(test);\n}\n```\n\n跟踪表所示。\n\n| 步骤 | 语句 | 备注 | 主代码 | void\
  \ 方法 f1() | void 方法 f2() |\n| --- | --- | --- | --- | --- | --- |\n| test | test\
  \ | test | | | |\n| 1 | test = 5 | | 5 | | |\n| 2 | .println(test) | 显示: 5 | 5 |\
  \ | |\n| 3 | f1() | 调用了 f1() | | ? | |\n| 4 | test = \"Testing!\" | | | Testing!\
  \ | |\n| 5 | .println(test) | | | Testing! | |\n| 6 | f2(10) | 调用了 f2() | | | 10\
  \ |\n| 7 | .println(test) | 显示: 10 | | | 10 |\n| 8 | .println(test) | 显示: 5 | 5\
  \ | | |\n\n注意，子程序中使用的变量在子程序执行期间一直“存在”。这意味着在调用子程序之前，它的任何变量（包括参数列表中的变量）都不存在于主内存中。当子程序结束且执行流返回调用者时，所有这些变量都会从主内存中移除。只有“永久存在”（或至少在\
  \ Java 程序执行期间）的变量是全局变量。\n\n你可能认为只有主代码可以调用子程序。然而，事实并非如此！子程序可以调用任何子程序，而该子程序可以调用另一个子程序，以此类推。你可以进行任何需要的组合。例如，你可以写一个调用\
  \ void 方法的方法，一个调用方法的 void 方法，甚至一个调用 Java 内置方法的方法。\n\n### 37.2 子程序可以调用另一个子程序吗？\n\n\
  到为止，你可能认为只有主代码可以调用子程序。然而，事实并非如此！子程序可以调用任何其他子程序，而该子程序可以调用另一个子程序，以此类推。你可以进行任何需要的组合。例如，接下来的示例正展示了这种情况。主代码调用\
  \ void 方法 `displaySum()`，该方法又调用方法 `add()`。\n\n![](img/my_exercise_header.png)\n\n\
  Project_37.2\n```javastatic int add(int number1, int number2) {\n    int result;\n\
  \    result = number1 + number2;\n    return result;\n}\nstatic void displaySum(int\
  \ num1, int num2) {\n    System.out.println(add(num1, num2));\n}\npublic static\
  \ void main(String[] args) throws Exception {\n    int a, b;\n    a = Integer.parseInt(cin.nextLine());\n\
  \    b = Integer.parseInt(cin.nextLine());\n    displaySum(a, b);\n}\n```\n\n当执行流到达\
  \ `add()` 方法的返回语句时，它返回调用者，即 void 方法 `displaySum()`。然后，当执行流到达 void 方法 `displaySum()`\
  \ 的结束时，它返回调用者，即主代码。\n\n注意这两个子程序的编写顺序没有限制。如果将 void 方法 `displaySum()` 写在方法 `add()`\
  \ 之前，也是完全相同的。\n\n### 37.3 值传递与引用传递\n\n在 Java 中，变量是按值传递给子程序的。这意味着如果从子程序内部更改了参数的值，它在外部并不会改变。看下面的示例。\n\
  \n![](img/my_exercise_header.png)\n\nProject_37.3\n```javaast void f1(int b) {\n\
  \    b++; // 这是 void 方法 f1() 的变量\n    System.out.println(b); // 显示: 11\n}\npublic\
  \ static void main(String[] args) throws Exception {\n    int a = 10; // 这是主代码的变量\n\
  \    f1(a);\n    System.out.println(a); // 显示: 10\n}\n```\n\n\n\n\n变量 `a` 的值 `10`\
  \ 通过参数 `b` 传递给 `void method f1()`。然而，尽管变量 `b` 的内容在 `void method` 内部被修改，但当执行流返回主代码时，该更改不会影响变量\
  \ `a` 的值。\n\n在上一个示例中，主代码和 `void method` 使用了两个名称不同的变量。然而，如果主代码和 `void method` 都使用了两个名称相同的变量，结果也将是相同的。下一个示例的操作方式完全相同，显示的结果与上一个示例完全一致。\n\
  \n![](img/my_exercise_header.png) Project_37.3b\n```java\nstatic void f1(int a)\
  \ {\n    a++; // 这是 void method f1() 的一个变量\n    System.out.println(a); // 显示为: 11\n\
  }\n\npublic static void main(String[] args) throws Exception {\n    int a;\n   \
  \ a = 10; // 这是主代码的一个变量\n    f1(a);\n    System.out.println(a); // 显示为: 10\n}\n\
  ```\n\n将数组作为参数传递给子程序与传递简单变量一样简单。下一个示例将数组 `a` 传递给 `void method display()`，后者显示了该数组。\n\
  \n![](img/my_exercise_header.png) Project_37.3c\n```java\nstatic final int ELEMENTS\
  \ = 10;\nstatic void display(int b[]) {\n    int i;\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        System.out.print(b[i] + \"\\t\");\n    }\n}\n\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    int[] a = new int[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Integer.parseInt(cin.nextLine());\n\
  \    }\n    display(a);\n}\n```\n\n与变量不同，Java 中的数据结构默认是按引用传递的。这意味着如果你将一个数组传递给子程序，并且该子程序更改了数组的一个或多个元素的值，那么这些更改也会反映在子程序外部。请看以下示例。\n\
  \n![](img/my_exercise_header.png) Project_37.3d\n```java\nstatic void f1(int[] x)\
  \ {\n    x[0]++;\n    System.out.println(x[0]); // 显示为: 6\n}\n\npublic static void\
  \ main(String[] args) throws Exception {\n    int[] y = {5, 10, 15, 20};\n    System.out.println(y[0]);\
  \ // 显示为: 5\n    f1(y);\n    System.out.println(y[0]); // 显示为: 6\n}\n```\n\n![](img/notice.jpg)\
  \ 将数组传递给子程序传递的是数组的引用，而不是数组的拷贝，这意味着 `y` 和 `x` 实际上是同一个数组的别名。主内存（RAM）中只存在一份数组拷贝。如果子程序更改了元素的值，该更改也会反映在主程序中。\n\
  \n所以，正如你可能意识到的，按引用传递数组可以为子程序提供一种“返回”多个值的间接方法。在下一个示例中，方法 `myDivmod()` 将变量 `a` 除以变量\
  \ `b`，并找到它们的整数商和整数余数。如果一切顺利，它返回 `true`；否则，返回 `false`。此外，通过结果数组，该方法还间接返回了计算出的商和计算出的余数。\n\
  \n![](img/my_exercise_header.png) Project_37.3e\n```java\nstatic boolean divMod(int\
  \ a, int b, int[] results) {\n    boolean returnValue = true;\n    if (b == 0) {\n\
  \        returnValue = false;\n    } else {\n        results[0] = (int)(a / b);\n\
  \        results[1] = a % b;\n    }\n    return returnValue;\n}\n\npublic static\
  \ void main(String[] args) throws Exception {\n    int val1, val2;\n    boolean\
  \ ret;\n    int[] res = new int[2];\n    val1 = Integer.parseInt(cin.nextLine());\n\
  \    val2 = Integer.parseInt(cin.nextLine());\n    ret = divMod(val1, val2, res);\n\
  \    if (ret) {\n        System.out.println(res[0] + \", \" + res[1]);\n    } else\
  \ {\n        System.out.println(\"Sorry, wrong values entered!\");\n    }\n}\n```\n\
  \n![](img/notice.jpg) 关于形式参数列表中的参数，一个很好的策略是将所有按值传递的参数写在所有按引用传递的参数之前。\n\n### 37.4\
  \ 返回数组\n\n在下一个示例中，Java 程序必须找到数组 `t` 中的三个最低值。为了实现这一点，程序调用并通过其形式参数 `x` 将数组传递给 `void\
  \ method getArray()`，该方法反过来使用插入排序算法对数组 `x` 进行排序。当执行流返回主代码时，数组 `t` 也被排序了。发生这种情况是因为正如前面提到的，Java\
  \ 中的数组是按引用传递的。因此，主代码最终做的仅仅是显示数组前三个元素的值。\n\n![](img/my_exercise_header.png) Project_37.4a\n\
  ```java\nstatic final int ELEMENTS = 10;\nstatic void getArray(int[] x) {\n    //\
  \ ... 更多...\n}\n```\n（等等，37.4a 的源码非常混乱/碎片化。我将根据后半部分的片段来重构它。）\n\n**基于后期片段重构 37.4a\
  \ 的逻辑：**\n文本描述如果你想显示三个最低值，如果进行排序，名称与温度之间的一一对应关系将会丢失。以下是解决方案：\n\n```java\nstatic\
  \ final int ELEMENTS = 10;\nstatic int[] getArray(int[] x) {\n    int m, n, element;\n\
  \    int[] auxX = new int[ELEMENTS];\n    for (m = 0; m <= ELEMENTS - 1; m++) {\n\
  \        auxX[m] = x[m];\n    }\n    for (m = 1; m <= ELEMENTS - 1; m++) {\n   \
  \     element = auxX[m];\n        n = m;\n        while (n > 0 && auxX[n - 1] >\
  \ element) {\n            auxX[n] = auxX[n - 1];\n            n--;\n        }\n\
  \        auxX[n] = element;\n    }\n    int[] retArray = {auxX[0], auxX[1], auxX[2]};\n\
  \    return retArray;\n}\n\npublic static void main(String[] args) throws Exception\
  \ {\n    int i;\n    int[] t = {75, 73, 78, 70, 71, 74, 72, 69, 79, 77};\n    int[]\
  \ low = getArray(t);\n    System.out.println(\"三个最低值是:\");\n    System.out.println(low[0]\
  \ + \"  \" + low[1] + \"  \" + low[2]);\n}\n```\n\n### 37.5 方法重载\n\n方法重载允许你拥有相同名称的多个方法，只要它们的形式参数列表不同。这意味着只要满足以下条件，你就可以执行重载：\n\
  \n- 每个形式参数列表中的参数数量不同；\n- 每个形式参数列表中的参数数据类型不同；\n- 每个形式参数列表中的参数数据类型顺序不同。\n\n为了更好地理解所有这些概念，让我们尝试为每个情况使用一个示例进行分析。\n\
  \n#### 每个形式参数列表中的参数数量不同\n\n\n\n\n在接下来的示例中，有两个方法 `display()`，但它们的形式参数数量不同。第一个方法通过其形式参数列表接受一个一个字符串，而第二个方法接受两个字符串。\n\
  \n![](img/my_exercise_header.png) Project_37.5\n```java\nstatic void display(String\
  \ firstName) {\n    System.out.println(\"First name: \" + firstName);\n    System.out.println(\"\
  -----------------------------\");\n}\nstatic void display(String firstName, String\
  \ lastName) {\n    System.out.println(\"First name: \" + firstName);\n    System.out.println(\"\
  Last name: \" + lastName);\n    System.out.println(\"-----------------------------\"\
  );\n}\npublic static void main(String[] args) throws Exception {\n    display(\"\
  George\", \"Washington\");  //这调用了第二个方法\n    display(\"George\");  //这调用了第一个方法\n\
  }\n```\n\n输出结果所示。\n\n![Image](img/chapter37-02.png)\n\n### 在每个形式参数列表中参数的不同数据类型\n\
  \n在接下来的示例中，有两个方法 `myAbs()`，但它们的形式参数类型不同。第一个方法接受一个整数，而第二个方法通过其形式参数列表接受一个实数（double）。\n\
  \n![](img/my_exercise_header.png) Project_37.5b\n```java\nstatic int myAbs(int a)\
  \ {\n    if (a < 0) {\n        a *= -1;\n    }\n    System.out.print(\"An integer\
  \ passed: \");\n    return a;\n}\nstatic double myAbs(double a) {\n    if (a < 0)\
  \ {\n        a *= -1;\n    }\n    System.out.print(\"A real passed: \");\n    return\
  \ a;\n}\npublic static void main(String[] args) throws Exception {\n    System.out.println(myAbs(-5));\
  \    //这调用了第一个方法\n    System.out.println(myAbs(-5.5));  //这调用了第二个方法\n    System.out.println(myAbs(-5.0));\
  \  //这调用了第二个方法\n}\n```\n\n输出结果如下。\n\n![Image](img/chapter37-03.png)\n\n### 在每个形式参数列表中参数数据类型的不同顺序\n\
  \n最后但同样重要的是，在接下来的示例中，有两个方法 `displayDate()`，但每个形式参数列表中参数数据类型的顺序是不同的。第一个方法按照 字符串‒整数‒整数的顺序接受三个参数，而第二个方法按照\
  \ 整数‒字符串‒整数的顺序接受三个参数。\n\n![](img/my_exercise_header.png) Project_37.5c\n```java\n\
  static void displayDate(String month, int day, int year) {\n    System.out.println(month\
  \ + \" \" + day + \", \" + year);\n}\nstatic void displayDate(int day, String month,\
  \ int year) {\n    System.out.println(day + \" \" + month + \" \" + year);\n}\n\
  public static void main(String[] args) throws Exception {\n    displayDate(4, \"\
  July\", 1776);  //这调用了第二个方法\n    displayDate(\"July\", 4, 1776);  //这调用了第一个方法\n\
  }\n```\n\n输出结果所示。\n\n.![Image](img/chapter37-04.png)\n\n### 37.6 变量的作用域\n\n变量的作用是指该变量的影响范围。在\
  \ Java 中，变量可以具有局部作用域或全局作用域。在子程序内部声明的变量具有局部作用域，只能从该子程序内部访问。相反，在子程序外部声明的变量具有全局作用域，可以从任何子程序内部以及主代码访问。\n\
  \n让我们来看一些例子。接下来的示例声明了一个全局变量 `test`。但是，这个全局变量的值在 `void` 方法内部被访问并显示。\n\n![](img/my_exercise_header.png)\
  \ Project_37.6a\n```java\nstatic int test;   //将 test 声明为全局\nstatic void displayValue()\
  \ {\n    System.out.println(test);  //它显示: 10\n}\npublic static void main(String[]\
  \ args) throws Exception {\n    test = 10;   //这是一个全局变量\n    displayValue();\n \
  \   System.out.println(test);  //它显示: 10\n}\n```\n\n![](img/notice.jpg) 要声明全局变量，必须在前面加上\
  \ Java 关键字 `static`。\n\n![](img/notice.jpg) 全局变量必须在主方法外部声明。大多数程序员倾向于将它们都放在顶部，以便更好地观察。\n\
  \n但是要小心！如果全局变量的值在子程序内部被修改，此更改也会反映在子程序外部。在接下来的示例中，`void` 方法 `displayValue()` 将全局变量\
  \ `test` 的值增加到 11，当执行流返回主代码时，会显示值为 11。\n\n![](img/my_exercise_header.png) Project_37.6b\n\
  ```java\nstatic int test;   //将 test 声明为全局\nstatic void displayValue() {\n    test++;\n\
  \    System.out.println(test);        //它显示: 11\n}\npublic static void main(String[]\
  \ args) throws Exception {\n    test = 10;\n    System.out.println(test);      \
  \  //它显示: 10\n    displayValue();\n    System.out.println(test);        //它显示: 11\n\
  }\n```\n\n接下来的程序声明了一个全局变量 `test`，`void` 方法 `displayA()` 内部有一个局部变量 `test`，而 `void`\
  \ 方法 `displayB()` 内部也有另一个局部变量 `test`。此外，`displayC()` 访问并修改了全局变量 `test` 的值。这是因为 `test`\
  \ 是局部作用域的！\n\n![](img/my_exercise_header.png) Project_37.6c\n```java\nstatic int\
  \ test;   //将 test 声明为全局\nstatic void displayA() {\n    int test;  //局部变量\n    test\
  \ = 7;\n    System.out.println(test);  //它显示: 7\n}\nstatic void displayB() {\n \
  \   int test;  //局部变量\n    test = 9;\n    System.out.println(test);  //它显示: 9\n\
  }\nstatic void displayC() {//使用全局变量的值\n    System.out.println(test);  //它显示: 10\n\
  \    test++;\n}\npublic static void main(String[] args) throws Exception {\n   \
  \ test = 10;   //这是一个全局变量\n    System.out.println(test);  //它显示: 10\n    displayA();\n\
  \    System.out.println(test);  //它显示: 10\n    displayB();\n    System.out.println(test);\
  \  //它显示: 10\n    displayC();\n    System.out.println(test);  //它显示: 11\n}\n```\n\
  \n![](img/notice.jpg) 你可以在子程序中拥有同名的局部作用域变量，因为它们只在声明它们的子程序中被识别。\n\n### 37.7 代码转换为子程序\n\
  \n不划分子程序编写大型程序会导致代码难以理解或维护。假设你有一个大型程序并希望将其拆分为子程序。接下来的程序解释了必须遵循的步骤。用虚线矩形标记出的部分必须转换为子程序。\n\
  \n![](img/my_exercise_header.png) Project_37.7a\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int totalYes, femaleNo, i;\n    String temp1, gender,\
  \ temp2, answer;\n    totalYes = 0;\n    femaleNo = 0;\n    for (i = 1; i <= 100;\
  \ i++) {\n        do {\n            System.out.print(\"输入公民 \" + i + \" 的性别: \"\
  );\n            temp1 = cin.nextLine();\n            gender = temp1.toLowerCase();\n\
  \        } while (!gender.equals(\"male\") && !gender.equals(\"female\") && !gender.equals(\"\
  other\"));\n        do {\n            System.out.print(\"你下午在跑步吗？ \");\n       \
  \     temp2 = cin.nextLine();\n            answer = temp2.toLowerCase();\n     \
  \   } while (!answer.equals(\"yes\") && !answer.equals(\"no\") && !answer.equals(\"\
  sometimes\"));\n\n        if (answer.equals(\"yes\")) {\n            totalYes++;\n\
  \        }\n        if (gender.equals(\"female\") && answer.equals(\"no\")) {\n\
  \            femaleNo++;\n        }\n    }\n    System.out.println(\"正面回答数: \" +\
  \ totalYes);\n    System.out.println(\"女性否定回答数: \" + femaleNo);\n}\n```\n\n要将此程序的部分转换为子程序，你必须：\n\
  \n- 对于每个虚线矩形，决定是使用方法还是 `void` 方法。这取决于子程序是否返回结果。\n- 确定每个虚线矩形中存在的变量以及它们在该矩形中的作用。\n\
  \n接下来的流程图可以帮助你决定如何处理每个变量，哪些变量必须传递给子程序和/或从子程序返回，或者哪些只需要是子程序内部的局部变量。\n\n\n\n\n\n所以，在这个流程图的帮助下，让我们逐一处理每个虚线矩形！未标记虚线矩形的部分将组成主代码。\n\
  \n## 第一部分\n\n在第一个虚线矩形中，三个变量：`i`、`temp1` 和 `gender`。然而，并不是它们都必须包含在替换虚线矩形的子程序的正式参数列表中。让我们来看看为什么！\n\
  \n- **变量 `i`**：在虚线矩形外部初始化/更新；因此，它必须传递给子程序；在虚线矩形内部没有更新；因此，它不应该返回给调用者。\n- **变量 `temp1`**：不在虚线矩形外部初始化/更新；因此，它不应该传递给子程序；在虚线矩形内部初始化但其值在外部没有使用；因此，它不应该返回给调用者。根据流程图，由于变量\
