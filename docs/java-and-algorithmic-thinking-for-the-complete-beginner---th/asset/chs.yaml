  \ Java 程序，确定人口超过 100000 需要多少年。\n\n\n\n\n尽管在 Java 中 `for` 语句可以用许多不同的方式编写，但本书仅涉及了它的基本形式。因此，当使用\
  \ `for` 语句来定义循环时，其更便于阅读的通用形式如下。\n\n```java\nfor (counter = initial_value; counter\
  \ OP1 final_value; counter = counter OP2 offset) {A statement or block of statements}\n\
  ```\n\n对应的流程图所示。\n\n![Image](img/chapter26-01.png)\n\n其中\n\n► `initial_value`、`final_value`\
  \ 和 `offset` 可以是常量值、变量或表达式。也允许使用负值。►►运算符 `OP1` 在 `counter` 增加时应为 `<=`，在 `counter`\
  \ 递减时为 `>=`。\n► 运算符 `OP2` 在 `counter` 增加时应为 `+`，在 `counter` 递减时为 `–`。\n\n![](img/notice.jpg)\
  \ `for` 循环实际上是一个预测试循环结构。\n\n下面的示例显示了数字 1, 2, 3, 4 和 5。变量 `counter`（此处为 `i`）从 1 增加到\
  \ 6，允许循环执行 5 次迭代。\n\n![](img/my_exercise_header.png) Project_26.1a\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    int i;\n    for (i = 1;\
  \ i <= 5; i = i + 1) {\n        System.out.println(i);\n    }\n}\n```\n\n![](img/notice.jpg)当\
  \ `for` 循环执行最后一次迭代时，它显示变量 `i` 的内容（即 5），然后变量 `i` 增加 1（变为 6），执行流退出循环。\n\n你刚刚看到的程序流程图如下所示。当执行流到达\
  \ `for` 循环时，初始值 1 被赋值给变量 `i`，布尔表达式 `i ≤ 5` 结果为真，执行语句 `Write i` 并在屏幕上显示值 1。变量 `i`\
  \ 增加 1，执行流回到菱形符号上方的点。布尔表达式再次评估为真，显示值 2，过程重复。在第 5 次迭代中，显示值 5，变量 `i` 的值变为 6，布尔表达式评估为假，执行流退出循环。\n\
  \n![Image](img/chapter26-02.png)\n\n当变量 `counter` 增加（或递减） 1 时，使用复合赋值运算符甚至递增（或递减）运算符更方便。下一个示例使用递增运算符\
  \ `++` 显示从 1 到 10 的数字。\n\n![](img/my_exercise_header.png) Project_26.1b\n```java\n\
  public static void main(String[] args) throws Exception {\n    int i;\n    for (i\
  \ = 1; i <= 10; i++) {\n        System.out.println(i);\n    }\n}\n```\n\n下一个示例使用复合赋值运算符\
  \ `-=` 显示从 10 到 2 的偶数。\n\n![](img/my_exercise_header.png) Project_26.1c\n```java\n\
  public static void main(String[] args) throws Exception {\n    int i;\n    for (i\
  \ = 10; i >= 2; i -= 2) {\n        System.out.println(i);\n    }\n}\n```\n\n![](img/notice.jpg)注意，当\
  \ `counter`（此处为 `i`）递减时，比较运算符应为 `>=`，当 `counter` 增加时为 `<=`。\n\n虽然不推荐，但由于 `for` 循环实际上是一个预测试循环结构，你可以用\
  \ `while` 语句替换 `for` 语句。上一个示例可以使用 `while` 语句写如下：\n\n![](img/my_exercise_header.png)\
  \ Project_26.1d\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int i;\n    i = 10;\n    while (i >= 2) {\n        System.out.println(i);\n\
  \        i -= 2;\n    }\n}\n```\n\n下一个示例使用变量代替常量值 `initial_value`、`final_value`\
  \ 和 `offset` 显示从 −2 到 −10 的偶数。\n\n![](img/my_exercise_header.png) Project_26.1e\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    int x1 = -2;\n    int x2 = -10;\n    int t = -2;\n    for (i = x1; i >= x2;\
  \ i += t) {\n        System.out.println(i);\n    }\n}\n```\n\n![](img/notice.jpg)千万不要在循环内部修改\
  \ `counter`（此处为 `i`）的值！同样适用于 `initial_value`（此处为 `x1`）、`final_value`（此处为 `x2`）和\
  \ `offset`（此处为 `t`）。这会让你的代码变得不可读并可能导致错误结果。尽管如此，如果你坚持，请使用 `while` 语句。\n\n下一个示例显示字母“H”、“e”、“l”、“l”和“o”（均不带双引号）。\n\
