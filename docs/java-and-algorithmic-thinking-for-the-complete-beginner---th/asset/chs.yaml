  \ 1 note(s) of $10, 1 note(s) of $5, and 1 note(s) of $1”。\n\n\n\n\n\n通常情况下，字符串是指任何你可以使用键盘输入的内容，包括字母、符号符号（如\
  \ `&`、`*` 和 `@`）以及数字。在 Java 中，字符串始终包含在双引号内。\n\n下面是一个使用字符串的 Java 程序。\n\n```\na =\
  \ \"Everything enclosed in double quotes is a string, even the numbers: \";\nb =\
  \ \"3, 54, 731\";\nSystem.out.println(a + b);\nSystem.out.println(\"You can even\
  \ mix letters, symbols and digits like this: \");\nSystem.out.println(\"3 + 4 equals\
  \ 7\");\n```\n\n许多程序经常处理以字符串（文本）形式出现的数据。字符串无处不在——从文字处理器到网络浏览器，再到短信程序。本书中的许多练习实际上都大量使用了字符串。尽管\
  \ Java 支持许多处理字符串的有用方法，但本章仅涵盖了对于本书目的目的必需的方法。然而，如果你需要更多信息，可以访问以下地址之一：\n\n- [`tinyurl.com/3575wcb8`](https://tinyurl.com/3575wcb8)\n\
  - [`docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.xhtml#method.summary`](https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/lang/String.xhtml#method.summary)\n\
  \n![Image](img/chapter14-01.png)\n\n![](img/notice.jpg)Java 字符串方法（子程序）可以在需要操作字符串时使用，例如从字符串中提取某些字符、移除字符串开头可能存在的空格，或者将其所有字符转换为大写。\n\
  \n![](img/remember.jpg)方法无非是解决小问题的小型子程序。\n\n### 14.2 字符在字符串中的位置\n\n让我们在下面的示例中使用文本“Hello\
  \ World”。该字符串由 11 个字符组成（包括两个单词之间的空格字符）。Java 对字符进行编号时，假设第一个字符位于位置 0，第二个位于位置 1，以此此类推。每个字符的位置在此所示。\n\
  \n![Image](img/chapter14-02.png)\n\n![](img/remember.jpg)空格和任何其他字符一样都是字符。仅仅因为没有人能看到它，并不意味着它不存在！\n\
  \n### 14.3 有用的字符串方法（子程序）及其他\n\n#### 修剪 (Trimming)\n\n修剪是从字符串的开头或结尾移除空白字符的过程。\n\n\
  在修剪过程中移除的某些空白字符包括：\n- 普通空格\n- 制表符 (tab)\n- 换行符 (line feed)\n- 回车\n\n例如，你可以修剪用户误输入的位于字符串开头或结尾的任何空格。\n\
  \n用于修剪字符串的方法是\n\n\n\n`subject.trim()`\n\n该方法返回 `subject` 的副本，其中 `subject` 字符串开头和结尾的所有空白字符都已移除。\n\
  \n**示例**\n\n![](img/my_exercise_header.png) Project_14.3a\n```\npublic static void\
  \ main(String[] args) throws Exception {\n    String a, b;\n    a = \" Hello\";\n\
  \    b = a.trim();\n    System.out.println(b + \" Poseidon!\"); //它显示：Hello Poseidon!\n\
  \    System.out.println(a + \" Poseidon!\"); //它显示：   Hello      Poseidon!\n}\n\
  ```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有改变。如果你确实需要更改其内容，可以使用语句 `a = a.trim();`。\n\
  \n#### 字符串替换 (String replacement)\n\n`subject.replace(search, replace)`\n\n该方法在\
  \ `subject` 中搜索并返回其副本，其中所有出现 `search` 字符串的地方都被替换为 `replace` 字符串。\n\n**示例**\n\n![](img/my_exercise_header.png)\
  \ Project_14.3b\n```\npublic static void main(String[] args) throws Exception {\n\
  \    String a, b;\n    a = \"I am newbie in C++. C++ rocks!\";\n    b = a.replace(\"\
  C++\", \"Java\");\n    System.out.println(b);    //它显示：I am newbie in Java. Java\
  \ rocks\n    System.out.println(a);    //它显示：I am newbie in C++. C++ rocks\n}\n\
  ```\n\n![](img/notice.jpg)注意变量 `a` 的内容没有改变。如果你确实需要更改其内容，可以使用语句 `a = a.replace(\"\
  C++\", \"Java\");`。\n\n#### 统计字符数 (Counting the number of characters)\n\n`subject.length()`\n\
  \n该方法返回 `subject` 的长度，换句话说，就是 `subject` 包含字符的数量。\n\n**示例**\n\n![](img/my_exercise_header.png)\
  \ Project_14.3c\n```\npublic static void main(String[] args) throws Exception {\n\
  \    String a;\n    int k;\n    a = \"Hello Olympians!\";\n    System.out.println(a.length());\
  \                      //它显示：16\n    k = a.length();\n    System.out.println(k);\
  \                               //它显示：16\n    System.out.println(\"I am newbie in\
  \ Java\".length());  //它显示：19\n}\n```\n\n#### 查找字符串位置 (Finding string position)\n\
  \n`subject.indexOf(search)`\n\n该方法在 `subject` 中返回 `search` 首次出现的数字位置，如果未找到则返回 -1。\n\
  \n**示例**\n\n![](img/my_exercise_header.png) Project_14.3d\n```\npublic static void\
  \ main(String[] args) throws Exception {\n    int i;\n    String a;\n    a = \"\
  I am newbie in Java. rocks!\";\n    i = a.indexOf(\"newbie\");\n    System.out.println(i);\
  \ //它显示：5\n    System.out.println(a.indexOf(\"Java\")); //它显示：15\n    System.out.println(a.indexOf(\"\
  C++\")); //它显示：-1\n}\n```\n\n#### 转换为小写 (Converting to lowercase)\n\n`subject.toLowerCase()`\n\
  \n该方法返回 `subject` 的副本，其中字符串中的所有字母都转换为小写。\n\n**示例**\n\n![](img/my_exercise_header.png)\
  \ Project_14.3e\n```\npublic static void main(String[] args) throws Exception {\n\
  \    String a, b;\n    a = \"MyMe is JohN\";\n    b = a.toLowerCase();\n    System.out.println(b);\
  \ //它显示：my name is john\n    System.out.println(a); //它显示：MyMe is JohN\n}\n```\n\
  \n#### 转换为大写 (Converting to uppercase)\n\n`subject.toUpperCase()`\n\n该方法返回 `subject`\
  \ 的副本，其中字符串中的所有字母都转换为大写。\n\n**示例**\n\n![](img/my_exercise_header.png) Project_14.3f\n\
  ```\npublic static void main(String[] args) throws Exception {\n    String a, b;\n\
  \    a = \"MyMe is JohN\";\n    b = a.toUpperCase();\n    System.out.println(b);\
  \ //它显示：MY NAME IS JOHN\n    System.out.println(a); //它显示：MyMe is JohN\n}\n```\n\
  \n#### 从字符串检索单个字符 (Retrieving an individual character from a string)\n\n`subject.charAt(index)`\n\
  \n该方法返回位于 `subject` 指定 `index` 位置的字符。如前，字符串索引从零开始。你可以使用索引 0 访问第一个字符，索引 1 访问第二个字符，以此此类推。最后一个字符的索引比字符串长度少\
  \ 1。\n\n**示例**\n\n![](img/my_exercise_header.png) Project_14.3g\n```\npublic static\
  \ void main(String[] args) throws Exception {\n    String a;\n    a = \"Hello World\"\
  ;\n    System.out.println(a.charAt(0)); //它显示第一个字母：H\n    System.out.println(a.charAt(6));\
  \ //它显示：W\n    System.out.println(a.charAt(10)); //它显示：d\n}\n```\n\n#### 获取字符串部分\
  \ (Getting part of a string)\n\n`subject.substring(beginIndex [, endIndex])`\n\n\
  该方法返回 `subject` 的部分。具体来说，它返回从位置 `beginIndex` 开始到但不包含 `endIndex` 位置的子字符串。`endIndex`\
  \ 参数是可选的。如果省略它，则返回从位置 `beginIndex` 开始到 `subject` 尾的子字符串。\n\n\n\n\n\n![](img/my_exercise_header.png)\
  \ 项目 _14.3h\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    String a;\n    a = \"Hello Athena\";\n    System.out.println(a.substring(6,\
  \ 9));  //显示为: Ath\n    System.out.println(a.substring(7));     //显示为: then\n}\n\
  ```\n\n## 字符串比较\n\n`subject.compareTo(string)`\n\n该方法当 `subject` 在字典序上与 `string`\
  \ 相等时返回值 `0`；如果 `subject` 在字典序上小于 `string`，返回一个小于 `0` 的值；如果 `subject` 在字典序上大于 `string`，则返回一个大于\
  \ `0` 的值。\n\n“字典序”（lexicographically）一词意味着字母“A”被认为“小于”字母“B”，“字母“B”被认为“小于”字母“C”，以此此类推。当然，如果两个字符串的首字母相同，Java\
  \ 会继续比较它们的第二个字母，可能还会比较第三个字母（如果有必要）。例如，“backspace”一词被认为“小于”“backwards”一词，因为第五个字母“s”“小于”第五个字母“w”。\n\
  \n检查两个字符串是否相另一种方便方法是：\n\n`subject.equals(string)`\n\n该方法检查 `subject` 在字典序上是否与 `string`\
  \ 相等，并相应返回 `true` 或 `false`。\n\n### 示例\n\n![](img/my_exercise_header.png) 项目 _14.3i\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    String\
  \ a = \"backspace\";\n    String b = \"backwards\";\n    String c = \"Backspace\"\
  ;\n    String d = \"winter\";\n    String e = \"winter\";\n    System.out.println(a.compareTo(b));\
  \    //显示: -4\n    System.out.println(a.compareTo(c));    //显示: 32\n    System.out.println(a.compareTo(d));\
  \    //显示: -21\n    System.out.println(d.compareTo(e));    //显示: 0\n    System.out.println(a.equals(d));\
  \       //显示: false\n    System.out.println(a.equals(c));       //显示: false\n  \
  \  System.out.println(d.equals(e));       //显示: true\n}\n```\n\n![](img/notice.jpg)注意字母“b”和“B”被认为是两个不同的字母。\n\
  \n![](img/notice.jpg)考虑在英语字典中单词组织的语境下的“字典序”一词。\n\n## 将数字或字符转换为字符串\n\n`String.valueOf(subject)`\n\
  \n该方法返回 `subject` 的字符串版本，或者换句话说，它将数字（实点数或整数）或字符转换为字符串。\n\n### 示例\n\n![](img/my_exercise_header.png)\
  \ 项目 _14.3j\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    String a;\n    char b;\n    int c, d;\n    b = 'W';\n    a = String.valueOf(b);\
  \   //将字母 W 赋值给字符串变量 a\n    System.out.println(a);   //显示: W\n    c = 12;\n    d\
  \ = 34;\n    System.out.println(c + d); //显示: 46\n    System.out.println(String.valueOf(c)\
  \ + String.valueOf(d)); //显示: 1234\n}\n```\n\n在 Java 中，如果只是以一个字符串开始序列（即使是空字符串），也可以实现相同的结果，如下例所示。\n\
  \n![](img/my_exercise_header.png) 项目 _14.3k\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String a;\n    char b;\n    int c, d;\n    b = 'W';\n\
  \    a = \"\" + b;   //将字母 W 赋值给字符串变量 a\n    System.out.println(a);   //显示: W\n\
  \    c = 12;\n    d = 34;\n    System.out.println(c + d); //显示: 46\n    System.out.println(\"\
  \" + c + d); //显示: 1234\n    System.out.println(\"Result - \" + c + d); //显示: Result\
  \ - 1234\n}\n```\n\n### 练习 14.3-1 反向显示字符串\n\n编写一个 Java 程序，提示用户输入任何带有四个字母的字符串，然后反向显示其内容。例如，如果输入的字符串是“Zeus”，程序必须显示“sueZ”。\n\
  \n##### 解决方案\n\n假设用户的输入被赋值给变量 `s`。你可以使用 `s.charAt(3)` 获取第四个字符，使用 `s.charAt(2)` 获取第三个字符，以此此类推。\n\
  \nJava 程序如所示。这里使用拼接运算符（`+`）来重新组合最终的反转后的字符串。\n\n![](img/my_exercise_header.png) 项目\
  \ _14.3-1\n\n```java\npublic static void main(String[] args) throws Exception {\n\
  \    String s, sReversed;\n    System.out.print(\"Enter a word with four letters:\
  \ \");\n    s = cin.nextLine();\n    sReversed = \"\" + s.charAt(3) + s.charAt(2)\
  \ + s.charAt(1) + s.charAt(0);\n    System.out.println(sReversed);\n}\n```\n\n\n\
  \n\n![](img/my_exercise_header.png) 项目 _14.3-3\n\n```java\npublic static void main(String[]\
