  \n### 练习 23.4-5 阶梯费率与用电量\n\n电力公司根据下表向订阅者收取用电费（家庭账户的月费）。假设包含了传输和分配费用。\n\n| 千瓦时 (kWh)\
  \ | 每千瓦时费用 |\n| :--- | :--- |\n| ≤ 500 | 0.10 |\n| 501 ≤ kWh ≤ 2000 | 0.25 |\n|\
  \ 2001 ≤ kWh ≤ 4500 | 0.40 |\n| 4501 ≤ kWh | 0.60 |\n\n编写一个 Java 程序，提示用户输入千瓦时数，然后计算并显示总金额。请注意费率是阶梯式的。\n\
  \n##### 答案\n\n阶梯费率意味着当客户消费了例如 `2200` `kWh` 时，前 `500` `kWh` 收费 `0.10`，接下来的 `1500`\
  \ `kWh` 收费 `0.25`。\n\n![Image](img/chapter23-22.png) 下方的图可以帮助你理解在阶梯费率下如何计算总金额。\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int kwh;\n\
  \    double t;\n    System.out.print(\"Enter number of Kilawatt-hours: \");\n  \
  \  kwh = Integer.parseInt(cin.nextLine());\n    if (kwh <= 500) {\n        t = kwh\
  \ * 0.10;\n    } else if (kwh <= 2000) {\n        t = 500 * 0.10 + (kwh - 500) *\
  \ 0.25;\n    } else if (kwh <= 4500) {\n        t = 500 * 0.10 + 1500 * 0.25 + (kwh\
  \ - 2000) * 0.40;\n    } else {\n        t = 500 * 0.10 + 1500 * 0.25 + 2500 * 0.40\
  \ + (kwh - 4500) * 0.60;\n    }\n    System.out.println(\"Total amount to pay: \"\
  \ + t);\n}\n```\n\n### 练习 23.4-6 阶梯费率与短信服务\n\n手机公司每月向客户收取 `$8` 的基础费用以发送短信。额外费用根据短信总数收取，如下表所示。\n\
  \n| 短信发送数量 | 每条短信费用 |\n| :--- | :--- |\n| 50 条以内 | 免费 |\n| 51-150 条 | `$0.05` |\n\
  | 151 条及以上 | `$0.10` |\n\n联邦、州和地方税为账单增加 `10%`。编写一个 Java 程序，提示用户输入短信数量，然后计算并显示总金额。请注意费率是阶梯式的。\n\
  \n##### 答案\n\nJava 程序所示。\n\n```java\npublic static void main(String[] args) throws\
  \ Exception {\n    int count;\n    double extra, totalWithoutTaxes, taxes, total;\n\
  \    System.out.print(\"Enter number of text messages sent: \");\n    count = Integer.parseInt(cin.nextLine());\n\
  \    if (count <= 50) {\n        extra = 0;\n    } else if (count <= 150) {\n  \
  \      extra = (count - 50) * 0.05;\n    } else {\n        extra = 100 * 0.05 +\
  \ (count - 150) * 0.10;\n    }\n    totalWithoutTaxes = 8 + extra; // 加上基础费用 8\n\
  \    taxes = totalWithoutTaxes * 10 / 100; // 计算总税额\n    total = totalWithoutTaxes\
  \ + taxes; // 计算总金额\n    System.out.println(\"Total amount to pay: \" + total);\n\
  }\n```\n\n### 23.5 决策控制结构的通用性练习\n\n#### 练习 23.5-1 寻找闰年\n\n\n\n\n编写一个 Java 程序，提示用户输入一个年份，然后显示一条消息指示该年份是否为闰年；否则必须显示消息“Not\
  \ a leap year”（不是闰年）。此外，如果用户输入的年份小于 1582，则必须显示错误信息。\n\n##### 解决方案\n\n根据 1582 年首次引入的格列哥略历，当满足以下条件之一时，该年份即为闰年：\n\
  \n1. `第 1` 条件：该年份能被 4 整除，但不能被 100 整除。\n2. `第 2` 条件：该年份能被 400 整除。\n\n在下表中，某些年份不是闰年，因为这两个条件都不为真。\n\
  \n| 年份 | 是否为闰年 | 条件 |\n| --- | --- | --- |\n| 1600 | 是 | 第 2 个条件为真。它能被 400 整除 |\n\
  | 1900 | 否 | 两个条件均为假。 |\n| 1904 | 是 | 第 1 个条件为真。它能被 4 整除，且不能被 100 整除 |\n| 1905 |\
  \ 否 | 两个条件均为假。 |\n| 2000 | 是 | 第 2 个条件为真。它能被 400 整除 |\n| 2002 | 否 | 两个条件均为假。 |\n\
  | 2004 | 是 | 第 1 个条件为真。它能被 4 整除，且不能被 100 整除 |\n| 2024 | 是 | 第 1 个条件为真。它能被 4 整除，且不能被\
  \ 100 整除 |\n\n所示是该 Java 程序。\n\n![](img/my_exercise_header.png) Project_23.5-1\n\
  ```javapublic static void main(String[] args) throws Exception {\n    int y;\n \
  \   System.out.print(\"Enter a year: \");\n    y = Integer.parseInt(cin.nextLine());\n\
  \    if (y < 1582) {\n        System.out.println(\"Error! The year cannot be less\
  \ than 1582\");\n    } else {\n        if (y % 4 == 0 && y % 100 != 0 || y % 400\
  \ == 0) {\n            System.out.println(\"Leap year!\");\n        } else {\n \
  \           System.out.println(\"Not a leap year\");\n        }\n    }\n}\n```\n\
  \n![](img/remember.jpg) AND（运算符（ `&&` ））的优先级高于 OR（运算符（ `||` ））。\n\n### 练习题 23.5-2\
