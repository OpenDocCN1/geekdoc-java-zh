  \n## 第 21 章 更多关于决策控制结构的流程图\n\n### 21.1 引言\n\n通过学习前面的章节，你已经熟悉了所有的决策控制结构。由于流程图是学习“算法思维”并帮助你更好地特定控制结构的理想方式，本章专门用于教你如何将\
  \ Java 程序转换为流程图，或将流程图转换为 Java 程序。\n\n### 21.2 将 Java 程序转换为流程图\n\n要将 Java 程序转换为相应的流程图，你需要记住所有的决策结构及其对应的流程图片段。它们在这里总结：\n\
  \n#### 单分支决策结构\n\n![Image](img/16-01.png)\n\n#### 双分支决策结构\n\n![Image](img/17-01.png)\n\
  \n#### 多分支决策结构\n\n![Image](img/18-01.png)\n\n你可以使用相同的流程图来表示分支结构！\n\n#### 练习 21.2-1\
  \ 设计流程图\n\n为以下程序设计流程图：\n\n```java\npublic static void main(String[] args) throws\
  \ Exception {\n    double x, z, w, y;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    z = Math.pow(x, 3);\n    w = (z - 4) / 7;\n    if (z >= w) {\n        y = 2\
  \ * x;\n        if (y > 0) { //这是一个嵌套的单分支结构\n            y++;\n        }\n    }\
  \ else {\n        y = 4 * x;\n    }\n    System.out.println(y);\n}\n```\n\n解决方案\n\
  \n在这个 Java 程序中有一个嵌套的单分支决策结构。其对应的流程图如下。\n\n![Image](img/21-01.png)\n\n流程图是表示算法的一种非常灵活的方法。因此，允许编写\
  \ $x³$ 或使用 `Math.pow()` 方法。你可以按照任何方式，熟悉流程图的人都能清晰理解你想说什么。\n\n在流程图中，本书使用了通用的 `AND`、`OR`\
  \ 和 `NOT` 运算符！\n\n#### 练习 21.2-2 设计流程图\n\n为给定的通用形式代码片段设计流程图：\n\n```java\nif (Boolean_Expression_A)\
  \ {\n    // 语句或块 A1\n    if (Boolean_Expression_B) {\n        // 语句或块 B1\n    }\n\
  \    // 语句或块 A2\n} else {\n    // 语句或块 A3\n    if (Boolean_Expression_C) {\n   \
  \     // 语句或块 C1\n    } else {\n        // 语句或块 C2\n    }\n}\n```\n\n解决方案\n\n为了方便观察，再次展示初始代码片段并将所有的嵌套决策结构封装在框内：\n\
  \n```java\nif (Boolean_Expression_A) {\n    if (Boolean_Expression_B) {\n      \
  \  // B1\n    }\n} else {\n    if (Boolean_Expression_C) {\n        // C1\n    }\
  \ else {\n        // C2\n    }\n}\n```\n\n通用形式的流程图如下所示。\n\n![Image](img/21-02.png)\n\
  \n#### 练习 21.2-3 设计流程图\n\n为以下 Java 程序设计流程图：\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    double a, y, b;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    if (a < 0) {\n        y = a * 2;\n    } else if (a < 10) {\n        y = a /\
  \ 2;\n    } else if (a < 100) {\n        y = a + 2;\n    } else {\n        // 逻辑在此结束\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nb = Integer.parseInt(cin.nextLine());\ny = a\
  \ * b;\nif (y > 0)  //这是一个嵌套的双重分支决策结构\n    y--;      //\nelse\n    y++;      //\n\
  }\nSystem.out.println(y);\n```\n\n##### 答案\n\n在这个 Java 程序中，一个双重分支决策结构嵌套在一个多重分支决策结构中。\n\
  \n流程图所示。\n\n![Image](img/chapter21-03.png)\n\n### 21.3 一个你可能会犯的错误！\n\n在流程图中，初级程序员经常犯的一个非常常见的错误是让某些路径没有连接，如下方的流程图所示。\n\
  \n![Image](img/chapter21-04.png)\n\n请记住，每条路径都试图到达算法的终点，因此你不能让任何路径处于未连接状态。\n\n另一方面，尽量避免使用许多\
