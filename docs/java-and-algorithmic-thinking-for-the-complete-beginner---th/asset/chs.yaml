  \ 4)` 返回从位置 0 开始到但不包含位置 4 的子字符串。\n\n![](img/notice.jpg)注意 `substring()` 方法是如何链接到\
  \ `toLowerCase()` 方法上的。第一个方法的结果被用作第二个方法的的操作数。这是大多数程序员倾向于遵循的编写风格，因为可以帮助节省大量的代码行。当然，你可以根据意愿链任意数量的方法，但如果你链了太多方法，没有人能看懂你的代码。\n\
  \n#### 练习 14.3-4 创建随机单词\n\n编写一个 Java 程序，显示一个由三个字母组成的随机单词。\n\n##### 答案\n\n要创建一个随机单词，你需要一个包含英语字母表中所有\
  \ 26 个字母的字符串。然后你可以使用 `Math.random()` 方法在位置 0 到 25 之间选择一个随机字母。\n\n该算法的 Java 程序所示。\n\
  \n![](img/my_exercise_header.png) 项目 _14.3-4\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String alphabet, randomWord;\n    alphabet = \"\
  abcdefghijklmnopqrstuvwxyz\";\n    randomWord = \"\" + alphabet.charAt((int)(Math.random()\
  \ * 26)) +\n                 alphabet.charAt((int)(Math.random() * 26)) +\n    \
  \             alphabet.charAt((int)(Math.random() * 26));\n    System.out.println(randomWord);\n\
  }\n```\n\n![](img/remember.jpg)你可以将一个子程序嵌套在另一个程序内部。注意 `random()` 方法是如何嵌套在 `charAt()`\
  \ 方法中的。内部（嵌套）方法的的结果被用作外部方法的参数。\n\n![](img/notice.jpg)注意方法 `Math.random()` 被调用了三次，每次它都可能返回不同的随机数。\n\
  \n![](img/remember.jpg)在 Java 中，有时有必要强制编译器执行拼接而不是普通的加法，这通过以字符串开始序列，即使是一个空字符串。\n\n\
