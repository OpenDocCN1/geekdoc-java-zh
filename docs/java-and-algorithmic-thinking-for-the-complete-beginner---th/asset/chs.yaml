  \n![](img/remember.jpg)\n较小的算法并不总是解决给定问题的最佳方案。为了解决特定问题，你可能会编写一个简洁的算法，遗憾的是，它被证明会消耗大量的\
  \ CPU 时间和或占用大部分主内存（RAM）。另一方面，你也可以另一个算法解决同一个问题，虽然它看起来更长，但计算结果快得多，或占用的内存更少。\n\n###\
  \ 29.2 选择循环控制结构\n\n下面的图可以帮助你根据迭代次数，为每个给定问题选择最合适的循环控制结构。\n\n![Image](img/chapter29-01.png)\n\
  \n![](img/notice.jpg)此图推荐的是最佳选项，而非唯一选项。例如，当迭代次数已知时，使用预测试循环或后测试循环结构并不是错误的。不过，建议的\
  \ `for-loop` 更加方便。\n\n### 29.3 “终极”规则\n\n在使用预测试或后测试循环结构时，经常困扰程序员的问题是：如何确定哪些语句应该写在循环控制结构的内部或外部，以及顺序如何。\n\
  \n有一个简单而强大的规则——“终极”规则！一旦你遵循了它，犯逻辑错误的可能性就会降为零！\n\n“终极”规则规定：\n\n* 参与循环布尔表达式的变量在进入循环之前必须进行初始化。\n\
  * 参与循环布尔表达式的变量的值必须在循环内部进行更新（更改）。更具体地说，执行此更新/更改的语句必须是循环的最后语句之一。\n\n例如，如果变量 `x` 是参与循环布尔表达式的变量，则预测试循环结构的形式如下：\n\
  \n```\nInitialize x\nwhile ( Boolean_Expression(x) ) {\n    A statement or block\
  \ of statements\n    Update/alter x\n}\n```\n\n而后测试循环结构的形式如下：\n\n```\nInitialize\
  \ x\ndo {\n    A statement or block of statements\n    Update/alter x\n} while (\
  \ Boolean_Expression(x) );\n```\n\n其中\n\n* `Initialize x` 是任何为变量 `x` 分配初始值的语句。它可以是一个输入语句，如\
  \ `cin.nextLine()`，也可以是使用赋值运算符（`=`）的赋值语句。但在后测试循环结构中，该语句有时是多余的，可以省略，因为 `x` 的初始化可以直接在循环内部发生。\n\
  * `Boolean_Expression(x)` 可以是任何依赖变量 `x` 的布尔表达式，从简单到复杂不等。\n* `Update/alter x` 是任何更改\
  \ `x` 值的语句，例如另一个输入语句、使用赋值运算符（`=`）的赋值语句，甚至是复合赋值运算符。重要的一点是，该语句必须位于循环布尔表达式求值点正之前。这意味着它应该是循环内部的最后语句之一。\n\
  \n以下是使用“终极”规则的几个示例。\n\n#### 示例 1\n\n```\na = Integer.parseInt(cin.nextLine()); \
  \ //Initialization of a\nwhile (a > 0) {  //Boolean expression dependent on a\n\
  \    System.out.println(a);\n    a = a - 1;  //Update/alteration of a\n}\n```\n\n\
  #### 示例 2\n\n```\na = Integer.parseInt(cin.nextLine());   //Initialization of a\n\
  b = Integer.parseInt(cin.nextLine());   //Initialization of b\nwhile (a > b) { \
  \ //Boolean expression dependent on a and b\n    System.out.println(a + \" \" +\
  \ b);\n    a = Integer.parseInt(cin.nextLine());   //Update/alteration of a\n  \
  \  b = Integer.parseInt(cin.nextLine());   //Update/alteration of b\n}\n```\n\n\
  #### 示例 3\n\n```\ns = 0;  //Initialization of s\ndo {\n    y = Integer.parseInt(cin.nextLine());\n\
  \    s = s + y;  //Update/alteration of s\n} while (s < 1000);  //Boolean expression\
  \ dependent on s\n```\n\n#### 示例 4\n\n```\ny = 0;  //Initialization of y\ndo {\n\
  \    y = Integer.parseInt(cin.nextLine());  //Update/alteration of y\n} while (y\
  \ < 0);  //Boolean expression dependent on y\n```\n\n在这个示例中，在循环外部初始化变量 `y` 是多余的，可以省略，如下所示。\n\
  \n```\ndo {\n    y = Integer.parseInt(cin.nextLine());  //Initialization and update/alteration\
  \ of y\n} while (y < 0);  //Boolean expression dependent on y\n```\n\n#### 示例 5\n\
  \n```\nodd = 0;   //Initialization of odd\neven = 0;  //Initialization of even\n\
  while (odd + even < 5) {  //Boolean expression dependent on odd and even\n    x\
  \ = Integer.parseInt(cin.nextLine());\n    if (x % 2 == 0) {\n        even++;  //Update/alteration\
  \ of even\n    } else {\n        odd++;\n    }\n}\n```\n\n这些使用“终极”规则的示例将让你意识到为什么应该遵循它。让我们来看看以下代码片段：\n\
  \n```java\nint positivesCount;\ndouble x;\npositivesCount = 0;\nwhile (positivesCount\
  \ != 3) {\n    x = Double.parseDouble(cin.nextLine());\n    if (x > 0) {\n     \
  \   positivesCount++;\n    }\n}\n```\n\n乍看，这段代码看起来是正确的。它允许用户输入正数，直到 `positivesCount`\
  \ 达到 3。然而，当用户输入负数或零时，`positivesCount` 将保持不变，这会导致无限循环。通过尝试不同的值来跟踪执行，这个追踪表可以帮助确定问题所在：\n\
  \n| Step | Statement | Notes | positivesCount | x |\n| --- | --- | --- | --- | ---\
  \ |\n| 1 | `positivesCount = 0;` | | 0 | ? |\n| 2 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 0 | 5.0 |\n| 3 | `while (positivesCount != 3)` | This evaluates to true |\
  \ 0 | 5.0 |\n| 4 | `if (x > 0)` | This evaluates to true | 0 | 5.0 |\n| 5 | `positivesCount++;`\
  \ | | 1 | 5.0 |\n| 6 | `x = Double.parseDouble(cin.nextLine());` | | 1 | -10.0 |\n\
  | 7 | `while (positivesCount != 3)` | This evaluates to true | 1 | -10.0 |\n| 8\
  \ | `if (x > 0)` | This evaluates to false | 1 | -10.0 |\n| 9 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 1 | -2.0 |\n| 10 | `while (positivesCount != 3)` | This evaluates to true\
  \ | 1 | -2.0 |\n| 11 | `if (x > 0)` | This evaluates to false | 1 | -2.0 |\n| 12\
  \ | `x = Double.parseDouble(cin.nextLine());` | | 1 | 4.0 |\n| 13 | `while (positivesCount\
  \ != 3)` | This evaluates to true | 1 | 4.0 |\n| 14 | `if (x > 0)` | This evaluates\
  \ to true | 1 | 4.0 |\n| 15 | `positivesCount++;` | | 2 | 4.0 |\n| 16 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 2 | 20.0 |\n| 17 | `while (positivesCount != 3)` | This evaluates to true\
  \ | 2 | 20.0 |\n| 18 | `if (x > 0)` | This evaluates to true | 2 | 20.0 |\n| 19\
  \ | `positivesCount++;` | | 3 | 20.0 |\n| 20 | `x = Double.parseDouble(cin.nextLine());`\
  \ | | 3 | ??? |\n\n这就是逻辑错误所在！在第 20 步，尽管用户提供的正数总数已经是三个，且你期望执行结束，但遗憾的是，用户被要求输入额外的数字！但是，你需要的是一个允许用户输入三个正数的代码片段，而不是四个，对吗？\n\
  \n\n\n\n这就是为什么你应该始终遵循规范写法！让我们来看看这段代码片段应该如何编写。\n\n由于 `while` 循环的布尔表达式依赖于变量 `positivesCount`，因此该变量必须在循环外初始化。该变量还必须在循环内部进行更新/修改。执行此更新/修改的语句必须是循环内的最后一条语句，如下代码片段（通用形式）所示。\n\
  \n```java\npositivesCount = 0;            // positivesCount 的初始化\nwhile (positivesCount\
  \ != 3) {  // 这依赖于 positivesCount\n    A statement or block of statements\n    if\
  \ (x > 0) {\n        positivesCount += 1;     // positivesCount 的更新/修改\n    }\n\
  }\n```\n\n现在你可以添加任何必要的语句来完成代码。你只需要在这里添加的语句是让用户输入数字的语句（这必须在循环内完成）以及显示最后消息的语句（这必须在循环完成所有迭代后完成）。因此，最终的代码片段变为：\n\
  \n```java\nint positivesCount;\ndouble x;\npositivesCount = 0;\nwhile (positivesCount\
  \ != 3) {\n    x = Double.parseDouble(cin.nextLine());\n    if (x > 0) {\n     \
  \   positivesCount += 1;\n    }\n}\nSystem.out.println(\"Three Positives provided!\"\
  );\n```\n\n### 29.4 跳出循环\n\n循环可能会消耗过多的 CPU 时间，因此在使用它们时必须非常小心。某些情况下，你需要在循环完成所有迭代之前跳出或结束循环，通常是在满足特定条件时。\n\
  \n假设有一个隐藏的密码，你通过某种方式知道它是三个字符长，且仅包含数字。以下 `for` 循环执行 900 次迭代，试图通过暴力破解找到那个隐藏密码。\n\n\
  ```java\nfound = false;\nfor (i = 100; i <= 999; i++) {\n    if (i == hiddenPassword)\
  \ {\n        password = i;\n        found = true;\n    }\n}\nif (found == true)\
  \ {\n    System.out.println(\"Hidden password is: \" + password);\n}\n```\n\n![](img/notice.jpg)暴力破解是获取任何受密码保护内容的最简单方法。攻击者尝试字母、数字和符号的组合，希望能最终猜对。\n\
  \n现在，假设隐藏密码是 `123`。正如你所知的，`for` 循环迭代指定的次数，而在这种情况下，它并不关心是否真的找到了隐藏密码。即使在第 $24^{th}$\
  \ 次迭代中找到了密码，但遗憾的是，循环会继续迭代，直到变量 `i` 达到值 `999`，从而浪费了 CPU 时间。\n\n有人可能会认为 800 – 900\
  \ 次迭代并不是什么大问题，他们可能是正确的。然而，在大规模数据处理中，每一次迭代都至关重要。因此，在使用循环控制结构时要非常小心，尤其是那些迭代次数过多的结构。如果隐藏密码是十位数的呢？这意味着\
  \ `for` 循环必须执行 9,000,000,000 次迭代！\n\n有两种方法可以帮助你让之前那样的程序运行得更快。这两种方法的核心思想都是：在满足特定条件时跳出循环；在本例中就是找到隐藏密码时。\n\
  \n#### 第一种方法——使用 `break` 语句\n\n你可以通过 `break` 语句在循环实际完成所有迭代之前跳出循环。\n\n查看下面的 Java\
  \ 程序。当找到隐藏密码时，执行流立即退出（跳出）`for` 循环。\n\n```java\nfound = false;\nfor (i = 100; i <=\
  \ 999; i++) {\n    if (i == hiddenPassword) {\n        password = i;\n        found\
  \ = true;\n        break;\n    }\n}\nif (found) {\n    System.out.println(\"Hidden\
  \ password is: \" + password);\n}\n```\n\n![](img/notice.jpg)语句 `if (found)` 等同于语句\
  \ `if (found == true)`。\n\n#### 第二种方法——使用标志位\n\n`break` 语句并不是在所有计算机语言中都存在；由于本书的意图是教你“算法思维”（而不仅仅是\
  \ Java 支持的特殊语句），让我们来看另一种方法。\n\n在下面的 Java 程序中，当找到隐藏密码时，布尔表达式 `found == false` 强制执行流退出循环。\n\
  \n```java\nfound = false;\ni = 100;\nwhile (found == false && i <= 999) {\n    if\
  \ (i == hiddenPassword) {\n        password = i;\n        found = true;\n    }\n\
  \    i++;\n}\nif (found) {\n    System.out.println(\"Hidden password is: \" + password);\n\
  }\n```\n\n![](img/notice.jpg)将变量 `found` 视为一个标志。初始时，标志未被“举起”（`found = false`）。执行流进入循环，只要标志保持向下状态，就会继续迭代（`while\
  \ found == false …`）。当循环内部发生触发标志事件时（给变量 `found` 赋值为 `true`），执行流退出循环。\n\n![](img/notice.jpg)`found\
  \ == false && i <= 999` 表达式可以写为 `!found && i <= 999`。\n\n![](img/notice.jpg)在找到隐藏密码的情况下该表达式仍然是必要的。\n\
  \n### 29.5 优化循环\n\n正如所述，循环会消耗 CPU 时间，因此你必须非常谨慎地使用它们。虽然某些迭代次数是不可避免的，但总有一些方法可以提高循环的性能。\n\
  \n下一个代码片段计算 `1, 2, 3, 4, … 10000` 的和。\n\n```java\ns = 0;\ni = 100;\ndo {\n    s\
  \ += i;\n    i++;\n}\n```\n\n在使用循环时，尤其是迭代次数非常多的循环时，你应该始终记住，避免在循环内部放置没有任何意义的语句。在之前的示例中，`positivesCount\
  \ = 10000` 就是这样的语句。不幸的是，只要它位于循环内部，计算机就会执行 10000 次。\n\n为了解决这个问题，你只需将该语句移到循环之外，如下：\n\
  \n```java\npositivesCount = 10000;\ns = 0;\ni = 1;\ndo {\n    s += i;\n    i++;\n\
  } while (i <= positivesCount);\n```\n\n#### 练习 29.5-1 优化循环\n\n以下代码片段计算 `1, 2, 3,\
  \ 4, … 10000` 的平均值。尝试将可能的语句移到循环外以提高程序效率。\n\n```java\ns = 0;\nfor (i = 1; i <= 10000;\
  \ i++) {\n    s += i;\n    average = s / 10000;\n}\n```\n\n新手程序员在计算平均值时一个非常常见的错误是将总和除以数字数量的语句（这里是\
  \ `average = s / 10000`）放在循环内部。考虑一下！假设你想计算学校平均分。你的第一步是计算所修读的 10 门课程的总分。然后，在所有分数求和后，再除以\
  \ 10。这意味着你执行了 10 次加法，但只有一次除法。\n\n![](img/.jpg)计算平均值是一个分步骤的过程。\n\n因此，在循环内计算平均值是没有意义的。你可以将此语句移到循环之后，让循环负责求和，如下：\n\
  \n```\ns = 0;\nfor (i = 1; i <= 10000; i++) {\n    s += i;\n}\naverage = s / 10000;\n\
  ```\n\n#### 练习 29.5-2 优化循环\n\n下一个公式\n\n![Image](img/chapter29-02.png) 使用以下代码片段求解，其中\
  \ `N` 由用户提供。\n\n```java\nint n, i, j, denom;\ndouble s;\nSystem.out.print(\"Enter\
  \ N: \");\nn = Integer.parseInt(cin.nextLine());\ns = 0;\nfor (i = 1; i <= n; i++)\
  \ {\n    denom = 0;\n    for (j = 1; j <= n; j++) {\n        denom += Math.pow(j,\
  \ j);\n    }\n    s += i / (double)denom;\n}\nSystem.out.println(s);\n```\n\n\n\n\
  正如你从公式所示，分母对于所有分数都是相同的。因此，对每个分数重复计算分母是没有意义的。你只需要计算一次分母，然后多次使用该结果，如下：\n\n```java\n\
  int n, i, j, denom;\ndouble s;\nSystem.out.print(\"Enter N: \");\nn = Integer.parseInt(cin.nextLine());\n\
  denom = 0;\nfor (j = 1; j <= n; j++) {\n    denom += Math.pow(j, j);\n}\ns = 0;\n\
  for (i = 1; i <= n; i++) {\n    s += i / (double)denom;\n}\nSystem.out.println(s);\n\
  ```\n\n### 29.6 死循环以及如何停止它们\n\n所有的 `while` 循环内部必须包含某些最终能引导执行流退出循环的内容。但错误确实会发生！例如，以下代码片段包含一个死循环。遗憾的是，程序员忘记了在循环内部增加变量\
  \ `i`；因此，变量 `i` 永远无法达到 `10` 这个值。\n\n```java\ni = 1;\nwhile (i != 10) {\n    System.out.println(\"\
  Hello there!\");\n}\n```\n\n![](img/notice.jpg)如果循环无法停止迭代，它被称为死循环或无限循环。\n\n程序员可能犯的另一个错误如下所示：\n\
  \n```java\ni = 1;\nwhile (i != 10) {\n    System.out.println(\"Hello there!\");\n\
  \    i += 2;\n}\n```\n\n尽管这段代码片段确实包含一个在循环内部增加变量 `i` 的语句（`i += 2`），遗憾的是，执行流永远不会退出循环，因为值\
  \ `10` 永远没有赋值给变量 `i`。\n\n死循环会永远迭代，停止它迭代的唯一方法是使用魔法力量！例如，当 Windows 操作系统中的应用程序“卡住”（可能是因为执行流进入了死循环）时，必须必须组合键\
  \ `ALT+CTRL+DEL` 来强制结束应用程序。\n\n在 Visual Studio Code 中，当你不小心编写并执行死循环时，只需点击“停止” ![Image](img/vs_code_stop_button.png)\
  \ 工具栏图标，执行就会停止。\n\n![](img/notice.jpg)在 Visual Studio Code 中，强制结束应用程序的另一种方法是在终端窗口中使用组合键\
  \ `CTRL+C`。\n\n### 29.7 “由内而外”方法\n\n“由内而外”是本书提出的一个方法，旨在帮助你从内到外学习“算法思维”。该方法首先处理并设计内部（嵌套）控制结构，然后随着算法（或程序）的开发，添加越来越多的控制结构，并将之前的结构嵌套在其中。这种方法可以用于大型复杂的控制结构，因为它可以帮助你设计无错误的流程图，甚至是\
  \ Java 程序。本书在任何需要的地方、在任何时候都会使用这种方法。\n\n让我们尝试下面的例子。\n\n编写一个 Java 程序，显示如下所示的乘法法表。\n\
  \n![Image](img/chapter29-03.png)\n\n根据“由内而外”的方法，你从编写内部控制结构开始，然后当所有内容都通过测试并运行良好后，你就可以添加外部控制结构（结构）。\n\
  \n所以，让我们尝试只显示乘法法表的第一行。如果你检查这一行，会发现在每次乘法中，被乘数始终是 `1`。我们将被乘数视为值为 `1` 的变量 `i`。仅显示乘法法表第一行的循环控制结构如下。\n\
  \n![](img/my_exercise_header.png) 代码片段 1\n```java\nfor (j = 1; j <= 10; j++) {\n\
  \    System.out.print(i + \"x\" + j + \"=\" + i * j + \"\\t\");\n}\n```\n\n如果你执行这段代码片段，结果是：\n\
  \n![Image](img/chapter29-04.png)\n\n![](img/remember.jpg)特殊字符序列 `\\t` 在每次迭代后“显示”一个制表符。这确保了所有内容都能正确对齐。\n\
  \n内部（嵌套）循环控制结构已经就绪。你现在需要一种执行该控制结构九次的方法，但每次变量 `i` 必须包含一个从 `1` 到 `9` 的不同值。可以通过以下方式实现：\n\
  \n![](img/my_exercise_header.png) 主代码\n```java\nfor (i = 1; i <= 9; i++) {\n   \
  \ // 代码片段 1：显示乘法法表的单行\n    System.out.println();\n}\n```\n\n![](img/notice.jpg)`System.out.println()`\
  \ 语句用于在行与行之间“显示”换行。\n\n将代码片段 1 嵌入主代码后，最终的 Java 程序变为：\n\n![](img/my_exercise_header.png)\
  \ Project_29.7\npublic static void main(String[] args) throws Exception {\n    int\
  \ i, j;\n    for (i = 1; i <= 9; i++) {\n        for (j = 1; j <= 10; j++) {\n \
  \           System.out.print(i + \"x\" + j + \"=\" + i * j + \"\\t\");\n       \
  \ }\n        System.out.println();\n    }\n}\n```\n\n### 29.8 复习题：判断题\n\n对以下每个陈述判断对错\n\
  \n1) 当迭代次数未知时，可以使用循环。\n2) 当迭代次数已知时，不能使用后测试循环。\n3) 根据“最终规则”，在预测试结构中，参与循环的变量的初始化必须在循环内部完成。\n\
  4) 根据“最终规则”，在后测试结构中，参与循环的变量的更新必须是最后一条语句。\n5) 根据“最终规则”，在后测试结构中，参与循环的变量的初始化有时可以在循环内部完成。\n\
  6) 根据“最终规则”，在后测试结构中，参与循环的变量的更新必须是第一条语句。\n7) 在 Java 中，你可以使用 `exit` 语句在循环完成前跳出。\n\
  8) 给变量赋值常量值放在循环结构内部更好。\n9) 在以下代码片段中，至少有一条语句可以移动到循环外部：\n```java\nfor (i = 1; i <=\
  \ 30; i++) {\n    a = \"Hello\";\n    System.out.println(a);\n}\n```\n10) 在以下代码片段中，至少有一条语句可以移动到循环外部：\n\
  ```java\ns = 0;\ncount = 1;\nwhile (count < 100) {\n    a = Integer.parseInt(cin.nextLine());\n\
  \    s += a;\n    average = s / (double)count;\n    count++;\n}\nSystem.out.println(average);\n\
  ```\n11) 在以下代码片段中，至少有一条语句可以移动到循环外部：\n```java\ns = 0;\ny = Integer.parseInt(cin.nextLine());\n\
  while (y != -99) {\n    s = s + y;\n    y = Integer.parseInt(cin.nextLine());\n\
  }\n```\n12) 以下代码片段具有有限性：\n```java\ni = 1;\nwhile (i != 100) {\n    System.out.println(\"\
  Hello there!\");\n    i += 5;\n}\n```\n13) 当在预测试结构的布尔表达式中使用不等于 ( != ) 比较运算符时，循环总是会无限迭代。\n\
  14) 以下代码片段具有有限性：\n```java\ni = 0;\ndo {\n    System.out.println(\"Hello there!\"\
  );\n    i += 5;\n} while (i < 100);\n```\n\n### 29.9 复习题：单选题\n\n为以下每个陈述选择正确答案。\n\
  \n\n\n\n\n1) 当迭代次数未知时，你可以使用：\na) 先测试循环结构。\nb) 后测试循环结构。\nc) 以上所有项。\n\n2) 当迭代次数已知时，你可以使用：\n\
  a) 先测试循环结构。\nb) 后测试循环结构。\nc) `for-loop` 循环。\nd) 以上所有项。\n\n3) 根据“终极规则”（Ultimate rule），在先测试循环结构中，参与循环布尔表达式的变量初始化必须在：\n\
  a) 循环内部。\nb) 循环外部。\nc) 以上所有项。\n\n4) 根据“终极规则”（Ultimate rule），在先测试循环结构中，参与循环布尔表达式的变量更新/修改必须在：\n\
  a) 循环内部。\nb) 循环外部。\nc) 以上所有项。\n\n5) 根据“终极规则”（Ultimate rule），在后测试循环结构中，参与循环布尔表达式的变量初始化可以在：\n\
  a) 循环内部。\nb) 循环外部。\nc) 以上所有项。\n\n6) 在以下代码段中：\n```\ns = 0;\nfor (i = 1; i <= 100;\
  \ i++) {\n    s = s + i;\n    x = 100.0;\n    average = s / x;\n}\n```\n可以移动到 `for-loop`\
  \ 外部的语句数量是：\na) 0。\nb) 1。\nc) 2。\nd) 3。\n\n7) 当此比较运算符用于后测试结构的布尔表达式时，循环将无限迭代：\na)\
  \ `==`\nb) `!=`\nc) 取决于具体情况\n\n### 29.10 复习习题\n\n完成以下练习。\n\n1) 以下程序的作用是提示用户反复输入名称，直到输入“STOP”（用作名称）为止。在最后，程序必须显示输入的名称总数，以及这些名称中有多少个不是“John”。\n\
