  \    }\n}\n```\n\n#### 练习 30.5-7 海伦平方根\n\n编写一个 Java 程序，提示用户输入一个非负值，然后使用海伦公式计算其平方根，如下。\n\
  \n###### ![Image](img/chapter11-01.png)\n\nwhere\n\n\n\n\n\n► `y` 是你想要寻找平方根的数字\n\
  ► `x[n]` 是 `y` 的平方根第 n 次迭代值\n\n此外，使用循环控制结构，程序必须验证输入的数据，并在用户输入任何负值时显示错误信息。\n\n#####\
  \ 解决方案\n\n几乎可以肯定，你现在正感到有些困惑并抓腮。不要被这些数学内容吓着了！你可以尝试通过下面的流程来理解海伦公式（Heron's formula）！\n\
  \n![Image](img/chapter30-03.png)\n\n还是很困惑吗？让我们来看一个例子。试着寻找 25 的平方根：\n\n► 设定猜想。假设\
  \ 8 是你的第一个猜想。\n► 8 的平方是 64。\n► 由于 64 距离 25 并不“足够近”，通过计算表达式设定新的猜想。\n\n![Image](img/chapter30-04.png)\n\
  \n► 5.56 的平方大约是 30.91\n► 由于 30.91 距离 25 并不“足够近”，通过计算表达式设定新的猜想。\n\n![Image](img/chapter30-05.png)\n\
  \n► 5.02 的平方是 25.2\n► 如果你认为 25.2 距离 25 “足够近”，那么你可以停止整个过程并得出 25 的近似平方根是 5.02。\n\n\
  ![](img/notice.jpg) 显然，如果需要更高的精度，你可以选择继续过程，直到找到一个被认为更接近 25 平方根的值。\n\n现在，让我们对应的 Java\
  \ 程序。\n\n![](img/my_exercise_header.png)\n\n```java\nProject_30.5-7\nstatic final\
  \ double ACCURACY = 0.0000000000001;\npublic static void main(String[] args) throws\
  \ Exception {\n    double y, guess;\n    System.out.print(\"Enter a non-negative\
  \ number: \");\n    y = Double.parseDouble(cin.nextLine());\n    while (y < 0) {\n\
  \        System.out.print(\"Invalid value. Enter a non-negative number: \");\n \
  \       y = Double.parseDouble(cin.nextLine());\n    }\n    // 在 1 和用户提供的值之间产生一个随机初始猜想\n\
  \    guess = 1 + (Math.random() * y);\n    while (Math.abs(guess * guess - y) >\
  \ ACCURACY) { // 是否“足够近”？\n        guess = (guess + y / guess) / 2;    // 不是，创建一个新的“猜想”！\n\
  \    }\n    System.out.println(guess);\n}\n```\n\n![](img/notice.jpg) 注意检查“是否足够近”的方式。当差的绝对值\
  \ `|guess² - y|` 小于 `0.0000000000001`（其中 `y` 是用户提供的值）时，执行流将退出循环。\n\n## 练习 30.5-8\
  \ 计算 π\n\n编写一个 Java 程序，使用 Madhava–Leibniz 级数计算 `π`，精度为 0.00001。\n\n![Image](img/chapter30-06.png)\n\
  \n##### 解决方案\n\nMadhava–Leibniz 级数可以求解出 `π`，变为\n\n![Image](img/chapter30-07.png)\n\
  \n分数越多，精度越高！因此，为了计算此公式，程序需要进行多次迭代，以便尽可能使用多的分数。当然，它不能无限迭代下去！当当前计算的 `π` 值与上一次迭代计算出的值“足够近”时，循环必须停止迭代，这意味着它们的差绝对值已经变得非常小。常量\
  \ `ACCURACY` 定义了这种差异必须有多小。这里是对应的 Java 程序。\n\n![](img/my_exercise_header.png)\n\n\
  ```java\nProject_30.5-8\nstatic final double ACCURACY = 0.00001;\npublic static\
  \ void main(String[] args) throws Exception {\n    double pi, piPrevious;\n    int\
  \ sign, denom;\n    pi = 0;\n    sign = 1;    // 这是第一个分数的符号\n    denom = 1;   //\
  \ 这是第一个分数的分母\n    do {\n        piPrevious = pi;   // 保留上一次的 pi\n        pi += sign\
  \ * 4 / (double)denom;   通过加上分数（项）计算新的 pi\n        sign = -sign;   // 为下一个分数准备符号\n\
  \        denom += 2;     // 为下一个分数准备分母\n    } while (Math.abs(pi - piPrevious) >\
  \ ACCURACY); // 是否“足够近”？\n    System.out.println(\"Pi ~= \" + pi);\n}\n```\n\n![](img/notice.jpg)\
  \ 注意变量 `sign` 在每次迭代中在 `-1` 和 `+1` 值之间切换的方式。\n\n如果你减小常量 `ACCURACY` 的值，`π` 将计算得精确。取决于你计算机的速度，你可以很快地计算出\
  \ `π` 的前五位。然而，计算后续每个 `π` 位的时间呈指数级增长。使用这种方法在现代计算机上计算 40 位 `π` 可能需要多年时间！\n\n## 练习\
  \ 30.5-9 用分数近似实数\n\n编写一个 Java 程序，提示用户输入 0 到 100 之间的实数，并找到最佳 `n/m`，其中 `n` 和 `m` 在\
  \ 0 到 100 之间。\n\n##### 解决方案\n\n解决方案很简单：使用嵌套循环遍历 `n` 和 `m` 的所有可能值，并检查哪个 `n/m` 最接近输入值。\n\
  \n```java\nProject_30.5-9\npublic static void main(String[] args) throws Exception\
  \ {\n    double x, y, minimum;\n    int bestN, bestM, n, m;\n    do {\n        System.out.print(\"\
  Enter a real between 0 and 100: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \    } while (x < 0 || x > 100);\n    bestN = 1;\n    bestM = 1;\n    minimum =\
  \ 100;\n    for (n = 0; n <= 100; n++) {\n        for (m = 1; m <= 100; m++) {\n\
  \            y = Math.abs(n /(double)m - x);\n            if (y < minimum) {\n \
  \               minimum = y;\n                bestN = n;\n                bestM\
  \ = m;\n            }\n        }\n    }\n    System.out.println(\"分数是: \" + bestN\
  \ + \" / \" + bestM);\n}\n```\n\n![](img/notice.jpg) 将变量 `m` 转换为 `double` 类型可以欺骗\
  \ Java 并执行普通除法（返回实数的除法）。如果你省略了 `(double)` 转换运算符，由于被除数除数都是 `int`，Java 将执行整数除法并产生错误结果。\n\
  \n## 30.6 循环控制结构的一般练习\n\n### 练习 30.6-1 华氏度转开氏度，从 0 到 100\n\n编写一个 Java 程序，显示从 0 到\
  \ 100 的华氏度及其对应的开氏度。使用 0.5 的增量。已知 `1.8 · Kelvin = Fahrenheit + 459.67`\n\n##### 解决方案\n\
  \n该公式求解得开氏度变为\n\n![Image](img/chapter30-16.png)\n\n你只需要一个 for 循环，以 0.5 的偏移量将变量 `fahrenheit`\
  \ 的值从 0 增加到 100。解决方案如下。\n\n\n\n\n\n![](img/my_exercise_header.png) 项目 _30.6-1\n\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    double fahrenheit,\
  \ kelvin;\n    for (fahrenheit = 0; fahrenheit <= 100; fahrenheit += 0.5) {\n  \
  \      kelvin = (fahrenheit + 459.67) / 1.8;\n        System.out.println(\"Fahrenheit:\
  \ \" + fahrenheit + \" Kelvin: \" + kelvin);\n    }\n}\n```\n\n## 练习 30.6-2 棋盘上的米粒\n\
  \n有一个关于穷人发明象棋的传说。印度国王对这个新游戏非常满意，于是提议送给那个穷人他想要的任何东西。那个贫穷但聪明的人告诉国王，他想要棋盘上第一个格子上有一粒米，第二个格子上有两粒，第三个格子上有四粒，以此类推，棋盘上的\
  \ 64 个格子每一个格子的米粒都翻倍。国王认为这是一个非常谦虚的要求，于是命令仆人去拿米。\n\n编写一个 Java 程序，计算并显示棋盘上最后将有多少粒米，以及多少磅米。假设一磅米大约包含\
  \ 30,000 粒米。\n\n##### 解决方案\n\n假设棋盘只有 `2 × 2 = 4` 个格子，且变量 `grains` 被赋予的初始值为 `1`（这是第\
  \ `1st` 个格子的米粒数）。一个迭代三次的 for 循环可以在每次迭代中将变量 `grains` 的值翻倍，如下代码所示。\n\n```java\ngrains\
  \ = 1;\nfor (i = 2; i <= 4; i++) {\n    grains = 2 * grains;\n}\n```\n\n变量 `grains`\
  \ 在每次迭代结束时的值如表所示。\n\n| 迭代 | grains 的值 |\n| --- | --- |\n| 第 1 次 | 2 × 1 = 2 |\n\
  | 第 2 次 | 2 × 2 = 4 |\n| 第 3 次 | 2 × 4 = 8 |\n\n在第 `3rd` 次迭代结束，变量 `grains` 包含 `8`。这个值并不是棋盘上的米粒总数，而仅仅是第\
  \ `4th` 个格子上的米粒。如果你需要找到棋盘上的米粒总数，可以汇总所有格子的米粒，即 `1 + 2 + 4 + 8 = 15`。\n\n在现实世界中，真正的棋盘包含\
  \ `8 × 8 = 64` 个格子，因此你需要迭代 63 次。该 Java 程序如下。\n\n![](img/my_exercise_header.png)\
  \ 项目 _30.6-2\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int i;\n    double grains, total, weight;\n    grains = 1;\n    total =\
  \ 1;\n    for (i = 2; i <= 64; i++) {\n        grains = 2 * grains;\n        total\
  \ = total + grains;\n    }\n    weight = total / 30000;\n    System.out.println(total\
  \ + \"  \" + weight);\n}\n```\n\n如果你好奇这些数字有多大，这里是你的答案：棋盘上将会有 `18,446,744,073,709,551,615`\
  \ 粒米；即 `614,891,469,123,651.8` 磅！\n\n## 练习 30.6-3 民意调查\n\n一家民意调查公司询问 1000 名市民早上是否吃早餐。编写一个\
