  \ 1);\n            System.out.println(y);\n        } else {\n            System.out.println(\"\
  Invalid value\");\n        }\n    } else if (x > 0 && x <= 6) {\n        y = 40\
  \ * x / (x - 8);\n        System.out.println(y);\n    } else if (x > 6 && x <= 20)\
  \ {\n        if (x != 9) {\n            y = 3 * x / (x - 9);\n            System.out.println(y);\n\
  \        } else {\n            System.out.println(\"Invalid value\");\n        }\n\
  \    } else {\n        y = Math.abs(x);\n        System.out.println(y);\n    }\n\
  }\n```\n\n如果你想知道是否可以所有的 `System.out.println(y)` 语句并改为在程序末尾使用单一的 `System.out.println(y)`\
  \ 语句，答案是“否”。因为存在不包含该语句的路径，你必须在每个要求的路径中包含它。但是通过对代码进行微调并在开头检查无效值，你可以有机会将 `System.out.println(y)`\
  \ 语句移动到所有路径的末尾。修改后的 Java 程序所示。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {\n    double x, y;\n    System.out.print(\"Enter a value for\
  \ x: \");\n    x = Double.parseDouble(cin.nextLine());\n    if (x == -1 || x ==\
  \ 9) {\n        System.out.println(\"Invalid value\");\n    } else {\n        if\
  \ (x > -5 && x <= 0) {\n            y = x / (x - 3) + (8 + x) / (x + 1);\n     \
  \   } else if (x > 0 && x <= 6) {\n            y = 40 * x / (x - 8);\n        }\
  \ else if (x > 6 && x <= 20) {\n            y = 3 * x / (x - 9);\n        } else\
  \ {\n            y = Math.abs(x);\n        }\n        System.out.println(y);\n \
  \   }\n}\n```\n\n现在，你可能在想带下划线的布尔表达式是多余的，对吧？假设你确实删除了它们，并且用户为 `x` 输入了值 `-20`。执行流将到达布尔表达式\
  \ `x <= 0`，该表达式将求值为真。这意味着将计算分式 ![Image](img/chapter23-21.png)而不是 `x` 的绝对值。\n\n为了能够删除带下划线的布尔表达式，你需要对代码进行微调。这里的关键是首先检查\
  \ `x` 的绝对值情况。随后，你可以在下面找到建议的解决方案。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {\n    double x, y;\n    System.out.print(\"Enter a value for\
