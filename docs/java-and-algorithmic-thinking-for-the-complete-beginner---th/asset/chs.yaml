  \ 方法\n\n字段是直接声明在类中的变量。然而，面向对象编程的原则规定类的数据应该是隐藏的并且防止意外修改。想象一下有一天你将编写其他程序员使用的类。因此，你不希望他们知道类内部的情况！通过不暴露字段，你可以隐藏类的内部实现。字段应该对类保持私有，并通过\
  \ `get` 和 `set` 方法访问。\n\n![](img/notice.jpg)通常，程序员应该只对具有 `private` 或 `protected`\
  \ 权限的数据使用字段。在 Java 中，你可以使用特殊关键字 `private` 或 `protected` 设置字段（或方法）。\n\n让我们通过一个示例来尝试理解这些新内容。假设你编写了以下类，将华氏温度转换为相应的摄氏度。\n\
  \n![](img/my_exercise_header.png) 39.5a\n```java\nclass FahrenheitToCelsius {\n\
  \    private double temperature;\n    //定义构造函数\n    public FahrenheitToCelsius(double\
  \ value) {\n        this.temperature = value;  //字段初始化\n    }\n    //此方法获取温度\n \
  \   public double getTemperature() {\n        return 5.0 / 9.0 * (this.temperature\
  \ - 32.0);\n    }\n}\n\npublic class App {\n    public static void main(String[]\
  \ args) throws Exception {\n        FahrenheitToCelsius x = new FahrenheitToCelsius(-68);\
  \ //创建对象 x\n        System.out.println(x.getTemperature());\n    }\n}\n```\n\n这个类几乎完美，但有一个主要的缺点。它没有考虑到温度不能低于\
  \ -459.67 华氏度（-273.15 摄氏度）。这个温度被称为绝对零度。因此，一个使用你的类且对物理学一无所知的新手程序员，可能会向构造函数传递 -500\
  \ 华氏度的值，如下面的代码片段所示\n\n```java\nFahrenheitToCelsius x = new FahrenheitToCelsius(-500);\n\
  System.out.println(x.getTemperature());\n```\n\n\n\n\n尽管程序可以完美运行并显示 $-295.55$ 摄氏度的值，遗憾的是，这个温度在整个宇宙中是不存在的！因此，该类的一个稍微不同的版本可能部分解决这个问题。\n\
  \n![](img/my_exercise_header.png) 项目 _39.5b\n\n```java\nclass FahrenheitToCelsius\
  \ {\n    public double temperature;\n    //定义构造函数\n    public FahrenheitToCelsius(double\
  \ value) throws Exception {\n        this.setTemperature(value);   //使用方法设置字段 temperature\
  \ 的值\n    }\n\n    //此方法获取温度\n    public double getTemperature() {\n        return\
  \ 5.0 / 9.0 * (this.temperature - 32.0);\n    }\n\n    //此方法设置温度\n    public void\
  \ setTemperature(double value) throws Exception {\n        if (value >= -459.67)\
  \ {\n            this.temperature = value;\n        }\n        else {\n        \
  \    throw new Exception(\"There is no temperature below -459.67\");\n        }\n\
  \    }\n}\n\npublic class App {\n    public static void main(String[] args) throws\
  \ Exception {\n        FahrenheitToCelsius x = new FahrenheitToCelsius(-500);  //创建对象\
  \ x\n        System.out.println(x.getTemperature());\n    }\n}\n```\n\n![](img/notice.jpg)\
  \ `throw` 语句强制程序抛出一个异常（运行时错误），导致执行流停止。\n\n这次，使用了一个名为 `setTemperature()` 的方法来设置字段\
  \ `temperature` 的值。这种方法更好，但并不完美，因为程序员必须小心，并始终记住在每次想要更改字段 `temperature` 的值时都使用这个方法。问题是，字段\
  \ `temperature` 的值仍然可以通过其名称直接更改，如下面的代码片段所示。\n\n```java\nFahrenheitToCelsius x =\
  \ new FahrenheitToCelsius(-50);  //创建对象 x\nSystem.out.println(x.getTemperature());\n\
  x.setTemperature(-65);      //这是可以的！\nSystem.out.println(x.getTemperature());\n\
  x.temperature = -500;       //遗憾的是，这仍然被允许！\nSystem.out.println(x.getTemperature());\n\
  ```\n\n如果你将字段 `temperature` 声明为 `private`，这个问题就可以被完全解决！当一个字段被声明为 `private` 时，调用者（此处是对象\
  \ `x`）无法直接访问该字段，如下面的 Java 程序所示。\n\n![](img/my_exercise_header.png) 项目 _39.5c\n\n\
  ```java\nclass FahrenheitToCelsius {\n    private double _temperature;  //将字段 temperature\
  \ 声明为私\n    //定义构造函数\n    public FahrenheitToCelsius(double value) throws Exception\
  \ {\n        this.setTemperature(value);   //调用 setter\n    }\n\n    //此方法获取温度\n\
  \    public double getTemperature() {\n        return 5.0 / 9.0 * (this._temperature\
  \ - 32.0);\n    }\n\n    //此方法设置温度\n    public void setTemperature(double value)\
  \ throws Exception {\n        if (value >= -459.67) {\n            this._temperature\
  \ = value;\n        }\n        else {\n            throw new Exception(\"There is\
  \ no temperature below -459.67\");\n        }\n    }\n}\n\npublic class App {\n\
  \    public static void main(String[] args) throws Exception {\n        FahrenheitToCelsius\
  \ x = new FahrenheitToCelsius(-50);  //创建对象 x. 这调用了\n        // //构造函数，\n      \
  \  // //反而又调用了 setter。\n        System.out.println(x.getTemperature());  //这调用了\
  \ getter。\n        x.setTemperature(-65);                   //这调用了 setter。\n   \
  \     System.out.println(x.getTemperature());  //这调用了 getter。\n        x._temperature\
  \ = -50;                    //这是不允许的！\n        System.out.println(x._temperature);\
  \      //这也不允许！\n    }\n}\n```\n\n![](img/notice.jpg)许多程序员倾向于在私有字段前加上下划线 (`_`)。\n\
  \n#### 练习 39.5-1 罗马数字\n\n罗马数字如下所示。\n\n| 数字 | 罗马数字 |\n| --- | --- |\n| 1 | I |\n\
  | 2 | II |\n| 3 | III |\n| 4 | IV |\n| 5 | V |\n\n执行以下操作：\n\nii) 编写一个名为 `Romans`\
  \ 的类，其中包含：\na) 一个名为 `_number` 的整数整数字段。\nb) 分别名为 `getNumber` 和 `setNumber` 的 getter\
  \ 和 setter 方法。它们将用于以整数格式获取和设置字段 `_number` 的值。当数字无法被识别时，setter 方法必须抛出一个错误。\nc) 分别名为\
  \ `getRoman` 和 `setRoman` 的 getter 和 setter 方法。它们将用于以罗马数字格式获取和设置字段 `_number` 的值。当罗马数字无法被识别时，setter\
  \ 方法必须抛出一个错误。\niii) 使用上述类编写一个 Java 程序，显示与数值 3 对应的罗马数字，以及与罗马数字值“V”对应的数字。\n\n#####\
  \ 解决方案\n\n整数格式字段 `_number` 的 getter 和 setter 方法非常简单，因此没有什么特别需要解释的。然而，罗马数字格式字段 `_number`\
  \ 的 getter 和 setter 方法需要解释。\n\n罗马数字格式的字段 `_number` 的 getter 方法可以写为：\n\n```java\n\
  //定义 getter\npublic String getRoman() {\n    String retValue = \"\";\n    if (this._number\
  \ == 1) retValue = \"I\";\n    else if (this._number == 2) retValue = \"II\";\n\
  \    else if (this._number == 3) retValue = \"III\";\n    else if (this._number\
  \ == 4) retValue = \"IV\";\n    else if (this._number == 5) retValue = \"V\";\n\
  \    return retValue;\n}\n```\n\n由于你现在了解了 `hashmap`，你可以使用更好的方法，如代码片段所示：\n\n```java\n\
  //定义 getter\npublic String getRoman() {\n    HashMap<Integer, String> number2roman\
  \ = new HashMap<>(\n        Map.of(1, \"I\", 2, \"II\", 3, \"III\", 4, \"IV\", 5,\
  \ \"V\")\n    );\n    return number2roman.get(this._number);\n}\n```\n\n相应，setter\
  \ 方法如下：\n\n```java\n//定义 setter\npublic void setRoman(String key) throws Exception\
  \ {\n    HashMap<String, Integer> roman2number = new HashMap<>(\n        Map.of(\"\
  I\", 1, \"II\", 2, \"III\", 3, \"IV\", 4, \"V\", 5)\n    );\n    if (roman2number.containsKey(key))\
  \ {\n        this._number = roman2number.get(key);\n    }\n    else {\n        throw\
  \ new Exception(\"Roman numeral not recognized\");\n    }\n}\n```\n\n![](img/notice.jpg)Java\
  \ 内置方法 `containsKey(key_name)` 当 `hashmap` 结构包含指定的 `key_name` 时返回 `true`。\n\n语句\
  \ `if (roman2number.containsKey(key))` 等同于 `if (roman2number.containsKey(key) ==\
  \ true)`。\n\n最终的 Java 程序如下\n\n![](img/my_exercise_header.png) 项目 _39.5-1\n\n```java\n\
  class Romans {\n    private int _number;\n    //定义 getter\n    public int getNumber()\
  \ {\n        return _number;\n    }\n    //定义 setter\n    public void setNumber(int\
  \ value) throws Exception {\n        if (value >= 1 && value <= 5) {\n         \
  \   this._number = value;\n        }\n        else {\n            throw new Exception(\"\
  Number not recognized\");\n        }\n    }\n    //定义 getter\n    public String\
  \ getRoman() {\n        HashMap<Integer, String> number2roman = new HashMap<>(\n\
  \            Map.of(1, \"I\", 2, \"II\", 3, \"III\", 4, \"IV\", 5, \"V\")\n    \
  \    );\n        return number2roman.get(this._number);\n    }\n    //定义 setter\n\
  \    public void setRoman(String key) throws Exception {\n        HashMap<String,\
  \ Integer> roman2number = new HashMap<>(\n            Map.of(\"I\", 1, \"II\", 2,\
  \ \"III\", 3, \"IV\", 4, \"V\", 5)\n        );\n        if (roman2number.containsKey(key))\
  \ {\n            this._number = roman2number.get(key);\n        }\n        else\
  \ {\n            throw new Exception(\"Roman numeral not recognized\");\n      \
  \  }\n    }\n}\n\npublic class App {\n    public static void main(String[] args)\
  \ throws Exception {\n        Romans x = new Romans();\n        x.setNumber(3);\n\
  \        System.out.println(x.getNumber());  //显示: 3\n        System.out.println(x.getRoman());\
  \   //显示: III\n        x.setRoman(\"V\");\n        System.out.println(x.getNumber());\
  \  //显示: 5\n        System.out.println(x.getRoman());   //显示: V\n    }\n}\n```\n\
  \n### 39.6 方法可以调用同一类中的另一个方法吗？\n\n\n\n\n在节 37.2 中，你学习了子程序可以调用另一个子程序。显然，这也适用于类方法——方法可以调用同一类中的另一个方法！毕竟，方法本质上也不过子程序！所以，如果你想让一个方法调用同一类中的另一个方法，你应该在想要调用的方法前面使用\
  \ `this` 关键字（使用点表示法），如下例所示。\n\n![](img/my_exercise_header.png) Project_39.6\n\n\
  ```java\nclass JustAClass {\n    public void foo1() {\n        System.out.println(\"\
  foo1 was called\");\n        this.foo2(); //Call foo2() using dot notation\n   \
  \ }\n    public void foo2() {\n        System.out.println(\"foo2 was called\");\n\
  \    }\n}\n\npublic class App {\n    public static void main(String[] args) throws\
  \ Exception {\n        JustAClass x = new JustAClass();\n        x.foo1(); //Call\
  \ foo1() which, in turn, will call foo2()\n    }\n}\n```\n\n#### 练习 39.6-1 正在计算\n\
  \n执行以下操作：\n\ni) 编写一个名为 `DoingMath` 的类，包含：\na) 一个名为 `square` 的 private void 方法，通过形式参数列表接收一个数字，然后计算其平方并显示消息“The\
  \ square of XX is YY”，其中 `XX` 和 `YY` 必须替换为实际值。\nb) 一个名为 `squareRoot` 的 private void\
  \ 方法，通过形式参数列表接收一个数字，然后计算其平方根并显示消息“The square root of XX is YY”，其中 `XX` 和 `YY` 必须替换为实际值。但是，如果数字小于零，方法必须显示错误信息。\n\
  c) 一个名为 `displayResults` 的 public void 方法，通过形式参数列表接收一个数字，然后调用 `square()` 和 `squareRoot()`\
  \ 方法显示结果。\nii) 使用上述类编写一个 Java 程序，提示用户输入一个数字。程序必须显示该数字的平方和平方根。\n\n##### 答案\n\n这个练习非常简单。`square()`、`squareRoot()`\
  \ 和 `displayResults()` 方法必须在它们的形式参数列表中包含一个形式参数，以便接收传递的值。解决方案如下。\n\n![](img/my_exercise_header.png)\
  \ Project_39.6-1\n\n```java\nclass DoingMath {\n    private void square(double x)\
  \ { //Argument x accepts passed value\n        System.out.println(\"The square of\
  \ \" + x + \" is \" + (x * x));\n    }\n    private void squareRoot(double x) {\
  \ //Argument x accepts passed value\n        if (x < 0) {\n            System.out.println(\"\
  Cannot calculate square root\");\n        } else {\n            System.out.println(\"\
  Square root of \" + x + \" is \" + Math.sqrt(x));\n        }\n    }\n    public\
  \ void displayResults(double x) { //Argument x accepts passed value\n        this.square(x);\n\
  \        this.squareRoot(x);\n    }\n}\n\npublic class App {\n    static Scanner\
  \ cin = new Scanner(System.in);\n    public static void main(String[] args) throws\
  \ Exception {\n        double b;\n        DoingMath dm = new DoingMath();\n    \
  \    System.out.println(\"Enter a number: \");\n        b = Double.parseDouble(cin.nextLine());\n\
  \        dm.displayResults(b);\n    }\n}\n```\n\n### 39.7 继承\n\n类继承是 OOP 概念之一。它允许一个类使用另一个类作为基类。当一个类继承自另一个类时，第一个类被称为基类，第二个类被称为子类。子类可以使用\
  \ `super` 关键字来调用基类的方法或构造函数。这允许了代码重用和层级关系的创建。子类还可以重写基类的方法。（注意：本节提供的源代码文本重复且混乱；核心概念是继承允许子类继承基类）。\n\
  \n\n\n\n```java\nSystem.out.println(\"Salary: \" + this.salary);\n```\n\n// 定义类\
  \ Student。它继承了 SchoolMember 类。\n```public class Student extends SchoolMember {\n\
  \    public String finalGrade; // 这是该类的一个额外字段\n\n    // 定义构造函数\n    public Student(String\
  \ name, int age, String finalGrade) {\n        super(name, age); // 调用 SchoolMember\
  \ 类的构造函数\n        this.finalGrade = finalGrade;\n        System.out.println(\"A\
  \ student was initialized\");\n    }\n\n    // 这是该类的一个额外方法\n    public void displayValues()\
  \ {\n        System.out.println(\"Name: \" + this.name);\n        System.out.println(\"\
  Age: \" + this.age);\n        System.out.println(\"Salary: \" + this.finalGrade);\n\
  \    }\n}\n\npublic class App {\n    public static void main(String[] args) throws\
  \ Exception {\n        Teacher teacher1 = new Teacher(\"Mr. John Scott\", 43, 35000);\n\
  \        Teacher teacher2 = new Teacher(\"Mrs. Ann Carter\", 5, 32000);\n      \
  \  Student student1 = new Student(\"Mark Nelson\", 14, \"A\");\n        Student\
  \ student2 = new Student(\"Mary Morgan\", 13, \"B\");\n        teacher1.displayValues();\n\
