  \ `.println(s)` | 显示值 65，这当然是乘法结果 5 × 13 的结果 | | | |\n\n#### 练习 30.5-4 寻找约数个数\n\n\
  编写一个 Java 程序，让用户输入一个正整数，然后显示它的约数总数。\n\n##### 解决方案\n\n让我们来看一些例子。\n\n- 值 12 的约数是数字\
