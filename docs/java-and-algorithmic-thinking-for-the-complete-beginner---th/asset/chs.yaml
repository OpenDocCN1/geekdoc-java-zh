  关于带循环控制结构的流程图更多内容\n\n## 28.1 引言\n\n通过对前面章节的学习，你已经熟悉了所有的循环控制结构。由于流程图是学习“算法思维”以及帮助你更好地理解特定控制结构的理想方式，本章将教你如何将一个\
  \ Java 程序转换为流程图，以及如何将流程图转换为 Java 程序。\n\n## 28.2 将 Java 程序转换为流程图\n\n要将 Java 程序转换为流程图，你需要回想起所有的循环控制结构及其对应的流程图。下面是它们的总结。\n\
