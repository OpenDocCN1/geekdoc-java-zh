  \n(由于原始文本中存在大量重复的说明文字，译文已根据核心逻辑进行整合翻译)\n\n\n\n\n\n```java\n}\n\nj--;\n\n} // 如果变量\
  \ palindrome 仍然为 true\nif (palindrome) {\n    System.out.println(\"The message is\
  \ palindrome\");\n}\n```\n\n## 第二种方法\n\n之前的方法可以正常工作，但假设用户输入了一个非常长且不是回文句子；例如，它的第二个字母与最后一个字母不同。遗憾的是，在之前的方法中，尽管变量\
  \ `palindrome` 从第二次迭代开始就已经被设置为 `false`，但最后一个 `for` 循环仍会继续迭代到句子的中间。因此，让我们尝试让这个程序变得更好。正如你所知道的，你可以使用\
  \ `break` 语句在循环完成所有迭代之前跳出循环。\n\n此外，由于只有四种不同的字符需要被删除（空格、逗号、句号和问号），你只需要通过链式调用四个 `replace()`\
  \ 方法就可以避免第一个循环，如下所示的 Java 程序所示。\n\n![](img/my_exercise_header.png)  Project_30.6-4b\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int i,\
  \ middlePos, j;\n    String message, messageClean;\n    boolean palindrome;\n  \
  \  System.out.print(\"Enter a message: \");\n    message = cin.nextLine().toLowerCase();\n\
  \    // 创建一个新字符串，包含除空格、逗号、句号和问号以外的所有字符\n    messageClean = message.replace(\"  \"\
  , \"\").replace(\",\", \"\").replace(\".\", \"\").replace(\"?\", \"\");\n    j =\
  \ messageClean.length() - 1;\n    middlePos = (int)(j / 2);\n    palindrome = true;\n\
  \    for (i = 0; i <= middlePos; i++) {\n        if (messageClean.charAt(i) != messageClean.charAt(j))\
  \ {\n            palindrome = false;\n            break;\n        }\n        j--;\n\
  \    }\n    if (palindrome) {\n        System.out.println(\"The message is palindrome\"\
  );\n    }\n}\n```\n\n![](img/notice.jpg) 而而易见，一个问题有很多解决方案。找到最优取决于你自己！\n\n![](img/notice.jpg)\
