  }//显示所有大于 89 的值\nfor (i = 0; i <= STUDENTS - 1; i++) {\n\n> if (average[i] > 89)\
  \ {\n\n> > System.out.println(average[i]);\n\n}\n}}\n\n###### 第二种方法——直接查找并显示\n\n\
  这种方法不使用辅助数组；它只是计算并显示所有大于 89 的值。Java 程序如下。\n\nProject_33.2-1\nstatic final int STUDENTS\
