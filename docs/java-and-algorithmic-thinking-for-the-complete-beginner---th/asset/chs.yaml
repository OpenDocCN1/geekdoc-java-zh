  \ (values[i] % 2 == 0) {\n            System.out.println(values[i]);\n        }\n\
  \    }\n}\n```\n\n### 31.8 什么是 HashMap？\n\n在计算机科学中，hashmap 和数组之间的主要区别是 hashmap 元素可以使用键（key）唯一标识，而不一定非是整数值。hashmap\
  \ 的每个键与一个元素关联（或者如果你愿意，称为映射）。hashmap 的键可以是 `String`、`int`、`double` 等类型。\n\n接下来的示例展示了一个存储家族姓名的\
  \ hashmap。该 hashmap 的名为 `family`，对应的键写在每个元素上方。\n\n![Image](img/chapter31-10.png)\n\
  \n![](img/notice.jpg)hashmap 元素的键在 hashmap 内部必须是唯一的。这意味着在 `family` hashmap 中，例如，你不能有两个名为\
  \ `father` 的键。\n\n![](img/notice.jpg)hashmap 元素的值可以是任何类型。\n\n### 31.9 在 Java 中创建\
  \ HashMaps\n\n让我们尝试使用最常用的方法创建以下 hashmap。\n\n![Image](img/chapter31-11.png)\n\n#####\
  \ 第一种方法\n\n要创建一个 hashmap 并直接向其元素赋值，可以使用下面通用形式所示的 Java 语句：\n\n`HashMap<key_type,\
  \ value_type> hashmap_name = new HashMap<>(Map.of(key0, value0, key1, value1, key2,\
  \ value2, … keyM, valueM));`\n\n其中\n\n- `key_type` 是键的类型。它可以是 `String`、`Integer`、`Double`\
  \ 等。\n- `value_type` 是元素的类型。它可以是 `String`、`Integer`、`Double` 等。\n- `hashmap_name`\
  \ 是 hashmap 的名称。\n- `key0`, `key1`, `key2`, … , `keyM` 是 hashmap 元素的键。\n- `value0`,\
  \ `value1`, `value2`, … , `valueM` 是 hashmap 元素的值。\n\n使用这种方法，可以使用以下语句创建 `pupil`\
  \ hashmap：\n\n`HashMap<String, String> pupil = new HashMap<>(Map.of(\"firstName\"\
  , \"Ann\", \"lastName\", \"Fox\", \"age\", \"8\", \"class\", \"2nd\"));`\n\n![](img/notice.jpg)`Map.of()`\
  \ 方法是在 Java 9.0 中首次引入的。它支持最多 10 个键值对。\n\n![](img/notice.jpg)在 第 5.4 节 中，你学习了在为变量命名时必须遵循的规则。为\
  \ hashmap 命名也遵循完全相同的规则！\n\n![](img/notice.jpg)为了在项目中使用 `HashMap` 和 `Map` 类，你需要在项目开头使用\
  \ `import java.util.HashMap` 和 `import java.util.Map` 语句导入相应的库。你将在 第八部分 中学习更多关于类和对象的知识。\n\
  \n##### 第二种方法\n\n在这种方法中，你可以可以使用通用形式所示的语句创建一个完全空的 hashmap：\n\n`HashMap<key_type,\
  \ value_type> hashmap_name = new HashMap<>();`\n\n然后按照下面通用形式所示的 Java 语句添加一个元素（键值对）：\n\
  \n`hashmap_name.put(key, value);`\n\n使用这种方法，可以使用以下语句创建 `pupil` hashmap：\n\n```java\n\
  HashMap<String, String> pupil = new HashMap<>();\npupil.put(\"firstName\", \"Ann\"\
