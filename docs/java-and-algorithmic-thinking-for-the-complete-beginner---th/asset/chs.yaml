  \n```java\nstatic final int ELEMENTS = 100;\nstatic int dice() {\n    return 1 +\
  \ (int)(Math.random() * 5);\n}\nstatic int searchAndCount(int x, int[] a) {\n  \
  \  int count = 0;\n    int i;\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n     \
  \   if (a[i] == x) {\n            count++;\n        }\n    }\n    return count;\n\
  }\npublic static void main(String[] args) throws Exception {\n    int i, maximum,\
  \ maxI;\n    // 创建 1 到 6 之间的随机整数数组 a\n    int[] a = new int[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = dice();\n    }\n    // 创建数组\
  \ n 并显示六个数字在数组 a 中各出现的次数\n    int[] n = new int[6];\n    for (i = 0; i <= 5; i++)\
  \ {\n        n[i] = searchAndCount(i + 1, a);\n        System.out.println(\"Value\
  \ \" + (i + 1) + \" appears \" + n[i] + \" times\");\n    }\n    // 找到数组 n 的最大值\n\
  \    maximum = n[0];\n    maxI = 0;\n    for (i = 1; i <= 5; i++) {\n        if\
  \ (n[i] > maximum) {\n            maximum = n[i];\n            maxI = i;\n     \
  \   }\n    }\n    // 显示哪个数字在数组中出现频率最高。\n    System.out.println(\"Value \" + (maxI\
  \ + 1) + \" appears in the array \" + maximum + \" times.\");\n}\n```\n\n### 38.3\
