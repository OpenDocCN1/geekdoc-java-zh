  \ 方法可以确保程序能够找到所有的“John”约翰。\n\n### 练习 34.5-3 线性搜索算法 – 在可能包含多个相同值的二维数组中进行搜索\n\n编写一个代码片段，对一个二维数组的每一行进行搜索，以找到用户提供的值。假设该数组包含数值，并且可能包含多个相同的值。请使用线性搜索算法。\n\
