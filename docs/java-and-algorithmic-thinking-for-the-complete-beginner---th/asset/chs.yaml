  \ 结构\n\ncase 结构是多分支决策结构的简化版本。对于需要复杂的算法，它可以帮助更快地编写代码并提高可读性。case 语句的通用形式如下：\n\n```java\n\
  switch (变量或要求值的表达式) {\n    case 值-1:\n        语句或语句块 1\n        break;\n    case\
  \ 值-2:\n        语句或语句块 2\n        break;\n    case 值-3:\n        语句或语句块 3\n    \
  \    break;\n    ...\n    case 值-N:\n        语句或语句块 N\n        break;\n    default:\n\
  \        语句或语句块 N + 1\n}\n```\n\n最后一个语句或语句块 `N+1` 是可选的，可以省略（你也需要省略 `default` 关键字）。\n\
  \n为了避免意外的结果，记住在每个 case 结尾始终包含 `break` 关键字。如果你省略了它，实际上会执行两个语句：省略 `break` 的当前语句，以及下一个语句。\n\
  \n注意在 Java 中，`switch`语句只适用于某些数据类型，如 `byte`、`short`、`int`、`char` 或 `String`。\n\n\
  你不能总是用 case 结构来代替多分支决策结构。在 case 结构中，求值的变量或表达式只写一次，这意味着该变量或表达式在所有 case 中都被求值。而在多分支决策结构中，求值的变量或表达式在每个\
  \ case 中可以是不同的。\n\n这里使用了 case 结构的示例：\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String name;\n    System.out.print(\"What is your\
  \ name? \");\n    name = cin.nextLine();\n    switch (name) {\n        case \"John\"\
  :\n            System.out.println(\"You are my cousin!\");\n            break;\n\
  \        case \"Aphrodite\":\n            System.out.println(\"You are my sister!\"\
  );\n            break;\n        case \"Loukia\":\n```\n\n\n\n\n\n```java\nSystem.out.println(\"\
  You are my mom!\");\n\nbreak;\n\ndefault:\nSystem.out.println(\"Sorry, I don't know\
  \ you.\");\n```\n```java\n}}\n\n#### 练习 19.1-1 星期几\n\n编写一个 Java 程序，提示用户输入一个 1 到\
