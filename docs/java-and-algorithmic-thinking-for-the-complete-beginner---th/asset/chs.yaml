  \n编写一个 Java 程序，让用户输入 10 个不同城市在 1 月份每天同一小时记录的温度（华氏度）。该 Java 程序必须显示最低温度。\n\n#####\
  \ 解决方案\n\n在本次练习中，你需要以下数组。\n\n![Image](img/chapter34-06.png)\n\n![](img/notice.jpg)数组\
  \ `t` 有 31 列（0 到 30），与 1 月份的天数相同。\n\n这里这里没有新内容。变量 `minimum` 的初始值可以是元素 `t[0][0]`\
  \ 的值。然后，程序可以遍历行，甚至遍历列，来搜索最小值。解决方案如下。\n\n![](img/my_exercise_header.png) Project_34.3-5\n\
  ```java\nstatic final int CITIES = 10;\nstatic final int DAYS = 31;\npublic static\
  \ void main(String[] args) throws Exception {\n    int i, j, minimum;\n    //Read\
  \ array\n    int[][] t = new int[CITIES][DAYS];\n    for (i = 0; i <= CITIES - 1;\
  \ i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n            t[i][j] = Integer.parseInt(cin.nextLine());\n\
  \        }\n    }\n    //Find minimum\n    minimum = t[0][0];\n    for (i = 0; i\
  \ <= CITIES - 1; i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n           \
  \ if (t[i][j] < minimum) {\n                minimum = t[i][j];\n            }\n\
  \        }\n    }\n    System.out.println(minimum);\n}\n```\n\n![](img/notice.jpg)在本次练习中你不能执行以下操作，因为如果你这样做，且变量\
  \ `j` 从 1 开始，那么索引为 0 的整列将不会被检查！\n\n```java\n//Find minimum\nminimum = t[0][0];\n\
  for (i = 0; i <= CITIES - 1; i++) {\n    for (j = 1; j <= DAYS - 1; j++) { //This\
  \ is wrong! Variable j must start from 0\n        if (t[i][j] < minimum) {\n   \
  \         minimum = t[i][j];\n        }\n    }\n}\n```\n\n### 练习 34.3-6 寻找最冷天的城市\n\
  \n编写一个 Java 程序，让用户输入 10 个城市的名称，以及这些城市在 1 月份每天同一小时记录的温度（华氏度）。该 Java 程序必须显示具有温度最低的城市名称以及记录该温度的日期。\n\
  \n##### 解决方案\n\n在本次练习中，需要以下两个数组。\n\n![Image](img/chapter34-07.png)\n\n解决方案很简单。每当变量\
  \ `minimum` 更新其值时，两个变量 `m_i` 和 `m_j` 就可以分别保存变量 `i` 和 `j` 的当前值。最后，这两个变量将包含最小值所在位置的行索引和列索引。解决方案如下。\n\
  \n![](img/my_exercise_header.png) Project_34.3-6\n```java\nstatic final int CITIES\
  \ = 10;\nstatic final int DAYS = 31;\npublic static void main(String[] args) throws\
