  ### 练习 34.5-7 检查值是否存在于所有列中\n\n编写一个 Java 程序，让用户在一个 20 × 30 的数组中输入数值。在输入完所有值后，程序将让用户输入一个值。最后，如果用户提供的值在数组的每一列中至少出现一次，则必须显示消息。\n\
  \n##### 解决方案\n\n此练习可以使用线性搜索算法和计数变量 `count` 来解决。Java 程序将遍历第一列；如果找到了用户提供的值，Java 程序必须随后停止在第一列中搜索，并且变量\
  \ `count` 加 1。然后，程序将遍历第二列；如果再次找到用户提供的值，Java 程序必须停止在第二列中搜索，变量 `count` 再次加 1。此过程必须重复，直到检查完所有列。在过程结束时，如果\
  \ `count` 的值等于列的总数，则这意味着用户提供的值在数组的每一列中至少存在一次。\n\n让我们使用“从内到外”的方法。以下代码段在数组的第一列（列索引为\
  \ 0）中搜索，如果找到了用户提供的值，执行流将退出 for 循环且变量 `count` 加 1。假设变量 `j` 包含值 0。\n\n```java\nfound\
  \ = false;\nfor (i = 0; i <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle)\
  \ {\n        found = true;\n        break;\n    }\n}\nif (found) {\n    count++;\n\
  }\n```\n\n现在你可以将此代码段嵌套在一个遍历所有列的 for 循环中。以下代码段在数组的第一列中搜索，如果找到了用户提供的值，执行流将退出 for 循环且变量\
  \ `count` 加 1。假设变量 `j` 包含值 0。\n\n```java\n//（此处为逻辑重复，如上所示）\nfound = false;\nfor\
  \ (i = 0; i <= ROWS - 1; i++) {\n    if (haystack[i][j] == needle) {\n        found\
  \ = true;\n        break;\n    }\n}\nif (found) {\n    count++;\n}\n```\n\n现在你可以将此代码段嵌套在一个遍历所有列的\
  \ for 循环中。\n\n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n\
  \            found = true;\n            break;\n        }\n    }\n    if (found)\
  \ {\n        count++;\n    }\n}\n```\n\n你已经准备好了，但请考虑一个小细节！如果内层循环没有找到用户提供的值，外层循环也应该停止。因此，更好的方法是如下代码所示：\n\
  \n```java\nfor (j = 0; j <= COLUMNS - 1; j++) {\n    found = false;\n    for (i\
  \ = 0; i <= ROWS - 1; i++) {\n        if (haystack[i][j] == needle) {\n        \
  \    found = true;\n            break;\n        }\n    }\n    if (found) {\n   \
  \     count++;\n    } else {\n        break; // 如果在当前列未找到，则退出外层循环\n    }\n}\n```\n\
  \n### 练习 34.5-8 二分查找算法——在排序的一维数组中搜索\n\n编写一个 Java 程序，在排序的一维数组中使用二分查找算法查找给定的值。\n\n\
  ##### 解决方案\n\n二分查找算法被认为是非常快速的，适用于大数据集。但它的缺点是数据必须经过排序。\n\n二分查找算法的主要思想是首先检查数组中间的元素。如果它不匹配你寻找的“大海捞针”，算法将确定目标比中间元素大还是小。这引导搜索进入相应的半部分。也就是说，如果你寻找的“针”小于中间元素的值，这意味着“针”可能在数组的前半部分；否则它可能在后半部分。\n\
  \n困惑吗？让我们通过一个例子来分析二分查找算法。以下数组包含升序排列的数值。\n\n![Image](img/chapter34-38.png)\n\n（注：此处对应示例中的后续代码实现逻辑）\n\
  \n```java\nstatic final int ROWS = 20;\nstatic final int COLUMNS = 30;\npublic static\
  \ void main(String[] args) throws Exception {\n    int i, j, count;\n    boolean\
  \ found;\n    double needle;\n    double[][] haystack = new double[ROWS][COLUMNS];\n\
  \    // ... 省略输入逻辑 ...\n    // 二分查找逻辑实现...\n}\n```\n\n\n\n\n使用了三个变量。最初，变量 `left`\
  \ 包含值 `0`（这是第一个元素的索引），变量 `right` 包含值 `13`（这是最后一个元素的索引），变量 `middle` 包含值 `6`（这大约是中间元素的索引）。\n\
  \n![Image](img/chapter34-39.png)\n\n你正在寻找的“针”（值 `44`）大于中间的数值 `39`，因此你寻找的元素可能在数组的后半部分。因此，变量\
  \ `left` 更新为指向索引位置 `7`，变量 `middle` 更新为 `left`（新值）和 `right` 之间的中间点，如文所示。\n\n![Image](img/chapter34-40.png)\n\
  \n现在，你正在寻找的“针”（值 `44`）小于中间的数值 `57`，因此你寻找的元素可能在正在检查的数组的前半部分。因此，现在更新变量 `right` 指向索引位置\
  \ `9`，变量 `middle` 更新为指向 `left` 和 `right`（新值）之间的中间点，如文所示。\n\n![Image](img/chapter34-41.png)\n\
  \n你完成了！在索引位置 `8` 处找到了“针”，整个过程可以停止了！\n\n![](img/remember.jpg)每次失败的比较都会让剩余检查的元素数量减半！\n\
  \n![](img/notice.jpg)索引变量 `left` 和 `right` 每次分别指向正在检查的数组部分的开头和结尾。\n\n现在，让我们来看看对应的代码片段。\n\
  \n```java\nleft = 0;right = ELEMENTS - 1;found = false;while (left <= right && !found)\
  \ {\n    middle = (int)((left + right) / 2);  //这是一个除以 2 的操作\n    if (needle < haystack[middle])\
  \ {   //如果针在正在检查的数组的前半部分\n        right = middle - 1;              //更新右索引\n   \
  \ }else if (needle > haystack[middle]) {  //如果在后半部分，\n        left = middle + 1;\
  \                   //更新左索引\n    }else {\n        found = true;\n    }\n}\nif (!found)\
  \ {System.out.println(\"Nothing found!\");}else {System.out.println(needle + \"\
  \ found at position: \" + middle);}\n```\n\n![](img/notice.jpg)二分查找算法非常高效，因为每次迭代都大幅减少了搜索空间，使其对于有序数组非常有效。在示例数组上使用该算法，只需三次迭代即可找到值\
  \ `44`。相比之下，线性搜索算法对于相同的数据将需要九次迭代！\n\n![](img/notice.jpg)如果数组中包含多个相同的值，二分查找算法只能找到其中一个出现。\n\
