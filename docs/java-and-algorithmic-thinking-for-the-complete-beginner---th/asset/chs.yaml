  Indeterminate form\");\n    }\n}\n```\n\n## 23.4 连续范围练习\n\n正如你已经所所示的，在许多问题中，变量的值或表达式的结果可以定义必须执行哪条语句或语句块。在接下来的练习中，你将学习如何测试一个值或表达式的结果是否属于特定范围（由一系列连续范围组成的范围）。\n\
  \n假设你想显示一条消息，指明女性在不同温度下可能穿着的衣服类型。\n\n| 室外温度（华度） | 女性可能穿着的衣服类型 |\n| --- | --- |\n\
  | 温度 < 45 | 毛衣、外套、牛仔裤、衬衫 |\n| 45 ≤ 温度 < 65 | 毛衣、牛仔裤、外套 |\n| 65 ≤ 温度 < 75 | 七分裤、短裤、T\
  \ 恤、背心、凉鞋 |\n| 75 ≤ 温度 | 短裤、T 恤、背心、短裙、凉鞋 |\n\n乍一看，单分支决策结构似乎是逻辑上的选择。虽然没有错误，但更深入的分析显示每个条件都是相互依赖，这意味着当其中一个条件为真时，不应评估其他条件。你需要从一组可能性中仅选择一个。\n\
  \n要解决这类练习，你可以使用多分支决策结构或嵌套决策结构。然而然而后者是最好的选择，因为它更方便并增加了可读性，正如后续代码段所示。\n\n```java\n\
  if (temperature < 45) {\n    System.out.println(\"Sweater, coat, jeans, shirt, shoes\"\
  );\n} else if (temperature >= 45 && temperature < 65) {\n    System.out.println(\"\
  Sweater, jeans, jacket, shoes\");\n} else if (temperature >= 65 && temperature <\
  \ 75) {\n    System.out.println(\"Capris, shorts, t-shirt, tank top, flip flops,\
  \ athletic shoes\");\n} else if (temperature >= 75) {\n    System.out.println(\"\
  Shorts, t-shirt, tank top, skort, skirt, flip flops\");\n}\n```\n\n\n\n\n然而，仔细检查后发现，所有带有下划线的布尔表达式实际上都不是需要的。例如，如果第一个布尔表达式\
  \ `(temperature < 45)` 的求值结果为 `false`，执行流将继续评估第二个布尔表达式。然而，在这一步，由于第一个布尔表达式已经求值为 `false`，变量\
  \ `temperature` 一定大于或等于 45。因此，当布尔表达式 `temperature >= 45` 求值时，它一定为真，因此可以省略。同样的逻辑适用于所有情况；你可以省略所有带有下划线的布尔表达式。这里显示最终的代码片段，已移除了所有不必要的评估。\n\
  \n```java\nif (temperature < 45)System.out.println(\"Sweater, coat, jeans, shirt,\
  \ shoes\");else if (temperature < 65)System.out.println(\"Sweater, jeans, jacket,\
  \ shoes\");else if (temperature < 75)System.out.println(\"Capris, shorts, t-shirt,\
