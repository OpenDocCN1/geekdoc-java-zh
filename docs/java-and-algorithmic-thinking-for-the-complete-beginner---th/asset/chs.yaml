  \ 20。\n- 值 50 的约数是数字 1, 2, 5, 10, 25, 50。\n\n如果变量 `x` 包含用户提供的整数，`x` 的所有可能的约数都在 1\
  \ 到 `x` 之间。因此，你只需要一个 for 循环，变量 `counter` 的值从 1 到 `x`，在每次迭代中，用一个单分支决策结构检查 `counter`\
  \ 的值是否是 `x` 的约数。Java 程序如下。\n\n![](img/my_exercise_header.png) 项目 _30.5-4\n```java\n\
  public static void main(String[] args) throws Exception {\n    int x, numberOfDivisors,\
  \ i;\n    x = Integer.parseInt(cin.nextLine());\n    numberOfDivisors = 0;\n   \
