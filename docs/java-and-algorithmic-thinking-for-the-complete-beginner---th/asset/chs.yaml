  ![](img/remember.jpg)`indexOf()` 方法如果在变量 `vowels` 中未找到 `character`，则返回值 `-1`（参见第\
  \ 14.3 节）。\n\n## 26.2 适用于 for 循环的规则\n\n在编写 for 循环的程序时，必须始终遵循某些规则，因为这些规则可以避免产生意外的副作用。\n\
  \n- **规则 1**：计数变量可以出现在循环内部的语句中，但其值绝不能被修改（参见下文的练习 26.2-1](#chapter26.xhtml_toc_14)）。如果\
  \ `final_value` 和 `offset` 是变量而非常量值，该规则同样适用。\n- **规则 2**：`offset` 绝不能为零。如果将其设置为零，循环将执行无限次迭代（参见下文的练习\
  \ 26.2-2](#chapter26.xhtml_toc_15)）。\n- **规则 3**：如果 `initial_value` 小于 `final_value`，则\
  \ `offset` 必须为正数。如果为负数，循环将执行零次迭代（参见下文的练习 26.2-3](#chapter26.xhtml_toc_16)）。然而，故意违反此条规则在某些情况下是有用的。\n\
  - **规则 4**：如果 `initial_value` 大于 `final_value`，则 `offset` 必须为负数。如果为正数，循环将执行零次迭代（参见下文的练习\
  \ 26.2-4](#chapter26.xhtml_toc_17)）。然而，故意违反此条规则在某些情况下是有用的。\n\n### 练习 26.2-1 统计总迭代次数\n\
  \n以下代码片段执行了多少次迭代？\n\n```java\nfor (i = 5; i <= 10; i++) {\n    System.out.println(i);\n\
  \    i--;\n}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第一规则，该规则规定：计数变量可以出现在循环内部的语句中，但其值绝不能被修改。下面所示对应的流程图片段可以帮助你更好地理解实际情况。\n\
  \n.![Image](img/chapter26-05.png)\n\n如你所示，由于变量 `i` 的初始值 `5` 小于 `10`，执行流进入循环。但在循环内部，语句\
  \ `i ← i - 1` 取消了语句 `i ← i + 1`，导致变量 `i` 不递，，永远无法达到 `final_value` `10`。因此，循环执行无限次迭代。\n\
  \n![](img/remember.jpg)与计数变量类似，如果 `final_value` 和 `offset` 是变量而非常量值，它们的值在循环内部绝不能改变。\n\
  \n### 练习 26.2-2 统计总迭代次数\n\n以下代码片段执行了多少次迭代？\n\n```java\nfor (i = 5; i <= 10; i +=\
  \ 0) {\n    System.out.println(i);\n}\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第二规则，该规则规定：`offset`\
  \ 绝不能为零。后面对应的流程图片段可以帮助你更好地理解实际情况。\n\n.![Image](img/chapter26-06.png)\n\n如你所示，由于变量\
  \ `i` 的初始值小于 `10`，执行流进入循环。然而，语句 `i ← i + 0` 永远不会增加变量 `i`，这意味着它永远无法达到 `final_value`\
  \ `10`。因此，循环执行无限次迭代。\n\n![](img/remember.jpg)`offset` 绝不能为零。\n\n### 练习 26.2-3 统计总迭代次数\n\
  \n以下代码片段执行了多少次迭代？\n\n```java\nfor (i = 5; i >= 10; i--) {\n    System.out.println(i);\n\
  }\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第三规则，该规则规定：如果 `initial_value` 小于 `final_value`，则\
  \ `offset` 必须为正数。如果为负数，循环将执行零次迭代。后面对应的流程图片段可以帮助你更好地理解实际情况。\n\n.![Image](img/chapter26-07.png)\n\
  \n![](img/remember.jpg)当计数器递减时，比较运算符应为 `≥`，当计数器增加时应为 `≤`。\n\n当执行流到达循环控制结构时，值 `5`\
  \ 被赋给变量 `i`。然而，布尔表达式求值为假，执行流永远不会进入循环！因此，循环执行了零次迭代。\n\n![](img/notice.jpg)for 循环实际上是一种预测试循环结构。正因如此，它可能会执行从零次到多次迭代。\n\
  \n![](img/remember.jpg)故意违反 for 循环的第三规则在某些情况下是有用的。\n\n### 练习 26.2-4 统计总迭代次数\n\n\
  以下代码片段执行了多少次迭代？\n\n```java\nfor (i = 10; i <= 5; i++) {\n    System.out.println(i);\n\
  }\n```\n\n##### 解答\n\n此代码片段违反了 for 循环的第四规则，该规则规定：如果 `initial_value` 大于 `final_value`，则\
  \ `offset` 必须为负数。如果为正数，循环将执行零次迭代。后面对应的流程图片段可以帮助你更好地理解实际情况。\n\n.![Image](img/chapter26-08.png)\n\
  \n![](img/remember.jpg)当计数器增加时，比较运算符应为 `≤`，当计数器递减时应为 `≥`。\n\n当执行流到达循环控制结构时，值 `10`\
  \ 被赋给变量 `i`。然而，布尔表达式求值为假，执行流永远不会进入循环！因此，循环执行了零次迭代。\n\n![](img/remember.jpg)故意违反\
  \ for 循环的第四规则在某些情况下是有用的。\n\n### 练习 26.2-5 N 个数字的和\n\n编写一个 Java 程序，提示用户输入 N 个数字，然后计算并显示它们的和。`N`\
