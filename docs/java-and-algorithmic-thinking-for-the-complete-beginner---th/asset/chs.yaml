  \ 3 位整数。\n6. 编写一个 Java 程序，在文件中写入以下乘法表：\n```\n1 x 1 = 1\n1 x 2 = 2\n1 x 3 = 3\n1\
  \ x 4 = 4\n2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n```\n7. 编写一个 Java 程序，显示一行中存在的字符数量。\n\
  8. 编写一个 Java 程序，对于文件的每一行，如果存在标点符号，显示消息 `XX`。请注意 `XX` 必须替换为实际值。\n\n\n\n\n\n```java\n\
  sNumber = fin.nextLine();\n}\nfin.close();\nif (count > 0) {\n    System.out.println(total\
  \ / count);\n}\n```\n\n## 练习 41.1-3 寻找最小值和最大值\n\n假设有一个名为 `f_data41.1-3.txt` 的文件，其中包含数字，每行一个。文件结构的示例在此所示。\n\
  \n`1613.17233.5..`\n\n编写一个 Java 程序，找到最大值和最小值，并将它们存储在名为 `output.txt` 的文件中，格式如下所示：\n\
  \n`33.5  13.172`\n\n假设文件 `f_data41.1-3.txt` 中至少包含一个值。\n\n##### 解 Solution\n\n最终的程序所示。\n\
  \n![](img/my_exercise_header.png) 项目 _41.1-3\n```java\nstatic final String PATH\
  \ = \"c:/temp/\";\npublic static void main(String[] args) throws Exception {\n \
  \   double number, maximum, minimum;\n    Scanner fin = new Scanner(Paths.get(PATH\
  \ + \"f_data41.1-3.txt\"));\n    // 读取第一个值\n    maximum = fin.nextDouble();\n  \
  \  minimum = maximum;\n    // 逐行读取其余的所有值\n    while (fin.hasNextDouble()) {\n  \
  \      number = fin.nextDouble();\n        if (number > maximum ) {\n          \
  \  maximum = number;\n        }\n        if (number < minimum) {\n            minimum\
  \ = number;\n        }\n    }\n    fin.close();\n    // 将最大值和最小值写入文件\n    FileWriter\
  \ fout = new FileWriter(PATH + \"output.txt\");\n    fout.write(maximum + \"  \"\
  \ + minimum + \"\\n\");\n    fout.close();\n}\n```\n\n#### 练习 41.1-4 合并文件\n\n假设有两个名为\
  \ `text1.txt` 和 `text2.txt` 的文本文件。编写一个 Java 程序，合并这两个文件的内容，并将合并后的文本写入第三个名为 `final.txt`\
  \ 的文件中，将 `text1.txt` 的内容置于 `text2.txt` 的内容之前。\n\n##### 解 Solution\n\n这个练习可以使用多种方法解决。让我们来看其中两种。\n\
  \n#### 第一种方法\n\n程序打开文件 `text1.txt`，读取其所有内容，将其赋值给变量 `contents`，然后关闭文件。接下来，它打开文件 `text2.txt`，读取其所有内容，将其与之前的内容（变量\
  \ `contents` 中的内容）合并，并关闭文件。最后，它打开文件 `final.txt`并将合并后的内容写入其中，如下程序所示。\n\n![](img/my_exercise_header.png)\
  \ 项目 _41.1-4\n```java\nstatic final String PATH = \"c:/temp/\";\npublic static void\
  \ main(String[] args) throws Exception {\n    String contents = \"\";\n    Scanner\
  \ fin;\n    fin = new Scanner(Paths.get(PATH + \"text1.txt\"));\n    while (fin.hasNextLine())\
  \ {\n        contents += fin.nextLine() + \"\\n\";\n    }\n    fin.close();\n  \
  \  fin = new Scanner(Paths.get(PATH + \"text2.txt\"));\n    while (fin.hasNextLine())\
  \ {\n        contents += fin.nextLine() + \"\\n\";\n    }\n    fin.close();\n  \
  \  FileWriter fout = new FileWriter(PATH + \"final.txt\");\n    fout.write(contents);\n\
  \    fout.close();\n}\n```\n\n![](img/notice.jpg) 注意对象 `fin` 是在程序开头声明的。这样你就可以反复使用同一个对象来打开和读取多个文件。\n\
  \n#### 第二种方法\n\n下面的程序打开了三个文件，写入合并后的内容，然后关闭它们。\n\n![](img/my_exercise_header.png)\
  \ 项目 _41.1-4b\n```java\nstatic final String PATH = \"c:/temp/\";\npublic static\
  \ void main(String[] args) throws Exception {\n    String contents = \"\";\n   \
  \ Scanner fin1 = new Scanner(Paths.get(PATH + \"text1.txt\"));\n    Scanner fin2\
  \ = new Scanner(Paths.get(PATH + \"text2.txt\"));\n    FileWriter fout = new FileWriter(PATH\
  \ + \"final.txt\");\n    while (fin1.hasNextLine()) {\n        contents += fin1.nextLine()\
  \ + \"\\n\";\n    }\n    while (fin2.hasNextLine()) {\n        contents += fin2.nextLine()\
  \ + \"\\n\";\n    }\n    fout.write(contents);\n    fout.close();\n    fin2.close();\n\
  \    fin1.close();\n}\n```\n\n![](img/notice.jpg) 关闭文件的顺序不需要与打开文件的顺序一致。例如，你可以先打开\
  \ `text2.txt` 文件并最后关闭它，或者先打开再先关闭它。\n\n#### 练习 41.1-5 在文件中搜索\n\n在 във，社会安全号码（SSN）是一个九位数字身份标识，适用于所有美国公民，用于出于社会安全之目的识别他们的身份。假设有一个名为\
  \ `SSN.txt` 的文件，其中包含加利福尼亚州所有公民的 SSN（社会安全号码）以及他们的全名，每行一条记录。文件结构的示例在此所示。\n\n`123456789\
  \ John Doe`\n\n编写一个 Java 程序，提示用户输入一个 SSN，然后在文件中搜索该 SSN。如果找到，则显示其全名。\n\n##### 解 Solution\n\
  \n在这个特定的练习中，如果找到了 SSN，程序将显示其全名并停止。相反，如果用户输入的 SSN 位少于九位，程序将继续执行。解决方案如下所示。\n\n![](img/my_exercise_header.png)\
  \ 项目 _41.1-5\n```java\nstatic final String PATH = \"c:/temp/\";\npublic static void\
  \ main(String[] args) throws Exception {\n    String ssnToSearch, line, fullName;\n\
  \    boolean found;\n    Scanner fin = new Scanner(Paths.get(PATH + \"SSN.txt\"\
  ));\n    found = false;\n    System.out.print(\"Enter SSN to search: \");\n    ssnToSearch\
  \ = fin.nextLine();\n    while (fin.hasNextLine()) {\n        line = fin.nextLine();\n\
  \        ssn = line.substring(0, 9);\n        fullName = line.substring(10);\n \
  \       // 如果找到了\n        if (ssnToSearch.equals(ssn)) {\n            System.out.println(fullName);\n\
  \            found = true;\n            // 如果 SSN 包含九位数字，退出循环\n            if (ssnToSearch.length()\
  \ == 9) {\n                break;\n            }\n        }\n    }\n    fin.close();\n\
  \    if (!found) {\n        System.out.println(\"Not found!\");\n    }\n}\n```\n\
  \n#### 练习 41.1-6 使用子程序合并文件\n\n完成以下操作：\n\ni) 编写一个子程序 `readContent`，接受文件名并返回其内容。\n\
  ii) 编写一个子程序 `writeContent`，接受文件名和一个字符串，并将该字符串写入文件。\niii) 使用上述子程序，编写一个 Java 程序，提示用户输入两个文件名，并将第一个文件的内容写入第二个文件。假设用户输入的是有效文件名。\n\
  \n##### 解 Solution\n\n尽管这个练习看起来非常简单，但有必要强调 `readContent()` 方法的一些点。检查下面的 `readContent()`\
  \ 方法并尝试找到它包含的错误。这是一个逻辑错误，而不是语法错误。该方法可以成功执行，没有产生 Java 解释器的任何语法错误。然而错误确实存在，且很难发现！\n\
  \n```java\nstatic String readContent(String filename) throws Exception {\n    Scanner\
  \ fin = new Scanner(Paths.get(filename));\n    String contents = \"\";\n    while\
  \ (fin.hasNextLine()) {\n        contents += fin.nextLine() + \"\\n\";\n    }\n\
  \    return contents;\n    fin.close();\n}\n```\n\n这里发生的是，当执行 `return` 语句时，Java\
  \ 会忽略方法的其余语句，这意味着文件可能不会被关闭。想象在程序中多次调用这个特定的方法。你将面临许多可能永远不会关闭的文件。\n\n![](img/notice.jpg)\
  \ 最新版本的 Java 可能会在没有该文件的引用（`fin`）时自动关闭文件，但保持文件打开并等待 Java 为你关闭是一种糟糕的习惯。\n\n良好的做法是将\
  \ `return` 语句放在方法的末尾，如下程序所示。\n\n![](img/my_exercise_header.png) 项目 _41.1-6\n```java\n\
  static String readContent(String filename) throws Exception {\n    Scanner fin =\
  \ new Scanner(Paths.get(filename));\n    String contents = \"\";\n    while (fin.hasNextLine())\
  \ {\n        contents += fin.nextLine() + \"\\n\";\n    }\n    fin.close();\n  \
  \  return contents;\n}\n```\n\n\n\n\n\n```java\n}fin.close();return contents;}\n\
  static void writeContent(String filename, String contents) throws Exception {\n\
  \    FileWriter fout = new FileWriter(filename);\n    fout.write(contents);\n  \
  \  fout.close();\n}\npublic static void main(String[] args) throws Exception {\n\
  \    System.out.print(\"Enter source filename: \");\n    String source = cin.nextLine();\n\
  \    System.out.print(\"Enter destination filename: \");\n    String destination\
  \ = cin.nextLine();\n    String c = readContent(source);   //Equivalent to:writeContent(destination,\
  \ c);     //writeContent(destination, readContent(source))}\n```\n\n## 41.2 复习练习\n\
