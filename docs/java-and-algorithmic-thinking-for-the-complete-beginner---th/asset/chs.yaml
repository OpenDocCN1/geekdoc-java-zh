  \ (i = 0; i <= STUDENTS - 1; i++) {\n        if (gradesLesson1[i] > 89 && gradesLesson2[i]\
  \ > 89) {\n            System.out.println(names[i]);\n        }\n    }\n}\n```\n\
  \n#### 练习 33.4-2 使用一个一维数组配合二维数组\n\n有 10 个学生，他们每个人都收到了五门课程的成绩。编写一个 Java 程序，提示用户输入每个学生所有课程的姓名和成绩，然后计算并显示至少有一门成绩大于\
  \ 89 的学生。\n\n##### 解决方案\n\n在这个练习中，你可以像上一个问题那样做。例如，使用一个一维数组来存储姓名，使用五个一维数组来存储每个学生的课程成绩。这并不方便，但可行。显然，最好的方法是使用一个一维数组存储姓名，使用一个二维数组存储每个学生所有课程的成绩。\n\
  \n实际上有两种方法。使用哪种完全取决于你！如果你决定在二维数组中，行代表学生，列代表课程，那么可以使用下面的第一种方法。如果你决定行代表课程，列代表学生，那么可以使用下面的第二种方法。\n\
  \n第一种方法 —— 行表示学生，列表示课程\n\n在这种方法中，二维数组必须有 10 行（每个学生一行）和 5 列（每门课程一列）。其他数组相对于该数组的位置如下。\n\
  \n![Image](img/chapter33-08.png)\n\n辅助数组 `count` 将由程序创建，并将存储每个学生大于 89 的成绩数量。\n\n\
  现在，让我们看看如何读取值并将它们存储在 `names` 和 `grades` 中。一种简单的解决方案是使用一个 for 循环读取姓名，然后使用嵌套的 for\
  \ 循环读取成绩。然而，对于用户来说，先输入所有姓名再输入所有成绩可能并不实际。更友好的方法是提示用户输入一个姓名及其所有的成绩，然后处理下一个姓名及其相应的成绩，以此类推。解决方案如下。\n\
  \n```java\n![](img/my_exercise_header.png) Project_33.4-2\nstatic final int STUDENTS\
  \ = 10;\nstatic final int LESSONS = 5;\npublic static void main(String[] args) throws\
  \ Exception {\n    int i, j;\n    // 同时读取姓名和成绩。遍历 grades 数组中的行\n    String[] names\
  \ = new String[STUDENTS];\n    int[][] grades = new int[STUDENTS][LESSONS];\n  \
  \  for (i = 0; i <= STUDENTS - 1; i++) {\n        System.out.print(\"Enter student\
  \ No.\" + (i + 1) + \": \");\n        names[i] = cin.nextLine();\n        for (j\
  \ = 0; j <= LESSONS - 1; j++) {\n            System.out.print(\"Enter grade for\
  \ lesson \" + (j + 1) + \": \");\n            grades[i][j] = Integer.parseInt(cin.nextLine());\n\
  \        }\n    }\n```\n\n\n\n\n```java\nSystem.out.print(\"Enter name for student\
  \ No. \" + (i + 1) + \": \");\nnames[i] = cin.nextLine();\nfor (j = 0; j <= LESSONS\
  \ - 1; j++) {\n    System.out.print(\"Enter grade No. \" + (j + 1) + \" for \" +\
  \ names[i] + \": \");\n    grades[i][j] = Integer.parseInt(cin.nextLine());\n}\n\
  // 创建数组 count。遍历行\nint[] count = new int[STUDENTS];\nfor (i = 0; i <= STUDENTS -\
  \ 1; i++) {\n    count[i] = 0;\n    for (j = 0; j <= LESSONS - 1; j++) {\n     \
  \   if (grades[i][j] > 89) {\n            count[i]++;\n        }\n    }\n}\n// 显示有一个一个成绩大于\
  \ 89 的学生名称\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    if (count[i] > 1) {\n   \
  \     System.out.println(names[i]);\n    }\n}\n```\n\n## 第二种方法——行表示课程，列表示学生\n\n\
  在这种方法中，二维数组必须有 5 行（每节课程一行）和 10 列（每个学生一列）。其他数组可以相对于此二维数组放置，如下所示。\n\n![Image](img/chapter33-09.png)\n\
  \n![](img/notice.jpg)辅助数组 `count` 由程序创建，并将存储每个学生大于 89 的成绩数量。\n\n显然，为了创建数组 `count`，程序将遍历列。解决方案如下。\n\
  \n![](img/my_exercise_header.png) Project_33.4-2b\n```java\nstatic final int STUDENTS\
  \ = 10;\nstatic final int LESSONS = 5;\npublic static void main(String[] args) throws\
  \ Exception {\n    int i, j;\n    // 一次读取名称和成绩。遍历 grades 数组中的列\n    String[] names\
  \ = new String[STUDENTS];\n    int[][] grades = new int[LESSONS][STUDENTS];\n  \
  \  for (j = 0; j <= STUDENTS - 1; j++) {\n        System.out.print(\"Enter name\
  \ for student No. \" + (j + 1) + \": \");\n        names[j] = cin.nextLine();\n\
  \        for (i = 0; i <= LESSONS - 1; i++) {\n            System.out.print(\"Enter\
  \ grade No. \" + (i + 1) + \" for \" + names[j] + \": \");\n            grades[i][j]\
  \ = Integer.parseInt(cin.nextLine());\n        }\n    }\n    // 创建数组 count。遍历列\n\
  \    int[] count = new int[STUDENTS];\n    for (j = 0; j <= STUDENTS - 1; j++) {\n\
  \        count[j] = 0;\n        for (i = 0; i <= LESSONS - 1; i++) {\n         \
  \   if (grades[i][j] > 89) {\n                count[j]++;\n            }\n     \
  \   }\n    }\n    // 显示有一个一个成绩大于 89 的学生名称\n    for (j = 0; j <= STUDENTS - 1; j++)\
  \ {\n        if (count[j] > 1) {\n            System.out.println(names[j]);\n  \
  \      }\n    }\n}\n```\n\n### 练习 33.4-3 使用数组结合 HashMap\n\n有 30 名学生，每位学生都收到了他们的测试成绩。编写一个\
  \ Java 程序，提示用户输入每个学生的成绩（字母形式）。然后根据下表为每个学生显示其对应的百分比形式的成绩。\n\n#### 等级 | 百分比 |\n| :---\
  \ | :--- |\n| A | 90 - 100 |\n| B | 80 - 89 |\n| C | 70 - 79 |\n| D | 60 - 69 |\n\
  | E / F | 0 - 59 |\n\n##### 解决方案\n\n可以使用 `HashMap` 来存储给定的表格。解决方案非常直接，不需要进一步的解释。\n\
  \n![](img/my_exercise_header.png) Project_33.4-3\n```java\nstatic final int STUDENTS\
  \ = 30;\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    String grade, gradeAsPercentage;\n    HashMap<String, String> gradesTable =\
  \ new HashMap<>(\n        Map.of(\"A\", \"90-100\", \"B\", \"80-89\", \"C\", \"\
  70-79\", \"D\", \"60-69\", \"E\", \"0-59\", \"F\", \"0-59\")\n    );\n    String[]\
  \ names = new String[STUDENTS];\n    String[] grades = new String[STUDENTS];\n \
  \   for (i = 0; i <= STUDENTS - 1; i++) {\n        System.out.print(\"Enter student\
  \ name No\" + (i + 1) + \": \");\n        names[i] = cin.nextLine();\n        System.out.print(\"\
  Enter their grade: \");\n        grades[i] = cin.nextLine();\n    }\n    for (i\
  \ = 0; i <= STUDENTS - 1; i++) {\n        grade = grades[i];\n        gradeAsPercentage\
  \ = gradesTable.get(grade);\n        System.out.println(names[i] + \"  \" + gradeAsPercentage);\n\
  \    }\n}\n```\n\n现在，如果你完全理解了最后一个 `for` 循环的工作原理，请看下面的代码。它等同于最后一个 `for` 循环，但效率更高，因为它使用的变量更少。\n\
  \n```java\nfor (i = 0; i <= STUDENTS - 1; i++) {\n    System.out.println(names[i]\
  \ + \"  \" + gradesTable.get(grades[i]));\n}\n```\n\n### 33.5 从二维数组创建一维数组\n\n为了更好地理解如何从二维数组创建一维数组，让我们来看示例。编写一个\
