  \n#### 练习 25.1-9 寻找 20 个数的乘积\n\n编写一个 Java 程序，让用户输入 20 个数字，然后计算并显示它们的乘积。\n\n#####\
  \ 解决方案\n\n如果你使用序列控制结构，它将像下面的代码片段：\n\n```java\np = 1;x = Double.parseDouble(cin.nextLine());p\
  \ = p * x;x = Double.parseDouble(cin.nextLine());p = p * x;x = Double.parseDouble(cin.nextLine());p\
  \ = p * x;\n```\n\n注意变量 `p` 初始化为 1 而不是 0。为了让语句 `p = p * x` 正常运行，这是必要的；否则最终乘积将为零。\n\
  \n利用之前练习的知识，最终程序变为：\n\n![](img/my_exercise_header.png) Project_25.1-9\n```java\n\
  public static void main(String[] args) throws Exception {double p, x;int i;p = 1;i\
  \ = 1;while (i <= 20) {\n\n> x = Double.parseDouble(cin.nextLine());\n\n> p = p\
  \ * x;\n\n> i++;\n\n}System.out.println(p);}\n```\n\n### 25.2 后测试循环结构\n\n后测试循环结构在如下流程图中所示。\n\
  \n.Image](chapter25-04.png)\n\n![](img/remember.jpg)在循环控制结构中，菱形的出口之一总是向上的方向。\n\n\
  \n\n\n让我们看看执行流到达后测试循环结构时会发生什么。该结构中的语句或语句块被直接执行，如果 `Boolean_Expression` 求值为 `true`，则执行流将回到该结构语句或语句块正上方的点。语句或语句块将再次执行一次，如果\
  \ `Boolean_Expression` 再次求值为 `true`，则重复该过程。当 `Boolean_Expression` 在某处求值为 `false`\
  \ 时，迭代停止，执行流退出循环。\n\n![](img/notice.jpg)后测试循环与预测试循环的区别在于，首先执行结构中的语句或语句块，然后才计算布尔表达式。因此，后测试循环至少执行一次迭代！\n\
  \n![](img/remember.jpg)每当循环控制结构的语句或语句块执行一次时，计算机科学中的术语是“循环正在迭代（iterating）”或“循环执行了一次迭代（iteration）”。\n\
  \nJava 语句的通用形式为\n\n```java\ndo {语句或块} while (Boolean_Expression);\n```\n\n以下示例显示了从\
  \ 1 到 10 的数字。\n\n![](img/my_exercise_header.png) Project_25.2\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    i = 1;\n    do {\n\
  \        System.out.println(i);\n        i++;\n    } while (i <= 10);\n}\n```\n\n\
  ![](img/notice.jpg)注意在 do-while 语句末尾有一个分号（ ; ））字符。\n\n当只需要一个单一语句作为 do-while 语句的一部分时，允许省略大括号\
  \ `{ }`。因此，do-while 语句可以如下所示所示。\n\n```java\ndoOne_Single_Statement;while (Boolean_Expression);\n\
  ```\n\n![](img/notice.jpg)为了防止潜在的逻辑错误，许多程序员即使在 do-while 语句仅包含一个语句也倾向于始终使用大括号。\n\n\
  ### 练习 25.2-1 设计流程图并计算总迭代次数\n\n为以下代码段设计相应的流程图。这段 Java 代码执行了多少次迭代？\n\n```java\nint\
  \ i;i = 3;dodo {i--;} while (i > 0);System.out.println(\"The end\");\n```\n\n#####\
  \ 解答\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-05.png)\n\n现在，让我们创建一个追踪表来观察执行流。\n\
  \n| 步骤 | 语句 | 注释 | i | | |\n| --- | --- | --- | --- | --- | --- |\n| 1 | i = 3 |\
  \ | 3 | | |\n| 2 | i-- | | 2 | 第 1 次 | 迭代 |\n| 3 | while (i > 0) | 结果为 true | |\
  \ | |\n| 4 | i-- | | 1 | 第 2 次 | 迭代 |\n| 5 | while (i > 0) | 结果为 true | | | |\n\
  | 6 | i-- | | 0 | 第 3 次 | 迭代 |\n| 7 | while (i > 0) | 结果为 false | | | |\n| 8 | .println(\"\
  The end\") | 显示: The end | | | |\n\n正如从追踪表中所示，总迭代次数为三次。\n\n![](img/notice.jpg)后测试循环结构中的语句或语句块都执行了\
  \ N 次，布尔表达式也计算了 N 次。因此，要确定总迭代次数，你可以计算语句或语句块执行的次数，也可以计算布尔表达式计算的次数。这两个计数相等相等！\n\n\
  ### 练习 25.2-2 计算总迭代次数\n\n这段代码段执行了多少次迭代？\n\n```java\nint i;i = 3;do {System.out.println(i);i--;}\
  \ while (i >= 0);System.out.println(\"The end\");\n```\n\n##### 解答\n\n这个练习与上一个几乎相同。主要区别在于这里的布尔表达式即使在\
  \ `i = 0` 时也为 `true`。因此，它多执行了一次迭代，即四次。\n\n### 练习 25.2-3 设计流程图并计算总迭代次数\n\n为以下代码段设计相应的流程图。这段代码执行了多少次迭代？\n\
  \n```java\nint i;i = -1;do {System.out.println(\"Hello there!\");i--;} while (i\
  \ > 0);System.out.println(\"The end\");\n```\n\n##### 解答\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-06.png)\n\
  \n最初将值 -1 分给变量 `i`。在循环内部，显示消息“Hello there!”并且变量 `i` 减一（导致变为 -2）。布尔表达式 `i > 0` 求值为\
  \ `false`，执行流直接进入写入 (\"The end\") 语句。因此，该算法执行了一次迭代！\n\n### 练习 25.2-4 计算总迭代次数\n\n\
  这段代码段执行了多少次迭代？\n\n```java\nint i;i = 1;do {i = i + 2;} while (i != 4);System.out.println(\"\
  The end\");\n```\n\n##### 解答\n\n让我们创建一个追踪表来观察执行流。\n\n| 步骤 | 语句 | 注释 | i | | |\n\
  | --- | --- | --- | --- | --- | --- |\n| 1 | i = 1 | | 1 | | |\n| 2 | i = i + 2\
  \ | | 3 | 第 1 次 | 迭代 |\n| 3 | while (i != 4) | 结果为 true | | | |\n| 4 | i = i + 2\
  \ | | 5 | 第 2 次 | 迭代 |\n| 5 | while (i != 4) | 结果为 true | | | |\n| 6 | i = i + 2\
  \ | | 7 | 第 3 次 | 迭代 |\n| 7 | while (i != 4) | 结果为 true | | | |\n| 8 | … | | | |\
  \ |\n| 9 | … | | | | |\n\n正如追踪表所示，由于 `i` 从未被赋值为 4，这段代码将无限迭代！\n\n### 练习 25.2-5 数字的乘积\n\
  \n编写一个 Java 程序让用户输入 N 然后计算它们的乘积。N 的值必须在程序开始时提供。如果你将后测试循环切换为预测试循环会怎样？这两个程序对于可能的 N\
  \ 值的操作是否完全相同？\n\n##### 解答\n\n下面的两个程序都让用户输入 N，计算并显示乘积。左边的使用预测试，右边的使用后测试。\n\n![](img/my_exercise_header.png)\
  \ Project_25.2-5a\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int n, i;\n    double p, x;\n    n = Integer.parseInt(cin.nextLine());\n\
  \    p = 1;\n    i = 1;\n    while (i <= n) {\n        x = Double.parseDouble(cin.nextLine());\n\
  \        p = p * x;\n        i++;\n    }\n    System.out.println(p);\n}\n```\n\n\
  ![](img/my_exercise_header.png) Project_25.2-5b\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int n, i;\n    double p, x;\n    n = Integer.parseInt(cin.nextLine());\n\
  \    p = 1;\n    i = 1;\n    do {\n        x = Double.parseDouble(cin.nextLine());\n\
  \        p = p * x;\n        i++;\n    } while (i <= n);\n    System.out.println(p);\n\
  }\n```\n\n然而，当用户输入 N 非正值时，这两个 Java 程序的操作方式不同。例如，如果输入值 0，左程序执行零次迭代，而右程序执行一次迭代。显然，左程序是解决此练习的正确选择！\n\
