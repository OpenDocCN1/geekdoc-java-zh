  \            t[i][j] = Integer.parseInt(cin.nextLine());\n        }\n    }\n   \
  \ minimum = t[0][0];\n    m_i = 0;\n    m_j = 0;\n    for (i = 0; i <= CITIES -\
  \ 1; i++) {\n        for (j = 0; j <= DAYS - 1; j++) {\n            if (t[i][j]\
  \ < minimum) {\n                minimum = t[i][j];\n                m_i = i;\n \
  \               m_j = j;\n            }\n        }\n    }\n    System.out.println(\"\
  Minimum temperature: \" + minimum);\n    System.out.println(\"City: \" + names[m_i]);\n\
  \    System.out.println(\"Day: \" + (m_j + 1));\n}\n```\n\n![](img/notice.jpg)给变量\
  \ `m_i` 和 `m_j` 分配初始值 0 是必要的，因为始终存在最小值等于元素 `t[0][0]` 值的可能性。\n\n#### 练习 34.3-7 寻找每行的最小值和最大值\n\
  \n编写一个 Java 程序，让用户向 20 × 30 个元素的数组 `b` 中输入值，然后找到并显示每行的最小值和最大值。\n\n##### 解决方案\n\n\
  实际上有两种方法。第一种创建两个辅助一维数组 `minimum` 和 `maximum`，然后显示它们。`minimum` 和 `maximum` 数组分别在每个位置包含每行的最小值和最大值。另一方面，第二种方法找到并显示每行的最小值和最大值。让我们研究这两种方法。\n\
  \n#### 方法一——创建辅助数组\n\n为了更好地理解这种方法，使用“从内到外”的方法。当以下代码执行完成时，辅助一维数组 `minimum` 和 `maximum`\
  \ 将包含数组 `b` 第一行（索引为 0）的最小值和最大值。假设变量 `i` 为 0。\n\n```java\nminimum[i] = b[i][0];\n\
  maximum[i] = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n    if (b[i][j] < minimum)\
  \ {\n        minimum[i] = b[i][j];\n    }\n    if (b[i][j] > maximum) {\n      \
  \  maximum[i] = b[i][j];\n    }\n}\n```\n\n![](img/notice.jpg)注意变量 `j` 从 1 开始是错误的，虽然从索引\
  \ 0 开始迭代程序只会执行一次无效迭代。现在一切都清楚了，为了处理整个数组 `b`，你只需要将之前的代码嵌套到遍历所有行的 `for` 循环中，所示。\n\n\
  ```java\nfor (i = 0; i <= ROWS - 1; i++) {\n    minimum[i] = b[i][0];\n    maximum[i]\
  \ = b[i][0];\n    for (j = 1; j <= COLUMNS - 1; j++) {\n        if (b[i][j] < minimum)\
  \ {\n            minimum[i] = b[i][j];\n        }\n        if (b[i][j] > maximum)\
  \ {\n            maximum[i] = b[i][j];\n        }\n    }\n}\n```\n\n最后的 Java 程序如下。\n\
  \n![](img/my_exercise_header.png) Project_34.3-7a\n```java\nstatic final int ROWS\
  \ = 30;\nstatic final int COLUMNS = 20;\npublic static void main(String[] args)\
  \ throws Exception {\n    int i, j;\n    double[][] b = new double[ROWS][COLUMNS];\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        for (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n            b[i][j] = Double.parseDouble(cin.nextLine());\n        }\n    }\n\
  \    double[] minimum = new double[ROWS];\n    double[] maximum = new double[ROWS];\n\
  \    for (i = 0; i <= ROWS - 1; i++) {\n        minimum[i] = b[i][0];\n        maximum[i]\
  \ = b[i][0];\n        for (j = 1; j <= COLUMNS - 1; j++) {\n            if (b[i][j]\
  \ < minimum[i]) {\n                minimum[i] = b[i][j];\n            }\n      \
  \      if (b[i][j] > maximum[i]) {\n                maximum[i] = b[i][j];\n    \
  \        }\n        }\n    }\n    for (i = 0; i <= ROWS - 1; i++) {\n        System.out.println(minimum[i]\
  \ + \"  \" + maximum[i]);\n    }\n}\n```\n\n#### 方法二——寻找并直接显示最小值和最大值\n\n再次使用“从内到外”方法。下一个代码片段找到并直接显示数组\
  \ `b` 第一行（索引为 0）的最小值和最大值。假设变量 `i` 的值为 0。\n\n```java\nminimum = b[i][0];\nmaximum\
  \ = b[i][0];\nfor (j = 1; j <= COLUMNS - 1; j++) {\n    if (b[i][j] < minimum) {\n\
  \        minimum = b[i][j];\n    }\n    if (b[i][j] > maximum) {\n        maximum\
  \ = b[i][j];\n    }\n}\nSystem.out.println(minimum + \"  \" + maximum);\n```\n\n\
  为了处理整个数组 `b`，你只需要将这段代码嵌套到遍历所有行的 `for` 循环中，所示。\n\n```java\nfor (i = 0; i <= ROWS\
  \ - 1; i++) {\n    minimum = b[i][0];\n    maximum = b[i][0];\n    for (j = 1; j\
  \ <= COLUMNS - 1; j++) {\n        if (b[i][j] < minimum) {\n            minimum\
  \ = b[i][j];\n        }\n        if (b[i][j] > maximum) {\n            maximum =\
  \ b[i][j];\n        }\n    }\n    System.out.println(minimum + \"  \" + maximum);\n\
  }\n```\n\n最后的 Java 程序如下。\n\n![](img/my_exercise_header.png) Project_34.3-7b\n```java\n\
  static final int ROWS = 30;\nstatic final int COLUMNS = 20;\npublic static void\
  \ main(String[] args) throws Exception {\n    int i, j;\n    double minimum, maximum;\n\
  \    double[][] b = new double[ROWS][COLUMNS];\n    for (i = 0; i <= ROWS - 1; i++)\
  \ {\n        for (j = 0; j <= COLUMNS - 1; j++) {\n            b[i][j] = Double.parseDouble(cin.nextLine());\n\
  \        }\n    }\n    for (i = 0; i <= ROWS - 1; i++) {\n        minimum = b[i][0];\n\
  \        maximum = b[i][0];\n        for (j = 1; j <= COLUMNS - 1; j++) {\n    \
  \        if (b[i][j] < minimum) {\n                minimum = b[i][j];\n        \
  \    }\n            if (b[i][j] > maximum) {\n                maximum = b[i][j];\n\
  \            }\n        }\n        System.out.println(minimum + \"  \" + maximum);\n\
  \    }\n}\n```\n\n\n\n\n\n# 排序算法是计算机科学中的一个重要课题。排序算法是将数组元素按特定顺序排列的算法。有很多排序算法，每种算法都有特定的优缺点。\n\
  \n大多数排序算法通过比较数组中的元素来工作。它们通常根据效率和内存需求进行评估。\n\n有很多排序算法，其中包括：\n\n- 冒泡排序算法\n- 改进的冒泡排序算法\n\
  - 选择排序算法\n- 插入排序算法\n- 堆排序算法\n- 合并排序\n- 快速排序算法\n\n关于效率，冒泡排序被认为是效率最低的，而随后的每个算法都比它更好。快速排序被认为是最好且最快的排序算法之一，特别是对于大数据操作。\n\
  \n排序算法可以用于升序或降序显示数据；还可以帮助找到一组值的最小值和最大值。例如，在一个升序数组中，最小值位于第一个索引，而最大值位于最后一个索引。仅仅为了寻找最小值和最大值而对数组进行排序是非常低效的，如果出于其他原因，你随后可能需要最小值或最大值。\n\
  \n另一种需要排序算法的场景是你想要查找并显示数组中最大的（或最小）的三个数字。在这种情况下，你可以对数组进行降序排序，然后显示位于索引 0、1 和 2 的元素。\n\
  \n如你所知，Java 包含了 `Arrays.sort()` 方法用于数组排序。然而，在某些情况下，你需要实现自定义排序算法，以保持数组的一一对应关系。\n\n\
  ## 练习 34.4-1 冒泡排序 – 数值数组\n\n编写一个 Java 程序，让用户输入数值数组并使用冒泡排序算法进行升序排序。\n\n##### 答案\n\
  \n冒泡排序可能是效率最低的算法之一，但广泛用于教学。主要思想（当要求升序排序时）是重复地移动数组中的最小元素。工作原理如下：算法遍历数组元素，比较每对相邻元素，然后交换它们的内容（如果顺序错误）。此过程重复多次，直到数组排序完成。\n\
  \n例如，让我们尝试对以下数组进行升序排序。\n\n![Image](img/chapter34-08.png)\n\n最小值是 `5`。根据冒泡排序，这个值必须逐渐“冒泡”到位置\
  \ `0`，就像玻璃中的液体一样。当值 `5` 移动到位置 `0` 后，下一个最小值是 `8`。现在，值 `8` 必须“冒泡”到位置 `1`。下一个是值 `12`，它必须“冒泡”到位置\
  \ `2`，依此类推。此过程重复直到所有元素都处于正确的位置。\n\n但是如何进行这种“冒泡”呢？让我们详细查看整个过程。对于之前的六个元素的数组 `A`，必须执行五轮。\n\
  \n### 第一轮\n\n#### 第一次比较\n初始比较索引 `4` 和 `5` 的元素。由于值 `12` 小于 `49`，这两个元素交换内容。\n\n####\
  \ 第二次比较\n比较索引 `3` 和 `4` 的元素。由于值 `12` 不小于 `5`，不进行交换。\n\n#### 第三次比较\n比较索引 `2` 和 `3`\
  \ 的元素。由于值 `5` 小于 `8`，这两个元素交换交换内容。\n\n#### 第四次比较\n比较索引 `1` 和 `2` 的元素。由于值 `5` 小于 `25`，这两个元素交换内容。\n\
  \n#### 第五次比较\n比较索引 `0` 和 `1` 的元素。由于值 `5` 小于 `17`，这两个元素交换内容。\n\n![Image](img/chapter34-09.png)\n\
  \n第一轮已完成，但正如你看到的，数组还没有排序。唯一被放置在正确位置的值是 `5`。然而，由于后续还有轮，值 `5` 不需要参与后续的比较。在下一轮中，比较次数减少一次——即四次比较。\n\
  \n### 第二轮\n\n#### 第一次比较\n比较索引 `4` 和 `5` 的元素。由于值 `49` 不小于 `12`，不进行交换。\n\n#### 第二次比较\n\
  比较索引 `3` 和 `4` 的元素。由于值 `12` 不小于 `8`，不进行交换。\n\n#### 第三次比较\n比较索引 `2` 和 `3` 的元素。由于值\
  \ `8` 小于 `25`，这两个元素交换内容。\n\n#### 第四次比较\n比较索引 `1` 和 `2` 的元素。由于值 `8` 小于 `17`，这两个元素交换内容。\n\
  \n![Image](img/chapter34-10.png)\n\n第二轮已完成，值 `8` 保证被放置在正确位置。然而，由于后续还有轮，值 `8` 不需要参与后续的比较。在下一轮中，比较次数减少一次——即三次比较。\n\
  \n### 第三轮\n\n#### 第一次比较\n在这一轮中，执行了三次比较（但只有两次交换），如下所示。\n\n![Image](img/chapter34-11.png)\n\
  \n第三轮已完成，值 `12` 保证被放置在正确位置。然而，由于后续还有轮，值 `12`（以及值 `5` 和 `8`）不需要参与后续的比较。在下一轮中，比较次数减少一次——即两次比较。\n\
  \n### 第四轮\n\n#### 第一次比较\n在这一轮中，执行了两次比较（且没有交换），如下所示。\n\n![Image](img/chapter34-12.png)\n\
  \n第四轮已完成，值 `17` 保证被放置在正确位置。然而，由于还有最后一轮，值 `17`（以及 `5`、`8` 和 `12`）不需要参与后续的比较。在最后一轮中，比较次数减少一次——即一次比较。\n\
  \n### 第五轮\n\n#### 第一次比较\n在最后一轮中，只执行了一次比较。由于值 `49` 不小于 `25`，不进行交换。\n\n![Image](img/chapter34-13.png)\n\
  \n第五轮已完成，最后两个值（`25` 和 `49`）现在保证处于正确的位置。\n\n\n\n\n\n只需重新执行之前的代码段，就可以进行第二轮。然而，变量 `m`\
  \ 需要包含值 `2`。这将确保索引位置为 0 的元素不会被再次比较。同样，对于第三轮，由于相同的原因，可以重新执行之前的代码段，但变量 `m` 需要包含值 `3`。\n\
  \n因此，之前的代码段需要执行五次（每轮一次），并且每次变量 `m` 必须加 `1`。使用冒泡排序算法对数组 `a` 的最终代码段如下。\n\n```java\n\
  for (m = 1; m <= ELEMENTS - 1; m++) {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n\
  \        if (a[n] < a[n - 1]) {\n            temp = a[n];\n            a[n] = a[n\
  \ - 1];\n            a[n - 1] = temp;\n        }\n    }\n}\n```\n\n![](img/remember.jpg)\
  \ 对于 `N` 个元素，算法需要执行 `N - 1` 轮。例如，如果数组 `a` 包含 20 个元素，语句 `(m = 1; m <= ELEMENTS -\
  \ 1; m++)` 将执行 19 轮。\n\n完整的 Java 程序如下。\n\n![](img/my_exercise_header.png) Project_34.4-1\n\
  static final int ELEMENTS = 20;\npublic static void main(String[] args) throws Exception\
  \ {\n    int i, m, n;\n    double temp;\n    double[] a = new double[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    for (m = 1; m <= ELEMENTS - 1; m++) {\n        for (n = ELEMENTS - 1;\
  \ n >= m; n--) {\n            if (a[n] < a[n - 1]) {\n                temp = a[n];\n\
  \                a[n] = a[n - 1];\n                a[n - 1] = temp;\n          \
  \  }\n        }\n    }\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.print(a[i]\
  \ + \"\\t\");\n    }\n}\n```\n\n![](img/notice.jpg) 冒泡排序算法非常低效。它执行的比较总数是 ![Image](img/chapter34-14.png)，其中\
  \ `N` 是数组元素的总数。\n\n![](img/notice.jpg) 交换的总数取决于给定的数组。最坏的情况是你想对一个已经按降序排序的数组进行升序排序，反之亦然。\n\
  \n### 练习 34.4-2 对包含字母数字的一维数组排序\n\n编写一个代码段，使用冒泡排序算法对数组中的字母数字值进行降序排序。\n\n##### Solution\n\
  \n将此练习的措辞与上一个相比，有两个不同点。第一，冒泡排序算法需要对字母数字值（例如人的姓名或城市名）进行排序；第二，必须降序排序。\n\n在 Java 中，你不能使用比较运算符（如等于\
  \ `==`、不等于 `!=`、小于 `<` 或大于 `>` 运算符）来比较字符串。正如你已经在第 14.3 节中所了解的，Java 支持两个方法：`equals()`\
  \ 和 `compareTo()`，可用于此目的。对于这些方法，字母“A”被认为“小于”字母“B”，“B”被认为“小于”字母“C”，以此此类推。当然，如果数组包含第一个字母完全相同的单词，Java\
  \ 将继续比较它们的第二个字母，可能还有第三个字母（如果需要的话）。例如，名字“Jonathan”被认为“小于”名字“Jone”，因为第四个字母“a”“小于”第四个字母“e”。结论是，如果你将布尔表达式\
  \ `a[n] < a[n - 1]` 替换为表达式 `a[n].compareTo(a[n - 1]) < 0`，那么冒泡排序算法就能对字母数字值进行升序排序。\n\
  \n![](img/notice.jpg) 在英语字典中单词组织方式的背景下考虑字母数字排序。\n\n现在，让我们看看需要更改什么以便算法能够进行降序排序而不是升序。你还记得冒泡排序算法实际上是如何工作的吗？元素逐渐“泡”到索引最低的位置，就像气泡在可乐杯中上升一样。你在这个练习中想要的是让较大的（而不是较小的）元素“泡”到较低的索引位置。因此，你所需要做的仅仅是反转决策控制结构的比较运算符即可！\n\
  \n降序排序字母数字值的代码段如下。\n\n```java\nString tempStr;\nfor (m = 1; m <= ELEMENTS - 1; m++)\
  \ {\n    for (n = ELEMENTS - 1; n >= m; n--) {\n        if (a[n].compareTo(a[n -\
  \ 1]) > 0) {\n            tempStr = a[n];\n            a[n] = a[n - 1];\n      \
  \      a[n - 1] = tempStr;\n        }\n    }\n}\n```\n\n### 练习 34.4-3 在保持与第二个数组关系的同时对一维数组排序\n\
  \n编写一个 Java 程序，让用户输入 20 个湖泊的名字及其对应的平均面积。程序随后必须使用冒泡排序算法按平均面积进行升序排序。\n\n##### Solution\n\
  \n在这个练习中，你需要以下数组。![Image](img/chapter34-15.png) 如果你想在排序面积的同时保持两个数组元素之间的一一对应关系，你必须重新排列名称。这意味着每当两个面积元素交换时，对应的名称也必须交换。Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) Project_34.4-3\nstatic final int LAKES\
  \ = 20;\npublic static void main(String[] args) throws Exception {\n    int i, m,\
  \ n;\n    double temp;\n    String tempStr;\n    String[] names = new String[LAKES];\n\
  \    double[] areas = new double[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n\
  \        names[i] = cin.nextLine();\n        areas[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    for (m = 1; m <= LAKES - 1; m++) {\n        for (n = LAKES - 1; n >=\
  \ m; n--) {\n            if (areas[n] < areas[n - 1]) {\n                temp =\
  \ areas[n];\n                areas[n] = areas[n - 1];\n                areas[n -\
  \ 1] = temp;\n                tempStr = names[n];\n                names[n] = names[n\
  \ - 1];\n                names[n - 1] = tempStr;\n            }\n        }\n   \
  \ }\n    for (i = 0; i <= LAKES - 1; i++) {\n        System.out.println(names[i]\
  \ + \"\\t\" + areas[i]);\n    }\n}\n```\n\n![](img/notice.jpg) 注意不能使用变量 `temp` 来交换\
  \ `names` 的内容；因为 `temp` 声明为 double，而 `names` 包含字符串。因此，为此你需要变量 `tempStr`。\n\n###\
  \ 练习 34.4-4 姓名排序\n\n编写一个 Java 程序，提示用户输入 100 个人的姓和名。程序随后必须按姓氏的字母顺序显示姓名。在两个或多个人拥有相同姓的情况下，他们的名字也应该按字母顺序显示。\n\
  \n##### Solution\n\n你已经知道如何在保持与第二个数组元素一一对应的情况下对数组排序。现在，你必须处理第一个数组中两个姓相同的情况。根据练习的措辞，第二个数组中的名字也必须排序。例如，下方的数组\
  \ `lastNm` 包含了 100 个人的姓。它是按字母排序的，并且包含了三次“Parker”这个姓。数组 `firstNm` 中对应的名字“Andrew”、“Anna”和“Chloe”也必须排序，如下。\n\
  \n![Image](img/chapter34-16.png)\n\n为了方便起见，这里再次给冒泡排序的基础版本。请注意，该算法保持了 `lastNm` 和\
  \ `firstNm` 数组元素之间的一一对应关系。\n\n```java\nfor (m = 1; m <= PEOPLE - 1; m++) {\n   \
  \ for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n].compareTo(lastNm[n\
  \ - 1]) < 0) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n\
  \ - 1];\n            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n\
  \            firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n\
  \        }\n    }\n}\n```\n\n![](img/notice.jpg) 注意使用变量 `tempStr` 用于交换数组 `lastNm`\
  \ 和 `firstNm` 元素的内容。这是因为这两个数组都包含字符串。\n\n\n\n\n然而，为了解决这个练习，必须对此泡排序算法进行相应的调整。根据这个泡排序算法的基础版本，当位置\
  \ `n` 处的最后一个姓氏“小于”位置 `n − 1` 处的最后一个姓氏时，算法会交换对应的内容。然而，如果这些位置上的姓氏相同，算法则必须验证对应的名字是否处于正确顺序。如果不是，则需要在数组\
  \ `firstNm` 中进行交换。调整后的泡排序算法如文代码段所示。\n\n```java\nfor (m = 1; m <= PEOPLE - 1; m++)\
  \ {\n    for (n = PEOPLE - 1; n >= m; n--) {\n        if (lastNm[n].compareTo(lastNm[n\
  \ - 1]) < 0) {\n            tempStr = lastNm[n];\n            lastNm[n] = lastNm[n\
  \ - 1];\n            lastNm[n - 1] = tempStr;\n            tempStr = firstNm[n];\n\
  \            firstNm[n] = firstNm[n - 1];\n            firstNm[n - 1] = tempStr;\n\
  \        }\n        else if (lastNm[n].equals(lastNm[n - 1])) { //如果姓氏相同\n     \
  \       if (firstNm[n].compareTo(firstNm[n - 1]) < 0) { //检查对应的名字\n            \
  \    tempStr = firstNm[n]; //如果不在正确顺序上则进行交换\n                firstNm[n] = firstNm[n\
  \ - 1];\n                firstNm[n - 1] = tempStr;\n            }\n        }\n \
  \   }\n}\n```\n\n接下来是最终的 Java 程序。\n\n![](img/my_exercise_header.png) **Project_34.4-4**\n\
  \n```java\nstatic final int PEOPLE = 100;\npublic static void main(String[] args)\
  \ throws Exception {\n    int i, m, n;\n    String tempStr;\n    //读取数组 firstNm\
  \ 和 lastNm\n    String[] firstNm = new String[PEOPLE];\n    String[] lastNm = new\
  \ String[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n        System.out.print(\"\
  First name for person No. \" + (i + 1) + \": \");\n        firstNm[i] = cin.nextLine();\n\
  \        System.out.print(\"Last name for person No. \" + (i + 1) + \": \");\n \
  \       lastNm[i] = cin.nextLine();\n    }\n    //排序数组 lastNm 和 firstNm\n    for\
  \ (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--) {\n\
  \            if (lastNm[n].compareTo(lastNm[n - 1]) < 0) {\n                tempStr\
  \ = lastNm[n];\n                lastNm[n] = lastNm[n - 1];\n                lastNm[n\
  \ - 1] = tempStr;\n                tempStr = firstNm[n];\n                firstNm[n]\
  \ = firstNm[n - 1];\n                firstNm[n - 1] = tempStr;\n            }\n\
  \            else if (lastNm[n].equals(lastNm[n - 1])) {\n                if (firstNm[n].compareTo(firstNm[n\
  \ - 1]) < 0) {\n                    tempStr = firstNm[n];\n                    firstNm[n]\
  \ = firstNm[n - 1];\n                    firstNm[n - 1] = tempStr;\n           \
  \     }\n            }\n        }\n    }\n    //显示数组 lastNm 和 firstNm\n    for (i\
  \ = 0; i <= PEOPLE - 1; i++) {\n        System.out.println(lastNm[i] + \"\\t\" +\
  \ firstNm[i]);\n    }\n}\n```\n\n### 练习 34.4-5 排序二维数组\n\n编写一个代码段，将二维数组的每一列按升序排序。假设数组包含数值。\n\
  \n##### 解决方案\n\n二维数组的一个示例例如所示。\n\n![Image](img/chapter34-17.png)\n\n由于该数组有七列，因此泡排序算法需要执行七次，每列执行一次。因此，整个泡排序算法应该嵌套在一个循环七次的\
  \ `for` 循环中。\n\n但让我们按照正确的顺序来。使用“从内层到外”的方法，下一个代码段仅对二维数组 `a` 的第一列（列索引为 0）进行排序。假设变量\
  \ `j` 包含值 0。\n\n```java\nfor (m = 1; m <= ROWS - 1; m++) {\n    for (n = ROWS -\
  \ 1; n >= m; n--) {\n        if (a[n][j] < a[n - 1][j]) {\n            temp = a[n][j];\n\
  \            a[n][j] = a[n - 1][j];\n            a[n - 1][j] = temp;\n        }\n\
