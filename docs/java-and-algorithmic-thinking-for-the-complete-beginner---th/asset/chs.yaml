  ```\n\n### 37.8 递归\n\n递归是一种子程序调用自身的编程技术。初初看起来可能像无限循环，但显然并非如此；递归满足有限性。\n\n想象下一个程序帮助你找到路。在这个程序中：\n\
  \n```java\nstatic void find_home() {\n    if (you_at_home) {\n        stop_walking();\n\
  \    } else {\n        take_one_step_toward_home();\n        find_home();\n    }\n\
  }\n\npublic static void main(String[] args) throws Exception {\n    find_home();\n\
  }\n```\n\n现在，让我们通过真实的示例来分析递归。下一个程序计算 5 的阶乘。\n\n```java\nstatic int factorial(int\
  \ value) {\n    if (value == 1) {\n        return 1;\n    } else {\n        return\
  \ value * factorial(value - 1);\n    }\n}\n\npublic static void main(String[] args)\
  \ throws Exception {\n    System.out.println(factorial(5)); // 它显示：120\n}\n```\n\
  \n在数学中，非负整数 `N` 的阶乘是所有小于等于 `N` 的正整数的乘积。它用 `N!` 表示，且 0 的阶乘定义为 1。例如，5 的阶乘是 `1 × 2\
  \ × 3 × 4 × 5 = 120`。\n\n你现在可能很困惑。到底如何在不用循环控制结构的情况下计算 `1 × 2 × 3 × 4 × 5` 呢？下一个图可能有助于你理解。\n\
  \n![Image](img/chapter37-06.png)\n\n让我们看看这个图是如何工作的。主代码调用方法 `factorial(5)`，它又调用方法\
  \ `factorial(4)`，后者又调用 `factorial(3)`，以此此类推。最后一个调用 `(factorial(1))` 向其调用者 `(factorial(2))`\
  \ 返回值 1，后者又向其调用者 `(factorial(3))` 返回 `1 × 2 = 2`，以此此类推。当方法 `factorial(5)` 从最层调用返回时，你就得到了最终解。\n\
  \n\n\n\n\n1) 它们必须调用自己。\n2) 它们必须有一个基例（base case），即“告诉”子程序停止递归的条件。基例通常是一个可以直接解决的极小问题。它是对“最简单”可能问题的解决方案。在前一个示例的\
  \ `factorial()` 方法中，基例是 `factorial(1)`。当调用 `factorial(1)` 时，布尔表达式 `value == 1` 求值结果为真，并信号递归的结束。\n\
  3) 它们必须改变状态并向基例移动。状态的改变意味着子程序修改了它的部分数据。通常，数据会以某种方式变得越来越小。在前一个示例的 `factorial()` 函数中，由于基例是\
  \ `factorial(1)`，因此整个概念都依赖于向该基例移动的想法。\n\n总之，递归可以帮助你编写更具创意、更优雅的程序，但请记住它并不总是最佳选择。递归的主要缺点是程序员很难透彻思考逻辑，因此调试包含递归子程序的代码会很困难。此外，递归算法可能可能不如非递归算法，因为它可能会消耗过多的\
  \ CPU 时间和/或过多的主内存（RAM）。因此，有时最好是遵循 KISS 原则，而不是使用递归，而是使用循环控制结构来解决算法。\n\n![](img/notice.jpg)\
  \ 对于不知道什么是 KISS 原则的人，它是“Keep It Simple, Stupid”（保持简单，蠢！）的缩写！它指出，大多数系统在保持简单的情况下运行最好，避免任何不必要的复杂性！\n\
  \n### 37.9 复习题：对/错\n\n判断每个陈述的对错错。\n\n1) 每个子程序都使用自己的内存空间来存储变量的值。\n2) 子程序中使用的变量在子程序执行期间一直“存在”。\n\
  3) 只有在 Java 程序执行期间一直“存活”的变量是主代码的变量和全局变量。\n4) 子程序可以调用主代码。\n5) 如果按值传递参数且其值在子程序内部被更改，则它在外部不会发生变化。\n\
  6) 实际参数名称与相应的形式参数名称必须相同。\n7) 实际参数的总数不能大于形式参数的总数。\n8) 表达式不能传递给子程序。\n9) 默认情况下，Java\
  \ 中的数组是按引用传递的。\n10) 你可以将数组传递给 void 方法，但 void 方法不能（直接或间接地）向调用者返回数组。\n11) 方法可以通过其形式参数列表接受一个数组。\n\
  12) 一般来说，void 函数可以调用任何函数。\n13) 一般来说，函数可以调用任何 void 函数。\n14) 在语句中，方法只能被调用一次。\n15)\
  \ void 方法可以通过其形式参数列表返回一个值。\n16) 子程序可以被另一个子程序或被主代码调用。\n17) 重载是 Java 的一种特性，允许你拥有两个或多个相同名称的参数。\n\
  18) 只要形式参数列表中的参数数量相等，你就可以重载。\n19) 重载是 Java 的一种特性，只要它们具有完全相同的形式参数列表，你就可以拥有两个或多个不同名称的方法。\n\
  20) 变量的作用域是指该变量的影响范围。\n21) 如果全局变量的值在子程序内部被更改，该更改也会在子程序外反映出来。\n22) 你可以有两个同名的全局作用域变量。\n\
  23) 递归是一种编程技术，其中子程序调用自己。\n24) 递归算法必须有一个基例。\n25) 使用递归解决问题并不总是最佳选择。\n\n### 37.10 复习练习题\n\
