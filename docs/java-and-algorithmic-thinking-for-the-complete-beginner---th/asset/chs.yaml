  \n##### 答案\n\n此练习可以使用双分支决策结构或单分支决策结构来解决。所以，让我们两个都用用！\n\n###### 第一种方法 – 使用双分支决策结构\n\
  \n这种方法测试数字 `B` 的值是否大于数字 `A`。如果是，则数字 `B` 是最大的；否则数字 `A` 是最大的。使用这种方法解决此练习的相应流程图所示。\n\
  \n![Image](img/chapter17-03.png)\n\nJava 程序如下。\n\n![](img/my_exercise_header.png)\
  \ Project_17.1-3\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double a, b, maximum;\n    a = Double.parseDouble(cin.nextLine());\n  \
  \  b = Double.parseDouble(cin.nextLine());\n    if (b > a) {\n        maximum =\
  \ b;\n    } else {\n        maximum = a;\n    }\n    System.out.println(\"Greatest\
  \ value: \" + maximum);\n}\n```\n\n![](img/notice.jpg) 注意，此练习正尝试确定最大值，而不是该值实际上赋值给了哪个变量（变量\
  \ `A` 还是变量 `B`）。\n\n###### 第二种方法 – 使用单分支决策结构\n\n如后续流程图所示，这种方法最初假设数字 `A` 可能是最大值（这就是为什么它将变量\
  \ `a` 的值赋予变量 `maximum`）。然而，如果证明数字 `B` 大于数字 `A`，则更新最大值；变量 `maximum` 被赋予一个新值——变量 `b`\
  \ 的值。因此，无论数字 `A` 和 `B` 的值是多少，最后变量 `maximum` 将始终包含最大值！\n\n![Image](img/chapter17-04.png)\n\
  \nJava 程序所示。\n\n![](img/my_exercise_header.png) Project_17.1-3b\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    double a, b, maximum;\n\
  \    a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    maximum = a;\n    if (b > a) {\n        maximum = b;\n    }\n    System.out.println(\"\
