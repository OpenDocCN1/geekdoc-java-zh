  \ `needle`。假设该数组包含数值并按升序排列。\n\n# 第七部分：子程序\n\n## 第 35 章：子程序简介\n\n### 35.1 到底什么是子程序？\n\
  \n在计算机科学中，子程序是一个封装成单元的执行特定任务的语句块。当需要执行该特定任务时，程序可以在程序内被多次调用。\n\n在 `Java` 中，内置方法是这种子程序的示例。以著名的\
  \ `Math.abs()` 方法为例。它由一个在名为 `abs` 的下封装成单元的语句块组成，并执行一个特定任务——返回数字的绝对值。\n\n如果你在想 `Math.abs()`\
  \ 方法内部可能存在什么样的语句，这里有一段可能的语句块：\n\n```\nif (number < 0)\nreturn number * (-1);\nelse\n\
  return number;\n```\n\n通常来说，子程序分为两类：函数（functions）和过程（procedures）。函数和过程的区别在于函数会返回一个结果，而过程不会返回。然而，在某些计算机语言中，这种区别可能并不明显。在某些语言中，函数也可以像过程一样运行且不返回结果；而在某些语言中，过程可以返回一个或甚至多个结果。\n\
  \n取决于所使用的计算机语言，“函数”和“过程”的术语可能不同。例如，在 `Visual Basic` 中，你可以找到它们为“functions”和“subprocedures”，在\
  \ `FORTRAN` 中是“functions”和“subroutines”，而在 `Java` 中，首选术语通常是“methods”和“void methods”。\n\
  \n### 35.2 什么是过程式编程？\n\n假设你被分配了一个解决你所在地区滥毒问题的项目。一种可能的方法（可能证明非常困难甚至不可能）是尝试自己去解决这个问题！\n\
  \n然而，更好的方法是将大问题细分为更小的子问题，例如预防、治疗和康复，每个子问题都可以进一步细分为更小的子问题，如图 35–1 所示。\n\n图 35–1 问题可以被细分为更小的问题\n\
  \n作为该项目的负责人，你可以租一栋建筑并在其中建立三个部门：预防部门、治疗部门和康复部门，每个部门都可以进一步细分为更小的子部门。\n\n你可以租赁并建立预防部门（及其所有子部门）、治疗部门（及其所有子部门）以及康复部门（及其所有子部门）。最后，你将雇佣员工（来自各个领域的专家），组建团队来完成工作！\n\
  \n过程式编程正是这样做。它将初始问题细分为较小的子问题，每个子问题再被细分为更小的子问题。最后，为每个子问题编写一个子程序，由主程序调用它们来完成任务的不同部分。\n\
  \n过程式编程具有若干优点：\n\n- 它允许程序员在需要时复用相同的代码，无需重新编写或复制。\n- 它相对容易实现。\n- 它帮助程序员更容易跟踪执行流，简化调试过程。\n\
  \n一个非常大的程序如果全部堆在一起，调试可能会变得非常困难。由于这个原因，将其细分为每个执行清晰定义过程的较小子程序通常容易。\n\n### 35.3 什么是模块化编程？\n\
  \n在模块化编程中，功能相似的子程序被分组到独立的模块中，每个模块都有自己的数据集。因此，一个程序可以由多个部分组成，每个部分（模块）可以包含一个或多个较小部分（子程序）。\n\
  \n`Math` 模块就是一个例子。它包含了功能相关的子程序（与数学相关），如 `abs()`、`sqrt()`、`sin()`、`cos()`、`tan()`\
  \ 等。\n\n如果你在之前的药物问题示例中使用模块化编程，那么你可以拥有三栋独立的建筑——一栋用于预防部门及其所有子部门，另一栋用于治疗部门及其所有子部门，第三栋用于康复部门及其所有子部门（如图\
  \ 35–2 所示）。这三栋建筑可以被认为是模块化编程中的三个不同模块，每个模块都包含功能相似的子程序。\n\n图 35–2 功能相似的子程序可以被分组到独立的模块中。\n\
  \n### 35.4 复习题：判断题\n\n对以下每个陈述判断对或错。\n\n\n\n\n1) 子程序是一个封装成单元的用于执行特定任务的语句块。\n2) 一般来说，子程序分为两种：函数（functions）和过程（procedures）。\n\
  3) 一般来说，函数和过程的区别在于，过程返回一个结果，而函数不返回。\n4) Java 仅支持过程。\n5) 过程化编程将初始问题细分为更小的子问题。\n6)\
  \ 过程化编程的一个优点是能够重用相同的代码，而不需要重写或复制它。\n7) 过程化编程帮助程序员更容易地跟进执行流。\n8) 模块化编程可以提高程序的开发速度。\n\
  9) 在模块化编程中，通用功能的子程序被组合到独立的模块中。\n10) 在模块化编程中，每个模块可以有自己的一组数据。\n11) 模块化编程使用的结构与结构化编程不同。\n\
  12) 一个程序可以由多个模块组成。\n\n## 第 36 章\n\n## 用户自定义子程序\n\n### 36.1 返回值的子程序\n\n在许多计算机语言中，返回值的子程序被称为函数。Java\
  \ 将它们称为方法（methods），并分为两类。它们有内置方法，如 `Math.abs()`、`Math.sqrt()`，以及用户自定义方法，即那些你可以亲自编写并在自己的程序中使用的方法。\n\
  \n一个返回值的 Java 方法的通用形式所示：\n\n```\nstatic return_type name([type1 arg1, type2 arg2,\
  \ type3 arg3, …]) {\n    Local variables declaration section\n    A statement or\
  \ block of statements\n    return value;\n}\n```\n\n其中\n\n- `return_type` 是方法返回的值的数据类型。\n\
  - `name` 是方法的名称。\n- `arg1`, `arg2`, `arg3`, `… 是参数列表（变量、数组等），用于从调用者将值传递给方法。参数可以根据需要提供任意数量的参数。\n\
  - `type1`, `type2`, `type3`, `… 是每个参数的数据类型。每个参数必须有一个数据类型。\n- `value` 是返回给调用者的值。它可以是一个常量、变量、表达式，甚至是数据结构。它的数据类型必须与方法的\
  \ `return_type` 匹配。\n\n![](img/notice.jpg)注意，参数是可选的；也就是说，方法可以不包含任何参数。\n\n![](img/notice.jpg)在\
  \ Section 5.4 中，你学习了为变量命名时必须遵循的规则。为子程序命名遵循完全相同的规则！\n\n方法名可以类比为一个箱子（见图 36–1），它包含一个语句或语句块。它接受参数\
  \ `arg1`, `arg2`, `arg3`, `…` 作为输入值，并返回 `value` 作为输出值。\n\n![Image](img/chapter36-01.png)\n\
  \n图 36–1 方法可以类比为一个箱子\n\n例如，下一个方法通过参数 `num1` 和 `num2` 两个数字，然后计算它们的和并返回结果。\n\n```java\n\
  static double getSum(double num1, double num2) {\n    double result;\n    result\
  \ = num1 + num2;\n    return result;\n}\n```\n\n当然，这也可以写成：\n\n```java\nstatic double\
  \ getSum(double num1, double num2) {\n    return num1 + num2;\n}\n```\n\n### 36.2\
  \ 如何调用方法\n\n每次方法调用如下：你写下方法名，后面跟着参数列表（如果需要的话），要么是在将方法的返回结果赋值给变量的语句中，要么直接在表达式中。\n\n\
  让我们来看一些例子。下面的方法通过参数 `num` 接收一个数值，并返回该值三次方幂的结果。\n\n```java\nstatic double cube(double\
  \ num) {\n    double result;\n    result = num * num * num;\n    return result;\n\
  }\n```\n\n现在，假设你想计算以下表达式的结果：\n\n.![Image](img/chapter36-02.png)\n\n你可以将方法 `cube()`\
  \ 返回的值赋值给一个变量，如下所示：\n\n```java\nx = Double.parseDouble(cin.nextLine());\ncb = cube(x);\
  \        //将返回的值赋值给变量\ny = cb + 1 / x;     //并使用该变量\nSystem.out.println(y);\n```\n\
  \n或者你也可以直接在表达式中调用该方法，\n\n```java\nx = Double.parseDouble(cin.nextLine());\ny = cube(x)\
  \ + 1 / x; //直接在表达式中调用方法\nSystem.out.println(y);\n```\n\n或者你甚至可以直接在 `System.out.println()`\
  \ 语句中调用方法。\n\n```java\nx = Double.parseDouble(cin.nextLine());\nSystem.out.println(cube(x)\
  \ + 1 / x);  //直接在 System.out.println() 语句中调用方法\n```\n\n![](img/notice.jpg)用户自定义方法可以像\
  \ Java 的内置方法一样调用。\n\n现在让我们来看另一个例子。下一个 Java 程序定义了方法 `getMessage()`，然后主代码调用了它。返回值赋值给变量\
  \ `a`。\n\n![](img/my_exercise_header.png) Project_36.2a\n```java\n//定义方法\nstatic\
  \ String getMessage() {\n    String msg;\n    msg = \"Hello\";\n    return msg;\n\
  }\n//主代码\npublic static void main(String[] args) {\n    String a;\n    a = getMessage();\n\
  \    System.out.println(a);\n}\n```\n\n运行该程序，输出结果如下：\n\nHello\n\n\n\n你可以通过直接编写其名称来调用\
  \ void 方法。接下来的示例定义了 void 方法 `displayLine()`，主代码在每次需要显示水平线时调用该 void 方法。\n\n![](img/my_exercise_header.png)\
  \ Project_36.4a\n\n//定义 void 方法\n```java\nstatic void displayLine() {\n    System.out.println(\"\
  ---------------------\");\n}\npublic static void main(String[] args) throws Exception\
  \ {\n    System.out.println(\"Hello there!\");\n    displayLine();\n    System.out.println(\"\
  How do you do?\");\n    displayLine();\n    System.out.println(\"What is your name?\"\
  );\n    displayLine();\n}\n```\n\n你可以向 void 方法传递（发送）值，只要 void 方法的括号内至少存在一个参数。在接下来的示例中，void\
  \ 方法 `displayLine()` 被调用了三次，但每次通过变变长度传递了不同的值，导致打印出三行长度不同的线。\n\n![](img/my_exercise_header.png)\
  \ Project_36.4b\n```java\nstatic void displayLine(int length) {\n    int i;\n  \
  \  for (i = 1; i <= length; i++) {\n        System.out.print(\"-\");\n    }\n  \
  \  System.out.println();\n}\npublic static void main(String[] args) throws Exception\
  \ {\n    System.out.println(\"Hello there!\");\n    displayLine(12);\n    System.out.println(\"\
  How do you do?\");\n    displayLine(14);\n    System.out.println(\"What is your\
  \ name?\");\n    displayLine(18);\n}\n```\n\n![](img/remember.jpg) 由于 void 方法 `displayLine()`\
  \ 不返回值，因此下面这行代码是错误的。你不能将 void 方法赋值给变量，因为没有任何返回值！\n\n```java\ny = display_line(12);\n\
  ```\n\n此外，你不能在语句中调用它。下面这行代码也是错误的。\n\n```java\nSystem.out.println(\"Hello there!\\\
  n\" + display_line(12));\n```\n\n### 36.5 形式参数与实际参数\n\n每个方法（或 void 方法）包含一个称为形式参数列表的参数列表。如所述，此列表中的参数是可选的；形式参数列表可以不包含参数、包含一个参数或包含多个参数。\n\
  \n当调用子程序（方法或 void 方法）时，可能会将一个参数列表传递给子程序。此列表被称为实际参数列表。\n\n在接下来的示例中，形式参数（变量）`n1` 和\
  \ `n2` 构成了形式参数列表，而形式参数（变量）`x` 和 `y` 以及形式参数（表达式）`x + y` 和 `y / 2` 构成了实际参数列表。\n\n\
  ![](img/my_exercise_header.png) Project_36.5\n```java\n// 定义 multiply 方法。\n// 两个参数\
  \ n1 和 n2 称为形式参数。\nstatic double multiply( double n1, double n2 ) {\n    double\
  \ result;\n    result = n1 * n2;\n    return result;\n}\n// 主代码从这里开始\npublic static\
  \ void main(String[] args) throws Exception {\n    double x, y, w;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    y = Double.parseDouble(cin.nextLine());\n    // 调用 multiply 方法。\n    // 两个参数\
  \ x 和 y 称为实际参数。\n    w = multiply( x, y );\n    System.out.println(w);\n    // 调用\
  \ multiply 方法。\n    // 两个参数 x + y 和 y / 2 称为实际参数。\n    System.out.println(multiply(\
  \ x + 2, y / 2 ));\n}\n```\n\n![](img/notice.jpg) 注意，形式参数和实际参数之间存在一一对应的关系。在第一次调用中，实际参数\
  \ `x` 的值被传递给形式参数 `n1`，实际参数 `y` 的值被传递给形式参数 `n2`。在第二次调用中，实际参数（表达式的结果）`x + 2` 的值被传递给形式参数\
  \ `n1`，实际参数（表达式的结果）`y / 2` 的值被传递给形式参数 `n2`。\n\n### 36.6 方法是如何执行的？\n\n当主代码调用方法时，执行以下步骤：\n\
  \n- 主代码语句的执行被中断。\n- 实际参数列表中存在的变量值或表达式结果被传递（赋值）给形式参数列表中的对应参数（变量），执行流跳转到方法定义的地方。\n\
