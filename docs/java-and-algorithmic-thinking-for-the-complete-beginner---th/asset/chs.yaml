  \n## 第 13 章\n\n商与余数的练习\n\n### 13.1 引言\n\n哪些类型的问题可能需要使用整数除法的商和余数？虽然这个问题可能没有简单的答案，但商和余数可以用于：\n\
  \n► 将数字拆分为单个数字\n► 检查整数是否为奇数或偶数\n► 检查一个数是否是另一个数的倍数\n► 将经过的时间（秒）转换为小时、分钟和秒\n► 将金额金额（美元）转换为\
  \ 100 元钞票、50 元钞票、20 元钞票等\n► 计算最大公约数\n► 判断一个数字是否是回文数\n► 统计数字中的位数\n► 确定特定数字在数字中出现的次数\n\
  \n当然，这些只是一些用途，你肯定可以发现更多。接下来，你将看到一些使用整数除法商和余数的练习。\n\n\n\n\n\n## 练习 13.1-1 计算整数除法的商和余数\n\
  \n编写一个 Java 程序，提示用户输入两个整数，然后计算这两个整数进行整数除法的商和余数。\n\n##### 解决方案\n\n模运算符（`%`）执行整数除法并返回整数余数。由于\
  \ Java 实际上并没有包含用于计算整数商的算术运算符，你可以使用 `(int)` 强制转换运算符来实现相同的的结果。这里给出解决方案。\n\n![](img/my_exercise_header.png)\
  \ \n\n### Project_13.1-1\n```java\npublic static void main(String[] args) throws\
  \ Exception {\n    int number1, number2, q, r;\n    System.out.print(\"Enter first\
  \ number: \");\n    number1 = Integer.parseInt(cin.nextLine());\n    System.out.print(\"\
  Enter second number: \");\n    number2 = Integer.parseInt(cin.nextLine());\n   \
  \ q = (int)(number1 / number2);\n    r = number1 % number2;\n    System.out.println(\"\
  Integer Quotient: \" + q + \"\\nInteger Remainder: \" + r);\n}\n```\n\n![](img/notice.jpg)\
  \ 在流程图中，为了计算整数除法的商和余数，可以使用常用的 `DIV` 和 `MOD` 运算符。这里是一个示例。\n\n.![Image](img/chapter13-01.png)\n\
  \n![](img/notice.jpg) 在 Java 中，两个整数相除的结果始终是一个整数。因此，在语句 `q = (int)(number1 / number2)`\
  \ 中，由于变量 `number1` 和 `number2` 已经是整数，`(int)` 强制转换运算符是多余的。然而，为了提高代码的可读性，保留它也是一个良好的习惯。\n\
  \n## 练习 13.1-2 求数字数字之和\n\n编写一个 Java 程序，提示用户输入一个四位整数，然后计算其各位数字之和。\n\n##### 解决方案\n\
  \n你在这里需要记住，像这样的语句：\n\n```java\nnumber = Integer.parseInt(cin.nextLine());\n```\n\
  \n是将用户提供的四位整数赋值给单个变量 `number`，而不是四个独立的变量。因此，在用户输入四位整数后，程序必须将该整数拆分为四个数字，并将每个数字赋值给单独的变量。然后，就可以计算这四个变量之和并得到所需的结果。有两种方法可用。\n\
  \n### 方法一\n\n让我们尝试通过一个算术示例来理解第一种方法。以数字 `6753` 为。\n\n| 第一位数字 = 6 | 如果你使用 `/` 运算符将用户提供的数字除以\
  \ 1000，并使用 `(int)` 类型转换运算符，就可以分离出商 `digit1 = (int)(6753 / 1000)` |\n| 剩余数字 = 753\
  \ | 如果你再次将用户提供的数字除以 1000，这次使用 `%` 运算符获取整数余数 `r = 6753 % 1000` |\n| 第二位数字 = 7 | 如果你使用\
  \ `/` 运算符将剩余数字除以 100，并使用 `(int)` 类型转换运算符，就可以分离出商 `digit2 = (int)(753 / 100)` |\n\
  | 剩余数字 = 53 | 此时剩余数字为 `r = 753 % 100` |\n| 第三位数字 = 5 | 如果你使用 `/` 运算符将剩余数字除以 10，并使用\
  \ `(int)` 类型转换运算符，就可以分离出商 `digit3 = (int)(53 / 10)` |\n| 第四位数字 = 3 | 最后剩下的数字（恰好是第四位数字）是\
  \ `digit4 = 53 % 10` |\n\n这里是解决该算法的 Java 程序。\n\n![](img/my_exercise_header.png)\
  \ \n\n### Project_13.1-2\n```java\npublic static void main(String[] args) throws\
  \ Exception {\n    int digit1, digit2, digit3, digit4, number, r, total;\n    System.out.print(\"\
  Enter a four-digit integer: \");\n    number = Integer.parseInt(cin.nextLine());\n\
  \    digit1 = (int)(number / 1000);\n    r = number % 1000;\n    digit2 = (int)(r\
  \ / 100);\n    r = r % 100;\n    digit3 = (int)(r / 10);\n    digit4 = r % 10;\n\
  \    total = digit1 + digit2 + digit3 + digit4;\n    System.out.println(total);\n\
  }\n```\n\n这里是你刚刚看到的程序的跟踪表。\n\n| 步骤 | 语句 | 注释 | number | digit1 | digit2 | digit3\
  \ | digit4 | r | total |\n| --- | --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- |\n| 1 | `.print(\"Enter…` | 显示：Enter a four-digit integer: | | | | | |\
  \ | | |\n| 2 | `number = Integer.parseInt(…)` | 用户输入 6753 | 6753 | ? | ? | ? | ?\
