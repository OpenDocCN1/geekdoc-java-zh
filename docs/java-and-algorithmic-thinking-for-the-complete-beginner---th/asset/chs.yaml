  \        }\n    }\n}\n```\n\n### 34.5 数据结构中的元素搜索\n\n在计算机科学中，搜索是一种在集合中查找项的算法。在数据结构中进行搜索时，可能有两种情况：\n\
  \n- 你想在可能包含多个值的数据结构中搜索一个给定值。因此，你需要找到所有元素（或它们的索引）。\n- 你想在每个值唯一的数据结构中搜索一个给定值。因此，你只需要找到一个元素（或其索引）。\n\
  \n常用的搜索算法是：\n\n- 线性（顺序）搜索\n- 二分查找算法\n\n#### 练习 34.5-1 线性搜索 – 在可能包含相同值的一维数组中搜索\n\n\
