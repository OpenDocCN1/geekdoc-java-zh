  \        }\n    }\n    System.out.println(numberOfDivisors);\n}\n```\n\n该程序在输入值为\
  \ 20 时执行 20 次迭代。但是，如果它能执行少于一半的迭代并获得相同的结果，不是更好吗？当然可以！所以，让它更高效！\n\n你可能知道，对于任何用户提供的整数（在变量\
