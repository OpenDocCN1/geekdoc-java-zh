  19) 什么是回文数？\n\n# 第 V 部分：循环结构\n\n## 第 24 章：循环结构简介\n\n### 24.1 什么是循环结构？\n\n循环结构是一种允许在满足条件下多次执行语句或语句块的控制结构。\n\
  \n### 24.2 从顺序控制到循环结构\n\n下一个示例允许输入四个数字并计算它们的和。如你所示，还没有循环结构，只有顺序控制。\n\n```java\n\
  double x, y, z, w, total;\nx = Double.parseDouble(cin.nextLine());\ny = Double.parseDouble(cin.nextLine());\n\
  z = Double.parseDouble(cin.nextLine());\nw = Double.parseDouble(cin.nextLine());\n\
  total = x + y + z + w;\nSystem.out.println(total);\n```\n\n虽然这段代码很短，但考虑让用户输入 1000\
  \ 个数字的情况。你能想象写千次 `Double.parseDouble(cin.nextLine())` 吗？只需要写一次语句并让计算机执行千次将会方便得多。这就是循环结构大显用场的地方！\n\
  \n但在深入研究循环之前，先尝试解决这个谜题！在不使用循环结构的情况下，尝试重写之前的示例，只使用两个变量。是的，你听没错！这段代码必须计算四个数字的和，但必须使用两个变量。你能找到方法吗？\n\
  \n嗯……显然你现在正在想：“使用两个变量能做的唯一是在变量 `x` 中读取单个值，然后将该值赋予变量 `total`”。你的想法完全正确，展示如下：\n\n\
  ```java\nx = Double.parseDouble(cin.nextLine());\ntotal = x;\n```\n\n这可以等价于：\n\n\
  ```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine());\ntotal = total + x;\n\
  ```\n\n现在呢？现在实际上可以做三件事，这些是：思考、思考，当然还有思考！\n\n第一个用户数字已经存储在变量 `total` 中，所以变量 `x` 现在可以自由使用了！因此，你可以重用变量\
  \ `x` 读取第二个值，它也会累加在变量 `total` 中，如下：\n\n```java\ntotal = 0;\nx = Double.parseDouble(cin.nextLine());\n\
  total = total + x;\nx = Double.parseDouble(cin.nextLine());\ntotal = total + x;\n\
  ```\n\n![](img/notice.jpg)语句 `total = total + x` 将 `x` 的值累加到 `total` 中，这意味着它将 `x`\
  \ 的值与 `total` 中之前的任何值相。例如，如果变量 `total` 包含值 `5` 而变量 `x` 包含值 `3`，语句 `total = total\
  \ + x` 将值 `8` 赋值给变量 `total`。\n\n\n\n\n\n由于第二个用户提供的数字已经累加到变量 `total` 中，变量 `x` 可以重复使用！这个过程可以一直重复，直到四个数字都被读取并累加到变量\
  \ `total` 中。最终代码如下。请注意，它还没有使用任何循环控制结构！\n\n```\ntotal = 0;x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;x = Double.parseDouble(cin.nextLine());total = total + x;x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;x = Double.parseDouble(cin.nextLine());total = total + x;System.out.println(total);\n\
  ```\n\n![](img/notice.jpg)这段代码与本节开始时的代码被认为是等价的。然而，它们的主要区别在于后者包含了四组相同的语句。\n\n显然，你可以使用这个示例来读取并找到超过四个数字之和。然而，多次编写这些语句可能会变得非常繁琐，而且如果不小心漏掉任何一组，可能会导致错误。\n\
  \n你真正需要的是保留一组语句，但使用循环控制结构来执行四次（如果你愿意，甚至执行 1000 次）。你可以使用类似下面的代码片段。\n\n```\ntotal\
  \ = 0;execute_these_statements_4_times {x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;}System.out.println(total);\n```\n\n显然，Java 中并没有任何 `execute_these_statements_4_times`\
  \ 语句。这仅用于演示，但很快你就会学习到关于 Java 支持的所有循环控制结构的全部内容！\n\n### 24.3 复习题：判断题\n\n对下列每个陈述选择对或错。\n\
  \n1) 循环控制结构是一种允许多次执行语句或语句块的结构，直到满足指定的条件。\n2) 可以使用顺序控制结构，提示用户输入 1000 个数字，然后计算它们的总和。\n\
  3) 下面的代码片段在变量 `total` 中累加了值 10。`total = 10;a = 0;total = total + a;`\n4) 下面的 Java\
  \ 程序满足有效性属性。`public static void main(String[] args) throws Exception {int a, total;a\
  \ = 5;total = total + a;System.out.println(total);}`\n5) 下述两个代码片段都将值 5 赋值给变量 `total`。`a\
  \ = 5;total = a;`\n`total = 0;a = 5;total = total + a;`\n\n## 第 25 章\n\n前测试、中测试和后测试循环结构\n\
  \n### 25.1 前测试循环结构\n\n前测试循环结构如图图所示。\n\n![Image](img/chapter25-01.png)\n\n让我们看看当执行流到达前测试循环结构时会发生什么。如果\
  \ `Boolean_Expression` 求值为真，则执行该结构的语句或语句块，然后执行流返回并再次检查 `Boolean_Expression`。如果 `Boolean_Expression`\
  \ 再次为真，则重复该过程。当 `Boolean_Expression` 在某一点求值为假时，迭代停止，执行流退出循环。\n\n![](img/notice.jpg)决策符号（菱形）既用于决策控制结构，也用于循环控制结构。然而，在循环控制结构中，菱形的出口之一总有一个向上的方向。\n\
  \n![](img/notice.jpg)“前测试循环结构”之所以这样命名，是因为首先求值布尔表达式，然后执行该结构的语句或语句块。\n\n![](img/notice.jpg)因为布尔表达式在进入循环之前就会求值，所以前测试循环可能执行零到多次迭代。\n\
  \n![](img/notice.jpg)每次执行循环控制结构的语句或语句块时，计算机科学中的术语是“循环正在迭代”或“循环执行一次迭代”。\n\nJava 语句的通用形式是\n\
  \n```\nwhile (Boolean_Expression) {A statement or block of statements}\n```\n\n\
  下面的示例显示了从 1 到 10 的数字。\n\n![](img/my_exercise_header.png) 项目 _25.1\n```\npublic static\
  \ void main(String[] args) throws Exception {int i;i = 1;while (i <= 10) {\n\n>\
  \ System.out.println(i);\n\n> i++;\n\n}}\n```\n\n![](img/notice.jpg)就像决策控制结构一样，循环控制结构内部的语句应该缩进。\n\
  \n与决策控制结构类似，当只需要一个语句作为 while 语句的一部分时，允许省略大括号 `{ }`。因此，`while` 语句可以如下所示。\n\n```\n\
  while (Boolean_Expression)One_Single_Statement;\n```\n\n![](img/remember.jpg)为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使\
  \ `while` 语句仅包含一个语句。\n\n#### 练习 25.1-1 设计流程图并计算迭代总数\n\n为以下代码片段设计相应的流程图。这段 Java 代码执行了多少次迭代？\n\
  \n```\nint i;i = 4;while (i > 0) {i--;}System.out.println(\"The end\");\n```\n\n\
  解决方案\n\n相应的流程图片段如下。\n\n.![Image](img/chapter25-02.png)\n\n接下来，跟踪表可以帮助你观察执行流。\n\n\
  | 步骤 | 语句 | 注释 | i |  |  |\n| 1 | i = 4 | | 4 |  |  |\n| 2 | while (i > 0) | 结果为真\
  \ | 第 1 次 | 迭代 |\n| 3 | i-- | | 3 |  |  |\n| 4 | while (i > 0) | 结果为真 | 第 2 次 |\
  \ 迭代 |\n| 5 | i-- | | 2 |  |  |\n| 6 | while (i > 0) | 结果为真 | 第 3 次 | 迭代 |\n| 7\
  \ | i-- | | 1 |  |  |\n| 8 | while (i > 0) | 结果为真 | 第 4 次 | 迭代 |\n| 9 | i-- | |\
  \ 0 |  |  |\n| 10 | while (i > 0) | 结果为假 |  |  |\n| 11 | .println(\"The end\") |\
  \ 显示: The end |  |  |\n\n从跟踪表中可以看出，迭代的总数为四次。\n\n![](img/notice.jpg)当前测试循环结构的语句或语句块执行\
  \ N 次时，布尔表达式求值 N+1 次。因此，要确定迭代次数，请计算语句或语句块执行的次数，而不是布尔表达式求值的次数。\n\n#### 练习 25.1-2\
  \ 计算迭代总数\n\n这段代码执行了多少次迭代？\n\n```\nint i;i = 4;while (i >= 0) {System.out.println(i);i--;}System.out.println(\"\
  The end\");\n```\n\n解决方案\n\n这个练习与上一个几乎相同。不同在于这里的布尔表达式在 i = 0 时仍然为真。因此，它多执行了一次，即五次迭代。\n\
  \n#### 练习 25.1-3 计算迭代总数\n\n这段代码执行了多少次迭代？\n\n```\nint i;i = 1;while (i != 6) {i +=\
  \ 2;}System.out.println(\"The end\");\n```\n\n解决方案\n\n让我们创建一个跟踪表来观察执行流。\n\n| 步骤\
  \ | 语句 | 注释 | i |  |  |\n| 1 | i = 1 | | 1 |  |  |\n| 2 | while (i != 6) | 结果为真\
  \ | 第 1 次 | 迭代 |\n| 3 | i += 2 | | 3 |  |  |\n| 4 | while (i != 6) | 结果为真 | 第 2\
  \ 次 | 迭代 |\n| 5 | i += 2 | | 5 |  |  |\n| 6 | while (i != 6) | 结果为真 | 第 3 次 | 迭代\
  \ |\n| 7 | i += 2 | | 7 |  |  |\n| 8 | while (i != 6) | 结果为真 | ... | ... |\n| 9\
  \ | … | … | |\n\n从跟踪表中可以看出，由于值 6 从未被赋值给变量 i，这段代码将无限迭代下去！显然，这段代码不满足有限性属性。\n\n####\
  \ 练习 25.1-4 计算迭代总数\n\n这段代码执行了多少次迭代？\n\n```\nint i;i = -10;while (i > 0) {System.out.println(i);i--;}System.out.println(\"\
  The end\");\n```\n\n解决方案\n\n最初，值 -10 被赋值给变量 i。布尔表达式直接求值为假，执行流直接进入 System.out.println(\"\
  The end\") 语句。因此，这段代码执行了零次迭代。\n\n#### 练习 25.1-5 寻找四个数字之和\n\n\n\n\n使用前测试循环结构，编写一个\
  \ Java 程序，让用户输入四个数字，然后计算并显示它们的总和。\n\n##### 解决方案\n\n你还记得第 24.2 节中计算四个数字之数的示例吗？在最后，经过简单的处理后，提议的代码片段变成了：\n\
  \n```java\ntotal = 0;execute_these_statements_4_times {x = Double.parseDouble(cin.nextLine());total\
  \ = total + x;}System.out.println(total);\n```\n\n现在，你需要一种方法用真实的 Java 语句来“呈现”`execute_these_statements_4_times`\
  \ 语句。`while` 语句可以实现，但你需要额外的变量来计数迭代的总数。这样，当执行了所需的迭代次数后，执行流将退出循环。\n\n下面是一个通用的代码片段，它按照\
  \ `total_number_of_iterations` 指定的次数进行迭代：\n\n```java\ni = 1;while ( i <= total_number_of_iterations\
  \ ) {A statement or block of statementsi++;}\n```\n\n其中 `total_number_of_iterations`\
  \ 可以是一个常量值，甚至是一个变量或表达式。\n\n将此代码片段与之前的结合后，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-5\n```java\npublic static void main(String[] args) throws Exception\
  \ {double total, x;int i;total = 0;i = 1;while (i <= 4) {\n\n> x = Double.parseDouble(cin.nextLine());\
  \   \n\n> total = total + x;\n\n> i++;\n\n}System.out.println(total);}\n```\n\n\
  ![](img/notice.jpg)变量 `i` 的名称并不是固定的。你可以使用任何你喜欢的变量名，例如 `counter`、`count`、`k` 等。\n\
  \n#### 练习 25.1-6 寻找奇数之和\n\n设计一个流程图并编写相应的 Java 程序，让用户输入 20 个整数，然后计算并显示奇数的总和。\n\n\
  ##### 解决方案\n\n这非常简单。程序在循环内部必须做的是检查用户提供的数字是否为奇数，如果是奇数，则必须将该数字累加到变量 `total` 中；偶数则必须忽略。流程图如下。它包含一个嵌套在前测试循环结构中的单分支决策结构。\n\
  \n![Image](img/chapter25-03.png)\n\n对应的 Java 程序如下：\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-6\n```java\npublic static void main(String[] args) throws Exception\
  \ {int total, i, x;total = 0;i = 1;while (i <= 20) {\n\n> x = Integer.parseInt(cin.nextLine());\n\
  \n> if (x % 2 != 0) {\n\n> > total += x;    //这等同于 total = total + x\n\n> }\n\n\
  > i++;\n\n}System.out.println(total);}\n```\n\n![](img/notice.jpg)可以将任何决策控制结构嵌套在任何循环控制结构中，只要保持它们在语法和逻辑上都是正确的。\n\
  \n#### 练习 25.1-7 寻找 N 个数之和\n\n编写一个 Java 程序，让用户输入 N 个数字，然后计算并显示它们的总和。N 的值必须在程序开始时由用户提供。\n\
  \n##### 解决方案\n\n在这个练习中，迭代的总次数取决于用户必须输入的值。下面是一个迭代 N 次的通用代码片段，其中 N 由用户提供。\n\n```java\n\
  n = Integer.parseInt(cin.nextLine());i = 1;while (i <= n) {A statement or block\
  \ of statementsi++;}\n```\n\n根据你目前为止学到的知识，最终程序变为：\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-7\n```java\npublic static void main(String[] args) throws Exception\
  \ {int n, i;double x, total;total = 0;n = Integer.parseInt(cin.nextLine());i = 1;while\
  \ (i <= n) {\n\n> x = Double.parseDouble(cin.nextLine());\n\n> total += x;\n\n>\
  \ i++;\n\n}System.out.println(total);}\n```\n\n#### 练习 25.1-8 寻找未知数量数字之和\n\n编写一个\
  \ Java 程序，让用户重复输入整数值，直到输入值 -1 为止。数据输入完成后，必须显示所输入数字之和。（最终总和中不能包含 -1 的值）。接下来，创建一个跟踪表，检查使用\
  \ 10、20、5 和 -1 作为输入值时你的程序是否正常运行。\n\n##### 解决方案\n\n在这个练习中，迭代的总次数是未知的。如果你使用决策控制结构，你的程序看起来像下面的代码片段：\n\
  \n```java\ntotal = 0;x = Integer.parseInt(cin.nextLine());if (x != -1) {  //检查变量\
  \ x\n              total += x;   //并执行此语句\nx = Integer.parseInt(cin.nextLine());\
  \  //再执行这个\nif (x != -1) {  //检查变量 x\n\n> total += x;   //并执行此语句\n\n> x = Integer.parseInt(cin.nextLine());\
  \ //再执行这个\n\n> > ...\n\n```\n\n现在，让我们用循环来重写这个程序。最终程序如下所示：\n\n```\n\n![](img/my_exercise_header.png)\
  \ Project_25.1-8\npublic static void main(String[] args) throws Exception {int total,\
  \ x;total = 0;x = Integer.parseInt(cin.nextLine());while (x != -1) {\n\n> total\
  \ += x;\n\n}System.out.println(total);}\n```\n\n现在让我们使用 10、20、5 和 -1 作为输入创建一个跟踪表，以确定该程序是否正常运行。\n\
  \n| 步骤 | 语句 | 注意 | x | total |\n| --- | --- | --- | --- | --- |\n| 1 | total = 0;\
  \ | | | 0 |\n| 2 | x = Integer.parseInt(cin.nextLine()); | | 10 | 0 |\n| 3 | if\
  \ (x != -1) { | 为真 | 10 | 0 |\n| 4 | total += x; | | 10 | 10 |\n| 5 | x = Integer.parseInt(cin.nextLine());\
