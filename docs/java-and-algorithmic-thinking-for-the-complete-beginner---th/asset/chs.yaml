  \ 8.472940 cubic feet\n\niii) 找出并显示所有物品的总体积（立方英尺）。\niv) 找出并显示体积最大的箱子的描述。\n\n请记住，1\
  \ 立方英尺等于 1728 立方英寸。\n\n5) 编写一个 Java 程序，提示用户输入两个文件的文件名。该程序必须合并这两个文件的内容，并将合并后的文本写入名为\
