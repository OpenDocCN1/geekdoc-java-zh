  \ 程序，提示用户输入一条消息，然后统计并显示消息中元音、辅音和阿拉伯字符的数量。\n\n## 第 27 章：嵌套循环控制结构\n\n### 27.1 什么是嵌套循环？\n\
  \n嵌套循环是一个循环中的另一个循环，换句话说，外层循环中的内层循环。\n\n外层循环控制内循环完整迭代的次数。这意味着外层循环的第一次迭代触发内循环迭代直到完成。然后，外层循环的第二次迭代再次触发内循环迭代直到完成。这个过程一直重复，直到外层循环执行所有的迭代。\n\
  \n以以下 Java 程序为例。\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int i, j;\n    for (i = 1; i <= 2; i++) {\n        for (j = 1; j <= 3;\
  \ j++) {\n            System.out.println(i + \"  \" + j);\n        }\n    }\n}\n\
  ```\n\n在这个程序中，由变量 `i` 控制的外层循环决定了内循环执行的完整迭代次数。具体来说，当变量 `i` 为 1 时，内循环执行三次迭代（`j = 1`、`j\
  \ = 2` 和 `j = 3`）。在完成内循环后，外层循环需要再执行一次迭代（`i = 2`）。因此，内循环重启，再次执行三次新的迭代（`j = 1`、`j\
  \ = 2` 和 `j = 3`）。\n\n上一个示例与下面的类似：\n\n```java\ni = 1; // 外层循环给变量 i 赋值 1\nfor (j\
  \ = 1; j <= 3; j++) { // 内循环执行三次\n    System.out.println(i + \"  \" + j);\n}\ni\
  \ = 2; // 外层循环给变量 i 赋值 2\nfor (j = 1; j <= 3; j++) { // 内循环重新开始并执行三次新的迭代\n    System.out.println(i\
  \ + \"  \" + j);\n}\n```\n\n输出结果如下：\n```\n1  1\n1  2\n1  3\n2  1\n2  2\n2  3\n```\n\
  \n只要不违反语法规则，你可以根据需要嵌套任意数量的循环控制结构。出于实际考虑，当你移动到四层或五层时，整个结构会变得复杂难以理解。经验表明，嵌套三层或四层是内循环和外层循环可能的最大类型。\n\
  \n#### 练习 27.1：统计总迭代次数\n\n下面的代码片段确定 `a` 在结束时的值。\n\n```java\nint a, i, j;\na = 1;\n\
  i = 5;\nwhile (i < 7) {\n    for (j = 1; j <= 3; j++) {\n        a = a * j;\n  \
  \  }\n    i++;\n}\nSystem.out.println(a);\n```\n\n追踪表所示：\n\n| 步骤 | 语句 | a | i |\
  \ j | 注释 |\n| --- | --- | --- | --- | --- | --- |\n| 1 | `a = 1;` | 1 | | | 初始化\
  \ |\n| 2 | `i = 5;` | 1 | 5 | | 初始化 |\n| 3 | `while (i < 7)` | 1 | 5 | | 为真 |\n\
  | 4 | `j = 1;` | 1 | 5 | 1 | |\n| 5 | `j <= 3` | 1 | 5 | 1 | 为真 |\n| 6 | `a = a\
  \ * j;` | 1 | 5 | 1 | 1 * 1 = 1 |\n| 7 | `j++` | 1 | 5 | 2 | |\n| 8 | `j <= 3` |\
  \ 1 | 5 | 2 | 为真 |\n| 9 | `a = a * j;` | 2 | 5 | 2 | 1 * 2 = 2 |\n| 10 | `j++` |\
  \ 2 | 5 | 3 | |\n| 11 | `j <= 3` | 2 | 5 | 3 | 为真 |\n| 12 | `a = a * j;` | 6 | 5\
  \ | 3 | 2 * 3 = 6 |\n| 13 | `j++` | 6 | 5 | 4 | |\n| 14 | `j <= 3` | 6 | 5 | 4 |\
  \ 为假 |\n| 15 | `i++` | 6 | 6 | | |\n| 16 | `while (i < 7)` | 6 | 6 | | 为真 |\n| 17\
  \ | `j = 1;` | 6 | 6 | 1 | |\n| 18 | `j <= 3` | 6 | 6 | 1 | 为真 |\n| 19 | `a = a\
  \ * j;` | 6 | 6 | 1 | 6 * 1 = 6 |\n| 20 | `j++` | 6 | 6 | 2 | |\n| 21 | `j <= 3`\
  \ | 6 | 6 | 2 | 为真 |\n| 22 | `a = a * j;` | 12 | 6 | 2 | 6 * 2 = 12 |\n| 23 | `j++`\
  \ | 12 | 6 | 3 | |\n| 24 | `j <= 3` | 12 | 6 | 3 | 为真 |\n| 25 | `a = a * j;` | 36\
  \ | 6 | 3 | 12 * 3 = 36 |\n| 26 | `j++` | 36 | 6 | 4 | |\n| 27 | `j <= 3` | 36 |\
  \ 6 | 4 | 为假 |\n| 28 | `i++` | 36 | 7 | | |\n| 29 | `while (i < 7)` | 36 | 7 | |\
  \ 为假 |\n| 30 | `System.out.println(a);` | 36 | | | 输出 36 |\n\n\n\n\n程序结束时，变量 `a`\
  \ 包含值 93。\n\n### 27.2 适用于嵌套循环的规则\n\n除了适用于 for 循环的四条规则（在第 26.2 节中介绍）之外，在编写嵌套循环程序时，你必须遵循两条额外的规则，因为这些规则可以避免产生意外的副作用。\n\
  \n- **规则 1**：内部循环必须完全在外部循环内部开始并结束，这意味着循环不能重叠。\n- **规则 2**：外部循环和内层（嵌套）循环不能使用同一个计数器变量。\n\
  \n#### 练习 27.2-1 违反第一规则\n\n设计一个违反嵌套循环第一规则的流程图片段，该规则规定：“内部循环必须完全在外部循环内部开始并结束”。\n\n\
  ##### Solution\n\n下面的流程图片段违反了嵌套循环的第一规则。\n\n![Image](img/chapter27-02.png)\n\n如果你尝试跟踪执行流，你会发现它顺利地执行了\
  \ `5 × 10 = 50` 次迭代。没有人能看出这个流程图是错误的。事实上，它在技术上是正确的。然而，问题在于它的可读性。极难辨别这个流程图意图实现什么。此外，这种结构与你学过的任何熟悉的循环控制结构都不匹配，因此无法将其直接转换为\
  \ Java 程序。尽量避免使用这种嵌套循环！\n\n#### 练习 27.2-2 违反第二规则\n\n找出消息“Hello”显示的次数。\n\n```java\n\
  for (i = 1; i <= 3; i++) {\n    for (i = 5; i >= 1; i--) {\n        System.out.println(\"\
  Hello\");\n    }\n}\n```\n\n##### Solution\n\n从表面上看，人们会认为“Hello”一词显示了 `3 × 5 = 15`\
  \ 次。然而，仔细观察会发现情况并非如表面看起来那样。这个程序违反了嵌套循环的第二规则，该规则规定：“外部循环和内层（嵌套）循环不能使用同一个计数器变量”。让我们设计相应的流程图。\n\
  \n![Image](img/chapter27-03.png)\n\n如果你尝试跟踪此流程图片段的执行流，你可以看到当内部循环完成所有五次迭代时，变量 `i`\
  \ 包含值 `0`。然后，变量 `i` 递增 `1`，外部循环再次重复。这个过程可以永远持续，因为变量 `i` 永远无法超过外部循环布尔表达式要求的值 `3`。因此，消息“Hello”显示了无限次。\n\
  \n### 27.3 复习题：判断对错\n\n对下列每个陈述选择对或错。\n\n1) 嵌套循环是外部循环内部的内部循环。\n2) 可以将中测试循环结构嵌套在预测试循环结构中。\n\
