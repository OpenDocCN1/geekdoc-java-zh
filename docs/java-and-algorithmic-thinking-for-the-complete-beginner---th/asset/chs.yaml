  \ {\n        System.out.println(\"Odd\");\n    }\n}\n```\n\n## 练习 23.1-3 收费员在哪里？\n\
  \n在收费站口，有一个自动系统可以识别通过的车辆是摩托车、汽车还是卡车。编写一个 Java 程序，让用户输入车辆类型（M 代表摩托车，C 代表汽车，T 代表卡车），然后根据下表所示显示驾驶员必须支付的相应金额。\n\
  \n| 车辆类型 | 支付金额 |\n| --- | --- |\n| 摩托车 | $1 |\n| 汽车 | $2 |\n| 卡车 | $4 |\n\n即使在输入小写字母时，程序也必须正常运行。例如，程序对于“M”或“m”都必须正常运行。然而，如果用户输入除\
  \ M、C 或 T 以外的字符（大写或小写），则必须显示错误信息。\n\n（更多关于数据验证的练习！）\n\n##### 解决方案\n\n问题的解决方案非常简单。唯一需要注意的是，用户可能会输入大写字母\
  \ M、C 或 T，或者小写字母 m、c 或 t。程序需要接受这两种。为了处理这种情况，你可以使用 `toUpperCase()` 方法将用户的输入转换为大写。然后，你只需要检查大写的\
  \ M、C 或 T 字符即可。\n\nJava 程序所示。\n\n![](img/my_exercise_header.png) Project_23.1-3a\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    String v;\n\
  \    v = cin.nextLine().toUpperCase();\n    // 你只需要检查大写的 M, C, 和 T\n    if (!v.equals(\"\
  M\") && !v.equals(\"C\") && !v.equals(\"T\")) {\n        System.out.println(\"Invalid\
  \ vehicle\");\n    } else if (v.equals(\"M\")) {\n        System.out.println(\"\
  You need to pay $1\");\n    } else if (v.equals(\"C\")) {\n        System.out.println(\"\
  You need to pay $2\");\n    } else if (v.equals(\"T\")) {\n        System.out.println(\"\
  You need to pay $4\");\n    }\n}\n```\n\n![](img/notice.jpg) 注意 Java 如何将用户的输入转换为大写。\n\
  \n![](img/notice.jpg) 表达式 `!v.equals(\"M\")` 等于表达式 `v.equals(\"M\") == false`，表达式\
  \ `v.equals(\"M\")` 等于表达式 `v.equals(\"M\") == true`。\n\n然而，如果你将多重选择结构的第一种情况移动到末尾，这个练习可以稍微更高效地解决，所示。\n\
