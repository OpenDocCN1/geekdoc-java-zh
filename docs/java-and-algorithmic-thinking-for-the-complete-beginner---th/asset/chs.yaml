  \n## 第 22 章\n\n决策控制结构的技巧与窍门\n\n### 22.1 引言\n\n本章旨在向你介绍一些可以帮助写出“更好”代码的实用技巧。在设计自己的算法、甚至是编写自己的\
  \ Java 程序时，你应该始终记住这些技巧。\n\n这些技巧可以帮助你提高代码的可读性，并让代码更短甚至运行得更快。当然，没有单一完美的方法论，因为在某些情况下使用特定技巧可能有帮助，但在另一些情况下同样的技巧可能会产生恰恰相反的结果。大多数时候，代码优化取决于编程经验。\n\
  \n![](img/remember.jpg)较小的算法并不总是解决给定问题的最佳方案。为了解决特定问题，你可能会写一个非常短的算法，但的是它证明会消耗大量的\
  \ CPU 时间。另一方面，你也可以用另一个算法解决同一个问题，尽管它看起来更长，但计算结果要快得多。\n\n### 22.2 选择决策控制结构\n\n下面的图可以帮助你根据检查的变量数量，判断哪种决策控制结构是针对给定问题的更好选择。\n\
  \n![Image](img/chapter22-01.png)\n\n![](img/notice.jpg)此图推荐的是最佳选项，而非唯一选项。例如，当一个变量有超过两种情况时，使用嵌套的决策控制结构并不是错误的。不过，所提的多分支决策结构和提议的分类决策结构更加方便。\n\
  \n### 22.3 精简决策控制结构\n\n仔细观察下面以一般形式给出的流程图片段。\n\n![Image](img/chapter22-02.png)\n\n\
  如你所见，在双分支决策结构的两条路径开头都存在相同的语句或语句块，在末尾也存在另外两个相同的语句或语句块。这意味着无论 `Boolean_Expression`\
  \ 的结果如何，这些语句都会执行。因此，你可以简单地将它们移动到外部，并分别放在双分支决策结构的正之前和正之后，如这个等效结构所示。\n\n![Image](img/chapter22-03.png)\n\
  \n![](img/notice.jpg)同样的技巧可以适用于任何决策控制结构，只要所有路径中都存在相同的语句或语句块。\n\n![](img/notice.jpg)在某些情况下无法应用此技巧。例如，如果一个语句（或语句块）影响了结构的布尔表达式，那么你就无法将其移动到决策控制结构正之前。\n\
  \n你仍然感到困惑吗？接下来，你将看到一些可以帮助你更好理解的练习。\n\n#### 练习 22.3-1 “缩小”算法\n\n使用更少的语句重新设计下面的流程图。\n\
  \n![Image](img/chapter22-04.png)\n\n解答\n\n如你所示，语句 `y ← a * 2` 存在于双分支决策结构的两条路径中。这意味着无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将该语句移动到外部并在双分支决策结构的正之前，如下。\n\
  \n![Image](img/chapter22-05.png)\n\n#### 练习 22.3-2 “缩小”Java 程序\n\n使用更少的语句重写下面的 Java\
  \ 程序。\n\n```java\npublic static void main(String[] args) throws Exception {\n  \
  \  int a, y;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n    \
  \    y = a * 4;\n        System.out.println(y);\n    } else {\n        y = a * 3;\n\
  \        System.out.println(y);\n    }\n}\n```\n\n解答\n\n如你所见，语句 `System.out.println(y)`\
  \ 存在于双分支决策结构的两条路径中。这意味着无论布尔表达式的结果如何，该语句都会执行。因此，你可以简单地将语句移动到外部并在双分支决策结构的正之后，如下所示。\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    int a,\
  \ y;\n    a = Integer.parseInt(cin.nextLine());\n    if (a > 0) {\n        y = a\
  \ * 4;\n    } else {\n        y = a * 3;\n    }\n    System.out.println(y);\n}\n\
  ```\n\n#### 练习 22.3-3 “缩小”算法\n\n使用更少的语句重新设计下面的流程图，然后编写 Java 程序。\n\n![Image](img/chapter22-06.png)\n\
  \n解答\n\n如果你尝试将输出语句移动到多分支结构外部，得到的流程图绝对与初始的等等。\n\n![Image](img/chapter22-07.png)\n\
  \n这是因为右侧的最后一条路径在初始流程图中并没有包含输出语句。\n\n![](img/remember.jpg)同理。\n\n你现在可能想知道是否有其他方法可以将输出语句移动到结构外部。答案是肯定的，但你需要稍微重新调整流程图。你需要完全移除右侧的最后路径，并在开头使用一个新的决策控制结构来检查用户提供的数字是否正确。一种可能的解决方案所示。\n\
  \n![Image](img/chapter22-08.png)\n\n对应的 Java 程序为\n\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    double a, y;\n    a = Double.parseDouble(cin.nextLine());\n\
  \    if (a >= 30) {\n        System.out.println(\"Wrong Number\");\n    } else {\n\
  \        if (a < 10) {\n            y = a * 2;\n        } else if (a < 20) {\n \
  \           y = a / 2;\n        } else {\n            y = a + 2;\n        }\n  \
  \      System.out.println(y);\n    }\n}\n```\n\n### 22.4 逻辑运算符——用还是不用：这是一个问题！\n\n\
  在某些情况下，你可以使用逻辑运算符代替嵌套的决策控制结构，这可以提高可读性。看看下面以一般形式给出的流程图片段。\n\n![Image](img/chapter22-09.png)\n\
  \n如你所见，只有当两个布尔表达式都为真时，才会执行语句或语句块 1。在所有其他情况下都会执行语句或语句块 2。因此，这个流程图片段可以使用与逻辑运算符进行重新设计。\n\
  \n![Image](img/chapter22-10.png)\n\n\n\n\n\n现在，让我们来看另一个以一般形式给流程图片段。\n\n![Image](img/chapter22-11.png)\n\
  \n在这个流程图片段中，当 `Boolean_Expression_1` 结果真或 `Boolean_Expression_2` 结果真时，将执行语句或语句块\
  \ `2`。因此，你可以使用 `OR` 逻辑运算符来重新设计这个流程图片段，如下所示。\n\n![Image](img/chapter22-12.png)\n\n\
  ![](img/notice.jpg)显然，这些方法也可以适用于嵌套的决策控制结构。\n\n#### 练习 22.4-1 重写代码\n\n使用逻辑运算符重写以下\
  \ Java 程序。\n\n```java\npublic static void main(String[] args) throws Exception {String\
  \ today, name;today = cin.nextLine();name = cin.nextLine();if (today.equals(\"February\
  \ 16\") == true) {\n    if (name.equals(\"Loukia\") == true) {\n        System.out.println(\"\
  Happy Birthday!!!\");\n    }\n    else {\n        System.out.println(\"No match!\"\
  );\n    }\n}else {\n    System.out.println(\"No match!\");\n}}\n```\n\n解\n\n`System.out.println(\"\
  Happy Birthday!!!\")` 语句仅在两个布尔表达式都为真时才执行。`System.out.println(\"No match!\")` 语句在所有其他情况下执行。因此，你可以使用\
  \ `AND ( && )` 逻辑运算符重写该 Java 程序。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {String today, name;today = cin.nextLine();name = cin.nextLine();if\
  \ (today.equals(\"February 16\") == true && name.equals(\"Loukia\") == true) {\n\
  \    System.out.println(\"Happy Birthday!!!\");\n}else {\n    System.out.println(\"\
  No match!\");\n}}\n```\n\n#### 练习 22.4-2 重写代码\n\n使用逻辑运算符重写以下 Java 程序。\n\n```java\n\
  public static void main(String[] args) throws Exception {int a, b, y;a = Integer.parseInt(cin.nextLine());b\
  \ = Integer.parseInt(cin.nextLine());y = 0;if (a > 10) {\n    y++;\n}else if (b\
  \ > 20) {\n    y++;\n}else {\n    y--;\n}System.out.println(y);}\n```\n\n解\n\n当变量\
  \ `a` 大于 10 或变量 `b` 大于 20 时，执行 `y++` 语句。因此，你可以使用 `OR ( || )` 逻辑运算符重写该 Java 程序。\n\
  \n```java\npublic static void main(String[] args) throws Exception {int a, b, y;a\
  \ = Integer.parseInt(cin.nextLine());b = Integer.parseInt(cin.nextLine());y = 0;if\
  \ (a > 10 || b > 20) {\n    y++;\n}else {\n    y--;\n}System.out.println(y);}\n\
  ```\n\n### 22.5 合并两个多个单分支决策结构\n\n有时，你可能会设计一个包含两个或多个连续单分支决策结构的算法，每个结构都评估相同的布尔表达式。这里显示了一个示例。\n\
  \n![Image](img/chapter22-13.png)\n\n当出现这种情况时，你可以直接将所有的单分支决策结构合并为一个，如下所示。\n\n![Image](img/chapter22-14.png)\n\
  \n![](img/remember.jpg)单分支决策结构需要相互相邻。如果它们之间存在任何语句，除非你能够将该语句移动到代码的其他地方，否则你就无法合并它们。\n\
  \n#### 练习 22.5-1 合并决策控制结构\n\n在以下 Java 程序中，合并单分支决策结构。\n\n```java\npublic static void\
  \ main(String[] args) throws Exception {int a;a = Integer.parseInt(cin.nextLine());if\
  \ (a > 0) {\n    System.out.println(\"Hello\");\n}if (a > 0) {\n    System.out.println(\"\
  Hermes\");\n}}\n```\n\n解\n\n第一个和第二个决策控制结构评估的是完全相同的布尔表达式，因此它们可以简单地合并为一个。\n\nJava\
  \ 程序变为：\n\n```java\npublic static void main(String[] args) throws Exception {int\
  \ a;a = Integer.parseInt(cin.nextLine());if (a > 0) {\n    System.out.println(\"\
  Hello\");\n    System.out.println(\"Hermes\");\n}}\n```\n\n#### 练习 22.5-2 合并决策控制结构\n\
  \n在以下 Java 程序中，尽可能合并多的单分支决策结构。\n\n```java\npublic static void main(String[] args)\
  \ throws Exception {int a, y, b;a = Integer.parseInt(cin.nextLine());y = 0;if (a\
  \ > 0) {\n    y += a + 1;\n}b = Integer.parseInt(cin.nextLine());if (!(a <= 0))\
  \ {\n    System.out.println(\"Hello Hera\");\n}a++;if (a > 0) {\n    System.out.println(\"\
  Hallo Welt\");\n}System.out.println(y);}\n```\n\n解\n\n通过仔细检查，很明显地看出第一个和第二个决策控制结构评估的是完全相同的布尔表达式。具体来说，否定\
  \ `a > 0` 得到 `a <= 0`，而对 `a <= 0` 进行再次否定（使用 `NOT` 运算符）则得到 `a > 0`。\n\n![](img/remember.jpg)两次否定得肯定。\n\
  \n然而，在第一个和第二个决策控制结构之间存在语句 `b = Integer.parseInt(cin.nextLine())`，这阻止了你将它们合并为一个。\n\
  \n另一方面，在第二个和第三个决策控制结构之间存在语句 `a++`，这也阻止了你合并，因为它影响了后续的流程。\n\n最终的 Java 程序如下。\n\n```java\n\
  public static void main(String[] args) throws Exception {int a, b, y;a = Integer.parseInt(cin.nextLine());b\
  \ = Integer.parseInt(cin.nextLine());y = 0;if (a > 0) {\n    y += a;\n}System.out.println(\"\
  Hello Hera\");\n}a++;if (a > 0) {\n    System.out.println(\"Hallo Welt\");\n}System.out.println(y);}\n\
  ```\n\n### 22.6 用双分支决策结构替换两个单分支决策结构\n\n看下一个例子。\n\n```java\nif (x > 40) {//Do something}\n\
  if (x <= 40) {//Do else}\n```\n\n第一个决策结构评估 `x` 以测试它是否大于 40，紧接着第二个决策结构再次评估该变量以测试它是否小于或等于\
  \ 40。\n\n这是初学者程序员犯的一个非常常见的“错误”。他们使用了两个单分支决策结构，尽管一个双分支决策结构就能完成相同的工作。\n\n之前的示例可以使用一个双分支决策结构进行重写，如下所示。\n\
  \n```java\nif (x > 40) {//Do something}\nelse {//Do else}\n```\n\n尽管这两个例子都完全正确且运行良好，但第二种更好。CPU\
  \ 只需要评估一个布尔表达式，从而产生更执行速度。\n\n![](img/notice.jpg)两个单分支决策结构必须相互相邻。如果它们之间存在任何语句，除非你能够将该语句移动到代码的其他地方，否则你就无法“合并”它们（即替换为双分支决策结构）。\n\
  \n#### 练习 22.6-1 “合并”决策控制结构\n\n在以下 Java 程序中，尽可能合并多的单分支决策结构。\n\n```java\npublic static\
  \ void main(String[] args) throws Exception {int a, y, b;a = Integer.parseInt(cin.nextLine());y\
  \ = 0;if (a > 0) {\n    y += a;\n}b = Integer.parseInt(cin.nextLine());if (!(a >\
  \ 0)) {\n    System.out.println(\"Hello Zeus\");\n}if (y > 0) {\n    System.out.println(y\
  \ + 5);\n}y += a;if (y <= 0) {\n    System.out.println(y + 12);\n}}\n```\n\n解\n\n\
  \n\n\n第一个决策控制结构评估变量 `a` 以测试它是否大于零，紧随其后的第二个决策控制结构再次评估变量 `a` 以测试它是否不大于零。尽管它们之间存在语句\
  \ `b = Integer.parseInt(cin.nextLine())`，但该语句可以移动到其他地方，因为它并不会影响执行流的其余部分。因此，第一个和第二个决策控制结构可以合并！\n\
  \n另一方面，在第三和第四决策控制结构之间存在语句 `y += a`，这阻止了你的合并。该语句无法移动到任何地方，因为它确实影响了执行流的其余部分（第三和第四决策控制结构依赖于此语句）。因此，第三和第四决策控制结构不能合并！\n\
  \n最终的 Java 程序变为：\n\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    int a, b, y;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    y = 0;\n    if (a > 0) {\n        y += a;\n    } else {\n        System.out.println(\"\
  Hello Zeus\");\n    }\n    if (y > 0) {\n        System.out.println(y + 5);\n  \
  \  }\n    y += a;\n    if (y <= 0) {\n        System.out.println(y + 12);\n    }\n\
  }\n```\n\n### 22.7 将最可能为布尔表达式放在最前面\n\n多分支结构和 case 决策结构通常在决定执行哪个语句或语句块之前需要检查几个布尔表达式。在下一个决策控制结构中：\n\
  \n```java\nif (Boolean_Expression_1) {\n    A statement or block of statements 1\n\
  } else if (Boolean_Expression_2) {\n    A statement or block of statements 2\n}\
  \ else if (Boolean_Expression_3) {\n    A statement or block of statements 3\n}\n\
  ```\n\n程序首先测试 `Boolean_Expression_1` 是否为真。如果不是，测试 `Boolean_Expression_2` 是否为真，如果不是，再测试\
  \ `Boolean_Expression_3`。然而，如果 `Boolean_Expression_1` 大多数情况下为假而 `Boolean_Expression_3`\
  \ 大多数情况下为真呢？这意味着在测试通常为真的 `Boolean_Expression_3` 之前，浪费时间去测试通常为假的 `Boolean_Expression_1`。\n\
  \n为了让你的程序更高效，你可以将最可能为真的布尔表达式放在开头，最可能为假的布尔表达式放在结尾，如下：\n\n```java\nif (Boolean_Expression_3)\
  \ {\n    A statement or block of statements 3\n} else if (Boolean_Expression_2)\
  \ {\n    A statement or block of statements 2\n} else if (Boolean_Expression_1)\
  \ {\n    A statement or block of statements 1\n}\n```\n\n![](img/remember.jpg) 虽然这种更改看起来可能并不重要，但你节省的每一点时间都可以累积，让你的程序运行得更快、更高效。\n\
  \n#### 练习 22.7-1 重新排列布尔表达式\n\n根据研究，美国最喜欢的宠物是狗，猫第二，豚鼠紧随，鹦鹉最后。在下面的 Java 程序中，重新排列布尔表达式以使程序在大多数情况下运行得更快、更高效。\n\
  \n```java\npublic static void main(String[] args) throws Exception {\n    String\
  \ kind;\n    System.out.print(\"What is your favorite pet? \");\n    kind = cin.nextLine();\n\
  \    switch (kind) {\n        case \"Parrots\":\n            System.out.println(\"\
  It screeches!\");\n            break;\n        case \"Guinea pig\":\n          \
