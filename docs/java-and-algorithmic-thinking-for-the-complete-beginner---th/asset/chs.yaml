  }\n```\n\n#### 练习 34.4-7 选择排序算法 – 排序一维数组\n\n编写一个代码段，使用选择排序算法将数组元素按升序排序。假设数组包含数值。\n\
  \n##### 解决方案\n\n选择排序算法对于大规模数据来说效率低下，正如泡排序算法一样，但它的性能通常优于后者。它是所有排序算法中最简单的，并且在主内存（RAM）有限的计算机系统中表现良好。\n\
  \n\n\n该算法找到数组中最小（或最大，取决于排序顺序）的元素，并将其内容与位置 `0` 处的内容交换。然后对数组的剩余部分重复此过程；找到下一个最小（或最大）元素并将其放入下一个位置，直到所有元素都经过检查完毕。\n\
  \n例如，让我们尝试对以下数组进行升序排序。\n\n![Image](img/chapter34-20.png)\n\n最低值是数值 `4`，位于位置 `4`。根据选择排序算法，该元素与位置\
  \ `0` 处的元素交换内容。数组 `A` 变为：\n\n![Image](img/chapter34-21.png)\n\n数组剩余部分（索引位置 `1` 到\
  \ `5`）中的最小值是数值 `9`，位于位置 `5`。该元素与位置 `1` 处的元素交换内容。数组 `A` 变为：\n\n![Image](img/chapter34-22.png)\n\
  \n数组剩余部分（索引位置 `2` 到 `5`）中的最小值是数值 `18`，位于位置 `4`。该元素与位置 `2` 处的元素交换内容。数组 `A` 变为：\n\n\
  ![Image](img/chapter34-23.png)\n\n按照相同的方法，下一个低值是数值 `19`，位于位置 `5`。数组 `A` 变为：\n\n\
  ![Image](img/chapter34-24.png)\n\n下一个低值是数值 `36`，位于位置 `5`。该元素与位置 `4` 处的元素交换内容，数组\
  \ `A` 最终完成了升序排序！\n\n![Image](img/chapter34-25.png)\n\n现在，让我们来编写相应的 Java 程序。使用“从内层到外”的方法是为了帮助你更好地理解整个过程。下一个代码片段找到最小元素，然后将其内容与位置\
  \ `0` 处的内容交换。请注意，这是内层（嵌套）循环控制结构。假设变量 `m` 包含值 `0`。\n\n```\nminimum = a[m];\nindexOfMin\
  \ = m;\nfor (n = m; n <= ELEMENTS - 1; n++) {\n    if (a[n] < minimum) {\n     \
  \   minimum = a[n];\n        indexOfMin = n;\n    }\n}\n//找到最小值！现在交换值。\ntemp = a[m];\n\
  a[m] = a[indexOfMin];\na[indexOfMin] = temp;\n```\n\n现在，为了对数组的所有元素重复此过程，你可以将此代码片段嵌套在一个遍历所有元素的\
  \ for 循环中。按升序排序数组的最终选择排序算法如下：\n\n```\nfor (m = 0; m <= ELEMENTS - 1; m++) {\n  \
  \  minimum = a[m];\n    indexOfMin = m;\n    for (n = m; n <= ELEMENTS - 1; n++)\
  \ {\n        if (a[n] < minimum) {\n            minimum = a[n];\n            indexOfMin\
  \ = n;\n        }\n    }\n    temp = a[m];\n    a[m] = a[indexOfMin];\n    a[indexOfMin]\
  \ = temp;\n}\n```\n\n![](img/notice.jpg)如果你想按降序排序数组，你只需要搜索最大值而不是最小值。\n\n![](img/remember.jpg)就像冒泡排序算法一样，为了使用选择排序算法对字母数字数据进行排序，你只需将布尔表达式\
  \ `a[n] < minimum` 替换为表达式 `a[n].compareTo(minimum) < 0`。\n\n### 练习 34.4-8 在保持与第二个数组关系的同时对一维数组排序\n\
