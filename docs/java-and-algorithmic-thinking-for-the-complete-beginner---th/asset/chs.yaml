  \ 100。进行除法是必要的，因为用户输入的是 0 到 100 范围内的折扣值。注意——结果不是最终价格，而仅仅是折扣金额。\n\n最终折扣后价格可以通过从初始折前价格中减去你之前计算出的折扣金额来获得。\n\
  \n```java\n![](img/my_exercise_header.png)\nProject_10.1-6\npublic static void main(String[]\
  \ args) throws Exception {\n    int discount;\n    double discountAmount, priceAfterDiscount,\
