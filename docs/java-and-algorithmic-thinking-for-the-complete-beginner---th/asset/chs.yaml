  \ `ax + b = 0` 的根。\n\n##### 解决方案\n\n在方程 `ax + b = 0` 中，系数 `a` 和 `b` 是已知实数，`x` 代表要找到的未知数。因为\
  \ `x` 是一次幂，该方程被归为一次方程，也称为线性方程。\n\n方程的根是使该方程成立的 `x` 值；即等式左侧 `ax + b` 等于零。\n\n在此练习中，用户必须输入系数\
  \ `a` 和 `b` 的值，程序必须找到使 `ax + b` 等于零的 `x`。\n\n方程 `ax + b = 0` 在求解 `x` 时变为 `x = -b\
  \ / a`。根据用户输入的数据，可能会出现三种情况：\n\n1. 用户对系数 `a` 输入 `0`，对系数 `b` 输入非零值。在这种情况下，`x = -b\
  \ / a` 的结果未定义。根据数学的，不能除以零。\n2. 用户对系数 `a` 和 `b` 都输入 `0`。在这种情况下，`x = -b / a` 无解，被称为不定式。\n\
  3. 用户输入其他数值对。\n\n这三种情况和相应的路径使用多分支决策结构表示如下。\n\n![Image](img/chapter23-11.png)\n\n\
  ![Image](img/chapter23-12.png)\n\nJava 程序所示。\n\n```java\n![](img/my_exercise_header.png)\
  \ Project_23.3-3\npublic static void main(String[] args) throws Exception {\n  \
  \  double a, b, x;\n    System.out.println(\"Enter values for a and b: \");\n  \
  \  a = Double.parseDouble(cin.nextLine());\n    b = Double.parseDouble(cin.nextLine());\n\
  \    if (a != 0) {\n        x = -b / a;\n        System.out.println(x);\n    } else\
  \ if (b != 0) {\n        System.out.println(\"Undefined\");\n    } else {\n    \
  \    System.out.println(\"Indeterminate form\");\n    }\n}\n```\n\n## 练习 23.3-4\
