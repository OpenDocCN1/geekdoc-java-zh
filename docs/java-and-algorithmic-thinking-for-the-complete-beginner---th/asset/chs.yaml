  f\") && !gender.equals(\"o\"));\n        do {\n            System.out.print(\"Do\
  \ you eat breakfast in the morning? \");\n            answer = cin.nextLine().toLowerCase();\n\
  \        } while (!answer.equals(\"y\") && !answer.equals(\"n\") && !answer.equals(\"\
