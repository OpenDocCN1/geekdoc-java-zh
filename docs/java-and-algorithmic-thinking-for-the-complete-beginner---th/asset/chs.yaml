  \n## 第 18 章：多分支决策结构\n\n### 18.1 多分支决策结构\n\n多分支决策结构用于扩展备选项的数量，如下图所示。\n\n[流程图占位]\n\
  \n当执行多分支决策结构时，会评估 `Boolean_Expression_1`。如果它为真，则执行紧随其后的相应语句或块；然后跳过结构的其余部分，继续执行该结构之后可能存在的任何语句。然而，如果\
  \ `Boolean_Expression_1` 为假，执行流将评估 `Boolean_Expression_2`。如果它为真，则执行紧随其后的相应语句或块并跳过结构的其余部分。这一过程持续直到某个布尔表达式为真或没有剩余表达式为止。\n\
  \n当之前的布尔表达式都不为真时，将执行最后一个语句或块 `N + 1`。此外，这个最后的语句或块 `N + 1` 是可选的，可以省略。这取决于你试图解决的算法。\n\
  \nJava 语句的通用形式为\n\n```java\nif (Boolean_Expression_1) {语句或块 1}\nelse if (Boolean_Expression_2)\
  \ {语句或块 2}\nelse if (Boolean_Expression_3) {语句或块 3}\n...else if (Boolean_Expression_N)\
  \ {语句或块 N}\nelse {语句或块 N + 1}\n```\n\n\n\n\n最后一条或最后一组语句 `N + 1` 是可选的，并且可以省略（你也需要省略\
  \ `else` 关键字）。\n\n这里显示了一个简单的示例。\n\n```java\nProject_18.1\npublic static void main(String[]\
  \ args) throws Exception {\n    String name;\n    System.out.print(\"What is your\
  \ name? \");\n    name = cin.nextLine();\n    if (name.equals(\"John\") == true)\
  \ {\n        System.out.println(\"You are my cousin!\");\n    } else if (name.equals(\"\
  Aphrodite\") == true) {\n        System.out.println(\"You are my sister!\");\n \
  \   } else if (name.equals(\"Loukia\") == true) {\n        System.out.println(\"\
  You are my mom!\");\n    } else {\n        System.out.println(\"Sorry, I don't know\
  \ you.\");\n    }\n}\n```\n\n#### Exercise 18.1-1 追踪表与多分支决策结构\n\n创建一个追踪表，以确定下一个\
  \ Java 程序在三次执行过程中每一步中变量的值。\n\n三次执行的输入值分别为：(i) `5, 8`；(ii) `−13, 0`；以及(iii) `1, −1`。\n\
  \n```java\nProject_18.1-1\npublic static void main(String[] args) throws Exception\
  \ {\n    int a, b;\n    a = Integer.parseInt(cin.nextLine());\n    b = Integer.parseInt(cin.nextLine());\n\
  \    if (a > 3) {\n        System.out.println(\"Message #1\");\n    } else if (a\
  \ > 4 && b <= 10) {\n        System.out.println(\"Message #2\");\n        System.out.println(\"\
  Message #3\");\n    } else if (a * 2 == -26) {\n        System.out.println(\"Message\
  \ #4\");\n        System.out.println(\"Message #5\");\n        b++;\n    } else\
  \ if (b == 1) {\n        System.out.println(\"Message #6\");\n    } else {\n   \
  \     System.out.println(\"Message #7\");\n        System.out.println(\"Message\
