  \n#### 练习 31.10-2 在 HashMaps 中使用不存在的键\n\n以下 Java 程序中哪里有错误？\n\n```java\nHashMap<String,\
  \ String> family = new HashMap<>(Map.of(\"father\", \"John\", \"mother\", \"Maria\"\
  , \"son\", \"George\"));\nSystem.out.println(family.get(\"daughter\"));\n```\n\n\
  解决方案\n\n\n\n\n\n与数组类似，这段代码不满足确定性属性。你绝对不能引用不存在的哈希表（HashMap）元素。由于不存在键 `daughter`，最后一条语句显示\
  \ `null`。\n\n![](img/notice.jpg)\n在计算机科学中，`null` 意味着“无”。当一个变量或数据结构元素没有值时，它被视为 `null`。值\
  \ `0` 与 `null` 值不同，因为 `0` 是一个实际的值。对于字符串来说，空字符串（`\"\"`）也与 `null` 值不同。空字符串是一个不包含字符的字符串，而空字符串根本没有值！\n\
  \n### 31.11 如何修改 HashMap 元素的值\n\n要修改现有 hashmap 元素的值，你需要使用适当的键并为该元素分配一个新值。接下来的示例正展示了这一点。\n\
  \n```java\nHashMap<String, String> tribes = new HashMap<>(Map.of(\"Indian\", \"\
  Navajo\", \"African\", \"Zulu\"));\nSystem.out.println(tribes); //它显示: {Indian=Navajo,\
  \ African=Zulu}\n// 修改现有元素的值\ntribes.put(\"Indian\", \"Apache\");\nSystem.out.println(tribes);\
  \ //它显示: {Indian=Apache, African=Zulu}\n```\n\n#### 练习 31.11-1 给不存在的键赋值\n\n以下代码片段中是否存在任何错误？\n\
  \n```java\nHashMap<Integer, String> tribes = new HashMap<>(Map.of(0, \"Navajo\"\
  , 1, \"Cherokee\", 2, \"Sioux\"));\ntribes.put(3, \"Apache\");\n```\n\n**解法**\n\n\
  没有，这次这段代码片段完全没有错误。乍一看，你可能认为最后一条语句试图修改一个不存在的键的值并抛出错误。但对于 Java 的 hashmap 来说并非如此。由于\
  \ `tribes` 是一个 hashmap 且键 `3` 不存在，最后一条语句向 hashmap 添加了一个全新的第四个元素！\n\n![](img/remember.jpg)\n\
  hashmap 的键可以是 `String`、`int`、`double` 等类型。\n\n但请记住，如果 `tribes` 实际上是一个数组，最后一条语句肯定会报错。请看以下代码片段：\n\
  \n```java\nString[] tribes = {\"Navajo\", \"Cherokee\", \"Sioux\"};\ntribes[3] =\
  \ \"Apache\";\n```\n\n在这个示例中，由于 `tribes` 是一个数组且索引 `3` 不存在，最后一条语句试图修改一个不存在的元素的值，显然会引发错误！\n\
  \n### 31.12 如何遍历 HashMap\n\n要遍历 hashmap 的元素，可以使用 for 循环。以下是通用形式的代码片段：\n\n```java\n\
  for (key_type key : structure_name.keySet()) {\n    process structure_name.get(key);\n\
  }\n```\n\n其中 `process` 是任何 Java 语句或语句块，用于每次迭代时处理 hashmap 结构 `structure_name` 中的一个元素。\n\
