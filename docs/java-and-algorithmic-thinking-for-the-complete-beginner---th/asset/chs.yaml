  \n执行以下操作：\n\ni) 写一个名为 `dice` 的子程序，返回一个 1 到 6 之间的随机整数。\nii) 写一个名为 `searchAndCount`\
  \ 的子程序，它通过形式参数列表接收一个整数和一个整数数组，并返回该整数在数组中出现的次数。\niii) 使用上述子程序，写一个 Java 程序，用 100 个随机整数（1\
  \ 到 6 之间）填充一个数组，然后让用户输入一个整数。程序必须显示用户提供的整数在数组中出现的次数。\n\n解决方案\n\n\n\n\n这两个子程序都可以写成方法，因为它们都各自返回一个值。`dice()`\
  \ 方法返回一个 1 到 6 之间的随机整数，而 `searchAndCount()` 方法返回一个表示整数在数组中出现次数数字。这里给出了解决方案。\n\n\
  ![](img/my_exercise_header.png) Project_38.2-4\n\n```java\nstatic final int ELEMENTS\
  \ = 100;\nstatic int dice() {\n    return 1 + (int)(Math.random() * 5);\n}\nstatic\
  \ int searchAndCount(int x, int[] a) {\n    int count = 0;\n    int i;\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        if (a[i] == x) {\n            count++;\n\
  \        }\n    }\n    return count;\n}\npublic static void main(String[] args)\
  \ throws Exception {\n    int x, i;\n    int[] a = new int[ELEMENTS];\n    for (i\
  \ = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = dice();\n    }\n    x = Integer.parseInt(cin.nextLine());\n\
  \    System.out.println(\"Provided value exists in the array \" + searchAndCount(x,\
  \ a) + \" times\");\n}\n```\n\n### 练习 38.2-5 每个骰子数字出现了多少次？\n\n使用上一个练习中提到的方法 `dice()`\
  \ 和 `searchAndCount()`（练习 38.2-4），编写一个 Java 程序，用 100 个随机整数（1 到 6 之间）填充数组，然后显示这六个数字在数组中各出现的次数，以及哪个数字出现频率最高。\n\
  \n##### 解决方案\n\n如果你打算不使用循环控制结构来解决这个练习，将按照以下步骤操作。\n\n```java\n// 将值 1 在数组 an1 中出现的次数赋值给\
  \ n1\nn1 = searchAndCount(1, a);\n// 将值 2 在数组 an2 中出现的次数赋值给 n2\nn2 = searchAndCount(2,\
  \ a);\n...\n// 将值 6 在数组 an6 中出现的次数赋值给 n6\nn6 = searchAndCount(6, a);\n// 显示六个数字在数组\
  \ a 中各出现的次数\nSystem.out.println(n1 + \"  \" + n2 + \"  \" + n3 + \"  \" + n4 + \"\
  \  \" + n5 + \"  \" + n6);\n// 找到 n1, n2,… n6 中的最大值\nmaximum = n1;\nmaxI = 1;\n\
  if (n2 > maximum) {\n    maximum = n2;\n    maxI = 2;\n}\nif (n3 > maximum) {\n\
  \    maximum = n3;\n    maxI = 3;\n}\n...\nif (n6 > maximum) {\n    maximum = n6;\n\
  \    maxI = 6;\n}\n// 显示哪个数字在数组中出现频率最高。\nSystem.out.println(maxI);\n```\n\n但现在你已经到达这本书的结尾，你当然可以做更具创意的事情。与其将\
  \ `searchAndCount()` 方法的每个结果赋值给单独变量 `n1`、`n2`、`n3`、`n4`、`n5` 和 `n6`，你可以将这些结果赋值给名为\
  \ `n` 的数组的索引 0, 1, 2, 3, 4 和 5，如下所示。\n\n```java\nint[] n = new int[6];\nfor (i =\
  \ 0; i <= 5; i++) {\n    n[i] = searchAndCount(i + 1, a);\n}\n```\n\n之后，你可以使用在 34.3\
