  # 第 23 章\n## 选择结构的进阶用法\n### 23.1 选择结构的简单练习\n\n#### 练习题 23.1-1 是整数吗？\n编写一个 Java 程序，提示用户输入一个数字，然后显示消息指示该数字的数据类型是整数还是实数。\n\
  \n##### 答案\n众所周知，当数字不包含小数部分时，它被视为整数。在 Java 中，你可以使用 `(int)` 转换运算符来获取任何实数的整数部分。如果用户提供的数字与其整数部分相等，则该数字被视为整数。\n\
  \n例如，如果用户输入数字 `7`，该数字与它的整数部分 `(int)(7)` 是相等的。另一方面，如果用户输入数字 `7.3`，该数字与它的整数部分 `(int)(7.3)`\
  \ 是不相等的。\n\nJava 程序如下：\n\n```java\nProject_23.1-1public static void main(String[]\
  \ args) throws Exception {\n    double x;\n    System.out.print(\"Enter a number:\
  \ \");\n    x = Double.parseDouble(cin.nextLine());\n    if (x == (int)x) {\n  \
  \      System.out.println(x + \" is integer\");\n    } else {\n        System.out.println(x\
  \ + \" is real\");\n    }\n}\n```\n\n变量 `x` 声明为 `double`，并在数据输入阶段使用了 `Double.parseDouble()`\
  \ 方法。这是为了允许用户输入整数或浮点数。\n\n#### 练习题 23.1-2 数据输入验证与奇偶数查找\n\n\n\n\n\n# 设计一个流程图并编写相应的\
  \ Java 程序，该程序提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则，必须显示“Odd”（奇数）。此外，如果用户输入负值或浮点数，则必须显示错误信息。\n\
  \n（此练习将让你练习如何进行数据验证）。\n\n##### 解决方案\n\n数据验证是限制数据输入的过程，强制用户只输入有效值。\n\n在本次练习中，你需要提示用户输入一个非负整数，并在当他们输入负值或浮点数时显示错误信息。解决此练习的通用形式流程图如下。\n\
  \n![Image](img/chapter23-01.png)\n\n下面的选择控制结构取自 练习 17.1-4。它测试变量 `x` 是偶数还是奇数。\n\n\
  ![Image](img/chapter23-02.png)\n\n在将两个流程图结合后，最终的流程图看起来所示。\n\n![Image](img/chapter23-03.png)\n\
  \nJava 程序所示。\n\n![](img/my_exercise_header.png) Project_23.1-2\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    double x;\n    System.out.print(\"\
  Enter an integer: \");\n    x = Double.parseDouble(cin.nextLine());\n    if (x <\
