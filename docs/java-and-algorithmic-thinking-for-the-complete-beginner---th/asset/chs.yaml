  ```\n\n---\n\n### 38.2 子程序的通用性练习\n\n#### 练习 38.2-1 使用子程序验证数据输入\n\n执行以下操作：\n\ni)编写一个名为\
  \ `getAge` 的子程序，提示用户输入其年龄并返回。使用循环控制结构，该子程序还必须验证数据输入，并在用户输入任何非正值时显示错误消息。\nii)编写一个名为\
  \ `findMax` 的子程序，通过其形式参数列表接受一个数组，并返回数组最大值的索引位置。\niii)使用上述子程序，编写一个 Java 程序，提示用户将\
  \ 50 个人的名、姓和年龄输入到三个数组中，然后显示最大的人的名字。\n\n##### 解决方案\n\n\n\n\n由于子程序 `getAge()` 返回一个值，因此它可以被写成一个方法。子程序\
  \ `findMax()` 也是如此，因为它也返回一个值。主代码必须提示用户将 50 个人的名、姓和年龄分别输入到数组 `firstNames`、`lastNames`\
  \ 和 `ages` 中中。然后，在方法 `findMax()` 的帮助下，可以找到 `ages` 数组中最大值的索引位置。解决方案所示。\n\n![](img/my_exercise_header.png)\
  \ Project_38.2-1\n```java\nstatic final int PEOPLE = 50;\nstatic int getAge() {\n\
  \    int age;\n    System.out.print(\"Enter an age: \");\n    age = Integer.parseInt(cin.nextLine());\n\
  \    while (age <= 0) {\n        System.out.print(\"Error: Invalid age\\nEnter a\
  \ positive number: \");\n        age = Integer.parseInt(cin.nextLine());\n    }\n\
  \    return age;\n}\nstatic int findMax(int[] a) {\n    int i, maximum, maxI;\n\
  \    maximum = a[0];\n    maxI = 0;\n    for (i = 1; i <= PEOPLE - 1; i++) {\n \
  \       if (a[i] > maximum) {\n            maximum = a[i];\n            maxI = i;\n\
  \        }\n    }\n    return maxI;\n}\npublic static void main(String[] args) throws\
  \ Exception {\n    int i, indexOfMax;\n    String[] firstNames = new String[PEOPLE];\n\
  \    String[] lastNames = new String[PEOPLE];\n    int[] ages = new int[PEOPLE];\n\
  \    for (i = 0; i <= PEOPLE - 1; i++) {\n        System.out.print(\"Enter first\
  \ name of person No \" + (i + 1) + \": \");\n        firstNames[i] = cin.nextLine();\n\
  \        System.out.print(\"Enter last name of person No \" + (i + 1) + \": \");\n\
  \        lastNames[i] = cin.nextLine();\n        ages[i] = getAge();\n    }\n  \
  \  indexOfMax = findMax(ages);\n    System.out.println(\"The oldest person is:\"\
  );\n    System.out.println(firstNames[indexOfMax] + lastNames[indexOfMax]);\n  \
  \  System.out.println(\"They are \" + ages[indexOfMax] + \" years old!\");\n}\n\
  ```\n\n#### 练习 38.2-2 使用子程序排序数组\n\n执行以下操作：\n\ni) 写一个名为 `mySwap` 的子程序，它通过形式参数列表接收一个字符串数组以及两个索引。该子程序随后交换对应索引位置上元素的值。\n\
  ii) 使用上述的子程序 `mySwap()`，写一个名为 `mySort` 的子程序，它通过形式参数列表接收一个字符串数组，然后使用冒泡排序算法对数组进行排序。它必须能够按升序或降序排序。为了实现这一点，请在形式参数列表中包含一个额外的\
  \ `Boolean` 参数。\niii) 写一个名为 `displayArray` 的子程序，它通过形式参数列表接收一个数组并将其显示出来。\niv) 使用上述的子程序\
  \ `mySort()` 和 `displayArray()` 写一个 Java 程序，提示用户输入 20 个人的名字，然后显示它们两次：一次按升序排序，一次按降序排序。\n\
  \n解决方案\n\n如你在下方的 Java 程序所示，`void` 方法 `mySort()` 使用了冒泡排序算法的改进版本。当值 `true` 传递给参数 `ascending`\
  \ 时，算法按升序排序数组 `a`。当传递值 `false` 时，算法按降序排序数组 `a`。\n\n此外，`void` 方法 `mySort()` 每当两个元素的内容之间需要交换时，都会调用\
  \ `void` 方法 `mySwap()`。\n\n![](img/my_exercise_header.png) Project_38.2-2\n```java\n\
  static final int PEOPLE = 20;\nstatic void mySwap(String[] a, int index1, int index2)\
  \ {\n    String temp;\n    temp = a[index1];\n    a[index1] = a[index2];\n    a[index2]\
  \ = temp;\n}\nstatic void mySort(String[] a, boolean ascending) {\n    int m, n;\n\
  \    for (m = 1; m <= PEOPLE - 1; m++) {\n        for (n = PEOPLE - 1; n >= m; n--)\
  \ {\n            if (ascending) {\n                if (a[n].compareTo(a[n - 1])\
  \ < 0) {\n                    mySwap(a, n, n - 1);\n                }\n        \
  \    }\n            else {\n                if (a[n].compareTo(a[n - 1]) > 0) {\n\
  \                    mySwap(a, n, n - 1);\n                }\n            }\n  \
  \      }\n    }\n}\nstatic void displayArray(String[] a) {\n    int i;\n    for\
  \ (i = 0; i <= PEOPLE - 1; i++) {\n        System.out.println(a[i]);\n    }\n}\n\
  public static void main(String[] args) throws Exception {\n    int i;\n    String[]\
  \ names = new String[PEOPLE];\n    for (i = 0; i <= PEOPLE - 1; i++) {\n       \
  \ System.out.print(\"Enter a name: \");\n        names[i] = cin.nextLine();\n  \
  \  }\n    mySort(names, true);        // 升序排序\n    displayArray(names);\n    mySort(names,\
  \ false);       // 降序排序\n    displayArray(names);\n}\n```\n在 Java 中，数组是引用传递的。这就是为什么不需要在\
  \ `mySwap()` 和 `mySort()` 中包含返回语句。\n\n#### 练习 38.2-3 阶梯电价与消耗\n\n电力公司根据下表向订阅者收取电费：\n\
