  \ 26 minute(s) and 45 second(s)”。\n\n##### 解 Solution\n\n如你所知，一分钟有 60 秒，一小时有 3600\
  \ 秒（60 × 60），一天有 86400 秒（3600 × 24）。让我们尝试使用上一个练习中学会的第一种方法来分析数字 700005。\n\n| 天数 =\
  \ 8 | 如果使用 `(/ )` 运算符和 `(int)` 类型转换运算符将用户提供的整数除以 86400，就可以分离出整数商 `days = (int)(700005\
  \ / 86400)`。 |\n| 剩余秒数 = 8805 | 如果再次将用户提供的整数除以 86400，这次使用 `( % )` 运算符获取整数余数 `r =\
  \ 700005 % 86400`。 |\n| 小时 = 2 | 如果使用 `( / )` 运算符和 `(int)` 类型转换运算符将剩余秒数除以 3600，就可以分离出整数商\
  \ `hours = (int)(8805 / 3600)`。 |\n| 剩余秒数 = 1605 | 现在剩余秒数是 `r = 8805 % 3600`。 |\n\
  | 分钟 = 26 | 如果使用 `( / )` 运算符和 `(int)` 类型转换运算符将剩余秒数除以 60，就可以分离出整数商 `minutes = (int)(1605\
  \ / 60)`。 |\n| 秒 = 45 | 最后一个余数恰好是剩余的秒数，`seconds = 1605 % 60`。 |\n\n该算法的 Java 程序如下。\n\
