  \n8) 编写一个 Java 程序，显示 1 到 4 之间整数的每两个组合以及它们得到的乘积。输出必须如下：\n1 x 1 = 1\n1 x 2 = 2\n1\
  \ x 3 = 3\n1 x 4 = 4\n2 x 1 = 2\n2 x 2 = 4\n2 x 3 = 6\n2 x 4 = 8\n3 x 1 = 3\n3 x\
  \ 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n4 x 1 = 4\n4 x 2 = 8\n4 x 3 = 12\n4 x 4 = 16\n\n\
  9) 编写一个 Java 程序，显示 1 到 4 之间整数的乘法表，如下所示：\n![Image](img/chapter29-06.png)\n\n10) 编写一个\
  \ Java 程序，提示用户输入一个整数，然后显示该整数与 1 之间的整数乘法表。例如，如果用户输入 5，输出如下所示。\n\n## 第 30 章\n## 循环结构\n\
  \n### 30.1 循环结构练习\n\n#### 30.1-1 计数哪个数字更大\n编写一个 Java 程序，提示用户输入 10 对数字，并统计第一个数字大于第二个数字的次数以及第二个数字大于第一个数字的次数。\n\
  \n解决方案\n程序如下：\n```java\nint countA, countB, i, a, b;\ncountA = 0;\ncountB = 0;\n\
  for (i = 1; i <= 10; i++) {\n    System.out.print(\"Enter A: \");\n    a = Integer.parseInt(cin.nextLine());\n\
  \    System.out.print(\"Enter B: \");\n    b = Integer.parseInt(cin.nextLine());\n\
  \    if (a > b) {\n        countA++;\n    } else if (b > a) {\n        countB++;\n\
  \    }\n}\nSystem.out.println(countA + \"  \" + countB);\n```\n人们可能会提出的合理问题是：“为什么要使用多分支结构？为什么不使用二元结构呢？”\n\
  \n假设确实使用了如下二元决策结构：\n```java\nif (a > b)\n    countA++;\nelse\n    countB++;\n```\n\
  在这个决策结构中，当 `b` 大于 `a` 时 `countB` 会增加（这是符合要求的），但当 `b` 等于 `a` 时也会增加（这是不符合要求的）。相反用多分支结构可以确保\
  \ `countB` 仅在大于 `a` 时增加。\n\n#### 30.1-2 根据位数计数数字\n编写一个 Java 程序，提示用户输入 20 个整数，然后统计并显示一位数、两位和三位整数的总数。假设用户输入的是\
  \ 1 到 999 之间的值。\n\n解决方案\n利用练习 1.1-2 的知识，Java 程序如下：\n```java\nint count1, count2,\
  \ count3, i, a;\ncount1 = count2 = count3 = 0;\nfor (i = 1; i <= 20; i++) {\n  \
  \  System.out.print(\"Enter a number: \");\n    a = Integer.parseInt(cin.nextLine());\n\
  \    if (a <= 9) {\n        count1++;\n    } else if (a <= 99) {\n        count2++;\n\
  \    } else {\n        count3++;\n    }\n}\nSystem.out.println(count1 + \"  \" +\
  \ count2 + \"  \" + count3);\n```\n\n#### 30.1-3 多少个数字能装进和\n编写一个 Java 程序，让用户反复输入数值，直到它们的和超过\
  \ 1000。在最后，程序必须显示输入的数字总数。\n\n解决方案\n\n\n\n\n在这种情况下，由于不知道精确的迭代次数，无法使用确定性循环；需要一个不确定循环。让我们使用预测试循环来创建该循环。然而，为了确保程序没有逻辑错误，遵循第\
  \ 29.3 节中讨论的“终极”（Ultimate）规则至关重要。根据该规则，预测试循环的结构如下般形式所示。\n\n```\nInitialize total\n\
  while (total <= 1000) {\n    A statement or block of statements\n    Update/alter\
  \ total\n}\n```\n\n由于循环的布尔表达式取决于变量 `total`，因此该变量必须在循环开始前进行初始化，并在循环内部进行更新（修改）。具体来说，更新/修改变量\
  \ `total` 的语句必须是循环的最后一条语句。随后，Java 程序变为：\n\n```java\n![](img/my_exercise_header.png)\
  \ Project_30.1-3\npublic static void main(String[] args) throws Exception {\n  \
  \  int count;\n    double total, x;\n    count = 0;\n    total = 0; // Initialization\
  \ of total\n    while (total <= 1000) { // Boolean expression dependent on total\n\
  \        x = Double.parseDouble(cin.nextLine());\n        count++;\n        total\
  \ += x; // Update/alteration of total\n    }\n    System.out.println(count);\n}\n\
  ```\n\n### 练习 30.1-4 找出正整数的总数\n\n编写一个 Java 程序，提示用户反复输入整数值，直到输入一个实数（浮点）。在结束时，程序必须显示输入的正整数总数。\n\
  \n##### 解决方案\n\n同样，你不知道精确的迭代次数，因此无法使用 for 循环。\n\n根据“终极”规则，预测试循环的结构如下形式所示。\n\n```\n\
  System.out.print(\"Enter a number: \");\nx = Double.parseDouble(cin.nextLine());\
  \ // Initialization of x\nwhile ((int)(x) == x ) { // Boolean expression dependent\
  \ on x\n    A statement or block of statements\n    System.out.print(\"Enter a number:\
  \ \");\n    x = Double.parseDouble(cin.nextLine()); // Update/alteration of x\n\
  }\n```\n\n最终的 Java 程序如下。\n\n```java\n![](img/my_exercise_header.png) Project_30.1-4\n\
  public static void main(String[] args) throws Exception {\n    double x;\n    int\
  \ count;\n    count = 0;\n    System.out.print(\"Enter a number: \");\n    x = Double.parseDouble(cin.nextLine());\n\
  \    while ((int)(x) == x) {\n        if (x > 0) {\n            count++;\n     \
  \   }\n        System.out.print(\"Enter a number: \");\n        x = Double.parseDouble(cin.nextLine());\n\
  \    }\n    System.out.println(count);\n}\n```\n\n![](img/notice.jpg) 注意，即使用户提供的第一个数字是实数（浮点数），程序也能正常运行；预测试循环结构确保执行流永远不会对实数进入循环！\n\
  \n### 练习 30.1-5 根据用户意愿多次迭代\n\n编写一个 Java 程序，提示用户输入两个数字，然后计算并显示第一个数的第二个数的幂。程序必须根据用户的意愿进行任意迭代。在每次计算结束后，程序必须提示用户是否想再次计算。如果答案是“yes”，程序必须重复；否则必须结束。让你的程序接受所有可能的形式的答案，如“yes”、“YES”、“Yes”甚至“YeS”。\n\
  \n##### 解决方案\n\n根据“终极”规则，预测试循环的结构如下形式所示。\n\n```\nanswer = \"YES\"; // Initialization\
  \ of answer\nwhile (answer.toUpperCase().equals(\"YES\")) {\n    Prompt the user\
  \ to enter two numbers and then calculate and display the first number raised to\
  \ the power of the second one.\n    System.out.print(\"Would you like to repeat?\
  \ \");\n    answer = cin.nextLine(); // Update/alteration of answer\n}\n```\n\n\
  ![](img/notice.jpg) `toUpperCase()` 方法确保程序对任何用户提供的答案（如 yes, YES, Yes 或 yEs）都能正常运行！\n\
  \n然而，这次我们不使用预测试循环结构，而是采用后测试循环结构。这是一个更好的方法，因为可以省略循环外 `answer` 变量的初始化。与预测试循环结构不同，执行流无论如何都会进入循环，答案的初始化将在后测试循环内部完成，如下代码片段（通用形式）所示。\n\
  \n```\ndo {\n    Prompt the user to enter two numbers and then calculate and display\
  \ the first number raised to the power of the second one.\n    System.out.print(\"\
  Would you like to repeat? \");\n    answer = cin.nextLine(); // Initialization and\
  \ update/alteration of answer\n} while (answer.toUpperCase().equals(\"YES\"));\n\
  ```\n\n该练习的解决方案变为：\n\n```java\n![](img/my_exercise_header.png) Project_30.1-5\n\
  public static void main(String[] args) throws Exception {\n    int a, b;\n    double\
  \ result;\n    String answer;\n    do {\n        System.out.println(\"Enter two\
  \ numbers: \");\n        a = Integer.parseInt(cin.nextLine());\n        b = Integer.parseInt(cin.nextLine());\n\
  \        result = Math.pow(a, b);\n        System.out.println(\"The result is: \"\
  \ + result);\n        System.out.print(\"Would you like to repeat? \");\n      \
  \  answer = cin.nextLine();\n    } while (answer.toUpperCase().equals(\"YES\"));\n\
  }\n```\n\n### 练习 30.1-6 求解各位数字之和\n\n编写一个 Java 程序，允许用户输入整数，然后计算其各位数字之和。\n\n#####\
  \ 解决方案\n\n在练习 13.1-2 中，你学习了当已知总位数时如何拆分整数数字。在这个练习中，允许用户输入任何值，因此总位数是未知的。为了解决这个练习，可以使用循环结构。例如，如果用户提供的数字是\
  \ 4753，它在第一次迭代中应变为 475，第二次变为 47，最终变为 4。一旦达到 0，迭代停止。让我们尝试通过以下流程图来理解建议的解决方案。\n\n![Image](img/30-0)\n\
  \n整个概念依赖于最终使 `x` 值为零的语句。可以使用常用的 MOD 10 操作分离 `x` 的最后一位数字。相应，Java 程序变为：\n\n```java\n\
  ![](img/my_exercise_header.png) Project_30.1-6\npublic static void main(String[]\
  \ args) throws Exception {\n    int x, s, digit;\n    x = Integer.parseInt(cin.nextLine());\n\
  \    s = 0;\n    while (x != 0) {\n        digit = x % 10; // This is the x MOD\
  \ 10 operation\n        s = s + digit;\n        x = (int)(x / 10); // This is the\
  \ x DIV 10 operation\n    }\n    System.out.println(s);\n}\n```\n\n为了更好地理解发生发生了什么，为输入值\
  \ 4753 创建一个追踪表。\n\n| Step | Statement | Notes | x | digit | s |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | `x = Integer.parse…` | 用户输入值 4753 | 4753 | ? | ? |\n\
  | 2 | `s = 0` | | 4753 | ? | 0 |\n| 3 | `while (x != 0)` | 结果为 true | | | |\n| 4\
  \ | `digit = x % 10` | | 4753 | 3 | 0 |\n| 5 | `s = s + digit` | | 4753 | 3 | 3\
  \ |\n| 6 | `x = (int)(x / 10)` | | 475 | 3 | 3 |\n| 7 | `while (x != 0)` | 结果为 true\
  \ | | | |\n| 8 | `digit = x % 10` | | 475 | 5 | 3 |\n| 9 | `s = s + digit` | | 475\
  \ | 5 | 8 |\n| 10 | `x = (int)(x / 10)` | | 47 | 5 | 8 |\n| 11 | `while (x != 0)`\
  \ | 结果为 true | | | |\n\n\n\n\n| 12 | `digit = x % 10` | | 47 | 7 | 8 |\n| 13 | `s\
  \ = s + digit` | | 47 | 7 | 15 |\n| 14 | `x = (int)(x / 10)` | | 4 | 7 | 15 |\n\
  | 15 | `while (x != 0)` | 此结果为 true |\n| 16 | `digit = x % 10` | | 4 | 4 | 15 |\n\
  | 17 | `s = s + digit` | | 4 | 4 | 19 |\n| 18 | `x = (int)(x / 10)` | | 0 | 4 |\
  \ 19 |\n| 19 | `while (x != 0)` | 此结果为 false |\n| 20 | `.println(s)` | 显示为: 19 |\n\
  \n![](img/remember.jpg) 在 Java 中，两个整数相除的结果始终是一个整数。因此，在语句 `x = (int)(x / 10)` 中，由于变量\
  \ `x` 和常量值 `10` 都是整数，`(int)` 强制转换运算符是冗余的。然而，为了提高代码的可读性，保留它也是一种良好的做法。\n\n### 第二种方法\n\
  \n在这种方法中，核心思想是将用户提供的整数转换为字符串，然后使用 `for` 循环遍历所有的字符（数字）。然而，在 `for` 循环中，在将每个数字累加到变量\
  \ `s` 之前，你需要将它从 `char` 类型转换回 `int` 类型。Java 程序如下。\n\n![](img/my_exercise_header.png)\
  \ 项目 30.1-6b\n```java\npublic static void main(String[] args) throws Exception {\n\
  \    int i, x, s;\n    String xStr, digit;\n    x = Integer.parseInt(cin.nextLine());\n\
  \    xStr = \"\" + x; // 将用户输入转换为字符串\n    s = 0;\n    for (i = 0; i <= xStr.length()\
  \ - 1; i++) {\n        digit = \"\" + xStr.charAt(i); // 获取字符串类型的“数字”\n        s\
  \ = s + Integer.parseInt(digit);\n    }\n    System.out.println(s);\n}\n```\n\n\
  ### 30.2 使用嵌套循环控制结构的练习\n\n#### 练习 30.2-1 显示所有包含指定数字的三位整数\n\n编写一个 Java 程序，提示用户输入一个数字（0\
  \ 到 9），然后显示所有至少包含一次用户输入数字的三位整数。例如，如果用户输入数字 7，那么 357、771 和 700 都是符合条件的整数。\n\n#####\
  \ 解决方案\n\n有三种不同的方法！第一种仅使用了一个 `for` 循环，第二种使用了三个相互嵌套的 `for` 循环，最后一种将所有三位整数转换为字符串。让我们来分析它们吧！\n\
  \n###### 第一种方法——使用 `for` 循环和决策控制结构\n\n核心思想是使用一个 `for` 循环，变量 `counter` 的值从 100 变到\
  \ 999。在循环内部，将 `counter` 变量拆分为各个单独数字（`digit[3]`、`digit[2]`、`digit[1]`），并使用决策控制结构检查是否至少有一个数字等于所提供的数字。Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) 项目 30.2-1a\n```java\npublic static void\
  \ main(String[] args) throws Exception {\n    int x, i, digit3, r, digit2, digit1;\n\
  \    System.out.print(\"输入一个 0 - 9 的数字: \");\n    x = Integer.parseInt(cin.nextLine());\n\
  \    for (i = 100; i <= 999; i++) {\n        digit3 = (int)(i / 100);\n        r\
  \ = i % 100;\n        digit2 = (int)(r / 10);\n        digit1 = r % 10;\n      \
  \  if (digit3 == x || digit2 == x || digit1 == x) {\n            System.out.println(i);\n\
  \        }\n    }\n}\n```\n\n###### 第二种方法——使用嵌套循环控制结构和决策控制结构\n\n这里的核心思想是使用三个嵌套的\
  \ `for` 循环。在这种情况下，有三个计数变量（`digit3`、`digit2` 和 `digit1`），每个变量对应三位整数的某一个数字。Java 程序如下。\n\
  \n![](img/my_exercise_header.png) 项目 30.2-1b\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int x, digit3, digit2, digit1;\n    System.out.print(\"\
  输入一个 0 - 9 的数字: \");\n    x = Integer.parseInt(cin.nextLine());\n    for (digit3\
  \ = 1; digit3 <= 9; digit3++) {\n        for (digit2 = 0; digit2 <= 9; digit2++)\
  \ {\n            for (digit1 = 0; digit1 <= 9; digit1++) {\n                if (digit3\
  \ == x || digit2 == x || digit1 == x) {\n                    System.out.println(digit3\
  \ * 100 + digit2 * 10 + digit1);\n                }\n            }\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n![](img/notice.jpg)这种解决方案是最高效的，因为它没有使用任何决策控制结构，而且迭代次数被保持在最低！\n\
  \n![](img/remember.jpg)如你所见，一个问题可以有多种解决方案。找到最优解取决于你！\n\n### 30.3 使用循环控制结构进行数据验证\n\
  \n如你所所到的，数据验证是限制数据输入的过程，它强制使用户只能输入有效值。你已经遇到过一种使用决策控制结构进行数据验证的方法。让我们回想一个例子。\n\n```java\n\
  System.out.print(\"Enter a non-negative number: \");\nx = Double.parseDouble(cin.nextLine());\n\
  if (x < 0) {\n    System.out.print(\"Error: Negative number entered!\");\n}else\
  \ {\n    System.out.println(Math.sqrt(x));\n}\n```\n\n然而，这种方法对用户可能并不是最方便的。如果他们输入无效数字，程序会显示错误信息，执行流不可避免地到达末尾。用户必须重新启动程序以输入有效数字。\n\
  \n接下来，你将看到三种通用形式的方法，用于使用循环控制结构验证数据输入。在用户输入无效值的情况下，主要目标是反复提示他们，直到他们最终提供有效值。当然，如果用户最初输入的是有效值，执行流直接进入程序的下一个部分。\n\
  \n你使用哪种方法取决于你是否希望显示错误信息，以及你是否希望显示不同的错误信息（每种输入错误对应一个），还是对任何类型的错误显示一个通用错误信息。\n\n####\
  \ 第一种方法 – 不带错误信息的数据输入验证\n\n要在不显示任何错误信息的情况下验证数据输入，可以使用以下通用形式的代码片段。\n\n```java\ndo\
  \ {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n####\
  \ 第二种方法 – 使用通用错误信息的数据输入验证\n\n验证数据输入并显示通用错误信息（即对任何类型的输入错误显示相同的错误信息），可以使用以下通用形式的代码片段。\n\
  \n```java\nSystem.out.print(\"Prompt message\");\ninput_data = cin.nextLine();\n\
  while (input_data test 1 fails || input_data test 2 fails || … ) {\n    System.out.println(\"\
  Error message\");\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  }\n```\n\n#### 第三种方法 – 使用不同错误信息的数据输入验证\n\n验证数据输入并为每种输入错误显示不同的错误信息，可以使用以下通用形式的代码片段。\n\
  \n```java\ndo {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  \    failure = false;\n    if (input_data test 1 fails) {\n        System.out.println(\"\
  Error message 1\");\n        failure = true;\n    }else if (input_data test 2 fails)\
  \ {\n        System.out.println(\"Error message 2\");\n        failure = true;\n\
  \    }else if (……)\n} while (failure);\n```\n\n![](img/notice.jpg)语句 `while (failure)`\
  \ 等同于语句 `while (failure == true)`。\n\n#### 练习 30.3-1 寻找奇数和偶数\n\n编写一个 Java 程序，提示用户输入一个非负整数，然后显示消息指示该数是否为偶数；否则必须显示“Odd”。使用循环控制结构，程序还验证验证数据输入，允许用户仅输入非负整数。\n\
  \n解决方案\n\n你从第 30.3 节中学习的验证数据输入的三方法将在这里给出。但首先，让我们在不进行数据验证的情况下解决这个练习。\n\n```java\n\
  System.out.print(\"Enter a non-negative integer: \");\nx = Integer.parseInt(cin.nextLine());\n\
