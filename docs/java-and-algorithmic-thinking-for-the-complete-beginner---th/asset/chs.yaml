  \ Studio Code 如何帮助你发现逻辑错误。\n\n# 第三部分：顺序控制结构\n\n## 第 10 章：顺序控制结构绪论\n\n### 10.1 什么是顺序控制结构？\n\
  \n顺序控制结构指的是语句的逐行执行，即语句按照它们在程序中出现的顺序逐一执行，而不跳过任何一个语句。例如，它们可以执行一系列读取或写入操作、算术运算或对变量进行赋值。\n\
  \n下面的程序展示了顺序执行的 Java 语句示例。\n\n![](img/my_exercise_header.png) Project_10.1\n```java\n\
  public static void main(String[] args) throws Exception {\n    double num, result;\n\
  \    //提示用户输入 num 的值\n    System.out.print(\"Enter a number: \");\n    num = Double.parseDouble(cin.nextLine());\n\
  \    //计算 num 的平方\n    result = num * num;\n    //在用户屏幕上显示结果\n    System.out.println(\"\
  The square of \" + num + \" is \" + result);\n}\n```\n\n![](img/notice.jpg)顺序控制结构是你在\
  \ 4.1 节中学习的三个基本控制结构中最简单的一种。另外两种结构是“决策结构”和“循环结构”。计算机编程中的所有问题都可以仅用这三种结构来解决！\n\n![](img/remember.jpg)在\
  \ Java 中，你可以使用双斜杠（ // ）来添加注释。注释是给人类阅读的。编译器和解释器会忽略它们。\n\n#### 练习 10.1-1 计算矩形的面积\n\
  \n编写一个 Java 程序，提示用户输入矩形的底边和高度，然后计算并显示其面积。\n\n##### 解决方案\n\n你可能在学校学过，可以使用以下公式计算矩形的面积：\n\
  \n`Area = Base × Height`\n\n在 4.6 节中，你学习了创建算法的三个主要阶段：数据输入、数据处理和结果输出。\n\n在练习中，这三个主要阶段如下：\n\
  \n* 数据输入 – 用户必须输入 `Base` 和 `Height` 的值\n* 数据处理 – 程序必须计算矩形的面积\n* 结果输出 – 程序必须显示上一个阶段计算出的矩形面积。\n\
  \n该问题的解决方案所示。\n\n![](img/my_exercise_header.png) Project_10.1-1\n```java\npublic\
  \ static void main(String[] args) throws Exception {\n    double area, b, h;\n \
  \   //数据输入 - 提示用户输入底高\n    System.out.print(\"Enter the length of base: \");\n \
  \   b = Double.parseDouble(cin.nextLine());\n    System.out.print(\"Enter the length\
  \ of height: \");\n    h = Double.parseDouble(cin.nextLine());\n    //数据处理 - 计算矩形面积\n\
  \    area = b * h;\n    //结果输出 - 在用户屏幕上显示结果\n    System.out.println(\"The area of\
  \ the rectangle is \" + area);\n}\n```\n\n#### 练习 10.1-2 计算圆的面积\n\n编写一个 Java 程序计算并显示圆的面积。\n\
  \n##### 解决方案\n\n你可以使用以下公式计算圆的面积：\n\n`Area = π · Radius²`\n\n`π` 的值是一个常量，约为 `3.14159`。因此，用户只需要输入\
  \ `Radius`。\n\n在练习中，你在 4.6 节学习的三个主要阶段如下：\n\n* 数据输入 – 用户必须输入 `Radius` 的值\n* 数据处理\
  \ – 程序必须计算圆的面积\n* 结果输出 – 程序必须显示上一个阶段计算出的圆的面积。\n\n该问题的解决方案所示。\n\n![](img/my_exercise_header.png)\
  \ Project_10.1-2a\n```java\npublic static void main(String[] args) throws Exception\
  \ {\n    double area, radius;\n    //数据输入 - 提示用户输入半径\n    System.out.print(\"Enter\
  \ the length of radius: \");\n    radius = Double.parseDouble(cin.nextLine());\n\
  \    //数据处理 - 计算圆的面积\n    area = 3.14159 * radius * radius;\n    //结果输出 - 在用户屏幕上显示结果\n\
  \    System.out.println(\"The area of the circle is \" + area);\n}\n```\n\n更好的方法是使用常量\
  \ `PI`。\n\n![](img/my_exercise_header.png) Project_10.1-2b\n```java\nstatic final\
  \ double PI = 3.14159;\npublic static void main(String[] args) throws Exception\
  \ {\n    double area, radius;\n    //数据输入 - 提示用户输入半径\n    System.out.print(\"Enter\
  \ the length of radius: \");\n    radius = Double.parseDouble(cin.nextLine());\n\
  \    //数据处理 - 计算圆的面积\n    area = PI * radius * radius;\n    //结果输出 - 在用户屏幕上显示结果\n\
  \    System.out.println(\"The area of the circle is \" + area);\n}\n```\n\n![](img/notice.jpg)注意常量\
  \ `PI` 是在 `main` 方法之外定义的。\n\n#### 练习 10.1-3 汽车在哪里？计算距离\n\n一辆汽车从静止开始，沿着直道路以恒定加速度运动一段时间。编写一个\
