  \n### 23.5-3 检查大小写和标点\n\n编写一个 Java 程序，提示用户输入一个句子，然后检查其大小写和标点符号。程序必须判断字符串是否以大写字母开头并以标点符号结尾（仅检查句号、问号和感叹号）。\n\
  \n##### 解决方案\n\n在此练习中，你需要分离第一个字符和最后一个字符。如你所知，可以使用下标法访问字符串的任何字符。你可以使用索引 `0` 访问第一个，索引\
  \ `1` 访问第二个，依此类推。\n\n因此，可以使用以下 Java 语句分离字符串的第一个字符：\n\n`firstChar = sentence.charAt(0)`\n\
  \n另一方面，最后一个字符的索引比字符串长度少 1。你可以使用 `length()` 方法找到字符串的长度。使用以下语句，你可以分离句子的最后一个字符：\n\n\
  `length = sentence.length()`\n`lastChar = sentence.charAt(length - 1)`\n\n或者使用更简洁的语句：\n\
  \n`lastChar = sentence.charAt(sentence.length() - 1)`\n\n所示是该程序。\n\n![](img/my_exercise_header.png)\
  \ Project_23.5-3\n```javapublic static void main(String[] args) throws Exception\
  \ {\n    String sentence, firstChar, lastChar;\n    boolean sentenceIsOkay;\n  \
  \  System.out.print(\"Enter a sentence: \");\n    sentence = cin.nextLine();\n \
  \   // 获取第一个字符并将其转换为字符串\n    firstChar = \"\" + sentence.charAt(0);\n    // 获取最后一个字符并将其转换为字符串\n\
  \    lastChar = \"\" + sentence.charAt(sentence.length() - 1);\n    sentenceIsOkay\
  \ = true;\n    if (!firstChar.equals(firstChar.toUpperCase())) {\n        sentenceIsOkay\
  \ = false;\n    } else if (!lastChar.equals(\".\") && !lastChar.equals(\"?\") &&\
  \ !lastChar.equals(\"!\")) {\n        sentenceIsOkay = false;\n    }\n    if (sentenceIsOkay)\
  \ {\n        System.out.println(\"Sentence is okay!\");\n    }\n}\n```\n\n### 练习题\
  \ 23.5-4 数字是回文吗？\n\n回文是指在反转数字后保持不变的数字。例如，数字 13631 就是回文。编写一个 Java 程序，让用户输入一个五位整数并测试该数字是否为回文。此外，当用户输入浮点数或任何少于或大于五位的整数时，必须为每种输入错误显示不同的错误信息。\n\
  \n（注意这涉及到数据验证！）\n\n解决方案\n\n\n\n\n实际上有两种不同的方法！第一种是将数字的数位分为五个不同的变量，而第二种是将数字视为字符串处理。让我们分析一下这两种方法！\n\
  \n## 第一种方法\n\n为了测试用户输入的是否回文数，你需要像在第 13 章](#chapter13.xhtml)中学习的那样，将它的数位分为五个不同的变量。然后，你可以检查\
  \ `1^(st)` 位是否等于 `5^(th)` 位，且 `2^(nd)` 位是否等于 `4^(th)` 位。如果该判断结果为真，则该数字是回文数。\n\n\
  为了验证数据输入，你需要检查用户是否输入了一个五位数。请记住，所有五位数都在 `10000` 到 `99999` 之间。因此，你只需要将数据输入限制在这个范围内即可。\n\
  \n为了显示许多不同的错误信息，最佳实践是使用多重分支决策结构，首先检查所有情况的数据输入有效性，然后尝试解决所需的问题。例如，如果你需要检查各种错误，可以像下面这样操作。\n\
  \n![Image](img/chapter23-23.png)\n\n这里显示了的 Java 程序。\n\n![](img/my_exercise_header.png)\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int digit1,\
  \ r, digit2, digit3, digit4, digit5;\n    double x;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    if (x != (int)x) {\n        System.out.println(\"You entered a float\");\n\
  \    } else if (x < 10000) {\n        System.out.println(\"You entered less than\
  \ five digits\");\n    } else if (x > 99999) {\n        System.out.println(\"You\
  \ entered more than five digits\");\n    } else {\n        //将 x 的数位分为 5 不同的变量\n\
  \        digit1 = (int)(x / 10000);\n        r = (int)x % 10000;\n        digit2\
  \ = (int)(r / 1000);\n        r = r % 1000;\n        digit3 = (int)(r / 100);\n\
  \        r = r % 100;\n        digit4 = (int)(r / 10);\n        digit5 = r % 10;\n\
  \        if (digit1 == digit5 && digit2 == digit4) {\n            System.out.println(\"\
  Palindrome\");\n        } else {\n            System.out.println(\"Not Palindrome\"\
  );\n        }\n    }\n}\n```\n\n## 第二种方法\n\n这种方法将数字视为字符串处理。它比较第一个字符和最后一个字符，以及第二个字符和倒数第二个字符。如果它们相等，说明该数字是回文数。这里显示了的\
  \ Java 程序。\n\n![](img/my_exercise_header.png)\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String xStr;\n    double x;\n    x = Double.parseDouble(cin.nextLine());\n\
  \    if (x != (int)x) {\n        System.out.println(\"You entered a float\");\n\
  \    } else if (x < 10000) {\n        System.out.println(\"You entered less than\
  \ five digits\");\n    } else if (x > 99999) {\n        System.out.println(\"You\
  \ entered more than five digits\");\n    } else {\n        xStr = \"\" + (int)x;\n\
  \        if (xStr.charAt(0) == xStr.charAt(4) && xStr.charAt(1) == xStr.charAt(3))\
  \ {\n            System.out.println(\"Palindrome\");\n        } else {\n       \
  \     System.out.println(\"Not palindrome\");\n        }\n    }\n}\n```\n\n### 23.6\
  \ 布尔表达式参考与实用技巧\n\n本节总结了你到为止在 Java 旅程中遇到的所有布尔表达式，以及额外的表达式和实用的技巧。无论你是初还是资深程序员，这些表达式和技巧都将成为你编程库中宝贵的工具。请将它们收藏好，因为你不知道它们何时会派上用场。对于某些表达式，提供了两种或两种以上方法来实现所需的结果。\n\
  \n1) 如何检查 `x` 中的数字是否在 `A` 和 `B` 之间 ► `x >= A && x <= B`\n2) 如何检查 `x` 中的数字是否不在 `A`\
  \ 和 `B` 之间 ► `!(x >= A && x <= B)` ► `x < A || x > B`\n3) 如何检查 `x` 是否等于 `A`、`B`\
  \ 或 `C` ► `x == A || x == B || x == C`\n4) 如何检查 `x` 既不等于 `A` 也不等于 `B` 且等于 `C` ►\
  \ `x != A && x != B && x != C` ► `!(x == A || x == B || x == C)`\n5) 如何检查 `x` 是否包含一个整数。请注意变量\
  \ `x` 必须是 `double` 类型 ► `x == (int)x`\n6) 如何检查 `x` 是否包含浮点数 ► `x != (int)x`\n7) 如何检查\
  \ `x` 是否包含偶数 ► `x % 2 == 0` ► `x % 2 != 1` ► `!(x % 2 != 0)`\n8) 如何检查 `x` 是否包含奇数\
  \ ► `x % 2 == 1` ► `x % 2 != 0`\n9) 如何检查 `x` 是 `y` 的倍数 ► `x % y == 0`\n10) 如何提取\
  \ `x` 的小数部分 ► `x - (int)x`\n11) 如何提取 `x` 的第一位 ► `(int)(x / 10000)`\n12) 如何提取 `x`\
  \ 的第二位 ► `(int)(x / 1000) % 10`\n13) 如何提取 `x` 的 `N^(th)` 位小数 ► `(int)(x * 10^N)\
  \ % 10`\n14) 如何提取整数的最后一位 ► `x % 10`\n15) 如何提取整数的倒数第二位 ► `(int)(x / 10) % 10`\n16)\
  \ 如何提取整数的 `N^(th)` 位最后一位 ► `(int)(x / 10^N) % 10`\n17) 如何检查句子是否以字母 `B` 开头 ► `x.charAt(0)\
  \ == 'B'`\n18) 如何检查句子是否以句号 `.` 结尾 ► `x.charAt(x.length() - 1) == '.'`\n19) 如何在三个数字\
  \ `x`, `y`, `z` 中找到中间的数字 ► `x+y+z - 最大-最小`\n20) 如何在三个数字 `x`, `y`, `z` 中找到最小的两个数字\
  \ ► `x+y+z - 最大`\n21) 如何在三个数字 `x`, `y`, `z` 中找到最大的两个数字 ► `x+y+z - 最小`\n22) 如何在五个数字\
  \ `x`, `y`, `z`, `w`, `u` 中找到三个中间的数字 ► `总和 - 最大 - 最小`\n23) 如何检查两个数字之间的距离是否大于 `NUMBER`\
  \ ► `Math.abs(x - y) > NUMBER`\n24) 如何检查正整数是三位数 ► `x >= 100 && x <= 999` ► `String.valueOf(x).length()\
  \ == 3` ► `(\"\" + x).length() == 3`\n25) 如何检查整数是三位数 ► `Math.abs(x) >= 100 && Math.abs(x)\
  \ <= 999` ► `String.valueOf(Math.abs(x)).length() == 3` ► `(\"\" + Math.abs(x)).length()\
  \ == 3`\n26) 如何检查正整数是四位数且以 `5` 开头 ► `x >= 5000 && x <= 5999`\n27) 如何检查两个数字符号是否相同\
  \ `x > 0 && y > 0 || x < 0 && y < 0` ► `x * y > 0`\n28) 如何检查两个数字都是偶数或奇数 ► `x % 2\
  \ == 0 && y % 2 == 0 || x % 2 == 1 && y % 2 == 1` ► `x % 2 == y % 2`\n29) 如何检查两个条件\
  \ `BE1` 或 `BE2` 只有一个为真，但不同时（异或运算） ► `BE1 && !(BE2) || BE2 && !(BE1)`\n30) 如何检查年份\
