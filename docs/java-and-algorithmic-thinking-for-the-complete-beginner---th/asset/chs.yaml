  \n#### 练习 33.4-1 使用三个一维数组\n\n有 20 个学生，他们每个人都收到了两门课程的成绩。编写一个 Java 程序，提示用户输入每个学生两门课程的姓名和成绩。程序必须找到并显示所有两门课程成绩都大于\
