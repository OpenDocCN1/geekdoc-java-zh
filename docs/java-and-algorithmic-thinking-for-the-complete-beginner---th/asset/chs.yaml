  for (i = 0; i <= STUDENTS - 1; i++) {\n\n> System.out.println(\"For student No.\
  \ \" + (i + 1) + \"...\");\n\n> for (j = 0; j <= LESSONS - 1; j++) {\n\n> > System.out.print(\"\
  enter grade for lesson No. \" + (j + 1) + \": \");\n\n> > grades[i][j] = Integer.parseInt(cin.nextLine());\n\
  \n> }\ndouble average = 0;\nfor (j = 0; j <= LESSONS - 1; j++) {\n\n> average +=\
  \ grades[i][j];\n\n}\naverage /= LESSONS;\n\nif (average > 89) {\n\n> System.out.println(average);\n\
  \n}\n}\n\n### 33.3 逐列处理每一列\n\n逐列处理每一列意味着每一列都是分开处理的，并且每一列的结果（可以是和、平均值等）都可以被单独用于后续处理。假设你有如下的\
  \ 4 × 5 数组。\n\n![Image](img/chapter33-04.png)\n\n与之前，让我们尝试单独计算每列的和。再次，有两种方法可以使用。这两种方法都遍历了列。\n\
  \n#### 第一种方法——创建一个辅助数组\n\n在这种方法中，程序单独处理每一列，并创建一个辅助数组，数组中的每个元素存储一列的和。这种方法赋予了你很大的灵活性，因为你可以在程序的后续部分使用这个新数组进行进一步处理。辅助数组\
  \ `total` 在底部所示。\n\n![Image](img/chapter33-05.png)\n\n现在，让我们编写相应的代码片段。为了更容易地理解这个过程，使用了“从内层到外”的方法。以下代码片段计算第一列（列索引为\
  \ 0）的和，并将结果存储在辅助数组 `total` 位置为 0 的元素中。假设变量 `j` 的值为 0。\n\n```\ns = 0;for (i = 0;\
  \ i <= ROWS - 1; i++) {s += b[i][j];}total[j] = s;\n```\n\n该代码片段可以等价地写为：\n\n```\n\
  total[j] = 0;for (i = 0; i <= ROWS - 1; i++) {total[j] += b[i][j];}\n```\n\n现在，将此代码片段嵌套在一个遍历所有列的\
  \ for 循环中，结果如下。\n\n```\nfor (j = 0; j <= COLUMNS - 1; j++) {total[j] = 0;for (i\
  \ = 0; i <= ROWS - 1; i++) {\n\n> total[j] += b[i][j];\n\n}}\n```\n\n#### 第二种方法——直接查找并处理。\n\
  \n这种方法不使用辅助数组；它只是计算并直接处理和。代码片段如下。\n\n```\nfor (j = 0; j <= COLUMNS - 1; j++) {total\
  \ = 0;for (i = 0; i <= ROWS - 1; i++) {\n\n> total += b[i][j];\n\n}process total;}\n\
  ```\n\n\n\n\n因此，下面的代码段计算并显示了每列的平均值。\n\n```java\nfor (j = 0; j <= COLUMNS - 1; j++)\
  \ {\n    total = 0;\n    for (i = 0; i <= ROWS - 1; i++) {\n        total += b[i][j];\n\
  \    }\n    System.out.println(total / ROWS);\n}\n```\n\n### 练习 33.3-1 寻找平均值\n\n\
