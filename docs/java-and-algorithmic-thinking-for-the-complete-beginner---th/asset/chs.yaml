  \n##### 答案\n\n在这个练习中，一个双重分支决策结构嵌套在一个单分支结构中。你只需要对布尔表达式 `x == 100` 取反并交换真/假路径。Java\
  \ 程序所示。\n\n```java\npublic static void main(String[] args) throws Exception {\n\
