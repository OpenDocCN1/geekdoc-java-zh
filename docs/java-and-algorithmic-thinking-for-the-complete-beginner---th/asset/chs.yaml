  \n选择控制结构\n\n## 第 15 章 选择问题\n\n### 15.1 引言\n\n你到目前所学的所有都是顺序控制结构，语句按照程序中出现的相同顺序顺序执行。然而，在实际的\
  \ Java 编程中，你很少希望语句按顺序执行。很多时候，你希望在一种情况下执行一组语句，而在另一种情况下执行完全不同的一组语句。\n\n### 15.2 什么是布尔表达式？\n\
  \n假设变量 `x` 包含值 5。这意味着如果你问问题“`x` 大于 2 吗？”答案显然是“是”。对于计算机来说，这些问题被称为布尔表达式。例如，如果你写下 `x\
  \ > 2`，这是一个布尔表达式，计算机必须检查表达式 `x > 2` 是否为真或假。\n\n![](img/notice.jpg)布尔表达式是一个产生布尔值的表达式，即结果为真（true）或假（false）二一。\n\
  \n![](img/notice.jpg)布尔表达式是问题，它们应该被读作“某物是吗？”。notice.jpg)选择控制结构可以评估布尔表达式并决定执行哪块语句。\n\
  \n### 15.3 如何编写简单表达式\n\n简单的布尔表达式写为 `Operand1 Comparison_Operator Operand2`\n\n其中\
  \ `Operand1` 和 `Operand2` 可以是值、变量或数学表达式，如表 15-1 所示。\n\n| 比较运算符 | 描述 |\n| --- | ---\
  \ |\n| == | 等于（不是赋值） |\n| != | 不等于 |\n| > | 大于 |\n| < | 小于 |\n| >= | 大于等于 |\n| <=\
  \ | 小于等于 |\n\n一些布尔表达式的示例：\n\n`x > y`。这个布尔表达式是对计算机的问题，可以读作“`x` 大于 `y` 吗？”\n`x <=\
  \ y`。这个布尔表达式也是对计算机的问题，可以读作“`x` 小于等于 `y` 吗？”\n`x != 3 * y + 4`。这个布尔表达式是对计算机的问题，可以读作“`x`\
  \ 不等于 `3 * y + 4` 吗？”\n`s.equals(\"Hello\")`。在 Java 中，为了测试两个字符串是否相等，你需要使用 `equals()`\
  \ 方法。，这个问题可以读作“`s` 包含 'Hello' 吗？”\n`x == 5`。这可以读作“`x` 等于 5 吗？”\n\n#### 练习 15.3-1\
  \ 填充表格\n\n根据 `a`、`b` 和 `c` 的值，在下表中填充中“true”或“false”。\n\n| a | b | c | a == 10 |\
  \ b <= a | c > 3 * a - b |\n| --- | --- | --- | --- | --- | --- |\n| 3 | -5 | 7\
  \ | | | |\n| 10 | 10 | 21 | | | |\n| -4 | -2 | -9 | | | |\n\n答案前两个布尔表达式非常直观，不需要进一步解释。\n\
  \n关于布尔表达式 `c > 3 * a - b`，注意 `b` 为负数的情况。例如，在第一行中，`a` 等于 3，`b` 等于 5。表达式 `3 * a -\
  \ b` 的结果是 `3 * 3 - (−5) = 3 * 3 + 5 = 14`。由于变量 `c` 的内容（第一行）不大于 14，布尔表达式 `c > 3 *\
  \ a - b` 的结果为假。\n\n经过一些工作，表格变为：\n\n| a | b | c | a == 10 | b <= a | c > 3 * a -\
  \ b |\n| --- | --- | --- | --- | --- | --- |\n| 3 | -5 | 7 | false | true | false\
  \ |\n| 10 | 10 | 21 | true | true | true |\n| -4 | -2 | -9 | false | false | true\
  \ |\n\n### 15.4 逻辑运算符和复杂的布尔表达式\n\n复杂的布尔表达式可以由简单的布尔表达式构建，并可以写为\n\n`BE1 Logical_Operator\
  \ BE2`\n\n其中\n\n\n\n\n`BE1` 和 `BE2` 可以是任何布尔表达式。`Logical_Operator` 可以是表 15-2 所示的运算符之一。\n\
  \n| 逻辑运算符 | 说明 |\n| --- | --- |\n| `&&` | 与（AND，也称为逻辑合与） |\n| `||` | 或（OR，也称为逻辑取或）\
  \ |\n| `!` | 非（NOT，也称为否定或逻辑非） |\n\n表 15-2 Java 中的逻辑运算符\n\n![](img/notice.jpg)当我们将多个简单的布尔表达式与逻辑运算符结合起来时，整个布尔表达式就被称为“复杂的布尔表达式”。例如，表达式\
  \ `x == 3 && y > 5` 就是一个复杂的布尔表达式。\n\n![](img/notice.jpg)在流程图中，本书使用了通用的 `AND`、`OR`\
  \ 和 `NOT` 运算符！\n\n### AND (`&&`) 运算符\n\n当你在两个布尔表达式之间使用 `AND` (`&&`) 运算符时（`BE1 &&\
  \ BE2`），它的意思是：只有当两个布尔表达式 (`BE1` 和 `BE2`) 都为 `true` 时，整个复杂布尔表达式的结果才为 `true`。\n\n\
  你可以将这些信息组织在所谓的真表（truth table）中。真表显示了两个或多个布尔表达式在所有可能的取组合下的逻辑操作结果。这里是 `AND` (`&&`)\
  \ 运算符的真表。\n\n| `BE1 (布尔表达式 1)` | `BE2 (布尔表达式 2)` | `BE1 && BE2` |\n| --- | --- |\
  \ --- |\n| false | false | false |\n| false | true | false |\n| true | false | false\
  \ |\n| true | true | true |\n\n你仍然感到困惑吗？你不应该困惑！这非常简单！让我们来看一个例子。复杂的布尔表达式\n\n```\n\
  name.equals(\"John\") == true && age > 5\n```\n\n只有当变量 `name` 包含单词“John”（不带双引号）且变量\
  \ `age` 包含大于 5 的值时，该表达式才为 `true`。两个布尔表达式都必须为 `true`。如果其中至少有一个为 `false`（例如变量 `age`\
  \ 的值为 3），那么整个复杂的布尔表达式就为 `false`。\n\n### OR (`||`) 运算符\n\n当你在两个布尔表达式之间使用 `OR` (`||`)\
  \ 运算符时（`BE1 || BE2`），它的意思是：当第一个布尔表达式 (`BE1`) 或第二个布尔表达式 (`BE2`) 为 `true` 时（至少有一个），整个复杂布尔表达式的结果就为\
  \ `true`。\n\n这里是 `OR` (`||`) 运算符的真表。\n\n| `BE1 (布尔表达式 1)` | `BE2 (布尔表达式 2)` | `BE1\
  \ || BE2` |\n| --- | --- | --- |\n| false | false | false |\n| false | true | true\
  \ |\n| true | false | true |\n| true | true | true |\n\n让我们来看一个例子。复杂的布尔表达式\n\n```\n\
  name.equals(\"John\") == true || name.equals(\"George\") == true\n```\n\n当变量 `name`\
  \ 包含单词“John”或“George”（不带双引号）时，该表达式为 `true`。至少有一个布尔表达式必须为 `true`。如果两个布尔表达式都为 `false`（例如变量\
  \ `name` 包含单词“Maria”），那么整个复杂的布尔表达式为 `false`。\n\n### NOT (`!`) 运算符\n\n当你在布尔表达式前面使用\
  \ `NOT` (`!`) 运算符时（`(!(BE))`），它的意思是：当布尔表达式 `BE` 为 `false` 时，整个复杂布尔表达式的结果为 `true`，反之亦然。\n\
  \n这里是 `NOT` (`!`) 运算符的真表。\n\n| `BE (布尔表达式)` | `!(BE)` |\n| --- | --- |\n| false\
  \ | true |\n| true | false |\n\n例如，复杂的布尔表达式\n\n```\n!(age > 5)\n```\n\n当变量 `age`\
  \ 的值小于或等于 5 时，该表达式为 `true`。例如，如果变量 `age` 的值为 6，那么整个复杂的布尔表达式为 `false`。\n\n![](img/notice.jpg)逻辑运算符\
  \ `NOT` (`!`) 反转布尔表达式的结果。在 Java 中，布尔表达式必须包含在括号内。\n\n#### 练习 15.4-1 计算复杂布尔表达式的结果\n\
  \n当变量 `a`、`b`、`c` 和 `d` 分别包含 5、2、7 和 −3 时，计算以下复杂布尔表达式的结果。\n\ni) `(3 * a + b / 47\
  \ - c * b / a > 23) && (b != 2)`\nii) `(a * b - c / 2 + 21 * c / 3) || (a >= 5)`\n\
  \n##### 解 Solution\n\n不要害怕！结果可以很容易找到。你只需要记住适用于 `AND` (`&&`) 和 `OR` (`||`) 运算符的规则即可。\n\
  \ni) 当两个布尔表达式都为 `true` 时，`AND` (`&&`) 运算符的结果为 `true`。如果你仔细观察，右侧布尔表达式 (`b != 2`)\
  \ 的结果为 `false`。所以，你不需要浪费时间计算左侧布尔表达式的结果。最终结果一定是 `false`。\nii) 当至少有一个布尔表达式为 `true`\
  \ 时，`OR` (`||`) 运算符的结果为 `true`。如果你仔细观察，右侧布尔表达式 (`a >= 5`) 的结果为 `true`（因为 a=5）。因此，结果为\
  \ `true`。\n\n### 15.5 将布尔表达式的结果赋值给变量\n\n布尔表达式返回一个 `true` 或 `false` 的值，这个值可以直接赋值给变量。例如，语句\n\
  \n```\na = x > y;\n```\n\n将结果赋值给变量 `a`。下面的示例显示了该值。\n\n```java\npublic class Main\
  \ {\n    public static void main(String[] args) {\n        int x = 8;\n        int\
  \ y = 5;\n        boolean a = x > y;\n        System.out.println(a);\n    }\n}\n\
  ```\n\n### 15.6 逻辑运算符的优先级是什么？\n\n一个复杂的布尔表达式可能会使用多个逻辑运算符，如下：\n\n```\nx > 5 || z ==\
  \ 2\n```\n\n所以，一个合理的问题是“哪个逻辑操作先执行？”Java 中的逻辑运算符优先级与大多数编程语言相同。\n\n| 优先级 | 运算符 |\n\
  \n表 15-3 优先级顺序\n\n你可以始终使用括号来改变默认优先级。\n\n| 优先级 | 逻辑运算符 |\n| --- | --- |\n| 高 | `!`\
  \ |\n| | `&&` |\n| 低 | `||` |\n\n#### 练习 15.6-1 填充真表\n\n根据 `a`、`b` 和 `c` 的值，在下表中填充“true”或“false”。\n\
  \n| `a` | `b` | `c` | `a > 2 || b && c > 2` | `!(a > 2 || b && c > 2)` |\n| ---\
  \ | --- | --- | --- | --- |\n| 1 | −5 | 7 | | |\n| 10 | 10 | 3 | | |\n| −4 | −2\
  \ | −9 | | |\n\n##### 解 Solution\n\n你可以使用下的图形化方法来计算复杂布尔表达式的结果。\n\n对于 `a = 1, b =\
  \ −5, c = 7`，最终结果如所示为 `true`。\n\n![Image](img/chapter15-01.png)\n\n![](img/remember.jpg)`AND`\
  \ (`&&`) 操作的优先级更高，在 `OR` (`||`) 运算符之前执行。\n\n对于 `a = 10, b = 10, c = 3`，最终结果如所示为\
  \ `true`。\n\n![Image](img/chapter15-02.png)\n\n对于 `a = −4, b = −2, c = −9`，最终结果如所示为\
  \ `false`。\n\n![Image](img/chapter15-03.png)\n\n表格第五列的值可以很容易地计算，因为其列标题中的布尔表达式与第四列的表达式几乎相同。唯一的区别是表达式前面的\
  \ `NOT` (`!`) 运算符。所以，第五列的值可以通过简单反转第四列的结果来计算！\n\n#### 练习 15.6-2 将英语句子转换为布尔表达式\n\n\
  一位校长要求学生们根据年龄举手。他想找到那些\n\n\n\n\n\ni) 在 9 到 12 岁之间。\nii) 8 岁以下且 11 岁以上。\niii) 8、10\
  \ 和 12 岁。\niv) 6 到 8 岁之间，以及 10 到 12 岁之间。\nv) 既不是 10 岁也不是 12 岁。\n\n##### 解 Solution\n\
  \n为了组合所需的布尔表达式，使用了变量 `age`。\n\n### i) 句子“在 9 到 12 岁之间”可以像这里这样图形化表示。\n\n![Image](img/chapter15-04.png)\n\
  \n但要小心！在数学中写 `9 ≤ age ≤ 12` 是合法的，但在 Java 中这种写法是不可能的：\n\n```\n9 <= age <= 12\n```\n\
  \n你可以做的是将表达式分为两个部分，如下所示：\n\n```\nage >= 9 && age <= 12\n```\n\n![](img/notice.jpg)为了确认，你可以对“感兴趣区域”（你指定的数据范围）内部和外部的几个值测试此布尔表达式。例如，对于年龄值\
  \ `7`、`8`、`13` 和 `17`，表达式的结果为 false。相反，对于年龄值 `9`、`10`、`11` 和 `12`，结果为 true。\n\n\
  ### ii) 句子“8 岁以下且 11 岁以上”可以像这里这样图形化表示。\n\n![Image](img/chapter15-05.png)\n\n![](img/notice.jpg)注意缺少了你在解\
  \ (i) 中看到的两个圆。这意味着值 `8` 和 `11` 不包含在两个感兴趣的区域内。\n\n小心“8 岁以下且 11 岁以上”这个句子。这是一个陷阱！不要犯写这样的错误：\n\
  \n```\nage < 8 && age > 11\n```\n\n地球上不存在任何人可以同时既小于 8 岁又大于 11 岁！\n\n陷阱在于“和”（and）这个词上。尝试重新表述句子，使其变为“孩子们！如果你们小于\
  \ 8 岁或大于 11 岁，请举起手。”现在这样好多了，正确的布尔表达式变为：\n\n```\nage < 8 || age > 11\n```\n\n![](img/notice.jpg)为了确认，你可以对感兴趣区域内部和外部的几个值测试此表达式。例如，对于年龄值\
  \ `8`、`9`、`10` 和 `11`，表达式的结果为 false。相反，对于年龄值 `6`、`7`、`12` 和 `15`，结果为 true。\n\n###\
  \ iii) 哎！句子“8、10 和 12 岁”中另一个陷阱，再次使用了“和”（and）字！显然，下一个布尔表达式是错误的。\n\n```\nage == 8\
  \ && age == 10 && age == 12\n```\n\n和之前一样，没有任何学生可以同时是 8 岁、10 岁且 12 岁！再次，正确的布尔表达式必须使用\
  \ OR (`||`) 运算符。\n\n```\nage == 8 || age == 10 || age == 12\n```\n\n![](img/notice.jpg)为了确认，你可以对几个值测试此表达式。例如，对于年龄值\
  \ `7`、`9`、`11` 和 `13`，表达式的结果为 false。对于年龄值 `8`、`10` 和 `12`，结果为 true。\n\n### iv) 句子“在\
  \ 6 到 8 岁之间，以及 10 到 12 岁之间”可以像这里这样图形化表示。\n\n![Image](img/chapter15-06.png)\n\n对应的布尔表达式为：\n\
  \n```\nage >= 6 && age <= 8 || age >= 10 && age <= 12\n```\n\n![](img/notice.jpg)为了确认，对于年龄值\
  \ `5`、`9`、`13` 和 `16`，表达式的结果为 false。对于年龄值 `6`、`7`、`8`、`10`、`11` 和 `12`，结果为 true。\n\
  \n### v) 句子“既不是 10 岁也不是 12 岁”的布尔表达式可以写成：\n\n```\nage != 10 && age != 12\n```\n\n\
  或者\n\n```\n!(age == 10 || age == 12)\n```\n\n![](img/notice.jpg)当感兴趣区域的箭头相互指向时，使用逻辑运算符\
  \ AND (`&&`)。否则，当箭头指向相反方向时，使用 OR (`||`)。\n\n![Image](img/chapter15-07.png)\n\n##\
  \ 15.7 算术、比较运算符和逻辑运算符的优先级是什么？\n\n在许多情况下，一个表达式可能包含不同类型的运算符，如下所示：\n\n```\na * b +\
  \ 2 > 21 || !(c == b / 2) && c > 13\n```\n\n在这种情况下，先执行算术运算，接着执行比较运算，最后执行逻辑运算，如下表所示。\n\
  \n| 高优先级 ![Image](img/arrow_up.jpg) | 低优先级 |\n| :--- | :--- |\n| 算术运算符 | `*`, `/`,\
  \ `%` |\n| | `+`, `−` |\n| 比较运算符 | `<`, `>`, `==`, `!=` |\n| 逻辑运算符 | `!` |\n| |\
  \ `&&` |\n| | `||` |\n\n表 15-4 算术、比较和逻辑运算符的优先级。\n\n### 15.8 如何反转布尔表达式\n\n反转是改变布尔表达式含义的过程。有两种方法可以反转一个表达式。\n\
  \n#### 第一方法\n\n第一方法是最简单的。在表达式前面加上 NOT (`!`) 运算符。例如，如果原始表达式是：\n\n```\nx > 5 && y\
  \ == 3\n```\n\n反转后的表达式变为：\n\n```\n!(x > 5 && y == 3)\n```\n\n![](img/notice.jpg)注意整个表达式必须用括号起来。\n\
  \n#### 第二方法\n\n第二方法稍微复杂一点，但不困难。只需根据下表反转每个运算符：\n\n| 原始运算符 | 反转运算符 |\n| :--- | :---\
  \ |\n| `==` | `!=` |\n| `!=` | `==` |\n| `>` | `<=` |\n| `<` | `>=` |\n| `&&` |\
  \ `||` |\n| `||` | `&&` |\n\n例如，如果原始表达式是：\n\n```\nx > 5 && y == 3\n```\n\n反转后的表达式变为：\n\
  \n```\nx <= 5 || y != 3\n```\n\n如果你忘记将 `x < 5 || x > 10` 表达式用括号起来，由于 `&&` 运算符的优先级高于\
  \ `||` 运算符，将先执行 `x > 10 && y != 3`，这显然是错误的！\n\n### 练习 15.8-1 反转表达式\n\n使用两种方法反转以下布尔表达式：\n\
  \ni) `b != 4`\nii) `a * 3 + 2 > 0`\niii) `!(a == 5 && b >= 7)`\niv) `a == true`\n\
  v) `b > 7 && !(x > 4)`\nvi) `a == 4 || b != 2`\n\n##### 解 Solution\n\n第一方法\n\ni)\
  \ `!(b != 4)`\nii) `!(a * 3 + 2 > 0)`\niii) `!(!(a == 5 && b >= 7))`，或者等价的 `a ==\
  \ 5 && b >= 7`\n\n![](img/notice.jpg)两个反反的结果为肯定。也就是说，连续两个 NOT (`!`) 运算符会相互抵消。\n\n\
  iv) `!(a == true)`\nv) `!(b > 7 && !(x > 4))`\nvi) `!(a == 4 || b != 2)`\n\n第二方法\n\
  \ni) `b == 4`\nii) `a * 3 + 2 <= 0`\n\n![](img/notice.jpg)注意算术运算符并不是被“反转”。永远不要把加号（`+`）替换为减号（`−`）！\n\
  \niii) `!(a != 5 || b < 7)`\n\niv) `a != true`\nv) `b <= 7 || !(x <= 4)`\nvi) `a\
  \ != 4 && b == 2`\n\n## 15.9 复习题：对或错\n\n对以下每个陈述判断对或错。\n\n\n\n\n\n1) 布尔表达式是一个始终产生两个值之一结果的表达式。\n\
  2) 布尔表达式至少包含一个逻辑运算符。\n3) 在 Java 中，表达式 `x = 5` 测试变量 `x` 是否等于 `5`。\n4) 下述语句不是有效的 Java\
  \ 语句：`a = b == c;`\n5) 布尔表达式 `b < 5` 测试变量 `b` 是否小于或等于 `5`。\n6) AND ( `&&` ) 运算符也称为逻辑析取运算符。\n\
  7) OR ( `||` ) 运算符也称为逻辑并集运算符。\n8) 如果两个布尔表达式都为真，那么这两个布尔表达式的逻辑交集的结果等于它们逻辑析取的结果。\n\
  9) 如果两个布尔表达式的值不同，那么这两个布尔表达式的逻辑析取的结果一定为真。\n10) 表达式 `c == 3 && d > 7` 被视为复杂的布尔表达式。\n\
  11) 当两个操作数（布尔表达式）都真时，逻辑运算符 OR ( `||` ) 的结果为真。\n12) 当变量 `x` 包含 5 以外的任何值时，布尔表达式 `!(x\
  \ == 5)` 的结果为真。\n13) NOT ( `!` ) 运算符在逻辑运算符中优先级最高。\n14) OR ( `||` ) 运算符在逻辑运算符中优先级最低。\n\
  15) 在布尔表达式 `(x > y || x == 5) && x <= z` 中，AND ( `&&` ) 操作在 OR ( `||` ) 操作之前执行。\n\
  16) 在布尔表达式 `a * b + c > 21 || c == b / 2` 中，程序首先测试 `c` 是否大于 `21`。\n17) 当老师想要找到小于\
  \ 8 岁且大于 11 岁的学生时，对应的布尔表达式是 `age < 8 && age > 11`。\n18) 对于任何 `x` 的值，布尔表达式 `x < 0\
  \ && x > 100` 始终为假。\n19) 对于任何 `x` 的值，布尔表达式 `x > 0 || x < 100` 始终为真。\n20) 布尔表达式 `x\
  \ > 5` 等价于 `!(x < 5)`。\n21) 布尔表达式 `!(x > 5 && y == 5)` 等价于 `!(x > 5) && y == 5`。\n\
  22) 在威廉·莎士比亚的《哈姆雷特》（第 3 第 1 场）中，主角说：“生存还是毁灭，这是一个问题：……” 如果你将其写成布尔表达式 `toBe || !toBe`，那么这个“Shakesboolean”表达式的结果在以下代码段中为真：\n\
  \n```\ntoBe = 1 > 0;\nthatIsTheQuestion = toBe || !toBe;\n```\n\n### 15.10 复习题：单选题\n\
  \n为以下每个陈述选择正确的答案。\n\n1) 下列中哪一个不是比较运算符？\na) `a >= b`\nb) `b <= c`\nc) `c < d`\nd)\
