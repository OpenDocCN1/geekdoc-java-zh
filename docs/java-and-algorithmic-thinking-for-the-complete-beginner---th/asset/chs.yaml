  \n双分支选择结构（Dual-Alternative Decision Structure）\n\n### 17.1 双分支选择结构\n\n与单分支选择结构相比，这种选择控制结构在两条路径上都包含一个语句或语句块。\n\
  \n![Image](img/chapter17-01.png)\n\n如果 `Boolean_Expression`（布尔表达式）求值为真，则执行语句或语句块\
  \ 1；否则，执行语句或语句块 2。\n\nJava 语句的通用形式为：\n\n```java\nif (Boolean_Expression) {语句或语句块\
  \ 1}\nelse {语句或语句块 2}\n```\n\n在下一个示例中，当用户输入的值大于或等于 18 时，显示消息“You are an adult（你成年了）”。否则，显示消息“You\
  \ are underage!（你未成年！）”。\n\n![](img/my_exercise_header.png) Project_17.1\n```java\n\
  public static void main(String[] args) throws Exception {\nint age;\nSystem.out.print(\"\
  Enter your age: \");\nage = Integer.parseInt(cin.nextLine());\nif (age >= 18) {\n\
  \    System.out.println(\"You are an adult!\");\n}else {\n    System.out.println(\"\
  You are underage!\");\n}\n```\n\n与单分支结构类似，`if-else` 语句可以不带大括号编写，如下所示：\n\n```java\n\
  if (Boolean_Expression)\n    单语句 _1\nelse\n    单语句 _2\n```\n\n#### 练习题 17.1-1 寻找输出\n\
