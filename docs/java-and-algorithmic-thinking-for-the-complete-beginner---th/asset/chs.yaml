  \ = new HashMap<>(Map.of(\"A\", \".-\", \"B\", \"-...\", \"C\", \"-.-.\", \"D\"\
  , \"-..\"));\nfor (String letter : morseCode.keySet()) {\n    System.out.println(letter\
  \ + \"  \" + morseCode.get(letter));\n}\n```\n\n下一个示例为电脑软件公司的每位员工提供 2000 美元的奖金！\n\
