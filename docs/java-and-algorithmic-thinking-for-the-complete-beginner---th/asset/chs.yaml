  \ || y == 3`\nv) `!(x >= 2 && y >= 2)`\nvi) `x != -2 && x <= 2`\n\n## 第 16 章：单分支结构\n\
  \n### 16.1 单分支结构\n\n这是简单的决策控制结构。它仅在“真”路径上包含一个语句或语句块，如下通用形式的流程图所示。\n\n![图像](img/chapter16-01.png)\n\
  \n如果 `Boolean_Expression` 求值为真，则执行该结构的语句或语句块；否则，跳过这些语句。\n\nJava 语句的通用形式为：\n\n```java\n\
  if (Boolean_Expression) {语句或语句块}\n```\n\n注意语句或语句块额外缩进了 2 个空格。\n\n在下一个例子中，只有当用户输入小于\
  \ 18 的值时，才会显示消息“你未成年”。当用户输入大于或等于 18 的值时，什么都不显示。\n\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    int age;\n    System.out.print(\"Enter your age:\
  \ \");\n    age = Integer.parseInt(cin.nextLine());\n    if (age < 18) {\n     \
  \   System.out.println(\"You are underage!\");\n    }\n}\n```\n\n注意 `System.out.println()`\
  \ 语句缩进了 2 + 2 = 4 个空格。\n\n\n\n\n在下一个示例中，只有“你未成年！”和“你还需要再等几年”这两条消息只有在用户输入的值小于 18\
  \ 时才会显示。与之前相同，当用户输入的值大于或等于 18 时，则不会显示任何消息。\n\n![](img/my_exercise_header.png) Project_16.1b\n\
  ```java\npublic static void main(String[] args) throws Exception {\n    int age;\n\
  \    System.out.print(\"Enter your age: \");\n    age = Integer.parseInt(cin.nextLine());\n\
  \    if (age < 18) {\n        System.out.println(\"You are underage!\");\n     \
  \   System.out.println(\"You have to wait for a few more years.\");\n    }\n}\n\
  ```\n\n![](img/notice.jpg)出现在 `if` 语句内部的所有语句都应该向右缩进相同数量的空间。在上例中，两个 `System.out.println()`\
  \ 语句都缩进了 2 个空格。\n\n![](img/notice.jpg)为了节省纸张，本书每缩进层使用 2 个空格。然而，Java 官方网站建议每缩进层使用\
  \ 4 个空格。\n\n![](img/notice.jpg)为了移动文本光标，而不是输入空格键，你可以按一次“Tab ![Image](img/key_tab.png)”\
  \ 键！\n\n![](img/notice.jpg)要缩进现有的语句或语句语句，请选择它们并按下“Tab ![Image](img/key_tab.png)”\
  \ 键！\n\n![](img/notice.jpg)要取消缩进一个语句或一组语句，请选择它们并按下“Shift ↑ + Tab ![Image](img/key_tab.png)”组合键！\n\
  \n在下一个示例中，只有当用户输入名字“Zeus”时，才会显示“你是众神之王！”这条消息。然而，无论用户输入什么名字，“你住在奥林匹斯山”这条消息都会被显示。\n\
  \n![](img/my_exercise_header.png) Project_16.1c\n```java\npublic static void main(String[]\
  \ args) throws Exception {\n    String name;\n    System.out.print(\"Enter the name\
  \ of an Olympian: \");\n    name = cin.nextLine();\n    if (name.equals(\"Zeus\"\
  ) == true) {\n        System.out.println(\"You are the King of the Gods!\");\n \
  \   }\n    System.out.println(\"You live on Mount Olympus.\");\n}\n```\n\n![](img/notice.jpg)注意，最后一个\
  \ `System.out.println()` 语句不属于单分支决策结构的语句块。\n\n![](img/notice.jpg)初级程序员在编写 Java 程序时犯的一个非常常见的错误是混淆了赋值运算符与“等于”运算符。他们经常犯错写成\
  \ `if (name.equals(\"Zeus\") = true)`，而他们实际上是想说 `if (name.equals(\"Zeus\") == true)`。\n\
  \n当 `if` 语句中只包含一个单一语句时，你可以省略大括号 `{ }`。因此，`if` 语句可以写成：\n\n`if (Boolean_Expression)\
  \ One_Single_Statement;`\n\n或者你甚至可以将整个决策结构写在一行中，如下：\n\n`if (Boolean_Expression)\
  \ One_Single_Statement;`\n\n只有当 `if` 语句中包含多个一个语句时，才需要大括号。如果没有大括号，Java 假设紧接其后的语句才是决策控制结构的一部分。\n\
  \n然而，为了防止潜在的逻辑错误，许多程序员倾向于始终使用大括号，即使 `if` 语句仅包含一个单一语句。在以下两个示例中，`System.out.print(x)`\
  \ 语句都不是 `if` 语句的一部分。\n\n```java\nif (x == y)x++;\nSystem.out.print(x);\nif (x ==\
  \ y) {x++;}\nSystem.out.print(x);\n```\n\n#### Exercise 16.1-1 追踪表与单分支决策结构\n\n设计相应的流程图并创建一个追踪表，以确定下一个\
