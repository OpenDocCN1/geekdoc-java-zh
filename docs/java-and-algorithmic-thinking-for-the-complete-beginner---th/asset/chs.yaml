  \ 练习 34.1-1 创建包含相邻平均值的数组\n编写一个 Java 程序，让用户向数组输入 100 个数值。然后，程序创建一个 98 个元素的新数组。该新数组的每个位置都包含用户提供的数组中当前位置及后续两个元素的平均值。\n\
  \n##### 解决方案\n让我们通过 10 个元素的示例来理解这个练习。\n\n![Image](img/chapter34-01.png)\n\n`newArr`\
  \ 是创建的数组。在 `newArr` 中，位置 0 的元素是数组 `a` 中当前位置及后续两个元素的平均值，即 `55 + 10 + 9) / 3 = 8`。位置\
  \ 1 的元素是数组 `a` 中当前位置及后续两个元素的平均值，即 `(10 + 9 + 2) / 3 = 7`，以此此类推。\n\nJava 程序如下：\n\n\
  ```java\nProject_34.1-1\nstatic final int ELEMENTS_OF_A = 100;\nstatic final int\
  \ ELEMENTS_OF_NEW = ELEMENTS_OF_A - 2;\npublic static void main(String[] args) throws\
  \ Exception {\n    int i;\n    double[] a = new double[ELEMENTS_OF_A];\n    for\
  \ (i = 0; i <= ELEMENTS_OF_A - 1; i++) {\n        a[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    double[] newArr = new double[ELEMENTS_OF_NEW];\n    for (i = 0; i <=\
  \ ELEMENTS_OF_NEW - 1; i++) {\n        newArr[i] = (a[i] + a[i + 1] + a[i + 2])\
  \ / 3;\n    }\n    for (i = 0; i <= ELEMENTS_OF_NEW - 1; i++) {\n        System.out.print(newArr[i]\
  \ + \"\\t\");\n    }\n}\n```\n\n#### 练习 34.1-2 创建包含最大值的数组\n编写一个 Java 程序，让用户向数组 `a`\
  \ 和 `b` 分别输入 20 个元素。然后，程序创建一个 20 个元素的新数组 `newArr`。该新数组的每个位置包含数组 `a` 和 `b` 对应位置的最大值。\n\
  \n##### 解决方案\n\n\n\n\n\n这里没有新内容！你需要两个 `for` 循环来读取数组 `a` 和 `b` 的值，一个用于创建数组 `newArr`，另一个用于在屏幕上显示数组\
  \ `newArr`。\n\nJava 程序所示。\n\n![](img/my_exercise_header.png) Project_34.1-2\n```java\n\
  static final int ELEMENTS = 20;\npublic static void main(String[] args) throws Exception\
  \ {\n    int i;\n    //Read arrays a and b\n    double[] a = new double[ELEMENTS];\n\
  \    for (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Double.parseDouble(cin.nextLine());\n\
  \    }\n    double[] b = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS -\
  \ 1; i++) {\n        b[i] = Double.parseDouble(cin.nextLine());\n    }\n    //Create\
  \ array newArr\n    double[] newArr = new double[ELEMENTS];\n    for (i = 0; i <=\
  \ ELEMENTS - 1; i++) {\n        if (a[i] > b[i]) {\n            newArr[i] = a[i];\n\
  \        } else {\n            newArr[i] = b[i];\n        }\n    }\n    //Display\
  \ array newArr\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n        System.out.println(newArr[i]);\n\
  \    }\n}\n```\n\n### 练习 34.1-3 合并一维数组\n\n编写一个 Java 程序，对于两个长度分别为 10 和 15 的给定数组 `a`\
  \ 和 `b`，创建一个包含 25 个元素的新数组 `newArr`。这个新数组的前 10 个位置必须包含数组 `a` 的元素，接下来的 15 个位置包含数组\
  \ `b` 的元素。\n\n##### 解决方案\n\n如接下来的示例所示，数组 `a` 的元素索引位置与数组 `newArr` 的元素索引位置之间存在直接的一一对应关系。具体而言，数组\
  \ `a` 位置 0 的元素被存储在数组 `newArr` 的位置 0 中，数组 `a` 位置 1 的元素存储在 `newArr` 的位置 1 中，以此此类推。然而，这种对应关系对于数组\
  \ `b` 并不成立；它的元素需要在 `newArr` 中偏移 10 个位置。\n\n![Image](img/chapter34-02.png)\n\n为了将数组\
  \ `a` 的值分配给 `newArr`，你可以使用下面的代码段。\n\n```java\nfor (i = 0; i <= a.length - 1; i++)\
  \ {newArr[i] = a[i];}\n```\n\n然而，要将数组 `b` 的值分配 `newArr`，你的代码片段应该略有不同，如下：\n\n```java\n\
  for (i = 0; i <= b.length - 1; i++) {newArr[a.length + i] = b[i];}\n```\n\n最终的 Java\
  \ 程序如下。\n\n![](img/my_exercise_header.png) Project_34.1-3\n```java\npublic static\
  \ void main(String[] args) throws Exception {\n    int i;\n    //Create arrays a\
  \ and b\n    int[] a = {5, 10, 9, 6, 7, -6, 13, 12, 11, 2};\n    int[] b = {-11,\
  \ 25, 4, 45, 67, 87, 34, 23, 33, 55, 13, 15, -4, -2, -22};\n    //Create array newArr\n\
  \    int[] newArr = new int[a.length + b.length];\n    for (i = 0; i <= a.length\
  \ - 1; i++) {\n        newArr[i] = a[i];\n    }\n    for (i = 0; i <= b.length -\
  \ 1; i++) {\n        newArr[a.length + i] = b[i];\n    }\n    //Display array newArr\n\
  \    for (i = 0; i <= newArr.length - 1; i++) {\n        System.out.print(newArr[i]\
  \ + \"\\t\");\n    }\n}\n```\n\n![](img/remember.jpg) `length` 属性包含数组中元素的总数。\n\n\
  ![](img/remember.jpg)与你在第 14.3 节中学习的 `length()` 方法不同，`length` 是一个属性。因此，你不能在末尾加上括号。你将在第八部分中学习更多关于属性的知识。\n\
  \n#### 练习 34.1-4 创建两个数组 – 分离正值和负值\n\n编写一个 Java 程序，让用户向数组中输入 100 个数值，然后创建两个新数组 `pos`\
  \ 和 `neg`。数组 `pos` 必须包含正值，而数组 `neg` 必须包含负值。数值 0（如果有）不应被添加到最终的数组 `pos` 或 `neg` 中。\n\
  \n##### 解决方案\n\n让我们使用下面的示例来分析这种方法。\n\n![Image](img/chapter34-03.png)\n\n在本次练习中，数组\
  \ `ar` 的元素索引位置与 `pos` 和 `neg` 数组之间并不存在一一对应关系。例如，数组 `ar` 位置 1 的元素没有存储在数组 `neg` 的位置\
  \ 1，或者数组 `ar` 位置 2 的元素没有存储在数组 `pos` 的位置 2。因此，你不能这样做：\n\n```java\nfor (i = 0; i <=\
  \ ELEMENTS - 1; i++) {\n    if (ar[i] > 0) {\n        pos[i] = ar[i];\n    } else\
  \ if (ar[i] < 0) {\n        neg[i] = ar[i];\n    }\n}\n```\n\n因为它将导致以下两个数组。\n\n\
  ![Image](img/chapter34-04.png)你需要两个索引变量：用于数组 `pos` 的 `posIndex` 和用于数组 `neg` 的 `negIndex`。当元素添加到相应的数组时，这些变量必须独立地增加，代码所示：\n\
  \n```java\nposIndex = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n\
  \    if (ar[i] > 0) {\n        pos[posIndex++] = ar[i];\n    } else if (ar[i] <\
  \ 0) {\n        neg[negIndex++] = ar[i];\n    }\n}\n```\n\n这可以等价地写入：\n\n```java\n\
  posIndex = 0;\nnegIndex = 0;\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    if (ar[i]\
  \ > 0) {\n        pos[posIndex] = ar[i];\n        posIndex++;\n    } else if (ar[i]\
  \ < 0) {\n        neg[negIndex] = ar[i];\n        negIndex++;\n    }\n}\n```\n\n\
  ![](img/remember.jpg)注意 `posIndex` 和 `negIndex` 具有双重角色。当循环迭代时，它们指向必须放置元素的位置。此外，当创建新数组的循环结束时，该变量的值等于新数组中元素的总数！完整的解决方案如下。\n\
  \n![](img/my_exercise_header.png) Project_34.1-4\n```java\nstatic final int ELEMENTS\
  \ = 100;\npublic static void main(String[] args) throws Exception {\n    int i;\n\
  \    double[] ar = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++)\
  \ {\n        ar[i] = Double.parseDouble(cin.nextLine());\n    }\n    int posIndex\
  \ = 0;\n    int negIndex = 0;\n    double[] pos = new double[ELEMENTS];\n    double[]\
  \ neg = new double[ELEMENTS];\n    for (i = 0; i <= ELEMENTS - 1; i++) {\n     \
  \   if (ar[i] > 0) {\n            pos[posIndex++] = ar[i];\n        } else if (ar[i]\
  \ < 0) {\n            neg[negIndex++] = ar[i];\n        }\n    }\n    for (i = 0;\
  \ i <= posIndex - 1; i++) {\n        System.out.print(pos[i] + \"\\t\");\n    }\n\
  \    System.out.println();\n    for (i = 0; i <= negIndex - 1; i++) {\n        System.out.print(neg[i]\
  \ + \"\\t\");\n    }\n}\n```\n\n### 练习 34.1-5 创建包含数字 5 的数组\n\n编写一个 Java 程序，让用户向数组输入\
  \ 100 个两位整数，然后创建一个只包含至少一个 5 的整数数组。\n\n##### 解决方案\n\n这个练习需要以前的知识。在练习 13.1-2 中，你学习了如何使用商和余数将整数拆分为各个数字。在这里，用户提供的整数是两位数；因此你可以使用下面的代码段拆分变量\
  \ `x` 中的任何两位整数。\n\n```java\nlastDigit = x % 10;\nfirstDigit = (int)(x / 10);\n```\n\
  \n后面的程序使用额外变量作为新数组的索引。当你想使用旧数组的值创建一个新数组且索引位置之间不存在一一对应关系时，这是必要的。当然，只有当新元素添加到新数组时，该变量才增加\
  \ 1。此外，当创建新数组的循环结束迭代时，该变量的值也等于新数组中元素的总数！最终的 Java 程序如下。\n\n```java\nstatic final\
  \ int ELEMENTS = 100;\npublic static void main(String[] args) throws Exception {\n\
  \    int i, k, lastDigit, firstDigit;\n    int[] a = new int[ELEMENTS];\n    for\
  \ (i = 0; i <= ELEMENTS - 1; i++) {\n        a[i] = Integer.parseInt(cin.nextLine());\n\
  \    }\n    k = 0;\n    int[] b = new int[ELEMENTS];\n    for (i = 0; i <= ELEMENTS\
  \ - 1; i++) {\n        lastDigit = a[i] % 10;\n        firstDigit = (int)(a[i] /\
  \ 10);\n        if (lastDigit == 5 || firstDigit == 5) {\n            b[k++] = a[i];\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n## 34.2 使用数组进行数据验证\n\n正如你在第 30.3 节 中学过的，有三种方法可以验证数据输入。你的方法取决于你是否希望显示错误信息，以及你是希望为每种输入错误显示不同的错误信息，还是对任何类型的错误显示通用的错误信息。让我们看看如何将这三种方法适配并用于数组。\n\
  \n## 第一种方法——不带错误信息的数据验证\n\n在第 30.3 节 中，你学习了如何在不显示任何错误信息的情况下验证用户输入的单个值。为了方便起见，这里再次给出了通用形式的代码片段。\n\
  \n```\ndo {\n    System.out.print(\"Prompt message\");\n    input_data = cin.nextLine();\n\
  } while (input_data test 1 fails || input_data test 2 fails || …);\n```\n\n还记得它是如何运行的吗？如果用户输入有效值，执行流将直接进入程序的下一个部分。然而，如果他们输入了无效值，主要目标是反复提示他们，直到他们最终提供有效值为止。\n\
  \n在向数组输入数据时，你可以使用相同的原理。如果你使用 `for`-循环来遍历数组的所有元素，代码片段如下。\n\n```\nfor (i = 0; i <=\
  \ ELEMENTS - 1; i++) {\n    do {\n        System.out.print(\"Prompt message\");\n\
  \        input_data = cin.nextLine();\n    } while (input_data test 1 fails || input_data\
  \ test 2 fails || …);\n    input_array[i] = input_data;\n}\n```\n\n如你所见，当执行流退出嵌套的后测试循环结构时，变量\
  \ `input_data` 确实包含一个有效值，该值随后赋值给数组 `input_array` 的元素。然而，可以使用更简单的方法实现相同的过程，无需使用额外的变量\
  \ `input_data`，如下：\n\n```\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    do {\n   \
  \     System.out.print(\"Prompt message\");\n        input_array[i] = cin.nextLine();\n\
  \    } while (input_array[i] test 1 fails || input_array[i] test 2 fails || … );\n\
  }\n```\n\n## 第二种方法——带通用错误信息的数据验证\n\n与之前一样，下一个代码片段取自第 30.3 节 并适配为与数组操作。它验证数据输入并显示通用的错误信息（即对任何类型的输入错误显示相同的错误信息）。\n\
  \n```\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    System.out.print(\"Prompt message\"\
  );\n    input_array[i] = cin.nextLine();\n    while (input_array[i] test 1 fails\
  \ || input_array[i] test 2 fails || … ) {\n        System.out.println(\"Error message\"\
  );\n        System.out.print(\"Prompt message\");\n        input_array[i] = cin.nextLine();\n\
  \    }\n}\n```\n\n## 第三种方法——带不同错误信息的数据验证\n\n再次，下一个代码片段取自第 30.3 节 并适配为与数组操作。它验证数据输入，并为每种输入错误显示不同的错误信息。\n\
  \n```\nfor (i = 0; i <= ELEMENTS - 1; i++) {\n    do {\n        System.out.print(\"\
  Prompt message\");\n        input_array[i] = cin.nextLine();\n        failure =\
  \ false;\n        if (input_array[i] test 1 fails) {\n            System.out.println(\"\
  Error message 1\");\n            failure = true;\n        } else if (input_array[i]\
  \ test 2 fails) {\n            System.out.println(\"Error message 2\");\n      \
  \      failure = true;\n        } else if (…) {\n            …\n        }\n    }\
  \ while (failure);\n}\n```\n\n### 练习 34.2-1 反序显示奇数\n\n编写一个 Java 程序，提示用户向数组输入 20\
  \ 个正数奇整数，然后按照与提供的顺序完全相反的顺序显示这些奇整数。程序必须验证数据输入，防止用户输入非正值、浮点数或偶整数。用三个版本解决此练习：\n\na)\
  \ 验证数据输入但不显示任何错误信息。\nb) 验证数据输入并显示通用错误信息。\nc) 验证数据输入并为每种输入错误显示不同的错误信息。\n\n#### 方案\n\
