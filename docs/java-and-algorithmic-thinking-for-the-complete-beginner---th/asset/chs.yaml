  \ i--) {\n    System.out.print(odds[i] + \"\\t\");\n}\n```\n\n## 34.3 寻找数组中的最小值和最大值\n\
  \n这是书中提到该主题的第三也是最后一次。第一次是在第 23.2 节 使用决策控制结构，第二次是在第 30.4 节 使用循环控制结构。因此，没有什么可以讨论的了，除了：当你想要在一个已经包含某些数值的数据结构中寻找最小值或最大值时，不需要担心变量\
  \ `minimum` 或 `maximum` 的初始值，因为只需要将数据结构中第一个元素的值赋予它们即可！\n\n#### 练习 34.3-1 哪个深度最大？\n\
  \n编写一个 Java 程序，让用户输入 20 个湖泊的深度，然后显示最深的一个的深度。\n\n##### 解决方案\n\n在用户在数组 `depths` 中输入\
  \ 20 个湖泊的深度后，变量 `maximum` 的初始值可以设置为 `depths[0]`，即数组 `depths` 的第一个元素。然后程序可以从索引 1\
  \ 开始搜索任何大于此值的后续值。最终的解决方案非常直接，将在接下来给出，不再进行解释。\n\n![](img/my_exercise_header.png)\
  \ Project_34.3-1\n```java\nstatic final int LAKES = 20;\npublic static void main(String[]\
  \ args) throws Exception {\n    int i;\n    double maximum;\n    double[] depths\
  \ = new double[LAKES];\n    for (i = 0; i <= LAKES - 1; i++) {\n        depths[i]\
  \ = Double.parseDouble(cin.nextLine());\n    }\n    maximum = depths[0]; // 初始值\n\
  \    // 之后从索引 1 开始搜索\n    for (i = 1; i <= LAKES - 1; i++) {\n        if (depths[i]\
  \ > maximum) {\n            maximum = depths[i];\n        }\n    }\n    System.out.println(maximum);\n\
  }\n```\n![](img/notice.jpg)从位置 0 而不是 1 开始迭代并不是错的，尽管程序会执行一次无用的迭代。\n\n![](img/notice.jpg)给变量\
  \ `maximum` 分配一个“几乎任意”的初始值也没有错，但没有理由这样做。第一个元素的值就足够了！不过，如果你坚持要这样做，可以分配一个 0 作为初始值，因为地球上不存在深度为负数的湖泊。\n\
  \n#### 练习 34.3-2 哪个湖泊最深？\n\n编写一个 Java 程序，让用户输入 20 个湖泊的名称和深度，然后显示最深的一个湖泊的名称。\n\n\
