  \n### 33.1 引言\n\n由于数组的处理使用了你在前面的章节中学习过的相同的序列、决策和循环控制结构，因此这里没有必要重复这些信息。然而，你将在本章中发现：如何单独处理二维数组的每一行或每一列，如何解决需要使用多个数组的问题，如何从一维数组创建二维数组（反之亦然），以及\
  \ Java 支持的一些实用的内置数组方法。\n\n### 33.2 逐行处理每一行\n\n逐行处理每一行意味着每一行都是分开处理的，并且每行的结果（可以是和、平均值等）都可以被单独用于后续处理。\n\
  \n假设你有如下的 4 × 5 数组。\n\n![Image](img/chapter33-01.png)\n\n让我们尝试单独计算每行的和。以下两种方法都遍历了行。\n\
  \n#### 第一种方法——创建一个辅助数组\n\n在这种方法中，程序单独处理每一行，并创建一个辅助数组，数组中的每个元素存储一行的和。这种方法赋予了你很大的灵活性，因为你可以在程序的后续部分使用这个新数组进行进一步处理。辅助数组\
  \ `total` 如右所示。\n\n![Image](img/chapter33-02.png)\n\n现在，让我们编写相应的代码片段。为了更容易地理解这个过程，使用了“从内层到外”的方法。以下代码片段计算第一行（行索引为\
  \ 0）的和，并将结果存储在辅助数组 `total` 位置为 0 的元素中。假设变量 `i` 的值为 0。\n\n```\ns = 0;for (j = 0;\
  \ j <= COLUMNS - 1; j++) {s += b[i][j];}total[i] = s;\n```\n\n该代码片段可以等价地写为：\n\n\
  ```\ntotal[i] = 0;for (j = 0; j <= COLUMNS - 1; j++) {total[i] += b[i][j];}\n```\n\
  \n现在，将此代码片段嵌套在一个遍历所有行的 for 循环中，结果如下。\n\n```\nfor (i = 0; i <= ROWS - 1; i++) {total[i]\
  \ = 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total[i] += b[i][j];\n\n}}\n```\n\
  \n#### 第二种方法——直接查找并处理。\n\n这种方法不使用辅助数组；它只是计算并直接处理和。代码片段如下。\n\n```\nfor (i = 0; i\
  \ <= ROWS - 1; i++) {total = 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total +=\
  \ b[i][j];\n\n}process total;}\n```\n\n`process total` 是什么意思？这取决于给定的问题。它可能只是显示和，也可能计算并显示每一行的平均值，或者可能使用该和来计算更复杂的数学表达式。\n\
  \n例如，下面的示例计算并显示了数组 `b` 每一行的平均值。\n\n```\nfor (i = 0; i <= ROWS - 1; i++) {total =\
  \ 0;for (j = 0; j <= COLUMNS - 1; j++) {\n\n> total += b[i][j];\n\n}average = total\
  \ / COLUMNS;System.out.println(average);}\n```\n\n#### 练习 33.2-1 寻找平均值\n\n有 20 名学生，每一个人都收到了\
  \ 10 节课的成绩。编写一个 Java 程序，提示用户输入每个学生所有课程的成绩，然后为每个学生计算并显示所有大于 89 的平均值。\n\n##### 解决方案\n\
  \n由于你已经学习了逐行处理每一行的两种方法，让我们都用上吧。\n\n###### 第一种方法——创建一个辅助数组\n\n在这种方法中，程序单独处理每一行，并创建一个辅助数组，数组中的每个元素存储一行的平均值。所需的两个数组所示。\n\
