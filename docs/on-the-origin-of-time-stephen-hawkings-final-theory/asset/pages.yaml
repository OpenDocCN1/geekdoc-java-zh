- pgno: 39
  md: 'deterministic explanations are available at a rough, coarse-grained level only.
    At any stage of evolution, determinism and causality shape only the most general
    structural trends and properties, often on the basis of laws operating at a lower
    level of complexity. Human history, for example, rife with accidental twists and
    turns, has so far mostly played out within the confines of planet Earth, with
    the exception of a few excursions to other celestial bodies in the solar system.
    This planetary confinement is not surprising—and thus predictable—given the physical
    and geological environment in which human life arose. But it hardly tells us anything
    about any epoch in human history.


    Likewise, the order of the chemical elements and the structure of the periodic
    table of Mendeleev are essentially fixed by the laws of particle physics at the
    lower level. But the specific abundances of the elements on Earth are contingent
    on countless accidents leading up to and throughout its evolution.


    Moving to the biochemical level, consider the rule that all life on Earth is DNA-based
    and genes are made up of the four nucleotides abbreviated A, C, G, and T. The
    specific building blocks of the DNA molecule are probably the accidental outcome
    of abiogenesis on planet. The basic computational capacity that life must master
    in order to sustain itself runs deeper and may well determine the broad structural
    properties of the molecular carrier of genetic information on the basis of underlying
    mathematical and physical principles. This is borne out by the theoretical construction
    of self-reproducing automata the Hungarian-American mathematician John von Neumann
    in 1948. Five years before Watson and Crick discovered the structure of DNA, von
    Neumann identified the critical computational problems that life must overcome
    to exist and posited an ingenious structure—seemingly the only possible structure—that
    achieves the capacity to replicate. The structure he drew is instantly recognizable
    as DNA.


    Evolution continuously builds on an enormous chain of frozen accidents. Lower
    levels of complexity set the environment for higher levels of evolution, but this
    leaves so much room still for surprising turns that'
