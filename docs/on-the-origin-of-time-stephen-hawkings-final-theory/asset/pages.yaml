- pgno: 198
  md: 'and transitioned into a hot big bang, to differ in their structure and composition.
    Some would have enough matter to produce billions of galaxies, while others would
    be nearly empty. With string theory, the scope for variation among island destinations
    skyrocketed to unimaginable heights. String theory predicted that if there is
    an eternally inflating area out there, then it plays host to a staggering diversity
    of island universes. Each one would bear the imprint of its birth, with one ever
    cascade of transitions when it expanded and cooled. The multiverse as a whole
    would be a truly bewildering, variegated cosmic quilt, stitched somehow by the
    invisible hand of string theory’s metalals.


    Inhabitants of a given island universe looking around might get the impression
    that the physical laws are universal—and as it happens—they might even wonder
    the laws were carefully crafted to bring forth life. But in the variegated multiverse
    of string theory this would be an illusion. What we call the “laws of physics”
    would be local patterns only, frozen relics reflecting the particular way our
    patch of space cooled from the hot big bang. Much like the pointed peaks of tree
    fences or the rightness of DNA, the properties of particles and forces would not
    be part of a great design but merely features of our cosmic environment. It’s
    just that the Darwinian-like process that gave rise to the effective physical
    laws happened far, back in the past, hiding their evolutionary character.


    I vividly remember Leonard Susskind’s lecture “The Anthropic Landscape of String
    Theory,”[] at Universe or Multiverse?, one of the first scientific conferences
    that brought string theorists and cosmologists together. The meeting was held
    at Stanford University in March 2003 and had been convened by Linde and Paul Davies.
    There was a jubilant mood among the gathered theorists. For years, progress toward
    a final theory that uniquely lined up with the observed world had stalled. In
    a stunning reversal, Susskind at the meeting argued that this pursuit had been
    misguided. String theory rests on firm and profound mathematical principles, he
    explained, but the theory isn’t a physical law in the usual sense. Instead we
    should think of it as a metalaw that governs a multiverse of countless island
    universes, with its own local laws of physics.'
