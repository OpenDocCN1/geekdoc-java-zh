    Most physicists continue to follow Plato on his point. They tend to conceive of
    the laws of physics as eternal mathematical truths, living not just in our mind
    but operating in an abstract reality that transcends the physical world. The laws
    of gravity or quantum mechanics, for example, are usually thought of as approximations
    of a final theory that exists somewhere out there, in a realm yet to be uncovered.
    While physical laws emerged in the modern scientific age first and foremost to
    describe patterns found in nature, they, ever since Newton identified their mathematical
    roots, taken on a life of their own, acquiring a sort of reality that supersedes
    the physical world. To the early-twentieth-century Frenchmath Henri Poincaré,
    the notion of unconditional Platonic laws was an indispensable presupposition
