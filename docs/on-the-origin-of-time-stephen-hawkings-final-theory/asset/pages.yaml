  md: '# Energy Density


    ![](img/ab72d2797bfab8215351810eb8aa7ed1_145_0.png)


    > FIGURE 27. The energy density contained in the inflaton field on the vertical
    axis, for different values of the field on the horizontal axis. While the universe
    inflates, the field tends to roll down toward a valley in its energy landscape.


    When, back in 1917, Einstein added the cosmological constant to his theory, he
    finely tuned its value so that its repulsion perfectly balanced the gravitational
    attraction of matter, and the universe stood still. Sixty years on, inflation''s
    pioneers went much further and envisioned that the inflaton field’s antigravity,
    during a brief instant in the very early universe, would have far overpowered
    all sources of attractive gravity and provided the big bang with a real banger—a
    brief burst of enormous cosmic expansion.

    Figure 27 shows inflationary theory at work. The curve represents the energy density
    contained in a (hypothetical) inflaton field for different values of the field.
    The height of this curve indicates the strength of the inflaton''s antigravity.
    Inflationary cosmology imagines that in the earliest stages of the universe, there
    was a small region of space in which the inflaton field somehow wound up high
    on the plateau of its energy curve. This would have caused that patch of space
    to inflate, while the inflaton field inside it would have gently rolled down toward
    the valley in its energy'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'landscape. Once the inflaton tumbled down to its minimum energy state, inflation
    would have run out of fuel. The cosmic growth spurt would have drawn to a close
    and the universe would have transitioned to a much more modest pace of expansion.
    Hence even though they lead to repulsive gravity, an inflaton field differs from
    a cosmological constant in one important respect: A cosmological constant is,
    obviously, constant whereas the value of an inflaton field can change over time.
    This inflation quality makes it possible to turn on and switch off bursts of rapid
    expansion—a key property exploited by inflationary theorists.


    Now, at the end of the inflationary burst, the huge amount of energy stored in
    the inflaton field would have to go somewhere, and that somewhere is heat. When
    inflation ceased, the tumbling inflaton would have filled the universe with hot
    radiation. Some of this heat energy would subsequently turned into matter, because
    Einstein''s formula $E = mc^2$ tells us that as long as there is enough energy
    $(E)$ to pay for the mass $(m)$ of a particle, the way lies open for highly energetic
    particles of radiation (photons) to be transformed into massive particles. At
    the end of the flash of inflation, the intense energy released may well heated
    the universe to a thousand trillion degrees, more than sufficient to create the
    $10^{50}$ tons of matter contained in the observable universe.


    INFLATION PRODUCES a fantastically large and uniform universe in less than the
    blink of an eye. But what about the vital flickers in the CMB that COBE spotted?
    Does inflation produce a universe that is almost, but not quite perfectly, smooth?


    As a matter of fact, it does. Like all physical fields, the inflaton is a quantum
    field. Heisenberg''s uncertainty principle says that it too must be subject to
    irreducible quantum fuzziness. Like particles, this means that the more precisely
    we pin down the value of a field at a particular location, the less precisely
    its rate of change at that location can be known. But if a field''s rate of change
    is somewhat uncertain, we cannot know what'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'its exact value will be a moment later. Quantum fields, that is, assume a strange
    jittering mixture of many different rates of change and values, much like the
    many paths making up the wave function of a particle.


    Normally quantum jitters are extraordinarily small and confined to microscopic
    scales. A surge of cosmic inflation is anything but normal. To their amazement,
    theorists studying inflation soon realized that the enormous burst of expansion
    they were envisioning would amplify microscopic quantum fluctuations and stretch
    these to macroscopic wavelike variations. Even if the inflation started with the
    bare minimum level of jitters allowed by the uncertainty principle, a burst of
    inflationary expansion would transform these into macroscopic wobbles, superimposing
    on the overall smoothness of the expanding universe a wavy pattern of variations
    in the field, much like ripples on the surface of an otherwise smooth lake.


    Crucially, when inflation ends and the inflaton liberates its energy into a burst
    of heat, the hot gas that fills the newborn universe inherits these variations.
    The upshot is that any universe that emerges from inflation came equipped with
    small irregularities in the temperature of the radiation and in the density of
    the matter. Under the slowing cosmological expansion that ensues, more and more
    of these primeval ripples would roll within our cosmological horizon and become
    visible, somewhat waves arriving on the shore. The fluctuations in the radiation
    temperature would be for us to admire. They would show up as hot and cold spots
    in the CMB as we compare its temperature in different directions in the sky. But
    the density variations in the matter would become important, for they can seed
    the growth of galaxies. Regions where there is less density initially expand faster
    and empty out. Regions with more matter would start drawing in even more material
    from their surroundings, enhancing the density contrast and, in this way, sculpt
    the large-scale web of galaxies we see today.


    In the summer of 1982 Stephen and Gary Gibbons brought the principal inflationary
    theorists together in Cambridge for what, years later, he fondly remembered as
    a real workshop. The Very Early Universe was funded by'
  merge: -1
