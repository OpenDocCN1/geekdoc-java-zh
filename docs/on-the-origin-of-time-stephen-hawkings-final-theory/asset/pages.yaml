    On the Galápagos Islands, Darwin found a variety of finches that differed in the
    size and shape of their beaks. Ground finches had strong beaks, effective for
    cracking nuts and seeds, while tree finches had sharp, pointed beaks that were
    well adapted for extracting insects. These and other data on his journey suggested
    Darwin that different varieties of finches were related and had evolved over time
    under influence of their specific ecological niches. In 1837, fresh from his voyage
    to the Galápagos on the HMS Beagle, Darwin made a simple sketch in one of his
    red notebooks of an irregularly branched tree. This sketch, of an ancestral tree,
