    The randomness inherent in biological evolution extends to other levels of history,
    from abiogenesis to human history. Like Darwin, historians account for accidental
    twists and turns in the course of history by distinguishing between "how" and
    explaining "why". To describe how, historians reason ex post facto, as biologists
    do, and reconstruct the series of specific events that led from one point to a
    given outcome. To explain why, however, requires one to think like a physicist
    and work forward in time to identify causal, deterministic connections that predict
    one particular historical path over any other. A superficial reading of history
    often appears to offer a causal deterministic explanation for why things happened
    one way and not another. But a more refined analysis reveals an intricate web
    of competing forces at crossroads that, together with a great number of accidents,
    render the road taken far from obvious and certainly not inevitable, forcing one
    into a description of how, not why.'
