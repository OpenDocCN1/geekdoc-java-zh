    STEPHEN''S NO-BOUNDARY MODEL of the beginning—conceived from the top down!—is
    key to realize the fundamentally historical perspective on physics and cosmology
    that I have advocated, a view of physics that includes the genesis of the laws.
    The no-boundary hypothesis predicts that if we trace the primordial universe as
