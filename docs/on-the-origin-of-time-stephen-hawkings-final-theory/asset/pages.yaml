  md: '12. Wave functions in ordinary quantum mechanics, without gravity, obey the
    Schrödinger equation, which prescribes how they evolve in time. Time is the sole
    entity in ordinary quantum mechanics that doesn''t interfere with anything else.
    Without any problem, physicists calculate probabilities in quantum mechanics for
    observations at a precise, given moment in time. All of this is only possible
    however because ordinary quantum mechanics presumes there is a fixed and definite
    spacetime background, in which wave functions of particles evolve. By contrast,
    in quantum cosmology spacetime itself is quantum mechanical and fluctuating. As
    a consequence, we no longer have anything available that can function as a universal
    clock. Hence it should be no surprise that time drops out in a quantum description
    of the universe as a whole. True, the wave function of the universe obeys an abstract
    version of the Schrödinger equation, first written down by John Wheeler and Bryce
    DeWitt, but this is not a dynamic law. It is more like a timeless constraint on
    the wave function in its totality.


