- pgno: 195
  md: 'Those early hopes were soon dashed with the discovery that, just like musical
    instruments, extra dimensions in string theory come in a huge number of shapes
    and forms. During the 1990s, theorists watched with horror as a stupendous new
    of ways to wrap six extra dimensions into a tiny nugget were found. These hidden
