  md: 'But the most dizzying life-engendering fine-tuning concerns dark energy. The
    value of the dark energy density that we''ve measured is extraordinarily small—a
    stunning 10⁻¹²³ of what many physicists would consider a natural value. Yet this
    smallness is precisely what made the universe “hesitate” for about eight billion
    years before dark energy was able to muster sufficient strength to accelerate
    the expansion. Already in 1987, Stephen Weinberg pointed out that if the dark
    energy density were somewhat larger—say 10¹² times its natural value—then its
    repulsive effect would have been stronger and kicked in earlier, once again closing
    the cosmic window of opportunity to form many galaxies.[2]


    In short, Stephen emphasized in our first conversation, it appears as if the universe
    has somehow been designed to make life possible. The celebrated writer and theoretical
    physicist Paul Davies has spoken in this context of the universe’s Goldilocks
    factor: “Like the porridge in the tale of Goldilocks and the three bears, the
    universe seems to be ‘just right’ for life, in many intriguing ways.”[3] And while
    this doesn''t quite mean that the cosmos should be teeming with life, the judicious
    tunings that render it habitable at all are by no means superficial qualities
    of the world. Instead they are inscribed deeply in the mathematical form of the
    laws of physics. The masses and properties of the array of particles, the forces
    governing their interactions, and even the overall composition of the universe—all
    of which seem tailor-made to support some form of life—reflect the specific character
    of the mathematical relationships that define physicists call the laws of nature.
    So the riddle of design in cosmology is that the fundamental laws of physics appear
    to be specifically engineered to facilitate the emergence of life. It is as if
    there is a hidden plot at work that weaves together our existence with the basic
    rules on which the universe runs. This seems incredible. And it is! What is this
    plot?


    Now, I should stress that this is a highly unusual puzzle for theoretical physicists.
    Typically, physicists use the laws of nature to describe one or another phenomenon
    or to predict the outcome of an experiment. They also attempt to generalize the
    existing laws to bring a wider range of natural phenomena into their fold. But
    these questions of design lead us'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'down quite different path. They prompt us to reflect upon the deeper nature
    of the laws, and on how we fit into their scheme. The thrill of modern cosmology
    is that it provides a scientific framework in which we can hope to elucidate this
    biggest of all mysteries. For cosmology is the one area of physics where we are
    an inherent part of the problem we''re trying to solve.


    HISTICALLY, THE APPARENT design of the world has been taken as evidence that there
    is an underlying purpose to the workings of nature. This view goes back to Aristotle,
    perhaps the most influential philosopher who ever lived. Also a dedicated biologist,
    Aristotle observed that many of the processes operating in the living world seemed
    filled with intent. If living things that lack reason have an agenda, he thought,
    there must be a Final Cause causing the cosmos as a whole. Aristotle''s teleological
    argument was persuasive, logical, comforting, and to some extent born out empirically;
    the world around us exudes endless examples of final causes at work, from a bird
    collecting branches to build a nest to a dog digging a hole in the garden to unearth
    a bone. It''s surprising, then, that Aristotle''s teleological views held up,
    largely unchallenged, for almost two millennia.


    But then, in the sixteenth century, somewhere on the outskirts of the Eurasian
    firsthand, the work of a small circle of scholars sparked the modern scientific
    revolution. Copernicus, Descartes, Bacon, Galileo, and their contemporaries stressed
    that our senses betray us. They embraced the Latin dictum Ignoramus, literally,
    "We do not know." This shift in perspective has had repercussions far and wide.
    Some even consider it the single most influential transformation in the approximately
    two hundred years that humans have dwelt on this planet. Moreover, its full significance
    has yet to unfold. The immediate upshot of the scientific revolution, at least
    in scholarly circles, was to discard Aristotle''s deeply entrenched teleological
    worldview and replace it it with the idea that nature is governed by rational
    laws, operating here and now,'
