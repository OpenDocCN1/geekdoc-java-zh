    before joining the Manhattan Project during World War II. At Princeton University
    in the 1950s, he revitalized the study of general relativity, taking up where
    Einstein had left off. With only one precise observational test—the perihelion
    shift of the planet Mercury—and two qualitative tests—general relativity had become
    a bit of a backwater of physics at the time, often regarded as a branch of mathematics,
