    Hawking''s final theory offers a radically different interpretation of this closure
    of spacetime at the big bang. The later Hawking held that this nothingness at
    the beginning is nothing like the emptiness of a vacuum, of which universes may
    or not be born, but a much more profound, epistemic horizon involving no space,
    no time, and, crucially, no physical laws. “The origin of time” in Stephen''s
    final theory is the limit of what can be said about our past, not just the beginning
    of all that is. This view is especially borne out by the holographic form of the
    theory where the dimension of time and hence the basic notion of evolution, the
    epitome of reductionist concepts, are seen as emergent qualities of the universe.
    From a holographic viewpoint, going back in time is taking an increasingly fuzzy
    look at the hologram. One literally sheds more and more of the information that
    it encodes until, one runs out of qubits. That would be the beginning.


    It is a striking property of top-down cosmology that it has a built-in mechanism
    that limits what we can say about the world. It is as if a proper'
