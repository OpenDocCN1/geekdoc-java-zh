- pgno: 211
  md: 'As we know, laboratories are specifically designed to study the behavior of
    systems from an external viewpoint. Laboratory scientists meticulously maintain
    a clean separation between their experiments and the world outside. (And experimental
    particle physicists at CERN should, stay safely away from their high-energy collisions!)
    Orthodox physical theory reflects this separation, with a clear conceptual cut
    between dynamics, governed by the laws of nature, and boundary conditions representing
    the experimental arrangement and the initial state of the system. The former we
    seek to discover and test, while the latter we strive to control. That is the
    dualism I described in chapter 3.


    This sharp division between laws and boundary conditions renders laboratory science
    rigorously predictive but limits its scope, for we can hardly squeeze the entire
    universe in the straitjacket of a. Anticipating Stephen, I responded emphatically:
    "A God’s-eye view is obviously fallacious" in cosmology. We are within the universe,
    not somewhere outside it.


    Stephen assented and concentrated intensely on composing his next phrase.


    The failure to recognize this, he clicked, has led us into a blind alley. We need
    a new philosophy [of physics] for cosmology.


    Ah, I laughed, time for philosophy at last!


    Leaving his suspicion of philosophy aside for a moment, he nodded—lifting his
    eyebrows. Linde versus Hawking, we had come to understand, wasn’t merely a debate
    about cosmological theory versus another. At the heart of the controversy over
    the multiverse lay central questions about the deeper epistemological nature of
    physical theory. How do we relate to our physical theories? What do the marvelous
    discoveries of physics and cosmology ultimately tell us about the great question
    of existence?


    EVER SINCE the modern scientific revolution, physics has thriven by adopting a
    godlike view of the cosmos—not as creator—at least not always—but in terms of
    theoretical perspective.'
