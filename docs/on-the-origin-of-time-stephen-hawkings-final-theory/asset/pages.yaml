  md: 'But it paid off. In November 1915, in the dark days of World War I, Einstein
    could finally put forward his theory of general relativity, a new theory of gravity,
    consistent with his special relativity theory of spacetime, that would become
    his most sweeping scientific accomplishment.


    General relativity describes gravity in geometric terms—the geometry, in fact,
    of spacetime itself.⁶ The theory conceives of gravity as a manifestation of the
    curving and bending of the fabric of spacetime by mass and energy. For example,
    the theory holds that Earth moves around the sun not because there is a mysterious
    force acting over that vast distance, somehow pulling upon Earth, but the mass
    of the sun slightly warps the shape of space in its vicinity. This warping creates
    a sort of valley that guides Earth (and the other planets) into nearly elliptical
    orbits around the sun. We can''t see this valley but we feel it—it''s gravity!
    Likewise, according to Einstein, you are kept with your feet on the ground because
    the mass of Earth creates a slight dent in the shape of space in which your body
    tries to slide down, as it were, leading you to feel an upward pressure on your
    feet. It is that same dent that keeps satellites the International Space Station
    and the moon nicely in orbit around our planet.


    And it''s not only space that curves but time, a phenomenon exploited—and greatly
    exaggerated—by the directors of such movies as Interstellar. When Joseph Cooper
    and his crew returned to their spaceship after their brief stay on Miller''s planet,
    they found that the crew member who had stayed behind, had aged more than twenty-three
    years. Apparently the huge mass of the black hole near Miller''s planet had caused
    time to elapse more slowly for the visiting crew.


    The sheer power of Einstein''s general theory of relativity stems from the fact
    that it encapsulates this wonderful dialogue between matter and the shape of spacetime
    in a mathematical equation:


    ![](img/ab72d2797bfab8215351810eb8aa7ed1_63_0.png)'
