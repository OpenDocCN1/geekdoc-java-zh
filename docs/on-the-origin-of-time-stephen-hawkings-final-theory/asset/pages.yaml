  md: '# 11-DIMENSIONAL SUPERGRAVITY


    ![](img/ab72d2797bfab8215351810eb8aa7ed1_275_0.png)


    FIGURE 53. A web of mathematical relationships interlink the five string theories
    and supergravity theory, hinting at a deeper unifying story.


    Mathematical relationships that transform seemingly distinct theories into each
    other are known to physicists as *dualities*. Two theories that are dual are equivalent
    in some fashion; they describe one and the same physical situation expressed in
    a different mathematical language. A simple example is the wave/particle duality
    in quantum mechanics, which caused a great deal of confusion in the early days
    of the theory.


    Dualities are powerful calculational assets, for by offering a complementary perspective
    on a given physical system, they can unlock new insights. The dualities of M-theory
    are especially powerful because they often transform a daunting analysis in one
    string theory into a straightforward problem in its dual partner theory. Before
    the second string revolution, physicists had to rely on approximate methods to
    analyze each of the string theories separately. This restricted their playing
    field to semiclassical situations in which a relatively small number of strings
    were vibrating in a gently curved classical background space. As a result, the
    fascinating quantum properties of black holes, let alone of the big bang, remained
    out of reach of their analyses, and the grand project of unification'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'remained bogged down. The second string revolution dramatically changed all
    this. Ever since, when the going gets tough in one string theory, a duality has
    often come to the rescue to reshape an impossibly difficult calculation into a
    perfectly feasible one in a different string theory. So, Witten''s M-theory web
    is much more than the sum of its components. By stitching insights from all five
    string theories and from supergravity, M-theory has opened up wholly uncharted
    territories in the quantum realm of gravity and unification.


    But the pinnacle of the second string revolution was the discovery of a duality
    of an entirely new kind, a duality so strange that no one thought it could exist—a
    holographic duality.


    IN 1997 ARGENTINIANBORN Juan Maldacena, while working as a young assistant professor
    at Harvard University, hit on a most intriguing duality that linked neither two
    string theories, nor two particle theories. Instead, related string theories with
    gravity to particle theories without gravity. What''s more, the two sides in Maldacena''s
    duality live in a different number of dimensions: The particle theory is like
    a hologram of the gravity theory.


    Maldacena uncovered this strange duality by thinking about string theory and supergravity
    in a specific hypothetical setting. The gravity of Maldacena''s duality involves
    general relativity and supergravity in universes with a shape similar to anti-de
    Sitter space, or AdS space. As its name suggests, AdS is the antipode to Sitter
    space. The latter is the solution to the Einstein equation found by the Dutch
    astronomer Willem de Sitter in 1917 that describes an exponentially expanding
    universe filled with a positive cosmological constant [λ > 0]. Anti-de Sitter
    space has a negative cosmological constant [λ < 0] and does not expand. Quite
    the contrary, it is somewhat akin to the interior of a snow globe world, a spherical
    box bounded on all sides by an impenetrable surface.'
