- pgno: 23
  md: 'astronomical observations of nearby galaxies pointed to a high expansion rate
    in recent times. But when he ran the evolution of the universe backward in time
    at this same rate, he found that the galaxies must all have been on top of one
    another no more than a billion years ago. This was impossible, of course, for
    Earth and the sun are much older than that. To avoid an obvious conflict between
    the history of the universe and that of our solar system, he imagined an intermediate
    era of very slow expansion, to give stars, planets, and life time to develop.


    In the decades since Lemître’s pioneering work, physicists have continued to stumble
    across many more such “happy coincidences.” Make a small change in any of his
    basic physical properties, from the behavior of atoms and molecules to the structure
    of the cosmos on the largest scales, and the universe’s habitability would hang
    in the balance.


    Take gravity, the force that sculpts and governs the large-scale universe. Gravity
    is extremely weak; it requires the mass of Earth to keep our feet on the ground.
    But if gravity were stronger, stars would shine more brightly and hence far younger,
    leaving no time for complex life to evolve on the orbiting planets warmed by their
    heat.


    Or consider the tiny variations, one part in a hundred thousand, in the temperature
    of the relic big bang radiation. Were these differences slightly larger—say one
    part in ten thousand—the seeds of cosmic structures would have grown into giant
    black holes instead of habitable galaxies with abundant stars. Conversely, even
    smaller variations—one million or less—would produce no galaxies at all. The hot
    big bang got it right. One way or another it set off the universe on a superbly
    biofriendly trajectory, of which would not become evident until several billion
    years later. Why?


    Other examples of such happy cosmic coincidences abound. We live in a universe
    with three large dimensions of space. Is there anything special about three? There
    is. Adding just a single space dimension renders atoms and planetary orbits unstable.
    Earth would spiral into the sun instead of tracing out a stable orbit around it.
    Universities with five or more space dimensions have even bigger problems. Worlds
    with only two space'
