    +   9. The general idea that the gravity side of the holographic duality involves
    a sum over interior geometries goes back to the early days of the duality. When
    Witten first proposed that black holes in an AdS universe have a dual description
    in terms of a hot bath of quarks and gluons moving about in the boundary world,
    he also noticed that there was a second interior geometry without a black hole
    floating around in his calculations. When the quark soup is hot, the no-black-hole
    interior was lying low. Its amplitude in the wave function was negligibly small.
    But when Witten lowered the temperature of the soup (as a thought experiment!),
    he noticed that its composition changed, with quarks clumping together and forming
    tightly bound composite particles like protons or neutrons. On the gravity side,
    this transition from hot to cold'
