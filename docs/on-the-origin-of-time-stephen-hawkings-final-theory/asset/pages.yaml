  md: '5. Quoted in Abraham Pais, “Subtle is the Lord”— The Science and the Life of
    Albert Einstein (Oxford: Oxford University Press, 1982).


    BACK TO NOTE REFERENCE 5


    6. The language of warped geometry that Einstein employed had been developed in
    the nineteenth century by mathematicians such as Carl Friedrich Gauss and Bernhard
    Riemann, who realized that the usual rules of geometry that many of us learn at
    school, like the famous theorem named after Pythagoras, or the theorem that the
    angles of a triangle add up to 180 degrees, don’t work on curved surfaces. For
    example, an orange (or on the earth’s surface), the angles of a triangle add up
    to more than 180 degrees. Before Gauss and Riemann, curved surfaces had always
    been thought of as embedded in normal three-dimensional Euclidean space. But Gauss
    showed that the geometrical properties of two-dimensional curved surfaces, like
    notions of straight lines and angles, can be defined intrinsically, without referring
    to anything outside them. This opened up the way for Riemann to imagine that in
    a similar fashion, a three-dimensional space could be curved and differ from a
    Euclidean space. Einstein imagined exactly this and went one step further, describing
    the physical world in terms of a four-dimensional warped geometry of spacetime.
    Curved spacetime obeys the rules of non-Euclidean geometry in four dimensions,
    without having to invoke anything outside or beyond it. Physically, this means,
    e.g., that the universe doesn’t need to exist or expand in some sort of bigger
    box.


