    Inspiration came from an unexpected corner. Around that time a second revolution
    in physics was picking up. This one was brewing on the desks and blackboards in
    the offices of string theorists, while experimenting with hypothetical universes,
    had discovered that these have weird holographic properties.


    I first heard about the holographic revolution sweeping theoretical physics in
    January 1998. As a fresh graduate student I was taking the advanced math course
    at DAMTP known in the Cambridge jargon as Part III when, at the Lent Term, the
    faculty put together a special series of research seminars—in light of an important
    new development, we were told, that, rumors had, would “change everything.”


