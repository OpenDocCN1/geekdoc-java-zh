  md: 'years of cosmic evolution. This was cosmology’s golden decade of discovery,
    when it felt as if the book of nature lay wide open for us to devour.


    The Cosmic Background Explorer satellite, COBE for short, launched by NASA in
    1989, had played a key role in our reading of the first few pages of cosmic history.
    One experiment on board COBE had established that the ancient cosmic microwave
    background radiation (CMB) had a near-perfect thermal spectrum, with a temperature
    of 2.725 Kelvin. But COBE had carried a second experiment, the differential microwave
    radiometer, designed to scan for minute differences in the temperature of the
    CMB radiation in different parts of the sky. This was an epic experiment. Cosmologists
    had known all along that the early universe couldn''t have been exactly uniform,
    simply because the later universe isn''t exactly uniform. Today we find matter
    aggregated into galaxies and clusters of galaxies. The universe started out as
    a perfectly uniform gas, this web of galaxies would never have formed, and since
    galaxies are the cosmic cradles of life, we wouldn''t exist. By contrast, even
    the smallest density variations in the primeval plasma would over time have become
    amplified under the influence of gravity, potentially causing matter in the denser
    regions to clump and form cosmic structures. Calculations of the competing effects
    of expansion and gravitational clumping show that to grow galaxies in a period
    of about ten billion years, the baby universe must have seeded density contrasts
    of at least one part in a hundred thousand. Ever since the serendipitous discovery
    of the CMB in the mid-sixties, cosmologists had searched for traces of these fluctuations.
    The COBE satellite was their last hope. Designed to reach this crucial level of
    sensitivity in the hunt for cosmic roots, COBE was tapping into the basic consistency
    of the hot bang theory.


    To cosmologists’ relief, COBE found precisely what it was looking for. Its data
    revealed that the early universe did, indeed, have hotter and colder regions.
    While the temperature of the CMB is 2.7250 K on average, it tends to be 2.7249
    K in one direction and 2.7251 K in another patch of'
