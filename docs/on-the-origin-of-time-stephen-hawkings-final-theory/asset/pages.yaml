    This process was extensively discussed by the Austrian-British philosopher Karl
    Popper. According to Popper, what makes science a uniquely powerful approach to
    acquiring knowledge is the fact that over and over again, consensus is reached
    among scientists as a result of rational argument on the basis of available evidence.
    Popper realized that a scientific theory can never be proven true, but it can
    be falsified, meaning that it can be contradicted by experiments. But—and this
    is Popper’s key point—this process of falsification has only been possible because
    theoretical hypotheses have been required to make unambiguous predictions that,
    if contrary results were found, at least one premise of the theory would have
