    fly around the globe by always aiming straight ahead. What''s more, nothing would
    have changed, for Einstein engineered his universe to be unchanging in time. To
    achieve this outcome, he even added an extra term to his equation, which he called
    the cosmological term and denoted with the Greek letter λ known as the cosmological
    constant. Einstein''s λ term describes a dark energy of space that manifests itself
    on the very large scales of the universe where it gives rise to some sort of antigravity,
    or cosmic repulsion. Einstein saw that for a hypersphere of a special size, the
    attractive gravitational pull of all matter and the repulsion induced by the λ
    term can be perfectly balanced, yielding a universe that neither expands nor contracts
    and that exists in all past and future eternity. This was the cosmos he was after
