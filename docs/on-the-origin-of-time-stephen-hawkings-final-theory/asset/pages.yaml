    ![](img/ab72d2797bfab8215351810eb8aa7ed1_24_0.png)


    FIGURE 3. It appears difficult for life to form, let alone itself in a universe
    with only two dimensions of space. Obvious mechanisms for hunting and eating would
    not work.


    Moreover, this uncanny fitness for life extends to the universe''s chemical properties,
    which are determined by the properties of elementary particles and the forces
    acting between them. For example, neutrons are a tad heavier than protons. The
    neutron-to-proton mass ratio is 1.0014. Had it been the other way around, all
    the protons in the universe would have decayed into neutrons shortly after the
    big bang. But without protons there would be no atomic nuclei and hence no atoms
    and no chemistry.


    Another example of this is the production of carbon in stars. As far as we know,
    carbon is essential for life. But the universe was not born with it. Rather, carbon
    is formed in the nuclear fusion that takes place inside stars. In the 1950s, the
    British cosmologist Fred Hoyle pointed out that the efficient synthesis of carbon
    from helium rests on a delicate balance between the strong force that binds the
    atomic nuclei, and the electromagnetic force. If the strong force were just a
    fraction stronger or weaker—as little as a few percent—then the nuclear binding
    energies would shift, compromising the fusion of carbon and hence the formation
    of carbon-based life. Hoyle felt this as he said the universe looked like a “put-up
    job,” as if “a super-intellect had monkeykeyed with physics as well as with chemistry
    and biology.\”[1]'
