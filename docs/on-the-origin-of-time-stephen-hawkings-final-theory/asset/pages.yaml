    Newton’s demonstration in the *Principia* that the same universal principles underpin
    the workings of the divine heavens and of the imperfect human world around us
    marked a conceptual and spiritual break with the past. It is sometimes said that
    Newton unified the heavens and the earth. His synthesis of the planetary motions
