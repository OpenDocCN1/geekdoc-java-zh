    THESE PLATONIC leanings on matters of design in physics and cosmology, while not
    obviously wrong, differ radically from how, ever since Darwin, biologists come
    to see design in the living world.


    Goal-directed processes and seemingly purposeful design are ubiquitous in the
    biological world. Indeed, these formed the basis for Aristotle''s teleological
