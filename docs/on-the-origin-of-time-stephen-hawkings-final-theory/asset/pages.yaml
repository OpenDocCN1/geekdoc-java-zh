- pgno: 203
  md: 'BY THE TURN of the century Stephen had grown increasingly concerned the anthropic
    reasoning in cosmology undermined the rational method that is science’s beating
    heart. This is perhaps a subtle point to understand, but bear with me, for we
    have arrived at the core of the matter in Linde versus Hawking.


    The basic problem is that the anthropic principle relies on the assumption—all
    too often swept under the carpet—that, in one way or another, we are typical inhabitants
    of the multiverse. In order to reason anthropically, that is, one must first specify
    what''s typical and what''s not. This is done by singling out some of the biophilic
    properties of the physical world that are deemed important for life. These properties
    transcribe words like “we,” “us,” or the “observer” in the language of physics.
    Their prevalence, together with the statistical properties of the multiverse,
    is then used to deduce what sort of island universe we—typical multiverse dwellers—should
    be, and hence what sort of physics we can expect to discover with our telescopes.


    But what selects the “anthropic” properties that specify the ensemble of observers
    of which we are supposedly typical, randomly selected members? Should we consider
    certain properties of the effective laws, or count the number of spiral galaxies,
    or even the fraction of baryons that end up in galaxies, or the number of advanced
    civilizations? We are all typical in some respects and atypical in other ways.
    I am typical in the sense that I live in the most populous country on my planet?
    Readers from India will answer yes, others won''t. I am typical in the sense that
    I live in a country that has four seasons? Most readers will answer yes but some
    won''t. Furthermore, there are vast numbers of ensembles for which there is no
    way of telling. Do we live in the universe that has the largest number of civilizations?
    We might. But we might just as well live in a universe that is atypical in this
    respect, that it has some civilizations but far fewer than other universes. Neither
    present nor future data will tell. We don''t know. And this is a problem for anthropic
    multiverse cosmology. Because in the absence of a clear-cut criterion that specifies
    the correct reference class of multiverse inhabitants, all theoretical predictions
    of anthropic'
