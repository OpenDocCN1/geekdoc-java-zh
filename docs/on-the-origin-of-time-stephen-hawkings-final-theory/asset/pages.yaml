- pgno: 47
  md: 'Not surprisingly, then, in 1973 Carter first put forward his cosmological anthropic
    principle, with theoretical evidence for any kind of multiverse patchy at best,
    his musings were generally dismissed as nonsense. But toward the end of the century,
    in a remarkable turn of events, multiverse theory gained traction, Carter''s anthropic
    thinking was swiftly resurrected and seized to sort out our place in this vast
    cosmic patchwork. The anthropic principle came to be seen as the PIN that converted
    multiverse theory from an abstract Platonic edifice into a proper physical theory
    with rare explanatory potential.


    Multiverse aficionados declared that they had found a second possible answer to
    the universe''s design—the first being that it''s just a coincidence, a lucky
    consequence of a deep but (as yet) mysterious mathematical principle at the of
    existence. The new answer coming from anthropic multiverse cosmology was that
    the apparent design is a property of our “local” cosmic environment: We inhabit
    a rare bioferiously universe in a huge cosmic mosaic of island universes, singled
    out by the anthropic principle. Excitement at this development ran high. “We are
    together, the universe and us,” Linde proclaimed. “I cannot imagine a consistent
    theory of the universe that ignores life and consciousness.”[In his book The Cosmic
    Landscape, the opinionated string theorist Leonard Susskind of Stanford University
    (which can be relied upon for bold speculation) portrayed the tandem of objective
    metalaws together with a subjective anthropic principle as the new paradigm for
