  md: 'element to any effective laws encodes, and emergence in a quantum world is
    subject to random variations.


    Curiously, therefore, the story of grand unification can be read in two ways,
    each exhibiting a different side of the story.


    Reading from low to high energies, from top to bottom in figure 35, we recover
    the success story of the unification program of particle physics. Going up in
    energy we encounter ever more embracing symmetries, encoding ever deeper mathematical
    patterns that interconnect the observed forces and particles and possibly even
    dark matter in an ever more inclusive unifying framework. This is the orthodox,
    particle physics reading of unification, and it is how these ideas are tested
    in the lab. Particle physicists request larger accelerators to smash particles
    together with higher energies in order to explore deeper-lying unifying symmetries
    (all the while assuming that the threshold to create black holes lies still).
    This reading also emphasizes the interdependencies among nature’s building blocks
    and the kernel of necessity that unification seeks to uncover.


    Reading from high to low energies, from bottom to top in figure 35, we see a sequence
    of transitions that create a branching, treelike structure of physical forces
    and particle species very reminiscent of the tree of life (see figure 5). This
    is the natural reading in a cosmological context, where expansion causes cooling
    and cooling causes branching. Viewed this way, unification is in the first place
    a source of variation, enabling a process whereby physical laws mutate and diversify
    much like biological species would do billions of years later.


    These readings aren''t in contradiction with each other. They are merely two sides
    of the same coin—variation and selection.


    THE MOMENTOUS DISCOVERY of string theory’s staggering spectrum of branching pathways
    proved a game changer for the theory of the multiverse. Early on, multiversists
    like Linde and Vilenkin had already realized that we can expect island universes,
    regions where inflation ended'
