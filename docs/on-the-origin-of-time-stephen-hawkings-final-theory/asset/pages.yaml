  md: 'seeds for cosmology reinvent itself. In this book I have argued that a genuine
    quantum outlook on the universe counters the relentlessless alienating forces
    of modern science and lets one build cosmology anew from an interior viewpoint—the
    essence of Hawking’s final theory.


    IN A QUANTUM universe, a tangible past and future emerge out of a haze of possibilities
    by means of a continual process of questioning and observing. This overobservation,
    the interactive process at the heart of quantum theory that transforms what might
    be into what happens, constantly draws the universe more firmly into existence.servers—in
    this quantum sense—acquire a sort of creative role in cosmic affairs that imbues
    cosmology with a delicate subjective touch. Observership also introduces a subtle
    backward-in-time element into cosmological theory, for it is as if the act of
    observation today retroactively fixes the outcome of the big bang “back then.”
    This is why Stephen referred to his final theory as top-down cosmology; we read
    the fundamentals of the history of the universe backward—from the top down.


    By integrating observation within its architecture, yet without assigning a privileged
    role to life, top-down cosmology steers clear of both the danger of being “lost
    in math,” articulated by Arendt, and the pitfalls of the anthropic principle.
    Somewhat prosaaically, one might say that Stephen’s final theory conceives of
    neither as a godlike figure hovering above the universe, nor as a helpless victim
    of evolution in the margins of reality, but as nothing more or less than himself.
    Having wrestled with the anthropic principle for much of his career, Stephen was
    evidently pleased with this outcome. Top-down cosmology turns the riddle of the
    universe’s apparent design in a sense upside down. It embodies the view that down
    at the quantum level, the universe engineers its own biofriendliness. Life and
    the universe are in some sense a mutual fit, according to the theory, because,
    in a deeper sense, they come into existence together.'
