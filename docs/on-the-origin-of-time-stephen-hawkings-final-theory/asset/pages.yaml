    Maldacena arrived at his holographic duality by considering, from two different
    perspectives, the properties of a tightly stacked collection of three-dimensional
    membranes, which theorists call three-branes. Earlier, the lucid theorist Joe
    Polchinski had realized that such branes in M-theory are special loci the endpoints
    of strings making up matter “particles” are attached to. Strings can move freely
    through branes but can’t leave branes. The only exception to this rule are the
    strings responsible for gravity, because these are closed loops with no endpoints,
    so branes cannot trap them. This means that, in string theory, gravity necessarily
    leaks off branes, propagating into all spatial dimensions, whereas matter can
    be confined to branes. Now from one viewpoint, the intrinsic point of view that
    looks at the'
  merge: -1
  img_proc: true
- pgno: 384
  md: 'dynamics of strings moving through the branes, Maldacena found that the stack
    of three-branes is described by a quantum field theory living in three spatial
    dimensions—the three dimensions making up the three-branes. But next Maldacena
    considered the same stack of three-branes from an exterior viewpoint, looking
    at how the stack as a whole impacts its environment. Looking at the stack this
    way, Maldacena found that it is basically a gravitating system. The branes have
    mass and energy and they bend spacetime in their vicinity. Moreover, the curved
    spacetime generated by the branes turns out to extend into an additional direction
    orthogonal to the branes the shape of an AdS space. Both perspectives appear radically
    different. However, Maldacena reasoned, they describe one and the same physical
    system, they ultimately be the same. That is, they should be dual to each other.
    Thus Maldacena arrived at a holographic duality relating gravity and string theory
    in curved AdS space to quantum field theory (QFT) on the boundary surface. Maldacena
    published his striking analysis in a paper “The Large N limit of superconformal
    field theories and supergravity” in Advances in Theoretical and Mathematical Physics
    2 (1998), 231–52.


