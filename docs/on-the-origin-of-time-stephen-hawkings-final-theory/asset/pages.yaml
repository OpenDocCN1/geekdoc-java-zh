    forever. Black holes are the ultimate erasers. Given the swallowing power of black
    holes, this may seem like a natural outcome. But the thing is, quantum theory
    forbids this scenario. The basic rules of quantum theory stipulate that the wave
    function of any system evolves in an information-preserving manner. Always. Quantum
    evolution can process information beyond recognition, and it can never irreversibly
    obliterate information. This property is tied to the obvious requirement that
    the probabilities in quantum theory must always add up to one, no matter what
    happens. The preservation of information means, for example, when you burn an
    encyclopedia, the laws of quantum physics predict that you can in principle retrieve
    all information from ashes. Likewise, if quantum mechanics holds near the horizon
    surface of black holes—and we have no obvious reason to doubt that it holds—then
