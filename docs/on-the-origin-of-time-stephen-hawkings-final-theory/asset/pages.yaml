  md: 'Such was the stunning change of perspective brought about Maldacena’s duality.


    In line with other dualities in M-theory, the nature of the relationship between
    both sides of a holographic duality is that when on one side are perfectly straightforward,
    the situation on the other side will often be thoroughly complicated. When gravity
    is weak and the AdS universe is gently curved, for example, the boundary description
    involves such strong quantumum interactions between its constituents that the
    QFT becomes utterly intractable and even the notion of individual particles may
    cease to have much meaning.


    This property makes holographic dualities very hard to prove but also extraordinarily
    powerful. For it means that physicists can use Einstein’s gravity theory, to learn
    about new phenomena in the quantum world of particles, and versa. Over the years
    holography has become a veritable mathematical laboratory, in which theorists
    have performed the most ingenious experiments in order to gain a better understanding—and
    some intuition—of nature’s fascinating holographic underpinnings. Today, holographic
    physics has spread its wings beyond its M-theory origins, with a rich network
    of relations interconnecting what we used to think of as disparate branches of
    physics, from general relativity, condensed matter physics, and nuclear physics,
    to quantum information, and even astrophysics.


