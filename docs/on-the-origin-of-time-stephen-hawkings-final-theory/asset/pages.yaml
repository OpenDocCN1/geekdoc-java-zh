    The quantum revolution started in 1900 when the German physicist Max Planck suggested
    that any kind of body, when heated, emits radiation in discrete pockets he called
    quanta. Planck had been struggling to explain how much light of each color hot
    bodies radiate. He knew from Maxwell’s classical theory that light is made of
    electromagnetic waves of different oscillation frequencies, corresponding to different
    colors. The trouble was that classical physics also predicted that the energy
    radiated by a hot body should be shared equally among waves of all frequencies.
    Since Maxwell’s theory had electromagnetic waves of arbitrarily high frequencies,
    this meant that the total of radiated energy, summed over all frequencies, should
    be infinite, which was obviously impossible. This was Lord Kelvin’s second dark
    cloud hovering over classical physics. It became known as the “ultraviolet catastrophe”
    of classical physics, because the highest frequencies of visible light are violet,
    hence “ultraviolet” refers to very high frequencies.


    In what he later described as “an act of despair,” Planck proposed a new rule
    saying that light and all electromagnetic waves can only be emitted in discrete
    quanta, and that the energy of each quantum was greater the higher frequency of
    the waves. This sharply reduced the emission of waves of high frequencies, thereby
    avoiding an ultraviolet catastrophe. In 1905 Einstein went further and showed
    that electrons moving around in metals can only absorb light in discrete quanta,
    which he described as tiny particles, or photons. So, curiously, these early ideas
