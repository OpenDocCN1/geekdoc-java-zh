  img_proc: true
- pgno: 310
  md: 'The new worldview that may conceivably grow out of modern science is likely
    to be once more geocentric and anthropomorphic. Not in the old sense of the earth
    being the center of the universe and of man being at the zenith of existence.
    But it would be geocentric in the sense that the earth, and not a point outside
    the universe, is the center and home of humanity. And it would be anthropomorphic
    in the sense that man would count his own finiteness among the elementary conditions
    under which scientific efforts are possible at all.


    This is where Hannah meets Stephen. That is, the later, top-down Stephen. Hawking’s
    final theory frees cosmology from its Platonic straitjacket. It brings the physical
    laws in a sense back home. Adopting an inside-out perspective on the universe,
    the theory is rooted in Arendt would call our earthly conditions. This isn’t a
    mere abstract matter, for a physical cosmology that recognizes the finite inherent
    in our worm’s-eye perspective on the cosmos will, in time, reorient the very scientific
    agenda. Indeed, if the past can be a guide, we may hope that Hawking’s final theory
    can be the kernel of a new scientific and human worldview where man’s knowledge
    and creativity will once again revolve around their center.


    COSMOLOGY MAY WELL the one field of science in which the validity of Hannah Arendt’s
    concerns is beyond doubt. Of course we are within the universe! Nevertheless,
    ever since Newton, cosmologists have striven to reason from a point outside it,
    and by the end of the twentieth century, multiverse speculation had turned earth
    alienation into universe alienation. Confounded by the biophilic nature of the
    supposedly objective laws and lost in the multiverse, cosmologists ended up smaller,
    not larger, much as Arendt foresaw.


    What Arendt did not anticipate, I believe, was that Heisenberg’s new quantum theory,
    in which “man confronts himself alone,” also contained the'
