    5. One might, of course, have thought that Hawking’s semiclassical methods aren’t
    suited to analyze how information escapes from an evaporating black hole. After
    all, black holes harbor a singularity where the semiclassical theory breaks down.
    However, Don Page of the University of Alberta clarified that the information
    puzzle isn''t so much about what happens all the way to the end of a black hole’s
    life, when the singularity surely comes into play, but about the long road toward
    it. Page performed his own thought experiment in which he studied the total amount
    of quantum entanglement between the inside of a black hole and the Hawking radiation
    outside. This is captured by a quantity known as the entanglement entropy, a quantum
    version of entropy devised by the mathematician John von Neumann that measures
    one’s lack of information about the precise wave function of a quantum system.
    At the start of the evaporation process the entanglement entropy is obviously
    zero, since the black hole hasn’t emitted any radiation to be entangled with.
    As Hawking radiation trickles out, the entanglement entropy between the hole and
    the radiation grows, since the emitted particles are entangled with their partner
    particles behind the horizon. Page reasoned that if information is to be preserved,
    this trend better reverse at some point so that the entanglement entropy is zero
    again at the end when there is longer a black hole. He concluded that over time,
    the entanglement entropy should follow a curve shaped like an inverted V, with
    the transition point roughly halfway through the evaporation process. Since the
    black hole is still large at that point, Stephen’s semiclassical framework'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'should apply, for it has no business breaking down in the relatively low-curvature
    environment near the horizon of a large black hole. Yet there is nothing in Hawking’s
    semiclassical calculation that can bend down the entanglement entropy curve. According
    to Hawking, the entanglement just keeps on rising. This rising behavior sharpens
    the paradox. The assumption that putative quantum gravity effects get all information
    just before the black hole disappears appears much less plausible. Page refinement
    of Hawking’s thought experiment shows that the black hole information problem
    is a paradox within the semiclassical framework of gravity. Page published his
    analysis “Average entropy of a subsystem” in Physical Review Letters 71 (1993):
    1291.


