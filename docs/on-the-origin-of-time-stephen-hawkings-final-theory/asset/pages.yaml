    Thales was a pupil, Anaximander, who created what the Greeks came to call περι
    φύως στορίας, the “inquiry into nature,” hence physics. Anaximander is also regarded
    as the father of cosmology, for he was the first to conceive of the earth as a
    planet, a giant rock floating freely in empty space. Beneath the earth wasn’t
    more earth, without limit, nor gigantic columns, he reasoned, but the same sky
    we see above our heads. This way he gave depth to the cosmos, transforming it
    into a closed box—with the heavens above and the earth below—into an open space.
    This conceptual shift allowed one to imagine celestial bodies passing beneath
    the earth, paving the way for Greek astronomy. Furthermore, Anaximander wrote
    a treatise titled *On Nature*, which is lost but is thought to have contained
    the following fragment:[4]


    All things originate from one another,'
