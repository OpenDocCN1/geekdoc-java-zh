  md: 'ingenious trap for gravitational waves passing through our planet. And on September
    14, 2015, after years of waiting and listening, the legs of the two LIGO L’s suddenly
    began vibrating, ever so slightly at first, gradually faster and more strongly,
    until, after a fraction of a second, the vibrations ebbed away. Using Einstein’s
    theory, physicists were able to trace this brief pattern of vibrations to a gravitational
    wave burst generated in the inward spiral and merger, more than a billion years
