  md: 'I summarized the broad principles behind the top-down approach in the interconnected
    triptych that I sketched in figure 43. This scheme generalizes the conventional
    paradigm of physics in which the three pillars—histories, genesis, and overobservation—weren''t
    entwined but conceived as separate, disjunct entities, each with its own status.
    The triptych amounts to a novel framework for prediction in which the inductive
    process of constructing laws about the universe is described within it and in
    which, as a consequence, our physical theories are seen as one possibility among
    many. The top-down view exudes that most honestly, the laws of physics are properties
    of the universe that we induce from our collective data, compressed into computational
    algorithms,[5] not manifestations of some external truth. The succession of physical
    theories is understood as the identification of ever more general patterns, encompassing
    an ever-larger number of interconnected empirical phenomena. Of this progression
    greatly enhances the predictive power and the utility of physical theory, but
    it is a different reading altogether to say that this puts us on a path toward
