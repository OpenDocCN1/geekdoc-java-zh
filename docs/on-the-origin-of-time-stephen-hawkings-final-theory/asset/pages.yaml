    remain at rest, or keep moving at constant speed in a straight line. So, Newton''s
    elegant laws are only true for those special observers who are tied to absolute
    space, for whom the laws of motion somehow look simpler than they do for everyone
    else.


    This was reason enough for Einstein to be unhappy with Newton''s laws. It was
    anathema to him that we could have a description of nature that privileged certain
