  md: 'The CMB sky map confirms that the relic big bang heat is nearly uniformly distributed
    throughout space, although not quite perfectly. The speckles in the image represent
    minuscule temperature variations indeed, tiny flickers of no more than a hundred-thousand
    of a degree. These slight variations, however small, are crucially important,
    because they trace the seeds around which galaxies would eventually form. Had
    the hot big bang been perfectly uniform everywhere, there would be no galaxies
    today.


    The ancient CMB snapshot marks our cosmological horizon: We cannot look back any
    further. But we can gle something about processes operating in early epochs from
    cosmological theory. Just as paleontologists learn from fossils what life on Earth
    used to be, cosmologists can, by deciphering the patterns encoded in this fossil
    flickers, stitch together what might have happened before the relic heat map was
    imprinted on the sky. This turns the CMB into a cosmological Rosetta Stone that
    enables us to trace the universe’s history even further back,


    And what we learn is intriguing. As we will see in chapter 4, the temperature
    variations of the CMB radiation indicate that the universe initially expanded
    fast, then slowed down, and more recently (about five billion years ago), began
    accelerating again. Slowing down appears to be the exception rather than the rule
    on scales of time and deep space. This is one of these seemingly fortuitous biofriendly
    properties of the universe, for only in a slowing universe does matter aggregate
    and cluster to form galaxies. If it hadn’t been for the extended near-pause in
    expansion in our past, there would, again, be no galaxies and no stars, and thus
    no life.


    In effect, the universe’s expansion history was at the center of one of the very
    first moments in the conditions for our existence slipped into modern cosmological
    thinking. This moment occurred in the early 1930s, when Lemaître made a remarkable
    sketch in his purple notebooks of what he called a “hesitating” universe, one
    with an expansion history much like the bumpy road that would emerge from observations
    seventy years later(plate 3). Lemaître embraced the idea of a long pause in the
    expansion by considering the universe’s habitability. He knew that'
