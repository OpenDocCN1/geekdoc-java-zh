  md: 'When Copernicus challenged the ancients’ geocentric worldview, he did so by
    imagining that he looked down on Earth and the solar system from the vantage point
    of the stars. His assumption that the planets move in circular orbits meant that
    his heliocentric model wasn''t accurate, neither were the astronomical observations
    at the time.[2] However, by conceiving Earth and the planets as if they were hovering
    above them, Copernicus ushered in a revolutionary new way of thinking about the
    cosmos and our place in it. He discovered what one might call the Archimedean
    point in physics and astronomy, the idea that there is a distant viewpoint from
    which it is possible to leverage an objective understanding.[2] And while the
    new science this idea took centuries to develop and change the world, it took
    a few decades for the Copernican revolution to open up a whole new conceptual
    reality in which humankind was no longer the focal point of the cosmos.[3]


    Today we know that Copernicus’s writings were only the beginning of a relentless
    pursuit of the Archimedean point. Over the centuries, the Copernican perspective
    became ever deeply ingrained in the language of physics. Whatever we do in physics
    today, whether we accelerate particles, fuse new elements, or capture faint CMB
    photons, we always reason as if we are dealing with nature from an abstract point
    outside it—a “view from nowhere” if you want.[4] Without actually being “nowhere,”
    still tied to Earth and its earthly conditions, physicists devised ever more ingenious
    ways to act and think about the universe as we can conceive of it objectively.


    No other discovery provided a greater leap forward in this pursuit than Newton’s
    laws of motion and gravity. Newton understood that the relation between mathematics
    and the physical world, which had mystified scientists since Plato, involves dynamics
    and evolution, not timeless shapes and forms. The success and universality of
    his laws reinforced the idea that science was discovering true objective knowledge
    about the world. Newton attempted to implement a “view from nowhere” in his work
    by referring all motions to an imaginary fixed stage of space marked out by the
    distant stars, an absolute space that he took to be unchanging and unmoving. His'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'law of gravity and his three laws of motion dictated how objects move around
    that stage, but nothing could ever change absolute space itself. Absolute space,
    and absolute time, were like a rock-solid scaffolding of Newtonian physics, a
    God-given fixed and everlasting arena in which everything plays out.


    Yet Newton''s background of absolutes wasn''t quite as objective a point of reference
    as he had hoped it would be. The simple form of his laws only holds for those
