  md: 'biofriendly properties of the laws would merely be the accidental result of
    random processes playing out in the hot big bang that gave rise to our particular
    island universe. Proponents of the multiverse argue that present-day Platonists
    have been looking in the wrong direction. It isn''t a profound mathematical truth
