  md: '# CHAPTER 8


    # AT HOME IN THE UNIVERSE


    > The fabric of existence weaves itself whole.

    —CHARLES Ives


    **IN 1963, HANNAH ARENDT TOOK** part in the essay contest of a Symposium on Space
    organized by the editors of *Great Ideas Today*. This was soon after the first
    human expeditions into space and at the time of NASA’s plans to launch the Apollo
    11 lunar mission. Arendt was asked whether “man’s conquest of space had increased
    or diminished his stature.” The seemingly obvious answer was that of course, yes,
    it had increased man’s stature. Arendt, however, didn’t subscribe to this view.


    In her essay on “The Conquest of Space and the Stature of Man,” she reflects on
    how science and technology transform what it means to be human.[1] Central to
    her concept of humanism is the idea of freedom. The freedom to act and be meaningful,
    she holds, is what enables us to be human. [2] Arendt went to ponder whether human
    freedom is threatened when we increasingly acquire the know-how to redesign and
    control the world, from our physical environment and the living world to the nature
    of intelligence.


    Born to a German-Jewish family in 1906 in Hanover, Hannah Arendt studied at Marburg
    University under Martin Heidegger, but, like Einstein,'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'she was forced to flee Germany in 1933. It was a lesson firsthand—how human
    freedom and dignity can be curtailed. For the next eight years she lived in Paris,
    then emigrated to the United States in 1941, where she became part of a lively
    intellectual circle in New York. Later, in her coverage for The New Yorker of
    the war crimes of Adolf Eichmann in Jerusalem, she famously (or notiously, in
    the view of others) argued that ordinary people become complacent actors in totalitarian
    systems because they cease to think freely (or even to think at all) and disengage
    from the world. She traced such excesses in the sociopolitical sphere to the social
    corrosion brought about by what she called world alienation, the loss of a sense
    of belonging to the world and of the recognition that we are all bound together,
    a sense that there is a oneness of humanity and the civic engagement this bond
    entails.


    Arendt felt strongly that modern science and technology lay at the roots of man’s
    estrangement from the world. As a matter of fact, she pointed to the central insight
    that sparked the modern scientific revolution—the idea that the world is objective—as
    the main culprit. Ever since its inception, modern science has sought a higher
    truth, governed by national and universal laws. In pursuit of these, scientists
    succumbed to what Arendt termed earth alienation (not to be confused with world
    alienation), the search for an Archimedean standpoint from which it is hoped that
    such an objective understanding can be leveraged.


    Her thesis was that this position was antithetical to humanism. Of course, the
    scientific approach has been phenomenally successful, in both theoretical and
    practical terms, and its benefits to humanity are undeniable. But the flight from
    our earthly roots is the hallmark of modern science which has also led to a chasm
    between our human goals and the supposedly objective workings of nature. Over
    the span of nearly five centuries, Arendt held, this chasm has grown and increasingly
    challenged human nature, altering the societal fabric and, slowly but steadily,
    turning earth alienation, the view from nowhere intrinsic to much of science,
    into world alienation, a widespread disengagement from the world.'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'In her essay, Arendt puts her finger on this conundrum at the heart of modern
    science and argues that this will ultimately prove to be a self-defeating paradigm.
    Interestingly, in support of her thesis she quotes the quantum pioneer Werner
    Heisenberg, who said that “man in his hunt for objective reality suddenly discovered
    that he always confronts himself alone.”[31] Heisenberg was referring to the key
    role of the observer in quantum theory, the fact that the very ones one asks how
    reality is manifested. The instrumentalist interpretation of the theory that he
    and Bohr advanced and that typified the early quantum era generated a deep epistemological
    puzzle. Physicists were told to “shut up and calculate” and not to worry about
    the ontology of quantum theory. Arendt did exactly that and pointedly noted that
    it was as if the sciences, with the advent of quantum theory, did what the humanities
    all but could never demonstrate, namely, that humanists were right to be concerned
    about the stature of man in the new scientific world.


    For Arendt, the launch of Sputnik, an event “second in importance to no other,”
    epitomized the evolution toward an entirely artificial world, a “technotope” subject
    to human mastery and control. In her essay, she writes: “The astronaut, shot out
    into space and imprisoned in his instrument-ridden capsule where each actual physical
    encounter with his surroundings would spell immediate death, might well be taken
    as the symbolic incarnation of Heisenberg’s man—the man who will be the less likely
    to meet anything but himself and man-made things the more ardently he wishes to
    eliminate all anthropocentric considerations from his encounter with the non-human
    world around him.


    To Arendt, this pursuit of science and technology stripped from all anthropomorphic
    elements and humanistic concerns was fundamentally flawed. Be it the conquest
    of space in the hopes of geoengineering another planet, or the search for the
    philosophers’ stone in biotechnology—or indeed the quest for a final theory in
    theoretical physics—to her these were acts of rebellion against our human condition
    as dwellers on this planet:'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Man will necessarily lose his advantage. All he can find is the Archimedean
    point with respect to the earth but once arrived there and having acquired this
    absolute power over his earthly habitat, he would need a new Archimedean point,
    and so ad infinitum. Man can only get lost in the immensity of the universe, for
    the only true Archimedean point would be the absolute void behind the universe.


    Arend argued that if we begin to look down upon the world and our activities as
    if we are outside it, if we begin to lever ourselves, then our actions would ultimately
    lose their deeper meaning. This is because we would begin to see the Earth as
    an object like any other and no longer as our home. Our activities, from online
    shopping to our scientific practice, would be reduced to mere data points that
    can be analyzed with the same methods we use to study particle collisions or the
    behavior of rats in the lab. Our pride in what we can do would dissolve into some
    kind of mutation of the human race, transforming us from subjects of Earth to
    mere objects. If it should reach this point, Arend concludes her essay, “the stature
    of man would not simply be lowered by all standards we know of but will have been
    destroyed.” That is, we would lose our freedom. We would cease to be human.


    This is the paradox. In our attempt to find the ultimate truth and absolute control
    over our existence as humans on Earth, we ending up smaller, not larger.


    At the core of Arendt''s argument lay the idea that science and technology could
    only truly add to the stature of man in as much as we desire to be at home in
    the universe. “Earth is the very quintessence of the human condition,” she held.
    Whatever we find out or about to the world are human discoveries and endeavors.
    No matter how abstract and imaginative our thoughts, or how far-reaching their
    impact, our theories and our actions remain inextricably interwoven with our human,
    earthly conditions. And this is why Arendt pleaded for a practice of science and
    a vision of the technotope grounded in our humanness:'
