    be called brane new world, leaving us momentarily in the dark what, exactly, the
    paper should be about. A key question at the time was whether membrane-like universes
    with an invisible fourth dimension could emerge from some kind of big origin.
    The paper “Brane New World,” which we published in Physical Review D 62 (2000)
    043501, eventually showed that in Stephen’s no-boundary proposal for the origin
    of the universe, such (mem)brane worlds can come into being from nothing, in a
    process of quantum creation. Moreover, we found that the extra dimension perpendicular
    to the membrane, even though we couldn''t directly observe it, could leave a subtle
    imprint in the cosmic microwave background fluctuations within the membrane, offering
    the hope that day we might be able to test indirectly whether we live in a brane
    world.


    BACK TO NOTE REFERENCE 1


    2. Stephen’s books often included some of his latest research indeed. His 1983
    no-boundary theory was the highlight of A Brief History of Time, and our first
    top-down ideas featured in The Grand Design of 2010. “Brane New World” inspired
    the last chapter of The Universe in a Nutshell, where Stephen likened the birth
    of membrane-like universes to the creation of bubbles of steam in boiling water.
    This back-and-forth between his research and his popular science writings was
