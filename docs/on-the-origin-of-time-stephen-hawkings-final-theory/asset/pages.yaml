  md: '# LEMAITRE FOLLOWS PATHS TO TRUTH


    The Famous Physicist, Who Is a Priest, Tells Why He Finds No Conflict Between
    Science and Religion


    GEORGE LEMAITRE

    Physicist and Priest

    The Belgian Jesuit priest, who first proposed the Big Bang theory, says there
    is no conflict between science and religion. He believes that his theory of the
    universe''s origin from a single ''primval atom'' is not different from the biblical
    story of the kingdom of heaven. He says that while science can explain how the
    universe evolved, religion can explain why it exists at all.


    In an interview with the New York Times, Lemaître said, ''the universe is not
    static, and it is not the result of a chance. It has a beginning. I do not want
    to hear any talk of God who is like a powerful old man pushing the world around
    with his fingers. I believe that God is the author of the laws of nature, not
    violator of them.'' He also added that he did not want his religious beliefs to
    interfere with his scientific work.


    Lemaître, who was 73 years old, was born in Belgium in 1894. He was educated in
    various Jesuit colleges and later studied physics at the University of Leuven.
    In 1927, he earned his doctorate in astronomy from the University of Paris. In
    1931, he published a paper proposing that the universe is expanding, a theory
    that was later confirmed by Edwin Hubble.


    ![](img/ab72d2797bfab8215351810eb8aa7ed1_329_0.png)


    Lemaître''s work was initially met with skepticism. Even Einstein himself told
    him that his theory was ''the most beautiful but most absurd hypothesis.'' However,
    Lemaître''s theory eventually proved to be correct as observations of the expanding
    universe continued to come out.


    Lemaître died in 1966. He is remembered as one of the most brilliant scientists
    of the 20th century. His work on the Big Bang theory changed our understanding
    of the universe.


    While Lemaître''s theory was controversial within the Catholic Church, he was
    careful not to use his scientific findings to prove his faith. He believed that
    science and religion were two sides of the same coin.


    Lemaître''s life was a testament to the power of science and faith to coexist.
    He dedicated his life to seeking the truth, both through scientific inquiry and
    spiritual reflection.


    A definite principle of physics is that the laws of nature are the same everywhere
    in space and time.


    Lemaître used this principle to show that the universe was expanding. This led
    to his theory of the Big Bang.


    The theory of the Big Bang is now widely accepted by the scientific community.
    It has become the foundation of modern cosmology.


