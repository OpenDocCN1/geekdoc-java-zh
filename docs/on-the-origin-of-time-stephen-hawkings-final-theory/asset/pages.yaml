  md: 'physics. Newton’s scheme provided the general paradigm that all subsequent
    physics has followed. Unlike the “physics” of the ancient Greeks, which we hardly
    recognize, contemporary physicists feel entirely at home with Newton’s physics.


    One much-celebrated success of Newton’s laws was the discovery of the planet Neptune
    in 1846. Earlier astronomers had seen that the path of Uranus deviated slightly
    from the orbit predicted by Newton’s law of gravity. The Frenchman Urbain Le Verrier,
    seeking to explain this stubborn discrepancy, made the bold suggestion that this
    was due to an unknown planet, much farther out still, whose gravitational pull
    slightly influenced the trajectory of Uranus. Using Newton’s laws, Le Verrier
    was able to predict where in the sky this unknown planet should be in order to
    account for the wobble in Uranus’s orbit—provided Newton’s laws were correct.
    Indeed, astronomers soon found Neptune, within one degree of Le Verrier had pointed
    them. This became one of the most remarkable moments of nineteenth-century science.
    It was said that Le Verrier had discovered a new planet “with the tip of his pen.”[6]


    Stunning successes like these over a span of centuries seemed to confirm Newton’s
    laws as universal definitive truths. Already in the eighteenth century, the French
    mathematician Joseph-Louis Lagrange remarked that Newton had been lucky to live
    in that time in human history which it was possible to discover the laws of nature.
    Newton himself, in fact, seems to have done little to quench this emerging myth.
    Steeped in a tradition of mysticism, was he the elegant mathematical form of his
    laws as a manifestation of the mind of God.


    It is this mathematical formulation of Newton’s laws that embodies what physicists
    today mean when they use the word “theory.” Physical theories derive their utility
    and predictive power from the fact that they describe the real world in terms
    of abstract mathematical equations that one can manipulate in order to predict
    what will happen observing or performing the experiment. And it works! From the
    discovery of Neptune to the sensing of gravitational waves to the prediction of
    new elementary particles and antiparticles, time again the mathematical'
