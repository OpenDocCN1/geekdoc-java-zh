  img_proc: true
- pgno: 322
  md: 'This leads us to the question: What kind of future we envisage for our planet
    and our species? Will post-human life flourish and expand into the cosmos? Taking
    a quantum view, the myriad of paths forking off into the future are in a sense
    already out there, as a landscape of possibilities. Some futures may even appear
    rather plausible. We should learn from the past, though, that chance interferes,
    leading to have unexpected twists and turns. The accidental behavior of a bat
    in Wuhan sometime in 2019 is just one example. We yet can outline steps to avoid
    the precipice by acquiring a clear global vision of the kind of future we aspire
    to do, and despite the uncertainties, modeling on a somewhat quantitative basis
    how it might function. A major responsibility in this will fall to the community
    of scientists and scholars to act as a societal think tank and ensure that their
    research is integrated and directed to the common good—from bioengineering to
    machine learning and quantum technology.


    For we cannot simply wait and hope for the best. If humanity can’t even envision
    a future it aspires to, we can scarcely hope to attain anything remotely resembling
    it. There is no manual out there for us to consult and no foundations, not even,
    I have argued, at the bottom of the laws of physics, to cushion any failure. If
    mankind does not write its own script, no one will do it for us. We can either
    let evolution take its blind course, lowering the stature of mankind to that of
    a large-scale ant colony, collectivized and monitored, deprived of all freedom;
    or we can recognize that our fate lies in our own hands, and step by step, mold
    that fate into a coordinated vision of what constitutes a future that could prove
    Fermi’s pessimism wrong.


    At this critical point in history, when we take our first steps in nature’s shoes,
    it will be more important than ever to remember Hannah Arendt’s message that we
    are riders on planet Earth, not gods acting from the heavens. We are agents within
    a constantly changing universe. We are evolution. Need to find a way toward a
    planetary consciousness, in order to alleviate Arendt’s world alienation and move
    toward a perspective on the world that redraws our relations with one another
    and with the rest of the biosphere in a way that values the future. By treasuring
    that we are'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'stewards of planet Earth, and the finitude that comes with it, will we be able
    to avoid humanity pitting its many powers against itself.


    ---


    **REVOKING THE VIEW** from nowhere, Stephen’s final theory offers a powerful kernel
    of hope. Our journey into the big bang was ABOUT OUR origins, not merely the origins
    of the universe starting with the big bang. That was such a key part of it. Like
    Einstein, Stephen thought that humanity’s long-term future would ultimately depend
    on how well we understood our deepest roots. This is what drove him to study the
    big bang. His final theory of the universe is more than just a scientific cosmology.
    It is a cosmology in the humanistic sense, in which the universe is seen as our
    home—albeit a big one—and its physics rooted in our relationship with it. Hawking’s
    cosmological finale bridges Isaac Newton’s mathematical rigor with Darwin’s profound
    insight in a deeper sense, we are one. It is indeed proper that Stephen’s ashes
    are now buried between the graves of Newton and Darwin in the nave of London’s
    Westminster Abbey.


    Throughout my journey with Stephen, I came to know him as someone who longed for
    all of us to embrace more of a cosmic perspective on our existence and think in
    terms of deep time. His final theory is like a budding seed that has the potential
    to grow into a new worldview thoroughly based on science and at the same time
    grounded in our humanity. Obviously, the arc from quantum cosmology to a moral
    universe is extremely long and fragile. But so is the arc laid out by Arendt,
    from Galileo observing the moon to the high-tech society today.


    Stephen firmly believed that the courage of our questions and the depth of our
    answers would allow us to navigate planet Earth safely and wisely into the future.
    The story of his life which he found, after his terrifying diagnosis with ALS,
    the will to love, to have children, to experience the world in all of its dimensions,
    and to grasp the universe, inspired millions and will remain a powerful metaphor
    for what humanity can achieve. His parting message, beamed into space during a
    memorial service on June 15,'
  merge: -1
  img_proc: true
- pgno: 324
  md: '2018, in Westminster Abbey, encapsulates it all: “When we see the earth from
    space we see ourselves as a whole; we see the unity and not the divisions. It
    is such a simple image, with a compelling message: one planet, one human race.
    Our only boundaries are the way we see ourselves. We must become global citizens.
    Let us work together to make that future a place we want to visit.”


    From Stephen Hawking we can learn to love the world so much that we aspire to
    reimagine it, and never to give up. To be truly human. Though he was nearly immobile,
    Stephen was the freest man I have known.


    * Clustered regularly interspaced short palindromic repeats'
