- pgno: 32
  md: 'groundings of the laws of physics have pointed to new and surprising natural
    phenomena that were later observed. Deeply impressed with this power to predict,
    the Nobel laureate Paul Dirac famously promoted the way to exploration of interesting
    and beautiful mathematics as the preferred way to practice physics. Mathematics
    “takes you by the hand,” he said, “to discover new physical theories.”[7] Today’s
