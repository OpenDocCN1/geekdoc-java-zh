- pgno: 46
  md: 'centuries later, Carter agreed with Copernicus that humans are not central
    to the cosmic order. Yet, he reasoned, might we not be misled if we were to assume
    we are not special in any way, especially where our own observations of the cosmos
    are concerned? Perhaps we find the universe that it is because we are here?


    Carter had a point. Surely we wouldn’t be observing anything or when we didn’t
    exist. Already in the 1930s scientists like Leître and the American astronomer
    Robert Dicke reflected on what properties the universe would need to support intelligent
    beings. Life-forms, intelligent or otherwise, rely on carbon, for example, which
    is fused by thermonuclear combustion in stars, a process that requires billions
    of years. An expanding universe cannot provide billions of years of time unless
    it also contains billions of light-years of space. Therefore, we shouldn’t be
    surprised, Leître and Dicke concluded, that we live in an old and big universe.
    Expanding universes have a preferred period in which astronomers made of carbon
    could be at work, and this necessarily influences what they could see.


    Such conclusions are not fundamentally different from those we draw when we account
    for selection biases in everyday situations. But Carter went farther—much farther.
    He suggested that selection effects play out not just within one universe—ours—but
    across the multiverse. He suggested there is an anthropic principle at work, a
    rule and beyond the impersonal metalalaws governing the multiverse, that embodies
    the optimal cosmic conditions for life and that “acts” to select which one of
    the many universes should be ours.


    That was a radical suggestion indeed. Once again maneuvering life in a privileged
    position at the center of the explanation of the universe, Carter’s anthropic
    principle seems to take us back five centuries to the days before Copernicus.
    By positing a certain preferred state of affairs that includes life, intelligence,
    or even consciousness, it even flirts with teleology—the Aristotelian view that
    the scientific revolution had successfully overthrown, or so we thought.'
