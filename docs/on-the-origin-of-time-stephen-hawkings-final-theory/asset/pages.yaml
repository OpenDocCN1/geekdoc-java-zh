    in one’s hand. Likewise, if the six extra dimensions are much smaller than the
    length scales that the LHC or any other high-energy experiment can currently discern,
    their existence so far have escaped our notice. The six-dimensional spatial blob
    that might be lurking at every point in space hitherto have looked like, well,
    a point (see figure 38).


    But because strings are so tiny, they do wander into the six-dimensional world.
