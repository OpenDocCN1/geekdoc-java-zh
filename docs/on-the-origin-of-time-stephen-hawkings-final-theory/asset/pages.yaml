    By DAMTP had moved out of Cambridge city center and became part of a modern campus
    for mathematical sciences that had been newly constructed by the playing fields
    of St. John’s College, on the western outskirts of the town. Stephen’s spacious,
    well-lit corner office overlooking the campus and—often erratic—domoticscouldn’t
    have been more different from the dusty, dark Silver Street office where we had
    first met. When I rushed to see him, his eyes were radiant with excitement, and
    I had an inkling why.


    Clicking away notch or two quicker than usual, Stephen skipped his customary small
