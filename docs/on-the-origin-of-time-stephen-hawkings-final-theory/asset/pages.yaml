    across the universe at the speed of light. This is just the Einstein equation
    at work: Two black holes orbiting each other form a periodically changing configuration
    of masses to which, the Einstein equation says, spacetime responds with its own
    periodic disturbances. These ripples are gravitational waves.


    As ripples of geometry, gravitational waves carry massive amounts of energy. This
    drains the energy from the system of orbiting black holes, causing them to spiral
    inward and eventually merge to form a single, bigger black hole. Such mergers
    are by far the most violent events in the universe. A single collision of two
    black holes can generate a burst of gravitational waves more powerful than the
    combined power of all light radiated by all the stars in the observable universe.
    Nonetheless, the waves of geometry generated when black holes collide have an
    extremely small size, because the fabric of spacetime is extraordinarily stiff.[15]
    This is why bursts of gravitational waves, despite their enormous power, are very
    difficult to detect.


    Furthermore, since there are no particles involved, a burst of gravitational waves
    passing through our planet is a superbly elusive event. Except for momentarily
    causing yardsticks to stretch and shrink a tiny bit, and clocks slightly to speed
    up and slow down, gravitational waves zip through planets as if they are carrying
    an invisibility cloak. In order to detect the fleeting variations caused by gravitational
    ripples, you need a yardstick several miles long, capable of measuring distance
