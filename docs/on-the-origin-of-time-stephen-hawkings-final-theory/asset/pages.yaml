  md: 'BACK TO NOTE REFERENCE 6


    7. Heisenberg’s uncertainty principle goes hand in hand with Planck’s hypothesis.
    Imagine you want to measure the position of a quantum particle. To do so, you
    have to look at the particle, for example, by shining light on it. To measure
    the position more precisely, you can use light of a shorter wavelength. By Planck’s
    quantum hypothesis, however, one has to use at least one quantum of light. This
    quantum will slightly disturb the particle, changing its velocity in a way that
    cannot be predicted. The shorter wavelength, the higher the energy of a single
    quantum of light, and the larger the resulting uncertainty in the particle’s velocity.
    Heisenberg’s uncertainty principle quantifies this, stipulating that the uncertainty
    in the position of a particle times the uncertainty in its momentum can never
    be smaller than a certain quantity called Planck’s constant, denoted by $h$. The
    value of Planck’s constant can be determined experimentally. It is one of the
    fundamental constants of nature, alongside the speed of light, $c$, and Newton’s
    gravitational constant, $G$, both of which appear in the Einstein equation on
    page 42. Planck’s quantum constant, by contrast, is conspicuously absent from
    this classical (as opposed to quantum) equation!


    BACK TO NOTE REFERENCE 7


    8. Schrödinger’s description of particles in terms of waves of probability also
    explains the early quantum experiments with atoms. Take, for example, an electron
    orbiting an atomic nucleus. If we regard the electron as a wavelike entity, then
    only for certain orbits will the length of the orbit correspond to a whole number
    of wavelengths of the electron. For these orbits the wave crest would be in the
    same position each time around, so the waves would add up and reinforce one another.
    These are precisely Bohr’s quantized orbits.


