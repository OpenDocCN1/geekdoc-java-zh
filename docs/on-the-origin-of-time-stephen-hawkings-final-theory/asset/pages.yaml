- pgno: 70
  md: 'The surface that separates the no-escape zone inside from the rest of the universe
    is the peculiar surface in Schwarzschild''s geometry that caused so much confusion
    in the early days of general relativity. Today it is known as the event horizon
    of a black hole. It corresponds to the edge of the dark disk in figure 10. The
    event horizon acts like a one-way membrane through which matter, light, and information
    can enter, but nothing can leave. Black holes are the ultimate escape rooms indeed.


    Few physicists believe there is much to see or feel at the event horizon of a
    large black hole, but the horizon is of huge significance to the causal structure
    of black holes. Inside the horizon surface, space and time in some sense switch
    identities. If an intrepid astronaut were to venture inside the horizon of a black
    hole, the ever-increasing tilting of the light cones means he would necessarily
    have to keep moving toward the center. That is, the radial dimension of space
    inside acquires the properties of a time dimension, a direction in which one can
    stop or reverse must move forward. The spacetime singularity of infinite curvature
    that awaits in the center isn''t really a place in space but more like a moment
    in time—the last one.


    This singularity with its infinite warping is where (when) the Einstein equation
    loses its predictive power. The theory of general relativity breaks down at spacetime
    singularities. This is puzzling. How was Penrose able to prove that the gravitational
    collapse of a large star produces a singularity when the theoretical framework
    on which he relied doesn''t hold at singularities? The ingenuity of Penrose''s
    strategy was to identify a point of no return in gravitational collapse, the formation
    of what he called a trapped surface from where even light can''t move away from
    the star. Penrose showed that once a trapped surface forms, further collapse to
    a singularity becomes unavoidable. His mathematical tricks were so powerful that
    they allowed him to predict the outcome, despite not being able to follow the
    collapse of a real star through to its completion.'
