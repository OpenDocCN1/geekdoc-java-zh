    For good reasons, the Nuffield gathering became legendary. The 1982 Nuffield workshop
    meant to cosmology what the 1911 Solvay Council had meant to atomic physics. Its
    results amounted to a coming-of-age for the study of the very early universe.
    The predictions of inflationary theory clearly demonstrated that quantum mechanics
    had far-reaching implications not only for the microscopic world but also for
    our observations of the universe on the very largest scales. Much as the 1911
    Solvay Council had marked the moment quantum mechanics was understood to be central
    to the atomic world, the 1982 Nuffield workshop showed that quantum mechanics
    was essential to cosmology. Inflationary theory said that the hot and cold spots
    in the CMB are primeval quantum fuzz, magnified and writ across the cosmic sky.
    And even more, it predicted that an advanced version of COBE capable of taking
    a sharp image of the CMB speckles could be to verify all this. Such a picture
    would establish a magnificent arc linking our cosmological observations today
    to microscopic quantum jitters no more than $10^{-32}$ seconds after the big bang.


    Stephen didn’t hide his excitement about the results of the workshop, writing,
    “The inflationary hypothesis has the great advantage that it makes predictions
    about the present density of the universe and about the spectrum'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'of departures from spatial uniformity. It should be possible to test these
    in the fairly near future and either falsify the hypothesis, or strengthen it.\[6]


    Blobs and speckles in the CMB generated by inflation are the cosmological analogue
    of Hawking radiation from black holes, another fascinating connection between
    black holes and the big bang. I mentioned earlier that Hawking radiation originates
    in quantum jitters of matter fields in the vicinity of black holes. These jitters
    give rise to pairs of particles that pop into existence, persist for a short while,
    and disappear again, like a pair of dolphins rising briefly over the surface of
    the ocean before diving down again. Physicists call these virtual particles because,
    unlike real particles, they don''t live long enough to be detected by a particle
    detector. Near the horizon of a black hole, however, virtual particles can become
    real. This is because one member of a virtual pair can fall into the black hole,
    leaving the other particle free to escape into the distant universe where it shows
    up as faint radiation given out by the black hole.\[7]The story of an inflating
    universe is like that of a black hole turned inside out: Rapid inflationary expansion
    amplifies quantum jitters associated with the cosmological horizon that surrounds
    us, which makes the universe twinkle ever so slightly in the microwave frequency
    band. Inflation predicts that we are immersed in a cosmic bath of Hawking radiation.


    DESPITE THE ODDS, Stephen lived to see the detailed observations of the CMB radiation
    carried out and saw to his great satisfaction that the observed pattern of variations
    matched the rhythm of inflation indeed.


    In the summer of 2009 the European Space Agency launched the Planck satellite,
    which succeeded in gathering ancient microwave photons for nearly fifteen months.
    Satellites do this better than Earth-based telescopes because they don''t have
    to peer through our atmosphere and can scan the full sky. The Planck satellite
    recorded the temperature and polarization of CMB photons reaching us from millions
    of different directions in space. The Planck army of astronomers then compiled
    an exquisitely detailed map'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'of the microwave sky, transforming COBE’s hazy view into an unprecedently sharp
    image. Plate 9 (see insert) shows this image and encourages you to imagine the
    CMB sky as the giant, most distant sphere that it is, a cosmic horizon all around
    us with Earth at the center of the ball. The CMB map I showed earlier in figure
