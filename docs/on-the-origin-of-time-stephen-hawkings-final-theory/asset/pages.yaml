    THERE is IS one key prediction of inflation, however, that has remained elusive.
    These are the primordial gravitational waves. Because an inflationary surge of
    expansion amplifies all quantum jitters, including those of space itself, it also
    generates a certain level of gravitational waves. These ripples of space are known
