    In vain the Belgian age attempted to assuage Einstein, arguing that “the hypothesis
    of the primal atom is the antithesis of the supernatural creation of the world.”[21]
    As a matter of fact, Lemaître saw the origin of the universe as a wonderful opportunity
    to expand the reach of the natural sciences.


    Einstein versus Lemaître on the ultimate cause of the universe’s expansion went
