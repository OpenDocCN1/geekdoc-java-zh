    radiating energy and particles, its temperature goes up, making the hole shine
    more brightly and lose mass at a faster rate. Hence Hawking radiation, even though
    it starts more slowly than one can imagine, is a self-reinforcing process that
    eventually makes black holes disappear. They haven''t escaped Hawking,[4] “Black
    holes are not eternal,” he wrote. “They evaporate away at an increasing rate until
    they vanish in a gigantic explosion.


    But what is the fate of the huge amount of information stored inside when black
    holes radiate and ultimately evaporate?


