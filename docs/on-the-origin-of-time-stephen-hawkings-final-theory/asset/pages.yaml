    yields the total probability to pass through slit, namely 50 percent. By forcing
    the electron to reveal information, we have also eliminated all histories passing
    through the other slit, and hence the possibility of interference between both
    sets of trajectories on their way to the screen. The interference pattern emerges
    only if the experimenter makes no attempt to determine which slit any electron
    went through.


