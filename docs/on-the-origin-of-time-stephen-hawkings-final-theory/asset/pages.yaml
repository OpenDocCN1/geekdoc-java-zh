  md: 'biofriendly character of the physical laws again. But some of the steps associated
    with biological evolution remain notoriously uncertain. Evolutionary biologists
    have identified about seven hard trial-and-error steps that are plausible candidates
    for major bottlenecks on the way to everlasting life. These include abiogenesis,
    the formation of complex eukaryotic cells, sexual reproduction, multicellular
    life, and the emergence of intelligence. In the next decade or so, we stand to
    learn more about the likelihood of some of these transitions, from missions to
    Mars and observations of the atmospheres of exoplanets. If scientists find multicellular
    life on Mars (provided it evolved independently) or signatures of primitive life
    in the chemical composition of exoplanetary atmospheres, these discoveries would
    eliminate some of the steps in our past as candidates for improbable transitions,
    further sharpening Fermi''s paradox.


