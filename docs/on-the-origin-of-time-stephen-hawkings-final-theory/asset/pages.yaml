- pgno: 144
  md: 'Yet on the face of it, the staggering numbers behind inflation sound crazy.
    To put these in perspective, the immense ballooning of space during that brief
    instant of inflation would far exceed the universe’s total expansion factor during
    the subsequent 13.8 billion years! What strange form of matter could possibly
    cause space to stretch in such a dramatic manner? Inflation''s pioneers proposed
    that scalar fields could have been responsible. Such fields are exotic forms of
    matter that can behave as invisible, space-filling substances, similar to electric
    and magnetic fields, but that are even simpler in that they only have a value,
    no direction, at each point in space. One well-known scalar field is the Higgs
    field, theCapstone of the Standard Model of particle physics that was discovered
    at CERN¹ in 2012. Theoretical extensions of the Standard Model typically contain
    a large number of scalar fields, some of which may be part of the dark matter
    in the universe. The one responsible for inflation is aptly—though perhaps confusingly—the
    inflaton field. The inflaton field is a hypothetical field, hitherto not found
    at CERN or anywhere else on Earth, which, inflationary theory predicts, would
    have boosted the early universe’s expansion to truly mind-boggling scales.


    But why are scalar fields such powerful sources of repulsive antigravity? Scalar
    fields feature on the right-hand side of the Einstein equation (see page [42]),
    together with all other forms of matter. Unlike normal matter, however, scalar
    fields share some important properties with the cosmological constant, Einstein’s
    λ term. Like the cosmological constant, scalar fields spread out uniformly fill
    space not only with positive energy, generating attractive gravity, but also with
    negative pressure, or tension, which causes antigravity. And the antigravity of
    scalar fields, it turns out, beats their gravity, which is why they accelerate
    the expansion, unlike all other forms of matter. Furthermore, inflation feeds
    on the expanding space, the negative pressure with which the inflaton infuses
    the universe means that, just like the cosmological constant, doesn’t quite dilute
    but actually gains energy from the expansion⁴.'
