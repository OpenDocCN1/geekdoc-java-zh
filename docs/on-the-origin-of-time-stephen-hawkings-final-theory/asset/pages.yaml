  md: 'and vanish into one another,

    according to necessity;

    For they give to each other justice and recompense for their injustice;

    In conformity with the ordinance of time.


    In these few lines Anaximander articulates the revolutionary idea that nature
    is neither arbitrary nor absurd but governed by some form of law. This is science’s
    founding assumption: Beneath the surface of natural phenomena lies an abstract
    coherent order.


    Anaximander did not elaborate on what the laws of nature might take, other than
    drawing an analogy with civic laws regulating human societies. But his most famous
    pupil, Pythagoras, proposed a mathematical basis for the world’s order. The Pythagoreans
    assigned a mystical significance to numbers and attempted to construct the entire
    cosmos out of numbers. Their idea that the world could be described in mathematical
    terms was taken up and championed by Plato, who made it one of the pillars of
    his theory of truth. Plato likened the world of our experiences to a shadow of
    a far superior reality of mathematical forms that exists quite separately from
    the one we perceive. The ancient Greeks would like to believe, even though we
    can’t readily touch or see the underlying order of the world, we can deduce it
    through logic and reason.


    Impressive as their theories might be, however, the ancients speculations about
    nature have little in common with modern physics, neither in substance nor in
    method or style. For one thing, the early Greeks reasoned almost entirely on aesthetic
    grounds and on the basis of prior assumptions, with little or no effort to test
    them. It just didn’t occur to them. Consequently their conception of “physics”
    and of a law-like scheme of things bears no resemblance to a modern scientific
    theory. In his last book, To Explain the World, the late Steven Weinberg argued
    that, from a contemporary viewpoint, the early Greeks were better thought of not
    as as physicists or scientists or even philosophers but as poets, since their
    methodology differed fundamentally from what would qualify as scholarly practice
