    > I have changed my mind. [A] Brief History [of Time] is written from the wrong
    perspective.


    I smiled. I agree! Have you told your publisher yet? Stephen looked up, curious.


    You took a God’s-eye perspective on the universe in A Brief History, I propounded,
    as if were somehow looking at the universe or its wave function from outside of
    it.


    Stephen lifted his eyebrows, his way of telling me we were on the same wavelength.
    So did Newton and Einstein, he said, as if in defense. He continued. A God’s-eye
