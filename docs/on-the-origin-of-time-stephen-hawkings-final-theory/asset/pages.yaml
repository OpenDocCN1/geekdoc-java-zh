  md: 'You might wonder why these extra dimensions don’t immediately rule out the
    theory as a viable description of our world. Surely we would have noticed if there
    were more dimensions of space? This isn''t necessarily true, however, because
    the six extra dimensions could be extraordinarily small and curled tightly at
