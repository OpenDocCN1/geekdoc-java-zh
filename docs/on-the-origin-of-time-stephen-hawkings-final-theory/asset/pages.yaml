  md: 'In effect, I venture to claim that this view captures the true spirit of the
    Copernicus revolution. When Copernicus put the sun at the center, he realized
    all too well that from on one would need to take the motion of Earth around the
    sun in order to interpret astronomical observations. The Copernican revolution
    did not pretend that our position in the universe is irrelevant, only that it
    isn''t privileged. Five centuries on, top-down cosmology returns to these roots,
    and I like to think Arendt would have been pleased.


    That being said, Hawking''s final theory did not come from a sudden sympathy for
    one or another philosophical position. If anything, Stephen tried to refrain from
    adopting one. He felt Einstein, with his static universe and his reluctance to
    embrace quantum theory, had been guided too much by his philosophical prejudices,
    and he strove to avoid making the same mistakes. We developed our top-down approach
    primarily in an attempt to untangle the paradoxes of the multiverse and find a
    better cosmological theory. In retrospect this endeavor turned out to be rather
    productive, philosophically.


    THE DISCOVERY in the late 1920s that the universe has a history is one of the
    most startling discoveries of all time. For almost a century we have been studying
    this history against the stable background of immutable laws of nature. But the
    essence of the theory that Stephen and I put forward is that this approach fails
    to convey the depth and the scope of what Leître found out about the universe.
    The quantum cosmology we propose reads the universe’s history within and as one
    includes, in its earliest stages, the genealogy of the physical laws. In our view
    it is not the laws as such but their capacity to change that is fundamental. In
    this way top-down cosmology completes the conceptual revolution in our thinking
    about the universe that Leître initiated.[4]


    To uncover the essence of what lies hidden in the earliest quantum stages, one
    must peel away the many layers of complexity that separate us'
