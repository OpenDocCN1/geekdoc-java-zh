    +   6. In the grand scheme of quantum cosmology, the distinction between levels
    of evolution is not fundamental but arises because one zooms in on different kinds
    of branchings in the universal wave function. Higher levels of evolution are concerned
    with questions conditioned not only on the wave function but also on the specific
    outcomes of branching processes leading up to that level. In order to study abiogenesis
    on Earth four billion years ago, for example, one asks questions of the universal
    wave function. One therefore zooms in branchings that are concerned with that
    level. To do so, one must supply the outcome of the lower levels of cosmological,
    astrophysical, and early geological evolution in addition to a model of the wave
    function itself.


