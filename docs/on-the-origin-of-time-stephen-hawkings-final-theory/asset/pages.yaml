    We can get a feel of the magnitude of this change from the history of science.
    In the year 1597, the German astronomer Johannes Kepler came up with a model of
    the solar system based on the ancient Platonic solids, the five regular polyhedrons
    of which the cube is the best known. Kepler imagined attaching the approximately
    circular orbits of the six known planets revolving around the sun. He then hypothesized
    that the relative sizes of these spheres are dictated by the condition that each
    sphere, other than the outermost one of Saturn, fits just inside one of the regular
    polyhedrons, and that each sphere, for the innermost one of Mercury, fits just
    outside one of these.[[2] Kepler''s drawing in figure 6 illustrates this configuration.
    When Kepler placed the five geometric solids in the right order, one inside another,
    all fitting tightly, he found that the nested spheres could be located at intervals
    corresponding to each planet''s distance from the sun, together with Saturn moving
    along a sphere circumscribing the outermost polyhedron, with no room to change
    the relative radii. On these grounds he predicted the total number of planets—six—as
    well the relative sizes of their orbits. For Kepler, the number of planets and
    their distances from the sun were a manifestation of a deep mathematical symmetry
    in nature. His Mysterium Cosmographicum is an attempt, really, to reconcile the
    ancient Platonic dream of the harmony of the spheres with the sixteenth century''s
    insight that the planets move around the sun.


    In Kepler''s time the solar system was generally considered to be pretty much
    the whole universe. No one knew that the stars were suns with their own systems
    of planets. So it was perfectly natural to assume that the planetary orbits were
    a most fundamental matter. Today we know there is no great significance to the
    number of planets or their distances from the sun. We understand that the constellation
    of planets in the solar system isn''t'
