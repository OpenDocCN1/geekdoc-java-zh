  md: '# CHAPTER 1


    # A PARADOX


    Es könnte sich eine seltsame Analogie ergeben, daß das Okular auch des riesigsten
    Fernrohrs nicht größer sein darf, als unser Auge.


    A curious correlation may emerge in the eyepiece of even the biggest telescope
    cannot be larger than the human eye.


    > —LUDWIG WITTENSTEIN, Vermischte Bemerkungen


    **THE LATE 1990s WERE THE culmination of a golden decade of discovery in cosmology.**
    Long regarded as a realm of unrestrained speculation, cosmology—the science that
    dares to study the origin, evolution, and fate of the universe as a whole—was
    finally coming of age. Scientists all over the world were buzzing with excitement
    about spectacular observations from sophisticated satellites and Earth-based instruments
    that were transforming our picture of the universe beyond recognition. It was
    as if the universe was speaking to us. This posed quite a reality check for theoreticians,
    who were to rein in their speculation and flesh out the predictions of their models.


    In cosmology we discover the past. Cosmologists are time travelers, and telescopes
    their time machines. When we look into deep space we look back into deep time,
    because the light from distant stars and galaxies have traveled millions or even
    billions of years to reach us. Already in 1927 the Belgian priest-astronomer Georges
    Lemaître predicted that space, when'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'considered over such long periods of time, expands. But it wasn''t until the
    1990s that advanced telescope technology made it possible to trace the universe''s
    history of expansion.


    This history held some surprises. For example, in 1998 astronomers discovered
    the stretching of space had begun to speed up around five billion years ago, even
    though all known forms of attract and should slow down the expansion. Since, physicists
    wondered whether this weird cosmic acceleration is driven by Einstein''s cosmological
    constant, an invisible ether-like dark energy that causes gravity to repel rather
    than to attract. One astronomer quipped that the universe looks like Los Angeles:
    one-third substance and two-thirds energy.


    Obviously, if the universe is expanding now, it must have been compressed in the
    past. If you now cosmic history backward—as a mathematical exercise, of course—you
    find that all matter would have been densely packed together and also very hot,
    since matter heats up and radiates when it is squeezed together. This primeval
    state is known as the *hot big bang*. Astronomical observations since the golden
    1990s have pinned down the age of the universe—the time elapsed since the big
    bang—to 13.8 billion years, give or take 20 million.


    CURIOUS TO LEARN more about the universe''s birth, the European Space Agency (ESA)
    launched a satellite in May 2009 in a bid to complete the most detailed and ambitious
    scanning of the night sky ever undertaken. The target was an intriguing pattern
    of flickers in the heat radiation left over from the big bang. Having traveled
    through the expanding cosmos for 13.8 billion years, the heat from the universe''s
    birth reaching today is cold: 2.725 K, or about—270 degrees Celsius. Radiation
    at this temperature lies mainly in the microwave band of the electromagnetic spectrum,
    so the remnant heat is known as the *cosmic microwave background* radiation, or
    CMB radiation.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'ESA''s efforts to capture the ancient heat culminated in 2013 when a curious
    speckled image resembling a pointillist painting decorated the front pages of
    the world’s newspapers. This image is reproduced in figure 2, which shows a projection
    of the entire sky, in exquisite detail compiled from millions of pixels representing
