- pgno: 315
  md: 'quantum take on the cosmos guards us from wanting to know too much.

    And this is important, for it is precisely the closure of our past in Hawking’s
    final theory, and the fundamental recognition of a certain finitude that this
    closure enforces, prevents us from getting lured down in the paradoxes of the
    multiverse. The multiverse evaporates like snow before the sun in quantum cosmology.
    Top-down cosmology strips the variegated cosmic quilt of its colors, but this
    reduction, curiously, boosts the theory’s predictive reach. So, as anticipated
    by Hannah Arendt in her incisive analysis, by jettisoning the Archimedean standpoint,
    cosmological theory emerges larger, not smaller. To quote Wittgenstein at the
    end of his famous Tractatus—“Whereof one cannot speak, one must be silent.” The
    power of a quantum outlook on the cosmos is that it gives us the mathematical
    tools to be silent indeed.


    The upshot is a profound revision of what we understand cosmology can ultimately
    find out about the world. The early Hawking (as well as the early author) sought
    a deeper understanding of the universe’s apparent design in the physical conditions
    at the origin of time. We (we) assumed there was a fundamental causal explanation
    hidden deep in the math governing the big bang that would determine “why the universe
    is the way it is,” as Stephen so often put it. That is, we assumed there was a
    final theory that superseded the physical universe—or multiverse. Having turned
    cosmology upside down and inside out, the later Hawking claimed his earlier alter-ego
    had erred. Our top-down perspective reverses the hierarchy of laws and reality
    in physics. It leads to a new philosophy of physics that rejects the idea that
    the universe is a machine governed by unconditional laws with a prior existence
    and replaces it with the view that the universe is a kind of self-organizing entity,
    in which all sorts of emergent patterns appear, the most general of which we call
    the laws of physics. One might say that in top-down cosmology, the laws serve
    the universe, not the universe the laws. The theory holds that if there is an
    answer to the great question of existence, it is to be found within this world,
    not in a structure of absolutes beyond it.'
