- pgno: 199
  md: 'Later that year, down south in Santa Barbara, the Kavli Institute for Theoretical
    Physics ran its first Superstring Cosmology program. In a packed auditorium, a
    beaming Linde explained to an audience of string theorists hanging on his every
    word how his universe-generating mechanism of eternal inflation could blow into
    existence an endless proliferation of island universes occupying the most remote
    corners of the string theory landscape. Eternal inflation, he propounded, turns
    the enormous scope for variation in the theory into a real cosmic patchwork—the
    multiverse.


    Worryingly, however, there was nothing in the metaphysics of string theory that
    said were to find ourselves in this crazy cosmic quilt and what kind of universe
    we should expect to observe around us. The multiverse on its own is impersonal
    and incomplete. That is the paradoxical situation I described in chapter 1: As
    a physical theory, the multiverse signals an end to much of the predictivity gained
    by physics.


    Susskind proposed a grand new deal. By combining the multiverse with the anthropic
    principle, he argued, this explanatory embarrassment can be turned around, for
    the anthropic principle selects a friendly patch in the multiverse. Taken on its
    own, the anthropic principle wouldn''t qualify as science, but in combination
    with the multiverse, he advanced, the anthropic principle has real predictive
    power. He put forward “anthropic multiverse cosmology” as a new paradigm for fundamental
    physics and cosmology, to replace the orthodox framework based on objective and
    timeless laws only.


    IN HDSIGHT, WHAT really triggered the anthropic “revolution” in cosmology was
