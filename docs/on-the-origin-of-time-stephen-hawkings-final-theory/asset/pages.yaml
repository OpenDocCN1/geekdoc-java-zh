    really doesn''t do to the higher dimensional complexity featuring in string theory.


    Combining the various ingredients in their theory, string theorists found far
    more possible shapes of hidden dimensions there are atoms in the observable universe.
    Each shape of space composes its own string symphony, describing a universe with
    its specific set of effective laws. So by exploring the mathematical landscape
    of extra dimensions, theorists were also uncovering a mind-boggling cornucopia
    of effective physical laws in the three large dimensions that we do see. Certain
    special arrangements of hidden dimensions correspond to universes nearly identical
    to the ones we observe, differing, say, only in the precise values of a few particle
    masses. Such universes could be equally biofriendly—if not. The vast majority
    of extra-dimensional windings yields universes completely unlike ours, with an
    entirely unfamiliar amalgam of particles and forces. By the turn of the century,
    string theory had become a Walmart for physical laws; one could dream of a particular
    universe governed by certain effective physics and then go and find some configuration
    of extra dimensions matching it. There are countless universes where the repulsive
    effect of the dark energy prevents the formation of galaxies and life, the odd
    universe where the LHC would have produced black holes—and Stephen would have
    gotten his Nobel Prize—and even universes in which a different number of space
    dimensions expand and grow large.'
