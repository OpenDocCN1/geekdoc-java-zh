  md: '# PREFACE


    THE DOOR TO STEPHEN HAWKING’s office was olive green, and, though it was right
    off of the bustling common room, Stephen liked it to be slightly open. I knocked
    and entered, feeling as though I’d been transported into a timeless world of contemplation.


    I found Stephen sitting quietly behind his desk, facing the entrance, with his
    head, too heavy to hold straight, leaning against a headrest on his wheelchair.
    He slowly raised his eyes and greeted me with a welcoming smile, as if he had
    been expecting me all along. His nurse offered me a seat next to him and I glanced
    at the computer on his desk. A screen saver scrolled perpetually across the screen:
    *To boldly go where Star Trek fears to tread.*


    It was mid-June of 1998, and we were deep in the labyrinth of DAMTP, Cambridge’s
    renowned Department of Applied Mathematics and Theoretical Physics. DAMTP was
    housed in a Victorian building on the Old Press site on the banks of the river
    Cam, and for nearly three decades, it had been Stephen’s base camp, the nexus
    of his scientific endeavors. It was here that he, wheelchair bound and unable
    to lift even a finger, had passionately stroved to bend the cosmos to his will.


    Stephen’s colleague Neil Turok told me the master wanted to see me. It was Turok’s
    animated course, part of DAMTP’s famous advanced math degree, that had recently
    kindled my interest in cosmology. Stephen had got'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'wind, it seemed, that my exam results were excellent and wanted to see if I''d
    make a good doctoral candidate under his wing.

    Stephen’s dusty old office stuffed with books and scientific papers felt cozy
    to me. It had high ceilings and a large window that, I would later find out, he
    kept open on freezing cold winter days. On the wall next to the doorway was a
    picture of Marilyn Monroe; below it a framed and signed photograph of Hawking
    playing poker with Einstein and Newton on the holodeck of the Enterprise. Two
    blackboards filled with mathematical symbols occupied the wall to our right. One
    featured a recent calculation to do with Neil and Stephen’s latest theory of the
    origin of the universe but the drawings and formulas on the second one appeared
    to date from the early 1980s. Could they be his last handwritten sprawls?


    ![](img/ab72d2797bfab8215351810eb8aa7ed1_7_0.png)


    Figure 1. This blackboard hung in Stephen Hawking’s office at the University of
    Cambridge as a memento from a conference on supergravity he convened in June 1980.
    Filled with doodles, drawings, and equations, it is as much a work of art as a
    glimpse into the abstract universe of theoretical physicists. Hawking is drawn
    in the center near the bottom, with his back toward us. (See color version, plate
    10 in the insert.)


    A soft clicking broke the silence. Stephen had started talking. Having lost his
    natural voice in a tracheotomy following a bout of pneumonia more'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'than a decade before, he now communicated through a disembodied computer voice.
    This was a slow, laborious process.


    Mustering the last bit of force in his atrophied muscles, he exerted a feeble
    pressure on a clicking device, like a computer mouse, which had been placed carefully
    in the palm of his right hand. The screen fitted to an arm of his wheelchair lit
    up, establishing a virtual lifeline between his mind and the outside world.


    Stephen used a computer program called Equalizer that had a built-in database
    of words and a speech synthesizer. He appeared to navigate Equalizer’s electronic
    dictionary instinctively, pressing the clicker rhythmically as if it were dancing
    to his brain waves. A menu on the screen displayed a number of frequently used
    words and the letters of the alphabet. The program’s database included theoretical
    physics jargon, and the program anticipated his next word choice, displaying five
    options in the bottom row of the menu. Unfortunately, word selection was based
    on an elementary search algorithm, which failed to distinguish between general
    conversation and theoretical physics, with sometimes hilarious results, from cosmic
    microwave risotto to extra dimensions.


    Andrei claims appeared on the screen below the menu. I waited, in hushed expectation,
    fervently hoping that I would understand whatever followed. A minute or two later
    Stephen directed the cursor to the icon “Speak” in his electronic voice, Andrei
    claims there are infinitely many universes. This is outrageous.


    We had it—Stephen’s opening shot.


    Andrei was the celebrated American-Russian cosmologist Andrei Linde, one of the
    founding fathers of the cosmological theory of inflation, proposed in the early
    1980s. A refinement of the big bang theory, it postulates that the universe began
    with a brief burst of superfast expansion—inflation. Linde later concocted an
    extravagant extension of his theory, which inflation produced not one but many
    universes.


    I used to think of the universe as all there is. But how much is that? In Linde’s
    scheme, what we have been calling “the universe” would be only a sliver of a vastly
    larger “multiverse.” He envisioned the cosmos as an'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'enormous swelling expanse of countless different universes lying far beyond
    one another’s horizons, like islands in an ever-inflating ocean. Cosmologists
    were in for a wild ride. Stephen, the most adventurous of them all, had taken
    note.


    Why worry about other universes? I asked.


    Stephen’s answer was enigmatic. Because the universe we observe appears designed,
    he said. Then, as he continued clicking, Why the universe the way it is? Why are
    we here?


    None of my physics teachers had spoken about physics and cosmology in such metaphysical
    terms.


    “Isn’t that philosophical matter?” I tried.


    “Philosophy is dead,” Stephen said, eyes twinkling, ready to engage. I wasn’t
    quite ready, but I couldn’t helps.'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'I knew that when Stephen said that the universe appears designed, he was referring
    to the extraordinary observation that it emerged from its violent birth spectacularly
    well configured to sustain life—if billions of years in the future. This convenient
    fact has, in one way or another, bedeviled thinkers for centuries because it feels
    like a major fix. It''s almost as if the genes of life and the cosmos are entwined
    with each other, that the knew all that day it would be our home. What are we
    to make of this mysterious appearance of intent? It is one of the central questions
    humans ask about the universe and Stephen felt deeply that cosmological theory
    had something to say about it. The prospect—or hope—of being able to crack the
    riddle of cosmic design drove much of his work.


    This itself was exceptional. Most physicists prefer to steer away from such difficult,
    seemingly philosophical matters. Or they believe that one day the universe''s
    delicately crafted architecture follows from an elegant mathematical principle
    at the core of the theory of everything. If this were the case, the universe''s
    apparent design would seem like a lucky accident, a serendipitous consequence
    of objective and impersonal laws of nature.


    But neither Stephen nor Andrei your usual physicist. Reluctant to bet on the beauty
    of abstract mathematics, they felt that the uncanny fine-tuning of the universe
    that engender life tapped into a deep problem at the roots of physics. Not content
    to merely apply the laws of nature, they sought a more expansive view of physics
    that included questioning the origin of the laws. They led them to produce the
    big bang, for it was presumably by the universe''s birth that its law-like design
    was laid out. And it was on its birth Stephen and Andrei disagreed.


    Andrei envisaged the cosmos as a gigantic ballooning space in which many big bangs
    continually produce new universes, each with its own physical properties, as if
    the were little more than our local cosmic weather. We should not be surprised
    to find ourselves in a rare universe suited to life, he argued, for we obviously
    couldn''t exist in one of the many universes where life is impossible. Any impression
    of a grand design'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'behind it all would be an illusion of Linde''s multiverse, stemming from our
    limited view of the cosmos.


    Stephen argued that Linde''s grand cosmic extension, from universe to multiverse,
    was a metaphysical fantasy that didn''t explain anything, although I sensed that
    he couldn''t prove it. Nonetheless, I found it intriguing and exciting that the
    world''s most eminent cosmologists, while strongly disagreeing, were debating
    these foundational questions with such strong conviction.


    Doesn''t Linde invoke the anthropic principle, the condition that we exist, to
    pick out a biofriendly universe in the multiverse? I ventured.


    Stephen turned his eyes, looked at me, and slightly moved his mouth, leaving me
    puzzled. Later I would learn that this meant he disagreed. When he realized I
    hadn''t been introduced to the sort of nonverbal layer of communication practised
    within his inner circle, he turned his eyes back to the screen and set to construct
    a whole new sentence. Two sentences, in fact.


    The anthropic principle is a counsel of despair, he wrote, my bemusement mounting
    in sync with his clicking. It is a negation of our hopes of understanding the
    underlying order of the universe, on the basis of science.


    Well, this was surprising. Having read A Brief History of Time, I was well aware
    that the early Hawking had frequently flirted with the anthropic principle as
    part of the explanation for the universe. A cosmologist at heart, Stephen appreciated
    early on the surprising resonances between the large-scale physical properties
    of the universe and the existence of life as such. As far back as the early 1970s
    he had advanced an anthropic argument—wrongly, it turned out—as an explanation
    for the expansion of the universe proceeded at the same rate in all three directions
    of space,[22] Had he changed his mind on the merits of anthropic reasoning in
    cosmology?


    While Stephen took a medical stop to clear his trachea, I looked around his office.
    Copies of A Brief History of Time translated into exotic languages were piled
    high on a shelf that stretched across the length of the wall on our left. I wondered
    what else was in there that he no longer'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'subscribed to. Next to these brief histories I noticed a row of his former
    graduate students’ PhD dissertations. Starting in the early 1970s Stephen had
    established a celebrated school of thought at Cambridge, which always included
    a small circle of rotating graduate students and postdoctoral scholars.


    The titles of their dissertations touched on some of the most profound questions
    physics had grappled with in the late twentieth century. From the 1980s I saw
    Brian Whitt’s Gravity: A Quantum Theory? and also Raymond Laflamme’s Spacetime
    Wormholes and the Constants of Nature took me to the early 1990s Stephen and his
    colleagues thought wormholes—geometric bridges across space—influenced the properties
    of elementary particles. (Stephen’s friend Kip Thorne would later put wormholes
    to use in the movie Interstellar, to get Cooper back to the solar system.) To
    Fay’s right stood Problems in M Theory by Marika Taylor, Stephen’s most recent
    academic offspring. Marika had worked under Stephen in the midst of the second
    string theory revolution when the theory morphed into a much larger known as M-theory,
    and Stephen finally began to warm up to the idea.


    All the way to the left on the shelf stood two copies of an older book with a
    thick green cover, Properties of Expanding Universes. This was Stephen’s own PhD
    dissertation, going back to the mid-1960s, to the time the large Holdel Horn Antenna
    at Telephone Labs picked up the first echoes from the hot bang in the form of
    microwave radiation. Stephen proved in his thesis that if Einstein’s theory of
    gravity was right, then the existence of these echoes meant time must have had
    a beginning. Now how did that square with Andrei’s multiverse we were just talking
    about?


    Immediately to the right of Stephen’s, I saw Gary Gibbons’ Gravitational Radiation
    and Gravitational Collapse. Gibbons was Stephen’s first PhD student, in the early
    1970s, during a time when the American physicist Joe Weber claimed to hear frequent
    bursts of gravitational waves coming from the center of the Milky Way. The intensity
    of gravitational radiation reported was so high that it seemed the galaxy'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'was losing mass at a rate that could not be sustained for eons—if this were
    true, there would soon be no galaxy left. Captivated by this paradox, Stephen
    and Gary toyed with the idea of constructing their own gravitational-wave detector
    in the basement of DAMTP. This was a narrow escape; rumors of gravitational waves
    turned out to be false and it would be another forty years before LIGO, the Laser
    Interferometer Gravitational-Wave Observatory, would finally succeed in detecting
    these elusive rippling vibrations.


    Stephen usually took on one new graduate student every year to work with him on
    one of his high-risk-high-gain projects, to do with either black holes—collapsed
    stars hidden behind a horizon—or with the big bang. He tried to alternate, assigning
    one student to work on black holes and the next one to work on the big bang so
    that at any time his circle of graduate students covered both strands of his research.
    He did this because black holes and the big bang were like yin and yang in his
    thinking—many of Stephen’s key insights into the big bang can be traced to ideas
    he first developed in the context of black holes.


    Both inside black holes and at the big bang, the macorld of atoms and particles.
    Under these extreme conditions, Einstein''s relativity of gravity and quantum
    theory had better work together. Except they don''t, and this is widely viewed
    as one of the biggest unsolved problems in physics. For example, both theories
    embody a radically different view of causality and determinism. Einstein’s theory
    adheres to the old determinism of Newton and Laplace, quantum theory contains
    a fundamental element of uncertainty and randomness and retains only a reduced
    notion of determinism, about half of what Laplace thought it was. Over the years,
    Stephen’s group and its diaspora had done more than any research group in the
    world to expose the deep conceptual questions that arise when one tries to merge
    the seemingly contradictory principles of these two physical theories into a single
    harmonious framework.


    Meanwhile Stephen was “sorted out,” as his nurse put it, and had started clicking
    again. (A second pause in our conversation that afternoon involved'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'watching a preview of an episode of The Simpsons in which Stephen appeared
    and that he had been asked to vet.)


    I want you to work with me on a quantum theory of the big bang... I had apparently
    arrived in a big bang year.


    ...to sort out the multiverse. He looked up at me with a broad smile, eyes twinkling
    again. This was it. Not by philosophizing or by appeal to the anthropic principle
    but by weaving quantum theory deeper into cosmology were we to get a grip on the
    multiverse. The way he had put it made sound like an ordinary homework problem,
    and though I could discern from his face that we had already started working,
    I had no clue in which direction spaceship Hawking was heading.


    I am dying...appeared on the screen. I froze; glanced at his nurse who was reading
    quietly in a corner of the office. I looked back at Stephen, who seemed fine,
    as far as I could tell, and continued clicking away.


    ...for...a...cup...of...tea. This was Britain and it was four P.M.


    UNIVERSE OR MULTIVERSE? Design(er) or not? This was the fateful question that
    would keep us occupied for twenty years. One homework led to another and soon
    Stephen and we found ourselves in the midst of what would become one of the most
    heated debates in theoretical physics in the first part of the twenty-first century.
    Nearly everyone had an opinion on the multiverse, though no one quite fathomed
    what to make of it. What started out as a doctoral project under his supervision
    evolved into a wonderfully intense collaboration ending only with Stephen’s passing
    on March 14, 2018.


    At stake in our work wasn’t just the nature of the big bang, that enigma at the
    heart of existence, but also the deeper meaning of the laws of nature as such.
    What is it, ultimately, that cosmology finds out about the world? How do we fit
    into it? Such considerations take physics out of its'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'comfort zone. Yet this was exactly where Stephen liked to venture into and
    where his unmatched intuition, forged through decades of profound cosmological
    thinking, proved prophetic.


    Like many scholars before him, the early Hawking regarded the fundamental laws
    of physics as immutable, timeless truths. “If we discover a complete theory...we
    would truly know the mind of God,” he wrote in A Brief History of Time. More than
    ten years on, however, during our first meeting—and with Linde’s multiverse breathing
    down our neck—I sensed he felt a crack in this position. Does physics provide
    godlike foundations operating at the big bang origin of time? Do we need such
    foundations?


    We were soon to discover that the Platonic pendulum in theoretical physics swung
    too far indeed. When we trace the universe back to its earliest moments, we encounter
    a deeper level of evolution, at which the physical laws themselves change and
    evolve in a sort of meta-evolution. The rules of physics transmute in the primal
    universe, in a process of random variation and selection akin to Darwinian evolution,
    with particle species, forces, and we will, even time fading away into the big
    bang. Stronger still, Stephen and I came to see the big bang not as the beginning
    of time but also as the origin of physical laws. At the heart of our cosmogony
    lies a new physical theory of the origin, which we came to realize, at the same
    time encapsulates the origin of theory.


    Working with Stephen was a voyage not only into the fringes of space and time
    butinto what made Stephen Stephen. Our shared quest meant we grew. He was a true
    seeker. Being around him, one could not fail to be influenced by his determination,
    and by his epistemic optimism that we could tackle these mystifying cosmic questions.
    Stephen made us feel like we were writing our own creation story, which, in a
    sense, we did.


    And physics was fun! With Stephen you never quite knew when work ended and the
    party began. His insatiable passion to understand was matched only by his zest
    for life and his spirit for adventure. In April 2007, a few months after his sixty-fifth
    birthday, he took part in a zero-gravity'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'flight aboard a specially equipped Boeing 727, which he saw as a prelude to
    a trip to space, all while his doctors panicked about him crossing the Channel
    on the Eurostar to come visit me in Belgium.


    Meanwhile, with his natural voice permanently silenced and too weak now to move
    a finger, nevertheless became the biggest science communicator of our age. Inspired
    by a deep sense that we are part of a grand scheme that is written across the
    sky, waiting, as it was, for us to unravel, he shared his joy for discovery with
    a worldwide audience. Midway through our collaboration he wrote a book, *The Grand
    Design*, which reflects our confusion in the time. In it Stephen clings to the
    anthropic principle, the multiverse, and the idea of a final theory of everything,
    down to its rivalry with a God-created universe. But *The Grand Design* also contains
    the first traces of the new cosmological paradigm that would crystallize in our
    work a few years later. Shortly before his death, Stephen told me that it was
    time for a new book. This is that book. In the next few chapters I describe my
    journey back to into the big bang, and how this journey led Hawking to discard
    the multiverse and replace it with a startling new perspective on the origin of
    time, profoundly Darwinian in spirit and nature and offering a radically revised
    understanding of the grand cosmic design.


    We would often be joined in our endeavors by the American physicist Jim Hartle,
    Stephen''s longtime collaborator with whom in the early 1980s he had pioneered
    the subject of quantum cosmology. Over the years the pair acquired a real knack
    for seeing the universe through a quantum lens. The language between them embodied
    their quantum thinking, as if they were wired differently. For example, by "the
    universe" cosmologists usually mean the stars and the galaxies and the vast space
    around us. When Jim or Stephen said "the universe," they meant the abstract universe,
    awash in uncertainty, with all its possible histories living in some sort of superposition.
    But it was precisely their quantum outlook that eventually made a genuine Darwinian
    revolution possible in cosmology. The later Hawking took quantum theory seriously—very
    seriously indeed—and decided to run with it, employing it to rethink the universe
    on the very'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'largest scales. Quantum cosmology would be the field of research where Stephen
    remained at the forefront until the end of his life.


    When a while into our collaboration he lost the remaining strength in his hand
    to press the cliquer to converse, Stephen switched to an infrared sensor mounted
    on his glasses that he activated by slightly twitching his cheek. But eventually
    this too became difficult. Communication slowed, from a few words per minute to
    minutes per word, before basically grinding to a halt, even as demand for his
    voice skyrocketed33 Here was the world''s most celebrated apostle of science,
    unable to talk. But Stephen didn''t give up. With our intellectual connection
    deepened through years of close collaboration we moved increasingly beyond verbal
    communication. Bypassing Equalizer, sensors, and clickers, I would position myself
    in front of him, clearly in his field of vision, and probe him by firing questions.
    Stephen''s eyes would light up brightly when my arguments resonated with his intuition.
    We would build on this connection, navigating and exploiting the common language
    and mutual understanding we had forged over the years. It is out of these “conversations”
    that, slowly but steadily, Stephen''s final theory of the universe was born.


    There are critical junctures in science when metaphysical considerations come
    to the fore, whether such forks in the road we learn something profound, not only
    the works of nature but also about the conditions that make our practice of science
    possible and worthy, and about the worldview our discoveries might nurture. Physics''
    quest to grasp what makes the universe just right for life has brought us to one
    such critical fork. For it is, at its core, a humanist question, much bigger than
    science. This is about our origins. Stephen''s final theory of the universe contains
    the kernel of a uniquely powerful reflection on what it can mean to be human in
    this biofriendly cosmos, as stewards of planet Earth. For this reason alone it
    may ultimately prove to be his greatest scientific legacy.'
  merge: -1
  img_proc: true
