- pgno: 64
  md: 'This equation isn’t difficult to read. The right-hand side we have all the
    matter and energy in a region of spacetime, denoted by $T_{\mu

    u}$. The left side describes the geometry, $G_{\mu

    u}$, of that region. The equal sign in the middle is where the magic happens:
    It tells, with mathematical precision, how the geometry of spacetime on the left
    ($G_{\mu

    u}$) is tied to a given configuration of matter and energy ($T_{\mu

    u}$) on the right, this relationship, Einstein’s theory says, is what we experience
    as gravity. Hence gravity doesn’t enter Einstein’s theory as an independent force.
    It rather *emerges* from the interplay between matter and the shape of spacetime.
    The American physicist John Archibald Wheeler put it, "Matter tells spacetime
    how to curve. Spacetime tells matter how to move."[2]


    In short, general relativity breathes life into spacetime. The theory transforms
    spacetime from Newton’s immutable stage before our understanding into a flexible,
    physical field. Incidentally, the concept of fields in physics, invisible space-filling
    substances, goes back to the brilliant nineteenth-century Scottish experimenter
    Michael Faraday. Shortly after, Maxwell made use use of fields to formulate his
    theory of electromagnetism. The magnetic field through which a magnet exerts its
    influence is probably the best-known example of a physical field indeed. Today,
    physicists use fields not only to describe forces but also species of particles.
    Roughly, we think of particles as dense nuggets of the underlying space-filling
    field. Einstein’s genius was to identify spacetime itself as the physical field
    responsible for gravity.


    It wasn’t long before support for general relativity began rolling. The first
    evidence came from within the solar system and had to do with the path of the
    planet Mercury. When in the mid-nineteenth century Le Verrier had pointed astronomers
    to the planet Neptune, he had also noticed that Mercury’s orbit slightly deviated
    from Newton’s law of gravity predicted. Not surprisingly, Le Verrier suggested
    Mercury’s trajectory might be influenced by another planet, closer to the sun,
