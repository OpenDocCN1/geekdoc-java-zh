  md: 'By the 1990s, Stephen had grown quite attached to his no-boundary hypothesis.
    The way it ingeniously circumvented the age-old paradoxes associated with a beginning
    of everything had an irresistible charm. Hawking, it also had the ring of truth.
    Ample evidence suggests he regarded it as his greatest discovery indeed.[3] But
    no matter how elegant or beautiful a cosmological theory, its real test lies in
    its predictions, and Hawking was the first to emphasize this. Suppose the universe
    was born “nothing,” out of a spherical nugget of pure space. What exactly would
    the speckled CMB map look like? An intriguing question, and one that topped Stephen’s
    agenda. But to answer this we must first return to cosmic inflation, the idea
    that the universe underwent a brief burst of superfast expansion early on.


    The theory of cosmic inflation was pioneered in the early 1980s by the theoretical
    physicists Alan Guth, Andrei Linde, Paul Steinhardt, and Andreas Albrecht. It
    counts the most important refinement of the hot bang model since its inception.
    Originally, inflation was thought of as a brief transient phase very early on
    the universe’s history when gravity would have been strongly repulsive, driving
    an intense burst of extreme expansion. Inflation’s pioneers envisaged that, in
    less a split second, the observable universe would have swollen by a stupendous
    factor of $10^{30}$. That corresponds roughly to the difference in scale between
    an atom and the Milky Way.


    This expansion boom appealed to theorists that I discussed in chapter 3: Why is
    the universe so smooth and uniform on the largest scales? A short shot of superfast
    expansion would mean that even the most distant regions in today’s observable
    universe would have been close together initially, at the onset of inflation,
    lying neely within each other’s horizon. Looking at figure 19, what happens is
    even the briefest burst of superfast inflation would push the big bang singularity
    further down, thereby creating a single interconnected environment covering our
    entire past light cone. The entire observable universe would thus had a common
    causal origin, from which it could have emerged nearly the same everywhere.'
