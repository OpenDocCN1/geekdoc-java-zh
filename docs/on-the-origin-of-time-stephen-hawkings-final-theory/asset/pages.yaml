- pgno: 313
  md: 'from the universe’s birth. This can be done by tracing the universe back in
    time. When one finally gets to the big bang, a deeper level of evolution opens
    up in which the laws of physics themselves change. One discovers a sort of meta-evolution,
    a stage where the rules and principles of physical evolution co-evolve with the
    universe govern.


    This meta-evolution has a Darwinian flavor, with its interplay of variation and
    selection out in the primal environment of the early universe. Variation enters
    because random quantum jumps cause frequent small excursions and occasional larger
    ones. Selection enters because some of these excursions, especially the larger
    ones, can be amplified and frozen in the form of new rules that help shape the
    subsequent evolution. The interaction between these two competing forces in the
    furnace of the hot big bang produces a branching process—somewhat analogous to
    how biological species emerge billions of years later—in which dimensions, forces,
    and particle species first diversify and then acquire their effective form when
    the universe expands and cools to ten degrees or so. The randomness involved in
    these transitions means that, just like the Darwinian evolution, the outcome of
    this truly ancient layer of cosmic evolution can only be understood post facto.


    Of course, connecting the dots to piece together the tree of physical laws will
    continue to challenge us for the foreseeable future. With only scant fossil records
    of the earliest moments and with most of the universe’s contents dark and mysterious,
    the cosmogenesis has proven extremely difficult to decipher. But advances in telescope
    technology continue to expand our senses. From exquisite observations of the microwave
    background radiation to ingenious searches for particles of dark matter and bursts
    of gravitational waves, physicists all over the world are gearing up to unlock
    that remote era harboring our deepest roots.


    Now, if the effective laws of physics are fossil relics of an ancient evolution,
    ontologically speaking, we should probably regard these on equal footing with
    law-like characteristics of other levels of evolution. Stronger still, one might
    argue that in the grand frame of quantum cosmology, it appears there isn’t the
    slightest ontological difference'
