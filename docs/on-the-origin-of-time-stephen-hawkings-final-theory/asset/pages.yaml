  md: '# ACKNOWLEDGMENTS


    MY JOURNEY WITH STEPHEN HAWKING would not have been possible without the help
    of many colleagues and friends along the way.


    Thanks to Adrian Ottewill and Peter Hogan from Dublin, Ireland, who in 1996 put
    me on the train to Cambridge, UK. Sincere thanks to Neil Turok, whose captivating
    classes in this mecca of theoretical cosmology encouraged me to knock on Stephen’s
    door. And to my fellow PhD students in Hawking and Turk’s orbit, including Christophe
    Galfard, Harvey Reall, James Sparks, and Toby Wiseman, for their comrades.


    “You should go as far as possible,” Stephen said when I graduated, and I. Many
    thanks to Steve Giddings, David Gross, Jim Hartle, Gary Horowitz, Don Marolf,
    Mark Srednicki, and the late Joe Polchinski, for creating an extraordinary, stimulating
    research environment at UC Santa Barbara in these exciting early days of string
    cosmology.


    Around this time, Stephen bonded with George Mitchell. Sincere thanks to the Mitchell
    family for creating a wonderful refuge at their Cook’s Branch Conservancy where
    Stephen was able to work. Special thanks also to the International Solvay Institutes
    in Brussels, to their president Jean-Marie Solvay and their longtime director
    Marc Henneaux, and to the Institutes’ mater familias, Madame Marie-Claude Solvay,
    whose perspicacious reminiscences about Oppenheimer, Feynman, or Maître make the
    history of twentieth-century physics come alive. The Solvays’ warmth and generosity
    meant that the Institutes became so much more than a scientific haven on our journey.'
