    this was precisely what Eddington and his team found: The stars had moved. The
    New York Times reported on Eddington’s observations with the sensational headline
    LIGHTS ASKEW IN THE HEAVENS, MEN OF SCIENCE MORE OR LESS AGOG, propelling Einstein
    to international fame as the genius who had dethroned Newton.[19] Newton’s laws,
    once regarded as definitive truths, were shown to be provisional and approximate.
    That a British astronomer had tested a German physicist’s theory was ever heralded
    as an act of reconciliation between both countries so recently embattled in World
    War I.


    The bending of light around the sun is tiny—a few arc—because the sun’s gravitational
    field is weak by astronomical standards. But almost exactly a hundred years later,
    in the spring of 2019, the world’s front pages carried a spectacular smiley image
    displaying the deflection of light in its most extreme form. In a modern-day version
