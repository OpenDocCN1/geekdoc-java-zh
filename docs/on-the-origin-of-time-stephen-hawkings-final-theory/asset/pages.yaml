    Primordial gravitational waves from inflation would have expanded in sync with
    the universe since its birth. By now they would have exceedingly long wavelengths
    that don’t fit in the iconic L-shaped observatories on the surface of Earth. But
    the mere existence of gravitational ripples from inflation, undulating throughout
