- pgno: 40
  md: 'exceedingly improbable pathways are often realized, and determinism fails.
    The chance outcomes at countless branching events infuse a genuinely emergent
    element into evolution. They add a vast amount of structure and information that
    simply isn’t contained in the lower-level laws, out of which new law-like patterns
    at higher levels can—and often do—emerge. For example, though no serious scientist
    today believes there are special “vital forces” in biology that have no physicochemical
    origin whatsoever, the physical alone does not determine what will be the laws
    of biology on Earth.


    A mere eighteen days after the November 24, 1859, publication of his masterpiece,
    On the Origin of Species, Charles Darwin received a letter from the astronomer
    Sir John Frederick William Herschel. Herschel, the son of the discoverer of Uranus,
    expressed skepticism about the arbitrariness in Darwin’s picture of evolution,
    saying his book was “the law of higgledy-piggy.” Yet herein lay its strength.
    The beauty of Darwin’s theory is that it offers a synthesis of the competing forces
    of random variation and environmental selection at work in the living world. Darwin
    found the sweet spot between the “why” and the “how” in biology, integrating causal
    explanations with inductive reasoning in a single coherent scheme. He showed that
    despite its fundamentally historical and accidental nature, biology can be a proper
    productive science that enhances our understanding of the living world.


    Darwin reinforced the scientific revolution and extended it into the one area
    where a teleological view had seemed unassailable—the living world. But the world
    it radiates couldn’t be more different from the one emanating from fundamental
