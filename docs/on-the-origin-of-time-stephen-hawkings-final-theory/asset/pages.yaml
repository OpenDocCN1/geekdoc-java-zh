    Yet there is a problem buried in this reasoning that will be of importance when
    I come to discuss the core of Hawking''s final theory: The multiverse is itself
    a Platonic construct. Multiverse cosmology postulates some sort of timeless metalaws
    governing the whole. But these metalaws do not specify in which one of the multivers
    we are supposed to be. This is a problem, for without a rule that relates the
    metalaws of the multiverse to the local laws within our island universe, the theory
    gets caught in a spiral of paradoxes that leaves one without verifiable predictions
    at all. Multiverse cosmology is fundamentally underdetermined and ambiguous. It
    lacks crucial information about our whereabouts in that crazy cosmic quilt and,
    as a consequence, can''t predict what we should see. The multiverse is like a
    debit card without a PIN or, worse, an IKEA closet without a manual. In a profound
    sense, the theory fails to say who we are in the cosmos, and where we are here.


    Multiversists, however, don''t give up easily. They have proposed a way to patch
    up the theory, a proposal so radical that it has shaken the scientific community
    ever since. This is the anthropic principle.


    THE ANTHROPIC PRINCIPLE made its entry in cosmology in 1973. The astrophysicist
    Brandon Carter, who was a fellow student in Cambridge with Stephen, put forward
    the principle at a conference in Kraków in commemoration of Copernicus. This was
    a curious twist of history since the sixteenth century, Copernicus had taken the
    first steps to demote mankind from its pivotal position in the cosmos.[13] More
    than four'
