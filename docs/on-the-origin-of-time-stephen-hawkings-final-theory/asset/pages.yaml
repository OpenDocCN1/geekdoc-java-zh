    But the real breakthrough of general relativity came in 1919 when the British
    astronomer Sir Arthur Eddington sailed out to the Portuguese island of Principe,
    off the coast of West Africa, to measure the positions of stars during a total
    solar eclipse. If Einstein were right and mass curves spacetime, starlight passing
    near a massive object like the sun shouldn''t travel in a straight line but be
