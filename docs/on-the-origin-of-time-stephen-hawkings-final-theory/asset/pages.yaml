    nature of intelligence, or the theory of everything, may soon be seen as a relic
    of an outdated or overly limited worldview. In a recent Quanta Magazine article,
    Robbert Dijkstra, former director of Princeton''s Institute for Advanced Study,
    “What we use to call ‘nature,’ is only the tiniest fraction of a vastly larger
    landscape out there, waiting to be unlocked.”[[8]


    Moreover, these developments reinforce each other, and it is at their intersection
    where we may find the most sweeping consequences. In 2020, a deep-learning program
    called AlphaFold, developed by Google''s AI branch DeepMind, trained itself to
    determine the three-dimensional shape of proteins from their sequence of amino
    acids, solving one of the big open challenges in the field of molecular biology.
    In the next few years, machine learning algorithms will be searching for new particles
    in the petabytes of data produced in the LHC at CERN and for patterns of gravitational
    waves picked up at LIGO. In time we should expect such deep-learning programs
    to dive with us into the mathematical structures underpinning our physical theories
    and, who knows, to reimagine the basic language of physics.


    So, by embracing the realm of “what could be,” we have arrived at the cusp of
    a whole new chapter in the age of modern science. In the twentieth century, scientists
    identified the elementary building blocks of nature: particles, atoms, and molecules
    are the constituents of all matter; genes, proteins, and cells are the components
    of life; bits, codes, and networked systems underpin intelligence and information.
    In this century we will begin'
  merge: -1
  img_proc: true
- pgno: 320
  md: 'to engineer new realities with their own laws by connecting these components
    in novel ways. Of course the rest of the natural world has been doing this for
    over thirteen billion years of cosmological expansion and almost four billion
    years of biological evolution on Earth. As Dijkgraaf eloquently describes, it
    has only explored the tiniest fraction of all possible designs. The number of
    genes that can be conceived mathematically is stupendous, far larger than the
    number of microstates of a typical black hole, but only a small sliver of these
    have been realized in life on Earth. Likewise, the range of physical forces and
    particles that can be fabricated in string theory is enormous. But the expansion
    of the early universe produced only this specific set. So, across the entire spectrum
    of complexity, from fundamental physics to intelligence, the manifold of possible
    realities is immensely larger than what natural evolution has so far produced.
    The twenty-first century is that critical period in history in which we are beginning
    to unlock this immense realm.


    This transition signifies the dawn of a new era, the first of its kind in the
    history of Earth, and perhaps even of the cosmos, in which a species attempts
    to reconfigure and transcend the biosphere as it has evolved. Echoing Hannah Arendt,
    from merely undergoing evolution, we are transitioning towards engineering it
    and, with it, our humanness.


    On the one hand, this is a time of great promise. The sheer latitude of pathways
    opening up is truly fantastic compared to anything we have experienced before.
    today will act as a springboard for unimaginable innovation and post-human flourishing.
    In these futures, the human era will represent a remarkable passage between the
    first nearly four billion years of agonizingly slow, Darwinian evolution and the
    next untold years of evolution driven by technological and intelligent design—both
    here on Earth and far beyond.


    But this is also a dangerously precarious time. Human-made existential risks,
    from the proliferation of nuclear war and global heating to advances in biotech
    and artificial intelligence, now far outweigh those naturally occurring. Britain’s
    Astronomer Royal Sir Martin Rees has estimated that taking all risks into account,
    there is only a 50 percent chance that we'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'get through to 2100 without a disastrous setback. Oxford’s Future of Humanity
    Institute puts the existential risk for humanity this century at around one in
    six. Hence there are countless future paths, not just an improbable branch or
    there, where we may descend into chaos and even vanish, leaving no more than a
    minor footnote in cosmic history.


    We have only one data point related to our prospects: No alien civilizations appear
    to have explored a substantial fraction of the stellar systems in our cosmic neighborhood.
    Hence among the billions of stars in our local past light cone, none appear to
    have evolved into a large-scale ecosystem with the level of technology that we
    may reach. The physical laws are remarkably fit for life, yet there is no evidence
    of anybody out there. We haven''t been able to tune in to the alien radio beaming
    extraterrestrial poetry, nor have we seen mysterious astroengineering projects
    across the sky. On the contrary, we have had great success in explaining the behavior
    of stellar systems, our galaxy, and the entire observable universe on the basis
    of a single set of natural physical laws. Wondering around this paradox, the Italian
    physicist Enrico Fermi, de famously asked, “Where is everybody?” Fermi’s point
    was that the lack of evidence for extraterrestrial civilizations, given biophilic
    conditions, suggests that there is a serious obstacle somewhere on the road of
    evolution from ordinary dead matter to the advanced technotope we may soon see.
    Do the principal እንደሚ lie in our past or in our future, or both? If the evolutionary
    steps in our past are so improbable that complex life-forms are rare in the universe,
    then the main bottleneck would almost certainly be behind us. But Fermi had a
    nagging feeling that the roadblock lie in the one transition that separates our
    current civilization from being able to spread into the cosmos: We may not be
    able to survive the world we’ve created. Some more insight in this would be helpful
    to come to a measure of collective foresight as we carve out a future.[9] As a
    matter of fact, shared Fermi’s feeling, saying at one point: “We only have to
    look at ourselves to see how intelligent life might develop into something we
    wouldn’t want to meet.”'
