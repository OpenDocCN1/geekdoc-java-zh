  md: '![](img/ab72d2797bfab8215351810eb8aa7ed1_278_0.png)


    # PARTICLES

    ON THE BOUNDARY


    FIGURE 54. Holographic relationships equate string theory and gravity in the interior
    of a curved spacetime to certain quantum theories of particles and fields without
    gravity living on the boundary of that spacetime.


    In its most ambitious form, the holographic duality states that a boundary world
    of quantum fields and particles fully specifies the behavior of gravity and matter
    inside AdS, and not just a classical or semiclassical approximation of it. What
    makes this doubly exciting is that the particle popping up in Maldacena''s duality
    are among the best understood quantum field theories, having been studied in depth
    by particle physicists since the middle of the twentieth century. Hence holography—in
    its ambitious form—provides a working example of a complete quantum theory of
    gravity and matter.


    This was a real game changer. For decades physicists had struggled to seal the
    marriage of general relativity and quantum theory. Ever since Maldacena''s epiphany,
    these two seemingly conflicting theories have been working in symbiosis. Holographic
    dualities have revealed that relativity and quantum theory aren''t antagonists
    but merely alternative vantage points on the same physical reality. Physical systems
    can be gravitational and quantum at the same time, holography says, albeit in
    different dimensions.'
