  md: 'Cosmologists refer to this as the measure problem of multiverse cosmology:
    We lack an unambiguous way of measuring the relative weight of different populations
    of island universes and this undermines the predictive power of the theory when
    it comes to our observations. In fact, this measure problem manifests itself perhaps
    most sharply when we attempt to predict properties of the universe that have nothing
    directly to do with life, for the anthropic principle provides no escape route
    to hide behind.[8]


    We have arrived at a textbookian crisis. The hope was that the anthropic principle
    would specify “who we are” in the cosmic patchwork of eternal inflation, that
    it relate abstract multiverse theory to our experiences and measurements as observers
    within this universe. However, it fails to insert “us” into the equations in a
    manner that complies with basic scientific practices, leaving the theory with
    no explanatory reach at all.


    As a matter of fact, invoking a process of random selection apart from and on
    top of the metalaws conceals a decidedly non-anthropic, godlike perspective on
    cosmic affairs. Random selection imagines that we are somehow looking down on
    the cosmos from the outside and “choose” who we are among all observers like us.
    This would be justifiable if we or some metaphysical agency had actually performed
    such an operation and was aware of the result of this selection. However, there’s
    not a shred of evidence for this. It is fallacious reasoning to equate our mere
    noticing that we are human beings living in a universe to performing a cosmic
    act of random selection.[9] Hence we should not be deriving theoretical predictions
