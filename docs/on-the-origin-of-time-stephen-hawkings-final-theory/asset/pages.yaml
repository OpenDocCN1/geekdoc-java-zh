    Isaac Newton, alchemist, mystic, a difficult character but one of the most powerful
    mathematicians who has lived, consolidated the mathematical approach to natural
    philosophy with his *Principia*, arguably the most important book in the history
    of science. Newton got a good start on it in lockdown, during the plague of 1665,
    when the University of Cambridge shut down. A fresh BA, Newton went back to his
    mother’s house and his apple orchard in Lincolnshire. There he thought about calculus,
    about gravity and motion, and split light with a prism, showing that white light
