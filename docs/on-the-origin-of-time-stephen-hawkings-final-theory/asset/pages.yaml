  md: 'As a matter of fact, the idea that the universe may be akin to a hologram has
    a long history. You might remember Plato''s allegory of the cave, in which Plato
    likens our perceptions of the world to those of prisoners confined to a cave watching
    shadows meander across the walls. Plato imagined that our world of appearances
    was only a faint glimmer of a far superior reality of perfect mathematical forms
    that existed out there, independently of us. Today, the holographic revolution
    in physics is turning Plato’s vision on its head. The latest incarnation of holography
    envisions that everything the four dimensions experience is in fact a manifestation
    of a hidden reality located on a thin slice of spacetime. Holographic thinking
    posits there is an alternative description of reality, a completely different
    way of looking at the world, where gravity and warped spacetime are somehow projected.
    Moreover, it holds that this three-dimensional shadow world of quantum particles
    and fields may be telling the full story after all. In our most ambitious form,
    twenty-first-century holographic physics asserts that if only we could decode
    the hidden hologram, we would understand the deepest nature of physical reality.


    The theoretical discovery of holography ranks among the most important and far-reaching
    discoveries in physics of the late twentieth century. It also had an immediate
    influence on Stephen’s thinking, drawing him deeper into string theory. And even
    though physicists still don’t agree where exactly the hologram would be located
    or what it would be made of, the novel vista that holography has revealed already
    changed the field of theoretical physics beyond recognition. For decades, theoretical
    physicists had struggled to complete the unification of general relativity and
    quantum theory that string theory initiated. The discovery of holography did exactly
    that. It showed that gravity and quantum theory need not be water and fire but
    can be like yin and yang, two very different yet complementary descriptions of
    one and the same reality.


    While holography wasn’t invented with a realistic universe in mind, cosmology
    may well be the arena where it will ultimately have its most radical implications.
    Holography provided the avenue Stephen on firmer footing. And as I have been looking
    to put top-down cosmology on firmer footing'
