  md: 'In a cosmological context, the molding of the extra dimensions is part of the
    chain of symmetry-breaking transitions that causes the tree of effective laws
    to bud. Also the burst of inflation, the transition whereby three space dimensions
    break away and expand, can be viewed as part of sculpting the high-dimensional
