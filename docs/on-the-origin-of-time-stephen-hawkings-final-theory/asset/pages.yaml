  md: '![](img/ab72d2797bfab8215351810eb8aa7ed1_28_0.png)


    FIGURE 4. Relief portraying the ancient Greek philosopher Anaximander from Miletus.
    Twenty-six centuries ago, Anaximander laid the first stones of the long and winding
