  md: 'to time when physicists had Newton’s laws of gravity and motion James Maxwell’s
    theory of electricity, magnetism, and light, which, together with the theory of
    heat, underpinned the industrial revolution. The worldview emerging from these
    nineteenth-century physical theories was in line with our intuitive picture of
    reality, involving particles and fields, propagating through a fixed space and
    guided by a universal clock—a cosmic Big Ben one might say. It isn’t surprising,
    therefore, that physicists thought they were converging on a definitive description
    of nature and that physics would sound be complete.


    In the year 1900, however, the Irish-Scottish physicist William Thomson, one of
    the giants of classical nineteenth-century physics better known as Lord Kelvin,
    noted “two dark clouds on the horizon.”[3] One of the clouds Kelvin identified
    had to do with the motion of light through the ether and the other with the amount
    of radiation emitted by hot objects. Still, most physicists felt that these were
    more details to be wrapped up and that the edifice of physical theory was solid
    and sound.


    Within a decade, however, this edifice had crumbled. The resolution of Kelvin’s
    “details” unleashed two full-scale revolutions, of relativity and quantum mechanics.
    What was more, each of these revolutions took physics in a radically different
    direction, casting a new cloud that still hovers over the frontier of physics
    today: the problem of how the macro and the micro worlds fit together.


    What exactly was it about light that rocked the foundations of nineteenth-century
    physics? Careful experiments showed that light always moves at 186,282 miles per
    second, regardless of the observer’s motion relative to a light source. Obviously,
    that fact didn’t match with everyday experience: if you’re traveling on a moving
    train and you measure its speed, you will clearly obtain a different value (zero)
    compared to when you measure its speed while standing outside. It also ran against
    nineteenth century thinking. Light waves were thought to be carried by the ether,
    a mysterious space-filling medium. If that were the case, however, observers moving
    at different velocities relative to the ether should see light waves pass by at
    different speeds. But experiments showed'
