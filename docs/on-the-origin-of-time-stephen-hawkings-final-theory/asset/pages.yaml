    The triptych in figure 43 integrates observership with dynamics and conditions
    into a novel conceptual framework for cosmology. Such a synthesis isn''t a mere
    footnote, or a minor correction to an equation, but a foundational generalization
    of physics itself. With its unification of dynamics and boundary conditions, the
    triptych departs from the dualism that has dominated modern physics since its
    inception. With its inclusion of observership, it gives up on the pursuit of the
    truth from nowhere.


    What the top-down character of quantum cosmology does not mean, however, is that
    we can send signals back in time. Observership departs the past firmly into existence,
    but it doesn''t transmit information back in time. In Wheeler''s cosmic-scale
    version of the delayed-choice experiment, turning telescopes on off in the twenty-first
    century doesn''t affect the motion of photons billions of years ago. Quantum cosmology
    doesn''t deny that the past has happened; rather it refines what it means “to
    happen” and, especially, what can—and what cannot—be said about the past.


    Wheeler was fond of illustrating his vision with a variant of the twenty questions
    game. In this game, a group of colleagues are seated in a living room after dinner.
    One is sent out. In his absence, the rest decide to play the game with a twist:
    They agree not to settle on a definite word but act as if they had agreed upon
    a word. When the questioner returns and poses his “yes/no” questions, each respondent
    answers as he pleases, with the one condition that his response should be compatible
    with all previous ones. So at each stage of the game, everyone in the room has
    in mind a word that is consistent with all the answers have been given before.
    Naturally, successive questions rapidly narrow down the options until both the
    questioner and the respondents are taken by the hand, as it were, and guided toward
    a single word. What that final word is, however, depends on the questions questioner
    asks and even on the order of the questions. In this variant of the game, Wheeler
    said, “No word is a word, until that word is promoted to reality by the choice
    of questions asked and answers given.”[18]'
