- pgno: 38
  md: 'Consider the woods I can see from my office window, a few miles south of the
    battlefield of Waterloo. On June 17, 1815, on the eve of the main battle, Napoleon
    Bonaparte ordered his general, Emmanuel De Grouchy, to pursue the Prussian army
    in order to prevent them from merging with the Anglo-allied forces taking position
    further north. Grouchy dutifully marched northeast with a good of the French troops
    but failed to find the Prussians. The next morning—from these woods I can see—he
    heard the deep sound of the French cannons in the distance and realized the battle
    had already begun. For a few crucial minutes he hesitated over whether to disobey
    Napoleon’s orders by turning and rushing to the aid of the remaining French troops.
    He chose to walk away, as destiny, in pursuit of the Prussians. Grouchy''s decision
    at that moment was a remarkable frozen accident, that not only impacted the battle’s
    outcome but also affected the course of European history.


    Or, to take another example, consider the rise of Christianity in the Roman Empire
    in the fourth century A.D. When the emperor Constantine ascended to the throne
    in A.D. 306, Christianity was little more than an obscure sect that was competing
    for influence with a range of cults. Why did Christianity take over the Roman
    Empire and rise to become the common faith? The historian Yuval Harari argues
    in his book Sapiens that isn''t a causal explanation and that the dominant influence
    of Christianity in Western Europe is better viewed as yet another frozen accident.
    Eching Gould on biology, Harari asserts that “if we could rewind history and replay
    the fourth century hundred times, we would find that Christianity would have taken
    over the Roman empire a few times only.” But the frozen accident of Christianity
    had far-reaching consequences. For one, monotheism encouraged a belief in God
    the creator, with a rational plan for the created world. It is hardly surprising,
    that, when centuries later modern science finally emerged in Christian Europe,
    the early scientists regarded their investigations as a sort of religious pursuit,
    setting the scene for the riddle of design we are still grappling with.


    In general, the myriad of roads lying wide open at every point in history, from
    human history to biological and astrophysical evolution, mean that'
