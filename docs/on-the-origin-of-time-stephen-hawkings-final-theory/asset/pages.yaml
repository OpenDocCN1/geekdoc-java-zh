    By applying computational algorithms, we can compress data and store them in a
    shorter message. Take, for example, the orbits of the planets. One can describe
    these by specifying the positions and momenta of all'
  merge: -1
  img_proc: true
- pgno: 388
  md: 'planets at a series of moments of times, but this message is compressible to
    a statement of the positions and momenta at one time, combined with Newton''s
    equations of motion. Moreover, the data of many different gravitating systems
    can be compressed into a message involving the same equations of motion. This
    is what gives Newton''s equations their universal law–like character. This is
    quite different, however, from endowing those equations with an independent objective
    existence that supersedes the cosmos.


