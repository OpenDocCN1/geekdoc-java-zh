  md: 'for a better understanding of the appearance of design in cosmology. Nobel
    laureate David Gross, for one, has long held this view: “The more we observe and
    know about the universe, the worse the anthropic principle fares."[11]


    Multiverse theory asserts that there are fundamental limits to the whole idea
    of evolution. Framing the ancient evolution leading to the effective laws of physics
    against the fixed backdrop of unchanging metalaws, multiverse cosmology adheres
    to which is, after all, a relatively orthodox explanatory scheme in physics. It
    assumes the way down at the bottom of physics and cosmology we will find stable,
    timeless metalaws. These metalaws are assumed to take the form of a central master
    equation governing the cosmic mosaic as a whole, from which the probabilistic
    predictions for low-energy observations like ours will be computable. Viewed in
    this grandest scheme, the multiverse is little more than an epicycle on Newtonian
    epistemology, somewhat like the way the ancients added epicycles onto epicycles
    in an attempt to rescue the Ptolemaic world model. Evolution and emergence ultimately
    remain secondary phenomena in multiverse cosmology, somewhat less fundamental.
    This is the very core of the matter of Hawking versus Linde: whether, deep down,
    either change or eternity wins.


    IS THAT IT? That evening in Beverly Hills, the aftermath of the propounded anthropic
    multiverse revolution, with the Cuban band playing in the background, Stephen
    was ready to ditch the anthropic principle for good. Let’s do this properly, he
    said. No longer content to outsource the falsifiability of cosmological theory
    to a nonscientific principle, we vowed to rethink its basic foundations. The riddle
    of design was bound to take us deep into the very roots of physics, and we were
    on our own. String theorists were out in another universe.'
