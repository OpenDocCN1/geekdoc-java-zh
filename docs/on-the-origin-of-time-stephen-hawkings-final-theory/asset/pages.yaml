  img_proc: true
- pgno: 27
  md: 'that we can discover and understand. Indeed, the very essence of modern science
    is that, having admitted ignorance, we can acquire new knowledge, by experimenting
    and observing and by developing mathematical models that organize these observations
    in general theories or "laws."


    Paradoxically, however, the scientific revolution deepened the riddle of the universe’s
    biofriendliness. Prior to the scientific revolution, a unity of sorts underpinned
    mankind both the animate and the inanimate worlds were thought to be guided by
    an all-encompassing purpose, divine or otherwise. The world’s design was viewed
    as a manifestation of a grand cosmic plan that, naturally, assigned a privileged
    role to man. The ancient world model put forward by the Alexandrian astronomer
    Ptolemy in his Almagest, for example, was as much geocentric as it was anthropocentric.


    But with the advent of the scientific revolution, the fundamental nature of life’s
    relationship with the physical universe became fraught with confusion. Nearly
    five centuries on, our bafflement at the fact that the supposedly objective, impersonal,
    timeless laws of physics are nearly suited for life is a clear manifestation of
    this confusion. So, although modern science successfully abolished the old dichotomy
    between the heavens and the earth, it created a formidable new rift, between the
    living and nonliving worlds, leaving man’s perception of his place in the grand
    cosmic scale gnawing uncertain.


    As a matter of fact, we might get a better appreciation for how man’s views on
    the ontology of nature’s laws have come to be what they are by returning to the
    deeper roots of the idea that there are laws. The very first intimations of rules
    governing nature emerged in sixth-century b.C. Milesetus, at the Ionian school
    of Thales, in what is today the western part of Turkey. Milesus, the richest of
    the Greek Ionian cities, was founded at a natural harbor near where the river
    Meander flows into the Aegean Sea. There the legendary Thales, much like modern
    scientists, was willing to look beneath the surface appearances of the world in
    order to pursue knowledge at a deeper level.'
