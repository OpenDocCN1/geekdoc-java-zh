- pgno: 53
  md: 'As a matter of fact, this wasn’t the first time Stephen was confronted with
    a mystifying stream paradox. Back in 1977 he put his finger on a similar conundrum
    having to do with the fate of black holes. Einstein''s general relativity theory
    predicts that nearly all information about anything falling into a black hole
    remains forever hidden inside. But Stephen discovered that quantum theory adds
    a paradoxical twist to this story. He found that quantum processes near the surface
    of a black hole cause the hole to radiate a slight steady stream of particles,
    including particles of light. This radiation—now known as Hawking radiation—is
    too faint to be detected physically, even its existence is inherently problematic.[19]
    The reason is that if black holes radiate energy, they must shrink and eventually
    disappear. What happens to the huge amount of information hidden when a black
    hole radiates its last ounce of mass? Stephen''s calculations indicated that this
    information would be lost forever. Black holes, he argued, are the ultimate trash
    cans However, this scenario contradicts a basic principle of quantum theory that
    dictates that physical processes can transform and scramble information but never
    irreversibly obliterate information. Once again we arrive at a paradox: Quantum
    processes cause black holes to radiate and lose information, yet quantum theory
    says this is impossible.


    The paradoxes to do with the life cycle of black holes and with our place in the
    multiverse became two of the most vexing and hotly debated puzzles of the last
    decades. They are concerned with the nature and fate of information in physics
    and thus strike at the heart of the question as to what physical theories are
    ultimately about. Both paradoxes emerge in the context of so-called semiclassical
    gravity, a theoretical description of gravity pioneered by Stephen and his Cambridge
    bang in the mid-1970s, based on an amalgam of classical and quantum thinking.
    The paradoxes come about when one applies such semiclassical thinking over exceedingly
    long timescales (in the case of black holes) or out to exceedingly large distances
    (in the case of the multiverse). Together they embody the profound difficulties
    that arise when we try to get the two pillars of twentieth-century physics, relativity
    and quantum theory, to work'
