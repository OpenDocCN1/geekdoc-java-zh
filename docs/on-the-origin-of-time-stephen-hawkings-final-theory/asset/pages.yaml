  md: 'This is a strange state of affairs. Hawking’s singularity theorem predicts
    that the universe had a beginning, but it doesn’t say how it began, let alone
    why it emerged from its explosive genesis with a nearly uniform CMB and so many
    other biophilic properties. Even more, it seems to place all questions about the
    ultimate origin of the universe and its design outside science, as if it is outsourcing
    these to Eddington’s supernatural agency. It isn’t necessary to philosophize about
    it—the theory of relativity predicts its own downfall. The big bang in Hawking’s
    PhD is an event without explanation, because the singularity at the bottom of
    it signals the breakdown of time, space, and causality altogether. As the great
    Wheeler put it, “The existence of spacetime singularities represents an end to
    the principle of sufficient causation and so to the predictability gained by science.”[5]


    How can this be? How can physics lead to a violation of itself—to no physics?
    To untangle this we must take a closer look at what physicists actually mean when
    they say they predict what will happen.


    EVERYCE GALILEO and Newton, physics has been based on a dualism of some sort,
    in that it relied on a fundamental separation between two distinct sources of
    information. First, there are the laws of evolution, mathematical equations that
    prescribe how physical systems change in time from one state to another. Second,
    there are boundary conditions, a concise description of the state of a system
    at a given moment in time. The laws of evolution that state and evolve it, either
    backward or forward in time, to determine what the system was like at an earlier
    moment or what it will be at a later moment. It is the combination of the laws
    of evolution and the boundary conditions that yields the framework for prediction
    on which physics and cosmology pride themselves.


    For example, imagine you want to predict and when the next solar eclipse will
    occur. To do so we can apply Newton’s laws of motion and gravity to describe the
    future trajectories of Earth and the moon. To put'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'these laws to use, however, you must first specify the position and velocity
    of Earth and the moon relative to the sun (and Jupiter) at one particular moment
    in time. These data are boundary conditions. They describe the state of these
    two celestial bodies in the solar system at one specific moment. No one expects
    Newton''s laws to explain why these positions are what they are at that moment.
    We measure what they are. With this information at hand, we then solve Newton''s
    equations to determine their positions at future times, in order to predict when
    and where solar eclipses will occur, or at earlier times, toretro documented eclipses.


    This example is representative of the way in which predictions come about in general.
    Physicists assume that evolution is governed by universal laws of nature—laws
    that we seek to discover. But boundary conditions contain information specific
    to one or another system, so they aren''t considered part of the laws. Boundary
    conditions in some sense serve to delineate the particular questions we ask of
    the physical laws. In effect, a given law like Newton''s is constructed in such
    a way that it can accommodate a wide range of different boundary conditions. This
    gives the equations their universal character and the flexibility they need to
    account for a broad variety of phenomena. So the laws of physics are a bit like
    the rules of chess. However important those rules are, they tell you only so much
    about any particular game will play out.


    But is this separation between law-like dynamics and ad hoc boundary conditions
    a fundamental property of nature? This distinction is of course entirely natural
    and appropriate in laboratory situations where there is a sharp difference between
    the experimental arrangement that one controls—the boundary conditions—and the
    laws we seek to test by running the experiment. However, this distinction becoming
    a major embarrassment in cosmology, when we embed our experiments and experimenters,
    our planet, the stars, and the galaxies, in the much larger evolution of the universe
    as a whole. When we do this, boundary conditions on the original experiment are
    subsumed into the law-like evolution of the larger system, with boundary conditions
    on the latter. Returning to the example of a solar eclipse, a holistic cosmologist
    would say that the'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'velocities and positions of the planets at any given moment—the original boundary
    conditions—follow from their past histories, and that our planetary system itself
    is the outcome of the formation history of the solar system, which in turn arose
    from the condensation of remnants of prior stellar systems, whose seeds ultimately
    out of minute density variations in the primeval universe that came from...what?


    When we arrive at the beginning we reach a paradox. What determines the ultimate
    boundary conditions at the origin of the universe? Clearly these are not up to
    us to choose, and we can''t try different conditions to see what kind of universes
    they produce. That is, the beginning of the universe poses a problem of boundary
    conditions that we do not control. Instead, very interestingly, the conditions
    at the big bang would appear to be dragged into the laws we seek to understand.
    That dualism in physics holds that boundary conditions are not part of the physical
    laws. What''s more, Stephen''s singularity theorem that spacetime and all known
