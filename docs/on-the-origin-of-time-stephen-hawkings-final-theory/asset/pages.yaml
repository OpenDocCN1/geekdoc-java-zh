    in a bigger space is only there to provide some comfort for the eye. Nineteenth-century
    mathematicians had already shown that all geometrical properties of curved surfaces—things
    like straight lines and angles and so—can be defined intrinsically, without referring
    to anything above or below the surface.[127]


