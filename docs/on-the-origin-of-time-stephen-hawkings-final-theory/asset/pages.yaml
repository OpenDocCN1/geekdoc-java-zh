- pgno: 206
  md: 'set of physical properties that are superbly suited to bring forth life. Whatever
    may or may not be happening in distant, causally disconnected universes should
    be entirely irrelevant when we attempt to understand the design of this one.


    —


    THE PITFALLS of reasoning on the basis of typicality are all too familiar from
    other historical sciences, from biological evolution to human history. Had Darwin
    assumed that we were typical, he would have considered an ensemble of earthlike
    planets with a variety of trees of life, all containing a Homo sapiens branch.
    He would have then attempted to predict we—this particular instance of Homo sapiens
    on planet Earth—should be part of the most common tree of life among all possible
    trees with Homo sapiens branches. That is, he would have categorically ignored
    his key insight that each branching involves a game of chance, and that the tree
    of life as we know it encapsulates the convoluted history of trillions of accidental
    twists and turns, over billions of years of biological experimentation, rather
    than an external act of random selection.


    The sheer vastness of the possibilities in biological evolution means that any
    kind of causal deterministic explanation of why we have this particular tree of
    life is doomed to fail. This is why biologists work post facto, describing how
    a given outcome leads back to a specific sequence of branchings. If anything,
    typicality can be a guiding principle to explain a few of the most general structural
    properties of the biosphere.


    String theory connects an equally vast space of possible pathways when it comes
    to forging effective physical laws in the wake of the big bang, a quantum process
    involving random jumps and a series of symmetry-breaking transitions. As consequence,
    a given outcome needs to be neither typical nor a priori likely.[101] Unlike modern
    biology, anthropic multiverse cosmology defies this randomness and clings to a
    fundamentally deterministic explanatory scheme that puts “why” above “how.” The
    case of biology suggests, though, that this offers a flawed basis'
