  img_proc: true
- pgno: 277
  md: 'The second side of Maldacena’s duality involves quantum theories of particles
    much like the Standard Model. These are quantum field theories, or QFTs, because
    they describe particles and forces as localized excitations of spread-out fields.
    The QFTs in Maldacena’s duality are similar to quantum chromodynamics, the part
    of the Standard Model that describes the strong nuclear force.


    The surprising holographic nature of this duality comes about because the quantum
    fields on the particle side don’t penetrate the interior of the AdS snow globe
    but can be thought of as being confined to the boundary surface that surrounds
    it. So the QFT apparently operates in a spacetime with one dimension less. If
    the AdS space has spacetime dimensions, then the QFT lives in three dimensions.
    It lacks the interior depth of AdS, the curved dimension that runs perpendicular
    to its boundary surface. The QFT is also gravity-free. On the boundary of AdS
    space there are no gravitational waves, black holes, or anything resembling a
    gravitational attraction. Gravity does not exist in a QFT of particles.


    Or so we thought. The crux of Maldacena’s audacious claim was that these two theories,
    however different they might seem, were, in fact, disguised versions of each other.
    Maldacena argued that (super)gravity theory in AdS and QFT on the boundary were
    in some sense equivalent. This is holography in action! For it would mean that
    everything there is to know about strings and gravity in a four-dimensional AdS
    universe can be encrypted in quantum interactions of ordinary particles and fields
    lying entirely in the three-dimensional boundary surface. The surface world would
    function as kind of hologram, as a blueprint of the interior AdS world that contains
    all the information but differs profoundly in appearances. It is almost as if
    you could learn everything about the interior of an orange by meticulously analyzing
    its skin.'
