    This leads us to a remarkable observation: In the broadest sense we have made
    surprisingly little progress since the modern scientific revolution to fathom
    the origin of the apparent design that underpins physical reality. Yes, we now
    understand the universe’s expansion history in exquisite detail, and we understand
    how gravity shapes the large-scale universe, and we understand the quantum behavior
    of matter down to scales much smaller than the size of a proton. But that detailed
    physical understanding, of enormous significance in its own right, has only served
    to accentuate the deeper-lying riddle of design. The universe’s biophilic character
    continues to create confusion, dividing the scientific community and the broader
    public alike. A deep conceptual chasm continues to separate our understanding
    of the living world and of the underlying physical conditions that make life possible
    at all. Why did the mathematical laws laid out at the big bang turn out to be
    fit for life? What should we make of the fact that they did? The rift separating
    the animate and inanimate worlds appears deeper than ever.


    PHYSICISTS SAY THE multiverse saddles us with a paradox. Multiverse cosmology
    builds on cosmic inflation, the idea that the universe underwent a short burst
    of rapid expansion in its earliest stages. Inflationary theory has a wealth of
    observational support for some time but has the inconvenient tendency to generate
    not one but great many universes. And because it doesn''t say which one we should
    be in—it lacks this information—the theory loses much of its ability to predict
    what we should see. This is a paradox. On the one hand, our best theory of the
    early universe suggests we live in a multiverse. At the same time, the multiverse
