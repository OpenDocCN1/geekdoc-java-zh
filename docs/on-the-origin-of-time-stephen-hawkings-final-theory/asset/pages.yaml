  md: '# CHAPTER 6


    # NO QUESTION? NO HISTORY!


    We had this old idea, that there was a universe out there, and here is man, the
    observer, safely protected from the universe by a six-inch slab of plate glass.
    Now we learn from the quantum world that even to observe a minuscule object as
