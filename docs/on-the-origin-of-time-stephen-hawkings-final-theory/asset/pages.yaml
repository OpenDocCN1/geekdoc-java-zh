    DESPITE THEIR BEAUTY and grandeur, however, biological laws are often regarded
    a tad less fundamental than their counterparts in physics. For while emergent-like
    patterns may be enduring, no one thinks of them as timeless truths. Moreover,
    determinism and predictability have played much less of a principled role in biology.
    Newton''s laws of motion are deterministic; they allow physicists to predict where
    objects will be at any moment in the future, based on their locations and velocities
    today (or at any moment in the past). In Darwin''s scheme, the randomness of mutations
    in living systems means nearly nothing can be determined in advance—not even the
    laws that one day emerge. This lack of determinism imbues biology with a retrospective
    element: One can understand evolution only by looking backward in time. Darwin''s
    theory doesn''t detail the actual evolutionary path from earliest life to today''s
    diverse and complex. It doesn''t predict the tree of life, since that wasn''t—and
    couldn''t have been—its purpose. Instead, Darwin''s genius lay in his delineation
    of general organizational principles, while leaving the specific historic record
    in phylogenetics and paleontology. That is, Darwin''s theory of evolution recognizes
    that life as we know it is the joint product of law-like regularities and a particular
    history. Its utility lies in the fact that it'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'enables scientists to retrospectively construct the tree of life, starting
    from our observations of the biosphere today and the hypothesis of a common ancestry.


    Darwin’s finches provide a case in point. Had Darwin reasoned forward in time
    and attempted to predict the various finch species on the Galápagos Islands, starting
    from the chemical environment on the prebiotic Earth, would have failed completely.
    The existence of finches, or of any other species roaming our planet, cannot be
    deduced solely on the basis of the laws of physics and chemistry, because every
    branching throughout biological evolution involves a game of chance. Some chance
    outcomes are favored by environmental circumstances and get frozen in, often with
    dramatic consequences downstream. Such frozen accidents help to determine the
    character of the subsequent evolution and may even take the form of new biological
    laws. The birth of the Mendelian laws of inheritance, for example, rests on the
    outcome of the collective branchings that led to sexually reproducing organisms
    in the first place.


    In figure 5, I depict a modern version of the phylogenetic tree of life based
