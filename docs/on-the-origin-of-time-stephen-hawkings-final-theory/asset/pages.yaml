    nearly a hundred such gravity waves had been detected, revealing that black holes
    are an integral part of the cosmic ecosystem indeed, just as Penrose predicted.


    The observational discovery of gravitational waves confirms the last of the great
    predictions enshrined in Einstein’s general relativity. In many ways, it marks
    a coming of age of the theory, for it signals as much a new beginning as the closure
    of an era. What started out as an abstract mathematical equation describing space,
    time, and gravity has developed, with the observation of gravitational waves,
    into an entirely new way of looking at the universe. More than four centuries
    after Galileo first pointed a telescope to the stars, it is as if astronomers
    have grown a new sense that they can use to unlock the universe’s dark side, dominated
    by black holes, dark matter, and dark energy. The gravitational-wave observatories
    that are currently operational across the globe explore the universe by sensing
    the geometry of spacetime itself, capturing minute vibrations of the field that
    Einstein birthed more a century ago.


