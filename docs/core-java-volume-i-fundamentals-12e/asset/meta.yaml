  - 7.3 使用异常的技巧
- - '####'
  - 使用异常的 3 个技巧
- - '####'
  - 1. 异常处理不替代简单的测试
- - '####'
  - 2. 不要对异常进行微管理
- - '####'
  - 3. 善用异常的层次结构。
- - '####'
  - 4. 不要静息异常。
- - '####'
  - 5. 当你检测到错误时，“严厉”比纵容更有效。
- - '####'
  - 6. 传播异常并不是可耻的标志。
- - '####'
  - 7. 使用标准方法报告空指针和越界异常。
- - '####'
  - 8. 不要向终端用户显示堆栈跟踪。
