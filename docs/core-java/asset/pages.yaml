  md: '# Introduction to Java Languages


    AutoBoxing and UnBoxing in Java

    From Java 5 two new features were added Autoboxing and Unboxing where Autoboxing
    automates the

    wrapping of primitive data types into the wrapper class for that particular data
    type when an object

    instead of primitive type is needed, Unboxing does the exact opposite that is
    gets the value out of a

    wrapped object automatically.


    As example:

    Before this features autoboxing was added wrapping a primitive int to its corresponding
    wrapper class

    Integer would have looked like –


    ```

    int num = 25;

    ```


    ```

    Integer i = Integer.valueOf(num);

    ```


    Now with this feature you can directly assign value to a wrapper class –


    ```

    Integer i = 25;

    ```


    Now valueOf() method call will be done by the compiler behind the scene.

    Same way for auto boxing if unboxing: a wrapped object previously meant calling
    the method

    intValue(), longValue(), doubleValue() based on the type


    ```

    Integer i = new Integer(10);

    int num = i.intValue();

    ```


    Now it can be done directly –


    ```

    Integer i = new Integer(10);

    int num = 1;

    ```


    For float type


    ```

    Float f = new Float(56.78);

    float fNum = f;

    ```'
