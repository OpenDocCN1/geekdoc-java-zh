  md: '# Multithreading


    (a) Declare the class as it is implementing Runnable interface.


    (b) Implement run () method. [public void run () { } ]


    (c) Create thread by defining an object instantiated from this “runnable” class
    as the target of the thread.


    (d) Call the thread’s start () to run the thread.


    (e) The run can create other methods, use other classes and declare variable,
    just like the main thread. The only difference is that run () establishes the
    entry point for another, concurrent thread of execution within your program. The
    thread will end when run () returns.


    3. Object: wait(), notify() and notifyAll() are methods of this class used for
    threading.


    A new thread may be created by following code:


    ```

    Thread t = new Thread(() -> {System.out.println("Hi, How are you? Thread");};

    t.start();

    ```


    This small piece of code creates and starts a new thread, which executes the body
    of the lambda expression and executes. In Java 7, code looks as follows:


    ```

    Thread t = new Thread();

    t.start();

    System.out.println("Hi, How are you? Thread");

    ```


    # 8.3 LIFECYCLE


    Every operating system has a view of threads that can differ in the details. But
    in most cases broadly similarly at a high level. Java tries to abstract these
    details away, and has an enum called Thread.State—wrappers over the operating
    system’s view of the thread’s state. The values of Thread State provide over the
    lifecycle of a thread:


    +   1. New Born State: When we create a thread object, the thread is born & it
    is said to be new born state, but still this thread is not scheduled for running.
    When it is scheduled by operating system for running scheduling will be done by
    start method. Thread killing will be done by stop method, when thread is started
    until it goes into the next state called “Runnable state”

    2. Runnable state: This means the thread is ready for execution & is waiting for
    the availability of processor. The threads which are in will be scheduled for
    the cpu execution by using “Round Algorithm” or “First come sert”. By applying
    this scheduling it is possible that two may have equal priority. The current thread
    is giving the permission to other thread, having other priority for execution
    that can be done by“yield method"

    3. Running State: Running state means the processor has given tie to the thread
    for execution and this thread will be executed until it is interrupted by higher
    priority thread. The running thread can be suspended for the timing by using suspend
    method. It can be continued by resume method. The running state can sleep specified
    time, that means the delay can be introduced by using sleep method and again it
    can move to Runnable state automatically after completion of specified time in
    a sleep method.'
