  md: "# How Labeled Continue Statement Works?\n\n```\nlabel:\nwhile (testexpression)\n\
    {\n  // codes\n  for(testexpression)\n  {\n    // codes\n    if(condition for\
    \ continue)\n    {\n      Continue label;\n    }\n    //codes\n  }\n  //codes\n\
    }\n```\n\nThere is another form of continue statement, labeled form, that can\
    \ be used to skip the execution of statement(s) that lies inside the outer loop.\n\
    \n# The Continue Statement, Without a Label\n\nThe continue statement, when used\
    \ in association with loops in Java, skips the remaining statements in the loop\
    \ body and proceeds to the next iteration of the loop. This is in contrast to\
    \ the break statements, where it escapes from the immediate loop. The continue\
    \ statement simple resumes the loop beginning with the next iteration.\n\nExample:\n\
    \n```\nclass Test\n{\n  public static void main(String[] args)\n  {\n    for (int\
    \ i = 1; i <= 10; ++i)\n    {\n      if (i > 4 && i < 9) {\n        continue;\n\
    \      }\n      System.out.println(i);\n    }\n  }\n}\n```"
