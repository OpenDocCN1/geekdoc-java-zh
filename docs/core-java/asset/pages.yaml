  md: '# 5.1 INTRODUCTION TO INHERITANCE


    Inheritance is a concept of reusability. It is also called derivation. Reusability
    is the important feature of OOP''s. Reusability is a technique where we can reuse
    the class which is already tested and debugged many times.


    This technique is used for creating new class from old class and reusing the properties
    of existing one.


    The mechanism of deriving new class from old class is known as inheritance. The
    old class is referred as base class and the new class is referred as derived class.
    The base class is also called as super class and the derived class is also called
    as sub-class. It is also known as parent-child relationship. The derived class
    can access properties and method s of base class during any type of inheritance
    as well as derived class has its own properties and methods.


    # Java Inheritance Example


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_126_0.png)


    # Types of Inheritance


    +   - **Single Inheritance:** A derived class with only one base class is called
    single inheritance. With this one derived class can be possible with one base
    class.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_126_1.png)


    +   - **Multilevel Inheritance:** The mechanism of deriving a class from another
    derived class is known as Multilevel Inheritance.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '![](img/01afc7ce7fa0f83809e0efcce4ad0106_127_0.png)


    In multilevel first class is derived from base class and again from derived class
    another class will be derived.


    +   3. **Multiple Inherances**: A derived class with several base classes, is
    called multiple inheritance.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_127_1.png)


    This type of inheritance can have one or more base classes from that we can drive
    only only derived class is called as Multiple Inheritance. This type of Inheritance
    is not directly available in Java, It can be implemented by using interface concept.


    +   4. **Hierarchical Inheritance**: The properties of one class may be inherited
    by more than one class is called hierarchical Inheritance. In this type of inheritance
    one base class, number of classes can be derived is known as hierarchical Inheritance.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_127_2.png)


    +   5. **Hybrid Inheritance**: It is a combination of Multilevel and Multiple
    Inheritance as well as it can be combination of hierarchical and multiple inheritances
    hence it is combination of different types of inheritance.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_127_3.png)'
