  md: '# 1.2.23 Repetition (Loops)


    While Loops


    A loop is a statement of code that does something over and again until the logical
    expression of the loop evaluates to false. It is simply a way of repeating code
    over and again until some particular value is reached. It can also be an effective
    way of making sure the user is inputting the correct type of input (data validation).


    A loop is different from an if statement that if the logical expression is true,
    the still will be executed and go back to check the logical expression again.
    ..., and again, until the logical expression becomes false.


    One thing to avoid writing code that produces an infinite loop, which is a loop
    that never stops until you press ctrl-break on your keyboard. In order to avoid
    infinite loops, you need a statement(s) inside the body of the loop that changes
    some part of the logical expression. We will talk about three types of loops:
    while, do, for.


    The form of a while loop is as follows:


    ```

    while ( logical expression )

    stnt;

    ```


    Example 1:


    ```

    int x = 7;

    while (x > 0)

    {

    System.out.println("x is " +x);

    x--;

    }

    ```


