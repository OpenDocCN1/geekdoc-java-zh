  md: '# Core Java


    If you construct a scroll bar by using one of the first two constructors, then
    you need to set its parameters by using setValues( ), shown here, before it can
    be used:


    ```

    void setValues(int initialValue, int thumbSize, int min, int max)

    ```


    The parameters have the same meaning as they have in the third constructor just
    described.


    To obtain the value of the scroll bar, call getValue( ). It returns the current
    setting. To set the current value, call setValue().


    These methods are as follows:


    +   1. getValue()

    2. setValue(int newValue)


    Here, newValue specifies the new value for the scroll bar. When you set a value,
    the slider box inside the scroll bar will be positioned to reflect the new value.
    You can also retrieve the minimum and maximum values via getMinimum() and getMaximum(),
    and shown here:


    +   1. getMinimum()

    2. getMaximum()


    They return the requested quantity.


    By default, the increment is added or subtracted from the scroll bar each time
    it is scrolled up or down line. You can change this value by calling setUnitIncrement().
    By default, page-up and page-down increments are 10. You can change this value
    by calling setBlockIncrement().


    These methods are shown here:


    +   1. setUnitIncrement(intNewIncr)

    2. setBlockIncrement(intNewIncr)


    # Handling Scroll Bars


    To process scroll events, you need to implement the AdjustmentListener interface.
    Each time a user interacts with a scroll bar, an AdjustmentEvent object is generated.
    Its getAdType() method can be used to determine the type of the adjustment.


