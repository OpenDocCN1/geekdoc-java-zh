  md: '# 1. String Literal


    Java String literal is created by using double quotes. For Example:


    +   1. String s="welcome";


    Each time you create a literal, the JVM checks the string constant pool first.
    If the string already exists in the pool, a reference to the pooled instance is
    returned. If string doesn''t exist in the pool, a new string is created and placed
    in the pool. For example:


    +   (a) String s1="Welcome"

    (b) String s2="Welcome";//will not create new instance


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_51_0.png)


    In the above example only one object will be created. Firstly JVM will not find
    any string object with the value "Welcome" in string constant pool, so it will
    create a new object. After that it will find the string with the value "Welcome"
    in the pool, it will not create new object but return the reference to the same
    instance.


    > Note: String objects are stored in a special memory area known as string constant
    pool.


    # Why Java uses Concept of String Literal?


    To make Java memory more efficient (because no new objects are created if it already
    exists in constant pool).


    # 2. By New Keyword


    +   (a) String s=new String("Welcome");//creates two objects and one reference
    variable


    In such case, JVM will create a new string object in normal(non pool) heap memory
    and the literal "Welcome" will be placed in the string constant pool. The variable
    s will refer to the object in heap(non pool).


