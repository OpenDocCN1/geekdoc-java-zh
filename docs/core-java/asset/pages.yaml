  md: '# 5.8 DIFFERENCE BETWEEN ABSTRACT CLASS AND INTERFACE


    Abstract class and interface both are used to achieve abstraction where we can
    declare the abstract methods. Abstract class and interface both can''t be instantiated.


    But there are many differences between abstract class and interface that are given
    below.


    | Abstract class | Interface |

    | --- | --- |

    | Abstract class can have and non-abstract methods. | Interface can have only
    abstract methods. Since Java 8, it can have default and static methods also. |

    | Abstract class doesn''t support multiple inheritance. | Interface supports multiple
    inheritance. |

    | Abstract class can have final, non-final, static and non-static variables. |
    Interface has only static and final variables. |

    | Abstract class can provide the implementation of interface. | Interface can''t
    provide the implementation of abstract class. |

    | The abstract keyword is used to declare abstract class. | The interface keyword
    is used to declare interface. |


    # 5.9 RELATIONSHIP BETWEEN INTERFACE AND CLASS


    As shown in the figure given below, a class extends another class, an interface
    extends another interface but a class implements an interface.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_143_0.png)


    # 5.10 ACHIEVING MULTIPLE INHERITANCE USING INTERFACE


    Multiple Inheritance in Java by Interface


    If a class implements multiple interfaces, or an interface extends multiple interfaces
    i.e. known as multiple inheritance.'
