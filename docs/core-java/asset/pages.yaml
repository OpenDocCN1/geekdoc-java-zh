  md: '# Exception Handling


    +   * Compile time errors: Errors which occur due to syntax or format is called
    compile errors. These errors are detected by java compiler at compilation. Desk
    checking is solution for compile-time errors.


    Normally the Program Consist of Errors and Bugs. The Most Common Type of Bugs
    Are:


    +   (i) Logical error.

    (ii) Syntactic error.


    Logical error is due to wrong solution or wrong logic and syntactic error occurs
    due to poor understanding of language, that means syntax mistake. We can detect
    these errors and then debug and accordingly provide error description for those
    errors and these are called as exceptions.


    Exceptions are run-time condition or error that a program may encounter while
    executing. Errors like division by 0 or access to an array outside of its bounds
    or running out of memory or running out of disk space.


    There are two types of exception handling:


    +   (a) Synchronous.

    (b) Asynchronous.


    A synchronous exceptions out of range index and overflow error can occur. In Asynchronous
    the events which are managed by the control like keyboard interrupts or sectors
    in the disc and hardware failure are called as asynchronous exceptions.


    The following task can be performed for exception:


    +   1. Find the problem (hit the exception)

    2. Inform that an error has occurred (throw the exception)

    3. Receive the error information (catch the exception)

    4. Take corrective action (handle the exception)


