  md: '# Event Handling


    +   3. The advantage of this design is that the application logic that processes
    events is cleanly separated from the user interface logic that generates these
    events.


    +   4. A user interface element is able to delegate the processing of an event
    to a separate piece of code.


    +   5. In the delegation event model, listeners must register with a source to
    receive an event notification.


    +   6. This provides an important benefit: notifications are sent only to listeners
    that want to receive them.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_228_0.png)


    # Events


    In the delegation model, an event is an object that describes a change in a source.
    It can be generated as a consequence of a cause interacting with the elements
    in a graphical user interface. Some of the activities that cause events to be
    generated by pressing a button, entering a character via the keyboard, selecting
    an item in a list, and clicking the mouse. Many other user operations could also
    be cited as examples. Events may also occur that are not directly caused by interactions
    with a user interface.


    # Event Sources


    A source is an object that generates an event. This occurs when the internal state
    of object changes in some way. Sources may generate more than one type of event.
    A source must register listeners in order for the listeners to receive notifications
    about a specific type of event. Each type of event has its own registration method.
    Here is the general form:


    ```

    public void addEventListener(Type Listener el)

    ```


    Here, Type is the name of the event and el is a reference to the event listener.'
