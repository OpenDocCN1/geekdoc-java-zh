    \ language.\");\n}\n}\n```\n\n# 4.20 GARBAGE COLLECTION\n\nIn Java destruction\
    \ of object from memory is done automatically by the JVM. When there is no reference\
    \ to an object, then that object is assumed to be no longer needed and the memory\
    \ occupied by the object is released. This technique is called Garbage Collection.\
    \ This is accomplished by the JVM:\nIn C/C++, programmer is responsible for creation\
    \ and destruction of objects. Usually programmer deructions of useless objects.\
    \ Due to this negligence, at certain point, for creation of new objects, sufficient\
    \ memory may not be available and entire program will terminate causing OutMemoryErrors.\n\
    But in Java, programmer need not to care for all those objects which are no longer\
    \ in use. Garbage collector destroys these objects.\nGarbage collector is best\
    \ example of Daemon thread that is always running in background.\nMain objective\
    \ of Garbage Collection is to free memory by destroying unreachable objects.\n\
    \nAdvantages of Garbage Collection\n\n+   1. Programmer doesn't need to worry\
    \ about dereferencing an object.\n2. It is done automatically by JVM.\n3. Increases\
    \ memory efficiency and decreases the chances for memory leak."
