  md: "Byte Streams 205\n\nFilterInputStream and FilterOutputStream do not perform\
    \ any filtering themselves; this is by their subclasses. To improve the performance\
    \ of these I/O streams, their subclasses BufferedInputStream and BufferedOutputStream\
    \ are used.\n\n# 10.12 BUFFERED BYTE STREAMS\n\n# BufferedInputStream\n\nThis\
    \ class is a subclass of the FilterInputStream that lets you read large amount\
    \ of data from a stream and store it in an internal buffer. When data is requested,\
    \ it is usually read from the buffer. This has the effect of improving the performance\
    \ of some input streams, especially for those that are bounded to slower sources\
    \ like a file or network connection.\n\nThe constructor of the BufferedInputStream\
    \ is written as:\n\n```\nBufferedInputStream(java.io.InputStream in);\n```\n\n\
    # BufferedOutputStream\n\nThis is a subclass of the BufferedOutputStream and a\
    \ buffered output stream that lets you write characters to a stream. A BufferedOutputStream\
    \ adds functionality to another stream. The data is first written into a buffer.\
    \ When the BufferedOutputStream is created, an internal buffer array is also created,\
    \ in which the bytes are stored.\n\nThe constructor of the BufferedOutputStream\
    \ is written as:\n\n```\nBufferedOutputStream(java.io.OutputStream out);\n```\n\
    \n# 10.13 SEQUENTIALINPUTSTREAM\n\nThe SequentialInputStream represents the concatenation\
    \ of multiple input streams. It starts with an ordered collection of input streams\
    \ and reads from the first until end of file is reached, then it reads from the\
    \ second, and so on, until the last input stream is reached.\n\nIt acts as a single\
    \ InputStream that represents the streams of other InputStreams in sequence. You\
