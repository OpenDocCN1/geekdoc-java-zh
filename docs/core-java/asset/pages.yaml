    An array is collection of similar/particular types of things/values etc. In programming
    and computer science array is a collection of similar type of elements that have
    contiguous memory location.


    From the Java virtual machine''s perspective, arrays and enumerated types ( or
    enums) are just classes. Many of the methods in Class may be used on them.


    Arrays of Objects


    +   1. An array is collection of similar data type.

    2. An array is a similar group of elements. All these elements will have same
    datatype.

    3. The storage of of array element will be in contiguous memory allocation

    4. All these elements of array share a common name, every element of an array
    is identified by index no. which is also called as "subscript". The complete set
    of values of arrays is referred as array.'
