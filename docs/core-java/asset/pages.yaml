  md: '# 9.3 TRY-CATCH-FINALLY


    An exception is an error or an unexpected event. The exception handler is a set
    of codes that executes when an exception occurs.

    Exception handling uses basically 3 blocks:


    +   (i) Try

    (ii) Throw

    (iii) Catch


    The try & catch blocks are written between open & closing braces ''{ }''. The
    try block is identified by try keyword having of statement between {and}. When
    the exception is detected by the try block, it is thrown using statement in try
    block.


    A catch block is defined by the keyword catch { } with block of statement. The
    catch block catches the exception through throw statement in try block and handles
    it appropriately. When the try throws an exception the program control leaves
    the try block and enter the catch block if the type of object thrown by the try
    block matches then only the catch block is executed for handling. If they do not
    match, the program is aborted using exception


    # Try


    The try has a block of code that has its exceptions or needs specific code following
    try block to handle exception (Catch). The purpose is to catch exception when
    try block of code terminates for anyreason.The termination of try block could
    be due to exception or break or continue or return statements.


    # Catch


    A try can be followed by zero or more catch clauses. Each catch clause contains
    specific code to handle various types of exceptions. Each catch clause is passed
    a single argument that specifies the type of exception. The argument to a catch
    clause must be of Throwable class or any of its subclass.


    When an exception is thrown, the JVM looks for a catch clause with same argument
    as type of exception object. The JVM invokes the first catch clause it finds.
    The code within a catch block should take necessary action to handle that exception.
    For example if the exception is java.io.FileNotFoundException user may be asked
    to check spelling for file name and again


    # Finally


    The finally block is used to clean up the code in try-catch block. There are various
    possibilities that can happen in a try block:


    +   1. If an exception occurs in the try block and there is an associated catch
    block to handle the exception, control first transfers to catch. Then it is transferred
    to finally block.

    2. In normal case (without any exception), control reaches the end of the try
    block and then to finally block. The finally block performs clean up, like closing
    any open file, myFunction.close().

    3. If control leaves try block because of return, break or continue statement,
    the finally block is executed before control transfers to its destination.'
