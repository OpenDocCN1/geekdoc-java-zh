    overloading and multiple inheritance is not there in java.


    And the most important reason is that Java not use the pointers.

    Memory management issues like malloc & to free the memory flush not required because
    it implements automatic garbage collection. It handles memory management thus
    prevents errors that arise due to improper memory usage.

    Syntax for writing a class is somewhat similar to C++.


