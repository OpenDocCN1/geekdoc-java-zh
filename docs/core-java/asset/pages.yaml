    # 8.2 THREAD CREATIONS


    The idea of a thread is a lightweight unit of execution—smaller than a process,
    but still

    cable of executing arbitrary Java code. The usual way that this is implemented
    for each thread to

    be a fully fitted unit of execution to the operating system but to belong to a
    process, with the address

    space of the process being shared between all threads comprising this process.
    This means that each

    thread can be scheduled independently and has its own stack and program counter
    bunch memory

    objects with other threads in the same process.


    Multithreading environment in java can be implemented in two ways as the diagram
    below shows:


    +   1. Create a class(user defined) which extends java built-in Thread class.


    +   2. Create a class (user defined) which implements java built-in Runnable interface.


