    # 4.6 INITIALIZING THE CLASS OBJECT AND ITS ATTRIBUTES


    In computer programming, initialization is the assignment of an initial value
    for a data object or variable. The manner in which initialization is performed
    depends on programming language, as well as storage class, etc., of an object
    to be initialized.


    Initialization is done either by statically embedding the value at compile time,
    or by assignment at run time. A section of code that performs such initialization
    is generally known as "initialization code" and may include other, one-time-only,
    functions such as opening files); in oriented programming, initialization code
    may be part of a constructor (class method) or an initializer (instance method).
    Setting a memory location to hexadecimal zeros is sometimes known as "clearing"
    and is performed by an exclusive or instruction (both operands specifying the
    same variable), at machine level, since it requires no additional memory access.


