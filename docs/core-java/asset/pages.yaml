  md: "# Core Java\n\nFor example, a single-type-import declaration import java.util.List;\
    \ puts the simple type name List in scope within a compilation unit so parameterized\
    \ types of the generic List<...> may be used. As another example, invocation of\
    \ a static method of a generic class needs only to give the (possibly qualified)\
    \ name of the generic class without any type arguments, because such type arguments\
    \ are irrelevant to a static method. (The method itself may be generic, and take\
    \ its own type arguments, but the type parameters of a static method are necessarily\
    \ unrelated to the type parameters of its generic class (§5.5.3)).\n\nBecause\
    \ of the occasional need to use a generic class or interface name without type\
    \ arguments, type names are distinct from type declaration specifiers. A type\
    \ name is always qualified by means of another name. In some cases, this is necessary\
    \ to access an inner class that is a member of another type parameterized.\n\n\
    Here is an example of where a type declaration is distinct from a type name:\n\
    \n```\nclass GenericOuter<T extends Comparable<>> {\n  public class Inner<S extends\
    \ Comparable<S>> {\n    T getT() { return null; }\n    S getS() { return null;\
