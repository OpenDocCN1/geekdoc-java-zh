  md: "# 3.6 LABELED STATEMENTS\n\nJava provides a feature not frequently used, called\
    \ the labeled statement. This feature is somewhat reminiscent of assembly language\
    \ programming in the sense that we can create a labeled block of code and refer\
    \ to the label when transferring program control to the end or beginning of the\
    \ labeled statement with break and continue, respectively.\n\nA program generally\
    \ is a linear flow of execution of consecutive statements. The programmer imposes\
    \ controls to redirect the flow in an appropriate direction based upon some logic.\
    \ There are different ways to control the flow of a program in Java. The statements\
    \ written using those keywords are called control statements. Control statements\
    \ belong to that and helps in alternating the flow of the program. These two keywords\
    \ can be used in association with a label or without a label. We mostly use them\
    \ without a label, but they also be used with a label. A brief overview of these\
    \ two control statements, we'll delve into its labeled part down the line.\n\n\
    # 3.7 LABELED BREAK STATEMENT\n\nThe break statement we have discussed till now\
    \ is unlabeled break statement, which terminates the innermost for, while do..while\
    \ and switch statement. There is another form of break statement, labeled break,\
    \ that can be used to terminate the outer loop.\n\n# How Label Break Statement\
    \ Works\n\n```\nlabel:\nfor(int,testexpression;update)\n// codes\nfor(int,testexpression;update)\n\
    // codes\nif(condition to break)\n{\nbreak label;\n}\n//codes\n}\n//codes\n\n\
    ```\n\nHere, label is an identifier. When break statement executes, it terminates\
    \ the labeled statement, and control of the program jumps to the statement immediately\
    \ following the labeled statement.\n\n```\nclass LBreak\n{\n  public static void\
    \ main(String[] args) {\n    first:\n    for(int i = 1; i<5; i++) {\n  }\n}\n\
    ```"
