  md: "iterations\n\n# Example:\n\nLabeled Statement, with a Label:\n\nThe Labeled\
    \ continue Continue:\n\nThe labeled continue statement is similar to the unlabelled\
    \ continue statement in the sense that both return the iteration. The difference\
    \ with the labeled continue statement is that it resumes operation from the target\
    \ label defined in the code. As soon as the labeled continue is encountered, it\
    \ skips the remaining statements from the statement’s body and any number of enclosing\
    \ loops and jumps to the next iteration of the enclosing labeled loop statements.\n\
    \n# Example 1:\n\n```\nclass LabeledContinue\n{\n    public static void main(String[]\
    \ args)\n    {\n        label:\n        for (int i = 1; i < 6; ++i)\n        {\n\
    \            for (int j = 1; j <= 5; ++j)\n            {\n                if (i\
    \ == 3 || j == 2)\n                    continue label;\n                System.out.println(\"\
    i=\"\" + i + \", j=\"\" + j);\\n            }\n        }\n    }\n}\n```\n\nWhen\
