  md: '# Types of Control Structures


    Java has four types of control structures:


    +   1. Sequential

    2. Selection (decision)

    3. Repetition (loops)

    4. Subprograms (functions).


    **1. Sequential:** Sequential means the program flow moves from one statement
    to the next, that statement moves to the next, and so on. It is the simplest form
    of structures, and it is not likely to use sequential when developing complex
    programs.


    **2. Selection (decision):** Selection makes decisions and perform commands according
    to the decision making. Selection includes "if statements" which are statements
    like "if this, then do that" and "if not this, then that". With "if statements",
    we can also include "nested if statements", which is called a "nested-if statement"
    inside other "if statements". Another form of selection is called "switch statement",
    which is very powerful for certain situations but not all. Switch statements focus
    on the value of a particular and can perform different and varied "cases" accordingly.


    **3. Repetition (Loops):** Repetition structures are used when something needs
    to be repeated a certain number of times through the use of "loops". A loop is
    a simple statement that completes iterations or cycles a certain value is reached
    and then execution moves to the next executable statement. For instance, if you
    were to ask the user to enter ten values to find the average of the numbers, you
    could write a loop that would letting the user to enter values until the numbers
    had been entered.


    **4. Subprograms (functions):** A function is a subgroup that performs a specific
    task and may return a value to the statement that called or invoked it. Functions
    programming very powerful once you develop a function to handle a particular situation,
    you can use that function for other programs. A function can call another function,
    which may call another function, and so on. It is a great way to organize your
    program and break your program down into logical steps.


    After a brief intro to the different types of control structures, it''s time to
    move on and find out how you can use each. We will skip over sequential structures
    since they are pretty much self-explanatory and elementary and move on selection
    structures. Read on more about selection structures and "if statements"....


    # 2.2 CONTROL FLOW STATEMENTS


    The statements inside a source are generally generated from top to bottom, in
    the order that they appear. Control flow statements, however, break up the flow
    of execution by decision making, looping, and branching, enabling your program
    to conditionally execute particular blocks of code.


    **Selection Statements:** When dealing with selection statements, there are generally
    three versions: one-way, two-way, and multi-way. Multi-way decision statements
    do some particular thing or they don''t. Two-way decision statements do one thing
    or do another. Multi-way decision statements can do many different things depending
    on the value of an expression.


    **One-Way Decisions:** One-way decisions are handled with an "if statement" and
    either do so particular thing or doing nothing at all. The decision is based on
    a logical expression which either'
