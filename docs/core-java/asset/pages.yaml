    \ the loop; expression2 is used to determine whether or not the loop will continue;\
    \ expression3 is evaluated at the end of each iteration cycle\n\n**Note 1:** Expression\
    \ 2 is tested before the stmt and expression3 are executed; it is possible that\
    \ the body of the loop is never executed or tested.\n**Note 2:** Any or all of\
    \ the 3 expressions in a for loop can be omitted, but if there is no initialization\
