    System.out.println("the value is " +c*c*b);

    }

    ```


    # Two-Way Decisions


    Two-way decisions are handled with "if/else statements" and either do particular
    thing or do other. Similar to one-way decisions, the decision is based on a logical
    expression. If the expression is true, stmtT will be executed; if the expression
    is false, stmtF will be executed. The form of a two-way decision is as follows:


    ```

    if (logical expression)

    stmtT;

    else

    stmtF;

    ```


    stmtT and stmtF can be simple or compound statements. Remember that compound statements
    are always enclosed with curly braces { }.


    # Multi-Way Decisions


    Multi-way decision statements involve "if/else if" statements, "nested ifs", or
    "switch" statements. They are all used to evaluate a logical expression that could
    have several possible values. "if/else if" statements are often used to choose
    between ranges of values.


    The form of a multi-way decision using "if/else if" statements is as follows:


    ```

    if (logical expression)

    stmtT1;

    else if (logical expression)

    stmtT2;

    ```'
