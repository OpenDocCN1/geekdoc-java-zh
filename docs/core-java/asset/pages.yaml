    # 1.3 HISTORY OF JAVA


    Java was originally developed by James Gosling at Sun Microsystems (which has
    since been acquired by Oracle Corporation) and released in 1995 as a core component
    of Sun Microsystems’ Java platform. The language derives much of its syntax from
    C and C++, but it has fewer lower-level facilities than either of them.


    Java Programming Language was written by James Gosling along with two other person
    ‘Mike Sheridan and Patrick Naughton’, while they were working at Sun Microsystems.
    Initially it was named oak Programming Language.


