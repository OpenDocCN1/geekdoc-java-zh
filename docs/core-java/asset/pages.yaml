    \n# Syntax Type 1:\n\n```\nVector vec = new Vector();\n```\n\nIt creates a default\
    \ vector with initial capacity of 10. It means the Vector will be re-sized when\
    \ the 11th elements are inserted into the Vector.\n\nNote: By default vector doubles\
