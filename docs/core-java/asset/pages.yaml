    # JMenuBar


    An implementation of a menu bar. You add JMenu objects to construct a menu. When
    the user selects a JMenu object, its associated JPopupMenu is displayed, allowing
    the user to select one of the JMenus on it.


    # JMenu


    An implementation of a menu -- a popup window containing JMenuItems that is displayed
    when the user selects an item in JMenu. In JMenus, a JMenu can also contain Separators.


    In essence, a menu is a button with an associated JPopupMenu. When the “button”
    is pressed, the JPopupMenu appears. If the “button” is on the JMenuBar, the menu
    is a top-level window. If the “button” is another menu item, the JPopupMenu is
    “pull-right” menu.'
