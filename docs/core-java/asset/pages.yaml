  md: "Iterations\n\n# 3.4 FOR LOOP\n\nfor loop provides a concise way of writing\
    \ the loop structure. Unlike a while loop, for a statement consumes the initialization,\
    \ condition and increment/decrement in one line thereby providing a shorter, easy\
    \ to debug structure of looping.\n\nSyntax:\n\n```\nfor (initialization condition;\
    \ testing condition;\n  increment/decrement)\n{\n  statement(s)\n}\n```\n\nHow\
    \ for Loop Works?\n\n+   1. The initialization expression is executed only once.\n\
    2. Then, the test expression is evaluated. Here, test expression is a boolean\
    \ expression.\n3. If the test expression is evaluated to true,\n    * Codes inside\
    \ the body of for loop is executed.\n    * Then the update expression is executed.\n\
    \    * Again, the test expression is evaluated.\n    * If the test expression\
    \ is true, codes inside the body of for loop is executed and update expression.\n\
    \    * This process goes on until the test expression is evaluated to false.\n\
    4. If the test expression is evaluated to false, for loop terminates.\n\n![](img/01afc7ce7fa0f83809e0efcce4ad0106_84_0.png)\n\
    \n+   1. Initialization condition: Here, we initialize the variable in use. It\
    \ marks the start of a for loop. An already declared variable can be used or a\
    \ variable can be declared, local to loop only.\n\n+   2. Testing Condition: It\
    \ is used for testing the exit condition for a loop. It must return a boolean\
    \ value. It is also an Entry Control Loop as the condition is checked prior to\
    \ the execution of the loop statements."
