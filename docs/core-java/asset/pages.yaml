  md: '# 4.5 INSTANTIATING OBJECTS FROM A CLASS (CREATING OBJECTS)


    An object is an instance of the class or a variables of a user define data type
    class. An object is the block of the memory that contain space to store all the
    instance variables creating objects is also referred as instantiating an object.


    Object are created by using new operator (memory allocation operator).The new
    operator creates an objects of the specified class and returns a reference to
    the objects created.


    +   Steps for creating objects are:


    +   Declare the objects or variables of type class to hold the objects reference
    .This variable does not define an objects. Instead it simply a variable that can
    refer to an object.


    **For example:**

    ```\Rectangle rec;

    ```


    +   Instantiate the object or declare variables of types class to the variables
    by using new operator. Or acquire any, physical copy of the objects and assign
    it to a variable by using new() operator. The new operator dynamically allocates
    memory for an objects. And returns a reference to it. This reference is more,
    or less, the address of the objects allocated by new operator .In Java, all class
    objects must be dynamically allocated. This provides safety because you cannot
    manipulate reference as pointer. Thus objects reference can not be manipulated
    and cannot point to an arbitrary memory location.


    **For example:**

    ```

    Rec=new Rectangle\();

    ```


    The variable Rec is now an objects of the class rectangle, as show in following
    figure:

    Rectangle Rec = new Rectangle();

    The method Rectangle\() is a default constructor of the class

    Assigning Objects Reference Variable:


    +   One objects reference can be assigned to another reference variable, then
    the copy of objects is not created but the copy of reference is made.

    Any number of objects can be created. Each object has its own copy of instance
    variable of its class. It means that any change to the variable of one objects
    has no effects on another variable. It is also possible to create reference to
    the same objects, as show above in figure.


    Rectangle R1 = new Rectangles();

    Rectangle R2 = R1;


