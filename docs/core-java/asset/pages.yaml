    the corresponding statement is executed; if the logical expression evaluates to
    false, control goes to the next executable statement. The form of a one-way decision
    statement is as follows:


    ```

    if (logical expression)

    ```


    The statement can be simple or compound statement. Simple involves 1 single statement.
    Component involves 1 or more statements enclosed with curly braces { }. A compound
    statement is called a block statement.


    Example 1: simple statement


    ```

    int c = 3;

