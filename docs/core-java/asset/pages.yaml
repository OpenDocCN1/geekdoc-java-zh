    # 11.1 EVENT DELEGATION MODEL


    The Delegation Event Model

    The modern approach to handling events is based on the delegation event model,
    which defines standard and consistent mechanisms to generate and process events.


    Its concept is quite simple:


    +   1. Source generates an event and sends it to one or more listeners.

    2. The listener simply waits until it receives an event. Once received, the listener
    processes the event and then returns.'
