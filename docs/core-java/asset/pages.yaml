  md: '# Core Java


    (c) Abstraction permits the programmer to look at something without being concerned
    with its internal details.


    (d) Abstraction in structure program shows the task performed by the function,
    but it hides from the client how function executes internally and how task is
    performed. This is called functional abstraction.


    (e) This insulation of the data from direct access by the program is called data
    hiding or information hiding.


    (f) Classes uses the concept of data abstraction are known as Abstract Data Types
    (ADT).


    (g) Simple object may have different properties or attributes like its essential
    features are colour, cost, balance or in but but essential features are type of
    ink, raw material used for plastic of pen.


    (h) Encapsulating data/information hiding feature allows limited visibility to
    the class users. Access specifiers are private, protected public in C++ are used
    to implement data hiding.


    (i) Abstraction helps in managing the complexity of the software.


    # 4. Data Encapsulation:


    +   (a) The internal data of a class i.e. members and member functions are first
    separated from outside world and then they are put in a class encapsulated


    +   (b) Encapsulation groups all pieces of object into one packet.


    +   (c) Encapsulated data is not accessible outside the world. It can be accessed
    only by member functions which are defined within a class.


    +   (d) This insulation of the data from direct access by the program is called
    data hiding or information hiding.


    +   (e) All the essential properties of the objects are encapsulated in a class.
    The attributes are called as data members to hold information. The functions that
    operate on these data are called methods or member functions.


    # 5. Inheritance:


    +   (a) Inheritance is the process of creating new classes, called classes, derived
    classes, from existing classes. These classes are often called base classes.


    +   (b) The derived class inherits all the properties and methods of the base
    class and can add new features, properties and methods of its own, based on requirement.
    By adding these refinements to the base class remain unchanged.


    +   (c) Inheritance is the process by which one class acquires the properties
    of objects of another class.


    +   (d) C++ allows a programmer to create hierarchical classification i.e., it
    supports parent-child relationship.


    +   (e) The parent class is a base class called super class and the child class
    is also called as derived class or sub class.


    +   (f) The concept of inheritance provides the idea of reusability. This means
    we can reuse existing classes many times and can add additional features to an
    existing class with modifying it. Reusability concept saves lot of money and time.
    Reusability code helps in case of distributing class libraries. Reusability increases
    program reliability.


    +   (g) Inheritance is similar to inheriting characteristics from our parents.'
