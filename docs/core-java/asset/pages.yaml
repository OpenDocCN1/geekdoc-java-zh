  md: '# 10.11 FILTERED BYTE STREAMS


    As mentioned earlier, the **InputStream and OutputStream** classes are used for
    reading and writing to byte streams, respectively. Data can be used for transforming
    and manipulating using Filter Streams.


    Like I/O streams, **Filter streams** are also used to manipulate data reading
    from an underlying stream. Apart from this, it allows the user to make a chain
    using multiple input stream so that, the operations that are be applied on this
    chain, may create a combined effects on several filters. By using these streams,
    there is no need to convert the data from **byte** to **char** while writing to
    a file. These are the more powerful streams than the others of Java.


    The class hierarchy of the Filter streams derived from I/O streams can be shown
    as:


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_209_0.png)


    There are two streams, that are derived from the I/O stream class:


    +   * FilterInputStream.

    * FilterOutputStream.


    # FilterInputStream:


    FilterInputStream is the base class for all the input stream filters and is obtained
    from the InputStream class. It overrides all the methods of the InputStream class
    required to filter data. These methods perform some sort of filtering operations
    on the data and cannot be instantiated directly. It provides the additional and
    chaining functionality for the multiple input streams to be filtered.


    The constructor of the **FilterInputStream** is written as:


    ```

    FilterInputStream fis = new

    FilterInputStream(InputStream in);

    ```


    # FilterOutputStream:


    FilterOutputStream is the super class of all the output stream filters and is
    obtained from the OutputStream class. It overrides all the methods of the OutputStream
    class required to filter the data that is written to the output stream.'
