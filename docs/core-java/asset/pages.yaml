    This will never \n+ \"be printed\");\n}\n```\n\nThe loop has been started with\
    \ a label. When the continue statement is executed, it jumps to the target label\
    \ start and begins the iteration afresh, and other statements after the continue\
    \ operation are simply skipped. This is the reason this System.out.println(...)\
    \ will never get a chance to execute.\n\n# 3.9 RETURN STATEMENT\n\nThe return\
    \ statement terminates the execution of a function and returns control to the\
    \ calling function. Execution resumes in the calling function at the point immediately\
    \ following the call. A return statement can also return a value to the calling\
    \ function.\n\nThe return statement in Java is used to explicitly return from\
    \ a method ... A method can return a value or reference type or does not return\
    \ a value. If a method does not return a value, the method must be declared void\
    \ and it doesn't need to contain a return statement.\n\nIn a case, a return statement\
    \ can be used to branch out of a control flow block and exit the method and is\
    \ simply used like this: return; If you try to return a value from a method that\
    \ is declared void, you will get a compiler error.\n\n# Returning a Value from\
    \ a Method\n\nA method returns the code that invoked when it\n\n+   * Completes\
    \ all the statements in the method,\n* Reaches a return statement, or\n* Throws\
    \ an exception (covered later),\nwhichever occurs first.\n\nYou declare a method's\
    \ return type in its method declaration. Within the body of the method, you use\
    \ the return statement to return the value.\n\nAny method declared void does not\
    \ return a value. It does not need to contain a return statement, but it may do\
    \ so. In such a case, a return statement can be used to branch out of a control\
    \ flow block and exit the method and is simply used like this:\n\nreturn;\n\n\
    If you try to return a value from a method that is declared void, you will get\
    \ a compiler error.\n\nAny method that is not declared void must contain a return\
    \ statement with a corresponding return value, like this:\nreturn returnValue;"
