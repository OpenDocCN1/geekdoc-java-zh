    # 3.1 LOOPS IN JAVA


    Looping in programming languages is a feature which facilitates the execution
    of a set of instructions/functions repeatedly while some condition evaluates to
    true.

    Java provides three ways for executing the loops. While all the ways provide similar
    basic functionality, they differ in their syntax and condition checking time.'
