    # 6. Polymorphism:


    +   (a) Poly means, morphism means many forms, i.e., more than one form of operation.

    (b) Polymorphism indicates the ability to take more than one.

    (c) More than one form of operation may behave differently by creating different
    instance.

    (d) The behaviour change of object depends on the types of data used i.e. one
    thing behaves differently at different places.

    (e) Polymorphism allows objects having different internal structures to share
    the same external interface.

    (f) It supports function overloading and operator overloading concept. Function
    overloading indicates that functions of a class with same name but either different
    number of arguments or different types of arguments.


    You cannot overload a function which can have same number of arguments of same
    type and in same sequence and differing only in their return types.


    For example:


    You behave differently when your friend asks about something and when your boss
    asks something.


    Example:


    Same name sum function can be used for addition of two integers, addition of two
    floats, addition of three integers.


    ```

    sum(int a, int b);

    sum(float x, float y);

    sum(int a, int b, int c);

    ```


    It is also called as function polymorphism.'
