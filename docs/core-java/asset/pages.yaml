    # 9. Multithreaded


    A multithreaded program runs two or more parts that can be concurrently. Each
    part of such a program is called a thread & each thread defines a separate path
    of execution.


    We have two distinct type of multitasking:


    +   (a) Process based.

    (b) Thread based.


    A process is that is executing. Thus a process based multitasking is the feature
    that allows your computer to run two or more program concurrently.


    In a process based, program is the smallest unit of code that can be dispatched
    by scheduler.


    In a thread-based multitasking, the thread is the smallest unit of dispatchable
    code. This means that a single program can performs two or more tasks simultaneously.


    Multitasking threads require fewer overheads than multitasking process are heavy
    weight task that requires their separate address spaces


    Threads on the other hand are lightweight. They share the same address space.


    # 10. Dynamic


    Java is a dynamic language, which was designed to adapt an evolving environment.

    Java programs carry with substantial amounts of run time information that is used
    to verify and resolve objects at run time. This makes it possible dynamically
    link code in a safe and expedient manner. This is crucial for the robustness to
    the applet environment, where small fragments of code may be dynamically updated
    on a running system.


