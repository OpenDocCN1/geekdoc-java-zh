    Something:


    +   (i) Programmer will gate for free memory that has been previously allocated.

    (ii) Try to free some memory that another part of wide is still using.


    Java eliminates these problems by managing memory allocation. Because it has automatic
    garbage collections, Java memory is freed automatically at the end of execution
    of program or for unused objects and variables.'
