    # Scroll Bars\n\nScroll bars are used to select continuous values between a specified\
    \ minimum and maximum. Scroll bars may be oriented horizontally or vertically.\
    \ A scroll bar is actually a composite of several individual parts. Each end has\
    \ an arrow that you can click to move the current value of the scroll bar one\
    \ unit in the direction of the arrow. The current value of the scroll bar relative\
    \ to its minimum and maximum values is indicated by the slider box (or thumb)\
    \ for the scroll bar. The slider box can be dragged by the user to a new position.\
    \ The scroll bar will then reflect this value. In the background on either side\
    \ of the thumb, the user can click the thumb to jump in direction by increment\
    \ larger than 1. This action translates into some form of page up and page down.\
    \ Scroll bars are computed by the Scrollbar class.Scrollbar defines the following\
    \ constructors:\n\n+   1. Scrollbar()\n2. Scrollbar(int style)\n3. Scrollbar(int\
    \ style, int initialValue, int thumbSize, int min, int max)\n\nThe first form\
    \ creates a vertical scroll bar.\nThe second and third forms allow you to specify\
    \ the orientation of the scroll bar. If style is Scrollbar.VERTICAL, a vertical\
    \ scroll bar is created. If style is Scrollbar.HORIZONTAL, the scroll bar is horizontal.\n\
    \nIn the third form of the constructor, the initial value of the scroll bar is\
    \ passed in initialValue. The number of units represented by the height of the\
    \ thumb is passed in thumbSize. The minimum and maximum values for the scroll\
    \ bar are specified by min and max."
