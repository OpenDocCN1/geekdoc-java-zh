    Core Java


    The interface in java is a mechanism to achieve abstraction. There can be only
    abstract methods in the java interface not body. It is used to achieve abstraction
    and multiple inheritance in Java.


    Java Interface also represents IS-A relationship.


    It cannot be instantiated just like abstract class.


    Multiple inheritance is not supported directly by Java. Hence


    Java classes can not be a subclass, or of more than one super class.


    It can implement more than one interface, thereby enabling us to create classes
    that build upon other classes. Without the problems created by multiple inheritance.


    # Why use Java Interface?


    There are mainly three reasons to use interface. They are given below.


    +   * It is used to achieve abstraction.

    * By interface, we can support the functionality of multiple inheritance.

    * It can be used to achieve loose coupling.


    In other words, Interface are public, static and final by default, and methods
    are public and abstract.


    ![](img/01afc7ce7fa0f83809e0efcce4ad0106_139_0.png)


    # 5.7.1 Defining Interfaces


    An interface is basically a kind of class. Like classes, contains method & variables.
    Interfaces & normal class having one major. Difference that is the interface defines
    only abstract method & final field.


    This means that interface do not specify any code to implement an interface to
    define the code for implementation of this method.


    # Syntax:


    ```

    {

    Variable declaration;

    Method declaration;

    }

    ```


    Interface is a keyword & interface name is like any valid java variable just like
    a classname.


    Variable are declared as follows:


    [Static final type variablename=value]


    All variable are declared as contain. Method declaration will be containing only
    a list of method without any statement.'
