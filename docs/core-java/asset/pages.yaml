  md: 'The following are the feature of a switch construct:


    +   1. Expression must be integer expression.

    2. Each case is labeled by integer or character constant.

    3. Cases and default may occur in any order.

    4. Cases must be different.

    5. After the code for one case is done, execution falls through to the next unless
    you take explicit action to escape.

    6. The break statement cases an immediate exit from the switch.

    7. Falling through cases is a missed blessing.

    8. Positive side is to have one code for have multiple cases, redundancy avoided.

    9. Negative side is to put break after each case.


    Switch statements offer an alternative to "else if" structure which has multiple
    possible paths based on the value of a single expression. A revised form for a
    switch statement is as follows:


    # switch ( int expression )


    ```

    {

    case label - 1 :

    stmt-list-1;

    break;

    case label - 2 :

    stmt-list-2;

    break;

    case label - 3 :

    stmt-list-3;

    break;

    .

    .


    case label - n :

    stmt-list-n;

    break;

    default :

    stmt-list;

    }

    ```


    During execution, the expression is evaluated. If the value of the expression
    matches label – 1, then stmt-list-1 will be executed. If not, execution will move
    on to check label – 2 and so on. If no labels match the expression, default will
    be executed. Inside each case and at the end of every statement list (except default)
    there must be a break statement, which terminates the innermost switch or loop
    statement.'
