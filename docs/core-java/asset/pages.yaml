    # # 10.1 INTRODUCTION TO I/O STREAM


    IO Stream

    Java performs I/O through Streams. A Stream is linked to a physical layer by java
    I/O system to make input and output operation in java. In general, a stream means
    continuous flow of data. Streams are clean to deal with input/output without having
    every part of your code understand the physical.

    Java encapsulates Stream using java.io. Java defines two types of streams. They
    are:


    +   - 1. Byte Stream: It provides a convenient means for handling input and output
    of byte.

    - 2. Character Stream: It provides a convenient means for handling input and output
    of characters. Character stream uses several Unicode and therefore can be internationalized.


    # # 10.2 JAVA INPUT/OUTPUT CLASSES


    > Note: Some of the method syntaxes & explanations are referred from Java Docs
    since method names with their signature (declaration) is fixed.


    Introduction to Java I/O Classes

    Java I/O makes Java Input/Output and is part of java.io package. This package
    has an InputStream and OutputStream. Java InputStream is used for reading the
    stream, byte stream and array of byte stream. It can be used for memory allocation.
    The OutputStream is used for writing byte and array of bytes. Here, you will know
    several interfaces provided by the java.io package as follows:


    Interfaces and Descriptions


    | DataInput | This interface can be used for reading byte stream and reconstructing
    the java primitive data types. Used to accept the data from the user. |

    |---||

    | DataOutput | This interface can be used for writing the byte stream and converting
    data from the java primitive data types. Used to print the data on the output.
    |

    | Externalizable | This is written in Serializable Stream. It save and store it''s
    contents. |'
