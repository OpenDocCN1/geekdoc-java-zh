    file for running the program we have the two steps:


    +   (a) Compile the program.

    (b) Interpreted the program.


    First step is to compile the program as giving the command


    ```

    C> javac className.java

    ```


    The compiler creates a file named class. Class that contains the byte code version
    of the program and is not executable.


    Byte code is an intermediate representation of program that the Java interpreter
    will execute.


    To actually run the program, we use the interpreter that java interpreter called
    java to do so pass the class file.


    ```

    C> java class name

    ```


    Compiler simply transfers the program into byte code without checking error (syntax)
    and when we execute the program line by line, it will check the error. Java enables
    the creation of cross platform programs by compiling the code into an intermediate
    representation called "JAVA BYTECODE". This code can be interpreted on any Java
    virtual machine. Java has two stages compilation and interpretation. Compilation
    can be done on one machine with jdk kit & interpretation of the program can be
    done on other machine with byte code to be executed with the help of only JVM
    JIT.


