    \ 4th | 5th | ↑ 6th | 7th |\n\n因此，使用选择排序按升序排列数字。\n\n# 冒泡排序\n\n该技术广泛用于一维数组元素的排序。在这种技术中，数组被扫描多次，在每次迭代期间，比较相邻元素对并交换为特定顺序（升序/降序）。这是一种简单的技术，但在交换次数多时会消耗大量时间。升序排序数字的方法：\n\
