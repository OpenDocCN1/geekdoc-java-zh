    # Unary Operator


    Unary operator can also be known as arithmetical operator which can be applied
    with a single operand. e.g. +,-,++ etc.


    # Unary Increment and Decrement Operators:


    Unary Increment Operator (++) increases the value of an operand by one whereas
    Unary Decrement Operator (--) decreases the value of an operand by one.


    Example:


    +   1. i=i+1


    By applying increment operator it can be written as i++ or ++i


    +   2. j=j-1


    By applying decrement operator it can be written as j-- or -j


    # Unary Increment/Decrement Operators:


    +   - Prefix

    - Postfix


    # Prefix


    When increment or decrement operators are applied before the operand, it is known
    as prefix operators. This operator works on the principle ‘CHANGE BEFORE ACTION’.'
  - '[PAGE 25]


    It means the value of the variable changes before the action takes place.


    Example : p = 5;


    p = ++p * 4; gives the result 24 as p increases by 1 before the operation performed.


    p = --p * 4; gives the result 16 as p decreases by 1 before the operation is being
    performed.


    # Postfix


    When increment or decrement operators are applied after the operand, it is known
    as postfix operators. This operator works on the principle ‘CHANGE AFTER THE ACTION’.
    It means the value of the variable changes after performing the operation.


    Example : p = 5;


    p = p++ * 4; gives the result 20 as p increases by 1 after the operation performed.


    p = p-- * 4; gives the result 20 as p decreases by 1 after the operation is being
    performed.


    # Binary Arithmetic Operators


    An arithmetic operator, which deals with two operands is known as Binary Arithmetic
    Operators. e. g a + b, a – b, etc.


    # Ternary Operators (Conditional Operator)


    Ternary Operators takes three operands. It is also called conditional operator
    because the value assigned to a variable depends upon a logical expression.


    Syntax: variable = (test expression)? Expression 1:Expression 2;'
