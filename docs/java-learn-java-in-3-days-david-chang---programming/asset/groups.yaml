    # 1.3 DATA ABSTRACTION


    Abstraction refers to the act of representing essential features (relevant data)
    without including background details in order to reduce complexity and increase
    efficiency.


    Abstraction is the absolute property of a class. The class binds the data items
    and functions to promote abstraction. The data members are accessed only through
    the related methods. A class uses the property of abstraction called as abstract
    data type.


    For Example: For driving a car, you only use the essential features without knowing
    in details the internal mechanism of'
