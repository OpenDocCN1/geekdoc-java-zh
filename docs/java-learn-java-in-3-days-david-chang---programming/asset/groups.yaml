    the car and press clutch to change the gears.

    Do you ever think what changes are taking place in the machinery? The answer is
    simply No. This act of driving a car is termed as **abstraction**.


    # 1.4 ENCAPSULATION


    **Encapsulation is the system of wrapping up of data and functions into a single
    unit (called class).**


    For Data Hiding **Encapsulation** run on an important **OOP** in Object Oriented
    Programming (OOP), data cannot move freely from method to method. They are kept
    in the corresponding classes in a way that they will not be accessible to the
    outside world except by using them through the related methods.


    It is the most important feature of a class. The functions used in a class can
    only access the data items. These functions provide interface between data items
    of the objects and the calling program.


    Such insulation of data, which cannot be accessed directly outside class premises
    although they are available in the same program, is known as **DATA HIDING.**


