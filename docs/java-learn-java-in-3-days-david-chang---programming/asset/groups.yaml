    # Chapter 3 DATA TYPE AND TOKENS IN JAVA


    # 3.1 DATA TYPES


    Data types are predefined types of data, which are supported by the programming
    language. It specifies the size and type of values that can be stored in a variable.
    In Java Programming we have to deal with various types of data, hence it becomes
    necessary for a programmer to select an appropriate data type according to the
    data taken in a program.


    The data type has been divided into two types:


    +   * Primitive Type

    * Non-Primitive Type


    ![](img/c590c9268607738d8272307d1e7c574c_17_0.png)


    Primitive data types are pre-defined or built-in data types,'
  - '[PAGE 18]


    which are independent of any other type. For eg. int, long, float, double etc.


    # Integer Type


    Integer types can hold whole numbers such as 123 and –96. The values size can
    depend on stored integer type that we choose. It does not contain decimal point.
    There are two types of declarations under this heading:


    +   - int : applied for short integer number.

    Bit size -> 32 bits, Format -> int a; a=10; or int a=10

    - long : applied for large integer number.

    Bit size -> 64 bits, Format -> long b; b=345678; or

    b=345678;


    # Floating Type


    Floating point data types are used to represent numbers with a fractional part.
    There are two types of declarations under this heading:


    +   - float : applied for small range of decimal values.

    Bit size -> 32 bits, Format -> float m; m=32.65; or float m=32.65;

    - double : applied for wide range of decimal values.

    Bit size -> 64 bits, Format -> double n; n=0.0006547839; or

    double n=0.0006547839;


    # Character Type


    It stores character constants in the memory and contains a single character. A
    character is enclosed in single quotes (‘ ’).Strings are enclosed in double quotes(“
    ”).'
