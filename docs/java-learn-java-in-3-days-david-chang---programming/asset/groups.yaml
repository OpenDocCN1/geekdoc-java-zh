    requirements of the JVM specification. JVM Instance is implementation running
    in process that executes a program compiled into Java bytecode.


    Thus, the Java machine uses compiler and interpreter too.


    # 2.5 JAVA RUNTIME ENVIROMENT (JRE)


    Java Runtime Environment is used to provide runtime environment. It is the implementation
    of JVM. It contains other files and set of libraries that used at runtime by JVM.
    It is a software package that contains what is required to run a Java program.
    It includes together Java Class Library Implementation and Java Virtual implementation.
    The Oracle Corporation, which owns the Java trademark, distributes a Java Runtime
    environment with their Java Virtual Machine called HotSpot.


    # 2.6 JAVA DEVELOPMENT KIT (JDK)


    Java Development Kit (JDK) contains JRE and development tools. JDK Tools such
    as the compilers and debuggers are necessary for developing applications and applets.


    # Java Libraries in JDK 1.3


    Java Development Kit (JDK) contains a Java Class Library for different purposes.
    Some useful packages in it are mentioned below:'
