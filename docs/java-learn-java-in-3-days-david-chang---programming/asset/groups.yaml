    \n语法：变量 = (测试表达式)?表达式1:表达式2;\n\n如果测试条件为真，则变量包含表达式1的结果，否则为表达式2。\n\n例如 a = 4; b\
    \ = 2;\n\n```java\nmax = (a>b)? a:b;\n```\n\n在这里，条件为真，所以 a 的值为4。\n\n嵌套三元运算符 (Nested\
    \ Ternary Operator)\n\n你可以如下所示的形式使用嵌套的三元运算符：\n\n寻找三个数中最大值的程序：\n\n```java\nint\
    \ a = 4, b = 10, c = 2;\n```\n\n```java\nmax = (a>b)? (a>c)? a:b : (b>c)? b:c;\n\
    ```\n\n由于，由于测试条件为假，它将操作表达式2，使值12存储在 max 中。因此，max = 12。\n\n# 关系运算符 (RELATIONAL\
    \ OPERATORS)\n\n关系运算符比较变量的值并返回“真”或“假”（即 0 或 1）。Java 有六种关系运算符：<, <=, >=, == 和 !=。\n\
    \n# 逻辑运算符 (LOGICAL OPERATORS)\n\nJava 使用逻辑运算符 AND(&), OR (|) 或 NOT (!)。这些运算符根据不同表达式的输出产生\
