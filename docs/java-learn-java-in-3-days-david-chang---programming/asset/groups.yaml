    \n- 1. i=i+1 应用增运算符可以写为 ++i\n- 2. j=j-1 应用减运算符可以写为 j--\n\n一元增/减运算符类型：\n\n- 前缀\
    \ (Prefix)\n- 后缀 (Postfix)\n\n前缀 (Prefix)\n\n当增减运算符应用于操作数之前时，被称为前缀运算符。该运算符遵循“操作前更改”的原则。这意味着变量在操作发生之前变化。\n\
    \n例如：p = 5;\n\np = ++p * 4; 在操作执行前 p 增加了 1。\n\np = --p * 4; 在操作执行前 p 减少了1。\n\n\
    后缀 (Postfix)\n\n当增减运算符应用于操作数之后时，被称为后缀运算符。该运算符遵循“操作后更改”的原则。这意味着变量在执行操作后变化。\n\n\
    例如：p = 5;\n\np = p++ * 4; 在操作执行后 p 增加了 1。\n\np = p-- * 4; 在操作执行后 p 减少了1。\n\n二元算术运算符\
