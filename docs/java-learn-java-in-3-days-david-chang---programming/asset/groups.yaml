  mdcn: "\n使用线程是因为它们共享公共内存区域而不分配单独的内存区域以节省更多空间，而且比之前的进程耗时短。\n\n# 第 12 章 处理异常与错误\n\n\
    异常是在程序执行过程中出现的问题。当发生异常时，程序的正常执行流会被中断，程序将异常终止，这是不推荐的，因此，必须对这些异常进行处理。\n\n以下是发生异常的一些场景：\n\
    \n- 当用户输入无效数据时。\n- 当找不到文件时。\n- 当通信过程中丢失网络连接，或者 Java 虚拟机内存耗尽时。\n\n这些异常是由用户、程序员以及某些方法中失败的物理资源引起的。\n\
    \n## 12.1 使用 TRY-CATCH 处理异常\n\n`try` 关键字包含一个要执行的语句块。`try` 块内发生的任何异常都会被捕获。因此，它是错误捕获器。此外，需要向异常处理器传递错误报告，可以通过\
    \ `catch` 块来实现。\n\n`finally` 块包含无论如何都会执行的语句。\n\n使用 try-catch 异常处理器的语法：\n\n```\n\
    try\n{\n一组语句\n}\ncatch(exception(e)){\n}\nfinally\n{\n无论如何执行的语句\n}\n```\n\n示例：import\
    \ java.io.*;\npublic class Test{\npublic static void main(String args[]){\ntry{\n\
    int a[]=new int[2];\nSystem.out.println(\"Access element three :\" +a[3]);\n}catch(ArrayIndexOutOfBoundsException\
    \ e){\nSystem.out.println(\"Exception thrown :\" +e);\n}\nSystem.out.println(\"\
    Out of the block\");\n}\n```\n\n输出：java.lang.ArrayIndexOutOfBoundsException: 3\n\
    Out of the block\n\n## 12.2 使用 THROWS 关键字处理异常\n\n如果你希望系统报告错误，则可以使用 `throws` 关键字。`throws`\
    \ 关键字应用于函数签名上。\n\n示例：public void getdata() throws IOException\n\n这表示如果函数中发生了与\
    \ I/O 操作相关的错误，可能会将报告传递给错误处理器。\n\n#### 编译异常 (Checked Exception)\n\n继承 `Throwable`\
    \ 类的 `RuntimeException` 和 `Error` 之外被称为编译异常，例如 `IOException`、`SQLException` 等。编译异常在编译时会被检查。\n\
    \n#### 非检编译异常 (Unchecked Exception)\n\n继承 `RuntimeException` 的类被称为非检编译异常，例如 `ArithmeticException`、`NullPointerException`、`ArrayIndexOutOfBounds`\
    \ 等。非检编译异常在编译时不进行检查，而是在运行时检查。\n\n## 12.3 JAVA 异常处理的优势\n\n- 异常处理有助于分离结果，使代码更简单且具可读性。它在逻辑上也更强大，因为不需要在正常实现路径中进行错误测试。\n\
    \n- 逻辑错误类型：异常可以与相互相关的错误分组在一起。这使我们能够使用单个异常处理器处理关联异常。异常处理器可以捕获其参数指定的类或任何子类的异常。\n\
    \n- 异常处理允许在错误发生的地方捕获相关信息，并显示可以在何处进行成功控制。\n\n## 12.4 错误 (ERROR)\n\n错误是不可恢复的，例如\
    \ `OutOfMemoryError`、`VirtualMachineError` 等。\n\n###常见编码错误：\n\n- 语法错误 (Syntax\
    \ Error) – 语法错误发生在程序中特定字符序列的语法中。\n- 逻辑错误 (Logical Errors) – 当程序中存在设计缺陷时发生逻辑错误。\n\
    - 运行时错误 (Runtime Errors) – 运行时错误在程序执行期间发生。\n\n## 12.5 错误与异常的区别\n\n| 错误 (ERRORS)\
    \ | 异常 (EXCEPTIONS) |\n| :--- | :--- |\n| 运行时错误无法被编译器感知 | 编译异常已知，非检异常运行时未知 |\n\
    | 错误在应用程序运行时发生或引起 | 异常由应用程序本身产生 |\n| Java 中的错误大多是非检编译类型 | Java 中的编译异常和非检编译异常 |\n\
    \n# 第 13 章 一些问答：\n\n## 问题\n\n- 1. 由用户开发和执行的 Java 程序被称为\n   a> Application b> Applet\n\
    \   c> Object d> 无\n\n- 2. Java 虚拟机 (JVM) 是一个\n   a> 解释器 b> 解释器\n   c> 机器码 d>\
