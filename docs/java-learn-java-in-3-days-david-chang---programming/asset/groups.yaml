    \ an Array to a Method\n  7.4 Basic Operations on Java: Searching and Sorting\n\
    \n- 8. Classes, Objects and Methods\n  8.1 Classes in Java\n  8.2 Creating an\
    \ Object\n  8.3 Methods\n  8.4 Creating Methods\n  8.5 Method Calling\n  8.6 Method\
    \ Overloading\n  8.7 Method Overriding\n\n- 9. Interfaces and Packages\n  9.1\
    \ Interfaces\n  9.2 Packages in Java\n  9.3 Advantages of Java Package\n\n- 10.\
    \ Constructors\n  10.1 Types of Constructors\n\n- 11. Thread and Multithreading\
    \ in Java\n  11.1 Lifecycle of a Thread\n  11.2 Commonly used methods of Thread\
    \ class\n  11.3 Creating Thread\n  11.4 Multithreading\n\n- 12. Handling Exceptions\
    \ and Errors\n  12.1 Exception Handling with try-catch\n  12.2 Exception Handling\
    \ with throws keyword\n  12.3 Advantages of Exception Handling in Java\n  12.4\
    \ Errors\n  12.5 Difference between Errors and Exceptions\n\n- 13. Some Questions\
    \ and Answers\n\n# Chapter 1 FUNDAMENTALS OF OBJECT ORIENTED PROGRAMMING\n\n#\
    \ 1.1 INTRODUCTION (OOP)\n\nObject Oriented Programming (OOP) is an approach to\
    \ standardize the programs by creating partitioned memory area for both data and\
    \ method. It has been developed to increase the programmer's productivity and\
    \ also to overcome the traditional approach of programming. The different Object\
    \ Oriented Programming languages are C++, Java, Simula-67, etc.\n\nAn Object Oriented\
    \ Programming (OOP) allows the data to be applied within designated program area.\
    \ It gives more significance to data rather than Methods which means it also provides\
    \ the reusability feature to develop productive logic.\n\n# FEATURES OF OBJECT\
    \ ORIENTED PROGRAMMING (OOP)\n\n- The objects can be used as a bridge to have\
    \ data flow from one method to another.\n- It gives importance to data items rather\
    \ than methods.\n- It makes the complete program simpler by dividing it into a\
    \ number of objects.\n- Data can be easily modified without any change in the\
    \ method.\n\n# PRINCIPLES OF (OOP)\n\n- Objects\n- Classes\n- Data Abstraction\n\
    - Encapsulation\n- Data Hiding\n- Inheritance\n- Polymorphism\n\n# 1.2 OBJECTS\
    \ AND CLASSES\n\n# OBJECTS\n\nObject is a unique entity which contains data and\
    \ methods (characteristics and behavior) together in an Object Oriented Programming\
    \ (OOP) Language.\n\nExample: Let us consider the real world objects, which are\
    \ visible before us.\n\nAny object in the real world can possess the following\
    \ characteristics:\n\n- It is visible.\n- It can be described easily.\n\nYou can\
    \ observe that the above mentioned criteria has unique identity, definite state,\
    \ or characteristics and behaviors. For example consider an object Bed:\n\nIt\
    \ has the following characteristics:\n\n- It has four legs.\n- It has a plain\
    \ top.\n- It is used to sleep.\n- It is used to sit.\n\nIn Payroll system, an\
    \ employee may be taken as an example of object where **characteristics** are\
    \ name, designation, basic pay and **behavior** as calculating gross pay, provident\
    \ fund, printing pay slip, etc.\n\n# CLASSES\n\nClass is a set of different objects.\
    \ Class can contain fields and methods to explain about the behavior of an object.\
    \ Each object of a class possesses same attributes and behavior defined within\
    \ the same class. Class is also termed as Object factory.\n\nFor Example: If Rainbow\
    \ is the class then the colors in the rainbow represent the different objects\
    \ of the class Rainbow.\n\nSimilarly, we can consider a class named fruit where\
    \ apple, mango, orange are members of the class fruit. If fruit is defined as\
    \ a class, then the statement:\n\nfruit apple = new fruit(); will create an object\
    \ apple belonging to the class fruit.\n\n# 1.3 DATA ABSTRACTION\n\nAbstraction\
    \ refers to the act of representing essential features (relevant data) without\
    \ including background details in order to reduce complexity and increase efficiency.\n\
    \nAbstraction is the absolute property of a class. The class binds the data items\
    \ and functions to promote abstraction. The data members are accessed only through\
    \ the related methods. A class uses the property of abstraction called as abstract\
    \ data. For Example: For driving a car, you only use essential features.\n\n#\
    \ 1.4 ENCAPSULATION\n\n**Encapsulation is the system of wrapping up data and functions\
    \ into a single unit (called class).**\n\nObject Oriented Programming (OOP) allows\
    \ the data to be applied within designated program area. It gives more significance\
    \ to data rather than Methods which means it also provides the reusability feature\
    \ to develop productive logic.\n\nEncapsulation is the most important feature\
    \ of a class. The data members are accessed only through the related methods.\
    \ A class uses the property of abstraction called as abstract data. Java is a\
    \ data type. Such insulation of data, which cannot be accessed directly outside,\
    \ is known as **DATA HIDING.**\n\n# 1.5 POLYMORPHISM\n\nThe literal meaning of\
    \ Polymorphism is “available in many forms”. Suppose you have developed a method\
    \ to perform addition then it will find the sum of two numbers. In case the passed\
    \ arguments are strings, the function will produce the concatenated (joined) string.\n\
    \nPolymorphism is the ability of different objects to respond, each in its own\
    \ way, to identical messages. It allows the use of different internal structure\
    \ of the object by keeping the same external interface.\n\n# 1.6 INHERITANCE\n\
    \nInheritance can be defined as the process by which objects of one class can\
    \ link and share common properties from another class.\n\nAn object of a class\
    \ acquires some properties from another class. Superclass or base class is a class\
    \ that used basis for inheritance. Subclass or derived class is known as a class\
    \ that inherits from a **superclass.**\n\n# BENEFITS OF OBJECT ORIENT PROGRAMMING\
    \ (OOP)\n\nSome benefits of OOP are as listed below:\n\n- You can create different\
    \ modules in your project through objects.\n- You can extend the use of existing\
    \ class through inheritance.\n- Using the concept data hiding can generate secured\
    \ program.\n- It is highly beneficial to solve complex problems.\n- It is easy\
    \ to modify and maintain software complexity.\n\n# Chapter 2 INTRODUCTION TO JAVA\n\
    \n# 2.1 HISTORY OF JAVA\n\nJava programming language was originally developed\
    \ by James Gosling at Sun Microsystems (Broomfield [Broomfield], Colorado, USA)\
    \ and released in 1995 as a core component of Sun Microsystems' Java platform.\
    \ This language was initially called Oak (named after the Oak trees outside Gosling’s\
    \ office). The platform independence is one of the most significant advantage\
    \ that JAVA has over other languages.\n\nJAVA encapsulates many features of C++.\
    \ Originally JAVA was designed to execute applets, downloaded while Web browsing.\
    \ But gradually, the language has been gaining wide acceptance as a programming\
    \ language, very often replacing C Or C++.\n\n# 2.2 BASIC FEATURES OF JAVA\n\n\
    JAVA possesses the following features:\n\n- Java is not a purely Object Oriented\
    \ Programming language.\n- Java programs are both compiled and interpreted.\n\
    - It can access data from a local system as well as from net.\n- Java programming\
    \ is written within a class. The variables and functions are declared and defined\
    \ with the class.\n- Java programs can create Applets (the programs which run\
    \ on Web-browsers).\n- Java is case sensitive language. It distinguishes the upper\n"
