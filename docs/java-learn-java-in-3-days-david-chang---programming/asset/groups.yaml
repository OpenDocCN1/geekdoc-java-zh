    ## 2.3 COMPILER AND INTERPRETER


    All high level languages need to be converted into machine code so that the computer
    understands the program after taking the required inputs.


    The conversion of high-level language to machine-level language can be done in
    two possible ways. It can be done either by using a Compiler or an Interpreter.


    The software, by which the conversion of the high level instructions is performed
    by line to machine language, is known as an Interpreter. If an error is found
    on any line, further execution stops till it is corrected. This process of error
    correction is much easier but the program takes longer time to execute successfully.


    # SOURCE CODE -> COMPILER/INTERPRETER -> MACHINE CODE


    However, if all the instructions are converted to machine level language at once
    and all the errors are listed together, then the software is known as Compiler.
    This process is much faster but sometimes it becomes difficult to debug all the
    errors together in a program.


    The Java source code and Java bytecodes are compiles in **javac** command.


    Compilation Syntax: **javac** filename.java


    ## 2.4 THE JVM


    JAVA is a high level language (HLL) and the program written in HLL is compiled
    and then converted to an intermediate language called Byte Code. Byte code makes
    a Java program highly portable as its Bytes code can easily be transferred from
    one system to another. When this Byte code is to be run on any other system, an
    interpreter, known as Java Virtual Machine is needed which translates the byte
    code to machine code.


    ![](img/c590c9268607738d8272307d1e7c574c_12_0.png)


    Java machine code varies from different platforms like Windows 98, Unix System,
    etc. Hence, JVM acts as a virtual processor and converts the byte code to the
    machine code for concerning platform. That is why it is called Java Virtual Machine.


    Three notions of JVM are: Implementation, instance and specification. The specification
    document describes what''s required of JVM implementation. Single specification
    ensures all implementation are interoperable. Implementation program meets the
    requirements of the JVM specification. JVM Instance is implementation running
    in process that executes a program compiled into Java bytecode.


    Thus, the Java machine uses compiler and interpreter too.


    ## 2.5 JAVA RUNTIME ENVIRONMENT (JRE)


    Java Runtime Environment is used to provide runtime environment. It is the implementation
    of JVM. It contains other files and set of libraries that used at runtime by JVM.
    It is a software package that contains what is required to run a Java program.
    It includes together Java Class Library Implementation and Java Virtual implementation.
    The Oracle Corporation, which owns the Java trademark, distributes a Java Runtime
    environment with their Java Virtual Machine called HotSpot.


    ## 2.6 JAVA DEVELOPMENT KIT (JDK)


    Java Development Kit (JDK) contains JRE and development tools. JDK Tools such
    as the compilers and debuggers are necessary for developing applications and applets.


    ## Java Libraries in JDK 1.3


    Java Development Kit (JDK) contains a Java Class Library for different purposes.
    Some useful packages in it are mentioned below:


    - java.io : to support classes to deal with input & output statements.

    - java.lang : to support classes containing String, Character, Math, Integer,
    Thread etc.

    - java.net : to support classes for network related operations and dealing with
    URL (Uniform Resource Locator)

    - java.txt : for supporting text elements such as date, times and currency etc.

    - java.math : to support mathematical functional such as square roots (integer
    & decimal both)

    - java.applet : to support classes to generate applet – specific environment

    - java.awt : to support abstract window tool kit and managing GUI (Graphic User
    Interface)


    ## 2.7 RESERVED WORDS


    Reserved words or keywords are those words which are preserved with the system.
    These words cannot be applied as a variable name in any program. Java also has
    reserved words. Some of the reserved/key words are listed below:


    | case | switch | int | void | default |

    | do | break | double | import | boolean |

    | try | const | long | class | char |

    | catch | if | new | package | goto |

    | for | else | byte | static | throws |

    | while | short | public | private | float |


    ## Comment Statements in Java Programming


    There are some cases where it becomes difficult for a user to understand the logic
    applied in a program particularly when any other person has developed it. In such
    cases, the programmer keeps mentioning the purpose and action being taken in different
    steps by applying comment statement in the program.


    There are three ways to give a comment in Java programming.


    1. // : used for single line comment

    2. /* comments to be written */ : used for multi line comment

    3. /** documenting comment **/


    ## Output Statement in Java Programming


    **System.out.println()** and **System.out.print()** are the statements that are
    used to get the output of the program or to display messages on the screen.


    While using **System.out.println()** statement, the cursor skips the line and
    passes to the next line after displaying the required result.


    And, when you use **System.out.print()** statement, the cursor remains on the
    same line after displaying the result.


    **Syntax:** System.out.println("Welcome to Java");

    System.out.println("The product of two numbers is ” +a);


    Note:


    - The message is to be written within double quotes (") enclosed within braces.

    - When a message is to be written within double quotes enclosed within braces.


    # Chapter 3 DATA TYPE AND TOKENS IN JAVA


    ## 3.1 DATA TYPES


    Data types are predefined types of data, which specifies the size and type of
    data. The data type has been divided into two types:


    * Primitive Type

    * Non-Primitive Type


    ![](img/c590c9268607738d8272307d1e7c574c_17_0.png)


    Primitive data types are predefined or built-in data types, which are independent
    of any type. For eg. int, long, float, double.


    ### Integer Type


    Integer types can hold whole numbers such as 123 and -96. The values size can
    depend on integer type. It does not contain decimal point. There are two types
    of declarations:


    - int : applied for short integer number. Bit size -> 32 bits, Format -> int a=10;
    or a=10

    - long : applied for large integer number. Bit size -> 64 bits, Format -> long
    b=34578; or b=34578


    ### Floating Type


    Floating point data types are used to represent numbers with a fractional part.
    There are two types of declarations:


    - float : applied for small range of decimal values. Bit size -> 32 bits, Format
    -> float m=32.65; or float m=32.65

    - double : applied for wide range of decimal values. Bit size -> 64 bits, Format
    -> double n=0.0006547839; or double n=0.0006547839


    ### Character Type


    It stores character constants in the memory and contains a single character. A
    character is enclosed in single quotes (‘ ’). Strings are enclosed in double quotes
    (“ ”).


    The character types in Java are as follows:


    | Non Numeric | Character type | Bit Size | Format |

    |---|---|---|---|

    | Single character | char | 16 bits(2 bytes) | char c=''A''; char d; d=''*'';
    char c =''A''; |

    | More than one character/word/ sentence | String | More than 16 bits | String
    a; a="College"; |


    ### Boolean Type


    Boolean data types are used to store values with two states: true or false. These
    are non-figur constants. You can use Boolean type variable to set true or false
    in order to ensure whether a logical condition is satisfied or not. It assumes
    one of the values true or false without quotes.


    For Example: boolean flag=true; or boolean flag=false;


