    比较 25 和 4，由于 25>4，它们是可以交换的。\n\n| 7 | 10 | 4 | 25 |\n| :--- | :--- | :--- | :---\
    \ |\n| 0th | 1st | 2nd | 3rd |\n\n比较 25 和 12，由于 25>12，它们是可以交换的。\n\n因此，使用冒泡排序按升序排列数字。\n\
    \n# 插入\n\n要执行插入排序，从数组最左侧的元素开始，并调用插入将遇到的每个元素插入到其正确位置。插入元素的有序序列存储在数组的开头，已检查的索引集中。\n\
    \n# 第 8 章 类、对象和方法\n\n## 8.1 JAVA 中的类\n\n类是用于创建单个对象的蓝图。\n\n示例：public class boy\n\
    \n```java\nclass boy {\n  String name;\n  int age;\n  void study(){}\n  void hungry(){}\n\
    }\n```\n\n类包含以下类型的变量：\n\n- 局部变量：局部变量可以定义在方法、构造函数或块内部。\n- 实例变量：在类内部但在任何方法之外并在类内初始化的变量是实例化的。可以从任何方法、构造函数或块内部访问变量。\n\
    \n类包含以下变量类型：\n\n- 局部变量：局部变量可以定义在方法、构造函数或块内部。\n- 实例变量：在类内部但在任何方法之外并在类内初始化的变量是实例化的。可以从任何方法、构造函数或块内部访问变量。\n\
    \n## 8.2 创建对象\n\n从类创建对象。使用 `new` 关键字创建对象。\n\n- 声明 – 类的类型。\n- 实例化 – 使用 `new` 关键字。\n\
    - 初始化 – 随 `new` 关键字。\n\n示例：public class boy\n\n```java\npublic Boy(String name){\n\
    \    System.out.println(\"Name is:\" +name);\n}\npublic static void main(String\
    \ args[]){\n    Boy obj = new(\"(\"\");\n}\n```\n\n输出：\nName is: Ram\n\n## 8.3\
    \ 方法\n\n在程序中同时使用的模块被称为方法。\n\n## 8.4 创建方法\n\n```java\n语法: public static int user(int\
    \ a,int b){\n    //body\n}\n```\n\n在这里，\n\n- **public static** – 修饰符\n- **int**\
    \ – 类型\n- **user** – 方法名\n- **a, b** –形式参数\n- **int a, b** – 参数列表\n\n## 8.5 方法调用\n\
    \n方法调用有两种方式。\n\n- 方法返回一个值\n- 不返回（无返回值）。\n\n方法调用过程非常简单。当程序调用方法时，程序控制转移到调用方法。然后调用方法在两种情况下返回控制权给调用者。\n\
    \n- 首先在执行返回语句时，\n- 其次在到达方法结束的大括号时。\n\n`void` 关键字：它允许我们创建不返回值的方法。\n\n## 8.6 Java\
    \ 中的 `this` 关键字\n\n有时，在成员方法中需要使用调用方法的对象。Java 通过 `this` 关键字使用它。被调用的对象可以通过 `this`\
    \ 进行引用。\n\n示例：class 类\n\n```java\nclass calculate {\n    int a,b;\n\n    void\
    \ getvalue(int p,int q) {\n        a=p;\n        b=q;\n    }\n\n    void sum(calculate\
    \ x, calculate y) {\n        this.a=x.a+y.a;\n        this.b=x.b+y.b;\n    }\n\
    \n    void display() {\n        System.out.println(\"sum of a \" + this.a);\n\
