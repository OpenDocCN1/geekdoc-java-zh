    \ the simplest technique in which the searching of an item begins at the start\
    \ of an array (i.e. 0th position of the array). The process continues one after,\
    \ where each element of the array is checked and compared with a given data item\
    \ till the end of the array location is reached. This process is also called as\
    \ Sequential Search.\n\n# Binary Search\n\nIt is the another technique to search\
    \ an element in the given array by using minimum possible time. Searching takes\
    \ place in either half of the array by further dividing it into two halves.\n\n\
    However, the binary search can be applied only when the array elements are sorted\
    \ into a sequence (ascending/descending). It always compares the element to be\
    \ searched with the middle element of the sorted array. If the middle member is\
    \ smaller, then the search is carried out in upper half, otherwise the search\
    \ continues in the lower half. The middle element of the either half is compared\
    \ with the search item. This process is repeated till the search terminates.\n\
    \n| 18 | 32 | 50 | 56 | 65 | 79 | 88 |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 0th | 1st | 2nd | 3rd | 4th | 5th | 6th |\n\n![](img/c590c9268607738d8272307d1e7c574c_56_0.png)\n\
    \n# First Mid Last\n\nStep 1: First=0, Last=6, Mid=(First+Last)/2=(0+6)/2=3\n\
    Step 2: num[Mid]=num[3]=55\n55>31\n\nSince, 55 is greater therefore search will\
    \ take place in the first half of the array.\nStep 3: Last=Mid-1 3-1=2\n(In case,\
    \ the number to be searched is greater than the mid value then, First=Mid+1).\n\
    Mid=(First+Last)/2=(0+2)/2=1\nNum[Mid]= num[1]=31\n\n| 18 | 32 | 50 |\n| :---\
    \ | :--- | :--- |\n| ↓ 0th | ↓ 1st | ↓ 2nd |\n\n# First Mid Last\n\n# Sorting\n\
    \nIt is a process of arranging data in a specified order which may be either ascending\
    \ or descending.\n\n- Selection Sort\n- Bubble Sort\n\n# Selection Sort\n\nThis\
    \ is one of the techniques to sort the given data item in a specified order (ascending/descending).\
    \ Suppose you have to arrange numbers in ascending orders from unsorted data.\n\
    \nStep 1: At first, the smallest number is selected through iteration from the\
    \ unsorted data list. This number is interchanged with the number at 0th position\
    \ (i.e. 16 comes from 6th position to 0th position and 45 goes to 6th position\
    \ from 0th position).\n\n| 45 | 98 | 50 | 57 | 90 | 28 | 16 | 78 |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd | 4th |\
    \ 5th | 6th | 7th |\n\nStep 2: Find the next smallest element from 1st position\
    \ onward (i.e. 28). Interchange it with 1st position element.\n\n| 16 | 98 | 50\
    \ | 57 | 90 | 28 | 45 | 78 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 0th | 1st | 2nd | 3rd | 4th | 5th | 6th | 7th |\n\nStep 3: Find\
    \ the next smallest element from 2nd position onward (i.e. 45). Interchange it\
    \ with 2nd position element.\n\n| 16 | 28 | 50 | 57 | 90 | 98 | 45 | 78 |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 0th | 1st | ↑ 2nd | 3rd\
    \ | 4th | 5th | 6th | 7th |\n\nStep 4: Find the next smallest element from 3rd\
    \ position onward (i.e. 50). Interchange it with 3rd position element.\n\n| 16\
    \ | 28 | 45 | 57 | 90 | 98 | 50 | 78 |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 0th | 1st | 2nd | ↑ 3rd | 4th | 5th | 6th | 7th |\n\nStep\
    \ 5: Find the next smaller element from 4th position onward (i.e. 57). Interchange\
    \ it with 4th position element.\n\n| 16 | 28 | 45 | 50 | 90 | 98 | 57 | 78 |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 0th | 1st | 2nd |\
    \ 3rd | 4th | 5th | 6th | 7th |\n\nStep 6: Find the next smaller element from\
    \ 5th position onward (i.e. 78). Interchange it with 5th position element.\n\n\
    | 16 | 28 | 45 | 50 | 90 | 98 | 57 | 78 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd | 4th | 5th | 6th | 7th |\n\n\
    Step 7: Find the next smaller element from 6th position onward (i.e. 90). Interchange\
    \ it with 6th position element.\n\n| 16 | 28 | 45 | 50 | 57 | 78 | 90 | 98 |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 0th | 1st | 2nd |\
    \ 3rd | 4th | 5th | 6th | 7th |\n\nThus, the numbers are arranged in ascending\
    \ order using Selection Sort.\n\n# Bubble Sort\n\nThis technique is widely used\
    \ for sorting elements in a single dimensional array. In this technique, array\
    \ is scanned several times and during each iteration pairs of consecutive elements\
    \ are compared and interchanged into a specific order (ascending/descending).\
    \ It is easy technique but consumes lot of time when number of exchanges is high.\
    \ Technique to sort the numbers in ascending order:\n\n| 10 | 7 | 25 | 12 |\n\
    | :--- | :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd |\n\nElements 10 and 7\
    \ are compared. Both are interchangeable as 10>7.\n\n| 7 | 10 | 25 | 12 |\n| :---\
    \ | :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd |\n\nElements 10 and 25 are\
    \ compared but not interchangeable as 10<25.\n\n| 7 | 10 | 25 | 12 |\n| :--- |\
    \ :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd |\n\nElements 25 and 4 are compared\
    \ and interchangeable as 25>4.\n\n| 7 | 10 | 4 | 25 |\n| :--- | :--- | :--- |\
    \ :--- |\n| 0th | 1st | 2nd | 3rd |\n\nElements 25 and 12 are compared and interchangeable\
    \ as 25>12.\n\nThus, the numbers are arranged in ascending order using Bubble\
    \ Sort.\n\n# Insertion\n\nTo perform insertion sort, begin at the left most element\
    \ of the array and invoke to insert each element encountered into its correct\
    \ position. The ordered sequence into which the element is inserted is stored\
    \ at the beginning of the array in the set of indices already examined.\n\n# Chapter\
    \ 8 CLASSES, OBJECTS AND METHODS\n\n## 8.1 CLASSES IN JAVA\n\nA class is a blueprint\
    \ from which individual objects are created.\n\nExample: public class boy\n\n\
    ```java\nclass boy {\n  String name;\n  int age;\n  void study(){}\n  void hungry(){}\n\
    }\n```\n\nA class contain following variables type:\n\n- Local variables: Local\
    \ variables can be defined inside methods, constructors or blocks.\n- Instance\
    \ variables: Variables declare within a class but outside any method and initialized\
    \ within class are instantiated. Variables can be accessed from inside any method,\
    \ constructor or blocks of particular class.\n- Class variables: With the static\
    \ keyword, within a class or outside any method are Class variables.\n\n## 8.2\
    \ CREATING AN OBJECT\n\nAn object is created from a class and new keyword is used\
    \ to create new objects.\n\nCreating an object from a class there are three steps–\n\
    \n- Declaration – A variable name with an object type.\n- Instantiation – 'new'\
    \ keyword used to create an object.\n- Initialization – 'new' keyword followed\
    \ by constructor. This call initializes new object.\n\nExample: public class Boy{\n\
    \n```java\npublic Boy(String name){\n    System.out.println(\"Name is:\" +name);\n\
    }\npublic static void main(String args[]){\n    Boy obj = new Boy(\"Ram\");\n\
    }\n```\n\nOutput:\nName is: Ram\n\n## 8.3 METHODS\n\nA program module used simultaneously\
    \ at different instances in the program is known as Methods.\n\n## 8.4 CREATING\
    \ METHOD\n\n```java\nSyntax: public static int user(int a,int b){\n    //body\n\
    }\n```\n\nHere,\n\n- **public static** – modifier\n- **int** – return type\n-\
    \ **user** – name of the method\n- **a, b** – formal parameters\n- **int a, int\
    \ b** – list of parameters\n\n**Example:** public static int max(int a,int b){\n\
    \    int max;\n    if(a>b){\n        max=a;\n    }else{\n        max=b;\n    }\n\
    \    return max;\n}\n```\n\n## ‘this’ keyword in Java\n\nSometimes, in a member\
    \ method it is needed to use the object on which the method is called. Java system\
    \ uses it with this keyword. The object on which the method is called can be referred\
    \ in the method with this.\n\nExample: class keyword\n\n```java\nclass calculate\
    \ {\n    int a,b;\n\n    void getvalue(int p,int q) {\n        a=p;\n        b=q;\n\
    \    }\n\n    void sum(calculate x, calculate y) {\n        this.a=x.a+y.a;\n\
    \        this.b=x.b+y.b;\n    }\n\n    void display() {\n        System.out.println(\"\
    sum of a \" + this.a);\n    }\n\n    public static void main(String args[]) {\n\
    \        calculate obj1 = new calculate();\n        calculate obj2 = new calculate();\n\
    \        calculate obj3 = new calculate();\n        obj1.getvalue(2,3);\n    \
    \    obj2.getvalue(4,6);\n        obj3.sum(obj1,obj2);\n        obj3.display();\n\
    \    }\n}\n```\n\n## 8.5 METHOD CALLING\n\nThere are two ways of method calling.\n\
    \n- Method returns a value\n- Returning nothing (no return value).\n\nMethod calling\
    \ process is simple. When program invokes method, program control moved to called\
    \ method. Then called method returns control to the caller in two conditions.\n\
    \n- First when return statement is execute, and\n- Second when reached to method\
    \ ending closing brace.\n\nThe void Keyword: It allows us to create methods which\
    \ do not return a value.\n\n## 8.6 METHOD OVERLOADING\n\nIt is known when a class\
    \ has two or more methods with the same name but with different parameters.\n\n\
    Example: public class MethodOverloading {\n\n```java\npublic static void main(String[]\
    \ args){\nint w=10;\nint x=5;\ndouble y=6.3;\ndouble z=8.4;\n}\n}\n```"
  mdcn: "\n数组提供了以下基本操作：\n\n- 搜索\n- 排序\n- 插入\n- 删除\n- 合并\n\n# 搜索\n\n这是一个确定给定项目是否存在于数组中的过程。可以通过两种方式实现：\n\
    \n- 线性查找\n- 二分查找\n\n# 线性查找\n\n这是最简单的技术之一，对项目的搜索从数组的开始（即数组的第 0 个位置）开始。该过程一个接一个持续，数组的每个元素都会与给定的数据项进行检查和比较，直到到达数组的末尾。这个过程也称为顺序查找。\n\
    \n# 二分查找\n\n这是另一种使用最小可能时间在给定数组中搜索元素的技术。通过将数组进一步划分为两部分，在数组的任一部分进行搜索。\n\n然而，二分查找仅在数组元素按顺序（升序/降序）排列好时才能应用。它总是将要搜索的元素与排序数组的中间元素进行比较。如果中间成员较小，则在上半部分搜索，否则在下半部分继续搜索。将任一部分部分的中间元素与搜索项进行比较。重复此过程，直到搜索结束。\n\
    \n| 18 | 32 | 50 | 56 | 65 | 79 | 88 |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 0th | 1st | 2nd | 3rd | 4th | 5th | 6th |\n\n![](img/c590c9268607738d8272307d1e7c574c_56_0.png)\n\
    \n# 起 中 后\n\n第 1步：First=0, Last=6, Mid=(First+Last)/2=(0+6)/2=3\n第 2步：num[Mid]=num[3]=55\n\
    55>31\n\n由于 55 大，因此搜索将在数组的第一半部分进行。\n第 3步：Last=Mid-1 3-1=2\n（如果要搜索的数字大于中间值，则 First=Mid+1）。\n\
    Mid=(First+Last)/2=(0+2)/2=1\nNum[Mid]= num[1]=31\n\n| 18 | 32 | 50 |\n| :---\
    \ | :--- | :--- |\n| ↓ 0th | ↓ 1st | ↓ 2nd |\n\n# 起 中 后\n\n# 排序\n\n这是一个按照指定顺序（可以是升序或降序）排列数据的过程。\n\
    \n- 选择排序\n- 冒泡排序\n\n# 选择排序\n\n这是按指定顺序（升序/降序）对给定数据项进行排序的技术之一。假设你必须从未排序的数据按升序排列数字。\n\
    \n第 1步：首先，通过迭代从未排序的数据列表中选择最小的数字。将此数字与第 0th 位置的数字交换（即 16 从 6th 位置移动到 0th 位置，45\
    \ 从 0th 位置移动到 6th 位置）。\n\n| 45 | 98 | 50 | 57 | 90 | 28 | 16 | 78 |\n| :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 0th | 1st | 2nd | 3rd |\
