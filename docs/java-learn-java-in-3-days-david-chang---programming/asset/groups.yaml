    \n算术语句 (Arithmetical Statement)：\n\n如果将算术表达式赋给变量，则称为算术语句。\n\n语法：变量 = 算术表达式;\n\n\
    例如 x = a + b, z=b-4*a\n\n算术运算符类型\n\n- 一元运算符\n- 二元运算符\n- 三元运算符\n\n一元运算符\n\n一元运算符也可以认为是应用于单个操作数的算术运算符。例如\
