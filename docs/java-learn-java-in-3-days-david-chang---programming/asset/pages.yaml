  md: '# 2.4 THE JVM


    JAVA is a high level language (HLL)and the program written in HLL is compiled
    and then converted to an intermediate language called Byte Code. Byte code makes
    a Java program highly portable as its Bytes code can easily be transferred from
    one system to another. When this Byte code is to be run on any other system, an
    interpreter, known as Java Virtual Machine is needed which translates the byte
    code to machine code.


    ![](img/c590c9268607738d8272307d1e7c574c_12_0.png)


    Java machine code varies from different platforms like Windows 98, Unix System,
    etc. Hence, JVM acts as a virtual'
