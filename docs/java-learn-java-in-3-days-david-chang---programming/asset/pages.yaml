  md: '# CLASSES


    Class is a set of different objects. Class can contain fields and methods to explain
    about the behavior of an object. Each object of a class possesses same attributes
    and behavior defined within the same class. Class is also termed as Object factory.


    For Example: If Rainbow is the class then the colors in the rainbow represent
    the different objects of the class Rainbow.


    Similarly, we can consider a class named fruit where apple, mango, orange are
    members of the class fruit. If fruit is defined as a class, then the statement:


    fruit apple = new fruit(); will create an object apple belonging to the class
    fruit.


    # 1.3 DATA ABSTRACTION


    Abstraction refers to the act of representing essential features (relevant data)
    without including background details in order to reduce complexity and increase
    efficiency.


    Abstraction is the absolute property of a class. The class binds the data items
    and functions to promote abstraction. The data members are accessed only through
    the related methods. A class uses the property of abstraction called as abstract
    data type.


    For Example: For driving a car, you only use the essential features without knowing
    in details the internal mechanism of'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'the system. You can apply brake to stop the car, press accelerator to speed
    up the car and press clutch to change the gears.

    Do you ever think what changes are taking place in the machinery? The answer is
    simply No. This act of driving a car is termed as **abstraction**.


    # 1.4 ENCAPSULATION


    **Encapsulation is the system of wrapping up of data and functions into a single
    unit (called class).**


    For Data Hiding **Encapsulation** run on an important **OOP** in Object Oriented
    Programming (OOP), data cannot move freely from method to method. They are kept
    in the corresponding classes in a way that they will not be accessible to the
    outside world except by using them through the related methods.


    It is the most important feature of a class. The functions used in a class can
    only access the data items. These functions provide interface between data items
    of the objects and the calling program.


    Such insulation of data, which cannot be accessed directly outside class premises
    although they are available in the same program, is known as **DATA HIDING.**


    # 1.5 POLYMORPHISM


    The literal meaning of Polymorphism is “available in many forms”. Suppose you
    have developed a method to perform the addition then it will find the sum of two
    numbers passed to the method. In case the passed arguments are strings, the'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'function will produce the concatenated (joined) string.


    Hence, Polymorphism is the ability of different objects to respond, each in its
    own way, to identical messages. It allows the use of different internal structure
    of the object by keeping the same external interface.


    # 1.6 INHERITANCE


    Inheritance can be defined as the process by which objects of one class can link
    and share some common properties of objects from another class.


    An object of a class acquires some properties from the objects of another class.
    Superclass or base class is a class that used basis for inheritance. Subclass
    or derived class is known as a class that inherits from a **superclass.**


    # BENEFITS OF OBJECT ORIENTED PROGRAMMING (OOP)


    Some benefits of OOP are as listed below:


    +   - You can create different modules in your project through objects.

    - You can extend the use of existing class through inheritance.

    - Using the concept data hiding can generate secured program.

    - It is highly beneficial to solve complex problems.

    - It is easy to modify and maintain software complexity.'
