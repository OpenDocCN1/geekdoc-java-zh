    # 2.3 COMPILER AND INTERPRETER


    All high level languages need to be converted into machine code so that the computer
    understands the program after taking the required inputs.


    The conversion of high-level language to machine-level language can be done in
    two possible ways. It can be done either by using a Compiler or an Interpreter.


    The software, by which the conversion of the high level instructions is performed
    by line to machine language, is known as an Interpreter. If an error is found
    on any line, further execution stops till it is corrected. This process of error
    correction is much easier but the program takes longer time to execute successfully.


    # SOURCE CODE -> COMPILER/INTERPRETER -> MACHINE CODE


    However, if all the instructions are converted to machine level language at once
    and all the errors are listed together, then the software is known as Compiler.
    This process is much faster but sometimes it becomes difficult to debug all the
    errors together in a program.


    The Java source code and Java bytecodes are compiles in **javac** command.


    Compilation Syntax: **javac** filename.java'
