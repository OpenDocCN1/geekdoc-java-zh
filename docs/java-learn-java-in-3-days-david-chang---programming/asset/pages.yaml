    # Search


    It is a process to determine whether a given item is present in the array or not.
    This can be done by two ways:


    +   * Linear Search

    * Binary Search


    # Linear Search


    It is one of the simplest technique in which the searching of an item begins at
    the start of an array(i.e. 0th position of the array). The process continues one
    another, where each element of the array is checked and compared with a given
    data item till the end of the array location is reached. This process is also
    called as Sequential Search.


    # Binary Search


    It is the another technique to search an element in the given array by using minimum
    possible time. Searching takes place in either half of the array by further dividing
    it into two halves.


    However, the binary search can be applied only when the array elements are sorted
    into a sequence(ascending/descending).It always compares the element to be searched
    with the middle element of the sorted array. If the middle member is smaller,
    then the search is carried out in upper half, otherwise the search continues in
    the lower half. The middle element of the either half is compared'
