  md: '# Chapter 1 FUNDAMENTALS OF OBJECT ORIENTED PROGRAMMING


    # 1.1 INTRODUCTION (OOP)


    Object Oriented Programming (OOP) is an approach to standardize the programs by
    creating partitioned memory area for both data and method. It has been developed
    to increase the programmer''s productivity and also to overcome the traditional
    approach of programming. The different Object Oriented Programming languages are
    C++, Java, Simula-67, etc.


    An Object Oriented Programming (OOP) allows the data to be applied within designated
    program area. It gives more significance to data rather than Methods which means
    it also provides the reusability feature to develop productive logic.


    # FEATURES OF OBJECT ORIENTED PROGRAMMING (OOP)


    +   * The objects can be used as a bridge to have data flow from one method to
    another.

    * It gives importance to data items rather than methods.

    * It makes the complete program simpler by dividing it into a number of objects.

    * Data can be easily modified without any change in the method.


    # PRINCIPLES OF (OOP)'
