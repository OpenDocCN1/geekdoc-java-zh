  \ w-100 mt-3\" /></form></</body>></</html>>\n```\n\n### 重点：从 messages.properties\
  \ 获取值\n要显示从 `messages.properties` 检索的值，请将 `#{key name}` 指定为 `th` 属性的值。这会从 `messages.properties`\
  \ 中检索相应键的值。\n\n性别单选按钮上显示的字符串是由服务设置的。修改服务以从 `messages.properties` 中获取字符串。背景颜色改变的部分是修改过的。\n\
  \n```java\n[UserApplicationService.java]\npackage com.example.application.service;\n\
  import java.util.LinkedHashMap;\nimport java.util.Locale;\nimport java.util.Map;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.context.MessageSource;\n\
  import org.springframework.stereotype.Service;\n\n@Service\npublic class UserApplicationService\
  \ {\n    @Autowired\n    private MessageSource messageSource;\n\n    /** 生成性别 Map\
  \ */\n    public Map<String, Integer> getGenderMap() {\n        Map<String, Integer>\
  \ genderMap = new LinkedHashMap<>();\n        String male = messageSource.getMessage(\"\
  male\", null, Locale.ENGLISH);\n        String female = messageSource.getMessage(\"\
  female\", null, Locale.ENGLISH);\n        genderMap.put(male, 1);\n        genderMap.put(female,\
  \ 2);\n        return genderMap;\n    }\n}\n```\n\n### 重点：MessageSource\n要从 `messages.properties`\
  \ 获取值，使用 `MessageSource`。你可以使用 `MessageSource` 的 `getMessage` 方法来获取消息。\n\n```\n\
  [getMessage 方法]getMessage(key name, embedded parameter, locale)\n```\n\n| 参数 | 描述\
  \ |\n| --- | --- |\n| key name | messages.properties 的键名。 |\n| embedded parameter\
  \ | 包含在消息中的参数。 |\n| locale | 指定语言（区域）。 |\n\n如果你使用 `MessageSource`，在注册完成后也可以获取消息。\n\
