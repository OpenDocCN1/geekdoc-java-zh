  \n### 总结\n\n以下在本章中学到的。\n\n## REST 概述\n\n*   REST 允许你使用外部 Web 服务。\n*   使用 REST 有以下优势：\n\
  \    *   通过减少通信量提高处理速度\n    *   提高用户操作性\n\n## REST 实现\n\n*   使用 `@RestController`\
  \ 为用于 REST 的控制器。\n*   如果启用了 CSRF 措施，请发送 CSRF token。\n*   在 jQuery 中，使用 `$.ajax`\
  \ 函数发送请求。\n\n# 13. Spring Data JPA\n\n在本章中，你将学习如何结合 Spring 使用 JPA。\n\n* 概述\n* 基础\n\
  * 高级\n\n### 13.1 概述\n\nJPA 是 Java 标准的 O/R 映射。如果是简单的 SQL，它将自动生成而无需编写 SQL。因此，可以提高开发效率。JPA\
  \ 是 Java Persistence API 的缩写。\n\n然而，如果你尝试直接使用 JPA，会有一些棘手的部分。但是，如果你使用 Spring Data\
  \ JPA，就可以在不考虑棘手部分的情况下使用 JPA。\n\n#### 注意：什么是 Spring Data？\n\n你实现的代码取决于你使用的哪个数据库产品。在\
  \ Oracle 和 PostgreSQL 等 RDB 产品之间，代码不会发生显著变化。然而，RDB 和 NoSQL 之间的代码非常不同。NoSQL 是一种结构与关系型数据库完全不同的数据库。Spring\
  \ Data 是一个消除 RDB 和 NoSQL 等差异的库。\n\n### 13.2 基础\n\n现在让我们学习如何使用 JPA。首先，你将从基础用法开始。\n\
  \n* CRUD\n* 任意 SQL\n\n#### 13.2.1 CRUD\n\n### 概述\n\n首先学习使用 JPA 进行 CRUD 操作。CRUD 是创建（Create）、读取（Read）、更新（Update）和删除（Delete）的缩写。即\
  \ SQL 的插入、查询、更新、删除。\n\n你将用 JPA 替换访问数据库的 MyBatis 部分。因此，某些功能可以使用，某些功能暂时无法使用。最终，所有功能都可用。\n\
  \n在 MyBatis 中创建的功能中，你需要创建以下功能：\n\n| 功能 | 对应 |\n| --- | --- |\n| 注册用户 | ✓ |\n| 获取多个用户\
  \ | ✓ |\n| 获取单个用户 | ✓ |\n| 更新用户 | - |\n| 删除用户 | ✓ |\n| 获取登录用户 | ✓ |\n| 动态 SQL 生成（更改搜索条件）\
  \ | - |\n| 获取部门主 | - |\n| 获取部门列表 | - |\n\n在本节中，你将创建对应勾选标记的功能。目录结构如下。背景颜色更改的部分是需要添加的新部分![](img/image_rsrcUD.jpg)\n\
  \n```text\nSpringBootSample\n src/main\n  java\n    com.example\n      aspect\n\
  \      config\n      controller\n      domain\n        user\n      model\n     \
  \ service\n        impl\n          UserDetailsServiceImpl.java\n          ServiceImpl.java\n\
  \          ServiceImpl2.java (创建一个新类)\n          UserService.java\n      form\n\
  \      hello\n      repository\n        UserMapper.java\n        UserRepository.java\
  \ (创建一个新接口)\n      rest\n        UserRestController.java\n      SpringBootSampleApplication.java\n\
  \  resources\n pom.xml\n```\n\n# 源代码\n\n首先，修改 `pom.xml` 以添加 JPA 库。在 `pom.xml` 的\
  \ `dependencies` 标签内添加以下代码。背景颜色更改的部分是添加的部分。\n\n```xml\npom.xml\n<dependencies>\n\
  ```\n\n\n\n\n\n<!-- JPA -->\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-data-jpa</artifactId>\n</dependency>\n<!--\
  \ ... -->\n\n接下来，添加 JPA 设置。背景颜色发生的部分是修改部分。\n\n`[application.properties]`\n```properties\n\
