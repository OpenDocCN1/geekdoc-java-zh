  \n[Department.java]\n```java\npackage com.example.domain.user.model;\nimport javax.persistence.Entity;\n\
  import javax.persistence.Id;\nimport javax.persistence.Table;\nimport lombok.Data;\n\
  \n@Data\n@Entity\n@Table (name=\"m_department\" )\npublic class Department {\n \
  \   @Id\n    private Integer departmentId ;\n    private String departmentName ;\n\
  }\n```\n通过添加 `@Entity` 等注解，使 JPA 将其识别为实体类。\n\n然后修改用户主表实体类。背景颜色改变的部分为修改部分。\n\n[MUser.java]\n\
  ```java\npackage com.example.domain.user.model;\nimport java.util.Date;\nimport\
  \ java.util.List;\nimport javax.persistence.JoinColumn;\nimport javax.persistence.ManyToOne;\n\
  import javax.persistence.Entity;\nimport javax.persistence.Id;\nimport javax.persistence.Table;\n\
  import javax.persistence.Transient;\nimport lombok.Data;\n\n@Data\n@Entity\n@Table\
  \ (name=\"m_user\" )\npublic class MUser {\n    @Id\n    private String userId ;\n\
  \    private String password ;\n    private String userName ;\n    private Date\
  \ birthday ;\n    private Integer age ;\n    private Integer gender ;\n    private\
  \ Integer departmentId ;\n    private String role ;\n\n    @ManyToOne (optional\
  \ = true )\n    @JoinColumn (insertable=false , updatable=false , name = \"departmentId\"\
  \ )\n    private Department department ;\n\n    @Transient\n    private List<Salary>\
  \ salaryList ;\n}\n```\n\n#### 点 1: @ManyToOne\n在字段上使用 `@ManyToOne` 注解来表示多对一关系。使用\
  \ `@ManyToOne` 是因为用户表是“多”，而部门表是“一”。`optional` 属性指定该字段是否允许为空。\n\n| optional | null\
  \ | 如何连接表 |\n| --- | --- | --- |\n| true | 允许为空 | 左连接 (Left join) |\n| false | 不允许为空\
  \ | 内连接 (Inner join) |\n\n换句话之，`optional` 属性指定了连接表的方式。`optional` 属性的默认值为 `false`。\n\
  \n#### 点 2: @JoinColumn\n使用 `@JoinColumn` 注解指定要连接的列。该注解也用于一对一关系中的表连接。在 `name` 属性中，指定目标表的列名。\n\
  \n如果你使用 JPA 的 `save` 方法，将自动执行插入/更新。`insertable` 和 `updatable` 属性指定该字段是否应包含在插入和更新目标中。在示例代码中，这意味着\
  \ `department` 不包含在插入和更新中。### 执行\n当显示用户详情界面时，将显示部门名称。（执行结果省略）。\n\n在本次修改中，仅在实体类的字段上添加了注解。在显示用户详情界面时执行的方法仍然是\
