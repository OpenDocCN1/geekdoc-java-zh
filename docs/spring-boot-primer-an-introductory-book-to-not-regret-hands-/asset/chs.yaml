  \ configure(AuthenticationManagerBuilder auth) throws Exception {…(Omitted)}\n}\n\
  ```\n\n### 重点：注出处理\n使用以下方法来设置注出流程。\n\n- `logoutRequestMatcher()`\n  在 Spring 中，默认情况下，注出过程是通过\
  \ `POST` 方法发送的。如果你想通过 `GET` 方法发送注出请求，请添加此方法。在本书中我将其放在这里以供参考。\n- `logoutUrl(\"path\"\
  )`\n  设置注出请求路径。也就是说，使 HTML 文件中 `[th:action=\"@{/logout}\"]` 的路径与此方法的设置值相匹配。此方法是使用\
  \ `POST` 方法注出时的设置。\n- `logoutSuccessUrl(\"path\")`\n  指定注出成功后的跳转目标。\n\n### 执行\n\
  运行 SpringBoot 并登录。从用户列表界面点击“注出”按钮。\n[用户列表界面]\n![11-2-6-display-image](img/image_rsrcDWS.jpg)\n\
  如果你跳转到登录界面并显示以下 URL，说明你已成功注出。\n[注出后的 URL]\n`http://localhost:8080/login?logout`\n\
  \n**注意：不需要注出控制器**\n由于 Spring Security 会处理注出过程，因此不再需要在控制器中处理注出。即使注释掉注出控制器的代码，注出处理也会完成。目前为止，注出控制器仅用于页面跳转。\n\
  \n---\n\n## 11.2.7 CSRF 措施\n\n### 概述\n首先，我将解释什么是 CSRF 措施。\n[什么是 CSRF？]\n![](img/image_rsrcDWT.jpg)\n\
  什么是 CSRF 攻击？它是向网站发送用户并非意的请求。例如，创建一个让坏人通过抽奖赚大钱的网站。该网站会要求你输入个人信息来抽奖。用户信息将允许你访问另一个网站并购买昂贵的物品。\n\
  它是跨站请求伪造（Cross Site Request Forgeries）的缩写，被称为 CSRF。\n\n[什么是 CSRF 措施？]\n![](img/image_rsrcDWU.jpg)\n\
  为了防止 CSRF，用 Spring 创建的网站现在将包含令牌（token）。令牌是一个随机字符串。\n如果你发送的请求没有令牌，它将被视为外部请求。结果是请求会被拒绝。当使用\
  \ `GET` 以外的方法进行请求时，需要此令牌。在使用 `GET` 方法显示屏幕时，没有必要在参数中包含令牌。\n引入 Spring security 后，CSRF\
  \ 措施默认启用。目前为止，为了学习，CSRF 措施一直是禁用的。在本节中，你将启用 CSRF 措施。\n\n#### 目录\n目录结构没有变化。\n\n####\
  \ 源码\n修改安全配置类以启用 CSRF 措施。背景颜色改变的部分是修改部分。\n[SecurityConfig.java]\n\n```java\n@EnableWebSecurity\n\
  @Configuration\npublic class SecurityConfig extends WebSecurityConfigurerAdapter\
  \ {\n    @Autowired\n    private UserDetailsService userDetailsService;\n\n    @Bean\n\
  \    public PasswordEncoder passwordEncoder() {\n        return new BCryptPasswordEncoder();\n\
  \    }\n\n    /** Set a target out-of-security */\n    @Override\n    public void\
  \ configure(WebSecurity web) throws Exception {…(Omitted)}\n\n    /** Various security\
  \ settings */\n    @Override\n    protected void configure(HttpSecurity http) throws\
  \ Exception {\n        // Set of login unnecessary page\n        http.authorizeRequests()\n\
  \            .antMatchers(\"/login\").permitAll() // Direct link OK.\n         \
  \   .antMatchers(\"/user/signup\").permitAll() // Direct link OK.\n            .anyRequest().authenticated();\
  \ // Otherwise direct link NG\n\n        // Login process\n        http.formLogin()\n\
  \            .loginProcessingUrl(\"/login\") // Login process path\n           \
  \ .loginPage(\"/login\") // Specify login page\n            .failureUrl(\"/login?error\"\
  ) // Transition destination when login fails.\n            .usernameParameter(\"\
  userId\") // Login page user ID\n            .passwordParameter(\"password\") //\
  \ Login page password\n            .defaultSuccessUrl(\"/user/list\", true); //\
  \ Transition destination after success\n\n        // Logout process\n        http.logout()\n\
  \            .logoutRequestMatcher(new AntPathRequestMatcher(\"/logout\"))\n   \
  \         .logoutUrl(\"/logout\")\n            .logoutSuccessUrl(\"/login?logout\"\
  );\n\n        // Disable CSRF measures (temporary)\n        // http.csrf().disable();\n\
  \    }\n\n    /** Authentication settings */\n    @Override\n    protected void\
  \ configure(AuthenticationManagerBuilder auth) throws Exception {…(Omitted)}\n}\n\
  ```\n\n接下来，修改用户注册界面以发送 CSRF 令牌。背景颜色改变的部分是修改部分。\n[signup.html]\n```html\n<!DOCTYPE\
