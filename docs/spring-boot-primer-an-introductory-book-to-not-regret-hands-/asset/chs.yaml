  不会跳转到通用错误界面。此时，登录界面上将显示错误消息。\n\n## 11.2.3 内存认证\n\n### 概述\n接下来，创建一个内存认证。内存认证是一种允许你通过准备临时的用户\
  \ ID 和密码来登录的功能。此功能允许你在没有用户表或数据的情况下进行登录。因此，安全性不会阻止开发。\n\n#### 目录\n目录结构没有变化。\n\n####\
  \ 源码\n修改安全配置类。背景颜色改变的部分为修改部分。`[SecurityConfig.java]`\n\n```java\npackage com.example.config;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.authentication.builders.AuthenticationManagerBuilder;\n\
  \nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;import\
  \ org.springframework.security.config.annotation.web.builders.WebSecurity;import\
  \ org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;import\
  \ org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;@EnableWebSecurity\n\
  @Configuration\npublic class SecurityConfig extends WebSecurityConfigurerAdapter\
  \ {/** 设置一个安全外目标 */@Override\npublic void configure(WebSecurity web ) throws Exception\
  \ {…(Omitted)}/** 各安全设置 */@Override\nprotected void configure(HttpSecurity http\
  \ ) throws Exception {…(Omitted)}/** 认证设置 */@Override\nprotected void configure(AuthenticationManagerBuilder\
  \ auth ) throws Exception {// 内存认证\nauth.inMemoryAuthentication().withUser(\"user\"\
  \ ) // 添加用户.password(\"user\" ).roles(\"GENERAL\" ).and().withUser(\"admin\" ) //\
  \ 添加 admin.password(\"admin\" ).roles(\"ADMIN\");}}\n```\n\n#### Point: 内存认证\n可以使用\
  \ `auth.inMemoryAuthentication()` 方法创建内存认证。在 `inMemoryAuthentication()` 方法之后，调用以下方法来添加用户。\n\
  \n*   `withUser(\"用户 ID\")`\n*   `password(\"密码\")`\n*   `roles(\"角色名称\")`\n\n你可以通过\
  \ `and()` 方法连接它们来添加多个用户。\n\n然后修改消息属性以更改登录失败时的消息。背景颜色改变的部分为修改部分。`[messages.properties]`\n\
  \n```properties\nuser.signup.title=User Signup\nuser.signup.btn=signup\nuserId=User\
  \ ID\npassword=Password\nuserName=User Name\nbirthday=Birthday\nage=Age\nmale=Male\n\
  female=Female\ngender=Gender\n# =================#\n# 登录失败消息\n# =================\n\
  AbstractUserDetailsAuthenticationProvider.locked=Account is locked\nAbstractUserDetailsAuthenticationProvider.disabled=Account\
  \ is not available\nAbstractUserDetailsAuthenticationProvider.expired=Account has\
  \ expired\nAbstractUserDetailsAuthenticationProvider.credentialsExpired=Password\
  \ has expired\nAbstractUserDetailsAuthenticationProvider.badCredentials=ID or password\
  \ is incorrect\n```\n\n使用 Spring Security，你可以在登录时进行各种检查。在示例代码中，更改了对应这些检查的消息。然而，书中的示例仅显示“ID\
  \ or password is incorrect”消息。\n\n### 执行\n运行 `SpringBoot` 访问登录界面。尝试使用为内存认证设置的用户\
  \ ID 和密码进行登录。`[Login screen]`![11-2-3-display-image](img/image_rsrcDWM.jpg)\n错误消息已经改变，但登录仍然失败。这是因为\
  \ Spring Security 需要密码加密。\n\n## 11.2.4 密码加密\n\n### 概述\n在本节中，你将学习如何创建密码加密。创建以下过程：\n\
  \n*   对内存认证用户密码加密。\n*   对用户注册/更新的密码加密。\n\n这将允许你使用内存认证进行登录。\n\n#### 目录\n目录结构没有变化。\n\
  \n#### 源码\n修改安全配置类。背景颜色改变的部分为修改部分。`[SecurityConfig.java]`\n\n```java\npackage com.example.config;\n\
  import org.springframework.context.annotation.Bean;\n\nimport org.springframework.context.annotation.Configuration;\n\
  import org.springframework.security.config.annotation.authentication.builders.AuthenticationManagerBuilder;\n\
  \nimport org.springframework.security.config.annotation.web.builders.HttpSecurity;import\
  \ org.springframework.security.config.annotation.web.builders.WebSecurity;import\
  \ org.springframework.security.config.annotation.web.con figuration.EnableWebSecurity;import\
  \ org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;import\
  \ org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;import org.springframework.security.crypto.password.PasswordEncoder;@EnableWebSecurity\n\
  @Configuration\npublic class SecurityConfig extends WebSecurityConfigurerAdapter\
  \ {\n@Bean\npublic PasswordEncoder passwordEncoder() {return new BCryptPasswordEncoder();}\n\
  /** 设置一个安全外目标 */@Override\npublic void configure(WebSecurity web ) throws Exception\
  \ {…(Omitted)}/** 各安全设置 */@Override\nprotected void configure(HttpSecurity http\
  \ ) throws Exception {…(Omitted)}/** 认证设置 */@Override\nprotected void configure(AuthenticationManagerBuilder\
  \ auth ) throws Exception {PasswordEncoder encoder = passwordEncoder();\n\n// 内存认证\n\
  auth.inMemoryAuthentication().withUser(\"user\" ) // 添加用户.password(encoder .encode(\"\
  user\" )).roles(\"GENERAL\" ).and().withUser(\"admin\" ) // 添加 admin.password(encoder\
  \ .encode(\"admin\" )).roles(\"ADMIN\");}}\n```\n\n\n\n\n### `UserServiceImpl.java`\n\
