- "# Spring Boot 入门指南：一本不后悔的入门：[实用指南]从基础学习 Spring Boot 2.4——Java, Spring Data JPA,\
  \ Spring MVC, Spring Security, Spring Web, Mybatis, Spring Framework\n\n\n\n![](img/image_rsrcDTR.jpg)\n\
  \n\n如果你手里拿着这本书，说明你可能计划在未来使用 `Spring(Spring Boot)` 进行开发。每个人在第一次尝试新事物时都会感到焦虑和恐惧。（同时，你也可能感到很兴奋）。但这是一件好事。因为我们正努力消除这种焦虑。无论原因何，尝试新事物都会带来成长。未知越多，成长的程度就越大。因此，对于已经迈出这一步的你，成长正等待着你。\n\
  \n当我开始学习 `Spring` 时，我买了很多与 `Spring`相关的书籍（因为我很害怕）。但我并没有找到一本满意的书。为了改变这种局面，我们在 2018\
  \ 年出版了这本书的第一版。由于 `Spring` 也在演进，我出版了第二版。\n\n在书中，你将使用 `Spring` 创建一个 Web 应用程序。从学习 `Spring`\
  \ 的基础知识开始，逐步完成你的应用程序。通过这种方式，你不仅能够掌握 `Spring`，还能获得 Web 开发所需的知识。换句话说，你可以从对 Web 开发一无所知，提升到能够一次性精通\
  \ `Spring`。\n\n然而，这本书强调实践而非理论。学习方法有很多，但亲身实践是学习的最高效的方法之一。这是因为科学证明，输出的知识留存率很高。此外，当你实际动手制作并执行它时，你的焦虑和恐惧就会消失，从而获得信心。虽然实际动手做会更好，但起初只读书也可以的。由于所有的示例代码都可以下载，你甚至可以从中间开始创建应用程序。\n\
  \n## 关于第二版\n\n自本书第一版出版以来，我非常荣幸地收到了许多高评价。\n\n[第一版评价]\n![review-001](img/image_rsrcDTS.jpg)![review-002](img/image_rsrcDTT.jpg)![review-003](img/image_rsrcDTU.jpg)\n\
  \n在第二版中，我进行了以下修改：\n\n*   添加了关于 `MyBatis` 和 `JPA` 的内容\n*   修改了 `REST` 使其更具实践性\n*\
  \   支持 `SpringBoot 2.4`\n\n这些都是开发领域经常使用的功能。因此，实战性内容在增加。\n\n## 彻底追求清晰！\n\n为了方便理解，书中按照顺序描述了以下内容：\n\
  \n*   **融入大量插图**：解释时是否有图表，理解的难易程度会发生巨大变化。因此，本书包含了许多插图，使其更易理解。\n*   **循序渐进**：教某个东西时有些要点需要注意。那就是一次只讲一件事。同时告诉多件事会让人困惑。由于书籍只能通过文字和图表来解释，我将逐一为你讲解。\n\
  *   **明确目标**：在实际编写示例代码之前，我会先解释要做什么。如果你知道自己的目标，理解起来会更好。\n\n我们还在解释 `DI`（依赖注入）方面投入了大量精力。其他书籍是为高级\
  \ Java 用户和经验 Spring 用户解释 `DI` 的。但这本书描述 `DI` 的方式让即使是 Java 初学者也能理解。\n\n## 本书结构\n\n\
  请按顺序阅读，从第 1 章开始，你将逐步构建你的应用程序。例如，首先显示 `Hello World`，然后是验证（输入检查）、然后是界面布局、数据库操作等等等。\n\
  \n## 目标读者\n\n在阅读本书时，最好具备以下知识：\n\n*   `Java` 基础\n*   `HTML` 基础\n*   `SQL` 基础\n\n\
  基础水平知识即可。\n\n## 应用程序配置\n\n本文开发的 Web 应用程序将使用以下配置创建：\n\n*   `Spring`: 5\n*   `Spring\
  \ Boot`: 2.4.1\n*   `Database`: H2\n*   这是写作时的最新版本。\n\n现在，开始读这本书吧。\n*使用电子书浏览时，我建议使用平板设备。*\n\
  \n\n# 附录\n示例源码\n\n# 结语\n\n# Spring 概述\n本章描述了 Spring 的概述。\n\n## 1.1 什么是 Spring?\n\
  Spring 是一个用于 Java 开发的框架。以前有几个框架。然而，使用 Spring 作为 Java 开发的框架已成为常识。这是因为比其他框架开发起来更简单、更快。它还功能丰富，可以胜任任何项目。\n\
  \n### 1.1.1 什么是框架？\n让我们先考虑不使用框架的情况。在这种情况下，需要从零开始构建应用程序。例如，假设你创建一个登录功能。在这种情况下，有必要创建一个程序，从数据库中检索用户信息并验证密码。\n\
  \n现在考虑考虑框架。框架预先提供了一些常用功能。开发者只需要创建他们想要更改的功能部分。然后框架会调用执行该更改的程序。对于登录功能，开发者只需创建用于检索用户信息的\
  \ SQL。框架提供了其他处理。\n\n[图] 什么是框架？![1-1-FrameWork](img/image_rsrcDTV.jpg)\n\n换句话说，使用框架，你只需要通过创建程序的必要部分就可以创建一个应用程序。由于不需要创建所有的程序，开发效率将会提高。因此，在开发中使用框架是常识。\n\
  \n顺便提一下，调用所创建程序的一侧被称为“控制反转”（简称为 **IoC**）。这个思想也可以在 DI（依赖注入）中看到。\n\n## 1.2 什么是 Spring\
  \ Boot?\nSpring Boot 是一个省去初始化 Spring 烦恼的框架。在 Spring Boot 出现之前，Spring 的初始配置可能会让你感到头疼。因为你需要准备一个\
  \ xml 文件来使用 Spring 的功能。对专业知识的需求（例如如何编写 xml 文件）导致初始设置非常繁琐，并延迟了开发。\n\n为了解决这个问题，创建了\
  \ Spring Boot。在 Spring Boot 中，你只需要选择你想在应用程序中使用的函数。之后，Spring Boot 将自动执行初始设置。你只需简单地更改属性的值即可轻松更改设置。Spring\
  \ Boot 现在之所以被使用，是因为它可以提高开发效率。\n\n将此与制作蛋糕进行类比如下：\n\n*   **Spring**\n    这仅仅是材料的对齐。\n\
  *   **Spring Boot**\n    如果你选择了制作蛋糕的原料，蛋糕已经在某种程度上完成了。你所做的只是放上草莓并进行各种装饰。\n\n# 2.\
  \ 构建开发环境\n在创建程序之前，让我们先构建开发环境。Spring 有两种 eclipse。一个是普通的 eclipse。普通的 eclipse 通过添加插件来实现。另一个是\
  \ Spring 用的 eclipse。两种 eclipse 的功能相同。书中列出了两种设置方法，请选择易于使用的一种。\n\n*   普通 eclipse\n\
  *   安装 Spring 专用 eclipse\n*   安装 Lombok\n\n## 2.1 普通 eclipse\n如果你使用普通的 eclipse，请添加插件。你就可以用\
  \ Spring 进行开发。\n\n## 2.2 安装 Spring 专用 eclipse\n专门用于 Spring 的 eclipse 称为 SpringToolSuite。最初被称为\
  \ STS。由于 STS 中不包含 JDK，请提前安装 JDK。\n\n### 2.2.1 安装 STS\n现在让我们安装 STS。搜索 \"sts download\"\
  \ 以显示下载站点。[STS 下载站点](https://spring.io/tools)\n\n根据 你的操作系统下载文件。本书以 Windows 版本为例。将下载的\
  \ jar 文件放在你选择的路径下。然后，在书中将 jar 文件直接放在 C 盘根目录下 (`C:\\`）。双击 jar 文件创建一个名为 `sts-4.9.RELEASE`\
  \ 的文件夹。文件夹内部有一个名为 `SpringTool4.exe` 的文件。这就是 STS 的 eclipse。\n\n## 2.3 安装 Lombok\n\
  在创建项目之前，添加一个名为 Lombok 的实用库。Lombok 会自动生成非本质代码。例如，如 getter 和 setter 等方法会自动生成。它非常方便，并用于大多数开发环境。如何使用此功能的细节将在第\
  \ 3 章及后续章节介绍。\n\n※最新版本的 eclipse 可能自带 Lombok。\n※在关闭 eclipse 或 STS 的情况下安装 Lombok。\n\
  \n首先，下载 Lombok jar 文件。你可以通过搜索 \"lombok download\" 找到下载站点。[Lombok 下载站点](https://projectlombok.org/download)\n\
  \n点击 `1.18.XX` 下载 `lombok.jar` 文件。双击 `lombok.jar` 文件启动安装程序。等待一会儿，将显示 `eclipse.exe`\
  \ 或 `SpringToolSuite4.exe` 的路径。如果一段时间后路径未出现，点击 `Specify`。你可以指定 `eclipse.exe` 和 `SpringToolSuite4.exe`\
  \ 的路径。选择你想要安装 Lombok 的 exe 文件，并按下 `Install/Update` 按钮。如果显示 \"Install successful\"\
  ，则安装完成。\n\n## 2.4 创建项目\n如果未安装插件，请执行以下操作：选择 Help（帮助）> Eclipse Marketplace（插件市场）。在搜索字段中输入\
  \ \"spring\"。如果显示 Spring 工具，选择 Spring 工具。如果插件已安装，请配置设置。接受许可并点击 Finish（完成）。插件将在一段时间后安装完成。然后重启\
  \ eclipse。\n\n注意：`eclipse.ini`, `SpringToolSuite4.ini`\n如果 Lombok 工作不正常，请以 clean\
  \ 模式启动 eclipse 或清理项目。\n\n\n\n\n\n如果 Lombok 仍然不起，请检查 `eclipse.ini` 或 `SpringToolSuite4.ini`\
  \ 文件的内容。确保 `-javaagent` 中设置了 `lombok.jar` 的路径。\n\n```ini\n[eclipse.ini]\n-javaagent:C:\\\
  pleiades\\eclipse\\lombok.jar\n```\n\n## 2 创建项目\n让我们创建一个 SpringBoot 项目。在创建项目时，你必须连接互联网以下载库。\n\
  \n1. 右键点击 `Project Explorer` > `New` > `Other`![](img/image_rsrcDU7.jpg)\n2. 在 `SpringBoot`\
  \ 中选择 `Spring Starter Project`![](img/image_rsrcDU8.jpg)\n3. 在 `Name` 字段中输入所需的项目名称。在本书中，项目名称为\
  \ `SpringBootSample`![](img/image_rsrcDU9.jpg)\n4. 选择项目中要使用的库。选择库后，点击 `[Finish]`。稍片后，项目将被创建并下载库![](img/image_rsrcDUA.jpg)\n\
  \n※ 根据 `SpringBoot` 的版本，库的名称可能会发生变化。\n※ 默认指定最新版本的 `Spring Boot`。如果你想更改 `Spring Boot`\
  \ 的版本，可以在名为 `pom.xml` 的文件中进行更改。添加了以下库。\n\n| 分类 | 库 |\n| :--- | :--- |\n| 开发者工具 |\
  \ Spring Boot DevTools |\n| Lombok | Lombok |\n| SQL | JDBC API |\n| | Spring Data\
  \ JDBC |\n| | H2 Database |\n| 模板引擎 | Thymeleaf |\n| Web | Spring Web |\n\n注意：所选库提供了每个库的概述。\n\
  \n*   **Spring Boot DevTools**\n    `SpringBootDevTools` 是一个提高开发效率的辅助工具。它会自动重启 Web\
  \ 应用。例如，假设你修改并保存了 Java 代码。在这种情况下，在重启 Web 应用之前更改不会生效。通过安装 `SpringBootDevTools`，你可以在保存文件的一刻自动重启\
  \ Web 应用。这减少了重启操作并提高了开发效率。\n*   **Lombok**\n    你可以使用你的 `Lombook`。\n*   **JDBC API、Spring\
  \ Data JDBC**\n    `Spring` 允许你使用 `JDBC` 运行 SQL。\n*   **H2**\n    `H2` 数据库不需要设置。因此，它可以作为学习和测试环境的数据库。\n\
  *   **Thymeleaf**\n    `Thymeleaf` 是 `SpringBoot` 作为标准的 HTML 模板引擎。模板引擎是将 HTML 模板和数据合成为\
  \ HTML 的能力。例如，Java 的 `list` 可以被循环并显示为列表。\n    在使用 `Thymeleaf` 之前，`JSP` 是一种流行的模板引擎。`JSP`\
  \ 将 Java 代码放在 HTML 中，导致 HTML 非常难以阅读。`Thymeleaf` 改进了这一点，使 HTML 更容易理解。\n*   **Web**\n\
  \    你可以使用 `SpringMVC` 开发 Web 应用。\n\n注意：关于 Maven\n当你创建一个 `SpringBoot` 项目时，它包含一个名为\
  \ `Maven` 的项目管理工具。`Maven` 管理库依赖等。库可能是使用不同的库创建的。在这种情况下，如果不是从开发源库顺序加载 Java，将会发生错误。然而，`Maven`\
  \ 会确定它们的关系并按顺序加载。换句话说，`Maven` 让项目管理变得更容易。要添加、删除或更改库的版本，请编辑 `pom.xml` 文件。项目中要的库放在\
  \ `<dependencies>` 标签中。\n\n```xml\n[pom.xml]\n<dependencies>\n  <dependency>\n \
  \   <groupId> org.springframework.boot</groupId>\n    <artifactId> spring-boot-starter-data-jdbc\
  \ </artifactId>\n  </dependency>\n  <dependency>\n    <groupId> org.springframework.boot</groupId>\n\
  \    <artifactId> spring-boot-starter-jdbc</artifactId>\n  </dependency>\n  <dependency>\n\
  \    <groupId> org.springframework.boot</groupId>\n    <artifactId> spring-boot-starter-thymeleaf</artifactId>\n\
  \  </dependency>\n  <dependency>\n    <groupId> org.springframework.boot</groupId>\n\
  \    <artifactId> spring-boot-starter-web</artifactId>\n  </dependency>\n  <dependency>\n\
  \    <groupId> org.springframework.boot</groupId>\n    <artifactId> spring-boot-devtools</artifactId>\n\
  \    <scope> runtime</scope>\n    <optional> true</optional>\n  </dependency>\n\
  \  <dependency>\n    <groupId> com.h2database</groupId>\n    <artifactId> h2</artifactId>\n\
  \    <scope> runtime</scope>\n  </dependency>\n  <dependency>\n    <groupId> org.projectlombok</groupId>\n\
  \    <artifactId> lombok</artifactId>\n    <optional> true</optional>\n  </dependency>\n\
  \  <dependency>\n    <groupId> org.springframework.boot</groupId>\n    <artifactId>\
  \ spring-boot-starter-test</artifactId>\n    <scope> test</scope>\n  </dependency>\n\
  </dependencies>\n```\n\n你之前选择的库以及 `SpringBoot` 默认安装的库。这些是第 3 章所需的库。第 3 章及之后需要的函数将根据需要添加。你的开发环境现在已经就绪了。在接下来的章节中，我们将创建一个简单的示例。\n\
  \n# 3. Hello World…\n### 创建一个简单的示例\n本章有两个目的：\n*   熟悉使用 `Spring Boot`\n*   了解 `Spring\
  \ Boot` 的便利性\n\n为了实现这一点，你创建一个简单的 Web 页面示例。示例按以下顺序创建：\n*   显示 HTML\n*   在页面之间传递值\n\
  *   从数据库获取值\n\n### 3.1 显示 HTML\n### 概述\n创建一个显示“Hello World”页面的示例。显示的页面如下：\n[示例图片]![3-1-DisplayImage](img/image_rsrcDUB.jpg)\n\
  \n在服务端（`SpringBoot`），创建一个名为 `controller` 的类。\n[处理概述]![3-1-Process](img/image_rsrcDUC.jpg)\n\
  \n1.  **请求 (GET 方法)**\n    在浏览器中输入 URL 发送 HTTP 请求。\n2.  **响应 (hello.html)**\n  \
  \  当向服务器发送 `\"http://localhost:8080/hello\"` 请求时，`HelloController.java` 接收该操作。`HelloController.java`\
  \ 将 `hello.html` 返回给浏览器。\n\n注意：HTTP GET 方法\n当你在浏览器中输入 URL 时，请求通过 HTTP 的 `GET` 方法发送。`GET`\
  \ 方法用于从服务器获取数据。\n\n\n\n\n\n# 注意：什么是控制器 (Controller)?\n\n控制器是一个接收请求的类。\n\n#### 目录\n\
  项目中的目录结构如下。背景颜色改变的部分为新添加的部分。\n![](img/image_rsrcDUD.jpg) SpringBootSample\n┗ ![](img/image_rsrcDUE.jpg)\
  \ src/main\n   ┣ ![](img/image_rsrcDUE.jpg) java\n   ┃┗ ![](img/image_rsrcDUE.jpg)\
  \ com.example\n   ┃   ┣ ![](img/image_rsrcDUF.jpg) hello (创建新包)\n   ┃   ┃┗ ![](img/image_rsrcDUG.jpg)\
  \ HelloController.java (创建新的 Java 类)\n   ┃   ┗ ![](img/image_rsrcDUH.jpg) SpringBootSampleApplication.java\n\
  \   ┣ ![](img/image_rsrcDUE.jpg) resources\n   ┃┣ ![](img/image_rsrcDUJ.jpg) static\n\
  \   ┃┣ ![](img/image_rsrcDUJ.jpg) templates\n   ┃┃┗ ![](img/image_rsrcDUK.jpg) hello.html\
  \ (创建一个 HTML 文件)\n   ┃┗ ![](img/image_rsrcDUM.jpg) application.properties\n   ┗\
  \ ![](img/image_rsrcDUM.jpg) pom.xml\n\n## 注意：SpringBootSampleApplication.java\n\
  当你创建一个 Spring Boot 项目时，系统会自动创建一个名为“项目名 + Application.java”的文件。该类包含 `main` 方法。Spring\
  \ 运行在 `main` 方法中。\n\n#### 源码\n### 创建一个新的 HTML 文件\n[hello.html]\n```html\n<!DOCTYPE\
  \ html><html xmlns:th =\"http://www.thymeleaf.org\" ><head><meta charset =\"UTF-8\"\
  \ ></meta><title> Hello World</title></head><body><h1> Hello World</h1></body></html>\n\
  ```\n**要点：Thymeleaf 声明**\n在 html 标签中写入 `xmlns:th=\"http://www.thymeleaf.org\"`。现在你可以使用\
  \ Thymeleaf。上面的代码尚未使用 Thymeleaf。下面的示例使用了 Thymeleaf。\n\n接下来，创建一个控制器。\n[HelloController.java]\n\
  ```java\npackage com.example.hello;\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.web.bind.annotation.GetMapping;\n@Controller\npublic\
  \ class HelloController {\n    @GetMapping (\"/hello\" )\n    public String getHello()\
  \ {\n        // 跳转到 hello.html\n        return \"hello\" ;\n    }\n}\n```\n**要点\
  \ 1：@Controller**\n接收来自屏幕 HTTP 请求的类被称为控制器。带有 `@Controller` 注解的类将成为控制器。\n\n**要点 2：@GetMapping**\n\
  要接受 GET 方法的 HTTP 请求，请使用 `@GetMapping` 注解。将接受的 URL 设置为 `@GetMapping` 的参数。对于示例代码，GET\
  \ 方法现在接受对 \"http://localhost:8080/hello\" 的 HTTP 请求。方法的返回值是不带扩展名的 HTML 文件路径。它指定了相对于\
  \ `src/main/resources/templates` 的路径作为返回值。对于示例代码，即为 `src/main/resources/templates/hello.html`。\n\
  \n### 执行\n要运行 Spring Boot，请执行以下操作：\n右键点击项目 > Run（运行） > Spring Boot Application。\n\
  ![3-1-Boot](img/image_rsrcDUN.jpg)\n这会启动 Spring Boot。然后，访问以下 URL。\n\n[URL]\nhttp://localhost:8080/hello\n\
  \n[执行结果]\n![3-1-DisplayImage](img/image_rsrcDUB.jpg)\n现在你可以显示屏幕（HTML）。\n\n# 3.2\
  \ 从一个页面传递值到另一个页面\n\n### 概述\n从你刚刚创建的页面将值传递到另一个页面进行显示。\n[示例图片]\n![3-2-DisplayImage](img/image_rsrcDUP.jpg)\n\
  从 `hello.html` 到 `response.html` 的页面跳转。输入的字符串显示在 `response.html` 中。\n\n## 处理流程概述\n\
  ![3-2-Process](img/image_rsrcDUR.jpg)\n\n1. **请求 (POST 方法)**\n   使用 HTML 表单发送带有\
  \ POST 方法的 HTTP 请求。\n2. **响应 (response.html)**\n   与之前的示例相同，`HelloController.java`\
  \ 接收该操作。如果 POST 方法发送了请求，它会将 `response.html` 返回给浏览器。\n\n## 注意：HTTP POST 方法\n在 html\
  \ form 标签中，你可以使用 HTTP POST 方法发送请求。使用 POST 方法请求服务器执行某些操作，例如用户注册。\n\n#### 目录\n目录结构如下。背景颜色改变的部分为新添加的部分。\n\
  ![](img/image_rsrcDUD.jpg) SpringBootSample\n┗ ![](img/image_rsrcDUE.jpg) src/main\n\
  \   ┣ ![](img/image_rsrcDUE.jpg) java\n   ┃┗ ![](img/image_rsrcDUE.jpg) com.example\n\
  \   ┃   ┣ ![](img/image_rsrcDUE.jpg) hello\n   ┃   ┃┗ ![](img/image_rsrcDUH.jpg)\
  \ HelloController.java\n   ┃   ┗ ![](img/image_rsrcDUH.jpg) SpringBootSampleApplication.java\n\
