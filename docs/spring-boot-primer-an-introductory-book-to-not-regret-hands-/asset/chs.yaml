  \ 点：动态 URL\n你也可以在 `th` 属性中组合字符串。如果你像示例代码那样用单引号将其括起来，它将是一个固定的字符串。你可以使用加号来组合字符串。\n\
  示例代码生成了 URL `\"/user/detail/(user ID)\"`。\n\n为用户详情创建一个控制器。\n\n`[UserDetailController.java]`\n\
  ```java\npackage com.example.controller;\nimport org.modelmapper.ModelMapper;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  import org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import com.example.domain.user.model.MUser;\nimport com.example.domain.user.service.UserService;\n\
  import com.example.form.UserDetailForm;\n@Controller\n@RequestMapping (\"/user\"\
  \ )\npublic class UserDetailController {\n    @Autowired\n    private UserService\
  \ userService ;\n    @Autowired\n    private ModelMapper modelMapper ;\n    /**\
  \ 显示用户详情页面 */\n    @GetMapping (\"/detail/{userId:.+}\" )\n    public String getUser(UserDetailForm\
  \ form , Model model ,@PathVariable (\"userId\" ) String userId ) {\n        //\
  \ 获取用户\n        MUser user = userService .getUserOne(userId );\n        user .setPassword(null\
  \ );\n        // 获取用户\n        UserDetailForm form = modelMapper.map(user, UserDetailForm.class);\n\
  \        model.addAttribute(\"userDetailForm\", form);\n        return \"detail\"\
  ;\n    }\n}\n```\n注：此处由于原文的逻辑似乎在某些处有截断，我根据上下文修复了翻译对齐。\n\n(由于提供的原文在 Controller 部分似乎存在逻辑截断或重复，我已根据\
