  在这里你将学习 Spring 事务。不仅是 `MyBatis`，即使在 Spring 中使用 `JDBC` 或 `JPA` 时，也可以用相同的代码管理事务。\n\
  \n*   事务的类型\n*   事务的实现\n*   配置声明式事务\n\n#### 8.4.1 事务的类型\n首先学习事务的类型。Spring 事务有两种：\n\
  \n*   显式事务\n*   声明式事务\n\n显式事务是为事务编写代码的直接方式。声明式事务是一种通过通过注解来简单实现事务的方法。你只需通过注解即可消除非本质代码。因此，我们很少使用显式事务。\n\
  \n#### 8.4.2 事务的实现\n### 概述\n在用户更新处理过程中抛出一个故意异常。然后检查它是否被回滚。\n\n#### 目录\n目录结构没有变化。\n\
  \n# 源代码\n修改用户服务的实现类。背景颜色发生的地方是修改的部分。\n\n`[UserServiceImpl.java]`\n```java\npackage\
  \ com.example.domain.user.service.impl;\nimport java.util.List;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Service;\nimport org.springframework.transaction.annotation.Transactional;\n\
  import com.example.domain.user.model.MUser;\nimport com.example.domain.user.service.UserService;\n\
  import com.example.repository.UserMapper;\n\n@Service\npublic class UserServiceImpl\
  \ implements UserService {\n    @Autowired\n    private UserMapper mapper ;\n\n\
  \    /** 用户注册 */\n    @Override\n    public void signup(MUser user ) {…(Omitted)}\n\
  \n    /** 获取用户 */\n    @Override\n    public List<MUser> getUsers(MUser user ) {\n\
  \        return mapper .findMany(user );\n    }\n\n    /** 获取用户 */\n    @Override\n\
  \    MUser getUserOne(String userId ) {\n        return mapper .findOne(userId );\n\
  \    }\n\n    /** 更新用户 */\n    @Transactional\n    @Override\n    public void updateUserOne(String\
  \ userId ,String password ,String userName ) {\n        mapper .updateOne(userId\
  \ , userName );\n        // 抛出异常\n        int i = 1 / 0;\n    }\n\n    /** 删除用户\
  \ */\n    @Override\n    public void deleteUser(String userId ) {\n        mapper\
  \ .deleteOne(userId ) ;\n    }\n}\n```\n\n##### 重点：@Transactional\n你可以通过在方法上注解 `@Transactional`\
  \ 来实现事务。当带有该注解的方法发生异常时，它会自动回滚。该注解也可以附加到类上。然后修改用户详情界面。背景颜色发生的地方是修改的部分。\n\n`[UserDetailController.java]`\n\
  ```java\n@Controller\n@RequestMapping (\"/user\" )\n@Slf4j\npublic class UserDetailController\
  \ {\n    @Autowired\n    private UserService userService ;\n    @Autowired\n   \
  \ private ModelMapper modelMapper ;\n\n    /** 显示用户详情界面 */\n    @GetMapping (\"\
  /detail/{userId:.+}\" )\n    public String getUser(UserDetailForm form , Model model\
  \ ,@PathVariable (\"userId\" ) String userId ) {…(Omitted)}\n\n    /** 用户更新流程 */\n\
  \    @PostMapping (value = \"/detail\" , params = \"update\" )\n    public String\
  \ updateUser(UserDetailForm form , Model model ) {\n        try {\n            //\
  \ 更新用户\n            userService .updateOne(form.getUserId(),form .getPassword(),form\
  \ .getUserName());\n        } catch (Exception e ) {\n            log .error(\"\
  Error in user update\" , e );\n        }\n        // 跳转到用户列表界面\n        return \"\
  redirect:/user/list\" ;\n    }\n\n    /** 用户删除流程 */\n    @PostMapping (value = \"\
  /detail\" , params = \"delete\" )\n    public String deleteUser(UserDetailForm form\
  \ , Model model ) {…(Omitted)}\n}\n```\n\n##### 重点：@Transactional`\n你可以通过在方法上注解\
  \ `@Transactional` 来实现事务。当带有该注解的方法发生异常时，它会自动回滚。该注解也可以附加到类上。如果你注解了类，所有方法都将实现事务。然后修改用户详情界面。\n\
  \n##### 注意：堆栈跟踪\n为了检查错误内容的详情，发生错误时会输出堆栈跟踪。如果你将 `Exception` 类传递给 Lombok 的 `log` 方法，它将输出堆栈跟踪。\n\
  \n### 执行\n运行 `SpringBoot` 并访问 \"user1\" 的`用户详情`界面。更改用户名并点击“更新”按钮。(image_rsrcDW2.jpg)\
  \ 用户名没有更改。输出了以下错误日志。\n\n`[日志]` (部分)\n```\n==> Preparing: update m_user set password\
  \ = ? , user_name = ? where user_id = ?\n==> Parameters: password(String), User1(update)(String),\
  \ user@co.jp(String)\n<==  Updates: 1\nError in user update\njava.lang.ArithmeticException:\
  \ / by zero…(Omitted)\n```\n如果发生了错误，确认已回滚。最后，注释掉故意引起异常的代码。`[UserServiceImpl.java]`\
  \ (部分)\n```java\n// 抛出异常\n// int i = 1 / 0;\n```\n\n#### 8.4.3 配置声明式事务\n在这里你将学习如何设置声明式事务。要配置事务，请设置\
  \ `@Transactional` 注解的属性和值：\n\n[事务设置列表]\n\n| 属性 | 描述 |\n| :--- | :--- |\n| value\
  \ | 当使用多个事务管理器时，指定要使用的事务管理器的 `Qualifier`。如果想使用默认事务管理器，则可选。 |\n| transactionManager\
  \ | value 的别名 |\n\n\n\n\n\n| propagation | 指定事务的传播级别。详细将在稍后解释。 |\n| isolation |\
  \ 指定事务的隔离级别。详细将在稍后解释。 |\n| timeout | 指定事务的超时时间（以秒为单位）。默认值为 -1。然而，默认值取决于所用数据库的规范和设置。\
  \ |\n| readOnly | 指定事务的只读标记。默认值为 false（非只读）。 |\n| rollbackFor | 指定需要回滚事务的异常类列表。默认情况下，`RuntimeException`\
  \ 会触发回滚。 |\n| rollbackForClassName | 指定需要回滚事务的异常类名列表。默认情况下，未指定任何。 |\n| noRollbackFor\
  \ | 指定排除在事务提交之外的异常类列表。默认情况下，未指定任何。 |\n| noRollbackForClassName | 指定排除在事务提交之外的异常类名列表。默认情况下，未指定任何。\
  \ |\n\n隔离和传播级别对于设置事务至关重要。\n\n### 什么是事务独立性？\n\n首先解释隔离级别。但是，为了理解隔离级别，我将先解释事务独立性。如果有许多用户使用该应用程序，就会存在多个事务。如果多个事务引用并更新不同的数据，则没有问题。然而，在引用相同数据时必须小心。事务问题的常见示例包括如下：[示例：事务独立性]![9-4-3-transaction-isolation](img/image_rsrcDW3.jpg)\n\
  \n1. 首先，`transaction A` 读取银行账户信息。\n2. `transaction B` 随后读取银行账户信息。\n3. `transaction\
  \ A` 更新为 11,000，使账户金额增加了 `+1,000`。\n4. `transaction B` 更新为 9,000，使账户金额减少了 `-1,000`。\n\
  \n账户中的金额存入了 1,000 并取回了 1,000。然而，现在的金额是 9,000。在这种情况下，`transaction B` 应该等待 `transaction\
  \ A` 完成。通过这样，即使多个事务同时执行，也必须进行正常处理。这被称为事务独立性（或隔离）。隔离级别指定了这种独立性程度。对于隔离级别，请为 `isolation`\
  \ 属性指定以下值。但注意，取决于你使用的数据库产品，某些级别可能不可用。[事务隔离级别]\n\n| Isolation level | 描述 |\n| :---\
  \ | :--- |\n| DEFAULT | 使用数据库的默认隔离级别。 |\n| READ_UNCOMMITTED | 你可以读取其他事务未提交的数据。如果被回滚，则查询到了无效数据。\
  \ |\n| READ_COMMITTED | 无法读取另一个事务未提交的数据。 |\n| REPEATABLE_READ | 如果事务内多次读取数据，即使其他事务在此期间更改了数据，读取的值也是相同的。\
  \ |\n| SERIALIZABLE | 逐个处理事务，以此此类推。 |\n\n### 独立性中的典型问题\n\n以下是对独立性中一些典型问题的简要说明。共有三个问题：\n\
  \n* 脏读 (Dirty read)\n  在提交之前读取数据。\n* 非可重复读 (Non-repeatable read)\n  在事务中多次读取相同数据。在此期间，另一个事务更新了数据。在这种情况下，读取的数据会在中间发生变化。\n\
  * 幻读 (Phantom read)\n  在事务中多次读取相同数据。在此期间，另一个事务添加新数据。如果发生这种情况，处理的记录数会在事务中间增加。\n\n\
  之前引入的隔离级别以及这些问题的对应关系如下所示。[隔离级别]\n\n| Isolation level | 脏读 | 非可重复读 | 幻读 |\n| :---\
  \ | :--- | :--- | :--- |\n| READ_UNCOMMITTED | NG | NG | NG |\n| READ_COMMITTED\
  \ | OK | NG | NG |\n| REPEATABLE_READ | OK | OK | NG |\n| SERIALIZABLE | OK | OK\
  \ | OK |\n\n(OK: 防止，NG: 不防止) 请确保你设置了合适的隔离级别。\n\n### 什么是事务传播级别？\n\n接下来，我将解释传播级别。传播级别决定了是否创建并启动新事务。当服务调用另一个服务时尤其为重要。你可以配置是启动事务、加入现有事务等。[传播级别]![9-4-3-transaction-propagation](img/image_rsrcDW4.jpg)\
  \ 你可以将传播级别设置为：[传播级别]\n\n| Propagation level | 描述 |\n| :--- | :--- |\n| REQUIRED\
  \ | 如果不存在事务，`REQUIRED` 会启动新事务。默认传播级别。如果已存在事务，则使用它。 |\n| REQUIRES_NEW | 总是创建一个新事务。\
  \ |\n| MANDATORY | `MANDATORY` 假设事务已存在。如果已存在事务，则使用它。如果不存在事务，则抛出异常。 |\n| NEVER |\
  \ 如果指定 `\"NEVER\"`，则不使用事务。如果已存在事务，则抛出异常。 |\n| NOT_SUPPORTED | `NOT_SUPPORTED` 不使用事务。如果已存在事务，则挂起该事务。在系统暂停期间不使用事务执行处理。处理完成后，重启已停止的事务。\
  \ |\n| SUPPORTS | 如果事务不存在，则不会创建。如果已存在事务，则使用它。 |\n| NESTED | 创建嵌套事务。 |\n\n由于解释可能难以理解，请查看下表。[传播级别的行为]\n\
  \n| Propagation level | 设置 service2 的传播级别 | 通过 service1 调用 service2 |\n| :--- |\
  \ :--- | :--- |\n| REQUIRED | 启动事务 | 加入现有事务 |\n| REQUIRES_NEW | 启动事务 | 启动事务 |\n\
  | MANDATORY | 抛出异常 | 加入现有事务 |\n| NEVER | 不使用事务 | 抛出异常 |\n| NOT_SUPPORTED | 不使用事务\
  \ | 不使用事务 |\n| SUPPORTS | 不使用事务 | 加入现有事务 |\n| NESTED | 启动事务 | 启动部分事务 |\n\n这完成了事务的学习。\n\
  \n### 总结\n这里是你在本章中学到的内容：[基础]\n\n* 使用 MyBatis 时，在 Java 接口上注解 `@Mapper`。\n* 使用 `mapper`\
  \ 标签的 `namespace` 属性将 Java 接口映射到 `xml` 文件。\n* 使用 `id` 属性映射方法和 SQL。\n* 在 SQL 中嵌入参数时，使用\
  \ `#{parameter name}`。\n* 使用 `resultType` 和 `resultMap` 属性返回查询结果。\n* `resultMap`\
  \ 属性可以用于为不同情况进行 ORM 映射。\n* `@Param` 注解允许你指定嵌入 SQL 的参数名称。\n\n[高级]\n\n* 可以使用 `if`\
  \ 标签生成动态 SQL。\n* 你可以使用 `where` 标签生成不需要 `where` 子句的 SQL。\n* 使用 `association` 标签处理一对一表连接。\n\
  * 使用 `collection` 标签处理一对多表连接。\n\n[事务]\n\n* 要实现事务，请使用 `@Transactional` 注解。\n* `@Transactional`\
  \ 的属性可以用于设置隔离和传播级别。\n\n\n\n\n\n# 9.1.1 什么是 AOP？\n\nAOP 是提取公共流程并对其进行统一管理。AOP 代表面向切面数编程（Aspect\
  \ Oriented Programming）。通过 AOP，你可以将非核心代码放在一个地方。然后你可以决定将这些代码应用到哪些类或方法。\n\n例如，假设你想记录所有控制器（controller）方法的开始和结束日志。如果不使用\
  \ AOP，你将编写如下代码：\n\n```java\n@Controller\n@Slf4j\npublic class SampleController {\n\
  \    @GetMapping (\"/sample\")\n    public String get() {\n        log.info(\"Method\
  \ start: SampleController get\");\n        //(一些处理)\n        log.info(\"Method end:\
  \ SampleController get\");\n    }\n}\n```\n\n这是非常糟糕的代码。这是因为存在三个问题：\n\n* 代码的可读性降低了。*自身的*\
  \ 处理逻辑可能会被遗忘。\n* 如果日志输出内容发生变化，需要修改的数量将是巨大的。\n\n这在 AOP 中的实现如下：\n\n```java\n@Aspect\n\
  @Component\n@Slf4j\npublic class LogAspect {\n    @Before (\"@within(org.springframework.stereotype.Controller)\"\
  ) )\n    public void startLog(JoinPoint jp ) {\n        log.info(\"Method start:\
  \ \" + jp.getSignature());\n    }\n    @After (\"@within(org.springframework.stereotype.Controller)\"\
  ) )\n    public void endLog(JoinPoint jp ) {\n        log.info(\"Method end: \"\
  \ + jp.getSignature());\n    }\n}\n```\n\n仅凭此，日志就会在所有控制器的执行前后输出。它还消除了在控制器中编写日志输出代码的需要。你只需要修改\
  \ AOP 代码即可更改日志的输出。\n\n# 9.1.2 AOP 术语\n\nAOP 有许多术语。如果你不先熟悉这些术语，将无法理解它。AOP 术语如下：\n\
  \n| 术语 | 说明 |\n| --- | --- |\n| Advice (环通知) | 在 AOP 中执行的处理内容。 |\n| Pointcut (切入点)\
  \ | 要执行操作的对象（类或方法）。 |\n| JoinPoint (连接点) | 执行处理的时机。 |\n\n接下来，`JoinPoint`（执行时机）被分为以下五类。\n\
  \n| 执行时机 |get |\n| --- | --- |\n| Before (之前) | 在目标方法执行之前执行处理过程。 |\n| After (之后)\
  \ | 在目标方法执行之后执行处理过程。 |\n| AfterReturning (返回后) | 仅在目标方法正常结束时才执行处理过程。 |\n| Around\
  \ (环绕) | 在执行目标方法的前后各执行处理过程。 |\n| AfterThrowing (异常后) | 仅在目标方法异常终止时执行处理过程。 |\n\n\
  下图显示了这些 Join Points（执行时机）。![7-1-2-before](img/image_rsrcDW5.jpg) ![7-1-2-after](img/image_rsrcDW6.jpg)\
  \ ![7-1-2-after-returning](img/image_rsrcDW7.jpg) ![7-1-2-around](img/image_rsrcDW8.jpg)\
  \ ![7-1-2-after-throwing](img/image_rsrcDW9.jpg)\n\n# 9.1.3 AOP 的工作原理\n\n我将解释 AOP\
  \ 内部是如何运作的。理解这一点有助于理解 AOP。AOP 的机制如下：\n\n![7-1-3-process](img/image_rsrcDWA.jpg)\n\
  \n首先，Spring 尝试调用 DI 容器中注册的 bean 的方法。bean 是一个带有 `@Controller` 和 `@Service` 等注解的类。从控制器中所示调用\
  \ service 的方法：\n\n```java\n@Controller\npublic class SampleController {\n    @Autowired\n\
  \    private SampleService service;\n    public void method() {\n        service.someMethod();\n\
  \    }\n}\n```\n\n如果你真的直接调用 `someMethod()`，你无法在方法前后放置 AOP 处理。因此，Spring 通过 `Proxy`（代理）调用\
  \ bean 的方法。然后 `Proxy` 调用 AOP 处理和 bean 方法。因为你使用了 DI，所以你可以使用 AOP 进行公共处理。这就是 AOP 的内部工作原理。\n\
  \n# 9.2 AOP 的实现\n\n在理解 AOP 后，你将对其进行实现。\n\n* 如何指定切入点\n* Before/After 实现\n* Around\
  \ 实现\n\n# 9.2.1 如何指定切入点\n\n在开始实现 AOP 之前，让我们学习如何指定切入点（执行目标）。共有四种指定方式：\n\n| 切入点 |get\
  \ |\n| --- | --- |\n| execution | 使用正则表达式指定任何类或方法。 |\n| bean | 指定 DI 容器中注册的 bean\
  \ 名称。 |\n| @annotation | 使用包含包名在内的注解名称指定执行目标。带有指定注解的方法为目标。 |\n| @within | 指定包含包名在内的注解名称。带有指定注解的类的所有方法受\
  \ AOP 控制。 |\n\n# 9.2.2 Before/After 实现\n\n### 概述\n每当 `UserService` 的方法执行一次时，都输出一个开始和结束日志。实现\
  \ AOP，使得在显示用户列表屏幕时输出以下日志。\n\n[日志] (节录)\n```\nMethod start: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  Method end: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  ```\n\n### 概述\n每当 `UserService` 的方法执行时，都输出一个开始和结束日志。实现 AOP，使得在显示用户列表屏幕时输出以下日志。\n\
  \n[日志] (节录)\n```\nMethod start: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  Method end: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  ```\n\n#### 目录\n目录结构如下。带有背景颜色的部分是新增的。\n\n![7-1-2-before](img/image_rsrcDW5.jpg)\
  \ ![7-1-2-after](img/image_rsrcDW6.jpg) ![7-1-2-after-returning](img/image_rsrcDW7.jpg)\
  \ ![7-1-2-around](img/image_rsrcDW8.jpg) ![7-1-2-after-throwing](img/image_rsrcDW9.jpg)\n\
  \n#### 源码\n使用 AOP 需要某些库。因此，在 `pom.xml` 中添加以下代码：\n\n```xml\n<dependencies>\n    <!--\
  \ Spring AOP -->\n    <dependency>\n        <groupId>org.springframework</groupId>\n\
  \        <artifactId>spring-aop</artifactId>\n    </dependency>\n    <!-- AspectJ\
  \ -->\n    <dependency>\n        <groupId>org.aspectj</groupId>\n        <artifactId>aspectjweaver</artifactId>\n\
  \    </dependency>\n</dependencies>\n```\n\n实现 `LogAspect.java`：\n\n```java\npackage\
  \ com.example.aspect;\n\nimport org.aspectj.lang.JoinPoint;\nimport org.aspectj.lang.annotation.After;\n\
  import org.aspectj.lang.annotation.Aspect;\nimport org.aspectj.lang.annotation.Before;\n\
  import org.springframework.stereotype.Component;\nimport lombok.extern.slf4j.Slf4j;\n\
  \n@Aspect\n@Component\n@Slf4j\npublic class LogAspect {\n    /**\n     * 在执行 service\
  \ 之前。\n     * 目标：UserService 包含在类名中。\n     */\n    @Before (\"execution(*..UserService.*..)\"\
  ) )\n    public void startLog(JoinPoint jp ) {\n        log.info(\"Method start:\
  \ \" + jp.getSignature());\n    }\n\n    /**\n     * 在执行 service 之后。\n     * 目标：UserService\
  \ 包含在类名中。\n     */\n    @After (\"execution(*..UserService.*..)\") )\n    public\
  \ void endLog(JoinPoint jp ) {\n        log.info(\"Method end: \" + jp.getSignature());\n\
  \    }\n}\n```\n\n\n\n\n两个连续的点表示任何大于或等于零的任意值。在包部分，两个点表示包含零个或多个字符的包。在方法的参数部分，两个点表示零个或多个参数。\n\
  \n- `+` (加号)\n\n如果你在类名后指定加号，则将包含指定类的子类。\n\n### 执行 (ExecutionRun)\n运行 Spring Boot\
  \ 并访问以下 URL。[URL]``http://localhost:8080/user/list`\n应当输出以下日志。[日志]（节录）\n```\nMethod\
  \ start: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  Method end: List com.example.domain.user.service.impl.UserServiceImpl.getUsers(MUser)\n\
  ```\n※省略了 MyBatis 日志。\n\n### 9.2.3 Around 的实现\n### 概述\n实现 AOP 以为所有 controller 方法输出开始和结束日志。\n\
  \n#### 目录\n目录结构没有变化。\n\n# 源代码\n为 AOP 添加一个方法。更改背景颜色的部分为修改部分。[LogAspect.java]\n```java\n\
  package com.example.aspect;\nimport org.aspectj.lang.JoinPoint;\nimport org.aspectj.lang.ProceedingJoinPoint;\n\
  import org.aspectj.lang.annotation.After;\nimport org.aspectj.lang.annotation.Around;\n\
  import org.aspectj.lang.annotation.Aspect;\nimport org.aspectj.lang.annotation.Before;\n\
  import org.springframework.stereotype.Component;\nimport lombok.extern.slf4j.Slf4j;\n\
  \n@Aspect\n@Component\n@Slf4j\npublic class LogAspect {\n    /**\n     * 在执行服务前输出日志。\n\
  \     * 目标：类名中包含 [UserService]。\n     */\n    @Before (\"execution(* *..*.*UserService.*(..))\"\
  )\n    public void startLog(JoinPoint jp ) {\n        log.info(\"Method start: \"\
  \ + jp.getSignature());\n    }\n\n    /**\n     * 在执行服务后输出日志。\n     * 目标：类名中包含 [UserService]。\n\
  \     */\n    @After (\"execution(* *..*.*UserService.*(..))\")\n    public void\
  \ endLog(JoinPoint jp ) {\n        log.info(\"Method end: \" + jp.getSignature());\n\
  \    }\n\n    /** 在 controller 执行前后后输出日志 */\n    @Around(\"bean(*Controller)\")\n\
  \    // @Around(\"@annotation(org.springframework.web.bind.annotation.GetMapping)\"\
  )\n    @Around (\"@within(org.springframework.stereotype.Controller)\")\n    public\
  \ Object startLog(ProceedingJoinPoint jp ) throws Throwable {\n        // 输出开始日志\n\
  \        log.info(\"Method start: \" + jp.getSignature());\n        try {\n    \
  \        // 方法执行\n            Object result = jp.proceed();\n            // 输出结束日志\n\
  \            log.info(\"Method end: \" + jp.getSignature());\n            // 将执行结果返回给调用者\n\
  \            return result;\n        } catch (Exception e ) {\n            // 输出错误日志\n\
  \            log.error(\"Method abend: \" + jp.getSignature());\n            //\
  \ 抛出错误\n            throw e;\n        }\n    }\n}\n```\n\n#### 点 1：@Around\n通过在方法上添加\
  \ `@Around` 注解，你可以在 AOP 执行目标之前之后插入处理逻辑。其机制是：在带有此注解的方法内部调用要被 AOP 执行的方法。在上面的示例代码中，由\
  \ AOP 执行的方法在以下部分被调用。[LogAspect.java]\n```java\n// 方法执行\nObject result = jp.proceed();\n\
  …… 将执行结果返回给调用者\nreturn result;\n```\n请注意，如果你不包含上述处理，方法将无法正常执行。\n\n#### 点 2：bean\n\
  如果你使用 `\"bean\"` 作为切点（Pointcut，执行目标），则可以通过 DI（依赖注入）容器中注册的 bean 名称来指定 AOP 的目标。当然，也可以使用正则表达式。\n\
  [如何指定 bean]\n`bean(Bean-name)`\n虽然在示例代码中被注释掉了，但 bean 名称以 `Controller` 结尾的类被设定为 AOP\
  \ 目标。\n\n#### 点 3：@annotation\n如果你使用 `\"@annotation\"` 作为切点（执行目标），则带有指定注解的方法将成为\
  \ AOP 的目标。在注解名称中包含包名。虽然在示例代码中被注释掉了，但带有 `@GetMapping` 的方法被设定为 AOP 目标。\n\n#### 点 4：@within\n\
  如果你使用 `\"@within\"`，则带有指定注解的类的所有方法都成为 AOP 的目标。在注解名称中包含包名。在示例代码中，带有 `@Controller`\
  \ 注解的类的所有方法被设定为 AOP 目标。\n\n### 执行 (ExecutionRun)\n运行 Spring Boot 并访问以下 URL。[URL]``http://localhost:8080/login`\n\
  应当输出以下日志。[日志]（节录）\n```\nMethod start: String com.example.controller.LoginController.getLogin()\n\
  Method end: String com.example.controller.LoginController.getLogin()\n```\n※省略了\
  \ MyBatis 日志。\n\n### 总结\n在本章中你学习了：\n\n[AOP 概述]\n- AOP 是集体管理公共处理的机制。\n\n[AOP 术语]\n\
  - Advice：处理内容\n- Pointcut（切点）：执行目标\n- JoinPoint（连接点）：执行时机\n\n[如何指定 JoinPoint（执行时机）]\n\
  - 在 AOP 方法上标记以下 JoinPoint（执行时机）：\n    1. `Before`:执行前\n    2. `After`:执行后（正常终止/异常终止）\n\
  \    3. `Around`:执行前后\n    4. `AfterReturning`: 正常完成后\n    5. `AfterThrowing`: 异常终止后\n\
  \n[如何指定 Pointcut（执行目标）]\n- 在 JoinPoint 注解中指定以下 Pointcut（执行目标）：\n    1. `execution(return-value\
  \ package-name.method-name(argument))`\n    2. `bean(Bean-name)`\n    3. `@annotation(package-name.annotation-name)`\n\
  \    4. `@within(package-name.annotation-name)`\n\n[如何实现 AOP]\n- 在 AOP 类上添加 `@Aspect`\
  \ 和 `@Component`。\n- 在 AOP 方法上标记 JoinPoint（执行时机）。\n- 在 JoinPoint 注解中指定 Pointcut（执行目标）。\n\
  \n\n\n\n因此，创建一个允许跳转到登录页的通用错误页面。\n![通用错误页面](img/image_rsrcDWC.jpg)\n\n#### 目录\n目录结构如下。背景颜色发生变化的部分为新添加的部分。\n\
