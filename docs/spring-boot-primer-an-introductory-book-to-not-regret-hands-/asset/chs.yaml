  *   `spring.datasource.schema`: SQL 语句。\n*   `spring.datasource.data`: SQL 语句。\n\
  \n`src/resources/schema.sql`\n```sql\nCREATE TABLE IF NOT EXISTS employee (id VARCHAR(50)\
  \ PRIMARY KEY ,name VARCHAR(50),age INT);\n```\n\n`src/resources/data.sql`\n```sql\n\
  INSERT INTO employee (id, name, age) VALUES ('1', 'Tom', 30);\n```\n创建一个包含搜索结果的\
  \ Employee 类。\n\n`Employee.java`\n```java\npackage com.example.hello;\nimport lombok.Data;\n\
  @Data\npublic class Employee {\n    private String employeeId;\n    private String\
  \ employeeName;\n    private int employeeAge;\n}\n```\n\n#### 节点：@Data\n`@Data`\
  \ 是 Lombok 提供的注解。通过它，会自动生成以下方法：\n\n*   `getter`\n*   `setter`\n*   `toString`\n\
  *   `hashCode`\n*   `equals`\n\n这让你在重命名字段时无需重新创建 getter 和 setter。Lombok 还有其他有注解。\n\
  \n下一步是创建一个搜索数据库员工的进程。使用 JDBC 执行选择语句。\n\n`HelloRepository.java`\n```java\npackage\
  \ com.example.hello;\nimport java.util.Map;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.jdbc.core.JdbcTemplate;\nimport org.springframework.stereotype.Repository;\n\
  \n@Repository\npublic class HelloRepository {\n    @Autowired\n    private JdbcTemplate\
  \ jdbcTemplate ;\n\n    public Map<String, Object> findById(String id ) {\n    \
  \    // SELECT 语句\n        String query = \"SELECT * FROM employee WHERE id=?\"\
  ;\n        // 搜索执行\n        Map<String, Object> employee = jdbcTemplate .queryForMap(query\
  \ , id );\n        return employee ;\n    }\n}\n```\n\n##### 节点 1：@Repository\n\
  表示数据库操作的仓库标记为 `@Repository`。\n\n##### 节点 2：@Autowired\n`@Autowired` 是用于依赖注入的注解。将在第\
  \ 5 章解释。\n\n**注意：JdbcTemplate**\n你可以使用 `JdbcTemplate` 类通过 JDBC 执行 SQL。在本书的示例中，选择的结果通过\
  \ `Map` 获取。`Map` 的键包含选择结果的列名。`Map` 的值包含选择结果的值。\n\n然后创建服务层。服务层使用仓库获取 SQL 执行的结果。\n\
  \n`HelloService.java`\n```java\npackage com.example.hello;\nimport java.util.Map;\n\
  ```\n\n\n\n\n```java\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Service;\n\n@Service\npublic class HelloService\
  \ {\n    @Autowired\n    private HelloRepository repository;\n\n    /** 获取一个员工 */\n\
  \    public Employee getEmployee(String id) {\n        // 查询\n        Map<String,\
  \ Object> map = repository.findById(id);\n        // 从 Map 中获取值\n        String\
  \ employeeId = (String) map.get(\"id\");\n        String name = (String) map.get(\"\
  name\");\n        int age = (Integer) map.get(\"age\");\n        // 为 Employee 类赋值\n\
  \        Employee employee = new Employee();\n        employee.setEmployeeId(employeeId);\n\
  \        employee.setEmployeeName(name);\n        employee.setEmployeeAge(age);\n\
  \        return employee;\n    }\n}\n```\n根据 `select` 语句的执行结果创建 `Employee` 实例。然后修改控制器。更改背景颜色的部分即为修改的部分。\n\
  \n[HelloController.java]\n```java\npackage com.example.hello;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestParam;\n\n@Controller\npublic\
  \ class HelloController {\n    @Autowired\n    private HelloService service;\n\n\
  \    @GetMapping(\"/hello\")\n    public String getHello() {\n        // 跳转到 hello.html\n\
  \        return \"hello\";\n    }\n\n    @PostMapping(\"/hello\")\n    public String\
  \ postRequest(@RequestParam(\"text1\") String str, Model model) {\n        // 将从屏幕接收到的字符串注册到\
  \ Model\n        model.addAttribute(\"sample\", str);\n        // 跳转到 response.html\n\
  \        return \"hello/response\";\n    }\n\n    @PostMapping(\"/hello/db\")\n\
  \    public String postDbRequest(@RequestParam(\"text2\") String id, Model model)\
  \ {\n        // 查询一个员工\n        Employee employee = service.getEmployee(id);\n \
  \       // 将查询结果保存到 Model\n        model.addAttribute(\"employee\", employee);\n\
  \        // 跳转到 db.html\n        return \"hello/db\";\n    }\n}\n```\n从 `service`\
  \ 获取的 `Employee` 实例已注册在 `Model` 中。接下来，创建一个屏幕来显示 `Employee`。\n\n[db.html]\n```html\n\
  <!DOCTYPE html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta\
  \ charset=\"UTF-8\">\n    <title> ResponseSample</title>\n</head>\n<body>\n    <h1>\
  \ HelloResponseDB</h1>\n    <table>\n        <tr>\n            <td> ID:</td>\n \
  \           <td th:text=\"${employee.employeeId}\"></td>\n        </tr>\n      \
  \  <tr>\n            <td> Name:</td>\n            <td th:text=\"${employee.employeeName}\"\
  ></td>\n        </tr>\n        <tr>\n            <td> Age:</td>\n            <td\
  \ th:text=\"${employee.employeeAge}\"></td>\n        </tr>\n    </table>\n</body>\n\
  </html>\n```\n如果类类型（class type）变量被注册在 `Model` 中，请在 `th` 属性中指定 `${key_name.field_name}`。现在你可以获取\
  \ Java 类的字段值。最后，修改屏幕以便你可以输入员工 ID。更改背景颜色的部分即为修改的部分。\n\n[hello.html]\n```html\n<!DOCTYPE\
  \ html>\n<html xmlns:th=\"http://www.thymeleaf.org\">\n<head>\n    <meta charset=\"\
  UTF-8\">\n    <title> Hello World</title>\n</head>\n<body>\n    <h1> Hello World</h1>\n\
  \    <form method=\"post\" action=\"/hello\">\n        Enter: <input type=\"text\"\
  \ name=\"text1\" />\n        <input type=\"submit\" value=\"Click\" />\n    </form>\n\
  \    <br/>\n    <form method=\"post\" action=\"/hello/db\">\n        Employee ID:<input\
  \ type=\"text\" name=\"text2\" th:value=\"${text2_value}\" />\n        <input type=\"\
  submit\" value=\"Click\" />\n    </form>\n</body>\n</html>\n```\n\n### 执行\n运行 Spring\
  \ Boot。然后你可以访问 H2 数据库控制台。通过以下 URL 访问控制台：\n[H2 数据库控制台 URL]\n`http://localhost:8080/h2-console`\n\
  \n显示如下屏幕。\n![](img/image_rsrcDUV.jpg)\n\n输入以下信息登录：这些值是你在 `application.properties`\
  \ 中设置的值。\n\n| 项目 | 值 | 属性 |\n| :--- | :--- | :--- |\n| JDBC URL | `jdbc:h2:mem:testdb`\
  \ | `spring.datasource.url` |\n| 用户名 | `sa` | `spring.datasouce.username` |\n| 密码\
  \ | (无) | `spring.datasouce.password` |\n\n登录后，显示如下屏幕。当选择 `EMPLOYEE` 表时，会输入“显示全部”的\
  \ SQL。点击 Execute 按钮执行 SQL。\n![](img/image_rsrcDUW.jpg)\n\n你可以确认表正在创建并且正在输入初始数据。你可以使用\
  \ H2 数据库控制台进行验证，例如。现在运行示例应用程序。访问以下 URL：\n`http://localhost:8080/hello`\n\n[执行结果]\n\
  ![](img/image_rsrcDU.jpg)\n\n输入 1 作为员工 ID 并点击按钮。注册在数据库的内容显示在另一个屏幕上。\n\n使用 Spring\
  \ Boot 完成了示例的创建。现在可以看到数据库查询的结果。\n\n\n\n\n依赖意味着一个类拥有另一个类的字段，或者使用了另一个类的方法。例如，代码可能如下：\n\
  \n```java\npublic class SomeObjectA {\n    // field\n    private SomeObjectB objB\
  \ ;\n    // constructor\n    public SomeObjectA(SomeObjectB objB ) {\n        this\
  \ .objB = objB ;\n    }\n    // method\n    public void methodA() {\n        objB\
  \ .methodB();\n    }\n}\n```\n\n如果你给 `SomeObjectB` 的方法添加了参数，`SomeObjectA` 必须修改修改代码。在这种情况下，`SomeObjectA`\
  \ 依赖于 `SomeObjectB`。\n\n## 2. 什么是注入？\n\n接下来，我将解释什么是“注入”。注入是将一个实例赋值给变量。在上面的示例代码中，实例被赋值给构造函数中的字段。\n\
  \n```java\n// (Excerpt) // constructor\npublic SomeObjectA(SomeObjectB objB ) {\n\
  \    this .objB = objB ;\n}\n```\n\n如果你不赋值实例，`objB` 将保持为 `null`。如果你调用该方法，将会发生 `NullPointerException`。\n\
  \n## 3. 什么是依赖注入？\n\n如果你理解了依赖，就可以很容易理解依赖注入。依赖注入是将实例赋值给继承自接口或抽象类的类。例如，Java 中有 `List`。除非使用接口，否则无法使用\
  \ `ArrayList`，因此编写类似下面的代码：\n\n```java\nList<Object> list = new ArrayList<>();\n\
  ```\n\n组件扫描的结果可能是 `ArrayList` 或 `LinkedList`。如果你有多个实现，你需要决定：\n\n*   使用哪种实现（依赖）\n\
  *   将 `ArrayList` 或 `LinkedList` 的实例注入到变量中。\n\n## 4. 为什么要使用接口？\n\n使用接口可以让开发和维护变得更容易。这是因为你可以更改实现接口的类。例如，它们有以下优缺点：\n\
  \n*   `ArrayList`\n    *   优点：快\n    *   缺点：慢\n*   `LinkedList`\n    *   优点：易添加\n\
  \    *   缺点：访问\n\n你使用的接口越多，它的扩展性越强。然而，如果你直接使用实现类，就会像下面所示紧密耦合：\n\n```java\n// Loosely\
  \ coupled\nList<Object> listA = new ArrayList<>();\n// Tightly coupled\nArrayList<Object>\
  \ listB = new ArrayList<>();\n```\n\n通过使用接口，你可以轻松地更改内容。例如，你可以使用存根进行测试。这使得测试变得更容易。\n\
  \n## 5. Spring 的 DI 做了什么？\n\n现在你已经理解了依赖注入，那么来解释一下 Spring DI 在做什么。DI 执行以下处理：\n\n\
  1. 查找 DI 的目标类\n2. 在标记了 `@Autowired` 的地方注入实例\n\n### 查找 DI 的目标类\n当 Spring 启动时，它会寻找作为\
  \ DI 目标的类。这个过程被称为组件扫描。组件扫描查找以下注解：\n\n*   `@Component`\n*   `@Controller`\n*   `@Service`\n\
  *   `@Repository`\n*   `@Configuration`\n*   `@RestController`\n*   `@ControllerAdvice`\n\
  *   `@ManagedBean`\n*   `@Named`\n*   `@Mapper`\n*   `@Bean`\n\n带有这些注解的类会被注册到 DI\
  \ 容器中。DI 容器是一个管理 DI 目标类的容器。例如，假设你有一个分别标记了 `@Controller` 和 `@Service` 的类。\n\n在这种情况下，组件扫描的结果是一个类似于下面的\
  \ DI 容器：\n\n```java\npublic class DIContainer {\n    // 创建每个类的实例\n    private SampleController\
  \ controller = new SampleController();\n    private SampleService service = new\
  \ SampleService();\n\n    // SampleController getter\n    public static SampleController\
  \ getSampleController() {\n        return controller ;\n    }\n    // SampleService\
  \ getter\n    public static SampleService getSampleService() {\n        return service\
  \ ;\n    }\n}\n```\n\n### 在标记了 @Autowired 的地方注入实例\n然后在标记了 `@Autowired` 的地方注入实例。想象代码转换如下：\n\
  \n```java\n// Before conversion\n@Autowired\nprivate SampleService service ;\n\n\
  // After conversion\nprivate SampleService service = DIContainer.getSampleService()\n\
  ```\n\n实例在上方显示 `@Autowired` 的地方被注入。\n\n\n\n\n```java\n@PostMapping(\"/sample\")\n\
  public String postSample() {\n    // Some processing using service…\n}\n```\n这可以防止你在测试期间将\
  \ `SampleService` 修改为存根（stub）。此外，即使你创建了一个新类，切换到该类也会变得困难。使用 DI，你可以轻松地更改实现类。\n\n##\
  \ 5.1.2 实例生命周期管理\n\nDI 同时也为实例提供了生命周期管理。具体来说，它创建并销毁实例。创建实例意味着创建一个新类。销毁实例是将变量赋值为 `null`。如果你给变量赋值为\
  \ `null`，垃圾回收会将实例从内存中释放。具体来说，以下代码创建并销毁了实例：\n\n```java\n// Creating an Instance\n\
  SomeObject obj = new SomeObject()\n// Destroying an instance\nobj = null\n```\n\n\
  Spring DI 会自动创建和销毁实例。它们的时机可以通过 `scope` 指定。`Scope` 是实例生存的时间。例如，`request` 范围会在每次发送\
  \ HTTP 请求时创建一个实例。当请求处理完成时，该实例就会销毁。要指定范围，请在类上使用 `@Scope` 注解。\n\n```java\n// Sample\
  \ code for scope specification\n@Controller\n@Scope(\"request\")\npublic class SomeController\
  \ {…}\n```\n\nSpring 提供了以下范围：\n\n| Scope | Description |\n| :--- | :--- |\n| singleton\
  \ | Spring 在启动时仅创建一个实例。该实例在整个应用程序中共享并使用。如果没有 `@Scope` 注解，所有类都是单例的。 |\n| prototype\
  \ | 每次获取一个 bean 时，都会创建一个实例。 |\n| session | 每个 HTTP session 创建一个实例。也就是说，实例只在用户登录期间存在。仅适用于\
  \ Web 应用程序。 |\n| request | 为每个 HTTP 请求创建一个实例。仅适用于 Web 应用程序。 |\n| globalSession |\
  \ 在 portlet 环境中为每个 GlobalSession 创建实例。仅适用于支持 portlet 的 Web 应用程序。 |\n| application\
  \ | 为每个 servlet context 创建实例。仅适用于 Web 应用程序。 |\n\n## 5.2 如何实现 DI\n\n现在你将学习如何实现 DI。\n\
  \n* 依赖注入方法\n* 如何注册 bean\n\n### 5.2.1 依赖注入方法\n\n要使用 DI，请 `@Autowired` 注解。我将解释如何使用它。`@Autowired`\
  \ 注解可以用在三个地方：\n\n1. 字段 (Field)\n2. 构造函数 (Constructors)\n3. Setter 方法 (Setter)\n\n\
  #### 1. 字段注入\n\n如果你想将依赖注入到字段中，请在该字段上标记为 `@Autowired`。\n\n```java\n// Sample code\n\
  @Component\npublic class Sample {\n    // Field injection\n    @Autowired\n    private\
  \ SampleComponent component;\n}\n```\n\n#### 2. 构造函数注入\n\n可以将依赖注入到构造函数参数中。注意在 Spring\
  \ 4.3 及更高版本中，你可以省略构造函数注入的 `@Autowired` 注解。\n\n```java\n// Sample code\n@Component\n\
  public class Sample {\n    private final SampleComponent component;\n    // Constructor\
  \ Injection\n    @Autowired\n    public Sample(SampleComponent component) {\n  \
  \      this.component = component;\n    }\n}\n```\n\nSpring 推荐使用构造函数注入。你也可以使用 Lombok\
  \ 自动生成构造函数。\n\n```java\n// Lombok Sample Code 1\n@Component\n@RequiredArgsConstructor\n\
  public class Sample {\n    private final SampleComponent component;\n    private\
  \ String value;\n}\n```\n\n**点：** `@RequiredArgsConstructor`\n`@RequiredArgsConstructor`\
  \ 注解会创建一个仅以 `final` 字段作为参数的构造函数。在上面的示例代码中，创建一个只包含 `SampleComponent` 参数的构造函数。\n\n\
  ```java\n// Lombok Sample Code 2\n@Component\n@AllArgsConstructor\npublic class\
  \ Sample {\n    private SampleComponent component;\n    private String value;\n\
  }\n```\n\n**点：** `@AllArgsConstructor`\n`@AllArgsConstructor` 注解会创建一个包含所有字段作为参数的构造函数。因为在构造函数注入中省略\
  \ `@Autowired`，上面的示例代码也是 DI。\n\n#### 3. Setter 注入\n\n可以将依赖注入到 setter 方法参数中。在 setter\
  \ 方法上标记为 `@Autowired`。\n\n```java\n// Sample code\n@Component\npublic class Sample\
  \ {\n    private SampleComponent component;\n    // setter injection\n    @Autowired\n\
  \    public void setComponent(SampleComponent component) {\n        this.component\
  \ = component;\n    }\n}\n```\n\n## 5.2.2 如何注册 bean\n\n注册在 DI 容器中的类被称为 `bean`。创建\
  \ bean 有多种方法，但主要方法是结合以下两种方法：\n\n1. 基于注解的实现\n2. 在 JavaConfig 中实现\n\n#### 1. 基于注解的实现\n\
  \n要使用 DI，请在类上标记 `@Controller` 以及第 3 章示例代码中使用的注解。除其他外，常用的注解有：\n\n* `@Component`\n\
  * `@Controller`\n* `@Service`\n* `@Repository`\n* `@Bean`\n* `@Mapper`\n\n通过注解类并在\
  \ DI 容器中注册 bean 是一项基础操作。\n\n#### 2. 在 JavaConfig 中实现\n\n实例化 bean 的类通常称为 `JavaConfig`。在\
  \ bean 生成逻辑复杂等情况下使用 `JavaConfig`。例如，在 DI 容器中注册库中提供的类。\n\n```java\n// Sample code\n\
  @Configuration\npublic class JavaConfig {\n    @Bean\n    public SomeComponent getSomeComponent()\
  \ {\n        return new SomeComponentImpl();\n    }\n}\n```\n\n**点：** `@Configuration`,\
  \ `@Bean`\n`JavaConfig` 标记为 `@Configuration`。然后并在创建实例的方法上标记 `@Bean`。你可以在 `@Bean`\
  \ 注解旁边添加 `@Scope` 注解。通过 `JavaConfig` 将所有类注册为 bean 是困难的。因此基本上使用“基于注解的实现”。如果不够，你会使用“在\
  \ JavaConfig 中实现”。\n\n## 5.3 DI 的问题\n\n尽管 DI 很有用，但它存在以下问题：\n\n* 单例范围\n* 不同的范围\n\
  * 无法从 Bean Bean\n\n### 5.3.1 单例范围\n\n`@Service` 等注解默认为单例范围。应用程序启动期间只有一个实例。不会创建两个或多个实例。因此，从多个实例访问时要小心。在这种情况下，不要编写这样的代码：\n\
  \n```java\n// Bad example sample code\n@Getter\n@Setter\n@Service\npublic class\
  \ SomeServiceImpl implements SomeService {\n    // Some state\n    private String\
  \ state;\n    @Override\n    public void someMethod() {\n        // Some processing\
  \ using state…\n    }\n}\n```\n\n上面的服务本应该如下所示使用：\n\n1. 将 `state` 字段设置为某个值。\n2. 通过\
  \ `someMethod` 使用 state 进行一些处理。\n\n上述代码的问题在于另一个实例可能会重写 state。假设在调用过程 1 和 2 期间 state\
  \ 被重写。那么 `someMethod` 将返回意料之外的执行结果。\n\n\n\n\n\n针对这种情况有几种变通方法。例如，将字段更改为方法参数。\n\n\
  ```java\n@Service\npublic class SomeServiceImpl implements SomeService {\n    @Override\n\
  \    public void someMethod(String state ) {\n        // 使用 state 进行某些处理…\n    }\n\
  }\n```\n通过这种，没有状态的类被称为无状态类。另一种解决方案是使用单例以外的作用域。\n\n### 5.3.2 不同的作用域\n如果字段具有不同的作用域，实例可能不会被销毁。这是\
  \ Java 规范导致的一个陷阱。例如，如果 `singleton` 作用域的实例字段中包含一个 `prototype` 作用域的实例。\n\n```java\n\
  @Component\n@Scope (\"prototype\" )\npublic class PrototypeComponent {…}\n```\n\n\
  ```java\n@Component\npublic class SingletonComponent {\n    @Autowired\n    private\
  \ PrototypeComponent component ;\n    …\n}\n```\n如果你这样做，`prototype` 作用域的 Bean（上述\
  \ `PrototypeComponent`）将变为 `singleton` 作用域。如果在 `session` 作用域的 Bean 中设置了 `request`\
  \ 作用域的 Bean，也会发生同样的情况。在将具有不同作用域的 Bean 作为字段时要小心。\n\n### 5.3.3 无法从 Bean 以外进行 DI\n\
  这很容易被忽略，但你无法从非 Bean 类进行依赖注入（DI）。\n\n```java\npublic class SampleObject {\n    @Autowired\n\
  \    private SampleService service ;\n    …\n}\n```\n在上面的示例代码中，`SampleObject` 没有\
  \ `@Component` 或 `@Controller` 注解。也就是说，`SampleObject` 不是一个 Bean。这不允许在 `SampleService`\
  \ 字段中进行 DI。按照如下方式对类进行注解：\n\n```java\n@Component\npublic class SampleObject {\n \
  \   @Autowired\n    private SampleService service ;\n    …\n}\n```\n\n### 总结\n以下是你在本章中学到的内容。\n\
  \n#### 什么是 DI？\nDI 执行以下操作：\n* 自动为接口分配实例。\n* 创建并销毁实例。\n* 你可以管理实例的作用域。\n\n#### 如何实现\
  \ DI？\n你可以在三个地方使用 `@Autowired`：\n* 字段\n* 构造函数\n* Setter 方法\n\n为了实现 DI，主流做法是结合以下两种方法：\n\
  * 基于注解的实现\n* 在 JavaConfig 中实现\n\n#### DI 的陷阱\nDI 具有以下陷阱：\n* 单例作用域。\n* 如果在字段中拥有不同作用域的\
  \ Bean，实例将不会销毁。\n* 无法从 Bean 以外进行 DI。\n\n## 6. 绑定与验证（输入检查）\n在本章中，你将在创建界面时学习绑定和验证（输入检查）。这两者都是创建界面的基础，因此你需要熟悉它们。\n\
  \n* [创建界面]\n* [绑定]\n* [验证（输入检查）]\n\n### 6.1 创建界面\n学习如何使用 Spring Boot 创建界面。\n\n*\
  \ [使用库…webjars]\n* [消息属性]\n* [多语言化]\n\n#### 6.1.1 使用库…webjars\n概述\n界面设计在应用程序中变得越来越重要。在设计界面时，通常会使用\
  \ Bootstrap 框架。Bootstrap 使得创建美观界面变得简单。原因是你可以创建一个兼容智能手机的界面。\n\n要使用 Bootstrap，你将使用一个名为\
  \ `webjars` 的库。`Webjars` 使下载和加载库变得简单。在本节中，你将创建以下两个界面。\n\n**目录**\n目录结构如下。更改背景颜色的部分是修改部分。\n\
  \n```\nSpringBootSample\n┗ src\n    Target java\n    ┃Target com.example\n    ┃\
  \   Target application.service (创建新包)\n    ┃   ┃Target UserApplicationService.java\
  \ (新建一个类)\n    ┃   Target controller (创建新包)\n    ┃   ┃Target LoginController.java\
  \ (新建一个类)\n    ┃   ┃┗ SignupController.java (新建一个类)\n    ┃   Target hello\n    ┃\
  \   ┗ SpringBootSampleApplication.java\n    Target resources\n    ┃ Target static\n\
  \    ┃ ┃Target css (新建文件夹)\n    ┃ ┃ ┣ login (新建文件夹)\n    ┃ ┃ ┃┗ login.css (新建文件)\n\
  \    ┃ ┃ ┗ user (新建文件夹)\n    ┃ ┃     ┗ signup.css (新建文件)\n    ┃ Target templates\n\
  \    ┃ ┃ Target hello\n    ┃ ┃ ┣ login (新建文件夹)\n    ┃ ┃ ┃┗ login.html (新建文件)\n \
  \   ┃ ┃ ┣ user (新建文件夹)\n    ┃ ┃ ┃┗ signup.html (新建文件)\n    ┃ ┃ ┗ hello.html\n  \
  \  ┃ Target application.properties\n    ┃ Target data.sql\n    ┃ ┗ schema.sql\n\
  ┗ pom.xml\n```\n\n**源代码**\n首先，让 `webjars`可用。编辑 `pom.xml` 来实现。在 `pom.xml` 的 `dependencies`\
  \ 标签中添加以下代码。更改背景颜色的部分是添加的部分。\n\n```xml\n<dependencies>\n…\n  <!-- jquery -->\n \
  \ <dependency>\n    <groupId> org.webjars</groupId>\n    <artifactId> jquery</artifactId>\n\
  \    <version>3.5.1</version>\n  </dependency>\n  <!-- bootstrap -->\n  <dependency>\n\
  \    <groupId> org.webjars</groupId>\n    <artifactId> bootstrap</artifactId>\n\
  \    <version>4.5.3</version>\n  </dependency>\n  <!-- webjars-locator -->\n  <dependency>\n\
  \    <groupId> org.webjars</groupId>\n    <artifactId> webjars-locator</artifactId>\n\
  \    <version>0.40</version>\n  </dependency>\n…\n</dependencies>\n```\n\n**点 1:\
  \ 什么是 webjars？**\nWebjars 是一种让 JavaScript 和 CSS 等库可以在 Maven 中使用的库。请参 webjars 官方页面。你可以通过搜索\
  \ \"maven webjars\" 找到 webjars 提供的库。\n\n**点 2: 什么是 webjars-locator？**\n\n\n\n\n\
  Webjars-locator 允许你在编写代码时无需感知 webjars 所使用的库版本。有关如何使用此函数的细节将在稍后解释。\n\n注意：jQuery 如果要使用\
  \ Bootstrap，你需要一个名为 `jQuery` 的 JavaScript 库。编辑 `pom.xml`，`Maven` 将自动下载该库。\n\n在用户注册界面上，显示了一个用于选择性别的单选按钮。准备一个服务来生成性别映射表。\n\
  \n### UserApplicationService.java\n```java\npackage com.example.application.service;\n\
  import java.util.LinkedHashMap;\nimport java.util.Map;\nimport org.springframework.stereotype.Service;\n\
  \n@Service\npublic class UserApplicationService {\n    /** Generate a gender Map\
  \ */\n    public Map<String, Integer> getGenderMap() {\n        Map<String, Integer>\
  \ genderMap = new LinkedHashMap<>();\n        genderMap .put(\"male\" , 1);\n  \
  \      genderMap .put(\"female\" , 2);\n        return genderMap ;\n    }\n}\n```\n\
  \n接下来，为登录界面创建一个控制器。\n\n### LoginController.java\n```java\npackage com.example.controller;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  \n@Controller\npublic class LoginController {\n    /** Display login screen */\n\
  \    @GetMapping (\"/login\" )\n    public String getLogin() {\n        return \"\
  login/login\" ;\n    }\n}\n```\n\n接下来，为用户注册界面创建一个控制器。\n\n### SignupController.java\n\
  ```java\npackage com.example.controller;\nimport java.util.Map;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestMapping;\nimport com.example.application.service.UserApplicationService;\n\
  \n@Controller\n@RequestMapping (\"/user\" )\npublic class SignupController {\n \
  \   @Autowired\n    private UserApplicationService userApplicationService ;\n\n\
  \    /** Display the user signup screen */\n    @GetMapping (\"/signup\" )\n   \
  \ public String getSignup(Model model ) {\n        // Get genderMap\n        Map<String,\
  \ Integer> genderMap = userApplicationService .getGenderMap();\n        model .addAttribute(\"\
  genderMap\" , genderMap );\n        // Transition to user signup screen\n      \
  \  return \"user/signup\" ;\n    }\n\n    /** User signup process */\n    @PostMapping\
  \ (\"/signup\" )\n    public String postSignup() {\n        // Redirect to login\
  \ screen\n        return \"redirect:/login\" ;\n    }\n}\n```\n\n要点：@RequestMapping\n\
  当将 `@RequestMapping` 添加到类上时，它可以作为 URL 前缀。在上面的示例代码中，设置如下：\n\n字体 类：`@RequestMapping(\"\
  /user\")`\n- 方法：`@GetMapping(\"/signup\")`\n\n\n\n\n\n要通过此设置访问用户注册界面，请输入以下 URL。[用户注册界面的\
  \ URL] `http://localhost:8080/user/signup`\n\n你也可以在方法上添加 `@RequestMapping` 来代替 `@GetMapping`\
  \ 或 `@PostMapping`。[示例] 替替 `@GetMapping` 的替代方案\n```java\n@RequestMapping (value\
  \ = \"/sample\" , method=RequestMethod.GET )\npublic String getSample() {…}\n```\n\
  \n**注意：重定向**\n若要进行重定向，请将 `\"redirect: 重定向目标路径\"` 作为返回值。\n\n**注意：PRG 模式**\nPRG 模式是在执行\
  \ `POST` 方法后重定向到页面跳转（执行 `GET` 方法）。POST-Redirect-GET 的缩写被称为 PRG 模式。使用 PRG 模式可以防止意外的注册或刷新。\n\
  \n[不使用 PRG 模式时] \n假设你有一个应用程序，在注册某些内容后直接跳转到页面而不进行重定向。在注册操作完成后，立即按下浏览器上的 `F5` 键。此时将发送相同的请求，并再次执行注册过程。\n\
  \n[使用 PRG 模式时] \n如果你在执行注册或其他处理后进行了重定向，即使按下 `F5` 键，也不会发送请求。这可以防止用户的意外操作。\n\n接下来，为登录界面创建\
  \ HTML。[login.html]\n```html\n<!DOCTYPE html>\n<html xmlns:th =\"http://www.thymeleaf.org\"\
