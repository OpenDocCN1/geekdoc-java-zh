  ```java\npackage com.example.repository;\nimport java.util.List;\nimport org.apache.ibatis.annotations.Mapper;\n\
  import org.apache.ibatis.annotations.Param;\n```\n\n\n\n\n```java\nimport com.example.domain.user.model.MUser;\n\
  @Mapper\npublic interface UserMapper {\n    /** 用户注册 */\n    public int insertOne(MUser\
  \ user);\n\n    /** 获取用户 */\n    public List<MUser> findMany();\n\n    /** 获取用户(1\
  \ 条记录) */\n    public MUser findOne(String userId);\n\n    /** 更新用户 */\n    public\
  \ void updateOne(@Param(\"userId\") String userId, @Param(\"password\") String password,\
  \ @Param(\"userName\") String userName);\n\n    /** 删除用户 */\n    public int deleteOne(@Param(\"\
  userId\") String userId);\n}\n```\n\n**Point**: 如果你使用多个参数，请使用 `@Param` 对方法参数进行注解。该注解的值指定了参数名称。然后修改\
  \ `xml` 文件。背景颜色变化的部分即为修改的部分。\n\n[UserMapper.xml]\n```xml\n<?xml version =\"1.0\"\
  \ encoding =\"UTF-8\" ?>\n<!DOCTYPE mapper PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\"\
  \ \"http://mybatis.org/dtd/mybatis-3-mapper.dtd\">\n<!-- Mapper 和 xml 映射 -->\n<mapper\
  \ namespace =\"com.example.repository.UserMapper\" >\n    <!-- 映射定义 (user) -->\n\
  \    <resultMap type =\"com.example.domain.user.model.MUser\" id =\"user\" >…(Omitted)</resultMap>\n\
  \    <!-- 用户注册 -->\n    <insert id =\"insertOne\">…(Omitted)</insert>\n    <!--\
  \ 获取用户(多个) -->\n    <select id =\"findMany\" resultType =\"MUser\">…(Omitted)</select>\n\
  \    <!-- 获取用户(1 条记录) -->\n    <select id =\"findOne\" resultMap =\"user\">…(Omitted)</select>\n\
  \    <!-- 更新用户 -->\n    <update id =\"updateOne\">upem_usersetpassword = #{password},\
  \ user_name = #{userName}whereuser_id = #{userId}</update>\n    <!-- 删除用户 -->\n\
  \    <delete id =\"deleteOne\">delete fromm_userwhereuser_id = #{userId}</delete>\n\
  </mapper>\n```\n\n**Point**: 使用 `@Param` 注解指定的 `@Param` 值可以嵌入 SQL 中。使用 `#{parameter\
