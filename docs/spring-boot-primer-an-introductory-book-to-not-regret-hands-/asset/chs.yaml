  \n# 10.2 如何实现异常处理\n接下来，你将在 Spring 中实现异常处理。Spring 提供了多种机制，允许异常处理标准化。这让开发者能够专注于实现核心逻辑。在\
  \ Spring 中实现异常处理有三种方式：\n\n* 在 `@AfterThrowing` 切面中的异常处理\n* 针对每个控制器的异常处理\n* 针对整个\
  \ Web 应用程序的异常处理\n\n\n\n\n\n### 10.2.1 @AfterThrowing 切面中的异常处理\n\n### 概述\n`@AfterThrowing`\
  \ 切面用于在发生错误时输出日志。如果发生了 `DataAccessException`，修改应用程序以输出以下日志。\n\n[日志]（节录）\nDataAccessException\
  \ has occurred\n\n#### 目录\n目录结构如下。背景颜色发生变化的部分是新添加的部分。\n![](img/image_rsrcDUD.jpg)\n\
  SpringBootSample\n┗ ![](img/image_rsrcDUE.jpg) src/main\n    ┣ ![](img/image_rsrcDUE.jpg)\
  \ java\n    ┃┗ ![](img/image_rsrcDUE.jpg) com.example\n    ┃   ┣ ![](img/image_rsrcDUE.jpg)\
  \ application.service\n    ┃   ┣ ![](img/image_rsrcDUE.jpg) aspect\n    ┃   ┃┣ ![](img/image_rsrcDUG.jpg)\
  \ `ErrorAspect.java` (创建一个新类)\n    ┃   ┃┗ ![](img/image_rsrcDUH.jpg) `LogAspect.java`\n\
  \    ┃   ┣ ![](img/image_rsrcDUE.jpg) config\n    ┃   ┣ ![](img/image_rsrcDUE.jpg)\
  \ controller\n    ┃   ┣ ![](img/image_rsrcDUE.jpg) domain.user\n    ┃   ┣ ![](img/image_rsrcDUE.jpg)\
  \ hello\n    ┃   ┣ ![](img/image_rsrcDUE.jpg) repository\n    ┃   ┗ ![](img/image_rsrcDUH.jpg)\
  \ `SpringBootSampleApplication.java`\n    ┣ ![](img/image_rsrcDUE.jpg) resources\n\
  \    ┗ ![](img/image_rsrcDUM.jpg) `pom.xml`\n\n#### 源码\n创建一个在发生错误时输出日志的 AOP。\n\n\
  [ErrorAspect.java]\n```java\npackage com.example.aspect;\nimport org.aspectj.lang.annotation.AfterThrowing;\n\
  import org.aspectj.lang.annotation.Aspect;\nimport org.springframework.dao.DataAccessException;\n\
  import org.springframework.stereotype.Component;\nimport lombok.extern.slf4j.Slf4j;\n\
  \n@Aspect\n@Component\n@Slf4j\npublic class ErrorAspect {\n    @AfterThrowing (value\
  \ = \"execution(* *..*..*(..)) &&\"+\n    \"(bean(*Controller) || bean(*Service)\
  \ || bean(*Repository))\" ,throwing = \"ex\" )\n    public void throwingNull(DataAccessException\
  \ ex ) {\n        // Exception handling (log output)\n        log .error(\"DataAccessException\
  \ has occurred\" );\n    }\n}\n```\n\n#### 关键点：@AfterThrowing\n通过注解 `@AfterThrowing`，可以在发生异常时实现\
  \ AOP。在 `throwing` 属性中，指定异常类的方法参数。\n\n### 执行\n运行 SpringBoot 访问用户注册页面。在 User ID 字段中输入\
  \ \"system@co.jp\" 来注册用户。发生唯一约束冲突。\n![](img/image_rsrcDWD.jpg)\n将输出以下日志。\n\n[日志]（节录）\n\
  DataAccessException has occurred\n\n### 10.2.2 每个 controller 类的异常处理\n\n### 概述\n\
  在本节中，你将学习当 controller 类中发生意外异常时的异常处理。当用户注册页面发生错误时，通用错误界面将显示以下消息。\n\n[通用错误界面]\n![](img/image_rsrcDWF.jpg)\n\
  \n#### 目录\n目录结构没有变化。\n\n#### 源码\n修改用户注册页面上的 controller。背景颜色发生变化的部分是修改过的。\n\n[SignupController.java]\n\
  ```java\npackage com.example.controller;\nimport java.util.Locale;\nimport java.util.Map;\n\
  import org.modelmapper.ModelMapper;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.dao.DataAccessException;\nimport org.springframework.http.HttpStatus;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.validation.BindingResult;\nimport org.springframework.validation.annotation.Validated;\n\
  import org.springframework.web.bind.annotation.ExceptionHandler;\n```\n\n\n\n\n\
  ```java\nimport org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\n\
  import org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import com.example.application.service.UserApplicationService;\nimport com.example.domain.user.model.MUser;\n\
  import com.example.domain.user.service.UserService;\nimport com.example.form.GroupOrder;\n\
  import com.example.form.SignupForm;\nimport lombok.extern.slf4j.Slf4j;\n\n@Controller\n\
  @RequestMapping(\"/user\")\n@Slf4j\npublic class SignupController {\n    @Autowired\n\
  \    private UserApplicationService userApplicationService;\n\n    @Autowired\n\
  \    private UserService userService;\n\n    @Autowired\n    private ModelMapper\
  \ modelMapper;\n\n    /** 显示用户注册界面 */\n    @GetMapping(\"/signup\")\n    public\
  \ String getSignup(Model model, Locale locale, @ModelAttribute SignupForm form)\
  \ {…(Omitted)}\n\n    /** 用户注册流程 */\n    @PostMapping(\"/signup\")\n    public String\
  \ postSignup(Model model, Locale locale, @ModelAttribute @Validated(GroupOrder.class)\
  \ SignupForm form, BindingResult bindingResult) {…(Omitted)}\n\n    /** 数据库相关的异常处理\
  \ */\n    @ExceptionHandler(DataAccessException.class)\n    public String dataAccessExceptionHandler(DataAccessException\
  \ e, Model model) {\n        // 设置空字符串\n        model.addAttribute(\"error\", \"\
  \");\n        // 在 Model 中注册消息\n        model.addAttribute(\"message\", \"An exception\
  \ occurred in SignupController\");\n        // 在 Model 中注册 HTTP 错误码(500)\n     \
  \   model.addAttribute(\"status\", HttpStatus.INTERNAL_SERVER_ERROR);\n        return\
  \ \"error\";\n    }\n\n    /** 其他异常处理 */\n    @ExceptionHandler(Exception.class)\n\
  \    public String exceptionHandler(Exception e, Model model) {\n        // 设置空字符串\n\
  \        model.addAttribute(\"error\", \"\");\n        // 在 Model 中注册消息\n      \
  \  model.addAttribute(\"message\", \"An exception occurred in SignupController\"\
  );\n        // 在 Model 中注册 HTTP 错误码(500)\n        model.addAttribute(\"status\"\
  , HttpStatus.INTERNAL_SERVER_ERROR);\n        return \"error\";\n    }\n}\n```\n\
  \n### 重点：`@ExceptionHandler`\n可以通过提供带有 `@ExceptionHandler` 注解的方法来实现异常处理。通过在注解的参数中指定异常类，可以为每个异常执行相应的处理。此外，你也可以准备多个带有\
  \ `@ExceptionHandler` 的方法。\n\n在上面的示例代码中，发生异常时会显示通用错误页面。此时，错误消息和其他信息会被注册在 `Model`\
  \ 类中。\n\n### 执行\n1. 运行 `SpringBoot` 以访问用户注册界面。\n2. 在 User ID 字段输入“system@co.jp”注册用户。\n\
  3. 发生唯一性约束冲突。\n![](img/image_rsrcDWG.jpg)\n显示通用错误页面。显示你刚刚创建的异常处理消息。\n\n## 10.2.3\
  \ 整个 Web 应用异常处理\n\n### 概述\n如果你为每个控制器类准备异常处理，就可以针对每个屏幕适当处理异常。但是，可能会有人忘记实现异常处理。因此，请为整个\
  \ Web 应用准备异常处理。这允许你批量实现异常处理。\n\n当对整个 Web 应用执行异常处理时，通用错误页面将显示以下消息。\n[通用错误页面]\n![](img/image_rsrcDWH.jpg)\n\
  \n#### 目录\n目录结构如下。背景颜色发生的部分是新添加的部分。\n![](img/image_rsrcDUD.jpg)\n```text\nSpringBootSample\n\
  ┗ src/main\n   ┣ java\n   ┃┗ com.example\n      ┃  application.service\n      ┃\
  \  aspect\n      ┃   ┣ ErrorAspect.java\n      ┃   ┣ GlobalControllAdvice.java (创建一个新类)\n\
  \      ┃   ┗ LogAspect.java\n      ┃  config\n      ┃  controller\n      ┃  domain.user\n\
  \      ┃  form\n      ┃  hello\n      ┃  repository\n      ┃┗ SpringBootSampleApplication.java\n\
  \   ┗ resources\n      ┗ pom.xml\n```\n\n# 源代码\n为整个 Web 应用创建异常处理。\n\n[GlobalControllAdvice.java]\n\
  ```java\npackage com.example.aspect;\nimport org.springframework.dao.DataAccessException;\n\
  import org.springframework.http.HttpStatus;\nimport org.springframework.stereotype.Component;\n\
  import org.springframework.ui.Model;\nimport org.springframework.web.bind.annotation.ControllerAdvice;\n\
  import org.springframework.web.bind.annotation.ExceptionHandler;\n\n@ControllerAdvice\n\
  public class GlobalControllAdvice {\n    /** 数据库相关的异常处理 */\n    @ExceptionHandler(DataAccessException.class)\n\
  \    public String dataAccessExceptionHandler(DataAccessException e, Model model)\
  \ {\n        // 设置空字符串\n        model.addAttribute(\"error\", \"\");\n        //\
  \ 在 Model 中注册消息\n        model.addAttribute(\"message\", \"DataAccessException has\
  \ occurred\");\n        // 在 Model 中注册 HTTP 错误码(500)\n        model.addAttribute(\"\
  status\", HttpStatus.INTERNAL_SERVER_ERROR);\n        return \"error\";\n    }\n\
  \n    /** 其他异常处理 */\n    @ExceptionHandler(Exception.class)\n    public String exceptionHandler(Exception\
  \ e, Model model) {\n        // 设置空字符串\n        model.addAttribute(\"error\", \"\
  \");\n        // 在 Model 中注册消息\n        model.addAttribute(\"message\", \"Exception\
  \ has occurred\");\n        // 在 Model 中注册 HTTP 错误码(500)\n        model.addAttribute(\"\
  status\", HttpStatus.INTERNAL_SERVER_ERROR);\n        return \"error\";\n    }\n\
  }\n```\n\n### 重点：`@ControllerAdvice`\n通过将此注解附加到类上，你可以准备一个被所有控制器共享的方法。但是，只有带有以下注解之一的方法才能在控制器之间进行共享：\n\
  * `@ExceptionHandler`\n* `@InitBinder`\n* `@ModelAttribute`\n\n### 执行\n运行 Spring\
  \ Boot 并访问以下 URL。\n[URL]http://localhost:8080/user/detail\n当访问用户详情屏幕时，如果 URL 中未包含用户\
  \ ID，将发生错误。因此，屏幕将切换到通用错误屏幕。\n通用错误屏幕 ![](img/error` 下准备错误屏幕文件。如果你有一个名为 `404.html`\
  \ 的文件，可以为 404 错误创建一个页面。\n\n[异常处理]\n处理异常有三种方法：\n* 你使用 `@AfterThrowing` 注解。\n* `@ExceptionHandler`\
  \ 注解用于针对每个控制器类进行异常处理。\n* `@ControllerAdvice` 和 `@ExceptionHandler` 注解用于处理整个 Web\
  \ 应用的异常。\n\n## 11. Spring Security\n在本章中，你将学习 Spring Security。安全是 Web 应用的基本功能。你将学习以下内容：\n\
  * 概述\n* 身份认证 (Authentication)\n* 授权 (Authorization)\n\n#### 11.1 概述\nSpring Security\
  \ 拥有认证和授权功能。认证简单来说就是登录功能。只有成功登录的用户才能各种功能。Spring 让登录功能的变得非常简单。授权是根据权限进行的功能限制。在 Spring\
  \ 中，可以根据用户拥有的权限限制各种功能。例如，你可以阻止访问特定的 URL。你也可以根据权限更改屏幕显示项。你将在实际制作这些功能时学习它们。\n\n####\
  \ 11.2 身份认证\n首先，创建登录功能。你将按照以下顺序创建它：\n* 禁止直接链接\n* 登录流程\n* 内存认证\n* 密码加密\n* 用户数据认证\n\
  * 注销处理\n* CSRF 措施\n\n\n\n\n\n### 11.2.1 禁止直接链接\n\n### 概述\n如果可以通过直接输入 URL 访问页面，那么创建登录功能就没有意义了。这就像在房子周围没有围墙的情况下建了一道门。因此，除了某些页面外，用户未登录时无法访问页面。换句话说，禁止直接链接。如果用户未登录并尝试访问页面，页面将跳转到通用错误页面。\n\
  \n[通用错误页面]\n![11-2-1-display-image](img/image_rsrcDWJ.jpg)\n\n#### 目录\n目录结构如下。背景颜色发生区域是新添加的部分。\n\
  \n![](img/image_rsrcDUD.jpg) \n![](img/image_rsrcDUE.jpg) SpringBootSample\n┗ ![](img/image_rsrcDUE.jpg)\
  \ src/main\n   ┣ ![](img/image_rsrcDUE.jpg) java\n   ┃┗ ![](img/image_rsrcDUE.jpg)\
  \ com.example\n   ┃   ┣ ![](img/image_rsrcDUE.jpg) application.service\n   ┃   ┣\
  \ ![](img/image_rsrcDUE.jpg) aspect\n   ┃   ┣ ![](img/image_rsrcDUE.jpg) config\n\
  \   ┃   ┃┣ ![](img/image_rsrcDUH.jpg) JavaConfig.java\n   ┃   ┃┗ ![](img/image_rsrcDUG.jpg)\
  \ SecurityConfig.java (创建一个新类)\n   ┃   ┣ ![](img/image_rsrcDUE.jpg) controller\n\
  \   ┃   ┣ ![](img/image_rsrcDUE.jpg) domain.user\n   ┃   ┣ ![](img/image_rsrcDUE.jpg)\
  \ form\n   ┃   ┣ ![](img/image_rsrcDUE.jpg) hello\n   ┃   ┣ ![](img/image_rsrcDUE.jpg)\
  \ repository\n   ┃   ┗ ![](img/image_rsrcDUH.jpg) SpringBootSampleApplication.java\n\
  \   ┣ ![](img/image_rsrcDUE.jpg) resources\n   ┗ ![](img/image_rsrcDUM.jpg) pom.xml\n\
  \n#### 源码\n首先，添加 Spring security 库。在 `pom.xml` 的 `dependencies` 标签中添加以下代码。背景颜色发生区域是添加的部分。\n\
  \n[pom.xml]\n```xml\n<dependencies>\n  …<!-- SpringSecurity -->\n  <dependency>\n\
  \    <groupId> org.springframework.boot</groupId>\n    <artifactId> spring-boot-starter-security</artifactId>\n\
  \  </dependency>\n  <!-- Thymeleaf 扩展库 (Security) -->\n  <dependency>\n    <groupId>\
  \ org.thymeleaf.extras</groupId>\n    <artifactId> thymeleaf-extras-springsecurity5</artifactId>\n\
  \  </dependency>\n  …\n</dependencies>\n```\n\n接下来，准备一个安全配置类。\n\n[SecurityConfig.java]\n\
  ```java\npackage com.example.config;\nimport org.springframework.context.annotation.Configuration;\n\
  import org.springframework.security.config.annotation.web.builders.HttpSecurity;\n\
  import org.springframework.security.config.annotation.web.builders.WebSecurity;\n\
  import org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;\n\
  import org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;\n\
  \n@EnableWebSecurity\n@Configuration\npublic class SecurityConfig extends WebSecurityConfigurerAdapter\
  \ {\n    /** 设置目标安全外范围 */\n    @Override\n    public void configure(WebSecurity\
  \ web ) throws Exception {\n        // 不应用安全\n        web.ignoring().antMatchers(\"\
  /webjars/**\")\n           .antMatchers(\"/css/**\")\n           .antMatchers(\"\
  /js/**\")\n           .antMatchers(\"/h2-console/**\");\n    }\n\n    /** 各种安全设置\
  \ */\n    @Override\n    protected void configure(HttpSecurity http ) throws Exception\
  \ {\n        // 设置不需要登录的页面\n        http.authorizeRequests()\n            .antMatchers(\"\
  /login\" ).permitAll() // 直接链接 OK。\n            .antMatchers(\"/user/signup\" ).permitAll()\
  \ // 直接链接 OK。\n            .anyRequest().authenticated(); // 其他直接链接 NG\n       \
  \ // 禁用 CSRF 措施（临时）\n        http .csrf().disable();\n    }\n}\n```\n\n#### 重点 1：安全配置类\n\
  为了准备安全设置类，进行以下设置：\n* 使用 `@Configuration` 和 `@EnableWebSecurity` 注解类。\n* 继承 `WebSecurityConfigurerAdapter`\
  \ 类。\n\n你可以通过重写 `WebSecurityConfigureAdapter` 的方法来更改安全设置。\n\n#### 重点 2：排除安全\n让 `webjars`\
  \ 和 `css` 等静态资源所有人可用。这还允许你在无需登录的情况下使用 H2 数据库控制台。因此，这些资源被排除在安全之外。设置方法如下：\n\n[如何配置安全排除]\n\
  `web.ignoring().antMatchers(\"排除路径\")`\n`antMatchers` 方法可以像示例代码一样使用链式调用。\n\n####\
  \ 重点 3：禁止直接链接\n要禁止直接链接，请使用 `http.authorizeRequests()` 方法。在此方法之后，你将为每个路径添加设置。\n\n\
  [直接链接：OK]\n`antMatchers(\"path\").permitAll()`\n在 `antMatchers` 方法的参数中指定路径。使用 `permitAll()`\
  \ 方法允许无需身份验证访问该路径。\n\n[直接链接：NG]\n`anyRequest().authenticated()`\n所有路径都受 `anyRequest()`\
  \ 方法的目标。`authenticated()` 方法需要身份验证。这意味着 `\"anyRequest().authenticated()\"` 要求所有路径都需要身份验证。\n\
  \n这些设置按照调用的顺序应用。\n\n---\n\n### 11.2.2 登录过程\n\n### 概述\n在登录页面上输入 ID 和密码并点击“登录”按钮。未登录时，页面将跳转到错误页面。由于禁止了直接链接，各种页面无法显示。\n\
  \n[登录页面]\n![11-2-1-display-image](img/image_rsrcDWK.jpg)\n尚未登录。\n\n#### 目录\n目录结构没有变化。\n\
  \n#### 源码\n首先，修改安全配置类。背景颜色发生区域是添加的部分。\n\n[SecurityConfig.java]\n```java\n@EnableWebSecurity\n\
  @Configuration\npublic class SecurityConfig extends WebSecurityConfigurerAdapter\
  \ {\n    /** 设置目标安全外范围 */\n    @Override\n    public void configure(WebSecurity\
  \ web ) throws Exception {\n        …（省略）\n    }\n\n    /** 各种安全设置 */\n    @Override\n\
  \    protected void configure(HttpSecurity http ) throws Exception {\n        //\
  \ 设置不需要登录的页面\n        http.authorizeRequests()\n            .antMatchers(\"/login\"\
  \ ).permitAll() // 直接链接 OK。\n            .antMatchers(\"/user/signup\" ).permitAll()\
  \ // 直接链接 OK。\n            .anyRequest().authenticated(); // 其他直接链接 NG\n       \
  \ // 登录过程\n        http.formLogin()\n            .loginProcessingUrl(\"/login\"\
  \ ) // 登录处理路径\n            .loginPage(\"/login\" ) // 指定登录页面\n            .failureUrl(\"\
  /login?error\" ) // 登录失败时的跳转目标\n            .usernameParameter(\"userId\" ) // 登录页面用户\
  \ ID\n            .passwordParameter(\"password\" ) // 登录页面密码\n            .defaultSuccessUrl(\"\
  /user/list\", true ); // 成功后的跳转目标\n        // 禁用 CSRF 措施（临时）\n        http .csrf().disable();\n\
  \    }\n}\n```\n\n#### 重点：登录过程\n添加登录过程，调用 `http.formLogin()` 方法。从该方法开始，在方法链中添加条件。\n\
  \n* `loginProcessingUrl(\"path\")`\n    指定登录处理的路径。与登录页面 HTML 中表单标签 `th:action=\"\
  @{/login}\"` 的路径匹配。\n\n* `loginPage(\"path\")`\n    设置登录页面的链接目标。如果不设置此项，将看到 Spring\
  \ Security 提供的默认登录页面。与登录页面控制器的 `@GetMapping(\"/ login\")` 部分匹配。\n\n* `failureUrl(\"\
  path\")`\n    登录失败时的跳转目标。\n\n* `usernameParameter(\"用户 ID name 属性\")`\n    设置登录页面用户\
  \ ID 输入框中 name 属性的值。\n\n* `passwordParameter(\"密码 name 属性\")`\n\n\n\n\n\n设置登录界面上密码输入框中\
  \ `name` 属性的值。\n\n*   `defaultSuccessUrl(\"登录成功后的跳转目标路径\", 是否跳转到第一个参数指定的跳转目标)`\n\
  \n指定登录成功后的跳转目标。如果将第二个参数指定为 `true`，则将强制跳转到第一个参数的路径。\n\n然后修改登录界面。背景颜色改变的部分为修改部分。`[login.html]`\n\
