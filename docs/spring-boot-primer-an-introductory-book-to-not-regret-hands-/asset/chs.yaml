  ```java\npackage com.example.repository;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\
  import org.springframework.data.jpa.repository.Modifying;\nimport org.springframework.data.jpa.repository.Query;\n\
  import org.springframework.data.repository.query.Param;\nimport com.example.domain.user.model.MUser;\n\
  public interface UserRepository extends JpaRepository<MUser, String> {\n    /**\
  \ Login user search */\n    @Query (\"select user\"+ \" from MUser user\"+ \" where\
  \ userId = :userId\" )\n    public MUser findLoginUser(@Param (\"userId\" ) String\
  \ userId );\n    /** User update */\n    @Modifying\n    @Query (\"update MUser\"\
  + \" set\"+ \"   password = :password\"+ \"   , userName = :userName\"+ \" where\"\
  + \"   userId = :userId\" )\n    public Integer updateUser(@Param (\"userId\" )\
  \ String userId ,@Param (\"password\" ) String password ,@Param (\"userName\" )\
  \ String userName );\n}\n```\n\n#### 点 1: @Query / @Param\n如果你准备了一个带有 `@Query` 注解的方法，就可以准备执行任意\
  \ SQL 方法。在 `@Query` 注解内部编写 SQL。但是，此 SQL 不使用表名或列名，而是使用 Java 类名和字段名。这是 JPA 使用的称为 JPQL\
  \ 的查询语言。你也可以通过指定 `nativeQuery` 属性为 true 来编写原生 SQL。此外，方法参数可以使用 `: variable name`\
  \ 嵌入查询中。你可以使用 `@Param` 注解来重命名方法参数。\n\n#### 点 2: @Modifying\n在使用 `@Query` 注解执行 `insert`\
  \ / `update` / `delete` 语句和 DDL 时，必须添加 `@Modifying` 注解。\n\n接下来，修改 JPA 的 service。背景颜色改变的部分修改部分。\n\
  \n`UserServiceImpl2.java`\n```java\n@Service\n@Primary\npublic class UserServiceImpl2\
  \ implements UserService {\n    @Autowired\n    private UserRepository repository\
  \ ;\n    @Autowired\n    private PasswordEncoder encoder ;\n    /** User signup\
  \ */\n    @Transactional\n    @Override\n    public void signup(MUser user ) {…(Omitted)}\n\
  \    /** Get user */\n    @Override\n    public List<MUser> getUsers(MUser user\
  \ ) {\n        return repository .findAll();\n    }\n    /** Get user(1record) */\n\
  \    @Override\n    public MUser getUserOne(String userId ) {…(Omitted)}\n    /**\
  \ Update user */\n    @Transactional\n    @Override\n    public void updateUserOne(String\
  \ userId , String password , String userName ) {\n        // Password encryption\n\
  \        String encryptPassword = encoder .encode(password );\n        // User update\n\
  \        repository .updateUser(userId , encryptPassword , userName );\n    }\n\
  \    /** Delete user */\n    @Transactional\n    @Override\n    public void deleteUserOne(String\
  \ userId ) {\n        repository .deleteById(userId );\n    }\n    /** Get login\
  \ user */\n    @Override\n    public MUser getLoginUser(String userId ) {\n    \
  \    return repository .findLoginUser(userId );\n    }\n}\n```\n\n无论是否存在 `@Modifying`\
  \ 注解，如果 SQL 执行 `insert`、`update` 和 `delete`，都应该加上 `@Transactional` 注解。（到目前为止，我还没有注解\
  \ `@Transactional`）\n\n### 执行\n运行 SpringBoot 并访问用户详情界面。执行结果的显示省略，但可以更新用户。\n\n注意：自动生成\
