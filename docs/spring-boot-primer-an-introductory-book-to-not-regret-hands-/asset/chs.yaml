  \ 创建一个控制器。\n\n[UserRestController.java]\n```java\npackage com.example.rest;\nimport\
  \ org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.web.bind.annotation.DeleteMapping;\n\
  import org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.PutMapping;\n\
  import org.springframework.web.bind.annotation.RequestBody;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import org.springframework.web.bind.annotation.RestController;\nimport com.example.domain.user.service.UserService;\n\
  import com.example.form.UserDetailForm;\n\n@RestController\n@RequestMapping (\"\
  /user\" )\npublic class UserRestController {\n    @Autowired\n    private UserService\
  \ userService ;\n\n    /** 更新用户 */\n    @PutMapping (\"/update\" )\n    public int\
  \ updateUser(UserDetailForm form ) {\n        // 更新用户\n        userService .updateUserOne(form\
  \ .getUserId(),form .getPassword(),form .getUserName());\n        return 0;\n  \
  \  }\n\n    /** 删除用户 */\n    @DeleteMapping (\"/delete\" )\n    public int deleteUser(UserDetailForm\
  \ form ) {\n        // 删除用户\n        userService .deleteUserOne(form .getUserId());\n\
  \        return 0;\n    }\n}\n```\n\n**要点：** `@RestController`\n使用 `@RestController`\
  \ 注解类。这样你就可以在 REST 中接收类方法的返回值。准确来说，方法的返回值将作为 HTTP 响应体返回。\n\n在示例代码中，使用你到为止创建的服务来更新和删除用户。\n\
  \n接下来，为用户详情界面创建 JavaScript。该 JavaScript 使用 jQuery。\n\n[detail.js]\n```javascript\n\
  'use strict' ;\n\n/** 加载界面时的处理 */\njQuery(function ($){\n    /** 更新按钮处理 */\n   \
  \ $('#btn-update' ).click(function (event) {\n        // 用户更新\n        updateUser()\
  \ ;\n    });\n    /** 删除按钮处理 */\n    $('#btn-delete' ).click(function (event) {\n\
  \        // 用户删除\n        deleteUser();\n    });\n});\n\n/** 用户更新处理 */\nfunction\
  \ updateUser() {\n    // 获取表单值\n    var formData = $('#user-detail-form' ).serializeArray();\n\
  \    // ajax 通信\n    $.ajax({\n        type : \"PUT\" ,\n        cache : false ,\n\
  \        url : '/user/update' ,\n        data: formData,\n        dataType : 'json'\
  \ ,\n    }).done(function (data) {\n        // ajax 成功\n        alert('Updated user'\
  \ );\n        // 重定向到用户列表界面\n        window.location.href = '/user/list' ;\n   \
  \ }).fail(function (jqXHR, textStatus, errorThrown) {\n        // ajax 失败\n    \
  \    alert('Failed to update user' );\n    }).always(function () {\n        // 始终执行的操作\n\
  \    });\n}\n\n/** 用户删除处理 */\nfunction deleteUser() {\n    // 获取表单值\n    var formData\
  \ = $('#user-detail-form' ).serializeArray();\n    // ajax 通信\n    $.ajax({\n  \
  \      type : \"DELETE\" ,\n        cache : false ,\n        url : '/user/delete'\
  \ ,\n        data: formData,\n        dataType : 'json' ,\n    }).done(function\
  \ (data) {\n        // ajax 成功\n        alert('Deleted user' );\n        // 重定向到用户列表界面\n\
  \        window.location.href = '/user/list' ;\n    }).fail(function (jqXHR, textStatus,\
  \ errorThrown) {\n        // ajax 失败\n        alert('Failed to delete user' );\n\
  \    }).always(function () {\n        // 始终执行的操作\n    });\n}\n```\n\n**注意：** ajax\
  \ 通信\n使用 jQuery，你可以使用 `$.ajax` 函数进行 ajax 通信。Ajax 通信是异步通信。异步通信是一种不需要等待服务器处理的通信方法。例如，从服务器请求一个耗时的过程（如文件下载）。异步通信允许用户在在此期间与界面进行交互。\n\
  \n在本文的示例代码中，ajax 通信后没有执行后续操作，因此进行了重定向。\n\n\n\n\n\n另一方面，同步通信是一种客户端等待服务器完成处理的通信方式。目前为止创建的所有使用\
  \ `form` 标签的请求都是同步的。\n\n### 注意：CSRF token\n如果你在 `Spring Security` 中采取了 CSRF 措施，则你需要在\
  \ `ajax` 通信中也发送 `CSRF` token。如果不发送令牌，通信将会被安全机制拦截。在示例代码中，发送了表单的所有内容，因此 `CSRF` token\
  \ 已包含在发送的内容中。\n\n最后，修改用户详情页面。\n\n[detail.html]\n```html\n<!DOCTYPE html>\n<html\
