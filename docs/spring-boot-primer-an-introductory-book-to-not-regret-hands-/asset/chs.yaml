  \ 属性\n当连接多个表时，select 结果中的列名可能会重复。为了避免重复列名，可以对 select 结果设置别名。然而，如果给了别名，它将不再匹配映射定义中的列名。`columnPrefix`\
  \ 属性用于解决这个问题。\n\n让我们查看示例代码如何使用 `columnPrefix` 属性。\n\n```xml\n[UserMapper.xml]\n\
  <!-- 映射定义 (user) -->\n<resultMap type =\"com.example.domain.user.model.MUser\" id\
  \ =\"user\">\n  …(已省略)\n  <collection property =\"salaryList\" resultMap =\"salary\"\
  \ columnPrefix = \"salary_\" />\n</resultMap>\n…(已省略)\n<!-- 映射定义 (salary) -->\n\
  <resultMap type =\"com.example.domain.user.model.Salary\" id =\"salary\">\n  <id\
  \ column =\"user_id\" property =\"userId\" />\n  <id column =\"year_month\" property\
  \ =\"yearMonth\" />\n  <result column =\"salary\" property =\"salary\" />\n</resultMap>\n\
  …(已省略)\n<select id =\"findOne\" resultMap =\"user\">select m_user.user_id, m_user.password,\
  \ m_user.user_name, m_user.birthday, m_user.age, m_user.gender, m_department.department_id,\
  \ m_department.department_name, t_salary.user_id as salary_user_id, t_salary.year_month\
  \ as salary_year_month, t_salary.salary as salary_ from m_user left join m_department\
  \ on m_user.department_id = m_department.department_id left join t_salary on m_user.user_id\
  \ = t_salary.user_id where m_user.user_id = #{userId}</select>\n```\n\n作为 select\
  \ 语句的结果，别名名前加上了 `salary_`。将其设置为 `columnPrefix` 属性的值。这将允许带有 `salary_` 前缀的列匹配 salary\
  \ 表的映射定义。\n\n顺便说，你也可以为 `association` 标签添加 `columnPrefix` 属性。\n\n接下来，为 `salary` 表创建一个实体类。\n\
