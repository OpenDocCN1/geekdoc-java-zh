  \n## 1.2.6 注销处理\n\n### 概述\n在创建登录流程后，让我们也创建注销流程。\n\n#### 目录\n目录结构没有变化。\n\n# 源代码\n\
  修改安全配置类。背景改变的部分为修改部分。\n\n`[SecurityConfig.java]`\n```java\npackage com.example.config;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.context.annotation.Bean;\n\
  import org.springframework.context.annotation.Configuration;\nimport org.springframework.security.config.annotation.authentication.builders.AuthenticationManagerBuilder;\n\
  import org.springframework.security.config.annotation.web.builders.HttpSecurity;\n\
  import org.springframework.security.config.annotation.web.builders.WebSecurity;\n\
  import org.springframework.security.config.annotation.web.configuration.EnableWebSecurity;\n\
  import org.springframework.security.config.annotation.web.configuration.WebSecurityConfigurerAdapter;\n\
  import org.springframework.security.core.userdetails.UserDetailsService;\nimport\
  \ org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\nimport org.springframework.security.crypto.password.PasswordEncoder;\n\
  import org.springframework.security.web.util.matcher.AntPathRequestMatcher;\n```\n\
  \n\n\n\n\n```java\n@EnableWebSecurity\n@Configuration\npublic class SecurityConfig\
  \ extends WebSecurityConfigurerAdapter {\n    @Autowired\n    private UserDetailsService\
  \ userDetailsService;\n\n    @Bean\n    public PasswordEncoder passwordEncoder()\
  \ {\n        return new BCryptPasswordEncoder();\n    }\n\n    /** Set a target\
  \ out-of-security */\n    @Override\n    public void configure(WebSecurity web)\
  \ throws Exception {…(Omitted)}\n\n    /** Various security settings */\n    @Override\n\
  \    protected void configure(HttpSecurity http) throws Exception {\n        //\
  \ Set of login unnecessary page\n        http.authorizeRequests()\n            .antMatchers(\"\
  /login\").permitAll() // Direct link OK.\n            .antMatchers(\"/user/signup\"\
  ).permitAll() // Direct link OK.\n            .anyRequest().authenticated(); //\
  \ Otherwise direct link NG\n\n        // Login process\n        http.formLogin()\n\
  \            .loginProcessingUrl(\"/login\") // Login process path\n           \
  \ .loginPage(\"/login\") // Specify login page\n            .failureUrl(\"/login?error\"\
  ) // Transition destination when login fails.\n            .usernameParameter(\"\
  userId\") // Login page user ID\n            .passwordParameter(\"password\") //\
  \ Login page password\n            .defaultSuccessUrl(\"/user/list\", true); //\
  \ Transition destination after success\n\n        // Logout process\n        http.logout()\n\
  \            .logoutRequestMatcher(new AntPathRequestMatcher(\"/logout\"))\n   \
  \         .logoutUrl(\"/logout\")\n            .logoutSuccessUrl(\"/login?logout\"\
  );\n\n        // Disable CSRF measures (temporary)\n        // http.csrf().disable();\n\
