  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE mapper PUBLIC \"\
  -//mybatis.org//DTD Mapper 3.0//EN\"http://mybatis.org/dtd/mybatis-3-mapper.dtd\"\
  >\n<!-- Mapper 映射 -->\n<mapper namespace=\"com.example.repository.UserMapper\">\n\
  \    <!-- 结果映射 (user) -->\n    <resultMap type=\"com.example.domain.user.model.MUser\"\
  \ id=\"user\">\n        <id column=\"user_id\" property=\"userId\" />\n        <result\
  \ column=\"password\" property=\"password\" />\n        <result column=\"user_name\"\
  \ property=\"userName\" />\n        <result column=\"birthday\" property=\"birthday\"\
  \ />\n        <result column=\"age\" property=\"age\" />\n        <result column=\"\
  gender\" property=\"gender\" />\n        <result column=\"department_id\" property=\"\
  departmentId\" />\n        <result column=\"role\" property=\"role\" />\n    </resultMap>\n\
  \    <!-- 插入 -->\n    <insert id=\"insertOne\">…(已省略)</insert>\n    <!-- 获取用户(多条)\
  \ -->\n    <select id=\"findMany\" resultType=\"User\">…(已省略)</select>\n    <!--\
  \ 获取用户(单条) -->\n    <select id=\"findOne\" resultMap=\"user\">select*fromm_userwhereuser_id\
  \ = #{userId}</select>\n</mapper>\n```\n\n说明：resultMap 标签\n`resultMap` 标签用于将 Java\
  \ 类映射到查询结果。使用 `resultMap` 标签，特别是在执行复杂的查询语句时。`type` 属性包含类名（包名。`id` 属性可以是任意值。在 `resultMap`\
  \ 标签中，设置查询结果与 Java 类之间的映射。首先，准备一个 `id` 标签或 `result` 标签。在这些标签中设置以下属性：\n\n| 属性 | 描述\
  \ |\n\n| --- | --- |\n| column | 设置查询结果的列名 |\n| property | 设置 Java 类的字段名 | |\n\n\
  \n\n以下内容解释了 `id` 和 `result` 标签之间的区别。`id` 标签是必选标签。因为返回值的 `List` 包含的数据量与 `id` 标签中的值数量相同。例如，假设你得到如下的查询结果：\n\
  \n[示例：id 标签]\n![9-2-2-id-tag](img/image_rsrcDVU.jpg)\n\n有两个查询结果，但 `id` 标签中设置的 `user_id`\
  \ 值只有 `user@co.jp`。在这种情况下，mapper 返回的 `List<MUser>` 仅包含一条数据。也就是说，返回值的设计是为了确保在 `id`\
  \ 标签中设置的列值是唯一的。这种思想对于多表连接（table joins）是必须的。你将在本章稍后创建一个表连接示例。\n\n### select 和 resultMap\
  \ 标签的映射\n如果你使用 `resultMap`，请在 `select` 标签中添加 `resultMap` 属性。该属性的值指定 `resultMap`\
  \ 标签的 `id`。\n\n`[UserMapper.xml]`\n```xml\n<!-- 映射定义 (user) -->\n<resultMap type\
  \ =\"com.example.domain.user.model.MUser\" id = \"user\" >…</resultMap>\n<!-- 获取用户(1\
  \ 条) -->\n<select id =\"findOne\" resultMap = \"user\" >…</select>\n```\n\n然后修改用户服务（UserService）。背景颜色变化的部分为修改部分。\n\
