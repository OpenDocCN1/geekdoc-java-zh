  ~{layout/layout}\" >\n<head>（省略）</head>\n<body>\n<div layout:fragment =\"content\"\
  \ >\n<div class=\"header-bottom\" >\n<h1>用户详情</h1></div>\n<form th:action=\"@{/user/detail}\"\
  \ th:object=\"${userDetailForm}\" method=\"post\">\n<input type =\"hidden\" th:field=\"\
  *{userId}\" />\n<table>\n    （省略）\n</table>\n</form>\n</div>\n</body>\n</html>\n\
  ```\n\n### 总结\n\n### 概述\n- JPA 自动生成 SQL，提高了开发效率。\n- Spring Data JPA 让使用变得更加简单。\n\
  \n## 基础\n- 实现 `JpaRepository` 接口可以轻松创建 CRUD 操作。\n- 在实体类上使用 `@Entity` 注解。\n- 通过 `@Table`\
  \ 注解可以更改映射表的名称。\n- 在主键字段上使用 `@Id` 注解。\n- 使用 `@Query` 方法可以执行自定义查询。\n- 创建查询语句以外的查询时，加上\
  \ `@Modifying` 注解。\n\n## 进阶\n- 如果你想更改查询条件，可以使用 `Example` 类。\n- 使用 `ExampleMatcher`，你可以执行“或”条件和“LIKE”搜索。\n\
  - 在字段上使用 `@ManyToOne` 注解表示多一关系。\n- 如果你想表示一对多关系，请在字段上加上 `@OneToMany` 注解。\n- 通过 `@JoinColumn`\
  \ 注解可以指定表的连接列。\n\n# 附录\n\n作为本书的附录，我提供了以下内容：\n\n# 源代码\n本节介绍了如何下载源代码。书中创建的所有源代码均可用。你可以从以下\
  \ URL 下载：\n`https://app.box.com/s/ryozadr164ym3zwe8qesp2mclt1fzd`（注意：这是一个占位符链接）\n\
  \n### 如何导入\n导入源代码的方法如下：\n1. 在项目资源中右键点击 > 选择“Import” > “Import”。\n2. 选择“Existing\
  \ Maven Projects”。\n3. 通过“Browse”按钮选择下载的文件夹。\n4. Maven 将下载库，稍等即可完成导入。\n\n\n\n\n\
