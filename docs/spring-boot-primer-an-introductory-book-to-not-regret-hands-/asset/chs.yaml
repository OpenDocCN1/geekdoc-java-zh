  \n    @Override\n    public UserDetails loadUserByUsername(String username) throws\
  \ UsernameNotFoundException {\n        // Get user 信息\n        MUser loginUser =\
  \ service.getLoginUser(username);\n        // 如果用户不存在\n        if (loginUser ==\
  \ null) {\n            throw new UsernameNotFoundException(\"user not found\");\n\
  \        }\n        // 创建权限列表\n        GrantedAuthority authority = new SimpleGrantedAuthority(loginUser.getRole());\n\
  \        List<GrantedAuthority> authorities = new ArrayList<>();\n        authorities.add(authority);\n\
  \        // 生成 UserDetails\n        UserDetails userDetails = (UserDetails) new\
  \ User(loginUser.getUserId(),loginUser.getPassword(),authorities);\n        return\
  \ userDetails;\n    }\n}\n```\n\n### 重点：UserDetailsService\n为了创建用户认证服务，请准备一个实现 `UserDetailsService`\
  \ 的类。然后重写 `loadUserByUsername` 方法。该方法的返回值是 `UserDetails` 接口。该接口代表用户。示例代码生成 `org.springframework.security.core.userdetails.User`，它是\
  \ `UserDetails` 的实现类。`UserDetails` 需要用户 ID、密码和权限列表。最后，修改安全配置类。背景改变的部分为修改部分。\n\n\
  `[SecurityConfig.java]`\n```java\npackage com.example.config;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
