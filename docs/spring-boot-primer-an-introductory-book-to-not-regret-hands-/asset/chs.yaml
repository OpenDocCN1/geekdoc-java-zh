  # 源代码\n修改 JPA 的 service。背景颜色改变的部分修改部分。\n\n`UserServiceImpl2.java`\n```java\npackage\
  \ com.example.domain.user.service.impl;\nimport java.util.List;\nimport java.util.Optional;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.context.annotation.Primary;\n\
  import org.springframework.data.domain.Example;\nimport org.springframework.data.domain.ExampleMatcher;\n\
  import org.springframework.data.domain.ExampleMatcher.StringMatcher;\nimport org.springframework.security.crypto.password.PasswordEncoder;\n\
  import org.springframework.stereotype.Service;\nimport com.example.domain.user.model.MUser;\n\
  import com.example.domain.user.service.UserService;\nimport com.example.repository.UserRepository;\n\
  @Service\n@Primary\npublic class UserServiceImpl2 implements UserService {\n   \
  \ @Autowired\n    private UserRepository repository ;\n    @Autowired\n    private\
  \ PasswordEncoder encoder ;\n    /** User signup */\n    @Transactional\n    @Override\n\
  \    public void signup(MUser user ) {…(Omitted)}\n    /** Get user */\n    @Override\n\
  \    public List<MUser> getUsers(MUser user ) {\n        // Search conditions\n\
  \        ExampleMatcher matcher = ExampleMatcher.matching() // and condition\n \
  \       .withStringMatcher(StringMatcher.CONTAINING ) // Like clause\n        .withIgnoreCase();\
  \ // Both uppercase and lowercas\n        return repository .findAll(Example.of(user\
  \ , matcher ));\n    }\n    /** Get user(1record) */\n    @Override\n    public\
  \ MUser getUserOne(String userId ) {…(Omitted)}\n    /** Update user */\n    @Transactional\n\
  \    @Override\n    public void updateUserOne(String userId , String password ,\
  \ String userName ) {…(Omitted)}\n    /** Delete user */\n    @Transactional\n \
  \   @Override\n    public void deleteUserOne(String userId ) {\n        repository\
  \ .deleteById(userId );\n    }\n    /** Get login user */\n    @Override\n    public\
  \ MUser getLoginUser(String userId ) {\n        return repository .findLoginUser(userId\
  \ );\n    }\n}\n```\n\n#### 点: Example 和 Example Matcher\n使用 `Example` 类来生成动态 SQL\
  \ 并更改搜索条件。通过将 `Example` 类传递给 `findAll` 方法可以更改搜索条件。如果你将实体类传递给 `Example` 类，其中的值将用于搜索。如果你只将实体类传递给\
  \ `Example` 类，则搜索条件将是“与”关系（and condition）。使用 `ExampleMatcher` 来更改搜索条件。使用 `ExampleMatcher`，你可以指定“与”、“或”、“LIKE\
  \ 搜索”等。\n\n### 执行\n你可以在用户列表界面搜索用户。（执行结果省略）。\n\n#### 表连接（多对一）\n学习在 JPA 中如何连接表。如何实现取决于表与表之间的数量关系。数量关系是一多关系。在本节中，你将学习多对一情况下的表连接。在必须从\
