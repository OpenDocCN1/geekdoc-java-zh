  \ resources\n   ┗ ![](img/image_rsrcDUM.jpg) pom.xml\n\n#### 源码\n首先，准备一个映射到屏幕输入内容的表单类。\n\
  \n[SignupForm.java]\n```java\npackage com.example.form;\nimport java.util.Date;\n\
  import org.springframework.format.annotation.DateTimeFormat;\nimport lombok.Data;\n\
  \n@Data\npublic class SignupForm {\n    private String userId ;\n    private String\
  \ password ;\n    private String userName ;\n    @DateTimeFormat (pattern = \"dd/MM/yyyy\"\
  \ )\n    private Date birthday ;\n    private Integer age ;\n    private Integer\
  \ gender ;\n}\n```\n\n点：@DateTimeFormat\n绑定 `Date` 类型时，使用 `@DateTimeFormat` 注解。如果为\
  \ `pattern` 属性设置了格式，它可以绑定到 `Date` 类型。\n\n注意：@NumberFormat\n要将符合指定格式的字符串转换为数字类型，使用\
  \ `@NumberFormat` 注解。\n\n[示例]\n```java\n@NumberFormat (pattern = \"####\" )\nprivate\
  \ Integer salary ;\n```\n你可以使用上述代码将带有逗号分隔符的（如 `1,000,000`）转换为数字类型。\n\n\n\n\n\n一个以类名开头的小写字符串（`signupForm`）被注册在\
  \ `Model` 键中。你可以通过在 `Model` 中注册实例将其传递给屏幕。\n\n注意：`@Slf4j@` 是 `Lombok` 的一个注解。如果你将它附加到类上，就可以使用\
  \ `slf4j` 轻松记录日志。注解此类会提供一个名为 `log` 的静态变量。你可以使用该变量的方法轻松输出日志。在示例代码中，它是以下部分。\n\n`[SignupController.java]`\
  \ (日志输出部分)\n```\nlog.info(form.toString());\n```\n上述代码输出 info 级别的日志。每个日志输出级别都有其他方法。例如，你可以使用\
  \ `debug` 方法输出 debug 级别的日志。\n\n最后，修改用户注册页面。背景颜色改变的部分即为修改部分。\n\n`[signup.html]`\n\
  ```html\n<!DOCTYPE html>\n<html xmlns:th =\"http://www.thymeleaf.org\" ><head>…（已省略）</head>\n\
  <body class =\"bg-light\" ><form id =\"signup-form\" method =\"post\" action =\"\
  /user/signup\"class =\"form-signup\" th:object =\"${signupForm}\" ><h1 class =\"\
  text-center\" th:text =\"#{user.signup.title}\" ></h1>\n<!-- 用户 ID --\n<div class\
  \ =\"form-group\" ><label for =\"userId\" th:text =\"#{userId}\" ></label><input\
  \ type =\"text\" class =\"form-control\" th:field =\"*{userId}\" /></div>\n<!--\
  \ 密码 --\n<div class =\"form-group\" ><label for =\"password\" th:text =\"#{password}\"\
  \ ></label><input type =\"text\" class =\"form-control\" th:field =\"*{password}\"\
  \ /></div>\n<!-- 用户名 --\n<div class =\"form-group\" ><label for =\"userName\" th:text\
  \ =\"#{userName}\" ></label><input type =\"text\" class =\"form-control\" th:field\
  \ =\"*{userName}\" /></div>\n<!-- 生日 --\n<div class =\"form-group\" ><label for\
  \ =\"birthday\" th:text =\"#{birthday}\" ></label><input type =\"text\" class =\"\
  form-control\" placeholder =\"dd/MM/yyyy\" th:field =\"*{birthday}\" /></div>\n\
  <!-- 年龄 --\n<div class =\"form-group\" ><label for =\"age\" th:text =\"#{age}\"\
  \ ></label><input type =\"text\" class =\"form-control\" th:field =\"*{age}\" /></div>\n\
  <!-- 性别 --\n<div class =\"form-group\" ><div th:each =\"item : ${genderMap}\" class\
  \ =\"form-check-inline\" ><input type =\"radio\" class =\"form-check-input\" th:value\
  \ =\"item.value}\" th:field =\"*{gender}\" /><label class =\"form-check-label\"\
  \ th:text =\"item.key}\" ></label></div>\n<!-- 注册按钮 --\n<input type =\"submit\"\
  \ th:value =\"#{user.signup.btn}\"class =\"btn btn-primary w-100 mt-3\" /></form>\n\
  </body>\n</html>\n```\n\n### th:object 和 field\n\n可以使用 `th:field` 来绑定 Java 类和屏幕输入。通常写法如下：\n\
  \n[仅使用 th:field]\n```html\n<input type =\"text\" class =\"form-control\" th:field\
  \ =\"signupForm.userId\" />\n```\n使用 Model 中注册的键名绑定。如果在标签中写了 `th:object`，则可以省略。\n\
  \n[使用 th:object 和 field]\n```html\n<form id =\"signup-form\" method =\"post\" action\
  \ =\"/user/signup\"class =\"form-signup\" th:object =\"${signupForm}\" ><input type\
  \ =\"text\" class =\"form-control\" th:field =\"*{userId}\" />…</form>\n```\n只需绑定\
  \ `*{field}`。\n\n**注意：th:field**\nHTML 输入标签没有名为 `field` 的属性。使用了 `th:field` 属性后，HTML\
  \ 会变成什么样？实际生成的 HTML 如下：\n\n[转换前]\n```html\n<input type =\"text\" class =\"form-control\"\
  \ th:field =\"*{userId}\" />\n```\n[转换后]\n```html\n<input type =\"text\" class =\"\
  form-control\" id =\"userId\" name =\"userId\" />\n```\n`th:field` 属性将字段名转换为 `id`\
  \ 和 `name` 属性。\n\n### 执行\n运行 Spring Boot 并访问 URL。\n\n[URL]\n`http://localhost:8080/user/signup`\n\
  \n[执行结果]\n![6-2-1-result](img/image_rsrcDVA.jpg)\n\n在屏幕上输入值并点击[signup]按钮。显示登录页面，但输出了以下日志。\n\
  \n[日志]（节）\n```\nSignupForm(userId=tom, password=password, userName=Tom, birthday=Wed\
  \ Nov 05 00:00:00 JST 1986, age=34, gender=1)\n```\n屏幕输入内容输出到了日志。绑定完成。\n\n### 6.2.2\
  \ 编辑错误消息\n\n### 概述\n现在可以绑定有一个问题。如果绑定失败，将显示错误页面。例如，在日期类型或数字类型的地方输入字符串，绑定会失败。\n\n\
  ![](img/image_rsrcDVB.jpg)\n\n原本应该通过 JavaScript 限制屏幕输入。但由于 JavaScript Bug 或越权访问，可能会发送意外值。在这种情况下，修复为绑定失败时显示错误消息。\n\
  \n[用户注册页面]（修复后）!(image_rsrcDVC.jpg)\n\n#### 目录\n目录结构如下。背景颜色改变的部分为新增部分。\n\n![](img/image_rsrcDVA.jpg)\
  \ SpringBootSample\n```\nsrc/\n└── main/\n  ├── java/\n  │    └── com/example/demo/\n\
  \  ├── resources/\n  │    ├── application.properties\n  │    ├── data.sql\n  │ \
  \   ├── schema.sql\n  │    ├── i18n/\n  │    │    ├── messages_de.properties\n \
  \ │    │    └── messages.properties\n  │    └── templates/\n  │         └── signup.html\n\
  └── pom.xml\n```\n准备上述文件以更改绑定失败时的错误消息。\n\n# 源代码\n修改 `application.properties` 以从属性文件中获取消息。背景颜色改变的部分为修改部分。\n\
  \n[application.properties]\n```properties\n# Data\nspring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-\
  \ 1;DB_CLOSE_ON_EXIT=FALSE\nspring.datasource.driver-class-name=org.h2.Driver\n\
  spring.datasource.username=sa\nspring.datasource.password=\nspring.datasource.sql-script-encoding=UTF-8\n\
  spring.datasource.initialize=true\nspring.datasource.schema=classpath:schema.sql\n\
  spring.datasource.data=classpath:data.sql\n# H2\nspring.h2.console.enabled=true\n\
  # messages\nspring.messages.basename=i18n/messages,i18n/ValidationMessages\n```\n\
  \n**注意：ValidationMessages**\n在 `spring.messages.basename` 中，你可以指定逗号分隔的多个消息文件。由应用程序将所有消息聚合到一个文件中或拆分。拆分文件时，注意不要重复键名。\n\
  \n接下来，编辑绑定失败时的错误消息。\n\n[ValidationMessages.properties]\n```properties\n# ========================\n\
  # 绑定错误消息\n# ========================\n# Pattern1\ntypeMismatch.signupForm.age=Please\
  \ enter a number\ntypeMismatch.signupForm.birthday=Please enter in dd/MM/yyyy format\n\
  # Pattern2\ntypeMismatch.age=Please enter a number\ntypeMismatch.birthday=Please\
  \ enter in dd/MM/yyyy format\n# Pattern3\ntypeMismatch.int=Please enter a number\n\
  typeMismatch.java.lang.Integer=Please enter a number\ntypeMismatch.java.util.Date=Please\
  \ enter in dd/MM/yyyy format\n```\n\n\n\n\n在示例代码中，它是通过模式 1 设置的。其他模式均被注释掉了。在模式 1\
  \ 中，为每个 `Model` 键和字段名设置了错误消息。模式 2 为每个字段名设置了错误消息。`typeMismatch.age` 为所有 `age` 字段设置了相同的错误消息。模式\
  \ 3 为每种数据类型设置了错误消息。`typeMismatch.int` 将所有 `int` 字段设置了相同的错误消息。对于 `Integer` 类型，你还必须包含\
  \ `typeMismatch.java.lang.Integer` 和包名。顺便提一下，如果你没有设置错误消息的绑定，将显示默认的错误消息。如果你有德语语言文件，可以实现多语言支持。\n\
  \n### `ValidationMessages_de.properties`\n```properties\n# ========================\n\
  # 绑定错误消息\n# ========================\n# Pattern1\ntypeMismatch.signupForm.age=Bitte\
  \ gebe eine Nummer ein\ntypeMismatch.signupForm.birthday=Bitte geben Sie im Format\
  \ TT/MM/JJJJ ein\n# Pattern2\n#typeMismatch.age=Bitte gebe eine Nummer ein(Pattern2)\n\
  #typeMismatch.birthday=Bitte geben Sie im Format TT/MM/JJJJ ein(Pattern2)\n# Pattern3\n\
  #typeMismatch.int=Bitte gebe eine Nummer ein(Pattern3)\n#typeMismatch.java.lang.Integer=Bitte\
  \ gebe eine Nummer ein(Pattern3)\n#typeMismatch.java.util.Date=Bitte geben Sie im\
  \ Format TT/MM/JJJJ ein(Pattern3)\n```\n\n修改控制器，当屏幕输入内容发生错误时，它将返回用户注册页面。背景颜色改变的部分是修改部分。\n\
  \n### `SignupController.java`\n```java\npackage com.example.controller;\nimport\
  \ java.util.Locale;\nimport java.util.Map;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.validation.BindingResult;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  import org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestMapping;\nimport com.example.application.service.UserApplicationService;\n\
  import com.example.form.SignupForm;\nimport lombok.extern.slf4j.Slf4j;\n\n@Controller\n\
  @RequestMapping(\"/user\")\n@Slf4j\npublic class SignupController {\n    @Autowired\n\
  \    private UserApplicationService userApplicationService;\n\n    /** 显示用户注册页面\
  \ */\n    @GetMapping(\"/signup\")\n    public String getSignup(Model model , Locale\
  \ locale, @ModelAttribute SignupForm form ) {…（已省略）}\n\n    /** 用户注册流程 */\n    @PostMapping(\"\
  /signup\")\n    public String postSignup(Model model , Locale locale, @ModelAttribute\
  \ SignupForm form ,BindingResult bindingResult ) {\n        // 输入检查结果\n        if\
  \ (bindingResult .hasErrors()) {\n            // NG: 返回用户注册页面\n            return\
  \ getSignup(model , locale , form );\n        }\n        log .info(form .toString());\n\
  \        // 重定向到登录页面\n        return \"redirect:/login\" ;\n    }\n}\n```\n\n####\
  \ 关键点：`BindingResult`\n你可以通过 `BindingResult` 方法检查是否发生了绑定错误或验证错误。如果 `hasErrors()`\
  \ 方法的结果为 true，则表示发生了绑定错误或验证错误。\n\n最后，修改用户注册页面以显示错误消息。背景颜色改变的部分是修改部分。\n\n### `signup.html`\n\
  ```html\n<!DOCTYPE html>\n<html xmlns:th =\"http://www.thymeleaf.org\" ><head>…（已省略）</head>\n\
  <body class =\"bg-light\" ><form id =\"signup-form\" method =\"post\" action =\"\
  /user/signup\"class =\"form-signup\"  th:object =\"${signupForm}\" >\n    <h1 class\
  \ =\"text-center\" th:text =\"#{user.signup.title}\" ></</h1>\n    <!-- 用户 ID -->\n\
  \    <div class =\"form-group\" ><label for =\"userId\" th:text =\"#{userId}\" ></label>\n\
  \    <input type =\"text\" class =\"form-control\" th:field =\"*{userId}\"th:errorclass\
  \ =\"is-invalid\" />\n    <div class =\"invalid-feedback\" th:errors =\"*{userId}\"\
  \ ></div>\n    </div>\n    <!-- 密码 -->\n    <div class =\"form-group\" ><label for\
  \ =\"password\" th:text =\"#{password}\" ></label>\n    <input type =\"text\" class\
  \ =\"form-control\" th:field =\"*{password}\"th:errorclass =\"is-invalid\" />\n\
  \    <div class =\"invalid-feedback\" th:errors =\"*{password}\" ></div>\n    </div>\n\
  \    <!-- 用户名 -->\n    <div class =\"form-group\" ><label for =\"userName\" th:text\
  \ =\"#{userName}\" ></label>\n    <input type =\"text\" class =\"form-control\"\
  \ th:field =\"*{userName}\"th:errorclass =\"is-invalid\" />\n    <div class =\"\
  invalid-feedback\" th:errors =\"*{userName}\" ></div>\n    </div>\n    <!-- 生日 -->\n\
  \    <div class =\"form-group\" ><label for =\"birthday\" th:text =\"#{birthday}\"\
  \ ></label>\n    <input type =\"text\" class =\"form-control\" placeholder =\"dd/MM/yyyy\"\
  th:field =\"*{birthday}\"  th:errorclass =\"is-invalid\" />\n    <div class =\"\
  invalid-feedback\" th:errors =\"*{birthday}\" ></div>\n    </div>\n    <!-- 年龄 -->\n\
  \    <div class =\"form-group\" ><label for =\"age\" th:text =\"#{age}\" ></label>\n\
  \    <input type =\"text\" class =\"form-control\" th:field =\"*{age}\"th:errorclass\
  \ =\"is-invalid\" />\n    <div class =\"invalid-feedback\" th:errors =\"*{age}\"\
  \ ></div>\n    </div>\n    <!-- 性别 -->\n    <div class =\"form-group\" ><div th:each\
  \ =\"item : ${genderMap}\" class =\"form-check-inline\" >\n    <input type =\"radio\"\
  \ class =\"form-check-input\" th:value=\"${item.value}\"th:field =\"gender}\"th:errorclass\
  \ =\"is-invalid\" />\n    <label class =\"form-check-label\" th:text=\"${item.key}\"\
  \ ></label>\n    </div>\n    <div class =\"text-danger\" th:if =\"#fields.hasErrors('gender')}\"\
  th:errors =\"*{gender}\" ></div>\n    </div>\n    <!-- 提交按钮 -->\n    <input type\
  \ =\"submit\" th:value=\"#{user.btn}\"class =\"btn-primary w-100 mt-3\" />\n</form>\n\
  </body>\n</html>\n```\n\n#### 关键点：`th:errorclass`\n当 `th:errorclass` 与 `th:field`\
  \ 在同一个标签中使用时，它是有效的。如果 `th:field` 指定的字段发生错误，它将添加 Bootstrap 提供的 `is-invalid` CSS 类。\n\
  ```html\n<input type =\"text\" class =\"form-control\" th:field =\"*{userId}\"th:errorclass\
  \ =\"is-invalid\" />\n```\n\n#### 关键点：`th:errors`\n`th:errors` 指定了字段名。如果指定的字段发生了错误，它将在该标签中显示错误消息。\n\
  ```html\n<div class =\"form-group\" ><label for =\"userId\" th:text =\"#{userId}\"\
  \ ></label>\n<input type =\"text\" class =\"form-control\" th:field =\"*{userId}\"\
  th:errorclass =\"is-invalid\" />\n<div class =\"invalid-feedback\" th:errors =\"\
  *{userId}\" ></div>\n</div>\n```\n\n#### 关键点：`th:if`\n你可以使用 `th:if` 属性来根据条件决定是否生成标签。如果条件条件则生成标签。通过在\
  \ `th:if` 的条件中编写 `${#fields.hasErrors('字段名')}`，你可以检查某个字段是否发生了错误。\n```html\n<div\
  \ class =\"text-danger\" th:if =\"#fields.hasErrors('gender')}\"th:errors =\"*{gender}\"\
  \ ></div>\n```\n\n## 6.3 验证\n从现在开始，我们将创建验证（输入检查）。\n\n*   [实现验证]\n*   [编辑错误消息]\n\
  *   [设置验证执行顺序]\n\n### 6.3.1 实现验证\n### 概述\n验证是一种输入检查。Spring 通过简单的注解即可实现验证。\n[用户注册页面]（实现验证后）（image_rsrcDVD.jpg）\n\
  \n#### 目录\n目录结构没有变化。\n\n# 源代码\n使用验证需要库。因此，在 `pom.xml` 的 `dependencies` 标签中添加以下代码。\n\
  ```xml\n<dependencies>\n```\n\n\n\n\n\n```xml\n<!-- validator -->\n<dependency>\n\
  \    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-validation</artifactId>\n\
  </dependency>\n<!-- ... -->\n```\n\n修改接收来自屏幕输入的表单类。背景颜色改变的部分为修改部分。\n\n`SignupForm.java`\n\
  ```java\npackage com.example.form;\nimport java.util.Date;\nimport javax.validation.constraints.Email;\n\
  import javax.validation.constraints.Max;\nimport javax.validation.constraints.Min;\n\
  import javax.validation.constraints.NotBlank;\nimport javax.validation.constraints.NotNull;\n\
  import javax.validation.constraints.Pattern;\nimport org.hibernate.validator.constraints.Length;\n\
  import org.springframework.format.annotation.DateTimeFormat;\nimport lombok.Data;\n\
  \n@Data\npublic class SignupForm {\n    @NotBlank\n    @Email\n    private String\
  \ userId ;\n\n    @NotBlank\n    @Length (min = 4, max = 100)\n    @Pattern (regexp\
  \ = \"^[a-zA-Z0-9]+$\" )\n    private String password ;\n\n    @NotBlank\n    private\
  \ String userName ;\n\n    @DateTimeFormat (pattern = \"dd/MM/yyyy\" )\n    @NotNull\n\
  \    private Date birthday ;\n\n    @Min (20)\n    @Max (100)\n    private Integer\
  \ age ;\n\n    @NotNull\n    private Integer gender ;\n}\n```\n\n### 重点：校验注解\n提供了以下注解来实现逻辑校验：\n\
  \n[注解列表]\n\n| 类 | 注解 | 描述 | 示例 |\n| --- | --- | --- | --- |\n| Bean Validation |\
  \ `@NotNull` | 检查是否为空。 | `@NotNull String userName;` |\n| | `@NotEmpty` | 检查字符串或集合是否为空。\
  \ | `@NotEmpty LIst<User> userList;` |\n| | `@NotBlank` | 检查字符串是否仅为 null、空字符串或空格。\
  \ | `@NotBlank String password;` |\n| | `@Max` | 检查值是否小于等于指定值。 | `@Max(100) int\
  \ age;` |\n| | `@Min` | 检查值是否大于等于指定值。 | `@Min(20) int age;` |\n| | `@Size` | 检查字符串的长度和集合的大小是否在指定范围内。\
  \ | `@Size(min = 0, max = 20) List<User> userList;` |\n| | `@AssertTrue` | 检查是否为真。\
  \ | `@AssertTrue boolean marriage;` |\n| | `@AssertFalse` | 检查是否为假。 | `@AssertFalse\
  \ boolean marriage;` |\n| | `@Pattern` | 检查是否与指定的正则表达式匹配。 | `@Pattern() String password;`\
  \ |\n| | `@Email` | 检查字符串是否符合电子邮件地址格式。 | `@Email String userId;` |\n| Hibernate\
  \ Validator | `@Range` | 检查数值是否在指定范围内。 | `@Range(min = 20, max = 100) int age;`\
  \ |\n| | `@Length` | 检查字符串的长度是否在指定范围内。 | `@Length(min = 8, max = 100) String password;`\
  \ |\n| | `@CreditCardNumber` | 检查字符串是否符合信用卡号格式。 | `@CreditCardNumber String cardNumber;`\
  \ |\n| | `@URL` | 检查字符串是否符合 URL 格式。 | `@URL String url;` |\n\n还有其他可用的校验注解。详情请参阅\
  \ [Hibernate Validator 官方页面](https://docs.jboss.org/hibernate/stable/validator/reference/en-US/html_single/#_validator_methods)。\n\
  \n顺便一下，`@NotNull`、`@NotEmpty` 和 `@NotBlank` 具有以下区别：\n\n[NotNull、NotEmpty 和 NotBlank\
  \ 之间的区别]\n\n| 注解 | null | 空字符 | 空格 |\n| --- | --- | --- | --- |\n| `@NotNull` |\
  \ NG | OK | OK |\n| `@NotEmpty` | NG | NG | OK |\n| `@NotBlank` | NG | NG | NG |\n\
  \nNG：校验结果将显示为错误。\n\n最后，修改用户注册控制器以执行校验。背景颜色改变的部分为修改部分。\n\n`SignupController.java`\n\
  ```java\npackage com.example.controller;\nimport java.util.Locale;\nimport java.util.Map;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.ui.Model;\nimport org.springframework.validation.BindingResult;\n\
  import org.springframework.validation.annotation.Validated;\nimport org.springframework.web.bind.annotation.GetMapping;\n\
  import org.springframework.web.bind.annotation.ModelAttribute;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  import org.springframework.web.bind.annotation.RequestMapping;\nimport com.example.application.service.UserApplicationService;\n\
  import com.example.form.SignupForm;\nimport lombok.extern.slf4j.Slf4j;\n\n@Controller\n\
  @RequestMapping (\"/user\" )\n@Slf4j\npublic class SignupController {\n    @Autowired\n\
  \    private UserApplicationService userApplicationService ;\n\n    /** 显示用户注册屏幕\
  \ */\n    @GetMapping (\"/signup\" )\n    @GetMapping (\"/signup\" )\n    public\
  \ String getSignup(Model model , Locale locale ,@ModelAttribute SignupForm form\
  \ ) {…(已省略)}\n\n    /** 用户注册流程 */\n    @PostMapping (\"/signup\" )\n    public String\
  \ postSignup(Model model , Locale locale ,@Validated SignupForm form ,BindingResult\
  \ bindingResult ) {\n        // 输入检查\n        if (bindingResult.hasErrors()) {\n\
  \            // NG：返回注册屏幕\n            return getSignup(model , locale , form );\n\
  \        }\n        log .info(form .toString());\n        // 跳转到登录屏幕\n        return\
  \ \"redirect:/login\" ;\n    }\n}\n```\n\n### 重点：@Validated\n在类上使用 `@Validated`\
  \ 后将执行校验。\n\n### 执行\n运行 Spring Boot 并访问以下 URL。\n[URL] `http://localhost:8080/user/signup`\n\
  在不输入任何内容的情况下点击 \"signup\"。\n[执行结果]\n\n### 注意：校验结果\n校验结果放在 `BindingResult` 中。错误处理方式与绑定错误相同。\n\
  \n### 6.3.2 编辑错误消息\n有多种方法可以编辑错误消息。其中最简单的方法是配置 `[注解名称 = 消息]`。\n\n字符 `{0}` 和 `{1}`\
  \ 示例代码中。这是消息中的参数。你可以使用参数显示变量。例如，`{0}` 是字段名。\n\n示例：`@NotNull` 错误\n\n| 设置值 | 显示结果\
  \ |\n| --- | --- |\n| `NotNull={0} is required` | Gender is required |\n\n注解中设置的值将显示在\
  \ `{0}` 之后。`{0}` 之后的数字显示注解中设置的值。\n示例：`@Length(min = 4, max = 100)`\n\n*   `{1}`\
  \ = max(100)\n*   `{2}` = min(4)\n\n#### 目录\n目录没有变化。\n\n# 源代码\n向属性文件添加校验消息。背景颜色改变的部分为修改部分。\n\
  \n`ValidationMessages.properties`\n```properties\n# ========================\n#\
  \ 绑定消息\n# ========================\n# Pattern1\ntypeMismatch.signupForm.age=Please\
  \ enter a number\ntypeMismatch.signupForm.birthday=Please enter in dd/MM/yyyy\n\
  # Pattern2\ntypeMismatch.signupForm.age=Please enter a number\ntypeMismatch.signupForm.birthday=Please\
  \ enter in dd/MM/yyyy\n# Pattern3\ntypeMismatch.int=Please enter a number\ntypeMismatch.java.lang.Integer=Please\
  \ enter a number\ntypeMismatch.java.util.Date=Please enter in dd/MM/yyyy\n# ========================\n\
  # 校验消息\n# ========================\nNotBlank={0} is required\nEmail=Please enter\
  \ {0} in email address format\nLength=Enter {0} with {2} digits or more and {1}\
  \ digits or less\nNotNull={0} is required\nMin=Enter {1} or more for {0}\nMax=For\
  \ {0} , enter {1} or less\n```\n\n\n\n\n\n哪些数字包含哪些属性值是按属性名称升序排列的。由于 `max` 的顺序早于\
  \ `min`，因此按上述方式设置。为了支持多语言，还编辑了德语的属性文件。背景颜色发生区域是修改部分。\n\n`[ValidationMessages_de.properties]`\n\
  ```properties\n# ========================\n# 绑定错误消息\n# ========================\n\
  # Pattern1\ntypeMismatch.signupForm.age=请输入一个数字\ntypeMismatch.signupForm.birthday=请以\
  \ TT/MM/JJJJ 格式输入\n# Pattern2\n#typeMismatch.age=请输入一个数字(Pattern2)\n#typeMismatch.birthday=请以\
  \ TT/MM/JJJJ 格式输入(Pattern2)\n# Pattern3\n#typeMismatch.int=请输入一个数字(Pattern3)\ntypeMismatch.java.lang.Integer=请输入一个数字(Pattern3)\n\
  typeMismatch.java.util.Date=请以 TT/MM/JJJJ 格式输入(Pattern3)\n# ========================\n\
  # 验证错误消息\n# ========================\nNotBlank={0} 是必填的 is required\nEmail=请以电子邮件格式输入\
  \ {0}\nLength=输入的 {0} 至少包含 {2} 位数字，最多包含 {1} 位\nPattern=请用字母数字单字节字符输入 {0}\nNotNull={0}\
  \ 是必填的 is required\nMin=为 {0} 输入 {1} 或更多\nMax=为 {0} 输入 {1} 或更少\n```\n\n我已经解释过错误消息中的\
  \ `{0}` 包含字段名。然而，如果没有设置任何内容，表单类的字段名将按原样显示。例如：字段名中未设置。\n\n| 设置值 | 显示结果 |\n| --- |\
  \ --- |\n| `NotNull={0} is required` | gender is required |\n\n接下来，编辑 `messages.properties`\
  \ 来更改字段名的显示。编辑方法是设置 `\"字段名 = 字符\"`。只有性别字段名没有设置。其他字段名已经设置好了。背景颜色发生区域是修改部分。\n\n`[messages.properties]`\n\
  ```properties\nuser.signup.title=用户注册\nuser.signup.btn=注册\nuserId=用户 ID\npassword=密码\n\
  userName=用户名\nbirthday=出生日期\nage=年龄\nmale=男性\nfemale=女性\ngender=性别\n```\n\n由于是多语言支持，也修改了德语的消息文件。背景颜色发生区域是修改部分。\n\
  \n`[messages_de.properties]`\n```properties\nuser.signup.title=注册\nuser.signup.btn=注册\n\
  userId=Benutzer-ID\npassword=Passwort\nuserName=Benutzername\nbirthday=Geburtstag\n\
  age=Alter\nmale=Männlich\nfemale=Weiblich\ngender= 性 lecht\n```\n\n运行 Spring Boot\
  \ 并访问以下 URL。\n`[URL]`\n`http://localhost:8080/user/signup`\n\n在屏幕上输入值以触发验证错误并点击注册按钮。\n\
  `[Execution result]`\n![6-3-2-display-image](img/image_rsrcDVE.jpg)\n\n如果错误消息发生变化，则完成。\n\
  \n注意：如何编辑验证错误消息\n还有编辑验证错误消息的方法。\n\n`[如何配置验证错误消息]`\n\n| 模式 | 设置方法 | 设置示例 |\n| ---\
  \ | --- | --- |\n| 1 | 注解名.ModelAttribute 键名.字段名=错误消息 | `NotBlank.signupForm.userId=Please\
  \ enter user ID` |\n| 2 | 注解名.字段名=错误消息 | `NotBlank.userId=Please enter user ID`\
  \ |\n| 3 | 注解名.字段数据类型=错误消息 | `NotBlank.java.lang.String=Required input` |\n| 4 |\
  \ 唯一键名=错误消息 | `require_check=Required input` |\n\n模式 1 到 3 可以通过仅编辑属性文件来设置。模式 4 必须映射注解和消息的键名。设置如下所示。\n\
  示例：模式 4 的设置\n`[ValidationMessages.properties]`\n```properties\nrequire_check=Required\
  \ input\n```\n\n`[SignupForm.java]`\n```java\npublic class SignupForm {\n    @NotBlank\
  \ (message = \"{require_check}\" )\n    @Email\n    private String userId ;…\n}\n\
  ```\n\n### 6.3.3 设置验证运行顺序#### 概述\n如果验证结果为 NG（错误），将根据 NG 的数量显示错误消息。是否允许取决于设计。如果你想设置验证执行顺序，请设置验证组。\n\
  \n`[验证组设置]`\n![6-3-3-validation-group](img/image_rsrcDVF.jpg)\n\n如果验证组 1 为 OK，则继续组\
  \ 2。如果每个组的检查结果均为 NG，则屏幕返回用户注册界面。\n在用户注册界面上，修改验证按以下顺序发生：\n\n1. 必填输入检查\n2. 输入内容检查\n\
  \n![](img/image_rsrcDVG.jpg)\n\n#### 目录\n目录结构如下。背景颜色发生区域是新添加的部分。\n![](img/image_rsrcDUD.jpg)\n\
  ```text\nSpringBootSample\n┗ src/main\n  ┣ java\n  ┃┗ com.example\n  ┃   ┣ application.service\n\
  \  ┃   ┣ controller\n  ┃   ┣ form\n  ┃   ┃┣ GroupOrder.java\n  ┃   ┃┣ SignupForm.java\n\
  \  ┃   ┃┣ ValidGroup1.java\n  ┃   ┃┗ ValidGroup2.java\n  ┃   ┗ SpringBootApplication.java\n\
  \  ┗ resources\n```\n\n# 源代码\n`ValidGroup1` 和 `ValidGroup2` 是空接口。\n`[ValidGroup1.java]`\n\
  ```java\npackage com.example.form;\npublic interface ValidGroup1 {}\n```\n`[ValidGroup2.java]`\n\
  ```java\npackage com.example.form;\npublic interface ValidGroup2 {}\n```\n在 `GroupOrder`\
  \ 中设置顺序。\n`[GroupOrder.java]`\n```java\npackage com.example.form;\nimport javax.validation.GroupSequence;\n\
  @GroupSequence ({ ValidGroup1.class , Group2.class })\npublic interface GroupOrder\
  \ {}\n```\n`@GroupSequence` 注解设置了顺序。验证从左到右执行。在示例代码中，按以下顺序检查：\n\n1. `ValidGroup1`\n\
  2. `ValidGroup2`\n\n要映射验证顺序，在注解的 `groups` 属性中指定接口。\n最后，修改 Controller。背景颜色发生区域是修改部分。\n\
  `[SignupController.java]`\n```java\n@Controller\n@RequestMapping (\"/user\" )\n\
  @Slf4j\npublic class SignupController {\n    @Autowired\n    private UserApplicationService\
  \ userApplicationService ;\n\n    /** 显示用户注册界面 */\n    @GetMapping (\"/signup\"\
  \ )\n    public String getSignup(Model model , Locale locale ,@ModelAttribute SignupForm\
  \ form ) {…(Omitted)}\n\n    /** 用户注册流程 */\n    @PostMapping (\"/signup\" )\n  \
  \  public String postSignup(Model model , Locale locale ,@ModelAttribute @Validated\
  \ (GroupOrder.class ) SignupForm form ,BindingResult bindingResult ) {\n       \
  \ // 输入检查结果\n        if (bindingResult .hasErrors()) {\n            // NG：返回用户注册界面\n\
  \            return getSignup(model , locale , form );\n        }\n        log .info(form\
  \ .toString());\n        // 跳转到登录界面\n        return \"redirect:/login\" ;\n    }\n\
  }\n```\n在 `@Validated` 注解中指定 `GroupOrder.class` 以反映验证顺序设置。\n运行 Spring Boot 并访问以下\
  \ URL。\n`[URL]`\n`http://localhost:8080/user/signup`\n首先在屏幕上不输入任何值直接点击“注册”。然后在屏幕上输入值并点击“注册”。![](img/image_rsrcDVG.jpg)\n\
  如果验证顺序设置正确，则完成。\n\n\n\n\n\n### 总结\n以下是本章学习的内容。\n\n## 创建屏幕\n* 轻松使用带有 `webjars` 的库\n\
  * 你可以使用 `messages.properties` 管理消息。\n* 你可以使用 `messages.properties` 支持多语言。\n\n##\
  \ 绑定\n* 待绑定的 Java 类已注册在 `Model` 中。\n* 在屏幕上，使用 `th:field` 映射 Java 类中的字段。\n\n## 验证\n\
  * 可以使用注解来实现验证。\n* 使用 `BindingResult` 判断是否发生了验证错误。\n* `@GroupSequence` 注解允许你设置验证的顺序。\n\
  \n## 其他\n* 使用 `BindingResult` 判断在绑定或验证过程中是否发生了错误。\n* 可以通过 `th:errors` 获取错误消息。\n\
  * 可以 `th:errorclass` 在发生错误时添加 CSS 类。\n* 错误消息可以在属性文件中进行编辑。\n\n# 7. 屏幕布局\n在本章中，你将学习如何创建屏幕布局。\n\
  \n## 7.1 屏幕布局实现概述\n在创建屏幕时，使用布局函数是常见的做法。布局消除了每次在每个屏幕上编写通用 HTML 的需要。通过准备不同的布局文件，你可以更轻松地更改布局。\n\
  \n书中的示例创建了以下布局屏幕：\n[布局配置]\n![8-1-layout-image](img/image_rsrcDVH.jpg)\n\n具体来说，创建了以下用户列表屏幕。\n\
  [用户列表屏幕]\n![8-1-display-image](img/image_rsrcDVJ.jpg)\n\n登录后，创建一个跳转到用户列表屏幕的应用程序。为了创建此屏幕，你将创建以下\
  \ 4 个 HTML 文件：\n* 布局 (Layout)\n* 头部 (Header)\n* 菜单 (Menu)\n* 内容 (Content)\n\n####\
  \ 目录\n目录结构如下。背景颜色变化的部分是新增的部分。\n![](img/image_rsrcDUD.jpg)\n```text\nSpringBootSample\n\
  ┗ src/main\n    ┣ java\n    ┃┗ com.example\n        ┣ application.service\n    \
  \    ┣ controller\n        ┃┣ LoginController.java\n        ┃┣ LogoutController.java\
  \ (创建新类)\n        ┃┣ SignupController.java\n        ┃┗ UserListController.java (创建新类)\n\
  \        ┣ form\n        ┣ hello\n        ┗ SpringBootSampleApplication.java\n \
  \   ┣ resources\n    ┣ i18n\n    ┣ static\n    ┃┗ css\n        ┃┣ layout (创建新文件夹)\n\
  \        ┃┗ layout.css (创建新文件)\n        ┃┣ login\n        ┃┗ user\n        ┃┣ list.css\
  \ (创建新文件)\n        ┃┗ signup.css\n    ┗ templates\n        ┣ layout (创建新文件夹)\n \
  \       ┃┣ header.html (创建新文件)\n        ┃┣ layout.html (创建新文件)\n        ┃┗ menu.html\
  \ (创建新文件)\n        ┣ login\n        ┗ user\n            ┣ list.html (创建新文件)\n  \
  \          ┗ signup.html\n    ┣ application.properties\n    ┣ data.sql\n    ┗ schema.sql\n\
  ```\n\n首先，为 Thymeleaf 添加一个用于创建布局的库。在 `pom.xml` 的 `dependencies` 标签中添加以下代码。\n```xml\n\
  <!-- thymeleaf-layout -->\n<dependency>\n    <groupId>org.thymeleaf</groupId>\n\
  \    <artifactId>thymeleaf-layoutdialect</artifactId>\n</dependency>\n```\n\n为用户列表创建一个控制器。\n\
  ```java\npackage com.example.controller;\n\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  \n@Controller\n@RequestMapping(\"/user\")\npublic class UserListController {\n \
  \   /** 显示用户列表 */\n    @GetMapping(\"/list\")\n    public String getUserList() {\n\
  \        return \"user/list\";\n    }\n}\n```\n\n修改登录屏幕的控制器，以便跳转到用户列表屏幕。\n```java\n\
  package com.example.controller;\n\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.PostMapping;\n\
  \n@Controller\npublic class LoginController {\n    /** 显示登录屏幕 */\n    @GetMapping(\"\
  /login\")\n    public String getLogin() {\n        return \"login/login\";\n   \
  \ }\n    /** 重定向到用户列表屏幕 */\n    @PostMapping(\"/login\")\n    public String postLogin()\
  \ {\n        return \"redirect:/user/list\";\n    }\n}\n```\n\n为注创建一个控制器。\n```java\n\
  package com.example.controller;\n\nimport org.slf4j.Slf4j;\nimport org.springframework.stereotype.Controller;\n\
  import org.springframework.web.bind.annotation.PostMapping;\n\n@Controller\n@Slf4j\n\
  public class LogoutController {\n    /** 重定向到登录屏幕 */\n    @PostMapping(\"/logout\"\
  )\n    public String postLogout() {\n        log.info(\"Logout\");\n        return\
  \ \"redirect:/login\";\n    }\n}\n```\n\n为屏幕布局创建 HTML。\n```html\n<!DOCTYPE html>\n\
  <html xmlns:th=\"http://www.thymeleaf.org\" xmlns:layout=\"http://www.ultraq.net.nz/thymeleaf/layout\"\
  >\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1, shrink-to-fit=no\">\n    <!-- 读取通用 CSS -->\n\
  \    <link rel=\"stylesheet\" th:href=\"@{/webjars/bootstrap/css/bootstrap.min.css}\"\
  >\n    <link rel=\"stylesheet\" th:href=\"@{/css/layout/layout.css}\">\n    <!--\
  \ 读取通用 JS -->\n    <script th:src=\"@{/webjars/jquery/jquery.min.js}\" defer></script>\n\
  \    <script th:src=\"@{/webjars/bootstrap/js/bootstrap.min.js}\" defer></script>\n\
  \    <title></title>\n</head>\n<body>\n    <!-- 头部 -->\n    <nav layout:replace=\"\
  ~{layout/header::header}\"></nav>\n    <!-- 菜单 -->\n    <div class=\"container-fluid\"\
  >\n        <div class=\"row\">\n            <nav class=\"col-sm-2 bg-light sidebar\
  \ pt-2\">\n                <div layout:replace=\"~{layout/menu::menu}\"></div>\n\
  \            </nav>\n        </div>\n    </div>\n    <!-- 内容 -->\n    <div class=\"\
  container-fluid\">\n        <div class=\"row\">\n            <div class=\"col-sm-10\
  \ offset-sm-2 main\">\n                <div layout:fragment=\"content\"></div>\n\
  \            </div>\n        </div>\n    </div>\n</body>\n</html>\n```\n\n点 1：`xmlns:layout`\
  \ 用于在 Thymeleaf 中使用布局，在 `html` 标签中添加 `xmlns:layout=\"http://www.ultraq.net.nz/thymeleaf/layout\"\
  `。\n点 2：`layout:replace` 用于读取其他 HTML 文件，使用 `layout:replace` 属性。按以下格式指定值：`~{file-path::key-name}`。\n\
  \n\n\n\n\n对于文件路径，请指定相对于 `src/main/resources/templates` 的相对路径。键名（key name）可以指定任意值。通过示例代码说明，后续部分读取了另一个\
  \ HTML 文件。\n\n```html\n[layout.html]\n<!-- header -->\n<nav layout:replace =\"~{layout/header::header}\"\
  \ ></nav>\n```\n\n在这种情况下，`src/main/resources/templates/layout/header.html` 文件是目标。然后，读取该文件中键名为\
  \ `header` 的部分。\n\n### 重点 3：`layout:fragment`\n要读取其他 HTML 文件，请使用 `layout:fragment`\
  \ 属性。该属性的值可以是任何键名。`layout:replace` 和 `layout:fragment` 都会读取其他 HTML 文件。`layout:replace`\
  \ 和 `layout:fragment` 之间的区别稍后会解释。\n\n```html\n[header.html]\n<!DOCTYPE html>\n<html\
  \ xmlns:th =\"http://www.thymeleaf.org\"xmlns:layout =\"http://www.ultraq.net.nz/thymeleaf/layout\"\
  layout:decorate =\"~{layout/layout}\" ><head></head>\n<body>\n<nav layout:fragment\
  \ =\"header\"class =\"navbar navbar-inverse navbar-fixed-top navbar-dark bg-dark\"\
  \ >\n  <div class =\"container-fluid\" >\n    <div class =\"navbar-header\" >\n\
  \      <a class =\"navbar-brand\" href =\"#\" > SpringSample</a>\n    </</div>\n\
  \    <form method =\"post\" th:action =\"@{/logout}\" >\n      <button class =\"\
  btn btn-link pull-right navbar-brand\" type =\"submit\" >Logout</button>\n    </form>\n\
  \  </div>\n</nav>\n</body>\n</html>\n```\n\n### 重点 1：`layout:decorate`\n指定将此 HTML\
  \ 包含哪个布局中。按照以下格式输入：\n\n[layout:decorate 的格式]\n`~{file path}`\n\n对于文件路径，请指定相对于 `src/main/resources/templates`\
  \ 的相对路径。在示例代码中，指定了 `src/main/resources/templates/layout/layout.html`。\n\n### 重点\
  \ 2：`layout:fragment`\n指定布局 HTML 引用的键名。如本书中的示例代码所示，必须满足以下点：\n\n```html\n[layout.html]\n\
  <nav layout:replace =\"~{layout/header:: header }\" ></nav>\n```\n\n```html\n[header.html]\n\
  <nav layout:fragment =\" header \"class =\"navbar navbar-inverse navbar-fixed-top\
  \ navbar-dark bg-dark\" >\n  header HTML 现在已嵌入到布局 HTML 中。\n</\n```\n\n同样地，为菜单创建\
  \ HTML。\n\n```html\n[menu.html]\n<!DOCTYPE html>\n<html xmlns:th =\"http://www.thymeleaf.org\"\
  xmlns:layout =\"http://www.ultraq.net.nz/thymeleaf/layout\"layout:decorate =\"~{layout/layout}\"\
  \ ><head></head>\n<body>\n  <div layout:fragment =\"menu\" class =\"bg-light\" >\n\
  \    <ul class =\"nav nav-pills nav-stacked flex-column\" >\n      <li role =\"\
  presentation\" >\n        <a class =\"nav-link\" th:href =\"@{'/user/list'}\" >\
  \ 用户列表</a>\n      </li>\n    </ul>\n  </div>\n</body>\n</html>\n```\n\n同样地，为用户列表界面创建\
  \ HTML。\n\n```html\n[list.html]\n<!DOCTYPE html>\n<html xmlns:th =\"http://www.thymeleaf.org\"\
  xmlns:layout =\"http://www.ultraq.net.nz/thymeleaf/layout\"layout:decorate =\"~{layout/layout}\"\
  \ ><head>\n  <title> 用户列表</title>\n  <!-- 读取专用的 CSS -->\n  <link rel =\"stylesheet\"\
  \ th:href =\"@{/css/user.css}\" >\n</head>\n<body>\n  <div layout:fragment =\"content\"\
  \ >\n    <div class =\"header border-bottom\" >\n      <h1 class =\"h2\" > 用户列表</h1>\n\
  \    </div>\n  </div>\n</body>\n</html>\n```\n\n现在创建一个一个 CSS。\n\n```css\n[layout.css]\n\
  .sidebar {\n  position : fixed ;\n  display : block ;\n  top : 58px ;\n  bottom\
  \ : 0 ;\n}\n.main {\n  position : fixed ;\n  display : block ;\n  top : 58px ;\n\
  \  bottom : 0 ;\n  padding-left : 20px ;\n  overflow-y : auto ;\n  height : calc(100vh\
  \ - 58px) ;\n}\n[list.css]\n.header {\n  padding-top : 1rem!important ;\n  padding-bottom\
  \ : .5rem!important ;\n  margin-bottom : 1rem!important ;\n}\n.th {\n  width : 200px\
  \ ;\n}\n```\n\n### 执行\n运行 SpringBoot 并访问登录界面。请在不在屏幕输入任何内容的情况下点击“Login”按钮。屏幕将切换到用户列表界面。\n\
  \n### 注意：layout:replace 和 layout:fragment 的区别\n在生成的 HTML 中，`layout:replace` 和 `layout:fragment`\
  \ 之间存在细微差异。差异如下：\n\n* `layout:replace` 替换整个标签。\n* `layout:fragment` 在标签内部添加 HTML。\n\
  \n具体如下：\n\n#### layout:replace 示例\n```html\n[布局侧 HTML]\n<div layout:replace =\"\
  ~{sample/contents}\"></div>\n```\n```html\n[内容侧 HTML]\n<div layout:fragment =\"\
  contents\" /><p> 示例</p></div>\n```\n```html\n[layout:replace 生成的 HTML]\n<div><p>\
  \ 示例</p></div>\n```\n也就是说，内容侧 HTML 替换了布局侧 HTML。布局侧 HTML 不保留。\n\n#### layout:fragment\
  \ 示例\n```html\n[布局侧 HTML]\n<div layout:fragment =\"~{contents}\" id =\"sample\"\
  ></div>\n```\n```html\n[内容侧 HTML]\n<div layout:fragment =\"contents /><p> 示例</p></div>\n\
  ```\n```html\n[layout:fragment 生成的 HTML]\n<div id =\"sample\"><p> 示例</p></div>\n\
  </div>\n```\n这意味着内容侧 HTML 添加到了布局侧 HTML 元素。\n\n### 注意：如何实现布局\n即使不为布局添加库，也可以仅使用 Thymeleaf\
  \ 功能创建布局。实现方法是使用 `th:replace` 和 `th:fragment` 属性。这两个属性的用法与 `layout:replace` 和 `layout:fragment`\
  \ 相同。但根据是否为布局使用库，生成的 `head` 标签会有不同。\n\n使用 `th:replace` 和 `th:fragment` 时：\n\n```html\n\
  [布局侧 HTML]\n<head>\n  <link rel =\"stylesheet\" th:href =\"@{/css/common.css}\"\
  \ >\n  <script th:src =\"@{/js/common.js}\" defer></script>\n</head>\n```\n```html\n\
  [内容侧 HTML]\n<head>\n  <title> 示例内容</title>\n  <link rel =\"stylesheet\" th:href\
  \ =\"@{/css/sample.css}\" >\n  <script th:src =\"@{/js/sample.js}\" defer></script>\n\
  </head>\n```\n```html\n[生成的 HTML]\n<head>\n  <link rel =\"stylesheet\" th:href =\"\
  @{/css/common.css}\" >\n  <script th:src =\"@{/js/common.js}\" defer></script>\n\
  </head>\n```\n也就是说，在 `th:replace` 属性中，仅保留布局侧的 `head` 标签。\n\n使用 `layout:replace`\
  \ 和 `layout:fragment` 时：\n\n```html\n[布局侧 HTML]\n<head>\n  <link rel =\"stylesheet\"\
  \ th:href =\"@{/css/common.css}\" >\n  <script th:src =\"@{/js/common.js}\" defer></script>\n\
  </head>\n```\n```html\n[内容侧 HTML]\n<head>\n  <title> 示例内容</title>\n  <link rel =\"\
  stylesheet\" th:href =\"@{/css/sample.css}\" >\n  <script th:src =\"@{/js/sample.js}\"\
  \ defer></script>\n</head>\n```\n```html\n[生成的 HTML]\n<head>\n  <title> 示例内容</title>\n\
  \  <link rel =\"stylesheet\" th:href =\"@{/css/common.css}\" >\n  <script th:src\
  \ =\"@{/js/common.js}\" defer></script>\n  <link rel =\"stylesheet\" th:href =\"\
  @{/css/sample.css}\" >\n  <script th:src =\"@{/js/sample.js}\" defer></script>\n\
  </head>\n```\n`layout:replace` 属性将内容侧 `head` 标签内的元素添加到布局侧 `head` 标签内部。因此，使用布局库可以更容易创建布局。\n\
  \n### 总结\n以下是你在本章中学习的内容：\n\n[如何创建布局]\n* 为布局使用库。\n* 在 html 标签中添加 `xmlns:layout=\"\
  http://www.ultraq.net.nz/thymeleaf/layout\"`。\n\n[布局侧 HTML]\n布局侧 HTML 使用属性：\n* `layout:replace`\n\
  * `layout:fragment`\n\n[内容侧 HTML]\n内容侧 HTML 使用属性：\n* `layout:fragment`\n\n## 8.\
  \ MyBatis\n在本章中，你将学习用于数据库的 MyBatis。\n\n* MyBatis 概述\n* MyBatis 基础\n* MyBatis 高级\n\
  * 事务\n\n### 8.1 MyBatis 概述\nMyBatis 是带有高级功能的 O/R 映射。O/R 映射是一个映射 Java 类（对象）和数据库的框架。因为它将对象（Objects）映射到关系（Relations），因此被称为\
  \ O/R 映射。\n\n特别是，MyBatis 可以在 xml 文件中映射对象和 SQL。\n\n### 注意：SQL\n在 MyBatis 中，你可以编写\
  \ xml 文件以外的 SQL，但很少使用。这是因为很难判断 SQL 是写在 xml 文件中还是其他地方。\n\n### 8.2 MyBatis 基础\n首先，你将学习\
  \ MyBatis 的基本用法。\n\n* 插入\n* 查询…多条记录\n* 查询…单条记录\n* 更新·删除\n\n\n\n\n\n### 8.2.1 insert\
  \ 概述\n\n你实际上可以在用户注册界面上注册用户。数据将注册在 `H2` 数据库中。\n\n[执行结果]\n![](img/image_rsrcDVM.jpg)\n\
  \n此外，后续学习使用的初始数据也被注册了。\n\n#### 目录\n\n目录结构如下。背景颜色发生的部分是新添加的部分。\n\n![](img/image_rsrcDUD.jpg)\n\
  \n```\nSpringBootSample\n┗ src/main\n   ┣ java\n   ┃┗ com.example\n   ┃   ┣ application.service\n\
  \   ┃   ┣ config (创建新包)\n   ┃   ┃ ┗ JavaConfig.java (创建新类)\n   ┃   ┣ controller\n\
  \   ┃   ┣ domain.user (创建新包)\n   ┃   ┃ ┣ model (创建新包)\n   ┃   ┃  ┗ MUser.java (创建新类)\n\
  \   ┃   ┃ ┗ service (创建新包)\n   ┃   ┃     ┣ impl (创建新包)\n   ┃   ┃     ┃ ┗ UserServiceImpl.java\
  \ (创建新类)\n   ┃   ┃     ┗ UserService.java (创建新接口)\n   ┃   ┣ form\n   ┃   ┣ hello\n\
  \   ┃   ┣ repository (创建新包)\n   ┃   ┃ ┗ UserMapper.java (创建新接口)\n   ┃   ┗ SpringBootSampleApplication.java\n\
  \   ┣ resources\n   ┃ ┣ i18n\n   ┃ ┣ mapper (创建新文件夹)\n   ┃ ┃ ┗ h2 (创建新文件夹)\n   ┃\
  \ ┃   ┗ UserMapper.xml (创建新文件)\n   ┃ ┣ static\n   ┃ ┣ templates\n   ┃ ┣ application.properties\n\
  \   ┃ ┣ data.sql\n   ┃ ┗ schema.sql\n   ┗ pom.xml\n```\n\n# 源代码\n\n首先，为了下载 MyBatis\
  \ 库，请将以下代码添加到 `pom.xml` 中。除了 MyBatis 之外，你还添加了一个名为 `ModelMapper` 的有用库。`ModelMapper`\
  \ 是一个用于拷贝实例内容的库。背景颜色发生的部分是添加的部分。\n\n[pom.xml]\n```xml\n<dependencies>\n    <!--\
  \ MyBatis -- -->\n    <dependency>\n        <groupId>org.mybatis.spring.boot</groupId>\n\
  \        <artifactId>mybatis-spring-boot-starter</artifactId>\n        <version>2.1.4</version>\n\
  \    </dependency>\n    <!-- Model Mapper -- -->\n    <dependency>\n        <groupId>org.modelmapper.extensions</groupId>\n\
  \        <artifactId>modelmapper-spring</artifactId>\n        <version>2.3.9</version>\n\
  \    </dependency>\n</dependencies>\n```\n\n更改 `application.properties` 中的设置。背景颜色发生的部分是修改的部分。\n\
  \n[application.properties]\n```properties\n# DataSource\nspring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE\n\
  spring.datasource.driver-class-name=org.h2.Driver\nspring.datasouce.username=sa\n\
  spring.datasouce.password=\nspring.datasource.sql-script-encoding=UTF-8\nspring.datasource.initialize=true\n\
  spring.datasource.schema=classpath:schema.sql\nspring.datasource.data=classpath:data.sql\n\
  \n# H2DB\nspring.h2.console.enabled=true\n\n# message\nspring.messages.basename=i18n/messages,i18n/ValidationMessages\n\
  \n# MyBatis\nmybatis.mapper-locations=classpath*:/mapper/h2/*.xml\n\n# Log Level\n\
  logging.level.com.example=debug\n```\n\n#### 关键点：mybatis.mapper-locations\n\n在 MyBatis\
  \ 中，在 xml 文件中编写 SQL。使用 `mybatis.mapper-locations` 属性指定 xml 文件的位置。此设置允许你在针对不同数据库产品的\
  \ SQL 文件之间切换。例如，为 Oracle 和 SQL Server 分别 SQL 文件。稍后，可以使用此属性更改想要读取的 xml 文件路径。\n\n\
  在示例代码中，`src/main/resources/mapper/h2` 下的所有 xml 都是目标。\n\n#### 注意事项：设置日志级别\n\n如果你想在\
  \ Spring Boot 中更改日志级别，请按如下设置属性：\n\n[如何更改日志级别]\n```properties\nlogging.level.包名=日志级别\n\
  ```\n示例代码将 `com.example` 包的日志级别更改为 `debug`。通过将日志级别设置为 `debug`，MyBatis 执行的 SQL 将输出到日志中。\n\
  \n\n\n\n\n# 修改 SQL 添加表。背景颜色改变的部分为修改部分。\n\n`schema.sql`\n```sql\nCREATE TABLE IF\
  \ NOT EXISTS employee (id VARCHAR (50) PRIMARY KEY ,name VARCHAR (50),age INT);/*\
  \ User master */\nCREATE TABLE IF NOT EXISTS m_user (user_id VARCHAR (50) PRIMARY\
  \ KEY, password VARCHAR (100), user_name VARCHAR (50), birthday DATE, age INT, gender\
  \ INT, department_id INT, role VARCHAR (50));/* Department master */\nCREATE TABLE\
  \ IF NOT EXISTS m_department (department_id INT PRIMARY KEY, department_name VARCHAR\
  \ (50));/* Salary table */\nCREATE TABLE IF NOT EXISTS t_salary (user_id VARCHAR\
  \ (50), year_month VARCHAR (50), salary INT, PRIMARY KEY (user_id, year_month));\n\
  ```\n\n# 修改数据输入 SQL 添加初始数据。背景颜色改变的部分为修改部分。\n\n`data.sql`\n```sql\nINSERT INTO employee\
  \ (id, name, age)VALUES ('1' , 'Tom' , 30);/* User master */\nINSERT INTO m_user\
  \ (user_id, password, user_name, birthday, age, gender, department_id, role) VALUES('system@co.jp'\
  \ , 'password' , 'System Administrator' , '2000-01-01' , 21, 1, 1, 'ROLE_ADMIN'\
  \ ), ('user@co.jp' , 'password' , 'User1' , '2000-01-01' , 21, 2, 2, 'ROLE_GENERAL'\
  \ );/* Department master */\nINSERT INTO m_department (department_id, department_name)\
  \ VALUES(1, 'System Management' ), (2, 'Sales' );/* Salary table */\nINSERT INTO\
  \ t_salary (user_id, year_month, salary) VALUES('user@co.jp' , '11/2020' , 2800),\
  \ ('user@co.jp' , '12/2020' , 2900), ('user@co.jp' , '01/2021' , 3000);\n```\n\n\
  # 为用户主表创建一个实体类。\n\n`MUser.java`\n```java\npackage com.example.domain.user.model;\n\
  import java.util.Date;\nimport lombok.Data;\n@Data\npublic class MUser {\nprivate\
  \ String userId ;\nprivate String password ;\nprivate String userName ;\nprivate\
  \ Date birthday ;\nprivate Integer age ;\nprivate Integer gender ;\nprivate Integer\
  \ departmentId ;\nprivate String role ;\n}\n```\n\n# 为用户主表创建一个 repository。\n\n`UserMapper.java`\n\
  ```java\npackage com.example.repository;\nimport org.apache.ibatis.annotations.Mapper;\n\
  import com.example.domain.user.model.MUser;\n@Mapper\npublic interface UserMapper\
  \ {\n/** User signup */\npublic int  insertOne(MUser user );\n}\n```\n要点：使用 `@Mapper`\
  \ 在 MyBatis 中创建 repository，在 Java 接口上使用 `@Mapper` 注解。接下来，在 xml 文件中编写 SQL。\n\n`UserMapper.xml`\n\
  ```xml\n<?xml version =\"1.0\" encoding =\"UTF-8\" ?\n<!DOCTYPE mapper PUBLIC \"\
  -//mybatis.org//DTD Mapper 3.0//EN\"\"http://mybatis.org/dtd/mybatis-3-mapper.dtd\"\
  >\n<!-- Mapper and xml mapping -->\n<mapper namespace =\"com.example.repository.UserMapper\"\
  \ >\n<!-- user registration -->\n<insert id =\"insertOne\" >\ninsert into m_user(user_id,\
  \ password, user_name, birthday, age, gender, department_id, role)\nvalues (#{userId},\
  \ #{password}, #{userName}, #{birthday}, #{age}, #{gender}, #{departmentId}, #{role})</insert>\n\
  </mapper>\n```\n\n## 点 1：Mapper-xml 映射\n你必须首先将 `Mapper`（Java 接口）映射到 xml 文件。在 `mapper`\
  \ 标签中映射 Mapper 和 xml。在 `mapper` 标签的 `namespace` 属性中指定 Mapper 接口名。\n\n`UserMapper.xml`\n\
  ```xml\n<mapper namespace = \"com.example.repository.UserMapper\" >\n```\n在 `namespace`\
  \ 属性中指定一个名称，包括包名。\n\n## 点 2：SQL-方法映射\n接下来，映射 SQL 和 Mapper 方法。这在 `id` 属性（例如 `insert`\
  \ 标签）中指定 Mapper 方法名。通过示例代码解释，下方背景颜色改变的部分必须与之匹配。\n\n`UserMapper.java`\n```java\n\
  /** User signup */\npublic int insertOne (MUser user );\n```\n\n`UserMapper.xml`\n\
  ```xml\n<!-- user registration -->\n<insert id =\"insertOne\" >\n```\n\n## 点 3：将方法参数映射到\
  \ SQL 参数\n然后，将 Mapper 方法的参数放入 SQL 参数中。它可以以 `#{method-argument-name}` 的形式指定。在示例代码中，方法参数是\
  \ `MUser` 类。在 SQL 中指定 `MUser` 类中的字段名。\n\n`MUser.java`\n```java\npublic class MUser\
  \ {\nprivate String userId ;\nprivate String password ;\nprivate String userName\
  \ ;\nprivate Date birthday ;\nprivate Integer age ;\nprivate Integer gender ;\n\
  private Integer departmentId ;\nprivate String role ;\n}\n```\n\n`UserMapper.xml`\n\
  ```xml\n<!-- user registration -->\n<insert id =\"insertOne\" >\ninsert into m_user(user_id,\
  \ password, user_name, birthday, age, gender, department_id, role)\nvalues (#{userId},\
  \ #{password}, #{userName}, #{birthday}, #{age}, #{gender}, #{departmentId}, #{role})</insert>\n\
  ```\n\n接下来，为用户服务创建一个接口。\n\n`UserService.java`\n```java\npackage com.example.domain.user.service;\n\
  import com.example.domain.user.model.MUser;\npublic interface UserService {\n/**\
  \ User signup */\npublic void signup(MUser user );\n}\n```\n为用户服务创建一个实现类。从该类调用 Mapper\
  \ 方法。\n\n`UserServiceImpl.java`\n```java\npackage com.example.domain.user.service.impl;\n\
  import org.springframework.beans.factory.annotation.Autowired;\nimport org.springframework.stereotype.Service;\n\
  import com.example.domain.user.model.MUser;\nimport com.example.user.service.UserService;\n\
  import com.example.repository.UserMapper;\n@Service\npublic class UserServiceImpl\
  \ implements UserService {\n@Autowired\nprivate UserMapper mapper ;\n/** User signup\
  \ */\n@Override\npublic void signup(MUser user ) {\nuser .setDepartmentId(1);\n\
  user .setRole(\"ROLE_GENERAL\" );\nmapper .insertOne(user );\n}\n```\n接下来，将 `ModelMapper`\
  \ 注册为 bean。\n\n`JavaConfig.java`\n```java\npackage com.example.config;\nimport org.modelmapper.ModelMapper;\n\
  import org.springframework.context.annotation.Bean;\nimport org.springframework.context.annotation.Configuration;\n\
  @Configuration\npublic class JavaConfig {\n@Bean\npublic ModelMapper modelMapper()\
  \ {\nreturn new ModelMapper();\n}\n```\n\n最后，修改 Signup Controller。背景颜色改变的部分为修改部分。\n\
  \n`SignupController.java`\n```java\npackage com.example.controller;\nimport java.util.Locale;\n\
  import java.util.Map;\nimport org.modelmapper.ModelMapper;\nimport org.springframework.beans.factory.annotation.Autowired;\n\
  import org.springframework.stereotype.Controller;\nimport org.springframework.ui.Model;\n\
  import org.springframework.validation.BindingResult;\nimport org.springframework.validation.annotation.Validated;\n\
  import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.ModelAttribute;\n\
  import org.springframework.web.bind.annotation.PostMapping;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
  import com.example.application.service.UserApplicationService;\nimport com.example.domain.user.model.MUser;\n\
  import com.example.domain.user.service.UserService;\nimport com.example.form.GroupOrder;\n\
  import com.example.form.SignupForm;\nimport lombok.extern.slf4j.Slf4j;\n@Controller\n\
  @RequestMapping (\"/user\" )\n@Slf4j\npublic class SignupController {\n@Autowired\n\
  private UserApplicationService userApplicationService ;\n@Autowired\nprivate UserService\
  \ userService ;\n@Autowired\nprivate ModelMapper modelMapper ;\n/** 显示用户注册页面 */\n\
  @GetMapping (\"/signup\" )\npublic String getSignup(Model model , Locale locale\
  \ ,@ModelAttribute SignupForm form ) {…(省略)}\n/** 用户注册处理 */\n@PostMapping (\"/signup\"\
  \ )\npublic String postSignup(Model model , Locale locale ,@ModelAttribute @Validated\
  \ (GroupOrder.class ) SignupForm form ,BindingResult bindingResult ) {\n// 输入检查结果\n\
  if (bindingResult .hasErrors()) {\n// 错误：返回用户注册页面\nreturn getSignup(model , locale\
  \ , form );\n}\nlog .info(form .toString());\n// 将表单转换为 MUser 类\nMUser user = modelMapper\
  \ .map(form , MUser.class );\n// 用户注册\nuserService .signup(user );\n// 重定向到登录页面\n\
  return \"redirect:/login\" ;\n}\n```\n\n## 要点：ModelMapper\n`ModelMapper` 的 `map`\
  \ 方法可以轻松复制字段内容。复制字段时，源和目标字段名必须匹配。\n\n## 注意：不要将表单类传递给服务\n`SignupForm` 和 `MUser` 类具有相同的字段。复制表单值有两个原因：\n\
  \n*   页面的更改不需要修改服务。\n*   服务可以被其他页面重用。\n\n\n\n\n\n让我们比较将 `SignupForm` 作为服务的参数的情况，以及不将其作为参数的情况。\n\
  \n![当将 `SignupForm` 类作为参数时](img/image_rsrcDVN.jpg)\n![当将 `MUser` 类作为参数时](img/image_rsrcDVP.jpg)\n\
  \n在创建服务时，请记住这种设计。\n\n### 执行\n运行 Spring Boot 并访问以下 URL。 \n[URL] `http://localhost:8080/user/signup`\n\
  \n让我们注册一个用户。\n用户注册界面\n\n如果没有发生错误，用户应该会被注册成功。此外，还会输出以下日志。\n\n[日志] (部分节录)\n```\n==>\
  \  Preparing: insert into m_user( user_id , password , user_name , birthday , age\
  \ , gender , department_id , role ) values ( ? , ? , ? , ? , ? , ? , ? , ? )\n==>\
  \ Parameters: tom@xxx.co.jp(String), password(String), tom(String), 1986-11-05 00:00:00.0(Timestamp),\
  \ 34(Integer), 1(Integer), 1(Integer), ROLE_GENERAL(String)\n<==     Updates: 1\n\
  ```\n这些是 MyBatis 日志，输出内容如下：\n* 执行 SQL\n* 传递给 SQL 的参数值\n* 更新数量\n\n你也可以通过 H2 控制台检查是否已注册到数据库。\n\
  [H2 控制台 URL] `http://localhost:8080/h2-console`\n\n检查 `M_USER` 表的内容。\nH2 控制台界面\n\
  用户已注册。\n\n### 8.2.2 select…多条记录\n概述\n在用户列表界面上显示用户主表的所有数据。\n执行结果\n\n#### 目录\n目录结构没有变化。\n\
  \n# 源代码\n首先，设置属性。背景颜色改变的部分为修改部分。\n\n[application.properties]\n```properties\n# DataSource\n\
  spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE\n\
  spring.datasource.driver-class-name=org.h2.Driver\nspring.datasouce.username=sa\n\
  spring.datasouce.password=\nspring.datasource.sql-script-encoding=UTF-8\nspring.datasource.initialize=\
  \ trues\nspring.datasource.schema=classpath:schema.sql\nspring.datasource.data=classpath:data.sql\n\
  # H2DB\nspring.h2.console.enabled=true\n# message\nspring.messages.basename=i18n/messages,i18n/ValidationMessages\n\
