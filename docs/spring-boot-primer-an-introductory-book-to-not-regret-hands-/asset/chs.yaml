  \ ModelMapper modelMapper ;\n    @Autowired\n    private MessageSource messageSource\
  \ ;\n\n    /** 用户注册 */\n    @PostMapping (\"/signup/rest\" )\n    public RestResult\
  \ postSignup(@Validated (GroupOrder.class ) SignupForm form ,BindingResult bindingResult\
  \ , Locale locale ) {\n        // 输入检查结果\n        if (bindingResult .hasErrors())\
  \ {\n            // 结果检查: NG\n            Map<String, String> errors = new HashMap<>();\n\
  \            // 获取错误消息\n            for (FieldError error : bindingResult .getFieldErrors())\
  \ {\n                String message = messageSource .getMessage(error , locale);\n\
  \                errors .put(error .getField(), message );\n            }\n    \
  \        // 返回错误结果\n            return new RestResult(90, errors);\n        }\n\
  \        // 将表单转换为 M 类\n        MUser user = modelMapper .map(form , MUser.class\
  \ );\n        // 用户注册\n        userService .signup(user );\n        // 返回结果\n  \
  \      return new RestResult(0, null );\n    }\n\n    /** 更新用户 */\n    @PutMapping\
  \ (\"/update\" )\n    public int updateUser(UserDetailForm form ) {…（省略）}\n\n  \
  \  /** 删除用户 */\n    @DeleteMapping (\"/delete\" )\n    public int deleteUser(UserDetailForm\
  \ form ) {…（省略）}\n}\n```\n\n### 关键点 1: FieldError\n验证结果为 `NG` 的字段名可以从 `FieldError`\
  \ 类中获取。然而，只有从 `FieldError` 中可以获取在单项检查中捕获的字段。本书的示例中未制作，但你可以创建自己的自定义验证。通过自定义验证，你可以执行同时比较两个字段的关联性检查。在这种情况下，`ObjectError`\
  \ 类包含了验证结果。你也可以通过将 `FieldError` 和 `Locale` 传递给 `MessageSource` 来获取错误消息。\n\n### 关键点\
  \ 2: 返回值\n在 REST 控制器中，将方法的返回值设置为 Java 类。然后，该 Java 类将自动自动转换为 JSON。JSON 被设置在 HTTP\
  \ 响应中。返回码设置如下。\n\n| 结果 | 返回码 |\n| --- | --- |\n| 成功完成 | 0 |\n| 验证结果 NG | 90 |\n\n\
