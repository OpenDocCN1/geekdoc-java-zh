  ```\n\n### 点：JPA 设置\n如果你在 Java 类上添加 `@Entity` 注解，JPA 有一个自动生成表的功能。你可以通过 `spring.jpa.hibernate.ddl-auto`\
  \ 属性来设置是否使用该功能。示例代码不会使用该功能。其他属性是用于将 JPA 执行的 SQL 和参数输出到日志的设置。\n\n接下来，准备 JPA repository。\n\
  \n`[UserRepository.java]`\n```java\npackage com.example.repository;\nimport org.springframework.data.jpa.repository.JpaRepository;\n\
  import com.example.domain.user.model.MUser;\n\npublic interface UserRepository extends\
  \ JpaRepository<MUser, String> {}\n```\n\n### 要点：JpaRepository\n当使用 JPA 创建 repository\
  \ 时，它会继承 `JpaRepository`。为 `JpaRepository` 的泛型指定以下类型。\n\n`[Jpa Repository Generics]`\n\
  `JpaRepository<数据模型类型, 主键类型>`\n\n此外，在继承 `JpaRepository` 时，可以省略 `@Repository` 注解。\n\
  \n然后修改用户主表中的实体类。背景颜色发生的部分是修改部分。\n\n`[MUser.java]`\n```java\npackage com.example.domain.user.model;\n\
  import java.util.Date;\nimport java.util.List;\nimport javax.persistence.Entity;\n\
  import javax.persistence.Id;\nimport javax.persistence.Table;\nimport javax.persistence.Transient;\n\
  import lombok.Data;\n\n@Data\n@Entity\n@Table(name=\"m_user\")\npublic class MUser\
  \ {\n    @Id\n    private String userId;\n    private String password;\n    private\
  \ String userName;\n    private Date birthday;\n    private Integer age;\n    private\
  \ Integer gender;\n    private Integer departmentId;\n    private String role;\n\
  \    @Transient\n    private Department department;\n    @Transient\n    private\
  \ List<Salary> salaryList;\n}\n```\n\n#### 要点 1：@Entity\n在映射到数据库表的类上添加 `@Entity`\
  \ 注解。如果你添加了此注解，它将生成与类名相同的表名。\n\n#### 要点 2：@Table\nJPA 尝试将数据映射到与类名相同的表上。如果类名和表名不同，请添加\
  \ `@Table` 注解。在该注解的 `name` 属性中设置你想要映射的表名。\n\n#### 要点 3：@Id\n在主键字段上添加 `@Id` 注解。通过这种方式，JPA\
  \ 将识别该字段为为主键。\n\n#### 注意：@Transient\n使用 `@Transient` 注解，该字段不会进行 O/R 映射。临时在部门主表和工资表中的字段上标记\
  \ `@Transient`。\n\n接下来，使用 JPA 创建一个新的 service。\n\n`[UserServiceImpl2.java]`\n```java\n\
