  \ user.password(encoder.encode(\"user\")).roles(\"GENERAL\").and().withUser(\"admin\"\
  ) // add admin.password(encoder.encode(\"admin\")).roles(\"ADMIN}*/\n        //\
  \ 用户数据认证\n        auth.userDetailsService(userDetailsService).passwordEncoder(encoder);\n\
