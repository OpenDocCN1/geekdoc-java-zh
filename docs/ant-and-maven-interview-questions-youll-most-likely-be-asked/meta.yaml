    # 200: What are the different types of profile? Where is each defined?


    Answer:


    a) Global - Defined in the global Maven-settings

    (%M2_HOME%/conf/settings.xml).


    b) Profile descriptor - a descriptor located in project basedir

    (profiles.xml)


    c) Per Project - Defined in the POM itself (pom.xml).


    d) Per User - Defined in the Maven-settings

    (%USER_HOME%/.m2/settings.xml).


    # 201: How can a profile be triggered?


    Answer:


    A profile can be triggered in several ways:


    +   a) OS settings

    b) Present or missing files

    c) Explicitly

    d) Through Maven settings

    e) Based on environment variables


    # 202: How to deactivate a profile?


    Answer:


    Use the following:

    mvn groupId:artifactIdId:goal -P !profile-1,!profile-2


