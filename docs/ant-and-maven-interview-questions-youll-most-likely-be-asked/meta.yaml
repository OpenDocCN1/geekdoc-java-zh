  md: '# 1: What are the system requirements for Apache Ant?


    Answer:


    Ant can be used in many platforms, including Linux, Unix, Windows NT, Novell Network
    6, and Mac OS. Windows 9x is no longer supported.


    # 2: How Apache Ant’s build files does work?


    Answer:


    The buildfiles are written in XML. Every buildfile contains one project and at
    least one target. Targets contain task elements. Every task element of the buildfile
    can have an id attribute and can later be referred to by the value supplied to
    this. The value has to be unique.


    # 3: How many attributes are in the project? Describe them.


    Answer:


    There are three attributes in the project namely name, default and basedir. Attribute
    name is defined as the name of the project. Default is the default target to be
    used when no target is supplied and basedir is the base directory from which all
    path calculations are done.


    # 4: Define Ant’s task and how it works.


    Answer:


    A task is a piece of code that can be executed. A task can have multiple attributes.
    The value of an attribute might contain references to a property. These references
    will be resolved before the task is executed.'
