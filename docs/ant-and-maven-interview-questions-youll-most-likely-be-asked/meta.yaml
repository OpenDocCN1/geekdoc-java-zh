    这可能是一个困难的问题，因为通常很难察觉激励的影响。与其提供一个你激励他人的具体例子，不如专注于你在职业生活中运用的通用原则，例如以身作则。如果可能，将其与激励过你的人所拥有的特质联系起来，并讨论你在工作中修改或模仿这种特质。


