    ## 23: What are the most difficult decisions for you to make?


    Answer:


    Explain your relationship to decision-making, and a general synopsis of the process
    you take in making choices. If there is a particular type of decision that you
    often struggle with, such as those that involve other people, make sure to explain
    why that type of decision is tough for you, and how you are currently engaged
    in improving your skills.


    ## 24: When making a tough decision, how do you gather information?


    Answer:


    If you''re making a tough choice, it''s best to gather information from as many
    sources as possible. Lead the interviewer through your process of taking information
    from people in different areas, starting first with advice from experts in your
    field, feedback from coworkers or other clients, and by looking analytically at
    your own past experiences.


    ## 25: Tell me about a decision you made that did not turn out well.


    Answer:


    Honesty and transparency are great values that your interviewer will appreciate
    – outline the choice you made, why you made it, the results of your poor decision
    – and finally (and most importantly!) what you learned from the decision. Give
    the interviewer reason to trust that you wouldn''t make a decision like that again
    in the future.


    ## 26: Are you able to make decisions quickly?


    Answer:


    You may be able to make decisions quickly, but be sure to communicate your skill
    in making sound, thorough decisions as well. Discuss the importance of making
    a decision quickly, and how you do so, as well as the necessity for each decision
    to first be well-informed.


    ## 27: What is customer service?


    Answer:


    Customer service can be many things – and the most important consideration in
    this question is that you have a creative answer. Demonstrate your ability to
    think outside the box by offering a confident answer that goes past a basic definition,
    and that shows you have truly considered your own individual view of what it means
    to take care of your customers. The thoughtful consideration you hold for customers
    will speak for itself.


    ## 28: Tell me about a time when you went out of your way for a customer.


    Answer:


    It''s important that you offer an example of a time you truly went out of your
    way – be careful not to confuse something that felt like a big effort on your
    part, with something your employer would expect you to do anyway. Offer an example
    of the customer''s problems, what you did to solve it, and the way the customer
    responded after you took care of the situation.


    ## 29: How do you gain confidence from customers?


    Answer:


    This is a very open-ended question that allows you to show your customer service
    skills to the interviewer. There are many possible answers, and it is best to
    choose something that you’ve had great experience with, such as “by handling situations
    with transparency,” “offering rewards,” or “focusing on great communication.”
    Offer specific examples of successes you’ve had.


    ## 30: Tell me about a time when a customer was upset or agitated – how did you
    handle the situation?


    Answer:


    Similarly to handling a dispute with another employee, the most important part
    to answering this question is to first set up the scenario, offer a step-by-step
    guide to your particular conflict resolution style, and by describing the way
    the conflict was resolved. Be sure that in answering questions about your own
    conflict resolution style, that you emphasize the importance of open communication
    and understanding from both parties, as well as a willingness to reach a compromise
    or other solution.


    ## 31: When can you make an exception for a customer?


    Exceptions for customers can generally be made in accordance with company policy
    or when directed by a supervisor. Display an understanding of the types of situations
    in which an exception should be considered, such as when a customer has endured
    a particular hardship, had a complication with an order, or at a request.


    ## 32: What would you do in a situation where you were needed by both a customer
    and your boss?


    While both your customer and your boss have different needs of you and are very
    important to your success as a worker, it is always best to try to attend to your
    customer first – however, the key is explaining to your boss why you are needed
    urgently by the customer, and to assure your boss that you will attend to his
    or her needs as soon as possible (unless it''s absolutely an urgent matter).


    ## 33: What is the most important aspect of customer service?


    While many people would simply state that customer satisfaction is the most important
    aspect of customer service, it''s important to be able to elaborate on other important
    techniques in customer service situations. Explain why customer service is such
    a key part of business, and be sure to expand on the aspect that you deem to be
    the most important in a way that is reasoned and well-thought out.


    ## 34: Is it best to create low or high expectations for a customer?


    Answer:


    You may answer this question either way (after, of course, determining that the
    company does not have a clear opinion on the matter). However, no matter which
    way you answer the question, you must display a thorough thought process, and
    very clear reasoning for the option you chose. Offer pros and cons of each, and
    include the ultimate point that tips the scale in favor of your chosen answer.


    ## 35: What is the best way for a company to advertise?


    Answer:


    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as why you''ve chosen it. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.


    ## 36: Is it better to gain a new customer or to keep an old one?


    Answer:


    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as to also gain new
    customers as they are likely to recommend your company to friends.


    ## 37: What is the best way to win clients from competitors?


    Answer:


    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your interviewer adheres to a specific thought or practice,
    it''s best to keep this question general. Rather than using absolute language,
    focus on the benefits of one or two strategies and show a clear understanding
    of how these ways can succeed in a practical application.


    ## 38: How do you feel about companies monitoring internet usage?


    Answer:


    Generally speaking, most companies will monitor some degree of internet usage
    over their employees – and during an interview is not the best time to rebel against
    this practice. Instead, focus on positive aspects such as the way it can lead
    to increased productivity for some employees who may be easily lost in the world
    of resourceful information available to them.


    ## 39: What is your first impression of our company?


    Answer:


    Obviously, this should be a positive answer! Pick out couple components of the
    company''s message or goals that you especially identify with or that pertain
    to your experience, and discuss why you believe these missions are so important.


    ## 40: Tell me about your personal philosophy on business.


    Answer:


    Your personal philosophy on business should be well-thought out, and in line with
    the missions and objectives of the company. Stay focused on positive aspects such
    as the service it can provide, and the lessons people gain in business, and offer
    insight as to where your philosophy has come from.


    ## 41: What''s most important in a business model: sales, customer service, marketing,
    management, etc.?


    Answer:


    For many positions, it may be a good strategy to tailor this answer to the type
    of field you''re working in, and to explain why that aspect of business is key.
    However, by explaining that each aspect is integral to the function as a whole,
    you can display a greater sense of business savvy to the interviewer and may stand
    out in his or her mind as a particularly aware candidate.

