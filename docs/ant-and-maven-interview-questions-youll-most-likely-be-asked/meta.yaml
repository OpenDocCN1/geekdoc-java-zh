    \n# Life Cycle, Phases\n\n# 155: Name the Build Lifecycle phases.\n\nAnswer:\n\
    \nFollowing are the phases of a Build Lifecycle: validate, compile, test, package,\
    \ integration-test, verify, install, deploy.\n\n# 156: How many types of built-in\
    \ build Lifecycle are there in Maven?\n\nAnswer:\n\nThere are three built-in build\
    \ lifecycles: default, clean and site.\n\n# 157: What is contained in build lifecycle?\n\
    \nAnswer:\n\nThe maven build lifecycle consists of \"phases\" and \"goals\".\n\
    \n# Plugins\n\n# 158: What do we mean by Maven Plug-in?\n\nAnswer:\n\nPlugins\
    \ are software modules written to fit into Maven's plug-in framework.\n\n# 159:\
    \ What are the different forms of Plug-ins?\n\nAnswer:\n\nSource files, Generated\
    \ Files, Resources, Binaries and Packaged Libraries.\n\n# 160: What does the \"\
    You cannot have two plugin executions with the same (or missing) elements\" message\
    \ mean?\n\nAnswer:\n\nIf the plugin is executed multiple times with the same <id>\
    \ then this message appears.\n\n# 161: Where is the plugin-registry.xml?\n\nAnswer:\n\
    \nIn order to find that plugin do the following:\nFrom the settings.xml, you may\
    \ enable it by setting <usePluginRegistry/> to true and the file will be in ~/.m2/plugin-registry.xml.\n\
    \n# Repositories\n\n# 162: How many types of repositories are available in Maven?\n\
    \nAnswer:\n\nLocal and Remote repositories are available in Maven.\n\n# 163: How\
    \ are the Local Repository accessed?\n\nAnswer:\n\nThey are accessed on the local\
    \ disk.\n\n# 164: How are the Remote Repository accessed?\n\nAnswer:\n\nThey are\
    \ accessed through the network.\n\n# 165: What is the role of Repositories in\
    \ Maven?\n\nAnswer:\n\nThey store a collection of artifacts used by Maven during\
    \ dependency resolution for a project.\n\n# 166: What is an artifact’s type?\n\
    \nAnswer:\n\nThe artifact’s type can be explained as bundling of the artifact\
    \ as a JAR file.\n\n# 167: What can an Artifact be?\n\nAnswer:\n\nAn artifact\
    \ can be an EAR, WAR or other code-bundling type.\n\n# 168: What is a Maven Coordinate?\n\
    \nAnswer:\n\nMaven coordinate can be explained as a tuple of values that uniquely\
    \ identifies any artifact.\n\n# 169: How many piece of information a coordinate\
    \ contains?\n\nAnswer:\n\nGroup ID, Artifact ID and the Version.\n\n# 170: What\
    \ is a Group ID?\n\nAnswer:\n\nIt can be explained as the entity or organization\
    \ responsible for producing the artifact.\n\n# 171: What is an Artifact ID?\n\n\
    Answer:\n\nIt can be explained as the name of the actual artifact.\n\n# 172: What\
    \ is Version?\n\nAnswer:\n\nIt is in fact the version no of an artifact.\n\n#\
    \ 173: What is the supported format of version?\n\nAnswer:\n\nThe supported format\
    \ is in the form of mmm.nnn.bbb-qqqqqq-dd, where mmm is the major version number,\
    \ nnn is the minor version number, and bbb is the bugfix level. Optionally, either\
    \ qqqqq (qualifier) or dd (build number) can also be added to the version number.\n\
    \n# 174: How many types of Remote repositories are there?\n\nAnswer:\n\n- a) Public\
    \ remote external repository: This public external repository exists at ibiblio.org\
    \ and maven synchronizes with this repository.\n- b) Private remote internal repository:\
    \ We set up this repository and make changes in the maven's pom.xml or settings.xml\
    \ file to use this repository.\n\n# 175: What are the advantages of having an\
    \ internal private repository?\n\nAnswer:\n\n- a) To build first time it requires\
    \ less manual intervention.\n- b) Reduces conflicts among likelihood versions.\n\
    \n# 176: You wish to change your local maven repository. What maven setting change\
    \ is required?\n\nAnswer:\n\nI have to update the local maven repository location\
    \ in settings.xml.\n```xml\n<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd\"\
    >\n  <localRepository>${user.home}/m2/repository</localRepository>\n  <interactiveMode>true</interactiveMode>\n\
    </settings>\n```\n\n# Configurations\n\n# 177: How do I filter classes in the\
    \ MOJO?\n\nAnswer:\n\nDo the following:\n```xml\n<tags>\n  <tag>value1</tag>\n\
    \  <tag>value2</tag>\n</tags>\n```\n\n# 178: Is it possible to use HashMap as\
    \ configurable?\n\nAnswer:\n\n```xml\n<myMap>\n  <key>value</key>\n</myMap>\n\
    ```\n\n# 179: How can I change the location of the generated jar when I use \"\
    mvn package\"?\n\nAnswer:\n\nDo the following:\n```xml\n<plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n\
    \  <artifactId>maven-jar-plugin</artifactId>\n  <configuration>\n    <outputDirectory>${project.build.directory}/</outputDirectory>\n\
    \  </configuration>\n</plugin>\n```\n\n# 180: Is there a way to use current date\
    \ in Maven?\n\nAnswer:\n\nDo the following:\n```xml\n<plugin>\n  <groupId>org.codehaus</groupId>\n\
    \  <artifactId>buildnumber-plugin</artifactId>\n  <configuration>\n    <format>yyyy-MM-dd\
