    Ant and Maven Interview Questions You''ll Most Likely Be Asked 49


    mvn test


    ## 112: How can you compile just test sources?


    Answer:

    Execute the following command:

    mvn test-compile


    ## 113: How can a JAR be created using Maven?


    Answer:

    Execute the following command:

    mvn package


    ## 114: How can you install a JAR in a local repository?


    Answer:

    Execute the following command:

    mvn install


    ## 115: How one can create documentation using Maven?


    One can use the archetype mechanism to generate a site for an existing project
    using the following command:

    mvn archetype:generate \

    -DarchetypeGroupId=org.apache.maven.archetypes \

    -DarchetypeArtifactId=maven-archetype-site \

    -DgroupId=com.mycompany.app \

    -DartifactId=my-app-site


    ## 116: How one can deploy his jar in a remote repository?


    Answer:


    In order to deploy jars to an external repository, one has to configure the repository
    url in the pom.xml and the authentication information for connecting to the repository
    in the settings.xml.


    ## 117: What are the key Maven 2 models?


    Answer:


    The key models are:


    - a) Project object model (POM)

    - b) Dependency management model

    - c) Build life cycle and phases


    ## 118: What are POM files?


    Answer:


    POM contains every piece of information about your project, which can be your
    project description, versioning or distribution information, dependencies and
    much more.


    ## 119: What is Dependency management model?


    Answer:


    The dependency management model is adapted for projects whose software components
    (called modules) might be developed by different project teams. It supports continuous
    independent development and refinement of all dependent modules.


    ## 120: List some of the objectives provided by Maven.


    Answer:


    - a) Provides quality related project information

    - b) Provides guidelines related to development to meet the best goal.

    - c) Allows transparent migration to new features.

    - d) It makes the build process easy

    - e) Provides a uniform building system


    ## 121: Name some of the IDEs that support development with Maven.


    Answer:


    Examples of popular IDEs supporting development with Maven include:


    - a) Eclipse

    - b) NetBeans

    - c) IntelliJ IDEA

    - d) JBuilder

    - e) JDeveloper (version 11.1.2)


    ## 122: What is binding?


    Answer:


    The association between a plug-in''s mojo and a phase of the life cycle is called
    a binding.


    ## 123: What is a Mojo?


    Answer:


    Mojo can be explained as a Maven plain Old Java Object.


    ## 124: How one can use Ant task in Maven 2?


    Answer:


    There are currently 2 alternatives:


    - a) For use in a plugin written in Java, Beanshell or other Java-like scripting
    language, you can construct the Ant tasks using the instructions given in the
    Ant documentation

    - b) If you have very small amounts of Ant script specific to your project, you
    can use the AntRun plugin.


    ## 125: How to produce execution debug output or error messages?


    Answer:


    You could call Maven with -X parameter or -e parameter. For more information,
    run:


    ```

    mvn --help

    ```


    ## 126: How can you invoke the "maven dist" function from Maven 1.0, in Maven
    2.0?


    Answer:


    mvn assembly:assembly


    ## 127: Can a profile inherit the configuration of a "sibling" profile?


    Answer:


    No.


    ## 128: How do I determine which POM contains missing transitive dependency?


    Answer:


    In order to do so do the following:


    ```

    run "mvn -X"

    ```


    ## 129: Is there a property file for plug-in configuration in Maven 2.0?


    Answer:


    No.


    ## 130: What is Maven''s order of inheritance?


    Answer:


    Order of inheritance is:


    - a) parent pom

    - b) project pom

    - c) settings

    - d) CLI parameters


    ## 131: How can you add your generated sources to the compile path of Maven, when
    using modello?


    Answer:


    Modello generates the sources in the generate-sources phase and automatically
    adds the source directory for compilation in Maven. You have to declare the modello-plugin
    in the build of your plugin for source generation.


    ## 132: What does aggregator mean in mojo?


    Answer:


    There are two points that are supported with the aggregator in mojo. They are:


    First of all it means that it can only build the parent project of your multi-module-project,
    the one who has the packaging of pom. It can also give you values for the expression
    ${reactorProjects} where reactorProjects are the MavenProject references to the
    parent pom modules.


    ## 133: What is the reason that there are no dependency properties in Maven 2?


    Answer:

    They were to use them in the past but now they were removed because they aren''t
    reliable in a transitive environment.


    ## 134: How does Maven 2 implement reproducibility?


    Answer:

    There are two different ways to do that:


    - a) Make use of ibiblio for your libraries. This should always be the case for
    jars

    - b) Add the exact versions of plugins into your pluginDependencies


    ## 135: What type of information is included in POM?


    Answer:

    POM contains the following information:


    - a) The configuration for reports (test coverage, static analysis, etc)

    - b) The developers/contributors for the project (name, email, etc.)

    - c) The Infrastructure (Source Control Repository, Continuous Integration Server,
    Issue Tracker) for the project

    - d) The name/description of the project

    - e) The style/packaging of the project

    - f) The version of the project

    - g) The dependencies (libraries or otherwise) of the project

    - h) The configuration for the build (plugins, directories, etc.)

    - i) The maven repositories used for the project


    ## 136: How does POM inheritance work?


    Answer:


    POM file inheritance works similarly to how single-inheritance works in an Object
    Oriented language.


    ## 137: What types of items are found in the dependency?


    Answer:


    Almost each dependency consists of the following: groupId, artifactId, version,
    scope, packaging


    ## 138: What types of scope does dependencies have in Maven?


    Answer:


    compile, runtime, test, provided


    ## 139: For packaging which POM element is used?


    Answer:

    Use <packaging>


    ## 140: What are some of the valid packaging values?


    Answer:

    Some of the valid packaging values are jar, war, ear and pom.


    ## 141: How to verify the installation?


    Answer:

    Use mvn -help command.


    ## 142: How can you skip the tests?


    Answer:


    There are two different ways to do that:

    Add the parameter -Dmaven.test.skip=true or -DskipTests=true in the command line.


    ## 143: How can I run a single unit test?


    Answer:

    Use the parameter -Dtest=MyTest at the command line.


    ## 144: Where are Maven SNAPSHOT artifacts?


    Answer:

    In order to look for them one need to update your settings.xml file using the
    Guide to Plugin Snapshot Repositories


    ## 145: How to produce execution debug output or error messages?


    Answer:

    Call Maven with -X parameter or -e parameter.


    ## 146: What does the "ERROR: Cannot override read-only parameter: < parameter_name
    > " message, when running <plugin_name>:: mean?


    Answer:

    This error comes when the parameter is overridden.


    ## 147: How do I generate Maven plug-in sites, with pages that include an overview
    of the goals and parameters for each plug-in?


    Answer:

    For that Include maven-plugin-plugin as a report.


    ## 148: How do I determine which POM contains missing transitive dependency?


    Answer:

    For that run "mvn -X".


    ## 149: Is there a property file for plug-in configuration in Maven 2.0?


    Answer:

    No.


    # Directory Structure


    ## 150: What are the two main subdirectories of Maven directory structure?


    Answer:

    src and target are two subdirectories of this structure.


    ## 151: For what target directory is used?


    Answer:

    The target directory is used to house all output of the build.


    ## 152: For what src directory is used?


    Answer:

    The src directory contains all of the source material for building the project,
    its site and so on.


    ## 153 What is the default directory layout of Maven?


    Answer:


    - project/

    pom.xml - Defines the project

    src/

    main/

    java/ - Contains all java code that will go in your final artifact. See maven-compiler-plugin
    for details

    scala/ - Contains all scala code that will go in your final artifact. See maven-scala-plugin
    for details

    resources/ - Contains all static files that should be available on the classpath

