    # 42: How do you keep up with news and emerging trends in the field?


    Answer:


    The interviewer wants to see that you are aware of what''s currently going on
    in your field. It is important that your education does not stop after college,
    and the most successful candidates will have a list of resources they regularly
    turn to already in place, so that they may stay aware and engaged in developing
    trends.


    # 43: Would you have a problem adhering to company policies on social media?


    Answer:


    Social media concerns in the workplace have become a greater issue, and many companies
    now outline policies for the use of social media. Interviewers will want to be
    assured that you won''t have a problem adhering to company standards, and that
    you will maintain a consistent, professional image both in the office and online.


    # 44: Tell me about one of the greatest problems facing X industry today.


    Answer:


    If you''re involved in your career field, and spend time on your own studying
    trends and new developments, you should be able to display an awareness of both
    problems and potential solutions coming up in the industry. Research some of the'
  - '[PAGE 111]


    latest news before heading into the interview, and be prepared to discuss current
    events thoroughly.


    # 45: What do you think it takes to be successful in our company?


    **Answer:**


    Research the company prior to the interview. Be aware of the company’s mission
    and main objectives, as well as some of the biggest names in the company, and
    also keep in mind how they achieved success. Keep your answer focused on specific
    objectives you could reach in order to help the company achieve its goals.


    # 46: What is your favorite part of working in this career field?


    **Answer:**


    This question is an opportunity to discuss some of your favorite aspects of the
    job, and to highlight why you are a great candidate for the particular position.
    Choose elements of the work you enjoy that are related to what you would do if
    hired for the position. Remember to remain enthusiastic and excited for the opportunities
    you could attain in the job.


    # 47: What do you see happening to your career in the next 10 years?


    **Answer:**


    If you’re plugged in to what’s happening in your career now, and are making an
    effort to stay abreast of emerging trends in your field, you should be able to
    offer the interviewer several'
  - '[PAGE 112]


    predictions as to where your career or field may be heading. This insight and
    level of awareness shows a level of dedication and interest that is important
    to employers.


    # 48: Where do you find ideas?


    **Answer:**


    Ideas can come from all places, and an interviewer wants to see that your ideas
    are just as varied. Mention multiple places you gain ideas from, or settings in
    which you find yourself brainstorming. Additionally, elaborate on how you record
    ideas or expand upon them later.


    # 49: How do you achieve creativity in the workplace?


    **Answer:**


    It''s important to show the interviewer that you''re capable of being resourceful
    and innovative in the workplace, without stepping outside the lines of company
    values. Explain where ideas normally stem from for you (examples may include an
    exercise such as list-making or a mind map), and connect to a particular task
    in your job that it would be helpful to be creative in.


    # 50: How do you push others to create ideas?


    **Answer:**


    If you''re in a supervisory position, this may be requiring employees to submit
    a particular number of ideas, or to complete regular idea-generating exercises,
    in order to work their creative muscles. However, you can also push others'
  - '[PAGE 113]


    around you to create ideas simply by creating more of your own. Additionally,
    discuss with the interviewer the importance of questioning people as a way to
    inspire ideas and change.


    # 51: Describe your creativity.


    Answer:


    Try to keep this answer within the professional realm, but if you have an impressive
    background in something creative outside of your employment history, don''t be
    afraid to include it in your answer also. The best answers about creativity will
    relate problem-solving skills, goal-setting, and finding innovative ways to tackle
    a project or make a sale in the workplace. However, passions outside of the office
    are great, too (so long as they don''t cut into your work time or mental space).


    # And Finally Good Luck!'
