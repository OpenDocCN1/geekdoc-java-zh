- md: "\n# Job Interview Questions Series\n\n# 2015 Edition\n\n# Ant and Maven\n\n\
    # Interview Questions\n\nYou'll Most Likely Be Asked\n\n![](img/c2188ecc80afda7e3eeb5b60d5c042d0_0_0.png)\n\
    \n200 Ant and Maven Questions 51 HR Interview Questions\n\n> FREE 2 Aptitude Tests,\
    \ download available on website\n\n# Vibrant Publishers\n\n# Ant and Maven\n\n\
    # Interview Questions\n\nYou'll Most Likely Be Asked\n\nJob Interview Questions\
    \ Series\n\nVibrant Publishers\n\nwww.vibrantpublishers.com\n\n# Ant and Maven\
    \ Interview Questions\nYou'll Most Likely Be Asked\n\n© 2014, By Vibrant Publishers,\
    \ USA. All rights reserved. No part of this publication may be reproduced or distributed\
    \ in any form or by any means, or stored in a database or retrieval system, without\
    \ the prior permission of the publisher.\n\nISBN-10: 1466332239\nISBN-13: 978-1466332232-2\n\
    \nLibrary of Congress Control Number: 2011938557\n\nThis publication is designed\
    \ to provide accurate and authoritative information in regard to the subject covered.\
    \ The author has made every effort in the preparation of this book to ensure the\
    \ accuracy of the information. However, information in this book is sold without\
    \ warranty either expressed or implied. The Author or the Publisher will not be\
    \ liable for any damages caused or alleged to be caused directly or indirectly\
    \ by this book.\n\nVibrant Publishers books are available at special quantity\
    \ discount for sales promotions, or for use in corporate training programs. For\
    \ more information please write to bulkorders@vibrantpublishers.com\n\nPlease\
    \ email feedback / corrections (technical, grammatical or spelling) to spellerrors@vibrantpublishers.com\n\
    \nTo access the complete catalogue of Vibrant Publishers, visit www.vibrantpublishers.com\n\
    \n# Table of Contents\n\n+ 1 Ant Questions\n(a) Build file 7\n(b) Ant Scripting\
    \ 13\n(c) Ant Tools 19\n(d) Apache Ant Libraries 23\n(e) Wild Cards 29\n(f) FilterChains\
    \ and FilterReaders 33\n(g) Custom Components and Selectors 41\n2 Maven Questions\n\
    (a) Maven Basics 47\n(b) Directory Structure 59\n(c) Life Cycle, Phases 63\n(d)\
    \ Plugins 65\n(e) Repositories 67\n(f) Configurations 73\n(g) Build Profiles 89\n\
    3 HR Questions 93\nINDEX 113\n\n# Ant Interview Interview Questions\n\nReview\
    \ these typical interview questions and think about how you would answer them.\
    \ Read the answers listed; you will find best possible answers along with strategies\
    \ and suggestions.\n\n# Build File\n\n## 1: What are the system requirements for\
    \ Apache Ant?\n\nAnswer:\n\nAnt can be used in many platforms, including Linux,\
    \ Unix, Windows NT, Novell Network 6, and Mac OS. Windows 9x is no longer supported.\n\
    \n## 2: How does Apache Ant’s build files work?\n\nAnswer:\n\nThe buildfiles are\
    \ written in XML. Every buildfile contains one project and at least one target.\
    \ Targets contain task elements. Every task element of the buildfile can have\
    \ an id attribute and can later be referred to by the value supplied to this.\
    \ The value has to be unique.\n\n## 3: How many attributes are in the project?\
    \ Describe them.\n\nAnswer:\n\nThere are three attributes in the project namely\
    \ name, default and basedir. Attribute name is defined as the name of the project.\
    \ Default is the default target to be used when no target is supplied and basedir\
    \ is the base directory from which all path calculations are done.\n\n## 4: Define\
    \ Ant’s task and how it works.\n\nAnswer:\n\nA task is a piece of code that can\
    \ be executed. A task can have multiple attributes. The value of an attribute\
    \ might contain references to a property. These references will be resolved before\
    \ the task is executed.\n\n## 5: Is property name case sensitive?\n\nAnswer:\n\
    \nYes, property name is case sensitive.\n\n## 6: What does token filter do?\n\n\
    Answer:\n\nA project can have a set of tokens that can be automatically expanded\
    \ if found when a file is copied, when the filtering copy behavior is selected\
    \ in the tasks that support this. These can be set in the buildfile by the filter\
    \ task.\n\n## 7: If a token with the format @token@ is found in a file, no filter\
    \ is associated with that token, then what will happen?\n\nAnswer:\n\nNo changes\
    \ take place. Therefore, no escaping method is available.\n\n## 8: Which separator\
    \ characters are used in the path-like structures in Ant?\n\nAnswer:\n\nWe can\
    \ specify PATH- and CLSPATH-type references using both \":\" and \";\" as separator\
    \ characters.\n\n## 9: What is the purpose of nested argument in Ant build files?\n\
    \nAnswer:\n\nSeveral tasks take arguments that will be passed to another process\
    \ on the command line. To make it easier to specify arguments that contain space\
    \ characters, nested argument elements can be used.\n\n## 10: Explain the following\
    \ ANT command-line argument: <arg value=\"-l -a\"/>.\n\nAnswer:\n\nThis is a single\
    \ command-line argument containing a space character, not separate commands \"\
    -l\" and \"-a\".\n\n## 11: Ant supports a plugin mechanism for using third party\
    \ tasks. To use them, what should we do?\n\nAnswer:\n\nWe shall do 2 steps for\
    \ this.\n\n- a) Place their implementation somewhere where Ant can find them.\n\
    - b) Declare them.\n\n## 12: Write a procedure to start your Ant build from the\
    \ command line.\n\nAnswer:\n\nOpen a command line and switch to your project directory.\
    \ Type in \"ant\" or \"ant -f build.xml\" to start the build process.\n\n## 13:\
    \ How can we run JUnit test through Ant?\n\nAnswer:\n\nAnt defines the \"junit\"\
    \ task. We only need to include junit.jar and the compiled classes into the classpath\
    \ for Ant and then we can run JUnit tests.\n\nFor example:\n\n```xml\n<path id=\"\
    classpath.test\">\n  <pathelement location=\"/lib/junit.jar\" />\n  <pathelement\
    \ location=\"${tst-dir}\" />\n  <path refid=\"classpath.base\" />\n</path>\n<target\
    \ name=\"compile-test\">\n  <javac srcdir=\"${tst-dir}\">\n    <classpath refid=\"\
    classpath.test\"/>\n  </javac>\n</target>\n```\n\n## 14: Does Ant have variables?\n\
    \nAnswer:\n\nAnt does not have variables. Ant uses properties.\n\n# Ant Scripting\n\
    \n## 15: Name the tools for scripting.\n\nAnswer:\n\nJavaScript, Jython, Jacl,\
    \ NetRexx, Java, JRuby, JudoScript.\n\n## 16: What is BSF?\n\nAnswer:\n\nBSF stands\
    \ for Bean Scripting Framework. BSF is a set of Java classes which provides scripting\
    \ language within Java applications, and access to Java objects and methods.\n\
    \n## 17: What steps we shall do to use BeanShell within Ant?\n\nAnswer:\n\nAdd\
    \ BSF (bsf.jar) and BeanShell (bsh.jar) to the classpath.\n\n## 18: Write syntax\
    \ to make the build.xml file.\n\nAnswer:\n\n```xml\n<project name=\"AppBuilder\"\
    \ default=\"war\" basedir=\".\">\n<property file=\"ant.properties\"/>\n</project>\n\
    ```\n\n## 19: How does the eclipse ant editor work?\n\nAnswer:\n\nEclipse has\
    \ an ant editor which makes the editing of ant file easy by providing syntax checking\
    \ of the build. Eclipse has also an ant view. In this view we execute ant files\
    \ via double-clicking on the target.\n\n## 20: Write the syntax according to the\
    \ scenario. We have two compilation targets in the same script, and for the moment\
    \ we prefer not to see warnings generated at compile time.\n\nAnswer:\n\n```xml\n\
    <target name=\"component1\">\n  <javac nowarn=\"false\" srcdir=\"${src}\"/>\n\
    </target>\n\n<target name=\"component2\">\n  <javac nowarn=\"false\" srcdir=\"\
    ${src}\"/>\n</target>\n```\n\n## 21: What does the syntax <javac debug=\"on\"\
    \ srcdir=\"${src}\" /> do?\n\nAnswer:\n\nThe above syntax is useful to see the\
    \ source code line numbers at which problems occurred in a stack trace.\n\n##\
    \ 22: When is the Ant's default target executed?\n\nAnswer:\n\nThe default target\
    \ is the target that is executed when you just type ant at the command line.\n\
    \n## 23: What is the purpose of description attribute in ANT script?\n\n```xml\n\
    <target name=\"deploy\" description=\"compiles and deploys to ABC on PC1\">\n\
    ```\n\nAnswer:\n\nDefining the description for Ant's targets is useful if we can't\
    \ remember the names or purpose. We can type -projecthelp at the command line\
    \ and ant will list the main targets and their descriptions.\n\n## 24: What will\
    \ happen if we don't run Java code in a separate JVM to the ant script?\n\nAnswer:\n\
    \nIf we don't run Java code in a separate JVM to the ant script, we can get some\
    \ strange errors that are difficult to diagnose.\n\n## 25: How can we fix the\
    \ errors occur by not running Java code in a separate JVM to the ant script?\n\
    \nAnswer:\n\nSuch problems can be tracked or fixed by setting fork=true in the\
    \ java target.\n\n## 26: Name the Ant task that allows developers to package a\
    \ desktop application as a WAR to be distributed over the net via Java Web Start.\n\
    \nAnswer:\n\nAnt Web Start Task\n\n## 27: What is Antxtra? Name the categories\
    \ of the components also.\n"
