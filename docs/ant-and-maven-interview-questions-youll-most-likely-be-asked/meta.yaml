  - '[PAGE 70]


    Maven coordinate can be explained as a tuple of values that uniquely identifies
    any artifact.


    # 169: How many piece of information a coordinate contains?


    Answer:

    Group ID, Artifact ID and the Version.


    # 170: What is a Group ID?


    Answer:

    It can be explained as the entity or organization responsible for producing the
    artifact.


    # 171: What is an Artifact ID?


    Answer:

    It can be explained as the name of the actual artifact.


    # 172: What is Version?


    Answer:

    It is in fact the version no of an artifact.


    # 173: What is the supported format of version?


    Answer:

    The supported format is in the form of mmm.nnn.bbb-qqqqqq-dd, where mmm is the
    major version number, nnn is the minor version number, and bbb is the bugfix level.
    Optionally, either qqqqq (qualifier) or dd (build number) can also be added to
    the version number.'
