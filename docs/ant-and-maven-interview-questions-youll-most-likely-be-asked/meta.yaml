    # 7: Tell me about a time when you had to stand up for something you believed
    strongly about coworkers or a supervisor.


    Answer:


    While it may be difficult to explain a situation of conflict to an interviewer,
    this is a great opportunity to display your passions and convictions, and your
    dedication to your beliefs. Explain not just the situation to the interviewer,
    but also elaborate on why it was so important to you to stand up for the issue,
    and how your coworker or supervisor responded to you afterward – were they more
    respectful? Unresponsive? Open-minded? Apologetic?


    # 8: Tell me about a time when you helped someone finish their work, even though
    it wasn’t “your job.”


    Answer:


    Though you may be frustrated when required to pick up someone else’s slack, it’s
    important that you remain positive about lending a hand. The interviewer will
    be looking to see if you’re a team player, and by helping someone else finish
    a task that he or she couldn’t manage alone, you show your willingness to help
    the team succeed, and your own competence.'
