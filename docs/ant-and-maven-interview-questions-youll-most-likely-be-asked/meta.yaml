    \ What is the best practice for these files?\n\nAnswer:\n\nsettings.xml must be\
    \ specific to the user and pom.xml are specific to the project.\n\n# 182: How\
    \ should I point a path for maven to use a certain version of JDK when I have\
    \ different versions of JDK installed on my PC?\n\nAnswer:\n\nIf one wants to\
    \ keep JAVA_HOME, set it in maven script.\n\n# 183: How do I setup the classpath\
    \ of antrun plugin?\n\nAnswer:\n\nWhen running ant script the classpaths are available.\n\
    \n# 184: How do I filter which classes should be put inside the jar?\n\nAnswer:\n\
    \nYou can filter Java classes by using excludes under configuration tag. For example:\n\
    ```xml\n<project>\n  <build>\n    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    \        <artifactId>maven-compiler-plugin</artifactId>\n        <configuration>\n\
    \          <excludes>\n            <exclude>**/Test*.java</exclude>\n        \
    \  </excludes>\n        </configuration>\n      </plugin>\n    </plugins>\n  </build>\n\
    </project>\n```\n\n# 186: How do I create a command line parameter (i.e., - Dname=value\
    \ ) in my mojo:\n\nAnswer:\n\nDo the following:\n```java\n/**\n * @parameter expression=\"\
    ${expression.name}\"\n */\nprivate String exp;\n```\n\n# 187: How can you convert\
    \ <reports> from Maven 1 to Maven 2?\n\nAnswer:\n\nIn order to do this, in m1,\
    \ declare reports in the pom like this:\n```xml\n<project>\n  <reports>\n    <report>maven-checkstyle-plugin</report>\n\
    \    <report>maven-pmd-plugin</report>\n  </reports>\n</project>\n```\n\nNow in\
    \ m2, the <reports> tag is replaced with <reporting>\n```xml\n<project>\n  <reporting>\n\
    \    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
    ```\n"
