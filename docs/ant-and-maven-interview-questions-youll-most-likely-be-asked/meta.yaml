    ## 4: When is it okay to socialize with coworkers?


    Answer:

    This question has two extreme answers (all the time, or never), and your interviewer,
    in most cases, will want to see that you fall somewhere in the middle. It''s important
    to establish solid relationships with your coworkers, but never at the expense
    of getting work done. Ideally, relationship-building can happen with exercises
    of teamwork and special projects, as well as in the break room.


    ## 5: Tell me about a time when a major change was made at your last job, and
    how you handled it.


    Answer:

    Provide a set-up for the situation including the old system, what the change was,
    how it was implemented, and include how you felt about each step of the way. Be
    sure that your initial thoughts on the old system are neutral, and that your excitement
    level grows with each step of the new change, as an interviewer will be pleased
    to see your adaptability.


    ## 6: When delegating tasks, how do you choose which tasks to which team members?


    Answer:

    The interviewer is looking to gain insight into your thought process with this
    question, so be sure to offer thorough reasoning behind your choice. Explain that
    you delegate tasks based on each individual''s personal strengths, or that you
    look at how many other projects each person is working on at the time, in order
    to create the best fit possible.


    ## 7: Tell me about a time when you had to stand up for something you believed
    strongly about coworkers or a supervisor.


    Answer:

    While it may be difficult to explain a situation of conflict to an interviewer,
    this is a great opportunity to display your passions and convictions, and your
    dedication to your beliefs. Explain not just the situation to the interviewer,
    but also elaborate on why it was so important to you to stand up for the issue,
    and how your coworker or supervisor responded to you afterward – were they more
    respectful? Unresponsive? Open-minded? Apologetic?


    ## 8: Tell me about a time when you helped someone finish their work, even though
    it wasn’t “your job.”


    Answer:

    Though you may be frustrated when required to pick up someone else’s slack, it’s
    important that you remain positive about lending a hand. The interviewer will
    be looking to see if you’re a team player, and by helping someone else finish
    a task that he or she couldn’t manage alone, you show your willingness to help
    the team succeed, and your own competence.


    ## 9: What are the challenges of working on a team? How do you handle this?


    Answer:

    There are many obvious challenges to working on a team, such as handling different
    perspectives, navigating individual schedules, or accommodating difficult workers.
    It''s best to focus on one challenge, such as individual team members missing
    deadlines or failing to keep commitments, and then offer a solution that clearly
    addresses the problem. For example, you could organize weekly status meetings
    for your team to discuss progress, or assign shorter deadlines in order to keep
    the long-term deadline on schedule.


    ## 10: Do you value diversity in the workplace?


    Answer:

    Diversity is important in the workplace in order to foster an environment that
    is accepting, equalizing, and full of different perspectives and backgrounds.
    Be sure to show your awareness of these issues, and stress the importance of learning
    from others'' experiences.


    ## 11: How would you handle a situation in which a coworker was not accepting
    of someone else''s diversity?


    Answer:

    Explain that it is important to adhere to company policies regarding diversity,
    and that you would talk to the relevant supervisors or management team. When it
    is appropriate, it could also be best to talk to the coworker in question about
    the benefits of alternate perspectives – if you can handle the situation yourself,
    it''s best not to bring resolvable issues to management.


    ## 12: Are you rewarded more from working on a team, or accomplishing a task on
    your own?


    Answer:

    It''s best to show a balance between these two aspects – your employer wants to
    see that you''re comfortable working on your own, and that you can complete tasks
    efficiently and well without assistance. However, it''s also important for your
    employer to see that you can be a team player, and that you understand the value
    that multiple perspectives and efforts bring to a project.


    ## 13: Tell me about a time when you worked additional hours to finish a project.


    Answer:

    It''s important for your employer to see that you are dedicated to your work,
    and willing to put in extra hours when required or when a job calls for it. However,
    be careful when explaining why you were called to work additional hours – for
    instance, did you have to stay late because you set poorly earlier in the process?
    Or on a more positive note, were you working additional hours because a client
    requested for a deadline to be moved up on short notice? Stress your competence
    and willingness to give 110% every time.


    ## 14: Tell me about a time when your performance exceeded the duties and requirements
    of your job.


    Answer:

    If you''re a great candidate for the position, this should be an easy question
    to answer – choose a time when you truly went above and beyond the call of duty,
    and put in additional work or voluntarily took on new responsibilities. Remain
    humble, and express gratitude for the learning opportunity, as well as to give
    a repeat performance.


    ## 15: What is your driving attitude about work?


    Answer:

    There are many possible good answers to this question, and the interviewer primarily
    wants to see that you have a great passion for the job and that you will remain
    motivated in your career if hired. Some specific driving forces behind your success
    may include hard work, opportunity, growth potential, or success.


    ## 16: Do you take work home?


    Answer:

    It is important to first clarify that you are always willing to take work home
    when necessary, but you want to emphasize that it has not been an issue for you.
    Highlight skills such as time management, goal-setting, and multitasking, which
    can all ensure that work is completed.


    ## 17: Describe a typical work day to me.


    Answer:

    There are several important components in your work day, and an interviewer may
    derive meaning from any or all of them. Start at the beginning of your day and
    proceed chronologically, making sure to emphasize steady productivity, time for
    review, goal-setting, and prioritizing, as well as some additional time to account
    for unexpected things that may arise.


    ## 18: Tell me about a time when you went out of your way at your previous job.


    Answer:

    Here it is best to use a specific example of the situation that required you to
    go out of your way, what your position would have required that you did, and how
    you went. Use concrete details, and be sure to include the results, as well as
    reflection on what you learned in the process.


    ## 19: Are you open to receiving feedback and criticisms on your job performance,
    and adjusting as necessary?


    Answer:

    This question has a pretty clear answer – yes – but you''ll need to display a
    knowledge as to why this is important. Receiving feedback and criticism is one
    thing, but the most important part of that process is to then implement it into
