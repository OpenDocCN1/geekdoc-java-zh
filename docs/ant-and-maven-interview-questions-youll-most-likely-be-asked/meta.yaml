    本书旨在就其涵盖的主题提供准确且权威的信息。作者在编写本书时已尽一切努力确保信息的准确性。然而，书中的信息销售时不不带任何明示或暗示的保证。作者或出版者对由于本书直接或间接引起或声称引起的任何损害不承担责任。\n\
    \nVibrant Publishers 的书籍可根据促销活动提供特殊批量折扣，或用于企业培训计划。欲了解更多信息，请邮件至 bulkorders@vibrantpublishers.com\n\
    \n请向 spellerrors@vibrantpublishers.com 发送反馈/更（技术、语法或拼写错误）\n\n欲访问 Vibrant Publishers\
    \ 的完整目录，请访问 www.vibrantpublishers.com\n\n# 目录\n\n+ 1 道 Ant 题\n(a) 构建文件 7\n(b)\
    \ Ant 脚本 13\n(c) Ant 工具 19\n(d) Apache Ant 库 23\n(e) 通配符 29\n(f) 过滤器链和过滤器读取 33\n\
    (g) 自定义组件和选择器 41\n2 道 Maven 题\n(a) Maven 基础 47\n(b) 目录结构 59\n(c) 生命周期，阶段 63\n\
    (d) 插件 65\n(e) 存储库 67\n(f) 配置 73\n(g) 构建配置 89\n3 道 人力资源题 93\n索引 113\n\n# Ant 面试面试题\n\
    \n回顾这些典型的面试题，并思考你将如何回答。阅读列出的答案；你将找到最佳答案以及策略和建议。\n\n# 构建文件\n\n## 1: Apache Ant\
    \ 的系统要求是什么？\n\n答案：\n\nAnt 可用于许多平台，包括 Linux、Unix、Windows NT、Novell Network 6 和\
    \ Mac OS。Windows 9x 已经不再受支持。\n\n## 2: Apache Ant 的构建文件是如何工作的？\n\n答案：\n\n构建文件是用\
    \ XML 编写的。每个构建文件包含一个项目至少一个目标（target）。目标包含任务（task）元素。构建文件中的每个任务元素都可以有一个 `id` 属性，稍后可以通过提供给该属性的值进行引用。该值必须是唯一的。\n\
    \n## 3: 项目中有多少个属性？请描述它们。\n\n答案：\n\n项目中有三个属性，分别是 `name`、`default` 和 `basedir`。`name`\
    \ 属性定义为项目的名称。`default` 是在未提供目标时使用的默认目标，`basedir` 是进行所有路径计算的基目录。\n\n## 4: 定义 Ant\
    \ 的任务（task）以及它是如何工作的。\n\n答案：\n\n任务是一段可以执行的代码。任务可以有多个属性。属性的值可能包含对属性（property）的引用。这些引用将在任务执行之前被解析。\n\
    \n## 5: 属性名区分大小写吗？\n\n答案：\n\n是的，属性名是区分大小写的。\n\n## 6: 令牌过滤器（token filter）的作用是什么？\n\
    \n答案：\n\n项目可以有一组令牌（tokens），如果在复制文件时，且在支持此功能的任务中选择了过滤复制行为，如果发现了这些令牌，就会自动扩展。这些可以通过\
    \ `filter` 任务在构建文件中设置。\n\n## 7: 如果在文件中发现格式为 @token@ 的令牌，但与该令牌没有关联过滤器，会发生什么？\n\n\
    答案：\n\n不会发生任何变化。因此，没有可用的转义方法。\n\n## 8: Ant 的类路径结构中使用了哪些分隔符？\n\n答案：\n\n我们可以同时使用\
    \ `:` 和 `;` 作为分隔符来指定 `PATH-` 和 `CLASPATH-` 类型的引用。\n\n## 9: Ant 构建文件中嵌套参数（nested\
    \ argument）的目的是什么？\n\n答案：\n\n若干任务接受参数，这些参数将传递给命令行上的另一个进程。为了方便指定包含空格字符的参数，可以使用嵌套参数元素（nested\
    \ argument elements）。\n\n## 10: 解释以下 ANT 命令行参数：`<arg value=\"-l -a\"/>`。\n\n答案：\n\
    \n这是一个包含空格字符的单个命令行参数，而不是独立的命令 `\"-l\"` 和 `\"-a\"`。\n\n## 11: Ant 支持用于第三方任务的插件机制。要使用它们，我们应该怎么做？\n\
    \n答案：\n\n我们应该为此执行 2 个步骤：\n\n- a) 将它们的实现放在 Ant 能够找到的地方。\n- b) 声明它们。\n\n## 12: 写一个从命令行启动你的\
    \ Ant 构建的程序。\n\n答案：\n\n打开命令行并切换到你的项目目录。输入 `ant` 或 `ant -f build.xml` 来启动构建。\n\n\
    ## 13: 如何通过 Ant 运行？\n\n答案：\n\nAnt 定义了 `junit` 任务。我们需要将 `junit.jar` 包含在类路径中，就可以运行。例如：\n\
    \n```xml\n<path id=\"classpath.test\">\n  <pathelement location=\"/lib/junit.jar\"\
    \ />\n  <pathelement location=\"${tst-dir}\" />\n</path>\n<target name=\"compile-test\"\
    >\n  <javac refid=\"classpath.test\"/>\n</target>\n```\n\n## 14: Ant 有变量吗？\n\n\
    答案：\n\nAnt 没有变量。Ant 使用属性（properties）。\n\n# Ant 脚本\n\n## 15: 列出用于脚本的工具。\n\n答案：JavaScript、Jython、Jacl、NetRex、Java、JRuby、JudoScript。\n\
    \n## 16: 什么是 BSF？\n\n答案：\n\nBSF 代表 脚本框架（Bean Scripting Framework）。BSF 是一组为 Java\
    \ 应用提供脚本语言，并允许访问 Java 对象和方法。\n\n## 17: 在 Ant 中使用 BeanShell 我们需要做哪些步骤？\n\n答案：在类路径中添加\
    \ BSF (bsf.jar) 和 BeanShell (bsh.jar)。\n\n## 18: 写出构建.xml 文件的语法。\n\n答案：\n\n```xml\n\
    <project name=\"AppBuilder\" default=\"war\" basedir=\".\">\n<property file=\"\
    ant.properties\"/>\n</project>\n```\n\n## 19: eclipse 编辑器是如何工作的？\n\n答案：Eclipse\
    \ 有一个 ant 编辑器，通过提供 ant 文件的语法检查来方便编辑。Eclipse 还有一个 ant 视图。在此视图中通过双击目标来执行 ant 文件。\n\
    \n## 20: 根据场景编写语法。我们在同一个脚本中有两个编译目标，目前我们不想看到编译时生成的警告。\n\n答案：\n\n```xml\n<target\
    \ name=\"component1\">\n  <javac nowarn=\"false\" srcdir=\"${src}\"/>\n</target>\n\
    \n<target name=\"component2\">\n  <javac nowarn=\"false\" srcdir=\"${src}\"/>\n\
    </target>\n```\n\n## 21: 语法 `<javac debug=\"on\" srcdir=\"${src}\" />` 的作用是什么？\n\
    \n答案：上述语法对于查看堆栈跟踪中出现源代码行号非常有用。\n\n## 22: Ant 的默认目标是在什么时候执行的？\n\n答案：默认目标是在直接在命令行中输入\
    \ `ant` 时执行的目标。\n\n## 23: ANT 脚本中 `description` 属性的目的是什么？\n\n```xml\n<target name=\"\
    deploy\" description=\"compiles and deploys to ABC on PC1\">\n```\n\n答案：为 Ant\
    \ 目标定义描述在我们忘记名称或用途时有用。我们可以在命令行中输入 `-projecthelp`，ant 将列出主要目标及其描述。\n\n## 24: 如果我们不在单独的\
    \ JVM 中运行 Java 代码到 ant 脚本，会发生什么？\n\n答案：如果我们不在单独的 JVM 中运行 Java 代码，我们可能会得到一些难以诊断的奇怪错误。\n\
    \n## 25: 如何修复由于未在单独的 JVM 中运行 Java 代码而引起的错误？\n\n答案：此类问题可以通过在 `java` 目标中设置 `fork=true`\
    \ 来跟踪或修复。\n\n## 26: 哪个 Ant 任务允许开发者将桌面应用程序打包为 WAR，通过 Java Web Start 在网络上分发？\n\n\
    答案：Ant Web Start 任务\n\n## 27: 什么是 Antxtra？请列出组件的分类。\n\n"
