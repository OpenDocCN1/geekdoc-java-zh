    Answer:


    They are accessed on the local disk.


    # 164: How are the Remote Repository accessed?


    Answer:


    They are accessed through the network.


    # 165. What is the role of Repositories in Maven?


    Answer:


    They store a collection of artifacts used by Maven during dependency resolution
    for a project.


