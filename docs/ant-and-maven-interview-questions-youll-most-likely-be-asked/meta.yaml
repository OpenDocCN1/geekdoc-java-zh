    # 103: What is the use of depth tag?

    Answer:


    The <depth> tag selects files based on how many directory levels they are in in
    relation to the base directory of the FileSet. It has two attributes, min and
    max. The minimum number of directory levels below the base directory that a file
    must be in order to be selected. Default is no limit. The maximum number of directory
    levels below the base directory that a file can be and still be selected. Default
    is no limit.'
