    To see the documentation for the Scala API, head over to http://scala-

    lang.org/documentation. You’ll notice it is broadly similar to JavaDoc. You can
    see the

    classes along the left; they’re not grouped by package like JavaDoc but they’re

    clickable to get more information.'
