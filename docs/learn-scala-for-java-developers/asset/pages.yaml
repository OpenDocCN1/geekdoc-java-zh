  md: '# For Comprehensions


    The last chapter focused on monads and the map and flatMap functions. In this
    chapter we''re going to focus on just flatMap behaviour. Specifically, we''ll
    look at how to chain flatMap function calls before finally yielding results. For
    comprehensions actually use flatMap under the hood, so we''ll look at the relationship
    in detail and explain how for comprehensions work.


    # Where We Left Off


    Hopefully you''re now comfortable with the idea of flatMap. We looked at it for
    the collection classes and for option. Recall that we used flatMap to map over
    customer names that may or not exist in our database. By doing so, we could sum
    customer values.


    ```

    customers

    .flatMap(name => database.find(name))

    .map(customer => customer.total)

    .sum

    ```


    Now let''s say we''d generate a shipping label for a customer. We can look up
    a customer in our repository and if we have a street address and a postcode, we
    can generate a shipping label.


    The caveats are:


    +   1. A customer may or not exist in the repository.

    2. A given customer may or may not have an address object.

    3. An address object must contain a street but may not contain a postcode.


    So, to generate a label, we need to:


    +   1. Find a customer (who may or not exist) by name.

    2. Get the customer''s address (which also may or may not exist).

    3. Given the address, get the shipping information from it. (We can expect an
    Address object to contain a street address, but it may or may not have a postcode.)


    # Using Null Checks


    If we were to implement this where the optionality was expressed by returning
    nulls, we''d be forced to deal with a bunch of null checks. We have four customers:
    Albert, Beatrice, Carol, and Sherlock. Albert has an address but no postcode,
    Beatriz hasn''t given us her address, and the last two have full address information.


    ```

    val customers = Customers()

    val address1 = Some("1a Bridge St", None))

    ```'
