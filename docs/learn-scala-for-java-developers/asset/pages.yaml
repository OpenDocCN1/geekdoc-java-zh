  md: "```\nval tall = if (height > 190) \"tall\" else \"not tall\" // scala\n```\n\
    \nYou have noticed this behaves like a expression in Java.\n\n```\nString tall\
    \ = height > 190 ? \"tall\" : \"not tall\"; // java\n```\n\nSo, ternaries are\
    \ expressions in Java but if statements are not. Scala has no conditional operator\
    \ (:) because a regular Scala is an expression; it's equivalent to Java's conditional\
    \ operator. In fact, the bytecode generated for an if uses a ternary.\n\nYou don't\
    \ have to use an if in Scala like a ternary and assign it to anything, it's important\
    \ to realise that it is an expression and has a value. fact, everything in Scala\
    \ is an expression. Even a simple block (denoted with curly braces) will return\
    \ something.\n\n# Switch Statements\n\nThere are no switch statements as such\
    \ in Scala. Scala uses match expressions instead. These look like they're switching\
    \ but differ, that the whole thing is an expression and not a statement. So as\
    \ we saw with the if, Scala's switch-like construct has a value. It also uses\
    \ called pattern matching which is a lot more powerful, as it allows you to select\
    \ on more than just equality.\n\nIn Java, you might write a switch to work out\
    \ which quarter part falls in. So, January, February, March are in the first quarter,\
    \ April, May, June in the second, and on.\n\n```\n// java\npublic class static\
    \ void main(String... args) {\n    String month = \"August\";\n    String quarter;\n\
    \    switch (month) {\n        case \"January\":\n        case \"February\":\n\
    \        case \"March\":\n            quarter = \"1st quarter\";\n           \
    \ break;\n        case \"April\":\n        case \"May\":\n        case \"June\"\
    :\n            quarter = \"2nd quarter\";\n            break;\n        case \"\
    July\":\n        case \"August\":\n        case \"September\":\n            quarter\
    \ = \"3rd quarter\";\n            break;\n        case \"October\":\n        case\
    \ \"November\":\n        case \"December\":\n            quarter = \"4th quarter\"\
    ;\n            break;\n        default:\n            quarter = \"unknown quarter\"\
    ;\n            break;\n    }\nSystem.out.println(quarter);\n```"
