  md: '# Have a Plan


    +   * **Have a plan.** Don’t just start your next project in Scala; be deliberate
    and have a plan.


    +   * **Think about your goals.** Write them down, then sketch out the steps that
    will take you closer to them. For example, if a goal is to get up to speed fast,
    you may want to run some lunchtime knowledge-sharing sessions with your team.


    +   * **Decide where on the functional programming continuum you want to be.**
    Do you want to jump in at the deep end or adopt functional idioms later? One tip
    to minimise the learning curve is to avoid using native Scala libraries to start
    with. They often lead you into functional style and at the end of the day, it’s
    another API to learn. You can always stick with the Java libraries you know, at
    least to start with.


    +   * **Make a commitment.** Commit to your goals; don’t do what I did and sideline
    Scala to the tests. Actively decide on Scala and make a personal commitment to
    see it happen.


    If you follow these tips, you should be clear about your goals and expectations,
    have an idea where you’ll get guidance and have planned out your next steps. You’ll
    be facing the prospect of working with a Scala codebase, probably converting Java
    code and working with new tools and libraries.


    In the next chapters we’ll look at some practical tips on how to proceed, including
    converting Java code and managing your codebase.'
