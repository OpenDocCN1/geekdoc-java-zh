  md: '# AnyVal


    AnyVal is the super-type to all value types, and AnyRef the super-type of all
    reference types.


    Basic types such as Byte, Int, Char, are known as value types. In Java value types
    correspond to the primitive types, but in Scala they are objects. Value types
    are all predefined and can be referred to by literals. They are usually allocated
    on the stack and are allocated on the heap in Scala.


    All other types in Scala are known as reference types. Reference types are objects
    in memory (the heap), as opposed to pointer types in C-like languages, which are
    addresses in memory that point to something useful and need to be dereferenced
    using special syntax (for example, *age = 64 in C). Reference objects are effectively
    dereferenced automatically.


    There are nine value types in Scala:


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_21_0.png)


    Fig. 1.2. Scala''s value types.


    These classes are fairly straightforward; they mostly wrap an underlying Java
    type and provide implementations for the == method that are consistent with Java''s
    equals method.'
  merge: -1
