  md: '# What to Expect


    # The Learning Curve


    If you''ve just started to learn Scala and are wondering what to expect, it''s
    typical to experience a quick ramp-up in skill followed by a slower adoption of
    the more sophisticated features. In this chapter, I talk about what I think of
    as a typical learning curve.


    Based on my experiences and talking to various Scala teams, we can chart a typical
