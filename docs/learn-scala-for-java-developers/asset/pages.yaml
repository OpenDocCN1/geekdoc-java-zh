    \n> Why the Getter?\nYou might be wondering why we created the getter method def\
    \ to allow the shorthand assignment syntax to a value class that has both the\
    \ setter (id=) and getter methods.\n\n# Summary\n\nCreating classes is straightforward\
    \ in Scala. You can add fields to the class simply by adding parameters to the\
    \ class definition, and the equivalent Java constructor, getters and setters are\
    \ generated for you by the compiler.\nAll fields in the class file are generated\
    \ as private but have associated accessor methods generated. These generated methods\
    \ are affected by the presence of val or var in the class definition.\n\n+   -\
    \ If val is used, a public getter is created but no setter is created. The value\
    \ can only be set by the constructor.\n- If var is used, a public getter and setter\
    \ is created. The value can be set via the setter or the constructor.\n- If neither\
    \ val or var is used, no methods are generated and the value can only be used\
    \ within the scope of the primary constructor; it's not really이라 in this case.\n\
    - Prefixing the class definition with private won't change these rules, but will\
    \ make any generated methods private."
