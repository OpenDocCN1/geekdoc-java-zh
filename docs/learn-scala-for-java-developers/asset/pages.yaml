    # More Formal Definition


    As a more formal definition, a monad must:


    +   - Operate on a parametrised type, which implies it’s a “container” for another
    type (this is called a type constructor).

    - Have a way to construct the monad from its underlying type (the unit function)

    - Provide a flatMap operation (sometimes called bind).


    Option and List both meet these criteria.


    | Option | List |

    | --- | --- |

    | Parameterised (type constructor) | Option[A] | List[T] |

    | Construction (unit) | Option.apply(x) Some(x) None | List(x, y, z) |

    | flatMap (bind) | def flatMap[B](f: A => Option[B]): Option[B] | def flatMap[B](f:
    A => List[B]): List[B] |


    The definition doesn’t mention map, though, and our layman’s definition for monad
    is:


    > Something that has map and flatMap functions.


    I wanted to introduce flatMap in terms of map because it always applies a mapping
    function before flattening. It’s true that to be a monad you only have flatMap
    but in practice monads also supply a map function. This is because all monads
    are also functors; its functors that more formally have to provide maps.


    So the technical answer is that providing flatMap, a parametrised type, and the
    unit function makes something a monad. But all monads are functors and map comes
    from functor.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_131_0.png)


