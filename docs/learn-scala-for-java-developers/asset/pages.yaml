  md: "People think that by-name parameters are the same as lazy values but this isn't\
    \ technically accurate.\nYes, they aren't evaluated until they're encountered\
    \ at runtime but unlike true lazy values, they will be evaluated\nevery time they're\
    \ encountered.\n\\True lazy values are evaluated the first time they're encountered\
    \ and stored so the second time you ask for\nvalue, it's returned, not evaluated\
    \ again.\nSo by-name parameters are not lazy.\n\n# Currying\n\nUsing the apply\
    \ method and curly braces allows us to create APIs that are expressive and\nnatural\
    \ to use. It allows us to create control abstractions that conform to what we\
    \ already\nexpect from the language in terms of syntax.\n\nBut remember what we\
    \ said about the curly braces.\n\n+   Any method call which accepts exactly one\
    \ argument can use curly braces to\nsurround the argument indent parentheses.\n\
    \nWe only only curly braces with single-argument methods. What if we want to add\
    \ an\nargument to our runInThread and still use the elegant syntax? The good news\
    \ is\nthat's entirely possible; we employ a technique called currying.\n\nLet's\
    \ extend our runInThread to add a new argument to assign a thread group.\n\n```\n\
    def runInThread(group: String, function: => Unit) {\n  new Thread(new ThreadGroup(group),\
    \ new Runnable()) {\n    run(): Unit = function\n  }).start()\n}\n```\n\nAs single-argument\
    \ lists use curly braces, we have to regress the ui object back to\nusing parentheses.\n\
    \n```\n// yuk!\ndef updateUIElements() {\n  runInThread(\"basket\", {\n    applyDiscountToBasket(basket)\n\
    \    updateCustomerToBasket(basket)\n  })\n  runInThread(\"customer\",\n    updatedOffersFor(customer)\n\
    }\n```\n\nIf we convert our function with two arguments into a function that takes\
    \ one\nargument we'd be able to use curly braces again. Fortunately for, that's\
    \ exactly\nwhat currying is about. Currying is the process of turning a function\
    \ of two or more\narguments into a series of functions, each taking a single argument.\n\
    \nFor a function of two arguments, currying would produce a function that takes\
    \ one\nargument and returns another function. This returned function would also\
    \ have a single"
