  md: '# Fig. 2.2. Concrete class FlyingHorse extends everything.


    The problem comes when we have a method that all of the classes could implement
    and potentially call that method on their super-class. Let''s say there''s a method
    called move. For an animal with legs, move might mean to travel forwards, whereas
    an animal with wings might travel upwards as well as forwards. If you call move
    on our FlyingHorse, which implementation would you expect to be called? How about
    if it in turn calls super.move?


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_72_0.png)


    # Fig. 2.3. How should a call to move resolve?


    Scala addresses the problem using the linearization technique. Flattening the
    hierarchy from right to left would give us FlyingHorse, HasFourLegs, Bird, HasWings
    and finally Animal. So if any of the classes call a super-class''s method, it
    will resolve it.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_72_1.png)


    # Fig. 2.4. Class FlyingHorse extends Animal with Bird with HasFourLegs.


    If we change the order of the traits and swap HasFourLegs with Birds, the linearization
    changes and we get a different evaluation order.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_72_2.png)


    # Fig. 2.5. Class FlyingHorse extends Animal with HasFourLegs with Bird.


    So by side by side, the examples look like this:'
