    \n```\nobject Customer {\n  def unapply(customer: Customer): Option[???] = ???\n\
    }\n```\n\nThe last piece of the puzzle is to work out what can be extracted from\
    \ the object: the type to put in the Option parameter. If you wanted to be able\
