    \ return a tuple, the data structure we saw earlier. It’s a way of returning multiple\
    \ pieces of data in a single type.\n\n```\nobject Customer {\n  def unapply(customer:\
    \ Customer): Option[(String, String)] = {\n    Some((customer.name, customer.address))\n\
    \  }\n```\n\nWe can use a pattern match with our customer.\n\n```\nval customer\
