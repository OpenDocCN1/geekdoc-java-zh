  md: "how to do it”. Ultimately, when you give up the micro-management style of imperative\
    \ programming, you allow the language more freedom in how it goes about its business.\n\
    \nFor example, a traditional imperative for loop in Java looks like this:\n\n\
    ```\n// java\nfor (int count = 0; count < 100; count++) {\n    System.out.println(count);\n\
    }\n```\n\nIt’s a typical imperative loop. We’re telling it explicitly to enumerate\
    \ serially from zero to one hundred. If, on the other hand, we use a more declarative\
    \ mechanism, like this:\n\n```\n// scala\n(0 to 100).foreach(println(_))\n```\n\
    \n...the enumeration is done within the foreach method, not by a language construct.\
    \ We’re saying, \"for a range of numbers, perform some function on each\". Although\
    \ only subtly different, we’re not saying *how* to enumerate the sequence. It\
    \ means Scala is free to implement the enumeration however it likes. (For example,\
    \ it may choose to do it in parallel.)\n\nInterestingly, Oracle has adopted these\
    \ ideas in Java 8. If you’ve been using that, you’re probably already familiar\
    \ with the concepts."
