  md: "# Control Structures\n\nThis chapter is all about control structures, like\
    \ if statements, switch blocks, loops and\nbreaks. Specifically, we'll look at:\n\
    \n+   - Conditionals if statements, ternary expressions and switches\n- Looping\
    \ structures; do, while and for\n- Breaking control flow\n- Exceptions, briefly\n\
    \n# Conditionals\n\n# Ifs and Ternaries\n\nConditionals are straightforward.\n\
    \n```\n// java\nif (age > 55) {\n    retire();\n} else {\n    carryOnWorking();\n\
    }\n```\n\nAn if in Java looks exactly the same in Scala.\n\n```\n// scala\nif\
    \ (age > 55) {\n    retire();\n} else {\n    carryOnWorking();\n}\n```\n\nYou'll\
    \ often find Scala developers dropping the braces for simple if blocks. For example:\n\
    \n```\nif (age > 55) \n    retire();\nelse\n    carryOnWorking()\n```\n\nor even\
    \ pulling it all onto one line.\n\n```\nif (age > 55) retire() else carryOnWorking()\n\
    ```\n\nThis style is favoured because if/else is actually an expression in Scala\
    \ and not a\nstatement, and the concise syntax makes it look more like an expression.\
    \ What's the\ndifference? Well, an expression returns a value whereas a statement\
    \ carries out an action.\n\n> Expressions vs. Statements\nan expression returns\
    \ a value whereas a statement carries out an action. Statements by their nature\
    \ often have\ns effects whereas expressions are less likely to."
