  md: "# Classes and Objects\n\nIn this chapter we'll look at:\n\n+   - How you can\
    \ define fields within the class body rather than on the class definition line\
    \ and how this affects the generated methods.\n- How you can create additional\
    \ constructors.\n- Scala’s singleton objects defined with the object keyword.\n\
    - Companion objects, a special type of singleton object.\n\n# Classes Without\
    \ Constructor Arguments\n\nLet's begin by looking at how we create fields within\
    \ classes without defining them on the class definition line. If you were to create\
    \ a class in Scala with no fields defined on the class definition, like this:\n\
    \n```\n// scala\nclass Counter\n```\n\n...the Scala compiler would still generate\
    \ a primary constructor with no arguments, a lot like Java's default constructor.\
    \ So the Java equivalent would look like this:\n\n```\n// java\npublic class Counter\
    \ {\n    public Counter() {\n}\n}\n```\n\nIn Java you might initialise a variable\
    \ and create some methods.\n\n```\n// java\npublic class Counter {\n    private\
    \ int count = 0;\n\n    public Counter() {\n    }\n\n    public void increment()\
    \ {\n        count++;\n    }\n\n    public int getCount() {\n        return count;\n\
    \    }\n}\n```\n\nYou can do the same in Scala.\n\n```\n// scala\nclass Counter\
    \ {\n    private var count = 0\n```"
