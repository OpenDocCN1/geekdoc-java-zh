  md: "The anatomy of a match expression looks like this:\n\n```\nvalue match {\n\
    \  case pattern guard => expression\n  ...\n  case => default\n}\n```\n\nSo we\
    \ have a value, then the match keyword, followed by a series of match cases. The\
    \ value itself can be an expression, a literal or even an object.\n\nEach case\
    \ is made up of a pattern, optionally a guard condition, and the expression to\
    \ evaluate on a successful match.\n\nYou might add a default, catch-all pattern\
    \ at the end. The underscore is our first example of an actual pattern. It’s the\
    \ wildcard pattern and means “match on anything”.\n\nA pattern can be:\n\n+  \
    \ * A wildcard match (.).\n* A literal match, meaning equality, used for values\
    \ such as 101 or RED.\n* A constructor match, meaning that a value would match\
    \ if it could have been created using a specific constructor.\n* A deconstruction\
    \ match, otherwise known as an extractor pattern.\n* A match based on a specific\
    \ type, known as a type query.\n* A pattern with alternatives (specified with\
    \ |).\n\nPatterns can also include a variable name, which on matching will be\
    \ available to the expression on the right-hand side. It’s referred to as a variable\
    \ ID in the language specification.\n\nThere are some more which I’ve left off;\
    \ if you’re interested in the Pattern Matching section of the Scala Language Specification.\n\
    \n# Literal Matches\n\nA literal match is a match against any Scala literal. The\
    \ example below uses string literal and has similarities to a Java statement.\n\
    \n```\nval language = \"French\"\nmatch {\n  case \"French\" => println(\"Salut\"\
    )\n  case \"French\" => println(\"Bonjour\")\n  case \"German\" => println(\"\
    Guten Tag\")\n  case => println(\"Hi\")\n}\n```\n\nThe value must exactly match\
    \ the literal in the example. The result will be to print “Bonjour” and not “Salut”\
    \ as the match value case has a capital F. The match is based on equality (==).\n\
    \n# Constructor Matches"
