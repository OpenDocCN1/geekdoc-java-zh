  md: "```\ndef runThread(function: () => Unit) {\n  new Thread(\n    override def\
    \ run(): Unit = function() // aka function.apply()\n  ).start()\n}\n```\n\nGiven\
    \ the new runThread method, we can rewrite the UI code like this:\n\n```\ndef\
    \ updateUIElements() {\n  runThread(() => updateCustomerBasket(basket))\n  runThread(()\
    \ => updateOffersFor(customer))\n}\n```\n\nWe've eliminated the duplication by\
    \ passing functions in parameters to runThread.\n\n# Higher Order Functions with\
    \ Curly Braces\n\nThis doesn't really live up to the promise of clients being\
    \ able to pass functions as arguments in \"a natural and concise way\". It looks\
    \ like Java's lambda syntax, but we can make it look more natural and more like\
    \ language syntax if we use the curly braces.\n\nIf we replace the parentheses\
    \ with curly braces, it doesn't really improve things.\n\n```\n// yuk!\ndef updateUIElements()\
    \ {\n  runThread(() =>\n    updateCustomerBasket(basket)\n)\n  runThread(() =>\n\
    \    updateOffersFor(customer)\n}\n```\n\nBut we can employ another trick to get\
    \ rid of the empty parentheses and arrows. We can use what we called a *call-by-name*\
    \ parameter.\n\n# Call-by-Name\n\nIn Java, you can't do anything about an empty\
    \ lambda argument list (e.g., () void) but in Scala, you can drop the brackets\
    \ from a function signature to indicate that the argument is call-by-name. To\
    \ invoke it, you no longer need to call the apply method. Instead, you simply\
    \ reference it.\n\n```\ndef runThread( => Unit) { // call-by-name\n  new Thread()\
    \ {\n    override def run(): Unit = function // not function()\n  ).start()\n\
    }\n```\n\nThe by-name parameter expression isn't evaluated until it's actually\
    \ used; not when it's defined. It behaves just like the longhand function even\
    \ though it looks like we're calling the function at the point we pass it into\
    \ our runThread method.\n\n```\ndef updateUIElements() {\n  runThread {\n    updateCustomerBasket(basket)\n\
    \  }\n  runThread {\n    updateOffersFor(customer)\n  }\n```"
