  md: "The break is required to stop the statement execution falling through. When\
    \ Java selects a case, it has to have a side effect to be useful. In this case,\
    \ it assigns a value to a variable.\n\nIn Scala, we'd start with something like\
    \ this:\n\n```\n// scala\nobject BrokenSwitch extends App {\n  val month = \"\
    August\"\n  var quarter = \"???\"\n  month match {\n    case \"January\" =>\n\
    \    case \"February\" =>\n    case \"March\" => quarter = \"1st quarter\"\n \
    \   case \"April\" =>\n    case \"May\" =>\n    case \"June\" => quarter = \"\
    2nd quarter\"\n    case \"July\" =>\n    case \"August\" =>\n    case \"September\"\
    \ => quarter = \"3rd quarter\"\n    case \"October\" =>\n    case \"November\"\
    \ =>\n    case \"December\" => quarter = \"4th quarter\"\n    case => quarter\
    \ = \"unknown quarter\"\n  }\n  println(month + \" is \" + quarter)\n```\n\nThe\
    \ above is a syntactic translation. However, Scala doesn't support the break keyword\
    \ so we have to leave out. Rather that we use match and we're saying \"does the\
    \ month match any of these case clauses? the colon: we => the underscore at the\
    \ bottom is the catch-all, same as default in Java. Underscore is often used in\
    \ Scala to mean an unknown value. Also although this is a direct translation,\
    \ when you run it, something has gone wrong. The result isn't been set.\n\nThe\
    \ output says:\n\nUnlike Java, if a case matches, the break is implicit — there\
    \ is no fall-through to the next case. So we'll have to add code to the empty\
    \ blocks.\n\n```\n// scala\nobject Switch extends App {\n  val month = \"August\"\
    \n  var quarter = \"???\"\n  month match {\n    case \"January\" => quarter =\
    \ \"1st quarter\"\n    case \"February\" => quarter = \"1st quarter\"\n    case\
    \ \"March\" => quarter = \"1st quarter\"\n    case \"April\" => quarter = \"2nd\
    \ quarter\"\n    case \"May\" => quarter = \"2nd quarter\"\n    case \"June\"\
    \ => quarter = \"2nd quarter\"\n    case \"July\" => quarter = \"3rd quarter\"\
    \n    case \"August\" => quarter = \"3rd quarter\"\n```"
