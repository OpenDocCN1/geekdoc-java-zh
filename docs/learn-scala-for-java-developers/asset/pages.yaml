  md: "you're creating higher-order functions. These allow for greater flexibility\
    \ and re-use.\nFor example, let's say we want to do some work and update a UI\
    \ element, like a progress\n or a customer basket. The best way to do this is\
    \ in a new thread so that we don't slow\nthe main UI thread and pauses for the\
    \ user.\n\n# Higher-Order Functions\n\nIf every call to update a UI element must\
    \ be done on its own thread, we might end up with\na naive implementation like\
    \ this:\n\n```\nobject Ui {\n  def updateUIElements() {\n    new Thread() {\n\
    \      override def run(): Unit = updateCustomerBasket(basket)\n    }.start()\n\
    \n    new Thread() {\n      override def run(): Unit = updateOffersFor(customer)\n\
    \    }.start()\n  }\n```\n\nThe ui object executes the sequence of updates one\
    \ after another, each on a new thread.\nThe UI object is managing the threading\
    \ policy and the update behaviour. It would be\nbetter if something else was responsible\
    \ for coordinating thread and the ui object was\nleft to the update behaviour.\
    \ Then, we could avoid duplication and if the threading\npolicy changes, we wouldn't\
    \ have to find all the usages scattered about the place.\n\nThe solution is to\
    \ define a function that can run some other function on a thread. We create\n\
    a function called runInThread with the boilerplate threading code.\n\n```\ndef\
    \ runInThread() {\n  new Thread() {\n    override def run(): Unit = ???\n  }.start()\n\
    }\n```\n\nIt will create and start a new thread but it doesn't do anything interesting.\
    \ How do we pass\na a function? In Java, you'd probably pass in an anonymous instance\
    \ of a Runnable or\nCallable or a lambda.\n\nYou do the same in Scala but rather\
    \ pass in a functional interface as the argument,\nYou pass in a shorthand signature\
    \ denoting a function argument. You define a variable as\nusal(function in our\
    \ example below) but the type that follows the colon represents a\nfunction. Our\
    \ has no arguments and returns a value of unit. It's equivalent to\nJava 8's signature\
    \ for a lambda: () Void.\n\n```\ndef runInThread(function: () => Unit) {\n  new\
    \ Thread() {\n    override def run(): Unit = ???\n  }.start()\n}\n```\n\nThen\
    \ we just execute the function in the body of the thread. Remember the brackets\n\
    dote the shorthand for executing the apply method."
