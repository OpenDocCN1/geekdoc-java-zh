    ```\n// java\npublic class Customer {\n    private final String fullname;\n\n\
    \    public Customer(String forename, String initial, String surname) {\n    \
    \    if (initial != null && !initial.isEmpty()) {\n            this.fullname =\n\
    ```\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_47_0.png)"
