  md: "# What to Avoid\n\nIt's also great to know what to avoid when you're first\
    \ starting out. I wish I knew some of these things before I started:\n\n+   -\
    \ SBT can make your life harder. SBT starts off very simple but if you want to\
    \ do anything sophisticated, it gets fairly taxing. Be prepared to do some learning;\
    \ SBT isn't anything that you can get very far with by cutting and pasting examples\
    \ from the internet. You actually need some understanding. I think you'll have\
    \ bigger things to worry about so my suggestion is to stick with a build tool\
    \ that you're familiar with to start Scala projects in Maven.\n- Scalaz is not\
    \ the place to start. This is the Haskell programmer's library for Scala. It's\
    \ hardcore and if you've not doing purely functional programming for years, just\
    \ plain avoid. You don't need to know what an applicative functor is or why you'd\
    \ use a Kleisli. At least, not to start with.\n- “Fancy” Scala libraries might\
    \ not help. When Scala came out, a bunch of open source libraries hit the web.\
    \ People got away and in hindsight admit they went a little overboard with the\
    \ syntax. As a result there are lots of APIs that were not designed well:\n  -\
    \ Dispatch The http library Dispatch is a good example. The method to add a query\
    \ parameter to a request is <<?. That doesn't read as intuitively as addRequestParam.\
    \ In fairness, Dispatch offers both the upshot and to be skeptical of libraries\
    \ that operate overloading.\n  - Anomer is not one that uses parser API to extract\
    \ SQL results. It basically parses ResultSet but it has a unintuitive DSL for\
    \ doing so, it makes you wonder what was wrong with doing it manually.\n- Java\
    \ libraries work just fine. You can always use the Java libraries you know and\
    \ love from Scala.\n- Lack of consistency is dangerous. We've already touched\
    \ on this: don't try and use all the syntax variations at once. Figure out one\
    \ properly before moving on. Keep these things consistent.\n\n# Other Challenges\n\
    \nYou'll face plenty of other challenges:\n\n+   - Compilation speed is slow.\
    \ It may or may not be something that concerns you but be aware: it's unlikely\
    \ to match Java's speed anytime soon. In part this is due to how sophisticated\
    \ the Scala compiler; it does a lot of work and comes at a price.\n- Keeping your\
    \ IDE build configuration in sync with your external build tool can be a challenge.\
    \ Maven is so mature now that its IDE plugins pretty much handle everything for\
    \ you, but the SBT plugin for IDEA on the other hand has some problems. There\
    \ are third-party tools that generate IDE project files with mileage may vary.\
    \ The best I can offer is to pick the tools that seem to have the most weight\
    \ behind them for your IDE."
