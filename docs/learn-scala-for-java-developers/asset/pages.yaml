  md: 'The scalac compiler works just like jacac. It produces Java bytecode that can
    be executed directly by the JVM. You run the generated bytecode with the scala
    command. Just like Java though, it''s unlikely you''ll want to build your applications
    from the command line.


    All the major IDEs support Scala projects, so you''re more likely to continue
    using your favorite IDE. We''re not going to go into the details of how to set
    up a Scala project in each of the major IDEs; if you''re familiar with creating
    Java projects in your IDE, the process will be very similar.


    For reference though, here are a few starting points.


    +   - You can create bootstrap projects with Maven and the maven-scala-plugin.

    - You can create a new Scala project directly within IntelliJ IDEA once you''ve
    installed the scala plugin (available in the JetBrains repository).

    - Similarly, you can create a new Scala project directly within Eclipse once you
    have the Scala IDE plugin. Typesafe created this and it''s available from the
    usual update sites. You can also download a bundle directly from the scala-lang
    or scala-ide.org

    - You can use SBT and create a build file to compile and run your project. SBT
    stands for Simple Build Tool and it''s akin to Ant or Maven, but for the Scala
    world.

    - SBT also has plugins for Eclipse, so you can use it directly from the IDE to
    create and manage the project files.


    +   1. If you don''t want to change into the install folder to run the REPL, set
    the bin folder on your path.'
