    We can then transform the customers again to a collection of their basket totals.


    ```

    customers.map(database.find(_).map(_.total))

    ```


    Now here''s the interesting bit. If this transformation were against a value that
    could be null, and not an Option, we''d have to do a null check before carrying
    on. However, as it is an option, if the customer wasn''t found, the map would
    just not do the transformation and return another "no value" Option.


    When finally want to sum all the basket values and get a grand total, we can use
    the built-in sum.


    ```

    customers.map(database.find(_).map(_.total)).sum // wrong!

    ```


    However, this isn''t quite right. Chaining the two map functions returns a Set[Option[Double]],
    and we can''t sum that. We need to flatten this down to a sequence of doubles
    before summing.


    ```

    customers.map(database.find(_).map(_.total)).flatten.sum

    ```


    notice the position here, we map immediately on Option


    The flattening will discard any Nones, so afterwards the collection size will
    be 3. Only Albert, Carol, and Beatriz''s baskets get summed.


    # The Option.flatMap Function


    Above, we repeated flatMap behaviour by mapping and then flattening, but we could
    have used flatMap on Option directly.


    The first step is to flatMap the name instead of map. As flatMap does the mapping
    and then flattening, we immediately get a collection of Customer.


    ```

    val r: Set[Customer] = customers.flatMap(name => database.find(name))

    ```


    The flatten drops all the Nones, so the result is guaranteed to contain only customers
    that exist in our repository. We can then simply transform customers to their
    basket total, summing.


    ```

    customers.flatMap(name => database.find(name)).map(customer => customer.total).sum

    ```


    Dropping the no value options is a key behaviour for flatMap here. For example,
    the flattening on a list of:


    ```

    scala val x = List(1, 2), List(3), List(4, 5)

    x: List[List[Int]] = List(List(1), List(2), List(3))

