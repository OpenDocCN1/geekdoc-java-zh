  md: "We do exactly the same thing in Scala. Here’s the basic Customer class:\n\n\
    ```\n// scala\nclass Customer(val name: String, val address: String) {\n  private\
    \ val basket: ShoppingBasket = new ShoppingBasket\n\n  def add(item: Item) {\n\
    \    basket.add(item)\n  }\n\n  def total: Double = {\n    basket.value\n  }\n\
    }\n```\n\nWhen it comes to extending Customer to DiscountedCustomer, there are\
    \ a few things to consider. First, we'll create the DiscountedCustomer class.\n\
    \nIf we try and extend Customer to create DiscountedCustomer, we get a compiler\
    \ error\n\nWe get a compiler error because we need to call the Customer constructor\
    \ with values for its arguments. We had to do the same thing in Java when we called\
    \ super in the new constructor.\n\nScala has a primary constructor and auxiliary\
    \ constructors. Auxiliary constructors must be chained to eventually call the\
    \ primary constructor and in Scala, only the primary constructor can call the\
    \ super-class constructor. We can add arguments to the primary constructor like:\n\
    \n```\nDiscountedCustomer(name: String, address: String) extends Customer\n```\n\
    \nBut we can’t call super directly like we can in Java.\n\n```\nDiscountedCustomer(val\
    \ name: String, val address: String)\n  extends Customer {\n  super(name, address)\
    \ // compiler error\n}\n```\n\nIn Scala, to call the super-class constructor you\
    \ pass the arguments from the primary constructor to the super-class. Notice that\
    \ the arguments to discountedCustomer aren’t set as val. They are not fields;\
    \ they’re locally scoped to the primary constructor and passed directly to the\
    \ super-class.\n\n```\nDiscountedCustomer(name: String, address: String)\n  extends\
    \ Customer(name, address)\n```\n\nFinally, we can implement the discounted total\
    \ method in the subclass.\n\n```\noverride def total: Double = {\n  super.total\
    \ * 0.90\n}\n```"
