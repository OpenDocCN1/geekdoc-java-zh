  md: "# Map and FlatMap\n\nIn this chapter, we'll look at some of the functional\
    \ programming features of Scala, specifically the ubiquitous map and flatMap functions.\
    \ We're interested in these because they're closely related to the idea of monads,\
    \ a key feature of functional programming.\n\n# Mapping Functions\n\nYou'll see\
    \ the map function on countless classes in Scala. It's often described in the\
    \ context of collections. Classes like List, Set, and Map all have it. For these,\
    \ it applies a given function to each element in the collection, giving back a\
    \ new collection based on the result of that function. You “map” some function\
    \ over each element of your collection.\n\nFor example, you could create a function\
    \ that works out how a person is given the year of their birth.\n\n```\nimport\
    \ java.util.Calendar\ndef age(birthYear: Int) = {\n  val currentYear = Calendar.getInstance(Calendar.YEAR)\n\
    \  currentYear - birthYear\n}\n```\n\nWe could call the map function on a list\
    \ of birthdays, passing the function to create a new list of ages.\n\n```\nval\
    \ birthdays = List(1990, 1977, 1984, 1961, 1973)\nbirthdays.map(age)\n```\n\n\
    The result would be a list of ages. We've transformed the year 1990 into an age\
    \ of 25, for example.\n\n```\nres0: List[Int] = List(25, 38, 31, 54, 46)\n```\n\
    \nBeing a higher-function, you could have written the function inline as a lambda\
    \ like this:\n\n```\nbirthdays.map(year => Calendar.getInstance(Calendar.YEAR)\
    \ - year)\n```\n\nUsing the underscore as a shorthand for the lambda's parameter,\
    \ it would look like this:\n\n```\nbirthdays.map(Calendar.getInstance(Calendar.YEAR)\
    \ - _)\n```\n\n# It's like foreach\n\nSo map is a transforming function. For collections,\
    \ it iterates over the collection applying some function, just like foreach does.\
    \ The difference is that unlike foreach, map will collect the return values from\
    \ the function into a new collection and return that collection.\n\nIt's trivial\
    \ to implement a mapping function by hand. For example, we could create a class\
    \ Mapp that takes a number of elements of type A and creates a map function."
