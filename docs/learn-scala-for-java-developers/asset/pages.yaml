    \ looks like our constructor pattern example. That’s because essentially we used\
    \ a case class before which added an unapply method for us. This time, we created\
    \ it ourselves. It’s both an *extractor* and there’s a symmetry with the constructor,\
    \ a pattern constructor.\n\nMore specifically, the list of values to extract in\
    \ a pattern must match those in a class’s primary constructor to be called a constructor\
