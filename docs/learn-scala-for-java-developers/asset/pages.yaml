  md: "# Some Basic Syntax\n\n# Defining Values and Variables\n\nWe'll look at some\
    \ syntax. We'll start by creating a variable:\n\n```\nval language: String = \"\
    Scala\";\n```\n\nWe've defined a variable as a string and assigned to it the value\
    \ of \"Scala\". I say \"variable\", but we've actually created an immutable value\
    \ rather than a variable. The val keyword creates a constant, and language cannot\
    \ be modified from this point on. Immutability is a key you'll see again and in\
    \ Scala.\n\nIf we want to modify language later, we can use var instead of val.\
    \ We can then reassign it if we need to.\n\n```\nvar language: String = \"Java\"\
    \nlanguage = \"Scala\";\n```\n\nSo far, this doesn't look very different from\
    \ Java. In the variable definition, the type and variable name are the opposite\
    \ way round to Java, but that's about it. However, Scala uses type inference heavily,\
    \ so Scala knows that the var above is a string, even if we don't tell it.\n\n\
    ```\nval language = \"Scala\";\n```\n\nSimilarly, it know that the expression\
    \ is finished without needing to tell it explicitly with the semicolon. We can\
    \ drop that too.\n\n```\nval language = \"Scala\" // no semicolon\n```\n\nYou\
    \ only need to add semicolons when you use multiple expressions on the same line;\
    \ otherwise they get too complex for the compiler.\n\nOperator precedence is just\
    \ as you'd expect in Java. In the example below, the multiplication happens before\
    \ the subtraction.\n\n```\nscala val age = 35\nscala var maxHeartRate = 210 -\
    \ age * .5\nres0: Double = 191.5\n```\n\n# Defining Functions\n\nFunction and\
    \ method definitions start with the def keyword, followed by the signature. The\
    \ signature looks similar to a Java method signature but with the parameters type\
    \ the other way around again, and the return type at the end rather than the start.\n\
    \nLet's create a function to return the minimum of two numbers.\n\n```\ndef min(x:\
    \ Int, y: Int): Int = {\n  if (x < y) {\n    return x\n  else\n```"
