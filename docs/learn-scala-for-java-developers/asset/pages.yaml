  md: '# Manage Your Codebase


    Once you have your newly converted Scala codebase, you''ll be working with it
    for a while. Here are some practicalities you should be aware of and some general
    tips to manage your codebase.


    # Conventions


    +   - There are so many syntax variations and conventions that the sheer number
    of syntax options available can be intimidating. **Settle on your own conventions.**

    - Find a way of doing things that works for your team and stick to it. Avoid context
    switching between syntax modes to start with. That might mean using pattern matching
    rather than using map to start with. Wait until everyone is comfortable before
    switching over.

    - Review these choices regularly as you don''t want to be held back you''re up
    and running.

    - Have a look at Twitter''s efforts as an example. They''ve managed to condense
    their experiences into a really practical guide. Well worth a read.

    - Typesafe have a style guide which is worth reading over but should be taken
    with a pinch of salt.'
  merge: -1
