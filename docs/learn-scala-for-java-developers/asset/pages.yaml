    \n    case => \"unknown quarter\"\n  })\n}\n```\n\n# Looping Structures; do, while\
    \ and for\n\nScala and Java share the same syntax for do and while loops. For\
    \ example, this code uses a do and a while to print the numbers to zero.\n\n```\n\
    // java\nint i = 0;\ndo {\n  System.out.println(i);\n  i++;\n} while (i < 10)\n\
    ```\n\nThe Scala version would look like this. (There is no ++ incrementer so\
    \ we use += instead.)\n\n```\n// scala\nvar i: Int = 0\ndo {\n  println(i);\n\
    \  i += 1\n} while (i < 10)\n```\n\nAnd while loops are the same.\n\n```\n// java\n\
    int i = 0;\nwhile (i < 10) {\n  System.out.println(i);\n  i++;\n}\n```\n\n```\n\
    // scala\nvar i: Int = 0\nwhile (i < 10) {\n  println(i);\n  i += 1\n}\n```\n\n\
    Things get more interesting when we look at loops. Scala doesn’t have for loops\
    \ like Java does; it has what’s referred to as the “generator-based for loop”\
    \ “comprehension” instead. To all intents and purposes, these can be used like\
    \ Java’s for construct, for the most part you won’t have to worry about the technical\
    \ differences.\nJava’s for loop controls the iteration in three stages: initialise,\
