  md: "We might implement the singleton like this:\n\n```\n// java\npublic final class\
    \ Logger {\n    private static final Logger INSTANCE = new Logger();\n\n    private\
    \ Logger() {}\n\n    public static Logger getInstance() {\n        return INSTANCE;\n\
    \    }\n\n    public void log(Level level, String string) {\n        System.out.printf(\"\
    %s %s\\n\", level, string);\n    }\n}\n```\n\nWe create a Logger class, and a\
    \ single static instance of it. We prevent anyone else creating one by using a\
    \ private constructor. We then create an accessor to the static instance, and\
    \ finally give it a rudimentary log method. We'd call it like this:\n\n```\n//\
    \ java\nLogger.getInstance().log(\"Singleton loggers say YEAH!\");\n```\n\nA more\
    \ concise way to achieve the same thing in Java would be to use an enum.\n\n```\n\
    // java\npublic enum LoggerEnum {\n    LOGGER;\n\n    public void log(Level level,\
    \ String string) {\n        System.out.printf(\"%s %s\\n\", level, string);\n\
    \    }\n}\n```\n\nWe don't need to use an accessor method; Java ensures a single\
    \ instance is used and we'd call it like this:\n\n```\n// java\nLOGGER.log(\"\
    An alternative example using enum\");\n```\n\nEither way, they prevent clients\
    \ newning up an instance of the class and provide a single, global instance for\
    \ use.\n\nThe Scala equivalent would look like this:\n\n```\n// scala\nobject\
    \ Logger {\n    def log(level: Level, string: String) {\n        printf(\"%s %s\\\
    n\", level, string);\n    }\n}\n```\n\nThe thing to notice here is that the singleton\
    \ instance is denoted by the object keyword rather than class. We're saying \"\
    define a single object called Logger\" rather than \"define a class\"."
