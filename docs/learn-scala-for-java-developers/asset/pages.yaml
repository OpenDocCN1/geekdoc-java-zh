  md: "# Faking Function Calls\n\nScala provides mechanisms to make method calls look\
    \ like regular function calls. It uses special case apply and update methods to\
    \ allow a kind of shorthand call notation that can remove the clutter of your\
    \ code.\n\n# The apply Method\n\nThe apply method provides a shorthand way of\
    \ calling a method on a class. So, as we saw, you can use them as factory-style\
    \ creation methods, where given some class such as our old friend Customer:\n\n\
    ```\nclass Customer(name: String, address: String)\n...you can add an apply method\
    \ to its companion object.\nobject Customer {\n  def apply(name: String, address:\
    \ String) = new Customer(name, address)\n}\n```\n\nYou can then call the method\
    \ directly, or drop the apply part, at which point Scala will look for an apply\
    \ method that matches your argument list and call it.\n\n```\nCustomer.apply(\"\
    Bob Fossil\", \"1 London Road\")\nCustomer(\"Bob Randal\", \"14 Arches\")\n```\n\
    \nYou can also have multiple apply methods. For example, we could create another\
    \ method to default the default address of our customer.\n\n```\ndef apply(name:\
    \ String) = new Customer(name, \"No known address\")\nCustomer(\"Cuthbert Colbert\"\
    )\n```\n\nYou don't have to use apply methods as factory methods though. Most\
    \ people end up using them to make their class APIs more succinct. This is the\
    \ key to how Scala can make APIs more expressive. If it makes sense a default\
    \ behaviour of your class is to create an instance, fine, but you can also make\
    \ other methods look like function calls using.\n\nSo far, we've been using an\
    \ apply method on a singleton object (object Customer) and dropping the apply,\
    \ but you can have apply methods on a class and call them on an instance variable.\n\
    \nFor example, we could create a class called Adder and call the apply method\
    \ on an instance to add two numbers together.\n\n```\nval add = new Adder()\n\
    add.apply(1, 3)\n```\n\nBut we can just drop it and it'll look like we're calling\
    \ a function even though we're actually calling a method on an instance variable."
