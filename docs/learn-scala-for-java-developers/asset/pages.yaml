  md: "For example, let's add a creation method to our Customer class that will create\
    \ either a DiscountedCustomer or a regular customer based on how long they’ve\
    \ been a customer.\n\n```\n// java\npublic static Customer create(String name,\
    \ String address,\n    Integer yearsOfCustomer) {\n    if (yearsOfCustomer > 2)\
    \ {\n        return new DiscountedCustomer(name, address);\n    } else {\n   \
    \     return new Customer(name, address);\n    }\n}\n```\n\nIn Java, we’re forced\
    \ to return the new Customer from the method. The conditions are statements, that\
    \ execute, not expressions return values. We could do it longterm create a variable,\
    \ then return it, but the point is the same; the statements have to cause a side\
    \ effect.\n\n```\npublic static Customer create(String name, String address,\n\
    \    Integer yearsOfCustomer) {\n    Customer customer = null;\n    if (yearsOfCustomer\
    \ > 2) {\n        customer = new DiscountedCustomer(name, address);\n    } else\
    \ {\n        customer = new Customer(name, address);\n    }\n    return customer;\n\
    }\n```\n\nBecause conditionals in Scala are expressions, you don’t need to jump\
    \ through these hoops. In the Scalavent, you can just create the if and both branches\
    \ will return a Customer. As the entire expression is the last statement in the\
    \ method, it is what will be returned from the method.\n\n```\n// scala\nobject\
    \ Customer {\n  def create(name: String, address: String, yearsOfCustomer: Int)\
    \ = {\n    if (yearsOfCustomer > 2)\n      new DiscountedCustomer(name, address)\n\
    \    else\n      new Customer(name, address)\n  }\n}\n```\n\nLonghand, we can\
    \ assign the result of the if (remember it’s an expression not not a statement)\
    \ to a val and return the value on the last line.\n\n```\nobject Customer {\n\
    \  def create(name: String, address: String, yearsOfCustomer: Int) = {\n    val\
    \ customer = if (yearsOfCustomer > 2)\n      new DiscountedCustomer(name, address)\n\
    \    else\n      new Customer(name, address)\n    customer\n  }\n}\n```\n\nAnother\
    \ trivial example might be something like this:"
