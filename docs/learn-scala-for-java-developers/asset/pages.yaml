  md: "```\n@ to 9).foreach(i => println(i)) // scala\n```\n\nWe use the method to\
    \ again to create a sequence of numbers. This sequence has the foreach method,\
    \ which we call, passing in a lambda. The lambda function takes an Int and returns\
    \ Unit.\n\nWe can use Scala’s shorthand like we did with Java’s method reference:\n\
    \n```\n@ to 10).foreach(println(_)) // scala\n```\n\n# For-Loop vs For Comprehension\n\
    \nWhat’s the difference between the generator-based loop and the for comprehension?\n\
    The generator-based loop will be converted by the compiler in a call to foreach\
    \ against the collection. A for comprehension will be converted to a call on the\
    \ map. The for comprehension allows the keyword yields to the syntax:\n\n```\n\
    for (i <- 0 to 5) yield i * 2 // results in (0, 2, 4, 6, 8, 10)\n```\n\nSee the\
    \ For Comprehensions chapter for more details.\n\n# Breaking Control Flow (break\
    \ and continue)\n\nScala has no break or continue statements, and generally discourages\
    \ from breaking out of loops. However, you can use a library method to achieve\
    \ the same thing. In Java, you might write something like to break out of a loop\
    \ early:\n\n```\n// java\nfor (int i = 0; i < 100; i++) {\n  System.out.println(i);\n\
    \  if (i == 10)\n    break;\n}\n```\n\nIn Scala, you need to import a Scala library\
    \ class called Breaks. You can enclose the code to break out in a “break” block\
    \ and call the break method to break out. It’s implemented by throwing an exception\
    \ and catching it.\n\n```\n// scala\nimport scala.util.control.Breaks._\nbreakable\
    \ {\n  for (i <- 0 to 100) {\n    println(i)\n    if (i == 10)\n      break()\
    \ // break out of the loop\n  }\n}\n```\n\n# Exceptions\n\nExceptions in Scala\
    \ are handled in the same way as Java. They have all the same schematics in interrupting\
    \ control flow and aborting the program if not dealt with.\\Exceptions in Scala\
    \ extend java.lang.Throwable like their Java counterparts Scala has no concept\
    \ of checked exceptions. All exceptions thrown from existing Java libraries converted\
