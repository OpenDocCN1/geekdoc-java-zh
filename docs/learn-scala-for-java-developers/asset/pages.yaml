  md: '# Monads


    Monads are one of things that people love to talk about but which remain elusive
    and mysterious. If you''ve done any reading on functional programming, you will
    have come across the term.


    Despite all the literature, the subject is often not well understood, partly because
    monads come from the abstract mathematics field of category theory and partly
    because, in programming languages, Haskell dominates the literature. Neither Haskell
    nor category theory are particularly relevant to the mainstream developer and
    bring with them concepts and terminology that can be challenging to get your head
    around.


    The good news is that you don''t have to worry about any of that stuff. You don''t
    need to understand category theory for functional programming. You don''t need
    to understand Haskell to program with Scala.


    # Basic Definition


    A layman''s definition of a monad might be:


    > Something that has map and flatMap functions.


    Isn''t the full story, but it will serve us as a starting point.


    We''ve already seen that collections in Scala are all monads. It''s useful to
    transform them with map and flatten one-to-many transformations with flatMap.
    But map and flatMap do different things using different types of monads.


    # Option


    Let''s take the Option class. You can use Option as a way of avoiding nulls, but
    just how does it avoid nulls and what has it got to do with monads? There are
    two parts to the answer:


    +   1. You avoid returning null by returning a subtype of Option to represent
    no value (None) or a wrapper around a value (Some). As both "no value" and "some
    value" are of type Option, you can treat them consistently. You should never need
    to say "if not null".

    2. How you actually go about treating Option consistently is to use the monadic
    methods map and flat. So Option is a monad.


    Null Object Pattern

    If you''ve ever seen the Null Object pattern, you''ll notice it''s a similar idea.
    The Null Object pattern allows you to replace a type with a subtype to represent
    no value. You can call methods on it as if it were a real value it essentially
    does nothing. It''s substitutable for a real value which usually has no side effects.'
