  md: '# FlatMap


    You’ll often see the flat function where you see the map function. For collections,
    it’s

    very similar in that it maps a function over the collection, storing the result
    in a new

    collection, but with a couple of differences:


    +   - It still transforms but this time the function applies a one-to-many transformation.
    It

    takes a single argument as before but returns multiple values.

    - The result would therefore end up being a collection of collections, so flatMap
    also

    flattens the result to give a single collection.


    So,


    +   - For a collection of A, the map function applies a function to each element

    transforming A to B. The result is a collection of B (i.e. List[B]).

    - For a collection of A, the flatMap function applies a function to each element

    transforming A to a collection of B. This results in a collection of B (i.e. List[List[B]])
    which is flattened to a single collection of B (i.e. List[B]).


    Let’s say we want a mapping function to return a person’s age plus or minus a
    year. If we

    think a person is 38, we return 37, 38, 39.


    ```

    import java.util.Calendar

    def birthYear: Int:List[Int] = {

    val today = Calendar.getInstance(Calendar.YEAR)

    List(today - 1 - birthYear, today - birthYear, today + 1 - birthYear)

    }

    ```


    The signature has changed from the previous example to return a List[Int] rather
    than

    an Int. If we flat the list of birthday years into the map function, we get a
    list of lists

    (see reso below).


    ```

    val birthdays = List(1990, 1977, 1984)

    ```


    ```

    val ages = birthdays.map(age)

    println(ages)

    scala: birthdays.flatMap(age)

    reso: List[List[Int]] =

    List(24, 25, 26), List(37, 38, 39), List(30, 31, 32)

    ```


    If, however, we map the flatMap function, we get a flattened list back. It maps,

    thenattens.


    If you wanted to write your own function of flatMap, it might look something like
    this

    (notice the return type of the function).'
