  md: 'This would return a function which captures the value, and because what''s
    returned is a function, we can just evaluate it, providing a value for the last
    argument (2).


    # $f(1)(2)$


    At this point, both values are in scope and any computation can be applied giving
    the final result.


    I''ve been using a bit of a gorilla notation¹ to get my point across here. Using
    a more mathematically correct notation, we could show the function as being curved
    by creating a new function $a$ and mapping $b$ to $a+b$.


    # $f(a) = (b \mapsto a+b)$


    If you''re familiar with the lambda calculus², you''ll already know that $\lambda
    ab.a+b$ is shorthand for its curved form $\lambda a.(\lambda b.(a+b))$.


    > Closures

    Interestingly, the process of capturing a value and making it available to a second
    function like this is called closure. It''s where we get the term closure when
    referring to anonymous functions or lambdas that capture values.


    # Scala Support for Curried Functions


    A regular uncur function to add two numbers might look like this:


    ```

    def add(x: Int, y: Int): Int = x + y

    ```


    Scala supports curried functions out of the box, so we don''t need to do any manual
    conversion; all we do to turn this into its curved version is to separate the
    arguments using parentheses.


    ```

    def add(x: Int)(y: Int): Int = x + y

    ```


    Scala has two single-argument parameter lists for us. To evaluate the function,
    we''d do the following:


    ```

    scala add(1)(2)

    res1: Int = 3

    ```


    To see it in, we could evaluate the first half like this:


    ```

    scala val f = add(1) _nf: Int => <function1>

    ```


    The underscore gives the REPL a hint about what we''re trying to do. The result
    f is a function from Int. The value 1 has been captured and is available to that
    function. So we can just execute the returned function supplying our second value.


    ```

    scala f(2)

    res2: Int = 3

    ```'
