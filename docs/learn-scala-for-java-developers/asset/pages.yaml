    Derick Jonar\",\"23 Fleetwood Way\"));\n```\n\nType erasure sees the collection\
    \ as containing only Objects. The compiler will ensure that only things of the\
    \ correct type go into the collection and use a cast on the way out. That means\
    \ that anything you take out of it can only be treated as a Customer.\n\nIf you've\
    \ decided to override customer behaviour in the Discountedcustomer, you can treat\
    \ the objects polymorphically and you wouldn't see a problem. If you added methods\
    \ to Discountedcustomer, you can't call them without an unchecked cast.\n\n```\n\
    for (Customer customer : customers) { // some may be DiscountedCustomer\n    total\
    \ will be the discounted total for any DiscountedCustomer\n    System.out.println(customer.getName()\
    \ + \" : \" + customer.total());\n}\n```\n\n```\nDiscountedCustomer customer =\
    \ (DiscountedCustomer) customers.get(0);\nSystem.out.println(customer.getDiscountedAmount());\n\
    ```\n\nTo get around this limitation, you can force generic types to be bound\
    \ to specific types within a class hierarchy. These are bounded types.\n\n# Upper\
    \ Bounds (< extends T>)\n\nWe restrict a generic type using extends or super in\
    \ Java. Set the bounds of that type to be either a subtype or super-class. We\
    \ use extends to ensure the upper bounds and super, the lower bounds. You can\
    \ refer to a class or an interface.\n\nWe've actually created an example of setting\
    \ an upper bound in the Sortable interface we wrote back in the inheritance chapter.\
    \ We created an interface describing generically things that can beable.\n\n```\n\
    // java\npublic interface Sortable<A extends Comparable<A>> extends Iterable<A>\
    \ {\n    default public List<A> sort() {\n        List<A> list = new ArrayList<>();\n\
    \        for (A elements : this) {\n            list.add(elements);\n        }\n\
    \        list.sort((first, second) -> first.compareTo(second));\n        return\
    \ list;\n    }\n    // etc\n```\n\nThis does a couple of things with generics.\
    \ It both defines a generic type A which must be a subclass of Comparable, and\
    \ also says that implementing classes must be able to iterate"
