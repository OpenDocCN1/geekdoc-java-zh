- img_proc: true
  md: "```\nclass FlatMappable[A](elements: A*) {\n  def flatMap[B](f: A => List[B]):\
    \ List[B] = {\n    val result = collection.mutable MutableList[B]()\n    elements.apply(_).foreach\
    \ {\n      result += _\n    }\n    return result.toList\n  }\n}\n```\n\nThe first\
    \ loop will enumerate the elements of the collection and apply the function to\
    \ each. Because this function returns a list, another loop is needed to enumerate\
    \ each of these, adding them to the result collection. This is the bit that flattens\
    \ the function's result.\n\nTo test it, let's start by creating a function that\
    \ gets from an Int to a collection of Int. It gives back all the numbers between\
    \ zero and the argument.\n\n```\ndef oddNumbersTo(end: Int): List[Int] = {\n \
    \ val odds = collection.mutable MutableList[Int]()\n  for (i <- 0 to end) {\n\
    \    if (i % 2 != 0) odds += i\n  }\n  odds.toList\n```\n\nWe just create an instance\
    \ of our class with a few numbers. Call flatMap and you'll see all odd numbers\
    \ from 0 to 1, 0 to 2, and 0 to 10 are collected into a list.\n\n```\nobject Example\
    \ {\n  def main(args: Array[String]) {\n    val mapable = new FlatMappable(1,\
    \ 2, 10)\n    val result = mapable.flatMap(oddNumbersTo)\n    println(result)\n\
    \  }\n}\n```\n\nThe output would be the following:\n\nList(1, 1, 1, 3, 5, 7, 9)\n\
    \n# Not Just Collections\n\nWe've seen how map and flatMap for collections, but\
    \ they also exist on many other classes. More generally, map and flatMap operate\
    \ on what's called monads. In fact, map and flatMap behaviour is one of the defining\
    \ features of monads.\n\nSo just are monads? We'll look at that next."
