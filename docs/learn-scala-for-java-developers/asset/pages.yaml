  md: "```\nthis.name = name;\nthis.address = address;\n}\n```\n\nNow we may want\
    \ to create a helper method to create the new ID in a sequence. To do globally,\
    \ we create a static field to capture a value for the ID and a method to return\
    \ and increment it. We can then just call the method on construction of a new\
    \ instance, assigning its ID to the freshly incremented global ID.\n\n```\n//\
    \ java\npublic class Customer {\n    private static Integer sequenceOfIds;\n\n\
    \    private final String name;\n    private final String address;\n\n    private\
    \ Integer id;\n\n    public Customer(String name, String address) {\n        this.name\
    \ = name;\n        this.address = address;\n        this.id = Customer.nextId();\n\
    \    }\n\n    private static Integer nextId() {\n        return sequenceOfIds++;\n\
    \    }\n}\n```\n\nIt's static because we want to share its implementation among\
    \ all instances to create unique IDs for each.\n\nIn Scala, we'd separate the\
    \ static from non-static members and put the statics in the singleton object and\
    \ the rest in the class. The singleton object is the companion object to Customer.\n\
    \nWe create our class with the two required fields and in the singleton object,\
    \ create the nextId method. Next we create a private var to capture the current\
    \ value, assigning the value of zero so Scala can infer the type as Integer. Adding\
    \ a val means no setter, adding the private modifier means the generated getter\
    \ will be private. We finish off implementing the increment in the nextId method\
    \ and calling it from the primary constructor.\n\n```\n// scala\nclass Customer(val\
    \ name: String, val address: String) {\n    private val id = Customer.nextId()\n\
    }\n```\n\n```\nobject Customer {\n    private var sequenceOfIds = 0\n\n    private\
    \ def nextId(): Integer = {\n        sequenceOfIds += 1\n        sequenceOfIds\n\
    \    }\n}\n```"
