  md: "argument (for what would have been the second argument of the original function).\
    \ Confused? Let's work through an example.\n\nLet's say we have a function $f$\
    \ that takes two arguments, $a$ and $b$, and returns $a + b$.\n\n```\n$f(a, b)\
    \ = a + b$\n```\n\nTo convert this into two functions, each with a single argument,\
    \ first we create a function to take $a$ and give back a new function ($f$).\n\
    \n```\n$f(a) \rightarrow f$\n```\n\nThis new function should itself take a single\
    \ argument, $b$.\n\n```\n$f(a) \rightarrow f(b)$\n```\n\nThat entire function\
    \ should return the result, $a + b$\n\n```\n$f(a) \rightarrow f(b) \rightarrow\
    \ a + b$\n```\n\nWe're left with two functions ($f$ and $f$), each taking a single\
    \ argument.\nWith the pseudo-mathematical notation on the same page, it's worth\
    \ restating my original definition and comparing the original to the curried form\
    \ of the function.\n\n> For a function of two arguments, currying would produce\
    \ a function that takes one argument and returns another function. This returned\
    \ function would also have a single argument (for what would have been the second\
    \ argument of the original function).\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_111_0.png)\n\
    \nFig. 3.1. Original function and steps to arrive at its curried form.\n\nTo evaluate\
    \ the functions of the curried form, we'd evaluate the first function (for example,\
    \ passing in a value 1).\n\n```\n$f(1)$\n```"
