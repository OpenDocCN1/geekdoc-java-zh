    \ + \" is \" + quarter)\n```\n\nThis time works but we've duplicated a fair bit.\n\
    To remove the duplication, we can combine January, February, and March onto one,\
    \ separating them with an or. This means the month can match each January, February,\
    \ or March. In all of these cases, what follows the == will be executed.\n\n```\n\
    case \"January\" | \"February\" | \"March\" => quarter = \"1st quarter\"\n\nDoing\
    \ this for the rest of the cases would give us the following:\n// scala\nobject\
    \ SwitchWithLessDuplication extends App {\nval month = \"August\"\nvar quarter\
    \ = match {\n  case \"January\" | \"February\" | \"March\" => quarter = \"1st\
    \ quarter\"\n  case \"April\" | \"May\" | \"June\" => quarter = \"2nd quarter\"\
    \n  case \"July\" | \"August\" | \"September\" => quarter = \"3rd quarter\"\n\
    \  case \"October\" | \"November\" | \"December\" => quarter = \"4th quarter\"\
    \n  case => quarter = \"unknown quarter\"\n}\nprintln(month + \" is \" + quarter)\n\
    }\n```\n\nWe've condensed the code above by writing expressions within case clauses\
    \ themselves. This becomes more powerful when we think of these case clauses as\
    \ patterns that we can use to build up more and expressive conditions for the\
    \ match.\nJava can only match on primitives, enums and from Java 7, string values.\
    \ Thanks to pattern matching, Scala can match on almost anything, including objects.\
    \ We'll look more at pattern matching in Part III.\nThe other thing to note is\
    \ that Scala's version of the switch is an expression. We're not forced to work\
    \ with side effects and can drop the temporary variable and return a String representing\
    \ the month falls into. We can then change the variable var to a val.\n\n```\n\
    // scala\nobject SwitchExpression extends App {\nval month = \"August\"\nvar quarter\
    \ = match {\n  case \"January\" | \"February\" | \"March\" => quarter = \"1st\
    \ quarter\"\n  case \"April\" | \"May\" | \"June\" => quarter = \"2nd quarter\"\
    \n  case \"July\" | \"August\" | \"September\" => quarter = \"3rd quarter\"\n\
