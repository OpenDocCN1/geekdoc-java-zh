  md: 'You can process them in a similar way to Java 8''s forEach and lambda syntax:


    ```

    list.foreach => println(value)) // scala

    ```


    which is equivalent to the following in Java:


    ```

    list.forEach(value -> System.out.println(value)); // java

    ```


    Like Java 8''s method reference syntax, you can auto-connect the lambda argument
    to the method call.


    ```

    list.foreach(println) // scala

    ```


    which is roughly equivalent to this Java:


    ```

    list.forEach(System.out::println); // java

    ```


    There are lots of Scala-ways to process collections. We''ll look at these later,
    but the most common way to iterate it is a for loop written like this:


    ```

    for (value <- list) println(value)

    ```


    which reads, "for every value in list, print the value". You can also do it in
    reverse:


    ```

    for (value <- list.reverse) println(value)

    ```


    or you might like to break it across multiple lines:


    ```

    for (value <- list) {

    println(value)

    }

    ```


    # Java Interoperability


    I mentioned that you can use any Java class from Scala. For example, let''s say
    we want to create a Java List rather than the usual Scala immutable List.


    ```

    val list = new java.util.ArrayList[String]

    ```


    All we did qualify the class name (java.util.ArrayList) and use new to instantiate
    it. Notice the square brackets? Scala denotes generics using [] rather than <>.
    We also didn''t have to use the parentheses in constructor, as we have no arguments
    to pass in.


    We can make method calls — for example, adding an element — just as you''d expect:


    ```

    list.add("Hello")

    ```


    or, using infix:


    ```

    list add "World!"

    ```


    # Primitive Types


    In Java there are two integer types: the primitive (non-object) int and the Integer
    class. Scala has no concept of primitives — everything is an object — so, for
    example, Scala''s integer type is an Int. Similarly, you''ll be familiar with
    the other basic types:


    +   Byte

    Short

    Int'
