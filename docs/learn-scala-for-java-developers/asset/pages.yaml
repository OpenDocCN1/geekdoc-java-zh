    # Traits vs. Abstract Classes


    There are a couple of differences between traits and abstract classes. The most
    obvious is that traits cannot have constructor arguments. Traits also provide
    a way around the problem of multiple inheritance that you''d see if you were allowed
    to extend multiple classes directly. Like Java, a Scala class can only have a
    single super-class, but mixin as many traits required. Despite this restriction,
    Scala supports multiple inheritance. Kind of.


    Multiple inheritance can cause problems when subclasses inherit behaviour or fields
    from more than one super-class. In this scenario, methods defined in multiple
    places, it is difficult to reason about which implementation should be used. The
    is a relationship breaks down when a type has multiple super-classes.


    Scala allows for a kind of multiple inheritance by distinguishing between the
    class hierarchy and the trait hierarchy. Although you can''t extend multiple classes,
    you can mixin multiple traits. Scala uses a process called linearization to resolve
    duplicate methods in traits. Scala puts all the traits in a line and resolves
    calls to super by going from right to left the line.


    > Does Scala Support Multiple-Inheritance?

    By "inheritance" you mean classic class extension, then Scala doesn''t support
    multiple inheritance. Scala allows only a single class to be "extended". It''s
    the same as Java in that respect. However, if you mean behaviour be inherited
    by other means, then yes, Scala does support inheritance.

    A class can mix behaviour from any number of traits, as Java 8 can mixin behaviour
    from multiple interfaces with default methods. The difference is in how they resolve
    classes. Scala uses linearization to predictably resolve a method call at runtime,
    whereas Java 8 relies on compilation failure.


    Linearization means the order in which traits are defined in a class definition
    is important. For example, we could have the:


    ```

    class Animal

    trait HasWings extends Animal

    trait Bird extends HasWings

    trait FourLegs extends Animal

    ```'
