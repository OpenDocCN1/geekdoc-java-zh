  md: "# Inheritance\n\nIn this chapter we'll look at inheritance in Scala: how you\
    \ create subclasses and override methods, the Scala equivalent of interfaces and\
    \ abstract classes, and the mechanisms Scala offers for mixing in reusable behaviour.\
    \ We'll finish by discussing how to pick between the options.\n\n# Subtype Inheritance\n\
    \nCreating a subtype of another class is the same as in Java. Use the extends\
    \ keyword and you can prevent subclassing with the final modifier on a class definition.\n\
    \nLet's suppose we want to extend the basic customer class from earlier and create\
    \ a special subtype to represent a DiscountedCustomer. A shopping basket might\
    \ belong to the customer super-class, with methods to add items to the basket\
    \ and total its value.\n\n```\n// java\npublic class Customer {\n\n    private\
    \ final String name;\n    private final String address;\n    private final ShoppingBasket\
    \ basket = new ShoppingBasket();\n\n    public Customer(String name, String address)\
    \ {\n        this.name = name;\n        this.address = address;\n    }\n\n   \
    \ public void add(Item item) {\n        basket.add(item);\n    }\n\n    public\
    \ Double total() {\n        return basket.value();\n    }\n}\n```\n\nLet's say\
    \ the DiscountedCustomer is entitled to a 10% discount on all purchases. We can\
    \ extend Customer, creating a constructor to match Customer, and call super in\
    \ it. We then override the total method to apply the discount.\n\n```\n// java\n\
    public class DiscountedCustomer extends Customer {\n\n    public DiscountedCustomer(String\
    \ name, String address) {\n        super(name, address);\n    }\n\n    @Override\n\
    \    public Double total() {\n        return super.total() * 0.90;\n    }\n}\n\
    ```"
