    \n```\ndef add(x: Int, y: Int): Int = x + y  // single expression\ndef add(x:\
    \ Int, y: Int): Int {  // without equals =, Unit is returned\n  x + y\n}\ndef\
    \ min(x: Int, y: Int): Int = {  // last line = return value\n  if (x < y)\n  else\n\
    \    y\ndef min(x: Int, y: Int): Int = {  // don't forget the else\n  if (x <\
    \ y)\n  else\n    \n} // bug!\ndef add(x: Int, y: Int): Int = x + y  // return\
    \ types can be inferred\ndef add(x: Int, y: Int): Int = 2 + x  // default to 2\
    \ if omitted\nval add = (x: Int, y: Int) => Int => x + y  // anonymous function\n\
    add(4, 2)  // call as usual\n```\n\n// convert an anonymous class (Ordering in\
