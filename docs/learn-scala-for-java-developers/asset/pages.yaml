  md: '# Bottom Types


    A new notion to many Java developers will be the idea that a class hierarchy can
    have common bottom types. These are types that are subtypes of all types. Scala’s
    types Null and Nothing are not both bottom types.


    All reference types in Scala are super-types of Null. Null is also an AnyRef object;
    it’s a subclass of every reference type.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_26_0.png)


    Fig. 1.5. The Null extends AnyRef.


    Both value and reference types are super-types of Nothing. It’s at the bottom
    of the class hierarchy and is a subtype of all types.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_26_1.png)


    Fig. 1.6. Nothing extends Null.


    The entire hierarchy is shown in the diagram below. I’ve left off scala.Any to
    save space. Notice that Null extends all reference types and that Nothing extends
    all types.'
