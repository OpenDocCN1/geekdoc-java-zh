    \ in primary constructor\n\n| | val x | var x | private val | private var |\n\
    |---|---|---|---|--|\n| Getter (x()) | Y (public) | Y (public) | N/A Y (private)\
    \ | Y (private) |\n| Setter (x_=(y)) | N | Y (public) | N/A N | Y (private) |\n\
    \nAs you can see, this is consistent with the table we saw earlier. Getters are\
