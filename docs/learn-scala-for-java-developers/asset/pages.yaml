  md: '# Installing Scala


    There are a couple of ways to get started with Scala.


    +   1. You can run Scala interactively with the interpreter,

    2. run shorter programs as shell scripts, or

    3. compile programs with the scalac compiler.


    # The Scala Interpreter


    Before working with an IDE, it''s probably worth getting familiar with the Scala
    interpreter, or REPL.


    Download the latest Scala binaries (from http://scala-lang.org/downloads) and
    extract the archive. Assuming you have Java installed, you can start using the
    interpreter from a command prompt or terminal window straight away. To start up
    the interpreter, navigate to the exploded folder and type¹:


    ```

    bin/scala

    ```


    You''ll be faced with the Scala prompt.


    ```

    scala> _

    ```


    You can type commands followed by enter, and the interpreter will evaluate the
    expression and print the result. It reads, evaluates and prints in a loop so it''s
    known as a REPL.'
  merge: -1
