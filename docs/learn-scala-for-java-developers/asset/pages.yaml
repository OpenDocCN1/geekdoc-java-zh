    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_142_0.png)


    # Milestone 1: OO in Scala


    When you first start, you can expect getting up to speed with the language to
    be a fairly steep incline.


    “Steep” but also “short”: it''s not difficult to get to the first plateau, so
    you can expect a relatively quick increment in learning.


    You''ll probably sit here for a bit applying what you''ve learnt. I see this as
    the first milestone: to be able to build object-oriented or imperative applications
    using languagespecific constructs and features, but without necessarily adopting
    functional programming. It''s just like learning any other language in the Java
    / C family.


