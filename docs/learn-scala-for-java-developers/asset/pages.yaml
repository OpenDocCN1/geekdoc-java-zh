    Scala has ported the idea of JavaDoc and creatively called it ScalaDoc. Adding
    ScalaDoc

    to your Scala source works similarly to adding JavaDoc, and is done with markup
    in

    comments. For example, the following fragment in source code:


    ```

    /** Returns `true` if this value is equal to x, `false` otherwise. */

    def ==(x: Byte): Boolean

