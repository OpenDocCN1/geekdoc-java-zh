  md: "# Using Default Values\n\nScala has language support for default values on\
    \ method signatures, so we could have written this just using parameters on the\
    \ class definition, and avoided the extra constructor. We'd just default the value\
    \ for initial to be an empty string. To make the implementation handle empty strings\
    \ well, we could put some logic in the primary constructor like before.\n\n```\n\
    class Customer(forename: String, initial: String = \"\", surname: String) {\n\
    \  val fullname = if (initial = null && !initial.isEmpty)\n    forename + \" \"\
    \ + initial + \" \" + surname\n  else\n    forename + \" \" + surname\nn}\n```\n\
    \nWhen calling it, we may need to name default values; for example:\n\n```\nnew\
    \ Customer(\"Bob\", \"J\", \"Smith\")\n```\n\n\"Bob\", \"J\", \"Smith\" is ok,\
    \ but if we skip the initial variable, we'd need to name the surname variable\
    \ like this:\n\n```\nnew Customer(\"Bob\", surname = \"Smith\")\n```\n\n# Singleton\
    \ Objects\n\nIn Java you can enforce a single instance of a class using the singleton\
    \ pattern. Scala has made this idea as a feature of the language: as well as classes,\
    \ you can define (singleton) objects.\n\nThe downside is that when we talk about\
    \ \"objects\" in Scala, we're overloading the term. We might mean an instance\
    \ of a class (for example, a new ShoppingCart()), of which there could be many\
    \ or we might mean the one and only instance of a class; that is, a singleton\
    \ object.\n\nA typical use-case for a singleton in Java is if we need to use a\
    \ single logger instance across an entire application.\n\n```\n// java\nLogger.getLogger(\"\
    example\").log(\"Everything is fine.\")\n```"
