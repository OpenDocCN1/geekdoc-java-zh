  md: "The main difference is that the methods you can call, defined by the instance's\
    \ super-type, are usually business methods. The common methods of a monad are\
    \ map and flatMap are lower level, functional programming abstractions.\n\nWe\
    \ know what map and flatMap for collections, but what do they do for an Option?\n\
    \n# The map Function\n\nThe map function still transforms an object, but it's\
    \ an optional transformation. It will apply the mapping function to the value\
    \ of an option, if it has a value. The value and no value options are implemented\
    \ as subclasses of Option: Some and None respectively.\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_127_0.png)\n\
    \nFig. 3.3. The Option classes.\n\nA mapping only applies if the option is an\
    \ instance of Some. If it has no value (i.e., it's an instance of None), it will\
    \ simply return another None.\n\nThis is useful when you want to transform something\
    \ but not worry about checking if it's null. For example, we might have a customers\
    \ trait with repository methods add and find. What should we do in implementations\
    \ of find when a customer doesn't exist?\n\n```\ntrait Customers extends Iterable[Customer]\
    \ {\n  def add(Customer: Customer)\n  def find(name: String): Customer\n}\n```\n\
    \nA typical Java implementation would likely return null or throw some kind of\
    \ NotFoundException. For example, the following Set-based implementation returns\
    \ a null if the customer cannot be found:\n\n```\nclass CustomerSet extends Customers\
    \ {\n  private val customers = mutable.Set[Customer]()\n\n  def add(customer:\
    \ Customer) = customers.add(customer)\n```\n\n*"
