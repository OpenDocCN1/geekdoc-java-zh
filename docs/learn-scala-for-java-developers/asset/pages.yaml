  md: "Luckily, we can coerce Scala into converting lambda into an instance of Ordering\
    \ using an implicit conversion. All we need to do is create a converting method\
    \ that takes a lambda or returns an Ordering, and mark it implicit. The implicit\
    \ keyword tells Scala to use this method to convert one to the other otherwise\
    \ things wouldn't compile.\n\n```\n// scala\nimplicit def toOrdering[A](f: A,\
    \ A) => Int): Ordering[A] = {\n  new Ordering[A] {\n    def compare(a: A, b: A)\
    \ = f.apply(a, b)\n  }\n```\n\nThe signature takes a function and returns an Ordering[A].\
    \ The function itself has two arguments and returns an Int. So our conversion\
    \ method is expecting a function with two arguments of type A, returning an Int\
    \ ((A, A) => Int).\n\nNow we can supply a literal to the sorted method that would\
    \ otherwise compile. As long as the function conforms to the (A, A) => Int signature,\
    \ the compiler will detect that it is converted to something that compiles and\
    \ call our implicit method to do. We can then modify the sort method of CustomersSortBySpend\
    \ like this:\n\n```\n// scala\nthis.list.sorted((a: Customer, b: Customer) =>\
    \ b.total.compare(a.total))\n```\n\n...passing in a lambda rather than an anonymous\
    \ class. It's very similar to the equivalent of the Java version below.\n\n```\n\
    // java\nlist.sort((first, second) -> first.compareTo(second));\n```\n\n# ## Concrete\
    \ Fields on Traits\n\nWe've looked at default methods on traits, but Scala also\
    \ allows you to provide default values. You can specify fields in traits.\n\n\
    ```\n// scala\ntrait Counter {\n  var count = 0\n  def increment()\n}\n```\n\n\
    Here, count is a field on the trait. All classes that extend counter will have\
    \ their own instance of count copied in. It's not inherited — it's a value specified\
    \ by the trait as required and supplied for by the compiler. Subtypes are provided\
    \ with the field by the compiler and it's initialized (based on the value in the\
    \ trait) on construction.\n\nFor example, count is magically available to the\
    \ class below and we're able to increment it in the method.\n\n```\n// scala\n\
    class IncrementBy extends Counter {\n  override def increment(): Unit = count\
    \ += 1\n}\n```"
