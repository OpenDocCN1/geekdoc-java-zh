  md: "}\n}\n\nThe singleton object is a companion object because it has the same\
    \ name and lives in the same source file as its class. This means the two have\
    \ a special relationship and can access each other's private members. That's the\
    \ Customer object can define the nextId method as the Customer class can still\
    \ access it.\n\nIf you name the object differently, you wouldn't have this special\
    \ relationship and wouldn't be able to call the method. For example, the class\
    \ CustomerX object is not a companion object to Customer and so you can't see\
    \ the private nextId method.\n\n```\n// scala\nclass Customer(val name: String,\
    \ address: String) {\n  private val id = CustomerX nextId() // compiler failure\n\
    }\n```\n\n```\nobject CustomerX {\n  private var sequenceFids = 0\n\n  private\
    \ def nextId(): Integer = {\n    sequenceFids += 1\n    sequenceFids\n  }\n```\n\
    \n# Other Uses for Companion Objects\n\nWhen methods don't depend on any of the\
    \ fields in a class, you can more accurately think of them as functions. Functions\
    \ generally belong in a singleton object rather than a class, so one example of\
    \ when to use companion objects is when you want to distinguish between functions\
    \ and methods, but keep related functions to the class they relate to.\nAnother\
    \ reason to use a companion object is for factory-style methods — methods that\
    \ create instances of the class companion. For example, you might want to create\
    \ a factory method that creates an instance of your class with less noise. If\
    \ we want to create a factory for Customer, we can do so like:\n\n```\n// scala\n\
    class Customer(val name: String, address: String) {\n  val id = Customer.nextId()\n\
    }\n```\n\n```\nobject Customer {\n  def apply(name: String, address: String) =\
    \ new Customer(name, address)\n}\n```\n\nThe apply method affords a shorthand\
    \ notation for a class or object. It's kind of the default method for a class,\
    \ so if you don't call a method directly on an instance, but instead the arguments\
    \ of an apply method, it'll call it for you. For example, you can call:\nCustomer.apply(\"\
    Bob Fossil\", \"1 London Road\")\n\n...or you can drop the apply and Scala will\
    \ look for an apply method that matches your argument. The two are identical."
