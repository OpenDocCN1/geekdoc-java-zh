    \ trait（特征）来约束。\n\n使用多重边界在 Java 中表达约束的另一种方法是显式声明 `A` 必须扩展 `Animal` 且是 `Comparable`：\n\
    \n```java\n// java\npublic static <A extends Animal & Comparable<?>> void sort(List<A>\
    \ l) { }\n```\n\n这在 Java 中设置了两个边界。在 Scala 中无法设置两个上界，但通过指定边界也扩展 trait 可以实现相同的效果：\n\
    \n```scala\n// scala\ndef sort[A <: Animal with Comparable[[]]](list: List[A])\
    \ { }\n```\n\n由于我们更加显式，在调用 `sort` 方法时可以移除类型提示。\n\n```scala\nvar enclosure = List[Lion]()\n\
    enclosure = new Lion + enclosure\nsort(enclosure)\n```\n\n在 Scala 中，你可以使用 `>`\
    \ 和 `<` 设置下界和上界：\n\n```scala\ndef example[A > Lion](a: A) = () // scala\nlower\
    \ upper\n```\n\n...其中 `A` 必须是 `Lion` 的父类型且是 `Animal` 的子类型。\n\n## 变体（Variance）\n\
    \n如果没有泛型，扩展 `A` 的泛型类 `B` 可以赋值给 `A` 的实例；毕竟子类化只在一个方向上；反之则得到编译器错误。\n\n![](img/cbf3f72fffa2b960cf12bcdbbca_97_0.png)\n\
    \n图 2.9. B extends A。\n\n```java\n// java\nA a = new A();\nB b = new B();\na =\
    \ b;\n```\n\n> // 编译器错误\n```\n\n然而，泛型类本身并不因为其参数化类型就是子类。因此，如果 `B` 是 `A` 的子类，那么\
    \ `List<B>` 应该是 `List<A>` 的子类吗？在 Java 中，尽管它们的参数化类型是子类，`List<B>` 并不是 `List<A>`\
    \ 的子类。\n\n![](img/cbf3f72fffa2b960cf12bcdbbca_98_0.png)\n\na = b; // 编译器错误\n\n\
    这就是变体出现的地方。变体描述了泛型类型（如列表或“容器”类型）的子类与其参数化类型子类之间的关系。\n\n变体描述了三种子类关系：\n\n1. 不变（Invariant）\n\
    2. 协变（Covariant）\n3. 逆变（Contravariant）\n\n## 不变\n\n不变性意味着即使参数化类型具有子类关系，泛型类型之间也没有关系。你不能用一个替代另一个。Java\
    \ 和 Scala 在方法和变量中使用不变性。这里的语法使用尖括号 `<>`（Java）或方括号 `[]`（Scala）将类型描述为不变。\n\n```java\n\
    public class List<T> { } // java\nclass List[T] { } // scala\n```\n\n## 协变\n\n\
    协变泛型类型在参数化类型为子类时保留两个泛型类型之间的子类关系。因此，当泛型类型向上转换时，`List<B>` 是 `List<A>` 的子类。Java 支持协变，但\
    \ Scala 在定义泛型类时通过 `+` 支持泛型类型。\n\n```scala\nclass List[+T] { }\n```\n\n## 逆变\n\n\
    逆变反转了子类关系。如果 `A` 是逆变的，那么 `List<A>` 也是 `List<B>`；泛型类型的参数化类型关系被反转了。Java 支持，但在 Scala只需在泛型类型定义中添加\
    \ `-`。\n\n```scala\nclass List[-T]\n```\n\n## 变体总结\n\n总结来说，无论参数化类型的关系如何，不变泛型类型都是无关的。协变类型维持参数化类型的子类关系，而逆变类型反转它。\n\
    \n| 描述 | |\n| --- | --- |\n| 不变 | `List<A>` 和 `List<B>` 无关 [A] |\n| 协变 | `List<B>`\
    \ 是 `List<A>` 的子类 [+A] |\n| 逆变 | `List<A>` 是 `List<B>` 的子类 [-T] |\n\n各部分的语法总结如下：\n\
    \n| 不变 | 协变 | 逆变 |\n| --- | --- | --- |\n| Java | `<T>` | `<? extends T>` | `<?\
    \ super T>` |\n| Scala | `[T]` | `[T]` | `[-T]` |\n| Scala (通配符) | `[T]` | `[_\
    \ <: T]` | `[_ >: T]` |\n\n"
