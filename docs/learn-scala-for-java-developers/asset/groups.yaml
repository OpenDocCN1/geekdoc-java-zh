- md: "\nWe do exactly the same thing in Scala. Here’s the basic Customer class:\n\
    \n```scala\n// scala\nclass Customer(val name: String, val address: String) {\n\
    \  private val basket: ShoppingBasket = new ShoppingBasket\n\n  def add(item:\
    \ Item) {\n    basket.add(item)\n  }\n\n  def total: Double = {\n    basket.value\n\
    \  }\n}\n```\n\nWhen it comes to extending Customer to DiscountedCustomer, there\
    \ are a few things to consider. First, we'll create the DiscountedCustomer class.\n\
    \nIf we try and extend Customer to create DiscountedCustomer, we get a compiler\
    \ error\n\n\n\nWe get a compiler error because we need to call the Customer constructor\
    \ with values for its arguments. We had to do the same thing in Java when we called\
    \ super in the new constructor.\n\nScala has a primary constructor and auxiliary\
    \ constructors. Auxiliary constructors must be chained to eventually call the\
    \ primary constructor and in Scala, only the primary constructor can call the\
    \ super-class constructor. We can add arguments to the primary constructor like:\n\
    \n```scala\nDiscountedCustomer(name: String, address: String) extends Customer\n\
    ```\n\nBut we can’t call super directly like we can in Java.\n\n```scala\nDiscountedCustomer(val\
    \ name: String, val address: String)\n  extends Customer {\n  super(name, address)\
    \ // compiler error\n}\n```\n\nIn Scala, to call the super-class constructor you\
    \ pass the arguments from the primary constructor to the super-class. Notice that\
    \ the arguments to discountedCustomer aren’t set as val. They are not fields;\
    \ they’re locally scoped to the primary constructor and passed directly to the\
    \ super-class.\n\n```scala\nDiscountedCustomer(name: String, address: String)\n\
    \  extends Customer(name, address)\n```\n\nFinally, we can implement the discounted\
    \ total method in the subclass.\n\n```scala\noverride def total: Double = {\n\
    \  super.total * 0.90\n}\n```\n\nThere are two things to note here: the override\
    \ keyword is required, and to call the super-classes total method, we use super\
    \ and a dot, just in Java.\n\nThe override keyword is the @override annotation\
    \ in Java. It allows the compiler to check for mistakes like misspelling the name\
    \ of the method or providing the wrong arguments. The real difference between\
    \ the Java annotation and Scala's is that it's mandatory in Scala when you override\
    \ non-abstract methods.\n\n# Anonymous Classes\n\nYou create anonymous subclasses\
    \ in a similar way to Java.\n\nIn the Java version of the ShoppingBasket class,\
    \ the add method takes an Item interface. So to add an item to your shopping basket,\
    \ you could create an anonymous subtype of Item. Below, we've created a program\
    \ to add two fixed-price items to Joe's basket. Each item is an anonymous subclass\
    \ of Item. The basket total discount would be $5.40.\n\n```java\n// java\npublic\
    \ class ShoppingBasket {\n    private final Set<Item> basket = new HashSet<>();\n\
    \n    public void add(Item item) {\n        basket.add(item);\n    }\n\n    public\
    \ Double value() {\n        return basket.stream().mapToDouble(Item::price).sum();\n\
    \    }\n}\n// java\npublic class TestDiscount {\n    public static void main(String...\
    \ args) {\n        Customer joe = new DiscountCustomer(\"Joe\", \"128 Bullpen\
    \ Street\");\n        joe.add(new Item() {\n            @Override\n          \
    \  public Double price() {\n                return 2.5;\n            }\n     \
