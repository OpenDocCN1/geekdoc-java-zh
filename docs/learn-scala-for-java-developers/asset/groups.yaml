  - '[PAGE 99]


    # Invariance


    Java only supports one of the three for its generic types: all generic types in
    Java are invariant which is why we can''t assign a List<B> to a List<A> above.
    Invariant generic types don''t preserve the subtype relationship of their parametrised
    types.


    However, you can vary the parametrised types when you use wildcards with methods
    and variables.


    The invariant relationship between generic types says that there is no relationship
    even if their contents have a subtype relationship. You can''t substitute one
    for another. Java and Scala syntax here, as defining any generic type in chevrons
    (Java) or square brackets (Scala) describes the type as invariant.


    ```

    public class List<T> { } // java

    class List[T] { } // scala

    ```


    # Covariance


    Covariant generic types preserve the relationship between two generic types as
    subtypes when their parametrised types are subtypes. So List<B> is a subtype of
    List<A> when a generic type is up cast. Java doesn''t support covariance. Scala
    supports covariant generic types by using a + when you define a generic class.


    ```

    class List[T] { }

    ```


    # Contravariance


    Contravariance reverses a subtype relationship. If A is contravariant, List<A>
    is also a List<B>; it''s a subtype. The relationship of the parametrised types
    are reversed for their generic types. Java doesn''t support contravariant but
    in Scala you just add a - - to the generic type definition.


    ```

    class List[-T]

    ```


    # Variance Summary


    In summary, invariant generic types are not related, regardless of the relationship
    of their parametrised types. Covariant types maintain the subtype relationship
    of their parametrised types, and contravariant types reverse it.


    | Description | |

    | --- | --- |

    | Invariant | List<A> and List<B> are not related [A] |

    | Covariant | List<B> is a subclass of List<A> [+A] |

    | Contravariant | List<A> is a subclass of List<B> [-T] |


    The syntax for each is summarised below.


    | Invariant | Covariant | Contravariance |

    | --- | --- | --- |

    | Java | <T> | <? extends T> | <? super T> |

    | Scala | [T] | [+T] | [-T] |

    | Scala (wildcards) | [T] | [_ <: T] | [_ >: T] |'
- md: "\n# Java Limitations\n\nIn Java all generic types are invariant, which means\
    \ you can't assign a List<Foo> to a List<Object>. You can vary the types where\
    \ you use them with wildcards, but only for methods and variable definitions,\
    \ not classes.\n\n# III. BEYOND JAVA TO SCALA\n\nThis part of the book is all\
    \ about the differences between Scala and Java. There are plenty of language features\
    \ in Scala that don't have an obvious analog in Java. In this part, we'll take\
    \ a closer look at those and explore what Scala can give us over Java.\n\nSpecifically,\
    \ we'll explore some of the language features that make writing Scala more expressive\
    \ and we'll look at some of the more functional programming idioms that Scala\
    \ is so well for.\n\n# Expressive Scala\n\nScala offers several features that\
    \ make writing code more concise. As well as some we've already seen, it provides\
    \ mechanisms to:\n\n- * Methods look like functions using the special case apply\
    \ method.\n- Provide default behaviour for the assignment operator using a special\
    \ case update method.\n- * Make regular method calls look like language structures,\
    \ which in effect means you can define your own control structures.\n\nScala also\
    \ offers pattern matching; we'll look at the unapply method and its role in pattern\
    \ matching.\n\n# Functional Programming Idioms\n\nWe'll also look at some of functional\
    \ programming aspects of Scala.\n\n- * Built-in methods for mapping values (map,\
    \ flatMap).\n- What Monads are and why you should care.\n- The Option class as\
    \ a way of avoiding null checks.\n- Chaining monad calls.\n- For comprehensions\
    \ and how they work under the hood.\n\nThis only scratches the surface of functional\
    \ programming but I hope that this part of the book will give you a useful head\
    \ start when it comes to Scala and functional programming.\n\n# Faking Function\
    \ Calls\n\nScala provides mechanisms to make method calls look like regular function\
    \ calls. It uses special case apply and update methods to allow a kind of shorthand\
    \ call notation that can remove the clutter of your code.\n\n# The apply Method\n\
    \nThe apply method provides a shorthand way of calling a method on a class. So,\
    \ as we saw, you can use them as factory-style creation methods, where given some\
    \ class such as our old friend Customer:\n\n```\nclass Customer(name: String,\
    \ address: String)\n...you can add an apply method to its companion object.\n\
    object Customer {\n  def apply(name: String, address: String) = new Customer(name,\
    \ address)\n}\n```\n\nYou can then call the method directly, or drop the apply\
    \ part, at which point Scala will look for an apply method that matches your argument\
    \ list and call it.\n\n```\nCustomer.apply(\"Bob Fossil\", \"1 London Road\")\n\
    Customer(\"Bob Randal\", \"14 Arches\")\n```\n\nYou can also have multiple apply\
    \ methods. For example, we could create another method to default the default\
    \ address of our customer.\n\n```\ndef apply(name: String) = new Customer(name,\
    \ \"No known address\")\nCustomer(\"Cuthbert Colbert\")\n```\n\nYou don't have\
    \ to use apply methods as factory methods though. Most people end up using them\
    \ to make their class APIs more succinct. This is the key to how Scala can make\
    \ APIs more expressive. If it makes sense a default behaviour of your class is\
    \ to create an instance, fine, but you can also make other methods look like function\
    \ calls using.\n\nSo far, we've been using an apply method on a singleton object\
    \ (object Customer) and dropping the apply, but you can have apply methods on\
    \ a class and call them on an instance variable.\n\nFor example, we could create\
    \ a class called Adder and call the apply method on an instance to add two numbers\
    \ together.\n\n```\nval add = new Adder()\nadd.apply(1, 3)\n```\n\nBut we can\
    \ just drop it and it'll look like we're calling a function even though we're\
    \ actually calling a method on an instance variable.\n\n```scala\nval add = new\
    \ Adder()\nadd(1, 3)\n```\n\nAnother example is accessing array values. Suppose\
    \ we have an array of Roman numerals.\n\n```\nnumerals = Array(\"I\", \"II\",\
    \ \"III\", \"IV\", \"V\", \"VI\", \"VII\")\n```\n\nTo access the array using an\
    \ index, the syntax is to use parentheses rather than square brackets.\n\n```\n\
    numerals(5) // yields \"VI\"\n```\n\nUsing the index in the loop, we could do\
    \ something like this to print the entire array:\n\n```\nfor (i <- 0 to numerals.length\
    \ - 1)\n  println(i + \" \" + numerals(i))\n```\n\nWhat's interesting is that\
    \ there is an apply method on array that takes an Int. So we could have written\
    \ it like this:\n\n```\nnumerals.apply(5) // yields \"VI\"\n\nfor (i <- 0 to numerals.length\
    \ - 1)\n  println(i + \" = \" + numerals(i))\n```\n\nWhat looks like language\
    \ syntax to access an array is actually a method call.\n\n# The update Method\n\
    \nAssignment works just the same way. For example, numerals(2) = \"III\" actually\
    \ calls a special method on Array. Scala sees the assignment operator and can\
    \ find an update method with appropriate arguments, it translates the assignment\
    \ to a method call.\n\nWe can apply this idea to our classes to make API feel\
    \ more like language syntax. We can create a class to contain our directory of\
    \ phone numbers:\n\n```\nclass Directory {\n  val numbers = scala.mutable.Map(\n\
    \    \"Athos\" -> \"7781456782\",\n    \"Aramis\" -> \"778123422\",\n    \"Porthos\"\
    \ -> \"778134283\",\n    \"Artagnan\" -> \"7715632982\"\n  )\n\n  def apply(name:\
    \ String) = numbers.get(name)\n\n  def update(name: String, number: String) {\n\
    \    numbers(name) = number\n  }\n}\n```\n\nIf we decide the default behaviour\
    \ of the directory to return the phone number, we can implement the apply method\
    \ as follows:\n\n```\ndef apply(name: String) = {\n  numbers.get(name)\n}\n```\n\
    \nThat way, after creating an instance of our directory, we can print Anthos's\
    \ number:\n\n```\nvar yellowPages = new Directory()\nprintln(\"Anthos's number:\
    \ \" + yellowPages(\"Anthos\"))\n```\n\nIf we want to update a number, we could\
    \ implement an update method and call it directly. Scala's shorthand means that\
    \ if we name our update method, we can use the assignment operator and it will\
    \ call the method for us.\n\n```\ndef update(name: String, number: String) {\n\
    \  numbers.update(name, number)\n}\n```\n\nThen we can call it to update a number\
    \ like this:\n\n```\nyellowPages.update(\"Athos\", \"Unlisted\")\n```\n\nTaking\
    \ advantage of the shorthand notation, you can also use assignment:\n\n```\nyellowPages(\"\
    Anthos\") = \"Unlisted\"\n```\n\n# Multiple update Methods\n\nWe could add a second\
    \ update method, this time with an Int as the first argument.\n\n```\ndef update(areaCode:\
    \ Int, newAreaCode: String) = {\n  ???\n}\n```\n\nLet's say we want to update\
    \ an area code across all entries. We could enumerate each entry to work out which\
    \ numbers start with the area code from the first argument. For any match, we\
    \ go back to the original map and update the entry:\n\n```\ndef update(areaCode:\
    \ Int, newAreaCode: String) = {\n  numbers.forEach(entry => {\n    if (entry._2.startsWith(areaCode.toString))\
    \ {\n      numbers(entry._1) = entry._2.replace(areaCode.toString, newAreaCode)\n\
    \    }\n  })\n}\n```\n\nThe _1 and _2 are Scala notation for what's called a tuple.\
    \ In our case, it would be a simple structure that we're using to treat Map.Entry\
    \ in Java as a single variable. The _1 and _2 are method calls that let us access\
    \ the key and value respectively. We're using a tuple of two elements (Tuple2)\
    \ but you can have tuples up to twenty-two elements (Tuple22).\n\nWe can call\
    \ the update method using the shorthand assignment syntax like this:\n\n```\n\
    object DirectoryAlternativeUpdateMethod extends App {\n  var yellowPages = new\
    \ Directory()\n  println(yellowPages)\n\n  yellowPages(7781) = \"7555\"\n  println(yellowPages)\n\
    }\n```\n\nThe outcome of this is that Anthos and Aramis will have their area codes\
    \ updated.\n\n# Multiple Arguments to update\n\nYou can have many arguments in\
    \ the update method as you like but only the last will be used as the updated\
    \ value. This makes sense, as you can only have one value to the right of an assignment\
    \ operator.\n\nThe rest of the argument list is used to select the appropriate\
    \ update methods. So if you had another method with three arguments (areaCode,\
    \ anotherArgument and newAreaCode):\n\n```\ndef update(areaCode: Int, another:\
    \ String, newAreaCode: String) = ???\n```\n\n...the types would be used to work\
    \ out which update method should be called on assignment.\n\n```\nyellowPages(7998)\
    \ = \"7668\"\nyellowPages(7998, \"another argument\") = \"???\"\n```\n\n# Summary\n\
    \nWe've seen more about the apply method in this chapter; how you don't just use\
    \ it for factory-style creation methods but for building rich APIs. You can make\
    \ client code more concise by making method calls look like function calls.\n\n\
    We also saw how the related update method works and in the same way how we can\
    \ write APIs that take advantage of the assignment operator and implement custom\
    \ update behaviour.\n"
  mdcn: "\n\n# Java 的局限性\n\n在 Java 中，所有的泛型都是是不变的（invariant），这意味着你不能将一个 `List<Foo>`\
    \ 赋值给 `List<Object>`。你可以使用通配符在使用类型的地方更改类型，但仅适用于方法和变量定义，而不适用于类。\n\n# III. 跨越 Java\
    \ 到 Scala\n\n书的这部分主要介绍 Scala 和 Java 之间的区别。Scala 中有很多语言特性在 Java 中没有明显的对应物。在这一部分，我们将仔细观察这些特性，并探索\
    \ Scala 比 Java 为我们提供了什么。\n\n具体来说，我们将探索一些让 Scala 编写更具表现力的语言特性，并查看 Scala 非常擅长的函数式编程范式。\n\
    \n# 表现力 Scala\n\nScala 提供了许多让代码编写更简洁的特性。除了我们已经见过的的一些外，它还提供了机制来实现：\n\n- * 使用特殊的\
    \ `apply` 方法让方法看起来像函数。\n- 使用特殊的 `update` 方法为赋值运算符提供默认行为。\n- * 让普通的方法调用看起来像像语言结构，这意味着实际上你可以定义自己的控制结构。\n\
    \nScala 还提供了模式匹配（pattern matching）；我们将查看 `unapply` 方法及其在模式匹配中的作用。\n\n# 函数式编程范式\n\
