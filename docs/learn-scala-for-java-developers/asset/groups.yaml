    # ScalaDoc


    Scala 移植了 JavaDoc 的概念，并创造性地将其命名为 ScalaDoc。在 Scala 源码中添加 ScalaDoc 与添加 JavaDoc 类似，通过注释中的标记完成。例如，源码中的以下片段：


