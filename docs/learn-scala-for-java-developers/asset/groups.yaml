    \  }\n}\n```\n\n```\ndef map[B](f: A => B): List[B] = ...\n```\n\nThen it's just\
    \ a question of creating a new collection, calling the function (using apply)\
    \ with each element as the argument. We'd store the result to the new collection\
    \ and finally return it.\n\n```\nclass Mappable[A](val elements: List[A]) {\n\
    \  def map[B](f: A => B): List[B] = {\n    val result = collection.mutable.MutableList()\n\
    \    elements.foreach {\n      result += f.apply(_)\n    }\n    result.toList\n\
    \  }\n}\n```\n\nWe can test it by creating a list of numbers, making them “mappable”\
    \ by creating a mappable instance.\n\n```\nobject Example {\n  def main(args:\
    \ Array[String]) {\n    val birthdays = List(1990, 1977, 1984, 1961, 1973)\n \
    \   val result = birthdays.map(age)\n    println(result)\n  }\n}\n```\n\nWait,\
