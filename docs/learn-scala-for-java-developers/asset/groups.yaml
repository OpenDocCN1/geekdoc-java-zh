- md: "\n```scala\n(0 to 5).foreach { i =>\n  (0 to 5).foreach { j =>\n    println(i\
    \ + \" \" + j)\n  }\n}\n```\n\nIf you do a for with a yield (a for comprehension)\
    \ the compiler does something different:\n\n```scala\nfor (i <- 0 to 5) yield\
    \ {\n  i + 2\n}\n```\n\nThe yield is about returning a value. A for without a\
    \ yield, although an expression, will return Unit. This is because foreach method\
    \ returns Unit. A for with a yield will return whatever is in the yield block.\
    \ It's converted into a call to map rather than foreach. So, the desugared form\
    \ of the above would look like this:\n\n```scala\nde-sugared form of \"for (i\
    \ <- 0 to 5) yield i + 2\"\n(0 to 5).map(i => i + 2)\n```\n\nIt's mapping a sequence\
    \ of numbers (0 to 5) into another sequence of numbers (2 to 7). It's important\
    \ to realise that whatever is in the yield block represents the function's passed\
    \ into map. The map itself operates on whatever is in the for part (i.e., for\
    \ i <- 0 to 5). It is easier to recognise how we reformat the example like this:\n\
    \n```scala\nfor {\n  i <- 0 to 5            // operates on this collection\n \
    \ yield {\n    i + 2                 // the function to pass into map\n  }\n}\n\
    ```\n\nIt gets more interesting when we have nesting between the parentheses and\
