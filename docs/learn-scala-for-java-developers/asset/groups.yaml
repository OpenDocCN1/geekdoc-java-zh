    \ don't have to worry about any of that stuff. You don't need to understand category\
    \ theory for functional programming. You don't need to understand Haskell to program\
    \ with Scala.\n\n# Basic Definition\n\nA layman's definition of a monad might\
    \ be:\n\n> Something that has map and flatMap functions.\n\nIsn't the full story,\
    \ but it will serve us as a starting point.\n\nWe've already seen that collections\
    \ in Scala are all monads. It's useful to transform them with map and flatten\
    \ one-to-many transformations with flatMap. But map and flatMap do different things\
    \ using different types of monads.\n\n# Option\n\nLet's take the Option class.\
    \ You can use Option as a way of avoiding nulls, but just how does it avoid nulls\
    \ and what has it got to do with monads? There are two parts to the answer:\n\n\
    1. You avoid returning null by returning a subtype of Option to represent no value\
    \ (None) or a wrapper around a value (Some). As both \"no value\" and \"some value\"\
    \ are of type Option, you can treat them consistently. You should never need to\
    \ say \"if not null\".\n2. How you actually go about treating Option consistently\
    \ is to use the monadic methods map and flat. So Option is a monad.\n\n### Null\
    \ Object Pattern\n\nIf you've ever seen the Null Object pattern, you'll notice\
    \ it's a similar idea. The Null Object pattern allows you to replace a type with\
    \ a subtype to represent no value. You can call methods on it as if it were a\
    \ real value; it essentially does nothing. It's substitutable for a real value\
    \ which usually has no side effects.\n\nThe main difference is that the methods\
    \ you can call, defined by the instance's super-type, are usually business methods.\
    \ The common methods of a monad like map and flatMap are lower level, functional\
    \ programming abstractions.\n\nWe know what map and flatMap for collections, but\
    \ what do they do for an Option?\n\n# The map Function\n\nThe map function still\
    \ transforms an object, but it's an optional transformation. It will apply the\
    \ mapping function to the value of an option, if it has a value. The value and\
    \ no value options are implemented as subclasses of Option: Some and None respectively.\n\
    \n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_127_0.png)\n\nFig. 3.3. The Option\
