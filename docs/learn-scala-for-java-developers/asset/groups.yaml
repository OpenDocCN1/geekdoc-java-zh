    # 底类型 (Bottom Types)


    对于许多 Java 开发者来说，类层次结构拥有共同的底类型是一个新概念。这些类型是所有类型的子类型。Scala 中的类型 `Null` 和 `Nothing`
    并不是底类型。


    Scala 中所有的引用类型都是 `Null` 的父类型。`Null`也是一个 `AnyRef` 对象；它是每个引用类型的子类。


