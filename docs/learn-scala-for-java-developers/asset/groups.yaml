  - '[PAGE 39]


    We can instantiate an instance with the new keyword and create a new customer
    called Eric like this:


    ```

    Customer eric = new Customer("Eric", "29 Acacia Road"); // java

    ```


    In Scala, the syntax is much briefer; we can combine the class and constructor
    on a single line.


    ```

    class Customer(val name: String, val address: String) // scala

    ```


    We new it up in the same way, like this:


    ```

    val eric = new Customer("Eric", "29 Acacia Road"); // scala

    ```


    Rather than define the fields as members within the class, the Scala version declares
    the variables as part of the class definition in what''s known as the primary
    constructor. In one line, we''ve declared the class Customer and, in effect, declared
    a constructor with two arguments.


    # Derived Setters and Getters


    The val keyword on the class definition tells the compiler to treat the arguments
    as fields. It will create the fields and accessor methods for them.


    We can prove this by taking the generated class file and decompiling it into Java.
    Round-tripping like this is a great way to explore what Scala actually produces
    behind the scenes. I''ve used the excellent CFR decompiler by Lee Benfield here,
    but you could also use the javap program that ships with Java to get the basic
    information.'
- md: "\nTo run the decompiler on the Scala generated class file for customer, you\
    \ do something like the following:\n\n```\njava -jar cfr_0_99.jar target/scala-2.11/classes/scala/demo/Customer.class\n\
    ```\n\nIt produces the following:\n\n```\n// decompiled from scala to java\npublic\
    \ class Customer {\n    private final String name;\n    private final String address;\n\
    \    public String name() {\n        return this.name;\n    }\n    public String\
    \ address() {\n        return this.address;\n    }\n    public Customer(String\
    \ name, String address) {\n        this.name = name;\n        this.address = address;\n\
    \    }\n}\n```\n\nWhat's important to notice is that Scala has generated accessor\
    \ methods at lines 6 and 10, a constructor at line 14. The accessors aren't using\
    \ the Java getter convention, but we've got the equivalent of getName and getAddress.\n\
    \nYou might also want to define fields but not have them set via the constructor.\
    \ for example, in Java, we might want to add an id to the customer to be set later\
    \ with a setter method. This is a common pattern for tools like Hibernate when\
    \ populating an object from the database.\n\n```\n// java\npublic class Customer\
    \ {\n    private final String name;\n    private final String address;\n    private\
    \ String id;\n    public Customer(String name, String address) {\n        this.name\
    \ = name;\n        this.address = address;\n    }\n    public void setId(String\
    \ id) {\n        this.id = id;\n    }\n}\n```\n\nIn Scala, you do pretty much\
    \ the same thing.\n\n```\n// scala\nclass Customer(val name: String, val address:\
    \ String) {\n    var id = \"\"\n}\n```\n\nYou define a field, in this case a var,\
    \ and magically Scala will create a setter method for you. The setter method it\
    \ creates is called id= rather than the usual setId. If we round-trip this through\
    \ our decompiled from scala decompiler, we will see the following:\n\n```\n//\
    \ decompiled from scala to java\npublic class Customer {\n    private final String\
    \ name;\n    private final String address;\n    private String id;\n\n    public\
    \ static Customer apply() {\n        return Customer.MODULE.$apply();\n    }\n\
    \    public String name() {\n        return this.name;\n    }\n    public String\
    \ address() {\n        return this.address;\n    }\n    public String id() { //\
    \ notice it's public\n        return this.id;\n    }\n    public void _id$Seq(String\
    \ x1) { // notice it's public\n        this.id = x1;\n    }\n    public Customer(String\
    \ name, String address) {\n        this.name = name;\n        this.address = address;\n\
    \        this.id = null;\n    }\n```\n\nNotice it has created a method called\
    \ _$eq on line 19 rather than id_; because the equals symbol isn't allowed in\
    \ a method name on the JVM, so Scala has escaped it and will translate it. You\
    \ can call the setter method directly like this:\n\n```\nnew Customer(\"Bob\"\
    , \"10 Downing Street\").id_ = \"0000001\";\n```\n\nScala offers a shorthand,\
    \ however you can use regular assignment and Scala will call the auto-generated\
    \ _$eq setter method under the covers:\n\n```\nnew Customer(\"Bob\", \"10 Downing\
    \ Street\").id_ = \"0000001\";\n```\n\nIf there are no modifiers in front of a\
    \ field, it means it's public. So as well as being able to call the auto-generated\
    \ setter, clients could also work directly on the field, potentially breaking\
    \ encapsulation. We'd like to be able to make the field private and allow updates\
    \ only from within the customer class.\n\nTo do this, use the private keyword\
    \ with the field:\n\n```\nclass Customer(val name: String, val address: String)\
    \ {\n    private var id = \"\"\n}\n```\n\nThe decompiler shows that the setter\
    \ and getter methods are now private.\n\n```\n// decompiled from scala to java\n\
    public class Customer {\n    private final String name;\n    private final String\
    \ address;\n```\n\n# Redefining Setters and Getters\n\nThe advantage of using\
    \ setters to set values is that we can use the method to preserve invariants or\
    \ perform special processing. In Java, it's straightforward: you create the setter\
    \ method in the first place. It's more laborious for Scala, as the compiler is\
    \ generating the methods. For example, if the id has been set, you might want\
    \ to prevent it from being updated. In Java, you could do something like:\n\n\
    ```\n// java\npublic void setId(String id) {\n    if (id.isEmpty()) {\n      \
    \  this.id = id;\n    }\n}\n```\n\nScala, on the other hand, creates the setter\
    \ method automatically, so how we redefine it? If we try to replace the setter\
    \ in Scala code, we get a compiler error:\n\n```\nclass Customer(val name: String,\
    \ val address: String) {\n    private var id = \"\"\n\n    def id_(value: String)\
    \ {\n        if (id.isEmpty()) {\n            id = value;\n        }\n    }\n\
    }\n```\n\nScala can't replace the method so it creates a second method of the\
    \ same name, and the compiler fails when it references the duplicate:\n\n```\n\
    ambiguous reference to method id_= in Customer of type (value: String)\nmethod\
    \ id= = Customer of type (x$1: String)\nargument types (String)\nmethod id= is\
    \ defined twice conflicting symbols originated in file 'Customer.scala'\n```\n\
    \nTo refine the method, we have to jump through some hoops. Firstly, we have to\
    \ rename the field (say _id), making it possible to create a new getter method\
    \ called id and setter method called id_ that are public and are used to access\
    \ the renamed private field.\n\n```\nclass Customer(var name: String, val address:\
    \ String) {\n    private var id: String = \"\"\n\ndef id = _id\ndef id=(value:\
    \ String) {\n    if (_id.isEmpty()) {\n      id = value\n    }\n}\n```\n\nWe've\
    \ hidden the real field _id behind the private modifier and exposed method id_\
    \ to act as a setter. There is no field called id, Scala won't try to generate\
    \ a duplicate method, and things compile.\n\n```\n// REPL session\nscala> val\
    \ bob = new Customer(\"Bob\", \"10 Downing Street\")\nbob: Customer = Customer@65027\n\
    \nscala> bob.id = \"001\"\nbob.id: String = 001\n\nscala> println(bob.id)\n001\n\
    \nscala> bob.id = \"002\"\nbob.id: String = 001\n\nscala> println(bob.id)\n001\n\
    ```\n\nLooking at the decompiled version, you can see how to redefine the method.\
    \ We've hidden the real field and exposed public methods to synthesize access\
    \ to it under the guise of the field name.\n\n```\n// decompiled from scala to\
    \ java\npublic class Customer {\n  private final String name;\n  private final\
    \ String address;\n  public String name() {\n    return this.name;\n  }\n  public\
    \ String address() {\n    return this.address;\n  }\n  private String _id() {\
    \ // private\n    return this._id;\n  }\n  private void _id$eq(String x1) { //\
    \ private\n    this._id = x1;\n  }\n  public String id() { // public\n    return\
    \ this._id();\n  }\n  public void _id$eq(String value) { // public\n    if (_this.id.isEmpty())\
    \ return;\n    this._id$eq(value);\n  }\n  public Customer(String name, String\
    \ address) {\n    this.name = name;\n    this.address = address;\n    this._id\
    \ = \"\";\n  }\n}\n```\n\n> Why the Getter?\nYou might be wondering why we created\
    \ the getter method def to allow the shorthand assignment syntax to a value class\
    \ that has both the setter (id=) and getter methods.\n\n# Summary\n\nCreating\
    \ classes is straightforward in Scala. You can add fields to the class simply\
    \ by adding parameters to the class definition, and the equivalent Java constructor,\
    \ getters and setters are generated for you by the compiler.\nAll fields in the\
    \ class file are generated as private but have associated accessor methods generated.\
    \ These generated methods are affected by the presence of val or var in the class\
    \ definition.\n\n- If val is used, a public getter is created but no setter is\
    \ created. The value can only be set by the constructor.\n- If var is used, a\
    \ public getter and setter is created. The value can be set via the setter or\
    \ the constructor.\n- If neither val or var is used, no methods are generated\
    \ and the value can only be used within the scope of the primary constructor;\
    \ it's not really useful in this case.\n- Prefixing the class definition with\
    \ private won't change these rules, but will make any generated methods private.\n"
