    \  }\n}\n```\n\n## Other Uses for Companion Objects\n\nWhen methods don't depend\
    \ on any of the fields in a class, you can more accurately think of them as functions.\
    \ Functions generally belong in a singleton object rather than a class, so one\
    \ example of when to use companion objects is when you want to distinguish between\
    \ functions and methods, but keep related functions to the class they relate to.\n\
    Another reason to use a companion object is for factory-style methods — methods\
    \ that create instances of the class companion. For example, you might want to\
    \ create a factory method that creates an instance of your class with less noise.\
    \ If we want to create a factory for Customer, we can do so like:\n\n```\n// scala\n\
    class Customer(val name: String, val address: String) {\n  val id = Customer.nextId()\n\
    }\n```\n\n```\nobject Customer {\n  def apply(name: String, address: String) =\
    \ new Customer(name, address)\n}\n```\n\nThe apply method affords a shorthand\
    \ notation for a class or object. It's kind of the default method for a class,\
    \ so if you don't call a method directly on an instance, but instead the arguments\
    \ of an apply method, it'll call it for you. For example, you can call:\nCustomer.apply(\"\
    Bob Fossil\", \"1 London Road\")\n\n...or you can drop the apply and Scala will\
    \ look for an apply method that matches your argument. The two are identical.\n\
    \nCustomer(\"Bob Fossil\", \"1 London Road\")\n\nYou can still construct a class\
    \ using the primary constructor and new, but implementing the companion class\
    \ apply method as a factory means you can be more concise if you have to create\
    \ a lot of objects.\n\nYou can even force clients to use your factory method rather\
    \ than the constructor by making the primary constructor private.\n\n```scala\n\
