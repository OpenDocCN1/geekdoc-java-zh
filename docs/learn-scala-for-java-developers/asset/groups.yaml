  mdcn: "\n在底层实现上，Scala 创建的代码与我们的单例模式示例生成的 Java 代码相同。你可以通过反编译它来看到这一点。\n\n```\n// decompiled\
    \ from scala to java\npublic final class Logger$ {\n    public static final Logger$MODULE;\n\
    \n    public static {\n        new scala.demo.singleton.Logger$\n    }\n\n   \
    \ public void log(Level level, String string) {\n        Logger$.printf(\"%s%%n\"\
    , (Seq)Logger$.$MODULE);\n        .genericWrapperArray((Object)new Object[]{level,\
    \ string});\n    }\n\n    private Logger$() {\n        Logger$.MODULE = this;\n\
    \    }\n}\n```\n\n`log` 方法中存在一些奇怪之处，但那是反编译器在解码字节码时遇到了困难，而且通常这也是 Scala 处理问题的方式。本质上，它是等价的：一个私有构造函数处理\
    \ Java 版本，以及该对象的单一静态实例。该类本身还是 `final` 的。\n\n不需要 `new` 一个新的 `Logger`；`Logger` 已经是一个对象了，所以我们可以直接引用它。事实上，即使你想\
    \ `new` 也做不到，因为没有类定义，也没有可供 `new` 的类。\n\n顺便一下，我们通过在 Scala 单例对象（而不是类）中添加 `main`\
    \ 方法，复制了 Java 的静态 `main` 方法。\n\n## 伴生对象 (Companion Objects)\n\n你可以在 Scala 中结合对象和类。当你在同一个源文件中创建一个同名的类和对象时，该对象被称为伴生对象。\n\
    \nScala 没有 `static` 关键字，但单例对象的成员在效果上是静态的。请记住，Scala 的单例对象仅仅是一个单例。它包含的任何成员都会被所有使用该对象的客户端复用；它们像静态成员一样是可以全局访问的。\n\
    \n在 Java 中编写静态和非静态成员的地方，你就可以使用伴生对象。\n\nJava 版本的 `Customer` 包含姓名、地址字段，以及一个用于唯一标识客户的\
    \ ID。\n\n```java\n// java\npublic class Customer {\n    private final String name;\n\
    \    private final String address;\n\n    private Integer id;\n\n    public Customer(String\
    \ name, String address) {\n        this.name = name;\n        this.address = address;\n\
    \    }\n```\n\n现在，我们可能想创建一个辅助方法来按顺序创建新的 ID。为了实现全局化，我们创建一个静态字段来捕获 ID 的值，并创建一个返回且递增该值的方法。然后我们只需要在构造新实例时调用该方法，将其\
    \ ID 赋值给新递增的全局 ID。\n\n```java\n// java\npublic class Customer {\n    private static\
    \ Integer sequenceOfIds;\n\n    private final String name;\n    private final\
    \ String address;\n\n    private Integer id;\n\n    public Customer(String name,\
    \ String address) {\n        this.name = name;\n        this.address = address;\n\
    \        this.id = Customer.nextId();\n    }\n\n    private static Integer nextId()\
    \ {\n        return sequenceOfIds++;\n    }\n}\n```\n\n它是静态的，因为我们希望在所有实例之间共享它的实现，为每个实例创建唯一的\
    \ ID。\n\n在 Scala 中，我们将静态成员和非静态成员分离，将静态成员放在单例对象中，其余部分放在类中。该单例对象就是 `Customer` 的伴生对象。\n\
    \n我们创建包含两个必要字段的类，并在单例对象中创建 `nextId` 方法。接下来我们创建一个私有的 `var` 来捕获当前值，赋值为 0 以便 Scala\
    \ 可以推断出类型为 `Integer`。添加 `val` 意味着没有 setter，添加 `private` 修饰符意味着生成的 getter 是私有的。最后我们在\
    \ `nextId` 方法中实现递增，并在主构造函数调用它。\n\n```scala\n// scala\nclass Customer(val name:\
    \ String, val address: String) {\n    private val id = Customer.nextId()\n}\n\
    ```\n\n```scala\nobject Customer {\n    private var sequenceOfIds = 0\n\n    private\
    \ def nextId(): Integer = {\n        sequenceOfIds += 1\n        sequenceOfIds\n\
    \    }\n}\n```\n\n该单例对象是伴生对象，因为它与类同名且位于同一个源文件中。这意味着它们之间存在特殊关系，可以互相访问对方的私有成员。因此\
    \ `Customer` 对象可以定义 `nextId` 方法，因为 `Customer` 类仍然可以访问它。\n\n如果你给对象起不同的名字，你就没有这种特殊关系，也无法调用该方法。例如，类\
    \ `CustomerX` 对象不是 `Customer` 的伴生对象，因此你无法看到私有的 `nextId` 方法。\n\n```scala\n// scala\n\
    class Customer(val name: String, address: String) {\n  private val id = CustomerX.nextId()\
    \ // 编译失败\n}\n```\n\n```scala\nobject CustomerX {\n  private var sequenceOfIds\
    \ = 0\n\n  private def nextId(): Integer = {\n    sequenceOfIds += 1\n    sequenceOfIds\n\
    \  }\n}\n```\n\n## 伴生对象的其他用途\n\n当方法不依赖于类中的任何字段时，你可以更准确地将它们视为函数。函数通常属于单例对象而不是类，因此使用伴生对象的一个用例是：当你想要区分函数和方法，但又将相关的函数保留在它们所属的类中时。\n\
    使用伴生对象的另一个原因是为了工厂样式方法——即创建类伴生类实例的方法。例如，你可能想创建一个工厂方法，以更简洁的方式创建你的类实例。如果我们想为 `Customer`\
    \ 创建工厂，可以这样做：\n\n```scala\n// scala\nclass Customer(val name: String, val address:\
    \ String) {\n  val id = Customer.nextId()\n}\n```\n\n```scala\nobject Customer\
    \ {\n  def apply(name: String, address: String) = new Customer(name, address)\n\
    }\n```\n\n`apply` 方法为类或对象提供了简写符号。它有点像是类的默认方法，所以如果你不是直接在实例上调用方法，而是向 `apply` 方法传递参数，它会为你调用。例如，你可以调用：\n\
    `Customer.apply(\"Bob Fossil\", \"1 London Road\")`\n\n...或者你可以省略 `apply`，Scala\
    \ 将寻找匹配你参数的 `apply` 方法。两者是完全相同的。\n\n`Customer(\"Bob Fossil\", \"1 London Road\"\
    )`\n\n你仍然可以使用主构造函数和 `new` 来构造类，但将伴生类的 `apply` 方法实现为工厂，意味着如果你必须创建很多对象，代码可以更加简洁。\n\
    \n你甚至可以通过将主构造函数设为私有，来强制客户端使用你的工厂方法而不是构造函数。\n\n```scala\nclass Customer private(val\
    \ name: String, val address: String) {\n    val id = Customer.nextId()\n}\n```\n\
    \nJava 的对应实现将有一个静态工厂方法（例如 `createCustomer`）以及一个私有构造函数，强制所有人使用工厂方法。\n\n```java\n\
    // java\npublic class Customer {\n    private static Integer sequenceOfIds;\n\
    \    private final String name;\n    private final String address;\n    private\
    \ Integer id;\n    public static Customer createCustomer(String name, String address)\
    \ {\n        return new Customer(name, address);\n    }\n    private Customer(String\
    \ name, String address) {\n        this.name = name;\n        this.address = address;\n\
    \        this.id = Customer.nextId();\n    }\n    private static Integer nextId()\
    \ {\n        return sequenceOfIds++;\n    }\n}\n```\n\n## 继承\n\n（注：原文在此处中断，未提供后续内容）\n"
