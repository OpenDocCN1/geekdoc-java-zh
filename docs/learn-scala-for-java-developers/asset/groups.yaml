    Immutability? How are you going to measure it? Will the whole team aim for a functional
    programming style like Haskell? Or OO? Decide which up front. Agree.

    - **Understand the team dynamic.** Understand your team and what their wants and
    needs are. Gauge the team''s appetite and goals. Ultimately, everyone needs to
    buy into the idea and head in the same direction. If one or two feel left out
    or pull in another direction, you have problems further down the line.

    - **Set expectations.** Talk to the team and management. Explain the risks and
    share your motivations and expectations. To set your expectations: learning full-on
    programming (think Haskell) is hard. Be prepared.

    - **Review.** Once you''ve started, keep reviewing where you are. Are you getting
    out of it what you started with? Can you prove or disprove any of the assumptions?
    Is the business benefiting? If you can be more quantitative and use measurements,
    you can be more objective. And don''t be afraid to change your mind. Maybe you
    discover that it''s not the right choice for the team. You can always back out.


    # Get Guidance


    +   - **Hire an expert.** This is my single biggest tip. If you have a real expert
    on the team, they can guide you through the syntax and features, and more importantly
    the adoption process. They can hold you back when you shouldn''t be racing and
    open the door to new techniques when you''re ready. It is hard to find genuine
    experts but they can be worth their weight in gold.

    - **Be active in the community.** Attend events, conferences, meetups. Create
    a community. Learn from others and share your own experiences.

    - **Look at open.** But not too much. It''s good to see how others have done things
    — I''ve certainly been exposed to some of the more exotic syntax via open source
    — but in mind what''s right for them may not be right for you. Take it with a
    pinch of salt. Use other people''s code to inspire learning but don''t copy it.'
- md: "\n# Have a Plan\n\n- **Have a plan.** Don’t just start your next project in\
    \ Scala; be deliberate and have a plan.\n- **Think about your goals.** Write them\
    \ down, then sketch out the steps that will take you closer to them. For example,\
    \ if a goal is to get up to speed fast, you may want to run some lunchtime knowledge-sharing\
    \ sessions with your team.\n- **Decide where on the functional programming continuum\
    \ you want to be.** Do you want to jump in at the deep end or adopt functional\
    \ idioms later? One tip to minimise the learning curve is to avoid using native\
    \ Scala libraries to start with. They often lead you into functional style and\
    \ at the end of the day, it’s another API to learn. You can always stick with\
    \ the Java libraries you know, at least to start with.\n- **Make a commitment.**\
    \ Commit to your goals; don’t do what I did and sideline Scala to the tests. Actively\
    \ decide on Scala and make a personal commitment to see it happen.\n\nIf you follow\
    \ these tips, you should be clear about your goals and expectations, have an idea\
    \ where you’ll get guidance and have planned out your next steps. You’ll be facing\
    \ the prospect of working with a Scala codebase, probably converting Java code\
    \ and working with new tools and libraries.\n\nIn the next chapters we’ll look\
    \ at some practical tips on how to proceed, including converting Java code and\
    \ managing your codebase.\n\n# Convert Your Codebase\n\nAt this point, you're\
    \ likely to have an existing Java codebase and may be wondering if you should\
    \ try and convert the Java to Scala.\n\nIt may be a lot of effort, but I say it's\
    \ definitely worth investing in converting the entire codebase to Scala if you're\
    \ serious about adopting Scala. Don't aim to leave half and half. Accept that\
    \ it's going to take some time and effort but commit to achieving it. If you don't\
    \ finish the job, apathy can set in, not to mention that inter-op between old\
    \ Java and Scala can get really awkward. You'll make your life easier if you see\
    \ the job through.\n\nIntelliJ IDEA has a convert function which is a great starting\
    \ place. It'll let you quickly turn a Java class into Scala, but be prepared:\
    \ it's not often idiomatic and may not even compile without coercion. Treat any\
    \ automated conversion as a learning exercise. Don't accept the transformation\
    \ at face value, but look at the results and apply your judgement to tidy up.\
    \ For example, rather than create a case class, IntelliJ creates fields within\
    \ the Scala class. You'll usually be able to rephrase a verbatim conversion in\
    \ a more Scala-savvy way.\n\nConsider your build tools. These will need to be\
    \ updated. SBT and Maven both support mixed Java/Scala projects so there's no\
    \ excuse not to keep running your continuous integration and test environments.\
    \ You might also want to consider whether it's worth porting over your existing\
    \ build to SBT.\n\n# Manage Your Codebase\n\nOnce you have your newly converted\
    \ Scala codebase, you'll be working with it for a while. Here are some practicalities\
    \ you should be aware of and some general tips to manage your codebase.\n\n# Conventions\n\
    \n- There are so many syntax variations and conventions that the sheer number\
    \ of syntax options available can be intimidating. **Settle on your own conventions.**\n\
    - Find a way of doing things that works for your team and stick to it. Avoid context\
    \ switching between syntax modes to start with. That might mean using pattern\
    \ matching rather than using map to start with. Wait until everyone is comfortable\
    \ before switching over.\n- Review these choices regularly as you don't want to\
    \ be held back you're up and running.\n- Have a look at Twitter's efforts as an\
    \ example. They've managed to condense their experiences into a really practical\
    \ guide. Well worth a read.\n- Typesafe have a style guide which is worth reading\
    \ over but should be taken with a pinch of salt.\n\n# What to Avoid\n\nIt's also\
    \ great to know what to avoid when you're first starting out. I wish I knew some\
    \ of these things before I started:\n\n- SBT can make your life harder. SBT starts\
    \ off very simple but if you want to do anything sophisticated, it gets fairly\
    \ taxing. Be prepared to do some learning; SBT isn't anything that you can get\
    \ very far with by cutting and pasting examples from the internet. You actually\
    \ need some understanding. I think you'll have bigger things to worry about so\
    \ my suggestion is to stick with a build tool that you're familiar with to start\
    \ Scala projects in Maven.\n- Scalaz is not the place to start. This is the Haskell\
    \ programmer's library for Scala. It's hardcore and if you've not doing purely\
    \ functional programming for years, just plain avoid. You don't need to know what\
    \ an applicative functor is or why you'd use a Kleisli. At least, not to start\
    \ with.\n- “Fancy” Scala libraries might not help. When Scala came out, a bunch\
    \ of open source libraries hit the web. People got away and in hindsight admit\
    \ they went a little overboard with the syntax. As a result there are lots of\
    \ APIs that were not designed well:\n  - Dispatch: The http library Dispatch is\
    \ a good example. The method to add a query parameter to a request is `??`. That\
    \ doesn't read as intuitively as addRequestParam. In fairness, Dispatch offers\
    \ both the upshot and to be skeptical of libraries that operate overloading.\n\
    \  - Anomer is not one that uses parser API to extract SQL results. It basically\
    \ parses ResultSet but it has a unintuitive DSL for doing so, it makes you wonder\
    \ what was wrong with doing it manually.\n- Java libraries work just fine. You\
    \ can always use the Java libraries you know and love from Scala.\n- Lack of consistency\
    \ is dangerous.\n\n# Other Challenges\n\n- Compilation speed is slow.\n- Keeping\
    \ your IDE configuration in sync. \n- I recommend aiming for “Functional in the\
    \ small, OO in the large” to start.\n\n# Syntax Cheat Sheet\n\n## Values\n\n```scala\n\
    val x: Int = 42\nvar y: String = \"mutable\"\nval z = \"Scala FTW!\" // using\
    \ type inference\n```\n\n## Functions\n\n```scala\ndef add(x: Int, y: Int): Int\
    \ = x + y  // single expression\ndef add(x: Int, y: Int): Int {  // without equals\
    \ =, Unit is returned\n  x + y\n}\ndef min(x: Int, y: Int): Int = {  // last line\
    \ = return value\n  if (x < y)\n  else\n    y\ndef min(x: Int, y: Int): Int =\
    \ {  // don't forget the else\n  if (x < y)\n  else\n    \n} // bug!\ndef add(x:\
    \ Int, y: Int): Int = x + y  // return types can be inferred\ndef add(x: Int,\
    \ y: Int): Int = 2 + x  // default to 2 if omitted\nval add = (x: Int, y: Int)\
    \ => Int => x + y  // anonymous function\nadd(4, 2)  // call as usual\n```\n\n\
    // convert an anonymous class (Ordering in this case) to a lambda\n\n```scala\n\
    implicit def functionOrdering[A](f: (A, A) => Int): Ordering[A] = {\n  new Ordering[A]{\n\
    \    def compare(a: A, b: A) = f.apply(a, b)\n  }\n}\n```\n\n## Call-by-Name\n\
    \n```scala\ndef runInThread(task: => Int): Int {\n  new Thread() {\n    override\
    \ def run(): Unit = task\n  }.start()\n}\n```\n\n## Operator Overloading and Infix\n\
    \n```scala\n5 * 10  // same as 5.(10)\n\"Scala\" replace(\"a\", \"\\*\")\n```\n\
    \n## Classes\n\n```scala\nclass Customer\nclass Customer(name: String)  // create\
    \ a public class\nclass Customer private(name: String)  // private constructor\n\
    ```\n"
