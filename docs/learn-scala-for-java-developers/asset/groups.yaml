    \ def add(customer: Customer)\n  def find(name: String): Customer\n}\n```\n\n\
    A typical Java implementation would likely return null or throw some kind of NotFoundException.\
    \ For example, the following Set-based implementation returns a null if the customer\
    \ cannot be found:\n\n```scala\nclass CustomerSet extends Customers {\n  private\
    \ val customers = mutable.Set[Customer]()\n\n  def add(customer: Customer) = customers.add(customer)\n\
    \n  def find(name: String): Customer = {\n    for (customer <- customers) {\n\
    \      if (customer.name == name)\n        return customer\n    }\n    null\n\
    \  }\n\n  def iterator: Iterator[Customer] = customers.iterator\n}\n```\n\nReturning\
    \ null and throwing exceptions both have similar drawbacks.\n\nNeither communicate\
    \ intent very well. If you return null, clients need to know that's a possibility\
    \ so they can avoid a NullPointerException. But what's the best way to communicate\
    \ with clients? ScalaDoc? Ask them to look at the source? But what's easy for\
    \ clients to miss. Exceptions are somewhat clearer but as Scala exceptions are\
    \ unchecked, they're just as easy for clients to miss.\n\nYou also force unhappy\
    \ handling for your clients. Assuming that customers know to check for a null,\
    \ you're asking multiple clients to implement defensive strategies for the unhappy\
    \ path. You're forcing null on people and can ensure consistency, or even that\
    \ people will bother.\n\nDefining the find method to return option improves the\
    \ situation. Below, if we find a match, we return Some or None. This communicates\
    \ at an API level that the return type is option. The system type forces a consistent\
    \ way of dealing with the unhappy path.\n\n```scala\ntrait Customers extends Iterable[Customer]\
    \ {\n  def add(customer: Customer)\n  def find(name: String): Option[Customer]\n\
    }\n```\n\nOur implementation of find can then return either a Some or a None.\n\
    \nLet's say we'd like to find a customer and get their total shopping basket value.\
    \ A method that can return null, clients would have to do something like the following,\
    \ as Albert may not be in the repository.\n\n```scala\nval alert = customers.find(\"\
    Albert\") // can return null\nval basket = if (albert == null) alert.total else\
    \ D\n```\n\nIf we use Option, we can map transform from an option of a Customer\
    \ to an option of value.\n\n```scala\nval basketValue: Option[Double] =\ncustomers.find(\"\
    A\").map(customer => customer.total)\n```\n\nThe return type we have is an Option[Double].\
    \ If Albert isn't found, map will return a None to represent no basket value.\
    \ Remember that the map on Option is an optional transformation.\n\nWhen you want\
