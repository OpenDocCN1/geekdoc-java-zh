    \    println(result)\n  }\n}\n```\n\n输出将是：List(1, 1, 1, 3, 5, 7, 9)\n\n## 不仅仅是集合\n\
    \n我们已经看到了集合的 `map` 和 `flatMap`，但它们也存在于许多其他类。更泛地说，`map` 和 `flatMap` 作用于被称为单子（monads）的对象。事实上，`map`\
