- md: "\n[content]\nUsing the infix notation, you’re able to drop the dot notation\
    \ for variables and literals and call:\n\n```\nage * .5\n```\n\nor, as another\
    \ example:\n\n```\n35 toString\n```\n\nRemember, 35 is an instance of Int.\n\n\
    Specifically, Scala support for infix notation means that when a method takes\
    \ zero or one arguments you can drop the dot and parentheses, and if there is\
    \ more than one argument you can drop the dot.\n\nFor example:\n\n```\n35 + 10\n\
    \"ABCDEFG\" replace(\"a\", \"A\")\n```\n\nIt’s optional though; you can use the\
    \ dot notation if you prefer.\n\nWhat this means is that you can define your own\
    \ plus or minus method on your own classes and use it naturally with infix notation.\
    \ For example, you might have a Passenger join a Train.\n\n```\ntrain + passenger\n\
    ```\n\nThere are not many restrictions on what you can call your functions and\
    \ methods; you can use any symbol that makes sense to your domain.\n\n## Collections\n\
    \nScala comes with its own immutable collection types as well as mutable versions.\
    \ default immutability is preferred, so we can create a list with the following:\n\
    \n```\nval list = List(\"a\", \"b\", \"c\")\n```\n\nAnd create a map with:\n\n\
    ```\nval map = Map(1 -> \"a\", 2 -> \"b\")\n```\n\nwhere the arrow goes from the\
    \ key to the value. These will be immutable; you won’t be able to add or remove\
    \ elements.\n\nYou can process them in a similar way to Java 8's forEach and lambda\
    \ syntax:\n\n```\nlist.foreach(value => println(value)) // scala\n```\n\nwhich\
    \ is equivalent to the following in Java:\n\n```java\nlist.forEach(value -> System.out.println(value));\
    \ // java\n```\n\nLike Java 8's method reference syntax, you can auto-connect\
    \ the lambda argument to the method call.\n\n```\nlist.foreach(println) // scala\n\
    ```\n\nwhich is roughly equivalent to this Java:\n\n```java\nlist.forEach(System.out::println);\
    \ // java\n```\n\nThere are lots of Scala-ways to process collections. We'll look\
    \ at these later, but the most common way to iterate it is a for loop written\
    \ like this:\n\n```\nfor (value <- list) println(value)\n```\n\nwhich reads, \"\
    for every value in list, print the value\". You can also do it in reverse:\n\n\
    ```\nfor (value <- list.reverse) println(value)\n```\n\nor you might like to break\
    \ it across multiple lines:\n\n```\nfor (value <- list) {\nprintln(value)\n}\n\
    ```\n\n## Java Interoperability\n\nI mentioned that you can use any Java class\
    \ from Scala. For example, let's say we want to create a Java List rather than\
    \ the usual Scala immutable List.\n\n```\nval list = new java.util.ArrayList[String]\n\
    ```\n\nAll we did qualify the class name (java.util.ArrayList) and use new to\
    \ instantiate it. Notice the square brackets? Scala denotes generics using []\
    \ rather than <>. We also didn't have to use the parentheses in constructor, as\
    \ we have no arguments to pass in.\n\nWe can make method calls — for example,\
    \ adding an element — just as you'd expect:\n\n```\nlist.add(\"Hello\")\n```\n\
    \nor, using infix:\n\n```\nlist add \"World!\"\n```\n\n## Primitive Types\n\n\
    In Java there are two integer types: the primitive (non-object) int and the Integer\
    \ class. Scala has no concept of primitives — everything is an object — so, for\
    \ example, Scala's integer type is an Int. Similarly, you'll be familiar with\
    \ the other basic types:\n\n- Byte\n- Short\n- Int\n- Long\n- Char\n- String\n\
    - Float\n- Double\n- Boolean\n\nAlthough Scala has its own richer types, typically\
    \ they just wrap the Java types. When working with these basic types, nine times\
    \ out of ten you won’t need to worry if you’re using Scala or Java types. Things\
    \ are pretty seamless. For example, Scala has a BigDecimal type with a + method\
    \ which means you can add two big decimals with much less code than in Java.\n\
    \n## Compare the following Scala to Java:\n\n```scala\n// scala\nval total = BigDecimal(10000)\
    \ + BigDecimal(200)\n// java\nBigDecimal total = new BigDecimal(10000).add(new\
    \ BigDecimal(200));\n```\n\nScala hasn't reimplemented Java's BigDecimal; it just\
    \ delegates to it and saves you having to type all that boilerplate.\n\n## Scala’s\
    \ Class Hierarchy\n\nScala’s class hierarchy starts with the Any class in the\
    \ scala package. It contains methods like ==, !=, equals, #, hashCode, and toString.\n\
    \n```scala\nabstract class Any {\n  final def ==(that: Any): Boolean\n  final\
    \ def !=(that: Any): Boolean\n  def equals(that: Any): Boolean\n  def #: Int\n\
    \  def hashCode: Int\n  def toString: String\n  // ...\n}\n```\n\nEvery class\
    \ in Scala inherits from the abstract class Any. It has two immediate subclasses,\
    \ AnyVal and AnyRef.\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_20_0.png)\n\n\
    Fig. 1.1. Every class extends the Any class.\n\n## AnyVal\n\nAnyVal is the super-type\
    \ to all value types, and AnyRef the super-type of all reference types.\n\nBasic\
    \ types such as Byte, Int, Char are known as value types. Reference types are\
    \ allocated on the heap. Reference types are allocated on the stack, but in Scala\
    \ they are allocated on the heap. Reference types are known as reference types.\n\
    \nimg/cbf3f5372fffa2b96079cf12bcd2bbca_21_0.png\n\nFig. 1.2. Scala's value types.\n\
    \n## Unit\n\nThe Unit type is a special type used in Scala to represent void.\
    \ It's similar to void in Java. It has only one value, which is written as ().\n\
    \n```scala\nexample = ()\nexample = ()\n```\n\nA Java class implementing Callable\
    \ would look like this:\n\n```java\npublic class DoNothing implements Callable<Void>\
    \ {\n    @Override\n    public Void call() throws Exception {\n        return\
    \ null;\n    }\n}\n```\n\nIt is identical to this Scala class:\n\n```scala\nclass\
    \ DoNothing extends Callable[Unit] {\n  call: Unit = ()\n}\n```\n\n## AnyRef\n\
    \nAnyRef is actually an alias for Java's java.lang.Object class. It supplies default\
    \ implementations for toString and hashCode.\n\nThere used to be a subclass of\
    \ AnyRef called ScalaObject that Scala reference types extended. However, it was\
    \ only there for optimisation purposes and has been removed in Scala 2.11. (I\
    \ mention it as a lot of documentation still refers to it.)\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_23_0.png)\n\
    \nFig. 1.3. Scala Any. The ScalaObject class no longer exists.\n\nThe Java String\
    \ class and other Java classes used from Scala extend AnyRef. (Remember it's a\
    \ synonym for java.lang.Object.) Any Scala-specific classes, Scala's implementation\
    \ of a list, scala.List, also extend AnyRef.\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_24_0.png)\n\
    \nFig. 1.4. Scala's reference types.\n"
  mdcn: "\n使用中缀表达式（infix notation），你可以省略变量和字面量的点符号（dot notation），直接调用：\n\n```\nage\
    \ * .5\n```\n\n或者，另一个示例：\n\n```\n35 toString\n```\n\n记住，35 是 Int 的一个实例。\n\n具体来说，Scala\
    \ 对中缀表达式的支持意味着：当一个方法接受零或一个参数时，你可以省略点号和括号；如果有多个参数，你可以省略点号。\n\n例如：\n\n```\n35 +\
    \ 10\n\"ABCDEFG\" replace(\"a\", \"A\")\n```\n\n不过这是可选的；如果你愿意，仍然可以使用点符号表示法。\n\n\
    这意味着你可以在自己的类上定义自己的加法或减法方法，并使用中缀表达式自然地使用它们。例如，你可能会让一个乘客（Passenger）加入一列火车（Train）。\n\
    \n```\ntrain + passenger\n```\n\n对于你可以调用的函数和方法并没有多少限制；你可以使用任何符合你领域逻辑符号。\n\n##\
    \ 集合 (Collections)\n\nScala 自带了自身的不可变集合类型以及可变版本。默认倾向于使用不可变性，因此我们可以通过以下方式创建一个列表：\n\
    \n```\nval list = List(\"a\", \"b\", \"c\")\n```\n\n通过以下方式创建一个 map：\n\n```\nval\
    \ map = Map(1 -> \"a\", 2 -> \"b\")\n```\n\n其中箭头从键指向值。这些都是不可变的；你无法添加或删除元素。\n\n\
    你可以用类似于 Java 8 的 `forEach` 和 lambda 语法的方式来处理它们：\n\n```\nlist.foreach(value =>\
    \ println(value)) // scala\n```\n\n这等同于 Java 中的以下代码：\n\n```java\nlist.forEach(value\
    \ -> System.out.println(value)); // java\n```\n\n与 Java 8 的方法引用语法一样，你可以自动将 lambda\
    \ 参数连接到方法调用。\n\n```\nlist.foreach(println) // scala\n```\n\n这大致等同于此 Java 代码：\n\
    \n```java\nlist.forEach(System.out::println); // java\n```\n\nScala 有很多处理集合的方法。我们稍后会介绍这些，但最常用的迭代方式是编写如下的\
    \ for 循环：\n\n```\nfor (value <- list) println(value)\n```\n\n它的含义是“对于 list 中的每一个值，打印该值”。你也可以反过来做：\n\
    \n```\nfor (value <- list.reverse) println(value)\n```\n\n或者你可能喜欢将其跨多行编写：\n\n\
    ```\nfor (value <- list) {\nprintln(value)\n}\n```\n\n## Java 交互性 (Java Interoperability)\n\
    \n我提到过你可以在 Scala 中使用任何 Java 类。例如，假设我们创建一个 Java List 而不是通常的 Scala 不变 List。\n\n\
    ```\nval list = new java.util.ArrayList[String]\n```\n\n我们所做的只是限定了类名（java.util.ArrayList）并使用\
    \ `new` 来实例化它。注意方括号了吗？Scala 使用 `[]` 而不是 `<>` 来表示泛型。我们不需要在构造函数中使用括号，因为我们没有参数要传递。\n\
    \n我们可以像预期的那样进行方法调用——例如添加一个元素：\n\n```\nlist.add(\"Hello\")\n```\n\n或者，使用中缀：\n\n\
    ```\nlist add \"World!\"\n```\n\n## 原始类型 (Primitive Types)\n\n在 Java 中有两种整数类型：原始类型（非对象）`int`\
    \ 和 `Integer` 类。Scala 没有原始类型的概念——一切都是对象——所以，例如，Scala 的整数类型是 `Int`。同样，你也会熟悉其他基础类型：\n\
    \n- Byte\n- Short\n- Int\n- Long\n- Char\n- String\n- Float\n- Double\n- Boolean\n\
    \n尽管 Scala 拥有更丰富的类型，但通常它们只是对 Java 类型进行了封装。在处理这些基础类型时，十有九的情况下你都不需要担心使用的是 Scala\
    \ 类型还是 Java 类型。它们之间的衔接非常无缝。例如，Scala 有一个 `BigDecimal` 类型，并带有一个 `+` 方法，这意味着你可以用比\
    \ Java 少得多的代码相两个大精度数字。\n\n## 比较以下 Scala 和 Java 代码：\n\n```scala\n// scala\nval\
    \ total = BigDecimal(10000) + BigDecimal(200)\n// java\nBigDecimal total = new\
    \ BigDecimal(10000).add(new BigDecimal(200));\n```\n\nScala 并没有重新实现 Java 的 `BigDecimal`；它只是委托给了它，并让你无需编写所有这些模板代码。\n\
    \n## Scala 的类层次结构 (Scala’s Class Hierarchy)\n\nScala 的类层次结构始于 `scala` 包中的 `Any`\
    \ 类。它包含了如 `==`、`!=`、`equals`、`#`、`hashCode` 和 `toString` 等方法。\n\n```scala\nabstract\
    \ class Any {\n  final def ==(that: Any): Boolean\n  final def !=(that: Any):\
    \ Boolean\n  def equals(that: Any): Boolean\n  def #: Int\n  def hashCode: Int\n\
    \  def toString: String\n  // ...\n}\n```\n\nScala 中的每个类都继承自抽象类 `Any`。它有两个直接子类：`AnyVal`\
    \ 和 `AnyRef`。\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_20_0.png)\n\n图 1.1.\
    \ 每个类都扩展 Any 类。\n\n## AnyVal\n\n`AnyVal` 是所有值类型的超类型，`AnyRef` 是所有引用类型的超类型。\n\n\
    `Byte`、`Int`、`Char` 等基础类型被称为值类型。引用类型分配在堆上。引用类型在某些语言中分配在栈上，但在 Scala 中它们被分配在堆上。引用类型被称为引用类型。\n\
    \nimg/cbf3f5372fffa2b96079cf12bcd2bbca_21_png\n\n图 1.2. Scala 的值类型。\n\n## Unit\n\
    \n`Unit` 类型是 Scala 中用于表示 `void` 的特殊类型。它类似于 Java 中的 `void`。它只有一个值，写为 `()`。\n\n\
    ```scala\nexample = ()\nexample = ()\n```\n\n实现 `Callable` 的 Java 类看起来如下：\n\n\
    ```java\npublic class DoNothing implements Callable<Void> {\n    @Override\n \
    \   public Void call() throws Exception {\n        return null;\n    }\n}\n```\n\
    \n它等同于这个 Scala 类：\n\n```scala\nclass DoNothing extends Callable[Unit] {\n  call:\
    \ Unit = ()\n}\n```\n\n## AnyRef\n\n`AnyRef` 实际上是 Java `java.lang.Object` 类的别名。它提供了\
    \ `toString` 和 `hashCode` 的默认实现。\n\n`AnyRef` 曾经有一个名为 `ScalaObject` 的子类，Scala 引用类型扩展它。然而，它是为了优化，已经在\
    \ Scala 2.11 中被移除。（提及它是因为很多文档仍然提到了它。）\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_23_0.png)\n\
    \n图 1.3. Scala Any。ScalaObject 类已不存在。\n\nJava `String` 类以及其他从 Scala 使用的 Java 类扩展\
    \ `AnyRef`。（记住它是 `java.lang.Object` 的同义词。）任何 Scala 特有的类，例如 Scala 的列表实现 `scala.List`，也扩展\
    \ `AnyRef`。\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_24_0.png)\n\n图 1.4. Scala\
    \ 的引用类型。\n\n"
