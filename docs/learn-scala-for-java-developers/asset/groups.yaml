    # Option.get


    To get the raw value, you can use the get method but it will throw an exception
    if you call it against no value. Calling it is a bit of a small as it''s roughly
    equivalent to ignoring the possibility of a NullPointerException. You should only
    call it when you know the option is a Some.


    ```

    // could throw an exception

    val basketValue = customers.find("A").map(customer => customer.total)

    ```


    To ensure the value is a Some, you can pattern match like the following, again,
    it''s really just an elaborate null check.


    ```

    val basketValue: Double = customers.find("Missing") match {

    case Some(customer) => customer.total    // avoids the exception

    }

    ```


    # Option.getOrElse


    Calling getOrElse is often a better choice as it forces you to provide a default
    value. It has the same effect as the pattern match version, but with less code.


    ```

    val basketValue =

    customers.find("A").map(customer => customer.total).getOrElse(@D)

    ```


    # Monadic Processing option


    If you want to avoid using getOrElse, you can use the monadic methods on Option.
    To demonstrate this, we need a slightly more elaborate example. Let''s say we
    want to sum the basket value of a subset of customers. We could create the list
    of names of customers we''re interested in and find each of them by transforming
    (mapping) the customer names into a collection of Customer objects.


    In the example, we create a database, adding some sample data before mapping.


    ```

    val database = Customers()


    val address1 = Some(Address("1a Bridge St", None))

    val address2 = Some(Address("2 Short Road", Some("AL1 2PY\)))

    val address3 = Some(Address("221b Baker St", Some("Nw1")))


    database.add(new Customer("Albert", address1))

    database.add(new Customer("Beatriz", None))

    database.add(new Customer("Carol", address2))

    database.add(new Customer("Sherlock", address3))


    val customers = Set("Albert", "Beatriz", "Carol", "Dave", "Erin")

    ```'
