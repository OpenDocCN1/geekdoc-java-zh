    \ hero: SuperHero => hero.alterEgo\n    case person: Person => person.name\n \
    \ }\n}\n```\n\n```\n// What's a superhero's alter ego?\nprintln(\"Batman alter\
    \ ego is \" + nameFor(batman)\\)\nprintln(\"Captain America's alter ego is \"\
    \ + nameFor(cap)\\)\nprintln(\"Jayne's alter ego is \" + nameFor(jayne)\")\n```\n\
    \nRather than a sequence of instanceof checks by a cast, you can specify a variable\
    \ and type. In the expression that follows the arrow, the variable can be used\
    \ as an instance of that type. So on line 11, hero is magically an instance of\
    \ SuperHero and SuperHero specific methods (like alterEgo) are available without\
    \ casting.\n\nWhen you use pattern matching to deal with exceptions in a try and\
    \ catch, it's actually type queries that are being used.\n\n```\ntry {\n  var\
    \ url = new URL(\"http://baddotrobot.com\")\n  var reader = new BufferedReader(url.getInputStream)\n\
    \  var line: String = reader.readLine()\n  while (line != null) {\n    line =\
    \ reader.readLine()\n  }\n  println(line)\n}\ncatch {\n  case _: MalformedURLEException\
    \ => println(\"Bad URL\")\n  case e: IOException => println(\"Problem reading\
    \ data: \" + e.getMessage)\n}\n```\n\nThe underscore in the MalformedURLEException\
    \ match shows that you can use a wildcard with type queries if you're not interested\
    \ in using the value.\n\n# Deconstruction Matches and unapply\n\nIt's common to\
    \ implement the method as a factory-style creation method; a method taking arguments\
    \ and giving back a new instance. You can think of the special case unapply method\
    \ as the opposite of this. It takes an instance and extracts values from it; usually\
    \ the values that you want to construct it.\n\napply (a, b) -> object (a, b) unapply\
    \ (object (a, b)) -> a, b\n\nBecause they extract values, objects that implement\
    \ unapply are referred to as extractors.\n\nGiven an object, an extractor typically\
    \ extracts the parameters that would have created that object.\n\nSo if we want\
    \ to use our Customer in a match expression, we'd add an unapply method to its\
    \ companion object."
