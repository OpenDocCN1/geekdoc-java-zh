    # ## Audience


    This book is for Java developers looking to transition to programming in Scala.


    # ## the Author


    Toby Weston is an independent software developer based in London. He specialises
    in Java and Scala development, working in agile environments. He’s a keen blogger
    and writer, having written for JAXenter and authored the books Essential Acceptance
    Testing and What’s New in Java 8. A big supporter of open source software, Toby
    has contributed to several projects including jMock.


    # ## The Structure of the Book


    The book is split into four parts: a tour of Scala, a comparison between Java
    and Scala, Scala-specific features and functional programming idioms, and finally
    a discussion adopting Scala into existing Java teams.


    In the first part, we’re going to take a high-level tour of Scala. You’ll get
    a feel for the language’s constructs and how Scala is similar in a lot of ways
    to Java, yet very different in others. We’ll take a look at installing Scala and
    using the interactive interpreter and we’ll go through some basic syntax examples.


    Part II. talks about key differences between Java and Scala. We’ll look at what’s
    missing in Scala compared to Java and how concepts translate from one language
    to another.


    Then in Part III., we’ll talk about some of the language features that Scala offers
    that aren’t found in Java. This section also talks about functional programming
    idioms.


    Finally, we’ll talk about adopting Scala into legacy Java projects and teams.
    It’s not an easy transition, so we’ll look at why you would want to, and some
    of the challenges you might face.


    # ## Credits


    **Author** Toby Weston (http://baddotrobot.com)


    **Copyeditor** Amy Brown (http://www.amyrbrown.ca)'
  - '[PAGE 6]


    # # I. SCALA TOUR


    Welcome to *Learn Scala for Java Developers*. This book will help you transition
    from programming in Java to programming in Scala. It''s designed to help Java
    developers started with Scala without necessarily adopting all of the more advanced
    functional programming idioms.


    Scala is both an object-oriented language and a functional language and although
    I do talk about some of the advantages of functional programming, this book is
    more about being productive with imperative Scala than getting to grips with functional
    programming. If you''re already familiar with Scala but are looking to make the
    leap to pure functional programming, this probably isn''t the book for you. Check
    out the excellent [Functional Programming in Scala](https://example.com/functional-programming-scala)
    by Paul Chiusano and Rúnar Bjarnaso instead.


    The book often compares “like-for-like” between Java and Scala. So, if you''re
    familiar with doing something a particular way in Java, I''ll show how you might
    do the same thing in Scala. Along the way, I''ll introduce the Scala language
    syntax.'
  - '[PAGE 7]


    # The Scala Language


    Scala is both a functional programming language *and* an object-oriented language.
    As a Java programmer, you''ll be comfortable with the object-oriented definition:
    Scala has classes, objects, inheritance, composition, polymorphism — all the things
    you''re used to in Java.


    In fact, Scala goes somewhat further than Java. There are no "non”-objects. Everything
    is an object, so there are no primitive types like int and no static methods or
    fields. Functions are objects and even values are objects.


    Scala can be accurately described as a functional programming language because
    it meets some fairly formal criteria. For example, it allows you both to define
    *pure functions* and use *higher-order functions*.


    # Pure Functions


    Pure functions aren''t associated with objects, and work without side effects.
    A key concern in Scala programming is avoiding mutation. There''s a keyword to
    define a fixed variable, a little like Java''s `final: val`.


    Pure functions should operate by *transformation* rather than *mutation*. That
    is to say, a pure function should take arguments and return results but not modify
    the environment operates in. This *purity of function* is what enables *referential
    transparency*.'
  - '[PAGE 8]


    # Higher-Order Functions


    Functional languages should treat functions as first-class citizens. This means
    they support higher-order functions: functions that take functions as arguments
    or return functions and allow functions to be stored for later execution. This
    is a powerful technique in functional programming.


    # Scala''s Background


    Scala started life in 2003 as a research project at EPFL in Switzerland. The project
    was headed by Martin Odersky, who''d previously worked on Java generics and the
    Java compiler for Sun Micros.


    It''s quite rare for an academic language to cross over into industry, but Odersky
    and others launched Typesafe Inc., a commercial enterprise built around Scala.
    Since then, Scala has moved into the mainstream as a developed language.


    Scala offers a more concise syntax than Java but on the JVM. Running on the JVM
    should (in theory) mean easy migration to production environments; if you already
    have the Oracle JVM installed in your production environment, it makes no difference
    that the bytecode generated from the Java or Scala compiler.


    It also means that Scala has Java interoperability built in, which in turn means
    Scala can use any Java library. One of Java''s strengths over its competitors
    was always the huge number of open source libraries and tools available. These
    are pretty much all available to Scala too. The Scala community has that same
    open source mentality, and so there''s a growing number of excellent Scala libraries
    out there.


    # The Future


    Scala has definitely moved into the mainstream as a popular language. It has been
    adopted by lots of big companies including Twitter, eBay, Yahoo, HSBC, UBS, and
    Morgan Stanley, and it''s unlikely to fall out of favour anytime soon. If you''re
    nervous about using it in production, don''t be; it''s backed by an international
    organisation and regularly scores well in popularity indexes.


    The tooling is still behind Java. Powerful IDEs like IntelliJ''IDEA and Eclipse
    make refactoring Java code straightforward but aren''t quite there yet for Scala.
    The same is true of compile times: Scala is a bit slower to compile than Java.
    These things will improve over time, and on balance, they''re not the biggest
    hindrances I encounter when developing.'
