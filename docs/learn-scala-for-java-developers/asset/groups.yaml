    \ ArrayList<String>();\nlist.add(new Object()); // compiler error\n```\n\nThe\
    \ exception is null.\n\n```\nlist.add(null);\n```\n\nYou get the same effect in\
    \ Scala, where you can't even create a list without a valid type:"
  - "[PAGE 96]\n\n```\nscala val list = mutable.MutableList[[]]\n<console>?: error:\
    \ unbound wildcard type\n  val list = mutable.MutableList[[]]\n  ^\n```\n\nYou\
    \ mainly use wildcards when you really don't care about the type parameter, just\
    \ any constraints on an upper or lower bounding, or when you can treat the type\
    \ as an instance of Object or Any.\n\n# # Multiple Bounds\n\nTypes can also have\
    \ multiple bounds in Java and Scala.\n\n+   - Java is limited to multiple upper\
    \ bounds.\n- Java can't set a lower and upper bound on types (so you can't have\
    \ a generic type extend one thing and also a super-type to another).\n- Scala\
    \ can set a single lower and upper bound, unlike Java.\n- However, it can't set\
    \ multiple upper or lower bounds. Instead it can constrain by forcing you to extend\
    \ traits.\n\nUsing multiple bounds, another way to express the constraints on\
    \ the Animal sorting would be to explicitly state that A must extend Animal and\
    \ be comparable to Animal, using the & symbol in Java.\n\n```\n// java\npublic\
    \ static <A extends Animal & Comparable<Animal>> void sort(List<A> l) { }\n```\n\
    \nThis sets two bounds to the generic type A in Java. You can't set two upper\
