    \ tells you you can put in a data structure. In our Lion example, using a lower\
    \ bound means you can put more than just lions in the zoo. You use super in Java\
    \ and greater than colon:) in Scala.\n\n# Wildcard Bounds <? extends T, <? super\
    \ T>\n\nWe've already seen some examples of wildcards: the ? in Java and the _\
    \ in Scala.\n\nWildcards with an upper bound like this:\n\n```\n// java\nvoid\
