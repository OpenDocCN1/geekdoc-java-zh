    \ Covariant | Contravariance |\n| --- | --- | --- |\n| Java | <T> | <? extends\
    \ T> | <? super T> |\n| Scala | [T] | [+T] | [-T] |\n| Scala (wildcards) | [T]\
    \ | [_ <: T] | [_ >: T] |\n"
