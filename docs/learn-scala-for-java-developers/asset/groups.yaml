    \ $a + b$。\n\n```\n$f(a, b) = a + b$\n```\n\n为了将其转换为两个各有一个单一参数的函数，我们首先创建一个函数来接收\
    \ $a$ 并返回一个新的函数（$f$）。\n\n```\n$f(a) \\rightarrow f$\n```\n\n这个新函数本身应该接收一个单一参数\
    \ $b$。\n\n```\n$f(a) \\rightarrow f(b)$\n```\n\n这整个函数应该返回结果 $a + b$。\n\n```\n\
    $f(a) \\rightarrow f(b) \\rightarrow a + b$\n```\n\n我们留下了两个函数（$f$ 和 $f$），每个都接收一个单一参数。\n\
    在同一页上使用伪数学符号，有必要重申一下我的原始定义，并将原始函数与函数的柯里化（curried）形式进行比较。\n\n> 对于一个两个参数的函数，柯里化会产生一个接受一个参数并返回另一个函数的函数。这个返回的函数也将有一个单一参数（对应原函数的第二个参数）。\n\
    \n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_111_0.png)\n\n图 3.1. 原函数以及到达其柯里化形式的步骤。\n\
    \n要评估柯里化形式的函数，我们将评估第一个函数（例如传入值 1）。\n\n```\n$f(1)$\n```\n\n这将返回一个捕获了该值的函数，由于返回的是一个函数，我们可以直接评估它，为最后一个参数提供一个值（2）。\n\
    \n# $f(1)(2)$\n\n此时，两个值都在作用范围内，可以应用任何计算来得到最终结果。\n\n我在这里使用了一点“大猩猩符号”¹来表达我的观点。使用更符合数学的符号，我们可以通过创建一个新函数\
    \ $a$ 并将 $b$ 映射到 $a+b$ 来显示函数是弯曲的。\n\n# $f(a) = (b \\mapsto a+b)$\n\n如果你熟悉 lambda\
    \ 演算²，你已经知道 $\\lambda ab.a+b$ 是其弯曲形式 $\\lambda a.(\\lambda b.(a+b))$ 的简写。\n\n\
    > 闭包\n> 有趣的是，这种捕获值并使其对第二个函数可用的过程被称为闭包（closure）。当我们提到捕获值的匿名函数或 lambda 时，就使用了闭包这个术语。\n\
    \n# Scala 对柯里函数的支持\n\n一个用于相两个数的普通非柯里函数可能如下：\n\n```\ndef add(x: Int, y: Int): Int\
    \ = x + y\n```\n\nScala 原生支持柯里函数，因此我们不需要进行任何手动转换；我们将其转换为弯曲版本，只需使用括号分隔参数。\n\n```scala\n\
    def add(x: Int)(y: Int): Int = x + y\n```\n\nScala 为我们提供了两个单一参数列表。要评估该函数，我们需要执行如下操作：\n\
    \n```scala\nscala add(1)(2)\nres1: Int = 3\n```\n\n为了直观察效果，我们可以这样评估前半部分：\n\n```scala\n\
    scala val f = add(1) _\nf: Int => <function1>\n```\n\n下划线给 REPL 提供了一个关于我们正在尝试做什么的提示。结果\
    \ `f` 是一个从 `Int` 的函数。值 1 已经被捕获，并对该函数可用。因此我们可以只需执行返回的函数并提供我们的第二个值。\n\n```scala\n\
    scala f(2)\nres2: Int = 3\n```\n\n那么这对于我们的 `runOnUiThread` 方法意味着什么？嗯，如果我们创建一个函数的柯里化版本，就可以重新使用我们喜爱的大括号了。\n\
    \n我们首先将参数分为两部分，以创建原始函数的柯里化形式。\n\n```scala\ndef runInThread(group: String)(function:\
    \ => Unit) {\n  new Thread(group, new Runnable() {\n    run(): Unit = function\n\
    \  })\n  .start()\n}\n```\n\n注意，函数没有其他变化。在 `runInThread` 内部，一切如其初。然而，我们现在可以使用大括号作为第二个参数来更改\
    \ `ui` 对象。\n\n```scala\ndef updateUIElements() {\n  runOnUiThread(\"basket\")\
    \ {\n    applyDiscountToBasket(basket)\n    updateCustomerBasket(basket)\n  }\n\
    \  runOnUiThread(\"customer\") {\n    updateOffersFor(customer)\n  }\n}\n```\n\
    \n# 总结\n\n通过一些内置功能，Scala 允许我们编写看起来像语言构造结构的方法。我们可以使用高阶函数来创建控制抽象：这些函数对复杂行为进行抽象并减少重复，同时为调用它们的代码提供灵活性。\n\
    \n我们可以在任何使用单一参数方法的地方使用大括号。我们可以利用此提供立即即可识别的视觉线索和模式。通过使用内置函数，我们并不局限于将其用于单一参数函数；我们可以通过将多参数函数转换为多个单一参数函数，来创建更丰富的\
    \ API。\n\n- 1. 关于所用符号的讨论可以在 http://bit.ly/1Q2bU6s- 找到\n- 2. 关于关于的一些笔记\n\n# 模式匹配\n\
    \n正如我们所见，模式匹配不仅仅是一个 `switch` 语句。它是一种解构数据并处理不同情况的重要方法。我们已经看到它是如何与字面量、构造函数和提取器工作的。\n\
    \n# 切换\n\n在许多语言中，`switch` 语句根据值对代码分支。在 Scala 中，模式匹配提供了这种功能。让我们来看一些例子。\n\n```scala\n\
    val language = \"French\"\nmatch {\n  case \"French\" => println(\"Salut\")\n\
    \  case \"French\" => println(\"Bonjour\")\n  case \"German\" => println(\"Guten\
    \ Tag\")\n  case => println(\"Hi\")\n}\n```\n\n值必须与示例中的字面量完全匹配。结果将打印“Bonjour”而不是“Salut”，因为匹配值的分支首字母是大写的\
    \ F。匹配是基于相等性的 (==)。\n\n我们还可以使用守卫（guards）来添加条件：\n\n```scala\nval month = \"August\"\
    \nmatch {\n  case \"January\" => 1st quarter\n  case \"March\" => 2nd quarter\n\
    \  case \"September\" => 3rd quarter\n  case \"December\" => 4th quarter\n  case\
    \ => unknown quarter\n}\n```\n\n模式匹配还给了我们类型：\n\n```scala\nval x = 10\nmatch x\
    \ {\n  case i: Int => \"It's an integer: $i\"\n  case s: String => \"It's a string:\
    \ $s\"\n  case _ => \"It's something else\"\n}\n```\n\n最后是提取器：\n\n```scala\ncase\
    \ Person(name: String, age: Int)\nval p = Person(\"Alice\", 30)\nmatch p {\n \
    \ case Person(name, age) if age >= 18 => println(s\"$name is an adult\")\n  case\
    \ Person(name, age) => println(s\"$name is a minor\")\n}\n```\n\n# 构造匹配\n\n"
