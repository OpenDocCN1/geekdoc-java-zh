    For reference types like these, == will delegate to the equals method like before.
    For existing classes like String, equals is already overridden to provide a natural
    notion of equality. For your own classes, you can override the equals just as
    you would in Java, but still be able to use == in code.


    For example, you can compare two strings using == in Scala and it would behave
    just as it would in Java if you used the equals method:


    ```

    new String("A") == new String("A") // true in scala, false in java

    new String("B").equals(new String("B")) // true in scala and java

    ```'
