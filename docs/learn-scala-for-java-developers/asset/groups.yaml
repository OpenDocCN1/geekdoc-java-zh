    \ of List<A> when a generic type is up cast. Java supports covariance but Scala\
    \ supports generic types by using a + when you define a generic class.\n\n```scala\n\
    class List[+T] { }\n```\n\n## Contravariance\n\nContravariance reverses a subtype\
    \ relationship. If A is contravariant, List<A> is also a List<B>; the relationship\
    \ of the parametrised types are reversed for their generic types. Java supports\
    \ covariance but in Scala you just add a - to the generic type definition.\n\n\
    ```scala\nclass List[-T]\n```\n\n## Variance Summary\n\nIn summary, invariant\
    \ generic types are not related, regardless of the relationship of their parametrised\
    \ types. Covariant types maintain the subtype relationship of their parametrised\
    \ types, and contravariant types reverse it.\n\n| Description | |\n| --- | ---\
    \ |\n| Invariant | List<A> and List<B> are not related [A] |\n| Covariant | List<B>\
    \ is a subclass of List<A> [+A] |\n| Contravariant | List<A> is a subclass of\
