    # Language Features


    On our tour we''ve seen some example syntax, walked through the class hierarchy,
    and briefly looked at ScalaDoc, but Scala offers heaps of other interesting language
    features.


    In this chapter, we won''t really talk about syntax but we''ll discuss some of
    the things that make Scala an interesting and powerful language when working with
    source code, working with methods, and using its functional programming features.


    # Working with Source Code


    Source Files. What you put in source files is more flexible in Scala than in Java.
    There''s no restriction on what a .scala contains. A file called customer.scala
    might contain a class called Customer, but it doesn''t have to. Similarly, it
    might contain four classes, none of which are called Customer.


    Packages. Packages are similar. Although they are essentially the same thing as
    Java, classes in packages don''t have to live in folders of the same name as they
    do in Java. There are some differences in scoping; for example, there''s no protected
    keyword in Scala but you can use special syntax (variable[package]) to achieve
    the same thing.


    Import Aliases. Imports are about the same as in Java but once you''ve imported
    a class in Scala, you can rename it your class. In other words, you can create
    an alias for a class within your class. This can be useful when you''ve got a
    name clash, for example between libraries.


    Type Aliases. Scala also supports type aliases. You can give an alias to a complex
    type to clarify the intent. It''s similar to a structureless typedef or #define
    macro in C, or what''s called type synonyms in Haskell.


    Traits. Although Scala has classes and objects, there is no "interface" keyword.
    Instead, there is the idea of a trait which is similar to an interface but can
    have methods. It''s somewhere between Java 8''s default methods and Ruby''s mixins.


    # Working with Methods


    Generics. There''s better support for generic covariance and contravariance in
    Scala than Java. This means that you can be more general and flexible in your
    method signatures when generic types are used as arguments.'
