    \ Customer.nextId()\n}\n```\n\nThe Java analog would have a static factory method,\
    \ for example createCustomer, and a private constructor ensuring everyone is forced\
    \ to use the factory method.\n\n```java\n// java\npublic class Customer {\n  \
    \  private static Integer sequenceOfIds;\n    private final String name;\n   \
    \ private final String address;\n    private Integer id;\n    public static Customer\
    \ createCustomer(String name, String address) {\n        return new Customer(name,\
    \ address);\n    }\n    private Customer(String name, String address) {\n    \
    \    this.name = name;\n        this.address = address;\n        this.id = Customer.nextId();\n\
    \    }\n    private static Integer nextId() {\n        return sequenceOfIds++;\n\
    \    }\n}\n```\n\n## Inheritance\n\nIn this chapter we'll look at inheritance\
    \ in Scala: how you create subclasses and override methods, the Scala equivalent\
    \ of interfaces and abstract classes, and the mechanisms Scala offers for mixing\
