  mdcn: "\n我们在 Scala 中做的是完全相同的事情。这里是基础 `Customer` 类：\n\n```scala\n// scala\nclass\
    \ Customer(val name: String, val address: String) {\n  private val basket: ShoppingBasket\
    \ = new ShoppingBasket\n\n  def add(item: Item) {\n    basket.add(item)\n  }\n\
    \n  def total: Double = {\n    basket.value\n  }\n}\n```\n\n当涉及到将 `Customer` 扩展为\
    \ `DiscountedCustomer` 时，有几需要考虑。首先，我们将创建 `DiscountedCustomer` 类。\n\n如果我们尝试通过扩展\
    \ `Customer` 来创建 `DiscountedCustomer`，将会得到编译错误\n\n我们得到编译错误是因为我们需要带上参数值来调用 `Customer`\
    \ 构造函数。在 Java 的新构造函数中调用 `super` 时，我们也必须执行这样做。\n\nScala 有主构造函数和辅助构造函数。辅助构造函数必须链式调用主构造函数，而且在\
    \ Scala 中，只有主构造函数可以调用父类的构造函数。我们可以为主构造函数添加参数，例如：\n\n```scala\nDiscountedCustomer(name:\
    \ String, address: String) extends Customer\n```\n\n但我们不能像在 Java 中那样直接调用 `super`。\n\
    \n```scala\nDiscountedCustomer(val name: String, val address: String)\n  extends\
    \ Customer {\n  super(name, address) // compiler error\n}\n```\n\n在 Scala 中，要调用父类构造函数，我们将主构造函数的参数传递给父类。注意，`discountedCustomer`\
    \ 的参数没有被设置为 `val`。它们不是字段；它们作用域于主构造函数内部，并直接传递给父类。\n\n```scala\nDiscountedCustomer(name:\
    \ String, address: String)\n  extends Customer(name, address)\n```\n\n最后，我们可以在子类中实现折扣后的\
    \ `total` 方法。\n\n```scala\noverride def total: Double = {\n  super.total * 0.90\n\
    }\n```\n\n这里有两点注意：`override` 关键字是必须的，而且调用父类的 `total` 方法时，我们使用 `super` 加点符号，这和\
    \ Java 一样。\n\n`override` 关键字相当于 Java 中的 `@override` 注解。它允许编译器检查错误，例如拼错方法名或提供错误的参数。Java\
    \ 注解与 Scala 之间的真正区别在于，当重写非抽象方法时，在 Scala 中是强制性的。\n\n# 匿名类\n\n你创建匿名子类的方式与 Java 类似。\n\
    \n在 Java 版本的 `ShoppingBasket` 类中，`add` 方法接收一个 `Item` 接口。因此，要向你的购物篮中添加物品，你可以创建一个\
    \ `Item` 的匿名子类型。下面，我们创建了一个程序向 Joe 的购物篮中添加两个固定价格的物品。每个物品都是 `Item` 的匿名子类。购物篮的总折扣额将是\
    \ $5.40。\n\n```java\n// java\npublic class ShoppingBasket {\n    private final\
    \ Set<Item> basket = new HashSet<>();\n\n    public void add(Item item) {\n  \
    \      basket.add(item);\n    }\n\n    public Double value() {\n        return\
    \ basket.stream().mapToDouble(Item::price).sum();\n    }\n}\n// java\npublic class\
    \ TestDiscount {\n    public static void main(String... args) {\n        Customer\
    \ joe = new DiscountCustomer(\"Joe\", \"128 Bullpen Street\");\n        joe.add(new\
    \ Item() {\n            @Override\n            public Double price() {\n     \
    \           return 2.5;\n            }\n        });\n        joe.add(new Item()\
    \ {\n            @Override\n            public Double price() {\n            \
    \    return 3.5;\n            }\n        });\n        System.out.println(\"Joe's\
    \ basket will cost $ \" + joe.total());\n    }\n}\n```\n\n在 Scala 中，几乎是一样的。在实例化\
    \ `Item` 时，可以在类名后加上括号，并使用 `price` 方法签名中的类型。`price` 方法前的 `override` 关键字是可选的。\n\n\
    ```scala\nobject DiscountedCustomer {\n  def main(args: Array[String]) {\n   \
    \ val joe = new DiscountCustomer(\"Joe\", \"128 Bullpen Street\")\n    joe.add(new\
    \ Item {\n      def price = 2.5\n    })\n    joe.add(new Item {\n      def price\
    \ = 3.5\n    })\n    println(\"Joe's basket will cost $\" + joe.total())\n  }\n\
    }\n```\n\n你以相同的方式创建匿名类、抽象类或 Scala 的 trait。\n\n# 接口 / 特性 (Traits)\n\nJava 中的接口与\
    \ Scala 中的 trait 相似。你可以以与接口类似的方式使用 trait。你可以在类中实现特定的行为，但仍然以多态的方式处理它们。但是：\n\n-\
    \ trait 可以拥有方法的默认实现。这些类似于 Java 8 的扩展方法（也称为默认方法），但 Java 之前没有对应物。\n- trait 还可以拥有字段，甚至是默认值，这是\
    \ Java 接口无法做到的。因此，trait 既可以拥有抽象方法也可以拥有具体方法以及状态。\n- 一个类可以实现多个 trait，就像类可以实现多个接口一样，尽管\
    \ Scala 中扩展带默认实现的 trait 更像是行为的混合（mixins）。\n- 这与 Java 8 有重叠，因为你可以在 Java 8 中混合行为，尽管在语义和处理冲突方面存在某些差异。\n\
    \n在本节中，我们将更详细地查看这些差异。\n\n在 Java 中，我们可能会创建一个名为 `Readable` 的接口来读取和拷贝某些数据；在 Scala\
    \ 中，我们可能会创建一个名为 `Readable` 的 trait 来读取和拷贝某些数据。在 Java 中，我们可能会创建一个名为 `Readable`\
    \ 的接口来读取和拷贝某些数据；在 Scala 中，我们可能会创建一个名为 `Readable` 的 trait 来读取和拷贝某些数据。\n\n在 Scala\
    \ 中，我们可能会使用 trait 来定义接口。\n\n"
