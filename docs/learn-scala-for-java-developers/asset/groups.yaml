  - "[PAGE 114]\n\n# Pattern Matching\n\nAs well as providing switch-like functionality\
    \ (that’s more powerful than Java’s version), pattern matching offers a rich set\
    \ of “patterns” that can be used to match against. In this chapter, we look at\
    \ the anatomy of patterns and talk through some examples, including literal, constructor\
    \ and type query patterns.\n\nPattern matching also provides the ability to deconstruct\
    \ matched objects, giving you access to parts of a data structure. We'll look\
    \ at the mechanics of deconstruction: extractors, which are basically objects\
    \ with the special method unapply implemented.\n\n# Switching\n\nLet's start by\
    \ looking at the pattern match expression from earlier.\n\n```\nval month = \"\
    August\"\nval quarter = month match {\n  case \"January\" | \"March\" => \"1st\
    \ quarter\"\n  case \"April\" | \"May\" | \"June\" => \"2nd quarter\"\n  case\
    \ \"July\" | \"August\" | \"September\" => \"3rd quarter\"\n  case \"October\"\
    \ | \"December\" => \"4th quarter\"\n  case => \"unknown quarter\"\n}\n```\n\n\
    There are several key differences between Java’s switch and Scala’s match expression:\n\
    \n+   - There is no fall-through behaviour between cases in Scala. Java uses breaks\
    \ to avoid a fall-through but Scala breaks between each case automatically.\n\
    - In Scala, a pattern match is an expression; it returns a value. Java switches\
    \ must have side effects to be useful.\n- We can switch on a wider variety of\
    \ things with Scala, not just primitives, enums and strings. We can switch on\
    \ objects, and things that fit a “pattern” of our own design. In the example,\
    \ we’re using “or” to build a richer match condition.\n\nPattern matching also\
    \ gives us:\n\n+   - The ability to guard the conditions of a match; using an\
    \ if, we can enrich a case to match only on the pattern (the part right after\
    \ the case) but also on some binary condition.\n- Exceptions for failed matches;\
    \ when a value doesn’t match anything at runtime, Scala will throw a MatchError\
    \ exception letting know.\n- Optional compile-time checks: you can set it so that\
    \ if you forget to write a case to match all possible combinations, you’ll get\
    \ a compiler warning. This is done using what’s sealed traits.\n\n# Patterns"
  - "[PAGE 115]\n\nThe anatomy of a match expression looks like this:\n\n```\nvalue\
    \ match {\n  case pattern guard => expression\n  ...\n  case => default\n}\n```\n\
    \nSo we have a value, then the match keyword, followed by a series of match cases.\
    \ The value itself can be an expression, a literal or even an object.\n\nEach\
    \ case is made up of a pattern, optionally a guard condition, and the expression\
    \ to evaluate on a successful match.\n\nYou might add a default, catch-all pattern\
    \ at the end. The underscore is our first example of an actual pattern. It’s the\
    \ wildcard pattern and means “match on anything”.\n\nA pattern can be:\n\n+  \
    \ * A wildcard match (.).\n* A literal match, meaning equality, used for values\
    \ such as 101 or RED.\n* A constructor match, meaning that a value would match\
    \ if it could have been created using a specific constructor.\n* A deconstruction\
    \ match, otherwise known as an extractor pattern.\n* A match based on a specific\
    \ type, known as a type query.\n* A pattern with alternatives (specified with\
    \ |).\n\nPatterns can also include a variable name, which on matching will be\
    \ available to the expression on the right-hand side. It’s referred to as a variable\
    \ ID in the language specification.\n\nThere are some more which I’ve left off;\
    \ if you’re interested in the Pattern Matching section of the Scala Language Specification.\n\
    \n# Literal Matches\n\nA literal match is a match against any Scala literal. The\
    \ example below uses string literal and has similarities to a Java statement.\n\
    \n```\nval language = \"French\"\nmatch {\n  case \"French\" => println(\"Salut\"\
    )\n  case \"French\" => println(\"Bonjour\")\n  case \"German\" => println(\"\
    Guten Tag\")\n  case => println(\"Hi\")\n}\n```\n\nThe value must exactly match\
    \ the literal in the example. The result will be to print “Bonjour” and not “Salut”\
    \ as the match value case has a capital F. The match is based on equality (==).\n\
    \n# Constructor Matches"
- md: "\nConstructors allow you to match a case against how an object was constructed.\
    \ Let's say we have a SuperHero class that looks like this:\n\n```scala\ncase\
    \ class\n  SuperHero(herName: String, alterEgo: String, powers: List[Ability])\n\
    ```\n\nIt's a regular class with three constructor arguments, but the keyword\
    \ case at the beginning designates it as a case class. For now, that just means\
    \ Scala will automatically supply a bunch of useful methods for us, like hashCode,\
    \ equals, and toString.\n\nGiven this and its fields, we can create a match expression\
    \ like this:\n\n```scala\nobject BasicConstructorPatternExample extends App (\n\
    \  val hero =\n    new SuperHero(\"Batman\", \"Bruce Wayne\", List(Speed, Agility,\
    \ Strength))\n\n  hero match {\n    case SuperHero(_, \"Bruce Wayne\", _) => println(\"\
    I'm Batman!\")\n    case SuperHero(_, _, _) => println(\"???\")\n  }\n)\n```\n\
    \nUsing a constructor pattern, it will match any case for whose alterEgo fields\
    \ value \"Bruce Wayne\" and print \"I'm Batman\". For everyone else, it'll print\
    \ question marks.\n\nThe underscores are used as placeholders for the constructor\
    \ arguments; you need three on the second case (line 7) because the constructor\
    \ has three arguments. The underscore means you don't care what the values are.\
    \ Putting the value \"Bruce Wayne\" on line 6 means you do care and that the second\
    \ argument to the constructor must match it.\n\nWith constructor patterns, the\
    \ value must also match the type. Let's say that SuperHero is a subtype of a Person.\n\
    \n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_117_0.png)\n\n**Fig. 3.2. SuperHero**\
    \ is a subtype of Person.\n\nIf the hero variable was actually an instance of\
    \ Person and not a SuperHero, nothing would match. In the case no match, you'd\
    \ see a MatchError exception at runtime. To avoid the MatchError, you'd need to\
    \ allow non-SuperHero types to match. To do that, you could use a wildcard as\
    \ a default.\n\n```scala\nobject BasicConstructorPatternExample extends App {\n\
    \  val hero = new Person(\"Joe Ordinary\")\n\n  hero match {\n    case SuperHero(_,\
    \ \"Bruce Wayne\", _) => println(\"I'm Batman!\")\n    case SuperHero(_, _, _)\
    \ => println(\"???\")\n    case _ => println(\"I'm a civilian, don't shoot!\"\
    )\n  }\n}\n```\n\nPatterns can also bind a matched value to a variable. Instead\
    \ of just matching against a literal (like \"Bruce Wayne\") we can use a variable\
    \ as a placeholder and catch a matched value in the expression on the right-hand\
    \ side. For example, we could ask the question:\n\n> What super-powers does another\
    \ unknown person have, if they are a superhero with the alter-ego Bruce Wayne?\n\
    \n```scala\ndef superPowersFor(person: Person) = {\n  person match {\n    case\
    \ SuperHero(_, \"Bruce Wayne\", powers) => powers\n    case _ => List()\n  }\n\
    }\n```\n\nprintln(\"Bruce has the following powers \" + superPowersFor(person))\n\
    \nWe're still matching only on types of SuperHero with a literal match against\
    \ their alter-ego, but this time we underscore the last position on line 3 is\
    \ replaced with the variable powers. This means we can use the variable on the\
    \ right-hand side. In this case, we just return it to the answer.\n\nVariable\
    \ binding is one of pattern matching's key strengths. In practice, it doesn't\
    \ make sense to use a literal like \"Bruce Wayne\" as it limits the application.\
    \ Instead, you're more likely to replace it with either a literal or wildcard\
    \ pattern.\n\n```scala\nobject HeroConstructorPatternExample extends App {\n \
    \ def superPowersFor(person: Person) = {\n    match {\n      case SuperHero(_,\
    \ powers) => powers\n      case _ => List()\n    }\n  }\n}\n```\n\nYou'd use values\
    \ from the match object as input. To find out powers Bruce Wayne, you'd pass in\
    \ a SuperHero instance for Bruce.\n\n```scala\nval bruce =\n  new SuperHero(\"\
    Batman\", \"Bruce Wayne\", List(Speed, Agility, Strength))\nprintln(\"Bruce has\
    \ the following powers \" + superPowersFor(bruce))\n```\n\nThe example is a little\
    \ constrained as we've made the matching pattern to return something we already\
    \ know. For more general, you could also find out any superhero or regular pattern.\n\
    \n```scala\nval steve =\n  new SuperHero(\"Captain America\", \"Steve Rogers\"\
    , List(Tactics, Speed))\nval jayne =\n  new Person(\"Jayne Doe\")\n\nprintln(\"\
    Steve has the following powers \" + superPowersFor(steve))\nprintln(\"Jayne has\
    \ the following powers \" + superPowersFor(jayne))\n```\n\n# Constructor Patterns\n\
    \nNote that constructor patterns work on classes. Technically, this is because\
    \ they automatically implement a special method called unapply.\n\n# Type Query\n\
    \nUsing a constructor pattern, you can implicitly match against a type and access\
    \ its fields. If you don't know the fields, you can use type query to match against\
    \ the type. For example, we could create a method nameFor to give us a person\
    \ or if they're a superhero, we'd get either their name or alter ego.\n\n```scala\n\
    object TypePatternExample extends App {\n  val batman =\n    new SuperHero(\"\
    Batman\", \"Bruce Wayne\", List(Speed, Agility, Strength))\n  val cap =\n    new\
    \ SuperHero(\"Captain America\", \"Steve Rogers\", List(Tactics, Speed))\n  val\
    \ jayne =\n    new Person(\"Jayne Doe\")\n\n  def nameFor(person: Person) = {\n\
    \    person match {\n      case hero: SuperHero => hero.alterEgo\n      case person:\
    \ Person => person.name\n    }\n  }\n\n  println(\"Batman alter ego is \" + nameFor(batman))\n\
    \  println(\"Captain America's alter ego is \" + nameFor(cap))\n  println(\"Jayne's\
    \ alter ego is \" + nameFor(jayne))\n}\n```\n\nRather than a sequence of instanceof\
    \ checks by cast, you can specify a variable and type. In the expression that\
    \ follows the arrow, the variable can be used as an instance of that type. When\
    \ you use pattern matching to deal with exceptions in try and catch, it's actually\
    \ type queries that are used.\n\n```scala\ntry {\n  var url = new URL(\"http://bad.com\"\
    )\n  var reader = new BufferedReader(url.getInputStream)\n  var line: String =\
    \ reader.readLine()\n  while (line != null) {\n    line = reader.readLine()\n\
    \  }\n  println(line)\n} catch {\n  case _: MalformedException => println(\"Bad\
    \ URL\")\n  case e: IOException => println(\"Problem reading data: \" + e.getMessage)\n\
    }\n```\n\nThe underscore in the MalformedException match shows that you can use\
    \ wildcard with type queries if you're not interested in the value.\n\n# Deconstruction\
    \ Matches and unapply\n\nIt's common to implement the method as a factory-style\
    \ creation method; a method taking arguments and giving back a new instance. You\
    \ can think of the special unapply method as the opposite of this. It takes an\
    \ instance and extracts values from it; usually the values that you want to construct\
    \ it.\n\napply (a, b) -> object (a, b)\nunapply (object (a, b)) -> a, b\n\nBecause\
    \ they extract values, objects that implement unapply are referred as extractors.\
    \ Given an object, an extractor typically extracts the parameters that would have\
    \ created that object.\n\nSo if we want to use our Customer in a match expression,\
    \ we'd add an unapply method to its companion object.\n\n```scala\nclass Customer(val\
    \ name: String, val address: String)\n\nobject Customer {\n  def unapply\n}\n\
    ```\n\nAn unapply method always takes an instance of the object you’d like to\
    \ deconstruct, in our case a Customer.\n\n```scala\nobject Customer {\n  def unapply(customer:\
    \ Customer) = ???\n}\n```\n\nIt should return either the extracted parts of the\
    \ object or something to indicate it couldn’t be reconstructed. In Scala, rather\
    \ than return a null to represent this, we return the Option of a result. It’s\
    \ the same idea as the Option in Java.\n\n```scala\nobject Customer {\n  def unapply(customer:\
    \ Customer): Option[???] = ???\n}\n```\n\nThe last piece of the puzzle is to work\
    \ out what can be extracted from the object: the type to put in the Option parameter.\
    \ If you wanted to be able to extract just the customer name, the return would\
    \ be Option[String], but we want to be able to extract both the name and address\
    \ (and therefore be able to match on both name and address in a match expression).\n\
    \nThe answer is to return a tuple, the data structure we saw earlier. It’s a way\
    \ of returning multiple pieces of data in a single type.\n\n```scala\nobject Customer\
    \ {\n  def unapply(customer: Customer): Option[(String, String)] = {\n    Some((customer.name,\
    \ customer.address))\n  }\n}\n```\n\nWe can use a pattern match with our customer.\n\
    \n```scala\nval customer = new Customer(\"Bob\", \"1 Church street\")\ncustomer\
    \ match {\n  case Customer(name, address) => println(name + \" \" + address)\n\
    }\n```\n\nYou’ll notice that this looks like our constructor pattern example.\
    \ That’s because essentially we used a case class before which added an unapply\
    \ method for us. This time, we created it ourselves. It’s both an extractor and\
    \ there’s a symmetry with the constructor, a pattern constructor. More specifically,\
    \ the list of values to extract in a pattern must match those in a class’s primary\
    \ constructor to be called a constructor pattern. See [the language spec](https://docs.scala-lang.org/tour/patterns/)\
    \ for details.\n\n# Why Write Your Own Extractors?\n\nWhy would you implement\
    \ your own extractor method (unapply) when case classes already have one? It might\
    \ be simply because you can’t or don’t want to use a case class or you may not\
    \ want the match behaviour of a case class; you might want custom\n"
  mdcn: "\n构造器允许你根据对象的构建方式来匹配情况。假设我们有一个如下所示的 SuperHero 类：\n\n```scala\ncase class\n\
    \  SuperHero(herName: String, alterEgo: String, powers: List[Ability])\n```\n\n\
    这是一个带有三个构造器参数的普通类，但开头的 `case` 关键字将其指定为一个例类（case class）。目前，这意味着 Scala 将自动为我们提供一系列实用的方法，如\
    \ `hashCode`、`equals` 和 `toString`。\n\n根据这些及其字段，我们可以创建一个这样的匹配表达式：\n\n```scala\n\
    object BasicConstructorPatternExample extends App (\n  val hero =\n    new SuperHero(\"\
    Batman\", \"Bruce Wayne\", List(Speed, Agility, Strength))\n\n  hero match {\n\
    \    case SuperHero(_, \"Bruce Wayne\", _) => println(\"I'm Batman!\")\n    case\
    \ SuperHero(_, _, _) => println(\"???\")\n  }\n)\n```\n\n使用构造器模式，它将匹配任何 `alterEgo`\
    \ 字段值为 \"Bruce Wayne\" 的情况，并打印 \"I'm Batman\"。对于其他人，它将打印问号。\n\n下划线被用作构造器参数的占位符；在第二个情况（第\
    \ 7 行）你需要三个下划线，因为构造器有三个参数。下划线意味着你不在乎值是什么。在第 6 行放置值 \"Bruce Wayne\" 意味着你在意，并且构造器的第二个参数必须与之匹配。\n\
    \n使用构造器模式时，值也必须匹配类型。假设 SuperHero 是 Person 的子类。\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_117_0.png)\n\
    \n**图 3.2. SuperHero** 是 Person 的子类。\n\n如果 `hero` 变量实际上是 Person 的实例而不是 SuperHero，则将没有任何项被匹配。在没有匹配的情况下，你会在运行时看到\
    \ `MatchError` 异常。为了避免 `MatchError`，你需要允许非 SuperHero 类型进行匹配。为了做到，你可以使用通配符作为默认值。\n\
    \n```scala\nobject BasicConstructorPatternExample extends App {\n  val hero =\
    \ new Person(\"Joe Ordinary\")\n\n  hero match {\n    case SuperHero(_, \"Bruce\
    \ Wayne\", _) => println(\"I'm Batman!\")\n    case SuperHero(_, _, _) => println(\"\
    ???\")\n    case _ => println(\"I'm a civilian, don't shoot!\")\n  }\n}\n```\n\
    \n模式还可以将匹配到的值绑定到变量。与其仅仅与字面量（如 \"Bruce Wayne\"）进行匹配，我们可以使用变量作为占位符，并在表达式的右侧捕获匹配到的值。例如，我们可以提问：\n\
    \n> 如果另一个未知的人是一个化名为 Bruce Wayne 的超级英雄，他们拥有哪些超能力？\n\n```scala\ndef superPowersFor(person:\
    \ Person) = {\n  person match {\n    case SuperHero(_, \"Bruce Wayne\", powers)\
    \ => powers\n    case _ => List()\n  }\n}\n```\n\nprintln(\"Bruce has the following\
    \ powers \" + superPowersFor(person))\n\n我们仍然只对 SuperHero 的类型进行匹配，并对他们的 `alterEgo`\
    \ 进行字面量匹配，但这次第 3 行的最后一个下划线被变量 `powers` 替换了。这意味着我们可以在右侧使用该变量。在这种情况下，我们只需将其作为答案。\n\
    \n变量绑定是模式匹配的关键优势之一。在实践中，使用像 \"Bruce Wayne\" 这样的字面量是没有意义的，因为它限制了应用。相反，你更有可能将其替换为字面量或通配符模式。\n\
    \n```scala\nobject HeroConstructorPatternExample extends App {\n  def superPowersFor(person:\
    \ Person) = {\n    match {\n      case SuperHero(_, powers) => powers\n      case\
    \ _ => List()\n    }\n  }\n}\n```\n\n你会使用来自 `match` 对象的值作为输入。为了找出 Bruce Wayne\
    \ 的能力，你会传入一个 SuperHero 实例。\n\n```scala\nval bruce =\n  SuperHero(\"Batman\", \"\
    Bruce Wayne\", List(Speed, Agility, Strength))\nprintln(\"Bruce has the following\
    \ powers \" + superPowersFor(bruce))\n```\n\n这个示例有点限制，因为我们使用了匹配模式来返回我们已经已知的东西。为了更通用，你也可以使用通配符模式来查找任何超级英雄或模式。\n\
    \n```scala\nval steve =\n  SuperHero(\"Captain America\", \"Steve Rogers\", List(Tactics,\
    \ Speed))\nval jayne =\n  new Person(\"Jayne Doe\")\n\nprintln(\"Steve has the\
    \ following powers \" + superPowersFor(steve))\nprintln(\"Jayne has the following\
    \ powers \" + superPowersFor(jayne))\n```\n\n# 构造器模式\n\n注意构造器模式作用于类。技术上，这是因为它们自动实现了一个名为\
    \ `unapply` 的特殊方法。\n\n# 类型查询\n\n使用构造器模式可以隐式地匹配类型并访问其字段。如果你不知道字段，可以使用类型查询来匹配类型。例如，如果是超级英雄，我们可以创建一个\
    \ `nameFor` 方法来获取他们的名字或化名。\n\n```scala\nobject TypePatternExample extends App\
    \ {\n  val batman =\n    new SuperHero(\"Batman\", \"Bruce Wayne\", List(Speed,\
    \ Agility, Strength))\n  val cap =\n    new SuperHero(\"Captain America\", \"\
    Steve Rogers\", List(Tactics, Speed))\n  val jayne =\n    new Person(\"Jayne Doe\"\
    )\n\n  def nameFor(person: Any) = {\n    person match {\n      case hero: SuperHero\
    \ => hero.alterEgo\n      case person: Person => person.name\n    }\n  }\n\n \
    \ println(\"Batman alter is \" + nameFor(batman))\n  println(\"Captain America's\
    \ alter ego is \" + nameFor(cap))\n  println(\"Jayne's alter ego is \" + nameFor(jayne))\n\
    }\n```\n\n与其通过 `instanceof` 序列检查，你可以指定变量和类型。在箭头后面的表达式中，变量可以作为该类型的实例。当你使用模式匹配处理\
    \ `try` 和 `catch` 中的异常时，实际上使用的是类型查询。\n\n```scala\ntry {\n  var url = new URL(\"\
    http://bad.com\")\n  var reader = new BufferedReader(url.getInputStream)\n  var\
    \ line: String = reader.readLine()\n  while (line != null) {\n    line = reader.readLine()\n\
    \  }\n  println(line)\n} catch {\n  case _: MalformedException => println(\"Bad\
    \ URL\")\n  case e: IOException => println(\"Problem reading data: \" + e.getMessage)\n\
    }\n```\n\nMalformedException match 中的下划线显示，如果你不在值，可以使用类型查询。\n\n# 解构匹配与 unapply\n\
    \n将方法实现为工厂风格是很常见的：接收参数并返回新实例。你可以将特殊的 `unapply` 方法视为此相反的操作。它接收一个实例并从中提取值；通常是你想要构造它的值。\n\
    \napply (a, b) -> object (a, b)\nunapply (object (a, b)) -> a, b\n\n由于它们提取值，实现\
    \ `unapply` 的对象被称为提取器（extractors）。给定一个对象，提取器通常会提取创建该对象的参数。\n\n所以，如果我们想在匹配表达式中使用\
    \ `Customer`，我们会在它的伴侣对象中添加一个 `unapply` 方法。\n\n```scala\nclass Customer(val name:\
    \ String, val address: String)\n\nobject Customer {\n  def unapply(customer: Customer):\
    \ (String, String) = (customer.name, customer.address)\n}\n```\n\n`unapply` 方法总是接收你想要解构的对象实例，在本例中是\
    \ `Customer`。\n\n```scala\nobject Customer {\n  def unapply(customer: Customer)\
    \ = ???\n}\n```\n\n它应该返回对象的提取部分，或者返回一个指示无法重构的内容。在 Scala 中，而不是返回 `null` 来表示这一点，我们返回结果的\
    \ `Option`。这与 Java 中的 `Option` 概念相同。\n\n```scala\nobject Customer {\n  def unapply(customer:\
    \ Customer): Option[???] = ???\n}\n```\n\n拼图的最后一块碎片是确定从对象中可以提取什么：即放入 `Option`\
    \ 参数的类型。如果你想要只提取客户名称，返回将是 `Option[String]`，但我们想要能够提取名字和地址（因此可以在匹配表达式中同时匹配名字和地址）。\n\
    \n答案是返回一个元组，我们之前看到的数据结构。这是在单一类型中返回多个数据的方法。\n\n```scala\nobject Customer {\n  def\
    \ unapply(customer: Customer): Option[(String, String)] = {\n    Some((customer.name,\
    \ customer.address))\n  }\n}\n```\n\n我们可以对我们的 `customer` 使用模式匹配。\n\n```scala\n\
    val customer = new Customer(\"Bob\", \"1 Church street\")\ncustomer match {\n\
    \  case Customer(name, address) => println(name + \" \" + address)\n}\n```\n\n\
    你会注意到这看起来像我们的构造器模式示例。这是因为我们之前使用了例类，它为我们添加了 `unapply` 方法。这次，是我们自己创建了它。它既是一个提取器，与构造器（模式构造器）之间存在对称性。更具体地说，模式中要提取的值列表必须与类的主构造器相匹配，才能被称为构造器模式。详情请参阅[语言规范](https://docs.scala-lang.org/tour/patterns/)。\n\
    \n# 为什么要编写自己的提取器？\n\n既然例类已经有提取器了，你为什么还要实现自己的提取器方法（unapply）呢？可能仅仅是因为你不能或不想使用例类，或者你可能想要例类的匹配行为；你可能想要自定义\n"
