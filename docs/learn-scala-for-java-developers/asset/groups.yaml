    \ a method call at runtime, whereas Java 8 relies on compilation failure.\n\n\
    Linearization means the order in which traits are defined in a class definition\
    \ is important. For example, we could have the:\n\n```scala\nclass Animal\ntrait\
    \ HasWings extends Animal\ntrait Bird extends HasWings\ntrait FourLegs extends\
    \ Animal\n```\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_70_0.png)\n\nFig. 2.1.\
