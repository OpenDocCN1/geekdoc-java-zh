    \n在语言特性方面，我们查看了在处理源文件和包、方法和方法参数，以及面向函数式编程的一些语言特性。\n\n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_35_0.png)\n\
    \n# 图 1.11. 第一部分总结。\n\n# II. 关键语法差异\n\n书的这部分关于 Java 和 Scala 语言语法之间的关键差异。通过一些典型的\
    \ Java 代码，我们将查看等等的 Scala 语法。在第三部分中，我们将更多关注 Java 中没有直接等价物的 Scala 特性。\n\n我们将查看：\n\
