    \  val numbers = scala.collection.mutable.Map(\n    \"Athos\" -> \"7781 456782\"\
    ,\n    \"Aramis\" -> \"7781 823422\",\n    \"Porthos\" -> \"1471 342383\",\n \
    \   \"D Artagnan\" -> \"7715 632982\"\n  )\n}\n```\n\nIf we decide the shorthand\
    \ or default behaviour of the directory to return the phone number of a customer,\
    \ we can implement the apply method as follows:\n\n```\ndef apply(name: String)\
    \ = {\n  numbers.get(name)\n}\n```"
