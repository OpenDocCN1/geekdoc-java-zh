    \ that would otherwise compile. As long as the function conforms to the (A, A)\
    \ => Int signature, the compiler will detect that it is converted to something\
    \ that compiles and call our implicit method to do. We can then modify the sort\
    \ method of CustomersSortBySpend like this:\n\n```\n// scala\nthis.list.sorted((a:\
    \ Customer, b: Customer) => b.total.compare(a.total))\n```\n\n...passing in a\
    \ lambda rather than an anonymous class. It's very similar to the equivalent of\
