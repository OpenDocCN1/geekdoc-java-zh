  - '[PAGE 33]


    For comprehensions. For comprehensions are subtly different than regular loops,
    and are useful when working with functional constructs. When you first encounter
    them, they''ll look like an alternative syntax to Java''s for loop.


    **Currying.** Although you can write your own currying functions in any language,
    Scala supports currying as a language feature. If you''re unsure what currying
    is, you probably don''t need to worry about it right now. See the currying chapter
    for more details.


    **Functional Literals.** The language supports literals to represent some useful
    types like tuples. Popular Java functional libraries like totally-lazy and functional-java
    have these kinds of things; Scala just makes them easier to work with.


    **Recursion.** Most languages support recursion, but Scala has compiler support
    for tail call optimisation, which means it can support recursive calls that would
    result in a stack overflow in languages like Java. The compiler can even perform
    some checks for you if you use the @tailrec annotation.'
  - '[PAGE 34]


    # Summary


    In this high-level tour, we talked about how Scala is both an OO language and
    a functional language. I mentioned that Scala in fact only has objects; there
    are no primitives, everything is an object.


    We talked about Scala''s background, how it grew from an academic language to
    a commercially backed mainstream language, and how it runs on the JVM. This, in
    theory, lowers the barrier of adoption by making it easy to deploy to existing
    servers.


    Running on the JVM also means there are plenty of libraries available to Scala,
    as Java interoperability is baked in. Despite some of the tools being behind and
    compilation time being slow, Scala has been widely adopted and we see numerous
    big companies using it today.


    We had a look at installing and running Scala. You saw the three ways Scala programs
    are typically run, and along the way we were introduced to the Scala REPL.


    We moved on to a syntax tour and looked at some interesting language features.


    In the syntax tour, we saw how to define variables and values, functions and methods,
    and saw how Scala reduces the boilerplate noise by inferring types and recognising
    terminating conditions return and semicolons automatically.


    We saw how infix notation means you can avoid the classical dot notation and importantly,
    we saw that method names can contain symbols. That''s how we''re able to use mathematical
    symbols naturally in code; they''re actually methods so we can override them and,
    using the infix notation, without using the noisy dots and brackets.


    We also worked with some collection types and saw a couple of basic ways to enumerate
    them: the foreach and for loop syntax. We saw how easy it is to work with Java
    objects; value types like Int and Boolean are basically the same in Scala and
    Java. We had a good look at how Scala represents types in its class hierarchy,
    and how to look things up in the ScalaDoc.


    In terms of language features, we looked at some interesting aspects of the language
    when working with source files and packages, methods and method arguments, as
    well as some features geared up for functional programming.'
