    # # Generics


    In this chapter we''ll look at generics or type *parameterisation* or generic
    programming in Scala. We''ll look at:


    +   - Syntax for generics: defining types and methods

    - Bounded types, extends and super

    - Wildcards in both Java and Scala

    - Covariance and contravariance


    # ## Parametric Polymorphism


    We talked briefly about subtype or *inclusion* polymorphism, the idea that subtypes
    can be substituted to stand for their super-types. These stand-ins can provide
    different behaviour without changing the structure of your code. The types of
    polymorphism include:


    +   - Inclusion polymorphism (see the Inheritance chapter)

    - Ad hoc polymorphism (which is basically method overloading)

    - Parametric polymorphism


    Parametric polymorphism allows us to write code generically without depending
    on specific types, yet still maintain type safety. We use it all time we work
    with classes that work against multiple types. For example:


    ```

    List<Customer> customers = new ArrayList<>(); // java

    ```


    Parametric polymorphism will be familiar if you''ve ever created a list of something
    in Java. It''s more commonly referred to as generics; by giving a generic type
    (like List) a parameter, we can treat it as a list yet refer to its contents in
    a type-safe way. Generics are apply even if you don''t specify the parametrised
    type in Java. So although you write the following:


    ```

    List collection = new ArrayList(); // java

    ```


    You''re actually creating a generic list of type Object.


    ```

    List<Object> collection = new ArrayList<>(); // java

    ```


    # ### Diamond Operator


    You can create a list of Object in Java like this:


    ```

    List<Object> collection = new ArrayList<>();

    ```


    The diamond operator (<>) on the right-hand side of the assignment above was new
    in Java 7. Before Java 7, you were forced to repeat the generic type declaration
    on the right-hand side.


