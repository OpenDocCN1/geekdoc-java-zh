    \ we can remove the type hints when calling the sort method.\n\n```\nvar enclosure\
    \ = List[Lion]()\nenclosure = new Lion + enclosure\nenclosure = new Lion +: enclosure\n\
    sort(enclosure)\n```\n\nIn Scala, you can set both a lower and upper bound using\
    \ > and <, like this:\n\n```\ndef example[A > Lion](a: A) = () // scala\n  lower\
    \ upper\n```\n\n...where A must be a super-type of Lion and a subtype of Animal.\n\
    \n# # Variance\n\nWithout generics, a generic class b that extends A can be assigned\
