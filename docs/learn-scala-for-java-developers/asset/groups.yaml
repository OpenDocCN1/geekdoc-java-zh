    List<?> list // java\n```\n\n...and like this in Scala:\n\n```\nList[_] // scala\n\
    ```\n\nAn unbounded wildcard refers to an unknown generic type. For example, printing\
    \ elements of an unknown type will work with all lists. Just add upper- or lower-bound\
    \ constraints to limit the options.\n\n```\n// java\nvoid printUnknown(List<?>\
    \ list) {\n  for (Object element : list) {\n    System.out.println(element);\n\
    \  }\n}\n```\n\n```\n// scala\ndef printUnknown(list: List[_]) {\n  for (e <-\
    \ list) {\n    val f: Any = e\n    println(f)\n  }\n}\n```\n\nAlthough the implementation\
    \ can treat the elements as Object because everything is an object, you can't\
