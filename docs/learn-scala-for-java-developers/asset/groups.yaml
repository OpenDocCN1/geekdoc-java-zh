    # III. BEYOND JAVA TO SCALA


    This part of the book is all about the differences between Scala and Java. There
    are plenty of language features in Scala that don''t have an obvious analog in
    Java. In this part, we''ll take a closer look at those and explore what Scala
    can give us over Java.


    Specifically, we''ll explore some of the language features that make writing Scala
    more expressive and we''ll look at some of the more functional programming idioms
    that Scala is so well for.


    # Expressive Scala


    Scala offers several features that make writing code more concise. As well as
    some we''ve already seen, it provides mechanisms to:


    +   * Methods look like functions using the special case apply method.

    * Provide default behaviour for the assignment operator using a special case update
    method.

    * Make regular method calls look like language structures, which in effect means
    you can define your own control structures.


    Scala also offers pattern matching; we''ll look at the unapply method and its
    role in pattern matching.


    # Functional Programming Idioms


    We''ll also look at some of functional programming aspects of Scala.


    +   * Built-in methods for mapping values (map, flatMap).

    * What Monads are and why you should care.

    * The Option class as a way of avoiding null checks.

    * Chaining monad calls.

    * For comprehensions and how they work under the hood.


    This only scratches the surface of functional programming but I hope that this
    part of the book will give you a useful head start when it comes to Scala and
    functional programming.'
  - "[PAGE 102]\n\n# Faking Function Calls\n\nScala provides mechanisms to make method\
    \ calls look like regular function calls. It uses special case apply and update\
    \ methods to allow a kind of shorthand call notation that can remove the clutter\
    \ of your code.\n\n# The apply Method\n\nThe apply method provides a shorthand\
    \ way of calling a method on a class. So, as we saw, you can use them as factory-style\
    \ creation methods, where given some class such as our old friend Customer:\n\n\
    ```\nclass Customer(name: String, address: String)\n...you can add an apply method\
    \ to its companion object.\nobject Customer {\n  def apply(name: String, address:\
    \ String) = new Customer(name, address)\n}\n```\n\nYou can then call the method\
    \ directly, or drop the apply part, at which point Scala will look for an apply\
    \ method that matches your argument list and call it.\n\n```\nCustomer.apply(\"\
    Bob Fossil\", \"1 London Road\")\nCustomer(\"Bob Randal\", \"14 Arches\")\n```\n\
    \nYou can also have multiple apply methods. For example, we could create another\
    \ method to default the default address of our customer.\n\n```\ndef apply(name:\
    \ String) = new Customer(name, \"No known address\")\nCustomer(\"Cuthbert Colbert\"\
    )\n```\n\nYou don't have to use apply methods as factory methods though. Most\
    \ people end up using them to make their class APIs more succinct. This is the\
    \ key to how Scala can make APIs more expressive. If it makes sense a default\
    \ behaviour of your class is to create an instance, fine, but you can also make\
    \ other methods look like function calls using.\n\nSo far, we've been using an\
    \ apply method on a singleton object (object Customer) and dropping the apply,\
    \ but you can have apply methods on a class and call them on an instance variable.\n\
    \nFor example, we could create a class called Adder and call the apply method\
    \ on an instance to add two numbers together.\n\n```\nval add = new Adder()\n\
    add.apply(1, 3)\n```\n\nBut we can just drop it and it'll look like we're calling\
    \ a function even though we're actually calling a method on an instance variable."
  - "[PAGE 103]\n\n```\nscala\nval add = new Adder()\nadd(1, 3)\n```\n\nAnother example\
    \ is accessing array values. Suppose we have an array of Roman numerals.\n\nnumerals\
    \ = Array(\"I\", \"II\", \"III\", \"IV\", \"V\", \"VI\", \"VII\")\n\nTo access\
    \ the array using an index, the syntax is to use parentheses rather than square\
    \ brackets.\n\n```\nnumerals(5) // yields \"VI\"\n```\n\nUsing the index in the\
    \ loop, we could do something like this to print the entire array:\n\n```\nfor\
    \ (i <- 0 to numerals.length - 1)\n  println(i + \" = \" + numerals(i))\n```\n\
    \nWhat's interesting is that there is an apply method on array that takes an Int.\
    \ So we could have written it like this:\n\n```\nnumerals.apply(5) // yields \"\
    VI\"\n```\n\n```\nfor (i <- 0 to numerals.length - 1)\n  println(i + \" = \" +\
    \ numerals.apply(i))\n```\n\nWhat looks like language syntax to access an array\
    \ is actually just a method call. Scala fakes it.\n\n# The update Method\n\nAssignment\
    \ works in just the same way. For example, numerals(2) = \"ii\" actually calls\
    \ a special method called on the Array class (def update(i: Int, x: T)):\n\n```\n\
    numerals(2) = \"ii\"\n```\n\nIf Scala sees the assignment operator and can find\
    \ an update method with appropriate arguments, it translates the assignment to\
    \ a method call.\n\nWe can apply this idea to our classes to make an API feel\
    \ more like language syntax. Let's say we're in the business of telephony and\
    \ part of that business is to maintain a directory of customer phone numbers.\n\
    \nWe can create a class to contain our directory, and initialise it to hold the\
