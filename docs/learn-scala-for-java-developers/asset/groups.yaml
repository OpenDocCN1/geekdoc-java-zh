  - '[PAGE 105]


    # Multiple Arguments to update


    You can have many arguments in the update method as you like but only the last
    will be used as the updated value. This makes sense, as you can only have one
    value to the right of an assignment operator.


    The rest of the argument list is used to select the appropriate update methods.
    So if you had another method with three arguments (areaCode, anotherArgument and
    newAreaCode):


    ```

    def update(areaCode: Int, another: String, newAreaCode: String) = ???

    ```


    ...the types would be used to work out which update method should be called on
    assignment.


    ```

    yellowPages(7998) = "7668"

    yellowPages(7998, "another argument") = "???"

    ```


    # Summary


    We''ve seen more about the apply method in this chapter; how you don''t just use
    it for factory-style creation methods but for building rich APIs. You can make
    client code more concise by making method calls look like function calls.


    We also saw how the related update method works and in the same way how we can
    write APIs that take advantage of the assignment operator and implement custom
    update behaviour.'
- md: "\n## Faking Language Constructs\n\nScala allows you to write your code in such\
    \ a way as to give the impression that you're working with native language constructs,\
    \ when really you're just working with regular methods.\n\nThis chapter will cover:\n\
    \n- How Scala allows you use curly braces instead of regular parentheses when\
    \ calling methods.\n- How Scala supports higher-order functions: functions that\
    \ take functions as arguments and return functions as results.\n- How Scala supports\
    \ carrying out of the box.\n\nThese things don't sound that impressive, but combined\
    \ they allow for a surprising amount of flexibility. We'll see how these techniques\
    \ help you write more flexible and readable code.\n\nAll the code samples in this\
    \ chapter are in Scala.\n\n## Curly Braces (and Function Literals)\n\nThere's\
    \ a simple rule in Scala:\n\n> Any method that can accept exactly one argument\
    \ can use curly braces to surround the argument-ment instead of parentheses.\n\
    \nSo, instead of this:\n\n```\nnumerals.foreach(println(_)) own```\n\nYou can\
    \ write this:\n\n```\nnumerals.foreach(println(_))\n```\n\nAll we've done is swap\
    \ the brackets for curly braces. Not very impressive, but things start to look\
    \ a bit more interesting when we introduce some new lines.\n\n```\nnumerals.foreach\
    \ {\n  println(_)\n}\n```\n\nNow it begins to look like a built-in control structure.\
    \ Developers are used to interpreting curly braces as demarcation of language\
    \ syntax. So this looks more like the built-in loop, even though it's just a method\
    \ call.\n\nThe main reason for doing this is to allow clients to pass in functions\
    \ as arguments in a natural and concise way. When you write functions that can\
    \ take functions as arguments, you're creating higher-order functions. These allow\
    \ for greater flexibility and re-use. For example, let's say we want to do some\
    \ work and update a UI element, like a progress or a customer basket. The best\
    \ way to do this is in a new thread so that we don't slow the main UI thread and\
    \ pauses for the user.\n\n## Higher-Order Functions\n\nIf every call to update\
    \ a UI element must be done on its own thread, we might end up with a naive implementation\
    \ like this:\n\n```scala\nobject Ui {\n  def updateUIElements() {\n    new Thread()\
    \ {\n      override def run(): Unit = updateCustomerBasket(basket)\n    }.start()\n\
    \n    new Thread() {\n      override def run(): Unit = updateOffersFor(customer)\n\
    \    }.start()\n  }\n}\n```\n\nThe ui object executes the sequence of updates\
    \ one after another, each on a new thread. The UI object is managing the threading\
    \ policy and the update behaviour. It would be better if something else was responsible\
    \ for coordinating thread and the ui object was left to the update behaviour.\
    \ Then, we could avoid duplication and if the threading policy changes, we wouldn't\
    \ have to find all the usages scattered about the place.\n\nThe solution is to\
    \ define a function that can run some other function on a thread. We create a\
    \ function called runInThread with the boilerplate threading code.\n\n```scala\n\
    def runInThread() {\n  new Thread() {\n    override def run(): Unit = ???\n  }.start()\n\
    }\n```\n\nIt will create and start a new thread but it doesn't do anything interesting.\
    \ How do we pass a function? In Java, you'd probably pass in an anonymous instance\
    \ of a Runnable or Callable or a lambda.\n\nYou do the same in Scala but rather\
    \ pass in a functional interface as the argument, You pass in a shorthand signature\
    \ denoting a function argument. You define a variable as usal(function in our\
    \ example below) but the type that follows the colon represents a function. Our\
    \ has no arguments and returns a value of unit. It's equivalent to Java 8's signature\
    \ for a lambda: () Void.\n\n```scala\ndef runInThread(function: () => Unit) {\n\
    \  new Thread() {\n    override def run(): Unit = ???\n  }.start()\n}\n```\n\n\
    Then we just execute the function in the body of the thread. Remember the brackets\
    \ dot the shorthand for executing the apply method.\n\n```scala\ndef runThread(function:\
    \ () => Unit) {\n  new Thread(\n    override def run(): Unit = function() // aka\
    \ function.apply()\n  ).start()\n}\n```\n\nGiven the new runThread method, we\
    \ can rewrite the UI code like this:\n\n```scala\ndef updateUIElements() {\n \
    \ runThread(() => updateCustomerBasket(basket))\n  runThread(() => updateOffersFor(customer))\n\
    }\n```\n\n## Higher Order Functions with Curly Braces\n\nUsing the apply method\
    \ and curly braces allows us to create APIs that are expressive and natural. It\
    \ allows us to create control abstractions that conform to what we expect from\
    \ the language in terms of syntax.\n\nBut remember what we said about the curly\
    \ braces:\n\n- Any method call which accepts exactly one argument can use curly\
    \ braces to surround the argument indent parentheses.\n\nWe only only curly braces\
    \ with single-argument methods. What if we want to add an argument to our runThread\
    \ and still use the elegant syntax? The good news is that's entirely possible;\
    \ we employ a technique called currying.\n\nLet's extend our runInThread to add\
    \ a new argument to assign a thread group.\n\n```scala\ndef runInThread(group:\
    \ String, function: => Unit) {\n  new Thread(new ThreadGroup(group), new Runnable())\
    \ {\n    run(): Unit = function\n  }).start()\n}\n```\n\nAs single-argument lists\
    \ use curly braces, we have to regress the ui object back to using parentheses.\n\
    \n```scala\n// yuk!\ndef updateUIElements() {\n  runInThread(\"basket\", {\n \
    \   applyDiscountToBasket(basket)\n    updateCustomerToBasket(basket)\n  })\n\
    \  runInThread(\"customer\", {\n    updatedOffersFor(customer)\n  })\n}\n```\n\
    \n## Call-by-Name\n\nPeople think that by-name parameters are the same as lazy\
    \ values but this isn't technically accurate. Yes, they aren't evaluated until\
    \ they're encountered at runtime but unlike lazy values, they will be evaluated\
    \ every time they're encountered. True lazy values are evaluated the first time\
    \ they're encountered and stored so the second time you ask for value, it's returned,\
    \ not evaluated. So by-name parameters are not lazy.\n\n## Currying\n\nCurrying\
    \ is the process of turning a function of two or more arguments into a series\
    \ of functions, each taking a single argument. For a function of two arguments,\
    \ currying would produce a function that takes one argument and returns another\
    \ function. This returned function would also have a\n"
  mdcn: "\n\n## 伪造语言结构\n\nScala 允许你以这种方式编写代码，让你产生正在使用原生语言结构的错觉，而实际上你只是在用普通方法。\n\n\
    本章将涵盖：\n\n- Scala 如何允许在调用方法时使用大括号而不是普通的括号。\n- Scala 如何支持高阶函数：接受函数作为参数并返回函数作为结果的。\n\
    - Scala 如何支持开箱即用（out of the box）。\n\n这些点听起来没了不起，但结合在一起就提供了惊人的活性。我们将看到这些技术如何帮助你编写更具活性且更易读的代码。\n\
    \n本章中的所有代码示例均使用 Scala 编写。\n\n## 大括号（以及函数字面量）\n\nScala 中有一个简单的规则：\n\n> 任何可以接受正好一个参数的方法都可以使用大括号来包围参数，而不是括号。\n\
    \n所以，而不是这样：\n\n```\nnumerals.foreach(println(_)) \n```\n\n你可以这样写：\n\n```\nnumerals.foreach(println(_))\n\
    ```\n\n我们所做的只是把括号换成了大括号。这没什么不起的，但当我们引入一些新行时，事情开始变得有点有趣了。\n\n```\nnumerals.foreach\
    \ {\n  println(_)\n}\n```\n\n现在它看起来像一个内置的控制结构了。开发者习惯于将大括号解释为语言语法的边界。因此这看起来更像内置循环，尽管它只是一个方法调用。\n\
    \n这样做的主要原因是允许客户端以自然且简洁的方式将函数作为参数传递。当你编写可以接受函数作为参数的函数时，你正在创建高阶函数。这些函数允许更大的活性和重用性。例如，假设我们想执行一些工作并更新\
    \ UI 元素，比如进度条或客户篮。最好的方法是在新线程中执行，这样我们就不会减慢主 UI 线程并阻塞用户。\n\n## 高阶函数\n\n如果每次更新 UI\
    \ 元素的调用必须在自己的线程上完成，我们可能会得到像这样的幼稚实现：\n\n```scala\nobject Ui {\n  def updateUIElements()\
    \ {\n    new Thread() {\n      override def run(): Unit = updateCustomerBasket(basket)\n\
    \    }.start()\n\n    new Thread() {\n      override def run(): Unit = updateOffersFor(customer)\n\
    \    }.start()\n  }\n}\n```\n\nui 对象一个接一个地执行系列更新，每个更新都在一个新线程上。UI 对象正在管理线程策略和更新行为。如果由其他东西负责协调线程，而让\
    \ ui 对象只负责更新行为，将会更好。这样我们就可以避免重复，如果线程策略发生变化，我们就不需要寻找散落在各处的所有用法了。\n\n解决方案是定义一个可以在线程上运行其他函数的函数。我们创建了一个名为\
    \ `runInThread` 的函数，包含了样板化的线程代码。\n\n```scala\ndef runInThread() {\n  new Thread()\
    \ {\n    override def run(): Unit = ???\n  }.start()\n}\n```\n\n它会创建并启动新线程，但没有做任何有趣的事。我们如何传递函数呢？在\
    \ Java 中，你可能会传递一个 Runnable 或 Callable 的匿名实例或 lambda 表达式。\n\n在 Scala 中你做同样的操作，但传递一个函数接口作为参数。你传递一个表示函数参数的简写签名。你像通常一样定义一个变量（在下面的示例中为函数），但冒号后面的类型代表一个函数。我们的函数没有参数并返回一个\
    \ unit 类型的值。它等同于 Java 8 的 lambda 签名：`() Void`。\n\n```scala\ndef runInThread(function:\
    \ () => Unit) {\n  new Thread() {\n    override def run(): Unit = ???\n  }.start()\n\
    }\n```\n\n然后我们只需要在线程体中执行该函数。记得括号是执行 `apply` 方法的简写。\n\n```scala\ndef runThread(function:\
    \ () => Unit) {\n  new Thread(\n    override def run(): Unit = function() // 相当于\
    \ function.apply()\n  ).start()\n}\n```\n\n有了新的 `runThread` 方法，我们可以这样重写 UI 代码：\n\
    \n```scala\ndef updateUIElements() {\n  runThread(() => updateCustomerBasket(basket))\n\
    \  runThread(() => updateOffersFor(customer))\n}\n```\n\n## 使用大括号的高阶函数\n\n使用 `apply`\
    \ 方法和大括号允许我们创建具有表现力且自然的 API。它允许我们创建符合我们对语言语法所预期的控制抽象。\n\n但请记住我们关于大括号说的话：\n\n-\
    \ 任何接受正好一个参数的方法调用都可以使用大括号来包围参数括号。\n\n我们只对单参数方法使用大括号。如果我们想给 `runThread` 添加一个参数并仍然使用优雅的语法怎么办？好消息是这是完全可能的；我们采用了一种称为柯里化（currying）的技术。\n\
    \n让我们扩展 `runInThread` 以添加一个用于分配线程组的新参数。\n\n```scala\ndef runInThread(group: String,\
    \ function: => Unit) {\n  new Thread(new ThreadGroup(group), new Runnable()) {\n\
    \    run(): Unit = function\n  }).start()\n}\n```\n\n由于单参数列表使用大括号，我们必须让 ui 对象回到使用括号。\n\
    \n```scala\n// 哎！\ndef updateUIElements() {\n  runInThread(\"basket\", {\n   \
    \ applyDiscountToBasket(basket)\n    updateCustomerToBasket(basket)\n  })\n  runInThread(\"\
    customer\", {\n    updatedOffersFor(customer)\n  })\n}\n```\n\n## 按名调用 (Call-by-Name)\n\
    \n人们认为按名参数等同于懒值（lazy values），但这在技术上并不完全准确。是的，它们在运行时遇到之前不会被求值，但与懒值不同，它们每次被遇到时都会被求值。真正的懒值在第一次被遇到时求值并存储，因此当你第二次请求值时，返回的是结果而不是再次求值。所以按名参数不是懒值的。\n\
    \n## 柯里化 (Currying)\n\n柯里化是将具有两个或多个参数的函数转换为一系列每个接受单个参数的函数的过程。对于具有两个参数的函数，柯里化会产生一个接受一个参数并返回另一个函数。这个返回的函数也将一个\n\
    \n"
