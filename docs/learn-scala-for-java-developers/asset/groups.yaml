    # Constructor Patterns\n\nNote that constructor patterns work on class cases out\
    \ of the body. Technically, this is because they automatically implement a special\
    \ method called unapply. We'll shortly show how to implement your own and achieve\
    \ the same kind of thing for non-class cases.\n\n# Type Query\n\nUsing a constructor\
    \ pattern, you can implicitly match against a type and access its fields. If you\
    \ don't know the fields, you can use a query type to match against the type.\n\
    \nFor example, we could create a method nameFor to give us a person or superhero's\
    \ name, and call it with a list. We'd get either their name, or if they're a superhero,\
    \ their alter ego.\n\n```\nobject HeroTypePatternExample extends App {\nval batman\
    \ =\nnew SuperHero(\"Batman\", \"Bruce Wayne\", List(Speed, Agility, Strength))\n\
    val cap =\nnew SuperHero(\"Captain America\", \"Steve Rogers\", List(Tactics,\
    \ Speed))\nval jayne = new Person(\"Jayne Doe\")\n```"
