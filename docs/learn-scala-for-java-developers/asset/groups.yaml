    Apart from allowing multiple inheritance, traits can be stacked or layered on
    top of each other to provide a call chain, similar to aspect-oriented programming,
    or using decorators. There''s a good section on layered traits in Scala for the
    Impatient by Cay S. Horstmann if you want to read more.


    # Deciding Between the Options


    Here are some tips to help you choose when to use the different inheritance options.


    Use traits without state when you would have used an interface in Java; namely,
    when you define a role class should play where different implementations can be
    swapped in. For example, when you want to use a test double when testing and a
    “real” implementation in production. “Role” in this sense implies no reusable
    concrete behaviour, just the idea of substitutability.


    When your class has behaviour and that behaviour is likely to be overridden by
    things of the same type, use a regular class and extend. Both of these are types
    of inclusion polymorphism.


    Use an abstract class in the case when you''re more interested in reuse than in
    an OO is a relationship. For example, data structures might be a good place to
    reuse abstract classes, but our customer hierarchy from earlier might be better
    implemented as non-abstract classes.


    If you''re creating reusable behaviour that may be reused by unrelated classes,
    make it a mixin trait as they have fewer restrictions on what one can use compared
    to an abstract class.


    Odersky also talks about some other factors, like performances and Java interoperability,
    in Programming in Scala'
