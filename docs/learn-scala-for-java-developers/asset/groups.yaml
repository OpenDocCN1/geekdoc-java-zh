    \ of B is not a subtype of List of A even though their parameterised types are.\n\
    \n![](img/cbf3f5372fffa2b96079cf12bcd2bbca_98_0.png)\n\na = b; // compiler failure\n\
    \nThis is where variance comes in. Variance describes how subtyping generic types\
    \ (like lists or “container” types) relates to subtyping their parameterised type.\n\
    \nThere are three types of subtype relationship described by variance:\n\n1. Invariant\n\
    2. Covariant\n3. Contravariant\n\n## Invariance\n\nInvariance means that there\
    \ is no relationship between the generic types, even if their parametrised types\
    \ have a subtype relationship. You can't substitute one for another. Java and\
    \ Scala use invariance for methods and variables. The syntax here, using chevrons\
    \ (Java) or square brackets (Scala), describes the type as invariant.\n\n```java\n\
    public class List<T> { } // java\nclass List[T] { } // scala\n```\n\n## Covariance\n\
    \nCovariant generic types preserve the relationship between two generic types\
