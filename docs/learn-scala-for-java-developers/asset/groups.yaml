    \n## Subtype Inheritance\n\nCreating a subtype of another class is the same as\
    \ in Java. Use the extends keyword and you can prevent subclassing with the final\
    \ modifier on a class definition.\n\nLet's suppose we want to extend the basic\
    \ customer class from earlier and create a special subtype to represent a DiscountedCustomer.\
