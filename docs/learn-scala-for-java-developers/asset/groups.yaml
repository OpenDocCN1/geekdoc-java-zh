    \  } catch {\n    case _: MalformedURLELException => None\n  }\n}\n\nval url =\
    \ \"http://baddotorobot.com\" match {\n  case UrlExtractor(protocol, host) =>\
    \ println(protocol + \" \" + host)\n}\n```\n\nThis decoupling between patterns\
