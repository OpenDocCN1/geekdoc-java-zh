    # Bottom Types


    A new notion to many Java developers will be the idea that a class hierarchy can
    have common bottom types. These are types that are subtypes of all types. Scala’s
    types Null and Nothing are not both bottom types.


    All reference types in Scala are super-types of Null. Null is also an AnyRef object;
    it’s a subclass of every reference type.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_26_0.png)


    Fig. 1.5. The Null extends AnyRef.


    Both value and reference types are super-types of Nothing. It’s at the bottom
    of the class hierarchy and is a subtype of all types.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_26_1.png)


    Fig. 1.6. Nothing extends Null.


    The entire hierarchy is shown in the diagram below. I’ve left off scala.Any to
    save space. Notice that Null extends all reference types and that Nothing extends
    all types.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_27_0.png)


    Fig. 1.7. Full hierarchy with the bottom types Null and Nothing.


    # ScalaDoc


    Scala has ported the idea of JavaDoc and creatively called it ScalaDoc. Adding
    ScalaDoc to your Scala source works similarly to adding JavaDoc, and is done with
    markup in comments. For example, the following fragment in source code:


    ```scala

    /** Returns `true` if this value is equal to x, `false` otherwise. */

    def ==(x: Byte): Boolean

    ```


    ...can be turned into the following fragment in HTML:


    ```

    abstract def ==(x: Byte): Boolean

    Returns true if this value is equal to x, false otherwise.

    ```


    Fig. 1.8. Embedded ScalaDoc markup rendered in HTML.


    To see the documentation for the Scala API, head over to http://scala-lang.org/documentation.
    You’ll notice it is broadly similar to JavaDoc. You can see the classes along
    the left; they’re not grouped by package like JavaDoc but they’re clickable to
    get more information.


    ![](img/cbf3f5372fffa2b96079cf12bcd2bbca_29_0.png)


    Fig. 1.9. The basic ScalaDoc for char.


    A neat feature of ScalaDoc is that you can also filter the content. For example,
    you can show only methods inherited from Any.


    If you''re interested in the hierarchy of class, you can look at its super- and
    subtypes. You can even see a navigable diagram of the type hierarchy. For example,
    the type hierarchy for Byte shows it is a subtype of AnyVal, and you can navigate
    up through the hierarchy by clicking on the diagram.


