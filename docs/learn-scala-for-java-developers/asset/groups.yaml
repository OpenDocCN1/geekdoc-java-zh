    \n```java\n// java\ncustomers.sort((first, second) -> second.total.compareTo(first.total));\n\
    ```\n\nTo make the Scala version more like the Java one, we'd need to pass in\
    \ a lambda instead of the anonymous instance ordering. Scala supports lambdas\
