    \ // wrong!\n```\n\nHowever, this isn't quite right. Chaining the two map functions\
    \ returns a Set[Option[Double]], and we can't sum that. We need to flatten this\
    \ down to a sequence of doubles before summing.\n\n```scala\ncustomers.map(database.find(_).map(_.total)).flatten.sum\n\
    ```\n"
