    \ Customer {\n\n    private final String name;\n    private final String address;\n\
    \    private final ShoppingBasket basket = new ShoppingBasket();\n\n    public\
    \ Customer(String name, String address) {\n        this.name = name;\n       \
    \ this.address = address;\n    }\n\n    public void add(Item item) {\n       \
    \ basket.add(item);\n    }\n\n    public Double total() {\n        return basket.value();\n\
    \    }\n}\n```\n\nLet's say the DiscountedCustomer is entitled to a 10% discount\
    \ on all purchases. We can extend Customer, creating a constructor to match Customer,\
    \ and call super in it. We then override the total method to apply the discount.\n\
    \n```java\n// java\npublic class DiscountedCustomer extends Customer {\n\n   \
    \ public DiscountedCustomer(String name, String address) {\n        super(name,\
    \ address);\n    }\n\n    @Override\n    public Double total() {\n        return\
