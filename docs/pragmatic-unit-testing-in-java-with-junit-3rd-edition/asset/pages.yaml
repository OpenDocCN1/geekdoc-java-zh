  md: '# # Functional Programming in Java, Second Edition


    Imagine writing Java code that reads the problem statement, code that is highly
    expressive, concise, easy to read and modify, and has reduced complexity. With
    the functional programming capabilities in Java, that''s not a fantasy. This book
    will guide you through the familiar imperative style through the practical aspects
    of functional programming, using plenty of examples. Apply the techniques you
    learn to turn highly complex imperative code into elegant and easy-to-understand
    functional-style code. Updated to the latest version of Java, this edition has
    four new chapters on error handling, refactoring to functional style, transforming
    data, and idioms of functional programming.


    Venkat Subramaniam

    (274 pages) ISBN: 9781860509793. 853.95


    https://prag.com/book/vsjava2


    ![](img/5f9fd301af41bda177ca04d9f939d028_286_0.png)


    # # Java by Comparison


    Improve your coding skills by comparing your code to expert programmers so you
    can write code that''s clean, concise, and to the point: code that others will
    read with pleasure and reuse. Get hands-on advice to level up your coding style
    through small and understandable examples that compare flawed code to an improved
    solution. Discover handy tips and tricks, as well as common bugs a Java programmer
    needs to know. Make your way from a Java novice to a master craftsman.


    Simon Harrer, Jörg Lenhard, Linus Dietz

    (206 pages) ISBN: 9781860502879. 840.95


    https://prag.com/book/javacomp


    ![](img/5f9fd301af41bda177ca04d9f939d028_286_1.png)'
