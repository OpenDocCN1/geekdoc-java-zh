  md: '# Summary


    You ended up with four sleek, refactored tests. A developer can understand the
    goal of each test through its name, which provides a generalized summary of behavior.
    They can see how behavior plays out by reading the example within the test. Arrange—Act—Assert
    (AAA) guides them immediately to the act step so they can see how the code being
    verified gets executed. They can reconcile the asserts against the test name''s
    description of behavior. Finally, if needed, they can review the arrange step
    to understand how it puts the system in the proper state to be tested.


    The tests are scannable. A developer can rapidly find and digest each test element
    (name, arrange, act, and assert) they''re interested in. The needed comprehension
    can happen in seconds rather than minutes. Remember also that readily understood
    tests—descriptions of unit behavior—can save even hours of time required to understand
    production code.


    > Seeking to understand your system through its tests motivates you to keep them
    as clean as they should be.


    It only takes minutes to clean up tests enough to save future amounts of comprehension
    time.


    You now have a complete picture of what you must do in the name of design: refactor
    your production code for clarity and conciseness, refactor your production code
    to support more flexibility in design, design your system to support mocking of
    dependency challenges, and refactor your tests to minimize maintenance and maximize
    understanding.


    You''re ready to move on to the final part of this book, a smorgasbord of additional
    topics related to unit testing.'
