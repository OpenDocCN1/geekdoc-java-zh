  md: "# Chapter 3. Using Test Doubles • 58\n\n```\nassertThrows(UnsupportedOperationException.class,\n\
    () -> retriever.retrieve(1.0, -1.0));\n}\n```\n\n# Changing Your Design to Support\
    \ Testing\n\nYou changed the design of AddressRetriever. Before, it created an\
    \ HttpImpl instance in retrieve as a private detail. Now, a client using AddressRetriever\
