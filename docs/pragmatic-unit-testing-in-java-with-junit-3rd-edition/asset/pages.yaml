  md: 'If you view the unit tests as a way of characterizing all your code units,
    collectively they become the requirements in an old but useful little "requirements
    by example" manner. Your test names describe the behavioral needs. Each test provides
    an example of those behaviors.


    Such well-known requirements-by-example (tests) can quickly answer others (or
    even you) might ask: "hey, what does the system do when you try to calculate the
    arithmetic mean and are no credit ratings? Everyone is happy, you have an immediate
    answer, and you''re highly confident it''s correct because all of your tests are
    passing.


    One way to take control: invert your approach to unit testing—drive a requirements
    by first updating the tests that relate to the change. After observing that the
    updated tests fail (because you''re not yet updated system with the new requirement),
    you can make the necessary changes and then run all tests to ensure you''re still
    happy.


    Once you feel in control by test-driving changes, your next thought might be:
    "what if I drove in all functionality this way?" You can, and doing so is known
    as Test-Driven Development (TDD). See Chapter 11, Advancing with Test-Driven Development
    (TDD), on page 211 for what TDD looks like and why it might help you even. Get
    a little excited it—TDD is also a lot of fun—but for now, you should continue
    your testing journey.


    Testing that an exception is thrown as expected is as important as testing any
    other code. You''ll also want to verify that other code responds properly to the
    situation when an exception is thrown. Doing so is a slightly trickier technique;
    visit Testing Exception Handling, on page 65 for details.


    # Exploring Boundaries with CORRECT


    The zero, one, many, and exception-based tests will cover most of your typical
    needs when testing code. But you''ll also want to consider adding tests for cases
    that a happy path through the code might not hit. These boundary conditions represent
    scenarios that involve the edges of the input domain.


    You can employ the CORRECT acronym, devised by Andy Hunt and Dave Thomas for the
    first edition of this book [HT03], to help you think about potential boundary
    conditions. For each of these items, consider whether or not similar conditions
    can exist in the method that you want to test and what might happen if these conditions
    are violated:'
