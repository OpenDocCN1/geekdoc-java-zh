  md: "# Chapter 2. Testing the Building Blocks • 44\n\nSuch test objects also help\
    \ de-emphasize details where they don't matter. That the northeast location is\
    \ at (3, 3) and facing north is irrelevant in your allowsAddingLocations test.\
    \ It only matters that NORTHEAST references an object distinct from ORIGIN.\n\n\
    Useful, yet creating sample objects can be overkill. It's often easier to eyeball-compare\
    \ the by looking back and forth between the arrange and assert statements. as\
    \ long as test intent remains clear, trigger tests can speed up efforts in both\
    \ writing and understanding.\n\n```\nutj3-units/09/src/test/units/ADestList.java\n\
    @Test\nvoid doesNotAddLocationAlreadyContained() {\n    list.add(new FixedLocation(0,\
    \ 0, East));\n    list.add(new FixedLocation(3, 3, North));\n    list.add(new\
    \ FixedLocation(0, 0, East));\n    assertEquals(\n        List.of(new FixedLocation(0,\
    \ 0, East),\n            new FixedLocation(3, 3, North)),\n        list.getLocations());\n\
    }\n```\n\nAny of the three forms (raw inline declarations, locally declared test\
    \ objects) is acceptable. Here, the line inline declarations clutter the tests\
    \ a little too much. For now, use the constants.\n\n# Something if a Conditional\
    \ Is Met\n\nIf the code you're testing involves a conditional (an if statement),\
    \ you need at least two of tests: one involving all the ways that the conditional\
    \ can pass (in other words, return true), and one involving all the ways that\
    \ it can fail (return false). Your test covers both what happens if the block\
    \ executes and what happens if it does not.\n\nA common behavioral needs is to\
    \ ensure that a collection doesn't take on duplicate elements. Here's a change\
    \ to DestinationList that introduces such a to the method:\n\n```\nutj3-units/09/src/main/units/DestinationList.java\n\
