  md: "# Keeping Your Tests Meaningful\n\nIf others (or yourself) have a tough understanding\
    \ what a test is doing, do not add comments. That's like adding footnotes to describe\
    \ poorly written text. Improve the test instead, starting with its name. These\
    \ are other things you can do:\n\n+   - Improve any local variable names.\n- Introduce\
    \ meaningful constants.\n- Prefer matcher-based assertions (for example, those\
    \ from AssertJ).\n- Split larger tests into smaller, more focused tests.\n- Move\
    \ tester to helper methods and @Before methods.\n\n![](img/5f9fd301af41bda177ca04d9f939d028_207_0.png)\n\
