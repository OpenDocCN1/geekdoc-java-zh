    All failed asserts throw an AssertionError exception. JUnit catches this or any
    other exception thrown during test execution and adds one to your count of failing
    tests.


    JUnit''s choice to throw an exception means no more code in the test method gets
    executed. Any assertions following the first failing one do not execute, a deliberate
    (and good) choice by its designers: Once your assertion fails, all bets are off
    the state of things. Executing subsequent assertions may be pointless.


    You generally want your tests focused on a single (unit) behavior, which means,
    you usually need only one assertion. You''ll dig deeper into this idea later in
    Test Smell: Multiple Assertions, on page 200.


