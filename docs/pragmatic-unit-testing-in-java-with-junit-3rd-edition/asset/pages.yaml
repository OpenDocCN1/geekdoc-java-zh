  md: "# Chapter 5. Examining Outcomes with Assertions • 114\n\nIf you see an ExpectedException\
    \ instantiated and annotated with @Rule, visit JUnit 4's documentation for ExpectedException\
    \ for further explanation.\n\nIf it's not obvious, \"old school\" is pejorative.\
    \ (I'm allowed to say it, though, 'I'm old.) Don't use these constructs if you\
    \ can help it.\n\n# Use of try/catch\n\nJUnit's first releases supported only\
    \ \"roll-your-own\" mechanisms for exception handling, based on the use of Java's\
    \ try/catch construct. Here's the comparable Account code for expecting InsufficientFundsException:\n\
    \n```\n@Test\nvoid throwsWhenWithdrawingTooMuch() {\n  try {\n    account.withdraw(100);\n\
    \    fail();\n  } catch (InsufficientFundsException expected) {\n    assertEquals(\"\
    balance only 0\", expected.getMessage());\n  }\n}\n```\n\nIf JUnit executes code\
    \ within a try block that throws an exception, control is transferred to the appropriate\
    \ catch block and executed. In the example, since the code indeed throws an InsufficientFundsException,\
    \ control transfers to the assertEquals statement in the catch block, which verifies\
    \ the exception object's message contents.\n\nYou can deliberately fail the test\
    \ by commenting out the withdrawal operation in Account's draw method. To do that\
    \ firsthand what JUnit tells you.\n\nIf the call to withdraw does not throw an\
    \ exception, the next line executes. When using the try/catch mechanism, the last\
    \ line in the try block should be a call to org.junit.Assert.fail(). As you guess,\
    \ JUnit's fail method throws an AssertionFailedError so as to abort and fail the\
    \ test.\n\nThe try/catch idiom represents the rare case where it might be to have\
    \ an empty catch block—perhaps you don't care about the contents of the exception.\
    \ Naming the exception variable expected helps reinforce to the reader that we\
    \ expect an exception to be thrown and caught.\n\nThink about other things that\
    \ you might want a test to assert after an exception has been thrown. Examine\
    \ any post-conditions that it must hold true. For example, it might be of value\
    \ to assert that the account balance didn't change after the failed withdrawal\
    \ attempt.\n\n+   4. https://junit.org/junit4/javadoc/4.12/org/junit/rules/ExpectedException.html"
