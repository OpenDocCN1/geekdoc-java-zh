  md: "You've been asked to change the code—oh no! The product owner has been schooled\
    \ by a mathematician and wants arithmeticMean to mean an exception when there\
    \ are no credit ratings.\n\nPretend to panic for a moment (\"But I'll have to\
    \ reset everything!\\ then make the trivial change.\n\n```\nut3-creditHistory:11/src/main/java/credit/CreditHistory.java\n\
    public int arithmeticMean() {\n    if (ratings.isEmpty()) throw new IllegalStateException();\n\
    \n    var total = ratings.stream().mapToInt(CreditRating::rating).sum();\n   \
    \ return total / ratings.size();\n}\n```\n\nBecause you changed your code, run\
    \ your tests. At least one test will fail due to your change of the behavior that\
    \ the tests create. Dream that only the test ACreditwithNoCreditRatingsHas0Mean\
    \ fails since it's the only test directly related to the changed behavior. Rejoice\
    \ when your hopes and dreams (paltry) are also true: withNoCreditRatingsHas0Mean\
    \ fails and for the right reason—an IllegalStateException throws. Hooray!\n\n\
    The desired behavior is in place. A test is failing. Time to fix the incorrect\
    \ test.\n\nJUnit 5 gives you a way to verify that a piece of test throws an exception:\n\
    \n```\nut3-creditHistory:12/src/test/java/credit/ACreditHistory.java\n@Test\n\
    void withNoCreditRatingsThrows() {\n    assertThrows(IllegalStateException.class,\n\
    \        () -> creditHistory.arithmeticMean());\n}\n```\n\nIn its simplest form,\
    \ JUnit's asserts takes two arguments. The first represents the type of exception\
    \ you expect to be thrown (IllegalStateException.class in this case). The second\
    \ argument is a lambda whose body contains the code that you expect to throw.\
    \ In your case, you're expecting the call to arithmeticMean to throw the exception.\n\
    \nWhen handling assertThrows within a test, JUnit executes the lambda in the context\
    \ of a try/catch block. If the lambda fails, the catch block catches the bfrage\
    \ and JUnit marks the test as passing as long as the exception type matches. Otherwise,\
    \ JUnit marks the test as a failure since no exception was thrown.\n\nBecause\
    \ your requirements changed, you updated the code and verified that your change\
    \ broke a specific test. That seems so...reactionary. Maybe you should take control\
    \ of things."
