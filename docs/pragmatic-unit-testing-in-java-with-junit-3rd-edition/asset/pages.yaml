  md: "You might occasionally see the try/catch mechanism used in older code. If so,\
    \ you can leave it alone (now you know how it works), or you can streamline your\
    \ test by replacing it with assertThrows.\n\n# Assert That Nothing Happened: assertDoesNotThrow\n\
    \nWith a lot of other assertion forms, JUnit provides a converse to assertThrows—specifically,\
    \ the `'assertDoesNotThrow` method. In its simplest form, it takes an executable\
    \ (a lambda or method reference). If the invocation of the executable does not\
    \ throw anything, the assertion passes; otherwise, it fails.\n\nEvery once in\
    \ a while, you'll think want to use assertDoesNotThrow...the only problem is,\
    \ it really doesn't assert anything about what the executed code `do` does. Try\
    \ finding a way to test elusive \"something.\"\n\nYou might find assertDoesNotThrow\
    \ useful as the catch-all in a series of tests. Suppose you have a validator that\
    \ throws an exception in a couple of cases and otherwise does this:\n\n```\nutj3-junit/01/src/test/java/scratch/ANameValidator.java\n\
    class NameValidationException extends RuntimeException {\nclass NameValidator{\n\
    \  long commaCount(String s) {\n    return s.chars().filter(ch -> ch == ',').count();\n\
    \  }\n  void validate(String name) {\n    if (name.isEmpty() ||\n      commaCount(name)\
    \ > 1)\n      throw new NameValidationException();\n  }\n}\n```\n\nYou need two\
    \ tests to demonstrate that `validate` throws an exception for each of the two\
    \ negative cases:\n\n```\nutj3-junit/01/src/test/java/scratch/ANameValidator.java\n\
    import org.junit.jupiter.api.*;\nimport static org.junit.jupiter.api.Assertions.assertDoesNotThrow;\n\
    import static org.junit.jupiter.api.Assertions.assertThrows;\nclass ANameValidator\
    \ {\n  NameValidator validator = new NameValidator();\n  @Test\n  void throwsWhenNameIsEmpty()\
    \ {\n    assertThrows(NameValidationException.class, () ->\n      validator.validate(\"\
    \"));\n  }\n```"
