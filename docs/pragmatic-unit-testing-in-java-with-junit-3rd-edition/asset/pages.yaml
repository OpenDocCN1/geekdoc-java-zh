  md: "learned that a good IDE can do the job at least ten times as fast as, it makes\
    \ little sense not to take advantage of that power.\n\nMore importantly, you can\
    \ trust that (in Java, at least) an automated refactoring generally will not break\
    \ code. You're far more likely to mess up the way through a manual refactoring.\
    \ Java automated refactorings are code transformations that have been proven in\
    \ all senses of the word.\n\nYou can further speed up by using the keyboard shortcuts\
    \ for each automated refactoring rather than click menus and dialogues. Throughout\
    \ your development day, you will find use for a small number of core automated\
    \ refactorings: introduce variable/constant/field/parameter, extract method, inline\
    \ method, inline variable, move method, and change signature. You won't take long\
    \ to ingrain the corresponding shortcuts. You can reduce refactoring operations\
    \ to about three to four seconds from 10 seconds or more (clicking through the\
    \ UI) or from several minutes (manually).\n\nLucky you: 20 years ago, most Java\
    \ programmers manually moved code in highly unsafe ways. Thirty years ago, automated\
    \ ref tools didn't exist. Today, the power and speed they grant can't be overstated.\
    \ You can watch the computer do the dirty work and know that your code still works.\n\
    \n# Amplifying the Core Intent of Code\n\nLet's re-examine the slightly improved\
    \ matches.java\n\n```\nut3-refactor/07/src/main/java/iloveybouss/Profile.java\n\
