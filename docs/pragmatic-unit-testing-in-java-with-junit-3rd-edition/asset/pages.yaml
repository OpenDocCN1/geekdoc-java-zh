  md: 'Gradle is a great way to build and run tests within a continuous build environment.
    But don''t use Gradle for interactive unit testing unless you customize its output
    to remind you of disabled tests. Have it fail the test run if any disabled tests
    exist or show their count as the last line of output.


    Disabled tests should not really exist other than on your own machine. Avoid integrating
    disabled tests—they usually represent big questions about the health of your system,
    such as: Is the test needed? Can we just delete it? What do we currently understand
    why we couldn''t immediately get this to pass?


    # Exploring More Features


    JUnit has run over its past 20-something years into a fairly large and sophisticated
    tool. It''s likely that the features you''ve learned in this chapter will be enough
    for your needs for years to come. However, it''s also possible that one of JUnit''s
    other features might be useful for your special circumstances. Here''s a quick
    summary:


    +   - assumptions Abort execution of a test if an assumption is not met (but don''t
    count it as failed)


    +   - conditional test Enable or disable tests conditionally. Conditions can reference
    the OS, architecture, Java version, value of a system property/environment variable,
    or custom-coded predicates.


    +   - display names Rather than the (typically) camel-case test name during a
    test run, show the contents of a string.


    +   - display name generators Generate more human-readable test names by transforming
    the test method names. For example, transform underscores in test names into spaces.


    +   - dynamic tests Generate tests at runtime.


    +   - parallel execution Run tests concurrently to speed up their execution.


    +   - repeated tests Run a test specified number of times.


    +   - suites Programmatically declare a filtered collection of tests to execute.


    +   - temp dir context Write a file-dependent test that executes in the context
    of a temporary directory.


    +   - timeouts Fail a test (or lifecycle method) if its execution time exceeds
    a specific duration.


    +   2. https://junit.org/junit5/docs/current/user-guide/'
