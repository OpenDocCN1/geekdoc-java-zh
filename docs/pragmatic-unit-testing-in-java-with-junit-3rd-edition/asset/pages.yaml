    \ that returns a value. For these tests, you can often distill the three Arrange-Act-Assert\
    \ (AAA) steps to a single line of code:\n\n```\nassertEquals(42, new Everything().ultimateAnswer());\n\
    ```\n\nTo make your tests align with at least one aspect of scannable, use blank\
    \ lines to break them into AAA chunks:\n\n```\nut3-credit-history-07/src/test/java/credit/CreditHistory.java\n\
