  md: "And another:\nsomeResultOccursUnderSomeCondition\n\nOr you might decide to\
    \ go with the given-when-then naming pattern, which derives from a process as\
    \ behavior-driven development:¹\n\ngivenSomeContextWhenDoingBehaviorThenSomeResultOccurs\n\
    \nGiven-when-test names can be a mouthful, though you can usually drop the givenContext\
    \ portion without creating too much additional work for your test reader:\n\n\
    whenDoingBehaviorThenSomeResultGeneratesSomeResult.\n...which is about the same\
    \ as doingOperationGeneratesSomeResult.\n\nJUnit 5's support for nested test classes\
    \ allows you to structure your class to directly support given-when-then:\n\n\
    ```\nut3-refactor-tests/01/src/test/java/portfolio/ANonEmptyPortfolio.java\nclass\
    \ AnonEmptyPortfolio {\n    Portfolio portfolio = new Portfolio();\n    int initialSize;\n\
    \    @BeforeEach\n    void purchaseAs() {\n        portfolio.purchase(\"LSFT\"\
    , 20);\n        initialSize = portfolio.size();\n    }\n    @Nested\n    class\
    \ PurchasingAnotherSymbol {\n        @BeforeEach\n        void purchaseAnotherSymbol()\
    \ {\n            portfolio.purchase(\"AAPL\", 10);\n        }\n        @Test\n\
    \        void increasesSize() {\n            assertEquals(initialSize + 1, portfolio.size());\n\
    \        }\n    }\n}\n```\n\nWhich form you choose isn't as important as being\
    \ consistent. Your main goal: create easy-to-read test names that clearly impart\
    \ meaning.\n\n+   1. http://en.wikipedia.org/wiki/Behavior-driven_development"
