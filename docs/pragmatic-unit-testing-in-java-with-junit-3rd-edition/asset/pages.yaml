  md: 'Oh dear, that''s a pile of code. While Location appears to have a lot going
    on, most of its code is boilerplate.


    The Location class would be the sort of thing Java records are made for, but for
    one unfortunate circumstance: it creates mutable objects. A Location object''s
    x and y fields are mutated (changed) when client code executes the move method.


    Location likes it demands a significant amount of testing. It''s a lot longer
    than the CreditHistory class, for one (though nowhere near the size of a typical
    class in many production systems). But let''s see what the testing effort will
    involve.


    Testing gives you the guts to ship. You increase this confidence by ensuring that
    your code''s units work as expected.


    > You gain the confidence to ship through testing.


    You don''t need to test code you didn''t write as long as you think you can trust
    it. The equals and hashCode methods here were generated by an IDE, which you later
    must manually change or directly invoke these methods, cover them with tests.


    Developers wrote Location''s toString method to help developers decipher problems
    and clarifying faults. Don''t feel compelled to test it, either. Do test toString
    if other production code depends on it, either explicitly or implicitly.


    The only real behaviors in Location that remain for consideration are its ability
    to capture a location and to move to another location.


    A first test for Location might create a location with an (x, y) coordinate and
    a heading, then ensure that it returns its initial values correctly. But that''s
    terribly uninteresting and barely "behavior." The getters will get exercised (executed)
    as part of tests for other Location behavior. These tests will expose problems
    with the getters, however inconceivable.'
