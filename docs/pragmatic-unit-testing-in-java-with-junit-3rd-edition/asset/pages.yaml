    \    creditHistory.add(new CreditRating(780));\n\n    var result = creditHistory.arithmeticMean();\n\
    \    assertEquals(780, result);\n}\n```\n\nYour test code has some breathing room.\
    \ AAA has the same effect as using paragraphs to break up a page of continuous\
    \ text.\n\nIf all of your tests are similarly consistent, both organizationally\
    \ and visually, a developer's eyes alone can settle on the test part they're most\
    \ interested in. That consistency alone can significantly reduce the time anyone\
    \ must otherwise spend reading through any given test.\n\nTest comprehension starts\
    \ with reading its name. A well-named test summary favors the example (the test\
    \ code itself) demonstrates. You learn more about improving your test names in\
    \ Tests as Documentation, on page 189.\n\nOnce you learn the test's intent through\
    \ its name, you might next look at the act step. It will tell you how the test\
    \ interacts with the system to trigger the behavior by the test name.\n\nThen,\
    \ read the arrange step to see how the system gets into the proper state to be\
    \ tested. Or, if you already know (or don't care) how things are arranged, focus\
    \ on the assert step to see how the test verifies the desired behavior occurred.\n\
    \nUltimately, only you will know parts of a test you need to focus on, and that\
    \ interest will change from time to time. For example, if you must add a new behavior\
    \ related to an existing one, you'll probably focus heavily on the arrange of\
    \ the related test to understand how it sets up. If you instead"
