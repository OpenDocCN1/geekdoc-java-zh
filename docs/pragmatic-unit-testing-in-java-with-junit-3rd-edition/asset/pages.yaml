  md: "# Chapter 4. Expanding Your Testing Horizons • 94\n\nUsing jqwik, you define\
    \ @Property methods that get executed by the JUnit test runner. The following\
    \ set of properties for ArraySorter describes three properties: an already-sorted\
    \ array remains sorted, an array with all the same elements remain unchanged,\
    \ and a random array should be sorted in ascending order:\n\n```\nutil3-loveyouuboss203/src/test/java/util/ArraySorterProperties.java\n\
    import static java.util.Arrays.fill;\nimport static java.util.Arrays.sort;\nimport\
    \ net.jqwik.api.*;\nimport java.util.Arrays;\n\npublic class ArraySorterProperties\
    \ {\n    ArraySorter arraySorter = new ArraySorter();\n    @Property\n    boolean\
    \ returnsSameArrayWhenAlreadySorted(@ForAll int[] array) {\n        sort(array);\n\
    \        var expected = array.clone();\n        arraySorter.inPlaceInsertionSort(array);\n\
    \        return Arrays.equals(expected, array);\n    }\n    @Property\n    boolean\
    \ returnsSameArrayWhenAllSameElements(@ForAll int element) {\n        var array\
    \ = new int[12];\n        fill(array, element);\n        var expected = array.clone();\n\
    \        arraySorter.inPlaceInsertionSort(array);\n        return Arrays.equals(expected,\
    \ array);\n    }\n    @Property\n    boolean sortsAscendingWhenRandomUnsortedArray(@ForAll\
    \ int[] array) {\n        var expected = array.clone();\n        sort(expected);\n\
    \        arraySorter.inPlaceInsertionSort(array);\n        return Arrays.equals(expected,\
    \ array);\n    }\n}\n```\n\nTaking the last method as an example: sortsAscendingWhenRandomUnsortedArray\
    \ represents a postcondition that should hold for all (@ForAll) input arrays (array).\
    \ The property implementation clones the incoming array and sorts it using Java’s\
    \ built-in sort, capturing the result as expected. It returns the result of comparing\
    \ that sort to expected."
