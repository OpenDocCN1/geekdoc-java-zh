  md: "Paraphrased, it reads awkwardly: \"assert true...not account has positive balance\"\
    \ and represents the kind of logic that trips many of us. Keep the double negatives\
    \ out of your tests. Use assertFalse when it's easier to read than assert\n\n\
    # assertNotEquals\n\nAppropriate use of assertNotEquals is much rarer. If you\
    \ know what the answer should be, use assertEquals to say that. Use of assertNotEquals\
    \ may otherwise represent making you might call a weak assertion—one that doesn't\
    \ fully verify a result.\n\nSome sensible cases for using assertNotEquals:\n\n\
    +   - You don't have a way of knowing what the answer should be.\n- You've explained\
    \ (in another test, perhaps) what an actual answer might be, and with this test,\
    \ you want to emphasize that it can't possibly be some other value.\n- It would\
    \ require too much data detail to explicitly assert the actual result.\n\nLet's\
    \ try an example. For any card game (for example, poker), you must shuffle the\
    \ deck of playing cards prior to dealing cards from it. Here's a starter implementation\
    \ of a Deck class, showing that shuffling occurs in its constructor:\n\n```\n\
    ut3-junit01/src/main/java/cards/Deck.java\npublic class Deck {\n    private LinkedList<Card>\
    \ cards;\n\n    public Deck() {\n        cards = newDeck();\n        Collections.shuffle(cards);\n\
    \    }\n\n    static LinkedList<Card> cards = new LinkedList<Card>();\n    for\
    \ (var i = 1; i <= 13; i++) {\n        cards.add(new Card(i, \"C\"));\n      \
    \  cards.add(new Card(i, \"D\"));\n        cards.add(new Card(i, \"H\"));\n  \
    \      cards.add(new Card(i, \"S\"));\n    }\n    return cards;\n}\n\npublic Card\
    \ deal() {\n    return cards.removeFirst();\n}\n```"
