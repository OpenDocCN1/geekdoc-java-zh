  md: "# assertNull\n\nassertNull is equivalent to doing assertEquals(null, someValue).\n\
    \nThe InMemoryDatabase class needs a public way for clients to retrieve customers\n\
    by their id. Here's an implementation of a method:\n\n```\nut3-junit/01/src/main/java/persistence/InInMemoryDatabase.java\n\
    public class InMemoryDatabase {\n    Map<String, Customer> data = new HashMap<>();\n\
    \    // ...\n    public Customer get(String id) {\n        return data.getOrDefault(id,\
    \ null);\n    }\n}\n```\n\nHow many tests do you need to cover that method? The\
    \ word \"Or\" in getOrDefault\nis a solid hint that you'll want at least two.\
    \ In listing, the first test is the\n\"happy path\" case where a Customer is successfully\
    \ retrieved:\n\n```\nut3-junit/01/src/test/java/persistence/InInMemoryDatabase.java\n\
    InMemoryDatabase db = new InMemoryDatabase();\n\n@Test\nvoid returnsCustomerCorrespondingTo()\
    \ {\n    var customer = new Customer(\"42\", \"Mr Creosote\");\n    db.add(customer);\n\
    \nvar retrieved = db.get(\"42\");\n    assertEquals(customer, retrieved);\n}\n\
    \n@Test\nvoid returnsNullForNonexistentKey() {\n    assertNull(db.get(\"42\"));\n\
    }\n```\n\nThe second test demonstrates the use of assertNull: if you attempt to\
    \ retrieve\nanything (in this case) from a newly created db (into which nothing\
    \ has\nbeen inserted), it should return null.\n\n# assertNotNull\n\nassertNotNull\
    \ is the opposite of assertNull, naturally. It's used to assert that a ref-\n\
    erence points to something, not nothing.\n\nLike assertNotNull, many uses of assertNotNull\
    \ are dubious.\n\nSome folks to JUnit introduce assertNotNull checks for references\
    \ to newly\ninstantiated objects:"
