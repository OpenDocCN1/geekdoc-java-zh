  md: '# An Integration Process Checklist


    Here’s a summary of steps as a developer for practicing continuous integration:


    +   1. Pull from your repo to get your local codebase up to date.

    2. Change the code, running unit tests as you go.

    3. Pull from the repo to integrate any new changes from teammates.

    4. Manually review the incoming changes as appropriate.

    5. Run your tests to ensure that the integrated code works.

    6. Push your changes to the next step if any of your tests are failing.


    Don’t advance to the next step if any of your tests are failing.


    A CI process fosters healthy peer pressure against costly code. Developers quickly
    habituate themselves to running their unit tests before check-in so as to waste
    their ‘teammates’ time by causing the CI build process to fail.


    ![](img/5f9fd301af41bda177ca04d9f939d028_255_0.png)


