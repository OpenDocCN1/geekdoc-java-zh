- img_proc: true
  md: 'Chapter 8. Refactoring to Cleaner Code · 148


    +   - Cohesive: It groups related concepts together and apart from unrelated concepts.


    +   - Confirmable: It can be easily verified with tests.


    Your unit tests provide you with that last facet of clean code.


    # A Little Bit o’ Refactor


    Refactoring is a fancy way to indicate that you’re transforming the underlying
    structure of your code—its implementation details—while retaining its existing
    functional behavior. Since refactoring involves reshaping and moving code, you
    must ensure your system still works after such manipulations. Unit tests are the
    cheapest, fastest way to do so.


    Refactoring is to coding as editing is to writing. Even the best (expository)
    writers edit most sentences they write to make them immediately clear to readers.
    Coding is no different. Once you capture a solution in an editor, your code is
    itself harder to follow than necessary.


    Writers follow the mindset to write for themselves and for others. To do so as
    a programmer, first, code your solution in a way that makes sense to you. Then,
    consider your teammates who must revisit your code at some point in the future.
    Rework your code to provide a clearer solution now while it makes sense to you.


    > Code in two steps: first, capture your thoughts in a correct solution. Second,
    clarify your solution for others.


    ![](img/5f9fd301af41bda177ca04d9f939d028_163_0.png)


    Confidence is the key consideration when it comes to refactoring. Without the
    confidence that your unit tests provide, you’d want to be cautious about “fixing”
    code that’s already working. In fact, without unit tests, you might think, “it
    ain’t broke. Don’t fix it.” Your code would start its life unedited—with deficiencies—and
    get a little worse with each change.


    If you’ve followed the recommendations in this book, however, you can make changes
    whimsilly. If you think of a new name for a method, one that makes more sense?
    Rename it (ten seconds in a good IDE; perhaps minutes otherwise), run your tests,
    and know seconds later that nothing broke. Method too long and hard to follow?
    Extract a chunk of it to a new method, and run your tests. Method in the wrong
    place? Move it, run tests. You can make small improvements to your codebase all
    day long, making it easier (cheaper) to work with.


