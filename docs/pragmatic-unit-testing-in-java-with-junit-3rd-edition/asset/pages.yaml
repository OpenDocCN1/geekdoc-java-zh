  md: "# Testing Common Code Circumstances\n\nAs you write more tests, you'll realize\
    \ that you're often facing a number of common circumstances. Here's a handful\
    \ of them:\n\n+   - Add an item to a list\n- Do something if a conditional is\
    \ met\n- Update all items in a list that match a predicate\n- Remove all items\
    \ matching a predicate from a list\n- Throw an exception when a conditional is\
    \ met\n\nLists and other collection types are a heavy part of software development.\
    \ You should be able to bang out tests involving lists without much thought.\n\
    \nIn this section, you'll work through how you might write tests for each of these\
    \ common needs. Hopefully, these examples will help you extrapolate and learn\
    \ to write tests for other data structures (Maps, Sets, arrays, etc.) and operations\
    \ (loops, streams, math, etc.).\n\n# Add an Item to a List\n\nHere's some true\
    \ code for a class container—DestinationList—that allows to add FixedLocation\
    \ objects to it, one by one.\n\n```\nut3-06/src/main/java/units/DestinationList.java\n\
    import java.util.ArrayList;\nimport java.util.List;\n\npublic class DestinationList\
    \ {\n    private FixedLocation locations = new ArrayList<>();\n\n    public void\
    \ add(FixedLocation location) {\n        locations.add(location);\n    }\n\n \
    \   public List<FixedLocation> getLocations() {\n        return locations;\n \
    \   }\n}\n```\n\nAt a glance, you pretty know the code in DestinationList works.\
    \ Doesn't matter, though—it's always possible for such a small amount of code\
    \ to hide a mistake. The singular concept implemented in DestinationList—adding\
    \ a location—requires three separate code points: a method to add the location\
    \ to a list, a field that creates and initializes the list, and a method that\
    \ returns the list. That lack of concision only increases the possibility of a\
    \ defect.\n\nDestinationList will change and grow as requirements for \"add location\"\
    \ change or as other behaviors are added. Defects will be increasingly harder\
    \ to spot."
