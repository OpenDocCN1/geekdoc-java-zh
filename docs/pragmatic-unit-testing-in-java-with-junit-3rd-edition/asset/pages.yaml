  md: '# Establishing Organization in JUnit Tests


    Your JUnit learnings so far include:


    +   * How to run JUnit and understand its results

    * How to group related test methods within a test class

    * How to group common test initialization into a @BeforeEach

    * A deep dive into JUnit assertions (the previous chapter)


    Generally, you want at least one test class for each production class you develop.
    You''ll dig into the topic of test organization within a test class. You''ll learn
    about:


    +   * The parts of a test

    * Initializing and cleaning up using lifecycle methods

    * Grouping related tests with nested classes

    * The JUnit test execution lifecycle

    * Avoiding dependency challenges by never ordering tests

    * Executing multiple test cases for a single test using parameterized Test


    # The Parts of an Individual Test


    A handful of chapters ago see (Scannability: Arrange—Act—Assert, on page 18),
    you learned how AAA provides a great visual mnemonic to help readers quickly understand
    the core parts of a test.


    Some developers refer to a "four-phase test,"^1 where each test can be broken
    into (wait for it) four parts or phases:


    +   * Set up state/data in what matters called a fixture. Think of a fixture as
    the context in which a test runs—its world, so to speak. The fixture is


    > 1. http://xunitpatterns.com/Four%20Phase%20Test.html'
