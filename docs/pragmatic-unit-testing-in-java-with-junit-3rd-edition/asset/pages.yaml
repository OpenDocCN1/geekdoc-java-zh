  md: "# Are You Kidding Me? Addressing Concerns over Performance • 163\n\niterates\
    \ through the criterion collection. Your code now loops three times instead of\
    \ one. You've potentially tripled the time to execute matches.\n\nDo you have\
    \ a real performance problem relevant to the real requirements, or do you only\
    \ suspect one exists? Many programmers speculate about where performance problems\
    \ might lie and what the best resolution might be. Unfortunate, such speculations\
    \ can be quite wrong.\n\n![](img/5f9fd301af41bda177ca04d9f939d028_178_0.png)\n\
    \nThe first answer to any potential performance problem is to measure. If understanding\
    \ performance characteristics is a pervasive and critical concern, you want to\
    \ do analysis from the perspective of end-to-end functionality—more holistically—rather\
    \ at the level of individual unit or method performance. (You'll still ultimately\
    \ be narrowing down to a hopefully small number of methods that need to be fixed.)\
    \ For such needs, you'll want a tool like JMeter. You can also incorporate JUnitPerf²\
    \ which allows you to write tests using JUnit.\n\nIf you have an occasional concern\
    \ about the performance of an individual unit, you can create a few \"row your\
    \ own\" performance probes. As long as you're careful with your conclusions, they\
    \ will be adequate for your needs.\n\nThe following code in the context of a JUnit\
    \ test (though it has no assertions and is currently not a test) displays the\
    \ number of milliseconds elapsed. The probe creates a Criteria object with 20\
    \ questions. It loops a million times. Each loop creates a new Profile, adds randomized\
    \ answers to the 20 questions, and then determines whether or not the profile\
    \ meets the criteria.\n\n```\nut3-refactor/sc12/test/java/iloveyoubous/AProfilePerformance.java\n\
