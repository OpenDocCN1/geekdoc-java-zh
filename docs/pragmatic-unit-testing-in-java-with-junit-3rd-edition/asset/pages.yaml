  md: "+   - What happens if you add only one credit rating?\n- What happens if you\
    \ don't add any credit ratings?\n- Are there any exceptional cases—conditions\
    \ under which a problem could occur? How does the code behave under these conditions?\n\
    \nStarting with a happy path test is one choice; you have other options. One is\
    \ to start with the simplest possible test, move on to increasingly complex tests,\
    \ and finally to exceptional cases. Another option is to start with the exceptional\
    \ cases, first cover happy path cases in complexity order. Other ordering schemes\
    \ are, of course, possible.\n\nWhen writing unit tests for code you've written,\
    \ ultimately, the order doesn't matter. But if you follow a consistent approach,\
    \ you'll be likely to miss something. Throughout this book, the progression you'll\
    \ prefer will be to start with the simplest case, then move on to increasingly\
    \ complex path cases, and then to exception-based tests.\n\n# The Simplest Possible\
    \ Case\n\nThe simplest case often involves zero or some concept of nothing. Calculating\
