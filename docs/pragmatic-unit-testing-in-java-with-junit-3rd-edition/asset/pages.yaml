    # Avoiding Dependency Despair: Don’t Order Your Tests!


    JUnit tests don''t run in their declared (top to bottom) order. In fact, they
    don''t run in any order that you''d easily be to determine or depend on, such
    as alphabetically (“They’re likely returned in the order that a call to java.lang.Class.getClass()
    returns, which is “not sorted and not in any particular order,” per its Javadoc.)


    You might be tempted to think that your tests run in a specific order: “I’m writing
    a test around newly created accounts, which have a zero balance. A second test
    can add $100 to the account, and I can verify that amount. I can then add a test
    that runs third, in which it will deposit $50 and ensure that the new balance
    is $150.”


    While JUnit 5 provides a way to force the ordering of test execution, using for
    unit tests is a bad idea. Depending on test order might help you avoid needlessly
    testing common setup in multiple test cases. But it will usually lead you down
    the path to wasted time. For example, you''re running tests, and the fourth test
    fails. Was it because of a real problem in the production code? Or was it because
    one of the preceding three tests (which one?) left the system in newly unexpected
    state?


    With ordered tests, you''ll also have a harder time understanding any test that''s
    dependent on other tests. Increasing dependencies is as costly in tests as it
    is in your production code.


    > Unit tests should verify isolated units of code and not depend on any order
    of execution.


    Rather than creating headaches by forcing the order of tests, use @BeforeEach
    to reduce the duplication of common initialization. You can also extract helper
    methods to reduce redundancy and amplify your tests'' abstraction level.'
