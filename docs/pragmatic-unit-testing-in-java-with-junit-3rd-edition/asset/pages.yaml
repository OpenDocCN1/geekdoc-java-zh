  md: '+   - Conformance—Does the value conform to an expected format, such as an
    email address or filename? What does the method do when passed an invalid format?
    Does a string parameter support upper or mixed case?


    +   - Ordering—Is the set of values ordered or unordered as appropriate? What
    happens if things happen out of chronological order, such as an HTTP server that
    returns an OPTIONS response after a POST instead of before?


    +   - Range—Is the value within reasonable minimum and maximum values? Can any
    computations result in numeric overflow? range


    +   - Reference—Does the object need to be in a certain state? What happens if
    it’s in an unexpected state? What if the code references something that’s not
    under its direct control?


    +   - Cardinality—Are there exactly values? Have you covered all your bases with
    ZOM? Can it handle large volumes? Is there a notion of too many? What if there
    are duplicates in a list that shouldn''t allow them (for example, a roster of
    classroom students)?


    +   - Time (absolute and relative)—Is everything happening in order? At the right
    time? In time?


    Many of the defects you''ll code in your career will involve similar corner cases,
    so you''ll positively cover them with tests.


    # Summary


    You have worked through writing tests for a number of common unit scenarios. Your
    own “real” code test will, of course, be different and even more involved. How,
    how you approach writing tests for your code will be similar to the approaches
    you''ve learned.


    Much of the code you try to test will be dependent on other classes that are volatile,
    slow, or even incomplete. In the next chapter, you''ll learn how to use test doubles
    (colloquially referred to as mock objects or mocks) to break those dependencies
    so that you can test.'
