  md: "► Answer profileAnswerMatching(Criterion criterion) {\n  return answers.get(criterion.questionText());\n\
    }\n\nEach extract method that you increases the conciseness of matches bit by\
    \ bit. Using intent-revealing names for the new methods increases the clarity\
    \ of matches. The new methods also represent opportunities to move responsibilities\
    \ to where they belong. Profile gets simpler than the previously barren Criterion\
    \ builds up its usefulness.\n\n# # Removing Temporaries of Little Value\n\nTemporary\
    \ variables ('temps') have a number of uses. They can cache the value of an expensive\
    \ computation or collection that change throughout the body of a method. A method\
    \ can also clarify the intent of code—a valid choice if it's used only once.\n\
    \nIn matches, the answer variable provides none of those three benefits. You can\
    \ inline such a pointless by replacing occurrences of it with the answerMatching(criterion)\
    \ expression. In IntelliJ IDEA, inline a variable by following these steps:\n\n\
    +   1. Click its name.\n2. Open the context menu (via right-click).\n3. Select\
    \ Refactor ► Inline Variable from the assignment.\n\nAny references to the variable\
    \ are replaced with the right-hand side of the assignment. The assignment statement\
    \ disappears:\n\n```\nutj3-refactor/07/src/main/java/iloveyouboss/Profile.java\n\
    public boolean matches(Criteria criteria) {\n  for (var criterion: criteria) {\n\
    \    var match = criterion.isMatch(profileAnswerMatching(criterion));\n    //\
    \ ...\n  }\n  // ...\n}\n```\n\nThe true intent for match can be understood directly.\
    \ Paraphrasing: a match exists when the criterion is a match for the corresponding\
    \ profile answer.\n\n# # Speeding Up with Automated Refactoring\n\nYou can, of\
    \ course, do this or any other refactoring manually, cutting and pasting little\
    \ bits of code until you reach the same outcome. But once you've"
