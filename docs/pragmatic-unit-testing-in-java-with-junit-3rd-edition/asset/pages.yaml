  md: "# Expecting Exceptions\n\nIn addition to ensuring the happy path through your\
    \ code works, you also need to verify the unhappy cases. For example, you'll want\
    \ to write tests that demonstrate when code can throw exceptions. These tests\
    \ are necessary to provide a full understanding of the behaviors to developers\
    \ who must work with the code.\n\nThe ever-evolving Java language has driven the\
    \ continual development of JUnit as well—there are no fewer than four ways to\
    \ write exception-based tests in JUnit. You'll take a look at a couple of these.\n\
    \nLet's examine a simple case: ensure the account code throws InsufficientFunds-Exception\
    \ when a client attempts to withdraw more than the available balance.\n\n# Newer\
    \ School: assertThrows\n\nThe assertThrows assertion, available in JUnit since\
    \ version 4.13, should cover all your needs when writing exception-based tests.\
    \ Prefer it over the other mechanisms.\n\nThe most useful assertThrows form takes\
    \ two arguments: the type of the exception expected to be thrown and an executable\
    \ (usually a lambda, or method reference). The executable executes the code expected\
    \ to throw the exception.\n\nWhen the assert gets executed by JUnit, the code\
    \ in the lambda is run. If that code throws no exception, the assertion passes\
    \ if the type of the exception object matches or is a subclass of the expected\
    \ type.\n\nHere's assertThrows in action. The lambda argument to assertThrows\
    \ attempts to withdraw 100 from a newly created account (that is, one with no\
    \ money):\n\n```\nut3-junit-001/src/test/java/scratch/AnAccount.java\nimport static\
    \ org.junit.jupiter.api.assertThrows;\n// ...\n\n@Test\nvoid throwsWhenWithdrawingTooMuch()\
    \ {\n    var thrown = assertThrows(InsufficientFundsException.class,\n       \
    \ () -> account.withdraw(100));\n    assertEquals(\"balance only 0\", thrown.getMessage());\n\
    }\n```\n\nCalling assertThrows returns the exception object. This test assigns\
    \ it to the thrown variable to allow asserting against its message string."
