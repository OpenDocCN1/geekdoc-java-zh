    \ writing tests to describe how and when code propagation gates errors. You'll\
    \ learn about that Expecting Exceptions, on page 112.\n\n# Fast Tests\n\nMock\
    \ objects are essential for creating unit tests that aren't beholden to volatile\
    \ external dependencies, such as the Nominatim API. An added bonus of employing\
    \ mock objects: you gain tremendously faster tests.\n\nTremendously? There's no\
    \ unit testing standard for what fast and slow mean. Perhaps it's personal: if\
    \ you're unwilling to wait for tests to complete and instead, forego or defer\
    \ them, they're too slow.\n\nHere's another way to characterize a test's speed:\
    \ if it runs code that ultimately interacts with external dependencies—files,\
    \ and network calls—it's slow. If the otherwise executes Java code that interacts\
    \ only with more Java code and no external dependencies, it's usually fast.\n\n\
    Slow tests take dozens, hundreds, or thousands of milliseconds to execute. Fast\
    \ tests each take, at most, a few milliseconds to execute.\n\nMilliseconds add\
    \ up. Consider a suite of 2500 unit tests. If the average execution time of each\
    \ test is 200ms, running them takes over eight minutes. If, instead, each test\
    \ takes 5ms, running them all takes less than 15 seconds.\n\nYou might run an\
    \ eight-plus-minute test suite two or three times a day. You can run a 15-second\
    \ suite many times per hour."
