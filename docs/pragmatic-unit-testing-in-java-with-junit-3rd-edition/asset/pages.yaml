    # Dealing with Failure


    You previously learned to click on the JUnit run icon to the class declaration
    to execute all tests. But you''re going to be running tests quite often—potentially
    hundreds of times per day, and m about is much slower, labor-intensive process.
    It behooves you to be more efficient. Repetitive stress injuries are real and
    unpleasant.


    Any good IDE will show you the appropriate keyboard shortcut when you hover over
    a button. Hovering over the JUnit "run" button reveals Ctrl-Shift-R as the appropriate
    shortcut in your IDE. Hover over yours. Down the shortcut it provides. Press it
    and run your tests. Press it again. Again. And remember it. And from here on,
    for the thousands of times you will inevitably run your tests, use the keyboard.
    You''ll go faster, and your will thank you.


