  md: '# Foreword


    If you''d told me 21 years ago that today I''d be writing the foreword for the
    third edition of our then fresh-off-the-press Unit Testing in Java book, I''d
    have laughed. Unit testing was a pretty obscure activity back then, practised
    mostly by agile folk and other zealots. Our book was written with hope and also
    with no expectation that testing might become common.


    Testing had something of a wild ride between then and now. For maybe the first
    ten years, it to be first an accepted practice and later a mandated one. Teams
    who had never previously written automated tests found that they had a newfound
    confidence, both during initial development and, as importantly, when they later
    made changes. Testing was good.


    Sometimes during the start of the second decade, though, there seemed to be something
    of a sea change. Testing went from being a jolly good to being something of a
    religion. If you weren''t on board with all the latest testing ideas, if you said
    out loud that you didn''t always write tests, you became a pariah.


    Now, things seemed to be a little more rational.


    Every single practice we follow as developers is contextual; there are no universal
    rules that every developer must follow. Testing is just one of these practices.
    Creating and maintaining tests is a good thing, except when it isn''t. Tests can
    make it easier to refactor code until you find yourself spending an order of magnitude
    more updating the tests than you did moving a function from module A to module
    B. Test coverage is a ridiculous metric to impose, but it the code that isn''t
    covered is the code that''s hard to test, so that''s code that needs refactoring
    anyway.


    So, a pragmatic developer (like you) has to make informed decisions about testing,
    just as you do about all of your work. This is the book that gives you the knowledge
    and confidence to make those choices.'
