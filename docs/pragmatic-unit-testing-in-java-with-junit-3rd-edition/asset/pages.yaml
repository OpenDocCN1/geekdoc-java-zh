  md: '# Chapter 12. Adopting Team Practices • 242


    > Tools like Git can be configured to abort commit/push attempts when unit tests
    fail locally.


    CI is a foundation for practising continuous deployment (CD), wherein each successful
    build triggers a deployment to production. Amazon® and Netflix® are companies
    that deploy to production thousands of times daily using CD.


    # Conflicts and Merges


    If two or more developers separately make changes to the same codebase, it''s
    possible for their combined changes to break the system (even though the individual
    contributions worked prior to integration). In order for CI to work, each developer
    wishing to push must first pull the latest code from the central repository. Run
    their fantastic unit test suite to ensure nothing is broken and push up what becomes
    the latest version of the system. If you don''t have a fantastic unit test suite,
    you must carefully review the combined code first. (Corollary: folks without a
    fantastic unit test suite or some other comprehensive test suite are usually practicing
    CI).


    A healthy team that''s created a trustworthy test suite integrates frequently.
    Some teams who practice TDD push up every TDD cycle, in other words, as often
    every few minutes. Once they get a new behavior and clean up the code, they integrate
    that increment. “continuous” aspect of CI makes it work and be successful. Feedback
    comes sooner and in smaller increments. It''s easier and faster to fix problems
    in small increments.


    In contrast, developers on less advanced teams defer their changes until a feature
    is complete. They typically make their changes on code branches the course of
    a day, a few days, and sometimes a few weeks. The amount of new code that must
    subsequently be integrated can be considerable, significantly likely to conflict
    with existing code.


    Developers can spend hours, even days, managing a meticulous merge process to
    integrate a long-lived branch. The correct technical term for such a nightmare
    is “merge hell.” The duration of the nightmare often increases with the age of
    the branch.


    Better communication and division of labor can help minimize conflicts and merge
    hell. But consider also mob programming (see Active Review on Mob Programming,
    on page 240).


