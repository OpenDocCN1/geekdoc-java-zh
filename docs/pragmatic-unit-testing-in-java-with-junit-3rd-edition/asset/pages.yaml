  md: 'are thus probable for a second reason: you''ll undoubtedly change the sophistication
    of your matching algorithm over time.


    The Profile class violates the Single Responsibility Principle (SRP) of object-oriented
    class design, which says classes should have only one reason to change. (The SRP
    is one of a set of class design principles—see the following sidebar.) Focusing
    on the SRP decreases the more responsibilities a class has, the easier it is to
    break other behaviors when changing code within the class.


    # SOLID Class-Design Principles


    In the mid-1990s, Robert C. Martin gathered five principles for object-oriented
    class design, presenting them as the best guidelines for building a maintainable
    object-oriented system. Michael Feathers attached the acronym SOLID to these principles
    in the early 2000s.


    +   * Single Responsibility Principle (SRP). Classes should have one reason to
    change. Keep your classes small and single-purpose.

    * Open-Closed Principle (OCP). Design classes to be open for extension but closed
    for modification. Minimize the need to make changes to existing classes.

    * Substitution Principle (LSP). Subtypes should be substitutable for their base
    types. Method overrides shouldn''t break a client''s expectations for behavior.

    * Interface Segregation Principle (ISP). Clients shouldn''t have to depend on
    methods they don''t use. Split a larger interface into a number of smaller interfaces.

    * Dependency Inversion Principle (DIP). High-level modules should not depend on
    low-level modules; both should depend on abstractions. Abstractions should not
    depend on details; details should depend on abstractions.


    a. http://en.wikipedia.org/wiki/SOLID_(object-oriented_design)


    Smaller, more focused classes really do provide value in another context—re-use!
    In contrast, a very large class with lots of responsibilities cannot possibly
    be used in other contexts.


    Underlying the SOLID principles are the concepts of cohesion and coupling. Classes
    in your systems should exhibit high cohesion and low coupling. Such systems make
    change easier, and they also make unit testing easier.


    The concepts of SOLID, low coupling, and high cohesion are not new, but they''re
    not "outdated." Despite some post-modern ideas about software design, these principles
    remain valid. They''re not absolutes: all choices in software systems represent
    tradeoffs. You must balance the principles within'
