  md: "The when(...).thenReturn(...) pattern is one of a number to set up mocks using\
    \ Mockito, but it's probably the simplest to understand and code. It disturbs\
    \ the effort of setting up a mock into what's essentially a one-liner that immediately\
    \ makes sense to someone reading the code.\n\n# Injecting Mocks with Mockito\n\
    \nConstructor injection may require you to change your class's interface. A dependency\
    \ injection (DI) tool like Spring DI, Google Guice, PicoContainer can eliminate\
    \ the need for that change. You can also use Mockito, which provides nominal built-in\
    \ DI capabilities. It's not as sophisticated as the other two, but it might be\
    \ all you need. To use Mockito's DI:\n\n+   * Annotate the test with @ExtendWith(MockitoExtension.class).\n\
    * Annotate the field with @Mock Mockito initializes it as a mock object.\n* Annotate\
    \ the retriever field with @InjectMocks Mockito creates instances of retriever\
    \ and injects any @Mock fields into.\n\n```\nut3-mock-objects/src/test/java/com/langsoft/domain/AddressRetriever.java\n\
    //\nimport org.junit.jupiter.api.extension.ExtendWith;\nimport org.mockito.Mock;\n\
    import org.mockito.InjectMocks;\nimport org.mockito.junit.jupiter.MockitoExtension;\n\
    \n@ExtendWith(MockitoExtension.class)\nclass AddressRetriever {\n    @InjectMocks\n\
    \    AddressRetriever retriever;\n\n    @Mock\n    Http http;\n\n    @Test\n \
    \   void answersAppropriateAddressForValidCoordinates() {\n        when(http.get(and(contains(\"\
    lat=38.000000\"), contains(\"lon=-104.000000\"))))\n        // ...\n        //\
    \ ...\n    }\n}\n```\n\nWhen mocking objects, Mockito first seeks an appropriate\
    \ constructor—in this case, one that takes on an HTTP instance. If it finds none,\
    \ it seeks an appropriate setter method, and then finally, a field with the matching\
