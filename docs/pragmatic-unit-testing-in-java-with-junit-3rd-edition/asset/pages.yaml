  md: '# Chapter 11. Advancing with Test-Driven Development (TDD) • 232


    You could absolutely achieve full coverage with TAD. There''s no mechanical reason
    why you couldn''t write TAD tests that cover every behavior in your system. The
    reality, though, is almost no one does.


    TAD can be harder than TDD. Determining all the behavioral intents of previously
    written code can be tough, even if it was written within the last hour. It seems
    simpler, in contrast, first capture the desired outcome with a test.


    Writing tests for code with private dependencies and myriad entanglements is also
    tough. It seems simpler to shape code to align with the needs of a test instead
    of the other way around.


    Here''s a short list of reasons we don''t write enough tests when doing TAD:


    +   We run out of time and are told to move on to the next thing. "We just need
    to ship."


    +   Because it''s often hard, sometimes we give up, particularly if we''re told
    to move on.


    +   We think our code doesn''t stink. "I just wrote this, it looks great"


    +   We avoid it because unit testing isn''t as much fun as writing the production
    code.


    +   Some else told us we had to do it, which can be another discouragement for
    some of us.


    Re-read How Much Coverage Is Enough?, on page 77 if you there''s little difference
    between 75% and 100% coverage. Minimally, remember that 75% coverage means a quarter
    of the code in system remains at risk.


    # The Rhythm of TDD


    TDD cycles are short. Without all the chatter accompanying this chapter example,
    each test-code-refactor cycle takes maybe a few minutes. Increments of code written
    or at each step in the cycle are likewise small.


    Once you''ve established a short-cycle rhythm with TDD, it becomes obvious when
    you''re heading down a rattle. Set a regular limit of about ten minutes. If you
    haven''t received any positive feedback (passing tests) in the last ten minutes,
    discard what you were working on and try again,'
