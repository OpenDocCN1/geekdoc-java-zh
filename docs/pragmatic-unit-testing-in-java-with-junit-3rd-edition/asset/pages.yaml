  md: '# CHAPTER 12


    # # Adopting Team Practices


    You last learned about TDD, a concept you can employ on your own. When you work
    in a team environment, shifting to TDD represents an effective way to take your
    unit testing practice to the next, more disciplined level. In this chapter, you''ll
    learn a few other considerations for doing unit testing within a team environment.


    If you''re like most of us, you''re working on a project with other team members.
    You want to be on the same page with them when it comes to unit testing. In this
    chapter, you''ll learn about working agreements that your team must hash out to
    avoid wasting time on endless debates and thrashing. Topics include standards,
    code/test review, and continuous integration.


    # ## Coming up to Speed


    Incorporating a new practice like unit testing requires continuous vigilance.
    Even if you enjoy writing unit tests and are good at covering the code you write,
    you''ll sometimes face an uphill battle within your team. They might not be vigilant,
    and they''re probably producing code at a rate that outpaces your ability to test
    it. You might also face a team that insists on tossing all safeguards, tests included,
    in order to meet a critical deadline.


    > Unit testing isn''t free," says Joe, "We''ve gotta deliver in two weeks. We''re
    behind and just need to slam out code.


    Lucia responds to Joe, "The worst possible time to throw away unit tests while
    in crunch mode. Squeezing lots of coding into a short time will guarantee a mess.
    It''ll take longer to know if everything still works and to fix the defects that
    arise...and there''ll be a lot of those. One way or another, we''ll pay dearly
    if we dispense with quality for short-term gains.'
  merge: -1
