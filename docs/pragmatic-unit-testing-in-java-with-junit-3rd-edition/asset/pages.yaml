  md: '# Chapter 12. Adopting Team Practices


    allows time for reviewers to take a look at the changes. Prior to the meeting,
    reviewers make note of defects and categorize them based on severity.


    The inspection meeting is designed to go fast. Only the most severe problems are
    described, and discussions are constrained to clarifications only. Expressly prohibited
    during the meeting is “solutioning” any problem.


    The document producer takes away the list of all problems (including ones that
    aren’t severe) and fixes them as appropriate. A follow-up meeting to discuss the
    resolution can be held if needed.


    Fagan inspections seem similar to PRs in both that are designed to be streamlined.
    They also involve face-to-face communication, which can eliminate misunderstandings.
    The opportunity to interact also helps a team refine what is truly important to
    focus on when doing reviews.


    The PR process, Fagan inspections, and things like code walkthroughs are all post-facto—they
    occur after the code was produced. For that reason, they all suffer from a few
    challenges.


    First, reviewers aren’t usually familiar with the intimate details of the code
    product being reviewed. The best reviews–the ones from people with a deep understanding
    of the code. The reality in most shops prevents this sort of investment on the
    part of the reviewers–they’re too busy working on their own thing.


    As a result, post facto reviews fewer defects than we’d like. Reviewers can discover
    deeper-seated defects related to things you might only think of when you are deeply
    immersed in the challenge at hand. Such problems are often harder to fix after
    the fact, as they can be deeply intertwined with the existing solution.


    Second, if there are serious problems, after-the-facto reviews come too late.
    Once the code is built and seemingly ready, teams are usually under much pressure
    to ship it–by their peers, managers, and even themselves. They’re not about to
    step back and significantly rework code that’s purpose-already working. As a result,
    the team takes on problematic software that will cost them even more to maintain
    the road.


    In short, post facto reviews are too late and probably barely worth the time investment
    they require. Put another way, doing the work, reviewing it, reworking it, and
