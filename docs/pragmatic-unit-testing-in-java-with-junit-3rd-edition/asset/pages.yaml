  md: 'Who This Book Is For • xix


    Most importantly, good unit tests increase your confidence to ship your production
    system. You still need integration and/or acceptance tests, which verify end-to-end
    behavior. This book focuses only on unit tests.


    After reading this book, you''ll be able to produce lots of unit tests in no time.
    Take care—it''s easy to create lots of costly-to-maintain tests that provide little
    value. Head the advice in this book to ensure your investment in unit testing
    continues to pay off.


    # Who This Book Is For


    This book is an information-loaded introductory book for programmers (comfortable
    with Java programming) new unit testing. You''ll learn just everything you need
    to dive into testing your production systems.


    # What You Need


    To follow along and code the examples shown in this book, you''ll need the following
    three pieces of software:


    +   * Java: The examples in this book use Java 21. You can find numerous sources
    for downloading Oracle and alternative implementations.


    +   * An IDE: The examples in this book are built using IntelliJ IDEA which is
    available as both a free “community” edition as well as a licensed product), but
    you can use Eclipse, NetBeans, VSCode, vim, Emacs, or pretty any editor.


    +   * JUnit: JUnit is usually a dependency that your build tool (Gradle or Maven,
    mostly) will retrieve.


    JUnit is shipped with most major IDEs, including IntelliJ IDEA, Eclipse, and NetBeans.
    For VSCode users, JUnit support is included with its Extension Pack for Java plugin.


    If your team use another unit testing tool, the vast majority of this book applies
    to your world. Most of this book focuses on unit testing concepts and best practices,
    not a specific tool. Unit testing tools are fairly simple tools. As such, you''ll
    still be able to readily understand the tests within this book and adapt them
    to tests that use your tool.


