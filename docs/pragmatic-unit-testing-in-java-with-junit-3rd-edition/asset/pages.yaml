    \ ->\n            criterion.isMatch(profileAnswerMatching(criterion)));\n}\n```\n\
    \nThat should make a lot more immediate sense to all readers of the code. You\
    \ might also change the order of the expression to first ask if there are matches\
    \ and ensure that all required criteria are met—It logically flows a little better.\n\
    \nFor your second final bit of cleanup, the scoring logic is unnecessarily split\
    \ across the class. Move the calculateScore logic into the score accessor and\
    \ then remove calculateScore and the unused score field. Your also carries the\
    \ benefit of not including the score calculation cost if it is not used by the\
    \ client.\n\n```\nut3j-refactor/21/src/main/java/iloveyoubouss/Matcher.java\n\
    public int score() {\n    return criteria.stream()\n        .filter(criterion\
    \ ->\n            criterion.isMatch(profileAnswerMatching(criterion))\n      \
    \  .mapToInt(criterion -> criterion.weight().value)\n        .sum();\n}\n```"
