  md: "# Replacing Troublesome Behavior with Stubs • 55\n\nThe Httpimpl implements\
    \ the HTTP interface:\n```java\njut3-mock-objects/01/src/main/java/langsoft/util/Http.java\n\
    public interface Http {\n    String get(String url);\n}\n```\n\nYou will trust\
    \ Httpimpl because you need an integration test for it in /src/test/java/com/langsoft/util.\
    \ You also know that Httpimpl interacts with an external service over HTTP—a recipe\
    \ for unit testing. Any tests you write for retrieve in AddressRetriever will\
    \ ultimately trigger a live HTTP call. That carries at least two big implications:\n\
    \n+   - The tests against the live call will be slow compared to the bulk of your\
    \ other tests.\n- You can't guarantee that the Nominatim HTTP API will be available\
    \ or return consistent results. It's out of your control.\n\nA version of the\
    \ API would give you control over availability. Your builds and dev environments\
    \ would need to start/restart the service as appropriate. It would also be slow\
    \ in comparison (see Fast Tests, on page 66).\n\nYou want a way to focus on unit\
    \ testing the rest of the logic in retrieve—the code that prepares the HTTP call\
    \ and the code that handles the response—isolated from the HTTP dependency.\n\n\
    # Replacing Troublesome Behavior with Stubs\n\nThe challenge for testing is the\
    \ code in Httpimpl that calls a real endpoint. To fix the problem, your test can\
    \ stub Httpimpl's live call with logic that returns mocked-up data. You will create\
    \ an implementation of Httpimpl as a stub. It will stub the real code with a simplified\
    \ version.\n\n> A stub is a double test that supplants real behavior with a method\
    \ that returns a hardcoded value.\n\nfunctional interface: It contains exactly\
    \ one abstract method declaration (for get). As a result, you can dynamically\
    \ and concisely declare an implementation of HTTP using a lambda:\n\n```\nutj3-mock-objects/02/src/test/java/com/langsoft/domain/AnAddressRetriever.java\n\
    Http http = url -> {\n    \"address\":{\n        \"house_number\":\"324\",\n```"
