    #  Covering Other Cases: Creating a Test List


    Beyond the ZOM cases you''ve covered, you could brainstorm edge cases and exception-based
    tests. You''ll explore that in later chapters.


    As you write tests and continue to re-visit/re-read the code you''re testing,
    you''ll think of additional tests you should write. In fact, as you write the
    code yourself in the first place—before trying to write tests for it—think about
    and note the cases you''ll need for that.


    Add the cases you think of to a test list to remember to write. Cross off as you
    implement or obviate them. You can do this on paper, in a notepad file, or even
    in the test itself as a series of comments. (Perhaps in the term of 0000 cases,
    IDEs like IntelliJ IDEA and Eclipse will collect in a view as reminders.) Things
    change, so don''t end the effort to choose these tests just yet. You can read
    more on this highly useful tool in Kent Beck''s seminal book on TDD [Bec02].


