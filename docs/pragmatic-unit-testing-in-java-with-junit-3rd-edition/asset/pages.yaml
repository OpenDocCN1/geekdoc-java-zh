    I disagree. Teams that happily unit test after they write code achieve coverage
    levels of 70 percent with relative ease. Unfortunately, the remaining 30 percent
    of their code remains untested, because it''s difficult, hard-to-test code. Difficult
    code coverage hides more defects, so at least a third of your defects will probably
    lie in this untested code.


    ![](img/5f9fd301af41bda177ca04d9f939d028_97_0.png)


    > Jeff''s Theory of Code Coverage: the amount of costly code increases in the
    areas of least coverage.


    The better your design, the easier it is to write tests. Revisit Chapter 8, Refactoring
    to Cleaner Code, on page 147 and Chapter 9, Refactoring Your Code''s Structure,
    on page 169 to understand how to better structure your code. A good design coupled
    with the will to increase coverage will move you in the direction of 100 percent,
    which would lead to fewer defects. You might not reach 100 percent, and that''s
    okay.


    Developers practicing TDD (see Chapter 11, Advancing with Test-Driven Development
    (TDD), on page 211) achieve percentages over 90 percent, largely by definition.
    They write a test for each behavior they''re about to code. Those who do TDD,
    myself, rarely look at the coverage numbers. TDD makes coverage a self-fulfilling
    prophecy.


    Coverage percentages can be mislead. You can easily write tests that blast through
    a large percentage of code yet utter less of use. Most tools even care if your
    tests have assertions (which means they''re not really tests). The tests certainly
    don''t care if your tests are cryptic or prolix or if they assert nothing useful.
    Too many teams spend a fortune unit tests with decent coverage numbers but little
    value.


    Unfortunately, managers always want a single number they can use to measure success.
    The code-coverage number is a surface-level metric that means little if the tests
