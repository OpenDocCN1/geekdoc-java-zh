  md: "When you first learned about object-oriented design, you might have picked\
    \ up a recommendation to design your classes like \"the real world\". It's an\
    \ okay starting point, particularly for folks new to OO design, but don't take\
    \ it too far. Dogmatically \"real-world\" designs may seem appealing, but they\
    \ create systems that are more difficult to maintain.\n\nThe Profile class could\
    \ be construed as a \"real-world\" entity. A simplistic real-world implementation\
    \ would result in the Profile class containing all the logic related to criteria.\
    \ The version of Profile that you saw at the start of the refactoring exercises\
    \ is a real-world implementation. A system full of such larger, overly responsible\
    \ classes will be hard to understand and change. It will provide virtually no\
    \ opportunities for re-use and contain considerable duplication.\n\nCreate classes\
    \ that map to concepts, not concrete notions. The Matcher concept allows you to\
    \ isolate the code related to matching, which keeps its code simpler. The Profile\
    \ code from which it gets simpler as well.\n\nEvery code you make alters the design\
    \ of a system. Some of those changes can have negative impacts on behavior elsewhere\
    \ in the system. So far, in this chapter, you've focused on such macro design\
    \ considerations.\n\nAs you start to correct design flaws, whether micro or macro,\
    \ you'll more readily add potential problems. For example, sometimes extracting\
    \ a small amount of code to a new method will highlight a glaring obvious deficiency—one\
    \ that was not obvious when surrounded by a library of other code.\n\nThe methods\
    \ in Profile are now very small, and one of them indeed exposes a design flaw.\
    \ Let's return to the micro design space and discuss the concept of command-query\
    \ separation.\n\n# Command-Query Separation\n\n```\nut3-refactor/21/src/main/java/loveyouboss/Profile.java\n\
    public boolean matches(Criteria criteria) {\n  var matcher = new Matcher(criteria,\
    \ answers);\n  score = matcher.score();\n  return matcher.matches();\n}\n```\n\
    \nThe only remaining oddity in Profile is how it handles scoring logic. Examine\
    \ its matches method:\n\nAs a side effect, Profile stores a score. But a profile\
    \ doesn't have a fixed score. It only references a calculated score that's associated\
    \ with an attempt to match on criteria."
  merge: -1
  pgno: 195
- img_proc: true
  md: "The score side effect causes another problem, which is a client can't separate\
    \ one interest from the other. If a client wants (only) the score for a set of\
    \ criteria, it must first call the matches() method. This sort of temporal coupling\
    \ is not going to be immediately obvious to a developer and demands clear documentation.\
    \ The client would ignore the boolean value returned by matches (awkward!) and\
    \ then call the score accessor. Conversely, for a client interested in determining\
    \ whether a set of criteria matches, the call to matches ends up altering the\
    \ Profile's score attribute.\n\nA method that returns a value and generates a\
    \ side effect (changes the state of the class or other entity in the system) violates\
    \ the principle known as *command-query separation* (CQS): A method either be\
    \ a *command*, creating a side effect, or a *query* that returns a value. It should\
    \ not be.\n\nLack of CQS can create potential pain for client code. If a query\
    \ method alters the state of an object, it might not work to call that method.\
    \ You might not get the same answer a second time, and it might cause trouble\
    \ to trigger the side effect a second time.\n\nLack of CQS also violates expectations\
    \ for developers using the query method. Without careful reading of the code and\
    \ its tests, it's possible for a developer to completely overlook the side effect\
    \ and cause a problem.\n\n# Fixing the CQS Problem in Profile\n\nA client of Profile\
    \ should be free to call a method without knowing they must first call another.\
    \ Make clients happy by moving all the score-related logic into the score accessor.\
    \ It's not much work, particularly since you've moved the bulk of the logic into\
    \ Matcher.\n\n```\nut3-refactor/22/src/main/java/iloveboss/Profile.java\npublic\
    \ boolean matches(Criteria criteria) {\n    return new Matcher(criteria, answers).matches();\n\
    }\npublic int score(Criteria criteria) {\n    return new Matcher(criteria, answers).score();\n\
    }\n```\n\nMost significantly, the score method is no longer a raw accessor. It\
    \ now takes on a Criteria instance as an argument and then delegates to a new\
    \ Matcher that calculates and retrieves the score.\n\nDon't forget to delete the\
    \ score field from Profile: it is no longer needed."
