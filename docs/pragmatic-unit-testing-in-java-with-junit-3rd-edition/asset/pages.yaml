  md: '# CHAPTER 8

    Refactoring to Cleaner Code


    In Parts I and II, you dug deep into how to write unit tests and take advantage
    of JUnit. In this part, you''ll learn to take advantage of unit tests to help
    shape the design of your system, as well as document the numerous unit-level behavioral
    choices you''ve made. Your ability to keep your system simpler and your tests
    clearer can reduce development costs considerably.


    You''ll start by focusing on design "in the small," addressing the lack of clarity
    and excessive complexity that this commonplace in most systems. You''ll accomplish
    this by learning to refactor—making small, frequent edits to the code you write.
    Your design improvements will help reduce the cost of change.


    In a clear, well-designed system, it might take seconds to locate a point of change
    and understand the surrounding code. In a more typically convoluted system, the
    navigation and comprehension tasks often require minutes instead. Once you''ve
    understood the code enough to change it, a well-designed system might accommodate
    your change readily. In the convoluted system, weaving in your changes might take
    hours.


    Convoluted systems can increase your maintenance costs by an order of magnitude
    or more.


    You can, with relative ease, create systems that embody clean code. In brief,
    this describes clean code:


    +   - Concise: It imparts the solution without unnecessary code.

    - Clear: It can be directly understood.'
