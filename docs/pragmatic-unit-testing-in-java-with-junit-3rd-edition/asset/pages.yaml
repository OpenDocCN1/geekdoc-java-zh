  md: 'If you''d mistakenly swapped the order of the arguments to assertEquals, like
    this:

    `assertEquals(result, 780);`


    ...then JUnit''s error message was inaccurate and confusing:

    Expected: 0; expect 780.


    Your single-rating test doesn''t expect 0; it expects 780. The 0 is the actual
    result emanating from the call to arithmeticMean, not 780.


    You did see the test fail due to the assertEquals mismatch, so that''s a good
    thing. Had you seen something different, it would be a reason to stop and investigate—something
    is probably wrong with the test in this case. If the test shows an exception emanating
    from the production code, perhaps something isn''t set up correctly in the test
    case. If the test passes, perhaps your test isn''t really doing what you think
    it is. You''d need to carefully re-read the test to see what you''re missing or
    misrepresenting.


    > Deliberately fail your tests to prove they''re really doing something.

    Corollary: Don''t trust a test you''ve never seen fail.


    It might seem easier to get a new test to fail by changing your assertion. For
    example, you might change your assertion to assertEquals(result, 9999), which
    you know would always result in a failing test.


    But think of your tests as "documents of record" for each logical requirement.
    Prefer failing the test by changing the production code so that it no longer meets
    the requirement, not by altering the conditions of the test. It can require just
    a little more thought, but breaking production code will keep you out of trouble.


    Programmers following the practice of test-driven development (TDD) **always**
    demonstrate test failure first to demonstrate that the code they write is responsible
    for making the test pass. See Chapter 11, **Advancing with Test-Driven Development
    (TDD), on page 211** for more on how TDD practitioners build a cycle around this
    discipline.


    # JUnit''s Exceptions


    You can click the link of the first line in the stack trace to navigate precisely
    to the point where the exception emanated from the code—the `assertEquals` call.'
