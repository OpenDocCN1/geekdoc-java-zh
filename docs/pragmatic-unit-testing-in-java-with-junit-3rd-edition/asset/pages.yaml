  md: "# Documenting Your Tests with Consistent Names\n\nThe more you combine cases\
    \ into a single test, the more generic and meangling the test name becomes. A\
    \ tasked name matches doesn't tell anyone squat about what it demonstrates.\n\n\
    As you move toward more granular tests, each focused on a distinct behavior, you\
    \ have the opportunity to impart more meaning in each of your test names. Instead\
    \ of suggesting what context you're going to test, you can suggest that happens\
    \ as a result of invoking some behavior against a certain context.\n\nYou're probably\
    \ thinking, \"Real examples, Jeff, and not so much bab-ble.\" Here you go:\n\n\
    +   * **not-so-hot name** **cooler, more descriptive name**\n* makeSingleWithdrawal\
    \ withdrawalReducesBalanceByWithdrawnAmount\n* attemptToWithdrawTooMuch withdrawalMoreThanAvailableFundsGeneratesError\n\
    * multipleDeposits increaseBalanceBySumOfDeposits\n\nThat last name seems kind\
    \ of an obvious statement, but that's because you already understand the ATM domain\
    \ and the concept of deposits. Often, you're in unfamiliar territory, where the\
    \ code and business rules are unfamiliar. A precise test name can provide you\
    \ with extremely useful content.\n\nYou can go too far. Reasonable test names\
    \ probably consist of up to seven (plus or minus two) words. Longer names usually\
    \ become dense sentences that take time to digest. If test names are typically\
    \ long, your design may be amiss.\n\nSeek a consistent form for your test names\
    \ to reduce the friction that others experience when perusing your tests. Most\
    \ of the test examples in this book are named to complete a sentence that starts\
    \ with the test class name.\n\n```\nclass APortfolio {\n@Test\nvoid increasesSizeWhenPurchasingNewSymbol()\
    \ {\n  // ...\n}\n```\n\nConcatenate each test name to the class name: \"a portfolio\
    \ increases size when purchasing a new symbol.\"\n\nAnother possible form:\ndoingSomeOperationGeneratesSomeResult"
  merge: -1
