  md: '# Active Review via Pair Programming


    A good review process would let team review and reject a poor design before anyone
    tries to implement it. In the 1990s, much of software development was driven by
    design-upfront processes. A team typically invested 30 percent or more of a project
    producing speculative designs. Development work did not start until these designs
    were complete. The designs, based on exhaustively detailed requirements, were
    captured as heavy documents with copious designs and models. It worked..for a
    small number of situations.


    Heavy-front design doesn''t work for most of us because it holds poorly to that
    ever-present thing called change. Also, no matter the amount of upfront investment,
    speculative designs are often inadequate or flat-out work.


    The intent of pair programming, or pairing, is to increase quality. To pair, programmers
    work together side-by-side (or face-to-face remotely) to develop a two-heads-better-than-one
    solution. Pairing is an active form of review—its participants review each other''s
    ideas and code as they fix any problems before moving on. Pair members help each
    other adhere to standards and practices like unit testing.


    Few practices have drawn much controversy in the software development world, however,
    the thought of working with other developers closely throughout the day sends
    many screaming for the exits. Even when practiced well, pairing incurs a number
    of overhead costs. It''s also possible for a pair to produce a solution that the
    rest of the team finds problematic.


    Don''t dismiss pairing out of hand, however. When done well, even active resists
    become converts, perhaps due to the increase in quality. Some find its highly
    interactive, collaborative aspect gratifying. The PragPub article “Pair Programming
    Benefits”—3 describes some potentials for its ROI. Another article, “Pair Programming
    in a Flash,”4 lays out rules for successful pairing and points out a few pitfalls
    to avoid.


    Pair swapping can be valuable. Before a task is considered complete, a new person
    replaces one of the starting pair''s developers. This third party provides the
    perspective of not intimately involved in creating the current solution. They
    can help correct clarity and other issues not seen by the original pair. Recognize
    that to some extent, the process has reverted to work-review-rework—the new party
    is identifying and fixing problems that might not have existed had they arrived
    sooner.


