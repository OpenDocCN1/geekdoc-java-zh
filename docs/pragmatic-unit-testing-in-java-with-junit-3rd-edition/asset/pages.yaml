  md: '# CHAPTER 10


    # # Streamlining Your Tests


    You''ve wrapped up a couple of chapters that teach you how to use tests to keep
    your code clean. Now, it''s time to focus on the tests themselves.


    Your tests represent a significant investment. They''ll pay off by minimizing
    defects and allowing you to keep your production system clean through refactoring.
    But, they also represent a continual cost. You need to continually revisit your
    tests as your system changes. At times, you''ll want to make sweeping changes
    and might end up having to fix numerous broken tests as a result.


    In this chapter, you''ll learn to refactor your tests, much like you would refactor
    your production system, to maximize understanding and minimize maintenance costs.
    You''ll accomplish this by learning to identify a series of "smells" in your tests
    that make it harder to quickly understand them. You''ll work through an example
    or two of how you can transform each smell into de-odorized code.


    The deodorization process is quick. In reading through the chapter, you might
    think it would take a long time to create a test similar to the example in the
    chapter. In reality, it''s often well under fifteen minutes of real work once
    you learn how to spot the problems.


    # ## Tests as Documentation


    Your unit tests should provide lasting and trustworthy documentation of the capabilities
    of the classes you build. Tests provide opportunities to explain things that the
    code itself can''t do as easily. Well-designed tests can supplant a lot of the
    comments you might otherwise feel compelled to write.'
