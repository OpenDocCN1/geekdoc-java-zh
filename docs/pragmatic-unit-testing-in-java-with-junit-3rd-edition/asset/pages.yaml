  md: 'Increment 1: Deferring Complexity • 213


    The first step of the cycle tells you to write a test describing the behavior
    you want to build into the system. Seek to write a test representing the smallest
    possible—but useful—increment to the code that already exists.


    For your exercise, you''ll test-drive a small portfolio manager. Your requirements
    will be revealed to you incrementally as well, in batches, by your product owner
    Madhu. Imagine that each requirements batch was not previously considered. Your
    job is to deliver a solution for each incremental needed to production.


    You want to ensure that you can continue to accommodate new batches of requirements
    indefinitely. To meeting ongoing demand, your focus after getting each new test
    to pass—as part of the clean-up step in TDD—will be to distill the solution to
    employ the simplest possible design. You will seek concisely, clear, and cohesive
    code.


    Each new TDD cycle starts with choosing the next behavior to implement. For the
    smoothest progression through building a solution, you''ll seek a behavior that
    produces the smallest increment from the current solution.


    In other words, you''re trying to ensure each TDD cycle represents a little step
    that requires only a tiny bit of new code or changed code.


    You''ll step through four increments of code. You''ll be able to deliver each
    increment to production.


    # Increment 1: Deferring Complexity


    For your first requirements batch, you''re tasked with delivering very simple
    rudiments of a portfolio.


    You''ll be able to make purchases for the portfolio. For now, a purchase involves
    a stock symbol, such as SONO (Sonos) or AAPL (Apple), and a number of shares purchased
    for that symbol.


    But your solution won''t to track the actual symbols or shares of each. Madhu
    tells you that all it needs to answer are the following three:


    +   * Whether or not it is empty. A portfolio is empty if no purchases have been
    made and not empty otherwise.


    +   * How many unique symbols have been purchased—the portfolio''s size. If you
    purchase AAPL a second time, you have one unique symbol. If you still have only
    the unique symbol. If you purchase AAPL and then purchase SONO, you have two unique
    symbols.'
