  md: '# Test Smells: Generalized and Stepwise Assertions 195


    Comments represent a failure to let the code tell the story. For now, deletenthe
    two comments in testSearch.


    > Tests provide trustworthy documentation on the unit behaviors

    of your system.


    About eight statements into the test method, you notice a non-null assert—anertion
    that verifies a value is null:


    ```

    ut3-refactor-tests/02/src/test/java/util/SearchTest.java

    var matches = search.getMatches();

    asertNotNull(matches);

    asertTrue(matches.size() >= 1);

    ```


    The first line assigns the result of search.getMatches() to the matches local
    variable. The\second statement asserts that matches is not a null value. The final
    line verifiesnthe size of matches is at least 1.


    Checking that a variable isn''t null before dereferencing is a good thing, right?

    In production code, perhaps. In this, the call to assertNull adds clutter.

    It adds no value: if matches is actually null, the call to matches.size() generates

    aNullPointerException. JUnit traps this exception and errors the test. You''re
    notified

    the error, and it''s no harder to figure out the problem at.


    Like the try/catch block, calling assertNull adds no value. Remove it:


    ```

    ut3-refactor-tests/03/src/test/java/util/SearchTest.java

    var matches = search.getMatches();

    asertTrue(matches.size() >= 1);

    ```


    That''s one fewer line of test to wade through!


    # Test Smells: Generalized and Stepwise Assertions


    A well-structured test limits the interaction with the system to three steps:

    aranging the data, acting on the system, and asserting on the results (see

    Scannability:Arrange—Assert, on page 18). Although the test requires

    detailed code to accomplish each of these steps, you can improve understand-

    by organizing these details into abstractions—code elements that maximize

    the essential concepts and hide the unnecessary details.


    > Good tests provide examples of how clients interact with the

    system.'
