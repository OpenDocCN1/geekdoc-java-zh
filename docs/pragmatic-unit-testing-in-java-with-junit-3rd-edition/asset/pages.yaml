  md: "To run fuzzing with Jazzer, first create a directory in your project's test\
    \ resources. Derive its name from your fuzzer's class package the fuzzer class\
    \ name as your fuzz inputs:\n\n```\nutj3-iloveyouboss2/src/test/resources/util/AURLCreatorFuzzerInputs\n\
    ```\n\nThen run your tests with the environment variable setting JAZZER_FUZZ=1.\
    \ The fuzzing tool will display failures and add the inputs causing the failures\
    \ to files within the resource directory you created.\n\nThe fuzzer should report\
    \ that an input containing an LF (line feed character; ASCII value 10) represents\
    \ an invalid character for a URL. You, as the developer, decide how to use the\
    \ code to deal with that, if at all.\n\nYou can also collect a number of inputs\
    \ in the test resources directory. With the JAZZER_FUZZ environment variable turned\
    \ off, Jazzer will use these inputs to run what effectively regression tests.\n\
    \n# Property Testing\n\nAnother form of unit testing is property testing, where\
    \ your tests describe invariants and postconditions, or properties, about the\
    \ expected behavior of code. Property testing tools, such as jqwik, will test\
    \ these invariants using a wide range of automatically generated inputs.\n\nYour\
    \ primary reason for using property tests is to uncover edge cases and unexpected\
    \ behaviors by virtue of exploring a broader range of inputs.\n\nHere's an implementation\
    \ for the insertion sort algorithm, which performs terribly but is a reasonable\
    \ choice if your input array is sorted (or if your inputs are generally almost\
    \ sorted):\n\n```\nutj3-iloveyouboss2/03/src/main/java/util/ArraySorter.java\n\
    public class ArraySorter {\n    public void inPlaceInsertionSort(int[] arr) {\n\
    \        for (var i = 1; i < arr.length - 1; i++) {\n            var key = arr[i];\n\
    \            var j = i - 1;\n            while (j >= 0 && arr[j] > key) {\n  \
    \              arr[j + 1] = arr[j];\n                j = j - 1;\n            }\n\
    \            arr[j + 1] = key;\n        }\n    }\n}\n```\n\n+   4. https://jqwik.net"
