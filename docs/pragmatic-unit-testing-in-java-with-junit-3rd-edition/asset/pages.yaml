  md: '# Examining Outcomes with Assertions


    You''ve learned the most important features of JUnit in the prior four chapters
    of this book, enough to survive but not thrive. Truly succeeding with your unit
    testing journey will involve gaining proficiency with your primary tool, JUnit.
    In this and the next couple of chapters, you''ll explore JUnit in significant
    detail. First, you''ll focus on JUnit''s means of verification—its assertion library.


    Assertions (or *asserts*) in JUnit are static method calls that you drop into
    your tests. Each assertion is an opportunity to verify that some condition holds
    true. If an asserted condition does not hold true, the test stops right there
    and JUnit reports a test *failure*.


    To abort the test, JUnit throws an exception object of type AssertionFailedError.
    If JUnit catches AssertionFailedError, it marks the test as failed. In fact, JUnit
    marks any test as failed that throws an exception not caught in the test body.


    In order to use the most appropriate assertion for your verification need, you''ll
    want to learn about JUnit''s numerous assertion variants.


    In examples to this point, you''ve used the two most prevalent assertion forms,
    *assertTrue* and *assertEquals*. Since you''ll use them for the bulk of your tests,
    you''ll first examine these assertions more deeply. You''ll then move on to exploring
    the numerous alternative assertion choices that JUnit provides.


    In some cases, the easiest way to assert something wont is to compare to an actual
    result but to instead verify an operation by inverting it. You''ll see a brief
    example of how.


    You''ll also get an overview of AssertJ, a third-party assertion library that
    allows you to write "fluent" assertions. Such assertions can make your tests considerably
    easier to read. They can also provide more precise explanations why a test is
    failing.'
