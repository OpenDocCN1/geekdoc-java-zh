  md: '# # Seven Obscure Languages in Seven Weeks


    Explore older computer languages and discover new and fresh ideas that will change
    the way you think about programming. These languages were invented before we settled
    into our current C-style syntax and OO ideas, so language designers were free
    to imagine what was possible. You will find their insights thought-provoking,
    and their ideas will inspire you to differ (and possibly more productive) ways
    of programming. From a text manipulation language where every line is a potential
    state machine event, to a concurrent language where everything is done using actors,
    you''re sure to come away from these seven languages inspired and excited.


    ![](img/5f9fd301af41bda177ca04d9f939d028_288_0.png)


    Dmitry Zimoviev

    (270 pages) ISBN: 9798888650639. 855.95

    https://pragprog.com/book/dseven


    # # Test-Driven React, Second Edition


    Turn your React project requirements into tests and get the feedback you need
    faster than ever before. Combine the power of testing, linting, and typechecking
    directly in your coding environment to iterate on React components quickly and
    fearlessly!


    Trevor Burnham

