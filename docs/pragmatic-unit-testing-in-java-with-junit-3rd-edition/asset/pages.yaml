  md: 'Getting on the Same Page with Your Team · 237


    Here’s a short, incomplete list of unit test practices to standardize on:


    +   * Which tests developers should run prior to check-in

    * How to name classes and test methods

    * Whether to use JUnit''s assertions or an assertion library like AssertJ

    * Whether to use AAA or not

    * Which mock tool to prefer

    * Whether to prohibit console output on test runs (please do)

    * How to identify and discourage slow tests in the unit suite


    Your team should quickly adopt and adhere to most of these standards. Some will
    require continual vigilance, as eliminating console output from a test run. You
    might be able to automate solutions to ensure people comply; otherwise, you might
    find yourself continually festering folks. You might also find that some standards
    aren’t worth the effort.


    # Increasing Quality with Post Fact Reviews


    To ensure everyone adheres to standards, your team must exert collective pressure
    through some form of code review. Your team''s investment in code and unit tests
    is too expensive for individuals to do anything they want to the codebase.


    Many teams require pull requests (PRs)—a feature most closely associated with
    GitHub. A developer submits a pull request for a chunk of work deemed ready for
    integration into the main branch. GitHub notifies of the team, who reviews and
    comments on changes made. Reviewers approve by pulling (merging) it into the main
    branch.


    The PR process has become a preferred standard in many organizations. While it
    appears efficient, the PR process is the least effective of the review mechanisms.
    That''s because it is the least agile—it attempts to streamline reviews by minimizing
    face-to-face human interaction.


    You might initiate review sessions where unit test producers solicit feedback
    from others on the team. Post facto reviews can range from informal code walkthroughs
    to Fagan inspections, which are designed to streamline and standardize the review.


    When using Fagan inspections, the person creating the document—usually code—is
    responsible for soliciting reviewers, much as when doing PRs. A typical meeting
    is a couple of days later, which


    +   1. https://medium.com/pragmatic-programmers/pr-shift-left-please-part-one-b0f8bb79ef2b

    2. http://en.wikipedia.org/wiki/Fagan_inspection'
