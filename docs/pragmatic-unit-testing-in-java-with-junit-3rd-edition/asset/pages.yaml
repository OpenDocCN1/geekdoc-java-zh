    Possibly the most important when it comes to test doubles: avoid using them, or
    at least minimize their pervasiveness. If a large number of tests require test
    doubles, you''re allowing your troublesome dependencies to proliferate too much.
    Reconsider the design.


    A couple of avoidance policies:


    +   Rather than have a class depend on the persistence layer, push the responsibility
    out. Have a client retrieve the relevant data, then inject that.


    +   Collaborator classes don''t have troublesome dependencies, let your tests
    interact with their real code rather than mock them.


    Mocks are great tools, but they can also create great headaches. Take care.


