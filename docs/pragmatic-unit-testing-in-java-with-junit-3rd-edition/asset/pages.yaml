    public int size() {\n    return 0;\n}\n```\n\nHard-coding seems silly, but it\
    \ is in keeping with the test-code-and-refactor rhythm of the TDD cycle. Your\
    \ goal is to produce the simplest possible implementation for the latest test.\
    \ More specifically, you want to only solve the current set of problems. By doing\
    \ so, you avoid overengineering and premature speculation. Both will cost you\
    \ in the long run.\n\nYou are learning to design for current need so that you\
    \ can more easily take on new, never-before-considered requirements that you could\
    \ never have predicted (or designed for).\n\nNext test—make one purchase and have\
    \ a portfolio with size one:\n\n```\nut-tdd/08/src/test/java/app/Portfolio.java\n\
