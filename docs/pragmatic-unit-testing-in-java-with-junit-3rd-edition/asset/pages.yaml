  md: 'Let’s consider, then discard, a couple more possibilities for testing the Location
    class:


    +   1. The switch statement suggests a possibility that heading contains a value
    not represented in the case statements. But in this case, heading is an enum with
    four values, and you already have tests for all four values. (The compiler would
    also give you a warning otherwise.)


    +   2. The heading parameter could be null. You could write a test that shows
    nothing happens if move gets called with a null heading. However, the notion of
    having no heading is probably nonsensical in the bigger application.

    Better solutions:


    +   * Default the heading to, say, North.

    * Throw an exception in the constructor if it’s null.

    * Assume a responsible client calls move and never passes a null heading.


    For now, make that last assumption, and don''t worry about a null test.


    # Reflecting on Design


    The more side effects your code creates, the more challenging it becomes to verify.
    If one method changes a field, its new value can unexpectedly break the behavior
    in other methods that interact with the field. These intertwings of object state
    are one of the reasons you write tests.


    How you design your code has a direct impact on how easy it is to change. A simpler
    design—more direct, more concise, and less intertwined—is better because it makes
    change cheaper.


    A simpler design usually makes tests easier to write, too. Fewer intertwings of
    object state mean fewer pathways through the code that you must concern yourself
    with.


    > A simpler design makes for simpler testing.


    The corollary to that important tip:


    > Tests that are hard to write usually imply less-than-ideal design. Fix the design.'
