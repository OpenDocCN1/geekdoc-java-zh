    \ external that affects behavior. Or it can interact with another method that\
    \ does one of three things.\n\nThe code in move assigns new values to x and y\
    \ depending on which case the switch statement gets executed. These switch cases\
    \ represent the potential side effects. It's the job of your tests to verify each\
    \ one of these possible cases by tracking the state of both x and y.\n\nFour cases,\
    \ four tests. Here are the remaining three:\n\n```\nut3-units/03/src/test/java/units/Alocation.java\n\
