  md: '# Preface


    Andy Hunt and Dave Thomas wrote and published the first edition of this book in
    2003, about five years after JUnit was introduced. Yet, if you told a 2003.Java
    developer to write tests to verify their own code, they''d likely have said, "Not
    a chance. I''m a programmer, not a tester."


    Many developers since then have found value in unit testing. Rather than spend
    copious time manually testing their solutions and re-manually testing them with
    each change, these programmers write small tests (in Java) that verify small behaviors
    in the system. They run these tests through a tool (usually JUnit) and immediately
    discover if their logic is faulty.


    A decade later, unit testing had become an expected developer skill and a common
    interview topic. At the request of Andy and Dave, I overhauled Pragmatic Unit
    Testing in Java with JUnit with additional topics and up-to-date. I delivered
    the second edition in 2015.


    By 2015, unit testing was a mandate from many managers and team leads who sought
    quality in their systems. Unfortunately, many of these mandates came with well-meaning
    but misguided metric goals, particularly around code coverage. Today, many teams
    are expected to meet code coverage goals (see [Improving Unit Testing Skills Using
    Code Coverage, on page 71](https://example.com)) of 80 percent, for example.


    However, shops mandating coverage goals usually see a poor return on unit testing
    investment. Many developers game the metric because they don''t know how to leverage
    unit testing. They write just enough "tests" to meet the metric target. These
    tests provide very little value; they only minimize gate defects, they don''t
    help document system behaviors, and they afford safety for improving the design
    via refactoring.


    For many developers, the taste for unit testing has soured as a result.


    We''re another decade on, and unit testing has survived and even thrived in some
    shops, embraced by people who''ve learned to practice it properly. Its'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'most dedicated practitioners continually write tests to guide the development
    of code in a practice known as test-driven development (TDD). They achieve near-comprehensive
    code coverage in the form of fast unit tests. These tests gate most logic defects,
    document all unit behaviors, and provide the utmost confidence to continually
    clean the code.


    No testing form can help you effectively manage and document the thousands of
    unit behaviors embodied in your system. Well-written tests provide feedback within
    seconds after each change you make.


    This third edition of Pragmatic Unit Testing in Java with JUnit represents the
    staying power of a technique that remains relevant decades after its first formal
    use. This book has been overhauled—simplified, rewritten, and reorganized to make
    learning more accessible. Virtually all code examples have been reworked to use
    Java 21. Many code examples have been reworked to simplify or expand key concepts,
    and numerous examples have been added. It extends coverage on JUnit itself and
    includes a new discussion on testing code generated by an LLM.


    Unit testing remains relevant in the age of AI. Until AI can verify the code it
    writes (in 2024), you must vet code with unit tests. Amusingly, AI can help you
    write unit tests. Learn how in a final chapter, Chapter 13, Keeping AI Honest
    with Unit Tests, on page 245.


    # Why Unit Testing


    You are unit testing when you (a programmer) write code to verify units of code.
    A unit is a small bit of code that exhibits some useful behavior in your system.
    A unit doesn''t usually represent complete end-to-end behavior; it usually supports
    some small facet of functionality.


    The unit tests you write will manipulate your units—small bits of code—directly.
    As such, you''ll code them in Java. You''ll run these tests through JUnit, a tool
    that marks your tests as passing or failing.


    Here are a when and whys for writing/running unit tests:


    +   - You finished coding a feature and want to ensure it works as expected.

    - You want to document a change so that you and others understand the choices
    you coded into the system.

    - You changed the code and want to know if you broke anything.

    - You want to understand the current behavior of the system.'
