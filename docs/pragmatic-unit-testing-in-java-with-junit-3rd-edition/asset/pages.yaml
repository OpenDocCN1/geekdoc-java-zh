  md: "# Testing Common Code Circumstances • 43\n\nWhile it looks cut-and-dry, allowsAddingLocations\
    \ involves some choices discussing. The test contains only two visual chunks.\
    \ The second chunk represents the assert step, of course. Its assertion compares\
    \ the result of calling getLocations to a List of two FixedLocation objects. The\
    \ two objects in this comparison list are instantiated inline with the exact same\
    \ values as you constructed them in the arrange step.\n\nIn the assert, you are\
    \ calling getLocations. By doing so, you are implying that getLocations isn't\
    \ really what you're trying to verify (it's just an accessor), but you're using\
    \ it to support your need to inspect the locations list.\n\nIs the first chunk\
    \ the arrange step or the act step? The test name says behavior your test is trying\
    \ to verify—the act of adding locations. That the two statements in the first\
    \ chunk trigger the add behavior on the list means they represent your act step.\
    \ A subtle distinction. Some developers might consider the first chunk to be the\
    \ arrange step, and maybe that's okay, but then there's no act step.\n\nThe redundant\
    \ FixedLocation instantiations may compel you to introduce a couple of local variables\
    \ to help clarify the test. Creating such objects makes it easier to correlate\
    \ your inputs to the expected outcomes:\n\n```\nut3-units/07/src/test/java/units/ADestinationList.java\n\
    @Test\nvoid allowsAddingLocations() {\n  var locationOne = new FixedLocation(1,\
    \ 2, North);\n  var locationTwo = new FixedLocation(1, 3, East);\n\n  list.add(locationOne);\n\
    \  list.add(locationTwo);\n\n  assertEquals(List.of(locationOne, locationTwo),\
    \ list.getLocations());\n}\n```\n\nTest objects are particularly useful when most,\
    \ if not all, involve them. You can declare them as test-class constants with\
    \ more memorable, domain-appropriate names:\n\n```\nut3-units/06/src/test/java/units/ADestinationList.java\n\
    static final FixedLocation ORIGIN = new FixedLocation(0, East);\nstatic final\
    \ FixedLocation NORTHE = new FixedLocation(3, 3, North);\n```\n\n```\n@Test\n\
    void allowsAddingLocations() {\n  list.add(ORIGIN);\n  list.add(NORTHE);\n\n \
    \ assertEquals(List.of(ORIGIN, NORTHE), list.getLocations());\n}\n```"
