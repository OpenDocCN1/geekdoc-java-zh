  md: "# Test-Driven Development vs. Test-After Development 231\n\n```\nutj3-tdd/34/src/main/java/app/Portfolio.java\n\
    private void updateShares(String symbol,\n    int shares,\n    TransactionType\
    \ type) {\n    var transaction =\n    new Transaction(symbol, abs(shares), type,\
    \ clock.instant());\n    transactions.addFirst(transaction);\n    purchases.put(symbol,\
    \ sharesOf(symbol) + shares);\n}\npublic Transaction lastTransaction() {\n   \
    \ return transactions.peekFirst();\n}\n```\n\nYou might consider the solution\
    \ design at this point to be flawed. It uses two distinct data structures to manage\
    \ information that could be represented with one. If you consider that all inquiries\
    \ regarding the portfolio can be calculated from it. The information captured\
    \ in the purchases HashMap is essentially an optimized calculation.\n\nThe dual\
    \ data structure implementation is a recipe for later disaster, particularly as\
    \ the solution increases in complexity. If new behaviors are added, it's possible\
    \ that an oversight will lead to inconsistent data representations in each data\
    \ structure.\n\nThe better solution would be to eliminate the hash map, replacing\
    \ all inquiries it with operations on the history stream instead. If you're curious\
    \ what this looks like, visit versions 35 and 36 in the source distribution.\n\
    \n# Test-Driven Development vs. Test-After Development\n\nTDD centers on the simple\
    \ cycle of test-code-refactor. \"Significantly reduced defects\" would seem to\
    \ be the key benefit of practicing TDD, but it can accrue some even more valuable\
    \ benefits. Most of them derive from describing desired, incremental outcome before\
    \ coding it into the system.\n\nBy definition, TDD gives you near-complete unit\
    \ test coverage, which in turn gives you the following significant benefits:\n\
    \n+   * High confidence that the unit behaviors are correct\n* The ability to\
    \ continuously retain a high-quality design\n* The ability to incorporate new\
    \ changes safely and without fear\n* Clear, trustworthy documentation on all intended\
    \ behaviors\n\nYour cost of change can reduce dramatically as a result."
