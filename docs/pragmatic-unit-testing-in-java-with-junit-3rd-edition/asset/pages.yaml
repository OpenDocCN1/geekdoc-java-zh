    \    criteria = new Criteria(\n        new Criterion(bonusYes, IMPORTANT),\n \
    \       new Criterion(freeLunchYes, IMPORTANT));\n\n    var matches = profile.matches(criteria);\n\
    \    assertFalse(matches);\n}\n```\n\nIt'd nice to minimally change the tests.\
    \ Right now, however, they'd need to convert each list of answers into a Map<String,Answer>\
