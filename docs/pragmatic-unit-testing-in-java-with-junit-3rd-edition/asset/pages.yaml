  md: '# Advancing with Test-Driven

    Development (TDD)


    You''re now armed with what you''ll need to know about straight-up unit testing
    in Java. In this part, you''ll learn about three significant topics:


    +   - Using TDD to flip the concept of unit testing from test-after to test-driven

    - Considerations for unit testing within a project team

    - Using AI tooling to drive development, assisted by unit tests


    You''ll start with a meaty example of how to practice TDD.


    It''s hard to write unit tests for some code. Such "difficult" code grows partly
    from a lack of interest in unit testing. In contrast, the more you consider how
    to test the code you write, the more you''ll end up with easier-to-test code.

    "Well, duh!" responds your reluctant tester Joe.


    With TDD, you think first about the outcome you expect for the code you''re going
    to write. Rather than slap some code and then figure out how to test it (or even
    what it should do), you capture the expected outcome in a test. You then test
    the code needed to meet that outcome. This reversed approach might seem bizarre
    or even impossible, but it''s the core element in TDD.


    With TDD, you yield unit tests as a tool to help you shape and control your systems.
    Rather than haphazard practice where sometimes you write tests after you write
    code, and sometimes you don''t, describing outcomes and verifying code through
    unit tests becomes your central focus.


    You will probably find the practice of TDD dramatically different than anything
    you''ve experienced in software development. The way you build'
