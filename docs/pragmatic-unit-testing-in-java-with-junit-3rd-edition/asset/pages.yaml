  md: "# Assertion Messages: Redundant Messages for Assertions 103\n\n```\naccount.deposit(100);\n\
    assertEquals(150, account.getBalance());\n}\n```\n\nYou design the example for\
    \ each test, and you know the expected outcome.\nEncode it in the test with assertEquals.\n\
    \n# Assertion Messages: Redundant Messages for Assertions\n\nMost verifications\
    \ are self-explanatory, at least in terms of the code bits they'\ntrying to verify.\
    \ Sometimes, it's helpful to have a bit of \"why\" or additional context\nto explain\
    \ an assertion. \"Just why does this test expect the total to be 42?\"\n\nMost\
    \ JUnit forms support an optional final argument message.\nThe message argument\
    \ allows you to supply a nice verbose explanation of the\nrationale behind the\
    \ assertion:\n\n```\nut3-junit/01/src/test/java/scratch/AnAccount.java\n@Test\n\
    void balanceTotalOfDeposits() {\n    account.deposit(50);\n    account.deposit(51);\n\
    \n    var balance = account.getBalance();\n    assertEquals(101, balance, \"account\
    \ balance must be total of deposits\");\n}\n```\n\nThe assertion message displays\
    \ when the test fails:\naccount balance must be total of deposits => expected:\
    \ <101> but was: <102>\n\nIf you prefer explanatory comments, you might get some\
    \ mileage out\nof assertion messages. However, this is the better route:\n\n+\
    \   - Test only one behavior at a time\n- Make your names more descriptive\n\n\
    In fact, if you demonstrate only one behavior per test, you'll usually need\n\
    a single assertion. The name of the test will then naturally describe the reason\n\
    for that assertion. No assertion failure message is needed.\n\n![](img/5f9fd301af41bda177ca04d9f939d028_120_0.png)\n\
    \nElements like explanatory constants, helper methods, and intention-revealing\n\
    variable names go a long way toward making tests accessible and to the point.\n\
    The existence of comments and assertion messages in unit tests is a smell"
