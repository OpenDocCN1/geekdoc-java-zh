  md: "Your tests for Location weren't so hard to write, and that's because there's\
    \ not much entanglement within its code. Still, you'll want to look at a functional\
    \ version. In Java, records provide the best place to start—they create immutable\
    \ objects by definition—objects whose state does not change after instantiation.\
    \ It's a lot easier to reason about, when you don't have to reason about complex\
    \ ways in which the state can change.\n\n```\nut3-units/src/main/java/units/FixedLocation.java\n\
    public record FixedLocation(int x, int y, Heading heading) {\n    public FixedLocation(int\
    \ distance) {\n        switch (heading) {\n            case Case -> new FixedLocation(x,\
    \ y + distance, heading);\n            case East -> new FixedLocation(x + distance,\
    \ y, heading);\n            case South -> new FixedLocation(x, y - distance, heading);\n\
    \            case West -> new FixedLocation(x - distance, y, heading);\n     \
    \   }\n    }\n}\n```\n\nHoly hand grenade! Using Java records, all that other-boilerplate\
    \ code gets blown away. You automatically get equals, hashCode, a useful toString,\
    \ constructor, and accessor. The code shrinks to a fraction of its stateful size.\
    \ Take a look at what comparable tests looks like.\n\n```\nut3-units/src/test/java/units/AFixedLocation.java\n\
    public class AFixedLocation {\n    @Test\n    void increasesYCoordinateWhenMovingNorth()\
    \ {\n        var location = new FixedLocation(0, 0, North);\n        var mLocation\
    \ = location.move(42);\n        assertEquals(new FixedLocation(0, 42, North),\
    \ mLocation);\n    }\n    @Test\n    void increasesXCoordinateWhenMovingEast()\
    \ {\n        var location = new FixedLocation(-2, 0, East);\n        var mLocation\
    \ = location.move(5);\n        assertEquals(new FixedLocation(3, 0, East), mLocation);\n\
    \    }\n    @Test\n    void decreasesYCoordinateWhenMovingSouth() {\n        var\
    \ location = new FixedLocation(-2, 5, South);\n        var mLocation = location.move(9);\n\
    \        assertEquals(new FixedLocation(-2, -4, South), mLocation);\n    }\n}\n\
    ```"
