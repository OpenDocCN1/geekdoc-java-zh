    \ use assertion failure messages, however, take a look at AssertJ, which uses\
    \ fluent assertions that generate detailed failure messages.\n\nAssertion messages\
    \ can also provide value when employ parameterized tests, which are a JUnit mechanism\
    \ for running the test with different data. See Executing Multiple Data Cases\
    \ with Parameterized Tests, on page 131.\n\n# Other JUnit Assertion Forms\n\n\
    While assertEquals and assertTrue would account for all the assertions you need\
    \ to write, you'll want to learn about the other forms that JUnit supports. Choosing\
    \ the best assertion for the job will keep your tests concise and clear.\n\nIn\
    \ this section, you'll be introduced to the majority of JUnit's other assertion\
    \ forms, including assertFalse, assertEquals, assertSame, assertNotSame, assertNull,\
    \ and assertNotNull. You'll also get an experience-based opinion on the value\
    \ and best uses for each variant.\n\n# assertFalse\n\nNobody doesn't dislike double\
    \ negatives (or triple negatives, so says my editor). To help you say \"straight\
    \ up\" in your tests, JUnit provides some inverse assertions. Here's assertFalse—the\
    \ opposite of assertTrue—in action:\n\n```\nut3-junit-01/src/test/java/scratch/AnAccount.java\n\
    @Test\nvoid doesNotHavePositiveBalanceWhenAccountCreated() {\n    assertFalse(account.hasPositiveBalance());\n\
    }\n```\n\nYou can code the equivalent by using assertTrue if you're in a contrary\
    \ mood:\n\n```\nut3-junit-01/src/test/java/scratch/AnAccount.java\n@Test\nvoid\
    \ doesNotHavePositiveBalanceWhenAccountCreated() {\n    assertTrue(!account.hasPositiveBalance());\n\
    }\n```\n\n+   1. https://assertj.github.io/doc/"
