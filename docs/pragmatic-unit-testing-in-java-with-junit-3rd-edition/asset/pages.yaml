    \ \"))\n        .map(::capitalize)\n        .collect(joining(\" \"));\n}\n```\n\
    \nImplementing smaller concepts as methods provides numerous benefits:\n\n+  \
    \ - It's easy to derive a method that concisely summarizes the concept.\n- You\
    \ can re-use them in larger contexts without diminishing clarity.\n- You can often\
    \ digest their implementation at a glance.\n- You can move them elsewhere more\
    \ easily.\n- You can write simpler, focused tests. Read on!\n\n# Testing the Simpler\
    \ Things\n\nA method that consistently returns the same value given the same arguments\
    \ and has no side effects is a pure function. A method has side effects when it\
    \ results in any fields or arguments being changed or results in external effects\
    \ (such as a database or API call). These characteristics make pure functions\
    \ easier to test than their opposite—impure functions.\n\n> 1. https://langsoft.com/2024/07/03/unit-testing-approaches/\
