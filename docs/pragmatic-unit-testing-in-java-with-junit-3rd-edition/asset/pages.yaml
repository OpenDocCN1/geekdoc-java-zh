    import org.junit.jupiter.api.Test;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
    import static units.Heading.North;\npublic class ALocation {\n  @Test\n  void\
    \ increasesCoordinateWhenMovingNorth() {\n    var location = new Location(0, 0,\
    \ North);\n\n    location.move(42);\n\n    assertEquals(42, location.getX());\n\
    \    assertEquals(42, location.getY());\n    assertEquals(North, location.getHeader());\n\
    \  }\n}\n```\n\nThe test first creates a location and then tells the location\
    \ to move. It finally asserts that the y coordinate has changed appropriately\
    \ (since you're moving north), but neither x nor the heading has changed.\n\n\
    Earlier, you learned to verify only one behavior per test. This test does just\
    \ that—it verifies that a move operation updates the x coordinate of a location\
    \ and nothing else.\n\nIt would be nice and concise if you could consolidate the\
    \ three assertions into a single line. You can, by comparing the altered object\
    \ to a newly-created instance:\n\n```\nutj3-units/03/src/test/java/units/ALocation.java\n\
    @Test\nvoid increasesCoordinateWhenMovingNorth() {\n  var location = new Location(0,\
    \ 0, North);\n  location.move(42);\n  assertEquals(new Location(0, 42, North),\
    \ location);\n}\n```\n\nOne fewer test statement means excessive cognitive load.\n\
    The move method is a void method; in other words, it returns no value. It's also\
    \ a command (or action method)—its purpose is to tell an object to do something.\n\
    A command method can't return anything, so it must otherwise create some side\
    \ effect to have a raison d'etre. It can alter any objects passed to it as as"
