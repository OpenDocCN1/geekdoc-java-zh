  md: "Line and statement coverage metrics are similar. Line coverage measures source\
    \ lines exercised. Since a line can consist of multiple statements, tools measure\
    \ statement coverage.\n\nBranch, condition, and path coverage metrics are similarly\
    \ related. Branch coverage measures whether all branches of a conditional statement\
    \ (for example, both true and false branches of an if statement) are executed.\
    \ Condition coverage measures whether all conditionals (including in a complex\
    \ conditional) evaluated to both true and false. Path coverage measures whether\
    \ possible route through the code has been executed.\n\nMost of the popular Java\
    \ code tools support calculating line and branch coverage. You will learn about\
    \ these in this section.\n\n# Understanding Statement Coverage\n\nConsider a Batter\
    \ class that tracks a baseball batter's strike count. A batter is out after three\
    \ strikes. A swing-and-miss with the bat—strike—increments the strike count. A\
    \ foul ball (hit out of play) also increments the strike count unless the batter\
    \ already has two strikes.\n\n```\nut3-coverage/01/src/main/util/Batter.java\n\
    public class Batter {\n    private int strikeCount = 0;\n\n    public void foul()\
    \ {\n        if (strikeCount < 2)\n            strikeCount++;\n    }\n\n    public\
    \ void strike() {\n        strikeCount++;\n    }\n\n    public int strikeCount()\
    \ {\n        return strikeCount;\n    }\n}\n```\n\nThe strike method. If none\
    \ of your tests trigger its execution, its coverage is 0 percent. If your tests\
    \ do result in a call to strike, its whopping line of code gets exercised, and\
    \ then the recorded coverage is 100 percent.\n\nThe foul method contains a conditional.\
    \ It increments strikeCount only if there are fewer than two strikes. A conditional,\
    \ implemented in Java with an if statement, demands at least two tests—one that\
    \ forces the conditional block to execute (because the conditional expression\
    \ resolved to true) and one that bypasses the if block code."
