  md: "utj3-junit/01/src/test/java/persistence/InMemoryDatabase.java\n\n```\n@Test\n\
    void retrievedCustomerCorrespondingTo() {\n    var customer = new Customer(\"\
    42\", \"Mr Creosote\");\n    assertNotNull(customer); // bogus! this can't fail\n\
    \    db.customer(customer);\n\n    var retrieved = db.get(\"42\");\n    assertEquals(customer,\
    \ retrieved);\n}\n```\n\nHowever, that assertNotNull can never fail. The only\
    \ way that the customer variable, initialized in the first line of the test, can\
    \ end up null is if the Customer constructor throws an exception. If an exception\
    \ is thrown, the next line of code—the assertNotNull statement—is never executed.\
    \ If no exception is thrown, the customer reference will point to a (non-null)\
    \ object, so the assertNotNull will never fail if it does. Get that.\n\nassertNotNull\
    \ is only useful when you need to demonstrate that a reference points to a value\
    \ and you don't care at all what value is. Otherwise—if you can determine the\
    \ expected value—assertNotNull is a weak assertion. You're better off using assertEquals\
    \ compare the reference to its actual value.\n\nYou'll know when, on rare occasions,\
    \ you should reach for assertNotNull. Otherwise...don't do that.\n\n# An Added\
    \ Assortment of Asserts\n\nBut wait—there's more!\n\nThe org.junit.jupiter.api.Assertions\
    \ provides a few more assertions that are not described here. Without perusing\
    \ the users' guide or the voluminous Javadoc for the class, you wouldn't know\
    \ these assertions existed. Here they are with brief descriptions of what they\
    \ do.\n\n| assertLinesMatch | asserts that two or lists of strings match; can\
    \ involve regular expressions and \"fast forwarding\" |\n| assertAll | asserts\
    \ that all supplied executables do not throw exception |\n| assertInstanceOf |\
    \ asserts that the actual value is an instance of the expected type |\n| assertIterableEquals\
    \ | asserts that the provided Iterables are deepe equals |\n| assertTimeout |\
    \ asserts that an executable completes execution within a specific duration |\n\
    | assertTimeoutPreemptively | like assertTimeout, but runs the executable in a\
    \ separate thread |"
