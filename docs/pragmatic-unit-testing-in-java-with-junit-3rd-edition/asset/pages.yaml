  md: "# Testing Common Code Circumstances • 49\n\nThe first two tests verify the\
    \ zero case and a simple example. The last two involve distance calculations that\
    \ return interesting floating point quantities. (Stylistic note: since the heading\
    \ is irrelevant to these tests, naming it helps de-emphasize it.)\n\nAssertions\
    \ against code involving complex calculations too often provide insufficient insight\
    \ into what the code is doing. The expected value mathematically, but there's\
    \ no easy way to correlate it to the input values from just reading the code and\
    \ assert.\n\nTo derive the expected value for such a calculation, you can hand-calculate\
    \ it. You can also cross-check by using an independent source for verification,\
    \ such as an online app.\n\nDue to limitations on how floating point values are\
    \ captured, comparing two floating point values can result in unexpected discrepancies.\
    \ For this reason, JUnit provides a form of assertEquals that takes a delta value\
    \ as the third argument. This delta represents a tolerance. How much can the numbers\
    \ be before JUnit fails the assertion?\n\nIn the test, define a heading arbitrarily\
    \ to North. While the heading is required each time you construct a fixedLocation,\
    \ it's completely irrelevant to the tests. Name this constant h, to de-emphasize\
    \ the constructor argument and minimize the clutter otherwise with the tests.\n\
    \n# Throw an Exception When a Conditional Is Met\n\nIn Chapter 1, Building Your\
    \ First JUnit Test, on page 3, you write tests for arithmeticMean in CreditHistory.\
    \ The first test you wrote a zero case:\n\n```\nut3-credit-history/10/src/test/java/credit/ACreditHistory.java\n\
    @Test\nvoid noCreditRatingsHasMean() {\n  var result = creditHistory.arithmeticMean();\n\
    \  assertEquals(0, result);\n}\n```\n\nThat test described and verified the highlighted\
    \ behavior in arithmeticMean:\n\n```\nut3-credit-history/10/src/main/java/credit/CreditHistory.java\n\
    public int arithmeticMean() {\n  if (ratings.isEmpty()) return 0;\n\n  var total\
    \ = ratings.stream().mapToInt(CreditRating::rating).sum();\n  return total / ratings.size();\n\
    }\n```\n\nreport erratum · discuss"
