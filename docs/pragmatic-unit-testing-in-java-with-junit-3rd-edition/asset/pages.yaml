  md: "The following test covers the special case—when two strikes already exist.\n\
    \n```\nutj3-coverage/01/src/test/util/ABatter.java\n@Test\nvoid doesNotIncrementStrikesWhenAtTwo()\
    \ {\n    batter.strike();\n    batter.strike();\n\n    batter.fool();\n\n    assertEquals(2,\
    \ batter.strikeCount());\n}\n```\n\nIf you run this test with \"coverage\" (that's\
    \ the actual text on an IDEA menu item), if the statement conditional evaluates\
    \ to false because strikeCount is not less than two. As a result, the if-statement\
    \ body doesn't execute, and strikeCount is not incremented.\n\nHere's a window\
    \ showing the summary coverage metrics:\n\n![](img/5f9fd301af41bda177ca04d9f939d028_92_0.png)\n\
    \nMethod coverage shows that three of three possible methods defined on the Batter\
    \ class were exercised. That's not terribly interesting or useful.\n\nLine coverage\
    \ shows that three of four lines were exercised across those three methods—one\
    \ of the lines didn't get coverage when the test ran. In this case, it's because\
    \ you only ran one test in Batter. Run them all to attain 100 percent line coverage.\n\
    \nThe real value of a coverage tool is that it shows exactly what lines are exercised\
    \ and what are not. IDEA's coverage window shows colored markers in the gutter\
    \ (the gray strip of the source code) to the right of the line numbers. It marks\
    \ executed lines as green, lines not executed as red, and lines partially covered\
    \ (read on) as shown in the figure on page 74.\n\nThe increment operation (strikeCount++)\
