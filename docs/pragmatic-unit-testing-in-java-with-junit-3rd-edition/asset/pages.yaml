  md: "```\n@Test\nvoid throwsWhenNameContainsMultipleCommas() {\n    assertThrows(ValidationException.class,\
    \ () ->\n        validator.validate(\"Langr, Jeffrey J.\"));\n}\n}\n```\n\n...and\
    \ one test with assertDoesNotThrow to show nothing happens otherwise:\n\n```\n\
    jt3-01/src/test/java/scratch/ANameValidator.java\n@Test\nvoid doesNotThrowWhenNoErrors()\
    \ {\n    assertDoesNotThrow(() ->\n        validator.validate(\"Langr, Jeffrey\
    \ J.\"));\n}\n```\n\nUse assertDoesNotThrow if you must, maybe explore a different\
    \ design first. For the example here, changing the validator to expose a Boolean\
    \ method would do the trick.\n\n# Exceptionschem, Who Needs ‘em'\n\nMost tests\
    \ you will write be more carefree, happy paths where exceptions are highly unlikely\
    \ to be thrown. Java acts as a bit of a buzzkill, insisting that you acknowledge\
    \ any checked exception types.\n\nDon't clutter your tests with try/catch blocks\
    \ to deal with checked exceptions. Instead, let those exceptions loose! The test\
    \ can just throw them:\n\n```\njt3-01/src/test/java/scratch/SomeAssertExamples.java\n\
    @Test\nvoid readsFromTest() throws IOException {\n    var writer = new BufferedWriter(new\
    \ FileWriter(\"test.txt\"));\n    writer.write(\"test data\");\n    writer.close();\n\
    \    // ...\n}\n```\n\nYou're designing these positive tests so you know they\
    \ won't throw an exception except under truly exceptional conditions. Even if\
    \ an exception does get thrown unexpectedly, JUnit will trip it for you and report\
    \ the test as an error instead of a failure.\n\n# Alternate Assertion Approaches\n\
    \nMost of the assertions in your tests will be straight-forward comparisons of\
    \ expected outcomes to actual outcomes: the average credit history 780? Sometimes,\
    \ however, direct comparisons aren't the most effective way to describe the expected\
    \ outcome."
