    # Practicing Continuous Integration


    “It works on my machine!” cries Joe. "Must be something wrong with yours,” he
    says to Lucia.


    Hearken to the call of the wild developer, hard oftimes in old shops that weren''t
    practicing continuous integration (CI). With CI, all developers integrate their
    changes with the centralized repository (commonly in GitHub). A tool known as
    a CI server monitors the repository. When the repository is updated, the CI server
    triggers a new build and runs one or more sets of tests prior to completion. The
    first of these suites to execute is typically your team''s unit tests.


    > CI demands a solid suite of fast unit tests.


    CI servers can be hosted internally or available in the cloud. The most common
    tools are Jenkins, GitHub Actions, and GitLab CI. Some alternative solutions include
    Azure DevOps, CircleCI, and TeamCity.⁵ Some of the tests are free, some are licensed,
    and are software as a service (SaaS).


    The CI build''s tests verify that the integrated codebase works as expected. If
    a developer pushes and any CI fail, the build fails and the team is notified of
    the problem. The unit tests running in CI establish a centralized, authoritative
    standard.


    > Broken CI tests indicate a system that cannot be deployed. Resolve them before
    doing anything else.


