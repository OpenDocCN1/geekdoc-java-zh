  md: "# Chapter 11. Advancing with Test-Driven Development (TDD) • 214\n\nThe ZOM\
    \ progression (see ZOM: Zero and One Done, Now Testing Many, on page 22) is a\
    \ great place to start when practicing TDD. You'll employ it frequently as you\
    \ try to derive the next-smallest increment.\n\nYou want to start with the absolute\
    \ simplest requirement. Between the two concerns—emptiness and size—emptiness\
    \ seems simplest. Your first test is a zero-based verification: the portfolio\
    \ is empty when created (in other words, no purchases have been made).\n\n```\n\
    ut3-tdd/01/src/test/java/app/APortfolio.java\nimport org.junit.jupiter.api.Test;\n\
    import static org.junit.jupiter.api.Assertions.assertTrue;\n\npublic class APortfolio\
    \ {\n    @Test\n    void isEmptyCreated() {\n        var portfolio = new Portfolio();\n\
    \        assertTrue(portfolio.isEmpty());\n    }\n}\n```\n\nIn order to compile\
    \ and run the test, you need to supply an implementation for the Portfolio class.\
    \ You also want a test that fails (not that as you go). Returning false from isEmpty\
    \ will cause the call to assertTrue to fail:\n\n```\nut3-tdd/01/src/main/java/app/Portfolio.java\n\
    public class Portfolio {\n    public boolean isEmpty() {\n        return false;\n\
    \    }\n}\n```\n\nNow, you can run JUnit. You expect a failure and receive it:\n\
    Expected :true\nActual :false\n\nAll is well.\n\n> Avoid costly, poor assumptions\
    \ with TDD. Ensure each new test fails before you write the code to make it pass.\n\
    \nYou seek the simplest code to get the test to pass in order to avoid adding\
    \ code until you have a test that demands its existence:\n\n![](img/5f9fd301af41bda177ca04d9f939d028_227_0.png)"
