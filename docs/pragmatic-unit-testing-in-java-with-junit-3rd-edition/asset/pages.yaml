  md: "Don't add extraneous code to the lambda. You don't want a false positive where\
    \ the test passes because the wrong line of code threw the expected exception.\n\
    \nCode in withdraw passes the assertThrows statement by throwing an InsufficientFunds\
    \ when the amount to withdraw exceeds the balance:\n\n```\nut3-junit01/src/main/java/scratch/Account.java\n\
    void withdraw(int dollars) {\n    if (balance < dollars) {\n        throw new\
    \ InsufficientException(\"balance only \" + balance);\n    }\n    balance -= dollars;\n\
    }\n```\n\n# Old School\n\nPrior to the availability of assertThrows, you had at\
    \ least three options in JUnit for expecting exceptions: Using try/catch, annotations,\
    \ and rules. You may see some of these solutions if you maintain old systems.\
    \ Annotations and rules aren't supported by JUnit 5, so I won't cover them here.\
    \ I'll show you what they look like, though, so you can understand what you're\
    \ seeing.\n\nHere's an example of the annotations-based mechanism:\n\n```\n@Test(expected=InsufficientFundsException.class)\n\
    public void throwsWhenWithdrawingTooMuch() {\n    account.withdraw(100);\n}\n\
    ```\n\nIf you see expected= as an argument to the @Test annotation, visit the\
    \ JUnit 4 documentation on @Test for further explanation.\n\nHere's what the use\
    \ of the rules-based mechanism (added in JUnit 4.7) might look like:\n\n```\n\
    public class SimpleExpectedExceptionTest {\n@Rule\npublic ExpectedException thrown=\
    \ ExpectedException.none();\n\n@Test\npublic void throwsException() {\n    thrown.expect(NullPointerException.class);\n\
    \    thrown.expectMessage(\"happened\");\n    // ... code that throws the exception\n\
    }\n// ...\n```\n\n+   3. https://junit.org/junit4/javadoc/4.12/org/junit/Test.html"
