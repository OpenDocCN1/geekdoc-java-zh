  md: '# A Mélange of Important Test Double Tips • 67


    With an eight-minute suite, you might also concede and run a small subset after
    making changes. But you''ll start unwittingly breaking code elsewhere, not finding
    out until much later.


    Keep your tests fast Minimize dependencies on code that executes slowly. If all
    your tests interact with code that makes one or more database calls, directly
    or indirectly, all your tests will be slow.


    Fast tests support the most effective way to build software incrementally. Testing
    as you go verifies that each new behavior works and doesn''t break other code,
    letting you frequently and confidently integrate code changes.


    ![](img/5f9fd301af41bda177ca04d9f939d028_87_0.png)


    # A Mélange of Important Test Double Tips


    +   - A good mock-based test is three lines: a one-line arrange step with a highly
    readable stub declaration, followed by one-line act and assert steps. That a test
    anyone can quickly read, understand, and trust.

    - In answersAppropriateAddressForValidCoordinates, the expected parameter string
    of "lat=38.000000&lon=104.000000" correlates clearly with the act arguments of
    38.0 and -104.0. Creating correlation between arrange and assert isn''t easy sometimes,
    it saves developers from digging up for understanding. Without such correlation,
    tests using mocks can be hard to follow.

    - Mocks suppl real behavior. Ask yourself if you''re using them safely. Does your
    mock emulate the way the production code works? Does the production code return
    other formats you''re not thinking of? Does it throw? Does it return null? You''ll
    want a different test for each of these conditions.

    - Does your test trigger use of a mock, or does it run production code? By turning
    off the mock and letting your code interact with the production class to see what
    happens (it might be as subtle as a slightly slower test run).

    - Try temporarily throwing a runtime exception from the production code. If your
    test throws bombs as a result, you know you''re hitting the production code. (Don''t
    forget and accidentally push that into production!)'
