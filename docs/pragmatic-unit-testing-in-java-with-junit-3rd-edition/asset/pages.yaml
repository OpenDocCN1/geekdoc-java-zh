    feel AAA cheats out of that fourth part, you can add a “A”...for ANNIHILATION!
    (If the violence disturbs you, just mentally go with “After.” Keep calm and carry
    on.)


    # Setting Up and Tearing Down Using Lifecycle Methods


    You learned about @BeforeEach in your first JUnit example (see Chapter 1, Building
    Your First JUnit Test, on page 3). Let''s take a closer look at this initialization
    hook, as well as some other hooks that JUnit provides.


    # Initializing with @BeforeEach and @BeforeAll


    In Abstraction: Eliminating Boring Details, on page 20, you learned to @BeforeEach
    to put common initialization in one place. Methods annotated with @BeforeEach
    are executed before each test scope.


    JUnit also provides another initialization hook known as @BeforeAll, which must
    declare as a static method. Each method annotated with @BeforeAll gets executed
    once per class and prior to the execution of anything within that class. Its primary
    use is to ensure that slowly executing initialization (for anything involving
    a database) only have to execute once. Otherwise, prefer using @BeforeEach.


    If you find yourself using @BeforeAll more than once in a blue moon, you may be
    testing behaviors bigger than units. That may be okay, but it might suggest you
    opportunities for reducing the dependencies in your system. See Chapter 3, Using
    Test Doubles, on page 53 for ideas on how to do that.'
