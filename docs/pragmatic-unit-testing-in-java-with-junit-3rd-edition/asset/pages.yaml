    part of the JUnit test execution lifecycle.


    +   * Interact with the system to execute what you want to verify.


    +   * Do the verification (assert).


    +   * Tear down the fixture—clean any side effects, if necessary. This typically
    involves cleaning resources that a test might have used and could impact the execution
    of other tests. In this chapter, you''ll read about doing clean-up with @AfterEach
    and @AfterAll JUnit hooks.


    For every intent and purpose, AAA is the first three parts of a four-part test.
    Arrange, act, assert ≈ setup, execute, verify.


    Turns out that the fourth, “tear down,” is should rare in unit tests, which you
