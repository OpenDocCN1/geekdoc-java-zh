    \ to Profile, three tests in AProfile no longer compile. Calls to the score method\
    \ on a Profile instance now require a criteria object as an argument. Here's an\
    \ example of one fixed test showing the changed assertion statement:\n\n```\n\
    ut3-refactor/22/src/test/java/iloveyoubs/AProfile.java\n@Test\nvoid isZeroWhenThereAreNoMatches()\
    \ {\n    profile.add(bonusNo);\n    criteria = new Criteria(\n        new Criterion(bonusYes,\
    \ IMPORTANT));\n\n    var score = profile.score(criteria);\n    assertEquals(0,\
    \ score);\n}\n```\n\n# The Costs of Maintaining Unit Tests\n\nRefactoring—changing\
    \ the implementation of a solution without changing its behavior—should not normally\
    \ break tests. Here, however, you did make a behavioral change due to a deficiency\
    \ in the Profile interface. Your updated design now exposes the score method's\
    \ behavior in a different manner than before, the broken tests. You might consider\
    \ that your refactoring \"pushed out a change to the interface.\"\n\nSure, you\
    \ must spend time to fix the tests. In this case, having tests in the first place\
    \ enabled you to recognize and fix a faulty design.\n\nYou've learned throughout\
    \ this book the potential benefits of unit tests:\n\n+   - Releasing fewer defects\n\
    - Changing your code at will with high confidence\n- Knowing exactly and rapidly\
    \ what behaviors the system embodies\n\nThis book can help you attain those benefits\
    \ and increase your ROI.\n\n> The return on investment from well-designed tests\
    \ outweighs their cost.\n\nMoving forward, when your tests break as you refactor,\
    \ think about it as a design smell. The more tests that break simultaneously,\
    \ the bigger the chance you missed an opportunity to improve the design, whether\
    \ of the tests or production code.\n\nreport erratum · discuss"
