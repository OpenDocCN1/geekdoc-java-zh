  md: "# CHAPTER 3\n\n# # Using Test Doubles\n\nYou can test a lot of your system\
    \ using the information you've learned over the prior two chapters. But not all\
    \ units are going to be similarly easy to test.\n\nIt's a safe bet you find your\
    \ system hard to test. Perhaps you think the first two chapters made it look too\
    \ easy. \"It must be to have a system that supports writing unit tests out of\
    \ the box, but it doesn't match my reality,\" says Joe.\n\nIn this chapter, you'll\
    \ learn how to employ test doubles to break dependencies on pain-inducing collaborators.\
    \ A test double is a stand-in (\"stunt double\") for the dependencies that make\
    \ your code hard to test. You're-already familiar with the name of one kind of\
    \ test double—a mock object.\n\nWith test doubles, you gain a tool that will help\
    \ you get past the ever-present unit hurdle of troublesome dependencies.\n\n#\
    \ # A Testing Challenge\n\nYou're testing an AddressRetriever. Given a latitude\
