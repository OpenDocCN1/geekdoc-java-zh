  md: "# Extract Method: Your Second-Best Refactoring Friend\n\nBefore this section's\
    \ heading sends you digging in the index, your best refactoring friend is rename,\
    \ whether it be a class, method, or variable of any sort. Clarity is largely by\
    \ declaration of intent, and good names are what impart clarity in code.\n\nYour\
    \ goal: reduce complexity in matches so you can readily understand what it's responsible\
    \ for. The method is currently a jumbo of code that obscures the overall set of\
    \ steps required—its algorithm or policy. You'll shift the code from \"implementation\
    \ detail\" to \"clear declarations\" by extracting detailed bits from logic to\
    \ logic, separate methods.\n\nConditional expressions often read poorly, particularly\
    \ when they are complex. An example is the assignment to match that appears atop\
    \ the for loop in matches:\n\n```\nutj3-refactor/01/src/main/java/iloveybouss/Profile.java\n\
    public boolean matches(Criteria criteria) {\n    // ...\n    for (var criterion:\
    \ criteria) {\n        var answer = answers.get(criterion.answer().questionText());\n\
    \        var match = criterion.weight() == IRRELEVANT ||\n            answer.match(criterion.answer());\n\
    \        // ...\n    }\n}\n```\n\nThe right-hand side of the assignment seemingly\
    \ defines when there's a match. Specifically, it says there's a match when the\
    \ criterion is irrelevant or when the criterion's answer matches the corresponding\
    \ answer in the profile. Isolate this complexity by extracting it to a separate\
    \ method named isMatch. In IntelliJ IDEA, extract methods by following these method-heavy\
    \ steps:\n\n+   1. Highlight the appropriate code.\n2. Open the context menu (via\
    \ right-click).\n3. Select Refactor Extract Method from the menu.\n4. Type a name\
    \ for the new method (or accept the one suggested).\n5. Press Enter.\n\nIntelliJ\
    \ creates a method containing the highlighted code and replaces the highlighted\
    \ code with a call to the new method."
