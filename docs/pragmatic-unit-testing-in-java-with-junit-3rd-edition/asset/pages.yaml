  md: 'Will using LLM speed you up? I believe the answer will be increasingly yes.
    For now, it will speed you up at least as much as any auto-complete mechanisms
    speed you up. You''re typing far less, for one.


    Personally. I can go considerably faster than an LLM for pieces of producing a
    solution, particularly around small adjustments to the way I want expressed. But
    there are many operations that LLMs can do faster than me. For example, it was
    quicker to change the array-based tuple to a record than it would have been by
    hand. It''s also a lot faster to have the LLM generate tests from examples.


    Maybe my biggest speed-up is that I can take larger steps with an LLM with TDD,
    where I do one small thing at a time. Sure, AI will get some things wrong as a
    result of the larger steps, but it''s a lot quicker to revert and try something
    different when it does.


    # Summary


    In Pragmatic Unit Testing in Java with JUnit, you''ve learned a wealth of approaches,
    skills, practices, and design tips. You can apply these skills immediately to
    your work and start to reap the multiple benefits of unit testing.


    Whether or not you use AI to generate code, unit testing will remain an important
    tool in your development toolbox. Without good unit tests, you will always proceed
    with considerable risk. Done properly, unit tests will allow you to go faster
    and ship with high confidence.'
