  md: '# Active Review via Mob Programming


    Maybe the answer is to have the whole team actively review everything related
    to delivering a feature—the design, tests, code, and anything else required—as
    same team builds it. All this is the idea behind the nearly 15-year-old practice
    known as mob or ensemble programming.


    While one might suggest chaos, proper mob programming requires the team to work
    together in a structured manner as same virtual or physical space. It’s not "throw
    everyone in a room and see what happens."


    When mob programming, one person acts as a driver whose job is to listen to the
    rest of the mob—and translate their direction into code. Physically and in person,
    this means that the driver is the only one typing at a keyboard; the rest of mob
    watches on a shared monitor.


    After a short period of time—maybe a handful of minutes—the driver yields control
    to another mob member. A driver with a brilliant idea must relinquish their seat
    to step the next driver through their thinking.


    These two simple rules maximize engagement and minimize domination and freedom.
    Without them, a mob usually devolves. A senior team member speeds off to their
    desired solution while the rest of the team watches confused and helpless from
    the back seat. But with short rotations and a driver who must follow direction,
    it becomes difficult for anyone to dominate.


    Mob programming sends to few folks screaming for the exits except pairing. That
    possibly because pairing demands continual attention and forces considerable intimacy
    between you and each of your teams. Some pairs will just never click. In a mob,
    you’re not "on point" for the entire development session, unlike when you’re working
    in a pair.


    Mob sessions can be highly effective. Mob programming eliminates a lot of the
    cost of splitting among sub-teams, whether they are pairs or individuals. Not
    only can you eliminate review sessions (everyone’s there!), but ceremonies like
    standup meetings, iteration planning, and pull requests'
