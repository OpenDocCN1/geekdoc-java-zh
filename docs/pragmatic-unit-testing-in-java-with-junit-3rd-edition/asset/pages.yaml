- img_proc: true
  md: 'Concepts can also represent generic or very common ideas in software:


    +   - Add an item to a list

    - Remove all items matching a predicate from a list

    - Throw an exception when a string is non-numeric


    Each of the above concepts requires one to three or four "atomic code concepts".
    Think of an atomic code concept (let''s call it an ACC) as closer to an expression—the
    biggest chunk of code that you can read and understand at a glance. Each additional
    statement represents an additional ACC, as each new lambda or function call in
    a pipeline.


    If an statement with a single-line body would count as two ACCs: the plus statement
    that executes if it evaluates to true. The key notion is that both parts of the
    if must be read and understood separately.


    > A concise implementation of a concept uses no more ACCs than needed.


    Of course, you''ll inevitably need to implement concepts requiring a handful or
    more ACCs. But for now, let''s establish a fairly sensitive and arbitrary threshold.
    If your method requires five or more ACCs, consider the possibility that it''s
    larger than a unit—that you decompose it into smaller behavioral units (perhaps
    other methods or classes, which might be non-public).


    Concise is great, but the code must also clearly impart all contextually intents.
    Succeeding requires you be skilled in crafting clear, concise code. You''ll see
    many examples of how to do that in this book.


    You can implement any unit as a single method—a named block of code that can return
    a value and/or alter the state of an object. (Let''s hope it''s only one or the
    other—read about command-query separation in Command-Query Separation, on page
    180).


    You can also choose to string a series of concepts together in a larger method
    rather than isolate each concept in a separate method. This is one of countless
    choices you make as a system designer. Each design choice has tradeoffs and implications,
    particularly when it comes to writing unit tests.


    > A system''s design is the complete set of choices made by its developers.'
