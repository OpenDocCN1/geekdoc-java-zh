  md: "# Using the Core Assertion Forms\n\nThe bulk of your assertions will use either\
    \ assertTrue or assertEquals. Let's review and refine your knowledge of these\
    \ two assertion workhorses. Let's also see how to keep your tests streamlined\
    \ by eliminating things that don't add value.\n\n# The Most Basic Assertion Form:\
    \ assertTrue\n\nThe most basic assert form accepts a Boolean expression or reference\
    \ as an argument and fails the test if that argument evaluates to false.\n\n```\n\
    org.junit.jupiter.api.Assertions.assertTrue(someBooleanExpression);\n```\n\nHere's\
    \ an example demonstrating the use of assertTrue:\n\n```\nut3-junit01/src/test/java/scratch/AnAccount.java\n\
    @Test\nvoid hasPositiveBalanceAfterInitialDeposit() {\n    var account = new Account(\"\
    an account name\");\n    account.deposit(50);\n    Assertions.assertTrue(account.hasPositiveBalance());\n\
    }\n// ...\n```\n\nTechnically, you could use assertTrue for every assertion you\
    \ had to write. But an assertion failure tells you only that the assertion failed\
    \ and nothing more. Look for more precise assertions such as assertEquals, which\
    \ reports what was expected. What was actually received when it fails. You'll\
    \ find test failures easier to understand and resolve as a result.\n\n# Eliminating\
    \ Clutter\n\nAs documents you'll spend time reading and re-reading, you'll want\
    \ to streamline your tests. You learned in the first chapter (see Chapter 1, Building\
    \ Your First JUnit Test on page 3) that the public keyword is unnecessary when\
    \ declaring both JUnit test classes and methods. Such keywords and other unnecessary\
    \ elements represent clutter.\n\n> Streamline your tests by eliminating unnecessary\
    \ clutter.\n\nYou're scanning lots of tests to gain a rapid understanding of what\
    \ your system does and where your changes must go. Getting rid of clutter makes\
    \ it easier to understand tests at a glance."
