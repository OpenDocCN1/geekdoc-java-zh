  md: '# Automate Your Home Using Go


    Take control of your home and your data with the power of the Go programming language.
    Build extraordinary and robust home automation solutions that rival much more
    expensive, closed commercial alternatives, using the same tools found in high-end
    enterprise computing environments. Best-selling Pragmatic Authors Ricardo Gerardi
    and Mike Riley show how you can use inexpensive Raspberry Pi hardware and open
    source software tools like Prometheus and Grafana to create your own data center.
    Using the step-by-step examples in the book, build useful home automation projects
    that you can use as a blueprint for your own custom projects.


    ![](img/5f9fd301af41bda177ca04d9f939d028_287_0.png)


    Ricardo Gerardi and Mike Riley

    (160 pages) ISBN: 9788888650509. $40.95

    https://pragprog.com/book/gohome


    # Small, Sharp Software Tools


    The command-line interface is making a comeback. That''s because developers know
    that all the best features of your operating system are hidden behind a user interface
    designed to help average people use the computer. But you''re not the average
    user, and the CLI is the most efficient way to get work done. Turn tedious chores
    into quick tasks: read and write files, manage directory hierarchies, perform
    network diagnostics, download files, work with APIs, and combine individual programs
    to create your own workflows. Put down that mouse, open the CLI, and take control
    of your software development environment.


    ![](img/5f9fd301af41bda177ca04d9f939d028_287_1.png)


    Brian P. Hogan

    (326 pages) ISBN: 9781680502961. $38.95

    https://pragprog.com/book/bhcdev'
