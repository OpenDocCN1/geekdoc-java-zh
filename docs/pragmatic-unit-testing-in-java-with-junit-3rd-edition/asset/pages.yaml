  md: 'When specifying tags within your run configuration, you can enter the following-tag
    expression:


    account | v11_1_defects


    The | (or) operator indicates that JUnit should run the union of tests tagged
    with "account" and tests tagged with "v11_defects." Specifically, JUnit will run
    tests in AnAccount and AnFundedAccount, as well as the test named objectCopiedAddedToDatabaseF.


    Tag expressions support inverting a filter using the ! (not) operator and running
    the intersection of two tags using the & (and) operator. They also allow the use
    of parentheses to clarify or force the precedence of the operators.


