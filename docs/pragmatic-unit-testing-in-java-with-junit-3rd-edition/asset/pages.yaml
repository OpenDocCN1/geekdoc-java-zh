    # ## Improving Unit Testing Skills Using Code Coverage


    Code coverage metrics measure the percentage of code that your unit tests execute
    (exercise). Ostensibly, code that is covered is working, and code that is not
    covered represents the risk of breakage.


    From a high level, tests that exhaust all relevant pieces of code provide 100
    percent coverage. No code with tests whatsoever 0 percent coverage. Most code
    lies somewhere in between.


    Many tools will calculate coverage metrics for Java code, including JaCoCo, OpenCover,
    SonarQube, and Cobertura. IntelliJ IDEA ships with a coverage tool built into
    the IDE.


    Numerous coverage metrics exist to measure various code aspects. Function coverage,
    for example, measures the percentage of functions (methods) exercised by tests.
    Some of the other metrics include line, statement, branch, and path coverage.'
