    # # Exploratory Unit Testing


    The unit tests you''ve learned to build capture your best understanding of the
    intents in the code. They cover known edge cases and typical cases.


    Some code may demand further exploration. For example, complex code, code that
    seems to keep breaking as you uncover more nuances about the input data, or code
    that incurs a high cost if it were to fail. Systems requiring high reliability
    or security might incur significant costs from unit-level failures.


    Numerous kinds of developer-focused tests exist to help you with exploratory testing.
    Many of them verify at the integration level—load tests, failover tests, performance
    tests, and contract tests, to a name. You can learn about all of these in Alexander
    Tarler''s book Developer Testing.²


    Following is an overview of two unit-level testing tactics: fuzz testing and property
    testing, which can be considered forms of what''s known as generative testing.
    These sorts of tests require additional tooling and beyond JUnit, and thus, you''re
    only getting an introduction to them in this book. (That''s one excuse among a
    few, and I''m sticking with it.)


    Not covered at all: mutation testing, which involves tools that make small changes
    to your production code to see if such changes break your tests. If your tests
    don''t break, the mutation tests suggest you might have insufficient test coverage.


    # # Fuzz Testing


    With fuzz testing, you use a tool to provide a wide range of random, unexpected,
    or invalid inputs to your code. It can help you identify edge cases in code that
    you''re otherwise unlikely to think of when doing traditional testing.


