  md: "![](img/5f9fd301af41bda177ca04d9f939d028_124_0.png)\n\n# assertSame\n\nAlso\
    \ infrequently used, assertSame verifies that two references point to the same\
    \ object in memory.\n\nYour challenge: minimize the use of memory in a scheduling\
    \ application where there might need to be many millions of Time objects.(This\
    \ example is based on “Working with Design Patterns: Flyweight.\\) Most of these\
    \ Times will be on the quarter hour (11:15, 14:30, 10:15) because that's how we\
    \ usually like to schedule things. Some small subset will be at odd times, 3:10\
    \ or 4:20, because some people do odd at times, dude.\n\nThe idea of the flyweight\
    \ pattern is to have a single object pool, which allows for multiple interested\
    \ parties to share objects that have the same values.(This works for immutable\
    \ objects, not so great otherwise.) Your application can reduce its memory footprint\
    \ significantly as a result.\n\nHere are the production classes involved:\n\n\
    ```\nut3-junit/01/src/main/java/time/Time.java\nimport static java.lang.String.format;\n\
    public record Time(byte hour, byte minute) {\n    static String key(byte hour,\
    \ byte minute) {\n        return format(\"%d:%d\", hour, minute);\n    }\n}\n\
    ```\n\n```\n@Override\npublic String toString() {\n    return key(hour, minute);\n\
    }\n```\n\n```\nut3-junit/01/src/main/java/time/TimePool.java\nimport java.util.HashMap;\n\
    import java.util.Map;\npublic class TimePool {\n    private static Map<String,\
    \ Time> times = new HashMap<>();\n    static void reset() {\n        times.clear();\n\
    \    }\n```\n\n+   2. https://www.developer.com/design/working-with-design-patterns-flyweight/"
