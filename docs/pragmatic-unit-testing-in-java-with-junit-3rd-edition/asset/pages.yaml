- img_proc: true
  md: 'Slapping out code with no tests only speeds us up for a very short period of
    time—maybe a couple of days or so. Invariably, we hit ugly defects long debugging
    sessions. The worst of it is that it creates chunks of legacy code that will cost
    us forever. Sorry Joe, tossing unit tests isn''t worth it.


    Not much will allow you to escape last-minute crashes unscathed, no matter how
    good you are at development. Once you''re there, all you can do is negotiate or
    work excessive hours. But if you insist on quality controls from day one, it won''t
    happen nearly as often.


    Unit testing is a part of those quality controls. Let''s look at how to ensure
    it becomes a habit within your team.


    # Getting on the Same Page with Your Team


    Approaches to unit testing can vary dramatically from developer to developer.
    Some insist on TDD. Others resist unit testing at all costs, producing only tests
    they feel forced to write. Some prefer lumping multiple cases into a single test.
    Some favor slower integration tests. Some will disagree with other recommendations
    you''ve learned from this book.


    Your team must get on the page, whether it''s unit testing standards or how you
    review code in the first place. Back-and-forth without resolution are wastes of
    everyone''s time. You''ll never agree on everything, but you can quickly discover
    what you agree on and increase consensus over time.


    Your team can establish initial working agreements as part of team chartering
    activities. Liftoff [LN17] is a great guide for facilitating effective chartering
    sessions.


    # Establishing Standards


    You''ll want to derive some standards around unit testing. Start minimally. Answer
    two questions:


    +   • What code (and test) related elements are wasting our time?

    • What simple standards can we quickly agree on?


    Run a sub-hour discussion that results in a short list of standards, or better,
    in a code example that clearly embodies the standards. Over time, ensure standards
    stay relevant and followed. Reference them when violated, review them when disagreement
    arises, and revise them as needed.'
