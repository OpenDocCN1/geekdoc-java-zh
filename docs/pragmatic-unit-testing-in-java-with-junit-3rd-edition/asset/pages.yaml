  md: "Empty string in, empty string out—simple stuff. It fails due to a StringIndex-nOfBoundsException,\
    \ a hiccup you can fix with a guard clause.\n\n```\nut3-units/02/src/main/java/units/StringUtils.java\n\
    static String capitalize(String word) {\n    if (word.isEmpty()) return \"\"\n\
    \n    var head = word.substring(0, 1);\n    var tail = word.substring(1);\n  \
    \  return head.toUpperCase() + tail.toLowerCase();\n}\n```\n\nWriting a test for\
    \ the null value can sometimes be thought of as a zero-based test. Here, the code\
    \ ignores null inputs completely—the assumption that other code or mechanisms\
    \ have ensured the string argument is not null. The behavior is undefined if capitalize\
    \ gets called with null.\n\nThe choice to avoid a null check in capitalize might\
    \ fly for some systems but not others. It's usually a valid choice for systems\
    \ with good control over input. You end up with lot fewer paranoid checks for\
    \ null.\n\nIf you wanted capitalize to explicitly handle null inputs, you'd write\
    \ a test for that case. And that would document your choice.\n\n> Tests insert\
    \ letter. Absence of a test implies undefined (accidental) behavior. Write tests\
    \ for all intents.\n\nMoving to a test for one—one letter, that is. When passed\
    \ a lowercase letter, capitalize should return an uppercase:\n\n```\nut3-units/02/src/test/java/units/SomeStringUtils.java\n\
    @Test\nvoid uppcasesSingleLetter() {\n    assertEquals(\"A\", capitalize(\"a\"\
    ));\n}\n```\n\nThen a many-based test, in which you pass a bunch of letters to\
    \ capitalize:\n\n```\nut3-units/02/src/test/java/units/SomeStringUtils.java\n\
    @Test\nvoid uppcasesFirstLetterOfLowerCase() {\n    assertEquals(\"Alpha\", capitalize(\"\
    alpha\"));\n}\n```\n\nTo test the last wrinkle—that the remainder of the letters\
    \ are lowercased—you write a test for that variant of the input data:"
