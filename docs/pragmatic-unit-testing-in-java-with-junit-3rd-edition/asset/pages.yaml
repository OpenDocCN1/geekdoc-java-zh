  md: 'Chapter 6. Establishing Organization in JUnit Tests • 134


    # Here''s a quick summary:


    +   - @ValueSource A single array of values. Useful only if your test takes one
    parameter (which implies that the expected outcome is the same for every source
    value)


    +   - @EnumSource Iterates all the possible enum values, with some options for
    inclusion/exclusion and regex matching


    +   - @MethodSource Expects the name of a method, which must return all data in
    a stream


    +   - @CsvSource Mostly the same thing as @CsvSource, except that you specify
    a filename containing the CSV rows


    +   - @ArgumentsSource Allows you to create a custom, reusable data source in
    a class that extends an interface ArgumentsProvider


    While parameterized tests in JUnit are sophisticated and flexible beasts, @CsvSource
    will suit most of your needs. I''ve never needed another data source variant (though
    I don''t frequently use parameterized tests).


    In summary, parameterized tests are great when you need to demonstrate data (not
    behavioral) variants. These are a couple of perils:


    +   - Code that conditionally executes if a parameter is null or an empty string.
    A parameterized test with two inputs (null and "") lets you avoid test duplication.


    +   - Code around border conditions, particularly because code often breeds defects.
    For example, for code that conditionally executes if n <= 0, use a parameterized
    test with the values n - 1 and 0.


    Otherwise, create a new @Test that describes a distinct behavior.


    # Summary


    On most systems, you''ll end up with many hundreds or thousands of unit tests.
    You''ll want to keep your maintenance costs low by taking advantage of a few JUnit
    features, including lifecycle methods, nested classes, and parameterized tests.
    These features allow you to reduce redundant code and make it easy to run a set
    of tests.


    Now you''ve learned how to best organize your tests, in the next chapter, you''ll
    dig into topics that relate to executing tests using JUnit. You''ll pick some
    good habits for deciding how many tests to run (and when not to run tests). You''ll
    learn how to run subsets of tests as well as to temporarily disable tests.


