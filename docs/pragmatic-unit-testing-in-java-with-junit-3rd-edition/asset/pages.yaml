    Your test describes a credit history object in a certain context—it has no credit
    ratings. You expect something to hold true about credit history in that context:
    it a zero mean. Your test name is a concise representation of that context and
    expected output:


    ```

    ACreditHistory ...noCreditRatingsHas0Mean() { }

    ```


    Was that a snort? No, you don''t have to follow this test naming convention, but
    it''s as valid as any other. You''ll read about alternative naming schemes at
    Documenting Your Tests with Consistent Names, on page 190.


    On the body of the code—where the work gets done. Your test creates a CreditHistory
    instance (line 7). This new object allows your test to run from a clean slate,
    keeping it isolated from the effects of other tests. JUnit reinforce by creating
    a new instance of the test—ACreditHistory—for each test it executes.


    Your next (at line 8) interacts with the CreditHistory test instance to exercise
    the behavior that you want to verify. Here, call its arithmetic method and capture
    the return value in result.


    Your test finally (at line 9) asserts that the (desired) result of 0 matches the
    actual captured result.


    Your call to assertEquals JUnit''s bread-and-butter assertion method, which compares
    a result with what you expect. The majority of your tests will use assertEquals.
    The rest will use one of many other assert forms that you''ll learn in Chapter
    5, Examining Outcomes with Assertions, on page 99.


    An assertEquals method passes if its two arguments match each other. It fails
    if the two arguments do not match. The test method as a whole fails if it encounters
    any assertion failures.


    The hard part about learning assertEquals is remembering the order of its arguments.
    The value your test expects comes first; the actual value'
