  md: "# Chapter 5. Examining Outcomes with Assertions • 106\n\n```\nList<Card> remaining()\
    \ {\n    return cards;\n}\n```\n\nYou want to verify that the shuffling did actually\
    \ occur:\n\n```\nut3-unit/01/src/test/java/cards/ADDeck.java\npublic class ADeck\
    \ {\n    Deck deck = new Deck();\n    // ... other Deck tests here ...\n    @Test\n\
    \    void hasBeenShuffled() {\n        var cards = deck.remaining();\n       \
    \ assertEquals(Deck.newDeck(), cards);\n    }\n```\n\nYou might be thinking, “Hey,\
    \ that looks like a weak assertion!” It is, in a way—you do not know or not the\
    \ deck has been properly shuffled. But that's not the job of the Deck. The Deck\
    \ class here invokes a shuffle after implementing it, using a method from the\
    \ Java API. You can trust that Collections.shuffle() randomizes the order of a\
    \ collection appropriately, though you might need a better randomler if you're\
    \ a casino.\n\nSince you can trust the Java API, you do not need to prove the\
    \ quality of its shuffle. But your unit test does need to verify that the cards\
    \ were actually shuffled. You can do this in a number of somewhat complex ways,\
    \ such as by using test doubles Chapter 3. Using Test Doubles, on page 53 or injecting\
    \ a seeded random number generator for shuffling.\n\nEnsuring that the order of\
    \ cards in an instantiated Deck is not equal to the cards returned by Deck.newDeck()\
    \ is sufficient and simple. It demonstrates that some operation occurred to change\
    \ the order. This also has a slim possibility of failing in the case where it\
    \ shuffles the deck's starting order. Highly unlikely in your lifetime. Run the\
    \ test again if you chance upon that serendipitous moment.\n\nYes, someone could\
    \ replace the call to Collections.shuffle() with shoddy shuffling code—example,\
    \ something that moved one card from the front to the back of the deck. But don't\
    \ worry—no one would do that.\n\nUnit tests don't exist to protect you from willful\
    \ destructiveness. A determined saboteur can break your system without breaking\
    \ any tests."
