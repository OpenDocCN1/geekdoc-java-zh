  md: '# Setting Up and Tearing Down Lifecycle Methods · 125


    If your test need demand that you initialize a few things before each test is
    run, you can declare multiple @BeforeEach methods in the test class''s scope,
    each with a different name. These don''t run in any useful order, just as test
    methods do not.


    Creating additional @BeforeEach methods allows you to use your methods name to
    describe what''s going into each initialization. Of course, you can also lump
    all your initialization into a single @BeforeEach method as long as it''s easy
    for other developers to understand what''s going on when reading through your
    lump.


    You can have multiple (static) @BeforeAll methods in a test class.


    # Using @BeforeEach and @AfterAll for Cleanup


    JUnit books the initialization hooks @BeforeEach and @BeforeAll with corresponding
    "teardown" lifecycle methods @AfterEach and @AfterAll. These methods allow you
    to clean up resources on test completion. Both @AfterEach and @AfterAll are guaranteed
    to run (as long as the JUnit itself doesn''t crash), if any test throws exceptions.


    Within @AfterEach, for example, you might close a database connection or delete
    a file. If you write integration (non-unit) tests in JUnit, these teardown hooks
    are essential.


    Most unit tests, however, shouldn''t interact with code that requires clean-up.
    The typical, happily rare case when multiple tests alter the state of a static
    field.


    If you have a clean-up need, try to redesign your code to eliminate it. Use dependency
    injection (see Injecting Dependencies into Production Code, page 56) and/or mock
    objects (see Chapter 3, Using Test Doubles, page 53) as appropriate.


    Even when you have a legitimate clean-up need, adding code to @AfterEach or @AfterAll
    is mostly only being nice. Suppose the general assumption is that all tests clean
    up after themselves—seems like a fair testing standard, yes? The problem is that
    eventually, someone will forget to properly clean up in another test elsewhere.
    If your test fails as a result, it may take some real time to figure out which
    one of thousands of tests is the culprit.


    > Each of your tests is responsible for ensuring it executes in a clean, expected
    state.'
