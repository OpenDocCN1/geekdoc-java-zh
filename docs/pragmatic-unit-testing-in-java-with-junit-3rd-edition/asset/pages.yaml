  md: 'The world of integration testing is huge, and this section is tiny, hopefully,
    it provides a few ideas on when you''ll want integration tests and how you might
    approach crafting them.


    # The Data Problem


    You want the vast majority of your JUnit tests to be fast. No worries—if you isolate
    all of your persistence interaction to one place in the system, you''ll have a
    reasonably small amount of code that must be integration tested.


    When you write integration tests for code that interacts with the real database,
    the data in the database and how it gets there are important considerations. To
    verify that database query operations return expected results, for example, you
    must either insert appropriate data or assume it already exists.


