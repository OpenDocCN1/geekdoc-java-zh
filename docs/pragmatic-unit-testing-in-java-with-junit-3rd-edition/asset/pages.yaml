    You and your team must be on the same page when it comes to unit testing. If it’s
    new to your team, it’ll take time to adopt and ingrain as a beneficial habit.
    If it’s an existing practice, your team practices might need improvement.


    In this chapter, you learned about establishing team-level standards for unit
    testing from both implementation and process perspectives. You also learned about
    the active review mechanisms that help ensure test quality—specifically, mob and
    pair programming. Finally, you discovered the key role that CI plays in unit testing.


    Last times: times are changing rapidly. AI has dramatically made its way into
    the software development arena. Unlike previous attempts (anyone remember Prolog
    and 4GLs?), AI has made a ubiquitous impact not just in software development but
    in day-to-day life for many of us. AI’s improvements are accelerating and there’s
    little chance of its disappearance.


    Yes, unit testing is quite relevant in the age of AI. Read on to discover how.'
