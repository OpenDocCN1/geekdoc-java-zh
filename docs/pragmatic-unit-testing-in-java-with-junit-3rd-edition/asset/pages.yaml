    +   - Trust the work of others. Java incorporates Doug Lea''s set of concurrency

    utility classes in java.util.concurrent. Don''t code producer/consumer yourself

    by hand, for example; it''s too easy to get wrong. Do take advantage of

    Lea''s BlockingQueue implementations, and capitalize on their painstaking

    efforts to get them right.

    - Avoid and isolate concurrent updates, which could cause most problems.

    - Profile the codebase using static concurrency analysis tools, which can

    identify potential problems (including deadlocks) based on coded interac-tions
    threads.

    - Profile the runtime behavior of your system using dynamic analysis tooling

    as as VisualVM or YourKit. These tools can monitor thread state, ana-lyze thread
    dumps, detect deadlocks, and more.

    - Write a test that demonstrates a potential concurrency problem, then

    exacerbate it to the point where the test always fails. You might reduce

    t number of threads, increase the number of requests being tested, or

    temporarily induce sleep to expose timing issues. Tools like Thread

    Weaver can also help you and test different thread interleavings.

    - Add only the concurrency control that makes the test pass. Syn-chonization blocks
    and locks may be necessary, but by using them

    inappropriately can degrade performance (while still solving

    t real concurrency problems),

    - When your consistently passes, remove any artificialities like sleep.

    - Don''t introduce concurrency controls like locks, synchronized blocks, or

    atomic variables until you''ve actually demonstrated a concurrency problem

    (hopefully with a failing test).


