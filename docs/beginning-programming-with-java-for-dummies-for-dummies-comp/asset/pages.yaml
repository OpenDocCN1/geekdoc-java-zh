  md: '# # What''s All That Stuff in Eclipse''s Window?


    Believe it or not, an editor once rejected one of my book proposals. in the margins,
    the editor scribbled, "This is not a word" next to things like can''t, it''s,
    and I''ve. To this day, I still do not know what this editor did not like contractions.
    My new opinion is that language always needs to expand. Where would we be without
    a new words — like dot-com, infomercial, and vaporware?


    Even Oxford English Dictionary (the last word in any argument about words) grows
    by more than 4,000 entries each year. That''s an increase of more than 1 percent
    per year. It''s about 11 words per day!


    The fact is, thought is like a high-rise building: You can''t build the 50th floor
    until you''ve built at least part of the 49th. You can''t talk about spam until
    you have a word like email. With all that goes on these days, you need verbal
    building blocks. That''s why this section contains a bunch of new terms.


    In this section, each newly defined term describes an of the Eclipse IDE. Before
    you read all Eclipse terminology, I provide the following disclaimers:


    +   **This section is optional reading.** Refer to this section if you have trouble
    understanding some of this book''s instructions. But if you have no trouble navigating
    the Eclipse IDE, dont complicate things by fussing over the terminology in this
    section.


    +   **This section provides explanations of terms, not formal definitions of terms.**
    Yes, my explanations are fairly precise, but no, they''re not airtight. Almost
    every description in this section has hidden exceptions, omissions, exemptions,
    and exclusions. Take the paragraphs in this section to be friendly reminders,
    not legal contracts.


    +   **Eclipse is a very useful tool.** But Eclipse isn''t officially part of the
    java ecosystem. Although I don''t describe details in this book, you can write
    Java programs without ever using Eclipse.


    # Understanding the big picture


    Your tour of Eclipse begins with a big Burd''s-eye view.


    +   **Workbench:** The Eclipse Desktop. (Refer to Figure 3-3) The workbench is
    the environment in which you develop code.


    +   **Area:** A section of the workbench. The workbench in Figure 3-3 contains
    five areas. To illustrate the point, I''ve drawn borders around each of the areas.
    (See Figure 3-15.)'
