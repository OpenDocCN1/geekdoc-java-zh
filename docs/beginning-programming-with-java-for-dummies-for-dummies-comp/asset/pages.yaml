  md: '# Author’s Acknowledgments


    Author’s To-Do List, May 13, 2017:


    **Item:** Send chocolates to Paul Levesque (the book''s project editor) and Becky
    Whitney (the book''s copy editor). As anyone who reads Chapter 4 learns, chocolate
    is one of the most precious commodities on earth. So when I give chocolate, I
    give it thoughtfully and intentionally.


    **Item:** Have a plaque erected in honor of Katie Mohr, your acquisitions editor
    at Wiley. While you worked on other projects, Katie kept insisting that you write
    this book''s fifth edition. (Sure, you wanted a long vacation instead of another
    book project, but who cares? She was right; you were wrong;)


    **Item:** Send a thank-you note to editor Chad Darby, who helped polish your original
    work and, miraculously, didn''t make a lot of extra work for you. Visit Frank
    Thornton, Bonnie Averbach, and Herbert Putz at Temple University. Thank them for
    steering you toward a career as a professor. In any other career, you''d have
    no time left to write. (And by the way, when you''re in Philly, don''t forget
    to stop for a cheesesteak.)


    **Item:** Send email to Gaisi Takeuti at the University of Illinois, and to William
    Wisdom and Hughes LeBlanc at Temple University. Thank them for teaching you about
    Symbolic Logic. It has made your life as a computer scientist and mathematician
    much richer.


    **Item:** Spend more time with your family. (Remind them that you''re the guy
    who wandered around the house before you started writing books.) Renew your pledge
    to clean up after yourself. Don''t be so high-strung, and finish each sentence
    you start. Remember that you can never fully return the love they''ve given you,
    though you should always keep trying.'
