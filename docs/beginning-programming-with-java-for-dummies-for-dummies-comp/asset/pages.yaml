  md: 'That''s how it works in many programming languages, but that''s not how it
    works in Java. With Java, the computer executes a different set of instructions.
    The computer executes instructions like the ones in Figure 1-4.


    ![](img/f472724a364323eda9b6dbd5661326f5_31_0.png)


    Figure 1-4:

    How a computer runs a program.


    The instructions in Figure 1-4 tell the computer how to follow other instructions.
    Instead of starting with Get columnNumber from memory, the computer''s first instruction
    is, “Do what it says to do in the bytecode file.” (Of course, the bytecode file,
    the first instruction happens to be Get columnNumber from memory.)


    There''s a special piece of software that carries out the instructions in Figure
    1-4. That special piece of software is called the Java Virtual Machine (JVM).
    The JVM walks your computer through the execution of some bytecode instructions.
    When you run a Java program, your computer is really running the JVM. That JVM
    examines your bytecode, zero by zero, and carries out the instructions described
    in the bytecode.


    Many metaphors can describe the JVM. Think of the JVM as a proxy, an errand boy,
    a go-between. One way or another, you have the situation shown in Figure 1-5.
    On the (a) side is the story you get with most programming languages — the computer
    runs some object code. On the (b) side is the story with Java — the computer runs
    the JVM, and the JVM follows the bytecode''s instructions.


    18  PART 1 Getting Started with Java Programming'
