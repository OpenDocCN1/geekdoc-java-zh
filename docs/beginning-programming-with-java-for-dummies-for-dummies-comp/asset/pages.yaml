  md: '# Extending a class


    In Listing 20-2, the words extends JFrame are particularly important. When you
    see Java''s extends keyword, imagine replacing that keyword with the phrase *is
    a kind of*


    ```

    public class MyFrame is a kind of JFrame {

    ```


    When you type MyFrame extends JFrame, you declare that your new MyFrame class
    has the fields and methods that are built into Java''s own JFrame class, and possibly
    more. For example, a JFrame instance has setDefaultCloseOperation, pack, and setVisible
    methods, so every new MyFrame instance has setDefaultCloseOperation, pack, and
    setVisible methods (see Figure 20-6).


    ![](img/f472724a364323eda9b6dbd5661326f5_481_0.png)


    When you put the words extends JFrame in your code, you get the JFrame methods
    for free. The MyFrame class''s code doesn''t need declarations for methods, such
    as setDefaultCloseOperation, pack, and setVisible. These declarations are already
    in the JFrame class in Java''s API. The only declarations in the MyFrame class''s
    code are for brand-new things — things that are specific to your newly'
