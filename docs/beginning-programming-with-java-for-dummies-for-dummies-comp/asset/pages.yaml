  md: 'of writing, you find yourself dreaming in sections and chapters when you go
    to bed at night.) The parts of the book are listed here.


    # # Part 1: Getting Started with Java Programming


    The chapters in Part 1 prepare you for the overall programming experience. In
    these chapters, you find out what programming is all about and get your computer
    ready for writing and testing programs.


    # # Part 2: Writing Your Own Java Programs


    This part covers the basic building blocks — the elements in any Java program
    and in any program using a Java-like language. In this part, you will discover
    how to represent data and how to get new values from existing values. The program
    examples are short, but cute.


    # # Part 3: Controlling the Flow


    Part 3 has some of my favorite chapters. In these chapters, you make the computer
    navigate from one part of your program to another. Think of your program as a
    big mansion, with the computer moving from room to room. Sometimes the computer
    chooses between two or more hallways, and sometimes the computer revis its rooms.
    As a programmer, your job is to plan the computer''s rounds through the mansion.
    It''s great fun.


    # # Part 4: Using Program Units


    Have you ever solved a big problem by breaking it into smaller, more manageable
    pieces? That''s exactly what you do in Part 4 of this book. You discover the best
    ways to break programming problems into pieces and create solutions for the newly
    found pieces. You also find out how to use other peoples'' solutions. It feels
    like stealing, but it''s not.


    This part also contains a chapter about programming with windows, buttons, and
    other graphical items. If your mouse feels ignored by the examples in this book,
    read Chapter 20.'
