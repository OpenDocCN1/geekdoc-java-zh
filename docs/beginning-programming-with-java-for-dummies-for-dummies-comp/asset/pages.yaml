    # Chapter 4


    # Exploring the Parts of a Program


    work in the science building at a liberal arts college. When I walk past the biology
    lab, I always say a word of thanks under my breath. I''m thankful for not having
    to dissect small animals. In my line of work, I dissect computer programs instead.
    Computer programs smell much better than preserved dead animals. Besides, when
    I dissect a program, I''m not reminded of my mortality.


    In this chapter, I invite you to dissect a program with me. I have a small program,
    named ThingsILike. I cut apart the program and carefully investigate the program''s
    innards. Get your scalpel ready. Here we go!


    # Checking Out Java Code for the First Time


    I have a confession to make. The first time I look at somebody''s computer program,
    I feel a bit queasy. The realization that I don''t understand something (or many
    things) in the code makes me nervous. I''ve written hundreds (maybe thousands)
