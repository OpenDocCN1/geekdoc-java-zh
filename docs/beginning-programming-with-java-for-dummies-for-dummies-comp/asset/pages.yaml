    # # Installing e(fx)clipse


    Eclipse has its own, elaborate facility for incorporating new functionality. An
    Eclipse tool is called an Eclipse plug-in. When you first install Eclipse, you
    get many plug-ins by default. Then, to enhance Eclipse''s power, you can install
    many additional plug-ins.


    e(fx)clipse plug-in facilitates the creation of JavaFX applications. You can add
    the plug-in to your existing installation of Eclipse, but it''s much simpler to
    download a new copy of Eclipse (a copy with e(fx)clipse already installed). Here''s
    how you get new copy of Eclipse:


    +   1. Visit http://efclipse.bestsolution.at.


    +   2. Look for the page containing All-In-One downloads.


    +   3. On the All-In One downloads page, look for a way to download a copy of
    Eclipse for your operating system.


    > Your Eclipse download''s word length (32-bit or 64-bit) must match your java
    version''s word length. For the full download on 32-bit and 64-bit word lengths,
    see Chapter 2.


    ![](img/f472724a364323eda9b6dbd5661326f5_487_0.png)


    +   4. Follow the appropriate links or click the appropriate buttons to begin
    the download.


    +   5. Follow the instructions in Chapter 2 to install this new copy of Eclipse
    on your computer.


    Place the new copy of Eclipse in a brand-new folder. That way, you don''t have
    to uninstall your old copy of Eclipse. (In fact, it''s helpful to have two separate
    Eclipse installations on your computer.) On my Windows computer, I have a c: \eclipse
