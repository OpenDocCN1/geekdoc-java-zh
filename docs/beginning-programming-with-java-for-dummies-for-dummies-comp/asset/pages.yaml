  md: '# NAME THAT FILE


    What if a file that contains data isn''t in your program''s project folder? If
    that''s the case, when you call new File, the file''s name must include folder
    names. For example, in Windows, your TullyBudget.java program might be in c:\Users\MyUserName\workspace\13-09
    folder, and a file totals might be in a folder named c:\advertisements. (See the
    following figure).


    ![](img/f472724a364323eda9b6dbd5661326f5_318_0.png)


    Then, to refer to the totals file, you include the folder name, the filename,
    and (to on the same side) the drive letter:


    ```

    Scanner diskScanner = new Scanner(File("c:\advertisements\\totals"));

    ```


    Notice that I use double backslashes to separate the drive letter, the folder
    name, and the filename. To find out why, look at the "Escapism" sidebar in Chapter
    12. The string "\\totals" with a single backslash stands for a tab, followed by
    a totals. In this example, the file''s name is totals, not totals. With a single
    backslash, the name ... \advertisements\\totals" would not work correctly.


    Inside quotation marks, use the double backslash to indicate what would usually
    be a single backslash. \"c:\advertadvert\\totals" stands for c:\advertisements\totals.
    That''s good because: \c\\advertisements\\totals is the normal way to refer to
    a file in Windows.


    If you want to sidestep this backslash confusion, you can use forward slashes
    to specify each file''s location. Windows responds exactly the same way to new
    File("c:\advertisements\\totals") and to new File("c:/advertisements/totals").
    And if you use UNIX Linux or a Macintosh, the double backslash nonsense doesn''t
    apply to you. Just write


    ```

    Scanner diskScanner = new Scanner(new File("/Users/me/advertisements/totals"));

    ```


    or something similar that reflects your system''s directory structure.'
