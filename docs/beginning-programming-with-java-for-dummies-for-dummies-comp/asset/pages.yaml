    happen in this example. But this section''s code doesn''t use an exotic remainder
    operator. This section''s code uses your old friends: division, multiplication,
    and addition.


    Be careful when you compare two numbers for equality (==) or for inequality (!=).
    Little inaccuracies can creep in almost anywhere where you work with Java''s double
    type or Java''s float type. Several little እንደሚ can build on one another to become
    very large inaccuracies. When you compare two double values or two float values,
    the values are almost never dead-on equal to one another.


