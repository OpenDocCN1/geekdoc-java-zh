  md: "If a keyboard-reading program expects you to type 19.95 5, then the corresponding\
    \ disk-reading program expects a file containing those same characters, 19.95\
    \ 5. If a keyboard-reading program expects you to press Enter and type more characters,\
    \ then the corresponding disk-reading program expects more characters on the next\
    \ line in the file.\n\n+   The stuff in a disk file is no different from the stuff\
    \ that you see in Eclipse's Console view.\n\nIf a screen-printing program displays\
    \ the number 99.75, then the corresponding disk-writing program writes the number\
    \ 99.75 to a file. A screen-printing program moves the cursor to the next line,\
    \ then the corresponding disk-writing program creates a new line in the file.\n\
    \nIf you have trouble imagining what you have in a disk file, imagine the text\
    \ that you would type on the keyboard or the text that you would see on the computer\
    \ screen (that is, in Eclipse's Console view). That same text can appear in your\
    \ disk.\n\n# A sample program\n\nListing 13-1 contains a keyboard/screen program.\
    \ The program multiplies unit price by quantity to get a total price. A run of\
