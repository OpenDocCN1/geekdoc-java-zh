  md: '# Repeating with Predetermined Values (Java’s Enhanced for Statement)


    Most people say that "never win anything." Other people win raffles, drawings,
    and contests, but they don''t win things. Well, I have news for these people:
    Other people don''t win things, either. Nobody wins things. That''s how the laws
    of probability work. Your chance of winning one of the popular U.S. lottery jackpot
    is roughly 1 in 135 million. If you sell your quarter-million-dollar house and
    all the money to buy lottery tickets, your chance of winning is still only 1 in
    540. If you play every day of the month (selling a house each day), your chance
    of winning the jackpot is still less than 1 in 15.


    Of course, in the previous paragraph applies to me. I don''t buy lottery tickets,
    but I often win things. My winning streak a few years ago. I won some expensive
    Java software at the end of an online seminar. Later that month, I won a microchip-enabled
    pink ring (a memento from a 1998 Java conference). The following year, I won a
    wireless PDA. Just last week, I won a fancy businessclass printer.


    I spend money to enter any contests. All these winnings are freebies. When the
    national computer science educators'' meet in Reno, Nevada, my colleagues convinced
    me to try the slot machines. I lost $23, and then I won $18. At that point, I
    stopped playing. I wanted to quit while I was only $5 ahead.


    That''s why writing a Java program about slot machines is such a strange occurrence.
    A typical slot machine has three reels, with each reel having about twenty symbols.
    But to illustrate this section''s ideas, I don''t need 20 symbols. Instead, I
    use 4 symbols — a cherry, a lemon, a kumquat, and a rutabaga.


    # Creating an enhanced for loop


    When you play your simplified slot machine, you can spin any one of over 60 combinations
    — cherry+cherry+kumquat, rutabaga+rutabaga+rutabaga, or whatever. This chapter''s
    goal is to list all possible combinations. But first, I show you another kind
    of loop. Listing 15–55 defines an enum type for a slot machine''s symbols and
    displays a list of the symbols. (For an introduction to enum types, see Chapter
    10.)'
