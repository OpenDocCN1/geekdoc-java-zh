  md: 'A call to setDefaultCloseOperation tells java what to do when you try to close
    the frame. (In Windows, you click the X in the upper-right corner, by the title
    bar. On a Mac, the X is in the frame''s upper-left corner.) For a frame that''s
    part of a larger application, you may want the frame to disappear when you click
    the X, but you probably don''t want the application to stop running.


    But in Listing 20-1, the frame is the entire application — the whole enchilada.
    When you click the X, you want the Java Virtual Machine to shut itself down. To
    make this happen, you call the setDefaultCloseOperation method with parameter
    JFrame.EXIT_ON_CLOSE. The other alternatives are as follows:


    +   - JFrame_HIDE_ON_CLOSE: The frame disappears, but it still exists in the computer''s
    memory.

    - JFrame_DISPOSE_ON_CLOSE: The frame disappears and no longer exists in the computer''s
    memory.

    - JFrame_DO_NOTHING_ON_CLOSE: The frame still appears, still exists, and still
    does everything it did before you clicked the X. Nothing happens when you click
    X. So, with this DO_NOTHING_ON_CLOSE option, you can become confused.


    > If you don''t call setDefaultCloseOperation, java automatically chooses the
    HIDE_ON_CLOSE option. When you click the X, the frame disappears, but the Java
    program keeps running. Of course, with no visible frame, the running of Listing
    20-1 doesn''t do much. The only noticeable effect of the run is your development
    environment''s behavior. With Eclipse, the little square on the Console view''s
    toolbar retains its bright red color. When you hover over the square, you see
    the Terminate tooltip. To end the java program''s run (and return the square to
    its washed-out reddish-gray), simply click this little square.


    A frame''s pack method shrink-wraps the frame around whatever has been added to
    the frame. Without calling pack, the frame can be bigger or smaller than is necessary.


    Unfortunately, the default is to make a frame smaller than necessary. If in Listing
    20-1, you forget to call frame.pack, you get the tiny frame shown in Figure 20-3.
    Sure, you can enlarge the frame by dragging the frame''s edges with the mouse.
    But why should you have to do that? Just call frame.pack instead.


    FIGURE 20-3:

    A frame that hasn''t been packed.


