  md: 'The code in Listing 16-3 isn''t earth-shattering. To get this code, you take
    the code in Listing 16-2 and add a few tests for the end of the occupancy file.
    You perform the diskScanner.hasNext test before each call to nextInt. That, if
    the call to nextInt is doomed to failure, you catch the potential failure before
    it happens. A few test runs of the code in Listing 16-3 are shown in Figure 16-4.


    | Which room? | 0 |

    | Room 0 has 1 guest(s) |

    | Which room? | 6 |

    | Room 6 has 4 guest(s) |

    | Which room? | 2 |

    | Room 2 has 0 guest(s) |

    | Which room? | 10 |


    FIGURE 16-4:

    The bad room

    number 10 gets

    no response.


    In Listing 16-3, I want to know whether the occupancy file contains any more data
    (any data that I haven''t read yet). So I call the Scanner class''s hasNext method.
    The hasNext method looks ahead to see whether I can read any kind of data — an
    int value, a double value, a word, a boolean, or whatever. That''s okay for this
    section''s example, but in some situations, you need to be picky about your input
    data. For example, you may want to know whether you can call nextInt(as opposed
    to nextDouble or nextLine). Fortunately, Java has methods for your pickiest input
    needs. A method like (diskScanner.hasNext()) tests to see whether you can read
    an int value from the disk file. Java also has methods like hasNext, hasNextDouble,
    and so on. For more information on the plain old hasNext method, see Chapter 14.


    Listing 16-3 has a big, fat condition to keep the for loop going:


    ```

    for (int roomNum=0; roomNum < whichRoom && diskScanner.hasNext(); roomNum++) {

    ```


    Many for loop conditions are simple "less-than", but there''s no rule saying that
    all for loop conditions have to be so simple. In fact, any expression can be a
    for loop''s condition, as long as the expression has value true or false. The
    condition in Listing 16-3 combines a "less than" with a call to the Scanner class''s
    hasNext method.


