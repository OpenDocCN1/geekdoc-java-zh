    27? Or is it one number, 4,221? And about storing four numbers, 4, 2, 2, and 1?
    It all depends on the amount of space each number consumes.


    Imagine a variable that stores the number of paydays in a month. This number never
    gets bigger than 31. You can represent this small number with eight zeros and
    ones. But what about a variable that counts stars in the universe? That number
    could easily be more than a trillion, and to represent 1 trillion accurately,
    you need 64 zeros and ones.


    At this point, Java comes to the rescue. Java has four types of whole numbers.
    Just as in Listing 7-1, I declare


    ```

    int gumallsPerKid;

    ```


    I can also declare


    ```

    byte paydaysInMonth;

    short sickDaysDuringYourEmployment;

    long numberOfStars;

    ```


    Each of these types (byte, short, int, and long) has its own range of possible
    values. (See Table 7-1.)


    # Java’s Primitive Numeric Types


    | Type Name | Range of Values |

    |---|---||

    | Whole Number Types | |

    | byte | -128 to 127 |

    | short | -32768 to 32767 |

    | int | -2147483648 to 2147483647 |

    | long | -9223372036854775808 to 9223372036854775807 |

    | Decimal Number Types | |

    | float | -3.4x10³⁸ to 3.4x10³⁸ |

    | double | -1.8x10³⁸ to 1.8x10³⁸ |'
