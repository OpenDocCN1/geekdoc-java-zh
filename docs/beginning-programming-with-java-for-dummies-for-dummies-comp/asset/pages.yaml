- img_proc: true
  md: 'computer prompt you for each bit of night sky data. For big problems, you lots
    of data, and the best place to store the data is on a computer''s hard drive.


    # # Running a Disk-Oriented Program


    To deal with volumes of data, you need tools for reading from (and writing to)
    disk files. At the mere mention of disk files, some people''s hearts start to
    palp with fear. After all, a disk file is elusive and invisible. It''s stored
    somewhere inside your computer, with some magic magnetic process.


    The truth is, getting data from a disk is much like getting data from the keyboard.
    And printing data to a disk is like printing data to the computer screen.


    In this book, displaying a program''s text output "on the computer screen" means
    displaying text in Eclipse''s Console view. If you shun Eclipse (NetBeans or IntelliJ
    IDEA) or you shun all IDEs of your system''s command window, then, for you, "on
    the computer screen" means something slightly different. Please read between the
    lines as necessary. Also, I''m aware that some computers have SSD drives with
    no disks inside them. So terms disk-oriented and disk files are showing signs
    of age. But let''s face facts: A "record store" no longer focuses on vinyl records,
    and in U.S. measurement units, 12 inches is no longer the length of the king''s
    foot. Today''s LCD screens no longer need saving. And, unlike the old mechanical
    car radios, a web page''s radio buttons don''t mark your favorite stations.


    ![](img/f472724a364323eda9b6dbd5661326f5_301_0.png)


    TECHNICAL STUFF


    Consider the scenario when you run the code in earlier chapters. You type some
    stuff on the keyboard. The program takes this stuff and spits out some stuff of
    its own. The program sends this new stuff to the Console view. In effect, the
    flow of data goes from the keyboard to the computer''s innards and then to the
    screen, as shown in Figure 13-1.


    Of course, the goal in this chapter is illustrated in Figure 13-2. There''s a
    file containing on your hard drive. The program takes data from the disk file
    and spits out some brand-new data. The program then sends the new data to another
    file on the hard drive. In effect, the flow of data goes from a disk file to the
    computer''s innards and on to another disk file.


    The scenarios in Figures 13-1 and 13-2 are similar. In fact, it helps to remember
    these fundamental points:


    +   > The stuff in a disk file is no different from the stuff that you type on
    a keyboard.'
