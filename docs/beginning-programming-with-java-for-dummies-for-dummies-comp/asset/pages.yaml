  md: '# GRABB INPUT HERE AND THERE


    Listing 16-2 illustrates some pithy issues surrounding the input of data. For
    one thing, the program gets input from both the keyboard and a disk file. (The
    program gets a room number from the keyboard. Then the program gets the number
    of guests in that room from the occupancy file.) To make this happen, Listing
    16-2 shows two Scanner declarations: one to declare keyboard and a second to declare
    diskScanner.


    Later in the program, the call keyboard.next.Int reads from the keyboard, and
    diskScanner..next reads from the file. Within the program, you can read from the
    keyboard or the disk as many times as you want. You can even intermingle the calls—reading
    from the keyboard, and then three times from the disk, and twice from the keyboard,
    and so on. All you have to remember is to use keyboard whenever you read from
    the keyboard and use diskScanner whenever you read from the disk.


    Another interesting tidbit in Listing 16-2 connects the occupancy file. Many of
    this chapter''s examples read from an occupancy file, and use the same data in
    each of the examples. (I use the data in Figure 16-1.) To run an example, I copy
    the occupancy file from Eclipse to project. (Before running the code in Listing
    16-2, I go to my 16-01 project in Eclipse''s Package Explorer. Right-click the
    occupancy file in the 16-02 project branch and select Copy from the context menu.
    Then I right-click the new 16-02 project and select Paste from the context menu.
    As usual, Mac users should Control-click instead of right-click.)


    In real life, having several copies of a data file can be dangerous. You can modify
    one and then accidentally read out-of-date data from a different copy. Sure, you
    should have backup copies, but you should only have one "master" copy from which
    all programs get the same input.


    In a real-life program, you don''t copy the occupancy file from one project to
    another. What do you do instead? You put an occupancy file in one place on your
    hard drive and then have each program refer to the file using the names of the
    file''s directories. For example, if your occupancy file is in the c:\oct\22 directory,
    you write


    ```

    Scanner diskScanner = new Scanner(new File("c:\oct\22\occupancy"));

    ```


    The "Name that file" sidebar in Chapter 13 has more details about filenames and
    doubleslashes.'
