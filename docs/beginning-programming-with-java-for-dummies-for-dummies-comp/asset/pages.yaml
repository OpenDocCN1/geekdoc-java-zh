  md: '# # Calling static and non-static methods


    In this book, my first use of the word static is in Listing 3-1. I use static
    as part of every main method (and this book''s listings have lots of main methods).
    In Java, your main method has to be static. That''s just the way it goes.


    To call a static method, you use a class''s name along with a dot. This is just
    slightly different from the way you call a non-static method:


    +   >> To call an ordinary (non-static) method, you follow an object with a dot.


    For example, a program to process the checks in Figure 18-7 may contain code of
    the following kind:


    ```

    Check firstCheck;

    firstCheck.number = 1705;

    firstCheck.amount = 25.09;

    firstCheck.payee = "The Butcher";

    firstCheck.print();

    ```


    +   >> To call a class''s static method, you follow the class name with a dot.


    For example, to sort the checks in Figure 18-7, you may call


    ```

    Check.sort();

    ```


    # # Turning strings into numbers


    The code in Listing 18-5 introduces a non-static method named equals. To compare
    the password string with the userInput string, we preface equals either of the
    two string objects. In Listing 18-5, I preface .equals with the password object:


    ```

    if (password.equals(userInput))

    ```


    Each string object has an equals method of its own, so I can achieve the same
    effect by writing


    ```

    if (userInput.equals(password))

    ```


    But Java has another class named Integer, and the whole Integer class has a static
    method named parseInt. If someone hands you a string of characters and you want
    to turn that string into an int value, you can call the Integer class''s parseInt
    method. Listing 18-6 has a small example.'
