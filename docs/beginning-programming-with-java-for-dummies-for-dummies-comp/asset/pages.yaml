  md: "# Installing Eclipse\n\nPrecisely how you install Eclipse depends on your operating\
    \ system and on what kind of file you get when you download Eclipse. Here's a\
    \ brief summary:\n\n+   - If you run Windows and the download is an .exe file:\n\
    \  Double-click the .exe file's icon.\n\n+   - If you run Windows and the download\
    \ is a .zip file:\n  Extract the zip file's contents to the directory of your\
    \ choice.\n  In other words, find the .zip file's icon in File Explorer (also\
    \ known as Windows Explorer). Then double-click the .zip file (As a result, Explorer\
    \ displays the contents of the .zip file, which consists of only one folder —\
    \ named eclipse). Drag the eclipse folder to a convenient place on your computer's\
    \ hard drive.\n  For more information about .zip files, see the \"Compressed archive\
    \ files\" sidebar, earlier in this chapter.\n  My favorite place to drag the eclipse\
    \ folder directly onto the C: drive; so my C: drive has folders Program Files,\
    \ Windows, eclipse, and others. I avoid making the eclipse folder a subfolder\
    \ of Program Files because from time to time, I've had problems dealing with the\
    \ blank space in the name Program Files.\n\n+   - If you run Mac OS X:\n  When\
    \ you download Eclipse, you get either a .tar.gz file or a .dmg file.\n  A .tar\
    \ gz file is a compressed archive file. When you download the file, your web browser\
    \ might automatically do some uncompressing for you. so you won't find a .tar\
    \ gz file in your Downloads folder. Instead, you'll find either a .tar file (because\
    \ your web browser uncompressed the .gz part) or an eclipse folder (because your\
    \ web browser uncompressed both the .tar and .gz parts).\n  If you find new .tar\
    \ file or .gz file in your Downloads folder, double-click the file until you see\
    \ the eclipse folder. Drag this new eclipse folder to your Applications folder,\
    \ and you're all set.\n  If you download a .dmg file, your web browser may open\
    \ the file for you. If not, find the .dmg file in your Downloads folder and double-click\
    \ the file. Follow any instructions that appear after this double-click. If you're\
    \ expected to drag Eclipse into your Applications folder, do so."
