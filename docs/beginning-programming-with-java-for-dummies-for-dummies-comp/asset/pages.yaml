  md: '** Don''t think you''re the only person who''s slow to understand.


    I''m slow, and I''m proud of it. (Katie, Chapter 6 will be a week late.)


    ** Don''t be timid.


    If your code isn''t working and you can''t figure out why it''s not working, ask
    someone. Post a message in an online forum. And don''t be afraid of anyone''s
    snide or sarcastic answer. (For a list of gestures you can make in response to
    people''s snotty answers, see Appendix Z.)


    To ask me directly, send me an email message, tweet me, or post to me on Facebook.
    (Send email to BeginProg@allmycode.com, tweets to @allmycode, or posts to Facebook
    at /allmycode.)


    # # Diagnosing a problem


    The "Typing and running a program" section, earlier in this chapter, tells you
    how to run the EchoLine program. If all goes well, your screen ends up looking
    like the one in Figure 5-1. But things don''t always go well. Sometimes your finger
    slips, inserting a typo into your program. Sometimes you ignore one of the details
    in Listing 5-1, and you get a nasty error message.


    Of course, some things in Listing 5-1 are okay to change. Not every word in Listing
    5-1 is cast in stone. Here''s a nasty wrinkle: I can''t tell you that you must
    always retype Listing 5-1 exactly as it appears. Some changes are okay; others
    are not. Keep reading for some "f''instances."


    # # Case sensitivity


    Java is case-sensitive. Among other things, case-sensitive means that, in a Java
    program, the letter P isn''t the same as the letter p. If you send me some fan
    mail and start with "Dear Barry" instead of "Dear Barry," I still know what you
    mean. But Java doesn''t work that way.


    Change one character in a Java program and, instead of an uneventful compilation,
    you get a big headache! Change p to P like so:


    ```

    //The following line is incorrect:

    System.out.println(keyboard.nextLine());

    ```


    When you type the program in Eclipse''s editor, you''ll get the ugliness shown
    in Figure 5-6.


    CHAPTER 5 Composing a Program 115'
