  md: "# From Your Mind to the\nComputer’s Processor\n\nWhen you create a new computer\
    \ program, you go through a multistep process.\nThe process involves three important\
    \ tools:\n\n+   - **Compiler**: A compiler translates your code into computer-friendly\
    \ (human-unfriendly) instructions.\n- **Virtual machine**: A virtual machine steps\
    \ through the computer-friendly instructions.\n- **Application programming interface**:\
    \ An application programming interface contains useful prewritten code.\n\nThe\
    \ next three sections describe each of the three tools.\n\n# Translating your\
    \ code\n\nYou may have heard that computers deal with zeros and ones. That’s certainly\
    \ true,\nbut what does it mean? Well, for starters, computer circuits don't deal\
    \ directly with\nletters of the alphabet. When you see the word on your computer\
    \ screen, the\ncomputer stores the word internally as `01010001 01110100 01110001\
    \ 01110010\n01101101`. That feeling you get of a friendly looking five-letter\
    \ word is your\ninterpretation of the computer screen's pixels, and nothing more.\
    \ Computers break\nevery down into very low-level, unfriendly sequences of zeros\
    \ and ones and\nthen put back together that humans can deal with the results.\n\
    \nSo what happens when you write a computer program? Well, the program has to\n\
    \ translated into zeros and ones. The official name for the translation process\
    \ is\ncompilation. Without compilation, the computer can't run your program.\n\
    \nI compiled the code in Listing 1-1. Then I did some harmless hacking to help\
    \ me\nsee the resulting zeros and ones. What I saw was the mishash in Figure 1-1.\n\
    \nThe compiled jumbo jumbo in Figure 1-1 goes by many different names:\n\n+  \
    \ - Most java programmers call it bytecode.\n- I often call it a .class file.\
    \ That's because, in java, the bytecode gets stored in\n named `SomethingOrOther.class`.\n\
    - To emphasize the difference, Java programmers call Listing 1-1 the source code\n\
    \ refer to the zeros and ones in Figure 1-1 as object code.\n\n14 PART 1 Getting\
    \ Started with Java Programming"
