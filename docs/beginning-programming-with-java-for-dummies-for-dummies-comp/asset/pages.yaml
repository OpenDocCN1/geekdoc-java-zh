    As a beginning programmer, you may think these rules are arbitrary. But they''re
    not. These rules belong to a carefully crafted grammar. They are like the grammar
    rules for English sentences, but they''re even more logical! (Sorry, Becky.).


    Table 9-1 shows the kinds of things that can go wrong when you break the statement''s
    punctuation. The table''s last two items are the most notorious. In these situations,
    the compiler doesn''t catch the error. This lulls you into a false sense of security.
    The trouble is, when you run the program, the code''s behavior isn''t what you
    expect it to do.


    # Table 9-1 Common if Statement Error Messages


    | Error | Example | Most Likely Messages or Results |

    |---|---|---|

    | Missing parentheses surrounding the condition | | Syntax error on token "if",
    expected expected after this token |

    | Missing semicolon after a statement''s inside the if clause or the else clause
    | if (randomNumber > 5) { System.out.println("Y"); } | Syntax error, insert ":"
    to complete BlockStatements |

    | Semicolon immediately after the condition | if (randomNumber > 5); System.out.println("Y");
    } | Syntax error on token "else", delete this token |

    | Semicolon immediately after the word else | } else; | The program compiles without
    errors, the statement after the word else is always executed, whether the condition
    is true or false |

    | Missing curly braces | if (randomNumber > 5) otherValue = 7; System.out.println("Y");
    else otherValue = 9; System.out.println("N"); | The program compiles without errors,
    but your program''s run may not do what you expect it to do. (The bottom line:
    Don''t omit the curly braces.)'
