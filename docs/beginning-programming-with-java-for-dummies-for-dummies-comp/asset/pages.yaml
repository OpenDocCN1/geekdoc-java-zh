  md: '# The increment and decrement operators


    Java has some neat little operators that make life easier (for the computer''s
    processor, for your brain, and for your fingers). Altogether, there are four operators
    — two increment operators and two decrement operators. The increment operators
    add one, and the decrement operators subtract one. To see how they work, you need
    now some examples.


    # Using preincrement


    The first example is in Figure 7-7.


    ![](img/f472724a364323eda9b6dbd5661326f5_176_0.png)


    Figure 7-7:

    Using preincrement.


    A run of the program in Figure 7-7 is shown in Figure 7-8. In this horribly eventfulful
    run, the count of gumballs is displayed three times.


    ![](img/f472724a364323eda9b6dbd5661326f5_176_1.png)


    Figure 7-8:

    A run of the preincrement code (the code in Figure 7-7).


    The double plus sign goes under two different names, depending on where you put
    it. When you put the ++ before a variable, ++ is called the preincrement operator.'
