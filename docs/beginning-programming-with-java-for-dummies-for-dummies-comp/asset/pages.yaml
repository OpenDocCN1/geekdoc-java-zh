  md: '# Variations on the Theme


    I don''t like to skin cats. But I''ve heard that, if I ever need to skin one,
    I have a choice of several techniques. I''ll keep that in mind the next time my
    cat Histamine mistakes the carpet for a litter box.


    Anyway, whether you''re skinning catfish, skinning kitties or writing computer
    programs, the same principle holds true. You always have alternatives. Listing
    9-2 shows you one way on which to write an if statement. The rest of this chapter
    (and all of Chapter 10) shows you some other ways to create if statements.


    # ... Or else?


    You can create an if statement without an else clause. For example, imagine a
    web page on which in ten randomly chosen visitors receives a special offer. To
    keep visitors guessing, I call the Random class''s nextInt method and make the
    offer to anyone whose name is lucky 7:


    +   * ifRandom.nextInt(10) + 1 generates the number 7, display a special offer
    message.

    * ifRandom.nextInt(10) generates any number other than 7, do nothing. Don''t display
    a special offer message and discourage him, "Sorry, no offer for you," message.


    > * Rick Ross, who read about skinning cats in one of my other books, sent me
    this information via email: “you refer to ''skinning the cat'' and go on to discuss
    litter boxes and whatnot. Please note that the phrase begins with ''more than
    one way to skin a cat'' refers to the difficulty in removing the inedible skin
    from catfish, and there is more than one way to do the same. These range from
    nailing the critter''s tail to a board and taking a pair of pierers to peel it
    down, letting the furry kind of cat have the darn thing and just not worrying
    about it. I grew up on The River (the big one running north/south the U.S. that
    begins with has so many repeated letters), so it''s integral to our experience
    there." Another reader, Alan Wilson, added his two cents to this discussion: “the
    phrase ''Skinning a Cat'' ... actually has an older but equally interesting British
    Naval origin. It refers to the activity of attaching nine ropes to the whip used
    to punish recalcitrant sailors up to a couple of hundred years ago. The ''Cat-O''-Nine-Tails''
    was the name of the whip and there was more than one way to attach the ropes or
    ''skin'' the whip." One way or another, it''s time for me to apologize to my little
    house pet.'
