  md: '>> Window: A copy of the Eclipse workbench. With Eclipse, you can have several
    copies of the workbench open at once. Each copy appears in its own window.


    >> Action: A choice that''s offered to you — typically, when you click something,
    For example, when you choose File-New on Eclipse''s main menu bar, you see a list
    of new things that you can create. The list usually includes Project, Folder,
    File, and Other, but it may also include things like Package, Class, and Interface.
    Each of these things (each item on the menu) is called an action.


