  md: '# Type three lines of code and don''t look back


    Buried innocently inside Listing 5-1 are three extra lines of code. These lines
    help the computer read input from the keyboard. The three lines are


    ```

    import java.util.Scanner;


    Scanner keyboard = new Scanner(System.in);


    keyboard.close();

    ```


    Concerning these three lines, I have bad news and good news:


    +   - The bad news is, the reasoning behind these lines is difficult to understand.
    That''s especially true here in Chapter 5, where I introduce Java''s most fundamental
    concepts.


    +   - The good news is, you don''t have to understand the reasoning behind these
    lines. You can copy and paste these lines into any program that gets input from
    the keyboard. You don''t have to change the lines in any way. These lines work
    without any modifications in all kinds of Java programs.


    Just be sure to put these lines in the right places:


    +   - Make the import java.util.Scanner the first line in your program.


    +   - Put the Scanner keyboard = new Scanner(System.in) line inside the main method
    immediately after the public static void main(String args[]) { line.


    +   - Make the keyboard.close() line the last line in your program.


    At some point in the future, you may have to be more careful about the positioning
    of these three lines. But for now, the rules I give will serve you well.


    # A QUICK LOOK AT THE SCANNER


    In this chapter, I advise you to ignore any of the meanings behind the lines import
    java.util.Scanner and Scanner keyboard, etc. Just paste these two lines mindlessly
    in your code and move on.


    Of course, you may not want to take my advice. You may not like ignoring things
    in your code. If you happen to be such a stubborn person, I have a few quick facts
    for you:'
