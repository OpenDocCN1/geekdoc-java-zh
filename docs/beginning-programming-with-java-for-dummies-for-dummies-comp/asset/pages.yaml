  md: '# 2. I run the code in Listing 13-5.


    The call to the new PrintStream in Listing 13-5 creates a file named approval.txt.
    Initially, the new approval.txt file contains no characters. Later in Listing
    13-5, calls to print and println put characters in the file. So, after running
    the code, the approval.txt file contains two letters: the letters OK.


    # 3. I run the code from Listing 13-5 a second time.


    At this point, I could imagine seeing OK in the approval.txt file. But that''s
    not what I see in Figure 13-8. After running the code twice, the approval.txt
    file contains just OK. Here''s why:


    +   - The call to new PrintStream in Listing 13-5 deletes my existing approval.txt
    file. The call creates a new, empty approval.txt file.

    - After a new approval.txt file is created, the print method call drop the letter
    O into the new file.

