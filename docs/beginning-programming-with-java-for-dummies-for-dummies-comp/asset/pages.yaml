  md: '# ESCAPISM


    In Figure 12-5, we see the numbers 8, and then 6 14 (and so on) displayed. I wanted
    these numbers to be right under the heading words Card and Total1, so I used a
    trick to make the numbers line up correctly. Normally, I can get perfect vertical
    columns by pressing the Tab key, but a computer program creates the nicely aligned
    output in Figure 12-5. How did I I get a computer program to press the tab key?


    In Java, there''s a way. You can insert a tab in your output by putting \t inside
    double quote marks:


    ```

    System.out.println("Card\Total");

    System.out.print(card);

    System.out.print("\t");

    System.out.println(total);

    ```


    In the first statement, the computer displays Card and then jumps to the next
    tab stop on the screen and displays Total. In the next three statements, the computer
    displays a card number (like the number 6), and then jumps to the next tab stop
    (directly under the word Total) and displays a total value (like the number 14).


    The \t combination of characters is an example of an escape sequence. Another
    of Java''s escape sequences, the combination \n, moves the cursor to a new line.
    In other words, System.out.print("Hello\n") does the same thing as System.out.println("Hello").


