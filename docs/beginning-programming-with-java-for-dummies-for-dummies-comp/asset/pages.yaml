    \ computer what to do. Another name for a program (or part of a program) is code.\
    \ Listing 1-1 shows you some of Microsoft Word's code may look like.\n\n# LISTING\
    \ 1-1 A Few Lines in a Computer Program\n\n```\nif (columnNumber > 60) {\n   \
    \ wrapToNextLine();\n} else {\n    continueSameLine();\n}\n```\n\nIf you translate\
    \ Listing 1-1 you get something like this:\n\n> If the column number is greater\
    \ than 60,\nthen go to the next line.\nOtherwise (if the column number isn't greater\
    \ than 60),\nthen stay on the same line.\n\nSomebody has to write code of the\
    \ kind shown in Listing 1-1. This code, along with millions of other lines of\
    \ code, makes the program called Microsoft Word.\n\nAnd what about web surfing?\
    \ You click a link that's supposed to take you directly to Facebook. Behind the\
    \ scenes, someone has written code of the following kind:\n\n```\nGo to <a href=\"\
    http://www.facebook.com\">Facebook</a>\n```\n\nOne way or another, someone has\
    \ to write a program. That someone is called a programmer.\n\n# Telling a computer\
    \ what to do\n\nEverything you do with a computer involves goals and go of code.\
