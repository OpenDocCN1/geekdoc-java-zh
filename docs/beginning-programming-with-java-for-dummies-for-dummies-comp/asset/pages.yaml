    +   2. In the Terminal window, type the following text and then press Enter: java
    -version.


    On one of my Linux computers, the Terminal window responds with the following
    text:


    ```

    java version 1.8.0_111

    ```


    On another Linux computer, I see this:


    ```

    Java version 9

    ```


    Between Java 8 and Java 9, Oracle changed its version numbering system. So version
    9 comes immediately after the 1.8.0 versions. Anyway, if your computer responds
    with the 9 or higher, you can pop open the campaign and look forward to some good
    times running this book''s examples. If the version number is 1.5 or greater,
    you can run many, but not all, of this book''s examples. If your computer responds
    with something like command not found, most likely, java isn''t installed on your
    computer.


    # Setting Up the Eclipse Integrated Development Environment


    In the previous sections, you get all the tools your computer needs for processing
    Java programs. This section is different. In this section, you get the tool that
    you need for composing and testing your Java programs. You get Eclipse — an integrated
    development environment for Java.


    An integrated development environment (IDE) is a program that provides tools to
    help you create software easily and efficiently. You can create Java programs
    without an IDE, but the time and effort you save using an IDE makes the IDE worthwhile.
    (Some hard-core programmers disagree with me, but that''s another matter.)'
