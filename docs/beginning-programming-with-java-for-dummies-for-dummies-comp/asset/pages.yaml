  md: 'Here''s something interesting. The parameter in the addInterest method header
    is rate. But, inside the ProcessNiceAccounts class, the parameter in the method
    call is interestRate. That''s okay. In fact, it''s standard practice.


    In Listings 19-6 and 19-7, the names of the parameters don''t have to be the same.
    The only thing that matters is that both parameters (rate and interestRate) have
    the same type. In Listings 19-6 and 19-7, both of these parameters are of type
    double. So everything is fine.


    Inside the addInterest method, the += assignment operator adds balance * (rate
    / 100.0) to the existing balance value. For some info about the += assignment-operator,
    see Chapter 7.


    # Working with a method header


    In the next few bullets, I make some observations about the addInterest method
    header (in Listing 19-6):


    +   > The word tells the computer that when the addInterest method is called,
    the addInterest method doesn''t send a value back to the place that it called.

    The next section has an example in which a method sends a value back.

    > The word addInterest is the method''s name.

    That''s the name you use to call the method when you''re writing the code for
    the ProcessNiceAccounts class. (See Listing 19-7.)

    > The parentheses in the header header contain placeholders for all the things
    you''re going to pass to the method when you call it.

    When you call a method, you can pass information to the method on the fly. This
    information is the method''s parameter list. The addInterest method''s header
    says that the addInterest method takes one piece of information, and that piece
    of information must be of type double:


    ```

    void addInterest(double rate)

    ```


    Sure enough, if you look at the class to add addInterest (down in the ProcessNiceAccounts
    class''s main method), that call has the variable interestRate in it. And interestRate
    is of type double. When I call addInterest, I''m giving the method a value of
    type double.'
