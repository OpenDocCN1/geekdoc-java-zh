  md: '# # WHAT CAN POSSIBLY GO WRONG?


    Ridding the editor of jagged underlines is cause for celebration. Eclipse likes
    the look of your code, so from that point on, it''s smooth sailing. Right?


    Well, it isn''t necessarily so. In addition to some conspicuous compile-time errors,
    your code can have other, less obvious errors.


    Imagine someone telling you to “go to the intersection, and you respond with a
    polite “Huh?” immediately after the speaker made a mistake. The nonsensical run
    tight phrase is like a compile-time error. Your “Huh?” is like jagged underlines
    in Eclipse''s editor. As a listening human, you may be able to guess what *run
    tight* means, but Eclipse''s editor never dares to fix your code''s mistakes.


    In addition to compile-time errors, some other kind of goblins hide inside a Java
    program:


    +   - Unchecked runtime exceptions: You have no compile-time errors, but when
    you run your program, the run ends prematurely. Somewhere in the middle of the
    run, your instructions tell Java to do something that can''t be. For example,
    while you''re running the Mortgage program in the “Running a Canned Java Program”
    section, you type 1,000,000.00 instead of 1000000.0. Java doesn''t like the commas
    in the number, so your program crashes and displays a nasty-message, as shown
    in the figure.


    ![](img/f472724a364323eda9b6dbd5661326f5_82_0.png)


    This is an example of an unchecked exception — the equivalent of someone telling
    you to run at the intersection when the only thing to the right is a big brick
    wall. Eclipse''s editor doesn''t warn you about an unchecked runtime exception
    until you run the program, the compiler can''t predict that the exception will
    occur.


    +   - Logic errors: You see no error markers in Eclipse''s editor, and when you
    run your code, the program runs to completion. But the answer is not correct.
    Instead of $552.20 in the figure, the output is $552,200,000,00.0. The program
    wrongly tells you to pay thousands of times what your house is worth and tells
    you to pay this amount each month! It''s the equivalent of being told to turn
    right instead of turning left. You can drive in the wrong direction for a very
    long time.


    (continued)


    CHAPTER 3 Running Programs 69'
