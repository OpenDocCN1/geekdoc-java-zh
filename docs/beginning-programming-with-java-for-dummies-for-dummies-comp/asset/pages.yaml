  md: 'In backgammon and other dice games, rolling 3 and 5 isn''t the same as rolling
    4 and 4, even though the total for both rolls is 8. The next move varies, depending
    on whether you roll dice. To get the computer to roll two dice, you execute myRandom.nextInt(6)
    + 1 times. Then you combine the rolls into a larger, more complicated if statement.


    To simulate a backgammon game (and many other, more practical situations) you
    need to combine conditions:


    ```

    If die1 + die2 equals 8 and die1 equals die2, ...

    ```


    You need things like and and or — things that can wire conditions together. Java
    has operators to represent these concepts, which are described in Table 10-1 and
    illustrated in Figure 10-1.


    # TABLE 10-1


    # Logical Operators


    | Operator | Symbol | Meaning | Example | Illustration |

    |---|---|---|---|---|

    | && | | and | 4 < age && age < 8 | Figure 10-1(a) |

    | || | | or | age < 4 || age < age | Figure 10-1(b) |

    | ! | | not | !leKidGetsTen | Figure 10-1(c) |


    FIGURE 10-1: When you satisfy a condition, you''re happy.


