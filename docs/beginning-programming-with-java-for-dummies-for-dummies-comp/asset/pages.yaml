    the\computer keyboard. If you type


    +   - Testing 1 2 3


    the program in Listing 5-1 echoes back the entire Testing 1 2 3 line of text.


    Sometimes you don''t want a program to get an entire line of text. Instead, you

    want the program to get a piece of a line. For example, when you type 2 instead
    of 3, you

    may the computer to get the number 1 (Maybe the 1 stands for one

    customer or something like that.) In such situations, you don''t put keyboard.

    nextLine() in your program. Instead, you use nextLine().


    Table 5-1 shows you a few variations on the keyboard.next business. Unfortun-\ately,
    the table''s entries aren''t very predictable. To read a line of input, you call

    nextLine. To read a word of input, you don''t call nextword. (The Java API has

    no nextword method.) Instead, to read a word, you can call next.


    Also, the table''s story has a surprise ending. To read a single character, you
    don''t

    call next. Instead, you can call the bizarre withinHorizon(".",).

    charAt(0) combination of methods. (You''ll have to excuse the folks who created

    the Scanner from a specialized point of view)


