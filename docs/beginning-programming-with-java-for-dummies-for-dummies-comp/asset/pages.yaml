  md: 'In the word preincrement, the *pre* stands for *before*. In this setting, the
    word *before* has two different meanings:


    +   - You''re putting ++ before the variable.


    +   - The computer adds 1 to the variable''s value before it is used in any other
    part of the statement.


    Figure 7-9 shows a slow-motion, instant replay of the preincrement operator''s
    action. In Figure 7-9, the computer encounters the `System.out.println(++gumballs)`
    statement. First, the computer adds 1 to gumballs (raising the value of gumballs
    to 29). Then the computer executes `System.out.println`, using the new value of
    gumballs (29).


    ![](img/f472724a364323eda9b6dbd5661326f5_177_0.png)


    # Using postincrement


    An alternative to preincrement is *postincrement*. With postincrement, the post
    stands for *after*. The word *after* has two different meanings:


    +   - You put ++ after the variable.


    +   - The computer adds 1 to the variable''s value after the variable is used
    in any other part of the statement.


    Figure 7-10 shows a close-up view of the postincrement operator''s action. In
    Figure 7-10, the computer encounters the `System.out.println(gumballs++)` statement.
    First, the computer executes `System.out.println`, using the old value of gumballs
    (28). Then the computer adds 1 to gumballs (raising the value of gumballs to 29).'
