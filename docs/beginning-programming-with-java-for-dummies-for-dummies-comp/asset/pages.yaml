  md: '# Using a variable


    The code in Listing 6-1 makes use of a variable named amount. A variable is a
    placeholder. You can stick a number like 5.95 into a variable. After you''ve placed
    a number in the variable, you can change your mind and put a different number,
    like 30.95, into the variable. (That''s what varies in a variable.) Of course,
    when you put a new number in a variable, the old number is no longer there. If
    you didn''t save the old number somewhere else, the old number is gone.


    Figure 6-2 gives a before-and-after picture of the code in Listing 6-1. When the
    computer computes amount = 5.95, the variable amount has the number 5.95 in it.
    When, after amount = amount + 25.00 statement is executed, the variable amount
    suddenly has 30.95 in it. When you think about a variable, picture a place in
    the computer''s memory where wires and transistors store 5.95, 30.95, or whatever.
    In Figure 6-2, imagine that each box is surrounded by millions of such boxes.


    ![](img/f472724a364323eda9b6dbd5661326f5_144_0.png)


    FIGURE 6-2:

    A variable (before and after).


    You need some terminology. (You can follow along in Figure 6-3.) The thing stored
    in a variable is called a *value*. A variable''s value can change during the run
    of a program (when SnitSoft adds the shipping and handling cost, for example).
    The value stored in a variable isn''t necessarily a number. It can always stores
    a letter. The kind of value stored in a variable is a variable''s *type*. (You
    can read more about types in the rest of this chapter and in the next two chapters.)


    There''s a subtle, almost unnoticeable difference between a variable and a variable''s
    name. In formal writing, it often use the word variable when I mean variable name.
    Strictly speaking, amount is the variable name, and all the memory storage associated
    with amount (including the value and type of amount) is the variable itself. If
    you think this distinction between variable and variable name is not too subtle
    for you to worry about, join the club.


    ![](img/f472724a364323eda9b6dbd5661326f5_144_1.png)


    CHAPTER 6 Using the Building Blocks: Variables, Values, and Types 131'
