  md: 'Then there''s French. In France, there''s a candy bar named "Gift":


    He came for the holidays, and all he gave me a bar of Gift.


    What do the letters g-l-f-t really mean? Well, they don''t mean anything until
    you decide on a way to interpret them. The same is true of the zeros and ones
    inside a computer''s circuitry.


    Take, for example, the sequence 01001010. This sequence can stand for the letter
    J, but it can also stand for the number 74. That same sequence of zeros and ones
    can stand for 1.0369608360036466×10⁻⁴³. And when interpreted as screen pixels,
    the same sequence can represent the dots in Figure 6-6. The meaning of 01001010
    depends entirely on the way the software interprets this sequence.


    ![](img/f472724a364323eda9b6dbd5661326f5_148_0.png)


    # Types and declarations


    How do you tell the computer what 01001010 stands for? The answer is in the concept
    type. The type of a variable describes the kinds of values that the variable is
    permitted to store.


    In Listing 6-1, look at the first line in the body of the main method:


    ```

    double amount;

    ```


    This line is called a variable declaration. Putting this line in your program
    is like saying, "I''m declaring my intention to have a variable named amount in
    my program." This line reserves the name amount for your use in the program.


    In this variable declaration, the word double is a Java keyword. The word double
    tells the computer what kinds of values you intend to store in amount. In particular,
    the word double stands for numbers between -1.8×10³⁸ and 1.8×10³⁸. Thats'
