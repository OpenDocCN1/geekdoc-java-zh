  md: "# # Why bother?\n\nOn the surface, the code in Listing 17-3 is longer, more\
    \ complicated, and harder to read. But think about a big pile of laundry; It may\
    \ take time to find a basket and shovel socks into the basket, but when you have\
    \ clothes in the basket, the clothes are much easier to carry. It's the same way\
    \ with the code in Listing 17-3. When you have your data in a Purchase basket,\
    \ it's much easier to do complicated things with purchases.\n\n# # From Classes\
    \ Come Objects\n\nThe code in Listing 17-2 defines a class. A class is a design\
    \ plan; it describes the way in which you intend to combine and use pieces of\
    \ data. For example, the code in Listing 17-2 announces your intention to combine\
    \ double, int, and boolean values to make new Purchase values.\n\nClasses are\
    \ central to all Java programming. But Java is called an object-oriented language.\
    \ Java isn't called a class-oriented language. In fact, no one uses the term class-oriented\
    \ language. Why not?\n\nWell, you can put your arms around a class. A class isn't\
    \ real. A class without object is like a chair without chocolate. If you're sitting\
    \ in a room right now, glance at all the chairs in the room. How many chairs are\
    \ in the room? Two? Five? Twenty? In a room with five chairs, you have five chair\
