    middleReel and rightReel for a later example.


    +   **In Listing 15-5, the expression Symbol.values() stands for the four values
    in Listing 15.**


    To quote myself from the previous bullet, "in theory, the variable leftReel can
    take on any of the four Symbol values." Well, the RangeOfValues part of the statement
    turns into practice. This third item inside the parentheses says, "Have as many
    loop iterations as there are Symbol values, and have of the leftReel variable
    take on a different Symbol value during each of the loop''s iterations.


    So the loop in Listing 15-5 undergoes four iterations: an iteration in which leftReel
    has value cherry, another iteration in which leftReel has value lemon, a third
    iteration in which leftReel has value kumquat, and a fourth iteration in which
    leftReel has value rutabaga. During each iteration, the program prints the leftReel
    variable''s value. The result is in Figure 15-8.


    ![](img/f472724a364323eda9b6dbd5661326f5_360_0.png)


    In general, a someEnumTypeName.values() expression stands for the set of values
    that a particular enum type''s variable can have. For example, back in Listing
    10-7 in Chapter 10, you can use the expression WhoWins.values() to refer to the
    home, visitor, and neither values.


    > The difference between a type''s name (like Symbol) and the type''s values (as
    Symbol.values()) is really subtle. Fortunately, you don''t have to worry about
    the difference. As a beginning programmer, you can just use the .values() suffix
    in an enhanced loop''s RangeOfValues part.


    # Nesting the enhanced for loops


    Listing 15-5 solves a simple problem in an elegant way. After reading about Listing
    15-5, you may ask about more complicated problems: "Can I list all possible3-reel
    combinations of the slot machine''s four symbols?" Yes, you can. Listing 15-6
    shows you how to do it.'
