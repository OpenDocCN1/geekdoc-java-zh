  md: "In many operating systems (including Windows, Mac OS, and Linux), a single\
    \ stands for the current working directory: the place where a program starts looking\
    \ for files. For a Java program running in Eclipse, this working directory is\
    \ the project's root directory. For example, imagine that the code in Listing\
    \ 16-6 lives in an Eclipse project named 16-06. Then your hard drive contains\
    \ a folder named 16-06, which in turn contains a folder named src; which in turn\
    \ contains the IHateTxtFiles.java file (See Figure 16-8). The program's working\
    \ directory is the 16-06 directory. So, in Listing 16-6, the code\n\n```\nfolder\
    \ = new File(\"\")\n```\n\nmakes folder refer to the directory named 16-06.\n\n\
    ![](img/f472724a364323eda9b6dbd5661326f5_387_0.png)\n\nIf you read the previous\
    \ paragraph, I know what you're thinking. \"The project's root directory, 16-06,\
    \ is a folder, not a file. But the code in Listing 16-6 says folder = new File(\"\
    \").\" Why doesn't the code say folder = new Folder(\"\")? Well, I glad you asked.\
    \ It turns out that most operating systems blur the differences between folders\
    \ and files. For Java's purposes, the document IHateTxtFiles.java is a file, the\
    \ folder named src is also a kind of a file, the folder named 16-06 is also a\
    \ kind of a file.\n\nIn Java, every File object has a listFiles method, and when\
    \ you call listFiles(), you get an array. Each \"value\" stored in the array is\
