    I ran the program several times and got the results shown in the following figure.
    (Actually, I copied the results from Eclipse''s Console view to Windows Notepad.)
    Stare briefly at the figure and notice two trends:


    +   - There''s no obvious way to predict what number comes next.

    - No number occurs more often than any of the others.


    ![](img/f472724a364323eda9b6dbd5661326f5_223_0.png)


    The Java Virtual Machine jumps through hoops to maintain these trends. That''s
    because cranking out numbers in a random fashion is a tricky business. Here are
    some interesting about the process:


    +   - Scientists and nonscientists use the term random number. But in reality,
    there''s no such thing as a single random number. After all, how is random a number?

    - A number is random only when it''s one in a disorderly collection of numbers.
    More precisely, a number is random if the process used to generate the number
    follows the two preceding trends. When they''re being careful, scientists avoid
    the random number use and use the term randomly generated number instead.

    - It''s hard to generate numbers randomly. Computer programs do the best they
    can, but ultimately, today''s computer programs follow a pattern, and that pattern
    Isn''t truly random.'
