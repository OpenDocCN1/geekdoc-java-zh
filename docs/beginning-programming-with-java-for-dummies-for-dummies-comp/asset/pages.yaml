  md: '# Reader, Meet Arrays; Arrays, Meet the Reader


    A weary traveler steps up to the Java Motel''s front desk. “I’d like a room,”
    says the traveler. So the desk clerk runs a report like the one in Figure 16-2.
    Noticing the first vacant room in the list, the clerk suggests Room 2. “I’ll take
    it,” says the traveler.


    It’s so hard to get good help these days. How many times have you told to fill
    the higher-numbered rooms first? The lower-numbered rooms are older, and they
    are badly in need of repair. For example, Room 3 has an indoor pool. (The pipes
    leak, the carpet is soaking wet.) Room 2 has no heat (not in wintertime, anyway).
    Room 1 has serious electrical problems (for that room, you always get payment
    in advance). Besides, Room 8 is vacant, and you charge more for the higher-numbered
    rooms.


    Here’s a subtle change in presentation can make a big difference. You need a program
    that lists vacant rooms in reverse order. That way, Room 8 catches the clerk’s
    eye before Room 2.


    Think about strategies for a program that displays data in reverse. With the output
    from Figure 16-1, the program’s output should look like the display shown in Figure
    16-5.


    ![](img/f472724a364323eda9b6dbd5661326f5_373_0.png)


    ```

    Console

    <terminated> VacanciesIn

    Room 8 is vacant.

    Room 2 is vacant.

    ```


    Here’s the first (bad) idea for a programming strategy:


    ```

    Get the last value in the occupancy file.

    If the value is 0, print the room number.


    Get the next-to-last value in the occupancy file.

    If the value is 0, print the room number.


    ... And so on.

    ```'
