  md: '# GENERATING WORDS RANDOMLY


    Most programs don''t work correctly the first time you run them, and some programs
    don''t work without extensive trial-and-error. This section''s code is a case
    in point.


    To write this section''s code, I needed a way to generate three-letter words randomly.
    After a dozen attempts, I got the code to work. But I didn''t stop there. I kept
    working for a few hours looking for a simple way to generate three-letter words
    randomly. In the end, I followed the code on (Listing 19-3):


    ```

    anAccount.lastName = "" +

    (char)(myRandom.nextInt(26) + ''A'') +

    (char)(myRandom.nextInt(26) + ''a'') +

    (char)(myRandom.nextInt(26) + ''a'');

    ```


    This code isn''t simple, but it''s not nearly as bad as original working version.
    Anyway, here''s how the code works:


    +   * Each call to my Random.nextInt(26) generates a number from 0 to 25.

    * Adding ''A'' gives you a number from 65 to 90.

    * To store a letter ''A'', the computer puts the number 65 in its memory. That''s
    why adding ''A'' to 0 gives you 65 and why adding ''A'' to 25 gives you 90. (For
    more information on letters being stored as numbers, see the discussion of Unicode
    characters at the end of Chapter 8)

    * Applying (char) to a number turns the number into a char value.


    To store the letters ''A'' through ''Z'', the computer puts the numbers 65 through
    90 in its memory. So, applying (char) to a number from 65 to 90 turns the number
    into an uppercase letter. For more information about applying things like (char),
    see the discussion of casting in Chapter 7.


    Pause for a brief summary. The expression (char)(myRandom.nextInt(26) + ''A'')
    represents a randomly generated uppercase letter. In a similar way, (char) (myRandom.nextInt(26)
    + ''a'') represents a randomly generated lowercase letter.


    Watch out! The next couple of steps can be tricky:


    +   * Java doesn''t allow you to assign a char value to a string variable.

    * In Listing 19-3, the following statement would lead to a compiler error:


    ```

    //Bad statement:

    anAccount.lastName = (char) (myRandom.nextInt(26) + ''A'');

    ```


    (continued)


    # CHAPTER 19 Creating New Java Methods 439'
