    In spite of of this silly twoPlusTwo example, the while statement turns out to
    be the most useful of Java''s looping constructs. In particular, the while loop
    is good for situations in which you must look before you leap. For example: "While
    money is in my account, write a mortgage check every month." When you encounter
    this statement, if your account has a zero balance, you don''t want to write a
    mortgage check — not even one check.


    But at times (not many), you want to leap before you loop. In a situation when
    you''re asking the user for a response, maybe the user''s response makes sense,
    maybe it doesn''t. Maybe the user''s finger slipped, or perhaps the user didn''t
    understand the question. In many situations, it''s important to correctly interpret
    the user''s response. If the user''s response doesn''t make sense, you must ask
    again.


    # Getting a trustworthy response


    Consider a program that deletes a file. Before deleting the file, the program
    asks for confirmation. If the user types Y, delete; if the user types N, don''t
    delete. Of course, deleting a file is serious stuff. Mistaking a bad keystroke
    for a "yes" answer can preserve the company''s records. (And mistaking a bad keystroke
    for a "no" can preserve the incriminating evidence.) If there''s any doubt about
    the user''s response, the program should ask the user to respond again.


    Pause a moment to think about the flow of actions — what should and shouldn''t
    happen when the computer executes the loop. A loop of this kind doesn''t need
    to check anything before getting the user''s first response. Indeed, before the
    user gives the first response, the loop has nothing to check. The loop should
    start with "as long as the user''s response is invalid, get another response from
    the user." Instead, the loop should just leap ahead, get a response from the user,
    and then check to whether it made sense. The code to do all of this is in Listing
    15-4.


