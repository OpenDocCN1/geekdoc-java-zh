  md: '# ### FIGURE 6-7: Getting the value of a double variable.


    > > What''s the price of a flash drive? $5.75

    > We will bill $30.75 to your credit card.


    Grouping separators vary from one country to another. The run shown in Figure
    6-7 is for a computer configured in the United States where 5.75 means "five and
    seventy-hundredths." But the run might look different on a computer that''s configured
    in what I call a "comma country" — a country where 5.75 means "five and seventy-hundredths."
    If you live in a comma country and type 5.75 exactly as it''s shown in Figure
    6-7, you probably get an error message (an InputMismatchException). If so, change
    the number amounts in your file to match your country''s number format. When you
    do, you should be.


    ![](img/f472724a364323eda9b6dbd5661326f5_151_0.png)


    # Though these methods, yet there is madness in ''


    Notice the call to the nextDouble method in Listing 6-2. Over Listing 5-1, in
    Chapter 5, you use nextLine; but here in Listing 6-2, I use nextDouble.


    In Java, each type of input requires its own, special method. If you''re getting
    a line of text, then newLine works just fine. But if you''re reading stuff from
    the keyboard and you want that stuff to be interpreted as a number, you need a
    method like nextDouble.


    To go from Listing 6-1 to Listing 6-2, I added an import declaration and statement
    about new Scanner (System.in). You can find out more about these things by reading
    the "Getting numbers, words, and other things" section in Chapter 5. (You can
    find out more about input and output by visiting Chapter 13.) And more examples
    (more keyboard.nextSomething methods) are in Chapters 7 and 8.


    # Methods and assignments


    Note how I use keyboard.nextDouble in Listing 6-2. The call to method nextDouble
    is part of an assignment statement. If you look in Chapter 5 at the section on
    how the EchoLine program works, you see that the computer can substitute in place
    of a method call. The computer does this in Listing 6-2. When you type 5.75 on
    the keyboard, the computer turns


    ```

    amount = keyboard.nextDouble();

    ```


    ```

    amount = 5.75;

    ```


