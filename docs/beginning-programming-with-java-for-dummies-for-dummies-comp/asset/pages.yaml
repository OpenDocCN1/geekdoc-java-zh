  md: '# Here''s the perfect place to start programming!


    If you''re itching to begin programming and creating applications, this book is
    just what the doctor ordered! With clear explanations and step-by-step instructions,
    you''ll quickly learn what it takes to create a program and how the pieces fit
    together. This book includes practice questions and exercises to help reinforce
    your understanding of Java. Before you know it, you''ll be using variables, values,
    and types, and you''ll understand loops, objects, and classes. Start programming
    in Java and creating your own projects right away!


    ![](img/f472724a364323eda9b6dbd5661326f5_561_0.png)


    # Inside...


    +   * Use a development environment

    * Handle numbers and types

    * Master Java building blocks

    * Use loops, branches, and arrays

    * Work with objects and classes

    * Read data from disk files

    * Create a graphical interface


    Barry Burd, PhD, has been a professor in the Department of Mathematics and Computer
    Science at Drew University since 1980. He has lectured at conferences in the United
    States, Europe, Australia, and Asia, and hosts podcasts on various software and
    technology topics. Dr. Burd also authored Java Programming for Android Developers
    For Dummies.


    Visit the companion website at www.dummies.com/extras/beginningprogrammingwithjava/


    Go to Dummies.com® for videos, step-by-step examples, how-to articles, or to shop!


    ![](img/f472724a364323eda9b6dbd5661326f5_561_1.png)


    ![](img/f472724a364323eda9b6dbd5661326f5_561_2.png)


    ![](img/f472724a364323eda9b6dbd5661326f5_561_3.png)'
