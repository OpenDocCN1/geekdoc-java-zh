  md: 'When you launch your new copy of Eclipse, the program prompts you for a place
    on your hard drive for your workspace (the place on your hard drive where this
    session''s Eclipse projects live). At this point, you have a choice:


    +   You can have two different folders for two different workspaces — one workspace
    for your original copy of Eclipse and a second workspace for your new copy of
    Eclipse.


    Doing so keeps your original work (for preceding chapters) separate from this
    chapter''s work. Also, with two different workspaces, you can run both copies
    of Eclipse simultaneously.


    +   Alternatively, you can point both versions of Eclipse to the same folder (and
    thus, to the same workspace).


    Doing so keeps all your work in one place. You don''t have to work-spaces in order
    to change from your original work to this chapter''s work. On the minus side,
    you can''t run two copies of Eclipse using the same workspace simultaneously.


    Don''t fret over the decision you make about Eclipse workspaces. In any copy of
    Eclipse, you can switch from one workspace to another. You can decide on a particular
    workspace whenever you launch Eclipse. You can also move from one workspace to
    another by selecting File ↮ Switch Workspace on Eclipse''s main menu.


