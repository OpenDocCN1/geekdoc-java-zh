    # COPY TEXT TO A TEXT FIELD


    Use e(fx)clipse and Scene Builder to create a frame with a button and two text
    fields. When the user clicks the button, Java copies text from the first text
    field to the second text field.


    *Hint:* You can create both text fields with one declaration:


    ```

    @FXML

    private TextField textField, textField2;

    ```


    # COPY BETWEEN TEXT FIELDS


    Use e(fx)clipse and Scene Builder to create a frame with two buttons and two text
    fields. When the user clicks the first button, Java copies text from the first
    text field to the second text field. When the user clicks the second button, Java
    copies text from the second text field to the first text field.'
