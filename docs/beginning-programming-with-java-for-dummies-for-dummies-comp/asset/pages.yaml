    The numbering of Java''s versions is really confusing. First comes Java 1.0, and
    then Java 1.1, and Java 2 Standard Edition 1.2 (J2SE 1.2), the "Java 2" overlaps
    partially with the "1.x" number. Next comes versions 1.3 and 4. After version
