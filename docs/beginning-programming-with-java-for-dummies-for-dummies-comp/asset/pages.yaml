  md: '# No early bailout


    In Listing 12-1, when the computer finds die1 + die2 != 7 && die1 + die2 != 11

    to be true, the computer marches on and executes all five statements inside

    tloop''s curly braces. The computer executes


    ```

    die1 = myRandom.nextInt(6) + 1;

    die2 = myRandom.nextInt(6) + 1;

    ```


    # STATEMENTS AND BLOCKS (PLAGARIZING

    MY OWN SENTENCES FROM CHAPTER 9)


    Java''s while statements have a lot in common with statements. Like an if state-

    ment, a statement is a compound statement — that is, a while statement

    includes other statements within it. Also, if both statements and while statements

    typically include blocks of statements. When you surround a bunch of statements
    with

    curly braces, you get what''s called a block, and a block behaves, in all respects,
    like a

    single statement.


    In a typical while statement, you want the computer to repeat several smaller
    state-

    ments over and again. To repeat several smaller statements, you combine these

    statements into one big statement. To do this, you make a block using curly braces.


    In Listing 12-1, the block


    ```

    {

    die1=myRandom.nextInt(6)+1;

    die2=myRandom.nextInt(6)+1;


    out.print(die1);

    out.print(" ");

    out.println(die2);

    }

    ```


    is a single statement. It''s a statement that has, within it, five smaller statements.
    So this

    big block (this single statement) serves as one big statement inside the while
    statement

    in Listing 12-1.


    That''s the story about while statements and blocks. Find out how this stuff applies

    to if statements, see the "Statements and blocks" sidebar near the end of Chapter
    9.'
