    # HOW MANY BITS DOES YOUR COMPUTER HAVE?


    As you follow this chapter''s instructions, you may be prompted to choose between
    two versions of a piece of software — the 32-bit version and the 64-bit version.
    What''s the difference, and why should you care?


    A bit is the smallest piece of information that you can store on a computer. Most
    people think of a bit as either a zero or a one, and that depiction of "bit" is
    quite useful. To represent any number, you pile several bits next to one another
    and do some fancy things with powers of two. The numbering system''s details aren''t
    showoppers. The important thing to remember is that each piece of circuitry inside
    your computer stores the same number of bits. (Well, some circuits inside your
    computer are outliers with their own particular numbers of bits, but that''s not
    a deal.)


    In an older computer, each piece of circuitry stores 32 bits. In a newer computer,
    each piece of circuitry stores 64 bits. This number of bits (either 32 or 64)
    is the computer''s word length. In a newer computer, a word is 64 bits long.


    "Great!" you say. I bought my computer last week, it must be a 64-bit computer."
    Well, the story may not be that simple. In addition to your computer''s circuitry
    having a word length, the operating system on your computer also has a word length.
    An operating system''s instructions work with a particular number of bits. An
    operating system with 32-bit instructions can run on either a 32-bit computer
    or a 64-bit computer, but an operating system with 64-bit instructions can run
    only on a 64-bit computer. And to make things even more complicated, each program
    that you run (a web browser, a word processor, or one of your Java programs) is
    either a 32-bit program or a 64-bit program. You may run a 32-bit web browser
    on a 64-bit operating system running on a 64-bit computer. Alternatively, you
    may run a 32-bit browser on a 32-bit operating system on a 64-bit computer. (See
    the figure that accompanies this sidebar.)


    ![](img/f472724a364323eda9b6dbd5661326f5_45_0.png)'
