  md: "# STATEMENTS AND BLOCKS\n\nAn elegant way to think about if statements is to\
    \ realize that you can put only one statement inside each clause of an if statement:\n\
    \n```\nif (Condition)\n    aStatement\nelse\n    anotherStatement\n```\n\nOn your\
    \ first reading of this 1-statement rule, you're probably thinking that there's\
    \ a misprint. After all, in Listing 9-4, each clause (the if clause and the else\
    \ clause) seems to contain four statements, not just one.\n\nBut technically,\
    \ the if clause in Listing 9-4 has only one statement, and the else clause in\
    \ Listing 9-4 has only one statement. The trick is, when you surround a bunch\
    \ of statements with curly braces, you've got called a block, and a block behaves,\
    \ in all respects, like a single statement. In official Java documentation lists\
    \ a block as a kind of statement. So, in Listing 9-4, the block\n\n```\n{\n  \
    \  out.print(\"Hankees: \");\n    out.println(hankees);\n    out.print(\"Socks:\
    \ \");\n    out.println(socks);\n}\n```\n\nA single statement. It's a statement\
    \ that has four smaller statements within it. So this big block, this single statement,\
    \ serves as the one and only statement inside the if clause in Listing 9-4.\n\n\
    That's how the 1-statement rule works. In an if statement, when you want the computer\
    \ to execute several statements, you combine those statements into one big statement.\
    \ To do this, you make a block using curly braces.\n\nOf course, computers don't\
    \ work that way. If you want a computer to “know” what out.print means, you have\
    \ to code that knowledge somewhere inside the Java compiler.\n\nFortunately for\
    \ me, the ability to abbreviate things like System.out is available from Java\
    \ 5.0 onward. (An older Java compiler still chokes on the code in Listing 9-4.)\
    \ This ability to abbreviate things is called static import. It's illustrated\
    \ in the second and third lines of Listing 9-4.\n\nCHAPTER 9 Forks in the Road\
    \ 217"
