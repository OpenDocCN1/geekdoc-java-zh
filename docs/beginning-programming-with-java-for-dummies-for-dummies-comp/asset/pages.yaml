  md: 'Eclipse has a built-in feature for creating and inserting code templates. To
    get started using Eclipse templates, choose Window-Preferences (in Windows) or
    Eclipse-Preferences (on a Mac). In the resulting Preferences dialog box, choose
    Java-Editor Templates. Creating new templates isn''t simple. But if you poke around
    a bit, you accomplish a lot.


    If your program gets input from one disk file and writes output to another, combine
    the stuff from Listings 13-3 and 13-4. When you do, you get a program like the
    one in Listing 13-2.


    # A QUICK LOOK AT JAVA''S DISK ACCESS FACILITIES


    Templates like the ones in Listings 13-3 and 13-4 look very nice. But knowing
    how the templates work is even better. Here are a few tidbits describing the inner
    workings of Java''s disk access code:


    +   * A PrintStream is something you can use for writing output.


    A PrintStream is like a Scanner. The big difference is that a Scanner is for reading-input
    and a PrintStream is for writing output. To see what I mean, look at Listing 13-2.
    Notice the similarity between the statements that use Scanner and the statements
    that use PrintStream.


    The word PrintStream is defined in the Java API.


    +   * In Listing 13-2, the expression new File("rawData.txt") plays the same role
    as System.in plays many other programs.


    Just as System.in stands for the computer''s keyboard, new File("rawData.txt")
    stands for a file on your computer''s hard drive. When the computer calls new
    File("rawData.txt"), the computer creates something like System.in—something you
    can stuff inside the new Scanner ( ) parentheses.


    The word File is defined in the Java API.


    +   * A FileNotFoundException is something that may go wrong during an attempt
    to read input from a disk file (or an attempt to write output to a disk file).


    Disk access is loaded with pitfalls. Even the best programs run into access trouble
    occasionally. To brace against such pitfalls, java insists on your adding some
    extra words to your code.


    ![](img/f472724a364323eda9b6dbd5661326f5_307_0.png)'
  merge: -1
  pgno: 307
- img_proc: true
  md: 'In Listing 13-2, the added words throws FileNotFoundException form a throws
    clause. A throws clause is a kind of disclaimer. Putting a throws clause in your
    code is like saying, "I realize that this code can run into trouble."


    Of course, in the legal realm, you often have no choice about signing disclaimers.
    "If you don''t sign this disclaimer, the surgeon won''t operate on you." Okay
    then, I''ll sign it. The same is true with Java throws clause. If you put things
    like new PrintStream("coded.txt") in your code and don''t add anything like throws
    FileNotFoundException, the java compiler refuses to compile your code.


    So when we do this throws FileNotFoundException clause, and when should you do
    it without? Well, having certain things in your code — like new PrintStream("codedData.txt")
    — forces you to create a throws demand clause. You can spend some time learning
    about all the kinds of things that demand clauses. At this point, it''s better
    to concentrate on other programming issues. Because you''re a beginning Java programmer,
    the safest thing to do is to follow the templates in Listings 13-3 and 13-4.


    The word FileNotFound is — you guessed — defined in the Java API.


    +   * To create this chapter''s code, I made up the names diskScanner and diskWriter.


    The words diskScanner and diskWriter don''t come from the Java API. In place of
    diskScanner and diskWriter, you can use any names you want. All you have to do
    is to use the names consistently within each of your Java programs.


    +   * A call to the close method ends the connection between your program and
    the file.


    In many of this book''s examples, you sever the connection between your program
    and the computer keyboard by calling keyboard.close(). The same is true when you
    call the close method for a disk scanner or a disk file''s PrintStream instance.
    Calling the close method reminds Java to finish all pending read or write operations
    and to break the program''s connection to the disk file, the keyboard, or to whatever
    else holds data for the program.


    This book''s examples are pretty simple. If you omit a close method call in one
    of these examples, you might get a warning message from Eclipse, but the world
    doesn''t end. (That is, your program runs correctly). However, in a serious, make-it-or-break
    application, the proper placement of close calls is important. These close calls
    ensure the proper completion of the program''s input and actions help free up
    disk resources for use by other running programs.'
