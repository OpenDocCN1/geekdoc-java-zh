    # AN APOLOGY OF SORTS (ALONG WITH AN EXCUSE!)


    As far as most professional programmers are concerned, the code in Listings 17-2
    and 17-3 is quite simple. In fact, it''s too simple. Java programmers don''t like
    expressions such as purchase.unitPrice, and they hate declarations such as double
    totalPrice. Instead, they prefer private double totalPrice along with expressions
    such as purchase.getUnitPrice(). These programmers will tell you "the code in
    Burd''s examples isn''t safe," "Burd''s examples promote bad programming practices,"
    and "In the summertime, Burd wears colors that don''t match." In fact, these programmers
    are absolutely correct.


    But in my opinion, you learn to walk before you learn to run. Classes and objects
    are difficult concepts, so I present them in as simple a form as I possibly can.
    Object-oriented programming is an art as well as a science. It''s a way of thinking
    — a way whose mastery requires time and patience. I have students at the university
    (some very good students) who spend months wrestling with the fundamentals of
    classes and objects.


    In this book, I don''t present the most-honored, expert-approved way of dealing
    with classes and objects. Instead, I follow the simplest path to help you get
    classes and objects into your consciousness. You can learn the better way of doing
    things after you''ve become comfortable dividing problems in their object-oriented
    parts.


    And besides, for all the nasty things someone might say about this chapter''s
    simple examples, the examples aren''t fake. They run, they produce output, and
    they illustrate the separating of a class from the main program''s code. At the
    core, that''s what object-oriented programming is all about.


    So there!'
