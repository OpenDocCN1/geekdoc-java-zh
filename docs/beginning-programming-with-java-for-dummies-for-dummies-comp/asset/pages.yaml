  md: '# Chapter 19


    # Creating New Java Methods


    In Chapters 3 and 4, I introduce Java methods. I show you how to create a main
    method and how to call the System.out.println method. Between that and this one,
    I make very little noise about methods. In Chapter 18, I introduce a bunch of
    new methods for you to call, but that''s only half of the story.


    This chapter completes the circle. In this chapter, you create your own Java methods
    — not the tired old method that you''ve been using all along, but rather some
    new, powerful Java methods.


    # Defining a Method within a Class


    In Chapter 18, Figure 18-6 introduces an interesting notion — a notion''s at the
    core of object-oriented programming. Each Java string has its own equals method.
    That is, each string has, built within it, the functionality to compare itself
    to other strings. That''s an important point. When you do object-oriented programming,
    you bundle data and functionality into a lump called a class. Just remember Barry''s
    immortal words from Chapter 17:


    > A class ... describes the way in which you intend to combine and use pieces
    of data.'
  merge: -1
  pgno: 444
- img_proc: true
  md: 'And why are these words so important? They''re important because, object-oriented
    programming, chunks of data take responsibility for themselves. With object-oriented
    programming, everything you have to know about a string is located in the file
    String.java. So, if people have problems with the strings, they know just where
    to look for all the code. That''s great!


    This is the deal: Objects contain methods. Chapter 18 shows you how to use an
    object''s methods, and this chapter shows you how to *create* an object''s methods.


    # Making a method


    Imagine a table containing the information about three accounts. (If you have
    trouble imagining such a thing, just look at Figure 19-1.) In the figure, each
    account has a last name, an identification number, and a balance. In addition
    (and here''s the important part), each account knows how to display itself on
    the screen. Each row of the table has its own copy of a display method.


    ![](img/f472724a364323eda9b6dbd5661326f5_445_0.png)


    | lastName | Id | balance | display |

    |---|---|---||}{

    | Aju | 9936 | $8,734.00 | (method to display account info) |

    | Iap | 3492 | $6,718.00 | (method to display account info) |

    | Ngp | 2151 | $1,008.00 | (method to display account info) |


    The last names in Figure 19-1 may seem strange to you. That''s because I generated
    the table''s data randomly. Each name is a haphazard combination of three letters:
    one uppercase letter followed by two lowercase letters.


    > Though it might seem strange, generating account values at random is common
    practice. When you write new code, you want to test the code to find out whether
    it runs correctly. You can make up your own data (with values like "Smith", 0000,
    and 1000.0). But to give your code a challenging workout, you should use some
    unexpected values. If you have values from real-life case studies, you should
    use them. But if you don''t have real data, randomly generated values are easy
    to create.


    To find out how I randomly generate three-letter names, see this chapter''s "Generating
    words randomly" sidebar.


    I need some code to implement the ideas in Figure 19-1. Fortunately, I have some
    code in Listing 19-1.'
