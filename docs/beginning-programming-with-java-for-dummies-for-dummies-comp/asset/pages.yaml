  md: 'Values true and false may look as though they contain characters, but they
    really don''t. Internally, the Java Virtual Machine doesn''t store boolean values
    with the letters t-r-u-e or f-a-l-s-e. Instead, the JVM stores codes, like o for
    false and one for true. When the computer displays a boolean value (as in System.out.println(eachKidGetsTen)),
    the Java Virtual Machine converts a code o into the five-letter word false.


    # Comparing numbers; comparing characters


    In Listing 8-4, I compare a variable''s value with the number 10. I use the >=
    in the expression


    ```

    gumballsPerKid >= 10

    ```


    Of course, the greater-than-or-equal-to comparison gets you only so far. Table
    8-1 shows the operators you can use to compare things with one


    Table 8-1 Comparison Operators

    | Operator Symbol | Meaning | Example |

    |---|---|---|

