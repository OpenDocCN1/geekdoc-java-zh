  md: '# Understanding the Big Picture


    In this section, I answer some of the burning questions that I raise throughout
    this book: "What does java.util stand for? "Why do I need the word static at certain
    points in the code? "How can a degree in Horticultural Studies help you sort canceled
    checks?",


    I also explain "static" in some unique and interesting ways. After all, static
    fields and methods aren''t easy to understand. It helps to read about Java''s
    static feature from several points of view.


    # Packages and import declarations


    In Java, you can group a bunch of classes into something called a package. In
    fact, the classes in Java''s standard API are divided into about 200 packages.
    This book''s examples make heavy use of three packages: the packages named java.util,
    java.lang, and java.io.


    # The class java.util.Scanner


    The package java.util contains about 75 classes, including the very useful Scanner
    class. Like most other classes, this Scanner class has two names: a fully qualified
    name and an abbreviated simple name. The class''s fully qualified name is java.util.Scanner,
    and the class''s simple name is Scanner. You get the fully qualified name by adding
    the package name to the class''s simple name. (That is, you add the package name
    java.util to the simple name Scanner. You get java.Scanner.)


    An import declaration lets you abbreviate a class''s name. With the declaration


    ```

    import java.util.Scanner;

    ```


    the Java compiler figures out where to look for the Scanner class. Instead of
    writing java.util.Scanner throughout your code, you can just write Scanner.


    # The class java.lang.System


    The package java.lang contains about 35 classes, including the ever-popular System
    class. (The class''s fully qualified name is java.lang.System, and the class''s
    simple name is System.) Instead of writing java.lang.System throughout your code,
    you can just write System. You don''t even need an import declaration.'
