  md: '# Creating New Values by nApplying Operators


    What could be more comforting than your old friend, the plus sign? It was the
    first thing you learned about in elementary school math. Almost everybody knows
    how to add two and two. In fact, in English usage, adding two and two is a metaphor
    for something that''s so easy to do. Whenever you see a plus sign, one of your
    brain cells says, "Thank goodness, it could be something much complicated."


    So Java has a plus sign. You can use the plus sign to add two numbers:


    ```

    int apples, oranges, fruit;

    apples = 5;

    oranges = 16;

    fruit = apples + oranges;

    ```


    Of course, the old minus sign is available, too:


    ```

    apples = fruit - oranges;

    ```


    Use an asterisk for multiplication and a forward slash for division:


    ```

    double rate, pay, withholding;

    int hours;


    rate = 6.25;

    hours = 35;

    pay = rate * hours;

    withholding = pay / 3.0;

    ```


    When you divide an int value by another int value, you get an int value. The computer
    doesn''t round. Instead, the computer chops off any remainder. If you put System.out.println(11
    / 4) in your program, the computer prints 2, not 2.75. If you need a decimal answer,
    make either (or both) of the numbers you''re dividing double values. For example,
    if you put System.out.println(11.0 / 4) in your program, the computer divides
    value 11.0, by an int value, 4. Because at least one of the two values is double,
    the computer prints 2.75.


    # Finding a remainder


    There''s a useful arithmetic operator called the remainder operator. The symbol
    for the remainder operator is the percent (%). When you put System.out.println(11
    % 4) in your program, the computer prints 3. It does so because 4 goes into 11
    who-cares-how-many-times, with a remainder of 3.


    156 PART 2 Writing Your Own Java Programs'
