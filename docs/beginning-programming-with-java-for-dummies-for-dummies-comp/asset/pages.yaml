  md: '# The Java Swing Classes


    Java''s Swing classes create graphical objects on a computer screen. The objects
    can include buttons, icons, text fields, check boxes, and other good things that
    make windows so useful.


    The name Swing isn''t an acronym. When the stewards of the Java programming language
    were first creating the code for these classes, one of the developers named it
    Swing because swing music was enjoying a nostalgic revival. And yes, in addition
    to String and Swing, the standard Java API has a Spring class and a Spring Framework.
    But that''s another story.


    Actually, Java''s API has several sets of windowing components. For details, see
    the nearby “Java GUIs” sidebar.


    # JAVA GUIS


    Java comes with three sets of classes for creating GUI applications:


    +   - The Abstract Window Toolkit (AWT): The original set of classes, dating back
    to JDK 1.0.


    Classes in this set belong to packages whose names begin with java.awt. Components
    in this set have names like Button, TextField, Frame, and so on.


    Each component in an AWT program has a peer — a component that belongs to the
    computer''s own operating system. For example, when you create an AWT Button,
    a Mac computer creates its own kind of button to be displayed on the user''s screen.
    When the same program runs on a Windows computer, the Windows computer creates
    a different kind of button (a Windows button) to display on the computer''s screen.
    The code in AWT interacts with the Mac or Windows computer, adding additional
    functionality that is needed.


    The AWT implements only the kinds of components that were available on all operating
    systems in the mid-1990s. So, using AWT, you can add a button to your application,
    but you can''t easily add a table or a tree.


    +   - Java Swing: A set of classes created to fix some of the difficulties posed
    by the AWT. Swing was introduced in J2SE1.2.


    Classes in this set belong to packages whose names begin with javax. Components
    in this set have names like JButton, JTextField, JFrame, and so on.


    Unlike an old AWT component, a Swing component has no peer. When you create a
    JButton in your program, the computer''s operating system doesn''t create'
