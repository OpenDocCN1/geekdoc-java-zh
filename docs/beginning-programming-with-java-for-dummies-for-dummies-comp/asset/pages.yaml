    # Not enough punctuation


    In English and Java, using the; proper! punctuation is important


    Take, if for example, the semicolons in Listing 5-1. What happens if you forget
    to type a semicolon?


    ```

    //The following code is incorrect:


    System.out.println(keyboard.nextLine());


    keyboard.close();

    ```


    If you leave off the semicolon, you see the message shown in Figure 5-7.


    ![](img/f472724a364323eda9b6dbd5661326f5_130_0.png)


    A message like the one in Figure 5-7 makes your life much simpler. I don''t have
    to explain the message, and you don''t have to puzzle over the message''s meaning.
    Just take the message insert ";" to complete Statement at its face value. Insert
    the semicolon between the end of the System.out.println(keyboard.nextLine()) statement
    and whatever code comes after the statement. (For code that''s easier to read
    and understand, tack on the semicolon at the end of the System.out.println(keyboard.nextLine())
    statement).


    # Too much punctuation


    In junior high school, my English teacher said I should use a comma whenever I
    would normally pause for a breath. This advice doesn''t work well during allergy
    season, when my sentences have more commas than words. Even as a paid author,
    I have tried deciding where the commas should go, so I often add extra commas
    for good measure. This makes more work for my copy editor, Becky, who has a trash
    can full of commas by the desk in her office.'
