  md: '# Indenting statements in your code


    To generate numbers in a truly random fashion, you need a big tub of ping-pong
    balls, like the kind they use in state lottery drawings. The problem is, computers
    don''t come with big tubs of ping-pong balls among their peripherals. So, strictly
    speaking, the numbers generated by Java''s Random class aren''t random. Instead,
    scientists will call these numbers pseudorandom.


    +   - It surprises all well, but knowing one randomly generated value is of no
    help in indenting the next randomly generated value.


    For example, if you toss a coin flip, and get heads both times, you are more likely
    to get tails on the third flip? No. It''s still 50-50.


    If you have three sons, and you''re expecting a fourth child, the fourth child
    more likely to be a girl? No. A child''s gender has nothing to do with the gender
    of the older children. (I''m ignoring any biological effects, which I know absolutely
    nothing. Wait! I do know some biological trivia: A newborn child is more likely
    to be a boy than a girl. For every 21 newborn boys, there are only 20 newborn
    girls. Boys are weaker, so we do die off faster. That''s why nature makes more
    of us at)


    Notice how, in Listing 9-2, the println calls inside the if statement are indented.
    Strictly speaking, you don''t have to indent the statements that are inside an
    statement. For all the compiler cares, you can write your whole program on a single
    line or place all your statements in an artful, misshapen zigzag. The problem
    is, if you don''t indent your statements in logical fashion, neither will anyone
    else can make sense of your code. In Listing 9-2, the indenting of these statements
    are subordinate to the overall if/else flow.


    In a small program, unindented or poorly indented code is barely tolerable. But
    in a complicated program, indentation that doesn''t follow a neat, logical pattern
    is a big, ugly nightmare.


    Always indent your code to make the program''s flow apparent at a glance.


    You don''t have to think about indenting your code, because Eclipse can indent
    your code automatically. For details, see Chapter 4.


    ![](img/f472724a364323eda9b6dbd5661326f5_224_0.png)'
