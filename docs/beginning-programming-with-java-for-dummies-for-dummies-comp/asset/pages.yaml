  md: '# Part 5: The Part of Tens


    The Part of Tens is a little beginning-programmer''s candy store. In The Part
    of Tens, you can find lists — lists of tips; resources, and all kinds of interesting
    goods.


    I added an article at www.dummies.com to help you feel comfortable with Java''s
    documentation (www.dummies.com/programming/java/making-sense-of-java-api-documentation,
    to be precise). I can''t write programs without my Java programming documentation.
    In fact, no Java programmer can write programs without those all-important docs.
    These docs are in web page format, so they''re easy to find and easy to navigate.
    But if you''re not used to all the terminology, the documentation can be overwhelming.


    # Icons Used in This Book


    If you could watch me write this book, you''d see me sitting at my computer, talking
    to myself. When I write each sentence in my head. When I have an extra thought,
    I say a comment, or something that doesn''t belong in the regular stream, I twist
    my head a little bit. That way, whoever''s listening to me (usually nobody) knows
    I''m off on a momentary tangent.


    Of course, in print, you can''t see me twisting my head. I need some other way
    of setting a thought in a corner by itself. I do it with icons. When you see a
    Tip icon or a Remember icon, you know that I''m taking a quick detour.


    Here''s a list of icons that I use in this book:


    +   A tip is an extra piece of information — something helpful that the other
    books may forget to tell you.


    +   Everyone makes mistakes. Heaven knows I''ve made a few in my time. Anyway,
    when I think of a mistake that people are especially prone to make, I write about
    the mistake in a Warning icon.


    +   Sometimes I want to hire a skywriting airplane crew. "Barry," says the white
    smoky cloud, "if you want to compare two numbers, use the double sign. Please
    don''t forget to do this." Because I can''t afford skywriting, I have to settle
    for something more modest. I create a Remember icon.'
