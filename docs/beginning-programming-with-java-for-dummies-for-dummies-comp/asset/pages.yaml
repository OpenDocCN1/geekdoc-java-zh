  md: '# # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect... well, buy the book anyway.


    +   > **I assume that you have access to a computer.** Here''s good news. You
    can run the code in this book on almost any computer. The only computers you can''t
    use to run this code are ancient things that are more than eight years old (give
    or take a few years). You can run the latest version of Java on Windows, Macintosh,
    and Linux computers.


    +   > **I assume that you can navigate your computer''s common menus and dialog
    boxes.** You don''t have to be a Windows, Linux, or Macintosh user, but you should
    be able to start a program, find a file, put a file into a certain directory —
    that sort of thing. Most of the time, when you practice the stuff in this book,
    you''re typing code on your keyboard, not pointing and clicking the mouse.


    On those rare occasions when you need to drag and drop, cut and paste, or plug
    and play, I guide you carefully through the steps. Your computer may be configured
    in one of several billion ways, and my instructions may not quite fit your special
    situation. So when you reach one of these platform-specific tasks, try following
    the steps in this book. If the steps don''t quite fit, send me an email message
    or consult the book with instructions tailored to your system.


    +   > **I assume that you can think logically.** That''s all there is to computer
    programming — thinking logically. If, if you can think logically, you''ve got
    it made. If you don''t believe that you can think logically, read on. You may
    be pleasantly surprised.


    +   > **I assume that you know little or nothing about computer programming.**
    This isn''t one of those "all things to all people" books. I don''t please the
    novice while I tease the expert. I aim this book specifically towards the novice
    — the person who has never programmed a computer or has never felt comfortable
    programming a computer. If you''re one of these people, you''re reading the right
    book.


    # # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are lumped finally into five parts. (When
    you write a book, you get to know your book''s structure pretty well. After months'
