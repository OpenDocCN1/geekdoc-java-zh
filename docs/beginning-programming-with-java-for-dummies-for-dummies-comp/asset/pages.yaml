    # Repeating Statements a Certain Number of Times (Java for Statements)


    Life is filled with examples of counting loops. And computer programming mirrors
    life (... or is it the other way around?). When you tell the computer to print
    three lines, process ten accounts, dial a million phone numbers, or whatever.
    You''re off. Because counting loops are common in programming, the people who
    create programming languages have developed statements for loops of this kind.
    In Java, the statement that repeats something certain number of times is called
    a for statement. An example of a for statement is in Listing 15-1.


    LISTING 15-1: Horace Fletcher''s Revenge


    ```

    import static java.lang.System.out;


    class AuntEdnaSettlesForTen {


    public static void main(String[] args[]) {


    for (int count = 0; count < 10; count++) {

    out.print("I''ve chewed ");

    out.print(count);

    out.println(" time(s).");

    }


    out.println("10 times \u211 Hooray!");

    out.println("I can swallow!");


    }

    }

    ```'
