  md: 'Figure 15-1 shows what you get when you run the program in Listing 15-1:


    +   * The for statement in Listing 15-1 starts by setting the count variable equal
    to 0.

    * The for statement tests to make sure that count is less than 10 (which it certainly
    is).

    * The for statement dives ahead and executes the printing statements between the
    curly braces. At this early stage of the game, the computer prints I''ve chewed
    0 time(s).

    * The for statement executes count++ -- that last inside for the parentheses.
    This last action adds 1 to the value of count.


    ![](img/f472724a364323eda9b6dbd5661326f5_340_0.png)


    Figure 15-1 Chewing times.


    This ends the first iteration of the for statement in Listing 15-1. Of course,
    the loop has to more than just one iteration:


    +   * With count equal to 1, for the statement checks again to make sure that
    count is less than 10. (Yes, 1 is smaller than 10).

    * Because the test turns out okay, the for statement marches back into the curly-braced
    statements and prints I''ve chewed 1 time(s) on the screen.

    * The for statement executes that count++ inside its parentheses. The statement
    adds 1 to the value of count, increasing the value of count to 2.


    And so on. This whole thing keeps repeating over and over again, until ten iterations,
    the value of count finally reaches 10. When this happens, the check for count
    being less than 10 fails, and the loop''s execution ends. The computer jumps to
    whatever statement comes immediately after the for statement. In Listing 15-1,
    the computer prints 10 times! Hooray! I can swallow! The whole process is illustrated
    in Figure 15-2.'
