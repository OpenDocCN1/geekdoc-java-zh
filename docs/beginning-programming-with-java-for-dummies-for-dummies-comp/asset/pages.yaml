  md: '(continued)


    +   In Java, you can use a plus sign to add a char value to a string. When you
    do, the result is a string:


    So, "" + (char) (myRandom.nextInt(26) + ''A'') is a string containing

    andomly generated uppercase character. And when you add (char)

    myRandom.nextInt(26) + ''a'' to the end of that string, you get another

    string — containing two randomly generated characters. Finally, when you

    add another (char) (myRandom.nextInt(26) + ''a'') to the end of that string,

    you get a string containing three randomly generated characters. You can assign

    that big string to anAccount.lastName. That''s the statement in Listing 19-3

    words.


    When you write a program like the one in Listing 19-3, you have be careful with

    numbers, char values, and strings. I do not think this kind of programming every
    day of the

    week — before I got this section''s example to work, I had many false starts.
    That''s okay.

    I''m very persistent.


    Onto the empty string and the uppercase letter, the program concatenates a third

    thing. This third thing is the value of the expression (char) (myRandom.

    ext(26) + ''a''). This expression represents a lowercase letter (any lower-

    letter, generated randomly.)


    Onto all this stuff, the program concatenates another lowercase letter. So also-

    ther, you have a randomly generated three-letter name. For more details, see

    The upcoming sidebar.


    In Listing 19-3, the statement anAccount.balance = myRandom.nextInt(10000)

    s an int value to balance. But balance is a double variable, not an int

    variable. That''s okay. In a rare case of permissiveness, Java allows you to assign

    an int value to a double variable. The result of the assignment is no big surprise.

    If you assign the int value 8734 to the double variable balance, the value of

    balance becomes 8734.00. The result is shown on the first line of Figure 19-3.


    ![](img/f472724a364323eda9b6dbd5661326f5_453_0.png)


    Using the double type to store an amount of money is generally a bad idea. In
    this

    book, I use double to keep the examples as simple as possible. But the int type
    is

    better for money values, and the BigDecimal type is even better. For more details,

    see Chapter 7.


