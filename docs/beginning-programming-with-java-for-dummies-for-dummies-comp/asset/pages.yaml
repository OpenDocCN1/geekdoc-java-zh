    # # Your Programming Toolset


    To write Java programs, you need the tools described previously in this chapter:


    +   - You need a Java compiler. (Refer to the section "Translating your code.")

    - You need a JVM. (Refer to the section "Running code.")

    - You need the Java API. (Refer to the section "Code you can use.")

    - You need access to the Java API documentation. (Again, refer to the "Code you
    can use section.")


    You also need some less exotic tools:


    +   **You need an editor to compose your Java programs.** Listing 1-1 contains
    part of a computer program. When you come right down to it, a computer program
    is a big bunch of text. So, to write a computer program, you need an *editor*
    — a tool for creating text documents.


    An editor is lot like Microsoft Word, or like any other word processing program.
    The big difference is that an editor adds nothing to formatting your text — no
    bold, italic, or distinctions among fonts. Computer programs have no formatting
    whatsoever except plain old letters, numbers, and other familiar keyboard characters.


    > REMEMBER

    When you edit a program, you may see bold, italic text, and text in several colors.
    But your program contains none of these. If you see that text looks like formatting,
    it''s the editor that you''re using does syntax highlighting. With syntax highlighting,
    an editor makes the text appear to be formatted in order to help you understand
    the structure of your program. Believe me, syntax highlighting is very helpful.


    +   **You need a way to issue commands.** You need a way to say things like "compile
    this program" and "run the JVM." Every computer provides ways of issuing commands.
    (You can double-click icons or type verbose commands in a Run dialog box.) But
    when you use your computer''s facilities, you jump from one window to another.
    You open one window to read Java documentation, another to edit a java program,
    and a third window to start up the Java compiler. The process can be tedious.


