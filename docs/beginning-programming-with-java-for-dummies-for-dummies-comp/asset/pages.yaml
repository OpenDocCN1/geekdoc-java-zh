  md: "You don't really need to put a break at the very end of a switch statement.\
    \ Listing 11-1, the last break (the break that's part of the default clause) is\
    \ just for the sake of overall tidiness.\n\n# Picky details about the switch statement\n\
    \nA switch statement can take the following form:\n\n```\nswitch (Expression)\
    \ {\n  case FirstValue:\n    Statements\n\n  case SecondValue:\n    MoreStatements\n\
    \n  // ... more cases ...\n\n  default:\n    EvenMoreStatements\n}\n```\n\nHere\
    \ are some tidbits about switch statements:\n\n> The Expression doesn't have to\
    \ have an int value. It can be char, byte, short, or int.\n\nFor example, the\
    \ following code works in Java 5 and later:\n\n```\nchar letterGrade;\nletterGrade\
    \ = keyboard.findWithinHorizon(\".\", 0).charAt(0);\n\nwitch (letterGrade) {\n\
    \  case 'A':\n    System.out.println(\"Excellent\");\n    break;\n\n  case 'B':\n\
    \    System.out.println(\"Good\");\n    break;\n\n  case 'C':\n    System.out.println(\"\
    Average\");\n    break;\n}\n```"
