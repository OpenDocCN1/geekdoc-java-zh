  md: '# WHO DOES WHAT, AND HOW?


    When you write a program, you''re called a programmer, but when you run a program,

    y''re called a user. So when you test your code, you''re being both program-

    mer and the user.


    Suppose that your program contains a keyboard .nextSomething( ) call, like the
    calls

    in Listings 5-1 (In Chapter 5) and 6-2. Then your program gets input from the
    user. But,

    when the program runs, how does the user know to type something on the keyboard?

    the user and the programmer are the same person, and the program is fairly simple,

    knowing what type is no big deal. For example, when you start running the code
    in

    Listing 5-1, you have this book in front of you, and the book says "The computer
    is wait-

    ing for you to type something... You type one line of text... You type the text
    and

    press Enter. Everything is fine.


    But few programs come with their own screens. In many instances, when a program

    st running, the user has to stare at the screen to figure out what to do next.
    The code

    in Listing 6-2 works in this stare-at-the-screen scenario. In Listing 6-2, the
    first call

    to puts an informative message ("What''s the price of a flash drive?") on

    the user''s screen. A message of this kind is called a prompt.


    When you start programs, you can easily confuse the roles of the prompt and the

    user''s input. No preordered relationship exists between a prompt and the

    subsequent input. To create a prompt, you can call print or printIn. Then, to
    read the user''s

    input, you call nextLine, nextDouble, or one of the Scanner class''s other .Something

    methods. You use print and next in two separate statements. Java has no

    commonly used, single statement that does both the prompting and the "next-ing."


    As the programmer, your job is to combine the prompting and the next-ing. You
    can

    combine prompting and next-ing in all kinds of ways. Some ways are helpful to
    the user,

    and some ways aren''t, as described in this list:


    +   - If you don''t have a call to print or printIn, the user sees no prompt.
    A blink-

    ursing cursor sits quietly and waits for the user to type something. The user
    has to

    gu what kind of input to type. Occasionally that''s okay, but usually it isn''t.


    +   - If you call print or printIn but you don''t call a keyboard .nextSomething

    method, the computer doesn''t wait for the user to type anything. The program

    races to execute whatever statement comes immediately after the print or printIn.


    +   - If your prompt displays a misleading message, you misled the user. Java
    has

    no built-in feature that checks the appropriateness of a prompt. That''s not surpris-

    ing. Most programming languages have no prompt-checking feature.


    Be careful with your prompts. Be nice to your user. Remember that you were once
    a

    humble computer user, too.


