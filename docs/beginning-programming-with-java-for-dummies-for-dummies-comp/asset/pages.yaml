    ![](img/f472724a364323eda9b6dbd5661326f5_276_0.png)


    Taken as a whole, isLeapYear ? 29 : 28 is an expression with a value. And what
    value does this expression have? Well, the value of isLeapYear ? 29 : 28 is either
    29 or 28. It depends on whether isLeapYear is or not true. That''s how the conditional
    operator works:


    +   * If the stuff before the question mark is true, the whole expression''s value
    is whatever comes between the question mark and the colon.\n* If the stuff before
    the question mark is false, the whole expression''s value is whatever comes after
    the colon.


    FIGURE 11-7 gives you a goofy way to visualize these ideas.


    ![](img/f472724a364323eda9b6dbd5661326f5_276_1.png)


