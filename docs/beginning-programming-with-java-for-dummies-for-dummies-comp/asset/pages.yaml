  md: '# Chapter 17

    Programming with Objects and Classes


    Chapters 6, 7, and 8 introduce Java''s primitive — things like int, double, char,
    and boolean. That''s great, but how often does a real-world problem deal exclusively
    with such simple values? Consider an exchange between a merchant and a customer.
    The customer makes a purchase, which can involve item names, model numbers, credit
    card info, sales rates, and lots of other stuff. A purchase is more complicated
    than an int value. It''s more complicated than a double value. How do you represent
    an entire purchase in a Java program?


    In older computer programming languages, you treat each entire purchase like a
    big pile of bundled laundry. Imagine a mound of socks, shirts, and other pieces
    of clothing. You have no basket, so you grab as much as you can handle. As you
    walk to the washer, you drop a few things — a sock here and a washcloth there.
    This is like the order of storing values in a purchase. In older languages, there''s
    no purchase. There are only double values, char values, and other items. You put
    the purchase amount in one variable, the customer''s name in another, and the
    sales tax data somewhere else. But that''s awful. You tend to drop things on your
    way to the compiler. With small errors in a program, you can easily drop an amount
    here and a customer''s name there.'
  merge: -1
  pgno: 396
- img_proc: true
  md: "With laundry and computer programming, you're better off if you have a basket.\
    \ The newer programming languages, like Java, allow you to combine values and\
    \ make new, more useful kinds of values. For example, in Java, you can combine\
    \ a double value, an int value, a boolean value, and maybe other kinds of values\
    \ to create something that you call a Purchase. Because your purchase info is\
    \ in one big bundle, keeping track of the purchase's pieces is easier. That's\
    \ the start of an important computer programming concept: the notion of object-oriented\
    \ programming.\n\n# Creating a Class\n\nI start with a “traditional” example.\
    \ The program in Listing 17-1 processes simple purchase data. A run of the program\
    \ is shown in Figure 17-1.\n\n+   LISTING 17-1: Doing It the Old-Fashioned Way\n\
    \n```\nimport java.util.Scanner;\n\nclass ProcessData {\n    public static void\
    \ main(String args[]) {\n        Scanner keyboard = new Scanner(System.in);\n\
    \        double unitPrice;\n        int quantity;\n        boolean taxable;\n\n\
    \        System.out.print(\"Unit price: \");\n        unitPrice = keyboard.nextDouble();\n\
    \        System.out.print(\"Quantity: \");\n        quantity = keyboard.nextInt();\n\
    \        System.out.print(\"Taxable? \") (true/false) \");\n        taxable =\
    \ keyboard.nextBoolean();\n\n        double total = unitPrice * quantity;\n  \
    \      if (taxable) {\n            total = total * 1.05;\n        }\n\n      \
    \  System.out.print(\"Total: \");\n        System.out.println(total);\n      \
    \  keyboard.close();\n    }\n}\n```"
