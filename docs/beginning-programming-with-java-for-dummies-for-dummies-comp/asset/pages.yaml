    10) and assigns that number to the variable randomNumber. When that''s done, you''re
    ready to answer the user''s question.

    In Java''s API, the word Random is the name of a Java class, and nextInt is the
    name of a method and methods. For more information on the relationship between
    classes and methods, see Chapters 17, 18, and 19.


