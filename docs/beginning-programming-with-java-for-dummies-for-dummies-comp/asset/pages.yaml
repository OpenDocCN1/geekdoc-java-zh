    +   7. **Right-click (or, on a Mac, Control-click) the new Root.fxml branch in
    Eclipse''s Package Explorer. On the context menu that appears, select Open with
    SceneBuilder.**


    The Scene Builder application window appears. (See Figure 20-10).


    The Scene Builder window contains several areas:


    +   * The middle of the Scene Builder window contains the *Content panel*, where
    you see a preview of your new app. (Currently, there''s nothing in your app to,
    so the Content panel is a big, empty space.)

    * The upper-left portion of the window contains the *Library panel*, which houses
    a Containers section, a Controls section, and several other sections.

    * In the GUI world, things like buttons, text fields, labels, and check boxes
    are *controls*. The Library panel''s Controls section forms a Palette. To create
    a GUI window, you drag controls from the palette and drop them onto the Content
    panel.

    * The lower-left portion of the window contains the *Document panel*, which contains
    a Hierarchy section and a Controller section. The Hierarchy section contains an
    *AnchorPane* item.

    * The Hierarchy section contains a tree showing which elements of your window
    are inside which other elements. The Controller section helps you link the window
    that you design with the application''s Java code.


