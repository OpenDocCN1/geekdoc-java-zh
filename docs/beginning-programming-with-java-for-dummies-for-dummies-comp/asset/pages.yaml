    \ following code doesn't work with java 6, but works well in Java 7:\n\n```\n\
    String description;\ndescription = keyboard.next();\n\nswitch (description) {\n\
    \    case \"Excellent\":\n        System.out.println('A');\n        break;\n\n\
    \    case \"Good\":\n        System.out.println('B');\n        break;\n\n    case\
