    # JDK versus JRE


    The download page offers you a choice between the JDK (Java Development Kit) and
    the JRE (Java Runtime Environment). The JDK contains more stuff than the JRE download.
    The JRE includes a Java Virtual Machine and the application programming interface
    (Refer to Chapter 1.) The JDK includes everything in the JRE, and in addition,
    the JDK includes a compiler. (Again, refer to Chapter 1.)


    The Eclipse IDE contains its own Java compiler. So you can survive by downloading
    the smaller JRE (avoiding the big JDK download). But I recommend downloading the
    entire JDK. Why? Because you never know when another compiler (separate from Eclipse)
    will come in handy. Besides, the installation and configuration of Eclipse on
    a Mac can be convoluted if you haven''t installed the full JDK. So, if you want
    to have a smooth ride, download the JDK instead of the JRE.


    By the way, another name for the JDK is the Java Software Development Kit. Some
    people use the SDK acronym, even though the folks at Oracle don''t use it anymore.(Actually,
    the original name was JDK. Later, Sun Microsystems changed it to the SDK. A few
    years after that, the captains of Java changed it back to the name JDK. This constant
    naming and renaming drove me as an author.)


    # Java SE, Java EE, and Java ME


    While you wander around, you might notice links labeled Java EE or Java ME. If
    you know what these are, and you know you need them, by all means, download these
    goodies. If you''re not sure, bypass both the Java EE and the Java ME links. Instead,
    follow links to the Java SE (Java Standard Edition).


    The abbreviation Java EE stands for Java Enterprise Edition, and Java ME stands
    for Micro Edition. The Enterprise Edition has software for large businesses, and
    the Micro Edition has software for handheld devices.(Google''s Android software
    bears a passing resemblance to Java''s Micro Edition, but in many ways, Android
    and Java ME are very different animals.)


    You don''t need the Java EE or the Java ME to run any of the examples in this
    book.


    # Additional Java-related software


    You can download Java alone, or you can download Java with Oracle''s NetBeans
    IDE. You can download a collection of demos and samples. You can probably download
    Java with fries and a soft drink. You can download plenty of extra stuff, but
    in truth, all you need is the Java JDK.'
