  md: '# Launching the JShell program


    To run JShell, make sure you have Java 9 (or a higher version of Java when it
    becomes available) on your computer.


    # To launch JShell on a Windows computer


    +   1. Open a Command Prompt window.


    In Windows 7: Press Win+R, and then type **cmd**, and then press Enter.


    In Windows 8: On the Start screen, press Win+Q. In the resulting search field,
    type **command prompt**, and then press Enter.


    In Windows 10: Choose Start -> Windows Command Prompt.


    +   2. In the Command Prompt window, type the following commands:

    ```cmd

    cd "Program Files\Java"

    dir jdk

    ```


    On some computers, you might have better luck typing `cd "Program Files (x86)
    \Java"` for the first of the two commands. Whatever works!


    The Command Prompt window responds by listing directory names.


    ![](img/f472724a364323eda9b6dbd5661326f5_157_0.png)


    +   3. In the Command Prompt window''s response, look for a directory named jdk-9,
    or something like that.


    Directories whose names start with jdk1.8 or lower won''t work. You must have
    Java 9 or higher installed in order to run JShell.


    In the next step, I assume you''ve found a directory jdk-9. If your directory
    has a different name, adjust your typing to match that name.


    +   4. In the Command Prompt window, type the following commands:

    ```cmd

    jdk-9\bin

    shell

    ```


    If all goes well, the Command Prompt window displays the JShell> prompt.

    That''s how you know you''ve successfully launched JShell.


    # To launch JShell on a Mac


    +   1. Press Command+spacebar, and then type Terminal, and then press Enter.

    As a result, your computer''s Terminal application starts running.'
