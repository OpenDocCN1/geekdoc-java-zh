  md: '![](img/f472724a364323eda9b6dbd5661326f5_376_0.png)


    FIGURE 16-6: An abstract snapshot of rooms in the Java Motel.


    Using an array saves you from having to declare ten separate variables: guestsIn0,
    guestsIn1, guestsIn2, and so on. To declare an array with ten values in it, you
    can write two fairly short lines of code:


    ```

    ```

    int guestsIn[];

    guestIn = new int[10];n```

    ```


    You can even squash these two lines into one longer line:


    ```

    ```

    int guestsIn[] = new int[10];n```

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make the guestsIn array ten components. Each component of
    the array has its own. The starting component is named guestsIn[0], the next is
    guestsIn[1], and so on. The last of the ten components is named guestsIn[9].


    In creating an array, you always specify the number of components. The array''s
    indices always start with 0 and end with the number''s one fewer than the total
    number of components. For example, if your array has ten components (and you declare
    the array with new int[10]), the array''s indices go from 0 to 9.


    When you create an array variable, you can put square brackets after either the
    type name or the variable name. In other words, you can write


    ```

    ```

    int guestsIn[];

    ```

    ```'
