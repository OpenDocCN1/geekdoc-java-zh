    # # Literals


    A literal is a chunk of text that looks like whatever value it represents. In
    Ann''s sentence (refer to Figure 4-2), "r" is a literal because "r" refers to
    the letter r.


    Programming languages have literals, too. For example, in Listing 4-1, the stuff
    in quotes is a literal:


    ```

    System.out.println("Chocolate, royalties, sleep");

    ```


    When you run the ThingsLike program, you use the words Chocolate, royalties, sleep
    on the screen. In Listing 4-1, the text "Chocolate, royalties, sleep" refers to
    these words, exactly as they appear on the screen (minus the quotation marks).


    Most of the numbers that you use in computer programs are literals. If you put
    the statement


    ```

    mySalary = 1000000.00;

    ```


    in a computer program, then 100000.00 is a literal. It stands for the number 1000000.00
    (one million).


    If you don''t enjoy counting digits, you can put the following statement in your
    Java 7 program:


    ```

    mySalary = 1_000_000.00;

    ```


    Starting with Java 7, numbers with underscores are permissible as literals.


    In versions of Java before Java 7, you cannot use numbers such as 1_000_000.00
    in your code.


    Different countries use different number separators and formats. For example,
    in the United States, you use 1,234,567,890.55. In France, you use 1234567890,55.
    In India, you group digits in sets of two and three. You write 1,23,45,67,890.55.
    You can''t put a statement like mySalary = 1,000,000.00 in your Java program.
    Java''s numeric literals don''t have any commas in them.


