  md: 'That''s great! When you refer to an object''s field or call an object''s method,
    the only difference is parentheses:


    +   > To refer to an object''s field, you don''t use parentheses.

    >> To call an object''s method, you use parentheses.


    When you call a method, you put parentheses after the method''s name. You do this
    even if you have nothing to put inside the parentheses.


    ![](img/f472724a364323eda9b6dbd5661326f5_451_0.png)


    # The versatile plus sign


    The program in Listing 19-3 uses some cute tricks. In Java, you can do two different
    things with a plus sign:


    +   > You can add numbers with a plus sign.

    For example, you can write

    `numberOfSheep = 2 + 5;`


    +   > You can concatenate strings with a plus sign.

    When you concatenate strings, you scrunch them together, one right after another.
    For, the expression

    `"Barry" + " " + "Burd"`


    scrunches together Barry, a blank space, and Burd. The new scrunched-up string
    is (you guessed it) Barry Burd.


    In Listing 19-3, the statement

    `account.lastName = "" + (char)(myRandom.nextInt(26) + ''A'') + (char)(myRandom.nextInt(26)
    + ''a'') + (char)(myRandom.nextInt(26) + ''a'');`


    has many plus signs, and some of the plus signs concatenate together. The first
    thing is a mysterious empty string (""). This empty string is invisible, so it
    never gets in the way of your seeing the second, third, and fourth things.


    Onto the empty string, the program concatenates a second thing. This second thing
    is the value of the expression (char)(myRandom.nextInt(26) + ''A''). The expression
    may look complicated, but it''s really no big deal. This expression represents
    an uppercase letter (any uppercase letter, generated randomly).'
