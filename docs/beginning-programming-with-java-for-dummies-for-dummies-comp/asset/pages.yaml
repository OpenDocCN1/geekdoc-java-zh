  md: '![](img/f472724a364323eda9b6dbd5661326f5_138_0.png)


    FIGURE 5-13: Whadaya mean "Selection does not contain a main type?"


    The answer goes back to the different kinds of words in the Java programming language.
    As I say in Chapter 4, Java has identifiers and keywords.


    The keywords in Java are cast in stone. If you change class to Class or public
    to Public, you get something new — something the computer probably can''t understand.
    That''s why the compiler chokes on improper keyword capitalizations. It''s the
    compiler''s job to make sure that all the keywords are used properly.


    On the other hand, the identifiers bounce all over the place. Sure, there''s an
    identifier named main, but you can make up a new identifier named Main. You shouldn''t
    do it, though. It''s too confusing to people who know Java''s usual meaning for
    the word.) When the compiler sees a mistyped line, like public static void Main,
    the compiler just assumes that you''re making up a brand-new name. So the compiler
    lets the line pass. You get no complaints from your friend, the compiler.


    But then, when you try to run the code, the computer goes ballistic. The Java
    Virtual Machine (JVM) runs your code. (For details, see Chapter 1.) The JVM needs
    to find a place to start executing statements in your code, the JVM looks for
    a starting point named main, with a small m. If the JVM doesn''t see anything
    named main, the JVM gets upset. "Main method not found in class EchoLine," says
    the JVM. So at runtime, the JVM and the compiler, give you an error message.


    > A better error message would be main method not found in class EchoLine, with
    a lowercase m in main. Here and there, the people who create the messages overlook
    a detail or two.


    # # What problem? I don''t see a problem


    I end this chapter on an upbeat note by showing some of the things you can change
    in Listing 5-1 without rocking the boat.'
