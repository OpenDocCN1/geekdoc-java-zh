  md: 'The next course is beef bourguignon. You take an unsalted slice to dear old
    Granny. "Not sweet enough," she groans, and she leaves the room. "But that''s
    impossible," you think. "There''s no sugar in beef bourguignon. I left the salt
    out. Even so, you go back to the kitchen and prepare mashed potatoes. You use
    unsalted butter, of course. "She''ll love it this time," you think.


    Sour potatoes! Yuck! Granny says, as she goes to the sink to spit it out. Because
    you have a strong ego, you''re not insulted by your grandmother''s behavior. But
    you''re somewhat confused. Why is she saying different things about three unsalted
    recipes? Maybe there are some subtle differences that you don''t know about.


    Well, the same kind of thing happens when you''re writing computer programs. You
    can make the same kind of mistake twice (at least, make what you think is the
    same kind of mistake twice) and get different error messages each time.


    For example, if you change the spelling or capitalization of println in Listing
    5-1, Eclipse tells you the method is undefined for the type PrintStream. But if
    you change System to system, Eclipse says that system cannot be resolved. With
    System misspelled, Eclipse doesn''t notice whether println is spelled correctly.


    In Listing 5-1, if you change the spelling of args, nothing goes wrong. The program
    compiles and runs correctly. But if you change the spelling of main, you face
    some unusual difficulties. If you don''t believe me, read the "Runtime errors"
    section, a little later in this chapter.


    Still in Listing 5-1, change the number of equal signs in the Scanner keyboard
    = new Scanner(System.in) line. With one equal sign, everybody''s happy. If you
