  md: '# THOSE PESKY FILENAME EXTENSIONS


    The filenames displayed in Windows File Explorer or in a Finder window can be
    misleading. You may browse one of your directories and see the name Mortgage.
    The file''s real name might be Mortgage.java, Mortgage.class, Mortgage.somethingelse,
    or plain Mortgage. Filenames ending like .zip, .java, and .class are called filename
    extensions.


    The ugly truth is that, by default, Windows and Macs have many filename extensions.
    This awful feature tends to confuse programmers. So, if you don''t want to be
    confused, change your computer''s system-wide settings. Here''s how you do it:


    +   **In Windows 10:** In the taskbar search box, type File Explorer Options.
    On the list of choices that appear, choose File Explorer Options. Then follow
    the instructions In the In All Versions of Windows bullet.

    **In Windows 8:** On the Start screen, hold down the Windows key while pressing
    Q. In the searching box, type Folder Options and press Enter. Then follow the
    instructions in the In All Versions of Windows bullet.

    **In Windows 7:** Choose Start Control Panel Appearance and Personalization ->
    Folder Options. Follow the instructions in the In All Versions of Windows bullet.

    **In all versions of Windows (7 and newer):** Follow the instructions in one of
    the preceding bullets. Then, in the File Options (or File Explorer Options) dialog
    box, click the view tab. Look for the Hide File Extensions for Known File Types
    option. Make sure that this check box is not selected.

    **In Mac OS X:** In the Finder application''s menu, select Preferences. In the
    resulting dialog box, select the Advanced tab and look for the Show All File Extensions
    option. Make sure that this check box is selected.

    **In Linux:** Linux distributions tend not to hide filename extensions. So, if
    you use Linux, you probably don''t have to worry about this. But I haven''t checked
    all Linux distributions. So, if your files are named Mortgage instead of Mortgage.java
    or Mortgage.class, check the documentation specific to your Linux distribution.


