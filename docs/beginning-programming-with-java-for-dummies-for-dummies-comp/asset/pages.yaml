  md: "# Fixing the problem\n\nDisastrous or not, an unwanted blank space is the symptom\
    \ of a logical flaw. The program shouldn't display results before it has any meaningful\
    \ results to display. The solution to this problem is called... (drumroll, please)...priming\
    \ the loop. You pump findWithinHorizon(\".\",0).charAt(0) once to get some values\
    \ flowing. Listing 12-5 shows you how to do it.\n\n# LISTING 12-5: How to Prime\
    \ a Loop\n\n```\n/*\n * This code works correctly!\n */\nimport java.util.Scanner;\n\
    \nclass GetUserName {\n\n    public static void main(String args[]) {\n      \
    \  Scanner keyboard = new Scanner(System.in);\n        char symbol;\n\n      \
    \  symbol = keyboard.findWithinHorizon(\".\",0).charAt(0);\n\n        while (symbol\
    \ != '@') {\n            System.out.print(symbol);\n            symbol = keyboard.findWithinHorizon(\"\
    .\",0).charAt(0);\n        }\n\n        System.out.println();\n\n        keyboard.close();\n\
    \    }\n}\n```\n\nListing 12-5 follows the strategy shown in Figure 12-13. First\
    \ you get a character (the letter J in John, for example), and then you enter\
    \ the loop. After you're in the loop, you test the letter against the @ sign and\
    \ print the letter if it's appropriate to do so. Figure 12-14 shows a beautiful\
    \ run of the GetUserName program.\n\nThe priming of loops is an important programming\
    \ technique. But it's not the end of the story. In Chapters 14, 15, and 16, you\
    \ can read about some other useful looping tricks."
