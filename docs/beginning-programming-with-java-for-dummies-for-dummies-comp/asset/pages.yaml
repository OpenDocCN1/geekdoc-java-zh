  md: 'Then my friend told me that the kids weren''t speaking Danish. "What language
    are they speaking?" I asked.


    "They''re talking gibberish," she said. "It''s just nonsense syllables. They don''t
    understand English, so they''re imitating you."


    Now to return to present-day matters. I look at the stuff in Figure 1-1, I''m
    tempted to make fun of the way my computer talks. But then I''d be just like the
    kids in Copenhagen. What''s meaningless to me can perfect sense to my computer.
    When the zeros and ones in Figure 1-1 percolate through my computer''s circuits,
    the computer "thinks" the thoughts shown in Figure 1-3.


    ```

    Get columnNumber from memory.

    Get 60 from memory.

    Subtract 60 from columnNumber.

    Store the following info:

    Is the result negative?

    Is the result zero?

    If the result is negative, then continue.

    If the result is not negative, then check to see if the result is zero.

    If the result is zero, then continue.

    If the result is not zero, then wrap.

    ```


    FIGURE 1-3:

    What the computer gleans from a bytecode file.


    | 01001110 01101101 01101101 01100010 01100101 01110010 |

    | 01010110 01110001 01100010 01110111 01110011 00000001 |

    | 00000000 00001011 01100100 01101001 01101111 01110000 |

    | 01101110 01100001 01111101 01101011 01101111 01110010 |


    Everyone knows that computers don''t think, but a computer can carry out the instructions
    depicted in Figure 1-3. With many programming languages (languages like C++ or
    COBOL, for example), a computer does exactly what I''m describing. A computer
    gobbles some object code and does whatever the object code says to do.


