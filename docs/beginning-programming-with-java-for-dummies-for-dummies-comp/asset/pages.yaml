  md: '# 4 < age && age < 8


    The value of the age variable is greater than 4 and less than 8. The numbers 5,
    6, 7, 8, 9... are all greater than 4. But among these numbers, only 5, 6, and
    7 are less than 8. So only the numbers 5, 6, and 7 satisfy this condition


    # age < 4 || age < age


    The value of the age variable is less than 4 or is greater than 8. To create the
    condition, you use two pipe symbols. On many U.S. English keyboards, you can find
    the pipe symbol immediately above the Enter key (the same key as the backslash,
    but shifted)


    In this combined condition, the age variable is either less than 4 or greater
    than 8. For example, if a number is less than 4, the number satisfies the condition.
    Numbers like 1, 2, and 3 are all less than 4, so these numbers the combined condition.


    Also, if a number is greater than 8, the number satisfies the combined condition.
    Numbers like 9, 10, and 11 are all greater than 8, so these numbers satisfy the
    condition.


    # !eachGetsTen


    If weren''t experienced with computer programming languages, I''d be confused
    by the exclamation point. I think that !eachGetsTen means, "Yes, each kid does
    get ten." That''s not what this expression means. This expression says, "The variable
    eachGetsTen does not have the value true." In Java and other programming languages,
    an exclamation point stands for negative, for no, for not.


    Listing 8-4 (refer to Chapter 8) has a boolean variable named eachGetsTen. A boolean
    variable''s value is true or false. Because ! means not, the expressions eachGetsTen
    and !eachGetsTen have opposite values. So eachGetsTen is true, eachGetsTen is
    false (and vice versa).


    > Java''s || operator is inclusive. This means that you get true whenever the
    thing on the left side is true, the thing on the right side is true, or both are
    true. For example, the condition 2 < 10 || 20 < 30 is true.


    > In Java, you can''t combine comparisons the way you do in ordinary English.
    In English, you may say, "We''ll have between three and ten people at the dinner
    table." But in Java, you get an error message if you write 3 <= people <= 10.
    To do this comparison, you need something like 3 <= people && people <= 10.


    CHAPTER 10 Which Way Did He Go? 223'
