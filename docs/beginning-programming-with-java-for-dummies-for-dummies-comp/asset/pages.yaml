  md: '# Introduction


    What’s your story?


    +   - Are you a working stiff, interested in knowing more about the way your company’s
    computers work?


    +   - Are you a student who needs some extra reading in order to survive a beginning
    computer course?


    +   - Are you a typical computer user — you’ve done lots of word processing and
    you want to do something more interesting with your computer?


    +   - Are you a job seeker with an interest in entering the fast-paced, glamorous,
    high-profile world of computer programming (or, at least, the decent-paying world
    of computer programming)?


    Well, if you want to write computer programs, this book is for you. This book
    avoids the snobby “of-course-you-already-know” assumptions and describes computer
    programming from scratch.


    # About This Book


    The book uses Java — a powerful, general-purpose computer programming language.
    But Java’s subtleties and eccentricities aren’t the book’s main focus. Instead,
    this book emphasizes a process — the process of creating instructions for a computer
    to follow. Many halfaultin books describe the mechanics of this process — the
    rules, the conventions, and the formalisms. But those other books aren’t written
    for real people. These books don’t take you from where you are to where you want
    to be.


    In this book, I assume very little about your experience with computers. As you
    read each section, you get to see inside my head. You see the problems that I
    face, the things that I think, and the solutions that I find. Some problems are
    the kind'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'that I remember facing when I was a novice; other problems are the kind that
    I face as an expert. I help you understand, I help you visualize, and I help you
    create solutions on your own. I even get to tell you a few stories.


    # How to Use This Book


    I wish I could, “Open to a random page of this book and start writing Java code.
    Just fill in the blanks and don''t look back.” In a sense, this is true. You can''t
    break anything by writing Java code, so you''re always free to experiment.


    But I have to be honest: If you don''t understand the bigger picture, writing
    a program is difficult. That''s true with any computer programming language —
    not just Java. If you''re typing code without knowing what it''s about, and the
    code doesn''t exactly do what you want it to, you''re just plain stuck.


    In this book, I divide programming into manageable chunks. Each chunk is (more
    or less) a chapter. You can jump anywhere you want — Chapter 5, Chapter 10, or
    wherever. You can even start by poking around in the middle of a chapter. I''ve
    tried to make the examples interesting without making one chapter depend on another.
    When I use an important idea from another chapter, I include a note to help you
    find your way around.


    In general, my advice is as follows:


    +   - If you already know something, don''t bother reading about it.


    +   - If you''re curious, don''t be afraid to skip ahead. You can always sneak
    peek at an earlier chapter, if you really need to do so.


    # Conventions Used in This Book


    Almost every technical book starts with a little typeface legend, and *Programming
    with Java For Dummies, 5th Edition*, is no exception. What follows a brief explanation
    of the typefaces used in this book:


    +   - New terms are set in *italics*.


    +   - When I want you to type something short or perform a step, I use **bold**.'
