    \ misleading code:\n\n```\nfor (int howMany : guestsIn) {\n    howMany = diskScanner.nextInt();\
    \ //Don't do this\n}\n```\n\nThe new enhanced for for loop doesn't do what you\
    \ want it to do. This loop reads values from an input file and then dumps these\
    \ values into the garbage can. In the end, the array's values remain unchanged.\n\
    \nIt's sad but true. To make full use of an array, you have to fall back on Java's\
    \ plain old for loop.\n\n# Deleting Several Files\n\nA program in Chapter 15 deletes\
    \ a file named importantData.txt. The code to delete the file looks like this:\n\
    \n```\nnew File(\"importantData.txt\").delete();\n```\n\nIn that code, the new\
    \ File call refers to a single file. It's very nice code, but it doesn't tell\
    \ you how to delete a bunch of files. How can you write code to deal with several\
    \ files at once?\n\nFortunately, Java provides ways to deal with bunches of files.\
    \ One way uses an array of File objects. Listing 16-6 contains a program that\
    \ illustrates this idea.\n\n# LISTING 16-6 Deleting All .txt Files\n\n```\nimport\
    \ java.io.File;\nclass IHateTextFiles {\n    public static void main(String[]\
    \ args) {\n        File folder = new File(\".\");\n        for (File file : folder.listFiles())\
