  md: '# WHAT’S BEHIND ALL THIS

    findWithinHorizon NONSENSE


    Without wallowing in too much detail, here''s how the findWithHorizon(".", .charAt)
    technique works:


    Java''s findWithinHorizon method looks for things in the Input. The things the
    method depend on the stuff you put in parentheses. For example, a call to findWithinHorizon("\d\\d",
    0) looks for a group consisting of three digits. With the following line of code


    ```

    System.out.println(keyboard.findWithinHorizon("\d\\d", 0));

    ```


    I can type


    Testing 123 Testing


    and the computer responds by displaying


    123


    In the call findWithinHorizon("\d\\d", 0), each stands for a single digit. This
    \d business is one of many abbreviations in special code called regular expressions.


    Now here''s something strange. In the world of regular expressions, a dot stands
    for any character at all (That is, a dot stands for any character, not necessarily
    a dot.) So findWithinHorizon(".", 0) tells the computer to find the next character
    of any kind that the user types on the keyboard. When you''re trying to input
    a single character, findWithinHorizon(".", 0) is mighty useful.


    In the call findWithinHorizon("\d\\d", 0), the 0 tells findWithinHorizon keep
    searching until the end of the input. This value 0 is a special case because anything
    other than 0 limits the search to a certain number of characters. (That''s why
    the method name contains the word horizon. The horizon is as far as the method
    sees.) Here are a few examples:


    +   * With the same input Testing 123 Testing, the call findWithinHorizon("\d\\d",
    9) returns null. It returns null because the first nine characters of the input
    (the characters Testing 1 — seven letters, a blank space, and a digit) don''t
    contain three consecutive digits. These nine characters match the pattern \d\\d\\d.


    184 PART 2 Writing Your Own Java Programs'
