    “You okay?” He reached out to steady her. His touch sent a thrill through her\
    \ body, but the pain in her leg quickly overrode it.\n\nShe growled. “Yeah.” Closing\
    \ her eyes, she accepted the pain and visualized it draining from her leg.\n\n\
    Dillon held her shoulders. “Is there anything I can do?”\n\nShe shook the head,\
