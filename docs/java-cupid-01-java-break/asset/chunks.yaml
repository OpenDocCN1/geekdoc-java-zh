    “我本该发短信的。”他接着拿出了另一个盒子。“我想给你个惊喜。就像你爸爸做的那样。”


    他们笑了起来。


    “那么，你爸怎么说？”


    他深吸了一口气。“是啊，你知道我告诉过他正和某个花花约会，对吧？”


    她用筷子夹起一根竹笋塞进嘴里。“知道了。”


    “额，”，”迪隆轻笑道，“我告诉过你我还没见过她。”他夹起一根小玉米又把它放下，然后把筷子插进蔬菜中用力挤压，挤出了一块蘑菇和米饭。他很快把它放进嘴里，嘴唇含住了筷子。


    她不禁盯着那双嘴唇看。她想尝尝那块蘑菇。


    “……嗯。”


    “好吧，那将会改变的。”他把筷子插回食物里，抬起眼看向她的眼睛。“爸爸想我在周六晚上见见她。”


    “真的吗？”她把筷子滑落了一堆蔬菜和米饭。“真奇怪。我妈也安排了我在周六去见那个混蛋先生。”她皱了皱鼻子。“真巧合。”


    “哈。好，我有一个主意。”迪隆笑了，“我们周六早上聚一聚，吃个早餐，然后去玩激光射击——如果你想的话。然后我们就可以打扮一下，准备在我们父母的‘新性玩具’中首秀了。”


    “呕。别那样说。”她皱起眉。“我不想在脑子里出现那个画面。不过，早餐和激光射击听起来很完美。”


    “真的吗？”迪隆的眼睛闪烁着光。“温迪小姐，你是我梦想中的女孩。”


    “噢。你说话总是这么好听。”她的脸颊红了。她继续吃着东西，尽管她更想把东西放下，和他做些坏坏的事。但她确实得抽时间学习了。


    她负担不起落后的后果。她一旦落后，一天的时间根本不够让她追上。而且，如果她周六上午和下午都要和迪隆在一起，整个晚上都要和她妈妈以及那个混蛋在一起，她就必须领先并保持领先。


    ![Image](img/00004.jpeg)


    当迪隆把车停在史诗活动中心时，温迪觉得胃里的早餐有些沉重。她为什么选了“牛仔人早餐”，里面有两份肉、土豆饼和两个鸡蛋？她本可以忽略那两块煎饼的，但谁能抵挡两块浸了奶油黄油和糖浆的金色煎饼呢。迪隆吃着他的酸奶和麦片笑了起来。


    “真是个女孩早餐！”她曾那样逗过他。


    “你等着。等会儿我有优势的！”他喝光了常温水。


    “哈！你会饿的，而我会因为这些碳水和蛋白质而精力充沛！”她打趣道，拿起咖啡杯喝光了底。“还有咖啡因！”


    他轻声笑道。“走着瞧。”


    尽管胃里不舒服，她还是跟着他走进了那栋巨大的建筑。他知道自己去哪里，穿过几个缴费台，站在一个霓虹灯包裹的展位前排队。黑光灯暴露了几名穿着黑色紧身、类博格人风格工人身上的多根白色电线。迪隆付了钱，那个女性博格人按了一个按钮，升起扇横向门。温迪随他通过通道来到一组电脑前。她把脚放在地板上的轮廓线上，看着屏幕。指令写着：“微笑并按回车”。


    温迪笑着伸手去按键。


    “不！”迪隆跳到她的工作站旁。“你不是在办学生证！摆出你的战士脸。你是战士温迪！”


    她笑了起来，做了一个凶凶的、皱在一起的脸。他按下回车，一张卡片掉在桌上。“这个有什么用？”


    “这能换我们的激光背心和枪。”他带路进入黑暗房间。黑光灯将一切都变成了黑色物质或霓虹色。她咯笑起来。“我本该重新考虑我的衣服的。这在我们第一次约会时看起来挺可。”白条纹和奶油色蕾丝边绝对是个劣势。迪隆大喊：“哇哈哈！战士温迪有残疾。我们将增加你的生命值，并给你一个领先优势！”


    一个穿着黄色背心的高中男生走向他们并开始指令。他的名字叫杰伦。他帮温迪选了一件适合她娇小身材的背心，并教她如何调整侧带带以保持紧固。他递给她一把激光枪。


    她靠向那个男孩低声问：“这个怎么用？”她瞥了一眼正上下蹦跳仿佛在热身的迪隆。男孩降低声音教她如何射击，他还给了她一些关于如何在场地上穿梭以及在对方不经意的情况下抓住对方的内部技巧。她轻声说：“谢谢！”然后走向了阿斯卡里强大的迪隆。


    “准备好了吗？”她用枪捅了捅他的肋窝。


    他还在上下跳着。“等一下。时间会显示的。”


    “噢，好的。”她停下来听。一个合成声音在房间里回荡：“游戏开始！”


    温迪向左侧冲去。


    “等等！”迪隆在后面喊道。“温迪，温迪，等一下。”


    她停下看向他，担心出了什么问题。


    他射中了她的传感器点。她的背心传出一声响亮的“叮”声。“噢你！”她尖叫着对着他的背心射击，但他已经跑过了一个角。“你等着吧，阿斯卡里强大的迪隆！”


    她沿着开始的路跑去。杰伦告诉过她一些非常棒的优势点，她可以待在那里的。

