    “Oh, Honey!” her mother spoke too loudly. “Come on! We’re celebrating. Live a
    little.”


    “Mom!” Wendy leaned toward her to speak quietly.


    “There he is!” Blake stood again.


    Wendy glanced up at him but remained leaned in close to her mother. She spoke
    through clenched teeth. “Stop! How many of these have you had?”


    Her mother scrambled to push her chair back and stand. “This is my first one!”
    She grinned from ear to ear and looked past the column over Wendy’s shoulder.


    Wendy tried to get her mother’s attention, in spite of the height difference now
    that she was standing. “Mom!” she hissed. “Listen to me! I’m—“


    Blake stepped out and was hugging his son. Wendy took hold of her mother’s wrist.
    “Mom! I’m not kidding. You’re acting like a `foo—“


    “Come! Meet Patty and Wendy” Blake pulled the boy with him. Patty’s smile couldn’t
    possibly stretch any wider . She stuck out her hand and shook his. Wendy glanced
    up at the person belonging to the muscular arm.


    She looked again. “Dillon?”


    He looked down at her. His face paled. “Wendy?”


    Blake chuckled. “You two know each other?”


    “Yes.” They said at the same time.


    “Mom, you remember Dillon from the Java Cupid Coffee Shop?”


    “Oh! So you’re `that` Dillon?” She turned to Wendy. “Your father told me you were
    seeing a Dillon.” Then she extended her hand and shook his. “How nice to actually
    meet you.”


    Patty sat down and Dillon sat also. He widened his eyes at Wendy, and mouthed,
    `Douche Bag`? Wendy mouthed back, `Gold Digger`? They smiled and leaned in to
    touch foreheads together.


    “What can I get—“ the waitress interrupted. “Dillon!”


    “Prissy?” Dillon paled some more.


    “Priscilla!” Blake placed his hand on the waitresses shoulder. “I thought you
    looked familiar. So good to see you.”


    “Mr. Cayne, yeah, I recognized you immediately, but I figured you didn’t remember
    me.” Her dimples deepened as she flashed a perfect smile.


    “Well, I do now. How’s Mildred and your parents? I haven’t seen them in ages.”
    Blake continued to stand.


    “Grandma’s doing well. She walks two miles a day.” Prissy giggled. Her voice was
    high-pitched and irritating to Wendy. “She can run circles around the rest of
    us.”


    Patty and Wendy stared at the waitress, slack jawed. Anger festered in Wendy’s
    gut. “I’m sorry, who are you?”


    Blake laughed. “Oh Wendy Ashton, this is Priscilla Langley. We know her and her
    family from our membership at the same Golf Club Mary and I, well, `I` belong
    to. They’re old friends.” His eyes misted for a moment. He cleared his throat.
    “Dillon” —he slapped him on the back— “and Priscilla used to be quite an item
    for a while there. I never did know what came between the two of you.” Cayne looked
    inquisitively at his son.


    Dillon stared at the table and mumbled for his dad to stop.


    Priscilla glared at Dillon. Her bottom jaw jutted out to the right.


    Wendy fumed, watching the exchange between them. There was definitely history.
    Tonight’s topic of conversation had just changed to a whole new subject when this
    dinner was over.


    Priscilla waved a dismissive hand. “Oh, Mr. Cayne, it was just puppy love, right
    Dillon.” Priscilla pressed up against Dillon and slapped both hands on his shoulders
    as if she were going to lean over him. “Wasn’t really meant to be.”


    Dillon didn’t say a word, nor did he lift his eyes to look at his lost puppy love.
    Wendy took it all in for discussion later.


    ![Image](images/00004.jpeg)


    “Well, that was weird.” Dillon followed Wendy into her apartment.


    “Tell me about it.” Wendy eased down onto her couch.


    Dillon seemed edgy. “Listen, I think we need to talk about this.”


    “You think?”


    He looked at her curiously. “Yeah.” His brow tightened. He slipped his hands into
    his front pockets and paced the room. “Do you realize what this means?”


    “Not so sure.” Wendy crossed her arms in front of her chest.


    He stopped mid-stride and glared at her. “If this works out between you mom and
    my dad… we’ll be… half, no step-brother and sister.”


    “Oh.” She stared at the floor. “That.”


    “Yeah.” He flopped down beside her. “I know, right?”


    “No. I don’t think you do.” She popped her ankle and crossed her legs.


    “What?”


    “Seriously? You have no idea what I might want to talk about, other than our parents
    getting together?”


    Dillon stared at her with a blank expression.


    She stared back. Anger roiled in her gut. “Does Priscilla Langley ring any puppy
    dog bells?”


    “Pffft.” Dillon waved his hand. “Oh. Her. She was a huge mistake in my life. Back
    in high school. Her parents and my parents thought we were the best thing since
    sliced bread. What they didn’t know is that Prissy has no moral compass when it
    comes to being in a relationship. She slept with every guy on the football, basketball,
    and soccer teams. I dated her because my parents literally forced me to, but she
    was never really my girlfriend. She wasn’t anybody’s girlfriend. She was EVERYBODY’S
    girlfriend.”


    Wendy stared at him. “Well, she certainly seems pretty fond of you.”


    “Wendy, she’s pretty fond of any guy whose breathing.” Dillon leaned back on the
    couch with a far-off look in his eye. “I heard she had a kid and had no idea who
    the father was. I also heard her parents disowned her afterwards and kept her
    kid. That’s probably why she’s working at a burger joint.” He smiled but it was
    without any mirth. “Yeah, breaking it off with her was like `Obsessed`, dude.
    I think she still has some of my jerseys and who knows what else. I just wanted
    away from her and I didn’t care what she kept.” He chuckled.


    Wendy nodded slowly. “Uh huh. So, could the kid be yours?”


    His eyes shot up to hers. “No!” He leaned back to really look into her eyes. “Wendy,
    I’m telling you, I never—there’s no way the child is mine, I never did anything
    other than kiss her goodnight. I swear!”


    She glared at him a while, seeing nothing but honesty in his water blue eyes.
    “Okay. I believe you.”


    “Now, about our folks.” He leapt up and paced the floor again. “I’m serious. I-I
    don’t know how this’ll pan out, Wendy.”

