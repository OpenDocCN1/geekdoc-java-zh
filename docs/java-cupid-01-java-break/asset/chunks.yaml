    “我想是吧。”他将她拉回圆柱后的转角，低下脸贴近她的脸。“什么——？”他用嘴堵住了她的话，让她完全忘记了他的伤势。他的手向下移到臀部，将她紧紧按在自己身上。她的身体产生了她从未想象过的反应。如果他们不在公共场所……


    她把手滑进他的衬衫，尽管被背心挡着，然后用手臂环住他赤裸的腰部。仅仅是腰部的皮肤接触就让她陶醉。他的嘴吞噬着她的嘴。他的舌头探索并挑逗着她的。然后他向后倾斜，两人都喘着气。他吻着她的脸颊，吻一直延伸到耳垂。用牙齿轻轻咬住它，轻轻拉着。她呻吟着。吻顺着脖子向下。当他的唇掠过她喉咙处的跳动时，她的脉搏加快了。她深吸了一气，吻了他的耳朵。接着是他的脖子。他继续向下直到她的领口。他拉下她的衬衫，寻找下方细腻的皮肤。


    她后退一步。喘着气。


    他们在公共场所！虽然躲在黑暗的圆柱后，但仍然是公共场所。“迪隆。”她低声说，“我们不能。不在儿。”


    他轻微踉跄了一下。“我——我知道。”他们停顿了一刻以恢复冷静。然后他接过她的手，带她离开建筑结构走上上层。热气冲红了她的脸颊。有人知道他们在做什么吗。她没有眼神交流，只是让迪隆引导她走出了史诗活动中心（Epic
    Event Center），走向他的那辆红黑间的特斯拉 Roadster。


    她闭上眼睛靠在头枕上。他坐上车，话不说开车。“真不敢相信我们真的做了那种。”她终于喃喃道。


    迪隆将手覆盖在她的手上。“对不起。我失控了。”他清了清嗓子。“你唤醒了我体内的野兽，温迪。对不起，我让你失去了控制。”


    她沉默了一会儿。


    “但我没有。”


    ## 五


    ![Image](img/00008.jpeg)


    迪隆在温迪公寓前的路缘边停了下来。“你知道吗？我们大概还有三个小时。”


    她笑了。“你建议怎么做？”迪隆笑着打开了车门。她顺着他的动作也打开了自己的门。他绕过他的那辆小跑车，伸出手扶她站起来。他们手牵手走到她门口。她打开锁并推开门。他跟着她进去。她回头向他微笑，继续走向那个有三扇门的小走廊：洗间、叠物衣柜和她的卧室。她转过让她面对自己，俯身温柔地吻她。她环住他的脖子，踮起脚尖抵住他的唇。一火在她的腹部燃起。她勾住他的脖子，一边热烈地吻着，一边带着他进入卧室并踢掉鞋。他笨笨地弄着衬衫，把它从头顶提起扔在一旁。她也这样做。当他看到她美丽的胸部和柔软的皮肤时，他睁大了眼睛。


    他将她拉近吻着她的脖子。一个接一个顺着脖子向下，直到他听到她的呻吟。轻地一捏，她就摆脱了让他无法进一步让她享受的束缚。她弓起背，他将她抱入怀中，轻轻地放在她手工织的被子上。


    “等等！”她拉开侧抽屉，取出一个盒子，放在床头柜上。


    他笑了。“谢谢。你怎么——？”


    “除了我爸还能是谁？”她翻了个白眼。


    “告诉你爸，我很感谢。”他吻了吻她的鼻子，然后是她的眼睑。


    她呻吟道。“我才不会！”她将他拉向自己。


    在接下来的一小时里，他们探索了彼此的快感带，对每一个都非常熟悉。直到他们精疲力竭地躺在一起。迪隆的呼吸变得缓慢而深。他睡着了。温迪头枕在他的胸口，听着他的心跳。在平和的睡梦中沉浮。


    温迪的手机响了一段旋律。起初很轻，然后变大。她急忙拿起。那是提醒她洗澡准备和妈妈吃晚饭的闹钟。迪隆被她的突然动作弄醒了。


    “怎么了？”他嘟囔道。


    “对不起。我得准备了。”


    他看了手机。“其实我也是。”他们一起从床上起来，收拾各自的衣服。她冲进浴室穿上睡袍。当她出来时，他已经穿好衣服在等她。她头靠在他胸口，手臂环住他。“嗯。这很有趣。”


    他摸着她的头发。“是，我喜欢激光射击。”他顽皮地笑着。“性爱也很好。”


    她抬头看着他那双顽劣的眼睛。“噢你！”她拍了他了一下。“快离开这儿，好让我准备去见那个混蛋！”


    他假装受伤了。“噢！嘿，我得花一个晚上对一个拜金女脑残和蔼待。”他笑了起来。“嘿，我有个主意。”


    她等他表达想法。


    “我们之后聚聚，交换一下心得！”


    “听起来是个计划。”她眨眨眼，把他推出门外。


    ![Image](img/00004.jpeg)


    温迪拉上手刹，盯着红雀（Red Robin）的招牌。“美食汉堡与啤酒。”不知道要喝几杯啤酒才能度过今天。今晚唯一兴奋的事情就是稍后要见迪隆。今天下午的记忆在她脑海中闪过。她闭上眼睛，回他给她的感觉，以及他对她触碰时愉快的反应。她叹了口气。


    今晚他们会交换关于今晚经历的恐怖故事。她会告诉迪隆她妈妈约会的那个混蛋，而他会告诉她他爸爸约会的那个拜金脑残。她自自笑了。知道自己会把一切报告给迪隆，这让这个夜晚其实并不那么糟糕。这就像当了一个间谍，为了之后和她的员工汇报而记住每一个细节。


    兴奋冲刷了之前的恐惧。现在，这很有趣。她咯咯笑着。晚些，他们还会交换别的。一阵刺感贯过她的腹部。她抓起包包跳下她的越野车。快点结束吧，我今晚还有更有趣的事要做！


    她理了理裙摆，走向入口。


    “欢迎光临红雀。”一个活泼的高中女孩迎接她，同时从接待台的槽里拉出一份菜单。她的胸牌写着`Tiffany`。“就一个？”


    “呃。”温迪在桌间寻找妈妈。“我要见个人……所以——”


    妈妈的位置在一根柱子后面。温迪闭了片会儿眼睛调整情绪。“我看到她了，我可以进去吗？”


    “当然可以。”`Tiffany`把菜单滑回槽里。


    妈妈的长臂在空中挥起。妈妈舔了舔嘴唇，将高脚杯拉向自己。“来妈妈这里。”


    温迪瞪大了眼睛，在心里责备她。她从未见过妈妈这样表现。她真……很傻。她已经见过多少次这样了？


    “你想喝什么？”服务员问。


    温迪渴望地看着玛格丽塔。不。她最好保持清醒。况且她晚点还要给一份报告。“请给我一杯柠檬冰水。”

