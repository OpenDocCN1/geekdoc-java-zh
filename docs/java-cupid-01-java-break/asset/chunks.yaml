    Priscilla waved a dismissive hand. “Oh, Mr. Cayne, it was just puppy love, right
    Dillon.” Priscilla pressed up against Dillon and slapped both hands on his shoulders
    as if she were going to lean over him. “Wasn’t really meant to be.”


    Dillon didn’t say a word, nor did he lift his eyes to look at his lost puppy love.
    Wendy took it all in for discussion later.


    ![Image](images/00004.jpeg)


    “Well, that was weird.” Dillon followed Wendy into her apartment.


    “Tell me about it.” Wendy eased down onto her couch.


    Dillon seemed edgy. “Listen, I think we need to talk about this.”


    “You think?”


    He looked at her curiously. “Yeah.” His brow tightened. He slipped his hands into
    his front pockets and paced the room. “Do you realize what this means?”


    “Not so sure.” Wendy crossed her arms in front of her chest.


    He stopped mid-stride and glared at her. “If this works out between you mom and
    my dad… we’ll be… half, no step-brother and sister.”


    “Oh.” She stared at the floor. “That.”


    “Yeah.” He flopped down beside her. “I know, right?”


    “No. I don’t think you do.” She popped her ankle and crossed her legs.


    “What?”


    “Seriously? You have no idea what I might want to talk about, other than our parents
    getting together?”


    Dillon stared at her with a blank expression.


    She stared back. Anger roiled in her gut. “Does Priscilla Langley ring any puppy
    dog bells?”


    “Pffft.” Dillon waved his hand. “Oh. Her. She was a huge mistake in my life. Back
    in high school. Her parents and my parents thought we were the best thing since
    sliced bread. What they didn’t know is that Prissy has no moral compass when it
    comes to being in a relationship. She slept with every guy on the football, basketball,
    and soccer teams. I dated her because my parents literally forced me to, but she
    was never really my girlfriend. She wasn’t anybody’s girlfriend. She was EVERYBODY’S
    girlfriend.”


    Wendy stared at him. “Well, she certainly seems pretty fond of you.”


    “Wendy, she’s pretty fond of any guy whose breathing.” Dillon leaned back on the
    couch with a far-off look in his eye. “I heard she had a kid and had no idea who
    the father was. I also heard her parents disowned her afterwards and kept her
    kid. That’s probably why she’s working at a burger joint.” He smiled but it was
    without any mirth. “Yeah, breaking it off with her was like *Obsessed*, dude.
    I think she still has some of my jerseys and who knows what else. I just wanted
    away from her and I didn’t care what she kept.” He chuckled.


    Wendy nodded slowly. “Uh huh. So, could the kid be yours?”


    His eyes shot up to hers. “No!” He leaned back to really look into her eyes. “Wendy,
    I’m telling you, I never—there’s no way the child is mine, I never did anything
    other than kiss her goodnight. I swear!”


    She glared at him a while, seeing nothing but honesty in his water blue eyes.
    “Okay. I believe you.”


    “Now, about our folks.” He leapt up and paced the floor again. “I’m serious. This
    could get really complicated, really fast.”


    “I really liked your dad.” Sadness filled her tone.


    He eased back down. “And I really liked your mom.” They sat in silence for a long
    while. “I’m sorry I called Patty a ‘gold digging bimbo.’”


    Wendy looked into his eyes. “I’m sorry I called Blake a douche bag.”


    “Mr. Douche, as I recall.” He chuckled.


    “Mr. and Mrs. Douche.” She giggled.


    “Right.” Dillon laughed but it was short lived. He rubbed his hand down his face
    and exhaled slowly. “What’re we gonna do?”


    She stared at him. Her body knew what *she* wanted to do. Her mind wondered how
    the definition of incest would interpret this situation. “I don’t know.” She sighed.
    At last she said, “Maybe it won’t work out between them.”


    “Are you kidding? Did you see how happy they were tonight? They were like two
    kids in love for the first time.”


    Wendy chuckled. “What do you know about two kids in love for the first time?”


    He cupped her jaw in his palm and looked deeply into her eyes. “I’ve got an idea
    about it.”


    “Do you?”


    “Yeah, I do. And that’s why this is a real problem.” His voice escalated again.
    He leapt up and paced in front of her couch. “I-I just don’t know how this’ll
    pan out, Wendy.”


    “Well.” She watched him go back and forth. “My dad always says to sleep on it.”
    She grinned mischievously.


    He stopped and stared at her. “I don’t think that’s going to help anything. In
    fact, I think we’ve already made things worse. I mean, if we are going to be brother
    and sister—“


    “Step-brother and sister!” she retorted. “Huge difference. We’re not blood related.”
    She considered her words. “We-it’s complicated, I’ll give you that, but it’s not
    incest, for God’s sake.”


    He glared at her a long while. “You’re right.” He eased back onto the couch. “You’re
    right.” He said more enthusiastically. “It’s weird, messy even, but it’s not against
    the law.”


    “Right.” Hopefully that was right. She lifted her phone. Too late to call Dad.
    “Hey, your dad’s a lawyer. Maybe we should talk to him about all this.”'
