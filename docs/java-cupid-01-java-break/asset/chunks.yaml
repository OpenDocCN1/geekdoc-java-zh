    我主要感谢上帝赐予我的才华。我希望当我跨越约旦河，投入你的怀抱中时，能听到你对我说：“得好，你这忠实良的仆人”——那是很多很多年后之后的事情。 :)


    嘿，读者，当你翻到这里时，亚马逊（Amazon）将为你提供对这本书进行评分和撰写评论的机会。这难道不酷吗？你只需要花上几分钟时间，就能帮助其他人找到他们的下一本最喜欢的书。

    '
