    一阵轻微的嗡嗡声响起，温迪冲下走廊查看病人需要什么。一扇储物间的门开了，她向左偏转以避免撞上那扇大门。当温迪躲闪时，一个男人走了出来。他撞到了她，她踉跄着向后退。疼痛穿过她的右腿直达骨盆。她像雕塑一样静止着，闭上眼睛，让疼痛存在，然后让它散去，就像一阵汹涌的定音鼓，最终达到顶峰并轻地平息。


    “噢！真对抱，”，”男人很快说道。


    她慢慢睁开眼睛。由于她长时间集中在生物反馈技术上，一切都模糊了。他高大的身影站在她面前。她专注地眨了眨眼，等眼睛适应。迪隆！


    “噢，嗨，”她结结巴巴道，“我今天早上就知道你看起来很眼熟。”


    他笑了，“是的，你也是。”


    他是故意的还是只是客气？但转念想，还有那条信息。*没有你，我破碎了*。是他写的吗？


    病人房传来的第二声嗡嗡声打破了她的思绪。“噢，我得去处理一下。”


    “没问题。”他绕过她。工具带低低地挂在他紧实的臀部上。他的手按放在插槽里的手柄上。作为一名咖啡师，他很有吸引力，但作为一名维修人员，他简直帅得完美。工具带到底有什么让一个男人变得如此性感？就像军装一样，它凸显了他们最好的特征。


    温迪摇了，从恍神中醒来。一个病人需要某些东西，她需要弄清楚是什么。


    ![Image](img/00004.jpeg)


    三个小时后，温迪终于可以休息一下了。护士休息室里是一次受期待的休息。她热了一份乐纯简餐（Lean Cuisine）晚餐，尽可能坐着狼吞虎咽。两片芬司林片，不，实际上是四片，就能让她度过完剩下的班次。她闭上眼睛，将疼痛想象成腿部和臀部内部一个空心管里的黑色液体。她想象液体从管子底部流出，流入大地被地面吸收。然后，她想象管子从大地重新装满了浅蓝色的液体。它伴随着珍珠光泽旋转，直到管子完全填满到顶部。


    她睁开眼睛，正打算喝掉自己带的那瓶水，开始了。迪隆站在桌子对面，肩上挂着梯子。他似乎在看着她。“噢！我不知道你在这儿？”


    “抱歉。我不是想吓到你。”他看起来是真的在担心。


    “我没害怕。”她咯笑道，“只是不知道你在那。”


    “你刚才在做什么？”他没有离开位置。


    她心里有些尴尬。“这叫生物反馈。我用它……”她为什么要告诉他这些？“管理我腿的疼痛。几年前和我爸爸滑雪时摔断了，以后就没真正停止过疼。他们告诉我骨痛是最糟糕的。”


    “我懂。”他走开并架起梯子。


    “为什么？”温迪准备好回到工作岗位，“你也断了腿吗？”


    他爬上梯子第三级，顶起一块天花板板，向下看着她。“还有两条手臂，一个肩胛骨和四根肋骨。他们告诉我我差点死掉。”他消失在天花板里。


    她盯着他的蓝色牛仔裤和工作靴。他的臀部真不错！


    显然，他们的对话结束了。她需要回到岗位。但她比任何时候都想留在这里，多了解关于这个最有趣的咖啡师兼维修工，就是那个写道没有她他就破碎的人。


    “温迪？”海迪·卡森，温迪所在楼层的一个新注册护士，探头进了休息室。她看了看从天花板伸出来的男人，又看了看温迪。“我正要换输液，你想过来看看吗？”


    她看了一眼迪隆合身的蓝色牛仔裤，然后将目光回到海迪身上。“好啊。”她用尽了意志力才迈出了一步。然后又是一步。她把迪隆留在梯子上。


    “回头见。”她朝他大喊道，但他没有回答。她失望地抿着嘴唇，快步追上海迪。


    # 第二章


    **![Image](img/00005.jpeg)**


    第二天早上，温迪提着她的产科护理书和包走进咖啡馆，期待能再次见到迪隆。就在她关上吉普车门时，手机响了。“你好，妈。”她把手机抵在肩膀上。她的父母似乎总是能知道她什么时候到达学习地。“是的，我昨天和爸爸通过电话了。”


    一个女人走出“Java 丘比特”（Java Cupid），为温迪扶住门。温迪点头致谢，手机在肩膀上摇晃，书在怀里岌岌岌地平衡着。她的目光立刻扫过点餐台寻找迪隆。两个女孩和一个黑人男孩在服务台后面工作，但没有迪隆。


    “温迪！”她母亲的声音响彻了整个咖啡馆。


    她闭上眼睛，深吸了一口气让自己冷静。她母亲长长的手臂在空中挥动，就像二手车场里那些吹风机人物一样。温迪环顾四周，确保只有她自己被母亲的问候丢了脸。她抬起手和眉毛回应那个疯狂的女人。然后竖起手指让妈妈等一下，自己排队点餐。


    “宝贝！”她母亲比着巨大的手势指向桌子。“我已经给你买了东西。”


    温迪在转身离开队伍之前又叹了口气。当然，她当然买了。她带着羞愧的步走向母亲的卡座坐下。“谢谢，妈。”


    “你今天有什么课？”她母亲盯着她那本大大的产科书。


    她举起书作为课程的演示。“产科护理，很显然。还有医院的临床实习直到中午。然后我从一点工作到七点。”


    她母亲啧啧了下舌头。“我就是明白你怎么能坚持这么久。”


    温迪举起妈妈为她点的咖啡。“咖啡是我的好朋友！”她并从盖子上吸了一口。她妈妈点得很好，带焦糖淋的巧克力美式咖啡加鲜奶油。


    “嗯，你记得也要补充维生素。”她母亲喝着自己的咖啡，让目光在咖啡馆里环视。


    “好的。”温迪跟随母亲的目光。迪隆从后面冲进来，还在系着围裙。*哈？奇怪他为什么迟到？*她想象他在医院工作到很晚，但维修部并不是轮班倒制的。好奇心战胜了她，她从包里拿出钱包。


