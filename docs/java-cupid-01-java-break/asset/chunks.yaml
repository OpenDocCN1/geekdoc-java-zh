  trans: '


    “现在不行，爸爸。”她嘟囔着，用力推开了门。她环顾四周，决定哪些事可以最快处理，哪些事必须留到以后。她把书和包包扔在沙发上。冲进厨房，把脏餐具塞进洗碗机。冲了冲水池，用抹布擦了擦台面。接着，她把被子掀到床上，让床看起来很整洁，然后捡起地板上的衣服扔进脏衣篮。她拉上浴帘遮住凌乱的淋浴间，盖上马桶盖，理了理毛巾和手毛巾。


    环顾四周，她决定自己根本没时间吸尘器，于是捡起教科书整齐地堆在椅子旁，把外套挂在门旁的衣柜里，把包扔在衣柜的地板上。


    这时，门铃响了。


    最后环顾了一圈。这已经是她能做的最好了。她深吸了一气，理了理头发，看了看自己的刷服。噢天天，这些衣服脏极了。她等会儿就去换。她打开门。


    迪隆靠在门框上，肩膀上斜着一个背包。看到她开门，他抬头露笑了。“嘿。”


    “嘿。要可乐还是别的什么？”她向后退一步让他进来。一阵疼痛顺着她的腿部冲向髋部，一直延伸到脊椎。她皱起脸。


    “你还好吗？”他出手扶住她。他的触碰让她的身体一阵颤栗，但腿上的疼痛很快盖过了那种感觉。


    她低吼道：“没事。”闭上眼睛，接受了疼痛，并在脑海中想象疼痛正从腿部流走。


    迪隆按住她的肩膀。“有什么我可以帮你的吗？”


    她摇摇头，但没有睁眼。


    他的一只手依然按着她的肩膀，关上门，把她引导到沙发上。“在这儿坐下。”


    她坐下了。“厨房水池旁有些泰诺林，”她咬着牙关说道。


    迪隆看向厨房，确认她没问题后，冲向厨房。他打开水池旁边的柜子，拿出一个玻璃杯，接满水，在药盖里倒了两片泰诺林，然后来到她身边。她接过玻璃杯和药盖，把药倒回去，把水吞了。她揉了揉大腿，把头靠在沙发上。


    “发生什么了？”迪隆坐在她身边。“是我造成的吗？”


    “不是。我只是步子迈歪了。”她嘶声道。“会过去的。”


    “一定是骨折得很厉害？”他轻声说，仿佛用正常音量说话会让她更疼。


    她猛地睁开眼睛。“是的。开放性粉碎性螺旋骨折。”


    他咯笑了一下。“我听出了那种骨头疼，尽管我不确定什么叫粉碎性螺旋骨折。”


    “开放性意味着骨头刺破了皮肤。螺旋性意味着它是沿着骨干扭转并断裂的，就像理发店灯上的条纹，而且，好像这还不够，粉碎性意味着它在螺旋骨折的中心断成了三处。”她叹了口气。“该死的雪板没有像预想的那样从靴子里脱落。所以，当我倒地时……”她笑了，但看起来更像是一个痛苦的表情。


    他点了点头，脱掉肩膀上的灰色连帽衫，抽出手臂。然后他拉起 T 恤的长袖，露出前臂上的手术疤痕。“两条手臂都是；桡骨和尺骨”——他一边说一边指向受伤的骨头——“右股骨、肩胛骨和四根肋骨。大多是在我的右侧。”


    温迪忧心忡地看着他。“哇。”她低声说。“怎么到的？”


    “摩托车。我左闪，它右闪。那并不好看。”


    她用食指触碰他的前臂，小心翼翼地划过那道紫色的疤痕。“什么时候？”她抬头迎上他的目光。


    他叹了口气，拉下袖子。“三年前。”


    **三年前**


    ![Image](img/00006.jpeg)


    温迪和迪隆留在沙发上聊天，分享了各自的事故和康复经历。“这就是为什么我想成为骨科护士。因为其中一些护士对待我的方式。他们在床上把我推来推去，完全不知道带给了我多大的痛苦。我从那时起就决定，我要成为一名护士，我的患者在我的照顾下绝不会那样受苦。”


    “是的，我也是。在做完康复训练后，我环顾他们提供我们的那些陈老得像中世纪一样的设备，决定成为一名工程师。我想设计出真正能帮助康复的设备。我告诉你，有些装置简直就像是从英国深处地牢的酷刑室里出来的。”


    她咯咯笑起来，他也跟着笑。


    “我明白你的意思。有一次——”


    他们继续聊天、大笑，分享恐怖故事。她享受他的陪伴，而他似乎和她在一起很自在。他经历了很多事情。当然，她也是，但她断的骨头没有他那么多。这就是他说的“没有你我就破碎了”的意思吗？他在给她发那条信息时，是怎么知道她骨折的？还是这仅仅是巧合？当她在休息室告诉他时，他看起来真的很惊讶。她在心里记下，以后找机会问他这件事。但现在，她很享受和他聊天。他的声音很好听。


    门来了敲门声。迪隆投来一个疑惑的目光。“你在等人吗？”


    “没有，但他们还是会来。”她嘟囔着，从沙发上站起来开了门。


    她父亲跨过她的门槛，然后停住了。“噢。我没意识到你有客人。”他环顾了一下房间。“嘿，你打扫过了！”


    温迪重重地叹了口气。


    迪隆站了起来。兰斯伸出手，迪隆握了握。“我是兰斯·阿什尔顿，温迪的爸爸，你叫……”


    “迪隆·凯恩，先生。”


    “先生！”她父亲转回温迪。“我就喜欢他了！”


    温迪对她父亲做了个夸张的表情。“所以，你是想要什么，还是只是来让我丢脸的？”


    “噢！”兰斯开了门但没有出去。“没有。我点了一份披萨，想知道你们要不要过来吃点。”


    “我们没事，爸爸。”她摇头。


    “好，如果你确定的话。”他看了迪隆，“你也欢迎。我点了大份的。”


    迪隆看向温迪寻求指示。她摇摇头。“谢谢你，阿什尔顿先生。我觉得我们不用了。”


    “行吧。”兰斯犹豫了一下，似乎还想说什么，但随后对温迪眨了眨眼就离开了。


    “是啊。”温迪脸脸红了。“所以，那是我爸。”


    迪隆点了点头。嘴角泛起一抹淡淡的微笑。“他很关心你。这真好。”


    “关心我？”温迪咯咯笑。“更像是把我窒息到死亡边缘，然后松开枕头让我喘口气。”


