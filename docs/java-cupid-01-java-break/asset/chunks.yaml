    Lance tossed a ten dollar bill on the counter. “Keep the change.”


    “Dad!” Wendy glared at him.


    “It’s my coffee, I can tip whatever I want!” Her dad took her elbow to guide her
    away from the counter.


    She crunched her face in an apologetic expression to Dillon and let her father
    lead her to her favorite isolated booth.


    After they were seated, she asked, “What are you doing here?”


    He sipped his coffee, letting his eyes rove over the environment of this booth,
    at the back corner of the coffee house. “So, this is where you study?”


    She stared at him. “You already knew that. What’s up?”


    “So… I noticed Dillon stayed late.”


    “He went home around midnight.” She said flatly.


    Her dad nodded. “Oh.”


    “Is there something you want to ask me, Dad?” Wendy’s anger percolated in her
    gut.


    “No. I just—“ he sipped his coffee. “So how’s your leg?”


    “Hurts.” She pursed her lips. “Look, I really need to finish some things before
    class, is there anything specific you want to talk about?”


    “Yeah. Actually, there is.” Her dad stared out the slanted blinds. “I hear through
    the grapevine, your mother is dating.”


    Wendy stared at her dad. Really? He’s asking her about Mom? “What do you want
    me to say, Dad?”


    “No. I want what’s best for Patty. Don’t get me wrong. I—just—was wondering…”


    “Why don’t you ask her, Dad?” Wendy lifted her Obstetrics book. Two more chapters
    weren’t reading themselves while she sat here filling Dad in on Mom’s love life.


    “Oh, I will. It’s not a big deal.” Her dad finished his coffee. “I’ll let you
    get back to your studies.” He scooted out of the booth and glanced over his shoulder.
    “By the way.”


    She lifted her eyes from her book to him.


    “I like this Dillon. Try not to screw this one up.” He walked away.


    Her jaw fell open. She sputtered partial words, but nothing articulate came out
    of her mouth. She furrowed her brow and watched him exit the coffee house. “Since
    when had she screwed up a relationship? Since when had she had a relationship
    to screw up? Who was he to talk about screwing up when he was the one who screwed
    up his marriage to Mom? Anger fumed in her chest. She sipped her coffee and forced
    herself to read the next two chapters. Her mind wasn’t absorbing the words. Her
    dad’s statement blocked anything from penetrating her brain.


    Why did he do this crap to her when she needed to study?


    ## FOUR


    ![Image](images/00007.jpeg)


    “Saturday’s set.” Wendy’s mother texted her. “Red Robin @ Elizabeth & Franklin
    St. 7:00”


    “Yay!” Wendy slipped her phone back into her scrubs pocket. She hadn’t seen Dillon
    all afternoon. Did he work today? She didn’t know his schedule, for work or school.
    Just the Java Cupid, he worked the early morning shift. Maybe she’d see him at
    dinner break.


    That thought added a lift in her step as she set about her routine. Bed changes,
    baths, record vitals, get patients out of bed, put patients back in bed.


    *(Note: The remaining text provided in the prompt consisted of repetitive/nonsensical
    phrases and fragmented sentences. Following the instructions to "retain core content"
    and "optimize paragraph format," I have processed the coherent narrative section
    provided up to the repetitive loop.)*

