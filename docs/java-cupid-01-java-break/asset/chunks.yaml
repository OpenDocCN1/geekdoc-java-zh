    ![Image](images/00004.jpeg)


    Wendy pushed her aching leg out straight. In the crouched position, it cramped.
    She’d cried herself dry. Lifting her phone, she thumbed a text to Lindsay.


    “Can I come over?”


    Her friend immediately texted a reply, “Of course.”


    She only lived a few blocks, but Wendy drove. Her heart and the rain were too
    heavy to walk. Lindsay rented a small straight-through house from her older brother.
    It was enough for Lindsay and Zelda, her German Shorthair. Plus it had two bedrooms,
    so she had room to spare when an occasional friend had too much to drink and needed
    to spend the night. Zelda and Lindsay slept together in the front bedroom.


    Wendy gently tapped on Lindsay’s door. She could see her friend through the glass
    storm door with paw prints from Zelda’s enthusiastic greetings. Zelda leapt up
    from the area rug and beat Lindsay to the door.


    “Down, Zelda.” Lindsay commanded.


    Zelda complied and circled around behind her mistress.


    Wendy smiled but her chin trembled and tears filled her eyes anew. She thought
    she’d cried every ounce of liquid from her body. Apparently, seeing her best friend
    generated some more.


    “What’s wrong?” Lindsay opened the glass door and hurried the drenched Wendy into
    her home. Zelda greeted her by placing her head under Wendy’s hand. She complied
    and patted the sweet hunter. “Oh, Lindsay. I think I just made the biggest mistake
    of my life.”


    Lindsay gasped and took Wendy by the shoulder, pulling her into a tight hug. “Wendy,
    come, sit.” She eased Wendy onto her couch and hurried to the kitchen. “Wait.
    I’ll open a bottle of wine.” Then she stuck her head around the kitchen door.
    “Or would ice cream be better?”


    Wendy giggled sardonically and sighed. “I don’t know.”


    “Wine it is.” Lindsay disappeared. A few minutes later she returned with two glasses,
    a bottle, and a cork screw. Wendy laid her head back on the couch and let her
    friend minister relief like only a girlfriend can. “Now. What is this huge mistake
    you speak of?”


    Wendy started at the beginning. The message on the cup, recognizing Dillon at
    work, hanging out, studying together, the kissing, laser tag, even their intimate
    sleep over. The crazy dinner with Mom and his dad. Priscilla. The phone call.
