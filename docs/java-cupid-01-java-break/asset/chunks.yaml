    # Java Break

    Java Cupid Series

    Book 1

    By Lynn Donovan

    © Lynn Donovan 2017

    © George McVey

    All rights reserved


    This is a work of fiction. All characters and events portrayed in this novel are
    fictitious. Any resemblance to actual events, locales, living or dead, is entirely
    coincidental.


    ## Synopsis

    Wendy Ashton and Dillon were both inspired by broken bones. She to become orthopedic
    nurse, he an engineer, designing their paths so closely aligned, yet never intersecting.
    Until a mysterious message appears in ink on coffee cup. A message of love that
    makes her take notice of the handsome barista. Brought together, their lives begin
    to merge. Could this be true love? Together they learn that his dad is dating
    her mom and worries about dating possible step-sister. Add a crazy ex-girlfriend
    who won’t take no for an answer and the trust issues become too much to bear.
    What will it take to bring these two together? Can Java Cupid show them Happy
    Ever After? Or was it all mistake? Will broken bones turn into hearts? Answers
    can only be found with Java Break.


    ## ONE

    ![Image](images/00002.jpeg)

    Welcome to Java Cupid Coffee


    ![Image](images/00003.jpeg)

    “I don’t wanna get back on the phone, Dad!” Wendy Ashton precariously held her
    cellphone against her cheek and opened the glass door to the coffee house. It
    was crowded today, but she didn’t care. Caffeine and peace was all she sought
    and Java Cupid Shop had both.


    “Look, I know what you’re saying.” She sighed and took her place in line to order.
    “I know you want what’s best for me, Dad. But I’m not skiing with you or anybody
    else.” Shifting her Nursing textbook and sliding her purse onto her shoulder with
    a groan, she took step forward. “I know you love me, Dad! I love you, too, but
    I’m not—”


    A young bus boy bumped against her hard enough to cause her stumble out of line.
    He held his dish with both short-fingered hands. Wendy’s breath escaped in an
    agonizing huff. He looked at her with terrified, bulbous eyes. “I so sorry, ma’am.”
    His words were thick and slow, high pitched for his gender. She recognized he
    had special needs and smiled graciously at the young man. “It’s all right.”


    In truth, the misstep and stumble shot a stabbing pain from her knee to her hip
    and into her lower back. The doctors told her bone pain after a bad break like
    hers would always be present. In fact, they had prescribed a lengthy physical
    therapy which included sixty percent biofeedback and pain management. Her physical
    therapist, Royce Rogers, told her more than once—in fact, he literally drilled
    it into her thinking at every session—“The last thing you want is to become addicted
    to pain meds. Learn to manage it through meditation and biofeedback, and life
    will be much more productive and healthy for you, Wendy.” His words rang through
    her mind even now.


    But, oh, what she wouldn’t give to be able to pop a couple of pills and have the
    pain float away on an oxycodone cloud of bliss. Royce and her doctors made sure
    she didn’t have access to those drugs once she left the hospital. Royce was as
    much of a cheerleader and aerobics enthusiast as a physical therapist. To be honest,
    she would feel like she let him down if she resorted to narcotics to manage her
    life.


    As she considered the boy, empathy washed over her thoughts. He quickly cleared
    the table beside her. She touched his shoulder to get his attention. He jumped
    slightly. “I’m sorry.” She spoke softly, the way she would speak to an injured
    patient. “Are *you* all right?”


    He smiled a crooked smile. His lips seemed swollen, his teeth oversized, and his
    mouth small. “Yes”—he nodded vigorously—“I all right.”


    She smiled back and observed as he resumed clearing tables, assessing if what
    he said was true. Assessing a patient’s words versus reactions was one of the
    skills she had been taught in nursing class.


    The tiny voice of her dad called her name from the phone on her shoulder. “Yeah,
    Dad. I need to let you go.” She moved two steps forward. “No, everything’s fine.
    I bumped into the bus boy that’s all.” She glanced over her shoulder to see his
    progress but he was gone.


    “Welcome to Java Cupid, where we heart coffee.” He smiled graciously with perfect
    teeth and a perfect face. “What can I get you?”


    “II’ll have a tall red velvet… caramel drip… cake latte with whip.” Was that right?
    Her brow drew together.

