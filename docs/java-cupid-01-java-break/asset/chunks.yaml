    He strode to the living room and looked around. Finding her coat, he picked it
    up, and shoved it into her hands. “Is that my phone?” he gestured toward her hand
    still against her cleavage. She smiled and handed it to him.


    He snatched it from her and gestured for her to leave. “Oh Dillon, Baby. You know
    you want all of this.” She posed as if she were on a modeling runway, with hands
    on hips, pelvis shoved out one direction, her shoulders twisted the other, legs
    lined in front of the other for a sleek, slimming affect.


    “Are you drunk?” He said and took her coat from her.


    She giggled. “I knew you’d wan—“ He opened the coat and forced her hand into the
    sleeve, turned her around, and shoved her other arm into the sleeve. “Get out
    of my apartment. And give me that damn key!”


    Her shoulders slumped forward. She reached into her coat pocket and held out the
    key. He snatched it from her palm.


    “But Dillon—“ she pouted.


    “Out!” he opened the door and shoved her out by her shoulder.


    “My shoes!” she stumbled onto his stoop.


    He glanced around, located her loafers and bent to pick them up.


    She leaned in to watch the stretch of his boxers and smiled.


    He tossed the shoes at her and slammed his door. She shivered and slipped on her
    shoes. Humiliated and embarrassed, emotions poured down her face and she sobbed
    ugly tears all the way to her car.


    ## SEVEN


    ![Image](images/00010.jpeg)


    Sunday dragged by like a documentary on the molecular origins of planet earth.
    Priscilla’s whispered voice echoed in Wendy’s mind. She couldn’t sleep at all
    after speaking to Dillon’s girlfriend. Worse yet, she couldn’t keep her mind on
    her studies. She was useless. She cleaned her apartment, did laundry, including
    her bed sheets, and stared at her reading assignments. Her brain couldn’t or wouldn’t
    absorb a single word.


    Lindsay Ledbetter called and asked her to come hang out, but Wendy declined. Under
    other circumstances, she’d drop everything to go hang with Lindsay. She was her
    best friend. They’d know each other since middle school.


    She couldn’t even bring herself to tell Lindsay what had happened. Wendy had only
    known this Dillon for a week. How did it all go so wrong so quickly?


    Thunder clapped in the distance. Wendy stood at her front window and watched the
    dark clouds build. Great. Perfect weather for her mood. Just then the thunder
    and lightning broke together. She winced at the sudden boom! The storm was directly
    over her head. Turning from the window, she sighed, and eased down onto the couch.
    No wonder her leg had been aching all day. It was the best weather vane around.
    Lucky her.


    Her phone chimed. It was Dillon. Her heart soared. Then she remembered they weren’t
    together any more, and her heart plummeted. She opened his text, “Pizza Delivery!”


    “What?” she said out loud. Was he—?


    She walked to her door and opened it. Dillon stood crouched up against her door
    frame, trying to stay out of the downpour. “Get in here!”


    He rushed in and closed the door. Shaking the rain off his coat, he walked straight
    to her kitchen, and put the pizza box on her counter. “You’ve got sodas right?
    Oh, by the way, I saw you called last night. I’m sorry I slept right through it.
    But I’m here now!” He grinned at her.


    She watched him walk in like he lived there. “What’re you doing here?”


    He stopped, a slice of pizza midway to his mouth. He swallowed and laid the piece
    back down. Brushed off his fingers and came back into the living room. “I-uh.”
    He took her hand. “I slept on it, like you said.”


    “Okay.”


    “And… I really like you, Wendy.” He leveled his eyes with hers. “I don’t want
    to lose what we have.”


    “Huh?”


    He stared at her with confusion. “What’s wrong?”


    “Wrong? Why don’t you ask Priscilla Langley what’s wrong.” Wendy stepped back
    from him and crossed her arms over her chest.


    He tilted his head back but kept his eyes on her. “Oooh—look, I can explain.”


    “I’m sure you can.” She walked to the door and opened it wide. “I think you should
    leave.”


    “No. Wait. Really, I can explain! Please hear me out.”


    Wendy tapped her foot. His eyes pleaded with her and her heart, despite her anger,
    softened. “Alright” —she gently closed the door— “I’ll give you three minutes.
    But this better be good.”


    He shoved his fingers through his hair. “Okay. I was asleep last night, and-and
    I heard a woman’s voice. I thought it was you.” He rubbed the top of his head.
    “Although, now that I think about I’ve never given you a key or showed you where
    I live.” He paused. “But… I was asleep and wasn’t thinking clearly… I heard a
    woman’s voice and I got up to see if it was you. But it wasn’t. It was… it was
    Priscilla.


    “She—well, she had my phone. Did she talk to you? Oh God, she talked to you didn’t
    she! Shit!” His eyes dropped to the floor and he paced a short distance, like
    a cat in a cage. “I made her leave and I made her give me the key back.”


    Wendy’s eyes widened. “She had a key? To your apartment?”


    “I have no idea how she got it!” he said quickly, holding a hand up like a cross
    guard. “I didn’t even know she knew where I lived. God. How’d she know where I
    live?” He looked up at Wendy with terror in his eyes. “I told you, she’s like
    `obsessed`, dude. She’s crazy!”


    Wendy stared at him. “Dillon. I… just… don’t—I think you should just leave.”


    “But—“


    “No. Really. I—just need you to leave.”


    Dillon’s shoulder rounded. He jammed his hand through his hair. “I—“


    She pointed out the open door. “Please don’t.” Her lip quivered and tears filled
    her eyes.


    Dillon slowly walked out. Wendy closed her door, slid down the wall to a crouched
    fetal position and cried.


    ![Image](images/00004.jpeg)


    Wendy pushed her aching leg out straight. In the crouched position, it cramped.
    She’d cried herself dry. Lifting her phone, she thumbed a text to Lindsay.


    “Can I come over?”


    Her friend immediately texted a reply, “Of course.”

