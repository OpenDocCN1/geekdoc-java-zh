    他的手滑进她的衬衫底部，沿着背部向上摸向她的内衣。他扭动了搭扣，搭扣便弹开了。他的吻变得深深，舌头追寻着她的唇。她的腹部燃起了一团火，除了他她什么都不想要。


    门铃响了。


    他们僵住了。


    她的目光投向门口。她闭上眼睛吐了一口气。迅速重新系好内衣，整理好衬衫站了起来。他的眼中仍残留着一种欲态的神情，但他挺直了身体，清醒了过来。她开了门。


    “噢，拜托！”她父亲大声说道，“我不可能吃掉完这些。你们拿去吧。”他把一个 `Pizza Hut` 披萨盒推给她，还有一瓶两升装的可乐。


    “爸！”她瞪大了眼睛。天哪，他的时机也太糟糕了！“呃。谢谢。”她接过盒子和可乐，在关门时顺手把父亲推回门外。她转头看向迪隆。他笑了。她也忍不住咯咯笑了起来。


    “想吃披萨吗？”她大笑起来。


    ![Image](img/00004.jpeg)


    “伙计。”迪隆用纸巾擦了擦手和嘴，拿起空披萨盒。“你刚才关于你爸的事可不是开玩笑。”


    “来，让我来。”温迪接过垃圾扔进水槽下的垃圾桶里。“可不是嘛！等你见到我妈就知道了！”她翻了个白眼。


    “你的意思是，她更糟？”他轻笑道。


    “不，不是更糟，只是一样糟糕。我收回这句话。其实，我爸是最糟糕的。他把我的意外归咎于自己，再加上我小时候他们离婚了。他充满了愧疚感，总做什么都不够……你懂吧？”她回到客厅，在他身边轻轻坐下。“我一直告诉他那不是他的错，”她耸了耸肩。


    “我妈正在跟一个混蛋约会。那是她和我爸离婚后我认识第一个男人。”


    “他们离婚多久了？”迪隆握住她的手。


    他的触碰让她的大脑瞬间一片空白。“呃。我——从我十三岁开始。看看吧……我二十二了……”


    他吻了吻她的手指。


    “你这样做的时候，我就没法思考了。”她从他手里抽回手。“呃。九年了。”


    “这是她的第一次约会？”迪隆叹了口气，揉了揉锁骨。


    他的肩膀疼吗？温迪点了点头。“据我所知。”


    迪隆微微一笑，挑起一边眉毛。“好吧，至少她等了一段体面的时间。我爸已经在跟一个花脑妹约会了。我妈坟骨还没冷透，他就已经在到处闲荡了。我最大的担心是他没有清醒地思考。你懂吗？他想念妈妈，我不让他把我当孩子对待。所以我想他只是想要个人可以照顾。但是——”


    她歪着头。“但是什么？”


    “温迪，我不是在自夸，好吗？这只是事实。我爸是个律师。一个成功的律师。基本上，他很有钱。但我担心他缺乏辨别好女人和捞捞金女的能力。你懂吧？”


    温迪点了点头。“确实。那段哀伤期实在太短了。我以前在 `Facebook` 上看到过一段很有深度的话。它说‘每个人悲伤的方式都是样的，只是有人在死前悲伤，有人在死后悲伤’。我想既然你爸知道事情会发生，所以他在之前就已经悲伤过了……我不敢多想。”她盯着自己的手。“拿我妈来说吧。当她跟我爸分手时，她陷入了低谷，过了几年才走出来。她现在很不错。事实上，当她跟我提起那个男人时，她看起来真的很开心。我想那就是我想要她的一切。还有让她别来管我的事。”她咯咯笑着。


    “但你说过他是个混蛋？”


    “那是我的主观臆。”她咯笑着。“我还没真正见过他。”


    “我一样。”迪隆笑着。“所以，我想既然我来这儿和你一起学习，我们至少应该翻开书看看。”


    她盯着他那双晶莹的蓝色眼睛。“好。我想你是对的。虽然在爸送来披萨之前，我很喜欢刚才那个发展方向。”


    迪隆顽坏地笑了笑。“我也是。但我确实有些需要读的东西。”


    她叹了口气。“是啊，我也是。”


    他们把教科书放在膝盖上，彼此依偎在一起。温迪满足地叹了口气。学习从未如此有趣。


    在明天上课之前，她有五章 `Med Surg Nursing` 书要读，还有一份来自 `Obstetrics` 教材的练习题。她读了三章，标注了重要信息，拿起练习题换个方式转转大脑，开始填写。她的眼睑变得沉重，缓慢地眨着眼。


    迪隆头部向后靠在沙发上，呼吸沉重。她戳了戳他的肋骨叫他。他跳得比她预想的要得多。噢，他的肋骨还是很敏感！她怎么能忘记这种事。“对不起，我不是故意的。你刚才睡着了吗？”


    “没有，只是闭目休息。”他用前臂揉着侧腹，然后用拇指按摩锁骨，用力呼出一口气气。


    “好了，我要睡着了。要么我去睡觉你回家，要么我去睡觉你可以在沙发上伸直身体。无论如何，都已经过午夜了。”

