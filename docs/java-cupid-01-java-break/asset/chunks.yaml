    to screw up? Who was he to talk about screwing up when he was the one who screwed
    up his marriage to Mom? Anger fumed in her chest. She sipped her coffee and forced
    herself to read the next two chapters. Her mind wasn’t absorbing the words. Her
    dad’s statement blocked anything from penetrating her brain.


    Why did he do this crap to her when she needed to study?


    **FOUR**


    **![Image](images/00007.jpeg)**


    “Saturday’s set.” Wendy’s mother texted her. “Red Robin @ Elizabeth & Franklin
    St. 7:00”


    “Yay!” Wendy slipped her phone back into her scrubs pocket. She hadn’t seen Dillon
    all afternoon. Did he work today? She didn’t know his schedule, for work or school.
    Just the Java Cupid, he worked the early morning shift. Maybe she’d see him at
    dinner break.


    That thought added a lift in her step as she set about her routine. Bed changes,
    baths, record vitals, get patients out of bed, put patients back in bed, and respond
    to call lights as needed.


    It wasn’t a bad job. And the nurses were wonderful about letting her watch or
    participate, supervised of course, in procedures that only the licensed nurses
    were allowed to perform. It was better than clinicals, because she got to work
    with real patients, doing real procedures, rather than simulations with anatomically
    correct robotic dolls. Today, Brenda let her put in Mrs. VanBuren’s foley. That
    was an experience!


    The dolls in clinicals were nothing like the real thing when it came to that particular
    procedure. She mused at the thought. IVs had been a challenge at first, but she
    had mastered it. Sometimes, Brenda Barnes, a seasoned RN, would call her to do
    it when they were having trouble getting one in. “You have the touch.” Brenda
    had praised her.


    Her phone hadn’t chimed all afternoon. Except for Mom’s text. She pulled it out
    anyway. Nope, nothing from Dillon. Should she text him? Did she really want to
    be that stalker-like? She bit her lip. She didn’t want to come across like that
    character in *Boy Next Door*. What if she just sent a casual, *Hey, how are you?*
    sort of text? That wouldn’t be too stalkery… would it?


    A copper-metallic taste registered on her tongue. *Oh, gosh!* She had bit into
    her lip. Scurrying to the nurses’ station she looked in the mirror. It wasn’t
    bad. She pressed a tissue to the wound until it clotted.


    Brenda’s dark complexioned face looked over her shoulder in the mirror. “What
    happened?”


    Wendy rolled her eyes. “I bit my lip.” She giggled. “I was thinking about Dillon.”


    “Girl!” Brenda laughed. “You’ve got it bad.”


    “I know. But he’s a really great kisser.” Wendy felt the heat flush her cheeks.


    “And not too hard on the eyes, I’d say.” Brenda gave a sideways glare. A mischievous
    twinkle gleamed in her eyes. They giggled.


    Wendy rolled her eyes but had to agree. Okay, a casual text wouldn’t hurt anything.
    “Hey. How’s it going?” she texted.


    Immediately three dots blinked in a running pattern. “Good. With Dad. I’ll call
    U later. U off at 7?”


    Her heart soared. It was ridiculous how a simple text could do that. She responded,
    “Yep.”


    “K. Talk then.”


    “K” she texted. Lifting her eyes from her phone, three nurses, grinning like Cheshire
    cats, anxiously stared at her. “What?” Wendy’s cheeks blazed with heat.


    “Nothing.” They all scurried off in different directions, leaving her standing
    there alone.


    She shook her head. Her life was not her own.


    ![Image](images/00004.jpeg)


    Wendy ran through the drive-thru of Burger King on her way home. A kid’s meal
    was cheap and would get her through the night’s studying. She opted for the healthier
    version with fresh fruit. She wondered how fresh could a little sack of sliced
    apples be if they never turned brown? How much MSG was on these apples?


    Curling up on her couch, the happy meal beside her and a textbook in her lap,
    she munched on the apple slices while she read. Her phone laid out on the couch,
    but no text messages from Dillon since the one earlier. Sadness filled her heart.
    But she had to study so she shoved that feeling aside and concentrated on the
    textbook.


    Her doorbell rang. She plopped the book aside and took long strides to get to
    the door. “Dad, I’m stud—


    Dillon stood at her door with a sack from China Jade Gardens. “You cooked!” She
    giggled.


    He lifted the sack and shook it slightly. “I did.”


    He set little boxes of food on her kitchen counter and shrugged out of his backpack.
    She followed him and pressed against his backside, wrapping her arms around his
    chest. He sighed, and twisted in her embrace to face her. Lifting a strand of
    hair from her face, he tucked it behind her ear. Placing both hands on either
    side of her face, he lowered his mouth to hers. Gently, at first, he kissed her.
    But their passion bloomed. His tongue teased hers and she fumbled for the hem
    of his shirt. Lifting it over his head, they fell back together. Her lips longed
    for his. She let her hands run over his taut chest. He cupped her breasts.


    She gasped and pulled back. Heaving for air. “I—we can’t.”


    He, too, panted and blinked several times. His eyes were dilated with lust. “What’s
    wrong?”


    “Nothing.” She stepped back another step and wiped her swollen lips. God she wanted
    more.


    “I… need… to study.” She couldn’t believe she said that. It was so far from the
    truth.


    He closed the distance and took her into his arms again. “Are you sure?”


    She stared into his crystal blue eyes. She could easily lose her soul in those
    eyes. “No. But yes.”


    He chuckled. “Me too.” He ran his fingers through his hair. “Um. Let’s eat. And
    I’ll tell you about my visit with Dad.” He lifted his shirt and turned it right
    side out. “And then we’ll study.”


    Her breath had returned to normal. She glanced at the boxes. Her King Jr. Meal
    had barely satisfied her hunger, but could she eat an entire box of Moo Goo Gai
    Pan? She nodded. “I didn’t know you were bringing Chinese.” She took a box to
    the couch and eased down. “I ate a kid’s meal from BK.”'
