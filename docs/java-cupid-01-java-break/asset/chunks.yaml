    这太荒谬了！她放松下身体，继续阅读。她用荧光笔敲着下巴，盯着窗外。他在哪儿？她拿起手机，已经八点多开了。无论是披萨还是中餐，取外卖应该不会花这么长时间吧。不知道他决定了吃什么？她的口味并不挑剔。她只是想让迪隆出现在她的怀里，或者躺在她的床上。她渴望抱住他，并被他拥抱。一阵电流流过她的身体核心。现在，食物对她的需求来说是次要的。


    她站起来望向窗外。拒绝开门去停车场寻找，她强迫自己坐回去。她滑过联系人列表，选中了他的名字，发了短信：“你晚餐在哪儿买的？洛杉矶？还是纽约？大哈哈”


    她希望他能看懂这个幽默。她的胃收缩了一下。他在哪儿？


    没有回复。


    她又发了一条短信：“迪隆？你在哪？”


    手机响起了默认铃声。她差点掉掉手机。未知号码。手机在响响时，她盯着它。然后接通了电话。“喂——喂。”


    “温迪！”一个女人在电话里低声说。


    她咽了口唾。“喂？”


    “我是布伦达·巴斯斯。同事。”声音里带着情感波动，“听着，你得立刻来急诊室。”


    “为——为什么？”温迪胃里翻腾了一下。恶心感在舌根蔓延。


    “你知道告诉你这些我违反了医疗健康隐私保护法（HIPPA），但你必须知道。”布伦达压低声音道，“是迪隆。快来！”


    ![Image](img/00004.jpeg)


    温迪尽力向急诊室入口跑去。她喘着粗气冲到接待台。“迪隆·凯恩？”


    一个脖子上缠着大绷带的年轻女性从电脑前抬起头。“凯恩家人在那边，女士。”她指了左边。温迪的眼睛射向那个房间。她的母亲正盯着天花板。“妈？”


    她的母亲正在看挂在高处天花板上的某部情景剧。她低下目光对上温迪的眼睛。“噢，亲爱的！”她跳起来抱住女儿。她的眼睛红肿着。


    温迪冲进休息区。“发生了什么？”


    “我们还不确定。布莱克正和他在一起，但——”


    “我不明白。迪隆今晚本该来我公寓的，他发生什么事了？”


    “发生了意外。”


    温迪吸了一口气。


    “就在医院，据我了解是这样。”母亲继续道，“他昏迷了。我只知道这些。”


    温迪闭上眼睛，试图理解母亲说的话。“布莱克和他在一起？”


    “是的。现在只允许一个人在他身边，所以，理所当然，布莱克进去了，我答应过我会在这里等。”母亲向后靠着看着她。她拨开眼前的一缕头发。“你想要什么吗？吃点什么，还是喝咖啡？”


    “不用，妈。”温迪推开她的手。“我只想知道迪隆无事。”


    温迪咬着唇，瞥了一眼已经回到电脑前忙碌的接待员。


    温迪再次走到台前。“一下！”


    女人平静地抬起头，但一言不发。


    “你能联系上布莱克·凯恩吗？他是迪隆·凯恩的父亲，现在正和迪隆在一起。你能告诉他我在这里吗？我是温迪·艾斯顿。”


    她笑了，但看起来并不友善。“我看看能做什么。”她拿起黑色手机按了一个键。“是的，我这儿，”她把听筒抵在肩膀上，“你叫什么名字来着？”


    “温迪·艾斯顿。”


    “我这有个温迪·艾斯顿，她想让凯恩父亲知道她在这里。嗯。好。知道了。我会告诉他的。”


    “护士说他们会通知他的。”


    温迪盯着她。难道她真的没别的办法了吗？她转身看向母亲。“发生了什么？”温迪指着自己的脖子，示意那个女人的绷带。也许如果她和对方成为朋友，就能从她那儿打听到什么。


    “噢，没什么。我有纹身。我们在公共区域工作时被要求把它们盖住。仅此而已。”


    温迪点了点头。“噢。真扫兴。”


    女人翻了个白眼，耸了耸肩。“是啊，那是个很酷的纹身。”


    “我敢信。”温迪笑了，越过母亲肩膀看向她妈妈。她妈妈坐在椅子上，焦虑地看着温迪。


    她转回那个女人。“好的。谢谢。”


    温迪垂着肩膀走回母亲身边。她瘫坐在椅子上，揉了揉大腿。她的下巴在颤抖，但她强忍着。


    很快，布莱克穿过双门走进来，看起来很困惑。他发现了帕蒂和温迪，迅速朝他们走来。温迪跳起来，在地板中间与他相遇。“他怎么样了？”温迪现在无法停止流泪了。


    布莱克双手按在她的肩上，直视她的眼睛。多像迪隆。


    “他没事。”


    温迪扑进他的怀里抱住他。


    布莱克拍了拍她的背，把她拉开。“他脑震了，两根肋骨骨折。一个肺挫了，短期记忆有问题。但医生说那会过去的。他们给他用了痛泵，等会儿要把他转到这里的 ICU。”


    “噢，妈！”温迪扑进母亲的怀里。帕蒂抱着她让她哭。终于，她找回了主控，抬起通红肿肿的眼睛。温迪终于问：“这是怎么发生的？”


    布莱克引导两个女人坐在椅子上，告诉温迪迪隆是如何碰到带电的盒并从梯子顶掉下来的。“他很幸运没有更严重。”


    温柔、关心的目光对上温迪的眼睛。“医生说他几天后就会好。肋骨需要好几周，挫青会自己愈合。他会很疼一段时间，大约六到八周，但这不是他以前没经历过的。”布莱克的眼睛湿润了。“那次我们差点失去他了。我觉得我的迪隆有一个守护天使在加班。”他轻声笑道。


    *守护天使？* 温迪心想，或许还有一个 Java 版的丘比特神。温迪走向布莱克，用一个充满爱的家庭拥抱按住他。他们都爱迪隆，也同样高兴他没事。她擦了擦眼睛，退后一步。“能见他吗？”她吸了吸鼻子。


    “当然。”布莱克也擦了擦眼睛。


    他们走到接待台。布莱克敲了敲台。“玛丽娜，能让我们进去吗。”


    玛丽娜从电脑前抬起头。“我查查。”她拿起手机按了一个键。“是的，凯恩先生在这儿。嗯。好。他要求回来。”


    温迪的胃收缩了一下。迪隆怎么了？


    “不，就在这儿。”她没有任何表情地抬起头。“好的。”她在便签纸上写了什么。“好的，我会告诉他们的。”她挂了电话。“他要转过去了。”


    “转到 ICU？”布莱克问。


    “不是。转到房间。”玛丽娜把便签纸给了布莱克。“你可以先上去。他可能比你先到。”她第一次笑了。


    “谢谢。”布莱克说道，引导温迪和妈妈走向电梯。


    ![Image](img/00004.jpeg)

