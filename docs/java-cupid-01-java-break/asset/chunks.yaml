  raw: 'Aurora sighed dramatically. “Oh well, I guess it’s my loss, Prince Charlie.
    I’ll just have to wait, because some day my prince will come.”


    Charlie shook his head. “No dat’s Snow White. You is supposed to say once upon
    a dream.”


    She smiled. “You’re right, how silly of me to forget.”


    Charlie stood. “I has to get back to work now. afore Mr. Carl gets upset with
    me.”


    Rob handed the young man his phone. “Thanks for your help, Charlie, if Mr. Carl
    says anything you tell him I asked you to help me.”


    “Oh-kay! Bye Princess Aurora. I has to go work now.”


    “Bye, Prince Charlie.”


    Rob sat back in his seat. “Hey, can you text me that photo of us? I want it for
    a character sheet.”


    Aurora looked at him. “Seriously, or are you just trying to get my digits?”


    He smiled. “And here I thought I was being all smooth about it. No I really want
    that picture, but if you don’t want me to have your number, I can understand that.
    I wouldn’t want your boyfriend to see my number on your phone and get upset.”


    She laughed. “Oh, you’re good. You thought you could trick me into telling you
    if I had a boyfriend or if he was the jealous type.”


    He smiled. “Well I know there isn’t a husband, no ring. So, Prince Charming Eric
    hasn’t arrived yet.”


    “Philip, Eric is Ariel’s prince. Boy for a romance writer you don’t know your
    Prince Charmings very well.”


    “No, I don’t, but in my defense, I write about cowboys and everyday people. No
    royalty in any of my books.”


    “Give me your number. There’s no guy to make jealous, so it’s all good.”


    He rattled them off, and she typed them in. In just a moment, he got the ding
    of a text message coming in. He opened it, and saw their photo. He saved it and
    then saved her contact info. “What is your last name Princess?”


    She sighed. “Are you going to call me that from now on?”


    He smiled “Only till you become my queen.”


    “I can’t become your queen.”


    “Why not?


    “Your name isn’t Phillip.”


    He looked at her, and let some of the heat she made him feel show in his eyes.
    Not enough to scare her away, but enough to let her know he wasn’t flirting without
    purpose. “I’ll change it for you.”


    “Well, before you do would, you sign your book for me?”


    “Sure, under one condition.”


    “What’s that?”


    “Have dinner with me tonight.”


    She bit that lip again. If she kept that up, he was going to have to have a little
    taste to find out what she thought was so great about it. “I can’t tonight’s my
    writers’ group. Unless you want to come with me.”


    “To your writers’ group?”


    “Yes, I know they’d love to meet you. None of them are as successful as you, but
    there are a couple of authors in the group. There’s five of us.”


    “Well, I wanted to get to know you better. But you said they wouldn’t believe
    you met me, so sure. I’ll go to your group with you. Do you all eat at this meeting?”


    She laughed. “When do writers not eat?”


    “That’s true. Okay, what time?”


    “We meet in the bar and grill here at six.”


    “Then I should pick you up at what time, five thirty?”


    “I could just meet you here.”


    He reached out, took the book out of her hand, and placed it on his table, then
    took her hands in his. “Oh no, Princess. A Prince always picks up the princess
    for the ball.” 


    She giggled and turned pink. “No ball, just writers helping each other and critiquing
    a chapter if you want them to.”


    “I will still escort you, fair maiden.”


    “Fine, I’ll text you my address, and five thirty is perfect.”


    He let go of her hands and pulled a sharpie out of his computer bag, opened the
    cover and wrote a little note to her and signed it. Then he put the book in her
    backpack. When she reached for it, he stopped her. Don’t read that till later,
    please.”


    She started to ask why when his watch started beeping. He sighed. “I have to go.
    I’m meeting with my editor about the next Phantom Horse book in a few minutes.”
    He looked at her empty coffee cup. “You gonna stay and write some more?”


    She nodded. “Yes, I want to finish this chapter so I can share it tonight.”


    “Okay, let me get you another cup of coffee. What are you drinking?” 


    She looked down at her empty cup. “Oh, I’m out! It’s a Cinnamon Caramel Latte
    with extra whip and extra Caramel.”


    He smiled. So that spicy smell had been cinnamon. “Be right back.”


    He went up to the counter and placed her order and a Hazelnut iced for himself,
    to go. Ashley Lefevre handed him his order “There you go, R.G. I see you found
    a muse today.”


    He winked at the girl. “I think maybe I did, Ashley. But you’re still the driving
    force behind my frantic typing speed. Well, you and this drug you push at me.”


    She laughed.


    He walked back to the woman who had caught his interest. “Here you go, Princess.
    A drink fit for a queen.”


    She took the cup absentmindedly as her other hand kept punching away at the keyboard.
    He recognized that look, someone was in the zone. He packed up and left without
    another word. He’d text her later to remind her to send him her address. But now
    he needed to rush if he was going to make it to his appointment on time. 


    Aurora looked up from the scene she was writing to say good-bye to Robin only
    to realize he was gone. Sitting beside her was a fresh coffee. She picked it up
    to take a drink when words on the side of the white cup caught her eye. “**My
    love is your H.E.A.**”


    She smiled. R.G., she thought. Maybe he wasn’t just flirting with her. Maybe he’d
    felt the tingles that raced through her every time he’d touched her, too. She
    took a sip wondering if his kisses would be as hot as those he wrote in his novels.
    Maybe she’d have to find out after group tonight.


    ~~End of Sneak Peek~~


