    the shaft of the bone, like a barber pole stripe, plus, as if that weren’t enough,
    comminuted means it broke in three places at the center of the spiral break.”
    She sighed. “Damn ski didn’t break away from my boot like it was supposed to.
    So, as I tumbled…” She smiled, but it came across more as a grimace.


    Nodding, he shoved his grey hoodie off his shoulders and pulled his arms out.
    Then lifted the long sleeves of his t-shirt to expose surgical scars along his
    forearms. “Both arms; radius and ulna” —he pointed to the injured bones as he
    called them out— “right femur, shoulder blade, and four ribs. Mostly my right
    side.”


    Wendy stared at him in dismay. “Wow.” She whispered. “How?”


    “Motorcycle. I zigged, it zagged. It wasn’t pretty.”


    She touched his forearms with an index finger and gingerly traced the violet scar.
    “When?” She lifted her eyes to meet his.


    He sighed and pulled down his sleeves. “Three years ago.”


    **THREE**


    **![Image](images/00006.jpeg)**


    Wendy and Dillon stayed on the couch talking and sharing their accident and recovery
    stories. “That’s why I want to be an orthopedic nurse. Because of the way some
    of those nurses treated me. They jerked me around in the bed and had no clue how
    much pain they caused me. I decided then and there, I’d become a nurse and my
    patients would never suffer like that in my care.”


    “Yeah, same for me. After I went through rehab, I looked around at all the archaic
    and medieval equipment they had for us to work with and decided to become an engineer.
    I want to design equipment that will really help with rehab. I’m telling you,
    some of those apparatuses was straight out of a torture chamber somewhere deep
    in a dungeon in England.” 


    She giggled and he chuckled.


    “I know what you mean. One time—”


    They continued to talk, laugh, and share horror stories. She enjoyed his company
    and he seemed comfortable with her. He had been through a lot. Of course, so had
    she, but she didn’t have the number of broken bones he did. Was this what he meant
    when he said he was broken without her? How did he know about her break when he
    wrote her that message? Or was it simply a coincidence? He seemed genuinely surprised
    when she told him in the break room. She made a mental note to ask him about that
    sometime. But for now, she enjoyed talking with him. He had such a pleasant voice.


    A knock came to her door. Dillon glanced an inquisitive look at her. “You expecting
    someone.”


    “No, but they show up anyway.” She muttered. Rising from the couch she opened
    the door.


    Her dad stepped across her threshold and then halted. “Oh. I didn’t realize you
    had company.” He looked around the room. “Hey, you cleaned up!”


    Wendy sighed heavily.


    Dillon stood. Lance put out his hand and Dillon shook it. “I’m Lance Ashton, Wendy’s
    dad, and you are…”


    “Dillon Cayne, sir.”


    “Sir!” Her dad turned back to Wendy. “I like him already!”


    Wendy made exaggerated eyes at her dad. “So, you want something or are you just
    here to embarrass me?”


    “Oh!” Lance opened her door but didn’t walk out. “No. I just ordered a pizza and
    wondered if you wanted to come over for some.”


    “We’re fine, Dad.” She shook her head.


    “Okay, if you’re sure.” He glanced at Dillon, “You’re welcome, too. I ordered
    a large.”


    Dillon looked at Wendy for guidance. She shook her head. “Thank you, Mr. Ashton.
    But I think we’re good.”


    “Alrighty then.” Lance hesitated as if he wanted to say something else, but then
    tossed a wink at Wendy and left.


    “Yeah.” Heat filled Wendy’s face. “So, that was my dad.”


    Dillon nodded. A slight smile curled one side of his mouth. “He cares about you,
    a lot. That’s nice.”


    “Cares about me?” Wendy giggled. “More like smothers me to the brink of death,
    then releases the pillow and lets me get a breath of air.”


    Dillon sat back down, bracing his left arm on the back of the couch, and gestured
    for her to join him. She eased down next to him. He lowered his arm to her shoulder.


    His warmth calmed her frazzled nerves. Her dad’s intrusion faded. “I’m sure he
    means well,” she muttered.


    “My dad’s the same way.” Dillon stared at the opposite wall. “He tries to take
    care of me. But I stand my ground and make him back off. Ever since my accident,
    and then Mom’s cancer—”


    Dillon cleared his throat and fell silent.


    Wendy sat up straighter. “What about your mom?”


    Dillon stared at his lap a long time. Finally, he lifted his eyes. Tears had pooled
    there, but didn’t spill. “She died last year. It was a long, terrible ordeal.
    She had MS. Dad took good care of her, though. Now that she’s gone, I think he
    feels like he needs to take care of me.” Dillon made a gesture of a smile, but
    sadness lurked in every part of his face.


    Wendy wanted to make that sadness go away. Her eyes darted from his eyes to his
    mouth. She leaned into him, her eyes still flitting from his eyes to mouth, until
    she was too close to see anything but his eyes. His gaze held with hers and he
    pressed into her, consuming her mouth. She pressed even harder and wrapped her
    arms around his neck. He wrapped his right arm around her waist and pulled her
    against his chest. She lowered her hand and found the bottom of his t-shirt, slipping
    under, she gripped his abdomen. He gasped. His muscles hardened at her touch.'
