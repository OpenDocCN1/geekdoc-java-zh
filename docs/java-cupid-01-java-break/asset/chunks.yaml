    you. Like your dad does.”


    They laughed.


    “So, what’d your dad say?”


    He took a long breath. “Yeah, so you know how I told you he’s dating some floozy,
    right?”


    She lifted a bamboo shoot with chopsticks and shoved it in her mouth. “Right.”


    “Well.” Dillon chuckled. “I told you I haven’t met her yet.” He lifted a baby
    corn cob and dropped it, he shoved the chopsticks into the vegetables and squeezed
    them together, bringing out a mushroom and rice. He quickly put it in his mouth
    and wrapped his lips around the sticks.


    She couldn’t help but stare at those lips. She wanted to taste that mushroom.


    “…Yeah.”


    “Well, that’s going to change.” He shoved the sticks in his food and lifted his
    eyes to meet hers. “Dad wants me to meet her Saturday evening.”


    “Really?” She slid a cluster of vegetables and rice off her chopsticks. “How weird.
    My Mom arranged for me to meet Mr. Douche Bag Saturday, too.” She wrinkled her
    nose. “How strange.”


    “Huh. Well, I have an idea.” Dillon smiled. “Let’s you and me get together Saturday
    morning, have breakfast, and go play some laser tag—if you want. And then we can
    get cleaned up for our debut with our parent’s new sex toys.


    “Eww. Don’t put it like that.” She frowned. “That’s a visual I don’t want in my
    head. But, breakfast and laser tag sounds perfect.”


    “Really?” Dillon’s eyes sparkled. “You, Miss Wendy, are the girl of my dreams.”


    “Aw. You say the sweetest things.” Heat filled her face. She ate her food, even
    though she wanted to set it aside and do naughty things with him, instead. But
    she seriously had to get some studying done.


    She couldn’t afford to fall behind. There weren’t enough hours in a day for her
    to get caught up if she ever got behind. Besides, if she was going to spend the
    morning and afternoon with Dillon and then all evening with her mom and Mr. Douche,
    she had to get ahead and stay ahead.


    ![Image](images/00004.jpeg)


    Wendy’s breakfast sat a little heavy in her tummy as Dillon parked at the Epic
    Events Center. Why did she opt for the Cowboy’s Breakfast with two meats, hash
    browns, and two eggs? She could have ignored the two pancakes, but who can resist
    two golden cakes drenched in whipped butter and syrup. Dillon laughed as he ate
    his yogurt and granola.


    “What a girl’s breakfast!” she had teased him.


    “You wait. I’ll have the advantage later!” He drank down his non-iced water.


    “Ha! You’ll be hungry and I’ll be energized with all these carbs and protein!”
    She quipped. Lifting her mug of coffee and finishing the last dregs. “And caffeinated!”


    He chuckled. “We’ll see.”


    She smiled even though her stomach was uneasy and followed him into the huge building.
    He knew where he was going as he strode past several pay counters and stood in
    line at a neon wrapped booth. Black lights exposed multiple white cords on black,
    skin-tight Borg-like workers. Dillon paid and the female Borg pushed a button
    which lifted a horizontal door. Wendy followed him through the portal to a set
    of computers. She placed her feet in the outline on the floor and looked into
    the screen. Instructions indicated: “Smile and Press Enter”


    Wendy smiled and reached for the key.


    “No!” Dillon leapt to her station. “You’re not making a College ID! Make your
    warrior face. You’re Warrior Wendy!”


    She laughed and made a mean, scrunched up face. He pushed enter and a card flopped
    out on the table. “What do I do with this?”


    This gets us our laser vests and guns. He led the way into the dark room. Black
    lights transformed everything into either black matter or neon colors. She giggled.
    “I should have rethought my shirt. It’s seemed cute for our first date.” The white
    striped and cream lace trim were definitely a disadvantage. Dillon bellowed, “Wahahahaha!
    Warrior Wendy has a handicap. We shall up your life points and give you a head
    start!”


    A high school boy with a yellow wrap-over vest approached them and began giving
    instructions. His name was Jalen. He helped Wendy choose a vest that fit her smaller
    frame, and showed her how to adjust the side straps so it could be snug. He handed
    her a laser gun.


    She leaned into the boy and whispered, “How does this work?” She glanced at Dillon
    who was springing up and down as if to warm up. They boy lowered his voice and
    showed her how to shoot the gun, he also gave her some insider tips on how to
    maneuver through the field and catch her opponent unawares. She whispered, “Thanks!”
    And approached the Mighty Dillon of Askari.


    “You ready?” She goosed him in the side with her gun.


    Still bouncing up and down. “Wait. It’ll say when.”


    “Oh, okay.” She paused and listened. A synthesized voice bellowed across the room.
    “Let the Game Begin!”


    Wendy took off to her left.


    “Wait!” Dillon called after her. “Wendy, Wendy, wait.”


    She stopped and turned to him, concerned something was wrong. 


    He shot her sensor points. A loud ping sounded from her vest. “Oh you!” she squealed
    and shot at his vest, but he had run around a corner. ”You just wait, Mighty Dillon
    of Askari!”


    She ran the way she had started. Jalen had told her about some excellent advantage
    spots where she could easily track Dillon’s movement and shoot him without him
    even knowing she was in range. Some unfamiliar voices echoed in the field. They
    weren’t alone. Was she supposed to shoot them, too? Or only the opponent she came
    with? Just then her vest pinged.


    “Ah, man!” Apparently you shoot whoever is wearing a blue vest. She was red… with
    neon white strips. Basically she was a walking neon target!


    She dashed behind a pillar and peeked over the railing. Dillon had snuck down
    to the lower level and was working his way between a wall of neon painted rocks.
    Were we supposed to climb that to get up to the upper level? She had no idea,
    but she wasn’t about to try it either. This level was good enough for her. She
    took aim and shot at his blue tri-points. His vest pinged and he hollered. “Where
    are you?”


    She ducked behind the large pillar that framed the railing. He spun around looking
    for her and she shot him again.


    “Ugh!” he groaned. She giggled. A red-vested kid came up beside her. “Hey.”


    “Hey.” The kid looked at her inquisitively. “That your opponent?”


    She nodded.


    The kid, he had to be ten or twelve, leaned out and shot Dillon. “Ah, come on!”


    She lifted her hand and high-fived the kid. “Thanks.” He nodded with such sincerity
    and ran off for his next victim.


    “Oh, Warrior Weeeendy!” Dillon’s voice echoed from below.


    She pursed her lips and sought another of Jalen’s suggested hiding spots. It was
    another great place. She hit Dillon’s vest sensors six times. He only shot hers
    three.


    “Warrior Wendy, you’re the high score player!” the synthesized voice echoed across
    the field. “AH! You Lucky Lucy!” Dillon’s voice echoed across the room. She moved
    to find him and tell him “Good Game.” She hurried to the stairs, how’d he get
    down there? As if summoned, Jalen came out of nowhere. “Oh! Jalen.” Wendy reached
    out to stop him. “How do I get down there?” She pointed over the railing.


    “Follow me.” He led the way to an industrial ladder with a fall cage. She thanked
    him and descended the ladder. She looked right and left, no Dillon. “Dillon?”
    she called.


    A faint voice came from her right. “Yeah.”


    She followed the sound and found him leaning against the large cylinder. He held
    his rib cage under his right arm and breathed shallow. She hurried to him. “You
    all right?”


    “Yeah.” He barely breathed the word. “Some punk slammed into me. Didn’t mean to
    hurt me. But, man. It really took my breath.”


    Wendy wrapped her arm around him and slipped her head under his arm. “You need
    my help?”'
