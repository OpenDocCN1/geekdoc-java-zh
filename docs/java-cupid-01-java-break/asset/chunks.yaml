    Wendy put her phone on silent, then slipped it into her backpack. Class was about
    to begin and she didn’t want to get kicked out because her mother couldn’t help
    but get the last text in. Even if it was just an emoji. A slight vibration reverberated
    against Wendy’s back. One corner of her mouth lifted. She knew her mother so well.


    Four changes of clothes lay on Wendy’s bed. She stood in her closet staring at
    what was left. Jeans? A dress? A skirt and a nice blouse? Dress pants? She lifted
    her phone and texted Lindsay. “WHAT TO WEAR?”


    Three dots blinked as she waited for Lindsay response. “Wear your green jeans
    and that grey sweater.”


    Brilliant! Wendy pulled those two items from their hanger. “Shoes?” she texted.


    “Those black ankle high boots.”


    Perfect. Wendy lifted them from the shelf. “THX”


    “Sure. LOL”


    Wendy dressed and ran a comb through her hair. She applied more powder and some
    blush. Then freshened her lip gloss. There. That’s as good as it gets. She stared
    at her reflection in the mirror. Just then her doorbell rang and her stomach did
    a somersault. *Oh God! This is such a bad idea!* She hurried to the door and pulled
    it open.


    Lindsay was right. Hans was tall, dark, and handsome. Obviously of Italian descent.
    He looked like a matrix character in a long black duster, black pants, and a dark
    blue silk shirt. His hair looked wet and combed straight back. His eyes were dark,
    but his teeth were white. He had a nice smile. “Wendy?”


    She smiled back. “Hans?”


    He smiled and put his hand out to shake hers. Awkwardly, she shook his.


    “Are you ready to go?” He had a nice voice, too.


    “Sure, just let me get my coat and purse.” She stepped back to retrieve both.
    Hans waited on the stoop. Why hadn’t she invited him in? Slipping up to his side,
    she walked with him to his car. “Nice Charger.” She said as he unlocked it with
    the remote and opened her door.


    “Thanks. It’s was a Christmas present from myself.” Pride sparkled in his smile.


    He eased down in the driver’s seat and started the engine. The throaty roar as
    he revved the Hemi was exciting. He turned to her with his hand on the stick shift.
    “Where do you want to eat?”


    She chuckled. “Anywhere but Red Robin.”


    He nodded and pursed his lips. “Quiet or fun?”


    She considered his question. Quiet would be nice so they could get to know each
    other. Fun would be… well fun. Like the laser tag date she’d had with Dillon.
    Suddenly, she felt guilty for being here, in Hans’s car. What was she thinking?
    “How about quiet.”


    “Quiet, it is.” He put the car in gear and popped the clutch.


    She had no idea where they were going. Her stomach churned with acid. Hunger was
    the furthest thing from her wants or needs. She wished she’d never agreed to this
    date. How did she let Lindsay talk her into this? He pulled into a CiCi’s Pizza
    parking lot. This was his idea of quiet? Everybody she knew came here to eat.
    Even though they were having an early dinner… still.

