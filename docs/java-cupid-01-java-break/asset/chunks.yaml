    Lindsay sipped her wine and listened without saying a word. When Wendy ended her
    tale with a long sigh, only then did her best friend speak.


    “So. This ‘Priscilla’ wouldn’t happen to be Priscilla Langley, would she?”


    Wendy lifted tear soaked eyes. “Yes. How’d you know?”


    Lindsay lifted her manicured eyebrow and gulped a drink of wine. “Oh, Wendy. I
    can tell you stories about Priscilla Prissy Priss. She’s a pathological liar.
    She IS psycho! My cousin, `Dean`, met her at Brother’s Sports Bar. She latched
    onto him like he was the last man standing. He thought it was great, at first.
    You know how sweet he is?”


    Wendy nodded.


    “Then she turned weird, psycho-bitch, crazy on him. Accused him to seeing other
    women, when he had only come over here to hang out, like we all do. She’d been
    here with him and knew I was his cousin. She was like a Russian spy, I’m telling
    you. She’d lay a strand of hair over his car keys so she could tell if he had
    left the house. She poured a jar of honey in his tackle box so he couldn’t go
    fishing and leave her alone. She keyed his car—“


    “That sweet mustang?” Wendy’s eyes went wide.


    “Yes! Let’s see, then she became the stalker bitch from hell. She followed him
    all over town. She’d show up at his work and tell them her grandmother died. `Dean`
    would rush out to the lobby to talk to her and she’d be all psycho-screaming at
    him to come back home. They had to ban her from the building. `Dean` had to take
    out a restraining order. It was ridiculous.


    “She accused me of having an affair with him. She sent me text messages calling
    me everything but a white woman. I kid you not, Priscilla Langley IS CRAZY.


    And then she had somebody’s baby, apparently she doesn’t even know who’s it was.
    Her parents had enough of her and tossed her to the curb, but they got custody
    of her kid and are raising him as their own. That’s what `Dean` said.”


    Wendy cocked her head back. “`Dean`’s not—“


    “I have no idea. He swears it’s not, but honestly who knows. It’s sad really.
    I feel sorry for the kid.”


    “Well, sure. But—“


    “No.” Lindsay held up her hand. “Don’t go there. `Dean` and I had a long talk.
    Even if the kids was his, her folks are richer than God and he’s better off with
    them. `Dean` couldn’t do for him what they can.”


    “Well, sure, but… okay. Leaving that alone. It just makes my stomach hurt to think—“
    Wendy looked up at Lindsay and sighed. “Shutting up now.” She sipped her wine.
    Lindsay poured herself another.


    “Look.” Lindsay suddenly blurted. “If you’re not sure about this `Dillon`, how
    about I fix you up with my friend, `Hans Jaeger`.”


    Wendy shook her head.


    Lindsay scooted further back on her couch and tucked her feet under her bottom.
    “No, really. He works with me at the Law firm. He’s a paralegal like me. And he
    so cute! He’s tall… and handsome—”


    “So what’s wrong with him?” Wendy giggled.


    “Nothing!” Lindsay gulped her wine. “I swear!”


    “Uh huh.”


    “Just go out with him. At the least, it’ll get your mind off this mess with `Dillon`
    and maybe you can think more clearly. How about a movie or the museum? Yeah, the
    museum. You love museums and that way you can talk and get to know each other.
    I’ll call him right now.” She lifted her phone and texted.


    Wendy drew in a long slow breath. What was she letting Lindsay talk her into?
    Like she said, at least it’d get her mind off the mess she’d made of things with
    `Dillon`. Who knows, maybe `Hans`—the name alone. She shook her head. How could
    anybody named `Hans` replace her `Dillon`. Did she really have time to date other
    people? She had so much studying to do, and she was falling behind, quickly. “Listen,
    Lindsay, I don’t think this is a good idea.”


    “Too late.” Lindsay’s cheeks reddened with the wine. “He said for you to let him
    know when. He’d love to meet you and the museum sounds great.”


    Wendy sighed. “Ah. What have you gotten me into? I’ve got so much studying to
    do, Lindsay, you just don’t know.”


    “So, go home and study. When’s your next day off?” She leaned against the back
    of her couch with her elbow and cradled her head in her hand.


    Wendy lifted her cell and opened the `calendar app`. “I’m off tomorrow. But I’ve
    got class until one.”


    “Great.” Lindsay poured another wine and topped Wendy’s glass off. “That gives
    you plenty of time to get caught up on your studies and you can go out with `Hans`
    tomorrow afternoon, make it an early dinner.” Lindsay texted the message.


    Wendy considered her friend’s plan. Why not? If nothing else, she’d make it clear
    to `Dillon` he wasn’t the only fish in the pond. But why did Lindsay’s friend
    have to be named `Hans`? She envisioned a huge blond behemoth with silver shark-like
    teeth who spoke broken English, if he spoke at all. She took a deep breath. “Okay.
    I better go home and work on getting caught up.”


    Lindsay stood with a slight sway. “Good for you.” Her words were slurred. Wendy
    glared at her and handed her the wine glass she had not finished. “Here. Don’t
    you go anywhere. You’ve had too much to drink.”


    “I won’t.” Lindsay hugged Wendy. “Me and `Zelda` are gonna watch some TV and go
    to bed.”


    “Okay.” Wendy hugged her friend one more time. “Thank you. I think.”


    Lindsay laughed. “You’re gonna love `Hans`, he’s a sweetheart!”


    # EIGHT


    ![Image](images/00011.jpeg)


    Wendy avoided the `Java Cupid` the next morning by going to the `Conoco Station`
    for her morning coffee. She winced when she sipped the thick `Mocha Cappuccino`,
    but at least it had caffeine. She couldn’t help herself when she drove toward
    the college and pulled into the Java Cupid strip mall parking lot. God, who’s
    the stalker bitch now? She drove slowly by the large glass windows and squinted
    to see the barista counter. She recognized `Dillon`’s tall frame and black apron.
    He was waiting on a blonde woman.


    Wendy slammed on her brakes and stared at the woman. She bounced up and down elated
    about something he had said. Then jumped and landed, sitting on the counter, and
    flung her arms around his neck. Priscilla!


    Oh man. `Dillon` deserved an Oscar for that performance yesterday. Wendy punched
    her gas pedal and sped out of the parking lot. What a fool she had! She shook
    her head as she drove through a red light. Instantly, a siren screamed behind
    her and red and blue lights filled her rearview mirror.


    She blew her bangs and eased over to the curb.


    Officer McVey was polite but firm. But then again, Wendy spoke respectfully to
    him, too. She never wanted to vent her frustrations on a cop. Especially one who
    just caught her driving recklessly through an intersection. How long had that
    light been red? She honestly had no idea.


    “I’m sorry, Officer. I was distracted. That’s all I can tell you.” Wendy said
    honestly.


    “Well, ma’am, I need you to focus and pay more attention.” He tore the ticket
    and handed it to her.


    She turned it over and groaned. “Two hundred and forty dollars.” How was she going
    to pay that? She had two weeks, according the fine print at the bottom. Maybe
    she could pick up some extra shifts. So much for having a weekend to study. She
    sighed and pulled her safety belt back into place. Pulling away from the curb
    she let her mind wander back to Priscilla leaping on the counter and hugging Dillon.
    What had he said to her? She shook her head.


    What a jerk!


    Maybe `Hans` will be a more trustworthy guy. A paralegal, like Lindsay. If her
    best friend was any indication of the personality of the occupation, this date
    had a lot of promise.


    She pulled into the college student parking and headed to class.


    Her phone chimed. Mom. “How was your coffee boyfriend this morning?” Mom texted.


    Wendy rolled eyes. She didn didnt have a clue. “Don’t know. Went to Conoco, instead.”


    “Yuck. LOL” her mom responded.


    “IKR?” Wendy replied. The only two text acronyms her mother knew was Laugh Out
    Loud and I Know, Right. Anything else, and she’d be taking more time to explain
    what the letters meant and she didn’t have time for any more convo with her mom
    this morning.

