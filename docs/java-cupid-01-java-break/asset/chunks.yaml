    He breathed deeply, as she stood next to his bed. Mostly, he slept in the middle
    so she could slip in on this side or the other, but either way, she’d be limited
    in space. No matter, she’d snuggle up to his body and be there when he roused.
    A thrilling sensation coursed through her. Her body longed to be skin to skin
