    This is ridiculous! She eased down and resumed reading. Tapping the highlighter
    on her chin, she stared out the window. Where was he? Lifting her phone, it was
    after eight. Surely it doesn’t take this long to pick up carry out, be it pizza
    or Chinese. Wonder which he decided on? Her palate had no preference. She just
    wanted Dillon here, in her arms, or in her bed. She longed to hold him and be
    held by him. A thrill shot through her middle parts. Food was secondary to her
    needs right now.


    She stood and stared out the window. Refusing to open the door and search the
    parking lot, she forced herself to sit back down. She thumbed the text list, selected
    his name, and texted, “Where’d you get dinner? Los Angeles? New York? LOL”


    She hoped he got the humor. Her gut clenched. Where was he?


    No response.


    She texted again, “Dillon? Where are you?”


    Her phone rang the default tune. She nearly dropped it. Number unknown. She stared
    at it while it rang. Then answered it. “H-hello.”


    “Wendy!” a woman hissed into the phone.


    She swallowed. “Yes?”


    “This is Brenda Barnes. From work?” Emotion cracked in her voice. “Listen, you
    need to come to the ER, right away.”


    “W-why?” Wendy’s stomach flipped over. Nausea lapped at the back of her tongue.


    “You know I’m breaking HIPPA telling you this, but you need to know.” Brenda hiss
    in a whispered tone. “It’s Dillon. Hurry!”


    ![Image](images/00004.jpeg)


    Wendy ran as best she could into the ER entrance. Gasping for breath she rushed
    to the receptionist counter. “Dillon Cayne?”


    A young woman with a large bandage on her neck looked up from her computer. “Cayne
    family is over there, ma’am.” She pointed to her left. Wendy’s eyes shot to the
    room. Her mother stared up at the ceiling. “Mom?”


    Her mother was watching some sitcom on a TV mounted high on the ceiling. She lowered
    her gaze to meet Wendy’s. “Oh, honey!” She leapt to her feet and hugged her daughter.
    Her eyes were red and swollen.


    Wendy rushed into the waiting area. “What happened?”


    “We’re not sure, yet. Blake’s in with him, but—“


    “I don’t understand. Dillon was supposed to come to my apartment tonight, what
    happened to him?”


    “There was an accident.”


    Wendy gasped.


    “Here in the hospital, as I understand it.” Her mother continued. “He’s unconscious.
    That’s all I know right now.”


    Wendy closed her eyes and tried to comprehend what her mother had said. “Blake’s
    with him?”


    “Yes. Only one person is allowed with him right now, so, of course, Blake went
    in and I promised him I’d wait here.” Her mother leaned back and looked at her.
    She pushed a strand of hair from her eye. “You want anything? Something to eat,
    or a coffee?”


    “No, Mom.” Wendy brushed her hand away. “I just want to know Dillon’s alright.”


    Wendy bit her lip and glanced at the receptionist who had returned to whatever
    she was doing on the computer.


    Wendy stepped to the counter again. “Excuse me!”


    The woman looked up placidly, but didn’t utter a word.


    “Can you contact Blake Cayne? He’s the father of Dillon Cayne, and he’s in with
    Dillon now. Can you tell him I’m here? I’m Wendy Ashton.”


    “She smiled but she didn’t look friendly. I’ll see what we can do.” She lifted
    the black phone and pushed a button. “Yeah, I’ve got”—she held the receiver against
    her shoulder—“What was your name again?”


    “Wendy Ashton.”


    “I’ve got Wendy Ashton out here and she wants Cayne’s father to know she’s here.
    Uh-huh. Okay. Right. I’ll tell her.”


    “The nurse said they’ll let him know.”


    Wendy stared at her. Was there nothing else she could do? She turned to look at
    her mother. “What happened?” Wendy pointed at her own neck, indicating the woman’s
    bandage. Maybe if she became her friend, she could get some favor out of her.


    “Oh, nothing. I have a tattoo. We are required to cover them up when we are in
    the public stations. That’s all.”


    Windy nodded. “Oh. Bummer.”


    The woman rolled her eyes and shrugged. “Yeah, it’s a really cool tat.”


    “I’ll bet.” Wendy smiled and glanced over her should at her mom. She sat in the
    chair and watched Wendy, anxiously.


    She turned back to the woman. “Okay. Thanks.”


    Wendy’s shoulders rounded as she walked back to her mother. She eased down in
    the chair and rubbed her thigh. Her chin quivered, but she held it all in.


    Soon Blake came through the double doors, looking confused. He spied Patty and
    Wendy and quickly approached them. Wendy leapt to her feet and met him halfway
    across the floor. “How is he?” Wendy couldn’t stop the tears now.


    Blake placed both his hands on her shoulders and looked her straight in the eyes.
    So much like Dillon.


    “He’s alright.”


    Wendy threw herself into his arms and hugged him.


    Blake patted her back and pulled her back from him. “He’s suffered a concussion
    and two broken ribs. One lung is bruised and he is having trouble with short-term
    memory. But the doc says that’ll pass. They’ve put him on a pain med pump and
    are going to move him to ICU here in a little bit.”


    “Oh mom!” Wendy threw herself in her mother’s arms. Patty held her and let her
    cry. Finally, she had control and lifted red, raw eyes. At last Wendy asked, “How
    did this happen?”


    Blake guided the two women to the chairs and told Wendy how Dillon touched a live
    box and fell from the top of the ladder. “He’s lucky it wasn’t worse.”


    Gentle, caring eyes met Wendy’s “Doc says he’ll be alright in a few days. The
    ribs will take several weeks and the bruising will heal on its own. He’s gonna
    be pretty sore for a while, like six to eight weeks, but it’s nothing he hasn’t
    been through before.” Blake’s eyes misted. “We nearly lost him that time. I think
    my Dillon has a guardian angel working overtime.” He chuckled.


    *Guardian angel?* Wendy mused, and a Java Cupid. Wendy stepped up to Blake and
    pressed into him with a loving family hug. They both loved Dillon and were equally
    glad he would be alright. She wiped her eyes and stepped back. “Can I see him?”
    She sniffed.


    “Of course.” Blake wiped his eye, too.


    They walked to the receptionist’s desk. Blake touched the counter. “Mariana, will
    you buzz us in.”


    Mariana lifted her eyes from her computer. “Let me check.” She lifted the black
    phone and pushed a button. “Yeah, Mr. Cayne is here. Uh huh. Yeah, he’s asking
    to come back.”


    Wendy’s stomach clenched. What was wrong with Dillon?


    “No, they’re right here.” She glanced up without any expression, good or bad.
    “Okay.” She scribbled something on a post-it note. “Okay, I’ll tell them.” She
    hung up. “He’s being moved.”


    “To ICU?” Blake asked.


    “No. To this room.” Mariana handed Blake the post-it. “You can go on up. He’ll
    probably beat you there.” She smiled for the first time.


    “Thank you.” Blake said and guided Wendy and her mom to the elevators.


    ![Image](images/00004.jpeg)


    Wendy stayed by Dillon’s side all through the night. The nurses had pulled in
    a chair that made into a bed and Blake had added her name to the list of people
    allowed to remain with Dillon after visiting hours. Early the next morning, his
    eyes fluttered open. “Wendy?” he whispered.


    “Dillon!” She struggled to get up. Her leg had stiffened in the night. It was
    a slow go, but she managed to sit up.


    He winced when he tried to adjust himself in the bed.


    “Take it easy!” she gingerly stood beside him. “Do you remember what happened?”


    “Yeah, I was changing out a ballast, and I forgot to turn the circuit off. Stupid!”
    He punched his forehead with his palm and winced. “My head hurts.”


    “You’ve got a concussion. And you broke two ribs when you fell. You’re pretty
    lucky though. That’s what your dad said.”


    “Dad’s here?”


    “Well, he was. So was my mom. But they went home around one. Your dad let me stay.”


    “Good.” Dillon reached out and took her hand. “I love you, Wendy. I’m so sorry
    about Priscilla and all the mess she caused. I—”


    “Shh. Don’t worry about that now. Besides, I know you’re telling the truth.”

