- fmt: '

    Wendy sat in a student desk, alone. It was an hour before class, but she needed
    to read one more chapter in her OB nursing textbook. Chatter and laughter outside
    the room distracted her, but she didn’t want to walk all the way over to the library
    and back again for class. She pulled her neon orange earbuds from the book bag
    and plugged them into her phone. She had a pre-saved playlist for moments like
    this. A three-hour rain forest relaxation recording filled her hearing and she
    lowered her eyes to the text and read.


    She loved the sound of rain. Or at least, she used to. Now it reminded her of
    last Sunday. Dillon came over and she confronted him about Priscilla answering
    his phone the night before.


    Priscilla! She couldn’t even think of the name without wrinkling her nose like
    she’d smelled a stink bug. A term her mother often used.


    The sky poured that day, and Wendy poured out her heart to Lindsay that afternoon.
    Lindsay’s solution: Go out with another guy. Her best friend sounded like her
    dad: *Get back on that horse!* She shook her head. What was she thinking going
    out with Hans when she should have been studying? She wouldn’t be sitting here,
    now, trying to get this last chapter read. God, she hoped there wasn’t a pop quiz
    today. This professor loved pop quizzes.


    She blinked her eyes and forced herself to focus on the reading. She mumbled the
    words, trying to help her brain absorb the information. Rain splashed in her hearing.
    Bugs chirped and an occasional bird called. Then something outside her classroom
    resounded loud enough she heard it through the storm.


    Screeching.


    A hysterical woman’s voice echoed in the hallway. Other people were yelling at
    her. Someone bellowed, “Security!”


    Wendy tugged the earbuds and listened. That shrieking voice sounded familiar.
    She squeezed her eyes closed.


    Priscilla!


    Wendy closed her textbook and slowly rose from the desk. What on earth was Prissy
    Priscilla doing now? Lindsay warned her, this crazy woman would go stalker psycho
    at the drop of a hat. Whose hat had dropped today to bring Priscilla Langley to
    the college?


    Wendy stepped into the hall and observed the commotion. Two security guards in
    campus uniforms were attempting to take ahold of Priscilla. She went limp and
    slid out of their grasp. She was like a greased salamander. Wendy leaned against
    the door frame to her room and just watched.


    “No!” Priscilla screamed. “That bitch is trying to take my fiancé away from me.
    I won’t have it.” She pointed a long finger toward Wendy.


    A cluster of people hovered outside a classroom across the hall from Wendy’s.
    All eyes were on the spectacle made my Priscilla Langley. But when she pointed
    at the person she was intent on stopping, all eyes turned to Wendy. She wanted
    to meld with the wall and disappear.


    Did Priscilla even go to school here?


    Priscilla’s feral eyes met Wendy’s. “There she is! Come here, you… you home wrecker.
    Face me like a man, er a woman!”


    Priscilla dropped to the floor while the two security men noodled to get a firm
    grip on her arms.


    The students standing in the hall appeared to look upon Prissy’s performance like
    doctors observing a medical procedure. Had she acted out like this so many times
    that people who knew her were this benign toward her outburst?


    Huh, this was very enlightening. Wendy returned to her classroom and reinserted
    her earbuds. Prissy’s shrieks faded down the hall and the rainforest’s sounds
    washed her cries out of Wendy’s hearing all together.


    ![Image](images/00004.jpeg)


    Dillon had avoided Wendy’s hall that afternoon. He had plenty of jobs to knock
    off the list in other parts of the hospital. Besides, he didn’t want to have to
    make his plea in front of the medical staff, or anybody else who might overhear
    them talking. This—he wanted to tell her in the privacy of her apartment. He had
    to make her understand he was innocent and Priscilla Langley was nutso, wacked-out,
    crazy. It was the reason he had cut ties with her several years ago.


    God, he wished his dad had chosen any restaurant in town except the one Prissy
    waitressed at. Just seeing her and her seeing him ignited her crazy, soul-sucking
    personality all over again. She belonged in a loony bin, on psychotic drugs, something.
    A shudder trickled down his spine. She needed help, but not from him.


    Wendy said *surprise her* on dinner. Pizza or Chinese, her two favorite take-outs.
    He wanted to make it special and hopefully he could make her believe he loved
    her and her alone. Priscilla meant nothing to him. Never did and certainly didn’t
    now. He sighed and lifted a screwdriver from his tool belt.


    The lights in this section were being redone to accommodate the new style, more
    efficient lightbulbs. Therefore, he needed to switch out the ballasts. There were
    four about eight feet apart down this hall. The halls stretched out from the nurse’s
    station, like a spider, only with six legs.


    He set up a ladder at the end of the hall and would work his way back to the central
    nurses’ station. Then go back and replace all the light bulbs with the new ones.
    It would only affect the hall, the patient’s room weren’t on this circuit. Still,
    he needed to hurry because the medical staff weren’t happy with the dark hallway.


    He had climbed the ladder, loosened the ceiling tile, and located the ballast.
    He stood on the ladder to reach the screws on the ballast, his shins braced against
    the topmost step to give him the most balance.


    A spark popped. “Ah, shit!” Dillon jerked back, the ladder tottered under his
    feet. He clawed at the ceiling frame. The aluminum and plastic broke under his
    grasp. In slow motion, he watched the frame fall away. “Uh!” the air left his
    lungs and his head bounced on the hard tile. Stars filled his vision. Someone
    called his name. Everything faded farther and away. Then went black.


    ![Image](images/00004.jpeg)


    **TEN**


    ![Image](images/00013.jpeg)


    Wendy changed clothes six times. Tempted to text Lindsay again, she searched her
    closet for the right outfit. Grey corduroys and a hunter green Angora short sleeve
    sweater would be the perfect make up outfit. She grinned with excitement as she
    quickly changed and cleaned up her bedroom. Smoothed out her bedspread, and looked
    around to see what else needed to be done. She wanted everything to be perfect.
    Dillon should be here any minute.


    She eased down on her couch and glanced at her phone. No text. She cleared her
    throat and opened her Med-Surge Textbook. She wanted to look casual, studying
    until he arrived. Not like she was anxiously waiting for him to get there. She
    read the first paragraph. Then read it again. She wasn’t absorbing anything. She
    reached into her book bag and took out a green highlighter. Not opening the pen,
    but using it to point at each word, she slowly read the text.


    Wendy lifted her phone. He wasn’t exactly late, they hadn’t said a specific time.
    And he was picking up dinner. She heard a car and stood to look out the window
    No Dillon.

    '
