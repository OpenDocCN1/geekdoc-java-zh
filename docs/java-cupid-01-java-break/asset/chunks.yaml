    To my real life friend and muse for this story, Wendy Ashton Chesnut.


    **Java Break**


    Synopsis


    Wendy Ashton and Dillon Cayne were both inspired by broken bones of their own.
    She to become an orthopedic nurse, he an engineer, designing more efficient and
    effective equipment for those recovering from orthopedic incidents. Their two
    paths so closely aligned, yet never intersecting.


    Until a mysterious message appears in heat sensitive ink on Wendy’ coffee cup.
    A message of love that makes her take notice of the handsome barista who must
    have written it. Brought together by the message, their lives begin to merge.
    Could this be true love?


    Together they learn that his dad is dating her mom and Dillon worries about the
    stigma of dating his possible step-sister. Add a crazy ex-girlfriend who won’t
    take no for an answer and a misunderstood phone call, the trust issues become
    almost too much to bear.


    What will it take to bring these two together? Can the Java Cupid show them their
    Happy Ever After? Or was it all a mistake? Will broken bones turn into broken
    hearts? Answers can only be found with a Java Break.


    **ONE**


    **![Image](images/00002.jpeg)**


    Welcome to Java Cupid Coffee Shop


    *We ![Image](images/00003.jpeg)Coffee!*


    “I don’t wanna get back on the horse, Dad!” Wendy Ashton precariously held her
    cellphone against her cheek with her shoulder and opened the glass door to the
    coffee house. It was crowded today, but she didn’t care. Caffeine and peace was
    all she sought and the Java Cupid Coffee Shop had both.


    “Look, I know what you’re saying.” She sighed and took her place in line to order.
    “I know you want what’s best for me, Dad. But I’m not going skiing with you or
    anybody else.” Shifting her Med Surge Nursing textbook and sliding her purse back
    onto her shoulder with a groan, she took one step forward. “I know you love me,
    Dad! I love you, too, but I’m not—“


    A young bus-boy bumped against her hard enough to cause her to stumble out of
    line. He held his dish-tub with both short-fingered hands.


    Wendy’s breath escaped in an agonizing huff.


    He looked at her with terrified, bulbous eyes. “I so sorry, ma’am.” His words
    were thick and slow, high pitched for his gender.


    She recognized he had special needs and smiled graciously at the young man. “It’s
    all right.”


    In truth, the misstep and stumble shot a stabbing pain from her knee to her hip
    and into her lower back. The doctors told her bone pain after a bad break like
    hers would always be present. In fact, they had prescribed a lengthy physical
    therapy which included sixty percent biofeedback and pain management.


    Her physical therapist, Royce Rogers, told her more than once—in fact, he literally
    drilled it into her thinking at every session— “The last thing you want is to
    become addicted to pain meds. Learn to manage it through meditation and biofeedback,
    and life will be much more productive and healthy for you, Wendy.” His words rang
    through her mind even now.


    But, oh, what she wouldn’t give to be able to pop a couple of pills and have the
    pain float away on an oxycodone cloud of bliss. Royce and her doctors made sure
    she didn’t have access to those drugs once she left the hospital. Royce was as
    much of a cheerleader and aerobics enthusiast as a physical therapist. To be honest,
    she would feel like she let him down if she resorted to narcotics to manage her
    life.


    As she considered the bus-boy, empathy washed over her thoughts. He quickly cleared
    the table beside her. She touched his shoulder to get his attention. He jumped
    slightly.


    “I’m sorry.” She spoke softly, the way she would speak to an injured patient.
    “Are *you* all right?”


    He smiled a crooked smile. His lips seemed swollen, his teeth oversized, and his
    mouth small. “Yes” —he nodded vigorously— “I all right.”


    She smiled back and observed as he resumed clearing tables, assessing if what
    he said was true. Assessing a patient’s words versus reactions was one of the
    skills she had been taught in nursing class.


    The tiny voice of her dad called her name from the phone on her shoulder. “Yeah,
    Dad. I need to let you go.” She moved two steps forward. “No, everything’s fine.
    I bumped into the bus-boy that’s all.” She glanced over her shoulder to see his
    progress but he was gone. An empty sensation filled her. Diligent worker, he was.
    All the tables were cleared off and he must have scurried to the back. She smiled
    with that thought and took another step forward. “Dad!” she returned her full
    attention to her cellphone. “I’m at the coffee shop, I’ll talk to you later.”


    Two more people ahead of her, she moved up one step. “No, we won’t talk about
    this then. I’m not going skiing! Dad, you don’t understand. I can’t do anything
    like that, ever again. It’s not a matter of getting over my fear. It’s all I can
    do to manage the pain I have now. You really want me to make it worse—?”


    She lifted her eyes. The two ahead of her were gone. Nothing, or no one, stood
    between her and the barista. He rather patiently leaned on the serving counter
    waiting for her to place her order. “Oh, I’m sorry.” Heat flushed her face as
    she hurried the two steps to stand at the counter. She didn’t mean to say that
    where everyone, especially this super cute barista, could hear. She tilted her
    head and considered him. For some reason he seemed familiar. Where did she know
    him from. Had to be here. She never went anywhere, except school, the hospital,
    and here.


    “Welcome to Java Cupid, where we heart coffee.” He smiled graciously with perfect
    teeth and a perfect face. “What can I get you?”


    Wendy lost all thought. His blonde curls made her fantasize tangling her fingers
    through it. His aqua-blue eyes washed the words out of her mind. She glanced at
    his name tag. *Dillon.* “Um, good morning, Dillon.” She stalled for the words
    to come back to her. 


    She ordered the same thing every morning. Usually it rolled off her tongue. What
    was wrong with her today. “I-um. I’ll have a tall red velvet… caramel drip… cake
    latte with whip.” Was that right? Her brow drew together.'
