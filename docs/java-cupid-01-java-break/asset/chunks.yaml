    would inspire him and get him out of this writer’s block. The deadline on his
    next book was less than a month away. He was twenty thousand words short of the
    thirty-five thousand word minimum requirement.'
  toc: []
  trans: '

    第一章


    罗布·多诺万（Rob Donovan）坐在 `Java Cupid` 咖啡馆的角落，从那里可以观察每个人的进出。他需要一些有趣的事情发生，一些能给他灵感并让他走出写作瓶颈的事。。下一本书的截稿日期不到一个月了。他距离三万五千字的最低字数要求还差两万字。

