    his chest. “It’s me, Prissy. I’m back. I forgive you. Let’s go back to bed.”


    Dillon stared down at her. “Prissy? Priscilla! How’d you get into my apartment?”


    “You left me your key, darling.” She laid her head against his taut chest and
    listened to his heartbeat. It sped up and his voice rumbled. “You’re not welcome
    here.” He peeled her arms from around him and pushed her back, staggering back
    from her. He stared at his phone. She smiled, knowing her naked body was slim
    and beautiful. She turned so that her body could conform to his. “Oh Dillon, sweetheart,
    I know you don’t mean that.”


    “Where are your clothes.” He growled.


    “I wore a coat.” She smiled mischievously and pointed over her shoulder.'
