    “I think so.” He pulled her back around the cylinder into a corner, and lowered
    his face to hers. “What—?” He smothered her word with his mouth and she lost all
    thought about his injury. His hand moved down to her bottom and pulled her firm
    against him. Her body responded in way’s she never imagined. If they weren’t in
    a public place…


    She slipped her hands under his shirt, blocked by the vest, and then wrapped her
    arms around his bare midriff. Skin to skin even only at his waist was intoxicating.
    His mouth devoured hers. His tongue explored and teased hers. Then he leaned back
    and they both panted for air. He kissed her cheek, trailing his kisses to her
    ear lobe. Biting it gently between his teeth, and pulling at it softly. She moaned.
    Trailing kisses down her neck. Her pulse quickened as his lips passed over the
    throbbing in her throat. She inhaled deeply and kissed his ear. And then his neck.
    He continued down to her neck line. He pulled her shirt down and sought the delicate
    skin beneath.


    She pulled back. Gasping for air.


    They were in public! Hidden behind a cylinder in the dark, but it was still public.
    “Dillon.” She mumbled. “We can’t. Not here.”


    He staggered slightly. “I—I know.” They paused a moment to regain their composure.
    Then he took her hand and led her out from behind the structure and up to the
    upper level. Heat flushed her cheeks. Did anyone know what they had been doing.
    She made no eye contact. Just let Dillon guide her out of the Epic Event Center
    and to his red and black Tesla Roadster.


    She closed her eyes and lay back against the headrest. He got in and drove without
    speaking. “I can’t believe we did that.” She finally muttered.


    Dillon laid his hand over hers. “I’m sorry. I got carried away.” He cleared his
    throat. “You bring out the beast in me, Wendy. I’m sorry I lost control.”


    She remained silent for a while.


    “I’m not.”


    ## FIVE


    ![Image](images/00008.jpeg)


    Dillon pulled against the curb in front of Wendy’s apartment. “You know? We’ve
    got, like three hours.”


    She smiled. “What do you suggest?”


    Dillon smiled and opened his door. She followed his lead and opened hers, as well.
    He walked around his little sports car and put out a hand to help her to her feet.
    They walked hand in hand to her door. She unlocked and pushed the door open. He
    followed her in. She smiled over her shoulder and continued toward the little
    hall that had three doors: restroom, stack laundry closet, and her bedroom. He
    turned her around to face him and leaned down to kiss her gently. She wrapped
    her arms around his neck and lifted up on tiptoes to press into his lips. A fire
    ignited in her midsection. She pulled him by the neck, while still kissing him
    passionately, into her bedroom and kicked off her shoes. He fumbled with his shirt,
    lifting it over his head and tossed to aside. She did the same. His eyes widened
    as he took in her beautiful breasts and soft skin.


    He pulled her close and kissed her neck. Trailing one after the other down her
    neck until he heard her moan. A quick pinch and she was free of the restraint
    that kept him from pleasuring her even more. She arched her back and he lifted
    her into his arms to gently lay her down on top of her homespun quilt.


    “Wait!” She pulled open her side drawer, lifted out a box, and set it on the night
    stand.


    He smiled. “Thanks. How’d you—?”


    “Dad, who else?” She rolled her eyes.


    “Tell your dad I appreciate it.” He kissed her nose and then her eyelid.


    She moaned. “I will not!” She pulled him down to her.


    For the next hour, they explored each other’s pleasure zones, becoming very familiar
    with each and every one. Until they lay together exhausted and sleepy. Dillon’s
    breathing was slow and deep. He had fallen asleep. Wendy laid with her head against
    his chest, listening to his heartbeat. Drifting in and out of a peaceful slumber.


    A tune played on Wendy’s phone. Quietly at first, then growing louder. She scrambled
    to lift it. It was her alarm to take a shower and get ready to meet her mother
    for dinner. Dillon roused with her sudden movement.


    “Wazit?” he muttered.


    “I’m sorry. I’ve gotta get ready.”


    He looked at his phone. “Me, too, actually.” They both scrambled from the bed
    and gathered their respective clothing. She scurried to the bathroom and slipped
    on her robe. When she came out, he was dressed and waiting for her. She laid her
    head against his chest and wrapped her arms around him. “Mmm. This was fun.”


    He stroked her hair. “Yeah, I love laser tag.” He grinned mischievously. “The
    sex was fun, too.”


    She looked up into his ornery eyes. “Oh you!” She swatted him. “Get outta here
    so I can get ready to meet Mr. Douche Bag!”


    He feigned hurt. “Ow! Hey, I’ve gotta spend an evening being nice to a gold digging
    bimbo.” He laughed. “Hey, I’ve got an idea.”


    She waited for him to express his thought.


    “Let’s get together afterwards and compare notes!”


    “Sounds like a plan.” She winked and shoved him out the door.


    ![Image](images/00004.jpeg)


    Wendy set her brake and stared at the Red Robin sign. “Gourmet Burgers and Brew”
    Wonder how many brews it’s going to take for her to get through this night. The
    only exciting thing about tonight was meeting Dillon later. Memories of this afternoon
    flashed in her mind. She closed her eyes, recalling how he had made her feel and
    his delightful reactions to her touch, as well. She sighed.


    Tonight they would swap horror stories about how this evening went. She’d get
    to tell Dillon all about the douche her mom was dating, and he’ll tell her all
    about the gold digging bimbo his dad was dating. She chuckled to herself. Knowing
    she would report everything back to Dillon kind of made this not such a bad night
    after all. It was like being a spy and remembering every detail for the debriefing
    later with her staff.


    Excitement washed out the trepidation from before. Now, this was fun. She giggled.
    Later, they’d swap something else, too. A tingling sensation shot through her
    midsection. She grabbed her purse and leapt out of her Jeep. Let’s get this over
    with, I’ve got more fun things to do tonight!


    She straightened the skirt of her dress and walked to the entrance.


    “Welcome to Red Robin.” A peppy high school girl greeted her while pulling out
    a menu from a slide slot in the concierge stand. Her name tag read `Tiffany`.
    “Just one?”


    “Uh.” Wendy searched the tables for mom. “I’m meeting somebody… so—”


    Mom’s table was situated behind a column. Wendy closed her eyes for a moment to
    compose herself. “I see her, may I go in?”


    “Of course.” `Tiffany` slipped the one menu back in the slot.


    Mom’s long arm flew into the air. Mom smacked her lips and pulled the stemmed
    glass toward her. “Come to momma.”


    Wendy widened her eyes, silently reprimanding her. She’d never seen her mother
    act like this. She was… goofy. How many of these had she already had?


    “Whatcha drinking?” the waitress said.


    Wendy looked at the margarita longingly. No. She’d better keep her wits about
    her. Besides, she had a report to give later. “I’ll have an ice water with lemon,
    please.”

