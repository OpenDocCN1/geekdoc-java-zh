    Her mother giggled. “Well—“


    Patty sounded like a high school girl. She was effervescent telling Wendy the
    details. They had met in a creative writing night class her mother was taking
    at the community college. “He’s a widower and has a son who is attending the University.
    I don’t know what he’s studying. And he wants to meet you!”


    “Who? Blake?”


    “Yes, Blake! Silly, who’d you think I meant? His son?” Patty laughed. “I haven’t
    even met his son.” She tilted her head.


    *Uh Oh.* Wendy didn’t like the look on her mother’s face.


    “Hey! Maybe we can make it a foursome dinner date. I’ll invite you, and he can
    invite his son, and we can all meet at one time. Wouldn’t that be fun?”


    “Oh, Mom. I don’t know. I work ’til seven and I have to study.”


    “Pish posh!” Patty waved her hand. “Blake’s a dear, you’ll like him. And I’m sure
    his son is as wonderful as he is. Say you’ll come.”


    “Uh… Okay. But let me look at my schedule.” Wendy pulled out her iPhone and thumbed
    to the calendar app. “It… looks like Saturday evening is good for me.”


    “Saturday it is.” Her mother slapped the table.


    Wendy’s puckered her brow. Her mother had it bad. She hadn’t acted this excited
    in—Wendy couldn’t remember when.


    “I’ll call you after I talk to Blake and tell you what time and where. Oh, Wendy!
    I’m so happy!” Patty squealed.


    “I can see that.” Wendy widened her eyes. “I’m happy for you.” Maybe this new
    love interest will keep Mom out of her everyday business. She could only hope.


    She sipped the cappuccino and glanced over her shoulder to observe the handsome
    barista whom she might get to see later at the hospital. A flash of his bottom,
    while he was up the ladder came to mind, brought a smile to her face. She liked
    how he looked in those jeans.


    ![Image](images/00004.jpeg)


    That afternoon, Wendy hustled from room to room to get beds changed and vitals
    taken. Five patients needed baths. All the while, she kept an eye out for Maintenance.
    Or one particular member of Maintenance. She considered busting a light bulb or
    smashing a vent cover, just so they could call for repairs. She giggled to herself
    at the thought.


    Finally, mid-shift, she was able to take her break. She pulled a chair over to
    the microwave so she could sit while it cooked her Lean Cuisine. The door to the
    break room opened. She lifted her weary gaze to it. Her heart leapt when Dillon
    walked in.


    “Hi.” Even with one syllable, he had the sexiest voice. He walked to the fridge
    and pulled out a Java Cupid to go styrofoam box and sat down at a table.


    The microwave dinged and she stood to retrieve her meal. She walked over to the
    table he chose. “You mind?”


    “No. Please do.” He flipped over the lid of the box, revealing a multi-grain turkey
    sandwich with bean sprouts and a cup of yogurt.


    “Ah, that’s a good idea.” She indicated his dinner from the Cupid.


    He nodded. “Yeah. Rocco insists I take one every day that I work. I guess he feels
    it’s his way of helping us poor college students.” Dillon chuckled.


    He had a nice laugh. “That *is* thoughtful of him. Who’s Rocco?”


    “Oh, he’s the owner. You don’t hardly see him, ‘cause he’s mostly in the back.
    He cooks and cleans up back there. Leaves the front to us ‘young folk’ as he calls
    us.” Dillon chuckled again. “You know the bus-boy, Charlie?”


    She nodded. 


    “That’s his son.”


    “Ah.” Wendy inhaled and rested her chin in her hand.


    Dillon eyed her tray of chicken a l’orange. “You gonna eat that?”


    She glanced down. “Oh. Sure.” She snorted. *Oh god!* She covered her mouth and
    nose. “I’m sorry!”


    He smiled. “Don’t tell me, you’re one of those girls who snorts when they laugh?”


    Wendy rolled her eyes. Heat filled her face. “I can’t believe I did that. I’m
    so sorry.”


    “No. I think it’s cute.”


    “It’s embarrassing.” She giggled.


    He cocked his head to one side. “I think you’re cute.”


    She sobered and stared at him. “You’re not so bad either, Dillon.” Heat swamped
    her face and she had to look down at her food.


    “Listen, what time are you off?” He bit into his sandwich.


    “Seven, but I—What you got in mind?” She scooped a bite of chicken and rice.


    “Dunno. Maybe we could hang out?” He sipped from a water bottle.


    She smiled. “Well, I usually go home and study but…”


    “Yeah, me, too.” Disappointment washed over his face.


    “You’re in school?” She continued eating, talking around the food in her mouth.


    “Uh huh.” He finished the first half of his sandwich and lifted the second. “Engineering.
    You?”


    She stared at him a moment. Didn’t he see her nursing textbooks? “Nursing.”


    “Oh yeah. I knew that.” Dillon finished and stood to throw away his sack. He held
    the lid open for her to throw hers away, too. “Well, what if we studied together?”


    “I guess that’d work.” A half smile lifted on the side of her mouth.


    “Cool. Can I pick you up at seven?” Dillon put the last bite in his mouth.


    “Um. I’ve got my Jeep here, so…” She took a pen from her scrub pocket and clicked
    it. Lifted his hand in hers and wrote in his palm. The intimacy of holding his
    hand and touching his palm caused her heart to race. Her breath caught in her
    chest. She focused on breathing normally so she could speak without panting. “That’s
    my address. Meet me there after work.” 


    ![Image](images/00004.jpeg)


    At seven, Wendy rushed to the parking lot, tossed everything into the passenger
    seat and drove home as fast as humanly possible. She had to do a quick ninja cleaning
    on her apartment before Dillon got there. God, she wished she’d done the dishes
    this morning and made her bed. Parking in front of her unit, she grabbed her stuff
    and sprinted for the door. The key resisted, of course, of all days, and she growled
    trying to make it unlock her door.


    “What’s wrong, baby girl?” Her dad, Lance Ashton, called from across the lawn.'
