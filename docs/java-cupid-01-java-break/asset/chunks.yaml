    Dillon shook his head. “No. I’m not one-hundred percent sure where their relationship
    is going. I don’t want to put him on the spot. I’ll wait until he makes some announcement
    or whatever. Then I’ll talk to him about the legalities of all this.” He gestured
    toward her.


    “Well… what do we do in the mean time?” Tears stung her eyes. Was he breaking
    up with her? Why did they have to wait for their parents to make up their minds
    about their own relationship, when she was quite set on moving forward with Dillon.


    “I-I don’t know.” Dillon jammed his fingers through his blonde curls.


    Wendy stared at him. She knew. She knew exactly what she wanted. Why didn’t he?
    “Well, maybe we should cool it until you do.”


    His eyes shot up to hers. Worry drew his brow and forehead taut. “Maybe we should.”


    ## SIX


    ![Image](images/00009.jpeg)


    Dillon certainly didn’t look like he agreed with her suggestion to cool it for
    now. In fact, he looked hurt. But what else could she say? It was late, she was
    tired, he needed to go home or go to bed. One or the other. She wasn’t going to
    share her bed with him again until he knew what he wanted. Regardless of what
    his dad or her mom decided. They had to make this basic decision independent of
    anyone else’s plans.


    Wendy tried to sleep. But it was impossible. Everything that had happened tonight
    swirled in her head. She could hear the wind blowing outside her bedroom window.
    She felt like it was blowing all her thoughts around in her head, too. Prissy-Priscilla-Priss.
    Her mom, she’d never seen her so happy. Blake, he seemed like be a really nice
    man and so thoughtful to her mom. Dillon, suddenly he wasn’t sure what he wanted
    with this relationship. School, she was behind on her studies, and she couldn’t
    let that happen.


    But she couldn’t concentrate on any of it now. She drew a hot bath with Epsom
    salt and soaked. But still she couldn’t slow the tempest in her mind. She sat
    in bed, chewing her fingernails and staring at her phone. Should she call Dillon?
    Was the ultimatum she made fair? He was an amazing guy. So much fun to be with,
    great sense of humor. He made a great cup of coffee. She chuckled. And he had
    the best kisses she’d ever experienced. Not that she’d experienced as much as
    Priscilla… Anger raised its ugly head.


    She kicked off the covers and stood beside her bed. Maybe a warm cup of milk.
    She padded to the kitchen. Her phone in hand. She thumbed it to life.


    Pouring some milk in a Java Cupid coffee mug she had bought, she put it in the
    microwave oven, and pressed thirty seconds, then start. She looked at her phone.
    Dillon’s number was ringing. “OH.” She lifted it to her ear. The ring tone sounded.
    And again. And again. Then an answer. “Dillon?”


    A whispered voice. “Hello?”


    Wendy paused. The microwave dinged, but she ignored it. “I-is Dillon there?”


    “Yes,” the woman whispered.


    Wendy dipped her head. Anger reignited in her gut. “May I speak to him?”


    “No.” The voice continued to whisper. “ He’s asleep right now. May I leave a message?”


    “Who is this?” Wendy wanted to transport through the airwaves and throat punch
    whoever this was.


    “This is Pricilla, who’s this?”


    Wendy paused. Pricilla! What the—Why on earth was Pricilla at Dillon’s place,
    answering his phone. Was everything he told her tonight a lie? They still were
    together? “Who I am doesn’t matter. Have a nice night.” She disconnected and reared
    back to throw her phone. Closing her eyes, she thought better of it. She couldn’t
    afford to get a new one if she broke this one. She sighed. Now she’d never sleep
    for sure! How could he do this to her?


    ![Image](images/00004.jpeg)


    ## At the same time…


    Priscilla dug through her Dillon-keepsake box until she found what she hoped was
    there. She lifted his football jersey and inhaled deeply. His scent was long gone,
    but she remembered what it did to her insides. She had never loved anyone like
    she loved Dillon Cayne. If only she could have seduced him back in high school,
    then he’d have been hers. No man could resist her once they got a taste of what
    Prissy offered. She smiled.


    She could fix that tonight.


    She tossed the key into the air and caught it. Just a few miles away from her
    ratty-ass apartment, Dillon’s nice little apartment sat nestled next to the golf
    course. She knew exactly which door was his, even though he’d never invited her
    there. She had observed from where he couldn’t see her. The key, she’d stolen
    when he thought he’d lost his entire set. She’d slipped them in her trash bin
    at her parents curb one night after he brought her home. He had been so distant,
    she knew it was only a matter of time before he broke things off. Her dad had
    called him a cab and he’d had a locksmith make a new key to his little roadster.


    She had her memorabilia of their life together. And she had a key to his apartment.
    Tonight, she would show him what he had been missing these past few years. And
    she’d make him hers, forever. The key slipped right into the lock and turned without
    a sound. She tiptoed in.

