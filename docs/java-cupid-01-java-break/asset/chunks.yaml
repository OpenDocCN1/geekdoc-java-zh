    # 咖啡之恋 (Java Break)

    Java 丘神系列

    第一卷

    作者 Lynn Donovan 著

    © Lynn Donovan 2017

    © George McVey

    版权所有


    这是一部虚构小说。小说中描绘的所有人物和事件均为虚构。与实际事件、地点、在世或已故人士的任何相似纯属巧合。


    ## 剧情

    Wendy Ashton 和 Dillon 的灵感都源于一次骨折。她因此此决定成为了一名骨科护士，他成为了一名工程师，他们的人生轨迹如此接近，却又从未交集。直到一条神秘的信息写出现在咖啡杯上。那是一个爱的信息，让她注意到了那位英俊的咖啡师。他们聚在一起，生活开始融合。这会是真爱吗？他们发现自己的父亲正在和她的母亲约会，并担心会和继姐妹产生感情。再加上一个不听人劝的疯狂前女友，信任问题变得让人无法承受。什么才能让这两个人在一起？Java
    丘神能带他们走向幸福结局吗？还是这仅仅是一场误会？断裂的骨头会变成心心吗？答案只能在《咖啡之恋》中找到。


    ## 第一章

    ![Image](img/00002.jpeg)

    欢迎来到 Java Cupid 咖啡馆


    ![Image](img/00003.jpeg)

    “我不想再接电话了，爸爸！”Wendy Ashton 费力地将手机贴在脸颊上，推开了咖啡馆的玻璃门。今天人很多，但她不在乎。她寻求的是咖啡因和宁静，而 Java
    Cupid 店两者兼有。


    “听着，我知道你在说什么。”她叹了口气，排队点餐。“我知道你想为我好，爸爸。但我不会和你或任何其他人去滑雪的。”她一边呻吟，一边调整怀里的护理教科书，并将包包滑到肩上，向前迈迈了一步。“我知道你爱我，爸爸！我也爱你，但我不是——”


    一个年轻的服务生重重地撞了她一下，让她踉踉跄地撞出了队伍。他用那双短手指的手双手托着盘子。Wendy 发出一声痛苦的哈息。他用惊恐的、圆滚滚的眼睛看着她。“我非常抱歉，女士。”他的口音很重且缓慢，对于他的性别来说声音很尖锐。她认出他有特殊需求，对这个年轻人露出了大方的微笑。“没关系。”


    事实上，那次失足和踉跄让一阵剧痛从她的膝盖传到臀部，一直延伸到腰部。医生告诉她，像她这样严重的骨折后，骨痛会一直存在。事实上，他们开方了长期的物理治疗。她的物理治疗师
    Royce 曾多次强调这一点——事实上他把这些话刻进了她的脑子里：“你最不想的就是对药物成瘾。通过冥想和生物反馈来管理疼痛，你的生活会变得高效且健康，Wendy。”他的话现在仍在她脑海中回响。


    但，噢，她愿意付出一切去换取几片药，让疼痛在海因酮的云端中消散。Royce 和她的医生确保了她在离开医院后无法获得那些药物。Royce 既像个拉拉队员，又像个健身爱好者。老实说，如果她依靠药物来维持生活，她会觉得自己辜负了他。


    当她考虑这个男孩时，同情心流过她的脑海。他很快清理了旁边的桌。她拍了拍他的肩膀引起他的注意。他轻跳了一下。“对不起。”她轻声说道，就像对待受伤的患者那样。“*你*还好吗？”


    他露出一个歪斜的微笑。他的嘴唇看起来很肿，牙齿很大，嘴巴很小。“我好的，”他用力点点头，“我很好。”


    她回以微笑，观察着他继续清理桌子，评估他说的话是否真实。评估患者的话语与反应之间的差异是护理课上学到的技能之一。


    爸爸细小的声音从肩膀上的手机里呼着她的名字。“好，爸爸。我得挂了。”她向前迈了两步。“不，一切正常。我只是撞到了那个服务生而已。”她回头回头想看看他的进度，但他已经消失了。


    “欢迎来到 Java Cupid，我们热爱咖啡。”他露出完美的牙齿和完美的脸庞，大方地微笑。“想为你点些什么？”


    “我要一根大杯红丝绒……焦糖滴滤……蛋糕拿铁加奶油。”这样对吗？她皱起眉头。


