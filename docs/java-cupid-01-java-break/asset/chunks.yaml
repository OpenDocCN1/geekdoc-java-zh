    the topmost step to give him the most balance.


    A spark popped. “Ah, shit!” Dillon jerked back, the ladder tottered under his
    feet. He clawed at the ceiling frame. The aluminum and plastic broke under his
    grasp. In slow motion, he watched the ceiling and the broken frame fall away.
    “Uh!” the air left his lungs and his head bounced on the hard tiled floor. Stars
    filled his vision. Someone called his name. Everything faded farther and farther
    away. Then went black.


    ![Image](images/00004.jpeg)


    **TEN**


    **![Image](images/00013.jpeg)**


    Wendy changed clothes six times. Tempted to text Lindsay again, she searched her
    closet for just the right outfit. She wanted to look great for Dillon. This was
    going to be their make-up date. She had been so wrong thinking Priscilla Langley
    meant anything to Dillon. After Prissy’s performance at the college today, Wendy
    was convinced the girl needed some serious psychological help. Dillon had told
    her, Lindsay had told her, but for some reason she didn’t really believe it until
    today. Today, when that girl screamed and cried at Wendy, calling Dillon her fiancé.
    Wendy knew. Priscilla Langley was crazy.


    Grey corduroys and a hunter green Angora short sleeve sweater would be the perfect
    “make-up” outfit. She grinned with excitement as she quickly changed and cleaned
    up her bedroom. Smoothed out her bedspread, and looked around to see what else
    needed to be done. She wanted everything to be perfect. Dillon should be here
    any minute.


    She eased down on her couch and glanced at her phone. No text. She cleared her
    throat and opened her Med-Surge Textbook. She wanted to look casual, studying
    until he arrived. Not like she was anxiously waiting for him to get there. She
    read the first paragraph. Then read it again. She wasn’t absorbing anything. She
    reached into her book bag and took out a green highlighter. Not opening the pen,
    but using it to point at each word, she slowly read the text.


    Wendy lifted her phone. He wasn’t exactly late, they hadn’t said a specific time.
    And he was picking up dinner. She laid the phone down and continued reading. She
    heard a car and stood to look out the window No Dillon.'
