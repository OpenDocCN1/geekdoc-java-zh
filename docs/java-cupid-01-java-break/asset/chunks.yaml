    他环顾着这无聊的咖啡馆。*来吧，搞点什么，亲亲别人，或者在咖啡吧打一架。给我点什么，什么都行。*


    他的手指在键盘上移动着，开始描写一个咖啡馆斗殴的场景。随后他摇了摇头，意识到这有多荒唐，于是把全部删除了。他叹了口气，双手抱头。他的咖啡已经冷了，零食也吃光了。他在这里坐了一个小时，却毫无收获。


    “打扰一下。”


    Rob 看向坐在他右侧桌旁的女人。她美得令人窒息，有着海滩女孩般的小麦色皮肤和阳光晒过的金发。然而，吸引他注意的是，她的右眼是金棕色的，而左眼则是他所说的冰蓝色。“我吗？”


    她笑了，他的心跳节奏快得像大锤在敲击。“是的，嗯，你能帮我照看一下东西几吗？我需要……嗯……”她脸红了，Rob 笑了起来。“包你了，没问题，我会确保没人乱动你的东西。”


    “谢谢。”她快步走向位于咖啡馆和烧烤店之间的洗手间。Rob 调出一张角色卡，快速描述起她。*身高五英尺五寸，长长的阳光金发，爱神丘般的嘴唇，泡泡糖粉色。右眼金棕色，左眼冰蓝色。曲线优美，二十岁出头。*


    接着他输入道：*名字？职业？*


    之后，他打开一个新文档，命名为《咖啡馆之恋》，开始飞快地打字。他很庆幸。这不是他正在写的那本书，而是一本开放截稿的书。这意味着他只需要在截止日期前交出一个三万五到五万字之间的浪漫小说即可。这并不是那些必须遵循特定格式和情节的多作者系列。那些点子他已经提交了。不，这是为了一个浪漫小说比赛，可以让他今年晚些时候在会上获得一个折扣展位。


    当感到有人靠近那位女士的桌子时，他抬头。看到是她时，他笑了。“什么都没丢，除了我从你背包里拿走的那五百美元。桌位安全费。”


    女孩笑了，声音听起来像小铃铛叮当作当响，让他的心跳再次加速，并让身体其他部位感到一种非常愉悦的局促。


    “好吧，如果你在包里发现了五百美元，那是你应得的。谢谢你帮我看着。我不想失去这个棒的位子。我没法从别的地方盯着。”


    他点了点头，指了了自己的座位。“这就是为什么我坐在这里。这是观察路人的最佳位置。”


    她露出一抹淡淡的微笑。“确实如此。我本来打算坐在那里的，但当我来时，有个穿美国鹰式牌 T 恤的帅哥坐在那里。”


    那种局促的感觉又紧了一了一点。她觉得他很帅。“真的吗？那真奇怪，我来的时候这里没看到人，一定是错过了他了。也许你应该向我描述一下他，这样我可以做做笔记。”


    她笑了。“好吧，如果你真的想看，我可以让你抄我的笔记。”她把她的智能笔记本屏幕转向他，他惊讶地看到那是他所使用的写作程序里的角色卡。


    “你是个作家吗？”


    她的笑容消失了，他想说任何话来让笑容重新回到她的脸上。


    “不，作家是有作品发表的。我还没有发表过任何东西。我只是个想当作家的。”


    他伸出手，用手托住她的下巴。流过他身体的电击几乎强烈到让他想松手。她屏住了呼吸，他知道她也感受到了。*好吧你知道的，那种事真的会发生。我以为那只是为了解释无法解释之物的文学修辞。*亲爱的，没有所谓的‘想当作家的作家’。如果你有那个程序并在手稿上写字，你就是作家。作家的身份会得来的。”


    他松开了她的脸，但在离开前用手背拂过她的脸颊。


    “我希望是这样。”


    他笑了。“相信我，我很确定。”


    他转过他的`MacBook`，让她看到他为她制作的角色卡。


    她的眼睛变大大。“你是作家？真的吗？”


    “是的，确实是。”


    他看到那个问题浮现在她的脸上，那是作家最讨厌被问到的问题，但每当别人发现你是作家时总会问，于是他替她问道：“你写过什么我可能读过的吗？”


    她笑了。“你经常被问到这个？”


    他咧嘴一笑。“每当有人发现我是作家时都是。”


    “噢，好吧，抱歉，但问题依然存在，我读过吗？”


    “你读很多吗？”他问。


    “是的，一直都在读。”


    “嗯，并不是一直都在。你现在没在读。你刚才在写字，然后去上厕所，现在在聊天。”


    她拍了拍他的手臂。“你知道我意思。”


    他咧嘴一笑。“那么，你读什么？什么类型的？”


    她脸红了，他笑了。“啊，一个浪漫读者。”


    她咬着下唇点了点头。他忍不住想那泡泡糖粉色的嘴唇尝起来是不是泡泡糖味。“你读哪种浪漫？”


    “噢，各种都有，历史的、现代的、摄政期的，我现在正在读这个非常酷的超自然浪漫系列。”她从背包里掏出她最新的书。“你听过这个系列吗？它是现在最火的。”


    他咧嘴一笑。“我听过那些，是的，而且我不得不回答你刚才的问题，你绝对读过我的作品。”


    “真的吗，你写浪漫小说的？我只知道另一个写浪漫小说的男的。事实上，”她举起她的书，“你叫什么名字？我想看看我有没有你的书。”她从背包里拿出她的`kindle`。


    他笑了。“我向你保证，如果你读过那个系列，你至少读过我的两本书了。”


    她的眼睛大得惊。“你是 R.G. Donovan，那个创造了《幻影桥系列》的人？”


    “我的朋友叫我 Rob 或 R.G.。但是的，那是我。”


    “我的天呐！！我们可以一起拍张合照吗？我的作家小组绝对不会相信的。”


    Rob 笑道。“这样吧，我们去找个人帮我们拍，这样我们就不会有每个人自拍时都有那种奇怪的大额头效果了。”


    Rob 看到几桌子外一个当跑菜员的特殊需求孩子。“嘿，Charlie，过来。”


    那个年轻人把他的餐具盆放在桌子上，摇摇晃晃地朝他走。“你好，Rob 先生。你需要加水吗？”


    Rob 摇了摇头。“这次不用，伙计。你知道怎么用那种相机拍照吗？”他指了指女孩的手机？


    Henry 咧一笑点了点头。“我有一个一模一样的。”他从口袋里掏出一部手机。“看？”


    “太棒了，伙计。你能帮我拍一张照片，还有……”


    “Aurora。”


    Charlie 的眼睛比平时睁得更大更大。“像迪士尼公主那样？”


    “是的，就像迪士尼公主。我妈妈用她的名字给我命名。”


    “哇，你很有名!!”


    Rob 对着那笑道。“她是很有，这就是为什么我需要你帮我们拍张照，好吗？”


    Charlie 想了一会儿。“好的，Rob 先生。奥罗拉公主，我也可以和你合影吗？”


    她把手机递给他。“我很想和一个像你这样帅的王子一起拍照，Charlie。等我和 Rob 先生拍完之后，好吗？”


    “好的！”


    她凑近 Rob，他吸入了她的气味。味道很淡，像他家里书角花架上爬的忍冬花味。但其中夹杂着一种香料味，像肉豆蔻或肉桂。*她闻起来就像你想象中迪士尼公主的味道。*


    Charlie 举起相机。“说，‘咖啡丘比特’。”


    他们说了，他拍了照。然后 Rob 站了起来。“Charlie，把你的手机给我，去奥拉拉公主旁边坐。”


    Charlie 照做了。“好的，说，‘摩卡拿铁’。”正当他准备拍照时，奥罗拉转过头亲了吻 Charlie 的脸颊。年轻人脸红了，看向 Rob。“她亲了我！这意味着我们必须结婚了吗？”


    “不，Charlie，她没亲你的嘴，所以你不用结婚。”


    “好的！太好了，因为我在中心已经女朋友了。”

