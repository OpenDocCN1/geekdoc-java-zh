    “You do? I mean, I’m not looking a—a, what is the word? A horse present in the
    teeth.” He looked at her questioningly, was that right? “But how do you know?”


    The expression on Dillon’s face exposed concern.


    Wendy touched his shoulder to reassure him she was alright. “Dillon, I get it.
    She’s psycho. I forgive you.”


    “Thank you?” He cocked his head to one side. “I’m not sure what you’re forgiving
    me for. Is there something I’m missing?”


    “I don’t know, either. It just seemed like the thing to say.” She giggled.


    “Oh.” He chuckled and ran his fingers through his hair, the `IV` tube trailing
    down his arm. “So, we’re okay?”


    She leaned over his bed and laid her head against his chest. “We’re okay.”


    They stayed like that for a while, relieved to have the other back. Finally, Dillon
    said, “But, how’d you know?”


    “Know what?”


    “I was telling the truth?”


    She shrugged a shoulder. “I dunno. Honesty just exudes from your eyes. That, and
    Priscilla came to the college that next morning and was going all Norman Bates
    on me.”


    “She did?” Dillon shook his head.


    “Yeah, she was intent on stopping me from busting up her and her fiancé.” She
    widened her eyes at him to emphasize how crazy Priscilla’s statement had been.


    “Fiancé?” His forehead wrinkled. “Where’d she get that?”


    “In that psychotic made-up world in her head, I suppose.” Wendy chuckled.


    “Wow. Well, I’m glad you’re alright and I’m glad you know I told the truth.” He
    held her tight. “I promise, I’ll never lie to you.”


    “You better not.” She giggled. “So… you slept on it…”


    He pulled back from her and stared into her eyes. “I beg your pardon?”


    Way back when all this started with Priscilla and you came to my place with the
    pizza, you said you’d slept on it and decided…”


    Confusion filled his eyes.


    She prompted, “About what we were going to do about my mom dating your dad?”


    “Oh! God, that seems like so long ago.” He closed his eyes. “Let me think. I had
    this all figured out. Man, my head hurts.”


    “Don’t worry about it.” Wendy patted his chest. Heart monitor wires and stickers
    felt rough under his hospital gown.


    “No. I think I was going to say… no matter what Dad and your mom do. We are… people.
    Growed people.”


    “Grown.” She gently corrected.


    He squeezed his eyes in frustration. “Grown people and we’re not related.” He
    opened his eyes and searched hers for understanding.


    She nodded. She understood.


    “Not” —he pointed an index finger at his arm— “vein, red, bleed.”


    “Blood?” She guessed his meaning.


    He nodded. “Yes. Not blood related.”


    “Right.” Wendy waited patiently as Dillon struggled to get past the concussion
    injury to have his say. “If Dad and your mom, have relationships. We okay together.
    Not related.”


    He shook his head. “I really don’t want to lose what we have. You’re amazing.”


    Wendy lifted her head. He was speaking so much clearer now.


    “And I can’t imagine my life without you. I love you, Wendy. I love—”


    She smothered his words with her lips.


    Startled, he didn’t respond at first, but then he wrapped his arms around her
    shoulders and pulled her closer into his body.


    She lifted her knee and slid into his bed, snuggled up against his side. He kissed
    her with a longing that had needed to be filled for the last two days. His tongue
    traced her bottom lip, then probed for her tongue. She twirled hers around his
    and pressed harder against him. He pulled back, breathless. “Wendy, we better
    stop. I don’t know that my ribs can handle this.” He squeezed his eyes with the
    pain in his chest.


    “Oh, I’m so sorry.” She scrambled off the bed. “I forget about your ribs.”


    He looked at the machine standing beside her, and lifted a finger to point at
    it. “Is that for pain?”


    “Yeah, and this” — she lifted the button— “is what you push when you’re hurting.”


    He pushed it and laid his head back against the pillow.


    Wendy watched the tension release from his face as the `Dilaudid` worked through
    his system.


    She re-adjusted her makeshift bed back into a chair and sat by him. “You know
    something?”


    “Hmm.” He responded sleepily.


    “You were right.” She smiled and took his hand into hers. Intertwining their fingers
    she kissed each of his knuckles.


    “What was I right?” he mumbled.


    “You are broken without me.” She smiled.


    “Mmm.” He lay still for a moment. Then his eyes shot open. “What did you say?”


    “That note you wrote on my cup.” Her eyes met his. “At `Java Cupid` that first
    day.”


    He glared at her with a furrowed brow.


    “Oh come on. They said your short-term memory would be affected, but surely you
    remember that!”


    “I have no idea what you’re talking about.”


    “Really?” she chuckled. “You remember me talking to you—“


    “Yeah, you wanted a tall red velvet cake caramel drip latte with whip and changed
    it to a chocolate cappuccino with a caramel drizzle.”


    “Right.” She marveled how precisely he did remember her jumbled up order. “And
    you wrote on my cup. You said, ‘I’m broken without you.’”


    “No, I didn’t.”


    “Yes, you did.” Her chuckle waned to a sober stare. “Didn’t you? With a heat sensitive
    pen? Cause it didn’t show up ’til I got to my booth… You don’t remember any of
    this?”


    “Wendy, I remember you ordering. I remember you changing your order. But I didn’t
    write anything on your cup. We don’t have heat sensitive pens.”


    She stared at him. His eyes weren’t lying. “Well, then, how—” She stood up. “Wait.
    I kept the cup. I’ll be right back.” She hurried from his room and rushed out
    to her car. The cup still lay in her back seat. She’d been meaning to take it
    in, to save it in a scrap book or something. She hurried as best she could with
    her leg stiff and aching from the make-do bed in his room.


    Nearly twenty minutes later, she rushed into his room. He had fallen asleep.


    “See.” She panted and held the cup to him.


    He started and opened his eyes. The message was long gone.


    “If you look close you can see the outline.” She pointed to the cup.


    “Well, then who?”


    He cocked his head back. “I have no idea.”


    “But… that’s why I started talking to you at the hospital. Remember, in the break
    room. You were up on a ladder, too.” She giggled.


    “Yeah, it is. But if that message is what got you to talk to me and lead us to
    all of this, then I’m grateful. Perhaps `Java Cupid` actually has a `Java Cupid`.”


    She stood and took his hand, holding it against her heart. “Maybe. I certainly
    think his arrow hit the right mark with you and me.”


    “You got that right.” Dillon pulled her down to him and kissed her tenderly. She
    pressed into his lips. Cupping her hand on the back of his head, her passion unfurled,
    consuming him with her mouth. He winced.


    She jumped back. “Oh, I’m so sorry.”


    “I’m not.” He smiled. “I think the cupid’s arrow is still in my chest.”


    Wendy giggled. “Stupid cupid.”


    ***


    **END**


