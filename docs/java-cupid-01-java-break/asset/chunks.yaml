    “迪隆？”她母亲伸长脖子试图看清那个年轻人。“你居然知道那个咖啡师的名字？”


    “知道。嗯，就是那一个。还有杰米……” 温迪对她母亲的存在瞬间警觉起来。当杰米穿过过去点早餐订单时，她隐晦地指了指。“他也在医院工作。而且昨天……”她敢向那个爱管闲事的诺莉分享她在杯子上上留的留言吗？那个杯子还留在她的车里。当然，上面的信息已经褪色到看不见了。但她也不忍将其扔掉。现在那已经是手账的素材了。


    “昨天怎么了？”她母亲追问。


    “帕蒂！”一个女人对着温迪的母亲叫道。“你好吗？这是温迪吗？天哪，你长这么大了！”


    温迪翻了个白眼，然后对那个女人笑了。


    “米尔德雷！”她妈妈从座位上站起来，抱住了那个活泼的女人。“真高兴见到你！西奥怎么样？”


    “噢，你知道西奥的。他精神好得很。”两人咯咯笑着，再次拥抱在一起。“听着，替我向布莱克问好。”


    “我会的！”帕蒂说着，一边滑回座位，一边看着那个女人离开咖啡馆。


    温迪盯着她妈妈看了很久。她妈妈悠闲地喝着咖啡。最后，她对上了她的目光。“什么？”


    温迪挑起眉毛。“布莱克？”


    她母亲脸红了，接着又变白。“是的，嗯。我是打算告诉你的。”


    温迪把额头歪向妈妈。“告诉我什么？”


    帕蒂抬起下巴。下巴微微颤抖，说话时，声音因激动而颤抖。“我在恋爱。”


    “你在恋爱！”温迪重复道。“妈妈！那……太棒了。”


    “真的吗？”帕蒂的眼里满了泪水。“我真怕你会生我的气。”


    “我为什么要生你的气？”温迪越过桌子握住妈妈的手。“认真的，妈妈。我觉得太棒了。现在，告诉我关于他的所有事情。”


    她妈妈咯咯笑着。“好——”


    帕蒂听起来像个高中女生。她在向温迪描述细节时神采奕奕。她们是在妈妈在社区学院上的一门创意写作晚间班上认识的。“他是个寡夫，有一个正在读大学的儿子。我不知道他在学什么。而且他想见你！”


    “谁？布莱克？”


    “对，布莱克！傻孩子，你觉得我是说谁？他的儿子？”帕蒂笑道。“我甚至还没见过他儿子。”她歪了歪头。


    *噢不.* 温迪不喜欢她妈妈脸上的表情。


    “嘿！也许我们可以安排一次四人晚餐约会。我邀请你，他邀请他的儿子，我们大家一起见面。那不是趣吗？”


    “噢，妈妈。我不知道。我要工作到七点，而且我还得学习。”


    “胡扯！”帕蒂挥了挥手。“布莱克是个好人，你会喜欢他的。我确信他的儿子也和他一样出色。答应吧。”


    “呃……好吧。但让我看看我的日程表。”温迪拿出她的 `iPhone`，滑动到 `calendar app`。“看起来……周六晚上我有空。”


    “就周六了。”她妈妈拍了拍桌子。


    温迪皱起眉头。她妈妈陷得太深了。她没有这么兴奋过了——温迪想不起来是什么时候了。


    “我跟布莱克谈完后给你打电话，告诉你时间和地点。噢，温迪！我太开心了！”帕蒂尖叫起来。


    “我看得出来。”温迪睁大了眼睛。“我为你感到高兴。”也许这个新恋会让妈妈不再干涉她的日常琐事。她只能这么希望了。


    她抿了一口卡布奇，越过肩膀观察那个她之后可能在医院看到的帅气咖啡师。他爬梯子时臀部的曲线闪过脑海，让她脸上露出笑容。她喜欢他穿那条牛仔裤的样子。


    ![Image](img/00004.jpeg)


    下午，温迪在房间之间奔波，换床单、测生命体征。五个病人需要洗澡。期间，她一直在留意 `Maintenance`。或者是 `Maintenance` 里的某个特定成员。她考虑过弄坏灯泡或砸碎通风口，这样他们就能来叫维修了。想到这里，她自己笑了起来。


    终于，在班次途中，她可以休息了。她拉来一把椅子到 `microwave` 旁边，这样在加热 `Lean Cuisine` 时就可以坐着。休息室的门开了。她抬起疲惫的望去。当迪隆走进来时，她的心跳了一下。


    “嗨。”即便只有一个音节，他的声音也是最有磁性的。他走向冰箱，拿出一个 `Java Cupid` 的泡沫盒，坐在桌子旁。


    `microwave` 叮的一声响，她起身去取餐。她走向他选的那张桌子。“介意吗？”


    “不介意。请坐。”他翻开盒盖，露出一个里面有豆芽的多谷物火肉三明治和一杯酸奶。


    “啊，这主意真不错。”她指了指他从 `Cupid` 拿的晚餐。


    他点了点头。“是的。`Rocco` 坚持要我每天上班都带一个。我想觉得这是他帮助我们这些可怜大学生的的方式。”迪隆轻笑道。


    （注：此处原文重复，接译文）


    他的笑声很好听。“他*确实*很贴心。`Rocco` 是谁？”


    “噢，他是老板。你几乎见不到他，因为他大部分时间都在后面。他在那里做饭、打扫。把前厅留给我们他口中的‘年轻人’。”迪隆再次轻笑。“你知道那个跑堂的 `Charlie`
    吗？”


    她点了点头。


    “那是他儿子。”


    “啊。”温迪吸了一口气，用下巴托在手上。


    迪隆打量着她盘里的橙汁鸡肉。“你要吃那个吗？”


    她低了一眼。“噢。当然。”她喷了一下鼻涕。*老天爷！*她捂住嘴和鼻子。“对不起！”


    他笑了。“别告诉我，你也是那种笑起来会喷鼻涕的女孩之一？”


    温迪翻了个白眼。脸涨红了。“我不敢相信我竟然那样的。我非常抱歉。”


    “不。我觉得很可爱。”


    “很尴尬。”她咯咯笑着。


    他歪过头头。“我觉得你很可爱。”


    她清醒了过来，盯着他看。“你也不错，迪隆。”


    “听着，你几点下班？”他咬了一口三明治。


    “七点，但我得——你想干什么？”她舀起了一口鸡肉饭。


    “不知道。也许我们可以一起聚聚？”他喝了一口瓶装水。


    她笑了。“嗯，我通常会回家学习，但……”


    “是，我也是。”失望的神情掠过他的脸。


