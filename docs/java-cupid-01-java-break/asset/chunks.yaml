    温迪独自坐在学生课桌旁。离上课还有一小时，但她需要在那本 OB 护理教科书上再读一个章节。房间外的嘈杂声和笑声让她分心，但她不想为了上课特意跑一趟图书馆回来。她从书包里掏出霓橙色的耳机，插进手机。她为这种时刻准备了一份播放列表。一段长达三小时的雨林放松录音充斥了她的耳朵，她低头看向文字并读了起来。


    她喜欢雨声。或者至少，她曾经喜欢。现在这声音让她想起了上周日。迪隆来过，她质问了他关于普里西拉前一天晚上接他电话的事。


    普里西拉！只要一想到这个名字，她就忍不住皱起鼻子，仿佛闻到了臭臭虫的味道。那是她母亲经常用的一个词。


    那天大雨倾盆，温迪在那个下午向林德倾诉了心声。林德的解决方案是：去和另一个男生约会。她的闺蜜听起来像了她爸：*振作精神重新开始！*她摇了摇头。她本该学习，却在想着去和汉斯约会，到底在想什么？她现在就不会坐在这里试着读完最后一个章节了。老天，她希望今天没有突击测试。这位教授最喜欢突击测试了。


    她眨眨眼，强迫自己专注阅读。她低声读着单词，试图帮助大脑吸收信息。耳机里传来雨水拍打声。昆虫鸣叫着，偶尔有鸟鸣声。这时，教室外传来一声巨响，大到让她隔着暴风雨也听见了。


    尖叫声。


    一个歇斯底里的女人声音在走廊里回荡。其他人对着她大喊。有人吼道：“安保！”


    温迪拉了拉耳机听。那个尖叫声听起来很熟悉。她紧闭双眼。


    普里西拉！


    温迪合上书，慢慢从课桌旁站起来。那个作女的普里西拉现在到底在干什么？林德警告过她，这个疯女人随时会变成跟踪狂。今天是谁又掉了帽子（倒霉了），竟然让普里西拉·兰利出现在大学？


    温迪走进走廊，观察着骚乱。两名穿着校园制服的安保正试图抓住普里西拉。她身体一软，从他们手中滑了出去。她像一只涂了油的�螈。温迪靠在自己房间的门框上静静地看着。


    “不！”普里西拉尖叫道，“那个婊试图抢走我的未婚夫。我不允许。”她伸出一只长手指指向温迪。


    温迪教室对面的教室外聚聚了一群人。所有的目光都集中在普里西拉·兰利上演的戏码上。但当她指向那个她想要阻止的人时，所有的目光都转向了温迪。她想融进墙里消失。


    普里西拉真的在这所学校上学吗？


    普里西拉狂野的眼睛对上了温迪的眼睛。“她在那儿！过来，你这个……你家庭破坏者。像个男人——呃，像女人一样面对我！”


    普里西拉跌坐在地上，两个安保人员正扭动身体，试图牢牢抓住她的手臂。


    站在走廊里的学生们看着普里西拉的表现，就像医生观察一场医疗手术一样。难道她已经这样闹过很多次了，以至于认识她的人对她的爆发如此淡定吗？


    呵，这真是大开眼界。温迪回到教室，重新插上耳机。普里西拉的尖叫声在走廊尽头消失，雨林的声音彻底冲刷了温迪耳中的哭叫声。


    ![图像](img/00004.jpeg)


    **十**


    ![图像](img/00013.jpeg)


    温迪换了六次衣服。她想再给林德发条短信，但在衣柜里寻找合适的套装。灰色灯芯绒裤和一件猎绿色安安哥拉羊毛短袖衫将是完美的约会装。她兴奋地笑着，快速换好衣服并打扫了卧室。铺平床单，环顾四周看还有什么需要处理的。她希望一切都是完美的。迪隆随时都会到。


    她悠闲地坐在沙发上，看了一眼手机。没有短信。她清了清嗓子，打开了她的内外科教科书。她想看起来很随性，一直学习直到他到达。而不是看起来在焦虑地等他过来。她读了第一段。又读了一遍。她什么都没吸收进去。她伸手进书包，拿出一支绿色荧光笔。没有打开笔，而是用它指向每个单词，缓慢地读着文字。


    迪隆下午避开了温迪所在的那条走廊。他在医院的其他区域有一堆工作要做完。此外，他不想在医护人员面前，或者任何可能听到他们说话的人面前恳求。这件事——他想在她公寓的私密空间里告诉她。他必须让她明白自己是清白的，而普里西拉·兰利是个疯子、神经病、疯狂。这也是他几年前和她断绝关系的原因。


    老天，他希望父亲选择城里任何一家餐厅，唯独不是普里西拉打工的那一家。只要看到她，她看到他，就会点燃了她那疯狂、噬魂的性格。她应该待在精神病院里吃精神类药物。一阵寒意流过他的背脊。她需要帮助，但不是来自他。


    温迪没有给他惊喜。他在走廊尽头架起梯子，将一路工作回中央护士站。然后回去把所有的灯泡都换成新的。这只会影响走廊，病房不在这个电路上。尽管如此，他需要快点，因为医护人员对黑暗的走廊并不满意。


    他爬上梯子，松开了天花板扣，找到了镇流器。他站在梯子上够镇流器上的螺丝，小腿抵住最上面的一级梯子，以获得最大的平衡。


    火花啪地炸了一下。“啊，该！”迪隆向后一缩，梯子在他脚下摇晃。他抓着天花板的框架。铝和塑料在他的抓下断裂了。在慢动作中，他看着框架掉落。“呃！”空气离开了他的肺部，他的头撞在了坚硬的地瓷砖上。眼前布满了星光。有人在叫他的名字。一切变得越来越远。然后陷入了黑暗。


    ![图像](img/00004.jpeg)

