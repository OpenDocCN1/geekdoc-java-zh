    A light buzzed and Wendy scurried down the hall to see what the patient needed.
    A maintenance closet door opened and she veered left to avoid running into the
    huge door. A guy stepped out as Wendy dodged. He slammed into her and she staggered
    backward. Pain shot through her right leg and into her pelvis. She stood statue
    still and closed her eyes, allowing the pain to exist and then letting it go,
    like a surging roll of a timpani drum that eventually crests and fades away softly.


    “Oh! I’m so sorry,” the man said quickly.


    Slowly she opened her eyes. Everything had gone out of focus with her deep concentration
    on the biofeedback technique. His tall form stood before her. She blinked purposefully
    and waited for her eyes to adjust. Dillon!


    “Oh, Hi,” she stammered. “I knew you looked familiar this morning.”


    He smiled. “Yeah, you too.”


    Did he mean it or was he just being nice. But then again, there was the message.
    *I’m broken without you*. Did he write it?


    The second buzz from the patient’s room broke through her thoughts. “Oh, I need
    to see to this.”


    “Sure.” He stepped around her. A tool belt hung low on his taut hips. He rested
    his hands on the handles standing in the slots. As a barista he was attractive,
    but as a maintenance guy, he was gorgeous. What was it about tool belts that made
    a man so sexy? Like a military uniform, it accentuated their best features.


    Wendy shook her head to snap out of her stupor. A patient needed something and
    she needed to find out what.


    ![Image](images/00004.jpeg)


    After three hours had passed, Wendy could finally take a break. It was a welcomed
    rest in the nurses’ lounge. She heated up a Lean Cuisine dinner and scarfed it
    down, while sitting as much as possible. Two Tylenol, okay actually four, would
    get her through the rest of her shift. She closed her eyes and visualized the
    pain as a black liquid in a hollow tube inside her leg and hip. She visualized
    the liquid draining from to bottom of the tube and running down into the earth
    to be absorbed by the ground. Then she imagined the tube refilling from the earth
    with a light blue liquid. It swirled with a pearl-essence until the tube had completely
    filled to the top.


    Opening her eyes, with the intent of drinking down the bottle of water she had
    brought, she started. Dillon stood across from the table with a ladder hung on
    his shoulder. He seemed to be watching her. “Oh! I didn’t know you were there?”


    “I’m sorry. I didn’t mean to scare you.” He genuinely seemed concerned.


    “I wasn’t scared.” She giggled. “Just didn’t know you were there.”


    “What were you doing, just then?” He didn’t move from his spot.


    She cringed inside. “It’s called biofeedback. I use it to…” why was she telling
    him all this? “To manage the pain in my leg. I broke it a couple of years ago,
    skiing with my dad, and it never really stopped hurting. They tell me bone pain
    is the worst.”


    “Tell me about it.” He stepped away and set up his ladder.


    “Why?” Wendy stood prepared to return to work. “You break your leg, too?”


    He stepped up three steps on the ladder, lifted a ceiling tile and looked down
    at her. “That and both arms, a shoulder blade and four ribs. Nearly died, so they
    tell me.” He disappeared into the ceiling.


    She stared at his blue jeans and work boots. He had a nice rear end!


    Obviously their conversation was concluded. She needed to get back on the floor.
    But she wanted more than anything to stay here and learn more about this most
    interesting barista slash maintenance man who wrote that he was broken without
    her.


    “Wendy?” Heidi Carson, a new RN on Wendy’s floor, stuck her head in the break
    room. She looked up at the guy protruding from the ceiling and back to Wendy.
    “I’m ‘bout to change out an IV, you wanna come watch?”


    She glanced at Dillon’s well fitted blue jeans and returned her gaze to Heidi.
    “Sure.” It took all her will power to take a step. And then another. To leave
    Dillon up on that ladder.


    “I’ll see ya around.” She hollered up at him but he didn’t answer. Pursing her
    lips with disappointment, she hurried to catch up with Heidi.


    # TWO


    **![Image](images/00005.jpeg)**


    The next morning, Wendy lugged her Obstetrics Nursing books and purse into the
    coffee shop, anticipating seeing Dillon again. Her phone rang just as she closed
    her jeep door. “Hello Mom.” She perched the phone on her shoulder. How did her
    parents seem to always know when she arrived at her study haven? “Yes, I talked
    to Dad, yesterday.”


    A woman exited the Java Cupid and held the door for Wendy to enter. She nodded
    a thank you with her phone teetering on her shoulder and her books precariously
    balanced in her arms. Her eyes immediately searched the order counter for Dillon.
    Two girls and one black guy worked behind the service bar, but no Dillon.


    “Wendy!” her mother’s voice called across the coffee shop.


    She closed her eyes and drew in a long calming breath. Her mother’s long arm waved
    in the air like one of those air blower characters at a used car lot. Wendy glanced
    around to make sure she was the only one humiliated by her mother’s greeting.
    She lifted a hand and eyebrow to acknowledge the crazy woman. Then held up a finger
    telling her mom to wait and took her place in line to order.


    “Honey!” her mother pointed with a huge gesture at the table. “I’ve already got
    you something.”


    Wendy sighed again before turning around to leave the line. Of course she did.
    Taking the walk of shame, she went over to her mother’s booth and sat down. “Thanks
    Mom.”


    “What classes do you have today?” Her mother glared at her huge obstetrics book.


    She lifted the book as a demonstration of the class. “Obstetrics Nursing, obviously.
    And a clinical at the hospital until noon. Then I work from one to seven.


    Her mother tsked her tongue. “I just don’t see how you keep such long hours.”


    Wendy held up the cup of coffee that her mom had ordered for her. “Coffee is my
    best friend!” and sipped from the lid. Her mom order well, Chocolate Americano
    with caramel drizzle and whipped cream.


    “Well, you remember to take your vitamins, too.” Her mother sipped her own coffee
    and let her eyes wander around the cafe.


    “Right.” Wendy followed her mother’s gaze. Dillon rushed in from the back, still
    tying his apron. *Huh? Wonder why he’s late?* She imagined he had worked late
    at the hospital, but Maintenance wasn’t on round-clock shifts. Curiosity got the
    better of her, and she grabbed her wallet from her purse.


    Wendy’s mother sputtered her confusion as Wendy slipped out of the booth, but
    she ignored her. One of the female baristas, Jaime Gleason, stepped away when
    Dillon took his place, so she could wait tables. Wendy stood, focused on the column
    of people in front of Dillon, and stepped up to the end of his line.


    “Hey.” Wendy said when she reached the counter. Dillon seemed to blush slightly.


    “Hey. Same as yesterday?” he asked.


    Amazed he remembered what she’d order, especially since she had fumbled the order
    so terribly, she simply shook her head. “So, you worked late?”


    He tilted his head and considered her question. “Oh. No. I stayed up late studying.”
    He turned to make her chocolate caramel drizzle cappuccino. When the swooshing
    of the steamed milk was finished, he snapped on the lip and turned to hand it
    to her. “This one’s on me.”


    She cocked her head back. “Wha—Thank you.” She looked the cup over. “Does it have
    a secret message, too?”


