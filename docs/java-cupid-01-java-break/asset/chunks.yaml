  raw: 'It didn’t matter. Caffeine was caffeine. Why couldn’t she think of her normal
    order? “You know what?” She called to his back. “Just make it a cappuccino, something
    chocolate.” She reconsidered, that still didn’t sound right. “With a caramel drizzle…
    I think.”


    He smiled and nodded. “No problem.” Turning to fill her order, he poured out the
    beginnings of her latte and tossed the cup in the trash, lifted another cup and
    began making the cappuccino.


    She stared at his back. His nice-fitting jeans revealed an athletic build. His
    shoulders stretched the top of the white company t-shirt, but fell loose at his
    waist. Wonder what he does for fun? Lift weights, play sports, swim? He had a
    swimmer’s build. She started and glanced around. Did anyone notice her perusal
    of his body? Heat filled her cheeks again. She needed to get a grip!


    “Here you go.” He set her cup on the counter. “One tall chocolate caramel drizzle
    cappuccino with whip.” He smiled.


    With a painful groan, she shifted her book to drop her purse off her shoulder
    to pay. Between the befuddling effect of his eyes and the leg pain dominating
    her ability to think, she fumbled with her card to swap it and enter her PIN.
    Frustrated she slipped the card back in its slot in her wallet and handed him
    a five dollar bill. “Please, keep the change.”


    She couldn’t handle putting anything in her coin purse right now anyway. One last
    glance at the so, so cute barista and a grateful smile for his service, she took
    the coffee and limped away to find an empty booth. She needed to meditate a moment
    to get the pain and her functioning brain to where she could concentrate on her
    studies. Royce had taught her how to tune everything out, including the belligerent
    pain, and concentrate on what was important. In this case, that wasn’t his attractive
    backside, it was studying. She shook her head to clear those thoughts.


    The coffee shop had the perfect environment for her to meditate and study. She
    just needed to take advantage of the atmosphere. The chatter and swooshing of
    the coffee machines blended in her hearing and quickly faded into venerated white
    noise where she could focus on her readings. The nursing books were huge and the
    classes required hours and hours of study. But it was worth it. She’d be an RN
    by this summer. Just one and a half semesters to go and the State Test.


    Then she’d be independent of her parents, and they could stop hovering over her
    life. Oh, they meant well. Ever since they divorced when she was thirteen, they
    had been trying to *make it up to her* with gifts and vacations. But then two
    Christmases ago at the Vail Ski Resort with Dad, she took a horrible tumble and
    severely broke her leg. Her dad took on a double dose of guilt. He couldn’t believe
    *it happened on his watch*. She tried to tell him it wasn’t his fault. Accidents
    like this happen all the time. “Just watch any movie about a ski resort, and you’ll
    see *somebody* sitting in front of a blazing fire with their leg propped up in
    a cast.”


    The open comminuted-spiral break, as bad and painful as it, the surgery, and recovery
    had been, and still was, it had been a cosmic blessing. Because of her experience
    in the hospital, Wendy decided to become an orthopedic nurse.


    Some of her nurses were amazing and she loved them. Other nurses where mean, non-empathetic,
    and impatient. They had no business caring for people with broken bones. It truly
    took having the experience to understand and have empathy for a person who struggled
    with recovery. It was not a walk in the park. It took will power, determination,
    and a caring nurse who didn’t push too hard, yet encouraged just enough so the
    patient would get up and exercise when all they wanted to do was stay in bed and
    sleep through the pain.


    Those uncaring nurses were why Wendy wanted to be a nurse. She didn’t want anyone
    to be treated like she had been treated. Anybody recovering from an orthopedic
    incident deserved an empathetic nurse and she had the experience of being the
    patient to be that kind of nurse.


    After the accident, her dad became worse than her mom, smothering her with tender
    loving care. He owned a fourplex where he lived in one unit, rented the other
    two, and let her live, rent free, in the fourth. She accepted his kind offer while
    she attended college but tried to make him understand, as soon as she had a job,
    she would either start paying the same rent as his other tenants, or move to another
    place.


    Her mom, who seemed to be competing with Dad’s generous rental offer, bought her
    a used Jeep Wrangler and paid the insurance. The Jeep was bought outright, no
    loan, but the full-coverage insurance was paid every six months.


    She appreciated the help. Really she did. But emphasized with Mom the same conditions:
    Once she had a real job, she’d pay for her own insurance. They dismissed her insistence
    to take over expenses, which frustrated her. She didn’t want them supporting her
    for the rest of her life. It was embarrassing. Sweet, but embarrassing.


    The Med Surge Nursing textbook was a huge tome. She opened it and leaned over
    the pages to read. The assignment was five chapters and class was at ten o’clock.
    She had read three last night after work but fell asleep. She worked at the hospital
    as a CNA after school until nine at night. The hours were flexible enough to work
    around her schedule but the pay was minimal. It gave her food, gas, and utilities
    money. Frankly, she didn’t know how her co-students made ends meet if they were
    on their own. She had to admit, with her parents’ help, she wasn’t suffering at
    all, as a student. Still, she looked forward to a real salary. And independence.


    Drool stained the page of her textbook. The ink had bled into the wet spot like
    a watercolor stroke. She had two more chapters to go this morning and she’d be
    ready for class. Piece of cake. Piece of red velvet cake, she mused at her jumbled
    up order when Dillon asked her what she wanted to drink.


    She lifted her cup and took a sip.


    Something caught her eye. She held the cup out and really looked at it. A message
    slowly appeared just above the heat shielding sleeve. It was like the secret agent
    kit she had as a kid with lemon juice and a candle flame to reveal the mysterious
    spy code. Someone must have written it with a heat sensitive pen—was there such
    a thing?—because it wasn’t there a minute ago. The words turned burnish against
    the white paper cup.


    “I’m… broken… without… you.”


    She stared at the handwritten message. Did Dillon write this while his back was
    turned to her? She glanced at him across the room. He busily wiped the counter
    between customers and flashed a quick glance toward her. Their eyes met and he
    paused.


    The chatter and the machine’s noise faded, as did the people, the tables, the
    coffee shop. There was nothing—but Dillon and her.


    He smiled at her and tossed his cleaning rag down on the counter to wipe a spill.
    His eyes followed the rag. The spell broke and all the chatter and swooshing resumed.
    He continued wiping the counter and then spoke to the next person in line.


    She continued to stare at him. What just happened? She lowered her eyes to the
    cappuccino. The message faded to a yellow-brown. Wendy considered the words. Broken
    without you.


    How did he even know her? Although he did look familiar! Why would he write this
    message to her?


    Why was he broken?


    ![Image](images/00004.jpeg)


    Later that afternoon, Wendy changed out of stark-white student scrubs into work
    scrubs and headed to work. A six hour shift at the hospital gave her more than
    a small paycheck. The RNs and LPNs she worked with knew she was a second year
