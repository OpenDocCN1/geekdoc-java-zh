    He scanned the boring cafe. *Come on, drop something, kiss someone, have a coffee
    bar brawl. Give me something, anything.*


    His fingers moved over the keyboard as he started to type out a scene of a coffee
    bar brawl. Then he shook his head as he realized how ridiculous it was and erased
    it all. He sighed and put his head in his hands. His coffee was cold and he was
    out of snacks. He’d been here an hour and had nothing to show for it.


    “Excuse me.”


    Rob looked over at the woman seated at the table to his right. She was breathtakingly
    beautiful with her beach-girl tan and sun-bleach-blonde hair. The thing that caught
    his attention though was her right eye was a golden brown while her left was that
    he would call ice blue in color. “Me?”


    She smiled and his pulse sped up like a trip hammer. “Yes, um, could you watch
    my things for a minute? I need… ummm…” She blushed and Rob laughed. “Gotcha, sure
    I’ll make sure no one messes with anything.”


    “Thank you.” She quickly scurried to the restroom that sat between the coffee
    shop and the bar and grill. Rob pulled up a character sheet and quickly described
    her. *Five foot five, long sun-bleached blonde hair, cupids bow lips, bubblegum
    pink in color. Right eye golden brown, left eye ice blue. Curves in all the right
    places, early twenties.*


    Then he typed: *Name? Occupation?*


    After that he opened a new document and titled it “Love at the Coffee Shop,” and
    started typing away. He was thankful. It wasn’t the book he had been working on
    but this was an open deadline book. Meaning he just needed to meet the deadlines
    with a romantic novel between thirty-five and fifty thousand words. It wasn’t
    for one of his multi-author series that had to follow a certain format and plot.
    Those ideas he’d already submitted. No this was for a romance contest and would
    allow him a discounted table at the convention later this year.


    He looked up as he felt someone approach the lady’s table. He smiled when he saw
    it was her. “Nothings missing except the five hundred dollars I took from your
    backpack there. Table security fee.”


    The girl laughed and it sounded like little tiny bells tinkling together, sending
    his pulse on another run and causing other places to get a bit uncomfortable in
    a very pleasant way.


    “Well, if you found five-hundred dollars in that bag, then you deserve it. Thank
    you for watching everything. I didn’t want to lose this awesome table. I can’t
    watch everyone from elsewhere.”


    He nodded and indicated his table. “That’s why I’m sitting here. It’s the best
    seat for people watching.”


    She smiled a little half grin. “Yes it is I was going to set there but some hot
    guy in a American Eagle T-shirt was sitting there when I got here.”


    That uncomfortable feeling got a bit tighter. She thought he was hot. “Really?
    Well that’s strange, I didn’t see anyone here when I arrived, must have just missed
    him. Maybe you should describe him to me, so I can take some notes.”


    She smiled. “Well, I could just let you copy my notes if you really want.” She
    turned her smart book screen toward him and he was shocked to see the character
    sheet from the writing program he used.


    “Are you an author?”


    Her smile faded and he wanted to say anything to put it back on her face again.


    “No, an author has stuff published. I don’t have anything published, yet. I’m
    just a wanna-be writer.”


    He reached out and took her chin in his hands. The spark of electricity that ran
    through him was almost intense enough to make him let go. Her breath caught so
    he knew she’d felt it too. *Well what do you know that really does happen. I thought
    it was just literary devices to explain the unexplainable.* “Darlin’ there is
    no such thing as a wanna-be writer. If you have that program and are putting words
    on a manuscript you’re a writer. The author part will come in time.”


    He let go of her face, but not before trailing the back of his hand across her
    check.


    “I hope so.”


    He smiled. “Trust me on this, I know so.”


    He flipped his `MacBook` around so she could see the character sheet he’d been
    working on for her.


    Her eyes got big. “Your an author? Really?”


    “Yep sure am.”


    He saw it forming on her face, the question all authors hated to get asked but
    everyone always asked when they found out you were an author so he said it with
    her “Have you written anything I might have read?”


    She laughed. “You get asked that a lot?”


    He grinned. “Anytime someone finds out I’m an author.”


    “Oh, well, sorry, but the question still remains, have I?”


    “Do you read a lot?” he asked


    “Yes, all the time.”


    “Well, not all the time You’re not reading now. You were writing, then you went
    potty and now you’re talking.”


    She slapped his arm. “You know what I mean.”


    He grinned. “Well, what do you read? What genres?”


    She blushed and he laughed. “Ah a romance reader.”


    She bit her lower lip and nodded. He couldn’t help but wonder if that bubble gum
    pink lip tasted like bubble gum. “What kind of romance do you read?”


    “Oh, all kinds, Historical, Modern, Regency, right now I’m reading this really
    cool Paranormal Romance series.” She reached into her backpack and pulled out
    his latest book. “Have you heard of this series? It’s the hottest thing right
    now.”


    He grinned. “I have heard of those, yes, and I would have to say in answer to
    your earlier question, you most definitely have read my work.”


    “Really, you right romance? I only know of one other guy who writes romance novels.
    As a mater of fact this guy she held his book up. What’s your name? I want to
    see if I have any of your books.” She grabbed her `kindle` from the backpack.


    He laughed. “I promise you, you’ve read at least two of my books if you’ve been
    reading that series.”


    Her eyes got big “Your R.G. Donovan, the guy who created the Phantom Horse Bridge
    Series?”


    “My friends call me Rob or R.G. but ,yep that’s me.”


    “Oh My God!! Can we take a selfie together? My writers’ group isn’t going to believe
    this.”


    Rob laughed. Tell you what, let’s get someone to take it for us, that way we won’t
    have that weird big forehead thing everyone has in selfies.”


    Rob saw the special needs kid who worked as a busboy a couple of tables away.
    “Hey Charlie, come here.”


    The young man put his tub of dishes on the table and waddled over to him. “Hello,
    Mr. Rob. You need refill?”


    Rob shook his head. “Not this time, buddy. Do you know how to take pictures with
    that kind of camera?” He pointed to the girl’s cell phone?


    Henry grinned and nodded. “I has one jus like it.” He reached in his pocket and
    pulled out a phone. “See?”


    “That’s awesome, buddy. Would you take a picture of me and..”


    “Aurora.”


    Charlie’s eye widened even more than they normally were. “Like the Disney Princess?”


    “Yes, just like the Disney Princess. My mom named me after her.”


    “Wow, you famous!!”


    Rob smiled at the guy. “She is, that’s why I need you to take a picture of us
    for me, okay?”


    Charlie thought for a minute. “Okay, Mr. Rob. Princess Aurora, can I take picture
    with you, too?”


    She handed him her phone. “I’d love to take a picture with a handsome prince like
    you, Charlie. Right after I take one with Mister Rob, okay?”


    “Okay!”


    She leaned in close to Rob, and he breathed in her scent. It was very faint like
    the honeysuckle that grew up the trellis under his writing nook at home. But it
    was mixed with a spicy scent like nutmeg or cinnamon. *She smells just like you’d
    imagine a Disney Princess would smell.*


    Charlie held the camera up. “Say, ‘Coffee Cupid.’”


    They said it and he snapped the picture. Then Rob stood up. “Give me your phone
    Charlie, and go sit beside Princess Aurora.”


    Charlie did. “Okay say, ‘Mocha Latte.’” Just as he got ready to snap the picture
    Aurora turned her head and kissed Charlie on the cheek. The young man blushed
    and looked at Rob. “She kissed me! Does this mean we gots to get married?”


    “No, Charlie, she didn’t kiss you on the lips, so you don’t got to get married.”


    “Okay! Good, because I already gots a girlfriend at the center.”

