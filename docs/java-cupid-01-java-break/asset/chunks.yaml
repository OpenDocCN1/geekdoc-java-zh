  trans: '

    林德赛抿了一口酒，沉默不发地听着。当温迪长长叹了口气结束她的讲述时，她的闺蜜才开口了。


    “所以。这个‘普莉西拉’该不会就是普莉西拉·兰格利吧？”


    温迪抬起满是泪水的眼睛。“是。你怎么知道的？”


    林德赛挑起精心修整过的眉毛，喝了一口酒。“噢，温迪。我可以给你讲讲普莉西拉·那个‘大麻烦蛋’的故事。她是个病态的谎谎。她简直是个变态！我表弟，`Dean`
    在兄弟运动酒吧遇到了她。她死死地缠住他，就像他是世上最后一个幸存者一样。起初他觉得很棒。你知道他个人有多体贴吧？”


    温迪点了点头。


    “然后她就开始变得很诡异，像个变态婊脸一样对他发疯。指责他见其他女人，可他只是来我这儿聚聚，就像我们大家一样。她曾和他一起来过这里，我知道我是他的表妹。我告诉你，她就像个俄罗斯间谍。她会在他的车钥匙上放一根头发，这样就能判断他是否离开过家。她在他的鱼具箱里倒了一罐蜂蜜，让他没法去钓鱼也没法离开她。她还划了他的车——”


    “那辆很酷的野马？”温迪瞪大了眼睛。


    “没错！听着，接着她就变成了一个地狱级别的跟踪狂婊脸。她在全城到处跟着他。她会出现在他公司门口，告诉他们她奶奶去世了。`Dean` 就会冲到大厅跟她说话，而她就在那儿变态地尖叫着让他回家。他们不得不禁止她进入那栋楼。`Dean`
    也不得不申请限制令。简直太荒唐了。


    “她还指控我跟他偷奸。她给我发短信，除了没把白人女性什么话都骂。我真没开玩笑，普莉西拉·兰格利绝对疯了。


    然后她怀了别人的孩子，显然她连孩子是谁都不知道。她父母受够了，把她踢到了路边，但他们获得了孩子的抚养权，并把他当成亲生孩子抚养。那是 `Dean` 这么说的。”


    温迪歪了歪头。“`Dean` 不会——”


    “不知道。他发誓不是，但老实说谁知道呢。这真可哀。我挺心那个孩子的。”


    “嗯，确实。但是——”


    “不。”林德赛抬起手，“别往下想了。`Dean` 和我谈了很久。即使孩子是他的，他父母的钱也比上帝还钱，跟他们在一起过得更好。`Dean` 做不到他们能做到的。”


    “好吧，确实，但是……行。不提这件事了。一想起来我就心胃疼——”温迪看向林德赛，叹了口气，“我现在闭嘴。”她抿了口酒。林德赛又给自己倒了一杯。


    “听着。”林德赛突然脱口而出。“如果你对那个 `Dillon` 没把握，不如我把我的朋友 `Hans Jaeger` 介绍给你怎么样？”


    温迪摇了摇头。


    林德赛在沙发上往后挪了挪，双脚缩在身后。“不，真的。他在律所跟我一起工作。他跟我一样是法律助理。而且超级帅！他很高……而且帅——”


    “那他有什么问题？”温迪咯咯道。


    “没问题！”林德赛灌了一口酒。“我发誓！”


    “噢。”


    “就去和他约会吧。至少这能让你从和 `Dillon` 的烂摊子里抽离出来，也许你想得更清楚。看电影还是去博物馆？嗯，去博物馆。你喜欢博物馆，这样你们就可以聊天并互相了解。我现在就给他发信息。”她拿起手机发短信。


    温迪深吸了一口气。她到底在听林德赛说她去做什么？就像她说的，至少这能让她忘记她和 `Dillon` 搞出的那团乱麻。谁知道呢，也许 `Hans`——光是这个名字。她摇了摇头。一个叫
    `Hans` 的人怎么能取代她的 `Dillon`。她真的有时间去约别人吗？她有这么多课要上，而且已经很快落后了。“听着，林德赛，我觉得这不是个好主意。”


    “太晚了。”林德赛的脸颊因为酒劲变得通红。“他说让你什么时候就告诉他。他很想见你，博物馆听起来很棒。”


    温迪叹了口气。“啊。你把我带进了什么样的境地？我有这么多课要上，林德赛，你根本不知道。”


    “那就回家学习吧。你下一次休息是什么时候？”她用肘撑在沙发背上，用手托着头。


    温迪拿起手机打开 `calendar app`。“我明天休息。但我到一点钟前都有课。”


    “太好了。”林德赛又倒了酒，加满了温迪的杯子。“这你有足够的时间赶进度，你明天下午可以和 `Hans` 出去，就吃个早晚餐。”林德赛发了信息。


    温迪考虑了朋友的计划。为什么不呢？至少，她要让 `Dillon` 明白他不是池塘里唯一的鱼。但为什么林德赛的朋友非要叫 `Hans` 呢？她想象了一个巨大的金发巨兽，长着银色的鲨鱼牙，如果他说话的话，那是一口破碎的英语。她深吸了一口气。“好吧。我最好还是回家赶赶进度。”


    林德赛站着，身体微微晃动。“真为你。”她说话含糊不清。温迪瞪着她，把没喝完的酒杯递给她。“给你。你哪儿也别去。你喝多了。”


    “我不会的。”林德赛抱了温迪。“我和 `Zelda` 要看电视睡觉。”


    “好。”温迪又抱了她的朋友一次。“谢谢你。我想。”


    林德赛笑了起来。“你会喜欢 `Hans` 的，他是个甜心！”


    # 八章


    ![Image](img/00011.jpeg)


    第二天一早，温迪通过去 `Conoco Station` 买早咖啡避开了 `Java Cupid`。当她抿了一口浓郁的 `Mocha Cappuccino`
    时，她皱了皱脸，但至少有咖啡因。当她开车朝大学驶进 `Java Cupid` 购物广场停车场时，她没忍住自己。天哪，现在是谁是跟踪狂婊脸了？她缓慢地开车经过巨大的玻璃窗，眯着眼睛看向咖啡师柜台。她认出了
    `Dillon` 高大的身影和黑色围裙。他正在等一个金发女人。


    温迪猛踩刹车，盯着那个女人。她蹦蹦跳跳，因为他说的话而兴奋不已。然后她跳到柜台上，搂住他的脖子。普莉西拉！


    噢，。`Dillon` 昨天的表现值得得一个奥斯卡。温迪一踩油门冲出停车场。她真是个傻瓜！她摇着摇头闯了一个红灯。瞬间，她身后响起了警报声，红蓝灯映满了后视镜。


    她吹了吹刘海，靠在路边。


    麦维警官很有礼但坚定。不过话说回来，温迪对他也很礼貌。她不想在一个警察身上发泄情绪。尤其是抓她鲁莽驾驶闯路口的警察。那个灯红了多久了？她老实不知道。


    “对不起，警官。我心不在焉。这就是我能说的全部。”温迪诚实地说。


    “女士，你需要集中注意力并多注意。”他撕下罚单递给她。


    她转过罚单，呻了一声。“两百四十美元。”她要怎么付这笔钱？根据底部的小字，她有两周时间。也许她可以加个班。还什么周末学习啊。她叹了口气，系好安全带。离开路边时，她的思绪又回到了普莉西拉跳上柜台拥抱
    Dillon 的画面。他对她说了什么？她摇了摇头。


    混蛋！


    也许 `Hans` 会是个更靠谱的家伙。一个法律助理，像林德赛一样。如果她的闺蜜能代表这个职业的性格，那这次约会很有戏。


    她进了大学学生停车场走上教室。


    她的手机响了。是妈妈。“今天早上的你的咖啡男朋友怎么样？”妈妈发信息。


    温迪翻了个白眼。她完全不知道。“不知道。改去 Conoco 了。”


    “真讨厌。LOL”妈妈回复道。


    “不是吧？”温迪回道。她妈妈只认识两个短信缩写是 Laugh Out Loud（大笑）和 I Know, Right（我知道吧）。其他的，她得花更多时间去解释这些字母的意思，而她今天早上没时间和妈妈进行更多对话。

