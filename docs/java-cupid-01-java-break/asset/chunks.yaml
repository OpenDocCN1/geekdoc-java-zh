  raw: 'He dropped his hand to the bottom of her shirt and ran it up the back toward
    her bra. He twisted the clasp and it sprung apart. His kiss deepened and his tongue
    sought hers. Her midsection ignited with fire and she wanted nothing but to have
    him.


    The doorbell rang.


    They froze.


    Her eyes darted to the door. She closed them and blew out air. Quickly reattaching
    her bra, she straightened her shirt and stood. A sultry look remained in his eyes,
    but he straightened and sobered. She opened the door.


    “Aw, come on!” Her dad said in a loud voice. “I can’t possibly eat all this. You
    kids take it.” He shoved a Pizza Hut box at her, and a two liter bottle of Coke.


    “Dad!” She bulged her eyes. God, he had bad timing! “Uh. Thanks.” She took the
    box and Coke, and shoved her dad back with the door as she closed it. She turned
    to face Dillon. He laughed. She had to giggle, too.


    “Want some pizza?” She busted out laughing.


    ![Image](images/00004.jpeg)


    “Man.” Dillon wiped his hands and mouth on a napkin and lifted the empty pizza
    box. “You weren’t kidding about your dad.”


    “Here, let me.” Wendy took the trash and threw it away under her sink. “I know,
    right! Just wait’ll you meet my mom!” She rolled her eyes.


    “You mean, she’s worse?” He chuckled.


    “No, not worse, but just as bad. I take that back. Actually, Dad is the worst.
    He blames himself for my accident, couple that with their divorce when I was young.
    He’s riddled with guilt and just can’t do enough… you know?” She returned to the
    living room and eased down beside him. “I keep telling him that he’s not to blame,”
    She shrugged.


    “My mom’s dating a douche. First guy that I know of since she and Dad got divorced.


    “How long they been divorced?” Dillon took her hand in his.


    Her mind went blank with is touch. “Um. I—since I was thirteen. Let’s see… I’m
    twenty-two…”


    He kissed her fingers.


    “I can’t think, when you do that.” She pulled her hand out of his. “Um. Nine years.”


    “And this is her first time to date?” Dillon sighed and rubbed his collar bone.


    Did his shoulder hurt? Wendy nodded. “As far as I know.”


    Dillon smirked and one eyebrow rose. “Well, at least she waited a decent amount
    of time. My dad’s already dating some bimbo. My mom’s barely cold in her grave
    and he’s already hot-footin’ around. My biggest fear is he’s not thinking straight.
    You know? He misses Mom, and I won’t let him treat me like a child. So he wants
    somebody to take care of, I guess. But—“


    She tilted her head. “But what?”


    “Wendy, I’m not bragging, okay? It’s just the facts. My dad’s a lawyer. A successful
    lawyer. Basically, he’s loaded. And I’m afraid for him when it comes to his ability
    to discern a good woman from a gold digger. You know?”


    Wendy nodded. “Sure. That’s an awful short period of grief. I saw this thing on
    Facebook one time that was profound. It said ‘Everybody grieves the same. Only
    some do it before and other do it after the death.’ I guess since your dad knew
    it was coming, he did his grieving before… I don’t presume to know.” She stared
    at her hands. ”Take my mom, for example. When she and Dad split up, she went to
    a dark place and it was a couple of years before she came back. She’s great now.
    And actually, when she was telling me about this guy, she seemed really happy.
    I suppose that’s all I want for her. That and to get out of my business.” She
    giggled.


    “But you said he was a douche?”


    “Assumption on my part.” She giggled. “I haven’t met him, really.”


    “Same here.” Dillon smiled. “So, I guess since I came over here to study with
    you, we ought to at least crack a book open.”


    She stared into his crystal blue eyes. “Yeah. I guess you’re right. Although I
    liked where it was going before Dad brought the pizza.”


    Dillon smiled mischievously. “Me, too. But I really do have stuff I need to read.”


    She sighed. “Yeah, so do I.”


    They pulled their textbooks into their laps and snuggled next to each other. Wendy
    sighed with contentment. Studying had never been so much fun.


    She had five chapters to read in her Med Surg Nursing book before class tomorrow
    and a worksheet from the Obstetrics text. She read through three, highlighting
    important information, lifted the worksheet for something different to wrap her
    brain around, and began filling it out. Her eyelids grew heavy and she blinked
    very slowly.


    Dillon had laid his head back on the couch and breathed heavily. She goosed his
    ribs to wake him. He jumped way bigger than she’d expected. Oh, his ribs are still
    sensitive! How could she forget such a thing. “I’m sorry, I didn’t mean to hurt
    you. Were you asleep?”


    “No, just resting my eyes.” He rubbed his side with his forearm and then massaged
    his collar bone with his thumb as he forcibly exhaled.


    “Well, I’m falling asleep. So either I’m going to bed and you’re going home, or
    I’m going to bed and you can stretch out on the couch. Either way, it’s after
    midnight, and I’ve got a nine o’clock class in the morning. Not to mention my
    date with a perfect cappuccino at seven so I can get the rest of this monster
    read.” She patted the huge textbook in her lap.


    “Yeah, and I’m scheduled at the Cupid at five-thirty for prep… so I better go.”


    Disappointment washed over her, but she knew it was the smarter move. “Okay. See
    you tomorrow morning?”


    “Yes ma’am. Cappuccino, chocolate caramel drizzle—“


    “*with whip*.” They said together and laughed. He smiled and pulled her into a
    long and passionate goodnight kiss.


    She staggered when he released her and mumbled, “G-Good night.”


    ![Image](images/00004.jpeg)


    Wendy’s alarm sounded on her phone and she sprung out of bed. Even though she’d
    been up late studying with Dillon, she tossed and turned in bed thinking about
    him and the way he kissed her. Sleep wouldn’t come for her, but thoughts about
    other things she wished she could do with him were front and center in her mind
    the rest of the morning. So when it was time to get up, she happily zipped out
    of bed and into the shower. Knowing he would be behind that counter when she got
    to the Java Cupid gave her energy she’d never experienced in the wee hours of
    morning.


    As she climbed out of her Jeep, she lifted her phone. Neither parent had called
    this morning. That was odd. Entering the Cupid her eyes spotted Dillon and she
    smiled. He caught her eye and returned the happy expression. *Man, he’s cute!*
    She took her place in the line leading up to Dillon. Her mind drifted to last
    night. The feel of his lips on hers. The tautness of his abdomen. She could feel
    his warm hand exploring under she shirt.


    “Wendy?” Dillon called to her.


    She opened her eyes. The line of people in front of her were gone. She stood four
    feet from the counter. “Oh. God. I’m sorry.” She quick stepped to the counter
    and leaned in. “I was thinking about us.” She giggled.


    He flashed that perfect smile and winked. “What can I get ya? Cappuccino chocolate
    caramel drizzle, with whip?”


    “Actually, I usually get a tall Chocolate Americano with caramel drizzle and the
    whipped cream. I don’t know what I was thinking the other day. You do things to
    my brain.” She giggled.


    He lifted on eyebrows. His voice was low and sultry. “I like doing things to you.”


    Heat filled her face and her ears burned. He turned to make her drink.


    “Wendy!” Dad called from across the café.


    She closed her eyes and drew in a calming breath. “Dad.” She refused to holler.
    Dillon set her cup on the counter. “Mr. Ashton.” He dipped his head in greeting.


    “It’s Lance, please.” Her dad shook Dillon’s hand. “Good morning, Dillon.” Lance
    had a twinkle in his eye.


    “What can I get you, sir?” Dillon asked.


    Lance looked at the line of people behind Wendy. “Oh I don’t wanna cut in line.”


    The older man behind Wendy who was reading a quarter folded newspaper looked up.
    “No, go ahead.”


    A soft grumble resonated behind him. Lance glanced back at the line. “Just give
    me a House coffee, black.”


    “You got it.” Dillon stepped back and filled a white ceramic mug with the Java
    Cupid logo printed on it. “There you go.”'
