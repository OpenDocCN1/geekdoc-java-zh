    He punched his forehead with his palm and winced. “My head hurts.”


    “You’ve got a concussion. And you broke two ribs when you fell. You’re pretty
    lucky though. That’s what your dad said.”


    “Dad’s here?”


    “Well, he was. So was my mom. But they went home around one. Your dad let me stay.”


    “Good.” Dillon reached out and took her hand. “I love you, Wendy. I’m so sorry
    about Priscilla and all the mess she caused. I—“


    “Shh. Don’t worry about that now. Besides, I know you’re telling the truth.”'
