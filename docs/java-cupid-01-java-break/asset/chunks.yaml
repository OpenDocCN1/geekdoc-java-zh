    about to begin and she didn’t want to get kicked out because her mother couldn’t
    help but get the last text in. Even if it was just an emoji. A slight vibration
    reverberated against Wendy’s back. One corner of her mouth lifted. She knew her
    mother so well.


    ![Image](images/00004.jpeg)


    Four changes of clothes lay on Wendy’s bed. She stood in her closet staring at
    what was left. Jeans? A dress? A skirt and a nice blouse? Dress pants? She lifted
    her phone and texted Lindsay. “WHAT TO WEAR?”


    Three dots blinked as she waited for Lindsay response. “Wear your green jeans
    and that grey sweater.”


    Brilliant! Wendy pulled those two items from their hanger. “Shoes?” she texted.


    “Those black ankle high boots.”


    Perfect. Wendy lifted them from the shelf. “THX”


    “Sure. LOL”


    Wendy dressed and ran a comb through her hair. She applied more powder and some
    blush. Then freshened her lip gloss. There. That’s as good as it gets. She stared
    at her reflection in the mirror. Just then her doorbell rang and her stomach did
    a somersault. *Oh God! This is such a bad idea!* She hurried to the door and pulled
    it open.


    Lindsay was right. Hans was tall, dark, and handsome. Obviously of Italian descent.
    He looked like a matrix character in a long black duster, black pants, and a dark
    blue silk shirt. His hair looked wet and combed straight back. His eyes were dark,
    but his teeth were white. He had a nice smile. “Wendy?”


    She smiled back. “Hans?”


    He smiled and put his hand out to shake hers. Awkwardly, she shook his.


    “Are you ready to go?” He had a nice voice, too.


    “Sure, just let me get my coat and purse.” She stepped back to retrieve both.
    Hans waited on the stoop. Why hadn’t she invited him in? Slipping up to his side,
    she walked with him to his car. “Nice Charger.” She said as he unlocked it with
    the remote and opened her door.


    “Thanks. It’s was a Christmas present from myself.” Pride sparkled in his smile.


    He eased down in the driver’s seat and started the engine. The throaty roar as
    he revved the Hemi was exciting. He turned to her with his hand on the stick shift.
    “Where do you want to eat?”


    She chuckled. “Anywhere but Red Robin.”


    He nodded and pursed his lips. “Quiet or fun?”


    She considered his question. Quiet would be nice so they could get to know each
    other. Fun would be… well fun. Like the laser tag date she’d had with Dillon.
    Suddenly, she felt guilty for being here, in Hans’s car. What was she thinking?
    “How about quiet.”


    “Quiet, it is.” He put the car in gear and popped the clutch.


    She had no idea where they were going. Her stomach churned with acid. Hunger was
    the furthest thing from her wants or needs. She wished she’d never agreed to this
    date. How did she let Lindsay talk her into this? He pulled into a CiCi’s Pizza
    parking lot. This was his idea of quiet? Everybody she knew came here to eat.
    Even though they were having an early dinner… still the probability of running
    into someone she knew was highly likely. She sighed and undid her seatbelt. Hans
    walked around and opened her door, extended his hand to help her out of the low
    seated Dodge.


    “I gotta admit, I wasn’t expecting this.”


    “Is this okay?” He quickly stopped walking and turned to face her.


    “Oh, yeah.” She nodded. “It’s okay.”


    “Good. Lindsay said you love pizza.”


    Good ol’ Lindsay. “I do. Who doesn’t love pizza?” Wendy giggled. Hans took her
    hand and led her into the restaurant.


    Plates piled two layers with slices from the bar, and a drink from the fountain,
    Wendy sat across from Hans at a four top table. “So, Lindsay says you two work
    together?”


    Hans chewed his pizza, holding up a finger to indicate ‘wait.’ He swallowed and
    wiped his mouth with a paper napkin. “Yes. I’m a paralegal like her, but we work
    for different lawyers. I’m down the hall from her. We handle litigation and business
    law. She’s with the Keel brothers. They handle family and health law. Of course,
    either side will handle a divorce or two, depending on who the client is. And
    the other partners handle criminal, but we don’t ever get into that.”


    Wendy nodded. Wow. A lot of information about nothing. She ate a slice of pizza
    and looked around the restaurant. Several couples and families were vigorously
    engaged in conversation, while she couldn’t think of anything to say. Why didn’t
    he ask her about her career or school?


    “So, I’m studying to be a nurse.” She finally started her own discussion.


    He nodded and held up a finger. Once he swallowed and wiped his mouth. “Yeah,
    Lindsay told me that.”


    “Okay.” Wendy drank her water and glanced around. A little girl in a polka-dot
    dressed was excitedly telling her mother about a grasshopper, only she called
    it a hopper grass. The mother responded with such enthusiasm one would have thought
    this was the most interesting tale of all times. Wendy lifted her eyes to Hans.
    He had finished his pizza and excused himself to go back for the dessert pizzas.
    “Sure.” Wendy responded and sighed. She ate another slice and stared at the next
    two pieces. She couldn’t eat another bite. Hans returned with an apple strudel
    pizza and three cinnamon sticks. He ate them while she leaned her chin on her
    hand and watched. “So, what do you do for fun?


    He looked at her with raised eyebrows. Lifted a finger and swallowed. Finally,
    cleaned his mouth with the napkin. “I set up campaigns. I’m a gamer. We have a
    group who meets every Saturday. Would you like to join? I’ll send you an invitation.
    The group would love to have a fresh player.”


    She had no idea what any of that meant. “Like Dungeons and Dragons?”


    “Well, yeah, like that, but we don’t do D&D anymore. It’s rather out-dated. We
    favor detective type campaigns such as Call of Cthulhu, and—”


    “I’m not sure. Saturday is usually pretty busy for me.”


    He shook his fist and pantomimed throwing a die. “A Natural One.” He smiled sardonically.


    She stared at him. “A what?”


    “Critical Fail.” He shrugged a shoulder as if that explained all that needed to
    be explained. “So, when you finish, would you like to check out the museum?”


    Wendy stared at the pizza in her plate. “Actually, I can’t eat another bite.”
    She considered his offer. What she really wanted to do was go home. “I don’t know.
    I hate to do this, but I’m really tired, and I’ve also got a lot of studying I
    need to get done before class tomorrow. Would you mind if I took a rain check
    on the museum?”


    Concern washed over his expression. “Are you feeling okay?”


    “Oh, I’m fine.” She tried to sound sincere. “I haven’t slept well lately, and
    I let myself get behind on my studies. Nursing school is grueling and if I don’t
    stay on top of it, I get behind super easily.”


    “I understand. Pre-law was the same way. TONS of reading.” He seemed sincere.
    “Let me go wash my hands, and I’ll take you home.


    “Okay?” Wendy watched him walk to the restrooms. Should she wash her hands? Being
    in the medical field she thought she was more conscientious about washing her
    hands than anybody, but it seemed Mr. Paralegal was even more so. She chuckled
    to herself. This would be a funny story to tell Dill—


    Oh God, what was she thinking?


    Tears sprang into her eyes. She leapt out of her chair and waited for Hans to
    return. She stood by the exit door, watching the restrooms, blinking vigorously
    to stifle the stupid tears. Finally, he emerged from the hall and looked around
    the restaurant. Locating her, he smiled and quickly caught up with her. He touched
    her back. “Ready?”


    She nodded.


