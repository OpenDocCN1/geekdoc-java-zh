    Hans parked his Charger at the curb to Wendy’s apartment unit. He jumped out and
    jogged to her side of the car. Wendy had already opened her door and climbed out.
    Exhaustion exacerbated the ache in her leg more than usual. A hot, Epsom salt
    bath and some Tylenol was in her near future. Meanwhile, she favored the skiing
    relic as she walked to her porch. He took her arm as an escort until she stepped
    onto the stoop, then turned to face her. A nervous tremble evident in his hand
    when he reached for his head to slick back his perpetually wet-looking hair. “I-I
    had a good time.”


    She stared at him a moment. “We really didn’t do much.”


    “No, but what we did was fun. I hope we can do more another time.” He took her
    hand in his and gently stroked his thumb over her knuckles. “When you’re feeling
    better.” He glanced at her leg. “It still bothers you… a lot.”


    “What?” Wendy glanced at her hand in his. It felt cold and clammy.


    “Your leg. Lindsay told me about the terrible fall at Vail and how much trouble
    it still gives you.” His thumb rubbing over her ring finger knuckle, a nerve rolled
    under his touch over the bone, sending a zing of pain into her wrist. She winced.
    “Ow.”


    “Oh, I’m sorry. I didn’t mean to hurt you.”


    “No. I’m probably just a little sensitive right now. That storm yesterday made
    my joints ache. I think it’s just residual from the barometric pressure.” God,
    she was talking meteorological effects on her bones, like she was some old woman
    sitting on the rest home porch. Where was her rocking chair? A walker? She rolled
    her eyes.


    He stopped rubbing his thumb over her knuckles and just held her hand. His eyes
    were downcast, staring at her hand, then he lifted his eyes to hers. A slight
    smile lifted the corners of his mouth and he leaned into her. “Until next we meet,
    M’lady.” He leaned closer, his lips puckered out to kiss her. His eyes half closed.
    She didn’t move but let him move in close and touch her lips with his.


    She kissed him quickly and leaned back. “Yeah.” She turned to unlock her door.
    He ran his hand over his hair and straightened. “You’ll be alright?”


    “Oh, sure.” She turned the key and shoved her door open. “I’m used to living alone.
    I’ll be fine.”


    “Well, all right. I’ll call you.”


    “Oh, okay. Thanks, Hans.” She quickly entered and waved goodbye, then shut her
    door. She wanted to look out the window to see if he still stood there, or if
    he’d gone to his car. She leaned against the door and waited. Soon she heard the
    Charger’s engine rev and knew he was leaving. She sighed. God what a fiasco!


    Should she call Lindsay… or Dillon?


    No! Don’t call Dillon! He obviously had rekindled his relationship with Prissy
    Priscilla. Wendy had let him slip through her fingers. A hiccup caught in her
    throat as she willed a sob to go away.


    Now where would she get her morning caffeine? For the first time, she seriously
    considered buying a Keurig.


    ### NINE


    ![Image](images/00012.jpeg)


    This is ridiculous! Wendy threw back the covers and padded to the bathroom. She
    was a grown woman and could go wherever she wanted to get her morning coffee.
    Regardless of who might serve it to her there. So it didn’t work out with her
    and Dillon. Big deal! She still could go to the Java Cupid and have her coffee.
    She’d be the better woman and wish him well, with psycho-crazy Priscilla Priss.


    Soon, she was dressed and driving to her favorite morning spot. The bus-boy was
    cleaning a table as she walked in and sat down. He looked at her sweetly and smiled
    his crooked smile. “Goomorning,” he said with a thick tongue. God, what was his
    name? She knew it…


    “Good morning. What is your name?”


    His eyes lit up. “I Charlie.” He picked up his dirty dish-tub and hurried to the
    back. His jovial disposition made her smile. Leaving her backpack in the seat,
    she approached the barista counter. Intentionally getting in a different line
    from Dillon’s, she waited.


    His eyes met hers and time stood still.


    He tipped his head back to acknowledge her and then he asked the woman in front
    of him what she would have. Wendy averted her eyes and stared at the door through
    which Charlie had disappeared.


    A sous chef in dreadlocks stood at a large wooden table chopping what looked like
    twenty pounds of potatoes. He chattered away about some ski trip he’d been on.
    Someone else with a deep voice back there responded to his story, the cook maybe.
    Funny how happy dreadlocks-guy seemed while chopping potatoes into cubes. Didn’t
    everybody know her life had fallen apart and she was standing here facing humiliation
    and despair?


    “Wendy.” Dillon said flatly.


    Her eyes darted to him and she realized she was next in line and he had switched
    to the side she stood in. She sighed. “Hi. How’s Priscilla?” Sarcasm dripped from
    her words.


    He paled. “What? Why would you ask me that?”


    Seriously? “I saw her in here yesterday.” Wendy couldn’t keep the venom from her
    tone.


    “God, Wendy. This is so messed up. I can’t tell you how wrong you’ve got this.”


    She crossed her arms over her chest and cocked one eyebrow. “Really?”


    “Yes.” He glanced over his shoulder. She followed his gaze. Carl, the manager,
    stood against the pick-up window, arms crossed over his black apron bib, glaring
    at Dillon.


    Idle convo was discouraged.


    “Tall chocolate caramel drizzle Americano coming up.” He made the drink and set
    it on the counter in front of her. Pleading eyes met hers. She paid him and took
    her drink to the booth where she’d left her book bag. Seeing Dillon caused an
    ache in her heart. It hurt more than she wanted to admit.


    A message had been written on her cup with a black sharpie, “Please believe me.
    I love only you.”


    Wendy stared at the message. She knew what she saw yesterday when she drove through
    the parking lot, what she heard over the phone the night she accidentally called
    him. How could the reality of what she knew be wrong? Lindsay had told her Priscilla
    was a pathological liar, a psychotic. Why couldn’t Wendy believe Dillon?


    A smudge seeped out from under there thumb. She lifted it from the cup. The burnish
    smudge formed a word. “Broken” She stared at the word as another seeped next to
    it, as if it were oozing out of the cup’s paper. “without” Then another spot browned.
    “You”


    Wendy looked at Carl. He spoke animatedly to the cooks through the pick-up window.
    Apparently what he said was hysterical, because he laughed so loud the baristas
    turned to look at him. She watched Dillon react to Carl’s outburst.


    Dillon had written with the sharpie. But who? And twice now? The same message.
    What was really going here?


    Dillon glanced at her, but remained filling orders. His sad eyes broke her heart.
    She sighed. Seriously, who was the psycho-bitch now? She picked up her book bag,
    purse, and coffee cup, and walked to his counter. “We need to talk.”


    Dillon nodded. “Yes!”


    She watched him pump the steaming milk into a grande cup, and pursed her lips.
    “I’ve got school until one and then work. Can you come after seven?”


    Dillon’s expectant eyes swept to Wendy’s. “Yes, after seven is good. Pizza or
    Chinese?”


    The woman smiled as she paused next to Wendy. Was she eavesdropping on their conversation?
    Well, to be fair, Wendy did start talking while Dillon made the woman’s drink.
    That made Wendy chuckle. She returned her gaze to Dillon and sighed. “Surprise
    me.”

