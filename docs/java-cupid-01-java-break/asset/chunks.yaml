    兰斯把一张十美元钞票扔在柜台上。“不用找了。”


    “爸爸！”温迪瞪了他一眼。


    “这是我的咖啡，我想给多少小费随我！”她父亲拉住她的胳肘，引导她离开柜台。


    她对迪隆皱了皱脸，露出歉意的神情，由父亲领着走向她最喜欢的那个偏僻卡座位。


    坐下后，她问道：“你在这里干什么呢？”


    他抿了一口咖啡，目光在咖啡馆后角这个卡座位的环境中环视着。“所以，这就是你学习的地方？”


    她盯着他。“你早已经知道了。怎么了？”


    “所以……我注意到迪隆留得很晚。”


    “他大概午夜左右回家了。”她平平地说道。


    她父亲点了点头。“噢。”


    “爸爸，你有什么想问我的吗？”温迪的怒在胃里翻腾。


    “没有。我只是——”他抿了口咖啡，“你的腿怎么样了？”


    “疼。”她抿了抿嘴。“听着，我真的需要在上课前完成一些事情，你有什么具体的想聊的吗？”


    “有的。实际上，有。”她父亲盯着倾斜的百叶窗。“我听别人说，你妈妈在约会。”


    温迪盯着她父亲。真的？他居然在问她妈妈的事？你想让我说什么，爸爸？”


    “不。我是为了帕蒂好。别误会我。我——只是——在想……”


    “你不直接去问她吗，爸爸？”温迪举起她的《产科学》。剩下的两个章节并不会自己读完，她却坐在这里向爸爸汇报妈妈的感情生活。


    “噢，我会的。没什么大事。”她父亲喝完了咖啡。“让你回去学习吧。”他滑出卡座，回头了一眼。“顺便说一下。”


    她从书中抬起眼睛看向他。


    “我喜欢这个迪隆。尽量别把这一个搞砸。”他走了。


    她惊讶得张开了嘴。她结结巴巴地吐出字，却说不出一句完整的话。她皱起眉头，看着他离开馆馆。“她从什么时候开始搞砸感情的？她从什么时候开始有一段感情可以搞砸的？他凭什么在这里谈论搞砸，明明他才是那个搞砸了和妈妈婚姻的人？”怒火在她胸中翻腾。她抿了一口咖啡，强迫自己读剩下的两个章节。她的大脑无法吸收这些文字。她父亲的话阻碍了任何信息进入她的脑海。


    为什么她在需要学习的时候对她做这些破事？


    ## 第四章


    ![Image](img/00007.jpeg)


    “周六定好了。”温迪的妈妈发来短信。“Red Robin @ Elizabeth & Franklin St. 7:00”


    “耶！”温迪把手机滑回刷手服口袋。她整个下午都没见到迪隆。他今天上班了吗？她不知道他的工作或学校课表。只有在“Java 丘比特”店，他上的是早班。也许她在晚餐休息时间能见到他。


    这个念头让她在开始日常工作时脚步变得轻盈起来。换床单、洗澡、记录生命体征、让患者下床、让患者回到床上。

