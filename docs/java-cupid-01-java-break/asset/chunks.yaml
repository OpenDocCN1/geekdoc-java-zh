    Dillon 摇了摇头。“不。我不百分之百确定他们的关系会走向何方。我不想让他左右为难。我会等他发布什么公告之类的的。到时候我再跟他谈谈这这一切的法律问题。”他朝她比了比。


    “那么……在此期间我们该怎么办？”泪水刺痛了她的眼睛。他是要和她分手吗？为什么他们必须等父母对他们自己的关系下定主意，而她已经很想和 Dillon 一直走下去。


    “我-我不知道。”Dillon 将手指插进他金色的卷发中。


    Wendy 盯着他。她知道。她非常清楚自己想要什么。为什么他不知道呢？“好吧，也许在你想清楚之前，我们应该先冷静一下。”


    他猛地看向她。忧虑锁住了他的眉心，额头紧绷。“也许我们确实应该。”


    ## 六章


    ![Image](img/00009.jpeg)


    Dillon 看起来完全并不同意她关于先冷静一下的建议。事实上，他看起来很受伤。但她还能说什么呢？已经晚了，她累了，他需要回家或去睡觉。二选一吧。在他弄清楚自己想要什么之前，她不会再和他共用一张床了。无论他父亲或她母亲决定如何。他们必须独立于任何人的计划做出这个基本的决定。


    Wendy 尝试入睡。但这是不可能。今晚发生的一切都在她脑海中盘旋。她能听到卧室窗外传来的风声。她感觉风也在吹动着她脑子里所有的思绪。傲慢的普莉西拉-普里丝。她妈妈，她从未见过她那么开心。Blake，他似乎是个非常好的男人，对她妈妈也很有体贴。Dillon，突然之间他不确定对这段关系想要什么了。学校，她的学业落后了，她不能让那种发生。


    但她现在无法集中精力思考任何件事。她放了一个加了泻盐的热水浴泡澡。但她仍然无法平息脑海中的风暴。她坐在床上，咬着指甲，盯着手机。她应该给 Dillon 打电话吗？她给出的最后通牒公平吗？他是个了不起的家伙。和他在一起非常有趣，幽默感十足。他能泡出一杯很棒的咖啡。她轻笑了一下。而且他有着她经历过的最完美的亲吻。并不是说她像
    Priscilla 那样经历过很多次……愤怒长出了丑陋的触角。


    她踢开被子，站在床边。也许可以喝杯热牛奶。她光脚走向厨房。手里拿着手机。她用指划亮了屏幕。


    在她买的一个“爱神丘丘比特”咖啡杯里倒了一些牛奶，把它放入微波炉，设定了三十秒，然后按下开始。她看着手机。Dillon 的电话正响着。“噢。”她把手机举到耳边。铃声响了。又响。又响。然后电话接通了。“Dillon？”


    一个低语的声音。“喂？”


    Wendy 停顿了一下。微波炉响了声，但她忽略了。“D-Dillon 在线吗？”


    “在，”那个女人低声说。


    Wendy 低下头。愤怒在她腹中再次点燃。“我可以跟他通话吗？”


    “不。”那个声音继续低声说，“他现在正在睡觉。我可以留留言吗？”


    “你是谁？”Wendy 真想穿过电波过去，对着无论是谁揍一拳。


    “我是 Priscilla，你是谁？”


    Wendy 停顿了。Priscilla！这什么鬼——为什么 Priscilla 竟然会在 Dillon 的家里接他的电话？他今晚告诉她的一切都是谎言吗？他们还在一起？“我是谁并不重要。晚安。”她挂断了电话，向后退去要把手机扔出去。闭上眼睛，她改变了主意。如果弄坏了手机她买不起新的。她叹了口气。现在她绝对睡不着了！他怎么能对她这样做？


    ![Image](img/00004.jpeg)


    ## 与此同时


    Priscilla 翻找着她的 Dillon 纪念品盒，直到找到了她希望在那里的。她拿起他的橄榄球衣深吸了一口气。他的气味早已消失，但她记得那气味带给她内心的感受。她从未像爱
    Dillon Cayne 那样爱过任何人。如果她在高中就能诱惑他，他就一直是她的了。男人一旦品尝过普莉丝提供的味道，没有人能拒绝她。她笑了。


    她今晚可以解决这个问题。


    她把钥匙抛向空中又接住。就在离她那间破旧公寓几英里之遥，Dillon 那间漂亮的小公寓就在高尔夫球场旁边。她完全清楚哪扇门是他的，尽管他从未邀请她去那里。她在他看不见的地方观察过。钥匙是他在以为自己丢了整套钥匙时她偷的。某一天在他带她回家后的晚上，她把钥匙溜进了她父母家路边的垃圾桶里。他一直是那么疏远，她知道和他分手只是时间问题。她爸爸为他叫了辆出租车，他请锁匠为他的那辆小跑车配了新钥匙。


    她拥有他们共同生活的纪念品。她还有他公寓的钥匙。今晚，她要让他看到这些年来错过了什么。她要让他永远属于她。钥匙顺滑入锁孔，无声地转动。她踮着脚走了进去。

