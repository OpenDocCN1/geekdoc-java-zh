    In this chapter, we will explore the most fundamental concepts and why they are
    important in real-world applications.


    # 3.1 Classes


    A class in the object-oriented programming paradigm is a way to abstract and organize
    some element from the real world: a computer, game, person, animal, character,
    discount, payment, house, ship, city, and so on. You can spot the similarity between
    all these diverse items? That''s right, they''re all nouns—people, places, or
    things. To make sense in a project (for simple systems, at least), a class should
    be abstracted from something that exists in the real world.


    An easy way to check for this is to verify that the class''s name is a noun. A
    class with an action (a verb), like `PerformAction`, should never be used.


    Abstracting elements from the real world to create classes that make sense in
    the project you''re working on is not an easy task. You need to analyze what the
    nouns are in the problem you want to solve, and condense that information into
    classes that will be meaningful in the solution you want to develop.'
