  md: "# 8 Exceptions\n\ntype. You could also use a generic exception to avoid throwing\
    \ many different exceptions in a single method, like the InfrastructureException\
    \ used here:\n\n```\npublic static Connection getConnection() {\n    try {\n \
    \       return connection = DriverManager.getConnection(\n            \"jdbc:postgresql://localhost:5432/anyDatabase\"\
    , \"user\", \"password\");\n    } catch (SQLException sql) {\n        throw new\
    \ InfrastructureException(sql);\n    }\n}\n```\n\nAll checked exceptions inherit\
    \ from Exception, which is a subclass of Throwable.\n\n# 8.1.2 Unchecked exceptions\n\
    \nUnchecked exceptions are useful when you want to make the application stop working\
    \ and don't want to recover from the error condition. They are used for things\
    \ that might go wrong during runtime of an application and do not result in compilation\
    \ errors.\n\nAll unchecked exceptions inherit from RuntimeException, which is\
    \ a subclass of Exception. There are only a few specific situations where we handle\
    \ a RuntimeException. Instead, we should try to avoid them by using code logic.\n\
    \nThe famous NullPointerException, which is widely used in the JDK code, is a\
    \ great example of what a RuntimeException should be used. Consider the example\
    \ of the toUpperCase method from the String class:\n\n```\npublic String toUpperCase(Locale\
    \ locale) {\n    if (locale == null) {\n        throw new NullPointerException();\n\
    \    }\n    ...\n```\n\nNote we simply throw the NullPointerException without\
    \ handling it. The Locale is crucial for the logic of this method; if there is\
    \ no Locale (an Object representing a specific geographical, political, or cultural\
    \ region), the intention of the programmer that implemented the toUpperCase method\
    \ is to make the application crash.\n\nAnother well-known example is IllegalArgumentException,\
    \ which should be thrown when an unexpected argument is passed to a method. The\
    \ File class from the JDK uses IllegalArgumentException when the uniform resource\
    \ identifier (URI) it's passed is invalid, because there is no way to handle this\
    \ condition programmatically:\n\n184"
