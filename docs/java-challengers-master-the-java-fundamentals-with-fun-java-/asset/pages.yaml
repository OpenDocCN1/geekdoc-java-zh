  md: "# 12.6 TreeMap\n\n| Method | Complexity | Worst Case Scenario | Explanation\
    \ |\n| --- | --- | --- | --- |\n| put() | O(1) | O(n) | O(n) when there is hash\
    \ collision |\n| get() | O(1) | O(n) | O(n) if there is hash collision |\n| remove()\
    \ | O(1) | O(n) | O(n) if there is hash collision |\n| contains() | O(1) | O(n)\
    \ | O(n) if bad hash function is used |\n\nTo have the keys of your map sorted\
    \ in natural, you can use the TreeMap.\n\nA TreeMap uses the Red-black tree algorithm\
    \ based on the NavigableMap implementation. The keys\nof a TreeMap must implement\
    \ Comparable, in case we don't, we will get an Exception.\n\nThe TreeMap has the\
    \ following direct hierarchy:\n\n```\npublic class TreeMap<K,V> extends AbstractMap<K,V>\n\
    \    implements NavigableMap<K,V>, Cloneable, java.io.Serializable\n  { }\n```\n\
    \nA TreeMap is also not synchronized, therefore it will throw ConcurrentModificationException\n\
    the map is changed during an iteration as a fail-safe mechanism. However, it's\
    \ possible\nto use a TreeMap as a thread-safe object by wrapping in the Collections.synchronizedSortedMap\n\
    method.\n\nNow let's see a common use of a TreeMap adding Comparable elements\
    \ and making sure they\nsorted in their natural order:\n\n```\nimport java.util.Map;\n\
    import java.util.TreeMap;\n\npublic class TreeMapInAction {\n    public static\
    \ void main(String[] args) {\n        Map<Integer, String> ffSums = new TreeMap<>();\n\
