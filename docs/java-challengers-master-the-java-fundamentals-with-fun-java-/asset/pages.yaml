    # 9.1 What is Lambda?


    Lambdas, Functional interfaces, and method references are functional programming
    that helps us to avoid the boiler-plate code. When there wasn''t the possibility
    to use lambdas, we would have to use anonymous inner classes for example. As you
    might remember in the previous chapters, the syntax from an anonymous inner class
    is not so friendly.


    With lambdas and method references, it''s also possible to make better use of
    Java APIs, such as Stream, Collections, Optional, Files, and so on. Usually, when
    we use lambdas, we use a one-line function. When we have more lines of code, it''s
    suitable to use method references.


    When starting with lambdas and method references, it will be a bit difficult to
    fully absorb the concept. However, as we use it, the more familiar we get, and
    for sure the Java Challenges are a massive to help you accomplish that.


    We can easily pass a one-line function to a functional interface with lambdas.
    Lambdas are also part of the functional programming paradigm. In Java, lambdas
    don''t completely follow the functional programming paradigm but still use it
    optimally.


    In simple words, functional programming in its essence is a programming style
    that shouldn''t have any data mutation or side effects in programs. This means
    when we invoke a function with the same value many times, the same behavior or
    output is expected.


    As mentioned above, anonymous classes are verbose. Let''s see how we were using
    that before with the Runnable interface:'
