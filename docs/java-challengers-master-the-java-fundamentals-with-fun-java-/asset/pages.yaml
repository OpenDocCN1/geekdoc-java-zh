  md: "# 13.5.11 Combining Elements reduce()\n\nThe reduce function allows us to combine\
    \ or accumulate multiple values from a collection of elements and reduce those\
    \ values to a final result. It's possible to sum numbers, concatenate strings,\
    \ it's also useful to calculate operations in parallel when performance is needed.\n\
    \nBefore seeing the reduce method in action, let's see how the method signature\
    \ for the reduce method is:\n\n```\nreduce(T identity, BinaryOperator<T> accumulator);\n\
    ```\n\nLet's see what is the purpose of each parameter:\n\n+   - return type T:\
    \ it's the generic type that will be returned based on the identity and accumulator\
    \ type we are.\n- T identity: it's the initial value of the reduce method. If\
    \ we pass Ø to the identity for example, the reduce operation would start from\
    \ Ø.\n- BinaryOperator<T> accumulator: it's a function that receives two values\
    \ of the same type and performs a logic you want when combining the values.\n\n\
    Now that we know the reduce method signature, let's see a simple and practical\
    \ example of the reduce method:\n\n```\nList<Integer> numbersList = List.of(2,\
    \ 2, 4, ?);\nint result = numbersList\n  .stream()\n  .reduce(0, (accumulator,\
    \ eachNumber) -> accumulator + eachNumber);\nSystem.out.println(result);\n```\n\
    \nOutput:\n15\n\nIn the code above that the numbers of numbersList were summed.\
    \ You can see that it's very easy to combine values using the reduce method. It\
    \ can get even easier by using a method reference:\n\n```\n// Omitted the creation\
    \ of numbersList and result\nresult = numbersList.stream().reduce(0, Integer::sum);\n\
    System.out.println(result);\n```\n\nOutput:\n15"
