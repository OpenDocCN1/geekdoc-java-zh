  md: "# 3.4.1 Invoking constructors with the keyword this\n\nThis concept demonstrated\
    \ here is called overloading. Simply put, this is a way of making different versions\
    \ of constructors or methods with the same name that receive different types or\
    \ numbers of parameters. It's a core concept that will be explored in future chapters.\n\
    \nIt's also possible to invoke a constructor from another constructor in the same\
    \ class. This feature is useful because it allows us to reuse code from other\
    \ constructors; we don't need to rewrite the same piece of code.\n\nIt's important\
    \ to keep in mind that you can only invoke one constructor from another in the\
    \ first line of the constructor. Otherwise, there will be a compilation error.\n\
    \nLet's explore a common real-world project scenario where you can use this concept.\
    \ Suppose you want to be able to instantiate a class BatMobile either with two\
    \ parameters that you specify, versionName and modelYear, or using the default\
    \ constructor with two constant values, \"Batman Forever\" and 1995.\n\nThe only\
    \ way to make it possible to instantiate this class either with or without parameters\
    \ is two constructors:\n\n```\npublic class BatMobile {\n    String versionName;\n\
