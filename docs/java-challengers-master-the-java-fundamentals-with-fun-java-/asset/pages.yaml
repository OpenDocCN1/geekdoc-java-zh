    Next we instantiate xavier and assign it to the variable xavier, of type Object.
    Then we check whether xavier is an instance of both Xavier and Object:


    Object xavier = new Xavier();


    System.out.println(xavier instanceof Xavier && xavier instanceof Object);


    Because of polymorphic inheritance xavier is an instance of both Xavier and Object,
    so this will print true.


    Then we instantiate Wolverine and check whether it is a Hero:


    System.out.println(new Wolverine() instanceof Hero);


    The Wolverine class extends Hero, so this will also print true.


    Finally, we check if a Hero is a Wolverine:


    System.out.println(new Hero() instanceof Wolverine);


    The Hero class doesn''t know anything about the Wolverine class–only the opposite
    is true, because Wolverine extends Hero. Therefore, the result of this comparison
    is false.


