  md: "# Inheritance and Polymorphism\n\n```\npublic final class String\n    implements\
    \ java.io.Serializable, Comparable<String>, CharSequence,\n    Constant, ConstantDesc\
    \ { ... }\n```\n\nNote the String class is declared final. Can you guess why that?\
    \ String is an immutable class, which means its main attributes will never be\
    \ changed. The final keyword is used to ensure that this is the case—but not the\
    \ whole point of the keyword. The main goal of using final is to not allow any\
    \ other class to extend the String.\n\nHave you tried to extend this class? If\
    \ you do so:\n\n```\nclass AnyClass extends String { }\n```\n\nthe code won't\
    \ compile, because the String class is declared as final.\n\nAnother important\
    \ point to mention about a final class is that it's not possible to override any\
    \ of its methods. This is because you can't inherit from such a class. But what\
    \ if you want to allow inheritance in your classes, but prevent just certain methods\
    \ from being overridden? You can use the final keyword for those methods.\n\n\
    # 6.11.2 Preventing specific methods from being overridden\n\nIf you want a class\
    \ to be extendable but you don't want certain methods of the class to be overridden,\
