    # 12.5.5 LinkedList


    The LinkedList is doubly-linked list that is faster to insert and delete elements
    and slower to iterate than ArrayList. The LinkedList data structure is also a
    graph because it stores data in the first and last node pointers:


    ```

    1 public class LinkedList<E> extends AbstractSequentialList<E>

    2 implements List<E>, Deque<E>, Cloneable, java.io.Serializable {

    3 transient int size = 0;

    4

    5     /** Pointer to first node. */

    6     transient Node<E> first;

    7

    8     /** Pointer to last node. */

    9     transient Node<E> last;

    10 //// attributes and methods...

    11 }

    ```


    LinkedList is a Deque (double ended queue) and is a Queue, therefore, we can also
    use the same capabilities of a Queue. A Deque can be used as a way of a Stack,
    it''s even recommended to use Deque instead of the legacy Stack class. Which means
    that we can use the LinkedList as a Stack that follows the LIFO (Last-in-first-out)
    principle. We can use a LinkedList as a Queue that follows the FIFO (First-in-first-out)
    principle.


