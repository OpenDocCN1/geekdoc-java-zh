  md: "To solve this issue the JVM will create a module automatically from a jar for\
    \ retro-compatibility. That will only happen when we don't explicitly declare\
    \ a module descriptor.\n\nAutomatic modules export, open all packages and read\
    \ all other modules including unnamed modules. It keeps the jar name as a module\
    \ which might cause collisions. It's also possible to set name the automatic module\
    \ jar file.\n\nThe name of the module can be defined in a manifest file of the\
    \ project.\n\n# 14.4.3 Creating an Automatic Module\n\nLet's see a real example\
    \ in practice. Consider the following structure for the automatic-module project:\n\
    \n```\nautomatic-module\n  -- src\n  -- main\n    -- java\n      -- util\n   \
    \     -- Automatic.java\n```\n\nIn the above structure that we don't have a module-info.java\
    \ file. In the root from the automatic-module, run the commands:\n\nLet's take\
    \ a look at the Automatic.java class:\n\n```\npackage util;\npublic class Automatic\
    \ {\n  public void hello() {\n    System.out.println(\"Hello Automatic Module!\"\
    );\n  }\n}\n```\n\nLet's run the command to compile the Automatic class from the\
    \ root of the automatic-module project and put it into the following folder:\n\
    \n```\njavac -d out src/main/java/util/Automatic.java\n```\n\nNow let's create\
    \ a jar file from the compiled class:\n\n```\njar --create --file automatic.jar\
    \ -C out\n```\n\n# 14.4.4 Using the Automatic Module\n\nLet's see the structure\
    \ from the module that will use the automatic module we just created:"
