  md: "# 15.8.4 Object synchronization\n\nNow imagine the situation where we want\
    \ to synchronize two critical sections of the code but there is no dependency\
    \ on each other. In other words, in the following code, we don't want to block\
    \ both methods increment1 and increment2 at the same time.\n\nIf we were using\
    \ the previous approach only we wouldn't be able to accomplish that. The only\
    \ way to synchronize increment1 and increment2 separately is to create two lock\
    \ objects.\nNotice in the following code that the method increment1 acquired the\
    \ lock, the increment2 method will be allowed to execute by another normally:\n\
    \n```\npublic class SynchronizeBlockObjectClass {\n    private int counter;\n\
    \    private int counter2;\n    private final Object lock1 = new Object();\n \
    \   private final Object lock2 = new Object();\n\n    public void increment1()\
    \ {\n        synchronized(lock1) {\n            counter++;\n        }\n    }\n\
    \n    public void increment2() {\n        synchronized(lock2) {\n            counter2++;\n\
    \        }\n    }\n}\n```\n\n# Code analysis:\n\nAs per the Java docs, use the\
    \ above technique very cautiously since this might cause a race condition if not\
    \ used properly.\n\nTo summarize, only use the technique above when methods don't\
    \ share the same data and there is no need to synchronize those methods at the\
    \ same time. This will allow one thread to execute increment1 method and the other\
    \ to execute the increment2 method at the same time. Therefore, performance will\
    \ be enhanced."
