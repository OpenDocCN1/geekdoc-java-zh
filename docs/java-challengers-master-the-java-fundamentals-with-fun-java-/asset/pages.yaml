    Then, when we put "Jaime" the hashCode method will be invoked but also the equals
    method since we have more than 1 element in the HashMap. The same will happen
    for "Cersei" and "Tywin".


    In conclusion, the correct alternative is:


    +   - Size: 1 equalsCount: 3 hashCodeCount: 4


    # 12.14 Hashtable


    The Hashtable class behaves very similar to a HashMap with the main difference
    that it is synchronized, this means it can be used in a multi-thread environment
    safely.


    Notice that a Hashtable doesn''t allow null values as key. If you pass a null
    value like the following:


    ```

    Map<String, String> map = new Hashtable<>();

    map.put(null, "value");

    ```


    The output will be:


    ```

    Exception in thread "main" java.lang.NullPointerException

    at java.base/java.util.Hashtable.put(Hashtable.java:476)

    ```


    Another difference is that Hashtable extends an obsolete abstract class Dictionary.
    This means we should declare the type of a Hashtable as a Map and not as a Dictionary.


    # 12.15 LinkedHashMap


    If you want to use an ordered map, the LinkedHashMap implementation will do this
    job for you. This means that the elements will be ordered as they are inserted.


    The LinkedHashMap maintains a doubly-linked list through all of its entries. It''s
    also slightly less performant than a HashMap.'
