  md: "# 12 Collections\n\n# 313\n\n+   * #A: The first important point to notice\
    \ is that we are implementing the Comparable interface. This is required to be\
    \ able to sort elements by using the Collections.sort method.\n* #B: The compareTo\
    \ method implementation from the Comparable interface.\n* #C: We are using the\
    \ compareTo method from the String name. It returns 1 if name is greater than\
    \ o.name, 0 if they are equal or -1 if name is lower than o.name.\n* #D: We want\
    \ to return a value here if i is different from o because then we won't to compare\
    \ the next field. If the comparison returns 0 then we will move to the next field\
    \ comparison.\n* #E: We return the comparison from power and o.power only if the\
    \ name comparison returns 0.\n\n# 12.7.2 Easy way to Compare Objects with Google\
    \ Guava\n\nIf we want to rewrite our compareTo method with the library Google\
    \ Guava the code would be simple:\n\n```\n@Override\npublic int compareTo(HeroComparableGuava\
    \ o) {\n    return ComparisonChain.start()\n        .compare(name, o.name, Ordering.natural().nullLast())\n\
    \        .compare(power, o.power, Ordering.natural().nullLast()).result();\n}\n\
    ```\n\nThe important detail that we can also handle the edge-case of having a\
    \ null field value with Guava. We have to make it explicit though, we have to\
    \ add the third parameter to the compare method Ordering.natural().nullLast(),\
    \ then a null field won't cause a NullPointerException.\n\n# 12.7.3 Another easy\
    \ way to compare objects with Apache Commons\n\nVery similar to the Guava's ComparisonChain\
    \ class, we have the CompareToBuilder in the Apache Commons library:\n\n```\n\
    public int compareTo(HeroComparableApacheCommons o) {\n    return new CompareToBuilder().append(name,\
    \ o.name)\n        .append(power, o.power).compareTo();\n}\n```\n\nThe Apache\
    \ Commons library handles null fields values automatically, we don't need to make\
    \ it explicit. By default, the CompareToBuilder will sort a null value first.\n\
    \nNow it's up to you to decide what is the best way for you to sort your data."
