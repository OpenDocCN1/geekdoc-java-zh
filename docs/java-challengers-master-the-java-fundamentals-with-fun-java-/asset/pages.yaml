    # 13.7.2 Collecting a set from a stream


    To retrieve unique elements from a stream, we can use the Collectors.toSet method.
    Let''s see a simple example where we have a list with repeated elements and then
    we transform it to a set:


    ```

    List<String> list = List.of("Kratos", "Kratos", "Kratos", "Atreus");

    Set<String> newSet = list.stream().filter(e -> e.startsWith("Kr"))

    .collect(Collectors.toSet());

    ```


    ```

    System.out.println(newSet);

    ```


    Output:

    [Kratos]


    As you can see in the example above, the String Kratos was deduplicated. Therefore,
    the output from our set is only Kratos. Also, Athena was filtered out of the list.


    If we want to restrict usage of our set, we are also able to collect an unmodifiableSet
    as we can see in the following code:


    ```

    List<String> list = List.of("Kratos", "Kratos", "Kratos", "Atreus");

    Set<String> newSet = list.stream().filter(e -> e.startsWith("Kr"))

    .collect(Collectors.toUnmodifiableSet());

    ```


    ```

    newSet.add("Athena");

    ```


    Output:

    java.lang.UnsupportedOperationException


    Since we can''t add, change or delete elements from an unmodifiable set, we will
    get the UnsupportedOperationException.


