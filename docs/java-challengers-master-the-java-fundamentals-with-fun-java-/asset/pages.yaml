    # 15.8.1 Internal Concurrency Behaviours


    The fundamental concurrency concept behind the scenes when using thread synchronization
    is also known as monitor lock or intrinsic lock.


    In Java, this concept is known as simply "monitor".


    Every Java object has an intrinsic lock associated with it. Once an intrinsic
    lock is acquired by an object, it will be associated with the current thread.
    Another thread can acquire the lock only when the current thread releases the
    lock.


    For further information, check out the Java docs:

    (https://docs.oracle.com/javase/tutorial/essential/concurrency/locksync.html)[https://docs.oracle.com/javase/


