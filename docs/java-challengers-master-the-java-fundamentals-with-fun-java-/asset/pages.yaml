  md: '# # 4 Encapsulation access modifiers, and package structure


    This chapter covers:


    ach other.

    The concept of encapsulation is vastly misunderstood by many software engineers.


    If a class has too many responsibilities and does too many things, we would be
    also breaking the concept of encapsulation.


    Understanding the concept of encapsulation is a game-changer for any software
    engineer.

    Just by using this concept


    Restricting attributes and methods are not enough to create a well-encapsulated
    system.

    Instead, it''s necessary to think carefully about the code structure and how different
    parts of the system communicate with each other.


    If a class has too many responsibilities and does too many things, we would be
    also breaking the concept of encapsulation.


    Understanding the concept of encapsulation is a game-changer for any software
    engineer. Just by using this concept, the code gets very flexible and maintainable.


    # # 4.1 Programming to interfaces


    Simply put, programming to interfaces is to program in such a way we will be communicating
    classes through meaningful methods, so that when require code changes will be
    easier.


    A real example of encapsulation is a car, we don''t need to know how a car works
    behind the scenes to drive one, we should access the ''interface'' (methods) from
    the car in order to drive, such as switchGear, break, turnLeft, turnRight. We
    don''t need to know all the specific components of a car. We need to know how
    the car does and not, how the car works.


    The parts of a car are already encapsulated and we only have to understand it
    in detail if we have to maintain or fix some specific part of the car.


    In the object-oriented paradigm, we can use the same analogy, we shouldn''t expose
    an important attribute of a class, we should instead create an interface (meaningful
    methods) that will be clear on what is supposed to accomplish, not how it works.'
