  md: 'The only method capable of receiving these types and autoboxing is:


    ```

    static void jump(Object... o) { finalResult += "2"; }

    ```


    In the next method we pass nothing:


    ```

    jump();

    ```


    When we pass nothing, the varargs method with the most specific type will be invoked:


    ```

    static void jump(Exception... i) { finalResult += "3"; }

    ```


    On the next we pass a new array of int:


    ```

    jump(new int[]{1, 2, 3});

    ```


    Remember that an array in Java is an object, so in this case it''s easier for
    the JVM to widen the array to an Object instead of invoking the varargs method.
    The invoked method will be:


    ```

    static void jump(Object o) { finalResult += "1"; }

    ```


    > Varargs is an array behind the scenes. If there was a method receiving a varargs
    of int, it would be easier for the JVM to simply invoke it when passing an array
    of int. In this exceptional case using varargs would take priority over widening.


    Next, we pass a primitive type:


    ```

    jump(1L);

    ```


    The easiest strategy for the JVM is to widen a long to a primitive type. Therefore,
    the invoked method will be:


    ```

    static void jump(long d) { finalResult += "5"; }

    ```


    On the next invocation we pass an int:


    ```

    jump(1);

    ```


    The quickest solution for the JVM is to widen the int type to double, so the same
    method will be invoked:


    ```

    static void jump(double d) { finalResult += "5"; }

    ```


    Finally, we invoke the method passing a Double wrapper type:


    ```

    jump(Double.valueOf(1));

    ```


    The best strategy for the JVM is to widen the Double wrapper type to an Object,
    so the last method invoked by the JVM will be:


    ```

    static void jump(Object o) { finalResult += "1"; }

    ```


    In conclusion, the final output will be:


    B) 231551'
