    \ this.brand = brand;\n        this.model = model;\n        this.year = year;\n\
    \    }\n\n    public String getBrand() {\n        return brand;\n    }\n\n   \
    \ public String getModel() {\n        return model;\n    }\n\n    public int getYear()\
    \ {\n        return year;\n    }\n\n    @Override\n    public boolean equals(Object\
    \ o) {\n        if (this == o) return true;\n        if (o == null || getClass()\
    \ != o.getClass()) return false;\n        CarWithoutRecord car = (CarWithoutRecord)\
