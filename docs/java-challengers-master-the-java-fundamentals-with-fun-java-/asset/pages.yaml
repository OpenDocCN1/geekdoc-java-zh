    require a considerable amount of effort.


    In the previous chapter, I mentioned that Java developers should follow the JavaBeans
    convention for naming different elements of code. For naming classes the convention
    is to use the PascalCase pattern, which means to start each word in the name with
    a capital letter.


    Example names include Account, Discount, Person, CustomerAddress, BillingAddress,
    and PaymentService.


