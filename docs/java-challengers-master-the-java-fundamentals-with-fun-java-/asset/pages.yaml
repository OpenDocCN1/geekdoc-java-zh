    # 10.3.3 Don’t Use Optional as Serializable


    An Optional object is not Serializable because it''s not meant to be used as attributes.
    Instead, an Optional is meant to be used as a return type where we can manipulate
    actions when the value is present or absent.


    Also, if we use Optional as a Serializable, we would have to unbox the value of
    each attribute in a class which is quite expensive in terms of performance. Another
    good reason to make Optional not Serializable is that we can avoid the following:


    ```

    Map<Optional<List<String>>>

    ```


    In real projects, we have data objects everywhere and if we have the attributes
    of those classes declared as Optional, the code would easily become a mess.


    For more information, you can check the notes from Brian Goetz at the following
    link: (http://mail.openjdk.net/pipermail/lambda-libs-spec-experts/2013-May/001814.html)[http://mail.openjdk.net/java-libs-spec-experts/2013-May/001814.html]


    # 10.3.4 Using isPresent and get


    The get method defeats the purpose of the Optional class because if the value
    is not present, a NullPointerException will be thrown:'
