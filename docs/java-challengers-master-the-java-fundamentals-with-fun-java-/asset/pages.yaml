    \ be invoked in this case because we are not explicit saying that we want to invoke\
    \ the pilotShip method from another class or interface. The JVM will automatically\
    \ add the class name of the enclosing class, like this:\n\nChewbaccaWarrior.pilotShip();\n\
    \nRemember that it's not possible to use polymorphism with static methods, so\
    \ they always refer to classes, instances.\n\nNow we're going to explore polymorphism.\
    \ In the second line we invoke the attack method:\nnew ChewbaccaWarrior().attack();\n\
    \nThis method is declared in both the Warrior and Brave interfaces. The Warrior\
    \ interface overrides the attack method from the Brave interface, so the Chewbacca\
    \ class will use the Warrior method and not the Brave attack method.\n\nLet's\
