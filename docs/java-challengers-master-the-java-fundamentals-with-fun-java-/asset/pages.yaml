    # 17.5 Strategies to Stay Sharp


    Software development is hard and no technology will be learned overnight. Instead,
    it will take time and practice, it''s not for reason that our profession is highly-paid.


    With in mind, it''s important for you to have a plan for your studies. Your goal
    is to decide ahead of what will be your studying plan. Once you decided, you write
    it down. You can use any tool you, a Google Sheet,notepad,Trello, white board,
    whatever works for you.


    For example, if your plan is to get good with microservices, you can start by
    learning the 12 factors from microservices. It''s also important to know why you
    are learning something. It can be because you want to get a better job, get promoted,
    work abroad. The why will motivate you to keep it up.


    To be consistent is to be able to do what you need to do even when you don''t
    feel like it. Therefore, if you decide you will get good with Microservices, you
    need to take action even in the days you don''t want to. It''s also very good
    if you can set a goal for you to create an application applying the concepts you
    learned then it''s much easier to absorb the concepts.


    # 17.6 Learn more about negotiation


    Negotiation is a skill we use often. When we need to get a new job, a promotion,
    find a partner, purchase a property, sell a property and the list goes on. Therefore,
    it''s a skills that cant be ignored!


    Negotiation will also affect directly in your career growth it doesn''t matter
    if you are a very good developer, if you don''t know how to negotiate, you won''t
    earn the salary you deserve.


    A very important point when negotiating is to know how much to ask. This is related
    to how you know the market. There are a couple of techniques to figure this out:


    +   - You can directly ask a close friend'
