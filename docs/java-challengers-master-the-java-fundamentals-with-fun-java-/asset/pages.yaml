  md: "# 12.7.4 Using Comparator\n\nWhen you don't want to force a contract in your\
    \ data object, you can use a Comparator. A Comparator is a handy way for you to\
    \ sort elements without a need to implement the compareTo directly in your data\
    \ object. It's also useful to use Comparator when you want to sort elements in\
    \ more than one way. Another reason to use Comparator is when you want to order\
    \ your array by any field.\n\nLet's see the classic way to use Comparator with\
    \ an anonymous inner class:\n\n```\nimport java.util.ArrayList;\nimport java.util.Comparator;\n\
    import java.util.List;\n\npublic class HeroComparator {\n    private String name;\n\
    \    private String power;\n\n    public HeroComparator(String name, String power)\
    \ {\n        this.name = name;\n        this.power = power;\n    }\n\n    public\
    \ static void main(String[] args) {\n        List<HeroComparator> heroes = new\
