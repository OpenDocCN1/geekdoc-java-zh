    the for statement is accessible in the if statement. The homerFavoriteFood variable
    is also accessible: it is declared in the outer statement that encompasses the
    loop and inner statement. The isHomerFat variable was declared at the beginning
    of the main method and therefore is accessible throughout the whole block.


