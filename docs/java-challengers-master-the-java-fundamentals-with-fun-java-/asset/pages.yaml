    We have to follow the code syntax to work with any programming language. Java
    for example has a very similar syntax from the C language.


    # 2.1.2 Code Semantic


    Everything is the real-world has to be with a defined logic, when we want to brush
    our teeth open the bathroom cabinet, get the toothbrush, put the toothpaste, move
