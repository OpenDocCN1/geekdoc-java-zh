    \ explore the limit, skip, dropWhile, sorted and takeWhile intermediate methods.\n\
    \nTherefore, what will happen when running the following code?\n\n```\nimport\
    \ java.util.stream.IntStream;\n\npublic class TakeDropWhileChallenge {\n\n   \
    \ public static void main(String... doYourBest) {\n        IntStream.iterate(10,\
    \ i -> i - 2)\n            .limit(5)\n            .skip(1)\n            .dropWhile(i\
    \ -> i < 6)\n            .sorted()\n            .takeWhile(i -> i > 2)\n     \
    \       .forEach(System.out::print);\n    }\n}\n```\n\nA. 864\nB. 68\nC. 468\n\
    D. None of the above alternatives. Nothing will be printed.\n\n# Explanation:\n\
    \nLet's reconstruct the pipeline of this IntStream. Let's see what happens on\
    \ each line of the code:\nIntStream.iterate(10, i -> i - 2): we are starting an\
    \ iteration from 10 and subtracting 2 on each iteration.\n\nlimit(5): we limit\
    \ the iteration to 5 so we avoid infinite looping. At that moment we have the\
    \ following elements: 10, 8, 6, 4, and 2.\n\nskip(1): we skip one element, therefore,\
    \ we will have the elements now: 8, 6, 4, and 2.\ndropWhile(i -> i < 6): note\
    \ that the first element of the list 8 is not lower than 6, therefore, no elements\
    \ will be dropped here.\n\nsorted(): we sort the elements in the natural order,\
    \ therefore, the elements will be sorted as the following: 2, 4, 6, and 8.\n\n\
    takeWhile(i -> i > 2): finally, we take only elements that are greater than 2,\
    \ in our case, the first number of the list is not greater than 2. Therefore,\
    \ no elements will be leaving the stream with no values."
