  md: '# 7 Interfaces


    This chapter covers:


    +   - Developing flexible code that depends on interfaces, not instances, and
    designing interfaces that are reusable

    - Creating method implementations in interfaces by using default methods

    - Deciding whether to use interfaces or abstract classes

    - Using static methods in interfaces

    - Simulating multiple inheritance with default methods

    - Using private methods in interfaces

    - Total of 5 Java code Challenges


    A great way to make Java code more flexible is by using interfaces. This reduces
    coupling in our code, making it easier to change and extend it when necessary.


    An interface works like a contract. Any class that implements a given interface
    contract will have to implement all public abstract methods from that interface.
    With interfaces, we can apply the concept of polymorphism, which means we can
    pass different implementations to the same interface. That''s a crucial concept
    for building code that''s easy to extend, because chances are that changes will
    be only necessary in the implementation of the interface parameter.


    Many core Java classes use the concept of interfaces. For example, ArrayList implements
    List, HashSet implements Set, HashMap implements Map, ArrayDeque implements Deque,
    and so on.


    # 7.1 Interfaces and Polymorphism


    To demonstrate the flexibility that interfaces provide, let''s consider an example.
    Here, the addElement method takes the List interface as a parameter. That means
    we can pass this method an instance of any class that implements that interface:'
