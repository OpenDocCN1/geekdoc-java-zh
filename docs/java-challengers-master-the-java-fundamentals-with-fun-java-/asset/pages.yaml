  md: 'ArrayList for most common use of arrays. Stores an array of objects behind
    the scenes and it''s going to grow the array dynamically.


    Vector when you want your array to have synchronized data in a multi-thread environment.


    CopyOnWriteArrayList when you want to manipulate the array as you wish while traversing
    it. You won''t get ConcurrentModificationException.


    Prevent ConcurrentModificationException with effective techniques.


    Comparing and sorting data from a List.


    Deque as a type to use functionalities of a Stack and Queue.


    LinkedList when you want to make use of Stack and Queue functionalities.


    +   - Set to be used as a type for HashSet, and LinkedHashSet, and TreeSet. Also
    will make elements unique.

    - HashSet, it is the most basic implementation of a Set. It uses a map behind
    the scenes to store data. Also inserts unique elements and the elements are not
    ordered as they are inserted.

    - LinkedHashSet, it is very similar to HashSet but has the difference that elements
    will keep the order as they are inserted.

    - TreeSet, it inserts unique elements and also sorts them depending on what you
    configured on your compareTo method.


    +   - Map, used to implement key-value data structures.

    - HashMap is the most common implementation of a Map. It stores key-values, it
    accepts null as a key and elements are not ordered.

    - LinkedHashMap is similar to HashMap but elements are ordered as they are inserted.

    - Hashtable, it is synchronized which means it can be used in a thread-safe environment
    and can''t use a null value as a key.

    - TreeMap will use the compareTo method to sort elements as they are inserted.


