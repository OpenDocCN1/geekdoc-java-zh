    Function<String, Integer> transformIntoNumber = (number) -> Integer.parseInt(number)

    System.out.println(transformIntoNumber.apply("7"));


    The output will be:

    7


    We can also compose functions. Let''s suppose we want to multiply a number by
    2 and then add we have two ways to do that in Java. We can either use the compose
    or the andThen function. Let''s see the example below:


    ```

    Function<Integer, Integer> times2 = (number) -> number * 2;

    Function<Integer, Integer> add2 = (number) -> number + 2;

    System.out.println(times2.compose(add2).apply(2));

    System.out.println(times2.andThen(add2).apply(2));

    ```


    The output will be:

    6


    Note that the difference between the compose and andThen functions are the order
    they are executed. In the compose, the add2 function will be executed and we will
    get the result of 4 first. Then the times2 function, therefore we have the result
    of 8.


    When we invoke the andThen method, it''s the opposite. The times2 function will
    be executed giving us the result of 4. Then the add2 function will be invoked
    adding 2 and giving us the final result of 6.


