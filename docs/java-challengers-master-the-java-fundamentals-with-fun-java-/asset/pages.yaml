    # 15.5 non-daemon and daemon Thread


    The concept of non-daemon and daemon threads is related to the rules that support
    each other. A non-daemon thread doesn''t depend on other threads to be alive.
    A daemon thread, on the other hand, depends on another non-daemon thread to be
    still running.


    Let''s go in details on each one of those concepts in the following sections.'
