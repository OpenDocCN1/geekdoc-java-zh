    \ to have access to a submodule.\nThe class above will only be accessible to other\
    \ modules if we make it explicit as the following:\n\n```\nmodule daoModule {\n\
    \    exports dao to serviceModule;\n    exports dao.util to serviceModule;\n}\n\
    ```\n\nNow if we try to use the JavaMascotUtils in the serviceModule it will be\
    \ accessible.\nLastly, it's not possible to export many packages from a module\
    \ by using a wildcard or any trick. In the modules feature, we have to export\
    \ package by package, otherwise, it defeats the purpose of it.\n\n# 14.6.2 Summary\
