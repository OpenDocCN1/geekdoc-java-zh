    # 16.6 Threadpool with Executors


    Creating threads is a quite expensive operation in terms of performance. Therefore,
    Java has an API ready to create a pool of threads where the threads are created
    in the background and they just need to be reused.


    Notice that creating a thread pool is not always the best solution and you will
    have to consider using it depending on the problem you are facing. To make this
    decision, think if tasks will be running very often, and if so, it might be better
    to use a thread pool because of the overhead of creating a new thread several.
    The advantage of using a thread pool is that the threads will be already created.
    Therefore, no overhead on threads creation. Threads will be reused in a thread
    pool.


    The simplest way to create a thread pool in Java is by using the Executors class:


    ```

    ExecutorService executor = Executors.newFixedThreadPool(2);

    ```


    In the above code, we have a thread pool with 2 threads. Now let’s make use of
    those threads using the submit method:'
