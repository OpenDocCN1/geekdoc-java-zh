  md: "# 8 Exceptions\n\nJust as Object is the subclass of all object types in Java,\
    \ Throwable is the superclass of all exception types (both checked and unchecked).\
    \ When an exception occurs in a method the method creates an object of type Throwable,\
    \ hence the term \"throwing\" an exception.\n\nWith that basic introduction in\
    \ mind, let's take a closer look at the details of the different types of exception.\n\
    \n# 8.1.1 Checked exceptions\n\nChecked exceptions cause a compilation error when\
    \ thrown by a method, causing program execution to stop unless they are handled\
    \ by another method. For that reason, many developers say checked exceptions break\
    \ the concept of encapsulation (the idea that data and methods work on that data\
    \ should be contained within a single unit, such as a class). And in a way they're\
    \ right, the method that throws an exception will know that the other method is\
    \ throwing within the logic.\n\nIn general, you should use checked exceptions\
    \ when you are dealing with important business requirement that has to be clear,\
    \ or when you don't have control over an external resource you are using in your\
    \ application.\n\nYou can see many examples of checked exceptions when working\
    \ with the well-known JDBC (database manipulation) API from the JDK. Suppose you're\
    \ working with an external database, and when you try to access it for some reason\
    \ the database is not running. When the database is down, it makes sense to throw\
    \ an exception to let us know what is happening.\n\nWith a checked exception,\
    \ you will know for sure that this exception is being thrown because the compiler\
    \ will complain if you don't handle it. You can also use a customized log message\
    \ to make the error clear.\n\nLet's see an example of a checked exception in action:\n\
    \n```\npublic static Connection getConnection() {\n    Connection connection =\
    \ null;\n    try {\n        connection = DriverManager.getConnection(\n      \
    \      \"jdbc:postgresql://localhost:5432/anyDatabase\", \"user\", \"password\"\
    );\n    } catch (SQLException SQLException) {\n        // Some logic here\n  \
    \      sqlException.printStackTrace();\n    }\n    return connection;\n}\n```\n\
    \nThere are several different strategies you could use to recover from this error.\
    \ For example, you could return a Connection from another database, or you could\
    \ wrap the SQLException in a more generic"
