    # Java Memory Model


    JVM: The Java Virtual Machine at a high-level is responsible to transform bytecode
    into machine code and it''s also part of the Java Runtime Environment(JRE).


    Jit Compiler: Just-in-time compiler that performs optimizations when compiling
    the byte code to native machine code during runtime. It''s possible to pass special
    instructions to enable an important concept called happens-before which will manage
    variable values where its and subsequent read are always consistent. We will see
    more details in the next sections.


    Notice that in the Java memory model there are the L1 and L2 and L3 caches. To
    make the program execution more performant, the JVM implements optimization strategies.
    One of those are the order of execution which means that the code will be executed
    in an optimized way and sometimes this will cause data inconsistency in a multi-threaded
    environment.


    The other strategy is that when the JVM finds it will cache values which in most
    cases this behaviour will be beneficial. However, the variable value caching might
    cause data inconsistency between threads.


    The volatile keyword will solve this caching problem. With volatile we will ensure
    that the latest value will be available to be read after modification between
    threads. The volatile keyword'
