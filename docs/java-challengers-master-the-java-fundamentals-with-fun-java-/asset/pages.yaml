  md: '# 14 Newest Features of Java


    The first jediWithoutTextBlock String is going to receive a literal String. Literal
    String behaves differently than a text block when we have many lines. In that
    case, each line we create is a new String object.


    Notice that we are using the strip method to remove trailing spaces and we invoke
    the formatted method. When we invoke formatted the whole String will be concatenated.
    That happens because the Java compiler will prioritize invoking a method and then
    concatenate the String. Therefore, the formatted method will only consider the
    last String: "</html>", and the substitution won''t happen. The stored String
    from jediWithoutTextBlock will be:


    ```

    <html>

    <head>Master Yoda</head> %s

    </html>

    ```


    Then we use text blocks in the jediWithTextBlock variable. In a text block, there
    is only one String, therefore, the substitution with formatted happens successfully.


    Notice other detail that the spaces on the left being ignored. That''s because
    of the way we used text blocks. To close the text blocks we are using """ on the
    right of the last text. Which means that the text is at most the left will be
    the margin for all rest. In that case, the left spaces will be ignored. This will
    be what we will have stored in the String:


    ```

    <html>

    <head>Master Yoda</head> Luke

    </html>

    ```


    When printing the following, false is printed since the texts are different: System.out.println(jediWithoutTextBlock.equals(jediWithTextBlock));


    In the following condition we use the formatted method again that will now substitute
    the text successfully. That''s because the String is already fully concatenated.
    Therefore, the output here is true.


    In conclusion, the correct alternative is:


    +   - A. false

    true


