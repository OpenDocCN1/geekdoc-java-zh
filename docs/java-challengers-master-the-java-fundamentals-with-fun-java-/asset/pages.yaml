    # 9.2 Functional Interfaces


    There are a couple of predefined functional interfaces in Java that will cover
    95% of the cases. In simple words, a functional interface is an interface with
    only one abstract method. When you have that, you can use the functional interface
    functionalities.


    Let''s get started with the easiest functional interface, the Supplier. As the
    name suggests, the Supplier is responsible to return one value. It supplies one
    value.


    ```

    Supplier<String> supplier = () -> "Moe";

    ```


    The only method we can invoke is get. Therefore, to get the "Moe" value we can
    do the following:


    ```

    System.out.println(supplier.get());

    ```


    The output will be:

    Moe


    To make it clear for you what is a functional interface, you can take a look at
    how the JDK code defines it:'
