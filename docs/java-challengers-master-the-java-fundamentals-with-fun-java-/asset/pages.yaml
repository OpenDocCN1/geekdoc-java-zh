  md: '# Foreword


    James Gosling


    // Will be added soon!


    # Jeanne Boyarsky


    Back in 2017, I attended Rafael''s JavaOne session: "Learn the Concepts between
    these 10 Java Challenges and Eliminate Stressful Bugs." My reaction at the time:


    This was fun! Being a cert book author gave me an advantage but some were still
    tricky and tough! And using The Simpsons as examples was fun. He did show of hands
    for each option; most people didn''t raise their hand for any of the choices.


    It''s now five years later. I''m still a certification book author, but the session
    has grown into a full book! There are more challenges with the same fun and style.
    I''m pleased that the Simpsons remain!


    Whether you are learning Java or an experienced developer, there is something
    in this book for you. Don''t let bugs hit you. Learn here so you can avoid surprises
    in your code!


    And have fun. I''m sure you will find it, um, challenging.'
