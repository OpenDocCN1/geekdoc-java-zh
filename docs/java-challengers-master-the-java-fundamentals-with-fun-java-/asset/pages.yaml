    # 14.1 Java Version Release Strategy


    Since Java 10, new Java versions are released every 6 months which enables Java
    to release new features more quickly.


    Before going deeper into the new Java version releases, let''s see what are the
    most important Java vendors:


    +   * Oracle (Oracle JDK), free for personal use but not free for commercial use

    * AdoptJDK, free for commercial use

    * Amazon (Corretto)

    * Red Hat

    * Azul

    * Alibaba

    * BellSoft (Liberica)

    * SAP (SapMachine)


    There are two types of version releases in Java:


    +   * Short-Term Version: This version won''t be supported by Java providers such
    as Oracle, Amazon and so on. That means patches for security or updates won''t
    be created.

    * Long-Term Version: The Java vendors will maintain and support this version for
    longer, usually for example the latest LTS version is Java 17 released in 2021
    and it will be supported until September 2026 and possibly extended until September
    2029.'
