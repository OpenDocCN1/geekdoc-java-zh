  md: '4 Encapsulation access modifiers, package structure


    +   1 com.company-name.domain.name.system-package

    2 com.javachallengers.payment.resources

    3 com.javachallengers.payment.services

    4 com.javachallengers.payment.dao or

    5 com.javachallengers.payment.repository


    Then we would have other packages to assist our three main packages. Some of them
    are the config package which will configure a web application with initial values
    we need, it might light resource classes from our application, it will basically
    initialize the whole application.


    We also need an exceptions package where we will declare our specific Exceptions
    for business requirements. We need to go deep into exceptions in future chapters:


    com.javachallengers.payment.exceptions


    The dtos (Data Transfer Object) package that are the objects used to pass data
    through the network. We send a dto to the front-end of our application:


    com.javachallengers.payment.dtos


    The model layer that are the objects from requirements that represent the domain
    of our application or have the core business data abstracted.


    com.javachallengers.payment.model


    Another package that is common and useful in real-world projects is the util.
    Usually, in the util package we can create generic methods for services and avoid
    code repetition.

    "com.javachallengers.payment.util"


    The mentioned packages wont be exactly the same for all projects. If we are working
    with microservices sometimes the feature-name would be removed from the package
    name since the domain is the micro-service architecture, in other applications
    we would have the feature name after the system package. Let''s see how those
    variations be:


    +   1 com.company-name.brief-project-name.system-package.domain-name

    2 com.company-name.brief-project-name.system-package


    I personally like the following package structure when we are using a micro-service
    that is responsible for only one domain:


    com.company-name.brief-project-name.system-package


    The other option is like for projects with more than one domain is the following:


    com.company-name.brief-project-name.feature-name.system-package


    If you''ve been working with Java, you have probably seen many similarities with
    your project, if you never seen a real-world Java application, now you know how
    it''s usually organized and that will help you to understand a real-world project.'
