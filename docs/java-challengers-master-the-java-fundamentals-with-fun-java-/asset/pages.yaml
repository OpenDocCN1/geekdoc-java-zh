  md: "# 14.14.1 Validating Data with a Compact Constructor\n\nThere is a different\
    \ way to use constructor with records. We can validate data by using a compact\
    \ constructor. Let's see how that works in:\n\n```\nrecord Car(String brand, String\
    \ model) {\n  Car() {\n    if (brand == null || model == null) { // #A\n     \
    \ throw NullPointerException(\"null values are not accepted.\"); // #B\n    }\n\
    \  }\n}\n```\n\nCar car = new Car(\"Ferrari\", null);\n\nOutput:\nException in\
    \ thread \"main\" java.lang.NullPointerException: null values are not accepted...\n\
    Code analysis:\n\n+   * #A: Note that we don't have the parenthesis () in the\
    \ compact constructor. This constructor will be executed after the main record\
    \ constructor. It's suitable to validate data from a record.\n* #B: We make a\
    \ simple validation checking if the field brand or model are null. If one of them\
    \ are null a NullPointerException is thrown.\n\n# 14.14.2 Further Possibilities\
    \ with record\n\nTo summarize what can be done in a record, let's analyze the\
    \ following list. A record can:\n\n+   * Implement interfaces\n* Use generics\n\
    * Use compact constructors\n* Overload constructors\n* Use static methods\n* Use\
    \ static variables\n* Use instance and static blocks\n* Override the getters,\
    \ toString, equals and hashCode methods\n* Use static or instance classes within\
    \ it\n* Use annotations within it\n* Be used as an inner class"
