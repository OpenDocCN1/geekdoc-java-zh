    # 12.10.1 Big-O of a HashSet & LinkedHashSet


    The elements of a HashSet and LinkedHashSet are stored in an internal map manipulated
    by hash. That means that, we get a constant time complexity when performing the
    following operations:


    | Method | Complexity Average/Worst Case Scenario | Explanation |

    |---|---|---|

    | add(e) | O(1) | Adds an element into a node |

    | contains(e) | O(1) | Finds an element by hash in a HashSet’s map |

    | remove(e) | O(1) | Removes an element by hash in the HashSet’s map |


    To summarize, HashSet and LinkedHashSet are fast to insert, remove, and search
    for elements. But'
