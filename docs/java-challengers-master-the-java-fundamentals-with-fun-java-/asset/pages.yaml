  md: '# 13.2.7 Creating a stream for int, long, and double


    To avoid auto-boxing primitive elements to wrappers when using a Stream<T> we
    can use specific stream classes IntStream, LongStream, and DoubleStream.


    The IntStream and LongStream classes are also useful because they have the range
    and rangeClosed methods which allows us to create a stream within a specific range
    of numbers.


    Let''s see how to use the range method, notice that the last argument is 5:


    ```

    IntStream intStream = IntStream.range(1, 5);

    intStream.forEach(System.out::print);

    ```


    Output:

    1234


    If we want the second argument of the range method to be inclusive, we have the
    rangeClosed method to do:


    ```

    IntStream intStream = IntStream.rangeClosed(1, 5);

    intStream.forEach(System.out::print);

    ```


    Output:

    12345


    We can also use DoubleStream to generate double numbers as we want:


    ```

    DoubleStream.iterate(0.0, i -> i + 1.5).limit(3)

    .forEach(n -> System.out.print(n + " "));

    ```


    Output:

    0.0 1.5 3.0


