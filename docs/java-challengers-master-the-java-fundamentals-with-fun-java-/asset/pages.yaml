    # 464


    that a thread might suddenly stop its execution for other threads. The CPU plays
    a role on that too, the thread will need resources to run.


    Blocked: When a thread is waiting for a monitor lock. This means, when another
    thread got a lock and other threads want to access this lock but it''s blocked
    since the other thread has to finish its execution.


    Simply put, a thread will be blocked when it''s waiting for indeterminate time,
    most times until threads finish their executions.


    Timed Waiting: It''s a more predictable way to wait. Therefore, it is how we specify
    how much time the thread will wait to be executed. As Java doc, those are the
    invoked methods:


    ```

    Thread.sleep(time)

    Object.wait(timeout)

    Thread.join(timeout)

    LockSupport.parkNanos(time)

    LockSupport.parkUntil(time)

    ```


    Terminated: When a thread finishes its execution normally. There is also the case
    where there is an error and the thread gets terminated.


    # # 15.2 Thread


    The most fundamental class to work with concurrency in Java is the Thread class.
    A Thread in Java is the smallest process that can run in parallel. When creating
    even the simplest program in Java we will be dealing with Threads, and that''s
    because the main method has a main Thread.


    We can create many Threads and run them in parallel. Depending on the situation,
    when working in a multi-thread environment code will be executed at the same time
    or concurrently, maintaining it is more challenging.


