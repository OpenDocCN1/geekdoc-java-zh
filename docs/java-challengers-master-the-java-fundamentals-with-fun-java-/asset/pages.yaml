    494


    The trick of this code challenge is that even though we are synchronizing the
    main method, we are not actually using the wait and notify methods for the main
    method. Instead, we are trying to invoke the wait method from the current thread
    which actually does not hold the lock.


    That means, we are not synchronizing the current thread object at all!


    Therefore, when trying to invoke the wait method from the currentThread we will
    get an IllegalMonitorStateException. The same will happen when invoking the notify
    method from the thread object since there is no lock for it.


    As a rule of thumb, always synchronize the object you want to use the wait, notify,
    and notifyAll methods. Also remember that every Object can invoke those methods.


