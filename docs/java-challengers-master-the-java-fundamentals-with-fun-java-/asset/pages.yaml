  md: '# 4.4.1 Why packaging?


    Packaging is extremely important because in big projects, it gets really hard
    to find classes without organization. Even in small projects it''s always a good
    practice to divide and organize the code in a way that is grouped in different
    sections where files can be easily found.


    We can use the analogy of categories when we visit a blog website, if we look
    for categories, it''s far easier to find what we want. If we go to the javachallengers
    website for example and look for the category Java streams, we will only find
    posts that are related to Java streams. The same happens with packages, if we
    want to look for a service for example, we go to the service package.


    # 4.4.2 How to name a packages?


    But how the universal pattern for naming packages in Java is the following, the
    domain of a company reversed, the name of the project and then the name from the
    package to group classes:


    ```

    com.javachallengers.service

    ```


    You might be wondering why we have to use this extensive naming? In Java, it''s
    very common to utilize third-party libraries (a group of classes to solve necessities)
    and for this reason, it''s very likely that we will find classes with the same
    names. But if we use a domain name and the project name should never find a duplicate
    class name, therefore there won''t be any class conflicts.


    Let''s suppose we have to handle a library to handle special operations with dates
    and the operation with an external library such as Yoda Time and for coincidence
    there the classes are the same from Java and the Yoda Time library, then what
    would happen? The code wouldn''t compile, there would be a conflict and the application
    wouldn''t work.


    # 4.4.3 Creating packages structure in a real-project


    In a real-world Java application usually we will have three main layers of abstraction.
    The resource layer that will have the API endpoints that will usually connect
    to the front-end layer.


    Then the resource layer will invoke the service layer which contains the business
    requirements logic.


    Finally the service that will interact with the database layer code, it''s commonly
    named as dao or repository.


    Those three main packages that will have the core code in a Java application usually
    be named as:'
