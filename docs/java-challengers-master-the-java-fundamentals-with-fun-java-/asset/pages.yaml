  md: '+   Microservices 12 factors: those are principles to make your Microservice
    application robust and resilient. Those factors are Codebase, Dependencies, Config,
    Backing services, Build, release, run, Port binding, Concurrency, Dispensability,
    Dev/prod parity, Logs, Admin processes. For more go to https://12factor.net/#11.

    Platform as a Service - PaaS (Heroku, Pivotal Cloud): a platform as a service
    does most of the hard work for you. It''s much easier to deploy your application
    with Heroku or Pivotal Cloud Foundry. That''s because internal configurations
    such as scaling, load balancing, routes will be automatically created. The disadvantages
    of PaaS is that you don''t have so much control

    Software as a Service - SaaS (Sales Force, Stripe): those are entire applications
    running in the cloud. Simple yours consumes the endpoints of a service. In this
    case, you don''t need to take care of infrastructure or anything. You just need
    to use the service directly.

    Infrastructure as Code (Terraform, Pulumi, Chef): of code you don''t need to know
    all those tools but the principles of infrastructure as code. The idea is to have
    all your infrastructure written in code where you can easily replicate and recreate
    your environment. Another advantage is that the truth of your environment is in
    the code.

    Monitoring (Datadog, Prometheus): the complexity of Microservices architectures
    increase a lot. So, it''s necessary to monitor what is happening by measuring
    their time-response, requests amount, errors, tracing between Microservices and
    more...


    # 17.4 Getting prepared for interviews


    The game in interviews can change from time to time but I will do my best to explain
    to what they are asking for at the moment. I''ve done many interviews in Europe
    and I have a good idea of what the market is asking for.


    There are two types of interviews, the one that will be more focused on Java and
    the other will be more focused on algorithms.


    If the interview is more related to Java, you are good. You will use everything
    from this book, you will ace the interview.


    They will ask about your experiences and the key here is to tell your greatest
    achievements. Remember, you are selling yourself in the interview and you are
    the product.


    Other than Java questions, they will definitely ask you SQL,Microservices concepts,
    architecture and Design System. They will also tell you know how to deal with
    conflicts, if you are good team player, if you communicate clearly.


    Most companies are following the pattern from the big interviews such as Google.
    They will give you an algorithm, therefore, it''s important for you to be sharp
    with them. They will ask about data structures, graphs, queues, they will want
    you to solve an algorithm, communicate your thoughts so that they understand how
    you think.'
