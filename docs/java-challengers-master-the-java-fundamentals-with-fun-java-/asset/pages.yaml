  md: '# 3 Basic object-oriented programming

    (Review)


    This chapter covers:


    +   - Creating, naming, and instantiating classes

    - Creating and using class methods, and manipulating instance variables

    - Accessing instance attributes and methods with the keyword this

    - Understanding how to use constructors in a flexible way

    - Manipulating object references

    - Working with arrays

    - Total of 5 Java code Challenges


    Before the advent of object-oriented programming there was the procedural paradigm,
    which made it difficult to reuse code. With the procedural code easily gets spread
    throughout the whole system, and as a result it is hard to maintain. For example,
    every time it was necessary to validate a certain type of ID, developers would
    have to invoke the same function to do this. Any change to that function required
    changes to numerous parts of the codebase. Developers also had to write extensive
    documentation to ensure functions were used correctly.


    To solve these problems, the object-oriented paradigm was created. The main intention
    of this paradigm is to minimize differences between software code and the real
    world, making it easier to solve business problems in a more concise way. With
    object orientation we can express better real entities and actions from real-world
    problems, making it easier to reuse code.


    Object orientation also makes it easier to organize the code structure, write
    less code, and centralize features, which makes applications more flexible and
    with encapsulated logic. When you''ve mastered object-oriented concepts, it''s
    possible to create easy-to-maintain code whose features are well organized and
    simple to track down.


