    # 13.4.7 Debugging a stream with peek() and IDEs


    The peek function is used for debugging what is going on a stream. It''s also
    possible to debug a stream by adding a breakpoint where you wish. This works for
    Eclipse and Netbeans. However, if you want a more sophisticated experience to
    debug streams, you can also use the Java Stream Debugger plugin from IntelliJ.


    But not worry, the peek method will do very well, so you don''t really need a
    sophisticated tool for debugging your streams.


    The peek method will simply log data when you need it, which means that it will
    show the data as the stream goes. Let''s see how to use the peek method:


    +   List<String> bojacklist = List.of("Bojack", "Diane", "Todd");

    bojacklist.stream().peek(System.out::println);


    **Output:**

    Nothing will be printed here...


    Why is that? Because the peek method is an intermediate operation method, which
    means that nothing will happen unless a terminal method is invoked.


    It''s important to remember that streams are lazy, therefore, something will only
    happen when there is a method that will do everything with the stream.


    +   List<String> bojackCharacters = Stream.of("BOJACK", "DIANE", "TODD")

    .map(String::toLowerCase)

    .peek(e -> System.out.println("Lower Case Elements: " + e))

    .filter(e -> e.equals("bojack"))

    .peek(e -> System.out.println("Filtered to bojack: " + e))

    .collect(Collectors.toList());


    ```

    System.out.println(bojackCharacters);

    ```


    **Output:**

    Lower Case Elements: bojack

    Filtered to bojack: bojack'
