    \nThe key concept to focus on this code challenge is that streams are lazy in\
    \ Java to optimize\nperformance. Which means that only the elements we instructed\
    \ in our stream pipeline will be\nprocessed.\n\nFor example, we used the intermediate\
    \ method peek that shows what element we are traversing.\nBut we also used the\
