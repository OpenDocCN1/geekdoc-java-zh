    # 13.1.1 Streams are Immutable


    As mentioned before, the concept of streams is connected to functional programming.
    One of the principles of functional programming is immutability. That means, data
    should not be mutated when we use streams.


    Let''s see this in practice:


    ```

    List<String> originalList = List.of("Homer", "Merge", "Bart", "Maggie");

    List<String> newList = originalList.stream() // #A

    filter( -> e.equals("Moe")) // #B

    tolist(); // #C

    System.out.println(originalList); // #D

    System.out.println(newList); // #E

    ```


    Output:

    [Homer, Merge, Bart, Maggie]

    []


    Code analysis:


    +   - A: We invoke the stream method from our originalList to get a stream of
    data from this list. This means, we can iterate over the elements "Homer", "Merge",
    "Bart", "Maggie".

    - B: We filter the elements from originalList to "Moe". The problem is that we
    don''t have any "Moe" in the list. Therefore, the stream will be empty.'
