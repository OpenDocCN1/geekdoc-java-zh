  md: "# 14.14 Using record\n\npreview feature\nstandard feature\n- Since Java 14\n\
    - Since Java 16\n\nWith the objective of reducing the boiler-plate code with the\
    \ Java language, the record feature was introduced. Simply put by creating a record\
    \ we have an immutable data object with constructor, getters, toString, equals\
    \ and hashCode implemented for free.\n\nThe record feature was introduced on Java\
    \ 14 and became standard on Java 16.\n\nLet's see that in practice creating a\
    \ data object without a record and then using:\n\n```\nCarWithoutRecord {\n  \
