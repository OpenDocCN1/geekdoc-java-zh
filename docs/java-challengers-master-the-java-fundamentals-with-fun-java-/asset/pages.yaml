    ingredients, the recipe won''t work as well.


    Simply put, code semantic is the logic we have to perform tasks.


    # 2.1.3 Variables in Java: Primitive types and value


    A variable in programming is a way to store a value into a named allocated space
    in the computer''s memory. We can store text, binary, and numerical values in
    a variable and then make calculations, perform comparisons, and so on.


    Java has two main types of variables: primitives and objects. Many of the primitive
    variable types are also used in other programming languages. If you''ve worked
    with C, for example, you will find that many of the variable types in Java are
    the same. We''ll focus on the primitive types for now; Java objects will be introduced
    in the next chapter.'
