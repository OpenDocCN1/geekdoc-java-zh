  md: "# 7.3 Default methods\n\nA problem had to be solved in Java 8. It was necessary\
    \ to add many new methods in widely used interfaces as List, Set, and Map because\
    \ of the functional programming in the existing Collection api. Imagine if a public\
    \ abstract methods were declared in the List interface—a lot of code would break\
    \ because classes that implement that interface would not correctly implement\
    \ the new methods, and if those methods were to be added to all those classes\
    \ code repetition would be immense.\n\nJava is a language that values backward\
    \ compatibility, so the decision was to allow methods with implementations in\
    \ interfaces. With these new methods, known as default methods, it's possible\
    \ to provide a default implementation in the interface so that each class is not\
    \ required to provide its own implementation.\n\nA great example of a default\
    \ method that's widely used in Java 8 and later is the forEach method in the Iterable\
    \ interface. This method goes through each element in a collection, performing\
    \ the specified action. Let's take a look at the method declaration (don't worry\
    \ too much about what's happening here now; we'll explore functional programming\
    \ in more depth in later chapters)\n\n```\npublic interface Iterable<T> {\n  //\
    \ Other methods omitted\n  default void forEach(Consumer<? super T> action) {\n\
    \    Objects.requireNonNull(action);\n    for (T t : this) {\n      action.accept(t);\n\
    \    }\n  }\n}\n```\n\nWe can also customize default methods in our own classes.\
    \ Let's see how that works:\n\n```\npublic class Yoda implements Jedi {\n  public\
    \ static void main(String... defaultMethodExample) {\n    new Yoda().useForce();\n\
    \  }\n}\n\ninterface Jedi {\n  default void useForce() {\n}\n```"
