  md: '# 2.4 Loops


    Looping in programming is a way to repeat certain logic until a condition is fulfilled.
    You can probably think of several examples in the real world: when we are brushing
    our teeth, we repeat the brushing action until they are clean; when we study for
    a test, we keep studying until we''re confident enough to pass it; when we need
    to drive somewhere, we keep driving until we get where we want to go.


    As in real life, in programming loops are used all the time. But not all developers
    know the full range of possibilities with loops in Java. We are challenged every
    day with different problems, knowing the nuances of loops will help developers
    to produce the best code possible.


    # 2.4.1 The for loop


    The for loop is the most commonly used loop in Java. There are three sections
    in a for loop:


    ```

    for (/* Initialize variable */; /* Condition to continue the loop */; /* Incrementer
    *

    */) { ... }

    ```


    This is the typical way to use it:


    ```

    for (int i = 0; i < 10; i++) { ... }

    ```


    You can initialize as many variables as you want in a for loop:


    ```

    for (short i = 0, y = 0; i < 10; i++) { ... }

    ```


    You can create an infinite loop by specifying a condition that will never be false,
    omitting the condition:


    ```

    for ( ; ) { System.out.println("This will print forever"); }

    ```


    You can use a System.out.println in the incrementer area:


    ```

    for ( ; System.out.println("Incrementer area")) { }

    ```


    # 2.4.2 The break keyword in the for loop


    As you saw in the switch case example, if you want to break out of the current
    process and exit the loop for some reason, you can use the break keyword to do
    so.


    Suppose you want to stop the loop execution when the index is greater than or
    equal to 2:'
