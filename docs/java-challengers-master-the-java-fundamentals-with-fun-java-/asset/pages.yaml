    # 11.1.2 Guidelines for using equals() and hashCode()


    You should only execute equals() method for objects that have the same unique
    hashCode ID. You should not execute equals() when the hashCode is different.


    Table 1. Hashcode comparisons


    | If the hashCode() comparison ... | Then ... |

    |---|---|

    | returns true | execute equals() |

    | returns false | do not execute equals() |


    This principle is mainly used in Set or Hash collections for performance reasons.


    # 11.1.3 Rules for object comparison


    When a hashCode() comparison returns false, the equals() method must also return
    false. If the hashCode is different, then the objects are definitely not equal.


    Table 2. Object comparison with hashCode()


    | When the hashCode comparison | The equals() method should return ... |

    |---|---|

    | returns ... | true or false |

    | true false | false |


    When the equals() method returns true, it means that the objects are equal in
    all values and attributes. In fact, the hashCode comparison must be true as well.


    Table 3. Object comparison with equals()


    | When the equals() method returns ... | The hashCode() method should return ...
    |

    |---|---|

    | true | true |

    | false | true or false |


    We can also return a constant int number that will be always the same. However,
    by doing that, we won''t get the benefit of the hashCode method.'
