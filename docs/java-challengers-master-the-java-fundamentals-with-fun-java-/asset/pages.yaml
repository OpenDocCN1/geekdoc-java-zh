    # 14.15 Using Sealed classes Java 15


    Sealed classes is a concept to help developers in code design. Simply put, it''s
    a way to restrict inheritance of a class or interface. So that only the classes
    we want can inherit a sealed class or interface.


    An example is if we have an Aircraft class and we only want Airplane and Helicopter
    to inherit Aircraft. This is useful because if another developer creates another
    class named Jet that is not supposed to inherit Aircraft, that will be clear in
    the code.


    Let''s see a practical example with Aircraft being the sealed class allowing only
    Airplane and Helicopter to be extended:'
