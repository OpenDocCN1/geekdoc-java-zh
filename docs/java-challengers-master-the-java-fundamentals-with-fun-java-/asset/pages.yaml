  md: "#  14.14.3 Limitations from record\n\nNotice that a record only creates immutable\
    \ objects, which means, once the object is created it can't be changed. That's\
    \ different from a normal data class where you can create getters and setters.\
    \ Immutability is preferable to restrict your code from possible bugs sources,\
    \ so use immutable objects whenever possible.\n\nA record behind scenes a final\
    \ class that extends the abstract class java.lang.Record:\n\n```\n// Omitted the\
    \ comments of this class\npackage java.lang;\npublic abstract class Record {\n\
    \    protected Record() {}\n\n    @Override\n    public abstract boolean equals(Object\
    \ obj);\n\n    @Override\n    public abstract int hashCode();\n\n    @Override\n\
    \    public abstract String toString();\n}\n```\n\nTherefore, the restrictions\
    \ of a record will be pretty much the same as an abstract class. Let's see a list\
    \ of the restrictions to reinforce them, a record can not:\n\n+   - Extend another\
