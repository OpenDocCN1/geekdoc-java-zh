    ```

    CompletableFuture<String> future = CompletableFuture.supplyAsync(() -> 1 / 0 \n+
    "Causing ArithmeticException!"

    CompletableFuture<String> errorHandling = future.exceptionally(ex -> \n"There
    was an error: " + ex.getMessage());

    System.out.println(errorHandling.get());

    ```


