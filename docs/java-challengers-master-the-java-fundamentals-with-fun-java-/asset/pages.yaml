    # 8.10 Real World Exception Creation Challenge


    Imagine you''re a developer at a financial company and you are given the task
    of elaborating an exception structure that will enable developers to track errors
    more easily and with more clarity.


    Your goal is to create a generic checked business exception and some more custom
    exceptions that extend it. Your customized exceptions should show clear messages
    indicating the source of the problem when you print the stack trace.


    You also need to pass the error `NO_ACCOUNT_BALANCE` to the frontend application
    so it can show a clear message to the user.


    The generic BusinessException class will have a constructor with an error message,
    Throwableable cause, and error code (if it can be an enum you prefer). You''ll
    create two specialized exception classes, NoAccountBalanceException and CentralBankServiceDownException,
    both extending BusinessException.


    Finally, you''ll need to create a service class named AccountService that implements
    a method named withdrawAccount receiving a customerId and moneyAmount. You don''t
    need to implement the logic in withdrawAccount method; you just need to throw
    the exceptions created, catch them as BusinessExceptions, and then print the stack
    trace. That will be enough for this challenger. Over to you!


    # 8.11 Summary


    +   - Exceptions are a crucial concept to master in Java. In this chapter you
    learned how to use the most suitable exception types for multiple situations,
    and how to structure your exception handling in try, catch, and finally blocks.


    +   - You learned the difference between checked and unchecked exceptions, and
    that all exception types in Java inherit from Throwableable.


    +   - You know how to handle and declare exceptions, and how to wrap specific
    exceptions inside generic ones.


    +   - You learned that it''s possible to close Java resources by using the try-with-resources
    statement instead of using a finally block.'
