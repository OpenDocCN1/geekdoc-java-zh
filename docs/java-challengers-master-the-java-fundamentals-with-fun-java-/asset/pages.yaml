  md: "# 15 Concurrency Fundamentals\n\nThread synchronization is the technique used\
    \ to make sure a critical section (code that might cause data conflict between\
    \ threads) of the code will always run in isolation from the other threads.\n\n\
    A simple analogy to a synchronized block with threads is to imagine that the critical\
    \ code section is a bathroom and the lock is the bathroom's door. Imagine the\
    \ thread are the people that will go to the bathroom. When a person goes to the\
    \ bathroom and locks the door, other people won't be able to enter the bathroom.\
    \ They will have to wait until the lock is opened. Once the door is opened then\
    \ the other person will be able to enter.\n\nLet's see how if we fix the code\
    \ to avoid data conflict and race condition:\n\n```\nimport java.util.stream.IntStream;\n\
    \npublic class RaceConditionMultipleThreadsSync {\n    private int counter = 0;\n\
    \n    public synchronized int incrementAndGet() { //*A\n        try {\n      \
    \      Thread.sleep(10);\n            counter++;\n        } catch (InterruptedException\
    \ e) {\n            e.printStackTrace();\n        }\n        return counter;\n\
    \    }\n\n    public static void main(String... args) {\n        RaceConditionMultipleThreadsSync\
    \ raceCondition = \\\n            IntStream.rangeClosed(1, 5).forEach(i -> {\n\
    \            Thread thread = new Thread(() -> {\n                System.out.println(Thread.currentThread().getName()\
    \ + \":\" +\n                    raceCondition.incrementAndGet()); //*B\n    \
    \        });\n            thread.start();\n        });\n    }\n}\n```\n\nOutput\
    \ (Thread execution order may vary):"
