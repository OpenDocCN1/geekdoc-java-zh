  md: '# 16.6.4 Using shutdown


    An Executor task will be running forever unless we use the shutdown method. The
    shutdown method will stop thread executions gracefully. This means that the shutdown
    method will wait until threads started its execution to finish. It won''t wait
    for threads that submitted their tasks but didn''t start their execution:


    ```

    1 ExecutorService executor = Executors.newFixedThreadPool(1);

    2 Runnable callableTask = () -> System.out.println(Thread.currentThread() \

    3 .getName());

    4

    5 executor.submit(callableTask);

    6 executor.submit(callableTask);

    7

    8 executor.shutdown();

    ```


    Output:

    pool-1-thread-1

    pool-1-thread-1


    Notice in the program above the application will be finished.


    If we want to wait until tasks that are submitted to be finished, we have to use
    the awaitTermination method:


    ```

    1 // Same code as above

    2 executor.awaitTermination(500, TimeUnit.MILLISECONDS);

    3 executor.shutdown();

    ```


    Notice in the awaitTermination method if the tasks in execution take long to finish
    the await will finish after the timeout of 500 milliseconds.


    # 16.6.5 Using shutdownNow


    The shutdownNow method will do a hard stop on threads that are being executed.
    Also returns the list of tasks that couldn''t be finished.


    If we want to wait for tasks to be finished we can use the awaitTermination method.
    It''s important to remember that not always the shutdownNow method will stop a
