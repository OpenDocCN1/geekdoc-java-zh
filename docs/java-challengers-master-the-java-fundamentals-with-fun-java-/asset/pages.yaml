    # 17.1 Other important Java features


    It wasn''t possible to address every Java feature in this book. Otherwise, this
    book would easily have more than 200 pages. The good news is that we don''t really
    have to know to use all of them, we need to know instead that they exist whenever
    necessary we can check how to use them in the docs and use these features.


    Let''s see some of the features we need to be aware of in it''s necessary. Also
    remember that the following features are available in other programming languages:


    +   - Date API: In almost every real Java project we will need to handle dates.
    We will need to create and date time very often. Fortunately, Java has a very
    powerful API to work with dates. The old classes before Java 8 such as Date and
    Calendar should be avoided because the code will get more complicated and it''s
    not thread-safe. To solve problems, Java 8 have the LocalDate, LocalDateTime and
    LocalDateTime classes that will easily handle any date and time we have. For more,
    check the following link: https://docs.oracle.com/javase/8/docs/api/java/time/LocalDate.html

    - File handling: It''s a feature that is quite rare to be used in real applications
    but it''s useful to know it exists in some situations we will need to know it.
    The most effective Java API to handle files is the java.nio.file. Basically, we
    can easily create, update, delete, read, and process a file with this API. For
    more, check the following documentation: https://docs.oracle.com/java/8/docs/api/nio/file/package-summary.html

    - Tokenization: To break a String we can use any token such as, | _ this means
    any character. This is useful when we need to search a specific String in a big
    text.'
