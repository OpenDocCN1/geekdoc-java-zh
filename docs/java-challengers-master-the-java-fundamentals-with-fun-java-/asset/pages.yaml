  md: "# 8.6.1 Changes in Java 9\n\nA small but important change to the try-with-resources\
    \ statement was introduced in Java 9. Now we can pass in a resource from outside\
    \ the try block; we're not required to declare and instantiate the variable inside\
    \ the try block. Here's an example:\n\n```\npublic class TryWithResources9 {\n\
    \    void executeAction(AutoCloseable closeable) {\n        try (closeable) {\n\
    \            // Perform your logic\n        } catch (Exception e) {\n        \
    \    e.printStackTrace();\n        }\n    }\n}\n```\n\nAs you can see, it's easy\
    \ to extend this method because we're passing an interface, and we can simply\
    \ transfer the responsibility for instantiating the class to the code that is\
    \ invoking this method.\n\n# 8.6.2 Classes that can be used in the try-with-resources\
    \ statement\n\nThe classes or interfaces that can be used in a try-with-resources\
    \ statement are the ones that extend the Closeable or AutoCloseable interface.\
    \ The Connection interface, for example, extends AutoCloseable interfaces:\n\n\
    public interface Connection extends Wrapper, AutoCloseable { ... }\n\nThe OutputStream\
    \ class is another example; it implements Closeable:\n\npublic abstract class\
    \ OutputStream implements Closeable, own { ... }\n\nNotice that Closeable extends\
    \ AutoCloseable:\n\n```\npublic interface Closeable extends AutoCloseable {\n\
    \    public void close() throws IOException;\n}\n```\n\nAlso note that there is\
    \ a close method in both interfaces that must be implemented in the class that\
    \ will have its resource closed.\n\nYou can also create your own AutoCloseable\
    \ class. Let's look at an example:"
