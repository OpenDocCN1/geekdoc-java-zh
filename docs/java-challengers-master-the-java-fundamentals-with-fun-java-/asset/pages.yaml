    int number1, number2 = 5;

    System.out.println(number1 + number2); // The JVM will print 10

    ```


    In real-world projects it’s not recommended to pollute code with several comments
    between code instructions. According to Uncle Bob (Robert Martin), author of the
    popular handbook Clean Code (Prentice Hall, 2008), commenting code is a way to
    say we’ve failed at making our code simple to understand.


    Comments like these are used in this book for the purpose of clarity and to ensure
    that the reader can follow along, but keep in mind that I would avoid using such
    comments in a real-world project.


    Another purpose for comments is to provide descriptions of variables, classes,
    and methods, as a formal way to document your code. (Don’t worry, we’ll study
    all those concepts in depth in the next chapter.)


