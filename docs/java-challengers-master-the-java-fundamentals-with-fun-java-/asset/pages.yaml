    \ in a Lambda, however, we can't change a local variable. A lambda can only use\
    \ an effective final variable.\n\nEffective final variables are variables that\
    \ are initialized with a value and this value is never changed even though this\
    \ variable is not final. Let's see an example of an effective final variable:\n\
    \n```\nint effectiveFinalVariable = 5;\nsSystem.out.println(effectiveFinalVariable);\n\
    ```\n\nWe changed the code above, therefore, effectiveFinalVariable is an effective\
    \ final variable. Let's see how is a non effective final variable now:\n\n```\n\
    int nonEffectiveFinalVariable = 5;\nsSystem.out.println(++nonEffectiveFinalVariable);\n\
