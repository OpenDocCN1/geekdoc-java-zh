- img_proc: true
  md: '15 Concurrency Fundamentals


    The fact of two or more events or circumstances happening or existing at the same
    time.


    As mentioned before, concurrency in computer science is not the same as in the
    dictionary. To absorb this concept, think of interruptibility. This means that
    a task will be interrupted so the other can continue using the same CPU.


    # 15.1.1 Practical Concurrency Example


    Let''s suppose you have the following tasks to accomplish in the time-frame of
    3 hours:


    +   - Get a visa (Takes around 2 hours)

    - Finish a coding task from work (Takes around 2 hours)


    Non-concurrent mode:


    To get a visa in away you will wait at least 2 hours in the queue. So you wait
    the two hours get your visa


    Concurrent mode (the smart way)


    You can use the powerful concept of concurrency here! You plan ahead of time that
    you will be waiting in the queue for 2 hours and then you take your laptop with
    you! When you get in the queue to get your visa, interrupt the task to get the
    visa and start working on your coding task. After waiting for 2 hours in the queue,
    you have your coding task done and get your visa! Finally, you tell your boss
    how good you are to finish the task and get the visa!


    # 15.1.2 Parallelism


    Parallelism actually runs tasks at the same time which makes it faster than concurrency.
    This means if there are multiple tasks that need to be run, they will run simultaneously.
    Parallelism uses more than one CPU to process its tasks. When talking about parallelism
    remember of tasks running independently


    # 15.1.3 Practical Parallelism Example


    Now let''s suppose you have the following tasks to accomplish in 6 hours:


    +   - Go to a party of your best friend (Takes 6 hours)

    - Finish your conference presentation (Takes 4 hours)'
