  md: "```\nvoid processValue(String value) {\n  System.out.println(\"Do some logic\
    \ with the value present\");\n}\n```\n\nWherever we invoke the processValue method,\
    \ we can do the following:\n\n```\nOptional.ofNullable(\"value\").ifPresentElse(this::processValue,\n\
    \  () -> System.out.println(\"Process logic when there is no value...\"));\n```\n\
    \nObserve in the method that we are making clear there are two method flows when\
    \ there is a value and when there isn't. By doing that, we don't hide features\
    \ in a method, we make it explicit. Therefore, other programmers will be able\
    \ to understand the code more easily.\n\n# 10.3.2 Overloading the Method\n\nWhen\
    \ there is more than one parameter in a method and one of those parameters might\
    \ not have a value, it's also a good idea to use an Optional parameter:\n\n```\n\
    public void saveSimpson(String name, Optional<Child> optChild) {\n  Child child\
    \ = optChild.orElseGet(Child::new);\n  // Apply some logic...\n  simpsonDao.save(name,\
    \ child);\n}\n```\n\nLet's suppose a developer invokes the above method passing\
    \ null in the Optional<Child> child method parameter:\n\n```\nsaveSimpson(\"Homer\"\
    , null);\n```\n\nYou probably guessed it, a NullPointerException will be thrown!\
    \ Therefore, it completely defeats the purpose of the Optional class.\n\nTo manage\
    \ this situation, we can remove the Optional parameter and handle the null value:\n\
    \n```\npublic void saveSimpson(String name, Child child) {\n  Child childToPersist\
    \ = child != null ? child : new Child();\n  // Apply some logic...\n  simpsonDao.save(name,\
    \ child);\n}\n```\n\nAnother way to handle this situation is to overload the saveSimpson\
    \ method."
