  md: '# 12.5.1 Methods Mapping from Deque and Stack


    The Deque interface has methods that has different names from Stack but do the
    same thing. That happened because Stack is a legacy class. To not confuse them
    you, let''s explore them here:


    | Stack | Deque | Explanation |

    | --- | --- | --- |

    | push(e) | addFirst(e) | Adds an element to the top of the stack |

    | pop() | removeFirst() | Removes the first element of the stack |

    | peek(e) | getFirst() | Gets the first element of the stack |


    You can use all of the above-mentioned methods in the Deque interface to keep
    retro-compatibility with Stack but it''s recommended to use the newer methods
    from Deque instead.


    # 12.5.2 Queue & ArrayDeque


    We can use all methods of a Queue when working with a Deque. However, if our intention
    is to only use queue capabilities, it''s better to make it explicit by declaring
    our list with Queue.


    A Queue is easy to understand if we make the analogy of queue of people in a bank.
    The first person that will be attended will be the first to get out. It follows
    the FIFO (First-in First-out) principle as you can see in the following illustration:


