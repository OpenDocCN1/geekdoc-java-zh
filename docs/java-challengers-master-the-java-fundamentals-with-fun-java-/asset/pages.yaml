    # 16.5.8 Handling Exceptions


    One other great advantage and motivation of introducing the CompletableFuture
    api is the possibility to handle Exceptions.


    Therefore, if something goes wrong during the computation of the CompletableFuture,
    we are able to handle the Exception.


