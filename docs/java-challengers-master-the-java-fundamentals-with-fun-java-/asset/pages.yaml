  md: "# 8.3 JVM errors\n\n```\npublic File(URI uri) {\n    if (uri.isAbsolute())\
    \ {\n        throw new IllegalArgumentException(\"URI is not absolute\");\n  \
    \  }\n}\n```\n\nOther than Exception and RuntimeException there is the Error.\
    \ This is the most serious type of error that can happen and should never be handled.\
    \ The various error in Java all inherit from Error, which, like Exception, extends\
    \ the class Throwable. An example is the StackOverflow, which indicates that there\
    \ was a problem with the memory stack. If that happens the application should\
    \ crash right away.\n\nWe can make a StackOverflow happen by creating a recursive\
    \ method invocation. This method will keep calling itself indefinitely, eventually\
    \ exhausting the resources of the system, if the problem is not caught:\n\n```\n\
    void pressButton(String employeeName) {\n    pressButton(\"Homer\");\n}\n```\n\
    \n# 8.1.4 The exception hierarchy\n\nFigure 8.1 illustrates the relationship between\
    \ the various Exception and Error classes in Java. Note that these are only a\
    \ few representative examples of the subclasses of the parent types (Exception,\
    \ Error, RuntimeException, and so on). The important thing to understand is that\
    \ all checked exceptions inherit from Exception, and all unchecked exceptions\
    \ inherit from RuntimeException or Error."
