    # 16.3.4 Summary from volatile


    +   * It guarantees that the variable will be read from the main memory, not from
    the cache.

    * The happens-before rule take action with volatile. Which means that if two threads
    are sharing the same resource, the write will happen before the read.

    * It doesn''t synchronize threads, if a processes have to be executed in isolation
    (mutual exclusion), the volatile keyword won''t do that.

    * Using volatile will avoid the use of a CPU cache, therefore, only use it when
    necessary.


    # 16.4 The happens-before rule


    There is also a very important rule called happens-before. When code are executed
    in a multi-thread environment the compiler and CPU will reorder code statements
    for performance optimization.


    There are a set of rules from the compiler to guarantee that code execution happens-before
    another code execution. Usually, the code reordering happens when the compiler
    knows that it won''t impact the code logic process.


    Let''s see a simple code example that assigns values to variables that are not
    volatile and then assigns a value to a volatile variable:


    ```

    int number1 = 7; // Will always happen before the volatile assigning

    int number2 = 8; // Will always happen before the volatile assigning

    volatile int number3 = 9;

    ```


    The variable assigning from number1 and number2 might be reordered since there
    is no impact in the code. However, the volatile variable assigning from number3
    is guaranteed to not be reordered with number1 and number2. It will always be
    assigned after number1 and number2 because number1 is a volatile variable.


    The compiler could execute the above code as follows:'
