  md: '# 15 Concurrency Fundamentals


    This chapter covers:


    +   - Fundamentals of concurrency

    - Concurrency vs parallelism

    - States of a Thread

    - Creating Threads

    - Using Runnable in a Thread

    - Using the sleep method to temporarily stop a thread

    - Using the join method to join thread executions

    - non-daemon and daemon threads to haave control on when the thread dies

    - Using the interrupt method to stop a thread execution

    - Understanding race condition to avoid unexpected results from threads

    - Mutual exclusion to synchronize threads (Mutex)

    - Object synchronization

    - Using the wait and notify methods in a thread

    - Total of 4 Java code Challenges


    To enhance throughput, performance and time-processing the concurrency technique
    must be applied. Concurrency is used all the time when we use our computers. Even
    before multi-processors concurrency was used.


    For example, how do you think multiple applications can be opened simultaneously
    even at the ages of Windows 95? Does a web browser and the music app were running?
    This is because tasks were processed concurrently, not necessarily at the same
    time but interrupted giving the illusion they were being run at the same time.


    This is a very fundamental and important concept on computer science that has
    to be mastered by you to become a highly-skilled software engineer!


    # 15.1 Fundamentals of Concurrency


    Concurrency does not really process tasks at the same time but instead, creates
    the illusion of that. There is no need for more than one CPU with concurrency
    because what will happen is that tasks will be executed with context switching.


    There is a confusion with the word concurrency because the following is the meaning
    in the dictionary:'
