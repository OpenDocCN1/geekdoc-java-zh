  md: '# 12.3.3 List.of


    In Java 9, there is the List.of method that makes our lives easier when creating
    an array. However, note that it creates an immutable list as you will see in the
    following example:


    ```

    List<String> heroes = List.of("Batman", "Super Man", "Wonder Woman");

    heroes.add("Robin");

    ```


    When we try to add "Robin" to the heroes list, we will get the following Exception:

    Exception in thread "main" java.lang.UnsupportedOperationException


    Therefore, whenever we have an immutable Collection, we cannot add, delete or
    change the list object in any way. If we really need to change the data we would
    need to create another ArrayList object:


    ```

    List<String> heroes = List.of("Batman", "Super Man", "Wonder Woman");

    heroes = new ArrayList<>(heroes);

    heroes.add("Robin");

    heroes.forEach(System.out::println);

    ```


