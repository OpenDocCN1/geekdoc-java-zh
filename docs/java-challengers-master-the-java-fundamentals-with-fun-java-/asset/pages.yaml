  md: "# 11 Generics and Object Comparison\n\nnative modifier:\nNotice that the Object\
    \ class uses the native modifier in the hashCode method. This modifier indicates\
    \ that the method implementation will use native code and JNI (Java Native Interface).\
    \ This modifier is used for lower-level interaction (machine, memory level). When\
    \ using the native keyword, we can implement Java methods using C or C++. One\
    \ of the motivations is to use the native operator to obtain more performance.\n\
    \nConsidering the raw implementation of the equals and hashCode methods, when\
    \ we create a custom class, we will have to override those methods. Otherwise,\
    \ we will be comparing the object instance instead of the object values.\n\nKeep\
    \ in mind the general rule that when we override the equals method, always override\
    \ the hashCode method too. Remember, the equals and hashCode methods must be always\
    \ together.\nIn the following code example, we will override the equals comparing\
