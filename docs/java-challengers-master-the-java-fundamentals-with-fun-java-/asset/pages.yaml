    \ AND has money for a ticket, then they will be able to watch a horror movie in\
    \ the cinema. Note that both conditions must be true for the person to be able\
    \ to go to the cinema.\n\nThere is another important rule about the && operator\
    \ that makes sense in terms of performance. Because both conditions must be true,\
    \ we know that if the first condition is false, the second condition doesn't need\
    \ to be evaluated. This is exactly what happens: the JVM won't bother to evaluate\
    \ the second condition if the first is false already knows that the && operator\
    \ will return false. This is known as short-circuit evaluation.\n\nLet's look\
    \ at an example to illustrate how this works. bartAge >= 12, will be false, so\
    \ the second condition, bartMoney >= 10, won't be evaluated:\n\n```\nint bartAge\
