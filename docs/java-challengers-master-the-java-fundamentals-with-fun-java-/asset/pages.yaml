  md: '# 6 Inheritance and Polymorphism


    This chapter covers:


    +   * Developing code using inheritance and polymorphism, and overriding methods
    from a superclass

    * Understanding that every class in Java inherits from Object

    * Understanding access modifiers

    * Choosing between inheritance and composition

    * Inheriting from interfaces (an alternative option for multiple inheritance)
    using the super keyword effectively, and invoking constructors with Casting objects
    with the use of Inheritance

    * Preventing inheritance of classes and methods with the final keyword and the
    private modifier

    * The differences between normal and abstract classes, and how to create an abstract
    class design that makes sense in a system

    * Total of 5 Java code Challenges


    Inheritance is a very powerful concept in object-oriented programming that greatly
    facilitates code reuse.


    Inheritance in Java is a way to create new child classes, or subclasses, based
    on the features of existing parent classes, or subclasses. The subclass inherits
    the behavior (methods) and state (fields) of the superclass, and can modify them
    without needing to reimplement all of the underlying logic. When used wisely,
    this powerful concept will bring great benefits to your projects.


    When we talk about inheritance, polymorphism comes hand-in-hand because it''s
    only possible to use it with inheritance. Polymorphism gives a great amount of
    flexibility in code and helps developers create clean code design sense. The Collections
    Api make use of polymorphism, every Java class can make use of polymorphism. Whenever
    we override a method from a parent class, we are using polymorphism. The Collections
    Api has many examples, when we create a List and instantiate it with an ArrayList
    we are already using polymorphism. Most of design patterns make sense therefore
    it is an extremely powerful feature to master the Object-Oriented Programming
    paradigm.


    Composition is another valuable reuse mechanism, with lower coupling. With composition,
    one can have an instance of another class as one of its fields—for example, a
    House can be composed of Bedrooms, a Kitchen, and so forth, and each of those
    component parts can be changed independently. This is an important concept in
    object-oriented programming, where our goal as developers is to abstract and translate
    real-world problems into code to develop solutions that make people''s lives easier.'
