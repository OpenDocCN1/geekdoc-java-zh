  md: '# 17.3 Tendencies of the market


    +   * SOLID

    * Design Patterns

    * Separation of concerns

    * Low coupling

    * High cohesion

    * Object Oriented Programming

    * Functional Programming


    Nowadays, Microservices are the new normal of the market. According to statics
    and researches more than 80% of the companies are making use of microservices.


    Therefore, it''s important to know the technology around the Microservices architectures.
    Let''s see what are the most important ones:


    +   * Microservices Design Patterns: you will face many challenges with Microservices.
    Applications will fail and you will have to build resilient code. The most common
    patterns are: Service Discovery, API Gateway External Configuration, Health Check,
    Circuit Breaker, Database per Service, Blue-Green Deployment, Saga Pattern, QRS..

    * Continuous Integration Continuous Delivery CICD (Jenkins, Github Actions): it''s
    crucial to integrate software by using Git for example and then run your pipeline.
    In the process of continuous integration, you will need to be able to integrate
    your code, build and test it. In the delivery side, you will need to deploy to
    multiple environments, such as dev, qa, staging and production. All of this need
    to be automated.

    * Container (Docker): containerizing an application is one very common skill.
    The goal is to have everything you need encapsulated in a container with your
    application so you can run it anywhere. Also, by using containers you will end
    the "works in my machine" problem. Since once you are able to run your application
    in the container, for sure you can run anywhere.

    * Event Driven Architecture: Kafka, SQS, RabbitMQ are popular tools nowadays.
    They enable Microservices to communicate asynchronously via messages. This architecture
    helps decouple services and make them resilient to failure.

    * Version Control System: the most popular definitely and necessary skill to have
    as a software engineer since the majority (if not every companies) are using.
    Simply, Git will integrate your code in a centralized server, it will create versions
    of the code and will enable you to work on your features separately.

    * Infrastructure as a Service - IAAS (AWS, Azure, GCP): developers don''t need
    to be specialists on a cloud vendor but it''s important to know it enough to be
    able to solve problems. You need to know at least the basic services so you are
    able to put an application in the cloud up and running.'
