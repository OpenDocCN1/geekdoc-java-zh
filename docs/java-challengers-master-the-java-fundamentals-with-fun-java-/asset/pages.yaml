  md: "# 15.9 Using wait and notify\n\nTo orchestrate thread execution at a low level,\
    \ there are the methods wait and notify. The wait method will pause a thread execution\
    \ and the notify method will wake up the thread to continue the execution.\n\n\
    Let's start exploring how the wait method works.\n\n# 15.9.1 wait in practice\n\
