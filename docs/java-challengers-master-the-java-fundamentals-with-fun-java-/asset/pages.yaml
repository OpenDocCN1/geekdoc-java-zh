    \   synchronized (lock) {\n        Object[] es = getArray();\n        int len\
    \ = es.length;\n        es = Arrays.copyOf(es, len + 1); // Creates a copy of\
    \ the array\n        es[len] = e;\n        setArray(es);\n        return true;\n\
    \    }\n}\n```\n\nCopyOnWriteArrayList is too costly for common operations, however\
    \ it might be better when we\nwant to use many operations such as add or delete\
    \ traversing the array than only mutating\nthe array's element.\n\nLet's see now\
    \ code example with CopyOnWriteArrayList:\n\n```\n// Omitted imports\npublic class\
