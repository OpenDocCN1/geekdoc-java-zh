    class to the same package as MoreRestrictiveModifiers and then we are accessing
    the defaultVariable which will be fine.


    The alternative D is also correct because the privateVariable is being accessed
    within the class it was created, therefore it will compile and run successfully.


    # 4.6.3 Main Takeaways of this section


    The following table is organized from the less restrictive public to the more
    restrictive private.


    Before looking at the table, let''s analyze each modifier concept.


    The public access modifier can be accessed everywhere in the project.


    The second restrictive access modifier is protected because the protected modifier
    can be accessed outside its package with inheritance. The default modifier can''t,
    protected is less restrictive than default.


    Then the default access modifier is more restricted than protected because we
    can only access members that are in the same package.


    Finally, the private access modifier can only be accessed in the same class.


    | public | protected | private | | | | |

    |---|---|---|---|---|---|---|n| package | yes | no | same | yes | yes | no |

    | age | only | | | | | |

    | access | with | | | | | |

    | In the same | yes | yes | | |


