    #  14.5 Unnamed module


    To help legacy Java projects below Java 9 to work, the concept of unnamed modules
    was created. This means that Java 8 or previous versions projects can work with
    fully modularized Java 9 (or higher) projects without the necessity of declaring
    a module on.

    It''s important to remember that the old way to deal with different modules or
    jars with Java using the classpath is still in use with unnamed modules. That
    helps maintain retrocompatibility with older Java projects drastically decreasing
    complexity to migrate them. This means that the classpath is still in use in Java
    9 or higher versions and it will probably stay there for while.

    As the name suggests, an unnamed module is a module that has no name, in other
    words, has no module-info.java file.

    Important characteristics of an unnamed modules are:


    +   - Exports and opens all packages automatically

    - It requires all modules from named modules automatically

    - Named modules can''t require an unnamed module

    - Unnamed modules can only be used by another unnamed module

    - It uses the classpath


    #  14.5.1 Unnamed Modules Code Metadata


    Note that it is possible to use an unnamed module even using Java 9 or higher
    versions. We need to not create the module-info.java file.

    Let''s see how that works with code metadata, in other words, using reflection:'
