    # 11.2 Generics


    I know that explaining Generics before Collections is not the standard of most
    Java books. Most books will explain Collections first and then Generics when I
    was learning Collections I was confused by the symbol <>. I was using it with
    Collections but I didn''t know what was exactly.


    That''s why I decided to not follow most Java books do and before going through
    Collections, you can first understand the Generics concept. Then the <> symbol
    will make sense when using Collections.


    As mentioned when we use Collections, we are also of the time to use Generics.
    The generic type of a Collection is the type between the <>. The Generics concept
    was introduced in Java 1.5.

    There is a great definition of Generics in the Java documentation:


    In a nutshell, generics enable types (classes and interfaces) to be parameters
    when defining classes, interfaces and methods.


    This means we can define a type of a parameter in a class or interface in a dynamic
    way. By using generics, we get the benefit of strongly type a parameter dynamically
    so that we can have more control over the code.


    It''s far easier for bugs to come up in an application when we don''t type our
    code. Generics make code strongly-typed and secure during compile-time we don''t
    need to make use of casting for example.


    To make the concept of generics clear, let''s see some code examples.'
