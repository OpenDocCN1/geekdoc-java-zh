  md: '# #1 Introduction


    Java is one of the most used programming languages in the world, and it''s also
    very powerful. Developers who know Java in depth are highly valued by the market
    and abfle to create high-quality, maintainable code. Java is not a simple language
    to master, but this book will provide valuable guidance for developers who want
    to harness its full power and be a reference as a software engineer.


    Even senior developers may not be familiar with some key concepts of the Java
    language, and will impact the quality of the code they write. Reading a book is
    not enough to readily acquire a skill. Developers have to put their knowledge
    into practice by applying what they''ve learned in some way.


    This book provides more than 70 Java Code Challenges to test your understanding
    of the and truly absorb the concepts it introduces. You''ll get up-to-date with
    the most recent Java versions and will learn Java from real project situations
    that when you come across similar situations you will know how to respond effectively.


    As the name says, Java Challenges is not an easy book, but it will guide you through
    the concepts and won''t leave gaps that will make learning difficult. Although
    the subjects present are complex, the concepts are explained in a practical way,
    aiming to facilitate the learning process of the reader.


    After you read, consider, and try to solve each challenge, you can test the code
    and run your own tests by analyzing the output. This will help you connect the
    dots with the content you consume in the book.


    You''ll be able to use the concepts you''ve learned in your day-to-day work, which
    is the whole point of going deep into the concepts of a programming language.


    To produce highly maintainable Java code you have to use the most suitable features
    of the language. Then bugs have a very hard time doing. This increases the satisfaction
    of developers, managers, and customers with the delivered product, bringing more
    profit to the company. Everyone wins.


    It''s definitely worth to invest time in a deep dive into the Java language, and
    that''s exactly what this book will provide. So, what are you waiting for? Are
    you ready for all the challenges? How many of them can you get? Are you prepared
    to take your Java skills to a whole new level?


    # #1.2 Why Java?


    Java is the world''s most popular programming language, and a developer who knows
    Java will rarely be unemployed. Many companies opt to use this language to making
    new developers an easier task—its popularity means it''s easier to find professionals
    who know Java.'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    Reliability, maturity, and robustness are the essence of the language, and companies
    of all sizes choose Java because of those qualities.


    Java also has a large ecosystem of open source projects that help programmers
    with their day-to-day development, many of which are free.


    With Java it''s possible to create original, structured code with reliable unit
    tests that help developers build robust software''s resistant against bugs.


    # 1.3 What kinds of concepts are in this book?


    You will learn about core concepts from the Java language that will be useful
    in your day-to-day work. The book covers crucial concepts such as polymorphism,
    encapsulation, overloading, inheritance, composition, exceptions, Optionals, generics,
    concurrency, equals and hashCode, collections, streams, functional programming
    with lambdas and method references, and the main concepts of the newest Java versions
    (this book will be updated from time to time).


    It makes a big difference if a Java developer really understands these concepts,
    and that''s why they are explored in this book.


    # 1.4 Who is this book for?


    Java Challengers is aimed at developers who want to create high-quality code in
    their day-to-day work. With a consolidated knowledge of the core concepts you
    will be able to use the full power of Java, applying the most suitable features
    to the situations you are facing.


    Developers who like solving challenging puzzles will also enjoy the book—the challenges
    aren''t easy, but they are fun.


    You don''t have to be an experienced developer to get value out of this book.
    Developers who have at least some knowledge of the basics of programming logic
    and algorithms should be able to understand the book, familiarity with object-oriented
    programming is also recommended.


    # 1.4.1 Who is this book not for?


    Java Challengers covers most of the core certification content, but this book
    is not focused on certification. You if your goal is Java certification you can
    get extra material such as mock exams, check tutorials, articles, or other books.
    It''s actually a good to mix your learning sources, learn much better a subject
    when reading, listening, watching and doing something useful with the learned
    concepts.


    This also may not be the right book for developers who are looking for a general
    introduction but aren''t focused on creating high-quality code and becoming experts.
    The point of going deep into'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Introduction


    Java concepts is to give developers the power to use the full capabilities of
    Java by applying the most suitable features of the language to the problem at
    hand.


    Finally, developers who just want to write "code that works" without going any
    deeper shouldn''t read this book.


    # 1.4.2 What is covered in the book?


    Many features that are infrequently used in real projects have not been included
    in this book. For example, the Java JDBC (Database library) are not discussed
    because it''s likely that in a real project you will be using some persistence
    framework (a set of libraries that facilitates day-to-day work with a predefined
    and simpler structure) such as Hibernate, Spring Data, or others.


    Instead, core features of Java are explored in a way that they can be totally
    absorbed and used as best as possible. Reinventing the wheel is one of the worst
    things that can happen in software development. If you know the core features
    of Java well, you won''t take the risk of using the wrong feature to solve a problem.
    You will be using Java masterfully.


    # 1.5 What are the Java Challenges?


    The Java challenges are coding puzzles that require you to know the relevant Java
    concepts very well. Most of the challenges include the main method, and your goal
    is to guess what will happen when running the code.


    The code challenges are carefully designed to explore the most important Java
    concepts that will make a difference in your day-to-day work as a Java developer.
    Many of them feature well-known shows and characters, and expect to see free class/method/variable
    names.


    If you get the challenges, right will be great! But not, don''t get frustrated;
    try to understand why, and eventually you will absorb the concepts. The point
    of the book is to deepen your understanding of Java by having fun with the challenges.


    You will also find a real-world challenge at the end of each chapter which will
    get you better prepared for applying solutions to problems you might face in real
    projects. These will help you with interview problem-solving questions you.


    The real-world challenge will usually be a situation where you must apply the
    concepts learned in the chapter to solve a common problem. Many of them involve
    established design patterns and unit tests, and solutions are available so you
    can check if your code is correct.


    # 1.6 Disclaimer about the Java Challenges


    The intention of the Java challenges is to test your understanding of the concepts
    explained throughout the book, don''t expect clean code in each challenge. Instead,
    see the challenges as a way to fix the concepts in your mind and practice your
    code analyzing skills.'
