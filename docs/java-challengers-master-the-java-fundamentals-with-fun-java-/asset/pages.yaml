  md: "8 Exceptions\n\n191\n\n15 }\n\n16 }\n\nKnowing how to use the keywords throw\
    \ and throws make a great difference in code. Remember throws will be used in\
    \ a method signature and throw will be used directly in code logic.\n\n# 8.4 try,\
    \ catch, finally\n\nThere are three instructions that are crucial when dealing\
    \ with exceptions: try, catch, and finally.\nThe try block should be used to define\
    \ the logic that some exception or error might happen.\nThe catch block is where\
    \ you provide code to handle the exception. This code is executed only if an exception\
    \ of the specified type is thrown. You can include whatever logic is appropriate\
    \ here, but typically the stack trace is printed so it is easier to sort and take\
    \ care of it. You can more than one catch block to handle different exceptions,\
    \ as you'll see later in this chapter, or you can skip this clause and go to the\
    \ finally block.\n\nThe finally block is always executed when the try block exits,\
    \ as long as it exits normally. If an exception is thrown that's handled by a\
    \ catch clause, it executes after block has finished executing.\n\nAn exception\
    \ to this rule is true if the catch block invokes the System.exit() method. In\
    \ this case, the finally block will not be executed.\n\nIncluding a finally block\
    \ is also optional, but it's a good place to perform cleanup or any other actions\
    \ that you want to take place, regardless of whether any exceptions are thrown.\n\
    \nLet's look at a practical example with try, catch, and finally. Here, we're\
    \ executing simple logic in the try block and forcing a NullPointerException to\
    \ be thrown because remoteControl variable is null and we're trying to use the\
    \ equals methods. The NullPointerException will be caught in the catch block and\
    \ at the end the finally will be executed even though there was an exception:\n\
    \n```\n1 public class PokerWithTheJoker {\n2 \n3 public static void main(String...\
