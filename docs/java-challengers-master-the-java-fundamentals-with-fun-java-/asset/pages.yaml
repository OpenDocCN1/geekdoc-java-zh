    comments in real-world projects. Sometimes comments are overused and make code
    confusing, but in general they are still useful.


    The simplest way to comment code is by using //, which tells the JVM (Java virtual
    machine) compiler to ignore everything that follows up to the end of the line.
    Let’s look at an example:


    ```

