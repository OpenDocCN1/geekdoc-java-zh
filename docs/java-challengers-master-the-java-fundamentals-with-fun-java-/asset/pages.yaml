  md: 'An array in any programming language has to pre-allocated size in memory. Since
    behind the scenes in the ArrayList we use the type Object[] elementData, we also
    have to have an initial capacity. In the case of ArrayList, the DEFAULT_CAPACITY
    is used. Therefore, whenever you add elements than the array''s capacity, a new
    array with the double of the capacity will be created since it''s not possible
    to change an array''s capacity.


    To add elements in an array while the defined capacity is not reached is quick
    but when the capacity is reached it''s necessary to copy the existing array elements
    into a new array which makes it a bit slow.


    ArrayList is not synchronized, which means that it''s not safe to use in a multi-thread
    environment because you might have data collision. However, because ArrayList
    is not synchronized, it''s also more performant.


    # 12.3.1 Time Complexity with ArrayList (Big-O Notation)


    In programming and algorithms, there is the concept of time-complexity we can
    understand how performant is our algorithms.


    We won''t go in much details about what Big-O notation but we will address what
    is the complexity of each Collection object:


    | Method | Complexity | Worst Case Scenario | Explanation |

    | --- | --- | --- | --- |

    | add() | O(1) | O(n) when a new array is created with all elements | |

    | get() | O(1) | O(1) | It''s always constant time because of how the array structure
    is defined in memory |

    | remove() | O(n) | O(n) | We have to check element by removing it |

    | indexOf() | O(n) | O(n) | Runs in linear time, checking each element |

    | contains() | O(n) | O(n) | Checks each element until finds the value |


    # 12.3.2 Immutability with ArrayList


    The concept of immutability is very important because the less point of changes
    in code, the fewer points of bugs. Bugs are stressful and make developers'' life
    miserable. To create immutable objects, this means, objects that don''t change
    state makes your application easier to handle.


    Fortunately, there are some ways to create a List that is immutable.'
