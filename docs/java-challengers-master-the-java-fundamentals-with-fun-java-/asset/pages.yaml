  md: "# 9.3.5 Method References VS Lambda\n\nWhenever possible, it's better to use\
    \ method references to avoid boilerplate code. Lambdas will be better for specific\
    \ cases where we need a bit more freedom in the code.\n\nThere are some interesting\
    \ differences between Lambdas and Method References. A very important difference\
    \ is that the constructor of a lambda is invoked the number of times the lambda\
    \ method is invoked.\n\nA method reference constructor is invoked only once when\
    \ we assign the method reference to a variable.\n\nLet's see a code example about\
    \ this:\n\n```\nclass Morpheus {\n    public Morpheus() {\n        System.out.println(\"\
    Free your mind\");\n    }\n\n    public String learnKungFu() {\n        return\
    \ \"Downloaded Kung Fu\";\n    }\n}\n\nSupplier methodReferenceSupplier = new\
    \ Morpheus()::learnKungFu();\n```\n\nThe output will be:\n**Free your mind**\n\
    \nIf we use lambda instead:\nSupplier lambdaSupplier = () -> new Morpheus().learnKungFu();\n\
    \nThere will be no output. This happens because lambdas are lazy by essence. Therefore,\
    \ the Morpheus constructor will be invoked only if we execute the following code:\n\
    lambdaSupplier.get();\n\nThen the output will be:\n**Free your mind**\n\nThere\
    \ are also a few caveats about this difference:\n\n+   * If we invoke the get\
    \ method with lambdas more times, the constructor will be invoked again\n* If\
    \ we invoke the get method with method reference times the constructor will not\
    \ be invoked again\n* If we use a constructor method reference, the constructor\
    \ won't be invoked\n\nNow that we explored the differences between lambdas and\
    \ method references, it's time for action!"
