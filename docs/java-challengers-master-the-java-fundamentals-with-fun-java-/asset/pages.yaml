  md: '# 17 Next Steps


    +   - You can be a recruiter (be aware that they might give you accurate information
    since they will potentially negotiate with you)

    - You can take a look at http://glassdoor.com*¹⁴ (Keep in mind that the salaries
    there are not accurate - it''s in average from 20% - 40% less than the real salary)

    - You can check the https://www.levels.fyi* website to be aware of how much the
    big companies such as Google, Amazon, Microsoft are paying.

    - You can use brute force by giving a number to the company or recruiter. If they
    accept it or otherwise, you will know that the salary you asked is unrealistic.


    Once you know how to ask, then it''s time to start the negotiation process. One
    very important rule is to not disclose your current salary information.


    This is more important when you know that your salary is low. That''s even if
    you know you are being underpaid the company you are negotiating with won''t care
    about it.


    What will happen is that your whole negotiation process will be based on your
    last salary. As a consequence, usually you will get something between 15% raise
    than potentially making the double of your salary.


    There are much more to go into about negotiation that''s an introduction to open
    your eyes and make you aware of how important it is. There are several books and
    I also prepared a course that has much more information about negotiation to help
    you get a much better salary!


