  md: '# 6.1 When to use inheritance


    Inheritance can be massively beneficial when used in the right way—and massively
    problematic when used in the wrong way. It generates a high level of coupling,
    which means any changes in the parent class''s code may become a nightmare. It’s
    important, therefore, not to overuse inheritance in your code.


    How can you tell whether inheritance will be beneficial in your code? Ask yourself
    whether there is an-relationship between the class you are creating and the one
    you want to inherit from. The answer to this question is no, it’s not a good idea
    to use inheritance.


    Good examples of inheritance include:


    ```

    1 Car inherits from Vehicle (a Car is a Vehicle)

    2 Dog inherits from Animal (a Dog is an Animal)

    3 Gold inherits from Metal (Gold is a Metal)

    ```


    Conversely, an inappropriate use of inheritance would be for Dog to inherit from
    Cat: it wouldn’t make sense to say "Dog is a Cat."


    Inheritance in Java is declared by using the extends keyword in the subclass’s
    definition.


    ```

    1 public class Car extends Vehicle {

    2 ...

    3 }

    ```


    It works the same way with both concrete classes and abstract classes, which are
    classes that cannot be instantiated. The Java API uses these extensively to encapsulate
    functionality and state. We’ll look at abstract classes in depth later in this
    chapter.


    # 6.1.1 Overriding inherited methods


    One of the most powerful inheritance provides is the ability to override a behavior
    from the specialized parent class. A parent class can have a default behavior,
    and the child classes can have specialized behavior appropriate to them. This
    concept of having similar classes that are related to a parent class through inheritance
    is known as polymorphism.


    The following code demonstrates polymorphism and method overriding with the generic
    class Hero and the specialized classes SpiderMan and Wolverine that inherit from
    and extend it. If you can figure out why executing the HeroExecutor class’s main
    method produces the results it does:'
