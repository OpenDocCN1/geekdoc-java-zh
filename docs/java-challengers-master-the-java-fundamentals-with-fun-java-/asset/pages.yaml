  md: "# 5 Overloading\n\n```\n1 Integer matrixInt = 7;\n2 int newMatrixInt = matrixInt;\n\
    ```\n\nThe JVM will create this code behind the scenes:\n\n```\n1 Integer matrixInt\
    \ = 7;\n2 int newMatrixInt = matrixInt.intValue();\n```\n\n# 5.2.1 Things to be\
    \ aware of when using wrappers\n\nAll wrapper objects are final, which means they\
    \ are immutable—their attributes cannot be changed. Each time you assign a value\
    \ to a wrapper type, the JVM will create a new wrapper object. This applies to\
    \ autoboxing too: the JVM will create a new object in the memory heap every time,\
    \ unless the wrapper type is cached.\n\nCaching allows the boolean values true\
    \ and integer values in the range -128 to 127. For performance reasons, we autobox\
    \ an int type with a value in this range to the wrapper type, the JVM will cache\
    \ this value in the created instance. The same applies to autoboxing of byte,\
    \ short, long, and char types (in the range \0 to \x7Ff, or 0 to 127). If we assign\
    \ a value that is cached, a new object will not be created. Note that this occurs\
    \ only when autoboxing, not when we use an explicit constructor to convert a primitive\
    \ to a wrapper type.\n\nYou should also be aware that you can't directly assign\
    \ one type to another, which makes sense because there is no direct relationship\
    \ between the wrapper classes. Let's look at a few examples of these classes:\n\
    \n```\n1 public final class Double extends Number\n2 implements Comparable<Double>,\
    \ Constance, ConstantDesc { ... }\n```\n\n```\n3 public final class Integer extends\
    \ Number\n4 implements Comparable<Integer>, Constance, ConstantDesc { ... }\n\
    ```\n\nAs you can see, the wrappers are very similar. Even though both extend\
    \ Number (as the other numeric types), you can't assign a Double to an Integer\
    \ or any other wrapper type. Because that's of the widening rule—a type can be\
