    \n# 13.7.1 Collecting a list from a stream\n\nThe simplest way to collect data\
    \ in a list using streams is with the tol method. Notice that we will use the\
    \ java.util.stream.Collectors to collect the data from the streams:\n\n```\nList<String>\
    \ list = List.of(\"Atreus\", \"Athena\", \"Kratos\");\nList<String> newList =\
    \ list.stream().filter(e -> e.startsWith(\"At\\n      .collect(Collectors.toList());\n\
    System.out.println(newList);\n```\n\nOutput:\n[Atreus, Athena]\n\nIf we don't\
    \ want anyone to make a change in the collected list, we can use the Collectors.toUnList()\
    \ method. If we try to add, change or remove an element from newList we will get\
    \ an UnsupportedOperationException:\n\n```\nList<String> list = List.of(\"Atreus\"\
    , \"Athena\", \"Kratos\");\nList<String> newList = list.stream().filter(e -> e.startsWith(\"\
    At\n      .collect(Collectors.toUnmodifiableList());\n```\n\nnewList.add(\"Minotaur\"\
