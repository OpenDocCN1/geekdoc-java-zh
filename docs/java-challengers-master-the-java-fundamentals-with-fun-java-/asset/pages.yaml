    \ with a varargs parameter, how does the JVM choose between them if nothing is\
    \ passed in the method? In this case, it chooses the method with the most specific\
    \ signature, following the rules of type promotion. For example, int... would\
    \ be chosen over double... because int is a more specific (less wide) type.\n\
