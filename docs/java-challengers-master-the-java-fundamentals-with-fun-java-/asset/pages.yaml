    # 5.2 Wrappers and autoboxing


    As you know, in Java there are two kinds of types: objects and primitive types.
    But if you want to use a primitive type as an object? Java has special classes
    that enable that, known as wrapper classes. Each primitive type has a corresponding
    wrapper class: byte and Byte, short and Short, int and Integer, and so on.


    Converting a primitive type into an object is called boxing. Before Java 1.5,
    we were obliged to box primitive types into wrapper types manually:


    ```

    int primitiveInt = 7;

    Integer matrixInt = new Integer(primitiveInt);

    ```


    Fortunately, since Java 1.5 we don''t need to do that anymore. We can just assign
    the primitive type directly into the wrapper type:


    ```

    int primitiveInt = 7;

    Integer matrixInt = primitiveInt;

    ```


    This feature in Java is called autoboxing. The JVM does the work for us, which
    is great because it means our code is cleaner and more concise. This is what happens
    behind the scenes:


    Integer matrixInt = Integer.valueOf(primitiveInt);


    Auto-unboxing—converting in the other direction—works in the same way. We can
    write code like this:'
