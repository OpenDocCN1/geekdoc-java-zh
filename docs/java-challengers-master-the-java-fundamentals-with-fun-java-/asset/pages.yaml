    # Output:


    Notice in the code that we have a ConcurrentModificationException when trying
    to remove an element from the HashMap in a loop. This happens because of a fail-fast
    mechanism of this class attempting to avoid tricky data collisions. This means
    when the structure from the HashMap is modified within a loop, it''s very likely
    that the ConcurrentModificationException will be thrown.


    It''s also not possible to rely on the ConcurrentModificationException because
    it might not be thrown sometimes.


    Now, if we want to guarantee that the ConcurrentModificationException will not
    be thrown, we can use the ConcurrentHashMap class:


