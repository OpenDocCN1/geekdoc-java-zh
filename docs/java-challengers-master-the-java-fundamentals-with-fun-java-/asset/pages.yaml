  md: '# 4.5 Encapsulation Patterns


    There are many important patterns that make good use of the encapsulation concept.
    Those patterns help to reduce coupling (how much classes know about each other)
    and enhance cohesion (how specialized is the class).


    Let''s explore some of the main encapsulation concepts so that we can also learn
    how to create encapsulated code.


    # 4.5.1 The MVC Architectural Pattern


    The MVC pattern divides the code into three layers, Model which is the layer where
    there is the business data class, we can also say model class or every domain
    class. The View layer that is the frontend application which will have the user
    interface where the user will be to interact with the system. Finally there is
    the Controller layer that is an intermediate between the View and Model layers
    which will orchestrate invocations.


    Let''s analyze the following diagram to make the MVC pattern clear:


    ![](img/c2b069349d2beea50fd38761530a70de_92_0.png)


    As you can see in the diagram above, we are using the MVC pattern that basically
    separates the application by different layers.'
