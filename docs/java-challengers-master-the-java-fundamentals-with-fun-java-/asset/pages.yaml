    Let''s now see the method. This method joins two conditions and both of them have
    to be fulfilled.


    ```

    Predicate<String> isYodaJedi = (jedi) -> jedi.equals("Yoda"); // #A

    Predicate<String> isObiWanJedi = (jedi) -> jedi.equals("ObiWan");

    Predicate<String> isJedi = isYodaJedi.and(isObiWanJedi); // #B

    System.out.println(isJedi.test("Yoda")); // #C

    ```


    Output:

    false


    Explanation:


    +   * #A: We prepare Predicate conditions.

    * #B: We join both Predicate conditions with and.

    * #C: We use the jedi Predicate that will check the condition from Yoda and ObiWan.
    Since we are passing only Yoda to the test method, both conditions will be fulfilled.
    Therefore, the output will be false.


    # Using or with Predicate


    There is also the ''or'' method that operates like the || operator in condition:


    ```

    Predicate<String> isYodaJedi = (jedi) -> jedi.equals("Yoda");

    Predicate<String> isObiWanJedi = (jedi) -> jedi.equals("ObiWan");

    Predicate<String> isJedi = isYodaJedi.or(isObiWanJedi); // #A

    System.out.println(isJedi.test("Yoda")); // #B

    ```


    Output:

    true


    Explanation:


    +   * #A: Notice that here we are using the or operator.

    * #B: Then we send Yoda to be tested, and since one of the conditions is true,
    the final result will be true.


