  md: '# 14.2.1 Java file is l= than a Module


    Even though we can add jars to the classpath of a Java application, this doesn''t
    make it a module.


    With modules from Java 9, we can have real control over packages or allow what
    module can use it. We can import a module, export a package, allow reflection
    access to `private` members of the module to a specific module if needed.


    There are build automation tools such as Maven and Gradle but they don''t really
    solve the problem of having internal control to enable or disable access from
    specific packages in the Java code. Those are tools built on top of Java, therefore,
    they don''t give us granular control to export or import code within a Java application.


    # 14.3 JDK Base Modules


    The JDK was a big monolith prior to the Java 9 version. It was difficult to add
    new features that were. To simplify and break the JDK into smaller pieces, now
    we have many cohesive modules that enables us to have only the modules we use
    in our application.


    The java.base modules is the essential one that contains the most used Java classes.
    When downloading the JDK, it''s possible to see what classes are used in each
    Java module. Notice that there is a compressed file named `src` in the following
    folder in Java 17 (the path may vary depending on the JDK version you download):


    On MacOS:


    Java/JavaVirtualMachines/17.0.1/Contents/Home/lib


