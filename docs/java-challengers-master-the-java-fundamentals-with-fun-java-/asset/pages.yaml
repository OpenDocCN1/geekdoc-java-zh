    # 12.7.5 Comparator with Lambdas


    In the code above, you probably noticed that using an anonymous inner class with
    the Comparator is very verbose.


    Comparator is a functional interface though:


    ```

    @FunctionalInterface

    public interface Comparator<T> { ... }

    ```


    That we can use sort() to make the code much simpler with the effect:

    heroes.sort((o1, o2) -> o1.name.compareTo(o2.name));

    We reduced the code of six to one line! That''s the power of lambdas in Java.

    But we can make it better, we can use the helper comparing method from Comparator:


    ```

    public static <T, U extends Comparable<? super U>> Comparator<T> comparing(

    Function<? super T, extends U> keyExtractor)

    { ... }

    ```


    The code gets even shorter:

    heroes.sort(Comparator.comparing(o -> o.name));

    An important detail to when using a lambda is that if you have a null field value,
    you will get a NullPointerException. Therefore, you will have to handle this edge-case
    scenario.


    # 12.7.6 Handling null Values with Comparator


    If we want to handle null values with Comparator, there is the Comparator.nullsFirst
    method for that:


    ```

    Comparator<HeroNullValue> employeeNameComparator

    = Comparator.comparing(HeroNullValue::getName)

    Comparator.nullsFirst(String::compareTo);

    ```


    By using the above code, we can pass a null value to the field we are comparing
    and avoid a NullPointerException.'
