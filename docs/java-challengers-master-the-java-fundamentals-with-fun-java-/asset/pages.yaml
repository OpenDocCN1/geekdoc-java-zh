    # 12.10 LinkedHashSet


    What if we want to work with unique and ordered elements? Then we can use the
    LinkedHashSet implementation.


    To talk details, the LinkedHashSet documentation says that the performance is
    likely to be bit below LinkedHashSet because the added expense of a LinkedList.
    There is one exception though, iteration over a LinkedHashSet requires time proportional
    to the size of a set regardless of its capacity.


    Iteration over a HashSet is likely to be more expensive, requiring time proportional
    to its capacity.


    A linked set has two parameters that affect its performance: initial capacity
    and load factor. They are defined precisely as for HashSet.


    LinkedHashSet is also not synchronized, therefore thread synchronization must
    be done manually. It''s also possible to wrap the LinkedHashSet with Collections.synchronizedSet
    to make thread-safe.


    Note that LinkedHashSet extends HashSet:'
