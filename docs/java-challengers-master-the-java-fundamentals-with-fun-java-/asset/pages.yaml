    # 9.3 Method Reference


    When we use the master of method references, we can make the code a lot cleaner
    and readable. The idea of method reference is a syntax sugar that reduces boiler-plate
    code.


    There are four kinds of method references:


    +   * Reference to a static method

    * Reference to an instance method

    * Reference to an instance method

    * Reference to a constructor


    # 9.3.1 Reference to a static method


    Let''s get started with the static method reference. We can explore the famous
    String.valueOf static method. Notice that the valueOf method fits into a Function
    because a Function receives one parameter and returns one value. That''s exactly
    the contract of the valueOf Method:


    ```

    public static String valueOf(Object obj)

    Therefore, let''s assign our method reference to a Function:

    Function<Object, String> valueFunction = String::valueOf;

    System.out.println(valueFunction.apply(7));

    ```


    The output will be:


    ""


    We could use a lambda expression in the case above:


    ```

    Function<Object, String> valueFunction = o -> String.valueOf(o);

    System.out.println(valueFunction.apply(7));

    ```


    The output will be the same:


    ""'
