    true


    Note that the Optional.of method can throw a NullPointerException if a null value
    is passed to it:


    ```

    1 String snakeEaterOps = null;

    2 Optional<String> optSnakeEaterOps = Optional.of(snakeEaterOps);

    ```


    The above method will throw:'
