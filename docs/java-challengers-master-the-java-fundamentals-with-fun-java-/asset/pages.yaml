  md: '# 2.1.4 Primitive types


    As mentioned previously, it is possible to store and manipulate characters, numbers,
    and binary values such as true and false with the variety of primitive variable
    types defined in Java. The eight primitives are listed in table 2.1. The table
    contains the following information:


    +   - Type: The variable type, defined by the size of the allocated space in memory
    and data structure (for example, if it''s text or numbers).

    - Range: The range of values that can be used for the variable type.


    Default instance value—the default value of the variable when no value is assigned
    to upon creation of a new instance. We will explore instances in the next chapter.


    +   - Size: The size that will be allocated in memory for the variable type.


    Example literals—Examples of values that can be used in this type variable.


    | Type | Range | Default value | Size |

    | --- | --- | --- | --- |

    | boolean | true or false | false | 1 bit | true, |

    | byte | -128 to 127 | 0 | 8 bits | 1-, 90, 128 |

    | char | Unicode character or 0 to 65,536 | \u0000 | 16 bits | ''a'', ''\u0031'',
    ''\u201'', ''\n'', 4 |

    | short | -32,768 to 32,767 | 0 | 16 bits | 1, 3, 720, 2200 |

    | int | -2,147,483,648 to 2,147,483,647 | 0 | 32 bits | -2-, 0, 1, 9 |

    | long | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 | 0 | 64 bits
    | -4000L, -900L, 10L, -700L |

    | float | 1.40293864 x 10^-45 | 0.0 | 32 bits | 1.627e00, -1.57e-207f, -9f, 10.4F
    |

    | double | -1.7976931348623157 to 1.7976931348623157 | 0.0 | 64 bits | 1.e700d,
    -123457e, 37e11 |


    # 2.1.4 The primitive variable types defined in Java


    Note that the primitive types in Java can never have the null value; if you don''t
    assign them a value when you create them the JVM will assign them the default
    value listed in this table. This will only happen with an instance variable, a
    concept we will explore more deeply in future chapters. As you''ll see later in
    this chapter, local variables are not assigned default values if one is not provided;
    you must assign them before use them, or your code will not compile.'
