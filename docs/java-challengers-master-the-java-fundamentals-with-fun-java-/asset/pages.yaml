  md: '# 8 Exceptions


    This chapter covers:


    +   - Understanding the difference between checked and unchecked exceptions and
    when to use each type

    - Using the stack trace to identify the root cause of an error

    - Handling and declaring checked exceptions in your code

    - Using the try, catch, finally throw effectively

    - Closing Java resources effectively by using the try-with-resources statement

    - Catching multiple exceptions in a single catch block

    - Creating customized exceptions that make sense for the application

    - Using the "throw early, catch later" principle for code quality

    - Total of 4 Java Code Challenges


    Exceptions—unwanted or unexpected events that arise during execution of a program,
    disrupting the normal flow of the program’s instructions—are one of the most important
    concepts to master Java. As a developer, you''ll need to handle them on a daily
    basis. When exceptions are handled in the wrong way, bugs are able to hide more
    easily. This causes developers a lot of stress, so it''s crucial to understand
    how to use exceptions effectively.


    It''s common to see exceptions that won''t help developers when errors occur—for
    example, generic exceptions with poor log messages. Understanding the key concepts
    of exceptions and which types of exceptions are most suitable to use in different
    situations will make all the difference in the software you develop. Successfully
    absorbing the contents of this chapter will be a huge help to the professional
    Java developer who wants to deliver high-quality code.


    # 8.1 Checked and unchecked exceptions


    There are two main types of exceptions: checked and unchecked. Understanding the
    difference between them is crucial for handling exceptions effectively.


    When we want a class to always handle or declare an exception, we should use a
    checked exception. These are conditions that are checked at compile time, so they
    can be handled and the program can continue executing. When we don''t want the
    application to recover or handle the exception, we should use an unchecked exception.
    These are conditions that are checked at runtime and are usually conditions that
    are outside the control of the program and cause execution to stop.'
