  md: '# 1 Introduction


    The better you are able to analyze code, the faster and sharper programmer you
    will become. These exercises will enable and empower you to produce flexible and
    meaningful code using the most appropriate Java concepts. The more features and
    concepts from Java you master, the better you will be able to track down bugs
    and fix them efficiently. In addition, you will be able to produce highly optimized
    solutions for many different situations.


    # 1.6.1 Running a java application without a class and main method


    As of Java 9, you don''t need to create a class or a main method for simple code
    tests. You can use the command line with jshell. It''s a powerful tool when you
    want to run something quickly to test syntax or code. You can implement the code
    examples in this book using jshell if you wish.


    Make sure you have Java 9 or installed on your machine by running the following
    command on your command terminal:


    ```

