    The Optional class helps Java developers to avoid the annoying NullPointerException
    when used correctly. It also helps developers to create more readable code with
    less. Instead of using null checks, we can create elegant code using Optional
    and achieve more.


    According to the [Optional class documentation](https://docs.oracle.com/en/java/javase/16/docs/api/java.base/Optional)


    Optional is primarily intended for use as a method return type where there is
    a clear need to represent "no result", and where using null is likely to cause
    errors.


    # ## 10.1 Wrapping a value into Optional


