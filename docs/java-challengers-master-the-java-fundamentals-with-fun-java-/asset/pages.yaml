  md: '# 14 Newest Features of Java


    Another important concept regarding the new releases of Java is now that we have
    preview features

    and standard features:


    +   - preview: since a new Java versions are now released every 6 months it''s
    more difficult to add

    new features as standard. Therefore, features added to Java will usually be considered
    preview.

    Simply put, preview feature is a feature that might be changed in next releases,
    this means

    that, it''s not a good idea to use a preview feature in example.

    - standard: when a feature is standard, this means there are no plans to change
    a keyword or

    anything like that. Therefore, it can be safely used in production.


    Finally, to make a decision feature for Java version use it''s very important
    to choose a long-

    term support one because of the security patches and support Java vendors provide.
    That''s

    because you won''t need to change the Java version every 6 months.


    # 14.2 Introduction to Modules


    The very important feature Jigsaw or JPMS (Java Platform Module System) was introduced
    in Java

    9! Put simply, it''s basically the concept of modules and now the concept is called
    as Java modules

    which is more concise and simple.


    To build a light-weight application and have real encapsulation in a Java application,
    the use of

    is is crucial. Why real encapsulation? That''s because with modules it''s possible
    to restrict the

    from only the packages we want to expose. Other than that it''s also possible
    to restrict reflection

    access from private members.


    With modules, it''s also possible to explicitly declare what is being exposed
    and what is being used

    from other modules so that the application is easier to maintain. The reason is
    simple, the more we

    restrict code that shouldn''t be exposed the control we gain over the code.


    Before Java 9 the source code was a big monolith making it difficult to maintain
    or add features.

    With the modules feature, the JDK was broken into modules so that it''s easier
    to scale Java with

    new features.


    Besides that, we can make our own Java application modularized. Therefore, we
    don''t need

    u use the Java ecosystem for every Java project and we can control what code will
    be

    exposed to other modules.


    Before modules, we had a huge classpath file where we would organize all dependencies
    in a Java

    project. The classpath is usually daunting and confusing for big Java applications.
    There is no need

    u use classpath anymore when working with modules.


    To explain modules concisely, we can think it''s like to share multiple packages
    in an organized

    controlled way. This will be clearer in the next sections of this chapter.'
