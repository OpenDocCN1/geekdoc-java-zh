  md: "That happens because the ArrayList, Vector, or LinkedList have a fail-fast\
    \ mechanism that will prevent data collision when multiple threads are accessing\
    \ the same Iterator. Instead of taking the risk of causing a bug very difficult\
    \ to identify, the JDK code will throw ConcurrentModificationException to defensive.\n\
    \nTherefore when we try to add or remove elements with one of the above mentioned\
    \ implementations when iterating elements we will get this ConcurrentModificationException.\n\
    \nLet's see what happens if we try to remove an element from an ArrayList first:\n\
    \n```\nimport java.util.ArrayList;\nimport java.util.List;\n\npublic class RemoveElement\
    \ {\n    public static void main(String[] args) {\n        List<String> villains\
    \ = new ArrayList<>();\n        villains.add(\"Joker\");\n        villains.add(\"\
    Magneto\");\n        villains.add(\"Venom\");\n\n        var villainToRemove =\
    \ \"Venom\";\n\n        for (String eachVillain : villains) {\n            if\
    \ (eachVillain.equals(villainToRemove)) {\n                villains.remove(villainToRemove);\n\
    \            }\n        }\n\n        System.out.println(villains);\n    }\n}\n\
    ```\n\nOutput:\nException in thread \"main\" java.util.ConcurrentModificationException\n\
    The same would happen if we instantiate our List with a Vector, LinkedList. Therefore,\
    \ we should avoid the above if we are using any of those List implementations.\n\
    \n# 12.6.1 Preventing ConcurrentModificationException with CopyOnWriteArrayList\n\
    \nCopyOnWriteArrayList completely avoids thread collisions because every mutable\
    \ operation such as (add, set, and others) it will make a fresh copy of the underlying\
    \ array. Therefore it's impossible to get a ConcurrentModificationException when\
    \ using CopyOnWriteArrayList:"
