  md: "# Where and When to Use the Singleton Pattern | 45\n\n```\npublic class CacheSingletonBean\
    \ {\n\n  private Map<Integer, String> myCache;\n\n  @EJB\n  LoggingBean loggingBean;\n\
    \n  @PostConstruct\n  public void start() {\n    loggingBean.logInfo(\"Started!\"\
    );\n    myCache = new HashMap<Integer, String>();\n  }\n\n  @Timeout(value=30,\
    \ unit=TimeUnit.SECONDS)\n  @Lock(LockType.WRITE)\n  public void addUser(Integer\
    \ id, String name) {\n    myCache.put(id, name);\n  }\n\n  @Lock(LockType.READ)\n\
    \  public String getName(Integer id) {\n    return myCache.get(id);\n  }\n}\n\
    ```\n\nThe @Timeout annotation can have TimeUnit constants, such as NANOSECONDS,\
    \ MICROSECONDS, MILLISECONDS, and SECONDS. If no TimeUnit value is given, it is\
    \ interpreted as milliseconds by default. You can also place this annotation on\
    \ the class level and apply to all methods that do explicitly define an access\
    \ timeout annotation.\n\n# WHERE AND WHEN TO USE THE SINGLETON PATTERN\n\nAs a\
    \ rule of thumb, heavy use of singletons may be a sign of misuse. You should use\
    \ singletons where it makes sense, such as caching frequently accessed but expensive-to-load\
    \ data, sharing data for global access, or using single point of contact purposes\
    \ (such as logging).\n\nCreating and unnecessary resources has a negative impact\
    \ on memory, CPU resources, and initial startup, so handles when using them for\
    \ caching data. However, singletons can be quite handy and can be configured in\
    \ a Java EE container. For serious caching solutions, consider a framework as\
    \ the widely used Ehcache (http://www.ehcache.org/) or a distributed caching system\
    \ Java Caching System (http://commons.apache.org/proper/commons-jcs/).\n\nYou\
    \ can use a singleton to access to back-end systems that are not thread safe or\
    \ have licensing issues. Using the LockType.WRITE annotation on methods allows\
    \ sequential access to such systems where multiple concurrent access would cause\
    \ problems with performance or licensing.\n\nwww.it-ebooks.info"
