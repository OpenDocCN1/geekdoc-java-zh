  md: '# 166 | CHAPTER 13 RESTFUL WEB SERVICES


    not have a World Wide Web Consortium (W3C) standard. It is a set of conventions,
    styles, and approaches that have been agreed upon over time and by convention.


    The term REST was coined by Roy Fielding in his 200 doctoral dissertation titled
    “Architectural Styles and the Design of Network-Based Software Architectures.\^1
    Since then, the REST concept has been widely adopted by developers and architects
    that it has become an integral part of many languages and frameworks. For example,
    Ruby provides a natural way to use REST routes, and the Spring framework provides
    a simplified way to implement Hypermedia As The Engine Of Application State (HATEOS),
    which is level 3 of the Richardson Maturity Model of REST restful (more on this
    later).\^2


    REST is usually referred to as an architectural approach near a design pattern.
    However, REST was developed against common problems faced in enterprise app, which
    is the same idea behind the design patterns.


    # WHAT IS REST?


    REST means many things to people, and discussions can become quite theoretical.
    This chapter discusses it from the perspective of a developer who wants to implement
    a RESTful application programming interface (API) for a forum site discovering
    movies.


    > IN THE WORDS OF ROY FIELDING


    REST emphasizes scalability of component interactions, generality of interfaces,
    independent deployment of components, and intermediary components to reduce interaction
    latency, enforce security, and encapsulate legacy systems.


    The most practical way of thinking about REST is a style for formatting URIs that
    represents resources (data) application can provide resources and that it can
    store. What is meant by resources? In a website, you have many resources, such
    as the site''s and the users'' posts. These resources are represented as nouns
    and combined with an HTTP method to form a RESTful uniform resource identifier
    (URI). For example, you can access an account resource with the URI /accounts
    and combine with the HTTP GET method that this URI would return all accounts.
    Likewise, you can identify an account resource by appending the post''s ID to
    the URI like: /accounts/id. A GET request to this URI returns the details of the
    account with the ID. Not only can you get resources by using a RESTful URI, but
    you can create resources. To create a new account resource, you would send a POST
    to the URI /accounts with a payload in the HTTP body containing the data necessary
    to create the resource.


    As you have gathered, a URI represents a resource on a remote server, and the
    method of requesting resources (the HTTP method) implies certain actions (CRUD)
    actions (for example, POST to Create and GET to Read).\^1 However, this is not
    in the spirit of REST and not


