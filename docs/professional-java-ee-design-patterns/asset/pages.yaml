  md: "# IMPLEMENTING THE FACTORY PATTERN IN JAVA EE\n\nThe factory pattern is not\
    \ tricky to implement, as you have seen in the preceding examples. Java EE offers\
    \ a simple and elegant way to implement the factory pattern via annotations and\
    \ dependency injection. In the Java EE world, you use the @Produces annotation\
    \ to create an object, and you use @Inject to create the injected object (or resource)\
    \ where it's required. The simplest implementation in Java EE of the factory method\
    \ follows in Listing 6-10.\n\nLISTING 6-10: Simple implementation of the factory\
    \ method using producer methods\n\n```\npackage com.devchronicles.producer;\n\
    import javax.enterprise.inject.Produces;\n\npublic class EventProducer {\n\n \
    \   @Produces\n    public String getMessage() {\n        return \"Hello World\"\
    ;\n    }\n}\n```\n\nThe getMessage method is annotated with @Produces and results\
    \ in String objects containing the text Hello. Although the type produced this\
    \ is a string, you can produce anything you need, including interfaces, classes,\
    \ primitive data types, Java array types, and core Java types.\n\nTo use the produced\
    \ object, you need to inject the same type into the class where you are going\
    \ to use it, as demonstrated in Listing 6-11.\n\nLISTING 6-11: Injecting a string\
    \ type by the factory\n\n```\npackage com.devchronicles.Stateless;\n\nimport javax.ejb.Stateless;\n\
    import javax.ejb.TransactionAttribute;\nimport javax.ejb.TransactionAttributeType;\n\
    import javax.inject.Inject;\n\n@Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\n\
    public class EventService {\n\n    @Inject\n    private String message;\n\n  \
    \  public void startService() {\n        System.out.println(\"Start service call\
    \ \" + message);\n    }\n}\n```"
  merge: -1
