  md: 'ID. On successful creation, the HTTP response is 201 (CREATED), and a link
    to the newly created resource is returned either in the Location header of the
    response or in the JSON payload of the response body. The resource representation
    may be returned which is often preferable to making an additional call to the
    API to retrieve a representation of the data that had just created. This reduces
    the chatter of the API.


    In addition to the HTTP response codes to a GET request, a POST can return 204
    (NO CONTENT) if the body of the request is empty. A well-formed URI that you might
    use in your for application could be POST users, with a request body containing
    the user''s details or POST users/123456/ to create a new post for the user 123456
    from the data in the response body.


    # PUT


    The PUT method is most used to update a known resource. The URI includes information
    to identify the resource, so as a context and identifier. The request body contains
    the updated version of the resource, and if the update is successful, it returns
    the HTTP response 200. A URI that updates a user''s information is PUT users/123456.
    Less commonly, you use the PUT method to create a resource which creates the identifier
    of the resource. However, this way of creating a resource is a little confusing.
    Why use PUT when a POST request works just as well and is commonly known? An important
    point to note about updating a resource is that the entire representation of the
    resource is passed to the service in the HTTP body request, not just the information
    that has changed.


    # DELETE


    Surprisingly, you use this method to delete a resource from a service. The URI
    contains the context and identifier of the resource. To delete a user with the
    ID 123456, you use the URI DELETE users/123456. The response body may include
    a representation of the deleted resource. A successful deletion results in a 200
    (OK) HTTP response code being returned; if the resource is not found, a 400 code
    is returned.


