  md: "CDI interceptors require one additional step of declaring the interceptors\
    \ in the beans.xml file.\nThis is one of the rare cases in which you need to use\
    \ XML configuration; it's used to determine the\nexecution order of the interceptors.\n\
    \nInterceptors CDI and EJB interceptors can include other interceptors that wrap\
    \ bindings together.\nThe CDI container is not started if the beans.xml file is\
    \ missing:\n\n```\n<beans xmlns=\"http://java.sun.com/xml/ns/javaee\"\n     xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n     xsi:schemaLocation=\"http://java.sun.com/xml/ns/javaee\n\
    \     http://java.sun.com/xml/ns/javaee/beans_1_0.xsd\">\n<interceptors>\n   \
    \ <class>com.devchronicles.interceptor.SecurityInterceptor</class>\n    <class>com.devchronicles.interceptor.SomeOtherInterceptor</class>\n\
    </interceptors>\n</beans>\n```\n\nAlthough the declaration of order of binding\
    \ annotations may imply a sequence of execution order,\nreality has no effect.\
    \ The execution order of the interceptor depends on the declaration order in the\n\
    beans.xml file.\n\nMixing CDI and EJB interceptors may create ambiguity in the\
    \ ordering. As a rule, EJB interceptors\nexecute before CDI interceptors.\n\n\
    Interacting creates complexity, but creating multiple bindings and mixing\nCDI\
    \ and EJB interceptors brings this complexity to the next level. Complex interceptor\n\
    structures may expose a complex application architecture for developers who are\
    \ not familiar\nwith the code.\n\n# WHERE AND TO USE INTERCEPTORS\n\nAOP is a\
    \ popular programming paradigm that can help implement and encapsulate cross-cutting\n\
    concerns. In many cases, AOP can really help. Logging, auditing, security, and\
    \ other repeating\nnonbusiness behavior are good candidates.\n\nInterceptors in\
    \ Java EE are powerful tools that help you implement AOP without the need for\n\
    a third-party framework. With the introduction of CDIors, Java EE has become more\n\
    complete and capable. Implementing an interceptor may require some XML configuration,\
    \ unlike\nother patterns listed in this book. The configuration is only limited\
    \ to provide ordering,\nother patterns such as decorators may also require.\n\n\
    Interceptors can address cross-cutting concerns. They provide a clean implementation\
    \ when\nencapsulating the common concern. However, interceptors can be troublesome\
    \ if they change\nbusiness behavior. If this happens, the logic is distributed\
    \ between the class and the\ninterceptor. The business method becomes unclear\
    \ and misleading because it doesn't expose\nt whole logic. Additionally, it unnecessarily\
    \ complicates the architecture and application flow.\nBesides, debugging is almost\
    \ impossible and complicated.\n\nReadability and self-documenting code is an important\
    \ aim, and misuse of interceptors can cause\ngreat harm if it consists of business\
    \ logic. However, using interceptors for nonbusiness and repeating\nbehavior can\
    \ simplify the business methods and help greatly."
