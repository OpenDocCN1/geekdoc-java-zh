    # IMPLEMENTING DI IN JAVA EE\n\nJ2EE did not offer DI out of the box until Java\
    \ EE 5. Instead, in J2EE, beans and resources were accessed using Java Naming\
    \ and Directory Interface (JNDI) lookups. This approach caused hard-wiring and\
    \ relying on a heavyweight server-based container, which made testing almost harder\
    \ than writing the actual code.\n\nWith the release of Java EE 5 and EJB 3, DI\
    \ became an integral part of the Enterprise Java platform. To get rid of XML-based\
    \ configuration, several annotations were introduced to perform injection:\n\n\
    +   > @Resource (JSR250) is for injecting data, Java Message Service (JMS), URL,\
    \ mail, and environment variables.\n> @EJB (JSR220) is for injecting EJB.\n> @WebService\
    \ is for injecting web.services.\n\nWith the release of Java EE 6, CDI, and EJB\
    \ 3.1, DI became a much more capable, and thus more, topic in Java EE.\n\nIn EJB\
    \ 3.1, an interface was no longer mandatory for EJBs. Also, a new EJB bean profile\
    \ was introduced that offered a simplified EJB container. A new and improved annotation\
    \ @Inject was introduced (JSR229 and JSR330), which also provided a common interface\
    \ for injection between other DI frameworks in the Java realm.\n\n@Inject annotation\
    \ is safe because it has a dependency on the type of the object reference. If\
