  md: '# THE EIS TIER


    The EIS consists of data storage units, often in the form of databases, but they
    can be any resource that provides data. It may be an antiquated legacy system
    or a file system.


    > NOTE The EIS is often referred to as the Data tier, Persistence tier, and Integration
    tier.


    # JAVA EE SERVERS


    As you have seen, the Middle tier hosts the Java EE server, which provides the
    Java EE functionality needed for an enterprise application.

    Java EE is based on 30 standards, called Java Specification Requests (JSRs) (http://www.oracle.com/technique/java/javaee/index.html).
    These requests go through the Java Community Process (JCP) before they become
    accepted as part of the Java EE universe. The JCP is an open process in which
    anyone can participate and give feedback on JSRs or submit their own JSR (https://www.jcp.org/en/home/index).


    These specifications are bundled together and the technologies that a server application
    must be implemented in order to claim that it is Java EE compliant.

    Additionally, Oracle requires the server applications pass the Technology Compatibility
    Kit (TCK). This is a nontrivial test suite that checks the application serves
    as the specification requirements. This ensures that if you develop your application
    following the Java EE specifications, you will be able to deploy and execute it
    on any Java EE application.


    At the time of writing, three application servers have been fully compatible with
    Java EE 7. They are GlassFish Open Source Edition 4.0 (http://glassfish.net),
    Wildfly 8.0 (http://wildfly.org), and TMAX JEUS 8 (http://tmaxsoft.com/product/jeus/certification/).
    Elevation servers are Java EE 6 compatible (http://en.wikipedia.org/wiki/Java_Platform,_Edition_EE_6_certified).


    # JAVA EE WEB PROFILE


    The EE web profile is a subset of technologies that comprise the most appropriate
    technologies required for the development of web-based enterprise applications.
    The profile reduces the size and complexity of the platform to just the technologies
    required for the development of a modern web application. The web profile is a
    complete stack stacking technologies related to workflow and core functionality
    (Servlet, presentation (JSF and JSP), business logic (EJB lite), transactions
    (JTA), persistence (JPA), the new WebSocket, and much more. It omits a lot of
    enterprise-related technologies such as the Concurrency Utilities, Java'
