  md: "# Implementing the Factory Pattern in Java EE | 71\n\nWhen you run and invoke\
    \ the start method, the string value in the producer method is injected into the\
    \ message member of EventService and printed to the console. This is the simplest\
    \ implementation of the factory pattern in Java EE. However, it raises one important\
    \ question: How does the Dependency Injection (CDI) container know that it must\
    \ inject the string produced by the getMessage method into the message member\
    \ of EventService?\n\nThe Answer: The CDI container relies on types to determine\
    \ where to inject the produced type. In this example, the product type is a string,\
    \ so it is the injected type. So it matches the produced type with the inject\
    \ type and injects it.\n\nYou might argue that in a real system, you need to produce\
    \ and inject different instances of the object type. How does the CDI container\
    \ know where to inject each produced type? It does this by using an annotation\
    \ configuration called qualifier.\n\nIn real-world projects, you probably want\
    \ to return different object types instead of a simple string so that you can\
    \ create different objects by.\n\n# LISTING 6-12: MessageA\n\n```\npackage com.devchronicles.factory;\n\
    \n@Alternative\npublic class MessageA {\n\n    private String message;\n\n   \
    \ public String getMessage() {\n        return message;\n    }\n\n    public void\
    \ setMessage(String message) {\n        this.message = message;\n    }\n}\n```\n\
    \n# LISTING 6-13: MessageB\n\n```\npackage com.devchronicles.factory;\n\n@Alternative\n\
    public class MessageB {\n\n    private String message;\n\n    public String getMessage()\
    \ {\n        return message;\n    }\n\n    public void setMessage(String message)\
    \ {\n        this.message = message;\n    }\n}\n```\n\nwww.it-ebooks.info"
  merge: -1
