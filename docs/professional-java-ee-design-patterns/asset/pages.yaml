  md: '# SUMMARY


    Design patterns are one of the most important, challenging, and useful topics
    in software. Object-oriented programmer would be complete without proper knowledge
    of common design patterns.


    Good knowledge provides a great toolkit for common problems you are likely to
    face. Java EE takes this step further and introduces a much easier and integrated
    way to use design patterns in enterprise projects. Most patterns in Java EE have
    been introduced after long debates and pain, which ensures they are well implemented
    and mature.


    All patterns described in this book rely on Java EE standards, so they are almost
    guaranteed to work successfully.


    Still, patterns are neither silver bullets nor magic wands. If they are used extensively
    without reason, they tend to overcomplicate the project. Knowing a pattern does
    not necessarily mean you have to use it unless it fits and solves a potential
    problem.


    Read and learn design patterns, and try to keep your memory fresh on where they
    fit and what problems they solve. You will save many lines of code and earn respect.


    # NOTES


    +   1. Design Patterns: Elements of Reusable Object-Oriented Software (Addison-Wesley,
    1994): Erich Gamma, Richard Helm, Ralph Johnson, John Vlissides.


    +   2. The Mythical Man-Month: Essays on Software Engineering (Addison-Wesley,
    1975): Frederick P. Brooks Jr.


    +   3. Edsger Dijkstra was a Dutch computer scientist who received the 1972 Turing
    Award for fundamental contributions to developing programming languages.


    +   4. James O. Coplin EE Patterns: Best Practices and Design Strategies (Prentice
    Hall, 2003): Deepak Alur, Dan Malks, John Crouch.


    +   5. A Java-based framework that provides many features including dependency
    injection and aspect-oriented programming.


    +   6. Head First Design Patterns (O''Reilly, 2004): Eric Freeman, Elisabeth Robson,
    Bert Bates, Kathy Sierra.


    +   7. Rod Johnson is an Australian computer programmer who created the Spring
    framework.'
