  md: "36 | CHAPTER 4 SINGLETON PATTERN\n\n# LISTING 4-2: Synchronizing the singleton\
    \ for thread safety\n\n```\npackage com.devchronicles.singleton;\n\npublic class\
    \ MySingleton {\n\n    private static MySingleton instance;\n\n    private MySingleton()\
    \ {}\n\n    public static synchronized MySingleton getInstance() {\n        if\
    \ (instance==null) {\n            instance=new MySingleton();\n        }\n   \
    \     return instance;\n    }\n}\n```\n\nAnother approach is to create the singleton\
    \ instance at the same time you load the class, as shown in Listing 4-3. This\
    \ prevents needing to synchronize the creation of the singleton instance and creates\
    \ the singleton object once the JVM has loaded all the classes (and therefore\
    \ before a class can call the getInstance() method). This occurs because static\
    \ members and blocks are executed when the class is loaded.\n\n# LISTING 4-3:\
    \ Creating the singleton object at the time of class loading\n\n```\npackage com.devchronicles.singleton;\n\
    \npublic class MySingleton {\n\n    private final MySingleton instance=new MySingleton();\n\
    \n    private MySingleton() {}\n\n    public static MySingleton getInstance()\
    \ {\n        return instance;\n    }\n}\n```\n\nAnother approach is to use a static\
    \ block, as shown in Listing 4-4. However, this leads to lazy initialization because\
    \ the static block is invoked before the constructor is called.\n\n# LISTING 4-4:\
    \ Creating the singleton object in a static block\n\n```\npackage com.devchronicles.singleton;\n\
    \npublic class MySingleton {\n\n    private static MySingleton instance=null;\n\
    \n    static {\n        instance=new MySingleton();\n    }\n}\n```\n\nwww.it-ebooks.info"
