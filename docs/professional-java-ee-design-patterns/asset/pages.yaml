  md: "The deployed WebSocket is available from ws://<host>:<port>/application>/hello.\
    \ However, a better way is to use annotation configuration. Therefore, the same\
    \ endpoint becomes Listing 15-2.\n\n# LISTING 15-2: An example of an endpoint\
    \ with annotations\n\n```\npackage com.devchronicles.websockets;\n\n@ServerEndpoint(\"\
    /hello\")\npublic class HelloEndpoint {\n\n    @OnMessage\n    public void onMessage(Session\
    \ session, String msg) {\n        try {\n            session.getBasicRemote().sendText(\"\
    Hello \" + msg);\n        } catch (IOException e) {\n        }\n    }\n}\n```\n\
    \nThis approach uses annotations and keeps up with the Plain Old Java Object (POJO)\
    \ approach because we are not extending a base class. The annotated endpoint has\
    \ the same life cycle methods as the one in Listing 15-2, but it introduces an\
    \ additional onMessage life cycle method. Rather than implementing onopen and\
    \ adding the onMessage handler, it's enough to implement an onMessage method in\
    \ the annotation-based approach. You can annotate several methods with @OnMessage\
    \ to receive different types of data, such as String or ByteBuffer for binary.\n\
    \nThe client-side implementation of WebSockets depends on the web frameworks we\
    \ use. However, a simple JavaScript script is shown in the following snippet.\n\
    \n```\nvar websocket = new WebSocket('ws://127.0.0.1:8080/websockets/hello');\n\
    websocket.send(\"world\");\n```\n\nA better example is to send a complex object\
    \ in JavaScript Notation (JSON) format, which can be marshaled to an object, in\
    \ the following code snippet.\n\n```\nvar msg = {\n    type: \"message\",\n  \
    \  text: \"World\",\n    date: Date.now()\n};\n\nwebsocket.send(JSON.stringify(msg));\n\
    websocket.onmessage = function(event) { /* Expect to receive hello world * / };\n\
    ```\n\nWebSockets are great for building web applications that need persistent\
    \ and asynchronous messaging between the client and the server. Java EE offers\
    \ an easy implementation of WebSockets. We have more configurations and implementation\
    \ options than discussed here. If we have sparked your interest in WebSockets\
    \ we suggest visiting Oracle's Java EE Tutorial, which explains in more details\
