    # WHAT ARE WEBSOCKETS?


    WebSockets might be the most interesting improvement on the web since the introduction
    of Asynchronous JavaScript And XML (AJAX). It has been popular since the emergence
    of HTML5 and is supported by many web frameworks. However, it took quite a long
    time to have a stable and compatible specification for WebSockets.'
