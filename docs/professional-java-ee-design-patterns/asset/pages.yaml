  md: '# The Emergence of Enterprise Java Patterns


    However, J2EE was not perfect. Soon, the complex structure of the platform with
    its heavy use of XML configurations created the perfect problem-ridden environment.


    The complex programming models of J2EE led many projects into deep waters. Applications
    developed with J2EE technologies to contain excessive amounts of "plumbing" code
    as JNDI lookup code, XML configuration files, and try/catch blocks that acquired
    JDBC resources. Writing and maintaining such code proved a major drain on resources
    and was the source of many bugs and performance issues. The EJB component model
    promised reduced complexity when implementing business logic, but it did not reduce
    it in this case. The model was too complex and often misused.


    After a few years from the first release at the Java Conference in 2000, Deepak
    Arun, John Crupi, and Dan Malk a book titled "Prototyping Patterns for the J2EE
    Platform," which introduced several patterns targeted common problems in the experience
    of J2EE applications. This following year they published a book called Core J2EE
    Patterns: Best Practices and Design Strategies. In addition to the 15 well-known
    patterns, the authors introduced 6 new J2EE design patterns. The new patterns
    introduced Context Object and Application Controller for the Presentation tier,
    Application Service and Business Object for the Business tier, and Domain Store
    and Web Service Broker for the Integration.


    Some of those patterns evolved from the "classic" Go patterns, whereas others
    were new and addressed the flaws of J2EE. In the following years, several projects
    and frameworks as Apache Camel were released that made the life of enterprise
    developers easier. Even some, by Rod Johnson, made a bold step by moving away
    from J2EE and releasing the Spring Framework. Spring became popular, and its popularity
    influenced great changes in the new programming model behind Java EE. Today most
    of those patterns are still valid...


    # Design Patterns Versus Enterprise Patterns


    Enterprise patterns differ from design patterns in that enterprise patterns target
    enterprise software and its problems, which greatly differ from the problems of
    desktop applications. A new approach, Service Oriented Architecture (SOA), introduced
    several principles to follow when building well-usable enterprise software. Don
    Box''s four tenets of SOA formed the basis of these fundamental principles. The
    set of principles addressed common needs of enterprise projects.


    | DON BOX S FOUR TENETS OF SOA |


    +   1. Boundaries are explicit. 2. Services are autonomous. 3. Services share
    schema and contract, not "class". 4. Service capability is determined on policy.


    However, "classical" patterns still have something to offer. With the release
    of Java EE 5, Java was back in the spotlight, something that third-party frameworks
    as Spring and Struts had hog for too long. The release of Java 6 was an even greater
    step forward and made the platform more competitive.'
  merge: -1
  pgno: 41
- img_proc: true
  md: 'Today in Java EE 7, "classic" design patterns described in the GoF are embedded
    in the platform ready to be used "out of the box." Unlike the J2EE era, most of
    these patterns are implemented via annotations and without the need for convoluted
    XML configuration. This is a huge leap forward and offers a developer a simplified
    programming model.


    Although there are several great on design patterns and the new features of Java
    EE, there seems to be a missing link on how those patterns are implemented in
    Java EE.


    # # Plain Old Design Patterns Matter Java EE


    Even from day zero, Java has been friendly towards design patterns. Some of the
    patterns have a built-in implementation that is ready to use, such as the observer
    pattern in Java SE. It itself uses many design patterns; for example, the singleton
    pattern is used in the system and runtime classifiers, and annotations are great
    examples of the implementation of the strategy.


    The tradition has continued with Enterprise Java, but especially Java EE, which
    has built implementations of many of the patterns described in the GoF book. Most
    of these can be developed and used with simple and easy-to-use annotations. Instead
    of looking at classes and writing boilerplate code, any developer with experience
    can enable a pattern with just lines of code. Magical? Not quite. Because the
    Java EE run time has a more sophisticated platform, it can offer many capabilities,
    relying that patterns would not be available without Java EE''s superset of features
    such as EJB and Dependency Injection (DI). The Java EE container contains most
    of the work for you as it adds embedded services and functionality to the server.
    The catch is that it has resulted in a heavyweight runtime environment, especially
    compared to basic web servers as Apache Tomcat. However, this has improved, and
    the latest builds on Java EE 7 are more mighty.


    Still, why do people continue to need design patterns in enterprise applications?
    Well, patterns are needed more than ever. Most of the enterprise applications
    are built by different teams of developers, and different parts need to be reused.
    Solving a common problem pattern on your or in many solutions, you are enough
    to expose to the whole corporation and potentially to the whole world (if your
    project is open). It is easy to introduce a properly designed application and
    let it become a corporate tradition or development strategy. Libraries, utility
    classes, and annotation programming interfaces (APIs) are ever more develop; it
    has become even harder to break compatibility and make radical changes. Changing
    one return type or adding a new method is much easier relying on annotations than
    on code.


    It is clear that enterprise software development requires a higher level of discipline
    and coordination between developer teams. Design patterns are a good way to approach
    this problem. However, most developers still do not make good use of class design
    patterns even though they have been in Java since version 5.0. Although enterprise
    patterns can solve many issues, the original design patterns continue to have
    much to offer. They are well known and proven solutions, they have stood the test
    of time, and have been implemented in almost all object-oriented languages.


    Finally, because most of those patterns are already integrated in the Java EE
    platform, there is no need to write the full implementation code. Some may require
    a little XML configuration, but most of the patterns can be implemented by applying
    an annotation to the class, method, or other'
  merge: -1
