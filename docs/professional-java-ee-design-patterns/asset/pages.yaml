  md: '# Summary | 95


    original object. However, this design should be well documented and clearly implemented
    to allow for better maintainability.


    The plugability of decorators declared in the deployment descriptor makes it easy
    to enable and disable decorators without recompiling and redeploying. In a hot
    deployment environment, the server does not need to be restarted for the changes
    to the bean.xml. This makes it extremely easy to change the behavior of an application
    in a production environment without interruption to service.


    Qualifier use a finer grain of control over the execution of decorators without
    enabling/disabling them in the bean.xml descriptor. You can use qualifiers to
    exclude implementations of an interface from being decorated or to apply different
    decorators to the same interface.


    A decorator intercepts calls only to Java types. It is aware of all the semantics
    of this interface and can implement business logic. This makes it perfect for
    modeling business concerns that are identifiable for a certain interface type.


    Decorators are often contrasted with interceptors. Interceptors invocations of
    any Java type, but they are not semantically aware and therefore are not a suitable
    tool for modeling business concerns. Interceptors are used to implement cross-cutting
    concerns such as logging, security, and auditing that are not related to business
    logic.


    The heavy use of decorators may introduce runtime bugs, a harder-to-understand
    code base, and a loss to the advantage of strongly static polymorphism. It may
    also introduce test cases. However, decorators can provide almost unlimited extensibility
    and a great interface for future implementations without breaking old code.


    # SUMMARY


    In this chapter, you have seen how the implementation of the decorator pattern
    in Java EE is almost unrecognizable from its pre-Java EE ancestor. The object
    to be decorated is instantiated and injected by the container, and the decorators
    are applied by declarations in the bean.xml descriptor or via the strategic use
    of custom qualifiers.


    The use of annotations and dependency injection has reduced the number lines lines
    code you must produce a decorator solution and make it easier to introduce new
    classes, which are automatically decorated by virtue of the interface they implement.


    You have seen how the decorator pattern has evolved into what is effectively agable
    pattern that can be enabled and disabled while the application is in production
    with no loss to service. However, it maintains its original design principle of
    adding behavior or responsibilities to the objects it decorates.


