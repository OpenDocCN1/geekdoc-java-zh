    getting a resource''s representation from the server. It must never be used to
    make changes to


    The other three methods—POST, PUT, and DELETE—are not idempotent and are expected
    to effect change on the server. You''ll learn about each method and how to use
    it in the context of a forum site. You''ll also learn about the HTTP response
    codes (http://www.w3.org/Prot/rfc2616-rfc2616-sec10.html) can be returned, along
    with the responses to the client and what they mean.


    # GET


    You use this method to get resource representations from the server. You should
    never use it to update, delete, or create a resource. Calling it once has the
    same effect as calling it 100 times. If the resource is requested, the representation
    of the resource is returned in the body of the HTTP response in the data format,
    which is either JSON or XML. The HTTP response code returned is 200 (OK). If the
    resource is not found, it should return 404 (NOT FOUND), and if the request is
    badly formed, it should return 400 (BAD REQUEST). A well-formed URI that you might
    use in your forum application could be users/12345/followers, which represents
    all the followers of the user 12345.


    # POST


    You use the POST method to create a new resource within the given context. For
    example, to create a new user, you would post to the users resource data necessary
    for a new user to be created. The service takes care of creating the new resource,
    associating it to the context, and assigning any'
