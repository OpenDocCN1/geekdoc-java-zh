  md: 'that the logging was fast and failsafe in moments when the database was not
    available. We were successful in developing a system that had fast response times
    and was reliable. We were pleased with what we had achieved.


    Then we were asked to log each user''s actions to a database table along with
    some user-related data. The database we were asked to use had a reputation for
    being slow and regularly crashing and restarting. This bad news for our fast and
    reliable logging system. We now had to refactor our system, taking into consideration
    the unreliability of the database. Imagine what would happen if a user interaction
    was being logged at the same time the database went down. The synchronous call
    to the logging system would block the response to the user until it either reestablished
    connection or timed out. The user would have to wait, which was unacceptable.


    We did not want the user to wait for the database to respond and expose an error
    to the front end, especially considering that we were only logging. After implementing
    and testing all the DAO classes, we added the #asynchronous annotation and prepared
    to go live.


    As usual, we were confident in our well-tested deployment package, so we decided
    to go to sleep rather than spending the night with the server administrators we
    the deployment. The next morning we received an email advising that the application
    was live.


    Soon we discovered that our server''s logs were full of errors, showing that the
    database connection had been unavailable. We contacted the server administrators
    and quickly discovered that the database had forgotten to create the tables in
    the live database. The tables were quickly created, and all was well until the
    database started from performance-related issues and had server restarts (as was
    expected given its reputation).


    Our application failed to persist noncritical logs but never failed in its performance.
    Every time there was a problem with the database and the logging failed, the user
    had already finished what he was doing and didn''t notice that the logging had
    failed, thanks to the use of asynchronous calling the logging functionality.


    Asynchronous programming is a great tool to use when separating tasks that do
    not need to interact with each other.


    The asynchronous pattern relies on the fire and forget approach where an operation
    is done in parallel or in a way not blocking the executor thread, and the result
    is checked when it is ready. Usually the asynchronous approach makes use of accurately
    reflected with a class diagram but may be better shown with a flow diagram. Figure
    9-1 demonstrates several asynchronous execution flows.'
