    balance the traffic in a High Availability (HA) manner, with a passive peer that
    becomes active if the active peer goes down. X-axis scaling improves the capacity
    and availability of the application. This option does not have development costs
    implications but does result in higher hosting and maintenance expense.


    You can scale an application along the Z-axis. The application code is duplicated
    onto several servers, similar to an X-axis split, but in this case each server
    is responsible for only fraction of the data. A mechanism is in place to route
    data to the appropriate server, perhaps based on a user type or primary key. Z-axis
    scaling benefits from the much more performance improvements over X-axis scaling;
    however it may need new development to rearchitect the application.


    None of these solutions solve the worsening application and development complexity.
    For this, you need vertical scaling.


    The application can be scaled along the Y-axis. It is decomposed into functionality,
    service, or resource. The way you do this is entirely yours and will depend on
    the situation, although division by use is common. The idea is that each decomposed
    part should encapsulate a set of related activities.


    To visualize the X-, Y-, and Z-axis scaling, you draw an AKF scale cube, as in
