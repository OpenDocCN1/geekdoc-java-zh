  md: "# Implementing the Singleton Pattern in Java EE | 43\n\nJava EE offers two\
    \ types of concurrency management: container-managed concurrency and bean-managed\
    \ concurrency. In container-managed concurrency, the container is responsible\
    \ for handling anything related to read and write access, whereas the developer\
    \ to handle concurrency using traditional Java methods such as synchronization.\
    \ You can enable bean-managed concurrency via the CurrencyManagementType.annotation.\n\
    \nJava EE uses container-managed concurrency by default, and you can explicitly\
    \ declare it with the ConcurrencyManagementType.CONTAINER annotation:\n\n```\n\
    @Startup\n@DependsOn(\"LoggingBean\")\n@ConcurrencyManagement(ConcurrencyManagementType.CONTAINER)\n\
    @Singleton\npublic class CacheSingleton {\n    // Implementation annotations code\
    \ here.\n}\n```\n\nNow you'll get to the example and use the @Lock annotations\
    \ to control the access. See Listing 4-11.\n\n# LISTING 4-11: Managing concurrency\
    \ using @locktype\n\n```\npackage com.devchronicles.singleton;\n\nimport java.util.HashMap;\n\
    import java.util.Map;\nimport javax.annotation.PostConstruct;\nimport javax.ejb.ConcurrencyManagement;\n\
    import javax.ejb.ConcurrencyManagementType;\nimport javax.ejb.EJB;\nimport javax.ejb.DependsOn;\n\
    import javax.ejb.Lock;\nimport javax.ejb.LockType;\nimport javax.ejb.Singleton;\n\
    import javax.ejb.Startup;\n\n@Startup\n@DependsOn(\"LoggingBean\")\n@ConcurrencyManagement(ConcurrencyManagementType.CONTAINER)\n\
    @Singleton\npublic class CacheSingleton {\n\n    private Map<Integer, String>\
    \ myCache;\n\n    @EJB\n    LoggingBean loggingBean;\n\n    @PostConstruct\n \
    \   public void start() {\n        loggingBean.info(\"Started!\");\n        myCache\
    \ = new HashMap<Integer, String>();\n    }\n```\n\ncontinues\n\nwww.it-ebooks.info"
