  md: '# Implementing a Timer in Java EE | 133


    ### TABLE 10-2: Examples of the Four Timer Creation Methods


    | METHOD | EXAMPLE |

    |---|---|n| createIntervalTimer(new Date(), 10000, new TimerConfig()); | This
    creates a timer that fires at the given date and every ten seconds thereafter.
    |

    | createSingleActionTimer(1000, new TimerConfig()) | This creates a timer that
    fires after one second. |

    | createTimer(30000, "Created programmatic timer") | This creates a timer that
    fires after 30 seconds. |

    | createCalendarTimer(new ScheduleExpression("*/10").minute("***")) | This creates
    a timer that fires every ten seconds. |


    All methods apart from the createCalendarTimer method can take the first parameter
    either in milliseconds or a date. This sets up the point where the timer is triggered.
    Here is an example:


    ```

    SimpleDateFormat formatter = new SimpleDateFormat("dd/MM/yyyy ''at'' HH:mm");

    Date date = formatter.parse("26/01/2015 at 17:56");

    timerService.createSingleActionTimer(date, new TimerConfig());

    ```


    In this snippet, the "timeout" is triggered at 17:56 on January 26, 2015.


    If a scheduled timer is required, you can use the createCalendarTimer method.
    This method takes a ScheduleExpression object in which a schedule is set using
    the values described in the "Timer Expression" section that follows.


    ```

    ScheduleExpression expression = new ScheduleExpression();

    expression.second("*/1").minute("***");

    timerService.createCalendarTimer(expression);

    ```


    In this snippet, the code is set to trigger every ten seconds of every minute
    of hour.


    All the creations return a Timer object that represents the timer. This object
    has the method getHandle(), which returns a serializable handle to the timer.
    The handle object can be persisted in a database or memory.


    You can retrieve the timer handle and a reference to the timer by invoking the
    getTimer(). With this object in hand, you can retrieve information about the timer.
    It is easy to obtain information about the behavior of the timer''s by calling
    the method getSchedule. This returns a ScheduleExpression object that has a getter
    method for each attribute. For example, getMinute() returns the value for the
    minute attribute. The getNextTimeout method returns the point when the timer fires
    next, where the milliseconds remaining before the timer expires.


    The isCalendarTimer method returns true if the timer was set by constructing a
    ScheduleExpression object. You must call it before the getSchedule method to determine
    if


