    \ Best Practices and Design Strategies book.\n\n# Java Persistence Architecture\
    \ API and Object Relational Mapping\n\nThe Java Persistence API JPA manages the\
    \ application's interactions with the data source. It specifies how to access,\
    \ persist, and manage data between the application's objects and the data source.\
    \ JPA itself cannot perform CRUD or other data-related operations; it's just a\
    \ set of interfaces and implementation requirements. A compliant Java EE application\
    \ server must provide support for its use.\n\nThe JPA specification replaces the\
    \ EJB 2.0 Container-Managed Persistence (CMP) entity beans specification, which\
    \ was heavyweight and complex. CMP received adverse reaction from many in the\
    \ developer community until the adoption of proprietary solutions like Hibernate\
    \ and TopLink. The development of JPA (released with EJB 3.0), aimed to bring\
    \ together CMP, Hibernate, and TopLink seems to have been successful.\n\nAt the\
    \ heart of JPA is the concept of an entity. For you de familiar with CMP, this\
    \ is what was referred to as an entity bean. An entity is a short-lived object\
    \ that is capable of being persisted in a database—not a serialized object but\
    \ data. It is a Plain Old Java Object (POJO) whose members are annotated and mapped\
    \ to a field in the data source. To better understand how this is represented,\
    \ you'll go through a code snippet.\n\nIn the following snippet, we represent\
    \ a Movie class as a POJO that is appropriately annotated:\n\n```\n@Entity\npublic\
    \ class Movie {\n    @Id @GeneratedValue\n    private Long id;\n    private String\
    \ title;\n    private String description;\n    private Float price;\n    public\
    \ Movie {}\n    // For brevity, the getters and setters have been left out.\n\
    }\n```\n\nAs you can see, this is a simple class with three annotations. The @Entity\
    \ class annotations indicate that this class should be treated as an entity class,\
    \ the @Id and @GeneratedValue annotations mark the id as an auto-generated identifier.\
    \ This means that when the entity is persisted by the data source, the id is automatically\
    \ generated according to the rules of auto-generated fields found down. If the\
    \ data source is a database, then all fields in this entity are necessary to persist\
    \ to a table called Movie. No other annotations are necessary to indicate which\
    \ fields are persisted. This is convention over configuration all fields are persisted\
    \ unless otherwise annotated. This mapping is referred as Object Relational Mapping\
    \ (ORM). It is beyond the scope of this chapter to discuss in detail JPA and ORM,\
    \ so it is recommended that you read Java EE 7 Tutorials: Part VIII Persistence."
