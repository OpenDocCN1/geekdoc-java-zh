    \ which was introduced in Java 5\n is shown in Listing 4-6. This approach is also\
    \ heavily advocated by Joshua Bloch in his book\nEffective Java. Enum types are\
    \ singleton by nature, so JVM handles most of the work required to\ncreate a singleton.\
    \ Thus, by using an enum type, you free yourself from the task of synchronizing\n\
