  md: "# IMPLEMENTING AOP IN PLAIN CODE\n\nJava SE does not offer out-of-the-box support\
    \ for AOP. You can achieve AOP by using thirdparty frameworks such as AspectJ\
    \ or Spring. Such frameworks used for XML-only configuration; however, you can\
    \ now achieve AOP through the use of annotations. Implementation and configuration\
    \ of both frameworks are beyond the scope of this book, but they have a proven\
    \ record and can easily be implemented. They provide a valid alternative to the\
    \ Java EE implementation.\n\nHowever, Java applications have the advantage of\
    \ using servlets to intercept the request or the response, which works similarly\
    \ to aspects. To implement a servlet filter, create a new class file and implement\
    \ the servlet filter interface. Provide an implementation of the doFilter() method,\
    \ as shown in Listing 8-1.\n\nLISTING 8-1: Simple implementation of a servlet\
    \ filter\n\n```\npackage com.devchronicles.interceptor.filter;\n\nimport java.io.IOException;\n\
    import java.util.ArrayList;\nimport java.util.List;\n\nimport javax.servlet.Filter;\n\
    import javax.servlet.FilterChain;\nimport javax.servlet.FilterConfig;\nimport\
    \ javax.servlet.ServletExceptionException;\nimport javax.servlet.ServletRequest;\n\
    import javax.servlet.ServletResponse;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class SecurityFilter\
    \ implements Filter {\n    @SuppressWarnings(\"unused\")\n    private FilterConfig\
    \ filterConfig = null;\n\n    @Override\n    public void doFilter(ServletRequest\
    \ request, ServletResponse response,\n            FilterChain chain) throws IOException,\
    \ ServletException {\n        Log.info(((HttpServletRequest) request).getRemoteAddr());\n\
    \        // /perform some security check\n    }\n\n    @Override\n    public void\
    \ init(FilterConfig filterConfig) throws ServletException {\n        this.filterConfig\
    \ = filterConfig;\n    }\n\n}\n```\n\nThe web container needs the configuration\
    \ shown in Listing 8-2 to activate the servlet filter on uniform resource locators\
    \ (URLs). This is placed in the web application's web.xml file."
