    SecurityLog\").info(context.getMethod(\n            .getName() + \"* is accessed\"\
    );\n        String user = context.getData().get(\"user\");\n\n        if (user==null)\
    \ {\n            user=context.getParameters()[0];\n            context.getData().put(\"\
    user\", user);\n        }\n\n        return context.proceed();\n    }\n}\n\n```\n\
    \n# Interceptor Life Cycle\n\nYou can capture the interceptor's life-phases easily\
    \ with the help of life-cycle annotations. Unlike extending and overriding, life-cycle\
    \ annotations hooks any function to the appropriate phase. The available life-cycle\
    \ annotations are @PostConstruct, @PrePreactivate, @PostActivate, and @PreDestroy.\
    \ Listing 8-8 shows how to hook up using interceptor life-cycle methods.\n\n#\
    \ LISTING 8-8: Hooking the interceptor's life-cycle phases\n\n```\npackage com.devchronicles.interceptor;\n\
    \nimport javax.interceptor.AroundInvoke;\nimport javax.interceptor.InvocationContext;\n\
    ```\n\n```\n@Interceptor\npublic class SecurityCheck {\n\n    @AroundInvoke\n\
    \    public Object doSecurityCheck(InvocationContext context) Throws Exception(\n\
    \n        // Do some security checks;\n        Logger.getLogger(\"SecurityLog\"\
    ).info(context.getMethod(\n            .getName() + \" is accessed!\");\n\n```"
