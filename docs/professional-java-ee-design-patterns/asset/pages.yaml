    # Nothing in Life Is Free


    The benefits of the microservice architecture do not come free. There are costs
    involved.


    The ease with which you can develop a microservice makes it easy for the number
    of microservices to grow, and grow very quickly. Fifteen microservices can easily
    become thirty or more, especially when different versions of the same microservice
    are counted. This poses several difficulties.


    The responsibility for operations may move to the development team. With only
    a handful of services to maintain, it is not a difficult task, but as the number
    of microservices grows, the task of maintaining them increases. A significant
    investment is needed to ensure that the services are deployed and maintained.
    Processes need to be automated to reduce the burden of deploying and maintaining
    a large number of services. There may be a knowledge gap you need to fill, adding
    to the overhead costs.


    Cross-cutting semantics means that all microservices must update their code to
    keep in sync. It can be time consuming to perform and have significant costs.
    Alterations to interface contracts and message formats can be the cause of such
    changes and require that all teams work in a coordinated way. Equally, failing
    to change an interface or message format early on in the project results in significantly
    greater costs as the number of microservices grows.


    Duplicated code is something that you have been taught is bad, and it is. In a
    microservice environment, the risk of code duplication is high. To avoid coupling
    and dependencies, code must sometimes be duplicated, meaning every instance of
    code must be tested and maintained. You may be able to abstract code to share
    a library, but this does not work in a polyglot environment.


