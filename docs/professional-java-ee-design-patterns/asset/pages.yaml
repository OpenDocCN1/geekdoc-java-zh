    # THE CLIENT TIER


    The Client tier is usually a browser that connects to the Java EE server via Hypertext
    Transfer Protocol (HTTP), although it can be any application on any machine as
    long as it behaves as a client in a server-relationship. The Client application
    sends a request to the server for a resource; the server processes the request
    and returns a response. This is usually the extent of the relationship between
    the client and the server.


    > NOTE The Client tier is often referred to as the Presentation tier.'
