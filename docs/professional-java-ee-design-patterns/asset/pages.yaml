- img_proc: true
  md: 'This anti-pattern has been expressed by many different names, such as Baklava
    Code. However, the name lasagna may have been first given by Adam Bien, who is
    heavily against unnecessary use of interfaces.


    # Mr. Columbus


    All experienced Java EE developers want to invent or implement their own perfect
    solution. Most of the time these are only attempts to abstract and provide a better
    interface to a common library, such as logging or testing, where it may go even
    to extremes and reinvent an important functionality that has been supported by
    the open source community for years, such as an Object Relational Mapping (ORM)
    layer.


    Although inventing something new may look appealing, reinventing something is
    just a waste of time. If you are going to write a new logging or an ORM framework,
    you should have a good reason to do it. If you don''t, you are rewriting a well-supported
    product, and most likely you''ll end maintaining it and providing all the support,
    tests, and future development.


    Always make sure you have done literature searches on open source projects before
    starting to write a framework from scratch.


    # Friends with Benefits


    One problem of J2EE vendor locking. By the time J2EE 1.4 was released, most vendors
    worked only with the vendor''s tools and IDEs. This looked like a mutually beneficial
    relationship at first because the vendor provided professional support for its
    tools, and open source tools and servers were left to the community to support.
    However, in the long term, many J2EE developers observed how open source tools
    and servers provided standard behavior and compatibility to Java specifications
    when vendors failed to do.


    There is nothing wrong with buying professional support and services and using
    tools, servers, and IDEs from vendors as the project is not locked to that vendor.
    Vendor locking may introduce problems that are impossible to solve without new
    releases and patches from the vendor, whereas building applications may make it
    possible to change to other vendors.


    # Bleeding Edge


    Passionate developers love to use bleeding-edge technologies. For example, WebSockets
    introduced many years ago, but they still suffer compatibility issues with old
    versions of browsers. No one can argue against the joy of learning something new
    and implementing a bleeding-edge technology in a project. However, it may become
    cumbersome to support such projects if you are targeting the mainstream.


    A good approach to deciding which framework or technology to use is to see how
    it fits with your target user base. If you are building a banking application
    for clients who may be using Internet Explorer 6, using WebSockets is the best
    choice (although most WebSockets frameworks provide well fallback scenarios).


    You always need to make sure an outsource library or framework is well-supported,
    mature, and fits your project before moving on.'
