    The container sets the TimerService object automatically; no injection is required.


    The business logic must be placed in a method annotated with @Schedule or @Schedules.


    The schedule is set in the annotations attributes and bicalendar-based EJB timer
    expressions.


    # EJB 3.2 Java 7 (June 2013)


    This extended the EJB Lite group to include the nonpersistent EJB timer service.


    Includes enhancements to the TimerService API which allows access to all active
    timers in the EJB module.


    Restrictions on Timer and TimerHandle that obliged references to used only inside
    a bean have been removed.


    # WAR STORY


    Recently, I was brought in consult on a web project that was suffering from intermittent
    performance issues. These issues had only appeared recently—just as the site''s
    visitors started to accelerate.


    The developers had to use a No-SQL database to persist GPS data regarding the
    location of the visitors. This was a good decision because this particular No-SQL
    data store was deatgest geop queries.


    Queries were run against the database, which collected data from the location
    and aggregated it to generate reports. These reports generated visitor statistics
    and were executed every day by a junior staff member.


    After some investigating, I discovered that the performance issues the application
    was coinciding with the time the reports were being run. The extra hit to the
    database caused by running the reports was responsible for the deterioration in
    performance.


    The solution was quite simple. Run the reports when the database was experiencing
    lower use. After reviewing the database usage reports, I determined that the optimal
    time to run the reports was 03:00 GMT. Clearly, I couldn''t ask the junior member
    of the staff to work at 3:00 in the morning, so I decided to automate the generation
    of the reports and configured the timerservice to launch the report generation.


    Many tasks are run in off hours for the same reason as spelled here. Repopulating
    data caches is a common example of a heavy process that should be run when the
    effect on site performance is minimal.'
