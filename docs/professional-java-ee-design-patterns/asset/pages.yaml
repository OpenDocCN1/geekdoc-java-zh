  md: '# WHAT IS A FAÇADE?


    The GoF describes this pattern as "providing a unified interface to a set of interfaces
    in a subsystem." Head First Design Patterns gives the same explanation and points
    out that, while hiding the complexity of the subsystem, the facade pattern offers
    the full power of the subsystem via an easier-to-use interface.


    To give a basic real-world example of how the facade pattern works, imagine a
    washing machine with only two modes: heavily soiled and lightly soiled. For each
    mode, the water temperature, heat water, water wash cycle, duration of spin cycle,
    add detergent, bleach, fabric softener, and so on. Each mode requires a set of
    washing instructions (different amounts of detergent, higher or lower temperature,
    shorter or longer spin durations, and so on).


    The simple interface provides two wash modes that make the complicated logic of
    selecting the appropriate water, the duration of the spin and wash cycle, and
    the different methods for adding detergent, bleach, or fabric softener. The user
    of the washing machine does not have to think about the complicated logic of how
    to wash the clothes (the temperature, cycle and so on). The only decision the
    user must make is whether the clothes are heavily soiled or lightly soiled. This
    is in essence the facade pattern applied to a washing machine design. Later on
    this chapter, you will see an implementation of this use case.


    The facade pattern is commonly implemented for the following purposes and situations:


    +   - Provide a simple and unified access to a legacy back-end system.

    - Create a public API to classes, such as a driver.

    - Offer coarse-grained access to available services. Services are combined, such
    as in the washing machine example.

    - Reduce network calls. The facade makes many calls to the subsystem, the remote
    client makes only one call to the facade.

    - Encapsulate flow and inner details of an app for security and simplicity.


    > NOTE Façades are sometimes implemented as singleton abstract factories.


    In the early dark days of JEE, I was working as a junior developer for a huge
    banking application where we implemented all the JEE design patterns. All Enterprise
    JavaBeans (EJB) were wrapped by a facade, and every service EJB using that façade
    was wrapped with another façade. We also had interfaces for the facades to ensure
    we didn''t break the API. In JEE, EJB needs a local and remote interface, so writing
    one EJB meant four interfaces and two classes. We'
  merge: -1
