  md: "# LISTING 8-7: Accessing information in the InvocationContext\n\n```\npackage\
    \ com.devchronicles.interceptor;\n\nimport javax.interceptor.AroundInvoke;\nimport\
    \ javax.interceptor.InvocationContext;\n```\n\n```\n@Interceptor\npublic class\
    \ SecurityCheck {\n\n    @AroundInvoke\n    public Object doSecurityCheck(InvocationContext\
