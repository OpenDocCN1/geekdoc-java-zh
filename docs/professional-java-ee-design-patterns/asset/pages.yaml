    \n```\n@Message(Message.Type.LONG)\n@Dependent\npublic class LongMessage implements\
    \ MessageType {\n\n    private String message;\n\n    @Override\n    public String\
    \ getMessage() {\n        return message;\n    }\n\n    @Override\n    public\
    \ void setMessage(String message) {\n        this.message = message;\n    }\n\
    }\n```\n\nEvery concrete implementation of the MessageType interface, as shown\
    \ in Listing 6-25, is annotated with an @Message qualifier denoting the message\
    \ type as either Message.Type.SHORT or Message.Type.LONG as implemented in Listing\
    \ 6-26 and Listing 6-27 respectively. The @Message qualifier is implemented in\
    \ the same manner, as can be seen in Listing 6-28, as the qualifier used in the\
    \ Custom Annotation Type example shown.\n\n# LISTING 6-28: Custom message annotation\n\
    \n```\n@Qualifier\n@Retention(RetentionPolicy.RUNTIME)\n@Target({ElementType.FIELD,\
    \ ElementType.TYPE})\npublic @interface Message {\\ {\n    Type value();\n   \
    \ enum Type { SHORT, LONG }\n}\n```\n\nTo create the annotation literal that you\
    \ use to make the comparison between the type you want and the type of the dependency,\
    \ you extend the abstract class AnnotationLiteral and implement Message as the\
    \ custom qualifier. Listing 6-29 shows how this is done.\n\n# LISTING 6-29: Annotation\
    \ literal used to retrieve required message type\n\n```\npublic class MessageLiteral\
    \ extends AnnotationLiteral<Message> implements Message (\n\n    private static\
    \ final long serialVersionUID = 1L;\n    private Type type;\n\n    public MessageLiteral(Type\
    \ type) {\n        this.type = type;\n    }\n```"
