    The bean-discovery-mode property can take one of three values: ALL, NONE, or ANNOTATED.
    This is the default. The CDI property means that the CDI container will manage
    no beans, and the ANNOTATED property makes the archive behave like an implicit
    archive. In this case, the CDI scans for beans with annotated scope types.


    # # The @Inject Annotation


    @@Inject annotation and its capabilities have already been covered. Before CDI
    in Java EE was introduced, DI framework offered its own way of injecting resources.
    When the Java EE container was released alongside the EJB container, @Inject annotation
    became a unique and abstract interface for almost all inject operations. The @Inject
    annotation lets you use any appropriate container or DI framework for the case.


    # # Contexts and Scope


    The difference between EJBs and CDI containers. Each CDI bean''s life cycle is
    bound to a context scope. The CDI offers four different scopes:


    +   - @RequestScoped—Duration is a user''s HTTP request.


    +   - @SessionScoped—Duration is a user''s HTTP session.


    +   - @ApplicationScoped—Shared is across all users for the duration of the application.


    +   - @ConversationScoped—Scope duration is controlled by the developer.'
