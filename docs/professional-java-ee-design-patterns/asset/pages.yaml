  md: '128 | CHAPTER 10 | TIMER SERVICE


    led to the invention of one of the most important devices of modern life: the
    alarm clock. Today even basic cell phones and fitness trackers offer alerts that
    you can adjust to different times and different days and even snooze options.


    For a long time, neither Java SE nor Java EE offered a built-in solution for time-based
    operations. This lack of support was filled with community-led open source.


    Traditionally, timer-based tasks would have been scheduled using a third-party
    tool such as Quartz, but such a tend could be tricky to use. Third-party tools
    require you to download and install a library, implement interfaces, and configure
    XML files. They''re anything but straightforward.


    Fortunatelyun for you and because of the difficulty faced by developers to use
    third-party libraries, a scheduling facility was introduced into the EJB 2.1 specification.
    This timer service satisfied the simplest use cases. And for those complicated
    cases, there was still Quartz. Quartz almost became the facto standard of time-based
    operations in Java.


    There is no development for timers in Java SE. You can use Quartz in both Java
    SE and Java EE, but Quartz usage is a separate topic to think beyond. This chapter
    skips the Java implementation and moves on to Java EE.


    Advancements were made in the EJB 3.2 specification (the latest release) to the
    timer service. Introduced were the @schedule and @scheduled annotations and cron-like
    calendar expressions. Now all the most exceptional use cases are satisfied. The
    timer service runs in the container as a service and registers Enterprise JavaBeans
    (EJB) for callbacks. It tracks the timers that exist and their schedules, and
    it takes care of persisting the timer in case a time-based service shuts down
    or crashes. The only thing the developer needs to do is schedule the timer.


    The timer service has been through a long development cycle. An overview of the
    advancements is summarized in Table 10-1.


    # TABLE 10-1: Timer Service Development


    | EJB AND JAVA VERSION | DEVELOPMENT |

    | EJB 2.1 Java 1.4 (November 2003) | The Timer implements the TimedObject interface.
    The TimerService is accessed through the EJBContext method. The business logic
    is better in the ejbTimeout method. |

    | EJB 3.0 Java 5 (May 2006) | The TimerService object is injected via direct injection
    using the annotation @resource. The business logic must be placed in a method
    annotated with @Timeout. Schedule set by specifying a date, duration, or ScheduleExpression
    object or XML configuration file. Referred to programmatic timers in Java EE 6.
    |


