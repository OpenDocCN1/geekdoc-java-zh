  md: '# The Six Constraints of REST | 16


    help in the understanding of resource representations. In fact, it''s more akin
    to a remote procedure call (RPC) pattern implementation, which is at level 0 on
    the Richardson Maturity Model. You are only interested in implementing REST at
    the highest level: level 3, please refer to the section, "Richardson Maturity
    Model of REST API" for full details.


    A RESTful API is not about actions; it''s about nouns. These nouns represent resources.
    So you''ll learn about a post resource, a user resource, and an address resource
    as posted to verbs such getUser, addPost, and deleteAddress. REST is different
    from simple object access protocol (SOAP) and RPC, which are the actions you want
    to perform on the application''s data. In a RESTful sense, you would call a URI
    with an HTTP method.


    Each resource is identified by a URI. There are many possible ways to refer to
    the resources, so you might be able to access the resource from different starting
    points. For example, you can obtain the resource that represents a user by accessing
    the resource directly via the GET / users/:id or by going from the list of users
    who follow that user and then the GET /users/:id. The representation of the resource
    is not the actual resource itself, it is perfectly valid for the same resource
    to be represented in different ways.


    The resource representation is bidirectional between client and server and at
    least part of the resource state. When that happens, it just needs enough data
    to create, modify, or delete the resource on the server.


    Resource representations are typically JavaScript (JSON) or Extensible Markup
    Language (XML), but they can be any format, including a custom representation.


    # THE SIX CONSTRAINTS OF REST


    According to Roy Fielding''s dissertation, a truly RESTful architecture conforms
    to all but one of the stated constraints. This group of constraints is called
    the REST style.


    # Client-Server


    The client-server constraint is based on the separations of concern principle
    and defines clearly the separation between the client and the server. The constraint
    is simple and requires a client to send a request to receive that request. The
    server may respond to the client''s request.


    # Uniform Interface


    This constraint defines the interface between the client and the server, stating
    that it should be generic and simple as possible. You have already learned that
    a resource is a representation of the data, and the client does not have direct
    access to the data. This constraint defines how resource is represented by nouns
    and that the interface is maintained by the creator of the actual data system.
    This is to ensure some degree of constancy of the interfaces over time. The constraint
    is almost always based on HTTP. As you have already seen, if you use the HTTP
    specification, the URI is constructed from the resource nouns and the HTTP verbs.


