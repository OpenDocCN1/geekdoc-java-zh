  md: '# ENTERPRISE PATTERNS


    Java 1.0 quickly became popular after it was released in 1996. The timing was
    perfect for the introduction of a new language that would remove the complexity
    of memory management, pointers, and the syntax of C/C++. Java offered a gradual
    learning curve that allowed many developers to adopt it quickly and start programming
    in Java. However, there was something that accelerated the shifts: An applet is
    a small application that runs in a website from the web browser and adds functionality
    to the website that would not be possible with HTML and CSS alone. An example
    would be an interactive graph or video feed.


    With the rapid growth of the Internet, static web pages became archaic and uninteresting.
    The web user wanted a better, faster, and more beautiful surfing experience. Along
    came apps, which offered undeniable interactivity, effects, and action to the
    then-static Wide Web. Soon, dancing Duke (the symbol of Java) became the trend
    among modern websites. Nothing remains for long on the Internet. Users wanted
    even more, yet applets failed miserably at adapting to those wants, so they did
    not maintain their popularity.


    Nevertheless, apps were the driving force behind the Java platform''s fast adaptation
    and popularity. Today (as this book is written) Java is among the two most popular
    programming languages in the world.


    # Java to Enterprise Java


    Following the release of the Standard Edition of Java, IBM introduced Enterprise
    JavaBeans (EJB) in 1997, which was adopted by Sun in 1999 and formed part of the
    Enterprise Java Platform (JEE) 1.2. In 1998 and prior to the release of J2EE,
    it wasn''t until Sun released a professional version of Java labeled EJB in adopting
    Enterprise Java. With the release of JEE 1.3 in 2001, Java became a key player
    in the enterprise world, and its position was settled with the release of JEE
    1.4 in 2003.


    Version 1.4 was one of the greatest milestones in Java''s history. It was widely
    adopted and maintained its popularity for many years even though new versions
    were released. Vendors and corporations were slow to adopt the newer versions,
    even though many had reasons to complain about JEE1.4. Using it was like driving
    a monster truck to the shops of a family sedan. It was definitely powerful, but
    simply too complicated and bloated with XML files, neither the frameworks were
    lightweight.


    Yet JEE became the most popular enterprise development platform. It had a set
    of features that made it a great choice for enterprise development.


    +   - Portability—The JVM let code run on any operating system. Developers could
    develop on Windows, test on Linux, but go into production on a UNIX system.

    - Security—J2EE offered its own role-based security model.

    - Transactions—J2EE offered built-in transactions.

    - Language features from J2SE—J2SE offered easy syntax, garbage collection, and
    great objectoriented programming features.'
  merge: -1
