- img_proc: true
  md: 'As a general rule, avoid interceptors for injecting business logic or changing
    the execution behavior. Interceptors are great when you need repetitive work that
    covers some methods or classes.


    # SUMMARY


    AOP is a popular subject that has many supporters but also many enemies. As expected,
    it is not a panacea that solves all problems. Aspects can greatly reduce readability
    and complicate the overall application flow if not properly used.


    However, aspects can be magical tools that implement additional behavior to the
    existing code base with minimal effort. You can easily turn on or off during the
    runtime environment. For example, you can turn off a logging aspect during development
    and put it into the test environment.


    Java EE offers interceptors that support annotations and need little XML configuration,
    except in special cases. You can use interceptors in both EJB and MDB contexts
    either at the class or the method level. You can also declare interceptors at
    a default level, which targets all EJBs matching the criteria. The default level
    and ordering needs some configuration to be done in the EJB-XML file.


    CDI adds great extensibility and functionality to interceptors. You can customize
    CDI interceptors and use them in a cleaner way with the @InterceptorBinding annotation.
    You can use interceptor bindings to wrap other interceptor bindings, forming a
    chain of interceptors to execute. CDI interceptors do not need minimal configuration
    to help the CDI container determine the execution order.


    EJB and CDI interceptors work alone or together in harmony. They offer all the
    functionality needed to implement AOP without a third-party framework.


    The proper use of interceptors creates crafted applications with magical execution
    flow. When it is time to implement interceptors, make sure they don''t change
    business flow and contain application logic.


    # NOTES


    +   1. Design Patterns: Elements of Reusable Object-Oriented Software (Addison-Wesley,
    1994): Erich Gamma, Richard Helm, Ralph Johnson, John Vlissides.

    2. Head First Design Patterns (O''Reilly, 2004): Eric Freeman, Elisabeth Robson,
    Bert Bates, Kathy Sierra.'
