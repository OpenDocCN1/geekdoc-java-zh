  md: '# WHERE AND WHEN TO USE THE DATA ACCESS PATTERN


    Some have argued that the DAO is no longer a useful pattern by which one can easily
    invoke the EntityManager directly. This is a reasonable argument because the EntityManager
    provides a clean API that abstracts the underlying data access layer. It is also
    reasonable to suggest that the likelihood of an entity in the data provider is
    remote, which makes the abstraction that the DAO provides less purposeful. These
    arguments have merit, it is still argued that the DAO has its place in a well-designed
    Java EE application. (The place might not be where it was originally intended,
    though).


    The value of extending the BaseDAO as shown in Listing 12-7 for each entity type
    is the extensible of its implementation. Methods that are specific to an entity
    can be written while maintaining a common interface. You select the DAO implementation
    for each entity rather than choosing the right EntityManager each time it is required
    to persist or retrieve data.


    Named queries can be located within the entity to which they relate. In a logical
    place, making maintenance easier. The DAO allows for a uniformed and controlled
    data access strategy because all access to the entity''s data is to go via the
    entity''s data. It maintains the principle of single responsibility because only
    the DAO accesses and manipulates the application''s data.


    Don''t forget that though it''s remote, the data source might change. If it does,
    you''ll be glad that there is an abstraction on the data layer.


    # SUMMARY


    The DAO has its fans and detractors. The decision of whether to use the pattern
    in your application should be based on the design requirements of the application.
    Like all patterns, its use for sake''s sake is potentially dangerous and could
    cause more confusion over abstract obscures the purpose of the code. Ensure that
    you understand well the various implementations of the pattern and how it interacts
    with the DTO and factory pattern.


    # EXERCISES


    +   1. Write an interface and its implementation for a movie order DAO. You can
    use the examples in it as a starting block.


    +   2. Write a service façade and a DTO that uses the MovieDAO.


    # NOTES


    +   1. Core J2EE Patterns: Best Practices and Design Strategies (Prentice Hall/Sun
    Microsystems Press, 2003): Deepak Alur, John Crupi, and Dan Malks.

    2. The Java EE 7 Tutorial: Part VIII Persistence.

    http://docs.oracle.com/javaee/7/tutorial/doc/'
