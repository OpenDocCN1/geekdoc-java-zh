  md: '# Asynchronous


    WHAT''S IN THIS CHAPTER?


    +   * Introduction to asynchronous programming

    * What is asynchronous programming

    * Asynchronous programming using threads

    * Using asynchronous programming in beans

    * Asynchronous programming in servlets

    * When and where to best use asynchronous techniques


    WROX.COM CODE DOWNLOADS FOR THIS CHAPTER

    The wrox.com code download for this chapter is found at www.wrox.com/go/projaveedesignpatterns
    on the Download Code tab. The code is in the Chapter 09 and individually named
    according to the names as a design pattern throughout the chapter.


    Although asynchronous programming is not always used as a design pattern, it has
    been a popular and important programming model for the past decade. The asynchronous
    programming relies on multithreading and executing the given functionality in
    a separate thread. Not only do multithreaded environments and programming languages
    have the advantage of asynchronous programming techniques, but single-threaded
    platforms, as the popular server-side JavaScript platform NodeJS, make good use
    of asynchronous programming principles.


    > NOTE The asynchronous pattern is also referred to as nonblocking method execution
    because the invoked method does not block the caller.'
