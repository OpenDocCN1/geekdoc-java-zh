  md: ".info(context.getMethod().getName() + \"is accessed!\");\n\n```\nreturn context.proceed();\n\
    ```\n\n```\n}\n```\n\nTo put the interceptor class into action, you must annotate\
    \ the target advice with the @Interceptors annotation in Listing 8-5. The @Interceptors\
    \ annotation would only be used in an EJB or MDB (Message Driven Bean).\n\n# LISTING\
    \ 8-5: Simple implementation of target advice\n\n```\npackage com.devchronicles.interceptor;\n\
    \nimport javax.ejb.Stateless;\nimport javax.ejb.TransactionAttribute;\nimport\
    \ javax.ejb.TransactionAttributeType;\nimport javax.enterprise.event.Event;\n\
    import javax.inject.Inject;\nimport javax.interceptor.Interceptors;\n\n@Interceptors(SecurityInterceptor.class)\n\
    @Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\npublic class\
    \ SomeBusinessService {\n\npublic void startService() {\n    //Complex business\
    \ logic\n    Logger.getLogger(\"AppLog\").info(\"done...\");\n}\n\npublic void\
    \ startAnotherService() {\n    //Complex business logic\n    Logger.getLogger(\"\
    AppLog\").info(\"done again...\");\n}\n```\n\nThe Interceptors annotation is flexible.\
    \ You can also use it at both the class and the method levels. The Interceptors\
    \ annotation also supports multiple interceptor inputs, which enable multiple\
    \ interceptors on the target advice. Listing 8-5 uses class-level interceptors,\
    \ which means that the Security interceptor will intercept either of the service\
    \ calls. If you do not want the interceptor to cover all methods in the class,\
    \ you can use method-level annotations, as shown in Listing 8-6.\n\n# LISTING\
    \ 8-6: Implementation of class-level interceptors\n\n```\npackage com.devchronicles.interceptor;\n\
    \nimport javax.ejb.Stateless;\nimport javax.ejb.TransactionAttribute;\n```\n\n\
    continues"
