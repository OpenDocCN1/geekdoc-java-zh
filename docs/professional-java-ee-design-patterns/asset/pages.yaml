  md: "# Implementing the Singleton Pattern in Plain Code\n\nBecause you need to guarantee\
    \ that singletons serve only one instance, the first thing to do is to control\
    \ the object's creation. You can do this easily by making the constructor invisible\
    \ to the outer world.\n\n```\npackage com.devchronicles.singleton;\n\npublic class\
    \ MySingleton {\n\n    private MySingleton() {\n        // Implementation code\
    \ here.\n    }\n}\n```\n\nNext, you need a method that creates the instance or\
    \ returns it if the instance was already created. Because MySingleton does not\
    \ exist yet, you must mark the creation method as static to allow access via the\
    \ class name; for example: MySingleton.getInstance().\n\nAt comment 1 in Listing\
    \ 4-1, you test the creation of the singleton and create it if it does not exist;\
    \ otherwise, you return the instance that was created in a previous call to the\
    \ getInstance() method. Each subsequent call returns the previously created MySingleton\
    \ object instance. The code might appear to be buggy but the object creation method\
    \ is not atomic, it is prone to error in race conditions. It allows more than\
    \ one instance of the singleton to be created in a multithreaded environment.\n\
    \n> LISTING 4-1: Simple implementation of the singleton.singleton\n\n```\npackage\
    \ com.devchronicles.singleton;\n\npublic class MySingleton {\n    private static\
    \ MySingleton instance;\n\n    private MySingleton() {}\n\n    public static MySingleton\
    \ getInstance() {\n        if (instance==null) {\n            instance=new MySingleton();\n\
    \        }\n        return instance;\n    }\n}\n```\n\nTo fix the race condition,\
    \ you need to acquire a lock mechanism and not release it until the instance is\
    \ returned. In Java, you can implement the locking mechanism using the synchronized\
    \ keyword, as shown in Listing 4-2."
