  md: "# Implementing the Factory Pattern in Java EE | 77\n\nWhat would take tens\
    \ if not hundreds of lines of code to produce each instance, you can accomplish\
    \ in just four lines of code. You can achieve this by collecting all instances\
    \ of a particular interface implementation and selecting the one you want to use\
    \ by the @Any annotation.\n\nThe @Any annotation instructs the constructor that\
    \ all beans implementing the given interface should be injected at that injection\
    \ point. In the list below the code `private Instance<MessageType> messages` injects\
    \ instances of all dependencies that implement the MessageType interface into\
    \ the member variable message.\n\nOnce all dependencies have been injected, you\
    \ need a way to distinguish between them and the one you want to use. This is\
    \ where the use of annotation literals and enum types comes into. In the following\
    \ lists, you define an @Message qualifier and the enum literals SHORT and LONG.\
    \ These年纪 between the implementations of the MessageType interface.\n\nTo select\
    \ the dependency, compare it with the enum type of the qualifier of each implementation\
    \ by creating an AnnotationLiteral of the type you are searching for, and return\
    \ it to the client.\n\nNow you'll see how this is implemented in code. You will\
    \ use the example of a factory that produces ShortMessage and LongMessage objects,\
    \ each implementing the Message interface annotated as either SHORT or LONG.\n\
    \n+   LISTING 6-25: MessageType interface\n\n```\npublic interface MessageType\
    \ {\n    public String getMessage();\n    public void setMessage(String message);\n\
    }\n```\n\n+   LISTING 6-26: ShortMessage implementation of message interface\n\
    \n```\n@Message(Message.Type.SHORT)\n@Dependent\npublic class ShortMessage implements\
    \ MessageType {\n\n    private String message;\n\n    @Override\n    public String\
    \ getMessage() {\n        return message;\n    }\n\n    @Override\n    public\
    \ void setMessage(String message) {\n        this.message = message;\n    }\n\
    }\n```\n\nwww.it-ebooks.info"
