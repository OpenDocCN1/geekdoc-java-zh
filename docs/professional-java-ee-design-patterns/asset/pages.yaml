  md: "Finally, if more than one method-level interceptor is present, again, the interceptors\
    \ follow the order\nthey are listed in the @Interceptors annotation:\n\n```\n\
    @Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\npublic class\
    \ SomeBusinessService {\n    @Interceptors(SecurityInterceptor.class, AnotherInterceptor.class)\n\
    \    public void startService() {\n    // ...\n```\n\nIf you need to change the\
    \ default ordering, you can do so by system configuration within the EJB-\nJAR\
    \ file. The following overrides the interceptor order and provides a custom ordering:\n\
    \n```\n<ejb-jar>\n  <interceptors>\n    <interceptor>\n      <interceptor-class>\n\
    \        com.devchronicles.SecurityInterceptor\n      </interceptor-class>\n \
    \   </interceptor>\n  </interceptors>\n  <assembly-descriptor>\n    <interceptor-binding>\n\
    \      <ejb-name>OrderBean</ejb-name>\n      <interceptor-class>\n        com.devchronicles.SecurityInterceptor\n\
    \      </interceptor-class>\n      <interceptor-order>\n        <interceptor-class>\n\
    \          com.devchronicles.AnotherInterceptor\n        </interceptor-class>\n\
    \        <method>\n          <method-name>startService</method-name>\n       \
    \ </method>\n      </interceptor-order>\n    </interceptor-binding>\n  </assembly-descriptor>\n\
    </ejb-jar>\n```\n\nThere might be exceptional cases in which the interceptors\
    \ need to be disabled. You can disable\ninterceptors with annotations as seen\
    \ in Listing 8-9. Java EE offers two different annotations to\ndefault default\
    \ and class-level interceptors separately.\n\n# LISTING 8-9: Disabling the interceptors\n\
    \n```\npackage com.devchronicles.interceptor;\n\nimport javax.ejb.Stateless;\n\
    import javax.ejb.TransactionAttribute;\nimport javax.ejb.TransactionAttributeType;\n\
    import javax.enterprise.event.Event;\nimport javax.inject.Inject;\n```"
