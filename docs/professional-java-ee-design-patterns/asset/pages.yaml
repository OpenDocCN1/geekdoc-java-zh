    that it will not cause resource consumption issues.


    A well-designed application makes good use of the façade pattern to encapsulate
    complicated logic and decouple systems from clients; however, the premature and
    overuse of the façade pattern can lead to a more complicated system with multiple
    layers.


    The session façade pattern is akin to the boundary in the entity-control-boundary
    architectural pattern, and it is related to the adapter and wrapper patterns.


    # EXERCISES


    +   1. List some public API implementations of the façade pattern and explain
