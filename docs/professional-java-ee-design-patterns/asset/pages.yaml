    You will learn the elements that make you a URI.


    # Resource Naming


    RESTful APIs are written for clients and should have meaning for the clients of
    those APIs. When choosing names to name resources, you will be familiar with the
    structure of the application''s data and how your clients are likely to use them.
    There are no defined rules as to how you name your resources, but there are conventions
    that, if followed, can help you create a set of self-descriptive names that others
    intuitively understand.


    # Nouns Verbs


    You must name resources after nouns, not verbs or actions. The purpose of the
    resource is to represent it. The HTTP method describes the action to be performed.
    The next section covers the use of nouns to represent all users and the user''s
    ID to identify the specific user, you would use `users/123456`. An example of
    a non-REST and fully formed URI would be `users/123456/update`, or it would include
    the action in a query string such as `users/123456?action=update`.

    The nature of data is that is hierarchical. So imagine you want to represent all
    the posts of user with ID `123456`. You would use the `posts` to represent all
    posts and create the URI `users/123456/posts`. Earlier, it was mentioned that
    the representation of the resource is not the actual resource itself, but a representation
    of it, and the same resource can be represented in different ways. To represent
    all by a specified user, you can use the URI `posts/users/123456`. Once you have
    a representation of a resource, you can decide what you want to do with it. To
    create a resource, use the `POST` method, and to retrieve it, use the `GET` method.
    In this section we


    # Self-Descriptive


    As you have seen, the nouns should reflect the resource they represent. Combining
    these representations with identifiers makes the URI easy to interpret and intuitive.
    If you read a URI in combination with its HTTP method and it is not immediately
    obvious what resource represents, it has failed as a RESTful URI.'
