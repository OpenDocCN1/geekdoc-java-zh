  md: "# 178 | CHAPTER 13 RESTFUL WEB SERVICES\n\nYou have seen some URI constructions\
    \ that consist of one resource noun and a URI variable.\nHow do you deal with\
    \ a more complicated URI, such as GET /users/123456/followers/456789?\nDo you\
    \ do it in the same way as before, just with a slightly more complicated @Path\
    \ and @PathParam.\n\n```\n@GET\n@Path(/{user_id}/followers/{follower_id}\")\n\
    @Produces(MediaType.APPLICATION_JSON)\npublic Response getUser(\n@PathParam(\"\
    user_id\") String user_id,\n@PathParam(\"follower_id\") String follower_id)\n\
    ```\n\nYou have looked at it the GET HTTP method. What about the POST, PUT, and\
    \ DELETE methods? To write a method that responds to an HTTP POST request, you\
    \ must do the same as you would with GET, but change just two elements. You annotate\
    \ the method with @Path instead of\nn@GET and @Consumes in place of @Produces.\
    \ Here's a simple example:\n\n```\n@POST\n@Consumes(MediaType.APPLICATION_JSON)\n\
    @Path(/{user_id}/followers)\npublic Response createUser(@PathParam(\"user_id\"\
    ) String user_id, String body)\n```\n\nThis example works just as well as the\
    \ GET methods, but note that there is no explicit mapping of the HTTP request\
    \ to a method parameter. The mapping is implicit. Content of the HTTP body is\
    \ passed to the only unannotated parameter that it finds in the method signature.\
    \ No more than one is allowed to avoid confusion.\n\nThe PUT and DELETE methods\
    \ operate in a similar way to the POST method.\n\nYour URI can contain query parameters.\
    \ You can retrieve these from the URI by annotating a parameter in the method\
    \ signature with @QueryParams(\"page\"). This annotation retrieves the query parameter\
    \ from the URI /users?page=10.\n\nThere are many more annotations in the JAX-RS\
    \ API that facilitate the design of a good RESTful API. It is recommended that\
    \ you familiarize yourself with all of them.\n\n# HATEOAS\n\nAs has already been\
    \ discussed, HATEOAS is at the highest level of REST implementation in the Richardson\
    \ Maturity Model and should be the nirvana of RESTfulness.\n\nImagine a client\
    \ requests a resource of posts in the system that the user has permission to view.\
    \ The URI will be GET /posts, and the response, if successful, might return with\
    \ the following HTTP body:\n\n```\n{\n  \"posts\": [\n    {\n      \"id\": 71892,\n\
    \      \"title\": \"Best movie of 2015\",\n      \"content\": \"I think the best\
    \ movie of 2015 is the Golden Egg of Siam.\",\n      \"links\": []\n    }\n  ]\n\
    }\n```"
