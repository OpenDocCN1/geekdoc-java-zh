- img_proc: true
  md: "The first part of the XML file lists the interceptors; then the interceptor\
    \ bindings need to be declared. This is done in the assembly description part,\
    \ which can accept a wildcard (*) that applies to all or a specific name to create\
    \ the binding between the interceptors and the EJB. The order of the interceptors\
    \ listed also determines the execution order. The interceptors listed in the EJB-JAR\
    \ file apply only to EJB in the same module.\n\n# Interceptor Order\n\nIf more\
    \ than one interceptor has defined for an advice, the order of the execution will\
    \ be from the most general to the most specific case. This means that default-level\
    \ interceptors will be executed before class-level interceptors, which will be\
    \ followed by method-level interceptors.\n\nThis behavior is expected; however\
    \ the order of same-level interceptors can be a bit confusing. If there is more\
    \ than one default-level interceptor, the order in the EJB-JAR file determines\
    \ the order of the execution of the interceptors.\n\n```\n<ejb-jar>\n  <interceptors>\n\
    \    <interceptor>\n      <interceptor-class>\n        com.devchronicles.SecurityInterceptor\n\
    \      </interceptor-class>\n    <interceptor>\n      <interceptor-class>\n  \
    \      com.devchronicles.AnotherInterceptor\n      </interceptor-class>\n    </interceptor>\n\
    \  </interceptors>\n  <assembly-descriptor>\n    <interceptor-binding>\n     \
    \ <ejb-name>OrderBean</ejb-name>\n      <interceptor-order>\n        <interceptor>\n\
    \          <interceptor-class>\n            com.devchronicles.SecurityInterceptor\n\
    \          </interceptor-class>\n        </interceptor>\n        <interceptor>\n\
    \          <interceptor-class>\n            com.devchronicles.AnotherInterceptor\n\
    \          </interceptor-class>\n        </interceptor>\n      </interceptor-order>\n\
    \    </interceptor-binding>\n  </assembly-descriptor>\n</ejb-jar>\n```\n\nWhen\
    \ there is more than one class-level interceptor, the interceptors follow the\
    \ order which are listed in the @Interceptors annotation:\n\n```\n@Interceptors(SecurityInterceptor.class,\
    \ AnotherInterceptor.class)\n@Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\n\
    public class SomeBusinessService {\n  public void startService() {\n    // ...n\n\
    ```"
