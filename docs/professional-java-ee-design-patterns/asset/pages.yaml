  md: '# WHAT IS THE MVC DESIGN PATTERN?


    In MVC, the model represents the application''s data and related business logic.
    The model may be represented by one object or a complex graph of related objects.
    In a Java EE application, the data is encapsulated in data objects deployed in
    an EJB bean. Data is transported to from the database access layer in data transfer
    objects (DTOs) and accessed via data objects (DAOs). See Chapter 12, "Data Access
    Pattern."


    The view is the visual representation of the data contained in the model. A subset
    of the model is represented in a single view; thus, the view acts as a filter
    to the model data. The user interacts with the model via the view''s visual representation
    and invokes business logic in turn upon the model data.


    The controller links to the model and directs application flow. It chooses which
    view to render to the user in the user''s input and the business logic that it
    processes. The controller receives a message from the view, which it forwards
    to the model. The model in turn prepares a response and sends it back to the controller
    where the view is chosen and sent to the user.


    The MVC pattern logically spans the client and middle tier of a multier architecture.
    In Java EE environment, the model is located in the web tier, normally in the
    form of an Enterprise JavaBeans (EJB) model. The view tier is likely to be constructed
    from Java Faces (JSF) or Java Pages (JSP) with help of Expression Language (EL).
    The controller is normally a servlet that receives Hyper Transfer Protocol (HTTP)
    requests from the client. See Chapter 2, "Basics of Java EE" for a discussion
    of architecture and the different application layers.


    Often the MVC pattern is combined with other patterns, such as the command (or
    action), strategy, composite, and observer. This chapter doesn''t delve into the
    depths of these patterns, but it does touch on the action pattern in the example
    that follows.


    > BACKGROUND

    The first mention of this pattern occurred before the invention of the modern-Internet
    in a paper published by the SmallTalk programmer Trygve Reenskaug in 1979 while
    he was working at Xerox Parc.


    Even though MVC elements of this pattern were defined more than 30 years ago,
    they are surprisingly relevant to their current use in a web application.


    Figure 14-1 shows the user making a request to the controller. The controller
    handles the request by updating the model and rendering a new view, which is sent
    to the user.


    ![](img/ad3069372493fd36d3f3789232291bb2_217_0.png)'
