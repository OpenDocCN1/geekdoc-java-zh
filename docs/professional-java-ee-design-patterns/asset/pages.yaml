    # Stereotypes


    You can think of stereotypes as templates that define the characteristics of a
    specific functionality of a bean type. For example, a bean that is used at the
    model layer of an Model View Controller (MVC) application requires certain annotations
    to perform its function. These would include the following:


    ```

    @Named

    @RequestScoped

    @Stereotype

    @Target((TYPE, METHOD, FIELD))

    @Retention(RUNTIME)

    ```


    Only @Named and @RequestScoped are enough to define a Model bean. Others are required
    to create an annotation called @model.


    You could apply annotations on every bean that requires, or you could define a
    stereotype called @model and only apply to that beans. The latter makes your code
    much easier to read and maintain.


    To create a stereotype, you define a new annotation and apply the required annotations
    as in Listing 5-13.


    > LISTING 5-13: Stereotype annotation


    ```

    @Named

    @RequestScoped

    @Stereotype

    @Target((TYPE, METHOD, FIELD))

    @Retention(RUNTIME)

    public @interface Model { }

    ```


    Any bean annotated with @Named has a resource called @RequestScoped and is visible
    to EL (@Named). Luckily, the CDI container that comes with this stereotype has
    already defined.


    A typical use of the stereotype annotation is to combine with alternative annotation
    so you have a way to annotate mock objects.


    # Other Patterns via CDI


    CDI grants a great power to Java EE developers. CDI goes beyond just a simple
    DI framework by making the implementation of all those patterns with minimal code.


    The chapters that follow dive into details of these patterns; however, to wet
    your appetite, here''s a brief introduction to these CDI-powered patterns.


    Chapter 7, "Decorator Pattern," covers the decorator pattern. Decorators wrap
    a target object to dynamically add new responsibilities at run time. Each decorator
    can be wrapped by another,'
