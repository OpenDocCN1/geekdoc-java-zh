    # Decorators Without XML Configuration


    At deployment time, the CDI contains all the JAR and WAR files in the application
    looking for bean.xml descriptors. For those it finds, it processes each in turn,
    making the appropriate configurations. When it meets the <decorator/> descriptor,
    it enables the decorators for the archive in which the bean.xml file was found.
    It does not enable for all classes that implement the same interface regardless
    of where they are in the application. This is possible for developers who want
    the decorators to apply to all classes. Since CDI 1.1, it has been possible to
    enable decorators by annotating the decorator class with @Priority and an Interceptor.Priority
    value. Here is an example of how to enable your decorators for the whole application.


    ```

    @Priority(Interceptor.Priority.APPLICATION)

    @Decorator

    public class PriceDiscountDecorator extends AbstractDiscountDecorator

    ```


    ```

    @Priority(Interceptor.Priority.APPLICATION-10)

    @Decorator

    public class BlackFridayDiscountDecorator extends AbstractDiscountDecorator

    ```


    Decorators annotated with a lower value priority are called first. In the preceding
    example, PriceDiscount is invoked before BlackFridayDiscountDecorator.


    Decorators annotated with @priority are called before decorators in the deployment
    descriptor. If a decorator is enabled in both, it is called twice. This may lead
    to undesirable results, so you need to ensure that decorators are decorated in
    only one way.


    # WHERE AND WHEN TO USE THE DECORATOR PATTERN


    The decorator pattern dynamically adds behavior to an object at run time or when
    it is not possible to use subclassing (subclassing because it would create multiple
    subclasses). The pizza restaurant example shows how to add behavior to a pizza
    object at run time based on choices the customer made.


    The functionality of an application programming interface (API) can be extended
    and improved by wrapping it in a decorator. Data streams are often decorated this
    way. java .io.BufferedInputStream is a good example of a decorator wrapping a
    lower-level API and adding functionality to buffer an input stream.


    In Java EE, decorators are implemented via Context Dependency Injection (CDI).
    You can use decorators to add new business behavior or any other functionality
    that can be wrapped around the


