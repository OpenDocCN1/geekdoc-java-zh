    Dependency injection (DI) is one of the few well-known and accepted design patterns
    that not listed in the book by the Gang of Four. Today, it has been used widely
    in modern programming languages both internally and as a best practice to promote
    loose coupling.

    JEE was designed to handle the most complex systems but failed miserably by overcomplicating
    the development of even simpler systems. The original design of JEE relied on
    heavyweight complexity and right coupling, which led to the popularity of frameworks
    such as Spring and Pico container. In 2004, Martin Fowler published an article
    on the inversion of control containers and the dependency of the injection pattern.Most
    vendors did not support and encourage developers to use the J2EE container. However,
    soon the lightweight containers took over, they became officially supported and,
    even more, Spring became de facto standard and led to the redesign of Enterprise
    Java from scratch.'
