  md: "# IMPLEMENTING A TIMER IN JAVA EE\n\nThere are two types of timers in Java\
    \ EE 7: automatic and programmatic. Automatic timers are set upon the deployment\
    \ of an an enterprise Java bean (EJB) that contains a method annotated with either\
    \ @Schedule(...) or @Schedule(...). The annotated method is invoked by the container's\
    \ scheduler at the specified times, or time intervals defined within the annotations.\
    \ Such methods are referred to as callback methods. The timer starts ticking as\
    \ soon as the EJB is deployed. A programmatic timer is set to run by a method\
    \ called within the business logic. The time can be configured on the fly and\
    \ invoked at anytime (or not all). The timer start ticking when the programming\
    \ logic determines that it should start.\n\n# TIMER SERVICE IMPLEMENTATION\n\n\
    The EJB container implements the timer service. An enterprise bean can access\
    \ this service in three ways: by means of dependency injection, the EJBContext\
    \ interface, or through lookup in the Java Naming and Directory Interface (JNDI)\
    \ namespace. This book only examines the way by means of dependency injection,\
    \ because it's the newest and most efficient.\n\n# Automatic Timers\n\nThe container\
    \ invokes any method properly annotated with @Schedule and applies the schedule\
