  md: 'Java EE works within the realm of the Middle tier, although it touches both
    the Client and the EIS tiers. The Middle tier receives requests from the Client
    tier application. The Middle tier''s Web layer processes the request and prepares
    a response, which sends back to the Client tier, whereas the Business layer applies
    the business logic before persisting in the EIS tier. Within the Middle tier,
    there is fluid communication between the layers and the EIS tier, while preparing
    the response to the Client tier. A multitier architecture can be represented visually,
