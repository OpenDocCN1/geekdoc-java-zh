  md: "# WHAT IS DEPENDENCY INJECTION?\n\nThe dependency injection pattern is based\
    \ on the idea of inverting the control. Instead of creating hard dependencies\
    \ and creating new objects with the new keyword or lookups, you inject the needed\
    \ resource into the destination object. This approach has many benefits:\n\n+\
    \   - The client does not to be aware of the different implementations of the\
    \ injected resources, making changes easier.\n- Unit testing using mock objects\
    \ is much easier to implement.\n- Configuration can be externalized, reducing\
    \ the impact of changes.\n- A loosely coupled architecture allows pluggable structures.\n\
    \nThe basic idea DI is to change the place where objects are created and to use\
    \ an injector to inject the specific implementations to the destination objects\
    \ at the right moment. This might sound like an implementation of the factory\
    \ pattern (see Chapter 6, “Factory Pattern”), but the whole concept is much more\
    \ than simple creation. Inversion of Control (IoC) changes the whole working between\
    \ objects and lets the injector do the work (most of the time magically). Instead\
    \ of calling a factory to provide an implementation to the caller, the injector\
    \ works proactively to determine when a destination object needs the target object\
    \ and performs the injection in.\n\n# IMPLEMENTING DI IN PLAIN CODE\n\nJava did\
    \ not offer a standard DI implementation out of the Enterprise JavaBeans (EJB)\
    \ container until the introduction of Context and Dependency Injection (CDI).\
    \ Although there are various DI frameworks, such as Spring and Guice, it is not\
    \ difficult to create a basic implementation.\n\nThe simplest implementation is\
    \ a factory that creates the dependency on request via a `getInstance()` method.\
    \ Now you'll implement an example that shows how to do this in plain code.\n\n\
    The simple DI implementation should separate the resolution of dependencies from\
    \ the behavior of the class. This class should have specific functionality without\
    \ defining how it obtains the reference to the classes it depends on. This decouple\
    \ creation from where the object is used: the essence of DI.\n\nYou will start\
    \ looking at an example in Listings 5-1, 5-2, 5-3 and 5-4 that is highly coupled,\
    \ and refactor it to use your home-grown DI.\n\n> LISTING 5-1: UserService class\
    \ creates a new dependency in the constructor\n\n```\npackage com.devchronicale.di;\n\
    class UserService {\n    private UserDataRepository udr;\n    UserService() {\n\
    \        this.udr = new UserDataRepositoryImpl();\n    }\n```"
