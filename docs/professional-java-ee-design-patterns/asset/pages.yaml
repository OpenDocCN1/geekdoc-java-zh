  md: '# CHAPTER 11 OBSERVER PATTERN


    In the Java realm, you can migrate existing code to the observer pattern without
    too much hasle. Java EE observers are usually accompanied by dependency injection,
    which uses @inject, and factories, which use @produces.


    The observer pattern''s greatest strength, the decoupling of classes, is also
    its greatest weakness. Control of the observable moves to the observer, you lose
    track of the application''s workflow. Vision becomes obscured as event triggers
    another. A complicated implementation of the observer pattern can be a nightmare
    to debug, so it is recommended that you keep the implementation simple. Avoid
    multiple layers of observers; using just one layer (or a few) is ideal.


    To help and present developers determine the purpose of your code, the name of
    an observer should reflect its purpose. In addition, you incorporate the reason
    for the observer into the name of its methods, expressing the purpose of the class.


    In the Java realm, existing code can be migrated to the observer pattern without
    hassle. Java EE observers are usually accompanied by dependency injection (inject)
    and factories (@produces). The heavy and unnecessary use of observers may introduce
    hard to debug and systems. However, since most developers are used to observers
    from UI or web frameworks, you will usually have an instance to use in the context
    most of the time.


    When you have a resource subject to change and callers to capture the data from
    subject, never hesitate to use the observer pattern. Transaction-sensitive observers
    offer functionality that was not easily available in earlier versions. In the
    BEFORE COMPLETION phase, you can cancel the current transaction by invoking the
    setRollbackonly method, allowing nontransional operations to be performed within
    a transactional phase. If an exception is thrown, the entire transaction can be
    rolled back.


    During the IN_PROCESS phase, which starts the transaction, events can be fired
    and observed immediately. This can be implemented as a type of progress monitor
    or logger.


    A call to observer method blocks the event emitter and is synchronous by annotating
    the observer method @asynchronous. (See Chapter 9, "Asynchronous,") for more information
    about how to use this annotation.) You should take care when making observers
    of the BEFORE_COMPLETION phase because the setRollbackOnly method is ineffective,
    and the transaction will not be rolled back. The asynchronous method occurs in
    a new transaction.


    # SUMMARY


    You have seen Java''s observer pattern implementation has advanced in Java EE
    7 and how it can be made sensitive to the transactional phase of the events that
    it observes. The implementation completely decouples logic from the observer,
    leaving only the event type and qualifier to connect them. This has raised the
    concern that over the relationship is lost, although this can be mitigated by
    appropriately naming the class and methods and illustrating the relationship in
    the class''s documentation.


    The transactional phase sensitivity has another dimension to the observer pattern.
    It provides integration between the observer methods and the transaction, allowing
    rollbacks to be invoked.'
