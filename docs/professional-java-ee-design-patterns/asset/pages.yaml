  md: 'Luckily, Enterprise Java had a happy ending. The POJO and lightweight container
    led by Rod Johnson gained a huge following and soon became a competitor to J2EE.
    Spring offered a lightweight container and the ability to run on simple Java servers.
    The POJO approach was great for testing and did not need the container most of
