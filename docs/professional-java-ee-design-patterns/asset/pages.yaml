  md: '# 11

    Observer Pattern


    # WHAT''S IN THIS CHAPTER?


    +   - How to implement the observer pattern in plain code

    - How the observer pattern works in the real world

    - How to implement the observer pattern using @Observes and Event firing

    - How to use qualifiers to gain fine-grain control over observers

    - How to implement transaction-sensitive observers and rollbacks


    # WROX.COM CODE DOWNLOAD FOR THIS CHAPTER


    The wrox.com code download for this chapter is found at www.wrox.com/go/projaaveedesignpatterns
    on the Download Code tab. The code is in the Chapter 11 and individually named
    according to the names throughout the chapter.

    The observer pattern is one of the most widely used and accepted design patterns
    in modern programming languages, software, and user interface (UI) frameworks.
    Most programming languages use observers within their internal application programming
    interfaces (APIs), and Java is no exception. Java EE goes further than most and
    provides a default implementation of the observer pattern, so developers can use
    this pattern without de-novoveloping it from scratch. This chapter focuses on
    Java''s default implementation of the observer pattern: where it is used, how
    observers are implemented via annotations in Java EE, and how observers can be
    made transaction sensitive.


    # WHAT IS AN OBSERVER?


    The idea behind the observer pattern is an object that changes its state can inform
    other objects that a change has occurred. In the language of the design pattern,
    the object that'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'changes its state is called the subject, whereas those objects that receive
    notification of a change are called the observers. The relationship is one to
    many, with the subject having many observers.


    Imagine a chat application that has a chat room allowing many people to chat together.
    Each of these clients regularly checks with the server to see if there has been
    a new message posted by one of the other clients. As you can imagine, this is
    very performance friendly. Would it not make more sense if the message "pushed"
    to all subscribers? It would be more efficient. The observer pattern can solve
    this problem. The server would be registered with each client, and when the client
    posts a new message (a change in state of the subject), the subject would call
    a method on the server to notify it of the new message. Then the server would
    call a method on all its registered clients and send the message to each one.


    > NOTE The observer pattern is also referred to as the Hollywood principle, whose
    motto is "don''t call us; we''ll call you." This is not surprising; most Hollywood
    agents would prefer to call clients for a new role rather than being bounded by
    calling them. This system works well because there''s never a perfect time to
    call an agent to check about an available job. You''ll either miss out on a job
    offer if you''re calling, or you''ll be seen as obnoxious if you''re calling more
    often than jobs arrive.

    With the help of the observer pattern, an agent calls appropriate clients just
    as a new job opens, without losing time or wasting resources.


    # Description


    The Go book states the observer pattern "defines a one-to-many dependency between
    objects so when one object changes state, all its dependents are notified and
    updated automatically." The First Design Patterns book gives the Example of a
    weather monitoring application that sends a notice when temperatures change. The
    observer pattern is based on the principle of inheritance and is one of the behavioral
    design patterns.


    To be an observer, concrete observer needs to share a similar interface. The subject
    lets each observer add itself to a registry. When the subject changes, the observer
    calls each subject''s registered to notify the observer about the changes.


    This is an efficient implementation because only one call happens for each observer
    at the time of the change. A naive solution as regularly checking the subject
    might produce an unlimited number of calls from different observers even though
    had been no change to the object observed.


    The observer pattern is not different from a news subscription. Objects that want
    to subscribe to changes on another object register themselves to receive news
    of those changes. Rather than checking the target object, objects are called when
    there is a change.'
