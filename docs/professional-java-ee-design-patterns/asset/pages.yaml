    GlobalLogger\").info(\"Started!\");\n        myCache = new HashMap<Integer, String>();\n\
    \    }\n\n    public void addUser(Integer id, String name) {\n        myCache.put(id,\
    \ name);\n    }\n\n    public String getName(Integer id) {\n        return myCache.get(id);\n\
    \    }\n}\n```\n\nIf you refresh your server, the post constructor is invoked\
    \ because the singleton is now created at startup. The logger should now receive\
    \ the message Started!\n\n# Determining Startup Order\n\nThis may bring up another\
    \ question. What if you have just created depends on another resource? How do\
