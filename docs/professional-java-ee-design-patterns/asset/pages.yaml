  md: '# # 1 A Brief Overview of Design Patterns


    WHAT''S IN THIS CHAPTER?


    +   - An overview of design patterns

    - A short history about design patterns and why they are important

    - The use of design patterns in the real world

    - The history and evolution of Java Enterprise Edition environment

    - The emergence of enterprise patterns

    - How these design patterns have evolved in the enterprise environment

    - Why and how patterns become anti-patterns


    This book is aimed at bridging the gap between the traditional implementation
    of design patterns in the Java SE environment and their implementation in Java
    EE.


    If you are new to design patterns, this book will help you get up to speed quickly
    as each chapter introduces the design pattern in a simple-to-understand way with
    plenty of working code examples.


    If you are already familiar with design patterns and their implementation but
    are not familiar with their implementation in the Java EE environment, this book
    is perfect for you. Each chapter bridges the gap between the traditional implementation
    and the new, often easier, implementation in Java EE.


    If you are an expert in Java, this book will act as a solid reference to Java
    EE and Java SE implementations of the most common design patterns.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'This book focuses on the most common Java EE design patterns and demonstrates
    how they are implemented in the Java EE universe. Each chapter introduces a different
    pattern by explaining its purpose and discussing it. Then it demonstrates how
    the pattern is implemented in Java SE and gives a detailed description of how
    it works. From there, the book demonstrates how the pattern is implemented in
    Java EE and discusses its most common usage, its benefits, and its pitfalls. All
    explanations are accompanied by detailed code examples, all of which can be downloaded
    from the website accompanying this book. At the end of each chapter, you will
    find a final discussion and summary that rounds up all you have read in the chapter.
    There are even interesting and sometimes challenging exercises for you to do that
    will test your understanding of the patterns covered in the chapter.


    # WHAT IS A DESIGN PATTERN?


    Design patterns are "descriptions of communicating objects and classes that are
    customized to solve a design problem in a particular context."


    > —GANG OF FOUR


    Design patterns offer solutions to common application design problems. In object-oriented
    programming, design patterns are normally targeted at solving the problems associated
    with object creation and interaction, rather than the large-scale problems faced
    by the overall software architecture. They provide generalized solutions in the
    form of boilerplates that can be applied to real-life problems.


    Usually design patterns are visualized using a class diagram, showing the behaviors
    and relations between classes. A typical class diagram looks like Figure 1-1.


    Figure 1-1 shows the inheritance relationship between three classes. The subclasses
    CheckingAccount and SavingsAccount inherit from their abstract class BankAccount.


    ![](img/ad3069372493fd36d3f3789232291bb2_37_0.png)


    FIGURE 1-1: A class diagram inheritance'
