    \ of a servlet filter in Servlet 3.0\n\n```\npackage com.devicles.interceptor;\n\
    \nimport java.io.IOException;\nimport java.util.ArrayList;\nimport java.util.List;\n\
    import java.servlet.ServletExceptionException;\nimport java.servlet.ServletRequest;\n\
    import java.servlet.ServletResponse;\nimport java.servlet.http.HttpServletRequest;\n\
    import java.servlet.http.HttpServletResponse;\n\nimport java.servlet.Filter;\n\
    import java.servlet.annotation.WebFilter;\nimport java.servlet.annotation.WebInitParam;\n\
    \n@WebFilter(filterName = \"TimeOfDayFilter\", urlPatterns = {\"/*\"})\\npublic\
    \ class SecurityFilter implements Filter {\n\n  @Override\n  public void doFilter(ServletRequest\
    \ request, ServletResponse response,\n      FilterChain filterChain) throws IOException,\
    \ ServletException {\n    Log.info(((HttpServletRequest) request).getRemoteAddr());\n\
    \    // perform some security check\n  }\n}\n```"
