  md: "# IMPLEMENTING REST IN JAVA EE\n\nThis chapter has discussed at length the\
    \ theory behind a well-designed RESTful API. Now that you have seen how you might\
    \ style the URIs, you can jump in and see how all this works in code.\n EE 7 provides\
    \ some helpful annotations that make the job of constructing a RESTful API straightforward.\
    \ The most useful is the @Path annotation. This annotation defines the context\
    \ URI and class or method that will process requests made on that. Additionally,\
    \ there are annotations for each HTTP method: @GET, @POST, @PUT, @DELETE, and\
    \ so on. These annotations mark methods that will process requests with the stated\
    \ HTTP method.\nYour application can have more than one RESTful context. In this\
    \ case, @ApiPath annotation takes a parameter that defines the space in which\
    \ your RESTful API will exist. With just these types of annotations, all you need\
    \ to implement a simple RESTful API.\nNow in Listing 13-1 you'll implement your\
