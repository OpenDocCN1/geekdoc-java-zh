    UserDataRepository\").\n\n# Context and Dependency Injection (CDI)\n\nContext\
    \ and Dependency Injection (CDI) brought full-fledged dependency injection and\
    \ context support to the Java EE platform, which used to be EJB specific and far\
    \ more limited. EJB 3 introduced Seam (a web framework), which had become popular,\
    \ by supporting direct interaction between JavaServer Faces (JSF) and JavaBeans\
    \ as well as EJB. The success of Seam led to the design of JSR299, WebBeans. While\
