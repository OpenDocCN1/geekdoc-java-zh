  md: "# 106 | CHAPTER 8 ASPECT-ORIENTED PROGRAMMING (INTERCEPTORS)\n\n# LISTING 8-8\
    \ (continued)\n\n```\nString user = context.getContextData.get(\"user\");\nif\
    \ (user=null) {\n    user=(String)context.getParameters()[0];\n    context.getContextData.put(\"\
    user\", user);\n}\n\nreturn context.proceed();\n```\n\n@PostConstruct\npublic\
    \ void onCreate() {\n    Logger.getLogger(\"SecurityLog\").info(\"Activating\"\
    );\n}\n\n@PreDestroy\npublic void onDestroy() {\n    Logger.getLogger(\"SecurityLog\"\
    ).info(\"Deactivating\");\n}\n\nBecause the hooks rely on annotations, method\
    \ names do not make a difference; you can use any name.\n\n# Default-Level Interceptors\n\
    \nMarking the target advice with Interceptor annotations provides an easy implementation\
    \ and setup, but the nature of AOP usually allows for more. Most scenarios require\
    \ the interceptor to perform its operation targeting all devices. Imagine adding\
    \ interceptors for logging or security—targeting only a subset of EJB would work\
    \ nicely. Also, annotating each EJB can become cumbersome and can easily lead\
    \ to human error.\n\nJava EE offers default-level interceptors to target all or\
    \ subsets of EJB matching the naming scheme provided. Unlike the previous example,\
    \ to implement default-level interceptors, you need XML configuration:\n\n```\n\
    <ejb-jar>\n  <interceptor>\n    <interceptor>\n      <interceptor-class>\n   \
    \     com.devchronicles.SecurityInterceptor\n      </interceptor-class>\n    </interceptor>\n\
    \  </interceptor>\n  <assembly-descriptor>\n    <interceptor-binding>\n      <ejb-name></ejb-name>\n\
    \      <interceptor>\n        <interceptor-class>\n          com.devchronicles.SecurityInterceptor\n\
    \        </interceptor-class>\n      </interceptor>\n    </interceptor-binding>\n\
    \  </assembly-descriptor>\n</ejb-jar>\n```\n\nwww.it-ebooks.info"
