  md: 'UI Frameworks are another place where observers are heavily used, although
    this is more related

    to desktop applications, not enterprise applications. In the context of UI frameworks,
    the observer

    pattern is referred to as the listener pattern. Essentially, these patterns are
    the same. Button

    click listeners, drop drag handlers, and value change listeners rely on an implementation
    of the

    observer pattern.


    Almost all web frameworks are built on the model-view-controller pattern, which
    also uses the

    observer pattern internally. See Chapter 14, “Model View Controller Pattern,”
    for more details.


    # WAR STORY


    For a long time, part of my daily job has been to mentor interns and fresh

    graduates. This war story goes back to a talented intern I had the chance to work

    with. This bright electronics graduate had more experience with hardware and

    structural programming using object-oriented languages; therefore, she had little

    knowledge of design patterns. She had just completed a successful Arduino-based

    project.


    We started developing an Android that used Android''s built-in face

    detection to detect whether the user was in front of the device. Coming

    to Android project, the intern''s first approach was to create a loop to

    camera and see if it detected a new face. This loop was running in the main

    application thread, so it was blocking the application.


    After realizing that she had locked the UI thread, she decided to create a separate

    thread to perform the face detection job. She was using the “if the only tool
    you

    a a hammer, every problem looks like a nail” approach.We chatted for a

    while about how the Arduino application was structured. For the Arduino, the

    whole application was a loop that we wanted to keep running until we stopped

    it, and all program features were handled in that loop. However, our Android

    application had a different structure. The application needed to be informed of

    when there was a face rather than querying the camera to see if a face had

    detected. This graduate understood how observers work, she didn''t

    much difficulty implementing the pattern because the Android system was already

    built on the observer pattern. All she needed to do was add the appropriate listener

    class and perform whatever function when a face was detected.


    # Observer Class Diagram


    As can see from Figure 11-1, the observer pattern introduces an Observer interface
    that all

    concrete observers must implement. It has just one method that is called by the
    subject

    to notify the observers that there has been a change in state. Each subject holds
    a list of registered

    observers and calls the notifyObservers method to inform the registered observers
    about any

    updates or changes in the subject. It has methods for registering and unregistering
    observers.'
