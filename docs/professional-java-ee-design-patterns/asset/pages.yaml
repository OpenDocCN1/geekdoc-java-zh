  md: "# Where and When to Use the Observer Pattern | 149\n\nIn progress: Successful\
    \ event\nAfter completion message: Successful event\nAfter success message: Successful\
    \ event\n\nThe inProgress method is invoked immediately when the event is fired\
    \ and the transaction is still in flight. The other methods—onCompletion and onSuccess—must\
    \ wait until the transaction reaches the AFTER_COMPLETION and AFTER_SUCCESS phases,\
    \ before they can execute.\n\nNext you'll look at the getSixByteCb method, which\
    \ fails by causing an IndexOfBoundsException. The output that results from calling\
    \ this method follows:\n\n+   - In progress: Rollback event occurred.\n- Exception\
    \ caught.\n- After completion message: Rollback event occurred.\n- After failure\
    \ message: Rollback event occurred.\n\nAs before, the inProgress method is invoked\
    \ immediately, and the onCompletion and onFailure method must wait until the method\
    \ completes. Once the inProgress method outputs the Exception caught and the transaction\
    \ is marked for rollback by calling the SessionContext method setRollbackOnly,\
    \ the inProgress method completes, and you can execute your observers. The completion\
    \ method is executed, followed by the onFailure method.\n\nThe setRollbackOnly\
    \ method marks the current transaction for rollback, so it can never be committed.\
    \ This action triggers the transaction into the AFTER_FAILURE phase and invokes\
    \ the onFailure method.\n\nObservers can also be conditional behavior, although\
    \ it's limited to being notified if an instance of the bean defines the observer\
    \ already exists in the current context. The observer method is called only if\
    \ an instance exists. To define an observer method with conditional, add notifyObserver\
    \ = Reception.IF_EXISTS as an argument to the @Observes annotation.\n\n```\nimport\
    \ javax.enterprise.event.Reception;\n\npublic void addMember (\n    @Observes(notifyObserver\
    \ = Reception.IF_EXISTS) String message) {\n    // Implementation code.\n}\n```\n\
    \nThe default behavior is to create an instance if it does not exist.\n\n# WHERE\
    \ AND WHEN TO USE THE OBSERVER PATTERN\n\nThe observer pattern, which can unleash\
    \ huge performance gains, is an effective way to promote loose coupling and change\
    \ the direction of calling/listening.\n\nWhen designing your application or refactoring\
    \ your code, watch out for unnecessary and time interval-based method executions,\
    \ which can be good candidates for implementing the observer pattern.\n\nwww.it-ebooks.info"
