  md: '# Implementing a Timer in Java EE | 135


    The asterisk character is a placeholder for all possible values for the given
    attribute. For example, to set a schedule to trigger every hour, you would use
    the expression hour="*" for annotation-configured timers. For programmatic timers,
    you would invoke the method hour("*") on an instance of the ScheduleExpression
    class,


    You can express values for each attribute as a list or a range. For example, the
    dayOfMonth="1, 15, last" sets the timer to trigger on the first, fifteenth, and
    last day of month, whereas the expression hour="8-18" represents every hour from
    08:00 to 18:00.


    You can specify intervals and amount with a starting point. The expression hour="8/1"
    triggers every hour starting from 08:00, whereas the expression hour="*/12" triggers
    every 12 hours. However, you can only set intervals for seconds, minutes, and
    hour attributes.


    Table 10-4 shows a few examples of the calendar-based schedule in action


    TABLE 10-4: Examples of Expressions in Action

    | Expression | Action |

    | --- | --- |

    | Second="10" | Every ten seconds |

    | hour = "2", | Every two hours |

    | minute = "15" | Every 15 minutes |

    | dayOfWeek="Mon, Fri" | Every Monday and Friday at midnight |

    | dayWeek="0-7", hour="8" | Every day at 8 a.m. |

    | dayOfMonth="-7" | Five days before the end of every month at midnight |

    | dayOfMonth="1st Mon, hour="22" | First Monday of every month at 10 p.m. |

    | Month="Mar", dayOfMonth="15" | The 15th of the following March |

    | year="2015", month="May" | May 1, 2015 at midnight |


