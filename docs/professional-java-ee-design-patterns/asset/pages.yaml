    # WHAT IS THE MICROSERVICE ARCHITECTURE?


    Over the past few years, the microservice architecture pattern has become a hotly
    discussed and popular pattern. The idea behind it is to design a large distributed
    scalable application with small of cohesive services that are able to evolve or
    be completely rewritten over the life of the application.


    This is not a new idea, and is similar to the Service Oriented Architecture (SOA)
    pattern that has been in use for a long time. The essence of the microservice
    is the idea that each service should be small—perhaps as small as a few hundred
    lines of code. The objective is to decompose a large, monolithic application into
    much smaller applications to solve development and evolutionary problems.


    This chapter discusses the reasons for following the microservice path, its disadvantages
    and benefits, and how it compares to the more established and familiar monolithic
    architecture.


    # Monolithic Architecture


    The most common way to develop and pack a web application has always been to collect
    all the resources, components, and classes into a single web application Archive
    (WAR) or Enterprise Archive (EAR) file and deploy it to a web server. A typical
    application for a bookstore might include components that manage the user''s accounts,
    process payment, control stock, administer customer services, and generate front-ends.
    All this is developed in one monolithic application and then packaged and deployed
    to a web server. Figure 15-3 shows a simplified representation of a monolithic
    application.'
