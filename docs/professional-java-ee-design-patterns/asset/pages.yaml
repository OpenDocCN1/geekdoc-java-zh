    # Harness the Power of CDI


    If your application has multiple implementations of an interface and you want
    to implement a factory pattern to produce the required instances of these objects,
    you are going to have a factory class with multiple methods annotated with the
    @produces annotation. This will become verbose and difficult to maintain. Fortunately,
    Java EE provides a solution in the form of the @Any annotation and the imaginative
    use of enum types, annotation literals, and the Instance class.'
