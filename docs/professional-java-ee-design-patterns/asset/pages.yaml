  md: "# 58 | CHAPTER 5 DEPENDENCY INJECTION AND CDI\n\nA bean annotated with a scope\
    \ holds for the duration of the scope and shares that state with any client that\
    \ runs in the same scope. For example, a bean in the request scope holds state\
    \ for the lifetime of the HTTP request, and a bean with session scope holds for\
    \ the lifetime of the HTTP session. The scoped bean is automatically created when\
    \ it is needed and destroyed when the context in which it takes part finishes.\n\
    \nThe scope annotations are often used to give scope to beans that are used via\
    \ Expression Language (EL) in Facet pages.\n\n# Naming and EL\n\nA bean annotated\
    \ with @Named is accessible through EL. By default, the name used in the expression\
    \ is the name of the class with the first letter in lowercase. To refer to getters\
    \ methods that start with get or is, omit the get or is part of the method name.\
    \ Listing 5-11 shows an example.\n\nLISTING 5-11: The @Named annotation makes\
    \ a bean visible to EL\n```java\npackage com.devchronicle.di;\n\nimport javax.enterprise.context.RequestScoped;\n\
    import javax.inject.Named;\n\n@Named // Defining that this is a managed bean\n\
    @RequestScoped // Defines the scope\npublic class User {\n\n    private String\
    \ fullName;\n\n    public String getFullName() {\n        return this.fullName;\n\
    \    }\n\n    // some methods not included for brevity\n}\n```\n\nThis is a implementation\
    \ of a named bean that returns a String when the getFullName method is used. In\
    \ a Facets page, you could refer to this method as user.fullname.\n\n```\n<form\
    \ id=\"user\">\n  <p><h:outputText value=\"#{user.fullname}\"></></p>\n</form>\n\
    ```\n\n# CDI Beans for Backing JSF\n\nIn the previous example, CDI Beans serve\
    \ as backing beans for JSF pages. You can access named beans via the name of the\
    \ bean with a lowercase first letter. You can access Getter/Setter fields and\
    \ methods within JSF pages using Java conventions. Details of JSF go beyond the\
    \ scope of this book, but Listing 5-11 demonstrates a basic usage of CDI Beans\
    \ with JSF."
