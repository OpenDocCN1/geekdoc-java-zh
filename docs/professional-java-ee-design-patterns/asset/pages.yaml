  md: '# WHAT IS MESSAGE-ORIENTED MIDDLEWARE


    The communication between components in a Java EE system is synchronous. A call
    chain is started from the calling Enterprise JavaBean (EJB) to a data access object
    (DAO) to the entity, and so on to the final target. All components of the call
    chain must be available to receive the call, and the calling component must wait
    for a response before proceeding. The success of the invocation depends on the
    availability of all components. As you saw in Chapter 9, "Asynchronous," an invocation
    of an asynchronous method does not require the calling object to wait for a response.
    It can continue with the normal flow of execution, while the asynchronous method
    sets up its own call.


    Message-oriented middleware (MOM) provides a type of buffer that allows the communication
    to be delayed if a component is not up or running. Messages are delivered as soon
    as all components are available. Invocations are translated into messages and
    sent via a messaging system that processes the message and respond. If the target
    component is not available, the messages are queued waiting for the system to
    become available. When the component is available, the messages are processed.


    At one end of the chain is a producer that translates the call into a format that
    can be transmitted as a message, and at the other end is a consumer who receives
    the message. The consumers and producers are highly decoupled, because they don''t
    know about each other. They don''t have to be in the same language or hosted on
    the same network; they may even be distributed over external servers.


    A MOM system is composed of four players: messages, consumers, producers, and
    brokers. Producers generate the messages and send them to brokers, who distribute
    the messages to destinations until a consumer connects and processes them.


    There are two architectural implementations of MOM: point-to-point and publish/subscribe.


    In the point-to-point implementation, the producer sends a message to the destination,
    which is called a queue. In the queue, the message waits for a consumer to pick
    it up and confirm that it has been processed successfully. Figure 15-1 shows the
    producer putting M1 into the queue and then the consumer picking up the message
    from the queue and processing it. In this implementation the message is only processed
    by one consumer.


    ![](img/ad3069372493fd36d3f3789232291bb2_231_0.png)


    FIGURE 15-1: Point-to-point implementation


    In the publish/subscribe implementation, the destination is called a topic. A
    producer publishes a message to a topic, and all consumers who subscribe to that
    topic receive a copy of the message. This is shown in Figure 15-2, where M1 and
