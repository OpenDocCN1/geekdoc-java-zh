    The microservice approach decomposes a monolithic application along the Y-axis
    into services that satisfy a single case or a set of related functionality. These
    services are then duplicated on several servers and placed behind a load balancer.
    Data persistence may be scaled along the Z-axis by sharding the data based on
    a primary key.'
