    # WAR STORY


    Several years ago, a close friend of mine who owned a small software company asked
    me to interview a candidate. Because I always find job interviews great engineer-to-engineer
    experience, I didn''t hesitate to jump at the opportunity. The candidate had only
    a few years of experience but graduated from a good university and was definitely
    sharp. We had a long chat about Java, JPA, Spring, and other well-known Java frameworks.
    He was eager to learn and try new and handled all questions calmly.


    After an hour, the interview was finished, but we continued to talk casually.
    I asked him about the books he had read recently, and his reply was Head First
    Design Patterns. I inquired about interesting or wanted to talk about. Surprisingly,
    it was the singleton pattern. This made my simple and to implement, so it would
    be a safe topic. The truth wasn''t. If he had chosen another pattern as the decorator,
    I would not have the opportunity to dive into the more advanced topics of this
    seemingly simple pattern.


    I asked the candidate how he would implement a singleton. He responded with the
    classic private constructor method, which clearly showed he hadn''t read Effective
    Java and had no clue about the enum type. I asked, “What if I used reflection
    to access the level of the constructor back to public?” He was surprised, but
    I could clearly see from his eyes that he was more interested in going home and
    thinking about idea. He couldn''t come up with a solution, but he also didn''t
    make up a nonsense response. He was busier getting and thinking about the reflection
    idea.


    This job candidate may have missed the right answer, but he showed he was passionate
    and eager to learn. He was hired and became one of the best developers I ever
    worked with.


    # IMPLEMENTING THE SINGLETON PATTERN IN JAVA EE


    All the code examples far have demonstrated the use of singletons within the context
    of Java EE. Although you can use them in Java EE, there is a more elegant and
    easy-to-use approach: singleton beans.'
