  md: 'The singleton pattern is one of the patterns described in the GoF¹ book. A
    singleton class guarantees the production of only one instance of its type. Having
    only one instance can be useful in several cases, such as with global access and
    caching expensive resources; however, it may introduce some problems of race conditions
    if the singleton is used in a multithread environment. Because most programming
    languages do not provide a built-in mechanism to create singletons, developers
    must create their implementations.


    However, Java EE has a built-in mechanism that gives the developer to create a
    singleton via an annotation to the class.


    # WHAT IS A SINGLETON?


    According to GoF, the singleton pattern is used to “ensure a class has only one
    instance, and provide a global point of access to it.” Head First Design Patterns²
    offers the same explanation and points. Singletons are often used in combination
    with patterns (discussed in Chapter 6, “Factory Pattern”).


    Singletons are commonly used for the following purposes and situations:


    +   - To access data across the whole application domain, such as configuration
    data

    - To load and cache expensive resources only once, allowing global shared access
    and improve performance

    - To create an application logger instance, because normally only one is required

    - To manage objects within a class implementing the factory pattern

    - To create a facade object, because normally only one can be lazily instantiated


    Spring uses singletons when creating beans (by default, Spring beans are singletons),
    and Java EE uses singletons internally, as in the service locator. Java SE also
    uses the singleton pattern in the implementation of the runtime class. Singletons
    are definitely helpful if you use them in the right context.


    Nevertheless, the use of the singleton pattern may unnecessarily make caching
    resources and not letting the garbage collector reclaim objects and free valuable
    memory. It may do not realize the advantages of object creation and inheritance.
    An unusually high usage of singletons is considered a sign of poor object-oriented
    design, which may cause memory and performance issues. Another problem is that
    singletons are not great when it comes to unit testing. Later, this chapter discusses
    in more the details surrounding the use of the singleton pattern.


    # Singleton Class Diagram


    As you can see from the class diagram in Figure 4-1, the singleton pattern is
    based on a single class that holds a reference to the only instance of itself
    while controlling its creation and its access via the single getter method.


    | Singleton |

    | – instance: Singleton |

    | – Singleton () |

    | + getInstance() : Singleton |


    FIGURE 4-1 The singleton pattern class diagram'
