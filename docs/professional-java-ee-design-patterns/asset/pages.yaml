    \ only a single request and response; however, HTTP 1.1 allowed web applications\
    \ to keep the connection alive and send multiple requests. On a standard implementation,\
    \ the Java back end need a separate thread constantly attached to the HTTP connection.\
    \ However, Java nonblocking I/O (NIO) APIs recycle threads between active requests,\
    \ thanks to new NIO capability. All web servers with Servlet 3.0 specification\
    \ have built-in support for Java NIO. Why do you need such behavior from servlets?\
    \ The nature of back-end systems involves lengthy operations such as connecting\
    \ to other servers, performing complex calculations, and making transactional\
    \ database operations. However, the nature of web users requires fast response\
    \ times and a functional UI even if back-end operations are completed. AJAX addressed\
    \ this issue for the browser and started the Web 2.0 revolution.\n\nServlet 3.0\
