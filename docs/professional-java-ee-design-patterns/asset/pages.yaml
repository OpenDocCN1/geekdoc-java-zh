  md: "# Implementing the Abstract Factory in Plain Code\n\nTo demonstrate the abstract\
    \ factory design pattern, this chapter extends the drinks machine example by adding\
    \ a factory that produces two different types of drinks machine: basic and gourmet.\n\
    \nThe \"families of related or dependent objects\" that the abstract factory creates\
    \ are the coffee machine and the soft drinks machine. You must create an interface\
    \ for the factories to implement. Listing 6-8, we create the AbstractDrinksFactory\
    \ interface.\n\n+   LISTING 6-8: Interface for the abstract factory\n\n```\npublic\
    \ interface AbstractDrinksFactory {\n    public DrinksMachine createCoffeeMachine();\n\
    \    public DrinksMachine createSoftDrinksMachine();\n}\n```\n\nThe concrete implementations\
    \ of this interface are the GourmetDrinksFactory and the BasicDrinksMachineFactory\
    \ classes. For brevity, the GourmetDrinksMachineFactory is shown in Listing 6-9.\n\
    \n+   LISTING 6-9: Implementation of the AbstractDrinksMachineFactory\n\n```\n\
    public class GourmetDrinksMachineFactory implements AbstractDrinksMachineFactory\
    \ {\n\n    public DrinksMachine createCoffeeMachine() {\n        return new GourmetCoffeeMachine();\n\
    \    }\n\n    public DrinksMachine createSoftDrinksMachine() {\n        return\
    \ new GourmetSoftDrinksMachine();\n    }\n}\n```\n\nEach factory implements the\
    \ abstract factory's create method in a different way, and depending on which\
    \ factory is instantiated, a different implementation of a coffee and soft drinks\
    \ machine is created.\n\n```\nAbstractDrinksMachineFactory factory = new GourmetDrinksMachineFactory();\n\
    DrinksMachine coffee = factory.createCoffeeMachine();\nCoffee.dispenseDrink(CoffeeType.EXPRESSO);\n\
    ```\n\nThis shows a GourmetDrinksMachineFactory being instantiated. Its coffee\
