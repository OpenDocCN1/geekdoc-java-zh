  md: '# FOREWORD


    > Ignorant men raise questions that wise men answered a thousand years ago


    JOHANN WOLFGANG VON GOETHE


    Design patterns are our link to the past and the future. They make up a foundational
    language that represents well understood solutions to common problems that talented
    engineers before have added to our collective knowledge base. Design patterns
    or blueprints exist in every engineering field one way or another. Software development
    is no different. Indeed, design patterns are probably our most tangible link to
    engineering rather than the organic and less regimented world of the artisan or
    craftsman. The art and science of design patterns was brought to the world of
    software engineering—and more specifically to enterprise Java—by the seminal Gang
    of Four (GoF) book. They have been with us ever since our adventures in J2EE,
    Spring, and modern lightweight Java EE. This is for very good reasons. Server-side
    Java developers tend to write the type of mission critical applications that need
    to stand the test of time and hence benefit from the discipline that design patterns
    represent.


    It really takes a special kind of person to write a book on design patterns, let
    alone a book on how to utilize design patterns in Java applications. You require
    not only basic knowledge of APIs and the patterns themselves, but deep insight
    that can come with hard-earned experience, as well as an innate ability to explain
    complex concepts elegantly. I am glad Java now has Murat and Alex to accomplish
    the mighty.


    This book fills a needed gap and fills it well. It is also very good book that
    is on the cutting edge of Java EE 7 and not just Java EE 6 or Java EE 5. In many
    of the design patterns, like Singleton, Factory, Model-View-Controller (MVC),
    Decorator, and Observer, are now incorporated into the Java EE platform. Others
    like Facade, Data Access Object (DAO), and Data Transfer Object (DTO) fit elegantly
    on top. Murat and Alex tackle each pattern, explain their pragmatic motivation,
    and discuss how it fits into Java EE.


    It is an honor and privilege to write a small opening part of this very important
    book that I hope will be a very useful part of every good Java EE developer''s
    bookshelf. I hope you enjoy the book, and that it helps you write better, more
    satisfying enterprise Java applications.


    M. REZA RAHMAN

    Java EE/GlassFish Evangelist

    Oracle Corporation


    www.it-ebook.info'
  merge: -1
