  md: "```\nimport javax.interceptor.Interceptors;\n\n@ExcludeDefaultInterceptors\n\
    @ExcludeClassInterceptors\n@Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\n\
    public class SomeService {\n\n    public void startService() {\n        // Complex\
    \ business logic\n        Logger.getLogger(\"AppLog\").info(\"done...\");\n  \
    \  }\n\n    public void startAnotherService() {\n        // Complex business logic\n\
    \        Logger.getLogger(\"AppLog\").info(\"done again...\");\n    }\n}\n```\n\
    \nThe example given is only valid in EJB and MDBs, which may not be enough for\
    \ all cases. Thanks to CDI, it is not enough to achieve more.\n\n# CDI Interceptors\n\
    \nBefore CDI, interceptors were applicable only for EJB and MDBs. CDI unleashed\
    \ a huge power and transformed interceptors into an AOP-capable feature that works\
    \ on any object.\n\nImplementing CDI interceptors is straightforward and quite\
    \ flexible. There you need to specify a binding. A binding is a class annotated\
    \ with @InterceptorBinding.\n\n```\n@InterceptorBinding\n@Target({TYPE, METHOD})\n\
    @Retention(RUNTIME)\npublic @interface Secure { }\n```\n\nThe @InterceptorBinding\
    \ is used to bind interceptors with the target code. Then you can implement and\
    \ annotate the interceptor with the same way as the EJB interceptors, the only\
    \ significant difference being the use of the binding annotation which be found\
    \ in Listing 8-10\n\nLISTING 8-10: Binding an Interceptor with @Secure\n\n```\n\
    import javax.interceptor.AroundInvoke;\nimport javax.interceptor.InvocationContext;\n\
    \n@Secure\n@Interceptor\npublic class SecurityInterceptor {\n\n    @AroundInvoke\n\
    \    public Object doSecurityCheck(InvocationContext context) throws Exception\
    \ {\n        // ...\n    }\n}\n```"
