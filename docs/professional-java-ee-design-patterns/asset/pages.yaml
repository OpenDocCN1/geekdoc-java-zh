    \ and have no an immediate effect on runtime behavior because it directly switches\
    \ to the asynchronous execution model. Asynchronous servlets provide a clean implementation\
    \ without a lot of boilerplate code.\n\n# WHERE AND WHEN TO USE ASYNCHRONOUS PROGRAMMING\n\
    \nYou can use the asynchronous pattern almost anywhere where it is required to\
    \ return a response before all the execution is complete. This approach can vary\
    \ executing the most important functions of the application asynchronous, such\
    \ as logging or keeping the user informed about a time-consuming operation. Asynchronous\
    \ programming makes the critical execution path shorter while delegating subsets\
    \ to other threads. The result is better response times.\n\nAsynchronous annotation\
    \ is a simple way to implement asynchronous methods or convert existing ones.\
    \ Each method marked with the asynchronous annotation runs in a separate thread\
    \ without locking the current thread's execution. This behavior is a perfect match\
    \ for tasks that do not affect the main execution cycle but need to be performed\
    \ on the back end. Examples include logging and maintenance resources.\n\nYou\
    \ can use asynchronous behavior in almost all web apps. Asynchronous servlets\
    \ provide nonblocking execution without a special need for AJAX. Asynchronous\
    \ servlets can help when a server-based push operation is needed, such as updating\
    \ information or delivering a message.\n\nBecause each asynchronous execution\
    \ requires a new thread, the Java Virtual Machine (JVM) needs to perform more\
    \ context switches as more asynchronous methods are implemented. A large number\
    \ of context switches can cause starvation and result in poorer performance than\
    \ a synchronous implementation.\n\nImagine that you are reading one book. Reads,\
    \ you remember the story, the characters, and the last page you've read. If you're\
    \ reading two books at the same time, you may finish the second book without needing\
    \ to finish the one you started. The time spent changing context from one book\
    \ to the other is not acceptable.\n\nReading six books in parallel would be challenging.\
    \ It may require so many context changes that you may not be able to finish any\
    \ of the books in the expected time and end changing from one book to the other\
    \ without making progress in any of them.\n\nwww.it-ebooks.info"
