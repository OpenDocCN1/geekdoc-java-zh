  md: '# Implementing the Façade Pattern in Plain Code


    didn''t have spaghetti code, but we had more layers than a meat lasagna. We were
    quite happy in our little world—that was, until other teams started to use our
    core services. Very soon, both the performance of the system and our ability to
    handle change requests started to suffer.


    We contracted a fancy and expensive consultant from one of our vendors to analyze
    our system. He had a few meetings, spent some time browsing our code base, and
    found that refactoring was in order, so he façades and related interfaces. The
    result was that we had less to maintain and much better performance, so everyone
    was happy. The moral of this story is to use patterns—even the simple ones—sparingly
    and only when you need them, and definitely don''t show off your knowledge of
    patterns.


    # Façade Class Diagram


    As can be seen in the class diagram in Figure 3-1, the façade pattern provides
    a simple interface to an underlying system. It encapsulates the complicated granular
    logic.


    ![](img/ad3069372493fd36d3f3789232291bb2_60_0.png)


    **FIGURE 3-1** Class diagram of the façade pattern


    # IMPLEMENTING THE FAÇADE PATTERN IN PLAIN CODE


    Implementing the façade pattern isn’t’t complicated. It doesn''t’t enforce a strict
    structure or rule set. Any method that provides easy access to a complicated flow
    could be considered an implementation of the façade pattern.


    Now you’ll implement the washing machine example given in the introduction as
    shown in Listing 3-1. You need two methods—heavilySoiled—d and lightlySiled—d—that
    represent the two washing modes. All complicated work (the selection of water
    temperature, spin cycle duration, decision to add bleach or not) is performed
    in methods invoked from within the façade.'
