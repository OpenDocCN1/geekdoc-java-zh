  md: "The Hypertext Transfer Protocol (HTTP) model was designed long before the Internet\
    \ was popular, and in the traditional HTTP model, a client opens a connection\
    \ to the back-end server, sends an HTTP request of type GET, POST, PUT, or DELETE,\
    \ and the HTTP server returns an appropriate response. There have been several\
    \ attempts to hack and communicate over HTTP, such as AJAX, and a new design such\
    \ as SPDY.\n\nThe traditional HTTP model has been cumbersome for almost any application\
    \ that goes beyond the simple get-and-submit content model. Think about a chat\
    \ client, in which the participants can send messages in order, and hundreds can\
    \ be chatting at the same time. The standard-request-response approach would be\
    \ too limiting for such purposes. Some early approaches to get past this limitation\
    \ were AJAX and Comet. Better relied on long polling: opening an HTTP connection\
    \ and keeping it alive (maintaining the connection open) by not finalizing the\
    \ response.\n\nWith WebSockets, the client can initiate a raw socket to the server\
    \ and execute full-duplex communication. WebSockets support supported using JSR-356.\
    \ The package javax.websocket contains all classes, interfaces, and annotations\
    \ related to WebSockets.\n\nTo implement WebSockets in Java EE, you need to create\
    \ an endpoint with the WebSocket lifecycle methods shown in List-15.\n\n# LISTING\
    \ 15-1: An example of an endpoint\n\n```\npackage com.devchronicles.websockets;\n\
    public class HelloEndpoint extends Endpoint {\n\n    @Override\n    public void\
    \ onOpen(final Session session, EndpointConfig config) {\n        session.addMessageHandler(new\
    \ MessageHandler<Whole<String>>() {\nn            @Override\n            public\
    \ void onMessage(String msg) {\n                try {\n                    session.getBasicRemote().sendText(\"\
    Hello \" + msg);\n                } catch (IOException e) {\n            }\n \
    \       });\n    }\n}\n```\n\nThe Endpoint introduces three lifecycle methods:\
    \ onOpen, onClose, and onError. At least the extending class needs to implement\
    \ the onOpen method.\n\nYou can deploy this endpoint in two different ways: either\
    \ by configuration or programmatically. To programmatically deploy the code in\
    \ List 15-1, your application needs to invoke the following:\n\n```\nServerEndpointConfig.Builder.create(HelloEndpoint.class,\
    \ \"/hello*\").build();\n```"
