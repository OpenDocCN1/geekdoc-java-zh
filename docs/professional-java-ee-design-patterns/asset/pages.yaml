  md: '114 | CHAPTER 9 ASYNCHRONOUS


    Java was designed to support multiple threads from its start. However, it failed
    to provide a simple approach to matching asynchronous calls. The Future<T> interface,
    which was introduced in Java 5, Java''s first attempt at implementing asynchronous
    programming, and it was cumbersome and tricky to use. Subsequent versions of Java
    introduced the @Async annotation. The asynchronous servlet provided a much better
    set of tools to aid in asynchronous programming.


    # WHAT IS ASYNCHRONOUS PROGRAMMING?


    The asynchronous programming pattern is a special and well-integrated case of
    multiple threads. Due to the nature of threads, multithreading models need to
    notification systems and depend on boilerplate code to initiate threads.


    Asynchronous calls are used in single-threaded environments like Node.JS. Almost
    all user interface (UI) frameworks use asynchronous execution to keep UI active
    and responsive. The "A" of AJAX, which the Web 2.0 movement, stands for asynchronous.


    However, asynchronous programming can be useful in places other than user interfaces,
    typically on the other side. J2SE not JEE offered a built-in implementation for
    asynchronous programming. With Java 5, the Concurrency Framework, based on JSR166,
    was released. JSR166 included many units that made asynchronous programming easier,
    faster, and better. The Future<> interface also provided a way to help developers
    to implement asynchronous method execution.


    Meanwhile, Spring offered asynchronous method calls, which are enabled with annotations.
    Java EE did not include such a convenient solution until version 6.0. The @Async
    annotation was introduced with Java EE 6 and offered an easy way to implement
    asynchronous method method execution.


    # Asynchronous Pattern


    Asynchronous programming is not listed as a design pattern in either the GoF book
    or in the Head First Design Patterns*. If it were, this description might be "A
    way to invoke a method without blocking the invoker."


