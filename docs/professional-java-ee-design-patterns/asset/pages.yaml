  md: '# INTRODUCTION


    # WHAT YOU NEED TO USE THIS BOOK


    Any modern computer with an operating system that has a Java Virtual Machine (JVM)
    implementation is sufficient to run the samples given in this book. For ease of
    coding, you need an integrated development environment (IDE) of your choice. The
    sample can run on any modern IDEs including Eclipse, NetBeans, and IntelliJ.


    You need the Java Development Kit (JDK) for Java EE7 to be able to compile and
    run the code samples, but some of the code samples would also work on previous
    Java EE JDKs.


    You can use any Java EE7-compliant application server to run the samples. We ran
    all the code samples on Glassfish, which is the reference implementation server,
    and TomEE, which is the EE version of the popular Java web server Tomcat. You
    can use any server, but because Glassfish is the reference implementation, you
    might want to try it for the samples.


    To run the samples in this book, you will need the following:


    +   * An operating system that has a JDK for Java EE7, such as Linux, Mac OS X,
    or Windows

    * Java EE 7 JDK

    * An IDE of your choice, such as Eclipse for Java EE Developers, NetBeans, or
    IntelliJ

    * Java EE 7-compliant application server as Glassfish or TomEE


    The source code for the samples is available for download from the Wrox site at:

    www.wrox.com/go/projavaeeedesignpatterns


    # MOTIVATION FOR WRITING


    In November 2011, after having a debate on Java EE versus Spring for a project,
    I went back to my desk and wrote a blog post titled "Java EE 6 and the Ewocks,"
    which became popular quickly. The story was based on the TV show *How I Met My
    Mother*. In this show, Barney, the playboy, introduced a theory that was focused
    on Ewoks, the teddy-like creatures introduced in Episode VI of Star Wars. Fans
    have made feelings on Ewoks.


    According to Barney, those before May 25, 1973, when *Return of the Jedi* was
    released, then Ewoks are childish and simple have them. however, after that before
    date find Ewoks because they reason they are teddy bears.


    Now back to my story. Engaging in a debate with a customer about Java EE Spring
    made me realize that it''s the theory. Those who were old enough to use J2EE 1.4
    (EJB 1.0/2.0/2.1) in corporate projects had a slow, unproductive development environment
    with RAM-eating buggy IDEs and servers taking several minutes to boot. The architecture
    was over engineered and probably failed, resulting in a migration to Spring. These
    users tended to Java EE with a passion, no matter what version they used. The
    release of Java EE 5 was underestimated and did not impress anyone.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Java EE will never be J2EE again. It is now open, has a large community and
    reshapes itself by assimilating good ideas from frameworks like Spring and Hibernate.
    The first great change was the architecture and style of coding. Enterprise JavaBeans
    (EJB) followed the lightweight Plain Old Java Object (POJO) model, almost unusable
    entity beans were replaced with Java Persistence API (JPA), REST and Web Services
    became standard and parts of the runtime, and annotations replaced XML configuration.
    Some might argue that Java EE 5 was not ready for the huge shift because it was
    not mature as Spring, and the development environment was still not responsive.
    Using Spring on Tomcat instead of EJBs and Java EE on an application server greatly
    increased the productivity, but Java EE 5 was still a big step forward towards
    leveraging, and architecting the Java platform from scratch.


    This shift by Java EE 6 and 7, which used the same principles and ideas as Java
    EE 5. Java EE is a great choice for development, but the debate was not over,
    thanks to the Ewok theory.


    It was a hot August day when I first got a call from Wrox/Wiley about writing
    a Spring book. I was experienced with implementing and developing in Spring, but
    there were almost tons of books written about it, which made it hard to see the
    value in writing a new one.


    Besides, I was using Java EE more than ever since version 6 had been released.
    Considering the Spring versus Java EE debates, my blog posts, and the Ewoks, I
    like writing about Java EE. However, just like Spring, there were many great Java
    books that I admired. I always had the feeling that some properties of Java EE
    were underrated. Java EE has great built-implementations design patterns with
    simple use of annotations.


    The classic patterns listed in the Go book were used extensively in almost all
    languages, frameworks, and patterns. J2EE was no exception and not Java EE. Actually
    Java EE took a bold step in providing default implementations for many of those
    patterns, but even most of the experienced developers underestimated the value
    of those out of the implementations.


    I had been blogging about those patterns for almost a year, so I decided to present
    a counteroffer to write a book on the "classic" design patterns in Java EE. As
    you are reading this book now, you may get the feedback positive.


    This book fills the gap between the Java EE platform with the classic design patterns
    of the GoF book as well as talking about new patterns. We did not write another
    Java EE book but a catalogue for design patterns in Java EE.


    I started blogging, writing and getting talks on design patterns in Java EE to
    extend my knowledge and experience on a platform I really believed in, so the
    was the best thing about writing this book for me that I had the chance to write
    about something I was really passionate about. Although my blog had simpler examples,
