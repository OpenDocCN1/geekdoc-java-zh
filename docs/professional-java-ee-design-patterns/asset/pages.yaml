  md: '# SUMMARY


    It has briefly mentioned that the singleton pattern has fallen out of favor to
    the point in many developers and architects now consider it an anti-pattern. The
    singleton pattern''s unpopularity extends from problems caused by its overuse
    and its evident shortcomings in multithreaded applications.

    Programmers have overused and abused the singleton pattern because it is a simple
    to implement. Every class becomes a nightmare for developers who must maintain
    the code, and it becomes an even greater challenge for those who have to refactor
    the singletons into object-oriented code when it is discovered that more than
    one instance of a singleton class is required.

    The use of singleton classes has made test more complicated because global states
    are instantiated to run a unit test. Furthermore, singletons have made less deterministic
    because these states might change, affecting the outcome of the tests.

    You have seen in the code examples the numerous difficulties that singletons pose
    in multithread environments. It was difficult to create a singleton that was guaranteed
    safe before Java SE 5 and the introduction of the enum type.

    With many advances in Java EE, the problem of thread-safe singletons has largely
    resolved with the @Singleton annotation and another concurrency control.

    The container controls the creation of the singleton and ensures that no business
    method is called before the @PostConstruct completes. The container also controls
    the concurrency of access to the bean via the @ConcurrencyManagement annotation,
    and its associated #LockType annotation allows fine-grain control over each method.

    By no means every problem of the singleton has been resolved. There could be problems
    in multinode environments if the bean is used to access back-end non-thread-safe
    resources. Bottlenecks and tight coupling of classes could provide additional
    problems.

    Though the singleton pattern has suffered from abuse and overuse by developers,
    leading to its eventual relegation to an anti-pattern, it has never matured since
    it was introduced by Go and should be reconsidered as a valuable and viable design
    pattern.


