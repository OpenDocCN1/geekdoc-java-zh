  md: "# Singleton Beans\n\nIn Chapter 2, \"The Basics of EE,\" you saw the use of\
    \ stateless and stateful session beans via a simple annotation configuration.\
    \ Luckily, singletons offer a similar approach. By adding the @Singleton annotation\
    \ to a class, you can turn it into a singleton bean as shown in Listing 4-7.\n\
    \nLISTING 4-7: The implementations of the singleton pattern using @singleton\n\
    \n```\npackage com.devchronicles.singleton;\n\nimport java.util.HashMap;\nimport\
    \ java.util.Map;\nimport javax.annotation.PostConstruct;\nimport javax.ejb.Singleton;\n\
    import java.util.logging.Logger;\n\n@Singleton\npublic class SingletonBean {\n\
    \n    private Map<Integer, String> myCache;\n\n    @PostConstruct\n    public\
    \ void start() {\n        Logger.getLogger(\"GlobalLogger\").info(\"Started\"\
    );\n        myCache = new HashMap<Integer, String>();\n    }\n\n    public void\
    \ addUser(Integer id, String name) {\n        myCache.put(id, name);\n    }\n\n\
    \    public String getName(Integer id) {\n        return myCache.get(id);\n  \
    \  }\nn}\n```\n\nWith simple use of annotations, Java EE does not need a configuration\
    \ XML file. You may see a beans.xml file in the project, but most remains empty.\
    \ You only need it for starting the Context and Dependency Injection (DI) container.\
    \ The @Singleton annotation marks the class as a singleton EJB, and the container\
    \ handles creation and usage of the singleton instance.\n\nIf you execute this\
    \ bean code on server, you will not see logger output from the singleton because\
    \ the method annotated with @PostConstruct has not been invoked. Why is that?\n\
    \n# Using Singletons at Startup\n\nSingletons in Java EE are initialized lazily\
    \ by default. This might suit situations: allowing the instance to be created\
    \ only when it is needed and accessed for the first time. However, you may want\
    \ to create the instance at startup to allow access to the singleton without delay,\
    \ especially if it's"
