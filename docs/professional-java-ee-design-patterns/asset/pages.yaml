  md: '# Summary | 125


    Asynchronous programming radically modifies the execution order and therefore
    debugging Because debugging relies on suspending the execution and then stepping
    line by line through it, it is more difficult to understand the execution behavior
    and to mimic what is happening. The JVM determines the order of threads at time.
    It is almost impossible to simulate the same behavior because of very different
    available resources on test and development environments. If you don''t need it,
    asynchronous execution adds undesired complexity.


    Threading and asynchronous execution can be a great tool only if used properly
    without starving resources. It is a good idea to run nonblocking parts asynchronously,
    but not on every method.


    # SUMMARY


    In the age of multicore nonblocking tasks, asynchronous programming uses computing
    resources, delegates results in faster and more responsive user interfaces. Even
    if your application does not implement the asynchronous pattern, most application
    servers and JVMs use asynchronous execution internally via thread pools for many
    operations. Using available threads and resources greatly affects your application''s
    efficiency and responsiveness.


    Threading has been a first-class citizen from the early days of Java, by using
    threads to run asynchronous tasks was complicated and wasn''t always safe in server-managed
    containers. With the release of the Concurrency Framework, Java unleashed a huge
    set of tools into the hands of Java developers.


    Java EE followed this by providing an easy-to-use and implement annotation-based
    asynchronous programming model. Adding the @Asynchronous annotation tells the
    container to execute the function asynchronously.


    The servlet API introduced changes in release 3.0 and further improvements in
    release 3.1. The new servlet uses nonblocking I/O to support asynchronous programming
    in an efficient way. Although previous approaches needed a request/response couple
    to be a thread, the new model can use or release threads through the internal
    thread pool that the container provides.


    Java EE offers all the needed to run asynchronous code without the need for a
    third-party framework such as Spring or Quartz. This makes the asynchronous pattern
    a great tool to implement if you want to execute nonblocking code asynchronously
    with almost no boilerplate code.


    # EXERC


    +   1. Create an implementation of a session bean that has an asynchronous method.

    2. Develop simple functionality that uses asynchronous methodology to persist
    application data to a database.

    3. Use the asynchronous feature of Servlet 3.0 to design an asynchronous web service.'
