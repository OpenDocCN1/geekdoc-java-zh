    \n```\n\"links\": {\n  \"rel\": \"self\",\n  \"href\": \"http://localhost:8080/rest/posts/71892\"\
    ,\n  \"method\": \"GET\"\n}\n```\n\nThis is where HATEOS comes to life. There\
    \ are three parts to each link in the link array. The rel is the relation that\
    \ the href link has to the resource. The href is a link to more resources, and\
    \ the method is the method that must be used to obtain the resource. The rel element\
    \ can have any value and does not have to follow a convention, although it is\
    \ customary for 'self' to refer to a link that provides more information about\
    \ the current resource. In this case it refers to itself. The other links refer\
    \ to other users' responses to the post (replies or responses), the users who\
    \ follow (followers), and the user who posted the post (owner). Any resource that\
    \ relates to the principle post resource can be represented by a link in the link\
    \ array.\n\nAs you can see from the example, the first post in the array has four\
    \ links in its links array, whereas the second has only two. This is because the\
    \ second post does not follow it or any responses.\n\nProviding links in this\
    \ way gives the client the information it needs to navigate to further resources\
    \ and allows you to easily extend the API with relatively little pain.\n\nA good\
    \ example of a well-designed implementation of HATEOS is the one implemented by\
