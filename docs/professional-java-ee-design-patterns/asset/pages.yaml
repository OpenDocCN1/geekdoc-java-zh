  md: '# Plural Not Singular


    Resource names should be plural because they represent collections of data. The
    resource name users represents a collection of users, and the resource name posts
    represents a collection of posts. The idea is that plural nouns represents a collection
    in the service, and the ID refers to one instance within that collection. It may
    be justifiable to use a singular noun if there is only one instance of that data
    type in the entire application, but this is quite uncommon.


    # HTTP Methods


    There are eight HTTP methods defined in Hypertext Protocol 1.1; however, only
    four are commonly used using RESTful APIs. They are GET, POST, PUT, and DELETE.
    These methods have specified meanings and usages within the context of REST. The
    meaning of idempotency is especially important when considering the HTTP method.
    The meaning of idempotency from a RESTful API point of view is that a call made
    by the same URI will always produce the same result. So making one request produces
    the same outcome, on the server, as request handles multiple times. (This assumes
    a different and separate operation has changed the resource.)


    Only one of the four commonly used methods is GET. This means that your resource
    URI is created with this method cannot effect change on the server. You cannot
    create it, update, or delete a resource. The HTTP 1.1 specification refers to
    this method as safe because "it should not have the significance of taking an
