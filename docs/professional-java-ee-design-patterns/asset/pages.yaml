  md: "CDI can work with any Plain Old Java Object (POJO) by instantiating and injecting\
    \ objects into\nother. The following types of objects are injectable:\n\n+   -\
    \ POJOs\n- Enterprise resources such as data source and queues\n- Remote EJB beans\n\
    - Session beans\n- EntityManager objects\n- Web services resources\n- Producer\
    \ fields and objects returned by producer methods\n\n# ## CDI Versus EJB\n\nAlthough\
    \ CDI and EJB seem to be rivals, they work in harmony. CDI can work alone without\
    \ an\nJB container. Actually, CDI can power a desktop application or any web application\
    \ that doesn't\nely on the EJB container. CDI provides the factory and injection\
    \ to any JavaBean.\n\nHowever, EJBs still require the EJB container. Even the\
    \ simplified architecture of EJBs is more\ncomplex than POJOs, so EJBs still need\
    \ the EJB container. The EJB container provides additional\nervices such as security,\
    \ transactions, and concurrency that EJBs need.\n\nSimply put, the CDI container\
    \ is a lighter, powerful, but less container for POJOs. Still,\nboth containers\
    \ are so well integrated that CDI annotations can act as a gateway and standard\n\
