  md: '# 84 | CHAPTER 7 DECORATOR PATTERN


    wrap either a component object or another decorator. Sharing the same interface
    allows decorators to decorate the base component or another decorator. With a
    proper implementation, it is simple to call all relevant function implementations
    in order from the last decorator to the inner component object. In some cases,
    it not be difficult to adapt an existing system to use the decorator pattern.


    # WHAT IS A DECORATOR?


    The decorator pattern is one of the structural patterns described in the book
    of GoF. Its purpose is to wrap a target object that you can dynamically add new
    responsibilities at run. Each decorator can wrap another one, which allows for
    a theoretically unlimited number of decorating of target objects.


    Although this runtime behavior is much more flexible than inheritance via subclassing,
    it introduces a level of complexity over concrete subclassing as it makes it more
    difficult to determine the types and behaviors of objects prior to executing the
    application.


    Decorators are used in almost all languages and platforms, from the UI to the
    back end. Most frameworks and run times use the decorator pattern to add flexibility
    and runtime–specific behavior.


    In Java EE, you implement the decorator pattern without boilerplate code. However,
    unlike the majority of the patterns in this book, you often add XML configuration
    to the bean.xml.


    # WAR STORY


    Years ago, we won a contract to complete a food and drinks ordering and payment
    system for a company that provided it as a point of sale (POS) service to its
    clients.³ These clients were restaurants, cafes, and bars. We had no knowledge
    of the domain, so we made some reasonable assumptions based on the limited knowledge
    and information we had at the time. Luckily, most assumptions worked out.

    One of our design rules was that if an add-on option changes the price of a product,
    it should be added as a new product. If the restaurant serves extra portions for
    an addition, a new item should be added to the menu. However, if an option like
    extra cheese was free, that could be added as a side note to the order.

    This rule worked for every client until one day we met with a cafe owner whose
    business operated slightly differently. The cafe was on selling desserts, but
    it also offered pizza as a sorry. Pizza was the only item on the menu. Because
    the cafe didn''t specialize in pizza, it did not offer set pizzas but instead
    let its customers create their own pizzas from a long list of toppings, and it
    charged for each topping. This was quite a sensible way for the cafe to offer
    its customers pizza because only a few of its customers wanted


