  md: '# 6 | CHAPTER 1 A BRIEF OVERVIEW OF DESIGN PATTERNS


    doesn''t solve any problems but instead introduces bugs, inefficient design, low
    performance, and maintenance issues. Most patterns can solve problems in design,
    provide reliable solutions to known problems, and allow developers to communicate
    in a common idiom across languages. Patterns really only be used when patterns
    are likely to occur.


    Design patterns were generally classified into three groups:


    +   - Creational patterns—Patterns that control creation, initialization, and
    class selection. Singleton (Chapter 4, "Singleton Pattern") and factory (Chapter
    6, "Factory Pattern") are examples from this group.


    +   - Behavioral patterns—Patterns that control communication, messaging, and
    interaction between objects. The observer (Chapter 11, "Observer Pattern") is
    an example from this group.


    +   - Structural patterns—Patterns that organize relationships between classes
    and objects, providing guidelines for using and related objects together to achieve
    desired behaviors. The decorator pattern (Chapter 7, “Decorator Pattern") is a
    good example of a pattern from this group.


    Design patterns offer a dictionary between developers. Developers can use them
    to communicate in a simple way without having to reinvent the wheel for every
    pattern. Want to show your buddy how you are planning to add dynamic behavior
    at runtime? No more step-by-step drawings or misunderstandings. It''s plain and
    simple; just tell a few words: “Let’s use a decorator pattern to address this
    problem!” Your friend will know what you are talking about immediately, no further
    explanation needed. If you already know what a pattern is and it in a right context,
    you are developing a durable and maintainable application.


    # SUGGESTED READING


    It''s strongly suggested that you read Design Patterns: Elements of Reusable Object-Oriented
    Software by Erich Gamma, Richard Helm, Ralph Johnson, and John Vliss (Addison-Wesley,
    1994) or Head First Design Patterns by Eric Freeman, Elisabeth Robson, Bert Bates,
    and Kathy Sierra (O’Reilly, 2004). Both are great companions to this book and
    are invaluable for learning design patterns.


    # DESIGN PATTERN BASICS


    One key point regarding design patterns is that overused or unnecessary use can
    be troublesome. As soon as developers learn new patterns, they show a great desire
    to use them whenever they can. However, doing so often results in their project
    bloated with sightings or overlapping via facades or unnecessarily complex decorators.
    Design patterns are answers to problems, unless there is a problem or a chance
    for a pattern to appear, there is no point implementing a pattern. To give an
    example, using the decorator patterns just because there is a slim chance that
    an object''s behavior might change in the feature introduces development complexity
    today and a maintenance nightmare in the future.


    www.it-ebooks.info'
