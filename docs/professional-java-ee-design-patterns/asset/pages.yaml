  md: '# INTRODUCTION


    THIS BOOK DISCUSSES THE CLASSIC DESIGN PATTERNS that were first mentioned in the
    famous book by the GoF¹ and updates them specifically for Java EE 6 and 7.


    In every chapter we describe the traditional implementation of each pattern and
    then show how to implement it using Java EE-specific semantics.


    We use full code to demonstrate both the traditional and Java EE implementations
    and color each chapter with real-life stories that show the use (or misuse) of
    the pattern.


    We investigate the pros and cons of each pattern and examine their usages. Each
    chapter finishes with exercises that challenge your understanding of the pattern
    in Java EE.


    # WHO THIS BOOK IS FOR


    This book is for everyone with any level of experience. It covers almost everything
    about a pattern, from how it is referred to in other books, to code on basic Java
    implementation, Java EE implementation, and finally real life examples of how
    and to use a specific pattern. It also has real life stories that talked about
    good and bad practices.


    Having some basic knowledge of design patterns and Java EE will aid you as you
    read this book.


    If you are already experienced with patterns and Java implementations, you may
    prefer to jump into Java EE implementations. Refreshing your memory and knowledge
    of design patterns could prove helpful.


    # WHAT THIS BOOK COVERS


    This book covers all classical design patterns that Java EE offers as part of
    standard implementation, besides some new patterns. The coverage goes back to
    Java EE 5 and is up to date for the latest version available, which is Java EE
    7.


    We hope this book will be a reference you will keep on your shelf for a long time.


    # HOW THIS BOOK IS STRUCTURED


    Each chapter focuses on a design pattern. If the pattern is classical, a simple
    Java implementation is given after the explanation of the pattern. Each chapter
    offers war stories telling a good or bad real life example about the pattern focused
    on/in the chapter. The war story is followed by a Java EE implementation, example,
    and explanation. Each code sample given can be run by itself. Finally, each chapter
    ends with when and how to use the pattern effectively.'
  merge: -1
