  md: "# LISTING 6-14: Factory implementation that creates message beans\n\n```\n\
    package com.devchronicles.factory;\n\nimport javax.enterprise.inject.Produces;\n\
    \npublic class EventProducer {\n\n    @Produces\n    public MessageA messageAFactory()\
    \ {\n        return new MessageA();\n    }\n\n    @Produces\n    public MessageB\
    \ messageBFactory() {\n        return new MessageB();\n    }\n}\n```\n\nIn this\
    \ example, you have created two beans: MessageA in Listing 6-12 and MessageB in\
    \ Listing 6-13. You have annotated them with @alternative, which disables them\
    \ so that the container does not attempt to inject them when it finds a matching\
    \ injection point. You annotate them so the factory in Listing 6-14 will produce\
    \ the instances. If you didn't, the container would throw an exception when loading\
