    # Conclusions


    Microservices decompose into logical services of related function. Their small
    sizes make them easy for developers to understand. Development and deployment
    are continuous. Scalability is built into the architecture, and you are not stuck
    with initial technology decisions.


    # FINALLY, SOME ANTI-PATTERNS


    The purpose of this book is to fill the gap between “classical” patterns and Java
    EE. You will find many books discussing anti-patterns, but there is no harm in
    discussing a few here.


    Anti-patterns usually occur because of misuse of one or several patterns. A Java
    EE developer who has experience can easily list more anti-patterns than patterns.
    Here are a few that are common or that you may have already come across.


    # Uber Class


    There is probably no project without a huge class that has many purposes and responsibilities.
    Not only does this violate Java EE principles, but such classes override object-oriented
    programming (OOP) principles and must be avoided.


    Services that are overloaded with many responsibilities fall into the same category.
    If you are not a big fan of OOP, that''s fine, but if you do to continue write
    code in an OOP language, it is best to keep your classes small and highly cohesive.


    Although others have introduced this anti-pattern, Reza Rahman may have first
    introduced the name.


    # Lasagna Architecture


    Java EE promoted starting from the early days, which may have resulted in unnecessary
    interfaces and packages. This pattern may look like an answer to uber class and
    monolithic applications, usually it complicates things unnecessarily.


    Lasagna architecture in the OOP world is not different from spaghetti programming
    in structural programming. Too much abstraction is unnecessary and provides no
    help. Interfaces and loose coupling are great tools when you use them in the right
    amount, in the right context, and only when are needed.'
