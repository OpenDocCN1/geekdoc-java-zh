  md: '# CHAPTER 1 A BRIEF OVERVIEW OF DESIGN PATTERNS


    variable. Want to create a singleton? Just add the @Singleton annotation to the
    top of your class file. Need to implement the factory pattern? Just add the @Produces
    annotation, and the method will become the factory of the given return type.


    Java EE sets the standards. The @Inject annotation serves as a default implementation
    and can be mixed and matched with almost any other framework (the Spring Framework)
    because they use the same annotation.


    # When Patterns Become Anti-Patterns


    Design patterns represent wisdom, but this doesn''t mean you have to use all of
    the time. Just like the famous psychologist Abraham Maslow so stated, "If the
    only tool you have is a hammer, you tend see every problem as a nail." If you
    try to address all problems with the patterns you know, they won''t fit, or worse,
    you''ll fail badly and cause more problems. Even unnecessary use of patterns tends
    to overplicate the system and result in poor performance. Just because you like
    the decorator pattern does not mean you need to implement the pattern on every
    object. Patterns work best when the conditions and the problems require your use.


    # SUMMARY


    Java and design patterns had a long journey to arrive at where they are now. Once
    they were separate, with no knowledge of each other, but now they are together,
    to be forever integrated in the Java Enterprise. To understand this intimate pairing,
    you will know their history. Already you have discovered the roots of your favorite
    couple and how they found each other. You''ve read J2EE''s rocky beginnings and
    how GoF gave light to 23 design patterns. You see how fighting back and gaining
    the roots of the framework came behind Java and took over how the reinvented Java
    EE is The knowledge contained in this book will help you to tackle with confidence
    the majority of the design issue that you will face during your development career.
    You can rest easily knowing that the years of struggle the Java Enterprise has
    ended with the inherent use of design patterns has resulted in an sturdy and flexible
    programming language and environment.


    Enjoy this guide to design patterns in Java EE, and use the wisdom gained here
    in every project you''re involved in.


    # NOTES


    +   1. Design Patterns: Elements of Reusable Object-Oriented Software (Addison-Wesley,
    1994): Erich Gamma, Richard Helm, Ralph Johnson, John Vlissides.

    2. According to the TIOBE index, Java appears at number two after C: http://www.tiobe.com/php/content/paperinfo/tpci/index.html.

    3. Before version 3, Java EE used to be called J2EE. From this point J2EE will
    be used to refer to pre-Java EE 3.'
