  md: "# Implementing DI in Java EE | 53\n\nOur solution was to hard-wire the resources.\
    \ Even this gave us an “uglier” app, the app started up in lightning speed, solving\
    \ our performance issue.\n\nThe moral of this story is not that DI is a bad pattern\
