  md: "```\nprivate MySingleton() {}\npublic static MySingleton getInstance() {\n\
    \    return instance;\n}\n```\n\nDouble-checked locking is another highly popular\
    \ mechanism to create singletons. It is considered\nmore secure than other methods\
