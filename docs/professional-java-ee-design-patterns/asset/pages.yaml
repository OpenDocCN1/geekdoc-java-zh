  md: 'A facade can invoke other façades in subsystems, which in turn encapsulate
    their own logic and flow. This shows one of the benefits of using façades: a simplified
    hierarchy of method calls. There''s one facade for each subsystem, and these subsystems
    communicate with each other via the façades.


    # Facade with Stateful Bean


    The same bean can be implemented as a stateful bean or even as a singleton bean
    as long as it hides complexity and exposes an easy-to-use interface to the client.
    The only change is the addition of the @Stateful annotation, which marks the bean
    a stateful EJB.


    In JEE (pre 5.0), the use of the façade pattern was encouraged in the implementation
    of the session pattern. However, in the simplified approach of Java EE, façades
    still have their place when control and encapsulation of the workflow are required.


    # WHERE AND WHEN TO USE THE FAÇADE PATTERN


    The facade pattern should be used to encapsulate complicated (business) logic
    at a high level and provide a clearer single point of access via an API.


    Whenever you are in the position to provide an interface or an API to someone,
    think about the complexity of the logic and the changes that might occur. The
    facade pattern does a good job of providing a clean API while hiding the parts
    that change.


    However, unnecessarily wrapping methods in a facade is bad practice and adds unnecessary
    layers. Premature encapsulation could result in too many varieties and layers
    that don''t add value.


    When implementing the session facade, you must determine if the use case requires
    state to be maintained. A case that invokes only one method of the facade to receive
    the service that it needs is considered nonconversational, so no need to know
    the conversation state between invocation and the next. You should implement this
    facade as a stateless session bean.


    On the other hand, if the conversational state must be maintained between bean
    invocations, the most appropriate way to implement the facade is as a stateful
    bean.


    You must be careful when using the stateful session facade because it ties up
    resources until the client revoked releases them or times out. This can mean that,
    for the majority of time the stateful session bean is bound to the client, it
    is doing nothing; just maintaining state and using resources. And, unlike stateless
    session bean façades, it cannot be reused and shared between other clients because
    each request creates a new instance of the stateless facade, maintaining the state
    for that client''s session.


    So take care when using this pattern. Analyze the use case and make appropriate
    decisions.


    # SUMMARY


    You can implement the facade pattern as a POJO, a stateless session bean, or a
    stateful bean. The various ways to implement the facade pattern solve different
    problems for use case scenarios. But by the variety of implementations does not
    distract from its principle intent: providing a high-level simple interface to
    a more complicated subsystem.'
