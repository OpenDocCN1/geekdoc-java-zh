    # CORE PRINCIPLES OF JAVA EE


    The principles of Java EE include a number of design paradigms and patterns that
    are essential to the way you develop enterprise applications. At the center of
    Java EE is the design paradigm of convention over configuration: a way to simplify
    the development of enterprise applications without losing flexibility and obscuring
    its code''s purpose. It is not a new idea and has been a part of other frameworks
    including Grails, Ruby on Rails, and Spring Boot for some time—in cases for nearly
    a decade. Frankly, it has made its way into the heart of Java EE, where it helps
    others write beautiful code.


    Java EE makes good use of its component model, which includes the Entities, JavaBeans,
    EJBs, Servlets, SOAP, and RESTful web services. All these components can be "injectable"
    dependencies; the container manages, in some way, their life cycle (from instantiation
    to destruction)—whether they are bound to a context or not—and their decoupling
    from dependent components dependency injection.


    A loosely coupled application allows for extensibility: Old classes can be swapped
    with new ones with no requirement to change the dependent class. Dependency injection
    decouples an object from its dependencies, whereas interceptors decouple business
    concerns from technical and cross-cutting concerns. Such technological concerns
    would be performance and logging, and a cross-cutting concern would ensure security.


    # CONVENTION OVER CONFIGURATION


    All class names should start with a capital letter as convention. It is not obligatory;
    the class will still function if it starts with a lowercase letter, but using
    a capital letter makes the code easier to read and maintain. When setting up a
    project in an IDE, you only need to specify the type of project and its name for
    the most appropriate directory structure to be created; the most common application
    programming interfaces (APIs) are to be imported; the default files such as web.xml,
    index.jsp, etc. to be created with appropriate default settings for case of development.
    You do all of this based on agreed convention.


    The amount of work you have and the decisions you have to make as a developer
    are substantially reduced when you rely on convention. You don''t specify any
    configuration that is considered conventional; you are required to specify only
    the unconventional. This has a significant effect. With a few annotations on a
    POJO, you can do away with a lot of XML deployment descriptors and application
    configuration files. You have seen in Listing 2-1, you you need to apply three
    annotations to make a POJO into a singleton bean that will be instantiated and
    initialized at start-up and managed by the container.


    > NOTE Convention over configuration is also known as coding by convention.'
