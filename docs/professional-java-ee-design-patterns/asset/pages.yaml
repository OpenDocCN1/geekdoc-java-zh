  md: "Servlet filters are easy-to-implement tools, but they're also powerful. However,\
    \ the functionality is still limited to client server web requests. To intercept\
    \ other method calls or to fine-tune the interception, you need a much more sophisticated\
    \ approach.\n\n# ASPECTS IN JAVA EE, INTERCEPTORS\n\nJ2EE did not offer an out-of-the-box\
    \ AOP solution but worked in harmony with third-party frameworks. Java EE 5 introduced\
    \ interceptors, which resulted in an easy-to-use built-in aspect approach. The\
    \ interceptor concept was limited to Enterprise JavaBeans (EJB) until Context\
    \ and Dependency Injection (CDI) was introduced.\n\nInterceptors in Java EE work\
    \ in a similar way to aspects. Each interceptor addresses the concerns and hosts\
    \ the code block that contains the functionality to be added. The target to be\
    \ decorated is called an advice. Each call to an advice within the scope of the\
    \ interceptor is executed. The exact location of the aspect is executed at the\
    \ point.\n\nBasic Java EE interceptors can only work on EJBs. Imagine an application\
    \ considering hundreds of EJBs. The whole application can be configured to log\
    \ all EJBs by deploying an interceptor targeting all those EJBs.\n\nImplementing\
    \ interceptors in Java EE is straightforward. The first step is to create a new\
    \ interceptor class and annotate it with the @Interceptor annotation. This hosts\
    \ the advice code. Any method annotated with @AroundInvoke is executed at the\
    \ pointcut. However, there are some syntax rules regarding the method signature:\n\
    \n+   - Any midpoint method must return an object of type Object and have a parameter\
    \ of type InvocationContext.\n- Throw an exception.\n\nYou can use the InvocationContext\
    \ parameter to access information about the current context as seen in Listing\
    \ 8-4.\n\nLISTING 8-4: Simple implementation of an interceptor\n\n```\npackage\
    \ com.devchronicles.interceptor;\n\nimport javax.interceptor.AroundInvoke;\nimport\
    \ javax.interceptor.InvocationContext;\n\n@Interceptor\nublic class SecurityInterceptor\
    \ {\n\n@AroundInvoke\npublic Object doSecurityCheck(InvocationContext context)\
    \ throws Exception{\n    //Do some security checks!\n    Logger.getLogger(\"SecurityLog\"\
    )\n```"
