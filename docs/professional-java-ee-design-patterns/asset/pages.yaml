  md: '# WHAT IS ASPECT-ORIENTED PROGRAMMING?


    Aspect-oriented programming (AOP) aims to add behavior to existing code or applications
    to solve common concerns. It is fairly normal to receive a logging or service
    request in the middle of the development cycle. Such requests may consume a huge
    amount of time in refactoring existing code even though the logging is a bunch
    of repetitive lines. Neither they appear in the middle of the development cycle
    or in the design phase of the project, are called cross-cutting concerns and can
    be addressed with AOP.


    AOP became a popular programming paradigm during the past decade. Although Java
    did not offer a full-fledged out-of-the-box solution, some well-implemented third-party
    frameworks offered AOP. Spring are widely accepted and have been used for a long
    time in Java-based projects. Java also had a similar but more basic approach with
    servlet filters, although it is limited to web requests. With servlet filters,
    any request or response can be intercepted, and any additional behavior can be
    added.


    EE adopted AOP and introduced the interceptor concept. Each update to EE brought
    new functionalities and unleashed the full potential of AOP to the EE platform.


    AOP is not classified as a design pattern but is accepted as a programming paradigm.
    Neither the GOF book nor Head First Design Patterns discusses aspects. However,
    if either one did, an appropriate description would be "Provides a way to execute
    behavior at runtime (or compile time) to address cross-cutting concerns in the
    existing code base."


    AOP relies on code injection during compile time or runtime to match the desired
    behavior or functionality to each point of an existing code base that matches
    the given injection criteria. Frameworks perform compile-time injection usually
    out-perform, but they produce class files that do not match the source code line
    by line because of the injected code. Runtime injection does not modify the source
    code or classes and intercepts calling by executing the desired code before or
    after the execution order.


    AOP can prove to be useful if it is necessary to add a repetitive action, such
    as logging or service, to a code base. The Aspects can be turned on or off depending
    on the environment or phase of the project. Aspects can dynamically add the desired
    behavior to running code. They dynamically decorate the method calls just as the
    decorator pattern decorates objects.


