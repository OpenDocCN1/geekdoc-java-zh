    \ have all the parts of the puzzle, you can put it together in the MessageFactory\
    \ shown in Listing 6-30.\n\n# Listing 6-30: The Factory implementation\n\n```\n\
    @Dependent\npublic class MessageFactory {\n\n@Inject\n@Any\nprivate Instance<MessageType>\
    \ messages;\n\npublic MessageType getType(Message.Type type) {\n    MessageLiteral\
    \ literal = new MessageLiteral(type);\n    Instance<MessageType> typeMessages\
    \ = messages.select(literal);\n    return typeMessages.get();\n}\n\n```\n\nIn\
    \ the factory, all dependencies that implement the MessageType interface are injected\
    \ into the member variable messages. Then, from the method getMessage, you use\
    \ the Message.Type parameter to create a new MessageLiteral that you select the\
    \ MessageType implementation you want from messages, which in turn returns to\
    \ the client.\n\nThe client injects and calls the getMessage method passing in\
    \ the Message.Type that it requires, as can be seen in Listing 6-31.\n\n# Listing\
    \ 6-31: Client using the Factory implementation\n\n```\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\n\
    @ApplicationScoped\npublic class Client {\n\n@Inject\nMessageFactory mf;\n\npublic\
    \ void doMessage() {\n    MessageType m = mf.getMessage(Message.Type.SHORT);\n\
    \    m.setMessage(\"This is a short message\");\n}\n```\n\ncontinues"
