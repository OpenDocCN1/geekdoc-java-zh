  md: "# WHAT IS A FACTORY?\n\nAs one of the creational patterns, the factory's purpose\
    \ is to create objects. The creational logic is encapsulated within the factory\
    \ and either provides a method that returns a newly created object (factory method\
    \ pattern) or delegates the creation of the object to a subclass (abstract factory\
    \ pattern). In both cases, the creation of the object is abstracted away from\
    \ where it will be used.\n\nThe client needs not be aware of the different implementations\
    \ of the interface or class. The client only needs to know the factory (factory\
    \ method or abstract factory) to use to get an instance of one of the implementations\
    \ of the interface. Clients are decoupled from the creation of the objects.\n\n\
    The decoupling occurs as the result of applying the dependency inversion principle\
    \ and brings many practical advantages, which most important is the decoupling\
    \ of higher-level classes from lower-level classes. This decoupling allows the\
    \ implementation of concrete classes to be changed without affecting the client,\
    \ thus reducing coupling between classes and increasing flexibility.\n\nThe pattern\
    \ gives us the opportunity to decouple object creation from the underlying system\
    \ by encapsulating the code responsible for creating objects. This approach simplifies\
    \ our life when it comes to refactoring as we now have a single point where the\
    \ refactoring changes happens.\n\nOften the factory itself is implemented as a\
    \ singleton or as static class because normally only one instance of the factory\
    \ is required. This centralizes factory object creation, allowing for greater\
    \ organization and maintainability of source code and the reduction of errors\
    \ when changes and updates are made.\n\n> Dependency Inversion Principle:\n- High-level\
    \ modules should not depend on low-level modules. Both should depend on abstractions.\n\
    \ Abstractions should not depend on details. Details should depend on abstractions.\n\
    \nIn Java EE, dependency injection is employed to deliver the decoupling of higher-level\
    \ classes from lower-level classes when implementing the factory pattern. The\
    \ combined use of the @Producers and @Inject annotations makes their implementation\
    \ relatively simple.\n\n# FACTORY METHOD\n\nThe GoF² book describes the factory\
    \ method as such: \"Defines an interface for creating an object, but lets subclasses\
    \ decide class to instantiate.\" Head First Design Patterns³ adds that the \"\
    factory method lets a class defers instantiation to subclasses.\"\n\nFactories\
    \ minimize the usage of the new keyword and can encapsulate the initialization\
    \ process and the different concrete implementations. The ability to centralize\
    \ those needs minimizes the effect of adding or removing concrete classes to the\
    \ system and the effects of concrete class dependencies.\n\nThe factory method\
    \ class diagram is shown in Figure 6-1."
