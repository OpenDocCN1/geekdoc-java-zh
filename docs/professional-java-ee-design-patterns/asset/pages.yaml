  md: "# LISTING 8-6 (continued)\n\n```\nimport javax.ejb.TransactionAttributeType;\n\
    import javax.enterprise.event.Event;\nimport javax.inject.Inject;\nimport javax.interceptor.Interceptors;\n\
    \n@Stateless\n@TransactionAttribute(TransactionAttributeType.REQUIRED)\npublic\
    \ class SomeBusinessService {\n\n    @Interceptors(SecurityInterceptor.class)\n\
    \    public void startService() {\n        //Complex business logic\n        Logger.getLogger(\"\
    AppLog\").info(\"done...\");\n    }\n\n    public void startAnotherService() {\n\
    \        //Complex business logic\n        Logger.getLogger(\"AppLog\").info(\"\
    done again...\");\n    }\n}\n```\n\nThis time only the startService() method are\
    \ intercepted, unlike in Listing 8-5, where all methods of the class were intercepted.\
    \ You should annotate each method separately.\nUsing @Interceptor, @Interceptors\
    \ with @AroundInvoke allows a powerful tool that solves cross-cutting concerns\
    \ in an AOP approach. Yet interceptors offer easy annotation-based implementation\
    \ with no boilerplate code.\nYou can use the InvocationContext interface to extract\
    \ information about the context or interact with the advice context. Following\
    \ are some of the most useful methods:\n\n| METHOD | DESCRIPTION |\n| public Object\
    \ getTarget(); | Return to the target advice. |\n| public Method getMethod();\
    \ | Return the executed method from the advice. |\n| public Object[] getParameters();\
    \ | Access target advice method's parameters. |\n| public void setParameters(Object\
    \ obj); | Set target advice method's parameters. |\n| public java.util.Map<String,\
    \ Object> getContextData(); | Access context data. |\n| public Object proceed()\
    \ throws Exception; | Continue execution. |\n\nIn Listing 8-7, you can access\
    \ the method name. Also, you can check whether the interceptor authorized the\
    \ before; if it has not, you can authorize the user for that method."
