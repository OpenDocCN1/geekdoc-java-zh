  md: "# LISTING 4-11: (continued)\n\n```\n@Lock(LockType.WRITE)\npublic void addUser(Integer\
    \ id, String name) {\n    myCache.put(id, name);\n}\n\n@Lock(LockType.READ)\n\
    public String getName(Integer id) {\n    return myCache.get(id);\n}\n```\n\nTwo\
    \ lock types are usually used to access the bean's business methods: @Lock(LockType.WRITE),\
    \ which locks the bean to other clients while the method is being invoked, and\
    \ @Lock(LockType.READ), which allows concurrent access to the method and does\
    \ not lock the bean to other clients. Methods that change data are usually annotated\
    \ with WRITE to prevent access to the data as it updates. In this example, the\
    \ addUser() method is annotated with the WRITE lock so that if any client calls\
    \ getName() method, it has to wait until the addUser() method returns before it\
    \ can complete its call. This may result in throwing a ConcurrentAccessTimeoutException\
    \ if the addUser() method takes a long period. You can configure the timeout period\
    \ via an annotation, which will see an example in Listing 4-12.\n\nYou can set\
    \ the LockType annotation at the class level. It applies to all business methods\
    \ that don't explicitly configure their own LockType. Because the default is WRITE,\
    \ it is normally sufficient to configure the methods that require concurrent access.\n\
    \n# LISTING 4-12: Defining the singleton's concurrent timeout access\n\n```\n\
    import java.util.logging.Logger;\nimport javax.annotation.PostConstruct;\nimport\
    \ javax.ejb.Singleton;\nimport javax.ejb.Startup;\nimport javax.ejb.DependsOn;\n\
    import javax.ejb.ConcurrencyManagement;\nimport javax.ejb.ConcurrencyManagementType;\n\
    import javax.ejb.AccessTimeout;\nimport java.util.Map;\nimport javax.ejb.EJB;\n\
    import java.util.HashMap;\nimport javax.ejb.Lock;\nimport javax.ejb.LockType;\n\
    import java.util.concurrent.TimeUnit;\n\n@Startup\n@DependsOn(\"LoggingBean\"\
    )\n@ConcurrencyManagement(ConcurrencyManagementType.CONTAINER)\n@Singleton\n@AccessTimeout(value=120000)\
    \ // default in milliseconds\n```"
