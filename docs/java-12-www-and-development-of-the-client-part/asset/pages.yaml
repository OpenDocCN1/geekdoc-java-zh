    # # Types


    In JavaScript, you should not specify any data type when creating a variable.
    It is said that it is a type-weak language. However, it is not the same as JavaScript
    does not have types and there are basically 4 types:


    +   - Boolean, which are variables or expressions that are either false or true

    - Number, which are numbers, that are 64 bits floiting points

    - String, which are random sequences of characters

    - Object, which are families of properties and methods


    That the language is type-weak when the runtime system based on variables and
    expression values automatically determines the type. This means, in particular,
    that the type of a variable can be changed over its lifetime and is always determined
    by the value of the variable. For example the following code


    ```

    var arr = ["Knud", 47, true, {}, f];

    for (var i = 0; i < arr.length; i++) alert(typeof arr[i]);

    alert(typeof arr);

    ```


    where the function f() is as above, will alert the following type names (the operator
    typeof)


    +   - string

    - number

    - boolean

    - object

    - function

    - object


    Here you should note for f, the result is function, even if the type is formally
    object, and that the type of an array is an object.


    The value of a variable can be a primitive where there are the following options


    +   - true or false and then a boolean

    - a number and then all possible numbers

    - a string

    - null, that means that the variable has no value

    - undefined, that means that the variable is defined, but not initialized


