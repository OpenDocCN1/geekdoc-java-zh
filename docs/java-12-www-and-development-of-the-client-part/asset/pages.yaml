    }\n```\n\nYou can also define styles for descendant selectors that occur with\
    \ a space between two selectors:\n\n```\nsection p {\n  margin-left: 20px;\n}\n\
    ```\n\nThis selector indicates that a paragraph element must have a left indentation\
