    and the function may have an arbitrary number of parameters and especially none.
    Since a function can refer to all variables in its scope, the function can specifically
    refer to itself and you can therefore write recursive functions:


    ```

    function factorial(n)

    {

    if (n < 1) return 1;

    return n * factorial(n - 1);

    }

    ```


    It is allowed to declare a function multiple times in the same scope, which simply
    means that the function is given a different value. It can also give unexpected
    results. For example, if you consider the following code:


    ```

    function f()

