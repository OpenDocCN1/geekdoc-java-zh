  md: "JAVA 12: WWW AND DEVELOPMENT OF THE\nCLIENT PART: SOFTWARE DEVELOPMENT\n\n\
    APPENDIX B: JSON\n\n# APPENDIX B: JSON\n\nJSON is a standard for data exchange\
    \ primarily between client and server in web applications, but in principle, JSON\
    \ can be used in many other contexts, and in relation to data exchange, JSON can\
    \ to come to some extent be as an alternative to XML. JSON is characterized by\
    \ being easy to write and read (there are very few and simple rules), being text\
    \ based and being platform independent.\n\nA JSON document has in principle the\
    \ same syntax as an object in JavaScript, and an example could be:\n\n```\ndanish\
    \ = {\n  \"kings\": [\n    \"name\":\"Gorn den Gamle\",\n    \"to\":\"958\"\n\
    \  },\n    \"name\":\"Harald Blåtand\",\n    \"from\":\"958\",\n    \"to\":\"\
    987\"\n  },\n    \"name\":\"Svend Tverskøg\",\n    \"from\":\"987\",\n    \"to\"\
    :\"1014\"\n  ]\n};\n```\n\nThe basic syntax is that data are represented as key/value\
    \ pair separated by colon. Several data elements (key/value pairs) can be gathered\
    \ as objects in a collection where the elements are separated by commas. Finally,\
    \ the value of a data element may be an array. In general, JSON supports the following\
    \ data types:\n\n+   1. Number as in JavaScript\n2. String is double-quoted Unicode\
    \ with backslash as escaping\n3. Boolean that is true or false\n4. Array which\
    \ is an ordered sequence of values separated by comma\n5. Object that is an unordered\
    \ collection of key:value pairs\n\nDownload free eBooks at bookboom.com"
