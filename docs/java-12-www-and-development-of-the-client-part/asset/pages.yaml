    # 4.4 DOM


    DOM stands for Document Object Model and is a W3C standard for how browsers build
    HTML document as a hierarchy of objects. DOM is not part of JavaScript, the DOM
    objects allow JavaScript to manipulate the objects and refers to the contents
    of the current document from script code. In combination with JavaScript, DOM
    is the key to developing websites where something is happening on the client side.
    DOM is a standard, but it is up to the browser vendors to implement this standard
    and the standard is no better than to the extent the browser vendors live up to
    it. This means that there may be (and are) differences between different browsers
    and different versions of the same browser, but the most basic objects are, however,
    implemented roughly standard.


    The root of the DOM tree is window and is an object consisting of several properties
    and collections. The main property is document represents the document that the
    browser shows. Consider, for example, the following document (DOMTree project):


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>DOMTree</title>

    <script>

    tree = "";

    function parse(node)

    {

    tree += node.nodeName;

    if (node.nodeName === "text" && node.parentNode.nodeName !== "SCRIPT") {

    tree += " : " + node.textContent;

    if (node.attributes != null) {

    for (var i = 0; i < node.attributes.length; i++) {

    tree += " " + node.attributes[i].name + " ="" + node.attributes[i].value;

    }

    }

    if (node.childNodes != null) {

    for (var j = 0; j < node.childNodes.length; j++) {

    parse(node.childNodes[j]);

    }

    }

    function build() {

    {

    parse(document);

    document.getElementById(''domTree'').value = tree;

    }

    }</script>

    </head>

    <body onload="build()">

    <h1 style="font-weight:normal">DOM Tree</h1>

    <p>DOM = Document Object Model</p>

    <p><textarea id="domTree" style="width: 450px; height: 500px"></textarea></p>

    </body>

    </html>

    ```'
