    I will also mention Java applets, that are program code, which are performed by
    the browser, but this is common binary Java code downloaded from the server, and
    the browser can then use a plugin to execute the code. One should note that you
    have the full Java available and that an applet can, in principle, perform all
    that is possible with a Java application. For that reason, many people are not
    excited about Java applets, as applets has a major security risk, and there are
