    The variable *v* has the value 19, which has the type *number*. When you loop
    over the array, you first determine the sum of *v* and the value 47. They are
    two numbers and the result is 66. Next, add *true*, which is a *boolean*, and
    here occurs an automatic conversion to a number where the value *true* is converted
    to 1 and the result of the sum is 67. In the third iteration, the plus is performed
    on a *number* and a *string*, and this occurs an automatic conversion to a string
    for both operands. In the fourth iteration, the operator is executed on a *string*
    and an *object*, and the result is a string concatenation. The same goes for the
    last time, since *f(o)* as an *object*, but the string—the result of *toString()*—is
    this time code of the function itself.


    The example should show that JavaScript is weak-type, an expression may well consist
    of different types of operands, and consequently implicit conversions are always
    ongoing. This can naturally lead to unexpected results, and the rules are also
    complex. Basically, the following applies.


    Note first that a variable of a type *object* has two methods *toString()* and
    *valueOf()* (which can be overridden), where the first returns the value of the
    object as a *string*, while the other returns the value as a *primitive*. For
    example, if you consider the following code:


    ```

