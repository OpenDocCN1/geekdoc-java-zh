    In the middle you have the content (if there is a content) and without having
    padding, indicates how much space there should be outside of the content. For
    an element with style, the width and height in most cases mean the size of the
    content area inclusive padding, but it can be changed with box-sizing. Around
    the padding there may be a border, and finally there may be a margin about all
    of it. For example, if you specify a background color, it will relate to the entire
    padding area. You should especially note that the margin area is transparent and
    is only used to create spaces between the elements. You be aware that if elements
    are vertically aligned and two margins (top and bottom) meet, they are automatically
    collapsed to one whose is the largest of the two.


    Many elements as p, h, and article behave as described above and show the contents
    as a block and are therefore called block boxes. Others as strong and span are
    inline boxes as they form the content of a line. How the different elements show
    their content can be defined by display and thus override how they default shows
    their content. Elements can be laid out by the browser in several ways, but the
    default is static, and for block boxes, it means that they are placed vertically
    underneath each other, whereas for inline boxes it means that they are laid horizontally
    on the same line and wraps.


    As mentioned, the position of elements is defined as static, which means that
    the elements float in the window, but you can define other options, as are best
