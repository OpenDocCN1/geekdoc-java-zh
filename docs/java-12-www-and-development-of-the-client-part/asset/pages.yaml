    the two languages do not have anything in common, and JavaScript is even a language
    that is very different from Java, but if you want to work professional as a web
    developer, you have to know JavaScript. Therefore, this. chapter.


    JavaScript is an interpreted programming language, and the source code are as
    Java just, but unlike Java, the code is not translated, but is seen as text to
    the browser, which has a built-in interpreter that interprets the JavaScript code.
    It is a real interpreter which interprets the code for statement and execute each
    statement before the next is interpreted and performed. To show what JavaScript
    is, I want to start with a very simple example, called LoadingDocument. There
    is only one free index.html whose content is:


    ```

    <!DOCTYPE html>

    <head>

    <title>LoadingDocument</title>

    <meta charset="UTF-8">

    <script>

    hello = ''Hello'';


    function show() {

    alert(hello);

    hello += '' World'';

    }

    </script>

    </head>

    <body>

    <h1>Welcome</h1>

    <script>show();</script>

    <h2>Go on</h2>

