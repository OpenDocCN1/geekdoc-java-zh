  md: '# COMPONENT LIBRARIES


    As shown in the previous chapter, JSF and especially in combination with Ajax
    provide a range of functionalities that makes it easy to develop attractive and
    dynamic web applications, but there is a lot more to do with, and among other
    things there are several parts JSF component libraries. In this chapter I will
    give an introductory note to one of these libraries, called PrimeFaces. Basically,
    it''s a library that essentially defines its own for each of the standard JSF
    components as well as expanding with a skeleton for a web application that makes
    it easy to develop a stable application from scratch. The motivation for using
    PrimeFaces is primarily to make user-friendly web applications, but also the library
    offers others that JSF does not immediately provide, and in fact, the idea is
    that to use other to the least extent should work with style sheets and JavaScript
    – two things in practice can be quite time consuming.


    As mentioned, there are other JSF component libraries, but I would like to introduce
    PrimeFaces, by NetBeans, without the need to install the libraries in question
    (which is quite easy). One can achieve significant benefits with PrimeFaces, but
    the price is that you must know the library (a bit like jQuery) and you should
    be aware that the developers of PrimeFaces have an idea of how web applications
    should look and work, and if you want to deviate from it, it is not always that.


    I want to start with usual web application, which I have called ChangeAddress6.
    When I come to Frameworks, I have chosen JavaFaces as usual, and here I clicked
    on the Components tab and chose PrimeFaces:


    ![](img/8d3e018e6b832623c734fb380b355a77_124_0.png)'
