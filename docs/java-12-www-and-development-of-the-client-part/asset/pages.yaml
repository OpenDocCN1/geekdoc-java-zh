    to

    op a cell. It is primarily a question about to treat events related to the keyboard,

    with such arrow keys.

    The program should apply the system clipboard so that you can copy data to

    programs. It is primarily a matter of getting into the corresponding JavaScript
    API.

    The expression module should be expanded with more mathematical functions. It''snactually
    a relatively simple task, and the algorithms can be found in the book Java 3.

    However, the biggest lack is performance where the application becomes ineffective

    on large spreadsheets. An option to solve the problem could be to show only a
    part

    of a spreadsheet on the client side and then place some navigation buttons in
