  md: 'JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT


    # 5 JAVASERVER FACES AND AJAX


    In this book, I have alone looked at the client side, including how to define
    a layout of a page using, and how to use JavaScript to modify the individual elements
    of a DOM tree. It takes place in the browser and without the server''s involvement.
    In this chapter, I will again look at the server side where the code is executed
    on the basis of a request from the browser and the server then answers back with
    a response, which means the browser should render the document again. With the
    help of JavaScript, it is possible to execute that form of a request/response
    in such a way that the user does not observe the page being updated and the application
    essentially behave in the same way as a standard desktop application. This technique
    is called Ajax.


    Ajax is a family of technologies that enable JavaScript to perform tasks asynchronously
    when the browser sends requests to the server in the background, which then sends
    back to the client that can be used to update the DOM tree. The technology is
    widely used in all modern web applications.


    You can basically associate ajax facilities with JSF input component with the
    element fajax, which means an interaction between client and server, based on
    a particular event, an interaction performed asynchronously and parallel with
    the user using the application. A number of attributes are attached to a fajax
    element, where all not specified has a default value:


    +   - delay, which is a value specified in milliseconds and indicates the maximum
    size of a delay between request and response (none disables this feature).

    - disabled, which is a boolean indicating that the function is disabled (false
    default).

    - event, which specifies the event for the component that triggers the ajax request.

    - execute, that specifies a list of components to be performed on the server.

    - immediate, which is a boolean that indicates the input value should be processed
    immediately.

    - listener, which specifies the name of a listener method to be performed.

    - onevent, that specifies the name of a JavaScript function to be performed.

    - onerror, that specifies the name of a JavaScript function for error handling.

    - render, which is a list of components to be rendered after the ajax function.


