    which the namespace defines all PrimeFaces elements and must be part of any page
    that uses PrimeFaces. Then there is the body section where all elements this are
    PrimeFaces (p:) elements. The first is a p:layout element that defines the overall
    design. This is done by using nested p:layoutUnit elements that divide the window
    into five areas:


    +   1. north, which defines an area at the top of the page. The width will automatically
    be the entire browser window, while the size attribute indicates the height.

    2. west, which defines the left-hand area where the height will automatically
    be the part of the browser window, which is not used by north and south, while
    the width is defined by size.

    3. south, which is the bottom area where the width is automatically the entire
    browser window, while the height is determined by the size attribute.

    4. east, which is the area to the right, but NetBeans does not insert this area
    (it is not used so often). The height of the area is the same as west the width
    is defined by the size attribute.

    5. center, which is simply the browser area not used by the four other areas.


    That is, a p:layout element divides the window in the same way as it is known
    from a BorderLayout in Java.


