    number of columns (default 20).

    - Open an existing spreadsheet where you can search among the spreadsheets that
    have been created and saved.

    - Save the spreadsheet that you work – if it has been saved. Otherwise, the Saveas
    function is called.

    - Save the spreadsheet as a new spreadsheet, which means entering a name.


