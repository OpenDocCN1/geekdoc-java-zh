    to\learn JavaScript than another programming language, and if you need to use
    JavaScript to

    a large extent, there is nothing more going systematic, for example, reading a
    book

    exclusively to JavaScript. However, there is one thing that should be noted that

    s JavaScript is not translated by a compiler, and is not type-strong, there is
    a high risk

    that the code contains errors and worse, it is both difficult and time consuming
    to find

    the mistakes. The conclusion is, therefore, that JavaScript is a fully-fledged
    programming

    language, but it is far from an effective language for developing major projects.


    The current project is not a complete spreadsheet, which can be used as an alternative
    to,

    for example, LibriOffice Calc — does not make sense to develop such alternative.

    However, the project may have applications, and if you think of a web application
    that

    needs a spreadsheet-like page, the project or parts of it may be used. Should
    the project

    expanded, so it looks like a real spreadsheet, there are some missing and I will
    mention

    some features that could significantly improve the project. In fact, each feature
    could be

    task or project in itself.


