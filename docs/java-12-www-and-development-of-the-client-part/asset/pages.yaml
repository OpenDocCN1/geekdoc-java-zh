    To enter in a cell, the first cell must be opened that occurs as CTRL + SHIFT
    and click with the mouse. Then you can enter a number, a formula or a text. The
    entry is accepted either by pressing Tab or Enter.


    You can select one or more cells using the mouse and drag the mouse, the CTRL
