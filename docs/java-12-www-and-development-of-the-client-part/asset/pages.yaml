  md: '# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT


    In the DOM tree, each element in the document is represented by a node, and it
    also applies to elements that are not visible, such as script element. The typical
    use of JavaScript is to modify the DOM tree, including specifically changing the
    individual nodes. In this case, the script element begins by defining a global
    variable. The function `parse()` has a node as a parameter, and it starts by adding
    this node''s name to the global variable `tree`. If attributes are attached to
    the node, they are also added to the variable as key/value pair. Finally, if there
    are child nodes, the function `parse()` is called recursively for each child node.


    You must know the syntax for `parse()`. Of course, it is not so easy to guess
    what the individual properties are called, but when you see the result, it''s
    easy to follow what happens.


    There is another function called `build()` which calls the recursive function
    with the `document` object as parameter. When the function `parse()` is performed,
    the function `build()` will with a reference to the element id `domTree` (which
    is a text area) insert the value of the global variable `tree`. The `build()`
    function is performed as an event handler for `onload` that occurs after the document
    is loaded and displayed in the browser, and after that the DOM tree is built.


    ![](img/8d3e018e6b832623c734fb380b355a77_92_0.png)


