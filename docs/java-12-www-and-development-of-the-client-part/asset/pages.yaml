    # Data type


    When you meet JavaScript, it may seem that the language is typeless, but it is
    not the case. It is only a matter of the interpreter deciding the type of variables
    from the context, which means, among other things, that variable can change its
    type. In the next section, I will describe the type concept in JavaScript in more
    detail, but basically there are four types:


    +   * Boolean, which are variables or expressions whose value is false or true

    * Number, which is numbers and everywhere is 64 bits floating numbers

    * String, to strings

    * Object, which are collections consisting of properties and methods, which cover
    anything other than the above three types


