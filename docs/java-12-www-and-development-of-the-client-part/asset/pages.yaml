    +   1. expression supports only two mathematical functions, the square root function
    and a sum function. However, the power function is supported by implementing the
    operator ^

    2. Instead of common variables, an expression works on cell references, which
    means the parser must be changed a bit.


    For the sum function, it may sum a number of values (constants or cell references),
    which are indicated as a comma separated list. You can also specify two cell references
    in the same row or column and separated by semicolon, and the function summarizes
    all values between these references.


    The implementation of expressions (formulas) is relatively simple as one can directly
    apply the algorithms from Java 3. However, the challenges relate to three situations:


    +   1. When inserting rows or columns, expression''s references to cells may change.
    For example, if you insert a row, all references in expressions that are larger
    than the index for the row count are counted by 1. The same applies to columns.

    2. By copying/pasting formulas, the formula''s cell references must be changed
    in relation to how far a formula is moved.

    3. Formulas can refer to other cell references, and thus there is the possibility
    of circular references. This problem is partially solved by the fact that after
    each entry of a formula, the program checks whether the formula results in a circular
    reference.


    Some of the module''s methods are used to handle these situations.'
