    APPENDIX B: JSON


    As long you only have to manipulate JSON data on the client page, there is actually
    not much else to tell than what appears from the above, if data has to be sent
    to or received from a server, they must be parsed to be used. For example, if
    you want to send JSON data from the client to a Java bean on the server side,
    and afterwards it should be able to use that data, they must be parsed or decoded
    to a Java object, using standard parsers that can be downloaded and used by the
    server code. Similarly, on the server side, you can encode beans as JSON data
    before they are sent to the client, and on the client side, correspondingly, you
    must download JavaScript parsers that can decode the data sent from the server.
    I do not want to review in this place, but I can mention that it is quite simple
    and requires only some browsing on the Internet.


