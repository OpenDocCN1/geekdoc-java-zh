    \ 1. The internal function g(0) shows the value of this variable, after which\
    \ it is counted up with 1. The function f(0) returns the internal function g(0).\
    \ Note that it is legal, as a function is specifically an object. In the body\
    \ section, the function f(0) is performed and its return value is stored in the\
    \ variable h, which refers to a function and the function f(0) terminates. Next,\
    \ h(0) is performed, which means that it is the function g(0) as is performed\
    \ as an alert(0) shows the value 1, which is the value of the local variable t\
    \ in f(0). When h() is executed the second time, it will display 2. There is still\
    \ the value of t and you can see that t is not initialized again and thus not\
    \ removed after f(0) is terminated. The reason is that there is an indirect reference\
    \ to t via g(0). When f(0) terminates, t is not removed since h refers to g(0)\
