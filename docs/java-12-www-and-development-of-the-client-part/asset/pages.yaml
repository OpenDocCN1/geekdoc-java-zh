    # 3 CASCADING STYLE SHEETS


    After the above HTML, I''m ready for a short introduction on style sheets, and
    I will take as as the starting point the same program as in the previous chapter.
    I have added a new HTML document to the project and called styledoc.html. The
    content is the same as index.html and the goal is to show how the document''s
    visual presentation can be changed using a style sheet. Initially I have created
    a directory resources and including a subdirectory css and added a style sheet
    named styles.css.


    ![](img/8d3e018e6b832623c734fb380b355a77_16_0.png)


    It is, nothing but an empty file. The document that has to use a style sheet must
    have a link in the header:


    ```

    <head>

    <title>HTML Application</title>

    <meta charset="UTF-8">

    <link href="resources/css/styles.css" rel="stylesheet" type="text/css"

    </head>

    ```


    The syntax should be correct and you can easily drag the file into the document
    with the mouse, and NetBeans will automatically insert the correct link.


    The idea of style sheets is as mentioned to separate content and presentation.
    A style sheet consists of styles identified by selectors, and as an example, I
    have added the following style h1 to the style sheet:


    ```

    h1 {

    font-size: 36pt;

    font-weight: bold;

    color: darkslateblue;

    }

    ```


