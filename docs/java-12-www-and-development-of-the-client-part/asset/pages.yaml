    # JAVASCRIPT


    The most important thing the example is how to transfer a parameter to the event

    handlers. It is an object called event and, and as illustrated below, it is an
    advanced object with

    many properties and methods.


    Properties of the event object


    +   - event.clientX and event.clientY indicates in the case of a mouse event the
    coordinates

    for the mouse relative to the browser window.

    - event.offsetX and event.offsetY indicates in the case of a mouse event the coordinates

    for the mouse relative to the element that has raised the event.

    - event.keyCode indicates in case of a key event code for key pressed.

    - event.target is a pointer to the node in the DOM tree, which has raised the
    event.

    - event.currentTarget is a pointer to the node in the DOM tree, which was bubbled

    and captured.

    - event.eventPhase indicates the event phase as 1 for capture, 2 for target, 3
    for bubbling.

    - event.type indicates event type such as click, press, etc.

    - event.relatedTarget indicates for some events (for example mouseout) the element

    that originally raised the event.


