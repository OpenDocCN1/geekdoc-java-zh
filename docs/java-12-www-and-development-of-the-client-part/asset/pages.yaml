    # 5.4 JSF LISTENERS


    JSF components can raise different events when rendered (where the names tell
    when the

    events occur):


    +   - preRenderComponent,

    - postAddToView

    - preValidate

    - postValid


    You can define listeners for these events, which are Java code, which are performed
    on the

