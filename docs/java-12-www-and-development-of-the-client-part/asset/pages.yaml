  md: '# 2 HTML


    In the Java 11, I have said that I do not want to treat HTML, and the following
    is also just an ultra short presentation that merely highlights the most important
    HTML concepts, but as the browser basically receives HTML, it is useful with a
    short introduction to the subject. This is especially true after the use of HTML5,
    as this standard adds some subjects and principles, and the standard is gradually
    supported by most browsers.


    HTML is very closely linked to cascading style sheets, also known as CSS, and
    as that HTML uses markup structure data while CSS defines how the individual elements
    should be displayed in the browser. Styling of HTML elements should occur in its
    own domain, calling a Cascading Style Sheet, while the HTML document alone must
    care of structuring the data. That way, web pages are much easier to maintain.


    A HTML document has the basic form:


    ```

    <!DOCTYPE html>

    <head>

    <title>HTML Application</title>

    <meta charset="UTF-8">

    </head>

    <body>

    ...

    </body>

    </html>

    ```


    but many development tools add their own elements to the header. HTML define more
    structural elements which are most important are:


    +   - section, that represents a section in a document, and it can get together
    with h1–h6 elements to be used to indicate the document''s structure, and a section
    must start with a h element

    - article, that represents an independent piece of content in a document and as
    the name says out, an article, and an article must start with a h element

    - aside, that represents a content that is only slightly related to the rest of
    the page

    - header, that represents a header section

    - footer, that represents a footer section and will often contain information
    about the author, copyright information and so on

    - nav, that represents a section in the document intended for navigation (links)

    - dialog, that is used to mark up a conversation

    - figure, that can be used to associate a caption together with some embedded
    content, such as a graphic or a video'
