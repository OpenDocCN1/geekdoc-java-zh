  md: 'You can also define a so-called ID selector, known as it starts with the character
    #


    ```

    #content-list {

    font-size: 14pt;

    font-weight: bold;

    color: darkgray;

    }

    ```


    This selector is used by an element whose id is content-list, and as element''s
    id attribute should be unique, there is only one element in a document that directly
    can use this style. In this case, it is the following element:


    ```

    <p id="content-list">Content</p>

    ```


    Finally, you can define class selectors, starting with a point:


    ```

    .default-text {

    width: 800px;

    color: #222222;

    }

    ```


    An element can use a class selector by directly specifying it with a class attribute:


    ```

    <p class="default-text">In the book Java 11, ... </p>

    ```


    As another example of selectors, there is defined a class with the name forward
    that defines the color as green:


    ```

    .forward {

    color: darkgreen;

    }

    ```


    ```

    .forward h5 {

    color: darkred;

    }

    ```'
