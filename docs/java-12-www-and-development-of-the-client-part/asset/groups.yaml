    # Events


    DOM defines exactly how to interact with the individual elements. Most events
    relates to the mouse, and for a particular event you can associate an event handler
    with an element in the document. When a user interacts with an element, the browser
    checks whether an event handler has been registered for that element, and if so,
    the handler is executed. The elements are in a document part of a hierarchy and
    an event will bubble through the tree of all parent elements, and for all parent
    elements where an event handler has been registered for that event, this will
    be executed. When the event reaches the top – that is, the body element – an event
    will follow the same path back until returns to the element that originally raised
    the event. The two phases are called *bubbling phase* and the *capturing phase*,
    and you can specify the phase in which you wish to process the event.


    When an event handler is performed, it is done in the same way as any JavaScript
    function within a context, and DOM defines that it is the context of the element
    to which that handler is related. You can therefore refer to the element that
    the event concerns with the *this* reference.


    DOM defines the following events:


    +   - events for the mouse: *click, mousedown, mouseup, mousemove, mouseover,
    mouseout* and more

    - events for the keyboard: *keypress, keydown, keyup*

    - events for objects: *load, error, scroll*

    - events for forms: *select, change, submit, reset, focus*

    -n-events for user interaction: *focusin, focusout*


