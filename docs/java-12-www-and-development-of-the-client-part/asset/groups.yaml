    \ look at Ajax in connection with facelets, but the book also deals with other\
    \ topics related to JavaFaces.\n\n# 2 HTML\n\nIn the Java 11, I have said that\
    \ I do not want to treat HTML, and the following is also just an ultra short presentation\
    \ that merely highlights the most important HTML concepts, but as the browser\
    \ basically receives HTML, it is useful with a short introduction to the subject.\
    \ This is especially true after the use of HTML5, as this standard adds some subjects\
    \ and principles, and the standard is gradually supported by most browsers.\n\n\
    HTML is very closely linked to cascading style sheets, also known as CSS, and\
    \ as that HTML uses markup structure data while CSS defines how the individual\
    \ elements should be displayed in the browser. Styling of HTML elements should\
    \ occur in its own domain, calling a Cascading Style Sheet, while the HTML document\
    \ alone must care of structuring the data. That way, web pages are much easier\
    \ to maintain.\n\nA HTML document has the basic form:\n\n```\n<!DOCTYPE html>\n\
    <head>\n<title>HTML Application</title>\n<meta charset=\"UTF-8\">\n</head>\n<body>\n\
    ...\n</body>\n</html>\n```\n\nbut many development tools add their own elements\
    \ to the header. HTML de-fine more structural elements which are most important\
    \ are:\n\n- section, that represents a section in a document, and it can get together\
    \ with h1–h6 elements to be used to indicate the document's structure, and a section\
    \ must start with a h element\n- article, that represents an independent piece\
    \ of content in a document and as the name says out, an article, and an article\
    \ must start with a h element\n- aside, that represents a content that is only\
    \ slightly related to the rest of the page\n- header, that represents a header\
    \ section\n- footer, that represents a footer section and will often contain information\
    \ about the author, copyright information and so on\n- nav, that represents a\
