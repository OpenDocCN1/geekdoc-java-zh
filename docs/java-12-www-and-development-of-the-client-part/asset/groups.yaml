  mdcn: "\n\n# JAVA 12：WWW 与客户端部分开发：软件开发\n\n## JAVASCRIPT\n\n这其中并没有什么奥秘，但在浏览器解释了上述元素后，就会进入\
    \ `script` 部分，这里有一个 `alert()` 显示文本。这意味着如上一个示例所示，浏览器会停止并等待用户点击“确定”。当这种情况发生时，浏览器将继续处理文档，下一个元素是另一个显示第一段落文本的\
    \ `alert()`。你应该注意如何通过特定的 ID 引用元素，以及如何通过 `innerText` 引用元素的文本。\n\n`alert()` 会显示整个文本，包括\
    \ `span` 元素中的文本，但最后部分并不是旧的，因为 JavaScript 不解释 HTML。当你点击确定时，浏览器将继续解释并执行 JavaScript\
    \ 语句。这里有一个所有 `p` 元素的数组——总共 2 个——随后的循环将它们的 `class` 设置为 `redStyle`，之后文本变为红色——包括\
    \ `span` 元素中的文本。一旦发生这种情况，就会执行一个新的 `alert()`，显示数组 `pars` 的长度，其主要目的是让解析器停止，以便你可以看到两个段落中的所有文本都是红色的：\n\
    \n![](img/8d3e018e6b832623c734fb380b355a77_37_0.png)\n\n在 bookboom.com 下载免费电子书\
    \ 点击广告阅读更多\n\n# JAVA 12：WWW 与客户端部分开发：软件开发\n\n## JAVASCRIPT\n\n## DOM\n\n当你点击确定时，浏览器继续执行\
    \ JavaScript。`spans` 同样是一个包含所有 `span` 元素的数组（共 2 个），随后的循环将文本设置为绿色。\n\n脚本的最后部分通过确定一个包含所有带有\
    \ `bold` 类元素的数组 `classes` 开始。接下来，这些元素的字体变为*斜体*，结果是浏览器显示了：\n\n![](img/8d3e018e6b832623c734fb380b355a77_37_0.png)\n\
    \n## DOM\n\n本文涉及 Regnar Lodbrog，一位丹麦维京战士\n\n## JavaScript 中的对象\n\nJavaScript 是一种面向对象的语言，但与类并没有相似之处，构建新对象的唯一方法是通过原型（prototyping）。通过这种方式，创建的新对象在\
    \ Java 中可以被视为另一个对象的拷贝。更精确地说，JavaScript 中的任何对象都有名为 `prototype` 的属性，该属性引用了从父对象继承的所有（属性和方法）。这意味着如果你尝试引用某个对象的属性或方法，解释器将首先检查该对象是否定义了该属性。如果不是，则会检查\
    \ `prototype` 所指向的对象，直到在层次结构中找到定义该属性的对象或者解释器得出该属性是未定义的（undefined）。属性可以被覆盖，任何覆盖都会影响在继承层次结构中定义的对象。最好将这种形式视为一个简单的列表，其中原型引用之前的（父级）元素。这种继承的一个重要结果是，对象的属性更改对于层次结构中的所有对象都是重要的。\n\
    \n# JAVA 12：WWW 与客户端部分开发：软件开发 JAVASCRIPT\n\n以下示例将说明这些概念中的一些，特别是创建对象的语法：\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>原型继承</title>\n<script>\nvar obj0 = {\n\
    \  a: 23,\n  b: 29\n}\n\nvar obj1 = Object.create(obj0);\nvar obj2 = Object.create(obj1);\n\
    </script>\n</head>\n<body>\n<h1>Prototypal arv</h1>\n<script>\nalert(obj2.a);\n\
    obj0.a = 19;\nalert(obj2.a);\n</script>\n</body>\n</html>\n```\n\n（注：原文中存在大量重复的块和损坏的\
    \ HTML 标签，译文已按逻辑结构进行了去重整合。）\n\n"
