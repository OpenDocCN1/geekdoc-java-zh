    Java 12: WWW 与客户端开发


    # 前言


    这本书是软件开发系列中的第十二本。编程语言是 Java，语言及其语法显然涵盖了大部分内容，但书中很大程度上也关注如何开发良好的应用程序。这本书与 Java
    11 关于 Web 应用程序开发类似，但重点关注客户端。这意味着关键主题是样式表和 JavaScript，特别是最后一部分。另一个主题是 Ajax，书中简要介绍了
    PrimeFaces。书的主要目的是展示如何使用 JavaScript 进行复杂的编程。正如标题所示，这系列书籍是关于软件开发的，目标是通过学习主题和学习程序来学习如何
    Java 开发应用程序，最重要的是让读者从头编写自己的程序。因此，书中重要的部分是练习和问题，读者需要编写与书中处理的内容相应的程序。所有的书籍都围绕相同的框架构建，由文本、示例、练习和问题组成，练习部分相对准确地描述了要做什么，而问题部分描述得比较随意，并且是真正的最佳解决方案。这些书籍应该从头读到尾，但大量的代码示例、练习和问题起着核心作用，重要的是读者在详细研究代码的同时解决练习和问题，或者只是研究推荐的解决方案。


    Java 12: WWW 与客户端开发软件开发


    大多数书籍都以附录结束，处理一个书中未涉及的主题。这可能是关于软件安装或其他计算机技术问题，这些不属于软件开发，但需要介绍性知识。如果读者已经熟悉该主题，可以跳过当前的附录。


    编程语言如前提到的 Java，书中还使用了以下产品：


    - 1. NetBeans 作为应用程序开发的 IDE

    - 2. MySQL，如果需要数据库服务器（从 Java 6 书开始）

    - 3. GlassFish 作为 Web 服务器和应用服务器（从 Java 11 书开始）


    这些产品都是免费且可安装的，书中甚至提到了安装过程可以自动完成，不需要费力的努力和挑战。此外，在网上有所有产品的详细安装说明。这些产品在 Windows 和
    Linux 上可用，因此无论你使用 Linux 还是 Windows 都没有特殊之处。


    所有示例程序都是在运行 Linux 的机器上开发和测试的。事实上，这并没有主要影响，因为无论平台是哪一个，Java 和其他产品的工作方式完全相同。书中某些地方你会看到平台是
    Linux，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 Linux 机器上开发并没有意义，除非程序引用了可能需要更改文件名的文件系统，它们可以立即在
    Windows 下运行。


    最后，简单谈一下这些书籍不是什么。它们不是“如何编写”，也不是 Java 的参考手册，而是如标题所示，关于软件开发的书籍。我希望读者在阅读书籍并通过大量示例时，能够找到编写良好程序的灵感，但也可以将其作为一个资源集，包含许多解决你作为软件开发者经常面临的具体的日常编程问题的解决方案示例。


    在在 bookboon.com 下载免费电子书


    # 引言


    在 Java 11 书中，我提供了 Java Web 应用程序开发的入门介绍。我主要处理了服务端，即浏览器向 Web 服务器发送请求，服务器根据请求携带的数据动态创建发送给客户端的
    HTML 文档。这种客户端/服务器原理也是 Web 应用程序的核心思想，事实上，在这里就可以停止了，因为所有的 Web 应用程序都可以根据 Java 11
    中的概述进行开发。然而，还有很多需要学习，在这里我想提到：


    - 1. 开发具有吸引力用户界面的应用程序的可能性，特别是易于维护的用户界面。

    - 2. 客户端编程，其中部分代码在浏览器中执行，目的是防止每次向服务器发送请求。


