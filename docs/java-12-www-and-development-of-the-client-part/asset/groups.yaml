    # 5 JAVASERVER FACES AND AJAX


    In this book, I have alone looked at the client side, including how to define
    a layout of a page using, and how to use JavaScript to modify the individual elements
    of a DOM tree. It takes place in the browser and without the server''s involvement.
    In this chapter, I will again look at the server side where the code is executed
    on the basis of a request from the browser and the server then answers back with
    a response, which means the browser should render the document again. With the
    help of JavaScript, it is possible to execute that form of a request/response
    in such a way that the user does not observe the page being updated and the application
    essentially behave in the same way as a standard desktop application. This technique
    is called Ajax.


    Ajax is a family of technologies that enable JavaScript to perform tasks asynchronously
    when the browser sends requests to the server in the background, which then sends
    back to the client that can be used to update the DOM tree. The technology is
    widely used in all web applications.


    You can basically associate ajax facilities with JSF input component with fajax,
    which means an interaction between client and server, based on a particular event,
    an interaction performed asynchronously and parallel with the user. A number of
    attributes are attached to fajax, where all specified has default value:


    - delay: which is a value specified in milliseconds and indicates the maximum
    size of delay between request and response (none).

    - disabled: which is a boolean indicating that function is disabled (false).

    - event: which specifies the event for component that triggers the request.

    - execute: which specifies the list of components to be performed on the server.

    - immediate: which is a boolean that indicates the input should be processed immediately.

    - listener: which specifies the name of listener method to be performed.

    - onevent: which specifies the name of JavaScript function to be performed.

    - onerror: which specifies the name of JavaScript function for error handling.

    - render: which is list of components to rendered after ajax function.


    ## JSF FACES AND AJAX


    For execute and render attributes, the following terms are available for specifying
    components:


    - @all, that means all components

    - @form, that means all components in the form, that contains the component function

    - @none, that means none and is default

    - @this, that means the parent component separated by spaces

    - @id, A JS expression


    To illustrate how ajax works, I want to show a number of examples that extend
    an existing application with ajax, and it will be based on application Change3
    from Java 11.


    ![](img/8d3e018e6b832623c734fb380b355a77_110_0.png)


