    \ html>\n<html>\n<head>\n  <title>CubesProgram</title>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <script src=\"resources/js/tools.js\" type=\"text/javascript\"></script>\n\
    </head>\n<body>\n  <h1>Play Yatzy</h1>\n  <script>\n    var count = 0;\n    do\
    \ (\n      cup.toss();\n```\n\n```\ndocument.write(cup + \"<br/>\");\n++count;\n\
    while (!cup.yatzy);\n</script>\n<h3>You've got yatzy after <script>document.write(count)</script>\
    \ attempts</h3>\n</body>\n</html>\n```\n\nTest the program, at it should works\
    \ as before.\n\nWhen using JavaScript, you will usually place the code in its\
    \ own file, as shown in this exercise.\n\n# Arrays\n\nArrays works immediately\
    \ in the same way as in other programming languages and with the same syntax known\
    \ from Java, but there are also important differences. In JavaScript arrays are\
    \ dynamic and should not be allocated for a certain size. The following function\
    \ opens a popup that shows the length of an array as well the array's elements:\n\
    \n```\nfunction show(arr)\n{\nvar str = arr.length + \"\\n\";\nfor (var i = 0;\
    \ i < arr.length; ++i) str += \"\\n\" + arr[i];\nalert(str);\n}\n```\n\nIf you\
    \ consider this function, note that syntactically, an array is used in the same\
    \ way as in Java. An array has a length property, and the individual elements\
    \ are referenced via 0-based index.\n\n```\nvar arr1 = {\"Svend\", \"Knud\", \"\
    Valdemar\"};\n```\n\nThe statement creates an array of three elements and sends\
    \ this array to the function show(), you receives an alert as shown below:\n\n\
    ![](img/8d3e018e6b832623c734fb380b355a77_76_0.png)\n\nSince an array has no type,\
    \ an array can contain elements of different types:\n\n```\nvar arr2 = [\"Gorm\"\
    , 3.13, { x: 2, y: 3 }, obj1];\n```\n\nwhere the array contains a string, a number\
    \ and two objects. You can also create an array with a constructor function:\n\
    \n```\nvar arr3 = new Array();\nshow(arr3);\n```\n\nand the result is an empty\
    \ array. If you have an array, you can immediately add items, the array will dynamically\
    \ expand:\n\n```\narr3[0] = 11;\narr3[1] = 13;\narr3[2] = 17;\narr3[3] = 19;\n\
    show(arr3);\n```\n\nand the array now have 4 elements:\n\n![](img/8d3e018e6b832623c734fb380b355a77_78_0.png)\n\
    \nAn array may also have \"holes\", and thus elements that are not defined:\n\n\
    ```\narr1[5] = \"Erik\";\nshow(arr1);\n```\n\n![](img/8d3e018e6b832623c734fb380b355a77_78_1.png)\n\
    \nConstructor functions can have parameters:\n\n```\nvar arr4 = new Array(4);\n\
    var arr5 = new Array(23, 29, 31, 37);\n```\n\nand here the first creates an array\
    \ of length 4 with 4 undefined elements, while the other creates an array with\
    \ 4 elements. Finally, you note that you can change the value of the property\
    \ length and delete elements in an array. As mentioned, you reference elements\
    \ in an array using a numeric index, and indexing is actually more flexible than\
    \ you would expect. Consider the following code:\n\n```\nvar arr = new Array();\n\
    arr[0] = 2;\narr[1] = 3;\narr[\"3\"] = 5;\narr[\"abc\"] = 7;\nshow(arr);\n```\n\
    \nFirst, note that the code does not fail and it will display the following alert:\n\
    \n```\n4\n2\n3\nundefined\n5\nOK\n```\n\nIf the index is not a number, the interpreter\
    \ will try to convert it to an integer and the result of\n\n```\narr[\"3\"] =\
    \ 5;\n```\n\nis therefore the element with index 3. On the other hand, it is not\
    \ immediately clear what\n\n```\narr[\"abc\"] = 7;\n```\n\nmeans \"abc\" cannot\
    \ be converted to a number. An array is an object, and therefore you can specifically\
    \ define its own properties. This is exactly what happens as arr[\"abc\"] is interpreted\
    \ as a property named abc, which then gets the value 7. There is reason to be\
    \ aware of this interpretation as it is easy to accidentally add properties to\
    \ an array. In this case statement\n\n```\nalert(arr.abc);\n```\n\nwill show 7.\
    \ The elements in an array can be anything and hence especially other arrays.\
    \ It allows to simulate multidimensional arrays. For example will the following\
    \ code display with the value:\n\n```\nvar v1 = [2, 3, 6];\nvar v2 = [7, 8, 9];\n\
    var v3 = [10, 11];\nvar v = [v1, v2, v3];\nvar s = 0;\nfor (var i = 0; i < v.length;\
    \ ++i)\n  for (var j = 0; j < v[i].length; ++j)\n    s += v[i][j];\nalert(s);\n\
    ```\n\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT\n\
    \nIn particular, note how iterates the array $v$ as a 2-dimensional array, but\
    \ it is the programmer's responsibility that the elements in $v$ are actually\
    \ arrays. Otherwise, you will get an error. Below is defined array consisting\
    \ of arrays:\n\n```\nvar konger = [[\"Gorm\", 958], [\"Harald Blåt\", 958, 986]];\n\
    for (var i = 0; i < konger.length; ++i) show(konger[i]);\n```\n\nYou should note\
    \ that there are no standard functions for arrays that I mentions in a later section.\n\
    \n# EXERCISE 2\n\nThe Fibonacci numbers are, as you know, the following sequence:\n\
    \n0, 1, 1, 2, 3, 5, 8, 13, 21, ...\n\nCreate a new project, that you can call\
    \ FiboProgram. The project must have a start page index.html that shows the first\
    \ 95 fibonacci numbers in a table. The program should be written as follows:\n\
    \n- 1. The project must have a JavaScript file, that contains a module fibonacci,\
    \ which automatically creates a private array, that contains the fibonacci numbers.\
    \ The module must have two public properties, where the first is called length,\
    \ and the other a simple property whose value is the length of the array, while\
    \ the other function(get), that returns the nth fibonacci number.\n- 2. The table\
    \ and the header title must generate the table in JavaScript.\n- 3. The start\
    \ page.html must dynamic generate the table.\n\n# Functions\n\nIn JavaScript a\
    \ function can be mentioned as an object. This means for example that a function\
    \ can be returned from another function and be a parameter to another function.\
    \ It also means that a function may have properties and methods like other object.\
    \ These relationships that functions in many ways are different from others in\
    \ other languages like Java.\n"
  mdcn: "\n\n# JAVA 12: WWW 与客户端部分开发：软件开发 JAVASCRIPT\n\n在头部定义中有一个修改过的骰子，它代表一个包含 5\
    \ 个骰子和三个公共属性的骰子：\n\n- toss()，一个方法，模拟骰子的使用\n- yatzy()，一个方法，测试所有 5 个骰子的值是否都相同\n\
    - toString()，对 toString() 的重写\n\n最初，一个构造方法定义了创建骰子对象的方法。定义了一个公共对象，通过构造方法创建一个包含\
    \ 5 个骰子的数组。该公共对象有三个实现这些方法的函数。正文模拟使用骰子，直到所有骰子的值都相同。\n\n# 练习 1\n\n创建 `CubesProgram`\
    \ 程序的副本。你必须创建一个 `resources` 文件夹并在该文件夹下创建一个 `js` 子文件夹，然后放入 JavaScript 文件：\n\n![](img/8d3e018e6b832623c734fb380b355a77_75_0.png)\n\
    \n你必须将所有代码从 `index.xhtml` 移动到 `tools.js` 中——但不要包含 `<script>` 元素。`index.xhtml`\
    \ 必须在 JavaScript 文件中有一个链接。你通过将名称拖到头部来实现。`index.xhtml` 的结果应该如下：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>CubesProgram</title>\n  <meta charset=\"UTF-8\"\
    >\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <script src=\"resources/js/tools.js\" type=\"text/javascript\"></script>\n\
    </head>\n<body>\n  <h1>Play Yatzy</h1>\n  <script>\n    var count = 0;\n    do\
    \ (\n      cup.toss();\n```\n\n```\ndocument.write(cup + \"<br/>\");\n++count;\n\
    while (!cup.yatzy);\n</script>\n<h3>You've got yatzy（在经过 <script>document.write(count)</script>\
    \ 次尝试后获得了 yatzy）</h3>\n</body>\n</html>\n```\n\n测试该程序，它应该像以前一样正常工作。\n\n当使用 JavaScript\
    \ 时，你通常会将代码放在它自己的文件中，正如本练习所示。\n\n# 数组\n\n数组的工作方式与其他编程语言完全相同，并使用了在 Java 中熟悉的语法，但存在一些重要的区别。在\
    \ JavaScript 中，数组是动态的，不应为特定大小分配内存。以下函数会弹出一个窗口，显示数组的长度以及数组元素：\n\n```\nfunction\
    \ show(arr)\n{\nvar str = arr.length + \"\\n\";\nfor (var i = 0; i < arr.length;\
    \ ++i) str += \"\\n\" + arr[i];\nalert(str);\n}\n```\n\n考虑这个函数，请注意在语法上数组的使用方式与\
    \ Java 相同。数组有一个长度 属性，单个元素通过从 0 开始的索引引用。\n\n```\nvar arr1 = {\"Svend\", \"Knud\"\
    , \"Valdemar\"};\n```\n\n该语句创建一个包含三个元素的数组并将将其发送到函数 `show()`，你将收到如下所示的警框：\n\n![](img/8d3e018e6b832623c734fb380b355a77_76_0.png)\n\
    \n由于数组没有类型，数组可以包含不同类型的元素：\n\n```\nvar arr2 = [\"Gorm\", 3.13, { x: 2, y: 3 },\
    \ obj1];\n```\n\n其中数组包含一个字符串、一个数字和两个对象。你也可以使用构造函数创建一个数组：\n\n```\nvar arr3 = new\
    \ Array();\nshow(arr3);\n```\n\n结果是一个空数组。如果你有一个数组，可以立即添加项，数组将动态扩展：\n\n```\narr3[0]\
    \ = 11;\narr3[1] = 13;\narr3[2] = 17;\narr3[3] = 19;\nshow(arr3);\n```\n\n现在数组有\
    \ 4 个元素：\n\n![](img/8d3e018e6b832623c734fb380b355a77_78_0.png)\n\n数组也可能存在“空洞”，因此存在未定义的元素：\n\
    \n```\narr1[5] = \"Erik\";\nshow(arr1);\n```\n\n![](img/8d3e018e6b832623c734fb380b355a77_78_1.png)\n\
    \n构造函数可以有参数：\n\n```\nvar arr4 = new Array(4);\nvar arr5 = new Array(23, 29, 31,\
    \ 37);\n```\n\n这里第一个创建一个长度为 4 包含 4 个未定义元素的数组，而另一个创建一个包含 4 个元素的数组。最后，你你可以更改 `length`\
    \ 属性的值并删除数组中的元素。正如前面提到的，你使用数字索引引用数组中的元素，而索引实际上比你想象的要灵活。考虑以下代码：\n\n```\nvar arr\
    \ = new Array();\narr[0] = 2;\narr[1] = 3;\narr[\"3\"] = 5;\narr[\"abc\"] = 7;\n\
    show(arr);\n```\n\n首先，注意代码不会报错，它将显示以下警框：\n\n```\n4\n2\n3\nundefined\n5\nOK\n```\n\
    \n如果索引不是数字，解释器将尝试将其转换为整数，因此\n\n```\narr[\"3\"] = 5;\n```\n\n结果是索引为 3 的元素。另一方面，并不立刻清楚\n\
    \n```\narr[\"abc\"] = 7;\n```\n\n意味着什么，因为 \"abc\" 无法转换为数字。数组是一个对象，因此你可以特意地定义它自己的属性。这正是发生的情况，因为\
