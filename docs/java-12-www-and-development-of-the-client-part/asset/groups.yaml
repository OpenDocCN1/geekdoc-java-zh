- md: "\n[content]\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT\
    \ JAVASCRIPT\n\n```javascript\n(function () {\n  document.write(obj1 + obj2 +\
    \ obj3);\n})();\n\n<script>\n<body>\n</html>\n```\n\nIf the document is opened\
    \ in the browser, you get the result:\n\n![](img/8d3e018e6b832623c734fb380b355a77_69_0.png)\n\
    \n# Objects\n\nAn object is simply a collection of properties that may be of some\
    \ value. The type of a property can be anything and especially an object, and\
    \ since a function is an object, an object can also contain functions. You creates\
    \ an object as follows:\n\n```javascript\nvar obj1 = {\n  a: 2,\n  b: 3,\n  c:\
    \ 5\n}\nvar obj2 = {};\n```\n\nwhere two objects have been created. The first\
    \ three properties, while the other is an empty object. In JavaScript, you do\
    \ not have classes, as you know from Java, and you cannot inherit the same way\
    \ you know from this language, but in JavaScript you use a form of inheritance\
    \ called prototyping in short means that you can create objects by expanding existing\
    \ objects. For example, if you write\n\n```javascript\nvar obj3 = Object.create(obj1);\n\
    obj3.d = 7;\n```\n\nan object has been created that inherits obj1 and expands\
    \ this object with an additional property. For you performs the following statements:\n\
    \n```javascript\nalert(obj3.a + obj3.b + obj3.c + obj3.d);\nobj1.a = 11;\nalert(obj3.a\
    \ + obj3.b + obj3.c + obj3.d);\n```\n\nthe first alert() will show 17 and the\
    \ other 26. Here, you should note that changing the value of the property a on\
    \ the object obj1 also has an effect on the object obj3 which justifies the relationship\
    \ between obj1 and obj3 being a form of inheritance. Technically, it is implemented\
    \ by the fact that each object has a property called prototype. This property\
    \ refers to properties inherited from the parent object (the object from which\
    \ the current object is created based on). When you try to refer a property on\
    \ an object, the interpreter will first search for this property in the current\
    \ object and if it does not find the property the interpreter will search in its\
    \ parent via prototype. This continues until you find the desired property or\
    \ cannot find it. This may be interrupted by overriding a property. As is an example\
    \ of how another object extends obj1 using a method:\n\n```javascript\nvar obj4\
    \ = Object.create(obj1);\nobj4.f = function (t) { return t * (this.a + this.b\
    \ + this.c); }\n```\n\nNote that although the method f() is a property in the\
    \ object obj4 which extends obj1, the method cannot immediately refer to its other\
    \ properties, but it can be solved with this referring to the current object.\
    \ The following statement\n\n```javascript\nalert(obj4.f(2));\n```\n\nwill alert()\
    \ verify the value 20. As another example of how to define an object using a method,\
    \ you can consider the following:\n\n```javascript\nvar obj5 = {\n  x: 3.14,\n\
    \  y: 1.41,\n  g: function (z) { return (this.x + this.y)/z; }\n}\n```\n\nIf you\
    \ perform the following statement\n\n```javascript\nalert(obj5.g(3));\n```\n\n\
    you get the result 1.516666666666666.\n\n# JAVA 12: WWW AND DEVELOPMENT OF THE\
    \ CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\nSince obj1 is as above, you\
    \ usually refer to the individual properties using the dot notation, but you can\
    \ also use array notation, which uses the name of the property as an index:\n\n\
    ```javascript\nalert(obj1.a);\nalert(obj1[\"a\"]);\n```\n\nBoth of these statement\
    \ will display an alert() with the value 2. The main application of the last notation\
    \ is that it allows to loop over an object's properties without knowing their\
    \ names:\n\n```javascript\nfor (var t in obj1) alert(obj1[t]);\n```\n\nThis statement\
    \ will alert 2, 3 and 5.\n\nYou can create objects in three ways. You can create\
    \ objects directly as shown above with obj1 and obj5, that is, you directly write\
    \ the properties that the object should have. You can also create an object with\
    \ Object.create() as obj3 and obj4, where an object is created as an extension\
    \ of another object. Finally, you can create objects using a constructor. Consider\
    \ the following function:\n\n![](img/8d3e018e6b832623c734fb380b355a77_71_0.png)\n\
    \nSIMPLY CLEVER\nŠKODA\nWe will turn your CV into an opportunity of a lifetime\n\
    \nDo you like cars? Would you like to be a part of a successful brand? We will\
    \ appreciate and reward both your enthusiasm and talent. Send us your CV. You\
    \ will be surprised where it can take you.\n\nSend us your CV on www.employerforlife.com\n\
    \n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\
    \n```javascript\nfunction pointConstructor(x, y) {\n  this.x = x;\n  this.y =\
    \ y;\n  this.dist = function (p) {\n    return Math.sqrt((this.x - p.x) * (this.x\
    \ - p.x) + (this.y - p.y) * (this.y - p.y));\n  };\n  this.toString = function\
    \ () { return \"\" + this.x + \", \" + this.y + \"\"; }\n}\n```\n\nThe function\
    \ creates an object with 4 properties, where the last two are methods. An object\
    \ is perceived as a point in a coordinate system, and the method dist() has a\
    \ parameter that is to be interpreted as a point. The method returns the distance\
    \ between the current point and the parameter p. The last method is an override\
    \ of toString(). You should note that the method has parameters, but it is not\
    \ necessary. Below is how to use the constructor to create two objects:\n\n```javascript\n\
    var p1 = new pointConstructor(2, 3);\nvar p2 = new pointConstructor(5, 7);\n```\n\
    \nThe following statement\n\n```javascript\nalert(p1 + \"\\n\" + p2 + \"\\n\"\
    \ + p1.dist(p2));\n```\n\nwill opens a popup as shown:\n\n![](img/8d3e018e6b832623c734fb380b355a77_72_0.png)\n\
    \nIn principle, it does not matter whether an object is created in one way or\
    \ another and you use the most appropriate way. However, you must note that the\
    \ constructor resembles how to create objects in Java.\n\n# JAVA 12: WWW AND DEVELOPMENT\
    \ OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\nI will finish this section\
    \ on objects with an example of a cup object representing a 5-cube raffle cube\
    \ where a cube should be represented by a cube object. The example applies in\
    \ addition more control statements (loops) and also arrays that are dealt with\
    \ the next section. The example will also use the module concept described in\
    \ the previous section.\nThe code is as follows:\n\n```html\n<!DOCTYPE html>\n\
    <head>\n  <title>CubesProgram</title>\n  <meta charset=\"UTF-8\">\n  <meta name=\"\
    viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <script>\n  \
    \  var cup = (function() {\n      function cube() {\n        this.eyes = 1;\n\
    \        this.roll = function () {\n          this.eyes = Math.floor(Math.random()\
    \ * 6) + 1;\n        };\n        this.valueOf = function () {\n          return\
    \ this.eyes;\n        }\n      }\n\n      public = {\n        cubes: [new cube(),\
    \ new cube(), new cube(), new cube(), new cube()],\n\n        toss: function ()\
    \ {\n          for (var i = 0; i < this.cubes.length; ++i) this.cubes[i].roll();\n\
    \        },\n\n        yatzy: function () {\n          var t = this.cubes[0].eyes;\n\
    \          for (var i = 1; i < this.cubes.length; ++i)\n            if (this.cubes[i]\
    \ != t) return false;\n          return true;\n        },\n\n        toString:\
    \ function () {\n          var str = this.cubes[0].eyes;\n          for (var i\
    \ = 1; i < this.cubes.length; ++i)\n            str += \" \" + this.cubes[i].valueOf();\n\
    \          return str;\n        }\n      };\n\n      return public;\n    })()\n\
    \  </script>\n</head>\n<body>\n  <h1>Play Yatzy</h1>\n  <script>\n    var count\
    \ = 0;\n    do {\n      cup.toss();\n      document.write(cup + \"<br/>\");\n\
    \      count++;\n    } while (!cup.yatzy());\n  </script>\n  <h3>You've got yatzy\
    \ after <script>document.write(count)</script> attempts</h3>\n</body>\n</html>\n\
    ```\n[/content]\n"
  mdcn: "\n[content]\n# JAVA 12：WWW 与客户端部分的开发：软件开发 JAVASCRIPT\n\n```javascript\n(function\
    \ () {\n  document.write(obj1 + obj2 + obj3);\n})();\n\n<script>\n<body>\n</</html>\n\
    ```\n\n如果如果在浏览器中打开该文档，你将得到结果：\n\n![](img/8d3e018e6b832623c734fb380b355a77_69_0.png)\n\
    \n# 对象\n\n对象简单来说是一个具有某些值的属性的集合。属性的类型可以是任何类型，特别是对象；由于函数也是一个对象，因此对象也可以包含函数。你可以按照以下方式创建对象：\n\
    \n```javascript\nvar obj1 = {\n  a: 2,\n  b: 3,\n  c: 5\n}\nvar obj2 = {};\n```\n\
    \n这里创建了两个对象。第一个有三个属性，另一个是空对象。在 JavaScript 中，你没有像在 Java 中知道的那种类，也无法像你在该语言中了解的方式进行继承，但在\
    \ JavaScript 中，你使用一种被称为“原型”（prototyping）的继承形式，简而言之你可以通过扩展现有对象来创建对象。例如，如果你写下\n\n\
    ```javascript\nvar obj3 = Object.create(obj1);\nobj3.d = 7;\n```\n\n则创建了一个继承 obj1\
    \ 的对象，并通过额外的属性扩展了该对象。为你执行以下语句：\n\n```javascript\nalert(obj3.a + obj3.b + obj3.c\
    \ + obj3.d);\nobj1.a = 11;\nalert(obj3.a + obj3.b + obj3.c + obj3.d);\n```\n\n\
    第一个 `alert()` 将显示 17，另一个显示 26。在这里，你应该注意，更改对象 obj1 上属性 `a` 的值也会影响对象 obj3，这证明了 obj1\
    \ 和 obj3 之间的关系是某种形式的继承。从技术上讲，它是通过每个对象都有一个名为 `prototype`（原型）的属性来实现的。该属性引用从父对象（创建当前对象的对象）中继承的属性。当你尝试引用对象上的属性时，解释器首先会在当前对象中搜索该属性，如果找不到，解释器将通过原型在其父对象中搜索。此过程一直持续直到你找到所需的属性或无法找到。这可能会通过覆盖属性被中断。以下是另一个对象使用方法扩展\
    \ obj1 的示例：\n\n```javascript\nvar obj4 = Object.create(obj1);\nobj4.f = function\
    \ (t) { return t * (this.a + this.b + this.c); }\n```\n\n请注意，虽然方法 `f()` 是扩展 obj1\
    \ 的对象 obj4 中的一个属性，但该方法不能直接引用它的其他属性，但可以通过引用当前对象（使用 `this`）来解决。以下语句\n\n```javascript\n\
    alert(obj4.f(2));\n```\n\n`alert()` 将验证值为 20。作为另一个使用方法定义对象的示例，你可以考虑以下内容：\n\n```javascript\n\
    var obj5 = {\n  x: 3.14,\n  y: 1.41,\n  g: function (z) { return (this.x + this.y)/z;\
    \ }\n}\n```\n\n如果你执行以下语句\n\n```javascript\nalert(obj5.g(3));\n```\n\n你将得到结果 1.5166666666666666。\n\
    \n# JAVA 12：WWW 与客户端部分的开发：软件开发 JAVASCRIPT\n\n由于 obj1 如上所示，你通常使用点表示法（dot notation）引用单个属性，但也可以使用数组表示法，使用属性名作为索引：\n\
    \n```javascript\nalert(obj1.a);\nalert(obj1[\"a\"]);\n```\n\n这两个语句都将显示值为 2 的 `alert()`。最后一种表示法的主要应用是它允许在不知道属性名称的情况下遍历对象的属性：\n\
    \n```javascript\nfor (var t in obj1) alert(obj1[t]);\n```\n\n该语句将弹出 2, 3 和 5。\n\
    \n你可以通过三种方式创建对象。你可以像上面使用 `obj1` 和 `obj5` 那样直接创建对象，即你直接编写对象应该拥有的属性。你也可以使用 `Object.create()`像\
    \ `obj3` 和 `obj4` 那样创建对象，其中对象作为另一个对象的扩展创建的。最后，你可以使用构造函数创建对象。考虑以下函数：\n\n![](img/8d3e018e6b832623c734fb380b355a77_71_0.png)\n\
    \nSIMPLY CLEVER\nŠKODA\n我们将你的简历变成一个一生难得的机会\n\n你喜欢汽车吗？你想成为一个成功品牌的一部分吗？我们会欣赏并奖励你的热情和才华。向我们发送你的简历。你会惊讶它能带你去什么地方。\n\
    \n在 www.employerforlife.com 向我们发送你的简历\n\n# JAVA 12：WWW 与客户端部分的开发：软件开发 JAVASCRIPT\n\
    \n```javascript\nfunction pointConstructor(x, y) {\n  this.x = x;\n  this.y =\
    \ y;\n  this.dist = function (p) {\n    return Math.sqrt((this.x - p.x) * (this.x\
    \ - p.x) + (this.y - p.y) * (this.y - p.y));\n  };\n  this.toString = function\
    \ () { return \"\" + this.x + \", \" + this.y + \"\"; }\n}\n```\n\n该函数创建一个具有 4\
    \ 个属性的对象，其中最后两个是方法。对象被视为坐标系中的一个点，方法 `dist()` 有一个被解释为点的参数。该方法返回当前点与参数 `p` 之间的距离。最后一个方法是\
    \ `toString()` 的覆盖。你应该注意该方法有参数，但并不是必须的。以下是如何使用构造函数创建两个对象：\n\n```javascript\nvar\
    \ p1 = new pointConstructor(2, 3);\nvar p2 = new pointConstructor(5, 7);\n```\n\
    \n以下语句\n\n```javascript\nalert(p1 + \"\\n\" + p2 + \"\\n\" + p1.dist(p2));\n```\n\
    \n将打开如所示的弹出窗口：\n\n![](img/8d3e018e6b832623c734fb380b355a77_72_0.png)\n\n原则上，以哪种方式创建对象并不重要，但你必须注意构造函数在\
    \ Java 中是如何创建对象的。\n\n# JAVA 12：WWW 与客户端部分的开发：软件开发 JAVASCRIPT\n\n在本节中，我们将处理对象的控制语句（循环）和数组。示例还使用了上一节描述的模块概念。代码如下：\n\
    \n```html\n<!DOCTYPE html>\n<head>\n  <title>CubesProgram</title>\n  <meta charset=\"\
    UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\"\
    >\n  <script>\n    var cup = (function() {\n      function cube() {\n        this.eyes\
    \ = 1;\n        this.roll = function () {\n          this.eyes = Math.floor(Math.random()\
    \ * 6) + 1;\n        };\n        this.valueOf = function () {\n          return\
    \ this.eyes;\n        }\n      }\n\n      public = {\n        cubes: [new cube(),\
    \ new cube(), new cube(), new cube(), new cube()],\n\n        toss: function ()\
