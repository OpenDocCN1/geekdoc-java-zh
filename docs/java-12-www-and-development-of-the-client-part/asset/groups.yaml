    where a user can enter an address and other information. Clicking the Send button
    sends this information to the server where they are stored in a list. If you want
    to see the content of the list, you can click on the link. When data is sent to
    the server, they are validated and if there are errors, data is not saved, the
    server responds with error messages.


    It works fine, but it would be more appropriate to validate each field immediately
    after the text is entered. It is the server that validates the fields, a request
