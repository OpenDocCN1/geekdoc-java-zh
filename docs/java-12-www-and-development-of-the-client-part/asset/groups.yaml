    # Scope


    In JavaScript, there are slightly different rules for the scope of variables than
    in Java, variables have functional scope. That is to, a variable defined in a
    function is known only in the function, but in return throughout the function
    wherever it is defined. The variable is also known in nested functions. You should
    also be aware that JavaScript hoisting, which means that a variable can be used
    anywhere in the function where it is created – even before it is defined. The
    reason is that the interpreter starts creating variables as that the variables
    all were defined at the start of the function. However, you must not create a
    variable at that time is not necessarily assigned a value.


    A variable can also have global scope, which is the case if it is defined outside
    of a function, and such a variable can be used anywhere in the domain. Normally,
    you could var in front of a variable when created, but it is actually not necessary
    (but can be recommended). A variable defined without var has automatic global
    scope wherever it is created.


    In most programming languages, a variable is removed when the program leaves the
    scope where the variable is defines, and it is also the case in JavaScript. That
    is, variables are created when the function in which they are defined. It is at
    least the basic rule, but it does not necessarily apply. The reason is that in
    JavaScript a function is itself an object, and a function can thus return a function,
    and for example it can return an internal object. This inner function can refer
    to a variable in the enclosing function, and thus there may be a reference to
    a local variable after a function has been completed. If so, the variable will
    not be removed, a fact called closures.


