- md: "\n[content]\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT\n\
    \nIn Java, you have a foreach loop, which is actually an iterator. There is a\
    \ corresponding variant of a for loop in JavaScript, sometimes called for-in.\
    \ It can be used to iterate all properties in an object. Below is an object with\
    \ 4 properties and the following loop determines the sums of these four properties\
    \ for a for-in loop:\n\n```\nvar obj = {\n  a: 2,\n  b: 3,\n  c: 5,\n  d: 7\n\
    }\nvar s = 0;\nfor (var t in obj) s += obj[t];\nalert(s);\n```\n\n# 4.3 GLOBAL\
    \ OBJECTS AND FUNCTIONS\n\nJavaScript is born with global objects and some global\
    \ functions that are immediately available and in terms of methods offer a variety\
    \ of services. The global objects are:\n\n- 1. Array\n2. Boolean\n3. Date\n4.\
    \ Math\n5. Number\n6. RegExp\n7. String\n\nI do not want to review these objects\
    \ and their methods here, but the names tell you a bit about what you can do with\
    \ them and you are encouraged to investigate the properties of the objects (there\
    \ are many reefs on the internet describing these objects and methods). Finally,\
    \ there are the following global functions, whose behavior you are also encouraged\
    \ to investigate:\n\n- 1. eval()\n2. isFinite()\n3. isNaN()\n4. parseFloat()\n\
    5. parseInt()\n\n# EXERCISE 3\n\nCreate a web application, that you can call ScriptLibrary.\
    \ Create a folder resources and subfolder js and add a JavaScript file with the\
    \ name pascript.js. The file implements a module called patools (or whatever name\
    \ you want), and you should think of the module as a JavaScript library. The library\
    \ should have four properties:\n\n- 1. isInt, that is a function with one parameter,\
    \ and the function should return true, if the parameter is a legal integer.\n\
    - 2. isPrime, that is a function with one parameter, and the function should return\
    \ true, if the parameter is a prime number.\n- 3. isLeapyear, that is a function\
    \ with one parameter, and the function should return true, if the parameter represents\
    \ a leap year as a year between 1700 and 9999.\n- 4. isDate, that is a function\
    \ with one parameter, and the function should return true, if the parameter is\
    \ a legal date between 1700 and 9999. The parameter must be a string of the form\
    \ year, month and day (that is YYYY_MM_DD), where the separation character must\
    \ be -, /, space or nothing.\n\n![](img/8d3e018e6b832623c734fb380b355a77_89_0.png)\n\
    \nAmerican online\nLIGS University\ncurrently enrolling in the Interactive Online\
    \ BBA, MBA, MSc, DBA and PhD programs:\n\n- enroll by September 30th, 2014 and\n\
    - save up to 16% on the tuition!\n- pay in 10 installments / 2 years\n- Interactive\
