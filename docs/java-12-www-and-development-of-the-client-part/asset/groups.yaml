- md: "\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\
    \nIn the header definition is a modified cup, which represented a cup with 5 cubes\
    \ and three public attributes:\n\n- toss(), which is a method, which simulates\
