    var t1 = 23;\nt2 = 29;\n```\n\n在 bookoon.com 免费下载电子书\n\n## JAVA 12: WWW 与客户端部分的开发：软件开发\
    \ JAVASCRIPT\n\n在某些情况下，变量已经被创建，这种差异对于变量的作用范围至关重要。允许在同一语句中声明多个变量\n\n```javascript\n\
    var obj = {}, counter = 0, str = \"Knud\", flag = true;\n```\n\nJavaScript 具有函数作用域。如果你用\
