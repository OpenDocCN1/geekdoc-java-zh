    Then there is the MainController, which is a relatively comprehensive class. In
    principle, it is simple and the most important thing is that it acts for the first
    four functions in the toolbar, which are the only functions that call the server
    side. The class is used as controller for both index.servlet and open.servlet,
    and you should consider whether the class should be divided into two, so each
    servlet document has its own controller.


    The rest of the code is client code, primarily as JavaScript and style sheets.
    Regarding the latter, there are 4 style sheets, the two being of jQuery and are
    not modified. The other two are relatively simple and are used by index.servlet
    (styles.css) and open.servlet (dialogs.css) respectively. There are 8 JavaScript
