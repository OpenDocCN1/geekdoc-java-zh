    error message. When that event occurs, a request is made to the server, as asynchronously

    only for the current input component. As a result, the fields are validated as
    the form

    is completed and the user will experience the fact filling out a form in a conventional

    desktop application.


    You should note that as an alternative, all validation functions can be written
    as JavaScript

    functions in this case, but in other validation functions require a request to
    the server.


    # EXERCISE 4


    In this exercise, you should make a change to the above example. Start by creating
    a copy

    of the project ChangeAddress1. You must now change the program so the field for
    entering

    the name is readonly. The databasewikidata has a tail zipcode, which is of Danish

    zip codes. You must change the validation of the zip field code, so a zip code
    is only

    legal if there is an existing zip code in the tail zipcode. If this is the case,
    the city name

    m be updated with the corresponding city name, and otherwise the city name must
    be

    blank. The validation of the zip code field must still be done using ajax.


    # 5.2 SUBMIT FIELDS WITHOUT RELOAD


    As next, I want to show how you can submit all fields to the server, but

    without reloading the page. The benefits are not so big, but it gives a quieter
    window, as it

