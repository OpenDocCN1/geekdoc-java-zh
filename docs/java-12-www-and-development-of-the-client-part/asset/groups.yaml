    \ value=\"#{controller.date}\"/>\n    <f:validator validatorId=\"dateValidator\"\
    />\n    <f:ajax event=\"blur\" render=\"dateError\"/>\n    <h:message for=\"date\"\
    \ class=\"error-message\" id=\"dateError\"/>\n\n    <h:outputLabel value=\"职位:\"\
    \ for=\"title\"/>\n    <h:inputText id=\"title\" required=\"false\" style=\"width:\
    \ 300px\" value=\"#{controller.title}\" />\n    \n    <h:panelGroup>\n       \
