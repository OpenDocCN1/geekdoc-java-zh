    \ the program CubesProgram. You must create a folder resources and a subfolder\
    \ js to that folder JavaScript file:\n\n![](img/8d3e018e6b832623c734fb380b355a77_75_0.png)\n\
    \nYou must move all your code from index.xhtml to tools.js – but without the script\
    \ elements. index.xhtml must have a link in the JavaScript file. You do by dragging\
