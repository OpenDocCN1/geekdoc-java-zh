    2. Boolean（布尔值）\n3. Date（日期）\n4. Math（数学）\n5. Number（数字）\n6. RegExp（正则表达式）\n7.\
    \ String（字符串）\n\n我不想在这里回顾这些对象及其方法，但这些名称已经告诉了你可以用它们做些什么，鼓励你研究这些对象的属性（互联网上有许多描述这些对象和方法的资源）。最后，还有以下全局函数，我们也鼓励你研究它们的行为：\n\
    \n- 1. eval()\n2. isFinite()\n3. isNaN()\n4. parseFloat()\n5. parseInt()\n\n#\
    \ 练习 3\n\n创建一个可以调用 `ScriptLibrary` 的 Web 应用程序。创建一个 `resources` 文件夹和子文件夹 `js`，并添加一个名为\
    \ `pascript.js` 的 JavaScript 文件。该文件实现了一个名为 `patools`（或任何你喜欢的名称）的模块，你应该将该模块视为 JavaScript\
    \ 库。该库应该有四个属性：\n\n- 1. isInt，这是一个带有一个参数的函数，如果参数是合法整数，函数返回 `true`。\n- 2. isPrime，这是一个带有一个参数的函数，如果参数是质数，函数返回\
    \ `true`。\n- 3. isLeapyear，这是一个带有一个参数的函数，如果参数代表 1700 年到 9999 年之间的闰年，函数返回 `true`。\n\
    - 4. isDate，这是一个带有一个参数的函数，如果参数是 1700 年到 9999 年之间的合法日期，函数返回 `true`。该参数必须是年、月、日格式的字符串（即\
    \ `YYYY_MM_DD`），其中分隔符必须是 `-`、`/`、空格或无。\n\n![](img/8d3e018e6b832623c734fb380b355a77_89_0.png)\n\
    \n美国在线\nLIGS 大学\n正在招募在线 BBA、MBA、MSc、DBA 和博士学位课程：\n\n- 在 2014 年 9 月 30 日前报名\n-\
