    from the first node. The loop skips the blank elements and prints the text for
    paragraph elements. Please note that the loop stops with a break when you get
    to lastChild.


    There are a few things that you should notice. JavaScript uses the dot notation
    to refer to objects'' properties and methods – just as it is known from Java.
    In addition, please note that an alert() stops the browser''s parsing of the document,
    and alert() may therefore be a useful tool for debugging JavaScript.


    # Objects in JavaScript


    JavaScript is an object-oriented language, but there is nothing similar to a class,
    and the only method of constructing new objects is by prototyping, which is a
    form of copying an existing object. In this way, a new object is created which
    any object in Java can think of as a copy of another object. A bit more precisely,
    any object in JavaScript has a property called prototype, and this property refers
    to all properties (properties and methods) inherited from the parent object. This
    means that if you try to refer to a property or method of an object, the interpreter
    will first check if property is defined for the object in question. If this is
    not the case, the object to which prototype refers is checked, and neither is
    the property found in the hierarchy until it reaches an object where the property
    is defined or the interpreter can conclude that the object is undefined. Properties
    may be overridden, and any overrides will affect the object where the override
    is defined and down in the inheritance hierarchy. It is best to think of this
    form as a simple list, where prototype refers to the previous (parent) element.
    An important consequence of this inheritance is that a change of property of an
    object is important for all objects down in the hierarchy hierarchy.'
