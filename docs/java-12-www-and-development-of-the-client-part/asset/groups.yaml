    ## 8.3 PROGRAMMING


    I want to start with the server side and here the package worksheet.models, which
    contains 7 classes. The user name and password for the database as previously
    stored in web.xml, and two of the classes are shown in other examples and are
    used to retrieve the user information and create a connection to the database.
    The most important class is the class Repository, which is a singleton that provides
    the necessary database operations available, and since the database is simple,
    this class is similar. The package also contains a class Tools with static helper
    methods. Finally there are two model classes. The one is called SheetName and
    a class that represents 4 columns from the database table *id, name, created and
    modified* that it does not represent the content of a spreadsheet as it can fill
    part. The class is used for searching for spreadsheets. The last model class is
    called SheetMade and is derived from SheetName and expands with the last three
    columns. The class is used to represent the worksheet you are working on.


    Then there is the package worksheet.beans containing 6 classes, and here is the
    class ViewController, the most important, which is a named bean used by the two
    xml pages. Two of the classes are DateValidator and Converter, which are used
    in open.xml to validate a date and convert a date (a Calendar object) to a string,
    respectively, and not contain anything new to is mentioned in the previous book.
    There are three classes TableHeader, TableRow and TableCell, which are used to
    construct the HTML table. The classes are really redundant (at least the task
    could be solved without), but they are included for any extensions of the program,
    where these classes could be expanded with new properties.


    ![](img/8d3e018e6b832623c734fb380b355a77_148_0.png)


