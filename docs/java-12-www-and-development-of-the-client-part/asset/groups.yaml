    \ LIGS University is not accredited by any nationally recognized accrediting agency\
    \ listed by the US Secretary of Education.\n\ninfo here.\n\nDownload free eBooks\
    \ at bookoon.com\n\nClick on the ad to read more\n\n# JAVA 12: WWW AND DEVELOPMENT\
    \ OF THE CLIENT PART: SOFTWARE DEVELOPMENT\n\nWhen you have written the library\
    \ methods, you should test the module from index.html (see below). The html code\
    \ could be:\n\n```html\n<body>\n<h2>Test patools</h2>\n<form>\n<p>Enter a number\
    \ to test for prime number</p>\n<input type=\"text\" id=\"txtnumber\"&nbsp;&nbsp;\n\
    <input type=\"button\" value=\"Test\" onclick=\"validate();\" />\n<p><span id=\"\
    result1\"></span></p>\n<br/>\n<p>Enter date as year, month and day separated by\
    \ /, - or space</p>\n<input type=\"text\" id=\"txtdate\"&nbsp;&nbsp;\n<input type=\"\
    button\" value=\"Test\" onclick=\"validate2();\" />\n<p><span id=\"result2\"></span></p>\n\
    </form>\n</body>\n```\n\n![](img/8d3e018e6b832623c734fb380b355a77_90_0.png)\n\n\
    You must write event handlers for the two buttons. The first must test where the\
    \ value in the first field is a prime number and update the span element with\
    \ a message. The second must do the same, but for the other elements and test\
    \ where the value is a legal date.\n\nThe event handlers should be written in\
    \ the script block in the header. Note that it is also necessary to add a link\
    \ element for your JavaScript library.\n\n# JAVA 12: WWW AND DEVELOPMENT OF THE\
    \ CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\n# 4.4 DOM\n\nDOM stands for\
    \ Document Object Model and is a W3C standard for how browsers build HTML document\
    \ as a hierarchy of objects. DOM is not part of JavaScript, the DOM objects allow\
    \ JavaScript to manipulate the objects and refers to the contents of the current\
    \ document from script code. In combination with JavaScript, DOM is the key to\
    \ developing websites where something is happening on the client side. DOM is\
    \ a standard, but it is up to the browser vendors to implement this standard and\
    \ the standard is no better than to the extent the browser vendors live up to\
    \ it. This means that there may be (and are) differences between different browsers\
    \ and different versions of the same browser, but the most basic objects are,\
    \ however, implemented roughly standard.\n\nThe root of the DOM tree is window\
    \ and is an object consisting of several properties and collections. The main\
    \ property is document represents the document that the browser shows. Consider,\
    \ for example, the following document (DOMTree project):\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>DOMTree</title>\n<script>\ntree = \"\";\nfunction\
    \ parse(node)\n{\ntree += node.nodeName;\nif (node.nodeName === \"text\" && node.parentNode.nodeName\
    \ !== \"SCRIPT\") {\ntree += \" : \" + node.textContent;\nif (node.attributes\
    \ != null) {\nfor (var i = 0; i < node.attributes.length; i++) {\ntree += \" \"\
    \ + node.attributes[i].name + \" =\\\" + node.attributes[i].value;\n}\n}\nif (node.childNodes\
    \ != null) {\nfor (var j = 0; j < node.childNodes.length; j++) {\nparse(node.childNodes[j]);\n\
    }\n}\n}\nfunction build() {\nparse(document);\ndocument.getElementById('domTree').value\
    \ = tree;\n}\n</script>\n</head>\n<body onload=\"build()\">\n<h1 style=\"font-weight:normal\"\
    >DOMTree</h1>\n<p>DOM = Document Object Model</p>\n<textarea id=\"domTree\" style=\"\
    width:450px; height:500px\"></textarea>\n</body>\n</html>\n```\n\n# JAVA 12: WWW\
    \ AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASCRIPT\n\nIn the\
    \ DOM tree, each element in the document is represented by a node, and it also\
    \ applies to elements that are not visible, such as script element. The typical\
    \ use of JavaScript is to modify the DOM tree, including specifically changing\
    \ nodes. In this case, the script element begins by defining a global variable.\
    \ The function `parse()` has a node as a parameter, and it starts by adding this\
    \ node's name to the variable `tree`. If attributes are attached to the node,\
    \ they are also added to the variable. Finally, if there are child nodes, the\
    \ function `parse()` is called recursively for each node.\n\nYou must know the\
    \ syntax for `parse()`. Of course, it is not so easy to guess what the individual\
    \ properties are called, but when you see the result, it's easy to follow what\
    \ happens. There is another function `build()` which calls the recursive function\
    \ with the `document` object as parameter. When the function `parse()` is performed,\
    \ the function `build()` will with a reference to the element id `domTree` (which\
    \ is a textarea) insert the value of the global variable `tree`. The `build()`\
    \ function is performed as an event handler for `onload` that occurs after the\
    \ document is loaded and displayed, and after that the DOM tree is built.\n\n\
