    function f() {\n  var t = 1;\n  function g() {\n    alert(t++);\n  }\n  return\
    \ g;\n}\n</script>\n</head>\n<body>\n<script>\nvar h = f();\nh();\n</script>\n\
    </body>\n</html>\n```\n\n如果在浏览器中打开，第一个 `alert(0)` 将显示 1，下一个 `alert(0)` 显示 2。如果你考虑函数\
    \ `f()`，它有一个局部变量 `t` 被赋值为值 1。内部函数 `g()` 显示该变量的值，之后自增 1。函数 `f()` 返回了内部函数 `g()`。注意，这是合法的，因为函数具体来说是一个对象。在\
    \ `body` 部分，执行了函数 `f()`，其返回值存储在变量 `h` 中，`h` 指向函数且函数 `f()` 结束。接着执行了 `h()`，这意味着函数\
    \ `g()` 被执行，`alert(0)` 显示值为 1，这是 `f()` 中局部变量 `t` 的值。当 `h()` 第二次执行时，它将显示 2。仍然存在\
    \ `t` 的值，你可以看到 `f()` 结束后 `t` 并没有被移除。原因是通过 `g()` 间接引用了 `t`。当 `h()` 第二次执行时，它将显示\
    \ 2。仍然存在 `t` 的值，你可以看到 `f()` 结束后 `t` 并没有被移除。原因是通过 `g()` 间接引用了 `t`。这就是闭包。\n\n##\
    \ JAVA 12: WWW 与客户端部分的开发：软件开发 JAVASCRIPT\n\n### 类型\n\n在 JavaScript 中，创建变量时不应指定任何数据类型。这认为是一种弱类型语言。然而，这等同于\
    \ JavaScript 没有类型，基本上有 4 种类型：\n\n- 布尔（Boolean）：值为 `false` 或 `true` 的变量或表达式。\n\
    - 数字（Number）：64 位浮点数。\n- 字符串（String）：字符的随机序列。\n- 对象（Object）：属性和方法的集合。\n\n语言弱类型意味着运行时系统根据变量和表达式的值自动确定类型。这意味着变量的类型在其生命周期内可以改变，并且始终由变量的值决定。例如以下代码：\n\
