    # JAVA 12: 客户端部分的 Web 与开发：软件开发


    我还会提到 Java applet（Java 小型程序），它们是由浏览器执行的程序代码，但这些通常是从服务器下载的通用二进制 Java 代码，浏览器随后可以使用插件来执行这些代码。应该注意的是，你拥有完整的
    Java 环境，而且在原则上，applet 可以执行 Java 应用程序能够完成的所有操作。出于这个原因，许多人对 Java applet 并不感到兴奋，因为
    applet 存在重大的安全风险，而且也有例子证明这种担心是有根据的。Java applet 目前的使用范围有限，书中将不再对其进行讨论。


    书中还将包含与服务器相关的话题，特别是我将结合 facelets 介绍 Ajax，但书中也涉及了与 JavaFaces 相关的其他主题。


    # 2 HTML


    在 Java 11（此处此处可能指前章节）中，我提到过不想处理 HTML，接下来的内容也只是一个极短的演示，仅强调了最重要的 HTML 概念，但由于浏览器基本上接收的是
    HTML，因此对该主题进行简短介绍是有用的。这在使用 HTML5 之后尤为如此，因为该标准增加了一些主题和原则，并且大多数浏览器已逐渐支持该标准。


    HTML 与层叠样式表（也称为 CSS）关系非常密切，HTML 使用标记结构化数据，而 CSS 定义了单个元素在浏览器中应如何显示。HTML 元素的样式化应该在它自己的领域内进行（通过调用层叠样式表），而
    HTML 文档本身必须负责数据的结构化。这样，网页将更容易维护得多。


    一个 HTML 文档具有基本形式：


    ```

    <!DOCTYPE html>

    <head>

    <title>HTML Application</title>

    <meta charset="UTF-8">

    </head>

    <body>

    ...

    </body>

    </html>

    ```


    但许多开发工具会向页头（header）中添加它们自带的元素。HTML 定义了更多结构性元素，其中最重要的有：


    - section：代表文档中的一个章节，它可以与 h1–h6 元素一起使用以指示文档结构，且 section 必须以 h 元素开头

    - article：代表文档中 true独立的内容，正如其名所示，是一篇文章，且 article 必须以 h 元素开头

    - aside：代表与页面其他部分仅有微相关的内容

    - header：代表页眉部分

    - footer：代表页脚部分，通常包含关于作者、版权信息等内容

    - nav：代表文档中用于导航（链接）的章节

    - dialog：用于标记对话/对话框

    - figure：可以将说明与某些嵌入内容（如图形或视频）关联


    HTML 文档并不要求使用这些元素（这些是在 HTML5 中引入的），但除了其他因素，建议它们可以在样式表中进行样式化。同样，建议 HTML 文档采用以下结构，其中可能有更多的章节，且某些元素可以被完全省略：


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Html5Document</title>

    <meta charset="UTF-8">

    </head>

    <body>

    <h1>HTML5 Document</h1>

    <header>

    <h2></h2>

    <nav>

    <ul>

    <li>例如一个菜单</li>

    </ul>

    </nav>

    </header>

    <section>

    <h2>章节标题</h2>

    <article>

    <header>

    <h2>文章标题</h2>

    <p>该标题的引言</p>

    </header>

    <p>这里是文本。</p>

    </article>

    <article>

    <header>

    <h2>文章标题</h2>

    <p>该标题的引言</p>

    </header>

    <p>这里是文本。</p>

    </article>

    </section>

    <aside>

    <h2>关于</h2>

    <p>关于内容</p>

    </aside>

    <footer>

    <p>版权信息</p>

    </footer>

    </body>

    </html>

    ```


    '
