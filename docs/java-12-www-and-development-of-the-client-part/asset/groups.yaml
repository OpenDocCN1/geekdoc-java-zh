    Click on the add to read more\n"
  mdcn: "\n# JAVA 12：WWW 与客户端部分的开发：软件开发\n\n在 Java 中，你有一个 `foreach` 循环，它实际上是一个迭代器。JavaScript\
    \ 中有一个对应的 `for` 变体，有时被称为 `for-in`。它可以用于遍历对象中的所有属性。下面是一个具有 4 个属性的对象，以下循环通过 `for-in`\
    \ 循环确定了这四个属性之和：\n\n```\nvar obj = {\n  a: 2,\n  b: 3,\n  c: 5,\n  d: 7\n}\nvar\
