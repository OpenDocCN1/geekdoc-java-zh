- md: "\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT JAVASERVER\
    \ FACES AND AJAX\n\n```xml\n</h:panelGrid>\n<h:commandLink value=\"Show addresses\"\
    \ action=\"list.xhtml\" immediate=\"true\" />\n</h:body>\n<h:form id=\"form2\"\
    >\n</h:form>\n<html></body>\n</html>\n```\n\nThe validation takes place in the\
    \ same way, but the writing method is all the more straightforward. Note that\
    \ it is necessary to specify the fields (for error messages) to be rendered. However,\
    \ there is one difference since validation occurs every time a focus event occurs\
    \ and each time an input field is left. This means that it is only one error message\
    \ regarding the relevant input component that appears – which may sometimes be\
    \ the most appropriate.\n\n## 5.3 CONVERTERS\n\nIn this example I will show the\
    \ use of converters where you can attach a converter to an input component. It\
    \ has not directly to do with the ajax, but is often used in conjunction with\
    \ ajax. The example is the same as above, and I have started with a copy of ChangeAddress3,\
    \ which I have called ChangeAddress4. As an example of using converters, it must\
    \ be such that the city name will automatically be converted to lowercase letters,\
    \ Such a converter can be written as follows:\n\n```java\npackage changeaddress.validators;\n\
    \nimport javax.faces.component.UIComponent;\nimport javax.faces.context.FacesContext;\n\
    import javax.faces.converter.Converter;\nimport javax.faces.converter.FacesConverter;\n\
    \n@FacesConverter(\"changeaddress.validators.UpperConverter\")\npublic class UpperConverter\
    \ implements Converter\n{\n    @Override\n    public Object getAsString(FacesContext\
    \ context, UIComponent component, String value)\n    {\n        return value.toUpperCase();\n\
    \    }\n```\n\n```java\n@Override\npublic String getAsString\n(FacesContext context,\
    \ UIComponent component, Object value)\n{\n  return value.toString().toUpperCase();\n\
    }\n```\n\nand is relatively trivial. There is a corresponding converter class\
    \ LowerConverter. As an example of using a slightly more interesting converter,\
    \ the application has been changed so that you can edit the date field again,\
    \ but I have preserved that the field is initialized with today. On the other\
    \ hand, I want greater flexibility with regard to entering a date, so it should\
    \ be allowed to use spaces instead of hyphens. To solve it, I have added the following\
    \ converter to the program:\n\n```java\npackage changeaddress.validators;\n\n\
    import javax.faces.component.UIComponent;\nimport javax.faces.context.FacesContext;\n\
    import javax.faces.convert.Converter;\nimport javax.faces.convert.FacesConverter;\n\
    ```\n\n![](img/8d3e018e6b832623c734fb380b355a77_119_0.png)\n\n```java\n@FacesConverter(\"\
    address.validators.DateConverter\")\npublic class DateConverter implements Converter\n\
    \n```java\n@Override\npublic Object getAsObject(FacesContext context, UIComponent\
    \ component, String value) {\n    String[] elems = value.split(\"-\");\n    if\
    \ (elems.length == 3) return value;\n    elems = value.split(\"/\");\n    if (elems.length\
    \ == 3) return value.replace('/', '-');\n    elems = value.split(\" \");\n   \
    \ if (elems.length == 3) return value.replace(' ', '-');\n    return value;\n\
    }\n```\n\n```java\n@Override\npublic String getAsString(FacesContext context,\
    \ UIComponent component, Object value) {\n    String text = value.toString();\n\
    \    String[] elems = text.split(\"-\");\n    if (elems.length == 3) return text;\n\
    \    elems = text.split(\"/\");\n    if (elems.length == 3) return text.replace('/',\
    \ '-');\n    elems = text.split(\" \");\n    if (elems.length == 3) return text.replace('\
    \ ', '-');\n    return value.toString();\n}\n```\n\nBack here is the application,\
    \ for example shown below is the use of DateConverter.\n\n```xml\n<h:outputLabel\
    \ value=\"Enter date:\" for=\"date\"/>\n<h:inputText id=\"date\" label=\"Change\
    \ date\" style=\"width:100px\" value=\"#{indexController.date}\"/>\n<f:validator\
    \ validatorId=\"dateValidator\"/>\n<f:converter converterId=\"address.validators.DateConverter\"\
    />\n</h:inputText>\n<h:message for=\"date\" class=\"error-message\" id=\"dateError\"\
    />\n```\n\nThe two others are used in the same value. Since the field must be\
    \ updated immediately after the entry, the f:ajax element must also be updated:\n\
    \n```xml\n<f:ajax event=\"blur\" render=\"dateError\"/>\n```\n\nLooking at the\
    \ input component, it has both a validator and a converter, and here you should\
    \ be aware of the order when the methods are performed:\n\n1. getAsObject() //\
    \ the DateConverter\n2. validate() // the DateValidator\n3. getAsString() // the\
    \ DateConverter\n\n## 5.4 LISTENERS\n\nJSF components can raise different events\
    \ (when events occur):\n\n- preRenderComponent\n- postAddToView\n- preValidate\n\
    - postValid\n\nYou can define listeners for these events, which are Java code\
    \ which are performed on the server. For example, I have created project of ChangeAddress4\
    \ and called ChangeAddress5. First of all, I have changed the code for index.xhtml\
    \ so that, like ChangeAddress1, it has function for each input component. The\
    \ next step, IndexController is expanded with two methods:\n\n```java\npublic\
    \ String isWeekend() {\n    String[] elems = person.getDate().split(\"-\");\n\
    \    Calendar date = new GregorianCalendar(Integer.parseInt(elems[2]),\n    Integer.parseInt(elems[1])\
    \ - 1, Integer.parseInt(elems[0]));\n    return date.get(Calendar.DAY_OF_WEEK)\
    \ == Calendar.SUNDAY ||\n    date.get(Calendar.DAY_OF_WEEK) == Calendar.SATURDAY\
    \ ? \"red\" : \"darkgreen\";\n}\n```\n\n```java\npublic void checkForWeekend(ComponentEvent\
    \ event) {\n    UIOutput output = (UIOutput) event.getComponent();\n    if (isWeekend().equals(\"\
    red\")) output.setValue(\"Weekend\");\n    else output.setValue(\"Everyday\");\n\
    }\n```\n\nThe class Person has a property date initialized with today, and the\
    \ first method where this date is for weekend (Saturday or Sunday). If that is\
    \ the case, the method returns the text red or otherwise the text darkgreen. The\
    \ next method is a listener method. Its parameter is an event and the method determines\
    \ the component to which the event relates. The Person object's date property\
    \ is weekend, the component's value is set to Weekend and otherwise to Everyday.\n\
    \nThe two methods are basically simple Java methods, and I will now show how they\
    \ can be used as event handlers in index.xhtml. The form is expanded with a new\
    \ element (the only requirement is that it a component with a value property):\n\
    \n```xml\n<h:outputText value=\"Enter date:\" for=\"date\"/>\n<h:inputText id=\"\
    date\" label=\"Change date\" style=\"width:100px\" value=\"#{indexController.date}\"\
    >\n<f:validator validatorId=\"dateValidator\"/>\n<f:converter converterId=\"address.validators.DateConverter\"\
    />\n<f:ajax event=\"blur\" render=\"dateError\"/>\n</h:inputText>\n<h:message\
    \ for=\"date\" class=\"error-message\" id=\"dateError\"/>\n```\n\n![](img/8d3e018e6b832623c734fb380b355a77_122_0.png)\n\
    \n# We do not reinvent the wheel we reinvent light.\n\nFascinating lighting offers\
    \ an infinite spectrum of possibilities: Innovative technologies and new markets\
    \ provide both opportunities and challenges. An environment in which your expertise\
    \ is in high demand. Enjoy the supportive working within our global group and\
    \ benefit from international career paths. Implement sustainable ideas in close\
    \ cooperation with other specialists and contribute to influencing our future.\
    \ Come and join us in reinventing every day.\n\nLight is OSRAM\n\n![](img/8d3e018e6b832623c734fb380b355a77_122_1.png)\n\
    \n```xml\n<h:panelGroup>\n  <h:outputText id=\"weekend\"\n    style=\"font-style:\
    \ italic; color: #{indexController.isWeekend()}\">\n    <f:event type=\"preRenderComponent\"\
    \n    listener=\"#{indexController.checkForWeekend()}\"/>\n  </h:outputText>\n\
    </h:panelGroup>\n```\n\nThe new elements have an id with the value weekend as\
    \ well as a style attribute, where you should primarily note that the value of\
    \ color is determined by the return value from the method isWeekend(), which is\
    \ either red or darkgreen. As a result, the text appears as red or green. Finally,\
    \ the element defines an event of the type preRenderComponent. That is, the event\
    \ handler (the element's listener) is performed before the element is rendered\
    \ and the handler is checkForWeekend() in the controller class. It is executed\
    \ each time the element is rendered, which naturally occurs when the page is rendered,\
    \ but it also happens when the input component date is changed.\n"
