    ## 组件库


    如上一章所示，JSF 特别是结合 Ajax 使用时提供了一系列功能，使得开发吸引且动态的 Web 应用程序变得简单，但还有很多可以做的，其中 JSF 组件库就包含几个部分。在本章中，我将对这些库之一——名为
    PrimeFaces 的库进行介绍。基本上，它是一个为每个标准 JSF 组件定义了自己的组件的库，并扩展了一个 Web 应用程序的骨架，便于从零开始开发稳定的应用程序。使用
    PrimeFaces 的主要目的是创建用户友型的 Web 应用程序，但该库还提供了 JSF 没有立即提供的其他功能；事实上，它的理念是尽可能减少使用样式表和
    JavaScript —— 这两者在实践中可能非常耗时。


    正如前面提到的，还有其他的 JSF 组件库，但我想通过 NetBeans 介绍 PrimeFaces，而无需安装相关的库（这非常简单）。使用 PrimeFaces
    可以获得显著的益处，但代价是标必须熟悉该库（有点类似于 jQuery），并且你应该意识到 PrimeFaces 的开发者对 Web 应用程序的外观和工作方式有一套想法，如果你想偏离这一点，并不总是如愿意的。


    我想从一个普通的 Web 应用程序开始，我将其命名为 ChangeAddress6。当我来到框架时，我像往常一样选择了 JavaFaces，在这里我点击了“组件”（Components）标签页并选择了
    PrimeFaces：


