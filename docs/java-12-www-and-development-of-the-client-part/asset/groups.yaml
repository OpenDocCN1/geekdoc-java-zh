  mdcn: "\n\n# JAVA 12：万维网与客户端部分的开发：软件开发层叠样式表\n\n所有类名为 `king` 的元素下的所有元素。最后，有三种与属性相关的样式。它们被用于带有\
    \ `data-info` 属性的段落，特别是你可以选择以下属性文本：\n\n- [attr^=\"text\"] 以 `text` 开头的属性\n- [attr=\"\
    text\"] 以 `text` 结尾的属性\n- [attr*=\"text\"] 包含 `text` 的属性\n\n实际上，还有其他的几个选项。\n\n\
    ## 3.2 样式 (STYLES)\n\n上面我展示了如何从样式表引用到 HTML 树中的单个元素的示例，在很多其他地方也可以使用样式，你应该知道它们的含义——而且真的非常多。为\
    \ HTML 文档设置样式是一个广泛的话题，对样式的妥当处理超出了本书的范围。在这一节中，我将概述一些基本原则，但在设计现代 Web 应用程序之前，还有很多内容。然而，我想再次强调，开发工具通常支持样式设置，并且在实践中很有帮助，尽管要理解许多可能性的效果绝非易事。\n\
    \n基础样式包括：\n\n- 元素填充浏览器的程度\n- 元素所在\n- 单个元素内容的格式化，包括字体和颜色\n\n基本上，一个 HTML 元素表现为一个盒模型：\n\
    \n![](img/8d3e018e6b832623c734fb380b355a77_24_0.png)\n\n中间是内容（如果有内容的话），在没有内边距（padding）的情况下，表示内容外部应该留多少空间。对于带有样式的元素，大多数情况下宽度和高度意味着包含\
    \ padding 在内的内容区域大小，但可以通过 `box-sizing` 进行更改。在 padding 周围可能有一个边框（border），最后在所有范围内可能有一个外边距（margin）。例如，如果你指定了背景颜色，它将适用于整个\
    \ padding 区域。你应该特别注意，margin 区域是透明的，仅用于创建元素之间的间距。请注意，如果元素垂直对齐的且两个外边距（顶部和底部）相遇，它们会自动折叠合并为两者中较大的那一个。\n\
    \n许多元素如 `p`、`h` 和 `article` 的行为如上所述，并将内容显示为块，因此被称为块级盒（block boxes）。其他如 `strong`\
    \ 和 `span` 是行内盒（inline boxes），因为它们构成了单行的内容。不同元素如何显示其内容可以通过 `display` 来定义，从而覆盖它们默认的显示内容方式。浏览器可以用几种方式布局元素，但默认是静态的（static），对于块级盒，这意味着它们垂直堆叠在一起；而对于行内盒，这意味着它们水平排列在同一行上并自动换行。\n\
    \n正如前面提到的，元素的位置被定义为静态的，这意味着元素在窗口中浮动，但你可以定义其他选项，通过一个示例可以很好地说明这一点。如果你在浏览器中应用 PositionDocument，你可以得到如下所示窗口：\n\
