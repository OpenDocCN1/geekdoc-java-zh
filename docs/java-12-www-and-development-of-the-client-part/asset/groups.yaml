    \ event=\"blur\" render=\"firstNameError\"/>\n```\n\nHere you indicate that the\
    \ ajax function must be executed after the input field has lost focus, as well\
    \ as which element may be rendered in case of an error that is the element of\
    \ the error message. When that event occurs, a request is made to the server,\
    \ as asynchronously only for the current input component. As a result, the fields\
    \ are validated as the form is completed and the user will experience the fact\
    \ filling out a form in a conventional desktop application.\n\nYou should note\
    \ that as an alternative, all validation functions can be written as JavaScript\
    \ functions in this case, but in other validation functions require a request\
    \ to the server.\n\n# EXERCISE 4\n\nIn this exercise, you should make a change\
    \ to the above example. Start by creating a copy of the project ChangeAddress1.\
    \ You must now change the program so the field for entering the name is readonly.\
    \ The databasewikidata has a tail zipcode, which is of Danish zip codes. You must\
    \ change the validation of the zip field code, so a zip code is only legal if\
    \ there is an existing zip code in the tail zipcode. If this is the case, the\
    \ city name m be updated with the corresponding city name, and otherwise the city\
    \ name must be blank. The validation of the zip code field must still be done\
    \ using ajax.\n\n# 5.2 SUBMIT FIELDS WITHOUT RELOAD\n\nAs next, I want to show\
    \ how you can submit all fields to the server, but without reloading the page.\
    \ The benefits are not so big, but it gives a quieter window, as it all happens\
    \ asynchronously, and the user, to a lesser extent, note that data being to the\
    \ server, and since the entire document not be rendered again. I will use the\
    \ sample as above, and I have started with a copy that I have ChangeAddress2.\n\
    In Index.xhtml, I changed two pages. The Submit button now has an action:\n\n\
    ```xml\n<f:commandButton value=\"Send\" action=\"#{indexController.add()}\" >\n\
    <f:ajax event=\"action\" execute=\"@form\" render=\"@all\"/>\n</h:commandButton>\n\
    ```\n\nAnd you should note that the function is triggered by an action event that\
    \ the function should relate to all form fields and that fields must be rendered.\
    \ In addition, the last link be changed to a h:commandLink.\n\n# JAVA 12: WWW\
    \ AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT\n\n# JAVASERVER FACES\
    \ AND AJAX\n\n```xml\n<h:commandLink value=\"Show addresses\" action=\"list.xhtml\"\
    \ immediate=\"true\" />\n```\n\nand here you especially note the last attribute\
    \ that is required because the command should not validate the form fields.\n\n\
    Finally, on the page list.xhtml is changed to a commandLink (what it should have\
    \ been all the time). In this case, all form fields are sent to the server by\
    \ a submit, and it is all form fields updated after the ajax function is completed.\
    \ It is not always you are interested in that, in fact there could be only a few\
    \ fields. In this case, I assume the date field should always be today, and in\
    \ index.xhtml I have defined the component:\n\n```xml\n<h:outputLabel value=\"\
    Current date\" for=\"date\"\n<h:inputText id=\"date\" label=\"Change date\" readonly=\"\
    true\" style=\"width: 100px\" value=\"#{controller.date}\" />\n```\n\nYou should\
    \ note that there is no longer any ajax function associated with the component.\
    \ In order to initialize the date field I have also changed the class Person so\
    \ initializes the date field to the current date:\n\n```java\npublic Person()\
    \ {\n  Calendar cal = Calendar.getInstance();\n  date = String.format(\"%02d-%02d-%04d\"\
    , cal.get(DATE), cal.get(MONTH), cal.get(YEAR));\n}\n```\n\nFinally, the ajax\
    \ function of the button in index.xhtml is changed:\n\n```xml\n<h:commandButton\
    \ value=\"Send\" action=\"#{indexController.add()}\" >\n<f:ajax event=\"action\"\
    \ execute=\"firstname lastname code city title\" render=\"firstname lastname code\
    \ city title\"/>\n</h:commandButton>\n```\n\nThat is, I have explicitly specified\
    \ which form fields to be sent to the server, and which form fields must be rendered\
    \ after the function has completed.\n\n# JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT\
    \ PART: SOFTWARE DEVELOPMENT JAVASER FACES AND AJAX\n\nIn this case, the advantage\
    \ is course limited, but in other contexts it matter, and remember that the whole\
    \ idea of ajax is to update that part of a page that is necessary. I will make\
    \ another change of the application, and I have started creating a copy that I\
