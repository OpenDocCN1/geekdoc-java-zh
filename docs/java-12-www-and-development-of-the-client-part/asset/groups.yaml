    # FOREWORD


    This book is the twelfth in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics fills obviously
    much, but the books have also largely focused on the process and how to develop
    good and row applications. This book is similar to the book Java 11 about development
    of web applications, focusing on the client side. This means that key topics are
    style sheets and JavaScript, and in particular, the last part fills. Another topic
    is Ajax, which the book gives a brief introduction to PrimeFaces. The primary
    purpose of the book is to show that it is possible to perform complex-side programming
    using JavaScript. The book requires knowledge of programming of the server side
    similar to what has been dealt with in the previous book, and together, the two
    books provide a relatively basic introduction to web application development.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete programs, but most importantly
    by yourself to it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the text. All the books are
    built around the same skeleton and will consist of text and examples and exercises
    and problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises largely deals with repetitions
    of the substance that is presented in the text, furthermore it is relatively accurately
    described what to do. Problems are in more loosely described, and are a little
    bigger and there is really any clear best solution. These books are to be read
    from start to finish, but the many code examples, including exercises and problems
    play a central role, and it is important that the reader predict in detailing
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books ends with one two larger sample programs, which focus primarily is on
    process and an explanation of how the program is written. On the other hand appears
    the code only to a limited extent – if at all – and the reader should instead
    the finished program code perhaps testing the program. In addition to show the
    development of programs that are larger than the examples, which otherwise is
    presented, the aim of the concluding examples is also to show program examples
    from varying fields of application.


    Download free eBooks at bookboon.com


    JAVA 12: WWW AND DEVELOPMENT OF THE CLIENT PART: SOFTWARE DEVELOPMENT FOREWORD


    Most books ends with an appendix dealing with a subject that would not be treated
    in the books. It may be issues on the installation of software or other topics
    in computer technology, which are not about software development, but where it
    is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.


    The programming language is is, as mentioned Java, and besides the books use the
    following products:


    - 1. NetBeans as IDE for application development

    - 2. MySQL to the extent there is a need for a database server (from the book
    Java 6 onwards)

    - 3. GlassFish as a web server and application server (from the book Java 11 onwards)


    It is products that are free of charge and to install, and there is even talk
    about products, where the installation is progressing all by itself and without
    major efforts and challenges. In addition, there are on the web detailed installation
    instructions for all the products. The products are available on Windows and Linux,
    and it therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    way whether the platform is one or the other. Some places will be in the books
    where you could see that the platform is Linux, and this applies primarily commands
    concerning the file system. Otherwise it has no meaning to the reader that the
    programs are developed on a Linux machine, and they can immediately run under
    Windows unless a program refers to the file system where it may be necessary to
    change the name of a file.


    Finally a little about what the books are not. It is not "how to write" or for
    that matter reference manuals in Java, but it is the title says books on software
    development. It is my hope that the reader when reading the books and through
    the many examples can find inspiration for how to write good programs, but also
    can be used as a source collection with a number of examples of solutions to concrete
    everyday programming problems that you regularly face as a software developer.


    Download free eBooks at bookboon.com


    # INTRODUCTION


    In the book Java 11, I have provided a basic introduction to Web Application Development
    in Java. I have primarily processed the server side, where a browser sending a
    request to a web server, that dynamically dependent on the data sent with the
    request, creates the HTML document to be sent as a response to the client. This
    client/server principle is also the whole idea of web applications and in fact,
    can stop here as all web applications in principle could be developed according
    to the pattern outlined in Java 11. However, there are much more to learn and
    here I like to mention:


    - 1. The visual and the possibilities for developing web applications (sites)
    with an attractive user interface, and especially user interfaces that are easy
    to maintain.

    - 2. Client programming, where part of the code is executed by the browser for
    the purpose of preventing a request to the server every something happens on the
    client page.


    The first is primarily a matter of what components (items) are provided and what
    options are available to customize them to exactly the look and feel that you
    may be interested in. It''s about cascading style sheets and HTML5. Both of them
    have nothing to do with Java, but are subjects that you a web developer must be
    aware of. And then, more than anything else is a question about skill and knowledge
    about what is a good user interface and how to design web user interfaces. Unfortunately,
    I only have limited knowledge about what is a good user interface, so I just have
    to introduce the technique.


    The other is primarily about JavaScript, which program code is sent as script
    (text) along with the server''s response, and which code is executed by the browser
    without sending requests to the server. That''s script code means it is only text
    and not binary code, why it is generally perceived as harmless and can contain
    malicious code, but because it''s limited what to do with JavaScript and basically
    you can only manipulate the HTML document''s elements. JavaScript has gained interest,
    among other things, because the browsers interpreters to JavaScript have been
    optimized, why JavaScript today is effective, but also because the language has
    evolved so that you can write advanced JavaScript that also can be maintained.
    In spite of the name, JavaScript is not Java, and it is important to make it clear
    that it is a simple script language, but with the same syntax as Java – and hence
    the name, JavaScript will fill a part in this book.

