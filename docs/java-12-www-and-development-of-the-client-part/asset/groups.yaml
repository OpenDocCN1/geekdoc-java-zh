    \ | 沃尔沃技术 | 沃尔沃贷款 | 亚太业务区\n\n在 bookboom.com 下载免费电子书\n\n点击广告阅读更多\n\n![](img/8d3e018e6b832623c734fb380b355a77_113_0.png)\n\
    \n# JAVA 12：WWW 与客户端部分的开发：软件开发\n\n例如，如果你考虑为输入姓名的第一个字段，你必须指定要执行哪个验证器以及对应的元素：\n\n\
    ```xml\n<f:ajax event=\"blur\" render=\"firstNameError\"/>\n```\n\n在这里，你指明在输入字段失去焦点后必须执行\
    \ ajax 函数，以及在发生错误时可能渲染的元素（即错误消息所在元素）。当该事件发生时，将向服务器发送一个请求，且仅异步针对当前的输入组件。结果是，字段将在表单完成时进行验证，用户将体验到像在传统桌面应用程序中填写表单一样的感受。\n\
    \n你应该注意，作为替代方案，在这种情况下，所有的验证函数都可以写成 JavaScript 函数，但在其他验证函数中需要向服务器发送请求。\n\n# 练习\
    \ 4\n\n在此练习中，你需要对上面的示例进行修改。首先创建一个项目 ChangeAddress1 的副本。现在你必须修改程序，使输入姓名的字段为只读。数据库\
    \ `databasewidata` 有一个尾部邮政编码（即丹麦邮编）。你必须更改邮编字段的验证代码，只有当尾部邮编中存在该邮编时，该邮编才是合法的。如果是，城市名称将更新为相应的城市名称，否则城市名称必须为空。邮编字段的验证仍必须使用\
    \ ajax 完成。\n\n# 5.2 在不刷新的情况下提交字段\n\n接下来，我想展示如何将所有字段提交到服务器，但不重新加载页面。这样做的好处不是很大，但它提供了一个更安静的窗口体验，因为所有操作都是异步进行的，用户在较小程度上能注意到数据正在发送到服务器，而且整个文档不需要重新渲染。我将使用上述示例，并已从一个名为\
    \ ChangeAddress2 的副本开始。\n在 Index.xhtml 中，我修改了两个页面。提交按钮现在有一个 action 属性：\n\n```xml\n\
    <f:commandButton value=\"发送\" action=\"#{indexController.add()}\" >\n<f:ajax event=\"\
    action\" execute=\"@form\" render=\"@all\"/>\n</h:commandButton>\n```\n\n你应该注意，该函数是由\
    \ action 事件触发的，该函数应该关联所有表单字段，并且这些字段必须被渲染。此外，最后一个链接应改为 h:commandLink。\n\n# JAVA\
    \ 12：WWW 与客户端部分的开发：软件开发\n\n# JAVASERVER FACES 和 AJAX\n\n```xml\n<h:commandLink\
    \ value=\"显示地址\" action=\"list.xhtml\" immediate=\"true\" />\n```\n\n在这里你特别需要注意最后一个属性，它是必须的，因为命令不应该验证表单字段。\n\
    \n最后，list.xhtml 页面被更改为 commandLink（它本一直就应该是这样的）。在这种情况下，所有表单字段都通过提交发送到服务器，并在 ajax\
    \ 函数完成后，所有表单字段都会被更新。你并不总是对这些感兴趣，事实上可能只有几个字段。在这种情况下，我假设日期字段应该始终是今天，在 index.xhtml\
    \ 中我定义了该组件：\n\n```xml\n<h:outputLabel value=\"当前日期\" for=\"date\"\n<h:inputText\
    \ id=\"date\" label=\"修改日期\" readonly=\"true\" style=\"width: 100px\" value=\"\
    #{controller.date}\" />\n```\n\n你应该注意，该组件不再关联任何 ajax 函数。为了初始化日期字段，我还修改了 Person\
    \ 类，将日期字段初始化为当前日期：\n\n```java\n// ... (代码省略)\n```\n\n最后，index.xhtml 中的按钮被更改为：\n\
    \n```xml\n<h:commandButton value=\"发送\" action=\"#{indexController.add()}\" >\n\
    <f:ajax event=\"action\" execute=\"@form\" render=\"@all\"/>\n</h:commandButton>\n\
    ```\n\n（注：由于原文后部分存在大量重复和破碎标签，以下为根据上下文整理的 HTML 结构参考）\n\n```xml\n<?xml version=\"\
