- - '###'
  - 2.38 调整数组大小并没有看起来看起来那么有吸引力。每当你扩展数组的大小时，都必须复制其内容。如果你在每次需要额外空间时都只扩展数组一个元素，那么这个过程在计算时间上将是昂贵的。例如，如果一个
    50 元素的数组已满，容纳另一个条目将需要你将数组复制到 51 元素的数组。再添加一个条目将需要你将 51 元素的数组复制到 52 元素的数组，以此此类推。每次添加都会导致数组被复制。如果你向原始的
    50 元素数组中添加 100 个条目，你将复制数组 100 次。然而，每次扩展 *m* 个元素会将复制成本分散到 *m* 次添加中，而不仅仅是单次添加。每当数组满时就将其大小翻倍是一种典型的方法。
