    ### Don’t Try This at Home


    A common error in programming is an endless loop. These endless loops can consume
    more and more computing resources and eventually make the program, or your computer
    crash. Consider the following code:


    ```java

    public class LetsBreakTheComputer{


    public static void main (String[] args) {


    double x = 1;


    while(0<x){


    System.out.println(x);


    X*=300000; }


    }

    ```


    You’ll note that the continuation condition will `always` be true in this example—the
    value of `x` will always be greater than zero. The value of `x` very rapidly gets
    out of hand and, in fact, becomes too big to store in memory. I ran this in the
