    The first line in the main method declares a new ArrayList that we named languages
    and gave it a size of three.


    **Talk the Talk:** There are several ways to say you used a method. The most common
    terms are ‘call’ or ‘invoke’. When I programmer says ‘I invokedthe method’ he
    or she is really saying they used the method.


    The next three lines of code invoke the add method to fill up the ArrayList. Then
    the size method is called to see how large the ArrayList is. After that one more
    element is appended to the end of the ArrayList, increasing the size from the
    original three slots to four.


    When you run the code, your output should appear something like this:


    ![](images/00028.jpeg)Figure 5.6: We can see how the size of our ArrayList increased
    when we added an element to the end.


    Java printed two notes in addition to the output of the program. This occured
    because we are using an unparameterized ArrayList. An unperamiterized ArrayList
    is an ArrayList that’s type hasn’t been specified. As a result variables of different
    types can be stored within the same ArrayList and cause exceptions due to type
    mismatches.


    To alleviate this issue, we have to type our list to take one specific object
    like arrays do. Rather than a standard declaration and instantiation, we add a
    slight modification to each part so it looks like this:


    ArrayList<DataType> name = new ArrayList<DataType>();


    **Talk the Talk:** An unparamaterized ArrayList accepts what’s known as a generic
    type. A generic type is a type that can be specified later by the programmer in
    order to improve functionality. The type can be anything, including custom classes
    that you implement and design yourself.


    Let’s modify the code in our ArrayLists.java file to follow this practice:


    public class ArrayLists{


    public static void main (String[] args) {


    ArrayList <String> languages = new ArrayList<String>(3);


    languages.add("Spanish");


    languages.add("French");


    languages.add("English");


    System.out.println(languages.size());


    languages.add("German");


    System.out.println(languages.size()); }


    }


    Now when we recompile and run our code, there’s no problem!


    ![](images/00029.jpeg)


    Figure 5.7: Much better. Typing our ArrayList got rid of that pesky warning.


    Now the final thing to know about ArrayLists is how to obtain data from them.
    Unlike arrays, we don’t reference by indexes. Instead, we use a method to retrieve
    the data: The **.get(#)** method. The number in the parentheses is the index value
    of the element you want to access. Just like Arrays, ArrayLists are zero-based.


    Add the following line to your code, recompile and run to see it in action:


    System.out.println(languages.get(0));


    When you recompile and run, the output should look something like this:


    ![](images/00030.jpeg)Figure 5.8: We got then printed the first element of our
    ArrayList.


    There are a number of other methods for ArrayLists that are rather useful. The
    most notable being the **.set()** method, which replaces values much like reassigning
    with arrays.


    The official documentation is located here:


    http://docs.oracle.com/Javase/7/docs/api/Java/util/ArrayList.html


    **Immutables**


    Immutables are very similar to ArrayLists with one important exception: Immutables
    are non-dynamic. This means once an Immutable is defined the values within it
    cannot be changed. Let’s start a new program where we will define an Immutable.


    Copy this code into a file named ImmutablesDemo.java: import java.util.*;


    public class ImmutablesDemo{


    public static void main (String[] args) {


    //Note: Arrays cannot be made immutable. So instead, we use Lists.


    String [] turn = {"600", "800", "1024", "1280", "1366", "1920"};


    List<String> list = Java.util.Arrays.asList(turn);


    List<String> unmodList =


    Collections.unmodifiableList(list);


    for(String p: unmodList){


    System .out.println(p);


    }


    System.out.println();


    System.out.print(unmodList.get(0));


    unmodList.add("464"); }


    }


    Compile the code then run it using the Java command and carefully examine the
    output.


    ![](images/00031.jpeg)


    Figure 5.9: Note that we’re able to access the complete immutable, a single index
    within the immutable, but when reassigning a value within an immutable, an error
    is generated. An immutable is non-dynamic and once initiated, the values within
    it cannot be changed.


    Immutable are for storing data that does not change over the life of a program.
    For example, in the program above, the screen widths are unlikely to change.


    **HashTables**


    HashTables are yet another data structure. They are perfect for storing paired
    data, sometimes known as *key: value* data. In this type of data, instead of a
    numerical index, each data point is indexed by a key which is determined by the
    programmer. State names and state capitals or towns and zip codes are both examples
    of where HashTables can be useful for storing data.


    Seasoned programmers may find HashTables to be very similar to Dictionaries. This
    is because HashTables were derived from them. (Dictionaries are the parent class
    of Hashtables)


    Consider the following program:


    import java.util.*;


    public class HashTabs{


    public static void main (String[] args) {


    Hashtable <String,String> statesAndCapitols = new Hashtable<String,String>();


    statesAndCapitols .put("Connecticut","Hartford"); statesAndCapitols.put("New York","Albany");
    statesAndCapitols.put("Mississippi","Jackson"); statesAndCapitols.put("Maine","Augusta");
    statesAndCapitols.put("Montana","Helena"); statesAndCapitols.put("Texas","Austin");


    String ConnCap = statesAndCapitols.get("Connecticut");


    System.out.println(ConnCap);


    } }


    When you run the program with the Java command you’ll see the output “Hartford”.
    This is the result of the key (or index) for “Hartford” being “Connecticut.” Note
    the print command and how it is used to access the value in the HashTable.


    Just like arrays, Java’s HashTables are an object and have functions that can
    be associated with them. Let’s take a look at one of these functions. Update your
    code so it appears like this:


    port java.util.*;


    public class HashTabs{


    public static void main (String[] args) {


    Hashtable <String,String> statesAndCapitols = new Hashtable<String,String>();


    statesAndCapitols .put("Connecticut","Hartford"); statesAndCapitols.put("New York","Albany");
    statesAndCapitols.put("Mississippi","Jackson"); statesAndCapitols.put("Maine","Augusta");
    statesAndCapitols.put("Montana","Helena"); statesAndCapitols.put("Texas","Austin");
    String ConnCap = statesAndCapitols.get("Connecticut");


    System.out.println(ConnCap);


    ***System .out.println("Values: " + statesAndCapitols.values());


    System.out.println("Keys: " + statesAndCapitols.keySet());***


    }


    }


    Run your code on the command line using the Java command. Your result should appear
    similar to figure 5.10:


    ![](images/00032.jpeg)Figure 5.10: Output demonstrating two of the functions used
    with dictionaries—**values()** and **keySet()**


    You’ll note that the **values()** function returns all of the values in the dictionary,
    while the **keySet()** function returns all of the keys. This short chapter can
    only give you a broad introduction to working with data in programming. Almost
    every program, to some degree, works with data. Being effective at working with
    data is an important part of any programmer’s toolbox.


