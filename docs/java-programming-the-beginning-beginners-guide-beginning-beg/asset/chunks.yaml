    Remember: Learning how to read documentation is a valuable skill.


    **ArrayLists**


    Arrays are very useful, but they are also rather limited in what they can do.
    An example is the array’s inability to be expanded after instantiation. If I have
    an array with ten elements I can’t add an eleventh element to the end of the array.
    With ArrayLists we gain new functionality and the ability to add different types
    of objects into one data structure, but that isn’t done often.


    At this point you may be wondering why we bother with arrays at all if we have
    ArrayLists. The answer is efficiency. ArrayLists take up more memory than arrays.
    In bigger programs this means they can cause it to run slower than if we just
    used arrays.


    ArrayLists, just like Scanners, are reference or class type objects. Their declaration
    looks like this:


    ArrayList name = new ArrayList();


    It should be noted that ArrayLists cannot be filled upon initialization like arrays.
    The only way to fill them is through the **.add()** method. You should also be
    aware that unless you put an integer in the parenthesis of the ArrayList’s constructor
    it will be made with a default size of ten slots.


    If your ArrayList is full the **.add()** method will simply add a new member and
    append what you placed in the parenthesis to the end of the list.


