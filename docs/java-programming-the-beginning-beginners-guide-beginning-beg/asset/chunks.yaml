  trans: "\n类和对象不仅是一种编程概念，更是一种观察世界和解决问题的方式。从高层面上来说，类和对象代表了分类的过程——这项活动与科学一样古老。当我们创建一个类时，我们实际上是在创建一个对象的模型，将对象拆解为它的核心活动和属性。Java\
    \ 是一种面向对象的语言，意味着它完全依赖于 `Class` 和 `Object` 结构，并且所有内容都必须包含其中。Java 并不是唯一支持对象的语言。理解对象是有益的，因为它们在编程中非常常见。\n\
    \n## 类与对象\n\n我经常告诉学生，把类想象成一个对象的蓝图。从这幅蓝图中，可以创建出许多该类的实例（对象）。想象一下规划好的住宅社区：单张蓝图可以用来建造许多不同的房屋。这些房屋在实质上可能有很多不同——它们的颜色可能不同，厨房台面不同，浴室浴室的固定具也不同——但它们仍然都是基于同一张蓝图。\n\
    \n在编程中，类定义了该类的对象是如何被描述的以及它可以做什么。将类类比一组形容词和一组动词可能会很有用。形容词为我们提供了描述的方法，而动词告诉我们该类可以做什么。用于描述类的形容词集合被称为\
    \ `fields`（字段）。与类相关的动词集合被称为 `methods`（方法）。\n\n如果我们描述一个“车辆”类，我们可能会包含以下方法和属性：\n\n\
    | 字段（形容词） | 方法（动词） |\n| :--- | :--- |\n| color | `accelerate()` |\n| weight |\
    \ `decelate()` |\n| height | `turnLeft()` |\n| topSpeed | `turnRight()` |\n| vehicleType\
    \ | `startIgnition()` |\n| | `stopIgnition()` |\n\n显然，这个模型是高度简化的。如果我们真的试图在代码中表示一辆汽车，我们可能需要使用几个相互相关的类。在\
    \ Java 中，我们还必须声明每个属性将持有的数据类型。例如，`color` 属性将持有字符串，而 `weight`、`height` 和 `topSpeed`\
    \ 可以是整数。当我们为上一个表中定义的 `Vehicle` 类创建一个实例时，我们可能会给所有属性赋值，如下所示：\n\n```\nString color\
    \ = \"blue\"; double weight = 5565.3; int height = 48;\nint topSpeed = 90;\nString\
    \ vehicleType = \"car\";\n```\n\n这个示例假设创建了一个名为 `theVehicle` 的实例（对象）。\n\n## 在 Java\
    \ 中编写类\n\n让我们写出代表 Java 中 `Animal` 类的代码。稍后，我们会在另一个文件中创建该类的名为 `myDog` 的实例。\n\n```java\n\
    public class Animal{\n    private static int numberOfAnimals = 0; \n    public\
    \ int length;\n    public String color;\n    public double weight;\n    public\
    \ boolean hasFur;\n\n    public Animal(int Length, double Weight, String Color,\
    \ boolean Fur){\n        color = Color;\n        weight = Weight;\n        hasFur\
    \ = Fur;\n        length = Length;\n        numberOfAnimals ++;\n    }\n}\n```\n\
    \n这里肯定有一些新东西。首先，我们这里没有 `public static void main`。这是因为这个程序的运行方式与我们目前看到的有所不同。`main`\
    \ 方法通常是 JVM 并执行我们代码的入口点。它将位于我们稍后编写的驱动类中。我们用 `public class` 关键字开始类的定义，然后是类的名——在这种情况下是“Animal”。`public`\
    \ 关键字提供了有关可见性的信息。它告诉 JVM 任何类都被从此类创建对象并调用其方法。`Class` 关键字告诉 Java 这个文件是什么。接下来你会注意到我声明了一个名为\
    \ `numOfAnimals` 的变量并将其初始化为零。`numOfAnimals` 变量设计用于类内部的一些内部工作。它的具体工作是跟踪我们创建了多少个\
    \ `Animal` 实例。数据类型和可见性级别（在本例中为 `private`）之间的 `static` 关键字使我们能够将此变量作为跟踪器。`Static`\
    \ 意味着你不需要创建类的实例就可以访问或修改此信息。这意味着每个对象并没有 `numOfAnimals` 的实例，而是存在于类中。\n\n在 `numOfAnimals`\
    \ 之后，我简单地创建了一些变量来详细说明有关我们动物的信息：诸如 `weight`、`color`、`length` 以及它是否有毛。\n\n关键字是一个保留字，除了其预定功能外，不能用于任何其他地方。示例包括：`public`、`private`、`for`、`while`\
    \ 和 `do`。通常关键字会被你的文本编辑器高亮。我正在使用的 Koding 编辑器将它们显示为紫色，如图 6.1 左侧所示。由于关键字已经被预留，因此不能用作变量、函数或类名。\n\
    \n然后我们在 `Animal` 文件中使用 `public` 关键字定义了所谓的“构造函数（constructor）”。这个方法非常重要。它做了三件事：详细列出我们根据此类创建对象所需的信息，执行任何内部清理工作，并为字段分配初始值。每当你根据你的类创建一个对象时，构造函数就会执行一次。\n\
    \n构造函数由下面的驱动类调用。我将我的命名为 `AnimalDriver.java`：\n\n```java\npublic class AnimalDriver{\n\
    \    public static void main (String[] args) {\n        Animal myDog = new Animal(19,\
    \ 12, \"brown\", true);\n    }\n}\n```\n"
- fmt: "\nYou’ll notice that I’ve added an additional property, with the datatype\
    \ `Boolean` to the class: `hungry`. This property is designed simply to track\
    \ whether or not the instance of `Animal` is hungry. When we create the instance\
    \ of `Animal` called `myDog`, we set the value of the `hungry` property to `true`.\n\
    \nWe’ve also added two methods to our class. The first method, `walk()`, simply\
    \ prints out the message “Animal is walking.”\n\nThe second method, `eat()`, is\
    \ more complex. It interacts with the properties of the object. First, the `eat()`\
    \ method sets the value of the `hungry` property to `\"false.\"`. It then informs\
    \ the user that the `Animal` is eating via the print statement. Finally, because\
    \ the animal is eating, we access the `weight` property and add `.1` to its value.\n\
    \nAfter the class definition and the instantiation of the `myDog` instance, we\
    \ run the `walk()` and `eat()` methods.\n\nYou’ll notice that all of these methods\
    \ use the `return` keyword.\n\nThe definition of these methods contains what’s\
    \ known as a “return type”. It appears in the declaration of the method after\
    \ the visibility level. This is the reason the `Scanner` object needs several\
    \ methods to take input from the prompt; methods can only return one datatype\
    \ & one object. In all of our instances, we’re returning a string. When we call\
    \ the methods in our `AnimalDriver` class, whatever the method returns to us will\
    \ be a string. This means we can set a `String` to capture the return value of\
    \ our method in a variable:\n\n```\npublic String walkText = myDog.walk();\n```\n\
    \nNote that while we have so far returned primitive types like `int`, `float`\
    \ or `boolean`, we can also return reference types such as `ArrayLists`.\n\nThe\
    \ `return` keyword itself does two things.\n\nThe first thing is send back to\
    \ the method call whatever you put on the rest of the line. If you put an expression,\
    \ it sends back the result. If you put a string it sends back the whole string.\n\
    \nThe next thing the `return` keyword does is marks the completion of the method.\
    \ As soon as your method returns something it will exit regardless of what is\
    \ after the `return` in the code. This is useful because you could place the `return`\
    \ statement within an `if` statement and have it end pre-maturely under set criteria.\n\
    \nSome methods don’t have to return anything. An example that we’ve encountered\
    \ is `print` method. In this case the return type is `\"void\"`, which goes in\
    \ place of the data type. An example of a method with this kind of declaration\
    \ is as follows.\n\n```\npublic void name(<Datatype>Parameter){}\n```\n\nIt should\
    \ be noted that the `return` keyword can be used to force a `void` method to exit\
    \ as well. Simply type `return`, and a semicolon to end the line, and stop the\
    \ execution of the method.\n\n### Multiple Instances\n\nYou’ll remember from our\
    \ initial discussion that a class is merely a blueprint and multiple objects can\
    \ be constructed from that class. Enter this revised code in your text editor:\n\
    \n```java\npublic class Animal{\n\n    private static int numberOfAnimals = 0;\
    \ \n    public String name;\n\n    public int length;\n\n    public String color;\n\
    \n    public double weight;\n\n    public boolean hasFur;\n\n    public boolean\
    \ isHungry;\n\n    public Animal(String Name, String Color, int Length, double\
    \ Weight, boolean Fur, boolean Hungry){\n        color = Color;\n        weight\
    \ = Weight; hasFur = Fur;\n        isHungry = Hungry; length = Length; name =\
    \ Name;\n    }\n\n    public String walk(){\n        return name +\" is walking\"\
    ;\n    }\n\n    public String eat(){\n        isHungry = false;\n        weight\
    \ += .1;\n        return name + \" has eaten.\\n\" + name + \" now weighs: \"\n\
    \        + weight + \" pounds\";\n    }\n\n    public String getLength(){\n  \
    \      return name + \"'s length is \" + length;\n    }\n\n}\n```\n\nI’ve added\
    \ yet another property to the `Animal` class. The `name` property is designed\
    \ to hold the name of the `Animal` instance. Keep in mind; this is distinct from\
    \ the name of the code reference to the instance.\n\nNow let’s update our `AnimalDriver`\
    \ class to relect the new functionality. Copy this revised code:\n\n```java\n\
    public class AnimalDriver{\n    public static void main (String[] args) {\n  \
    \      Animal myDog = new Animal(\"Sparky\",\"Grey\", 17, 56.4, true, true);\n\
    \        Animal yourDog = new Animal(\"Rover\",\"Brown\", 19, 41.8, true, true);\n\
    \        System.out.println(myDog.walk()); System.out.println(myDog.eat());\n\
    \        System.out.println(yourDog.walk()); System.out.println(yourDog.eat());\n\
    \        System.out.println(yourDog.getLength());\n    }\n}\n```\n\nThe original\
    \ `Animal` instance `myDog` has a value of `\"Sparky\"` in the `name` property,\
    \ while the new object has a value of `\"Rover\"` in the `name` property.\n\n\
    Running the new code should result in output similar to the following:\n\n![](images/00035.jpeg)Figure\
    \ 6.3: Two instances of Animal objects are created—Sparky and Rover.\n\n### Extending\
    \ Classes\n\nThe object oriented structure does more than allow us to simply represent\
    \ objects as code in one file. It allows us to build an entire hierarchy of objects\
    \ to represent our real life problem space. Let’s take another look at `Vehicles`.\n\
    \nIn the world we have numerous types of vehicles. Some work on the ground, some\
    \ work in the water and others are in the air. To properly represent a vehicle\
    \ in an object oriented manner, we need to determine what they all have in common.\
    \ All vehicles have a top speed, a weight and a color. All vehicles are either\
    \ moving, or still.\n\nAs a result we can create a new object that contains all\
    \ of these common attributes, so we don’t have to code them each time we want\
    \ to create a variant of a vehicle. Copy the following code, and save it as `Vehicle.java`:\n\
    \n```java\npublic class Vehicle{\n    int topSpeed;\n\n    String color;\n\n \
    \   double weight; \n    boolean isMoving;\n\n    public Vehicle(int setSpeed,\
    \ String setColor, double setWeight, boolean tellMoving){\n        topSpeed =\
    \ setSpeed; color = setColor;\n        weight = setWeight;\n        isMoving =\
    \ tellMoving;\n    }\n\n    public boolean startMoving(){\n        isMoving =\
    \ true;\n        return \"Vehicle is moving.\"; \n    }\n\n    public boolean\
    \ stopMoving(){\n        isMoving = false;\n        return \"Vehicle isn't moving.\"\
    ; \n    }\n}\n```\n\nThe code above summarizes the basic attribute of vehicles.\
    \ But if we need to represent a car, there is information we need that wouldn’t\
    \ be relevant if we were a boat. But we would still need all of the attributes\
    \ described in the `Vehicle` class. Does this mean we copy all of this code into\
    \ two different files in just represent these types of vehicles? We could, but\
    \ that would be inefficient. Instead we *extend* the vehicle class.\n\nBy extending\
    \ the vehicle class, we create what is known as a **child class**. The child class\
    \ inherits the fields, methods and even the constructor of the parent (`Vehicle`\
    \ in our case) class. Open up a new file in your text editor, and save the following\
    \ code as `GroundVehicle.java`:\n\n```java\npublic class GroundVehicle extends\
    \ Vehicle{\n    int numWheels; \n    String vehicleType;\n\n    public GroundVehicle(int\
    \ setSpeed, String setColor, double setWeight, boolean tellMoving, int setNumWheels,String\
    \ type){\n        super (setSpeed, setColor, setWeight, tellMoving); \n      \
    \  numWheels = setNumWheels;\n        vehicleType = type;\n    }\n\n    public\
    \ String startMoving(){\n        isMoving = true;\n        return vehicleType\
    \ + \" is driving\";\n    }\n\n    public String stopMoving(){\n        isMoving\
    \ = false;\n        return vehicleType + \" isn't driving\"; \n    }\n\n    public\
    \ String whatColor(){\n        return color;\n    }\n}\n```\n\nThe first line\
    \ of this code is slightly different from what you’re used to from this chapter.\
    \ There is the addition of the `extends` keyword followed by `Vehicle`. This notifies\
    \ Java that `GroundVehicle` is a child of `Vehicle`. In other words `GroundVehicle`\
    \ is derived from `Vehicle`.\n\nIn Java, all classes, regardless of if they contain\
    \ the `extends` keyword, are an extension of the `Object` class. As a result at\
    \ the top of every hierarchal tree sits the `Object` class.\n\nOur tree appears\
    \ as follows:\n\n`GroundVehicle` is a `Vehicle` which is an `Object`.\n\n**Talk\
    \ the Talk:** In object oriented programming when a programmer references the\
    \ parent of a child they say the child class shares an “is a/an” relationship\
    \ with the parent class.\n"
