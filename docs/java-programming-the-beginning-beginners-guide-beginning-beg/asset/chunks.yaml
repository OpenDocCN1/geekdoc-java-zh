- fmt: "\n# Declaring and Initializing Variables\n\nJava is what is known as a strongly-typed\
    \ language. This means that variables need to be declared before they can be used.\
    \ In Java, variables are differentiated by the type of data they hold. The type\
    \ of data is referred to the variable’s datatype.\n\nThere are two types of variables\
    \ in Java: primitive type and class (also called reference) type.\n\n## Primitive\
    \ Variables\n\nIn Java, there are eight primitive data types. They are the `byte`,\
    \ `short`, `int`, `long`, `float`, `double`, `boolean` and `chars`.\n\nThe declaration\
    \ and initialization statements are generally very short, and reserve a specific\
    \ amount of memory depending on what type the variable is. Here’s an example of\
    \ a declaration and initialization for an integer, done in one line:\n\n```java\n\
    int name = 93;\n```\n\n## Class Variables\n\nClass type variables, also called\
    \ reference type variables, are generally more complex than primitive types. In\
    \ most cases primitive types are the building blocks of class type variables.\
    \ When you declare and initialize a class type variable, the name doesn’t represent\
    \ the object itself, rather it points to the memory location that has all of the\
    \ parts and information that make up the object.\n\nThere are hundreds of different\
    \ class type variables out there, and they all do different things. One you’ve\
    \ already encountered is a `Scanner`.\n\nHere’s the declaration and initialization,\
    \ one more time:\n\n```java\nScanner name = new Scanner(<parameters>);\n```\n\n\
    ## Strings\n\nStrings in Java are actually class or reference type variables.\
    \ They can, however, be declared like primitives. This was a sort of short cut\
    \ put in by the Java developers to make dealing with strings a bit easier, as\
    \ they’re one of the most common datatypes and are used just as much as the primitives.\
    \ (Think about how much you’ve used them already!)\n\nIf you like, you can declare\
    \ strings like you would class type variables, but there’s really no advantage\
    \ in doing so.\n\nIt would look like this:\n\n```java\nString blogName = new String(\"\
    Edukwest!\");\n```\n\n**NOTE:** Due to strings being class type, they cannot be\
    \ compared like primitive types using the general comparison operators like `>`,\
    \ or `==`.\n\nHere, we’ve created a variable called `blogName` and initialized\
    \ it with the string value “Edukwest!”. The equals sign in this context is the\
    \ assignment operator. The string value “Edukwest!” is being assigned to the variable\
    \ `blogName`.\n\nOnce a variable has been declared, generally you can do quite\
    \ a lot with it. Here’s an example of using variables to change what is printed\
    \ in a sentence.\n\nKey in the following code. (Feel free to substitute your own\
    \ values for the variables.) Notice that comments are indicated by two slashes\
    \ (`//`). Multi-line comments can be made with a slash and an asterisk and closed\
    \ with an asterisk and a slash (`/*comment!*/`).\n\n```java\npublic class Variables{\n\
    \    public static void main (String[] args) {\n        float gpa = 3.95f; int\
    \ age = 17;\n        String name = \"Keshav\";\n        //Note that the first\
    \ word of the variable declaration is the type.\n        System.out.println(name\
    \ + \" is \" + age + \" and wished he had a \" + gpa + \" gpa.\");\n    }\n}\n\
    ```\n\nSave your file as `Variables.java` and run it with the `Java` command.\
    \ Your output should appear similar to figure 3.1\n\n![](images/00011.jpeg)\n\n\
    Figure 3.1: `Variables.java` executing in the Koding.com virtual Linux environment.\n\
    \nThe first word in the declaration is the type of variable being created. To\
    \ review, the types of variables in this program are:\n\n- **String:** `String`\
    \ variables are comprised of a series of characters in a particular order that\
    \ have no mathematical value.\n- **Integer:** `Integer` variables contain whole\
    \ number values with no decimal point.\n- **Floating Point Values:** Floating\
    \ point variables contain more precise numbers that have a whole number and fractional\
    \ amount represented by a decimal point value.\n\nVariables are dynamic, in that\
    \ the value can be changed or reassigned through the life of the program. Imagine,\
    \ for example, that in a video game you have a variable that tracks the player’s\
    \ score. As the player’s score changes, that value would go up until the game\
    \ is over. Once the game ends, the value inside the `player’s score` variable\
    \ might be reassigned the value zero.\n\nConsider the following code:\n\n```java\n\
    import java.util.*; \npublic class Var2{\n    public static void main (String[]\
    \ args) { \n        Scanner names = new Scanner(System.in);\n        String firstName,\
    \ lastName, middleName, fullName;\n        System.out.println(\"What's your first\
    \ name?\");\n        firstName = names.nextLine();\n        System.out.println(\"\
    What's your last name?\");\n        lastName = names.nextLine();\n        fullName\
    \ = firstName +\" \"+ lastName;\n        System.out.println(fullName);\n     \
    \   System.out.println(\"What's your middle name?\");\n        middleName = names.nextLine();\n\
    \        fullName = firstName + \" \" + middleName + \" \" + lastName;\n     \
    \   System.out.println(fullName);\n    }\n}\n```\n\nEntering the code and running\
    \ the program yields the following result:\n\n![](images/00012.jpeg)\n\nFigure\
    \ 3.2: During the lifetime of the `fullName` variable, the value is reassigned\n\
    \nNote that when we first declare the `fullName` variable, it is assigned the\
    \ values of `first` and `last` concatenated by the `+` sign. That value is then\
    \ printed to the console. As the program continues to execute, the value of `fullName`\
    \ is reassigned to include the variable `middle` as well. When a variable is assigned\
    \ a new value, its original value is cleared and replaced with the new value.\n\
    \nIn this program, we also declared four `Strings` in one line. Due to all the\
    \ variables being of the String type, we were able to separate the names with\
    \ commas. Being statically typed language requires us to declare our variables\
    \ before use.\n\n## Arithmetic with Variables\n\nVariables are frequently used\
    \ as part of arithmetic expressions in Java. Arithmetic in Java is no different\
    \ than the arithmetic you learned in grade school. The following symbols are used:\n\
    \n- `+` Addition\n- `-` Subtraction\n- `*` Multiplication\n- `/` Division\n- `%`\
    \ Modulus\n\nIf you are new to programming, modulus may be unfamiliar to you,\
    \ but the concept is easy—modulus is the remainder after division. For example:\n\
    \n- `10 % 3 = 1`\n- `11 % 3 = 2`\n- `12 % 3 = 0`\n\nI frequently use modulus when\
    \ programming in order to determine if a number is even or odd. Any even number\
    \ used with modulus two will result in zero.\n\n***Talk the Talk:** Most programmers\
    \ will say ‘mod’ for short when they are talking about modulus.*\n\nMath with\
    \ variables looks pretty much as you’d expect. There are a few oddities that we’ll\
    \ cover later though.\n\nKey in the following example program. You’re free to\
    \ forgo the comments:\n\n```java\npublic class MathDemo{\n    public static void\
    \ main (String[] args) {\n        int alpha = 3; int bravo = 13;\n        System.out.println(alpha\
    \ + bravo); \n        System.out.println(alpha - bravo);\n        System.out.println(bravo\
    \ * alpha); \n        System.out.println(bravo / alpha); //Note: 13/3 is not really\
    \ a whole number.\n        System.out.println(bravo % alpha);\n        System.out.println((double)bravo/(double)alpha);\n\
    \        /* Because we've cast the numbers as doubles, the real value is displayed.\
    \ */\n    }\n}\n```\n\nIn this program, two variables are declared as `alpha`\
    \ and `bravo`. Then the operands are put in five expressions using addition, subtraction,\
    \ multiplication, division and modulus.\n\nBoth of these numbers, however, are\
    \ integers. Integers can only be whole numbers between (2^31)-1 or -2^31. So expressions\
    \ of the integer datatype have any numbers after the decimal point truncated.\n\
    \nThis means that if an expression results in 3.9, but is printed as an `int`,\
    \ it’ll simply print 3.\n\nWe can avoid this issue by doing what’s known as type\
    \ casting. This changes the variable’s type just before doing the math and printing,\
    \ meaning we’ll get the real answer rather than an approximation.\n"
