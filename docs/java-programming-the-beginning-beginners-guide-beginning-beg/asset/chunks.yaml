  trans: "\n\n# 表达式\n\n表达式在确定结果之前必须求值。表达式通常是算术题。在 Java 中打印表达式：\n\n```\nSystem.out.println(3.0/(6+4));\n\
    ```\n\n在上面的表达式中，由于运算顺序，括号中的表达式部分将首先求值。打印的结果是 0.3。\n\n我们将在下一章中更详细地研究表达式。\n\n顺便提一下，了解\
    \ `println` 函数是 `print()` 函数的一个版本是有用的。结尾的 ‘ln’ 代表 line（行）。这意味着在打印完你放在括号中的内容后，该函数将另起新行来打印下一个表达式。`print`\
    \ 函数只会简单打印你放在括号里的任何内容，而不会引入它自己的格式。\n\n## 第 2 章：输入与输出\n\n在本章中，我们将更详细地查看输入和输出，这也许是任何程序中两个关键的活动。在上一一章中，我们详细地查看了使用\
    \ `println` 命令产生的输出。通过 `println`，我们能够向命令行屏幕输出三种类型的数据：字符串、整数和浮点数。然而，我们编写的程序并没有接收输入和处理数据的能力。\n\
    \n在本章中，我们将详细查看两类输入。首先，输入语句将允许我们通过程序化请求用户输入。然后，我们将使用命令行参数为我们的程序提供输入。\n\n在查看输出时，我们还将学习将输出重定向到文件而不是返回命令行。\n\
    \n现在是时候放上你最喜欢的编程音乐了（我建议听听 The Cure），打开 `nano`、`vi` 或你喜欢的文本编辑器并开始编码吧……\n\n### 输入语句\n\
    \n我们将从一个程序开始，该程序根据 `sideA` 输入和 `sideB` 输入来计算矩形的面积。在你的文本编辑器中输入以下 Java 代码：\n\n```java\n\
    import java.util.Scanner;\n\npublic class Square{\n\n    public static void main\
    \ (String[] args) {\n        System.out.println(\"RECTANGLE AREA CALCULATOR\"\
    );\n        Scanner input = new Scanner(System.in);\n        System.out.println(\"\
    What's the length of side A? \"); float sideA = input.nextFloat();\n        System.out.println(\"\
    What's the length of side B? \"); float sideB = input.nextFloat();\n        float\
    \ area = sideA*sideB;\n        System.out.println(\"The area of your rectangle\
    \ is: \" + area);\n    }\n}\n```\n\n一旦你确定已正确输入程序并保存，请在命令行上运行该程序。我将我的文件保存为 `Square.java`。你的输出应该类似于图\
    \ 2.1：\n\n![](img/00005.jpeg)\n\n图 2.1：执行 `Square.java` 程序，该程序通过 Java 的 `nextFloat()`\
    \ 函数从用户处获取输入。\n\n在程序的的第一行，我们遇到了 `import` 语句。在许多语言中，import 用于向语言添加语言核心中不存在的额外命令库。在这种情况下，我们从\
    \ `util` 库添加了 `Scanner` 对象，该库包含了许多工具和实用对象。\n\n如果你想导入整个库，只需将 `Scanner` 替换为星号 (`*`)\
    \ 即可。\n\n例如：\n\n```java\nimport java.util.*;\n```\n\n虽然很有用，但要理解，在大型程序中，仅仅为了获取像我们这里这样的一个对象就导入整个库会降低程序的运行效率。这就像是你只需要一把锤子时却拿了整个工具箱。\n\
    \n现在，根据上下文和程序执行，你可能已经猜到了 `nextInt()` 函数的作用。让我们来拆解一下：\n\n```java\npublic static\
    \ void main (String[] args) {\n    Scanner grabAge = new Scanner(System.in);\n\
    \    System.out.println(\"How old are you?\");\n    int age = grabAge.nextInt();\n\
    }\n```\n\n该类的第一行创建了一个 `Scanner` 对象。Scanner 是我们用于从命令行获取输入的对象。\n\n在上面的示例中，用户在提示“How\
    \ old are you?”处输入的任何内容将通过 `Scanner` 的 `nextInt` 方法赋值给变量 `age`。我们将在下一章更详细地查看变量——现在，只需将变量视为值的临时存储位置即可。这些值可以是字符串、浮点数或整数。你必须在使用变量之前对其进行声明。通常语法是数据类型后跟着一个引用该变量的名称。\n\
    \n你可能奇怪什么是数据类型。数据类型决定了变量可以包含什么，以及可以对其执行哪些操作。数据类型的示例包括整数、字符串和浮点数。\n\n这是一个整数变量声明的示例：\n\
    \n```java\nint name;\n```\n\n注意：`Int` 表示该变量的数据类型是整数。\n\n在声明 `Scanner` 对象之前，记得导入\
    \ `Scanner` 对象或 `util` 库。否则，你的程序将遇到错误。\n\n让我们尝试一个新示例。在你的文本编辑器中创建一个名为 `StringInput.java`\
    \ 的新文件。你可以通过 `vi` 实现，例如在命令行上输入以下命令：`vi StringInput.java`。\n\n输入以下代码：\n\n```java\n\
    import java.util.Scanner;\n\npublic class StringInput{\n    public static void\
    \ main (String[] args) {\n        Scanner input = new Scanner(System.in);\n  \
    \      System.out.println(\"What's your name? \");\n        String name = input.nextFloat();\n\
    \        System.out.println(\"Hello \" + name);\n    }\n}\n```\n\n退出文本编辑器，并在命令行中使用\
    \ `javac StringInput.java` 编译程序。\n\n![](img/0006.jpeg)\n\n图 2.2：哎呀。这不妙。我们遇到了错误。如何修复它？\n\
    \n所以发生了什么？而不是编译并让程序运行，程序退出了错误。幸运的是错误很容易修复。`nextFloat()` 函数设计用于接受浮点类型，仅此如此。当你输入任何非浮点数时，就会导致你在\
    \ 2.2 中看到的错误。我们有一个专门用于字符串的函数，叫做 `nextLine()`。\n\n修改你的代码如下：\n\n```java\nimport\
    \ java.util.Scanner;\n\npublic class StringInput{\n    public static void main\
    \ (String[] args) {\n        Scanner input = new Scanner(System.in);\n       \
    \ System.out.println(\"What's your name?\");\n        String name = input.nextLine();\n\
    \        System.out.println(\"Hello \" + name);\n    }\n}\n```\n\n**注意：** scanner\
    \ 有获取每种数据类型的函数。\n\n这里是一些示例：\n\n- `nextLine()`：字符串\n- `nextInt()`：整数\n- `nextFloat()`：浮点数\n\
    - `nextDouble()`：双精度浮点数\n\n你可能识别这种模式。Scanner 的文档可以在这里找到：\n\n`http://docs.oracle.com/Javase/7/docs/api/Java/util/Scanner.html`\n\
    \n学习阅读 Java 文档本身就是一项重要的技能。\n\n![](img/00007.jpeg)\n\n图 2.3：使用 `nextLine()` 效果好多了！\n\
    \n当你处理字符串时，应该使用 `nextLine()` 函数，它不扫描字符串以外的任何数据类型。它将始终返回用户在提示处输入的任何内容，包括数字或符号。\n\
    \n### 错误\n\n前面的示例可能是你遇到的第一个错误示例之一。这种类型的错误被称为运行时错误（Runtime error）。它是编写 Java 代码时可能发生的三种类型错误之一。\n\
    \n这三种类型是：\n\n#### 语法错误：\n\n语法错误是代码格式上的问题。包括遗漏分号、未闭合括号或拼错方法名。文本编辑器通常能很好地指出这些问题，因此修复它们相当简单。\n\
    \n#### 运行时错误：\n\n"
- fmt: "\nRuntime errors are a bit trickier to catch. Syntactically, all runtime errors\
    \ are correct, so your text editor won’t point them out to you. The issue occurs\
    \ when something unexpected happens and results in the program failing to execute\
    \ *at runtime*. The result is your program fails to compile or execute properly.\
    \ Examples include trying to divide by zero or trying to call up a file that doesn’t\
    \ exist. Java won’t encounter the error until it attempts to execute the code.\n\
    \n### Logic errors\n\nThese are errors in the actual logic behind the program.\
    \ They are the most challenging errors to fix, because the code isn’t technically\
    \ wrong, it’s just not giving the correct result. Some logical errors go undetected\
    \ even after the program is released. Examples include things like dividing where\
    \ you should be multiplying, printing the wrong output, or opening the wrong file.\
    \ If you have a logic error, you’re having a PICNIC. (Problem In Chair, Not In\
    \ Computer.)\n\n### Parameterized Input\n\nYour current workflow forces you to\
    \ compile and then run your code before passing input. Including parameters with\
    \ your `java` command passes input and executes your code in tandem. The resulting\
    \ command looks like this:\n\n`$ java ClassName arg1 arg2 arg3`\n\nIn the example\
    \ above, we still use the `java` command and the class name of the program we’d\
    \ like to run. We follow the class name with arguments which get sent as input\
    \ to the program. This could be advantageous in situations where we want our program\
    \ to run unattended like when we’re crunching numbers. For example, if we wanted\
    \ a program to receive the users name and age as input, the parameters might look\
    \ something like this:\n\n`$ java moreInput Keshav 17`\n\nThe values “Keshav”\
    \ and “17”, which are separated by a single space, are passed to the program.\
    \ Let’s see how. Key in the following example and save it as `MoreInput.java`:\n\
    \n```java\npublic class MoreInput{\n    public static void main (String[] args)\
    \ {\n        System.out.println(\"Your name is: \" + args[0]); \n        System.out.println(\"\
    Your age is: \" + args[1]);\n        System.out.println(\"All the arguments: \"\
    );\n        System.out.println(args[0] + \", \" + args[1]); \n    }\n}\n```\n\n\
    Next, let’s run the program and supply command line arguments as input:\n\n`$\
    \ java MoreInput Keshav 17`\n\nYou should get a result similar to the one pictured\
    \ in figure 2.4:\n\n![](images/00008.jpeg)\nFigure 2.4: Command line parameters\
    \ being processed as input on the Koding command line.\n\n**NOTE:** The terms\
    \ parameter and argument can be used interchangeably.\n\nThe arguments come into\
    \ Java numbered sequentially, so in our case, the user’s name is argument number\
    \ zero and the age is argument number one. In code, we call these `args[0]` and\
    \ `args[1]`, respectively. If you study the screenshot carefully, you may notice\
    \ something interesting-`args[1]` is *not* the first parameter.\n\nThis is because\
    \ Java starts counting at 0, rather than 1. This means that the first argument\
    \ we entered, which in this case was a name, is actually in slot 0. As a result\
    \ Java is often referred to as a zero-indexed language.\n\n### Output to a Filestream\n\
    \nSo far the code’s output has only been directed to the command line. This doesn’t\
    \ always have to be the case. Output can be directed to a file for more permanent\
    \ storage. Being able to store data (more or less) permanently is an important\
    \ skill for programmers to learn. Let’s write a program in which we ask the user\
    \ to enter several pieces of data and we then store those in a file.\n\nKey in\
    \ the following code:\n\n```java\nimport java.io.*;\nimport java.util.Scanner;\
    \ \n\npublic class Storage{\n    public static void main (String[] args) {\n \
    \       Scanner grab = new Scanner(System.in);\n        System.out.println(\"\
    What's your name?\"); \n        String name = grab.nextLine();\n        System.out.println(\"\
    What's your email?\"); \n        String mail = grab.nextLine();\n        System.out.println(\"\
    What's your favorite band?\");\n        String band = grab.nextLine();\n     \
    \   String fname = name.replaceAll(\" \",\"\")+\".txt\";\n        try{ \n    \
    \        PrintWriter saver = new PrintWriter(fname);\n            saver.println(\"\
    Name:\" + name); \n            saver.println(\"Email:\" + mail); \n          \
    \  saver.println(\"Band:\" + band); \n            saver.close();\n        }\n\
    \        catch(FileNotFoundException e){ \n            System.out.println(\"Oh\
    \ no, it didn't work!\");\n        } \n        System.out.println(name + \"|\"\
    \ + mail + \"|\" + band + \" has been stored to \"+ name + \".txt.\"); \n    }\n\
    }\n```\n\nThis is definitely the most complex program we’ve written yet. Go ahead\
    \ and run it on the command line and make sure you don’t get any errors. If you’re\
    \ having issues remember to check the imports. If everything runs correctly, your\
    \ command line should look something like this:\n\n![](images/00009.jpeg)\nFigure\
    \ 2.5: The program stored the data in a file called Keshav.txt which is now available\
    \ in the directory listing by using the `ls` command on the command line.\n\n\
    Note: I wrote and saved the file in a separate folder, and needed to navigate\
    \ to where the file was beforehand using the `cd` (change directory) command.\n\
    \nWhile the code for this program is somewhat longer than what you are used to\
    \ at this point, it is still fairly straightforward. When the program runs it\
    \ prompts the user for their name, email, and name of their favorite band. We\
    \ then create a new variable called `saver`. `saver` takes the information the\
    \ user typed and formats it to increase readability. It then prints the information\
    \ to a file.\n\n## Chapter 3: **Variables**\n\nIn the previous chapter, we looked\
    \ at input and output, which allow us to get data into and out of our Java program.\
    \ In this chapter we’ll take a closer look at one of the most important aspects\
    \ of programming— variables. You may not equate variables with computer programming,\
    \ but you’ve likely been using variables since high school if you took courses\
    \ in Algebra, Chemistry, and Physics.\n"
