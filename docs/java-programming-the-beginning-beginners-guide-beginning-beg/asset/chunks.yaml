  trans: "\n\n如果你不想在机器上通过安装 JDK 的过程，我建议你使用 Koding.com 朋友提供的虚拟 Linux 服务器。在浏览器中访问 www.Koding.com\
    \ 并注册一个免费账户。免费账户将为你提供一个可以通过网页浏览器访问的虚拟 Linux 机器——它可以开箱即用编译并运行 Java 代码！无需任何下载。这就是我编写书中将用到的代码时使用的工具。\n\
    \n一旦你拥有了账户，点击按钮启动虚拟机（VM）并开始编码。你将使用 Koding 上的文本编辑器输入 Java 文件，并使用终端运行它们。\n\n图 1.4：Koding.com\
    \ 中的命令行（或终端）。\n\n## 编写和运行你的代码\n\n现在你已经准备好了环境，是时候（终于）写一些代码了。我们将在文本编辑器中编写代码。文本编辑器与文字处理程序不同。文字处理程序会在文件中引入不可见的格式代码。如果你运行在文字处理程序中编写的代码，可能会因为嵌入的格式代码而导致错误。\n\
    \n另一方面，文本编辑器将你输入的文本保存为纯文本——不会引入任何不必要的格式。文本编辑器产生的文本可以被 Java 编译器轻松处理。在 Koding.com\
    \ 虚拟机和 Mac 的命令行环境中，有两个可以使用的文本编辑器。它们被称为 `nano` 和 `vi`。这些文本编辑器的历史可以追溯到 20 世纪 70\
    \ 年——所以当你使用它们时，你可以真正感受到“老派”！另一个选项是使用 Koding 上的默认文本编辑器、Mac 上的 TextEdit 或 Windows\
    \ 上的 Notepad。它们都非常通俗易懂，尽管可能需要更改一些设置来高亮 Java 代码。顺带提一下，确保每次当你第一次保存代码文件时，将其保存为“filename.java”。\n\
    \n### nano\n\nNano 是一个易于使用的 Linux 编辑器。它非常直观。当 `nano` 环境加载时，你只需开始输入代码即可。Nano 拥有许多控制代码，列在屏幕底部供你参考。最需要注意的是\
    \ `CTRL+L`（保存文件）和 `CTRL+X`（退出 nano 并返回命令行）。\n\n默认情况下，nano 将你的文件保存在你打开 `nano` 本身时所在的文件夹中。\n\
    \n![](img/00003.jpeg)图 1.5：nano 文本编辑器。\n\n你可以在命令行中输入 `nano` 然后按回车键来启动 nano。\n\n\
    ### vi\n\nvi 是一个稍微复杂（甚至更“老派”）的文本编辑器。理解 `vi` 最重要的一点是它有两种模式：命令模式和插入模式。要进入插入模式，按下键盘上的‘i’。当你想要进入命令模式以执行如写入（write）和退出（quit）之类的命令时，按下\
    \ `ESC` 键。如果你搞砸了发现自己处于错误的模式，多按几次 `ESC` 似乎可以从任何地方回到命令模式。\n\n关于 `vi` 有一个老笑话是：*vi\
    \ 有两种模式，而你正处于错误的模式中。*（如果你现在觉得这不好笑，在你用 `vi` 一段时间后就会觉得好笑了！）\n\n当你进入 `vi` 时，输入 `i`\
    \ 进入插入模式，你就可以输入代码了。完成后，按 `ESC` 回到命令模式。所有命令必须以冒号开头。所以要写文件，你需要输入 `:w`。要退出，输入 `:q`。`vi`\
    \ 还允许你组合命令。例如，组合命令 `:wq` 将写入文件并退出返回命令行。\n\n图 1.6：vi 希望你帮助乌干达的贫困儿童。它为全球的新程序员提供有限的帮助。\n\
    \n你可以在命令行中输入 `vi` 然后按回车键来启动 `vi`。\n\n现在你应该已经启动了文本编辑器并准备好输入代码了。在你的文本编辑器中完全按照所示内容输入以下代码：\n\
    \n```java\npublic class HelloWorld{\n    public static void main (String[] args)\
    \ {\n        System.out.println(\"This is my first program!\"); \n        System.out.println(\"\
    Programmers are rockstars!\");\n    }\n}\n```\n\n这段代码的作用应该是显而易见的。`println()` 函数将内容打印到命令行。在这种情况下，你正在打印两个字符串。字符串仅仅是字符行。字符串始终被引号括起来。\n\
    \n一旦你输入了代码，就是时候运行它了。在 nano 中，输入 `CTRL+W` 保存文件。在提示时，输入文件名 `HelloWorld.java`。`.java`\
    \ 扩展名表示这是一个 Java 源文件。接下来输入 `CTRL+X` 退出，返回返回命令行。在 `vi` 中，进入命令模式并通过输入 `:w HelloWorld.java`\
    \ 保存文件。这将以适当的文件名写入你的文件。最后，在 `vi` 中，按 `:q` 退出并返回命令行。在任何其他编辑器（包括 Koding 上的）中都可以打开菜单并点击“另存为”，就像在任何其他计算机程序中一样。\n\
    \n注意，我们给这个程序起的文件名与类名（`HelloWorld`）匹配。这是 Java 标准。该标准使得当你有多个源文件时，类文件在构建时易于识别。因此，为了方便管理，每当你创建一个新的\
    \ `.java` 文件时，请确保将其保存为“filename.java”。\n\n图 1.7：在 Koding 中保存文件。\n\n一旦你输入了代码，就是时候运行它了。在\
    \ nano 中，输入 `CTRL+W` 保存文件。在提示时，输入文件名 `HelloWorld.java`。`.java` 扩展名表示这是一个 Java\
    \ 源文件。接下来输入 `CTRL+X` 退出，返回命令行。在 `vi` 中，进入命令模式并通过输入 `:w HelloWorld.java` 保存文件。这将以适当的文件名写入你的文件。最后，在\
    \ `vi` 中，按 `:q` 退出并返回命令行。在任何其他编辑器（包括 Koding 上的）通常都可以打开菜单并点击“另存为”，就像在任何其他计算机程序中一样。\n\
    \n注意，我们给这个程序起的文件名与类名（`HelloWorld`）匹配。这是 Java 标准。该标准使得当你有多个源文件时，类文件在构建时易于识别。因此，为了方便管理，每当你创建一个新的\
    \ `.java` 文件时，请确保将其保存为“filename.java”。\n\n图 1.8：HelloWorld.java 的执行\n\n一旦你输入了代码，就是时候运行它了。在\
    \ nano 中，输入 `CTRL+W` 保存文件。在提示时，输入文件名 `HelloWorld.java`。`.java` 扩展名表示这是一个 Java\
    \ 源文件。接下来输入 `CTRL+X` 退出，返回命令行。在 `vi` 中，进入命令模式并通过输入 `:w HelloWorld.java` 保存文件。这将以适当的文件名写入你的文件。最后，在\
    \ `vi` 中，按 `:q` 退出并返回命令行。\n\n图 1.9：HelloWorld.java 的输出\n\n如果你的输出看起来不像 1.9，那么你需要重新加载文本编辑器和代码并找到错误。你可以在命令行提示符处通过以下命令重新加载代码：\n\
    \n对于 `vi`：`vi HelloWorld.java`\n\n对于 `nano`：`nano HelloWorld.java`\n\n在任何其他编辑器中，像打开其他文件一样打开它。常见的错误包括：\n\
    \n- 未闭合括号\n- 忘记行末的分号\n- 误写 `public static void main(String[] args)`（它是大小敏感的！）\n\
    \n恭喜！你写了第一个程序。\n\n## 理解 println() 函数\n\n在前面的示例中，我们使用 `println` 函数输出了一个字符串。该打印函数还能够打印以下类型的数据：\n\
    \n### 整数\n\n整数是“整数”，没有小数点。在 Java 中，你可以这样打印一个整数：\n\n```java\nSystem.out.println(2573);\n\
    ```\n\n### 浮点数\n\n浮点数是包含小数点的更精确的数字。在 Java 中你可以这样打印一个浮点数：\n\n```java\nSystem.out.println(3.45783);\n\
    ```\n"
- fmt: "\n# Expressions\n\nExpressions must be evaluated before a result is determined.\
    \ Expressions are usually arithmetic problems. To print an expression in Java:\n\
    \n```\nSystem.out.println(3.0/(6+4));\n```\n\nIn the expression above, the part\
    \ of the expression in parenthesis will be evaluated first due to the order of\
    \ operations. The result printed is 0.3.\n\nWe’ll look at expressions more closely\
    \ in our next chapter.\n\nAs a side note, it’s good to understand that the `println`\
    \ function is a version of the `print()` function. The ‘ln’ at the end stands\
    \ for line. This means after printing what you place in the parentheses the function\
    \ will make a new line to print the next expression. The `print` function will\
    \ simply print whatever you put in the parenthesis without introducing its own\
    \ formatting.\n\n## Chapter 2: Input and Output\n\nIn this chapter we’re going\
    \ to look more closely at input and output, which are perhaps the two most critical\
    \ activities in any program. In the previous chapter we looked closely at the\
    \ output we produced with the `println` command. With `println` we were able to\
    \ output three types of data to the command line screen: strings, integers, and\
    \ floating point numbers. The programs we wrote, however, had no capacity to take\
    \ input and process data.\n\nIn this chapter we’re going to look closely at two\
    \ types of input. First input statements will allow us to programmatically request\
    \ input from the user. We’ll then use command line parameters to provide inputs\
    \ to our program.\n\nAs we look at output, we’ll also look at directing our output\
    \ to a file instead of back to the command line.\n\nSo now it’s time to put on\
    \ your favorite programming music (I suggest The Cure), open `nano`, `vi` or your\
    \ favorite text editor and start coding…\n\n### Input Statements\n\nWe’re going\
    \ to start with a program that calculates the area of a rectangle based on a `sideA`\
    \ input and a `sideB` input. Key the following Java code into your text editor:\n\
    \n```java\nimport java.util.Scanner;\n\npublic class Square{\n\n    public static\
    \ void main (String[] args) {\n        System.out.println(\"RECTANGLE AREA CALCULATOR\"\
    );\n        Scanner input = new Scanner(System.in);\n        System.out.println(\"\
    What's the length of side A? \"); float sideA = input.nextFloat();\n        System.out.println(\"\
    What's the length of side B? \"); float sideB = input.nextFloat();\n        float\
    \ area = sideA*sideB;\n        System.out.println(\"The area of your rectangle\
    \ is: \" + area);\n    }\n}\n```\n\nOnce you are sure you have keyed in the program\
    \ correctly and saved it, go ahead and run the program on the command line. I\
    \ saved mine as `Square.java`. Your output should look similar to figure 2.1:\n\
    \n![](images/00005.jpeg)\n\nFigure 2.1: Execution of the `Square.java` program\
    \ which takes input from the user via the Java `nextFloat()` function.\n\nOn the\
    \ first line of this program, we encounter the `import` statement. Imports are\
    \ used in many languages to add an additional library of commands to the language\
    \ that are not in the language core. In this case, we’re adding the `Scanner`\
    \ object from the `util` library which contains a number of utilities and useful\
    \ objects.\n\nIf you want to import the entire library, all you have to do is\
    \ replace `Scanner` with an asterisk (`*`).\n\nFor example:\n\n```java\nimport\
    \ java.util.*;\n```\n\nWhile this is useful, understand that in much larger programs\
    \ importing an entire library just to get one object like we’re doing here makes\
    \ your program less efficient. It’s like grabbing your whole tool box when you\
    \ just need a hammer.\n\nNow, based on context and the program execution, you’ve\
    \ probably already guessed what the `nextInt()` function does. Let’s break it\
    \ down:\n\n```java\npublic static void main (String[] args) {\n    Scanner grabAge\
    \ = new Scanner(System.in);\n    System.out.println(\"How old are you?\");\n \
    \   int age = grabAge.nextInt();\n}\n```\n\nThe first line of this class creates\
    \ a `Scanner` object. Scanners are the object we use to obtain input from the\
    \ command line.\n\nIn the example above, whatever the user types at the prompt\
    \ “How old are you?” is going to be assigned to the variable `age` via the `Scanner`’s\
    \ `nextInt` method. We’re going to take a closer look at variables in the next\
    \ chapter—for right now, just consider variables a temporary storage place for\
    \ values. These values can be strings, floats, or integers. You must declare variables\
    \ before using them. Generally the syntax is the datatype followed by a name to\
    \ reference the variable.\n\nYou may be wondering what a datatype is. Datatype\
    \ determines what a variable can contain, and what operations can be performed\
    \ on it. Some examples of datatypes include integers, strings, and floating point\
    \ numbers.\n\nHere’s an example of the declaration of an integer variable:\n\n\
    ```java\nint name;\n```\n\nNote: `Int` indicates that the datatype for this variable\
    \ is an integer.\n\nRemember to import the `Scanner` object or the `util` library\
    \ before declaring a `Scanner` object. Otherwise, your program will encounter\
    \ an error.\n\nLet’s try a new example. Create a new file in your text editor\
    \ called `StringInput.java`. You can do this in `vi`, for example, by typing the\
    \ following command on the command line: `vi StringInput.java`.\n\nKey in the\
    \ following code:\n\n```java\nimport java.util.Scanner;\n\npublic class StringInput{\n\
    \    public static void main (String[] args) {\n        Scanner input = new Scanner(System.in);\
    \ \n        System.out.println(\"What's your name? \");\n        String name =\
