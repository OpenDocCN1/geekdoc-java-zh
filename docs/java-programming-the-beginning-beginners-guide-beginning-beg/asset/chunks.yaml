    **Complex Conditionals with else-if**


    So far the conditionals we’ve created can make decisions in an either/or scenario—either
    you are eligible to drink, or you’re not. However, life is more complex than this,
    which is why if statements can be paired with else-if statements. This combination
    will let you choose from several options as in the program below.


    Please key in this program and run it with the Java command to see the result:


    import java.util.*;


    public class ComplexConditionals{


    public static void main (String[] args) {


    Scanner ageGet = new Scanner(System.in);


    System.out.println("How old are you?");


    int age = ageGet.nextInt();


    if (age < 18){


    System.out.println("You''re a kid!"); System.out.println("Go to school.");


    }


    else if(age < 29){


    System .out.println("Time to establish yourself.");


    System.out.println("Good Luck!"); }


    else if(age < 39){


    System.out.println("These are the years to focus on your career.");


    System.out.println("Get a job.");


    }


    else if(age < 49){


    System .out.println("Time to start thinking about retirement.");


    System.out.println("I hope you''re putting money away.");


    }


    else if(age < 59){


    System.out.println("Maintain your health through exercise.");


    System.out.println("Get a trainer."); }


    else{


    System.out.println("You are old"); }


    } }


    With apologies to those 59 and older, this program provides feedback based on
    the age the user enters. First the user enters their age and this value is assigned
    to the variable *age*. The value entered by the user is then tested in the first
    part of the if statement. If the age is less than 18, the program responds with
    “You’re a kid! Go to school.”


    If the first condition turns out to be false, the *else if* condition is evaluated.
    If the age is less than 29 the appropriate advice is dispensed. If not, the next
    statement is evaluated. If none of the conditions associated with the *else if*
    statements are found to be true, then the unfortunate *else* statement at the
    end of the program runs.


    Keep in mind that *else if* statements are only run if all of the previous conditions
    are found to be false. Note also the indentation used throughout the *else*/*else
    if*/*else* is consistent. This is for housekeeping purposes. Readability is a
    important part of programming.


    **While Loops**


    Loops allow you to run a block of code a number of times. Each time that block
    of code is executed is known as an *iteration*. Loops are critical to many different
    types of programs. Imagine a card game where turns are taken and cards are dealt—all
    with loops. If you think about it, you can probably identify loops in many different
    types of software that you use every day. The process of waiting for the user
    to input something, processing that input and then waiting for the user again
    is often coded in a loop structure.


    Let’s code a simple loop:


    public class Loop{


    public static void main (String[] args) {


    int tracker = 0;


    while(tracker<100){


    System.out.println(tracker);


    tracker += 5; }


    }


    }


    Run the program with the Java command and the result should appear something like
    what you see in figure 4.4:


    ![](images/00019.jpeg)Figure 4.4: The result of a while loop


    In the first line of this program we declare and initialize a variable *tracker*
    with the value 0\. Next comes our *while* statement which states that while the
    value of *tracker* is less than 100, the code block inside the brackets of the
    *while* statement will execute. In this case, the code block prints the value
    of *tracker* to the console and then increases the value *tracker* by 5.


    Note that the x+=5 notation is shorthand for x=x+5\. += is known as a combined
    assignment operator.


    **Talk the Talk:** Programmers generally call “+=” “plus equals”. So when describing
    this code one would say “x plus equals five” Here’s another loop example program
    for you to try. I saved mine as Loop2.java.


    import java.util.*;


    public class Loop2{


    public static void main (String[] args) {


    Scanner bandName = new Scanner(System.in); String band = "";


    while(!band.equals("XXX")){


    System .out.println("Name of a band you like or XXX to stop.");


    band = bandName.nextLine();


    if(!band.equals("XXX")){


    System.out.println( band + " ROCKS!"); }


    }


    } **Note:** Due to strings being a reference type, you have to use the .equals()
    method to check for equality. This method returns true if the strings are equal
    and false if not.


