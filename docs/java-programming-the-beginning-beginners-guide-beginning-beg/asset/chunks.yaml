    **Sorting Arrays**


    We’ve manipulated and stored a lot of data so far. We have not, however, organized
    much data.


    Arrays are a powerful organizational tool. One reason is because of the **sort()**
    method. It does exactly what it sounds like—it sorts the members of the array.
    The sort method is called a bit differently from normal methods though. Sort()
    is called as a static member of the array class like this:


    Arrays.sort(<Array>);


    Make a new file and copy this code. My file is called ArraySortDemo.java:


    import java.util.Arrays;


    public class ArraySortDemo{


    public static void main (String[] args) {


    String[] groceries = {


    "oranges","apples","milk","bread","butter","pepper", "salt","sugar","pears"


    };


    System.out.println("___UNSORTED ARRAY___");


    for(String a:groceries){


    System .out.print(a + " ");


    }


    System.out.println();


    System.out.println("___SORTED ARRAY___");


    Arrays.sort(groceries);


    for(String a:groceries){ System.out.print(a + " "); }


    System.out.println();


    }


    }


    Note: Don’t worry if you don’t understand the for loops. They’re used to print
    our array. We’ll cover them in the next section.


    Run your program with the Java command. Your output should look something like
