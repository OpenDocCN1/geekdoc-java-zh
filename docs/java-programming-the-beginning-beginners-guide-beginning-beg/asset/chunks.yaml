  trans: "\n\n# 变量的声明与初始化\n\nJava 是一种所谓的强类型语言。这意味着变量在使用之前需要进行声明。在 Java 中，变量是根据它们所持的数据类型来区分的。这种数据类型被称为变量的数据类型（datatype）。\n\
    \nJava 中有两种变量：基本类型和类类型（也称为引用类型）。\n\n## 基本类型变量\n\n在 Java 中，有八种基本数据类型。它们分别是 `byte`、`short`、`int`、`long`、`float`、`double`、`boolean`\
    \ 和 `char`。\n\n声明和初始化语句通常非常短，并根据变量的类型预留特定数量的内存。这里有一个整数的整数声明和初始化示例：\n\n```java\n\
    int name = 93;\n```\n\n## 类变量\n\n类类型变量（也称为引用类型变量）通常比基本类型更复杂。在大多数情况下，基本类型是类类型变量的构建模块。当你声明并初始化一个类类型变量时，该名称并不代表对象本身，而是指向组成对象的所有部分和信息的内存位置。\n\
    \n世界上有成百种不同的类类型变量，它们的功能各相同。你已经遇到过其中之一就是 `Scanner`。\n\n这里再次给出声明和初始化：\n\n```java\n\
    Scanner name = new Scanner(<parameters>);\n```\n\n## 字符串\n\nJava 中的字符串实际上是类或引用类型变量。然而，它们可以像基本类型一样被声明。这是\
    \ Java 开发人员的一种快捷方式，为了让处理字符串变得简单一些，因为它们是最常见的数据类型之一，使用频率与基本类型一样。（想想你已经使用了它们多少次！）\n\
    \n如果你愿意，可以像声明类类型变量一样声明字符串，但这样做并没有优势。\n\n它看起来像这样：\n\n```java\nString blogName =\
    \ new String(\"Edukwest!\");\n```\n\n**注意：** 由于字符串是类类型，因此不能像基本类型那样使用 `>` 或 `==`\
    \ 等通用比较运算符进行比较。\n\n在这里，我们创建了一个名为 `blogName` 的变量，并将其初始化为字符串值“Edukwest!”。这里的等号是赋值运算符。字符串值“Edukwest!”被赋值给变量\
    \ `blogName`。\n\n一旦声明了变量，通常你就可以对它做很多操作。这里有一个使用变量更改句子中打印内容的示例。\n\n输入以下代码中的关键部分。（你可以自由为变量替换自己的值。）注意注释是由两个斜杠（`//`）指示的。多行注释可以使用斜杠和星号创建并用星号和斜杠结束（/*注释!*/）。\n\
    \n```java\npublic class Variables{\n    public static void main (String[] args)\
    \ {\n        float gpa = 3.95f; int age = 17;\n        String name = \"Keshav\"\
    ;\n        //注意变量声明的第一个单词是类型。\n        System.out.println(name + \" is \" + age\
    \ + \" and wished he had a \" + gpa + \" gpa.\");\n    }\n}\n```\n\n将文件保存为 `Variables.java`\
    \ 并使用 `Java` 命令运行它。你的输出应该与图 3.1 相似\n\n![](img/00011.jpeg)\n\n图 3.1：在 Koding.com\
    \ 虚拟 Linux 环境中执行 `Variables.java`。\n\n声明中的第一个单词是要创建的变量类型。回顾一下，此程序中的变量类型为：\n\n\
    - **String：** `String` 变量由特定顺序的一系列字符组成，这些字符没有数学值。\n- **Integer：** `Integer` 变量包含不带小数点的整数值。\n\
    - **浮点数值：** 浮点型变量包含更精确的数字，通过小数点值表示整数部分和小数部分。\n\n变量是动态的，因为其值在程序的整个生命周期内可以被更改或重新赋值。例如，在视频游戏中，你有一个跟踪玩家得分的变量。随着玩家得分的变化，该值将一直增加直到游戏结束。一旦游戏结束，`player’s\
    \ score` 变量中的值可能会被重新赋值为零。\n\n考虑以下代码：\n\n```java\nimport java.util.*; \npublic\
    \ class Var2{\n    public static void main (String[] args) { \n        Scanner\
    \ names = new Scanner(System.in);\n        String firstName, lastName, middleName,\
    \ fullName;\n        System.out.println(\"What's your first name?\");\n      \
    \  firstName = names.nextLine();\n        System.out.println(\"What's your last\
    \ name?\");\n        lastName = names.nextLine();\n        fullName = firstName\
    \ +\" \"+ lastName;\n        System.out.println(fullName);\n        System.out.println(\"\
    What's your middle name?\");\n        middleName = names.nextLine();\n       \
    \ fullName = firstName + \" \" + middleName + \" \" + lastName;\n        System.out.println(fullName);\n\
    \    }\n}\n```\n\n输入代码并运行程序将得到以下结果：\n\n![](img/00012.jpeg)\n\n图 3.2：在 `fullName`\
    \ 变量生命周期内，值被重新赋值\n\n注意，当我们第一次声明 `fullName` 变量时，它被赋值为通过 `+` 号连接的 `first` 和 `last`\
    \ 值。然后该值被打印到控制台。随着程序的继续执行，该值会改变。\n\n"
