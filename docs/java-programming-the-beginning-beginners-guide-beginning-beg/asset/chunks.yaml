    当此程序首次运行时，变量 `band` 被设置为空字符串。在每次循环中，`band` 的值都会与字符串“XXX”进行比较。如果循环的内容任何不是“XXX”，循环将再次迭代。如果值不是
    `XXX`，则会将带的名称回显到控制台。


    注意，所有的左括号都有对应的右括号。如果你在一段有连续多个右括号的代码中迷失了方向，这里有一个技巧：类中的左括号和右括号的数量**总是**相同的——如果你有更多左括号，请尝试对每一个左括号进行配对，直到发现缺少了右括号。


    ### 不要在家里尝试


    编程中一个常见的错误是死循环。这些死循环会消耗越来越多的计算资源，最终导致程序或你的电脑崩溃。考虑以下代码：


    ```java

    public class LetsBreakTheComputer{


    public static void main (String[] args) {


    double x = 1;


    while(0<x){


    System.out.println(x);


    X*=300000; }


    }

    ```


    你会注意到，在这个示例中，继续条件将`始终`为真——`x` 的值将始终大于零。`x` 的值迅速失控，实际上变得大到无法存储在内存中。我在 `Koding.com
    environment` 中运行了这个。我花了大约 10 分钟才停止程序的执行，因为 koding 的环境由于程序而卡顿。


    ![](img/00021.jpeg)


    图 4.6：此时环境由于死循环而冻结。它偶尔会打印几百次“Infinity”，然后立即再次冻结。


    你可以自己尝试这个示例。我对造成的任何损坏不负责。（损坏不会永久的……玩得开心点！）


    ### for 循环


    我们已经确定，在 `while` 循环中忘记放入正确的迭代器会对你的程序不利。我们如何避免出现死 `while` 循环？答案是 `for` 循环。`for`
    循环的作用与 `while` 循环相同，但它们只会执行固定的次数，因为你被要求在条件之外，还将迭代器和变量作为循环语法的一部分。因此，创建一个无限执行的 `for`
    循环极其困难。


    这是一个非常简单的 `for` 循环示例。它的作用与我们的第一个循环相同：打印 0 到 100，且步长为 5。


    这个循环在一个名为 `Loop3` 的文件中：


    ```java

    public class Loop3{


    public static void main (String[] args) {


    for(int x = 0; x<100; x+=5){ System.out.println(x); }


    }


    }

    ```


    循环的语法非常简单。首先，我们有一个初始化并声明的局部变量 `x`。局部变量无法在循环外部访问或更改。然后，我们有一个条件。该条件的作用与 `while`
    循环中相同。当它不再为真时，循环将停止迭代。最后，我们有所谓的迭代器。这是对你为为循环声明的变量进行重新赋值。迭代器就是之所以通常很难意外创建死循环的原因。注意，这三个语句之间用分号隔开，就像它们是行尾一样。这是执行此代码的结果：


    ![](img/00022.jpeg)图 4.7：`for` 循环的结果与我们原始 `while` 循环的结果相同。


