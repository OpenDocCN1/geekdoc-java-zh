- fmt: "\nClasses and objects represent not just a programming concept, but a way\
    \ of looking at the world and solving problems. Classes and objects, at a high\
    \ level, represent a process of classification—an activity that is as old as science.\
    \ When we create a class, we create a model of an object that breaks the object\
    \ down to its core activities and attributes. Java is an Object Oriented language,\
    \ meaning that it is completely dependent on the `Class` and `Object` structure\
    \ and everything must be contained in one. Java isn’t the only language that supports\
    \ objects. It’s good to have an understanding of objects as they are a very common\
    \ occurrence in programming.\n\n## Class Versus Objects\n\nI often tell my students\
    \ to think of a class as a blueprint of an object. From that blueprint, many instances\
    \ of the class (objects) can be created. Think of planned housing communities:\
    \ a single blueprint may be used to build many different homes. These homes may\
    \ vary in substantial ways—they may be different colors, have different kitchen\
    \ counters, and different fixtures in the bathrooms—but they are all still based\
    \ on the same blueprint.\n\nIn programming, a class defines how an object of the\
    \ class is described and what it can do. It might be useful to think of classes\
    \ as a set of adjectives and a set of verbs. The adjectives give us a way to describe\
    \ the class, while the verbs tell us what the class can do. The set of adjectives\
    \ used to describe a class are known as `fields`. The set of verbs associated\
    \ with a class are known as `methods`.\n\nIf we were describing a class “vehicle”\
    \ we might include the following methods and properties:\n\n| Fields (Adjectives)\
    \ | Methods (Verbs) |\n| :--- | :--- |\n| color | `accelerate()` |\n| weight |\
    \ `decelate()` |\n| height | `turnLeft()` |\n| topSpeed | `turnRight()` |\n| vehicleType\
    \ | `startIgnition()` |\n| | `stopIgnition()` |\n\nObviously this model is greatly\
    \ simplified. If we were truly trying to represent a vehicle in code, we’d likely\
    \ have to use several interrelated classes. In Java we also have to declare the\
    \ type of data each property would hold. For example, the `color` property would\
    \ hold a string, while `weight`, `height` and `topSpeed` could be integers. When\
    \ we create an instance of the `Vehicle` class that we defined in the previous\
    \ table, we might assign a value to all of the properties, like this:\n\n```\n\
    String color = \"blue\"; double weight = 5565.3; int height = 48;\nint topSpeed\
    \ = 90;\nString vehicleType = \"car\";\n```\n\nThis example assumes an instance\
    \ (object) created called `theVehicle`.\n\n## Coding a Class in Java\n\nLet’s\
    \ write the code that represents an `Animal` class in Java. We’ll also create\
    \ an instance of that class called `myDog` in another file, a bit later.\n\n```java\n\
    public class Animal{\n    private static int numberOfAnimals = 0; \n    public\
    \ int length;\n    public String color;\n    public double weight;\n    public\
    \ boolean hasFur;\n\n    public Animal(int Length, double Weight, String Color,\
    \ boolean Fur){\n        color = Color;\n        weight = Weight;\n        hasFur\
    \ = Fur;\n        length = Length;\n        numberOfAnimals ++;\n    }\n}\n```\n\
    \nThere are definitely a few new things here. The first is that we don’t have\
    \ a `public static void main`. This is because this program doesn’t run in the\
    \ way that we’ve been seeing so far. The `main` method is generally the entrance\
    \ point for the JVM to start executing our code. It will be in our driver class,\
    \ which we’ll write later. We start our definition of the class with the `public\
    \ class` keywords and then the name of the class—in this case, “Animal.” The `public`\
    \ keyword gives information about visibility. It tells the JVM that any class\
    \ is allowed to make objects from this class and call its methods. The `Class`\
    \ keyword informs Java as to what this file is. Next, you’ll notice I declare\
    \ a variable called `numOfAnimals` and initialize it at zero. The `numOfAnimals`\
    \ variable is designed to do some internal housekeeping in the class. Its job,\
    \ specifically, is to track how many instances of `Animal` we create. The `static`\
    \ keyword between the datatype and the visibility level (which in this case is\
    \ `private`) is what enables us to use this variable as a tracker. `Static` means\
    \ that you don’t have to create an instance of a class in order to access or modify\
    \ this information. This means that each object doesn’t have an instance of `numOfAnimals`\
    \ rather it exists in the class.\n\nAfter `numOfAnimals` I simply create a number\
    \ of variables detailing information about our animal: things such as `weight`,\
    \ `color`, `length` and if it has fur or not.\n\nA keyword is a reserved word\
    \ that cannot be used for anything other than its intended functions. Examples\
    \ include: `public`, `private`, `for`, `while` and `do`. Generally keywords will\
    \ be highlighted by your text editor. The editor I’m using on Koding colors them\
    \ purple, as seen on the left side of figure 6.1. Keywords cannot be used as variable,\
    \ function or class names, due to the fact that they’re already reserved.\n\n\
    We then define with the `public` keyword in the `Animal` file what’s known as\
    \ a “constructor”. This method is very important. It does three things: details\
    \ the information that we need in order to make an object based on this class,\
    \ preforms any internal housekeeping and assigns initial values to the fields.\
    \ It will be executed every time that an object is created based on of your class.\n\
    \nThe constructor is called by the driver class below. I named mine `AnimalDriver.java`:\n\
    \n```java\npublic class AnimalDriver{\n    public static void main (String[] args)\
    \ {\n        Animal myDog = new Animal(19, 12, \"brown\", \"true\");\n    }\n\
    }\n```\n\nThe particular instance of `Animal` that we are creating, called `myDog`,\
    \ has a length of 19, weight of 12, is brown and has fur. The first four lines\
    \ of constructor assign these values that are passed into. You may be wondering\
    \ how we determined the order of information to put into the class. The answer\
    \ is pretty simple; the constructor accepts arguments in the order the class’s\
    \ coded. In our class, the order of data types was: `int`, `double`, `String`\
    \ and `Boolean`. This means when we call the constructor, that’s the order must\
    \ follow.\n\nExamine the following line:\n\n`numOfAnimals++;`\n\nThis line is\
    \ designed to increment the value of `numOfAnimals`, the internal housekeeping\
    \ variable that keeps track of how many instances of Animal we generate. The actual\
    \ instance is generated with the code in the driver class\n\n## Adding Some Methods\n\
    \nLet’s change up and add to our initial code:\n\n```java\npublic class Animal{\n\
    \    private static int numberOfAnimals = 0; \n    public int length;\n    public\
    \ String color;\n    public double weight;\n    public boolean hasFur; \n    public\
    \ boolean isHungry;\n\n    public Animal(int Length, double Weight, String Color,\
    \ boolean Fur, boolean Hungry){\n        color = Color;\n        weight = Weight;\n\
    \        hasFur = Fur;\n        isHungry = Hungry;\n        length = Length;\n\
    \        numberOfAnimals ++;\n    }\n\n    public String walk(){\n        return\
    \ \"Animal is walking\";\n    }\n\n    public String eat(){\n        isHungry\
    \ = false;\n        weight += .1;\n        return \"Animal has eaten.\\n\" + \"\
    Animal now weighs: \" +\n        weight + \" pounds\";\n    }\n\n    public String\
    \ getLength(){\n        return \"Animal's length is \" + length;\n    }\n}\n```\n\
    \nNow that we’ve added to our animal class, we need to add to the driver class\
    \ in order to continue testing.\n\nRewrite the code in your `AnimalDriver` file\
    \ so it looks like this, then recompile and run it.\n\n```java\npublic class AnimalDriver{\n\
    \    public static void main (String[] args) {\n        Animal myDog = new Animal(19,\
    \ 12, \"brown\", true);\n        System.out.println(myDog.walk()); \n        System.out.println(myDog.eat());\n\
    \        System.out.println(myDog.getLength());\n    }\n}\n```\n\nWhen you run\
    \ the code with the `Java` command, the result should appear something like this:\n"
  raw: 'Classes and objects represent not just a programming concept, but a way of
    looking at the world and solving problems. Classes and objects, at a high level,
    represent a process of classification—an activity that is as old as science. When
    we create a class, we create a model of an object that breaks the object down
    to its core activities and attributes. Java is an Object Oriented language, meaning
    that it is completely dependent on the Class and Object structure and everything
    must be contained in one. Java isn’t the only language that supports objects.
    It’s good to have an understanding of objects as they are a very common occurrence
    in programming.


    **Class Versus Objects**


    I often tell my students to think of a class as a blueprint of an object. From
    that blueprint, many instances of the class (objects) can be created. Think of
    planned housing communities: a single blueprint may be used to build many different
    homes. These homes may vary in substantial ways—they may be different colors,
    have different kitchen counters, and different fixtures in the bathrooms—but they
    are all still based on the same blueprint.


    In programming, a class defines how an object of the class is described and what
    it can do. It might be useful to think of classes as a set of adjectives and a
    set of verbs. The adjectives give us a way to describe the class, while the verbs
    tell us what the class can do. The set of adjectives used to describe a class
    are known as fields. The set of verbs associated with a class are known as methods.


    If we were describing a class “vehicle” we might include the following methods
    and properties:


    **Fields** (Adjectives) **Methods** (Verbs)


    color accelerate()


    weight decelerate()


    he height turnLeft()


    topSpeed turnRight()


    vehicleType startIgnition()


    stopIgnition()


    Obviously this model is greatly simplified. If we were truly trying to represent
    a vehicle in code, we’d likely have to use several interrelated classes. In Java
    we also have to declare the type of data each property would hold. For example,
    the color property would hold a string, while weight, height and top speed could
    be integers. When we create an instance of the Vehicle Class that we defined in
    the previous table, we might assign a value to all of the properties, like this:


    String color = "blue"; double weight = 5565.3; int height = 48;


    int topSpeed = 90;


    String vehicleType = "car";


    This example assumes an instance (object) created called theVehicle.


    **Coding a Class in Java**


    Let’s write the code that represents an Animal class in Java. We’ll also create
    an instance of that class called myDog in another file, a bit later.


    public class Animal{


    private static int numberOfAnimals = 0; public int length;


    public String color;


    public double weight;


    public boolean hasFur;


    public Animal(int Length, double Weight, String Color, boolean Fur){


    color = Color;


    weight = Weight;


    hasFur = Fur;


    length = Length;


    numberOfAnimals ++;


    }


    There are definitely a few new things here. The first is that we don’t have a
    public static void main. This is because this program doesn’t run in the way that
    we’ve been seeing so far. The main method is generally the entrance point for
    the JVM to start executing our code. It will be in our driver class, which we’ll
    write later. We start our definition of the class with the **public class** keywords
    and then the name of the class—in this case, “Animal.” The public keyword gives
    information about visibility. It tells the JVM that any class is allowed to make
    objects from this class and call its methods. The Class keyword informs Java as
    to what this file is. Next, you’ll notice I declare a variable called **numOfAnimals**
    and initialize it at zero. The numOfAnimals variable is designed to do some internal
    housekeeping in the class. Its job, specifically, is to track how many instances
    of Animal we create. The static keyword between the datatype and the visibility
    level (which in this case is private) is what enables us to use this variable
    as a tracker. Static means that you don’t have to create an instance of a class
    in order to access or modify this information. This means that each object doesn’t
    have an instance of “numOfAnimals” rather it exists in the class.


    After numOfAnimals I simply create a number of variables detailing information
    about our animal: things such as weight, color, length and if it has fur or not.


    A keyword is a reserved word that cannot be used for anything other than its intended
    functions. Examples include: public, private, for, while and do. Generally keywords
    will be highlighted by your text editor. The editor I’m using on Koding colors
    them purple, as seen on the left side of figure 6.1\. Keywords cannot be used
    as variable, function or class names, due to the fact that they’re already reserved.


    We then define with the **public**keyword in the Animal file what’s known as a
    “constructor”**.** This method is very important. It does three things: details
    the information that we need in order to make an object based on this class, preforms
    any internal housekeeping and assigns initial values to the fields. It will be
    executed every time that an object is created based on of your class.


    The constructor is called by the driver class below.


    I named mine AnimalDriver.java:


    public class AnimalDriver{


    public static void main (String[] args) {


    Animal myDog = new Animal(19, 12, "brown", "true");


    }


    }


    The particular instance of Animal that we are creating, called **myDog,** has
    a length of 19, weight of 12, is brown and has fur. The first four lines of constructor
    assign these values that are passed into the instance. You may be wondering how
    we determined the order of the information to put into the class. The answer is
    pretty simple; the constructor accepts arguments in the order that the class’s
    constructor is coded. In our class, the order of the data types was: int, double,
    String and Boolean. This means when we call the constructor, that’s the order
    that arguments must follow.


    ![](images/00033.jpeg)


    Figure 6.1: Creating the class (left) and driver class(right) in Koding


    Examine the following line:


    numOfAnimals++;


    This line is designed to increment the value of numOfAnimals, the internal housekeeping
    variable that keeps track of how many instances of Animal that we generate. The
    actual instance is generated with the code in the driver class which can be seen
    here in a file called AnimalDriver.java:


    public class AnimalDriver{


    public static void main (String[] args) {


    Animal myDog = new Animal(19, 12, "brown", "true");


    }


    }


    **Adding Some Methods**


    Let’s change up and add to our initial code:


    public class Animal{


    private static int numberOfAnimals = 0; public int length;


    public String color;


    public double weight; public boolean hasFur; public boolean isHungry;


    public Animal(int Length, double Weight, String Color, boolean Fur, boolean Hungry){


    color = Color;


    weight = Weight;


    hasFur = Fur;


    isHungry = Hungry; length = Length;


    numberOfAnimals ++;


    }


    public String walk(){


    return "Animal is walking";


    }


    public String eat(){


    isHungry = false;


    weight += .1;


    return "Animal has eaten.\n" + "Animal now weighs: " +


    weight + " pounds";


    }


    public String getLength(){


    return "Animal''s length is " + length;


    }


    } Now that we’ve added to our animal class, we need to add to the driver class
    in order to continue testing.


    Rewrite the code in your AnimalDriver file so it looks like this, then recompile
    and run it.


    public class AnimalDriver{


    public static void main (String[] args) {


    Animal myDog = new Animal(19, 12, "brown", true);


    System.out.println(myDog.walk()); System.out.println(myDog.eat());


    System.out.println(myDog.getLength());


    }


    }


    When you run the code with the Java command, the result should appear something
    like this:


    ![](images/00034.jpeg)Figure 6.2: Creating an instance of a class and manipulating
    it'
