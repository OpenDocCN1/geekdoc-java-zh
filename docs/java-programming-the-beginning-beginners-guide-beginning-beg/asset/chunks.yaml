    ## Chapter 1: Writing Your First Program


    Welcome. If this is your first time programming, congratulations! You’re about
    to start an adventure that most find very rewarding. If you are trying to learn
    after a previous abortive attempt, you deserve recognition as well. Tackling programming
    isn’t always easy—but it’s not outside the grasp of the average person, either.


    Over the years, I ’ve taught programming to over 500,000 people both online and
    in person. The programmers I’ve met over the years—both beginners and seasoned
    vets—have come from a variety of backgrounds. I’ve found that both PhDs and high
    school dropouts can make good programmers. I’ve had mathematicians, psychiatrists,
    and 12 year-olds in my classes over the years and all have been able to learn
    some programming.


    You will learn too. In this introductory chapter—which is specially designed for
    the slightly apprehensive beginner—I am going to take you step-by-step through
    the process of writing your first program. You don’t need any special equipment
    except a laptop or desktop computer.


    So without furtherdelay, let’s get started!


    ### What You’re Going to Learn


    This first chapter will serve as an introduction on setting up your programming
    environment and getting started. Each chapter following is designed to take you
    through the basics of a certain aspect of development and give you a foundation
    for greater learning. Just to give you some context, here’s what’s coming up in
    the rest of the book:


    **Chapter 2: Input and Output**

    Input and output are key to any program. In this chapter we’ll look at how to
    get data into and out of program.


    **Chapter 3: Understanding Variables**

    Variables are key building blocks in any program. This chapter takes readers through
    declaring and utilizing variables in expressions. Video tutorial included.


    **Chapter 4: Conditionals and Loops**

    Conditionals and Loops are structures which allow programs to make decisions that
    alter the execution of the program and result. These will be demonstrated and
    explained in this chapter.


    **Chapter 5: Dealing with Data**

    Almost every useful program, to some extent, deals with data. In this chapter
    you’ll learn how to store various forms of data in a program.


    **Chapter 6: Putting it All Together**

    In this final chapter, readers will learn how to create a useful program that
    processes and stores data, using the skills developed in the previous chapters.


    Before we write any programs, we have get your development environment set up.
    I won’t make you buy anything and you’ll have a few options to choose from.


    Figure 1.1: The Author’s Development Environment. Doobie Brothers’ music not included


    ### Setting Up Your Development Environment


    We’re going to be using a language called Java in this book. Installing Java on
    your machine is rather simple and the process is generally the same for most major
    operating systems. With your browser you’re going to want to navigate to oracle.com.
    Oracle is the company that maintains Java, and the `JDK` (Java Development Kit)
    that you need to download to write code in Java.


    Once at Oracle.com, find `Downloads` on the top menu bar and click on `Java for
    Developers` under `Popular Downloads`.


    Figure 1.2: Oracle.com with the Downloads menu open.


    After clicking that link you will see a download page. A dialog box will appear
    that reads `JDK`, with a download button under it. When you click it, it will
    redirect you to a page where you can select your operating system. The website
    will provide a set of instructions detailing how to go about installing the `JDK`
    onto your computer. Figure 1.3: The terminal in the author’s computer. Note that
    the author changed the default colors through the terminal’s preferences

