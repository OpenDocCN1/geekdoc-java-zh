- fmt: "\nIn the event that you’d rather not go through the process of installing\
    \ a JDK to your machine I recommend you use the virtual Linux server provided\
    \ by my friends at Koding.com. Point your browser to www.Koding.com and register\
    \ for their free account. The free account gives you a virtual Linux machine that\
    \ you can access through your web browser—and it can compile and run Java code\
    \ right out of the box! No downloads are required. It’s what I used to write the\
    \ code we’ll be using in this book.\n\nOnce you have your account, click the button\
    \ to turn on your Virtual Machine(VM) and get coding. You’ll be using a text editor\
    \ on Koding to type Java files and the terminal to run them.\n\nFigure 1.4: Command\
    \ Line (or Terminal) in Koding.com.\n\n## Writing and Running Your Code\n\nNow\
    \ that you have your environment setup, it’s time to (finally) write some code.\
    \ We’ll write code in a text editor. A text editor is different than a word processor.\
    \ A word processor will introduce invisible formatting code into a file. If you\
    \ were to run code written in a word processor it would likely cause an error\
    \ due to the embedded formatting code.\n\nA text editor, on the other hand, saves\
    \ the text you enter as pure text — without introducing any unnecessary formatting.\
    \ The text produced by a text editor can be easily processed by the Java compiler.\
    \ Within the command line environments in the Koding.com virtual machine and on\
    \ the Mac there are two text editors you can use. They are known as `nano` and\
    \ `vi`. These text editors have a heritage that goes back to the 1970s—so as you\
    \ use them you can truly feel “old school!” The other option is to use the default\
    \ text editor on Koding, TextEdit on a Mac or Notepad on Windows. They’re all\
    \ rather self-explanatory, although some may need a few settings changed to highlight\
    \ Java code. As a side note, make sure that whenever you first save your code\
    \ files, you save them as “filename.java”.\n\n### nano\n\nNano is an easy to use\
    \ Linuxbased editor. It’s pretty intuitive. You can simply start typing your code\
    \ when the `nano` environment loads. Nano has a number of control codes which\
    \ are listed at the bottom of your screen for your reference. The most important\
    \ to note are `CTRL+L` which saves your file and `CTRL+X` which exits nano and\
    \ returns you to the command line.\n\nBy default, nano will save your file in\
    \ the same folder you were in when you opened `nano` itself.\n\n![](images/00003.jpeg)Figure\
    \ 1.5: The nano text editor.\n\nYou can start nano by typing `nano` and then hit\
    \ enter on the command line.\n\n### vi\n\nvi is a slightly more complex (and even\
    \ more “old school”) text editor. The most important thing to understand about\
    \ `vi` is that there are two modes: command mode and insert mode. To enter insert\
    \ mode, press ‘i’ on your keyboard. When you want to move into command mode to\
    \ issue commands like write and quit, hit the `ESC` key. If you screw up and find\
    \ yourself in the wrong mode, press `ESC` a lot and that seems to get you back\
    \ into command mode from wherever you are at.\n\nThere’s an old joke about `vi`\
    \ that goes like this: *vi has two modes, and you’re in the wrong one.* (If you\
    \ don’t think that’s funny right now, you will after you use `vi` for a bit!)\n\
    \nWhen you enter `vi`, type `i` to move into insert mode and you’ll be able to\
    \ type your code. When you’re done, hit `ESC` to move into command mode. All commands\
    \ must be preceded by a colon. So to write your file you’ll enter `:w`. To quit\
    \ you’ll enter `:q`. `vi` also lets you combine commands. For example, the combination\
    \ `:wq` will write your file and then quit back to the command line.\n\nFigure\
    \ 1.6: vi wants you to help poor children in Uganda. It offers limited help for\
    \ new programmers worldwide.\n\nYou can start `vi` by typing `vi` and then hitting\
    \ return on the command line.\n\nSo now you should have your text editor started\
    \ and be ready to enter your code. Enter the following code into your text editor\
    \ exactly as it appears:\n\n```java\npublic class HelloWorld{\n    public static\
    \ void main (String[] args) {\n        System.out.println(\"This is my first program!\"\
    ); \n        System.out.println(\"Programmers are rockstars!\");\n    }\n}\n```\n\
    \nIt should be at least somewhat evident what this code does. The `println()`\
    \ function prints content to the command line. In this case you are printing two\
    \ strings. Strings are simply lines of characters. Strings are always enclosed\
    \ in quotes.\n\nOnce you’ve typed the code, it’s time to run it. In nano, save\
    \ your file by typing `CTRL+W`. When prompted, enter the filename `HelloWorld.java`.\
    \ The `.java` extension indicates that this is a Java source code file. Next enter\
    \ `CTRL+X` to quit and you’ll return to the command line. In `vi`, enter command\
    \ mode and then save your file by typing `:w HelloWorld.java`. This writes your\
    \ file under the appropriate file name. Finally, in `vi`, hit `:q` to quit and\
    \ return to the command line. In any other editor, including the one on Koding,\
    \ generally you can open a menu and click ‘save as’ just like you would in any\
    \ other computer program.\n\nNotice that the filename we gave this program matches\
    \ the name of the class (`HelloWorld`). This is the Java standard. This standard\
    \ makes class files easily identifiable in build when you have multiple source\
    \ files. So for housekeeping purposes, whenever you make a new `.java` file make\
    \ sure that the name of the class in the code (which is written after `public\
    \ class` in the first line) matches the name of the file.\n\nFigure 1.7: Saving\
    \ your file in Koding.\n\nNow that you have typed your code, open your terminal\
    \ and your cursor should appear at the prompt. Run the program by entering the\
    \ following (don’t type the `$`):\n\n```bash\njavac HelloWorld.java\njava HelloWorld\n\
    ```\n\nThe first line here commands Java to compile the source code that you wrote\
    \ into what’s known as byte code and write it to a `.class` file. This byte code\
    \ is executed by the Java Virtual Machine (or `JVM`) whenever you run your program.\
    \ `JVMs` can be installed on numerous devices, from cellphones to supercomputers,\
    \ and they all do the same thing: run Java code. The result of this is Java’s\
    \ ability to run on multiple platforms. So long as a `JVM` is installed on a machine,\
    \ it can run the compiled Java code that you write. The second line instructs\
    \ Java to actually run what’s in the `.class` file. Note that `.class` is implied.\
    \ You don’t have to type it when you run your code. If you open the folder where\
    \ the file is saved, you will see it as a `.class` file though.\n\n![](images/00004.jpeg)Figure\
    \ 1.8: Execution of the HelloWorld.java program\n\nIf your output doesn’t look\
    \ similar to figure 1.9, you need to load your text editor and code again and\
    \ find your error. You can reload your code at the command line prompt with the\
    \ following command:\n\nFor `vi`: `vi HelloWorld.java`\n\nFor `nano`: `nano HelloWorld.java`\n\
    \nIn any other editor, open the file as you would any other. Some common errors\
    \ include:\n\n- Not closing brackets\n- Forgetting semicolons at the end of lines\n\
    - Mistyping `public static void main(String[] args)` (It’s case sensitive!)\n\n\
    Congratulations! You have written your first program.\n\n## Understanding the\
    \ println() function\n\nIn the preceding example we used the `println` function\
    \ to output a string. The print function is also capable of printing out the following\
    \ types of data:\n\n### Integers\n\nIntegers are “whole numbers” and don’t have\
    \ a decimal point. In Java, you can print an integer like this:\n\n```java\nSystem.out.println(2573);\n\
    ```\n\n### Floating Point Numbers\n\nFloats are more precise numbers that include\
    \ a decimal point. In Java you can print a floating point number like this:\n\n\
    ```java\nSystem.out.println(3.45783);\n```\n"
  raw: 'In the event that you’d rather not go through the process of installing a
    JDK to your machine I recommend you use the virtual Linux server provided by my
    friends at Koding.com. Point your browser to www.Koding.com and register for their
    free account. The free account gives you a virtual Linux machine that you can
    access through your web browser—and it can compile and run Java code right out
    of the box! No downloads are required.It’s what I used to write the code we’ll
    be using in this book.


    Once you have your account, click the button to turn on your Virtual Machine(VM)
    and get coding.You’ll be using a text editor on Koding to type Java files and
    the terminal to run them.


    Figure 1.4: Command Line (or Terminal) in Koding.com.


    **Writing and Running Your Code**


    Now that you have your environment setup, it’s time to (finally) write some code.
    We’ll write code in a text editor. A text editor is different than a word processor.
    A word processor will introduce invisible formatting code into a file. If you
    were to run code written in a word processor it would likely cause an error due
    to the embedded formatting code.


    A text editor, on the other hand, saves the text you enter as pure text — without
    introducing any unnecessary formatting. The text produced by a text editor can
    be easily processed by the Java compiler. Within the command line environments
    in the Koding.com virtual machine and on the Mac there are two text editors you
    can use. They are known as *nano* and *vi*. These text editors have a heritage
    that goes back to the 1970s—so as you use themyou can truly feel “old school!”
    The other option is to use the default text editor on Koding, TextEdit on a Mac
    or Notepad on Windows. They’re all rather self-explanatory, although some may
    need a few settings changed to highlight Java code. As a side note, make sure
    that whenever you first save your code files, you save them as “filename.java”.


    *nano*


    Nano is an easy to use Linuxbased editor. It’s pretty intuitive. You can simply
    start typing your code when the nano environment loads. Nano has a number of control
    codes which are listed at the bottom of your screen for your reference. The most
    important to note are CTRLO which saves your file and CTRL-X which exits nano
    and returns you to the command line.


    By default, nano will save your file in the same folder you were in when you opened
    nano itself.


    ![](images/00003.jpeg)Figure 1.5: The nano text editor.


    You can start nano by typing **nano** and then hit enter on the command line.


    *vi*


    vi is a slightly more complex (and even more “old school”) text editor. The most
    important thing to understand about vi is that there are two modes: command mode
    and insert mode. To enter insert mode, press ‘i’ on your keyboard. When you want
    to move into command mode to issue commands like write and quit, hit the ESC key.
    If you screw up and find yourself in the wrong mode, press ESC a lot and that
    seems to get you back into command mode from wherever you are at.


    There’s an old joke about vi that goes like this: *vi has two modes, and you’re
    in the wrong one.*(If you don’t think that’s funny right now, you will after you
    use vi for a bit!)


    When you enter vi, type **i**to move into insert mode and you’ll be able to type
    your code. When you’re done, hit ESC to move into command mode. All commands must
    be preceded by a colon. So to write your file you’ll enter **:w**. To quit you’ll
    enter **:q**. vi also lets you combine commands. For example, the combination
    **:wq** will write your file and then quit back to the command line.


    Figure 1.6: vi wants you to help poor children in Uganda. It offers limited help
    for new programmers worldwide.


    You can start vi by typing **vi** and then hitting return on the command line.


    So now you should have your text editor started and be ready to enter your code.
    Enter the following code into your text editor exactly as it appears:


    public class HelloWorld{


    public static void main (String[] args) {


    System.out.println("This is my first program!"); System.out.println("Programmers
    are rockstars!"); }


    }


    It should be at least somewhat evident what this code does. The **println()**
    function prints content to the command line. In this case you are printing two
    strings. Strings are simply lines of characters. Strings are always enclosed in
    quotes.


    Once you’ve typed the code, it’s time to run it. In nano, save your file by typing
    CTRL-W. When prompted, enter the filename


    **HelloWorld.java**. The “.java” extension indicates that this is a Java source
    code file. Next enter CTRLX to quit and you’ll return to the command line. In
    vi, enter command mode and then save your file by typing **:w HelloWorld.java**.
    This writes your file under the appropriate file name. Finally, in vi, hit **:q**
    to quit and return to the command line. In any other editor, including the one
    on Koding, generally you can open a menu and click ‘save as’ just like you would
    in any other computer program.


    Notice that the filename we gave this program matches the name of the class (HelloWorld).
    This is the Java standard. This standard makes class files easily identifiable
    in build when you have multiple source files. So for housekeeping purposes, whenever
    you make a new ‘.java’ file make sure that the name of the class in the code (which
    is written after ‘public class’ in the first line of the code.) matches the name
    of the file. This way anyone reading your code willknow which ‘.class’ file is
    associated with what‘.java’ file.


    Figure 1.7: Saving your file in Koding.


    Now that you have typed your code into an editor, open your terminal, and your
    cursor should appear at the prompt. Run the program by entering the following
    at the prompt (don’t type the ‘$’—that just represents the prompt itself):


    $ javac HelloWorld.java $ java HelloWorld


    The first line here commands Java to compile the source code that you wrote into
    what’s known as Javabyte code and write it to a ‘.class’ file. This byte code
    is executed by the Java Virtual Machine (or JVM) whenever you run your program.
    JVMs can be installed on numerous devices, from cellphones to supercomputers,
    and they all do the same thing: run Java code. The result of this is Java’s ability
    to run on multiple platforms. So long as a JVM is installed on a machine, it can
    run the compiled Java code that you write.


    The second line instructs Javato actually run what’s in the ‘.class’ file. Note
    thatthe ‘.class’ is implied. You don’t have to type it when you run your code.
    If you open the folder where the file is saved, you will see it as a ‘.class’
    file though.


    If you’ve done everything correctly you should see the result of your program
    printed before the next prompt.


    ![](images/00004.jpeg)Figure 1.8: Execution of the HelloWorld.java program


    If your output doesn’t look similar to figure 1.9, you need to load your text
    editor and code again and find your error. You can reload your code at the command
    line prompt with the following command:


    vi: **vi HelloWorld.java**


    nano: **nano HelloWorld.java**


    In any other editor, open the file as you would any other.


    Some common errors include:


    -Not closing brackets


    -Forgetting semicolons at the end of lines


    -Mistyping “public static void main(String[] args)” (It’s case sensitive!)


    Congratulations! You have successfully written your first program.


    **Understanding the println() function**


    In the preceding example we used the println function to output a string. The
    print function is also capable of printing out the following types of data:


    Integers: Integers are “whole numbers” and don’t have a decimal point. In Java,
    you can print an integer like this:


    System.out.println(2573);


    Floating Point Numbers: Floats are more precise numbers that include a decimal
    point. In Java you can print a floating point number like this:


    System.out.println(3.45783);'
