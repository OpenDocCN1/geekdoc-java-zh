    和 `HashTables`。你之前可能对数据没有进行太多思考。最简单的方法是将数据组织化。例如，如果你的数据是一个购物列表，那么 `Array` 就是组织数据的最佳方式。然而，如果你想在不同的时间段存储不同的成绩，`Array`
    的效果并不理想。程序员使用了许多不同的数据结构，且每种都针对特定数据类型进行了优化。


