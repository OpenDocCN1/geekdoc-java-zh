    ![](images/00023.jpeg)Figure 5.1: Java Arrays program output using the Koding.com
    environment


    Pay special attention to the print statements. You’ll note that each print statement
    references one of our arrays and a specific index within that list surrounded
    by brackets. Lists in Java, like most languages, are indexed, meaning that each
    member of the list is assigned a number used to reference it. The first member
    of a list is always index zero.


    Our grocery list would have the following indexes:


    Index Member


    0 oranges 1 apples


    2 milk


    3 bread


    4 butter


    5 pepper


    6 salt


    7 sugar


    8 pears


    When combined with print method, the general form of retrieving data from an array
    is:


    *ArrayName[#]***;**


    Where “#” is the index you are pointing to.


    One thing to keep in mind is that your array is only as long as you initially
    make it. If you try to access a non-existent array index, your program is going
    to exit with an error. Let’s add one line to our current program:


    System.out.println(gpas[9001]);


    When you run the program you should see an output similar to the following:


    ![](images/00024.jpeg)Figure 5.2: Using an index that is out of range results
    in an exception.


    **Declaring Empty Arrays**


    All of the arrays we’ve filled so far, have been filled manually. We’ve then printed
    them by calling indexes individually. We don’t have to do this. The declaration
    and instantiation (fancy word for creation) of an array can be done with no values
    so long as you know how many elements you plan on putting inside of your array.


    Here is an example of how to do so:


    int[] vals = new int[10];'
