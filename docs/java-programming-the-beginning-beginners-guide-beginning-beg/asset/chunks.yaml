    11 % 3 = 2 12 % 3 = 0


    I frequently use modulus when programming in order to determine if a number is
    even or odd. Any even number used with modulus two will result in zero.


    ***Talk the Talk:** Mostprogrammers will say ‘mod’ for short when they are talking
    about modulus.*


    Math with variables looks pretty much as you’d expect. There are a few oddities
    that we’ll cover later though.


    Key in the following example program. You’re free to forgo copying the comments:


    public class MathDemo{


    public static void main (String[] args) {


    int alpha = 3; int bravo = 13;


    System .out.println(alpha + bravo); System.out.println(alpha bravo); System.out.println(bravo
    * alpha); System.out.println(bravo / alpha); //Note:


    13/3 is not really a whole number.


    System.out.println(bravo % alpha);


    System .out.println((double)bravo/(double)alp ha);


    /* Because we''ve casted the numbers as doubles, the real value is displayed.
    */


    }


    }


    In this program, two variables are declared as alpha and bravo. Then the operands
    are put in five expressions using addition, subtraction, multiplication, division
    and modulus.


    Both of these numbers, however, are integers. Integers can only be whole numbers
    between (2^31)-1 or -2^31\. So expressions of the integer datatype have any numbers
    after the decimal point truncated.


    This means that if an expression results in 3.9, but is printed as an int, it’ll
    simply print 3.


    We can avoid this issue by doing what’s known as type casting. This changes the
    variable’s type just before doing the math and printing, meaning we’ll get the
    real answer rather than an approximation.'
