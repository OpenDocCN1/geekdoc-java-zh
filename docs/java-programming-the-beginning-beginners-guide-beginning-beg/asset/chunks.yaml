    \ go through the same steps in the same order each time. With the addition of\
    \ conditionals and loops to our programming repertoire, your programs will be\
    \ able to vary their path based on conditions you set. Sounds like fun, right?\n\
    \n### Simple Conditionals\n\nLet’s start by writing some code. Fire up your development\
    \ environment and enter the following code (Make sure the file and class names\
    \ match):\n\n```java\nimport java.util.*;\n\npublic class Drink{\n\npublic static\
    \ void main (String[] args) {\n\nScanner ageGetter = new Scanner(System.in);\n\
    \nSystem.out.println(\"How old are you?\");\n\nint age = ageGetter.nextInt();\n\
    \nif(age >= 21){\n\nSystem.out.println(\"You can legally drink!\"); }\n\n}\n\n\
    }\n```\n\nOnce you’ve entered the program in your text editor, run it three separate\
    \ times. The first time, enter an age older than 21\\. The next time you run it,\
    \ enter an age younger than 21\\. When you run it one final time, enter 21 exactly.\
    \ To make sure the program runs correctly we want to test all the possible scenarios\
    \ for execution.\n\nYour output should appear similar to figure 4.1:\n\n![](images/00016.jpeg)\n\
    \nFigure 4.1: Program being tested for three different types of user responses\n\
    \nThis program is pretty straightforward. What’s new is the `if` statement. In\
    \ this case we’re determining if the value the user entered is greater or equal\
    \ to 21. The portion of the if statement written like this: `age>=21` is known\
    \ as the `condition`. Every conditional statement has a condition that is evaluated\
    \ to `true` or `false`. If it’s true, the code indented underneath in brackets\
    \ the conditional statement is executed. If it’s false generally it’s skipped.\n\
    \nNote in the example shown in figure 4.1, the program responds “You are able\
    \ to drink” only if the user enters a value 21 or greater. Java uses brackets\
