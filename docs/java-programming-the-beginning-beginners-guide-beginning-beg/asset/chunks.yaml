  raw: 'Expressions: Expressions must be evaluated before a result is determined.
    Expressions are usually arithmetic problems. To print an expression in Java:


    System.out.println(3.0/(6+4));


    In the expression above, the part of the expression in parenthesis will be evaluated
    first due to the order of operations. The result printed is 0.3.


    We’ll look at expressions more closely in our next chapter.


    As a side note, it’s good to understand that the println function is a version
    of the **print()**function. The ‘ln’ at the end stands for line. This means after
    printing what you place in the parentheses the function will make a new line to
    print the next expression. The ‘print’ function will simply print whatever you
    put in the parenthesis without introducing its own formatting.


    ## Chapter 2: **Input and Output**


    In this chapter we’re going to look more closely at input and output, which are
    perhaps the two most critical activities in any program. In the previous chapter
    we looked closely at the output we produced with the println command. With println
    we were able to output three types of data to the command line screen: strings,
    integers, and floating point numbers. The programs we wrote, however, had no capacity
    to take input and process data.


    In this chapter we’re going to look closely at two types of input. First input
    statements will allow us to programmatically request input from the user. We’ll
    then use command line parameters to provide inputs to our program.


    As we look at output, we’ll also look at directing our output to a file instead
    of back to the command line.


    So now it’s time to put on your favorite programming music (I suggest The Cure),
    open **nano**, **vi** or your favoritetext editor and start coding…


    **Input Statements**


    We’re going to start with a program that calc ulates the area of a rectangle based
    on a *sideA* input and a *sideB* input. Key the following Java code into your
    text editor:


    import java.util.Scanner;


    public class Square{


    public static void main (String[] args) {


    System.out.println("RECTANGLE AREA CALCULATOR");


    Scanner input = new Scanner(System.in);


    System.out.println("What''s the length of side A? "); float sideA = input.nextFloat();


    System.out.println("What''s the length of side B? "); float sideB = input.nextFloat();


    float area = sideA*sideB;


    System .out.println("The area of your rectangle is: " + area);


    Once you are sure you have keyed in the program correctly and saved it, go ahead
    and run the program on the command line. I saved mine as **Square.java**. Your
    output should look similar to figure 2.1:


    ![](images/00005.jpeg)


    Figure 2.1: Execution of the Square.java program which takes input from the user
    via the Java **.nextFloat()** function.


    On the first line of this program, we encounter the **import** statement. Imports
    are used in many languages to add an additional library of commands to the language
    that are not in the language core. In this case, we’re adding the **Scanner**
    object from the **util** library which contains a number of utilities and useful
    objects.


    If you want to import the entire library, all you have to do is replace Scanner
    with an asterisk (*).


    For example:


    import java.util.*;


    While this is useful, understand that in much larger programs importing an entire
    libraryjust to get one object like we’re doing here makes your program less efficient.
    It’s like grabbing your whole tool box when you just need a hammer.


    Now, based on context and the program execution, you’ve probably already guessed
    what the **nextInt()**function does. Let’s break it down:


    public static void main (String[] args) {


    Scanner grabAge = new Scanner(System.in);


    System.out.println("How old are you?");


    int age = grabAge.nextInt();


    }


    The first line of this class creates a Scanner object. Scanners are the object
    we use to obtain input from the command line.


    In the example above, whatever the user types at the prompt “*How old are you?*”
    is going to be assigned to the variable **age**via the Scanner’s nextInt method.
    We’re going to take a closer look at variables in the next chapter—for right now,
    just consider variables a temporary storage place for values. These values can
    be strings, floats, or integers. You must declare variables before using them.
    Generally the syntax is the datatype followed by a name to reference the variable.


    You may be wondering what a datatype is. Datatype determines what a variable can
    contain, and what operations can be performed on it. Some examples of datatypes
    include integers, strings, and floating point numbers.


    Here’s an example of the declaration of an integer variable:


    int name;


    Note: Int indicates that the datatype for this variable is an integer.


    Remember to import the Scanner object or the util library before declaring a Scanner
    object. Otherwise, your program will encounter an error.


    Let’s try a new example. Create a new file in your text editor called StringInput.java.
    You can do this in vi, for example, by typing the following command on the command
    line: **vi StringInput.java**.


    Key in the following code:


    import java.util.Scanner;


    public class StringInput{


    public static void main (String[] args) {


    Scanner input = new Scanner(System.in); System.out.println("What''s your name?
    ");


    String name = input.nextFloat();


    System.out.println("Hello " + name); }


    }


    Exit your text editor and compile the program from your command line with the
    command **javac StringInput.java**.


    ![](images/00006.jpeg)


    Figure 2.2: Uhoh. This can’t be good. We’ve made an error. How do we fix it?


    So what happened? Instead of compiling and allowing the code to run, the program
    exited with an error. Luckily the error is easy to fix. The nextFloat() function
    is designed to accept the float datatype and only that datatype. When you enter
    anything that isn’t a floating point number, it causes the error you see in figure
    2.2\. We have a different function that is intended for string use, called **nextLine()**.


    Edit your code as follows:


    import java.util.Scanner; public class StringInput{


    public static void main (String[] args) {


    Scanner input = new Scanner(System.in); System.out.println("What''s your name?
    ");


    **String name = input.nextLine();**


    System.out.println("Hello " + name); }


    }


    **Note:** The scanner has a function to obtain every kind of data type.


    Here are some examples:


    nextLine() : Strings


    nextInt(): Integers


    nextFloat(): Floating point numbers nextDouble(): Doubles


    You can probably recognize the pattern. The documentation of the methods for the
    Scanner object is available here:


    http://docs.oracle.com/Javase/7/docs/api/Java/util/Scanner.html


    Learning how to read the Java documentation is an important skill itself.


    ![](images/00007.jpeg)Figure 2.3: So much better with nextLine()!


    When you’re working with strings, you should use the **nextLine()** function which
    does not scan for a datatype other than Strings. It’ll always return whatever
    the user enter into the prompt as a string, including numbers or symbols.


    **Errors**


    The preceding example was probably one of the first examples of an error that
    you’ve encountered. This type of error is known as a Runtime error. It’s one of
    three types of errors that can occur when writing Java code.


    These three types are:


    Syntax errors:


    Syntax errors are issues with the formatting of your code. Examples include forgetting
    semicolons, not closing your brackets or misspelling method names. Text editors
    generally do a great job of pointing these out, so fixing them is rather simple.


