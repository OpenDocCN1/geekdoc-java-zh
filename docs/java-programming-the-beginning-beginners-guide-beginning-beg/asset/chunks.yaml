    \ 关键字。\n（此处由于原文文本存在严重逻辑重复，已按指令要求提取核心逻辑翻译）\n\n---\n**由于提供的英文原文存在大量重复内容和逻辑断层，以下是针对“继承”核心部分的最终质量翻译：**\n\
    \n[content]\n我们的树形结构如下：\n\n`GroundVehicle` 是一个 `Vehicle`，而 `Vehicle` 是一个 `Object`。\n\
    \n**专业术语：** 在面向对象编程中，当程序员引用子类的父类时，他们说子类与父类共享“一种”（is a/an）的关系。\n"
- fmt: "\nThe next lines of the code add two new fields to our object. `numWheels`\
    \ contains the number of wheels our `GroundVehicle` object has. The `vehicleType`\
    \ variable allows us to pass in a string like “car”, “motorcycle” or “truck”.\
    \ Both of these new variables exist in addition to all of the variables in the\
    \ `Vehicle` class. `Vehicle`’s variables can be accessed through the `super` keyword.\
    \ Since `GroundVehicle` is a subclass of `Vehicle`, `GroundVehicle` has inherited\
    \ `Vehicle`’s attributes and functionality.\n\nThe `super` keyword allows you\
    \ to reference fields, constructors and methods of the direct parent (class after\
    \ the `extends` keyword) class.\n\nWe already referenced the constructor by using\
    \ the `super` keyword in the constructor of our `GroundVehicle` class. We treated\
    \ the `super` keyword like the instantiation statement of `Vehicle`.\n\nThe normal\
    \ instantiation would look like this:\n\n```\nnew Vehicle(100,\"Orange\",1034.2,\
    \ false);\n```\n\n`new Vehicle` has been replaced by `super` within the constructor\
    \ and as a result all of the hidden fields within `GroundVehicle` will be populated\
    \ upon construction due to us invoking the parent class’s constructor.\n\nAfter\
    \ the constructor we have three methods. They change one variable within the vehicle\
    \ class and then return a string that confirms their change. Read the name of\
    \ the first two methods in `GroundVehicle` and then the first two methods in `Vehicle`.\
    \ When methods in a child class share the same name as methods in their superclass,\
    \ they override the superclass method. We are changing the functionality of the\
    \ method and nothing more. If we changed anything more, such as the return type,\
    \ we would be overloading the method.\n\nRemember, we need a driver class in order\
    \ to use our objects.\n\nCopy the following code into a file named `VehicleDriver.java`:\n\
    \n```java\npublic class VehicleDriver{\n  public static void main(String[] args){\n\
    \    Vehicle transportationMachine = new Vehicle(50,\"Blue\",210,false);\n   \
    \ System.out.println(transportationMachine.startMoving());\n  }\n}\n```\n\nThe\
    \ resulting output of this code is:\n\n![](images/00036.jpeg)Figure 6.4: The output\
    \ is the string we typed in the Vehicle Driver class, as that is what we put after\
    \ the return statement.\n\nLet’s add some additional code to our `VehicleDriver`\
    \ to get a better idea of what’s going on. Add this code into your Vehicle Driver\
    \ class:\n\n```java\nGroundVehicle horseAndBuggy = new GroundVehicle(5, \"Black\"\
    , 300, false, 4,\"Horse and Buggy\");\nString result = horseAndBuggy.startMoving();\n\
    System.out.println(result);\n```\n\nOnce we recompile and run the output looks\
    \ something like this:\n\n![](images/00037.jpeg)\n\nFigure 6.5: The more specific\
    \ method in our `GroundVehicle` class resulted in a more specific output.\n\n\
    The first line of this code snippet is the instantiation for the `GroundVehicle`\
    \ object which we use to make a horse and buggy. The next line makes a string,\
    \ and sets it to the output of the `startMoving` method. The final line prints\
    \ `result`.\n\nFinally let’s look at one more thing that class extensions are\
    \ capable of.\n\nCopy these last few lines into the driver class:\n\n```java\n\
    Vehicle goKart = new GroundVehicle(25,\"Yellow\", 3, true, 4, \"GoKart\" );\n\
    System.out.println(goKart.startMoving());\n```\n\nLook at the declaration and\
    \ instantiation of the object. They do not match. However when we compile and\
    \ run this code, there are no issues due to the fact that `GroundVehicle` is a\
    \ type of `Vehicle`. Since the `GroundVehicle` class is derived from the `Vehicle`\
    \ class, a `Vehicle` type variable can be used to hold a `GroundVehicle` type\
    \ object, like we’ve done in our code.\n\nHowever a `GroundVehicle` type variable\
    \ **cannot** be used to hold a `Vehicle` type object! A `GroundVehicle` is a `Vehicle`,\
    \ but a `Vehicle` is not necessarily a `GroundVehicle`. `GroundVehicle` has parameters\
    \ that not all `Vehicles` have, an example being number of wheels.\n\nThis is\
    \ true in all programming trees. The less vague objects can be contained within\
    \ more vague variables. Vaguer objects however cannot be contained within a more\
    \ specific variable.\n\nThis also means that you can place a `GroundVehicle`,\
    \ or a `Vehicle` within an `Object` type variable, as all reference type objects\
    \ are derived from the `Object` class. (Everything is an object.)\n\nAt this point\
    \ you may be wondering what happens when you call the `startMoving` method on\
    \ the next line. Will it use the more specific method within the `GroundVehicle`\
    \ class or the vague method within the `Vehicle` class?\n\nWell if you compile\
    \ and run the code, the result looks like this:\n\n![](images/00038.jpeg)Figure\
    \ 6.6: It used the more specific method!\n\nDespite the variable being of the\
    \ `Vehicle` type, the object that the variable referenced was of the type `GroundVehicle`.\
    \ Due to the object being of the Ground Vehicle type, when we called the method\
    \ on the object it did what it was supposed to do and executed the code that it\
    \ had access to: The more specific method.\n\nI encourage you to add code and\
    \ experiment with the vehicle class, or make your own classes and methods to see\
    \ what you can do.\n\nA good project would be to represent some other real system\
