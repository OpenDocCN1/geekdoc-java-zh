  raw: '### Java requires you to identify the types of your variables. When using
    variables of different types together, you may have to explicitly state what type
    of variable you want the answer to be. As a rule of thumb: small variables types
    automatically transfer up, but large variables must manually be casted down.


    This is the hierarchy:


    byte < short < int < long < float < double


    Using an int with a float requires no typecasting. Getting an answer as an int
    with a float and int DOES require you to explicitly cast your variable.


    A final print statement uses the modulus statement in an expression. When you
    run the program with the Java command, the result should appear similar to this:


    ![](images/00013.jpeg)


    Figure 3.3: Java program evaluating several mathematical expressions and outputting
    the result to the console.


    When working with arithmetic in programming, it’s important to keep in mind the
    order of operations. Java will always follow the order of operations when doing
    math. As a result it’s a good idea to make sure that any expressions you formulate
    take into account the order of operations to prevent logic errors.


    ![](images/00014.jpeg)Figure 3.4: Different expressions are evaluated in a Java
    program demonstrating the order of operations.


    Was the result always what you expected? The order of operations determines what
    part of a mathematical expression is evaluated first. Expressions are evaluated
    from left to right generally, but the specific order of operations is:


    1) Parenthesis 2) Exponents


    3) Multiplication 4) Division


    5) Addition


    6) Subtraction


    **NOTE:** Despite multiplication coming before division and addition coming before
    subtraction, Java treats them as though they are on the same level and evaluates
    them left to right.


    A common error made by new programmers is to incorrectly interpret the order of
    operations within a math-related problem. When this happens, a program will still
    run, but often give an incorrect result.


    There are many more advanced mathematics tools available in Java within the Math
    class. Utilizing this class will allow you to round numbers, use exponents, square
    roots, and much more. The documentation is available here:


    http://docs.oracle.com/Javase/7/docs/api/Java/lang/Math.html


    **Working with Strings**


    Manipulating strings is a common task for programmers. Imagine, for example, you’re
    given a list of data where first and last names are combined into a single field.
    Using string manipulation techniques, you’d have to separate them into separate
    fields by extracting data from the string.


    **Java ’s String Methods** will allow you to manipulate strings in every way imaginable.
    You can see the documentation on the String Methods here: http://docs.oracle.com/Javase/7/docs/api/Java/lang/String.html


    Let’s work with a few String Methods. Copy the following program. This program
    demonstrates just a few of the string functions. You don’t have to type the embedded
    comments if you don’t want to. They are just for your reference.


    public class Strings{


    public static void main (String[] args) {


    String phrase = "The quick brown fox jumped over the lazy dogs.";


    //Prints the number of characters in the String System.out.println(phrase.length());


    //Finds the index of the word fox.


    System.out.println(phrase.indexOf("fox"));


    //Replace jumped with a new word.


    System.out.println(phrase.replace("jumped" , "hopped"));


    //Changes case


    System.out.println(phrase.toUpperCase()); System.out.println(phrase.toLowerCase());


    } }


    Once you run the program, you should see a result similar figure 3.5:


    ![](images/00015.jpeg)Figure 3.5: String manipulation result in Java


    As you can see, Java’s string manipulation features are powerful.


    ## Chapter 4: **Conditionals and Loops**


    In the last chapter we took a close look at variables. In this chapter, we’re
    going to use variables again. First, we’ll use variables to make decisions and
    execute branching within our program. Then we’ll use variables to create loops
    that iterate through a portion of code a number of times. Conditionals and loops,
    the two concepts that we haven’t covered up to now, are found in just about every
    programming language. So far, the programs we’ve written are all serial—they go
    through the same steps in the same order each time. With the addition of conditionals
    and loops to our programming repertoire, your programs will be able to vary their
    path based on conditions you set. Sounds like fun, right?


    **Simple Conditionals**


    Let’s start by writing some code. Fire up your development environment and enter
    the following code (Make sure the file and class names match):


    import java.util.*;


    public class Drink{


    public static void main (String[] args) {


    Scanner ageGetter = new Scanner(System.in);


    System.out.println("How old are you?");


    int age = ageGetter.nextInt();


    if(age >= 21){


    System.out.println("You can legally drink!"); }


    }


    }


    Once you’ve entered the program in your text editor, run it three separate times.
    The first time, enter an age older than 21\. The next time you run it, enter an
    age younger than 21\. When you run it one final time, enter 21 exactly. To make
    sure the program runs correctly we want to test all the possible scenarios for
    execution.


    Your output should appear similar to figure 4.1:


    ![](images/00016.jpeg)


    Figure 4.1: Program being tested for three different types of user responses


    This program is pretty straightforward. What’s new is the *if* statement. In this
    case we’re determining if the value the user entered is *greater than or equal
    to* 21\. The portion of the if statement written like this: age>=21 is known as
    the *condition*. Every conditional statement has a condition that is evaluated
    to be *true* or *false*. If it’s true, the code indented underneath and in brackets
    the conditional statement is executed. If it’s false generally it’s skipped.


    Note in the example shown in figure 4.1, the program responds “You are legally
    able to drink” only if the user enters a value 21 or greater. Java uses brackets
    to contain blocks of code, so after you open the bracket make sure you close it
    back up or else your program won’t compile properly. Make sure that you only keep
    the code you want to execute within the brackets of the conditional.


    If the code block that runs if the condition is true extends more than one line,
    please note that each line should be within the brackets of the conditional. It’s
    also good practice to have the same level of indentation below the conditional
    statement. It won’t affect how the code runs, but it makes the code look much
    cleaner. Other programmers reading your code will thank you.


    **What Else?**


    The program we wrote responds only if the conditional is evaluated as true. If
    the conditional is evaluated as false, the user receives no response. This is
    likely confusing for the user. We’re going to add to the program so that it reacts
    one way if the condition is evaluated as true and another way if the condition
    is evaluated as false. Add the indicated code to your class.


    import java.util.*;


    public class Drink{


    public static void main (String[] args) {


    Scanner ageGetter = new Scanner(System.in);


    System.out.println("How old are you?");


    int age = ageGetter.nextInt();


    if(age >= 21){


    System .out.println("You can legally drink!"); }


    ***else{***


    ***System.out.println("You''re not of drinking age."); }***


    }


    }


    After modifying your program code, run through the three possible scenarios as
    you did before. Test a case where the user is under 21, another where the user
    is older than 21, and a final scenario where the user is exactly 21\. Your output
    should appear similar to figure 4.2:


    Don’t forget to save and recompile! ![](images/00017.jpeg)Figure 4.2 Result with
    the else statement added'
