    public String eat(){


    isHungry = false;


    weight += .1;


    return name + " has eaten.\n" + name + " now weighs: "


    + weight + " pounds";


    }


    public String getLength(){


    return name + "''s length is " + length;


    }


    }


    I’ve added yet another property to the Animal class. The name property is designed
    to hold the name of the Animal instance. Keep in mind; this is distinct from the
    name of the code reference to the instance.


    Now let’s update our Animal Driver class to re flect the new functionality.


    Copy this revised code:


    public class AnimalDriver{


    public static void main (String[] args) {


    Animal myDog = new Animal("Sparky","Grey", 17, 56.4, true, true);


    Animal yourDog = new Animal("Rover","Brown", 19, 41.8, true, true);


    System.out.println(myDog.walk()); System.out.println(myDog.eat());


    System.out.println(yourDog.walk()); System.out.println(yourDog.eat());


    System.out.println(yourDog.getLength());


    }


    }


    The original Animal instance myDog has a value of “Sparky” in the name property,
    while the new object has a value of “Rover” in the name property.


    Running the new code should result in output similar to the following:


    ![](images/00035.jpeg)Figure 6.3: Two instances of Animal objects are created—Sparky
    and Rover.


    **Extending Classes**


    The object oriented structure does more than allow us to simply represent objects
    as code in one file. It allows us to build an entire hierarchy of objects to represent
    our real life problem space. Let’s take another look at Vehicles.


    In the world we have numerous types of vehicles. Some work on the ground, some
    work in the water and others in the air. To properly represent a vehicle in an
    object oriented manner, we need to determine what they all have in common. All
    vehicles have a top speed, a weight and a color. All vehicles are either moving,
    or still.


    As a result we can create a new object that contains all of these common attributes,
    so we don’t have to code them each time we want to create a variant of a vehicle.


    Copy the following code, and save it as **Vehicle.java**:


    public class Vehicle{


    int topSpeed;


    String color;


    double weight; boolean isMoving;


    public Vehicle(int setSpeed, String setColor, double setWeight, boolean tellIfMoving){


    topSpeed = setSpeed; color = setColor;


    weight = setWeight;


    isMoving = tellIfMoving;


    }


    public boolean startMoving(){


    isMoving = true;


    return "Vehicle is moving."; }


    public boolean stopMoving(){


    isMoving = false;


    return "Vehicle isn''t moving."; }


    }


    The code above summarizes the basic attribute of vehicles. But if we need to represent
    a car, there is information we need that wouldn’t be relevant if we were representing
    a boat. But we would still need all of the attributes described in the Vehicle
    class. Does this mean we copy all of this code into two different files in just
    to represent these types of vehicles? We could, but that would be inefficient.
    Instead we *extend* the vehicle class.


    By extending the vehicle class, we create what is known as a **child class**.
    The child class inherits the fields, methods and even the constructor of the parent
    (Vehicle in our case) class.


    Open up a new file in your text editor, and save the following code as **GroundVehicle.java**:


    public class GroundVehicle extends Vehicle{


    int numWheels; String vehicleType;


    public GroundVehicle(int setSpeed, String setColor, double setWeight, boolean
    tellIfMoving, int setNumWheels,String type){


    super (setSpeed, setColor, setWeight, tellIfMoving); numWheels = setNumWheels;


    vehicleType = type;


    }


    public String startMoving(){


    isMoving = true;


    return vehicleType + " is driving";


    }


    public String stopMoving(){


    isMoving = false;


    return vehicleType + " isn''t driving"; }


    public String whatColor(){


    return color;


    }


    }


    The first line of this code is slightly different from what you’re used to from
    this chapter. There is the addition of the “extends” keyword followed by Vehicle.
    This notifies Java that GroundVehicle is a child of Vehicle. In other words GroundVehicle
    is derived from Vehicle.


    In Java, all classes, regardless of if they contain the extends keyword, are an
    extension of the Object class. As a result at the top of every hierarchal tree
    sits the Object class.


    Our tree appears as follows:


    GroundVehicle is a Vehicle which is an Object.


    **Talk the Talk:** In object oriented programming when a programmer references
    the parent of a child they say the child class shares an “is a/an” relationship
    with the parent class.'
