    Logic errors:


    These are errors in the actual logic behind the program. They are the most challenging
    errors to fix, because the code isn’t technically wrong, it’s just not giving
    the correct result. Some logical errors go undetected even after the program is
    released. Examples include things like dividing where you should be multiplying,
    printing the wrong output, or opening thewrong file. If you have a logic error,
    you’re having a PICNIC. (Problem In Chair, Not In Computer.)


    **Parameterized Input**


    Your current workflow forces you to compile and then run your code before passing
    input. Including parameters with your Java command passes input and executes your
    code in tandem. The resulting command looks like this:


    $ java ClassName arg1 arg2 arg3


    In the example above, we still use the Java command and the class name of the
    program we’d like to run. We follow the class name with arguments which get sent
    as input to the program. This could be advantageous in situations where we want
    our program to run unattendedlike when we’re crunching numbers. For example, if
    we wanted a program to receive the users name and age as input, the parameters
    might look something like this:


    $ java moreInput Keshav 17 The values “Keshav” and “17”, which are separated by
    a single space, are passed to the program. Let’s see how. Key in the following
    example and save it as **MoreInput.java**:


    public class MoreInput{


    public static void main (String[] args) {


    System.out.println("Your name is: " + args[0]); System.out.println("Your age is:
    " + args[1]);


    System.out.println("All the arguments: ");


    System.out.println(args[0] + ", " + args[1]); }


    }


    Next, let’s run the program and supply command line arguments as input:


    $ java MoreInput Keshav 17 You should get a result similar to the one pictured
    in figure 2.4:


    ![](images/00008.jpeg)Figure 2.4: Command line parameters being processed as input
    on the Koding command line.


    **NOTE:** The terms parameter and argument can be used interchangeably.


    The arguments come into Java numbered sequentially, so in our case, the user’s
    name is argument number zero and the age is argument number one. In code, we call
    these **args[0]** and **args[1],** respectively. If you study the screenshot carefully,
    you may notice something interesting-**args[1]** is *not* the first parameter.


    This is because Java starts counting at 0, rather than 1\. This means that the
    first argument we entered, which in this case was a name, is actually in slot
    0\. As a result Java is often referred to as a zero-indexed language.


    **Output to a Filestream**


    So far the code’s output has only been directed to the command line. This doesn’t
    always have to be the case. Output can be directed to a file for more permanent
    storage. Being able to store data (more or less) permanently is an important skill
    for programmers to learn. Let’s write a program in which we ask the user to enter
    several pieces of data and we then store those in a file.


    Key in the following code:


    import java.io.*;


    import java.util.Scanner; public class Storage{


    public static void main (String[] args) {


    Scanner grab = new Scanner(System.in);


    System.out.println("What''s your name?"); String name = grab.nextLine();


    System.out.println("What''s your email?"); String mail = grab.nextLine();


    System .out.println("What''s your favorite band?");


    String band = grab.nextLine();


    String fname = name.replaceAll(" ","")+".txt";


    try{ PrintWriter saver = new PrintWriter(fname);


    saver .println("Name:" + name); saver.println("Email:" + mail); saver.println("Band:"
    + band); saver.close();


    }


    catch(FileNotFoundException e){ System.out.println("Oh no, it didn''t work!");


    } System.out.println(name + "|" + mail + "|" + band + " has been stored to "+
    name + ".txt."); }


    }


    This is definitely the most complex program we’ve written yet. Go ahead and run
    it on the command line and make sure you don’t get any errors.If you’re having
    issues remember to check the imports. If everything runs correctly, your command
    line should look something like this:


    ![](images/00009.jpeg)


    Figure 2.5: The program stored the data in a file called Keshav **.**txt which
    is now available in the directory listing by using the *ls* command on the command
    line.


    Note: I wrote and saved the file in a separate folder, and needed to navigate
    to where the file was beforehand using the cd (change directory) command.


    While the code for this program is somewhat longer than what you are used to at
    this point, it is still fairly straightforward. When the program runs it prompts
    the user for their name, email, and name of their favorite band. We then create
    a new variable called saver. Saver takes the information the user typed and formats
    it to increase readability. It then prints the information to a file.


    The objects we use to print to a file are located in the Java.io library and we’re
    going to need a couple of objects, so import the whole thing.


    The fname variable , which stores the filename for the file we’re creating, is
    populated bythe variable that holds the user’s first name. When we create the
    new PrintWriter object, we pass in the filename. This is required so the PrintWriter
    knows what to name the file it creates.


    The next part of the program is where the action happens:


    public static void main (String[] args) {


    try{ PrintWriter saver = new PrintWriter(fname);


    saver .println("Name:" + name);


    saver.println("Email:" + mail);


    saver.println("Band:" + band);


    saver.close();


    }


    catch(FileNotFoundException e){


    System.out.println("Oh no, it didn''t work!");


    }


    System .out.println(name + "|" + mail + "|" + band + " has been stored to "+ name
    + ".txt.");


    }


    }


    The first thing we do in the program is create a **PrintWriter**. This is an object
    that allows us to create and then print to raw text (.txt) files. We named it
    saver and pass in the string fname as a parameter. When the writer created our
    file, this string becamethe file’s name. Next we use our PrintWriter object and
    began printing strings to the text file. Finally we closed the object and printed
    to the console that we have created a file with the information that the user
    provided us with.


    Note that this entire process is done within a try-catch statement. A trycatch
    statement is used to handle exceptions, which are events that interfere with the
    execution of your program. In the try block we put code that could possibly cause
    (AKA throw) an exception. In the catch block, we put code that executes if an
    exception is thrown. The parentheses contain the type of exception and the name
    we give it. In thiscase we just print “Oh no, it didn’t work!” in the event that
    we get an exception.


    ![](images/00010.jpeg)


    Figure 2.6 We opened “ Keshav.txt” in the text editor and you can see the data
    that has been written to the disk.


    Congratulations! You’ve written a program that stores data permanently. You are
    well on your way to being a programmer!


    ## Chapter 3: **Variables**


    In the previous chapter, we looked at input and output, which allow us to get
    data into and out of our Javaprogram. In this chapter we’ll take a closer look
    at one of the most important aspects of programming— variables. You may not equate
    variables with computer programming, but you’ve likely been using variables since
    high school if you took courses in Algebra, Chemistry, and Physics. In classic
    “solve for *x*” problems, *x* is a variable.


    Let’s first take a look at how the Java programming environment handles variables.'
