    ## About the Beginning Beginners’ Guide Series


    This Beginning Beginner’s series of books was born out of a frustration: Most
    Beginning books on web and mobile development were not designed for true beginners.


    Often in beginners’ books the language was over complicated and laden with jargon
    that only those with programming experience understand. The books assume too much
    prior knowledge or experience. In the end, many people new to programming gnashed
    their teeth in frustration and gave up.


    The fact is that programming is completely approachable and even fun to learn
    if taught correctly.


    That’s exactly what the Beginning Beginners’ Guide series aims to do: Help true
    beginners learn to code.


    This series of programming books is for you if you’ve never written a line of
    code before—or if you’ve tried to learn from other books unsuccessfully. You CAN
    learn to code well. You don’t have to be mathematically oriented, or uber-intelligent.


    Learning to code won’t always be easy—but it is doable. If you can manipulate
    an Excel spreadsheet, you can learn programming.


    Here’s hoping that the process for you is as rewarding as it is for us to teach.


    Should you have questions or comments, please email me directly at mark@learntoprogram.tv.


    -Mark Lassoff, Founder LearnToProgram Media


