  trans: "\n接下来的几行代码为我们的对象添加了两个新字段。`numWheels` 包含了 `GroundVehicle` 对象的轮子数量。`vehicleType`\
    \ 变量允许我们传入如“car”、“motorcycle”或“truck”之类的字符串。这两个新变量除了 `Vehicle` 类中的所有变量外还额外存在。`Vehicle`\
    \ 的变量可以通过 `super` 关键字进行访问。由于 `GroundVehicle` 是 `Vehicle` 的子类，`GroundVehicle` 继承了\
    \ `Vehicle` 的属性和功能。\n\n`super` 关键字允许你引用直接父类（`extends` 关键字之后的类）的字段、构造函数和方法。\n\n\
    我们已经在 `GroundVehicle` 类的构造函数中使用 `super` 关键字引用了它的构造函数。我们将 `super` 关键字视为了 `Vehicle`\
    \ 的实例化语句。\n\n正常的实例化看起来如下：\n\n```\nnew Vehicle(100,\"Orange\",1034.2, false);\n\
    ```\n\n在构造函数内部，`new Vehicle` 被 `super` 取替，结果是由于我们调用了父类的构造函数，`GroundVehicle` 内部的所有隐藏字段将在构造时被填充。\n\
    \n构造函数之后我们有三个方法。它们改变了车辆类中的一个变量，然后返回一个确认这些更改的字符串。阅读 `GroundVehicle` 中前两个方法的名称，以及\
    \ `Vehicle` 中前两个方法。当子类中的方法与其父类中的方法同名时，它们会重写（override）父类方法。我们只是改变了方法的功能，并没有更多。如果我们更改了任何其他内容，例如返回类型，那就是方法重载（overloading）。\n\
    \n记住，我们需要一个驱动类来使用我们的对象。\n\n将以下代码复制到名为 `VehicleDriver.java` 的文件中：\n\n```java\n\
    public class VehicleDriver{\n  public static void main(String[] args){\n    Vehicle\
    \ transportationMachine = new Vehicle(50,\"Blue\",210,false);\n    System.out.println(transportationMachine.startMoving());\n\
    \  }\n}\n```\n\n这段代码的输出结果是：\n\n![](img/00036.jpeg)图 6.4：输出我们在 Vehicle Driver 类中输入的字符串，因为那是我们放在返回语句之后的内容。\n\
    \n让我们为我们的 `VehicleDriver` 添加一些额外的代码，以更好地了解发生了什么。将此代码添加到你的 Vehicle Driver 类中：\n\
    \n```java\nGroundVehicle horseAndBuggy = new GroundVehicle(5, \"Black\", 300,\
    \ false, 4,\"Horse and Buggy\");\nString result = horseAndBuggy.startMoving();\n\
    System.out.println(result);\n```\n\n一旦我们重新编译并运行，输出看起来像这样：\n\n![](img/00037.jpeg)\n\
    \n图 6.5：我们在 `GroundVehicle` 类中更具体的方法导致了更具体的输出。\n\n这段代码段的第一行是 `GroundVehicle` 对象的实例化，我们用它来制作一辆马车。下一行创建一个字符串，并将其设置为\
    \ `startMoving` 方法的输出。最后一行打印 `result`。\n\n最后，让我们看看类扩展能够做的另一件事情。\n\n将这最后几行复制到驱动类中：\n\
    \n```java\nVehicle goKart = new GroundVehicle(25,\"Yellow\", 3, true, 4, \"GoKart\"\
    \ );\nSystem.out.println(goKart.startMoving());\n```\n\n观察对象的声明和实例化。它们并不匹配。然而，当我们编译并运行这段代码时，并没有问题，因为\
    \ `GroundVehicle` 是 `Vehicle` 的类型。由于 `GroundVehicle` 类派生自 `Vehicle` 类，可以使用 `Vehicle`\
    \ 类型变量来持有 `GroundVehicle` 类型对象，正如我们在代码中所做的那样。**\n\n然而，`GroundVehicle` 类型变量**不能**被用来持有\
    \ `Vehicle` 类型对象！`GroundVehicle` 是一个 `Vehicle`，但 `Vehicle` 不一定是 `GroundVehicle`。`GroundVehicle`\
    \ 具有并非 `Vehicle` 都具备的参数，例如轮子数量。\n\n这在所有编程树中都是如此。不模糊的对象可以包含在更模糊的变量中。然而，模糊的对象不能包含在具体的变量中。\n\
    \n这意味着你可以将 `GroundVehicle` 或 `Vehicle` 放在 `Object` 类型变量中，因为所有引用类型对象都派生自 `Object`\
    \ 类。（一切都是对象。）\n\n此时你可能会疑惑当在下一行调用 `startMoving` 方法时会发生什么。它是使用 `GroundVehicle` 类中更具体的方法，还是\
    \ `Vehicle` 类中模糊的方法？\n\n嗯，如果你编译并运行代码，结果如下：\n\n![](img/00038.jpeg)图 6.6：它使用了更具体的方法！\n\
    \n尽管变量是 `Vehicle` 类型，但该变量引用的对象是 `GroundVehicle` 类型。由于对象是 `GroundVehicle` 类型，当我们对对象调用方法时，它执行了它应该做的事，并执行了它所访问的代码：更具体的方法。\n\
    \n我鼓励你添加代码并对车辆类进行实验，或者创建自己的类和方法来观察你可以做什么。\n\n一个很好的项目是用代码表示某些其他现实系统。本节旨在向你提供关于类和对象的面向对象编程的基础介绍。然而，你会发现这些基础概念可以应用于许多现代编程语言。\n\
    \n本节的结束也标志着本书的终结。你现在掌握了使用 Java 语言编程的基础。无论你继续学习 Java，还是转向其他开发领域（如 Web 应用或移动端），这些信息都对你有帮助。\n\
