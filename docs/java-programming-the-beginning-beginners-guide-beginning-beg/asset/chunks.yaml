    When this program initially runs, the variable *band* is set to an empty string.
    The value of *band*is compared to the string “XXX” each time through the loop.
    If the loop is anything other than “XXX” the loop iterates again. If the value
    is not XXX, the name of the band is echoed back to the console.


    Notice that all of the opening brackets have a companion. If you get lost in code
    that has a number of closing brackets in a row, here’s a trick: There always must
    be the same number of opening and closing brackets in a class– If you have more
    opening brackets try pairing each one off until you where find you’re missing
    closing brackets.


    **Don’t Try This at Home**


    A common error in programming is an endless loop. These endless loops can consume
    more and more computing resources and eventually make the program, or your computer
    crash. Consider the following code:


    public class LetsBreakTheComputer{


    public static void main (String[] args) {


    double x = 1;


    while(0<x){


    System.out.println(x);


    X*=300000; }


    }


    You’ll note that the continuation condition will **always** be true in this example—the
    value of *x* will always be greater than zero. The value of *x* very rapidly gets
    out of hand and, in fact, becomes too big to store in memory. I ran this in the
    Koding.com environment. It took me about 10 minutes to stop the execution of the
    program as koding’s environment was lagging due to the program.


    ![](images/00021.jpeg)


    Figure 4.6: At this point the environment was frozen due to an endless loop. Every
    so often it would print “Infinity” a couple hundred times and then freeze right
    back up.


    You can try this example on your own. I’m not responsible for any damage done.
    (Damage won’t be permanent…have fun!)


    **For loops**


    So we’ve determined that forgetting to put a proper iterator in your while loop
    can be bad for your program. How can we avoid having an endless while loop? The
    answer is a for loop. For loops do the same thing as while loops, however they
    will only execute a set number of times because you are forced to place an iterator
    and variable as part of the loop’s syntax in addition to a conditional. As a result
    it’s extremely difficult to create a for loop that executes endlessly.


    Here’s an example of a very simple for loop. It does the same thing as our first
    loop: Prints 0 to 100, while counting by fives.


    This loop is in a file called Loop3:


    public class Loop3{


    public static void main (String[] args) {


    for(int x = 0; x<100; x+=5){ System.out.println(x); }


    }


    }


    The syntax of the loop is simple. First we have a local variable x that is initialized
    and declared. Local variables cannot be accessed or changed outside of the loop.
    Then, we have a conditional. The conditional fulfills the same purpose as in the
    while loop. When it is no longer true the loop will stop iterating. Finally we
    have what’s known as an iterator. This is a reassignment of the variable you initially
    declared for this loop. The iterator is the reason that it’s generally hard to
    accidently make an endless loop. Note that these three statements are separated
    by semicolons as though they were the end of lines. Here’s the result of executing
    this code:


    ![](images/00022.jpeg)Figure 4.7: The result of the for loop is the same as the
    result of our original while loop.


    ## Chapter 5: **Dealing with Data**


    In the last chapter we examined control structures, conditionals, and loops, which
    are critical in most programming languages. They allow your programs to make decisions
    based on the criteria that you set as the developer. In this chapter, we’re going
    to switch gears and examine data and how it’s stored. We’ll take a close look
    at four data structures: Arrays, ArrayLists, Immutables, and HashTables. You may
    not have given much thought to data before. The easiest way to conceptualize data
    is as organized information.


    Different types of information lend itself to being organized in different ways.
    For example, if your data is a grocery list, then an Array would be the optimal
    way to organize your data. However, if you wanted to store student grades on different
    assignments over a period of time, an Array wouldn’t work well at all. There are
    many different data structures used by programmers and each is optimized for a
    different type of data.


    Let’s start with a simple grocery list.


    **Arrays**


    We’ve all made a grocery list before, but you likely haven’t stored it in Java
    code. Let’s do that now using the following line of code: (Remember to put this
    in your main method!)


    String [] groceries = {


    "oranges","apples","milk","bread","butter","pepp


    er","salt","sugar","pears"


    };


    Unlike variables which store a single unit of data, we’ve stored multiple elements
    in our array. I’m sure you can imagine a number of situations where this could
    be convenient. In this case, all of the *members* or elements of our array are
    strings. This is because we declared our array as a String array. “String” is
    the data type of the array’s members.


    Here is another array to add to your code. This time it’s comprised of double
    values:


    double [] gpas = {


    3.25, 2.26, 1.99, 3.55, 4.0, 3.21, 2.56, 3.06 ,


    2.72


    };


    Now, here’s where arrays become a bit more interesting. Arrays have a number of
    built-in methods that you can use to manipulate them; There are included functions
    that do things like count the members of the list or sort them. You could write
    your own code to do all this, but it would be a lot of work.


    Before we start with the really fancy stuff, let’s take a look at how we extract
    data from the Array. Go ahead and copy the code below. You’re free to skip over
    the comments if you like. Remember to keep the file name and the class name consistent!


    public class Arrays{


    public static void main (String[] args) {


    String[] groceries = {


    "oranges","apples","milk","bread","butt er","pepper","salt","sugar","pears"


    };


    double[] gpas = {


    3.25, 2.26, 1.99, 3.55, 4.0, 3.21, 2.56, 3.06 , 2.72


    };


    System.out.println(groceries[0]); //returns ''oranges''


    System.out.println(groceries[1]); // returns ''apples''


    System.out.println(gpas[3]); // returns ''3.55''


    }


    }


    Once you’re sure that the code is typed correctly in your text editor, execute
    the code with the **Java**command. Don’t forget to compile! Your output should
