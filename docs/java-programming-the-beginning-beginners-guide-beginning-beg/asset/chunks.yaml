    \ is available here:\n\nhttp://docs.oracle.com/Javase/7/docs/api/Java/lang/Math.html\n\
    \n### Working with Strings\n\nManipulating strings is a common task for programmers.\
    \ Imagine, for example, you’re given a list of data where first and last names\
    \ are combined into a single field. Using string manipulation techniques, you’d\
    \ have to separate them into separate fields by extracting data from the string.\n\
    \n**Java ’s String Methods** will allow you to manipulate strings in every way\
    \ imaginable. You can see the documentation on the `String Methods` here: http://docs.oracle.com/Javase/7/docs/api/Java/lang/String.html\n\
    \nLet’s work with a few `String Methods`. Copy the following program. This program\
    \ demonstrates just a few of the string functions. You don’t have to type the\
    \ embedded comments if you don’t want to. They are just for your reference.\n\n\
    ```java\npublic class Strings{\n\npublic static void main (String[] args) {\n\n\
    String phrase = \"The quick brown fox jumped over the lazy dogs.\";\n\n//Prints\
    \ the number of characters in the String \nSystem.out.println(phrase.length());\n\
    \n//Finds the index of the word fox.\nSystem.out.println(phrase.indexOf(\"fox\"\
    ));\n\n//Replace jumped with a new word.\nSystem.out.println(phrase.replace(\"\
    jumped\" , \"hopped\"));\n\n//Changes case\nSystem.out.println(phrase.toUpperCase());\
    \ \nSystem.out.println(phrase.toLowerCase());\n\n} }\n```\n\nOnce you run the\
    \ program, you should see a result similar figure 3.5:\n\n![](images/00015.jpeg)Figure\
    \ 3.5: String manipulation result in Java\n\nAs you can see, Java’s string manipulation\
    \ features are powerful.\n\n## Chapter 4: Conditionals and Loops\n\nIn the last\
    \ chapter we took a close look at variables. In this chapter, we’re going to use\
    \ variables variables again. First, we’ll use variables to make decisions and\
