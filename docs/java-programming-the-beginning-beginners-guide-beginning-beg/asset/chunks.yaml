    ### For loops


    So we’ve determined that forgetting to put a proper iterator in your `while` loop
    can be bad for your program. How can we avoid having an endless `while` loop?
    The answer is a `for` loop. `for` loops do the same thing as `while` loops, however
    they will only execute a set number of times because you are forced to place an
    iterator and variable as part of the loop’s syntax in addition to a conditional.
    As a result it’s extremely difficult to create a `for` loop that executes endlessly.


    Here’s an example of a very simple `for` loop. It does the same thing as our first
    loop: Prints 0 to 100, while counting by fives.


    This loop is in a file called `Loop3`:


    ```java

    public class Loop3{


    public static void main (String[] args) {


    for(int x = 0; x<100; x+=5){ System.out.println(x); }


    }


    }

    ```


    The syntax of the loop is simple. First we have a local variable `x` that is initialized
    and declared. Local variables cannot be accessed or changed outside of the loop.
    Then, we have a conditional. The conditional fulfills the same purpose as in the
    `while` loop. When it is no longer true the loop will stop iterating. Finally
    we have what’s known as an iterator. This is a reassignment of the variable you
    initially declared for this loop. The iterator is the reason that it’s generally
    hard to accidently make an endless loop. Note that these three statements are
    separated by semicolons as though they were the end of lines. Here’s the result
    of executing this code:


    ![](images/00022.jpeg)Figure 4.7: The result of the `for` loop is the same as
    the result of our original `while` loop.


