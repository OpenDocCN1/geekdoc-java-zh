- fmt: "\n```java\nlanguages.add(\"French\");\nlanguages.add(\"English\");\nSystem.out.println(languages.size());\n\
    languages.add(\"German\");\nSystem.out.println(languages.size()); }\n\n}\n```\n\
    \nThe first line in the `main` method declares a new `ArrayList` that we named\
    \ `languages` and gave it a size of three.\n\n**Talk the Talk:** There are several\
    \ ways to say you used a method. The most common terms are ‘call’ or ‘invoke’.\
    \ When I programmer says ‘I invokedthe method’ he or she is really saying they\
    \ used the method.\n\nThe next three lines of code invoke the `add` method to\
    \ fill up the `ArrayList`. Then the `size` method is called to see how large the\
    \ `ArrayList` is. After that one more element is appended to the end of the `ArrayList`,\
    \ increasing the size from the original three slots to four.\n\nWhen you run the\
    \ code, your output should appear something like this:\n\n![](images/00028.jpeg)Figure\
    \ 5.6: We can see how the size of our `ArrayList` increased when we added an element\
    \ to the end.\n\nJava printed two notes in addition to the output of the program.\
    \ This occured because we are using an unparameterized `ArrayList`. An unperamiterized\
    \ `ArrayList` is an `ArrayList` that’s type hasn’t been specified. As a result\
    \ variables of different types can be stored within the same `ArrayList` and cause\
    \ exceptions due to type mismatches.\n\nTo alleviate this issue, we have to type\
    \ our list to take one specific object like arrays do. Rather than a standard\
    \ declaration and instantiation, we add a slight modification to each part so\
    \ it looks like this:\n\n`ArrayList<DataType> name = new ArrayList<DataType>();`\n\
    \n**Talk the Talk:** An unparamaterized ArrayList` accepts what’s known as a generic\
    \ type. A generic type is a type that can be specified later by the programmer\
    \ in order to improve functionality. The type can be anything, including custom\
    \ classes that you implement and design yourself.\n\nLet’s modify the code in\
    \ our `ArrayLists.java` file to follow this practice:\n\n```java\npublic class\
    \ ArrayLists{\n\n    public static void main (String[] args) {\n\n        ArrayList\
    \ <String> languages = new ArrayList<String>(3);\n\n        languages.add(\"Spanish\"\
    );\n\n        languages.add(\"French\");\n\n        languages.add(\"English\"\
    );\n\n        System.out.println(languages.size());\n\n        languages.add(\"\
    German\");\n\n        System.out.println(languages.size()); }\n\n}\n```\n\nNow\
    \ when we recompile and run our code, there’s no problem!\n\n![](images/00029.jpeg)\n\
    \nFigure 5.7: Much better. Typing our `ArrayList` got rid of that pesky warning.\n\
    \nNow the final thing to know about `ArrayLists` is how to obtain data from them.\
    \ Unlike arrays, we don’t reference by indexes. Instead, we use a method to retrieve\
    \ the data: The `.get(#)` method. The number in the parentheses is the index value\
    \ of the element you want to access. Just like `Arrays`, `ArrayLists` are zero-based.\n\
    \nAdd the following line to your code, recompile and run to see it in action:\n\
    \n```java\nSystem.out.println(languages.get(0));\n```\n\nWhen you recompile and\
    \ run, the output should look something like this:\n\n![](images/00030.jpeg)Figure\
    \ 5.8: We got then printed the first element of our `ArrayList`.\n\nThere are\
    \ a number of other methods for `ArrayLists` that are rather useful. The most\
    \ notable being the `.set()` method, which replaces values much like reassigning\
    \ with arrays.\n\nThe official documentation is located here:\n\nhttp://docs.oracle.com/Javase/7/docs/api/Java/util/ArrayList.html\n\
    \n### **Immutables**\n\nImmutables are very similar to `ArrayLists` with one important\
    \ exception: Immutables are non-dynamic. This means once an `Immutable` is defined\
    \ the values within it cannot be changed. Let’s start a new program where we will\
    \ define an `Immutable`.\n\nCopy this code into a file named `ImmutablesDemo.java`:\n\
    \n```java\nimport java.util.*;\n\npublic class ImmutablesDemo{\n\n    public static\
    \ void main (String[] args) {\n        //Note: Arrays cannot be made immutable.\
    \ So instead, we use Lists.\n        String [] turn = {\"600\", \"800\", \"1024\"\
