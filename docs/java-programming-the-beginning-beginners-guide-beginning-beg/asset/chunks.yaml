    Get a job.\");\n        }\n        else if(age < 49){\n            System.out.println(\"\
    Time to start thinking about retirement.\");\n            System.out.println(\"\
    I hope you're putting money away.\");\n        }\n        else if(age < 59){\n\
    \            System.out.println(\"Maintain your health through exercise.\");\n\
