    # 13: Explain MVC architecture.


    Answer:


    MVC represents Model View Controller architecture. The activity performed in MVC
    is explained below:


    - a) In Model, the developer creates the business logic of the system

    - b) In View, the developer creates the presentation logic

    - c) In Controller, the developer receives the request and transfers the response


    # 14: Explain EAR, WAR, and JAR.


    Answer:


    EAR represents Enterprise Archive file. It contains the components of web, EJB,
    and client. All the components are packed in a compressed file called .ear.

    WAR represents Web Archive file. It contains all the components related to the
    web application. All the components are packed in a compressed file called .war.

    JAR represents Java Archive file. It contains all the class files and library
    files which constitute an API (Application Programming Interface). All the components
    are packed in a compressed file called .jar file.


    # 15: Explain JTA, JNDI, and JMS.


    Answer:


    JTA represents Java Transaction API. It is used for coordinating and managing
    transactions across enterprise information system.

    JNDI represents Java Naming Directory Interface. It is used for accessing information
    from directory services.

    JMS represents Java Messaging Service. It is used for receiving and sending messages
    through messaging systems.


    # 16: Explain EDI.


    Answer:


    EDI represents Electronic Data Interchange. It is used for exchanging data through
    Value Added Network (VAN) which acts as the transmission medium.

    EDI is expensive to install and requires customization by the exchanging clients.
    EDI also relies on X12 standards to interchange documents.


    # 17: Explain EAI?


    EAI represents Enterprise Application Integration. This makes one or more applications
    as single application and requires data to be transmitted to the appropriate system
    at the right time.

    For example, while integrating sales and account systems, it is necessary for
    sales to send sales order to accounting to generate invoice. Also, accounting
    must send an invoice to sales to update data for the sales professionals.

    This system handles transaction automatically across application eliminates human
    errors.


    # 18: What is the intent for supporting XML in Java?


    The intent to support XML is to:


    - a) Ensure Java developers understand XML easier and use XML and XML developers
    use Java

    - b) Provide default standard for Java to ensure consistent and compatible implementations

    - c) Ensure java platform can be integrated with high quality


    # 19: What are the protocols used for communicating between business tier and
    user interface?


    The following protocols are used for communicating between business tier and user
    interface:


    - a) HTTP: It denotes ‘Hyper Text Transfer Protocol’

    - b) JMS: It denotes ‘Java Messaging Service’

    - c) RMI: It denotes ‘Remote Method Invocation’

    - d) CORBA: It denotes ‘Common Object Request Broker Architecture’

    - e) DCOM: It denotes ‘Distributed Component Object Model’


    # Java / J2EE Interview Questions You''ll Most Likely Be Asked


    # 20: What are the advantages and disadvantages of HTTP protocol?


    Answer:


    The following are the advantages of HTTP protocol:


    - a) Stateless and firewall friendly

    - b) Easier to load balance and scale HTTP servers


    The following are the disadvantages of HTTP protocol:


    - a) Difficult to maintain user sessions

    - b) Limited communication with JSP and servlets


    # 21: Explain JRMP.


    Answer:


    JRMP represents Java Remote Method Object Protocol. This is used by Remote Method
    Invocation (RMI) to pass java objects as arguments.


    Since Java relies on Object Serialization which marshal objects as stream, RMI
    relies on the protocol JRMP to transfer objects from one JVM (Java Virtual Machine)
    to another.


    # 22: What are the advantages and disadvantages of CORBA?


    Answer:


    The following are the advantages of CORBA:


    - a) Supports heterogeneous object

    - b) Extends the capabilities of ORB (Object Request Broker)


    The following are the disadvantages of CORBA:


    - a) Objects cannot be passed, only arguments can be passed

    - b) Accepted types of data can only be passed


    # 23: Explain DCOM.


    Answer:


    DCOM represents Distributed Component Object Model. This uses ORPC (Object Remote
    Procedure Call) protocol to support remote objects.


    ORPC is built on top of RPC (Remote Procedure Call) and interact with runtime
    services. DCOM supports multiple interfaces and the components can be created
    in various programming languages. Example of languages are: Java, C, Visual Basic,
    etc. DCOM is widely used in windows platform.


    # 24: Explain the capabilities of J2EE architecture.


    Answer:


    The following are the capabilities of J2EE architecture.


    - a) **Performance**: performs functionality in a short time frame

    - b) **Scalability**: Supports even if the load on the server increases

    - c) **Availability**: The system is always accessible across 24 * 7

    - d) **Flexibility**: Change in hardware or architecture does not impact the system

    - e) **Security**: the information cannot be hacked and modified

    - f) **Reusability**: the component created for a system can be reused and save
    development time


    # 25: Explain System architecture and Reference architecture.


    Answer:


    System architecture represents the architecture as product. This comprises the
    component functions, interfaces of the proposed system, constraints, and interactions.
    This is the base for application design implementation.


    Reference architecture represents architecture as method or style. For a specific
    domain, reference architecture refers coherent design principle.


    # Applicability and Best Practices


    # 26: Explain Best Practice.


    Answer:


    Best Practice can be defined as follows:


    - a) Technique that drives your design at component level

    - b) Process recognized by the fellow members who work on similar project

    - c) Takes design or system requirement into consideration

    - d) Applicable to the entire development cycle


    # 27: Explain the JEE tiers.


    Answer:


    J2EE has the following tiers:


    - a) Client Tier: It represents the browser from which request is sent to the
    server. The interfaces used in this tier are HTML, java application, an applet,
    or a non-java application.

    - b) Middle Tier: It comprises of presentation tier, business tier, integration
    tier. The user interface is created in the presentation tier using JSP. The business
    logic is written in the business tier using EJB. The database objects are created
    in the integration tier.

    - c) Backend: This constitutes Enterprise Information System (EIS) which is used
    to store data.


    # 28: What are the best practices to be followed in the presentation layer?


    Answer:


    The best practices to be followed in the presentation layer are explained below:


    - a) Separate Text Markup Language (HTML) from java

    - b) Always write business logic in a Bean class

    - c) Use JSP templates and comments

    - d) Use Model View Controller (MVC) Pattern

    - e) Use custom libraries and tag handlers


    # 29: What type of components is used in MVC?


    Answer:

    MVC represents Model View Controller. The component used in Model, View, and Controller
    is explained below:


    - An application represents the Model which constitutes the system’s state. The
    systems state is created as business logic in a Bean class

    - The user interface represents the View which is created using Java Server Pages

    - The request received from the client is always the controller which is created
    using Servlets


    # 30: What are the requirements that a J2EE system must possess to operate in
