    - b) java.security.interfaces: It contains the interfaces for encryption: Digital
    Signature Algorithm (DSA) and Rivest, Shamir, Adleman Asymmetric Cipher Algorithm
    (RSA)

    - c) java.security.cer: It contains the interfaces and classes for managing and
