    \ destroy bean instance\n- find(): This method is used by client to locate a bean\
    \ and retrieve data\n\n# 104: Explain EJBObject interface.\n\nAnswer:\n\nThe access\
    \ to business methods are provided by the EJBObject interface.\n\nThis interface\
    \ also acts as a wrapper and allows the EJB container to manage and control the\
