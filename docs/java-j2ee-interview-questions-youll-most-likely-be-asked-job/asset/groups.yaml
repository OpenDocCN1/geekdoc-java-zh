    \nAnswer:\n\nWe can create stateful session bean as follows:\n```java\nimport\
    \ java.rmi.*;\nimport javax.ejb.*;\n\npublic class MySFSBean implements SessionBean\
    \ {\n    private SessionContext context;\n    private int iCount;\n\n    public\
    \ void ejbCreate() {}\n    public void ejbActivate() {}\n    public void ejbPassivate()\
    \ {}\n    public void ejbRemove() {}\n    public void create(int iParam) {\n \
    \       this.iCount = iParam;\n    }\n    public int size() {\n        return\
    \ iCount;\n    }\n}\n```\n\nIn the above code, the stateful session bean is created\
    \ by the EJB container.\n\n## # 138: What are accessor methods?\n\nAnswer:\n\n\
    Accessor methods are used to get or set the values of the bean. For example:\n\
    - getName()\n- setName(String name)\n\n## # 139: Explain Entity.\n\nAnswer:\n\
    Entity is an object that represents a row in a database table. It has a unique\
    \ identity and is persisted by the EJB container. The entity bean provides access\
    \ to the data through the EntityContext.\n\n## # 140: Explain getJBHome, getJBLocalHome,\
    \ and getCallerPrincipal.\n\nAnswer:\n- getJBHome(): The remote home interface\
