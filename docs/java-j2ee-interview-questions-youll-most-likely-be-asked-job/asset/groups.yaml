    and to perform self-sufficiently. Give examples of necessary questions that you
    asked, and specify how you determined whether a question was something you needed
    to ask of a supervisor or whether it was something you could determine on your
    own.


    # 15: Tell me about a time when you were in charge of leading a project.


    Answer:


    Lead the interviewer through the process of the project, just as you would have
    with any of your team members. Explain the goal of the project, the necessary
    steps, and how you delegated tasks to your team. Include the results, and what
    you learned as a result of the leadership opportunity.


    # 16: Tell me about a suggestion you made to a former employer that was later
    implemented.


    Answer:


    Employers want to see that you''re interested in improving your company and doing
    your part – offer a specific example of something you did to create a positive
    change in your previous job. Explain how you thought of the idea, how your supervisors
    received it, and what other employees thought the idea was put into place.


    # 17: Tell me about a time when you thought of a way something in the workplace
    could be done more efficiently.


    Answer:


    Focus on the positive aspects of your idea. It is important not toဆောင် your old
