    # Java / J2EE Interview Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    # Architectures and Protocols


    ## 1: What are the design goals of J2EE architecture?


    The following are the design goals of J2EE architecture:


    - a) Service Availability: The application should be available 24 * 7. The business
    depends on the application without the need for customer service representatives

    - b) Data Connectivity: The application should be able to connect to mainframe
    systems and other legacy systems to ensure business functions as usual

    - c) Accessibility: User should be able to connect the application from anywhere
    and from any electronic devices

    - d) User Interaction: The user should be able to connect the application from
    desktop, laptop, PDA, and mobile

    - e) Flexibility: The architecture should be created in such a way that the developer
    just concentrates on the business component model (business logic) and the rest
    of the services are handled by the server


    ## 2: What are the roles of J2EE Architect?


    The following are the roles of J2EE architect:


    - a) Visualizing the behavior of the system blue print

    - b) Creating the system blue

    - c) Defining the way how the system elements work together

    - d) Defining non-functional and functional requirements

    - e) Integrating non-functional requirements into the functional system


    ## 3: What is the difference between architecture and design?


    Architecture defines the structural issues, communication protocols, data access,
    synchronization, and subsystems’ classification. It also defines the architectural
    design of the component interfaces.


    In Design, we define the components to be created for each interface, the inputs,
    the outputs, algorithms, and data structures. In short, the designers describe
    each component''s internal details.


    ## 4: What are the activities performed in Architectural Analysis? Answer:


    The following activities will be performed in Architectural Analysis:


    - a) Use case diagram: This is developed to depict the high level system functionality

    - b) Class Diagram: This is developed to depict the functionality as classes and
    methods

    - c) Collaboration Diagram: This is developed to depict how each class talk to
    each other

    - d) Sequence Diagram: This is developed to depict the operation sequence


    ## 5: What are the activities performed in Architectural Design? Answer:


    The following activities will be performed in Architectural Design:


    - a) The framework (example: Remote Method Invocation) to be used will be decided

    - b) The software and hardware requirements are defined

    - c) The performance parameter and the approach to achieve will be defined

    - d) Analyze for reusing existing components or technology

    - e) Define the business logic, security, and performance of the system


    ## 6: What are the activities performed in the object oriented design? Answer:


    The following activities will be performed in object oriented design:


    - a) Decide on how classes interact with packages

    - b) Create dependency

    - c) Create deployment diagrams

    - d) Decide if the components reside in deployment


    ## 7: What are the components of multi-tier architecture? Answer:


    The following are the components of multi-tier architecture:


    - a) Presentation Tier: The front end component is present in this tier which
    is used to display the presentation

    - b) Resource Tier: The back end component is present in this tier which is used
    to communicate with database

    - c) Business Tier: The component present in this tier is used to provide business
    logic


    ## 8: What are the advantages of multi-tier client server architecture? Answer:


    The following are the advantages of multi-tier client server architecture:


    - a) Changes to business logic or user interface can be made independently

    - b) The client accesses data without knowing where data comes from and how many
    servers are available

    - c) The DB (database) connections can be pooled so that the data can be shared
    for several users without making DB request for each user

    - d) The middle tier component (business logic) can be written in any standard
    programming languages such as C or Java


    ## 9: What are the responsibilities of the developer? Answer:


    The following are the responsibilities of the bean developer:


    - a) Write the systems business logic in java

    - b) Integrate java components with third party components

    - c) Control access and set transaction parameters

    - d) Create home interface to find the beans and remote interface to create business
    logic

    - e) Create the deployment descriptor xml


    ## 10: What are the responsibilities of application assembler? Answer:


    The following are the responsibilities of application assembler:


    - a) Build presentation layer i.e., user interface

    - b) Specify the requirements of transaction management

    - c) Set transaction parameters for all the bean’s methods

    - d) Define security roles and assign permissions

    - e) Specify wild character (*) to the methods


    ## 11: What are the responsibilities of bean deployer? Answer:


    The following are the responsibilities of bean deployer:


    - a) Map fields to DB (database) columns and manage persistence

    - b) Define users, groups, roles, and manage security

    - c) Use the deployment tools and generate wrapper classes

    - d) Map user roles and groups

    - e) Ensure all the deployed bean is assigned a transaction parameter


    ## 12: What are the roles of third party software in EJB framework? Answer:


    The third party companies that provide the software can play any of the following
    three roles:


    - Component Provider: Responsible for developing object modeling, programming,
    architecture, and business process

    - Container Provider: Responsible for proving the environment during runtime to
    the server

    - Application Server Provider: Responsible for providing platform to develop distributed
    applications. It usually contains the container which provides the runtime environment

