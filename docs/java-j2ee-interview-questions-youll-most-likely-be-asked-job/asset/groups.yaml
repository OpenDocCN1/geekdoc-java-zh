    # Java / J2EE 面试题


    回顾这些典型的面试题，并思考你会如何回答它们。阅读列出的答案；你将找到最佳答案以及相关的策略和建议。


    # 架构与协议


    ## 1: J2EE 架构的设计目标是什么？


    以下是 J2EE 架构的设计目标：


    - a) 服务可用性：应用程序应保持 24 *7* 小时可用。业务依赖应用程序，而不需要客户代表。

    - b) 数据连接：应用程序应该能够连接到主机系统和其他遗留系统，以确保业务功能正常进行。

    - c) 可访问性：用户应该从任何地方、通过任何电子设备连接应用程序。

    - d) 用户交互：用户应该能够从桌面电脑、笔记本电脑、PDA 和移动设备连接应用程序。

    - e) 灵活性：架构的设计方式应让开发者专注于业务组件模型（业务逻辑），而其他服务由服务器处理。


    ## 2: J2EE 架构师的角色是什么？


    以下是 J2EE 架构师的角色：


    - a) 系统蓝图行为的可视化

    - b) 创建系统蓝图

    - c) 定义系统元素如何协同工作

    - d) 定义非功能性需求和功能性需求

    - e) 将非功能性需求集成到功能系统中


    ## 3: 架构和设计之间有什么区别？


    架构定义了结构问题、通信协议、数据访问、同步以及子系统的分类。它还定义了组件接口的架构设计。


    在设计中，我们为每个接口定义要创建的组件、输入、输出、算法和数据结构。简之，设计者描述了每个组件的内部细节。


    ## 4: 架构分析中执行哪些活动？答案：


    在架构分析中将执行以下活动：


    - a) 用例图：开发此以描述高层系统功能。

    - b) 类图：开发以此以类和方法的形式描述功能。

    - c) 协作图：开发以此描述每个类之间如何通信。

    - d) 时序图：开发以此描述操作序列。


    ## 5: 架构设计中执行哪些活动？答案：


    在架构设计中将执行以下活动：


    - a) 决定将使用的框架（例如：远程方法调用 RMI）。

    - b) 定义软件和硬件需求。

    - c) 定义性能参数和实现方法。

    - d) 分析是否复用现有组件或技术。

    - e) 定义系统的业务逻辑、安全和性能。


    ## 6: 面向设计中执行哪些活动？答案：


    在面向对象设计中将执行以下活动：


    - a) 决定类如何与包交互。

    - b) 创建依赖关系。

    - c) 创建部署图。

    - d) 决定组件是否存在于部署中。


    ## 7: 多层架构的组件有哪些？答案：


    以下是多层架构的组件：


    - a) 表现层：该层存在前端组件，用于展示表现内容。

    - b) 资源层：该层存在后端组件，用于与数据库通信。

    - c) 业务层：该层存在的组件用于提供业务逻辑。


    ## 8: 多层客户端/服务器架构的优势是什么？答案：


    以下是多层客户端/服务器架构的优势：


    - a) 可以独立对业务逻辑或用户界面进行修改。

    - b) 客户端在不知道数据来源和有多少台服务器的情况下访问数据。

    - c) 数据库连接可以池化，以便多个用户共享，而无需为每个用户请求数据库。

    - d) 中间层组件（业务逻辑）可以使用任何标准编程语言（如 C 或 Java）。


    ## 9: 开发者的责任是什么？答案：


    以下是开发者的责任：


    - a) 使用 Java 编写系统业务逻辑。

    - b) 将 Java 组件与第三方组件集成。

    - c) 控制访问并设置事务参数。

    - d) 创建查找 bean 的本地接口和创建业务逻辑的远程接口。

    - e) 创建部署描述。


    ## 10: 应用组装器的责任是什么？


    以下是应用组装器的责任：


    - a) 构建表现层，即用户界面。

    - b) 指定事务管理的需求。

    - c) 为所有 bean 方法设置事务参数。

    - d) 定义安全角色并分配权限。

    - e) 为方法指定通配符 (*)。


    ## 11: Bean 部署器的责任是什么？答案：


    以下是 Bean 部署器的责任：


    - a) 将字段映射到数据库列并管理持久化。

    - b) 定义用户、组、角色并管理安全。

    - c) 使用部署工具并生成包装类。

    - d) 映射用户角色和组。

    - e) 确保所有部署的 bean 都分配了事务参数。


    ## 12: 第三方软件在 EJB 框架中扮演什么角色？答案：


    提供软件的第三方公司可以扮演三个角色之一：


    - 组件提供者：负责对象建模、编程、架构和业务过程。

    - 容器提供者：负责在运行时提供环境。

    - 应用服务器提供者：负责提供开发分布式应用程序的平台。它通常包含提供运行时环境的容器。


