    # 32: Explain Guideline.


    Answer:


    Guideline refers to rule or agreement on operations which are developed by the
    professionally recognized organization or associations. It also includes approved
    formal proprietary standards to be followed during the project activities. Example
    for a Guideline is: Analysts attempting to maximize content to reduce network
    traffic.


    # 33: What are the best practices to be followed in VO?


    Answer:


    VO represents Value Object. The best practices to be followed in Value Objects
    are explained below:


    -   a) VO should contain business objects with get and set methods

    -   b) VO should update the model bean object with the respective value

    -   c) VO should not reference an object on the server

    -   d) VO should represent a value from the server


    # 34: What are the best practices to be followed in session bean façade?


    Answer:


    The following are the best practices to be followed in session bean façade:


    -   a) It should reduce remote call to the application server

    -   b) Apply transactional scope to methods which calls entity bean group

    -   c) Simplify the client tier so that business logic gets executed only on the
    application server

    -   d) Coding should be done in such a way that it identifies permissions and
    provide flexibility and reusability


    # 35: What are the benefits of Model View Controller (MVC)?


    Answer:


    The following are the benefits of MVC:


    -   a) Separates data model from user interaction and data display and clarifies
    application design

    -   b) Allows viewing data in many forms and by large number of users

    -   c) Enhances reusability by separating functionality from presentation

    -   d) Increases flexibility and improves extensibility

    -   e) Encapsulates application functions and facilitates maintenance

    -   f) Supports incremental updates and divides deployment


    # 36: What are the design problems with MVC?


    Answer:


    The following are the MVC design problems:


    -   a) Components are not aware about the other components'' details of implementation

    -   b) Latency issues and communication volumes have to be handled carefully which
    otherwise result in a scalability issue in distributed systems

    -   c) MVC is difficult to maintain if the Model is unstable because controller
    is mostly written based on the Model


    # 37: Explain the applicability of MVC.


    Answer:


    MVC has to be used for the following cases:


    -   a) If the application is large enough and distributed

    -   b) If the application has a longer life time

    -   c) Portability of interface and back end are most important

    -   d) For easy maintenance and reusability

    -   e) Development of application by multiple developers

    -   f) View data and manipulate them in multiple ways


    # 38: Explain the importance of patterns in J2EE framework.


    Answer:


    Patterns refer to a recurring solution for a business problem in a particular
    context. Context refers to the situation or environment in which the problem exists.
    A problem is something that requires investigation and has to be solved and it
    is specified by cause and effect.


    # 39: Explain Framework patterns.


    Answer:


    The following are called the Framework patterns.


    -   a) Proxy pattern: The EJB remote interface is an example of Proxy pattern.
    It has methods which delegate method calls to objects

    -   b) Factory Method: EJB Home Interface is an example of Factory method. It
    has an independent reusable class which refers objects through a common interface

    -   c) Abstract Factory Method: EJB home interface is an example of abstract factory
    method. It is a procedure to create abstract class instances from concrete subclasses

    -   d) Decorator: EJBObject is an example of Decorator pattern. The functionality
    of the decorator is that it is visible to the clients


    # 40: What are the activities of the deployer?


    Answer:


    The deployer performs the following activities:


    -   a) Stage the Enterprise Archive (EAR) file which is created in the development
    phase into the J2EE application server

    -   b) Modify the deployment descriptor and configure the J2EE application

    -   c) Ensure the Enterprise Archive file (EAR) is well formed and complies with
    J2EE specification

    -   d) Install or deploy the Enterprise Archive file in the J2EE application server


    # 41: What are the patterns that belong to Integration Tier?


    Answer:


    The following patterns belong to Integration Tier:


    -   a) DAO: The Data Access Object retrieves data sources and delivers transparent
    data access

    -   b) Service Activator: This is utilized for EJB components and supports asynchronous
    processing


    # 42: What are Presentation Tier patterns.


    Answer:


    The following are the Presentation Tier patterns:


    -   a) Front Controller: This is used for handling and managing the request from
    client

    -   b) Decorating Filter: This is used for preprocessing and post processing of
    a particular request

    -   c) Composite View: This is used to create a view for sub components

    -   d) Dispatch View: This is used in coordination with Front Controller to view
    helper patterns and defer activities for viewing the processing

    -   e) View Helper: This is used to encapsulate the logic and format the presentation


    # 43: Explain Business Tier patterns.


    Answer:


    The following are the Business Tier patterns:


    -   a) Session Facade: This hides the complexity of business object and centralizes
    the handling of workflow

    -   b) Value Object: This is used to exchange data among different tiers

    -   c) Service Locator: This is used to hide the service complexity and lookup

    -   d) Business delegate: This is used to separate service tier and presentation
    tier

    -   e) Value Object Assembler: This is used to build


    # 44: Explain EIS.


    Answer:


    EIS represents Enterprise Information System. It is present in the Integration
    tier and supports infrastructure related to the enterprise. Accessing EIS is very
    complex and it requires the following:


    -   a) Information related to Transaction

    -   b) Information related to Security, and

    -   c) Knowledge on Application Programming Model


    # 45: What are the system level contracts of EIS and application server?


    Answer:


    The following are the system level contracts of EIS and application server:


    -   a) The contract ‘Connection Management’ lets the application and J2EE components
    connect to EIS. This leads to a scalable environment and supports many client
    to access access

    -   b) The contract ‘Transaction Management’ supports transaction related access
    to EIS. This uses the transaction manager to manage transactions


    # 46: Explain the Resource Adapter.


    Answer:


    The resource adapter is the system level contract for Enterprise Information System
    (EIS). This is utilized by application client or server to connect with EIS. It
    collaborates with application server to support security, transaction, and connection
    pooling. It is used within the application server’s address space.


    # 47: Explain data caching.


    Answer:


    Data caching features are explained below:


    -   a) Caching reduces the network connection trips required for the application

    -   b) It minimizes the shared memory required for the application

    -   c) It reduces the data lookup time

    -   d) It removes memory leaks

    -   e) It ensures caching implemented in development environment simulates deployment
    or production environment


    # 48: Explain Service locator.


    Answer:


    To access common services like JMS factories, EJB objects, data sources, etc.,
    which lies within J2EE, service locator is used. The service locator uses Java
    Naming Directory Interface (JNDI) API which requires initial context object. This
    lookup the desired service and transfer the same to the requester.


    # 49: Explain how to prevent performance problems.


    Answer:


    Performance problems can be prevented by the following ways:


    -   a) If the service requires only local access, then never use EJB object but
    just use java object

    -   b) If you want one bean to access another within the same bean container and
    Virtual Machine, then use local interfaces

    -   c) Use single remote call and combine all data instead of multiple remote
    calls

    -   d) Modify unnecessary variable and control serialization

    -   e) To avoid JNDI lookup, cache EJBHome reference


