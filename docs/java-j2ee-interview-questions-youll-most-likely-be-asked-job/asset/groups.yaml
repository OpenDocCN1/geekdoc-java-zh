    \ to accept the encoding as below:\n\n```java\nString myEncoding = request.getHeader(\"\
    Accept-Encoding\");\n```\n\nThen, we have to set the encoding in the browser as\
    \ below:\n`response.setHeader(\"Content-Encoding\", \"gzip\");`\n\nThis way of\
    \ displaying compressed contents results in saving lots of download time.\n\n\
    ## 61: Explain status codes.\n\nAnswer:\n\nFor each HTTP (Hyper Text Transfer\
    \ Protocol) request, the servlet sends a status code and a message from the server.\
    \ The status code is a number which represents whether the response from the server\
    \ is successful or not.\n\nSo, if the servlet gets a response from the server,\
    \ then, in the header, the server will send the status code as 200 and message\
    \ as OK.\n\n## 62: Explain the meaning of status code 200 and 404.\n\nAnswer:\n\
    If the servlet gets a response from the server, then, in the header, the server\
    \ will send the status code as 200 and message as OK.\nIf the servlet does not\
    \ exist, the server will set the status code as 404. By default, the message will\
    \ be File Not Found.\n\n## 63: Explain sendRedirect method.\n\nAnswer:\n\nThe\
    \ sendRedirect method accepts URL (Uniform Resource Locator) as an argument as\
    \ shown below:\n`response.sendRedirect(myURL)`\n\nThe sendRedirect method forwards\
    \ the client from one page to another and sets the status code as 302.\n\n## 64:\
    \ How can we display an error message if a particular page is not available?\n\
    \nAnswer:\n\nIf the requested page or servlet is not available, the server returns\
    \ the status code 404.\nFor example:\n```java\nString myName = request.getParameter(\"\
    user_name\");\nif(myName == null)\n    response.sendError(response.SC_NOT_FOUND,\
    \ \"user_name is null\");\n```\n\nIn the above code, sendError method is used\
    \ to send the message the parameter is null.\n\n## 65: What are the methods used\
    \ to set header values?\n\nAnswer:\n\nThe following are the methods which are\
