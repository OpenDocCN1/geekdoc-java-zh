    # ### 11: What do you believe is the most important quality a leader can have?


    **Answer:**


    There are many important skills for a leader to have in any business, and the
    most important component of this question is that you explain why the quality
    you choose to highlight is important. Try to choose a quality such as communication
    skills, or an ability to inspire people, and relate it to a specific instance
    which you displayed the quality among a team of people.


    # ### 12: Tell me about a time when an unforeseen problem arose. How did you handle
    it?


    **Answer:**


    It is important that you are resourceful, and level-headed under pressure. An
    interviewer wants to see that you handle problems systematically, and that you
    can deal with change in an orderly process. Outline the situation clearly, including
    all solutions and results of the process you implemented.


    # ### 13: Can you give me an example of a time when you were able to improve X
    objective at your previous job?


    **Answer:**


    It is important here to focus on an improvement you made that created tangible
    results for your company. Increasing efficiency is certainly a very important
    element in business, but employers are also looking for concrete results such
    as increased sales or cut expenses. Explain your process thoroughly, offering
    specific numbers and evidence wherever possible, particularly in outlining the
    results.


    # ### 14: Tell me about a time when a supervisor did not provide enough direction
    on a project.


    **Answer:**


    While many employers want their employees to follow very specific guidelines without
    much decision-making power, it is important also to be able to pick up a project
    with vague direction'
