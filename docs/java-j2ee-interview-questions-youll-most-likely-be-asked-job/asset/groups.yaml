    \ to identify the entity bean object with the unique primary key object from the\
    \ home interface.\n\n```\nMyRemoteHome myHome = (MyRemoteHome)\njavax.rmi.PortableRemoteObject.narrow(initialContext.lookup(\"\
    java:obj/book\"),\nMYRemoteHome.class);\n```\n\nBook book = myHome.findByPrimaryKey(\"\
    91-7822-323-6\");\n\nThe above example demonstrates how findByPrimaryKey is used\
    \ by developer to retrieve data.\n\n## # 131: What are the states of Entity bean\
    \ life cycle?\n\nAnswer:\nThe following are the states of entity bean life cycle:\n\
    \n- **Null state**: In this state, the instance of the bean does not exist\n-\
    \ **Pooled state**: In this state, the instance of the bean exists but it is not\
    \ associated with any entity bean object\n- **Ready state**: In this state, the\
    \ instance of the bean is associated with the entity bean object and it has an\
    \ identity\n\n## # 132: What are the methods invoked by the container entity bean\
    \ life cycle?\n\nAnswer:\nThe following methods are invoked during the entity\
    \ bean life cycle:\n\n- **ejbActivate()**: This method is invoked when the bean\
    \ instance is ready and associated with the entity bean object from the pool\n\
    - **ejbLoad()**: The container use this method to invoke data from the data source\n\
    - c) **ejbStore()**: This method is used by the container to store data persistently\
    \ in the data resource\n- d) **ejbRemove()**: The instance associated with the\
    \ bean is removed with the help of this method and is invoked by the home interface\
    \ or remote interface\n- e) **ejbPassivate()**: This method is used by the EJB\
    \ container to disassociate the bean instance from the EJB object and send to\
    \ the pool.\n\n## # 133: What are the uses of entity beans?\n\nAnswer:\n\nThe\
    \ following are the uses of entity beans:\n\n- a) To model domain objects with\
    \ unique identity which are shared by multiple clients\n- b) To enforce data integrity\
    \ and persistence\n- c) To model records in a data source and not to maintain\
    \ conversations with the client\n- d) Used either in BMP (Bean Managed Persistence)\
    \ or in CMP (Container Managed Persistence)\n- e) To cache data and thereby reuse\
    \ data and prevent frequent database connections\n\n## # 134: What are the elements\
    \ specified in the deployment descriptor?\n\nAnswer:\n\nThe following elements\
    \ are specified in the deployment descriptor:\n\n- a) **session**: Define the\
    \ bean as session bean instead of entity bean\n- b) **session-type**: We can define\
    \ the session as stateless or stateful\n- c) **enterprise-beans**: Using this,\
    \ we can declare the bean as session bean or as an entity bean\n- d) **ejb-name**:\
    \ This is used to specify the unique name for a session or an entity bean\n- e)\
    \ **ejb-jar**: This is the root element of the deployment descriptor\n- f) **ejb-class**:\
    \ This is used to specify the enterprise bean class\n- g) **home**: This is used\
    \ to specify the enterprise bean's interface\n- h) **remote**: This is used to\
    \ specify the enterprise bean's remote interface\n- i) **transaction-type**: This\
    \ is used to specify if the transaction is performed by the EJB container or enterprise\
    \ bean.\n\n## # 135: Explain how to create home interface for stateful session\
    \ bean.\n\nAnswer:\n\nWe can create home interface for stateful session bean as\
