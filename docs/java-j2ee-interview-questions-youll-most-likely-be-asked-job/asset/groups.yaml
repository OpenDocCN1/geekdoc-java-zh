    # 32: 解释指南（Guideline）。


    答案：


    指南是指由专业公认的组织或协会开发的关于操作的规则或协议。它还包括在项目活动期间需要遵守的已批准的正式专有标准。指南的示例是：分析师尝试通过最大化内容来减少网络流量。


    # 33: VO（值对象）中应该遵循哪些最佳实践？


    答案：


    VO 代表值对象（Value Object）。值对象中应遵循的最佳实践解释如下：


    -   a) VO 应该包含带有 get 和 set 方法业务对象

    -   b) VO 应该用相应的值更新模型 bean 对象

    -   c) VO 不应该引用服务器上的对象

    -   d) VO 应该代表来自服务器的数值


    # 34: 会话 bean 面面（session bean façade）中应该遵循哪些最佳实践？


    答案：


    以下是会话 bean 面面中应遵循的最佳实践：


    -   a) 它应该减少对应用程序服务器的远程调用

    -   b) 对调用实体 bean 组的方法应用事务范围（transactional scope）

    -   c) 简化客户端，使业务逻辑仅在应用程序服务器上执行

    -   d) 代码编写方式应该识别权限并提供灵活性和重用性


    # 35: 模型视图控制器（MVC）有哪些优点？


    答案：


    以下是 MVC 的优点：


    -   a) 将数据模型与用户交互及数据显示分离，并明确了应用设计

    -   b) 允许以多种形式和由大量用户查看数据

    -   c) 通过将功能与表示分离来增强重用性

    -   d) 增加灵活性并提高扩展性

    -   e) 封装应用程序功能并便于维护

    -   f) 支持增量更新并划分部署


    # 36: MVC 有哪些设计上的问题？


    答案：


    以下是 MVC 的设计问题：


    -   a) 组件感知不到其他组件的实现细节

    -   b) 必须仔细处理延迟问题和通信量，否则在分布式系统中会导致可扩展性问题

    -   c) 如果 Model 不稳定，MVC 将难以维护，因为控制器大部分是基于 Model 编写的


    # 37: 解释 MVC 的适用性。


    答案：


    MVC 适用于以下情况：


    -   a) 如果应用足够大且是分布式的

    -   b) 如果应用寿命较长

    -   c) 接口和后端的可移植性最重要的

    -   d) 为了便于维护和重用

    -   e) 由多个开发者开发应用

    -   f) 以多种方式查看并操纵数据


    # 38: 解释模式（patterns）在 J2EE 框架中的性。


    答案：


    模式是指特定语文中解决业务问题的反复解决方案。语境是指问题存在的情况或环境。问题是需要调查且必须解决的，并通过因果关系指定。


    # 39: 解释框架模式（Framework patterns）。


    答案：


    以下被称为框架模式：


    -   a) 代理模式（Proxy pattern）：EJB 远程接口是代理模式的示例。它拥有的方法可以将方法调用委托给对象

    -   b) 工厂方法（Factory Method）：EJB Home 接口是工厂方法的示例。它有一个独立且可重用的类，通过通用接口引用对象

    -   c) 抽象工厂方法（Abstract Factory Method）：EJB home 接口是抽象工厂方法的示例。它是从具体子类创建抽象类实例的过程

    -   d) 装饰器（Decorator）：EJBObject 是装饰器模式的示例。装饰器的功能是它是对客户端可见的


    # 40: 部署器（deployer）的活动有哪些？


    答案：


    部署器执行以下活动：


    -   a) 将开发阶段创建的企业级包（EAR）文件阶段到 J2EE 应用程序服务器中

    -   b) 修改部署描述符并配置 J2EE 应用程序

    -   c) 确保企业级包文件（EAR）格式正确并符合 J2EE 规范

    -   d) 在 J2EE 应用程序服务器中安装或部署企业级包文件


    # 41: 哪些模式属于集成层（Integration Tier）？


    答案：


    以下模式属于集成层：


    -   a) DAO：数据访问对象（Data Access Object）检索数据源并提供透明的数据访问

    -   b) 服务激活器（Service Activator）：这被用于 EJB 组件并支持异步处理


    # 42: 表现层（Presentation Tier）模式有哪些？


    答案：


    以下是表现层模式：


    -   a) 前端控制器（Front Controller）：用于处理和管理来自客户端的请求

    -   b) 装饰器过滤器（Decorating Filter）：用于特定请求的预处理和后处理

    -   c) 复合视图（Composite View）：用于为子组件创建视图

    -   d) 分发视图（Dispatch View）：用于与前端控制器协作查看视图助手模式并推迟处理查看活动

    -   e) 视图助手（View Helper）：用于封装逻辑和格式表示


    # 43: 解释业务层（Business Tier）模式。


    答案：


    以下是业务层模式：


    -   a) 会话面面（Session Facade）：隐藏业务对象的复杂性并集中处理工作流

    -   b) 值对象（Value Object）：用于在不同层之间交换数据

    -   c) 服务定位器（Service Locator）：隐藏服务的复杂性和查找

    -   d) 业务委托（Business delegate）：用于分离服务层和表现层

    -   e) 值对象组装器（Value Object Assembler）：用于构建


    # 44: 解释 EIS。


    答案：


    EIS 代表企业信息系统（Enterprise Information System）。它存在于集成层并支持与企业相关的。访问 EIS 需要：


    -   a) 事务信息

    -   b) 安全信息

    -   c) 应用模型知识


    # 45: EIS 和应用程序服务器的系统级合约有哪些？


    答案：


    以下是 EIS 和应用程序服务器的系统级合约：


    -   a) 连接管理（Connection Management）允许应用和 J2EE 组件连接 EIS。这带来了可扩展的环境并支持多个客户端访问

    -   b) 事务管理（Transaction Management）支持对 EIS 的事务访问。它使用事务管理器


    # 46: 解释资源适配器（Resource Adapter）。


    答案：


    资源适配器是企业信息系统（EIS）的系统级合约。它被应用程序客户端或服务器用于连接 EIS。它与应用程序协作协作支持安全、事务和连接池。它位于应用程序服务器地址空间内。


    # 47: 解释数据缓存。


    答案：


    数据缓存特性如下：


    -   a）减少应用程序所需的网络连接

    -   b）减少应用程序所需的共享内存

    -   c）减少数据查找时间

    -   d）消除内存泄漏

    -   e）确保开发环境中的缓存模拟部署或生产环境


    # 48: 解释服务定位器（Service locator）。


    答案：


    为了访问 J2EE 内部的常用服务（如 JMS 工厂、EJB 对象、数据源等），使用了服务定位器。服务定位器使用 Java 命名目录接口（JNDI）API，这需要初始上下文。它查找所需服务并传递交给请求者。


    # 49: 解释如何防止性能问题。


    答案：


    -   a) 如果应用只需要本地访问，则永远不要使用 EJB 对象而使用 java 对象

    -   b) 如果你想在同一个 bean 容器和虚拟机内访问另一个 bean，请使用本地接口

    -   c) 使用单一远程调用并合并所有数据

    -   d) 修改不必要的变量并控制序列化


