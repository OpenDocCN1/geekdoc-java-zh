  - '[PAGE 53]


    We have to use EJB (Enterprise Java Beans) - Session and Entity beans in the following
    scenarios:


    +   a) To store client information across method invocations, stateful session
    bean


    +   b) For persistent data, use entity bean


    +   c) To communicate the presence of active client to the application server
    or EJB container, use stateful session bean


    +   d) To invoke the pooling feature of EJB container, stateless session bean


