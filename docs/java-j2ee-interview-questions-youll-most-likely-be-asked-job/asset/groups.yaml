    \ element to pass the requests from one page to another page.\n\n# 99: How will\
    \ you interpret relative URLs in the destination page?\n\nAnswer:\n\nWe can interpret\
    \ relative URLs in the destination page with the below line of code:\n\n```\n\
    <link rel=\"stylesheet\" href=\"/css/common.css\" type=\"text/css\" >\n```\n\n\
    In the above code, the style sheet is included in the destination page using the\
    \ href attribute in the link element.\n\n# 100: How will you associate all properties\
    \ in the bean class?\n\nAnswer:\n\nAll properties in the bean class can be associated\
    \ with the below line of code:\n\n```\n<jsp:setProperty name=\"service\" property=\"\
    *\" />\n```\n\nIn the above code, the jsp:setProperty element is used which contains\
    \ 'property' attribute set to \"*\" to associate all the properties in the bean\
    \ class.\n\n# EJB\n\n# 101: What are the classes / interfaces that must be created\
    \ for EJB?\n\nAnswer:\n\nThe following are the classes / interfaces that must\
