    # which is your greater strength?


    Answer:


    There is a difference – leaders are often great idea people, passionate, charismatic,
    and with the ability to organize and inspire others, while managers are those
    who ensure a system runs, facilitate their operations, make authoritative decisions,
    and who take great responsibility for all aspects of overall success to the finest
    decisions. Consider which of these is most applicable to the position, and explain
    how you fit into this role, offering concrete examples of your past experience.


    # 19: Do you function better in a leadership role, or as a worker on a team?


    Answer:


    It is important to consider what qualities the interviewer is looking for in your
    position, and to express how you embody this role. If you''re a leader, highlight
    your great ideas, drive and passion, and ability to incite others around you to
    action. If you work great in teams, focus on your dedication to the task at hand,
    your cooperation and communication skills, and your ability to keep things running
    smoothly.


    # 20: Tell me about a time when you discovered something in the workplace that
    was disrupting your (or others) productivity – what did you do about it?


    Answer:


    Try not to focus on negative aspects of your previous job too much, but instead
    choose an instance in which you found a positive, and quick, solution to increase
    productivity. Focus on the way you noticed the opportunity, how you presented
    a solution to your supervisor, and then how the change was implemented (most importantly,
    talk about how you led the change initiative). This is a great opportunity for
    you to display your problem-solving skills, as well as your resourceful nature
    and leadership skills.


    # 21: How do you perform in a job with clearly-defined objectives and goals?


    Answer:


    It is important to consider the position when answering this question – clearly,
    it is best if you can excel in a job with clearly-defined objectives and goals
    (particularly if you''re in an entry level or sales position). However, if you''re
    applying for a position with a leadership role or creative asset to, be sure to
    focus on the ways that you additionally enjoy the challenges of developing and
    implementing your own ideas.


    # 22: How do you perform in a job where you have great decision-making power?


    Answer:


    The interviewer wants to know that, if hired, you won''t be the type of employee
    who needs constant supervision or asks for advice, authority, or feedback every
    step of the way. Explain that you work well in a decisive, productive environment,
    and that you look forward to taking initiative in your position.


    # 23: If you saw another employee doing something dishonest unethical, what would
    you do?


    Answer:


    In the case of witnessing another employee doing something dishonest, it is always
    best to act in accordance with company policies for such a situation – if you
    don''t know what this company''s specific policies are, feel free to state that
    you would handle it according to the policy and by reporting it to the appropriate
    persons in charge. If you are aware of the company''s policies (such as if you
    are seeking a promotion within your own company), it is best to specifically outline
    your actions according to the policy.


    # 24: Tell me about a time when you learned something on your own that later helped
    in your professional life.


    Answer:


    # Java / J2EE Interview Questions You''ll Most Likely Be Asked


    This question is important because it allows the interviewer to gain insight into
    your dedication to learning and advancement. Choose an example solely from your
    personal life, and provide a brief anecdote noting the lesson you learned. Then,
    explain in a clear and thorough manner how this lesson has translated into a usable
    skill or practice in your position.


    # 25: Tell me about a time when you developed a project idea at work.


    Answer:


    Choose a project idea that you developed that was typical of projects you might
    complete in the new position. Outline where your idea came from, the type of research
    you did to ensure its success and relevance, steps that were included in the project,
    and the end results. Offer specific before and after statistics, to show your
    success.


    # 26: Tell me about a time when you took a risk on a project.


    Answer:


    Whether the risk involved something as complex as taking on a major project with
    limited resources or time, or simply volunteering for a task that was outside
    your field of experience, show that you are willing to stretch out of your comfort
    zone and try new things. Offer specific examples of why something you did was
    risky, and explain what you learned in the process – how this prepared you for
    a job objective you later faced in your career.


    # 27: What would you tell someone who was looking to get into this field?


    Answer:


    This question allows you to be the expert – and will show the interviewer that
    you have the knowledge and experience to go along with any training and education
    on your resume. Offer your knowledge as advice of unexpected things that someone
    entering the field may encounter, and be sure to end with positive advice such
    as the passion or dedication to the work that is required to truly succeed.


    # 28: Tell me about a time when you didn''t meet a deadline.


    Answer:


    Ideally, this hasn''t happened – if it has, make sure you use a minor example
    to illustrate the situation, emphasize how long ago it happened, and be sure that
    you did as much as you could to ensure that the deadline was met. Additionally,
    be sure to include what you learned about managing time better or prioritizing
    tasks in order to meet all future deadlines.


    # 29: How do you eliminate distractions while working?


    Answer:


    With the increase of technology and the ease of communication, new distractions
    arise every day. Your interviewer will want to see that you are still to focus
    on work, and what routine you employ to stay on task.


    # 30: Tell me about a time when you worked in a position with weekly monthly quota.
    How often were you successful?


    Answer:


    Your numbers will speak for themselves, and you must answer this question honestly.
    If you regularly met your quotas, be sure to highlight this in a confident manner.
    If your statistics are less stellar, try to point out trends in which they increased
    toward the end of your employment, and show reflection as to ways you improve
    in the future.


    # 31: Tell me about a time when you met a tough deadline, and how you were able
    to complete it.


    Answer:


    Explain how you were able to prioritize tasks or to delegate portions of assignments
    to team members, in order to deal with a tough deadline. It may be beneficial
    to specify why the deadline was tough – make sure it is clear that it was not
    a result of procrastination on your part. Finally, explain how you were able to
    successfully meet the deadline, and what it took to get there in the.


    # 32: How do you stay organized when you have multiple projects on your plate?


    Answer:


    The interviewer will be looking to see that you can manage your time and work
    well – being able to handle multiple projects at once, and giving each the attention
    it deserves, is a great mark of a worker’s competence and efficiency. Go through
    a typical process of goal-setting and prioritizing, and explain the steps to the
    interviewer.


    # 33: How much time during your work day do you spend on “auto-pilot?”


    Answer:


    While you may wonder if the employer is looking to see how efficient you are with
    this question (for example, so good at your job that you don’t have to think about
    it), in almost every case, the employer wants to see that you’re constantly thinking,
    analyzing, and processing what’s going on in the workplace. Even if things are
    running smoothly, there’s usually an opportunity to make things more efficient
    or to increase sales or productivity. Stress your dedication to ongoing development,
    and convey that being on “auto-pilot” is not conducive to that type of success.


    # 34: How do you handle deadlines?


    Answer:


    The most important part of handling tough deadlines is to prioritize tasks and
    set goals for completion, as well as to delegate.

