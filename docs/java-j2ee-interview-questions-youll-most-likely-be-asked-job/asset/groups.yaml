    # HR Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    ## 1: Where do you find ideas?


    Answer:


    Ideas can come from all places, and an interviewer wants to see that your ideas
    are just as varied. Mention multiple places that you gain ideas from, or settings
    in which you find yourself brainstorming. Additionally, elaborate on how you record
    ideas or expand upon them later.


    ## 2: How do you achieve creativity in the workplace?


    Answer:


    It is important to show the interviewer that you''re capable of being resourceful
    and innovative in the workplace, without stepping outside the lines of company
    values. Explain where ideas normally stem from you (examples may include an exercise
    such as list-making or a mind map), and connect this to a particular task in your
    job that it would be helpful to be creative in.


    ## 3: How do you push others to create ideas?


    Answer:


    If you''re in a supervisory position, this may be requiring employees to submit
    a particular number of ideas, or to complete regular idea-generating exercises,
    in order to work your creative muscles. However, you can also push others around
    you to create ideas by creating more of your own. Additionally, discuss with the
    interviewer the importance of questioning people as a way to inspire ideas and
    change.


    ## 4: Describe your creativity.


    Answer:


    Try to keep this answer within the professional realm, but if you have an impressive
    background in something creative outside of your employment history, don''t be
    afraid to include it in your answer also. The best answers about creativity will
    relate problem-solving skills, goal-setting, and finding innovative ways to tackle
    a project or make a sale in the workplace. However, passions outside of the office
    are great, too (so long as they don''t cut into your work time or mental space).


    ## 5: Would you rather receive more authority or responsibility at work?


    Answer:


    There are pros and cons to each of these options, and your interviewer will be
    more interested to see that you can provide a critical answer to the question.
    Receiving more authority may mean greater decision-making power and may be great
    for those with outstanding leadership skills, while greater responsibility may
    be a great opportunity for those looking to advance steadily throughout their
    careers.


    ## 6: What do you do when someone in a group isn''t contributing their fair share?


    Answer:


    This is a particularly important question if you''re interviewing for a position
    in a supervisory role – explain the ways in which you would identify the problem,
    and how you would go about pulling aside the individual to discuss their contributions.
    It is important to understand the process of creating a dialogue, so that you
    can communicate your expectations clearly to the individual, give them a chance
    to respond, and to make clear what needs to change. After this, create an action
    plan with the group member ensure your contributions are on par with others in
    the group.


    ## 7: Tell me about a time when you made a decision that was outside of your authority.


    Answer:


    While an answer to this question may portray you as being decisive and confident,
    it could also identify you to an employer as a potential problem employee. Instead,
    it may be best to refocus the question into an example of a time that you took
    on additional responsibilities, and thus had to make decisions that were outside
    of your normal authority (but which had been granted to you in the specific instance).
    Discuss how the weight of the decision affected your decision-making process,
    and the outcomes of the situation.


    ## 8: Are you comfortable going to supervisors with disputes?


    If a problem arises, employers want to know that you will handle it in a timely
    and appropriate manner. Emphasize that you''ve rarely had disputes with supervisors
    in the past, but if a situation were to arise, you feel perfectly comfortable
    discussing it with the person in question in order to find a resolution that is
    satisfactory to both parties.


    ## 9: If you had been in charge at your last job, what would you have done differently?


    No matter how many ideas you have about how things could run better, or opinions
    on the management at your previous job, remain positive when answering this question.
    It is okay to show thoughtful reflection on how something could be handled in
    order to increase efficiency or improve sales, but be sure to keep all of your
    suggestions focused on making things better, rather than talking about others
    to eliminate waste or negativity.


    ## 10: Do you believe employers should praise and reward employees for a job well
    done?


    Recognition is always great after completing a difficult job, but there are many
    employers who may ask this question as a way to infer whether or not you''ll be
    a high-maintenance worker. While you may appreciate rewards or praise, it is important
    to convey to the interviewer that you don''t require accolades to be confident
    that you''ve done your job well. If you are interviewing for a supervisory position
    where you would be the one praising other employees, highlight the importance
    of praise in boosting team morale.


    ## 11: What do you believe is the most important quality a leader can have?


    **Answer:**


    There are many important skills for a leader to have in any business, and the
    most important component of this question is that you explain why the quality
    you choose to highlight is important. Try to choose a quality such as communication
    skills, or an ability to inspire people, and relate it to a specific instance
    which you displayed the quality among a team of people.


    ## 12: Tell me about a time when an unforeseen problem arose. How did you handle
    it?


    **Answer:**


    It is important that you are resourceful, and level-headed under pressure. An
    interviewer wants to see that you handle problems systematically. Outline the
    situation clearly, including solutions and results.


    ## 13: Can you give me an example of a time when you were able to improve an objective
    at your previous job?


    **Answer:**


    It is important here to focus on the improvement you made that created tangible
    results for your company. Increasing efficiency is certainly an important element,
    but employers are also looking for concrete results such as increased sales or
    cut expenses. Explain your process thoroughly, offering specific numbers wherever
    possible.


    ## 14: Tell me about a time when a supervisor did not provide enough direction
    on a project.


    **Answer:**


    While many employers want their employees to follow specific guidelines without
    much decision-making power, it is important also to be able to pick up a project
    with vague direction and to perform self-sufficiently. Give examples of necessary
    that you asked, and specify how you determined whether a question was something
    you needed to ask of a supervisor or whether it was something you could determine
    on your own.


    ## 15: Tell me about a time when you were in charge of leading a project.


    Answer:


    Lead the interviewer through the process of the project, just as you would have
    with any of your team members. Explain the goal of the project, the necessary
    steps, and how you delegated tasks to your team. Include the results, and what
    you learned as a result of the leadership opportunity.


    ## 16: Tell me about a suggestion you made to a former employer that was later
    implemented.


    Answer:


    Employers want to see that you''re interested in improving your company and doing
    your part – offer a specific example of something you did to create a positive
    change in your previous job. Explain how you thought of the idea, how your supervisors
    received it, and what other employees thought the idea was put into place.


    ## 17: Tell me about a time when you thought of a way something in the workplace
    could be done more efficiently.


    Answer:


    Focus on the positive aspects of your idea. It is important not to speak your
    old company or boss negatively, don''t elaborate on how inefficient a particular
    system was. Rather, explain a situation in which you saw an opportunity to increase
    productivity or to streamline a process, and explain in a general step-by-step
    how you implemented a better system.


