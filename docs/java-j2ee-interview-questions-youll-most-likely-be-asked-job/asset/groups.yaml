    # Messaging


    # 201: What are Messages?


    Answer:


    # 202: Explain middle tier.


    Answer:


    Middle tier consists of an application called middleware provides the following
    services and business solutions:


    - a) **Messaging**: It is the ability to receive and send data

    - b) **Security**: It is the ability to authorize and authenticate users

    - c) **Naming**: It is the ability to identify the resource by name

    - d) **Database Management**: It is the ability to access a DB (database) server


    # 203: Explain MOM.


    Answer:


    MOM refers to Message Oriented Middleware which is mainly used for messaging.
    It is the infrastructure which enables applications to receive, send, and create
    messages inside the enterprise.

    MOM usually exchanges and delivers messages in different formats랴 and quickly.
    The advantage of MOM is that it is event driven. There are various messaging vendors:
    Example: HP, IBM, BEA, Oracle, etc.


    # 204: Explain synchronous communication.


    Answer:


    Synchronous communication is the communication method in which the client who
    made a request is blocked to process any further commands until the requester
    receives a response.


    Java / J2EE Interview Questions You''ll Most Likely Be Asked


    This communication happens between two parties: client (browser) and server. An
    example of this type of communication is authorization of credit card. Here, once
    the card is swiped, the receiver will wait for the response from the server for
    approval of transaction.


    # 205: Explain asynchronous communication.


    Answer:


    Asynchronous communication is the communication method in which the client who
    made a request is never blocked and /she could continue to work on other process
    or transaction. An example of asynchronous communication is E-mail. People can
    send e-mail to you even if you switched off your machine. Once you start your
    machine, the mail client will load your messages.


    # 206: Explain JMS.


    Answer:


    JMS refers to Java Messaging Service. It is a middleware which allows the software
    developers to loosely couple applications. It provides an API (Application Programming
    Interface) through which we can receive, send, read, and create enterprise system
    messages. JMS is a message oriented product which is quite expensive and complex.
    It provides an interface (Java) to write infrastructure code and allows solutions
    to be built easily and quickly.


    # 207: What are the message models supported by JMS?


    Answer:


    Java Messaging Service supports two types of message models. They are:


    - a) Publish/subscribe: In this model, the client can publish a message or subscribe
    any type of message

    - b) PTP: PTP refers to point-to-point model in which the messages are sent on
    the basis of one to one


    The specification of JMS requires messaging vendor should support any of the above
    models to be complaint.


    # 208: What are the benefits of synchronous messaging?


    Answer:

    The following are the benefits of synchronous messaging:


    - a) Synchronous messaging requires two parties (client and server) to be active.
    If one of the parties is not active, the transaction will not be successful

    - b) Before proceeding to the next operation or process, the message has to be
    acknowledged. If not, the message is not considered as processed


    # 209: What are the benefits of asynchronous messaging?


    Answer:

    The following are the benefits of asynchronous messaging:


    - a) This type of messaging is not affected much by failures because it does not
    require or expect acknowledgement

    - b) This type of message is not affected at the software, hardware, or at network
    level

    - c) Most often, the message is not lost but it might get delayed

    - d) This messaging works better if traffic increases as it keeps the request
    backlog in queue


    # 210: What are the scenarios for which we go for asynchronous messaging?


    Answer:

    The following are the scenarios for which we go for asynchronous messaging:


    - a) If we do not require the response immediately

    - b) If we require high volume processing of transaction capability

    - c) If we want an efficient messaging system to use the hardware system


    # 211: What are the advantages of JMS?


    Java / J2EE Interview Questions You''ll Most Likely Be Asked


    Answer:


    The following are the advantages of Java Messaging Service:


    - a) It provides a way to integrate the incompatible systems easily

    - b) It supports the asynchronous method of communication

    - c) It provides support for one or more type of communication

    - d) It provides support for transactional type of messaging

    - e) It provides support for guaranteed type of messaging


    # 212: What are the components of JMS?


    Answer:


    The following are the components of JMS:


    - a) **Messages**: It refers to the data that is passed between applications which
    defines the information type the message contains

    - b) **Clients**: It refers to the application which can receive and send messages

    - c) **Objects**: It refers to the JMS object which is maintained and created
    by the admin that are used by the JMS clients

    - d) **JMS Provider**: It refers to the host application where the JMS application
    runs. It provides the underlying appliance which is required for the messaging
    application


    # 213: How are exceptions handled in JMS?


    Answer:


    JMS uses ExceptionListener interface through which the application is notified
    if any problem occurs during execution or runtime. This interface identifies the
    problem details of JMS provider and communicates to the JMS client.


    To handle exception, we have to use the onError method which accepts argument.


    # 214: How are messages acknowledged in JMS?


    Java / J2EE Interview Questions You''ll Likely Be Asked


    Answer:


    Messages are acknowledged in JMS by the following ways:


    - **CLIENT_ACKNOWLEDGE**: The client acknowledges the message

    - **DUPS_OK_ACKNOWLEDGE**: If the JMS provider fails, duplication of the messages
    occur

    - **AUTO_ACKNOWLEDGE**: In this, the session acknowledges the client


    # 215: Explain the message headers of JMS.


    Answer:


    JMS uses the following headers:


    - **MessageID**: This is used to identify each message uniquely

    - **Priority**: 9 is highest and 0 is lowest. There is no guarantee that high
    priority message executes first than low priority message

    - **DeliveryMode**: This header is used to define the JMS as Persistent or Non-persistent

    - **Redelivered**: This is used to inform client that he she received the message
    earlier

    - **Expiration**: This is used to set the message in milliseconds


    # 216: What are the body formats of JMS?


    Answer:


    The following are the body formats of JMS:


    - **TextMessage**: This is formatted as String and it is used to exchange XML
    data

    - **ByteMessage**: This is used to match legacy messages

    - **ObjectMessage**: This denotes collection of objects or single serializable
    object

    - **MapMessage**: This is similar to a HashMap which has key value pair

    - **StreamMessage**: This denotes the stream of primitive values that are used
    to read sequentially


    # 217: What are the types of administered objects in JMS?


    Answer:


    In JMS, there are two types of administered objects. They are related to


    - a) Destination: It contains information that are related to configuration which
    are supplied by JMS provider. Destination uses queue for PTP and Topic for pub/sub

    - b) ConnectionFactory: It provides the physical connection to the Java Messaging
    Service through JNDI lookup. It contains IP address and enables JMS to create
    a connection


    # 218: What are the objects used to receive and create messages in JMS?


    Answer:


    The following objects are used to receive and create messages in JMS:


    - a) MessageConsumer: This is used to receive messages which are sent to a destination

    - b) MessageProducer: This is used to create messages which are sent to a destination

    - c) MessageSelector: This is used to filter the message that does not meet the
    specified criteria

    - d) MessageListener: This is used to process and receive messages asynchronously


    # 219: Explain Message Consumer.


    Answer:


    MessageConsumer is for receiving messages synchronously and asynchronously to
    a particular destination which is created by the session object.


    In case of synchronous communication, the consumer calls any one of the methods
    receiveNoWait and, in the case of asynchronous communication, the client registers
    MessageListener and starts consumer.

