    ## 69: What is a Cookie?


    Answer:


    Whenever a visitor browses a web page, some information (textual information such
    as form field values entered by the visitor, book added in the cart, etc.) gets
    stored in the web browser.


    This is useful in the following scenario: If the same visitor visits the page
    again, the information is served from the browser rather than the server thereby
    reducing the server load and time required to load the response.


    ## 70: What are the advantages of Cookies?


    Answer:


    The following are the advantages of cookies:


    +   a) The visitor has login once and for other subsequent visits, the visitor
    does not require to login again

    +   b) Identifies the particular user and display the items that were added in
    the cart

    +   c) Tracks users'' interest and displays respective advertisements

    +   d) Reduces the server load

    +   e) Provides faster response to the visitor


    ## 71: How can you set and get a cookie?


    Answer:


    We can add a cookie as mentioned below:


    ```

    Cookie myCookie = new Cookie("name", request.getParameter("name"));

    response.addCookie(myCookie);

    ```


    The above code will add a cookie in myCookie object.


    We can retrieve a cookie as mentioned below:


    ```

    Cookie[] myCookies = request.getCookies();

    Cookie myCookie = myCookies[0];

    System.out.println(myCookie.getValue());

    ```


    The above code retrieves the cookie from myCookie object.


    ## 72: What are the disadvantages of Cookies?


    Answer:


    The following are the disadvantages of Cookies:


    +   a) When browsing websites from a public computer, cookies store the e-mail
    address of a visitor thereby allowing others to send spam mails

    +   b) Valuable personal information is stolen by others from cookie objects

    +   c) The sensitive information like credit card details are preserved by cookie
    which leads to loss of money


    So, cookies should not be used to store sensitive information using servlets.


    ## 73: What are the options to track visitors browsing a web page?


    Answer:


    Visitors browsing a web page can be tracked using the following mechanisms:


    +   a) Cookies: cookie can be maintained per each page to track the visitors

    +   b) Hidden Form Fields: Using the input tag, we can store the value entered
    by the user

    +   c) URL Rewriting: In this we can append the data entered by the user to the
    server

    +   d) Session: In this, we can store the value entered by the user in Session


    ## 74: How can you store and retrieve a value from session?


    Answer:


    The value can be stored in session as shown below:


    ```

    HttpSession mySession = request.getSession(true);

    mySession.setAttribute("mobile", request.getParameter("mobile"));

    ```


    In the above code, the mobile number is stored in the session object ‘mobile’.


    The value can be retrieved from session as shown below:


    ```

    mySession.getAttribute("mobile");

    ```


    In the above code, the mobile number is retrieved from the session object ‘mobile’.


    ## 75: Explain Session tracking.


    Answer:


    Session tracking is an excellent technical solution for maintaining user sessions.
    It uses HttpSession API to look up a session object and create a new session object.


    Session tracking is used to store contextual information about the client as the
    server is not aware about client information. For example, in an online shopping
    cart, the visitor often adds some items to the shopping cart and, suddenly, because
    of a network issue, he gets disconnected from the web page. Once the network issue
    is resolved, the visitor will be able to see the items that were added in the
    shopping cart with the help of session tracking.


    # JSP


    ## 76: What is the purpose of JSP?


    Answer:


    JSP refers to Java Server Pages. It is a server side programming language which
    enables us to create static html along with dynamic content generation.

    Using JSP, we can create the presentation layer to display the contents in the
    web page with the help of JSP objects and constructs. JSP is widely supported
    and it can be used with any web server and works in all the operating system without
    changing the source code.

    Developers create a .jsp file which when invoked by the end user from the browser
    is converted to a servlet behind the scenes. But the end user can just view the
    html presentation of the content in the web page.


    ## 77: What are JSP constructs?


    Answer:


    +   To construct a web page, JSP uses the following 3 constructs:

    - Scripting Elements: This allows us to specify java code inside the java server
    pages code

    - Directives: This allows us to control the structure of the java server pages

    - Actions: This allows us to use the existing components in the java server pages


    ## 78: What are scripting elements?


    Answer:


    Scripting elements are used to insert java code inside java server pages. JSP
    has 3 types of scripting elements. They are:


    +   - Expressions: The tag `<%=` is used to define the expressions which is used
    to display the dynamic output in the web page

    - - Scriptlets: The tag `< %>` is used to declare scriptlet which is used to define
    the java code through which we can include dynamic content processing

    - - Declarations: The tag `<%! %>` is used to specify declaration


    Java / J2EE Interview Questions You''ll Most Likely Be Asked


    ## 79: What are the predefined objects?


    Answer:


    The following are the predefined objects:


    +   a) request: used to get information from the client

    - b) response: used to send response to the client

    - c) session: used to store user data across multiple requests

    - d) out: used to write content to the response body


    ## 80: Explain Session tracking.


    Answer:


    Session tracking is a mechanism used to maintain state across multiple requests
    from the same user. Since HTTP is a stateless protocol, session tracking allows
    the server to remember the user between different interactions.


    ## 81: How to display value in JSP?


    Answer:


    The value can be displayed in JSP using expressions or scriptlets:


    ```

    <%= value %>

    ```


    ## 82: What are the predefined objects in JSP?


    Answer:


    The following are the predefined objects:


    +   a) request: used to get request data

    +   b) response: used to send response

    +   c) session: used to manage session data

    +   d) out: used to output HTML content


    ## 83: Explain JSP directives.


    Answer:


    JSP directives are used to provide global information to the JSP page. There are
    three types:


    + - page: used to define page-specific attributes

    + - include: used to include a file during translation time

    + - taglib: used to import custom tag libraries


    ## 84: Explain with an example how to use page directive.


    Answer:


    The below lines of code depict how to use page directive:


    ```jsp

    <%@ page import="java.util.ArrayList" %>

    <%@ page import="com.core.MyList, com.core.MyVector" %>

    <%@ page contentType="text/plain" %>

    ```


    ## 85: Explain page directive attributes: import, session, buffer, and extends.


    Answer:


    The page directive attributes: import, session, buffer, and extends are explained
    below:


    +   a) import: used to import java class files

    +   b) session: used to set whether session is enabled or not

    +   c) buffer: used to set the buffer size in kilobytes

    +   d) extends: used to declare the super class for the JSP


    ## 86: Explain the page directive attributes: autoflush, info, errorPage, and
    isErrorPage.


    Answer:


    The page directive attributes: autoflush, info, errorPage, and isErrorPage are
    explained below:


    +   a) autoflush: used to specify if the output should be automatically flushed

    +   b) info: used to set static values in the java server page

    +   c) errorPage: used to provide the URL of the error handling page in case of
    exception

    +   d) isErrorPage: used to set whether the current page acts as an error page

