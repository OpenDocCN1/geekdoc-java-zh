    \ destroy, activate and passivate\n- c) Persistence: The beans do not explicitly\
    \ retrieve or store data from database but do with the help of container\n- d)\
    \ State Management: The container automatically manages state of the bean object\n\
    - e) Remote Access (Distributed): The container supports distributed remote access\
    \ with the help of RMI and IIOP protocols\n- f) Security: The container performs\
    \ automatically all security checks on behalf of enterprise beans\n\n## 147: What\
    \ are the benefits of EJB framework as architecture?\nAnswer:\n\nThe following\
    \ are the benefits of EJB framework as architecture:\n\n- a) The EJB architecture\
    \ is distributed, scalable, portable, transactional, multi-tiered, and secure\n\
    - b) The server for EJB automatically manages services such as threading, lifecycle,\
    \ transaction, and persistence for the enterprise bean component\n- c) The enterprise\
    \ bean components are platform independent i.e. they can be executed on any operating\
    \ system\n- d) The EJB components contain only business logic; thereby developers\
    \ are given freedom to maintain system level code\n\n## 148: Explain the lifecycle\
    \ of session bean.\nAnswer:\n\nThe lifecycle of a session bean can be stated as\
    \ below:\n\n- a) Using JNDI (Java Naming Directory Interface) services, the client\
    \ calls the home object of the bean\n- b) The home reference is used to create\
    \ EJBObject which creates the instance of the bean class\n- c) The bean class\
    \ called the session bean is allocated a session context\n- d) The home reference\
    \ is used to invoke methods on the EJB Object which pass the method calls to the\
    \ session bean\n- e) The session bean then returns result to the EJB Object which\
    \ returns the same to the remote interface\n\n## 149: What information does the\
    \ abstract persistence schema contain?\nAnswer:\n\nThe abstract persistence schema\
    \ contains the following information:\n\n- a) For managing each entity bean, it\
    \ has ejb-name field whose value must be unique\n- b) For specifying queries,\
    \ the abstract-schema-name is used for each entity bean whose value must be unique\n\
    - c) The relationship of ejb can be specified using ejb-relation field\n- d) To\
    \ specify the relationship role, we have to use the ejb-relationship-role field\n\
    \n## 150: What are the types of EJB clients?\nAnswer:\n\nThere are two types of\
    \ Enterprise Java Bean clients. They are:\n\n- a) Home client: The home client\
    \ always exists inside the enterprise java bean container.\n- b) Remote client:\
    \ The remote client always exist outside the enterprise java bean container\n\n\
    The enterprise bean object can be accessed by multiple clients from the enterprise\
    \ java bean container through a transaction manager.\n\n## Internationalization\
    \ and Localization\n\n## 151: What is internationalization?\nAnswer:\n\nInternationalization\
    \ is the process of making or preparing the code to support multiple languages.\
    \ Internationalization involves both application that presents output to the client\
    \ and data that can be converted to the appropriate language and character set.\
    \ So, internationalization allows an application to adapt to a new language and\
    \ region.\n\n## 152: What is localization?\nAnswer:\n\nLocalization is adapting\
    \ to internationalized application which supports a specific language or locale.\
    \ Localization involves translating the data into a specific language and maintains\
    \ it in a file so that the application can access it. The file can be a property\
    \ file. So, localization provides adaption of an internationalized application\
    \ to a specific country or region.\n\n## 153: What is a locale?\nAnswer:\n\nLocale\
    \ is an environment that includes locale-specific and regional information. During\
    \ localization, the internationalized application is adapted to a specific locale.\
    \ Each country has its own locale. For example, the US has en_US and Italy has\
    \ a locale_IT and so on. Here, it represents ‘language’ and IT. Here ‘it’ represents\
    \ language Italian and ‘IT’ represents ‘Regional variation’ i.e. name of the country,\
    \ Italy.\n\n## 154: What are the characteristics of internationalized application?\n\
    Answer:\n\nThe following are the characteristics of internationalized application:\n\
    \n- a) The application will have an .ear file (Enterprise Archive file) which\
    \ can be executed worldwide\n- b) The Graphical User Interface labels and messages\
    \ are not hard-coded within the program but retrieved dynamically\n- c) To support\
    \ new languages, recompilation is not required\n\n## 155: What are the elements\
    \ through which a locale is identified?\nAnswer:\n\nA locale is identified by\
    \ the following:\n\n- Language: It is the language. For example, en for English\n\
    - Regional Variation: It is the name of the country, i.e. US for United States\n\
    - Variant: It is the variant. For example, FR for France\n- System: It is the\
    \ system. For example, WIN for Windows\n\n## 156: Is it possible to use java.util.Properties\
    \ for localization?\nAnswer:\n\nWe can use java.util.Properties for localization.\
    \ For example:\n\n```java\nProperties appProp = new Properties();\nString strProp\
    \ = \"Properties.txt\";\nappProp.load(new FileInputStream(strProp));\nString serviceValue\
    \ = appProp.getProperty(\"key\");\n```\n\n## 157: Explain ResourceBundle.\nAnswer:\n\
    \nResourceBundle is a class that belongs to java.util. It defines naming convention\
    \ for organizing locale-specific resources.\n\n## 158: What are the features of\
    \ ResourceBundle?\nAnswer:\n\nResourceBundle has the following features:\n\n-\
    \ a) The content can be translated into different languages\n- b) Make the application\
    \ handle locales simultaneously\n- c) The application can be modified to support\
    \ additional locales\n\n## 159: Explain Character Sets.\nAnswer:\n\nCharacter\
    \ Set is a group of graphical or textual symbols which is mapped to positive integers\
    \ called code points. The American Standard Code for Information Interchange (ASCII)\
    \ character set is used for American English. It has lowercase and uppercase alphabets,\
    \ punctuation and symbols. For example, the ASCII code for B is 66. ASCII was\
    \ good only for American English.\n\n## 160: Explain Unicode.\nAnswer:\n\nUnicode\
    \ defines a universal and standard (ISO 10646) character set. It represents all\
    \ the character sets that are used around the world and it can be extended. So,\
    \ Unicode is a replacement for ISO 8859 character set. Java uses Unicode 2.x for\
    \ encoding characters. Every character for Unicode uses 2 bytes. Java represents\
    \ String objects as encoded Unicode.\n\n## 161: Explain UTF.\nAnswer:\n\nUTF represents\
    \ Unicode Transformation Format. It is an encoding (multi-byte) format that stores\
    \ characters in 1 byte, 2 and 3 bytes. Here U also represents Universal Character\
    \ Set (UCS). UTF-8 is compact and more efficient than Unicode and it is the widely\
    \ used encoding scheme. Java recommends UTF-8 as it is compatible with the existing\
    \ web content and provides access to Unicode character set.\n\n## 162: Explain\
    \ Collation and Collator.\nAnswer:\n\nCollation is a process that can sort strings\
    \ based on locale specific customs. The alphabets are different for different\
    \ languages and we need a unique way to Sort strings as per the language. Collator\
    \ is an abstract class that belongs to java.text package. This is used for providing\
    \ locale sensitive String comparison which does the Collation process.\n\n## 163:\
    \ What are the attributes used in JSP to control encoding?\nAnswer:\n\nIn JSP,\
    \ there are two attributes used in page directive to control encoding. They are:\n\
    \n- contentType: In this, we can specify the character set we are going to use\
    \ and the format of the content\n <@page contentType=\"text/html; charset=ISO-8859-1\"\
    \ %>\n"
  mdcn: "\n\n通过多个容器。\n\n## 146: EJB 容器提供哪些服务？\n答案：\n\nEJB 容器提供以下服务：\n\n- a) 事务管理：容器管理事务的启动、加入、回滚和提交\n\
    - b) 生命周期管理：它包括 bean 的创建、销毁、激活和惰性化\n- c) 持久化：bean 不显式地从数据库检索或存储数据，而是通过容器的帮助完成\n\
    - d) 状态管理：容器自动管理 bean 对象的状态\n- e) 远程访问（分布式）：容器通过 RMI 和 IIOP 协议支持分布式的远程访问\n- f)\
    \ 安全性：容器代表企业级豆（enterprise beans）自动执行所有安全检查\n\n## 147: EJB 框架作为架构的优点是什么？\n答案：\n\
    \n以下是 EJB 框架作为架构的优点：\n\n- a) EJB 架构是分布式的、可扩展的、可移植的、事务的多层次且安全的\n- b) EJB 服务器自动为企业级\
    \ bean 组件管理线程、生命周期、事务和持久化等服务\n- c) 企业级 bean 组件与平台无关，即它们可以在任何操作系统上执行\n- d) EJB\
    \ 组件仅包含业务逻辑；因此开发者被允许自由维护系统级代码\n\n## 148: 解释 session bean 的生命周期。\n答案：\n\nsession\
    \ bean 的生命周期可以描述如下：\n\n- a) 使用 JNDI（Java 命名目录接口）服务，客户端调用 bean 的本地对象（home object）\n\
    - b) 本地引用用于创建 EJBObject，从而创建 bean 类的实例\n- c) 调用 session bean 的 bean 类被分配一个会话上下文（session\
    \ context）\n- d) 本地引用用于调用 EJB Object 的方法，并将方法调用传递给 session bean\n- e) session\
    \ bean 然后将结果返回给 EJBObject，再由其将其返回给远程接口\n\n## 149: 抽象持久化模式（abstract persistence\
    \ schema）包含哪些信息？\n答案：\n\n抽象持久化模式包含以下信息：\n\n- a) 为了管理每个实体 bean，它有一个 `ejb-name`\
    \ 字段，其值必须是唯一的\n- b) 为了指定查询，每个实体 bean 使用 `abstract-schema-name`，其值必须是唯一的\n- c)\
    \ 可以使用 `ejb-relation` 字段指定 ejb 的关系\n- d) 为了指定关系角色，我们必须使用 `ejb-relationship-role`\
    \ 字段\n\n## 150: EJB 客户端有哪些类型？\n答案：\n\n企业 Java Bean 客户端有两种类型。它们是：\n\n- a) 本地客户端（Home\
    \ client）：本地客户端始终存在企业 java bean 容器内部\n- b) 远程客户端（Remote client）：远程客户端始终存在企业 java\
    \ bean 容器外部\n\n可以通过事务管理器从多个客户端访问企业 java bean 容器中的企业 bean 对象。\n\n## 国际化与本地化（Internationalization\
    \ and Localization）\n\n## 151: 什么是国际化？\n答案：\n\n国际化是制作或准备代码以支持多种语言的过程。国际化既涉及向客户端呈现输出的应用程序，也涉及可以转换为相应语言和字符集的数据。因此，国际化允许应用程序适应新的语言和区域。\n\
    \n## 152: 什么是本地化？\n答案：\n\n本地化是对支持特定语言或区域的国际化应用程序进行适配。本地化涉及将数据翻译成特定语言并将其维护在文件中，以便应用程序访问。该文件可以是一个属性文件（property\
    \ file）。因此，本地化提供了国际化应用程序对特定国家或区域的适配。\n\n## 153: 什么是 locale（区域）？\n答案：\n\nLocale\
    \ 是包含特定区域和信息的环境。在本地化过程中，国际化应用程序被适配到特定的 locale。每个国家都有自己的 locale。例如，美国有 `en_US`，意大利有\
    \ `locale_IT` 等。在这里，`en` 代表“语言”。在这里，`it` 代表语言意大利语，而 `IT` 代表“区域差异”，即国家名称意大利。\n\n\
    ## 154: 国际化应用程序的特征是什么？\n答案：\n\n以下是国际化应用程序的特征：\n\n- a) 应用程序将有一个 `.ear` 文件（企业归档文件），可以在范围内执行\n\
    - b) 图形用户界面标签和消息不是硬编码在程序中的，而是动态检索的\n- c) 为了支持新语言，不需要重新编译\n\n## 155: 识别 locale\
    \ 的元素有哪些？\n答案：\n\nlocale 通过以下标识识别：\n\n- 语言（Language）：它是语言。例如，`en` 代表英语\n- 区域差异（Regional\
    \ Variation）：它是国家名称，例如 `US` 代表美国\n- 变体（Variant）：它是变体。例如，`FR` 代表法国\n- 系统（System）：它是系统。例如，`WIN`\
    \ 代表 Windows\n\n## 156: 可以使用 java.util.Properties 进行本地化吗？\n答案：\n\n我们可以使用 `java.util.Properties`\
    \ 进行本地化。例如：\n\n```java\nProperties appProp = new Properties();\nString strProp\
    \ = \"Properties.txt\";\nappProp.load(new FileInputStream(strProp));\nString serviceValue\
    \ = appProp.getProperty(\"key\");\n```\n\n## 157: 解释 ResourceBundle。\n答案：\n\n\
    `ResourceBundle` 是属于 `java.util` 的一个类。它定义了组织特定区域资源的命名规范。\n\n## 158: ResourceBundle\
    \ 的特征有哪些？\n答案：\n\n`ResourceBundle` 具有以下特征：\n\n- a) 内容可以翻译成不同的语言\n- b) 让应用程序同时处理多个\
    \ locale\n- c) 可以应用程序以支持额外的 locale\n\n## 159: 解释字符集（Character Sets）。\n答案：\n\n\
    字符集是一组图形或文本符号，映射到正整数，称为代码点（code points）。美国信息交换标准（ASCII）字符集用于英语。它包含大小写字母、标点符号。例如，B\
    \ 的 ASCII 代码是 66。ASCII 仅适用于英语。\n\n## 160: 解释 Unicode。\n答案：\n\nUnicode 定义了一个通用标准的（ISO10646）字符集。它代表了全世界使用的字符集，并且可以扩展。因此，Unicode\
    \ 是 ISO 8859 字符集的替代。Java 使用 Unicode 2.x 进行编码。每个 Unicode 字符使用 2 个字节。Java 将 String\
    \ 对象表示为编码后的 Unicode。\n\n## 161: 解释 UTF。\n答案：\n\nUTF 代表 Unicode 转换格式。是一种编码格式，以\
    \ 1 字节、2 字节和 3 字节存储字符。在这里 U 也代表通用字符（UCS）。UTF-8 比 Unicode 更紧凑、高效，是广泛使用的编码方案。Java\
    \ 推荐 UTF-8，因为它与现有网页内容兼容并提供了对 Unicode 字符集的访问。\n\n## 162: 解释 Collation（排序）和 Collator（排序器）。\n\
    答案：\n\nCollation 是一种根据特定区域习俗对字符串进行排序的过程。不同语言的字母不同，我们需要一种独特的方法按语言排序字符串。Collator\
    \ 是属于 `java.text` 包的抽象类。它用于提供区域敏感的字符串比较，从而实现 Collation 过程。\n\n## 163: JSP 中使用哪些属性来控制编码？\n\
    答案：\n\n在 JSP 中，有两个属性用于页面指令（page directive）来控制编码。它们是：\n\n- contentType：在其中，我们可以指定我们将使用的字符集和内容的格式\n\
    \ <@page contentType=\"text/html; charset=ISO-8859-1\" %>\n\n"
