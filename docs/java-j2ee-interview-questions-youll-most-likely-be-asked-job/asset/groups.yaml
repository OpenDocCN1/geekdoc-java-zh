    # 13: 解释 MVC 架构。


    答案：


    MVC 代表模型-视图-控制器（Model View Controller）架构。MVC 中执行的操作解释如下：


    - a) 在模型（Model）中，开发者创建系统的业务逻辑

    - b) 在视图（View）中，开发者创建展示逻辑

    - c) 在控制器（Controller）中，开发者接收请求并传输响应


    # 14: 解释 EAR、WAR 和 JAR。


    答案：


    EAR 代表企业存档（Enterprise Archive）。它包含了 Web、EJB 和客户端组件。所有组件都打包在一个名为 .ear 的压缩文件中。

    WAR 代表 Web 归档（Web Archive）。它包含了与 Web 应用程序相关组件。所有组件都打包在一个名为 .war 的压缩文件中。

    JAR 代表 Java 归档（Java Archive）。它包含了构成 API（应用程序编程接口）的所有类文件和库文件。所有组件都打包在一个名为 .jar
    的压缩文件中。


    # 15: 解释 JTA、JNDI 和 JMS。


    答案：


    JTA 代表 Java 事务 API（Java Transaction API）。它用于协调和管理企业信息系统中的事务。

    JNDI 代表 Java 命名目录接口（Java Naming Directory Interface）。用于从目录服务中访问信息。

    JMS 代表 Java 消息服务（Java Messaging Service）。用于通过消息系统接收和发送消息。


    # 16: 解释 EDI。


    答案：


    EDI 代表电子数据交换（Electronic Data Interchange）。它用于通过作为传输媒介的增值网络（VAN）交换数据。

    EDI 安装成本昂贵，且需要交换客户端进行定制。EDI 还需要依赖 X12 标准来交换文档。


    # 17: 什么是 EAI？


    EAI 代表企业应用集成（Enterprise Application Integration）。它将一个或多个应用程序视为单个应用程序，并要求在正确的时间将数据传输到相应的系统。

    例如，在整合销售和会计系统时，必须向会计部门发送销售订单以生成发票。此外，会计部门必须向销售部门发送发票以更新销售人员的数据。

    该系统自动处理应用程序之间的事务，消除了人为错误。


    # 18: 在 Java 中支持 XML 的意图是什么？


    支持 XML 的意图是：


    - a) 确保 Java 开发者更容易理解 XML 并使用 XML，同时让 XML 开发者使用 Java

    - b) 为 Java 提供默认标准，以确保实现的一致性和兼容性

    - c) 确保 Java 平台能够高质量集成


    # 19: 业务层与用户界面之间通信使用哪些协议？


    业务层与用户界面之间通信使用的协议如下：


    - a) HTTP：代表“超文本传输协议”（Hyper Text Transfer Protocol）

    - b) JMS：代表“Java 消息服务”（Java Messaging Service）

    - c) RMI：代表“远程方法调用”（Remote Method Invocation）

    - d) CORBA：代表“通用对象请求代理架构”（Common Object Request Broker Architecture）

    - e) DCOM：代表“分布式组件对象模型”（Distributed Component Object Model）


    # 你可能被到的 Java / J2EE 面试题


    # 20: HTTP 协议的优缺点是什么？


    答案：


    以下是 HTTP 协议的优点：


    - a) 无状态且防火友好

    - b) HTTP 服务器更容易负载均衡和扩展


    以下是 HTTP 协议的缺点：


    - a) 难以维护用户会话

    - b) 与 JSP 和 servlet 的通信有限


    # 21: 解释 JRMP。


    答案：


    JRMP 代表 Java 远程方法对象协议（Java Remote Method Object Protocol）。它被远程方法调用（RMI）用于将 Java
    对象作为参数传递。


    由于 Java 依赖对象序列化（将对象封化为流），RMI 依赖 JRMP 协议将对象从一个 JVM（Java 虚拟机）传输到另一个。


    # 22: CORBA 的优缺点是什么？


    答案：


    以下是 CORBA 的优点：


    - a) 支持异构对象

    - b) 扩展了 ORB（对象请求代理）的能力


    以下是 CORBA 的缺点：


    - a) 无法传递对象，只能传递参数

    - b) 只能传递接受的数据类型


    # 23: 解释 DCOM。


    答案：


    DCOM 代表分布式组件对象模型（Distributed Component Object Model）。它通过远程方法调用来传递对象。


    DCOM 构建在 ORPC（对象过程调用）之上，用于支持远程对象。DCOM 包含了多种接口和交互方式，可以使用多种编程语言创建。


    # 24: 解释 J2EE 的功能。


    答案：


    以下是 J2EE 的功能：


    - a) **性能**：在短时间内完成操作

    - b) **可扩展性**：支持负载增加

    - c) **可用性**：系统 24 小时持续可用

    - d) **灵活性**：硬件的变化不会影响系统

    - e) **安全性**：信息不会被破解

    - f) **可重用性**：系统可以被重用


    # 25: 解释系统架构和参考架构。


    答案：


    系统架构代表产品。它包含了系统功能、接口和约束。

    参考架构代表风格。它是特定领域的设计原则。


    # 26: 解释最佳实践（Best Practice）。


    答案：


    最佳实践可以定义为：


    - a) 驱动组件设计的技术

    - b) 适用于工作类似项目的成员

    - c) 考虑设计或系统需求


    # 27: 解释 JEE 分层。


    答案：


    JEE 包含以下分层：


    - a) 客户端层（Client Tier）：代表向服务器发送请求的浏览器。该层使用的技术有 HTML、Applet 或非 Java 程序。

    - b) 中间层（Middle Tier）：由展示层、业务层和集成层。用户界面使用 JSP 创建在展示层。业务逻辑使用 EJB 创建在业务层。数据库对象创建在集成层。

    - c) 后端（Backend）：构成企业信息系统（EIS），用于存储数据。


    # 28: 展示层遵循哪些最佳实践？


    答案：


    展示层的最佳实践解释如下：


    - a) 将文本标记语言（HTML）与 Java 分离

    - b) 始终在 Bean 类中编写业务逻辑

    - c) 使用 JSP 模板和注释

    - d) 使用模型视图控制器（MVC）模式

    - e) 使用自定义库和标签处理器


    # 29: MVC 使用什么类型的组件？


    答案：


    MVC 代表模型-视图-控制器。模型、视图和控制器的组件解释如下：


    - 应用程序代表模型，构成系统状态。系统状态作为业务逻辑创建在 Bean 类中

    - 用户界面代表视图，使用 Java Pages 创建

    - 从客户端接收的请求总是控制器，使用 Servlet 创建


    # 30: J2EE 系统在全球经济中运营需要哪些要求？


    答案：


    J2EE 系统在全球运营需要具备以下要求：


    - 财务考虑：购买物品的支付方式应包含多种形式，因为并非所有访问者都有信用卡。此外，每个政府都有自己的税收、海关限制和关税

    - 语言要求：应用程序应支持多种语言，并适用于特定国家

    - 法律差异：每个国家的海关法和隐私要求不同，每个政府对图像、思想和演讲都有限制


    # 31: DAO 应遵循哪些最佳实践？


    答案：


    DAO 代表数据访问对象（Data Access Object）。DAO 应遵循的最佳实践如下：


    - DAO 不应与业务逻辑紧耦合

    - 每个企业 Bean 应该关联一个 DAO 类

    - DAO 仅应用于从数据库访问数据

    - DAO 的编写方式应允许跨


