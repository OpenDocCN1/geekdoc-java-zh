    - c) Ensures that the request contains authorization or authentication requirements

    - d) The application resources are protected by the combination of authentication
    and authorization constraints


    # 238: Explain legacy connectivity using Java.


    Answer:


    Legacy connectivity approach is based on the client server model which uses two-tier
    architecture. It is not web based and it uses Enterprise Information System to
    retrieve and process data. Enterprise Information System has an adapter which
    provides API (Application programming Interface) for processing and accessing
    data and EIS functions. The client uses the API programmatically to connect and
    access EIS.


    The key to Enterprise Information System adapter is reusability. Independent vendors
    develop adapters using programming language that has high degree of usability
    and reusability.


    # 239: Explain the authentication in EIS.


    Answer:


    To access information from Enterprise Information System, the components of J2EE
    needs to follow a separate security procedure. The information exists in a protected
    domain and hence Enterprise Information System layer operates in a separate environment.
    In this scenario, the container tries to invoke J2EE components authentication
    to get the resource. This mechanism is called container managed resource manager
    sign.


    # 240: Explain CSI.


    Answer:


    CSI refers to Common Secure Interoperability Protocol. The Enterprise Java Bean
    containers support this protocol and this protocol belongs to Object Management
    Group (OMG). CSI v2 is the standard for securing calls over IIOP. IIOP refers
    to Internet Inter-ORB Protocol. It is the identity assertion mechanism and this
    feature treats intermediate entity.


    # 241: Explain EIS adapter.


    Answer:


    Enterprise Information System has an adapter which provides API (Application programming
    Interface) for processing and accessing data and EIS functions. The client uses
    the API programmatically to connect and access EIS.


    The key to Enterprise Information System adapter is reusability. Independent vendors
    develop adapters using programming language that has high degree of usability
    and reusability.


    # 242: Explain legacy connectivity using J2EE connector.


    Developers use JDBC (Java Data Base Connectivity) CCI to access data instead of
    using the approach of the adapters as this is time consuming, Java Connector Architecture
    is supported in almost all the latest servers of WebLogic and WebSphere.

    By using Java Connector Architecture (JCA), the Enterprise Information System
    Service (EIS) vendors are not required to customize the adapters for each application
    server. Also, the application servers need not add code to get connectivity to
    Enterprise Information System (EIS).


    # 243: Explain Resource Adapter.


    Resource Adapter refers to implementation of interfaces in javax.resource.spi
    and javax.resource.cci package. It requires software library in system level when
    you to access a resource which uses native libraries to access Enterprise Information
    System.

    Resource adapter by default implements Enterprise Information System adapter of
    connector systems which includes security and transaction management.

    The resource adapter also has API at the client level which is used to access
    the EIS applications. It is also used within the server (application) environment.


    # 244: Explain System contract.


    System contract is defined as the agreement between two parties to support collaborative
    and mutually beneficial interaction. For example, EIS and server (application)
    collaborate to support mechanisms like connection management, security, and transactions.
    Using system contract, the component provider focuses on presentation and business
    logic development for applications. With this, we get a group of functionality
    from the provider to perform business tasks.


    # 245: Explain the integration strategy of JCA.


    Answer:

    The major work for developers nowadays is to integrate the new system with the
    older system. Integration could be performed with the following ways:


    - a) Inbound Integration Technique: In this, the request is initiated by the outside
    system to our system

    - b) Outbound Integration Technique: In this, the request is initiated by our
    system to other system system


    # 246: What are the types of System Contract?


    Answer:

    There are three types of system contracts. They are:


    - a) Security Management: This enables the server (application) to connect with
    EIS using the security related properties

    - b) Transaction Management: This allows propagating transactions from server
    (application) to EIS

    - c) Connection Management: This describes agreement between container (J2EE)
    and adapter to establish pooling and tearing down connections


    # 247: What are the ways to configure security properties?


    Answer:

    The following are the ways to configure security properties:


    - a) Principal mapping: This is used when connecting or combining EIS in the server
    (application)

    - b) Configured Identity: In this, the resource adapter uses identity connections
    when connecting to EIS

    - c) Credentials mapping: In this, the credentials of server and EIS are mapped

    - d) Caller Impersonation: This principal used in EIS matches with the application
    server


    # 248: What are the sections of CCI API?


    Answer:


    CCI refers to Common Client Interface. CCI API has four sections as mentioned
    below:


    - a) Connection Interface: This creates connection to Enterprise Information System

    - b) Interaction Interface: commanding execution on EIS is referred to as interaction
    interface

    - c) ResultSet Interface: This encapsulates query results to EIS

    - d) Metadata Interface: This allows to examine EIS metadata


    # 249: Explain ManagedConnectionFactory and ManagedConnection.


    Answer:


    ManagedConnectionFactory is an interface which is implemented by the class UCConnectionFactory
    (Entry point for the server to call adapter) which creates the UCConnectionFactory
    and UCManagedConnection class.

    ManagedConnection is an interface which is implemented by the UCManagedConnection
    class. This class encapsulates adapters connection (physical) class UCConnection.

    Both ManagedConnectionFactory and ManagedConnection are used for implanting JCA
    (Java Connector Architecture) adapter.


    # 250: What are the drawbacks of DB integrity constraints?


    Answer:


    The following are the drawbacks of DB (Data Base) integrity constraints:


    - a) Logic Duplication: The logic duplication is possible when the database integrity
    rules are changed which requires change in business logic code

    - b) DBMS constraints non-portability: Using procedural triggers often leads to
    non-portability as each vendor follows their own standards

    - c) Uncontrolled DB configuration: Since the constraints exists outside server
    (J2EE), configurations are performed with the DB vendor tools

