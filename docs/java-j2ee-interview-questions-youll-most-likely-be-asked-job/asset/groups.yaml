    # 35: Tell me about your personal problem-solving process.


    Answer:

    Your personal problem-solving process should include outlining the problem, coming
    up with possible ways to fix the problem, and setting a clear action plan that
    leads to resolution. Keep your answer brief and organized, and explain the steps
    in a concise, calm manner that shows you are level-headed even under stress.


    # 36: What sort of things at work can make you stressed?


    Answer:

    As it is best to stay away from negatives, keep this answer brief and simple.
    While answering that nothing at work makes you stressed will not very believable
    to the interviewer, keep your answer to one generic principle such when members
    of a team don''t keep their commitments, and then focus on a solution you generally
    employ to tackle stress, such as having weekly status meetings or intermittent
    deadlines along the course of a project.


    # 37: What do you look like when you are stressed about something? How do you
    solve it?


    Answer:

    This is a trick question – your interviewer wants to hear that you don''t look
    any different when you''re stressed, and that you don''t allow negative emotions
    to interfere with your productivity. As far as how you solve your stress, it is
    best if you have a simple solution mastered, as simply taking deep breaths and
    counting to 10 to bring yourself back to the task at hand.


    # 38: Can you multi-task?


    Answer:'
  - '[PAGE 118]


    # Java / J2EE Interview Questions You''ll Most Likely Be Asked


    Some people can, and some people can''t. The most important part of multi-tasking
    is to keep a clear head at all times about what needs to be done, and what priority
    each task falls under. Explain how you evaluate tasks to determine priority, and
    how you manage your time in order to ensure that all are completed efficiently.


    # 39: How many hours per week do you work?


    Answer:


    Many people get tricked by this question, thinking that more hours is better –
    however, this may cause an employer to wonder why you have to work so many hours
    in order to get the work done that other people can do in a shorter amount of
    time. Give a fair estimate of how that it should take you to complete a job, and
    explain that you are also willing to work extra whenever needed.


    # 40: How many times per day do you check your email?


    Answer:


    While an employer wants to see that you are plugged into modern technology, it
    is also important that the number of times you check your email per day is relatively
    low – perhaps two to three times per day (dependent on the specific field you''re
    in). Checking email is often a great distraction in the workplace, and while it
    is important to remain connected, much correspondence can simply be handled together
    in the morning and afternoon.


    # 41: Describe a time when you communicated a difficult or complicated idea to
    a coworker.


    Answer:


    Start by explaining the idea briefly to the interviewer, and then give an overview
    of why it was necessary to break it down further to the coworker. Finally, explain
    the idea in succinct steps, so the interviewer can see your communication abilities
    and skill in simplification.'
  - '[PAGE 119]


    # 42: What situations do you find it difficult to communicate in?


    Answer:

    Even great communicators will often find particular situations that are more difficult
    to communicate effectively in, so don''t be afraid to answer this question honestly.
    Be sure to explain why the particular situation you name difficult for you, and
    try to choose an uncommon answer such as language barrier or in time of hardship,
    rather than a situation such as speaking to someone of higher authority.


    # 43: What are the key components of good communication?


    Answer:

    Some of the components of good communication include an environment that is free
    from distractions, feedback from the listener, and revision or clarification from
    the speaker when necessary. Refer to basic communication models where necessary,
    and offer to go through a role-play sample with the interviewer to show your skills.


    # 44: Tell me about a time when you solved a problem through communication?


    Answer:

    Solving problems through communication is key in the business world, so choose
    a specific situation from your previous job in which you navigated a messy situation
    by communicating effectively through the conflict. Explain the basis of the situation,
    as well as the communication steps you took, and end with a discussion of why
    communicating through the problem was so important to its resolution.


    # 45: Tell me about a time when you had a dispute with another employee. How did
    you resolve the situation?


    Answer:

    Make sure to use a specific instance, and explain step-by-step the scenario, what
    you did to handle it, and how it was finally resolved. The middle step, how you
    handled the dispute, is clearly'
