    -   e) 原型（Prototype）：该模式等同于克隆。\n\n## 180: 解释单例（Singleton）。\n\n答案：\n\n单例模式的意图是确保一个类只有一个实例，并且它是全局访问点。它还确保使用单例实例的对象始终使用同一个单一实例。\n\
