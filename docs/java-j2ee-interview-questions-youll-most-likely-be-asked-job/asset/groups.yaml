    \n## 113: 解释本地客户端（local client）。\n答案：\n会话 bean 的客户端也称为本地客户端。该本地客户端通过本地（javax.ejb.EJBLocalObject）和本地\
    \ home（javax.ejb.EJBLocalHome）接口访问会话 bean。\n\n本地客户端位于与会话 bean 相同的 JVM 中，它们是取决于位置的。该本地客户端的对象以引用方式作为参数传递给方法。\n\
    \n## 114: 解释远程客户端（remote client）。\n答案：\n会话 bean 的客户端也称为远程客户端。该远程客户端通过远程（javax.ejb.EJBObject）和远程\
    \ home（javax.ejb.EJBHome）接口访问会话 bean。\n\n远程客户端从基于 CORBA 的应用程序访问 EJB 容器中的会话 bean，该应用程序使用远程方法调用互联网互操作\
    \ ORB 协议（Internet Inter ORB Protocol），这是一个非 Java 的程序。\n\n## 115: 什么时候我们必须使用 EJB？\n\
    答案：\n\n在以下场景中我们需要使用 EJB（企业级 Java Beans）——会话 bean 和实体 bean：\n\n- a) 为了跨方法调用存储客户端信息，使用有状态会话\
    \ bean（stateful session bean）\n- b) 持久化数据，使用实体 bean（entity bean）\n- c) 向应用程序服务器或\
    \ EJB 容器通信活动活跃客户端的存在，使用有状态会话 bean\n- d) 为了调用 EJB 容器的池化功能，使用无状态会话 bean（stateless\
    \ session bean）\n\n## 116: 如何管理 bean 的持久化。\n答案：\n管理 bean 持久化有两种方式。它们是：\n\n- a)\
    \ BMP（bean 管理持久化）：在这种情况下，我们编写 bean 类来管理持久化\n- b) CMP（容器托管持久化）：在这种情况下，容器负责管理持久化\n\
    \n## 117: 解释 bean 管理持久化（BMP）。\n实体 bean 实现 bean 管理持久化。在这种情况下，bean 通过直接数据库（DB）调用来存储和检索信息。\n\
    \n实体 bean 使用 JDBC（Java数据库连接）或 SQL 从数据库中存储和检索信息。\n\n## 118: 解释容器托管持久化（CMP）。\n实体\
    \ bean 实现容器托管持久化。在这种情况下，容器使用标准 API 访问数据库。\n\n容器托管持久化使得应用程序可以使用任何数据库。容器还提供了工具，将实体\
    \ bean 的实例变量映射到底层数据库（DB）的调用。\n\n你可能会遇到的 Java / J2EE 面试题 53\n\n## 119: 解释你如何创建一个无状态会话\
    \ bean 的 home 接口。\n答案：\n\n无状态会话 bean 的 home 接口可以如下创建：\n```java\nimport javax.ejb.*;\n\
    import java.rmi.*;\n\npublic interface MYSLSRemote extends EJBHome {\n    public\
    \ MySLSRemote create() throws RemoteException, CreateException;\n}\n```\n\n此接口作为\
    \ EJB 对象的工厂。bean 代码中的 `create()` 方法对应 `ejbCreate()` 方法。\n\n## 120: 解释你如何创建一个无状态会话\
    \ bean 的远程接口。\n答案：\n\n无状态会话 bean 的远程接口可以如下创建：\n```java\nimport javax.ejb.*;\n\
    import java.rmi.*;\n\npublic interface MYSLSRemote extends EJBObject {\n    public\
    \ String getMessage() throws RemoteException;\n}\n```\n\n客户端在需要调用 EJB 对象时使用此接口。该接口的责任是将后续调用委托给企业级\
    \ bean 代码。\n\n## 121: 解释 InitialContext。\n答案：\n\nInitialContext 是一个充当 JNDI（Java\
    \ 命名和目录接口）的类。\n\nInitialContext 包含允许客户端命名服务的信息（JNDI、CORBA 和 DNS 域命名服务）。\n\n如果调用\
    \ InitialContext 出现问题，将抛出 `javax.naming.NamingException`。\n\n## 122: EJB 池化的好处是什么？\n\
    答案：\nEJB 池化的化的处是：\n\n- a) 与多个用户共享资源\n- b) 在部署描述符中指定池的实例\n- c) 允许处理请求\n\n## 123:\
    \ 在实体 bean 和数据之间使用 DAO 的好处是什么？\n答案：\n在实体 bean 和数据之间使用 DAO（数据访问对象）的好处是：\n\n- a)\
    \ 编写代码（实体 bean）\n- b) 迁移\n- c) 它支持其他供应商\n- d) 为通信提供额外层\n- e) 允许跨模式和数据库\n\n## 124:\
    \ 解释 EJB 容器管理实体 bean 生命周期周期的作用。\n答案：\nEJB 容器管理实体 bean 生命周期周期的作用如下：\n\n- a) 为池填充\
    \ bean 集\n- b) 客户端从 home 调用 create() 方法\n\n## 127: CMP 有哪些缺点？\n你可能会遇到的 Java /\
    \ J2EE 面试题\n\n答案：\n\nCMP（容器托管持久化）的缺点有：\n\n- a) 可移植性：可能会丢失其他 EJB 容器的可移植性\n- b)\
    \ 算法：可以使用容器支持的持久化算法\n- c) 效率：考虑到性能，生成的 SQL 有时并不高效\n- d) 访问：开发者无法查看\n\n## 128:\
    \ BMP 有哪些缺点？\n答案：\n\nBMP（bean 管理持久化）的缺点有：\n\n- a) 特定数据库：由于开发了特定数据的实体 bean，如果需要访问多个数据库，bean\
    \ 开发者必须重写代码\n- b) SQL 知识：bean 必须具备 SQL 知识\n- c) 时间：开发用于管理持久化的 bean 需要五倍的时间\n\n\
    ## 129: 如何使用 BMP 实现持久化？\n答案：\n\n通过以下两种类型的方法可以使用 BMP 实现持久化：\n\n- a) ejbLoad: 此方法用于启动与企业级\
    \ java bean 容器的数据库通信\n- b) ejbStore: 此方法通过手动编码使用 JDBC API 存储数据\n\n## 130: 解释查找方法（finder\
    \ methods）。\n答案：\n\n"
