- md: '

    Almost all the messages in Java Messaging Service are exchanged asynchronously
    among clients the producer never receives acknowledgement from the consumer.


    ## 220: Explain Message Producer.


    Answer:


    MessageProducer is for sending messages either via PTP through pub/sub. In PTP
    (Point-To-Point) model, the destination is known as queue and in pub/sub model,
    the destination is known as Topic.


    In producer, we can set the delivery mode either as NON-PERSISTENT or PERSISTENT
    using the setDeliveryMode method. Non-Persistent has less overhead as the messages
    are not logged in the server or database.


    We can also use the setPriority to set the message priority. 0 indicates low priority
    and 9 indicates high priority. We can also use setTimeToLive to mention the life
    time of the message in milliseconds.


    ## 221: Explain Message Selector.


    Answer:


    MessageSelector belongs to String object which is used to filter the message that
    does not fit into the specified criteria.


    The message selector can examine the header and compares an expression which is
    present in the String. The example for expression comprises of arithmetic operators,
    relational operators, string literals, and logical operators.


    ## 222: Explain Message Listener.


    Answer:


    To process messages asynchronously, we have to instantiate the MessageListener
    interface. We have to perform the steps to process and receive messages asynchronously:


    - a) Create object which implements MessageListener interface and invoke the onMessage
    method

    - b) Use setMessageListener method to register with the Java / J2EE Interview
    session object

    - c) Use Connection object''s start method to start receiving messages


    ## 223: What are the classes, interfaces, and steps required for PTP communication?


    Answer:


    The following are the classes, interfaces, and steps required for Point-To-Point
    communication:


    - a) Using JNDI (Java Naming Directory Interface) lookup, obtain QueueConnectionFactory
    object. JNDI name varies based on the messaging vendor

    - b) Through QueueConnectionFactory object, obtain QueueConnection object. We
    have to provide username and password if security is enabled

    - c) Through QueueConnection, obtain QueueSession with provider

    - d) Through JNDI lookup, obtain queue.

    - e) Through QueueConnection create QueueSession QueueReceiver or QueueSender
    for receiving and sending messages

    - f) Close QueueConnection which closes QueueReceiver, QueueSender, and QueueSession


    ## 224: What are the classes, interfaces, and steps required for Pub/Sub communication?


    Answer:


    The following are the classes, interfaces, and steps required for Pub/Sub communication:


    - a) Using JNDI (Java Naming Directory Interface) lookup, obtain TopicConnectionFactory
    object. JNDI name varies based on the messaging vendor

    - b) Through TopicConnectionFactory object, obtain TopicConnection object. We
    have to provide username and password if security is enabled

    - c) Through TopicConnection, obtain TopicSession with provider

    - d) Through JNDI lookup, obtain queue

    - e) Through TopicSession create TopicSubscriber or TopicPublisher for subscribing
    and publishing messages

    - f) Close TopicConnection which closes TopicSubscriber, TopicPublisher, and TopicSession


    ## 225: Explain MDB.


    Answer: refers to Message Driven Bean. It is a component (stateless) Moked by
    the container (EJB) whenever the messages arrives in the destination (queue or
    topic).


    MDB is a consumer which receives messages because it implements the interface
    javax.jms.MessageListener. Similar to a Java Messaging Service, the message driven
    bean also receives messages in the same manner.


    In case of MDB, the Enterprise Java Bean Container ensures that the bean is registered
    in the particular destination whenever a message is sent.


    ## Security and Legacy Connectivity


    ## 226: What are the various security threats to enterprise resources?


    Answer:


    The following are the security threats to enterprise resources:


    - a) Confidential Information Disclosure: Accidentally or intentionally making
    the information available to someone who has no legal rights

    - b) Information Modification: Accidentally: or intentionally modifying data

    - c) Compromise of Accountability: This is called identity theft

    - d) Misappropriation of Protected Resources: This is called as service theft

    - e) Misappropriation that compromises availability: Data modification causes
    interruption to the enterprise system


    ## 227: Explain Authentication and Authorization.


    Answer:


    Authentication is the process of verifying the credentials of the user who got
    permission to enter into secured premises or websites. For example, only the registered
    users are authorized to login in to a website which provides mailing service.
    Authorization is the process of verifying the role of the user who got permission
    to visit or receive the requested resource. For example, the user cannot modify
    a document because he does have the role or not authorized to modify a particular
    document.


    ## 228: Explain some of the security packages available in Java.


    Answer:


    The following are the security packages available in Java:


    - a) java.security: This contains the classes and interfaces for security, authentication,
