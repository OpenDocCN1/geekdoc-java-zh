    There are two ways to manage bean persistence. They are:


    +   a) BMP (Bean Managed Persistence): In this, we write a bean class to manage
    persistence


    +   b) CMP (Container Managed Persistence): In this, the container is responsible
    for managing persistence


    # 117: Explain bean managed persistence.


    The entity beans implement bean managed persistence. In this scenario, the beans
    store and retrieve information through direct DB (database) calls.


    The entity bean uses JDBC (Java Data Base Connectivity) or SQL for storing and
    retrieving information from data base.


    # 118: Explain container managed persistence.


    The entity beans implement container managed persistence. In this scenario, the
    container provides access to the database using standard API’s.


    The usage of container managed persistence makes the application to use any database.
    The container also provides tool to map instance variable of an entity bean to
    call to an underlying DB (database).'
