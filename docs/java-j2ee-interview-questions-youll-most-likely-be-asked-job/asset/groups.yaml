- md: "\nthrough method invocations (business logic). This type bean also utilizes\
    \ the pooling feature of EJB container\n\n## 109: What are the methods of remote\
    \ interfaces?\nAnswer:\n\nThe following are the methods of remote interfaces:\n\
    \n- a) getEJBHome(): Returns a reference to the home interface of session bean\n\
    - b) getPrimaryKey(): This method returns session bean objects primary key\n-\
    \ c) getethandle(): Returns a handle for the EJB object\n- d) isIdentical(): This\
    \ method tests if the passed java bean object is identical to invoked enterprise\
    \ java bean object\n- e) remove(): This method removes a bean (session) object\n\
    \n## 110: What are the methods of home interfaces?\nAnswer:\n\nThe following are\
    \ the methods of home interfaces:\n\n- a) getEJBMetaDetail(): This method enables\
    \ client to get information about enterprise bean\n- b) remove(Handle handle):\
    \ This removes EJB objects identified by their handles. A handle is retrieved\
    \ by getHandle() method\n- c) remove(Object primaryKey): This removes EJB objects\
    \ which are identified by their primary key\n- d) getHomeHandle(): This obtains\
    \ a handle of home object. The client uses this object to store a reference to\
    \ the entity bean's remote interface\n\n## 111: What are the services provided\
    \ by the local and remote interfaces?\nAnswer:\n\nThe following are the services\
    \ provided by the local and remote interfaces:\n\n- a) Returns session object's\
    \ home interface\n- b) Removes session object\n- c) Delegates method invocations\
    \ on session bean instance\n- d) Tests if the session object is identical to another\
    \ session object\n\nJava / J2EE Interview Questions You'll Most Likely Be Asked\n\
    \n## 112: Explain how a session bean is exposed to the client.\nAnswer:\n\n- A\
    \ session bean is exposed to the client in the following ways:\n  - a) EJBHome\
    \ creates instances of session bean and EJBObject\n  - b) EJBObject provides access\
    \ to methods of session bean\n  - c) The stub acts as proxies to remote EJBObjects\n\
    \  - d) The call and dispatch mechanisms are provided by the tie class which binds\
    \ the proxy to EJBObject\n\n## 113: Explain local client.\nAnswer:\nThe client\
    \ of session bean is also called as a local client. This local client access the\
    \ session bean through local (javax.ejb.EJBLocalObject) and local home (javax.ejb.EJBLocalHome)\
    \ interface.\n\nLocal client resides inside the same JVM as session bean and they\
    \ are location dependent. This local client has objects passed as arguments to\
    \ the methods by reference.\n\n## 114: Explain remote client.\nAnswer:\nThe client\
    \ of session bean is also called as a remote client. This remote client access\
    \ the session bean through remote (javax.ejb.EJBObject) and remote home (javax.ejb.EJBHome)\
    \ interface.\n\nThe remote client access session bean in an EJB container from\
    \ CORBA based application which uses remote method invocation Internet Inter ORB\
    \ Protocol which is a non-java based program.\n\n## 115: When we have to use EJB.\n\
    Answer:\n\nWe have to use EJB (Enterprise Java Beans) - Session and Entity beans\
    \ in the following scenarios:\n\n- a) To store client information across method\
    \ invocations, stateful session bean\n- b) For persistent data, use entity bean\n\
    - c) To communicate the presence of active client to the application server or\
    \ EJB container, use stateful session bean\n- d) To invoke the pooling feature\
    \ of EJB container, stateless session bean\n\n## 116: How to manage bean persistence.\n\
    Answer:\nThere are two ways to manage bean persistence. They are:\n\n- a) BMP\
    \ (Bean Managed Persistence): In this, we write a bean class to manage persistence\n\
    - b) CMP (Container Managed Persistence): In this, the container is responsible\
    \ for managing persistence\n\n## 117: Explain bean managed persistence.\nThe entity\
    \ beans implement bean managed persistence. In this scenario, the beans store\
    \ and retrieve information through direct DB (database) calls.\n\nThe entity bean\
    \ uses JDBC (Java Data Base Connectivity) or SQL for storing and retrieving information\
    \ from data base.\n\n## 118: Explain container managed persistence.\nThe entity\
    \ beans implement container managed persistence. In this scenario, the container\
