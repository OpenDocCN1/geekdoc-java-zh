    # 32: Explain Guideline.


    Answer:


    Guideline refers to rule or agreement on operations which are developed by the
    professionally recognized organization or associations. It also includes approved
    formal proprietary standards to be followed during the project activities. Example
    for a Guideline is: Analysts attempting to maximize content to reduce network
    traffic.


    # 33: What are the best practices to be followed in VO?


    Answer:


    VO represents Value Object. The best practices to be followed in Value Objects
    are explained below:


    +   a) VO should contain business objects with get and set methods


    +   b) VO should update the model bean object with the respective value


    +   c) VO should not reference an object on the server


    +   d) VO should represent a value from the server


    # 34: What are the best practices to be followed in session bean façade?


    Answer:


    The following are the best practices to be followed in session bean façade:


    +   a) It should reduce remote call to the application server


    +   b) Apply transactional scope to methods which calls entity bean group


    +   c) Simplify the client tier so that business logic gets executed only on the
    application server


    +   d) Coding should be done in such a way that it identifies permissions and
    provide flexibility and reusability'
