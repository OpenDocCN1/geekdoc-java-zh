    # 14: Explain EAR, WAR, and JAR.


    Answer:


    EAR represents Enterprise Archive file. It contains the components of web, EJB,
    and client. All the components are packed in a compressed file called .ear.

    WAR represents Web Archive file. It contains all the components related to the
    web application. All the components are packed in a compressed file called .war.

    JAR represents Java Archive file. It contains all the class files and library
    files which constitute an API (Application Programming Interface). All the components
    are packed in a compressed file called .jar file.


    # 15: Explain JTA, JNDI, and JMS.


    Answer:


    JTA represents Java Transaction API. It is used for coordinating and managing
    transactions across enterprise information system.

    JNDI represents Java Naming Directory Interface. It is used for accessing information
    from directory services.

    JMS represents Java Messaging Service. It is used for receiving and sending messages
    through messaging systems.


