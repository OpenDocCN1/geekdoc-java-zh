    # 7: What are the components of multi-tier architecture?

    Answer:


    The following are the components of multi-tier architecture:


    +   a) Presentation Tier: The front end component is present in this tier which
    is used to display the presentation


    +   b) Resource Tier: The back end component is present in this tier which is
    used to communicate with database


    +   c) Business Tier: The component present in this tier is used to provide business
    logic for the system


    # 8: What are the advantages of multi-tier client server architecture?

    Answer:


    The following are the advantages of multi-tier client server architecture:


    +   a) Changes to business logic or user interface can be made independently


    +   b) The client accesses data easily without knowing where data comes from and
    how many servers are available for the system


    +   c) The DB (database) connections can be pooled so that the data can be shared
    for several users without making DB request for each user


    +   d) The middle tier component (business logic) can be written in any standard
    programming languages such as C or Java


    # 9: What are the responsibilities of the bean developer?

    Answer:


    The following are the responsibilities of the bean developer:


    +   a) Write the systems business logic in java


    +   b) Integrate java components with third party components


    +   c) Control access and set transaction parameters


    +   d) Create home interface to find the beans and remote'
