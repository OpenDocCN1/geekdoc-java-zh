  md: '# 47: Explain data caching.


    Answer:


    Data caching features are explained below:


    +   a) Caching reduces the network connection trips required for the application

    b) It minimizes the shared memory required for the application

    c) It reduces the data lookup time

    d) It removes memory leaks

    e) It ensures caching implemented in development environment simulates deployment
    or production environment


    # 48: Explain Service locator.


    Answer:


    To access common services like JMS factories, EJB objects, data sources, etc.,
    which lies within J2EE, service locator is used. The service locator uses Java
    Naming Directory Interface (JNDI) API which requires initial context object. This
    lookup the desired service and transfer the same to the requester.


    # 49: Explain how to prevent performance problems.


    Answer:


    Performance problems can be prevented by the following ways:


    +   a) If the service requires only local access, then never use EJB object but
    just use java object

    b) If you want one bean to access another within the same bean container and Virtual
    Machine, then use local interfaces

    c) Use single remote call and combine all data instead of multiple remote calls

    d) Modify unnecessary variable and control serialization

    e) To avoid JNDI lookup, cache EJBHome reference


