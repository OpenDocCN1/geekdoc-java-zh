    # 10: What are the responsibilities of application assembler?

    Answer:


    The following are the responsibilities of application assembler:


    +   a) Build presentation layer i.e., user interface

    b) Specify the requirements of transaction management

    bc) Set transaction parameters for all the bean’s methods

    d) Define security roles and assign permissions

    e) Specify wild character (\*) to the methods


    # 11: What are the responsibilities of bean deployer?

    Answer:


    The following are the responsibilities of bean deployer:


    +   a) Map fields to DB (database) columns and manage persistence

    b) Define users, groups, roles, and manage security

    c) Use the deployment tools and generate wrapper classes

    d) Map user roles and groups

    e) Ensure all the deployed bean is assigned a transaction parameter


    # 12: What are the roles of third party software in EJB framework?

    Answer:


    The third party companies that provide the software can play any of the following
    three roles:


    +   a) Component Provider: Responsible for developing object modeling, programming,
    architecture, and business process

    b) Container Provider: Responsible for proving the environment during runtime
    to the server

    e) Application Server Provider: Responsible for providing platform to develop
    distributed applications. It usually contains the container which provides the
    runtime environment'
