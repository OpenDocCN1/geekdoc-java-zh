    # 24: Explain the capabilities of J2EE architecture.


    Answer:


    The following are the capabilities of J2EE architecture.


    +   a) **Performance**: performs functionality in a short time frame

    b) **Scalability**: Supports even if the load on the server increases

    c) **Availability**: The system is always accessible across 24 * 7

    d) **Flexibility**: Change in hardware or architecture does not impact the system

    e) **Security**: The information cannot be hacked and modified

    f) **Reusability**: The component created for a system can be reused and save
    development time


    # 25: Explain System architecture and Reference architecture.


    Answer:


    System architecture represents the architecture as product. This comprises the
    component functions, interfaces of the proposed system, constraints, and interactions.
    This is the base for application design implementation.


    Reference architecture represents architecture as method or style. For a specific
    domain, reference architecture refers coherent design principle.'
