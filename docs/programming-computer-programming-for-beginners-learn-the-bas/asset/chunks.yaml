- fmt: "\n## Arrays\nThey are almost similar to variables except that they can hold\
    \ multiple expressions and values under one name and thus making them a powerful\
    \ data type. There is no limit to the amount of data which can be stored in arrays\
    \ as long as it is within the scope. One can access any value of any item and\
    \ any given point of time provided that it is declared in the script. Similar\
    \ type of data can be stored under one single array and that particular array\
    \ can be assigned a name which is related to the items it consists of.\n\nLet\
    \ us look at an example:\n\n```\nvar shapes = new Array(“rectangle”, “square”,\
    \ “triangle”);\nvar colors = new Array( “red”, “pink”, “orange”);\n```\n\nTo access\
    \ any item in the array you have to use its ID. It is the item’s position in the\
    \ array. Arrays always start with a 0 as an ID instead of 1 which might get confusing\
    \ in the beginning but with practice you can find the concept easy to learn. The\
    \ ID’s work in ascending order; like 0,1,2,3 and so on. Below is an example to\
    \ understand this concept-\n\n```\nvar colors = new Array( “red”, “pink”, “green”);\n\
    document.write( “red: “+colors[0]);\ndocument.write( “pink: “+colors[1]);\ndocument.write(\
    \ “green: “+colors[2]);\n```\n\nIn an array you can also assign values to a particular\
    \ position. For example:\n\n```\nvar colors = new Array ();\ncolors [0] = “red”;\n\
    colors [1] = “pink”;\ncolors [2] = “green”;\ndocument.write (“pink: “+colors [2]);\n\
    //update pink to blue\nColors [1] = “blue”;\ndocument.write (“blue: “+ colors\
    \ [2]);\n```\n\n## Objects\nThe objects are written with curly brackets. The properties\
    \ of object are written as –:\n- name: value pairs, separated by commas\n\nExample\
    \ for objects:\n\n```\nVar person = {first name: “Ryan”, last name: “Booth”, age:35,\
    \ eyeColor: “brown”};\n```\n\nThe above example has four properties; age, eye\
    \ color, first name and last name.\n\n## Operators\nTo perform any operation in\
    \ JavaScript we need operators. They include comparison, subtraction, addition\
    \ and many more. There are four basic operators:\n- Assignment\n- Arithmetic\n\
    - Logical\n- Comparison\n\n### Arithmetic operators\nThese operators perform basic\
    \ mathematical operations like division, addition, multiplication, subtraction\
    \ and so on.\n\n| Operator | Description |\n| :--- | :--- |\n| * | Multiplication\
    \ |\n| - | Subtraction |\n| + | Addition |\n| / | division |\n| * | To find the\
    \ remainder (modulus) |\n| - | Decrement |\n| ++ | increment |\n\n### Assignment\
    \ Operators\nThey are used to assign values to variables in JavaScript. Listed\
    \ below are all available assignment operators:\n\n| Operator | Description |\n\
    | :--- | :--- |\n| = | Equal |\n| += | Variable is assigned addition value |\n\
    | -= | Variable is assigned subtraction value |\n| *= | Variable is assigned multiplication\
    \ value |\n| /= | Variable is assigned division value |\n| %= | Variable is assigned\
    \ modulo value |\n\n**Example:**\n```\nvar num =20;\ndocument.write(“The value\
    \ of num is: “+num);\n//update the value of num to 30\nnum= (num+10);\ndocument.write(\
    \ “ The new value of num is:+num);\n```\n\n### Comparison Operators\nThese operators\
    \ establish the relationship between variables or their values. They are used\
    \ inside conditional statements (we will learn about this later) to create logic\
    \ by comparing variables or their values. This helps in evaluating whether the\
    \ statement is true or false. Types of comparison operators are:\n\n| Operator\
    \ | Description |\n| :--- | :--- |\n| < | Less than |\n| > | Greater than |\n\
    | == | Equal to |\n| != | Not equal to |\n| === | Equal to, in object and value\
    \ type |\n| >= | Greater than or equal to |\n| <= | Less than or equal to |\n\n\
    ### Logical Operators\nThey combine comparison operators and are typically used\
    \ in conditional statements. Types of Logical operators are:\n\n| Operator | Description\
    \ |\n| :--- | :--- |\n| ! | Not |\n| && | And |\n| || | Or |\n\n## 3. Conditional\
    \ Statements\nLike other programming languages, there are different kinds of conditional\
    \ statements available in JavaScript. They allow you to define a condition whose\
    \ results determine the action that will be done. They allow your program to make\
    \ a decision based on the outcome of the condition and perform the relevant action.\n\
    \nIn order to create any kind of logic in a programming language, conditional\
    \ statements act as the basis for it. Conditional statements can be written in\
    \ four ways under JavaScript.-\n\n| Statement | description |\n| :--- | :--- |\n\
    | Switch | To execute one out of many scripts |\n| If | Execute a script if a\
    \ result of a specific condition is true |\n| If..else | There are two codes in\
    \ this conditional statement. If statement executes a script when the condition\
    \ is true whereas the code under else statement is executed when the condition\
    \ is false |\n| If..else if..else | Execute a script if one of the unlimited conditions\
    \ is true or if all conditions are false then execute another script. |\n\nThe\
    \ basic syntax for the if…else statement is given below.\n\n```javascript\nif\
    \ (expression) {\n    Statement(s) to be executed if expression is true\n}\n```\n\
    \nExamples:\n\n**if**\n```javascript\nvar num=20;\nif (num==10)\n{\n  document.write(\
    \ “num is equal to 10”);\n}\n```\n\n**if..else**\n```javascript\nvar num=20;\n\
    if (num==10)\n{\n  document.write( “num is equal to 10”);\n}\nelse\n{\n  document.write(\
    \ “num is not equal to 10”);\n}\n```\n\n**if..else if..else**\n```javascript\n\
    var num=20;\nif (num==10)\n{\n  document.write( “num is equal to 10”);\n}\nelse\
    \ if (num==20)\n{\n  document.write( “num is equal to 20”);\n}\nelse\n{\n  document.write(\
    \ “num is not equal to 10 or 20”);\n}\n```\n\n**switch**\n```javascript\nvar num=20;\n\
    switch (num)\n{\n  case 10:\n    document.write(“num is equal to 10”);\n    break;\n\
    \  case 20:\n    document.write(“num is equal to 20”);\n    break;\n  default:\n\
    \    document.write(“num is not 10 or 20”);\n}\n```\n\n## 5. Functions\nFunctions\
    \ are the containers for the script. They are only to be executed by a call to\
    \ the function or an event. Hence, they are not executed when browser is initially\
    \ loaded and executes the script that is the part of web page.\n\nFor structuring\
    \ a function function word followed by a space is used. The name of the function\
    \ can be anything; however one should ensure that the name given is related to\
    \ the task it will perform. Example:\n\n```javascript\nvar num =20;\nfunction\
    \ changevariablevalue()\n{\n  num=21;\n}\nchangevariablevalue();\ndocument.write(\
    \ “num is:+num);\n```\n\n## 6. Loops\nLoops are used to iterate the arrays and\
    \ execute script along accessing their values. Loop typically consists of variable\
    \ that has been assigned a numeric value. That variable is then used with a comparison\
    \ operator to compare it against other value. After this the numeric value is\
    \ increased or decreased. The comparison in the loop typically determines whether\
    \ the initial value of a variable is greater or less than another numeric value.\
    \ So till the time that condition is true the loop will run and the value of variable\
    \ is increased or decreased till the time condition becomes false.\n\n### a) The\
