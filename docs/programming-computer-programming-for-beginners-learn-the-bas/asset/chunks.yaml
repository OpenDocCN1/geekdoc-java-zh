    \ `/*` and `*/` is a comment\n\nb) Online comments of C++ style. The comments\
    \ under this type begin with `//` and continue till the next line break.\n\nc)\
    \ HTML style comments begin with `<!--`\n\n**Can a warning be displayed for the\
    \ user incase the user’s is unable to execute the JavaScript code?**\n\nAns: Yes,\
    \ a warning can be displayed to user about the JavaScript incapable browsers.\
    \ The warning text can be placed between the tags `<NOSCRIPT>` and `</NOSCRIPT>`.\n\
    \nTherefore, the browsers which are JavaScript enabled will ignore everything\
    \ between these tags and the browsers which cannot execute will display your message\
    \ on the page. The message will be displayed to users who have disabled JavaScript\
