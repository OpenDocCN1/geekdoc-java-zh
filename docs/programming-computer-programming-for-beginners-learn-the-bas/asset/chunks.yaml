    \ for coding in.\n\nLet us now start learning `HTML`, `CSS` and `JavaScript`.\n\
    \n## Chapter 1: Introduction to Web Development\n\nWebsites are created for different\
    \ purposes depending upon the target audience, some are made for selling products\
    \ and some are just for providing information. Web development tools provide companies\
    \ with a platform to create their web presence. Websites give them visibility\
    \ with a wider audience. To develop a site in accordance to the requirements,\
    \ businesses hire developers. Developing a website can include anything from simple\
    \ programming to network security, adding content or web server configuration.\n\
    \nProgramming involves set of instructions which are written in a computer language\
    \ or codes. A developer needs to have a thorough knowledge of the programming\
    \ languages. Before you start learning on how to program in different languages\
    \ used on the web; it is essential to have an understanding of web development\
    \ in general.\n\n### What is Web Development?\n\nWeb development can be broadly\
    \ defined as the development of websites and web applications which will be hosted\
    \ on the Internet or the intranet. In reality, web development is used as an umbrella\
    \ term for a collection of activities such as web design, client-side coding,\
    \ server-side scripting, network security configuration and other tasks.\n\nWeb\
    \ development involves usage of scripting languages both at the client’s site\
    \ and at the server end. It ranges from creating plain text pages to complex applications.\
    \ The web development hierarchy includes; client side coding, server side coding\
    \ and database technology.\n\nMore specifically, web development can be said to\
    \ be web programming. This involves the creation of the code for making a web\
    \ application or website. With it, you can create a simple web page to a massive\
    \ social networking site such as Facebook or an eCommerce portal like Amazon.\n\
    \n## Web Development Process\n"
