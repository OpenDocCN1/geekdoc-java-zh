    In the above example script in this type of loop includes a line that repeats
    the numeric value until the condition in `while` loop is false. So if this line
    is not there then it will be an endless loop.


    ### The Hello World Example in JavaScript


    Here is the hello world example in JavaScript. This will illustrate how the language
    works and familiarize you with the syntax as well. As you will see, the language
    is quite simple.


    ```html

    <Html>

    <Body>

    <script language="javascript" type="text/javascript">

    <!--

    document.write ("Hello World!")

    //-->

    </script>

    </body>

    </html>

    ```


    ### The Syntax in JavaScript


    JavaScript is supposed to be implemented with the help of JavaScript statements.
    These statements are placed inside the `<script>`... `</script>` HTML tags in
    a web page. The `<script>` tags can be placed anywhere within the HTML document.
    The `<script>` tag will alert the browser to interpret the text between the tags
    as a script. An example of the JavaScript syntax is given below.


    ```html

    <script language="javascript" type="text/javascript">

    Code in JavaScript

    </script>

    ```

    The `script` tag has two crucial attributes. They are given below.


    1. **Language:** This attribute is used to specify which scripting language is
    being used. Of course, since you are using JavaScript, the value of this attribute
    is `javascript`. On the other hand, this attribute is rarely used these days for
    the recent versions of HTML and XHTML.

    2. **Type:** This attribute is now currently being used for indicating the scripting
    language. The value of this attribute should be set as ‘text/javascript.’


    #### Line Breaks and Whitespace


    JavaScript will ignore whitespaces. Therefore, you use newlines, tabs, and spaces
    in your scripts freely. Of course, you should be using them to format your programs
    and make them look consistent and neat. This allows the code to be read and understood
    easily.


    #### Semicolons


    Generally, semicolons are used to mark the end of statements. This is the case
    in languages like `Java`, `C++` and `C`. However, JavaScript makes semicolons
    optional in one condition. You need to ensure that each statement has been placed
    on a separate line. As long as you meet this condition, you can avoid inserting
    semicolons in the code. However, using semicolons is a good practice especially
    when you are learning to program.


    #### Case Sensitivity


    You need to ensure the proper uses of cases in JavaScript as this language is
    case-sensitive. Therefore, all keywords, function names, variables and other identifiers
    must be typed with the correct case. Consistency is vital. In JavaScript, the
    identifiers `hi` and `HI` will have different meanings.


    ### How to Place JavaScript in HTML Documents?


    One of the good things of JavaScript is that you have the flexibility to add the
    code anywhere you want in an HTML document. Nonetheless, it is an excellent idea
    to follow the preferred methods. This can improve the readability and execution
    of the JavaScript code in the HTML document. Here are the best ways to include
    JavaScript in HTML.


    1. **Inside the <head> tags**


    This option is generally used when you want the script to run when an event takes
    place. For example, you may want the script to run when the user clicks something
    somewhere. In these situations, the script will be placed inside the `<head>`
    tags as shown in the following example.


    ```html

    35. <Html>

    36. <Head>

    37. <script type="text/javascript">

    <!--

    Function sayHello () {

    Alert ("Hello World")

    }

    //-->

    </script>

    </head>

    <Body>

    <input type="button" onclick="sayHello ()" value="Say Hello" />

    </body>

    </html>

    ```


    2. **Inside the <body> tags**


    In some cases, you may need the script to run while the page loads. This is done
    to allow the script to generate the content located in the page. In this case,
    the script will have to be placed inside the `<body>` tags. In this method, you
    will not have any function that has been defined with JavaScript. You can see
    the example given below for such an inclusion of JavaScript.


    ```html

    39. <Html>

    40. <Head>

    41. </head>

    42. <Body>

    43. <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <p>Web Page</p>

    </body>

    </html>

    ```


    3. **Inside the <head> and <body> tags**


    If you want, you can combine the methods above. In other words, you can place
    your JavaScript inside both, the `<head>` and `<body>`. The following example
    illustrates how it works.


    ```html

    45. <Html>

    46. <Head>

    47. <script type="text/javascript">

    <!--

    Function sayHello () {

    Alert ("Hello World")

    }

    //-->

    </script>

    </head>

    <Body>

    <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <input type="button" onclick="sayHello ()" value="Say Hello" />

    </body>

    </html>

    ```


    4. **Inside an External File**


    Including JavaScript inside the HTML document is a good idea when you are creating
    simple web pages. However, as you create websites or complex web pages, it is
    possible that you find yourself reusing the same code in multiple locations. You
    may even end up using the same code in multiple web pages.


    As you have seen in CSS, it is possible for you to create an entirely separate
    file to keep your JavaScript code. That file should have the `.js` extension and
    be associated with the web pages that require the code. The following example
    illustrates how an external JavaScript file can be included in an HTML document.
    In this example, `filename.js` is the file used for containing the JavaScript
    code.


    ```html

    49. <Html>

    50. <Head>

    51. <script type="text/javascript" src="filename.js" ></script>

    52. </head>

    53. <Body>

    54. .......

    </body>

    </html>

    ```


    ### Events in JavaScript


    An event is an action that causes a JavaScript code to be executed. Events are
    generally triggered by the users. For example, the click of a mouse can be an
    event. Based on the events, it is possible to code a response in JavaScript. For
    example, displaying a message can be a response to an event. These responses can
    be said to be the event handlers as they handle the event taking place. In JavaScript,
    it is possible to classify events in a number of ways. After all, there are a
    huge number of them.


    #### 5. The onClick event


