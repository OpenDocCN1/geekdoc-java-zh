    ## 12. Letter Spacing

    It is used to specify space between the characters in a given text. The below
    mentioned example shows how to decrease or increase the space-


    ```css

    h1 {letter-spacing: 5px;}

    h2 {letter-spacing: -5px;}

    ```


    ## 13. Line Height

    It specifies the space between each line. Example:


    ```css

    p.small {line-height: 0.6;}

    p.big {line-height: 1.6;}

    ```


    ## 12. Text direction

    It is used to change the direction of an element. Example:


    ```css

    div {direction: rtl;}

    ```


    ## 14. Word Spacing

    It defines the spaces between words. Example:


    ```css

    H1 {word-spacing: 15px;}

    H2 {word-spacing: -10px}

    ```


    The above mentioned properties can give you a fair idea of how to stylize your
    text on a webpage. Apart from that there are many more which can be used once
    you are comfortable using the basic ones. Listed below are some of them-


    ### Font Style

    a) Font variant-switch between normal font alternatives and small caps

    b) Font variant ligatures-control which contextual forms and ligatures are used
    in the text.

    c) Font variant numeric- controls the usage of alternate glyphs for fractions,
    numbers and ordinal makers.

    d) Font stretch- by using this option one can switch between all possible stretched
    versions of a given font.


    ### Text layout Styles

    a) White space- it defines how whitespace and related line breaks within the element
    are handled.

    b) Word break-specifies whether lines are to be broken within the words.

    c) Word wrap-it defines whether browser may or may not break lines within the
    words to avoid overflow.

    d) Writing mode- It specifies whether text lines are laid out vertically or horizontally
    and the direction of subsequent lines.


    ### Shortcuts in CSS

    Now that we have learned the basics of CSS, we are writing certain shortcuts of
    the language which can be used with practice. These shortcuts can make your code
    easier to read, load faster and of high quality. Shortcuts are a great way to
    speed up the process. However, one should be careful while using them since if
    not used in the proper manner it can give you negative results. Therefore, always
    analyze whether using such shortcuts would be beneficial or not.


    #### Property Grouping

    This shortcut enables set of values for a set of properties to be defined in one
    line instead of different lines.


    Example: using fonts


    | Without grouping | With grouping |

    | :--- | :--- |

    | h1{font-weight: normal;font-size: 20px;line-height: 12px;font-family: georgia,
    tahoma, verdana;} | h1 {font: normal 20px/12px Georgia, Tahoma, verdana;} |


    #### Typing on one line

    Everyone has a different approach on how to write codes but one thing is common
    for all, lesser number of tabs and spaces you use, the faster your code will load.
    The idea is to create a highly readable code without too much white space. Typing
    a set of properties on one line can be a solution to this.


    Example:


    | Typing in multiple lines | Typing in single line |

    | :--- | :--- |

    | p{color: #4f39ac;background: #f4f4f4;line-height: 16px;} | P{color: 4f39ac;
    background: #f4f4f4; line-height: 16px;} |


    #### Color value shortening

    Instead of using the full 6 digit value while declaring the hexadecimal color
    value for an element, you can shorten it to three. That is possible if color code
    consists of 3 pairs of repeating digits.


    Example:


    | | Color value shortening shortcut |

    | :--- | :--- |

    | body {background: #gggggg;}h1 {background: #aa5566;}p {background: #112233;}#menu
    {background: #ggaa44;} | body {background: #ggg}h1 {background: #a23;}p (background:
    #123;}#menu {background: #ga4;} |


    #### Using zeros

    You don’t need to use pt, px, em or any other measurement types when you use zero


    Example:


    ```css

    #menu {margin:20px 0;}

    ```


    ## Some tips and tricks for using CSS

    Try and use shorthand CSS codes which are cleaner and easier to understand.


    Always write code for standards compliant browser first. After that you can correct
    it for IE at the end. Never do it the other way around since it increases the
    probability of forward compatibility.


    The `class` and `ID` selectors often confuse beginners. In CSS language `class`
    is represented by a `.` whereas `#` represents `ID` selector. In short ID is used
    on style that is unique and cannot repeat itself; on the other hand class can
    be re-used.


    It is always better to get an instant preview of the layout while altering the
    CSS. This way CSS styles can be understood and debugged better.


    If in a containing block with a fixed height you want to vertically center the
    text than simply set the line-height of the text to be same as the height of the
    containing block.


    For creating fluid images set the max-width on the images to be 100%


    When there are conflicting instructions are sent to a single html element by two
    or more CSS selectors than a choice must be made as to which styles to apply.
    This can be done by using CSS specificity calculations which are expressed in
    the form of `(a,b,c,d)`.


    Any image that is wrapped with a link will have a border around it. So to remove
    the border you can do the following:


    ```css

    a image {border: none} or a image {border:0}

    ```


    ### FAQ’s on CSS


    **Why are style sheets required?**

    Ans: Style sheets are required since they provide a great degree of control on
    layout and display. They reduce the amount of format required.


    **How do we link the external style sheet?**

    Ans: It is a template document or a file which can be linked with number of HTML
    documents. It is essential that files should have extension `.css`. LINK element
    is used to link file with HTML documents.


    **How is ID selector different from class selector?**

    Ans: ID selectors are unique whereas one class selector can be applied to multiple
    elements.


    **What is the difference between block elements and inline elements?**

    Ans: The inline elements takes up only the necessary width whereas block elements
    take up the entire width which is available and have a line break.


    **What fonts are common across all platforms?**

    Ans: Five basic font families are recognized across all platforms. They are: sans-serif,
    serif, monsospace, cursive and fantasy.


    **Can comments be included in Style sheets?**

    Ans: Yes, comments can be included anywhere in the style sheets provided there
    is a whitespace.


    **Does CSS have any limitations?**

    Ans: Yes, there are few limitations

    a) There are no expressions and column declaration

    b) Ascending by selectors is not possible

    c) Targeting specific text is not possible

    d) There are limitations in vertical control


    **What is the float property?**

    Ans: Under this property the image can be moved left or right along with the text
    which is wrapped around it.


    **Can we remove gap under the images and how?**

    Ans: Yes, the gap under the images can be removed since images are treated as
    text as they are inline elements.

    ```css

    img {display:block;}

    ```


    **How can one add comments in CSS?**

    Ans: Comments can be added by using `/*` and `*/` in CSS.


    As you may have realized, CSS is quite an easy an language to learn. It is designed
    to define the overall appearance of not only the web pages but the structure of
    both text and the elements. This chapter would have given you an insight into
    how to create web pages that offer rich experience to the users by using cutting
    edge and standard CSS techniques.

