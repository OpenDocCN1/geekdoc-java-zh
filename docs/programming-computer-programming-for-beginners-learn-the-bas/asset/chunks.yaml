  raw: 'Before you start building a website the first and foremost is that you must
    understand what information or message you are trying to pass on to your viewers
    or customers. What is it that they are expecting to see in terms of the content?
    How can you make the content user friendly easy to navigate? Once all the front
    end design aspects are clear, one must start working on the backend of the website,
    which would include how to host, what architecture to use, what is the expected
    traffic load on the website and how can we setup a infrastructure to ensure that
    the overall built of the website is robust. Finally one must ensure that the website
    can be opened on various types of browsers / devices like smart phones, tablets
    etc and is easily searchable through search engines. 


    There are number of steps involved in the web development process but broadly
    these can be classified into five phases.


    1.  Discovery- The first step in developing a website is to understand the requirements
    of the business which includes; the purpose of creating the site, target audience
    and the content of the site.


    2.  Definition- The information gathered in step one has to be compiled together
    to define a site map or plan for the website. It involves creation of an easy
    to navigational system or user interface.


    3.  Design- This step involves crafting a user experience. The visual appeal of
    the site depends upon the template you choose and it should always be done keeping
    in mind the target audience. For example: a website targeting teenagers will have
    different elements than a website for a financial institution.


    4.  Development- In this step the final design is implemented to create an actual
    functional site. Content management system and programming codes are used to develop
    the site.


    5.  Deployment- The complete functionality of the website is tested and once the
    business is satisfied with the final product the web site files are uploaded to
    the client’s server.


    **Aspects of Web development**


    Web development can be broadly classified into two separate sections. They are
    front-end development and back-end development. In order to have a fully functional
    website, both of these processes need to go hand in hand.


    **Front-end Development**: Also known as client-side coding, in this development,
    you will be creating what the user is going to see when a web application is loaded.
    This includes the design and the content along with how the user is going to interact
    with it. For front-end development, you need to use HTML, JavaScript and CSS.


    HTML is the code used for turning text into a web page. All web pages are written
    in HTML, and this language is also pivotal for all web applications. CSS is used
    to set the style rules, and it determines how a web page will appear. JavaScript
    is used to adding functionality to web pages and make them more interactive.


    **Back-end**  **Development**: This is also referred to as server-side coding.
    It determines what is happening in the server of the web page. In other words,
    the user does not get to see this activity, but it can affect the website. A common
    activity in back-end development is the creation of a database for the generation
    of the front-end.


    A variety of coding languages and frameworks are used in backend development.
    PHP, ASP.NET, Ruby on Rails, Python, Node.js and Java are some of them.


    **Pros and cons of using Programming languages**


    Programming languages are used to create programs for building a website or a
    web application. Most of the programming languages are easy to learn. They help
    you in adding dynamic and interactive activities to the web page. Complex tasks
    can be performed in relatively fewer steps.


    The downside of programming language is that bugs while coding can be annoying
    and difficult to resolve sometimes. A web developer needs to know the syntax of
    programming language like the back of their hand. Hence, a lot of hard work and
    a good memory are essentials. Moreover one needs to build upon the speed for programming
    otherwise it is a very time consuming activity.


    **Why Learn Web Development?**


    Of course, the most common reason to start learning web development is to become
    a web developer yourself. You will be able to create web pages and websites for
    people to view over the internet. However, that is not the only reason to learn
    web development. There are many reasons and we have listed a few of them:


    1.  One of the features of web development is that it is comparatively easy to
    learn. In fact, many programmers claim that web development is an excellent choice
    for those who wish to start learning to program. If you are interested in becoming
    a programmer, web development can provide you with a foundation in which to do
    so.


    2.  Learning web development can give you good job prospects. Businesses want
    to make an effective presence and for that they are under pressure to offer high
    quality websites with e-commerce and communication capabilities. Hence more and
    more companies look out for web developers who can deliver the best.


    3.  As a web developer you get an opportunity to create new cool things. You just
    need to have a laptop and an internet connection with knowledge of programming
    language you can create with your imagination.


    4.  Web development is not about web anymore. When companies think about creating
    websites today, they also think about social media and mobile technology. There
    is a surge in usage of smart phones, internet TV, tablets and many other devices
    hence the developer needs to take into account all these. This expands the reach
    of developers.


    5.  Web development is quite flexible and has lot of facets such as the front
    end, back end, content management systems, e-commerce, mobile web and more. This
    gives professionals a wide range of opportunities and at the same time new tools
    are making the process of enhancing the skills much easier.


    Now that you know what web development is about let us now start with the actual
    languages of HTML, CSS and JavaScript.


    **Chapter 2: Learning HTML5: The Language of the Web**


    HTML is the core of the web. It is a standard that has become accepted by everyone.
    As such, understanding it will be the key to developing web pages and web applications.


    Nearly all computer applications that read and write files make use of a special
    file format. For example, the Notepad application in Windows can understand and
    use ‘.txt.'' files. These files will contain all the instructions on how the document
    should be displayed when opened along with the contents of that document and other
    data. HTML functions in a similar manner. This language describes the content
    of a web document.


    **What is HTML?**


    HTML is an abbreviation for Hyper Text Markup Language. It is the language used
    to create web pages. In fact, HTML is a cornerstone technology of the modern internet.
    Apart from web pages, it is used for creating user interfaces for the web and
    mobile applications.


    It consists of a set of codes or markup symbols which are inserted into a web
    page. The code informs the web browser how the words and the images on a web page
    should be displayed to the user. Each single markup code is known as an element
    or a tag. A web browser can read the HTML file and then render it into a visible
    web page. It also describes the structure of a website in a semantic manner. As
    a result, HTML is not a true programming language but a markup language.


    **The History of HTML**


    The histories of the internet and the HTML are completely intertwined with each
    other having been developed together. Tim Berners-Lee developed what was to be
    called HTML for use in the first website and the first web server in the world.
    It was written sometime in 1990 and became available to the public 1991\. Over
    the years, HTML has undergone several iterations. It was in 2000 that HTML was
    officially standardized as the markup language to be used for developing web pages
    for the Internet.'
