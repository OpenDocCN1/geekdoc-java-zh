  trans: "\n\n## 数组\n它们与变量非常相似，不同之处在于可以在一个名称下存储多个表达式和值，因此成为一种强大的数据类型。只要在作用范围内，数组中可以存储的数据量没有限制。只要在脚本中进行了声明，就可以访问任何时间点的任何项的任何值。相同类型的数据可以存储在同一个数组中，并且该特定数组可以被分配一个与其所包含的项相关的名称。\n\
    \n让我们来看一个例子：\n\n```\nvar shapes = new Array(“rectangle”, “square”, “triangle”);\n\
    var colors = new Array( “red”, “pink”, “orange”);\n```\n\n要访问数组中的任何项，你必须使用它的 ID。它是该项在数组中的位置。数组的\
    \ ID 始终从 0 开始而不是 1，这在开始可能会让人困惑，但通过练习，你会发现这个概念很容易学习。ID 按升顺序工作；例如 0,1,2,3 等。下面是一个用于理解这一概念的示例——\n\
    \n```\nvar colors = new Array( “red”, “pink”, “green”);\ndocument.write( “red:\
    \ “+colors[0]);\ndocument.write( “pink: “+colors[1]);\ndocument.write( “green:\
    \ “+colors[2]);\n```\n\n在数组中，你也可以给特定位置赋值。例如：\n\n```\nvar colors = new Array ();\n\
    colors [0] = “red”;\ncolors [1] = “pink”;\ncolors [2] = “green”;\ndocument.write\
    \ (“pink: “+colors [2]);\n//将 pink 更新为 blue\nColors [1] = “blue”;\ndocument.write\
    \ (“blue: “+ colors [2]);\n```\n\n## 对象\n对象用大括号编写。对象的属性写为 –：\n- 名称: 值对，并用逗号分隔\n\
    \n对象的示例：\n\n```\nVar person = {first name: “Ryan”, last name: “Booth”, age:35,\
    \ eyeColor: “brown”};\n```\n\n上面的示例有四个属性：年龄、眼睛颜色、名字和姓。\n\n## 运算符\n在 JavaScript\
    \ 中执行任何操作，我们需要运算符。它们包括比较、减法、加法等许多其他运算符。有四种基本的运算符：\n- 赋值\n- 算术\n- 逻辑\n- 比较\n\n\
    ### 算术运算符\n这些运算符执行基本的数学运算，如除法、加法、乘法、减法等。\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| *\
    \ | 乘 |\n| - | 减 |\n| + | 加 |\n| / | 除 |\n| % | 取余 (模) |\n| -- | 递减 |\n| ++ |\
    \ 递增 |\n\n### 赋值运算符\n它们用于给 JavaScript 中的变量赋值。下面列出了所有可赋值运算符：\n\n| 运算符 | 描述 |\n\
    | :--- | :--- |\n| = | 等于 |\n| += | 变量赋值加值 |\n| -= | 变量赋值减值 |\n| *= | 变量赋值乘值 |\n\
    | /= | 变量赋值除值 |\n| %= | 变量赋值取模值 |\n\n**示例：**\n```\nvar num =20;\ndocument.write(“The\
    \ value of num is: “+num);\n//将 num 的值更新为 30\nnum= (num+10);\ndocument.write(\
    \ “ The new value of num is:+num);\n```\n\n### 比较运算符\n这些运算符建立变量或其值之间的关系。它们被用于条件语句（我们稍后会学习这个），通过比较变量或其值来创建逻辑。这有助于判断语句是真是假。比较运算符的类型有：\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| < | 小于 |\n| > | 大于 |\n| == | 等于 |\n| != | 不等于\
    \ |\n| === | 等于，在对象和值类型上 |\n| >= | 大于或等于\n| <= | 小于或等于 |\n\n### 逻辑运算符\n它们组合了比较运算符，通常用于条件语句。逻辑运算符的类型有：\n\
    \n| 运算符 | 描述 |\n| :--- | :--- |\n| ! | 非 |\n| && | 与 |\n| || | 或 |\n\n## 3. 条件语句\n\
    与其他编程语言一样，JavaScript 中提供了不同类型的条件语句。它们允许你定义一个条件，其结果决定了将执行的操作。它们允许你的程序根据条件的结果做出决定并执行相关操作。\n\
    \n为了在编程语言中创建任何类型的逻辑，条件语句是其基础。在 JavaScript 中，条件语句可以用四种方式编写。\n\n| 语句 | 描述 |\n| :---\
    \ | :--- |\n| Switch | 在多个脚本中执行一个 |\n| If | 如果特定条件的 Result 为真，则执行脚本 |\n| If..else\
    \ | 此条件语句中有两段代码。如果条件为真，if 语句执行脚本，而当条件为假时，执行 else 语句下的代码 |\n| If..else if..else\
    \ | 如果无限个条件中的某一个为真，则执行脚本；如果所有条件都为假，则执行另一个脚本。 |\n\nif…else 语句的基本语法如下所示。\n\n```javascript\n\
    if (expression) {\n    如果 expression 为真，则执行的语句\n}\n```\n\n示例：\n\n**if**\n```javascript\n\
    var num=20;\nif (num==10)\n{\n  document.write( “num is equal to 10”);\n}\n```\n\
    \n**if..else**\n```javascript\nvar num=20;\nif (num==10)\n{\n  document.write(\
    \ “num is equal to 10”);\n}\nelse\n{\n  document.write( “num is not equal to 10”);\n\
    }\n```\n\n**if..else if..else**\n```javascript\nvar num=20;\nif (num==10)\n{\n\
    \  document.write( “num is equal to 10”);\n}\nelse if (num==20)\n{\n  document.write(\
    \ “num is equal to 20”);\n}\nelse\n{\n  document.write( “num is not equal to 10\
    \ or 20”);\n}\n```\n\n**switch**\n```javascript\nvar num=20;\nswitch (num)\n{\n\
    \  case 10:\n    document.write(“num is equal to 10”);\n    break;\n  case 20:\n\
    \    document.write(“num is equal to 20”);\n    break;\n  default:\n    document.write(“num\
    \ is not 10 or 20”);\n}\n```\n\n## 5. 函数\n函数是脚本的容器。它们仅通过调用函数或事件执行。因此，它们在浏览器最初加载时不会执行，而是执行网页部分的脚本。\n\
    \n结构化函数时使用 function 单词后跟一个空格。函数的名称可以是任何内容；然而，应确保给定的名称与其将执行的任务相关。示例：\n\n```javascript\n\
    var num =20;\nfunction changevariablevalue()\n{\n  num=21;\n}\nchangevariablevalue();\n\
    document.write( “num is:+num);\n```\n\n## 6. 循环\n循环用于迭代数组并在访问值的同时执行脚本。循环通常包含一个分配了数值的变量。该变量随后比较运算符与其他值进行比较。之后，数值增加或减少。循环中的比较通常决定变量的初始值是大于还是小于另一个数值。因此，只要条件为真，循环就会运行，变量的值增加或减少，直到条件变为假。\n\
    \n### a) for 循环\nfor 循环允许在满足特定条件时重复执行相同的代码块语句。for 循环的语法如下。\n\n```javascript\n\
    for (初始表达式; 条件表达式; 循环表达式)\n{\n    语句\n}\n```\n\n**示例：**\n\n"
