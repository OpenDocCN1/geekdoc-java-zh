    This chapter must have given you an insight into the basics of HTML and its functionalities.
    Now let us look at some frequently asked questions on this programming language
    for more clarity on the topic.


    ## FAQ’s


    ### What is the purpose of HTML5?

    Ans: HTML5 was designed to overcome the shortcomings of `XHTML`, `HTML4` and `HTML
    DOM` level2. The language focuses on delivering high quality content without additional
    plugins. The new structural element tags of the language give a better semantic
    support to the overall web page structure. The error handling has been simplified
    and it also provides backward compatibility. HTML5 can be implemented across platforms
    such as tablets, Smart phones and PC.


    ### Can HTML5 specifications be implemented on all types of browsers?

    Ans: As of now, no browser supports all the aspects of this language. Therefore
    it becomes imperative for the developer to ensure that the aspect which he may
    be using will be supported by the browser on which the content is to be displayed.


    ### Are HTML tags and elements different?

    Ans: Elements in HTML communicate to the browser how to deliver text. Whereas,
    when elements are surrounded by `<>` (angular brackets) they become tags.


    ### What do you mean by DOCTYPE and what is the new form for it?

    Ans: This term tells the browser what kind of HTML is used on a web page. Browsers
    use `DOCTYPE` to determine as to how to make a web page. The new form is `<!doctype
    html>`.


    ### Describe the correct usage of header, section, article and footer in HTML5?

    Ans: Header- It is used to contain navigational and introductory information about
    a section of a given page. This information can be either on author’s name, date,
    time, section heading, table of contents or any other navigational information.


    Section- It is a flexible container that holds the content and shares common information.


    Article- It holds self-contained composition which can be recreated independently
    outside the page without losing its meaning. Example: blog posts, news stories
    etc.


    Footer- It contains information which is to be displayed at the end of the content
    and may also contain additional information about that section. Example: copyright
    information, related links etc.


    ### What kind of media elements are supported by HTML5?

    Ans: It supports both `audio` and `video` tags.


    ### Are there any new image elements included in HTML5?

    Ans: Yes, there are two new image elements they are; `WebGl` and `Canvas`. `Canvas`
    contains graphics whereas Web Graphics Language (`WebGL`) is a free cross platform
    which is used for generating 3D graphics in browsers.


    ### Why do we need data--attributes?

    Ans: This attribute is a new addition to the language which assigns custom data
    to an element. This element is good to store private or sensitive data that is
    exclusive to an application or a page and there are no matching elements and attributes
    for it.


    ### What are some standard API’s that comes with HTML5?

    Ans: Some of them are: `Text Track`, `Media`, `Application Cache`, `Command`,
    `User Interaction`, `Data Transfer`, `Constraint Validation` and the `History
    API`.


    ### What is the difference between HTML browser cache and HTML5 application cache?

    Ans: Caching in HTML5 application creates an offline version and stores files
    such as images, HTML files, CSS and JavaScript locally and thus increases the
    speed of the website as compared to the traditional HTML cache.


    Overall, HTML 5 is an exciting programming language for creating powerful browser
    based applications. It lets you format the text, create links, add graphics, input
    tables, forms, frames etc. and save it in a text file that any browser and read
    and display.


    Now that you have gained insight into HTML5 you can easily use and implement this
    programming language for creating websites.


    ## Chapter 3: Understanding CSS: Stylizing the Internet


    The function of HTML is to create web pages. However, it is incapable of ensuring
    a proper presentation of the content. In order to make the web page stylish and
    improve its presentation aspect, you need to use a style sheet language such as
    `CSS`.


    ### What is CSS?

    What CSS stands for Cascading Style Sheets is a design language which simplifies
    the process of ensuring that your web pages are presentable. It takes care of
    the looks of the web page. With it, you can control various aspects of the page
    such as the font style, the text color, column sizes, paragraph spacing, layout,
    background images or colors and other designs. You can also enable variations
    in the display to cater to different screen sizes and devices.


    `CSS` is generally used for designating the visual style of web pages and, also,
    user interfaces that have been written in `HTML` or `XHTML`. However, you can
    also use the language for all kinds of XML document types.


    `CSS` was created to allow the document content to be separated from document
    presentation including colors, fonts, and layout. By separating them, some things
    can be improved upon such as content accessibility. It also enables enhanced control
    and flexibility in various aspects of the presentation. It also allows multiple
    `HTML` files to share the same formatting.


    The separation also makes it possible to deliver the same page in a range of styles
    to suit different rendering methods such as in print, on-screen and by voice.
    It also becomes possible for the users to create a different `CSS` file to override
    the one specified by the creator of the web page.


    Currently, the latest version of `CSS` in use is `CSS3`. `CSS3` brings quite a
    few new features to the language while building upon the previous version. We
    will be concentrating only on `CSS3` in this book.


    ### History of CSS

    Hakon Wium Lie first proposed `CSS` on 10^(th) October 1994. There were many other
    style sheet languages which were proposed around the same time. Finally `CSS1`
    was released in the year 1996 and Microsoft Internet Explorer became the first
    browser to support `CSS`. This language was specifically developed to hold the
    content on the web while HTML was there to create the documents on the World Wide
    Web.


    The concept of style sheets was not new. However, the existing languages required
    style sheets to come from different sources on the web whereas on the other hand
    `CSS` influenced the document style by way of cascading styles. The term cascading
    means the ability to combine multiple `CSS` files to decide a style for one page.


    Let us look at some advantages and disadvantages of `CSS`


    ### The Advantages Offered by CSS

    There are some considerable advantages in using `CSS`. Some of them have been
    mentioned as follows.


    - **Timesaver**: One of the biggest advantages of `CSS` is that it saves a considerable
    amount of time in web development. A `CSS` can be written only once for an `HTML`
    page. It can then be reused over and over again for multiple `HTML` pages. A style
    can be defined for each element in `HTML` and then applied to a variety of web
    pages.

    - **Easy Maintenance**: `CSS` allows you to maintain multiple pages very easily.
    You can easily make a global change by changing the style in `CSS`. The corresponding
    element in all the `HTML` pages will get updated automatically.

    - **Faster Loading Pages**: It is not necessary to define tag attributes in `HTML`
    multiple times when `CSS` is being used. One `CSS` rule needs to be written for
    a tag, and it can be applied to all occurrences of that specific tag. This decreases
    your code considerably which leads to faster downloading times for each page.

    - **Better Styles**: Compared to `HTML`, `CSS` offers a much bigger range of attributes.
    This allows you to improve the looks of the `HTML` page considerably more than
    what would have been possible if you had used HTML attributes only.

    - **Caching**: `CSS` allows web applications to be stored locally by means of
    an offline cache. This allows you to view websites offline. The cache also enables
    faster loading of the pages and improves the overall website performance as well.

    '
