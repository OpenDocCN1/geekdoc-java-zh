    本章应该已经让你对 HTML 的基础及其功能有了初步了解。现在，让我们来看关于这种编程语言的一些常见问题，以便对该主题有更清晰的认识。


    ## 常见问题解答 (FAQ)


    ### HTML5 的用途是什么？

    答：HTML5 是为了克服 `XHTML`、`HTML4` 和 `HTML DOM` 2 级的缺陷。该语言专注于在不使用额外插件的情况下提供高质量内容。该语言新的结构化元素标签为整个网页结构提供了更好的语义支持。错误处理被简化，并且还提供了向后兼容性。HTML5
    可以在平板电脑、智能手机和电脑等平台上实现。


    ### HTML5 规范可以在所有类型的浏览器上实现吗？

    答：到目前，还没有浏览器支持该语言的所有方面。因此，开发者必须确保他可能使用的特性将被显示该内容的浏览器所支持。


    ### HTML 标签（tags）和元素（elements）有什么区别？

    答：HTML 中的元素（elements）告诉浏览器如何呈现文本。而当元素被 `<>`（尖括号）包裹时，它们就变成了标签（tags）。


    ### 你说的 DOCTYPE 是什么意思？它的新形式是什么？

    答：这个术语告诉浏览器网页上使用了哪种 HTML。浏览器使用 `DOCTYPE` 来决定如何制作网页。新形式是 `<!doctype html>`。


    ### 描述 HTML5 中 header、section、article 和 footer 的正确用法？

    答：Header - 它用于包含给定页面某个部分的导航和介绍性信息。这些信息可以是作者姓名、日期、时间、章节标题、目录或任何其他导航信息。


    Section - 它是一个灵活的容器，用于存放内容并共享共同信息。


    Article - 它包含自包含的成分/作品，这些作品可以在页面之外独立地重新创建，而不会丢失其含义。例如：博客文章、新闻故事等。


    Footer - 它包含要显示在内容末尾的信息，也可能包含关于该部分的额外信息。例如：版权信息、相关链接等。


    ### HTML5 支持哪些多媒体元素？

    答：它支持 `audio` 和 `video` 标签。


    ### HTML5 中包含任何新的图像元素吗？

    答：是的，有两个新的图像元素，它们是：`WebGl` 和 `Canvas`。`Canvas` 图形，而 Web 图形语言 (`WebGL`) 是一种免费的跨平台技术，用于在浏览器中生成
    3D 图形。


    ### 为什么我们需要 data--attributes（数据属性）？

    答：该属性是该语言的新新增，用于为元素分配自定义数据。该元素适合存储应用程序或页面独有的私有或敏感数据，并且这些数据没有匹配的元素和属性。


    ### HTML5 带有哪些标准 API？

    答：其中一些：`Text Track`、`Media`、`Application Cache`、`Command`、`User Interaction`、`Data
    Transfer`、`Constraint Validation` 和 `History API`。


    ### HTML 浏览器缓存和 HTML5 应用缓存（application cache）有什么区别？

    答：HTML5 缓存创建一个离线版本，并将图像、HTML 文件、CSS 和 JavaScript 等文件存储在本地，与传统的 HTML 缓存相比，这提高了网站的速度。


    总的来说，HTML 5 是一种用于创建强大的浏览器应用程序的令人的编程语言。它允许你格式化文本、创建链接、添加图形、输入表格、表单、框架等，并将其保存到文本文件中，任何浏览器都可以读取并显示。


    现在你已经对 HTML5 有了了解，可以轻松地使用和实现这种编程语言来创建网站。


    ## 第 3 章：理解 CSS：样式化互联网


    HTML 的功能是创建网页。然而，它无法确保内容的恰当呈现。为了让网页样式化并改进其呈现方面，你需要使用如 `CSS` 的样式表语言。


    ### 什么是 CSS？

    CSS 代表 Cascading Style Sheets（级联样式表），是一种简化确保你的网页可呈现过程的设计语言。它负责网页的外观。通过它，你可以控制页面的各个方面，如字体样式、文本颜色、列宽、段落间距、布局、背景图像或颜色或其他设计。你还可以启用显示变化以适应不同的屏幕尺寸和设备。


    `CSS` 通常用于指定用 `HTML` 或 `XHTML` 编写的网页以及用户界视觉样式。你也可以将该语言用于所有的 XML 文档类型。


    `CSS` 的创建允许文档内容与文档呈现（包括颜色、字体和布局）分离。通过将它们分离，可以改进某些方面，例如内容的可访问性。它还为呈现的各个方面提供了增强的控制和灵活性。它还允许多个
    `HTML` 文件共享相同的格式。


    分离使得能够以一系列样式交付相同的页面，以适应不同的渲染方法，例如打印、屏幕显示和语音。用户创建一个不同的 `CSS` 文件来覆盖网页创建者指定的样式也变得变得可能了。


    目前，正在使用的 `CSS` 最新版本是 `CSS3`。`CSS3` 在之前版本的基础上为该语言引入了许多新功能。我们在本书中将只关注 `CSS3`。


    ### CSS 历史

    Hakon Wium Lie 在 1994 年 10 月 10 日首次提出了 `CSS`。在同一时期还提出了许多其他样式表语言。最后 `CSS1` 于 1996
    年发布，微软 Internet Explorer 成为第一个支持 `CSS` 的浏览器。这种语言是专门为在网络上存放内容而开发的，而 HTML 是为了在网络上创建文档。


    样式表的概念并不新。然而，现有的语言要求样式表来自不同的来源，而另一方面，`CSS` 通过级联的方式影响文档样式。级联意味着能够结合多个 `CSS` 文件来决定页面的样式。


    让我们来看看 CSS 的一些优点和缺点


    ### CSS 提供的优势

    使用 `CSS` 有一些明显的优势。其中一些提到如下：


    - **节省时间 (Timesaver)**：`CSS` 的最大优势之一是它在 Web 开发中了大量时间。`CSS` 只需要为 `HTML` 页面编写一次。它可以重复用于多个
    `HTML` 页面。可以为 `HTML` 中的每个元素定义样式，然后应用于各种网页。

    - **易于维护 (Easy Maintenance)**：`CSS` 允许你轻松地维护多个页面。你可以通过更改 `CSS` 中的样式来进行全局更改。所有
    `HTML` 页面中相应的元素将自动更新。

    - **快速加载 (Faster Loading Pages)**：使用 `CSS` 时，无需在 `HTML` 中多次定义标签属性。只需要为标签编写一条 `CSS`
    规则即可适用于该特定标签的所有之处。这大大减少了你的代码，从而加快每个页面的下载速度。

    - **更好的样式 (Better Styles)**：与 `HTML` 相比，`CSS` 提供了范围更大的属性。这允许你改进 `HTML` 页面外观的效果比只使用
    HTML 属性大得多。

    - **缓存 (Caching)**：`CSS` 允许通过本地缓存存储 Web 应用程序。允许你离线查看网站。缓存还可以加快页面的加载并提高网站的整体性能。


