    ### b) The while loop


    With the `while` loop, it becomes possible to control the number of times the
    loop is executed. In other words, this loop is used when you know the number of
    times a loop needs to be executed. As such, you need to make sure that loop is
    written properly so that it does not get repeated infinitely. The syntax of the
    `while` loop is given below.


    ```

    32. While (expression) {

