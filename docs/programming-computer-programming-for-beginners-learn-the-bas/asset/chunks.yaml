  trans: "\n\n在学习更高级的技能时，你应该不会遇到什么问题。事实上，你会发现对网页进行基础层面的样式化非常容易。\n\n# 第 4 章：学习 JavaScript：让网页更具交互性\n\
    \n到目前为止，你已经学习了如何使用 HTML 创建基础网页。你还知道如何在 CSS 的帮助下让你的网页变得美观。然而，对于现代网页来说，这远远不够的。如今，网站需要具有交互性。为了实现这一点，你需要引入\
    \ `JavaScript`。\n\n## 什么是 JavaScript？\n\n`JavaScript` 是一种动态编程语言。当与 HTML 配合使用时，它可以为网页提供动态交互性。然而，`JavaScript`（简称\
    \ `JS`）主要用作 HTML 文档中的脚本语言。这种语言不需要不断下载，并且可以轻松运行。它通常用于测验和投票。\n\n## 理解脚本语言\n\n在我们学习所有\
    \ `JavaScript` 之前，我们需要理解什么是脚本。它是一系列语句，为执行某些特定任务提供指令。通常情况下，脚本语言比结构化语言更容易学习，代码编写速度也更快。其他脚本语言的示例还有：`Python`、`PHP`、`Tcl`\
    \ 等。这些语言可以根植于 HTML 中，通常用于为网页添加功能，如图形显示或不同的菜单样式。脚本语言可以是客户端的，也可以是服务器端的。在客户端脚本语言下，用户看到的数据会受到影响；而在服务端脚本语言中，数据是在服务器的数据库中进行处理的。\n\
    \n`JavaScript` 可用于向用户提供响应，甚至启动幻灯片。通过像 `JavaScript` 这样的脚本语言，基础网页可以转变为面向用户的生动平台。\n\
    \n## JavaScript 的历史\n\n`JavaScript` 创建于 1995 年，用于在网页浏览器 `Netscape Navigator` 中。这种语言的原始名称是\
    \ `Mocha`，由 Netscape 创始人 Marc Andreessen 命名。在当年的晚些时候，名称被更改为 `LiveScript`，在获得商标许可后，被命名为\
    \ `JavaScript`。该语言的第一个商标版本于 1997 年发布，名称为 `ECMAScript`。\n\n今天，`JavaScript` 已进入了完全全新的演进阶段。根据现代浏览器的发展，有了许多创新、标准化和新开发。\n\
    \n## JavaScript 的特性\n\n1. **浏览器支持** - 大多数浏览器都接受这种脚本语言，因此不需要额外的插件。\n2. **可以在服务器端和客户端同时使用**\
    \ - 用户实际上可以在运行时更改网页的结构，因为 `JavaScript` 能够访问 `DOM`（文档对象模型）。因此，它可以用于为网页添加不同的效果。此外，它也可以在服务器端使用。\n\
    3. **函数式编程语言** - 在这种语言中，函数可以像其他数据类型一样赋值给变量。此外，函数可以接受另一个函数作为参数。\n4. **支持对象** -\
    \ 它是一种面向对象的语言，使其易于学习和使用。\n5. **其他特性 –**\n    a) 它是一种区分大小的脚本语言。\n    b) 它可以根据计算机的时钟时间显示信息或提取正确数据。\n\
    \    c) 可以在自定义的窗口中打开页面，在其中你可以指定是否显示菜单行、浏览器按钮、状态栏或其他任何内容。\n    d) 可以在不使用服务器程序的情况下随机显示内容。\n\
    \    e) `JavaScript` 中的所有语句都以分号结束。\n\n## JavaScript 提供的优势\n\n`JavaScript` 是最多功能且又简单有效的语言。在我们学习了它广泛的用途和扩展功能之后，现在我们将看看该语言提供的一些优势。`JavaScript`\
    \ 为用户提供了一系列利益，其中一些如下：\n\n1. **简单性**：`JavaScript` 与 `HTML` 和 `CSS` 一样，非常容易学习。此外，你也可以同样轻松地开始实现\
    \ `JavaScript` 代码。它的语法非常简单，并且接近编写英语。`JavaScript` 使用 `DOM` 模型，该模型对页面上的各种对象有许多预定义的功能。因此，为特定目的开发脚本变得非常容易。\n\
    2. **速度**：`JavaScript` 在客户端执行。结果是所有代码函数都可以立即执行。不需要联系服务器并等待响应。这使得 `JavaScript`\
    \ 运行得非常快。\n3. **多功能性**：`JavaScript` 与许多其他语言兼容。事实上，无论文件扩展名如何，将 `JavaScript` 插入到任何网页中都是可行的。你还可以在用\
    \ `PHP`、`Perl` 和其他语言编写的脚本中使用 `JavaScript`。因此，`JavaScript` 可用于广泛的领域。\n4. **API\
    \ 可用性**：应用程序编程接口（简称 `APIs`）的存在为 `JavaScript` 提供了一系列功能。这包括设置 `CSS` 样式、生成音频样本以及动态创建\
    \ `HTML` 等。虽然这些 `APIs` 内置在不同的网络浏览器中，但也有第三方 `APIs`，允许你整合来自其他网络属性的功能，如 `Facebook`\
    \ 这样的社交网络。\n5. **扩展功能 –**：`JavaScript` 有第三方插件，如 `Greasemonkey`。该插件允许开发者编写该语言的片段，这些片段可以在所需的页面上执行以扩展其功能。例如，如果你想为网站添加一个功能，你可以自己编写并使用此插件实现在网页上。\n\
    \n## JavaScript 的缺点\n\n从理论上讲，这种语言对开发者非常有益，但在实践中它也有缺点：\n\n1. **安全性** – 一旦编写好的 `JavaScript`\
    \ 代码段附加到网页上，它们就会在客户端立即执行，因此可能被用来过度利用用户的系统。虽然根据现代网页标准设置了某些限制，但恶意代码仍然可以执行。\n2. **不一致性\
    \ –** `JavaScript` 可能会由不同的布局引擎进行渲染，导致在界面和功能方面存在不一致。然而，最新版本的 `JavaScript` 已根据通用标准进行了调整，但仍然存在某些差异。\n\
    3. **执行速度慢**：该语言中复杂的脚本需要较长的启动和运行时间。\n\n## 使用 JavaScript 可以做什么？\n\n自诞生以来，`JavaScript`\
    \ 在 Web 开发者中一直非常，因为使用 `JavaScript` 可以做很多事情。事实上，选项几乎是无限。它可以用于制作简单的功能，如图片库、轮播图以及对用户的按钮点击做出响应。可能的高级功能还包括动画\
    \ 3D 图形和游戏。你甚至可以使用 `JavaScript` 开发完整的基于数据库的应用程序等。除了这些，还有更多 `JavaScript` 的现代用途，我们为你总结如下：\n\
    \n1. 它增强了 `HTML` 给我们的界面。`JavaScript` 将普通的输入框转换为组合框，你可以在其中输入自己的值，也可以从预设值列表中进行选择。\n\
    2. `JavaScript` 可用于制作页面元素的动画。例如，高亮显示特定部分或显示和隐藏信息都可以轻松实现，从而提供丰富的用户体验。\n\n"
