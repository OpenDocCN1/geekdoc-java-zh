    - 第 4 章：学习 JavaScript：让 Web 更具交互性\n- 总结\n\n## 赠送\n\n你好，我是来自 Mjg Publishing 的 Marco；我想感谢你支持这本书。我真心希望你在开始/继续你的编程之旅时，能发现这些信息是有用的。我做这件事的很大一部分原因是能够提供价值并帮助我周围的人学习，你帮助我实现这一目标对我来说意义重大。\n\
    \n作为回报，我想邀请你加入我的列表。在这个列表中，我将为你提供我们未来发布的所有书籍的专属折扣和赠送访问权限，还有每月获得 50 美元亚马逊 礼品卡的有机会。\n\
    \n![](https://scgbook.leadpages.co/mjg-publishing-amazon-gift-cards/)\n\n要加入列表请点击[此处](https://scgbook.leadpages.co/mjg-publishing-amazon-gift-cards/)。祝你阅读愉快！\n\
    \n也请关注我们的 [Facebook](https://www.facebook.com/mjgpublishing/) 和 [Instagram](https://www.instagram.com/mjgpublishing/)\
    \ 以接收最新发布的更新！\n\n## 引言\n\n互联网无处不在。事实上，你就是使用互联网购买这本书的。这当然是通过 Web 开发实现的，而这正是你将在书中学到的内容。编程的世界广阔无边，Web\
    \ 编程只是其中的一个部分，尽管是一个很大的部分。\n\nWeb 编程，或者更广为人知的 Web 开发，是指 Web 应用程序的开发。Web 应用程序可以是简单的网页、社交网站甚至是一个完整的游戏。与所有类型的编程一样，Web\
    \ 开发有它自己的编程语言，用于开发这些应用程序。\n\n目前有许多 Web 开发语言在使用。然而，最流行的三种是 `HTML`、`JavaScript`\
    \ 和 `CSS`。了解这些语言可以为你提供一个坚实的基础，你可以在此基础上进步成为一名真正的 Web 开发人员。\n\n然而，对于没有编程经验和接触的人来说，学习这些编程语言可能是一项艰巨的任务。因此，关键在于牢牢掌握语言的基础知识。应该缓慢进行，而不是一开始就追求创建花哨的脚本。对于初学者来说，编程中使用的术语有时可能会变得困惑。诸如“对象\
    \ (objects)”、“变量 (variables)”和“元素 (elements)”之类的术语在编程中有特定的含义。因此，学习和使用这些术语是至关重要的。\n\
    \n在书中，你将学习这三种语言的基础。你将理解每种语言的各种基础，例如语言结构和编程概念。你将学习每种语言的语法以及不同类型的函数。我们还提供了一个 hello\
    \ world 示例，帮助你理解语言是如何运作的。此外，我们还包含了关于这些语言的一些实用技巧和技巧以及它们的常见问题。简而言之，在使用该语言进行编码之前，你将熟悉需要的所有内容。\n\
    \n让我们现在开始学习 `HTML`、`CSS` 和 `JavaScript`。\n\n## 第 1 章：Web 开发简介\n\n网站的创建根据目标受众有不同的目的，有些是为了销售产品，有些仅仅是为了提供信息。Web\
    \ 开发工具为公司提供了创建网络存在的平台。网站让他们获得了更广泛的观众。根据需求开发网站，企业聘请开发人员。开发网站可以包括从简单的编程到网络安全、内容添加或服务器配置的任何内容。\n\
    \n### 什么是 Web 开发？\n\nWeb 开发可以广义地定义为在互联网或内网上托管的网站和 Web 应用程序的开发。实际上，Web 开发被用作一系列活动的组合术语，例如\
    \ Web 设计、客户端编码、服务器端脚本、网络安全配置和其他任务。\n\nWeb 开发涉及在客户端和服务器端使用脚本语言。它涵盖了从创建纯文本页面到复杂应用程序的范围。Web\
    \ 开发的层次包括；客户端编码、服务器端编码和数据库技术。\n\n更具体地说，Web 开发可以认为是 Web 编程。这涉及创建 Web 应用程序或网站的代码。通过它，你可以创建一个简单的网页，也可以创建一个像\
    \ Facebook 这样的大型社交网络，或像 Amazon 这样的电子商务门户。\n\n## Web 开发流程\n\n"
- fmt: "\nBefore you start building a website the first and foremost is that you must\
    \ understand what information or message you are trying to pass on to your viewers\
    \ or customers. What is it that they are expecting to see in terms of the content?\
    \ How can you make the content user friendly easy to navigate? Once all the front\
    \ end design aspects are clear, one must start working on the backend of the website,\
    \ which would include how to host, what architecture to use, what is the expected\
    \ traffic load on the website and how can we setup a infrastructure to ensure\
    \ that the overall built of the website is robust. Finally one must ensure that\
    \ the website can be opened on various types of browsers / devices like smart\
    \ phones, tablets etc and is easily searchable through search engines. \n\nThere\
    \ are number of steps involved in the web development process but broadly these\
    \ can be classified into five phases.\n\n1. **Discovery**- The first step in developing\
    \ a website is to understand the requirements of the business which includes;\
    \ the purpose of creating the site, target audience and the content of the site.\n\
    2. **Definition**- The information gathered in step one has to be compiled together\
    \ to define a site map or plan for the website. It involves creation of an easy\
    \ to navigational system or user interface.\n3. **Design**- This step involves\
    \ crafting a user experience. The visual appeal of the site depends upon the template\
    \ you choose and it should always be done keeping in mind the target audience.\
    \ For example: a website targeting teenagers will have different elements than\
    \ a website for a financial institution.\n4. **Development**- In this step the\
    \ final design is implemented to create an actual functional site. Content management\
    \ system and programming codes are used to develop the site.\n5. **Deployment**-\
    \ The complete functionality of the website is tested and once the business is\
    \ satisfied with the final product the web site files are uploaded to the client’s\
    \ server.\n\n## Aspects of Web development\n\nWeb development can be broadly classified\
    \ into two separate sections. They are front-end development and back-end development.\
    \ In order to have a fully functional website, both of these processes need to\
    \ go hand in hand.\n\n### Front-end Development\nAlso known as client-side coding,\
    \ in this development, you will be creating what the user is going to see when\
    \ a web application is loaded. This includes the design and the content along\
    \ with how the user is going to interact with it. For front-end development, you\
    \ need to use `HTML`, `JavaScript` and `CSS`.\n\n`HTML` is the code used for turning\
    \ text into a web page. All web pages are written in `HTML`, and this language\
    \ is also pivotal for all web applications. `CSS` is used to set the style rules,\
    \ and it determines how a web page will appear. `JavaScript` is used to adding\
    \ functionality to web pages and make them more interactive.\n\n### Back-end Development\n\
    This is also referred to as server-side coding. It determines what is happening\
    \ in the server of the web page. In other words, the user does not get to see\
    \ this activity, but it can affect the website. A common activity in back-end\
    \ development is the creation of a database for the generation of the front-end.\n\
    \nA variety of coding languages and frameworks are used in backend development.\
    \ `PHP`, `ASP.NET`, `Ruby on Rails`, `Python`, `Node.js` and `Java` are some of\
    \ them.\n\n## Pros and cons of using Programming languages\n\nProgramming languages\
    \ are used to create programs for building a website or a web application. Most\
    \ of the programming languages are easy to learn. They help you in adding dynamic\
    \ and interactive activities to the web page. Complex tasks can be performed in\
    \ relatively fewer steps.\n\nThe downside of programming language is that bugs\
    \ while coding can be annoying and difficult to resolve sometimes. A web developer\
    \ needs to know the syntax of programming language like the back of their hand.\
    \ Hence, a lot of hard work and a good memory are essentials. Moreover one needs\
    \ to build upon the speed for programming otherwise it is a very time consuming\
    \ activity.\n\n## Why Learn Web Development?\n\nOf course, the most common reason\
    \ to start learning web development is to become a web developer yourself. You\
    \ will be able to create web pages and websites for people to view over the internet.\
    \ However, that is not the only reason to learn web development. There are many\
    \ reasons and we have listed a few of them:\n\n1. One of the features of web development\
    \ is that it is comparatively easy to learn. In fact, many programmers claim that\
    \ web development is an excellent choice for those who wish to start learning\
    \ to program. If you are interested in becoming a programmer, web development\
    \ can provide you with a foundation in which to do so.\n2. Learning web development\
    \ can give you good job prospects. Businesses want to make an effective presence\
    \ and for that they are under pressure to offer high quality websites with e-commerce\
    \ and communication capabilities. Hence more and more companies look out for web\
    \ developers who can deliver the best.\n3. As a web developer you get an opportunity\
    \ to create new cool things. You just need to have a laptop and an internet connection\
    \ with knowledge of programming language you can create with your imagination.\n\
    4. Web development is not about web anymore. When companies think about creating\
    \ websites today, they also think about social media and mobile technology. There\
    \ is a surge in usage of smart phones, internet TV, tablets and many other devices\
    \ hence the developer needs to take into account all these. This expands the reach\
