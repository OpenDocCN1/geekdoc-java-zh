    ### 3. The layout issues can be fixed with JavaScript. By using this scripting
    language one can find area and position of any element on a particular page along
    with dimension of the browser window. This can prevent the overlapping issues.
    For example, your website has several levels of menu, but upon checking you find
    out that there is a space for sub-menu. So by showing it before you can prevent
    overlapping menu items.


    ### 4. Under JavaScript you can load information which can be accessed by only
    those users who find it relevant. For example; a navigation menu of a website
    has 5 links but other links to deeper pages will only be displayed when user activates
    the menu item.


    ### 5. Information which changes constantly such as sports match scores or stock
    market can be loaded from time to time without user interaction.


    ## Fundamentals of JavaScript

    JavaScript has become one of the most prominent languages on the internet. It
    can be used across platforms and various browsers. Therefore in order to use this
    language in practical world, we need to first learn about its fundamentals. This
    would give you a foundational understanding of JavaScript.


    #### 1. Variables

    As you already know, variables are containers in which data can be stored. The
    data stored in a variable can be an expression or a value. Expressions can be
    of three types in JavaScript language.


    | Expression | Description |

    | :--- | :--- |

    | Logical | Evaluates to a Boolean i.e. true or false |

    | Arithmetic | Evaluates to a number |

    | String | Evaluates to a String |


    #### The Scope of Variables in JavaScript

    The variable scope refers to the section of the program in which the variable
    is defined. Variables in JavaScript can have either one of two scopes.


    **Global Variables:** These variables can be defined anywhere in your code due
    to its global scope.


    **Local Variables:** These variables exist only inside the function that it has
    been defined in. Function parameters will always be local to that specific function.


    The local variable can be declared by using the `var` as keyword and global variables
    should be used without using `var` as keyword. For example: If a local variable
    is declared inside a function and it cannot be accessed outside of that function,
    thus making it local to that function. In case you declare the same variable without
    keyword `var`, it becomes accessible to the entire script and not only within
    that function.


    In JavaScript, a local variable will be given precedence inside the body of the
    function if there is a global variable that has the same name. By declaring a
    local variable that has the same name as that of a global variable, you are effectively
    hiding that global variable in the function.


    Let us look at an example for a local variable


    ```javascript

    var num= 20;

    ```


    If you want to access the value of the `num` variable at some other point in the
    script, then you simply refer with the variable name. `document.write` function
    writes data to the web page.


    Look at the syntax below:


    ```javascript

    document.write(“The value of num is: “ +num);

    ```


    The result which we will get would be “The value of num is 20”.


    In order to store arithmetic expressions in a variable we simply need to assign
    the variable to the calculated value. Not the calculation but the result of that
    calculation gets stored in that variable. Therefore once again we will get the
    result as “The value of num is 20”. Look at the following example:


    ```javascript

    var num = (10+10);

    document.write( “ The value of num is: “+ num);

    ```


    In case you want to change the value of a variable then refer to the variable
    by the name which has been assigned to it and then assign it a new value by using
    an equal sign. The only difference is that you don’t have to use keyword `var`
    since the variable has already been declared.


    ```javascript

    var num =20

    document.write( “ The value of num is: “ +num);

    //update the value of num to 30

    num=30;

    document.write( “ The new value of num is: “+ num);

    ```


    So the result for this script would be “The value of num is 20” followed by “The
    value of num is 30”


    Here is one more example for variable to understand the concept better.


    ```html

    <script type="text/javascript">

    <!---->

    var money;

    var name;

    //-->

    </script>

    ```


    In the above example, the `var` keyword has been used twice for declaring two
    variables, `money`, and `name`. However, JavaScript allows multiple variables
    to be declared with just one `var` keyword. You can see this happening in the
    following example.


    ```html

    <script type="text/javascript">

    <!--

    var money, name;

    //-->

    </script>

    ```


    Variable initialization takes place when a value is stored in a variable. It is
    possible to perform variable initialization while declaring the variable in JavaScript.
    Alternatively, you can initialize the variable later when you require that variable.
    You can see this happening in the following example.


    ```html

    <script type="text/javascript">

    <!--

    var name = "John";

    var money;

    money = 12.30;

    //-->

    </script>

    ```


    When using variables, there are two things you need to keep in mind.


    - The `var` keyword must be used either for declaration or initialization. As
    such, it will be used only once in the lifespan of any variable in a single program.
    The same variable must never be declared twice, or it can result in errors.

    - As JavaScript is an untied language, a variable can hold any value irrespective
    of the data type. In other words, you do not have to mention what kind of value
    that a variable should contain while it is being declared.


    ### Rules for Variable Names

    When you are giving names to your variables, you need to remember the following
    rules:


    - All JavaScript variables are identified with unique names and they are called
    as identifiers. These can be short names like `a` and `b` or more descriptive
    names such as `sum`, `age`, `total` etc.

    - The reserved keywords in JavaScript cannot be used as names.

    - Variable names cannot start with a number. They must either start with a letter
    or underscore. The names can also begin with `$` sign.

    - As mentioned earlier, JavaScript is case sensitive. Therefore, the variable
    names must be used accordingly.


    Apart from all the reserved words there are certain words which cannot be used
    as JavaScript functions, variables, loop labels, methods or any object names.
    Listing below a few of them:


    | Abstract | Boolean | Break | Switch | Else |

    | :--- | :--- | :--- | :--- | :--- |

    | Extends | Long | Interface | throw | This |

    | Byte | False | Case | New | null |

    | Class | Final | with | True | float |


    #### 2. Data types

    As you may already know, data types denote the kind of values that can be used
    in a programming language. There are two kinds of data types in JavaScript:


    a) Primitive

    b) Non-primitive


    It is dynamic type language; this means that you don’t need to specify type of
    variable because it is used dynamically by JavaScript engine. Here, you need to
    use `var` to specify the data type.


    In JavaScript, there is no difference between floating-point values and integer
    values. Instead, all numbers are considered to be floating-point values in JavaScript.


    **Primitive Data Types:**They are of five types

    1. `String`: this type represents the sequence of characters

    2. `Boolean`: it represents value as either true or false

    3. `Number`: it represents the numeric value

    4. `Undefined`: as the name suggests, it shows the undefined values

    5. `Null`: represents no value at all.


    **Non primitive data types:**

    1. `Array`: which is group of similar values

    2. `Object`: represents instance by which we can access members

    3. `RegExp`: reflects regular expression


    Let us look into details of data types:

