    ## 12. 字间距 (Letter Spacing)

    用于指定给定文本字符之间的间距。下面的示例展示了如何减少或增加间距


    ```css

    h1 {letter-spacing: 5px;}

    h2 {letter-spacing: -5px;}

    ```


    ## 13. 行高 (Line Height)

    指定每行之间的间距。示例：


    ```css

    p.small {line-height: 0.6;}

    p.big {line-height: 1.6;}

    ```


    ## 12. 文本方向 (Text direction)

    用于更改元素的方向。示例：


    ```css

    div {direction: rtl;}

    ```


    ## 14. 词间距 (Word Spacing)

    定义单词之间的间距。示例：


    ```css

    H1 {word-spacing: 15px;}

    H2 {word-spacing: -10px}

    ```


    上述属性可以让你对如何在网页上样式化文本有一个大致了解。除此之外，当你熟悉了基础属性后，还有许多可以使用。下面列出了其中一些：


    ### 字体样式 (Font Style)

    a) 字体变体 (Font variant)—在普通字体变体和小大写字母之间切换

    b) 字体变体连字 (Font variant ligatures)—控制文本中使用哪些上下文形式和连字。

    c) 字体变体数字 (Font variant numeric)—控制分数、数字和序数标记的替代字形的使用。

    d) 字体伸缩 (Font stretch)—通过此选项可以在给定字体的所有可能的伸缩版本之间切换。


    ### 文本布局样式 (Text layout Styles)

    a) 空白 (White space)—定义了如何处理元素内的空白和相关的换行。

    b) 单词断行 (Word break)—指定是否要在单词内部进行断行。

    c) 自动换行 (Word wrap)—定义浏览器是否可以在单词内部进行断行以避免溢出。

    d) 编写模式 (Writing mode)—指定文本行是垂直布局还是水平布局，以及后续行的方向。


    ### CSS 快捷写 (Shortcuts in CSS)

    既然我们已经学习了 CSS 的基础，我们正在编写该语言的某些快捷写，可以通过练习来。这些快捷写可以使你的代码更易读、加载更快且质量更高。快捷写是加快进程极极方法。然而，在使用它们时应该留心，因为如果使用不当，可能会产生负面结果。因此，始终要分析使用此类快捷写是否有益。


    #### 属性分组 (Property Grouping)

    此快捷写允许在一行中定义一组属性的一组值，而不是分行。


    示例：使用字体


    | 未分组 | 分组后 |

    | :--- | :--- |

    | h1{font-weight: normal;font-size: 20px;line-height: 12px;font-family: georgia,
    tahoma, verdana;} | h1 {font: normal 20px/12px Georgia, Tahoma, verdana;} |


    #### 单行输入 (Typing on one line)

    每个人编写代码的方法都不同，但有一个共同点：你使用的制表符和空格越少，你的代码加载就越快。其核心思想是创建没有过多空白的高可读性代码。在行内输入一组属性可以是此解决方案。


    示例：


    | 多行输入 | 单行输入 |

    | :--- | :--- |

    | p{color: #4f39ac;background: #f4f4f4;line-height: 16px;} | P{color: 4f39ac;
    background: #f4f4f4; line-height: 16px;} |


    #### 颜色值缩写 (Color value shortening)

    在为元素声明十六进制颜色值时，与其使用完整的 6 位值，你可以将其缩短为三个。如果颜色代码由三对重复的数字组成，这是可能的。


    示例：


    | | 颜色值缩写快捷写 |

    | :--- | :--- |

    | body {background: #gggggg;}h1 {background: #aa5566;}p {background: #112233;}#menu
    {background: #ggaa44;} | body {background: #ggg}h1 {background: #a23;}p (background:
    #123;}#menu {background: #ga4;} |


    #### 使用零 (Using zeros)

    当你使用零时，不需要使用 pt, px, em 或任何其他测量类型


    示例：


    ```css

    #menu {margin:20px 0;}

    ```


    ## 使用 CSS 的一些提示和技巧

    尝试使用更整洁、更容易理解的 CSS 快捷代码。


    始终优先为符合标准的浏览器编写代码。之后，你可以在最后为 IE 进行修正。千万不要反过来，因为这会增加向前兼容的概率。


    `class` 和 `ID` 选择器经常让学者困惑。在 CSS 语言中，`class` 用 `.` 表示，而 `#` 代表 `ID` 选择器。简而言之，ID
    用于唯一的且不能重复的样式；而另一方面，`class` 可以被复用。


    在修改 CSS 时，获取布局的即时预览总是更好的。这样可以更好地理解和调试 CSS 样式。


    如果你想在一个固定高度的容器块中将文本垂直居中，只需将文本的 `line-height` 设置为与容器块的高度相同即可。


    要创建流式图像，将图片的 `max-width` 设置为 100%。


    当两个或多个 CSS 选择器向单个 html 元素发送冲突的指令时，必须选择应用哪些样式。这可以通过 CSS 属性性计算来实现，其表达式形式为 `(a,b,c,d)`。


    任何被链接包裹的图像都会有边框。要移除边框，可以这样做：


    ```css

    a image {border: none} a image {border:0}

    ```


    ### 关于 CSS 的常见问题 (FAQ)


    **为什么需要样式表？**

    回答：需要样式表是因为它们对布局和显示提供了很好的控制。它们减少了格式化。


    **我们如何链接外部样式表？**

    回答：它是可以与 HTML 文档链接的模板或文件，具有 `.css` 扩展名。LINK 元素用于链接文件。


    **ID 选择器和类选择器有什么区别？**

    回答：ID 选择器是唯一的，而类选择器可以应用于多个元素。


    **块级元素和内联元素有什么区别？**

    回答：内联元素占据必要的宽度，而块级元素占据所有可用宽度并换行。


    **哪些字体是跨平台的？**

    回答：所有平台都识别五种字体族。它们是：sans-serif, serif, monospace, cursive 和 fantasy。


    **样式表中可以包含注释吗？**

    回答：是的，只要有空白，可以在样式表的任何地方包含注释。


