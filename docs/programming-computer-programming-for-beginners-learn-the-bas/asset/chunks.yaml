    你也可以将链接指向同一页面的其他部分。如果你使用过维基百科，可能已经见过这种用法了。为了创建这样的链接，你需要在标签上添加一个 `id` 属性。几乎所有的标签都可以添加此类属性。请看下方的示例以理解它的工作原理。


    ```

    <p id="bird">The List of Birds</p>

    ...

    <a href="#bird">Check the List of the Birds</a>a</a>

    ```


    一旦点击链接，页面将滚动到该元素（在本例中是一个包含相应 `id` 标签的段落）。


    ### 创建 HTML 页面的步骤


    既然我们已经学习了 HTML 语言的基础知识，让我们来看一下创建 HTML 页面的具体步骤。


    1. 文本编辑器- 打开一个你喜欢的文本编辑器，例如-记事本（notepad），并创建一个空的文本文件。

    2. HTML 代码- 将 HTML 代码复制并粘贴到你的新文本文件中。

    3. 保存 – 点击文件并以 HTML 文件扩展名保存，例如“nameyoulike.html”。

    4. 演示- 双击文件以在任何网络浏览器中查看它。


    ### Hello World 示例


    为了帮助你更好地理解 HTML5 中使用的结构和语法，你应该查看以下示例。毕竟，没有比实践更好的学习方法了。以下是一个 hello world 示例，这种类型的程序通常在编程中用于介绍语言的基础性知识。


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8">

    <title>HTML5: Hello World Example</title>

    </head>

    <body>

    <h1>Hello World</h1>

    </body>

    </html>

    ```


    如你所见，这实际上是一个非常简单的程序。执行此代码后，将打开一个网页并显示文本“Hello World”。由于 HTML5 中代码的简单易懂性，你实际上可以理解程序中正在发生什么。


    首先，定义了在网页上显示的文本语言为英语。然后，通过 `charset` 属性定义 HTML 文档的字符编码。最后，在 `body` 标签内部提到了要显示的文本。


    ### HTML 文档的结构


    HTML 文档是一个包含超文本标记语言的文件。HTML 代码基于标签，标签提供了用于格式化文档的指令。在任何 HTML 文档中，都会提到文档类型元素，也称为
    `doctype`。它的目的是确保浏览器以标准模式渲染 HTML，以便以正确的方式运行。`doctype` 的使用还允许验证软件知道应该针对哪个版本的 HTML
    代码进行验证。


    在 `doctype` 之后，使用了起始 `HTML` 标签。它打开 HTML 代码并用闭合的 `HTML` 标签关闭。它们作为整个文档的容器。因此，闭合
    `HTML` 标签始终是任何 HTML 文档中的最后一个内容。


    在 `HTML` 元素之后，插入了 `head` 元素。这个容器包含了文档的所有信息或元数据。接下来是 `title` 元素，它用于定义页面的标题，标题将显示在菜单栏中。


    在闭合 `head` 元素之后，使用了 `body` 元素。它包含了出现在页面上的实际内容。如你所见，Hello World 示例的 `body` 元素中只有一个头部（header）元素。


    ### HTML 的类型


    正如上面提到的，最新版本是 HTML 5。这个版本可以分为三类。这些类型定义了 HTML 的使用方式。


    1. Transitional（过渡型)- 这是最常见的 HTML 类型，具有灵活的语法、拼写和语法组件。这种类型的 HTML 在没有语法限制的情况下一直被使用。浏览器对标签支持尽力而为的方法，因此如果标签拼写不正确，浏览器不会纠正错误，而是会显示内容。

    2. Strict（严格型)-这种类型要求关闭所有打开的标签。严格的 HTML 对手机至关重要，因为手机的处理能力有限。此外，如果代码整洁无错误，页面加载速度会更快。

    3. Frameset（框架型)-它允许开发者创建 HTML 文档的合集，即多个文档连接到单个屏幕。这种类型通常用于创建网站的菜单系统。


    ### HTML 中的元素


    在 HTML 中，一个基础元素会在文本块周围有两个标记。元素内部包含其他元素也是可能的。。事实上，所有的 HTML 文档都是如此的。毕竟，代码的主要部分总是被放在
    HTML 元素内部。然而，也有极少数例外，某些元素不能包含任何文本或其他元素。`img` 元素就是其中一个例子。


    ### HTML5 中的元素


    在 HTML5 中，对元素进行了一些更改。它们现在被分为一系列元素内容类别。在 HTML5 中，元素通过起始和结束标签的帮助进行标记。闭合标签始终包含一个斜杠，而起始标签则没有。在
    HTML5 中，元素名称对大小写不敏感。因此，你可以毫无问题地将其写成大写甚至混合大小写。不过，使用小写作为元素名是一个良好的习惯。下面列出了 HTML 5
    的一些语义化和结构性元素：


    1. `<article>- 定义一篇文章。

    2. `<aside>- 定义位于内容页面侧边的内容。

    3. `<bdi>- 文本的一部分，其格式化方式可能与其余部分不同。

    4. `<details>- 提供用户可以使用或隐藏的额外细节。

    5. `<dialog>- 描述对话框或窗口。

    6. `<figcaption>- 为 `figure` 提供说明。

    7. `<figure>- 定义如插图、照片、图表、代码列表等内容。

    8. <footer>- 定义章节或文档的页脚。

    9. `<header>- 定义文档的头部。

    10. `<main>- 文档主体内容。

    11. `<mark>- 显示突出或标记的文本。

    12. `<menuitem>- 用户可以从菜单中使用的项目。

    13. `<meter>- 已知范围内的测量。

    14. `<nav>- 显示文档中的导航链接。

    15. `<progress>- 显示任务的进度。

    16. `<rp>- 描述在浏览器中显示的内容。

    17. `<section>- 定义文档的章节或部分。

    18. `<summary>- `details` 元素的可见标题。

    19. `<time>- 提供日期和时间。

    20. `<wbr>` 可能的换行。


    ### HTML5 中的属性


    在 HTML 中，元素可以拥有属性，属性可以设置元素的不同属性并改变其行为。某些属性是全局定义的，可以与任何元素一起使用。然而，还有一些专门用于特定元素的。属性应该在起始标签中指定。永远不能在闭合标签中使用。


    与元素类似，HTML5 中的属性对大小写不敏感。你可以用任何大小写编写它们。不过，你应该练习只使用小写。


    大多数属性及其可能的值都在 HTML 规范中定义。因此，你没有权限创建自己的属性。如果你这样做，将使 HTML 无效。毕竟，这可能会困扰用户代理，甚至导致网页正确解析出现问题。


    #### 标准属性


    下面列出了 HTML5 中使用的一些标准属性


    | 属性 | 选项 | 功能 |

    | :--- | :--- | :--- |

    | align | Left, right, center | 水平对齐标签 |

    | bgcolor | 十六进制、数值、RGB 值 | 在元素后面放置背景颜色 |

    | accesskey | 用户定义 | 定义访问元素的键盘快捷键 |

    | class | 用户定义 | 用于层叠样式表区分元素 |

    | height | 数值值 | 定义图像、表格或表格单元格的高度。 |

    | Item | 元素列表 | 它用于对元素进行分组 |


