  trans: '


    在你开始构建网站之前，首要任务是你必须理解你正试图传达给观众或客户的信息或消息。他们在内容方面期待看到什么？你如何能让内容变得对用户友好且易于导航？一旦所有的前端设计方面都确定了，就必须开始着网站的后端工作了，这包括如何托管、使用什么架构、网站预期的流量负载是多少，以及我们如何搭建基础设施以确保网站的整体构建稳健。最后，必须确保网站可以在各种类型的浏览器/设备（如智能手机、平板电脑等）上打开，并且能够通过搜索引擎轻松搜索。


    Web 开发过程中涉及许多步骤，但大来说可以分为五个阶段。


    1. **需求发现 (Discovery)**- 开发网站的第一步是理解业务需求，包括：创建网站的目的、目标受众以及网站内容。

    2. **定义 (Definition)**- 必须将第一步收集的信息汇总，以定义网站地图或网站计划。这涉及创建一个易于导航的系统或用户界面。

    3. **设计 (Design)**- 这一步涉及构建用户体验。网站的视觉吸引取决于你选择的模板，并且应该始终考虑到目标受众。例如：针对青少年的网站性元素与针对金融机构的网站会有不同。

    4. **开发 (Development)**- 在这一步中，实现最终设计以创建一个实际的功能性网站。使用内容管理系统和编程代码来开发网站。

    5. **部署 (Deployment)**- 对网站的所有功能进行测试，一旦客户对最终产品满意，就会将网站文件上传到客户的服务器。


    ## Web 开发的方面


    Web 开发可以大致分为两个独立的部分。它们是前端开发和后端开发。为了拥有一个功能完整的网站，这两个过程需要并并进行。


    ### 前端开发 (Front-end Development)

    也被称为客户端编码，在这种开发中，你将创建用户在加载 Web 应用时将看到的内容。这包括设计和内容，以及用户将如何与之交互。对于前端开发，你需要使用 `HTML`、`JavaScript`
    和 `CSS`。


    `HTML` 是用于将文本转换为网页的代码。所有网页都是用 `HTML` 编写的，这种语言对于所有 Web 应用也至关重要。`CSS` 用于设置样式规则，它决定了网页外观。`JavaScript`
    用于为网页添加功能并使其更具交互性。


    ### 后端开发 (Back-end Development)

    这也被称为服务器端编码。它决定了网页服务器上发生了什么。换句话说，用户看不到这些活动，但它们会影响网站。后端开发中的一项常见活动是为前端生成创建一个数据库。


    后端开发使用了多种编码语言和框架。`PHP`、`ASP.NET`、`Ruby on Rails`、`Python`、`Node.js` 和 `Java` 就是其中一些。


    ## 使用编程语言的优缺点


    编程语言用于创建构建网站或 Web 应用的程序。大多数编程语言都是容易学习的。它们帮助你向网页添加动态和交互式的活动。复杂的任务可以在相对较少的步骤内完成。


    编程语言的缺点是编码过程中产生的漏洞（bugs）有时会令人烦恼且难以解决。Web 开发人员需要像如掌一样熟悉编程语言的语法。因此，大量的努力和良好的记忆是必不可少的。此外，需要建立编程速度，否则这是一项非常耗时的活动。


    ## 为什么要学习 Web 开发？


    当然，开始学习 Web 开发的最常见原因是成为一名 Web 开发人员。你将能够为人们创建网页和网站供他们在互联网上查看。然而，这并不是学习 Web 开发的唯一理由。有很多理由，我们列出了其中几个：


    1. Web 开发的特点之一是相对容易学习。事实上，许多程序员声称，Web 开发是那些想要开始学习编程的人的极佳选择。如果你兴趣成为程序员，Web 开发可以为你提供基础。

    2. 学习 Web 开发可以给你良好的就业前景。企业希望建立有效的影响力，为此他们面临压力提供具有电子商务和通信能力的高质量网站。因此，越来越多的公司寻找能够交付最佳内容的
    Web 开发人员。

    3. 作为一名 Web 开发人员，你有机会创造新的酷事物。你只需要笔记本电脑和互联网连接，具备编程语言知识，就可以根据你的想象力创造。

    4. Web 开发不再仅仅关于网络。当现在的公司考虑创建网站时，他们还会考虑社交媒体和移动技术。智能手机、网络电视、平板电脑等许多设备的使用量激增，因此开发者需要考虑到所有这些。这扩展了开发者的影响力。

    5. Web 开发非常灵活，具有许多方面，如前端、后端、内容管理系统、电子商务、移动 Web 等。这为专业人士提供了广泛的机会，同时新工具正在让提升技能的过程变得更加简单。


    既然你已经了解了 Web 开发是什么，让我们现在从 `HTML`、`CSS` 和 `JavaScript` 的实际语言开始。


    ## 第 2 章：学习 HTML5：Web 语言


    `HTML` 是 Web 的核心。它是一个被所有人接受的标准。因此，理解它将是开发网页和 Web 应用的关键。


    ### 什么是 HTML？


    `HTML` 是超文本标记语言的缩写。它是用于创建网页的语言。事实上，`HTML` 是现代互联网的石。除了网页，它还用于创建 Web 和移动应用的用户界面。


    它由一组插入网页中的代码或标记符号组成。代码告知网页浏览器网页上的文字和图像应该如何显示给用户。每一个标记代码被称为元素或标签。网页浏览器可以读取 `HTML`
    文件并将其渲染为可见的网页。它还以语义方式描述网站的结构。


    ### HTML 的历史


    互联网和 `HTML` 的历史完全交织在一起，是共同开发的。Tim Berners-Lee 开发了被称为 `HTML` 的语言，用于世界上第一个网站和第一个
    Web 服务器。它编写于 1990 年左右，并在 1991 年向公众开放。多年来，`HTML` 经历了多次迭代。在 2000 年，`HTML` 正式标准化为用于开发  网页的标记语言。


    '
- fmt: '

    In spite of the changes to the language, there are still a few features in HTML5
    that were present in the first version of HTML. This is the latest version of
    HTML, and it was launched in October 2014. When you wish to learn HTML, it will
    actually be HTML5 that you will be learning.


    ## Basics of HTML


    All HTML documents should start with a document type declaration i.e. `<!DOCTYPE
    html>`.


    HTML document begins with `<html>` and ends with `</html>` only.


    The visible part of the HTML document is between `<body>` and `</body>`.


    Let us look at the below example of a simple HTML document for a better understanding
    of the language:


    ```html

    `<!DOCTYPE html>`--------------defines the document

    `<html>`--------------------------signifies root element of HTML page

    `<head>`---------------------------includes meta information about the document

    `<title>Page Title</title>`--- specifies title of the document

    `</head>`

    `<body>`---------------------------consists of visible page content

    `<h1>My First Heading</h1>-defines large heading

    `<p>My First paragraph.</p>-defines a paragraph

    ```


    ```html

    <body>

    <html>

    ```


    ## Elements to create a HTML Web Page


    In order to create a simple web page, you need to know the basic elements and
    tags such as those that are used in defining the layout among other things. These
    elements are used in nearly all web pages to give a structure to the content placed
    on them. Here is what you need to know to start creating simple web pages.


    ### Page Title

    All HTML pages must have their own page title. It acts as the name for the document.
    The page title helps the user understand what they can expect from that page.
    Moreover, it will be used as the default title when the page has been saved to
    the bookmarks of the browser. The page title is not shown in the actual body of
    content of the web page.


    The syntax for the page title element is given below.


    ```html

    <Title>…</title>

    ```


    The title element is always placed inside the head element. Example:


    ```html

    <!DOCTYPE html>

    <html>

    <body>

    <h2>The title attribute</h2>

    <p title="These are the tooltips"></p>

    </body>

    </html>

    ```


    ### Paragraphs

    The Page Title does not affect the actual content placed on the web page. However,
    the Paragraph element most certainly does. You can type in a message on separate
    lines in HTML. However, they will always get printed on the same line by the browser
    unless you make use of the Paragraph element. After all, HTML is not about presentation
    but rather about meaning. The syntax for this element is given below.


    ```html

    <p>…</p>

    ```


    On inserting a piece of text inside these tags, you can ensure that the text will
    be considered as a separate block of text. It will get displayed as a new paragraph.
    An example of its use is given below.


    ```html

    <! DOCTYPE html>

    <Html>

    <Head>

    <Title>List of Animals</title>

    </head>

    <Body>

    <p>this is a list of animals.</p>

    <p>it is quite interesting.</p>

    </body>

    </html>

    ```


    ### Line Breaks

    The line-break tag is used for separating a single line into two. Unlike other
    elements, line-breaks do not have any closing tags as there is no content involved
    when a line is being broken. You may find it easy use line breaks quite often.
    However, you must avoid so especially when two pieces of text are meant to be
    completely separate from each other. In such situations, the paragraph element
    will suit you better. The tag for line breaks is `<br>` and an example of its
    use is given below.


    ```html

    A List of Animals<br>

    And Other Animals

    ```


    ### Lists

    HTML allows you to organize your content into lists to make the content more presentable
    on a web page. There are actually three kinds of lists available in HTML. They
    are ordered list, unordered lists and, finally, definition lists. Out of them,
    a definition list is a bit advanced. Therefore, we will only consider the ordered
    and the unordered lists here. Both of these lists work in a similar manner. However,
    unordered lists are used when the list items are non-sequential. They are generally
    preceded by bullets. However, ordered lists are used when the items have to be
    listed sequentially. As such, they are preceded by incremental numbers.


    The unordered list element can be defined by the following syntax.


    ```html

    <ul>

    <li>Li…</li>

    <li>Li…</li>

    <li>Li…</li>

    </ul>

    ```


    The syntax for ordered lists is similar. The only difference is in the tag used
    as you can see below.


    ```html

    <Ol>

    <Li>Li…</li>

    <Li>Li…</li>

    <Li>Li…</li>

    </ol>

    ```


    The `<li>…</li>` tags are used to define each item that will be placed on that
    list.


    In order to understand the ordered and unordered lists in HTML, you can take a
    look at the following example.


    ```html

    <! DOCTYPE html>

    <html>

    <Head>

    <title>my first web page</title>

    </head>

    <body>

    <h1>A Short List of Animals</h1>

    <ul>

    <li>Cat.</li>

    <li>Dog.</li>

    <li>Horse.</li>

    </ul>

    </body>

    </html>

    ```


    As you can see in the example, when you are creating a list, it is possible to
    use unordered and ordered lists together. You can use as many levels of lists
    as you want.


    ## Links

    Links are central to our use of any website or web page. As such, it helps to
    know how you can implement them in HTML. After all, links are what enables the
    internet to bring everything together.


    When creating a link in HTML, you need to understand a few things. An anchor tag
    will be used for defining a link. You will need to add the link’s destination
    to the anchor tag to create a functional link in HTML. The destination of the
    link can be defined with the help of the `href` attribute.


    It is possible to make the link absolute which means that it will take you to
    a specific website. For example, you can link to `http://www.amazon.com` or `http://www.google.com`.
    The syntax, in this case, would be as follows.


    ```html

    <a href="http://www.amazon.com ">Amazon</a>

    ```


    Alternatively, it can be used to point to another file located in the same directory.
    For example, let’s suppose that you have created another html file called `bird.html`
    and saved it in the same directory. In that case, you can use the following syntax
    for creating a link to the file.


    ```html

    <a href="bird.html">The List of Birds</a>

    ```

