    ```javascript

    var colors = new array( “red”, “pink”, “green”);


    for var (i=0; i<colors.length; i++)


    {


    Document.write( “The color is: “+ colors[i] +<br/>);


    }

    ```

    上面的示例展示了一个 `for` 循环，该循环一直运行到数值小于数组长度为止。


    ### b) while 循环


    通过 `while` 循环，可以控制循环执行的次数。换句话说，当你知道循环需要执行的次数时，就会使用这种循环。因此，你需要确保循环写得正确，以免导致无限无限循环。`while`
    循环的语法如下所示。


    ```

    32. While (expression) {

    33. 如果表达式为真，则执行的语句(s)

    34. }

    ```


    #### 示例：

    ```javascript

    var i =0;


    while (i<10)


    {


    document.write(i + “<br/>”);


    i++:

    }

    ```

    在上面的示例脚本中，这种类型的循环包含一行代码，它会重复该数值，直到 `while` 循环中的条件为假。所以，如果没有这一行，它将变成死循环。


    ### JavaScript 中的 Hello World 示例


    这里是 JavaScript 的 hello world 示例。这将阐明该语言如何工作，并让你熟悉其语法。正如你所看到的，这门语言非常简单。


    ```html

    <Html>

    <Body>

    <script language="javascript" type="text/javascript">

    <!--

    document.write ("Hello World!")

    //-->

    </script>

    </body>

    </html>

    ```


    ### JavaScript 语法


    JavaScript 应该通过 JavaScript 语句的帮助来实现。这些语句被放置在网页的 `<script>`... `</script>` HTML
    标签内。`<script>` 标签可以放在 HTML 文档的任何位置。`<script>` 标签会提醒浏览器将标签之间的文本解释为脚本。下面是 JavaScript
    语法的一个示例。


    ```html

    <script language="javascript" type="text/javascript">

    JavaScript 代码

    </script>

    ```

    `script` 标签有两个至关重要的属性。它们如下所示。


    1. **Language（语言）：** 此属性用于指定正在使用什么脚本语言。当然，由于你正在使用 JavaScript，因此该属性的值为 `javascript`。另一方面，对于最近版本的
    HTML 和 XHTML，该属性在如今很少被使用。

    2. **Type（类型）：** 此属性目前被用于指示脚本语言。该属性的值应设置为‘text/javascript.''。


    #### 换行和空白


    JavaScript 会忽略空白字符。因此，你可以自由地在脚本中使用换行符、制表符和空格。当然，你应该使用它们来格式化你的程序，并使其看起来一致且整洁。这使得代码变得易于阅读和理解。


    #### 分号


    通常情况下，分号用于标记语句的结束。在 `Java`、`C++` 和 `C` 等语言中情况此类此。然而，JavaScript 在一种条件下使分号变得是可选的。你需要确保每条语句都放置在单独的一行上。只要你满足了这一条件，你就可以避免在代码中插入分号。然而，使用分号是一个良好的习惯，特别是当你正在学习编程时。


    #### 大写敏感性


    你需要确保 JavaScript 中大小写的正确使用，因为这门语言是区分大小写的。因此，所有的关键字、函数名、变量和其他标识符都必须以正确的大小写输入。一致性至关重要。在
    JavaScript 中，标识符 `hi` 和 `HI` 将具有不同的含义。


    ### 如何在 HTML 文档中放置 JavaScript？


    JavaScript 的优点之一是你可以灵活地在 HTML 文档的任何地方添加代码。尽管如此，遵循首选方法是一个极好的主意。这可以提高 HTML 文档中 JavaScript
    代码的可读性和执行效率。以下是将 JavaScript 包含在 HTML 中的最佳方法。


    1. **在 <head> 标签内部**


    这种选项通常用于你想在事件发生时运行脚本的情况。例如，你可能希望在用户点击某处的内容时运行脚本。在这些情况下，脚本将放置在 `<head>` 标签内部，如下例所示。


    ```html

    35. <Html>

    36. <Head>

    37. <script type="text/javascript">

    <!--

    Function sayHello () {

    Alert ("Hello World")

    }

    //-->

    </script>

    </head>

    <Body>

    <input type="button" onclick="sayHello ()" value="Say Hello" />

    </body>

    </html>

    ```


    2. **在 <body> 标签内部**


    在某些情况下，你可能需要脚本在页面加载时运行。这样做是为了允许脚本生成页面中的内容。在这种情况下，脚本必须放置在 `<body>` 标签内部。在这种方法中，你将不会任何用
    JavaScript 定义的函数。你可以看到下面提供的此类 JavaScript 包含的示例。


    ```html

    39. <Html>

    40. <Head>

    41. </head>

    42. <Body>

    43. <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <p>Web Page</p>

    </body>

    </html>

    ```


    3. **在 <head> 和 <body> 标签内部**


    如果你愿意，可以结合上述方法。换句话说，你可以将 JavaScript 同时放置在 `<head>` 和 `<body>` 中。下面的示例展示了它是如何工作的。


    ```html

    45. <Html>

    46. <Head>

    47. <script type="text/javascript">

    <!--

    Function sayHello () {

    Alert ("Hello World")

    }

    //-->

    </script>

    </head>

    <Body>

    <script type="text/javascript">

    <!--

    document.write ("Hello World")

    //-->

    </script>

    <input type="button" onclick="sayHello ()" value="Say Hello" />

    </body>

    </html>

    ```


    4. **在外部文件中**


    当你创建简单的网页时，将 JavaScript 包含在 HTML 文档内部是一个好主。然而，当你创建网站或复杂的网页时，可能会发现自己在多个地方重复相同的代码。你甚至会在多个网页中使用相同的代码。


    正如你在 CSS 中看到的，你可以创建一个完全独立的文件来存放你的 JavaScript 代码。该文件应该具有 .js 扩展名，并与需要代码的网页关联。下面的示例展示了如何在
    HTML 文档中包含外部 JavaScript 文件。在这个示例中，`filename.js` 是包含 JavaScript 代码的文件。


    ```html

    49. <Html>

    50. <Head>

    51. <script type="text/javascript" src="filename.js" ></script>

    52. </head>

    53. <Body>

    54. .......

    </body>

    </html

    ```


    ### JavaScript 中的事件


    事件是导致 JavaScript 代码执行的操作。事件通常由用户触发。例如，鼠标的点击可以是一种事件。基于事件，你可以在 JavaScript 中编写响应。例如，显示消息可以是对事件的响应。这些响应可以认为是事件处理器，因为它们处理了发生的事件。在
    JavaScript 中，可以以多种方式对事件进行分类。毕竟，它们非常多。


    #### 5. onClick 事件


    常见的事件类型是 `onClick` 事件。每当用户左键点击网页时，该事件就会发生。针对这种事件，你可以做出相应的响应，例如显示消息或进行你的验证。下面的示例展示了如何使用此类事件来显示消息。


    ```html

    57. <Html>

    58. <Head>

