    \ chapter we have learnt fundamentals of JavaScript, now let us look at some frequently\
    \ asked questions about this programming language.\n\n### FAQ’s\n\n**Is JavaScript\
    \ same as Java?**\n\nAns: No, they are different programming languages. Java is\
    \ a general purpose programming language, whereas JavaScript is used to make websites\
    \ more interactive.\n\n**What all browsers support JavaScript?**\n\nAns: JavaScript\
    \ is supported by most of the browsers. Listing some of them\n\n* Microsoft Internet\
    \ explorer version 3.0 and above\n* Nestcape Navigator version 2.0 and above\n\
    * Safari\n* Firefox\n* Safari\n* Google Chrome\n* Opera\n\n**How can we add comment\
    \ in JavaScript?**\n\nAns: Three different types of comments are supported by\
