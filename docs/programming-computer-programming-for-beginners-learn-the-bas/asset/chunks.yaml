  trans: "\n\n59. <script type=\"text/javascript\">\n\n60. <!--\n\nfunction sayHello\
    \ () {\n\nAlert (\"Hello World\")\n\n}\n\n//-->\n\n</script>\n\n</head>\n\n<body>\n\
    \n<p>点击下方按钮并查看结果</p>\n\n<form>\n\n<input type=\"button\" onclick=\"sayHello ()\"\
    \ value=\"Say Hello\" />\n\n</form>\n\n</body>\n</html>\n\n### 16. onSubmit 事件类型\n\
    \n此类型的事件在表单提交时发生。可以将表单验证绑定到此事件上。让我们来看一个示例——\n\n如果下文示例中的 `validate()` 函数返回 `true`，则表单会被提交；否则表单将不会提交。\n\
    \n```html\n<html\n\n <head>\n\n <script type= “text/javascript”>\n\n<!—\n\n function\
    \ validation() {\n\n 所有的验证逻辑都写在这里\n\n …….\n\n 返回 true 或 false\n\n }\n\n //-- >\n\
    \n </script>\n\n</head>\n\n<body>\n\n <form 理论 method= “post” action= “t.cgi”\
    \ onsubmit= “return validate()”>\n\n …….\n\n <input “submit” value= “Submit”/>\n\
    \n</form>\n\n</body>\n</html>\n```\n\n### 17. onmouseover 和 onmouseout\n\n此事件对图像和文本都有很好的效果。当你的鼠标悬停在元素上时，会触发\
    \ `onmouseover` 事件；当鼠标移出时，会触发 `onmouseout` 事件。示例：\n\n```html\n<html\n\n<head>\n\
    \n<script type= “text/javascript”>\n\n<!—\n\nfunction over () {\n\ndocument.write\
    \ ( “mouse over”);\n\n}\n\nfunction out() {\n\ndocument.write ( “mouse out”);\n\
    \n}\n\n//-- >\n\n</script>\n</head>\n\n<body>\n\n <p> 将鼠标移入 div 内部以查看结果：</p>\n\
    \n <div onmouseover= “over ()” onmouseout=”out()”>\n\n <h2> 在 div 内部 </h2>\n\n\
    \  </div>\n\n</body>\n</html>\n```\n\n### 关于使用 JavaScript 的一些提示\n\n1. 确保 JavaScript\
    \ 能帮助用户高效、快速地实现目标。如果不能这样做，说明你可能用法不当。\n\n2. 你提供给用户的 JavaScript 解决方案应该比之前的交互更自然。然而，解决方案不应过于独特，以至于用户无法根据以往经验产生联系。目标是确保终端用户对解决方案感到满意。\n\
    \n3. 如果你在处理敏感数据，请不要依赖 JavaScript，因为所有代码都易于被读取。此外，用户可能会在浏览器中关闭 JavaScript。\n\n\
    我们可以说，这种简单但丰富的脚本语言有许多可能性。JavaScript 提供了工具，允许终端用户在页面下载后与其进行交互。在本章中，我们学习了 JavaScript\
    \ 的基础知识，现在让我们来看一些关于这种编程语言的常见问题。\n\n### 常见问题 (FAQ)\n\n**JavaScript 和 Java 相同吗？**\n\
    \n答：不同，它们是不同的编程语言。Java 是一种通用编程语言，而 JavaScript 用于使网站更具交互性。\n\n**哪些浏览器支持 JavaScript？**\n\
    \n答：大多数浏览器都支持 JavaScript。列出部分：\n\n* Microsoft Internet explorer 3.0 及以上版本\n* Netscape\
    \ Navigator 2.0 及以上版本\n* Safari\n* Firefox\n* Safari\n* Google Chrome\n* Opera\n\
    \n**如何在 JavaScript 中添加注释？**\n\n答：JavaScript 支持三种不同类型的注释：\n\na) 多行 C 风格注释，`/*`\
    \ 和 `*/` 之间的所有内容都是注释\n\nb) C++ 风格的单行注释。此类注释以 `//` 开头，并持续到下一行结束。\n\nc) HTML 风格注释以\
    \ `<!--` 开头\n\n**当用户无法执行 JavaScript 代码时，可以向用户显示警告吗？**\n\n答：可以，可以向不支持 JavaScript\
    \ 的浏览器用户显示警告。警告文本可以放置在 `<NOSCRIPT>` 和 `</NOSCRIPT>` 标签之间。\n\n因此，启用了 JavaScript\
    \ 的浏览器将忽略这些标签之间的所有内容，而无法执行的浏览器将在页面上显示你的消息。该消息将显示给禁用了 JavaScript 的用户，以及那些浏览器不支持\
    \ JavaScript 的用户。\n\n**可以删除 JavaScript 变量吗？**\n\n答：你不能总是删除 JavaScript 变量，这取决于以下条件：\n\
    \na) 如果 JavaScript 变量第一次是使用关键字 `var x;` 声明的，则无法删除。但作为变通方法，可以将变量设置为 `null` 或 `undefined`。但这不等同于删除变量。\n\
    \nb) 如果变量 `x` 第一次在脚本中出现时没有任何声明，可以使用 `delete` 操作符，即 `delete x`。\n\n**JavaScript\
    \ 程序不能做什么？**\n\n答：使用 JavaScript 代码无法完成以下操作：\n\na) 不能在客户端局域网或用户系统上打印机或其他设备。\n\n\
    b) 直接访问用户系统或客户端局域网上的文件。唯一的例外是 cookie 文件。\n\nc) 实现多线程或多进程是不可能的。\n\n**删除数组元素的方法是什么？**\n\
    \n答：在 JavaScript 中删除数组元素有两种方法，它们是：\n\na) `myArray.splice(n,1)`。这是一个较慢的方法，但会留下空格。\n\
    \nb) `delete myArray[n]`。\n\n**有方法判断用户是否点击了右键吗？可以使用 onclick 事件处理器吗？**\n\n答：对于左键，会触发点击事件。然而，取决于浏览器，右键可能不会发生点击事件。因此，`onclick`\
    \ 事件处理器不是处理右键的可靠方法。相反，我们应该使用 `mousedown` 事件。大多数浏览器支持任何按钮的 `mouseup` 和 `mousedown`\
    \ 事件。\n\n**JavaScript 可以使用什么样的数字格式？**\n\n答：JavaScript 代码中可以使用多种方式编写数学常量和数字字面量，例如：\n\
    \na) 指数形式的十进制，例如 `5.57e-11`\n\nb) 常规十进制数，例如 `5,7,137`\n\nc) 八进制数，例如 `-0550124`\n\
    \nd) 以零开头的正八进制和以零开头的负八进制。\n\ne) 十进制，例如 `0xFF,-0FFF`。正十六进制以 `0x` 开头，负十六进制以 `-0x`\
    \ 开头。\n\nf) 预定义的数学常量，例如 `Math.PI` //pi = 3.14159…\n\n**如何测试特定变量持有字符串还是数字？**\n\n\
    答：测试变量持有字符串还是数字是通过使用 `typeof` 操作符。如果变量持有字符串，`typeof(variable)` 将返回 “string”；如果它持有数字，则返回\
    \ “number”。\n\n"
