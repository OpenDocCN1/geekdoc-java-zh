  trans: '


    这三种语言是交织在一起的：`HTML` 提供了网站的基本结构，并通过 `JavaScript` 和 `CSS` 对其进行了增强和修改。`CSS` 告诉 `HTML`
    应该使用什么颜色、字体和其他样式，而 `JavaScript` 则告诉 `HTML` 如何执行某些任务，如弹出窗口等。


    在学习 Web 开发时，最需要记住的两个点是：


    a) 使用正确的 `HTML` 标签 – 内容结构由不同的 `HTML` 标签来描述，每个标签都有其特定的含义和定义的位置。


    b) 保持你的 `JavaScript`、`HTML` 和 `CSS` 代码分离 - 始终将 `JavaScript` 和 `CSS` 放在于 `HTML`
    文件之外的独立文件中。这将让你的工作变得简单，并且你能够更好地进行管理。因此，将所有的样式和功能性代码放在一个地方会让事情变得轻松。


    ## 结论


    现在，这本关于 `HTML`、`CSS` 和 `JavaScript` Web 编程的书就结束了。所有这些编程语言本身都非常庞大。然而，由于它们简单易用，你在掌握它们时应该不会遇到太大问题。通过努力和一点时间，你将能够很快创建功能完整的网站。


    当然，这本书应该已经让你在所有三种语言上打下了良好的基础。你应该已经看过了“Hello World”示例，并注意到它们是多么简单。因此，你在每种语言的基础语法上不应该有任何问题了。


    你可能已经接触过这些语言中常用的基本函数、语句和标签。更重要的是，在你自己创建的网页中使用它们时，应该不再会有任何问题了。


    在 `HTML` 中，你了解了如何编写一个简单的网页并填充内容。然后，通过 `CSS`，你已经能够对该网页进行样式化并使其看起来吸引人。最后，`JavaScript`
    允许你的网页更具交互性。因此，你的网页现在看起来和感觉应该非常像你以前在互联网上赞叹过的网页了。


    随着本书的结束，我祝你未来的编程之路一切顺利。这是一项令人兴奋的活动，从长远来看对你的职业生涯非常有帮助。


