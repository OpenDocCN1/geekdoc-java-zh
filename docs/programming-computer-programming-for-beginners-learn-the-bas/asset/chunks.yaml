- fmt: "\nYou should have very little problems in picking up the more advanced skills.\
    \ In fact, you should find it easy to stylize the text in a web page at a basic\
    \ level.\n\n# Chapter 4: Learning JavaScript: Making the Web More Interactive\n\
    \nSo far, you have learned how to create a basic web page with HTML. You also\
    \ know how to make your web pages look beautiful with the help of CSS. However,\
    \ that is not really enough for a modern web page. These days, a website needs\
    \ to be interactive. In order to do so, you need to implement `JavaScript`.\n\n\
    ## What is JavaScript?\n\n`JavaScript` is actually a dynamic programming language.\
    \ When used alongside HTML, it can provide the web page with dynamic interactivity.\
    \ However, `JavaScript`, or `JS` for short, is mainly used as a scripting language\
    \ in an HTML document. This language does not require constant downloads and can\
    \ be run easily. It is commonly used for quizzes and polls.\n\n## Understanding\
    \ Scripting Language\n\nBefore we learn all about `JavaScript` we need to understand\
    \ what a script is. It is a sequence of statements which provide instructions\
    \ for certain tasks to be performed. Generally, scripting languages are easier\
    \ to learn and faster to code than structured languages. Few other examples of\
    \ scripted languages are; `Python`, `PHP`, `Tcl` etc. These languages can be rooted\
    \ within HTML and are typically used to add functionality to the web page such\
    \ as graphic displays or different menu styles. Scripting languages can be client\
    \ side or server side. Under client side scripting languages, the data that the\
    \ end user sees is affected whereas in the server side scripting language the\
    \ data is manipulated in a database on the server.\n\n`JavaScript` can be used\
    \ for providing responses to the users or even to start a slideshow. With a scripting\
    \ language like `JavaScript`, a basic web page can be turned into a lively platform\
    \ for the users.\n\n## History of JavaScript\n\n`JavaScript` was created in the\
    \ year 1995 for using in a web browser, `Netscape Navigator`. The original name\
    \ of this language was `Mocha` which was given by the founder of Netscape, Marc\
    \ Andreessen. Later in that year the name was changed to `LiveScript` and after\
    \ receiving a trademark license, the name `JavaScript` was given. The first trademark\
    \ version of the language was released in the year 1997 by the name `ECMAScript`.\n\
    \nToday `JavaScript` has entered a completely new phase of evolution. There has\
    \ been lot of innovations, standardizations and new developments according to\
    \ the modern day browsers.\n\n## Features of JavaScript\n\n1. **Browser Support**-\
    \ Most of the browser accepts this scripting language and hence no additional\
    \ plugins are needed.\n2. **Can be used on both server side and client side**-The\
    \ user can actually change the structure of web pages at runtime since `JavaScript`\
    \ has access to the `DOM` (document object model). Hence, it can be used to add\
    \ different effects to the web pages. Also, it can be used on the server side\
    \ as well.\n3. **Functional programming language**-in this language a function\
    \ can be assigned to variables just like any other data types. Apart from that\
    \ a function can accept another function as a parameter.\n4. **Support for objects**-It\
    \ is an object oriented language which makes it easy to learn and use.\n5. **Other\
    \ features –**\n    a) It is a case sensitive scripting language.\n    b) It can\
    \ display information or pull out correct data according the computer’s clock\
    \ time.\n    c) It can open pages in customized windows, where you can specify\
    \ if the menu line, browser buttons, status line or anything else should be present.\n\
    \    d) The content can be displayed randomly without using server programs.\n\
    \    e) All statements in `JavaScript` are terminated with a semicolon.\n\n##\
    \ Advantages Offered by JavaScript\n\n`JavaScript` is the most versatile yet simple\
    \ and effective language. As we have learned about is wide range of usage and\
    \ extended functionality now we will look at some of the advantages which are\
    \ offered by this language. `JavaScript` offers a range of benefits to the users.\
    \ Some of them are given below.\n\n1. **Simplicity:** `JavaScript`, like `HTML`\
    \ and `CSS`, is quite easy to learn. Moreover, you can also start implementing\
    \ `JavaScript` code with equal ease. Its syntax is as simple and is close to writing\
    \ English language. `JavaScript` uses the `DOM` model which has many pre-written\
    \ functionality for various objects on pages. Hence, it becomes very easy to develop\
    \ a script for a custom purpose.\n2. **Speed:** `JavaScript` is executed on the\
    \ client-side. As a result, all code functions can be executed immediately. There\
    \ is no need to contact the server and then wait for a response. This allows `JavaScript`\
    \ to be quite fast.\n3. **Versatility:** `JavaScript` is compatibility with quite\
    \ a few other languages. It is, in fact, possible to insert `JavaScript` into\
    \ any web page irrespective of its file extension. You can also use `JavaScript`\
    \ inside scripts that have been written in `PHP`, `Perl` and other languages.\
    \ Therefore, `JavaScript` can be used in a wide range of applications.\n4. **API\
    \ Availability:** The availability of Application Programming Interfaces, or `APIs`\
    \ for short, provides `JavaScript` with a range of functionality. This includes\
    \ the setting of `CSS` styles, generation of audio samples and dynamic creation\
    \ of `HTML` among others. While these `APIs` are built into the different web\
    \ browsers, third-party `APIs` are also available which allow you to incorporate\
    \ functionality from other web properties such as social networks like `Facebook`.\n\
    5. **Extended functionality-** `JavaScript` has third party add-ons like, `Greasemonkey`.\
    \ This add-on enables developers to write snippets of the language which can execute\
    \ on desired page so as to extend its functionality. For example, you want to\
    \ add a feature to a website, you can write it on your own and use this add-on\
    \ to implement on the web page.\n\n## Disadvantages of JavaScript\n\nTheoretically\
    \ this language is quite beneficial for developers, but in practicality it has\
    \ some disadvantages-\n\n1. **Security – Once the snippets written in `JavaScript`\
    \ are appended on to the web pages are executed on client’s server immediately\
    \ and hence they might be used to take undue advantage of the user’s system. There\
    \ are certain restrictions which have been set according to modern web standards\
    \ on browsers. However, malicious code can still be executed.**\n2. **Inconsistency-**\
    \ `JavaScript` may be rendered differently by different layout engines resulting\
    \ in inconsistency in terms of interface and functionality. However, the latest\
    \ versions of `JavaScript` have been geared according to universal standards but\
    \ certain variations are still there.\n3. **Slow execution- Complex scripts in\
    \ the language take longer starting and running time.**\n\n## What All Can Be\
    \ Done with JavaScript?\n\nSince its inception `JavaScript` has been soaring popularity\
    \ amongst the web developers since a lot of things can be done with `JavaScript`.\
    \ In fact, the options are pretty much limitless. It can be used for making simple\
    \ things such as image galleries, carousels, and providing responses to the button\
    \ clicks of the user. Advanced features possible with include animated 3D graphics\
    \ and games. You can even use `JavaScript` for developing complete database-based\
    \ apps among others. Apart from these there are more modern day uses of `JavaScript`\
    \ which we have summarized for you:-\n\n1. It enhances the interfaces `HTML` gives\
    \ us. `JavaScript` converts the normal input box into a combo box where you can\
    \ enter your own values or choose from a list of preset values.\n2. `JavaScript`\
    \ can be used to animate elements on a page. For example, highlighting specific\
    \ sections of a page or to show and hide information can be done easily, thus\
    \ giving a rich user experience.\n"
  raw: 'You should have very little problems in picking up the more advanced skills.
    In fact, you should find it easy to stylize the text in a web page at a basic
    level.


    **Chapter 4: Learning JavaScript: Making the Web More Interactive**


    So far, you have learned how to create a basic web page with HTML. You also know
    how to make your web pages look beautiful with the help of CSS. However, that
    is not really enough for a modern web page. These days, a website needs to be
    interactive. In order to do so, you need to implement JavaScript.


    **What is JavaScript?**


    JavaScript is actually a dynamic programming language. When used alongside HTML,
    it can provide the web page with dynamic interactivity. However, JavaScript, or
    JS for short, is mainly used as a scripting language in an HTML document. This
    language does not require constant downloads and can be run easily. It is commonly
    used for quizzes and polls.


    **Understanding Scripting Language**


    Before we learn all about JavaScript we need to understand what a script is. It
    is a sequence of statements which provide instructions for certain tasks to be
    performed. Generally, scripting languages are easier to learn and faster to code
    than structured languages. Few other examples of scripted languages are; Python,
    PHP, Tcl etc. These languages can be rooted within HTML and are typically used
    to add functionality to the web page such as graphic displays or different menu
    styles. Scripting languages can be client side or server side. Under client side
    scripting languages, the data that the end user sees is affected whereas in the
    server side scripting language the data is manipulated in a database on the server.


    JavaScript can be used for providing responses to the users or even to start a
    slideshow. With a scripting language like JavaScript, a basic web page can be
    turned into a lively platform for the users.


    **History of JavaScript**


    JavaScript was created in the year 1995 for using in a web browser, Netscape Navigator.
    The original name of this language was Mocha which was given by the founder of
    Netscape, Marc Andreessen. Later in that year the name was changed to LiveScript
    and after receiving a trademark license, the name JavaScript was given. The first
    trademark version of the language was released in the year 1997 by the name ECMAScript.


    Today JavaScript has entered a completely new phase of evolution. There has been
    lot of innovations, standardizations and new developments according to the modern
    day browsers.


    **Features of JavaScript**


    1.  **Browser Support**- Most of the browser accepts this scripting language and
    hence no additional plugins are needed.


    2.  **Can be used on both server side and client side**-The user can actually
    change the structure of web pages at runtime since JavaScript has access to the
    DOM (document object model). Hence, it can be used to add different effects to
    the web pages. Also, it can be used on the server side as well.


    3.  **Functional programming language**-in this language a function can be assigned
    to variables just like any other data types. Apart from that a function can accept
    another function as a parameter.


    4.  **Support for object**s-It is an object oriented language which makes it easy
    to learn and use.


    5.  **Other features –**


    a) It is a case sensitive scripting language


    **b)** It can display information or pull out correct data according the computer’s
    clock time.


    **c)** It can open pages in customized windows, where you can specify if the menu
    line, browser buttons, status line or anything else should be present.


    **d)** The content can be displayed randomly without using server programs.


    **e)** All statements in JavaScript are terminated with a semicolon.


    **Advantages Offered by JavaScript**


    JavaScript is the most versatile yet simple and effective language. As we have
    learned about is wide range of usage and extended functionality now we will look
    at some of the advantages which are offered by this language. JavaScript offers
    a range of benefits to the users. Some of them are given below.


    1. **Simplicity:** JavaScript, like HTML and CSS, is quite easy to learn. Moreover,
    you can also start implementing JavaScript code with equal ease. Its syntax is
    as simple and is close to writing English language. JavaScript uses the DOM model
    which has many pre-written functionality for various objects on pages. Hence,
    it becomes very easy to develop a script for a custom purpose.


    2. **Speed:** JavaScript is executed on the client-side. As a result, all code
    functions can be executed immediately. There is no need to contact the server
    and then wait for a response. This allows JavaScript to be quite fast.


    3. **Versatility:** JavaScript is compatibility with quite a few other languages.
    It is, in fact, possible to insert JavaScript into any web page irrespective of
    its file extension. You can also use JavaScript inside scripts that have been
    written in PHP, Perl and other languages. Therefore, JavaScript can be used in
    a wide range of applications.


    4. **API Availability:** The availability of Application Programming Interfaces,
    or APIs for short, provides JavaScript with a range of functionality. This includes
    the setting of CSS styles, generation of audio samples and dynamic creation of
    HTML among others. While these APIs are built into the different web browsers,
    third-party APIs are also available which allow you to incorporate functionality
    from other web properties such as social networks like Facebook.


    5. **Extended functionality-** JavaScript has third party add-ons like, Greasemonkey.
    This add-on enables developers to write snippets of the language which can execute
    on desired page so as to extend its functionality. For example, you want to add
    a feature to a website, you can write it on your own and use this add-on to implement
    on the web page.


    **Disadvantages of JavaScript**


    Theoretically this language is quite beneficial for developers, but in practicality
    it has some disadvantages-


    1.  Security –Once the snippets written in JavaScript are appended on to the web
    pages are executed on client’s server immediately and hence they might be used
    to take undue advantage of the user’s system. There are certain restrictions which
    have been set according to modern web standards on browsers. However, malicious
    code can still be executed.


    2.  Inconsistency- JavaScript may be rendered differently by different layout
    engines resulting in inconsistency in terms of interface and functionality. However,
    the latest versions of JavaScript have been geared according to universal standards
    but certain variations are still there.


    3.  Slow execution- Complex scripts in the language take longer starting and running
    time.


    **What All Can Be Done with JavaScript?**


    Since its inception JavaScript has been soaring popularity amongst the web developers
    since a lot of things can be done with JavaScript. In fact, the options are pretty
    much limitless. It can be used for making simple things such as image galleries,
    carousels, and providing responses to the button clicks of the user. Advanced
    features possible with include animated 3D graphics and games. You can even use
    JavaScript for developing complete database-based apps among other things. Apart
    from these there are more modern day uses of JavaScript which we have summarized
    for you:-


    1.  It enhances the interfaces HTML gives us. JavaScript converts the normal input
    box into a combo box where you can enter your own values or choose from a list
    of preset values.


    2.  JavaScript can be used to animate elements on a page. For example, highlighting
    specific sections of a page or to show and hide information can be done easily,
    thus giving a rich user experience.'
