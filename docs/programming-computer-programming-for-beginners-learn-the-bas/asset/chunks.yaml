    In CSS, we do not write programs per se. After all, it is a style sheet language.
    Instead, we write rules. A CSS will have a set of style rules which will be interpreted
    by the browser before applying them to the associated elements in the HTML document.
    A style rule, as you have already seen, comprises of three parts.


    - **Selector**: This is the HTML tag on which the style will be applied.

    - **Property**: This is a kind of attribute of the HTML tag. All HTML attributes
    get converted into their respective CSS properties.

    - **Value**: Each property has a corresponding value attached to it.


    For example:


    ```css

    h1 {color:brown;font-size:12px;}

    ```


    In the above example:

    - `h1` is the selector

    - `color` is property

    - `brown` is value

    - `font-size` is property

    - `12px` is value


    The selector points to the element which you want to style. The declaration block
    contains more than one declaration which is separated by semi colon and every
    declaration includes a CSS value and property name which are separated by a colon.
    A CSS declaration mandatorily ends with a semi colon. The declaration blocks are
    enclosed in curly brackets.


    The basic syntax of all CSS rules is given below.


    ```css

    Selector {property: value}

    ```


    CSS selectors find the HTML element based on their name, class, id, attribute
    and more. Selectors in CSS can be defined in a number of ways. In fact, you can
    easily choose one that you are comfortable using. Here are a few kinds of selectors
    and how they are used.


    ### 1. The Type Selectors

    You would have already noticed the use of this selector in the preceding examples.
    This allows the rule to be applied to all elements of the same type. In the following
    example, the green color is applied to all the level 1 headings in the page.


    ```css

    13. h1 {

    Color: #36CFFF;

    }

    ```


    ### 2. The Universal Selectors

    Instead of selecting elements of a particular type, you can use the universal
    selector. This will allow you to apply the rule to any element type that can use
    the given property. The following example illustrates the use of universal selectors.
    In it, the entire content of the document will be displayed in black.


    ```css

    14. * {

    Color: #000000;

    }

    ```


    ### 3. The Descendant Selectors

    In some cases, you may wish to apply style rules to a specific element only when
    that element lies in another specific element. This is certainly possible with
    the help of descendant selectors. You can take a look at the following example.
    In it, the style rule will only be applied to the `em` element when it is present
    inside the `ul` tag.


    ```css

    Ul em {

    1. Color: #000000;

    }

    ```


    ### 4. The Class Selectors

    It is possible to use the class attribute to define the style rules for the elements.
    With class selectors, elements with that class will be stylized as per the defined
    rule. Take a look at the example given below.


    ```css

    15. .black {

    16. Color: #000000;

    17. }

    ```


    On using this rule, you will see that all the elements whose class attributes
    are set to `black` in the document will have their content displayed in black.
    At the same time, it is possible to refine the rule future and specify a certain
    element. Check out the following example.


    ```css

    18. h1.black {

    19. Color: #000000;

    20. }

    ```


    In the above rule, the content will be stylized black but only in the case of
    `h1` elements whose class attribute has been set to `black`. It is also possible
    to apply multiple class selectors to a specific element. Take a look at the following
    example to see how it works.


    ```html

    21. <p class="center bold">

    Text

    </p>

    ```


    ### 5. The ID Selectors

    You can also take the ID attribute into account when defining the style rules
    for the elements. In this case, all elements that have that specific ID will be
    stylized as per the rule you have defined.


    ```css

    22. #black {

    Color: #000000;

    }

    ```


    On using this CSS rule, you will find that all elements that have `black` as their
    id attribute will have their content displayed in black. It is also possible to
    refine this rule further and target a specific kind of element. In the following
    example, only the `h1` tags that have `black` as their attribute will be affected
    by the rule.


    ```css

    h1#black {

    Color: #000000;

    }

    ```


    ID selectors are quite useful when they are applied alongside descendant selectors.
    In the following example, you will see that all the `h2` tags will be shown in
    black only when those level 2 headings are present inside tags that have their
    id attribute specified as `black`.


    ```css

    #black h2 {

    23. Color: #000000;

    }

    ```


    ### 6. The Child Selectors

    Child selectors are similar to descendant selectors. However, their functionality
    is quite different. The example given below illustrates the use of child selectors.
    In this CSS rule, a paragraph will be displayed in black only if they are the
    direct child of the `body` element. If a paragraph exists inside any other element
    such as `td` or `div`, it will not be.


    ```css

    24. Body > p {

    Color: #000000;

    }

    ```


    ### 7. The Attribute Selectors

    With the help of attribute selectors, you can apply a style to an element that
    has a particular attribute. In the given example, the `input` of `text` will remain
    unaffected.


    ```css

    25. Input [type="text"] {

    Color: #000000;

    }

    ```


    Attribute selectors have one major advantage. In these cases, follow certain rules:

    - `P [Lang]`–In this case, paragraph elements have a Lang attribute.

    - `P [Lang="en"]`–those with the exact value of "en".

    - `P [Lang~="en"]`–those containing the word "en".

    - `P [lang|="en"]`–exactly "en", or begins with "en".


    ### 8. Multiple Style Rules

    In certain situations, you may be required to set more than one style rule for
    a specific element. CSS allows you to combine different properties and their values
    and make a single block of code. You can see how this works in the example.


    ```css

    26. h1 {

    Color: #000000;

    Font-weight: normal;

    Letter-spacing: .3em;

    Margin-bottom: 2em;

    Text-transform: lowercase;

    }

    ```


    As you can see in the example, all the pairs of property and value are separated
    with the help of a semicolon. If you want, you can keep the rules together in
    a single line instead of using multiple lines as long as you ensure that they
    are divided with a semicolon. However, keeping them in different lines enhance
    the readability of code.


    ### 9. Selector Groups

    It is also possible for you to apply a style rule to multiple selectors if you
    want or require. In this case, the selectors will have to be separated with the
    help of a comma. You can see this in action in the example.


    ```css

    27. H1, h2, h3 {

    Color: #000000;

    Font-weight: normal;

    Letter-spacing: .4em;

    Margin-bottom: 1em;

    Text-transform: lowercase;

    }

    ```


    The order of the list does not affect the rule.


    **Using Colors in CSS**


    When you are stylizing an HTML document, the color will certainly be one of the
    things you will be implementing. In CSS, you have the ability to choose between
    16,777,216 colors for shading your text. Here is how you can implement them in
    your Style rules.


    **The Values of the Color Property**

