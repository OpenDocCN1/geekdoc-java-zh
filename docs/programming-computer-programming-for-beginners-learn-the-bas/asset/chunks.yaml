    # 简介

    在 CSS 中，`color` 属性的值可以使用名称来指定。或者，你也可以使用十六进制代码或 RGB 代码。下面列出了将红色作为该属性的值的几种使用方法。换句话说，当配合
    `color` 属性使用以下代码时，你会发现文本将以红色显示。


    * `red`

    * `Rib` (100%, 0%, and 0%)

    * `rgb(255,0,0)`

    * `#f00`

    * `#ff0000`


    CSS 中预定义了某些颜色名称。它们包括黄色、蓝色、洋红色、柠檬绿、绿色、海军蓝、红色、白色、黑色、青色和橄榄绿等。CSS 还认为 `transparent`（透明）是一个有效值。除了黑色和白色之外，你会发现
    CSS 样式规则很少很少颜色名称。这是由于这些名称具有很高的特异性，导致灵活性受到限制。


    RGB 代码由三个值组成，每个值代表一种原色。值的范围从 0 到 255，阴色的最低色级用 0 表示。255 是最高可能值。以百分比的形式表示这些值也是可行的。


    十六进制代码使用 16 进制体系。每个十六进制数字前面都有一个井号符号。在 CSS 中，它们的长度可以是三位或六位。三位数版本只是六位版本的简写形式。你会发现后版本允许你对颜色进行更大的控制。


    ## 使用 Color 属性

    当你想要为文档应用颜色时，可以使用下面两个属性中的一个或两个。


    * `Color`: 用于给文本应用颜色。

    * `Background- color`: 用于给背景应用颜色。


    在使用这些命令时，请确保你已正确输入了 `color`。浏览器不识别 `color.`。相反，它们可以理解 `color`。这些属性可以应用于几乎所有的 HTML
    元素。


    ## 在 CSS 中样式化文本

    文本是另一个常见的样式化项目，用于提高可读性等。CSS 为你提供了许多属性，可以使用它们来更改网页上文本的外观和布局。下面是文本中一些常用的属性。


    ### 1. font-family 属性

    该属性定义文本的字体，例如 Verdana 和 Times New Roman。当你使用此属性时，需要确保浏览器能够找到指定为值的字体。这意味着该字体必须在用户的计算机上可用。如果你使用稀有或不常用的字体，你的用户可能无法使用该文件，因为他们的计算机上没有该字体。有很多字体在计算机上总是可用的，如上面的
    Verdana、Times New Roman 以及 Arial 和 Calibri。


    另一方面，你有能力将多个字体作为此属性的值。你需要借助逗号来分隔值。这允许浏览器在用户的计算机上搜索列表提到的字体之一。一旦找到正确的字体，该字体将将用于显示文本。


    请记住，浏览器将按照顺序遵循列表。因此，在你指定为 `Arial, Verdana, serif` 的列表中，浏览器将首先搜索 Arial，如果找到它则使用它。如果没有，它将搜索
    Verdana 字体，依此类推。你需要记住的另一点是，如果名称由两个或多个单词组成，则需要将字体名称放在引号中。


    这里有一个显示如何使用该属性的简单示例。


    ```css

    Font-family: Verdana, Arial, “Times New Roman”, serif

    ```


    ### 2. Font-size

    该属性设置文本的大小。当然，你可以设置任何想要的值。然而，你需要考虑内容的可读性。因此，你想要作为标题的文本应该具有较高的 `font-size` 值，但同时也应该具有适当的标题标签，如
    `<h1>`。你不应该简单地使用 HTML 段落元素并给它们设置更高的 `font-size`。用于文本大小的常用单位有：


    * **a) px (像素)** - 它是一个绝对单位，可以根据需要增加或减少文本的像素大小。

    * **b) ems** – 父元素设置的字体大小等于 `1em`。它可以用于任何内容的大小，而不只是文本。整个网站可以使用 ems 进行调整，从而使维护变得容易。

    * **c) rems** - 它们的工作方式与 ems 类似，但文档根元素设置的字体大小等于 `1rem` 而不是父元素。这使得计算字体大小变得更容易。然而，Internet
    explorer 8 或更低版本不支持 rems。


    元素的 `font-size` 与父元素一致。在所有浏览器中，根元素的字体大小默认被设置为 `16px`。因此，根元素内的任何段落都具有 `16px` 的
    `font-size`。


    让我们来看这个简单的尺寸示例：


    当你调整文本大小时，最好始终将文档的 `font-size` 设置为 `10px`，这样计算就会容易得多。现在，当你这样做时，所需的 `rem` 或 `ems`
    值将是像素字体大小除以 10，而不是除以其他数字。


    ### 3. Font-weight

    该属性用于检查文本是否加粗。通常，此属性的值为 100 到 900 之间的任何值。这种增量确保了与旧浏览器的兼容性。


    ### 4. Font-style

    该属性用于将文本样式化为斜体。此属性的可用值为 italic 或 normal。


    ### 5. Text-decoration

    该属性用于文本是否应该有下划线、删除线。如果你不需要这些效果，可以使用值 normal。其他可用值如下：


    * `Underline`: 给文本加下划线。

    * `Line-Through`: 在文本上添加一条线。

    * `Overline`: 在文本上方添加一条线。


    ### 6. Text drop shadows

    文本投影有四个属性：


    * **a) 水平偏移** - 它接受大多数可用的 CSS 大小长度单位。然而，通常使用 `px`。此值必须包含。

    * **b) 垂直偏移** - 阴影上下移动而不是左右移动。此值必须包含。

    * **c) 模糊半径** - 阴影散得更开。在这种情况下如果没有包含此值，默认变为 0，这意味着没有模糊。此属性也接受大多数长度和大小单位。

    * **d) 颜色** - 阴影的基础颜色，可以是任何 CSS 颜色单位。如果不包含，默认保持为黑色。


    也可以通过逗号分隔多个投影值为文本设置多个投影。


    ### 7. Text Color

    该属性用于设置文本的颜色。


    ### 8. Text Alignment

    text align 属性用于水平对齐文本。文本可以右对、左对、居中或两端。


    ```css

    h1{text-align:right;}

    ```


    当使用两端对齐时，文本每行都获得相同的宽度，左右边距是平直的。


    ```css

    div{text-align:justify;}

    ```


    ### 9. Text transformation

    这指定文本中的小写和大写字母。通过使用此属性，单词的首字母也可以写成大写。


    ```css

    p.captitalize{text-transform:capitalize;}

    ```


    ### 10. Text Indentation

    它指定第一行的缩进。


    ```css

    p{text-indent:40px:}

    ```


