    ***</html>***\n\n16.  **onSubmit Event type**\n\nThis type of event occurs when\
    \ a form is submitted. The form validation can be put against this event. Let\
    \ us look at an example-\n\nIf the validate() function in the below mentioned\
    \ example returns true then only the form will get submitted, if not that than\
    \ the form will not be submitted.\n\n<html>\n\n <head>\n\n <script type= “text/javascript”>\n\
    \n <!—\n\n function validation() {\n\n all validation goes here\n\n …….\n\n return\
    \ either true or false\n\n }\n\n //-- >\n\n </script>\n\n</head>\n\n<body>\n\n\
    \ <form method= “post” action= “t.cgi” onsubmit= “return validate()”>\n\n …….\n\
    \n <input type “submit” value= “Submit”/>\n\n</form>\n\n</body>\n\n</html>\n\n\
    17.  onmouseover and onmouseout\n\nThis event gives a nice effect both with images\
    \ and text. When you bring your mouse over an element onmouseover event is triggered\
    \ and when the mouse is moved out then onmouseout is triggered. Example:\n\n<html>\n\
    \n<head>\n\n<script type= “text/javascript”>\n\n<!—\n\nfunction over () {\n\n\
    document.write ( “mouse over”);\n\n}\n\nfunction out() {\n\ndocument.write ( “mouse\
    \ out”);\n\n}\n\n//-- >\n\n</script>\n\n</head>\n\n<body>\n\n <p> drag your mouse\
    \ inside the division to view the result:</p>\n\n <div onmouseover= “over ()”\
    \ onmouseout=”out()”>\n\n <h2> It is inside the division </h2>\n\n  </div>\n\n\
    </body>\n\n</html>\n\n**Some tips for using JavaScript**\n\n1.  Ensure that JavaScript\
    \ aids the user in reaching a goal efficiently and quickly. In case it doesn’t\
    \ that means that you are probably using it wrong.\n\n2.  The JavaScript solutions\
    \ which you provide to the user should be naturally better than the earlier interaction.\
    \ However, the solution should not be so different that the user is not able to\
    \ relate to it with previous experience. The aim is to ensure that end user feels\
    \ satisfied with the solution.\n\n3.  In case you are handling sensitive data\
    \ than do not rely on JavaScript since all codes are easily available to read.\
    \ Apart from that users might turn off JavaScript in their browsers.\n\nWe can\
    \ say that there are so many possibilities with this simple but rich scripting\
    \ language. JavaScript provides the tools that allow the end users to interact\
    \ with a web page after it has been downloaded. In this chapter we have learnt\
    \ fundamentals of JavaScript, now let us look at some frequently asked questions\
    \ about this programming language.\n\n**FAQ’s**\n\n**Is JavaScript same as Java?**\n\
    \nAns: No, they are different programming languages. Java is a general purpose\
    \ programming language, whereas JavaScript is used to make websites more interactive.\n\
    \n**What all browsers support JavaScript?**\n\nAns: JavaScript is supported by\
    \ most of the browsers. Listing some of them\n\n· Microsoft Internet explorer\
    \ version 3.0 and above\n\n· Nestcape Navigator version 2.0 and above\n\n· Safari\n\
    \n· Firefox\n\n· Safari\n\n· Google Chrome\n\n· Opera\n\n**How can we add comment\
    \ in JavaScript?**\n\nAns: Three different types of comments are supported by\
    \ JavaScript\n\na) Multiple line C-Style comments, where everything written between\
    \ /*and*/ is a comment\n\nb) Online comments of C++ style. The comments under\
    \ this type begin with // and continue till the next line break.\n\nc) HTML style\
    \ comments begin with (<!--)\n\n**Can a warning be displayed for the user incase\
    \ the user’s is unable to execute the JavaScript code?**\n\nAns: Yes, a warning\
    \ can be displayed to user about the JavaScript incapable browsers. The warning\
    \ text can be placed between the tags <NOSCRIPT> and </NOSCRIPT>.\n\nTherefore,\
    \ the browsers which are JavaScript enabled will ignore everything between these\
    \ tags and the browsers which cannot execute will display your message on the\
    \ page. The message will be displayed to users who have disabled JavaScript and\
    \ to those as well whose browsers do not support JavaSacript.\n\n**Is it possible\
    \ to delete a JavaScript?**\n\nAns: You cannot always delete JavaScript variable,\
    \ it depends on the following conditions:\n\n*a)* JavaScript variable cannot be\
    \ deleted if it has been declared with keyword *var x;* at the first time. However,\
    \ as a workaround, variable can be set to *null* or to *undefined*. But this is\
    \ not equal to deleting the variable.\n\n*b)* In case the variable *x* appeared\
    \ first in the script without any declaration, then the delete operator, i.e.\
    \ *delete x* can be used.\n\n**What all cannot be done with JavaScript programs?**\n\
    \nAns: The following cannot be done with JavaScript code:\n\na) Printers or other\
    \ devices cannot be used on client side LAN or the user’s system.\n\nb) Accessing\
    \ files directly on the user’s system or client side LAN. The only exception is\
    \ the cookie files.\n\nc) Implementing of multithreading or multiprocessing is\
    \ also not possible.\n\n**What is method to delete an array element?**\n\nAns:\
    \ There are two different ways to delete an array element in JavaScript, they\
    \ are:\n\na) myArray.splice(n,1). This is a slower method but does not leave a\
    \ gap in the array.\n\nb) delete myArray[n] . This method is faster but it leaves\
    \ a gap in index n.\n\n**Is there a way to find out that whether the user clicked\
    \ right or left mouse button? Can *onclick* event handler be used?**\n\nAns: For\
    \ the left mouse button the click event is fired. However, depending upon the\
    \ browser click may or may not occur in case of right mouse button. Especially\
    \ in Microsoft Internet Explorer click event doesn’t work for right mouse button.\
    \ Therefore, *onclick* event handler is not a reliable method to do right vs left\
    \ mouse button test. Instead we should use the *mousedown* events. Most of the\
    \ browsers support *mouseup* and *mousedown* events for any mouse button.\n\n\
    What kind of number formatting can be used in JavaScript?\n\nAns: Mathematical\
    \ constants and number literals can be written is many ways under JavaScript code,\
    \ such as:\n\na) Decimal numbers in exponential form, e.g.: 5.57e-11\n\nb) Conventional\
    \ decimal numbers, e.g. : 5, 7, 137 , 1.3 etc.\n\nc) Octal numbers, e.g. : -055\
    \ 01234 0212\n\nd) Positive octal numbers that begin with zero and negative octal\
    \ numbers that start with –zero.\n\ne) Hexadecimals e.g.: 0xFF , -0xCFFF. The\
    \ positive hexadecimals begin with 0x and negative hexadecimals start with -0x\
    \ .\n\nf) Predefined mathematical constants, e.g. : Math.PI //pi = 3.14159…\n\n\
    **How can we test whether a particular variable holds a string or a number?**\n\
    \nAns: To test whether a variable holds a string or number is by using the *typeof*\
    \ operator. In case the variable holds a string , *typeof(variable)* will return\
    \ “string” and if it holds number than it will return “number”.\n\nIn this chapter,\
    \ we have covered the basic fundamentals of JavaScript which would have given\
    \ you a fair idea on its working. By adding JavaScript to your HTML pages you\
    \ can make your website more dynamic and interactive. We also learned about some\
    \ important concepts of this scripting language such as operators, functions and\
    \ variables and covered some standard programming concepts like if statements,\
    \ switch statements and loops. However, it is a vast language and it offers loads\
    \ of features and functions which can be learned and brought into practice with\
    \ time.\n\n**How HTML5, CSS and JavaScript work together?**\n\nHTML5 itself is\
    \ a very powerful programming language but its actual power is realized when it\
    \ is used with JavaScript and CSS3\\. JavaScript has undoubtedly emerged as one\
    \ of the best scripting language to render great visual effects to a website.\
    \ Graphic libraries like WebGl in JavaScript allows developers to create interactive\
    \ 3D graphics within the browser by utilizing the plugin free character of HTML\
    \ canvas element."
