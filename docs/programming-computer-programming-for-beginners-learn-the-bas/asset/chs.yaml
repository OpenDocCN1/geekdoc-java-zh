- "# 编程：初学者计算机编程指南：学习 HTML5、JavaScript 和 CSS 基础 - 第2版（编码、C 编程、Java 编程、网页设计、JavaScript、Python、HTML\
  \ 和 CSS）\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 赠送\n\n你好，我是来自 Mjg Publishing 的 Marco；我想感谢你支持这本书。我真心希望你在开始/继续你的编程之旅时，能发现这些信息是有用的。我做这件事的很大一部分原因是能够提供价值并帮助我周围的人学习，你帮助我实现这一目标对我来说意义重大。\n\
