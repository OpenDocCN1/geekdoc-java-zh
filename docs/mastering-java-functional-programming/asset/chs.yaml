  \n### 同时执行多个 Future\n\n```java\nCompletableFuture<String> complettableFuture1 =\
  \ CompletableFuture.supplyAsync(() -> \"RAM\");\n\nCompletableFuture<String> complettableFuture2\
  \ = CompletableFuture.supplyAsync(() -> \"SYAM\");\n\nCompletableFuture<Void> finalResult=CompletableFuture.allOf(completableFuture1,completableFuture2);\n\
  System.out.println(finalResult.get()); //NULL 因为 finalResult 不是合并结果//我们需要手动获取如下如下\n\
  System.out.println(completableFuture1.get()); //RAM\n\nSystem.out.println(completableFuture2.get());\
  \ //SYAM\n```\n\n但如果你的需求是合并结果，那么 String result= Stream.of(completableFuture1,completableFuture2)\n\
  \        .map(CompletableFuture::join)\n        .collect(Collectors.joining(\" \"\
  ));\n\nSystem.out.println(result); //RAM SYAM\n\n## Java 中的 Lombok 库\n\n让我们看看在编写真实项目代码时可以使用的一些箱外功能。这些功能真的有助于你提升技能。\n\
  \n在工业级项目中非常推荐使用 Lombok。你可以用它来生成 getter、setter、构造函数等。\n\n### 一些常用的 Lombok 注解\n\n\
  - `@Setter`\n- `@Getter`\n- `@Data`\n- `@NoArgsConstructor`\n- `@AllArgsConstructor`\n\
  - `@ToString`\n- `@EqualsAndHashCode`\n- `@Slf4j`\n- `@Builder(toBuilder = true)`\n\
  \n将下面的 Maven 依赖添加到你的项目类路径(`pom.xml`)\n\n `@Getter`: 用于创建 getter 方法。可以在类级别使用，也可以在属性级别使用。\n\
  \n**不使用 Lombok:**\n```java\npublic class EmployeeRequest {\n    String empName;\n\
  \n    String empEmail;\n\n    Long empId;\n\n    public String getEmpName() {\n\
  \        return empName;\n    }\n}\n```\n\n**使用 Lombok:**\n```java\n@Getter\npublic\
  \ class EmployeeRequest {\n    String empName;\n\n    String empEmail;\n\n    Long\
  \ empId;\n}\n```\n\n\n\n\n\n```java\npublic String getEmpEmail() { return empEmail;\
  \ }\n\npublic Long getEmpId() { return empId; }\n```\n\nimport lombok.Getter;\n\n\
  @Getter\npublic class EmployeeRequest {\n    String empName;\n    String empEmail;\n\
  \    Long empId;\n}\n```\n\n### 在属性级别\n```java\npublic class EmployeeRequest {\n\
  \    @Getter\n    String empName;\n    @Getter\n    String empEmail;\n    @Getter\n\
  \    Long empId;\n}\n```\n\n`@Setter`: 它将为类属性创建一个 setter 方法。它可以作用于类级别，也可以适用于属性级别。\n\
  \n#### 无使用 Lombok:\n```java\npublic class EmployeeRequest {\n    String empName;\n\
  \    String empEmail;\n    Long empId;\n\n    public void setEmpName(String empName)\
  \ {\n        this.empName = empName;\n    }\n\n    public void setEmpEmail(String\
  \ empEmail) {\n        this.empEmail = empEmail;\n    }\n\n    public void setEmpId(Long\
  \ empId) {\n        this.empId = empId;\n    }\n}\n```\n\n#### 使用 Lombok:\n```java\n\
  import lombok.Getter;\n\n@Setter\npublic class EmployeeRequest {\n    String empName;\n\
  \    String empEmail;\n    Long empId;\n}\n```\n\n#### 同时使用 getter 和 Setter:\n```java\n\
  import lombok.Getter;\nimport lombok.Setter;\n\n@Getter\n@Setter\npublic class EmployeeRequest\
  \ {\n    String empName;\n    String empEmail;\n    Long empId;\n}\n```\n它将为所有类属性创建一个\
  \ `getter()` 和 `setter(..)` 方法。如果你想自定义行为，例如只为特定属性创建 getter/setter，那么请在字段级别上应用这些注解。\n\
  \n`@Data`: 该注解是 `@Getter` 和 `@Setter` 的组合，但它**仅**可以作用于类级别。\n\n```java\nimport lombok.Data;\n\
  \n@Data\npublic class EmployeeRequest {\n    String empName;\n    String empEmail;\n\
  \    Long empId;\n}\n```\n\n`@NoArgsConstructor`: 它将为给定的类创建一个无参构造函数。\n\n```java\n\
  import lombok.Data;\nimport lombok.NoArgsConstructor;\n\n@NoArgsConstructor\npublic\
  \ class EmployeeRequest {\n    String empName;\n    String empEmail;\n    Long empId;\n\
  }\n```\n上述代码与下面的类似：\n```java\npublic class EmployeeRequest {\n    String empName;\n\
  \    String empEmail;\n    Long empId;\n\n    public EmployeeRequest() { }\n}\n\
  ```\n\n`@AllArgsConstructor`: 它将为给定的类创建一个全参数构造函数。\n\n```java\n@Data\n@AllArgsConstructor\n\
  public class EmployeeRequest {\n    String empName;\n    String empEmail;\n    Long\
  \ empId;\n}\n```\n如果你既需要无参构造函数又需要全参数构造函数，请在需要的类上同时使用这两个注解。\n\n```java\n@Data\n@NoArgsConstructor\n\
  @AllArgsConstructor\npublic class EmployeeRequest {\n    String empName;\n    String\
  \ empEmail;\n    Long empId;\n}\n```\n\n`@EqualsAndHashCode`: 它将为给定的类生成 `equals()`\
  \ 和 `hashCode(..)` 方法。\n\n#### 使用 Lombok:\n```java\n@Data\n@EqualsAndHashCode\n\
  public class EmployeeRequest {\n    String empName;\n    String empEmail;\n    Long\
  \ empId;\n}\n```\n\n#### 无使用 Lombok:\n```java\npublic class EmployeeRequest {\n\
  \    String empName;\n    String empEmail;\n    Long empId;\n\n    @Override\n \
  \   public boolean equals(Object o) {\n        if (this == o) return true;\n   \
  \     if (o == null || getClass() != o.getClass()) return false;\n        EmployeeRequest\
  \ that = (EmployeeRequest) o;\n        return empName.equals(that.empName) && empEmail.equals(that.empEmail)\
  \ && empId.equals(that.empId);\n    }\n\n    @Override\n    public int hashCode()\
  \ {\n        return Objects.hash(empName, empEmail, empId);\n    }\n}\n```\n\n`@ToString`:\
  \ 这将为给定的类创建一个 `toString()` 方法。\n\n#### 无使用 Lombok:\n```java\npublic class EmployeeRequest\
  \ {\n    String empName;\n    String empEmail;\n    Long empId;\n\n    @Override\n\
  \    public String toString() {\n        return \"EmployeeRequest{\" +\n       \
  \        \"empName='\" + empName + '\\'' + \", empEmail='\" + empEmail + '\\'' +\
  \ \", empId=\" + empId +\n               '}';\n    }\n}\n```\n\n#### 使用 Lombok:\n\
  ```java\n@ToString\npublic class EmployeeRequest {\n    String empName;\n    String\
  \ empEmail;\n    Long empId;\n}\n```\n\n`@Builder`: 它将为被注解的类创建一个可变实例。它可以作用于类级别，也可以适用于方法级别。该注解可以应用于：\n\
  I. 类级别\nIi. 方法级别\niii. 构造函数级别\n\n`@Builder` 注解使用构建器模式并帮助我们创建被注解类的不可变实例。如果我们在类级别应用它，默认它将考虑所有字段来创建对象。\n\
  \n#### I. 类级别\n```java\n@Builder (toBuilder = true)\npublic class EmployeeRequest\
  \ {\n    String empName;\n    String empEmail;\n    Long empId;\n}\n```\n创建该类的不可变实例：\n\
  ```java\npublic class LombokDemoClass {\n    public static void main(String[] args)\
  \ {\n        EmployeeRequest employee = EmployeeRequest.builder()\n            \
  \    .empName(\"John\")\n                .empEmail(\"john@example.com\")\n     \
  \           .empId(1L)\n                .build();\n    }\n}\n```\n\n#### 构造函数级别\n\
  ```java\n@Builder\npublic class EmployeeRequest {\n    String empName;\n    String\
  \ empEmail;\n    Long empId;\n\n    @Builder\n    public EmployeeRequest(String\
  \ empName, String empEmail, Long empId) {\n        this.empName = empName;\n   \
  \     this.empEmail = empEmail;\n        this.empId = empId;\n    }\n}\n```\n\n\
  #### 方法级别\n```java\n@Builder\npublic class EmployeeRequest {\n    String empName;\n\
  \    String empEmail;\n    Long empId;\n\n    @Builder\n    public static EmployeeRequest\
  \ create(String empName, String empEmail, Long empId) {\n        EmployeeRequest\
  \ request = new EmployeeRequest();\n        request.empName = empName;\n       \
  \ request.empEmail = empEmail;\n        request.empId = empId;\n        return request;\n\
  \    }\n}\n```\n\n---\n\n## Java 21 的新特性\n\n### 虚拟线程 (Virtual Thread)\n作为 Java 开发者，你必须知道什么是线程？\n\
  \n线程是一个轻量级的进程，或者说它是程序执行任务的最小单元。\n\n线程用于在后台执行复杂的任务，而不会中断主程序。\n\n假设我需要打印 1 次 \"Welcome\"\
  ，我只需要创建一个线程，线程就会按照要求打印 1 次 \"Welcome\"。\n\n在 Java 中，我们可以通过继承 Thread 类或实现 Runnable\
  \ 接口来创建线程。希望你已经知道这些。\n\n#### 通过继承 Thread 类创建线程：\n```java\npublic class MyThreadDemo\
  \ extends Thread{\n    public void run() {\n        System.out.println(\"Welcome\"\
  );\n    }\n\n    public static void main(String[] args) {\n        MyThreadDemo\
  \ th=new MyThreadDemo();\n        th.start();\n    }\n}\n```\n结果：此代码在线程中运行。\n\n\
  #### 使用 Runnable 创建线程：\n```java\npublic class ThreadWithRunnableDemo implements\
  \ Runnable {\n    @Override\n    public void run() {\n        System.out.println(\"\
  Welcome\");\n    }\n\n    public static void main(String[] args) {\n        // 创建\
  \ ThreadWithRunnableDemo 对象\n        ThreadWithRunnableDemo threadWithRunnableDemo=new\
  \ ThreadWithRunnableDemo();\n        // 创建线程\n        Thread th=new Thread(threadWithRunnableDemo);\n\
  \        // 启动线程\n        th.start();\n    }\n}\n```\n结果：Welcome\n\n我们可以使用 Lambda\
  \ 表达式简化创建线程的过程：\n```java\npublic class ThreadWithLambdaDemo {\n    public static\
  \ void main(String[] args) {\n        // 实现 Runnable 的 run 方法\n        Runnable\
  \ th=()->System.out.println(\"Welcome\");\n        // 启动线程\n        new Thread(th).start();\n\
  \n        // 或者\n        Thread thread=new Thread(()-> System.out.println(\"Welcome\"\
  ));\n        thread.start();\n    }\n}\n```\n\n\n\n\n结果：Welcome\n\n##更多关于虚拟线程\n\n\
  到目前为止，我们看到可以通过扩展 `Thread` 类或实现 `Runnable` 接口来创建 `Thread`，我们甚至可以使用 Lambda 表达式来简化代码。\n\
  \n但我们的意图不仅仅是创建一个 `Thread`，在 Java 中创建一个 `Thread` 会消耗系统的一些资源和内存。\n\n### 线程可以是以下类型之一：\n\
  \n* 操作系统线程 (OS Thread)\n* 平台线程 (Platform Thread)\n* 虚拟线程 (Virtual Threads)\n\n`java.lang.Thread`、使用\
  \ `Thread` 类或 `Runnable` 接口创建的 `Thread`都是平台线程。\n\n这些平台线程通常 1:1 地映射到由操作系统调度的内核线程。\n\
  \n操作系统线程是非常“重的”。这使得它们适用于执行所有类型的任务。\n\n根据操作系统和配置，它们默认消耗 2 到 10 MB 不等。\n\n通常向服务器发送请求时，每个请求都会消耗一个\
  \ `Thread`，因此，如果你想在高负载并发应用程序中利用百万级的请求/线程，你最好有超过 2 TB 的空闲内存。\n\n如你所见，创建过多的平台 `Thread`\
  \ 并不是更好的选择，因为这将消耗大量的资源并减慢系统。由于操作系统线程是有限的，任何系统**不会**允许你创建超过该限制的平台线程，因为每个平台线程都映射到一个操作系统线程。\n\
  \n所以，创建超过限制数量的平台线程就像是在等待操作系统线程可用，以便平台线程可以映射到操作系统线程。\n\n在 Java 中，我们过去有一个 `Thread`\
  \ 池，我们可以根据需求从池中复用 `Threads`，但正如我们所知，这对可以创建平台线程的数量也有限制。\n\n如果你创建了超过允许限制的平台线程，会发生什么？简单来说，可以说这会导致性能问题、死锁、饥饿、内存问题，甚至导致系统崩溃。\n\
  \n假设一个平均延迟为 50ms 的应用程序通过并发处理 10 个请求实现了每秒 200 个请求的吞吐量。\n\n为了让该应用程序扩展到每秒 2000 个请求的吞吐量，它需要并发处理\
  \ 100 个请求。如果每个请求在请求持续期间都由一个线程处理，那么为了让应用程序能够运行，线程数量必须随着吞吐量的增长而增长。\n\n遗憾的是，可用线程的数量是有限的，因为\
  \ JDK 将线程实现为操作系统（OS）线程的封装。操作系统线程是昂贵的，因此我们不能拥有太多，这使得这种实现不适用于每个请求一个线程的风格。\n\n如果每个请求在其持续时间内消耗一个线程（以及一个操作系统线程），那么在其他资源（如\
  \ CPU 或网络连接）耗尽之前，线程数量通常就会成为限制因素。\n\nJDK 目前的线程实现将应用程序吞吐量限制在远低于硬件支持的水平。即使使用了线程池也是如此，因为池化有助于避免启动新线程的高成本，但并没有增加线程的总数。\n\
  \n## => 这就是虚拟线程用用场。\n\n=> 在这里我们将虚拟线程而不是平台线程。\n\n现在的问题是，虚拟线程和平台线程有什么区别。假设系统在给定吞吐量和时间内具有处理\
  \ 500 个线程的能力，如果你需要 700 个线程来处理传入的请求并期望相同的吞吐量怎么办？在这种情况下，操作系统通过将巨大的虚拟地址空间映射到有限的物理内存来提供内存充足的幻；而\
  \ Java 运行时可以通过将大量虚拟线程映射到少量操作系统线程来提供线程充足的幻。\n\n### 虚拟线程和平台线程都是 java.lang.Thread 的实例\n\
  \n虚拟线程并不直接绑定到特定的操作系统线程。\n\n平台线程以传统方式实现，作为操作系统线程的薄层封装。\n\n虚拟线程是廉价且轻量级的，因此 JVM 创建它，而不是从\
  \ `Thread pool` 中池化创建。\n\n虚拟线程是 JDK 提供的轻量级线程实现，而不是操作系统提供的。\n\n虚拟线程采用 M:N 调度，其中大量的\
  \ (M) 虚拟线程被调度在较少 (N) 的操作系统线程上运行。\n\n![](img/image_rsrc3XD.jpg)\n\n今天，JDK 中的每个 `java.lang.Thread`\
  \ 实例都是平台线程。平台线程在底层的操作系统线程上运行 Java 代码，并在代码的整个生命周期内占用该操作系统线程。平台线程的数量限于操作系统线程的数量。\n\
  \n虚拟线程也是 `java.lang.Thread` 的实例，它在底层的操作系统线程上运行 Java 代码，但不会在代码的整个生命周期内占用该操作系统线程。这意味着许多虚拟可以在同一个操作系统线程上运行它们的\
  \ Java 代码。\n\n当平台线程独占宝贵的操作系统线程时，虚拟线程并不会。\n\n由于虚拟线程是轻量级的，在相同的系统配置下，虚拟线程的数量可以远大于操作系统线程的数量。\n\
  \n我们可以在应用程序中不依赖平台线程数量的情况下创建大量的虚拟线程（百万级）。这些虚拟线程由 JVM 管理，本质上是轻量级的，并作为普通的 Java 对象存储在内存中。\n\
  \n关键点：\n\n1. 虚拟线程本质上始终是守护线程 (daemon threads)。\n2. 虚拟线程始终具有中等优先级，且无法更改。\n3. 虚拟线程是轻量级且短寿命的\n\
  4. 虚拟线程不是 `Thread groups` 的活动成员。\n5. 虚拟线程不支持 `stop()`、`suspend()` 或 `resume()` 方法。\n\
  6. 虚拟线程不直接连接操作系统线程。\n7. 一个平台线程可以映射到多个虚拟线程。\n8. 虚拟线程适用于大多数时间处于阻塞状态，例如等待 I/O 操作完成。\n\
  9. 虚拟线程不用于长时间的 CPU 操作。\n\n## 创建虚拟线程\n\n创建虚拟线程有多种方法，可以使用 `Thread` 类或 `Thread.Builder`。\n\
  \n// Runnable 引用\n`Runnable runnable = () -> System.out.println(\"Welcome\");` //\
  \ 启动虚拟线程来运行任务\n\n### `Thread thread = Thread.ofVirtual().start(runnable);`\n\n示例：\n\
  ```java\npublic class VirtualThreadDemo {\n    public static void main(String[]\
  \ args) throws Exception {\n        Thread thread = Thread.ofVirtual().start(()\
  \ -> System.out.println(\"Hello\"));\n        //等待虚拟线程完成\n        thread.join();\n\
  \    }\n}\n```\n\n结果：Hello 或者\n\n```java\nRunnable runnable = () -> {\n    try {\n\
  \        Thread.sleep(Duration.ofSeconds(1));\n    } catch(Exception e) {\n    \
  \    System.out.println(e);\n    }\n    System.out.println(\"Work Done -\" + atomicInteger.incrementAndGet());\n\
  };\n```\n\n我们可以使用 `Thread.Builder` 引用创建并启动多个线程。\n\n```java\nRunnable runnable =\
  \ () -> System.out.println(\"Inside Runnable\");\nThread.Builder builder = Thread.ofVirtual().name(\"\
  JVM-Thread\");\nThread thread1 = builder.start(runnable);\nThread thread2 = builder.start(runnable);\n\
  Thread thread3 = Thread.startVirtualThread(runnable);\n```\n\n结果：\nInside Runnable\
  \ Inside Runnable Inside Runnable\n\n同样地 `Thread.ofPlatform()` 也用于创建平台线程。\n\n```java\n\
  Runnable runnable = () -> System.out.println(\"Welcome\");\nThread.Builder builder\
  \ = Thread.ofPlatform().name(\"Platform-Thread-demo\");\nThread t1 = builder.start(runnable);\n\
  Thread t2 = builder.start(runnable);\n```\n\n结果：\nWelcome Welcome\n\n创建未启动的虚拟线程并显式启动它：\n\
  ```java\npublic class VirtualThreadsDemo {\n    public static void main(String[]\
  \ args) {\n        Runnable runnable = () -> System.out.println(\"Thread is running:Welcome\"\
  );\n    }\n}\n```\n\n\n\n\n```java\nThread vThread = Thread. ofVirtual().unstarted(runnable);\
  \ System.out.println(\"Is Virtual : \"+(vThread.isVirtual())); System.out.println(\"\
  Is Alive : \"+(vThread.isAlive())); System.out.println(\"Is Daemon : \"+(vThread.isDaemon()));\
  \ System.out.println(\"Is Interrupted : \"+(vThread.isInterrupted()));\n\nSystem.out.println(\"\
  ########### starting Virtual Thread explicitly\"); vThread.start();\n\nSystem. out.println(\"\
  Is Alive : \"+(vThread.isAlive())); System.out.println(\"Interrupt the Thread \"\
  ); //vThread.interrupt();\n```\n\n### Result :\nIs Virtual : true\nIs Alive : false\n\
  Is Daemon : true\nIs Interrupted : false\n\n########### starting Virtual Thread\
  \ explicitly\nIs Alive : true\n\nInterrupt the Thread\n\nThread is running:Welcome\n\
  \n### 比较虚拟线程与平台线程\n\n```java\nimport java.time.Duration;\n\nimport java.time.Instant;\n\
  \nimport java.util.concurrent.Executors;\nimport java.util.concurrent.atomic.AtomicInteger;\n\
  \npublic class VirtuaThANdPlatformThDemo { public static void main(String[] args)\
  \ { final AtomicInteger atomicInteger = new AtomicInteger(); Runnable runnable =\
  \ () -> { try {\n\nThread. sleep(Duration.ofSeconds(1));\n\n} catch(Exception e)\
  \ {\n\nSystem.out.println(e);\n\n}\n\nSystem.out.println(\"Welcome -\"+ atomicInteger.incrementAndGet());\
  \ };\n\nInstant start = Instant.now(); try (var executor = Executors.newFixedThreadPool(100))\
  \ {\n\nfor (int i = 0; i < 10_000; i++) {\n\nexecutor.submit(runnable);\n\n}\n\n\
  }\n\nInstant finish = Instant. now();\n\nlong timeElapsed = Duration.between(start,\
  \ finish).toMillis(); System.out.println(\"Total Elapsed Time : \" + timeElapsed);\n\
  \n}\n\n}\n```\n\n### Result:\nWelcome - 1\nWelcome - 2\nWelcome - 3\n.\n.\n.\nWelcome\
  \ - 9999\nWelcome - 9990\nTotal Elapsed Time : 100300 ms [//大约 100 秒]\n\n### 解析：\n\
  由于我们从这个 Runnable 创建了 10,000 个线程，并使用虚拟线程和平台线程执行它们，以比较两者的性能。我们将使用 `Duration.between()`\
  \ API 来测量执行所有任务的总时间。\n\n首先，我们使用了一个包含 100 个平台线程的池。通过这种方式，`Executor` 每次可以运行 100 个任务，其他任务需要等待。由于有\
  \ 10,000 个任务，完成执行的总时间大约为 100300 毫秒，即 100 秒。\n\n### 现在我们将创建虚拟线程，因此将 `Executors.newFixedThreadPool(100)`\
  \ 替换为 `Executors.newVirtualThreadPerTaskExecutor()`。将在虚拟线程中执行所有任务，而不是平台线程。\n\n现在你将能够看到虚拟线程和平台线程之间的差异。\n\
  \n由于我们需要等待每次调用，对于此类用例，建议使用虚拟线程而不是平台线程。\n\n```java\nimport java.time.Duration;\n\n\
  import java.time.Instant;\n\nimport java.util.concurrent.Executors;\nimport java.util.concurrent.atomic.AtomicInteger;\n\
  \nVirtuaThANdPlatformThDemo2 {public class\n\npublic static void main(String[] args)\
  \ { final AtomicInteger atomicInteger = new AtomicInteger(); Runnable runnable =\
  \ () -> { try {\n\nThread. sleep(Duration.ofSeconds(1));\n\n} catch(Exception e)\
  \ {\n\nSystem.out.println(e);\n\n}\n\nSystem.out.println(\"Welcome - \" +atomicInteger.incrementAndGet());\
  \ };\n\nInstant start = Instant.now(); try (var executor=Executors.newVirtualThreadPerTaskExecutor())\
  \ { for(int i = 0; i < 10_000; i++) {\n\nexecutor.submit(runnable);\n\n}\n\n}\n\n\
  Instant finish = Instant. now();\n\nlong timeElapsed = Duration.between(start, finish).toMillis();\
  \ System.out.println(\"Total elapsed time : \" + timeElapsed);\n\n}\n\n}\n```\n\n\
  ### Result:\nWelcome - 1\nWelcome - 2\nWelcome - 3\n.\n.\n.\nWelcome - 9999\nWelcome\
  \ - 10000\nTotal elapsed time : 1313 ms [//大约 1.5 秒]\n\n正如你在上面的代码所示，这仅仅是创建虚拟线程或平台线程的区别。\n\
  \n`var executor = Executors.newFixedThreadPool(100);`\n`var executor = Executors.newVirtualThreadPerTaskExecutor();`\n\
  \n### 解析：\n正如你所看到的，执行 10,000 次所需的总时间，平台线程需要 100 秒，而虚拟线程仅需 1.5 秒。在相同吞吐量下，速度快了大约 70\
  \ 倍。\n\n注意 - 如上例例所示，虚拟线程执行任务比平台线程快了 70 倍，但并不意味着虚拟线程比平台线程**更快**。\n\n虚拟线程只是在相同系统配置上同时获得更高吞吐量的方法。让我们将线程数从\
  \ 10,000 增加到 700,000，看看在相同系统上需要花费多少时间。\n\n正如下面的示例所示，700,000 个虚拟线程仅耗用了 10 秒来执行任务。\n\
  \n```java\nimport java.time.Duration;\n\nimport java.time.Instant;\n\nimport java.util.concurrent.Executors;\n\
  import java.util.concurrent.atomic.AtomicInteger;\n\nVirtuaThANdPlatformThDemo2\
  \ {public class\n\npublic static void main(String[] args) { final AtomicInteger\
  \ atomicInteger = new AtomicInteger(); Runnable runnable = () -> { try {\n\nThread.\
  \ sleep(Duration.ofSeconds(1));\n\n} catch(Exception e) {\n\nSystem.out.println(e);\n\
  \n}\n\nSystem.out.println(\"Welcome - \" +atomicInteger.incrementAndGet()); };\n\
  \nInstant start = Instant.now(); try (var executor = Executors.newVirtualThreadPerTaskExecutor())\
  \ { for(int i = 0; i < 700_000; i++) {\n\nexecutor.submit(runnable);\n\n}\n\n}\n\
  \nInstant finish = Instant. now();\n\nlong timeElapsed = Duration.between(start,\
  \ finish).toMillis(); System.out.println(\"Total elapsed time : \" + timeElapsed);\n\
  \n}\n\n}\n```\n\nWork Done - 1\nWork Done - 2\nWork Done - 3\n.\n.\n.\nWork Done\
  \ - 699999\nWork Done - 699998\nTotal elapsed time : 10 [25 秒]\n\n### 等待虚拟线程\n虚拟线程始终作为守护线程运行。当虚拟线程执行任务时，主线程不会被阻塞。\n\
  \n### 我们可以调用 `join()` 方法等待虚拟线程终止。\n`join()` 有多个重载方法。你可以根据喜好使用。\n`join()` // 无期等待\n\
  `join(duration)` // 以时间限制的方式等待\n`join(millis)`\n\n```java\nimport java.time.Duration;\n\
  public class VirtualThJoinDemo { public static void main(String[] args) {\n\nRunnable\
  \ runnable = () -> {\n\nSystem.out.println(\"Thread is running:Welcome\");\n\ntry\
  \ {\n\nThread.sleep(Duration.ofSeconds(10));\n\nSystem.out.println(\"## done\");\n\
  \n} catch (InterruptedException e) {\n\nthrow new RuntimeException(e);\n\n}\n\n\
  };\n\nThread thread=Thread.ofVirtual().name(\"vDemo\").start(runnable);\n\nSystem.out.println(thread.isAlive());\n\
  \ntry {\n\nthread.join();\n\n} catch (InterruptedException e) {\n\nthrow new RuntimeException(e);\n\
  }\n\nSystem.out.println(thread.isAlive());\n\nSystem.out.println(thread.isInterrupted());\n\
  \n}\n```\n\n### Result:\ntrue\nThread is running:Welcome ## done\nfalse\nfalse\n\
  \n### 深度解析：\n开发者可以选择使用虚拟线程或平台线程。这里有一个创建大量虚拟线程的示例程序。程序首先获取 `ExecutorService`，它为每个提交的任务创建一个新的虚拟线程。\n\
  \n```java\ntry (var executor = Executors.newVirtualThreadPerTaskExecutor()) {\n\n\
  IntStream.range(0, 10_000).forEach(i -> {\n\nexecutor.submit(() -> {\n\nThread.sleep(Duration.ofSeconds(1));\n\
  \nreturn i;\n\n});\n\n}\n```\n\n我们正在使用从池中获取平台线程的 `ExecutorService`，例如 `Executors.newFixedThreadPool(200)`。`ExecutorService`\
  \ 将创建 200 个平台线程以供所有 10,000 个任务共享，因此许多任务将顺序执行而不是并发执行，程序将需要很长时间才能完成。\n\n\n\n\n\n对于此程序，一个包含\
  \ 200 个平台线程的池只能实现每秒 200 个任务的吞吐量，而虚拟线程可以实现每秒约 10,000 个任务的吞吐量（在经过充分预热后）。\n\n由于我们已将\
  \ `Thread` 数量改为 700,000，程序将提交 700,000 个任务且所有任务将并发运行。在使用虚拟线程之前，我们应该知道在何时使用虚拟线程。\n\
  \n假设你的任务是对一个数组进行排序，且耗时 1 秒，那么使用平台线程还是虚拟线程都无所谓。虚拟线程主要适用于涉及等待/睡眠类任务的场景。\n\n虚拟线程并不是更快的线程——它们运行代码的速度并不比平台线程快。它们的存在是为了提供扩展性（更高的吞吐量），而不是速度（更低的延迟）。虚拟线程在以下情况下主要有用：\n\
  \n- 并发任务数量很大。\n- 工作负载不是 CPU  密集型的，因为在这种情况下，线程数量远多于处理器核心无法提高吞吐量。\n\n## 结合 Web 应用程序/微服务使用虚拟线程\n\
  \n正如我们所过的，虚拟线程是如何工作的？假设我们有一个 Web 应用程序，每秒接收数百万次请求，以从远程服务获取某些数据。如果我们倾向于采用每个请求一个线程的模型，那么我们需要大约\
  \ 100 万个线程来处理所有请求，在任何应用程序中创建 100 万个 `Threads` 都是昂贵的过程，因此在这种情况下建议创建虚拟线程来处理请求，许多 Web\
  \ 框架甚至已经支持了它。\n\n我们的代码看起来像下面。\n\n![](img/image_rsrc3XF.jpg)\n\nJava 结构化并发提供了多种选项来处理此类用例。\n\
  \n## 如何观察虚拟线程\n\n仅仅为多线程环境编写整洁的可执行代码是不够的，我们还应该考虑故障排除、维护和优化。\n\nJava 确实提供了各种工具和机制来跟踪线程，需要\
  \ Java 调试器来获取 `Thread` 调用堆栈并检查栈帧中的变量。\n\nJDK Flight Recorder (`JFR`) 是 JDK 的低开销分析和监控机制，它可以将应用程序代码中的事件与正确的虚拟线程关联。这些工具无法用于以异步风格编写的应用程序。在那种风格中，任务与线程没有关联，因此调试器无法显示或操纵任务状态，分析器也无法告知任务在等待\
  \ I/O 上花费了多少时间。\n\n传统的 Java `Thread` dump 是 `Thread-per-request` 情况下故障排除的另一种选择，但在虚拟线程情况下是不够，因为我们可以有数百万个线程并发运行。\n\
  \n## Java 引入了一种全新的线程 dump\n\n使用 `jcmd` 可以将虚拟线程与平台线程一起展示，并以有意义的方式进行分组。\n\n可以使用以下命令获取线程\
  \ dump 的 JSON 格式：\n```bash\n$ jcmd <pid> Thread.dump_to_file -format=json <file>\n\
  ```\n\n## 虚拟线程内部是如何运作的\n\n任何线程一旦被调度到处理器核心上执行，它就会执行某些任务。对于作为 `OS Thread` 封装的平台线程，JDK\
  \ 依赖于操作系统中用于调度 `Thread` 的调度。\n\n对于虚拟线程，JDK 有它自己的调度器。JDK 调度器不是直接将虚拟线程分配给处理器，而是按照\
  \ M:N 的比例将虚拟线程分配给平台线程，其中多个虚拟线程可以分配给单个 `Platform Thread`。\n\nJDK 的虚拟线程调度器是一个以 FIFO\
  \ 模式运行的窃取工作 `ForkJoinPool`。调度器的并行性是用于调度虚拟线程的可用平台线程的数量。默认情况下它等于可用处理器的数量，可以通过系统属性进行调整：\n\
  \n`jdk.virtualThreadScheduler.parallelism.`\n\n为了在虚拟线程中运行代码，JDK 的虚拟线程调度器通过将虚拟线程挂载（mount）到平台线程上来来实现执行。这使得平台线程成为虚拟线程的载体（carrier）。随后，在运行某些代码后，虚拟线程可以从其载体上卸载（unmount）。此时平台线程空闲了，调度器可以在上面挂载另一个虚拟线程，从而再次使其载体。\n\
  \n![](img/image_rsrc3XG.jpg) 如你在这里可以看到，JVM 调度器调度带有虚拟线程的平台线程，而 调度器负责通过平台线程调度 OS Thread。\n\
  \n## 有序集合 (Sequenced Collections)\n\n在继续学习有序集合之前，让我们根据 `java 21 API docs` 理解集合及其类/接口的层次结构。\n\
  \n### 集合层次结构中的根接口是 Collection 接口。\n\n集合代表一组对象。某些集合允许重复元素，另一些不允许。有些是有序的，另一些是无序的。\n\
  \n作为 `java 21` 的一部分，新接口允许现有集合类具有定义的遇到顺序（encounter order）。\n\n顺序将具有定义的第一个元素、第二个元素，依此类推，直到最后一个元素。这些新接口是：\n\
  \n- `SequencedCollection`\n- `SequencedSet`\n- `SequencedMap`\n\n具有定义遇到顺序的集合通常是\
  \ `SequencedCollection` 接口的子类型。\n\n### 为什么我们需要 SequencedCollection？\n\n在 Java 21\
  \ 之前，Java 集合类没有方便的方法获取第一个、最后一个元素，或者在第一个和最后一个位置添加元素，也无法使用预定义方法获取集合的反转顺序。\n\n作为开发者，我们以前通常根据需求手动完成所有这些工作，但现在作为\
  \ Java 21 的一部分，这个问题已经解决了。\n\nSequenced Collection 是一个具有定义的遇到顺序、支持两端操作且可反转的集合。\n\n\
  `SequencedCollection` 是 Java 21 引入的 `Interface`，类似于 `SequencedMap` 和 `SequencedSet`。\n\
  \n接口声明：![](img/image_rsrc3XH.jpg)\n\nSequenced 集合的方法：![](img/image_rsrcJ.jpg)\n\n\
  ### 集合层次结构：![](img/image_rsrcXK.jpg)\n\n### 代码演练\n\n使用预定义方法获取列表的第一个和最后一个元素\n\n```java\n\
  import java.util.ArrayList;\npublic class Java21SequencedCollectionDemo {\n    public\
  \ static void main(String[] args) {\n        ArrayList<Integer> nums= new ArrayList<>();\n\
  \        nums.add(22);\n        nums.add(11);\n        nums.add(32);\n        nums.add(12);\n\
  \        nums.add(16);\n        System.out.println(\"Nums : \"+nums);\n        Integer\
  \ firstNum=nums.getFirst();\n        Integer lastNum=nums.getLast();\n        System.out.println(\"\
  firstNum : \"+firstNum);\n        System.out.println(\"lastNum : \"+lastNum);\n\
  \    }\n}\n```\n结果：\nNums: [22, 11, 32, 12, 16]\nfirstNum: 22\nlastNum: 16\n\n向集合的开头和结尾添加元素\n\
  \n```java\nimport java.util.ArrayList;\npublic class Java21SequencedCollectionDemo\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Integer> nums=new\
  \ ArrayList<>();\n        nums.add(22);\n        nums.add(11);\n        nums.add(32);\n\
  \        nums.add(12);\n        nums.add(16);\n        System.out.println(\"Nums\
  \ : \"+nums);\n        nums.addFirst(55);\n        nums.addLast(44);\n        System.out.println(\"\
  nums : \"+nums);\n    }\n}\n```\n结果：\nNums: [22, 11, 32, 12, 16]\nnums: [55, 22,\
  \ 11, 32, 12, 16, 44]\n\n你可以简单使用预定义方法 `reversed()` 获取反转列表\n\n```java\nimport java.util.ArrayList;\n\
  public class Java21SequencedCollectionDemo {\n    public static void main(String[]\
  \ args) {\n        ArrayList<Integer> nums= new ArrayList<>();\n        nums.add(22);\n\
  \        nums.add(11);\n        nums.add(32);\n        nums.add(12);\n        nums.add(16);\n\
  \        System.out.println(\"Nums : \"+nums);\n        System.out.println(\"Reversed\
  \ Order : \"+nums.reversed());\n    }\n}\n```\n\n使用 `ListIterator` 以反顺序迭代列表\n\n\
  ```java\nArrayList<Integer> num= new ArrayList<>(); \nnum.add(22);\nnum.add(11);\n\
  num.add(32);\nnum.add(12);\nnum.add(16);\nSystem.out.println(\"Nums : \"+num);\n\
  \nListIterator<Integer> reverseIterator = num.listIterator(num.size());\n```\n\n\
  \n\n\n\n```java\nSystem.out.println(\"Reverse Order :\"); while (reverseIterator.hasPrevious())\
  \ {\n    System.out.println(reverseIterator.previous());\n}\n```\nResult:\nNums\
  \ : [22, 11, 32, 12, 16] Reverse Order:\n16\n12\n32\n11\n22\n\n## 从第一个位置和最后一个位置删除元素。\n\
  \n```java\nArrayList<Integer> numbers= new ArrayList<>();\nnumbers.add(22);\nnumbers.add(11);\n\
  numbers.add(32);\nnumbers.add(12);\nnumbers.add(16);\nSystem.out.println(\"numbers\
  \ : \"+numbers);\nnumbers.removeFirst();\nSystem.out.println(\"Remove 1st Element\
  \ ,Numbers : \"+numbers);\nnumbers.removeLast();\nSystem.out.println(\"Remove Last\
  \ Element ,Numbers : \"+numbers);\n```\nResult :\nnumbers : [22, 11, 32, 12, 16]\n\
  Remove 1st Element ,Numbers : [11, 32, 12, 16]\nRemove Last Element ,Numbers : [11,\
  \ 32, 12]\n\n### SequencedSet Demo\n\n让我们来看看 `SequencedSet` 的层级结构\n\n![](img/image_rsrc3XM.jpg)\n\
  如我们所，`LinkedHashSet` 是 `SequencedSet` 的实现类之一，`SequencedSet` 包含了 `Set<I>` 和 `SequencedCollection`\
  \ 的属性。\n\n```java\nimport java.util.*;\npublic class SequencedSetDemo {\n    public\
  \ static void main(String[] args) {\n        LinkedHashSet<Integer> data= new LinkedHashSet<>();\n\
  \        data.add(11);\n        data.add(33);\n        data.add(22);\n        data.add(55);\n\
  \        data.add(44);\n        System. out.println(\"Actual Data :: \"+data);\n\
  \        System.out.println(\"Adding one Element to 1st position\");\n        data.addFirst(10);\n\
  \        System. out.println(\"Data after Adding one Entry at 1st position:: \"\
  +data);\n        System.out.println(\"Adding one Element to Last position\");\n\
  \        System.out.println(\"Data after Adding one Entry at Last position:: \"\
  +data);\n        data.addLast(12);\n        System.out.println(\"Final Data \"+data);\n\
  \        System.out.println(\"Reversed final data : \"+data.reversed());\n    }\n\
  }\n```\nResult :\nActual Data :: [11, 33, 22, 55, 44]\nAdding one Element to 1st\
  \ position\nData after Adding one Entry at 1st position:: [10, 11, 33, 22, 55, 44]\n\
  Adding one Element to Last position\nData after Adding one Entry at Last position::\
  \ [10, 11, 33, 22, 55, 44]\nFinal Data [10, 11, 33, 22, 55, 44, 12]\nReversed final\
  \ data : [12, 44, 55, 22, 33, 11, 10]\n\n### SequencedMap\n\n与 `SequencedSet` 类似，`SequencedMap`\
  \ 包含了 `SequencedCollection` 和 `Map` 的特性。\n\n![](img/image_rsrc3XN.jpg)\n\n- `SequencedMap`\
  \ 提供了在 map 两端添加、检索和删除元素的方法。\n- 该接口还定义了 `reversed()` 方法，该方法提供了此 map 的逆序视图。\n- `SequencedMap`\
  \ 具有定义良好的遭遇顺序（encounter order），支持两端的操作并且是可反转的。\n- 即使原始 map 是可序列化的，map 的逆序视图通常也不是可序列化的。\n\
  - `SequencedMap` 的遭遇顺序与 `SequencedCollection` 元素的顺序相似，但该排序适用于映射而非单个元素。\n\n根据 Java\
  \ 21 的接口声明\n\n![](img/image_rsrc3XP.jpg)\n方法详情：\n\n![](img/image_rsrc3XR.jpg)\n\
