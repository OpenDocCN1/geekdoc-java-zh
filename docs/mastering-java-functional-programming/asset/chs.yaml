  \n## 并发集合\n\nJava 中的并发集合是 `java.util.concurrent` 包的一部分，它们为传统的集合类（如 `ArrayList`、`HashMap`\
  \ 和 `LinkedList`）提供了线程安全的替代方案。这些集合设计用于多线程环境，通过减少对显式同步的需求确保数据一致性并提高性能。\n\n### 主要并发集合\n\
  \n1. `ConcurrentHashMap`\n2. `CopyOnWriteArrayList`\n3. `CopyOnWriteArraySet`\n\
  4. `BlockingQueue`（及其实现类 `LinkedBlockingQueue`、`ArrayBlockingQueue`）\n5. `ConcurrentLinkedQueue`\n\
  6. `ConcurrentSkipListMap`\n7. `ConcurrentSkipListSet`\n\n这些特殊集合专为同步多线程访问设计，确保数据完整性和线程安全。\n\
  \n### ConcurrentHashMap\n\n○ `ConcurrentHashMap` 是 `Map` 接口的线程安全实现。\n○ 它允许多个线程进行读写操作而不会互相阻塞。\n\
  \n示例：\n```java\nimport java.util.concurrent.ConcurrentHashMap;\n\npublic class ConcurrentMapExample\
  \ {\n    public static void main(String[] args) {\n        ConcurrentHashMap<String,\
  \ Integer> concurrentMap = new ConcurrentHashMap<>();\n        concurrentMap.put(\"\
  one\", 1);\n        concurrentMap.put(\"two\", 2);\n        concurrentMap.put(\"\
  three\", 3);\n        int value = concurrentMap.get(\"two\");\n        System.out.println(\"\
  Value for key 'two': \" + value);\n    }\n}\n```\n\n### CopyOnWriteArrayList\n\n\
  ➔ `CopyOnWriteArrayList` 是一个线程安全的列表，其修改操作会创建底层数组的新副本。\n➔ 在其他线程进行操作期间，原始列表保持不变。\n\
  \n```java\nimport java.util.List;\nimport java.util.concurrent.CopyOnWriteArrayList;\n\
  \npublic class CopyOnWriteArrayListExample {\n    public static void main(String[]\
  \ args) {\n        List<Integer> list = new CopyOnWriteArrayList<>();\n        list.add(1);\n\
  \        list.add(2);\n        list.add(3);\n        for (Integer num : list) {\n\
  \            System.out.println(num);\n        }\n    }\n}\n```\n\n### CopyOnWriteArraySet\n\
  \n一种基于 `CopyOnWriteArrayList` 的 `HashSet` 线程安全变体。\n\n```java\nimport java.util.concurrent.CopyOnWriteArraySet;\n\
  \npublic class CopyOnWriteArraySetExample {\n    public static void main(String[]\
  \ args) {\n        CopyOnWriteArraySet<String> set = new CopyOnWriteArraySet<>();\n\
  \        // 添加元素\n        set.add(\"A\");\n        set.add(\"B\");\n        set.add(\"\
  C\");\n        // 遍历集合\n        for (String item : set) { \n            System.out.println(item);\
  \ \n        }\n        // 移除元素\n        set.remove(\"B\");\n        // 再次遍历\n  \
  \      for (String item : set) {\n            System.out.println(item); \n     \
  \   }\n    }\n}\n```\n\n### BlockingQueue\n\n➔ `BlockingQueue` 是一种并发队列，支持添加和移除元素的阻塞操作。\n\
  ➔ 常用于生产者-消费者场景。\n\n使用 `LinkedBlockingQueue` 的示例：\n```java\nimport java.util.concurrent.LinkedBlockingQueue;\n\
  \npublic class BlockingQueueExample {\n    public static void main(String[] args)\
  \ {\n        LinkedBlockingQueue<Integer> queue = new LinkedBlockingQueue<>();\n\
  \        new Thread(() -> {\n            try {\n                queue.put(1);\n\
  \                queue.put(2);\n                queue.put(3);\n            } catch\
  \ (InterruptedException e) {\n                Thread.currentThread().interrupt();\n\
  \            }\n        }).start();\n        try {\n            System.out.println(\"\
  Removed from queue: \" + queue.take());\n            System.out.println(\"Removed\
  \ from queue: \" + queue.take());\n            System.out.println(\"Removed from\
  \ queue: \" + queue.take());\n        } catch (InterruptedException e) {\n     \
  \       Thread.currentThread().interrupt();\n        }\n    }\n}\n```\n\n# 函数式编程\n\
  \nJava 中的函数式编程是一种使用函数编写代码的方法，使其更加简单且可预测。关键点包括：\n\n1. 函数是一等公民：函数被像变量一样对待。你可以在代码中传递它们。\n\
  2. 纯函数：在给定相同输入时总是产生相同的结果，并且不会改变函数外部的任何数据。\n3. 不变性：数据一旦创建，就无法更改。\n\n### 函数式编程的使用\n\
  \n1. 更容易理解：函数不会改变其外部的数据，使得你的代码更容易遵循。\n2. 更少的 Bug：可预测的函数意味着更错误。\n3. 可复用性：小的、可重用的函数可以组合起来解决复杂问题。\n\
  \n### 函数式编程如何帮助我们\n\n1. 简化代码：编写更小更简单的函数让你的代码更容易阅读和维护。\n2. 减少 Bug：纯函数和不变性有助于防止意外的变化。\n\
  3. 支持并行编程：更容易编写在多个处理器上运行的代码。\n\n\n\n\n\n## 核心特性\n- **简单的数据操作**：强大的数据处理方法。\n- **并行处理**：简单的多核处理。\n\
  - **惰性求值**：避免不必要的计算。\n- **不可变性**：不修改原始数据。\n- **易用性**：如 `filter`、`map`、`reduce` 等直观的方法。\n\
  - **提高可读性**：更容易理解和维护。\n- **与 Java Collections 集成**：与 `Collections` 进行无缝转换。\n\n##\
  \ Stream 简介\n`Stream` 是一个可以流水线处理的元素序列。\n- 它支持顺序操作和并行操作。\n- 它在 Java 8 中引入，作为 `java.util.stream`\
  \ 包下 Java Streams API 的一部分。\n- `Streams` 用于以函数和声明式的方式处理数据序列，例如集合（如 `lists`、`sets`、`maps`）或其他数据源。\n\
  \n注意，`java.util.stream` 与 `java.io.stream` 没有任何关系，`java.io.stream` 专门用于 I/O 操作，而\
  \ `java.util.stream` 则与通过顺序或并行流水线处理数据有关。\n\n## Java Streams 的特点和功能\n1. **函数式编程**：`Streams`\
  \ 从 Java 8 开始促进 Java 中的函数式编程方法。`Stream` 提供了一种非常简单的方法来处理数据、转换数据、过滤数据并收集到所需的集合对象中。你可以使用一系列高级操作来处理数据，例如\
  \ `map`、`filter`、`reduce` 和 `collect`，而不是显式地编写循环。我们将在后的章节中详细介绍。\n2. **惰性**：`Streams`\
  \ 天生是惰性的，这意味着它们只在需要时处理元素。在调用终端操作之前，对 `Stream` 上的操作不会执行。这可以提高性能并减少内存消耗。我们将详细介绍中间操作和终端操作。\n\
  3. **链式调用**：链式多个操作对给定的数据集进行数据转换是 `Stream` 中的常见操作。你可以将多个操作链在一起，创建一个数据处理的流水线。这允许你以简洁且可读的方式表达复杂的数据转换。\n\
  4. **并行性**：Java Streams 可以很容易地并行化，这意味着你可以利用多个 CPU 核心来并发处理数据。并行流是使用类似 `parallelStream()`\
  \ 方法创建的。创建一个并行 Stream 会消耗可用的 CPU，但我们也可以覆盖此行为。它使用工作窃取算法，当当前任务完成后，作业会自动选取可用的待处理任务，它还将使用\
  \ `combiner` 保持合并结果。\n5. **不可变性**：`Streams` 天生是不可变的，因此它们不会修改底层数据源。相反，它们会创建一个带有转换后数据的新\
  \ `Stream`，保持原始数据不变。\n\n## Stream 是如何工作的？\n![](img/image_rsrc3W6.jpg)![](img/image_rsrc3W7.jpg)\n\
  \n我们将在本节后面的部分将所有的流操作链在一起。上面的代码仅用于解释。\n\n在本节的稍后部分，我们将深入探讨 Stream 中间操作和终端操作。现在，你只需要认为我们有一个\
  \ `List`，从该列表创建 Stream，执行 `filter` 操作，并在过滤完成后将数据收集到 `List` 中。最终结果将根据所应用的条件给你提供过滤后的数据。\n\
  \n## 在何处使用 Streams\n在处理数据集合并对这些集合执行操作时，Java 中的 `Streams` 特别有用。以下是使用流可能获益的一些常见场景。作为开发者，在你在使用并行流时需要非常小心。\n\
