  \ Employee{name='Mohit', email='Mohit@gmail.com', id=10} Employee{name='Raj', email='Ra@gmail.com',\
  \ id=11}`\n\n让我们对 `Employee` 集合进行倒序排序。\n\n```java\nimport java.util.ArrayList; import\
  \ java.util.Collections; import java.util.List;\n\npublic class SortingEmployeeData\
  \ {\n    public static void main(String[] args) {\n        Employee e1=new Employee(\"\
  Raj\",\"Ra@gmail.com\",11l); \n        Employee e2=new Employee(\"Mohit\",\"Mohit@gmail.com\"\
