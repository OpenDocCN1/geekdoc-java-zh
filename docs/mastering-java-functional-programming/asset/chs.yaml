  \n### StructuredTaskScope\n\n结构化并发 API 的核心类是 `java.util.concurrent` 包中的 `StructuredTaskScope`。该类允许开发者将任务结构化为一组并发子任务，并将它们作为一个单元进行协调。\n\
  \n`StructuredTaskScope` 支持一个任务拆分为多个并发子任务的情况，以及子任务必须在主任务继续执行之前完成的情况。可以使用 `StructuredTaskScope`\
  \ 来确保并发操作的生命周期被限制在一个语法块内。\n\n子任务通过单独分叉（fork）在自己的线程中执行，然后作为一个单元进行合并（join），并作为一个单元进行取消（cancel）。\n\
  \n子任务成功的结果或异常将由父任务聚合并处理。\n\n`StructuredTaskScope` 将子任务的生命周期限制在一个清晰的词法范围内，在该范围内，任务与其子任务的所有交互——分叉、合并、取消、错误处理和结果组合——都会发生。\n\
  \n以下是之前的 `handle()` 示例，使用 `StructuredTaskScope` 编写（`ShutdownOnFailure` 在下文中解释）：\n\
  \n![](img/image_rsrc3XS.jpg) 在用结构化并发时，我们可以获得以下关键优势。\n\n- 短路错误处理 —— 如果 `findUser()`\
  \ 或 `fetchOrder()` 子任务任一失败，如果另一个尚未完成，则将其取消。（这是通过 `ShutdownOnFailure` 实现的关闭策略管理的；也可以有其他策略）。\n\
  - 取消传播 —— 如果运行 `handle()` 的线程在调用 `join()` 之前或期间被中断，则当线程退出范围时，两个子任务都将自动取消。\n- 清晰\
  \ —— 上述代码具有清晰的结构：设置子任务，等待它们完成或被取消，然后决定成功（处理已完成的子任务的结果）或失败（子任务已经完成，因此没有更多需要清理的）。\n\
  - 可观测性 —— 下文所述的线程转储清晰地显示了任务层次结构，其中运行 `findUser()` 和 `fetchOrder()` 的线程显示为作用域的子线程。\n\
  \n示例：\n\n```java\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.StructuredTaskScope;\n\
  public class StructuredConcurrencyDemo {\n    public static void main(String[] args)\
  \ throws Exception {\n        Callable<String> task1 = ()-> \"Welcome\";\n     \
  \   Callable<Integer> task2 = ()-> 12;\n        try (var scope = new StructuredTaskScope<Object>())\
  \ {\n            StructuredTaskScope.Subtask<String> subtask1 = scope.fork(task1);\n\
  \            StructuredTaskScope.Subtask<Integer> subtask2 = scope.fork(task2);\n\
  \            scope.join();\n            //process results/exceptions\n        }\n\
  \    }\n}\n```\n\n正如你所看到的，`StructuredTaskScope` 是通过其公共构造函数之一创建的，如下所示。\n\n![](img/image_rsrc3XT.jpg)它定义了\
  \ `fork(..)` 方法来启动线程以执行子任务。\n\n它调用 `join()` 方法等待所有子任务完成。\n\n你可以调用 `close` 方法来关闭任务作用域，但该\
  \ API 设计用于与 `try-with-resources` 语句一起使用。\n\n意图是 `try` 块中的代码使用 `fork` 方法分叉线程来执行子任务，使用\
  \ `join` 方法等待子任务完成，然后处理结果。\n\n为了更好地理解，让我们看看下面的示例。\n\n这里我们有 4 个想要**并发运行**的任务，我们简单地创建了一个\
  \ `Callable` 列表，**然后**我们使用 `fork(..)` 分叉了它们，我们使用 `join()` 方法进行合并。\n\n```java\nimport\
  \ java.util.ArrayList;\nimport java.util.List;\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.StructuredTaskScope;\nimport java.util.concurrent.StructuredTaskScope.*;\n\
  public class StructuredConcurrencyDemo3 {\n    public static void main(String[]\
  \ args) throws Exception {\n        Callable<String> task1 = ()-> \"task1\";\n \
  \       Callable<String> task2 = ()-> \"task2\";\n        Callable<String> task3\
  \ = ()-> \"task3\";\n        Callable<String> task4 = ()-> \"task4\";\n        List<Callable>\
  \ tasks= new ArrayList<>();\n        tasks.add(task1);\n        tasks.add(task2);\n\
  \        tasks.add(task3);\n        tasks.add(task4);\n        try (var scope =\
  \ new StructuredTaskScope<String>()) {\n            List<Subtask> subtasks = tasks\n\
  \                .stream()\n                .map(x->scope.fork(x))\n           \
  \     .toList();\n            scope.join();\n            subtasks.forEach(x->System.out.println(x.get()+\
  \ \" :: \"+x.state()));\n        }\n    }\n}\n```\n结果：\ntask1 :: SUCCESS task2 ::\
  \ SUCCESS task3 :: SUCCESS task4 :: SUCCESS\n\n正如我们在这里看到的，我们使用 `StructuredTaskScope`\
  \ 的默认公共构造函数，它将在内部创建虚拟线程来完成这些任务。我们在这里只是等待所有任务完成，但是我们也可能有在任何任务失败时退出的选项。\n\n### StructuredTaskScope\
  \ 策略\n\n在上面的示例中，我们使用 `StructuredTaskScope.join()` 等待所有任务完成。但如果其中一个任务发生异常，我们就无法对另外两个任务的结果做什么——那么为什么要等它们呢？\n\
  \n这就是“策略”出现的地方，允许我们在作用域结束时指定行为。我们也可以创建自己的策略。\n\n`StructuredTaskScope` 定义了两个子类来实现常见情况的策略：\n\
  \n1. `ShutdownOnSuccess` 预览\n2. `ShutdownOnFailure` 预览\n\n#### ShutdownOnFailure\n\
  \n如果任何子任务由于任何原因失败，异常将会被捕获并关闭任务作用域以中断未完成的任务。正如你可以看到的下面的代码，我们调用 `join()` 方法**然后**调用\
  \ `throwIfFailed()`，如果任何子任务失败，就不需要其他子任务的结果。\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.StructuredTaskScope;\npublic class StructuredConcurrency1\
  \ {\n    public static void main(String[] args) throws Exception {\n        Callable<String>\
  \ task1 = ()-> \"Welcome\";\n        Callable<Integer> task2 = ()-> 12;\n      \
  \  try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {\n           \
  \ StructuredTaskScope.Subtask<String> subtask1 = scope.fork(task1);\n          \
  \  StructuredTaskScope.Subtask<Integer> subtask2 = scope.fork(task2);\n        \
  \    scope.join()\n            .throwIfFailed();\n            //process results/exceptions\n\
  \        }\n    }\n}\n```\n注意：这里两个任务都成功完成了，没有任何错误，所以不会进行中断。让我们看看 task2 失败的代码：\n\n\
  ```java\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.StructuredTaskScope;\n\
  public class StructuredConcurrency1 {\n    public static void main(String[] args)\
  \ throws Exception {\n        Callable<String> task1 = ()-> \"Welcome\";\n     \
  \   Callable<Integer> task2 = ()-> 12/0;\n        try (var scope = new StructuredTaskScope.ShutdownOnFailure())\
  \ {\n            StructuredTaskScope.Subtask<String> subtask1 = scope.fork(task1);\n\
  \            StructuredTaskScope.Subtask<Integer> subtask2 = scope.fork(task2);\n\
  \            scope.join()\n            .throwIfFailed();\n        }\n    }\n}\n\
  ```\n\n#### ShutdownOnSuccess\n\n`ShutdownOnSuccess` 捕获第一个成功完成子任务的结果。一旦捕获，它将关闭任务作用域以中断未完成的线程并唤醒所有者。该类适用于任何子任务的结果都可以，且不需要等待其他未完成子任务结果的情况。它定义了获取第一个结果的方法，或者在所有子任务失败时抛出异常。\n\
  \n```java\nimport java.util.concurrent.Callable;\nimport java.util.concurrent.StructuredTaskScope;\n\
  public class StructuredConcurrencyDemo2 {\n    public static void main(String[]\
  \ args) throws Exception {\n        Callable<String> task1 = ()-> \"Welcome\";\n\
  \        Callable<Integer> task2 = ()-> 12/0;\n        try (var scope = new StructuredTaskScope.ShutdownOnSuccess<>())\
  \ {\n            StructuredTaskScope.Subtask<String> subtask1 = scope.fork(task1);\n\
  \            StructuredTaskScope.Subtask<Integer> subtask2 = scope.fork(task2);\n\
  \            scope.join();\n        }\n    }\n}\n```\n\n### String Template\n\n\n\
  \n\n\n`String Templates` 通过将常量字符串与变量值合并，极大地改进了 Java 中创建字符串的方式。\n\n`String Template`\
  \ 类似于包含 `String` 字面量和变量值的模式。\n\n简单来说，我们可以说它是 Java 中创建 `String` 的一种简化方式。`String Template`\
  \ 的优势在于：\n\n- 简化了带有可以在运行时编译的值的 `Strings` 表达式。\n- 增强了 `String` 的可读性。\n- `String`\
  \ 可以仅通过占位符而不带值编写，并在运行时提供。这也会增加安全性。\n\n### 模板表达式 (Template Expression)\n\n它是一个可编程的\
  \ Java 表达式。可编程的模板表达式可以执行插值，并为我们以更简单的方式安全、高效地组合字符串提供了灵活性。\n\n模板表达式包含三个组成部分：\n\n-\
  \ 一个处理器 (processor)\n- 一个包含表达式数据/文本的模板 (template)\n- 一个点 (`.`) 字符\n\n`Template Processor`\
  \ 帮助求值 `Template expression` 并在运行时与 `String` 字面量结合。\n\nJava 提供了一套 `Template processor`\
  \ 供你使用，Java 提供了这种能力。由于它是 Java 21 中的一项预览功能，在 Java 21 之后你也可以创建自己的 `Template Processor`。让我们来看看\
  \ Java 内置的 `Template Processors`：\n\n### STR Template Processor\n\n`STR Template\
  \ Processor` 通过将提供的模板中的每个嵌入表达式替换为该表达式的值来执行字符串插值。\n\n```java\npublic class StringTemplateDemo\
  \ {\n    public static String formatString(String name, String programName) {\n\
  \        return STR . \"Welcome to PalywithJava,Mr. \\{name}, We will start \\{programName}\"\
  ;\n    }\n    public static String formatString2(String name, String programName)\
  \ {\n        return STR . \"Welcome to PalywithJava,Mr. \\{name} \\nWe will start\
  \ \\{programName}\";\n    }\n\n    public static void main(String[] args) {\n  \
  \      String strDemo1=formatString(\"Raj\",\"Java\");\n        String strDemo2=formatString2(\"\
  Raj\",\"Java\");\n\n        System.out.println(\" String Demo1: \"+strDemo1);\n\
  \        System.out.println(\" String Demo2: \"+strDemo2);\n    }\n}\n```\n\nResult:\n\
  ```\nString Demo1: Welcome to PalywithJava,Mr. Raj, We will start\nString Demo2:\
  \ Welcome to PalywithJava,Mr. Raj We will start\n```\n\n`STR Process` 甚至可以多行字符串。\n\
