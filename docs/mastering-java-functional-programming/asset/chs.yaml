  \n### 使用包装类的优势\n\n以下是 Java 包装类的一些主要优势。\n\n#### 将基本数据类型表示为对象：\n包装类提供了将基本数据类型作为对象的方法，这在某些只接受对象的情况下是必要的，例如在\
  \ `ArrayList` 和 `HashMap` 等集合中。使用包装类而不是基本数据类型始终是一个良好的做法。\n\n#### 存储 null 值：\nJava\
  \ 中的基本数据类型不能存储 null 值，但包装类可以被设置为 null，这在表示缺失或未知值时非常有用。\n\n#### 自动装箱和自动拆箱：\n包装类提供了基本类型之间的自动转换。自动装箱是基本类型到其包装对象的自动转换，而自动拆箱是将包装对象转换回基本类型的转换。\n\
  \n```java\nimport java.util.*; \nimport java.lang.*; \nimport java.io.*;\n\nclass\
  \ WrapperExample {\n    public static void main(String[] args) {\n        int a=10;\n\
  \        try {\n            int result = a / 0;\n        } catch (Exception e) {\n\
  \            System.out.println(a+\" \"+e);\n        }\n    }\n}\n```\n\n### 什么是异常\n\
  \n异常是程序执行过程中发生的不受希望或意外的事件，它会中断执行流。\n\n如何处理异常？\nJava 中的异常处理是针对异常情况做出响应以维护程序的过程。\n\
  \n### 异常层次结构\n如我们所知，Java 是一种面向对象的语言，每个类都继承 `Object` 类。所有异常和错误都是 `Throwable` 的子类。`Throwable`\
  \ 是异常的基父类。\n\n![](img/image_rsrc3VU.jpg)\n\n### 异常类型\n主要有两种类型的异常：\n1. 检异常 (Checked\
  \ Exception)\n2. 未检异常 (Unchecked Exception)\n\n#### 检异常\n- 检异常是编译器在编译时检查的异常。\n-\
  \ 如果不处理这些异常，程序将无法编译。\n- 这些异常是 `Exception` 类的子类。\n- 检异常是 Java 编译器要求我们处理的异常。我们必须声明式地将异常向上抛出调用堆栈，要么必须处理它。\n\
  \n#### 未检异常\n- 未检异常是 `JVM` 在运行时检查的异常，因为编译器无法检查它们。\n 持 带有未检异常的程序可以成功编译，你不会得到任何编译错误，但如果没有处理，你将获得运行时错误。\n\
  - 这些是 `RuntimeException` 的子类。\n\n程序员如何处理异常？\n作为开发者，当我们编写任何可能发生某种异常的代码时，我们作为开发者需要处理该异常，或者我们可以使用\
  \ `throw` 关键字将该异常委托给调用者。\n\n\n\n\n\n`/Users/aray/Library/Java/JavaVirtualMachines/openjdk-21/Contents/Home/bin/java\
  \ -javaagent:/Applications/IntelliJ IDEA CE.app/Contents/lib/idea_rt.jar=64711:/Applications/IntelliJ\
