  ```\n\n### Record 类的增强\n\n我们已在“Java 17 特性”章节中讨论过 Record 类，你可以直接访问。\n\n让我们来了解在 Java\
  \ 21 中使用 Record 类简化了哪些内容。\n\n正如我们所知，我们过去在应用程序中使用 Bean/POJO 类作为数据载体类。当我们为数据载体类创建一个\
  \ POJO 类时，通常需要实现带有所需参数的 `hashCode()` 和 `equals(...)` 方法，以便我们能够简单地比较两个 Java 对象。\n\
  \n让我们通过示例来理解：\n\n**创建 POJO 类：**\n```java\nclass Employee{\n    String name;\n  \
  \  Integer empID;\n    String city;\n\n    public Employee(String name, Integer\
  \ empID, String city) {\n        this.name = name;\n        this.empID = empID;\n\
  \        this.city = city;\n    }\n}\n```\n\n**测试类：**\n```java\npublic class RecordClassDemo\
  \ {\n    public static void main(String[] args) {\n        Employee e1=new Employee(\"\
  Raj\",11,\"Bangalore\");\n        Employee e2=new Employee(\"Raj\",11,\"Bangalore\"\
  );\n        System.out.println(\" e1 equals e2 :\"+(e1.equals(e2)));\n    }\n}\n\
  ```\n结果：`e1 equals e2 :false`\n\n你可以看到，我们有两个 `Employee` 对象 `e1` 和 `e2`，它们的内容完全相同，但是它们仍然**不相等**的，因为\
  \ `equal(..)` 方法的默认实现是基于引用的，而不是内容。\n\n如你所见，结果是 `false`。让我们看看它的实现：通常情况下，根据 Java 规范，必须实现\
  \ `hashCode()`，更多信息可以查看 API 文档。在这里，如果你希望比较基于内容，你必须重写 `equals(..)` 方法和 `hashCode()`\
  \ 方法。\n\n```java\nimport java.util.Objects;\n\nclass Employee{\n    String name;\n\
  \    Integer empID;\n    String city;\n\n    public Employee(String name, Integer\
  \ empID, String city) {\n        this.name = name;\n        this.empID = empID;\n\
  \        this.city = city;\n    }\n\n    @Override\n    public boolean equals(Object\
  \ o) {\n        if (this == o) return true;\n        if (o == null || getClass()\
  \ != o.getClass()) return false;\n        Employee employee = (Employee) o;\n  \
  \      return Objects.equals(name, employee.name) && Objects.equals(empID, employee.empID)\
  \ && Objects.equals(city, employee.city);\n    }\n\n    @Override\n    public int\
  \ hashCode() {\n        return Objects.hash(name, empID, city);\n    }\n}\n\npublic\
  \ class RecordClassDemo {\n    public static void main(String[] args) {\n      \
  \  Employee e1=new Employee(\"Raj\",11,\"Bangalore\");\n        Employee e2=new\
  \ Employee(\"Raj\",11,\"Bangalore\");\n        System.out.println(\" e1 equals e2\
  \ :\"+(e1.equals(e2)));\n    }\n}\n```\n结果：`e1 equals e2 :true`\n\n在这里你可以看到，对于 POJO\
  \ 类，我们必须重写这些方法，然后才能根据内容比较两个 Java 对象。\n\n## 我们可以使用 Record 类来简化它。\n\n使用 Record 类进行简化\n\
  ```java\npublic class RecordClassDemo {\n    public static void main(String[] args)\
  \ {\n        Employee e1=new Employee(\"Raj\",11,\"Bangalore\");\n        Employee\
  \ e2=new Employee(\"Raj\",11,\"Bangalore\");\n        System.out.println(\" e1 equals\
  \ e2 :\"+(e1.equals(e2)));\n    }\n}\n\nrecord Employee( String name,Integer empID,String\
  \ city){}\n```\n结果：`e1 equals e2 :true`\n\n● 在这里，Java 编译器为我们生成字节码，并考虑了所有为了实现 `equals`\
  \ 和 `hashCode` 方法而定义的参数。\n● Record 类还提供了 `toString()` 和 getter 方法，但没有 setter 方法。●\
  \ Record 类被设计为不可变性，这意味着一旦创建了实例，我们只能读取对象成员而不能更改它们的值。\n\nRecord 模式（Record patterns）首次在\
  \ JDK 19 中预览，并在随后的 JDK 20 中进行了完善。该功能已准备就绪并包含在 JDK 21 中！\n\n此新功能的目标是将模式匹配扩展到 record，允许处理更复杂的数据。\n\
  \n### 如下创建 Record 和接口：\n\n```java\nrecord Dog(String dogBreed, String dogName) implements\
  \ Animal {}\nrecord Cat(String catBreed, String catName) implements Animal {}\n\
  interface Animal{}\n\npublic class RecordWithPatterDemo {\n    public static void\
  \ getDogDetails(Animal animal) {\n        if (animal instanceof Dog) {\n       \
  \     Dog dog = (Dog) animal;\n            String dogBreed = dog.dogBreed();\n \
  \           String dogName = dog.dogName();\n            System.out.println(dogName+\"\
  \ the \"+dogBreed+\" is such a good Dog !!\");\n        }\n    }\n\npublic static\
  \ void main(String[] args) {\n        Dog dog=new Dog(\"Bulldog\",\"Moti\");\n \
  \       getDogDetails(dog);\n    }\n}\n```\n结果：`Moti the Bulldog is such a good\
  \ Dog!`\n\n在这里我们拥有带有 `name` 和 `breed` 字段的 `Dog` 和 `Cat` Record 类。\n\n在 Java 21 之前，如果我们想打印动物的详情（特别是狗或猫），我们必须检查对象类型、进行强制转换，并定义新变量来提取我们需要的字段，如上面的示例所示。\n"
