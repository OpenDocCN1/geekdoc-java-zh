  \ = 123456789L;` // `L` 表示这是一个 long 值。\n- `System.out.println(\"Distance: \" + distance);`\
  \ // 输出：123456789\n\n### short（短整型）\n- 用于存储较小的整数。\n- `short height = 160;`\n- `System.out.println(\"\
  Height: \" + height);` // 输出：160\n\n### byte（字节型）\n- 用于存储非常小的整数。\n- `byte level\
  \ = 12;`\n- `System.out.println(\"Level: \" + level);` // 输出：12\n\n### char（字符）\n\
  \n\n\n\n\n-   用于存储单个字符。1. `char grade = 'A';` 2. `System.out.println(\"Grade: \"\
