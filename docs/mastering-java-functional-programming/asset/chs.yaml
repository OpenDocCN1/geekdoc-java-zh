  \ dept='Development', desig='SSE', salary=140000}\n```\n在上面的例子中，我们根据 `name` 和 `salary`\
  \ 的倒序对 `Employee` 数据进行了排序。因此，倒序应用于了两个字段。\n\n如果我想用一个独立的 `Comparator` 来按 `Name` 自然排序和\
