  \ email='Yogit@gmail.com', id=14}`\n\n在本节后面的部分，我们将介绍一个新概念，“方法引用（Method Reference）”。与其使用\
  \ Lambda 表达式，我们可以使用方法引用来简化代码。\n\n## Stream 排序是如何工作的？\n\n![](img/image_rsrc3X7.jpg)\n\
  \n如上所示，我们可以通过简单的简单的逻辑，对 `Employee` 集合进行自然顺序排序或倒序排序。\n\n### 倒序排序\n\n`Collections.sort(ee,(x,y)->y.getName().compareTo(x.getName()));`\n\
  `Collections.sort(ee,(x,y)->-x.getName().compareTo(y.getName()));`\n\n正如你所看到的，我们可以使用\
  \ `Comparable` 和 `Comparator` 以任何顺序对 `Employee` 集合排序。现在我们将使用 `Comparator(I)` 对员工集合进行倒序排序。对于自定义排序，始终推荐使用\
  \ `Comparator`。\n\n```java\nimport java.util.ArrayList; import java.util.Collections;\
  \ import java.util.List;\n\npublic class ComparableDemoWithLambda {\n    public\
  \ static void main(String[] args) {\n        Comparable<Employee> c=(e1)->e1.getName().compareTo(e1.getName());\
  \ \n        Employee e1=new Employee(\"Raj\",\"Ra@gmail.com\",11l); \n        Employee\
  \ e2=new Employee(\"Mohit\",\"Mohit@gmail.com\",10l); \n        Employee e3=new\
  \ Employee(\"Abhinash\",\"Yogit@gmail.com\",14l);\n        List<Employee> ee= new\
  \ ArrayList<>();\n        ee.add(e1);\n        ee.add(e2);\n        ee.add(e3);\n\
  \        // 用于倒序排序\n        Collections.sort(ee,(x,y)->y.getName().compareToIgnoreCase(x.getName()));\
  \ \n        ee.forEach(System.out::println );\n    }\n}\n```\n\n结果：\n`Employee{name='Raj',\
  \ email='Ra@gmail.com', id=11}`\n`Employee{name='Mohit', email='Mohit@gmail.com',\
  \ id=10}`\n`Employee{name='Abhinash', email='Yogit@gmail.com', id=14}`\n\n## 使用\
  \ Stream API\n\n现在我们将使用 Stream API 对相同的 `Employee` 集合进行排序。在拥有大量数据的实时环境中，人们倾向于使用\
  \ Stream 来排序集合数据。\n\n### 使用 Lambda 表达式\n\n```java\nList<Employee> employeeList=\
  \ ee.stream()\n    .sorted(Comparator.comparing(x->x.getName()))\n    .collect(Collectors.toList());\n\
