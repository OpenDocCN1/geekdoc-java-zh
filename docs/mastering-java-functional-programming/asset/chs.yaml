  ;\n    }\n  }\n}\n```\n\n### Record 类: java 17 特性 (Record class: java 17 feature)\n\
  \n`Record` 是 `java` 中的一种特殊类，主要用于数据载体类/DTO。它是作为 `java 14`的一部分引入的。在项目中，将数据从 `DTO`\
  \ 转换为实体并反之是常见场景。对于数据 `DTO` 类，我们通常需要创建：\n1. `Setter` 方法\n2. `Getter` 方法\n3. 构造函数\
  \ (`constructor`)\n4. `toString` 方法\n5. `Hashcode` 方法\n6. `Equals` 方法\n\n虽然 `java`\
  \ 有一些插件可以处理这些事情，但如果项目中没有使用这些插件，你就必须手动创建/生成所有方法，这会导致类变得非常庞大。\n\n你可以使用 `lombok` 库来简化，但在\
  \ `java 14` 之前，`java` 默认并没有内置此类功能来处理它。\n\n现在我们将看到使用和不使用 `Record` 类的 `DTO`/数据载体类。\n\
  \n唯一的区别是，如果你使用 `Records` 类而不是普通的 `Java` 类，那么你就不需要像上面看到的那样，为 `DTO` 类创建 getter/setter\
  \ 和其他方法了。\n\n### Record 类演示 (Record class demo)\n\n示例 DTO:\n```java\npackage playwithjava.in.testt;\n\
  import java.util.Objects;\npublic class EmployeeDto {\n  private String name;\n\
  \  private String email;\n  private Long empId;\n\n  public EmployeeDto(String name,\
  \ String email, Long empId) {\n    this .name = name;\n    this.email = email;\n\
  \    this.empId = empId;\n  }\n\n  public EmployeeDto(String name, String email)\
  \ {\n    this.name = name;\n    this.email = email;\n  }\n\n  public String getName()\
  \ {\n    return name;\n  }\n\n  public void setName(String name) {\n    this.name\
  \ = name;\n  }\n\n  public String getEmail() {\n    return email;\n  }\n\n  public\
  \ void setEmail(String email) {\n    this.email = email;\n  }\n\n  public Long getEmpId()\
  \ {\n    return empId;\n  }\n\n  public void setEmpId(Long empId) {\n    this.empId\
  \ = empId;\n  }\n\n  @Override\n  public boolean equals(Object o) {\n    if (this\
  \ == o) return true;\n    if (o == null || getClass() != o.getClass()) return false;\n\
  \    EmployeeDto that = (EmployeeDto) o;\n    return name.equals(that.name) && email.equals(that.email)\
  \ && empId.equals(that.empId);\n  }\n\n  @Override\n  public int hashCode() {\n\
  \    return Objects.hash(name, email, empId);\n  }\n}\n```\n\n使用 `lombok` 插件来简化：\n\
  ```java\nimport lombok.*;\n@Data\n@NoArgsConstructor\n@AllArgsConstructor\n@ToString\n\
  @EqualsAndHashCode\npublic class EmployeeDto {\n  private String name;\n  private\
  \ String email;\n  private Long empId;\n}\n```\n\n使用 `record`：\n```java\nrecord\
  \ EmployeeDto(String name,String email,Long empId){ }\n```\n\n1. 它没有无参构造函数。\n2.\
  \ `record` 默认是不可变的，因此它是 `final` 的，且不能被扩展。\n3. 它会为每个字段创建一个 `public` 构造函数。\n\n```java\n\
  public EmployeeDto(String name, String email, Long empId) {\n  this.name = name;\n\
  \  this.email = email;\n  this.empId = empId;\n}\n```\n\n只有这个构造函数适用于该 `record`（3\
  \ 个字段）。如果你想要一个 2 个字段、1 个字段或无参的构造函数，你需要显式地创建。\n\n```java\nEmployeeDto employeeDto=\
  \ new EmployeeDto(\"Raj\",\"raj@gmail.com\",122l);\n// EmployeeDto employeeDto=new\
  \ EmployeeDto(\"Raj\",\"raj@gmail.com\"); // 这会导致编译错误\n```\n\n你需要显式地创建 2 参数的构造函数。\n\
  ```java\nEmployeeDto employeeDto=new EmployeeDto();\n```\n\n### 带守卫模式的 Switch (Switch\
  \ with Guarded Pattern): java 20\n\n```java\npublic static String switchWIthGuardedPatternWithReturn3(Object\
  \ bar) {\n  switch(bar) {\n    case Integer i && i<200-> {\n      return \"Integer\"\
  ;\n    }\n    case EmployeeTest l && l.eid>10 -> {\n      return \"Employee\";\n\
  \    }\n    case EmpRecord e &&e.eid()>2-> {\n      return \"EmpRecord\";\n    }\n\
  \    default -> {\n      return \"Default\";\n    }\n  }\n}\n```\n\n### 密封类 (Sealed\
  \ Classes): java 17\n\n`Sealed` 类/接口允许更细粒度的继承。密封（Sealing）一个类/接口意味着我们正在定义允许的子类。简单来说，密封一个类意味着我们在指示哪些类可以扩展它。\n\
  \n如果你有一个 `final` 类，它不能被扩展；如果它是 `abstract` 的，则任何人都可以扩展它。而密封类的作用是限制扩展到指定的类。\n\n####\
  \ 密封接口 (Sealed Interface)\n\n```java\npublic sealed interface OrgService permits\
  \ EmployeeService, ...\n```\n\n从接口声明可以清楚地看到，只有 `EmployeeService`(I)、`TraineeService`(I)\
  \ 和允许的类可以扩展密封的 `OrgService`。\n\n使用密封类/接口的主要目的是为我们的类提供模块化安全性，使得在获得许可之前，任何人无法访问它们。\n\
  \n在使用密封类时，我们需要遵循一些原则：\n1. 密封类/接口可以在包内扩展。\n2. 子类/接口应该实现/扩展该密封类/接口。\n3. 子类/接口应该具有\
  \ `final`、`sealed` 或 `non-sealed` 修饰符之一。\n\n#### 代码流程演示 (Code walkthrough)\n\n```java\n\
  package playwithjava.in.sealedDemo;\npublic sealed interface OrgService permits\
  \ EmployeeService,TraineeService {\n  int getAge();\n\n  int getSalary();\n}\n```\n\
  \n如果子类是 `non-sealed` 接口，那么所有人都可以扩展。\n\n```java\npackage playwithjava.in.sealedDemo;\n\
  public non-sealed interface EmployeeService extends OrgService {\n  String getEmployeeName();\n\
  }\n```\n\n如果子类是 `sealed` 接口，那么它不是所有人都可以扩展的。\n```java\npackage playwithjava.in.sealedDemo;\n\
  public class EmployeeImpl implements EmployeeService{\n  @Override\n  public String\
  \ getEmployeeName() {\n    return \"Amit\";\n  }\n\n  @Override\n}\n```\n\n\n\n\n\
  ```java\npublic int getAge() {\n    return 28;\n    }\n\n    @Override\n    public\
  \ int getSalary() {\n        return 331110;\n    }\n}\n```\n\n```java\npackage palywithjava.in.sealedDemo;\n\
  \npublic sealed interface TraineeService extends OrgService permits SealedTesterIntrface\
  \ {\n    String getTraineeName();\n}\n```\n\n```java\npackage palywithjava.in.sealedDemo;\n\
  \npublic non-sealed interface SealedTesterIntrface extends TraineeService {\n\n\
  }\n```\n\n```java\npackage palywithjava.in.sealedDemo;\n\npublic class TraineeImpl\
  \ implements SealedTesterIntrface {\n    @Override\n    public int getAge() {\n\
  \        return 25;\n    }\n\n    @Override\n    public int getSalary() {\n    \
  \    return 333330;\n    }\n\n    @Override\n    public String getTraineeName()\
  \ {\n        return \"Raj\";\n    }\n}\n```\n\n![](img/image_rsrc3XB.jpg)让我们尝试从另一个包中的另一个来扩展此接口。\n\
  \n![](img/image_rsrc3XC.jpg)你可以看到错误“类不允许扩展另一个包中的密封类”。你可以使用集合（collections）获取有关密封类（Sealed\
  \ Classes）的信息：\n\n```java\nsealed class Product permits Laptop {\n\n}\n\nnon-sealed\
  \ class Laptop extends Product{ }\n\npublic class DemoTest {\n    public static\
  \ void main(String[] args) {\n        Product p=new Product();\n        Product\
  \ c = new Product();\n        Class cz = c.getClass();\n        Class<?>[] permittedSubclasses\
  \ = cz.getPermittedSubclasses();\n        for (Class<?> sc : permittedSubclasses){\n\
  \            System.out.println(cz.isSealed()+\" \"+sc.getName());\n        }\n\
  \    }\n}\n```\n结果：`true Laptop`\n\n### Java8 中的 CompletableFuture\n\n```java\n\
  public class CompletableFuture<T> extends Object implements Future<T>, CompletionStage<T>\n\
  ```\n\n* ● 它允许我们在 Java 中编写异步代码或非阻塞代码。\n* ● 它在与主线程（Main Thread）独立的 `Thread` 上运行任务，并通知主线程任务完成或失败。\n\
  * ● 在这种情况下，主线程不需要阻塞/等待任务完成，另一个任务可以并行运行。\n* ● 它是一个 `Future`，可以显式地完成，或者可以是一个 `CompletionStage`，我们可以在完成/失败时执行额外的操作。\n\
  * ● 它在内部使用 `ForkJoinPool` 类来获取 `Executor` 实例以运行作业，`ForkJoinPool` 基于工作窃取算法，它默认情况下会创建与可用处理器数量相同数量的\
  \ `Thread`（如果需要，可以自定义此行为），并且 `Threads` 会自动窃取任务进行执行。\n\n`CompletableFuture` 只是 `java.util.future`\
  \ 的增强版本。\n\n```java\n// 使用默认 Thread 的 Runnable run() 方法的 CompletableFuture\nCompletableFuture<Void>\
  \ comp=CompletableFuture. runAsync(()->{ \n    System.out.println(\"###### This\
  \ is RUN Method\");\n    System.out.println(\"##### Thread Name: \"+Thread.currentThread().getName());\n\
  });\n\n// 使用 Executor 的 Runnable run() 方法的 CompletableFuture\nExecutor exec= Executors.newFixedThreadPool(5);\n\
  CompletableFuture<Void> comp1=CompletableFuture.runAsync(()->{\n    System.out.println(\"\
  ==> This is RUN Method\");\n    System.out.println(\"==>Thread Name: \"+Thread.currentThread().getName());\
  \ \n},exec);\nSystem.out.println(\"||| Main Thread Name: \"+Thread.currentThread().getName());\n\
  ```\n结果：\n###### This is RUN Method\n##### Thread Name: ForkJoinPool.commonPool-worker-1\
  \ ||| Main Thread Name: main\n==> This is RUN Method\n==>Thread Name: pool-1-thread-1\n\
  \n你可以将任何 `Runnable` 实例作为 `arg` 传递给 `runAsync(r)`，你甚至可以传递一个 `Executor` 实例，这样它将在 `Executors`\
  \ 上运行而不是 `ForkJoinPool`（默认执行器）。简化相同的代码：\n\n```java\n// Runnable(I) run 方法实现\nRunnable\
  \ run=()->{\n    System.out.println(\"This is Runnable run method.\");\n    System.out.println(\"\
  ##### Thread Name: \"+Thread.currentThread().getName());\n};\n\n// 使用默认 Thread 的\
  \ Runnable run() 方法的 CompletableFuture \nCompletableFuture<Void> comp=CompletableFuture.runAsync(run);\
  \ \n\n// 使用 Executor 的 Runnable run() 方法的 CompletableFuture\nExecutor exec= Executors.newFixedThreadPool(5);\n\
  CompletableFuture<Void> comp1=CompletableFuture.runAsync(run,exec); \nSystem.out.println(\"\
  ||| Main Thread Name: \"+Thread.currentThread().getName());\n```\n输出：\nThis is Runnable\
  \ run method.\n##### Thread Name: ForkJoinPool.commonPool-worker-1\n||| Main Thread\
  \ Name: main\nThis is Runnable run method.\n##### Thread Name: pool-1-thread-1\n\
  \n为了理解 `CompletableFuture`，最好对接口/方法进行高层级的概览。\n\n#### 接口 `Future<I>`\n```java\npublic\
  \ interface Future<V>\n```\n* ● `Future` 也能在某些局限性下实现非阻塞代码。\n* ● 它不能被手动完成。\n* ● 我们无法组合多个\
  \ `Future` 对象且没有适当的异常处理。\n\n#### 接口 `CompletionStage<T>`\n```java\npublic interface\
  \ CompletionStage<T>\n```\n* ● 可能是异步计算的一个阶段，用于执行一个操作或计算一个值。\n* ● 当任务完成或失败时，可以触发后续操作。\n\
  * ● 多个 `CompletionStage` 可以链式调用。\n* ● 使用函数式接口如 `Runnable`、`Callable`、`Function`\
  \ 和 `Consumer`。我们将在后文中详细介绍 Stream API。\n\n示例：\n`stage.thenApply(x).thenAccept(x).thenRun(()\
  \ -> System.out.println`\n\n#### `CompletableFuture` 中常用的方法\n\n* `static CompletableFuture<Void>\
  \ runAsync(Runnable)`\n  返回一个在 `ForkJoinPool.commonPool()` 上异步完成的 `CompletableFuture`。\n\
  * `static CompletableFuture<Void> runAsync(Runnable, Executor)`\n  返回一个在 `executor`\
  \ 上异步完成的 `CompletableFuture`。\n* `static <U> CompletableFuture<U> supplyAsync(Supplier<U>)`\n\
  \  返回一个在 `ForkJoinPool.commonPool()` 上异步完成的 `CompletableFuture`。\n* `static <U>\
  \ CompletableFuture<U> supplyAsync(Supplier<U>, Executor)`\n  返回一个在 `executor` 上异步完成的\
  \ `CompletableFuture`。\n\n现在我们来看在什么时候需要使用 `runAsync(r)` 和 `supplyAsync(Supplier<U>)`。\n\
  `runAsync(r)`：当没有返回值时。\n`supplyAsync(Supplier<U>)`：当期望返回值时。\n\n示例：根据名称降序排序所有员工数据。\n\
  \n```java\nimport palwithjava.in.util.EmplUtil;\nimport java.util.Comparator;\n\
  import java.util.concurrent.CompletableFuture;\n\npublic class Java8Demo {\n   \
  \ public static void main(String[] args) throws Exception {\n        CompletableFuture<Void>\
  \ complettableFuture = CompletableFuture.runAsync(new Runnable() {\n           \
  \ @Override\n            public void run() {\n                // EmplUtil.getAllEmployeesData()\
  \ 将返回所有员工 EmplUtil.getAllEmployeesData().stream()\n                .sorted(Comparator.comparing(EmployeeData::getName)\n\
  \                .reversed())\n                .forEach(System.out::println);\n\
  \            }\n        });\n        completableFuture.get();\n    }\n}\n```\n\n\
  使用 Lambda 表达式：\n```java\nCompletableFuture<Void> completFuture2 = CompletableFuture.runAsync(()\
  \ -> {\n    // EmplUtil.getAllEmployeesData() 将返回所有员工 EmplUtil.getAllEmployeesData().stream()\n\
  \    .sorted(Comparator.comparing(EmployeeData::getName)\n    .reversed())\n   \
  \ .forEach(System.out::println);\n});\ncompletableFuture2.get();\n```\n\n用例 2：根据薪资升序排序员工数据。\n\
  \n```java\nimport palwithjava.in.util.EmplUtil;\npackage palwithjava.in;\n\nimport\
  \ palwithjava.in.bean.EmployeeData;\nimport palwithjava.in.util.EmplUtil;\nimport\
  \ java.util.Comparator;\nimport java.util.List;\nimport java.util.concurrent.CompletableFuture;\n\
  import java.util.function.Supplier;\nimport java.util.stream.Collectors;\n\npublic\
  \ class Java8Demo {\n    public static void main(String[] args) throws Exception\
  \ {\n        //supplyAsync 将接受 Supplier（函数式接口）作为输入 // 我们将查看最常用的\n        CompletableFuture<List<EmployeeData>>\
  \ completableFuture =\n        CompletableFuture.supplyAsync(new Supplier<List<EmployeeData>>()\
  \ {\n            @Override\n            public List<EmployeeData> get() {\n```\n\
  \n\n\n\n\n```java\nreturn EmplUtil.getAllEmployeesData()\n.parallelStream()\n.sorted(Comparator.comparing(EmployeeData::getAnnualSalary))\n\
  .collect(Collectors.toList());\n\n}\n\n});\n\nList<EmployeeData> result=completableFuture.get();\n\
  \nresult.forEach(x-> System.out.println(x));\n\n}\n\n}\n```\n\n我刚刚用了一个简单的示例来解释这些用例。\n\
  \n在 `CompletableFuture` 中我们有许多方法可以连接任务并以异步模式执行并行作业。如果需要了解更多信息，请访问官方文档，或者请告诉我，以便我涵盖所有这些方法。使用\
  \ lambda 表达式：\n\n```java\nimport playwithjava.in.util.EmplUtil;\n\nimport java.util.Comparator;\n\
  \nimport java.util.List;\n\nimport java.util.concurrent.CompletableFuture;\n\nimport\
  \ java.util.stream.Collectors;\n\npublic class Java8Demo {\n\n    public static\
  \ void main(String[] args)throws Exception {\n        //supplyAsync 将接收 Supplier（函数接口）作为输入\n\
  \        // 我们将在下博客博客中查看最常用的函数接口\n        CompletableFuture<List<EmployeeData>>\
  \ completableFuture = CompletableFuture.supplyAsync(()->EmplUtil.getAllEmployeesData()\n\
  \                .parallelStream()\n                .sorted(Comparator.comparing(EmployeeData::getAnnualSalary))\n\
  \                .collect(Collectors.toList()));\n\n        List<EmployeeData> empData=completableFuture.get();\n\
  \n        empData.forEach(System.out::println);\n    }\n}\n```\n\n如果你想使用你自己的 `ExecutorService`：\n\
  \n```java\nExecutor executor= Executors.newFixedThreadPool(5);//你的执行器\nCompletableFuture<List<EmployeeData>>\
  \ completableFuture = CompletableFuture.supplyAsync(()-> {\n\n    return EmplUtil.getAllEmployeesData()\n\
  \    .parallelStream()\n    .sorted(Comparator. comparing(EmployeeData::getAnnualSalary))\n\
  \    .collect(Collectors.toList());\n},executor);\n\nList<EmployeeData> result=completableFuture.get();\n\
  \nresult.forEach(x-> System.out.println(x));\n```\n\n如果你在没有 `Executor Service` 的情况下使用\
  \ `supplyAsync(..)` 和 `runAsync(..)`，`CompletableFuture` 将使用 `ForkJoinPool` 来创建线程，默认线程数量与可用处理器数量相同。\n\
  \n## CompletableFuture 其他重要方法的演练\n\n`CompletableFuture_Instance.thenXXX(函数接口 实例)`\n\
  \n### 示例：\n`CompletableFuture_Instance.thenApply(Function_ 实例)`\n\n这里 `Function`\
  \ 是一个函数接口，它接收一个输入并返回另一个输入。我们可以用它进行数据处理。\n在异步模式下为每个员工的名字添加“Mr.”。\n\n#### 代码演练 `CompletableFuture_Instance.thenApply(Function_Instance)`\n\
  \n```java\nCompletableFuture<List<String>> currentWorkingEmpData=CompletableFuture\
  \ .supplyAsync(()-> EmplUtil.getAllCurrentEmployeesData()\n        .stream()\n \
  \       .map(EmployeeData::getName)\n        .collect(Collectors.toList()));\n\n\
  CompletableFuture<List<String>> listCompletableFuture=currentWorkingEmpData .thenApply(x->x.stream()\n\
  \        .map(y -> \"Mr. \" + y)\n        .collect(Collectors.toList()));\n\nList<String>\
  \ names=listCompletableFuture.get();\n\nSystem.out.println(names);\n```\n\n### `CompletableFuture_Instance.thenAccept(Consumer_Instance)`\n\
  \n```java\nCompletableFuture<List<String>> currentWorkingEmpData=CompletableFuture\
  \ .supplyAsync(()-> EmplUtil.getAllCurrentEmployeesData()\n        .stream()\n \
  \       .map(EmployeeData::getName)\n        .collect(Collectors.toList()));\n\n\
  currentWorkingEmpData.thenAccept(x->{\n    System.out.println(x);\n}); //你可以调用任何\
  \ Consumer 作为 thenAccept 方法参数的一部分\n```\n\n就像上面的示例一样，我们可以使用任何函数接口方法来执行 `CompletableFuture`\
  \ 链，并在异步模式执行。\n\n## 合并 2 个 CompletableFuture 结果\n\n你可以根据需求使用以下任一方法。\n\n### 方法\n\n\
  - `thenCompose(Function<? super T,? extends CompletionStage<U>> fn)`：返回一个新的 `CompletionStage`，当此阶段正常完成时，将以此阶段作为所提供函数的参数进行执行。\n\
  - `thenComposeAsync(Function<? super T,? extends CompletionStage<U>> fn)`：返回一个新的\
  \ `CompletionStage`，当此阶段正常完成时，将使用此阶段的默认异步执行设施进行执行，并以此阶段作为所提供函数的参数。\n- `thenComposeAsync(Function<?\
  \ super T,? extends CompletionStage<U>> fn, Executor executor)`：返回一个新的 `CompletionStage`，当此阶段正常完成时，将使用提供的\
  \ `Executor` 进行执行，并以此阶段的结果作为所提供函数的参数。\n\n```java\nCompletableFuture<List<EmployeeData>>\
  \ listCompletableFuture2=listCompletableFuture1 .thenCompose(s->CompletableFuture.supplyAsync(()->Java8Demo.getOldEmpList(s)));\n\
  \nSystem.out.println(listCompletableFuture1.get());\n```\n\n这里两个 `CompletableFuture`\
  \ 返回相同类型的对象。如果你想合并两个完全不同的 `Future`。\n\n- `thenCombine(CompletionStage<? extends\
  \ U> other, BiFunction<? super T,? super U,? extends V> fn)`：返回一个新的 `CompletionStage`，当此阶段和另一个给定的阶段都正常完成时，将以两个结果作为所提供函数的参数进行执行。\n\
  - `thenCombineAsync(CompletionStage<? extends U> other, BiFunction<? super T,? super\
  \ U,? extends V> fn)`：返回一个新的 `CompletionStage`，当此阶段和另一个给定的阶段都正常完成时，将使用此阶段的默认异步执行设施进行执行，并以两个结果作为所提供函数的参数。\n\
  - `thenCombineAsync(CompletionStage<? extends U> other, BiFunction<? super T,? super\
  \ U,? extends V> fn, Executor executor)`：返回一个新的 `CompletionStage`，当此阶段正常完成时，将使用提供的\
  \ `Executor` 进行执行，并以两个结果作为所提供函数的参数。\n\n```java\nCompletableFuture<List<EmployeeData>>\
  \ listCompletableFuture2=listCompletableFuture1 .thenCompose(s->CompletableFuture.supplyAsync(()->Java8Demo.getOldEmpList(s)));\n\
  \nSystem.out.println(listCompletableFuture1.get());\n```\n\n这里两个 `CompletableFuture`\
  \ 返回相同类型的对象。如果你想合并两个完全不同的 `Future`。\n\n```java\nCompletableFuture<List<EmployeeData>>\
  \ listCompletableFuture2=listCompletableFuture1 .thenCompose(s->CompletableFuture.supplyAsync(()->Java8Demo.getOldEmpList(s)));\n\
  \nSystem.out.println(listCompletableFuture1.get());\n```\n\n这里两个 `CompletableFuture`\
  \ 返回相同类型的对象。如果你想合并两个完全不同的 `Future`。\n\n```java\nCompletableFuture<List<EmployeeData>>\
  \ listCompletableFuture2=listCompletableFuture1 .thenCompose(s->CompletableFuture.supplyAsync(()->Java8Demo.getOldEmpList(s)));\n\
  \nSystem.out.println(listCompletableFuture1.get());\n```\n\n这里两个 `CompletableFuture`\
  \ 返回相同类型的对象。如果你想合并两个完全不同的 `Future`。\n\n```java\nCompletableFuture<List<EmployeeData>>\
  \ listCompletableFuture2=listCompletableFuture1 .thenCompose(s->CompletableFuture.supplyAsync(()->Java8Demo.getOldEmpList(s)));\n\
  \nSystem.out.println(listCompletableFuture1.get());\n```\n*(注：由于原文中存在大量重复段落，翻译时已根据要求对逻辑结构进行了对齐)*\n\
  \n```java\nCompletableFuture<List<String>> currentWorkingEmpData=CompletableFuture\
  \ .supplyAsync(()-> EmplUtil.getAllCurrentEmployeesData()\n        .stream()\n \
  \       .map(EmployeeData::getName)\n        .collect(Collectors.toList()));\n\n\
  CompletableFuture<List<String>> listCompletableFuture=currentWorkingEmpData .thenApply(x->x.stream()\n\
  \        .map(y -> \"Mr. \" + y)\n        .collect(Collectors.toList()));\n\nList<String>\
  \ names=listCompletableFuture.get();\n\nSystem.out.println(names);\n```\n\n```java\n\
  CompletableFuture<List<String>> currentWorkingEmpData=CompletableFuture .supplyAsync(()->\
