  \     List<EmployeeBean> empList= AppUtil.getEmpList();\n        System.out.println(\"\
  ########## Existing Data ############### \"); \n        empList.forEach(System.out::println);\n\
  \n        //Using Lambda Expression\n        Map<String,List<EmployeeBean>> empMap=empList.stream()\n\
