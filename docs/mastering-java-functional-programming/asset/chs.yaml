  \ Bangalore=150000}\n- 按城市平均薪资 :: {Patna=140000, Mumbai=60000, Bangalore=150000}\n\
  - 按城市员工人数 :: {Patna=140000, Mumbai=60000, Bangalore=150000}\n- 按城市最高薪资员工 :: {Patna=140000,\
  \ Mumbai=60000, Bangalore=150000}\n\n让我们考虑一个用例：我有一个巨大的 `Employee` 集合。如如下所示，`EmployeeBean`\
  \ 类中有很多许多属性。\n\n我想按 `CITY`（城市）对员工进行分组，结果我只需要“name”（名称）和“city”（城市）。\n\n在实际项目中，我们经常遇到这样的需求，即当我们拥有海量数据集，且只需要响应对象中的几个字段时，我们通常会将响应对象映射到我们需要的格式。\n\
  \n```java\npublic class EmployeeBean {\n    private String name;\n    private String\
  \ city;\n    private String dept;\n    private String desig;\n    private Integer\
  \ salary;\n    private String location;\n    private String nickName;\n    private\
