  \n### 数字不能除以零\n### 这是 finally 块\n\n### 记忆要点\n\n### 在编写任何代码时，你首先需要考虑该段代码是否可能会抛出异常。如果你认为在任何可能的用例下都有抛出异常的可能性，那么你必须将该段代码放在\
  \ `try` 块中，并需要添加相应的 `catch` 块。\n\n如果存在抛出异常的可能性，作为开发者，你要么处理该异常，要么必须将异常委托，以便代码的调用者需要处理该异常或将其委托给其调用者。这就是\
  \ Java 中异常处理的工作原理。\n\n当方法内部发生异常时，应由该方法负责处理异常，或者将其委托给方法的调用者。这种对异常处理的委托通过使用 `try-catch`\
  \ 块捕获异常，或者在方法签名中使用 `throws` 子句声明该方法可能会抛出异常来实现。如何抛出异常\n\n在 Java 中，`throws` 关键字用于将异常委托给其调用者。如果在任何方法中发生了异常，应由该方法负责处理，但如果异常没有被该方法处理，则它应该被委托给方法的调用者，此时方法的调用者仍然需要处理该异常，也可以继续委托。\n\
  \n`throws` 关键字仅用于将异常传递给其调用者。\n\nJava 中的 `throws` 关键字用于方法签名，以指示该方法可能会抛出 Java 异常类层次结构中的一个异常。\n\
  \n`throws` 关键字仅用于受检异常（checked exceptions），因为对非运行时异常（unchecked exceptions）使用它是没有意义的（非运行时异常可以通过修正编程错误来避免）。\n\
  \n`throws` 关键字可以用于声明异常。\n\n![](img/image_rsrc3VY.jpg)\n\n### 正如上面的示例代码所示，我们正在尝试读取文件，我们正在进行文件操作，这些操作有抛出\
  \ `IOException` 的可能，由于它是受检异常，我们必须处理它或将其委托给方法的调用者。\n\n![](img/image_rsrc3VZ) ###\
  \ 你可以从下面的示例中看到，我们在第一个示例中传递了异常。![](img/image_rsrc3W0)\n\n### throw 关键字\n\n➔ `throw`\
  \ 关键字用于显式抛出异常。\n ➔ 我们也可以用它抛出非运行时异常。\n ➔ 简单来说，我们可以根据给定的条件或用例抛出某些定义的异常。 ➔ 在执行 `throw`\
  \ 语句后，程序的执行流会立即停止，并寻找最近的 `catch` 块来匹配异常类型。如果找到了匹配的 `catch` 块，则执行它；否则，它会一直委托给调用者，直到找到相应的\
  \ `catch` 块。➔ 在这种情况下，`finally` 块 仍然会执行执行。 ➔ 我们可以根据某些错误信息来抛出异常。\n\n```java\npackage\
  \ org.example.exception;\n\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
  import java.nio.file.Path;\nimport java.nio.file.Paths;\nimport java.util.List;\n\
  \npublic class FileDemo {\n    public static List<String> readFile() throws IOException\
  \ {\n        Path filePath = Paths.get(\"c:/temp/files\", \"data.txt\");\n     \
  \   List<String> lines = Files.readAllLines(filePath);\n    }\n    public static\
  \ void main(String[] args) {\n        try {\n            List<String> data = readFile();\n\
  \        } catch (IOException e) {\n            throw new RuntimeException(e);\n\
  \        }\n    }\n}\n```\n\n正如你在上面的示例代码所示，我们在发生错误时抛出异常。我们可以在这里抛出适当的异常并带有正确的错误消息。\n\
  \n```java\npackage org.example.exception;\n\nimport java.io.IOException;\nimport\
  \ java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
  import java.util.List;\n\npublic class FileDemo {\n    public static List<String>\
  \ readFile() throws IOException {\n        Path filePath = Paths.get(\"c:/temp/files\"\
  , \"data.txt\");\n        List<String> lines = Files.readAllLines(filePath);\n \
  \   }\n    public static void main(String[] args) {\n        try {\n           \
  \ List<String> data = readFile();\n        } catch (IOException e) {\n         \
  \   ### throw new UserDefinedException(\" error message\");\n        }\n    }\n\
  }\n```\n\n`UserDefinedException` 意味着用户根据其需求创建的任何异常。\n\n假设你正在为某个关键词搜索某些数据，如果未为该关键词找到数据，你就想抛出一个异常。如果没有找到数据，你可能只想抛出一个像\
  \ `DataNotAvailableForKeyException` 的异常，或者你可以创建一个任何意义名称的异常。\n\n\n\n\n\n```\nthrow\
  \ new DataNotAvailableForKeyException(\" error message\");\n```\n\n这就是你如何抛出异常的方法。\n\
  \n### `throw` vs `throws`\n\n如你所见，这两个名称看起来相似，所以对新开发者来说有些困惑。简单来说，我们可以说 `throwing`\
  \ 意味着将异常处理权委托给调用者，意味着你**不再**要处理该异常了。\n\n`throw` 意味着根据你要求的某些特定逻辑 set，你可以抛出任何合适的异常。正如我们之前看到的，如果你正在验证\
  \ `userName` 并发现 `userName` **不是** 有效的，那么你可以创建一个如 `UserNameNotValid` 这样的自定义异常并直接将其抛出。\n\
  \n### `throw`\n\n它用于在程序的任何代码块中显式地抛出异常。\n\n`throw` 用于方法内部。你一次只能抛出一个异常。\n\n`throw`\
  \ 关键字可以用于抛出受检异常和未受检异常。\n\n```\nthrow new AnyException(\"error message\");\n```\n\
  \n### `throws`\n\n它用于函数签名，用声明方法在执行代码期间可能抛出的异常。\n\n`throws` 用于方法签名中。可以在声明中添加任意数量的异常。\n\
  \n`throws` 关键字只能用于受检异常。\n\n```\nvoid methodName() throws ArithmeticException,FileNotFoundException,AnyUserDefinedException\n\
  ```\n\n如果你在任何方法内部使用 `throw` 关键字抛出异常，那么 THEN 你必须使用 `try-catch` 处理它，或者使用 `throws`\
  \ 关键字将其委托给方法的调用者。\n\n```java\npublic static boolean validateUserName(String userName)\
  \ throws InvalidUserNameException {\n    if (!userName.equalsIgnoreCase(\"Raj\"\
  )){\n        throw new InvalidUserNameException(400,\"User Name is not valid\");\n\
  \    }\n    return true;\n}\n```\n\n### 创建异常 OR 自定义异常 OR 用户定义异常\n\n正如我们讨论过的，如果你在真实环境中工作，THEN\
  \ 异常处理是你需要非常仔细且聪明地处理的最重要概念之一。\n\n它确实让你的应用程序对用户更加友好，而且如果发生了错误，开发者将更容易找到确切的问题。\n\n\
  假设一下，作为开发者，你正在开发某个功能，过了一段时间客户遇到了问题。这些问题可能是任何问题，可能是数据问题，可能是某些功能问题，或者是由于某些方法或代码片段引起的任何其他问题，最关键的部分是它可以是任何类型的问题，甚至是不可预测的。因此，作为开发者，你需要编写这样的异常处理代码，使其能够简单地处理任何类型的异常，并在发生任何故障时提供适当错误信息，这样你或其他开发者就能轻松找到根源并尽快修复，以避免任何形式的升级。\n\
  \n诚实地说，这在日常开发环境中是非常直接且常见的现象。\n\n假设一下，你正在你的方法中验证“用户名”，你需要验证哪些基本点？可能是用户名模式、空值检查或任何你想要针对用户名验证的规则。现在你已经写了验证输入数据的逻辑，一旦数据通过验证并发现有任何问题，THEN\
  \ 你需要抛出一个带有适当错误信息的正确异常，以便最终用户能够理解。此错误信息应当应该是清晰的，即使是开发者也能理解根源，这将有助于开发者轻松地修复它。\n\n\
  我们可以通过扩展属于 `java.lang` 包的 `Exception` 类来根据需求创建异常。\n\n这些是与业务逻辑相关的异常，开发者希望用户按照要求的格式输入，如果用户未能这样做，就会抛出异常，用户将获得关于问题是什么以及如何解决的指示。这对于应用程序用户或开发者理解确切的问题非常有帮助。\n\
  \n示例：如果用户想要设置年龄限制，我们可以使用自定义异常并提供所需的注释作为输出。\n\n现在我们将看到我们开发者如何创建一些用户定义的异常。\n\n语法：\n\
  \n```java\nclass YourExceptionName extends Exception/”Any Predefined Exception”\
  \ {\n    // 添加你的属性，如错误消息、错误代码等 \n    // 添加构造函数以初始化异常对象\n}\n```\n\n如上所示，我们只是在创建一个扩展自\
  \ `Exception` 或 Java 中任何其他 `Exception` 类的类 `YourExceptionName`。这无非只是试图通过继承将 `Exception`\
  \ 类的行为继承到我们的类中。\n\n到目前为止，我们已经清楚，如果一个类继承另一个类，THEN 子类将自动继承父类的行为，在上面的示例中 `Exception`\
  \ 类是父类，所以我们的类 `YourExceptionName` 将拥有异常类的行为。\n\n这就是你如何根据需求在 Java 中创建自定义异常类。\n\n\
  ### 示例：`class UserNameNotValidException extends Exception`\n\n```java\npublic UserNameNotValidException(String\
  \ userName) { // 调用父类 Exception 的构造函数\n    super(s);\n}\n}\n```\n\n### 示例 2：\n\n\
  ```java\npublic class DuplicateEntityException extends RuntimeException {\n    private\
  \ static final long serialVersionUID = 1L;\n    private int code;\n\n    public\
  \ DuplicateEntityException(int code, String msg) { \n        super(msg);\n     \
  \   this.setCode(code);\n    }\n\n    public DuplicateEntityException(String message,\
  \ Throwable cause) { \n        super(message, cause);\n    }\n\n    public int getCode()\
  \ {\n        return code;\n    }\n\n    public void setCode(int code) { \n     \
  \   this.code = code;\n    }\n}\n```\n\n#### `InvalidUserNameException` 包 `org.example.exception;`\n\
  \n```java\npackage org.example.exception;\npublic class InvalidUserNameException\
  \ extends Exception{\n    private static final long serialVersionUID = 1L; \n  \
  \  private int code;\n\n    public InvalidUserNameException(int code, String msg)\
  \ { \n        super(msg);\n        this.setCode(code);\n    }\n\n    public InvalidUserNameException(String\
  \ message, Throwable cause) { \n        super(message, cause);\n    }\n\n    public\
  \ int getCode() {\n        return code;\n    }\n\n    public void setCode(int code)\
  \ {\n        this.code = code;\n    }\n}\n```\n\n### 让我们创建一个方法并从代码中抛出 `InvalidUserNameException`\n\
  \n```java\npackage org.example.exception; \npublic class FileDemo {\n\n    public\
  \ static boolean validateUserName(String userName) throws InvalidUserNameException\
  \ {\n        if (!userName.equalsIgnoreCase(\"Raj\")){\n            throw new InvalidUserNameException(400,\"\
  User Name is not valid\");\n        }\n        return true;\n    }\n\n    public\
  \ static void main(String[] args) throws InvalidUserNameException {\n        String\
  \ yourUsername=\"Mahesh\";\n        Boolean isUsernameValid=validateUserName(yourUsername);\n\
  \        System.out.println(\" isUsernameValid : \"+isUsernameValid);\n    }\n}\n\
  ```\n\n如你在上面的代码所示，我们正如下所示使用 `validateUserName(..)` 方法来验证用户。\n\n```java\nBoolean\
  \ isUsernameValid=validateUserName(yourUsername);\n```\n\n如果你查看此方法的声明，你可以看到如果用户名根据我们的要求**不是**有效的，我们就会抛出\
  \ `InvalidUserNameException`。`throw new InvalidUserNameException(400,\"User Name\
  \ is not valid\");`\n\n### Java 异常处理：最佳实践\n\n- 仅捕获可以被处理的异常是最佳实践。\n- 在 `catch` 块中不应返回空值而不是处理异常，这会消耗异常并导致错误永久失败且程序崩溃。\n\
  - 不要获取异常类，而要捕获特定的子类。\n- 永远不要在 `finally` 块中抛出异常，因为即使 `try` 块中没有产生任何异常，`finally` 块也会在执行\
  \ `try-catch` 块后抛出异常。\n- 如果你不处理异常，请使用 `finally` 块代替 `catch` 块。\n- 始终使用 `finally`\
  \ 块来关闭使用的资源。\n- 最佳实践始终使用后关闭/终止资源，如果可能，使用 try-with-resources，这样 JVM 会杀死未使用的资源。\n\n\
  ### 数组：Java 中的数组是什么？\n\n\n\n\n\n➔ 它们包含相似数据类型的元素。\n\n ➔ `Java` 中的数组在单个变量中存储多个相同类型的值。\n\
  \n ➔ 数组的元素存储在连续的内存位置上。\n\n ➔ 它们是可以包含固定数量元素的对象，每个元素都有一个用于访问它的索引。\n\n ➔ 我们以前只在声明时提供数组的大小。\n\
  \n ➔ 数组的索引从 0 开始，因此数组的第 1 个元素存储在第 0 个索引处，第 2 个元素存储在第 1 个索引处，依此类推。\n\n![](img/image_rsrc3W1.jpg)\n\
  \n### 语法：\n\n`data_type arrayName[ ];`\n\n`data_type[ ] arrayName;`\n\n### 示例：\n\
  \n`int numbers[]; String names[]; int[] pinCode; Integer dates [];`\n\n![](img/image_rsrc3W2.jpg)\n\
  \n### 数组初始化\n\n一旦声明 `Array`，我们可以简单地对其初始化，或者在声明时直接初始化。\n\n```java\nint arr[]=new\
  \ int[5];\nint numbers[]={1,2,3,4,5,6};\nString names[]={\"Raj\",\"Heera\"};\nFloat\
  \ arrFloat[]=new Float[4];\nint[] anArray = new int[] {1, 2, 3, 4, 5}; //它将包含从索引\
  \ 0 开始的 5 个元素\n```\n\n### 如何从数组中访问值\n\n正如我们所知，`Array` 是相似数据类型元素的索引集合，因此数组的元素可以通过索引访问。数组中的索引从\
  \ 0 开始。`int numbers[]={1,2,3,4,5,6};` 在这里数组中有 6 个元素，索引从 0 开始，所以元素 1 将位于第 0 位置。\n\
  \n我们可以简单地使用索引访问此元素。\n\n`Numbers[0]` 将是 1\n\n第 1 个元素=第 0 位置即值= 1\n\n第 2 个元素=第 1 位置即值=\
  \ 2\n\n第 3 个元素=第 2 位置即值= 3\n\n### 示例：\n\n```java\npackage org.example.arrayDemo;\n\
  \npublic class ArrayTestDemo {\n    public static void main(String[] args) {\n \
  \       int numbers[]={1,2,3,4,5,6};\n        int num1=numbers[0]; //0 索引 \n   \
  \     int num2=numbers[1]; //1 索引\n        System.out.println(\" ## num1 \"+num1);\
  \ \n        System.out.println(\" ## num2 \"+num2); \n    }\n}\n```\n\n结果：\n\n##\
  \ num1 1\n## num2 2\n\n### 注意：\n\n括号之间的数字是我们要访问的数组特定位置。\n\n访问数组元素时，如果传递的索引为负数或超过了最后一个单元，`Java`\
  \ 将抛出 `ArrayIndexOutOfBoundException`。\n\n```java\nint numbers[]={1,2,3,4,5,6};\n\
  ```\n\n这里有 6 个元素，所以索引从 0 开始到 5 `numbers[0]=1`，`numbers[5]=6`。\n\n但如果你尝试 `numbers[6]`\
  \ 或任何更大的索引，你将得到异常 `ArrayIndexOutOfBoundException`。\n\n我们应该注意不要使用负索引，或大于或等于数组大小的索引。\n\
  \n### 遍历数组元素\n\n可以使用索引访问数组元素。\n\n```java\npackage org.example.arrayDemo;\n\npublic\
  \ class ArrayTestDemo {\n    public static void main(String[] args) { \n       \
  \ int numbers[]={1,2,3,4,5,6}; \n        for (int i=0;i<(numbers.length);i++){ \n\
  \            System.out.println(numbers[i]); \n        }\n    }\n}\n```\n\n### 结果：1\
  \ 2 3 4 5 6\n\n更简化的方法：\n\n```java\npackage org.example.arrayDemo;\n\npublic class\
  \ ArrayTestDemo {\n    public static void main(String[] args) {\n        int numbers[]={1,2,3,4,5,6};\
  \ \n        for(int num:numbers){\n            System.out.println(num); \n     \
  \   }\n    }\n}\n```\n\n### 结果：1 2 3 4 5 6\n\n`Java` 提供了内置类来处理数组操作。\n\n### ➔ 你可以使用\
  \ `Arrays`，它是 `java.util` 包的一部分。\n\n ➔ 该类包含用于操作数组的各种方法（如排序和搜索）。该类还包含一个静态工厂，允许数组被视为列表。\n\
  \n让我们看看 `Arrays` 类如何简化数组操作示例：\n\n```java\npackage org.example.arrayDemo;\n\nimport\
  \ java.util.Arrays;\n\npublic class ArrayTestDemo {\n    public static void main(String[]\
  \ args) {\n        int numbers[]={6,2,4,8,4,5,1};\n        Arrays.sort(numbers);\n\
  \        for (int num:numbers){\n            System.out.println(num); \n       \
  \ }\n    }\n}\n```\n\n### 结果：1 2 4 4 5 6 8\n\n有关 `Arrays` 类的工具方法的更多信息，请访问 `Arrays`\
  \ (Java SE 21 & JDK 21)\n\n## 集合 Collection\n\n### ➔ `Java` 中的 `Collection` 是一个提供存储和操作对象组的架构的框架。\n\
  \n ➔ `Java Collections` 可以实现你对数据执行的所有操作，如搜索、排序、插入、处理和删除。\n\n ➔ `Collections` 和数组（arrays）的相似之处在于，它们都持有对象的引用，并且可以作为一个组进行管理。然而，与数组不同，`Collections`\
  \ 在实例化时不需要分配特定的容量。当对象被添加或删除时，`Collections` 的大小可以自动伸缩。\n\n ➔ `Collections` 不能持有 `int`、`long`\
  \ 或 `double` 等原始数据类型。相反，`Collections` 可以持有包装类，如 `Integer`、`Long` 或 `Double`。\n\n\
  `int numbers[]={1,2,3,4,5,6}`\n\n`int numbers[]={1,2,3,4,5,6}`\n\n`int numbers[]={1,2,3,4,5,6}`\n\
  \n`int numbers[]={1,2,3,4,5,6}`\n\n\n\n\n\n\n# 以逆序和自然顺序对集合数据进行排序。\n\n```java\nimport\
  \ java.util.ArrayList;\nimport java.util.Collections;\n\npublic class ArrayTestDemo\
  \ {\n    public static void main(String[] args) {\n        ArrayList<Integer> nums=\
  \ new ArrayList<>();\n        nums.add(11);\n        nums.add(13);\n        nums.add(10);\n\
  \        nums.add(12);\n        System.out.println(\" ## nums :: \"+nums);\n   \
  \     Collections.sort(nums);\n        System.out.println(\"## Natural sorted ::\
  \ \"+nums);\n        Collections.sort(nums,Collections.reverseOrder());\n      \
  \  System.out.println(\"## Reverse sorted :: \"+nums);\n    }\n}\n```\n\n### 运行结果：\n\
  ## `nums :: [11, 13, 10, 12]`\n## `Natural sorted :: [10, 11, 12, 13]`\n## `Reverse\
  \ sorted :: [13, 12, 11, 10]`\n\n## EmployeeDemo.java\n\n```java\npackage org.example;\n\
  \nimport java.util.Objects;\npublic class EmployeeDemo {\n    String name;\n   \
