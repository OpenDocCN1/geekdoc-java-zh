  \ salary=50000}]\n```\n\n## 概念解释\n\n- 正如所见，`groupingBy` 任务有多个重载方法。我们可以根据需要使用任何一个。\n\
  - 以上代码类似于 `grouping` collector 的第二个变体，其中只包含两个参数：`Function` 和 `downstream` 收集器。\n\
  - 但这里有第三个参数，即 `supplier` 函数。我们使用了 `TreeMap::new()` 作为 `Supplier`——这告诉 `groupingBy`\
  \ 收集器在 `TreeMap` 实例中收集分组值。\n- 结果与之前相同，但我们增加了基于 `Map` 键排序数据的额外能力，因为我们在内部使用了 `TreeMap`。这次，结果\
  \ `Map` 的键（部门名称）按字母顺序排列，而这在之前的输出中是不具备的。这种字母排序是因为这次使用了 `TreeMap`，它会自动根据键的自然顺序对 get\
  \ 条目进行排序。\n\n## 代码实现\n\n```java\nimport util.AppUtil;\nimport java.util.List;\n\
  import java.util.Map;\nimport java.util.TreeMap;\nimport java.util.stream.Collectors;\n\
  \npublic class GroupByWithSupplierAndCollector {\n    public static void main(String[]\
  \ args) {\n        List<EmployeeBean> empList = AppUtil.getEmpList();\n        System.out.println(\"\
  ########## Existing Data ############### \"); \n        empList.forEach(System.out::println);\n\
  \n        Map<String,Double> empMap = empList.stream()\n            .collect(Collectors.groupingBy(\n\
  \                EmployeeBean::getCity, \n                TreeMap::new,\n      \
  \          Collectors.averagingInt(EmployeeBean::getSalary)\n            ));\n\n\
  \        System.out.println(\"# MAP Data:: \"+empMap);\n    }\n}\n```\n\n# PartitioningBy\
  \ 概念\n\n## 什么是 Stream 中的 Partitioning？\n\n`partitioningBy` 是用于将数据分为两个部分（基于布尔条件的\
  \ `Predicate`）的收集器。\n\n- 我们有两个重载的 `partitioningBy` 方法：\n    1. `partitioningBy(Predicate<?\
  \ super T> predicate)`\n    2. `partitioningBy(Predicate<? super T> predicate, Collector<?\
  \ super T,A,D> downstream)`\n- `Predicate` 是一个函数接口，接受一个输入并返回一个 `boolean` 结果。\n\n\
  例如，根据薪水是否大于 `70000` 进行分类。薪水大于 `70000` 的员工将进入第一类（`true`），其余的进入第二类（`false`）。\n\n##\
  \ 代码示例\n\n```java\nimport java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\
  \npublic class PartitioningByDemo {\n    public static void main(String[] args)\
  \ {\n        List<EmployeeBean> empList = AppUtil.getEmpList();\n        System.out.println(\"\
  ###### Input Data ######\");\n        empList.forEach(System.out::println);\n\n\
  \        Map<Boolean, List<EmployeeBean>> empMap = empList.stream()\n          \
  \  .collect(Collectors.partitioningBy(x -> x.getSalary() > 70000));\n\n        System.out.println(\"\
  ### Result :: \"+empMap);\n    }\n}\n```\n\n\n\n\n\n```json\n{false=[{name='Raj',\
  \ city='Patna', dept='R&D', desig='SSE', salary=50000}, {name='Mohan', city='Mumbai',\
  \ dept='Software', desig='SE', salary=60000}, {name='Salman', city='Bangalore',\
  \ dept='R&D', desig='Manager', salary=70000}],\ntrue=[{name='Amir', city='Bangalore',\
  \ dept='Gov', desig='Arch', salary=80000}, {name='Dharam', city='Patna', dept='Railway',\
  \ desig='SSE', salary=90000}]}\n```\n\n如上所示，根据输入的谓词（predicate）数据将被划分为两组：`True` 或\
  \ `False`。它将根据给定的谓词对所有集合数据进行验证。\n\n现在让我们来看一个用例，我们想要对分区后的数据执行某些额外任务，例如映射数据。我们可以使用\
  \ `partitioningBy(..)` 的第二种变体来实现这一点。你可以使用任何 `collectors` 类方法，该方法将返回一个 `collectors`\
  \ 实例。\n\n### 查找工资 > 70000 的员工姓名\n在这里我们将使用 `mapping` 方法并将响应映射到 `Employee Name`。\n\
  \n```java\nimport java.util.List;\nimport java.util.Map;\nimport java.util.stream.Collectors;\n\
  \npublic class PartitioningByWithCollectorDemo {\n    public static void main(String[]\
  \ args) {\n        List<EmployeeBean> empList= AppUtil.getEmpList();\n        System.out.println(\"\
  ###### Input Data ######\");\n        empList.forEach(System.out::println);\n\n\
  \        Map<Boolean,List<String>> empMap =empList.stream()\n            .collect(Collectors.partitioningBy(x->x.getSalary()>70000,\n\
  \                Collectors.mapping(EmployeeBean::getName,Collectors.toList())));\n\
  \        System.out.println(\"### Result :: \"+empMap);\n    }\n}\n```\n\n#### 结果:\n\
  ###### Input Data ######\n{name='Raj', city='Patna', dept='R&D', desig='SSE', salary=50000}\
  \ {name='Mohan', city='Mumbai', dept='Software', desig='SE', salary=60000} {name='Salman',\
  \ city='Bangalore', dept='R&D', desig='Manager', salary=70000} {name='Amir', city='Bangalore',\
  \ dept='Gov', desig='Arch', salary=80000} {name='Dharam', city='Patna', dept='Railway',\
  \ desig='SSE', salary=90000}\n\n### Result ::\n{false=[Raj, Mohan, Salman], true=[Amir,\
  \ Dharam]}\n\n```java\nimport java.util.IntSummaryStatistics;\nimport java.util.List;\n\
  import java.util.Map;\nimport java.util.stream.Collectors;\n\npublic class PartitioningByWithCollectorDemo\
  \ {\n    public static void main(String[] args) {\n        List<EmployeeBean> empList=\
  \ AppUtil.getEmpList();\n        System.out.println(\"###### Input Data ######\"\
  );\n        empList.forEach(System.out::println);\n\n        Map<Boolean,Long> empMap1\
  \ =empList.stream()\n            .collect(Collectors.partitioningBy(x->x.getSalary()>70000,\
  \ Collectors.counting()));\n        System.out.println(\"### Count Of Employee ::\
  \ \"+empMap1);\n\n        Map<Boolean,Integer> empMap2 =empList.stream()\n     \
  \       .collect(Collectors.partitioningBy(x->x.getSalary()>70000, Collectors.summingInt(EmployeeBean::getSalary)));\n\
  \        System.out.println(\"### Sum Of Salary :: \"+empMap2);\n\n        Map<Boolean,\
  \ IntSummaryStatistics> empMap3 =empList.stream()\n            .collect(Collectors.partitioningBy(x->x.getSalary()>70000,\
  \ Collectors.summarizingInt(EmployeeBean::getSalary)));\n        System.out.println(\"\
  ### Summery :: \"+empMap3);\n    }\n}\n```\n\n#### 结果:\n###### Input Data ######\n\
  {name='Raj', city='Patna', dept='R&D', desig='SSE', salary=50000} {name='Mohan',\
  \ city='Mumbai', dept='Software', desig='SE', salary=60000} {name='Salman', city='Bangalore',\
  \ dept='R&D', desig='Manager', salary=70000} {name='Amir', city='Bangalore', dept='Gov',\
  \ desig='Arch', salary=80000} {name='Dharam', city='Patna', dept='Railway', desig='SSE',\
  \ salary=90000}\n\n### Result ::\n### Count Of Employee :: {false=3, true=2}\n###\
  \ Sum Of Salary :: {false=180000, true=170000}\n### Summery :: {false=IntSummaryStatistics{count=3,\
  \ sum=180000, min=50000, average=60000.000000, max=70000}, true=IntSummaryStatistics{count=2,\
  \ sum=170000, min=80000, average=85000.000000, max=90000}}\n\n### 联合执行多个 Stream\
  \ 操作\n`teeing(Collector)R1, Collector R2, BiFunction super R1, super R2, ? R)`\n\
  \n`Collectors.teeing()` 方法在 Java 12 中引入，用于对流执行两个独立的收集操作，然后通过指定的 `merge` 函数将结果合并为最终结果。`teeing`\
  \ 适用于我们需要对流执行多个聚合操作的情况。这里是一个关于如何在流中使用 `Collectors.teeing()` 的示例：\n\n```java\nimport\
  \ java.util.function.BiFunction;\nimport java.util.List;\nimport java.util.List;\n\
  import java.util.Map;\nimport java.util.stream.Collectors;\nimport java.util.Arrays;\n\
  import java.util.HashMap;\n\npublic class GroupByT {\n    public static void main(String[]\
  \ args) {\n        List<EmployeeBean> empList= AppUtil.getEmpList();\n        System.out.println(\"\
  ###### Input Data #####\");\n        empList.forEach(System.out::println);\n\n \
  \       Map<String, Double> result = empList.stream()\n            .collect(Collectors.teeing(\n\
  \                Collectors.averagingInt(EmployeeBean::getSalary),\n           \
  \     Collectors.counting(),\n                (avg, count) -> {\n              \
  \      Map<String, Double> map = new HashMap<>();\n                    map.put(\"\
  AverageSalary\", avg);\n                    map.put(\"TotalEmployees\", (double)count);\n\
