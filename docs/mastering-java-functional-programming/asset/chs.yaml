  name\": \"Raj\",\n\"rating\": \"2.5\",\n\"mob\": \"9876500\"\n}\n```\n\n### 模式匹配\
  \ (Pattern Matching)\n\n观察目前 switch 的工作方式，它确实简化了我们以前使用多个 if-else 条件的用例。\n\n下一个逻辑演进是允许模式在\
  \ switch 中匹配值，而不仅仅是常量。你甚至可以编写带返回 Switch case\n\n### switch + instanceof\n\n就像 `if`\
  \ 条件中的 `instanceof` 一样，`switch` case 现在可以检查其值的类型并创建一个作用域内的变量：\n\n此功能的主要目的是通过允许模式出现在\
  \ case 标签中来简化 switch 语句。\n\n这将有助于解决经典 switch 语句的一个主要局限性，即只能对基本数值、字符串和枚举进行 switch。\n\
  \n让我们通过简单的示例来理解：\n\n```java\npublic String getAnimalSound(Animal animal) {\n   \
  \ if (animal == null) {\n        System.out.println(\"Oops! A null animal?\");\n\
  \    } else if (animal instanceof Dog) { Dog dog = (Dog) animal;\n```\n\n\n\n##\
  \ Java 中的 switch 演进\n\n如上面的示例所示，这是 `switch` 语句的一个极佳用例，因为有几个 `if-else` 语句需要简化。但在\
  \ Java 21 之前，case 标签上的类型限制将使我们无法在此处使用 switch，但现在这部分代码可以像下面一样简化。\n\n```java\npublic\
  \ String getAnimalSound(Animal animal) {\n    if (animal instanceof Cat) {\n   \
  \     Cat cat = (Cat) animal;\n        return cat.meow();\n    } else if (animal\
  \ instanceof Bird) {\n        Bird bird = (Bird) animal;\n        return bird.chirp();\n\
  \    } else if (animal instanceof Dog) {\n        Dog dog = (Dog) animal;\n    \
  \    return dog.bark();\n    }\n    return \"unknown\";\n}\n```\n\n重构后的版本：\n\n```java\n\
  public String getAnimalSound(Animal animal) {\n    return switch (animal) {\n  \
  \      case Cat cat -> cat.meow();\n        case Bird bird -> bird.chirp();\n  \
  \      case Dog dog -> dog.bark();\n        default -> \"unknown\";\n    };\n}\n\
  ```\n\n## 另一个增强：对 null 进行 switch 的能力\n\n以前，`null` 检查必须在 switch 语句外部处理。在 switch 内部处理\
  \ `null` 情况使得我们的代码更安全、更干净、更简洁。我们已经在后面的章节中讨论过从 Java 7 到 Java 20 的 switch 演进。\n\n\
  有了 Java 21，`switch`终于允许包含 `case null`：\n\n```java\nstatic String asStringValue(Object\
  \ anyValue) {\n    return switch (anyValue) {\n        case null -> \"n/a\";\n \
  \       case String str -> str;\n    };\n}\n```\n\n### switch + null\n\n示例：\n\n\
  **Java 21 之前：**\n```java\nstatic void testFooBar(String s) {\n    if (s == null)\
  \ {\n        System.out.println(\"Oops!\");\n        return;\n    }\n    switch\
  \ (s) {\n        case \"Foo\", \"Bar\" -> System.out.println(\"Great\");\n     \
  \   default -> System.out.println(\"Ok\");\n    }\n}\n```\n\n**从 Java 21 开始：**\n\
  ```java\nstatic void testFooBar(String s) {\n    switch (s) {\n        case null\
  \ -> System.out.println(\"Oops\");\n        case \"Foo\", \"Bar\" -> System.out.println(\"\
  Great\");\n        default -> System.out.println(\"Ok\");\n    }\n}\n```\n\n**Java\
  \ 21 之前：**\n```java\nstatic void testString(String response) {\n    switch (response)\
  \ {\n        case null -> { }\n        case String s -> {\n            if (s.equalsIgnoreCase(\"\
  YES\")) {\n                System.out.println(\"You got it\");\n            } else\
  \ if (s.equalsIgnoreCase(\"NO\")) {\n                System.out.println(\"Shame\"\
  );\n            } else {\n                System.out.println(\"Sorry?\");\n    \
  \        }\n        }\n    }\n}\n```\n\n**从 Java 21 开始：**\n```java\nstatic void\
  \ testString(String response) {\n    switch (response) {\n        case null -> {\
