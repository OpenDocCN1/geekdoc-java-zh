  \ getSalary() { return salary; }\n    public void setSalary(Integer salary) { this.salary\
  \ = salary; }\n\n    @Override\n    public boolean equals(Object o) {\n        if\
  \ (this == o) return true;\n        if (o == null || getClass() != o.getClass())\
  \ return false;\n        EmployeeBean bean = (EmployeeBean) o;\n        return Objects.equals(name,\
  \ bean.name) &&\n                Objects.equals(city, bean.city) &&\n          \
  \      Objects.equals(dept, bean.dept) &&\n                Objects.equals(desig,\
  \ bean.desig) &&\n                Objects.equals(salary, bean.salary);\n    }\n\n\
  \    @Override\n    public int hashCode() {\n        return Objects.hash(name, city,\
  \ dept, desig, salary);\n    }\n\n    @Override\n    public String toString() {\n\
  \        return \"EmployeeBean{\" + \"name='\" + name + '\\'' + \", city='\" + city\
  \ + '\\'' + \", dept='\" + dept + '\\'' + \", desig='\" + desig + '\\'' + \", salary=\"\
  \ + salary + '}';\n    }\n}\n```\n\n#### 提供员工数据的 Employee Utility：\n```java\nimport\
  \ java.util.List;\n\npublic class EmployeeUtility {\n    public static List<EmployeeBean>\
