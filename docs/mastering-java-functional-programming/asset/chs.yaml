  \n## 我们接下来将涵盖哪些内容！！\n\n- `Class`（类）\n- `Object`（对象）\n- `Method`（方法）\n- `Access Modifier`（访问修饰符）\n\
  - OOP 概念\n\n## 什么是类 (Class)？\n\n将 Java 中的类想象成一个制作某东西的蓝图。假设你想制作一个玩具机器人。蓝图（`class`）告诉你是机器人长什么样，它能做什么（比如行走或说话），以及它的行为如何。它就像是构建和使用机器人的说明书。\n\
  \n在 Java 中，类是你定义对象可以做什么以及它存储什么信息的地方。它是整齐组织代码的一种，并创建许多工作方式相似但内部数据可能不同的对象。\n\n正如你在上面的图片所示，`BOX`\
  \ 具有各种元素，如 `Circle`（圆形）、`Square`（正方形）、`Rectangle`（矩形）和 `Triangle`（三角形）。所有这些元素都是某种\
  \ `TYPE`（类型），而这个 `TYPE` 就是 `Shape`（形状），我们将这个 `SHAPE` 称为一个类。\n\n在 Java 中，类是创建对象的蓝图或模板。对象是类的实例，类定义了对象将具有的属性和行为。\n\
  \n![](img/image_rsrc3UD.jpg)\n\n### 让我们通过另一个例子来理解。\n\n我们有两个对象，第一个是 `Basic Phone`（基础手机），用于通话。\n\
  \n另一个是 `smartPhone`（智能手机），它具有语音通话、视频通话、WhatsApp 通话的能力，用户还可以访问互联网。\n\n这些对象中的每一个都有一些属性，如\
  \ `length`、`width`、`price`、`name` 等，这两个对象/手机都有一些动作。\n\n![](img/image_rsrc3UE.jpg)\
  \ 这些属性在面向对象编程中被称为属性，动作被称为 `method`（方法）。\n\n属性提供了关于对象的信息，而方法执行某些动作来完成某些任务。在 Java\
  \ 中，类作为创建对象的蓝图或模板。你可以这样想象：当你盖房子时，你遵循一套计划（蓝图），这些计划描述了房子应该如何建造。同样，类定义了对象的结构和行为。\n\n\
  ### 以下是关于 Java 类的关键点：\n\n1. **属性 (Properties)**：类定义了属性（也称为属性或字段）。这些属性代表与对象相关的数据。例如，如果我们有一个\
  \ `Car`（汽车）类，它的属性可能包括 `color`（颜色）、`make`（品牌）和 `model`（型号）等。\n2. **方法 (Behavior)**：类还包含方法。方法就像对象可以执行的动作。例如，`Car`\
  \ 类可能有如 `startEngine()`（启动引擎）和 `brake()`（刹车）等方法。这些方法定义了汽车可以做什么。\n3. **创建对象**：一旦你定义了类，就可以从它创建对象。对象是类的实例。回到我们的\
  \ `Car` 例子，你可以根据 `Car` 类蓝图创建个的汽车（对象）。\n\n## 什么是对象 (Object)\n\n想象你有一个制作玩具机器人的蓝图。蓝图（`class`）告诉你是如何构建机器人、它长什么样以及它能做什么。现在，当你按照该蓝图构建机器人时，你得到的就是一个对象。\n\
  \n在 Java 中，对象就像是你根据蓝图（`class`）构建的真实玩具机器人。它是一个真实的实体，具有特定的特征，并可以根据蓝图定义执行动作。\n\n###\
  \ 关键点：\n\n1. **蓝图 (Class)**：定义了对象将是什么以及它可以做什么。\n2. **特征**：对象拥有属性（如 `color`、`size`、`price`、`shape`\
  \ 或任何其他属性）和行为（如 `walk`、`talk`、`play` 或任何活动）。\n3. **用途**：对象用于表示 Java 程序中的现实世界事物或概念。\n\
  \n### 让我们用例子来简化：\n\n仔细观察下面的图片，你可以看到我们有一个 `BOX`（盒子）。这个 `BOX` 里面满了各种形状，如 `Circle`、`Square`、`Rectangle`\
  \ 和 `Triangle`。\n\n![](img/image_rsrc3UF.jpg)\n\n### 对象是面向对象编程方法的基本单元。\n\n它是任何具有属性和动作的现实世界事物。\n\
  \n**属性 (Properties)**：对象拥有描述它们的属性。如你上面所示，`Length`（长度）、`Width`（宽度）和 `Radius`（半径）是定义对象的属性。\n\
  \n**方法 (Action/Behaviors)**：对象可以执行动作或行为。正如你在下面的图片所示，`Circle` 可以 `Roll`（滚动），`Rectangle`\
  \ 可以在表面 `slide`（滑动）。这些只是这些形状对象可以执行的动作，我们在 Java 编程中称之为 `method`（方法）。\n\n![](img/image_rsrc3UG.jpg)\
  \ 希望你已经理解了类和对象的概念。\n\n现在我们将学习如何使用类和方法编写代码。\n\n## 变量 (Variable)\n\n变量是一个容器，在执行期间持有值或对对象的引用。变量用于在程序中存储和处理数据。\n\
  \n每个变量都有一个数据类型，该类型定义了它可以持有的数据种类（如数字、字符或对象）。\n\n**如何声明变量：**\n\n![](img/image_rsrc3UH.jpg)\
  \ 要创建一个类，你使用 `class` 关键字后跟类名。类名应该始终以大写字母开头。\n\n例如：\n\n![](img/image_rsrc3UJ.jpg)\n\
  \n## 为类创建对象\n\n要创建一个对象（`Car` 类的实例），使用 `new` 关键字后跟类名和括号。\n\n例如：\n```java\nCar myCar\
  \ = new Car();\n```\n\n### 访问属性和方法\n\n你现在可以使用点运算符 `.` 访问类的属性和方法。\n\n```java\nmyCar.color\
  \ = \"Red\"; // 设置颜色\nmyCar.startEngine(); // 启动引擎\n```\n\n## 关于方法的了解\n\n- 什么是方法？\n\
  - 它是做什么的？\n- 如何创建方法？\n- 方法的类型。\n- 如何调用方法？\n\n### 方法\n\n想象你有一套制作明治的指令。你想你想时遵循这些指令制作明治。在\
  \ Java 中，方法是执行特定任务的指令集。\n\n**关键点：**\n\n1. **定义**：方法是执行特定任务的代码块。它定义在 `class` 内部。\n\
  2. **目的**：方法用于将代码组织成可用的块，使程序更容易理解和维护。\n3. **组件**：方法有一个名称、返回类型（返回什么，如果有）、参数（可以接受输入）和方法体（执行的指令）。\n\
  \n### 方法的命名规范：\n\n以下是 Java 方法的命名规范：\n\n1. **方法名**：\n   - 应以小写字母开头。\n   - 多单词使用 `camelCase`（驼峰命名），每个后续单词的首字母大写。例如：`calculateSum`、`printMessage`、`getUserInfo`。\n\
  2. **避免划线**：除非遵循广泛接受的规范（如 getter 和 setter），否则不要在方法名中使用划线。\n3. **动词使用**：方法名通常使用动词或动词短语来描述执行的动作。例如：`calculate`、`print`、`validate`。\n\
  4. **描述性**：选择能够清晰指示方法目的意义名称。\n   - 避免过度缩写或晦涩的名称。例如：如果 `calculateTotalPrice` 准确描述了方法所的功能，请使用\
  \ `calculateTotalPrice` 而不是 `calcPrice`。\n\n**语法：**\n\n```java\nmodifier return_type\
  \ methodName() // 带参数\n```\n\n例如：\n```java\npublic int getRollNo(); // 这个方法将返回某些值\n\
  ```\n\n例如：\n```java\npublic void getRollNo() // 不返回任何值\n```\n\n```java\nmodifier\
  \ return_type methodName(ParameterType1 parameterName1,ParameterType2 parameterName2\
  \ ...)\n```\n\n\n\n\n\n### 示例：\n\n`public int getSum(int a,int b)`\n\n### 该方法的作用是什么？\n\
  \n➔ 方法可以向调用者返回某些值 ➔ 方法可能不向调用者返回值 ➔ 方法可以执行特定任务 ➔ 方法可以被任何方法或代码块调用。\n\n让我们考虑一个用例，众所周知，方法是一个根据需要执行某些特定任务的代码块。\n\
  \n## 用例：编写一个将两个数字相加的方法\n\n让我们思考，如果你想相加两个数字，我们需要什么。输入：我们需要两个数字（`Integer`）。\n\n假设，`number1=10`\
  \ 且 `number2=20;`。\n\n让我们看看我们如何声明并初始化这两个存储这些值的变量。\n\n`int number1=10; int number2=20;`\n\
  \n由于我们需要相加两个数字并获得和作为结果，我们将编写一个返回整数类型和的方法。\n\n### 方法体：无方法参数\n\n```\npublic int getSumOfTwoNumbers(){\
  \ \n    int number1=10;\n    int number2=20;\n    int sum=0;\n    sum=number1+number2;\n\
  \    return sum;\n}\n```\n\n### 方法体：带方法参数\n\n```\npublic int getSumOfTwoNumbersWithArgs(int\
  \ number1,int number2){ \n    int sum=0;\n    sum=number1+number2;\n    return sum;\n\
  }\n```\n\n### 如何调用方法？\n\n### 静态方法：可以直接紧跟类名调用。\n\n示例：`class_Name.methodName(method\
  \ arguments)`\n\n```\npublic class SumDemo {\n    public static int addTwoNumbers(){\n\
  \        System.out.println(\"addTwoNumbers method is called\"); \n        int number1=10;\n\
  \        int number2=20;\n        int sum=0;\n        sum=number1+number2;\n   \
  \     return sum;\n    }\n\n    public static void main(String[] args) { \n    \
  \    System.out.println(\"Add two Numbers ##\");\n        int sumOfNums=addTwoNumbers();\n\
  \        System.out.println(\"#### SUM :: \"+sumOfNums); \n    }\n}\n```\n\n**结果：**\n\
  Add two Numbers ##\naddTwoNumbers method is called. #### SUM :: 30\n\n### 非静态方法：可以直接紧跟类名调用。\n\
  \n```\npublic class SumDemo {\n    public int addTwoNumbers(){\n        System.out.println(\"\
  #addTwoNumbers method is called\"); \n        int number1=10;\n        int number2=20;\n\
  \        int sum=0;\n        sum=number1+number2;\n        return sum;\n    }\n\n\
  \    public static void main(String[] args) { \n        System.out.println(\"#Add\
  \ two Numbers #\");\n        SumDemo sumDemo= new SumDemo();\n        int sumOfNums=sumDemo.addTwoNumbers();\
  \ \n        System.out.println(\"# SUM :: \"+sumOfNums);\n    }\n}\n```\n**结果：**\n\
  # #Add two Numbers # #addTwoNumbers method is called.adding 2 numbers.. # SUM ::\
  \ 30\n\n### 方法类型\n\n### 静态方法：\n\n● 属于类，而不属于任何特定的实例。● 可以在不类实例的情况下调用。● 只能直接访问静态变量和其他静态方法。●\
  \ 无法直接访问实例变量或实例方法。\n\n```java\nclass MathOperations {\n    // 静态方法 \n    static\
  \ int add(int a, int b) { return a + b; } \n}\n```\n\n## 如何调用静态方法？\n\n### 静态方法：在类本身上调用。使用\
  \ `ClassName.methodName()`。\n\n## 例如：`className.methodName()`\n\n### `MathOperations.add(11,12)`\n\
  \n```java\npublic class AddTwoNumbers {\n    public static void addTwoNum(){\n \
  \       int num1=12;\n        int num2=10;\n        int sum=num1+num2;\n       \
  \ System.out.println(\"SUM :\"+sum);\n    }\n\n    public static void main(String[]\
  \ args) {\n        AddTwoNumbers.addTwoNum();\n    }\n}\n```\n**结果：** SUM : 22\n\
  \n## 为了理解 Java 中的方法，让我们来考虑一些用例：\n\n### 用例 1：编写一个不返回任何值的方法\n\n```java\npublic class\
  \ MethodTypeVoidDemo { \n    public void hello(){\n        System.out.println(\"\
  #Welcome\"); \n    }\n}\n```\n\n### 用例 1：编写一个返回某些值的方法\n\n```java\npublic class MethodReturnValueDemo\
  \ { \n    public int getNumber1(){ \n        int num=10;\n        return num;\n\
  \    }\n\n    public int getNumber2(){ \n        int num=10;\n        return num;\n\
  \    }\n\n    public int getNumber3(){ \n        int num1=10;\n        int num2=10;\n\
  \        int sum=num1+num2; \n        return sum;\n    }\n\n    public static void\
  \ main(String[] args) {\n        MethodReturnValueDemo obj=new MethodReturnValueDemo();\n\
  \        int num1=obj.getNumber1(); \n        int num2=obj.getNumber2(); \n    \
  \    int num3=obj.getNumber3();\n        System.out.println(\"Num 1 \"+num1); \n\
  \        System.out.println(\"Num 2 \"+num2); \n        System.out.println(\"Num\
  \ 3 \"+num3);\n    }\n}\n```\n**结果：**\nNum 1 : 10\nNum 2 : 10\nNum 3 : 20\n\n###\
  \ 解释：\n\n此程序演示了如何在 Java 中创建和使用返回值的方法。它定义了一个名为 `MethodReturnValueDemo` 的类，其中包含三个返回整数的方法（`getNumber1`、`getNumber2`\
  \ 和 `getNumber3`）。然后它在 `main` 方法中使用这些方法来打印结果。\n\n### 详细解释\n\n### 类定义\n`public class\
  \ MethodReturnValueDemo {`\n\n● `public class MethodReturnValueDemo`: 这一行声明了一个名为\
  \ `MethodReturnValueDemo` 的公共类。● 类是创建对象的蓝图。\n\n#### 方法定义\n`public class MethodReturnValueDemo\
  \ {`\n\n● `public class MethodReturnValueDemo`: 这一行声明了一个名为 `MethodReturnValueDemo`\
  \ 的公共类。● 类是创建对象的蓝图。\n\n方法定义\n`public int getNumber1()`\n`int num=10;`\n`return num;`\n\
  \n方法：\n`public int getNumber1()`\n`int num=10;`\n`return num;`\n\n方法：\n`public int\
  \ getNumber2()`\n`int num=10;`\n`return num;`\n\n方法：\n`public int getNumber3()`\n\
  `int num1=10;`\n`int num2=10;`\n`int sum=num1+num2;`\n`return sum;`\n\n主方法\n`public\
  \ static void main(String[] args) {`\n`MethodReturnValueDemo obj= new MethodReturnValueDemo();`\n\
  \n调用方法并打印结果\n`int num1=obj.getNumber1();`\n`int num2=obj.getNumber2();`\n`int num3=obj.getNumber3();`\n\
  \n总结：\n1. 类：`MethodReturnValueDemo` 定义了返回整数的方法。\n2. 方法：○ `getNumber1` 返回 10。○ `getNumber2`\
  \ 返回 10。○ `getNumber3` 返回 10 和 10 之和（即 20）。\n3. 主方法：创建类的对象并调用方法打印它们的返回值。\n\n###\
  \ 用例 3：编写静态方法，静态方法不需要对象即可调用。\n\n```java\npackage playwithjava.in;\n\npublic class\
  \ StaticMethodReturnValueDemo {\n    public static int getNumber1(){ \n        int\
  \ num=10;\n        return num;\n    }\n\n    public static int getNumber2(){ \n\
  \        int num=10;\n        return num;\n    }\n\n    public static int getNumber3(){\
  \ \n        int num1=10;\n        int num2=10;\n        int sum=num1+num2;\n   \
  \     return sum;\n    }\n\n    public static void main(String[] args) {\n     \
  \   int num1=StaticMethodReturnValueDemo.getNumber1(); \n        int num2=StaticMethodReturnValueDemo.getNumber2();\
  \ \n        int num3=StaticMethodReturnValueDemo.getNumber3();\n        System.out.println(\"\
  Num 1 : \"+num1); \n        System.out.println(\"Num 2 : \"+num2); \n        System.out.println(\"\
  Num 3 : \"+num3);\n    }\n}\n```\n\n\n\n\n\n### 1. 声明\n- `public static int getNumber1()`:\
  \ 此行声明了一个名为 `getNumber1` 的静态方法。\n- `public`: 意味着该方法可以从任何其他类访问。\n- `static`: 意味着该方法属于类本身，而不是该类的任何特定对象。\n\
  - `int`: 这是方法的返回类型，意味着方法将返回一个整数值。\n- `getNumber1()`: 这是方法的名称。\n\n### 2. 方法体\n- `int\
  \ num = 10;`: 在方法内部，声明了一个变量 `num` 并将其赋值为值 `10`。\n- `return num;`: 方法返回 `num` 的值，即\
  \ `10`。\n\n```java\npublic static void main(String[] args) {\n    int num1 = StaticMethodReturnValueDemo.getNumber1();\
  \ \n    System.out.println(\"Num 1 : \" + num1);\n}\n```\n\n### 调用方法\n`int num1\
  \ = StaticMethodReturnValueDemo.getNumber1();`\n\n- `StaticMethodReturnValueDemo`:\
  \ 这是包含静态方法的类名。\n- `.getNumber1()`: 这调用了 `getNumber1` 方法。\n- 由于 `getNumber1` 是静态方法，因此使用类名\
  \ `StaticMethodReturnValueDemo` 来调用，而不是使用类的实例（对象）。\n- 方法返回值 `10`，然后将其赋值给变量 `num1`。\n\
  - **打印结果**：`System.out.println(\"Num 1 : \" + num1);`\n- 此行将 `num1` 的值打印到控制台。\n\
  - 输出为：`Num 1 : 10`\n\n### 总结\n- **静态方法**: `getNumber1` 被定义为静态方法，意味着它属于类 `StaticMethodReturnValueDemo`\
  \ 而不是该类的任何实例。\n- **调用静态方法**: 要调用静态方法 `getNumber1`，你使用类名 `StaticMethodReturnValueDemo`\
  \ 后跟一个点（`.`）和方法名 `getNumber1()`。\n- **返回值**: 方法执行并返回值 `10`，然后该值存储在变量 `num1` 中并打印到控制台。\n\
  \n# 什么是构造函数？\n➔ 构造函数是一种特殊的方法，用于初始化对象。\n➔ 它在使用 `new` 关键字创建对象时被调用。\n➔ 构造函数的主要目的是通过为其实例变量赋值或执行其他必要的设置任务来设置对象的初始状态。\n\
  \n### 关于构造函数的关键点\n1. **与类同名**: 构造函数的名称与类名相同。\n2. **无返回类型**: 与普通方法不同，构造函数没有返回类型（甚至没有\
  \ `void`）。\n3. **自动调用**: 当创建该类的对象时，构造函数会被自动调用。\n\n### 为什么我们需要构造函数？\n想象你正在组装一辆玩具汽车。当你把它从盒子里拿时，你可能需要装上轮子并放入电池才能玩。构造函数就像是让小汽车准备好使用的设置步骤。\n\
  \n### 构造函数示例\n```java\npublic class Employee {\n    //构造函数\n    public Employee()\
  \ {\n        // 你可以在这里添加初始化代码\n    }\n}\n```\n\n```java\npublic class Employee {\
  \ \n    String name;\n    int employeeId;\n\n    public Employee(String name, int\
  \ employeeId) { \n        this.name = name;\n        this.employeeId = employeeId;\n\
  \    }\n}\n```\n\n假设我们有一个类 `Car`。\n\n```java\npublic class Car { \n    String color;\
  \ \n    int speed;\n\n    // 构造函数\n    public Car(String color, int speed) { \n\
  \        this.color = color; \n        this.speed = speed; \n    }\n\n    // 显示汽车详情的方法\n\
  \    public void displayDetails() { \n        System.out.println(\"Color: \" + color);\
  \ \n        System.out.println(\"Speed: \" + speed + \" km/h\"); \n    }\n\n   \
  \ public static void main(String[] args) { \n        // 创建 Car 对象并调用构造函数\n     \
  \   Car myCar = new Car(\"Red\", 120);\n        // 显示汽车的详情\n        myCar.displayDetails();\
  \ \n    } \n}\n```\n\n### 类定义：\n- `public class Car`: 定义了一个名为 `Car` 的类。\n\n### 构造函数：\n\
  - `public Car(String color, int speed)`: 这是构造函数。它接受两个参数：`color` 和 `speed`。\n- `this.color\
  \ = color;`: 将实例变量 `color` 设置为传入的值。\n- `this.speed = speed;`: 将实例变量 `speed` 设置为传入的值。\n\
  \n### 创建对象：\n- `Car myCar = new Car(\"Red\", 120);`: 此行创建了一个名为 `myCar` 的新 `Car`\
  \ 对象。构造函数使用参数 `\"Red\"` 和 `120` 被调用。\n\n### 显示详情：\n- `myCar.displayDetails();`:\
  \ 调用 `myCar` 的 `displayDetails` 方法打印打印详情。\n\n当你运行程序时，它将输出：\n`Color: Red`\n`Speed:\
  \ 120 km/h`\n\n### 总结：\n- 构造函数用于初始化对象的特殊方法。\n- 它与类同名，且没有返回类型。\n- 它在创建对象时被自动调用。\n\
  - 它帮助设置对象的初始状态。\n\n```java\npublic class ConstructorDemo { \n    String name;\n\
  \    int employeeId;\n    double salary;\n\n    public ConstructorDemo() { }\n\n\
  \    public ConstructorDemo(String name) { \n        this.name = name;\n    }\n\n\
  \    public ConstructorDemo(int employeeId) { \n        this.employeeId = employeeId;\n\
  \    }\n\n    public ConstructorDemo(double salary) { \n        this.salary = salary;\n\
  \    }\n\n    public ConstructorDemo(String name, int employeeId) { \n        this.name\
  \ = name;\n        this.employeeId = employeeId;\n    }\n\n    public ConstructorDemo(int\
  \ employeeId, double salary) { \n        this.employeeId = employeeId;\n       \
  \ this.salary = salary;\n    }\n\n    public ConstructorDemo(String name, double\
  \ salary) {\n        this.name = name;\n        this.salary = salary;\n    }\n\n\
  \    public ConstructorDemo(String name, int employeeId, double salary) { \n   \
  \     this.name = name;\n        this.employeeId = employeeId;\n        this.salary\
  \ = salary;\n    }\n\n    public static void main(String[] args) { \n        ConstructorDemo\
  \ defaultObj = new ConstructorDemo();\n        ConstructorDemo nameObj = new ConstructorDemo(\"\
  Raj\");\n        ConstructorDemo idObj = new ConstructorDemo(101);\n        ConstructorDemo\
  \ salObj = new ConstructorDemo(50000.0);\n        ConstructorDemo nameIdObj = new\
  \ ConstructorDemo(\"Raj\", 101);\n        ConstructorDemo idSalObj = new ConstructorDemo(101,\
  \ 50000.0);\n        ConstructorDemo nameSalObj = new ConstructorDemo(\"Raj\", 50000.0);\n\
  \        ConstructorDemo nameIdSalObj = new ConstructorDemo(\"Raj\", 101, 50000.0);\n\
  \    } \n}\n```\n\n\n\n\n如你所见，在上面的代码中我们有一个抽象类 `CalculatorDemo`，它有一个抽象方法 `addTwoNumbers(int\
  \ number1,int number2)`，该方法有 2 个整数类型的参数。该方法没有任何实现。这意味着我们没有在这个方法中添加任何用于相加两个数字的逻辑，我们只是定义了一个规则，即该方法将相加两个数字并返回一个整数类型的结果。\n\
  \n由于我们是为客户端创建了这个方法，并期望他们根据自己的需求提供其实现，且该方法应该返回整数类型的结果，但我们并没有对编写相加两个数字的逻辑设置任何限制。如果任何类继承了\
  \ `CalculatorDemo`get 类，那么该类需要为方法 `addTwoNumbers(int number1,int number2)`提供实现，或者该类应该被声明为“抽象类”。\n\
  \n如果你是 `Java` 的新手，你可能会有这样的问题：如果我们不提供实现，那么创建这个方法的意义是什么？\n\n简单来说，我们可以说：我希望某人根据他们的需求提供这个实现。在这里，我只是一个向客户端暴露此服务并设置一些规则（例如该方法如何被访问以及它应该返回什么值）的权威。这确实有助于让你的代码具有灵活且可重用性。\n\
  \n## 接口 (Interface)\n\n在 `java` 中，`Interface` 是允许我们设计多继承的一种。正如我们所知，`Java` 不支持多继承，但通过接口可以实现。\n\
  \n接口向客户端暴露服务的最佳方式之一，它在 `java` 中提供了一层抽象。它不能像抽象方法那样被实例化。\n\n在 `java 8` 之前，接口中只有抽象方法，但在\
  \ 8 之后的版本中，你还可以拥有默认方法（default methods）和静态方法（static methods）。\n\n简单来说——你可以说接口是在不显示背景细节的情况下暴露服务的方式。接口通过定义一组方法而不指定它们的实现，提供了一层抽象。实现接口的类必须为所有抽象方法提供具体的实现。\n\
  \n### 接口的命名规范\n\n- 接口应该使用 `PascalCasing`（大驼命名法）命名，每个单词的首字母大写。\n- 它应该具有意义，而不是缩写词。\n\
  - 它应该是一个形容词，例如 `Runnable`、`Remote`、`ActionListener`。\n\n### 语法\n\n```java\ninterface\
  \ Interface_Name\n```\n\n### 示例\n\n```java\ninterface EmployeeService\ninterface\
  \ StudentService\n```\n\n如何声明接口：\n```java\npublic interface Interface_Name {\n \
  \   //任何抽象/静态/私有/默认方法 \n}\n```\n\n示例：\n```java\npublic interface StudentService\
  \ { \n    public abstract double getStudentMarks(int studentId); \n    public abstract\
  \ String getStudentAddress(int studentId); \n}\n```\n\n我们可以在接口中有静态方法、私有方法、默认方法和抽象方法。所有方法都有它们自己的目的。作为开发者，你需要知道它们的用途。\n\
  \n让我们创建一个包含所有方法组合的接口：\n\n```java\npublic interface OrganizationService {\n    //\
  \ 抽象方法\n    public abstract String getEmployeeData(int employeeID); \n    public\
  \ double getEmployeeSalary(int employeeId);\n\n    // 默认方法，如果你想为你的方法添加一些默认实现\n \
  \   default String getOrgName(){ \n        return \"XYZ pvt ltd\";\n    } \n\n \
  \   // 添加静态方法\n    public static int getOrgId(){ \n        return 234;\n    } \n\
  \n    // 添加私有方法，供内部使用\n    private String getOrgKey(){ \n        return \"secret-abc\"\
  ;\n    }\n}\n```\n\n## 关于抽象类的关键信息\n\n1. 如果一个类有任何抽象方法，那么该类必须是一个抽象类；但如果一个类是抽象类，并不意味着该类一定有抽象方法。\n\
  2. 抽象类不能被实例化。这意味着不能为该类创建 `Object`。\n3. 如果你不希望别人为你的类创建对象，而你只想向客户端暴露你的服务/方法，那么将该类声明为抽象类是一个很好的做法。\n\
  4. 如果你继承了某个抽象类，那么你不必须实现它的抽象方法。如果你不想实现某些抽象方法，只需将你的类声明为抽象类即可。\n\n让我们创建一个抽象类 `EmployeeService`\
  \ 并如下所示添加一些抽象方法。\n\n![](img/image_rsrc3UM.jpg)\n**用例 1**：继承上面的抽象类 `EmployeeService`\
  \ 且为抽象方法提供实现。\n\n![](img/image_rsrc3UN.jpg)\n正如我们已经看到的，我们需要为抽象方法提供实现，或者需要将类声明为抽象类。在这里我们将类声明为抽象类。\n\
  \n![](img/image_rsrc3UP.jpg)\n**用例 2**：通过子类继承抽象类并实现它的抽象方法。\n\n```java\npublic class\
  \ EmployeeServiceHelper extends EmployeeService{\n    @Override\n    public double\
  \ getEmployeeSalary(int employeeId) {\n        // 你可以添加自己的实现\n        if(employeeId==1){\
  \ \n            return 10000;\n        } \n        if(employeeId==2){ \n       \
  \     return 20000;\n        } else { \n            return 30000;\n        } \n\
  \    }\n\n    @Override\n    public String getEmployeeAddress(int employeeId) {\
  \ \n        // 你可以添加自己的实现\n        if(employeeId==1){\n            return \"Raj\"\
  ;\n        }\n        if(employeeId==2){\n            return \"Syam\";\n       \
  \ }\n        else {\n            return \"Rohan\";\n        }\n    }\n}\n```\n\n\
  **用例 3**：尝试创建抽象类的实例/对象 image_rsrc3UR.jpg)\n\n### 为什么我们不能创建抽象类的对象？\n\n在 `Java` 中，我们不能创建抽象类的对象，因为抽象类可能包含没有实现的抽象方法。抽象类旨在作为其他类的基类，它通常包含由子类实现的非完整或抽象方法。\n\
  \n#### 不完整的实现\n抽象类可能包含没有实现的抽象方法。由于抽象方法缺少实现，因此创建抽象类的对象是不合适的。\n\n#### 强制子类实现\n抽象类被设计供其他类继承。抽象类提供了一个公共结构（包括抽象方法），并期望子类提供这些抽象方法的具体实现。创建抽象类的实例会违反抽象类的约定。\n\
  \n#### 作为蓝图的抽象类\n抽象类通常作为其他类的蓝图或模板。它们封装了通用功能，并为子类的自定义提供了基础。由于抽象类可能缺少完整的实现，因此无法直接实例化。\n\
  \n```java\npublic abstract class Animal {\n    // 抽象方法\n    public abstract void\
  \ makeSound();\n\n    // 具体方法\n    public void sleep() {\n        System.out.println(\"\
  现在睡觉.\");\n    }\n}\n\npublic class Dog extends Animal {\n    // 抽象方法的实现\n    @Override\n\
  \    public void makeSound() {\n        System.out.println(\"汪汪..\");\n    }\n}\n\
  \npublic class Main {\n    public static void main(String[] args) {\n        //\
  \ 不能创建抽象类的对象\n        // Animal animal = new Animal(); // 这行将导致编译错误\n\n        //\
  \ 创建具体子类的对象\n        Animal dog = new Dog();\n        dog.makeSound(); // 调用 Dog\
  \ 类中重写的方法\n        dog.sleep(); // 调用抽象类中的方法\n    }\n}\n```\n\n在这个示例中，`Animal` 是一个抽象类，带有一个抽象方法\
  \ `makeSound()`。你可以创建一个 `Dog` 类型的对象并以多态的方式使用它。这确保了抽象方法在子类中得到了实现。\n\n### 访问修饰符 (Access\
  \ Modifier)\n\n\n\n\n\n访问修饰符是定义程序中类、方法和字段可见性或访问权限的关键字。这些修饰符控制程序的其他类或部分可以访问声明的元素。\n\
  \nJava 有四种主要的访问修饰符：\n\n### public\n\n`public` 修饰符允许类、方法或字段从任何其他类访问。它具有最广泛的范围并允许无限制的访问。\n\
  \n```java\npublic class MyClass {\n    public int publicVariable; \n    public void\
  \ publicMethod() {\n        // 代码\n    }\n}\n```\n\n在上面的示例中，`publicVariable` 和 `publicMethod`\
  \ 可以从任何其他类访问。\n\n### Private (private)\n\n`private` 修饰符将类成员可见性限制在类类内部。它提供了最严格的访问限制。\n\
  \n```java\npublic class MyClass {\n    private int privateVariable; \n    private\
  \ void privateMethod() {\n        // 代码\n    }\n}\n```\n\n在这里，`privateVariable`\
  \ 和 `privateMethod` 只能在 `MyClass` 内部访问。\n\n### Protected (protected)\n\n`protected`\
  \ 修饰符允许在所属包内以及通过子类（即使它们在不同的包中）访问成员。\n\n```java\npublic class MyClass {\n    protected\
  \ int protectedVariable; \n    protected void protectedMethod() {\n        // 代码\n\
  \    }\n}\n```\n\n`protectedVariable` 和 `protectedMethod` 可以被同一包中的类以及子类访问，无论是在同一包还是不同包中。\n\
  \n### Default (包私有，无修饰符)\n\n如果未指定访问修饰符（默认或包私有），该元素可以在其所属包内访问，但不能从包外部访问。\n\n```java\n\
  class MyClass {\n    int defaultVariable; \n    void defaultMethod() {\n       \
  \ // 代码\n    }\n}\n```\n\n在这里，`defaultVariable` 和 `defaultMethod` 可以被同一包内的类访问，但不能被不同包的类访问。根据程序所需的封装和安全级别选择合适的访问修饰符至关重要。使用访问修饰符有助于强制封装、提高代码复用性并防止对代码某些部分的越授权访问。\n\
  \n### Static 关键字\n\n`static` 关键字用于声明属于类本身而非类实例（对象）的成员（变量、方法和嵌套类）。\n\n以下是 `static`\
  \ 在变量和方法中的工作原理：\n\n### 静态变量\n\n- **定义**：当变量被声明为 `static` 时，意味着该变量在类的所有实例（对象）之间共享唯一的副本。\n\
  - **访问**：使用类名本身访问静态变量，而不是通过类的实例。\n- **初始化**：静态变量只在执行开始时初始化一次，在创建任何类的对象之前。\n- **作用范围**：它们在整个程序运行期间都存在。\n\
  - **用法**：常用于常量 (`final static`) 或需要在类的所有实例间共享的变量。\n\n```java\nclass Example {\n\
  \    static int count = 0; \n    public Example() {\n        count++;\n    }\n \
  \   public static void main(String[] args) {\n        Example obj1 = new Example();\n\
  \        Example obj2 = new Example();\n        System.out.println(\"Number of objects:\
  \ \" + Example.count); // 输出: 2\n    }\n}\n```\n\n### 静态方法\n\n- **定义**：当方法被声明为 `static`\
  \ 时，它属于类本身而非类的实例。\n- **访问**：使用类名本身调用静态方法，而不是通过类的实例。\n- **限制**：静态方法无法直接访问非静态变量或方法。\n\
  \n```java\nclass MathUtils {\n    static int factorial(int n) {\n        return\
  \ n * n;\n    }\n    public static void main(String[] args) {\n        System.out.println(\"\
  Result: \" + MathUtils.factorial(5)); // 输出: 25\n    }\n}\n```\n\n\n\n\n\n### 多重继承\n\
  \n一个类继承多个类。注意：`Java` 不支持多重继承。\n\n![](img/image_rsrc3UV.jpg)\n\n如你上方所示，`Class C`\
  \ 继承了两个类 `Class A` 和 `Class B` 的行为，这在 `Java` 中是不支持的。一个类只能继承一个类，但它可以实现任意数量的继承（接口）。我们将在本节稍后详细介绍。\n\
  \n### 多级继承\n\n一个类可以继承一个派生类。因此，派生类成为新类的基类。\n\n如你在此，一个类可以从不同层级的类继承行为。当我们寻找类的层次结构时，曾使用这种继承，即一个类只继承一个类。\n\
  \n![](img/image_rsrc3UW.jpg)\n\n如你在此，`Class B` 继承了类 `A` 的行为，`Class C` 继承了类 `B` 的行为，你可以根据需求添加更多。我们将继续在不同级别添加不同的行为，子类将拥有所有父类中可用的行为。\n\
  \n在上面的示例中，`Class B` 将继承类 `A` 的行为，而 `Class C` 将继承类 `Class B` 和 `A` 的行为。\n\n### 层级继承\n\
  \n一个类被许多其他子类继承。![](img/image_rsrc3UX.jpg) 如你在此，`Shape` 是此处的父类，它有 3 个子类 `Triangle`、`Circle`\
  \ 和 `Rectangle`。让我们通过示例来理解继承。\n\n```java\npublic interface OrganizationService {\n\
  \    public abstract String getEmployeeData(int employeeID);\n    public double\
  \ getEmployeeSalary(int employeeId);\n    //默认方法，如果你想为方法添加某些默认实现\n    default String\
  \ getOrgName(){\n        return \"XYZ pvt ltd\";\n    }\n    //添加静态方法\n    public\
  \ static int getOrgId(){\n        return 234;\n    }\n    //添加私有方法，供内部使用\n    private\
  \ String getOrgKey(){\n        return \"secret-abc\";\n    }\n}\n```\n\n创建一个 `OrganizationServiceImpl`\
  \ 的对象并调用这些方法。\n\n```java\npublic class OrganizationDemo {\n    public static void\
  \ main(String[] args) {\n        OrganizationService organizationService=new OrganizationServiceImpl();\n\
  \        String orgName= organizationService.getOrgName();\n        String empData=\
  \ organizationService.getEmployeeData(1);\n        double salary=organizationService.getEmployeeSalary(2);\n\
  \        System.out.println(orgName);\n        System.out.println(empData);\n  \
  \      System.out.println(salary);\n    }\n}\n```\n\n### 结果:\n\n```\nXYZ pvt ltd\
  \ Raj\n10000.0\n```\n\n### 抽象\n\n`Java` 中的抽象是一个概念，通过对问题进行合适的类建模，并通过处理这些模型而不是实现细节来简化复杂系统。它就像关注对象“做什么”而不是它“如何去做”。这有助于通过向用户隐藏不必要的细节并只暴露核心功能来管理复杂性。\n\
  \n想象你正在使用手机智能手机。你知道按下拨号按钮可以让你拨打电话，但你不需要知道手机内部如何连接到网络、处理信号等。复杂性对你隐藏了，你只看到允许你拨打电话的必要功能。这就是抽象。\n\
  \n### Java 抽象的关键点\n\n1. **隐藏实现细节**：\n   - 你使用方法来执行操作，而无需了解这些方法的内部工作原理。\n   - 只有本质细节是可见，而内部复杂性被隐藏了。\n\
  2. **抽象类和接口**：\n   - `Java` 两种实现抽象的方法：抽象类和接口。\n\n`Java` 中的抽象通过只暴露对象的必要功能并隐藏实现细节来帮助管理复杂性。它是通过抽象类和接口实现的，允许你关注对象做什么而不是如何去做。这个概念使得你的代码更整洁、模块化且更容易维护。\n\
  \n### 抽象类\n\n抽象类是一种无法单独实例化的类，旨在供其他类作为子类。我们已经在在本节稍早之前详细讨论过它。\n\n示例：\n\n```java\n\
  public abstract class Shape {\n    // 抽象方法（由子类实现）\n    public abstract double calculateArea();\n\
  \    // 具体方法\n    public void display() {\n        System.out.println(\"This is\
  \ a shape.\");\n    }\n}\n```\n\n### 抽象方法\n\n抽象方法声明在抽象类或接口中，不在声明的类或接口中提供实现。它们定义了一个合约，具体的子类或实现类必须通过提供自己的实现来履行该合约。\n\
  \n### 接口\n\n接口是实现抽象的另一种方式。它们由抽象方法（以及从 `Java 8` 开始的默认和静态方法）组成。类可以实现多个接口，允许它继承多个抽象方法。\n\
  \n示例：\n\n```java\npublic interface Sound {\n    // 抽象方法\n    void makeSound();\n\
  }\n```\n\n### 隐藏实现细节\n\n抽象有助于隐藏类或方法实现其功能的内部细节。它允许类或接口的用户与核心功能进行交互，而无需了解实现的复杂性。\n\
  \n### 关注相关细节\n\n抽象允许开发者关注类或系统的相关细节，而忽略不必要的复杂性。这使得代码更具模块化、可维护且更容易理解。\n\n### 方法签名\n\
  \n方法签名由方法名和参数类型组成![](img/image_rsrc3UY.jpg)\n\n- `return type` 不是方法签名的一部分。\n- 在\
  \ `Java` 中，同一个类中不允许存在两个相同签名的方法![](img/image_rsrc3UZ.jpg)\n\n### 多态性\n\n多态源于两个希腊语：`poly`\
  \ 和 `morphs`。“poly” 的意思是多，“morphs” 的意思是形式。因此，多态意味着许多形式。\n\n`Java` 中的多态性是一个概念，通过它我们可以以不同的方式执行单一操作。它指的是类呈现多种形式的能力。`Java`\
  \ 中有两种多态：编译时多态（静态多态）和运行时多态（动态多态）。\n\n### 编译时多态（方法重载）\n\n- 方法重载允许一个类拥有多个同名但参数不同的方法（类型不同或参数数量不同）。\n\
  - 编译器在编译期间根据方法签名确定调用哪个方法。\n- 如果一个类有多个具有相同名称但参数不同的方法，则被称为方法重载。\n- 如果我们只需要执行一个操作，使用相同的方法名可以增加程序的可读性。\n\
  - 在 `java` 中，多个方法可以具有相同的名称和返回值，但参数数量或参数类型不同。\n\n假设你想对数字进行加法运算，你可以拥有下面的一些示例方法。\n\n\
  方法重载的示例：不同类型的参数：\n\n```java\npublic int printNumbers(int number1)\npublic int printNumbers(float\
  \ number1)\npublic int printNumbers(double number1)\npublic int printNumbers(long\
  \ number1)\n\npublic int addNumbers(int number1,int number2)\npublic int addNumbers(float\
  \ number1,int number2)\npublic int addNumbers(float number1,float number2)\npublic\
  \ int addNumbers(long number1,long number2)\npublic int addNumbers(double number1,double\
  \ number2)\n```\n\n不同参数数量：\n\n```java\npublic int addNumbers(int number1,int number2,int\
  \ number3)\npublic int addNumbers(int number1,int number2,int number3,int number4)\n\
  ```\n\n示例：\n\n```java\npublic class NumbersCalculatorDemo {\n    public long addNumbers(int\
  \ number1,int number2){\n        int sum=number1+number2;\n        return sum;\n\
  \    }\n\n    public long addNumbers(long number1,long number2){\n        long sum=number1+number2;\n\
  \        return sum;\n    }\n\n    public long addNumbers(long number1,long number2,long\
  \ number3){\n        long sum=number1+number2+number3;\n        return sum;\n  \
  \  }\n}\n```\n\n\n\n\n\n```java\n} public static void main(String[] args) {\n\n\
  \    NumbersCalculatorDemo calculatorDemo=new NumbersCalculatorDemo();\n\n    long\
  \ sum1= calculatorDemo.addNumbers(10,20); \n    long sum2= calculatorDemo.addNumbers(10l,20l);\
  \ \n    long sum3= calculatorDemo.addNumbers(10,20,30);\n\n    System. out.println(\"\
  ## Sum 1:\"+sum1); \n    System.out.println(\"## Sum 2:\"+sum2); \n    System.out.println(\"\
  ## Sum 3:\"+sum3);\n\n} }\n```\n\n结果:\n## Sum 1:30\n## Sum 2:30\n## Sum 3:60\n\n\
  ## 示例 2\n\n方法重载的主要目的是让你的服务更加灵活，以便客户端可以使用不同的可能的方法参数使用你的服务/方法。\n\n客户端可以使用不同的可能的方法参数来调用同一个方法。这将帮助客户获得更好的体验。\n\
  \n当我们向任何第三方客户端提供服务时，我们通常会为客户提供重载方法以获得更好的体验。\n\n即使是 Java，内置方法也使用了这一特性。\n\n正如我们在这里看到的，`println(..)`\
  \ 是 `java` 中 `PrintStream` 类中的方法，用于将值打印到控制台。\n\n我们可以看到该方法是一个重载方法，它期望不同类型的方法参数。\n\
  \n![](img/image_rsrc3V0.jpg)\n\n欲了解更多，请查看下面的代码。\n\n我们有一个方法 `method1(..)`，它是一个重载方法并接受\
  \ `int`、`float`、`double` 和 `long` 等参数。\n\n当某人调用此方法时，将根据提供的值数据类型调用该方法。在这里 `overloadingDemo.method1(11f)`，我们在调用此方法时提供了\
  \ `float` 值，编译器会检测到它并使用相同的参数类型调用该方法。\n\n```java\npublic void method1(float number1){\n\
  \n    System.out.println(\"#### method1 with arg type : float\"); \n} \npublic class\
  \ MethodOverloadingDemo { \n    public void method1(int number1){\n\n    System.\
  \ out.println(\"#### method1 with arg type : int\"); }\n\n    public void method1(float\
  \ number1){\n\n    System.out.println(\"#### method1 with arg type : float\"); }\
  \ \n    public void method1(double number1){\n\n    System.out.println(\"#### method1\
  \ with arg type : double\"); } \n    public void method1(long number1){\n\n    System.out.println(\"\
  #### method1 with arg type : long\"); } \n    public static void main(String[] args)\
  \ {\n\n        MethodOverloadingDemo overloadingDemo=new MethodOverloadingDemo();\n\
  \n        overloadingDemo.method1( 11); \n        overloadingDemo.method1(11f);\
  \ \n        overloadingDemo.method1(11d); \n        overloadingDemo.method1(11l);\n\
  \n    }\n\n}\n```\n\n现在，如果编译器没有找到与提供类型相同的方法怎么办？\n\n### 重载中的自动提升\n\n在重载中，方法解析始终由编译器根据引用类型处理，因此重载也被认为是编译时多态、或静态绑定、或早期绑定。\n\
  \n在解析重载方法时，如果没有找到精确匹配，我们不会立即获得编译时错误。首先，编译器会将方法参数提升到下一个级别并检查方法匹配，它将继续检查到可能的最高级别。\n\
  \n如果找到方法匹配，编译器将考虑它并调用此方法；否则，编译器会将方法参数（s）提升到下一个级别，此过程将持续直到可能的提升为止，如果仍未找到匹配，则将抛出编译错误。这被称为重载中的自动提升。\n\
  \n![](img/image_rsrc3V1.jpg)\n示例:\n```java\npublic class MethodOverloadingDemo {\
  \ \n    public void method1(double number1){\n\n        System.out.println(\"####\
  \ method1 with arg type : double\"); } \n    public void method1(long number1){\n\
  \n        System.out.println(\"#### method1 with arg type : long\");\n\n    } \n\
  \n    public static void main(String[] args) {\n\n        MethodOverloadingDemo\
  \ overloadingDemo=new MethodOverloadingDemo();\n\n        overloadingDemo.method1(11);\n\
  \n    }\n\n}\n```\n\n### 运行时多态（方法重写）\n\n无论父类拥有什么方法，默认情况下对其子类都可用。\n\n如果子类对父类方法的实现不满意，则允许子类根据其需求为该方法提供自己的实现，这个过程被称为方法重写。\n\
  \n被重写的父类方法称为被覆盖方法，而覆盖现有父类行为的子类方法称为重写方法。\n\n![](img/image_rsrc3V2.jpg)\n当子类为其已经在超类中定义的方法提供特定实现时，就会发生方法重写。这允许子类提供其从父类继承的方法的特殊版本。\n\
  \n示例:\n```java\nclass Animal {\n\n    void makeSound() {\n\n        System.out.println(\"\
  Generic animal sound\");\n\n    }\n\n    void makeFight() {\n\n        System.out.println(\"\
  Animal is fighting\");\n\n    }\n}\n\nclass Dog extends Animal { // 方法重写\n    void\
  \ makeSound() {\n\n        System.out.println(\"Bark\");\n\n    }\n}\n\nclass Cat\
  \ extends Animal {\n    // 方法重写\n    void makeSound() {\n\n        System.out.println(\"\
  Meow\");\n\n    }\n\n}\n```\n\n在这个示例中，`Dog` 和 `Cat` 类都重写了 `Animal` 类的 `makeSound`\
  \ 方法。重写是在运行时根据实际对象类型确定的，而不是父类类。\n\n```java\npublic class AnimalDemo {  \n    public\
  \ static void main(String[] args) {\n\n        Animal animal1= new Animal(); \n\
  \        Animal animal2=new Dog(); \n        Animal animal3=new Cat();\n\n     \
  \   animal1.makeSound(); \n        animal2.makeSound(); \n        animal3.makeSound();\n\
  \n    } \n}\n```\n\n结果:\nGeneric animal sound\nBark\nMeow\n\n解释:\n```java\npublic\
  \ class AnimalDemo {  \n    public static void main(String[] args) {\n\n       \
  \ Animal animal1= new Animal(); \n        Animal animal2=new Dog(); \n        Animal\
  \ animal3=new Cat();\n\n        animal1.makeSound(); \n        animal2.makeSound();\
  \ \n        animal3.makeSound();\n\n    } \n}\n```\n运行时多态作用于运行时对象，所以 `Animal animal2=new\
  \ Dog()` 意味着将调用 `Dog` 的方法而不是 `Animal` 类的方法。\n\n![](img/image_rsrc3V3.jpg)\n事实：\n\
  在重写中，方法解析由 JVM 根据运行时对象处理，因此重写被称为动态派发。\n\n在重载中，方法解析基于引用类型而不是基于运行时对象，而在方法重写中，方法解析始终由\
  \ JVM 根据运行时对象处理。\n\n在方法重写中，方法名和参数必须匹配。这意味着方法签名必须相同。\n\n私有方法在子类中不可见，重写概念不适用于私有方法。\n\
  \n在重写中，我们不能缩小访问修饰符的范围。\n\n如果子类方法抛出任何检查异常，父类方法应抛出相同的异常或其父类异常，否则我们将获得编译错误。\n\n在重写中，我们不能缩小访问修饰符的范围。\n\
  \n### 数据隐藏\n\n![](img/image_rsrc3V5.jpg)静态方法不能被重写，因为方法重写是依赖于对象的运行时多态，但静态方法在类级别上不影响对象。\n\
  \n\n\n\n另一方面，静态方法与类本身相关，与类的实例无关。当子类声明了一个与其父类中静态方法签名相同的静态方法时，它被视为隐藏（hiding）了父类方法，而不是重写（overriding）。\n\
  \n### 类与实例上下文\n\n静态方法属于类而不是类的实例。它们通过类名进行调用，而不是通过类的实例。\n\n实例方法可以被重写，它们与类的实例相关，并在对象上调用。\n\
  \n### 编译时解析\n\n静态方法的解析是在编译时完成的，而不是在运行时。这意味着要调用的方法基于引用变量的声明类型确定的，而不是运行时对象的实际类型。\n\
  \n相比之下，实例方法在运行时解析，允许允许动态方法分发。\n\n## 控制语句\n\nJava 中的控制语句是管理程序执行流的构造结构。它们允许你根据某些条件或标准控制语句的执行顺序。\n\
  \nJava 提供了几种类型的控制语句：\n\n1. `if`\n2. `while`\n3. `do-while`\n4. `for`\n5. `forEach`\n\
  6. `break`\n7. `continue`\n8. `switch`\n\n控制语句可以分为三类，即：\n\n- 选择语句\n- 迭代语句\n- 跳语句\n\
  \n在 Java 中，我们有这些语句来控制流。根据我们的需要，我们可以在代码的任何地方使用这些语句。\n\n### If 语句\n\nJava 中的 `if`\
