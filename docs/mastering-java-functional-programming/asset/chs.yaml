  \ `Raj ,12 ,SSE`\n### `Niru ,11 ,DevOps`\n\n## LinkedList\n\n- `LinkedList` 类似于\
  \ `list`，并接受它以保持顺序。\n- Java 中的 `LinkedList` 类是 `java.util` 包的一部分，并实现了 `List` 和 `Deque`\
  \ 接口，提供了双链表数据结构。这使其成为一个多功能的集合类，既可以作为 `list` 也可以作为 `queue` 使用。\n\n```java\nimport\
  \ java.util.LinkedList;\n\npublic class LinkedListExample {\n    public static void\
  \ main(String[] args) {\n        LinkedList<String> list = new LinkedList<>();\n\
  \        list.add(\"Apple\");\n        list.add(\"Banana\");\n        list.add(\"\
  Cherry\");\n        list.addFirst(\"Avocado\");\n        list.addLast(\"Dragonfruit\"\
  );\n        System.out.println(\"First Element: \" + list.getFirst());\n       \
  \ System.out.println(\"Last Element: \" + list.getLast());\n        list.removeFirst();\n\
  \        list.removeLast();\n        System.out.println(\"Updated List: \" + list);\n\
  \    }\n}\n```\n\n## Set\n\n- `Set` 是一个不能包含重复元素的集合。该接口模型了数学中的集合抽象，用于表示集合，例如牌牌。\n\
  - Java 平台包含了三种通用的 `Set` 实现：`HashSet`、`TreeSet` 和 `LinkedHashSet`。`Set` 接口不允许对 `Collection`\
  \ 中的元素进行随机访问。你可以使用 `iterator` 或 `foreach` 循环来遍历 `Set` 的元素。\n\n### HashSet\n\n- Java\
  \ `HashSet` 是 `Set` 接口的基本实现，由 `HashMap`set。\n- 它不保证集合的迭代顺序，并允许 `null` 元素。\n- 假设哈希函数将元素良好分布在桶中，该类对于基本操作（`add`、`remove`、`contains`\
  \ 和 `size`）具有常时间性能。\n- 我们可以为此集合设置初始容量和负载因子。负载因子是衡量 map 在容量增加之前的填充程度。\n\n### 实现\n\
  \n`Set` 接口由 Java 中的多个类实现，其中 `HashSet`、`LinkedHashSet` 和 `TreeSet` 是主要实现。\n- **不允许重复**。\n\
  - **无序**：集合的顺序无法保证（`LinkedHashSet` 除外）。\n\n### LinkedHashSet\n\n`Set` 接口由 Java 中的多个类实现，其中\
  \ `HashSet`、`LinkedHashSet` 和 `TreeSet` 是主要实现。\n- **不允许重复**。\n- **无序**：集合的顺序无法保证（`LinkedHashSet`\
  \ 除外）。\n\n### TreeSet\n\n`Set` 接口由 Java 中的多个类实现，其中 `HashSet`、`LinkedHashSet` 和 `TreeSet`\
  \ 是主要实现。\n- **不允许重复**。\n- **无序**：集合的顺序无法保证（`LinkedHashSet` 除外）。\n\n\n\n\n\n```java\n\
  treeMap.put(\"Two\", 2);\ntreeMap.put(\"Three\", 3);\n```\n\n### 基础 Map 操作\n\n添加键值对：\n\
  `map.put(\"Key1\", \"Value1\"); map.put(\"Key2\", \"Value2\"); map.put(\"Key3\"\
  , \"Value3\");`\n\n通过键检索值：\n`String valueForKey2 = map.get(\"Key2\"); // 获取 \"Value2\"\
