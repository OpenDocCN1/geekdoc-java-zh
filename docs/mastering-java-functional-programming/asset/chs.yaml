  \ -classpath /Users/aray/Documents/lpError/new/JavaFundamentals/target/classes org.example.exception.ExceptionDemo`\
  \ ### 数字不能除以零\n\n### try 块\n\n ➔ `try` 块用于执行可能抛出异常的测试语句。\n ➔ `try` 块可以包含多个语句。\n\
  \ ➔ `try` 块不能单独执行，必须至少跟一个 `catch` 块或 `finally` 块一起。\n ➔ 如果 `try` 块中发生任何异常，控制权将跳转到上述代码中的\
  \ `catch` 块。\n\n```java\ntry {\n    //可能抛出异常的代码\n}\n```\n\n### catch 块\n\n ➔ `catch`\
  \ 块用于为异常提供解决方案或替代方案。\n ➔ `catch` 块通过在参数中声明异常类型来处理异常。\n ➔ 声明的异常必须是父类异常、异常类层次结构中生成的异常类型或用户自定义的异常。\n\
  你可以在单个 `try` 块中使用多个 `catch` 块。\n\n```java\ntry {\n    //可能抛出异常的代码\n} catch(Exception\
  \ e) {\n    // //针对异常的任何消息或替代方案\n}\n```\n\n### 带有 finally 块的 try-catch\n\n ➔ `finally`\
  \ 块与 `try`、`catch` 块配合使用。 ➔ 无论是否抛出异常，它每次都会执行。 ➔ `finally` 块用于执行重要的语句，如关闭语句、释放资源、释放内存或任何你确定想要执行的代码段。\
  \ ➔ `finally` 块可以与 `try` 块（带或不带 `catch` 块）配合。 ➔ 如果你的代码中有 `finally` 块，那么一旦发生异常，控制权将先进入\
  \ `finally`，然后进入 `catch` 块。 ➔ `\"finally\"` 块用于执行程序的必要代码。无论异常是否被处理，它都会执行。\n\n```java\n\
  try {\n    //可能抛出异常的代码\n} catch(Exception e) {\n    //针对异常的任何消息或替代方案\n} finally\
  \ {\n    //释放资源\n}\n```\n\n```java\npackage org.example.exception;\n\npublic class\
  \ ExceptionDemo {\n    public static void main(String[] args) {\n        int num=10;\n\
  \        try {\n            int result = num / 0;\n        }\n        catch (Exception\
  \ e){\n            System. out.println(\"### 数字不能除以零\"); \n        }\n        finally\
  \ {\n            System.out.println(\"### 这是 finally 块\"); \n        }\n    }\n\
  }\n```\n\n结果：\n\n`/Users/aray/Library/Java/JavaVirtualMachines/openjdk-21/Contents/Home/bin/java\
