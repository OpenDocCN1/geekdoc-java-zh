  \n### 跳过 Stream 元素\n`Stream<T> skip(long n)` 返回丢弃前 `n` 个元素后剩余的流。\n\n```java\nInteger\
  \ []ac={22,44,99,55,11,110};\nArrays.stream(ac).skip(2).forEach(System.out::println);\n\
  ```\n**结果：**\n99\n55\n11\n110\n\n### 从 Stream 中查找最小值和最大值\n`min(Comparator<? super\
  \ T> comparator)` 和 `max(Comparator<? super T> comparator)` 方法接受 `Comparator` 作为参数。\n\
  \n### 从 Integer 数组查找最大值和最小值\n```java\nInteger []ac={ 22,229,44,99,55,11,110};\n\
  int max=Arrays.stream(ac).mapToInt(x->x).max().getAsInt();\nint min=Arrays.stream(ac).mapToInt(x->x).min().getAsInt();\n\
  System.out.println(\"MAX : \"+max);\nSystem.out.println(\"MIN : \"+min);\n```\n\
  **结果：**\nMAX : 229\nMIN : 11\n\n### 从 int 数组查找最大值\n```java\nint element[]={22,229,44,99,55,11,110};\n\
  int minVal=Arrays.stream(element).min().getAsInt();\nint maxVal=Arrays.stream(element).max().getAsInt();\n\
  System.out.println(\"MAX : \"+maxVal);\nSystem.out.println(\"MIN : \"+minVal);\n\
  ```\n**结果：**\nMAX : 229\nMIN : 11\n\n### 用例：让我们找到薪资最高的员工。\n\n**查找组织内薪资最高的员工：**\n\
  ```java\nList<EmployeeBean> empList=AppUtil.getEmpList();\nEmployeeBean employeeBean=empList.stream()\n\
  \    .max(Comparator.comparing(EmployeeBean::getSalary)).get();\nSystem.out.println(employeeBean);\n\
  ```\n**结果：**\nEmployeeBean{name='Amir', city='Bangalore', dept='Gov', desig='Arch',\
  \ salary=170000.0}\n\n**查找组织内的最高薪资：**\n```java\nOptionalDouble salary=empList.stream()\n\
  \    .mapToDouble(EmployeeBean::getSalary)\n    .max();\nSystem.out.println(salary.getAsDouble());\n\
  ```\n**结果：**\n170000.0\n\n**查找组织内薪资最低的员工：**\n```java\nList<EmployeeBean> empList=AppUtil.getEmpList();\n\
  EmployeeBean employeeBean=empList.stream()\n    .min(Comparator.comparing(EmployeeBean::getSalary)).get();\n\
  System.out.println(employeeBean);\n```\n**结果：**\nEmployeeBean{name='Raj', city='Patna',\
  \ dept='R&D', desig='SSE', salary=50000.0}\n\n**查找组织内的最低薪资：**\n```java\nOptionalDouble\
  \ salary=empList.stream()\n    .mapToDouble(EmployeeBean::getSalary)\n    .min();\n\
  System.out.println(salary.getAsDouble());\n```\n**结果：**\n50000.0\n\n### 平化 Stream\
  \ 数据\n`<R> Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> mapper)`\
  \ 它被用于平化集合数据。\n\n\n\n\n\n# 什么是 flatmap(..)\n\nJava 流中的 `flatMap` 操作用于扁平化嵌套集合，或者将集合流中的元素进行转换并合并成单个流。当你有一个元素流，其中每个元素都包含另一个集合，并且你想对这些嵌套集合中的元素进行操作时，通常会使用它。\n\
  \n`flatMap()` = 扁平 (`flat`) + 映射 (`map`)\n\n![](img/image_rsrc3X8.jpg) 想象一下我们有一堆盒子，每个盒子里装有一些物品。现在，我们想要从这些箱子里取出所有物品并将它们放在一个箱子里。这就是\
  \ `flatMap()` 对流所的操作。\n\n```java\nList<Integer> num1=List.of(9,2,3);\nList<Integer>\
  \ num2=List.of(4,5,6);\nList<List<Integer>> lists=List.of(num1,num2);\nSystem.out.println(lists);\n\
  \nList<Integer> finalList=lists.stream().flatMap(List::stream).collect(Collectors.toList());\
  \ \nSystem.out.println(finalList);\n```\n\n**结果：**\n输入列表：`[[9, 2, 3], [4, 5, 6]]`\n\
  输出列表：`[2, 3, 9, 4, 5, 6]`\n\n## 数据扁平化在 Stream 中是如何工作的？\n\n![](img/image_rsrc3X9.jpg)\
  \ 它为列表中的每个元素创建一个 Stream，然后将其扁平化并合并到一个单个 Stream 中。\n\n### 将二维数组转换为 String 列表\n\n\
  输入：`{{\"Raj\",\"Mahi\"},{\"Bikash\",\"Rana\"},{\"Abhinash\",\"Rajiv\"}}` 输出：`[Raj,\
  \ Mahi, Bikash, Rana, Abhinash, Rajiv]`\n\n```java\nString names[][]={{\"Raj\",\"\
  Mahi\"},{\"Bikash\",\"Rana\"},{\"Abhinash\",\"Rajiv\"}};\nList<String> nameList=\
  \ Arrays. stream(names)\n    .flatMap(x-> Arrays.stream(x))\n    .collect(Collectors.toList());\n\
  \nSystem.out.println(nameList);\n```\n**结果：** `[Raj, Mahi, Bikash, Rana, Abhinash,\
  \ Rajiv]`\n\n### 原始类型数据扁平化的版本\n\n`IntStream flatMapToInt(Function<? super T,? extends\
  \ IntStream> mapper)`\n`LongStream flatMapToLong(Function<? super T,? extends LongStream>\
  \ mapper)`\n`DoubleStream flatMapToDouble(Function<? super T,? extends DoubleStream>\
  \ mapper)`\n\n```java\nList<Integer> num1=Arrays. asList(1, 2, 3);\nList<Integer>\
  \ num2=Arrays.asList(4, 5);\nList<Integer> num3=Arrays.asList(6, 7, 8);\nList<List<Integer>>\
  \ rr=List.of(num1,num2,num3);\n\nrr.stream().flatMapToInt(x->x.stream().mapToInt(Integer::intValue)).forEach(System.out::println);\n\
  ```\n**结果：**\n`1 2 3 4 5 6 7 8`\n\n## 重要 Java 特性：Java 8+\n\n### Java 中的默认方法\n\n\
  在继续之前，请让我确保你使用的是 Java 8+。\n\n默认方法概念作为 Java 8 的一部分引入的。\n\n在 Java 8 之前，接口只能有抽象方法，但作为\
  \ Java 8 发布的一部分，私有方法（java 9）和默认方法（java 8）可以成为接口。\n\n让我们理解为什么默认方法作为 Java 的一部分被引入，因为我之前问过，在\
  \ Java 8 之前只有抽象方法可以是接口的一部分，并且向任何现有接口添加任何额外的抽象方法都会破坏向后兼容性，因为客户端需要实现它们所使用的接口的所有抽象方法。\n\
  \n为了解决向后兼容性问题，引入了默认方法。`default` 方法与具体方法相同，唯一的区别是它具有访问修饰符 `default`。\n\n默认方法将具有某些默认实现，这样客户端如果不需要，就不需要实现此方法。根据他们的需求，他们可以重写此方法的行为。\n\
  \n```java\ndefault int addTwoNumbers(){ //某些默认实现返回 0;\n}\n```\n\n以下是默认方法的一些常见优势：\n\
  \n- **向后兼容性**：引入默认方法的主要原因之一是允许接口进行演进而不破坏实现这些接口的现有类。换句话说，默认方法提供了一种向接口添加新方法的方法，而无需强制所有实现类为这些新方法提供实现。这对于需要随时间扩展同时保持与现有代码兼容的库和\
  \ API 关重要。\n- **支持 Lambda 表达式**：Java 8 引入了 lambda 表达式和 Stream API，它们高度依赖于只有一个抽象方法的接口（SAM\
  \ 接口），也称为函数接口。为了更方便地使用函数接口并提供额外的实用方法，引入了默认方法。这允许 `java.util.List` 等现有接口添加如 `forEach`\
  \ 等新方法而不破坏兼容性。\n- **代码重用和实用方法**：默认方法还可以包含在实现相同接口的多个类共享的实用方法。这促进了代码重用并减少了实现类中的代码重复。例如，Java\
  \ 8 中的 `Collection` 接口引入了几个实用的默认方法，如 `stream()`、`forEach()` 和 `removeIf()`，可以被任何实现\
  \ `Collection` 接口的类使用。\n- **渐进迁移**：默认方法为将旧代码逐渐迁移到接口的新版本提供了路径。现有类可以选择重写并为默认方法提供自己的实现，也可以可以依赖接口提供的默认实现。\n\
  \n默认方法的语法\n\n\n\n\n\n```java\nimport lombok.ToString;\n\n@ToString\nclass Student\
  \ {\n    private String name;\n    private String city;\n    private String dept;\n\
  \    private String designig;\n    private int salary;\n\n    public Student(String\
  \ name, String city, String dept, String designig, int salary) {\n        this.name\
  \ = name;\n        this.city = city;\n        this.dept = dept;\n        this.designig\
  \ = designig;\n        this.salary = salary;\n    }\n\n    public String getName()\
  \ { return name; }\n}\n\ninterface StudentService {\n    abstract Student getStudent();\n\
  \n    default int methodName(int sid) {\n        int pass = 123;\n        return\
  \ pass;\n    }\n\n    private int getStudentAcc(int sid) {\n        int pass = 12345;\n\
  \        return pass;\n    }\n}\n```\n\n### 接口中的私有方法 (Private Method in Interface)\n\
  \n- `private` 方法在 `Java 9` 中引入。\n- 接口可以像 `static` 方法一样拥有 `private` 方法。\n- `private`\
  \ 方法将用于隐藏方法实现，由于其私有性，客户端无法访问。\n- 同样你也可以声明 `static` 方法。\n\n### 局部变量类型推断 (Local Variable\
  \ Type Inference)\n\n局部变量类型推断在 `Java 10` 中引入（使用 `var`）。它允许你在不显式指定类型的情况下声明局部变量。如上面的示例所示，`name`\
  \ 的类型是从右侧表达式获取的，编译器会自动处理它。\n\n#### 使用局部方法推断前 (Before Local Method Inference)\n```java\n\
  ArrayList<String> names = new ArrayList<>();\n```\n\n#### 使用局部方法推断后 (After Local\
  \ Method Inference)\n```java\nvar names = new ArrayList<String>();\nvar name = \"\
  raj\";\n```\n\n```java\nimport functional.bean.EmployeeBean;\nimport java.util.ArrayList;\n\
  import java.util.Collectors;\nimport java.util.stream.Collectors;\n\nclass LocalMethodInferenceDemo\
  \ {\n    public static void main(String[] args) {\n        var employeeBeanList\
  \ = EmployeeUtil.getAllEmployeeList();\n        System.out.println(\"employeeBeanList\
  \ :: \" + employeeBeanList);\n\n        var filteredEmpList = employeeBeanList.stream()\n\
  \            .map(EmployeeBean::getName)\n            .collect(Collectors.toList());\n\
  \        System.out.println(\"filteredEmpList ## \" + filteredEmpList);\n\n    \
  \    var groupByName = employeeBeanList.stream()\n            .collect(Collectors.groupingBy(EmployeeBean::getName));\n\
  \        System.out.println(\"groupByName :: \" + groupByName);\n\n        var partitionData\
  \ = employeeBeanList.stream()\n            .collect(Collectors.partitioningBy(x\
  \ -> x.getName().startsWith(\"A\")));\n        System.out.println(\"partitionData\
  \ :: \" + partitionData);\n    }\n}\n```\n\n#### 结果 (Result):\n\n- `employeeBeanList`:\
  \ [{name='Raj', city='Patna', dept='Development', desig='SSE', salary=140000}, {name='Raj',\
  \ city='Bangalore', dept='Development', desig='SSE', salary=160000}, {name='Amit',\
  \ city='Delhi', dept='Development', desig='SSE', salary=110000}, {name='Jawed',\
  \ city='Patna', dept='R&D', desig='SSE', salary=240000}, {name='Jawed', city='Bangalore',\
  \ dept='Development', desig='SSE', salary=140000}, {name='Jawed', city='Delhi',\
  \ dept='R&D', desig='SSE', salary=340000}, {name='Abhinash', city='Bangalore', dept='Development',\
  \ desig='SSE', salary=140000}]\n- `filteredEmpList`: [Raj, Raj, Amit, Jawed, Jawed,\
  \ Jawed, Abhinash]\n- `groupByName`: {Abhinash=[{name='Abhinash', city='Bangalore',\
  \ dept='Development', desig='SSE', salary=140000}], Amit=[{name='Amit', city='Delhi',\
  \ dept='Development', desig='SSE', salary=110000}], Raj=[{name='Raj', city='Patna',\
  \ dept='Development', desig='SSE', salary=140000}, {name='Raj', city='Bangalore',\
  \ dept='Development', desig='SSE', salary=160000}], Jawed=[{name='Jawed', city='Patna',\
  \ dept='R&D', desig='SSE', salary=240000}, {name='Jawed', city='Bangalore', dept='Development',\
  \ desig='SSE', salary=140000}, {name='Jawed', city='Delhi', dept='R&D', desig='SSE',\
  \ salary=340000}]\n- `partitionData`: {false=[{name='Raj', city='Patna', dept='Development',\
  \ desig='SSE', salary=140000}, {name='Raj', city='Bangalore', dept='Development',\
  \ desig='SSE', salary=160000}, {name='Jawed', city='Patna', dept='R&D', desig='SSE',\
  \ salary=240000}, {name='Jawed', city='Bangalore', dept='Development', desig='SSE',\
  \ salary=140000}, {name='Jawed', city='Delhi', dept='R&D', desig='SSE', salary=340000}],\
  \ true=[{name='Abhinash', city='Bangalore', dept='Development', desig='SSE', salary=140000}]}\n\
  \n### Optional 类 (Optional Class)\n\n`Optional` 是 `Java 8` 引入的一个类，用于显式地处理空值（null）。它可以避免常见的\
  \ `NullPointerException` 异常，使代码更具防御性。\n\n- `of(T value)`: 创建一个非空值的 `Optional` 对象。如果值为\
  \ `null`，则会抛出异常。\n- `ofNullable(T value)`: 如果值为 `null`，则返回一个空的 `Optional`；如果不空，则返回包含该值的对象。\n\
  - `empty()`: 返回一个空的 `Optional` 。\n- `isPresent()`: 检查 `Optional` 中是否有值。\n- `ifPresent(Consumer<?\
  \ super T> action)` 如果值存在，则执行给定的消费者函数。\n\n\n\n\n\n```java\n[{name='Raj', city='Patna',\
  \ dept='Development', desig='SSE', salary=140000}, {name='Raj', city='Bangalore',\
  \ dept='Development', desig='SSE', salary=160000}, {name='Amit', city='Delhi', dept='Development',\
  \ desig='SSE', salary=110000}, {name='Jawed', city='Patna', dept='R&D', desig='SSE',\
  \ salary=240000}, {name='Jawed', city='Bangalore', dept='Development', desig='SSE',\
  \ salary=140000}, {name='Jawed', city='Delhi', dept='R&D', desig='SSE', salary=340000},\
  \ {name='Abhinash', city='Bangalore', dept='Development', desig='SSE', salary=140000}]\n\
  ```\n\n## 过滤后的数据：\n\n```java\n{name='Jawed', city='Patna', dept='R&D', desig='SSE',\
  \ salary=240000} {name='Jawed', city='Delhi', dept='R&D', desig='SSE', salary=340000}\n\
  ```\n\n### orElse(T other)\n\n如果存在则返回该值；否则，返回提供的默认值。\n\n我们以前在某些场景中，当 `Optional`\
  \ 中没有值时，会返回某个默认值。\n\n```java\nOptional<String> result = optional8.orElse(\"Raj\"\
  ); \nSystem.out.println(result);\n\nList<EmployeeBean> ll= new ArrayList<>();\n\
  EmployeeBean employeeBean1=new EmployeeBean(\"Raj\",\"Patna\",\"Development\",\"\
  SSE\",140000);\nList<EmployeeBean> defaultEmpList= new ArrayList<>(); \ndefaultEmpList.add(employeeBean1);\n\
  \nOptional.ofNullable(ll).orElse(defaultEmpList);\n```\n结果：Raj\n\n```java\nSystem.out.println(\
  \ Optional.empty().orElse(defaultEmpList));\n```\n结果：`[{name='Raj', city='Patna',\
  \ dept='Development', desig='SSE', salary=140000}]`\n\n### orElseGet(Supplier<T>\
  \ supplier)\n\n如果 `Optional` 为空或没有值，通过 supplier 提供某些默认值是有用的。你可以使用任何现有的 `Supplier`\
  \ 来提供默认数据。\n\n这与 `orElse(T other)` 类似，它只是接收一个 supplier 作为输入，而 `orElseGet(Supplier<T>\
  \ supplier)` 接收任何类型 `T`。\n\n```java\nSupplier<EmployeeBean> getEmpData=()-> new\
  \ EmployeeBean(\"Raj\",\"Patna\",\"Development\",\"SSE\",140000); \nObject employeeBean2=Optional.empty().orElseGet(getEmpData);\
  \ \nSystem.out.println(employeeBean2);\n```\n结果：`{name='Raj', city='Patna', dept='Development',\
  \ desig='SSE', salary=140000}`\n\n### orElseThrow(Supplier<? extends X> exceptionSupplier)\n\
  \n如果存在则返回该值；否则，抛出由提供的 supplier 生成的异常。\n\n同样是为了处理空数据，如果没有数据，则抛出某些异常。\n\n```java\n\
  String result1 = optional9.orElseThrow(() -> new NullPointerException(\"No Data\
  \ Found\"));\n```\n结果：\n它将抛出以下异常。\n``` in thread \"main\" java.util.NoSuchElementException:\
  \ No value present at java.base/java.util.Optional.orElseThrow(Optional.java:377)\
  \ at\nfunctionalJava.optionalDemo.OptionalClassDemo.main(OptionalClassDemo.java:87)\n\
  ```\n\n### get()\n\n如果存在则返回该值；否则，抛出 `NoSuchElementException`。\n\n它仅用于从 `Optional`\
  \ 实例获取数据。\n\n```java\nOptional<String> getVal=Optional.of(\"Raj\"); \nString name=getVal.get();\n\
  System.out.println(name);\n```\n结果：Raj\n\n### filter(Predicate<T> predicate)\n\n\
  如果存在，则对值应用过滤器。如果该值匹配 `predicate`，则保留它；否则返回一个空的 `Optional`。\n\n```java\nOptional<Integer>\
  \ optional10 = Optional.of(123);\nOptional<Integer> filtered = optional10.filter(value\
  \ -> value > 100); \nSystem.out.println(\"## filtered \"+filtered.get());\n```\n\
  结果：123\n\n```java\nOptional<Integer> optional11 = Optional.empty();\nOptional<Integer>\
