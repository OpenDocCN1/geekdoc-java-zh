    第 2 行的 "ROBERT "<br>

    第 4 行的 "103 "<br>

    第 5 行的 "508 "<br>

    第 6 行的 "650 "<br>

    第 7 行的 "3000 "<br>

    以及第 8 行的 "1560 "。 |


    ## 2.8 总结


    在这一章中，我们探索了许多新概念，我已尽力让这些概念变得具体。希望你现在已经准备好在接下来的章节中迎接在 SAS 代码中实现这些概念的挑战。以下是你在接下来的页面及之后中应该记住的一些要点。


    ## 灵活性


    通过阅读本章，你应该清楚完成相同任务有许多方法，很少有方法是绝对正确或错误的。你必须决定实现目标最高效、最有效的方法，以确定对于给定情况的最佳方案。


    ## 浅尝辄止


    我们刚刚开始触及正则表达式（RegEx）能力的皮毛。你目前所学的信息是一个坚实的基础，你可以在此基础上开发的功能。


    ## 从小开始


    由于我们在本章中探索了各种 RegEx 能力，很容易因为试图一次性做太多而感到不知所措。与任何事情一样，最好的是从简单模式开始实验并迭代进化。记住，仅仅利用我们涵盖的几个元素就可以对文本信息的处理和分析产生巨大影响。


