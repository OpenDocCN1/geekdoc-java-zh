    # Chapter 2: Getting Started with Regular Expressions 23


    ## 2.5 Modifiers


    There are two significant things that you probably notice from the previous sections,
    which are worth further discussion here. First, all of the applicable metacharacters
    thus far ignored letter case. In other words, \w, S, \D, and all match a letter
    regardless of whether it is lowercase or uppercase. However, there are situations
    in which the case of a letter becomes important, but the letter itself is not
    known in advance.


    Second, we can use a single match character as many times as we like, which creates
    additional fuzziness for our matches. However, there is a downside to just laying
    them out: each occurrence must exist in order to match the pattern. For instance,
    if the source for the \D examples above contained "19thStreet" with no spaces,
    we''d never find it by using \D three times. And since the primary goal of the
    RegEx capability is to automate text processing, we need a robust way to make
    this kind of matching more flexible.


    Over the next subsections (2.5.1 and 2.5.2), we will work through ways to overcome
    these limitations by using modifiers. There are two types of modifiers, case modifiers
    and repetition modifiers. Combining them I have already introduced a rudimentary
    way to handle this in situations where real-world RegEx implementations occur,
    and should be considered as fundamental to real-world implementations as the metacharacters
    that we have discussed this far.


    ## 2.5.1 Case Modifiers


    When performing matches on text, there is the obvious consideration of letter
    case (upper vs. lower). Although I have introduced a rudimentary way to handle
    this in situations where the letter is unknown, there still must be a methodology
    for accounting for letter case when it is unknown. This section discusses a variety
    of approaches to dealing with case matching. Depending on the situation, some
    approaches are more convenient than others, but not necessarily right or wrong.


    ### Lowercase


    The \w matches when the next character in a pattern is lowercase. This metacharacter
    applies only to characters (metacharacters, groups, and so on don''t work). In
    practice, it is more practical to simply type the lowercase version of the desired
    character, or provide a list of lowercase letters to match. Table 2.19 provides
    examples.


    | Table 2.19: Examples using \l |

    | Usage | Matches |

    | \lStreet/ | "street" ... |

    | \sIS\IA\sInstitute/ | "sas Institute" ... |

    | /(IS\|F)leet/ | "fleet" ... |


    ### Uppercase


    The metacharacter \u matches the next letter in a pattern is uppercase. It functions
    exactly like the lowercase version introduced above (\l), but also applies to
    uppercase. Table 2.20 provides examples.


    | Table 2.20: Examples using \u |

    | Usage | Matches |

    | \uinc./ | "Inc." ... |

    | \ustreet\ust]./ | "Street" "St." ... |

    | \uave\uavenue,/ | "Ave." "Avenue," |


    ### Lowercase Range


    The metacharacter \L...\E matches all the characters between the \L and \E as
    lowercase. Strings typed between \L and \E are forced to match lowercase, even
    when they are typed in capital letters. Unlike the \L metacharacter, \L...\E can
    also contain character classes and repetition modifiers. Table 2.21 provides examples.


    | Table 2.21: Examples using \L...\E |

    | Usage | Matches |

    | \[a-z0-9][a-z0-9][a-z0-9]\E/ | "sas" "abc" "123" ... |

    | \LTHSE ARE LOWERCASE | "these are lowercase" |

    | \sR\L[a-z][a-z]\s/ | "Read" "Road" "Rode" "Ride" "Real" ... |


    > Note: When applying modifiers to non-alphabetic characters, the modifier is
    ignored. It doesn''t affect the match.


    ### Uppercase Range


    The metacharacter \U...\E creates a match when all the characters between the
    \U and \E are uppercase. Again, this metacharacter functions the same way as the
    lowercase version discussed above, but applies to uppercase. This metacharacter
    can be useful for identifying acronyms or other text where capital letters are
    important. Table 2.22 provides examples.


    | Table 2.22: Examples using \U...\E |

    | Usage | Matches |

    | \[a-z][a-z][a-z]\E/ | "SAS" "CIA" ... |

    | \[a-z][a-z][a-z]\E\sInstitute\W/ | "SAS Institute Inc." ... |

    | \sallcaps\E/ | "ALLCAPS " |


    **Note:** Notice that other metacharters are not allowed inside \L...\E or \U...\E
    metacharters. In other words, \w can''t be used to replace the character classes
    above.


    ### Quote Range


    The metacharacter \Q...\E matches all content inside the \Q and \E as character
    strings, disabling everything including the backslash character. Metacharacters
    cannot be used inside ''\Q...\E. The functionality provided by this metacharacter
    is great for searching within strings that contain a significant number of reserved
    characters, such as XML, webserver logs, or HTML. Table 2.23 provides examples.


    | Usage | Matches |

    | --- | --- |

    | \Q.*\E/ | ".*" |

    | \Qf(x)\E/ | "f(x)" |

    | \Q\w+ \E/ | "\w+" |


    ## 2.5 Repetition Modifiers


    There are two types of modifiers, case modifiers and repetition modifiers. Combining
    them I have already introduced a rudimentary way to handle this in situations
    where real-world RegEx implementations occur, and should be considered as fundamental
    to real-world implementations as the metacharacters that we have discussed this
    far.


    Over the next subsections (2.5.1 and 2.5.2), we will work through ways to overcome
    these limitations by using modifiers. There are two types of modifiers, case modifiers
    and repetition modifiers.


    Repetition modifiers change how many times a character or group should match.
    iterations (think loops), and large data sources. It is important to be mindful
    of these factors.


    ### 0 or More


    The modifier * requires the immediately preceding character or metacharacter to
    match 0 or more times. It enables optional matches. For example, we might want
    to match every occurrence of a word. By allowing the prefixes and suffixes to
    be optional, we are able to achieve this. Table 2.24 provides examples.


    | Table 2.24: Examples using * |

    | Usage | Matches |

    | --- | --- |

    | /Sing/w* | "Sings" "Sings" "Singing" "Singer" "Sings" ... |

    | /D\W*C*/ | "DC" "D.C" "D " ... |

    | /19\D*Street/ | "19th Street" "19Street" "19" ... |

    | /Hello* | "Hell" "Hello" "Hellooooooooo" |


    ### 1 or More


    The modifier + requires the immediately preceding character or metacharacter to
    match 1 or more times. The plus sign modifier works similarly to the asterisk,
    with the exception that it enforces a match of the metacharacter or at least 1
    time. Table 2.25 provides examples.


    | Table 2.25: Examples using + |

    | Usage | Matches |

    | --- | --- |

    | /Ru/w+ | "Run" "Ruin" "Grunt" "Runners" ... |

    | /\U[a-z]+E/s/ | Words with all letters capitalized, and surrounded by spaces.
    |

    | /19\D+Street/ | "19th Street" "19...Street" ... |

    | /(ha)+ | "hahahahahahaha" |


    ### 0 or 1 Time


    The modifier ? creates a match of 0 or 1 time. The question mark provides the
    ability to make the occurrence of a metacharacter optional without allowing it
    to match multiple times. This can be effective

