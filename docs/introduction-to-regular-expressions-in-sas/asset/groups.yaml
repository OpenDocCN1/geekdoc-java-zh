    ## 3.1 引言


    本章重点在于开发对内置函数和调用例的理解。在这里你将学习如何在实际场景中使用第二章介绍的元字符。


    ### 3.1.1 捕获缓冲区 (Capture Buffer)


    现在，在继续之前，我们必须处理一个名为捕获缓冲区的概念。捕获缓冲区是一种我为止一直避免的技术，但必须理解它才能使用 PRXREN 和 PRXPOSN。每个括号创建一个本地缓冲区，然后被引用。


    ## 3.2 SAS 内置函数


    在本节中，我们涵盖了执行正则表达式操作的 SAS 函数。正则表达式的 SAS 函数使用限制与内置函数相同。与其他函数一样，它们只能接收参数并返回输出。


    注意：每个正则表达式函数都以 PRX 开头，代表 Perl 表达式。


    ### 3.2.1 PRXPARSE


    #### 描述


    该函数接受正则表达式模式作为输入，并提供数值正则表达式标识符作为输出。该唯一标识符被其他函数和调用例引用。该函数的用法与我们在第二章中的示例代码相似。


    #### 语法


    ```

    RegEx_ID = PRXPARSE (RegEx)

    ```


    RegEx：要解析的模式（输入参数，必需）


    RegEx_ID：PRXPARSE 返回的唯一正则表达式标识符（输出，必需）


    现在，此处需要理解 PRXPARSE 会编译正则表达式以创建供 SAS 引用的标识符。这就是为什么在代码中使用 PRXPARSE 时，正则表达式 //o 选项非常重要。


