    NOT match from the substrings "Street" etc. |

    | /b8d{2}/b/ | "800"-"888" ... from the substrings "(800)"-"888" ... <br> But
    does NOT match from the substrings "18002" ... |

    | /b''U[a-z]+E/b/ | Words in all caps. Without the second \b, the output would
    also include single capitalized letters from the front of a word. |


    # 2.7.4 Non-word Boundary


    The metacharacter \b matches a non-word boundary (i.e., anywhere \b does not match).
    This is especially useful for matching root words or substrings without including
    the surrounding pieces of information. Table 2.43 provides examples.


    Table 2.43: Examples using \B


    | Usage | Matches |

    | --- | --- |

    | /read/B/ | "read" from the substrings, "reads" "reading" "reader" ... <br> Does
    NOT match from the substring "read" |

    | /Bun/b/ | "un" from the substrings, "fun " "rerun," "gun," ... <br> Does NOT
    match from the substring "un" |

    | /b[a-zA-Z]{3,}/b/ | Any word longer than three letters.|


    # 2.7.5 String Start


    The metacharacter \A matches the beginning of the string. Similar to the word
    boundary metacharacter (|b), \A occurs between two characters. It also denotes
    a string value occurs to its right with nothing to left. In the context of data
    lines (as our test code for this chapter), that situation occurs at the beginning
    of each line.


    However, suppose we have a more complex task as stitching multiple strings of
    extracted text (stored in SAS variables). In this context, \A could be a key to
    determining in what order to place or sort them. However, for our test code, the
    \A matches only on the beginning of each data line, since each line is identified
    as the beginning of the string. So is another one that you have to approach with
    a little bit of faith until we start doing more interesting tasks in the next
    chapter. Table 2.44 provides examples.'
