    \ CALL PRXN\n\n### 描述\n\n该调用例接收 PRXPARSE 提供的正则表达式 ID 和缓冲区，并返回位置和长度。\n\n### 语法\n\
    \n```sas\nCALL PRXN(RegEx_ID, N, Position, Length)\n```\n\nRegEx_ID：由 PRXPARSE\
    \ 返回的唯一正则表达式标识（输入参数）\n\nN：缓冲区的整数值（输入参数）\n\nPosition：匹配的字符位置（输出参数）\n\nLength：匹配长度的整数值（输出参数）\n\
    \n## 第 3 章：在 SAS 68 中使用正则表达式\n\n### 示例 3.9：上下文算法开发\n\n有时根据文本中的特定词来限制代码行为是有用的。在这个示例中，你将看到如何将\
    \ CALL PRXN 与 PRXPAREN、PRXMATCH 和 SUBSTR 结合使用来实现。\n\n首先，我们使用 PRXPARSE 创建 RegEx_ID，然后将其传递给\
    \ PRXMATCH。如果 PRXMATCH 有结果（即找到了模式匹配），我们使用 PRXPAREN 确定模式中匹配的捕获缓冲区。PRXPAREN 的输出被用作\
    \ CALL PRXN 的输入以创建位置和长度。SUBSTR 用于提取特定文本。然后我们打印一条留下缓冲区的消息。\n\n```sas\ndata null_;\n\
    input text $50;\nRegEx_ID=prxparse('/((Dog) | (Rat) | (Cat))/o');\n\nif prxmatch(RegEx_ID)\
