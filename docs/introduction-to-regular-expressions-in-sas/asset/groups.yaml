    # About This Book


    ## Purpose


    This book is intended for a wide audience of SAS users, novice programmer to the
    very advanced. As not much has previously been published on this topic, many different
    skill levels benefit from the content herein. However, the book has been written
    to ensure that novice programmers can immediately implement every element discussed.


    ## Is This Book for You?


    Of course, it is! Do you wish to process unstructured data sources? Would you
    like to more effectively process semi-structured data sources? Do you want to
    one day leverage advanced text mining concepts within your Base SAS code? Of course,
    you do! This book lays the foundation for all of this and, making it the ideal
    text for anyone wanting to enhance their programming prowess.


    ## Prerequisites


    Readers should be comfortable using and applying the SAS DATA step, basic PROCs
    (e.g., PROC PRINT), DO loops, and conditional processing concepts. Readers should
    be familiar with SAS arrays and the RETAIN statement.


    ## Scope of This Book


    This book covers all PRX functions and call routines.


    This book does NOT cover advanced concepts requiring MACRO programming, PROC SQL,
    and system automation.


    # About the Examples


    ## Software Used to Develop the Book''s Content


    Base SAS (Microsoft Windows)


    ## Example Code and Data


    You can access the example code and data for this book by linking to its author
    page at http://support.sas.com/publishing/authors. Select the name of the author.
    Then, look for the cover thumbnail of this book, and select Example Code and Data
    to display the SAS programs that included in this book.


    For an alphabetical listing of all books for which example code and data is available,
    see http://support.sas.com/bookcode. Select a title to display the book’s example
    code.


    If you are unable to access the code through the web, e-mail sasupport@sas.com.


    ## Output and Graphics Used in This Book


    All output used in this book was generated via the SAS log and PROC PRINT.


    ## Additional Help


    Although this book illustrates many analyses regularly performed in businesses
    across industries, questions specific to your aims and issues may arise. To fully
    support you, SAS Institute and SAS Press offer you the following resources:


    - About topics covered in this book, contact the author through SAS Press:

    - Send questions by e-mail to sasupport@sas.com; include the book title in your
    correspondence.

    - Submit feedback on the author’s page at http://support.sas.com/author_feedback.

    - About topics in or beyond this book, post the questions to the relevant SAS
    Support Communities at https://communities.sas.com/welcome.

    - SAS Institute maintains a comprehensive website with up-to-date information.
    One page that is particularly useful to the novice and the seasoned SAS user is
    the Knowledge Base. Search for relevant notes in the “Samples and SAS Notes” section
    of the Knowledge Base at http://support.sas.com/resources.

    - Registered SAS users or their organizations can access SAS Customer Support
    at http://support.sas.com. Here you post specific questions to SAS Customer Support:
    Under, click Submit a Problem. You will need to provide an e-mail address to which
    replies can be sent, identify your organization, and provide a customer site number
    or license information. This information can be found in your SAS logs.


    # Keep in Touch


    We look forward to hearing from you. We invite questions, comments, and concerns.
    If you want to contact us about a specific book, please include the book title
    in your correspondence to saspress@sas.com.


    # To Contact the Author through SAS Press


    By e-mail: saspress@sas.com


    Via the Web: http://support.sas.com/author_feedback


    # SAS Books


    For a complete list of books available through SAS, visit http://support.sas.com/bookstore.


    Phone: 1-800-727-0025


    E-mail: sasbook@sas.com


    # SAS Book Report


    Receive up-to-date information about all new publications via e-mail by subscribing
    to the SAS Book Report. Visit http://support.sas.com/sbr.


    # Publish with SAS


    SAS is recruiting authors! Are you interested in writing a book? Visit http://support.sas.com/saspress


    # About The Author


    K. Matthew Windham, CAP, is the director of analytics at NTELX Inc., an analytics
    and technology solutions consulting firm located in Washington, DC area. His focus
    is on helping clients improve daily operations through the application of mathematical
    and statistical modeling, data and text mining, and optimization. A longtime SAS
    user, Matt enjoys the breadth of the SAS platform to create innovative, predictive
