    # ### 1.4.3 Data Enrichment


    Data enrichment is the process of using the data that we have to collect additional
    details or information from other sources about our subject matter, enriching
    the value of such data. In addition to parsing and structuring text, we can leverage
    the power of regular expressions in SAS to enrich data.


    So, suppose we are to do some economic impact analysis of the main SAS campus—Cary,
    NC—on the surrounding communities. In order to do this properly, we will need
    to perform statistical analysis using geospatial information.


    The address information is easily acquired from www.sas.com. However, it is useful,
    if not necessary, to include geo-location information such as latitude and longitude
    for effective analysis and reporting of geospatial statistics. The process of
    automating this non-trivial, containing advanced programming steps that are beyond
    the scope of this book. However, it is important for you to understand that the
    techniques used in this book will lead to such sophisticated capabilities in the
    future. To make these techniques more tangible, we will walk through the steps
    and their results.


