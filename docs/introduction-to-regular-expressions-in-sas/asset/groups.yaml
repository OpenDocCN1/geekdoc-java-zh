    ## 第3 章：在 SAS 中使用正则表达式


    第一行表示 `PRXPARSE` 函数中的正则表达式（RegExp）。下一行向我们展示了编译后的正则表达式的大小以及后续代码的起始位置。具体来说，大小 `26`
    指的是 26 行编译后的正则表达式代码（行尾带有分号的行中的数字）；而 `first` 指的是第一行代码执行。每行右侧括号内的数字对应于编译后正则表达式的标签（这些标签的作用类似于我们在第
    2 章中的伪代码标签）。


    第 1 到第 26 行是我们正则表达式中的编译步骤，一旦我们理解了每个步骤代表的含义，它们就会变得易于理解。例如，各种 `OPEN` 和 `CLOSE` 语句对应我们的开启和结束配对；`BRANCH`
    命令对应内部括号对之间的逻辑或 测试；而 `EXACT` 用于关联单词的字符串字面量匹配。`END` 显然意味着子程序的结束。


    剩余的输出是我们的代码正常运行的结果。如果我们的代码出现故障，在调用 `PRXDEBUG` 时我们可能不会看到这样的正常输出。


    ### 3.12：向日志输出调试信息


    + 1 Compiling Reg ((Dog)(Rat)|(Cat))

    size 26 first at 3

    1: OPEN(3)

    3: BRANCH(10)

    4: OPEN(5)

    6: EXACT <Dog>(8)

    8: CLOSE(24)

    10: BRANCH(17)

    11: OPEN(3)

    13: EXACT <Rat>(15)

    15: CLOSE(24)

    17: BRANCH(24)

    18: OPEN(20)

    22: EXACT <Cat>(22)

    24: CLOSE(26)

    26: END(0)

    4 minlen 3

    | matched capture buffer 4 with Cat

    | cannot stand a Cat |

    | matched capture buffer 3 with Rat

    | cannot stand a Rat |

    | matched capture buffer 2 with Dog

    | love dogs|


    + 为 `PRXPARSE` 给出的引号正则表达式开始编译过程。


    + 注意，每个 `OPEN` 和 `CLOSE` 配对都有相同的名称（OPEN1 和 CLOSE1）。这些数字对应于该组括号形成的捕获缓冲区数值。


    + 每一行都以括号内的数字结束，表示从该行跳转的下一行。然而，`END` 标签跳转到 0，这带我们离开了子程序。


    + `minlen` 字段定义了匹配的最小长度为 3。此信息在后续函数和例程使用此编译模式时会被用到。


    ## SAS 正则表达式简介


    更改调试例程调用的位置应该会产生一些有趣的、可能相当长的长的输出。这样做是进一步熟悉 SAS 在我们的 `PRX` 代码后台执行的底层操作的最佳方式。


    `PRXDEBUG` 输出可以提供大量信息，但对调试输出进行更深入的研究超出了本文的范围。有关调试输出及其含义的更多信息，请访问 SAS 支持官方网站。


    ### 3.3.6 CALL PRXFREE


    #### 描述


    此调用使用唯一的 `RegEx_ID` 释放与正则表达式相关的内存资源。对该标识符的后续引用将返回缺失值。


    #### 语法


    ```sas

    CALL PRXFREE(RegEx_ID)

    ```


    RegEx_ID：由 `PRXPARSE` 返回的唯一正则表达式标识符（输入参数，必需）


    此例程用于释放特定 `RegEx_ID` 的内存，对于管理大型程序的内存变得非常重要。记住，尽管仅仅是一个数字，但在 `RegEx_ID` 的构建后台发生了很多操作（参见
    `CALL PRXDEBUG`）。无论如何强调都不为过，SAS 仍然会在会话结束时处理内存清理以避免内存泄漏，但在单个会话中可能会遇到内存限制。请非常有策略地考虑哪些
    `RegEx_IDs`（或任何其他变量）对于每块代码是必须的。


    ### 示例 3.13：使用 CALL PRXFREE 释放内存


    为了演示 `CALL PRXFREE` 的功能，我们重新查看了 `PRXCHANGE` 示例代码的新版本。然而，我们不像原始示例那样打印输出，而是只关注 `CALL
    PRXFREE` 的结果。（参见输出 0.13。）


    如我们在下面的代码所示，`PUT` 语句是在每次使用 `DATA` 步运行时，将 `Street_RXID` 和 `AddParse_RXID` 的值打印到日志中（产生四次日志写入）。然而，使用
    `IF` 语句，我们在最后记录上运行 `CALL PRXFREE` 例程，以释放与两个 `RegEx_ID` 关联的内存。然后，我们将结果打印到日志中。这产生了第五次日志写入，但这次值缺失了，因为我们的例程成功释放了为它们分配的内存——使它们变得无法恢复。


    ## 第 3 章：在 SAS 中使用正则表达式


    ```sas

    data sample;

    input address $50;

    datalines

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St NW, Washington, DC 20001

    650 1st St NE, Washington DC 20002

    3000 K Street NW, Washington, DC 20007

    ;

    run;

    ```


    ```sas

    data null;

    set sample end=last;

    Street_RXID = PRXFASE(''/s|s)?(\w+\s+/St. /o'');

    AddParse_RXID = PRXFASE(''/(.*),(\w+\s+/St. /o'');

    AddParse_RXID = PRXFASE(''/(.*),(\w+);

    if AddParse_RXID;

    then put Street_RXID;

    then put AddParse_RXID;

    run;

    ```


    ```sas

    data null;

    set sample end=last;

    Street_RXID = PRXFASE(''/s|s)?(\w+\s+/St. /o'');

    AddParse_RXID = PRXFASE(''/(.*),(\w+);

    if last then do;

    CALL PRXFREE(Street_RXID);

    CALL PRXFREE(AddParse_RXID);

    end;

    ```


    | | |

    |---|---|

    | 输出 3.13: 释放内存 | | |


    剩余的输出是我们的代码正常运行的结果。如果我们的代码出现故障，在调用 `PRXDEBUG` 时我们可能不会看到这样的正常输出。


    ### 3.4 总结


    在本章中，我们探索了哪些函数和调用，将在下一章中继续探索。


