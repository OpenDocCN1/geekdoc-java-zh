    ## 4.2 Data Cleaning and Standardization


    As data sets, the randomly generated data set that we are going to work with is
    fairly clean. The simple fact we cannot explore all of the data that can be dirty
    in the real world (this book would never end!). Using some realistic data, we
    can test our ability to debug code to process and clean some common problems in
    data sets. This exercise will prepare you to go out in the real world and teach
    you all the necessary tools in your toolkit. Let''s review what we need to clean
    and what things we need to check for this exercise.


    ## Chapter 4: Applications of Regular Expressions in SAS


    - Firstname: The person’s first name. This piece of data should contain character
    only.

    - Surname: The person’s last name. This piece of data should contain character
    only.

    - PhoneNumber: The person’s phone number. Phone numbers in different countries
    are written differently, so we must be prepared to parse a variety of formats—especially
    since it is easy for a business to be from or located in a different country.

    - SSN: The person’s Social Security number. We should see only segments of numbers
    separated by dashes or spaces, and we need to enforce this formatting.

    - DOB: The person’s date of birth. This can be represented in a few ways, but
    we primarily see the classic 8-digit format in the US. European dates represent
    the day before the month. This is where context is very important because it is
    difficult to detect this format unless obvious thresholds are crossed.

    - Address: The person’s address. This data has the most natural variability and
    is the most interesting to parse. We primarily need to be concerned with abbreviations,
    punctuation, and ZIP code lengths.


    Now, as I hinted in the last chapter, data cleansing and standardization is achieved
    by accumulating what to filters. These filters are series of Regex functions and
    routines applied in succession so some incremental changes are implemented. In
    the correct order, we can clean up some messy data for later use. Fortunately
    for us, the data set by the PII generator is relatively tame. But only few things
    need to change in order to become scary again. Regardless, there are a few things
    that we must fix in order to make use of the entire data set in its current state.
    For example, look at 16 from the data set (Output 4.2), we see few issues with
    the address.


