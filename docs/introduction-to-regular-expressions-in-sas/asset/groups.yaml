    \ 2, address);\n    zip = PRXPOSN(text, 3, address);\n    output;\nend;\ndatalines;\n\
    103 Pennsylvania Ave NW, Washington, DC 2016\n508 First St NW, Washington, DC\
    \ 2001\nrun;\n\nproc print data=extract;\nrun;\n```\n\n### 输出 3.5：\n\n| Obs |\
    \ city | state | zip |\n|---|---|---|---|\n| 1 | Washington | DC | 2016 |\n| 2\
    \ | Washington | DC | 2001 |\n\n## 2.5 PRXPAREN\n\n### Description\n\nPRXPAREN\
    \ 返回捕获缓冲区的数值。与 PRXPOSN 类似，在使用此函数之前需要运行 `RSXUBSTR`、`PRMATCH`、`PRXNEXT` 或 `PRCHANGE`。此外，它需要\
    \ RegEx ID 而非实际的正则表达式。\n\n### Syntax\n\n```\nParen=PRXPAREN(RegEx_ID)\n```\n\n\
    - RegEx_ID: 由 `PRXPARSE` 返回的唯一正则表达式标识符（输入参数，必需）\n- Paren: 捕获缓冲区的值（输出，必需）\n\n**注意：**\
    \ 此函数需要 RegEx ID 而非实际正则表达式，否则无法工作。\n\n为了防止代码中出现问题，在处理缓冲区时编写有效的正则表达式是非常有的。\n\n\
    ### 示例 3.6：识别缓冲区\n\n理想情况下，当我们想要使用 PRXPAREN 时，我们需要知道缓冲区的内容。下面的示例演示了如何使用它。\n\n```sas\n\
    data extract;\ninput address $50;\ntext = PRXPARSE('/\\s*(\\w+),\\s*(\\w+),\\\
    s*(\\d+)/');\nif PRXMATCH(text, address) then\ndo;\n    city = PRXPOSN(text, 1,\
    \ address);\n    state = PRXPOSN(text, 2, address);\n    zip = PRXPOSN(text, 3,\
    \ address);\n    max_buf = PRXPAREN(text);\n    output;\nend;\ndatalines;\n103\
    \ Pennsylvania Ave NW, Washington, DC 2016\n508 First St NW, Washington, DC 2001\n\
    run;\n\nproc print data=extract;\nrun;\n```\n\n## 3.3 内置调用函数\n\n在本节中，你将学习用于执行之前讨论的许多任务以及新任务的\
    \ PRX 函数。深入探讨这些差异。\n\n### 3.3.1 CALL PRXCHANGE\n\n### Description\n\n此调用函数执行与\
    \ `PRXCHANGE` 函数类似的匹配和替换操作。与函数版本不同，调用函数必须接收正则表达式标识符。此外，还有一些函数版本中没有的额外参数（长度和截断值）。必需的参数是\
    \ `RegEx_ID`、`Num_Times` 和 `Input_string`。\n\n### Syntax\n\n```\nCALL PRXCHANGE(RegEx_ID,\
    \ Num_Times, Input_string, Output_string, result_length, trunc_value, num_changes)\n\
    ```\n\n- RegEx_ID: 由 `PRXPARSE` 返回的唯一正则表达式标识符（输入参数，必需）\n- Num_Times: 应用更改的次数（输入参数，必需）\n\
    - Input_string: 输入变量（输入参数，必需）\n- Output_string: 输出文本变量（输入参数，可选）。默认为 `Input_string`。\n\
    - result_length: 输出 `Output_string` 的字符长度（返回值，可选）\n- trunc_value: 二进制整数（0 或 1）值（返回值，可选）。1\
    \ 表示插入的文本比被替换的文本长；0 表示插入的文本与被替换的文本等长或短。\n- num_changes: 更改的次数（返回值，可选）\n\n"
