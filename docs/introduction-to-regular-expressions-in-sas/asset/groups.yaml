    </root>\n```\n\n# 78 Introduction to Regular Expressions in SAS\n\nThe primary\
    \ concern is effectively extract information within XML tags. As you can see in\
    \ the figure above, there are some XML tags that are not relevant. They merely\
    \ serve administrative functions for consumption by a system.\n\n```\ndata SECfilings;\n\
    infile 'Introduction to Regular Expressions with\nSAS_4_Example_proceedings_2009.xml'\n\
    length source_text $500 pad;\nvarlen=0;\ninput source_text $varying500;\nstart\
    \ =;\nstop =;\nPattern_ID = PRPARSE('/<(\\w+)>>(.*?)\\<\\w+)>/o');\nCALL PRXNEXT(pattern_ID,\
    \ start, stop, source_text, position, 3)\nDO WHILE (position > 0)\n  tag = PRXOSEN(pattern_ID,1,source_text);\n\
    \  if tag='url' then URL = PRXOSEN(pattern_ID,2,source_text);\n  else if tag='release_number'\
    \ then ReleaseNumber = PRXOSEN(pattern_ID,2,source_text);\n  else if tag='release_date'\
    \ then ReleaseDate = PRXOSEN(pattern_ID,2,source_text);\n  else if tag='respondents'\
    \ then do;\n    Respondents = PRXOSEN(pattern_ID,2,source_text);\n    put releasenumber\
    \ releasedpondents url;\n    end;\n  end;\n  CALL PRXNEXT(pattern_ID, start, stop,\
    \ source_text, position, 3);\nend;\nkeep ReleaseNumber ReleaseDate Respondents\
    \ URL;\nrun;\nprint data=secfilings;\nrun;\n```\n"
