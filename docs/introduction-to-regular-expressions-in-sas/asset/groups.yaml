    SAS 代码时你可以随意处理大小写（例如 DATA vs. data），但这里并非如此。


    ### 2.3.1 通配符


    通配符元字符是一个点（.），匹配任何单个字符值，换行符（n）除外。匹配几乎任何单个字符的能力在搜索字符字符串的超集时可能证明非常有用。当你不知道特定字符位置可能包含什么值时，你可能也想使用它。表
    2.3 提供了示例。


