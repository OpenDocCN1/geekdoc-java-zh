    \ information is: *REDACTED* | 1 | 77 | 0 | 1 |\n| 6 | 3000 K Street NW, Washington,\
    \ DC 20007 | 1 | 80 | 0 | 0 |\n| 7 | Eric can be reached at: *REDACTED* | 1 |\
    \ 76 | 0 | 1 |\n| 8 | 508 First St NW, Washington, DC 20001 | 1 | 80 | 0 | 0 |\n\
    \n### 3.3.2 CALL PRXN\n\n### Description\n\nThis call routine takes the RegEx\
    \ ID provided by PRXPARSE and capture buffer, and returns Position and Length.\n\
    \n### Syntax\n\n```sas\nCALL PRXN(RegEx_ID, N, Position, Length)\n```\n\nRegEx_ID:\
    \ Unique RegEx identifier returned by PRXPARSE (input argument)\n\nN: Integer\
    \ value for the capture buffer (input argument)\n\nPosition: Integer for the character\
    \ position of the match (output argument)\n\nLength: Integer value for the length\
    \ of the match (output argument)\n\n## Chapter 3: Using Regular Expressions in\
    \ SAS 68\n\n### Example 3.9: Context-specific Algorithm Development\n\nSometimes\
    \ it's useful to condition code behavior on specific words occurring in text.\
    \ In this example, you'll see how the functionality of CALL PRXN can be used in\
    \ combination with PRXPAREN, PRXMATCH, and SUBSTR to do just that.\n\nFirst, we\
    \ create the RegEx_ID using PRXPARSE, which is passed to PRXMATCH. If a result\
    \ from PRXMATCH exists (i.e., a pattern match is found), we determine which capture\
    \ buffers in the pattern is matched by PRXPAREN. The output of PRXPAREN is used\
    \ as input to the CALL PRXN routine to create the Position and Length. SUBSTR\
    \ is used to extract the specific text. We then print a message leaving the buffer.\n\
    \n```sas\ndata null_;\ninput text $50;\nRegEx_ID=prxparse('/((Dog) | (Rat) | (Cat))/o');\n\
    \nif prxmatch(RegEx_ID) then do;\n  paren=prxparen(RegEx_ID);\n  CALL PRXN(RegEx_ID,\
    \ paren, position, length);\n  buffer = substr(text, position, length);\n  put\
    \ 'I matched capture buffer ' paren 'with ' buffer;;\nend;\n\nelse paren=2 then\
    \ put 'I love dogs!'\nelse put 'I cannot stand a ' buffer'';\n\ndatalines;\nThe\
    \ Cat in the Hat\nThe Rat in the Hat\nThe Dog on the Roof\n\nrun;\n```\n\n###\
    \ Output 3.9: Log Output of Code Behavior\n\n| matched capture buffer 4 with Cat\
