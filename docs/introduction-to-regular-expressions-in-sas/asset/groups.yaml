    "9" "A" "B" "C" "D" "E" "F" |


    ### 2.4.3 范围 (Range)


    元字符匹配落在字符值范围内的任意字符。换句话说，对于括号内列出的字母，大小写敏感。RegEx 以及 SAS 理解字母和数字的内在顺序。因此，我们可以定义任何数字或字母范围以供此元字符匹配。表
    2.18 提供了示例。


    表 2.18：使用 v- 的示例


    | 用法 | 匹配项 |

    | --- | --- |

    | /[f-m]/ | "g" "h" "j" "k" "l" "m" |

