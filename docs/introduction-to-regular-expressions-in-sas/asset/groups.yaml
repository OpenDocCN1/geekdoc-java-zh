    - 增强数据集以处理单词之间的多个空格、逗号以及意外位置的标点。\n\n# 作业\n\n# 第4 章正则表达式在 SAS 中的应用\n\n## 4.3 信息提取\n\
    \n解析大量文本以生成结构化数据集是正则表达式的一种常见价值用途。例如，我们可能想从技术博客或网站收集有关我们产品的价值反馈。为了进一步分析，此类信息无法手动或廉价地收集。由于需要提取信息的来源广泛，且信息的结束标签众多，有很多方法可以完成这项任务。考虑到\
    \ HTML 和 XML 等标签语言的普及，我们需要准备好有效地提取信息。\n\n现在，由于标签语言的半结构化性质，它们的处理过程比想象的要容易。所有此类语言都有成对的开始和结束标签来定义不同的信息。我们可以利用这一点来正确检测并提取我们需要的信息。\n\
    \n如果有更高级的技术（例如使用 SAS 宏功能），我们实际上可以“学习”嵌入的数据元素并提取发现的变量数据。然而，对这些技术的强调超出了本书的范围。因此，我们还需要知道\
    \ XML 或 HTML 源中我们要寻找的各种标签。我们将使用这种方法处理示例中的 XML 文件。\n\n回到第 1 章的 SEC 行政程序，让我们解析并从示例文件中提取信息：\n\
