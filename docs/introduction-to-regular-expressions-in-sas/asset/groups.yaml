    ## 特殊字符


    特殊字符是有限 ASCII 字符集之一，影响 RegEx 模式的结构和行为。例如，左括号和右括号 `(` 和 `)` 用于在 RegEx 模式中创建字符或元字符的逻辑组。这些将在第
    2.2 节中详细讨论。


    ## RegEx 模式处理


    在此阶段，澄清 SAS 如何处理 RegEx 也同样重要。SAS 从左到右分块读取每个模式，连续读取模式中的每个元素（字符或元字符）。如果我们想找到字符串
    "hello"，SAS 会搜索并找到 "h" 的第一个匹配项。SAS 确定 "e" 是否紧随其后，依此类推，直到找到整个字符串。下面是此的一些伪代码，即使在我们开始用元字符替换字符后，该逻辑仍然成立（只会更令人印象深刻）。


