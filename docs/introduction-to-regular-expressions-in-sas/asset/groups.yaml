    \ K St NW, Washington, DC 20007 |\n\nNow that we've looked at a basic implementation\
    \ of CALL PRXCHANGE, let's explore the optional arguments.\n\n### Example 3.8:\
    \ Redacting Sensitive Data\n\nIn this example, we focus on developing your understanding\
    \ of the optional elements in CALL PRXCHANGE. As a change of pace, we're going\
    \ to develop a basic way to redact sensitive information. This is a frequent need,\
    \ especially in the medical field, for protecting Personally Identifiable Information\
    \ (PII). Now, we're not going to eliminate all PII from the provided data because\
    \ we are just demonstrating the functionality of CALL PRXCHANGE. However, this\
    \ process is done more rigorously in the next chapter and on a larger scale.\n\
    \n### Introduction to Regular Expressions in SAS\n\nIn the code below, we start\
    \ by creating a data set to pass into the DATA step, called example. This data\
    \ set contains name, address, and phone number information in various configurations.\
    \ In the DATA step, we create a RegEx ID using PRXPARSE and then use CALL PRXCHANGE\
    \ to execute the changes prescribed by the RegEx. Notice that one RegEx is commented\
    \ out. The RegEx in that line behaves differently from the initial RegEx ID definition,\
    \ which allows us to demonstrate the trunc num options. We used this RegEx ID\
    \ to create Output 3.8.2. After the DATA step, we perform a PROC PRINT to create\
    \ the output shown in Output 3.8.1 and Output 3.8.2.\n\n```sas\ndata example:\n\
    \  input text $80;\n  datalines:\n    Ken can be reached at (801)443-9876\n  \
    \  103 Pennsylvania Ave NW, Washington, DC 20216\n    JP's address:\n    650 1st\
