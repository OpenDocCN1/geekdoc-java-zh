- md: "\n## Chapter 3: Using Regular Expressions in SAS\n\nThe first line denotes\
    \ of RegExp within the PRXPARSE function. The next line shows us the compiled\
    \ RegExp size and starting location for the lines that follow. Specifically, the\
    \ size of 26 refers to the 26 lines of compiled RegExp code (numbers on the line\
    \ with a trailing semi-colon); and first refers to the first line of code execution.\
    \ The numbers in parentheses to the right of each line correspond to labels for\
    \ the compiled RegExp (these labels work like our pseudo code labels in Chapter\
    \ 2).\n\nLines 1 through 26 are the compiled steps within our RegExp, and they\
    \ become easy to follow once we understand what each represents. For instance,\
    \ the various OPEN and CLOSE statements correspond to our opening and closing\
    \ pairs; BRANCH commands to the OR tests between the inner parenthesis pairs;\
    \ and EXACT is for the string literal match of the associated word. END obviously\
    \ means the end of the subroutine.\n\nThe remaining output is the rest of our\
    \ code running normal. Should our code be malfunctioning, we would not likely\
    \ see such normal output when calling PRXDEBUG.\n\n### 3.12: Debugging Information\
    \ to the Log\n\n+ 1 Compiling Reg ((Dog)(Rat)|(Cat))\nsize 26 first at 3\n1: OPEN(3)\n\
    3: BRANCH(10)\n4: OPEN(5)\n6: EXACT <Dog>(8)\n8: CLOSE(24)\n10: BRANCH(17)\n11:\
    \ OPEN(3)\n13: EXACT <Rat>(15)\n15: CLOSE(24)\n17: BRANCH(24)\n18: OPEN(20)\n\
    22: EXACT <Cat>(22)\n24: CLOSE(26)\n26: END(0)\n4 minlen 3\n| matched capture\
    \ buffer 4 with Cat\n| cannot stand a Cat |\n| matched capture buffer 3 with Rat\n\
    | cannot stand a Rat |\n| matched capture buffer 2 with Dog\n| love dogs|\n\n\
    + The compilation process begins for the quoted RegExp given by PRXPARSE.\n\n\
    + Notice that each OPEN and CLOSE pair have the same name (OPEN1 and CLOSE1).\
    \ These numbers correspond to the numerical value of the capture buffer that was\
    \ formed by that set of parentheses.\n\n+ Each line ends with a number enclosed\
    \ in parentheses, denoting the next line to jump from that line. However, the\
    \ END tag has a jump to 0, which takes us out of the subroutine.\n\n+ The minlen\
    \ field defines the minimum length for the match to be 3. This information is\
    \ used by subsequent functions and routines when using this compiled pattern.\n\
    \n## Introduction to Regular Expressions in SAS\n\nMoving the placement of our\
    \ debug routine call should prove to yield some interesting, and potentially rather\
    \ long, output. Doing so is the best way to become more familiar with the low-level\
    \ operations SAS is performing behind the scenes of our PRX code.\n\nSignificant\
    \ amounts of information can be provided by the PRXDEBUG output, but a much deeper\
    \ study of debug output is outside the scope of this text. For more information\
    \ about debug output and its meaning, visit the SAS Support website.\n\n### 3.3.6\
    \ CALL PRXFREE\n\n#### Description\n\nThis call releases memory resources associated\
    \ with a RegEx, using its unique RegEx_ID. Subsequent references to this identifier\
    \ return a missing value.\n\n#### Syntax\n\n```\nCALL PRXFREE(RegEx_ID)\n```\n\
    \nRegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)\n\
    \nThis routine is used to free up memory for a specific RegEx_ID and becomes very\
    \ important for managing the memory of large programs. Remember, there is much\
    \ happening behind the scenes of the RegEx_ID construction, despite merely having\
    \ a numerical. (See CALL PRXDEBUG.) It can't be stressed enough that SAS still\
    \ handles memory cleanup to avoid memory leaks when a session ends, it is possible\
    \ to run into memory limits within a single session. Think very strategically\
    \ which RegEx_IDs—or any other variables for the matter—are necessary for each\
    \ chunk of code.\n\n### Example 3.13: Releasing Memory with CALL PRXFREE\n\nIn\
    \ order to demonstrate the functionality of CALL PRXFREE, we are revisiting a\
    \ new version of the example code for PRXCHANGE. However, instead of printing\
    \ output as in the original example, we are going to concern ourselves only with\
    \ the results to CALL PRXFREE. (See Output 0.13.)\n\nAs we see in the code below,\
    \ the PUT statement is to print the values of Street_RXID and AddParse_RXID to\
    \ the log for each run using the DATA step (creating four writes to the log).\
    \ However, using the IF statement, we run the CALL PRXFREE routine on the last\
