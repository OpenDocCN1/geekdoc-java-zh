    \ 记录了每行中电话号码脱敏的次数（如果每行有多个电话号码，则在该列中会有相应记录）。\n\n## 第 3 章：在 SAS 53 中使用正则表达式\n\n\
    ### 输出 3.8.1：SAS PROC PRINT 结果\n\n### SAS 系统\n\n| Obs | text | RegEx_ID | length\
