    # Chapter 2: Getting Started with Regular Expressions 35


    There are numerous examples for how these zero-width characters can be used. For
    instance, perhaps you want to match a particular word, but only if it occurs at
    the beginning of a line.


    # 2.7.1 Start of Line


    The metacharacter ^ matches the beginning of a line or string. Depending on the
    text that we are processing, we might need a priori to knowing something specific.
    For example, we might be looking for the beginning of a new paragraph, which could
    be denoted by a new line in combination with a capital letter and no preceding
    space. Or we might need to be prepared to match an address that includes a new
    line for the city, state, and zip. Table 2.40 provides examples.


    Table 2.40: Example using ^

    | Usage | Matches |

    | --- | --- |

    | /^Washington, DC 20007/ | Washington, DC 20007 |

    | /\w+\b/ | The first word in a string.


    Note: This metacharacter is often used as the logical NOT symbol, including within
    the character class metacharacters discussed in Section 2.3 and in SAS code. So
    be careful not to get confused in its usage when switching contexts.


    # 2.7.2 End of Line


    The metacharacter $ matches the end of a line or string. There are numerous situations
    in which this might become relevant, similar to the reasons for the ^ metacharacter.
    Table 2.41 provides examples.


    Table 2.41: Example using $\$

    | Usage | Matches |

    | --- | --- |

    | /3000 K Street NW,$/ | "3000 K Street NW," |

    | /\$d+?\{2}s*?/ | "$150.52


    # 2.7.3 Word Boundary


    The metacharacter \b matches a word boundary. The \b Assertion metacharacter is
    zero-width because it actually represents the invisible gap between two characters,
    with a \w character on one side and \W on the other. Therefore, when you use this
    metacharacter, you won''t generate matches that contain the associated non-word
    character. Table 2.42 provides examples.'
