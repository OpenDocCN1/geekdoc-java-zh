    ```sas

    /*Next, we take a simple random sample of a fixed number of names*/

    proc surveyselect data=firstnames method=srs n=25

    out=firstnamesSRS;

    run;

    proc surveyselect data=surnames method=srs n=25

    out=surnamesSRS;

    run;

    ```


    ```sas

    /*We must create an index value to perform match-merge on later*/

    data firstnamesSRS;

    set firstnamesSRS;

    Num_=N_;

    run;

    data surnamesSRS;

    set surnamesSRS;

    Num_=N_;

    run;

    ```


    ```sas

    data PIINumbers;

    n = 25; /*Determines the number of records we will create.*/

    ```


    ```sas

    /*Arrays used for random day below*/

    array x x1-x12 (1:12);

    array d d1-d28 (1:28);

    array a a1-a30 (1:30);

    array y y1-y31 (1:31);

    array z z1-z20 (1974:1994);

    seed=1234567890123; /*Random Number Seed Value*/

    ```


    ```sas

    i = 1 to n; /*Master Loop for PhoneNumber, Date of Birth, and SSN*/

    Num=i; /*Num is used as a unique index value for dataset merging*/


    /*First, we randomly create the number segments*/

    CountryCode = Strip(INT(10*rand(''UNIFORM'')));

    AreaCode = Compress(INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')));

    NextThree = Compress(INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')));

    LastFour = Compress(INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')))|INT(10*rand(''UNIFORM'')));


    /*Next, we randomly create common separator types*/

    separator = rand(''UNIFORM'');

    if separator >= .66 then do;

    PhoneNumber = Compress(CountryCode)|''-''|AreaCode|''-''|NextThree||''-''|LastFour;

    end;

    else if separator >=.33 and separator <66 then do;

    PhoneNumber = Compress(CountryCode)|''-''|AreaCode|''-''|NextThree||''-''|LastFour;

    end;

    else if separator <.33 then do;

    /*Social Security Number*/

    SSN=Compress(INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))|INT(10*rand(''UNIFORM''))));


    /*Date Of Birth*/

    call ranperk(seed, 1, of x1-x12);

    month=x;

    if x=2 then do

    call ranperk(seed, 1, of d1-d28);

    day=d;

    end;

    else if x1 in (4,6,9,11) then do;

    call ranperk(seed, 1, of a1-a30);

    day=a;

    end;

    else if x1 in (3,5,7,8,10,12) then do;

    call ranperk(seed, 1, of y1-y31);

    day=y;

    end;

    call ranperk(seed, 1, of z1-z20);

    year=z;

    DOB=compress(month|''-''|day|''-''|year);


    /*OUTPUT must be explicit within the DO LOOP/The DATA step runs once because there
    is no data.*/

    keep Num SSN DOB PhoneNumber;

    run;


    /*Now we extract the addresses using RegEx*/

    data Addresses;

    infile ''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example\addresses.txt''
    length=500;

    source_text $500;

    pattern = "(\d+)-(.+)";

    pattern_ID = prxparse(pattern);

    position = PRXMATCH(pattern_ID, source_text);

    if PRXMATCH(pattern_ID, source_text) then do;

    Num = PRXPOSN(pattern_ID, 1, source_text);

    Address = PRXPOSN(pattern_ID, 2, source_text);

    end;

    keep Num Address;

    run;


    proc print data=addresses;

    run;


    /*Now, we create the PII dataset with merge*/

    data PII;

    merge firstnamesSRS PIINumbers addresses;

    by Num;

    drop Num;

    run;


    proc print data=PII;

    run;

    ```


    ## Chapter 4: Applications of Regular Expressions in SAS


    We start with an easy way to create pseudo random names, by just creating name
    data sets using data lines. It is not elegant or short, but it gets the job done
    for our purposes.


    Here we are sampling the name data, using simple random sampling and a sample
    size of n=25. The sample size is completely arbitrary and chosen to match the
    number of other random values created in the code.


    The arrays are created to ensure that duplicate values can be created for our
    arbitrary range of years. To avoid any complications, we are ignoring leap years
    (no Feb 29th in the set of possibilities) and using an array of 4-digit years.
    The seed value is an arbitrary number.


    Now, we construct the phone number by using the RAND function (UNIFORM option)
    to generate the individual digits. The INT function takes the integer portion
    of a value, multiplying the random value between 0 and 1 by 10 and the INT function
    yields a single digit between 0 and 9. This method ensures that zero values are
    not dropped (a leading zero would otherwise be held). Other methods can achieve
    the same outcome, but this is a straightforward implementation without the need
    for arrays. The COMPRESS function is used to remove all spaces between the connected
    values. However, removing this is an easy way to make the data messy.


    After creating the individual chunks of a phone number, we randomly assign separator
    types in an effort to demonstrate the various representations that might be expected
    in practice.


    Next, we create Social Security numbers (SSNs) by applying the same techniques
    as with the phone numbers immediately after. However, we are not normalizing the
    separator. It is less often an issue, but you could do it as an extracurricular
    exercise.


    We now build the date of birth (DOB) using the arrays discussed in and the RANPERK
    function. This function creates permutations of the provided arrays and provides
    k values from the results. Other methods could have been employed, but this is
    a simple approach to create random date elements within a specific range (i.e.,
    valid dates).


    The DATA step for addresses uses some RegEx functionality to extract addresses
    from a text file, with the Num value that allows us to perform a match-merge in
    the next step.


    This final DATA step creates a single data set, PII, from the above elements.


    Output 4.1 displays the final data set created by our code, Rand_PII_Generator.sas.
    As expected, it contains 25 pseudo-random PII elements to support some of our
    upcoming examples.

