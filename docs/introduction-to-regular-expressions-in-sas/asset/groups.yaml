    # 3.3.2 CALL PRXPOSN


    # Description


    This call routine takes the RegEx_ID provided by PRXPARSE and the numerical capture
    buffer position\N as inputs. It produces the matching Position and Length as outputs.


    # Syntax


    ```

    CALL PRXPOSN(RegEx_ID, N, Position, Length)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    N: Integer value for the capture buffer (input argument, required)


    Position: Integer for the length of the character position for the first character
    in the matched pattern (returned\Nvalue required)


    Length: Integer value for the length of the matched pattern (returned value, optional)


    This call routine takes the RegEx_ID (RegEx is not allowed!) and capture buffer,
    and returns the exact\Nlocations where it occurs in the most recent match. The
    match results from PRXMATCH,

    PRXCHANGE, PRSUBSTR, or CALL PRNEXT (discussed in Section 3.3.4) must exist in
    order for

    CALL PRXPOSN to work properly. We then must use the SUBSTR function to extract
    the identified

    text.'
  - "[PAGE 68]\n\n# Chapter 3: Using Regular Expressions in SAS\n\n# Example 3.9:\
    \ Context-specific Algorithm Development\n\nSometimes it's useful to condition\
    \ code behavior on specific words occurring in text. In this example, you'll see\
    \ how the functionality of CALL PRXPOSN can be used in combination with PRXPAREN,\
    \ PRXMATCH, PRXPARSE, and SUBSTR to do just that.\n\nFirst, we create the RegEx_ID\
    \ using PRXPARSE, which is passed to PRXMATCH. If a result from PRXMATCH exists\
    \ (i.e., a pattern match is found), we determine whether the capture buffers in\
    \ the pattern is matched by PRXPAREN. The output of PRXPAREN is used as input\
    \ to the CALL PRXPOSN routine to create the Position and Length. SUBSTR is used\
    \ to extract the specific text. We then print a message, leaving on the buffer.\
    \ See the results in Output 3.9.\n\n```\ndata null_;\ninput text $50;\nRegEx_ID=prxparse('/((Dog)\
    \ | (Rat) | (Cat))/o');\n\nif prxmatch(RegEx_ID) then do;\n  paren=prxparen(RegEx_ID);\n\
    \  CALL PRXPOSN(RegEx_ID, paren, position, length);\n  buffer = substr(text, position,\
    \ length);\n  put 'I matched capture buffer ' paren 'with ' buffer;;\nend;\n\n\
    else paren=2 then put 'I love dogs!'\nelse put 'I cannot stand a ' buffer''';\"\
