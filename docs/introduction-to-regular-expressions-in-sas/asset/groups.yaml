    # Introduction to Regular Expressions in SAS


    Moving the placement of our debug routine call should prove to yield some interesting,
    and potentially rather long, output. Doing so is the best way to become more familiar
    with the low-level operations SAS is performing behind the scenes of our PRX code.


    Significant amounts of information can be provided by the PRXDEBUG output, but
    a much deeper study of debug output is outside the scope of this text. For more
    information about debug output and its meaning, visit the SAS Support website.


    # 3.3.6 CALL PRXFREE


    # Description


    This call releases memory resources associated with a RegEx, using its unique
    RegEx_ID. Subsequent references to this identifier return a missing value.


    # Syntax


    ```

    CALL PRXFREE(RegEx_ID)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    This routine is used to free up memory for a specific RegEx_ID and becomes very
    important for managing the memory of large programs. Remember, there is much happening
    behind the scenes of the RegEx_ID construction, despite merely having a numerical.
    (See CALL PRXDEBUG.) It can''t be stressed enough that SAS still handles memory
    cleanup to avoid memory leaks when a session ends, it is possible to run into
    memory limits within a single session. Think very strategically which RegEx_IDs—or
    any other variables for that matter—are necessary for each chunk of code.


    # Example 3.13: Releasing Memory with CALL PRXFREE


    In order to demonstrate the functionality of CALL PRXFREE, we are revisiting a
    new version of the example code for PRXCHANGE. However, instead of printing output
    as in the original example, we are going to concern ourselves only with the results
    to CALL PRXFREE. (See Output 0.13.)


    As we see in the code below, the PUT statement is to print the values of Street_RXID
    and AddParse_RXID to the log for each run using the DATA step (creating four writes
    to the log). However, using the IF statement, we run the CALL PRXFREE routine
    on the last record to release the memory associated with both RegEx_IDs. Then,
    we print the results to the log. This creates a fifth write to the log, but the
    values are missing this time because our routine was successful at releasing the
    memory allocated for them—making them unrecoverable.'
