    \ 5\n\n### 1.1 本书目的\n\n本书适用于几乎所有技能水平的 SAS 程序员。然而，我们预计你至少具备 SAS 语言的基础知识，包括 DATA\
    \ 步以及如何使用 SAS PROC 过程。\n\n本书提供了你学习所需的所有工具，帮助你掌握如何在 SAS 编程语言中利用正则表达式的力量。这些信息为相当高级的应用奠定了基础，这些应用将在本章作为动机性示例进行简要讨论。我们呈现这些内容并不是为了吓唬或让你无从适从，而是为了鼓励你带着能够快速实现所学内容的预期，继续阅读接下来的页码。\n\
    \n### 1.2 本书结构\n\n我的目标是提供立即可可用的信息。因此，每一章的结构都将引导你完成应用的每一个步骤，遵循以下流程：语法 ► 示例。除了后续章节讨论的信息外，附录中还包含了一份正则表达式参考指南，以帮助处理本文范围之外的更高级应用。\n\
    \n第一章\n\n本章在为本书其余部分提供路线图的同时，还提供了关于你如何在现实世界中使用这些信息的动机性示例。\n\n第二章\n\n本章介绍了正则表达式的基本语法和概念。书中甚至包含了一些\
    \ SAS 代码，用于运行与每个新概念相关的示例。\n\n## 2 SAS 中的正则表达式简介\n\n第三章\n本章的设计初衷是详细阐述在 SAS 语言中实现正则表达式的细节。\n\
    \n第四章\n在最后一个章节中，我们将处理一系列深度示例——如果你愿意，可以称之为案例研究——以便将“所有内容整合在一起”。这些示例并不代表你读完本书后所能做的局限性，而是为可能性的提供了一些基础思维。\n\
    \n附录\n虽然并不详尽，但可以作为正则表达式、SAS 文档和参考表的价值且实实的参考。我希望每个人都能利用这些额外信息来丰富当前和未来的正则表达式能力。\n\
    \n### 1.3 定义正则表达式\n\n在继续下去之前，我们需要定义什么是正则表达式。\n\n采用非常正式的定义可能无法提供理想的清晰度：\n\n定义 1（正式）\n\
    正则表达式：“正则表达式由常量和运算符符号组成，它们分别表示字符串集以及对这些集合进行的操作。”\n\n为了清晰起见，我们将使用一个稍微松散的正则表达式定义。由于实际应用是我们的首要目标，固守任何晦涩的定义都是意义的。因此，对于我们的目的而言，我们将使用以下定义：\n\
    \n定义 2（更易理解——我们的定义）\n正则表达式：用于自动搜索和匹配的模式。\n\n在 SAS 中编程时，正则表达式被视为字母和特殊字符的字符串，这些字符由内置的\
    \ SAS 函数识别，用于搜索和匹配。结合内置的 SAS 函数和过程，我们可以实现巨大的能力，其中一些我们将在下一节中进行探索。\n\n注意：SAS 使用的正则表达式语法与\
    \ Perl 语言相同。因此，在整个 SAS 文档中，你会发现正则表达式反复被称为“Perl 表达式”。在书中，我选择 SAS 文档中的约定，除非 Perl\
    \ 约定对程序员来说更为常见。要了解更多关于 SAS 如何看待 Perl 的信息，请访问此网站：\nhttp://support.sas.com/documentation/cdl/enfunctionsref/67239/HTML/default/viewer.html#p0s9ilaagemxjl8n1u7e1ijfnzlk.htm。要了解更多关于\
    \ Perl 编程，请访问 http://perldoc.org/perl/re.html。但在书中，我主要省略了对 Perl 的引用，因为可能会引起混淆。\n\
    \n## 第一章：引言\n\n### 1.4 动机性示例\n\n书中的信息对于广泛的应用非常有用。然而，在你阅读它之前，这一点不会显而易见。因此，为了直观展示你如何在工作中中使用这些信息，我提供了一些真实的示例。\n\
    \n你们可能都熟悉数据，即数据提供给分析师的形式很少是直接可用的。在这些源数据之前，通常需要对它们进行清洗、转换和增强——尤其是文本数据。以下示例决定了书中稍后讨论的编码细节，但它们在不同复杂程度上展示了这些概念。这里的主要目标仅仅是帮助你看到这些信息的用处，并开始思考利用它们的方法。\n\
    \n### 1.4.1 提取、转换与加载 (ETL)\n\nETL 是一套通用流程，用于从源提取数据、修改以适应你的最终需求，并将其加载到目标位置以便你进行最佳处理（例如：数据库、数据存储、仓库）。我们将从一个相当典型的示例开始。假设我们有一个包含客户地址的\
    \ SAS 数据集，其中包含一些质量问题。我们不知道记录数据的方法，但视觉检查已经显示了许多重复记录的情况，如下表所示。在这个示例中，它们显然是相同的，只是略微\n\
    \n| 名字 | 姓氏 | 生日 | 城市 | 邮编 |\n| --- | --- | --- | --- | --- |\n| Robert | Smith\
    \ | 2/5/1967 | Fairfax | 22030 |\n| Robert | Smith | 2/5/1967 |\n\n## 4 SAS 中的正则表达式简介\n\
    \n## 4 SAS 中的正则表达式简介\n\nmoney! 对于涉及 ETL 以及如何解决此常见问题的详细示例，请参见第 4 章的 4.2 节。\n\n\
    ### 1.4.2 数据处理\n\n假设你被了一了一任务，为过去一年的所有证券交易委员会 (SEC) 创建报告。然而，源数据只是一堆 (XML) 文件，如图\
    \ 1.1 所示。对于未经训练的人来说，这看起来像是一堆乱码；对于经过训练的人来说，这看起来像是大量工作。\n\n图 1.1：2009 年行政程序的示例\n\
