    在我们查看示例时，请注意我们如何获得一些意想不到的结果。在使用这些某些 RegExp 元字符时，采取非常有策略的方法是非常重要的，因为你并不总是知道你正在处理的文本中会预期什么。当你非常熟悉来源时，不可避免地会有错误或未知的变化，这可能会破坏设计不当模式。因此，像任何出色的分析师一样，你需要向前思考几步，以保持健壮的
