    **Note:** This metacharacter does not have an opposite (i.e., \T does not exist).


    # 2.3.5 Whitespace


    The metacharacter \s matches on a single whitespace character, which includes
    the space, tab, newline, carriage return, and form feed characters. You must include
    this when you are matching on anything in text that is separated by white space,
    and you are unsure of which will occur. Table 2.7 provides examples.


    Table 2.7: Examples using \s


    | Usage | Matches |

    |---|---|

    | /SAS\s/ | "SAS " "SAS " |

    | /SAS\InstituteInc/ | "SAS Institute Inc" "SAS Institute Inc" |

    | /Street\s/ | "Street " "Street " |


    **Note:** This form of the \s metacharacter matches only one whitespace character.
    We review how to find multiple matches in Section 2.5.2 because that is frequently
    needed when you are matching text.


    # 2.3.6 Non-whitespace


    The metacharacter \S matches on a single non-whitespace character—the exact opposite
    of \s. This metacharacter is often used to account for unexpected dashes, apostrophes,
    commas, and so on, that might otherwise prevent a match. Table 2.8 provides examples.


    Table 2.8: Examples using \S


    | Usage | Matches |

    |---|---|

    | /Leonato/Ss/ | "Leonato''s" "Leonatoos" "Leonato_s" ... |

    | /Washington/S/ | "Washingtons" "Washington," ... |

    | /Street''S/ | "Street," "Streets" "Street+" "Street_ ... |


    # 2.3.7 Digit


    The metacharacter \d matches on a numerical digit character (i.e., 0-9). This
    RegEx metacharacter is probably the most straightforward as it has a very narrow
    focus. Remember that a single occurrence of \d is for only one character position
    in any text. To capture larger numbers (i.e., anything greater than 9), you have
    to build patterns with multiple occurrences of \d. Table 2.9 provides examples,
    but we discuss more sophisticated methods for accomplishing this later in the
    chapter. (See “Repetition Modifiers” in Section 2.4.2).'
