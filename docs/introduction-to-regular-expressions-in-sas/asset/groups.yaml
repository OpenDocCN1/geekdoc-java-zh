    ## 4.1.1 Random PII Generator


    The following code was developed to provide a set of randomly generated elements
    for the purposes of the following examples. This process is an effort to replicate
    the kind of data we all see on a regular basis, PII, without encountering the
    usual issues associated with it. As we will see in the code, every effort was
    made to make these elements feel real. However, it is worth noting that advanced
    techniques (and more efficient techniques) were not employed for the introductory
    nature of this text. If you''re interested, use this code as a baseline to develop
    a more sophisticated and efficient random PII generator. Doing so is a great way
    to support both learning and real-world work.


    Note: All occurrences of PII shown in the coming pages were generated in a random
    fashion. Any resemblance to actual PII is completely coincidental.


    A static snapshot of randomly generated data is used below, and it is not guaranteed
    to be replicated. The parameters for any data set generated by this code will
    be the same for any data set. Also, the code uses a few different methods for
    creating the data elements. I want to demonstrate the variety of methods available
    to us for doing any task in SAS.


    Much of this code is unavoidably long due to the steps taken to create names,
    addresses, and other information. Unlike the example in the previous chapter,
    all code going forward is heavily commented and diagrammed to ensure that you
    fully understand every element.


    ```sas

    /*First, we create datasets for First and Last names*/

    data FirstNames;

    input FirstName $20;

