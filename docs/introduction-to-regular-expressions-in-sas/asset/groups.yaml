    ```

    START IF POS = "h" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" THEN MATCH=TRUE END ELSE POS+1 GOTO START


    END

    ```


    在这个伪代码中，我们看到 START 标签是我们算法的启动，END 标签表示算法的终止。同时，NEXT 标签告诉我们跳到下一行伪代码，而 GOTO 标签告诉我们跳转到其中的指定行。POS
    标签表示字符位置。我们还在代码中运用了 IF、THEN 和 ELSE 逻辑。


    再次，这演示了在某些文本源中搜索 "hello"。算法通过测试第一个字符位置是否为 "h" 来启动。如果不是，则算法将字符位置增加一——并再次测试 "h"。如果第一个位置是
    "h"，则增加字符位置，并执行字母 "e" 的代码。这会持续直到找到单词 "hello"。


