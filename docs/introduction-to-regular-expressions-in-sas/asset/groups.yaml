    # Appendix A: Perl Version Notes


    This appendix contains notes about the limitations of the Perl version that is
    used by SAS 9.4¹. It is intended for the Perl experts who are wondering about
    some of the missing pieces within SAS. The information below was taken directly
    from the SAS website and is provided here because it is somewhat difficult to
    find but potentially very useful to the advanced reader of this book.


    "PRX functions used a modified version of Perl 5.6.1 to perform regular expression
    compilation and matching. Perl is compiled into a library for use with SAS. This
    library is shipped with SAS 9². The modified and original Perl 5.6.1 files are
    freely available in a ZIP file from the Technical Support Web site. The ZIP file
    is provided to comply with the Perl Artistic License and is not required in order
    to use the PRX. Each of the modified files has a comment block at the top of the
    file describing how and when the file was changed. The executables were given
    nonstandard Perl names. The standard version of Perl can be obtained from the
    Perl Web site.


    Only Perl regular expressions are accessible by the PRX functions. Other parts
    of the Perl language are not accessible. The modified version of Perl [RegEx]
    does not support the following:"*


    +   - All Perl variables, except for the capture buffers $1 - $\$

    - Metacharacters G, \p, \P, and \X

    - RegEx options /c and /g, and with substitutions

    - Named characters (i.e., {name})

    - Executing Perl code within a regular expression, which includes the syntax (?code),
    {code}, and (?code)

    - Unicode pattern matching

    - Pattern delimiters other than the backlash. For example: ?PATTERN?, !PATTERN!,
    etc.

    - Perl code comments between a pattern and replacement text. For example: s{regexp}
    #perl comment {replacement}

    - Using backslashes with m\ instead of m\V to match a backlash


    > ¹The available Perl RegEx functionality has not changed since SAS 9.1. These
    notes are as of the writing of this book. at: http://support.sas.com/documentation/

    ²http://support.sas.com/documentation/cdn/enlefunctionsref/67239/HTML/default/viewer.htm#p0tw80fkqqpow5n1f7xwvd6bsonq.htm'
