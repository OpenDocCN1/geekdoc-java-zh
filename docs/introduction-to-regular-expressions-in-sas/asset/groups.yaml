    # Introduction to Lazy Repetition Modifiers


    Now that you are familiar with greedy modifiers, let''s begin examining the lazy
    ones. In terms of syntax, they differ from greedy modifiers only by the addition
    of a question mark (?). By adding the question mark immediately after each of
    the greedy modifiers, we are able to subtly change their behavior—in unexpected
    ways.


    In general, lazy modifiers are used to avoid overmatching and improve performance
    compared to greedy modifiers. There are situations when matching with greedy modifiers
    would lead to either grabbing too much information, or simply slowing down system
    performance. For instance, processing semi-structured text files as HTML or XML
    is a great example of when lazy modifiers would come in.


    # Lazy 0 or More


    The modifier {*} creates a match 0 or more times, but as few as necessary to create
    the match. In some situations, it creates as many matches as the greedy modifier.
    However, in other cases, the results are very different. To make it clearer, Table
    2.30 describes the details of a few examples.'
