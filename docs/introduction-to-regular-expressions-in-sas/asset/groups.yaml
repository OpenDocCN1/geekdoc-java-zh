    # Chapter 2: Getting Started with Regular Expressions


    **Note:** Notice that other metacharters are not allowed inside \L...\E or \U...\E
    metacharters. In other words, \w can''t be used to replace the character classes
    above.


    # Quote Range


    The metacharacter \Q...\E matches all content inside the \Q and \E as character
    strings, disabling everything including the backslash character. Metacharacters
    cannot be used inside ''\Q...\E. The functionality provided by this metacharacter
    is great for searching within strings that contain a significant number of reserved
    characters, such as XML, webserver logs, or HTML. Table 2.23 provides examples.


    | Usage | Matches |

    | --- | --- |

    | \Q<html name>\E/ | "<html name>" |

    | \Qf(x) + f(y)=z\E/ | "f(x) + f(y)=z" |

    | \Q!<!DOCTYPE HTML> <html name="en-US">\E/ | "!<!DOCTYPE HTML> <html name="en-US">"
    |


    # 2.5 Repetition Modifiers


    Repetition modifiers change the matching behavior of the metacharacters and characters
    immediately preceding them in a pattern. They can also modify the matching repetition
    of an entire group—defined using ( ) to surround the group of metacharacters and
    characters before the modifier. Just keep in mind that repetition of the entire
    group means that it repeats-to-back (e.g., “haha”), unless we also modify the
    individual metacharacters.


    Now, there are two types of repetition modifiers, *greedy* and *lazy*. Greedy
    modifiers attempt to find as many times as possible within the confines of their
    definition. Lazy modifiers attempt to find a match as few times as possible. They
    have similar uses, which can make the difference between their results subtle.


    # Introduction to Greedy Repetition Modifiers


    Let''s start discussing greedy modifiers because they are a little more intuitive
    to use. As we go through them, it is important to keep in mind that greedy modifiers
    match as many times as possible—constantly searching for the last possible time
    match is true. It is easy to create patterns that match differently from what
    you might expect.


    There is a concept in RegEx known as *backtracking*, which is the root cause for
    potential issues with greedy modifiers (hint: backtracking in the need for lazy
    modifiers). As we discuss further when we examine lazy modifiers, a greedy modifier
    actually tries to maximize the matches of a modified pattern chunk by searching
    until the match fails. Upon failure, the system backtracks to the position where
    the modified chunk last matched. The processing time wasted with a single match
    is insignificant. However, as soon as we introduce a few additional factors, the
    problem can waste tremendous computing cycles—multiple modified pattern chunks,
    numerous match'
  - '[PAGE 39]


    # 26 Introduction to Regular Expressions in SAS


    iterations (think loops), and large data sources. It is important to be mindful
    of these factors when designing patterns as they can have unintended consequences.


    # Greedy 0 or More


    The modifier * requires the immediately preceding character or metacharacter to
    match 0 or more times. It enables us to generate unlimited optional matches within
    text. For example, we might want to match every occurrence of a word root, with
    all of its prefixes and suffixes. By allowing the prefixes and suffixes to be
    optional, we are able to achieve this goal. Table 2.24 provides examples.


    Table 2.24: Examples using *


    | Usage | Matches |

    | --- | --- |

    | /Sing/w*/ | "Sings" "Sings" "Singing" "Singer" "Singers" ... |

    | /D\W*C\*/ | "DC" "D.C" "D C " "D-...!%^\ C-)*&%" ... |

    | /19\D+Street/ | "19th Street" "19thStreet" "19Street" ... |

    | /Hello*/ | "Hell" "Hello" "Hellooooooooo" ... |


    # Greedy 1 or More


    The modifier + requires the immediately preceding character or metacharacter to
    match 1 or more times. The plus sign modifier works similarly to the asterisk,
    with the exception that it enforces a match of the metacharacter or at least 1
    time. Table 2.25 provides examples.


    Table 2.25: Examples using +


    | Usage | Matches |

    | --- | --- |

    | /Ru/w+/ | "Run" "Ruin" "Grunt" "Runners" ... |

    | /\U[a-z]+E/s/ | Words with all letters capitalized, and surrounded by spaces.
    |

    | /19\D+Street/ | "19th Street" "19...Street" ... |

    | /(ha)+ | "hahahahahahaha" |


    Pay attention to the addition of the \ metacharacter in the second example in
    Table 2.24. If it were not present, the pattern would match only single capital
    letters at the beginning of words. By adding \s, the pattern creates a whitespace
    character to immediately follow the one or more characters, eliminating matches
    on single letters at the beginning of words.


    # Greedy 0 or 1 Time


    The modifier ? creates a match of 0 or 1 time. The question mark provides the
    ability to make the occurrence of a metacharacter optional without allowing it
    to match multiple times. This can be effective'
