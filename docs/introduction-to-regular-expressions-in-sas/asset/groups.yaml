    \ its meaning, visit the SAS Support website.\n\n### 3.3.6 CALL PRXFREE\n\n####\
    \ Description\n\nThis call releases memory resources associated with a RegEx,\
    \ using its unique RegEx_ID. Subsequent references to this identifier return a\
    \ missing value.\n\n#### Syntax\n\n```\nCALL PRXFREE(RegEx_ID)\n```\n\nRegEx_ID:\
    \ Unique RegEx identifier returned by PRXPARSE (input argument, required)\n\n\
    This routine is used to free up memory for a specific RegEx_ID and becomes very\
    \ important for managing the memory of large programs. Remember, there is much\
    \ happening behind the scenes of the RegEx_ID construction, despite merely having\
    \ a numerical. (See CALL PRXDEBUG.) It can't be stressed enough that SAS still\
    \ handles memory cleanup to avoid memory leaks when a session ends, it is possible\
    \ to run into memory limits within a single session. Think very strategically\
    \ which RegEx_IDs—or any other variables for the matter—are necessary for each\
    \ chunk of code.\n\n### Example 3.13: Releasing Memory with CALL PRXFREE\n\nIn\
    \ order to demonstrate the functionality of CALL PRXFREE, we are revisiting a\
    \ new version of the example code for PRXCHANGE. However, instead of printing\
    \ output as in the original example, we are going to concern ourselves only with\
    \ the results to CALL PRXFREE. (See Output 0.13.)\n\nAs we see in the code below,\
    \ the PUT statement is to print the values of Street_RXID and AddParse_RXID to\
    \ the log for each run using the DATA step (creating four writes to the log).\
    \ However, using the IF statement, we run the CALL PRXFREE routine on the last\
    \ record to release the memory associated with both RegEx_IDs. Then, we print\
    \ the results to the log. This creates a fifth write to the log, but the values\
    \ are missing this time because our routine was successful at releasing the memory\
    \ allocated for them—making them unrecoverable.\n\n## Chapter 3: Using Regular\
    \ Expressions in SAS\n\n```\ndata sample;\ninput address $50;\ndatalines\n103\
    \ Pennsylvania Ave NW, Washington, DC 20216\n508 First St NW, Washington, DC 20001\n\
    650 1st St NE, Washington DC 20002\n3000 K Street NW, Washington, DC 20007\n;\n\
    run;\n```\n\n```\ndata null;\nset sample end=last;\nStreet_RXID = PRXFASE('/s|s)?(\\\
    w+\\s+/St. /o');\nAddParse_RXID = PRXFASE('/(.*),(\\w+\\s+/St. /o');\nAddParse_RXID\
    \ = PRXFASE('/(.*),(\\w+);\nif AddParse_RXID;\nthen put Street_RXID;\nthen put\
    \ AddParse_RXID;\nrun;\n```\n\n```\ndata null;\nset sample end=last;\nStreet_RXID\
    \ = PRXFASE('/s|s)?(\\w+\\s+/St. /o');\nAddParse_RXID = PRXFASE('/(.*),(\\w+);\n\
    if last then do;\nCALL PRXFREE(Street_RXID);\nCALL PRXFREE(AddParse_RXID);\nend;\n\
    ```\n\n| | |\n|---|---|\n| Output 3.13: Releasing Memory | | |\n\nThe remaining\
    \ output is the rest of our code running normal. Should our code be malfunctioning,\
    \ we would not likely see such normal output when calling PRXDEBUG.\n\n### 3.4\
