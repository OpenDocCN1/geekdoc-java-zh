    \ RegEx_ID | length | trunc_val | num_changes |\n|---|---|---|---|---|---|\n|\
    \ 1 | Ken be reached at: *REDACTED* | 1 | 77 | 0 | 1 |\n| 2 | Pennsylvania Ave\
