    \ RegEx 模式以允许显示城市（City）（对于像 New York 这样双单词的名称比较复杂）。\n- 2. 结合第 4.2 节作业第 5 题的结果，以便显示人口普查跟踪。\n\
    - 3. 使用第 4.1 节中的 PII 生成器引入一个全新的字段来显示此输出。\n- 4. 通过引入零宽元字符（如单词边界 `\\b`）使此代码更具健壮性，确保正确识别单词边缘。\n\
    \n# 4.5 总结\n\n在本章中，我们通过一系列示例将这些内容整合在一起，这些示例涉及了在 SAS 中使用的多种正则表达式。希望这些示例每个都是具有启发性、教育意义且实用的——并且实际上帮助前几章变得更有意义。\n\
    \n我们处理了三个长示例——“数据清洗与标准化”、“信息提取”以及“搜索与替换”，这些示例解决了许多常见的需求，并且可以推广到许多场景。这些场景包括但不限于：执法、零售、电子商务、金融和国防。\n\
    \n到此时，你已经拥有了将这些信息应用于现实世界高度复杂问题的所有工具和经验。在开始之前，这里是一些提醒。\n\n# 4.5.1 从小开始\n\n从简单任务开始并在此基础上构建其益处不容忽视。通过仅在一个大问题的一个小部分上实现\
    \ RegEx 能力，你能够仔细地构建每个元素——最终以更少的工作量更快地解决整个问题。这也让初学者能够发展能力而不会不知所措，这对于维持整个开发项目的动力始终非常重要。\n\
    \n# 4.5.2 整体规划\n\n尽管你可能在解决一个大问题的一个小部分，但你必须考虑全局。始终花时间理解任何开发工作的上下文；你工作的次级和三级影响是无法完全预见的。此外，考虑任何项目的各个方面有助于你预判\
    \ RegEx 模式的需求。\n\n该文件是从 SEC 网站手动下载的 XML 格式。可以在此处找到原始网站源：http://www.sec.gov/litigation/admin/adminarchive/adminarcarc2009.shtml\n\
    \n# 附录 A：Perl 版本说明\n\n本附录包含了关于 SAS 9.4¹ 使用的 Perl 限制说明。它针对对 SAS 某些缺失感到好奇的 Perl\
    \ 专家。以下信息直接摘自 SAS 网站，在此提供是因为它们较难找到，但对本书的高级读者来说可能非常有用。\n\n“PRX 函数使用了修改过的 Perl 5.6.1\
    \ 版本执行正则表达式的编译和匹配。Perl 被编译成一个库供 SAS 使用。该库随 SAS 9² 一起发布。修改和原始的 Perl 5.6.1 文件在技术支持网站的\
    \ ZIP 文件中免费提供。提供 ZIP 文件是为了遵守 Perl 艺术许可，且使用 PRX 并不需要该文件。每个修改后的文件顶部都有注释块，描述了文件如何以及何时被更改。可执行文件赋予了非标准的\
    \ Perl 名称。可以从 Perl 网站获取标准的 Perl 版本。\n\nPRX 函数只能访问 Perl 正则表达式。Perl 语言的其他部分无法访问。修改版本的\
    \ Perl [RegEx] 不支持以下内容：\n\n- 所有 Perl 变量，除捕获缓冲区 $1 - \\$ 除外\n- 元字符 G, \\p, \\P\
    \ 和 \\X\n- RegEx 选项 /c 和 /g，以及带有替换的选项\n- 命名字符（即 {name}）\n- 在正则表达式中执行 Perl 代码，包括语法\
