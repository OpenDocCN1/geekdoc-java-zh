    \n# Homework\n\n# Chapter 4: Applications of Regular Expressions in SAS\n\n##\
    \ 4.3 Information Extraction\n\nParsing large volumes of text to generate structured\
    \ data sets is a common, valuable use of RegExp capabilities. For example, we\
    \ might want to collect information from a technology blog or website that contains\
    \ valuable customer feedback about our product. Such information could not easily\
    \ or cheaply gathered by hand for the sake of further analysis. Due to the wide\
    \ variety of possible sources from which we might need to extract information,\
    \ as well as the wide array of end tags for the information, there are a number\
    \ of approaches to accomplishing this task. Given the proliferation of tag-based\
    \ languages such as HTML and XML, we need to be prepared to effectively extract\
    \ information from.\n\nNow, due to the semi-structured nature of tag-based languages,\
    \ they are easier to process than one might anticipate. All such languages have\
    \ paired opening and closing tags for defining various pieces of information.\
    \ We can leverage this to properly detect and extract the information we need.\n\
    \nWith more sophisticated techniques at our disposal (like using the SAS macro\
    \ facility), we could actually “learn” the embedded data elements and extract\
    \ the data with the discovered variables. However, emphasis on these techniques\
    \ is beyond the scope of this book. Therefore, we need to know the various tags\
    \ that we are looking for in the XML or HTML source in addition. We will use this\
    \ approach to process the XML file in our example.\n\nGoing back to the SEC administrative\
    \ proceedings from Chapter 1, let's parse and extract the information from the\
    \ administrative sample file:\n\nFigure 4.1: SEC XML Sample\n\n```\n<xml version=\"\
