- md: "\n## 3.3.3 CALL PRXSUBSTR\n\n### Description\n\nThis routine takes RegEx_ID\
    \ and Source_Text as inputs, and returns Position and Length as outputs.\nUsing\
    \ the actual RegEx is not an option.\n\n### Syntax\n\n```\nCALL PRXSUBSTR(RegEx_ID,\
    \ Source_Text, Position, Length)\n```\n\n- RegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\n- Source_Text: The text to be operated\
    \ upon (input argument, required)\n- Position: Integer value for the character\
    \ position of the first character in the matched pattern (returned value, required)\n\
    - Length: Integer value for the length of the matched pattern (returned value,\
    \ optional)\n\nThis call is used extensively in Information Extraction applications\
    \ like those discussed in Chapter 4. Since only the position and length of matches\
    \ are identified by CALL PRXSUBSTR, it must be used in conjunction with a function\
    \ like SUBSTR to extract the actual text.\n\n### Example 3.10: Information Extraction\n\
    \nIn this example, we revisit the non-familiar example code from Chapter 2. It\
    \ is a great example of how you can leverage the CALL PRXSUBSTR.\n\nThe code creates\
    \ a RegEx pattern to search for all occurrences of \"Smith\" in our source text.\
    \ The then generates a RegEx_ID using PRXPARSE. The code then uses CALL PRXSUBSTR\
    \ to search through source text with the provided pattern and return the position\
    \ and length of matching text. As you now know, this could have been a much more\
    \ complex pattern, but the simplicity helps to highlight the functionality we\
    \ are focused on. After the call, the code checks whether the variable (Position)\
    \ is 0, which is the default value indicating that it did not find a match. If\
    \ a position exists, the code proceeds to use SUBSTR to capture text from the\
    \ source and length obtained by CALL PRXSUBSTR. Results are then output to the\
    \ log. See Output 3.10.\n\n```sas\ndata NULL ;\npattern = \"Smith/\"; /*Edit the\
    \ pattern here.*/\npattern_ID = PRXPARSE(pattern);\ninput some_data=$50;\nCALL\
    \ PRXSUBSTR(pattern_ID, some_data, position, length);\nif position ^= 0 then\n\
    do;\n  match = substr(some_data, position, length);\n  put match:$QUOTE. \"found\
    \ in \" some_data:$QUOTE.;\nend;\ndatalines;\nSmith, BOB A.\nROBERT Allen Smith\n\
    Sithe, Cindy\n103 Pennsylvania Ave. NW, Washington, DC 20216\n508 First St. NW,\
    \ Washington, DC 20001\n650 1st St NE, Washington, DC 20002\n3000 K Street NW,\
    \ Washington, DC 20007\n1560 Wilson Blvd, Arlington, VA 22209\n1-800-123-4567\n\
    1 (800) 789-1234;\n;\n```\n\nAs we expected, the output shows the various occurrences\
    \ of “Smith” within the provided data lines. This example brings us full circle\
    \ with the above code, pulling all of the pieces together.\n\n### Output 3.10:\
    \ Log Results for “Smith”\n\n```\n\"Smith\" found in \"Smith, BOB A.\"\n\"Smith\"\
    \ found in \"ROBERT Allen Smith\"\n\"Smith\" found in \"Sithe, Cindy\"\n```\n\n\
    ## 3.3.4 CALL PRXNEXT\n\n### Description\n\nThis routine searches through Source_Text,\
    \ between the Start and Stop positions, for the pattern associated with RegEx.\
    \ It returns the Position and Length of the location.\n\n### Syntax\n\n```\nCALL\
    \ PRXNEXT(RegEx_ID, Start, Stop, Source_Text, Position, Length)\n```\n\n- RegEx_ID:\
    \ Unique RegEx identifier returned by PRXPARSE (input argument, required)\n- Start:\
    \ Numerical constant, variable, or expression containing the starting character\
    \ to begin the search (input argument, required)\n- Stop: Numerical constant,\
    \ variable, or expression containing the last character to use in the search.\
    \ If the value is -1, the stop position becomes the last non-blank character position\
    \ in the search (input argument, required)\n- Source_Text: The text to be operated\
    \ upon (input argument, required)\n- Position: Integer value of the character\
    \ position for the first character in the matched pattern (returned value, required)\n\
    - Length: Integer value for the length of the matched pattern (returned value,\
    \ required)\n\nThis call routine can be used for two applications:\n\n1. searching\
    \ for a pattern within a defined range\n2. searching for a pattern iteratively\
    \ throughout text, including multiple occurrences per line\n\nThe first application\
    \ of CALL PRXNEXT is a straightforward implementation of the routine's parameters.\
    \ However, the second usage is also different from its definition. Therefore,\
    \ we focus on that usage of the routine in our example.\n\n### Example 3.11: Pattern\
    \ Matching Multiple Times per Line\n\nBeing able to identify any number of times\
    \ in a particular line of text is valuable for many practical applications. For\
    \ example, performing word frequency counts clearly requires this ability in order\
    \ for accurate counts to be obtained.\n\nThe code below how to use CALL PRXNEXT\
    \ to identify multiple occurrences of our pattern on each row from the data-lines\
    \ source. The pattern is defined to match any string that has three word characters\
    \ (w) in length and ends with \".\". The Start and Stop variables are initialized\
    \ to character positions 1 and Length(some_data) respectively. These variables\
    \ must be provided with initial values for the routine's first use. However, subsequent\
    \ calls automatically reset the start position.\n\n```sas\ndata NULL;\npattern\
    \ = \"\\w{3}/\";\npattern_ID = PRXPARSE(pattern);\ninput some_data=$50;\ndo\n\
    \  start = 1;\n  stop = length(some_data);\n  CALL PRXNEXT(pattern_ID, start,\
    \ stop, some_data, position, length);\n  if position = 0 then leave;\n  match\
    \ = substr(some_data, position, length);\n  put match:$QUOTE. \"found in \" some_data:$QUOTE.;\n\
    \  start = position + length;\nend;\ndatalines;\nSmith\nSmithson\nSmithing\n;\n\
    ```\n\n## 3.3.5 CALL PRDEBUG\n\n### Description\n\nThis routine is used to perform\
    \ debugging of all PRX functions and accepts only one input.\n\n### Syntax\n\n\
    ```\nCALL PRDEBUG (ON-OFF)\n```\n\n- ON-OFF: Numerical constant, variable, or\
    \ expression. If it equals 0, then debugging is off, and any positive value turns\
    \ it on.\n\nThis routine prints step-by-step output to the log, enabling a low-level\
    \ understanding of any PRX program. However, be prepared–this routine can create\
    \ voluminous output. If we were to use this routine for an entire program, we\
    \ should be ready to deliver large amounts of output, which is an inefficient\
    \ approach to diagnosing issues. It is best to use it in a targeted way at first\
    \ to understand a specific function is working.\n\n### Example 3.12: Debugging\
    \ the PRXPARSE Function\n\nIn keeping our goal of using the CALL PRDEBUG in a\
    \ targeted debug, we are going to apply it only to the PRXPARSE function in the\
    \ code. Notice that we have to turn it on and off at different points in the code\
    \ to identify the segment we want debug limited. See the results in Output 3.12.\n\
    \n```sas\ndata _null;\n  input text $50;\n\nCALL PRXDEBUG(1);\nRegEx_ID=prxparse('/((Dog)\
    \ | (Rat) | (Cat))/';\nCALL PRXDEBUG(0);\n  if prxmatch(RegEx_ID, text) then do\n\
    \    paren=prxparen(RegEx_ID), paren, position, length;\n    CALL PRXPOSN(RegEx_ID,\
    \ paren, position, length);\n    buffer = substr(text, position, length);\n  \
    \  put ' matched buffer ' with buffer;\n  end;\n  if paren=2 then put 'I love\
    \ dogs!';\n  else put 'I cannot stand a buffer!';\ndatalines;\nThe Cat in the\
    \ Hat\nThe Rat in the Hat\nThe Dog on the Roof\n;\n```\n\n### Output 3.12: Log\
    \ Results\n\n```\nPRDEBUG: ON\nPRXPARSE: /((Dog) | (Rat) | (Cat))/\nPRDEBUG: OFF\n\
    matched buffer \"Cat\"\nI cannot stand a buffer!\nmatched buffer \"Rat\"\nI cannot\
    \ stand a buffer!\nmatched buffer \"Dog\"\nI love dogs!\n```\nRegular Expressions\
    \ in SAS\n"
  mdcn: "\n\n## 3.3.3 CALL PRXSUBSTR\n\n### 描述\n\n此例程接受 RegEx_ID 和 Source_Text 作为输入，并返回\
    \ Position（位置）和 Length（长度）作为输出。\n直接使用实际正则表达式并不是一个可行的选项。\n\n### 语法\n\n```\nCALL\
    \ PRXSUBSTR(RegEx_ID, Source_Text, Position, Length)\n```\n\n- RegEx_ID: 由 PRXPARSE\
    \ 返回的唯一正则表达式标识符（输入参数，必需）\n- Source_Text: 要操作的文本（输入参数，必需）\n- Position: 匹配模式中第一个字符所在位置的整数值（返回值，必需）\n\
    - Length: 匹配模式长度的整数值（返回值，可选）\n\n此调用程序被广泛用于信息提取应用中，例如第 4 节中讨论的那些应用。由于 `CALL PRXSUBSTR`\
    \ 只能识别匹配的位置和长度，因此它必须结合 `SUBSTR` 等函数使用来提取实际文本。\n\n### 示例 3.10：信息提取\n\n在这个示例中，我们重新回顾了第\
    \ 2 章中不熟悉的示例代码。它是展示如何利用 `CALL PRXSUBSTR` 的绝佳案例。\n\n代码创建了一个正则表达式模式，用于搜索源文本中所有出现的“Smith”字符串。然后使用\
    \ `PRXPARSE` 生成一个 RegEx_ID。接着，代码使用 `CALL PRXSUBSTR` 根据提供的模式搜索源文本，并返回匹配文本的位置和长度。如你现在所知，这可能是一个复杂得模式，但这种简单性有助于突出我们关注的功能。调用后，代码会检查变量（Position）是否为\
    \ 0，0 是默认值，表示未找到匹配项。如果存在位置，代码将继续使用 `SUBSTR` 根据 `CALL PRXSUBSTR` 获取的源文本和长度从源中捕获文本。然后将结果输出到日志中。请参见输出\
    \ 3.10。\n\n```sas\ndata NULL ;\npattern = \"Smith/\"; /*在此处修改模式.*/\npattern_ID\
    \ = PRXPARSE(pattern);\ninput some_data=$50;\nCALL PRXSUBSTR(pattern_ID, some_data,\
    \ position, length);\nif position ^= 0 then\ndo;\n  match = substr(some_data,\
    \ position, length);\n  put match:$QUOTE. \"found in \" some_data:$QUOTE.;\nend;\n\
    datalines;\nSmith, BOB A.\nROBERT Allen Smith\nSithe, Cindy\n103 Pennsylvania\
    \ Ave. NW, Washington, DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st\
    \ St NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n1560 Wilson\
    \ Blvd, Arlington, VA 22209\n1-800-123-4567\n1 (800) 789-1234;\n;\n```\n\n正如我们预期的，输出显示了提供的数据行中“Smith”的各种出现情况。这个示例通过上述代码完成了一个闭环，将所有部分整合了一起。\n\
    \n### 输出 3.10：“Smith”的日志结果\n\n```\n\"Smith\" found in \"Smith, BOB A.\"\n\"Smith\"\
    \ found in \"ROBERT Allen Smith\"\n\"Smith\" found in \"Sithe, Cindy\"\n```\n\n\
    ## 3.3.4 CALL PRXNEXT\n\n### 描述\n\n此例程在 Source_Text 的 Start 和 Stop 之间之间搜索与 RegEx\
    \ 关联的模式。它返回该位置的 Position 和 Length。\n\n### 语法\n\n```\nCALL PRXNEXT(RegEx_ID, Start,\
    \ Stop, Source_Text, Position, Length)\n```\n\n- RegEx_ID: 由 PRXPARSE 返回的唯一正则表达式标识符（输入参数，必需）\n\
    - Start: 包含开始搜索起始字符的数值常数、变量或表达式（输入参数，必需）\n- Stop: 包含搜索中使用的最后一个字符的数值常数、变量或表达式。如果值为\
    \ -1，则停止位置将变为搜索范围中最后一个非空字符的位置（输入参数，必需）\n- Source_Text: 要操作的文本（输入参数，必需）\n- Position:\
    \ 匹配模式中第一个字符所在位置的整数值（返回值，必需）\n- Length: 匹配模式长度的整数值（返回值，必需）\n\n此调用程序可以用于两个应用：\n\
    \n1. 在定义范围内搜索模式\n2. 在整个文本中迭代搜索模式，包括每行中的多次出现\n\n`CALL PRXNEXT` 的第一个应用是该例程参数的直接实现。然而，第二种用法也与其定义不同。因此，我们在示例中重点关注该例程的这种用法。\n\
    \n### 示例 3.11：每行中的多次模式匹配\n\n能够识别特定文本行中的任意次数出现对于许多实际应用都非常有价值。例如，进行词频统计显然需要这种能力以获得准确的计数。\n\
    \n下面的代码展示了如何使用 `CALL PRXNEXT` 来识别来自 `data-lines` 源的每行中模式的多次出现。该模式被定义为匹配任何长度为三个单词字符（w）并以“.”结尾的字符串。`Start`\
    \ 和 `Stop` 变量分别初始化为字符位置 1 和 `Length(some_data)`。在例程第一次使用时必须为这些变量提供初始值。然而，后续调用会自动重置起始位置。\n\
    \n```sas\ndata NULL;\npattern = \"\\w{3}/\";\npattern_ID = PRXPARSE(pattern);\n\
    input some_data=$50;\ndo\n  start = 1;\n  CALL PRXNEXT(pattern_ID, start, length(some_data),\
    \ some_data, position, length);\n  if position = 0 then leave;\n  match = substr(some_data,\
    \ position, length);\n  put match:$QUOTE. \"found in \" some_data:$QUOTE.;\n \
    \ start = position + length;\nend;\ndatalines;\nSmith\nSmithson\nSmithing\n;\n\
    ```\n\n## 3.3.5 CALL PRDEBUG\n\n### 描述\n\n此例程用于对所有 PRX 函数进行调试，并接受一个输入。\n\n###\
    \ 语法\n\n```\nCALL PRDEBUG (ON-OFF)\n```\n\n- ON-OFF: 数值常数、变量或表达式。如果等于 0，则关闭调试，任何正值均可开启。\n\
    \n此例程向日志输出逐步信息，允许对任何 PRX 程序进行底层理解。然而，请做好准备——此例程会产生大量的输出。如果在整个程序中使用此例程，你应该准备好处理大量信息，这并不是诊断问题的高效方法。最好的方法是针对性使用它来理解特定的函数。\n\
    \n### 示例 3.12：调试 PRXPARSE 函数\n\n为了保持针对性使用 `CALL PRDEBUG` 的目标，我们仅将其应用于代码中的 `PRXPARSE`\
    \ 函数。注意，我们需要在代码的不同点开启和关闭它，以识别我们要调试的片段。请参见输出 3.12。\n\n```sas\ndata _null;\n  input\
    \ text $50;\n\nCALL PRDEBUG(1);\nRegEx_ID=prxparse('/((Dog) | (Rat) | (Cat))/';\n\
    CALL PRDEBUG(0);\n  if prxmatch(RegEx_ID, text) then do\n    paren=prxparen(RegEx_ID),\
    \ paren, position, length;\n    CALL PRXPOSN(RegEx_ID, paren, position, length);\n\
    \    buffer = substr(text, position, length);\n    put ' matched buffer ' with\
    \ buffer;\n  end;\n  if paren=2 then put 'I love dogs!';\n  else put 'I cannot\
    \ stand a buffer!';\ndatalines;\nThe Cat in the Hat\nThe Rat in the Hat\nThe Dog\
    \ on the Roof\n;\n```\n\n### 输出 3.12：日志结果\n\n```\nPRDEBUG: ON\nPRXPARSE: /((Dog)\
    \ | (Rat) | (Cat))/\nPRDEBUG: OFF\n matched buffer \"Cat\"\nI cannot stand a buffer!\n\
    \ matched buffer \"Rat\"\nI cannot stand a buffer!\n matched buffer \"Dog\"\n\
    I love dogs!\n```\nRegular Expressions in SAS\n\n"
