    # 30 Introduction to Regular Expressions in SAS


    # Lazy 0 or 1 Times


    The modifier ?? creates a match 0 or 1 times, as few times as necessary to create
    a match. Unless forced, this modifier will match 0 times. Table 2.32 provides
    examples.


    # Table 2.32: Examples using ??


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | /Sing\w??/ | “Sing” | This matches only the word “Sing” because the modifier
    is given the option to match nothing. And since it is lazy, it will take that
    option every time, regardless of whether a character match immediately follows
    the “g” in “Sing”. The reasoning is the same as with \* modifier. |

    | /Sing\w??/s/ | “Sings” ... | Again, just with the \* modifier, we see that appending
    the \s on the pattern forces the pattern to continue searching for a match that
    includes white space. This could be “Sings” or a few other combinations (similar
    to the greedy outcomes). |

    | /(ha)?? | | | This example demonstrates why we need to be careful with lazy
    modifiers. Even when “ha” exists, it is ignored, again because the lazy modifier
    has the option to do so. The greedy version of this wild would match as many times
    as the word “ha” occurred back-to-back. |


    # Lazy {n} Times


    The modifier {n}? creates a match exactly n times. This modifier functions exactly
    as the greedy version, making the ? unnecessary. Using this modifier results in
    no performance enhancement or change in functionality, which makes it a completely
    unnecessary addition to the Perl language. It has been included here for the sake
    of completeness. Table 2.33 shows that the same examples reveal the same results.


    # Table 2.33: Examples using “{n}?


    | Usage | Matches |

    | --- | --- |

    | /1-800\d{3}-?\d{4}/ | “1-800-123-4567” “1.800.123.4567” ... |

    | /R\w{4}?/ | “Round” “Runts” ... |

    | /19\D{3}?Street/ | “19th Street” “19th.Street” “19...Street” ... |

    | /(\d{5}-\d{4}))?(\d{5})?/ | “12345-6789” “12345” ... |'
- md: "\n# Lazy n or More\n\nThe modifier {n,}? creates a match, at least n times\
    \ and as few times as necessary to create a match. This functions just like the\
    \ * or + modifiers, except that the number of matches is arbitrary. Again, we\
    \ see similar behavior resulting from the laziness of the modifier. Table 2.34\
    \ provides examples.\n\nTable 2.34: Examples using {n,}\n\n| Usage | Matches |\
    \ Notes |\n| --- | --- | --- |\n| /Singw{3,?}/ | \"Singing\" ... | This usage\
    \ matches exactly n=3 times. Again, by giving the lazy option to match the minimum,\
    \ it will do so every time. |\n| /0{3,?}/s/ | \"0000\" ... | Now you have the\
    \ hang of these modifiers, this example should be a little more interesting. Adding\
    \ 's' on the pattern forces it to match 0 until the white space is encountered.\
    \ The pattern is \"anchored\" to the first occurrence of a 0, catching more than\
    \ the minimum. |\n| /(ha){4,?}/ | hahahaha | Without surrounding information in\
    \ the pattern, this matches only the minimum number of times. By having nothing\
    \ else to force additional matching, the lazy modifier just stops after the minimum\
    \ of n=4. |\n\n# Lazy n to m Times\n\nThe modifier {n,m}? creates a match at least\
    \ n times, but no more than m times—as few times in that range as necessary to\
    \ create the match. It functions like many of the other lazy modifiers discussed\
    \ far, but it sets a cap on how many times it can match in having an arbitrary\
    \ minimum. Table 2.35 provides examples.\n\nTable 2.35: Examples using {n,m}?\n\
    \n| Usage | Matches | Notes |\n| --- | --- | --- |\n| /Readw{1,3,?}/ | \"Ready\"\
    \ ... | This matches the word character only one time. Again, by giving the lazy\
    \ modifier an option to match the minimum, it will do so every time. |\n| /0{2,5}?s/\
    \ | \"0000\" ... | Again, the pattern is \"anchored\" to the first occurrence\
    \ of a 0, catching the minimum if it exists, up to the maximum. |\n| \\sha(ha){0,6}?\
    \ | \"ha\" | By not having anything after the \"anchor\" point for the pattern\
    \ to match on, there is nothing for additional matching. The lazy modifier just\
    \ stops after the minimum of n=0. |\n\n# 32 Introduction to Regular Expressions\
    \ in SAS\n\n## 2.6 Options\n\nOptions affect the behavior of the RegEx pattern\
    \ with which they are associated. These behavioral changes provide benefits ranging\
    \ from RegEx creation more convenient, providing new or enhanced functionality.\n\
    \nOptions occur *after* the closing slash character, but there is one item of\
    \ significance that occurs *before* the first slash character that we will also\
    \ discuss—it is not actually an option but this is best place to go over it. And\
    \ we are not going to cover all of the metacharacters for the same reason we haven't\
    \ covered far—this is an introductory text.\n\n### 2.6.1 Ignore Case\n\nThe option\
    \ /i ignores case for the entire pattern, even character strings. This is a great\
    \ option to use when we know exactly what we are searching for, but we don't want\
    \ the letter case to be an issue. Table 2.36 provides examples.\n\nTable 2.36:\
    \ Examples using /i\n\n| Usage | Matches |\n| --- | --- |\n| /1600 Pennsylvania\
    \ Avenue/i | \"1600 pennsylvania avenue\" \"1600 PENNSYLVANIA AVENUE\" ... |\n\
    | /Street/i | \"street\" \"Street\" \"STREET\" ... |\n| /CAPS don't MattEr/i |\
    \ \"caps don't matter\" \"CaPs Don't MATTER\" ... |\n\n### 2.6.2 Single Line\n\
    \nThe option /s forces the dot character (.) to match everything, including the\
    \ newline character, when it occurs in the pattern. This can be very helpful to\
    \ ensure that we don't miss anything for a particular character position. Table\
    \ 2.37 provides examples.\n\nTable 2.37: Examples using /s\n\n| Usage | Matches\
    \ |\n| --- | --- |\n| /43rd and Times Square.New York, NY 10036/s | \"43rd and\
    \ Times Square New York, NY 10036\" ... |\n| /Bob Smith.\\d{3}-d{3}-d{4}/s | \"\
    Bob Smith 123-456-7891\" ... |\n\n### 2.6.3 Multiline\n\nThe option /m causes\
    \ ^ and $ to match on more than just the string start and end. Instead, they match\
    \ on every newline encountered because the various lines of information are treated\
    \ as one continuous line. This enhanced functionality applies to two metacharacters\
    \ that we haven't covered yet (we'll discuss them in Section 2.7), so if you need\
    \ to, feel free to peek ahead and come back to this one. Table 2.38 provides examples.\n\
    \nTable 2.38: Examples using /m\n\n| Usage | Matches |\n| --- | --- |\n| /\\w+/m\
    \ | Words at the beginning of a string and words following a newline character.\
    \ |\n| \\w+?$s$/m | Words immediately before a space and the string end, and before\
    \ a space and newline character. |\n\n### 2.6.4 Compile Once\n\nThe option /o\
    \ is known as the compile option. By having the \"o\" immediately following the\
    \ closing slash, SAS knows to compile Regex only. This option creates a nice simplification\
    \ to SAS, which I demonstrate by showing test code below (see Section 2.1 for\
    \ the original code). Notice how the IF block is removed, and only the two lines\
    \ that do not include RETAIN remain. These changes are possible due to compilation\
    \ the first time. Every subsequent loop reuses the previously compiled expression,\
    \ if it exists.\n\n```\n/*RegEx Testing Framework*/\ndata _NULL;\nif N=1 then\n\
    do;\n  retain pattern_ID;\n  pattern=\"/Run/\"; /*Edit the pattern here.*/\n \
    \ pattern_ID=prxparse(pattern);\nend;\npattern=\"/Run/\"; /*Edit the pattern here.*/\n\
    pattern_ID=prxparse(pattern);\ninput some_data $;\ncall prxsubstr(pattern_ID,\
    \ some_data, position, length);\nif position = 0 then\ndo;\nrun;\n```\n\n## 2.5\
    \ Substitution Operator\n\nThe substitution operator s/ is not technically an\
    \ option, it belongs here because it truly stands apart from the other items.\
    \ Although the substitution operation is similar in appearance to the other options,\
    \ it fundamentally changes the RegEx from a matching operation to a match-and-replace\
    \ operation. \"s\" in front of the surrounding slashes signifies that the pattern\
    \ is being used to replace the text and inserting the accompanying replacement\
    \ text. This is another functionality that is explored in the next chapter with\
    \ SAS functions. A great analogy for how this works in practice is word processing\
    \ applications—except this is much powerful. Also, notice that there is a third\
    \ slash in the examples below (in the middle of the patterns). That additional\
    \ slash denotes where the matching portion of RegEx ends and the replacement portion\
    \ begins. Right, all the characters between the second and third slash are treated\
    \ as literals. Table 2.39 provides some examples, but we cover this in detail\
    \ in the next chapter, where we also discuss how to insert more strings.\n\n|\
    \ Usage | Matches | Replace with |\n| --- | --- | --- |\n| s/Stop/Go/ | \"Stop\"\
    \ | \"Go\" |\n| s/Sing/Read/ | \"Sing\" | \"Read\" |\n| s/(800)\\s?/1-800-/ |\
    \ \"1 (800) - \" | \"1-800-\" |\n\nNote: This is a more advanced function that\
    \ our test code is not set up to handle. You'll just need to accept as true until\
    \ we use it with some SAS code in the next chapter.\n\n## 2.7 Zero-width Metacharacters\n\
    \nZero-width characters, often called positional characters, are not matched in\
    \ isolation because they do not have a width. They are used as an additional piece\
    \ of information for making a pattern match. There are numerous examples for how\
    \ these zero-width characters can be used. For instance, perhaps you want to match\
    \ a particular word, but only if it occurs at the beginning of a line.\n\n###\
    \ 2.7.1 Start of Line\n\nThe metacharacter ^ matches the beginning of a line or\
    \ string. Depending on the text that we are processing, we might need a priori\
    \ knowing something specific. For example, we might be looking for the beginning\
    \ of a new paragraph, which could be denoted by a new line in combination with\
    \ a capital letter and no preceding space. Or we might need to be prepared to\
    \ match an address that includes a new line for the city, state, and zip. Table\
    \ 2.40 provides examples.\n\nTable 2.40: Example using ^\n\n| Usage | Matches\
    \ |\n| --- | --- |\n| /^Washington, DC 20007/ | Washington, DC 20007 |\n| /\\\
    w+\\b/ | The first word in a string. |\n\nNote: This metacharacter is often used\
    \ as the logical NOT symbol, including within the character class metacharacters\
    \ discussed in Section 2.3 and in SAS code. So be careful not to get confused\
    \ in its usage when switching contexts.\n\n### 2.7.2 End of Line\n\nThe metacharacter\
    \ $ matches the end of a line or string. There are numerous situations in which\
    \ this might become relevant, similar to the reasons for the ^ metacharacter.\
    \ Table 2.41 provides examples.\n\nTable 2.41: Example using \\$\n\n| Usage |\
    \ Matches |\n| --- | --- |\n| /3000 K Street NW,$/ | \"3000 K Street NW,\" |\n\
    | /\\$d+?\\{2}s*?/ | \"$150.52 |\n\n### 2.7.3 Word Boundary\n\nThe metacharacter\
    \ \\b matches a word boundary. The \\b Assertion metacharacter is zero-width because\
    \ it actually represents the invisible gap between two characters, with a \\w\
    \ character on one side and \\W on the other. Therefore, when you use this metacharacter,\
    \ you won't generate matches that contain the associated non-word character. Table\
    \ 2.42 provides examples.\n"
  mdcn: "\n\n# 懒性 n 或更多\n\n修饰符 `{n,}?` 创建一个至少 n 次的匹配，并以创建匹配所需的最小次数进行。其功能与 `*` 或 `+`\
    \ 修饰符相同，不同之处在于匹配次数是任意的。我们看到了由于修饰符的懒性而导致的相似行为。表 2.34 提供了示例。\n\n表 2.34：使用 {n,} 的示例\n\
    \n| 用法 | 匹配项 | 备注 |\n| --- | --- | --- |\n| /Singw{3,?}/ | \"Singing\" ... | 此用法恰好匹配\
    \ n=3 次。同样，通过提供懒性选项来匹配最小次数，它每次都会这样做。 |\n| /0{3,?}/s/ | \"0000\" ... | 现在你已经掌握了这些修饰符，这个示例应该会更有趣一点。在模式上添加\
    \ 's' 会强制它匹配 0 直到遇到空白字符。该模式被“锚定”在 0 的第一次出现处，捕获了比最小值更多的内容。 |\n| /(ha){4,?}/ | hahahaha\
    \ | 在模式中没有周围信息的情况下，它仅匹配最小次数。由于没有其他内容强制进行额外匹配，懒性修饰符在达到最小次数 n=4 后就会停止。 |\n\n# 懒性\
    \ n 到 m 次\n\n修饰符 `{n,m}?` 创建一个至少 n 次的匹配，但不超过 m 次——在该范围内以创建匹配所需的最小次数进行匹配。它的功能与目前为止讨论的许多其他懒性修饰符类似，但它在设置任意最小次数的同时，对匹配次数设置了上限。表\
    \ 2.35 提供了示例。\n\n表 2.35：使用 {n,m}? 的示例\n\n| 用法 | 匹配项 | 备注 |\n| --- | --- | ---\
    \ |\n| /Readw{1,3,?}/ | \"Ready\" ... | 这仅匹配一次单词字符。同样，通过给懒性修饰符提供匹配最小次数的选项，它每次都会这样做。\
    \ |\n| /0{2,5}?s/ | \"0000\" ... | 再次，模式被“锚定”在 0 的第一次出现处，如果存在则捕获最小值，直到最大值。 |\n\
    | \\sha(ha){0,6}? | \"ha\" | 由于模式的“锚定”点之后没有可以用于匹配的内容，因此没有可以进行额外匹配。懒性修饰符在达到最小次数\
    \ n=0 后就会停止。 |\n\n# 32 SAS 正则表达式简介\n\n## 2.6 选项\n\n选项会影响与其关联的 RegEx 模式的行为。这些行为变化提供了多种益处，从使\
    \ RegEx 创建更方便，到提供新的或增强的功能。\n\n选项出现在结束斜杠字符*之后*，但在第一个斜杠字符*之前*还有一个意义重大的项目，我们也将进行讨论——它实际上并不是一个选项，但它是回顾它的最佳地方。由于我们之前没有涵盖所有内容，出于同样的原因，我们也将不会涵盖所有的元字符——因为这是一篇介绍性文本。\n\
    \n### 2.6.1 忽略大小写\n\n选项 `/i` 忽略整个模式（包括字符字符串）的大小写。当我们确切知道要搜索什么，但不想让字母大小写成为问题时，这是一个非常棒的选项。表\
    \ 2.36 提供了示例。\n\n表 2.36：使用 /i 的示例\n\n| 用法 | 匹配项 |\n| --- | --- |\n| /1600 Pennsylvania\
    \ Avenue/i | \"1600 pennsylvania avenue\" \"1600 PENNSYLVANIA AVENUE\" ... |\n\
    | /Street/i | \"street\" \"Street\" \"STREET\" ... |\n| /CAPS don't MattEr/i |\
    \ \"caps don't matter\" \"CaPs Don't MATTER\" ... |\n\n### 2.6.2 单行\n\n选项 `/s`\
    \ 强制点字符 (`.`) 在出现在模式中时匹配所有内容，包括换行符。这对于确保我们不会遗漏特定字符位置的任何内容非常有帮助。表 2.37 提供了示例。\n\
    \n表 2.37：使用 /s 的示例\n\n| 用法 | 匹配项 |\n| --- | --- |\n| /43rd and Times Square.New\
    \ York, NY 10036/s | \"43rd and Times Square New York, NY 10036\" ... |\n| /Bob\
    \ Smith.\\d{3}-d{3}-d{4}/s | \"Bob Smith 123-456-7891\" ... |\n\n### 2.6.3 多行\n\
    \n选项 `/m` 导致 `^` 和 `$` 不仅匹配字符串的开头和结尾。相反，它们匹配每个遇到的每一个换行符，因为各种行信息被视为一条连续的行。这种增强功能适用于我们尚未涵盖的两个元字符（我们将在\
    \ 2.7 节中讨论它们），所以如果你需要，可以尽管先看看再回到这一项。表 2.38 提供了示例。\n\n表 2.38：使用 /m 的示例\n\n| 用法\
    \ | 匹配项 |\n| --- | --- |\n| /\\w+/m | 字符串开头的单词和换行符后的单词。 |\n| \\w+?$s$/m | 空格和字符串结尾之前的单词，以及空格和换行符之前的单词。\
