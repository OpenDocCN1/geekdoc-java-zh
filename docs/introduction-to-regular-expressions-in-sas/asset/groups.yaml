  - '[PAGE 57]


    # 44 Introduction to Regular Expressions in SAS


    Num_Times: Number of times the change is to be applied (input argument, required).
    -1 forces the function to make the changes as many times as the pattern occurs
    in the source text.


    Input_String: Input variable (input argument, required)


    Output_String: Output variable assignment (output, required)


    Just like the PRXMATCH function, PRXCHANGE is able to use the actual RegEx pattern
    or the RegEx_ID, providing significant flexibility. The preferred use depends
    on the desired application.


    This function is very useful for data standardization, as you will see in more
    advanced examples in the next chapter. We will work through two examples to demonstrate
    some basic functionality of the PRXCHANGE function, as well as to demonstrate
    how to leverage the capture buffer concept introduced earlier.


    # ### Example 3.3: Standardizing Data


    Data standardization is a relatively simple, yet powerful, capability provided
    by RegEx in SAS. PRXCHANGE enables us to scrub our data source so that each occurrence
    of a word or phrase is exactly the same (or removed entirely). Output 3.3 for
    the results. Data scrubbing is especially important when you are attempting to
    perform advanced applications such as text mining.


    For instance, before doing any analysis of our data, we want to know that each
    occurrence of the word “street” is exactly the same. If each occurrence were not
    identical, we might perform a word frequency count on a document with invalid
    results like “street,” “Street,” “St.,” and so on all would be counted separately.
    Depending on the eventual use of this information, such problems could prove disastrous.


    ```

    data NULL;

    input address $50;

    text PRXCHANGE(''/s\s+([sS]t)?|st\)\s+/ St. /o'',1,address);

    put text;


    datalines;

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St. NW, Washington, DC 20001

    650 1st St NE, Washington, DC 20002

    3000 K Street NW, Washington, DC 20007

    ;

    run;

    ```


    Output 3.3: Log with Updated Data


    | 103 Pennsylvania Ave NW, Washington, DC 20216 |

    | 508 First St. NW, Washington, DC 20001 |

    | 650 1st St NE, Washington, DC 20002 |

    | 3000 K Street NW, Washington, DC 20007 |'
