    ### 4.4 Search and Replacement


    The specific needs for search and replace can vary, but nowhere is this capability
    more necessary than for PII redaction. Redacting PII is frequent in the public
    sector, where information sharing between agencies or periodic release is often
    mandated. We revisit the data from our example that used in Section 4.2 has been
    exported to a text file. We want to know how to perform this task on any data,
    from the highly structured to completely unstructured. We have already worked
    with structured data, so exploring unstructured data is a natural step.


    Now, before we get into how to perform reduction, it is worth showing how the
    TXT file was created. Despite knowing how it is created in advance, we want to
    behave as we want knowledge of its construction to ensure that we are creating
    robust code. You can see in the code below we simply take the resulting data from
    Section 4.2, FinalPII, as input via the SET statement. Next, we use the FILE statement
    to create the TXT file. Once the FILE statement is used, the following PUT statement
    writes the identified variables to:


    ```sas

    data NULL;

    set finalpii;

    file ''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt'';

    put firstname ssn dob;

    run;

    ```


    Output 4.5 shows the output provided by this code. As we see, the structure is
    largely removed, though not entirely. This allows us to closely approximate what
    you might encounter in the real world (which could be PII stored in a Microsoft
    Word file).


    ## Chapter 4: Applications of Regular Expressions in SAS


    ### Output 4.5: PII Raw Text


    ![](img/c58141652486f0486b8350e0431fbb_94_0)


    Now that we have a data source to work with, we can redact all sensitive data
    elements. The challenge of doing this effectively is that we can''t depend on
    the structure of surrounding information to inform the decisions. For this reason,
    it is important that we take care to ensure that we properly identify the elements
    before we redact them.


    Below is the code that performs our redaction of the PII elements SSN, DOB, Street,
    City and Zip. Now, many organizations are allowed to publish small amounts of
    information in advance such as city or phone number. However, we are focusing
    on how to redact all of them, making selection easy. In addition to performing
    the redact steps, we also output the redacted text to a TXT file. This again an
    effort to support realistic use of these techniques. For instance, many organizations
    keep or mention information in text files that are updated by administrative staff.
    There are valid reasons for sharing portions of information either internally
    or with external entities, which must be undertaken with great care. Thus, it
    is useful for such files to be automatically scrubbed before giving a final review
    and sharing with others.


    Note: While the following code is more realistic than what we developed in Chapter
    3, it still needs to be improved for robust real-world applications. The homework
    has some suggestions, but there is still room for refinement.


    ```sas

    data NULL;

    infile=''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt''
    length=lineen

    lrecl=500 pad;

    varlen=input_text $varying. varlen;

    input Redact_SSN = PRXPARSE(''/s/\d{3}-\s*-\d{2}-\s*-\d{4}/'',''REDACTED/o'');

    ```


    ### 82 Introduction to Regular Expressions in SAS


    ```sas

    Redact_Phone = PRXPARSE(''s/(\d\-)?\s*\d(3)\s*\d(3)\s*-\s*\d(4)/REDACTED/o'');

    Redact_DOB = PRXPARSE(''s/(\d(1,2)\s*\d(1,2)\s*\s*\d(4))/REDACTED/o'');

    Redact_Addr = PRXPARSE(''s/(\w+\s+)*w+(\w+\s+)*w+(\w+\s+)*\s+(\s*\d(4))\(\d(5))/REDACTED,
    REDACTED 4 REDACTED'');

    CALL PRXCHANGE(Redact_Addr,1,source_text);

    CALL PRXCHANGE(Redact_SSN,-1,source_text);

    CALL PRXCHANGE(Redact_Phone,-1,source_text);

    CALL PRXCHANGE(Redact_DOB,-1,source_text);

    ```


    ```sas

    file F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\RedactedPII_Output.txt

    put source_text;

    run;

    ```


    - We create different RegEx IDs with the different PII elements that we want to
    redact from our source file—SSN, PhoneNumber, DOB, Street, City, and Zip.

    - We use the CALL PRXCHANGE routine to allow the four different patterns in sequence.

    - Using the file statement, we create an output file for writing our resulting
    texts. Since we overwrote the original text using the CALL PRXCHANGE routine (i.e.,
    changes were inserted back into source_text), we need to output only the original
    variable, source_text, with the PUT statement.


