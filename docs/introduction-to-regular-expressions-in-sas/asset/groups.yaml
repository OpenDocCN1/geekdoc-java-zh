    # ## 3.1 Introduction


    This chapter is focused on developing your understanding of built-in SAS functions
    and call routines, and on starting to do some real SAS coding. Here, you will
    learn the mechanics of how to implement the wonderful RegEx metacharacters introduced
    in Chapter 2. Each function or call routine has associated examples to ensure
    that their use is clear. We also briefly discuss how each is useful.


    # ### 3.1.1 Capture Buffer


    Now, before we go any further, we have to address a concept called the capture
    buffer. The capture buffer is a more advanced technique that I have avoided delving
    into thus far, but it must be understood so that you can use some functions (required
    for PRXPAREN and PRXPOSN, optional for PRXCHANGE). As you should recall from Chapter
    2, parentheses create local groupings within a RegEx, but they also do something
    interesting. For every set of parentheses used in a particular RegEx pattern,
    a slot in a memory buffer is created. This slot in memory is then referenceable
    just like'
  - '[PAGE 53]


    # 40 Introduction to Regular Expressions in SAS


    any variable (a more experienced programmer can think of it like a pointer buffer).
    Each slot is created in sequential order of parent(thes) pair occurrence and is
    referenced accordingly using the $ sign.


    For example, the RegEx s(t) (cat) (is) (fat)/$4 $3 $1/ creates the output "Fat
    is cat". Now, imagining that ability to link unknown data elements instead of
    just using literals. This could become a very powerful capability for for standardizing
    or restructuring data to meet specific needs.


    # 3.2 Built-in SAS Functions


    In this section, we cover the SAS functions for performing RegEx operations. SAS
    functions for RegEx have the same usage limitations as built-in functions. (See
    SAS documentation.) Also just like other functions, they can only take arguments
    and return output in assignment statements and expressions.


    Note: Each RegEx function has PRX at the beginning, which represents Perl-Regular-expressions.


    # 3.2.1 PRXPARSE


    # Description


    This function takes a RegEx pattern as input and provides a numerical RegEx pattern
    identifier as output. The unique pattern identifier is used by other functions
    and call routines to reference the pattern. This function should look similar
    since we use it in our example code in Chapter 2.


    # Syntax


    ```

    RegEx_ID = PRXPARSE (RegEx)

    ```


    RegEx: The pattern to be parsed (input argument, required)


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (output, required)


    Now, it is important to understand at this point PRXPARSE compiles the RegEx in
    order to create the identifier for SAS reference use. And this is what makes the
    RegEx //o option important when using PRXPARSE in code. The //o forces SAS to
    compile the RegEx once, creating the RegEx identifier the first time. When a regular
    RegEx is intended to be used to avoid recompiling every loop through the DATA
    step, we leverage this functionality in order to avoid recompiling the RegEx pattern
    every time it is encountered in code (i.e., each iteration of a DATA step). If
    the pattern is not going to be used every time through the DATA step (e.g., inside
    an IF statement), then we might not want to save memory maintaining it. Otherwise
    we might always want to use the //o—the decision is about tradeoffs. When you''re
    dealing with very few these patterns or with a small amount of data, the tradeoffs
    don''t really apply. But when we scale up to a system using hundreds of patterns,
    or tens of millions of records, the tradeoffs (speed at the expense of memory
    usage) become very important.'
- md: "\n## Chapter 3: Using Regular Expressions in SAS\n\n## Example 3.1: Defining\
    \ Patterns with PRXPARSE\n\nLet's revisit the last bit of code from Chapter 2\
    \ since it is already familiar. The RegEx below is defined as /Smith/o, meaning\
    \ that we are looking for any occurrence of the string literal \"Smith\" within\
    \ the data lines provided. This RegEx is the argument for PRXPARSE, which creates\
    \ a pattern identifier that is assigned to the variable pattern_ID. This variable\
    \ is passed to the call routine PRXSUBSTR, which is discussed in the next section.\
    \ Because you are familiar with the overall function of this code by now, this\
    \ need not be a distraction.\n\nThe output of this RegEx is presented in Output\
    \ 3.1. As we expected, the code found every occurrence of \"Smith\" regardless\
    \ of what was surrounding—including other letters.\n\n```sas\n/*RegEx Testing\
    \ Framework*/\ndata NULL;\npattern = \"Smith/o\"; /*Edit the pattern here.*\n\
    pattern_id = PRXPARSE(pattern);\ninput some_data=$;\ncall prexubstr(pattern_ID,\
    \ some_data, position, length);\nif position ^= 0\ndo;\n  match = substr(some_data,\
    \ position, length);\n  put match:QUOTE. \"found in \" some_data:$QUOTE;\nend;\n\
    datalines;\nSmith, BOB A.\nROBERT Allen Smith\nSmithe, Cindy\n103 Pennsylvania\
    \ Ave. NW, Washington, DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st\
    \ NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n1560 Wilson\
    \ Blvd, Arlington, VA 22209\n1-800-4567\n1(800) 789-1234\nrun;\n```\n\nOutput\
    \ 3.1: Log Output of Pattern /Smith/o\n\n\"Smith\" found in \"Smith, BOB A.\"\n\
    \"Smith\" found in \"ROBERT Allen Smith\"\n\"Smith\" found in \"Smithe, Cindy\"\
    \n\n## 42 Introduction to Regular Expressions in SAS\n\n### 3.2.2 PRXMATCH\n\n\
    ### Description\n\nPRXMATCH returns the numerical position of the first character\
    \ in the matched RegEx pattern. Additionally, it can be used in IF statements\
    \ to test for a pattern match without a variable assignment, just like many other\
    \ familiar SAS functions. The first argument to PRXMATCH is either the RegEx or\
    \ RegEx_ID. The second is the source variable or string literal.\n\n### Syntax\n\
    \n```sas\nPosition = PRXMATCH(RegEx_ID or RegEx, Source_Text)\n\nRegEx_ID: Unique\
    \ RegEx identifier returned by PRXPARSE (input argument, required if RegEx not\
    \ used)\nRegEx: The pattern to be matched (input argument, required if RegEx_ID\
    \ is not used)\nSource_Text: The text variable or literal to be operated upon\
    \ (input argument, required)\nPosition: Numerical position variable assignment\
    \ (output, required)\n```\n\nAs discussed with the PRXPARSE function, RegEx patterns\
    \ are compiled by SAS for use by other functions. Therefore, in addition to using\
    \ the actual RegEx, PRXMATCH is able to leverage the previously compiled RegEx\
    \ via the RegEx ID in lieu of the RegEx itself. This allows us to compile the\
    \ RegEx once via the PRXPARSE function (using the /o option), minimizing the associated\
    \ computing cycles. Small savings in computing cycles can provide significant\
    \ when processing large volumes of text.\n\nThe two different methods for leveraging\
    \ RegEx patterns create significant flexibility in how PRXMATCH can be used in\
    \ practice. By not needing to compile the RegEx in advance, PRXMATCH allows us\
    \ to embed RegEx patterns throughout our code without the extra memory allocated\
    \ to maintain them for each loop through the DATA step. This is very useful when\
    \ you are using PRXMATCH in a dynamic way, as inside nested IF statements where\
    \ the RegEx is used only when certain conditions are true. Depending on the implementation,\
    \ there are implications for speed as well as for memory usage.\n\n## Example\
    \ 3.2: Finding Strings in Source Text with PRXMATCH\n\nLet's try a simple example\
    \ to see how this function is used in practice. Suppose we want to find a string\
    \ as “Street” in a source text. The code below demonstrates how we print the position\
    \ of each occurrence to the log. Obviously, we need to do more than just print\
    \ the position in practice (such as by extracting or manipulating the matched\
    \ text), but this demonstrates the basic functionality of PRXMATCH.\n\n## Chapter\
    \ 3: Using Regular Expressions in SAS 43\n\nThe PRXMATCH function is implemented\
    \ in this code with RegExp as the first argument the datelines reference address\
    \ as the second argument. The result is assigned to the variable Position. The\
    \ value of Position is written to the log using the PUT statement.\n\nCount the\
    \ characters in the data lines. At what position do we encounter the “S” on “Street”\
    \ on the lines in which they occur? Comparing the results to Output 3.2, we see\
    \ that PRXMATCH is returning the position for the first character in the pattern\
    \ match.\n\n```sas\ndata _NULL;\ninput address $50;\nposition = PRXMATCH('/Street/o',\
    \ address);\nif position = 0 then\ndo\n  put position=;\nend;\ndatalines\n103\
    \ Pennsylvania Ave NW, Washington, DC 20216\n508 First Street NW, Washington,\
    \ DC 20001\n650 last St Ne, Washington, DC 20002\n3000 K Street NW, Washington,\
    \ DC 20007\nrun;\n```\n\nOutput 3.2: Log Printout for Positions of “Street”\n\n\
    ```\nposition=11\nposition=8\n```\n\n### 3.2.3 PRXCHANGE\n\nThis function searches\
    \ for the pattern—provided in the first argument by either RegEx_ID or RegExp—within\
    \ the source text that provided in the third argument. The pattern is matched\
    \ the number of times given in the second argument. Upon finding each match, the\
    \ function returns the changed text as required by the RegExp. If no match is\
    \ found, PRXCHANGE returns the original text unchanged.\n\n### Syntax\n\n```sas\n\
    Output_String = PRXCHANGE(RegExp_ID or RegExp, Num_Times, Input_String)\n```\n\
    \nRegExp_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required\
    \ if RegExp not used)\nRegExp: The pattern to be matched (input argument, required\
    \ if RegExp_ID not used)\n\n## 44 Introduction to Regular Expressions in SAS\n\
    \nNum_Times: Number of times the change is to applied (input argument, required).\
    \ -1 forces the function to make the changes as many times as the pattern occurs\
    \ in the source text.\nInput_String: Input variable (input argument, required)\n\
    Output_String: Output variable assignment (output, required)\n\nJust like the\
    \ PRXMATCH function, PRXCHANGE is able to use the actual RegEx pattern or the\
    \ RegExp ID, providing significant flexibility. The preferred use depends on the\
    \ desired application. This function is very useful for data standardization,\
    \ as you will see in more examples in the next chapter. We will work through two\
    \ examples to demonstrate some basic functionality of PRXCHANGE, as well as to\
    \ demonstrate how to leverage capture buffer.\n\n### Example 3.3: Standardizing\
    \ Data\n\nData standardization is a relatively simple, yet powerful, capability\
    \ provided by RegEx in SAS. PRXCHANGE enables us to scrub our data so that each\
    \ occurrence of a word or phrase is exactly the same (or removed). Data scrubbing\
    \ is especially important when you are attempting to perform advanced applications\
    \ as text mining. For instance, before doing any analysis of our data, we want\
    \ to know that each occurrence of the word “street” is exactly the same. If each\
    \ occurrence were not identical, we might perform a word frequency count on document\
    \ with invalid results like “street,” “Street,” “St.,” and so on would be counted\
    \ separately. Depending on the eventual use of this information, such problems\
    \ could be disastrous.\n\n```sas\ndata NULL;\ninput address $50;\ntext = PRXCHANGE('/^\\\
    s+([Ss]t)?|st\\)\\s+/St\\. /o',1,address);\nput text;\n\ndatalines;\n103 Pennsylvania\
    \ Ave NW, Washington, DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st\
    \ St NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\nrun;\n\
    ```\n\nOutput 3.3: Log with Updated Data\n\n| 103 Pennsylvania Ave NW, Washington,\
    \ DC 20216 |\n| 508 First St. NW, Washington, DC 20001 |\n| 650 1st St NE, Washington,\
    \ DC 20002 |\n| 3000 K Street NW, Washington, DC 20007 |\n\n## Chapter 3: Using\
    \ Regular Expressions in SAS 45\n\n**Note:** There are often a number of ways\
    \ to achieve the same outcome. Understanding the context of an application will\
    \ help you determine the RegEx pattern to use.\n\n## Example 3.4: Using the Capture\
    \ Buffer\n\nRevisiting Example 3.3, suppose we now want to also make the addresses\
    \ available to a system that accepts only comma separated values (CSV) files.\
    \ This is a great opportunity to use the capture buffer. With only a couple of\
    \ minor changes, we can now process the data lines to CSV ready. The new line\
    \ of code uses PRXCHANGE with a complex RegEx that changes the address into the\
    \ street, city, state, and ZIP code components. And we see that the new line takes\
    \ the output variable Text as the input argument, instead of address. Doing this\
    \ to make changes to the already changed text. If we were to use address, we would\
    \ merely update the original data lines than building on the previous step.\n\n\
    In reviewing the parentheses elements in the new RegEx, we can see how the four\
    \ address components are identified. On that same line, each of the four elements\
    \ is placed via the buffer reference, with a comma and space immediately following.\
    \ Reviewing Output 3.4, we see that the code produces the expected outcome.\n\n\
    ```sas\ndata NULL;\ninput address $50;\ntext = PRXCHANGE('/^\\s+(Street|St|st|)\\\
    s+St\\. /o',-1,address);\ntext2 = PRXCHANGE('/(.+?),\\s+(\\w+)?\\s+(\\w+)?\\s+(\\\
    d+)?/$1, $2, $3,$4/o,-1,text);\nput text2;\n\ndatelines;\n103 Pennsylvania Ave\
    \ NW, Washington, DC 20216\n508 First St NW, Washington, DC 20001\n650 1st St\
    \ NE, Washington, DC 20002\n300 K Street NW, Washington, DC 20007\nrun;\n```\n\
    \nOutput 3.4: Corrected Data in the Log\n\n| 103 Pennsylvania Ave NW, Washington,\
    \ DC 20216 |\n| 508 First St NW, Washington, DC. 20001 |\n| 650 1st St NE, Washington,\
    \ DC 20002 |\n| 300 K St NW, Washington, DC, 20007 |\n\n"
  mdcn: "\n\n## 第 3 章：在 SAS 中使用正则表达式\n\n## 示例 3.1：使用 PRXPARSE 定义模式\n\n让我们回顾第 2 章中的最后一段代码，因为它已经很熟悉了。下面的正则表达式定义为\
    \ `/Smith/o`，这意味着我们要在提供的数据行中查找字符串字面量 \"Smith\" 的任何出现情况。该正则表达式是 PRXPARSE 的参数，它创建一个模式标识符并将其赋值给变量\
    \ `pattern_ID`。该变量被传递给调用程序 `PRXSUBSTR`，我们将在下一节讨论它。由于你现在已经熟悉了这段代码的整体功能，因此这不需要分心。\n\
    \n该正则表达式的输出位于输出 3.1 中。正如我们预期的，无论周围是什么（包括其他字母），代码都找到了 \"Smith\" 的每一次出现位置。\n\n```sas\n\
    /*RegEx Testing Framework*/\ndata NULL;\npattern = \"Smith/o\"; /*在此处编辑模式.*\n\
    pattern_id = PRXPARSE(pattern);\ninput some_data=$;\ncall prexubstr(pattern_ID,\
    \ some_data, position, length);\nif position ^= 0\ndo;\n  match = substr(some_data,\
    \ position, length);\n  put match:QUOTE. \"found in \" some_data:$QUOTE;\nend;\n\
    datalines;\nSmith, BOB A.\nROBERT Allen Smith\nSmithe, Cindy\n103 Pennsylvania\
    \ Ave. NW, Washington, DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st\
    \ NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n1560 Wilson\
    \ Blvd, Arlington, VA 22209\n1-800-4567\n1(800) 789-1234\nrun;\n```\n\n输出 3.1：模式\
    \ /Smith/o 的日志输出\n\n\"Smith\" found in \"Smith, BOB A.\"\n\"Smith\" found in \"\
    ROBERT Allen Smith\"\n\"Smith\" found in \"Smithe, Cindy\"\n\n## 42 SAS 正正则表达式简介\n\
    \n### 3.2.2 PRXMATCH\n\n### 描述\n\nPRXMATCH 返回匹配的正则表达式模式中第一个字符的数值位置。此外，它可以用于 IF\
    \ 语句以测试模式匹配，而无需进行变量赋值，就像许多其他熟悉的 SAS 函数一样。PRXMATCH 的第一个参数是正则表达式 RegEx 或 RegEx_ID。第二个参数是源变量或字符串字面量。\n\
    \n### 语法\n\n```sas\nPosition = PRXMATCH(RegEx_ID or RegEx, Source_Text)\n\nRegEx_ID:\
    \ 由 PRXPARSE 返回的唯一正则表达式标识符（输入参数，如果不使用 RegEx 则必需）\nRegEx: 要匹配的模式（输入参数，如果不使用 RegEx_ID\
    \ 则必需）\nSource_Text: 要操作的文本变量或字面量（输入参数，必需）\nPosition: 数值位置变量赋值（输出，必需）\n```\n\n\
    正如在 PRXPARSE 函数中讨论的那样，正则表达式由 SAS 编译以供其他函数使用。因此，除了使用实际正则表达式外，PRXMATCH 能够通过 RegEx\
    \ ID 利用之前编译的正则表达式，而不是使用正则表达式本身。这允许我们通过 PRXPARSE 函数编译一次正则表达式（使用 `/o` 选项），最大限度地减少相关的计算周期。在处理大量文本时，计算周期的微小节省可以非常显著。\n\
    \n利用正则表达式模式的两种不同方法为 PRXMATCH 在实践中的用法创造了极大的灵活性。由于不需要预编译正则表达式，PRXMATCH 允许我们将正则表达式嵌入到整个代码中，而无需为每次遍历\
    \ DATA 步维护它们而分配额外的内存。当你以动态方式使用 PRXMATCH 时非常有用，例如在嵌套 IF 语句内部，只有当某些条件成立时才使用正则表达式。根据实现的不同，这对速度和内存使用都有影响。\n\
    \n## 示例 3.2：使用 PRXMATCH 在源文中查找字符串\n\n让我们尝试一个简单的示例，看看此函数如何在实践中使用的。假设我们要在源文中找到名为“Street”的字符串。下面的代码演示了如何将每次出现的位置打印到日志中。显然，在实践中，我们需要执行打印位置之外的操作（例如提取或处理匹配的文本），但这演示了\
    \ PRXMATCH 的基本功能。\n\n## 第 3 章：在 SAS 中使用正则表达式 43\n\n在这段代码中实现了 PRXMATCH 函数，以正则表达式作为第一个参数，以\
    \ datelines 引用地址作为第二个参数。结果赋值给变量 `Position`。`Position` 的值使用 PUT 语句写入日志。\n\n计算数据行中的字符数。在出现“Street”的行中，我们在哪个位置遇到“S”？通过将结果与输出\
    \ 3.2 进行比较，我们看到 PRXMATCH 返回的是模式匹配中第一个字符的位置。\n\n```sas\ndata _NULL;\ninput address\
    \ $50;\nposition = PRXMATCH('/Street/o', address);\nif position = 0 then\ndo\n\
    \  put position=;\nend;\ndatalines\n103 Pennsylvania Ave NW, Washington, DC 20216\n\
    508 First Street NW, Washington, DC 20001\n650 last St Ne, Washington, DC 20002\n\
    3000 K Street NW, Washington, DC 20007\nrun;\n```\n\n输出 3.2：“Street”位置的日志输出\n\n\
    ```\nposition=11\nposition=8\n```\n\n### 3.2.3 PRXCHANGE\n\n该函数在第三参数提供的源文中搜索由第一个参数（RegEx_ID\
    \ 或 RegExp）提供的模式。匹配的次数为第二个参数指定的次数。在找到每次匹配时，函数根据 RegExp 返回更改后的文本。如果没有找到匹配，PRXCHANGE\
    \ 返回原始文本。\n\n### 语法\n\n```sas\nOutput_String = PRXCHANGE(RegExp_ID or RegExp,\
    \ Num_Times, Input_String)\n```\n\nRegExp_ID: 由 PRXPARSE 返回的唯一正则表达式标识符（输入参数，如果不使用\
    \ RegExp 则必需）\nRegExp: 要匹配的模式（输入参数，如果不使用 RegEx_ID 则必需）\n\n## 44 SAS 正表达式简介\n\n\
    Num_Times: 应用更改的次数（输入参数，必需）。-1 强制根据模式在源文中出现的次数进行更改。\nInput_String: 输入变量（输入参数，必需）\n\
    Output_String: 输出变量赋值（输出，必需）\n\n就像 PRXMATCH 函数一样可以使用实际的正则表达式模式或 RegExp ID，提供了很大的灵活性。这取决于所需的应用程序。该函数对于数据标准化非常有用，将在下一章看到更多示例。\n\
    \n### 示例 3.3：标准化数据\n\n数据标准化是 SAS 提供的一种相对简单但强大的功能。PRXCHANGE 允许我们清洗数据，使每个单词或短语完全相同。当你尝试进行高级文本挖掘时，数据清洗尤为重要。例如，在对数据进行任何分析之前，我们希望“street”单词的每次出现都是完全相同的。如果每次出现都不相同，可能会对“street”、“Street”、“St.”等无效结果进行词频统计。根据信息的最终用途，这可能是灾难性的。\n\
    \n```sas\ndata NULL;\ninput address $50;\ntext = PRXCHANGE('/^\\s+([Ss]t)?|st)\\\
    s+/St\\. /o',1,address);\nput text;\n\ndatalines;\n103 Pennsylvania Ave NW, Washington,\
    \ DC 20216\n508 First St. NW, Washington, DC 20001\n650 1st St NE, Washington,\
    \ DC 20002\n3000 K Street NW, Washington, DC 20007\nrun;\n```\n\n输出 3.3：带更新数据的日志\n\
    \n| 103 Pennsylvania Ave NW, Washington, DC 20216 |\n| 508 First St. NW, Washington,\
    \ DC 20001 |\n| 650 1st St NE, Washington, DC 20002 |\n| 3000 K Street NW, Washington,\
    \ DC 20007 |\n\n## 第 3 章：在 SAS 中使用正则表达式 45\n\n**注意：** 通常有多种方法可以实现相同的结果。理解应用的上下文将帮助你确定要使用的正则表达式。\n\
    \n## 示例 3.4：使用缓冲区\n\n回顾示例 3.3，假设我们现在还想将地址提供给仅接受逗号分隔值（CSV）文件的系统。这是一个使用缓冲区的极佳机会。只需进行少量更改，我们现在就可以将数据行转换为\
