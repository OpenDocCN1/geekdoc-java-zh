    # Greedy n Times


    The modifier [n] creates a match of exactly n times. Being able to match the same
    as typing that metacharacter out many times. However, from the perspective of
    coding and maintaining the RegEx patterns, using the modifier is a much better
    approach. It limits the opportunity for us to make typographical errors when initially
    creating the RegEx pattern, and Table 2.27 provides examples.


    # Table 2.27: Examples using (n)


    | Usage | Matches |

    |---|---|

    | /1-800-d{3}-d{4}/ /Rw[4]/ /19\D{3}/Street/ /\d{3,}-\d{4}(\d{5})/ | "1-800-123-4567"
    "1.800.123.4567" ...<br>"Round" "Runts" "Ruins" ...<br>"19th Street" "19th.Street"
    "19...Street" ...<br>"12345-6789" "12345" ... |


    # Greedy n or More


    The modifier [n,] creates a match at least n times. By ensuring that we can match
    something at least n, we are able to create functionality very similar to the
    plus modifier. However, we are raising the minimum number of times that the metacharacter
    must match. This is quite useful for certain applications, but must be handled
    with caution. Also, the + modifier, can easily get very long strings of unanticipated
    matches due to a single logical error in pattern construction. Table 2.28 provides
    examples.


    # Table 2.28: Examples using (n,)


    | Usage | Matches |

    |---|---|

    | /1-800-\d{1,}-\d{2}/ /\d{3,}-\d{2,}-\d{4}/ /19\D{3}/Street/ | "1-800-123-4567"
    "1-800-789-12" ...<br>"143-25-7689" "12345689-54654565-9820" ...<br>"19th Street"
    "19th, Not My Street" ... |


    # 28 Introduction to Regular Expressions in SAS


    **Note:** Be mindful to type a space after the comma inside the curly braces.
    It is easy to do out of habit, but it will wreck our pattern!


    # Greedy n to m Times


    The modifier {n,m} creates a match at least *n*, but not more than *m* times.
    Creating a match with a specified range is quite useful for ensuring data quality
    standards are being maintained. When extracting semi-structured data elements
    as ZIP codes, birthdates, and phone numbers, it is important to maintain a certain
    level of flexibility while also ensuring that the source is within tolerances.
    For instance, a two-digit year might be accepted in lieu of a four-digit year,
    but a four-digit zip would be unacceptable. Table 2.29 provides examples.


    Table 2.29: Examples using {n


    | Usage | Matches |

    | --- | --- |

    | /(1-)?\d-\d[3,3]-\d[4,4]/ | "1-800-123-4567" ... |

    | /\d[1,2]-\d[1,2]-\d[2,4]/ | "10-20-1950" "8-30-52" "4-3-1979"... |

    | /Wash{1,7}/ | "Washington" "Wash" "Waste" "Washing"... |


    **Note:** As you can see in the examples above, the {n,m} might not always be
    the best choice of modifier, but these examples are meant to demonstrate the flexibility
    of implementation. For instance, the year in the second example is allowed to
    be three digits with this usage. Using an OR clause with the {n} modifier is a
    simple fix.


    # Introduction to Lazy Repetition Modifiers


    Now that you are familiar with greedy modifiers, let''s begin examining the lazy
    ones. In terms of syntax, they differ from greedy modifiers only by the addition
    of a question mark (?). By adding the question mark immediately after each of
    the greedy modifiers, we are able to subtly change their behavior—in unexpected
    ways.


    In general, lazy modifiers are used to avoid overmatching and improve performance
    compared to greedy modifiers. There are situations when matching with greedy modifiers
    would lead to either grabbing too much information, or simply slowing down system
    performance. For instance, processing semi-structured text files as HTML or XML
    is a great example of when lazy modifiers would come in.


    # Lazy 0 or More


    The modifier {*} creates a match 0 or more times, but as few as necessary to create
    the match.


