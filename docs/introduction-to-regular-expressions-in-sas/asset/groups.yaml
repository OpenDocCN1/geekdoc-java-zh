    # 第 2 章：正则表达式入门 23


    ## 2.5 修饰符 (Modifiers)


    在之前的章节中，你可能注意到了两个点，值得在这里进一步讨论。首先，到目前为止所有应用的元字符都会忽略字母的大小写。也就是说，`\w`、`\S`、`\D` 等匹配时不取决于字母是小写还是大写。然而，在某些情况下，字母的大小写变得很重要，但字母本身是预未知的。


    其次，我们可以根据需要多次使用单个匹配字符，这为我们的匹配增加了额外的模糊性。但是，仅仅列出它们也有缺点：每个出现的情况都必须按顺序存在才能匹配模式。例如，如果上述
    `\D` 示例的源包含没有空格的 "19thStreet"，那么我们使用三次 `\D` 将永远无法找到它。由于正则表达式功能的主要目标是自动化文本处理，我们需要一种稳健的方法来让这种匹配更具灵活性。


    在接下来的小节（2.5.1 和 2.5.2）中，我们将学习使用修饰符来克服这些局限性。修饰符有两种类型：大小写修饰符和重复修饰符。通过将它们结合，我已经介绍了一种在现实正则表达式实现中处理这种情况的初级方法，它们应该被视为与我们目前讨论的元字符同等重要的现实世界实现基础知识。


    ## 2.5.1 大小写修饰符


    在对文本进行匹配时，显然的考虑因素是字母的大小写（大写 vs. 小写）。尽管我已经介绍了一种在字母未知时处理这种情况的初级方法，但在字母未知时，必须有一套方法来考虑字母的大小写。本节讨论了处理大小写匹配的各种方法。根据情况，某些方法比其他方法更方便，但并不一定有对错之。


    ### 小写


    当模式中的下一个字符是小写时，`\l` 匹配。该元字符适用于字符（元字符、分组等不起作用）。在实践中，直接输入所需字符的小写版本，或提供一个要匹配的小写字母列表会更实用。表
    2.19 提供了示例。


    | 表 2.19：使用 `\l` 的示例 |

    | 用法 | 匹配项 |

    | `\lStreet/` | "street" ... |

    | `\sIS\IA\sInstitute/` | "sas Institute" ... |

    | `/(IS\|F)leet/` | "fleet" ... |


    ### 大写


    元字符 `\u` 匹配模式中的下一个字母是大写字母。它的功能与上面介绍的小写版本（`\l`）完全相同，但也适用于大写。表 2.20 提供了示例。


    | 表 2.20：使用 `\u` 的示例 |

    | 用法 | 匹配项 |

    | `\uinc./` | "Inc." ... |

    | `\ustreet\ust]./` | "Street" "St." ... |

    | `\uave\uavenue,/` | "Ave." "Avenue," |


    ### 小写范围


    元字符 `\L...\E` 将 `\L` 和 `\E` 之间的所有字符按小写匹配。在 `\L` 和 `\E` 之间输入的字符串将被强制匹配小写，即使它们是用大写字母输入的。与
    `\L` 元字符不同，`\L...\E` 还可以包含字符类和重复修饰符。表 2.21 提供了示例。


    | 表 2.21：使用 `\L...\E` 的示例 |

    | 用法 | 匹配项 |

    | `\[[a-z0-9][a-z0-9][a-z0-9]\E/` | "sas" "abc" "123" ... |

    | `\LTHSE ARE LOWERCASE` | "these are lowercase" |

    | `\sR\L[a-z][a-z]\s/` | "Read" "Road" "Rode" "Ride" "Real" ... |


    > 注意：当对非字母字符应用修饰符时，该修饰符会被忽略。它不会影响匹配。


    ### 大写范围


    元字符 `\U...\E` 在 `\U` 和 `\E` 之间的所有字符均为大写时创建匹配。同样，此元字符的功能与上面讨论的小写版本相同，但适用于大写。该元字符对于识别缩写字母或其他大写字母重要的文本非常有用。表
    2.22 提供了示例。


    | 表 2.22：使用 `\U...\E` 的示例 |

    | 用法 | 匹配项 |

    | `\[[a-z][a-z][a-z]\E/` | "SAS" "CIA" ... |

    | `\[[a-z][a-z][a-z]\E\sInstitute\W/` | "SAS Institute Inc." ... |

    | `\sallcaps\E/` | "ALLCAPS " |


    **注意：** 注意在 `\L...\E` 或 `\U...\E` 元字符内部不允许使用其他元字符。也就是说，`\w` 不能用于替换上述字符类。


    ### 引用范围


    元字符 `\Q...\E` 将 `\Q` 和 `\E` 内部的所有内容作为字符字符串匹配，禁用包括反斜杠在内的所有功能。元字符不能在 `\Q...\E` 中使用。此元字符提供的功能非常适合搜索包含大量转义字符的字符串，例如
    XML、Web 服务器日志或 HTML。表 2.23 提供了示例。


    | 用法 | 匹配项 |

    | --- | --- |

    | `\Q.*\E/` | ".*" |

    | `\Qf(x)\E/` | "f(x)" |

    | `\Q\w+ \E/` | "\w+" |


    ## 2.5 重复修饰符


    修饰符有两种：大小写修饰符和重复修饰符。通过将它们结合，我已经介绍了一种在现实正则表达式实现中处理这种情况的初级方法，它们应该被视为与我们目前讨论的元字符同等重要的现实世界实现基础知识。


    在接下来的小节（2.5.1 和 2.5.2）中，我们将学习使用修饰符来克服这些局限性。重复修饰符改变了字符或组匹配的次数、迭代（循环）和数据源。需要注意这些因素。


    ### 0 次或多次


    修饰符 `*` 要求紧 preceding字符或元字符匹配 0 次或多次。它允许可选匹配。例如，我们可能想要匹配单词的每个出现情况。通过允许前缀和后缀可选，我们能够实现这一目标。表
    2.24 提供了示例。


    | 表 2.24：使用 `*` 的示例 |

    | 用法 | 匹配项 |

    | --- | --- |

    | `/Sing/w*` | "Sings" "Sings" "Singing" "Singer" "Sings" ... |

    | `/D\W*C*/` | "DC" "D.C" "D " ... |

    | `/19\D*Street/` | "19th Street" "19Street" "19" ... |

