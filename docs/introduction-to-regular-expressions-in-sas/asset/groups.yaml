    \ PII，因为我们只是在演示 CALL PRXCHANGE 的功能。然而，这一过程在下一章将以更严谨、更大的规模进行。\n\n### SAS 正则表达式简介\n\
    \n在下面的代码中，我们首先创建一个传递到 DATA 步的数据集，名为 example。该数据集包含各种配置的名称、地址和电话号码信息。在 DATA 步中，我们使用\
    \ PRXPARSE 创建一个 RegEx ID，然后使用 CALL PRXCHANGE 执行正则表达式规定的更改。注意，有一个正则表达式被注释掉了。该行中的正则表达式的行为与初始的\
    \ RegEx ID 定义不同，这允许我们演示 trunc 和 num 选项。我们使用这个 RegEx ID 创建了输出 3.8.2。在 DATA 步之后，我们执行\
