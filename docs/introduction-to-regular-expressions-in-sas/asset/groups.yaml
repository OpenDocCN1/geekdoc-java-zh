    \ Position. The value of Position is written to the log using the PUT statement.\n\
    \nCount the characters in the data lines. At what position do we encounter the\
    \ “S” on “Street” on the lines in which they occur? Comparing the results to Output\
    \ 3.2, we see that PRXMATCH is returning the position for the first character\
