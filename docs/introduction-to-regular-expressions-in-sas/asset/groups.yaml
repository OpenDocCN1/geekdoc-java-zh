    ## 3.1 Introduction


    This chapter is focused on developing your understanding of built-in SAS functions
    and call routines. Here you will learn how to use the metacharacters introduced
    in Chapter 2 in more practical scenarios.


    ### 3.1.1 Capture Buffer


    Now, before we go further, we have to address a concept called capture buffer.
    The capture buffer is an advanced technique that I have avoided thus far, but
    it must be understood so you can use PRXREN and PRXPOSN. Each set of parentheses
    creates a local buffer, which is created in memory. This slot is then referenced.


    ## 3.2 Built-in SAS Functions


    In this section, we cover the SAS functions for performing RegEx operations. SAS
    functions for RegEx have the same usage limitations as built-in functions (See
    SAS documentation.). Also just like other functions, they can only take arguments
    and return output.


    Note: Each RegEx function has PRX at the beginning, which represents Perl-expressions.


    ### 3.2.1 PRXPARSE


    #### Description


    This function takes a RegEx pattern as input and provides a numerical RegEx identifier
    as output. The unique pattern identifier is used by other functions and call routines
    to reference the pattern. This function should look similar since we use it in
    our example code in Chapter 2.


    #### Syntax


    ```

    RegEx_ID = PRXPARSE (RegEx)

    ```


    RegEx: The pattern to be parsed (input argument, required)


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (output, required)


    Now, it is important to understand at this point PRXPARSE compiles the RegEx in
    order to create the identifier for SAS reference. And this is what makes the RegEx
    //o option important when using PRXPARSE in code. The //o forces SAS to compile
    the RegEx once, creating the RegEx identifier the first time. When a regular RegEx
    is intended to be used to avoid recompiling every loop through the DATA step,
    we leverage this functionality in order to avoid recompiling the RegEx pattern
    every time it is encountered in code (i.e., each iteration of a DATA step). If
    the pattern is not going to be used every time through the DATA step (e.g., inside
    an IF statement), then we might not want to save memory maintaining it. Otherwise
    we might always want to use the //o—the decision is about tradeoffs. When you''re
    dealing with very few these patterns or with a small amount of data, the tradeoffs
    don''t really apply. But when we scale up to a system using hundreds of patterns,
    or tens of millions of records, the tradeoffs (speed at the expense of memory
    usage) become very important.

