    # 关于本书


    ## 目的


    本书面向广泛的 SAS 用户群体，从初级程序员到高级专家均。由于以前关于该主题的出版较少，不同技能水平的读者都能从本书中受益。然而，本书的编写旨在确保初级程序员能够立即实施所讨论的每一个元素。


    ## 这本书适合你吗？


    当然，适合！你希望处理非结构化数据源吗？你是否想更有效地处理半结构化数据源？你是否希望有一天能在你的 Base SAS 代码中利用高级的文本挖掘概念？你当然是这样的！本书为这一切奠定了基础，是任何想要增强编程能力的人的理想教材。


    ## 先决条件


    读者应该熟练使用和应用 SAS DATA 步、基础 PROC（例如 `PROC PRINT`）、DO 循环和条件处理概念。读者应熟悉 SAS 数组和 `RETAIN`
    语句。


    ## 本书范围


    本书涵盖所有的 PRX 函数和调用例程。


    本书**不**涵盖需要 MACRO 编程、PROC SQL 和系统自动化的高级概念。


    # 关于示例


    ## 开发本书内容的软件


    Base SAS (Microsoft Windows)


    ## 示例代码与数据


    你可以通过链接到作者页面 http://support.sas.com/publishing/authors 访问本书的示例代码和数据。选择作者姓名。然后查找本书的封面缩略图，并选择“Example
    Code and Data”来显示书中包含的 SAS 程序。


    对于所有提供示例代码和数据的书籍字母列表，请参阅 http://support.sas.com/bookcode。选择标题以显示书籍的示例代码。


    如果你无法通过网络访问代码，请发送电子邮件至 sasupport@sas.com。


    ## 本书使用的输出与图形


    本书中使用的所有输出都是通过 SAS 日志和 `PROC PRINT` 生成的。


    ## 其他帮助


    尽管本书说明了许多各行业企业经常进行的分析，但可能会出现针对你特定目标和问题的问题。为了提供全面支持，SAS Institute 和 SAS Press 为你提供了以下资源：


    - 关于本书涵盖的主题，请通过 SAS Press 联系作者：

    - 向 sasupport@sas.com 发送电子邮件问题；请在来信中注明书名。

    - 在 http://support.sas.com/author_feedback 的作者页面提交反馈。

    - 关于本书内或超出本书范围的主题，请在相关的 SAS Support 社区 https://communities.sas.com/welcome 发布问题。

    - SAS Institute 维护着一个包含最新信息的综合网站。对于初学者和资深 SAS 用户来说，特别用的页面是知识库（Knowledge Base）。在
    http://support.sas.com/resources 知识库的“Samples and SAS Notes”部分搜索相关说明。

    - 注册 SAS 用户或其组织可以访问 http://support.sas.com 的 SAS 客户支持。在此处你可以向 SAS 客户支持提交特定问题：点击“Submit
    a Problem”（提交问题）。你需要提供一个可以接收回复的电子邮件地址，识别你的组织，并提供客户站点号或许可证信息。这些信息可以在你的 SAS 日志中找到。


    # 保持联系


    我们期待你的来信。我们欢迎问题、评论和建议。如果你想就特定书籍与我们联系，请在给 saspress@sas.com 的来信中注明书名。


    # 通过 SAS Press 联系作者


    电子邮件：saspress@sas.com


    通过网络：http://support.sas.com/author_feedback


    # SAS 书籍


    有关通过 SAS 提供的完整书籍列表，请访问 http://support.sas.com/bookstore。


    电话：1-800-727-0025


    电子邮件：sasbook@sas.com


    # SAS 报告 (SAS Book Report)


    通过订阅 http://support.sas.com/sbr 接收有关新出版物的最新信息。


    # 与 SAS 出版


    SAS 正在招募作者！你对写书感兴趣吗？访问 http://support.sas.com/saspress


    # 关于作者


    K. Matthew Windham, CAP 是 NTELX Inc. 的分析总监，该公司位于华盛顿特区。他的重点是通过数学和统计建模、数据文本挖掘以及优化来帮助客户。作为长期
    SAS 用户，Matt 喜欢利用 SAS 平台创建新的预测分析。在职业生涯中，Matt 曾在关键环境中领导咨询团队提供高影响力的结果。他还为政府构建了分析解决方案，特别是针对美国国防部和财政部。Matt
    是一位认证分析师（CAP），在北罗来纳州立大学获得应用数学学士，在乔治大学获得数学和统计学硕士学位。


    ![](img/c58184a1652486f0486b8350e431fbb_10_0.png)


    访问其作者页面 http://support.sas.com/publishing/authors/windham.html 了解更多信息。你可以在那里下载免费书籍章节、访问代码和数据、阅读最新评论、获取更新等。


    # 致谢


    感谢我才华的妻子 Lori，感谢你一直以来在我所做事情上的支持和鼓励。没有你，我无法完成这一切。感谢我的朋友和家人，你们的建议和鼓励对我弥足珍贵。


