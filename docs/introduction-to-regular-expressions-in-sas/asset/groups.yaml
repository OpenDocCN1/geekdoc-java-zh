    # Example 3.4: Using the Capture Buffer


    Revisiting Example 3.3, suppose we now want to also make the addresses available
    to a system that accepts only comma separated values (CSV) files. This is a great
    opportunity to use the capture buffer. With only a couple of minor changes, we
    can now process the data lines to CSV ready.


    The new line of code uses PRXCHANGE with a complex RegEx that changes the address
    into the street, city, state, and ZIP code components. And we see that the new
    line takes the output variable Text as the input argument, instead of address.
    Doing this us to make changes to the already changed text. If we were to use address,
    we would merely update the original data lines rather than building on the previous
    step.


    In reviewing the parentheses elements in the new RegEx, we can see how the four
    address components are identified. On that same line, each of the four elements
    is placed via the buffer reference, with a comma and space immediately following.
    Reviewing Output 3.4, we see that the code produces the expected outcome.


    ```

    data NULL;

    input address $50;

    text = PRXCHANGE(''/\s+/(Street|Street|St|st|)/\s+St. /o,,-1,address);

    text2 = PRXCHANGE(''/(.+?),*\s+(\w+)?*\s+(\w+)?*\s+(\d+)?/$1, $2, $3

    $4/o,-1,text);

    put text2;


    datelines;

    103 Pennsylvania Ave NW, Washington, DC 20216

    508 First St NW, Washington, DC 20001

    650 1st St NE, Washington, DC 20002

    300 K Street NW, Washington, DC 20007

    ;

    run;

    ```


    # Output 3.4: Corrected Data in the Log


    |103 Pennsylvania Ave NW, Washington, DC 20216|

    508 First St NW, Washington, DC. 20001|

    650 1st St NE, Washington, DC 20002|

    300 K St NW, Washington, DC, 20007|


    So, what else could we do to the text? A number of things remain to be performed
    in order to make these addresses ready for advanced applications. For instance,
    “Ave” and “1st” should also be standardized. Building on the example above is
    the fastest way to explore the options and become more comfortable with these
    concepts.'
- md: "\n## 3.2.4 PRXPOSN\n\n### Description\n\nPRXPOSN returns the matched information\
    \ from specified capture buffers. This RegEx function requires the RSXUBSTR, PRMATCH,\
    \ PRXNEXT, and PRCHANGE functions to be running before used so that the capture\
    \ buffer can be referenced. Also, RegEx ID is required rather than the actual\
    \ RegEx. Otherwise, PRXPOSN will not work—necessitating the use of PRXPARSE. The\
    \ N input argument is numeric and refers to the capture buffer ($).\n\n### Syntax\n\
    \n```\nText = PRXPOSN(RegEx_ID, N, Source_Text)\n```\n\n- RegEx_ID: Unique RegEx\
    \ identifier returned by PRXPARSE (input argument, required)\n- Integer: Value\
    \ of the capture buffer (input argument, required)\n- Source_Text: The text variable\
    \ or literal to be operated upon (input argument, required)\n- Text: Character\
    \ variable of captured text (output, required)\n\nWhen we know the exact number\
    \ of capture buffer elements (i.e., N is known), we can use PRXPOSN without an\
    \ issue. However, what happens when the number of elements is different from what\
    \ we expect? If there are values in the capture buffer but we make a reference\
    \ to one larger than those available (may there be three, but we make a reference\
    \ to number 5), then a missing value is returned. However, if we reference capture\
    \ buffer position 0 (N=0), the entire pattern is returned regardless of the buffer\
    \ length.\n\nThe next function, PRXPAREN, is very helpful in creating robust code\
    \ when we are using the buffers in conjunction with PRXPOSN. It is also important\
    \ to write robust RegEx patterns to ensure that you prevent issues from popping\
    \ up.\n\n### Example 3.5: Extracting Data with Capture Buffers\n\nIn order to\
    \ make the capture buffer content and this function more clearer, we are going\
    \ to walk through a concrete example. Suppose we want to process addresses for\
    \ which the structure is well known and store various pieces in a SAS data set\
    \ for later use. Since we know the layout of the address, the capture buffer arrangement\
    \ and the application of PRXPOSN are so very straightforward.\n\nFirst, we test\
    \ the RegEx ID variable Text by using the PRXPARSE function in the IF statement.\
    \ Notice that this is an implicit test of a matching (no equal sign is used).\
    \ If a match of the RegEx exists within the identified text source, then we assign\
    \ the capture buffer to variables by PRXPOSN (city, state, and zip).\n\nOutput\
    \ 3.5 displays the values of extract, the data set created in our SAS step. As\
    \ expected, we extracted the city, state, and ZIP code from each datalines entry,\
    \ we’re going to build on this code to create a more sophisticated address extractor\
    \ that includes the street information as well as the ability to include 9-digit\
    \ digits.\n\n```\ndata extract;\ninput address $50;\ntext = PRXPARSE('/\\s*(\\\
    w+),\\s*(\\w+),\\s*(\\d+)/o');\nif PRXMATCH(text, address) then\ndo;\n    city\
    \ = PRXPOSN(text, 1, address);\n    state = PRXPOSN(text, 2, address);\n    zip\
    \ = PRXPOSN(text, 3, address);\noutput;\nend;\ndatalines;\n103 Pennsylvania Ave\
    \ NW, Washington, DC 20216\n508 First St NW, Washington, DC 20001\n650 1st St\
    \ NE, Washington, DC 20002\n3000 K Street NW, Washington, DC 20007\n3000 K Street\
    \ NW, Washington, DC 20007\nrun;\nproc print data=extract;\nrun;\n```\n\n### Output\
    \ 3.5: PROC PRINT Results\n\n| Obs | city | state | zip |\n|---|---|---|---|\n\
    | 1 | Washington | DC | 20216 |\n| 2 | Washington | DC | 20001 |\n| 3 | Washington\
    \ | DC | 20002 |\n| 4 | Washington | DC | 20007 |\n\n## 3.2.5 PRXPAREN\n\n###\
    \ Description\n\nThis function returns the numerical value of the largest capture\
    \ buffer that contains data. It is therefore implicitly required that PRXSUBSTR,\
    \ PRXMATCH, PRXNEXT, or PRXCHANGE run prior to this function being used—just like\
    \ with PRXPOSN. However, the only input argument is RegEx_ID. Simply providing\
    \ the RegEx is not an option, so this function must be used in conjunction with\
    \ the PRXPARE function.\n\n### Syntax\n\n```\nParen=PRXPAREN(RegEx_ID)\n```\n\n\
    - RegEx_ID: Unique RegEx identifier returned by PRXPARE (input argument, required)\n\
    - Paren: Numerical value of the largest capture buffer (output, required)\n\n\
    **Note:** Since this function requires a RegEx_ID in lieu of the actual RegEx,\
    \ it is implied that precedents are then forced to use RegEx_ID instead of RegEx\
    \ as well—otherwise, PRXPAREN cannot be used.\n\nWhat are we really trying to\
    \ achieve with this function? Since it provides the length of the capture buffer\
    \ by telling us the largest buffer to contain text, we know exactly how many buffer\
    \ values we can access. Because we know this, we can avoid errors when referencing\
    \ in code. It is worth noting that effective RegEx coding avoids many errors.\n\
    \n### Example 3.6: Identifying Capture Buffers\n\nIdeally, when we want to use\
    \ PRXPAREN, we need to know how many buffers are available. However, the example\
    \ below demonstrates how to use it.\n\n```\ndata extract;\ninput address $50;\n\
    text = PRXPARSE('/\\s*(\\w+),\\s*(\\w+),\\s*(\\d+)/o');\nif PRXMATCH(text, address)\
    \ then\ndo;\n    city = PRXPOSN(text, 1, address);\n    state = PRXPOSN(text,\
    \ 2, address);\n    zip = PRXPOSN(text, 3, address);\n    max_buf = PRXPAREN(text);\n\
    \    output;\nend;\ndatalines;\n103 Pennsylvania Ave NW, Washington, DC 20216\n\
    508 First St NW, Washington, DC 20001\nrun;\nproc print data=extract;\nrun;\n\
    ```\n\n## 3.3 Built-in Call Routines\n\nIn this section, you will learn about\
    \ PRX routines available for performing many of the same tasks as previously discussed,\
    \ as well as new ones. These differences are explored more thoroughly.\n\n###\
    \ 3.3.1 CALL PRXCHANGE\n\n### Description\n\nThis call routine performs the match-and-replace\
    \ operation similar to that of the PRXCHANGE function. Unlike the function version,\
    \ the call routine must receive a RegEx identifier. Also, there are some additional\
    \ arguments not available in function (result_length and truncation_value). The\
    \ only required arguments are RegEx_ID, Num_Times, and Input_string.\n\n### Syntax\n\
    \n```\nCALL PRXCHANGE(RegEx_ID, Num_Times, Input_string, Output_string, result_length,\
    \ trunc_value, num_changes)\n```\n\n- RegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\n- Num_Times: Number of times the change\
    \ is to be applied (input argument, required)\n- Input_string: Input variable\
    \ (input argument, required)\n- Output_string: Output text variable (input argument,\
    \ optional). Default is Input_string.\n- result_length: Length of the characters\
    \ put into Output_string (returned value, optional)\n- trunc_value: Binary integer\
    \ (0 or 1) value (returned value, optional). 1 means that the inserted text is\
    \ longer than the text replaced. 0 means that the inserted text is either the\
    \ same length or shorter than the text being replaced.\n- num_changes: Number\
    \ of times the changes were made (returned value, optional)\n"
  mdcn: "\n\n## 3.2.4 PRXPOSN\n\n### Description\n\nPRXPOSN 从指定的捕获缓冲区中返回匹配到的信息。此正则表达式函数在使用之前，需要先运行\
    \ `RSXUBSTR`、`PRMATCH`、`PRXNEXT` 和 `PRCHANGE` 函数，以便引用捕获缓冲区。此外，它需要 RegEx ID 而非实际的正则表达式。否则，PRXPOSN\
    \ 将无法工作——这需要使用 `PRXPARSE`。输入参数 `N` 是数值，指代捕获缓冲区 ($)。\n\n### Syntax\n\n```\nText\
    \ = PRXPOSN(RegEx_ID, N, Source_Text)\n```\n\n- RegEx_ID: 由 `PRXPARSE` 返回的唯一正则表达式标识符（输入参数，必需）\n\
    - Integer: 捕获缓冲区的值（输入参数，必需）\n- Source_Text: 要操作的文本变量或字面量（输入参数，必需）\n- Text: 捕获文本的字符变量（输出，必需）\n\
    \n当我们确切知道捕获缓冲区元素的数量数量（即 `N` 是已知的）时，我们可以毫无问题地使用 PRXPOSN。然而，当元素数量与我们预期的不同会发生什么？如果捕获缓冲区中有值，但我们引用的索引超出了范围，PRXPOSN\
    \ 将返回空值。如果在捕获缓冲区中有值，但我们引用的索引为 0，则会返回整个缓冲区。\n\nPRXPOSN 在我们知道捕获缓冲区元素数量时非常有用。在编写代码时，编写有效的正则表达式模式以确保缓冲区内容，并防止出现问题。\n\
    \n### 示例 3.5：使用捕获缓冲区\n\n为了让捕获缓冲区的操作更清晰，我们将通过一个具体的示例来演示。假设我们想要处理具有已知结构的地址，使用 PRXPOSN\
    \ 提取数据。首先，我们通过 `PRXPARSE` 函数测试捕获缓冲区。如果 `PRMATCH` 匹配成功，我们可以根据 `N` 值将捕获缓冲区赋值给变量。PRXPOSN\
    \ 是直观的，它根据 POSN 提取的提取结果。以下代码展示了包含了三个数字的输出。\n\n```sas\ndata extract;\ninput address\
    \ $50;\ntext = PRXPARSE('/\\s*(\\w+),\\s*(\\w+),\\s*(\\d+)/');\nif PRXMATCH(text,\
