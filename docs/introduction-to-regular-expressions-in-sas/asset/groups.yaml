    The remaining information in this chapter provides a solid foundation for building
    robust, complex patterns in the future. Each element discussed is an independently
    useful building block for sophisticated text manipulation and analysis capabilities.
    Once we begin to combine these basic elements, we will create some very powerful
    analytic tools.


    # 2.2 Special Characters


    In addition to / (the forward slash), the characters ) and \ (backslash) are special
    and are thus treated differently than the RegEx metacharacters to be discussed
    later. Since some of these special characters are fundamental to the structure
    of the RegEx pattern construction, we need to briefly discuss them first.


    ()


    +   The two parentheses create logical groups of pattern characters and metacharacters—the
    same way they work in SAS code for logic operations. It is important to create
    logical groupings in order to construct more sophisticated patterns. Nesting the
    parentheses is also possible.


    |


    +   The vertical bar represents a logical OR (much like in SAS). Again, the proper
    use of this element creates more sophisticated patterns. We will explore interesting
    ways to use this character, starting with the example in Table 2.1. It is important
    to remember that the first item in an OR always matches moving to the next condition.


    The backslash is a tricky one because it has couples of uses. It is used as an
    integral component of other metacharacters (examples about Section 2.3). Think
    about it as an initiator that tells SAS, "Hey, this is a metacharacter, not just
    some letter." But that''s not all. Since the characters defined above also appear
    in text that we want to process, the backslash also acts as a blocker that tells
    SAS, "Hey, treat this special character as a regular character." Using \, we can
    create patterns that include parentheses, vertical bars, backslashes, forward
    slashes, and more—we simply add a \ in front of each occurrence of all the special
    characters that we want to treat as characters. For example, if we want our pattern
    to open and closed parentheses respectively, the pattern would contain \(\).'
