    - 2. 创建一个命名变量，提供每行受访者（`Respondents`）的数量。这既有趣又具有挑战性。


    ## 80 SAS 中的正则表达式简介


    - 3. 增强当前的 RegEx 模式以强制匹配具有相同名称的结束标签。现有输出中有两处出现了名为 `SUB` 的格式标签。修复此问题并不困难，但比预期的代码更多。


    ### 4.4 搜索与替换


    特定的搜索和替换需求可能有所不同，但没有地方比 PII（个人身份信息）脱敏更需要这种能力。在公共部门，脱敏很常见，机构之间的信息定期共享通常是强制性的。我们重新查看第
    4.2 节中使用的数据已导出到文本文件。我们已经处理过结构化数据，因此探索非结构化数据是自然的一步。现在在我们进入如何进行脱敏之前，值得显示 TXT 文件是如何创建的。尽管预先知道如何创建，我们仍然希望通过其构造来确保创建了稳健的代码。你可以在下面的代码中看到我们简单地通过
    `SET` 语句获取来自第 4.2 节的结果数据 `FinalPII`。接下来，我们使用 `FILE` 语句创建 TXT 文件。一旦 `FILE` 语句被使用，随后的
    `PUT` 语句写入识别出的变量：


    ```sas

    data NULL;

    set finalpii;

    file ''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt'';

    put firstname ssn;

    run;

    ```


    输出 4.5 显示了该代码提供的输出。正如我们看到的，结构在很大程度上被删除了，这让我们接近现实世界中可能在 Microsoft Word 文件中的 PII。


    ## 第 4 章：正则表达式在 SAS 中的应用


    ### 输出 4.5：PII 原始文本


    ![](img/c58141652486f0486b8350e0431fbb_94_0)


    我们有了可以处理的数据源，就可以脱敏所有敏感数据元素。有效执行此点的挑战在于我们不能依赖周围信息的结构来做出决策。因此，在脱敏它们之前，确保正确识别元素很重要。


    以下是执行 PII 元素（SSN、DOB、街道和邮政编码）脱敏的代码。现在，许多机构被允许提前发布少量信息，如城市或电话号码。然而，我们专注于如何脱敏所有，使选择变得容易。在执行脱敏步骤之外，我们将脱敏后的文本输出到
    TXT 文件。这也是为了支持这些技术的实际应用。例如，许多组织保留行政人员更新的文件中信息。内部或外部实体共享部分信息必须非常小心。因此，在进行最终审查和共享之前，对此类文件进行自动清理是有用的。


    注意：虽然以下代码比我们在第 3 章开发的更真实，但仍然需要改进以适应现实世界的应用。作业提供了一些建议，但仍有改进空间。


    ```sas

    data NULL;

    infile=''F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\FinalPII_Output.txt''
    length=line

    lrecl=500 pad;

    varlen=input_text $varying. varlen;

    input Redact_SSN = PRXPARSE(''/s/\d{3}-\s*-\d{2}-\s*-\d{4}/'',''REDACTED/o'');

    ```


    ### 82 SAS 中的正则表达式简介


    ```sas

    Redact_Phone = PRXPARSE(''s/(\d\-)?\s*\d(3)\s*\d(3)\s*-\s*\d(4)/REDACTED/o'');

    Redact_DOB = PRXPARSE(''s/(\d(1,2)\s*\d(1,2)\s*\s*\d(4))/REDACTED/o'');

    Redact_Addr = PRXPARSE(''s/(\w+\s+)*w+(\w+\s+)*w+(\w+\s+)*\s+(\s*\d(4))\(\d(5))/REDACTED,
    REDACTED 4 REDACTED'');

    CALL PRXCHANGE(Redact_Addr,1,source_text);

    CALL PRXCHANGE(Redact_SSN,-1,source_text);

    CALL PRXCHANGE(Redact_Phone,-1,source_text);

    CALL PRXCHANGE(Redact_DOB,-1,source_text);

    ```


    ```sas

    file F:\Introduction to Regular Expressions with SAS\Chapter_4_Example_Source\RedactedPII_Output.txt

    put source_text;

    run;

    ```


    - 我们从源文件中想要脱敏的不同 PII 元素（SSN、电话号码、DOB、街道、城市和邮政编码）创建了不同的 RegEx ID。

    - 我们使用 `CALL PRXCHANGE` 例程按顺序允许不同的模式。

    - 使用 `file` 语句，我们创建一个写入结果文本的输出文件。由于我们使用 `CALL PRXCHANGE` 例程覆盖了原始文本（即更改被插回 `source_text`），我们需要使用
    `PUT` 语句输出原始变量 `source_text`。


    图 4.2：脱敏后的 PII 数据


    ![](img/c58184a1652486f0486b8350e0431fbb_95_0.png)


