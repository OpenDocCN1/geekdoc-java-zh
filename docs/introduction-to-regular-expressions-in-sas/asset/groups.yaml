    ## 4.2 数据清洗与标准化


    作为数据集，我们即将处理的随机生成数据集相当干净。事实是，我们无法探索现实世界中所有可能脏的数据（这本书永远写不完！）。通过一些真实数据，我们可以测试调试代码以处理和清洗数据集中的常见问题。本练习将帮助你应对现实世界，并教你工具箱中所有必要的工具。让我们回顾一下练习中需要清洗和检查的内容。


    ## 第 4 章：正则表达式在 SAS 中的应用


    - Firstname: 人的名。这部分数据应只包含字符。

    - Surname: 人的姓。这部分数据应只包含字符。

    - PhoneNumber: 人的电话号码。不同国家的电话号码写法不同，因此我们必须准备好解析各种格式——特别是企业可能来自或位于不同的国家。

    - SSN: 人的社会安全号码。我们应该只看到由折号或空格分隔的数字，我们需要强制这种格式。

    - DOB: 人的出生日期。这可以用几种方式表示，但在美国我们主要看到经典的 8 位格式。欧洲日期将日放在月份之前。上下文非常重要，因为除非超过明显的阈值，否则很难检测这种格式。

    - Address: 人的地址。这些数据具有最大的自然变异，解析起来最有趣。我们主要需要关注缩写、标点和邮政编码长度。


    现在，正如我在上一章中暗示的那样，数据清洗和标准化通过积累过滤器来实现。这些过滤器是连续应用的正则表达式函数和例程，以便实施增量更改。按照正确的顺序，我们可以清理一些混乱的数据供以后使用。对我们来说的是，PII
    生成的数据集相对温和。但只需少量变化它就会再次变得可怕。无论如何，为了利用当前状态下的整个数据集，我们必须修复几个问题。例如，查看数据集中的 16 条（输出
    4.2），我们看到地址的问题很少。


    ### 输出 4.2：PII 观测值 16


    | 观测 | Firstname |  Surname | PhoneNumber | SSN | DOB | Address |

    |---|---|---|---|---|---|---|

    | 16 | MATTHEW | MARTIN | +223.941.6074 | 436-07-9380 | 10/29/1975 | 10th St.
    & Constitution Ave. NW, Washington, DC 20560 |


    ## SAS 中的正则表达式简介


    在下面的代码中，我使用 PRXPARSE、PRXMATCH、CALL PRXCHANGE 和 PRXPOSN 创建了一系列清洗和标准化步骤。注意通过使用 CALLPRXCHANGE
    代替函数版本，我们的代码有多整洁。


    ```sas

    data CleanPII;

    set PII;


    ChangeAND = PRXPARSE(''s/\x26/and/o'');

    ChangeSTR = PRXPARSE(''s/\(St|St)/Street/o'');

    ChangeAVE = PRXPARSE(''s/\(Ave|Ave)/Avenue/o'');

    ChangeRD = PRXPARSE(''s/\(Rd|Rd)/Road/o'');

    ChangeDASH = PRXPARSE(''s/\.(.|\(|\))\s*/-/o'');

    ChangePLUS = PRXPARSE(''s/\s+/o'');

    ChangeSPAC = PRXPARSE(''s/ /+o'');


    /*清洗地址*/

    CALL PRXCHANGE(ChangeAND,-1, address);

    CALL PRXCHANGE(ChangeSTR,-1, address);

    CALL PRXCHANGE(ChangeAVE,-1, address);

    CALL PRXCHANGE(ChangeRD,-1, address);


    /*清洗电话号码*/

    CALL PRXCHANGE(ChangeDASH,-1, PhoneNumber);

    CALL PRXCHANGE(ChangePLUS,-1, PhoneNumber);

    CALL PRXCHANGE(ChangeSPAC,-1, PhoneNumber);


    /*清洗 SSN*/

    CALL PRXCHANGE(ChangeDASH,-1, SSN);

    CALL PRXCHANGE(ChangeSPAC,-1, SSN);


    /*清洗出生日期*/

    CALL PRXCHANGE(ChangeSPAC,-1, DOB);


    drop ChangeAND ChangeSTR AVE RD DASH PLUS ChangeSPAC;

    run;

    ```


