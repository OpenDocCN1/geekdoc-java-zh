    \ n=0 后就会停止。 |\n\n# 32 SAS 正则表达式简介\n\n## 2.6 选项\n\n选项会影响与其关联的 RegEx 模式的行为。这些行为变化提供了多种益处，从使\
    \ RegEx 创建更方便，到提供新的或增强的功能。\n\n### 2.6.1 忽略大小写\n\n选项 `/i` 忽略整个模式（包括字符字符串）的大小写。当我们确切知道要搜索什么，但不想让字母大小写成为问题时，这是一个非常棒的选项。表\
