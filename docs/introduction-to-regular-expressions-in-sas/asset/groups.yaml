    for this, for which the logic is true even after we begin replacing characters
    with metacharacters (it would simply more impressive).


    ## Pseudo Code for Pattern Matching Process


    ```

    START IF POS = "h" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" THEN MATCH=TRUE END ELSE POS+1 GOTO START


    END

    ```


    In this pseudo code, we see the START tag is our initiation of the algorithm,
    and the END tag denotes the termination of the algorithm. Meanwhile, the NEXT
    tag tells us to skip to the next line of pseudo code, and the GOTO tag tells us
    to jump to a specified line in it. The POS tag denotes the character position.
    We also use the IF, THEN, and ELSE logical in the code.


    Again, this demonstrates the search for "hello" in some text source. The algorithm
    initiates by testing the first character position is "h". If it is not, then the
    algorithm increments the character position by one—and tests for "h" again. If
    the first position is "h", the character position is increased, and the code for
    the letter "e". This continues until the word "hello" is found.


