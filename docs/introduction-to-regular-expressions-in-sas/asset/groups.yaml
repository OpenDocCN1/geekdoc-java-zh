    discover how to search for ranges of these values in the next section (Section
    2.4). Also note that the largest ASCII value is decimal 127, octal 177, and hexadecimal
    7F.


    ### 2.3.13 Hexadecimal


    The metacharacter `\xdd` matches a hexadecimal character of the form dd. The purpose
    of our implementation is again about searching through raw files, etc. We are
    using this to search for the hexadecimal code associated with the ASCII characters
    we want in source (manipulation of raw data). Table 2.15 provides examples.


    Table 2.15: Examples using \x


    | Usage | Matches | Notes |

    |---|---|---|

    | \x2B/ | "+" | This hexadecimal code translates to the + ASCII character. |

    | \x31\x2B\x3D/ | "1=" | These hexadecimal codes translate to. |

