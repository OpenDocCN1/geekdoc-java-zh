    \ 76 | 0 | 1 |\n| 8 | 508 First St NW, Washington, DC 20001 | 1 | 80 | 0 | 0 |\n\
    \n### More Advanced Insert Results\n\nThe commented RegEx ID definition creates\
    \ very different output for Output 3.8.2—a longer replacement value that occurs\
    \ for every group of numbers (***NUMBER REMOVED*** is inserted). The variables\
    \ are all the same as in Output 3.8.1, but notice how the values change. For instance,\
    \ trunc_val now equals every time a redaction occurred, and num_changes is frequently\
    \ greater than 1. Also, notice something else very important about this: lines\
    \ of text are accidentally truncated!\n\nRemember, the trunc_val being set to\
    \ 1 does not mean the data is lost. Instead, it means the text was truncated to\
    \ fit the variable length. Think of it as a flag that the replacement was longer\
    \ than the original space. This is a common issue when working with fixed-length\
