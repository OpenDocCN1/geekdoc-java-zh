    # 32 Introduction to Regular Expressions in SAS


    # 2.6 Options


    Options affect the behavior of the RegEx pattern with which they are associated.
    These behavioral changes provide benefits ranging from RegEx creation more convenient,
    providing new or enhanced functionality.


    Options occur *after* the closing slash character, but there is one item of significance
    that occurs *before* the first slash character that we will also discuss—it is
    not actually an option but this is best place to go over it. And we are not going
    to cover all of the metacharacters for the same reason we haven''t covered far—this
    is an introductory text.


    # 2.6.1 Ignore Case


    The option /i ignores case for the entire pattern, even character strings. This
    is a great option to use when we know exactly what we are searching for, but we
    don''t want the letter case to be an issue. Table 2.36 provides examples.


    Table 2.36: Examples using /i

    | Usage | Matches |

    | /1600 Pennsylvania Avenue/i | "1600 pennsylvania avenue" "1600 PENNSYLVANIA
    AVENUE" ... |

    | /Street/i | "street" "Street" "STREET" ... |

    | /CAPS don''t MattEr/i | "caps don''t matter" "CaPs Don''t MATTER" ... |


    # 2.6.2 Single Line


    The option /s forces the dot character (.) to match everything, including the
    newline character, when it occurs in the pattern. This can be very helpful to
    ensure that we don''t miss anything for a particular character position. Table
    2.37 provides examples.


    Table 2.37: Examples using /s

    | Usage | Matches |

    | /43rd and Times Square.New York, NY 10036/s | "43rd and Times Square New York,
    NY 10036" ... |

    | /Bob Smith.\d{3}-d{3}-d{4}/s | "Bob Smith 123-456-7891" ... |'
