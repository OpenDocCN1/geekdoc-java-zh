    ## 2.1 Introduction


    This chapter focuses entirely on developing your understanding of regular expressions
    (RegEx) before getting into the details of using them in SAS. We will begin actually
    jumping right into the SAS code behind of all. However, RegEx patterns are fundamental
    to making the SAS coding elements us much more powerful. Without going through
    the RegEx first, the forthcoming SAS functions and calls could be discussed only
    at a very theoretical level, which is the opposite of what I am trying to accomplish
    in this book. Also, trying to learn too many different elements of any process
    at the same time can simply be overwhelming.


    To facilitate the mission of this book—practical application—without being overwhelmed
    by too much information (new functions, calls, and expressions), there is a very
    short bit of test code to use with RegEx examples throughout the chapter. I want
    to stress the point that obtaining a thorough understanding of RegEx syntax is
    crucial for harnessing the power of this incredible capability in SAS.


    RegEx consists of letters, numbers, metacharacters, and special characters, which
    form patterns. For SAS to properly interpret these patterns, all RegEx values
    must be encapsulated by delimiters—I use the forward slash, / throughout the text.
    (Refer to the test code). Each acts as the container for our patterns. So, all
    RegEx patterns that we create will look like this: /pattern/.


    For suppose, we want to match the string of characters “Street” in an address.
    The pattern would look like /Street/. But we are clearly interested in doing more
    with RegEx than just searching for strings. The remainder of this chapter explores
    the various RegEx elements that we can insert into // to develop rich capabilities.


    ## Metacharacter


    Before going any further, I should clarify some terminology. Metacharacter is
    a term used quite frequently in this book, so I need to be clear as to what it
    actually means. A metacharacter is a character or set of characters used by a
    programming language like SAS for something other than its literal meaning. For
    example, \s represents a whitespace character in patterns, rather than just being
    a \ and the letter "s" collocated in the text. We begin our discussion of specific
    metacharacters in Section 2.3.


    All nonliteral RegEx elements are some kind of metacharacter. It is good to keep
    this distinction clear, as I also make references to character when I want to
    discuss the actual string values or the results of metacharacter usage.


    ## Special Character


    A special character is one of a limited set of ASCII characters that affects the
    structure and behavior of RegEx patterns. For example, opening and closing parentheses,
    ( , and ) are used to create logical groups of characters or metacharacters in
    RegEx patterns. These are discussed thoroughly in Section 2.2.


    ## RegEx Pattern Processing


    At this juncture, it is also important to clarify how RegEx are processed by SAS.
    SAS reads each pattern from left to right chunks, each element (character or metacharacter)
    of the pattern in succession. If we want to find the string "hello", SAS searches
    for the first match of the "h" is found. SAS determines whether the "e" immediately
    follows, and so on until the entire string is found. Below is some pseudo code
    for this, for which the logic is true even after we begin replacing characters
    with metacharacters (it would simply more impressive).


    ## Pseudo Code for Pattern Matching Process


    ```

    START IF POS = "h" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "l" POS+1 NEXT ELSE POS+1 GOTO START

    IF POS = "o" THEN MATCH=TRUE END ELSE POS+1 GOTO START


    END

    ```


    In this pseudo code, we see the START tag is our initiation of the algorithm,
    and the END tag denotes the termination of the algorithm. Meanwhile, the NEXT
    tag tells us to skip to the next line of pseudo code, and the GOTO tag tells us
    to jump to a specified line in it. The POS tag denotes the character position.
    We also use the IF, THEN, and ELSE logical in the code.


    Again, this demonstrates the search for "hello" in some text source. The algorithm
    initiates by testing the first character position is "h". If it is not, then the
    algorithm increments the character position by one—and tests for "h" again. If
    the first position is "h", the character position is increased, and the code for
    the letter "e". This continues until the word "hello" is found.


