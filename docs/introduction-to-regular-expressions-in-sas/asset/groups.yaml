    \ Multiline\n\nThe option //m causes ^ and $ to match on more than just the string\
    \ start and end. Instead, they match on every newline encountered because the\
    \ various lines of information are treated as one continuous line. This enhanced\
    \ functionality랴 applies to two metacters that we haven't covered yet (we'll discuss\
    \ them in Section 2.7), so if you need to, feel free to peek ahead and come back\
    \ to this one. Table 2.38 provides examples.\n\n# Table 2.38: Examples using //m\n\
    \n| Usage | Matches |\n| |\\w+/m | Words at the beginning of a string and words\
    \ following a newline character. |\n| \\w+?$s$/m | Words immediately before a\
    \ space and the string end, and before a space and newline character. |\n\n# 2.6.4\
    \ Compile Once\n\nThe option //o is known as the compile option. By having the\
    \ \"o\" immediately following the closing slash, SAS knows to compile Regex only.\
    \ This option creates a nice simplification to SAS code, which I demonstrate by\
    \ showing test code below (see Section 2.1.1 for the original code). Notice how\
    \ the IF block is removed, and only the two lines that do not include the RETAIN\
    \ statement remain. These changes are possible due to the compilation the first\
    \ time through the DATA step. Every subsequent loop through reuses the previously\
    \ compiled expression, if it exists.\n\n# Updated Test Framework/\n\n```\n*RegEx\
    \ Testing Framework*/\ndata _NULL;\n*if N=1 then\n*do;\n  retain pattern_ID;\n\
    \  pattern=\"/Run/\\; /*--Edit the pattern here.*/\n  pattern_ID=prxparse(pattern);\n\
    *end;\npattern=\"/Run/0/\\; /*--Edit the pattern here.*/\npattern_ID=prxparse(pattern);\n\
    input some_data $50;\ncall prxsubstr(pattern_ID, some_data, position, length);\n\
    if position = 0 then\ndo;\n  match=substr(some_data, position, length);\n  put\
    \ match:$QUOTE. \"found in \" some_data:$QUOTE.;\nend;\ndatalines;\n  Smith, BOB\
    \ A.;\n```"
