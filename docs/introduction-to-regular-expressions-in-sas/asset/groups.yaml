    # ## 2.3.10 Bell


    The metacarter `a matches an alarm "bell". The alarm character falls into a class
    of non-printing or invisible characters that are part of the ASCII character set.
    ASCII was developed long ago when operating systems used non-printing characters
    fairly extensively. Today, however, these characters are relatively uncommon,
    and most often occur only in files meant for computers to read rather than humans—since
    they are not displayed. When encountered, these characters generate an alarm tone,
    or "bell," on a computer''s internal speaker. They are often associated with errors,
    which can also be used to alert users that the end of a file or process has been
    achieved (e.g., in a system log file). You can use this metacarter when you know
    to expect such a character in a source file. Table 2.12 provides examples.


