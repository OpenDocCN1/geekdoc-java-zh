  - '[PAGE 63]


    # 3.3.1 CALL PRXCHANGE


    # Description


    This call routine performs the match-and-replace operation similar to that of
    the PRXCHANGE function. Unlike the function version, the call routine must receive
    a RegEx identifier, without the option of using the associated RegEx instead.
    Also, there are some additional arguments not available in the function (result_length
    and truncation_value). The only required arguments are: RegEx_ID, Num_Times, and
    Input_string. All remaining arguments are optional.


    # Syntax


    ```

    CALL PRXCHANGE(RegEx_ID, Num_Times, Input_string, Output_string,

    result_length, trunc_value, num_changes)

    ```


    RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument, required)


    Num_Times: Number of times the change is to be applied (input argument, required)


    Input_string: Input variable (input argument, required)


    Output_string: Output text variable (input argument, optional). Default is Input_string.


    result_length: Length of the characters put into Output_string (returned value,
    optional)


    Trune_value: Binary integer (0 or 1) value (returned value, optional). 1 means
    that the inserted text is longer than the text replaced. 0 means that the inserted
    text is either the same length or shorter than the text being replaced.


    num_changes: Number of times the changes were made (returned value, optional)


    Using the call routine inside the function can be cleaner from a coding perspective,
    especially when managing large programs. But there is more practical reason for
    using this call routine instead of the function: accessing the additional functionality
    provided by the optional arguments. Since we have the ability to write changes
    directly to the original variable, we can avoid creating new variables unnecessarily.
    This is especially useful when applying multiple data standardization filters
    to source text.


    Note: Writing changes back to the existing variable makes them irreversible in
    the event of a mistake, while our ultimate use of this functionality requires
    the overwriting approach for sound memory management, creating new variables or
    data sets is ideal when you are still learning. It allows you to experiment and
    make mistakes without fear of making permanent changes to source data.'
- md: "\n## Chapter 3: Using Regular Expressions in SAS 51\n\n### Example 3.7: Transforming\
    \ Data\n\nLet's look at basic usage for making changes to our source text. This\
    \ is a simple example of how to use the call routine. Notice how compact this\
    \ makes our code while maintaining functionality. Output 3.7 demonstrates that\
    \ we have the anticipated functionality (replacing various forms of \"street\"\
    \ with \"St.\").\n\n```sas\ndata ~NULL;\ninput address $50;\nmypattern = PRXPARSESE('/\\\
    s+(Street|street|St|st)\\s+/,'St./'o');\nCALL PRXCHANGE(mypattern, -1, address);\n\
    put address;\n```\n\n```sas\ndatelines:\n103 Pennsylvania Ave NW, Washington,\
