    \ | DC | 20001 |\n| 3 | Washington | DC | 20002 |\n| 4 | Washington | DC | 20007\
    \ |\n\n# 3.2.5 PRXPAREN\n\n# Description\n\nThis function returns the numerical\
    \ value of the largest capture buffer that contains data. It is\ntherefore implicitly\
