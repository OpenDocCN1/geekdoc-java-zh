    # About This Book


    # Purpose


    This book is intended for a wide audience of SAS users, novice programmer to the
    very advanced. As not much has previously been published on this topic, many different
    skill levels benefit from the content herein. However, the book has been written
    to ensure that novice programmers can immediately implement every element discussed.


    # Is This Book for You?


    Of course, it is! Do you wish to process unstructured data sources? Would you
    like to more effectively process semi-structured data sources? Do you want to
    one day leverage advanced text mining concepts within your Base SAS code? Of course,
    you do! This book lays the foundation for all of this and, making it the ideal
    text for anyone wanting to enhance their programming prowess.


    # Prerequisites


    Readers should be comfortable using and applying the SAS DATA step, basic PROCs
    (e.g., PROC PRINT), DO loops, and conditional processing concepts. Readers should
    be familiar with SAS arrays and the RETAIN statement.


    # Scope of This Book


    This book covers all PRX functions and call routines.


    This book does NOT cover advanced concepts requiring MACRO programming, PROC SQL,
    and system automation.


    # About the Examples


    # Software Used to Develop the Book''s Content


    Base SAS (Microsoft Windows)'
