    ## 2.7.5 字符串起始


    元字符 \A 匹配字符串的开头。与单词边界元字符 (\b) 类似，\A 发生在两个字符之间。它也表示字符串值出现在其右侧，而左侧无内容。在数据行的上下文中（如我们本章的测试代码所示），这种情况发生在每行的开头。


    然而，假设我们有一个更复杂的任务，例如拼接多个提取的文本字符串（存储在 SAS 变量中）。在这种情况下，\A 可以是确定放置或排序它们的顺序的关键。但是，对于我们的测试代码，\A
    仅在每行数据的开头匹配，因为每行都被标识为字符串的开头。这是另一个你在我们开始下一章进行更有趣的任务之前需要带着一点信心去处理的问题。表 2.44 提供了示例。


