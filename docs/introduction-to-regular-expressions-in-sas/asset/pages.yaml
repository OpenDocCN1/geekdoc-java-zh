  md: '# About The Author


    K. Matthew Windham, CAP, is the director of analytics at NTELX Inc., an analytics
    and technology solutions consulting firm located in Washington, DC area. His focus
    is on helping clients improve their daily operations through the application of
    mathematical and statistical modeling, data and text mining, and optimization.
    A longtime SAS user, Matt enjoys leveraging the breadth of the SAS platform to
    create innovative, predictive analytics solutions. During his career, Matt has
    led consulting teams in mission-critical environments to provide rapid, high-impact
    results. He has also architected and delivered analytics solutions across the
    federal government, with a particular focus on the US Department of Defense and
    the US Department of the Treasury. Matt is a Certified Analytics Professional
    (CAP) who received his BS in Applied Mathematics from N.C. State University and
    his MS in Mathematics and Statistics from Georgetown University.


