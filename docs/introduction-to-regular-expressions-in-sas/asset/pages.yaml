  md: "# Chapter 3: Using Regular Expressions in SAS\n\n# Example 3.9: Context-specific\
    \ Algorithm Development\n\nSometimes it's useful to condition code behavior on\
    \ specific words occurring in text. In this example, you'll see how the functionality\
    \ of CALL PRXPOSN can be used in combination with PRXPAREN, PRXMATCH, PRXPARSE,\
    \ and SUBSTR to do just that.\n\nFirst, we create the RegEx_ID using PRXPARSE,\
    \ which is passed to PRXMATCH. If a result from PRXMATCH exists (i.e., a pattern\
    \ match is found), we determine whether the capture buffers in the pattern is\
    \ matched by PRXPAREN. The output of PRXPAREN is used as input to the CALL PRXPOSN\
    \ routine to create the Position and Length. SUBSTR is used to extract the specific\
    \ text. We then print a message, leaving on the buffer. See the results in Output\
    \ 3.9.\n\n```\ndata null_;\ninput text $50;\nRegEx_ID=prxparse('/((Dog) | (Rat)\
    \ | (Cat))/o');\n\nif prxmatch(RegEx_ID) then do;\n  paren=prxparen(RegEx_ID);\n\
    \  CALL PRXPOSN(RegEx_ID, paren, position, length);\n  buffer = substr(text, position,\
    \ length);\n  put 'I matched capture buffer ' paren 'with ' buffer;;\nend;\n\n\
    else paren=2 then put 'I love dogs!'\nelse put 'I cannot stand a ' buffer''';\"\
    ,\n```\n\n```\ndatalines;\nThe Cat in the Hat\nThe Rat in the Hat\nThe Dog on\
    \ the Roof\n\nrun;\n```\n\n# Output 3.9: Log Output of Code Behavior\n\nI added\
    \ the additional commentary about cats, rats, and dogs to show a second way to\
    \ perform conditioning on the parsed text. Obviously, you could perform more interesting\
    \ things, and it should be fun to experiment in the future. We use this concept\
    \ in the next chapter to build out some interesting functionality.\n\n| matched\
    \ capture buffer 4 with Cat |\n| cannot stand a Cat ! |\n| matched capture buffer\
    \ 3 with Rat |\n| cannot stand a Rat ! |\n| matched capture buffer 2 with Dog\
    \ |\n| I love dogs!"
