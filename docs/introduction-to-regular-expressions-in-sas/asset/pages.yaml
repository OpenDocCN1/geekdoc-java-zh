  md: '# Chapter 4: Applications of Regular Expressions in SAS


    Firstname

    The person’s first name. This piece of data should contain character values only.


    Surname

    The person’s last name. This piece of data should contain character values only.


    PhoneNumber

    The person’s phone number. Phone numbers in different countries are written very
    differently, so we must be prepared to parse a variety of formats—especially since
    it is easy for a business contact to be from or located in a different country.


    SSN

    The person’s Social Security number. We should see only segments of numbers separated
    by dashes or spaces, and we need to enforce this formatting.


    DOB

    The person’s date of birth. This can be represented in a few ways, but we primarily
    see the classic 8-digit format in the US. European dates represent the day before
    the month. This is where context is very important, because it is difficult to
    detect this format unless obvious value thresholds are crossed.


    AddressnThe person’s address. This data has the most natural variability and is
    the most interesting to parse. We primarily need to be concerned with abbreviations,
    punctuation, and ZIP code lengths.


    Now, as I hinted in the last chapter, data cleansing and standardization is achieved
    by accumulating what amounts to filters. These filters are series of RegEx functions
    and routines applied in succession so as some incremental changes each one is
    implemented. In the correct order, we can clean up some very messy data for later
    use. Fortunately for us, the data set by the PII generator is relatively tame.
    But only few things need to change in order for it to become scary again. Regardless,
    there are a few things that we must fix in order to make use of the entire data
    set in its current state. For example, we keep look at 16 from the data set (Output
    4.2), we see few issues with the address.


    # Output 4.2: PII Observation 16


    | 16 | MATTHEW | MARTIN | +2.623.941.6074 | 436-07-9380 | 10/29/1975 | 10th St.
    & Constitution Ave. NW, Washington, DC 20560 |


    In having deoids both the & symbol immediately following the abbreviations for
    street and avenue, we both issues could be problematic when we attempt to parse
    the address into street, city, state, and zip.


    Developing what needs to be fixed in any data set often’t be done blindly. There
    are basic things we can apply to any data source, such as trimming excess spaces,
    and so on. However, it is advisable to pull samples of data in order to understand
    its quality issues before you develop RegEx patterns for cleaning.'
