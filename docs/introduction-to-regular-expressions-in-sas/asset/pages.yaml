  md: '# Appendix C: POSIX Metacharacters


    Throughout the book, we discussed metacharacters of all types that adhere to Perl
    standards (de facto standard across the industry) for implementation since they
    are what SAS uses. And they are all that you need when you''re running within
    the SAS environment. However, if you ever need to push the RegExp processing to
    a system outside of SAS, there is no guarantee that they will always work because
    not all systems use Perl syntax (mostly older systems don''t).


    **Note:** When you are attempting your more advanced application, know the parameters
    of the system you are using. You might not need to change the RegExp coding.


    The exact applications of the metacharacters described in this appendix are outside
    the scope of this text but are provided here for the advanced reader who is interested
    in them. For example, although we have not covered it, POSIX metacharacters might
    be needed when you are performing in-database *fuzzy matching with* POSIX SQL.


    ```

    [:alpha:]

    ```


    This metacharacter matches any alphabetic character and is equivalent to [a-zA-Z].


    ```

    [:^alpha:]

    ```


    This metacharacter matches any non-alphabetic character and is equivalent to [^a-zA-Z].


    ```

    [:alnum:]

    ```


    This metacharacter matches any alphanumeric character and is equivalent to [a-zA-Z0-9].


    ```

    [:^alnum:]

    ```


    This metacharacter matches any non-alphanumeric character and is equivalent to
    [^a-zA-Z0-9].


    ```

    [:ascii:]

    ```


    This metacharacter matches any ASCII character and is equivalent to [0-\177] (i.e.,
    it does not match UNICODE).


    ```

    [:^ascii:]

    ```


    This metacharacter matches any non-ASCII character and is equivalent to [^0-\177]
    (i.e., it matches UNICODE).


    ```

    [:blank:]

    ```


    This metacharacter matches any blank character.


    ```

    [:^blank:]

    ```


    This metacharacter matches any non-blank character.'
