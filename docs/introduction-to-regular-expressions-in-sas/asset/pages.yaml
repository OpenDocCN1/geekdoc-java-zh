    # 2.65 Substitution Operator


    The substitution operator s// is not technically an option, it belongs here only
    because it truly stands apart from the other items discussed in this section.
    Although the substitution operation is similar in appearance to the other options,
    it fundamentally changes the RegEx from a matching operation to a match-and-replace
    operation. "s" in front of the surrounding slashes (/) signifies that the pattern
    is being used to replace the text and inserting the accompanying replacement text.
    This is another peek functionality that is explored in the next chapter with SAS
    functions. Once a pattern is matched, we can do a variety of things with that
    information. A great analogy for how this works in practice is the find-and-replace
    functionality provided by many word processing applications—except this is much
    more powerful. Also, notice that there is a third slash in the examples below
    (in the middle of the patterns). That additional slash denotes where the matching
    portion of the RegEx ends and the replacement portion begins. And notice something
    important in the example: everything is a string literal. Right, all the characters
    that between the second and third slash are treated as just literals. Table 2.39
    provides some examples, but we cover this in detail in the next chapter, where
    we also discuss how to insert more than character strings.


    | Usage | Matches | Replace with |

    | s/Stop/Go/ | "Stop" | "Go" |

    | s/Sing/Read/ | "Sing" | "Read" |

    | s/1?(800)\s?-s?/1-800-/ | "1 (800) - " ... | "1-800-" |


    Note: This is a more advanced function that our test code is not set up to handle.
    You''ll just need to accept as true until we use it with some SAS code in the
