  md: '# Chapter 4: Applications of Regular Expressions in SAS 71


    We start with an easy way to create pseudo random names, by just creating name
    data sets using data lines. It is not elegant or short, but it gets the job done
    for our purposes.


    Here we are sampling the name data, using simple random sampling and a sample
    size of n=25. The sample size is completely arbitrary and chosen to match the
    number of other random values created in the code.


    The arrays are created to ensure that duplicate values can be created for our
    arbitrary range of years. To avoid any complications, we are ignoring leap years
    (no Feb 29th in the set of possibilities) and using an array of 4-digit years.
    The seed value is an arbitrary number.


    Now, we construct the phone number by using the RAND function (UNIFORM option)
    to generate the individual digits. The INT function takes the integer portion
    of a value, multiplying the random value between 0 and 1 by 10 and the INT function
    yields a single digit between 0 and 9. This method ensures that zero values are
    not dropped (a leading zero would otherwise be held). Other methods can achieve
    the same outcome, but this is a straightforward implementation without the need
    for arrays. The COMPRESS function is used to remove all spaces between the connected
    values. However, removing this is an easy way to make the data messy.


    After creating the individual chunks of a phone number, we randomly assign separator
    types in an effort to demonstrate the various representations that might be expected
    in practice.


    Next, we create Social Security numbers (SSNs) by applying the same techniques
    as with the phone numbers immediately after. However, we are not normalizing the
    separator. It is less often an issue, but you could do it as an extracurricular
    exercise.


    We now build the date of birth (DOB) using the arrays discussed in and the RANPERK
    function. This function creates permutations of the provided arrays and provides
    k values from the results. Other methods could have been employed, but this is
    a simple approach to create random date elements within a specific range (i.e.,
    valid dates).


    The DATA step for addresses uses some RegEx functionality to extract addresses
    from a text file, with the Num value that allows us to perform a match-merge in
    the next step.


    This final DATA step creates a single data set, PII, from the above elements.


    Output 4.1 displays the final data set created by our code, Rand_PII_Generator.sas.
    As expected, it contains 25 pseudo-random PII elements to support some of our
    upcoming examples.'
