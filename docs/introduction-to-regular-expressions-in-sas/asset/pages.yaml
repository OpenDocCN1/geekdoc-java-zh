  md: '# 2.3.11 Control Character


    The metacharacter `\cA-\cZ` matches a control character for the letter that follows
    the \c. For example, \cF matches control-F in the source. This is one of several
    examples where you might be processing less-used file types (i.e., not a mean
    for humans to read). Control characters, or non-printing characters, were once
    used extensively by transactional coupling and telecommunications systems. These
    control characters, while not visible in most text editors, are still part of
    the ASCII character set, and can still be used by older systems in these regimes.
    For our examples in Table 2.13, we stick with the convention that is used for
    the alarm metacharacter above—the standard ASCII abbreviation is used despite
    the fact that they are never actually seen in


    Table 2.13: Examples using ASCII


    | Usage | Matches |

    | --- | --- |

    | \cP/ | DEL the non-printing Data Link Escape ASCII character ^P |

    | \cB/ | STX the non-printing Start of Text ASCII character ^B |

    | \cBHello\cC/ | STXHelloETX the non-printing Start of Text ASCII character ^B
    followed by the text string "hello" and completed with the non-printing End of
    Text ASCII character ^C


    # 2.3.12 Octal


    The metacharacter \ddd matches an octal character of the form ddd. It is used
    to match on the octal code for an ASCII character you are searching. It can be
    especially useful when you need to find specific non-printing ASCII characters
    in a file. The default behavior by SAS is to return the ASCII character associated
    with this octal code in the results. Table 2.14 provides examples.


    Table 2.14: Examples using \ddd


    | Usage | Notes |

    | --- | --- |

    | \s/041/s | " " | This octal code translates to the ! ASCII character |

    | \s/110/105/114/117/ | "HELLO" | This series of octal codes translate to the
    "HELLO" string of ASCII characters |

    | \s/007\011/s | BEL TAB | These octal codes translate to the two non-printing
    ASCII characters BEL and TAB. Refer to our discussion of the alarm metacharacter
    in Section 2.3.10 regarding characters that are not displayed.


    Note: You will discover how to search for ranges of these values in the next section
    (Section 2.4). Also note that the largest ASCII value is decimal 127, octal 177,
    and hexadecimal 7F.'
