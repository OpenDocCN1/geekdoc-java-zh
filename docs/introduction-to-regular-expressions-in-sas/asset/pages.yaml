    # 4.2 Data Cleaning and Standardization


    As data sets, the randomly generated data set that we are going to work with is
    fairly clean. The simple fact we can''t explore all of the data that can be dirty
    in the real world (this book would never end!). Using some realistic data, we
    can test our ability to debug Regex code to process and clean some common problems
    in data sets. This exercise will prepare you to go out in the real world and teach
    you all the necessary tools in your toolkit.


    So, let''s review what we need to clean and standardize, and what things we need
    to check for this exercise.'
