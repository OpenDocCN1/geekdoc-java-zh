  md: '# Chapter 3: Using Regular Expressions in SAS 51


    # Example 3.7: Transforming Data


    Let''s look at basic usage for making changes to our source text. This is a simple
    example of how to use the call routine. Notice how compact this makes our code
    while maintaining functionality. Output 3.7 demonstrates that we have the anticipated
    functionality (replacing various forms of "street" with "St.").


    ```

    data ~NULL;

    input address $50;

    mypattern = PRXPARSESE(''/\s+(Street|street|St|st\)\s+/ St. /o'');

    CALL PRXCHANGE(mypattern, -1, address);

    put address;

    ```


