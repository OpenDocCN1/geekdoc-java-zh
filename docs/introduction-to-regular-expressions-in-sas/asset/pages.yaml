  md: '# 3.2.4 PRXPOSN


    # Description


    PRXPOSN returns the matched information from specified capture buffers. This RegEx
    function requires the RSXUBSTR, PRMATCH, PRXNEXT, and PRCHANGE functions to be
    running before used so that the capture buffer can be referenced. Also, RegEx
    ID is required rather than the actual RegEx. Otherwise, PRXPOSN will not work—necessitating
    the use of PRXPARSE. The N input argument is numeric and refers to the capture
    buffer ($).


    # Syntax


    ```

    Text = PRXPOSN(RegEx_ID, N, Source_Text)

    ```


    +   - RegEx_ID: Unique RegEx identifier returned by PRXPARSE (input argument,
    required)

    - Integer: Value of the capture buffer (input argument, required)

    - Source_Text: The text variable or literal to be operated upon (input argument,
    required)

    - Text: Character variable of captured text (output, required)


    When we know the exact number of capture buffer elements (i.e., N is known), we
    can use PRXPOSN without an issue. However, what happens when the number of elements
    is different from what we expect? If there are values in the capture buffer but
    we make a reference to one larger than those available (may there be three, but
    we make a reference to number 5), then a missing value is returned. However, if
    we reference capture buffer position 0 (N=0), the entire pattern is returned regardless
    of the buffer length.


    The next function, PRXPAREN, is very helpful in creating robust code when we are
    using the buffers in conjunction with PRXPOSN. It is also important to write robust
    RegEx patterns to ensure that you prevent issues from popping up.


    # Example 3.5: Extracting Data with Capture Buffers


    In order to make the capture buffer content and this function more clearer, we
    are going to walk through a concrete example. Suppose we want to process addresses
    for which the structure is well known and store various pieces in a SAS data set
    for later use. Since we know the layout of the address, the capture buffer arrangement
    and the application of PRXPOSN are so very straightforward.


    First, we test the RegEx ID variable Text by using the PRXPARSE function in the
    IF statement. Notice that this is an implicit test of a matching (no equal sign
    is used). If a match of the RegEx exists within the identified text source, then
    we assign the capture buffer to variables by PRXPOSN (city, state, and zip).


    Output 3.5 displays the values of extract, the data set created in our SAS step.
    As expected, we extracted the city, state, and ZIP code from each datalines entry,
    we’re going to build on this'
  merge: -1
