    # 2.4 Character Classes


    In addition to the built-in RegEx characters to match patterns, users have the
    ability to create custom character matching. This capability is derived via different
    uses of [ ] (square braces). The square braces essentially create a custom metacharacter,
    the items contained between the opening and closing braces are possible match
    values for a single character cell. In addition to putting a list characters inside
    the braces, you can also include metacharacters. Each metacharacter discussed
    below includes an example, which includes the use of a metacharacter, and they
    all have the same match results. Just for fun, they are all identifying a hexadecimal
    number present in the ASCII source file (stored as ASCII characters in the source
    file, but representing the range of hexadecimal values).


    > **Note:** Remember that some of the components discussed in this section are
    special characters that must be escaped with \^ in order to be matched in isolation.
    Specifically, these characters are: ^, [ , and ].


    # 2.4.1 List [...]


    The metacharacter [...] matches any of the specific characters or metacharacters
    listed within the braces. Being able to define an unordered list of things that
    you want to appear in a space is very convenient, and sometimes can be more convenient
    than the metacharacters that identify broad classes of character types. Table
    2.16 provides examples.'
