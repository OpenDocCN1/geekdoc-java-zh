  md: "# 3.3.3 CALL PRXSUBSTR\n\n# Description\n\nThis routine takes RegEx_ID and\
    \ Source_Text as inputs, and returns Position and Length as outputs.\nUsing the\
    \ actual RegEx is not an option.\n\n# Syntax\n\n```\nCALL PRXSUBSTR(RegEx_ID,\
    \ Source_Text, Position, Length)\n```\n\nRegEx_ID: Unique RegEx identifier returned\
    \ by PRXPARSE (input argument, required)\nSource_Text: The text to be operated\
    \ upon (input argument, required)\n\nPosition: Integer value for the character\
    \ position of the first character in the matched pattern (returned\nvalue, required)\n\
    Length: Integer value for the length of the matched pattern (returned value, optional)\n\
    \nThis call is used extensively in Information Extraction applications like those\
    \ discussed in\nChapter 4. Since only the position and length of matches are identified\
    \ by CALL PRXSUBSTR, it must\nused in conjunction with a function like SUBSTR\
    \ to extract the actual text.\n\n# Example 3.10: Information Extraction\n\nIn\
    \ this example, we revisit the non-familiar example code from Chapter 2. It is\
    \ a great example of how\nyou can leverage the CALL PRXSUBSTR\n\nThe code creates\
    \ a RegEx pattern to search for all occurrences of \"Smith\" in our source text.\
    \ The\nthen generates a RegEx_ID using PRXPARSE. The code then uses CALL PRXSUBSTR\
    \ to search\nthrough source text with the provided pattern and return the position\
    \ and length of matching text. As you\nnow know, this could have been a much more\
    \ complex pattern, but the simplicity helps to\nhigh the functionality we are\
    \ focused on. After the call, the code checks whether\nthe variable (Position)\
    \ is 0, which is the default value indicating that it did not find a\nmatch. If\
    \ a position exists, the code proceeds to use SUBSTR to capture text from the\
    \ source\nion and length obtained by CALL PRXSUBSTR. Results are then output to\
    \ the log. See Output\n3.10.\n\n```\ndata NULL ;\\npattern = \"Smith/\"; /*Edit\
    \ the pattern here.*/\npattern_ID = PRXPARSE(pattern);\ninput some_data=$50;\n\
    CALL PRXSUBSTR(pattern_ID, some_data, position, length);\nif position ^= 0 then\n\
    do;\n  match = substr(some_data, position, length);\n  put match:$QUOTE. \"found\
    \ in \" some_data:$QUOTE.;\n```"
