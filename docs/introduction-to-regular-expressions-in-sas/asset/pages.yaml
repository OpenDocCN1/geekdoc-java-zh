  md: '# Lazy n or More


    The modifier {n,}? creates a match, at least n times and as few times as necessary
    to create a match. This functions just like the * or + modifiers, except that
    the number of matches is arbitrary. Again, we see similar behavior resulting from
    the laziness of the modifier. Table 2.34 provides examples.


    Table 2.34: Examples using {n,}


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | /Singw{3,?}/ | "Singing" ... | This usage matches exactly n=3 times. Again,
    by giving the lazy option to match the minimum, it will do so every time. |

    | /0{3,?}/s/ | "0000" ... | Now you have the hang of these modifiers, this example
    should be a little more interesting. Adding ''s on the pattern forces it to match
    0 until the white space is encountered. The pattern is "anchored" to the first
    occurrence of a 0, catching more than the minimum. |

    | /(ha){4,?}/ | hahahaha | Without surrounding information in the pattern, this
    matches only the minimum number of times. By having nothing else to force additional
    matching, the lazy modifier just stops after the minimum of n=4. |


    # Lazy n to m Times


    The modifier {n,m}? creates a match at least n times, but no more than m times—as
    few times in that range as necessary to create the match. It functions like many
    of the other lazy modifiers discussed far, but it sets a cap on how many times
    it can match in having an arbitrary minimum. Table 2.35 provides examples.


    Table 2.35: Examples using {n,m}?


    | Usage | Matches | Notes |

    | --- | --- | --- |

    | /Readw{1,3,?}/ | "Ready" ... | This matches the word character only one time.
    Again, by giving the lazy modifier an option to match the minimum, it will do
    so every time. |

    | /0{2,5}?s/ | "0000" ... | Again, the pattern is "anchored" to the first occurrence
    of a 0, catching the minimum if it exists, up to the maximum. |

    | \sha(ha){0,6}? | "ha" | By not having anything after the "anchor" point for
    the pattern to match on, there is nothing for additional matching. The lazy modifier
    just stops after the minimum of n=0. |'
