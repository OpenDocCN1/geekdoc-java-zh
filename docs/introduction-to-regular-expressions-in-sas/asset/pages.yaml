    ![](img/c58184a1652486f0486b8350e0431fbb_94_0.png)


    Now that we have a data source to work with, we can create to redact all sensitive
    data elements. The challenge of doing this effectively is that we can''t depend
    on the structure of surrounding information to inform the decisions of care. For
    this reason, it is important that we take care to ensure that we properly identify
    the elements before redact them.


    Below is the code that performs our redaction of the PII elements SSN, DOB, PhoneNumber,
    Street, City and Zip. Now, many organizations are allowed to publish small amounts
    of information that individuals authorize in advance, such as city or phone number.
    However, we are focusing on how to redact all of them, making a selection easy.
    In addition to performing the redact steps, we also output the redacted text to
    a TXT file. This again, an effort to support a realistic use of these techniques.
    For instance, many organizations keep or mention information in text files that
    are updated by administrative staff. There are valid reasons for sharing portions
    of information either internally or with external entities, which must be undertaken
    with great care. Thus, it is useful for such files to be automatically scrubbed
    before giving a final review and shared with others.


    Note: While the following code is more realistic than what we developed in Chapter
    3, it still needs to be improved for robust, real-world applications. The homework
    has some suggestions, but there is still room for refinement.


    ```

    data NULL;

    infile=''F:\Introduction to Regular Expressions with

    SAS\Chapter_4_Example_Source\FinalPII_Output.txt'' length=lineen

    lrecl=500 pad;

    varlen=input_text $varying. varlen;

    input Redact_SSN = PRXPARSE(''/s/\d{3}-\s*-\d{2}-\s*-\d{4}/'',''REDACTED/o'');

    ```'
