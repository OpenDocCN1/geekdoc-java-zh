  md: '# Introduction to Regular Expressions in SAS


    As we have seen throughout the chapter, PRX functions and call routines cannot
    replace well-written RegEx patterns, despite providing incredible functionality.
    Attempting to leverage functions and call routines with poorly written Regex patterns
    is like trying to drive a sports car with no fuel.


    Also, while the PRX functions and call routines remain flexible, powerful capabilities
    to be leveraged for a wide variety of applications—basic and advanced—they often
    cannot stand alone. It is important to leverage them in conjunction with other
    elements of SAS to develop robust code; a fact that we have merely had a glimpse
    of in this chapter. For instance, some very advanced RegEx applications benefit
    from the use of MACRO programming techniques (beyond the anticipated skill level
    of this book).


    Now, at this point, we are done. You have all the basic tools in place to make
    truly useful, robust SAS programs that leverage regular expressions. However,
    as promised from the outset, we are going to really pull everything together via
    a series of advanced, case-study-style examples in the next chapter.


    > ¹ National Institutes of Standards and Technology (NIST) special publication
    800-122, April 2010, Guide to Protecting the Confidentiality of Personally Identifiable
    Information (PII),

    http://csrc.nist.gov/publications/nistpubs/800-122/sp800-122.pdf


    > ² SAS Support, debug information: https://support.sas.com/rnd/base/datastep/perl_regexp/regexp.debug.html'
