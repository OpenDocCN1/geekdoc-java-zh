  md: '# Chapter 3: Using Regular Expressions in SAS


    The first line denotes of RegExp within the PRXPARSE function. The next line shows
    us the compiled RegExp size and starting location for the lines that follow. Specifically,
    the size of 26 refers to the 26 lines of compiled RegExp code (numbers on the
    line with a trailing semi-colon); and first refers to the first line of code execution.
    The numbers in parentheses to the right of each line correspond to labels for
    the compiled RegExp (these labels work like our pseudo code labels in Chapter
    2).


    Lines 1 through 26 are the compiled steps within our RegExp, and they become easy
    to follow once we understand what each represents. For instance, the various OPEN
    and CLOSE statements correspond to our opening and closing pairs; BRANCH commands
    to the OR tests between the inner parenthesis pairs; and EXACT is for the string
    literal match of the associated word. END obviously means the end of the subroutine.


    The remaining output is the rest of our code running normal. Should our code be
    malfunctioning, we would not likely see such normal output when calling PRXDEBUG.


    # 3.12: Debugging Information to the Log


    +   1 Compiling Reg ((Dog)(Rat)|(Cat))

    size 26 first at 3

    1: OPEN(3)

    3: BRANCH(10)

    4: OPEN(5)

    6: EXACT <Dog>(8)

    8: CLOSE(24)

    10: BRANCH(17)

    11: OPEN(3)

    13: EXACT <Rat>(15)

    15: CLOSE(24)

    17: BRANCH(24)

    18: OPEN(20)

    22: EXACT <Cat>(22)

    24: CLOSE(26)

    26: END(0)

    4 minlen 3

    | matched capture buffer 4 with Cat

    | cannot stand a Cat |

    | matched capture buffer 3 with Rat

    | cannot stand a Rat |

    | matched capture buffer 2 with Dog

    | love dogs|


    +   The compilation process begins for the quoted RegExp given by PRXPARSE.


    +   Notice that each OPEN and CLOSE pair have the same name (OPEN1 and CLOSE1).
    These numbers correspond to the numerical value of the capture buffer that was
    formed by that set of parentheses.


    +   Each line ends with a number enclosed in parentheses, denoting the next line
    to jump from that line. However, the END tag has a jump to 0, which takes us out
    of the subroutine.


    +   The minlen field defines the minimum length for the match to be 3. This information
    is used by subsequent functions and routines when using this compiled pattern.'
  merge: -1
