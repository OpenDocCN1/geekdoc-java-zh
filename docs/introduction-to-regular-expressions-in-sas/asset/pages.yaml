  md: "# Chapter 4: Applications of Regular Expressions in SAS 75\n\n```\n/*Parsing\
    \ the address into its discrete parts*/\nAddr_Pattern = =\nPRXPARSE('/^(\\w+\\\
    s\\w*)\\s+\\s+(\\w+\\s*\\w*),\\s+(\\w+)\\s+(\\d{5})\\s?\\s*(\\d{4})|(\\d{5}))/');\n\
    if PRMATCH(Addr_Pattern, address) then do\n    Street = PRXPOSN(Addr_Pattern,\
    \ 1, address);\n    City = PRXPOSN(Addr_Pattern, 3, address);\n    State = PRXPOSN(Addr_Pattern,\
    \ 4, address);\n    Zip = PRXPOSN(Addr_Pattern, 5, address);\nend;\ndrop Addr_Pattern\
    \ address;\nrun;\nproc print data=finalpi;\nrun;\n```\n\n+   1. First, we create\
    \ a series of replacement RegEx pattern identifiers using PRXPARSE. We maintain\
    \ the \"change\" naming convention to denote that each identifier represents a\
    \ RegEx pattern for changing the source.\n\n+   2. Here we apply specific RegEx_ID's\
    \ by using the CALL PRXCHANGE routine to clean each of the variables in different\
    \ ways.\n\n+   3. Finally, we parse the original address data field into its constituent\
    \ parts: street, city, state, and zip. The PRXPOSN function grabs each piece of\
    \ the address by identifying the associated capture buffer. Notice that we have\
    \ to skip buffer location 2 because the second bracket is used for logical separation\
    \ inside the first bracket set (which creates buffer 1). Referencing buffer location\
    \ 2 would provide only a subset of the street information we need.\n\nAs we can\
    \ see in Output 4.3, our resulting data set now has clean, standardized data in\
    \ each field. Such data makes future analysis and manipulation much easier and\
    \ more accurate. This exercise should serve a nice warm-up for many other applications."
