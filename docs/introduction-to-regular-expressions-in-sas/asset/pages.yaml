    # ## 1.1 Purpose of This Book


    This book is meant for SAS programmers of virtually all skill levels. However,
    it is expected that you have at least a basic knowledge of the SAS language, including
    the DATA step, and how to use SAS PROCs.


    This book provides all the tools you need to learn how to harness the power of
    regular expressions within the SAS programming language. The information lays
    the foundation for fairly advanced applications, which are discussed briefly as
    motivating examples in this chapter. We are not presented to intimidate or overwhelm,
    but instead to encourage you to work through the coming pages with the anticipation
    of being able to rapidly implement what you are learning.


    # ## 1.2 Layout of This Book


    It is my goal in this book to provide immediately applicable information. Thus,
    each chapter is structured to walk through every step to application with the
    following flow: Syntax ► Example. In addition to the information discussed in
    the coming chapters, a regular expression reference guide is included in the appendix
    to help with more advanced applications outside the scope of this text.


    Chapter 1


    In addition providing a roadmap for the remainder of the book, this chapter provides
    motivational examples of how you can use this information in the real world.


    Chapter 2


    This chapter introduces the basic syntax and concepts for regular expressions.
    There is even some SAS code for running the examples associated with each new
    concept.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# 2 Introduction to Regular Expressions in SAS


    Chapter 3

    This chapter is designed to walk through the details of implementing regular expressions
    within the SAS language.


    Chapter 4

    In this final chapter, we work through a series of in-depth examples—case studies
    if you will—in order to ‘put it all together’. They don’t represent the limitations
    of what you can do by the end of this book, but instead provide some baseline
    thinking for what is possible.


    Appendixes

    While not comprehensive, serve as valuable, substantial references for regular
    expressions, SAS documentation, and reference tables. I hope everyone can leverage
    the additional information to enrich current and future regular expressions capabilities.


    # 1.3 Defining Regular Expressions


    Before going any further, we need to define regular expressions.


    Taking the very formal definition might not provide the desired level of clarity:


    Definition 1 (formal)

    regular expressions: “Regular expressions consist of constants and operator symbols
    that denote sets of strings and operations over these sets, respectively.”


    In the pursuit of clarity, we will operate with a slightly looser definition for
    regular expressions. Since practical application is our primary aim, it doesn’t
    make sense to adhere to any esoteric definition. So, for our purposes we will
    use the following:


    Definition 2 (easier to understand—our definition)

    regular expressions: patterns used for automated searching and matching.


    When programming in SAS, regular expressions are seen as strings of letters and
    special characters that are recognized by built-in SAS functions for the purpose
    of searching and matching. Combined with built-in SAS functions and procedures,
    we can realize tremendous capabilities, some of which we explore in the next section.


    Note: SAS uses the same syntax for regular expressions as the Perl language².
    Thus, throughout SAS documentation, you find regular expressions repeatedly referred
    to as “Perl expressions.” In this book, I choose the conventions present in the
    SAS documentation, unless the Perl conventions are most common to programmers.
    To learn more about how SAS views Perl, visit this website:

    http://support.sas.com/documentation/cdl/enfunctionsref/67239/HTML/default/viewer.html#p0s9ilaagemxjl8n1u7e1ijfnzlk.htm.
    To learn more about Perl programming, visit

    http://perldoc.org/perl/re.html. In this book, however, I primarily dispense with
    the references to Perl, as may be confusing.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 1: Introduction


    # 1.4 Motivational Examples


    The information in this book is very useful for a wide array of applications.
    However, that will not become obvious until you read it. So, in order to visualize
    how you can use this information in your work, I present some realistic examples.


    You are all probably familiar with data, that is rarely provided to analysts in
    a form that is immediately useful. It is frequently necessary to clean, transform,
    and enhance source data before it can be used—especially textual data. The following
    examples are deiding the coding details that are discussed later in the book,
    but they demonstrate these concepts at varying levels of sophistication. The primary
    goal here is to simply help you see the utility for this information, and to begin
    thinking about ways to leverage it.


    # 1.4.1 Extract, Transform, and Load (ETL)


    ETL is a general set of processes for extracting data from its source, modifying
    it to fit your end needs, and loading it into a target location that enables you
    to best it (e.g., database, data store, warehouse). We''re going to be working
    with a fairly example to get started. Suppose we have a SAS data set of customer
    addresses that contains some quality issues. The method of recording the data
    is unknown to us, but visual inspection has revealed numerous occurrences of duplicate
    records, as in the table below. In this example, it is clearly the same with slightly
    different representations of the address and encoding for gender. But how do we
    fix problems automatically for all of the records?


    | First Name | Last Name | DOB | Gender | Street | City | State | Zip |

    | Robert | Smith | 2/5/1967 | M | 123 Fourth Street | Fairfax | VA | 22030 |

    | Robert | Smith | 2/5/1967 | Male | 124 Fourth Street | Fairfax | va | 22030
    |


    Using regular expressions, we can algorithmically standardize abbreviations, remove
    punctuation, and do much more to ensure that each record is directly comparable.
    In this case, regular expressions enable us to perform more effective record keeping,
    which ultimately impacts analysis and reporting.


    We can easily leverage regular expressions to ensure that each record adheres
    to institutional standards. We can make each occurrence of Gender “M/F” or “Male/Female,”
    make every instance of the Street variable “Street” or “st.” in the address line,
    make each City variable include or exclude the comma, and abbreviate State as
    all caps or lowercase.


    This example is quite simple, but reveals the power of applying some basic data
    standardization techniques to data sets. By enforcing these standards across the
    entire data set, we are then able to properly identify duplicative references
    within the data set. In addition to making our analysis and reporting less error-prone,
    we can reduce data storage space and duplicative business activities associated
    with each record for example'
  merge: -1
  pgno: 16
- img_proc: true
