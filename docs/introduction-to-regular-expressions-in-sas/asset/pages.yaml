  md: "# Introduction to Regular Expressions in SAS\n\nIn the code below, we start\
    \ by creating a data set to pass into the DATA step, called example. This data\
    \ set contains name, address, and phone number information in various configurations.\
    \ In the DATA step, we create a RegEx ID using PRXPARSE and then use CALL PRXCHANGE\
    \ to execute the changes prescribed by the RegEx. Notice that one RegEx is commented\
    \ out. The RegEx in that line behaves differently from the initial RegEx ID definition,\
    \ which allows us to demonstrate the trunc num options. We used this RegEx ID\
    \ to create Output 3.8.2. After the DATA step, we perform a PROC PRINT to create\
    \ the output shown in Output 3.8.1 and Output 3.8.2.\n\n```\ndata example:\n \
    \ input text $80;\n  datalines:\n    Ken can be reached at (801)443-9876\n   \
    \ 103 Pennsylvania Ave NW, Washington, DC 20216\n    JP's address:\n    650 1st\
    \ St, Washington DC 20002\n    Carla's information is: (910) 998-8762\n    3000\
    \ K Street NW, Washington, DC 20007\n    Eric can be reached at: (321) 456-7890\n\
    \    508 First St Nw, Washington, DC 20001\nrun;\n\ndata changed:\n  set example;\n\
    \  /*RegEx ID = PRXPARSE('/s/d+***NUMBER REMOVED***/o');\n  RegEx_ID = PRXPARSE('/s/[1-9]\\\
    d\\\\s?[1-9]\\d\\-d\\\\d\\\\\\d*REDACTED*//o');\n  Call PRXCHANGE(RegEx_ID, -1,\
    \ text, text, length, trunc, num_changes);\n  put text=;\nrun;\n\nproc print data=changed;\n\
    ```\n\n# Simple Insert Results\n\nAs we can see in the results below, the phone\
    \ numbers have been redacted in the original text by using the value *REDACTED*.\
    \ The rest of the data set shows our optional variable values. Length is the total\
    \ length of the string written (we just wrote back to the old string). trunc is\
    \ 0 for every row because the inserted value is no longer than the original phone\
    \ numbers. In fact, lines 1, 5, and 7 shrink because the inserted content is shorter.\
    \ Finally, num_changes records the number of times the phone numbers were redacted\
