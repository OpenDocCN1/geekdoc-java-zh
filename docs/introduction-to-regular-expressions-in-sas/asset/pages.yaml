  md: "# 78 Introduction to Regular Expressions in SAS\n\nThe primary concern is effectively\
    \ extract information from within the XML tags that contain data: uri, release_number,\
    \ release_date, and respondents. As you can see in the figure above, there are\
    \ some other XML tags in the document, but they aren't relevant to the task at\
    \ hand. For instance, root and administrative_proceeding do not contain data of\
    \ the previously mentioned tags. They merely serve administrative functions in\
    \ the context of XML for properly organizing the information for consumption by\
    \ a system that reads XML.\n\n```\ndata SECFiling;\ninfile 'F:Introduction to\
    \ Regular Expressions with\nSAS#Chapter_4_Example_administrative_proceedings_2009.xml'\n\
    length-linelen=500 pad;\nvarlen-linelen=0;\ninput source_text $varying500. varlen;\n\
    format ReleaseNumber$20. ReleaseDate$20. Respondents $500. URL $500;\nstart =;\n\
    stop =;\nPattern_ID = PRPARSE('/<(\\w+)>>(.*?)\\<\\(\\w+)>/o');\nCALL PRXNEXT(pattern_ID,\
    \ start, stop, source_text, position, 3)\nDO WHILE (position > 0)\n  tag = PRXOSEN(pattern_ID,1,source_text);\n\
    \  if tag='url' then URL = PRXOSEN(pattern_ID,2,source_text);\n  else if tag='release_number'\
    \ then ReleaseNumber =\n  PRXOSEN(pattern_ID,2,source_text);\n  else if tag='release_date'\
    \ then ReleaseDate =\n  PRXOSEN(pattern_ID,2,source_text);\n  else if tag='respondents'\
    \ then do;\n    Respondents = PRXOSEN(pattern_ID,2,source_text);\n    put releasenumber\
    \ releasedpondents url;\n    end;\n  end;\n  CALL PRXNEXT(pattern_ID, start, stop,\
    \ source_text, position,\nlength);\nend;\nkeep ReleaseNumber ReleaseDate Respondents\
    \ URL;\nrun;\nprint data=secfilings;\nrun;\n```\n\n+   We bring in data from our\
    \ XML source file using the INFILE statement, using the length, LCREL, and pad\
    \ options. (See the SAS documentation for additional information about these options.)\
    \ Next, using the INPUT statement, the data at 1-var in the Program Data Vector\
    \ (PDV) are assigned to source_text. Because we LCREL=500, we cannot capture more\
    \ than 500 bytes at one time, but we can capture less. For this reason, we use\
    \ the format $varying500.\n\n+   Using the PRPARSE function, we create a RegExp\
    \ pattern identifier, Pattern_ID. This Regex matches on a pattern that starts\
    \ with an opening XML tag, containing any name and variety of characters in the\
    \ middle, and ends with a closing XML."
