    # 2.10 CONTENTPROVIDER


    ContentProvider is also called CP for short. App developers are not familiar with
    ContentProvider.


    ContentProvider is used to transfer large data (size > 1M). ContentProvider is
    widely used in Android ROM development to transfer large data from one process
    to another. But in an app, large data is stored in the remote server; we can invoke
    the remote API to fetch this data rather than ContentProvider.


    There is an exception to everything. Sometimes the app will read the data of the
    Address Book or SMS. At this moment we need to use ContentProvider. The data of
    the Address Book or SMS is provided in the form of ContentProvider.


    Let''s have a quick review of how to use ContentProvider in an app, shown in Figure
    2.25.

    We need to write code in both app1 and app2, as follows:


    +   1) Define ContentProvider in app1


