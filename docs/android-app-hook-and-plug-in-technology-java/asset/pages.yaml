    # 10.7.2 Modify resources.arsc


    In Section 8.3.1, I introduced a scenario. When we merge all the resource IDs
    of the HostApp and the plug-in together, the resource ID may conflict between
    these two paths. The solution is to rewrite the command `aapt` to specify PackageIds
    for different plug-ins.


    In this section, I will introduce another solution. After the command `aapt` is
    executed, we modify `R.java` and `resources.arsc` in the Gradle plug-in.


    # 10.7.2.1 How to Find Resources in Android


    Let''s have a look at how to search for resources in the Android system. There
    are two classes involved in this process, as follows:


    +   1) *Resources* finds the file name of the resource by resource ID. It is a
    1:1 mapping between the resource ID and the file name. This mapping is stored
    in *resources.arsc*. *Resources* search this file to find the corresponding file
    name.


    +   2) *AssetManager* finds the resource by the resource name.


    Figure 10.25 shows this process in detail.


    ![](img/b7249be733b166b559267ab5ad055b72_405_0.png)


    FIGURE 10.25 How to get resources in AssetManager and Resources.'
