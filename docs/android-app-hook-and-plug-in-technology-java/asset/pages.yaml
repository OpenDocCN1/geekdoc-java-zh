    # 8.5.4 The Right Time to Install a ContentProvider-plugin*


    We have introduced a plug-in solution for ContentProvider. Sometimes when we invoke
    the CRUD method on the ContentProvider of the plug-in, we find this ContentProvider
    is still "installed" in the HostApp.


    So, we want to install the ContentProvider of the plug-in as soon as possible.


    The method installContentProviders() of ActivityThread is used to install ContentProvider,
    which is invoked after the app process is launched; it''s invoked earlier than
    the method onCreate() of Application, so we can execute the method attachBaseContext()
    of Application. So, we can method installContentProviders() manually in the method
    attachBaseContext(), as follows:


