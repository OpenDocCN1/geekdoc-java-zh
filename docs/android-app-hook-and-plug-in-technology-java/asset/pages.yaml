  md: '# The Plug-In Solution

    of Four Components


    THIS CHAPTER INTRODUES a plug-in solution for the four components in the Android
    system: Activity, Service, ContentProvider, and BroadcastReceiver.


    # 8.1 THE SIMPEST PLUG-IN SOLUTION


    This section introduces the simplest solutions provided by plug-ins which are
    applicable to all the components, Activity, Service, ContentProvider, and BroadcastReceiver.
    These solutions involve the following techniques:


    +   1) Combine all the dex of the plug-ins to load classes defined in the plug-in.

    2) Pre-declare Activity, Service, ContentProvider, and BroadcastReceiver of the
    plug-in in the HostApp''s AndroidManifest.xml. Of course, there are hundreds of
    Activities in the plug-in, this is not a good solution.

    3) Merge all the resources of the plug-in into a resources pool. However, this
    solution may result in the conflict of resource IDs from different plug-ins.'
