    The componentized model of Android is only applicable to the development stage.
    When there is a bug in the online release, or new features are to be released,
    all modules must be packaged together again to deploy the new release.


    Plug-in technology is the final solution based on Android componentization. At
    this point, each service is no longer an aar file, but an apk file, placed in
    the folder assets of the Hostapp. In this way, after a release, some modules are
    updated, only the code of this module is packaged again, an incremental package
    is generated, and it is put on the remote server for the app users to download.


