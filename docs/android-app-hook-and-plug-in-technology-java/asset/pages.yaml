  md: '# Reflection


    HIS CHAPTER INTRODUCES THE most powerful technique in Java: reflection.


    The original grammar of reflection is complex and hard to understand, so we can
    encapsulate it into the class Utils for convenience, including the class, constructor,
    method, and field.


    jOOR is a well-known open source library used to encapsulate reflection syntax.
    However, jOOR is not suitable for the fields marked as final in Android. As the
    author of jOOR noted, jOOR is designed for Java only, and not fully supported
    in Android.


    Another difficulty with reflection is how to handle a generics class, which is
    widely used in Android plug-in techniques.


    # 3.1 BASIC REFLECTION*


    Reflection consists of the following three techniques:


    +   * Get an object from the class using a string.

    * Get all the fields and methods (public, private, or static) of the class.

    * Get a generics class.


    Compared to the other languages, such as C#, the grammar of reflection in Java
    is very difficult to understand; we''ll introduce the usage of reflection through
    the three points given above.


    > * For the example code in this section, please refer to https://github.com/Baobaojianqiang/TestReflection'
