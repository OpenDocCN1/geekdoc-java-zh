  md: '# 2 Android App-Hook and Plug-In Technology


    different plug-in apps, only the home page is left in the main app (and is called
    the Hostapp). When users click the button in the Hostapp, it will navigate to
    the small apps.


    In traditional app coding strategy, all the code and logic should be in one app.
    When we find bugs in the app, there is only one way to solve this online bug;
    it is to package this app and submit it to the Android app market. However, the
    users must download the latest version of this app to remedy the bugs. it is not
    a good solution; it’s not user-friendly. Most users don’t want to waste time updating
    an app.


    Android plug-ins are a very good solution to the problem above. If there is a
    bug in one plug-in, we just need to package this plug-in again, and then put this
    new plug-in on the remote server. When the user opens the Hostapp, it will download
    this new plug-in in the background automatically. When downloaded successfully,
    the user needs to restart the app and the bugs will have been eliminated from
    the app.


    The plug-in technique is not only used to fix bugs but is also suitable for rapid
    software development. In traditional app development, you launch a new version
    of the app every month. It is very common for a very big company to have 100 product
    requirements needing to be coded within month. Any delay in development causes
    some products to launch later than planned. By using the plug-in technique, the
    different apps can be launched individually; there will be no time limit.


    In China, the hot-fix technique was developed using similar ideas to plugins.
    The hot-fix technique is useful for fixing online bugs. When developers find online
    bugs, they can fix the codes and package the code modification into a zip file;
    then upload this zip file to the remote server, so that users can download this
    zip file dynamically. After the users have downloaded the zip successfully, the
    app will decompose this zip file and substitute the old code with the new code
    in the zip file.


    The plug-in technique and hot-fix technique were developed using very similar
    ideas. The plug-in technique loads outside the apps by hooking the Android internal
    system API. The hook occurs in the Java code, where the hot-fix is happening in
    NDK, and C++. A hot-fix replaces the pointer of the old method with a pointer
    of the new method. This book focuses on the plug-in technique.


