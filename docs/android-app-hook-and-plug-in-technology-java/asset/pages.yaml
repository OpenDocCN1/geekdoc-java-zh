  md: "# 394 ■ Android App-Hook and Plug-In Technology\n\nNow let's analyze how to\
    \ handle the message in the MainLooper. Each message has a field target. When\
    \ a message is thrown into the MainLooper, the Android system will invoke the\
    \ method dispatchMessage() of the target to get the message to the corresponding\
    \ class to handle it. The field target is a Handler object.\n\nIt's time to have\
    \ a look at the structure of the class Handler, shown as follows:\n\n```\npublic\
    \ class Handler {\n    final Callback mCallback;\n\n    public interface Callback\
    \ {\n        public boolean handleMessage(Message msg);\n    }\n\n    public void\
    \ handleMessage(Message msg) {\n    }\n\n    public void dispatchMessage(Message\
    \ msg) {\n        if (msg.callback != null) {\n            handleCallback(msg);\n\
    \        } else {\n            if (mCallback != null) {\n                if (mCallback.handleMessage(msg))\
    \ {\n                    return;\n                }\n            }\n         \
    \   handleMessage(msg);\n        }\n    }\n}\n```\n\nThe method handleMessage(Message\
    \ msg) of Handler has no logic, so we always write a subclass which inherits from\
    \ Handler and overrides the method handleMessage().\n\nIn the Android system,\
    \ this subclass is H is an inner class defined in ActivityThread, shown as follows:\n\
    \n```\npublic final class ActivityThread {\n    private class H extends Handler\
    \ {\n        public static final int LAUNCH_ACTIVITY = 100;\n```"
