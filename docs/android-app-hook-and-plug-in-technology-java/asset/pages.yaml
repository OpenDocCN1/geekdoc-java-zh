  md: "# 252 Android App-Hook and Plug-In Technology\n\n# 9.1.2.2 Communication between\
    \ ProxyActivity and Plug-In Activity\n\nTo simplify the logic of ProxyActivity,\
    \ I abstract the logic of creating a ClassLoader for the plug-in and loading the\
    \ resources of the plug-in into a parent class BaseHostActivity. We introduced\
    \ this technique in Chapter 7.\n\nLet's focus on the special logic of ProxyActivity.\n\
    \nIn the method onCreate() of ProxyActivity, we get an instance of the Activity\
    \ from the plug-in; its name is mRemoteActivity. mRemoteActivity can help us do\
    \ the following:\n\n+   1) Call the method setProxy() of mRemoteActivity and pass\
    \ \"this\" (instance of ProxyActivity) and the path of the plug-in to the Activity\
    \ of the plug-in.\n\n```\n//Create the instance of Activity using reflection\n\
    Class<?> localClass = dexClassLoader.loadClass(className);\nConstructor<?> localConstructor\
    \ = localClass.getConstructor(new Class[] {});\nObject instance = localConstructor.newInstance(new\
    \ Object[] {});\nmRemoteActivity = (Activity) instance;\n```\n\n```\n//Execute\
    \ the setProxy method of the Plug-In Activity\nto establish a bidirectional reference\n\
    Reflect.invokeMethod(instance, \"setProxy\", new Class[] { Activity.class, String.class\
    \ }, new Object[] { this, mDexPath });\n);\n```\n\nNow ProxyActivity has a reference\
    \ to the Activity of the plug-in app, and the Activity of the plug-in also has\
