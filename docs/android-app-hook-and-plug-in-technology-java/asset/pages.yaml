  md: '# 128 ■ Android App-Hook and Plug-In Technology


    Let''s have a quick look at the proceeding hooking demos. We find that are separated
    into two different solutions, one is Static-Proxy, and the other one is Dynamic-Proxy:


    +   - Static-Proxy: there are two classes suitable for this solution, one is Handler.Callback,
    the other is Instrumentation. Only these two classes are exposed to app developers.

    - Dynamic-Proxy: there are two interfaces suitable for this solution, IPackageManager,
    and IActivityManager. The method Proxy.newProxyInstance() only supports the interface.


