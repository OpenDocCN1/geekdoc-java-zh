  md: "# A Plug-In Solution Based on Static-Proxy ■ 269\n\n+   * singleInstance. If\
    \ the LaunchMode of the Activity has this value, the Android system will create\
    \ an instance of this Activity in a new stack, and all the third app can visit\
    \ this instance in the stack.\n\nIt’s difficult to understand. Let’s take the\
    \ camera as an example. My App wants use the camera; the camera is a system app\
