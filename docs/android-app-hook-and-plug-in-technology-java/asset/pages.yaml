    # 8.4.2 A Plug-In Solution for Dynamic Receiver*


    Dynamic Receiver need''t communicate with the AMS, so it is only a normal class.


    We only make sure that the HostApp can load this normal class in the plug-in.
    In Section 8.2.2, we introduced the technique of dex merging. We can use BaseDexClassLoaderHookHelper
    in the project Receiver1.0, and then the Dynamic Receiver in the plug-in can be
    invoked normally.


    # 8.4.3 A Plug-In Solution for Static Receiver*


    Static Receiver must be declared in the AndroidManifest.xml, which is similar
    to Activity.


    In Section 8.2.2, we introduced a plug-in for Activity. Activity is not declared
    in the AndroidManifest.xml and can be launched. We use StubActivity to cheat the
    AMS.


    But this is not suitable for Static Receiver, because we must specify an intent-filter
    for the broadcast. The parameters of the intent-filter such as action can be set
    to any value, so we cannot use a Stub mechanism in the Receiver directly.


    However, we have another solution. We to treat Static Receiver declared in the
    AndroidManifest.xml of the plug-in as a Dynamic Receiver, as follows:


    +   Step 1: Because the PMS can only read the AndroidManifest.xml of the HostApp,
    parse, and register Static Receiver. We can use the PMS to parse the Static Receiver
    declared in the AndroidManifest.xml of the plug-in by reflection.


    +   Step 1: Traverse the list of Static Receiver we get in step 1. Use the ClassLoader
    in the plug-in to load each Receiver in the list, instantiate them as an object,
    and register them in the AMS as Dynamic Receivers.


    The PMS parses the AndroidManifest.xml using the method PackageParser(). The definition
    of the method PackageParser() is as follows:


