    # 2.11 THE PMS AND APP INSTALLATION PROCESS


    # 2.11.1 PMS Introduction


    PMS (PackageManagerService) is used to obtain the information of an apk.


    In the previous sections, we analyzed the communication between the four components
    and the AMS; as we have shown, the AMS uses the PMS to load information from an
    apk, and encapsulate this information into a LoadedApk object, and then we can
    fetch all the components declared in the AndroidManifest.xml.


    During the process of app installation, the apk is not unzipped during app installation.
    It is stored in the folder Data/App.


    I wondered why the apk is not zipped. It is easy to find any resource in the resource
    folder. In fact, reading resources from apk is quicker. We can find the implementation
    of this logic in the Android system. It’s written in C++.


    Every time an app reads resources from the apk; it will parse resources. arsc
    in the apk.resources.arsc stores all the information of resources, including the
    address, size, and other properties of the resources. It also stores the mapping
    between resource ID and the real name of the resource. Which means the app can
    fetch the resource using the resource ID quickly.'
