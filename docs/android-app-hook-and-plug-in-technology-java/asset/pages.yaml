  md: '# 320 Android App-Hook and Plug-In Technology


    Solution 1 may cause conflicts of resource ID. There are several:


    +   - Solution 1.1: Rewrite the aapt command, specify the prefix of the resource
    ID, as 0x71, to ensure that the resource ID of the HostApp and plug-in will never
    conflict.

    - Solution 1.2: After packaging the plug-in, modify the resource ID in R.java
    and resource.asc, for example, modify the default prefix 0x7f to 0x71, so that
    there will never be conflict between the HostApp and plug-in.

    - Solution 1.3: Specify the values of all the resource IDs in public.xml. But
    doing this is very troublesome. Every time we add a resource in the app, we need
    to maintain it in public.xml. So, this solution can only be used to fix several
    specific values.


    Solution 2: If we don''t merge resources in the process of packaging, we need
    to create an AssetManager for each plug-in. Each AssetManager calls the method
    addPath by reflection to add the resources of the plug-in. When we navigate from
    the HostApp to plug-in, we should switch to the AssetManager of the plug-in. We
    introduced this solution in Chapter 5, We focus on solution 1 in this section.


    # 10.2 A PLUGIN-IN FRAMEWORK BASED ON FRAGMENT


    In this section, I will introduce an ancient plug-in framework named AndroidDynamicLoader;
    it''s the first source plug-in framework published by Yimin Tu of Dianping in
    July 2012. This framework loads Fragment of the plug-in dynamically.


    Unlike the four components of the Android system, Fragment is only a simple class.
    All the four components interact with the AMS, while Fragment has no relationship
