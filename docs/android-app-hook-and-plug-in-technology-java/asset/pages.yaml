    # 2.5.2 Starting the App Is Not So Simple


    In Section 2.5.1, we gave a quick overview of the process of starting an app.
    But we find Launcher and Amazon are two different apps; they use different processes,
    and cannot communicate with each other directly. With the help of Binder, one
    app sends a message to the AMS, and the AMS notifies the other app.


    Take the Amazon app as an example; the whole process is as follows:


    +   1) When the user clicks on the app icon in Launcher, Launcher informs the
    AMS, “I want to open Amazon, I will send an action and a category, please help
    me open the Activity which is suitable for this information.”

    2) The AMS informs the Launcher, “Your work is done.” At the same time, the AMS
    records which activity to start.

    3) The current Activity of the Launcher invokes its method onPause(), and informs
    the AMS, “I’m going to sleep, you can launch the Amazon app.\n4) The AMS checks
    whether the Amazon app has already been launched. If yes, it wakes up the Amazon
    app; otherwise, the AMS must start a new process for the Amazon app. The AMS creates
    an ActivityThread in the new process and executes the function main() to launch
    the Amazon app.

    5) After the Amazon app starts, it will inform the AMS, “Hey, I am the Amazon
    app, I’m ready to start."

    6) The AMS fetches the action and category stored before, and sends this information
    to the Amazon app, “Please launch the Activity which is suitable for this."

    7) The Amazon app launches the Activity which is suitable for this information,
    creates a Context object, and associates this object with the Activity. Then it
    invokes the method onCreate() for the Activity.


    > * This process analysis is basically based on the Android 6.0 source code.'
