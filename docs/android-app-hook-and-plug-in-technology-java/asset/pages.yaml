    ClassLoader to launch Fragment of the plug-in.


    ```

    //Reflects the Plugin''s Fragment object

    Class<?> localClass = dexClassLoader;

    loadClass(mClass);

    Constructor<?> localConstructor = localClass.getConstructor(new Class[] {});

    Object instance = localConstructor.newInstance(new Object[] {});

    Fragment f = (Fragment) instance;

    FragmentManager fm = getFragmentManager();

    FragmentTransaction ft = fm.beginTransaction();

    ft.replace(R.id.container, f);

    ft.commit();

    ```


    Note that R.id.container refers to the layout activity_fragment_loader.


