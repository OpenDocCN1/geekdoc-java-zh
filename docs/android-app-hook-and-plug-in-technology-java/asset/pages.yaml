    \ a ClassLoader for each plug-in, and use the corresponding ClassLoader to load\
    \ the classes of the plug-in.\n\n+   2) Combine the dex of the plug-ins into the\
    \ dex array of the HostApp.\n\n+   3) The HostApp uses its original ClassLoader\
    \ to load classes in the HostApp. The HostApp can't use its original ClassLoader\
    \ to load classes in the plug-in. So we write a new ClassLoader and replace the\
    \ original new ClassLoader. This new ClassLoader has a collection storing all\
