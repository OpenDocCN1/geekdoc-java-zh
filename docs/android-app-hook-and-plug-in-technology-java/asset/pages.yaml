    launch the Service directly.

    3) The app launches the Service.


    # 2.8.3 Bind a Service in the Same Process


    Let''s have a look at the Service binding process in the current process. The
    process has the following five steps:


    +   1) The app sends a message to the AMS, "I want to bind a Service."

    2) The AMS checks if this Service is declared in the AndroidManifest.xml. If yes,
    the AMS will inform the app process to launch this Service, and then bind this
    Service later. The AMS will send messages to the app.

    3) The app receives the first message from the AMS and launches this Service.

    4) The app receives the second message from the AMS; it will bind this Service
    and send a Binder object to the AMS.'
