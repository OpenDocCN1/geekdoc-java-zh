  md: "# 106 ■ Android App-Hook and Plug-In Technology\n\nIn Figure 4.1, realSubject\
    \ and Proxy are both subclasses of Subject. A Proxy class has a field named realSubject\
    \ whose type is realSubject. The Proxy class also has a method Request; its implementation\
    \ is to invoke realSubject's Request method. The code is shown as follows:\n\n\
    ```\nabstract public class Subject {\n    abstract public void Request();\n}\n\
    \npublic class realSubject : Subject {\n    public override void Request() {\n\
    \        //Do Something\\    }\n}\n\npublic class Proxy : Subject {\n    private\
    \ realSubject realSubject;\n\n    public override void Request() {\n        //Below\
    \ is the key statement\n        realSubject.Request();\n    }\n}\n```\n\nIn the\
    \ next section, I will describe the usage of the proxy pattern, and you will discover\
    \ for yourself its power.\n\n# 4.1.1 Remote Proxy\n\nWebService, a very popular\
    \ technology around 2004, the server is implemented in Remote Proxy. We could\
    \ transfer data from the Java server to the .NET server. WebService creates mapping\
    \ between XML and the entity class in Java or C#. First, the entity written in\
    \ Java is converted to XML, and then the XML data is transferred to the .NET server,\
    \ and then XML is converted to the entity in C# in the .NET server.\n\nNow WebService\
    \ techniques have already been replaced by JSON. Because XML in WebService is\
    \ too heavy, we usually have to create a lot of files like DTD or Schema to define\
    \ the format of the XML. But JSON is lighter than XML."
