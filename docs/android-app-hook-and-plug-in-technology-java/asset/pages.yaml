  md: '# Android App-Hook and Plug-In Technology


    # 1.5 DO ALL COMPONENTS REQUIRE PLUG-INS?


    In Android, Activity, Service, ContentProvider, and BroadcastReceiver are the
    four major components.


    Do all four components need to convert to plug-ins? Over the years, I have been
    working on plug-in technology with this question.


    I worked in OTA companies for several years. This kind of app is similar to e-commerce
    ones, including a complete set of payment processes, and Activity is the most
    used; 200 or 300 Activities are not surprising; the other three components are
    rarely used.


    Most apps in China have the same situation.


    According to the technology stack, the app is divided into four domains:


    +   - Game App. People have their own online update process. Many of their use
    scripts like Lua.


    +   - Mobile assistants, mobile phone, and the use of such applications for Service,
    Receiver, and ContentProvider.


    +   - Music, video, and live video applications are very dependent on Service
    and Receiver, in addition to more Activities.


    +   - E-Commerce, social, news, and reading apps use a lot of Activities. The
    use of the other three major components is not enough.


    Different plug-in frameworks are suitable for different requirements. If an app
    uses a lot of the Service, BroadcastReceiver, and ContentProvider components,
    the plug-in framework for this app must support all four components in Android,
    but this plug-in framework is hard to maintain. Otherwise, a plug-in framework
    which only supports Activity is enough for a simple app.


    # 1.6 DOUBLE-OPENING AND VIRTUAL MACHINE


    Since plug-ins will be replaced by React Native in the following years, what is
    the future of plug-ins? The answer is virtual machine technology.


    Some engineers already have experience of installing a virtual machine on a computer.
    If the computer''s memory is large enough, you can open multiple virtual machines
    at the same time. On each virtual machine, you can log into Twitter with a different
    account, and then chat with yourself. Of course, chatting with yourself doesn''t
    make any sense.'
