    getApplicationContext() to get an instance of Context, shown as follows:


    ```

    Intent intent = new Intent (MainActivity.this, SecondActivity.class);

    getApplicationContext().startActivity(intent);

    ```


    But the essence of these two is the same, as shown in Figure 5.1 and 5.2. Compare
    these two figures: we find the steps before AMN/AMP are different; the other steps
    are the same.'
