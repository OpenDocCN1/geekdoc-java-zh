    # 2.11.3 PackageParser


    After the Android system reboots, all the apps in the Android system will be reinstalled
    by the PMS again.

    The first time the app is installed in the Android system, this work is also completed
    by the PMS.

    The PMS is the system process in the Android system.

    Now I will introduce an important class, PackageParser. It''s an important class
    in this book because PMS uses PackageParser to parse the information in the AndroidManifest.xml.

    The method parsePackage() of PackageParser has a parameter apkFile. We can use
    the current apk file or an external apk file as the parameter for this method.

    Unfortunately, PackageParser is not open to app developers; we must use reflection
    to invoke the method parsePackage() to get the components declared in the AndroidManifest.xml.

    The return value of parsePackage() is a Package object, which stores information
    of the four components in the AndroidManifest.xml. This class is of no use to
    us. So we always convert it to a PackageInfo object using the method generatePackageInfo()
    of PackageParser.

