  md: '# 250 Android App-Hook and Plug-In Technology


    To invoke these methods normally, we create a proxy Activity in the HostApp and
    declare it in the AndroidManifest.xml, so it''s a real Activity.

    ProxyActivity has a reference to ActivityA in the plug-in. In the logic of the
    method onCreate() of ProxyActivity, the method onCreate() of ActivityA is invoked,
    as shown in Figure 9.1.


    | ProxyActivity | ActivityA |

    | --- | --- |

    | onCreate() | onCreate() |

    | onResume() | onResume() |

    | onDestroy() | onDestroy() |


    FIGURE 9.1 Core of the “That” framework.


    This is similar to a puppet show. The artists pull the wire, and the puppets at
    the end of the wire move according to the pulling action. ProxyActivity is the
    artist, and ActivityA of the plug-in is the puppet. The puppet has no life. ActivityA
    of the plug-in is a normal class; it also doesn’t have lifecycle methods.


