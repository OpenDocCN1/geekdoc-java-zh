  md: 'It is not "fair" for AssetManager, as it does lots of work, but it is not well
    known to us, AssetManager has only two public methods. For example, the method
    open() is used to access the Resources in the folder Assets. AssetManager has
    a method addPath(String path), and we can pass the path of the apk to the parameter
    path, then AssetManager and Resources can access all the resources in this apk.


    Path(String path) is not a public method; we can use reflection syntax, put the
    path of the plug-in apk into this method, then the resources of this plug-in apk
    will be thrown into a resource pool. The resources of the current app are held
    in this pool.


    How many times the method addPath() is executed depends on the number of plug-in
    apps (Figure 7.1).


    | Resources | AssetManager | |

    | --- | --- | --- |

    | -assetManager | +addAssetPath() | Resource.arc |

    | +getString() | +open() | |

    | +getText() | | |

    | +getDrawable() | | |


    FIGURE 7.1 Resources and AssetManager.


    AssetManager has an internal method to access resources. During the process of
    the apk''s packaging, each resource generates a HEX value in R.java. But when
    the app is running, how do we know the mapping between this HEX value and the
    corresponding resource file?


    During the process of the apk''s packaging, a file named resources.arcsc will
    be generated at the same time, which is a HashTable that stores all the mapping
    between the HEX value and the corresponding resource file.


