  md: '# 64 Android App-Hook and Plug-In Technology


    This issue is also called 65536. It occurs when the count of methods in an app
    is more than 65536.


    We can write so many methods into an app, but we always use the third party SDK
    and compile it into the app. These SDKs have a lot of features with tens of thousands
    of methods, but we use only one or two in our app. That''s why the count of methods
    exceeds 65536.


    We can use ProGuard to reduce unused methods. The number of methods in an app
    will be less than 65536, but we use only ProGuard in release mode. We must face
    this issue in debug mode.


    The root cause of 65536 is in the older version of Android systems, such as 4.4,
    and there is a variable to define the count of methods in the dex file. This variable
    is 16-bits. 2^16 = 65536.


    Later Google released a solution to resolve this issue, MultiDex. MultiDex splits
    the original dex file into multiple dex files. The number of methods in each dex
    does not exceed 65536, as shown in Figure 2.32.


    ![](img/b7249be733b166b559267ab5ad055b72_90_0.png)


    FIGURE 2.32 Split dex into multiple dexes.


    classes.dex is also called the main dex and is loaded automatically by the app.
    The app uses PathLoader to load the main dex.


    The other dex such as classes2.dex, classes3.dex, and so on, will be loaded by
    DexClassLoader after the app is launched.


    MultiDex is not only to resolve the 65536 issues but can also be used to improve
    the performance of the launching app.


    The Android system will have a lot of time to load a large dex file, so we must
    take action to reduce the loading time.


    We find classes.dex doesn''t need so many classes. For example, an OTA app has
    Flight, Hotel, and other modules. We can separate Flight, Hotel, and other modules
    from classes.dex into different dex files. We only keep'
