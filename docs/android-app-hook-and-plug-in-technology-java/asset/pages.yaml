  md: "# A Plug-In Solution Based on Static-Proxy ■ 301\n\n# 9.2.5 Static-Proxy in\
    \ BroadcastReceiver*\n\nHow to use Static-Proxy in BroadcastReceiver?\nBroadcastReceiver\
    \ is a normal class; it has only one method onReceive().\nLet's create a ProxyReceiver\
    \ in the HostApp; it's a Receiver. When we invoke method sendBroadcast(Intent\
    \ intent) to fire the method onReceive() of ProxyReceiver, the parameter intent\
    \ carries the information about the Receiver of Plug-In. When ProxyReceiver receives\
    \ this information, it will invoke the method sendBroadcast again, to fire the\
    \ method onReceive() of ProxyReceiver. Let's have a look at how to implement this.\n\
    \nBecause both Activity and Service inherit from Context, we can invoke the method\
    \ getClassLoader() and getDir() of Context in Activity and Service. We can pass\
    \ dexPath of the plug-in as a parameter to ProxyActivity and ProxyService, and\
    \ then create a ClassLoader for the plug-in to invoke the method loadClass() of\
    \ ClassLoader to get the corresponding Activity and Service.\n\nBut we doesn't\
    \ work for Receiver, because Receiver does not have a Context inside; we can't\
    \ use the syntax like getClassLoader() or getDir(), so it's no use to pass dexPath\
    \ to ProxyReceiver.\n\nWe can also generate all the ClassLoaders of the plug-ins\
    \ at one time and put them into HashMap. When ProxyReceiver wants to use the ClassLoader\
    \ of the PLUG-IN, we can fetch it from this HashMap using the name of the plug-in.\n\
    \n+   1) Declare ProxyReceiver in AndroidManifest.xml:\n\n```\n<receiver android:name=\"\
    ProxyReceiver\">\n  <intent-filter>\n    <action android:name=\"baobao2\" />\n\
    \  </intent-filter>\n</receiver>\n```\n\n+   2) Prepare MyClassLoaders which carries\
    \ the plug-ins:\n\n```\npublic class MyClassLoaders {\n  public static final HashMap<String,\
    \ DexClassLoader> classLoaders = new HashMap<String, DexClassLoader>();\n}\n```\n\
    \n> * For the example code of this section, please refer to https://github.com/Baobaojianqi/That3.4"
