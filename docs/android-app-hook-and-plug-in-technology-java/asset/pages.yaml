  md: '# 322 ■ Android App-Hook and Plug-In Technology


    We need to pass two parameters to FragmentLoaderActivity. One is the path of the
    plug-in, the other is the full name of the Fragment to be loaded.


    Since then, we can write all the page logic in this FragmentLoaderActivity, putting
