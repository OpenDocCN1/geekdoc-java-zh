  md: '# Introduction


    WELCOME TO THE FIRST edition of Android App-Hook and Plug-In Technology


    WHAT THIS BOOK WILL TEACH YOU

    This book will teach you everything you need to know to master Android plug-in
    techniques.

    This book introduces the Android plug-in technique.This book introduces the Android
    plug-in technique. An app can be downloaded as an apk file in a zip file from
    the remote server. We call this zip file a plug-in. This app can invoke a class
    in this plug-in. This means that we can update the content of the app without
    repubishing it again.

    Google Play has a strict app auditing strategy. It forbids any app from downloading
    another to prevent it from downloading malicious content or pornographic and violent
    content. Thus, we cannot publish an app using this plug-in technique on Google
    Play.

    This book will teach you the underlying knowledge of the Android system, which
    help you master Android technique at a high level.

    After reading this book, you will be familiar with several aspects of the Android
    system, including the following:


    +   - Binder and AIDL mechanisms.

    - The working mechanisms of Activity, Service, ContentProvider, and BroadcastReceiver.

    - Communication between ActivitySystemService and four components.

    - How to launch an app.

    - LaunchMode.

    - The families of Context and ClassLoader.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# xxiv Introduction


    +   - MultiDex.

    - How to load SO.

    - PackageManagerService and how to install an app in the Android system.

    - Reflection.

    - The Proxy.newProxyInstance() method for adding an external function to the original
    API.


    # WHO IS THIS BOOK FOR?


    Don''t use the plug-in techniques introduced in this book on Google Play; it''s
    forbidden.


    This book introduces a lot of knowledge about the Android system which is useful
    to app developers.


    # THE SAMPLE CODE


    The sample code in this book is on my Github: https://github.com/BaoBaoJianqi/.


    There are 74 demos in this book, and I list the address of each demo in the corresponding
    chapter and section.


    In Appendix A, I list all the demos with their corresponding chapter and section.


    # THE BOOK''S STRUCTURE


    This book consists of 11 chapters: chapters 1 to 5 introduces the basic knowledge
    of plug-in techniques; chapters 6 to 10 introduces several solutions for plug-in
    programming issues; Chapter 11 is an overall summary.


    Below is a brief overview of the chapters.


    Chapter 1 introduces the history of Android plug-in techniques.

    Chapter 2 introduces the underlying Android system, including Binder and AIDL,
    ActivityManagerService, PackageManager, ActivityThread, LoadedApk, and so on.
    As this book is written for app developers, I illustrate these concepts with a
    series of pictures rather than code.


    Chapter 3 introduces the syntax of reflection, and the encapsulation of the reflection,
    including jOOR, a famous Java reflection framework. Reflection is the basis of
    plug-in techniques.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Introduction ■ xv


    Chapter 4 introduces proxy patterns, including Static-Proxy and Dynamic-Proxy,
    these two proxies generate two important plug-in frameworks, DroidPlugin and DL.
    Proxy.newProxyInstance() is a widely used plug-in, and we use this method to hook
    IActivityManager and IPackageManager in this chapter.


    Chapter 5 introduces how to start an Activity not declared in the AndroidManifest.xml,
    based on the Proxy.newProxyInstance() introduced in Chapter 4.


    Chapter 6 introduces the basic knowledge of plug-ins, including how to debug from
    the Hostapp to the plug-in, and interface-oriented programming.


    Chapter 7 introduces how to load Resources into plug-ins. AssetManager and Resources
