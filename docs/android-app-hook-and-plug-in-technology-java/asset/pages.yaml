    # 9.1 A PLUG-IN SOLUTION FOR ACTIVITY BASED ON STATIC-PROXY


    This chapter introduces my favorite plug-in framework designed by Yug Ren*, dynamic-load-apk
    (DL for short). DL invents a new keyword “that,” so this framework has an interesting
    alias “That.”


    In this chapter, I will introduce the design idea of the “That” framework in detail
    and write a new “That” framework from scratch, including the plug-in implementation
    of Activity, Service, and BroadcastReceiver.


    # 9.1.1 The Idea of Static-Proxy


    As we introduced in the previous chapters, when we create an instance of Activity
    using reflection, this instance doesn''t have lifecycle methods; it''s only a
    normal class object.


    For example, we check the AMS to check the Activity without declaring in the AndroidManifest.xml.
    But if we don''t put the Activity from the Plug-In into the Activity collection
    of the HostApp, the method onCreate() of this Activity can''t be invoked by the
    AMS, and the other lifecycle methods of Activity such as onResume(), onPause()
    have the same problem. Because the HostApp doesn''t treat this Activity from the
    plug-in as a real Activity, it''s only a normal class.


    > * https://github.com/singwhatiwanna/dynamic-load-apk'
