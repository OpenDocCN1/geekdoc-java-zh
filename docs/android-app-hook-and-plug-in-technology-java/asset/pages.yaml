    In 2015, React Native was born. At that time, few people paid attention to it
    because it was still immature with a few basic functions. Then, with the next
    iteration of the React Native project, the functions were much improved. Although
    there has not been release version 1.0 so, we find that it is a “plug-in” framework
    to support both Android and iOS systems.


    React Native is written based on JavaScript, packaged, and put on the remote server
    for Android and iOS apps to download and use.


    For small-sized or medium-sized companies and startups, who don''t have the human
    and financial resources to develop a plug-in framework, generally adopt a relatively
