    # 10.5 INCREMENTAL UPDATE''


    In this section, let''s talk about how to update the plug-in, which is an

    important feature. Each plug-in is as: the size of the app is large. When

    the version of the plug-in upgrades from 1.0 to 2.0, the app will download

    the new plug-in from the remote server. If this of plug-in is larger

    than 10M, so it will take a long time.


    If we can generate a file that includes only the differences between

    the versions 1.0 and 2.0 of this plug-in and supply this file for the App user,

    t size of this file is small; the app user can download it in a short time.

    This technique has a cool name: An Incremental Update.


    # 10.5.1 The Basic Concept of an Incremental Update


    First, we need to compile and package all the plug-ins and put these plug-

    ins the folder Assets of the HostApp, to make sure the HostApp can load

    all the plug-ins in this folder.


    Each plug-in has its own version. If the version of the HostApp is 6.0.0,

    the version of the plug-in in the folder Assets of the HostApp should be

    6.0.0.1.


    When we find Plugin1 version 6.0.0.1 has a bug, fix this bug,

    compile and package Plugin1 again, and set its version to 6.0.0.2, and put

    it on the remote server. The app will detect the new version of Plugin1 and

    download it.


    > * Refer to https://github.com/louiszgm/zeusstudy1.6


    > † Sample Code: https://github.com/That2'
