    # 8.2.2 Solution 1: Based on Dynamic-Proxy*


    There are many plug-in solutions for Activity, which are roughly divided into
    two categories:


    +   - The solution based on Dynamic-Proxy, represented by DroidPlugin† written
    by Yong Zhang. Which loads Activity, Service, BroadcastReceiver, and ContentProvider
    from the plug-in app through hooking the internal API in the Android system.

    - The solution based on Static-Proxy, represented by DL‡ written by Yugang Ren.
    Which loads all Activities in the plug-in through ProxyActivity.nStatic-Proxy,
    represented by DL‡ written by Yugang Ren. Which loads all Activities in the plug-in
    through ProxyActivity.


    This chapter focuses on plug-in solutions based on Dynamic-Proxy to support Activity.


