  md: "# The Plug-In Solution of Four Components ■ 185\n\n8.1.4 Resources for Activity*\n\
    \nIn Section 8.1.1, 8.1.2, and 8.1.3, we loaded a Service of the plug-in into\
    \ the HostApp.\n\nAll of the other components, Activity, ContentProvider, and\
    \ BroadcastReceiver of the plug-in can be loaded in the same way.\n\nThe plug-in\
    \ solutions for Service, ContentProvider, and BroadcastReceiver are simple: we\
    \ only need to merge all the dex files of the plug-in into one array and pre-declare\
    \ them in the AndroidManifest.xml.\n\nThe solution for Activity is a bit complicated.\n\
    \nActivity is heavily dependent on resources. Therefore, we must resolve the problem\
    \ of how to load the resources into the plug-in.\n\nI introduced the relationship\
    \ between AssetManager and Resources in Chapter 7. There is a method addAssetPath(String\
    \ path) of AssetManager. We can pass all the paths from the plug-ins into this\
    \ method; all the paths make up String separated with a comma or a semicolon.\
    \ AssetManager becomes a superstar that has all the resources, including the HostApp\
