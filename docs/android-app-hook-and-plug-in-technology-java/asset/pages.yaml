  md: '# 364 Android App-Hook and Plug-In Technology


    10.6.3.1 Compiling SO*

    Android supports three types of CPU: x86-based, ARM-based, and MIPS-

    based. In fact, there are a few devices based on x86 or mips. Nearly all the

    Android devices use ARM.


    Now we only talk about ARM, which is divided into 32-bits and 64-bits:


    +   - armeabi-armeabi-v7a: This is mainly used on Android 4.0 and higher

    versions. The CPU of the phone must be 32-bits. However, armeabi is

    a very old version; it is obsolete.

    - arm64-v8: This is mainly used for Android 5.0 and higher versions.

    The CPU of the phone must be 64-bits.


    Usually, we generate multiple SO files according to the CPU types and

    put them under the folder jlibs of the project, shown in Figure 10.19.


    ![](img/b7249be733b166b559267ab5ad055b72_390_0.png)


    Figure 10.19 Jnlibs, containing different SO files.


    Actually, we don''t need to prepare so many SO files. ARM is downward-

    compatible, for example, SO compiled in 32-bits can run normally on

    the 64-bits system.


    Android starts one virtual machine (VM) for each app. When the

    Android 64-bit systems loads 32-bits SO or app, it will start two VM; one

    is 64-bits, the other is 32-bits.


    So, it is enough to keep only one SO file to support armeabi-v7a in an

    app. 64-bit systems will load it on the 32-bit VM. It reduces the

    size of the app. Refer to the demo MySO.1 in detail.


    > * For demo codes, refer to https://github.com/Baobaojianqiang/MySO.1'
  merge: -1
  pgno: 390
- img_proc: true
  md: '# Related Plug-In Techniques ■ 365


    10.6.3.2 The Process of Loading SO

    Let''s have a look at the whole process of loading the SO.

    If the CPU is 64-bits, we can use the following command to check CPUs current
    phone supports. Take my phone; for example, it supports three types of SO, arm64-v8a,
    armeabi-v7a, and armeabi (Figure 10.20).


    ```

    baobao:~ jianqian$ abd shell

    [helium]:$ get prop.product.cpu.abilistarm64-v8a,armeabi-v7a,armeabi

    ```


    Figure 10.20 Check how many types of SO are supported in the current mobile phone.


    All these types are stored in a sorted collection abiList.

    Iterate the Jnlibis in sequence. For example, the first one is arm64-v8a. If there
    is a subfolder Arm64-V8a in the folder Jnlibis and there are SO files in the subfolder
    Arm64-V7a, then the Android system will load all the SO files in the subfolder
    Arm64-V8a.


    For example, on my Android, there is an SO file a.so in the subfolder Arm64-V8a,
    and there are two SO files a.so and b.so in the subfolder Armabi-V7a; my Android
    phone will load a.so in the subfolder Arm64-V8a, but the phone won''t load b.so
    forever. It depends on the SO loading mechanism in the Android system.


    To reduce the size, keep only one SO file, which is in the subfolder Armabi-V7a.


    32-bits ARM phones load the SO files in armeabi-v7a.

    If we want to load 32-bit SO in a 64-bits ARM phone, we must put all the SO files
    in the subfolder Armabi-V7a. We can''t put any SO files in the subfolder Arm64-V8a.


    10.6.3.3 Two Ways to Load SO*

    There are two methods to load SO:


    One way is to use System.loadLibrary(). It loads SO in the folder Jnlibis. For
    example, if we want to load libhello.so, we should write the following code:


    ```

    System.loadLibrary("hello");

    ```


    Another way is to use System.load(). It can load SO in any location. The parameter
    of this method is the full path of the SO file.


    > * For demo codes, go to https://github.com/Baobaojianqi/MySO2'
