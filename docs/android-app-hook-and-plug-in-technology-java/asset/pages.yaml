    # 2.2 BINDER


    Binder is used for cross-process communication.


    There are too many articles about Binder, and each article introduces knowledge
    from the Java layer to the C++ layer. But this is not helpful for app developers.
    I want to introduce Binder without code implementation in this section.


    +   1 Binder is divided into two processes, Client and Server.


    Client and Server are relative. Whoever sends the message will be the Client.
    Whoever receives the message will be the Server.


    For example, two processes A and B; they use Binder to communicate with each other,
    A sends a message to B, at this time A is the Binder Client, B is the Binder Server;
    then B sends a message to A, at this time B is the Binder Client, A is the Binder
    Server.


    +   2 Figure 2.1 shows the basic architecture of Binder.


    In Figure 2.1, ServiceManager is a container, and Binder Server and Binder Client
    are both registered in this container. Binder Driver is responsible for the communication
    between Binder Server and Binder Client.


    ServiceManager is like a telephone exchange. A telephone exchange has an address
    book to store the telephone numbers for each person. When


