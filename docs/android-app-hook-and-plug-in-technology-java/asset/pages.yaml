  md: '# 308 Android App-Hook and Plug-In Technology


    Later, Gradle was widely used in Android packaging: the packaging process was
    simplified to a simple configuration file in Gradle. Some people are familiar
    with Gradle, but they don''t know the commands like aapt or zipalign.


    Figure 10.1 shows the whole process of Android app packaging. Let''s introduce
    these steps by one:


    +   1) aapt. Generate two files, R.java corresponds to the resources in the folder
    Res, Manifest.java corresponds to the AndroidManifest.xml.

    2) AIDL. Generate a Java file for each AIDL file written by the developers into
    the app.

    3) javac. Compile the Java code to generate a lot of .class files.

    4) Proguard. Obfuse code and generate a mapping.txt. This step is optional.

    5) dex. Convert all the .class files into dex files.

    6) aapt. Package the resources in the folder Res and the files in the folder Assets
    into a zip file with the suffix .ap_. This is another important feature of the
    command aapt.

    7) apkbuilder. Package the dex files, the files with the suffix .ap_, and the
    AndroidManifest.xml into an apk file, which is unsigned.

    8) jarsigner. Signature this unsigned apk file.

    9) zipalign. Execute this command to reduce the usage of the memory runtime.


    In these nine steps, we focus on the first step, the generation of the R.java.
    We can control the generation process of the resource ID.


