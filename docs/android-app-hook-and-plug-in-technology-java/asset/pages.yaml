  md: '# 216 ■ Android App-Hook and Plug-In Technology


    Activity is different from the other three components. It is widely used in apps.
    Activity interacts with the app user directly, and it has three important features,
    as follows:


    +   * More lifecycle functions

    * LaunchMode

    * Resources


    We need to support these three features of Activity in the plug-in.


    # 8.3 THE PLUG-IN SOLUTION FOR SERVICE


    Service is an Android component running in a background process. There are two
    forms of launching a Service: startActivity() and bindService(). We must support
    these two mechanisms with plug-in techniques.


    8.3.1 The Relationship Between Service and Activity

    In Section 2.7, we have introduced the family of Context. Service are both descendants
    of Context. There are many similarities between Activity and Service; for example,
    both of them start with the help of Context and communicate with the AMS, and
    then the AMS notifies which app component to launch, and forwards the message
    through ActivityThread and H (Figure 8.4).


    ![](img/b7249be733b166b559267ab5ad055b72_242_0.png)


    FIGURE 8.4 The family of Context.'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# The Plug-In Solution of Four Components ■ 217


    There are also some differences between Activity and Service, let''s have a look:


    +   1) Activity is user-oriented; it has a lot of lifecycle methods; Service runs
    as a background process and has fewer lifecycle methods.


    +   2) Activity has an important feature LaunchMode; there is a stack to store
    all the Activities. When we create a new Activity, it will be put on the top of
    the stack. The default value of LaunchMode is standard. If we create the instances
    of the same Activity many times, all the instances of this Activity will be put
    on top of the stack. That''s why we use StubActivity to cheat the AMS in plug-in
    programming. But Service does not support LaunchMode. When we invoke the method
    startService() of the same Service many times, only one instance of Service is
    generated. So, if we use StubService to cheat the AMS, it does not support Services
    in the plug-in.


    +   3) ActivityThread uses Instrumentation to launch an Activity. Instrumentation
    is not used for a Service.


    There are two forms of starting a Service:


    +   1) startService()

    2) bindService()


    The differences between these two forms are that the method start() and the corresponding
    method stopService() are only used to start and stop a Service. For example, in
    a music app, we define a Service. We click the play button to notify the Service
    to execute the method startService() in the background processes to play the music.


    When the method bindService() is executed, an instance of ServiceConnection will
    be sent to the AMS. The AMS will send a Binder object to the app; this object
    exists in the second parameter of the callback method onServiceConnected() of
    the ServiceConnection.'
