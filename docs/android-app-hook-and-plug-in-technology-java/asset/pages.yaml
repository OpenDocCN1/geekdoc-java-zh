  md: '# Related Plug-In Techniques ■ 327


    Is there a mechanism that each Activity in the app has a corresponding HTML5 page?
    When there is a bug or crash in one Activity, can we replace this Activity with
    an HTML5 page immediately?


    There are two problems to resolve here.


    +   1) The original behavior is to click the button to jump from ActivityA to
    ActivityB, if we replace ActivityA with an HTML page named page_a.html, when we
    click the hyperlink in page_a.html, we expect the behavior to be the same as before,
    and to jump to ActivityB.


    +   2) We find the navigation from ActivityA to ActivityB is as follows:


    ```

    intent intent = new Intent(MainActivity.this,

    FirstActivity.class);

    intent.putExtra("Username", "jianqiang");

    intent.putExtra("Age", 10);

    startActivity(intent);

    ```


    But we find the navigation from ActivityA to an HTML page page_a.html is different.
    ActivityA cannot navigate to an HTML page directly. We create WebViewActivity
    to load this HTML5 page, and navigate from ActivityA to this WebViewActivity,
    shown as follows:


    ```

    intent intent = new Intent(MainActivity.this,

    WebViewActivity.class);

    newIntent.putExtra("FULLURL",

    "file://storage/emulated/0/myHTML5/thirdpage.html?a=l-b-abc=");

    startActivity(intent);

    ```


    How to switch between Activity and HTML5 freely without writing two methods? The
    best solution is for the app developers to write code as usual; for example, they
    write the code "startActivity(intent)" to navigate the page from one Activity
    to another Activity. They don''t care whether the next page is an Activity or
    HTML at runtime. We can override the methods startActivity or startActivityForResult()
    of Activity to decide if the next page is an Activity or HTML. We prepare a configuration
    file. This file specifies whether each page is an Activity or HTML. The app will
    download this file from the remote server. If the original Activity has a bug
    or crash, we can add a configuration in this file to specify which HTML5 page
    will replace this Activity.'
