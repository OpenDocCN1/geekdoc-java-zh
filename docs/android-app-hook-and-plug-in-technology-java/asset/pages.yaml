  md: "# 368 ■ Android App-Hook and Plug-In Technology\n\n10.6.3.4 The Relationship\
    \ between ClassLoader and SO\nIn Chapter 6, we used DexClassLoader to load classes\
    \ of plug-ins, shown as follows:\n\n```\nFile extractFile = this.getFileStreamPath(apkName);\n\
    depath = extractFile.getPath();\n\nfileRelease = getDir(\"dex\", 0); //0 For Context.\n\
    MODE_PRIVATE\n\nclassLoader = new DexClassLoader(depath,\nfileRelease.getAbsolutePath(),\
    \ null,\ngetClassLoader());\n```\n\nWe always set the third parameter of the constructor\
    \ of DexClassLoader to null. This parameter is the absolute path of the SO file.\n\
    \n10.6.4 A Plug-In Solution Based on System.load()**\nThere are two solutions\
    \ for downloading SO dynamically. This section will introduce the first solution.\n\
    \nIn the first-plugin, the HostApp creates a DexClassLoader for each plug-in to\
    \ parse classes of the plug-in. We can also get the path of each plug-in. We join\
    \ these paths into a new string separated by commas. We can set this string as\
    \ the third parameter of the constructor of DexLoader. So, all the files in the\
    \ HostApp and plug-in will “enjoy the same treatment”. We use the method System.loadLibrary()\
    \ to load these SO files.\n\nFigure 10.21 shows the project structure of MySO.\n\
