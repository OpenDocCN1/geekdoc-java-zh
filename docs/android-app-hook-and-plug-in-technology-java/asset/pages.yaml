    # 9.1.2.1 Jump from the HostApp to the Plug-In


    In the HostApp, ProxyActivity is a proxy for all the Activities of the plug-in.
    We can use ProxyActivity with different parameters to open any Activity of the
    plug-in.


    For example, if we want to jump to the MainActivity of the plug-in, the code is
    as follows:


    ```

    intent intent = new Intent("jianqiang.com.hostapp.VIEW");

    ent.putExtra(ProxyActivity.EXTRA_DEX_PATH,mPluginItems.get(position).pluginPath);

    intent.putExtra(ProxyActivity.EXTRA_CLASS,mPluginItems.get(position).packageName
    + ".MainActivity");

    startActivity(intent);

    ```


    The above intent carries two parameters:


    +   1) EXTRA_DEX_PATH, the path of the dex in the plug-in.

    2) EXTRA_CLASS, the full name of the Activity in the plug-in (packageName + className).'
