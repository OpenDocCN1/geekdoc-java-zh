    # 8.5 A PLUG-IN SOLUTION FOR CONTENTPROVIDER


    This section introduces a plug-in solution for ContentProvider.

    Some developers may not be familiar with ContentProvider because it''s not widely
    used in apps. Actually, it''s only used in special scenarios. For example, when
    an app reads the address book.


    # 8.5.1 The Basic Concept of ContentProvider


    ContentProvider is used to provide a large amount of data.

    ContentProvider is not widely used in apps.

    ContentProvider is widely used in the custom Android ROM such as MIUI. The communication
    between different components always uses ContentProvider to transport large amounts
    of data.

    ContentProvider is an SQLite database, which is divided into data provider and
    data user. They transmit data via Anonymous Shared Memory (ASM). For example,
    there is a data provider named A, and a data user named B. B asks A for data and
    tells A “you can write the data in this memory address”; A prepares the data,
    writes in the memory address required by B, and then B can use this data directly.
    ASM is different from traditional data transmission; it''s suitable for transmitting
    large amounts of data.

    However, ContentProvider is not suitable in all scenarios, for example, when the
    app jumps from ActivityA to ActivityB and transfers some data, and the data is
    too small, such as a string or an integer. The data transmission is based on Binder,
    and Binder communicates quickly with the data.

    It is necessary to use ContentProvider when the data is more than 1M; otherwise,
    Binder is enough.


    # 8.5.2 A Simple Example of ContentProvider*


    Let''s write an example to help us understand ContentProvider. There are two apps,
    A1 and B1:

    There is a ContentProvider defined in B1 to provide data, and A1 calls the ContentProvider
    of B1 to obtain data.

    The ContentProvider declared in B1:


    ```

    <provider

    android:name="MyContentProvider"

    ```


