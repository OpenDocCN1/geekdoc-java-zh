  md: "# Related Plug-In Techniques ■ 393\n\n10.8.2 Compatibility with Android P\n\
    \nThe impact of Android P on plug-ins is mainly in two aspects. One is the modification\
    \ of the class H, and the other is the modification of the class Instrumentation.\n\
    \n# 10.8.2.1 The Modification of the Class H\n\n# 10.8.2.1.1 Starting from Message\
    \ and Handler\n\nAndroid developers are familiar with two classes: Message and\
    \ Handler. Let's have a review of how to send or receive a message in the Android\
    \ system.\n\nWhen the Android system starts a new process, it will create ActivityThread\
    \ at first; ActivityThread is the main thread and is also called the UI thread.\
    \ The function main() of the app doesn't exist in the app itself; it is \"hidden\"\
    \ in ActivityThread,\n\nIn the function main(), MainLoop is created. MainLoop\
    \ is an endless loop that is responsible for receiving messages.\n\nThe class\
    \ Message is defined as follows. It has three fields, what and obj is open to\
    \ app developers, but target is a private field, and it's a Handler object.\n\n\
    ```\npublic final class Message implements Parcelable {\n    public int what;\n\
    \    public Object obj;\n    Handler target;\n\n//ignore some code\n}\n```\n\n\
    In the app process, each lifecycle method of the Application and the four components\
    \ communicates with the AMS process, as follows:\n\n+   - The app process passes\
    \ the data to the AMS process by AMN.\n- The AMS process passes the data to the\
    \ app process and the app uses ApplicationThread to receive the data from the\
    \ AMS.\n\nApplicationThread invokes the method sendMessage() after it receives\
    \ data. The method sendMessage() will send a message to the endless loop of MainLoop."
