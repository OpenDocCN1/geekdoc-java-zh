  md: '# Summary of Plug-In Technology


    IN THE PREVIOUS CHAPTERS, we introduced the history of plug-in technology, different
    plug-in solutions, and a lot of well-known plug-in frameworks.


    We''ll review all these concepts and techniques in this summary chapter.


    # 11.1 PLUG-IN ENGINEERING


    There are always more than three projects in the plug-in: HostApp, MyPluginLibrary,
    Plugin1, and perhaps other plug-in projects.


    The HostApp and the plug-in app all depend on MyPluginLibrary. Chapter 6 describes
    how to create one solution with all the three projects in Android Studio; we can
    debug from the HostApp to Plugin1 or MyPluginLibrary.


    Refer to Section 10.4 for plug-in signing and obfuscation.


    Refer to Section 10.5 for incremental updates using plug-ins.


    # 11.2 CLASS LOADING IN THE PLUG-IN


    It is impossible to use the ClassLoader of the HostApp to load the classes of
    Plugin1. We have three solutions to load classes from Plugin1:


    +   1) Use the ClassLoader of Plugin1 to load classes from Plugin1. Refer to Chapter
    6.'
  merge: -1
  pgno: 431
- img_proc: true
  md: '# Android App-Hook and Plug-In Technology


    2) The app stores its dexes in an array. We combine all the dex of all the plug-ins
    in the dex array of the HostApp. This means the ClassLoader of the HostApp can
    load any class whether this class in the HostApp or the plug-in. Refer to Section
    8.2.3.


    3) Write a custom ClassLoader to replace the original ClassLoader of the HostApp.
    In this custom ClassLoader, declare a collection to store all the ClassLoaders
    of the HostApp and the plug-ins. If we use this custom ClassLoader to load each
    one, it will traverse each ClassLoader stored in the collection to check which
    ClassLoader can load that particular class. Refer to Section 8.2.6.


    # 11.3 WHICH CLASS OR INTERFACE CAN BE HOOKED?


    "Once la starts, it can never be stopped. You need to continuously patch it up."


    We always use this phrase to describe the DroidPlugin framework. DroidPlugin can
    hook nearly all the classes of the Android system.


    Refer to Chapter 5 for more information about hooking technology. It''s easy to
    identify which class we can hook, shown as follows:


    +   1) Classes which are open to the app developers


    Most of the classes and methods the classes which are open to app developers are
    not open to app developers. If we want to use them, we must use reflection. We
    can''t hook these classes or methods.


    We can only hook the classes which are open to app developers. For example, we
    can hook Instrumentation and Callback, but we can''t hook H.


    We can create a class named EvilInstrumentation, which inherits Instrumentation;
    we can use an instance of EvilInstrumentation to replace the original instance
    of Instrumentation.


    +   2) Classes which implement the interface


    If one class implements an interface, we can use Proxy.newProxyInstance() to intercept
    the methods of this class. For example, ActivityManagerNative implements the interface
    IActivityManager, so we can hook ActivityManagerNative.


    Another interface introduced in this book is IPackageManager.


    +   3) Collection'
  merge: -1
  pgno: 432
- img_proc: true
  md: '# Summary of Plug-In Technology ■ 407


    Most of the classes and methods are not open to app developers, but if there is
    a collection field in the class we can add an element to this collection using
    reflection.


    A typical example is to create a LoadedApk object and put it into the cache "in
    advance," as shown in Section 8.2.2.


    # 11.4 A PLUG-IN SOLUTION FOR ACTIVITY


    Generally, plug-in solutions can be divided into Dynamic-Proxy and Static-Proxy.


    +   1) Dynamic-Proxy is referred to in Section 8.2. Create an empty StubActivity
    as a placeholder. Start ActivityA of the plug-in but tell the AMS to start StubActivity.
    After cheating the AMS successfully, change the StubActivity to ActivityA. We
    need to hook a lot of classes to finish this mechanism.


    +   2) Static-Proxy is referred to in Chapter 9. Create a ProxyActivity in the
    HostApp that determines Activity of plug-in to launch. The Activities of the plug-in
    don''t have a lifecycle, so in the lifecycle method of ProxyActivity, we invoke
    the corresponding lifecycle method of the plug-in.


    In addition, we need to support the LaunchMode of the Activity of the plug-in.
    Refer to Section 8.2.5 and 9.1.7


    To launch the Activity from the plug-in, we also need to load the resources of
    the Activity of the plug-in. Let''s review this technique in Section 11.5.


    # 11.5 A PLUG-IN SOLUTION FOR RESOURCES


    Resources are only used in an Activity.


    The app loads the resources with the method addAssetPath(String dex) of AssetManager;
    the parameter dexPath is the location of the apk.


    In the HostApp, the original AssetManager can only load the resources of the HostApp,
    and can''t load the resources of Plugin1. We have two solutions for this limitation:


    +   1) When we navigate from the HostApp to Plugin1, we create a new AssetManager
    to load the resources of Plugin1.'
  merge: -1
  pgno: 433
- img_proc: true
  md: 'When we jump Plugin1 to the HostApp, we switch to the original

    AssetManager to load resources from the HostApp.

    Refer to Chapter 7 for the implementation of this solution.


    +   2) In the HostApp, invoke the method AssetImage(String dexPath)

    of AssetManager. If there are three plug-ins, we need to invoke this

    method three times. We set the parameter dexPath to the path of

    Plugin1, Plugin2, and Plugin3. After we invoke this method three

    times, the resources of the HostApp will contain all the resources,

    including from the HostApp, Plugin1, Plugin2, and Plugin3.


    We need to store all these resources in a global variable so that the HostApp

    plug-ins can visit them.

    Refer to Section 9.1.4 for the implementation of this solution.


    In solution 2, we need to merge the resource IDs of the HostApp and all

    plug-ins. But the value of the resource ID of the HostApp may conflict

    with the value of the resource ID of the plug-in. We have two solutions to

    resolve this issue:


    +   1) Modify the command aapt by adding a new argument for this com-\mand to
    specify the PackageId of the resource ID, such as 0x71. Refer

    to Section 10.1.2.


    +   2) Hook the packaging process. After the command aapt is executed,

    the file R.java and resources.arc are generated. We can modify these

    two files to replace the PackageId of the resource ID with 0x71. Refer

    to Section 10.7 for details.


    # 11.6 USE FRAGMENT IN THE PLUG-IN


    I Once confused the differences between Fragment and Activity.

    The biggest difference is that Activity needs to communicate with the

    AMS frequently, but Fragment doesn''t need to do that. The Fragment is

    just like a CustomView that lives in the Activity.


    Because Fragment needn''t need to communicate with the AMS, we needn''t

    declare Fragment in the AndroidManifest.xml. Thus we have a new plug-

    in to write only one Activity in the app. All the pages are imple-

    mented by Fragment. This one Activity hosts all the Fragments, whether

    t Fragment comes from the HostApp or the plug-in.


    For the plug-in solution based on Fragment refer to Section 10.2.'
  merge: -1
  pgno: 434
- img_proc: true
  md: '# Summary of Plug-In Technology ■ 409


    # 11.7 PLUG-IN SOLUTIONS FOR SERVICE, CONTENTPROVIDER, AND BROADCASTRECEIVER


    The number of components in the app, including Service, ContentProvider, and BroadcastReceiver,
    is almost less than ten; we don''t need add a new component of a plug-in dynamically.
    So, we can declare these components in the AndroidManifest.xml in advance. Refer
    to Section 8.1.1.


    The disadvantage of this solution is that we can''t add a new component dynamically.
    However, we can handle these problems with the following solutions.


    # 11.7.1 A Plug-In Solution for Service


    There are three different plug-in solutions for Service:


    +   1) Dynamic-Proxy. Service is different from Activity; we can declare one Activity
    in the AndroidManifest.xml of the HostApp to correspond to multiple Activities
    of the plug-ins. However, if we declare one StubService in the AndroidManifest.xml
    of the HostApp, it only corresponds to one Service of the plug-in. So, we need
    to pre-declare multiple StubServices to correspond to the multiple Services of
    the plug-ins. Refer to Section 8.1.3 for details.


    +   2) Static-Proxy. Create ProxyService in the HostApp. We can use ProxyService
    to launch the Service of the plug-in. But one ProxyService can''t correspond to
    multiple Services. So we should pre-declare multiple ProxyServices. Refer to Section
    9.2.1, 14.2 and 14.3.


    +   3) The last solution is to declare one StubService to correspond to multiple
    Services of the plug-in. Refer to Section 9.2.4 for details.


    # 11.7.2 A Plug-In Solution for BroadcastReceiver


    BroadcastReceiver has two types: Dynamic Receiver and Static Receiver. Dynamic
    Receiver is simple. It''s only a simple class that has one method onReceive().
    We can use ClassLoader to easily load Dynamic Receiver by reflection.


    Static Receiver is different from Dynamic Receiver. We must declare Static Receiver
    in the AndroidManifest.xml. We can send a broadcast to the Static Receiver; even
    if the app is not launched.


    We have a lot of plug-in solutions to support Static Receiver.'
  merge: -1
  pgno: 435
- img_proc: true
  md: '# 410 Android App-Hook and Plug-In Technology


    +   1) The simplest plug-in solution for a Static Receiver is to transform the
    Static Receiver of the plug-in to a Dynamic Receiver registered in the HostApp.
    The disadvantage of this solution is that we can''t use the features of the Static
    Receiver. If the app is not launched, we can send a broadcast to the Static Receiver
    of plug-in. Refer to Section 8.4.3 for details.


    +   2) Static-Proxy. We declare a ProxyReceiver in the HostApp; it''s responsible
    for dispatching the broadcast to the corresponding Static Receiver of the plug-in.
    Refer to Section 9.2.5 for details. This solution has the same disadvantage in
    that we can''t use the features of the Static Receiver.


    +   3) Dynamic-Hook. Declare one StubReceiver with multiple Actions in the AndroidManifest.xml
    of the HostApp. Each Action of the StubReceiver corresponds to a Static Receiver
    in the plug-in. In the method onReceive(StubReceiver), it dispatches the broadcast
    to the corresponding Static Receiver of the plug-in. Refer to Section 8.4.4 for
    details.


    # 11.7.3 A Plug-In Solution for ContentProvider


    ContentProvider is the engine of the SQLite. It provides CRUD methods for app
    developers.


    In the plug-in solution for ContentProvider, we can pre-declare a StubContentProvider
    to cheat the AMS. StubContentProvider is open to the user. When the third-party
    user invokes the CRUD methods of the StubContentProvider, StubContentProvider
    will dispatch the request to the corresponding ContentProvider of the plug-in.
    Refer to Section 8.1.5 for details.


    # 11.8 SUMMARY


    In the last chapter of this book, we reviewed all the technologies involved in
    plug-ins, and we hope that readers can master this technique.'
