  md: "# A Plug-In Solution Based on Static-Proxy ■ 253\n\n```\ntry {\n    Method\
    \ method = localClass.\n    getDeclaredMethod(methodName, new Class[] { { } });\n\
    \    method.setAccessible(true);\n    method.invoke(mRemoteActivity, new Object[]\
    \ { e });\n} catch (Exception e) {\n    e.printStackTrace();\n}\n```\n\nThere,\
    \ there is a performance issue in the code above. The method onDestroy() will\
    \ be invoked multiple times, and the reflection will be invoked many times. To\
    \ optimize performance, we store the method object in a dictionary. When we want\
    \ to invoke the method onResume(), we fetch the method object from the dictionary,\
    \ and then call the invoke() method of lifecycle.\n\nThere are many methods of\
    \ Activity, as onCreate(), onRestart(), onStart(), onPause(), onStop(), and onDestroy().\
    \ All the methods can follow route to improve performance. We encapsulate this\
    \ logic into the instantiateLifecycleMethods(), as follows:\n\n```\nprotected\
    \ void instantiateLifecycleMethods(Class<?>> localClass) {\n    String[] methodNames\
    \ = new String[] {\n        \"onRestart\",\n        \"onStart\",\n        \"onResume\"\
    ,\n        \"onPause\",\n        \"onStop\",\n        \"onDestroy\"\n    };\n\
    \    for (String methodName : methodNames) {\n        Method method = null;\n\
    \        try {\n            method = localClass.getDeclaredMethod(methodName,\
    \ new Class[] { } });\n            method.setAccessible(true);\n        } catch\
    \ (NoSuchMethodException e) {\n            e.printStackTrace();\n        }\n \
    \   }\n```"
