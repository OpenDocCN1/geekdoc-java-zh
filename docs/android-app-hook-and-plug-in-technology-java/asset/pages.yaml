  md: '# Proxy Pattern


    TO UNDERSTAND WHAT a plug-in is, we must first look at the proxy pattern, which
    is one of 23 software design patterns. There are two ways to implement a proxy
    pattern, one is Static-Proxy, and the other is Dynamic-Proxy. In plug-in technology,
    these two patterns are applied to hook Instrumentation and AMN. I will introduce
    them in detail in this chapter.


    # 4.1 WHAT IS A PROXY PATTERN?


    Proxy patterns appear everywhere in our software projects. Every class with the
    suffix "Proxy" usually makes use of the proxy pattern, such as ActivityManagerProxy


    The definition of a proxy pattern in GOF23 is: a wrapper or agent object that
    is called by the client to access the real serving object behind the scenes. A
    UML diagram of the proxy pattern is shown in Figure 4.1.


    ![](img/b7249be733b166b559267ab5ad055b72_131_0.png)


    FIGURE 4.1 Class diagram of a proxy pattern.'
