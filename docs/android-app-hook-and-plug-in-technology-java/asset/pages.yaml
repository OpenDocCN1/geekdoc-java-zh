    # 8.4 A PLUG-IN SOLUTION FOR BROADCASTRECEIVER


    Receiver (for short in this book) is the simplest component in Android. It is
    a class that implements the design pattern Observer.


    We have introduced the principle of Receiver in detail in Chapter 2. We talk about
    the plug-in solutions for the Receiver in this section. The Receiver is divided
    into two kinds: Dynamic Receiver and Static Receiver, the implementations of these
    two kinds are different.


    # 8.4.1 Receiver Overview


    The Receiver is divided into two kinds: Static Receiver and Dynamic Receiver.
    Let''s have a look at the differences between them briefly:


    +   1) Static Receiver must be declared in the AndroidManifest.xml. The PMS will
    parse the AndroidManifest.xml of the app after the user downloads and installs
    an app; this means all the Static Receivers exist in PMS.


    +   2) Dynamic Receiver is registered by the app developer in the code; the method
    registerReceiver() of Context calls the method AMN.get.().registerReceiver, so
    all the Dynamic Receivers exist in the AMS.


    The only difference between Static Receiver and Dynamic Receiver is the registration
    mechanism discussed above. Static Receiver and Dynamic Receiver have the same
    format for sending and receiving broadcasts.'
