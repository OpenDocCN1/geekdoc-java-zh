  md: '# 268 Android App-Hook and Plug-In Technology


    2) LaunchMode has four values


    Android apps have an Activity stack, and each time the app launches an Activity
    it will put this on top of the stack. According to the different usage of the
    stack, LaunchMode has four values, standard, singleTop, singleTask, and singleInstance,
    shown as follows:


    +   - standard, the default mode. Each time the app launches, it will create a
    new instance of this Activity. Even if the app jumps from Activity1 to Activity1,
    because the LaunchMode of Activity1 is standard there are two instances of Activity1
    in the stack.


    Activity is widely used in apps. There are hundreds of Activities in the app.
    Almost all the Activities have the same LaunchMode: standard.


    Let’s introduce another scenario based on LaunchMode: Push. A news app always
    sends push messages to the users; when the user clicks on the push message, the
    app will navigate to a DetailActivity to show the detail of the news. If we set
    the LaunchMode of DetailActivity to standard, when the user receives ten push
    messages from this news app he clicks each message and opens DetailActivity ten
    times to see the different news items. But he also needs to click times to get
    back to the original Activity.


    Obviously, standard is not suitable for this scenario. We want to click once to
    get back to the original Activity.


    +   - singleTop. If the current page is Activity1 (at the top of the stack), let’s
    navigate to Activity1, because the LaunchMode of Activity1 is singleTop, the instance
    of Activity1 at the top of the stack will be used directly, instead of creating
    a new instance.


    We find that singleTop is suitable for the push message.


    +   - singleTask. If we want to open Activity1, and there is an instance of Activity1
    in the stack, because the LaunchMode of Activity1 is singleTask, this instance
    will be used. At the same time, all the instances in the stack, from this instance
    to the top Activity, will be destroyed, which means that this instance will be
    the top of the Activity stack.


    singleTask is generally used to jump back to the home page of the app. The instance
    of the home page is only one.'
