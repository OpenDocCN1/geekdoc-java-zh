    # 2.6 NAVIGATION IN APP


    Navigation from ActivityA to ActivityB are running in the same process, the whole
    process is the same as the mechanism introduced in Section 2.5.


    If ActivityA and ActivityB are in the same process, the whole process will be
    simpler, because the AMS doesn''t need to create a new process for ActivityB.
    There is a total of five steps in this process, as follows:


    +   1) ActivityA sends a message to the AMS, "I want to launch ActivityB."


    +   2) AMS saves the information of ActivityB, and then informs the app, "Got
    it."


    +   3) ActivityA invokes its method onPause(), and informs the AMS, "I''m sleeping."


    +   4) The AMS finds that ActivityA and ActivityB are in the same process, and
    the AMS notifies the app to launch ActivityB directly.


    +   5) The app launches ActivityB.


    Refer to Figure 2.12 for details.'
