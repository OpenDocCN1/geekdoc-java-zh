  md: "# 342 Android App-Hook and Plug-In Technology\n\n+   - Class in android.support.v4\
    \ and android.support.v7 cannot be obfuscated.\n\n+   - A class that implements\
    \ Serializable cannot be obfuscated; otherwise, it will throw an exception in\
    \ deserialize.\n\n+   - Generics cannot be obfuscated.\n\n+   - CustomView cannot\
    \ be obfuscated; otherwise, we can't find this CustomView in the layout.\n\nThese\
    \ rules can also be applied to plug-ins, because the plug-in is also an apk. We\
    \ don't need to declare four components in the AndroidManifest.xml of the plug-in,\
    \ we still get these components from the plug-in using the reflection of their\
    \ full name.\n\nSometimes, the HostApp may invoke a method in the plug-in by reflection,\
    \ shown as follows:\n\n```\nClass mLoadClass = classLoader.loadClass(\"jianqiang.com.receivertest.MainActivity\"\
    );\nObject mainActivity = mLoadClass.newInstance();\n```\n\n```\nMethod methodName\
    \ = mLoadClass.getMethod(\"doSomething\").setAccessible(true)\nString name = (String)\
    \ methodName.invoke(mainActivity);\n```\n\nRun these codes above and the app will\
    \ throw an exception that the method doSomething() of MainActivity is not found\
    \ because it's obfuscated.\n\nSo, we could obfusc the classes or the methods invoked\
    \ by reflection in Plug-In, we need to add a configuration in Proguard-rules:\n\
    \n```\n-keep class jianqiang.com.receivertest.MainActivity {\n  public void doSomething();\n\
    }\n```\n\n# 10.4.2 Obfuse Without a Common Library\\*\n\nHostApp and the plug-in\
    \ always use the same class library, shown in Figure 10.6.\n\n* Code sample: https://github.com/Baobaojianqiang/ZeusStudy1.5"
