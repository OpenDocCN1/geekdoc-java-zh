    # 10.1 RESOLVE THE CONFLICTS BETWEEN RESOURCES OF THE PLUG-INS


    We have already introduced how to load Resources from the plug-in in Chapter 7.


    Each resource has an ID in R.java, such as 0x7f00010002. Because the HostApp and
    plug-in are packaged separately, the ID value in the HostApp may be the same as
    the ID value of plug-in. In this scenario, the app can''t load the correct resource


    We''ll resolve this problem of ID conflict in this section. Let us focus on the
    command aapt during the packaging process.


    # 10.1.1 The Process of App Packaging


    Before 2014, the packaging of an Android app was based on Ant, and we needed to
    know each step of the packaging process, including which command was executed,
    and which parameters were required for this command.'
