  md: "# 330 Android App-Hook and Plug-In Technology\n\nAs the files are “downloaded\
    \ from the remote server,” we override the method startActivityForResult() of\
    \ BaseActivity to parse this configuration file.\n\nThe methods startActivity()\
    \ and startActivityResult() are widely used in app development. startActivity()\
    \ invokes startActivityForResult(implicitly). That’s why we override startActivityForResult()\
    \ rather than startActivity().\n\nThe logic of overriding the method startActivityForResult()\
    \ is as follows:\n\n+   1 Search in MyApplication.pages to check if we’ll launch\
    \ an Activity or an HTML5 page. If we want to launch an HTML5 page, we will create\
    \ a new intent to launch WebView, convert the parameters of the old intent to\
    \ a string with the format “urlk1=v1&k2=v2”. We need to encode v1 and v2 to a\
    \ new string, and parse the URL with the format “URL2json=str” to WebView.\n\n\
    We have downloaded a configuration file from the remote server. A JSON string.\
    \ There is a field “fields” defined in this JSON string. We can use the corresponding\
    \ Java syntax to take values from the Intent according to the type of each parameter\
    \ defined in “fields,” shown as follows:\n\n```\npublic class BaseActivity extends\
    \ Activity {\n    @Override\n    public void startActivityForResult(Intent intent,\n\
    int requestCode) {\n        if (intent.getComponent() == null) {\n           \
    \ super.startActivityForResult(intent,\n            requestCode);\n        }\n\
    \    }\n```\n\n```\nString originalTargetActivity = intent.\ngetComponent().getClassName();\n\
    ```\n\n```\nPageInfo pageInfo = MyApplication.pages.\nget(originalTargetActivity);\n\
    if (pageInfo == null) {\n    super.startActivityForResult(intent,\n    requestCode);\n\
    }\n```"
