    # 10.6 A PLUG-IN SOLUTION FOR SO FILES


    In this section, we will talk about SO files.

    During app development, Java code is not suitable, for example, for encryption
    algorithms or encoding and decoding of audio and video. We use C/C++ to implement
    these special scenarios, to generate a file with the file extension “so.” We always
    call it SO. In the Android system, we use System.load() or System.loadLibrary()
    to load a SO file.


    App developers always use SO by a third party; for example, in Section 10.5, we
    use libApkPatchLibrary.so for an incremental update.

    App developers rarely write SO, so, let’s start from how to write an SO in this
    section.


