  md: "# 348 Android App-Hook and Plug-In Technology\n\nIn the original Python script,\
    \ it will generate a class like ActivityA without its inner classes. We need to\
    \ consider how to generate these inner classes automatically. We find it impossible\
    \ to know how many inner classes there are a class in advance. We also find that\
    \ MultiDex does not support the wildcard *. We can't use * in maindexlist.txt.\n\
    \nA simple but rough method is to generate 100 inner classes for each class in\
    \ advance from ActivityA$1 to ActivityA$100. It's enough to use. Let modify collect.py\
    \ to support inner classes.\n\n```\nimport os\nfw = open('maindexlist.txt', 'w')\n\
    def dirlist(path):\n    filelist = os.listdir(path)\n    for filename in filelist:\n\
    \        filepath = os.path.join(path, filename)\n        if os.path.isdir(filepath):\n\
    \            dirlist(filepath)\n        elif len(filepath)>5 and filepath[-5:]=='.java':\n\
    \            baseStr = filepath.replace('src/main/java/', '')\n            replace('.java',\
    \ '')\n            fw.write(baseStr+'.class\\n')\n    #generate nested class\n\
    \    for index in range(1, 11):\n        fw.write(baseStr+'$' + str(index) + '.class\\\
    n')\nfw.close()\ndirlist(\"src/main/java\")\n```\n\nLet's compile and package\
    \ Plugin1; we will find that the original dex was separated into two dexes. classes.dex\
    \ has all the classes of Plugin1, and the classes of MyPluginLibrary are thrown\
    \ into classes2.dex. classes2.dex also has the classes of android.support,* shown\
    \ in Figures 10.8 and 10.9.\n\n![](img/b7249be733b166b559267ab5ad055b72_374_0.png)\n\
    \nFIGURE 10.8 classes.dex in JadxGUI."
