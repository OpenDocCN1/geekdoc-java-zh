    10.7.2.2 Function of aapt


    What does the command aapt do in the app packaging process? Refer to Figure 10.26
    for details.


    ![](img/b7249be733b166b559267ab5ad055b72_406_0.png)


    FIGURE 10.26 Generation after executing aapt.


    In Figure 10.26, there are three steps, shown as follows:


    +   1) Zip all the resources into a file.


    +   2) Generate the resource ID for each resource and save this 1:1 mapping between
    the resource ID and the file name in resources.arsc.


    +   3) Write resource ID for each resource in R.java.


    After the command aapt is executed, it will execute jacavac, which will compile
    all Java files into R.java.


    We can add our own logic after the command aapt has been executed and before the
    command jacavac has been executed.


    # 10.7.2.3 The Principle of Gradle-Small


    Let''s talk about the principle of Gradle-Small: reset the PackageId for each
    resource ID in R.java and resources.arsc.


    We also find there are lot of redundant resources in resources.arsc. It means
    the packages like AppCompat and Design are stored in resources.arsc. It means
    there are two plug-ins in the HostApp, the packages AppCompat and Design will
    have three duplicate copies.'
