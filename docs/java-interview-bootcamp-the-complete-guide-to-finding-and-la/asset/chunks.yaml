  trans: '


    *   颜色集合最适合放入 `set`（集合）中。元素没有顺序，且没有重复；你不能拥有两个“红色”（Red）！

    *   板球球队的击球顺序适合放在 `list`（列表）；你希望保留对象的顺序。

    *   网络会话（web sessions）集合最适合放在 `map`（映射）中；唯一的会话 ID 可以作为真实对象的良好键（key）或引用。


    理解为什么选择某种集合对于在面试中留下良好印象至关重要。我遇到过一些候选人进来告诉我，他们只是使用 `ArrayList` 和 `HashMap`，因为它们就是他们选择使用的默认实现。实际上实际上，这可能不是什么坏事。大多数时候，我们使用集合时，并没有重大的延迟或访问要求。这并不重要。然而，面试中向你问这些问题的人是想知道你是否理解底层的工作原理。


    ## Q：选择集合时，主要的考虑因素是什么？


    当你处理一个集合时，你关心的是速度，具体来说包括：


    *   访问速度

    *   添加新元素的速度

    *   删除元素的速度

    *   迭代速度


    除此之外，这不仅仅是“哪一个更快”的问题。还有一致性的问题。某些实现会保证访问速度，而另一些的速度则是可变的。这种速度如何决定取决于实现。重要的是理解不同集合实现之间的相对速度，以及它如何影响你的选择。


    ## 集合实现


    *   **Q：为什么我会选择 `LinkedList` 而不是 `ArrayList`？**

    *   **Q：`TreeSet` 还是 `HashSet` 哪个更快？**

    *   **Q：`LinkedList` 是如何工作的？**


    集合实现往往基于*链式*（Linked）、*树形*（Tree）或*哈希*（Hash）实现有整本教科书都是基于此，但你需要知道的是它如何影响你的集合选择。


    ### 链式实现


    **示例：`LinkedList`, `LinkedHashSet`** 在底层，每个项目都存储在一个“节点”（node）中。每个节点都有指向集合中下一个项目的指针，如下所示。


    ![](img/linkedlist.png)


    *这对速度意味着什么？*


    在链式连接中添加项目是非常快的，无论你在何处添加该节点。如果你有一个包含 3 个元素的列表，并想在位置 1 添加一个新元素，该操作仅仅是将位置 2 指向新元素，并将新元素指向旧的位置
    2。


    ![](img/new.png)


    这非常快！不需要复制集合，不需要移动物体，不需要重新排序。删除操作也是如此；只需将节点 0 指向节点 2，你就删除了节点 1。


    相反，访问对象时速度相对较慢。如果你有一个包含 1000 个元素的列表，而你想要第 999 个元素，你需要遍历每一个节点才能获取该元素。这也意味着访问速度是不一致的。访问元素
    1 比访问元素 1000 快。请记住，当添加新对象时，你必须先遍历到前一个节点，这会对速度产生一些影响。


    因此，像 `LinkedList` 这样的链式集合在你需要快速添加/删除且不太关注访问时间时是非常棒的。**如果你需要频繁从集合中添加/删除项目，那么这个就是你的选择**。


    ### 数组实现


    **示例：`ArrayList`** `ArrayList` 是集合类中唯一基于数组的实现，但经常用于与 `LinkedList` 进行比较，因此理解它非常重要。正如之前提到的，`ArrayList`
    由一个 `Array`（数组）支持。这具有有趣的含义。


    在 `ArrayList` 中间添加项目时，结构需要复制所有项目以便它们在数组中向下移动。这可能很慢，而且时间不是固定的（取决于需要复制多少元素）。


    ![](img/Add-Item-To-Arraylist-1024x540.png)


    删除对象时也是如此；它之后的所有对象引用都必须向前移动一个空间。有一种更糟糕的情况。在创建 `ArrayList` 时，它从一个固定长度的 `Array`
    开始（你可以在构造函数中设置其长度，默认为 10）。如果容量需要超过此值，集合必须创建一个长度更长的**全新的数组**，并将所有引用复制到其中，这可能非常慢。


    `ArrayList` 成功之处在于访问速度；由于数组位于连续内存中，这意味着如果你请求 1000 个对象中的第 999 个对象，你可以精确地计算出该引用内存内存中的位置，而无需遍历整个集合。这提供了常数时间访问，这种访问是**快速的**。


    所以，如果你有一组**极不可能发生显著修改的数据，并且你需要快速的读取访问**，`ArrayLists` 是一个极佳的选择。


    ### 哈希实现


    **示例：`HashSet`, `HashMap`** `HashMap` 本身就是一个复杂的体，作为面试题是一个很好的选择，因为它很容易扩展后续问题。


    *   **Q：`HashMap` 是如何工作的？**

    *   **Q：为什么键的 hashcode 那么重要？**

    *   **Q：如果两个对象具有相同的 HashCode 会发生什么？**

    *   **Q：如果发生冲突，`Map` 如何选择正确的对象？**


    有趣的是 `HashSet` 是由 `HashMap` 支持的，因此为了方便，我将讨论后者。`HashMap` 的工作原理如下：在底层，`HashMap`
    是一个数组（称为 Entry Table，默认为 16），对应一组 `LinkedLists`（称为桶 Buckets），`HashEntry` 存储其中。一个
    `HashEntry` 是一个包含键和关联的对象。


    ![](img/Empty-Hashmap-300x295.png)


    所有 `Object` 都有一个方法 `hashCode()`，它返回一个 `int`。hashcode 通常是根据属性产生的值。对象的 hashcode
    应该是一致的，相等的对象必须返回相同的 hashcode。该属性随后可以用于确定将其放入哪个桶，基于条表的索引；例如，在上述具有 4 个空间的示例中，如果有一个
    HashCode 为 12345 的键，我可以计算 12345 % 4 = 1，因此我们将把对象放在桶 1 中。


    这使得对象检索非常快。在我的示例中，如果我尝试检索键对应的对象，只需要执行相同的模运算来找到桶，它是第一个条目。异常快速。


    这可能会变得复杂。如果我有两个对象，HashCode 分别为“5”和“9”呢？它们的（模 4）都是 1，所以它们都会被放入桶 1。现在我使用我的“9”键来检索对象，`HashMap`
    必须遍历 `LinkedList`，对每个 `HashEntry` 的键调用 `.equals()` 方法。


    ![](img/HashMap-Retrieval.png)


    这很慢！幸运的是，这种情况不会经常发生。虽然冲突自然会发生，但意图是对象将均匀分布在条表中，冲突尽可能少。这依赖于良好的 hashcode 函数。为了进一步尝试减少这种可能性，每个
    `HashMap` 都有一个负载因子（默认为 0.75）。如果条表的填充程度超过了负载因子（例如如果条表超过 75% 有条目），那么类似于 `ArrayList`，`HashMap`
    将将条表的大小翻倍并重新排列条目。这被称为重哈（rehashing）。


    ### 树形实现


