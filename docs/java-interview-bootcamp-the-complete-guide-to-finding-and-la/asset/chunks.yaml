    \ is going to come down to whether the interviewer likes you and your attitude.\n\
    \n### Example Interview Process\n\nTo give you an idea of what to expect, here\
    \ are some example processes I’ve gone through before:\n\n*   **Major Australian\
    \ Bank**:\n\n    *   One on One Interview with team manager\n\n    *   Aptitude\
    \ test\n\n    *   2 hour technical interview; 1 hour face to face with local developer,\
    \ 1 hour with 2 developers over Video Conference\n\n    *   Interview With Department\
    \ Heads\n\n*   **Small Charity Firm**\n\n    *   Face to Face with future manager\
    \ and department head\n\n    *   HR Interview\n\n*   **Major International Bank**\n\
    \n    *   30 Minute phone interview\n\n    *   Pair Programming interview with\
    \ 2 developers\n\n    *   Group Grilling with 3 developers\n\n## Creating your\
    \ resume\n\nYou only get one opportunity for a first impression, From which point\
    \ it’s either working for you or against you. This applies across all media, from\
    \ websites (where you have 7 seconds to impress the visitor) to meeting a new\
    \ person at an interview (where you have even less). Getting off on the wrong\
    \ foot means you need to be incredibly impressive to stand a chance of landing\
    \ your new role, which whilst not impossible is certainly going to make a difficult\
    \ interview even harder. On the other hand if you arrive and can make a bond with\
    \ an interviewer then the job is yours to lose; psychologically they’re going\
    \ to be rooting for you to do well, so as long as you don’t make any major mistakes\
    \ then the person on the other side is going to do try his best to get you hired.\n\
    \n“But how does this relate to my CV?” I hear you cry. Your CV is your very first\
    \ first impression. When those pages land on someones desk it is the first time\
    \ they have been exposed to you and what you stand for. Interviewers receive hundreds\
    \ of CVS for every role so understandably very few of them stand out as exciting.\
    \ Let’s be clear; your CV is a sales document. After reading your hard crafted\
    \ words you want whoever is reading it to turn to the person next to them and\
    \ say ‘hey, this guy looks really good. We should bring him in soon”. I would\
    \ say this happens for me every 20 CVs or so.\n\nBefore we dive into crafting\
    \ the perfect programmer’s propaganda, I have one crucial piece of advice that\
    \ applies not just to CVs but to all of the hiring and interview processes that\
    \ you’re going to go through.\n\n**Killer advice: Everyone is different**"
