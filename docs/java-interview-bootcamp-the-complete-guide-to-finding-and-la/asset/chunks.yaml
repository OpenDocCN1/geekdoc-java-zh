  trans: "\n在我的机器上运行这并不一致，有时会发生轻微错乱。`Threads` 的工作方式在不同机器或 `JVMs` 之间永远不会保持一致，编写不依赖于\
    \ `JVM` 行为的代码是非常重要的。\n\n## Q: 什么是线程饥饿（Thread starvation）？\n\n如果一个 `Thread` 因为其他\
    \ `Threads` 而无法获得 CPU 时间，这被称为饥饿。想象一个上面的极端例子，有多个高优先 `Threads` 和一个低优先 `Thread`。低优先线程不太可能获得任何\
    \ CPU 时间，并将遭受饥饿。\n\n## Futures, Callables and Executors\n\n## Q: 什么是线程池（ThreadPool）？为什么使用线程池比手动创建\
    \ `Threads` 更好？\n\n`Threads` 的创建和维护是昂贵且耗时的。通过 `ThreadPool`，有一组可用的 `Threads` 可以调用它们来执行任务。`Threads`\
    \ 是提前创建的，从而减少了执行时的开销。一旦任务执行完毕，`Thread` 就会返回池中执行另一个任务。如果某个 `Thread` 因为某些原因死亡，它将在\
    \ `ThreadPool` 中被替换，从而消除了编写复杂的线程管理代码的需求。\n\n它的额外好处是，可以轻松控制并行发生任务的数量。例如，如果我们有一个\
    \ Web 服务器，我们可能限制并行任务的数量，以免巨大的流量突发停止其他后台任务的运行。\n\n## Q: 如何创建线程池\n\n通常 `ThreadPools`\
    \ 是使用 `Executors` 创建的。\n\n```\n1 ExecutorService executorService1 = Executors.newSingleThreadExecutor();\n\
    2 ExecutorService executorService2 = Executors.newFixedThreadPool(10);\n3 ExecutorService\
    \ executorService3 = Executors.newScheduledThreadPool(10);\n```\n\n单线程执行器将创建一个单线程；所有任务将按顺序执行。使用\
    \ `Executors.newFixedThreadPool(1)` 也可以实现的效果。\n\n`Executors.newFixedThreadPool`\
    \ 将创建一个具有精确指定数量 `Threads` 的 `ThreadPool`。这些线程将在 `JVM` 的整个生命周期内存在，除非使用 `shutdown()`\
    \ 关闭 `Executor`（这允许当前队列中的任务完成）并使用 `shutdownNow()`（这会取消任何正在进行的任务）。\n\n可以通过提交 `Callable`\
    \ 或 `Runnable` 来在 `ExecutorServices` 上运行任务。\n\n## Q: Callable 和 Runnable 之间有什么区别？Future\
    \ 是什么？\n\n`Runnable` 不能返回值，且不能抛出受检异常，而这两个功能在 `Callable` 中都可用。在构建多线程应用时，返回值通常非常有用。当我们向执行器提交任务时，我们不知道它何时会被执行执行；它可能是立即执行，也可能是未来的任何时候——整个过程是异步的。`Future`\
    \ 允许这种发生发生。`Futures` 有一个主方法：`get()` 及其重载版本 `get(long timeout, TimeUnit unit)`。调用时，它将阻塞当前\
    \ `Thread` 直等待结果（如果结果当前不可用）。\n\n使用 `Callable` 相比 `Runnable` 或反之没有优劣之分，这完全取决于是否需要返回值。\n\
    \n```\n 1 public static void main(String[] args) throws InterruptedException,\
    \ ExecutionExc\\\n 2 eption {\n 3     Callable<String> callable = new StringCallable();\n\
    \ 4     Callable<String> callable2 = new StringCallable();\n 5     Callable<String>\
    \ callable3 = new StringCallable();\n 6     Callable<String> callable4 = new StringCallable();\n\
    \ 7     \n 8     ExecutorService executorService = Executors.newFixedThreadPool(4);\n\
    \ 9     List<Future<String>> futures = executorService.invokeAll(asList(callable,\
    \ ca\\\n10 llable2, callable3, callable4));\n11     for (Future<String> future\
    \ : futures) {\n 12         System.out.println(future.get());\n 13     }\n 14\
    \     }\n 15     //pool-1-thread-1\n 16     //pool-1-thread-2\n 17     //pool-1-thread-3\n\
    \ 18     //pool-1-thread-4\n```\n\n## Q: 什么是 ThreadLocal？\n\n`ThreadLocal` 允许每个访问它的\
    \ `Thread` 拥有变量的不同实例。通常这是一个用于存储类似状态的静态变量。\n\n"
- fmt: "\nThere is also a variation in complexity within the above complexities. Imagine\
    \ an algorithm which loops through a list exactly two times. This would be `O(2n)`\
    \ complexity, as it’s going through your lists length `(n)` twice!\n\n## Why does\
    \ this matter?\n\nSimply put: *an algorithm that works on a small dataset is not\
    \ guaranteed to work well on a large dataset*. Just because something is lightning\
    \ fast on your machine doesn’t mean that it’s going to work when you scale up\
    \ to a serious dataset. You need to understand exactly what your algorithm is\
    \ doing, and what it’s big O complexity is, in order to choose the right solution.\n\
    \nThere are three things we care about with algorithms: **best case, worst case\
    \ and expected case**. In reality we only actually care about the latter two,\
    \ as we’re a bunch of pessimists. If you ask an algorithm to sort a pre-sorted\
    \ list it’s probably going to do it much faster than a completely jumbled list.\
    \ Instead we want to know what the worst case (the absolutely maximum amount of\
    \ steps the algorithm could take) and the expected case (the likely or average\
    \ number of steps the algorithm could take). Just to add to the fun, these can\
    \ and often are different.\n\n## Examples\n\nHopefully you’re with me so far,\
    \ but let’s dive into some example algorithms for sorting and searching. The important\
    \ thing is to be able to explain what complexity an algorithm is. Interviewers\
    \ love to get candidates to design algorithms and then ask what the complexity\
    \ of it is.\n\n### O(1)\n\nIrrelevant of the size, it will always return at a\
    \ constant speed. The javadoc for `Queue` states that it is *“constant time for\
    \ the retrieval methods (`peek`, `element`, and `size`)”.* It’s pretty clear why\
    \ this is the case. For `peek`, we are always returning the first element which\
    \ we always have a reference to; it doesn’t matter how many elements follow it.\
    \ The size of the list is updated upon element addition/removal, and referencing\
    \ this number is just one operation to access no matter what the size of the list\
    \ is.\n\n### O(log n)\n\nThe classic example is a `Binary search`. You’re a massive\
    \ geek so you’ve obviously alphabetised your movie collection. To find your copy\
    \ of “Back To The Future”, you first go to the middle of the list. You discover\
    \ the middle film is “Meet The Fockers”, so you then head to the movie in between\
    \ the start and this film. You discover this is “Children of Men”. You repeat\
    \ this again and you’ve found back to the future. There’s a great interactive\
    \ demo of binary search available at `http://www.cs.armstrong.edu/liang/animation/web/BinarySearch.html`.\n\
    \nAlthough adding more elements will increase the amount of time it takes to search,\
    \ it doesn’t do so proportionally. Therefore it is `O(log n)`.\n\n### O(n)\n\n\
    As discussed in the collections chapter, `LinkedLists` are not so good (relatively\
    \ speaking) when it comes to retrieval. It actually has a complexity of `O(n)`\
    \ for the **worst case**: to find an element `T`, which is the last element in\
    \ the list, it is necessary to navigate the entire list of `n` elements. As the\
    \ number of elements increases so does the access time in proportion.\n\n### O(n\
    \ log n)\n\nThe best example of `O(n log n)` is a **merge sort**. This is a divide\
    \ and conquer algorithm. Imagine you have a list of integers. We divide the list\
    \ in two again and again until we are left with with a number of lists with 1\
    \ item in: each of these lists is therefore sorted. We then merge each list with\
    \ it’s neighbour (comparing the first elements of each every time). We repeat\
    \ this with the new composite list until we have our sorted result. To explain\
    \ why this is `O(n log n)` is a bit more complex. In the above example of 8 numbers,\
    \ we have 3 levels of sorting:\n\n*   4 list sorts when the list sizes are 2\n\
    *   2 list sorts when the list sizes are 4\n*   1 list sort when the list size\
    \ is 8\n\nNow consider if I were to double the number of elements to 16: this\
    \ would only require one more level of sorting. Hopefully your recognise this\
    \ is a `log n` scale.\n\nHowever, on each level of sorting a total of `n` operations\
    \ takes place (look at the red boxes in the diagram above). this results in `(n\
    \ * log n)` operations, e.g. `O(n log n)`.\n\n### O(n²)\n\nThe `Bubble Sort` algorithm\
    \ is everyone’s first algorithm in school, and interestingly it is quadratic complexity.\
    \ If you need a reminder; we go through the list and compare each element with\
    \ the one next to it, swapping the elements if they are out of order. At the end\
    \ of the first iteration, we then start again from the beginning, with the caveat\
    \ that we now know the last element is correct.\n\nImagine writing the code for\
    \ this; it’s two loops of `n` iterations.\n\n```\n 1 public int[] sort(int[] toSort){\n\
    \ 2         for (int i = 0; i < toSort.length -1; i++) {\n 3             boolean\
    \ swapped = false;\n 4             for (int j = 0; j < toSort.length - 1 - i;\
    \ j++) {\n 5                 if(toSort[j] > toSort[j+1]){\n 6                \
    \     swapped = true;\n 7                     int swap = toSort[j+1];\n 8    \
    \                 toSort[j + 1] = toSort[j];\n 9                     toSort[j]\
    \ = swap;\n10                 }\n11             }\n12 if(!swapped){\n13     break;\n\
    14 }\n15 } return toSort; \n16 }\n```\n\nThis is also a good example of best vs\
    \ worst case. Much as you can `O(n²)`, you can also have `O(n³)` (imagine bubble\
    \ sort with an extra loop). You may notice that as the size of the data increases\
    \ this impact of this becomes more and marginal and tends towards quadratic.\n\
    \nEvery new element will double the processing time.\n\n### O(2^n)\n\nExponential\
    \ growth! Any algorithm where adding another element dramatically increases the\
    \ processing time. Take for example trying to find combinations; if I have a list\
    \ of 150 people and I would like to find combinations of everyone by themselves,\
    \ all of the groups of 2 people, all of the groups of 3 people etc.  \n\nIn reality\
    \ `O(2^n)` algorithms are not scalable.\n\n### How to figure out Big O in an interview\n\
    \nThis is not an exhaustive list of Big O. Much as you can `O(n²)`, you can also\
    \ have `O(n³)``. What the list on this page should allow you to have a stab in\
    \ the dark at figuring out what the big O of an algorithm is. If someone is asking\
    \ you this during an interview they probably want to see how you try and figure\
    \ it out. Break down the loops and processing.\n\n*   Does it have to go through\
    \ the entire list? There will be an `n` in there somewhere.\n*   Does the algorithms\
    \ processing time increase at a slower rate than the size of the data set? Then\
    \ there’s probably a `log n` in there.\n*   Are there multiple loops? You’re probably\
    \ looking at `n²` or `n³`.\n*   Is access time constant irrelevant of the size\
    \ of the dataset? `O(1)`\n\n### Sample Question\n\n**I have an array of the numbers\
    \ 1 to 100 in a random number. One of the numbers is missing. Write an algorithm\
    \ to figure out what the number is and what position is missing.**\n\nThere are\
    \ many variations of this question all of which are very popular. To calculate\
    \ the missing number we can add up all the numbers we do have, and subtract this\
    \ from the expected answer of the sum of all numbers between 1 and 100. To do\
    \ this we have to iterate the list once. Whilst doing this we can also note which\
    \ spot has the gap.\n"
