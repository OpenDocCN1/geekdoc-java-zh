  trans: '


    在面试过程中，你将遇到的每一个人对于“什么是优秀的开发者”都会有不同的意见。如果有一项标准化的考试或其他方式可以区分好开发者和坏的开发者，那么招聘工作将会变得简单得多（而且不，拥有一个
    `Sun Certified Java Programmer` 证书根本不能与之相提）。你参加的每一场面试都有不同的问题，而且每位面试官都有自己的一套价值观。有人可能看重多语言开发者；另一些人可能看重
    `TDD` 和 `BDD`；下一个人可能认为所有的代码都应该在记事本上编写并手动编译。没有所谓的灵丹妙药。


    作为候选人，这可能很难记住。也许你的简历没能给你带来面试机会，又也许你参加了几个面试但没有进展。你会垂下头，得出结论认为你停滞不前，而且不够优秀，无法获得新工作。


    现实情况是，你只是还没有找到与你的价值观相合的地方，这没关系。


    你对工作的期望可能会让你寻找职位的过程变得更容易或更难。对我来说，我讨厌大 O 表示法和性能问题，因为我身边有 Google，而且我相信人们倾向于过早地优化代码；真正的性能问题极少发生。这意味着有些面试我出来时知道自己表现得非常糟糕，但我并不在乎。我很乐意知道我不想为那个团队工作，因为他们的价值观与我的不符。这让我的找工作变得更难了吗？是的，但这意味着当我找到一个职位时，那是我真正想要的。你清醒时的大部分时间是在工作度过的，所以不如花时间把它做对。


    这是一种委婉的说法，意味着你的简历没有通用的万金模板。你可以把简历发给 5 个不同的人并得到 5 个不同的回复。你所做的就是让你的文档无懈可击，不要出现像拼写错误这样的愚蠢问题（这种情况经常），然后用你的文字来打造一种信息，让你对你想加入的那类人来说尽可能具有吸引力。


    ## 简历格式


    ### 应该有多长？


    这是很多争议的来源。我的观点非常明确：如果可能，它应该只有一页（最多两页）。人们没有时间仔细阅读简历，他们不在乎你上过什么学校或你过去的 15 份工作。他们想要的是关于你的技能如何契合职位的简短推销。通过保持简洁并仅填满重要信息，你让读者的工作变得容易得多，同时也展示了你简洁沟通的能力。


    另一方面，值得注意的是，过去我曾被招聘人员告诉要充实简历。如果你和招聘人员合作，他们通常会根据职位要求对你的简历进行剪裁和编辑。因此，我保留了两份简历：第一份是简短的单页版，压缩了我的核心角色和经验；另一份是两页版，尽可能挤入尽可能多的内容供招聘人员使用。


    不要受诱惑去创建一个有 15 页、数千字词的“巨著”。当我收到这些东西时，这立刻就是一个红旗。越大并不越好，你只是在凸显你自己无法有效沟通的能力。如果公司需要你追溯
    15 年的经历，他们会在以后来向你索要。简历是你的销售文档，用来说明你最优秀的技能，并配以你使用这些技能取得巨大成就的清晰案例。让我再说一遍。**你的简历是你展示自己最优秀技能的机会**。它应该以成就为中心，展示你过人的才华以及这些才华如何帮助你实现了目标。


    ### 开场白


    并不是所有候选人都会包含这一部分，但我认为它是最重要的部分。这是对你和你的品牌的单段介绍。你代表什么？你在意乎什么？把它看作是你的电梯演讲，概述你的优秀以及为什么别人应该雇佣你。谈谈你的爱好，也许你热爱
    `TDD`；从这里开始，这个开场白是你的简历基调。避免在这一部分堆砌词汇。这个开场白是你的简历的开头，确保你介绍自己自己。如果你你你，，，，列表列表列表喜欢使用列表。请尽可能多使用列表。


    事实是，人们喜欢列表。一个成就列表要容易得多。招聘人员很可能只读这部分。做好这一部分，把你最深刻的经历放在前面。


    ### 工作经历


    你不需要超过最近 5 年或最后 3 份工作，以较少的为准。这应该是简洁的，并关注**你**产出了什么以及**你**是如何做的。这种方式能让简历更容易阅读。这并没有告诉我任何关于公司的历史，以及公司正在执行的宏大项目。这是一个不要这样做法的例子：


    ```

    Senior Java Developer, Awesome Co. 2012-2014

    Awesome Co. 是全球最大的投资银行之一。总部位于纽约，在全球设有办事处，公司以客户为中心的方法为荣。我参与了项目 X。这是一个为期 3 年的投资项目，基于
    Java 和 NoSQL 技术。该项目重点关注敏捷交付和创建延迟系统。

    ```


    你会注意到这里几乎没有关于候选人的参考。太多的程序员简历都是这样形成的。相反，请对比下面的简历：


    ```

    Senior Java Developer, Awesome Co. 2012-2014

    成功领导了一个 6 人的开发团队，使用敏捷方法和迭代交付，在宏大的时间表内完成了行业领先的平台。

    - 我引入了迭代交付和故事规划，使我们能够准确预测速度，并确保每两周交付一次。

    - 我创建了一个全面的 NFT 框架，使我们能够快速运行回归测试并确保符合业务标准。

    - 主导了系统设计并引入了 ActiveMQ 和 MongoDB，实现了异常快速且易于测试的系统；所有代码均使用 TDD 构建

    ```


    这一次，整个文章都专注于候选人。现在我知道他们做了什么，取得了什么成就。这是一个更有说服力的推销。


