  trans: "\n在上述复杂度中，还存在复杂性的差异。想象一个算法恰好对列表进行了两次循环。这将是 `O(2n)` 复杂度，因为它对长度为 `(n)` 的列表遍历了两次！\n\
    \n## 为什么这很重要？\n\n简单来说：*一个在小数据集上运行良好的算法，并不保证在大规模数据集上同样表现良好*。仅仅因为某个东西在你的机器上运行得极快，并不意味着当你将其扩展到真正的数据集时它仍然能够正常工作。你需要确切了解你的算法在做什么，以及它的大\
    \ O 复杂度是多少，以便选择正确的解决方案。\n\n我们对算法关注有三个方面：**最好情况、最坏情况和预期情况**。在现实中，我们实际上只关乎后两种，因为我们是一群悲观主义者。如果你要求一个算法排序一个已经好序的列表，它的执行速度可能比排序一个完全乱序的列表快得多。相反，我们想知道最坏情况（算法可能采取的绝对最大步骤）和预期情况（算法可能采取概率或平均步骤）。为了增加趣味性，这些情况可以不同，而且往往是不同的。\n\
    \n## 示例\n\n希望你到为止还能跟上我，但让我们深入研究一些排序和搜索的示例算法。重要的是能够解释一个算法属于什么复杂度。面试官喜欢让候选人设计算法，然后问它们的复杂度是多少。\n\
    \n### O(1)\n\n无论大小如何，它将始终以恒定的速度返回。`Queue` 的 javadoc 说明其检索方法（`peek`、`element` 和\
    \ `size`）是*“常数时间”*。这其中的原因很清楚。对于 `peek`，我们总是返回第一个元素，而我们始终拥有它的引用；它后面有多少个元素并不重要。列表的大小在添加/删除元素时更新，而引用这个数字无论列表大小如何都只是一次访问操作。\n\
    \n### O(log n)\n\n经典的例子是`二分查找` (Binary search)。你是一个巨大的极客，所以你显然对你的电影收藏按字母顺序排序了。为了找到你的《回到未来》拷贝，你首先来到列表的中间。你发现中间的电影是《福克斯一家聚会》，然后前往开头和这部电影之间的电影。你发现那是《这个不是你的》。你再次重复这个过程，你就找到了《回到未来》。在\
    \ `http://www.cs.armstrong.edu/liang/animation/web/BinarySearch.html` 有一个非常棒的二分查找交互演示。\n\
    \n虽然增加更多元素会增加搜索时间，但这种增加不是比例性的。因此它是 `O(log n)`。\n\n### O(n)\n\n正如在集合章节中所讨论的，`LinkedLists`\
    \ 在检索方面（相对而言）并不好。在**最坏情况**下，它的复杂度实际上是 `O(n)`：为了找到列表中的最后一个元素的元素 `T`，必须遍历整个包含 `n`\
    \ 个元素的列表。随着元素数量的增加，访问时间也按比例增加。\n\n### O(n log n)\n\n`O(n log n)` 的最佳例子是**归并排序**\
    \ (merge sort)。这是一种分治算法。想象你有一个整数列表。我们不断地将列表分成两部分，直到剩下若干个包含 1 元素的列表；因此每个这些列表都是有序的。然后我们将每个列表与其邻居合并（每次比较每个列表的第一个元素）。我们对新的组合列表重复此操作，直到得到排序后的结果。解释为什么这是\
    \ `O(n log n)` 稍微复杂一点。在上述 8 个数字的示例中，我们有 3 级排序：\n\n*   列表大小为 2 时，有 4 次列表排序\n* \
    \  列表大小为 4 时，有 2 次列表排序\n*   列表大小为 8 时，有 1 次列表排序\n\n现在考虑如果我元素数量翻倍到 16：这只需要多一次排序层。希望你识别出这是一个\
    \ `log n` 尺度。\n\n然而，在每一层排序中，总共发生了 `n` 次操作（查看上图中红框所示）。这导致了 `(n * log n)` 次操作，例如\
    \ `O(n log n)`。\n\n### O(n²)\n\n`冒泡排序`算法是每个人在学校学习的第一个算法，有趣的是它是二次复杂度。如果你需要复习：我们遍历列表并将每个元素与相邻元素进行比较，如果顺序错误则交换元素。在第一次迭代结束后，我们再次从头开始，前提是我们现在知道最后一个元素是正确的。\n\
    \n想象为这个编写代码；它是两个 `n` 次迭代的循环。\n\n```\n 1 public int[] sort(int[] toSort){\n 2 \
    \        for (int i = 0; i < toSort.length -1; i++) {\n 3             boolean\
    \ swapped = false;\n 4             for (int j = 0; j < toSort.length - 1 - i;\
    \ j++) {\n 5                 if(toSort[j] > toSort[j+1]){\n 6                \
    \     swapped = true;\n 7                     int swap = toSort[j+1];\n 8    \
    \                 toSort[j + 1] = toSort[j];\n 9                     toSort[j]\
    \ = swap;\n10                 }\n11             }\n12 if(!swapped){\n13     break;\n\
    14 }\n15 } return toSort; \n16 }\n```\n\n这也是最好情况与最坏情况的一个良好示例。正如你可以 `O(n²)`，你也可以有\
    \ `O(n³)`（想象带额外循环的冒泡排序）。你可能注意到随着数据量的增加，这种影响趋向于二次。\n\n每个新元素都会使时间翻倍。\n\n### O(2^n)\n\
    \n指数级增长！任何增加元素都会剧剧增加处理时间的算法。例如尝试寻找组合：如果我有一组 150 个人，我想找到每个人的组合、所有两个人的组合、所有三个人的组合等等。\n\
    \n现实中 `O(2^n)` 算法是不可扩展的。\n\n### 如何在面试中确定大 O\n\n这不是大 O 的详尽列表。正如你可以 `O(n²)`，你也可以有\
    \ `O(n³)`。本页上的列表应该让你对算法的大 O 有一个初步判断。如果有人在面试中问你这个，他们可能想看你如何尝试解决。拆解循环和处理过程。\n\n\
    *   必须遍历整个列表吗？那里会有一个 `n`。\n*   算法的处理时间增长速度是否小于数据集的大小？那么那里可能有一个 `log n`。\n*   是否有多个循环？你可能在看\
    \ `n²` 或 `n³`。\n*   访问时间与数据集大小无关吗？`O(1)`\n\n### 示例题\n\n**我有一个包含 1 到 100 数字的随机数组。其中缺少一个数字。写一个算法来找出这个数字以及缺失的位置。**\n\
    \n这个问题有很多变体，所有的变体都非常流行。为了计算缺失的数字，我们可以加起来我们所有的数字，并用它减去 1 到 100 之间所有数字的预期和。为了这样做，我们需要遍历列表一次。在此期间，我们还可以记录哪个位置有空隙。\n"
- fmt: "\n```java\npublic class BubbleSort{\n    public void findTheBlank(int[] theNumbers)\
    \ {\n        int sumOfAllNumbers = 0;\n        int sumOfNumbersPresent = 0;\n\
    \        int blankSpace = 0;\n\n        for (int i = 0; i < theNumbers.length;\
    \ i++) {\n            sumOfAllNumbers += i + 1;\n            sumOfNumbersPresent\
    \ += theNumbers[i];\n            if (theNumbers[i] == 0)\n                blankSpace\
    \ = i;\n        }\n        System.out.println(\"Missing number = \" + (sumOfAllNumbers\
    \ - sumOfNumbersPresent) + \" at location \" + blankSpace +\"支撑 of the array\"\
    );\n    }\n\n    public static void main(String[] args) {\n        new BubbleSort().findTheBlank(new\
    \ int[]{7,6,0,1,3,2,4});\n    }\n\n    //Missing number = 5 at location 2 of the\
    \ array\n}\n```\n\nCaveat: you can also calculate `sumOfAllNumbers` using `(theNumbers.length+1)\
    \ * (theNumbers.length) / 2.0`. I would never remember that in an interview though.\n\
    \n### What is the big O of your algo?\n\nOur algorithm iterates through our list\
    \ once, so it’s `O(n)`.\n\n## Conclusion\n\nYou’re amazing. Well done for reading\
    \ this book all the way through. I’m very proud of it, but more specifically I’m\
    \ proud of how I’ve been able to help people to get amazing new jobs. Whenever\
    \ I get emails or messages through from people saying thanks because I’ve helped\
    \ them to get a better job it gives me the biggest buzz.\n\nIf everything goes\
    \ well and you’ve benefitted from this, then please do let me know. Or even if\
    \ you have extra questions, want someone to look over your CV, or just want to\
    \ say hi. I try and reply to every message I get.\n\ne: hello@corejavainterviewquestions.com\n\
    \nt: @sambahk\n\nGo out and ace that interview.\n\nSam\n"
