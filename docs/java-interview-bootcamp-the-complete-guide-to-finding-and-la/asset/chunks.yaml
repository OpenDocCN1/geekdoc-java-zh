  raw: '*   protected: accessible from by any class in the same package or any subclass
    in any package


    *   default: when no visibility modifier is present. accessible from any class
    in the same package only.


    **Q: What is meant when it is said we favour low coupling and high cohesion?**


    This is one of the key design principals in OOP. Low coupling refers to how different
    components interact; that could be objects, modules, systems, any level. We want
    components to have a very limited dependency on other components. This makes it
    quick and cheap to refactor and make changes to. This is usually accomplished
    by creating clean interfaces between components and using encapsulation to hide
    the internal implementation. Low coupling is one of the most important ideas for
    creating systems that are flexible and manageable.


    Cohesion refers to the implementation of the components; in a highly cohesive
    system things are built in such a way that related items are put together and
    unrelated ones are separate. To return to the Car analogy, it makes sense that
    the methods for driving a car such as turn(), accelerate() and brake() exist on
    Car. They are cohesive and belong together. On the other hand, if the Car had
    a clean() method on it that would not be cohesive. A car doesn’t clean itself;
    That is done by something else, perhaps a CarWash or an Owner. High Cohesion is
    achieved by ensuring that fields and behaviours that don’t belong together are
    separated to a better place.


    These terms are often referred to together because cohesive systems with low coupling
    tend to be more flexible and maintainable.


    **Q: What is the difference between method overloading and method overriding?**


    In Java, it is possible for multiple methods to have the same name. They are differentiated
    by having a different number, type and/or ordering of parameters. This is known
    as method overloading.


    Overriding is the creation of a different implementation of a method in a subclass.


    **Q: What is a constructor?**


    A constructor is a special method which is named identical to the class, e.g.
    a Car class will have a constructor called Car(). A constructor does not specify
    a return type as it implicitly returns an object of the type of that class, in
    this case a Car object. It is used to build an instance of that class. If one
    is not specified there will be a default public no-arg constructor provided. It
    is possible to overload constructors, and all the access modifiers can be applied
    to a constructor.


    If your class contains any final fields they must be assigned a value by the end
    of the constructor or your program will not compile.


    **Q: What is static in java**


    Using the static keyword effectively declares that something belongs to the class,
    not to the object instance. The static variable is shared by all instances of
    the object. A static method belongs to the class, meaning that it cannot access
    any non-static field values. It also means it cannot be overridden. We can also
    have static code blocks which are executed when a class is loaded into memory:


    ```

    1 static{

    2     System.out.println("Hello!");

    3     //maybe initialise some static variables here

    4 }

    ```


    Static can also be used for nested classes.


    **Q: What does it mean when we say java does not support multiple inheritance?
    Is this a good thing?**


    Java cannot extend functionality from more than one concrete or abstract class.
    If both parent classes had a jump() method, it would be unclear which functionality
    the caller would need to use. We can implement multiple interfaces however as
    the the implementation occurs in our actual class so this problem does not occur.


    **Q: If you wanted to prevent your methods or classes from being overridden, how
    would you do this?**


    By declaring something as final you prevent it from being overridden. Nothing
    is perfect though, as crafty developers can always use Reflection to get around
    this, or alternatively just copy and paste your code into their own version of
    the class. It is rarely a good idea to prevent your methods or classes being overridden,
    and you should code defensively to reflect this.


    ## Data Structures


    Java data structures interview questions will come up in your interview. At it’s
    nexus being a programmer is about handling data, transforming and outputting it
    from one format to another, which is why it is so important to understand what’s
    going on under the hood and how it can affect your application. It never fails
    to confound me how many people can’t tell what collection is used to back an ArrayList
    (hint: it’s in the name). From the interviewers perspective, questions on data
    structures reveal a lot of information about the candidate. They show if the candidate
    has a core understanding of how java works. Even better it provides a platform
    to lead to a wide ranging set of questions on design, algorithms and a whole lot
    more. In day to day java programming, you’re going to spend most of your time
    with ArrayLists, LinkedLists and HashMaps. As a result it makes sense to review
    collections and algorithms you haven’t looked at for a while as, in my experience,
    companies love asking this sort of question.


    *   **Q: What is the Java Collection Framework?**


    *   **Q: What Collection types are there in Java?**


    *   **Q: What are the basic interface types**


    *   **Q: What are the differences between List, Set and Map**


    This is the bread and butter stuff that everyone who uses Java should know. The
    collections framework is simply the set of collection types that are included
    as part of core java. There are three types of collection you will deal with in
    Java; Set and List (both of which implement Collection) and Maps (which implement
    AbstractMap and technically aren’t part of core Collections). Each type of collection
    exhibits certain characteristics which define it’s usage. The key features of
    a collection are:


    *   Elements can be added or removed


    *   The collection will have a size that can be queried


    *   The collection may or may not contain duplicates


    *   It may or may not provide ordering


    *   It may or may not provide positional access (e.g. get me item at location
    6)


    The behaviour of these methods varies based on implementation (as you would expect
    from an interface). What happens on if you call remove on a collection for an
    object that doesn’t exist? It depends on the implementation.


    ### The Collection Types


    **Set**: A set has no duplicates and no guaranteed order. Because of this, it
    does not provide positional access. Implements Collection. Example implementations
    include TreeSet and HashSet.


    **List**: A list may or may not contain duplicates and also guarantees order,
    allowing positional access. Implements Collection. Example implementations include
    ArrayList and LinkedList.


    **Map (interface: AbstractMap)**: A map is slightly different as it contains key-value
    pairs as opposed to specific object. The key of a map may not contain duplicates.
    A map has no guaranteed order and no positional access. Does not implement Collection.
    Example implementations include HashMap and TreeMap.


    But what does this mean with regards to interviews? You’re almost certainly going
    to get a question about the differences between the types so make an effort to
    learn them. More importantly the smart interviewee understands what the implication
    of these features are. Why would you choose one over the other? What are the implications?


    #### Which to choose?


    In reality, whether you choose a Set, List or Map will depend on the structure
    of your data. If you won’t have duplicates and you don’t need order, then your
    choice will lie with a set. If you need to enshrine order into your data, then
    you will choose List. If you have key-value pairs, usually if you want to associate
    two different objects or an object has an obvious identifier, then you will want
    to choose a map.


