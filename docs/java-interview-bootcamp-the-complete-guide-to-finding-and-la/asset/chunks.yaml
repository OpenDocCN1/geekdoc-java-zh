  trans: "\n`wait()`、`notify()` 和 `notifyAll()` 被用线程间通信的手段。在获取对象的锁时，该对象可能处于所需的状态；例如资源尚未设置，或者某个值不正确。我们可以使用\
    \ `wait()` 让线程休眠，直到某些发生变化。当这些变化发生时，可以通过在正在等待的对象上调用 `notify()` 或 `notifyAll()`\
    \ 来通知等待的客户端。如果理论上你所有的等待线程都可以根据新信息采取行动，那么请使用 `notifyAll()`。但是，如果有一个新的锁需要获取（因此只有一个等待的线程可以采取行动），则仅调用\
    \ `notify()`。\n\n## 示例\n\n```java\n 1 public class Example {\n 2 \n3     public\
    \ static void main(String[] args) {\n 4 \n5         ResourceCarrier carrier =\
    \ new ResourceCarrier();\n 6         ThingNeedingResource thingNeedingResource\
    \ = new ThingNeedingResource(car\\\n7 rier);\n8         ThingNeedingResource thingNeedingResource2\
    \ = new ThingNeedingResource(ca\\\n9 rrier);\n10         ThingNeedingResource\
    \ thingNeedingResource3 = new ThingNeedingResource(ca\\\n11 rrier);\n12      \
    \   ResourceCreator resourceCreator = new ResourceCreator(carrier);\n 13 \n14\
    \         new Thread(thingNeedingResource).start();\n15         new Thread(thingNeedingResource2).start();\n\
    16         new Thread(thingNeedingResource3).start();\n17         new Thread(resourceCreator).start();\n\
    \ 18     }\n 19 \n20 }public class ResourceCarrier {\n 21     private boolean\
    \ resourceReady;\n 22 \n 23 \n 24 \n 25     public boolean isResourceReady() {\n\
    \ 26         return resourceReady;\n 27     }\n 28 \n 29     public void resourceIsReady()\
    \ {\n 30         resourceReady = true;\n 31 \n 32     }\n 33 }\n 34 public class\
    \ ResourceCreator implements Runnable {\n 35     private ResourceCarrier carrier;\n\
    \ 36 \n 37     public ResourceCreator(ResourceCarrier carrier) {\n 38 \n 39  \
    \       this.carrier = carrier;\n 40     }\n 41 \n 42     @Override\n 43     public\
    \ void run() {\n 44         try {\n 45             Thread.sleep(2000);\n 46  \
    \       } catch (InterruptedException e) {\n 47             e.printStackTrace();\n\
    \ 48         }\n 49         synchronized (carrier) {\n 50             carrier.resourceIsReady();\n\
    \ 51             carrier.notifyAll();\n 52         }\n 53     }\n 54 }\n 55 package\
    \ com.core.interview.thread;\n 56 \n 57 \n 58 public class ThingNeedingResource\
    \ implements Runnable {\n 59 \n 60     private ResourceCarrier carrier;\n 61 \n\
    \ 62     public ThingNeedingResource(ResourceCarrier carrier){\n 63 \n 64    \
    \     this.carrier = carrier;\n 65     }\n 66     @Override\n 67     public void\
    \ run() {\n 68             synchronized (carrier){\n 69             while(!carrier.isResourceReady()){\n\
    \ 70                 try {\n 71                     System.out.println(\"Waiting\
    \ for Resource\");\n 72                     carrier.wait();\n 73             \
    \    } catch (InterruptedException e) {\n 74                     e.printStackTrace();\n\
    \ 75                 }\n 76             }\n 77             System.out.println(\"\
    haz resource\");\n 78         }\n 79     }\n 80 }\n```\n\n在这个示例中，我们有一个围绕名为“Resource\
    \ Carrier”的资源包装器，以及 3 个想要访问该资源的线程。当它们获取锁时，它们发现资源不可用，并通过在 `ResourceCarrier` 对象上调用\
    \ `wait()` 进入等待模式。`ResourceCreator` 随后介入创建资源并在 `ResourceCarrier` 上调用 `notify()`，此时这三个线程就恢复了活力。\n\
    \n## 死锁 (Deadlock)\n\n### Q\n\n**Q: 什么是死锁？**\n\n**Q: 我们如何防止死锁？**\n\n许多应聘者在回答死锁问题时完全是含糊其辞。这是一个非常常见的面试题，概念也容易理解，但解释起来可能棘手（特别是在电话中）。\n\
    \n死锁发生在两个或多个线程相互等待对方的操作，从而阻止了任何进一步的处理发生。例如，`Thread A` 拥有 `Object 1` 的锁并尝试获取 `Object\
    \ 2` 的锁以继续。同时，`Thread B` 拥有 `Object 2` 的锁并尝试获取 `Object 1` 的锁。结果是两个线程都一直忙于等待对方，而对方永远不会释放。这就是死锁。\n\
    \n防止死锁简单的方法是确保获取锁的顺序是一致的。如果两个线程都尝试按顺序获取 `Object 1` 然后是 `Object 2`，就不会发生死锁。在获取锁时，编写防御性代码是非常重要的。更好的做法是让\
    \ `synchronized` 块尽可能小，并在可能的情况下避免锁定多个对象。\n\n## 活锁 (Livelock)\n\n**Q: 什么是活锁？**\n\
    \n在死锁中，线程将停止工作并等待资源释放。在活锁中，线程会持续活动但无法取得任何进展。\n\n## 线程优先级 (Thread Priority)\n\n\
    **Q: 什么是线程优先级？**\n\n在死锁中，线程将停止工作并等待资源释放。在活锁中，线程会持续活动但无法取得任何进展。线程优先级允许你告诉 JVM 哪些线程比其他线程更重要，以便获得更多的执行时间。\n\
    \n```java\n 1    public static void main(String[] args) {\n 2     Thread thread\
    \ = new Thread(new Counter(1));\n 3     thread.setPriority(Thread.MAX_PRIORITY);\n\
    \ 4     Thread threadTwo = new Thread(new Counter(2));\n 5     threadTwo.setPriority(Thread.MIN_PRIORITY);\n\
    \ 6     thread.start();\n 7     threadTwo.start();\n 8 }\n 9 \n10 static class\
    \ Counter implements Runnable {\n 11     private int id;\n 12 \n 13     public\
    \ Counter(int i) {\n 14         id = i;\n 15     }\n 16 \n 17     @Override\n\
    \ 18     public void run() {\n 19         for (int i = 0; i < 10; i++) {\n 20\
    \             System.out.println(\"Thread \" + id + \" - \" + i);\n 21       \
    \  }\n 22     }\n 23 }\n```\n\n这个简单的程序启动了两个线程计数到十。如果我移除优先级行，输出将是混乱的：\n\n```text\n\
    \ 1 Thread 2 - 0\n 2 Thread 1 - 0\n 3 Thread 1 - 1\n 4 Thread 1 - 2\n 5 Thread\
    \ 1 - 3\n 6 Thread 1 - 4\n 7 Thread 2 - 1\n 8 Thread 2 - 2\n 9 Thread 2 - 3\n\
    10 Thread 2 - 4\n11 Thread 2 - 5\n12 Thread 2 - 6\n13 Thread 1 - 5\n14 Thread\
    \ 1 - 6\n15 Thread 2 - 7\n16 Thread 2 - 8\n17 Thread 1 - 7\n18 Thread 1 - 8\n\
    19 Thread 1 - 9\n20 Thread 2 - 9\n```\n\n但是，如果我按照上面所示运行程序，输出将：\n\n```text\n 1\
    \ Thread 1 - 0\n 2 Thread 1 - 1\n 3 Thread 1 - 2\n 4 Thread 1 - 3\n 5 Thread 1\
    \ - 4\n 6 Thread 1 - 5\n 7 Thread 1 - 6\n 8 Thread 1 - 7\n 9 Thread 1 - 8\n10\
    \ Thread 1 - 9\n11 Thread 2 - 0\n12 Thread 2 - 1\n13 Thread 2 - 2\n14 Thread 2\
    \ - 3\n15 Thread 2 - 4\n16 Thread 2 - 5\n17 Thread 2 - 6\n18 Thread 2 - 7\n19\
    \ Thread 2 - 8\n20 Thread 2 - 9\n```\n\n"
- fmt: "\nRunning on my machine this isn’t consistent though, and does sometime jumble\
    \ slightly. The way `Threads` work will never be consistant across machines or\
    \ `JVMs` and it is important to write code that does not rely on a `JVM`’s behaviour.\n\
    \n## Q: What is Thread starvation?\n\nIf a `Thread` cannot get CPU time because\
    \ of other `Threads` this is known as starvation. Imagine an extreme example like\
    \ the above, with a number of high priority `Threads` and a single low priority\
    \ `Thread`. The low priority is unlikely to get any CPU time and will be suffering\
    \ from starvation.\n\n## Futures, Callables and Executors\n\n## Q: What is a ThreadPool?\
    \ Why is it better to use them instead of manually creating `Threads`?\n\nThe\
    \ creation and maintenance of `Threads` is expensive and time consuming. With\
    \ a `ThreadPool` a group of `Threads` are available which can be called on to\
    \ execute tasks. The `Threads` are created up-front, thus reducing the overhead\
    \ at execution time. Once a task has been executed the `Thread` is returned to\
    \ the pool to execute another task. If a `Thread` dies for some reason it will\
    \ be replaced in the `ThreadPool`, removing the need to write complex Thread management\
    \ code.\n\nThere is the added benefit that it makes it easy to control the number\
    \ of tasks happening in parallel. For example, if we have a webserver we may want\
    \ to limit the number of parallel tasks so that a huge burst of traffic wouldn’t\
    \ stop other background tasks from happening.\n\n## Q: How do you create a ThreadPool\n\
    \nNormally `ThreadPools` are created using `Executors`.\n\n```\n1 ExecutorService\
    \ executorService1 = Executors.newSingleThreadExecutor();\n2 ExecutorService executorService2\
    \ = Executors.newFixedThreadPool(10);\n3 ExecutorService executorService3 = Executors.newScheduledThreadPool(10);\n\
    ```\n\nA single thread executor will create a single thread; all tasks will be\
    \ executed sequentially. The same could be achieved using `Executors.newFixedThreadPool(1)`.\n\
    \n`Executors.newFixedThreadPool` will create a `ThreadPool` with exactly the number\
    \ of `Threads` specified. Those threads will live for the lifetime of the `JVM`\
    \ unless the `Executor` is shutdown using `shutdown()` (which will allow currently\
    \ queued tasks to finished) and `shutdownNow()` (which will cancel any outstanding\
    \ tasks).\n\nTasks can be run on `ExecutorServices` by either submitting a `Callable`\
    \ or a `Runnable`.\n\n## Q: What is the difference between Callable and Runnable?\
    \ What is a Future?\n\nA `Runnable` cannot return a value and it cannot throw\
    \ a checked exception, both features available in `Callable`. Often a return value\
    \ is very useful when building multithreaded applications. When we submit a task\
    \ to an executor we don’t know when it will be executed; it could be instantly\
    \ or at any time in the future- the whole process is asynchronous. `Future`’s\
    \ allow this to happen. `Futures` have one main method: `get()` and it’s overloaded\
    \ version, `get(long timeout, TimeUnit unit)`. When called, it will block the\
    \ current `Thread` whilst it awaits the result (if the result is not currently\
    \ available).\n\nThere is no benefit/negative to using `Callable` over `Runnable`\
    \ or vice versa, it all depends on whether a return value is needed.\n\n```\n\
    \ 1 public static void main(String[] args) throws InterruptedException, ExecutionExc\\\
    \n 2 eption {\n 3     Callable<String> callable = new StringCallable();\n 4  \
    \   Callable<String> callable2 = new StringCallable();\n 5     Callable<String>\
    \ callable3 = new StringCallable();\n 6     Callable<String> callable4 = new StringCallable();\n\
    \ 7     \n 8     ExecutorService executorService = Executors.newFixedThreadPool(4);\n\
    \ 9     List<Future<String>> futures = executorService.invokeAll(asList(callable,\
    \ ca\\\n10 llable2, callable3, callable4));\n11     for (Future<String> future\
    \ : futures) {\n12         System.out.println(future.get());\n13     }\n14   \
    \  }\n15     //pool-1-thread-1\n16     //pool-1-thread-2\n17     //pool-1-thread-3\n\
    18     //pool-1-thread-4\n```\n\n## Q: What is ThreadLocal?\n\n`ThreadLocal` allows\
    \ a different instance of a variable for each `Thread` that accesses it. Normally\
    \ this will be a static variable used to store state like.\n\n## Big Notation\n\
