- fmt: "\nAfter you’ve cleared the hurdles of the developer team you will normally\
    \ end up in a room with a manager. This may be the team manager (who will likely\
    \ still be technical to some degree) or it may be a department head (who is quite\
    \ removed from the day to day). The likelihood is that this is going to focus\
    \ heavily on the interpersonal fluffy questions. The purpose of this interview\
    \ is to get an understanding of your experience as part of a team, to figure out\
    \ your potential as an employee and to determine if you will be a good fit for\
    \ the team and the company.\n\nThere is no right answer to these questions and\
    \ it will depend entirely on the values of the person interviewing you and the\
    \ firm you’re interviewing with. Some firms are looking for people who can bring\
    \ a breath of fresh air and stir things up, people to bring new ideas and mix\
    \ things up. Once when I was being interviewed by a head of development I spent\
    \ a huge amount of time talking about the important of continuous delivery and\
    \ having build monitors as information radiators, all of which he had heard about\
    \ but had never tried to implement. By showing I could bring some valuable new\
    \ skills to the team he was exceptionally keen to hire me.\n\nConversely, a large\
    \ proportion of the people who interview you will be looking for people who can\
    \ slot in seamlessly with the team or company and hit the ground running. If you\
    \ know someone who’s already working there you can find out what “good” looks\
    \ like to that team/company and tailor your answers accordingly, but most of the\
    \ time you won’t know what your interviewer is specifically looking for. Don’t\
    \ worry about this, and don’t try and guess based on the intonation or questions\
    \ asked. Just be honest and try to show where your expertise and passion lies.\
    \ The simple reality is not everyone will fit in everywhere, and that’s ok. Just\
    \ talk candidly about your experiences and opinions and try and strike up interesting\
    \ conversations.\n\nBe confident and outgoing. Even though the person you’re talking\
    \ to is in management it’s no reason to get nervous. Think of the worst case scenario:\
    \ you don’t get the job. That’s ok. Most of your peers will struggle with this\
    \ interview as it’s heavily focused on being able to give articulate answers and\
    \ have interactive conversations. If this is not your strong point then *practice*.\
    \ Ask a friend (preferably not in IT) to drill you on these questions until you\
    \ no longer sound nervous.\n\n### Example Questions\n\n*   What do you enjoy about\
    \ going to work?\n*   What do you dislike about being a developer?\n*   Why are\
    \ you leaving your current job?\n*   If you could change one thing about your\
    \ current team what would it be?\n*   What does a good team look like?\n*   What\
    \ makes a good developer?\n*   Tell me about a time you had conflict at work.\
    \ How did you deal with it?\n*   Tell me about the biggest mistake you made at\
    \ work?\n\n## Technical Tests\n\n### What are technical tests?\n\nOver the years\
    \ I’ve tried many different types of ways of screening candidates; phone interview,\
    \ speed dating style, full on technical interview and everything in between. My\
    \ favourite method by far is the technical test, also known as the coding homework.\n\
    \nThe technical test is simply an exercise or set of exercises given for you to\
    \ complete at home. Normally it will take one to two hours and will be reasonably\
    \ challenging, involving some level of complexity such as Threading or algorithms.\
    \ The instructions will likely be emailed to you, giving you a certain time frame\
    \ within which to complete it.\n\n### Why are they good?\n\nMost interview process\
    \ do not involve the candidate writing any code. This is crazy! You’re interviewing\
    \ to be a programmer and most job interviews don’t involve you doing any programming.\
    \ If you’re lucky enough to be in a process which does involve looking at your\
    \ code there are 3 main options they could use:\n\n*   Bring you in and watch\
    \ you code. This could be a pair programming exercise or it could be simply sitting\
    \ you in front of an exercise and watching you code. I’m a big fan of the pair\
    \ programming interview as a mechanism to use later on in the interview cycle\
    \ to get a good understanding of how a programmer interacts with other people\
    \ and designs their way through a solution.\n*   Ask for a code sample. Less popular\
    \ than it used to be, but the equivalent of asking a graphic designer for their\
    \ portfolio. Most the code people write is for their employer and cannot be exported\
    \ outside the firm, so it relies on the hiree having personal projects to showcase.\
    \ I’d recommend if you do already have projects that you upload them to `github`\
    \ and include them on your CV: you look good for having the project and it shows\
