  trans: "\n\n```java\npublic class BubbleSort{\n    public void findTheBlank(int[]\
    \ theNumbers) {\n        int sumOfAllNumbers = 0;\n        int sumOfNumbersPresent\
    \ = 0;\n        int blankSpace = 0;\n\n        for (int i = 0; i < theNumbers.length;\
    \ i++) {\n            sumOfAllNumbers += i + 1;\n            sumOfNumbersPresent\
    \ += theNumbers[i];\n            if (theNumbers[i] == 0)\n                blankSpace\
    \ = i;\n        }\n        System.out.println(\"Missing number = \" + (sumOfAllNumbers\
    \ - sumOfNumbersPresent) + \" at location \" + blankSpace +\"支撑 of the array\"\
    );\n    }\n\n    public static void main(String[] args) {\n        new BubbleSort().findTheBlank(new\
    \ int[]{7,6,0,1,3,2,4});\n    }\n\n    //Missing number = 5 at location 2 of the\
    \ array\n}\n```\n\n注意：你也可以使用 `(theNumbers.length+1) * (theNumbers.length) / 2.0`\
    \ 来计算 `sumOfAllNumbers`。不过，我在面试中永远记不住那个公式。\n\n### 你的算法大圈复杂度是多少？\n\n我们的算法只遍历了一次列表，所以它是\
    \ `O(n)`。\n\n## 结语\n\n你太棒了。感谢你读完了整本书。我为此非常自豪，但更具体地说，我为自己能够帮助人们获得理想的新工作而自豪。每当我收到人们的邮件或消息，感谢我帮助他们找到了更好的工作时，我的内心都会感到无比兴奋。\n\
    \n如果一切顺利且你从中获益了，请务必告诉我。或者即使你有额外的问题、想让我帮你看看简历，或者只是想打个招呼。我会尽量回复每一条收到的消息。\n\n邮箱：hello@corejavainterviewquestions.com\n\
    \n推特：sambahk\n\n去吧，横扫那个面试。\n\nSam\n\n"
