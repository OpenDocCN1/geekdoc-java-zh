    \n## Introduction\n\nWelcome to Java Interview Bootcamp. Firstly, I’d just like\
    \ to say a huge thank you to you for buying this book. I hope you will enjoy reading\
    \ the book, but more importantly that it helps you to get your next amazing job.\n\
    \nHelping Java devs through the interview process is something I’m really passionate\
    \ about. In my career I’ve interviewed hundreds of people from the most junior\
    \ developers to the most senior technical leads. There have been some consistent\
    \ themes throughout that really drove my desire to write this book and create\
    \ www.corejavainterviewquestions.com.\n\nThis book is split into two sections,\
    \ interview process and core java revision. When someone is interviewing you they\
    \ are looking to ensure that you are technically capable, but they also want to\
    \ know that you are someone they can work with day to day. In the first half of\
    \ the book we cover the different types of interview and what you can do as a\
    \ candidate to make the best impression possible on your future employer.\n"
