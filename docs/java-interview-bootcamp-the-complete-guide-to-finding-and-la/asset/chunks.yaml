  trans: "\n这也是一个留下印象并展示自我的机会。假设你知道你面试的人非常热衷某种技术或方法，比如 `Test Driven Development`（测试驱动开发）。利用你的问题来推销自己吧！我是\
    \ `TDD` 的忠实粉丝，我想知道你们在团队中具体是如何使用它的？” 或者是“我一直想学习 `TDD` 但一直没有机会。我觉得这个概念非常迷人。你认为它的学习曲线是可以接受的吗？”这对面试官来说简直是天籁音，因为你真的在乎。如果我每天有\
    \ 3 个面试，每周 5 天，这样的细节真的会产生巨大的影响。\n\n### 留下最佳印象的技巧\n\n当电话响起时，要往积极的一面想。保持积极。听起来很快。虽然这听起来很老套，但“你有\
    \ 7 秒钟留下第一印象”这句老话非常准确。我拨打的候选人中，听起来很闷且/或不感兴趣的比例得惊人。这会瞬间让面试官对你产生反感，除非你能完美回答所有问题，否则你很难通过面试。相反，如果你接起电话，听起来很兴奋，并告诉面试官你一直期待这次面试，那么你从一开始就处于好感中了。\n\
    \n说话慢一点。你不想以闪电般的速度冲完面试。但也不要慢到让面试官感到无聊。最重要的是，知道何时停止。我遇到过候选人对我关于 `Spring` 进行长达 5\
    \ 分钟的独白，最后我不得不插话。能够组织简洁的回答是一项极其重要的技能，不仅在面试中如此，作为一名 `java` 开发人员也是如此。这需要练习，但非常值得。如果你担心自己没有完全回答问题，只需说“这样可以吗，还是您希望我继续？”面试官很可能已经注意到了你提到的某些点，并会改变问题方向或问一个新问题。如果没有，他们可能只是让你继续，你就可以一直说下去。这里有一些快速不要做的：\n\
    \n*   不要听起来很无聊\n*   不要嚼口香糖\n*   不要在网上搜答案（`我们可以听到键盘声`）\n*   不要打断面试官\n*   不要害怕说不知道。试图通过猜测来过关是骗不了任何人的。如果我在问这个问题，那么我可能知道答案。说“我不了解那个，但如果您愿意，我很乐意尝试解决”是完全没问题的。这样大家都知道你没有试图撒谎过关。承认自己不知道的候选人总是赢得尊重。\n\
    \n### 面试期间你会被问到什么\n\n由于电话的局限性，你可以相当确定问题将基于以下四类之一：\n\n*   `Core Java`：线程、异常、数据结构与算法、面向对象编程等。这些是基础知识，你只需要花时间复习一下。这些是否是判断你能力的好问题并不重要；大多数面试都会回到这些点上，所以做好准备是好的。阅读\
    \ `Java Interview Bootcamp` 的后半部分是最好的开始。\n*   技术讨论。“你用过技术 X 吗（或‘我从你的简历看到你用过 X）？”、“你能给我介绍一下吗？你觉得它怎么样？”我的默认首选话题是\
    \ `Spring` 和 `Hibernate`，因为它们有很多可以从初始问题延伸并真正深入探讨的问题。它们也出现在大多数人的简历上。这是我倾向于问的问题，因为你可以真正了解候选人的水平，以及他们是否理解自己所使用的工具，还是仅仅因为被要求才使用。看看你简历上的核心技术，并找出你对它们的看法。面试官可能不在意具体的观点是什么，而是你你能够清晰地阐述每一方面的优缺点并得出结论。\n\
    \    *   技术。我喜欢问这些。每个办公室的工作方式都不同；敏捷 vs 瀑布式（是的，瀑布式仍然存在）、`TDD/BDD/other DD`、编程风格等。同样，如果你把这些写在了简历上，你就需要确保自己对这些方面的经验有良好的回答。如果你的部门使用\
    \ `TDD` 所以你把它写在了简历上，但你实际上并没有这样做，你看起来就会很糟糕。再次检查你的简历，看看你列出的内容；为每一项准备强有力的解释。\n  \
    \  *   谜题。这由类似于谷歌风格的问题组成，比如“世界上有多少粒沙？”以及“如果你被困在电梯里一个半小时你会怎么办？”尝试读读这类问题让自己在回答时自在是好的，但实际上，它们并不是你通过大量学习就能解决的。我个人不是这些粉丝，但每个面试官都是不同的。\n\
    \n尽量不要猜测面试官在寻找什么，或者你认为面试官认为“正确”的答案是什么。他们可能会故意引导你走错误的道路，以看看你是否是一个“唯唯诺诺的人”。即使观点看起来很有争议，也要坚持自己。保持礼貌，诚实，并尝试进行开放讨论。电话那头的人不是机器人，所以尝试感人的一面并进行双向对话。如果候选人在回答过程中反过来问我一个问题，我倾向于喜欢这一点。面试应该是双向的。\n\
    \n### 面试后\n\n通常情况下，你对自己的表现应该有个不错的把握，但不必担心。我遇到过一些认为自己搞砸了但其实很优秀的人。相反，我也遇到过一些认为自己表现很糟糕的人。只需等待他们的回复，并对自己尽了力感到放心。如果你没有通过，不要纠结。事实是，每个面试官都是不同的，每家公司重视的东西也不同，你当时可能并不合适。这没关系。继续申请不同的职位即可。\n\
    \n### 第一印象\n\n但什么是好的第一印象呢？\n"
- fmt: '

    # Turning up on time

    It’s baffling that this needs to be written down but the number of candidates
    I’ve had arrive late is incredible. You are being interviewed by busy people who
    are taking the time out of their day to sit with you. The moment you arrive late
    you’re in the “no” column and fighting to escape. Ideally try to arrive about
    5 minutes before the scheduled start time. It is also important not to arrive
    too early. I know everywhere I’ve ever worked has struggled for meeting room space
    and if you get there really early it puts the burden onto the interviewer to find
    somewhere for you to wait. You don’t want to have them pulled out of an important
    meeting to deal with your arrival because you’ve turned up far too soon.


    # Dressing Correctly

    It varies by industry, but I’ve found generally people don’t bother with a full
    suit and tie combination anymore, generally just wearing trousers and a shirt.
    I think this is preferable and will help you to relax. If you feel more comfortable
    wearing a suit then go for it, you’re not going to get marks against for dressing
    too formally (although I would recommend taking your suit jacket off when you
    get to the interview itself). However, make sure that whatever you wear fits properly:
    don’t be the classic stereotype of a geek wearing a suit two sizes too large.


    I’ve had people show up to interviews in jeans and a t-shirt before. Don’t do
    that ever. You will never make a bad impression by dressing up too much, however
    you certainly will by dressing too casually.


    # Handshake

    Never underestimate the importance of a good handshake. There are three types
    of handshake. The first is the weak, limp shake which a lot of geeks suffer from
    as we tend to be timid. You are making a statement about the type of person you
    are with your handshake. If yours has no-pressure then the conclusion is you are
    weak in the office: less likely to stand up at the whiteboard or to have strong
    opinions. All from just a handshake!


    The second sort of handshake is the bone crusher. At the very other end of the
    spectrum is the type of person who has heard that a strong handshake is important
    and as a result attempts to crush the other persons hand as a show of force and
    strength. Again, avoid this. It signifies you are an overbearing personality or
    you’re overcompensating for something. It also hurts! This is equally as bad as
    the limp handshake.


    Instead we want the third shake, the Goldilocks of handshaking: just right. A
    good handshake conveys confidence but without being over the top. It is firm,
    with good pressure, but without leaving the other person feeling they need to
    go to hospital with a broken hand. Unsurprisingly this takes practice. So practice!
    Ask your close colleagues, friends or family to practice with you. It can take
    only 3 minutes of testing out different pressures to figure out what a good handshake
    is for you but it can make a huge difference in your first impression. I was lucky
    enough in school to have a teacher who ran a lesson dedicated to this and it has
    stood me in good standing ever since.


    # First conversation

    The awkward moment where you finally have to talk. The two major things you need
    to consider here are what you want to say, and how you’re going to say it.


    Body language, mannerisms and tone are all understandably important. Your job
    is to convey to the interviewer that you are excited for the interview and job
    opportunity. You would be surprised by the number of candidates who sound like
    they have no interest in being at the interview. If your tone is dull and you
    sound like this is just another interview your recruiter is putting you through
    then why should the interviewer be willing to spend his time with you? Sound interested.
    Sound excited. Sound like you want the job!


    Go into your interview with some ideas for small talk. Again, we programmers tend
    to be a quiet bunch lacking in conversational skills. Chances are there’s going
    to be some point from when you’re collected in reception to the interview starting
    where you’re going need to fill the gap with conversation. This is a great opportunity
    for you to sell yourself, whether you’re talking about something you’re working
    on at the moment or just being honest about your nerves. It’s a chance to make
    a good impression and to bond with your interviewer. If you’re really struggling
    then ask questions. “What are you working on at the moment?”. “I was reading up
    on `Java 8` last night, have you seen the new stuff on default methods?”. It allows
    the other person to talk and takes the pressure off you, and is also a great way
    to build a relationship. People are usually better at talking than listening and
    will be pleased you’re asking questions and giving them the chance to talk. It
    sounds cheesy but it’s true.


    ## Interview Formats

    Once you’ve made your incredible first impression, the hard work begins. Depending
    on the stage of the interview the content may vary greatly so it’s important to
    know what you’re going in for. Make sure you talk to your recruiter or the hiring
    company before hand and ask what will be involved in the interview; how many people,
    how many stages, what sort of questions. Normally companies are happy to release
    this information to help you prepare. Never forget that the people interviewing
    you want you to get the job. They want you to be the amazing developer they’ve
    been looking for and you need to prove to them it’s you.


    ### Technical Interview

    This is the bread and butter of most interview processes, and the main focus of
    this book. A group of developers asking you a series of questions on `java` programming,
    algorithms and design. This is always going to be the most difficult part of any
    interview process. The domain space is so huge you could get asked anything, and
    some interviewers pride themselves in asking esoteric questions. However, most
    people aren’t like that and will limit themselves to a core set of questions.


    In preparation for a `Java` interview you have to make sure you’ve revised the
    core material. Even though you spend all day every day working in the code the
    fact is that most of the “complicated” parts of the language are infrequently
    used but regularly asked in interviews. At a minimum you need to revise the big
    three:


    *   Threading

    *   Collections

    *   Garbage Collection


    A natural extension on collections is to study algorithms as the questions will
    often revolve around writing an algorithm to sort a data structure. These too
    are covered later in the book.


    You are also quite likely to be asked about your design experience. One that seems
    to pop up regularly is “Tell me about something you’ve designed” or “tell me about
    the system you’re working on at the moment”. Normally you will be given a whiteboard
    and asked to sketch out the architecture and asked to explain as you go along.
    This is a nice open question and can give you a good opportunity to show off by
    engaging in discussions around technology choices and resilient design.


    Finally you are likely to get asked “fluffy” questions. A huge amount of being
    a developer has absolutely nothing to do with code. Development practices is a
    great example; I love to ask candidates about their experience with agile development
    for example. It allows a clear delineation between people who just do what they’re
    told and people who take an active interest in the development practices and understand
    their purposes. There’s also the non-technical questions that fit into this section:
    “What excites you about going to work?” is another one of my favourites.


    When answering these loose open ended questions don’t feel the need to launch
    straight into an answer and blab your way through. It’s ok to take the time up
    front to think of a good answer. This is not the sort of information people keep
    ready in their heads and the interviewer knows that.


    #### The Management Interview

