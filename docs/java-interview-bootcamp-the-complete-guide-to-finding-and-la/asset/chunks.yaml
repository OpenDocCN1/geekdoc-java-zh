- fmt: "\nAny objects that survive from survivor spaces in the New Generation are\
    \ promoted to the Old Generation. The Old Generation is usually much larger than\
    \ the New Generation. When a GC occurs in old gen it is known as a `full GC`.\
    \ Full GCs are also stop-the-world and tend to take longer, which is why most\
    \ JVM tuning occurs here. There are a number of different Algorithms available\
    \ for Garbage Collection, and it is possible to use different algorithms for new\
    \ and old gen.\n\n## Q: What type of Garbage Collectors are there?\n\n### `Serial\
    \ GC`\nDesigned when computers only had one CPU and stops the entire application\
    \ whilst GC occurs. It uses `mark-sweep-compact`. The collector goes through all\
    \ of the objects and marks which objects are available for Garbage Collection,\
    \ before clearing them out and then copying all of the objects into contiguous\
    \ space (so therefore has no fragmentation).\n\n### `Parallel GC`\nSimilar to\
    \ Serial, except that it uses multiple threads to perform the GC in order to be\
    \ faster.\n\n### `Concurrent Mark Sweep (CMS)`\nCMS GC minimises pauses by doing\
    \ most of the GC related work concurrently with the processing of the application.\
    \ This minimises the amount of time when the application has to completely pause\
    \ and so lends itself much better to applications which are sensitive to this.\
    \ CMS is a non compacting algorithm which can lead to fragmentation problems.\
    \ The CMS collector uses `Parallel GC` for the young generation.\n\n### `G1GC\
    \ (garbage first garbage collector)`\nA concurrent parallel collector that is\
    \ viewed as the long term replacement for CMS and does not suffer from the same\
    \ fragmentation problems as CMS.\n\n## Q: Which is better? Serial, Parallel or\
    \ CMS?\nIt depends entirely on the application. Each one is tailored to the requirements\
    \ of the application. Serial is better if you’re on a single CPU, or in a scenario\
    \ where there are more VMs running on the machine than CPUs. Parallel is a throughput\
    \ collector and really good if you have a lot of work to do but you’re ok with\
    \ pauses. CMS/G1GC is the best of the options if you need consistent responsiveness\
    \ with minimal pauses.\n\n## PermGen\n\n### Q: What is the PermGen?\nThe PermGen\
    \ is where the JVM stores the metadata about classes. It no longer exists in Java\
    \ 8, having been replaced with metaspace. Generally the PermGen doesn’t require\
    \ any tuning above ensuring it has enough space, although it is possible to have\
    \ leaks if `Classes` are not being unloaded properly.\n\n## From the code\n\n\
    ### Q: Can you tell the system to perform a garbage collection?\nThis is an interesting\
    \ question: the answer is both yes and no. We can use the call `System.gc()` to\
    \ suggest to the JVM to perform a garbage collection. However, there is no guarantee\
    \ this will do anything. As a java developer, we don’t know for certain what JVM\
    \ our code is being run in. The JVM spec makes no guarantees on what will happen\
    \ when this method is called. There is even a startup flag, `-XX:+DisableExplicitGC`,\
    \ which will stop this from doing anything.\n\nIt is considered bad practice to\
    \ use `System.gc()`.\n\n### Q: What does `finalize()` do?\n`finalize()` is a method\
    \ on `java.lang.Object` so exists on all `Objects`. The default implementation\
    \ does nothing. It is called by the garbage collector when it determines there\
    \ are no more references to the object. As a result there are no guarantees the\
    \ code will ever be executed and so should not be used to execute actual functionality.\
    \ Instead it is used for clean up, such as file references. It will never be called\
    \ more than once on an object (by the JVM).\n\n## JVM Tuning\n\n### Q: What flags\
    \ can I use to tune the JVM and GC?\nThere are textbooks available on tuning the\
    \ JVM for optimal Garbage Collection. You’ll never know them all! Nonetheless\
    \ it’s good to know a few for the purpose of interview.\n\n- `-XX:-UseConcMarkSweepGC`:\
    \ Use the CMS collector for the Old Gen.\n- `-XX:-UseParallelGC`: Use `Parallel\
    \ GC` for New Gen.\n- `-XX:-UseParallelOldGC`: Use `Parallel GC` for Old and New\
    \ Gen.\n- `-XX:-HeapDumpOnOutOfMemoryError`: Create a thread dump when the application\
    \ runs out of memory. Very useful for diagnostics.\n- `-XX:-PrintGCDetails`: Log\
    \ out details of Garbage Collection.\n- `-Xms512m`: Sets the initial heap size\
    \ to 512m `-Xmx1024m`: Sets the maximum heap size to 1024m\n- `-XX:NewSize` and\
    \ `-XX:MaxNewSize`: Specifically set the default and max size of the New Generation\n\
    - `-XX:NewRatio=3`: Set the size of the Young Generation as a ratio of the size\
    \ of the Old Generation.\n- `-XX:SurvivorRatio=10`: Set the size of Eden space\
    \ relative to the size of a survivor space.\n\n## Diagnosis\nWhilst all of the\
    \ questions above are very good to know to show you have a basic understanding\
    \ of how the JVM works, one of the most standard questions during an interview\
    \ is this:\n\nHave you ever experience a memory leak? How did you diagnose it?\n\
    \nThis is a difficult question to answer for most people as although they may\
    \ have done it, chances are it was a long time ago and isn’t something you can\
    \ recall easily. The best way to prepare is to actually try and write an application\
    \ with a memory leak and attempt to diagnosis it. Below I have created a ridiculous\
    \ example of a memory leak which will allow us to go step by step through the\
    \ process of identifying the problem. **I strongly advise you download the code\
    \ and follow through this process.** It is much more likely to be committed to\
    \ your memory if you actually do this process.\n\n```\n 1 import java.util.ArrayDeque;\n\
    \ 2 import java.util.Deque;\n 3 public class Main {\n 4     public static void\
    \ main(String[] args) {\n 5         TaskList taskList = new TaskList();\n 6  \
    \       final TaskCreator taskCreator = new TaskCreator(taskList);\n 7       \
    \  new Thread(new Runnable() {\n 8             @Override\n 9             public\
    \ void run() {\n 10                 for (int i = 0; i < 10000; i++) {\n 11   \
    \                  taskCreator.createTask();\n 12                 }\n 13     \
    \        }\n 14         }).start();\n 15     }\n 16     private static class TaskCreator\
    \ {\n 17         private Task taskList;\n 18         public TaskCreator(TaskList\
    \ taskList) {\n 19             this.taskList = taskList;\n 20         }\n 21 \
    \        public void createTask() {\n 22             taskList.addTask(new Task());\n\
    \ 23         }\n 24     }\n 25     private static class TaskList {\n 26      \
    \   private Deque<Task> tasks = new ArrayDeque<>();\n 27         public void addTask(Task\
    \ task) {\n 28             tasks.add(task);\n 29             tasks.peek().execute();//Memory\
    \ leak!\n 30         }\n 31     }\n 32     private static class Task {\n 33  \
    \       private Object[] array = new Object[1000];\n 34         public void execute()\
    \ {\n 35            //doostuff\n 36         }\n 37     }\n 38 }\n```\n"
