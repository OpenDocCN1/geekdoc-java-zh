    87 haz resource\n88 haz resource\n```\n\nIn this example we have a wrapper around\
    \ a resource called “Resource Carrier” and 3 threads that want access to it’s\
    \ resource. When it acquires the lock it sees the resource isn’t available and\
    \ goes into wait mode by calling wait() on the ResourceCarrier object. The ResourceCreator\
    \ swoops in later to create the resource and calls notify on the ResourceCarrier,\
    \ at which point the three threads spring back to life.\n\n### Deadlock\n\n**Q:\
    \ What is a deadlock?**\n\n**Q: How do we prevent deadlocks?**\n\nMany candidates\
    \ completely fluff the answer to deadlock questions. It’s a very common interview\
    \ question, and it’s an easy enough concept to understand, but it can be tricky\
    \ to explain (particularly over the phone).\n\nA deadlock occurs when two or more\
    \ threads are awaiting the actions of each other which prevents any further processing\
    \ from happening. For example, Thread A has the lock on Object 1 and attempts\
    \ to require a lock on Object 2 to continue. Simultaneously, Thread B has a lock\
    \ on Object 2 and attempts to acquire a lock on Object 1\\. As a result both Threads\
    \ are kept busy waiting for the other one, which will never release. This is a\
    \ deadlock.\n\nThe easiest way to prevent deadlock is to ensure that the ordering\
    \ of acquisition for locks is consistent. If both Threads try to acquire Object\
    \ 1 then Object 2 in that order then deadlock will not occur. It is important\
    \ to code defensively when acquiring locks. Even better is to make synchronized\
    \ blocks as small as possible and where possible avoid locking multiple objects.\n\
    \n**Q: What is Livelock?**\n\nIn deadlock, the Threads will stop working and await\
    \ the resource to become free. In Livelock the separate Threads do not stop; they\
    \ will continue working trying to resolve the block. However by doing so the blockage\
    \ continues and will not resolve. This can happen in situations where, if a Thread\
    \ cannot access the resources it requires, will go back to the start of processing\
    \ and retry the work in a loop until success. Imagine the classic bank account\
    \ example. If there is a simultaneous transaction from Account A to Account B\
    \ and Account B to Account A; Both accounts are debited, but when the crediting\
    \ of the account takes place the account is already locked. The transactions are\
    \ reverted and reattempted. This will continue ad infinatum with the work being\
    \ attempted; hence, “live” lock.\n\n**Q: What is Thread Priority?**\n\nThread\
    \ has a method on it, setPriority() which takes an int representing the priority\
    \ level. Thread has some constants on it you can use: Thread.MIN_PRIORITY, Thread.MAX_PRIORITY\
    \ and Thread.NORM_PRIORITY.\n\nHowever, like all things threading and JVM related,\
    \ you cannot rely on it to behave in a consistent fashion particularly across\
    \ different systems and operating systems. The actual way priority levels varies\
    \ from system to system, and the CPU can choose to behave in any way it wants.\
    \ Maybe for priorities above a certain level it will give even a dedicated percentage\
    \ of time for. In the same fashion, you don’t know what other processes are being\
    \ run. You may have a background thread you set to a low value, but if there is\
    \ some other process running on the machine at a slightly higher priority your\
    \ Thread may never get run.\n\nNonetheless, it can work well. Check the following\
    \ example:\n\n```\n 1    public static void main(String[] args) {\n 2     Thread\
    \ thread = new Thread(new Counter(1));\n 3     thread.setPriority(Thread.MAX_PRIORITY);\n\
    \ 4     Thread threadTwo = new Thread(new Counter(2));\n 5     thread.setPriority(Thread.MIN_PRIORITY);\n\
