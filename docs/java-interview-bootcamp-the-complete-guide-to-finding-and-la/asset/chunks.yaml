    \ = 0; i < 100; i++) {\n 9             System.out.println(\"Hi there!\");\n10\
    \         }\n11     }\n12 }\n```\n\nWe pass the new Runnable to a Thread to start\
    \ it. We always use **start()** to run the thread; using run() will run execute\
    \ in the same thread as the caller.\n\n**Q: How do we stop a Thread in java?**\n\
    \nThere is actually no API level way to stop a Thread reliably in java. The only\
    \ guarantee is that when the code being executed in the thread completes, the\
    \ thread will finish. It is therefore down to the developer to implement a way\
    \ of telling a Thread to stop.\n\n```\n 1 public class SayHelloRunner implements\
    \ Runnable {\n 2     private volatile boolean running = true;\n 3 \n 4     public\
    \ void stopIt(){\n 5         running = false;\n 6     }\n 7 \n 8     @Override\n\
    \ 9     public void run() {\n10         while(running)\n11             System.out.println(\"\
    Hi there!\");\n12     }\n13 }\n```\n\nAs you can see in the above example the\
    \ flag to check if the thread is running or not has the keyword volatile.\n\n\
    **Q:What is the volatile keyword?**\n\nIn modern processors a lot goes on to try\
    \ and optimise memory and throughput such as *caching*. This is where regularly\
    \ accessed variables are kept in a small amount of memory close to a specific\
    \ processor to increase processing speed; it reduces the amount the processor\
    \ has to go to disk to get information (which can be very slow). However, in a\
    \ multithreaded environment this can be very dangerous as it means that two threads\
    \ could see a different version of a variable if it has been updated in cache\
    \ and not written back to memory; *processor A* may think int i = 2 whereas *processor\
    \ B* thinks int i = 4\\. This is where **volatile** comes in. It tells Java that\
    \ this variable could be accessed by multiple threads and therefore should not\
    \ be cached, thus guaranteeing the value is correct when accessing. It also stops\
    \ the compiler from trying to optimise the code by reordering it.\n\nThe downside\
    \ is that there is a performance penalty on using volatile variables. There is\
    \ a greater distance to travel to get access to the information as it cannot be\
    \ stored in the cache. However volatile is usually a much better option speed\
    \ wise than using a synchronize block as it will not cause threads to block and\
    \ as such is much faster than other options for synchronisation.\n\n**Q: Explain\
    \ the synchronized keyword. What does it do? Why do we need it?**\n\nSynchronized\
    \ is a keyword in java that can be used as a block around a piece of code or as\
    \ part of the method signature.\n\n```\n 1 public class Bank {\n 2     private\
    \ int funds = 100;\n 3     \n 4     public void deposit(int money){\n 5      \
    \   synchronized (this){\n 6             funds += money;\n 7         }\n 8   \
    \  }\n 9     \n10     public synchronized void withdraw(int money){\n11      \
    \  if(funds > money) \n12           funds -= money;\n13     }\n14 }\n```\n\nSynchronized\
    \ exists in Java to allow multiple threads which can both see an object to safely\
    \ access it to ensure that the data is correct. The classic example is that of\
    \ the bank account. Imagine if you remove the synchronisation from the above example.\
    \ Thread one attempts to remove 100 from the account. At the exact same time,\
    \ Thread two attempts to remove 100 from the account. For both threads when checking\
    \ if there are sufficient funds the if statement returns true, resulting in the\
    \ both withdrawing and a resultant balance of -100 which is not allowed. By using\
    \ synchronized only a single thread can access the section of code in the synchronized\
    \ block, which can help us to ensure correct state."
