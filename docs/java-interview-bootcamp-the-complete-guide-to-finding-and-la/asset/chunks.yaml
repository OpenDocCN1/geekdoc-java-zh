    \ 1 public static void main(String[] args) throws InterruptedException, ExecutionExc\\\
    \n 2 eption {\n 3     Callable<String> callable = new StringCallable();\n 4  \
    \   Callable<String> callable2 = new StringCallable();\n 5     Callable<String>\
    \ callable3 = new StringCallable();\n 6     Callable<String> callable4 = new StringCallable();\n\
    \ 7     \n 8     ExecutorService executorService = Executors.newFixedThreadPool(4);\n\
    \ 9     List<Future<String>> futures = executorService.invokeAll(asList(callable,\
    \ ca\\\n10 llable2, callable3, callable4));\n11     for (Future<String> future\
    \ : futures) {\n12         System.out.println(future.get());\n13     }\n14   \
    \  }\n15     //pool-1-thread-1\n16     //pool-1-thread-2\n17     //pool-1-thread-3\n\
    18     //pool-1-thread-4\n```\n\n**Q: What is ThreadLocal?**\n\nThreadLocal allows\
    \ a different instance of a variable for each Thread that accesses it. Normally\
    \ this will be a static variable used to store state like a UserID or session.\
    \ This can also be particularly useful when an object is not Thread Safe but you\
    \ want to avoid synchronising.\n\n## Big O Notation\n\nI hate big O notation.\
    \ For as long as I can remember it’s been my biggest achilles heel. It’s just\
    \ something I’ve never managed to successfully motivate myself to learn about\
    \ despite knowing it’s going to come up in every single interview. I’ll get asked\
    \ to implement an algorithm which I’ll do via brute force to start with: “What\
    \ is the Big O of that?”. “I don’t know Big O but I know it’s slow”.\n\nIt’s fairly\
    \ obvious, but this is the wrong approach. Take the time to really read this chapter\
    \ and maybe even do some extra research. This seems to be a question that comes\
    \ up consistently at interviews so it’s worth taking the time.\n\n### What on\
    \ earth is Big O?\n\nBig O is the way of measuring the efficiency of an algorithm\
    \ and how well it scales based on the size of the dataset. Imagine you have a\
    \ list of 10 objects, and you want to sort them in order. There’s a whole bunch\
    \ of algorithms you can use to make that happen, but not all algorithms are built\
    \ equal. Some are quicker than others but more importantly the speed of an algorithm\
    \ can vary depending on how many items it’s dealing with. Big O is a way of measuring\
    \ how an algorithm scales. Big O references how **complex** an algorithm is.\n\
    \nBig O is represented using something like O(n). The O simply denoted we’re talking\
    \ about big O and you can ignore it (at least for the purpose of the interview).\
    \ *n* is the thing the complexity is in relation to; for programming interview\
    \ questions this is almost always the size of a collection. The complexity will\
    \ increase or decrease in accordance with the size of the data store.\n\nBelow\
    \ is a list of the Big O complexities in order of how well they scale relative\
    \ to the dataset.\n\n**O(1)/Constant Complexity:** Constant. This means irrelevant\
    \ of the size of the data set the algorithm will always take a constant time.\n\
    \n*1 item takes 1 second, 10 items takes 1 second, 100 items takes 1 second.*\n\
    \nIt always takes the same amount of time.\n\n**O(log n)/Logarithmic Complexity:**\
    \ Not as good as constant, but still pretty good. The time taken increases with\
    \ the size of the data set, but not proportionately so. This means the algorithm\
    \ takes longer per item on smaller datasets relative to larger ones.\n\n*1 item\
    \ takes 1 second, 10 items takes 2 seconds, 100 items takes 3 seconds.*\n\nIf\
    \ your dataset has 10 items, each item causes 0.2 seconds latency. If your dataset\
    \ has 100, it only takes 0.03 seconds extra per item. This makes log n algorithms\
    \ very scalable.\n\n**O(n)/Linear Complexity:** The larger the data set, the time\
    \ taken grows proportionately.\n\n*1 item takes 1 second, 10 items takes 10 seconds,\
    \ 100 items takes 100 seconds.*\n\n**O(n log n):** A nice combination of the previous\
    \ two. Normally there’s 2 parts to the sort, the first loop is O(n), the second\
    \ is O(log n), combining to form O(n log n)\n\n*1 item takes 2 seconds, 10 items\
    \ takes 12 seconds, 100 items takes 103 seconds.*\n\n**O(n ²)/Quadratic Complexity:**\
    \ Things are getting extra slow.\n\n*1 item takes 1 second, 10 items takes 100,\
    \ 100 items takes 10000.*\n\n**O(2 ^n): Exponential Growth!** The algorithm takes\
    \ twice as long for every new element added.\n\n*1 item takes 1 second, 10 items\
    \ takes 1024 seconds, 100 items takes 1267650600228229401496703205376 seconds.*\n\
    \nIt is important to notice that the above is not ordered by the best to worst\
    \ complexity. There is no “best” algorithm, as it completely hinges on the size\
    \ of the dataset and the task at hand. It is also important to remember the code\
    \ maintenance cost; a more complex algorithm may result in an incredibly quick\
    \ sort, but if the code has become unmaintainable and difficult to debug is that\
    \ the right thing to do? It depends on your requirements."
