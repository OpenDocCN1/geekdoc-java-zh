  trans: '


    *   组织团队在每周论坛上相互进行演演示

    *   对开源项目做出贡献

    *   成为社区（如敏捷小组）的成员

    *   参加过如 `Startup Weekend` 或 `Angelhack` 等活动。


    正是这些额外的工作能让你在竞争激烈的市场中脱颖而出。


    ## 教育背景


    阅读你简历的 99% 的人并不在乎你的教育背景。许多程序员并非来自计算机科学背景，有些人甚至没有学位。在开发岗位上，你的工作经验比学位重要得多。写上你的学位，也许可以把你的
    `A Levels` 也写一行，仅此足够了。将此部分放在文档末尾。它并不重要，所以不要在上面浪费过多的空间。


    ## 技术列表


    别这么做。不知道为什么，越来越多的简历附带了一份候选人曾接触过的每项技术列表。有些简历现在甚至在上面打了分，用来说说明申请者对每项技术的精通程度。如果你知道某个职位对特定技术有需求，那么请调整你的经验部分，解释你在这方面如何表现得出色。如果你有想涵盖但在其他章节都不合适的内容，可以开一个小的“技能”部分。无论你做什么，都不要只写技术列表。这不会给任何人留下印象，而且面试官可能会就其中任何一项技术刁难你。如果你不觉得自己能够深入回答关于某项技术的面试问题，就不要列出它！


    关于这一点以及如何构建优秀的简历，`Core Java Interview Questions Podcast` 中有很多非常棒技巧，主持人是 `Sarah
    Sellers`，她是一位帮助候选人方面经验丰富的招聘官。你可以在 `http://www.corejavainterviewquestions.com/podcast5`
    收听。


    ### 候选人脱颖出的顶级技巧


    *   如果你在之前的职位中做过任何“额外工作”，请把它们写进去。这证明了你在工作中能够“尽力而为”。

    *   如果你有个人项目或参与贡献的共享项目，请列出它们。简历上附有 `github` 的候选人会留下深刻印象，因为这显示你非常热爱编程，以至于回家还要做更多。那是热情。

    *   如果你有个人网站或博客，请包含在内，但要确保它看起来良好并且在过去 6 个月内更新过。我见过一些糟糕的候选人网站，这会瞬间让我反感。确保你的网站美观且内容最新，这绝对可以为你赢得额外的加分。

    *   如果你在家里玩过某些技术，请列出它们以及你用它们做了什么。很多组织会限制你允许使用的技术；如果你回家玩玩 `NoSQL` 或 `node.js`，那么通过把这些写在简历上，你展示了更广泛的技术意识，这是一种受青的技能。


    ## 让它看起来漂亮


    我说大多数简历都没有脱颖而出时，我是非常认真的。它们只是一页页的文本块。一点设计就能产生巨大的差异。我是 `google docs` 的忠实粉丝；它们有一些基础且吸引人的模板，可以让你在一堆简历中脱颖而出一点。这不多，但通常足够了。


    ## 电话面试


    我非常喜欢在招聘流程的开始使用电话面试。作为一名招聘者，我需要某种方式来过滤投过来的数百名候选人。我已经接受了大多数人写简历写得很糟糕，有些人甚至纯粹在歪曲事实，所以在与某人面对面之前，我发现和他们通话
    20 分钟是有用的，以确保他们确实懂 `java` 并了解他们的背景。作为候选人，这也是一个留下良好印象的机会。许多人担心自己在电话中无法表现出真实水平（事实上，失败的候选人经常以此为理由），然而，只要有几条关键建议，你就可以确保在人群中颖而出。


    ### 准备你的 Java 电话面试


    你可能面对的是招聘官，也可能直接面对公司。无论哪种情况，都要联系他们并了解电话面试的准确细节。你想要尽可能做好充分准备。具体来说，你应该询问：


    *   面试将持续多久？

    *   会问什么样的问题？如果你能得到这个答案就很幸运了，但知道问题是更倾向于技术还是侧重于设计是好的。电话面试往往带有技术倾向，因为在没有纸或白板的情况下，设计面试很难进行。这绝对值得一问，因为你可能会走运获得一些有助于你准备的宝贵信息。

    *   电话中有几个人？他们是谁？只有一个或两个人的电话面试通常更容易，因为你可以识别出谁是谁，并了解他们的兴趣和提问风格。人多会让面试稍微困难一点。


    现在是时候静下心来看书复习了。你可能会遇到很多“Java 中这个东西是做什么的？”类型的问题，因为这些在电话里很容易回答。它们不一定是好问题，但是面试官倾向于求回的问题。


    确保每当你预约了面试时，都有一个`安静私密的地方去`。确保你在面试官预定来电前 `5 分钟` 到达。没有什么比因为手忙脚乱而开始通话更糟糕了。作为面试官，我的时间有限；我倾向于将电话面试安排在一起或插在会议之间。如果你浪费了
    5 分钟，你就失去了一个给面试官留下印象的机会。


    确保你`随身带一份简历`。面试官也会有一份，并会询问你。我猜你可能记得自己在简历上写了什么，所以把它们放在手边。当有人问及你简历的某部分而你完全不知道他们在说什么时，那会非常尴尬。


    确保你在面试结束时有一份`准备好的问题列表`。你会被问到，快速做出反应很重要。我想知道你很在乎我招聘的这个职位，并且花了几 30 秒查看职位描述并想了解更多。面试官（以及大多数人）都是自恋的。无论这是否只是简单的“我希望能多听你介绍一下职位”，只需确保你不要沉默
    5 秒好像你没预料到会问这个问题。准备好 2 或 3 个问题。无论你是否真的想要答案，提问的行为本身很重要。


    对于极其懒惰的人，这里有一个示例问题列表：


    *   请你能多介绍一下你的团队吗？规模有多大？经验水平如何？

    *   团队位于一个地区还是地理上分散的？

    *   团队是如何运作的？你们使用敏捷开发吗？

    *   你目前工作中最大的挫败感是什么？

    *   在公司和团队工作中，你最喜欢的部分是什么？

    *   典型的一天是怎样的样的？

    *   有哪些培训？


    '
- fmt: "\nIt’s also an opportunity to impress and show off. Say you know the people\
    \ you’re interviewing are really keen on a technology or technique, like `Test\
    \ Driven Development`. Use your questions to promote yourself! “I’m a huge fan\
    \ of `TDD` and was wondering how exactly do you use it in your team?”. Or “I’ve\
    \ always wanted to learn `TDD` but have never been given the opportunity. I find\
    \ the concept really exciting. Do you think the learning curve is manageable?”.\
    \ This is music to an interviewers ears because you actually care. If I’m doing\
    \ 3 interviews a day, 5 days a week things like this really make a big difference.\n\
    \n### Tips for giving the best impression\n\nWhen your phone rings, think positive.\
    \ Be positive. Sound happy. As cheesy as this sounds, the old adage of “you have\
    \ 7 seconds to make a first impression” is spot on. The amount of candidates I\
    \ call that sounds grumpy and/or uninterested is crazy. This instantly turns an\
    \ interviewer against you and unless you nail all the questions you’re going to\
    \ have a hard time getting through. Conversely, if you pick up the phone, sound\
    \ excited and tell the interviewer you’ve been looking forward to the interview\
    \ then you’re in the positive books from the start.\n\nSpeak slowly. You don’t\
    \ want to rattle through the interview at lightening pace. But, don’t speak so\
    \ slowly as to bore the interviewer. Most importantly, know when to stop. I’ve\
    \ had candidates give me 5 minute monologues on `Spring` before I’ve had to step\
    \ in. Being able to craft a succinct answer is a hugely important skill, not just\
    \ in interviewing but as a `java` developer. It takes practice but it is well\
    \ worth it. If you’re worried about not answering the question fully, simply say\
    \ “is that ok or would you like me to continue?”. Chances are the interviewer\
    \ will have picked up on something you’ve mentioned and will change the direction\
    \ of the question or ask a new one. If not they may simply ask you to continue\
    \ and you can keep talking. Some quick don’ts:\n\n*   Don’t sound bored\n*   Don’t\
    \ chew gum\n*   Don’t google answers (`we can hear the keyboard`)\n*   Don’t interrupt\
    \ the interviewer\n*   Don’t be afraid to say you don’t know. Trying to guess\
    \ your way through isn’t going to fool anyone. If I’m asking the question then\
    \ I probably know the answer. It’s absolutely fine to say “I don’t know about\
    \ that, but I’m happy to try and work it out if you’d like”. That way everyone\
    \ knows you’re not trying to lie your way through. Candidates capable of admitting\
    \ they don’t know will always gain respect.\n\n### What you will get asked during\
    \ the interview\n\nDue the limitations of the telephone you can be fairly certain\
    \ that the questions will be based in one of four categories:\n\n*   `Core Java`:\
    \ threading, exceptions, data structures & algorithms, object oriented programming\
    \ etc. This is the basic stuff you simply need to take the time to revisit. Whether\
    \ or not they are good questions to ask to determine your ability is irrelevant;\
    \ most interviews will fall back on this so it’s good to be prepared. Reading\
    \ the second half of `Java Interview Bootcamp` is the best place to start.\n*\
    \   Technology discussion. “Have you used technology X (or “I see from your CV\
    \ you’ve used X)?”, “Can you tell me about it? What do you think of it?”. My default\
    \ go-to topics are `Spring` and `Hibernate` as they have a lot of questions that\
    \ can lead from the initial one and really go into depth. They also appear on\
    \ most people’s CVs. This is the sort of question I prefer to ask as you can get\
    \ a proper understanding of a candidates knowledge and whether they understand\
    \ the tools they use, or if they just use them because they’re told. Look at the\
    \ core technologies on your resume and figure out what your opinion is on them.\
    \ The interviewer most likely won’t care what the opinion is specifically, more\
    \ that you can articulate the pros and cons of each side and draw a conclusion.\n\
    \    *   Techniques. I love asking about these. Every office works differently;\
    \ agile vs waterfall (yes, waterfall still exists), `TDD/BDD/other DD`, programming\
    \ style etc. Again, if you have put these on your CV then you need to be sure\
    \ you have good answers for your experience with them. If your department uses\
    \ `TDD` so you’ve put it on the CV but you don’t actually do it you’re going to\
    \ look bad. Again review your CV and look at what you’ve listed; come up with\
    \ strong explanations for each of them.\n    *   Riddles. This is made up of the\
    \ google-esque questions like “how many grains of sand are there in the world?”\
    \ and “What would you do if you were stuck in a lift for an hour and a half?”.\
    \ It’s good to try and read up on some of these just to get comfortable with answering\
    \ them, but in reality they’re not something you can do a great amount of study\
    \ for. Personally I’m not a big fan of these, but every interviewer is different.\n\
    \nTry not to guess what the interviewer is looking for or what you think the interviewer\
    \ believes is the “right” answer. They may intentionally lead you down the wrong\
    \ path to see if you’re a “yes man”. Stick to your opinions even if they seem\
    \ controversial. Be polite, be honest, and try to engage in an open discussion.\
    \ The person on the other side of the phone isn’t a robot so try and engage the\
    \ human side and have a 2 way conversation. If a candidate fires a question back\
    \ at me during an answer I tend to enjoy it. An interview should be two way.\n\
    \n### After the interview\n\nNormally you should have a pretty good idea of how\
    \ you’ve done, but don’t fret. I’ve had candidates who thought they’d tanked who\
    \ were actually good. Conversely I’ve had terrible people who thought they had\
    \ done brilliantly. Simply wait to hear back from them and relax comfortable in\
    \ the knowledge you’ve done your best. If you don’t make it through then don’t\
    \ sweat it. The fact is that every interviewer is different and every company\
    \ values different things and you may not fit into the team at that time. That’s\
    \ ok. Just keep applying to different roles. On top of this there is a human element;\
    \ maybe the interviewer woke up on the wrong side of the bed, or they haven’t\
    \ had lunch yet so they’re hungry. \n\nThe vast majority of interviews you are\
    \ likely to undertake during a recruitment process will be a variation of the\
    \ face to face interview as discussed earlier in the book, there are a huge number\
    \ of variations a recruiter can pick and choose from. Although there are tips\
    \ and tricks specific to each one there are some key tenets that run through them\
    \ all which enable you to best represent yourself as a candidate. Whilst having\
    \ the technical skills for the role is obviously crucial the reality is that success\
    \ is often determined by gut feel it is cliche, and I’ve already said it multiple\
    \ times, but first impressions really are everything. The initial meeting can\
    \ be the difference between success and failure even though you’ve not answered\
    \ a single question. Although I think any bias is unconscious, people will ask\
    \ easier questions of candidates that they like from the initial introduction\
    \ alone (and vice versa harder questions for difficult candidates.\n\n### First\
    \ impressions\n\nBut what makes a good first impression?\n"
