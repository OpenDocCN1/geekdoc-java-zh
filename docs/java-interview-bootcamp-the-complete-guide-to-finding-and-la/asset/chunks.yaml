    All of the people you are going to talk to during the interview process will have
    differing opinions on what makes a good developer. If there was a standardised
    exam or some other way of telling a good developer from a bad one then it would
    make hiring a whole lot easier (and no, being a `Sun Certified Java Programmer`
    does not even come close). Every interview you go to is going to have different
    questions and each interviewer is going to have a different set of values. One
    may value polyglot developers. Another may value `TDD` and `BDD`. The next may
    believe all code should be done in notepad and hand compiled. There is no golden
    bullet.


    As a candidate it can be hard to remember this. Perhaps your CV isn’t getting
    you interviews, or maybe you’ve been on a couple of interviews and haven’t progressed.
    Your head drops and you conclude that you’re stuck where you are and that you’re
    not good enough to get a new job.


    The reality is that you’ve just not found a place that aligns with your values
    yet, and that’s ok.


    What you want from a job may make it easier or harder for you to find a role.
    For me, I hate big-o notation and performance questions because I have google
    nearby and I believe people have a tendency to prematurely optimise code; real
    performance problems happen very rarely. That means there are interviews where
    I come out and I know I have done terribly, and I don’t care. I’m comfortable
    knowing I don’t want to work for that team because their values don’t align with
    mine. Does that make it harder for me to get a job? Yes, but it means that when
    I find a role it’s the one that I really want. You spend most of your waking life
    at work, so you may as well spend the time to get it right.


    This is a roundabout way of saying that there is no golden template for your resume.
    You can send a CV to 5 different people and get 5 different responses. All you
    can do is bullet proof your document so you don’t have stupid things like spelling
    errors (which happens a lot) and then use your text to craft a message that makes
    you as desirable as possible to the type of people you want to work for.


    ## Resume Format


    ### How long should it be?


    This is the source of much debate. My view is vehemently that if possible, it
    should be one page (with an absolute maximum of two). People don’t have time to
    read resumes in detail and they don’t care what school you went to or your last
    15 jobs. They want a brief sales pitch about why your skills fit the job. By keeping
    it brief and packed with only important information you’re making the job much
    easier for the reader whilst demonstrating your ability to communicate concisely.


    On the other side it should be noted that in the past I have been told by recruiters
    to bulk out my CV. If you’re working with a recruiter they will often cut up and
    edit your CV as appropriate for roles anyway. As a result I keep 2 copies of my
    CV; the first is a brief, single pager with my key roles and experience condensed
    down. The other is a 2 pager with as much stuff crammed in as possible for recruiters
    to work with.


    Do not be tempted to create a 15 page tome with thousands of words. When I receive
    these it’s an instant red flag. Bigger is not better and you’re just highlighting
    your inability to communicate effectively. If the company needs your history going
    back 15 years then they will come and ask you for it at a later date. A resume
    is your sales document to say what your best skills are with clear examples of
    you using those skills to achieve great things. Let me say that again. **Your
    CV is your opportunity to say what your best skills are**. It should be achievement
    focused, showing what your amazing talents are, and what they’ve helped you to
    achieve.


    ### Opening blurb


    Not all candidates include this but I think it’s the most important part. This
    is a single paragraph introduction to you and your brand. What do you stand for?
    What do you care about? Think of this as your elevator pitch, where you can outline
    what makes you great and why someone should hire you. Talk about what your passions
    are; maybe you love `TDD`, or you think of yourself as the tsar of concurrency.
    Start off with this. It’s a nice way to set the stall at the start of the document.


    Avoid being tacky in your opening blurb. Don’t forget there is a person on the
    other side that’s going to be reviewing this; candidates seem to love piling in
    as many buzzwords as they can: “self motivating with attention to detail”. What
    does that even really mean? I can guarantee the person reading your CV won’t know.
    If someone asked you during the interview what about you exemplifies those skills
    could you answer it? I’m guessing not convincingly. Aim to write in a clean and
    simple fashion. If there are some buzzwords you want to put make sure that you
    have the material to back it up; my CV talks about how I’m a passionate technologist,
    which I then back up with outside of work projects and examples of where I’ve
    used that passion in my roles.


    The simple fact is, most of it won’t get read. The person recruiting has a lot
    of these to read through so will likely read only this paragraph and if you’re
    lucky skim the rest. Get this section right and put your most impressive material
    first.


    ### Employment history


    You don’t need more than the last 5 years or the last 3 roles, whichever is smaller.
    This should be brief and focus on what **you** produced and how **you** did it.
    It’s incredible how many summaries I read which tell me all about the history
    of company X where the candidate worked and the ambitious project that company
    was executing. That tells me nothing about the person behind the resume. Here
    is an example of what not to do:


    ```

    Senior Java Developer, Awesome Co. July 2012-2014

    Awesome Co. are one of the worlds investment banks. Based in New York and with
    offices around the world the company prides itself on a customer centric approach.

    I was working on Project X. This project was a 200m investment to create a next
    generation platform over an ambitious 3 year period based on Java and NoSQL technology.
    The project has a strong focus on agile delivery and creating a latency system

    ```


    You’ll notice there’s almost no reference to the candidate. Too many programmer
    resumes are formed like this. Compare this instead to the following resume:


    ```

    Senior Java Developer, Awesome Co. July 2012-2014

    Successfully lead a team of 6 developers using agile methodologies and iterative
    delivery on an ambitious timeline to produce an industry leading platform.

    - I introduced the use of iterative delivery and story planning which allowed
    us to accurately predict our velocity and allowed us to consistently deliver to
    production every 2 weeks.

    - I created a comprehensive NFT framework which allowed us to run regressions
    quickly and ensure we were meeting the high standards set by the business

    - Led the design of the system and introduced ActiveMQ and MongoDB to produce
    an exceptionally quick and easily tested system; all code was built using TDD

    ```


    This time the entire article is focused on the candidate. I now know what they
    have done and what they have achieved. It’s a much more convincing sales pitch.


    Also, people love lists. A list of achievements is much easier to parse. Use lists
    as much as possible!


    ### Extra curricular activities


    If you’ve done stuff in your job which is extra to your regular role you need
    to shout about it. The best candidates want more than to come in, code for 8 hours
    and then go home. If you’ve been on a course or training that you think is pertinent
    then put it down. Here’s some ideas; if you’ve not got any of these then start
    them now!


    *   Any innovation projects you may have done, or tools and techniques pioneered.
    For example, maybe you introduced `JIRA` into your organisation.

    *   Organised guest speakers to come and speak to the team

