    *   Organised teams to do presentations to each other in a weekly forum

    *   Contributions to Open Source

    *   Member of a community such as an agile group

    *   Participated in events like `Startup Weekend` or `Angelhack`.


    It’s this kind of extra work that can make you a stand out candidate in a competitive
    marketplace.


    ## Education


    99% of people reading your CV will not care about your education. A lot of programmers
    have come from non-CompSci backgrounds, and some don’t even have degrees. Your
    vocational experience is infinitely more important in a development role. Include
    your degrees, and maybe a line on your `A Levels`, nothing more. Put this section
    at the end of the document. It’s unimportant so waste as little space as possible
    on it.


    ## List of technologies


    Don’t do it. For some reason more and more resumes come with a list of every technology
    the candidate has ever touched. Some CVs even have scores on them now to say how
    proficient in each technology the applicant is. If you know a role is keen for
    a specific technology then tailor your experience section to explain how you’re
    awesome at this. If you have stuff you want to cover off that hasn’t been suitable
    in any other section then have a small “skills” section. Whatever you do, don’t
    just write a list of technologies. It impresses no one and the interviewer could
    call you out on any of those technologies. If you don’t feel comfortable being
    able to answer in depth interview questions on a technology then don’t list it!


    There are some great tips related to this and building a good CV in the `Core
    Java Interview Questions Podcast` with `Sarah Sellers`, a recruiter with a lot
    of experience in helping candidates out. You can listen at `http://www.corejavainterviewquestions.com/podcast5`.


    ### Top tips for standing out as a candidate


    *   If you’ve done any “extras” in previous roles, then put these in. It proves
    that you go “above and beyond” in your role.

    *   If you have personal projects or shared projects you contribute to then list
    these. Candidates with their `github` on the CV make a big impression as it shows
    you like coding so much you go home and do even more of it. That’s passion.

    *   If you have a personal website or blog then include it, but make sure it looks
    good and has been updated in the last 6 months. I’ve seen some terrible candidate
    websites, and it instantly puts me off. Make sure your site is looking good and
    up to date and it can absolutely earn you some extra credit.

    *   If you’ve been playing around with technologies at home then list them and
    what you’ve been doing with them. A lot of organisations will limit the permitted
    technoligies you are allowed to use; if you then go home and play with `NoSQL`
    or `node.js` then by putting this on your resume you are displaying a wider awareness
    of technology which is a sought after skill.


    ## Make it look pretty


    I’m being very serious when I say most CVs don’t stand out. They’re just blocks
    of text going into pages and pages. Having just a little bit of design can be
    a big difference. I’m a huge fan of `google docs` for this; they have some basic
    attractive templates which can make you stand out just a little from the rest
    of the pile. It’s not much, but it’s often enough.


    ## Phone Interviews


    I’m a huge fan of using a phone interview at the start of my hiring process. As
    someone trying to recruit it’s important that I have some way of filtering the
    hundreds of candidates that get sent through. I’ve come to accept most people
    are terrible at writing a resume, and some just plain bend the truth, so before
    I meet someone face to face I find it’s useful to speak to them on the phone for
    20 minutes to ensure that they do know `java` and get an understanding of their
    background. As a candidate it’s also an opportunity to make a good first impression.
    Many people panic that they won’t be able to do themselves justice over the phone
    (and indeed, candidates who fail often cite this as a reason), however with a
    few pieces of key advice you can be sure to come on top of the pack.


    ### Preparing for your Java phone interview


    You may be dealing with a recruiter or with the firm directly. Either way, contact
    them and find out the exact details of the phone interview. You want to be as
    prepared as you can be. Specifically you should ask:


    *   How long will it be?

    *   What sort of questions will be asked? You’ll be lucky if you get an answer
    to this, but it’s good to know if the questions are more likely to be technical
    focused or design focused. Phone interviews tend to have a technical slant as
    design interviews are really hard to do without a piece of paper or a whiteboard.
    It’s certainly worth asking as you might hit lucky and get some gems of information
    to help you in your preparations.

    *   How many people will be on the call? Who will they be? Phone interviews with
    one or two people will generally be easier as you can identify who’s who and an
    understanding of their interests and question style. Above that will make it a
    little more difficult.


    It’s then time to simply to hit the books and get revising. Chances are you’re
    going to get a lot of “what does this thing in Java do?” type questions, as they’re
    easy to do over the phone. They’re not necessarily good questions, but they’re
    the questions interviewers tend to fall back on.


    Make sure that whenever you’ve booked your interview for you have `somewhere quiet
    and private to go`. Make sure you get there `5 minutes` before the interviewer
    is due to call. There is nothing worse than starting your call flustered because
    you don’t have a place to do it. As an interviewer I have a limited amount of
    time; I tend to bunch phone interviews to be back to back or slip them in meetings.
    If you waste 5 minutes then you’re losing an opportunity to impress the interviewer.


    Make sure you `have a copy of your CV with you`. The interviewer will have a copy
    too and will ask you about it. I would guess that you can’t remember what you’ve
    written on your resume so have it in front of you. It’s very embarrassing when
    someone asks you about a part of your CV and you have no idea what they’re talking
    about.


    Ensure you go in with a `pre-prepared list of questions for the end of the interview`.
    You will get asked and it’s important that you are quick to respond. I want to
    know that you care about the role I’m hiring for and have spent 30 seconds to
    look at the job description and want to know more. Interviewers (and people in
    general) are egotistical. It doesn’t matter if it’s a simple “I was hoping you
    could tell me more about the role”; just make sure you don’t spend 5 seconds in
    silence as if you hadn’t expected the question to be asked. Have 2 or 3 questions
    lined up. It doesn’t matter if you really want an answer, the act of asking is
    what matters.


    For the exceptionally lazy, here’s a list of example questions:


    *   Please can you tell me a bit more about the team? What size is it? What experience
    levels?

    *   Is the team based in one region or geographically split?

    *   How does the team work? Do you use agile?

    *   What’s your biggest frustration in your current job?

    *   What’s your favourite part of working at the company and in the team?

    *   What does an average day look like?

    *   How hard is it to use new technologies in your company?

    *   What training exists?

