  trans: "\n这些 `Object` 数组看起来有点奇怪。但我们如何知道这是否问题所在呢？`Visual VM` 允许我们获取快照，就像对当时的内存进行拍照一样。上面的截图是应用程序仅运行一小会儿后获取的快照。几分钟后的下一张快照证实了这一点：\n\
    \n![](img/java-heap-snapshot-2.png)\n\n我们可以通过在菜单中同时选择两者并选择 compare（比较）来直接对它们进行对比。\n\
    \n![](img/compare-heap-snapshots.png)![](img/compare-items-from-heap-snapshots.png)\n\
    \n这个对象数组确实有些不对劲。但我们该如何找到内存泄漏呢？通过使用 profile（分析器）标签页。如果我进入 profile 并在设置中启用“record\
    \ allocations stack traces”（记录分配栈跟踪），我们就能找到泄漏源于哪里。\n\n![](img/visual-vm-profile.png)\n\
    \n通过拍摄快照并显示分配轨迹，我们可以看到对象数组是在哪里被实例化的。\n\n![](img/memory-leak-source.png)\n\n看起来有成千上万\
    \ `Task` 对象持有对 `Object` 数组的引用！但是什么在持有这些 `Task` 项呢？\n\n如果我们回到“Monitor”（监控）标签页可以创建一个堆转储（heap\
    \ dump）。如果双击堆转储中的 `Object[]`，它将显示应用程序中所有的实例，在右下角的面板中我们可以识别引用的位置。\n\n![](img/memory-leak-object-references.png)\n\
    \n看起来 `TaskList` 是罪魁祸首！如果我们查看代码，就能看出问题所在。\n\n```\n1 tasks.peek().execute();\n\
    ```\n\n我们在完成操作后从未清除该引用！如果我们将其更改为使用 `poll()`，那么内存泄漏就解决了。\n\n虽然这显然是一个非常刻意的例子，但通过这些步骤将帮助你复习，以防你被要求解释将如何识别应用程序中的内存泄漏。寻找那些尽管发生了\
    \ GC（垃圾回收）但内存仍在持续增加的情况，获取内存快照并比较它们以查看哪些 `Objects` 可能是未释放的候选者，并使用堆转储分析是什么持有它们的引用。\n\
    \n# 多线程\n\n作为开发者，为了编写整洁、易懂且不会崩溃的代码，我们做的最好的事情就是避免在代码库中引入多线程。优秀的程序员可以将大多数问题分解为不需要复杂线程即可解决的问题。糟糕的程序员则会引入线程来修复他们不理解的问题，或者为了过早的优化。线程问题在面试中非常热门，因此能够证明对\
    \ Java 中线程如何工作、何时以及为何使用它们，以及如何安全地对它们进行编程有深度的理解至关重要。在本文中，我们将从基础开始处理线程，并涵盖回答任何出现的问题所需的需要的知识。\n\
    \n## 多线程简介\n\n**Q: 什么是线程（Thread）？**\n\n**Q: 如何在 java 中创建线程？**\n\n线程允许我们同时做多件事。没有\
    \ `Threads`，代码将按线性方式执行，一个命令接一个命令。通过使用线程，我们可以同时执行多个操作。这利用了计算机现在拥有多个处理器以及对任务进行时间分片处理的能力，因此多个线程甚至可以在单个处理器上运行。在\
    \ Java 中创建新 `Thread` 有两种主要方法。首先，你可以扩展 `Thread` 类并重写 `run` 方法来执行你的代码。\n\n```\n\
    \ 1 public class SayHello extends Thread {\n 2 \n3     public static void main(String[]\
    \ args) {\n 4         new SayHello().start();\n 5     }\n 6 \n 7     @Override\n\
    \ 8     public void run() {\n 9         for (int i = 0; i < 100; i++) {\n10  \
    \           System.out.println(\"Hi there!\");\n11         }\n12     }\n13 }\n\
    ```\n\n通常我们避免这样做。Java 没有多重继承，因此这种选项将限制你扩展其他任何内容。更重要的是，这并不是一种非常优雅的方法。作为优秀的开发者，我们的目标是优先考虑组合而非继承。方案二要好得多，允许我们实现\
    \ `Runnable` 接口并将其传递一个新的 `Thread` 对象。该接口有一个方法，`run`。\n\n```\n 1 public class SayHelloRunner\
    \ implements Runnable {\n 2     public static void main(String[] args) {\n 3 \
    \        new Thread(new SayHelloRunner()).start();    \n 4     }\n 5     \n 6\
    \     @Override\n 7     public void run() {\n 8         for (int i = 0; i < 100;\
    \ i++) {\n 9             System.out.println(\"Hi there!\");\n10         }\n11\
    \ }\n12 }\n```\n\n我们将新的 `Runnable` 传递给 `Thread` 以启动它。我们始终使用 `start()` 来运行线程；使用\
    \ `run()` 将将在调用者的同一个线程中执行。\n\n**Q: 如何在 java 中停止线程？**\n\n实际上，java 中没有 API 级别的方法可以可靠地停止一个\
    \ `Thread`。唯一的保证是当线程中执行的代码完成后，线程将结束。因此，实现一种告诉 `Thread` 停止的方法就取决于开发了。\n\n```\n\
    \ 1 public class SayHelloRunner implements Runnable {\n 2     private volatile\
    \ boolean running = true;\n 3 \n 4     public void stopIt(){\n 5         running\
    \ = false;\n 6     }\n 7 \n 8     @Override\n 9     public void run() {\n10  \
    \       while(running)\n11             System.out.println(\"Hi there!\");\n12\
    \     }\n13 }\n```\n\n正如上面的示例所示，检查线程是否运行的标志使用了 `volatile` 关键字。\n\n**Q: 什么是 volatile\
    \ 关键字？**\n\n在现代处理器中，有很多操作尝试优化吞吐量，例如缓存。这是将经常访问的变量保存在靠近处理器的少量内存中（这可能很慢）。但在多线程环境下是非常危险的，因为如果变量在缓存中更新但未写回内存，两个线程可能会看到不同的版本。它告诉\
    \ Java 该变量可能被多个线程访问，因此不应缓存，从而保证值的正确性。它还阻止了编译器通过重排代码来尝试优化。\n\n使用 `volatile` 变量的缺点是有性能开销。访问信息的距离更远，因为它无法存储在缓存中。然而，从速度来看，volatile\
    \ 通常比使用同步同步块要好得多，因为它不会导致线程阻塞，因此比其他同步选项快得多。\n\n**Q: 解释 synchronized 关键字。它是做什么的？为什么我们需要它？**\n\
    \nSynchronized 是 Java 中的一个关键字，可以作为代码块的包装，也可以作为方法签名的一部分。\n\n```\n 1 public class\
    \ Bank {\n 2     private int funds = 100;\n 3     \n 4     public void deposit(int\
    \ money){\n 5         synchronized (this){\n 6             funds += money;\n 7\
    \         }\n 8     }\n 9     \n10    public synchronized void withdraw(int money){\n\
    11        if(funds > money) \n12           funds -= money;\n13     }\n14 }\n```\n\
    \nSynchronized 存在于 Java 中，允许能够同一个对象的多个线程安全地访问它，以确保数据正确。经典的例子是银行账户。假设你移除上述示例中的同步处理。线程一尝试从账户中提取\
    \ 100。在同一时刻，线程二也尝试从账户中提取 100。对于两个线程，检查资金是否充足的 if 语句都返回 true，导致两者都提款并产生 -100 的余额，这是不允许的。通过使用\
    \ synchronized，一次只有一个线程可以访问同步块中的代码段，这有助于我们确保状态正确。\n\n"
- fmt: "\nWhen a `synchronized` keyword is placed on a method such as `withdraw(int\
    \ money)`, it has the same effect as wrapping all of a methods code in `synchronized(this)`\
    \ (which is the case in the `deposit` method in the example). If any `Thread`\
    \ tries to execute any `synchronized` method on the object it will be blocked.\n\
    \n## Q: What are the downsides of using synchronized? How can we avoid or mitigate\
    \ them?\n\nLocks are slow. Really slow. Particularly when using the `synchronized`\
    \ keyword, it can have a huge effect on performance. The reason for this is explained\
    \ wonderfully in a paper LMAX created on how they built `Disruptor`, a super low\
    \ latency concurrency component. It is a brilliant read for anyone who wants to\
    \ get into the fine details of threading and mechanical sympathy. You can access\
    \ it at [http://lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf](http://lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf).\n\
    \n“Locks are incredibly expensive because they require arbitration when contended.\
    \ This arbitration is achieved by a context switch to the operating system kernel\
    \ which will suspend threads waiting on a lock until it is released. During such\
    \ a context switch, as well as releasing control to the operating system which\
    \ may decide to do other house-keeping tasks while it has control, execution context\
    \ can lose previously cached data and instructions. This can have a serious performance\
    \ impact on modern processors.”\n\nYou don’t need to learn the contents of the\
    \ details of the quote; it should be sufficient to say that along with the impact\
    \ of threads being blocked whilst they wait for a resource, there is an impact\
    \ at an OS level which causes huge performance damage. In the same paper an experiment\
    \ is carried out to see the impact on latency of different types of lock; without\
    \ locking the process took 300ms, whereas with 2 threads contesting a lock it\
    \ took 224,000ms. Getting threading right is hard but getting it wrong has huge\
    \ consequences.\n\nIf you insist on using `synchronized` then minimising the size\
    \ of the code block that is synchronized is a good start. The smaller this is\
    \ will help to minimise impact. Even better, you can lock on specific objects,\
    \ or use a lock object if using a primitive, so that the entire object does not\
    \ need to be contended.\n\n```\n 1 public class Bank {\n 2     private int funds\
    \ = 100;\n 3     private Object fundLock;\n 4 \n 5     private UserDetails details\
    \ = new UserDetails();\n 6 \n 7     public void deposit(int money){\n 8      \
    \   synchronized (fundLock){ //Lock Object needs to be acquired to update fu\\\
    \n 9 nds \n10             funds += money;\n11         }\n12     }\n13 \n14   \
    \  public void createUsername(){\n15         synchronized (details){ //Lock on\
    \ the details object mean that the detai\\\n16 ls object will block, but Bank\
    \ will not.\n17             details.setName(\"Bob\");\n18         }\n19     System.out.println(\"\
    His name is Bob\");\n20     }\n21 \n22 }\n```\n\nIdeally though we want to avoid\
    \ using `synchronized` where possible.\n\n## Q: What other options do we have\
    \ for creating Thread safe code?\n\nAs previously discussed, making a variable\
    \ `volatile` is more performant and less complex. However Java has a number of\
    \ classes that aid us with threading so that we can do it in an efficient way.\n\
    \n### The Atomic Classes\n\n## Q: What is CAS? What benefits does it have over\
    \ Synchronized?\n\nJava has a number of Atomic classes including `AtomicInteger`,\
    \ `AtomicDouble` and `AtomicBoolean`. These are completely thread safe and do\
    \ not involve locking, but instead use Compare and Swap (`CAS`) operations. A\
    \ `CAS` operation is an atomic one (as in, it happens as one single operation)\
    \ where during an update we check that the field value has not changed from when\
    \ we decided to update it (it hasn’t been modified by another thread) and if so\
    \ it sets the value to the new amount. This is exceptionally quick; `CAS` is actually\
    \ an operation available on most processors and no blocking is required. It is\
    \ still slower than single threaded (the LMAX experiment concluded it was 100x\
    \ slower) but it is the best available away of ensuring thread safe access to\
    \ values.\n\nIt is important to understand the difference between `volatile` and\
    \ `CAS`. if you try and perform any operation that uses the original value it\
    \ will render the `volatile` keyword useless. For example, `i++` breaks down into\
    \ `i=i + 1`. In the time between `i` being read (`i + 1`) and it being written\
    \ (`i = result`) another thread can jump in between and update the value. Because\
    \ the Atomic classes checks and writes values as an atomic operation, it is a\
    \ much safer option.\n\n### Immutability\n\nImmutable objects are brilliant. An\
    \ immutable object is an object whose state cannot be changed after creation.\
    \ By this definition all immutable objects are thread-safe. Programming to use\
    \ immutable objects can be difficult and is a paradigm shift from standard Object\
    \ Oriented Programming. Functional languages like `Scala` make heavy use of immutable\
    \ objects which allows them to scale well and be highly concurrent. The more we\
    \ can rely on immutable objects the less threading we will need.\n\n### Thread\
    \ methods\n\n## Q: What does yield() do?\n\nThe `Thread` class has a whole bunch\
    \ of methods on it which you need to know for your interview. Interviewers love\
    \ testing people on their ability to remember the details around these methods.\
    \ It is best to read up on them before an interview.\n\n`yield()` gives up the\
    \ processor. Imagine you have a single CPU only, if a thread refuses to allow\
    \ other threads CPU time they will remain permanently blocked. By calling `yield()`\
    \ the thread is generously saying “who else wants a turn?\". In reality it is\
    \ unreliable and isn’t normally used. The implementation can be different on any\
    \ system or JVM, and can often be different between Java versions. There is no\
    \ guarantee of what other thread will get the next access, nor when your thread\
    \ will next get an opportunity to run.\n\n## Q: What does interrupt() do?\n\n\
    You may have noticed that a number of `Thread` related methods (most commonly\
    \ `Thread.sleep()`) force you to catch an `InterruptedException`. If we need to\
    \ suggest to a `Thread` it needs to stop for whatever reason we can do this by\
    \ calling `interrupt()` on it. This sets the “interrupted” flag on the target\
    \ thread. If the target thread chooses to check this flag (using `interrupted()`\
    \ or `isInterrupted()`) then it can optionally throw an Exception (usually Interrupted\
    \ exception). It is predicated on the target `Thread` actually checking this.\
    \ However there are a number of methods, such as `Thread.sleep()` which automatically\
    \ poll for this flag. If the target thread is running one of these then an `InterruptedException`\
    \ will be thrown straight away.\n\n## Q: What does join() do?\n\n`join()` will\
    \ simply tell the currently running thread to wait until completion of whichever\
    \ thread `join()` is called on completes.\n\n```\n 1 public class SayHelloRunner\
    \ implements Runnable {\n 2 \n 3     public static void main(String[] args) throws\
    \ InterruptedException {\n 4         Thread thread = new Thread(new SayHelloRunner());\n\
    \ 5         thread.start();\n 6         thread.join();\n 7         System.exit(3);\n\
    \ 8     }\n 9 \n10     @Override\n11     public void run() {\n12         int i\
    \ = 0;\n13         while(i < 10000){\n14             System.out.println(i);\n\
    15             i++;\n16         }\n17     }\n18 }\n```\n\nIn this example if we\
    \ did not have the `thread.join()` the application will exit without printing\
    \ anything out. The `join()` call effectively makes the call synchronous; it want’s\
    \ the Thread to finish before proceeding.\n\n### Object methods\n\n## Q: What\
    \ do wait(), notify() and notifyAll() do?\n\n## Q: Why must they be called from\
    \ a synchronised block?\n\n## Q: What alternatives are there to these?\n"
