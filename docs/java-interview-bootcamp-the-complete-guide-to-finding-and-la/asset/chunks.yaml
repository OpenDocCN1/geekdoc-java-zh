  trans: "\n\n![](img/title_page.png)\n\n![Java Interview Bootcamp](img/title_page.png)\n\
    \n# Java 面试训练营\n\n### 寻找并获得下一份 Java 开发者职位的完整指南\n\n#### Sam Atkinson\n\n本书可在 [`leanpub.com/javainterviewbootcamp`](http://leanpub.com/javainterviewbootcamp)\
    \ 购买\n\n此版本发布于 2015-02-28。\n\n![出版商标志](img/leanpub-logo.png)\n\n* * * * * *\n\n\
    这是一本 [Leanpub](http://leanpub.com) 的书。Leanpub 通过精益出版流程为作者和出版商赋能。[精益出版](http://leanpub.com/manifesto)\
    \ 是使用轻量级工具和多次迭代来发布进行中的电子书，以获取读者反馈，不断调整直到拥有正确的书籍，并在一旦成功后建立影响力。\n\n* * * * * *\n\
    \n© 2014 - 2015 Sam Atkinson\n\n致 Laura。感谢你在我写这本书和建立网站期间（几乎）忍受了我的陪伴。你太棒了。\n\n\
    致 Mike & Dan，感谢你们提供极佳的支持网络，并一直听我没完没了地谈论 CJIQ。\n\n致 Ryan，感谢你无尽的热情、支持和编辑才华。\n\n\
    ## 目录\n\n* 引言\n* 第一部分：软技能与流程\n* 面试流程\n    * 第一阶段：申请工作\n    * 第二阶段：面试\n    * 示例面试流程\n\
    * 创建你的简历\n    * 简历格式\n    * 候选人脱颖而出的技巧\n    * 让它看起来美观\n* 电话面试\n    * 准备你的 Java\
    \ 电话面试\n    * 留下良好印象的技巧\n    * 面试期间会被问到的问题\n    * 面试后\n* 面对面面试\n    * 第一印象\n \
    \   * 面试形式\n* 技术测试\n    * 什么是技术测试？\n    * 它们有什么好处？\n    * 如何通过\n    * 技术测试后的后续\n\
    * 介绍一下你的系统\n    * 为什么要问你这个问题？\n    * 准备\n    * 示例面试\n* 第二部分：核心 Java\n* 面向对象编程\n\
    \    * 基础\n* 数据结构\n    * 集合类型\n    * 集合实现\n\n## 引言\n\n欢迎来到 Java 面试训练营。首先，我想非常感谢你购买这本书。我希望你喜欢阅读这本书，但更重要的是，它能帮助你获得下一份很棒的工作。\n\
    \n帮助 Java 开发者通过面试过程是我非常热情的事情。在我的职业生涯中，我面试过数百人，从最初级的开发者到最资深的技术主管。其中出现了一些贯穿始终的主题，这些驱动了我编写这本书以及创建\
    \ www.corejavainterviewquestions.com 的愿望。\n\n这本书分为两个部分：面试流程和核心 Java 知识复习。当有人面试你时，他们希望确保你具备技术能力，但也想知道你是否是一个可以每天共事的人。在书的前半部分，我们涵盖了不同类型的面试，以及作为候选人你可以做什么来为你未来的雇主留下最好的印象。\n\
    \n"
