    \ be different between Java versions. There is no guarantee of what other thread\
    \ will get the next access, nor when your thread will next get an opportunity\
    \ to run.\n\n**Q: What does interrupt() do?**\n\nYou may have noticed that a number\
    \ of Thread related methods (most commonly Thread.sleep()) force you to catch\
    \ an InterruptedException. If we need to suggest to a Thread it needs to stop\
    \ for whatever reason we can do this by calling interrupt() on it. This sets the\
    \ “interrupted” flag on the target thread. If the target thread chooses to check\
    \ this flag (using the interrupted() or isInterrupted()) then it can optionally\
    \ throw an Exception (usually Interrupted exception). It is predicated on the\
    \ target Thread actually checking this. However there are a number of methods,\
    \ such as Thread.sleep() which automatically poll for this flag. If the target\
    \ thread is running one of these then an InterruptedException will be thrown straight\
    \ away.\n\n**Q: What does join() do?**\n\njoin() will simply tell the currently\
    \ running thread to wait until completion of whichever thread join() is called\
    \ on completes.\n\n```\n 1 public class SayHelloRunner implements Runnable {\n\
    \ 2 \n 3     public static void main(String[] args) throws InterruptedException\
    \ {\n 4         Thread thread = new Thread(new SayHelloRunner());\n 5        \
    \ thread.start();\n 6         thread.join();\n 7         System.exit(3);\n 8 \
    \    }\n 9 \n10     @Override\n11     public void run() {\n12         int i =\
    \ 0;\n13         while(i < 10000){\n14             System.out.println(i);\n15\
    \             i++;\n16         }\n17     }\n18 }\n```\n\nIn this example if we\
    \ did not have the thread.join() the application will exit without printing anything\
    \ out. The join() call effectively makes the call synchronous; it want’s the Thread\
    \ to finish before proceeding.\n\n### Object methods\n\n**Q: What do wait(), notify()\
    \ and notifyAll() do?**\n\n**Q: Why must they be called from a synchronised block?**\n\
    \n**Q: What alternatives are there to these?**"
