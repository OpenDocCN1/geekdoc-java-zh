- fmt: "\nYou also can use this as an opportunity to express you knowledge of other\
    \ technologies. In the interview there’s references to Netty, ZeroMQ, HornetQ,\
    \ IBMMQ, ActiveMQ, Git, Feature Toggles, heartbeating, XML vs JSON, MySQL and\
    \ Oracle. That’s a lot of technologies and design patterns. This is an effective\
    \ way to show that you have a broad knowledge of your domain. It’s impossible\
    \ to know everything which is why when hiring it’s good to look for people who\
    \ can introduce new ideas and technologies into the organisation. And if you don’t\
    \ know any then spend the time to look on google. Type in “Alternatives to “ and\
    \ the technology and you’ll have a ton of articles laying the arguments out for\
    \ you.\n\n# Part Two: Core Java\n\nNow you’re fully equipped to excel at the softer\
    \ skills of interviewing it’s time to learn how to answer the technical stuff.\
    \ There is an unlimited selection of questions which an interviewer could ask\
    \ you; the Java Java universe is huge. So where do you start?\n\nThe traditional\
    \ method is to google around for lists of interview questions (that may even be\
    \ how you found this book). The simple fact is that generally the questions will\
    \ be much more in-depth than what most of what you will find- you’re never going\
    \ to get asked a simple list of questions. You really need to understand the areas\
    \ you’re talking about. That’s what this section will give you; a in depth revision\
    \ guide to the core areas of Java that you need to know for most interviews.\n\
    \nRead this half all the way through, then come back to the sections you feel\
    \ you really struggle with. It’s great if you can remember the esoteric facts,\
    \ but you really want to concentrate on the areas you feel are your weakest. Perhaps\
    \ you’ve never worked on a highly multi-threaded application. In that case, spend\
    \ the time re-reading about Threading. Come up with practical coding examples;\
    \ nothing helps lock it into memory like actually coding a solution!\n\n# Object\
    \ Oriented Programming\n\n## Basics\n\nQuestions on Object Oriented Programming\
    \ (OOP) are exceptionally common on interviews and with good reasons. For junior\
    \ developers it can clearly differentiate between someone who doesn’t really understand\
    \ programming and a candidate who could be a potential star but simply lacks in\
    \ experience. For more senior candidates I find it can help to identify developers\
    \ who understand good design and how code should be put together. There is a huge\
    \ array of questions (pun intended) and it is well worth significant study. Fundamentally\
    \ you will understand all of the topics covered in this chapter from the work\
    \ you do in your day to day job, however being able to code away on your machine\
    \ and being able to explain the concepts are very different things. We all know\
    \ (hopefully) that we should aim for low coupling and high cohesion. But can you\
    \ explain what that means? Can you give a concise answer? Take the time to really\
    \ think about the questions below. Often answers will vary based on personal preference\
    \ and experience. That’s fine, as long as you have a convincing answer!\n\n**Q:\
    \ Java is an Object Oriented Language. What does that mean?**\n\nThere are a number\
    \ of different programming paradigms of which OOP is but one. Another would be\
    \ functional programming (which is becoming very popular with languages like Scala).\
    \ Programs are modelled as Objects which are analogous to real world objects.\
    \ For example, when modelling a car you could create a `Car` object, which would\
    \ possess 4 `Wheel` Objects and an `Engine` Object. An Object is defined by the\
    \ data it contains and the actions that can be performed on it or with it. The\
    \ four key principles of OOP are Abstraction, Encapsulation, Inheritance and Polymorphism.\n\
    \n**Q: What is a Class? What is an Object?**\n\nA class can be thought of like\
    \ a template; it defines what an Object will look like, specifically what fields\
    \ and methods it will contain. an object is said to be an instance of a class-\
    \ where the fields will contain data. For example, a `TShirt` class may have a\
    \ colour and size attribute. A `TShirt` object could have the colour red and the\
    \ size XL. There could be many instances of an object with different or identical\
    \ values for the fields.\n\n**Q: Explain Abstraction, Encapsulation, Inheritance\
    \ and Polymorphism**\n\nOne of the key features of Java is the idea of abstraction\
    \ and inheritance. Inheritance allows the creation of a class which will have\
    \ the same fields and methods of another class (and possibly more), and also be\
    \ considered of the same type. For example, a `Car` has four wheels and an engine.\
    \ Using inheritance we can create a `TeslaCar`, which is still a `Car` but also\
    \ has extra fields (such as a cool touchscreen), or a `FormulaOneCar`, which would\
    \ also be a car but have an extra field for it’s spoiler. This allows us two special\
    \ features:\n- If I have a list of cars and I want to see what colour each one\
    \ is, I don’t care if it’s a `TeslaCar` or a `ForumlaOneCar`. I just want to call\
    \ the `Car`’s `.colour()` method. Because `TeslaCar` “is-a” `Car`, we know that\
    \ it has this method available on it.\n- If the `Class` we are inheriting from\
    \ already has the implementation of the method, we do not need to write it ourselves\
    \ (although we can if we want to).\n\nThe ability to define or override a methods\
    \ implementation in a subclass results in Polymorphism. When executing a method\
    \ the implementation used is not the one specified by the variable type but that\
    \ of the variable instance.\n\n```\n 1     public static void main(String[] args)\
    \ {\n 2         NumberPrinter numberPrinter = new EvenNumberPrinter();\n 3   \
    \      numberPrinter.printSomeNumbers();\n 4       }\n 5       \n 6     private\
    \ static class EvenNumberPrinter extends NumberPrinter {\n 7         public void\
    \ printSomeNumbers() {\n 8             System.out.println(\"2468\");\n 9     \
    \     }\n 10      }\n 11      \n 12     private static class NumberPrinter {\n\
    \ 13         public void printSomeNumbers() {\n 14             System.out.println(\"\
    123456\");\n 15         }\n 16     }\n```\n\nThis would print out “2468” despite\
    \ the type being NumberPrinter. This is also a good example of method overriding,\
    \ where a subclass provides a different implementation to that of it’s superclass.\
    \ It is possible to call non-abstract methods on the super using the keyword `super`,\
    \ e.g. from `EvenNumberPrinter`’s `printSomeNumbers()` it would be ok to call\
    \ `super.printSomeNumbers()`:\n\n```\npublic void printSomeNumbers() {\n    super.printSomeNumbers();\n\
    \    System.out.println(\"2468\");\n}\n```\n\nThis would result in\n\n```\n123456\n\
    2468\n```\n\nAn Interface is a Class with no implementation. To continue our analogy,\
    \ if `Car` was an interface with the method `.colour()`, that is simply specifying\
    \ that all `Car`s will have a `colour()` method (and makes no statement about\
    \ how it will be implemented). You cannot create an object from an interface as\
    \ it has no implementation or fields.\n\nAn Abstract Class is another type of\
    \ Class. It may have some methods which have not been implemented (which will\
    \ be labelled `abstract`), but it may also have some methods which have been implemented.\
    \ Abstract Classes also cannot be used to create an object, as some implementation\
    \ code will be missing.\n\nAn object can only be instantiated based on a full\
    \ Class (e.g. not abstract, not an interface). In Java, a Class can implement\
    \ between zero or many interfaces, or it can extend zero or one abstract or concrete\
    \ classes only.\n\nEncapsulation is the principal of data hiding. An Object has\
    \ internal state that it does not want modifying by other objects, so it can hide\
    \ this. The only properties and behaviours that can be accessed on an Object are\
    \ those that are deliberately exposed by it’s creator. This is accomplished in\
    \ Java using access modifiers; `public`, `protected`, `private` and default.\n\
    \n**Q: What are the different access modifiers in Java and what do they mean?**\n\
    \n*   `public`: accessible to everyone in the JVM\n\n*   `private`: only accessible\
    \ from inside the class.\n"
