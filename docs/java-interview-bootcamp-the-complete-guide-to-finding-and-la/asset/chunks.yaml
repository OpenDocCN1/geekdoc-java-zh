    \ being run in. The JVM spec makes no guarantees on what will happen when this\
    \ method is called. There is even a startup flag, -XX:+DisableExplicitGC, which\
    \ will stop this from doing anything.\n\nIt is considered bad practice to use\
    \ System.gc().\n\n**Q: What does finalize() do?**\n\nfinalize() is a method on\
    \ java.lang.Object so exists on all Objects. The default implementation does nothing.\
    \ It is called by the garbage collector when it determines there are no more references\
    \ to the object. As a result there are no guarantees the code will ever be executed\
    \ and so should not be used to execute actual functionality. Instead it is used\
    \ for clean up, such as file references. It will never be called more than once\
    \ on an object (by the JVM).\n\n### JVM Tuning\n\n**Q: What flags can I use to\
    \ tune the JVM and GC?**\n\nThere are textbooks available on tuning the JVM for\
    \ optimal Garbage Collection. You’ll never know them all! Nonetheless it’s good\
    \ to know a few for the purpose of interview.\n\n**-XX:-UseConcMarkSweepGC:**\
    \ Use the CMS collector for the Old Gen.\n\n**-XX:-UseParallelGC:** Use Parallel\
    \ GC for New Gen\n\n**-XX:-UseParallelOldGC:** Use Parallel GC for Old and New\
    \ Gen.\n\n**-XX:-HeapDumpOnOutOfMemoryError:** Create a thread dump when the application\
    \ runs out of memory. Very useful for diagnostics.\n\n**-XX:-PrintGCDetails:**\
    \ Log out details of Garbage Collection.\n\n**-Xms512m:** Sets the initial heap\
    \ size to 512m **-Xmx1024m:** Sets the maximum heap size to 1024m\n\n**-XX:NewSize\
    \ and -XX:MaxNewSize:** Specifically set the default and max size of the New Generation\n\
    \n**-XX:NewRatio=3:** Set the size of the Young Generation as a ratio of the size\
    \ of the Old Generation.\n\n**-XX:SurvivorRatio=10:** Set the size of Eden space\
    \ relative to the size of a survivor space.\n\n### Diagnosis\n\nWhilst all of\
    \ the questions above are very good to know to show you have a basic understanding\
    \ of how the JVM works, one of the most standard questions during an interview\
    \ is this:\n\n**Have you ever experience a memory leak? How did you diagnose it?**\n\
    \nThis is a difficult question to answer for most people as although they may\
    \ have done it, chances are it was a long time ago and isn’t something you can\
    \ recall easily. The best way to prepare is to actually try and write an application\
    \ with a memory leak and attempt to diagnosis it. Below I have created a ridiculous\
    \ example of a memory leak which will allow us to go step by step through the\
    \ process of identifying the problem. **I strongly advise you download the code\
    \ and follow through this process.** It is much more likely to be committed to\
    \ your memory if you actually do this process.\n\n```\n 1 import java.util.ArrayDeque;\n\
    \ 2 import java.util.Deque;\n 3 public class Main {\n 4     public static void\
    \ main(String[] args) {\n 5         TaskList taskList = new TaskList();\n 6  \
    \       final TaskCreator taskCreator = new TaskCreator(taskList);\n 7       \
    \  new Thread(new Runnable() {\n 8             @Override\n 9             public\
    \ void run() {\n10                 for (int i = 0; i < 100000; i++) {\n11    \
    \                 taskCreator.createTask();\n12                 }\n13        \
    \     }\n14         }).start();\n15     }\n16     private static class TaskCreator\
    \ {\n17         private TaskList taskList;\n18         public TaskCreator(TaskList\
    \ taskList) {\n19             this.taskList = taskList;\n20         }\n21    \
    \     public void createTask() {\n22             taskList.addTask(new Task());\n\
    23         }\n24     }\n25     private static class TaskList {\n26         private\
    \ Deque<Task> tasks = new ArrayDeque<Task>();\n27         public void addTask(Task\
    \ task) {\n28             tasks.add(task);\n29             tasks.peek().execute();//Memory\
    \ leak!\n30         }\n31     }\n32     private static class Task {\n33      \
    \   private Object[] array = new Object[1000];\n34         public void execute()\
    \ {\n35            //dostuff\n36         }\n37     }\n38 }\n```\n\nIn the above\
    \ very contrived example, the application executes tasks put onto a Deque. However\
    \ when we run this we get an out of memory! What could it possibly be?\n\n![](images/Memory-Leak.png)\n\
    \nTo find out we need to use a profiler. A profiler allows us to look at exactly\
    \ what is going on the VM. There are a number of options available. VisualVM (https://visualvm.java.net/download.html)\
    \ is free and allows basic profiling. For a more complete tool suite there are\
    \ a number of options but my personal favourite is Yourkit. It has an amazing\
    \ array of tools to help you with diagnosis and analysis. However the principles\
    \ used are generally the same.\n\nI started running my application locally, then\
    \ fired up VisualVM and selected the process. You can then watch exactly what’s\
    \ going on in the heap, permgen etc.\n\n![](images/visual-vm.png)\n\nYou can see\
    \ on the heap (top right) the tell tail signs of a memory leak. The application\
    \ sawtooths, which is not a problem per se, but the memory is consistently going\
    \ up and not returning to a base level. This smells like a memory leak. But how\
    \ can we tell what’s going on? If we head over to the Sampler tab we can get a\
    \ clear indication of what is sitting on our heap.\n\n![](images/java-heap-snapshot.png)"
