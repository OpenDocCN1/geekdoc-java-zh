    另一方面，Java 程序可以在任何安装了 Java 虚拟机的系统上运行。`JVM` 充当中间层并处理特定于操作系统的细节，这意味着作为开发者，我们不需要担心这些问题。现实中，不同操作系统之间仍然存在一些小问题，但这些问题都相对较小。这使得开发变得更快、更简单，并意味着开发者可以在
    Windows 笔记本电脑上编写可能目标是其他平台的软件。我只需要编写一次软件，它就可以从 Android 到 Solaris 等各种平台上平台上运行。


    从理论上讲，这是是以速度为代价的。`JVM` 的额外层意味着它比直接编译机器的语言（如 `C`）慢。然而，Java 近年来取得了巨大进展，考虑到易用性等许多其他优势，它正越来越多地用于低延迟应用。


    `JVM` 的另一个优点是，任何可以编译为字节码的语言都能在其上运行，而不只是 `java`。像 `Groovy`、`Scala` 和 `Clojure`
    等语言都是基于 `JVM` 的语言。这意味着这些语言可以轻松使用其他语言编写的库。作为一名 `Scala` 开发者，我可以在应用程序中使用 `Java` 库，因为它们都运行在同一个平台上。


    与真实硬件的隔离也意味着代码是沙箱化的，限制了它对主机计算机可能造成的破坏。安全性是 `JVM` 的一大优势。


    还有一个值得考虑的有趣方面：并不是所有的 `JVM` 都是同等的。除了 Oracle 的标准 `JVM` 实现外，还有许多不同的实现。`JRockit` 以其极快的
    `JVM` 速度闻名。`OpenJDK` 是开源对等品。有很多 `JVM` 实现。虽然这种选择最终是一件好事，但所有 `JVM` 的行为可能略有不同。Java
    规范的许多领域在实现方面被刻意模糊化，每个 `VM` 可能以不同的方式处理。这可能会导致只在特定平台上的特定 `VM` 中出现的 Bug。这些可能是最难调试的
    Bug。


    从开发者的角度来看，`JVM` 提供了许多优势，特别是在内存管理和性能优化方面。


    ## Q: 什么是 JIT？


    `JIT` 代表“即时编译”（Just in Time）。正如讨论过的，`JVM` 执行字节码。然而，如果它确定某部分代码运行频繁，它可以选择性将该部分代码编译为原生代码以提高执行速度。可以被
    `JIT` 编译的最小单元是一个方法。默认情况下，一段代码需要执行 1500 次才会被 `JIT` 编译，尽管这是可以配置的。这导致了“预热” `JVM`
    的概念。`JVM` 运行得越长，性能就越高，因为这些优化会持续进行。缺点是，`JIT` 编译不是免费的；它在发生时会消耗时间和资源。


    ## Q: 我们说 Java 内存内存时是指什么意思？垃圾回收器是什么？


    在 `C` 等语言中，开发者可以直接访问内存。代码引用内存空间地址。这可能是困难且危险的，并可能导致严重的内存泄漏。在 `Java` 中，所有内存都是受管理的。作为程序员，我们只处理对象和基本类型，而对内存和指针的底层运作没有概念。最重要的是，`Java`
    具有垃圾回收器的概念。当对象不再需要时，`JVM` 会自动识别并为我们清理内存空间。


    ## Q: 垃圾回收器的优点和缺点是什么？


    优点方面：

    * 开发者可以更少地担心内存管理，专注于解决实际问题。尽管内存泄漏在技术上仍然是可能的，但它们已不再常见。

    * `GC` 拥有许多用于内存管理的智能算法，它们在后台自动运行。与大众认知相反，在判断何时最佳执行 `GC` 方面，它们通常比手动收集更好。


    缺点方面：

    * 当发生垃圾回收时，它会对应用程序性能产生影响，特别是会减慢速度或停止运行。在所谓的“停世界”（Stop the world）垃圾回收期间，应用程序的其他部分将冻结。这取决于应用程序的需求，可能是不可接受的，尽管
    `GC` 调优可以最小化甚至消除任何影响。

    * 虽然对垃圾回收器进行很多调优，但你无法指定应用程序何时或如何执行 GC。


    ## Q: 什么是“停世界”？


    当 `GC` 发生时，有必要在收集期间完全暂停应用程序中的线程。这被称为停世界。对于大多数应用程序，长时间暂停是不可接受的。因此，调整垃圾回收器以将收集的影响降低到应用程序可接受的范围内是非常重要的。


    ## Q: 分代 GC 是如何工作的？我们为什么要使用分代 GC？Java 堆是如何结构的？


    理解 Java 堆如何工作对于回答关于 `GC` 的问题非常重要。所有对象都存储在 `Heap` 上（相对于 `Stack`，变量、方法以及对堆中对象的引用存储在栈中）。垃圾回收是从
    `Heap` 中移除不再需要的对象并返回空间供普通使用的过程。几乎所有的 `GC` 都是“分代的”，其中 `Heap` 被分为若干区域或代。这被证明是显著更优的，这就是为什么几乎所有的收集器都使用这种模式。


    ### New Generation（新生代）


    #### Q: 什么是新生代？它如何帮助最小化 GC 的影响？


    大多数应用程序都有大量的短命对象。在 `GC` 期间分析应用程序中的所有对象会缓慢且耗时，因此将短命对象分开以便它们被快速回收是有意义的。因此，所有新对象都存放在新生代。新生代进一步拆分为：

    * `Eden Space`：所有新对象都放在这里。当它满额时，会发生 `minor GC`。所有仍被引用的对象将被提升到 `survivor space`（存活空间）。

    * `Survivor spaces`（存活空间）：存活空间的实现随 `JVM` 而异，但前提是相同的。新生代的每次 `GC` 都会增加存活空间中对象的年龄。当一个对象经历了足够数量的
    `minor GC` 后（默认值不同，但通常从 15 开始），它将被提升到 `Old Generation`（老年代）。某些实现使用两个存活空间，`From
    space` 和 `To space`。在每次收集期间，这些会交换角色，所有提升的 `Eden` 对象和存活对象移动到 `To space`，并将 `From`
    留空。


    #### Q: 什么是 minor GC？


    在 `NewGen` 中的垃圾回收被称为 `minor GC`。使用新生代的优点之一是减少碎片的影响。当一个对象被垃圾回收时，它会在原先内存中留下一个间隙。我们可以压缩剩余对象（一种停世界场景），也可以留出它们并插入新对象。通过使用分代
    `GC`，我们限制了这种情况在 `Old Generation` 中发生的频率，因为那里通常更稳定，有利于通过减少停世界来提高延迟。然而，如果我们不进行压缩，可能会发现对象无法放入它们之间的间隙中，可能是由于大小问题。如果是这种情况，你将看到对象无法从新生代提升。


