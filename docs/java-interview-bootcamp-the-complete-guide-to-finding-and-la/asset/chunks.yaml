  trans: "\n\n- `protected`: 可被同一包中的任何类或任何包中的任何子类访问\n- `default`: 当没有指定可见性修饰符时。仅可被同一包中的任何类访问。\n\
    \n## Q：我们说“低耦合、高内聚”是什么意思？\n\n这是面向对象编程（OOP）中的核心设计原则之一。低耦合指的是不同组件之间的交互方式；这些组件可以是对象、模块、系统等任何级别。我们希望组件对其他组件的依赖尽可能少。这使得重构和修改变得快速且廉价。这通常通过在组件之间创建整洁的接口并使用封装来隐藏内部实现来实现。低耦合是创建灵活且易于维护的系统最重要的思想之一。\n\
    \n内聚指的是组件的实现方式；在一个高度内聚的系统中，事物的构建方式使得相关的项放在一起，不相关的项分开。回到汽车的类比，驾驶汽车的方法（如 `turn()`、`accelerate()`\
    \ 和 `brake()`）存在于 `Car` 类中是有逻辑的。它们是内聚的并且属于同一个整体。相反，如果 `Car` 类有一个 `clean()` 方法，那么它就不符合内聚性。汽车不会自己清洁；那是其他东西完成的任务，也许是\
    \ `Car` 或 `Owner`。高内聚通过确保不属于在一起的字段和行为被分离到更合适的位置来实现。这些术语通常被放在一起，因为低耦合的高内聚系统往往更具灵性和可维护性。\n\
    \n## Q：方法重载（method overloading）和方法重写（method overriding）之间有什么区别？\n\n在 Java 中，多个方法可以具有相同的名称。它们通过参数的数量或顺序不同来区分。重写是在子类中创建一个不同的实现。\n\
    \n## Q：什么是构造函数？\n\n构造函数是一个特殊方法，其名称与类相同，例如 `Car()`。它不指定返回类型，因为它隐式地返回该类的对象。它用于构建实例。如果没有指定，则将有一个默认的无参构造函数。可以对构造函数进行重载，并且所有的访问修饰符都可以应用于构造函数。如果你的类包含任何\
    \ `final` 字段，它们必须在构造函数结束之前赋值，否则你的程序将无法编译。\n\n## Q：Java 中的 static 是什么意思\n\n有效使用\
    \ `static` 关键字可以声明某些内容属于类，而不是实例。`static` 变量被所有实例共享。`static` 方法属于类，这意味着它不能访问任何非静态字段。它也不能被重写。我们还可以拥有静态块，它们在类被加载到内存时执行：\n\
    \n```java\nstatic {\n    System.out.println(\"Hello!\");\n    //也许这里会有一些变量\n}\n\
    ```\n`static` 也可以用于嵌套类。\n\n## Q：我们说 Java 不支持多继承意味着什么？这是一件好事吗？\n\nJava 无法扩展来自多个具体或抽象类的的功能。如果两个父类都有一个\
    \ `jump()` 方法，将不清楚调用者需要使用哪一个功能。\n\n## Q：如果你想防止你的方法或类被重写，你应该怎么做？\n\n通过将内容声明为 `final`\
    \ 来防止其被重写。尽管没有什么是是完美的，因为开发者始终可以使用反射（Reflection）来绕过这一点，或者直接将你的代码复制到他们自己版本的类中。防止你的方法或类被重写通常不是一个好主意，你应该编写防御性代码来反映这一点。\n\
    \n## 数据结构\n\nJava 数据结构会在你的面试中出现。程序员的核心在于处理数据，将其从一种格式转换并输出为另一种格式，这就是为什么理解底层原理以及它如何影响你的应用程序是如此重要。这总是没能困住多少人知道用什么集合来支持\
    \ `ArrayList`（提示：就在名字里）。从面试的角度来看，关于数据结构的问题揭示了关于候选人的大量信息。它们显示了候选人是否对 Java 的原理有核心理解。更好的是，它提供了一个平台，可以引导关于设计、算法以及更多广泛的问题。在日常的\
    \ Java 编程中，你大部分时间都会花在 `ArrayList`、`LinkedList` 和 `HashMap` 上。因此，回顾一下你久没看的集合和算法是有意义的，因为根据我的经验，公司非常喜欢问这类问题。\n\
    \n- Q：什么是集合框架（Collection Framework）？\n- Q：Java 中有哪些集合类型？\n- Q：基础接口类型有哪些？\n- Q：List、Set\
    \ 和 Map 之间有什么区别？\n\n这些是每个使用 Java 的人都应该掌握的基础性知识。集合框架简单就是作为 Java 核心部分包含的集合类型集合。在\
    \ Java 中，你会处理三种类型的集合：`Set` 和 `List`（两者都实现了 `Collection`）以及 `Maps`（它们实现了 `AbstractMap`，技术上不属于核心\
    \ Collections）。每种类型的集合都表现出定义其用处的某些特性。集合的主要特征是：\n\n- 元素可以添加或删除\n- 集合将有一个可以查询的大小\n\
    - 集合可能包含也可能不重复项\n- 集合可能提供也可能不排序\n- 集合可能提供也可能不位置访问（例如，获取位置 6 的项目）\n\n这些方法的行为取决于实现（正如你对接口所预期的那样）。如果你在一个不存在不存在的对象的集合上调用\
    \ `remove` 会发生什么？这取决于实现。\n\n### 集合类型\n\n**Set**: 集合没有重复项且没有保证顺序。正因为如此，它不提供位置访问。实现了\
    \ `Collection`。示例实现包括 `TreeSet` 和 `HashSet`。\n\n**List**: 列表可能包含也可能不重复项，并且保证顺序，允许位置访问。实现了\
    \ `Collection`。示例实现包括 `ArrayList` 和 `LinkedList`。\n\n**Map（接口：AbstractMap）**:\
    \ Map 稍微不同，因为它包含键值对，而不是特定的对象。Map 的键可能不包含重复项。Map 没有保证顺序，也没有位置访问。没有实现 `Collection`。示例实现包括\
    \ `HashMap` 和 `TreeMap`。\n\n但这些对于面试意味着什么？你几乎肯定会收到关于类型之间区别的问题，所以努力学习它们。更重要的是，聪明的候选人会理解这些特性的意义。为什么选择其中一个而不是另一个？影响是什么？\n\
    \n#### 如何选择？\n\n在现实中，选择 `Set`、`List` 还是 `Map` 取决于你的数据结构。如果你不会有重复项且不需要顺序，那么你的选择将是\
    \ `Set`。如果你需要将顺序固定到数据中，那么你会选择 `List`。如果你有键值对，通常如果你想关联两个不同的对象或一个对象有一个明显的标识符，那么你可能会选择\
    \ `map`。\n\n##### 示例\n\n"
- fmt: '

    *   A collection of colours would be best put into a `set`. There is no ordering
    to the elements, and there are no duplicates; You can’t have two copies of “Red”!

    *   The batting order of a cricket team would be good to put in a `list`; you
    want to retain the order of the objects.

    *   A collection of web sessions would be best in a `map`; the unique session
    ID would make a good key/reference to the real object.


    Understanding why you choose a collection is vitally important for giving the
    best impression in interviews. I’ve had candidates come in and tell me they just
    use `ArrayList` and `HashMap` because that’s just the default implementation they
    choose to use. In reality, this maybe isn’t a bad thing. Most times we need to
    use collections there are no major latency or access requirements. It doesn’t
    matter. However, people who are asking you these questions in interviews want
    to know that you understand how things work under the covers.


    ## Q: What are the main concerns when choosing a collection?


    When you’re handling a collection, you care about speed, specifically:


    *   Speed of access

    *   Speed of adding a new element

    *   Speed of removing an element

    *   Speed of iteration


    On top of this, it isn’t just a case of “which is faster”. There is also consistency.
    Some implementations will guarantee the speed of access, whereas others will have
    variable speed. How that speed is determined depends on the implementation. The
    important thing is to understand is the speed of the relative collection implementations
    to each other, and how that influences your selection.


    ## Collection Implementations


    *   **Q: Why would I choose `LinkedList` over an `ArrayList`?**

    *   **Q: Which is faster, `TreeSet` or `HashSet`?**

    *   **Q: How does a `LinkedList` work?**


    The collection implementations tend to be based on either a *Linked* implementation,
    a *Tree* implementation or a *Hash* implementation. There are entire textbooks
    based on this, but what you need to know is how it affects your collection choices.


    ### Linked implementation


    **Example: `LinkedList`, `LinkedHashSet`** Under the covers, each item is held
    in a “node”. Each node has a pointer to the next item in the collection like so.


    ![](images/linkedlist.png)


    *What does this mean for speed?*


    When adding an item into a linked connection it’s quick, irrelevant of where you’re
    adding the node. If you have a list of 3 items and want to add a new one in position
    1, the operation is simply to point position 2 to the new item, and the new item
    to the old position 2.


    ![](images/new.png)


    That’s pretty fast! No copying collections, no moving things, no reordering. The
    same is true for removals; simply point node 0 to node 2 and you’ve removed node
    1.


    Conversely when accessing objects it is relatively slow. If you have a list of
    1000 items, and you want item 999, you need to traverse every single node to get
    to that item. This also means that the access speed is not consistent. It’s quicker
    to access element 1 than it is element 1000. Bear in mind that when adding a new
    object you need to first traverse to the node before, so this can have some impact
    on speed.


    So linked collections such as `LinkedList` are great when you need fast addition/removal
    and access time is less of a concern. **If you’re going to be adding/remove items
    from your collection a lot, then this is the option for you**.


    ### Array implementation


    **Example: `ArrayList`** `ArrayList` is the only Array based implementation in
    the collection classes, but is often used to compare to `LinkedList` so it’s important
    to understand. As alluded to previously, `ArrayLists` are backed by an `Array`.
    This has interesting implications.


    When adding an item into the middle of an `ArrayList`, the structure needs to
    copy all of the items to shift them down the Array. This can be slow, and is not
    guaranteed time (depending on how many elements need to be copied.


    ![](images/Add-Item-To-Arraylist-1024x540.png)


    The same applies when removing objects; all object references after it have to
    be copied forward one space. There is an even worse case. On creating an `ArrayList`
    it starts with a fixed length `Array` (whose length you can set in the constructor,
    or the default is 10). If the capacity needs to increase over this, the collection
    has to create a **brand new array** of greater length and copy all the references
    to it which can be really slow.


    Where `ArrayList` succeeds is access speed; As the array is in contiguous memory
    it means that if you request object 999 of 1000, you can calculate exactly where
    in memory the reference is with no need to traverse the full collection. This
    gives constant time access which is **fast**.


    So, `ArrayLists` make a great choice if you have a set of data that is **unlikely
    to be modified significantly, and you need speedy read access.**


    ### Hash Implementation


    **Examples: `HashSet`, `HashMap`** The `HashMap` is a complicated beast in itself
    and is a good choice for an interview question as it is easy to add extending
    questions to.


    *   **Q: How does a `HashMap` work?**

    *   **Q: Why does the hashcode of the key matter?**

    *   **Q: What happens if two objects have the same HashCode?**

    *   **Q: How does the `Map` select the correct object if there is a clash?**


    Interestingly `HashSet` is backed by `HashMap`, so for the purpose of this I will
    just discuss the latter. A `HashMap` works like this: under the covers a `HashMap`
    is an array of references (called the Entry Table, which defaults to 16 entries)
    to a group of `LinkedLists` (called Buckets) where `HashEntry`s are stored. A
    `HashEntry` is an object containing the key and associated object.


    ![](images/Empty-Hashmap-300x295.png)


    All instances of `Object` have a method, `hashCode()`, which returns an `int`.
    The hashcode is usually a value derived from the properties of an object. The
    hashcode returned from an object should be consistent and equal objects must return
    the same hashcode. This property can then be used to determine which bucket to
    put it in based on the index of the entry table; For example, in the above example
    with 4 spaces in the entry table, if I have a key with HashCode 12345, I can do
    12345 % 4 = 1, so I would place my object in bucket 1.


    This makes object retrieval very quick. In my example, if I try to retrieve the
    object for my key then all I need to do is the same mod calculation to find the
    bucket and it’s the first entry. Exceptionally quick.


    This can get more complicated. What if I have two more objects, HashCode of “5”
    and “9”? They both have a (modulus 4) of 1 so would both be put into bucket 1
    too. Now I use my “9” key to retrieve my object the `HashMap` has to iterate through
    a `LinkedList`, calling `.equals()` on the keys of each `HashEntry`.


    ![](images/HashMap-Retrieval.png)


    This is slow! Fortunately, this shouldn’t happen often. Although collisions will
    naturally occur, the intention is that objects will be spread evenly across the
    entry table with minimal collisions. This relies on a well implemented hashcode
    function. If the hashcode is poor (e.g., always return 0) then you will hit collisions.


    To further try and reduce the chance of this, each `HashMap` has a load factor
    (which defaults to 0.75). If the entry table is more full than the load factor
    (e.g. if more than 75% of the entry table has entries) then, similar to the `ArrayList`,
    the `HashMap` will double the size of the entry table and reorder the entries.
    This is known as rehashing.


    ### Tree Implementation

