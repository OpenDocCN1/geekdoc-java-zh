  trans: "\n\n当 `synchronized` 关键字置于如 `withdraw(int money)` 等方法上时，其效果与将整个方法的代码封装在\
    \ `synchronized(this)` 中相同（示例中的 `deposit` 方法就是此类情况）。如果任何 `Thread` 尝试执行该对象上的任何\
    \ `synchronized` 方法，它将被阻塞。\n\n## Q: 使用 `synchronized` 的缺点是什么？我们如何避免或减轻这些缺点？\n\n\
    锁很慢。非常慢。特别是当使用 `synchronized` 关键字时，它会对性能产生巨大影响。这一点在 LMAX 创建的一篇关于他们如何构建 `Disruptor`（一种超低延迟并发组件）的论文得到了精彩的解释。对于想要深入了解线程细节和机械共情（mechanical\
    \ sympathy）的人来说，这是一篇非常精彩的读物。你可以通过此处访问：[`lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf`](http://lmax-exchange.github.io/disruptor/files/Disruptor-1.0.pdf)。\n\
    \n“锁的代价极其高，因为它们在竞争时需要仲裁。这种仲裁通过切换到操作系统内核来实现，内核会挂起等待锁的线程直到锁被释放。在这样的上下文切换期间，以及将控制权交给操作系统（它在拥有控制权时可能会决定执行其他管理任务），执行上下文可能会丢失之前缓存的数据和指令。这会对现代处理器产生严重的性能影响。”\n\
    \n你不需要去学习这段引言的细节内容；只需知道，除了线程在等待资源时被阻塞的影响外，操作系统层面也存在一种影响，这造成了巨大的性能损害。在同一篇论文中，进行了一项实验来观察不同类型的锁对延迟的影响；不加锁时进程耗时\
    \ 300ms，而当 2 个线程竞争一个锁时，耗时 224,000ms。处理好线程是困难的，但如果做错会导致严重的后果。\n\n如果你坚持使用 `synchronized`，那么尽可能缩小被同步代码块的大小是一个好的开始。代码块越小，越有助于减少影响。更好的办法是，你可以针对特定对象加锁，或者在使用基本类型时使用一个锁对象，这样整个对象就不需要竞争。\n\
    \n```\n 1 public class Bank {\n 2     private int funds = 100;\n 3     private\
    \ Object fundLock;\n 4 \n 5     private UserDetails details = new UserDetails();\n\
    \ 6 \n 7     public void deposit(int money){\n 8         synchronized (fundLock){\
    \ // 更新 funds 需要获取锁对象 fu\\\n 9 nds \n10             funds += money;\n11      \
    \   }\n12     }\n13 \n14     public void createUsername(){\n15         synchronized\
    \ (details){ // 对 details 对象加锁意味着 detai\\\n16 ls 对象会被阻塞，但 Bank 类则不会。\n17     \
    \        details.setName(\"Bob\");\n18         }\n19     System.out.println(\"\
    His name is Bob\");\n20     }\n21 \n22 }\n```\n\n理想情况下，我们尽可能避免使用 `synchronized`。\n\
    \n## Q: 创建线程安全的代码我们还有哪些选择？\n\n正如之前讨论过的，将变量标记为 `volatile` 性能更好且更简单。然而，Java 有许多类可以帮助我们处理线程，以便以高效的方式完成。\n\
    \n### 原子类 (The Atomic Classes)\n\n## Q: 什么是 CAS？它与 Synchronized 相比有什么优势？\n\nJava\
    \ 拥有许多原子类，包括 `AtomicInteger`、`AtomicDouble` 和 `AtomicBoolean`。这些类完全是线程安全的，不涉及锁定，而是使用比较并交换（Compare\
    \ and Swap, `CAS`）操作。`CAS` 操作是原子的（即它作为单个操作发生），在执行更新期间，我们会检查字段值是否自我们决定更新它以来发生过变化（即未被另一个线程修改），如果没有变化，则会将该值设置为新值。这种方式极快；`CAS`\
    \ 实际上是大多数处理器上都支持的操作，且不需要阻塞。它仍然比单线程慢（LMAX 的实验得出结论它慢了 100 倍），但它是确保对值进行线程访问的最可用方法。\n\
    \n理解 `volatile` 和 `CAS` 之间的区别非常重要。如果你尝试执行任何使用原始值的操作，将使 `volatile` 关键字失效。例如，`i++`\
    \ 被拆解为 `i=i + 1`。在 `i` 被读取（`i + 1`）到被写入（`i = result`）的时间间隔内，另一个线程可能会介入并更新值。因为原子类将值的检查和写入作为一个原子操作执行，所以它是一个更安全的选项。\n\
    \n### 不变性 (Immutability)\n\n不可变对象是极好的。不可变对象是指创建后状态无法被改变的对象。根据这个定义，所有不可变对象都是线程安全的。使用不可变对象进行编程可能会困难，这是对标准面向对象编程的一种范式转变。`Scala`\
    \ 等函数式语言大量使用不可变对象，这使得它们能够良好扩展并实现高并发。我们越依赖不可变对象，需要的线程就越少。\n\n### 线程方法 (Thread methods)\n\
    \n## Q: `yield()` 是做什么的？\n\n`Thread` 类有一系列方法是你在面试中需要了解的。面试官喜欢测试人们记忆这些方法相关细节的能力。最好在面试前查阅一下这些方法。\n\
    \n`yield()` 会放弃对处理器的控制（让出 CPU 时间）。假设你只有一个 CPU，如果一个线程拒绝让其他线程使用 CPU 时间，它们将永久阻塞。通过调用\
    \ `yield()`，该线程在慷慨地说：“还有谁想轮到？”。在现实中，它是不可靠的，且通常不被使用。其实现在任何系统或 JVM 上都可能不同，并且在不同的\
    \ Java 版本之间也经常不同。无法保证哪个线程将获得下一次访问权限，也无法保证你的线程何时再次获得运行的机会。\n\n## Q: `interrupt()`\
    \ 是做什么的？\n\n你可能注意到，许多与 `Thread` 相关的方法（最常见 `Thread.sleep()`）会强制你捕获 `InterruptedException`。如果我们需要建议某个\
    \ `Thread` 出于某种原因停止，可以通过对其调用 `interrupt()` 来实现。这会在目标线程上设置“已中断（interrupted）”标记。如果目标线程选择检查此标记（使用\
    \ `interrupted()` 或 `isInterrupted()`），它就可以可选地抛出一个异常（通常是 Interrupted 异常）。这取决于目标\
    \ `Thread` 是否真的去检查这个标记。然而，许多方法（例如 `Thread.sleep()`）会自动轮询此标记。如果目标线程正在运行这些方法之一，将立即抛出\
    \ `InterruptedException`。\n\n## Q: `join()` 是做什么的？\n\n`join()` 简单地告诉当前运行的线程，等待调用\
    \ `join()` 的那个线程完成。\n\n```\n 1 public class SayHelloRunner implements Runnable\
    \ {\n 2 \n 3     public static void main(String[] args) throws InterruptedException\
    \ {\n 4         Thread thread = new Thread(new SayHelloRunner());\n 5        \
    \ thread.start();\n 6         thread.join();\n 7         System.exit(3);\n 8 \
    \    }\n 9 \n 10     @Override\n 11     public void run() {\n 12         int i\
    \ = 0;\n 13         while(i < 10000){\n 14             System.out.println(i);\n\
    \ 15             i++;\n 16         }\n 17     }\n 18 }\n```\n\n在这个示例中，如果我们没有 `thread.join()`，应用程序将在不打印任何内容的情况下退出。`join()`\
    \ 调用实际上使调用变为同步；它希望在线程完成后再继续。\n\n### 对象方法 (Object methods)\n\n## Q: `wait()`、`notify()`\
    \ 和 `notifyAll()` 是做什么的？\n\n## Q: 为什么它们必须在同步块中调用？\n\n## Q: 这些方法的替代方案是什么？\n\n"
- fmt: "\n`wait()`, `notify()` and `notifyAll()` are used as a means of inter-thread\
    \ communication. When acquiring a lock on an object it may not be in the required\
    \ state; perhaps a resource isn’t set yet, a value isn’t correct. We can use `wait()`\
    \ to put the thread to sleep until something changes. When that something does\
    \ change, the awaiting clients can be notified by calling `notify()` or `notifyAll()`\
    \ on the object that is being waited for. If all of your waiting threads could\
    \ in theory take action with the new information then use `notifyAll()`. However\
    \ if there is a new lock to be acquired (so only one waiting Thread can take action),\
    \ then call just `notify()`.\n\n## Example\n\n```java\n 1 public class Example\
    \ {\n 2 \n 3     public static void main(String[] args) {\n 4 \n 5         ResourceCarrier\
    \ carrier = new ResourceCarrier();\n 6         ThingNeedingResource thingNeedingResource\
    \ = new ThingNeedingResource(car\\\n 7 rier);\n 8         ThingNeedingResource\
    \ thingNeedingResource2 = new ThingNeedingResource(ca\\\n 9 rrier);\n10      \
    \   ThingNeedingResource thingNeedingResource3 = new ThingNeedingResource(ca\\\
    \n11 rrier);\n12         ResourceCreator resourceCreator = new ResourceCreator(carrier);\n\
    \ 13 \n 14         new Thread(thingNeedingResource).start();\n 15         new\
    \ Thread(thingNeedingResource2).start();\n 16         new Thread(thingNeedingResource3).start();\n\
    \ 17         new Thread(resourceCreator).start();\n 18     }\n 19 \n 20 }public\
    \ class ResourceCarrier {\n 21     private boolean resourceReady;\n 22 \n 23 \n\
    \ 24 \n 25     public boolean isResourceReady() {\n 26         return resourceReady;\n\
    \ 27     }\n 28 \n 29     public void resourceIsReady() {\n 30         resourceReady\
    \ = true;\n 31 \n 32     }\n 33 }\n 34 public class ResourceCreator implements\
    \ Runnable {\n 35     private ResourceCarrier carrier;\n 36 \n 37     public ResourceCreator(ResourceCarrier\
    \ carrier) {\n 38 \n 39         this.carrier = carrier;\n 40     }\n 41 \n 42\
    \     @Override\n 43     public void run() {\n 44         try {\n 45         \
    \    Thread.sleep(2000);\n 46         } catch (InterruptedException e) {\n 47\
    \             e.printStackTrace();\n 48         }\n 49         synchronized (carrier)\
    \ {\n 50             carrier.resourceIsReady();\n 51             carrier.notifyAll();\n\
    \ 52         }\n 53     }\n 54 }\n 55 package com.core.interview.thread;\n 56\
    \ \n 57 \n 58 public class ThingNeedingResource implements Runnable {\n 59 \n\
    \ 60     private ResourceCarrier carrier;\n 61 \n 62     public ThingNeedingResource(ResourceCarrier\
    \ carrier){\n 63 \n 64         this.carrier = carrier;\n 65     }\n 66     @Override\n\
    \ 67     public void run() {\n 68         synchronized (carrier){\n 69       \
    \      while(!carrier.isResourceReady()){\n 70                 try {\n 71    \
    \                 System.out.println(\"Waiting for Resource\");\n 72         \
    \            carrier.wait();\n 73                 } catch (InterruptedException\
    \ e) {\n 74                     e.printStackTrace();\n 75                 }\n\
    \ 76             }\n 77             System.out.println(\"haz resource\");\n 78\
    \         }\n 79     }\n 80 }\n```\n\nIn this example we have a wrapper around\
    \ a resource called “Resource Carrier” and 3 threads that want access to it’s\
    \ resource. When it acquires the lock it sees the resource isn’t available and\
    \ goes into wait mode by calling `wait()` on the `ResourceCarrier` object. The\
    \ `ResourceCreator` swoops in later to create the resource and calls `notify()`\
    \ on the `ResourceCarrier`, at which point the three threads spring back to life.\n\
    \n## Deadlock\n\n### Q\n\n**Q: What is a deadlock?**\n\n**Q: How do we prevent\
    \ deadlocks?**\n\nMany candidates completely fluff the answer to deadlock questions.\
    \ It’s a very common interview question, and it’s an easy enough concept to understand,\
    \ but it can be tricky to explain (particularly over the phone).\n\nA deadlock\
    \ occurs when two or more threads are awaiting the actions of each other which\
    \ prevents any further processing from happening. For example, `Thread A` has\
    \ the lock on `Object 1` and attempts to require a lock on `Object 2` to continue.\
    \ Simultaneously, `Thread B` has a lock on `Object 2` and attempts to acquire\
    \ a lock on `Object 1`. As a result both Threads are kept busy waiting for the\
    \ other one, which will never release. This is a deadlock.\n\nThe easiest way\
    \ to prevent deadlock is to ensure that the ordering of acquisition for locks\
    \ is consistent. If both Threads try to acquire `Object 1` then `Object 2` in\
    \ that order then deadlock will not occur. It is important to code defensively\
    \ when acquiring locks. Even better is to make `synchronized` blocks as small\
    \ as possible and where possible avoid locking multiple objects.\n\n## Livelock\n\
    \n**Q: What is Livelock?**\n\nIn deadlock, the Threads will stop working and await\
    \ the resource to become free. In Livelock the separate Threads do not stop; they\
    \ will continue working trying to resolve the block. However by doing so the blockage\
    \ continues and will not resolve. This can happen in situations where, if a Thread\
    \ cannot access the resources it.\n\n## Thread Priority\n\n**Q: What is Thread\
    \ Priority?**\n\nIn deadlock, the Threads will stop working and await the resource\
    \ to become free. In Livelock the separate Threads do not stop; they will continue\
    \ working trying to resolve the block. However by doing so the blockage continues\
    \ and will not resolve.\n\n```java\n 1    public static void main(String[] args)\
    \ {\n 2     Thread thread = new Thread(1());\n 3     thread.setPriority(Thread.MAX_PRIORITY);\n\
    \ 4     Thread threadTwo = new Thread(2());\n 5     threadTwo.setPriority(Thread.MIN_PRIORITY);\n\
    \ 6     thread.start();\n 7     threadTwo.start();\n 8 }\n 9 \n10 private static\
    \ class Counter implements Runnable {\n 11     private int id;\n 12 \n 13    \
    \ public Counter(int i) {\n 14         id = i;\n 15     }\n 16 \n 17     @Override\n\
    \ 18     public void run() {\n 19         for (int i = 0; i < 10; i++) {\n 20\
    \             System.out.println(\"Thread \" + id + \" - \" + i);\n 21       \
    \  }\n 22     }\n 23 }\n```\n\nThis simple program launches two Threads which\
    \ count to ten. If I remove the priority lines, the output is jumbled:\n\n```text\n\
    \ 1 Thread 2 - 0\n 2 Thread 1 - 0\n 3 Thread 1 - 1\n 4 Thread 1 - 2\n 5 Thread\
    \ 1 - 3\n 6 Thread 1 - 4\n 7 Thread 2 - 1\n 8 Thread 2 - 2\n 9 Thread 2 - 3\n\
    10 Thread 2 - 4\n11 Thread 2 - 5\n12 Thread 2 - 6\n13 Thread 1 - 5\n14 Thread\
    \ 1 - 6\n15 Thread 2 - 7\n16 Thread 2 - 8\n17 Thread 1 - 7\n18 Thread 1 - 8\n\
    19 Thread 1 - 9\n20 Thread 2 - 9\n```\n\nHowever, if I run the program as it’s\
    \ shown above:\n\n```text\n 1 Thread 1 - 0\n 2 Thread 1 - 1\n 3 Thread 1 - 2\n\
    \ 4 Thread 1 - 3\n 5 Thread 1 - 4\n 6 Thread 1 - 5\n 7 Thread 1 - 6\n 8 Thread\
    \ 1 - 7\n 9 Thread 1 - 8\n10 Thread 1 - 9\n11 Thread 2 - 0\n12 Thread 2 - 1\n\
    13 Thread 2 - 2\n14 Thread 2 - 3\n15 Thread 2 - 4\n16 Thread 2 - 5\n17 Thread\
    \ 2 - 6\n18 Thread 2 - 7\n19 Thread 2 - 8\n20 Thread 2 - 9\n```\n"
