  trans: '

    你的目标应该是编写出你乐意看到它投入生产环境的代码。在最高层面上，我想看看你所产出的最优秀代码（这本该应该是你的水平）是否足够优秀，让我愿意你将其提交到我的代码库中。显然，“良好的代码”是一个非常主观的观点，但如果你提交了让你感到自豪的东西，那就是你所能做的最好的。如果你因为代码风格问题没有通过，那么你可以放心，这个团队并不适合你。作为一个例子：如果我因为没有给代码写注释而被某个团队拒绝，我会很庆幸自己错过了那个机会，因为我相信代码应该通过良好的命名和拆分来编写，以便在没有注释的情况下也能清晰地表达出发生了什么（API
    例除外）。你的代码代表了你的价值观。


    ## 提交前检查的关键要点


    - 所有方法、类、测试和变量的命名保持一致

    - 移除所有被注释的代码

    - 不要遗留未使用的代码；像 `IntelliJ` (http://cjiq.co/intellij) 这样良好的 IDE 会清晰地标亮出某段代码未被引用

    - 删除任何未使用的类或测试

    - 移除任何你为了“测试某功能是否有效”而写的 `main` 方法

    - 移除所有断点！如果审查者使用相同的 IDE，断点会显示出来


    除此之外，这归根结底在于创建一个解决问题的良好解决方案。仔细阅读问题，并记录下关注点。该问题对延迟敏感吗？是否存在海量数据？如果涉及 UI，是否有响应速度方面的考虑？如果你列出一份重要（以及不重要）的项清单，它将在你创建解决方案时提供良好的指南，以便你能够优化正确的地方。不要进行过早优化！如果解决方案要求你读取一个
    10 行的文件，不要去写一个不可思议的缓存方案。那可只有 10 行啊！


    确保编写测试。测试本身就是很棒的，但如果你为关键需求编写了测试，就可以确保你已经完成了这些任务，同时向创建者证明了你已经阅读、理解并针对这些需求编写了代码。


    完成后，将你的解决方案放入任何要求的格式（zip、github、jar）中，并带有详尽的 readme，发送到另一台电脑。如果你有一台空闲的笔记本电脑那就太好了；如果没有，也许可以用朋友的。在提交之前先在这里测试一下；你想要确保避免“在我的机器上可以运行”的问题，即代码在你的电脑上看起来正常，但由于某些奇特的设置或你做的假设而在其他地方无处运行。如果你可以发送给某人，他们不需要引导就能运行它，那么你就没问题了。提交吧，祝你好运！


    ## 技术测试之后


    接下来的步骤完全取决于招聘你的人。有些人只会给你一个简单的通过/失败结果，没有任何反馈。在这种情况下，尽管如此也请回去寻求反馈。如果你失败了，知道原因会让你感到安慰，这样你下次就可以改进（或者可能正如前面提到的风格问题，如果是那样，你就可以安放自己了）。即使你通过了，了解团队认为你可以在哪些方面改进也是很有好的。这样你可以在下一轮中消除这些顾虑。


    常见的做法是邀请你来讨论代码。我非常喜欢这个概念。通常代码本身无法解释一个设计决策，它对于招聘者来说可以是一个理解你思考方式的良好平台。你为什么那样对领域建模？你为什么使用组合而不是继承？在面试之前，花一个小时检查你的代码，尝试思考问题并准备答案。对于你为什么以某种方式编写代码说“我不知道”看起来并不好。设计和实现决策应该是深思熟虑的。我喜欢问候选人的一些关键问题：


    - 你为什么做/没有做这个最终决定？它是不可变的吗？

    - 这里有线程问题吗？

    - 这部分代码看起来很复杂。你为什么这样写？有什么方法可以简化它吗？

    - 你在这里写了注释。为什么？

    - 你为什么选择 `ArrayList`/`LinkedList`？是否有任何第三方库可以帮到你吗？

    - 你重写了 `equals`/`hashcode`。为什么？

    - 对于任何对速度有要求的地方：你测试过这带来的差异吗？


    记住，很少有“正确”答案。这些问题是为了引发讨论，并看看你是否理解了每一个选择。


    ## 介绍你的系统


    这是我在面对面试时最喜欢问的问题之一。通常，代码本身无法解释一个设计决策，它对于招聘者来说可以是一个理解你思考方式的良好平台。在目前的职位中，你可能会处理一个系统（可能是多个），并且你已经在其中投入了精力，并为某交付了价值。这应该是你非常熟悉的一个。尽管如此，被这个问题难住的候选人数量多到令人难以置信。你不会相信有多少人在这个问题上感到挣扎。


    ### 为什么会被问这个问题？


    对于面试官来说，这是衡量候选人经验的极佳方式。有些开发者经常只是使用在面前的技术，既不理解也不关心为什么。这应该引起一个巨大的红旗。

    '
- fmt: '

    If you have a way you would prefer to do it, then say that as well. Most choices
    in reality boil down to some sort of non functional requirement. “This is very
    latency sensitive so we chose this middleware to fit that requirement”. “The traders
    don’t really care so we made this a batch process as it’s easier to support”.
    Your job with this questions is to show that you understand the requirements of
    each component and how that relates to the technology choices. Don’t forget that
    requirements are never purely functional. How do you support the application?
    What is the mean time to recovery? Is the system global or local? What happens
    if your datacenter floods?


    ## Example Interview


    This interview is fictional, but should be representative of what you could expect
    in a real interview. Apply this sort of questioning to your own system.


    ### Can you please tell me about your system?


    Sure. It takes a bunch of transaction data from downstream systems and stores
    it. It performs some complex transformation on it and makes it available for end
    users and further up stream systems to use.


    ### Ok, could you draw it for me please?


    Sure. So first of all we have the importer. This slurps in the data from a bunch
    of our downstream systems which have information about orders and reporting in.
    It’s written in `Java`. It takes files once a day from 3 systems, and also has
    the option to manually import data using some web screens we threw together.


    ![](images/example-architecture-1024x767.jpg)


    ### Why did you choose to take files and not have a continuous update or something
    else?


    Legacy reasons. These systems were built many years ago and there’s a reluctance
    to invest any money in them as they basically work. This limits us as we can’t
    create things like customer reports in real time, only once a day. We are currently
    mid way through a transformational project to allow real time flows; although
    some systems will never be upgraded there are some brand new downstreams that
    need to move onto our system and want a real time interface. That’s the bulk of
    my current job. The target state is to have a real time flow of data so that the
    business can see the orders as soon as they’re put in. I’ve put an `HTTP` interface
    in there to allow intraday updates as a tactical fix. That won’t cope with the
    data loads we’re targeting but we haven’t concluded how yet.


    ### Ok, and is this system global?


    Yes, we have an importer in New York and London. The systems in each are slightly
    different in each region so we’ve had to tweak the code slightly.


    ### Do you have 1 code base then or multiple?


    We used to have multiple code bases. It was a nightmare patching fixes across
    them so we’ve recently merged into a single `GIT` repo and we’ve added feature
    toggles based on each location. I really enjoyed learning `GIT`, it’s much better
    than `SVN`, and it was nice to put feature toggles into practice.


    ### And what about failover? What happens if something goes down?


    To be honest it doesn’t happen very often, but until recently there was no failover.
    As it’s currently a batch system this has never been a problem but as we’re trying
    to move to realtime updates it means if we do get problems we get very angry users.
    As a result we’ve started running 2 instances. The second instance only exposes
    the real time features though and doesn’t touch the batches. This is because we’d
    have had to introduce complex failover mechanics to stop 2 batches occurring.
    It’s a cost/risk analysis; if something goes wrong with batch it’s ok if it’s
    delayed for a bit whilst we fix it, which isn’t the case with real time.


    ### Ok, so what does the importer do then?


    It takes the files and updates and turns them into messages and puts them on our
    global bus. We have a bunch of components that need this data so hang it off this
    bus. It’s using `IBMMQ`: not my choice, it’s mandated by the company.


    ### What would you rather use? Why choose a bus?


    I’d rather use `ActiveMQ`. It’s much easier for testing and I’ve had great experience
    with it when I’ve used it before. The bus was my idea. It removes a lot of issues
    with regards to failover. Before we had a massive web of point to point connections
    which were difficult to manage from a support perspective and meant that if a
    single component went down the system would collapse. Having a bus breaks the
    tight coupling between components and has seen our overall stability increase
    significantly; we used to have 1 outage a month last year but since introducing
    this we’ve had no full blackouts.


    ### Are there any issues using a bus?


    It’s extra middleware which can be a nightmare to manage, particularly if you
    have a centralised team like we do. It also decreases the visibility of what’s
    going on. We had some problems with messages going missing and had to very quickly
    become experts at config tuning. I think overall it was a good choice though.


    ### Do you know any other Bus technologies?


    There’s `HornetQ` and `ZeroMQ`. I’ve not had chance to play with them but I hear
    `HornetQ` is really fast.


    ### What format do you put on the wire?


    We’re using `XML`. I wanted to use `JSON` but there was push back from the upstream
    teams. `JSON` is much nicer, it’s more readable, it’s much less verbose and so
    smaller and quicker on the wire. However the other teams are heavily invested
    in `XML` so we compromised.


    ### Ok. What next?


    We have a database that hangs off that records all the data imported onto the
    bus. We need a historical record of data so this stores it for 7 years. It’s a
    basic `MySQL` instance.


    ### Why did you choose to hang it on the bus? Why not have it attached to the
    importer? Couldn’t you have a case where the bus collapses and you’ll lose a message?


    We make sure to log stuff as it comes through the importer so we can manually
    reconcile messages in a worst case scenario. If we had to do DB transaction every
    new record it would be really slow in the importer We felt it was best to decouple
    this completely. It also made failover easier, as the importers just need to worry
    about who’s publishing to the bus, and don’t need to mess around with database
    connections.


    Some of our upstreams consume this raw feed, but for others we have an enhanced
    feed. This transformer enriches the data with some information from a different
    database and puts it back onto the bus.


    ### How quick is that?


    Not very, it takes a few seconds. Right now that’s not a problem but as we move
    to real time it needs be fixed. I’d like to look at some near caching technologies
    for it.


    We also have a set of user screens that feed of the data. This talks directly
    to the transformer.


    ### What connection are you using between them?


    Plain sockets. We’ve got an embedded `Netty` server in the transformer. I’m a
    big fan of `netty`.


    ### What about failover?


    We run the Transformers in London only, but we run them hot warm. We have some
    basic heartbeating on the bus so they know which is alive. If the heartbeats stop
    then the secondary takes over.


    ### Have you had any issues with this? What about split brain?


    Yes, we’ve had split brain happen a couple of times. We were too aggressive with
    the heartbeat timeout so we’ve pushed that back. It’s an acceptable compromise,
    if the transformer gets delayed for a few seconds during failover it’s ok.


    * * *


    Hopefully you get the idea. For every system you need to be able to explain


    *   The technology choice


    *   The failover strategy


    *   The transport choice

