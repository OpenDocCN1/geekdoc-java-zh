- fmt: "\nThere is a wider range of possibilities if you’re asked to go in for a technical\
    \ test. It could be a complete equivalent of the at home test; a number of firms\
    \ don’t trust candidates not to cheat at home (and from experience I know this\
    \ does happen) and so ask them to do an exercise in the office. Normally it will\
    \ be much shorter though and take a maximum of an hour.\n\nAs opposed to a single\
    \ exercise, it’s possible to receive a number of much smaller questions like an\
    \ exam. This allows more focused questions on specific areas, and mean that if\
    \ you fail one section of it you can still pass the rest with flying colours.\n\
    \nMy preferred method is the pair programming test. In this scenario you sit down\
    \ with someone from the hiring team and program together through a predetermined\
    \ exercise. Along with being tested on your technical ability the pairing exercise\
    \ allows the hiring team to see how you work. Do you have a good grasp of keyboard\
    \ shortcuts? Do you write tests first? Why did you choose to design this the way\
    \ you did? If you get the job you will all be working together very closely, potentially\
    \ for years to come. It’s important not only that they like your coding style\
    \ but that you like theirs.\n\n## Face to Face\n\nIn person interviews are the\
    \ best chance you have at landing a job, irrelevant of what stage in the process\
    \ they are at. The simple fact is, people are bias. If you can sell yourself strongly\
    \ to an interviewer then that person is going to be your biggest salesman. “I\
    \ interviewed this guy and he was really good, we’ve got to bring him in”. Often\
    \ convincing a single person is all you need to grease the wheels of the entire\
    \ interview process.\n\nThe face to face interview is likely to cover the broadest\
    \ spectrum of questions and topics. Access to pens and paper or a whiteboard make\
    \ this the best format to ask design questions. Expect to be grilled about a system\
    \ you’ve worked on before or asked to design something on demand. Similarly, interviewers\
    \ love to ask people to write up pseudocode, particularly questions around creating\
    \ search or sort algorithms. This tees the path up nicely for some big O type\
    \ questions, but more importantly gives your potential employer the opportunity\
    \ to see how you work through a problem.\n\n### One on one\n\nThe simplest interview.\
    \ Person to person, normally for an hour or even more. This has the benefit that\
    \ you are only trying to impress a single person, but this in turn means that\
    \ if you get off on the wrong foot, or the person you’re interviewing with is\
    \ having a bad day then you have a problem. Try to get an understanding of who\
    \ your interviewer is before you go to the interview if possible. From my experience\
    \ these one to one meetings are normally with team leads or above, so whilst there\
    \ will likely be some technical content the main purpose of the exchange is to\
    \ understand how you are going to fit into the team and wider company culture.\n\
    \n### Group Grilling\n\nPersonally I think this is the most difficult of the interviews.\
    \ Normally 2 or 3 of your potential new team members will be sat on the opposite\
    \ side of the table throwing their best questions at you whilst you try your very\
    \ best not to embarrass yourself. I find this interview the worst because impressing\
    \ 3 people is really hard to do. Everyone has their own opinions and ways of working\
    \ and the likelihood of you being able to satisfy all of your interrogators is\
    \ slim.\n\n### Speed Dating\n\nThe speed dating interview involves cramming in\
    \ as many interviewers as possible within an allotted space of time. The default\
    \ tends to be working through 3 separate interviewers. You remain in a room and\
    \ interview with each one for 20 or 30 minutes, before they disappear and are\
    \ replaced with yet more people asking different questions. I’ve even experienced\
    \ this before when one of the interviewers has been dealing in using Video Conference.\
    \ From an interviewers side this is great; you get a consensus opinion from a\
    \ number of members of staff (anyone who gets a yes from all three is a definitive\
    \ pass) and it also means you can interview 3 candidates simultaneously. This\
    \ is a really effective way of churning through people.\n\nFrom the interviewee\
    \ side however it can be intense. That’s a lot of interviewing! If you’re just\
    \ doing 1 hour with one or two people then once you’re in the flow things are\
    \ good. You can get comfortable with your interviewer. However seeing lots of\
    \ different interviewers means you can’t relax. You’re constantly trying to figure\
    \ out what each person is looking for. It is really hard work, and there is no\
    \ way to prepare for it beyond regular `java` preparation. The best advice I can\
    \ give you if going in for one of these is to remember that everyone’s different.\
    \ Although generally there will be team themes (maybe they all love Test Driven\
    \ Development) the individuals will all like different facets, prefer different\
    \ technologies. As with any interview, try to strike up a rapport with the person\
    \ on the other side of the table. Whilst obviously it is important to be technically\
    \ able, a huge percentage of you success is going to come down to whether the\
    \ interviewer likes you and your attitude.\n\n## Example Interview Process\n\n\
    To give you an idea of what to expect, here are some example processes I’ve gone\
    \ through before:\n\n* **Major Australian Bank**:\n    * One on One Interview\
    \ with team manager\n    * Aptitude test\n    * 2 hour technical interview; 1\
    \ hour face to face with local developer, 1 hour with 2 developers over Video\
    \ Conference\n    * Interview With Department Heads\n* **Small Charity Firm**\n\
    \    * Face to Face with future manager and department head\n    * HR Interview\n\
    * **Major International Bank**\n    * 30 Minute phone interview\n    * Pair Programming\
    \ interview with 2 developers\n    * Group Grilling with 3 developers\n\n## Creating\
    \ your resume\n\nYou only get one opportunity for a first impression, From which\
    \ point it’s either working for you or against you. This applies across all media,\
    \ from websites (where you have 7 seconds to impress the visitor) to meeting a\
    \ new person at an interview (where you have even less). Getting off on the wrong\
    \ foot means you need to be incredibly impressive to stand a chance of landing\
    \ your new role, which whilst not impossible is certainly going to make a difficult\
    \ interview even harder. On the other hand if you arrive and can make a bond with\
    \ an interviewer then the job is yours to lose; psychologically they’re going\
    \ to be rooting for you to do well, so as long as you don’t make any major mistakes\
    \ then the person on the other side is going to try his best to get you hired.\n"
