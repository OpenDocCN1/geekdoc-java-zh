  trans: "\n你也可以借此机会展示你对其他技术的了解。面试中可能会提到了 Netty、ZeroMQ、HornetQ、IBMMQ、ActiveMQ、Git、特性开关（Feature\
    \ Toggles）、心跳机制（heartbeating）、XML vs JSON、MySQL 和 Oracle。这涉及到大量的技术和设计模式。这是展示你对领域拥有广泛知识的有效方法。了解所有内容是不可能的，因此在招聘时，寻找能够为组织引入新想法和技术的人是好的。如果你对某个都不了解，就花时间在\
    \ Google 上搜一下。输入 “ Alternatives to ” 加上技术名称，你会有大量的文章为你列出各种论点。\n\n# 第二部分：核心 Java\n\
    \n现在你已经完全准备好在面试的软技能上大放异彩，是时候学习如何回答技术问题了。面试官可能提出的问题是无尽的；Java 的世界是巨大的。那么，你应该从哪里开始呢？\n\
    \n传统方法是在 Google 上搜索各种面试题列表（这可能就是你找到这本书的方式）。事实是，通常问题会比你找到的大多数内容要深入得多——你永远不会被问列一个简单的问题列表。你真的需要理解你所谈论的领域。这正是本节将带给你的：一份针对大多数面试所需的\
    \ Java 核心领域的深度复习指南。\n\n通读这半部分，然后回到你觉得真正有困难的章节。如果你能记住那些冷门知识，那太好了，但你真正应该集中在你认为自己最中薄弱的领域上。也许你从未开发过高度多线程应用程序。在这种情况下，花时间重新重读关于线程（Threading）的内容。想出实用的代码示例；没有什么比实际编写一个解决方案更能帮助将其深存在内存中了！\n\
    \n# 面向对象编程\n\n## 基础\n\n关于面向对象编程（OOP）的问题在面试中异常常见，而且不无理由。对于初级开发者来说，这可以清楚地区分出那些真正不懂编程的人和具有潜力、但只是缺乏经验的候选人。对于更资深的候选人，我发现这有助于识别出理解良好设计以及代码应该如何组合的开发者。这里有大量的“问题”（这里是个双关语，pun\
    \ intended），非常值得投入大量精力学习。从根本上说，你将通过日常工作理解本章涵盖的所有主题，然而，能够在自己的机器上编写代码与能够解释这些概念是两码事。我们都知道（希望如此）我们的目标应该是追求低耦合和高内聚。但你能解释这意味着什么吗？你能给出一个简洁的回答吗？花时间仔细思考下面的问题。答案往往根据个人偏好和经验而异。没关系，只要你有一个有说服力的答案！\n\
    \n**Q： Java 是一种面向对象的语言。这意味着什么？**\n\n有许多不同的编程范式，OOP 只是其中另一种是函数式编程（在 Scala 等语言中变得非常流行）。程序被建模为对象（Objects），类似于现实世界中的对象。例如，在建模汽车时，你可以创建一个\
    \ `Car` 对象，它将拥有 4 个 `Wheel` 对象和一个 `Engine` 对象。一个对象由它所包含的数据以及可以对其执行或通过它执行的操作来定义。OOP\
    \ 的四个核心原则是抽象、封装、继承和多态。\n\n**Q：什么是类（Class）？什么是对象（Object）？**\n\n类可以被看作一个模板；它定义了对象看起来什么样，具体来说它将包含哪些字段和方法。对象被称为类的实例（instance）——其中字段包含数据。例如，一个\
    \ `TShirt` 类可能有一个颜色和尺寸属性。一个 `TShirt` 对象可能颜色为红色，尺寸为 XL。可以有很多个对象的实例，其字段具有不同或相同的值。\n\
    \n**Q：解释抽象、封装、继承和多态**\n\nJava 的核心特征之一是抽象和继承的概念。继承允许创建一个类，该类将拥有另一个类的相同字段和方法（可能还有更多），并且被视为同一类型。例如，`Car`\
    \ 有四个轮子和一个引擎。通过继承，我们可以创建一个 `TeslaCar`，它仍然是一个 `Car`，但还有额外的字段（如酷炫的触摸屏），或者一个 `FormulaOneCar`，它也是一辆汽车，但有一个额外的后扰器板字段。这允许我们拥有两个特殊功能：\n\
    - 如果我有一个汽车列表，我想看每辆车是什么颜色的，我不在乎它是 `TeslaCar` 还是 `ForumlaOneCar`。我只想调用 `Car` 的 `.colour()`\
    \ 方法。因为 `TeslaCar` “是一个” `Car`，我们知道它有这个方法可用。\n- 如果我们继承的 `Class` 已经有了方法的实现，我们就不需要自己写（尽管如果我们想写，也可以写）。\n\
    \n在子类中定义或重写方法的实现的能力导致了多态（Polymorphism）。在执行方法时，使用的实现不是变量类型指定的，而是变量实例的实现。\n\n```\n\
    \ 1     public static void main(String[] args) {\n 2         NumberPrinter numberPrinter\
    \ = new EvenNumberPrinter();\n 3         numberPrinter.printSomeNumbers();\n 4\
    \       }\n 5       \n 6     private static class EvenNumberPrinter extends NumberPrinter\
    \ {\n 7         public void printSomeNumbers() {\n 8             System.out.println(\"\
    2468\");\n 9          }\n 10      }\n11     \n12     private static class NumberPrinter\
    \ {\n13         public void printSomeNumbers() {\n14             System.out.println(\"\
    123456\");\n15         }\n16     ```\n\n这会打印“2468”，尽管类型是 NumberPrinter。这也是方法重写的良好例子，即子类提供了与其父类不同的实现。可以使用\
    \ `super` 关键字调用父类的非抽象方法，例如在 `EvenNumberPrinter` 的 `printSomeNumbers()` 中可以调用 `super.printSomeNumbers()`：\n\
    \n```\npublic void printSomeNumbers() {\n    super.printSomeNumbers();\n    System.out.println(\"\
    2468\");\n}\n```\n\n这将会产生\n\n```\n123456\n2468\n```\n\n接口（Interface）是一个没有实现的类。继续我们的类比，如果\
    \ `Car` 是一个带有 `.colour()` 方法的接口，它只是指定所有的 `Car` 都有一个 `colour()` 方法（而对如何实现没有任何说明）。你不能从接口创建对象，因为它没有实现或字段。\n\
    \n抽象类（Abstract Class）是另一种类。它可以包含一些未实现的方法（将标记为 `abstract`），但也可以包含一些已经实现的方法。抽象类也无法创建对象，因为缺少某些实现代码。\n\
    \n对象只能基于完整的类实例化（例如不是抽象类，不是接口）。在 Java 中，一个类可以实现零或多个接口，或者它可以扩展零或一个抽象类或具体类。\n\n封装（Encapsulation）是数据隐藏的原则。对象拥有不希望其他对象修改的内部状态，因此它可以隐藏这些内容。对象上可以访问的属性和行为仅限于创建者刻意暴露的。这在\
    \ Java 中通过访问修饰符实现：`public`、`protected`、`private` 和默认（default）。\n\n**Q：Java 中不不同的访问修饰符有哪些？它们意味着什么？**\n\
    \n*   `public`：对 JVM 中的所有人可访问\n\n*   `private`：仅在类内部可访问\n\n"
