  raw: 'After you’ve cleared the hurdles of the developer team you will normally end
    up in a room with a manager. This may be the team manager (who will likely still
    be technical to some degree) or it may be a department head (who is quite removed
    from the day to day). The likelihood is that this is going to focus heavily on
    the interpersonal fluffy questions. The purpose of this interview is to get an
    understanding of your experience as part of a team, to figure out your potential
    as an employee and to determine if you will be a good fit for the team and the
    company.


    There is no right answer to these questions and it will depend entirely on the
    values of the person interviewing you and the firm you’re interviewing with. Some
    firms are looking for people who can bring a breath of fresh air and stir things
    up, people to bring new ideas and mix things up. Once when I was being interviewed
    by a head of development I spent a huge amount of time talking about the important
    of continuous delivery and having build monitors as information radiators, all
    of which he had heard about but had never tried to implement. By showing I could
    bring some valuable new skills to the team he was exceptionally keen to hire me.


    Conversely, a large proportion of the people who interview you will be looking
    for people who can slot in seamlessly with the team or company and hit the ground
    running. If you know someone who’s already working there you can find out what
    “good” looks like to that team/company and tailor your answers accordingly, but
    most of the time you won’t know what your interviewer is specifically looking
    for. Don’t worry about this, and don’t try and guess based on the intonation or
    questions asked. Just be honest and try to show where your expertise and passion
    lies. The simple reality is not everyone will fit in everywhere, and that’s ok.
    Just talk candidly about your experiences and opinions and try and strike up interesting
    conversations.


    Be confident and outgoing. Even though the person you’re talking to is in management
    it’s no reason to get nervous. Think of the worst case scenario: you don’t get
    the job. That’s ok. Most of your peers will struggle with this interview as it’s
    heavily focused on being able to give articulate answers and have interactive
    conversations. If this is not your strong point then *practice*. Ask a friend
    (preferably not in IT) to drill you on these questions until you no longer sound
    nervous.


    ##### Example Questions


    *   What do you enjoy about going to work?


    *   What do you dislike about being a developer?


    *   Why are you leaving your current job?


    *   If you could change one thing about your current team what would it be?


    *   What does a good team look like?


    *   What makes a good developer?


    *   Tell me about a time you had conflict at work. How did you deal with it?


    *   Tell me about the biggest mistake you made at work?


    ## Technical Tests


    ### What are technical tests?


    Over the years I’ve tried many different types of ways of screening candidates;
    phone interview, speed dating style, full on technical interview and everything
    in between. My favourite method by far is the technical test, also known as the
    coding homework.


    The technical test is simply an exercise or set of exercises given for you to
    complete at home. Normally it will take one to two hours and will be reasonably
    challenging, involving some level of complexity such as Threading or algorithms.
    The instructions will likely be emailed to you, giving you a certain time frame
    within which to complete it.


    ### Why are they good?


    Most interview process do not involve the candidate writing any code. This is
    crazy! You’re interviewing to be a programmer and most job interviews don’t involve
    you doing any programming. If you’re lucky enough to be in a process which does
    involve looking at your code there are 3 main options they could use:


    *   Bring you in and watch you code. This could be a pair programming exercise
    or it could be simply sitting you in front of an exercise and watching you code.
    I’m a big fan of the pair programming interview as a mechanism to use later on
    in the interview cycle to get a good understanding of how a programmer interacts
    with other people and designs their way through a solution.


    *   Ask for a code sample. Less popular than it used to be, but the equivalent
    of asking a graphic designer for their portfolio. Most the code people write is
    for their employer and cannot be exported outside the firm, so it relies on the
    hiree having personal projects to showcase. I’d recommend if you do already have
    projects that you upload them to github and include them on your CV: you look
    good for having the project and it shows you’re proud of your code.


    *   The Technical Test!


    The problem with a pairing interview is that it takes a lot of time out of the
    hirers day, often 2 people taking 2 hours per candidate. This is expensive, and
    so it is better saved to the end of the process. Code samples on the other hand
    aren’t standardised. They give a view on what your code style is, but are unlikely
    to answer all of the questions the interviewer has about your ability. It also
    means as an interviewer I need to get myself around a new problem space and code
    base for each and every candidate which takes a lot of time and effort.


    Coding Homeworks on the other hand take relatively little time to review. They’re
    standardised, which makes the recruiting teams job easier and ensures candidates
    are compared on a level playing field. The challenge can be written to ensure
    it tests whatever facets the company values; algorithms, threading, design etc.
    Personally I find them a great first or second stage interview to sort the wheat
    from the chaff and immediately filter out a huge number of candidates. A lot of
    people talk big game on their CV but are terrible programmers.


    However be wary of using this too early in the process if you’re putting a hiring
    process together. I’ve had a number of candidates refuse to do the interview when
    they’ve not even had a phone interview yet. When asking a candidate to take 1
    or 2 hours out to write code they will often want the opportunity to talk to you
    first so they can get more information on the role and make sure it’s worth their
    time. On the other hand I’ve also had candidates be extra excited for the role
    because it’s shown we value a candidates ability to code highly, a very desirable
    attribute.


    ### How to pass


    This may sound obvious, but a the very minimum you need to produce something that
    compiles, runs and solves the problem. I’ve reviewed far too many submissions
    where the code simply didn’t compile. This is a straight no. Don’t expect the
    reviewer to spend a lot of time trying to get things working. Use a standard build
    tool like maven and include clear, step by step instructions in a readme file.


    Ensure you read and follow the instructions to the letter. I once had someone
    submit a solution in Scala despite the instructions specifying Java. This just
    wastes everyones time. If you are at all unsure then ask. Chances are you won’t
    be the first person to have the issue, and if you are then they can amend their
    instructions for future candidates.'
