  trans: "\n\n# 示例：TreeMap, TreeSet\n\n`Tree` 的实现与我们之前考虑过的任何数据结构完全不同，并且复杂得多。它基于红黑树（Red\
    \ Black tree），这是一种复杂的算法，你不太可能被问到（如果你真的感兴趣，可以看 http://www.csanimated.com/animation.php?t=Red-black_tree）。值以有序的方式存储，这种顺序由对象的自然排序决定或使用作为构造函数一部分传入的\
    \ `Comparable` 决定。这意味着在所有实现中，集合都将重新排序以维护这种自然顺序。在检索项目时，必须遍历树，对于规模较大的集合，可能需要遍历大量节点。从你的角度来看，需要注意的重要点是：**这比\
    \ HashMap 慢。** 慢得多。如果目标是速度，请始终使用 `HashMap` 或 `HashSet`。但是，如果顺序很重要，那么 `TreeMap`/`TreeSet`\
    \ 应该是你的首选集合。\n\n## 多线程与集合\n\n集合与线程在本质上是关联的；许多与线程相关的问题都是关于共享数据访问的。我们如何以快速又安全的方式从多个线程访问数据呢？\n\
    \n### 如何创建一个线程安全的集合？\n\n让某个变得线程安全的简单方法是将其变为不可变（immutable）。不可变对象是指状态无法更改的对象。如果它不能改变，那么所有线程安全地读取它而不会出现任何问题。在\
    \ Java 中可以使用 `Collections.unmodifiable` 方法实现这一点。\n\n```\n1 Collections.unmodifiableCollection\n\
    2 Collections.unmodifiableSet\n3 Collections.unmodifiableSortedSet\n4 Collections.unmodifiableList\n\
    5 Collections.unmodifiableCollection\n6 Collections.unmodifiableMap    \n7 Collections.unmodifiableSortedMap\
    \ \n```\n\n所有这些集合都作为标准集合的包装器并保证访问安全；任何修改集合的尝试都将导致 `UnsupportedOperationException`。然而，这只是数据的一个*视图*。如果每个人都通过不可变版本进行访问，那么它是线程安全的，但底层集合仍然可能改变。例如：\n\
    \n```\n 1 LinkedList<String> words = new LinkedList<>();\n 2 words.add(\"Hello\"\
    );\n 3 words.add(\"There\");\n 4 List<String> unmodifiableList = Collections.unmodifiableList(words);\n\
    \ 5 System.out.println(unmodifiableList);\n 6 words.add(\"Cheating\");\n 7 System.out.println(unmodifiableList);\n\
    \ 8 //result:\n 9 %[Hello, There]\n10 //[Hello, There, Cheating]\n```\n\n结果是这并不是真正的不可变。像\
    \ Google Guava 等第三方库中确实存在真正的 `ImmutableList` 等类，但在核心语言中并没有。同样重要的是，不可变集合通常不能满足我们程序的需求；数据通常需要被写入和读取，因此我们需要一个更大的解决方案。\n\
    \n在 Java 5 中，引入了 `java.util.concurrent` 包，其特定目的是让以线程安全的方式处理集合变得更简单。\n\n### Q：请介绍一下\
    \ Java 5 中引入的 java.util.concurrent 包。它为什么重要？它有什么意义？\n\n编写 Java 的那些人比你或我更聪明（或者说他们应该是这样的）。不需要每个人都写写自己的来实现来确保线程安全（在不破坏性能的情况下确保在正确的位置锁住正确的内容），`java.util.concurrent`\
    \ 提供了许多集合类型，以最小的性能影响保证了线程安全。\n\n它还引入了一系列其他与线程相关的特性，这些将在线程章节中介绍。\n\n### 队列 (Queues)\n\
    \n* `ConcurrentLinkedDeque`\n* `ConcurrentLinkedQueue`\n* `LinkedBlockingQueue`\n\
    * `LinkedBlockingDeque`\n* `LinkedTransferQueue`\n* `PriorityBlockingQueue`\n\
    * `ArrayBlockingQueue`\n\n那是很多队列（以及双端队列，deque）！需要注意的关键点：\n\n* `Blocking`（阻塞）队列在队列为空/满时会阻塞消费者/生产者。这是允许生产者/消费者模式的必要机制。`BlockingQueue`\
    \ 接口有 `put()` 和 `take()` 方法来实现这一点。\n* `Transfer` 队列是一种阻塞队列，具有额外的方法，允许消费者等待消息被消费。\n\
    * `Priority`（优先级）队列将根据元素的自然排序或使用构造构造时传入的 `comparator` 对元素进行排序。\n\n所有实现都使用“比较并交换”（`CAS`）操作，而不是同步块（synchronized\
    \ blocks）来确保线程安全。这确保了没有死锁风险，且线程不会卡住等待，而且速度快得多。所有基于 `CAS` 操作的集合（如上述）都具有弱一致的迭代器（weakly\
    \ consistent iterators）。这意味着它们不会抛出 `ConcurrentModificationExceptions`，但它们不保证能反映正确的状态；根据文档描述：\n\
    \n*返回的迭代器是一个“弱一致”的迭代器，它永远不会抛出 ConcurrentModificationException，并保证遍历迭代器构造时存在的元素，并且可能（但不保证）反映构造之后的任何修改。*\n\
    \n### 写时复制 (CopyOnWrites)\n\n### Q：在遍历集合时如何避免并发修改异常（ConcurrentModificationException）？\n\
    \n* `CopyOnWriteArrayList`\n* `CopyOnWriteArraySet`\n\n我是命名良好的类的类的忠实粉丝，这是一个非常棒的例子。通过在每次写入时复制整个集合，它保证了不可变性；如果我有一个迭代器在遍历集合，那么它就可以保证集合在遍历时不会被修改，因为所有修改都将导致创建一个数据的副本。这可能是一个昂贵的操作，因此这些集合更适合频繁访问但更新更新的数据。这种依赖数据被复制的迭代器被称为故障安全迭代器（fail\
    \ safe iterator）。\n\n### ConcurrentHashMap\n\n### Q：ConcurrentHashMap 是如何实现的？\n\
    \n`ConcurrentHashMap` 是一种高效的、线程安全的 `HashMap` 实现。正如之前讨论的，`HashMap` 由段（segments）组成（默认\
    \ 16 个），这些段包含根据 `HashCode` 访问的数据。在 `ConcurrentHashMap` 中，读取操作通常是不阻塞的，这使得它非常快速；写入仅按段阻塞。这意味着在进行更新时，其他\
    \ 15 个段可以无问题的读取。\n\n### Q：我应该使用 HashTable 还是 ConcurrentHashMap？\n\n`HashTable`\
    \ 是 `HashMap` 的同步实现，但它来自旧版本的 Java，不应再使用。`HashTable` 的所有操作都是同步的，这意味着相对于 `ConcurrentHashMap`\
    \ 它的性能非常差。\n\n### Q：ConcurrentLinkedQueue 和 ConcurrentHashMap 这样的集合完全线程安全的吗？\n\
    \n答案既是也不是。实现是完全线程安全的，可以作为其非线程安全对应品的替代。然而，非常有可能写出非线程安全的方式访问集合的代码。\n\n```\n1 Map<String,\
    \ String> map = new ConcurrentHashMap<>();\n2 map.put(\"a\", \"1\");\n3 map.put(\"\
    b\", \"2\");\n4 //....启动大量其他线程....\n5 if (!map.containsKey(\"c\"))\n6     map.put(\"\
    c\", \"3\");\n7 else\n8     map.get(\"c\"); \n```\n\n`contains -> put` 和 `contains\
    \ -> get` 操作不是原子的。在检查是否存在和放入/获取任何内容之间，集合中可能会发生任何变化。集合仍然是线程安全的，我们的访问方式不是。我们需要确保任何检查状态后执行的操作都是以原子或同步的方式完成的。上述代码可以通过利用\
    \ `putIfAbsent` 方法来创建原子性进行修正；然而，例如如果你想根据列表的大小对列表执行某些操作，你可能需要锁定集合以确保它作为单一操作执行。\n\
    \n## Java 异常 (Java Exceptions)\n\n"
