    or ask you to write java code on a whiteboard to reverse a string. Whether these
    are good interview questions or not isn’t the subject of this book. The simple
    fact is you have to be prepared for them, which means spending some time to revise
    the basic core java principles.


    I hope you find the everything you need in here. If you have any questions, queries,
    or just want to have a chat then you can email me on hello@corejavainterviewquestions.com.
    I will always respond.


    If you’re not already a member, don’t forget to head to www.corejavainterviewquestions.com
    and sign up to the mailing list. It’s packed with tons of valuable information
    and goodies.


    And last but not least: Good luck with all your interviews. I’m sure you’re going
    to knock them out the park.


    **Sam Atkinson, author of Java Interview Bootcamp.**


    ## Part 1: Soft Skills and Process


    Despite this being a Java focussed book, I honestly think the first half of this
    book is going to provide you with the most value. You’re a Java developer. You
    have to have some idea what you’re doing already (I hope). The second half of
    this book, focused on core Java and related questions, serves as a great way to
    revise and help relearn some areas that you’ve not touched in some time.


    However, the simple fact is that for most candidates the struggle isn’t with the
    technical side but with the softer skills. We ignore the importance of a handshake
    or a strong first impression at our peril. These are the areas that as geeks we
    suck at. We don’t like talking to other people or giving presentations. Yes, these
    are generalisations but based on the candidates I’ve met they tend to ring true.


    Work hard on this first section. Read it twice and make notes as you go through.
    Think about what stuff you didn’t know that you need to start doing and think
    about where you’re weak and need to improve, then go away and practice. Whether
    it be with a colleague or loved one, actually take the action to try things out
    before the interview. Do this and I guarantee you will stand yourself in the best
    stead for your hiring journey.


    ## The Interview Process


    Perhaps you’re a fresh grad out of university and you’ve never looked for a job
    before and now you have absolutely no idea what you’re doing. Alternatively it
    may just been a while since you last moved. In my experience developers fall into
    one of two categories: extremely fickle, moving jobs every 1-2 years, or insanely
    loyal and remaining with firms for well over 8 years. If you’re in that latter
    group in particular then it can be daunting venturing out into the real world
    again.


    The first sections of this book goes into great detail on each of the individual
    stages associated with the interview process, but first lets take a look at the
    process as a whole from a 50,000ft level.


    ### Stage 1: Applying for jobs


    The first step on the journey to better employment is simply getting your resume
    onto someones desk. How do you do this though?


    Depending on your industry, the first port of call is probably to a recruiter.
    Recruiters act as the middle man between companies and potential hires, with the
    recruiting company getting paid based on them successfully placing a candidate
    into a role. Particularly in finance recruiters are the only option for getting
    your CV seen, as most firms don’t have an easy way to directly submit your CV.


    Recruiters have pros and cons. They have access to the entire market, they know
    what roles are available and it saves you having to manually search around for
    job roles. This saves a lot of time and effort. They handle the interaction with
    the new firm so you don’t need to write cover letters or contact people directly.
    On the reverse though, not all recruiters are built equal. Some are brilliant
    and will only submit you for roles they think you’ll excel at; they will guide
    you through the whole process and be understanding and work with you to get the
    right role. However, there are a lot out there who lack integrity and are laser
    focused on getting you into a job, whatever it is, so that they can get paid.


    The best bet is to speak with friends and colleagues who have been through the
    process to see who they would recommend. I personally can highly recommend iKas
    (http://www.ikasinternational.com/) who have offices in London, New York, Australia,
    Singapore and Hong Kong, and BAH partners (http://www.bahpartners.com) who are
    exclusively Hong Kong.


    If a recruiter is not an option then be prepared to work extra hard. You’re going
    to have to manually hunt for roles and submit applications and covering letters.
    But how do you find the roles? There are a number of places online you can go
    to to find roles:


    *   http://careers.stackoverflow.com/


    *   Monthly “who’s hiring” thread at HackerNews (https://news.ycombinator.com)


    *   LinkedIn. It’s a gold mine. It has jobs directly advertised on the site, but
    you can also search for companies you like and follow them as they will advertise
    roles. Search for terms like “Java Jobs” in the groups section to find groups
    where companies directly advertise role to.


    *   Job sites and job boards like jobaware.com, indeed.com, craigslist


    This is not a fun process. You will be made to fill out your basic details over
    and over again, and you’re likely going to need to write cover letters for each
    role. But this does mean you can very specifically tailor your search to particular
    firms, roles or areas.


    ### Stage 2: Interviewing


    Every firm has a different hiring process. Whilst one company may interview you
    face to face for an hour before making a decision another one may have you go
    through 7 stages of tests and interviews with different levels of seniority. If
    possible, ask what the process is from the earliest opportunity. Your recruiter
    or the hiring manager should be able to tell you. This should give you the most
    opportunity to prepare.


    Below are the most common types of interview steps you can expect:


    #### The Phone Interview


    Phone interview’s often come early on in the recruitment process. They’re a great
    way to screen out candidates before bringing them in for a longer, more thorough
    interview. The interview will last anywhere between 15 minutes and an hour and
    will be focused on a limited subset of technical questions. Being on the phone
    limits the nature of the questions which can be asked as they all have to be verbal.
    Lack of whiteboard or pen and paper tends to make the interviews very theoretical
    or experience based, without much in the way of design.


    Occasionally phone interviews can crop up later in the cycle, normally as a final
    round. This is normally after you’ve aced all of the other stages, and the manager
    who needs to sign off wants to have a chat with you. It should just be a formality,
    and normally involves questions about your experience and what you want from the
    role.


    #### The at-home technical test


    I’m a big fan of sending a homework to a candidate. It allows you to prove you
    are technically able without the pressure of being in an interview setting. Normally
    the exercise will take between one and three hours and will ask you to develop
    an effective solution to a problem, likely involving understanding of complex
    requirements, some sort of algorithm and maybe some threading. The important thing
    is to spend the time necessary to produce code that you are proud of before you
    submit. Any team that has this stage will value code quality highly so it’s important
    not to cut corners.


    #### The In-office technical test'
