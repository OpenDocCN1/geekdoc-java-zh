- fmt: "\n# Examples: TreeMap, TreeSet\n\nThe `Tree` implementation is completely\
    \ different to any of the data structures we’ve considered before and is considerably\
    \ more complicated. It is based on a Red Black tree, a complicated algorithm which\
    \ you’re unlikely to get asked about (if you’re really keen then watch http://www.csanimated.com/animation.php?t=Red-black_tree).\
    \ Values are stored in an ordered way, determined either by the natural ordering\
    \ of the object or using a `Comparable` passed in as part of the constructor.\
    \ This means on all implementations the collection will re-sort itself to maintain\
    \ this natural order. When retrieving items it is necessary to navigate the tree,\
    \ potentially traversing a large number of nodes for sizeable collections. The\
    \ important thing to note from your perspective: **This is slower than HashMap.**\
    \ Considerably slower. If speed is the goal then always use a `HashMap` or `HashSet`.\
    \ However, if ordering is important then `TreeMap`/`TreeSet` should be your collection\
    \ of choice.\n\n## Multithreading and collections\n\nCollections and Threading\
    \ are intrinsically linked; many of the core problems related to Threading are\
    \ regarding shared data access. How can we access data from multiple threads in\
    \ a fast yet safe fashion?\n\n### How do I create a Thread Safe collection?\n\n\
    The easiest way to make something threadsafe if to make it immutable. An immutable\
    \ object is one whose state cannot be altered. If it cannot change then it is\
    \ safe for all threads to read it without any problems. This can be achieved in\
    \ Java using the `Collections.unmodifiable` methods.\n\n```\n1 Collections.unmodifiableCollection\n\
    2 Collections.unmodifiableSet\n3 Collections.unmodifiableSortedSet\n4 Collections.unmodifiableList\n\
    5 Collections.unmodifiableCollection\n6 Collections.unmodifiableMap    \n7 Collections.unmodifiableSortedMap\
    \ \n```\n\nAll of these collections act as a wrapper around a standard collection\
    \ and guarantee access safety; any attempts to modify the collection will result\
    \ in an `UnsupportedOperationException`. However, this is only a *view* on the\
    \ data. If everyone is accessing via the unmodifiable version, then this is thread\
    \ safe, however the underlying collection could still change. For example:\n\n\
    ```\n 1 LinkedList<String> words = new LinkedList<>();\n 2 words.add(\"Hello\"\
    );\n 3 words.add(\"There\");\n 4 List<String> unmodifiableList = Collections.unmodifiableList(words);\n\
    \ 5 System.out.println(unmodifiableList);\n 6 words.add(\"Cheating\");\n 7 System.out.println(unmodifiableList);\n\
    \ 8 //result:\n 9 %[Hello, There]\n10 //[Hello, There, Cheating]\n```\n\nAs a\
    \ result this isn’t really immutable. Such things as a truly `ImmutableList` do\
    \ exist in third party libraries such as Google Guava, but not in the core language.\
    \ It’s also important to note that immutable collections don’t normally satisfy\
    \ the needs of our programs; Often data needs to be written and read, so we need\
    \ a bigger solution.\n\nIn Java 5, the `java.util.concurrent` package was introduced\
    \ with the specific aim of making life easier for dealing with collections in\
    \ a thread safe way.\n\n### Q: Tell me about the java.util.concurrent package\
    \ that was introduced in Java 5. Why is it important? Why does it matter?\n\n\
    The guys who write Java are smarter than you or me (or they should be). Instead\
    \ of everyone having to write their own implementation to ensure thread safety,\
    \ making sure the right things were locked in the right places without destroying\
    \ performance, `java.util.concurrent` provides a number of collection types which\
    \ guarantee Thread safety with the minimum performance impact.\n\nIt also introduced\
    \ a bunch of other Thread related features, which will be covered in the Threading\
    \ chapter.\n\n### The Queues\n\n* `ConcurrentLinkedDeque`\n* `ConcurrentLinkedQueue`\n\
    * `LinkedBlockingQueue`\n* `LinkedBlockingDeque`\n* `LinkedTransferQueue`\n* `PriorityBlockingQueue`\n\
    * `ArrayBlockingQueue`\n\nThat’s a lot of queues (and double ended queues, a deque)!\
    \ The key things to note:\n\n* A `Blocking` queue will block a consumer/producer\
    \ when the queue is empty/full. This is a necessary mechanism to allow a producer/consumer\
    \ pattern. The `BlockingQueue` interface has `put()` and `take()` methods to allow\
    \ for this.\n* A `Transfer` queue is a blocking queue, with extra methods to allow\
    \ a consumer to wait for a message to be consumed.\n* A `Priority` queue will\
    \ order elements based on their natural ordering or using a `comparator` passed\
    \ in at construction time.\n\nAll of the implementations use Compare and Set (`CAS`)\
    \ operations, not synchronized blocks to ensure thread safety. This ensures no\
    \ risk of deadlock and Threads do not get stuck waiting, and is also significantly\
    \ faster. All collections based on `CAS` operations, such as the above, have weakly\
    \ consistent iterators. This means that they will not throw `ConcurrentModificationExceptions`\
    \ but they make no guarantee to reflect the correct state; from the documentation:\n\
    \n*The returned iterator is a “weakly consistent” iterator that will never throw\
    \ ConcurrentModificationException and guarantees to traverse elements as they\
    \ existed upon construction of the iterator, and may (but is not guaranteed to)\
    \ reflect any modifications subsequent to construction.*\n\n### The CopyOnWrites\n\
    \n### Q: How can ConcurrentModificationException be avoided when iterating a collection?\n\
    \n* `CopyOnWriteArrayList`\n* `CopyOnWriteArraySet`\n\nI’m a big fan of well named\
    \ Classes, and this is a great example. By copying the entire collection on every\
    \ write it guarantees immutability; if I have an iterator looping through a collection\
    \ then it can guarantee that the collection will not be modified as it is being\
    \ traversed as all modifications will result in a copy of the data being created.\
    \ This can be an expensive operation so these collections lend themselves better\
    \ to data that has frequent access but infrequent update. An iterator which relies\
    \ on the data being copied, such as in this case, is known as a fail safe iterator.\n\
    \n### ConcurrentHashMap\n\n### Q: How is ConcurrentHashMap implemented?\n\n`ConcurrentHashMap`\
    \ is a highly efficient, thread safe implementation of `HashMap`. As discussed\
    \ earlier, a `HashMap` is made up of segments, a number of lists (defaulting to\
    \ 16) which contain the data which are accessed based on `HashCode`. In `ConcurrentHashMap`\
    \ read operations are generally not blocking which allows for it to be very speedy;\
    \ writes only block by segment. This means that the other 15 segments can be read\
    \ without issue if an update is being written.\n\n### Q: Should I use a HashTable\
    \ or a ConcurrentHashMap?\n\n`HashTable` is a synchronized implementation of `HashMap`\
    \ but it is from an old version of Java and should no longer be used. All operations\
    \ are synchronized in `HashTable` which means it’s performance is very poor relative\
    \ to `ConcurrentHashMap`.\n\n### Q: Are collections such as ConccurrentLinkedQueue\
    \ and ConcurrentHashMap completely Thread safe?\n\nThe answer is both yes and\
    \ no. The implementation is completely ThreadSafe and can be used as a replacement\
    \ for their non Thread safe counterparts. However, it is very possible to write\
    \ code which access the collection in a non Thread safe manner.\n\n```\n1 Map<String,\
    \ String> map = new ConcurrentHashMap<>();\n2 map.put(\"a\", \"1\");\n3 map.put(\"\
    b\", \"2\");\n4 //....Set off a bunch of other threads....\n5 if (!map.containsKey(\"\
    c\"))\n6     map.put(\"c\", \"3\");\n7 else\n8     map.get(\"c\"); \n```\n\nThe\
    \ `contains -> put` and `contains -> get` operations are not atomic. Between checking\
    \ for existence and putting/getting anything can happen in the collection. The\
    \ collection is still thread safe, our access simply isn’t. We need to ensure\
    \ any operations where we check state and then execute are done in an atomic or\
    \ synchronized way. The above code could be rectified by making use of the `putIfAbsent`\
    \ method to create atomicity; however if for example you wanted to perform an\
    \ action to a list based on it’s size you may need to lock the collection to ensure\
    \ it happens as a single operation.\n\n## Java Exceptions\n"
