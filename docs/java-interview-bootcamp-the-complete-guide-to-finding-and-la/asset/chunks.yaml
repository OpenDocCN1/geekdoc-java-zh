  trans: '


    Java 异常是我在电话面试中非常喜欢问的问题之一。它们是 Java 中较简单的部分，因此我预计大多数候选人都能给出很好的答案。通常情况下，很容易筛选掉那些给不出好答案的人，因为他们不值得浪费时间。然而，我真正喜欢将异常作为面试素材的原因在于，它们能将
    Java 核心技术问题与观点性陈述结合。受检异常（Checked Exceptions）实际上是 Java 中一个极具争议的部分，看到候选人站在哪一边，或者他们是否甚至意识到这道分界线的存在，是非常有趣的。


    ## 核心问题


    **Q：什么是 Java 异常（Exception）？**


    我通常不问这个问题，因为它太基础了，但为了确保你手头有一份标准答案是有的。异常是一种以编程方式传达系统和编程错误的方法。所有异常都继承自 `Throwable`。当出现问题时，你可以使用
    `throw` 关键字来抛出异常。


    **Q：Java 中有 2 类异常，它们是什么？有什么区别？**


    这个“2 类异常”问题依然能让很多人感到困惑（是的，`throws`，我又玩了一个双关语）。这已经是 Java 核心中最基础的内容了。如果你不懂这个，说明你没有正确学习
    Java 核心（或根本没学），这可能会成为你其他知识体系不稳固的基础。请记住这个答案。两类异常是 `checked`（受检异常）和 `unchecked`（未检异常）。我在职业生涯中听过一些奇怪的答案，包括“Runtime
    和 NullPointerException”！受检异常是强制要求你捕获的异常。它是 API 或契约的一部分。任何使用抛出受检异常代码的人都可以看到这一点，因为在方法签名上已经声明了，他们被强制使用
    `try/catch` 块进行处理。未检异常不需要被捕获，也不会通知使用代码的人可能会抛出异常。


    **Q：我如何知道一个异常类是受检的还是未检的？**


    除了继承自 `java.lang.RuntimeException` 的外，所有异常都是受检异常。


    **Q：“finally”的作用是什么？**


    异常使用 `try-catch` 块进行捕获。然而，在 `catch` 之后你可以跟一个 `finally` 块。无论发生什么（除非有人拔了插头），该块都会保证执行，例如在
    `catch` 块中抛出异常时。这对于确保如 `Connections` 等资源的清理非常有用。


    **Q：我可以从同一个方法中抛出多个异常吗？我该如何捕获它们？**


    可以，每个异常（或该类的父类）只需要在方法签名的 `throws` 之后列出即可。你可以使用多个 `catch` 块来捕获它们，或者通过捕获父异常类，例如你可以直接捕获
    `Exception`，这将捕获所有异常。在理论上，这是坏习惯，因为你失去了对错误细节的感知以及特定的恢复能力。从 Java 7 开始，你也可以在单个 `catch`
    块中捕获多个异常。捕获异常时，重要的是按照从“最具体”到“最不具体”的顺序进行。如果你的 `catch` 块先捕获 `Exception` 后捕获 `IOException`，那么第一个
    `catch` 块将始终捕获任何传入的 `Exception`，导致 `IOException` 变得毫无用处（事实上，它会导致编译器错误，说明 `Exception`
    已经被捕获）。


    **Q：你对受检异常怎么看？它们是一件好事吗？**


    **Q：当你编写自己的代码并需要抛出自定义异常时，你会创建受检异常还是未检异常？**


    **Q：C# 没有受检异常。你能告诉我为什么吗？你认为 Java 还是 C# 谁是对的？**


    我太喜欢这些问题了。这是一个考察候选人并观察他们是否理解如何构建体系的极佳方式。对异常制定适当的策略是维护整洁代码库的关键，你会很快就能发现谁考虑过这个问题，而谁没有。面试前必读的读物是这篇与
    C# 创造者的访谈，内容是关于[他为什么没有在语言中引入受检异常](http://www.artima.com/intv/handcuffs.html)。总的论点是，受检异常导致
    Java 代码变得很难看。处理过程极其繁琐，通常大多数开发者不知道如何处理它们，或者太懒得去。这导致了空的 `catch` 块或仅仅是日志语句。这使得系统变得脆弱，异常被吞噬后再无音讯，系统可能会在不通知任何人的进入脆弱状态。从受检异常的积极面来看，它在
    API 上声明了它将做什么，因此调用者可以处理。如果你在发布一个库，这是好事。然而，许多开发者滥用这一点，使用异常来控制系统的流转。异常只用于特殊情况。


    与大多数讨论性问题一样，重点不在于开发者是否认同你的观点，而在于他们是否有形成观点并解释观点的能力。我个人强烈倾向于认为受检异常是糟糕的，且开发者误用了它们。在我的代码中，所有受检异常都被包装在应用程序特定的
    `RuntimeException` 中，并向上栈抛出，我通常在那里有一个 `Exception` 守护器来捕获并记录问题。然而，如果一个候选人说他们在代码中使用受检异常，并能基于对问题的理解解释其原因，那么他们就能过关。只需在参加面试前确保你已经想过自己在该问题上的立场，以便向面试官清晰地表达。如果你以前从未想过这个问题，那么请记住受检异常是邪恶的
    :)


