- fmt: '

    Your target should be to write code you would be happy to see go into production.
    At the highest level, I’m looking to see if the very best code you can produce
    (which is what this should be) is good enough that I’d be happy for you to commit
    to my codebase. Clearly “good code” is a very personal opinion but if you submit
    something you’re proud of then that is the best you can do. If you don’t pass
    because of the code style you can rest assured that the team is not a good fit
    for you. As an example; If I was rejected from a team because I didn’t comment
    my code I’d be glad I missed out because I believe that code should be written
    with good naming and broken down so that it’s clear what’s going on without comments
    (with the exception of APIs). Your code is a representation of what you value.


    ## Key things to check before you submit


    - All methods, classes, tests and variables are consistently named

    - Remove all commented out code

    - Don’t leave unused code in; a good IDE like `IntelliJ`(http://cjiq.co/intellij)
    will clearly highlight if a piece of code isn’t being referenced

    - Delete any unused classes or tests

    - Remove any `main` methods you wrote “just to test if something worked”

    - Remove all breakpoints! They show up if the reviewer uses the same IDE


    Above and beyond this it simply comes down to creating a good solution that solves
    the problem. Read the question thoroughly and jot down what the concerns are.
    Is the problem latency sensitive? Is there a large data volume? If a UI is involved
    is there a responsiveness concern? If you write a list of what’s important (and
    what’s not) it will give you a good guide when creating your solution so you can
    optomise the right things. Do not prematurely optomise! If the solution asks you
    to read in a file of 10 lines, don’t write an increadible caching solution. It’s
    10 lines!


    Make sure to write tests. Tests are great anyway, but if you have tests written
    for the key requirements you can be sure that you’ve ticked them off whilst proving
    to the creator you’ve read, understood and coded for them.


    Once you’ve finished, put your solution into whatever format requested (zip, github,
    jar) along with your comprehensive readme and email it to another computer. If
    you have a spare laptop then great, if not then maybe a friends. Try it out on
    here before you submit it; you want to ensure you avoid the issue of “Works On
    My Machine” where it looks fine on your laptop but works nowhere else because
    of some esoteric setting or an assumption you’ve made. If you can send it to someone
    and they can get it up and running with no guidance then you’re good to go. Send
    it in and keep your fingers crossed!


    ## Following the technical test


    What comes next depends entirely on who is hiring you. Some people will give you
    a simple pass/fail with no feedback. In this scenario go back and ask for feedback
    anyway. If you’ve failed then it can be comforting to know why so you can improve
    next time (or perhaps it was a style issue as mentioned, in which case you can
    rest in peace). Even if you’ve passed it can be good to know any areas the team
    felt you could have improved on. This way you can allay these fears in the next
    round.


    A common practice is to bring you in to discuss the code. I really like this as
    a concept. Often code cannot explain a design decision by itself and it can be
    a good platform for the hirer to understand how you think. Why did you model the
    domain like you did? Why did you use composition over inheritance? Before the
    interview spend an hour looking over your code trying to think of questions and
    preparing answers. Saying “I don’t know” about why you crafted your code in a
    certain way does not look good. Design and implementation decisions should be
    deliberate. Some key questions I like to ask of candidates:


    - Why did/didn’t you make this final? Is this immutable?

    - Are there any threading issues here?

    - This code seems quite complicated. Why did you write it this way? Is there any
    way you could simplify it?

    - You’ve written comments here. Why?

    - Why did you choose `ArrayList`/`LinkedList`/Other thing?

    - Are there any third party libraries that could’ve helped you with this?

    - You’ve overridden `equals`/hashhashcode`. Why? What changed as a result?

    - For anything where speed is a concern: Did you test this to see if it made a
    difference?


    Remember, there is rarely a “right” answer. The questions are there to prompt
    a discussion and to see if you understand the concerns of each choice. Don’t feel
    the need to make stuff up or compromise because you think the interviewer is looking
    for a certain answer. Stick to your opinions and have a sensible discussion!


    ## Tell me about your system


    This is one of my absolute upmost favourite questions to ask during a face to
    face interview. Right now in your current role you’ll be working on a system (maybe
    more than one), and you’ve put hours of your life into it. You probably have a
    bunch of guys and girls you’ve worked with to put the system live and deliver
    some awesome value to someone. This should be the one thing that you know really
    really well. Nonetheless the number of candidates that get caught out by this
    question is incredible. You wouldn’t believe how much some people struggle with
    this.


    ### Why are you getting asked this question?


    For the interviewer this is a great way to gauge a candidates experience. Some
    developers will often just use the technologies put in front of them and neither
    understand nor care why. This should send up a big red flag. Being a java developer
    is about much more than knowing the syntax. You need to understand why systems
    are put together the way they are and what the pros and cons are. I expect this
    from candidates irrelevant of their experience. It also doesn’t matter whether
    you were involved in architecting the system or not. You should be able to take
    a view on the decisions made, whether it’s positive or negative. Remember, the
    architecture of the system itself is not on trial; if you think it’s terrible
    then you can say as much. The important thing is that you know the weaknesses
    in your system and you can explain how you would do differently.


    #### Take advantage of the opportunity


    If you are lucky enough to get this question then seize the chance with both hands.
    More than any other part of an interview this gives you the opportunity to step
    up and show yourself as an excellent candidate. If you can crush it then you’re
    well on your way to a job offer.


    ### Preparation


    Sit down with a pen and a piece of paper and draw your system out. If you think
    the system you’re working on currently isn’t interesting then use something else
    you’ve worked on the past. As a rule of thumb the interviewer shouldn’t care specifically
    about the project you’re working on right now, they just want you to talk them
    through a system.


    Draw the relevant components. What languages are they written in and what technologies
    are frameworks used? Do you agree with those choices or do you wish there was
    something different? Draw and label the communications between them. Does it use
    files? Bus? Sockets? Pigeons?

