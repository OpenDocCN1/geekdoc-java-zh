  trans: "\n\n任何在新生代（New Generation）中存活的对象都会被晋到老年代（Old Generation）。老年代通常比新生代大得多。当老年代中发生垃圾回收（GC）时，被称为\
    \ `full GC`。全 GC 同样会导致“停世界”（stop-the-world）并且往往耗时更长，这就是为什么大多数 JVM 调优都发生在这里。有许多不同的垃圾回收算法可供选择，并且可以对新生代和老年代使用不同的算法。\n\
    \n## Q: 有哪些类型的垃圾回收器？\n\n### `Serial GC`\n设计于计算机只有一个 CPU 的时代，它在 GC 发生时会停止整个应用程序。它使用\
    \ `mark-sweep-compact`（标记-清除-压缩）算法。收集器会遍历所有对象，标记哪些对象可以进行垃圾回收，清除它们，然后将所有对象复制到连续的空间中（因此没有碎片化）。\n\
    \n### `Parallel GC`\n与 Serial 类似，区别在于它使用多个线程执行 GC 以提高速度。\n\n### `Concurrent Mark\
    \ Sweep (CMS)`\nCMS GC 通过与应用程序处理并发执行大部分 GC 相关工作来最大限度地减少暂停时间。这减少了应用程序必须完全暂停的时间，因此更适合对这种时间敏感的应用。CMS\
    \ 是一种非压缩算法，可能会导致碎片化问题。CMS 收集器在新生代使用 `Parallel GC`。\n\n### `G1GC (garbage first\
    \ garbage collector)`\n一种并发并行收集器，被视为 CMS 的长期替代方案，并且不会遭受与 CMS 相同的碎片化问题。\n\n## Q:\
    \ 哪一个更好？Serial、Parallel 还是 CMS？\n这完全取决于应用程序。每种都是根据应用程序的需求量身定制的。如果你在单 CPU 上，或者在机器上运行的虚拟机数量超过了\
    \ CPU 数量的情况下，Serial 更好。Parallel 是一个吞吐量收集器，如果你有大量工作要做但可以介意暂停，那么它非常有用。如果你需要一致的响应能力和最少的暂停，CMS/G1GC\
    \ 是这些选项中的最佳。\n\n## PermGen\n\n### Q: 什么是 PermGen？\nPermGen 是 JVM 存储类元数据的地方。它在\
    \ Java 8 中已不再存在，被元空间（metaspace）取代。通常情况下，PermGen 不需要确保空间足够之外的调优，尽管如果 `Classes`\
    \ 没有被正确卸载，可能会发生内存泄漏。\n\n## 从代码中\n\n### Q: 你可以告诉系统执行垃圾回收吗？\n这是一个有趣的问题：答案是既是又不是。我们可以使用调用\
    \ `System.gc()` 来建议 JVM 执行垃圾回收。然而，这不能保证它会产生任何作用。作为一名 Java 开发人员，我们无法确定代码具体运行在哪个\
    \ JVM 中。JVM 规范对调用此方法时会发生什么没有任何保证。甚至有一个启动标记 `-XX:+DisableExplicitGC`，它可以阻止此操作产生任何作用。\n\
    \n使用 `System.gc()` 被认为是一种坏习惯。\n\n### Q: `finalize()` 是做什么的？\n`finalize()` 是 `java.lang.Object`\
    \ 的一个方法，因此存在于所有 `Objects` 上。默认实现什么都不做。当垃圾回收器确定没有更多指向该对象的引用时，就会调用它。因此，无法保证代码是否会被执行，所以不应该用它执行实际的功能。相反，它被用于清理，例如文件引用。JVM\
    \ 永远不会对一个对象调用多次该方法。\n\n## JVM 调优\n\n### Q: 我可以使用哪些标记来调优 JVM 和 GC？\n有很多关于调优 JVM\
    \ 以获得最佳垃圾回收的教科书。你永远无法记住所有的！尽管如此，为了面试之目的，了解几个是有好的。\n\n- `-XX:-UseConcMarkSweepGC`:\
    \ 在老年代使用 CMS 收集器。\n- `-XX:-UseParallelGC`: 在新生代使用 `Parallel GC`。\n- `-XX:-UseParallelOldGC`:\
    \ 在老年代和新生代使用 `Parallel GC`。\n- `-XX:-HeapDumpOnOutOfMemoryError`: 当应用程序内存耗尽时创建线程转储（thread\
    \ dump）。对诊断非常有用。\n- `-XX:-PrintGCDetails`: 垃圾回收的详细信息。\n- `-Xms512m`: 设置初始堆大小为\
    \ 512m `-Xmx1024m`: 设置最大堆大小为 1024m\n- `-XX:NewSize` 和 `-XX:MaxNewSize`: 专门设置新生代的默认和最大大小。\n\
    - `-XX:NewRatio=3`: 设置新生代相对于老年代大小的比例。\n- `-XX:SurvivorRatio=10`: 设置 Eden 空间的大小相对于存活区（survivor\
    \ space）的大小。\n\n## 诊断\n虽然上述所有问题对于展示你对 JVM 工作原理的基本理解非常有帮助，但面试中一个标准的问题之一是：\n\n你曾经经历过内存泄漏吗？你是如何诊断它的？\n\
    \n对于大多数人来说，这是一个很难回答的问题，因为尽管他们可能做过，但很可能是很久以前的事了，并不是你可以轻易回想起来的事情。最好的准备方法是实际上尝试编写一个带有内存泄漏的应用程序并尝试诊断它。在下面我创建了一个荒谬的内存泄漏示例，它将让我们逐步通过识别问题的过程。**我强烈建议你下载代码并遵循这个过程。**\
    \ 如果你真的执行了这一过程，它更有可能被留在你的记忆中。\n\n```\n 1 import java.util.ArrayDeque;\n 2 import\
    \ java.util.Deque;\n 3 public class Main {\n 4     public static void main(String[]\
    \ args) {\n 5         TaskList taskList = new TaskList();\n 6         final TaskCreator\
    \ taskCreator = new TaskCreator(taskList);\n 7         new Thread(new Runnable()\
    \ {\n 8             @Override\n 9             public void run() {\n 10       \
    \          for (int i = 0; i < 10000; i++) {\n 11                     taskCreator.createTask();\n\
    \ 12                 }\n 13             }\n 14         }).start();\n 15     }\n\
    \ 16     private static class TaskCreator {\n 17         private Task taskList;\n\
    \ 18         public TaskCreator(TaskList taskList) {\n 19             this.taskList\
    \ = taskList;\n 20         }\n 21         public void createTask() {\n 22    \
    \         taskList.addTask(new Task());\n 23         }\n 24     }\n 25     private\
    \ static class TaskList {\n 26         private Deque<Task> tasks = new ArrayDeque<>();\n\
    \ 27         public void addTask(Task task) {\n 28             tasks.add(task);\n\
    \ 29             tasks.peek().execute();//Memory leak!\n 30         }\n 31   \
    \  }\n 32     private static class Task {\n 33         private Object[] array\
    \ = new Object[1000];\n 34         public void execute() {\n 35            //doostuff\n\
    \ 36         }\n 37     }\n 38 }\n```\n\n"
- fmt: "\nThose `Object` arrays look a bit odd. But how do we know if that’s the problem?\
    \ `Visual VM` allows us to take snapshots, like a photograph of the memory at\
    \ that time. The above screenshot is a snapshot from after the application had\
    \ only been running for a little bit. The next snapshot a couple of minutes later\
    \ confirms this:\n\n![](images/java-heap-snapshot-2.png)\n\nWe can actually compare\
    \ these directly by selecting both in the menu and selecting compare.\n\n![](images/compare-heap-snapshots.png)![](images/compare-items-from-heap-snapshots.png)\n\
    \nThere’s definitely something funky going on with the array of objects. How can\
    \ we figure out the leak though? By using the profile tab. If I go to profile,\
    \ and in settings enable “record allocations stack traces” we can then find out\
    \ where the leak has come from.\n\n![](images/visual-vm-profile.png)\n\nBy taking\
    \ snapshot and showing allocation traces we can see where the object arrays are\
    \ being instantiated.\n\n![](images/memory-leak-source.png)\n\nLooks like there\
    \ are thousands of `Task` objects holding references to `Object` arrays! But what\
    \ is holding onto these `Task` items?\n\nIf we go back to the “Monitor” tab we\
    \ can create a heap dump. If we double click on the `Object[]` in the heap dump\
    \ it will show us all instances in the application, and in the bottom right panel\
    \ we can identify where the reference is.\n\n![](images/memory-leak-object-references.png)\n\
    \nIt looks like `TaskList` is the culprit! If we take a look at the code we can\
    \ see what the problem is.\n\n```\n1 tasks.peek().execute();\n```\n\nWe’re never\
    \ clearing the reference after we’ve finished with it! If we change this to use\
    \ `poll()` then the memory leak is fixed.\n\nWhilst clearly this is a very contrived\
    \ example, going through the steps will refresh your memory for if you are asked\
    \ to explain how you would identify memory leaks in an application. Look for memory\
    \ continuing to increase despite GCs happening, take memory snapshot and compare\
    \ them to see which `Objects` may be candidates for not being released, and use\
    \ a heap dump to analyze what is holding references to them.\n\n# Threading\n\n\
    As a developer the single best thing we can do for producing clean, understandable\
    \ code that won’t fall over is to avoid putting any multi threading into your\
    \ code base. The best programmers can break most problems down to be solved without\
    \ complex threading. Poor programmers will throw threading in to fix a problem\
    \ they don’t understand or to prematurely optimise. Threading questions are exceptionally\
    \ popular for interviews so it’s important to be able to demonstrate a sound understanding\
    \ of how threads work in Java, when and why we use them, and how to actually program\
    \ them in a safe manner. In this article we will tackle threading from the ground\
    \ up and cover what you need to know to be able to answer any questions that come\
    \ up.\n\n## Introduction to Threading\n\n**Q: What is a Thread?**\n\n**Q: How\
    \ do we create Threads in java?**\n\nThreads allow us to do more than one thing\
    \ at once. Without `Threads` code is executed in a linear fashion, one command\
    \ after another. By using threads we can perform multiple actions at the same\
    \ time. This takes advantage of the fact that computers now have multiple processors\
    \ as well as the ability to time slice tasks, so multiple threads can even be\
    \ run on a single processors. There are 2 main ways to create a new `Thread` in\
    \ Java. Firstly, you can extend the `Thread` class and override the `run` method\
    \ to execute your code.\n\n```\n 1 public class SayHello extends Thread {\n 2\
    \ \n 3     public static void main(String[] args) {\n 4         new SayHello().start();\n\
    \ 5     }\n 6 \n 7     @Override\n 8     public void run() {\n 9         for (int\
    \ i = 0; i < 100; i++) {\n10             System.out.println(\"Hi there!\");\n\
    11         }\n12     }\n13 }\n```\n\nGenerally we avoid this. Java doesn’t have\
    \ multiple inheritance so this option will limit your ability to extend anything\
    \ else. More importantly, it’s just not a very pretty way of doing it. As good\
    \ developers we aim to favour composition over inheritance. Option two is much\
    \ nicer, allowing us to implement the `Runnable` interface and pass this to a\
    \ new `Thread` object. The interface has one method on it, `run`.\n\n```\n 1 public\
    \ class SayHelloRunner implements Runnable {\n 2     public static void main(String[]\
    \ args) {\n 3         new Thread(new SayHelloRunner()).start();    \n 4     }\n\
    \ 5     \n 6     @Override\n 7     public void run() {\n 8         for (int i\
    \ = 0; i < 100; i++) {\n 9             System.out.println(\"Hi there!\");\n10\
    \         }\n11     }\n12 }\n```\n\nWe pass the new `Runnable` to a `Thread` to\
    \ start it. We always use `start()` to run the thread; using `run()` will run\
    \ execute in the same thread as the caller.\n\n**Q: How do we stop a Thread in\
    \ java?**\n\nThere is actually no API level way to stop a `Thread` reliably in\
    \ java. The only guarantee is that when the code being executed in the thread\
    \ completes, the thread will finish. It is therefore down to the developer to\
    \ implement a way of telling a `Thread` to stop.\n\n```\n 1 public class SayHelloRunner\
    \ implements Runnable {\n 2     private volatile boolean running = true;\n 3 \n\
    \ 4     public void stopIt(){\n 5         running = false;\n 6     }\n 7 \n 8\
    \     @Override\n 9     public void run() {\n10         while(running)\n11   \
    \          System.out.println(\"Hi there!\");\n12     }\n13 }\n```\n\nAs you can\
    \ see in the above example the flag to check if the thread is running has the\
    \ keyword `volatile`.\n\n**Q: What is the volatile keyword?**\n\nIn modern processors\
    \ a lot goes on to try and optimise throughput such as caching. This is where\
    \ regularly accessed variables are kept in a small amount of memory close to a\
    \ processor (which can be slow). However, in a multreaded environment this can\
    \ be very dangerous as it means that two threads could see a different version\
    \ of a variable if it has been updated in cache and not written back to memory.\
    \ It tells Java that this variable could be accessed by multiple threads and therefore\
    \ should not be cached, thus guaranteeing the value is correct. It also stops\
    \ the compiler from trying to optimise the code by reordering it.\n\nThe downside\
    \ is that there is a performance penalty on using volatile variables. There is\
    \ a greater distance to travel to get access to the information as it cannot be\
    \ stored in the cache. However volatile is usually a much better option speed\
    \ wise than using a synchronize block as it will not cause threads to block and\
    \ as such is much faster than other options for synchronisation.\n\n**Q: Explain\
    \ the synchronized keyword. What does it do? Why do we need it?**\n\nSynchronized\
    \ is a keyword in java that can be used as a block around a piece of code or as\
    \ part of the method signature.\n\n```\n 1 public class Bank {\n 2     private\
    \ int funds = 100;\n 3     \n 4     public void deposit(int money){\n 5      \
    \   synchronized (this){\n 6             funds += money;\n 7         }\n 8   \
    \  }\n 9     \n10    public synchronized void withdraw(int money){\n11       \
    \ if(funds > money) \n12           funds -= money;\n13     }\n14 }\n```\n\nSynchronized\
    \ exists in Java to allow multiple threads which can both see an object to safely\
    \ access it to ensure that the data is correct. The classic example is that of\
    \ the bank account. Imagine if you remove the synchronisation from the above example.\
    \ Thread one attempts to remove 100 from the account. At the exact same time,\
    \ Thread two attempts to remove 100 from the account. For both threads when checking\
    \ if there are sufficient funds the if statement returns true, resulting in the\
    \ both withdrawing and a resultant balance of -100 which is not allowed. By using\
    \ synchronized only a single thread can access the section of code in the synchronized\
    \ block, which can help us to ensure correct state.\n"
