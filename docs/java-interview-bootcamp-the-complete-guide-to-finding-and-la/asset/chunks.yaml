  trans: '

    本书的后半部分是对核心 `java` 的从零开始的复习。事实是，在大多数面试中，技术问题与我们的日常编程几乎没有相似之处。我发现大多数面试流程甚至不涉及编程阶段。相反，公司喜欢问一些晦涩的线程问题，或者要求你在白板上用
    `java` 代码来反转字符串。这些是否是好的面试题并不是本书的主题。简单的事实是，你必须为这些问题做好准备，这意味着要花一些时间来复习基础的核心 `java`
    原则。


    我希望你在这里找到你需要的一切。如果你有任何问题、疑问，或者只是想聊聊，可以发送邮件到 `hello@corejavainterviewquestions.com`
    联系我。我一直会回复的。


    如果你还没有成员，别忘记访问 `www.corejavainterviewquestions.com` 并订阅邮件列表。里面充满了大量的有价值的信息和惊喜。


    最后，也是同样重要的一点：祝你所有面试顺利。我确信你会表现得非常出色。


    **Sam Atkinson，《Java Interview Bootcamp》作者。**


    ## 第一部分：软技能与流程


    尽管这是一本侧重于 `Java` 的书，但我诚实地认为本书的前半部分将为你提供最大的价值。你是一个 `Java` 开发者。你应该已经对自己在做什么有所了解（我希望如此）。本书的后半部分专注于核心
    `java` 和相关问题，是复习并帮助重新学习某些你一段时间未触及领域的绝佳方式。


    然而，事实是，对于大多数候选人来说，挣扎不在于技术方面，而在于软技能。忽视握手或良好的第一印象的重要性将让我们自食其果。这些是我们“极客”不擅长的领域。我们不喜欢与人交谈，也不喜欢做演示。是的，这些是概括，但根据我见过的候选人来说，这些说法往往是事实。


    在第一部分上下下功夫。读两遍，边读边做笔记。思考哪些事是你不知道但需要开始做的事情，思考你哪里是薄弱并需要改进的，然后去练习。无论是和同事还是爱人，在面试之前都要实际采取行动去尝试。。这样做，我保证你将为自己的求职之旅做好最好的准备。


    ## 面试流程


    也许你是一个刚从大学毕业的应届生，从未找过工作，现在你完全不知道自己在做什么。或者，可能只是你上一次换工作已经有一段时间了。根据我的经验，开发者分为两类：极度多变，每
    1-2 年换一次工作；另一种是极度忠诚，在一家公司留了 8 年之久。如果你特别属于后者，那么重新投身现实世界可能会令你感到畏。


    本书的前几节将详细介绍与面试流程相关的每个阶段，但首先让我们从 50,000 英尺的高度来看整个流程。


    ### 第 1 阶段：申请工作


    通往更好职业的第一步简单地将你的简历递到某人的桌上。但你如何做到呢？


    取决于你的行业，第一个选择可能是猎头。猎头在公司和潜在员工之间担任中介，招聘公司根据他们成功安置人才获得报。特别是在金融行业，猎头是让你的简历被看到的唯一选择，因为大多数公司没有简单的方法直接提交你的简历。


    猎头有优有劣。他们可以接触整个市场，知道有哪些可用职位，并节省了你手动搜索职位的时间。这节省了大量精力和。他们处理与新公司的互动，所以你不需要写求职信或直接联系人员。但反过来，并不是所有的猎头都是平等的。有些人非常有才华，只会向你推荐他们认为你能够胜任的职位；他们会引导你完成整个过程，并且理解并与你合作以获得合适的职位。然而，那里有很多人缺乏诚信，他们只专注于让你找到某份工作（无论是什么工作），以便他们能拿到报酬。


    最好的办法是和经历过这一过程的朋友和同事交谈，看看他们会推荐谁。我个人非常推荐 `iKas` (`http://www.ikasinternational.com/`)，它们在伦敦、纽约、澳大利亚、新加坡和香港设有办事处；以及专门针对香港的
    `BAH partners` (`http://www.bahpartners.com`)。


    如果猎头不是一个选项，那么就要做好加倍努力准备。你必须手动寻找职位并提交申请和求职信。但你如何找到这些职位呢？网上有很多地方可以去寻找职位：


    *   `http://careers.stackoverflow.com/`

    *   `HackerNews` (`https://news.ycombinator.com`) 上的每月“who’s hiring”帖子

    *   LinkedIn。它是一座金矿。网站上有直接广告的职位，你也可以搜索你喜欢的公司并关注它们，因为它们会发布职位。在小组部分搜索“Java Jobs”等术语，可以找到公司直接发布职位的组。

    *   招聘网站和职位公告板，如 `jobaware.com`、`indeed.com`、`craigslist`


    这不是有趣的过程。你将被要求反复填写你的基本信息，而且你可能需要为每个职位编写求职信。但这意味着你可以针对特定的公司、职位或领域定制你的搜索。


    ### 第 2 阶段：面试


    每家公司都有不同的招聘流程。虽然一家公司在做决定前与你面对面面试一小时，另一另一公司可能会让你通过 7 个阶段的测试和面试。如果可能，尽早询问流程。你的猎头或招聘经理应该能告诉你。这应该给你提供最大的准备机会。


    以下是你可能会遇到的常见面试类型：


    #### 电话面试


    电话面试通常出现在招聘流程的早期。它们是筛选候选人的很好的方法，在邀请他们进行更长时间、更深入面试之前。面试将持续 15 分钟到一小时不等，并专注于有限的技术问题。在电话上进行限制了可以提的问题性质，因为所有问题都必须是口头的。缺乏白板或纸笔往往会让面试非常理论化或基于经验，缺乏很多设计。


    偶尔电话面试可能会出现在周期的后期，通常作为最后一轮。这通常是在你通过了所有其他阶段之后，需要签字的经理想和你聊聊。这应该只是一个形式，通常涉及关于你的经验以及你对职位的要求的问题。


    #### 居家技术测试


    我非常推崇给候选人发送家庭作业。它允许你在没有面试环境压力的情况下证明自己在技术上是可行的。通常，这项练习将花费一到三小时，并要求你为一个问题开发一个有效的解决方案，可能涉及对复杂需求的理解、某种算法以及可能的一些线程。重要的一点是在提交之前，花费必要的时间产出让你自豪的代码。任何拥有这一阶段的团队都会非常看重代码质量，因此不要取径。


    #### 办公内技术测试


