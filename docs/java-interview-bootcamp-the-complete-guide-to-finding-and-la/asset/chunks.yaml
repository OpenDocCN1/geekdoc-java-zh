  trans: "\n如果你被要求参加技术测试，会有更广泛的可能性。它可能是与家庭测试完全等同的形式；许多公司不信任候选人不会在家里作弊（根据我的经验，我知道这确实会发生），因此他们要求你在办公室完成练习。不过，通常这种测试会短得多，最多只需要一小时。\n\
    \n与单一练习相比，你可能会收到一系列像考试那样的较小问题。这允许针对特定领域提出更有针对性的问题，并且意味着如果你失败了其中一个部分，仍然可以以优异的成绩通过其余部分。\n\
    \n我最喜欢的方法是结对编程测试。在这种情况下，你将与招聘团队的成员坐在一起，共同完成一项预设的练习。除了测试你的技术能力外，结对练习还让招聘团队看到你的工作方式。你熟练掌握键盘快捷键吗？你会先写测试吗？你为什么选择这样设计？如果你获得了这份工作，你们将非常紧密地合作工作，未来可能持续多年。不仅他们是否喜欢你的代码风格很重要，你喜欢他们的风格同样重要。\n\
    \n## 面试\n\n面对面面试是你获得工作的最佳机会，无论它们处于流程的哪个阶段。简单的事实是，人是有偏见的。如果你能向面试官有力地推销自己，那么那个人就会成为你最大的推销员。“我面试了这个人，他真的很棒，我们必须把他招进来。”通常，只需要说服一个人就能让整个面试流程顺畅运行。\n\
    \n面对面面试可能涵盖最广泛的问题和话题。可以使用纸、笔或白板，这使其成为提问设计问题的最佳形式。准备好会被就你以前工作过的系统进行“拷问”，或者被要求根据需求设计某些东西。同样，面试官喜欢让人们编写伪代码，特别是关于创建搜索或排序算法的问题。这为一些大\
    \ O 类型的问题铺平了道路，但更重要的是它让你的潜在雇主获得了一个观察你如何解决问题的机会。\n\n### 一对一\n\n最简单的面试。人对人，通常持续一小时甚至更久。这种方式的处处是你只需要努力给一个人留下好印象，但这也意味着如果你第一印象表现不好，或者面试你的人那天心情不好，你就有麻烦了。如果可能，在去面试之前尝试了解你的面试官是谁。根据我的经验，这些一对一会议通常是团队负责人或高级别的人员，虽然可能会有一些技术内容，但交流的主要目的是了解你将如何融入团队和更广泛的公司文化。\n\
    \n### 群体拷问\n\n我个人认为这是所有面试中最困难的。通常会有 2 或 3 位潜在的新团队成员坐在桌子对面，向你抛出他们最好的问题，而你必须尽力不要让自己尴尬。我觉得这种面试是最糟糕的，因为给\
    \ 3 个人留下印象非常困难。每个人都有自己的意见和工作方式，你满足所有审问者的概率微乎其微。\n\n### 速相面试\n\n速相面试涉及在规定的时间内安排尽可能多的面试官。默认做法通常是与\
    \ 3 位不同的面试官交流。你留在房间里，与每个人进行 20 或 30 分钟的面试，然后他们离开，并被更多问不同问题的人取代。我甚至经历过这种情况，其中一个面试官是通过视频会议处理的。从面试官的角度来看，这很棒；你可以从多位员工那里获得共识意见（任何获得三位中全部肯同的人都是确定通过），而且这意味着你可以同时面试\
    \ 3 名候选人。这是一种非常高效筛选方式。\n\n然而，从面试者的角度来看，这可能会非常紧张。那是大量的面试！如果你只是和一或两个人进行 1 小时，那么一旦你进入状态，情况就会很好。你可以和面试官变得自在。然而，看到许多不同的面试官意味着你不能放松。你不断试图弄每个人在寻找什么。这真的是非常辛苦的工作，除了常规的\
    \ `java` 准备之外，没有办法可以为此准备。如果你要去参加这种面试，我能给你的最佳建议是记住每个人都是不同的。尽管通常会有团队的主题（也许他们都喜欢测试驱动开发），但个人会喜欢不同的侧面，偏好不同的技术。和任何面试一样，尝试与桌子对面的人建立联系。虽然技术能力是显而然重要的，但你成功的很大程度上取决于面试官是否喜欢你以及你的态度。\n\
    \n## 示例流程\n\n为了让你对预期情况有个概念，这里我之前经历过的一些示例流程：\n\n*   **澳大利亚某大银行**:\n    *   与团队经理的一对一面试\n\
    \    *   能力测试\n    *   2 小时技术面试；1 小时与当地开发人员面对面，1 小时通过视频会议与 2 名开发人员交流\n    *  \
    \ 部门主管面试\n*   **小型慈善机构**:\n    *   与未来的经理和部门主管面对面\n    *   HR 人资源部面试\n*   **大型国际银行**:\n\
    \    *   30 分钟电话面试\n    *   与 2 名开发人员的结对编程面试\n    *   与 3 名开发人员的群体拷问\n\n## 创建你的简历\n\
    \n你只有一次留下第一印象的机会，从那时起，这种印象要么对你有利，要么对你不利。这适用于所有媒介，从网站（你只有 7 秒钟来给访问者留下印象）到在面试中结识新的人（你的时间更短）。第一印象不好意味着你必须表现得极其出众才有机会获得新职位，这虽然并非不可能，但无疑会让困难的面试变得更加艰难。另一方面，如果你到达并能与面试官建立联系，那么这份工作就是你触手可得的；在心理上，他们会希望你表现出色，所以只要你没有犯任何重大错误，对面的那个人就会尽力录用你。\n\
    \n"
