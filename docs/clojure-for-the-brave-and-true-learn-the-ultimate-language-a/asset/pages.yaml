    \ and then deliver a value to it. Finally, you obtain the value by dereferencing.\
    \ Dereferencing is how you express you expect a result, and if you had tried to\
    \ dereference my-promise without first delivering a value, the program would block\
    \ until a promise was delivered, just like with futures and delays. You can only\
    \ deliver a result to a promise once.\n\nOne for promises is to find the first\
    \ satisfactory element in collection of data. Suppose, for example, that you're\
    \ gathering ingredients to make your parrot sound like James Earl Jones. Because\
    \ Earl Jones the smoothest voice on earth, one of the ingredients is premium butter\
    \ with a smoothness rating of 97 or greater. You have a budget of $100 for one\
