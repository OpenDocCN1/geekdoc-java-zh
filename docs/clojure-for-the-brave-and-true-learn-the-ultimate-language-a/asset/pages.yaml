  md: '# Point


    If you''ve been following along, you should see a red-orange rectangle in your
    Emacs buffer. This is the *cursor*, and it''s the graphical representation of
    the *point*. Point is where all magic happens: you insert text at point, and most
    editing changes happen in relation to point. Even when your cursor rests on top
    of a character, point is actually located between that character and the previous
    one.


    For example, place your cursor over the fin *if you were a pirate*. Point is located
    between *I* and *f*. Now, if you use **C-k**, all the text from the *f* onward
    will disappear. **C-k** runs the command kill-line, which kills all text after
    point on the current line (I''ll tell you more about killing later). Undo with
    **C-/**. Also, try your normal OS key binding for undo; that should work as well.


    # Movement


    You can use your arrow keys to move point like any other editor, but many bindings
    allow you to navigate more efficiently, as shown in Table 2-1.


    Table 2-1: Key Bindings for Navigating Text


    | Keys | Description |

    |---|---|

    | **C-a** | Move to beginning of line. |

    | **M-m** | Move to first non-whitespace character on the line. |

    | **C-e** | Move to end of line. |

    | **C-f** | Move forward one character. |

    | **C-b** | Move backward one character. |

    | **M-f** | Move forward one word (use this a lot). |

    | **M-b** | Move backward one word (use this a lot, too). |

    | **C-s** | Regex search for text in current buffer and move to it. Press **C-s**
    again to move to match. |

    | **C-r** | Same as **C-s**, but search in reverse. |

    | **M-<** | Move to beginning of buffer. |

    | **M->** | Move to end of buffer. |

    | **M-g** | Go to line. |


    Go ahead and try out these key bindings in your *jack*-handy buffer!


    # Selection with Regions


    In Emacs, we don''t *select* text. We create *regions*, and we do so by setting
    the mark with **C-space** (CTRL-spacebar). Then, when you move point, everything
    between mark and point is the region. It''s very similar to SHIFT-selecting text
    for basic purposes.'
