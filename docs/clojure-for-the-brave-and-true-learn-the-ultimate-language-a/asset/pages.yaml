- img_proc: true
  md: "The first example returns \"By Zeus's hammer!\" because the Boolean form evaluates\
    \ to true, a truthy value, and the second example returns \"By Aquaman's trident!\"\
    \ because its Boolean form, false, evaluates to a falsy value.\nYou can also omit\
    \ the else branch. if you do that and the Boolean expression is false, Clojure\
    \ returns nil, like this:\n\n```\n(if false\n  \"By Odin's Elbow!\"\n  => nil\n\
    ```\n\nNotice that if uses operator position to associate operands with the then\
    \ and else branches: the first operand is the then branch, and the second operand\
    \ is the (optional) else branch. as a result, each branch can have only one form.\
    \ This is different from most languages. For example, you can write this in Ruby:\n\
    \n```\nif true\n  doer.do_thing(1)\n  doer.do_thing(2)\nelse\n  other_doer.do_thing(1)\n\
    \  other_doer.do_thing(2)\nend\n```\n\nTo get around this apparent limitation,\
    \ you can use the do operator.\n\ndo\n\nThe do operator lets you wrap up multiple\
    \ forms in parentheses and run each of them. Try the following in the REPL:\n\n\
    ```\n(if true\n  (do println \"Success!\"\n    \"By Zeus's hammer!\"\n  (do println\
    \ \"failure!\"\n    \"By Aquaman's trident!\"))\n  => Success!\n  => \"By Zeus's\
    \ hammer!\"\n```\n\nThis operator lets you double things in each of the if expression's\
    \ branches. In this case, two things happen: Success! is printed in the REPL,\
    \ and by \"By Zeus's hammer!\" is returned as the value of the entire if expression.\n\
    \nwhen\nThe when operator is like a combination of if and do, but with no else\
    \ branch. Here's an example:\n\n```\n(when true\n  (println \"Success!\"\n   \
    \ \"abra cadabra\")\n```"
