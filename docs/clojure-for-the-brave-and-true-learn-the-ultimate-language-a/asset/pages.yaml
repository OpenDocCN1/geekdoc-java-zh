    # Per-Thread Binding


    One final point to note about binding: if you access a dynamically bound var from
    a manually created thread, the var will evaluate to the original value. If you''re
    new to Clojure (and Java), this feature won''t be immediately relevant; you can
    probably skip this and come back to later.


    Ironically, this binding behavior prevents us from easily creating a fun demonstration
    in the REPL, the REPL binds *out*. It''s all if the code you run in the REPL is
    implicitly wrapped in something like (binding [*out* repl-printer]*) your-code.
    If you create a new thread, *out* won''t be bound to the REPL printer.


    The following example uses some basic Java interop. Even if it looks unfamiliar,
    the gist of the following code will be clear, and you''ll learn exactly what''s
    going in Chapter 12.

    This code prints out to the REPL:


    ```

    (.write *out* "prints to repl")

    ; => prints repl

    ```


    The following code doesn''t print output to the REPL, because *out* is not bound
    to the REPL printer:


    ```

    (.start (Thread. #(write *out* "prints to standard out\)))

    ```


    You can work around this using this goofy code:


    ```

    (let [out*]

    (.start

    (Thread. #(binding [*out* out])

    (.write *out* "prints to repl from thread\))))

    ```'
