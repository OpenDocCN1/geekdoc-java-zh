  md: 'When the reader encounters the single quote, it expands it to a list whose
    first member is the symbol quote and whose second member is the data structure
    that followed the single quote. The deref macro works similarly for the @ character:


    ```

    (read-string "@var")

    ; => (clojure.core/deref var)

    ```


    Reader macros can do crazy stuff like cause text to be ignored. The semicolon
    designates the single-line comment reader macro:


    ```

    (read-string "; ignore!\n(+ 1 2)")

    ; => (+ 1 2)

    ```


    And that''s the reader! Your humble companion, toiling away transforming text
    into data structures. Now let''s see how Clojure evaluates those data structures.


    # The Evaluator


    You can think of Clojure''s evaluator as a function that takes a data structure
    as an argument, processes the data structure using rules corresponding to the
    data structure''s type, and returns a result. To evaluate a symbol, Clojure looks
    up what the symbol refers to. To evaluate a list, Clojure looks at the first element
    of the list and calls a function, macro, or special form. Any other values (including
    strings, numbers, and keywords) simply evaluate to themselves.


    For example, let''s say you typed (+ 1 2) in the REPL. Figure 7-5 shows a diagram
    of the data structure that gets sent to the evaluator.


    Because it''s a list, the evaluator starts evaluating the first element in the
    list. The first element is the symbol, and the evaluator resolves that by returning
    the corresponding function. Because it is a function, the evaluator evaluates
    each of the operands. The operands 1 and 2 evaluate themselves they are not lists
    or symbols. Then the evaluator calls the addition function with 1 and 2 as the
    operands, and returns the result.


    ![](img/f978a379512d9fe18f046e71e9900d2e_181_0.png)


    Figure 7-5: The data structure for (+ 1 2)


    The rest of this section explains the evaluator''s rules for each kind of data
    structure more fully. To show how the evaluator works, we''ll just run each example
    in the REPL. Keep in mind that the REPL first reads your text to get a data structure,
    then sends that data structure to the evaluator, and then prints the result as
    text.'
