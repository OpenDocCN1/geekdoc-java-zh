  md: 'In the first operation, the operator + adds the operands 1, 2, and 3. In the
    second operation, the operator str concatenates three strings to form a new string.
    Both are valid forms. Here''s something that is not a form because it doesn''t
    have a closing parenthesis:


    ```

    +

    ```


    Clojure''s structural uniformity is probably different from what you''re used
    to. In other languages, different operations might have different structures depending
    on the operator and the operands. For example, JavaScript employs a smorgasbord
    of infix notation, and parentheses:


    ![](img/f978a379512d9fe18f046e71e9900d2e_63_0.png)


    ```

    1 + 2 + 3

    "Was the panda .concat("in the library ", "with a duster bust")

    ```


    Clojure''s structure is very simple and consistent by comparison. No matter what
    operator you''re using or what kind of data you''re operating on, the structure
    is the same.


    # Control Flow


    Let''s look at three basic control flow operators: if, do, and when. Throughout
    the book you''ll encounter more, but these will get you started.


    # if


    This is the general structure for an if expression:


    ```

    (if boolean-form

    then-form

    optional-else-form)

    ```


    A boolean form is just a form that evaluates to a truthy or false value. You''ll
    learn about truthiness and falseness in the next section. Here are a couple of
    if examples:


    ```

    (if true

    "By Zeus''s hammer!"

    "By Aquaman''s trident!"

    ;=> "By Zeus''s hammer!")

    ```


    ```

    (if false

    "By Zeus''s hammer!"

    "By Aquaman''s trident!"

    ;=> "By Aquaman''s trident!")

    ```'
