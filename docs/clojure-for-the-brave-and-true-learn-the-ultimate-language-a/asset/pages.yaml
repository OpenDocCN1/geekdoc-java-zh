  md: '(defn random-string

    "Returns a random string of specified length"

    [length]

    (apply str (length (repeatedly #(rand-nth letters))))


    (defn random-string-list

    [list-length string-length]

    (doall (take-list (repeatedly (partial random-string string-length))))


    (def orc-names (random-string-list 3000 7000))


    Because map and pmap are lazy, we have to force them to be realized. We don''t
    want the result to be printed to the REPL, though, because that would take forever.
    The doall function does just what we need: it returns the sequence nil:


    (time (dorun (map clojure.string/lower-case orc-names))

    => "Elapsed time: 270.182 msecs"


    (time (dorun (pmap clojure.string/lower-case orc-names))

    => "Elapsed time: 147.562 msecs"


    The serial execution with pmap took about 1.8 times longer than pmap, and all
    you had to add one extra layer! Your performance may be even better, depending
    on the number of cores your computer has; this code was run on a dual-core machine.


    You might be wondering why the parallel version didn''t take exactly half as long
    as the serial version. After all, it takes two cores half as much time as a single
    core, shouldn''t it? The reason is that there''s some overhead involved with creating
    and coordinating threads. Sometimes, in fact, the time taken by this overhead
    can dwarf the time of each function application, and pmap can actually take longer
    than map. Figure 10-3 shows how you can visualize this.


    ![](img/f978a379512d9fe18f046e71e9900d2e_255_0.png)


    Serial mapping


    | | | | |

    |---|---|---|---|n| pmap, 2 cores | | | |


    Figure 10-3: Parallelization overhead can dwarf task time, resulting in a performance
    decrease.'
