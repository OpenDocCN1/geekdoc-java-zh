- img_proc: true
  md: 'This chapter is like a cross between a phrase book and cultural introduction
    for the Land of Java. You''ll learn what the JVM is, how it runs programs, and
    how to compile programs for it. This chapter will also give you a brief tour of
    frequently used Java classes and methods, and explain how to interact with them
    using Clojure. You''ll learn how to think and understand Java so you can incorporate
    any Java library into your Clojure programs.


    To run the examples in this chapter, you''ll need to have the Java Development
    Kit (JDK) version 1.6 or later installed on your computer. You can check by running
    javac -version at your terminal. You should see something like java 1.8.0_40;
    if you don''t, visit http://www.oracle.com/to download the latest JDK.


    # The JVM


    Developers use the term JVM to refer to a few different things. You''ll hear them
    say, "Clojure runs on the JVM," and you''ll also hear, "Clojure programs run in
    a JVM." In the first case, JVM refers to an abstraction—the general model of the
    Java Virtual Machine. In the second, it refers to a process—an instance of a running
    program. We''ll focus on the JVM model, but I''ll point out when we''re talking
    about JVM processes.


    To understand the JVM, let''s step back and review how plain old a computer''s
    heart is its CPU, and the CPU''s job is to execute operations like add and unsigned
    multiply. You''ve probably heard about programmers encoding these instructions
    on punch cards, in lightbulbs, in the sacred cracks of a tortoise shell, or whatever,
    but nowadays operations are represented in assembly language by mnemonics like
    ADD and MUL. The CPU architecture (x86, ARM7, and what you have determines what
    operations are available as part of the architecture''s instruction set.


    Because it''s no to program in assembly language, people have invented higher-level
    languages like C and C++, which are compiled into instructions that a CPU will
    understand. Broadly speaking, the process is:


    +   1. The compiler reads source code.


    +   2. The compiler outputs a file containing machine instructions.


    +   3. The CPU executes those instructions.


    Notice in Figure 12-1: ultimately, you have to translate programs into instructions
    that a CPU can''t understand which programming language you use to produce those
    instructions.


    The JVM is analogous to a computer in it also needs to translate code into low-level
    instructions, called Java bytecode. However, as a virtual machine, a running JVM
    executes bytecode by translating it on the fly into machine code that its host
    will understand, a process called just-in-time compilation.'
