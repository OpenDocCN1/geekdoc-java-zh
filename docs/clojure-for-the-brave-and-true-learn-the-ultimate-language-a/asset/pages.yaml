  md: "these types enables you to safely perform state-modifying operations concurrently.\
    \ You'll also learn easy ways to make your program more efficient without introducing\
    \ state at all.\n\nMetaphysics attempts to answer two basic questions in the broadest\
    \ possible terms:\n\n+   - What is there?\n- What is it like?\n\nTo draw out the\
    \ differences between Clojure and OO languages, I'll explain two different ways\
    \ of modeling a cuddle zombie. Unlike a regular zombie, a cuddle zombie does not\
    \ want to devour brains. It only wants to spoon you and maybe smell your neck.\
    \ That makes its undead, shuffling, decaying state all the more tragic. How could\
    \ you try to kill something that only loves? Who's the real monster here?\n\n\
    # Object-Oriented Metaphysics\n\nOO metaphysics treats the cuddle zombie as an\
    \ object that exists in the world. The object has properties that may change over\
    \ time, but it's still treated as a single, constant object. If that seems like\
    \ a totally obvious, uncontroversial approach to zombie metaphysics, you probably\
    \ haven't spent hours in an intro philosophy arguing about what it means for a\
    \ chair to exist and what really makes it a chair in the first place.\n\nThe trick\
    \ is that the cuddle zombie is always changing. Its unchanging for hunger grows\
    \ fiercer with time. In OO terms, we would say that the cuddle zombie is an object\
    \ with mutable state and that state is ever fluctuating. But no matter much the\
    \ zombie changes, we still identify it as the same zombie. Here's how you might\
    \ model and interact with a cuddle zombie in Ruby:\n\n```\nclass CuddleZombie\n\
