  md: 'Predit also offers key bindings to easily navigate and alter the structure
    created by all those parentheses. In the next section, I''ll go over the most
    useful bindings, but you can also check out a comprehensive cheat sheet at https://github.com/george/paredit-cheatsheet/blob/master/paredit-cheatsheet.pdf
    (in the cheat sheet, the red pipe represents point).


    However, if you''re not used to it, paredit can sometimes be annoying. I think
    it''s worth your while to take some time to learn, but you can disable it with
    M-x paredit-mode, which toggles the mode on and off.


    The following section shows you the most key bindings.


    # Wrapping and Slurping


    Wrapping surrounds the expression after point with parentheses. Slurping moves
    a closing parenthesis to include the next expression to the right. For example,
    say we start with:


    +   + 1 2 3 4


    and want to get this:


    +   + 1 (* 2 3 4


    We can wrap the 2, add an asterisk, and then slur the 3. First, place point, which
    is represented here as a vertical pipe, |:


    +   + 1 |2 3 4


    Then type M-, the binding for paredit-wrap-round, getting this result:


    +   + 1 (|2) 3 4


    Add the asterisk and a space:


    +   + 1 (*| 2 3 4


    To slur in the 3, press C-→.


    +   + 1 (*|2 3 4


    This makes it easy to add and extend parentheses without wasting precious moments
    holding down arrow keys to move point.


    # Barfing


    Suppose, in the preceding example, you accidentally slurped the four. To unslurp
    it (also known as barfing), place your cursor (| anywhere in the inner parentheses:


    +   + 1 (|* 2 3 4'
