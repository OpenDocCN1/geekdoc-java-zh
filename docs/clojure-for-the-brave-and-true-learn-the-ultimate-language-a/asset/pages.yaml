  md: "One characteristic The Three Concurrency Goblins have in common is that all\
    \ involve tasks concurrently accessing a shared resource—a variable, a printer,\
    \ a dwarven axe—in an uncoordinated way. If you want to ensure that only one task\
    \ will access a resource at a time, you can place the resource access portion\
    \ of task on a queue that executed serially. It's kind like making a cake: you\
    \ and a friend can separately retrieve the ingredients (eggs, flour, eye of newt,\
    \ what you have), but some steps you have to perform serially. You have to prepare\
    \ the batter before you put it in the oven. Figure 9-6 illustrates this strategy.\n\
    \n![](img/f978a379512d9fe18f046e71e9900d2e_229_0.png)\n\nFigure 9-6: Dividing\
    \ tasks into a serial portion and a concurrent portion lets you safely make your\
    \ code more efficient.\n\nTo implement the queuing macro, you'll pay homage to\
    \ the British, because they invented queues. You'll use a queue to ensure that\
    \ the customary greeting \"Hello, go'na! Pip pip! Cheerio\" is delivered in the\
    \ correct order. This demonstration will involve an abundance of sleeping, so\
    \ here's a macro to do that concisely:\n\n```\ndefmacro wait\n  Sleep 'timeout'\
    \ seconds before evaluating body\n  [timeout & body]\n  (do Thread/sleep ~timeout)\
    \ ~body)\n```\n\nAll this code does whatever forms you give it and insert a call\
    \ to Thread/sleep before them, all wrapped up in do. The code in Listing 9-1 splits\
    \ tasks into a concurrent portion and a serialized portion:\n\n```\n(let saying3(promise)\n\
    (future deliver saying3(wait 100 \"Cheerio!\"))\n@let(saying2(promise))\n(future\
    \ deliver saying2(wait 400 \"Pip pip!\"))\n@let(saying1(promise))\n(future deliver\
    \ saying1(wait 200 \"Hello, go'na!\"))))\n```"
