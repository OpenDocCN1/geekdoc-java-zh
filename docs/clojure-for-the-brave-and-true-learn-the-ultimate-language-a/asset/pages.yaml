    # Numbers


    Clojure has pretty sophisticated numerical support. I won''t spend much dwelling
    on the boring technical details (like coercion or contagion) because that will
    get in the way of doing things. If you''re interested in boring details, check
    out the documentation at http://clojure.org/data_structures#Data%20Structures-Numbers.
    Suffice to say, Clojure will merrily handle pretty much anything you throw at
    it.


    In the meantime, we''ll work with integers and floats. We''ll also work with ratios,
    which Clojure can represent directly. Here''s an integer, a float, and a ratio,
    respectively:


    ```

    93

    1.2

    1/5

    ```


    # Strings


    Strings represent text. The name comes from the ancient Phoenicians, who one day
    they invented the alphabet after an accident involving yarn. Here are some examples
    of string literals:


    ```

    "Lord Voldemort"

    "\He who must not be named\""

    "\Great cow of Moscow!\" - Hermes Conrad

    ```'
