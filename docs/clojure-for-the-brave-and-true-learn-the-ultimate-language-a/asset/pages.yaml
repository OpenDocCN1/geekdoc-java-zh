  md: '# memoize


    Another cool thing you can do with pure functions is memoize them so that Cloj
    remembers the result of a particular function call. You can do this, as you learned
    earlier, pure functions are referentially transparent. For example, + is referentially
    transparent. You can replace


    ```

    (+ 3 (+ 5 8))

    ```


    with


    ```

    (+ 3 13)

    ```


    or


    16


    and the program will have the same behavior.

    Memoization lets you take advantage of referential transparency by storing the
    arguments passed to a function and the return value of the function can return
    the result immediately. This is especially useful for functions that can take
    a lot of time to run. For example, in this unmemoized function, the result is
    returned after one second:


    ```

    (def sleepy-identity

    "Returns the given value after 1 second"

    [x]

    (Thread/sleep 1000)

    sleepy-identity "Mr. Fantastico"

    => "Mr. Fantastico" after 1 second

    sleepy-identity "Mr. Fantastico"

    => "Mr. Fantastico" after 1 second

    ```


    However, if you create a new, memoized version of sleepy-identity with memoize,
    only the first call will wait one second; every subsequent function call returns
    immediately:


    ```

    (def memo-sleepy-identity (memoize sleepy-identity)

    memo-sleepy-identity "Mr. Fantastico"

    => "Mr. Fantastico" after 1 second

    memo-sleepy-identity "Mr. Fantastico"

    => "Mr. Fantastico" immediately

    ```


    Pretty cool! From here on, memo-sleepy-identity will not incur the initial one-second
    cost when called with "Mr. Fantastico". This implementation could be useful for
    functions that are computationally intensive or that make network requests.'
