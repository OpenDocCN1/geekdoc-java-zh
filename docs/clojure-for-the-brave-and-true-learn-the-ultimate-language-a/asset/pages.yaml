  md: "This particular map has an invalid email address (it's missing the @ symbol),\
    \ so this is exactly the kind of order that our validation code should catch!\
    \ Ideally, we want to write code that produces something like this:\n\n```\n(validate-order-details\
    \ order-details-validations\n; => {:email [\"Your email address doesn't look like\
    \ an email.\"])\n```\n\nThat is to be able to call a function, with the data that\
    \ needs validation and a definition for how to validate it. The result should\
    \ be a map where each key corresponds to an invalid field, and each value is a\
    \ vector of one or more validation messages for that field. The following two\
    \ functions do job.\n\nLet's look at order-details-validations first. Here's how\
    \ you could represent validations:\n\n```\n(def order-details-validations\n{:name\n\
    \ [\"Please enter a name\" not-empty]\n\n:email\n [\"Please enter an email address\"\
    \ not-empty]\n\n\"Your email address doesn't look like an email address\"\n#(or\
    \ (empty %?) (re-seq \"#\"))))\n```\n\nThis is a map where each key is associated\
    \ with a vector of error message and validation functions. For example, :name\
    \ has one validating function, not-empty; if that validation fails, you should\
