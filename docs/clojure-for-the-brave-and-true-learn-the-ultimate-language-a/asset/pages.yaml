  md: '# Further Study


    Clojure offers other tools for working with abstractions and data types. These
    tools, which I consider advanced, include detype, reify, and proxy. If you''re
    interested in learning more, check out the documentation on data types at http://clojure.org/datatypes/.


    # Summary


    One of Clojure''s design principles is to write to abstractions. In this chapter,
    you learned how to define your abstractions using multimethethods and prototypes.
    These constructs provide polymorphism, allowing the same operation to behave differently
    based on the arguments it''s given. You also learned how to create and use your
    own associative data types with defrecord


    When I started learning Clojure, I was pretty shy about using multimethods, protocols,
    and records. However, they are often used in Clojure libraries, so it''s good
    to know how they work. Once you get the hang of them, they''ll help you write
    cleaner code.


    # Exercises


    +   1. Extend the full-moon-behavior multimethethod to add behavior for your kind
    of were-creature.

    2. Create a WereSimmons record type, and then extend the WereCreature protocol.

    3. Create your own protocol, and then extend it using extend-type and extend-protocol.\n4.
    Create a role-playing game that implements behavior using multiple dispatch.'
