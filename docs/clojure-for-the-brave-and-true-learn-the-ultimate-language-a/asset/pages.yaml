    # Commonly Used Java Classes


    Round out this chapter, let’s take a quick tour of the Java classes that you’re
    most likely to use.


    # The System Class


    The System class has useful class fields and methods for interacting with the
    environment that your program’s running in. You can use it to get environment
    variables and interact with the standard input, standard output, and error output
    streams.

    The most useful methods and members are exit, getenv, and get. You might recognize
    System/exit from Chapter 5, where you used it to exit the Peg Thing game. System/exit
    terminates the current program, and you can pass a status code as an argument.
    If you’re not familiar with status codes, I recommend Wikipedia’s “Exit status”
    article at http://en.wikipedia.org/wiki/Exit_status.

    System/getenv will return all of your system’s environment variables as a map:


    ```

    (System/getenv)

    ("USER" "the-incredible-bulk"

    "JAVA ARCH" "x86_64")

    ```


    One common use for environment variables is to configure your program.'
