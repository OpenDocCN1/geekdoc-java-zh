  md: 'When it comes to sequences, Clojure also creates indirection by doing a kind
    of lightweight type conversion, producing a data structure that works with an
    abstraction’s functions. Whenever Clojure expects a sequence—for example, when
    you call map, first, rest, or cons—it calls the seq function on the data structure
    in question to obtain a data structure that allows for first, rest, and cons:


    ```

    (seq [1 2 3])

    =>1 2 3)

    ```


    ```

    (seq [1 2 3])

    =>1 2 3

    ```


    ```

    (seq [#1 2 3])

    =>1 2 3

    ```


    ```

    (seq {:name "Bill Compton" :occupation "Dead mpey guy"])

    =>[{:name "Bill Compton" :occupation "Dead mpey guy"}]

    ```


    There are two notable details here. First, seq always returns a value that looks
    like a list; you call it a sequence or seq. Second, the seq of a map consists
    of two-element key-value vectors. That’s why your maps maps to lists of vectors!
    You can see this in particular particular the "Bill Compton" example. It might
    be surprising and confusing. It was for me when I first started using Clojure.
    Knowing these underlying mechanisms will spare you from the kind of frustration
    and general mopiness often exhibited by male vampires trying to retain their humanity.


    You can convert the seq back into a map by using into to stick the result into
    an empty map (you''ll look into closely later):


    ```

    {info (seq {:a 1 :b 2 :c 3}))

    =>{:a 1, :c 3, :b 2}

    ```


    So, Clojure’s functions use seq on their arguments. The sequence functions are
    defined in terms of the sequence abstraction, using first, rest, and cons. As
    long as a data structure implements the sequence abstraction, it can use the extensive
    seq library, which includes such superstar functions as reduce, filter, distinct,
    group-by, and dozens more.


    The takeaway here is that it’s powerful to focus on what we can do with a data
    structure and to ignore, as much as possible, its implementation. Implementations
    rarely matter in and of themselves. They’re just a means to an end. In general,
    programming to abstractions gives you power by letting libraries of functions
    on different data structure regardless of how those data structures are implemented.'
