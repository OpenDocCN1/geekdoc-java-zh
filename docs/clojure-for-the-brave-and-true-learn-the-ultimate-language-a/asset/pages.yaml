    The binding captures *out* so we can reinbind the child thread, which is goofy
    as hell. The point is that bindings do not get passed on manually created threads.
    They do, however, get on to futures. This is called binding conveyance. Throughout
    this chapter, we''ve been printing from futures without any problem, for example.


    It''s for dynamic binding. Let''s turn our attention to the last var: altering
    roots.


    # Altering the Var Root


    When you create a new var, the initial value that you supply is its root:


    ```

    (def power-source "hair")

    ```


    In this example, "hair" is the root value of power-source. Clojure lets you permanently
    change this root value with the function alter-var-root:


    ```

    (alter-var-root #power-source (fn [] "7-eleven parking lot")

    power-source

    => "7-eleven parking lot")

    ```


    Just like swap! to update an atom or alter! to update a var, you use alter-var-root
    along with a function to update the state of a var. In this case, the function
    is returning a new string that bears no relation to the previous value, unlike
    the alter! examples we used here to derive a new number from the current number.


    You''ll ever want to do this. You especially don''t want to do this to perform
    simple variable assignment. If you did, you''d be going out of your way to create
    the binding as a mutable variable, which goes against Clojure''s philosophy; it''s
    best to use the functional programming techniques learned in Chapter 5.


    You can temporarily alter a var''s root with-rebinds. This works similarly to
    binding except the alteration will appear in child threads. Here''s an example:


    ```

    (with-rebinds [out* "out*\]

    (do (Thread. #(println "with rebinds allows me to show up in the REPL")

    .start

    .join))

    ```


    With-rebinds may be more appropriate than bindings for setting up a test environment.
    It''s also more widely applicable, in that you can use it for any var, not just
    ones.


    Now you know all about vars! Try not to hurt yourself or anyone you know with
    them.'
