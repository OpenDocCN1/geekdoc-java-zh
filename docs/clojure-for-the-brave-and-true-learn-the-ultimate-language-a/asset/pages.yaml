  md: "# Atoms\n\nClojure's atom reference type allows you to endow a succession of\
    \ related values with an identity. Here's how you create one:\n\n```\n(def ref\
    \ (atom {:cuddle-hunger-level 0 :percent-deteriorated 0}))\n```\n\nThis creates\
    \ a new atom and binds it to the name fred. This atom refers to the value {:cuddle-hunger-level\
    \ 0 :percent-deteriorated 0}, and you would say that's its current state.\n\n\
    To get an atom's current state, you dereference it. Here's Fred's state:\n\n```\n\
    @fred\n=> {:cuddle-hunger-level 0, :percent-deteriorated 0}\n```\n\nUnlike delays,\
    \ and promises, dereferencing an atom (or any other reference type) will never\
    \ block. When you dereference a delay, or promises, it's like you're saying \"\
    I need a value, and I will wait until I get it,\" so it makes sense that the operation\
    \ would block. However, when you dereference a reference type, it's like you're\
    \ saying \"give me the value I'm currently referring to,\" so it makes sense that\
    \ the operation doesn't block, because it doesn't have to wait for anything.\n\
    \nIn the Ruby example in Listing 10-1 we saw how data could change while you log\
    \ it on a separate thread. There's no danger of that happening when using atoms\
    \ to manage state, because each state is immutable. Here's how you could log a\
    \ zombie's state with println:\n\n```\n(let [zombie-state @fred]\n  (if (>= (:percent-deteriorated\
    \ zombie-state) 50)\n    (println (:percent-deteriorated zombie-state))))\n```\n\
    \nThe problem with the example in Listing 10-1 is that it took two steps to read\
    \ the zombie's two attributes, and some other thread could have changed attributes\
    \ between the two steps. However, by using atoms to refer to immutable data structures,\
    \ you only have to perform one read, and the data structure returned won't get\
    \ altered by another thread.\n\nTo update the atom so that it refers to a new\
    \ state, use swap!. This might seem contradictory, I said that atom values are\
    \ unchanging. Indeed, they are! But now we're working with the atom reference\
    \ type, a construct that refers to atom values. The atomic values don't change,\
    \ but the reference type can be updated and assigned a new value. swap! receives\
    \ an atom and a function as arguments. It applies the function to the atom's current\
    \ state to produce a new value, and then it updates\n\n212 Chapter 10"
