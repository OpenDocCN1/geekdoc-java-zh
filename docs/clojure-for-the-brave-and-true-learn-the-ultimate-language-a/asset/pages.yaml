    ```\n\nBoth nil and false are used to represent logical falseness, whereas other\
    \ values are logically truth. Truthy and falsy refer to how a value is treated\
    \ in a Boolean expression, like the first expression passed to if:\n\n```\n(if\
    \ \"bears eat beets\"\n  \"bears beats Battlestar Galactica\"\n  => \"bears beats\
