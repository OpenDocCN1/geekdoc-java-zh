  md: 'compiler constructs an abstract syntax tree (AST), which is a data structure
    that represents your program. You can think of the AST as the input to the evaluator,
    which you can think of as a function that traverses the tree to produce the machine
    code or whatever as its output.


    So this sounds a lot like what I described for Clojure. However, in most languages
    the AST''s data structure is inaccessible within the programming language space
    and the compiler space are forever separated, and never the Twain shall meet.
    Figure 7-1 shows how you might visualize the compilation process for an expression
    in a non-Lisp programming language.


    ```

    1 + 6 * 7

    ```


    +   - Text gets parsed and lexed...


    +   - ...which pops out a happy little AST.


    ![](img/f978a379512d9fe18f046e71e9900d2e_175_0.png)


    +   - This goes to the evaluator...


    +   - ...which makes machine code or whatever.


    ```

    10001 00011

    ```


    Figure 7-1: Evaluation in a non-lisp programming language


    Clojure is different, because Clojure is a Lisp and Lisps are hotter than a stolen
    talent. Instead of evaluating an AST that''s represented as some inaccessible
    internal data structure, Lisps evaluate native data structures. Clojure still
    evaluates trees, but the trees are structured using Clojure lists and the nodes
    are Clojure values.


    Lists are ideal for constructing tree structures. The first element of a list
    is treated as the root, and each subsequent element is treated as a branch. To
    create a nested tree, you can just use nested lists, as shown in Figure 7-2.'
