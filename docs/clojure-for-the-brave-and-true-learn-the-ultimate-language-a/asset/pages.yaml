  md: "This exception is for your own good: syntax quoting is designed to prevent\
    \ you from accidentally capturing variables within macros. If you want to introduce\
    \ let bindings in your macro, you can use a gensym. The gensym produces unique\
    \ symbols on each successive call:\n\n```\n(gensym)\n=> G_655\n```\n\n```\n(gensym)\n\
    => G_658\n```\n\nYou can also pass a symbol prefix:\n\n```\n(gensym 'message)\n\
    => message4760\n```\n\n```\n(gensym 'message)\n=> message4763\n```\n\nHere's how\
    \ you could rewrite with-mischief to be less mischievous:\n\n```\n(defmacro without-mischief\n\
    [& stuff-to-do)\n[let [macro-message (gensym 'message)]\n [let \"macro-message\
    \ \"Oh, big deal!\"\n \"stuff-to-do\n(println \"I still need to say: \" \"macro-message\\\
    ))]\n```\n\n```\n(without-mischief)\n(println \"Here's how I feel about that you\
    \ did: \"message\")\n=> Here's how I feel about that you did: Good job!\n=> I\
    \ still need to say: Oh, big deal!\n```\n\nThis example avoids variable capture\
    \ by using gensym to create a new, unique symbol that gets bound to macro-message.\
    \ Within the syntax-quoted expression, macro-message is unresolved, resolved to\
    \ the gensym's symbol. This gensym is distinct from any symbols within stuff-to-do,\
    \ so avoid variable capture. Because this is a common pattern, you can use an\
    \ auto-gensym. Auto-gensym are more concise and convenient ways to use gensym:\n\
    \n```\n(blarg blarg#)\n(blarg_2869_auto__ blarg_2869_auto__)\n```\n\n```\n(let\
    \ [name \"Larry Potter\"] name#)\n=> (clojure/let [name_2872_auto__ \"Larry Potter\"\
    ] name_2872_auto__)\n```\n\nIn this example, you create an auto-gensym by appending\
    \ a hash mark (hashtag, if you must insist) to a symbol within a syntax-quoted\
    \ list. Clojure automatically ensures that each instance of # resolves to"
  merge: -1
