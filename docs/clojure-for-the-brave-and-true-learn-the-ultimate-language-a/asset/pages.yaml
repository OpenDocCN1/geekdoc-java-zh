  md: 'independent process waiting for the next event, whether it''s a keystroke,
    a timeout, or the arrival of data on a socket.


    Clojure.core.async allows you to create multiple independent processes within
    a single program. This chapter describes a useful model for thinking about this
    style of programming as well as the practical details you need to know to actually
    write code. You''ll learn how to use channels to communicate between independent
    processes created by blocks and thread; a bit about how Cloure manages threads
    efficiently with parking and blocking; and a more straightforward way of creating
    queues. Finally, you''ll learn how to kick callbacks in the butt with process
    pipelines.


    ![](img/f978a379512d9fe18f046e71e9900d2e_260_0.png)


    # Started With Processes


    At the heart of core.async is the process, a concurrently running unit of logic
    that responds to events. The process corresponds to our mental model of the real
    world: entities interact and respond to each other independently without some
    kind of central control mechanism pulling the strings. You put your money in the
    machine, and out comes a hot dog, all without the Illuminati or Big Brother orchestrating
    the whole thing. This differs from the view of concurrency you''ve been exposed
    so far, where defined tasks that are either mere extensions of the main thread
    of control (for example, achieving data parallelism with map) or tasks that have
    no interest in communicating with (like one-off tasks created with future).


    It might be strange to think of a vending machine as a process: vending machines
    are noisy and thingy, and processes are verbose and doy. To get in the right mindset,
    defining real-world objects as the sum of their event-driven behavior. When a
    seed gets watered, it sprouts; when a mother looks at her newborn child, she feels
    love; when you watch Star Wars Episode I, you are filled with anger and despair.
    If you want to get super philosophical, consider whether it''s possible to define
    every thing''s essence as the set of events it recognizes and how it responds.
    Reality is just the composition of hot dog vending machines?'
