    # Pure Functions: What and Why


    Except for println and rand, all the functions you''ve used till now have not
    been pure functions. What makes pure functions, and why does it matter? A function
    is pure if it meets two qualifications:


    +   - It returns the same result if given the same arguments. This is called referential
    transparency, and you can add it to your list of $5 programming terms.


    +   - It can''t cause any side effects. That is, the function can''t make any
    changes that are observable outside the function itself—for example, by changing
    an externally accessible mutable object or writing to a file.


    These qualities make it easier for you to reason about your programs because the
    functions are completely isolated, unable to impact other parts of your system.
    When you use them, you don''t have to ask yourself, "What could I break by calling
    this function?" They''re also consistent: you''ll never need to figure out why
    passing a function the same arguments results in different return values, because
    that will never happen.


    Pure functions are stable and free as arithmetic (when was the last time you fretted
    over adding two numbers?). They estup little bricks of functionality that you
    can confidently use as the foundation of your program. Let''s look at referential
    transparency and lack of side effects in more detail to see exactly what they
    are and how they''re helpfull.


    # Pure Functions Are Referentially Transparent


    To return the same result when called with the same argument, pure functions rely
    only on 1) their own arguments and 2) immutable values to determine their return
    value. Mathematical functions, for example, are referentially transparent:


    ```

    (+1 2)

    => 3

    ```


    If a function relies on an immutable value, it''s referentially transparent. The
    string ", Daniel-san" is immutable, so the following function is also referentially
    transparent:


    ```

    (def wisdom

    [words]

    (str words ", Daniel-san"))

    ```


    ```

    (wisdom "Always bathe on Fridays")

    => "Always bathe on Fridays, Daniel-san",

    ```'
