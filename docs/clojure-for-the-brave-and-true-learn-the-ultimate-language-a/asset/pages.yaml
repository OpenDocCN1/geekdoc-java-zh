  md: '![](img/f978a379512d9fe18f046e71e9900d2e_275_0.png)


    Compiler reads source code


    Compiler outputs machine instructions


    CPU executes instructions


    Figure 12-1: A high-level overview of how a C program is translated into machine
    code


    For a program to run on the JVM, it must get compiled to Java bytecode. Usually,
    when you compile programs, the resulting bytecode is saved in a .class file. Then
    you''ll package these files in Java archive files (JAR files). And just like a
    CPU doesn''t care which programming language you use to generate machine instructions,
    the JVM doesn''t care how you create bytecode. It doesn''t care if you use Scala,
    jRuby, Clojure, or even Java to create bytecode. Generally speaking, the process
    looks like that shown in Figure 12-2.


    +   1. The Java compiler reads source code.

    2. The compiler outputs bytecode, often to a JAR file.

    3. The JVM sends machine instructions to the CPU.


    When someone says that Clojure runs on the JVM, one of the things they mean is
    that Clojure gets compiled to Java bytecode and JVM processes execute them. From
    an operations perspective, this means you treat Clojure programs the same as Java
    programs. You compile them to JAR files and run them using the Java command. If
    a client needs a program that runs on the JVM, you could secretly write it in
    Clojure instead of Java and they would be none the wiser. From the outside, you
    can''t tell the difference between a Java and a Clojure program more than you
    can tell the difference between a C and a C++ program. Clojure allows you to be
    productive and sneaky.'
