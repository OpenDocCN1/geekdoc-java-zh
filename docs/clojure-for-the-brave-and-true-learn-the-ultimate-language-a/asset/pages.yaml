  md: '# Chapter 1: Building, Running, and the REPL


    There''s something powerful and motivating about getting a real program running.
    Once you can do that, you''re free to experiment, and you can actually share your
    work!


    In this short chapter, you''ll invest a small amount of time to become familiar
    with a quick way to build and run Clojure programs. You''ll learn how to experiment
    with code in a running Clojure process using a read-eval-print loop (REPL). This
    will tighten your feedback loop and help you learn more efficiently.


    # Chapter 2: How to Use Emacs, an Excellent Clojure Editor


    A quick feedback loop is crucial for learning. In this chapter, I cover Emacs
    from the ground up to guarantee you have an efficient Emacs/Clojure workflow.


    # Part II: Language Fundamentals


    These chapters give you a solid foundation on which to continue learning Clojure.
    You''ll start by learning Clojure''s basics (syntax, semantics, and data structures)
    so you can do things. Then you''ll take a step back to examine Clojure''s most
    used functions in detail and learn how to solve problems using them with the functional
    programming mindset.


    # Chapter 3: Do Things: A Clojure Crash Course


    This is where you''ll start to really dig into Clojure. It''s also where you''ll
    need to close your windows because you''ll be starting, "HOLY MOLEY THAT''S SPIFFY!"
    at the top of your lungs and won''t stop until you''ve hit this book''s index.


    You''ve undoubtedly heard of Clojure''s awesome concurrency support and other
    splendidous features, but Clojure''s most characteristic is that it is a Lisp.
    You''ll explore this Lisp core, which is composed of two parts: functions and
    data.


    # Chapter 4: Core Functions in Depth


    In this chapter, you''ll learn about a couple of Clojure''s underlying concepts.
    This will give you the grounding you need to read the documentation for functions
    you haven''t used before and to understand what''s happening when you time them.


    You''ll also use examples of the functions you''ll be reaching for the most. This
    will give you a solid foundation for writing your own code and for reading and
    learning from other people''s projects. And remember how I mentioned tracking
    glittering vampires? You''ll do that in this chapter (unless you already do it
    in your spare time).


    # Chapter 5: Functional Programming


    In this chapter, you''ll take your concrete experience with functions and data
    structures and integrate it with a new mindset: the functional programming mindset.
    You''ll show off your knowledge by constructing the hottest new game that''s sweeping
    the nation: Peg Thing!'
  merge: -1
