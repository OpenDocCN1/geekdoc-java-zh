  md: '# Simplicity


    You may have noticed that the treatment of data structures so far doesn''t include
    a description of how to create new types or classes. The reason is that Cloj''s
    emphasis on simplicity encourages you to reach for the built-in data structures
    first.


    If you come from an object-oriented background, you might think that this approach
    is weird and backward. However, what you will find is that data does not have
    to be tightly bundled with a class for it to be useful and intelligible. Here’s
    an epigram loved by Clojurists that hints at the Clojure philosophy:


    > It is better to have 100 functions operate on one data structure

    than 10 functions on 10 data structures.

    —Alan Perlis


    You’ll learn more about this aspect of Clojure’s philosophy in the coming chapters.
    For now, keep an eye out for the ways that you gain code reusability by sticking
    to basic data structures.


    This concludes our Clojure data structures primer. Now it’s time to dive in functions
    and learn how to use these data structures!


    # Functions


    One of the reasons people get nuts over Lisp is that these languages let you build
    programs that behave in complex ways, yet the primary building block—the function—is
    so simple. This section initiates you into the beauty and elegance of Lisp functions
    by explaining following:


    +   * Calling functions

    * How functions differ from macros and special forms

    * Defining functions

    * Anonymous functions

    * Returning functions


    # Calling Functions


    By now you’ve seen many examples of function calls:


    ```

    (+ 1 2 3 4)

    (* 1 2 3 4)

    (first [1 2 3 4])

    ```


    Remember that all Clojure operations have the same syntax: opening parenthesis,
    operator, operands, closing parenthesis. Function call is just another term for
    an operation where the operator is a function or a function expression (an expression
    that returns a function).'
