- img_proc: true
  md: "preceding example, that you wanted to return \"I don't like the number X\"\n\
    for arbitrary numbers but return a string-ified number for everything.\nHere's\
    \ how you could do that:\n\n```\n(def winey-str\n [rejects]\n  :pre {[set rejects]]\n\
    \ (fn [x]\n  (if rejects x)\n   (str \"I don't like \" x)\n   (str x))))\n```\n\
    \n```\n(def winey-strinc (comp (winey-str #{2}) inc)\n(winey-strinc 1)\n; => \"\
    I don't like 2\"\n```\n\nNow let's take it one step further. If you want to decide\
    \ whether\nnot call it in the first place? Listing B-1 shows how you could do\
    \ that:\n\n```\n(def winey-middleware\n [next-handler rejects]\n  :pre {[set rejects]]\n\
    \ (fn [x]\n  (if = x 1)\n   \"I'm not going to bother doing anything to\"\n  \
    \ (let y (next-handler x)\n    (if rejects y)\n     (str \"I don't like \" y)\n\
    \    (str y))))\n```\n\n```\n(def winey-strinc (winey-middleware inc #{2}))\n\
    (winey-strinc 1)\n; => \"I don't like 2\"\n```\n\nListing B-1: *The middleware\
    \ approach to function composition lets you introduce choice*\n\nHere, instead\
    \ of using comp to compose your pipeline, you pass\nt next function in the pipeline\
    \ as the first argument to the middle-\nfunction. In this case, you are passing\
    \ inc as the first argument to\nwiney-middleware as next-handler. winey-middleware\
    \ then returns an any-\nmous function that closes over inc and has the ability\
    \ to choose whether\ncall it or not. You can see this choice at I.\n\nWe say that\
    \ a middleware takes handler as its first argument and\nreturns a handler. In\
    \ this example, winey-middleware takes a handler as handler\nit its first argument,\
    \ and it returns another handler, the anonymous\nfunction with x as its only argument.\
    \ Middleware can also take extra\narguments, like rejects, that act as configuration.\
    \ The result is that the\nhler returned by the middleware can behave more flexibly\
    \ (thanks\nto configuration), and it has more control over the function pipeline\n\
    (because it can choose whether or not to call the next handler).\n\n286 Appendix\
    \ B"
