  md: 'Take the map function (not to be confused with the map data structure), for
    instance, map creates a new list by applying a function to each member of a collection.
    Here, the inc function increments a number by 1:


    ```

    (inc 1.1)

    ; => 2.1

    ```


    ```

    (map [0 1 2 3])

    ; => (1 2 3)

    ```


    (Note that map doesn''t return a vector, even though we supplied a vector as an
    argument. You''ll learn why in Chapter 4. For now, just trust that this is okay
    and expected.)


    Clojure''s support for first-class functions allows you to build more powerful
    abstractions than you can in languages without them. Those unfamiliar with this
    kind of programming think of functions as generalize operations over data instances.
    For example, the + function abstracts addition over any specific numbers.


    By contrast, Clojure (and all Lisps) allows you to create functions that generalize
    over processes. map allows you to generalize the process of transforming a collection
    by applying a function—any function—over any collection.


    The last detail that you need know about function calls is that Clojure evaluates
    all arguments recursively before passing them to the function. Here is how Clojure
    would evaluate a function call whose arguments are also calls:


    ```

    (+ inc 199) (/ 100 (- 7 2)))

    (+ 200 (/ 100 (- 7 2))); ; evaluated "(inc 199)"

    (+ 200 (/ 100 5)); evaluated (- 7 2)

    (+ 200 20); evaluated (/ 100 5)

    ```


    The function calls off the evaluation process, and all subforms evaluated before
    applying the + function.


    # Function Calls, Macro Calls, and Special Forms


    In the previous section, you learned that function calls are expressions that
    have a function expression as the operator. The other kinds of expressions are
    macro calls and special forms. You''ve already seen a couple of special forms:
    definitions and if expressions.


    You''ll learn everything there is to know about macro calls and special forms
    in Chapter 7. For now, the main feature that makes special forms "special" is
    that, unlike function calls, they don''t always evaluate all of their operands.'
