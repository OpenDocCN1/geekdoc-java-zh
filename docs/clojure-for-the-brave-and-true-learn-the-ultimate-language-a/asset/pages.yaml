    # Queues


    In "Rolling Your Own Queue" on page 202, you wrote a macro that let you

    queue futures. Processes let use a similar technique in a more straight-

    forward manner. Let''s say you want to get a bunch of random quotes from a

    website and write them to a single file. You want to make sure that only one

    quote is written to a file at a time so the text doesn''t get interleaved, so
    you

    put your quotes on a queue. Here''s the full code:


    ```

    (def append-to-file

    "Write a string to the end of a file"

    [filename]

    (spit filename :append true))

    ```


    ```

    (def format-quote

    "Delineate the beginning and end of a quote because it''s convenient"

    [quote]

    (str "=== BEGIN QUOTE ====\n" quote "=== END QUOTE ====\n"))

    ```


    ```

    (def random-quote

    "Retrieve a random quote and format it"

    [quote]

    (format-quote (slurp "http://www.braveclojure.com/random-quote\)))

    ```


    ```

    (def snag-quotes

    [filename num-quotes]

    [let c (chan)]

    (go while true (append-to-file filename (! c c)))

    (dotimes [num-quotes] (go (> c (random-quote)))))

    ```


    The functions append-to-file, format-quote, and random-quote have doc-

    strings that explain what they do. snag-quotes is what that''s shared between
    the quote-

    processes works. First, it creates a channel that is shared between the quote-\producing
    processes and the consuming process. Then it creates

    a process that uses while true to create an infinite loop. On every iter-

    of the loop, it waits for a quote to arrive on c and appends it to

    a file. Finally, snag-quotes creates a num-quotes number of processes that

    fetch a quote and puts it on c. If you evaluate (snag-quotes "quotes") 2

    and check the quotes file in the directory where you started your REPL,

    have two quotes:


    ```

    === BEGIN QUOTE ====

    Nobody''s gonna believe that computers are intelligent until you start

    coming in late and lying about it.

    === END QUOTE ===

    ```'
