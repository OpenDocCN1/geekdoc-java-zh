    # Maps


    Maps are similar to dictionaries or hashes in other languages. They''re a way
    of associating some value with some other value. The two kinds of maps in Clojure
    are hash maps and sorted maps. Let''s look at some examples of map literals. Here''s
    an empty map:


    ```

    {}

    ```


    In this example, :first-name and :last-name are keywords (I''ll cover those in
    the next section):


    ```

    {:first-name "Charlie"

    :last-name "McFishwich"

    ```


    We associate "string-key" with the + function:


    ```

    {"string-key" +}

    ```


    Maps can be nested:


    ```

    {:name {:first "John" :middle "Jacob" :last "Jingleheimerschmidt"}}

    ```


    Notice that map values can be of any type—strings, numbers, vectors, even functions.

    Besides using map literals, you can use the hash-map function to create a map:


    ```

    (hash-map :a 1 :b 2)

    ;=> {:a 1 :b 2}

    ```


    You can look up values in maps with the get function:


    ```

    (get {:a 0 :b 1} :b)

    ;=> 1

    ```


    ```

    (get {:a 0 :b {:c "hum"}} :b)

    ;=> {:c "hum"}

    ```'
