    # # Programming to Abstractions


    To understand programming to abstractions, let''s compare Clojure to a language
    that wasn''t built with that principle in mind: Emacs Lisp (elisp). In elisp,
    you can use the marcar function to develop a new list, which is similar to how
    you use map in Clojure. If you want to map over a hash map (similar to Clojure''s
    map data structure) in elisp, you''ll need to use the maphash function, whereas
    in Clojure you can still just use map. In other words, elisp uses two different,
    structure-specific functions to implement the map operation, but Clojure uses
    only one. You can also call reduce on a map in Clojure, whereas elisp does not
    provide a function for reducing a hash map.


    The reason is that Clojure defines map and reduce in terms of the sequence abstraction,
    not in terms of specific data structures. As long as a data structure responds
    to the core operations (the functions first, rest, and and, which we''ll look
    at more closely in a moment), it will work with map, reduce, and onwards of other
    sequence functions for free. This is what Clojure means by programming to abstractions,
    and it''s the central tenant of Clojure philosophy.


    I think of abstractions as named collections of operations. If you can perform
    all of an abstraction''s operations on an object, that object is an instance of
    the abstraction. I think this way even outside of programming. For example, the
    battery abstraction includes the operation "connect a conducting medium to its
    anode and cathode," and the operation''s output is electrical current. It doesn''t
    matter if the battery is made of lithium or out of potatoes. It''s a battery as
    long as it responds to the set of operations that define battery.'
