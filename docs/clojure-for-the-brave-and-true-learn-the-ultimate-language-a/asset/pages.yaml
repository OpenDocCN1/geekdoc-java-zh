  md: "# Tasks Middleware Factories\n\nBoot takes this pattern of making function\
    \ composition more flexible one step further by separating middleware configuration\
    \ from handler creation. First, you create a function that takes n configuration\
    \ arguments. This is the middleware factory, and it returns a middleware function.\
    \ The middleware function expects one argument, the next handler, and it returns\
    \ a handler, just like in the preceding example. Here's a whiny factory:\n\n```\n\
    (def whiney-middleware-factory\n  [rejects]\n  {:pre [(set rejects)]\n  (fn handler\n\
    \    (fn x\n      (if = x 1\n        \"I'm not going to bother doing anything\
    \ to that\"\n        (let y (handler x)\n          (if rejects\n            (str\
    \ \"I don't like \" y :\"('\n              (str y))))))\n\n(def whiney-strinc\
    \ ((whiney-middleware-factory #{3}) inc))\n```\n\nAs you can see, this code is\
    \ nearly identical to Listing B-1. The change is that the topmost function, whiney-middleware-factory,\
    \ now only accepts one argument. It returns an anonymous function, the middleware,\
    \ which expects one argument, a handler. The rest of the code is the same.\n\n\
    In Boot, tasks can act as middleware factories. To show this, let's split the\
    \ task into two tasks: what and fire (see Listing B-2). what lets you specify\
    \ an object and whether it's plural, and fire announces that it's on. This is\
    \ great modular software engineering because it allows you to add tasks, like\
    \ gnomes, to announce that a thing is being overrun with gnomes, which is just\
    \ objectively useful. As an exercise, creating the gnome task It should compose\
    \ with the what task, just as fire does.\n\n```\n(deft what\n  \"Specify a thing\"\
    \n  [t thing str \"An object\"\n   p pluralize bool \"Whether to pluralize\"\n\
    \  (fn middleware [next-handler]\n    (fn handler [fileset]\n      (next-handler\
    \ (merge fileset {:thing thing :pluralize pluralize}))))))\n\n(deft fire\n  \"\
    Announcement a thing is on fire\"\n  (fn middleware [next-handler]\n    (fn handler\
    \ [fileset]\n      (let verb (if (:pluralize fileset) \"are\" \"is\"))\n```"
  merge: -1
