- img_proc: true
  md: 'Source: (source function-name-here)

    (user/sourcery function-name-here)

    Javadoc: (javadoc java-object-or-class-here)

    Examples from clojuredocs.org: [clojuredocs or cdoc]

    (user/clojuredocs name-here)

    (user/clojuredocs "ns-name-here")

    ojure-noob.core=>


    The last line, clojure-noob.core=>, tells you that you''re in the clojure

    -noob namespace. You''ll learn about namespaces later, but for now notice the
    namespace basically matches the name of your src/

    clojure_noob/(core.clj) file. Also, notice that the REPL shows the version

    as Cloure 1.7.0, but as mentioned earlier, everything will work no

    matter which version you use.


    The prompt also indicates that your code is loaded in the REPL, and you execute
    the functions that are defined. Right now only one function,-main is defined.
    Go ahead and execute it now:


    ```

    clojure-noob.core=> (-main)

    I''m a little teapot!

    nil

    ```


    Well done! You just used the REPL to evaluate a function call. Try a more basic
    Cloojure functions:


    ```

    clojure-noob.core=> (* 1 2 3 4)

    10

    clojure-noob.core=> (* 1 2 3 4)

    24

    clojure-noob.core=> (first [1 2 3 4])

    1

    ```


    > Awesome! You added some numbers, multiplied some numbers, and took the first
    element from a vector. You also had your first encounter with weird Lisp syntax!
    All Lisps, Clojure included, employ prefix notation, meaning that the operator
    always comes first in an expression. If you''re unsure what that means, don''t
    worry. You''ll learn all about Clojure''s syntax soon.


    > Conceptually, the REPL is similar to Secure Shell (SSH). In the same way that
    you use SSH to interact with a remote server, the Clojure REPL allows you to interact
    with a running Cloojure process. This feature can be very powerful you can even
    modify your program as it runs. For now, though, you''ll be using the REPL to
    build your knowledge of Cloojure syntax and semantics.


    One more note: going forward, this book will present code without REPL prompts,
    but please do to code! Here''s an example:


    ```

    (println "no prompt here!")

    (+ 1 3)

    ```'
