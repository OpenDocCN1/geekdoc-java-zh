  md: '# Clojure will throw an exception if you try to make it evaluate this:


    (eval (read-string "(1 + 1))");=> ClassCastException java.lang.Long cannot be
    cast to clojure.lang.Ifn


    However, read-string returns a list, and you can use Clojure to reorganize that
    [infix] into something it can successfully evaluate:


    ```

    (let [infix (read-string "(1 + 1)")]

    (list (second infix) (first infix) (last infix))

    => (+ 1 1)

    ```


    If you evaluate this, it returns 2, just as you''d expect:


    ```

    (eval

    (let [infix (read-string "(1 + 1)")]

    (list (second infix) (last infix)))

    => 2

    ```


    This is cool, but it''s also quite chunky. That''s where macros come in. Macros
    are a convenient way to manipulate lists before Clojure evaluates them. Macros
    are like lot functions: they take arguments and return a value, just like a function
    would. They work on Clojure data structures, like functions do. What makes them
    unique and powerful is the way they fit into the evaluation process. They are
    executed between the reader and the evaluator—so they can manipulate the data
    structures that the reader spits out and transform with those data structures
    before passing them to the evaluator.


    Let''s look at an example:


    ```

    (defmacro ignore-operand

    [function-call]

    (butlast function-call))

    ```


    ```

    (ignore-operand (+ 1 2 10))

    => 3


    ;; This will not print anything

    (ignore-operand (+ 1 2 (println "look at me !!!")))

    => 3

    ```


    The macro ignore-operand receives the list (+ 1 2 10) as its argument, not the
    value 13. This is very different from a function call, because function calls
    evaluate all of the arguments passed in, so there is no possible way for a function
    to reach into one of its operands and alter or ignore it. By contrast, when you
    call a macro, the arguments are not evaluated. In particular, symbols are not
    resolved; they are passed as symbols. Lists are not evaluated either; that is,
    first element in the list is not called as a function, special form, or macro.
    Rather, the unevaluated data structure is passed in.'
