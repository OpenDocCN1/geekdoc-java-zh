    Buffers are just elaborations of the core model: processes are independent, concurrently
    executing units of logic that respond to events. You can create processes with
    go blocks and communicate events over channels.


    # Blocking and Parking


    You may have noticed that the take function < used only one exclamation, whereas
    the put ! used two. In fact, both and take have one-exclamation-point and two-exclamation-point
    varieties. When do you use which? The simple answer is that you can use one exclamation
    inside go blocks, but you have to use two exclamation points outside of them:


    | Inside go block | Outside go block |

    |---|---|

    | put | ! or || | !! |

    | take | < or || | << |


    It comes down to efficiency. Because go blocks use a thread pool with a fixed
    size, you can create 1,000 processes but use only a handful of threads:


    ```

    def hi-chan (chan)

    doseq [n (range 1000)]

    (go !! hi-chan "hi " n)))

    ```


    To understand How Closure accomplishes this, we need to explore how processes
    wait. Waiting is a key aspect of working with core.async processes; we''ve already
    established that put waits until another process does a take on the same channel,
    and vice versa. In this example, 1,000 processes are waiting for another process
    to take from hi-chan.


    There are two varieties of waiting: parking and blocking. Blocking is the kind
    of waiting you are familiar with: a thread stops execution until a task is complete.
    Usually this happens when you''re doing some kind of I/O operation. The thread
    remains alive but doesn''t do any work, so you have to create a new thread if
    you want your program to continue working. In Chapter 9, you learned how to do
    this for future.'
