  md: "```\n(code-critic (1 + 1) (+ 1 1))\n; => Sweet lion of Zion, this is bad code:\
    \ (1 + 1)\n; => Great cow of Moscow, this is good code: (+ 1 1)\n```\n\nWoohoo!\
    \ You've successfully extracted repetitive code into a function and made your\
    \ macro code cleaner. Sweet guinea pig of Winnipeg, this is good code!\n\n# Things\
    \ to Watch Out For\n\nMacros have a couple of sneaky gotchas that you should be\
    \ aware of. In this section, you'll learn about some macro pitfalls and how to\
    \ avoid them. I hope you've never unstrapped yourself from your thinking mast.\n\
    \n# Variable Capture\n\nVariable capture occurs when a macro introduces a binding\
    \ that, unknown to the macro's user, eclipses an existing binding. For example,\
    \ in the following code, a macro mischievously introduces its own let binding,\
    \ and that messes with the code:\n\n```\n(def message \"Good job!\"\ndefmacro\
    \ with-mischief\n[& stuff-to-do]\n  (concat 'let ['message \"Oh, big deal!\"]\n\
    \    stuff-to-do))\n```\n\n```\n(with-mischief\n(println \"Here's how I feel about\
    \ that thing you did: \" message))\n; => Here's how I feel about that thing you\
    \ did: Oh, big deal!\n```\n\nThe println call references the symbol message, which\
    \ we think is bound to the string \"good job\". However, the new-mischief macro\
    \ has created a new binding for message. Notice that this macro did not use syntax\
    \ quoting. Doing so would result in an exception:\n\n```\n(def message \"Good\
    \ job\"\ndefmacro with-mischief\n[& stuff-to-do]\n`(let [message \"Oh, big deal!\"\
    ] @stuff-to-do))\n```\n\n```\n(with-mischief\n(println \"Here's how I feel about\
    \ that thing you did: \" message))\n; Exception: Can't let qualified name: user/message\n\
    ```"
