    # The Collection Abstraction


    The collection abstraction is closely related to the sequence abstraction. All
    of Clojure''s core data structures—vectors, maps, lists, and sets—take part in
    both abstractions.

    The sequence abstraction is about operating on individuals, whereas the collection
    abstraction is about the data structure as a whole. For example, the collection
    functions count, empty?, and every? aren''t about any individual; they are about
    the:


    ```

    (empty? [])

    ; true

    ```


    ```

    (empty? ["no!"])

    ; false

    ```


    Practically speaking, you''ll rarely consciously say, "Okay, self! You''re working
    with the collection as a whole now. In terms of the collection abstraction! Nevertheless,
    it''s useful to know these concepts that underlie the functions and data structures
    you''re using.

    We''ll examine two common collection functions—into and conj—whose similarities
    can be a bit confusing.


    into

    One of the most important collection functions is into. As you know now, many
    seq functions return a seq rather than the original data structure. You''ll probably
    want to convert the return value back into the original value, and let into you
    do that:


    ```

    (map identity {:sunlight-reaction "Glitter"})

    ; => ({[:sunlight-reaction "Glitter"})

    ```


    ```

    (into {} map identity {:sunlight-reaction "Glitter"})

    ; => {:sunlight-reaction "Glitter"}

    ```'
