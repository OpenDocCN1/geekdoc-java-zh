- img_proc: true
  md: 'However, with you don''t want each operand to be evaluated. You only want certain
    operands to be evaluated, depending on whether the condition is true or false.


    Another important special form is quote. You''ve seen lists represented like this:


    (a b c)


    As you saw in “The Reader” on page 153, this invokes a reader macro so that we
    end up with this:


    (quote (a b c))


    Normally, Clojure would try to resolve the symbol and then call it because it''s
    the first element in a list. The quote special form evaluates, “Instead of evaluating
    my next data structure like normal, just return the data structure itself.” In
    this case, you end up with a list consisting of the symbols a, b, and c.


    def, loop, fn, do, and recur are all special forms as well. You can see why: they
    don''t get evaluated the same way as functions. For example, when the evaluator
    evaluates a symbol, it returns that symbol, but def and let only behave that way.
    Instead of resolving symbols, they actually create associations between symbols
    and values. So the evaluator receives a combination of data structures from the
    reader, and it goes over resolving symbols and calling the functions or special
    forms at the beginning of each list. But there''s more! You can also place a macro
    at the beginning of a list instead of a quote or a special form, and this can
    give you tremendous power over how the rest of the data structures are evaluated.


    # Macros


    Hmm . Clojure evaluates data structures—the same data structures that we write
    and manipulate in our Clojure programs. It wouldn''t be awesome if we used Clojure
    to manipulate the data structures that Clojure evaluates? Yes, it would! And guess
    what? Can you do with macros? Mine did!


    To get an idea of what macros do, let''s look at some code. So we want to write
    a function that Clojure read infix notation (such as 1 + 1) instead of its normal
    notation with the operator first (+ 1). This example is not a macro. Rather, it
    merely shows that you can write code using infix notation and then use Clojure
    to transform it so it will actually execute. First, create a list that represents
    infix addition:


    ```

    (read-string "(1 + 1)")n=> (1 + 1)

    ```'
