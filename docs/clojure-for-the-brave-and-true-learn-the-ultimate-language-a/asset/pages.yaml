    # Clojure App Jars


    Now you know how Java runs JARS, but how does Clojure apps bundled as Jars? After
    all, Clojure applications do not classes, do they?


    As turns out, you can make the Clojure compiler generate a class for a namespace
    by putting the (:gen-class) directive in the namespace declaration. You can see
    this in the very first Clojure program you created, clojure-noob in Chapter 1.
    Remember that program, teapot? This means the compiler compiles bytecode necessary
    for the JVM to treat your program as if it were a Java class.


    You set the namespace of the entry point for your program in the project.clj,
    using the :main attribute. For clojure-noob, you should set :main ":skip-out clojure-noob.
    When Leining compiles this file, it will add a meta-inf/manifest.mf file that
    contains the entry point to the resulting JAR file.


    So, if you define a -main in a namespace and include the (:gen-class) directive,
    and also set :main in your project.clj, your program will have everything it needs
    for Java to run it when it gets compiled as a JAR. You can do this in your terminal
    by navigating to your clojure-noob directory and running this:


    ```

    lein uberjar

    java -jar target/uberjar/clojure-noob-0.1.0-SNAPSHOT-standalone.jar

    ```


    You should see two messages printed out: "Cleanliness is next to godliness" and
    "I''m a little teapot!" Note that not needing to run the JAR file; you can send
    it to friends and neighbors and they can run it as long as they have Java installed.


    # Java Interop


    One of Rich Hickey''s design goals for Clojure was to create a practical language.
    For that reason, Clojure was designed to make it easy for you to interact with
    Java classes and objects, meaning you can use Java''s extensive native functionality
    and its enormous ecosystem. The ability to use Java classes, objects, and methods
    is called Java interop. In this section, you will learn how to use Clojure''s
    interop syntax, to import Java packages, and how to use the most frequently used
    Java classes.'
