  md: "# Macros All The Way Down\n\nOne subtle pitfall of using macros is that you\
    \ can end up having to write more and more of them to get anything done. This\
    \ is a consequence of the fact that macro expansion happens before evaluation.\
    \ For example, let's say you wanted to dose the report macro. Instead of multiple\
    \ calls to report:\n\n```\n(report (= 1))\n; => (= 1) was successful: true\n```\n\
    \n```\n(report (= 1 2))\n; => (= 1 2) was not successful: false\n```\n\nlet's\
    \ iterate:\n\n```\n(doseq [code ('= 1 1) ('= 1 2)]\n(report code))\n; => code\
    \ was successful: (=1 1)\n; => code was successful: (=1 2)\n```\n\nThe report\
    \ macro works fine when we pass it functions individually, but when we use doseq\
    \ to iterate report over multiple functions, it's a worthless failure. Here's\
    \ what a macro expansion for one of the doseq iterations looks like:\n\n```\n\
    if\ncode\n(clojure.core/println 'code \"was successful:\" code)\n(clojure.core/println\
    \ 'code \"was not successful:\" code)\n```\n\nAs you can see, report receives\
    \ the unvaluated symbol code in each iteration; however, we want to receive whatever\
    \ code is bound to evaluation time. But report, operating at macro expansion time,\
    \ can't just access those values. It's like it has T. rex arms, with runtime values\
    \ forever out of its reach.\n\nTo resolve this situation, we might write another\
    \ macro, like this:\n\n```\n(defmacro doseq-macro\n[macroname & args]\n(do\n \
    \ @(map (fn [arg] (list macroname args)) args))\n```\n\n```\n(doseq-macro report\
    \ (= 1 1))\n; => (= 1 1) was successful: true\n; => (= 1 2) was not successful:\
    \ false\n```"
