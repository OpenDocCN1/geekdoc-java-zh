- img_proc: true
  md: 'Like futures, a delay is run only once and its result is cached. Subsequent
    dereferencing will return the Jackson S message without printing anything:


    @jackson-s-delay

    ; => "Just call my name and I''ll be there


    One way you can use a delay is to fire off a statement the first time out of a
    group of related futures finishes. For example, pretend your app uploads a few
    headshots to a headshot-sharing service and notifies the owner as soon as the
    first one is up, as in the following:


    ```

    (def gimli-headshots "serious.jpg" "fun.jpg" "playful.jpg")

    (def email-user

    [email-address]

    (println Sending headshot notification to email-address))

    (def upload-document

    "Needs to be implemented"

    [headshot]

    true)

    (let notify (delay (email-user "and-my-axe@gmail.com"))

    (doseq headshot gimli-headshots)

    (future (upload-document headshot)

    (force notify))))

    ```


    In this example, you define a vector of headshots to upload (gimli-headshots)
    and two functions (email-user and upload-document) to pretend-perform the out
    of the delay, then use it to bind notify to a delay. The body of the delay, (email-user
    "and-my-axe@gmail.com") isn''t evaluated one of the futures when the delay is
    created. Instead, it evaluates the first time one of the futures created by the
    doseq form (force notify). Even though (force notify) will be evaluated three
    times, the delay body is evaluated only once. Gimli will be grateful to know the
    headshot is available so he can begin tweaking and sharing it. He''ll also appreciate
    not being spammed, and you''ll appreciate not facing his dwarven wrath.


    This technique can help you from the mutual exclusion Concurrency Goblin—the problem
    of making sure that only one thread can access a resource at a time. In this example,
    the delay guards the email server resource. Because the body of a delay is guaranteed
    to fire only once, you can be sure that you will never run into a situation where
    two threads send the same email. Of course, no thread will be able to use the
    delay to send an email again. That might be too drastic a constraint for most
    situations, but in cases like this example, it works perfectly.'
