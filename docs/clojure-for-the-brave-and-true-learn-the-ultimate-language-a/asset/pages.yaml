  md: "The syntax quote abstracts the general form of the let/validate/if pattern\
    \ you saw earlier. Then we use unquote splicing to unclip the if branches, which\
    \ were packed into the then-else result.\nThat's pretty simple! After all this\
    \ talk about macros and going through their mechanics in such detail, I bet you\
    \ were expecting something complicated. Sorry, friend. If you're having a hard\
    \ time coping with your disappointment, I know of a certain drink that will.\n\
    \n# Summary\n\nIn this chapter, you learned how to write your macros. Macros are\
    \ defined very similarly to functions: they have arguments, a doctring, and a\
    \ body. You can use argument destructuring and rest args, and they can be recursive.\
    \ Your macros will always return lists. You'll sometimes use and seq functions\
    \ for simple macros, but most of the time you'll use the syntax quote, which you\
    \ write macros using a safe template.\nWhen you're writing macros, it's important\
    \ to keep in mind the distinction between symbols and values; macros are expanded\
    \ before code evaluation and don't have access to the results of evaluation. Double\
    \ evaluation and variable capture are other subtle traps for the unwary, but you\
