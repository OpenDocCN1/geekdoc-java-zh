  md: '# Interop Syntax


    Using Clojure''s interop syntax, interacting with Java objects and classes is
    straightforward. Let''s start with object interop syntax.


    You can call methods on an object (.methodName object). For example, all Clojure
    strings are implemented as Java strings, you can call Clojure methods on them:


    ```

    (.toUpperCase "By Blueboard''s bananas!")

    ;= "BY BLUEBOARD''S BANANAS!"

    ```


    ```

    (.indexof "Let synergize your bleeding edges"

    ;= 7

    ```


    These are equivalent to this Java:


    ```

    "By Blueboard''s bananas!".toUpperCase()

    "Let synergize your bleeding edges".indexOf("y")

    ```


    Notice that Clojure''s syntax allows you to pass arguments to Java methods. In
    example, at that you passed the argument "y" to the indexof method.


    You can also call static methods on classes and access fields. Observe!


    ```

    (java.lang.Math/abs -3)

    ;= 3

    ```


    ```

    (java.lang.Math/PI)

    ;= 3.141592653589793

    ```


    You called the static method on the java.lang.Math class, and at you accessed
    that class''s PI field.


    All of these examples (except java.lang.Math/PI) use macros to expand the dot
    special form. In general, you won''t need to use the dot special form unless you
    want to write your macros to interact with Java objects and classes. Nevertheless,
    here is each example followed by its macroexpansion:


    ```

    (macroexpand-1 (.toUpperCase "By Blueboard''s bananas!"))

    ;= ("By Blueboard''s bananas! toUpperCase)

    ```


    ```

    (macroexpand-1 (.indexof "Let synergize your bleeding edges")

    ;= ("Let synergize your bleeding edges" indexOf("y"))

    ```


    ```

    (macroexpand-1 (/Math -3))

    ;= (. Math -3)

    ```


    This is the general form of the object operator:


    ```

    (object-expr-or-classname-symbol method-or-member-symbol optional-args*)

    ```'
