    \ = cuddle_hunger_level\n  self.percent_deteriorated = percent_deteriorated\n\
    end\n```\n\n```\nfred = CuddleZombie.new(2, 3)\nfred.cuddle_hunger_level # =>\
    \ 2\nfred.percent_deteriorated # => 3\n```\n\n```\nfred.cuddle_hunger_level =\
