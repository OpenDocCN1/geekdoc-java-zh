  md: '# Lists


    If the data structure is an empty list, it evaluates to an empty list:


    ```

    (eval (read-string "()"))

    ; => ()

    ```


    Otherwise, it is evaluated as a call to the first element in the list. The way
    the call is performed depends on the nature of that first element.


    # Function Calls


    When performing a function call, each operand is fully evaluated and then passed
    to the function as an argument. In this example, the + symbol resolves to a function:


    ```

    (+ 1 2)

    ; => 3

    ```


    Clojure sees that the list''s head is a function, so it proceeds to evaluate the
    rest of the elements in the list. The operands 1 and 2 evaluate to themselves,
    and after they''re evaluated, Clojure applies the addition function to them.

    You can also nest function calls:


    ```

    (+ 1 (+ 2 3))

    ; => 6

    ```


    Even though the second argument is a list, Clojure follows the same process here:
    look up + symbol and evaluate each argument. To evaluate the list (+ 2 3), Clojure
    resolves the first member to the addition function and proceeds to evaluate each
    of the arguments. In this way, evaluation is recursive.


    # Special Forms


    You also call special forms. In general, special forms are special because they
    implement core behavior that can''t be implemented with functions. For example:


    ```

    (if true 1 2)

    ; => 1

    ```


    Here, we ask Clojure to evaluate a list beginning with the symbol if. That symbol
    resolves to the if special form, and Clojure calls that special form with the
    operands true, 1, and 2.

    Special forms don''t follow the same evaluation rules as normal functions. For
    example, when you call a function, each operand is evaluated.'
