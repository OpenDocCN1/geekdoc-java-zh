    There are a couple of details to note here: when you alter a ref, the change is
    not immediately visible outside of the current transaction. This is what lets
    you alter the dryer within a transaction without worrying whether the dryer will
    be read in an inconsistent state. Similarly, if you alter a ref and then define
    it within the same transaction, the defer will return the new state.


    Here''s an example to demonstrate this idea of in-transaction state:


    ```

    (def counter (ref 0))

    (future

    (dosync

    (alter counter inc)

    (println @counter)

    (Thread/sleep 500)

    (alter counter inc)

    (println @counter))

    (Thread/sleep 250)

    (println @counter))

    ```


    This prints 1, 0 , and 2, in that order. First, you create a ref, counter, which
    holds the number 0. Then you use future to create a new thread to run a transaction.
    On the transaction, you increment the counter and print it, and the number 1 gets
    printed. Meanwhile, the main thread waits 250milliseconds and prints counter''s
    value, value of counter on the main thread is still 0—the main thread is outside
    of the transaction and doesn''t have access to the transaction''s state. It is
    like the transaction has its own private area for trying out changes to the state,
    and the rest of the world can''t know about them until the transaction'
