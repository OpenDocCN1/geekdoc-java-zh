    # Key Bindings and Modes


    You''ve already come a long way! You can now use Emacs like a very basic editor.
    This should help you get by if you ever need to use Emacs on a server or are forced
    to pairing with an Emacs nerd.


    However, to be productive, it''ll be useful for you to know details about key
    bindings (ha-ha!). Then I''ll introduce Emacs modes. After that, I''ll cover some
    terminology and go over a bunch of useful key bindings.


    # Emacs is a Lisp Interpreter


    The key binding derives from the fact that Emacs binds keystrokes to commands,
    which are just el functions (I''ll use command and function changeably). For example,
    C-x b is bound to the switch-to-buffer. Likewise, C-x s is bound to save-file.


    But Emacs goes even further than that! Even keystrokes like f and a are bound
    to a function, in this case self-insert-command, the command for adding characters
    to the buffer you''re editing.


    From Emacs''s point of view, all functions are created equal, and you can redefine
    all functions, even core functions like save-file. You probably won''t want to
    redefine core functions, but you can.


    You can redefine functions because, at its core, Emacs is just a Lisp interpreter
    that has to load code-editing facilities. Most of Emacs is written in elisp, so
    from the perspective of Emacs, save-file is just a function, as switch-to-buffer
    and almost any other command you can run. Not only that, but any functions you
    create are treated the same as built-in functions. You can use Emacs to execute
    lisp, modifying Emacs as it runs.


    The freedom to modify Emacs using a powerful programming language is what makes
    Emacs so flexible and why people like me are so crazy about it. It has a lot of
    surface-complexity that can take time to learn. Underlying Emacs is the elegant
    simplicity of Lisp and the infinite tinkerability that comes with it. This tinkerability
    is limited to creating and redefining functions. You can also create, redefine,
    and remove key bindings. Conceptually, key bindings are just an entry in a lookup
    table associating key-strokes with functions, and that lookup table is completely
    modifiable.


    You can also run commands by name, without a specific key binding, using M-x function-name
    (for example, M-x save-buffer). M stands for meta, a key that modern keyboards
    doesn''t possess but which is mapped to ALT on Windows and Linux and Macs. M-x
    runs the sbex command, which prompts you for the name of another command to run.


    Now that you understand key bindings and functions, you''ll be able to understand
    what modes are and how they work.'
