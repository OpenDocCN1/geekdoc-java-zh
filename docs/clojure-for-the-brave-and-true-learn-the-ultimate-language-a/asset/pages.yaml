  md: "The name of the namespace is the-divine-cheese-core.code. In Clojure, there's\
    \ a one-to-one mapping between a namespace name and the path of the file where\
    \ the namespace is declared, according to the following conventions:\n\n+   -\
    \ When you create a directory with lein (as you did here), the source code's root\
    \ is `src` by default.\n\n+   - Dashes in namespace names correspond to underscores\
    \ in the filesystem. So the-divine-cheese-code is mapped to `the_divine_cheese_code`\
    \ on the filesystem.\n\n+   - The component preceding a period (.) in a namespace\
    \ corresponds to a directory. For example, since the-divine-cheese-core.code corresponds\
    \ to the namespace name, `the_divine_cheese_code` is a directory.\n\n+   - The\
    \ final component of a namespace corresponds to a file with the `.clj` extension;\
    \ code is mapped to `core.clj`.\n\nYour project will have one namespace, the-divine-cheese-code.visualization.svg.\
    \ Go ahead and create the file for it:\n\n```\nmkdir src/the_divine_cheese_code/visualization\n\
    touch src/the_divine_cheese_code/visualization/svg.clj\n```\n\nNotice that the\
    \ filesystem path follows these conventions. The relationship between namespaces\
    \ and the filesystem down, let's look at require and use.\n\n# Requiring and Using\
    \ Namespaces\n\nThe code in the-divine-cheese-core.visualization will use the\
    \ functions in the namespace the-divine-cheese-core.visualization.svg to create\
    \ SVG map. To use svg/functions, you will have to `require` it. But, let's add\
    \ some code to `svg.clj`. Make it look like this (you'll add more later):\n\n\
    ```\n(ns ns-divine-cheese-core.visualization.svg)\n```\n\n```\n(def latlng->point\n\
    \  \"Convert lat/lng map to comma-separated string\\n\"\n  [latlng]\n  (str (:lng\
    \ latlng) \" \" (:lat latlng)))\n```\n\n```\n(def points\n  [locations]\n  (clojure.string/join\
    \ \" \" (map latlng locations)))\n```\n\nThis defines two functions, latlng->point,\
    \ which you'll use to convert a string of latitude/longitude coordinates into\
    \ a string of. To use this code from the `core.clj` file, you have to require.\
    \ it takes a symbol denoting the namespace and ensures that the namespace exists\
    \ and is ready to be used; in this case, when you call `(require 'the-divine-cheese-code.visualization.svg),`,\
