    First, there''s defprotocol ① This takes a name, Psychodynamics ② and an optional
    docstring,"Plumb the inner depths of your data types ③. Next are the method signatures.
    A method signature consists of a name, an argument specification, and an optional
    docstring. The first method signature is named thoughts ④ and can take only one
    argument. The second is named feelings-about ⑤ and can take one or two arguments.
    Protocols do no limitation: the methods can''t have. So a line like the following
    allowed:


    (feelings-about [x] [x & others])


    By defining a protocol, you''re defining an abstraction, but you haven''t yet
    defined how abstraction is implemented. (in this example, you''re reserving thoughts
    and feelings), for however but you haven''t defined exactly what the behavior
    should be. If you were to evaluate (thoughts "blob"), you would get an exception
    that says:

    "No implementation of method: thoughts of protocol: data-psychology/Psychodynamics
    for class: java.lang.String. Protocols dispatch on the first argument''s type,
    so when you call (thoughts "blob"), Cloure tries to look up the implementation
    of the thoughts method for strings, and fails.

    You can fix this sorry state of affairs by extending the data type to implement
    the Psychodynamics:


    +   (extend-type java.lang.String)

    ② Psychodynamics

    (thoughts] [str x " thinks, ''Truly, the character defines the data type")

    (feelings-about)

    [[x] str x " is longing for a simpler way of life")

    [l] x y " is envious of " y''s simpler way of life\)))


    +   (thoughts "blob")

    ③ => "blob thinks, ''Truly, the character defines the data type"


    +   (feelings-about "schmorb")

    ④ => "schmorb is longing for a simpler way of life")


    +   (feelings-about "schmorb" 2)

    ⑤ => "schmorb is envious of 2''s simpler way of life")


    extend-type is followed by the name of the class or type you want to extend and
    the protocol you want it to support—in this case, you specify the class java.lang.String
    ① and the protocol you want it to support, Psychodynamics, ②. After that, you
    provide an implementation for both the thoughts method ③ and the feelings-about
    method ④. If you''re extending a type to implement a protocol, you have to implement
    every method in the protocol or Clojure will throw an exception. In this case,
    you can''t implement just thoughts or just feelings; you have to implement both.'
