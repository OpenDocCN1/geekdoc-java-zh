    \ at #clojure.org/multimethods/\n\n# Protocols\n\nApproximately 93.58 percent\
    \ of the time, you'll to dispatch methods according to an argument's type. For\
    \ example, count needs to use a different method for vectors than it does for\
    \ maps or lists. It's possible to perform type dispatch with multimethods, protocols\
    \ are optimized for type dispatch. They're more efficient than multimethods, and\
    \ Clojure makes it easy for you succinctly specify protocol implementations,\n\
    \nA multimethod is just one polymorphic operation, whereas a protocol is a collection\
