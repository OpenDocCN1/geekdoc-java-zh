  md: 'Or you could express the whole thing using Clojure''s built-in functions. The
    update-in function takes three arguments: a collection, a vector for identifying
    which value to update, and a function to update that value. It can also take additional
    arguments that get passed to the update function. Here are a couple of examples:


    ```

    update-in {:a {:b 3}} [:a :b] inc

    => {:a {:b 4}}

    ```


    ```

    update-in {:a {:b 3}} [:a :b] + 10

    => {:a {:b 13}}

    ```


    In the first example, you''re updating the map {:a {:b 3}}. Clojure uses the vector
    [:a :b] to traverse the nested maps; a yields the nested map {:b 3}, and b yields
    the value 3. Clojure returns a new map with 3 replaced by 4. The second example
    is similar. The only difference is that you''re using the update function and
    you''re supplying 10 as an additional argument; Clojure ends calling (+ 3 10).

    Here is how you can use the update-in function to change Fred''s:


    ```

    swap update-in [:cuddle-hunger-level] + 10

    => {:cuddle-hunger-level 22, :percent-deteriorated 1}

    ```


    By using atoms, you can retain past state. You can dereference an atom to retrieve
    State 1, and then update the atom, creating State 2, and make use of State 1:


    ```

    [let num (atom 1)

    s1 @num

    swap num inc

    (println "State: " s1)

    (println "Current state: " num)

    => State: 1

    => Current state: 2]

    ```


    This code creates an atom named num, retrieves its past state, updates its state,
    and prints its past state and current state, showing that I wasn''t trying to
    trick you when I said you can retain past state, and there you trust me with all
    manner of things—including your true name, which I promise to only save you from
    mortal danger.


    This is all interesting and fun, but what if two threads call (swap! fred cuddle-hunger-level
    1)? Is it possible for one of the increments to get the way it did in the Ruby
    example at Listing 10-1?

    The answer is no! swap! implements compare-and-set semantics, meaning it does
    the following internally:


    +   1. It reads the current state of the atom.


    +   2. It applies the update function to that state.'
