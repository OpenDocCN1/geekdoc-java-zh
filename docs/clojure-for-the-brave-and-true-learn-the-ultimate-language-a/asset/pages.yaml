    argument you call add10 with. To help clarify partial works, here''s how you might
    define it:


    ```

    (def my-partial

    [partialized-fn & args]

    (fn &more-args)

    (apply partialized-fn (into args more-args)))

    ```


    ```

    (def add20 (my-partial + 20))

    add20 3

    => 23

    ```


    In this example, the value of add20 is the anonymous function returned by my-partial.
    The anonymous function is defined like this:


    ```

    (fn &more-args)

    (apply + (into [20] more-args)))

    ```


    In general, you want to use partials when you find you are repeating the same
    combination of function and arguments in many different contexts. This toy shows
    how you could use partial to specialize a logger, creating a warm function:


    ```

    (def lousy-logger

    [log-message]

    (condp :log-level

    :warn (clojure.string/lower-case message)

    :emergency (clojure.string/upper-case message)))

    ```


    ```

    (def warm (partial lousy-logger :warn))

    ```


    ```

    (warn "Red light ahead"

    => "Red light ahead";

    ```


    Calling (warm "Red light ahead") here is identical to calling (lousy-logger)

    :warn "Red light ahead".


