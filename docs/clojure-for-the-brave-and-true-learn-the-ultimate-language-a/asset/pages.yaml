  md: '# 12


    # WORKING WITH THE JVM


    ![](img/f978a379512d9fe18f046e71e9900d2e_273_0.png)


    There comes a day in every Clojurist''s life when she must venture forth from
    the sanctuary of pure functions and immutable data structures into the wild, barbaric
    Land of Java. This treacherous journey is necessary because Clojure is hosted
    on the Java Virtual Machine (JVM), which grants it three fundamental characteristics.
    First, you run Clojure applications the same way you run Java applications. Second,
    you need to use Java objects for core functionality like reading files and working
    with dates. Third, Java has a vast ecosystem of useful libraries, and you''ll
    need to know a bit about Java to use them.

    In this way, Clojure is a bit like a utopian community plunged down in the middle
    of a dystopian country. Obviously you''d prefer to interact with other utopians,
    but every once in a while you need to talk to the locals in order to get things
    done.'
  merge: -1
