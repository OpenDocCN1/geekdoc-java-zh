  md: "If you are ever in the situation, take some time to rethink your approach.\
    \ It's easy to paint yourself into a corner, making it impossible to accomplish\
    \ anything with run-of-the-mill functions. You'll be stuck having to write more\
    \ macros instead. Macros are extremely powerful and awesome, and you shouldn't\
    \ be afraid to use them. They turn Clojure's facilities for working with data\
    \ into facilities for creating new languages informed by your programming problems.\
    \ For some programs, it's appropriate for your code to be like 90 percent macros.\
    \ As awesome as they are, they also add new composition challenges. They really\
    \ compose with each other, so by using them, you might be missing out on the other\
    \ kinds of composition (functional, object-oriented) available to you in Clojure.\n\
    \nWe've covered all the mechanics of writing a macro. Pat yourself on the back!\n\
    \nTo close out this chapter, it's finally time to put on your pretending cap and\
    \ work on online potion store I talked about the very beginning of the chapter.\n\
    \n# # Brews for the Brave and True\n\nAt the beginning of this chapter, I revealed\
    \ a dream: to find some kind of drinkable that, once ingested, would temporarily\
    \ give me the power and temperament of an '80s fitness guru, freeing me from a\
    \ prison of inhibition and self-awareness. I'm sure that someone-would invent\
    \ such an elixir, so might as well get to work on a system for selling this mythical\
    \ potion. Let's call this hypothetical concoction the *B and True Ale*. The name\
    \ just came to me for no reason whatsoever.\n\nBefore the orders come pouring\
    \ in (pun)! high-five!, we'll need to have some validation in place. This chapter\
    \ shows you a way to do this validation functionally and how to write the code\
    \ that performs validations a bit more using a macro you'll write called if-valid.\
    \ This will help you understand a typical situation for writing your own macro.\
    \ If you just want the macro definition, it's okay to skip ahead to “if-valid”\
    \ on page 182.\n\n![](img/f978a379512d9fe18f046e71e9900d2e_206_0.png)\n\n# # Validation\
    \ Functions\n\nTo keep things simple, we'll worry about validating the name and\
    \ email for each order. For our store, I'm thinking we'll want to have those order\
    \ details represented like this:\n\n```\n(def order-details\n :name \"Mitchard\
    \ Blimmons\"\n  :email \"mitchard.blimmonsgmail.com\")\n```"
