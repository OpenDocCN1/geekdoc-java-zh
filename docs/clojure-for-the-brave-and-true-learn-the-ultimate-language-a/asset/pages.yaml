  md: '# Chapter 12: Working with the JVM


    This chapter is like a cross between a phrase book and cultural introduction to
    the Land of Java. It gives you an overview of the JVM, how it runs programs, and
    how to compile programs for it. It also gives you a brief tour of frequently used
    classes and methods, and explains how to interact with them from Clojure. More
    than that, it shows you how to think about and understand Java so you can incorporate
    any library into your Clojure program.


    # Chapter 13: Creating and Extending Abstractions with Multimethods, Protocols,
    and Records


    In Chapter 4 you learn that Clojure is written in terms of abstractions. This
    chapter serves as an introduction to the world of creating and implementing your
    own abstractions. You''ll learn the basics of multi-methods, protocols, and records.


    # Appendix A: Building and Developing with Leiningen


    This appendix clarifies some of the finer points of working with Leiningen, like
    what Maven is and how to figure out the version numbers of Java libraries that
    you can use them.


    # Appendix B: Boot, the Fancy Clojure Build Framework


    Boot is an alternative to Leiningen that provides the same functionality, but
    with the added bonus that it''s easier to extend and write composable tasks. This
    appendix explains Boot''s underlying concepts and guides you through writing your
    first tasks.


    # The Code


    You can download all the source code from the book at http://www.nostarch.com/clojure/.
    The code is organized by chapter. Chapter 1 describes the different ways that
    you can run Clojure code, including how to use a REPL. I recommend running most
    of the examples in the REPL as you encounter them, especially in Chapters 3 through
    8. This will help you get used to writing and understanding Lisp code, and it
    will help you retain everything you''re learning. But for the examples that are
    long, it''s best to write your code to a file, and then run the code in a REPL.


    # The Journey Begins!


    Are you ready, brave reader? Are you ready to meet your true destiny? Grab your
    best pair of parentheses: you''re about to embark on the journey of a lifetime!'
