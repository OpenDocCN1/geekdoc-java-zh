    Even though all of this program''s side effects are relatively harmless (all''re
    doing prompting and printing), sequestering them in their own functions like this
    is a best practice for functional programming. In general, you will reap more
    benefits from functional programming if you identify the bits of functionality
    that are referentially transparent and side-effect free, and place those bits
    in their own functions. These functions are not capable of causing bizarre bugs
    in unrelated parts of your program. They''re easier to test and develop in the
    REPL because they only run the arguments you pass them, not on some complicated
    hidden state object.


    # Summary


    Pure functions are referentially transparent and side-effect free, which makes
    them easy to reason about. To get the most from Closure, try to keep your impure
    functions to a minimum. In an immutable world, you use recursion instead of for/while
    loops, and function composition instead of successions of mutations. Pure functions
    allow powerful techniques like function composition functions and memoization.
    They''re also super fun!


    # Exercises


    One of the best ways to develop your functional programming skills is to try implementing
    existing functions. To that end, most of the following exercises suggest a function
