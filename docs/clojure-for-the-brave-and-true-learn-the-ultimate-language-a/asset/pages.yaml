  md: '# BOOT, THE FANCY CLOJURE BUILD FRAMEWORK


    ![](img/f978a379512d9fe18f046e71e9900d2e_307_0.png)


    Boot is an alternative to Leiningen that provides the same functionality. Leiningen''s
    more popular (as of the summer of 2015), but I personally like to work with Boot
    because it''s easier to extend. This appendix explains Boot''s underlying concepts
    and guides you through writing your first Boot tasks. If you''re interested in
    using Boot to build projects right now, check out its GitHub README (https://github.com/boot-clj/boot/)
    and its wiki (https://github.com/boot-clj/boot/wiki/).


    > > NOTE  As of this writing, Boot has limited support for Windows. The Boot team
    welcomes contributions!'
  merge: -1
  pgno: 307
- img_proc: true
  md: "# Boot’s Abstractions\n\nCreated by Micha Niskin and Alan Dipert, Boot is a\
    \ fun and powerful addition to the Clojure tooling landscape. On the surface,\
    \ it's a convenient way to build Clojure applications and run Clojure tasks from\
    \ the command line. Dig a little deeper and you'll see that Boot is like the Lisp-ed\
    \ grandchild of Git and Unix in that it provides abstractions that make it more\
    \ pleasant to write code that exists at the intersection of your operating system\
    \ and your application.\n\nUnix provides abstractions that we're all familiar\
    \ with the point where we take them for granted. (Would it kill to take your computer\
    \ out to a nice restaurant once in a while?) The process abstraction lets you\
    \ reason about isolated units of logic that can be easily composed into a stream-processing\
    \ pipeline through STDIN and STDOUT file descriptors. These abstractions make\
    \ certain kinds of operations, like text processing, very straightforward.\n\n\
    Similarly, Boot provides abstractions that make it easy to compose independent\
    \ operations into the complex, coordinated operations that tools end up doing,\
    \ converting ClojScript into JavaScript. Boot's task abstraction lets you define\
    \ units of logic that communicate through filesets. The tshirt abstraction keeps\
    \ track of the evolving context and provides a well-defined, reliable method of\
    \ task coordination.\n\nThat's a lot of high-level description, which hopefully\
    \ has hooked you'r attention. Oh no, dear reader, that was only the appetizer.\
    \ Throughout the rest of this appendix, you'll learn how to build your own Boot\
    \ tasks. Along the way, you'll discover that build tools can actually have a conceptual\
    \ foundation.\n\n# Tasks\n\nLike make, rake, grunt, and other build tools of y,\
    \ Boot lets you define tasks. Tasks are named operations that command line options\
    \ patched by some intermediary program (make, rake, Boot).\n\nBoot provides the\
    \ dispatch program, boot, and a Clojure library that makes it easy for you to\
    \ define named operations and their command line options with the deftask macro.\
    \ To see what all the fuss is out, let's encourage you to write code that prints\
    \ \"Hello, World,\" but I like my examples to have real-world utility, so your\
    \ task is to print \"My pants are on fire!\" This information is objectively more\
    \ useful. First, install Boot; then create a new directory named *boot-walkthrough*,\
    \ navigate to that directory, create a file named *build.clj*, and write this:\n\
    \n```\n(deftask fire\n  \"Prints My pants are on fire!\"\n  (println \"My pants\
    \ are on fire!\"))\n```"
  merge: -1
  pgno: 308
- img_proc: true
  md: "Now run this task from the command line with boot fire; you should see the\
    \ message you wrote to your terminal. This task demonstrates two out of the three\
    \ task components: the task is named (fire), and it's dispatched by boot. It is\
    \ super cool. You've essentially created a Clojure shell script that you can run\
    \ from the command line with ease. No Project.clj directory structure, or namespaces\
    \ needed!\n\nLet's extend the example to demonstrate how you'd write command options:\n\
    \n```\ndeftask fire\n  \"Announces that something is on fire\"\n  [t thing TH\
    \ str \"The thing that's on fire\"\n   p pluralize bool Whether to pluralize\n\
    \   (let [verb if pluralize \"are\" \"is\"]\n     (printin \"My\" thing verb on\
    \ fire!))]\n```\n\nRunning the task like so:\n\n```\nboot fire -t heart\n# =>\
    \ My heart is on fire!\n\nboot fire -t logs -p\n# => My logs are on fire!\n```\n\
    \nIn the first instance, either you're newly in love or you are a Boy Scout awkwardly\
    \ rushed to the emergency room. In the second, you need to warmly express your\
    \ excitement over meeting the requirements for a merit badge. In both instances,\
    \ you were able to specify options for the task.\nThis refinement of the fire\
    \ task introduced two command line options, and pluralize. Both options are defined\
    \ using a domain-specific language (DSL). DSLs are their own topic, briefly, the\
    \ term refers to mini-languages that you can use within a larger program to write\
    \ compact, expressive code for narrowly defined domains (like defining options).\n\
    in the option t, it specifies its name, and thing specifies its long name. THING\
    \ is a bit complicated, and I'll get it in a second. str specifies the option,\
    \ and Boot uses to validate the argument and convert it. The \"that's on fire\"\
    \ is the documentation for the option. You can view a task's documentation in\
    \ the terminal with boot task-name-h:\n\n```\nboot fire -h\n# Announcements that\
    \ something is on fire\n\n# Options:\n# --help Print this help info.\n# -t, --thing\
    \ THING Set the thing's on fire to THING.\n# -p, --pluralize Whether to pluralize\n\
    ```\n\nPretty groovy! Boot makes it very easy to write code that's meant to be\
    \ invoked from the command line."
  merge: -1
  pgno: 309
- img_proc: true
  md: 'Now, let''s look at THING. THIS is optarg, and it indicates that this option
    expects an argument. You don''t have to include an optarg when you''re defining
    an option (notice that the plural option has no optarg). The optarg doesn''t have
    to correspond to the full name of the option; you could replace THING with BILLY_JOEL
    or whatever the task would work the same. You can also designate complex options
    using the optarg. (Visit https://github.com/boot-clj/boot/blob/master/Task-Options-DSL#complex-options
    for Boot''s documentation on the subject.) Basically, complex options allow you
    to specify that option arguments should be treated as maps, sets, vectors, or
    nested collections. It''s pretty powerful.


    Boot provides you all the tools you could ask to build command interfaces with
    Cloure. And you''ve just started learning about it!


    # The REPL


    Boot comes with a number of useful built-in tasks, including a REPL task. Run
    boot repl to fire up puppy. The Boot REPL is similar to Leining''s in that it
    handles loading your project code so you can play around with it. You might not
    think this applies to the project you''ve writing using your own tasks, but you
    can actually run tasks in the REPL (I omitted the boot.user=> prompt). You can
    specify options using:


    ```

    (fire "-t" "NBA Jam guy"

    ; My NBA Jam guy is on fire!

    ; => nil

    ```


    > Notice that the option''s value comes right after the option.

    You can also specify an option using a keyword:


    ```

    (fire :thing "NBA Jam guy"

    ; My NBA Jam guy is on fire!

    ; => nil

    ```


    You can also combine options:


    ```

    (fire "-p" "-t" "NBA Jam guys"

    ; My NBA Jam guys are on fire!

    ; => nil

    ```


    ```

    (fire :pluralize true :thing "NBA Jam guys"

    ; My NBA Jam guys are on fire!

    ; => nil

    ```


    And of course, you can use detask in the REPL as well—it''s just Cloure, after
    all. The takeaway is that Boot lets you interact with your tasks as Cloj functions,
    because that''s what they are.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Composition and Coordination


    If you''ve seen so far was all Boot had to offer, it''d be a pretty swell tool,
    it wouldn''t be very different from other build tools. One feature that sets Boot
    apart is how it lets you compose tasks. For comparison''s sake, here''s an example
    Rake invocation (Rake is the premier Ruby build tool):


    ```

    rake db:create db:migrate db:seed

    ```


    This code will create a database, run migrations on it, and populate it with seed
    data when run in a Rails project. However, worth noting is that Rake doesn''t
    provide any way for these tasks to communicate with each other. Specifying multiple
    tasks is just a convenience, saving you from having to run rake db:create; rake
    db:migrate; rake db:seed. If you want to access the result of Task A within Task
    B, the tool doesn''t help you; have to manage that coordination yourself. Usually,
    you''ll do this by saving the result of Task A into a special place on the filesystem
    and then making Task B reads that special place. This looks like programming with
    mutable, global variables, and it''s as brittle.


    # Handlers and Middleware


    Boot addresses this task communication problem by treating tasks as middlewarefactories.
    If you''re familiar with Ring, Boot''s tasks work very similarly, so feel free
    to skip to "Tasks Are Middleware Factories" on page 287. If you''re not familiar
    with the concept of middleware, allow me to explain! Middleware refers to a set
    of conventions that programmers adhere to so they can flexibly create domain-specific
    function pipelines. So let''s un-dense it. I''ll discuss the flexible part in
    this section and cover domain-specific in "Filesets" on page 288.


    To understand how the middleware approach differs from runof-the-mill function
    composition, here''s an example of composing everyday functions:


    ```

    (def strinc (comp str inc)

    (strinc 3)

    ;4"

    ```


    There''s nothing interesting about this function composition. In fact, this function
    composition is so unremarkable that it strains its abilities as a writer to actually
    say anything about it. There are two functions, each does its own thing, and now
    they''ve been composed into one. Whoop-dee-doo!


    Middleware introduces an extra step to function composition, giving you more flexibility
    in defining your function pipeline. Suppose, in'
  merge: -1
