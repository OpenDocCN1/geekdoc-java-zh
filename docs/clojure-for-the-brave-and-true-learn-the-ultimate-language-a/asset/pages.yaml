  md: "# Validators\n\nValidators let you specify what states are allowable for a\
    \ reference. For example, here's a validator that you could use to ensure that\
    \ a zombie's :percent-deteriorated is between 0 and 100:\n\n```\n(defn percent-deteriorated-validator\n\
    \  [:keys [percent-deteriorated]]\n  (and >= percent-deteriorated 0)\n       (<\
    \ percent-deteriorated 100)))\n```\n\nAs you can see, the validator takes only\
    \ one argument. When you add a validator to a reference, the reference is modified\
    \ so that, whenever it's updated, it will call this validator with the value returned\
    \ from the update function as its argument. If the validator fails by returning\
    \ false or throwing an exception, the reference won't change to point to the new\
    \ value.\n\nYou can attach a validator during creation:\n\n```\n(def bobby\n \
    \ (atom\n    (:cuddle-hunger-level 0 :percent-deteriorated 0)\n    :validator\
    \ percent-deteriorated-validator))\n  (swap bobby update-in [:percent-deteriorated]\
    \ + 200)\n; This throws \"Invalid reference state\")\n```\n\nIn this example,\
    \ percent-deteriorated-validator returned false and the atom update failed.\n\n\
    You can throw an exception to get a more descriptive error message:\n\n```\n(defn\
    \ percent-deteriorated-validator\n  [:keys [percent-deteriorated]]\n  (or (>=\
    \ percent-deteriorated 0)\n      (< percent-deteriorated 100))\n  (throw (IllegalStateException\
    \ \"That's not math!\")))\n(def bobby\n  (atom\n    (:cuddle-hunger-level 0 :percent-deteriorated\
    \ 0)\n    :validator percent-deteriorated-validator))\n  (swap bobby update-in\
    \ [:percent-deteriorated] + 200)\n; This throws \"IllegalStateException That's\
    \ not math!\")\n```\n\nPretty great! Now let's look at refs."
