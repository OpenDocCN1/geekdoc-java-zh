- img_proc: true
  md: 'So a value doesn''t change, but you can apply a process to a value to produce
    a new value. For example, say we start with a value F1, and then we apply the
    Cuddle Zombie process to F1 to produce the value F2. The process then gets applied
    to the value F2 to produce the value F3, and so on.


    This leads us to a different concept of identity. Instead of understanding identity
    as inherent to a changing object, as in OO metaphysics, Clojure constructs identity
    as something humans impose on a succession of unchanging values produced by a
    process over time. We use names for identities F1, F2, F3, and so on. From this
    viewpoint, there''s no such thing as mutable state. Instead, state means the value
    of an identity at a point in time.


    Rich Hickey used the analogy of phone numbers to explain state. Alan''s number
    changed 10 times, but we will always call these numbers by the same name, Alan''s
    phone number. Alan''s number five years ago is a different value than Alan''s
    phone number today, and both are two states of Alan''s phone identity.


    This makes sense when you consider that in your programs you are dealing with
    information about the world. Rather than saying that information has changed,
    you would have received new information. At 12:00 PM on Friday, the Cuddle Zombie
    was in a state of 50 percent decay. At 1:00 PM, he was 60 percent decayed. These
    are both facts that you can process, and the introduction of a new fact does not
    invalidate a previous fact. Even when Fred''s decay decreased from 50 percent
    to 60 percent, it''s still true that at 12:00 PM he was in a state of 50 percent
    decay.


    10-2 shows how you might visualize values, process, identity, and state.


    ![](img/f978a379512d9fe18f046e71e9900d2e_237_0.png)


    10-2: Values, process, identity, and state


    Values don''t act on each other, and they can''t be changed. They can''t do anything.
    Change only occurs when a) a process generates a new value and b) we choose to
    associate the identity with the new value.


    To handle this sort of change, Clojure uses reference types. Reference types let
    you manage identities in Clojure. Using them, you can name an identity and retrieve
    its state. Let''s look at the simplest of these, the atom.'
