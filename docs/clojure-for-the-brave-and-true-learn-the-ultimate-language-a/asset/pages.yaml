  md: 'For example, do the following in your jack-handy buffer:


    +   1. Go to the beginning of the file.

    2. Use C-spc.

    3. Use M-f twice. You should see a highlighted region encompassing If you.

    4. Press backspace. That should delete If you.


    One cool thing about mark instead of Shift-selecting text is that you''re free
    to use all of Emacs'' movement commands after you set the mark. For example, you
    could set a mark and use C-s to search for some bit of text hundreds of lines
