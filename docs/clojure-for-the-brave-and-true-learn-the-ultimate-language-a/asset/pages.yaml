    \ part))))\n\nThe symmetrize-body-parts function (starting at ①) employs a general\
    \ strategy that is common in functional programming. Given a sequence (in this\
    \ case, a vector of body parts and their sizes), the function continuously splits\
    \ the sequence into a head and a tail. Then it processes the body, adds it to\
    \ some result, and uses recursion to continue the process with the tail.\n\nWe\
