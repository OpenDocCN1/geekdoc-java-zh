    \ is that your macro body tries to get the value the symbol it refers to, whereas\
    \ what you actually want to return is the symbol itself. There are other problems,\
    \ too: you're trying to get the value of result, which is unbound, and you're\
    \ trying to get the value of result instead of returning its symbol. Here's how\
    \ you would write the macro to do what you want:\n\n```\n(defmacro my-print\n\
    [expression]\n  (list let ['result expression]\n    (list 'println result)\n \
    \ ))\n```\n\nHere, you're quoting each symbol you want to use as a symbol by prefixing\
    \ it with the single quote character, ''. This tells Clojure to turn off evaluation\
    \ for whatever follows, in this case preventing Clojure from trying to resolve\
    \ the symbols and instead just returning the symbols. The ability to use quoting\
    \ to turn off evaluation is central to writing macros, so let's give the topic\
    \ its own section.\n\n# Simple Quoting\n\nYou'll always use quoting within your\
    \ macros to obtain an unevaluated symbol. Let's go through a brief refresher on\
    \ quoting and then see how you use it in a macro.\n\nFirst, here's a simple function\
    \ call with no quoting:\n\n```\n(+ 1 2)\n=> 3\n```\n\nIf we add quote at the beginning,\
    \ it returns an unevaluated data structure:\n\n```\n(quote (+ 1 2))\n=> (+ 1 2)\n\
    ```"
