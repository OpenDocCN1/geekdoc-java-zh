    that happens, the dereference would block forever and tie up the thread. To avoid
    that, you can include a timeout:


    ```

    (let [p promise]]

    (deref p 100 "timed out")

    ```


    This creates a promise, p, and tries to dereference it. The number 100 tells there
    to wait 100 milliseconds, and if no value is available by then, to use the timeout
    value, "timed out".


    The last detail I should mention is that you can also use promises to register
    callbacks, achieving the same functionality that you might be used to in JavaScript.
    JavaScript callbacks are a way of defining code that could execute asynchronously
    once some code finishes. Here''s how to do it in Clojure:


    ```

    (let [ferengi-wisdom-promise (promise)]

    (future println "Here''s some Ferengi wisdom:" @ferengi-wisdom-promise)

    (thread/sleep 100)

    (deliver ferengi-wisdom-promise "Whisper your way to success.")

    => Here''s some Ferengi wisdom: Whisper your way to success.

    ```


    This example creates a future that begins immediately. However, the future is
    blocking because it''s waiting for a value to be delivered to ferengi-wisdom-promise.
    After 100 milliseconds, you deliver the value and the println statement in the
    future runs.


    Futures, delays and promises are great, simple to manage concurrency in your application.
    In the next section, we''ll look at one more function to keep your concurrent
    applications under control.


