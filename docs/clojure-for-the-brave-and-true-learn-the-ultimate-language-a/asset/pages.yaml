    # # Syntax


    Clojure''s syntax is simple. Like all Lisps, it employs a uniform structure, a
    handful of special operators, and a constant supply of parentheses delivered from
    the parenthesis mines hidden beneath the Massachusetts Institute of Technology,
    where Lisp was born.


    # # Forms


    All Clojure code is written in a uniform structure. Clojure recognizes different
    kinds of structures:


    +   * Literal representations of data structures (like numbers, strings, maps,
    and vectors)

    * Operations


    We use the term form to refer to valid code. I''ll also sometimes use expression
    to refer to Clojure forms. But don''t get too hung up on the terminology. Clojure
    evaluates every form to produce a value. These literal representations are all
    valid forms:


    ```

    1

    "a string"

    ["a" "vector" "of" "strings"]

    ```


    Your code will rarely contain free-floating literals, of course, because they
    don''t actually do anything on their own. Instead, you will use literals in operations.
    Operations are how you do things. All operations take the opening parenthesis,
    operator, operands, closing parenthesis:


    ```

    (operator operand1 operand2 ... operandn)

    ```


    Notice that there are no commas. Clojure uses whitespace to separate operands,
    and it treats commas as whitespace. Here are some example operations:


    ```

    (+ 1 2 3)

    => 6

    ```


    ```

    (str "It was the panda "in the library " "with a dust buster")

    => "It was the panda in the library with a dust buster"

    ```'
