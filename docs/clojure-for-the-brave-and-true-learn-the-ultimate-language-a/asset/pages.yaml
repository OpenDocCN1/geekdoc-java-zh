  md: '# About the Author


    Daniel Higginboth has been a professional programmer for 11 years, half of that
    at McKinsey & Company, where he used Clojure to build mobile and web applications.
    He has also contributed to the curriculum for ClojureBridge, an organization that
    offers free, beginner-friendly Clojure workshops for women. Daniel blogs about
    life and programming at http://flyingmachinesudios.com/, and can be found on Twitter,
    @nonrecursive. He lives in Durham, North Carolina, with his wife and four cats.


    # About the Technical Reviewer


    Alan Dipert first heard about Lisp when he was 10 years old. After it was described
    to him, he said "That sounds dumb." In 2009, he learned Clojure and revised his
    opinion. Alan has designed and built Clojure systems, conducted Clojure trainings,
    and spoken at Clojure conferences. You can keep track of Alan’s work and recent
    opinions by visiting http://tailrecursion.com/~alan or by following him on Twitter,
    @alandipert.'
