  md: '# ACKNOWLEDGMENTS


    So many people helped me birth this weird baby, and I am humbled and grateful
    for all their support.


    First, thanks to Jess, my wife, for doing the illustrations that complete this
    book, giving it the visual character I had hoped for. Thanks, too, for the support
    and for putting up with me when I was in crazy-eyed mode. (P.S. It feels bizarre
    to have my wife mentioned via a programming book''s front matter.)


