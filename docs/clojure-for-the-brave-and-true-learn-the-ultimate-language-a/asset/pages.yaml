  md: 'Finally, you can interrogate a future using realized? to see if it''s done
    running:


    ```

    (realized? (future (Thread/sleep 1000))

    => false

    ```


    ```

    (let [f (future])

    @f

    (realized? f))

    => true

    ```


    Futures are a dead-simple way to sprinkle some concurrency on unto other program.


    On their own, they give you the power to chunk tasks onto other threads, which
    can make your program more efficient. They also let your program behave more flexibly
    by giving you control over when a task''s result is required.


    When you dereference a future, you indicate that the result is required right
    now and evaluation should stop until the result is obtained. You''ll see how this
    can help you with the mutual exclusion problem in a bit. Alternatively, you can
    ignore the result. For example, you can use futures to write to a log file asynchronously,
    in which case you don''t need to dereference the future to get any value back.


    The flexibility that futures give you is very cool. Clojure allows you to treat
    task definition and requiring the result independently with delays and promises.


    # Delays


    Delays allow you to define a task without having to execute it or require the
    result immediately. You can create a delay using delay:


    ```

    (def jackson-5-delay)

    (delay (let message "Just call my name and I''ll be there")

    (println "First deref:")

    message))

    ```


    In this example, nothing is printed, because we haven''t asked the let form to
    be evaluated. You can evaluate the delay and get its result by dereferencing it
    or by using force. force behaves identically to deref in that it communicates
    more clearly that you''re causing a task to start as opposed to waiting for a
    task to finish:


    ```

    (force jackson-5-delay)

    => First deref: Just call my name and I''ll be there

    => "Just call my name and I''ll be there"

    ```'
