  md: "# # Learning a New Programming Language:\n A Journey Through the Four Labyrinths\n\
    \nTo wield Cloj to its fullest, you'll need to find your way through the four\
    \ labyrinths that face every programmer learning a new language:\n\n**The Forest\
    \ of Tooling** A friendly and efficient programming environment makes it easy\
    \ to try your ideas. You'll learn how to set up your environment.\n\n**The Mountain\
    \ of Language** As you ascend, you'll gain knowledge of Clojure's syntax, semantics,\
    \ and data structures. You'll learn how to use one of the mightiest programming\
    \ tools, the macro, and learn how to simplify your life with Clojure's concurrency\
    \ constructs.\n\n**The Cave of Artifacts** In its depths you'll learn to build,\
    \ run, and distribute your programs, and how to use code libraries. You'll also\
    \ learn Clojure's relationship to the Java Virtual Machine (JVM).\n\n**The Cloud\
    \ Castle of Mindset** In its rarefied air, you'll come to know why and how of\
    \ Lisp and functional programming. You'll learn the philosophy of simplicity that\
    \ permeates Clojure, and how to solve problems like a Clojurist.\n\nMake no mistake,\
    \ you will work. But this book will make the work exhilarating, not exhausting.\
    \ That's because this book follows three guidelines:\n\n+   - It takes the dessert-first\
    \ approach, giving you the development tools and language details you need to\
    \ start playing with real programs immediately.\n\n+   - It assumes zero experience\
    \ with the JVM, functional programming, or Lisp. It covers these topics in detail\
    \ so you'll feel confident about what you're doing when you build and run Clojure\
    \ programs.\n\n+   - It eschews real-world examples in favor of more interesting\
    \ exercises, as assaulting hobbits and tracking glittering vampires.\n\nBy the\
    \ end, you will be able to use Clojure, one of the most exciting and fun programming\
    \ languages in existence!\n\n# ## How This Book Is Organized\n\nThis book is split\
    \ into three parts to better guide you through your valiant quest, brave fledgling\
    \ Clojurist.\n\n# ### Part 1: Environment Setup\n\nTo stay motivated and learn\
    \ efficiently, you need to actually write code and build executables. These chapters\
    \ take you on a quick tour of the tools you'll need to easily write programs.\
    \ That way you can focus on learning Clojure, not fiddling with your environment."
