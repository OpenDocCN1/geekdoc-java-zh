  md: "# Syntactic Abstraction and the -> Macro\n\nOften, Clojure code consists of\
    \ a bunch of nested function calls. For example, I use the following function\
    \ in one of my projects:\n\n```\n(def read-resource\n  \"Read a resource into\
    \ a string\"\n  [path]\n  (read-string (slurp (clojure.java.io/resource path))))\n\
    ```\n\nTo understand the function body, in this case (clojure.java.io/resource\
    \ path), and then work your way out from left to see how the result of each function\
    \ gets to another function. This right-to-left flow is opposite of what non-Lisp\
    \ programmers are used to. As you used to writing in Clojure, this kind of code\
    \ gets easier and easier to understand. But if you want to translate Clojure code\
    \ so you can read it in a more familiar, left-to-right, top-bottom manner, you\
    \ can use the built-in -> macro, which is also known as the *threading* or *stabby*\
    \ macro. It lets you rewrite the preceding function like:\n\n```\n(def read-resource\n\
    \  [path]\n  -> path\n  clojure.java.io/resource\n    slurp\n  read-string))\n\
    ```\n\nYou can read this as a pipeline that goes from top to bottom instead of\
    \ from inner parentheses to outer parentheses. First, path gets passed to 1o/resource,\
    \ then the result gets passed to slurp, and finally the result of that gets passed\
    \ to read-string.\n\nThese two ways of defining read-resource are entirely equivalent.\
    \ However, the second one might be easier because we approach it from top to bottom,\
    \ a direction we're used to. The -> also lets us omit parentheses, which means\
    \ there's less visual noise to contend with. This is a *syntactic abstraction*\
    \ because it lets you write code in a syntax that's different from Clojure's built-in\
    \ syntax but is preferable for human consumption. Better than lead into gold!!!"
