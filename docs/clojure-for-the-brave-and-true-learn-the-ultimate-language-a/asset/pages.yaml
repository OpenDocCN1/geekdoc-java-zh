    \ arbitrary values returned by a dispatching function, protocol methods are dispatched\
    \ based on the type of the first argument, as shown in this example:\n\n```\n\
    (ns data-psychology)\n(defprotocol Psychodynamics)\n \"Plumb the inner depths\
