  md: '# Peg Thing


    It''s that time! Time to build a terminal implementation of Peg Thing using everything
    you''ve learned so far: immutable data structures, lazy sequences, pure functions,
    recursion—everything! Doing this will help you understand how to combine these
    concepts and techniques to solve larger problems. Most important, you''ll learn
    how to model the changes that result from each move a player makes without having
    to mutate objects like you would in OOP.


    To build the game, you''ll first learn the game''s mechanics and how to start
    and play the game. Then, I''ll explain the code''s organization. Finally, I''ll
    walk through each function.


    You can find the complete code repository for Peg Thing at https://www.nostarch.com/clojure/


    # Playing


    As mentioned earlier, Peg Thing is based on the secret mind-sharpening tool passed
    down from ye old days and is now distributed by Cracker Barrel.


    If you''re not familiar with the game, here are the mechanics. You start out with
    a triangular board consisting of holes filled with pegs, and one hole has a missing
    peg, as shown in Figure 5-1.


    ![](img/f978a379512d9fe18f046e71e9900d2e_134_0.png)


    Figure 5-1: The initial setup for Peg Thing


    The object of the game is to remove as many pegs as possible. You do this by jumping
    over pegs. In Figure 5-2, peg A jumps over peg B into the empty hole, and you
    remove peg B from the board.'
