  md: "Notice first that this macro has two arities in order to supply a default value.\
    \ The first arity is where the real work is done. It has the parameter q, and\
    \ the second arity does not. The second arity calls the first value (future) supplied\
    \ for q; you'll see why in a minute. At, the macro returns a future that creates\
    \ a promise, delivers its value in whatever form is supplied for q, evaluates\
    \ the serialized code, and finally returns the promise q usually be a nested list\
    \ expression returned by another call to enqueue, in Listing 9-2. If no value\
    \ is supplied for q, the macro supplies a future so that the deref doesn't cause\
    \ an exception.\n\nNow that we've written the enqueue macro, let's try it out\
    \ and see whether it reduces execution time!\n\n```\n(time (-> enqueue (saying\
    \ 200 \"Hello, go'na!\") (println @saying))\n  (enqueue (saying 400 \"Pip pip!\"\
    ) (println @saying))\n  (enqueue (saying 100 \"Cheerio!\") (println @saying))))\n\
    \  => \"Hello, go'na!\"\n  => Pip pip!\n  => Cheerio!\n  => Elapsed time: 401.635\
    \ msecs\n```\n\nBlimey! The greeting is delivered in the correct order, and you\
    \ can see by the elapsed time that the \"work\" of sleeping was handled concurrently.\n\
    \n# Summary\n\nIt's important for programmers like you to learn concurrent and\
    \ parallel programming techniques so you can design programs that run efficiently\
    \ on modern hardware. Concurrency refers to a program's ability to carry out more\
    \ than one task, and in Clojure you achieve this by placing tasks on separate\
    \ threads. Programs execute in parallel when a computer has more than one CPU,\
    \ which allows more than one to be executed at the same time.\n\nConcurrent programming\
    \ refers to the techniques used to manage three concurrency risks: reference cells,\
    \ mutual exclusion, and deadlock. Clojure gives you three basic tools that help\
    \ you mitigate these risks: futures, delays, and promises. Each tool you couples\
    \ the three events of a task, executing a task, and requiring a task's result.\
    \ Futures define a task and execute it immediately, allowing you to require the\
    \ result later or never. Futures also cache their results. Delays define a task\
    \ that doesn't get executed until later, and a delay's result gets cached. Promises\
    \ let you express that you require a result without knowing about the task that\
    \ produces it. You can only deliver a value to a promise once.\n\nIn the next\
    \ chapter, you'll explore the philosophical side of concurrent programming and\
    \ learn more sophisticated tools for managing the risks."
