    # # JAR Files


    JAR files allow you to bundle all your .class files into one single file. Navigate
    to your phrasebook directory and run the following:


    ```

    jar cvfe conversation.jar PirateConversation PirateConversation.class

    pirate_phrases/*.class

    java -jar conversation.jar

    ```


    This displays the pirate conversation correctly. You bundled all the classes into
    conversation.jar. Using the e flag, you also indicated that the PirateConversation
    is the entry point. The class that contains the main method that should be executed
    when the JAR as a whole runs, and jar stores this information in the file META-INF/MANIFEST.MF
    within the JAR file. If you were to read that file, it would contain this line:


    Main-Class: PirateConversation


    By the way, when you execute JAR files, you don''t have to worry which directory
    you''re in, relative to the file. You could change the pirate_phrases directory
    and run java -jar .../conversation.jar, and it would work fine. The reason is
    that the JAR file maintains the directory structure. You can see it with jar tf
    conversation.jar, which outputs this:


    ```

    META-INF/

    META-INF/MANIFEST.MF

    PirateConversation.class

    pirate_phrases/Farewells.class

    pirate_phrases/Greetings.class

    ```


    You can see that the JAR file includes the pirate_phrases directory. One more
    fact about JARS: they''re just ZIP files with a jar extension. You can treat them
    as any other ZIP file.


