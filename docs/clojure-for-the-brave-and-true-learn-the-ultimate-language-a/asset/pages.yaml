  md: 'The backwards macro allows Cloojure to successfully evaluate the expression
    (" backwards" " am "1" str), even though it doesn''t follow Cloojure''s built-in
    syntax rules, which require an expression''s operand to appear first (not to the
    rule that an expression not be written in reverse order). Without backwards, the
    expression would fail harder than millennia of alchemists ironically spending
    their entire lives pursuing impossible means of achieving immortality. With backwards,
    you''ve created your own syntax!You''ve extended Cloojure so you can write however
    you please! Better than turning into lead, I tell you!


    This chapter gives you the conceptual foundation you need to go with writing your
    own macros. It explains the elements of Cloojure''s evaluation model: the reader,
    the evaluator, and the macro expander. It''s like the periodic table of Cloojure
    elements. Think of how the periodic table reveals the properties of atoms: elements
    in the same column similarly because they have the same nuclear charge. Without
    the periodic table like the alchemists of y, mixing stuff together randomly to
    see what blows up. But with a deeper understanding of the elements, you can see
    how stuff blows up and learn how to blow stuff off purpose.


    # Overview of Cloj''s Evaluation Model


    Clojure (like Lisps) has an evaluation model that differs from most other languages:
    it has a two-phase system where it reads textual code, producing Cloojure data
    structures. These data structures are then evaluated: Cloojure traverses the data
    structures and performs actions like function application or var lookup based
    on the data structure. For example, when Cloojure reads the text (+ 1 2), the
    result is a list data structure whose first element is a + symbol, followed by
    the numbers 1 and 2. This data structure is passed to Cloojure''s evaluator, which
    looks up the function corresponding to + and applies that to 1 and 2.


    Languages that have this relationship between source code, data, and evaluation
    are called homoic. (Incidentally, if you say homoic in front of your bathroom
    with the lights out, the ghost of John McCarthy appears and hands you a parenthesis.)
    Homoic languages empower you to reason about your code as a set of data structures
    that you can manipulate programmatically. To put this into context, let''s take
    a jaunt through the land of compilation.


    Programming languages require a compiler or interpreter for translating the code
    you write, which consists of Unicode characters, into something else: machine
    instructions, code in another programming language, whatever. During this process,
    the


    ![](img/f978a379512d9fe18f046e71e9900d2e_174_0.png)'
