  md: "defining your macro, you can use argument destructuring just like you can with\
    \ functions and let bindings. You can also write multiple-arity and recursive\
    \ macros.\n\nMost of the time, macros will return lists. You can build up the\
    \ list to be returned by using list functions or by using syntax. Syntax quoting\
    \ usually leads to code that is clearer and more concise lets you create a template\
    \ of the data structure you want to return that is easier to parse. Whether you\
    \ use syntax quoting or plain quoting, its important to be clear about the distinction\
    \ between a symbol and the value it evaluates to when building your list. And\
    \ if you want your macro to return multiple forms for Clojure to evaluate, make\
    \ sure to wrap them in a do.\n\n# Refactoring a Macro and Unquote Splicing\n\n\
    That code-critic macro in the preceding section could still use some improvement.\
    \ The two println calls are nearly identical. First, let's create a function to\
    \ generate those println lists. Clean that up. Functions are easier to think about\
    \ and play with macros, so it's a good idea to make macro guts to helper functions:\n\
    \n```\n(defn criticize-code\n  [criticism code]\n  (println ~criticism ~code)))\n\
    ```\n\n```\n(defmacro code-critic\n  [good]\n  (do (~criticize-code \"Cursed bacteria\
    \ of Liberia, this is bad code: bad\")\n       (~criticize-code \"Sweet boa of\
    \ Western and Eastern Samoa, this is good code: good)))\n```\n\nNotice how the\
    \ criticize-code function returns a syntax-quoted list. This is how you build\
    \ up the list that the macro will return.\nThere's more room for improvement,\
    \ though. The code still has multiple, nearly identical calls to a function. In\
    \ a situation where you want to apply the same function to a collection of values,\
    \ it makes sense to use a seq function like map:\n\n```\n(defmacro code-critic\n\
    \  [good]\n  (do (~map #(criticize-code %)\n       [\"Great squid of Madrid, this\
    \ is bad code: bad\"]\\n       [\"Sweet gorilla of Manila, this is good code:\
    \ good\\])))\n```\n\nThis is looking a little better. You're mapping over each\
    \ criticism and applying the criticize-code function to the pair. Let's try to\
    \ run the code:\n\n```\n(code-critic (1 + 1) (+ 1 1))\n  => NullPointerException\n\
    ```"
