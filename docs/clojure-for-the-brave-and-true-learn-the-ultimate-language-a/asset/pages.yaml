- img_proc: true
  md: '```

    | | clojure_noob

    || | core.clj

    @ test

    || | clojure_noob

    || | core_test.clj

    ```


    This project skeleton is not inherently special or Clojure-y. It''s just a convention
    used by Leiningen. Leiningen expects your app to have this structure. The first
    file of name is project.clj at which is a configuration file for Leiningen. It
    helps Leiningen answer such questions as “What dependencies does this project?”
    and “When this Clojure program runs, what function should run first?” In general,
    you''ll save your source code in src/<project_name>. In this case, the file src/clojure_noob/core.clj
    at where you''ll be writing your Clojure code for a while. The directory at obviously
    contains tests, and resources at where you store assets like


    # Running the Clojure Project


    Now let''s actually run the project. Open src/clojure_noob/core.clj in your favor-editor.
    You would see this:


    +   - clojure_noob.core

    (:gen-class)


    +   - (def -main

    "I don''t do a whole lot...yet."

    [&]

    (println "Hello, World!")


    > The lines at declare a namespace, which you don''t need to worry about right
    now. The -main function at is the entry point to your program, a topic that is
    covered in Appendix A. For now, replace the text "Hello, World!" with "I''m a
    little teapot!" The full line should read (println "I''m a little teapot!")


    Next to the clojure_noob directory in your terminal and enter:


    ```

    lein run

    ```


    You should see the output "I''m a little teapot!" Congratulations, little teapot,
    you wrote and executed a program!

    You''ll learn more about what''s actually happening in the program as you read
    through the book, but for all you need to know is that you created a function,
    -main, and that function runs when you execute lein at the command line.


    ![](img/f978a379512d9fe18f046e71e9900d2e_32_0.png)'
