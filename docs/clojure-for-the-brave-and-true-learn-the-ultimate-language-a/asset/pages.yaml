    This is another version of the mutual exclusion problem. Object-

    orient programming (OOP), you can manually address this problem with

    a mutex, which ensures that only one thread can access a resource (in this

    case, the object) at time for the duration of the mutex.


    The fact that objects are never stable stop us from treating them

    as the fundamental building blocks of programs. In fact, this is considered

    an advantage of OOP. It doesn''t matter how the state changes; you can still

    interact with a stable interface and everything will work as it should. It

    conforms to our intuitive sense of the world. A piece of wax is still the same

    piece of wax even if its properties change: if I change its color, melt it, and

    pour it on the face of my enemy, I''d still think of it as the same object I

    started with.


    Also, in OOP, objects do things. They act on each other, changing

    state as the program runs. Again, this conforms to our intuitive sense of

    the world: change is the result of objects acting on each other. A Person

    pushes on a Door object and enters a House object.


    # Clojure Metaphysics


    In Clojure metaphysics, we would say that we never encounter the sample

    cuddle zombie twice. not a discrete thing that exists in

    the independent world of its mutations; it''s actually a success of values.


    The term value is used often by Clojurists, and its specific meaning

    differ from what you''re used to. Values are atomic in the sense that

    they form a single irreducible unit or component in a larger system; they''re

    indivisible, unchanging, stable. Numbers are values; it wouldn''t

    make sense for the number 15 to mutate into another number. When you

    or or subtract from 15, you don''t change the number 15; you just wind up

    ith a different number. Clojure''s data structures are also values because

    they''re immutable. When you use assoc on a map, you don''t modify the

    original map; instead, you derive a new map.'
