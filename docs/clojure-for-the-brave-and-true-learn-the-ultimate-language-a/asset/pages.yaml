  md: 'Another difference is that the data structure returned by function is not evaluated,
    but the data structure returned by a macro is. The process of determining the
    return value of a macro is called macro expansion, and you can use the function
    macroexpand to see what data a macro returns before that structure is evaluated.
    Note that you have to quote the format that you pass to macroexpand:


    ```

    (macroexpand ''ignore-last-operand (+ 1 2 10))\n=> (+ 1 2)

    ```


    ```

    (macroexpand ''ignore-last-operand (+ 1 2 (printf "look at me!!!"))\n=> (+ 1 2)

    ```


    As you can see, both expansions result in the list (+ 1 2). When this list is
    evaluated, as in the previous example, the result is 3.

    Just for fun, here''s a macro for doing simple infix notation:


    ```

    defmacro infix\n[infix]\n(list second infix)\n(first infix)\n(last infix))

    ```


    ```

    (infix (1 + 2))\n=> 3

    ```


    ![](img/f978a379512d9fe18f046e71e9900d2e_188_0.png)


    The best way to think about this whole process is to picture a phase between reading
    and evaluation: the macro expansion phase. Figure 7-6 shows how you can visualize
    the entire evaluation process for (infix (1 + 2)).

    And how macros fit into the evaluation process. But why would you want to do this?
    The reason is that macros allow you to transform an arbitrary data structure like
    (+ 1 2) into one that Clojure can evaluate, use Clover to extend itself so you
    can write programs however you please. In other words, macros enable syntactic
    abstraction. Syntactic abstraction may sound a bit abstract (ha ha!), so let''s
    explore that a little.


    Figure 7-6: The full evaluation process for (infix (1 + 2))'
