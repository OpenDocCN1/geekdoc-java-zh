  md: '# Refs


    Atoms are ideal for managing the state of independent identities. Sometimes, though,
    we need to express that an event should update the state of more than one identity
    simultaneously. Refs are the perfect tool for this scenario.


    A classic example of this is recording sock gnome transactions. As we all know,
    sock gnomes take a single sock from every clothes dryer around the world. They
    use these socks to incubate their young. In return for this "gift," sock gnomes
    protect your home from El Chupacabra. If you haven''t been visited by El Chupacabra
    lately, you have have sock gnomes to thank.


    Model sock transfers, we need to express that a dryer has lost a sock and a gnome
    has gained a sock simultaneously. One moment the sock belongs to the dryer; the
    next it belongs to the gnome. The sock should never appear to belong to both the
    dryer and the gnome, nor should it appear to belong to neither.


    ![](img/f978a379512d9fe18f046e71e9900d2e_244_0.png)


    # Modeling Sock Transfers


    You can model this sock transfer with refs. Refs allow you to update the state
    of multiple identities using transaction semantics. These transactions have three
    features:


    +   - They are atomic, meaning that all refs are updated or none of them are.


    +   - They are consistent, meaning that the refs always appear to have valid states.
    A sock will always belong to a dryer or a gnome, never both or neither.


    +   - They are isolated, meaning that transactions behave as if executed serially;
    if two threads are simultaneously running transactions one transaction will retry.
    This is similar to the compare-and-set semantics of atoms.


    You might recognize these as the A, C, and I in the ACID properties of database
    transactions. You can think of refs as giving you the same safety as database
    transactions, only with in-memory data.


    Clojure uses transactional memory (STM) to implement this behavior. STM is very
    cool, but when you''re starting with Clojure, you don''t need to know much about
    it; you just need to know how to use it, which is what this section shows you.


    Let''s start transferring some socks! First, you''ll need to code up some sock-
    and gnome-creation technology. The following code defines some sock varieties,
    then defines a couple of helper functions: sock-count will'
