    - How to organize Clojure projects using the filesystem


    I''ll start with a high-level overview of Clojure''s organizational system, which
    works like a library. Melvi quivers with excitement!


    # # Your Project as a Library


    Real-world libraries store collections of objects, such as books, magazines, and
    DVDs. They use addressing systems, so when you''re given an object''s address,
    you can navigate to the physical space and retrieve the object.


    Of course, no human being would be expected to know off what a book''s or DVD''s
    address is. That''s why record the association between an object''s title and
    its address and provide tools for searching these records. In old times before
    computers, libraries provided card catalogs, whose cabinets were filled with paper
    cards containing each book''s title, author, "address" (its Dewey decimal or Library
    of Congress number), and other info.


    For example, The Da Vinci Code, you would rifle through the title catalog (cards
    ordered by title) until you found the correct and. That you could use the address
    813.54 (if it''s using the Decimal system), navigate your library to find the
    shelf Where Da Vinci Code resides, and enjoy the literary and/or hate-reading
    adventure of your lifetime.


    It''s useful to imagine a similar setup in Clojure. I think of Clojure as storing
    objects (like data structures and functions) in a set of nested shelves. No human
    being know which object is stored in. We give Clojure an identifier that it uses
    to retrieve the object.


    For this to be successful, Clojure must maintain the associations between our
    identifiers and shelf addresses. It does this using namespaces. Namespaces contain
    maps between human-friendly symbols and references to shelf addresses, known as
    vars, much like a card catalog.


    Technically, namespaces are objects of type clojure.lang.Namespace, and you can
    interact with them just like you with Clojure data structures. For example, you
    can refer to the current namespace with *ns*, and you can get its name with (ns-name
    *ns*):


    ```

    (ns-name *ns*)

    > user

    ```


    When you start the REPL, for example, you''re in the user namespace (as you can
    see here). The prompt shows the current namespace using something like user>.


    The idea of a current namespace implies that you can have more than one, and indeed
    Clojure allows you to create as many namespaces as you want (although technically,
    there might be an upper limit to the number of names you can create). In Clojure
    programs, you are always in a namespace.'
