  md: '# # BUILDING AND DEVELOPING

    # WITH LEININGEN


    ![](img/f978a379512d9fe18f046e71e9900d2e_303_0.png)


    Writing software in any language involves generating *artifacts*, which are executable
    files or library packages that are meant to be deployed or shared. It also involves
    managing dependent artifacts, also called *dependencies*, by ensuring that they''re
    loaded into the project you''re building. The most popular tool among Clojurists
    is Leiningen, and this appendix will show you how to use it. You''ll also learn
    how to use Leiningen to totally enhance your development experience with `plug-ins`.


    # ## The Artifact Ecosystem


    Because Clojure is hosted on the Java Virtual Machine (JVM), Clojure artifacts
    are distributed as JAR files (covered in Chapter 12). Java already has an entire
    artifact ecosystem for handling JAR files, and Clojure uses it. *Artifact ecosystem*
    isn''t an official programming term; I use'
  merge: -1
  pgno: 303
- img_proc: true
  md: 'it to refer to the suite of tools, resources, and conventions used to identify
    and distribute artifacts. Java''s ecosystem grew up around the Maven build tool,
    and because Closure uses this ecosystem, you''ll often refer to Maven. Maven is
    a huge tool that can perform all kinds of project management tasks. Frankly, you
    don''t need to get your PhD in Mavenology to be an effective Clojurist. The only
    feature you need to know is that Maven specifies a pattern for identifying artifacts
    that Clojure projects adhere to, and it also specifies how to host these artifacts
    in Maven repositories, which are just servers that store artifacts for distribution.


    # Identification


    Maven artifacts need a group ID, an artifact ID, and a version. You can specify
    these for your project in the project.dj file. Here''s the first line of project.dj
    looks like for the clojure-noob project you created in Chapter 1:


    ```

    ```defproject clojure-noob "0.1.0-SNAPSHOT"```

    ```


    clojure-noob is both the group ID and the artifact ID of your project, and "0.1.0-SNAPSHOT"
    is its version. In general, versions are permanent; if you deploy an artifact
    with version 0.1.0 to a repository, you can''t make changes to the artifact and
    deploy it using the same version number. You''ll need to change the version number.
    (Many programmers use the Semantic Versioning system, which you can read about
    at http://semver.org/) If you want to indicate that the version is a work in progress
    and you plan to keep updating it, you can add -SNAPSHOT to your version number.


    If you want your group ID to be different from your artifact ID, you can separate
    the two with a slash, like so:


    ```

    ```defproject group-id/artifact-id "0.1.0-SNAPSHOT"```

    ```


    Often, developers will use their company name or their GitHub user-name as the
    group ID.


    # Dependencies


    Your project.dj file also includes a line that looks like this, which lists your
    project''s dependencies:


    ```

    ```:dependencies [[org.clojure/clojure "1.7.0\]]```

    ```


    If you want to use a library, add it to this dependency vector using the same
    naming schema that you use to name your project. For example, if you want to easily
    work with dates and times, you could add the clj-time library, like this:


    ```

    ```:dependencies [[org.clojure/clojure "1.7.0\]]

    [clj-time "0.9.0\]]```

    ```'
