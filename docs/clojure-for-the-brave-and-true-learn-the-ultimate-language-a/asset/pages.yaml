    When you evaluate inc in the REPL ⓵, it prints the textual representation of the
    function that inc refers to. Next, you quote inc at ➁, so the result is the symbol
    inc. Then, you evaluate a familiar map application at ③ and get a familiar result.
    After that, you quote the entire list data structure resulting in an unvaluated
    list that includes the map symbol, the inc symbol, and a vector.


    Now that you know about Closure''s organization system, let''s look at how to
    use it.


    # Storing Objects with def


    The primary tool in Closure for storing objects is def. Other tools like defn
    use under the hood. Here''s an example of def in action:


