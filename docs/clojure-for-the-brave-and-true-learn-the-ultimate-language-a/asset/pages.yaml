    \ like an email address.\\]}. Here's a function called error-messages-for that\
    \ applies validations to a single value:\n\n```\n(defn error-messages-for\n\"\
    Return a seq of error messages\"\n[to-validate message-validator-pairs]\nmap first\
    \ (filter #(not (second %2) to-validate))\n(partition 2 message-validator-pairs)))\n\
    ```\n\nThe first argument, to-validate, is the field you want to validate. The\
    \ second argument, message-validator-pairs, should be a seq with an number of\
    \ elements. This seq gets grouped into pairs (partition 2 message-validator-pairs).\
    \ The first element of the pair should be an error message, and the second element\
    \ of the pair should be a function (just like"
