  md: "that scope, you bind great-baby-name to \"Bloodthunder\". Once Clojure finishes\
    \ evaluating the expression, you're back in the global scope, and great-baby-name\
    \ evaluates to \"Rosanthy\" once again.\n\nClojure lets you work around this apparent\
    \ limitation with recursion. The following example shows the general approach\
    \ to recursive solving:\n\n```\n(defun sum\n  ([vals] sum 0)\n  ([vals] accumulating-total)\n\
    \  (if (empty vals)\n      accumulating-total\n      (sum (rest vals) accumulating-total))))\n\
    ```\n\nThis function takes two arguments, a collection of (vals) and an accumulator\
    \ (accumulating-total), and it uses arity overloading (covered in Chapter 3) to\
    \ provide a default value of 0 for accumulating-total I\n\nLike recursive solutions,\
    \ this function checks the argument's processing against a base case. In this\
    \ case, we check whether vals is empty If it is, we know we've processed all the\
    \ elements in the collection, so we return accumulating-total.\n\nIf vals isn't\
    \ empty, it means we're still working through the sequence, so we recursively\
    \ call sum passing it two arguments: the tail of vals with (rest vals) and the\
    \ sum of the first element of vals (+ first vals) accumulating-total). In this\
    \ way, we build up accumulating-total and at the same time reduce vals until it\
    \ reaches the base case of an empty collection.\n\nHere's what recursive function\
    \ might look like if we separate\n\n```\n[sum [39 5 1]]; single-arity body calls\
    \ two-arity body\n[sum [39 5 1] 0]\n[sum [5 1] 39]\n[sum [1] 44]\n[sum [45]];\
    \ base case is reached, return accumulating-total\n=> 45\n```\n\nEach recursive\
    \ call to sum creates a new scope where vals and accumulating-total are bound\
    \ to different values, without needing to alter the values originally passed to\
    \ the function or perform internal mutation. As you can see, you can get fine\
    \ without mutation.\n\nNote that you should generally use recur when doing recursion\
