  md: 'In general, Clojure resolves a symbol by:


    +   Looking up whether the symbol names a special form. If it doesn’t . . .

    Looking up whether the symbol corresponds to a local binding. If it doesn’t .
    . .

    Trying to find a namespace mapping introduced by def. If it doesn’t . . .

    Throwing an exception


    Let’s first look at a symbol resolving to a special form. Special forms, if it,
    are always used in the context of an operation; they’re always the first element
    in a list:


    ```

    (if true :a :b)

    => a

    ```


    In this case, if it is a special form and it’s being used as an operator. If you
    try to refer to a special form outside of this context, you’ll get an exception:


    ```

    if

    => CompilerException java.lang.RuntimeException: Unable to resolve symbol:

    if this context, compiling: (NO_SOURCE_PATH:0:0)

    ```


    Next, let’s evaluate some local bindings. A local binding is any association between
    a symbol and a value that wasn’t created by def. In this context, the symbol x
    is bound to symbol 5 using local. When the evaluator resolves x, it resolves the
    symbol x to the value 5:


    ```

    (let [x 5]

    (+ x 3))

    => 8

    ```


    Now if we create a namespace mapping of x to 15, Clojure resolves it accordingly:


    ```

    (def x 15)

    (+ x 3)

    => 8

    ```


    In the next example, x is mapped to 15, but we introduce a local binding of x
    to 5 using local. So x is resolved to 5:


    ```

    (def x 15)

    (let [x 5]

    (+ x 3))

    => 8

    ```'
