    \ the function analysis is:\n\n```\n(def analyze-file\n  [filename]\n  (analysis\
    \ (slurp filename)))\n```\n\n```\n(def analysis\n  [text]\n  (str \"Character\
    \ count: \" (count text)))\n```\n\nWhen using a referentially transparent function,\
    \ you never have to consider what possible external conditions could affect the\
    \ return value of the function. This is especially important if your function\
    \ is used multiple places or if it's nested deeply in a chain of function calls.\
    \ In both cases, you can rest knowing that changes to external conditions won't\
    \ cause your code to break.\n\nAnother way to think about this as a function is\
    \ that reality is largely referentially transparent. If you think of gravity as\
    \ a function, then gravitational force is the return value of calling that function\
    \ on two objects. Therefore, the next time you're in a programming interview,\
    \ you can demonstrate your functional programming knowledge by knocking everything\
    \ off your interviewer's desk. (This also demonstrates that you know how to apply\
    \ a function over a connection.)\n\n# Pure Functions Have No Side Effects\n\n\
    To perform a side effect is to change the association between a name and value\
    \ within a given scope. Here is an example in JavaScript:\n\n```\nvar haplessObject\
    \ = {\n  emotion: \"Carefree!\"\n};\n```\n\n```\nvar evilMutator = function(object){\n\
    \  object.emotion = \"So emo :('\";\n}\n```"
