  md: "# Anonymous Functions\n\nIn Clojure, functions don't need to have names. In\
    \ fact, you'll use anonymous functions all the time. How mysterious! You create\
    \ anonymous functions in two ways. The first is to use the fn form:\n\n```\n(fn\
    \ [param-list]\n  function body)\n```\n\nLooks a lot like defn, doesn't it? Let's\
    \ try a couple of examples:\n\n```\n(map fn [name] (str \"Hi, \" name)\n  [\"\
    Darth Vader\" \"Mr. Magoo\"])\n;=> (\"Hi, Darth Vader\" \"Hi, Mr. Magoo\")\n```\n\
    \n```\n((fn [x] (* 3)) 8)\n;=> 24\n```\n\nYou can treat fn nearly identically\
    \ to the way you treat defn. The parameter lists and function bodies work exactly\
    \ the same. You can use argument destructuring, rest parameters, and so on. You\
    \ could even associate your anonymous function with a name, which shouldn't come\
    \ as a surprise (if it comes as a surprise, then ... Surprise!)\n\n```\n(def my-special-multiplier\
    \ (fn [x] (* 3)))\n(my-special-multiplier 12)\n;=> 36\n```\n\nClojure also offers\
    \ another, more compact way to create anonymous functions. Here's what an anonymous\
    \ function looks like:\n\n```\n#(* % 3)\n```\n\nWhoa, that looks weird. Go ahead\
    \ and apply that weird-looking function:\n\n```\n((#(* % 3) 8)\n;=> 24\n```\n\n\
    Here's an example of passing an anonymous function as an argument to map:\n\n\
    ```\n(map #(str \"Hi, \" %)\n  [\"Darth Vader\" \"Mr. Magoo\"])\n;=> (\"Hi, Darth\
    \ Vader\" \"Hi, Mr. Magoo\")\n```\n\nThis strange-looking style of writing anonymous\
    \ functions is possible by a feature called reader macros. You'll learn all about\
    \ those in Chapter 7. Right now, it's okay to learn how to use these anonymous\
    \ functions."
