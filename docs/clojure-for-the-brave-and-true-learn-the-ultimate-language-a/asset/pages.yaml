  md: '# Stateless Concurrency and Parallelism with pmap


    So far, this chapter has focused on tools that are designed to mitigate the risks
    inherent in concurrent programming. You''ve learned about the dangers born of
    shared access to mutable state and how Clojure implements reconceptualization
    of state that helps you write programs safely.


    Often, you''ll want to concurrent-ify tasks that are completely independent of
    each other. There is no shared access to a mutable state; therefore, there are
    no risks to running the tasks concurrently and you don''t have to bother with
    using any of the tools I''ve just been blabbing about.


    As turns out, Clojure makes it easy for you to write code for achieving stateless
    concurrency. In this section, you''ll learn about pmap, which gives you concurrency
    performance benefits virtually for free.


    map is a perfect candidate for parallelization: when you use it, all you''re doing
    is deriving a new collection from an existing collection by applying a function
    to each element of the existing collection. There''s no need to maintain state;
    each application is completely independent. Clojure makes it easy to perform a
    parallel map with pmap. With pmap, Clojure handles the running of each application
    of the mapping function on a separate thread.


    To compare pmap and pmap, we need a lot of example data, and to generate this
    data, we''ll use the repeated function. This function takes another function as
    an argument and returns a lazy sequence. The elements of the lazy sequence are
    generated by calling the passed function, like this:


    ```

    (def always-1

    []

    1)

    (take 5 (repeatedly always-1))

    => (1 1 1 1 1)

    ```


    Here''s how you''d create a lazy seq of random numbers between 0 and 9:


    ```

    (take 5 (repeatedly (partial-int 10))

    => (1 5 0 3 4)

    ```


    Let''s use repeated to create example data that consists of a sequence of 3,000
    random strings, each 7,000 characters long. We''ll compare map and pmap by using
    them to run Clojure.string/lowercase the orc-names sequence created here:


    ```

    (def alphabet-length 26)

    ```


    ```

    ; Vector of chars, A-Z

    (def letters (mapv (comp str char (partial + 65)) (range alphabet-length)))

    ```'
