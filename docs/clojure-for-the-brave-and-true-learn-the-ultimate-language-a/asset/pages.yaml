  md: '# Summary


    In this chapter, you learned about Clojure''s evaluation process. First, the reader
    transforms text into Clojure data structures. Next, the macro expander transforms
    those data structures into macros, converting your custom syntax into syntactically
    valid data structures. Finally, those data structures get sent to the evaluator.
    The evaluator processes data structures based on their type: symbols are resolved
    to their referents; lists result in function, macro, or special form calls; and
    everything else evaluates to itself.


    The coolest thing about this process is that it allows you to Clojure to expand
    its own syntax. This process is made easier because Clojure is homonic: its text
    represents data structures, and those data structures represent abstract syntax
    trees, allowing you to more easily reason about how to construct syntax-expanding
    macros.


    With all these new concepts in your brainacles, you''re now ready to blow up on
    purpose, just like I promised. The next chapter will teach you everything you
    need to know about writing macros. Hold on to your socks or they''re liable to
    get knocked off!


    # Exercises


    These exercises focus on reading and evaluation. Chapter 8 has exercises for writing
    macros.


    +   1. Use the 1st function, quoting, and read-string to create a list that, when
    evaluated, prints your first name and your favorite sci-fi movie.

    2. Create an infix function that takes a list like (1 + 3 * 4 - 5) and transforms
    it into the lists that Clojure needs in order to correctly evaluate the expression
    using operator precedence rules.'
