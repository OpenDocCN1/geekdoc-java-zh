  md: 'But first, I''ll briefly introduce Clojure. Next, I''ll cover Leining, the
    de facto standard build tool for Clojure. By the end of the chapter, you''ll know
    how to do the following:


    +   - Create a new Clojure project with Leining

    - Build the project to create an executable JAR file

    - Execute the JAR file

    - Execute code in a Clojure REPL


    # # First Things: What is Clojure?


    Clojure was forged in a mythic volcano by Rich Hickey. Using an alloy of Lisp,
    functional programming, and a lock of his own epic hair, he crafted a language
    that delightful yet powerful. Its Lisp heritage gives you the power to write code
    more expressively than is possible in most non-Lisp languages, and its distinct
    take on functional programming will sharpen your thinking as a programmer. Plus,
    Clojure gives you better tools for tackling complex domains (like concurrent programming)
    that are traditionally known to drive developers into years of therapy.


    When talking about Clojure, it''s important to keep in mind the distinction between
    the Clojure language and the Clojure compiler. The Clojure language is a Lisp
    dialect with a functional emphasis whose syntax and semantics are independent
    of any implementation. The compiler is an executable JAR file, `clojure.jar`,
    which takes code written in the Clojure language and compiles it to Java Virtual
    Machine (JVM) bytecode. You''ll see Clojure used to refer to both the language
    and the compiler, which can be confusing if you''re not aware that they''re separate
    things. Now that you''re aware, you''ll be fine.


    This distinction is necessary because, unlike most programming languages like
    Ruby, Python, C, and a bazillion others, Clojure is a hosted language. Clojure
    programs are executed within a JVM and on the JVM for core features like threading
    and garbage collection. Clojure also targets JavaScript and the Microsoft Common
    Language Runtime (CLR), but this book only focuses on the JVM implementation.


    We''ll explore the relationship between Clojure and the JVM later on, but for
    the main concepts you need to understand these are:


    +   - JVM processes execute Java bytecode.

    - Usually, the Java Compiler produces Java bytecode from Java source code.

    - JAR files are collections of Java bytecode.

    - Clojure programs are usually distributed as JAR files.

    - The Java program `clojure.jar` reads Clojure source code and produces Java bytecode.

    - That bytecode is then executed by the same JVM process already running `clojure.jar`.'
  merge: -1
