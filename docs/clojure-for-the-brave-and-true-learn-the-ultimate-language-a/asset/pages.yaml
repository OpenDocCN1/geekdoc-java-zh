    \ map of error messages.\n\n# if-valid\n\nWith our validation code in place, we\
    \ can now validate records to our hearts' content! Most often, validation will\
    \ look something like this:\n\n```\n(let [errors validate order-details order-details-validations)]\n\
    (if (empty errors)\n  (println :success)\n  (println :failure errors))\n```\n\n\
    The pattern is to do the following:\n\n+   1. Validate a record and bind the result\
    \ to errors\n2. Check whether there are any errors\n3. If there are, the success\
    \ thing, here is (println :success)\n4. Otherwise, do the failure thing, here\
    \ (println :failure errors)"
