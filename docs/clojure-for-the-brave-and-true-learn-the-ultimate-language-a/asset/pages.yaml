    conceptual organization, of two layers. The top layer consists of the functions
    for handling user interaction. These functions produce all of the program''s side
    effects, printing out the board and presenting prompts for player interaction.
    The functions in the lower layer use the functions in the bottom layer to create
    a new board, make moves, and create a textual representation, but the functions
