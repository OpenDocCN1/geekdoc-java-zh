  md: "![](img/f978a379512d9fe18f046e71e9900d2e_167_0.png)\n\n**Figure 6-1:** Flipping,\
    \ translating, and scaling latitude coordinates to make an SVG image.\n\nHonestly,\
    \ this is all completely arbitrary, and it's no longer directly related to code\
    \ ordering, but it I think you'll have a good time going through the code! Make\
    \ your `svg.clj` file map Listing 6-4:\n\n```\n```clojure\n(ns-divine-cheese-code.visualization.svg\n\
    (:require clojure :string [a as s])\n(:exclude [min max]))\n```\n```\n\n+   -\
    \ `defn comparator-over-maps\n  [comparison-fn ks]\n  (fn maps)\n  (zipmap ks)\n\
    \    (map (fn [k] (apply comparison-fn map k)) ks)))`\n\n# **Listing 6-4:** Constructing\
    \ map functions\n\nYou define the `comparator-over-maps` function at ❶. This is\
    \ probably the trickiest bit, so bear with me. `comparator-over-maps` is a function\
    \ that returns a function. The returned function compares the values for the keys\
    \ provided by the ks parameter using the supplied comparison function, `comparison-fn`.\
    \ You use `comparator-over-maps` to construct the min and max functions ❷ which\
    \ you'll use to find the top-left and bottom-right corners of our drawing. Here's\
    \ in action:\n\n```\n```clojure\n(min {:a 1 b 3} {:a 5 :b 0})\n=> {:a 1 :b 0})\n\
