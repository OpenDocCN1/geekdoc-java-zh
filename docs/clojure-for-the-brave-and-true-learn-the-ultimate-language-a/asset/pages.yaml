- img_proc: true
  md: 'Now we have two windows: core.clj file is open on the left, and the REPL is
    running on the right. If you''ve never seen Emacs split in half like this, don''t
    worry! I''ll talk about how Emacs splits windows in a second. In the meantime,
    try evaluating code in the REPL. Type in the following bold lines. The result
    that you would see printed in the REPL when you press ENTER is after each line
    of code. Don''t worry about the code at this time; I''ll cover these functions
    in the next chapter.


    ```

    + 1 2 3 4

    ; => 10

    (map inc [1 2 3 4])

    ; => (2 3 4 5)

    (reduce + [5 6 100])

    ; => 111

    ```


    Pretty nifty! You can use this REPL just as you used rein repl in the first chapter.
    You can also do a whole lot more, before I go into that, I''ll explain how to
    work with split-screen Emacs.


    # Interlude: Emacs Windows and Frames


    Let''s take a quick detour to talk about how Emacs handles frames and windows,
    and to go over some useful window-related key bindings. Feel free to skip this
    if you''re already familiar with Emacs windows.


    Emacs was invented, like, 1802 or something, so it uses terminology slightly different
    from what you would normally refer as a window, Emacs calls a frame, and the frame
    can be split into multiple windows. Splitting into multiple windows allows you
