  md: 'This shows that macros are an integral part of Clojure development—they''re
    even used to provide fundamental operations. Macros aren''t reserved for exotic
    special cases; you should think of macro writing as just another tool in your
    satchel. As you learn to write your own macros, you''ll see how they allow you
    to extend the language even further so that it fits the shape of your particular
    problem domain.


    # Anatomy of a Macro


    Macro definitions look much like function definitions. They have a name, an optional
    document string, an argument list, and a body. The body will almost always return
    a list. This makes sense because macros are a way of transforming a data structure
    into a form Clojure can evaluate, and Clojure lists to represent function calls,
    special form calls, and macro calls. You can use any function, macro, or special
    form within the macro body, and you can call macros just like you would a function
    or special form.


    As an example, here''s our old friend the infix macro:


    ```

    (defmacro infix

    "Use this macro when you pine for the notation of your childhood"

    [infix]

    (list (second infix) (first infix) (last infix))

    ```


    This rearranges a list into the correct order for infix notation. Here''s an example:


    ```

    (infix (1 + 1))

    ; 2

    ```


    One difference between functions and macros is that function arguments are fully
    evaluated before they''re passed to the function, whereas macros receive arguments
    as unevaluated data. You can see this in the example. If tried evaluating (1 +
    1) on its own, you would get an exception. However, because you''re making a macro
    call, the unevaluated list (1 + 1) is passed to infix. Then the macro can use
    first, second, and last rearrange the list so Clojure evaluate it:


    ```

    (macroexpand ''(infix (1 + 1)))

    ; => (1 + 1)

    ```


    By expanding the macro, you can see that restructures (1 + 1) into (1 + 1). Handy!

    You can use argument restructuring in macro definitions, just like you with functions:


    ```

    (defmacro infix-2

    [[operand1 op operand2]]

    (list op operand1 operand2))

    ```'
