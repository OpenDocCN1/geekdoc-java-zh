  md: '# Using Emacs with Clojure


    Next, I''ll explain how to use Emacs to efficiently develop a Clojure application.
    You''ll learn how to start a REPL process that''s connected to Emacs and how to
    work with Emacs windows. Then I''ll cover a cornucopia of useful bindings for
    evaluating expressions, compiling files, and performing other handy tasks. Finally,
    I''ll show you how to handle Clojure errors and introduce some features of Paredit,
    an optional minor mode, which is useful for writing and editing code in Lisp-style
    languages.


    If you want to start digging in Clojure code, please skip ahead! You can always
    return later.


    # Fire Up Your REPL!


    As learned in Chapter 1, a REPL allows you to interactively write and run Clojure
    code. The REPL is a running Clojure program that gives you a prompt and then reads
    your input, evaluates it, prints the result, and loops back to the prompt. In
    Chapter 1, you started the REPL in a terminal window with rein repl. In this section,
    you''ll start a REPL directly in Emacs.


    To connect Emacs to a REPL, you''ll use the Emacs package CIDER, available at
    https://github.com/clojure-emacs/cidr/. If you followed the configuration instructions
    earlier in this chapter, you should already have it installed, but you can also
    install it by running M-x package-install, entering cider, and pressing ENTER.


    CIDER allows you to start a REPL within Emacs and provides you with bindings that
    allow you to interact with the REPL efficiently. Go ahead and start a REPL session.
    Using Emacs, open the file cljure-noob/src/clojure-noob/core.clj, which you created
    in Chapter 1. Next, use M-x cider-jack-in. This starts the REPL and creates a
    new buffer where you can interact with it. After a short wait (it should be less
    than 2-8).


    ![](img/f978a379512d9fe18f046e71e9900d2e_49_0.png)


    Figure 2-8: What your Emacs should look like after running M-x cider-jack-in'
  merge: -1
