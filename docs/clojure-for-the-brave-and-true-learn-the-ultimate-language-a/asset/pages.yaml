    of function calls.


    CIDER''s stack trace can be difficult to decipher when you''re just starting,
    but after a while you''ll learn to get useful information from them. CIDER gives
    you a hand by allowing you to filter stack traces, reduces noise so you can zero
    in on the cause of your exception. Line 2 of the *cider-error buffer has the Clojure,
    Java, REPL, Tooling, Duplicates, and All. You can click each option to activate
    that filter. You can also click stack trace line to jump to the corresponding
    source code.


    Here''s how to close the stack trace in the left window:


    +   1. Use **C-x** to switch to the window.

    2. Press **q** to close the stack trace and go back to CIDER.


    If you want to view the error again, you can switch to the **\*cider-error***
    buffer. You can also get error messages when trying to compile. For this, go to
    the **core.clj** buffer, write some buggy code, and compile:


    +   1. Add **(map)** to the end.

    2. Use **C-c C-k** to compile.


    You should see a \*cider-error\* buffer similar to the one you saw earlier. Again,
    press **q** to close the stack trace.


    # Paredit


    While writing code in the Clojure buffer, you may have noticed some unexpected
    things happening. For example, every time you type a left parenthesis, a right
    parenthesis immediately gets inserted. This occurs thanks to paredit-mode, a minor
    mode that turns Lisp''s fusion of parentheses from a liability into an asset.
    Paredit ensures that all parentheses, double quotes, and brackets are closed,
    relieving you of that odious burden.'
