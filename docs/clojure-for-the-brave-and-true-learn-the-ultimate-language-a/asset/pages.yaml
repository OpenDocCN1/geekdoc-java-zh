    # Additional Resources


    Clojure.core.async library was largely inspired by Go''s concurrency model, which
    is based on the work of Tony Hoare in Communicating Sequential Processes and is
    available at http://www.usingcsp.com/.


    Rob Pike, co-creator of Go, has a good talk on concurrency, which is available
    at https://www.youtube.com/watch?v=f6kdp27TYZs.


    ClojureScript, also known as the best thing to happen to the browser, uses core.async.
    No more callback hell! You can learn about ClojureScript at https://github.com/clojure/clojurescript.


    Finally, check out the API docs at http://clojure.github.io/core.async/.


    # Summary


    In this chapter, you learned how core.async allows you to create current processes
    that respond to the put and take communication events on channels. You learned
    how to use go and thread to create processes that wait for communication events
    by parking and blocking. You also learned how to create process pipelines by making
    the out channel of one process the in channel of another, and how this allows
    you to write code that''s way more intelligible than nested callbacks. Finally,
    you mediated on whether or not you''re just a fancy hot dog vending machine.'
