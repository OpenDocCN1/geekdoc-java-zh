  md: '# Building the Cloj Project


    Using leining is great for trying out your code, but what if you want to share

    work with people who don''t have Leining installed? To do that, you

    create a stand-alone file that anyone with Java installed (which is basi-

    very) can execute. To create the file, run this:


    lein uberjar


    This command creates the file target/uberjar/clojure-noob-0.1.0

    -SNAPSHOT-standalone.jar. You can make Java execute by running this:


    ```

    java -jar target/uberjar/clojure-noob-0.1.0-SNAPSHOT-standalone.jar

    ```


    Look at that! The file target/uberjar/clojure-noob-0.1.0-SNAPSHOT

    -standalone.jar is your new, award-winning Clojure project, which you can

    distribute and run on almost any platform.


    You now have all the basic details you need to build, run, and (very)

    basic Clojure programs. In later chapters, you''ll learn more details

    about Leining is doing when you run the preceding commands,

    gaining a complete understanding of Clojure''s relationship to the JVM

    and how you can run production code.


    Before we move on to Chapter 2 and discuss the wonder and glory of

    Emacs, let''s go over another important tool: the REPL.


    # Using the REPL


    The REPL is a tool for experimenting with code. It allows you to interact

    with a running program and quickly try out ideas. It does this by present-

    ing with a prompt where you can enter code. It reads your input,

    evaluates it, prints the result, presenting you with a prompt.


    This process enables a quick feedback cycle that isn''t possible in most

    other languages. I strongly recommend that you use it frequently because

    You''ll be able to quickly check your understanding of Clojure as you learn.

    Besides, REPL development is an essential part of the Lisp experience,

    and you''d be missing out if you didn''t use it.


    To start a REPL, run this:


    lein repl


    The output should look like this:


    ```

    nREPL server started on port 28925

    REPL-y 0.1.10

    Clojure 1.7.0

    Exit: Control+D or exit) or (quit)

    Commands: (user/help)

    Docs: (doc function-name-here)

    (find-doc "part-of-name-here")

    ```'
