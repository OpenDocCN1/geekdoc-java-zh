    # FUNCTIONAL PROGRAMMING


    ![](img/f978a379512d9fe18f046e71e9900d2e_123_0.png)


    So far, you''ve focused on becoming familiar with the tools that Clojure provides:
    immutable data structures, functions, abstractions, and so on. In this chapter,
