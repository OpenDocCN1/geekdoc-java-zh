  md: 'is done. This is further illustrated in the transaction code: after it prints

    t first time, it increments the counter again from 1 to 2 and prints the

    result, 2.


    The transaction will try to commit its changes only when it ends. The

    commit works similarly to the compare-and-set semantics of atoms. Each

    ref is checked to see whether it''s changed since you first tried to alter it.

    If any of the refs have changed, then none of the refs is updated and the

    transaction is retried. For example, if Transaction A and Transaction B are

    b attempted at the same time and events occur in the following order,

    Transaction A will be retrieved:


    +   1. Transaction A: alter gnome

    2. Transaction B: alter gnome

    3. Transaction B: alter dryer

    4. Transaction B: alter dryer

    5. Transaction B: commit—successfully updates gnome and dryer

    6. Transaction A: alter dryer

    7. Transaction A: commit—fails because dryer and gnome have changed;

    retries.


    And you have it! Safe, easy, concurrent coordination of state

    changes. But that''s not all! Refs have one more trick to up their suspiciously

    long sleeve: commit.


    # commit


    commit allows you to update a ref''s state within a transaction, just like alter.

    However, its behavior at commit time is completely different. Here''s how

    beaves:


    +   1. Reach outside the transaction and read the ref''s current state.

    2. Compare the current state to the ref started with the

    transaction.

    3. If the two differ, make the transaction retry.

    4. Otherwise, commit the altered ref state.


    commit, on the other hand, behaves like this at commit time:


    +   1. Reach outside the transaction and read the ref''s current state.

    2. Run the commit function again using the current state.

    3. Commit the result.


    As you can, commit doesn''t force a transaction retry. This can

    help improve performance, but it''s important that you only use commit

    when you''re sure that it''s not possible for your refs to end up in an invalid

    state. Let''s look at examples of safe and unsafe uses of commit.'
