  md: 'Parking frees up the thread so it can keep doing work. Let''s say you have
    one thread and two processes, Process A and Process B. Process A is running on
    the thread and waits for a put or take. Clojure moves A off the thread and moves
    Process B onto the thread. If Process B starts waiting and Process A''s put or
    take has finished, then Clojure will move Process B off the thread and put A back
    on it. Parking allows the instructions from multiple processes to interleave on
    a single thread, similar to the way using multiple threads allows interleaving
    on a single core. The implementation of parking isn''t important; suffice to say
    that it''s only possible within blocks, and it''s only possible when you use >
    and <, or parking put and parking taking. !! and !! are blocking put and blocking
    take.


    # thread


    There are definitely times you''ll want to use blocking instead of parking, like
    when your process will take a long time before putting or taking, and for those
    occasions you should use thread:


    ```

    (thread (! echo-chan))

    (! echo-chan "mustard")

    ; true

    ; mustard

    ```


    thread acts almost exactly future: it creates a new thread and executes a process
    on that thread. Unlike future, instead of returning an object that you can dereference,
    thread returns a channel. When thread stops, the process''s return value is put
    on the channel that thread returns:


    ```

    [let t (thread "chili")

    (!! t)

    ; "chili"

    ```


    In this case, the process waits for any events; instead, it stops immediately.
    Its return value is "chili", gets put on the channel that bound to t. We take
    from it, returning "chili".


    The reason you should use thread instead of a block when you''re performing a
    long-running task is so you don''t clog your thread pool. Imagine you''re running
    four processes that download humongous files, save them, and then put the file
    paths on a channel. While the processes are downloading and saving these files,
    Clojure can''t park their threads. It can park the thread only at the last step,
    when the process puts the files'' paths on a channel. Therefore, if your thread
    pool has four threads, all four threads will be used for downloading, and no other
    process will be allowed to run until one of the downloads finishes.


    go, thread, chan, !!, and !! are the core tools you''ll use for creating and communicating
    with processes. Both put and take will cause a process to wait until its complement
    is performed on the given channel. go allows you to use the parking variants of
    put and take, which could improve performance.'
