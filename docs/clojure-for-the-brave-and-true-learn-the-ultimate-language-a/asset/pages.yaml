  md: '# The Reader


    The reader converts the textual source code you save in a file or enter in the
    REPL into Clojure data structures. It''s like a translator between the human world
    of Unicode characters and Clojure''s world of lists, vectors, maps, symbols, and
    other data structures. In this section, you''ll interact directly with the reader
    and learn how a handy feature, the reader macro, lets you write code more succinctly.


    # Reading


    To understand reading, let''s first take a close look at how Clojure handles the
    text type in the REPL. First, the REPL prompts you for text:


    ```

    user=>

    ```


    Then you enter a bit of text. Maybe something like this:


    ```

    user=> (str To understand what recursion is, " you must first understand recursion.")

    ```


    That is really just a sequence of Unicode characters, but it means to represent
    a combination of Clojure data structures. This textual representation of data
    structures is called a reader form. In this example, the form represents a list
    data structure that contains three forms: the str symbol and twos. Once you type
    those characters into the prompt and press ENTER (remember REPL stands for read-eval-print-loop),
    Clojure reads the stream of characters and internally produces the corresponding
    data structures. It then evaluates the data structures and prints the textual
    representation of the result:


    > "To understand what recursion is, you must first understand recursion."


    Reading and evaluation are discrete processes that you can perform independently.
    One way to interact with the reader directly is by using the read-string function.
    read-string takes a string as an argument and processes it using Clojure''s reader,
    returning a data structure:


    ```

    (read-string ("+ 1 2"))

    ;=> (+ 2)

    ```


    ```

    (list (read-string ("+ 1 2")) :zagglewag)

    ;=> true

    ```


    ```

    (conj (read-string ("+ 1 2")) :zagglewag)

    ;=> (:zagglewag + 2)

    ```


    In the first example, read-string reads the string representation of a list containing
    a plus symbol and the numbers 1 and 2. The return value is an actual list, as
    proven by the second example. The example uses conj to'
