    ```


    Of course, your program has to have some side effects. It writes to a disk, which
    changes the association between a filename and a collection of disk sectors; it
    changes the RGB values of your monitor''s pixels; and so on. Otherwise, there''d
    be no point in running it.


    Side effects are potentially harmful, however, they introduce uncertainty about
    what the names in your code are referring to. This leads to situations where it''s
    very difficult to trace why and how a name came to be associated with a value,
    which makes it hard to debug the program. When you call a function that doesn''t
    have side effects, you only have to consider the relationship between the input
    and the output. You don''t have to worry about other changes that could be rippling
    through your system.


    Functions with side effects, on the other hand, place more of a burden on your
    mind: now you have to worry about how the world is affected when you call the
    function. Not only that, but every function that depends on a side-effect function
    gets worried by it; too, becomes another component that requires extra care and
    thought as you build your program.


    If you have any significant experience with a language like Ruby or JavaScript,
    you''ve probably run into this problem. As an object gets around, its attributes
    somehow change, and you can''t figure out why. You have to buy a new computer
    because you''ve choked yours out the window. If you''ve read anything about object-oriented
    design, you know that a lot of writing has been devoted to strategies for managing
    state and reducing side effects for this reason.


    For all these reasons, it''s a good idea to look for ways to limit the use of
    side effects in your code. Lucky for you, Closure makes your job easier by going
    to lengths to limit side effects—all of core data structures are immutable. You
    cannot change them in place, no matter how you try! However, if you''re unfamiliar
    with immutable data structures, you might feel like your favorite tool has been
    taken from you. How can you do without any side effects? Well, that''s what the
    next section is all about! How about that segue, eh? Eh?


    # Living with Immutable Data Structures


    Immutable data structures ensure that your code won''t have side effects. As you
    now know with all your heart, this is a good thing. But how do you get anything
    done without side effects?


