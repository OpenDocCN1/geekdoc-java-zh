  md: "# The ns Macro\n\nNow it's time to look at the ns macro. The tools covered\
    \ so far—in-ns, refer,\nalias, require, and use—are most used when you're playing\
    \ in the\nREPL. In your source code, you'll typically use the ns macro because\n\
    allows you to use the tools described so succinctly and provides others\nuseful\
    \ functionality. In this section, you'll learn about how one ns can call\nincorporate\
    \ require, use, in-ns, and refer.\n\nOne useful task ns is refer the clojure.core\
    \ namespace by default.\nThat's why you can call println from within the-divine-cheese-code.core\
    \ with-\nout using the fully qualified name, clojure.core/println.\n\nYou can\
    \ control what gets referred from clojure-core with :refer-clojure,\nwhich takes\
    \ the same options as refer:\n\n```\n(ns-divine-cheese-code.core\n (:refer-clojure\
    \ :exclude [println]))\n```\n\nIf called at this beginning of clojure_divine_cheese_code.clj,\
    \ it would\nbreak your code, forcing you to use clojure.core/println within the\
    \ -main\nfunction.\n\nWithin ns, the form (:refer-clojure) is a reference. This\
    \ might look\nweird to you. This is reference a function call? A macro? What is\
    \ it? You'll\nlearn more about the underlying machinery in Chapter 7. For now,\
    \ you just\nneed to understand how each reference maps to function calls. For\
    \ example,\nt preceding code is equivalent to this:\n\n```\n(in-ns 'the-divine-cheese-code.core\n\
    \ (:refer clojure.core :exclude [println]))\n```\n\nThere are six possible kinds\
    \ of references within ns:\n\n+   * (:refer-clojure)\n* (:require)\n* (:use)\n\
    * (:import)\n* (:load)\n* (:gen-class)\n\n(:import and :gen-class) are covered\
    \ in Chapter 12. I won't cover (:load)\nbecause it is seldom used.\n(:require)\
    \ works a lot like the require function. For example, this:\n\n```\n(ns-divine-cheese-code.core\n\
    \ (:require the-divine-cheese-code.visualization.svg))\n```\n\nis equivalent to\
    \ this:\n\n```\n(in-ns 'the-divine-cheese-code.core\n (:require 'the-divine-cheese-code.visualization.svg))\n\
    ```"
