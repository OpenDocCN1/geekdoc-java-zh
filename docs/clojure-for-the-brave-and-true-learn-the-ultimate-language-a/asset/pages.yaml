  md: '# Chapter 6: Organizing Your Project: A Librarian''s Tale


    This chapter explains what namespaces are and how to use them to organize your
    code. I don''t want to give away too much, but it also involves an ancestral chief
    thief.


    # Chapter 7: Clojure Alchemy: Reading, Evaluation, and Macros


    In this chapter, we''ll take a step back and describe how Clojure runs your code.
    This will give you the conceptual structure you need to truly understand how Clojure
    works and how it''s different from other, non-Lisp languages. With this structure
    in place, I will introduce the macro, one of the most powerful tools in existence.


    # Chapter 8: Writing Macros


    This chapter thoroughly examines how to write macros, starting with basic examples
    and advancing in complexity. You''ll close by donning your make-believe cap, pretending
    that you run an online potion store and using macros to validate customer orders.


    # Part III: Advanced Topics


    These chapters cover Clojure''s extra-fun topics: concurrency, Java interop, and
    abstraction. Although you can write programs without understanding these tools
    and concepts, they''re intellectually rewarding and give you tremendous power
    as a programmer. One of the reasons people say that learning Clojure makes you
    a better programmer is that it makes the concepts in these chapters easy to understand
    and practical to use.


    # Chapter 9: The Sacred Art of Concurrent and Parallel Programming


    In this chapter, you''ll learn what concurrency and parallelism are and why they
    matter. You''ll learn about the challenges you''ll face when writing parallel
    programs and how Clojure''s design helps to mitigate them. You''ll use futures,
    delays, and promises to safely write parallel programs.


    # Chapter 10: Clojure Metaphysics: Atoms, Refs, Vars, and Cuddle Zombies


    This chapter goes into great detail about Clojure''s approach to managing state
    and how simplifies concurrent programming. You''ll learn how to use atoms, refs,
    vars, three constructs for managing state, and you''ll learn how to do stateless
    parallel computation with pmap.


    # Chapter 11: Mastering Concurrent Processes with core.async


    In this chapter, you''ll ponder the idea that the universe is a hot dog vending
    machine. By which I mean you''ll learn how to model systems of independently running
    processes that communicate with each other over channels using the core.async
    library.'
