    4. If it is, swap! updates the atom to refer to the result of step 2.


    5. If it isn''t, swap! retries, going through the process again with step 1.


    This process ensures that no swaps will ever get lost.

    One detail to note about swap! is that atom updates happen synchronously; they
    will block their thread. For example, if your function calls thread/sleep 1000
    for some reason, the thread will block for at least a second when swap completes.


    Sometimes you''ll want to update an atom without checking its current value. For
    example, you might develop a serum that sets a cuddle zombie''s hunger level and
    deterioration back to zero. For those cases, you can use the reset!:


    ```

    (reset! fred {:cuddle-hunger-level 0\n:percent-deteriorated 0})

    ```


    And that covers all the core functionality of atoms! To recap: atoms implement
    Cloj''s concept of state. They allow you to encode a series of immutable values
    with an identity. They offer a solution to the reference cell and mutual exclusion
    problems through their compare-and-set semantics. They also allow you to work
    with states without fear of mutating in place.


    In addition to these core features, atoms also share two features with the other
    reference types. You can attach both watches and validators to atoms. Let’s look
    at that now.


    # Watches and Validators


    Watches allow you to be super creepy and check in on your reference types'' every
    move. Validators allow you to be super controlling and restrict what states are
    allowed. Both watches and validators are plain ol'' functions.


    # Watches


    A watch is a function that takes four arguments: a key, the reference being watched,
    its previous state, and its new state. You can register any number of watches
    with a reference type.


    Let’s say that a zombie''s shuffle speed (measured in shuffles per hour, or SPH)
    is dependent on its hunger level and deterioration. Here’s how you’d calculate
    it, multiplying the cuddle hunger level by how whole it is:


    ```

    (def shuffle-speed\n[zombie]

    (* (:cuddle-hunger-level zombie)\n(- 100 (:percent-deteriorated zombie))))

    ```'
