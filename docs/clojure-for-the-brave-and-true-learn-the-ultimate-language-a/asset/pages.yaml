  md: "You might be wondering why, when you play the game, each position is represented\
    \ by a letter here the positions are represented by numbers. Using numbers for\
    \ the internal representation allows you to take advantage of some mathematical\
    \ properties of the board layout when validating and making moves. Letters, on\
    \ the other hand, are better for display because they take up only one character\
    \ space. Some conversion functions are covered in 'Rendering and Printing the\
    \ Board' on page 120.\n\nIn the data structure, each position is associated with\
    \ a map that reads like this:\n\n```\n{:pegged true, :connections {6, 3, 4}}\n\
    ```\n\nThe meaning of :pegged is clear; it represents whether that position has\
    \ a peg in it. :connections is a bit more cryptic. It's a map where each key identifies\
    \ a destination, and each value represents the position that would be jumped over.\
    \ So pegs in position 1, example, can jump to position 6 over position 3. This\
    \ might seem backward, but you'll learn the rationale for it later when you see\
    \ how move validation is implemented.\n\nNow that you see the final map the board\
    \ should look like, we can start exploring the functions that actually build up\
    \ this map in the program. You won't simply start assigning mutable states wily\
    \ to represent each position and whether it's pegged or not. You'll need nested\
    \ recursive function calls to build the final board by position. It's analogous\
    \ to the way you created the glamour caption earlier, deriving new data from passing\
    \ an argument through a chain of functions to get your result.\n\nThe first few\
    \ expressions in this section deal with triangular numbers. Triangular numbers\
    \ are generated by adding the first n natural numbers. The first triangular number\
    \ is 1, the second is 3 (1 + 2), the third is 6 (1 + 2 + 3), and so on. These\
    \ numbers line up nicely with the position numbers at the end of every row on\
    \ the board, which will turn out to be a very useful property. First, you define\
    \ the function tri*, which can create a lazy sequence of triangular numbers:\n\
    \n```\ndef tri*\n  \"Generates lazy sequence of triangular numbers\"\n  ([(tri*\
    \ 0))\n  ([sum n]\n    (let [new-sum (+ sum n)]\n      (cons new-sum (tri* new-sum\
    \ (inc n)))))\n```\n\nTo quickly recap how this works, calling tri* with no arguments\
    \ will recursively call (tri* 0). It returns a lazy list new-sum, which in this\
    \ case evaluates to 1. The lazy list includes a recipe for generating the next\
    \ element of the list when it's requested, as described in Chapter 4."
