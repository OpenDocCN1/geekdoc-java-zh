  md: "Oh no! That didn't work at all! What happened? The problem is that map returns\
    \ a list, and in this case, it returned a list of println expressions. We just\
    \ want the result of each println call, but instead, this code sticks both results\
    \ in a list and then tries to evaluate that list.\n\nIn other words, Clojure gets\
    \ to something like this:\n\n```\n(do\n  ((clojure.core/println \"criticism\"\
    \ '(1 + 1))\n  (clojure.core/println \"criticism\" '(1 + 1))))\n```\n\nthen evaluates\
    \ the first println to give us this:\n\n```\n(do\n  nil\n  (clojure.core/println\
    \ \"criticism\" '(1 + 1))))\n```\n\nand after evaluating the second println call,\
    \ does this:\n\n```\n(do\n  (nil nil))\n```\n\nThis is the cause of the exception.\
    \ println evaluates to nil, so we end up with something like (nil nil). nil isn't\
    \ callable, and we get a NullPointerException.\n\nAn inconvenience! But as it\
    \ happens, unquote splicing was invented precisely to handle this situation. Unquote\
    \ splicing is performed with `~@`. If you merely unquote a list, this is what\
    \ you get:\n\n```\n*+ (list 1 2 3)\n; => (clojure.core/+ (1 2 3))\n```\n\nHowever,\
    \ if you use unquote splicing, this is what you get:\n\n```\n*+ @(list 1 2 3)\n\
    ; => (clojure.core/+ 1 2 3))\n```\n\nUnquote unwraps a sequable data structure,\
    \ placing its contents directly within the enclosing syntax-quoted data structure.\
    \ It's like the `@` is a sledgehammer and whatever follows is a piñata, and the\
    \ result is the most terrifying and awesome party you've ever been to.\n\nAnyway,\
    \ if you use unquote splicing in your code, then everything will work:\n\n```\n\
    (defmacro code-critic\n  [:keys good bad]]\n  (do @(map #(apply criticize-code\
    \ %)\n    [\"Sweet lion of Zion, this is bad code:\" bad]\n    [\"Great cow of\
    \ Moscow, this is good code:\" good]]))\n```"
