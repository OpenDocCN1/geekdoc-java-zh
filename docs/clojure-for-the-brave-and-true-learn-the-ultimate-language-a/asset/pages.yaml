    \ collection. In the following code, the collector is the vector [1 2 3]:\n\n\
    ```\n(map inc [1 2 3])\n; (2 3 4)\n```\n\nHowever, you can also give map multiple\
    \ collections. Here's a simple example to show how this works:\n\n```\n(map str\
    \ [\"a\" \"b\" \"c\"] [\"A\" \"B\" \"C\"])\n; (\"AA\" \"BB\" \"CC\")\n```\n\n\
    It's if map does the following:\n\n```\n(list str \"a\" \"A\") (str \"b\" \"B\"\
    ) (str \"c\" \"C\")\n```\n\nWhen you pass multiple collections, the elements of\
