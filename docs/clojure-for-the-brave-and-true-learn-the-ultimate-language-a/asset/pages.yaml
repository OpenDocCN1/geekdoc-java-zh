  md: "usually referred to as the dining philosophers problem, that's a more boring\
    \ scenario.) This book doesn't discuss deadlock in much detail, but it's good\
    \ to know the concept and its terminology.\n\nConcurrent programming has its goblins,\
    \ but with the right tools, it's manageable and even fun. Let's start looking\
    \ at the right tools.\n\n# Futures, Delays, and Promises\n\nFutures, delays, and\
    \ promises are easy, lightweight tools for concurrent programming. In this section,\
    \ you'll learn how each one works and how to use them to defend against the reference\
    \ concurrency Goblin and the mutual exclusion concurrency Goblin. You'll discover\
    \ that, although simple, these tools go a long way toward meeting your concurrency\
    \ needs.\nThey do by giving you more flexibility than is possible with serial\
    \ code. When you write serial code, you bind together these three events:\n\n\
    +   - Task definition\n- Task execution\n- Requiring the task's result\n\nAs an\
    \ example, look at this hypothetical code, which defines a simple API call task:\n\
    \n```\n(web-api/get : dwarven-beard-waxes)\n```\n\nAs soon as Closure encounters\
    \ this task definition, it executes it. It also requires the result right now,\
    \ blocking until the API call finishes. Part of learning concurrent programming\
    \ is learning to identify when these chronological couplings aren't necessary.\
    \ Futures, delays, and promises allow you to separate task definition, task execution,\
    \ and requiring the result to. Onward!\n\n# Futures\n\nIn Cloojure, you can use\
    \ futures to define a task and place it on another thread without requiring the\
    \ result immediately. You can create a future with the future macro. Try this\
    \ in a REPL:\n\n```\n(future (Thread/sleep 4000)\n  (println \"I'll print after\
    \ 4 seconds\")\n(println \"I'll print immediately\")\n```\n\nThread/sleep tells\
    \ the current thread to sit on its bum and do nothing for the specified number\
    \ of milliseconds. Normally, if you evaluated Thread/sleep in your REPL, you wouldn't\
    \ be able to evaluate any other state-until the REPL was done sleeping; the thread\
    \ executing your REPL"
