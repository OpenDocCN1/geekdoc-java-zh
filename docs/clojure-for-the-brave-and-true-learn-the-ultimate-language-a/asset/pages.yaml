    \n```\n(def yak-butter-international)\n(:store \"Yak Butter International\"\n\
    \  :smoothness 90)\n(def butter-than-nothing)\n  (:store \"Butter Than Nothing\"\
    \n  :price 150\n  :smoothness 83))\n```"
