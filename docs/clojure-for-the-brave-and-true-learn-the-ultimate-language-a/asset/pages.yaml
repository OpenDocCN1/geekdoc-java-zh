  md: '# apply


    apply explodes a sequable data structure so it can be passed to a function that
    expects a rest parameter. For example, max takes any number of arguments and returns
    the greatest of all the arguments. Here''s how you''d find the greatest number:


    ```

    (max 0 1 2)

    ; => 2

    ```


    But if you want to find the greatest element of a vector? You can just pass the
    vector to max:


    ```

    (max [0 1 2])

    ; => [0 2]

    ```


    This does not return the greatest element in the vector because max returns the
    greatest of all the arguments passed to it, and in this case you''re only passing
    a vector containing all the numbers you want to compare, rather than passing in
    the numbers as separate arguments. Apply is perfect for this situation:


    ```

    (apply max [0 1 2])

    ; => 2

    ```


    By using apply, it''s as if you called (max 0 1 2). You''ll often use apply like
    this, exploding the elements of a collection so that they get passed to a function
    as separate arguments.

    Remember how we defined conj in terms of earlier? Well, we also define it into
    terms of conj by using apply:


    ```

    defn my-into

    [target additions]

    (apply conj additions))

    ```


    ```

    (my-into [0] [1 2 3])

    ; => [0 1 2 3]

    ```


    This call to my-into is equivalent to calling (conj [0] 1 2 3).


    # partial


    partial takes a function and any number of arguments. It returns a new function.
    When you call the returned function, it calls the original function with the original
    arguments you supplied along with the new arguments.


    Here''s an example:


    ```

    (def add10 (partial + 10))

    (add10 3)

    ; => 13

    ```'
