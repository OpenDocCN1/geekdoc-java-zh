    Syntax quoting a list recursively syntax quotes all the elements:


    ```

    (+ 1 2)

    ; => (clojure.core/+ 1 2)

    ```


    The reason syntax quotes include the namespace is to help you avoid name collisions,
    a topic covered in Chapter 6.

    The difference between quoting and syntax quoting is that the latter allows you
    to *unquote* forms using the tilde, `~`. It''s a kind of kryptonite that is around
    you: whenever Superman is around kryptonite, his powers dis-app’-ear. When a tilde
    appears in a syntax-quoted form, the syntax quote''s power is to return unevaluated,
    fully namespaced forms disappears.

    Here''s an example:


    ```

    (+ 1 (inc 1))

    ; => (clojure.core/+ 1 2)

    ```


    Because it comes after the tilde, (inc 1) is evaluated instead of being quoted.
    Without the unquote, syntax quoting returns the unevaluated form with fully qualified
    symbols:


    ```

    (+ 1 (inc 1))

    ; => (clojure.core/+ 1 (clojure.core/inc 1))

    ```


    If you''re familiar with string interpolation, you can think of syntax quoting/unquoting
    similarly. In both cases, you’re creating a kind of template, place a few variables
    within a larger, static structure. For example, in Ruby you can create the string
    "Churn your butter, Jebediah" through concatenation:


    ```

    name = "Jebediah"

    "Churn your butter, " + name + "!"

    ```


    or through interpolation:


    ```

    "Churn your butter, #{name}!"

    ```


    In the same way string interpolation leads to clearer and more concise code, syntax
    quoting and unquoting allow you to create lists clearly and concisely. Compare
