    # # BUILDING, RUNNING, AND THE REPL


    In this chapter, you''ll invest a small amount of time up front to get familiar
    with a quick, foolproof way to build and run Clojure programs. It feels great
    to get a real program running. Reaching that milestone frees you to experiment,
    share your work, and gloat to your colleagues who are still using last decade''s
