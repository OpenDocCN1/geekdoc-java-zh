    \n```\n(defn year-end-evaluation\n  ()\n  (if (> (rand) 0.5)\n    \"You get a\
    \ raise!\"\n    \"Better luck next year!\"))\n```\n\nIf your function reads from\
    \ a file, it's not referentially transparent because the file's contents can change.\
