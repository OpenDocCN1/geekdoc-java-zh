  md: 'In this example, you create a cuddle zombie, fred, with two attributes: cuddle_hunger_level
    and percent_deteriorated. fred starts out with a cuddle_hunger_level of 2, but
    you can change it to whatever you want and it''s still good ol! Fred, the same
    cuddle zombie. In this case, you changed its cuddle_hunger_level to 3.


    You can see that this object is just a fancy reference cell. It''s subject to
    some deterministic results in a multithreaded environment. For example, if two
    threads try to increment Fred''s hunger level with something like fred.cuddle_hunger_level
    = fred.cuddle_hunger_level + 1, one of the increments would be lost, just like
    in the example with two threads writing to X in "The Three Goblins: Reference
    Cells, Mutual Exclusion, and Dwarven Berserkers" on page 193.


    Even if you''re only performing reads on a separate thread, the program will still
    be nondestructive. For example, suppose you''re conducting research on zombie
    behavior. You want to log a zombie''s hunger level whenever it reaches 50 percent
    deterioration, but you want to do this on another thread to increase performance,
    using code like that in Listing 10-1:


    ```

    if fred.percent_deteriorated >= 50

    Thread.new { database_logger.log(fred.cuddle_hunger_level) }

    end

