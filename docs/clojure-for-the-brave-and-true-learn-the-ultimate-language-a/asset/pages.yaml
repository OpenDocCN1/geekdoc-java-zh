- img_proc: true
  md: '# Table 9-1: Instructions for a Program with a Nondeterministic Outcome


    | ID | Instruction |

    | A1 | WRITE X = 0 |

    | A2 | READ X |

    | A3 | WRITE X = X + 1 |

    | B1 | READ X |

    | B2 | WRITE X = X + 1 |


    If the processor follows the order A1, A2, A3, B1, B2, then X will have a value
    of 2, as you''d expect. But if it follows the order A1, A2, B1, A3, B2, X''s value
    will be 1, as you can see in Figure 9-4.


    ![](img/f978a379512d9fe18f046e71e9900d2e_220_0.png)


    We''ll call this the reference cell problem (the first Concurrency Goblin). The
    reference cell problem occurs when two threads read and write to the same location,
    and the value at the location depends on the order of the reads and writes.


    The second Concurrency Goblin is mutual exclusion. Imagine two threads, each trying
    to write to a file. Without any way to claim exclusive write to the file, the
    spell will end up garbled because the write instructions will be interleaved.
    Consider the following two spells:


    +   * By the power invested in me

    * by the state of California,

    * I now pronounce you and wife


    +   * Thunder, lightning, wind, and rain,

    * a delicious sandwich, I summon again


    If you write these to a file without mutual exclusion, you could end up with this:


    +   * By the power invested in me

    * by Thunder, lightning, wind, and rain,'
