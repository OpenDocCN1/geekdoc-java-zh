    # Let


    In the mass of craziness in Listing 3-1, you can see a form of the structure (let
    ...). Let''s build up an understanding of let one example at a time, and then
    examine the full example from the program we''re familiar with all the pieces.
    let binds names to values. You can think of let as short for let be, which is
    also a beautiful Beatles song about programming. Here''s an example:


    ```

    (let [x 3]

    x)

    ;= 3

    ```


    ```

    (def damatian-list

    ["Pongo" "Perdita" "Puppy 1" "Puppy 2"]

    (let dammatians (take 2 damatian-list)

    dammatians))

    ;= "Pongo" "Perdita"

    ```


    In the first example, you bind the name x to the value 3. In the second, you bind
    the name dammatians to the result of the expression (take 2 damatian-list), which
    was the list ("Pongo" "Perdita"). let also introduces a new scope:


    ```

    (def x 0)

    (let [x 1] x)

    ;= 1

    ```


    Here, you first bind the name x to the value 0 using def. Then, let creates a
    new scope in which the name x is bound to the value 1. I think of scope as the
    context for something refers to. For example, in the phrase "please clean these
    butts," bulls means something different depending on whether you''re working in
    a maternity ward or on the custodial of a cigarette manufacturers convention.
    In this code snippet, you''re saying, "I want x to be 0 in the global context,
    but within the context of this expression, it should be 1."


    You can refer existing bindings in your let binding:


    ```

    (def x 0)

    (let [x (inc x) x)

    ;= 1

    ```'
