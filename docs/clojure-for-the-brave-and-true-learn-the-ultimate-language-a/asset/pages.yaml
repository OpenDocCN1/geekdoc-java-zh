    Listing B-2: The full code for composable Boot tasks that announce something''s
    on fire


    Here''s how you''d run this on the command line:


    ```

    boot -t "pants" -p fire

    ```


    And here''s how you''d run it in the REPL:


    ```

    (boot what :thing "pants" :pluralize true) (fire))

    ```


    Wait a minute, what''s boot calling do there? And with what fileset at ① and ②
    In Micha''s world, The boot takes care of setup and cleanup (creating the initial
    fileset, stopping servers by tasks, things like that). Tasks are functions, so
    you can call them directly, but if you use the fileset, they will fail unless
    you call them via the boot macro. Let''s take a closer look at filesets.


    # Filesets


    Earlier I mentioned middleware is for creating domain-specific function pipelines.
    All means is that each handler expects to receive domain-specific data and returns
    domain-specific data. With Ring, for example, each handler expects to receive
    a request map representing the HTTP request, which might look something like this:


    ```

    {:server-port 80

    :request-method :get

    :scheme :http}

    ```


    Each handler can choose to modify this request map in some way before passing
    it to the next handler, by adding a :params key with a Nice Cloj of all query
    string and POST parameters. Ring handlers return a response map, which consists
    of the keys :status, :headers, and :body, and once each handler can transform
    this data in some way returning it to its parent handler.


    In Boot, each handler receives and returns a fileset. The fileset abstraction
    lets you treat your fileset as immutable, and this is a great innovation for build
    tools because building projects is file-centric. For example, your project might
    need to place temporary, intermediary files on the fileset. Usually, with most
    build tools, these files get placed in some specially named place, say, project/target/tmp.
    The problem with this is that project/target/tmp is effectively a global variable,
    and other tasks can accidentally muck it up.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'Boot''s fileset abstraction solves this problem by adding a layer of indirection
    on top of the filesystem. Let''s say Task A creates File X and tells the fileset
    to store it. Behind the scenes, the fileset store the file in an anonymous, temporary
    directory. The fileset then gets passed to Task B, and Task B modifies File X
    and asks the fileset to store the result. Behind the scenes, a new File, File
    Y, is created and stored, and File X remains untouched. In Task B, an updated
    file is returned. This is the equivalent of doing assoc-in with a map: Task A
    can still access the original fileset and the files references.


    And you didn''t use any of this file management functionality in the what and
    fire tasks in Listing B-2! Nevertheless, when Boot compiles tasks, it expects
    handlers to receive and return fileset records. Therefore, to carry your data
    tasks, we snedly it to the fileset record using `merge fileset {:thing :pluralize}`.


    Although that covers the basic concept of a middleware factory, you need to learn
    a bit more to take full advantage of filesets. The mechanics of working with filesets
    are all explained in the fileset wiki (https://github.com/boot-clj/boot/wiki/Filesets).
    In the meantime, I hope this information gave you a good conceptual overview!


    # Next Steps


    The point of this appendix was to explain the concepts behind Boot. However, Boot
    also has a bunch of other functions, like set-env and task-options!, that make
    your programming life easier when you''re actually using it. It offers magical
    features, like providing classpath isolation so you can run multiple projects
    using one JVM, and letting you add new dependencies to your project without having
    to restart your REPL. If Boot tickles your fancy, check out its README for more
    information on real-world usage. Also, its wiki provides top-notch documentation.'
  merge: -1
