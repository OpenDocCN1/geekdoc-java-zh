  md: '# 9


    # # THE SACRED ART OF CONCURRENT\ AND PARALLEL PROGRAMMING


    ![](img/f978a379512d9fe18f046e71e9900d2e_215_0.png)


    If I were the lord of a manor and you were my heir, I would sit you down on your
    13th name day and tell you, “The world of computing is changing, lass, and ye
    must be prepared for the new world of multi-core processors lest ye trampled by
    it.


    “Listen well: In recent years, CPU clock speeds have barely increased, but dual-core
    and quad-core computers have become common. The laws of physics are cruel and
    absolute, and they demand that increasing clock speed requires exponentially more
    power. The realm’s best engineers are unlikely to overcome this limitation anytime
    soon, if ever. Therefore, you can expect the trend of increasing cores on a single
    machine to continue—as will the expectation that you as a programmer will know
    how to make the most of modern hardware.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '“Learning to program in this new paradigm will be fun and fascinating, verily.
    But beware: it is also fraught with peril. You must learn concurrent and parallel
    programming, which is the sacred art of structuring applications to safely manage
    multiple, simultaneously executing tasks.


    “You begin your instruction in this art with an overview of concurrency and parallelism
    concepts. You''ll then study the goblins that harry every practitioner: reference
    cells, mutual exclusion, and dwarven berserkers. And you''ll learn three tools
    that will aid you: futures, promises, and delays.”


    And then I''d tap you on the shoulder with a keyboard, signaling that you were
    ready to begin.


    # Concurrency and Parallelism Concepts


    Concurrent and parallel programming involves a lot of messy details at all levels
    of program execution, from the hardware to the operating system to programming
    language libraries to the code that springs from your heart and lands in your
    editor. But before you worry your head with any of those details, in this section
    I will walk through the high-level concepts that surround concurrency and parallelism.


    # Managing Multiple Tasks vs. Executing Tasks Simultaneously


    Concurrency refers to managing more than one task at the same time. Task just
    means “something that needs to get done,” and it doesn''t imply anything regarding
    implementation in your hardware or software. We can illustrate concurrency with
    the song “Telephone” by Lady Gaga. Gaga sings,


    I cannot text you with a drink in my hand, eh


    Here, she''s explaining that she can only manage one task (drinking). She flat-rejects
    the suggestion that she can manage more than one task. However, if she decided
    to process tasks concurrently, she would sing,


    I will put down this drink to text, then you put phone away and continue drinking,
    eh


    In this hypothetical universe, Lady Gaga is managing two tasks: drinking and texting.
    However, she is not executing both tasks at the same time. Instead, she''s switching
    between the two, or interleaving. Note that, while interleaving, you don''t have
    to fully complete a task before switching: Gaga could type one word, put down
    her phone, pick up her drink and take a sip, and switch back to her phone and
    type another word.


    Parallelism refers to executing more than one task at the same time. If Madame
    Gaga were to execute her two tasks in parallel, she would sing,


    I can text you with one hand while I use the other to drink, eh


    Parallelism is a subclass of concurrency: before you execute multiple tasks simultaneously,
    you first have to manage multiple tasks.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Clojure has many features that allow you to achieve parallelism easily.

    While the Lady Gaga system achieves parallelism by simultaneously executing tasks
    on multiple hands, computer systems achieve parallelism by simultaneously executing
    tasks on multiple processors.

    It''s important to distinguish parallelism from distribution. Distributed computing
    is a special version of parallel computing where the processors are in different
    computers and tasks are distributed to computers over a network. It''s like Lady
    Gaga asking Beyoncé, "Please text this guy I drink." Although you can do distributed
    programming in Clojure with the aid of libraries, this book covers only parallel
    programming, and here I''ll use *parallel* to refer only to cohabiting processors.
    If you''re interested in distributed programming, check out Kyle Kingsbury'' *Call
    Me Maybe* at https://aphy.com/.


    # Blocking and Asynchronous Tasks


    One of the major cases for concurrent programming is for blocking operations.
    Blocking really just means waiting for an operation to finish. You''ll often hear
    it in relation to I/O operations, like reading a file or waiting for an HTTP request
    to finish. Let''s examine this using the concurrent Lady Gaga example.


    If Lady Gaga texts her interlocutor and stands there with her phone in her hand,
    staring at the screen for a response and not drinking, you would say that the
    message is blocking and that tasks are executing *synchronously*.


    If, instead, she tucks her phone away so she can drink until it alerts her by
    beeping or vibrating, then the message is not blocking and you would say she''s
    handling the task *asynchronously*.


    # Concurrent Programming and Parallel Programming


    Concurrent programming and parallel programming refer to techniques for decomposing
    a task into subtasks that can execute in parallel and managing the risks that
    arise when your program executes more than one task at the same time. For the
    rest of the chapter, I will use the two terms interchangeably because the risks
    are pretty much the same for both.

    To better understand these risks and parallelism and how Clojure helps you avoid
    them, let''s examine how concurrency and parallelism are implemented in Clojure.


    # Clojure Implementation: JVM Threads


    I''ve been using the term task in an abstract sense to refer to a series of related
    operations without regard for how a computer might implement the task concept.
    For example, texting is a task that consists of a series of related operations
    that are totally separate from the operations involved in pouring a drink into
    your face.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'In Clojure, you can think of your normal serial code as a sequence of tasks.
    You indicate that tasks can be performed concurrently by placing them on JVM threads.


    # What''s a Thread?


    I''m glad you asked! A thread is a subprogram. A program can have many threads,
    and each thread executes its own set of instructions while enjoying shared access
    to the program''s state.


    Thread management functionality can exist at multiple levels in a computer. For
    example, the operating system typically provides system calls to create and manage
    threads. The JVM provides its platform-independent thread management functionality,
    and since Clojure programs run in the JVM, they use JVM threads. You''ll learn
    more about the JVM in Chapter 12.


    You can think of a thread as an actual, physical piece of thread strings turning
    a sequence of instructions. In my mind, the instructions are marshmallows, because
    marshmallows are delicious. The processor executes these instructions consuming
    marshmallows, because alligator likes marshmallows (true!). So executing a program
    looks like a bunch of marshmallows strung out on a line with an alligator traveling
    down the line and eating them by one. Figure 9-1 shows this single-core processor
    executing a single-threaded program.


    ![](img/f978a379512d9fe18f046e71e9900d2e_218_0.png)


    Instructions


    ![](img/f978a379512d9fe18f046e71e9900d2e_218_1.png)


    Figure 9-1: Single-core processor executing a single-threaded program


    A thread can spawn a new thread to execute tasks concurrently. In a single-processor
    system, the processor switches back and forth between the threads (interleaving).
    Here''s where potential concurrency issues get introduced. Although the processor
    executes the instructions on each thread in order, it makes no guarantees about
    when it will switch back and forth between threads.'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'Figure 9-2 shows an illustration of two threads, A and B, and a timeline of
    how their instructions could be executed. I''ve shaded the instructions on thread
    B to help distinguish them from the instructions on thread A.


    New thread, thread B


    ![](img/f978a379512d9fe18f046e71e9900d2e_219_0.png)


    Figure 9-2: Single-core processor executing two threads


    Note that this is just one possible order of instruction execution. The processor
    could also have executed the instructions in the order A1, A2, A3, B1, A4, B2,
    B3 for example. This makes the program nondeterministic. to know beforehand what
    the result will be because you can''t know the execution order, and different
    execution orders can yield different results.


    This example shows concurrent execution on a single processor through interleaving,
    whereas a multi-core system assigns a thread to each core, allowing the computer
    to execute more than one thread simultaneously. Each core executes its thread''s
    instructions in order, as shown in Figure 9-3.


    Processor 2 execution order


    ![](img/f978a379512d9fe18f046e71e9900d2e_219_1.png)


    Processor 1 execution order


    Figure 9-3: Two threads, two processors


    As with interleaving on a single core, there are no guarantees for the overall
    execution order, so the program is nondeterministic. When you add a second thread
    to a program, it becomes possible for your program to fall prey to three kinds
    of problems.


    # The Three Goblins: Reference Cells, Mutual Exclusion, and Dwarven Berserkers


    There are three central challenges in concurrent programming, also known as The
    Three Concurrency Goblins. To see why this is scary, imagine that the program
    in the image in Figure 9-3 includes the pseudo-instructions in Table 9-1.'
