  md: 'This is the preferred way to require code, alias namespaces, and refer symbols.
    It''s recommended that you not use (:use), but since it''s likely you''ll come
    across it, it''s good to know how it works. You know the drill:


    ```

    (ns the-divine-cheese-code.core

