    \ would work as shown in\n\nListing 9-2:\n\n```\n(-> enqueue @saying (wait 200\
    \ \"Elo, gov'na!\") (println @saying))\n(enqueue @saying (wait 400 \"pip pip!\"\
    ) (println @saying))\n(enqueue @saying (wait 100 \"Cheerio!\") (println @saying))\n\
