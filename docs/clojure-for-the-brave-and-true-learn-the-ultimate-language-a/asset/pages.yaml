  md: "# 7\nCLOJURE ALCHEMY: READING, EVALUATION, AND MACROS\n\nThe philosopher’s\
    \ stone, along with the elixir of life and Viagra, is one of the most well-known\
    \ specimens of alchemical lore, pursued for its ability to transmute lead into\
    \ gold.\nClojure, however, offers a tool that makes the philosopher’s stone look\
    \ like a mere trinket: the *macro*.\n\nMacros allow you to transform arbitrary\
    \ expressions into valid Clojure, so you can extend the language itself to fit\
    \ your needs. And you don't even have to be a wizened old dude or lady in a robe\
    \ to use them!\nTo get just a sip of this power, consider this trivial macro:\n\
    \n```\n(defmacro backwards\n [form]\n  (reverse form))\n```\n\n```\n(backwards\
    \ (\" backwards\" \" am\" \"I\" str))\n => \"I am backwards\")\n```\n\n![](img/f978a379512d9fe18f046e71e9900d2e_173_0.png)"
