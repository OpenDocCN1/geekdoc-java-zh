    # Better Symmetriz with reduce


    The pattern of process each element in a sequence and build a result is so common
    that it''s a built-in function for it called reduce. Here''s a simple example:


    ```

    ; sum with reduce

    (reduce + [1 2 3 4])

    => 10

    ```


    This is like Cloj to do this:


    ```

    (+ (+ (1 2) 3) 4)

    ```


    The reduce function works according to the following steps:


    +   1. Apply the given function to the first two elements of a sequence. That''s
    where (+ 1 2) comes from.

    2. Apply the given function to the result and the next element of the sequence.
    In this case, the result of step 1 is 3, and the next element of the sequence
    is 3 as well. So the final result is (+ 3).

    3. Repeat step 2 for every remaining element in the sequence.


    reduce also takes an initial value. The initial value here is 15:


    ```

    (reduce + 15 [1 2 3 4])

    ```


    If you provide an initial value, reduce starts by applying the given function
    to the initial value and the first element of the sequence rather than the first
    two elements of the sequence.


    One detail to note is that, in these examples, reduce takes a collection of elements
    [1 2 3 4], and returns a single number. Although programmers often use reduce
    this way, you can also use reduce to return an even larger collection than the
    one you started with, as we''re trying to symmetrize-body-parts. reduce abstracts
    the task “process a collection'
