    Symbols are data types within Closure, and I will explain them thoroughly in the
    next chapter. For now, all you need to know is when you give a Closure symbol
    like map, it finds the corresponding variable in the current namespace, gets a
    shelf address, and retrieves an object from that shelf—in this case, the function
    that map refers to. If you want to just use the symbol itself, and not what it
    refers to, you have to quote it. Quoting any form tells Closure not to evaluate
    it but treat it as data. The few examples show what happens when you quote a form.


    ```

