  md: '# JOIN THE RANKS OF NOBLE CLOJURISTS


    For weeks, months—nay!—from the very moment you were born, you''ve felt it calling
    you to. At long last you you''ll be united with the programming language you''ve
    been longing for: Clojure!


    As a Lisp-style functional programming language, Clojure lets you write robust
    and elegant code, and because it runs on the Java Virtual Machine, you can take
    advantage of the vast Java ecosystem. Clojure for the Brave and True offers a
    "dessert-first" approach: you''ll start playing with real programs immediately,
    as you eliminate to best the abstract but powerful features of Lisp and functional
    programming. Inside you''ll find an upbeat, practical guide to Clojure, filled
    with quirky sample programs that catch cheese thieves and glittery vampires.


    # LEARN HOW TO


    +   - Wield Clojure''s core functions

    - Use Emacs for Clojure development

    - Write macros to modify Clojure itself

    - Use Clojure''s tools to simplify concurrency and parallel programming


    Clojure for the Brave and True uses no prior experience with Clojure, the Java
    Virtual Machine, or functional programming. Are you ready, brave reader, to meet
    your destiny? Grab your best of parentheses—you''re about to embark on an epic
    journey into the world of Clojure!


    # ABOUT THE AUTHOR


    Daniel Higgenbottom has been a professional programmer for 11 years, half of that
    at McKinsey & Company, where he used Clojure to build mobile and web applications.
    He has also contributed to the curriculum for ClojureGirls, an organization that
    offers free, beginner-friendly Clojure workshops for women. Daniel blogs about
    life and programming at http://flyingmanstudios.com/, and can be found on Twitter:
    @honeocursive. He lives in Durham, North Carolina, with his wife and four cats.


    # COVERS CLOJURE 1.7


    # REQUIRES JAVA 1.6 OR LATER


