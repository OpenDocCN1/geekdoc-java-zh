    By end of the chapter, you''ll understand all the tools you''ll use to write macros:
    quote, syntax quote, unquote, unquote splicing (aka the piñata tool), and gensym.
    You''ll also learn about the dangers lying in wait for unsuspecting macro authors:
    double evaluation, variable capture, and macro infection.


    Before


    ![](img/f978a379512d9fe18f046e71e9900d2e_192_0.png)


    After


    ![](img/f978a379512d9fe18f046e71e9900d2e_192_1.png)


    # Macros Are Essential


    Before you start writing macros, I want to help you put them in the proper context.
    Yes, macros are cooler than a polar bear''s toenails, but you shouldn''t think
    of macros as some esoteric tool you pull out when you feel getting fancy with
    your code. In fact, macros allow Clojure to derive a lot of its built-in functionality
    from a tiny core of functions and special forms. When, for example, when has this
    general form:


    ```

    (when boolean-expression

    expression-1

    expression-2

    expression-3

    expression-x)

    ```


    You might think that when is a special form like if. Well guess what? It''s not!
    In most other languages, you can only create conditional expressions using special
    keywords, and there''s no way to create your own conditional operators. However,
    when is actually a macro.


    In this macro expansion, you can see that what is implemented in terms of if and
    do:


    ```

    (macroexpand ''(when boolean-expression

    expression-1

    expression-2

    expression-3))

    ; => (if boolean-expression

    expression-1

    expression-2

    expression-3))

    ```'
