    # Vectors


    A vector is similar to an array, in that it''s a 0-indexed collection. For example,
    here''s a vector literal:


    ```

    [3 2 1]

    ```


    Here we returning the 0th element of a vector:


    ```

    (get [3 2 1] 0)

    => 3

    ```


    Here''s another example of getting by index:


    ```

    (get "a" :name "Pugsley Winterbottom" "c" 1)

    => :name "Pugsley Winterbottom"

    ```


    You can see vector elements can be of any type, and you can mix types. Also notice
    that we''re using the same get function as we can use when looking up values in
    maps.

    You can create vectors with the vector function:


    ```

    (vector "creepy" "full" "moon")

    => ["creepy" "full" "moon"]

    ```


    You can use the conj function to add additional elements to the vector. Elements
    are added to the end of a vector:


    ```

    {conj [1 2 3] 4}

    => (1 2 3 4)

    ```


    Vectors aren''t the only way to store sequences; Clojure also has lists.


    # Lists


    Lists are similar to vectors in that they''re linear collections of values. There
    are some differences. For example, you can''t retrieve list elements with get.
    To create a list, just insert the elements into parentheses at the beginning:


    ```

    ''(1 2 3 4)

    => (1 2 3 4)

    ```'
