  md: '# Modes


    An Emacs mode is a collection of key bindings and functions that packaged together
    to help you be productive when editing different types of files. Modes also do
    things like tell Emacs how to do syntax highlighting, but that''s of secondary
    importance, and I won''t cover that here.


    For example, when you''re editing a Clojure file, you''ll want to load Clojure
    mode. Right now I''m writing a Markdown mode which has lots of useful key bindings
    specific to working with Markdown. When editing Emacs, it''s best to have a set
    of Clojure-specific key bindings, like C-c C-k to load the current buffer and
    compile it.


    Modes come in two flavors: major modes and minor modes. Markdown mode are major
    mode. Major modes are usually set by Emacs when you open a file, but you can also
    set the mode by running the relevant Emacs command, for example with M-x cliche-mode
    or M-x major-mode. Only one major mode is active at a time.


    Whereas modes specialize Emacs for a certain type or language, minor modes provide
    functionality that''s useful across file types. For example, abbreviation "automatically
    expands text based on pre-defined abbreviation definitions" (the Emacs manual).
    You can have multiple minor modes active at the same time.


    You can see which modes are active on the mode line, as shown in Figure 2-7.


