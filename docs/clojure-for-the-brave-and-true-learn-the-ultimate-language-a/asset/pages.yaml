    't evaluate any of the other expressions, otherwise it returns\nthe value of the\
    \ last expr. (and) returns true\"\n  [: true]\n  [x x]\n  [x & next]\n  [:let\
    \ and \"~\"\n    (if and (and \"~\" and))))\n```\n\nThere's a lot of stuff going\
    \ on in this example, including the symbols\nand \"\", which you'll learn about\
