    # sort and sort-by


    You can sort elements in ascending order with sort:


    ```

    (sort [3 1 2])

    ; => (1 2 3)

    ```


    If you sorting needs are more complicated, you can use sort-by, which allows you
    to apply a function (sometimes called a key function) to the elements of a sequence
    and use the returns to determine the sort order. In the following example, which
    is taken from http://clojuredocs.org/, count is the key function:


    ```

    (sort-by count ["aaa" "c" "bb"])

    ; => (""c" "bb" "aaa")

    ```


    If you were sorting using count, the elements would be sorted in alphabetical
    order, returning (""aaa" "bb" "c"). Instead, the result is (""c" "bb" "aaa") because
    you''re sorting by count and the count of "c" is 1, "bb" is 2, and "aaa" is 3.


    # concat


    Finally, concat simply appends the members of one sequence to the end of another:


    ```

    (concat [1 2] [3 4])

    ; => (1 2 3 4)

    ```


    # Lazy Seqs


    As you saw earlier, map first calls seq on the collection you pass to. But that''s
    not the whole story. Many functions, including map and filter, return a lazy seq.
    A lazy seq whose members are not computed until you try to access them. Computing
    a seq''s members is called realizing the seq. Deferring the computation until
    the moment it''s needed makes programs more efficient, and it has the surprising
    benefit of allowing you to construct infinite sequences.


    # Demonstrating Lazy Seq Efficiency


    To see lazy seq in action, pretend that you''re part of a modern-day task whose
    purpose is to identify vampires. Your intelligence agents tell you that there
    is only one active vampire in your city, and they''ve helpfully'
