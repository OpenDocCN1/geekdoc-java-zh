    \ of the mapping function (str), the elements of the second collection ({\"A\"\
    \ \"B\" \"C\") will be passed as the second argument, and so on. Just be sure\
    \ that your mapping function can take a number of arguments equal to the number\
    \ of collections you're passing.\n\nThe following example shows how you could\
    \ use this if you were a vampire to curb your human consumption. You have two\
