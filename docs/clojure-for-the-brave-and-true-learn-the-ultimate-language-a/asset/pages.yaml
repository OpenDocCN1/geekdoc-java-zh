  md: 'Clojure continues to evolve. As of this writing, it''s at version 1.7.0, and
    development is going strong. If you''re reading this book in the far future and
    Clojure has a higher version number, don''t worry! This book covers Clojure''s
    fundamentals, which shouldn''t change from one version to the next. There''s no
    need for your robot butler to return this book to the bookstore.


    Now that you know what Clojure is, let''s actually build a khiến'' Clojure program!


    # Leiningen


    These days, most Clojurists use Leiningen to build and manage their projects.
    You can read a full description of Leiningen in Appendix A, but for we''ll focus
    on it for four tasks:


    +   1. Creating a new Clojure project

    2. Running the Clojure project

    3. Building the Clojure project

    4. Using the REPL


    Before continuing, make sure you have Java version 1.6 or later installed. You
    can check your version by running java -version in terminal, and download the
    latest Java Runtime Environment (JRE) from http://www.oracle.com/technetwork/javase/downloads/index.html.
    Then, install Leiningen using the instructions on the Leiningen home page at http://leiningen.org/
    (Windows users, note there''s a Windows installer). When you install Leiningen,
    it automatically downloads the Clojure compiler, clojure.jar.


    # Creating a New Clojure Project


    Creating a new Clojure project is very simple. A single Leiningen command creates
    a project skeleton. Later, you''ll learn how to do tasks like incorporate Clojure
    libraries, but for now, these instructions will enable you to execute the code
    you write.


    Go ahead and create your first Clojure project by typing the following in your
    terminal:


    ```

    lein new app clojure-noob

    ```


    This should create a directory structure that looks similar to this (it''s okay
    if there are some differences):


    +   .gitignore

    | doc

    | intro.md

    | project.clj

    | README.md

    | resources

    | src'
