    # Escape Callback Hell with Process Pipelines


    In languages without channels, you need to express the idea "when x happens, do
    y" with callbacks. In a language like JavaScript, callbacks are a way to define
    code that executes asynchronously once other code finishes. If you worked with
    JavaScript, you''ve probably spent some time wallowing in callback hell.


    The reason it is called callback hell is that it is very easy to create dependencies
    among layers of callbacks that are not immediately obvious. They end up sharing
    state, making it difficult to reason about the state of the overall system as
    callbacks get triggered. You can avoid this depressing outcome by creating a process
    pipeline. That way, each unit of logic lives in its own isolated process, and
    all communication between units of logic occurs through explicitly defined input
    and output channels.


    In the following example, we create three infinitely looping processes connected
    through channels, passing the out channel of one process as the in channel of
    the next process in the pipeline:


    ```

    def upper-caser

    [in]

    (let [out chan])

    (go (while true (> out (clojure.string/upper-case (! in))))

    (out)))

    ```


    ```

    def reverser

    [in]

    (let [out chan])

    (go (while true (> out (clojure.string/reverse (! in))))

    (out)))

    ```


    ```

    def printer

    [in]

    (go (while true (println (! in))))

    ```


    ```

    def in-chan (chan)

    (def upper-caser-out (upper-caser-in-chan))

    (def reverser-out (reverser upper-caser-out))

    (printer reverser-out)

    ```'
