  md: 'would be blocked. However, future creates a new thread and places each expression
    you pass it on the new thread, including Thread/sleep, allowing the REPL''s thread
    to continue, unblocked.


    You can use futures to run tasks on a separate thread and then forget about them,
    but you''ll want to use the result of the task. The future function returns a
    value that you can use to request the result. The reference is like the ticket
    a dry cleaner gives you: at any time you can use it to request your clean, but
    if your dress isn''t clean yet, you''ll have to wait. Similarly, you can use the
    reference to request a future''s result, but if the future isn''t done computing
    the result, you''ll have to wait.


    Requesting a future''s result is called dereferencing the future, and you can
    do it with the dereferencing function or the @ reader macro. A future''s value
    is the value of the last expression evaluated in it. A future''s body executes
    only once, and your value gets cached. Try the following:


    ```

    (let result (future (println "this prints once")n (+ 1))

    (println "deref": (@ result))

    (println "@": (@result))

    ; "this prints once"

    ; deref: 2

    ; @: 2

    ```


    Notice that the string "this prints once" indeed prints only once, even though
    you dereference the future twice. This shows that the future''s body ran only
    once and the result, 2, got cached. like:


    Dereferencing a future will block if the future hasn''t finished running,


    ```

    (let result (future (Thread/sleep 3000) (+ 1))

    (println "The result is": (@ result))

    (println "It will be at least 3 seconds before I print")

    ; The result is: 2

    ; It will be at least 3 seconds before I print

    ```


    Sometimes you want to place a time limit on how long to wait for a future. To
    do that, you can pass deref number of milliseconds to wait along with the value
    to return if the deref times out:


    ```

    (deref (future (Thread/sleep 1000) 0 10 s))

    ; =>5

    ```


    This code tells deref to return the value 5 if the future doesn''t return a value
    within 10 milliseconds.'
