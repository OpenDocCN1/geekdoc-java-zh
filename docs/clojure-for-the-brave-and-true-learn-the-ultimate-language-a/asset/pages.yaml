    # All Functions Created Equal


    One final note: Clojure has no privileged functions. + is just a function, - is

    just a function, inc and map are just functions. They''re no better thannthe functions
    you define yourself. Don''t let them give you any lip!


    More important, this helps demonstrate Clojure''s underlying

    splicity. In a way, Clojure is very dumb. When you make a function,

    Clojure just says, "Map, whatever! I''ll just apply this and move on."

    It doesn''t care what the function is or where it comes from; it treats all functionsnthe
    same. At its core, Clojure does not give two burger flips about addintion, multiplication,
    or mapping. It cares about applying functions.


