    # Symbols


    One of your fundamental tasks as a programmer is creating abstractions by associating
    names with values. You learned how to do this in Chapter 3 by using def, let,
    and function definitions. Clojure uses symbols to name functions, macros, data,
    and anything else you can use, and evaluates them by resolving. To resolve a symbol,
    Clojure traverses all bindings you''ve created and looks up the symbol''s entry
    in a namespace mapping, which you learned about Chapter 6. Ultimately, a symbol
    resolves to either a value or a special form—a built-in Clojure operator that
    provides fundamental behavior.'
