  md: 'Suppose, for example, that you had a vector representing entries in your "food"
    journal. Each entry has the year, month, day, and what you ate. To preserve space,
    we''ll only include a few entries:


    ```

    (def food-journal

    {:month 1 day 1 :human 5.3 :critter 2.3}

    {:month 1 day 2 :human 5.1 :critter 2.0}

    {:month 2 day 1 :human 4.9 :critter 2.1}

    {:month 2 day 2 :human 5.0 :critter 2.5}

    {:month 3 day 1 :human 4.2 :critter 3.3}

    {:month 3 day 2 :human 4.0 :critter 3.8}

    {:month 4 day 1 :human 3.7 :critter 3.9}

    {:month 4 day 2 :human 3.7 :critter 3.6]})

    ```


    With take-while, you can retrieve just January''s and February''s data. take-while
    traverses the given sequence (in this case, food-journal), applying the predicate
    function to each element.

    This example uses the anonymous function #(:month % 3) to test whether the journal
    entry is out of range:


    ```

    (take-while #(:month % 3) food-journal)

    ; => ({:month 1 day 1 :human 5.3 :critter 2.3}

    {:month 1 day 2 :human 5.1 :critter 2.0}

    {:month 2 day 1 :human 4.9 :critter 2.1}

    {:month 2 day 2 :human 5.0 :critter 2.5})

    ```


    When take-while reaches the first March entry, the anonymous function returns
    false, and take-while returns a sequence of every element it tested until that
    point.

    The same idea applies with drop-while except that it keeps dropping elements until
    one tests true:


    ```

    (drop-while #(:month % 3) food-journal)

    ; => ({:month 3 day 1 :human 4.2 :critter 3.3}

    {:month 3 day 2 :human 4.0 :critter 3.8}

    {:month 4 day 1 :human 3.7 :critter 3.9}

    {:month 4 day 2 :human 3.7 :critter 3.6})

    ```


    By using take-while and drop-while, you can get data for February and March:


    ```

    (take-while #(:month % 4) food-journal)

    ; => ({:month 2 day 1 :human 4.9 :critter 2.1}

    {:month 2 day 2 :human 5.0 :critter 2.5}

    {:month 3 day 1 :human 4.2 :critter 3.3}

    {:month 3 day 2 :human 4.0 :critter 3.8})

    ```


    This example uses drop-while to get rid of the January entries, and then it uses
    take-while on the result to keeping entries until it reaches the April entry.'
