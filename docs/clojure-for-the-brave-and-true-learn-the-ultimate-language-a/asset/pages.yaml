  md: "The next time you start your project, either by running it or by starting a\
    \ REPL, Leiningen will automatically download clj-time and make it available within\
    \ your project.\n\nThe Closure community has created a multitude of useful libraries,\
    \ and a good place to look for is the Closure Toolbox at http://www.clojure-toolbox.com,\
    \ which categorizes projects by their purpose. Nearly every Closure library provides\
    \ its identifier at the top of its README, making it easy for you to figure out\
    \ how to add it to your Leiningen dependencies.\n\nSometimes you might want to\
    \ use a Java library, but the identifier isn't as readily available. If you want\
    \ to add Apache Commons Email, for example, you may have to search online until\
    \ you find a web page that contains something like this:\n\n```\n<dependency>\n\
    \  <groupId>org.apache.commons</groupId>\n  <artifactId>commons-email</artifactId>\n\
    \  <version>1.3.3</version>\n</dependency>\n```\n\nThis XML is how Java projects\
    \ communicate their Maven identifier. To add your project to Clojars, you'd change\
    \ your :dependencies vector so it looks like this:\n\n```\n:dependencies [[org.clojure/clojure\
    \ \"1.7.0\"]\n  [clj-time \"0.9.0\"]\n  [org.apache.commons/commons-email \"1.3.3\\\
    ]]\n```\n\nThe main Closure repository is Clojars (https://clojars.org/), and\
    \ the main Java repository is The Central Repository (https://search.maven.org/),\
    \ which is often referred to as just Central in the way that San Francisco residents\
    \ refer to the city. You can use these sites to find libraries and their identifiers.\n\
    \nTo deploy your own projects to Clojars, you all have to create an account and\
    \ then run `lein deploy clojars`. This task generates everything necessary for\
    \ a Maven artifact to be stored in a repository, using a POM file (which won't\
    \ go into) and a JAR file. Then it uploads them to Clojars.\n\n# Plug-Ins\n\n\
    Leiningen lets you use plugins, which are libraries that help you when you're\
    \ writing code. For example, the Eastwood plugin is a Clojure tool; it identifies\
    \ poorly written code. You'll usually want to specify your plug-ins in the file\
    \ $HOME/lein/profiles.clj. To add Eastwood, you'd change profiles.clj to look\
    \ like this:\n\n```\n{:user {:plugins [[eastwood/eastwood \"0.2.1\\]]}}\n```"
