  md: 'cheese.analysis=> (clojure.core/refer ''cheese.taxonomy)

    cheese.analysis=> bries

    ; => ["Wisconsin" "Somerset" "Brie de Meaux" "Brie de Melun"]


    cheese.analysis=> chedd

    ; => ["mild" "medium" "strong" "sharp" "extra sharp"]


    This creates a cheese.taxonomy namespace and two vectors within it: cheesy and
    bries. Then it creates and moves to a new namespace called cheese.analysis. Calling
    refer with a namespace symbol lets you refer to the corresponding namespace''s
    objects without having to use fully qualified symbols. This is done by updating
    the current namespace''s symbol/object map. You can see the new entries like this:


    cheese.analysis=> (clojure.core/get (clojure.core/ns-map clojure./*ns*) ''bries)

    ; => #''cheese.taxonomy/bries


    cheese.analysis=> (clojure.core/get (clojure.core/ns-map clojure./*ns*) ''cheddars)

    ; => #''cheese.taxonomy/cheddars


    # It''s as if Cloj


    +   1. Calls ns-inters on the cheese.taxonomy namespace

    2. Merges with the ns-map of the current namespace

    3. Makes the result ns-map of the current namespace


    When you refer, you can also pass the filters: :only, :exclude,/var :rename. As
    the names imply, :only and :exclude restrict which symbol/var mappings get merged
    into the current namespace''s ns-map.:rename lets you use different symbols for
    the vars being merged in. Here''s what would happen if we modified the example
    to use :only:


    ```

    cheese.analysis=> (clojure.core/refer ''cheese.taxonomy :only [''bries])

    cheese.analysis=> bries

    ; => ["Wisconsin" "Somerset" "Brie de Meaux" "Brie de Melun"]

    cheese.analysis=> cheddars

    ; => RuntimeException: Unable to resolve symbol: cheddars

    ```


    And here''s :exclude in action:


    ```

    cheese.analysis=> (clojure.core/refer ''cheese.taxonomy :exclude [''bries])

    cheese.analysis=> bries

    ; => RuntimeException: Unable to resolve symbol: bries

    cheese.analysis=> cheddars

    ; => ["mild" "medium" "sharp" "extra sharp"]

    ```


    Lastly, :rename example:


    ```

    cheese.analysis=> (clojure.core/refer ''cheese.taxonomy :rename [''bries ''yummy-bries])

    cheese.analysis=> bries

    ; => RuntimeException: Unable to resolve symbol: bries

    ```'
