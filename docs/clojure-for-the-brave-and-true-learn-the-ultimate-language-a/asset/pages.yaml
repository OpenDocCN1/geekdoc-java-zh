    # To Catch a Burglar


    We can''t allow this plunder of parmesan to make off with any more cheese! It''s
    time to finish drawing lines based on the coordinates of the heists! That will
    surely reveal everything!


    Using the latitude coordinates for each heist, you''ll connect the dots in an
    SVG image. But if you draw lines using the given coordinates, the result won''t
    look right for two reasons. First, latitude ascend from south to north, SVG y-coordinates
    ascend from top to bottom. In other words, you need to flip the coordinates or
    the drawing will be upside down.


    Second, the drawing will be very small. To fix that, you''ll zoom in on it by
    translating and scaling it. It''s like turning a drawing that looks like Figure
    6-1a into Figure 6-1b.'
