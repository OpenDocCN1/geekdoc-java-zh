    2. Use M-x replace-string and replace face with head.


    This will perform the replacement within the current region rather than the entire
    buffer after point, which is the default behavior.


    # Killing and the Kill Ring


    In most applications we can cut text, which is only mildly volatile. We can also
    copy and paste. Cutting and copying add the selection to the clipboard, and pasting
    copies the contents of the clipboard to the current application. In Emacs, we
    take the homicidal approach to kill regions, adding them to the kill ring. Don''t
    feel brave or true knowing that you are laying waste to untold kilobytes of text.
    We can then yank, inserting the most recently killed text at point. We can also
    copy text to the kill ring without actually killing it.


    Why bother with all morbid terminology? Well, so you won''t be frightened when
    you hear someone about killing things in Emacs. But more important, Emacs allows
    you to do tasks that you can''t with the typical cut/copy/paste clipboard featureset.


    Emacs stores multiple blocks of text on the kill ring, and you can cycle through
    them. This is cool because you can cycle through to retrieve text you killed a
    long time ago. Let''s see this in action:


    +   1. Create a region over the word Treasure in the first line.

    2. Use M-w, which is bound to the kill-ring-save command. In general, M-w is like
    copying. It adds the region to the kill ring without deleting it from your buffer.


    +   3. Move point to the choreography on the last line.

    4. Use M-d, which is bound to the kill-word command. This adds choreography to
    the kill ring and deletes it from your buffer.'
