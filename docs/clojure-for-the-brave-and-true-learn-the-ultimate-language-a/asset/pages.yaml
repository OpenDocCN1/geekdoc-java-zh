  md: 'The details of require are actually a bit complicated, for practical purposes
    you can think of require as telling Cloure the following:


    +   1. Do nothing if you''ve already called require with this symbol (the-divine-cheese-code.visualization.svg).


    +   2. Otherwise, find the file that corresponds to this symbol using the rules
    described in “The Relationship Between File Paths and Namespace Names” on page
    133. In this case, Cloure finds src/the_divine_cheese_code/visualization.svg.clj.


    Read and evaluate the contents of that file. Cloure expects the file to declare
    a namespace corresponding to its path (which ours does). require also lets you
    alias a namespace when you require it, using :as or alias. This:


    ```

    (require ''the-divine-cheese-code.visualization.svg :as svg)

    ```


    is equivalent to this:


    ```

    (require ''the-divine-cheese-code.visualization.svg)

    alias ''svg ''the-divine-cheese-code.visualization.svg)

    ```


    You can now use the aliased namespace:


    ```

    (svg/points heists)

    ; = "50.95,6.97 47.37,8.55 43.3,37.5 47.37,8.55 41.9,12.45"

    ```


    Cloure provides another shortcut. Instead of calling require and refer separately,
    the function use does both. It''s frowned upon to use in production code, but
    it''s handy when you''re experimenting in the REPL and you want to get your hands
    on some functions. For example, this:


    ```

    (require ''the-divine-cheese-code.visualization.svg)

    refer ''the-divine-cheese-code.visualization.svg)

    ```


    is equivalent to this:


    ```

    (use ''the-divine-cheese-code.visualization.svg)

    ```


    You can alias a namespace with use just like you can with require.


    ```

    (require ''the-divine-cheese-code.visualization.svg)

    refer ''the-divine-cheese-code.visualization.svg)

    alias ''svg ''the-divine-cheese-code.visualization.svg)

    ```


    is equivalent to the code in Listing 6-2, which also shows aliased namespaces
    used in function calls.'
