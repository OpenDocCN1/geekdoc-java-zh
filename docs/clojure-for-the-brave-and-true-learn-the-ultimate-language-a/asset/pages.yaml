    # Reader Macros


    I’ll answer my question: the reader used a reader macro to transform (#+ 1*).
    Macros are sets of rules for transforming text into data structures in more compact
    ways they allow you to represent data using an abbreviated reader form and expand
    it into a full form. They’re designated by macro characters, like ‘ (the single
    quote), #, and @ They’re also completely different from the macros we’ll get to
    later. So as not to get too confused, I’ll always refer to reader macros using
    the full term reader macro.


    For example, you can see how the reader macro expands the


    ```

    (read-string "''(a b c")

    => (quote (a b c))

    ```'
