  md: "same symbol within the same syntax-quoted list, each instance of y#nresolves\
    \ similarly, and so on.\ngensym and auto-gensym are both used all the time when\
    \ writing macros,\n they allow you to avoid variable capture.\n\n# Double Evaluation\n\
    \nAnother gotcha to watch out for when writing macros is double evaluation,\n\
    \ occurs when a form passed as a macro as an argument gets evaluated\nmore than\
    \ once. Consider the following:\n\n```\n(defmacro report\n[to-try]\n(if ~to-try\n\
    (println (quote ~to-try) \"was successful: ~to-try)\n(println (quote ~to-try)\
    \ \"was not successful: ~to-try)))\n\n;; sleep takes a number of milliseconds\
    \ to sleep for\n(report (do Thread/sleep 1000) (+ 1 1)))\n```\n\nThis code is\
    \ meant to test its argument for truthiness. The argument\nis truly, it's considered\
    \ successful; if it's false, it's unsuccessful. In this case, you\nactually sleep\
    \ for two seconds because (Thread/sleep 1000) gets evaluated\ntice: once right\
    \ if and again when println gets. This happens\nbecause the code (do Thread/sleep\
    \ 1000) (+ 1 1)) is repeated throughout\nmacro expansion. It's as if you'd written:\n\
    \n```\n(if (do Thread/sleep 1000) (+ 1 1))\n(println (do Thread/sleep 1000) (+\
    \ 1 1))\n\"was successful:\"\n(do Thread/sleep 1000) (+ 1 1)))\n```\n\n```\n(println\
    \ (do Thread/sleep 1000) (+ 1 1))\n\"was not successful:\"\n(do Thread/sleep 1000)\
    \ (+ 1 1)))\n```\n\nBig deal! your inner example critic says. Well, if your code\
    \ did some-\nlike transfer money between bank accounts, this would be a very big\n\
    deal. Here's how you could avoid this problem:\n\n```\n(defmacro report\n[to-try]\n\
    (let result# ~to-try)\n(if result#)\n(println (quote ~to-try) \"was successful:\
    \ result#)\n(println (quote ~to-try) \"was not successful: result#)))\n```\n\n\
    By placing to-try in a let expression, you only evaluate that code\nand bind the\
    \ result to an auto-gensym symbol, result#, which you can now\nreference without\
    \ reevaluating the to-try code."
