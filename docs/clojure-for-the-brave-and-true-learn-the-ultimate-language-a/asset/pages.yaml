    After you''ve extended the java.lang.String type to implement Psychodynamics protocol,
    Closure knows how to dispatch the call (thoughts "blob"), and you get the string
    "Truly, the character defines the data type" at ②.


    If you want to provide a default implementation, like you did with multimethods?
    To do that, you can extend java.lang.Object. This works because every type in
    java (and hence, Closure) is a descendant of java.lang.Object. If that doesn''t
    quite make sense (perhaps you''re not familiar with object-oriented programming),
    don''t worry about it—just know it works. Here''s how you would use this technique
    to provide a default implementation for the Psychodynamics protocol:


    ```

    (extend-type java.lang.Object

    Psychodynamics

    (thoughts [x] "Maybe the Internet is a vector for toxoplasmosis"

    (feelings-about

    ([x] "meh"

    ([x y] (str "meh about " y))))


    (thoughts 3)

    ; => "Maybe the Internet is a vector for toxoplasmosis"


    (feelings-about 3)

    ; => "meh"


    (feelings-about 3 "blob"

    ; => "meh about blob"

    ```


    Because we haven''t defined a Psychodynamics implementation for numbers, Closure
    dispatches calls to thoughts and feelings to the implementation defined for java.lang.Object.


    Instead of making multiple calls to use extend-type to extend multiple types,
    which lets define protocol implementations for multiple types at once. Here''s
    how you''d define the preceding protocol implementations:


    ```

    (extend-protocol Psychodynamics

    java.lang.String

    (thoughts [x] "Truly, the character defines the data type"

    (feelings-about

    ([x] "longing for a simpler way of life"

    ([x y] (str "envious of " y "s simpler way of life\)))

