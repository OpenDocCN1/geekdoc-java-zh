- img_proc: true
  md: "I've actually used this validation code in real production websites. At first,\
    \ I found myself repeating minor variations of the code over and over, a sign\
    \ that I needed to introduce an abstraction that would hide the repetitive parts:\
    \ applying the validate function, binding the result to some symbol, and checking\
    \ whether the result is empty. To create this abstraction, you might be tempted\
    \ to write a function like this:\n\n```\n(defn if-valid\n  (record validations\
    \ success-code failure-code)\n  (let [errors validate record validations]\n  \
    \  (if empty?)\n      success-code\n      failure-code)))\n```\n\nHowever, this\
    \ wouldn't work, because success-code and failure-code would get evaluated each\
    \ time. A macro would work because macros let control evaluation. Here's how you'd\
    \ use the macro:\n\n```\n(if-valid order-details order-details-validation errors\n\
    \  (render :success)\n  (render :failure errors))\n```\n\nThis macro hides the\
    \ repetitive details and how you express your intention more succinctly. It's\
    \ like asking someone to give you the bottle opener instead of saying. \"Give\
    \ me the manual device for removing the temporary sealant from a glass of liquid.\"\
    \ Here's the implementation:\n\n```\n(defmacro if-valid\n  \"Handle validation\
    \ more concisely\"\n  [to-validate validations errors-name &then-else]\n    (if\
    \ empty? ~errors-name\n      (validate ~to-validate ~validations\")\n      ~-else))\n\
    ```\n\nThis macro takes four arguments: to-validate, validations, errors-name,\
    \ and the rest argument-then-else. Using errors-name like this is a strategy.\
    \ We want to access to the errors returned by the validate function within the\
    \ then-else statements. To do this, we tell the macro symbol which should bind\
    \ the result to. The following macro expansion shows how this works:\n\n```\n\
    (macroexpand\n  (if-valid order-details order-details-validations my-error-name\n\
    \    (println :success)\n    (println :failure my-error-name)))\n```\n\n```\n\
    (let*)\n```\n\n```\n[my-error-name (user/validate order-details-order-details-validations)\n\
    \  (if clojure.core/empty? my-error-name)\n    (println :success)\n    (println\
    \ :failure my-error-name)))\n```"
