    # Navigation


    When writing in a Lisp dialect, you''ll work with expressions like this:


    ```

    (map (comp record first)

    (d/q ''[:find ?post

    :in ?search

    :where

    [[fulltext $post/content ?search)

    [[?post ?content]]

    (db/db)

    (:q params)))

    ```


    With this kind of expression, it''s useful to jump quickly from one expression
    to the next. If you put point right before an opening parenthesis, **C-M-f** will
    take you to the closing parenthesis. Similarly, if point is right after a closing
    parenthesis, **C-M-b** will take you to the opening parenthesis.


    Table 2-8 summarizes the key bindings you just learned.


    | Keys | Description |

    |---|---|

    | M-x paredit-mode | Toggle paredit mode. |

    | M-{ Surround expression after point in parentheses (parentedit-wrap-round).
    |

    | C-→ | Slurp; moving parenthesis to the right to include next expression. |

    | C-← | Barf; moving parenthesis to the left to exclude expression. |

    | C-M-f, C-M-b | Move to the opening/closing parenthesis. |


    Table 2-8: Paredit Key Bindings


