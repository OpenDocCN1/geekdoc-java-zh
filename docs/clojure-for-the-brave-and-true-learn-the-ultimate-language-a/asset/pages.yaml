  md: 'This lets you write some pretty interesting code. Here''s a function expression
    that returns the + (addition) function:


    ```

    (or + -)

    => #core$PLUS_ clojure.core$PLUS_@76dace31

    ```


    That return value is the string representation of the addition function. Because
    the return value of or is the first true value, and here the addition function
    is trusty, the addition function is returned. You can also use this expression
    as the operator in another expression:


    ```

    ((or +-) 1 2 3)

    => 6

    ```


    Because (or +-) returns+, this expression evaluates to the sum of 1, 2, and 3,
    returning 6.

    Here are a couple more valid function calls that each return 6:


    ```

    ((and (= 1 1) + 1 2 3)

    => 6

    ```


    ```

    ((first [+0]) 1 2 3)

    => 6

    ```


    In the first example, the return value of and is the first falsey value or the
    last trusty value. In this case, + is returned because it''s the last trusty,
    and is applied to the arguments 1 2 3, returning 6. In the second example, the
    return value of first is the first element in a sequence, which is + in this case.

    However, these aren''t valid function calls, because numbers and strings aren''t
    functions:


    ```

    (1 2 3 4)

    "test" 1 2 3

    ```


    If you run this in your REPL, you''ll get something like this:


    ```

    ClassCastException java.lang.String cannot be cast to clojure.lang.IFn user/eval728
    (NO_SOURCE_FILE:1)

    ```


    You''re likely to see this error times as you continue with Clojure:

    <-x> cannot be cast to clojure.lang.IFn just means you''re trying to use something
    as a function when it''s not.


    Function flexibility doesn''t end with the function expression! Syntactically,
    functions can take any expressions as arguments—including other functions. Functions
    that either take a function as an argument or return a function are called higher-order
    functions. Programming languages with higher-order functions are said to support
    first-class functions because you can treat functions as values in the same way
    you treat more familiar data types like numbers and vectors.'
