  md: '# Prolegomena


    My reasons for making a new edition of Gellius are twofold, that I have further
    information on his manuscripts besides that are available in my predecessors,
    and that I am dissatisfied with the current vulgate; my motive for compiling this
    companion volume, of a kind now familiar for Oxford Classical Texts and others,
    the belief that an editor should not be ''allowed to fling his opinions in the
    reader''s face without being called to account and asked for his reasons.''¹ An
    introduction recounting Gellius'' editorial history, such as was bestowed on Lucretius
    by Munro, on Manilius by Munro''s emulator Housman, and on Gellius himself by
    Hertz, seemed the less necessary after my contribution to the Catalogus Translationem
    et Commentarium; what I have to say about Gellius in general has set forth elsewhere,
    although some corrections and amplifications will be found in the Appendix. Therefore,
    after noting that expansions of abbreviations and references already given in
    the OCT will save space not repeated here, I confine these Prolegomena (which
    I call to avoid confusion with Gellius'' preface) to certain recurrent problems
    and considerations.


    It is no part of my duty to correct my author save by way of annotation: if at
    3.10. 6 he confuses the great astronomer Aristides instead of Aristarchus, or
    at 17. 21. 23 he confuses Phormio, who early in the Peloponian War twice defeated
    the Lacedemonian fleet, with Iphrates, who destroyed a Lacedemonian mora at Lechaeum,
    I can alert the reader, but cannot save Gellius from his error, even if it be
    true and not his source. No author is infallible: Cicero, or Ad Att. 6. 2. 3 and
    12. 6a. 1. respectively, must ask Atticus to substitute Philiasos for Philiantu
    at re public 2. 8 and Aristophane for Europoli at Orator 29; he also Putallo for
    Eumeni at Pro Sestio 58, which error reaps in Gellius at 12. 13. 26. The subject
    has been well treated by Reeve 1994; for Gellius, shakiness on proper names is
    well attested (Holford-Strees 2003: 316–19, to which add 9. 4. 3 Polystphanus
    n.). Although in general I have blamed copyists for syntactical errors, he has
    been swayed by parallels in earlier Imperial authors into accepting quisque undeclined
    after suus (2. 22. 19. 18. 5).


    ¹ Housman, Manilius, v. p. xxxiii, ait too rarely heeded.'
