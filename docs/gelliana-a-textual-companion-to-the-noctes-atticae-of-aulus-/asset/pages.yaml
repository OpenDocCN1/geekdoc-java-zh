    v. 13. Between the ninth and tenth positions in the verse, the hiatus causa $^{11}$
    Ennium entails a pause as before the παρὰ προδοκιάν of Plaut. Curc. 355 almam
    meam nutricem Herculem, who cannot be envisaged when serving Omphale, and the
    emphatic words of Naev. com. u. 52 R. (Ribbeck’s iube tu impairs in seno alto
    nam iubet destuiti anchoris, if forso they would never be needed again, Plaut.
    443–4 nami quidem hercle oration $^{11}$ Oedipo | opūst coetnec (‘for your language,
    it would take Oedipo to make sense of it).$^{19}$ But at number ten, a special
    prize for that grand old-timer—wait for it–Ennius’ suits the expository style
    of the preceding verses. Yet Carnot’s transposition imports three varieties better
    not introduced: a line without caesura (note 9), causing its genitive (c. Otto
    Skutsch in Ann. 300), and breach of the ‘Lange-Strzelecki Law’ (2007: 203, 409–10),
    i.e. the Latinic poets’ anti-Porsian preference for word–final — before — at verse-end.
    Better is Müller’s proposal to place antiquitatis cause.

    However, Uwe Dubieznij unbound$^{20}$ finds the fundamental difficulty to lie
    not in metre but in sense, that at the end of the second century more antiquity
    without merit should a poet younger than Naevius and Plautus whose achievements
    in comedy lagged well behind those others; from Terence, in 166 BC—three years
    after Ennius’ death and over sixty years for Volacius ranking–list—invokes as
    authorities at Andr. 18 ‘Naevium Plautum Ennium’, only Nonius mentions him as
    a comic poet. For reason he proposes to retain the transmitted word-order with
    Liutium for Ennium. Certainly, if the last word of the line had been lost, that
    would have been the supplement; as it is, the idea deserves serious consideration.
    Liuvi Andronicus the oldest of all


