    occupatum), we may fall back on the residual presence of [m] as Ann. 330, 514.
    The other examples adduced by Ax 1982 are so easily amended to pass for evidence.

    $^{20}$ The paper was passed on to me with permission Stefano Rocchi, who (pers.
