    Marshall better to abandon homophony and start from the lectio difficior, restoring
    the attested *mihei* (see ThLL v/2. 254. 40–1); the rule thus becomes that genitives
    do not take E and datives do. Yet even so, the dative lacks a marker; Damstè’s
    conjecture is implausible as a whole, I accept his verb, though not its position,
    for *mihi mitte* is unacceptable without the colon (Col. Fam. 7. 24. 2, Mart.
    2. 85. 4), initially the pronoun would be emphatic: ‘send it to *mē*¹⁹


    +   **13. 29. 2.** Although later in the chapter Gellius will reverse the order
    of qualified and qualifier, *multis mortalius* here, not only following soon after
    the quotation followed by *hominibus multis*, is better taken as a transposition
    of two words with the same initial letter.


    +   **13. 20. ab aspectu.** The inconnificity of the prefixed noun with gerund
    has disconcerted some scholars: Jacoby wondered why Gellius had not written *ab
    aspectu*, Bothe 1824: i. 134 proposed *a spectu*, and the pseudo-Petronian glosses
    (Beck 1861: 5, Reiffersch 1861: 10) substituted *a specto*. What parallelism would
    require none of these, but *a(b)* *speciendo*; Gellius, preferred to use an everyday
    word, and was not committed to consistency to write *a(b)* *spectando*.


    +   **6. depinpti.** Although depinpxit, making the comment aside, already stood
    exemplar, editors of Gellius have allowed the better scholar to know the better
    reading; I have complied with their courtesy, since I and T are almost identical
    in rustic capitals.


    ¹⁹ Bernardi Perini 1982: 24–5 = 2001: 139–40, having toyed with *(mihi*) studeas,
    preferred (*huic*) *mei*, the demonstrative marking the case as in *hi magnei*;
    in neither reading is the omission explicable, and unlike other expressions in
    which *hic* marks case or gender *huic* *mei* is not in itself a credible locution.'
