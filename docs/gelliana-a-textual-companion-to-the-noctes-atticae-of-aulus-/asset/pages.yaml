  md: '# Prolegomena


    increasing implausible jerry-building. That common feature I shall call by its
    familiar name of ictus, rather than fangle a new term such as principatus.


    The argument that Latin accent, at least in classical times amongst the educated,
    must have been tonic and not dynamic (and therefore could have no more played
    with ictus than the Greek) because it is so described by the grammarians, who
    knew no other terms, is sufficiently refuted by the use of such language in relation
    to the undoubtedly dynamic English and Scots accent by Hume c.1617: fos. 31–32’
    = 1780: 22–3; ‘we have the same accents quhilk the great hate, acute, circumflex,
    and grave.... The circumflex arises the syllable, quheron it sits... The circumflex
    accent both lives, and the syllables that it possesses, etc.¹¹⁴ On the whole question
    of Latin and Italian accent since Nishimura 2014.


    No better is the argument that the rules governing word-breaks cannot be motivated
    because they are sometimes broken, as if (for) Italian senarii, in respect to
    accent, as is the regular in regard that Schiller’s acute trimeters in Die Frankfurt
    Act II, vi-viii or Goethe’s in Faust II, Act III; such a verse as petunt, pique
    in quiibriant pecuniam (Plautus, Rudens 14), violation of Mayer’s Law that it
    is, but that the law has no other cause than the accent.¹¹⁵ but that Roman poets
    admitted rhythmic variety even with their Italian successors from time to time
    the normally iambic rhythm of the decencasillabo by placing a word-accent on the
    fourth (and seventh) syllables: Tra me si va nell’eterno dolce (Dante, Inferno
    3), Nel vario stile in che piè e ragione (Petarch, Canzoniere 1. 5); il Saracino,
    e nel viso la guata (Ariosto, Orlando furioso 1, 15).¹¹⁶ this disrupted rhythm
    had fallen out of favour by Tasso’s day (in the nineteenth century poesia d’oro,
    La arte poetica di Orazio 32. 1); an opposite alteration in Roman taste changed
    the preferred cadence of the hexameter from quae frequentius de Troiae primus
    ab or, delaying the coincidence of ictus and accent.


    ¹⁶ That accented syllables rise in pitch is even less true as a general statement
    in Scotland than England. Hume’s assertion that [‘Scots’]... hes almost no use
    of the circumflex [‘English] had great use of it may refer to the vowels heard
    in England and already shortened in Scotland, e.g. in head and beat (I owe this
    suggestion to Professor Jeremy Smith of the University of Glasgow).


    ¹⁷ As some must, e.g. the Lange-Strzelecki (Is. 15, 24 i 1 v 13).'
