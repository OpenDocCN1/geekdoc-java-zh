    antithesis: *facitor* (μρῶν μέν γίνεσται ἢ βόλ)—ferire; sed cum (ὅταν δὲ)—est,
    tum si (ἐάν μέν)—corrumpit, at si (ἐὰν δὲ)—iceris. in its entirety quod—potest,
    the particle expected is not autem but emim; although autem may append an explanation
