  md: '# Prolegomena


    xiii


    at 20. 7. 2 are recorded only by Wouwerius, whom Hertz therefore credits them.¹14
    In my apparatus I allow Scioppius include only those readings that were not taken
    from his predecessors and have not been eliminated as present in known manuscripts.


    I have quoted translations either to credit the first person who be shown to have
    correctly understood a passage or to locate the source of a widespread misinterpretation;
    for that reason the names of the eighteenth-century translators Verteuil, Walstertern,
    Afanasij, and Beloe appear more frequently than might be expected.


    Since the ascension of ictus to positions in Latin metres, and the allocation
    to accent of a part in the disposition of words, do not pass without challenge,
    I defend and explain them briefly. Precisely because Latin verses are to be read
    according to the natural word-accents (*Musae quae pedibus magnum pulsatis Olympus;
    Aenadum genetrix, duoque hominumque soluptas; ara iumque, Troiae quae primus ab
    oris, noticulis pedibus magnum, Aenadum genetrix, can Troidae*) the rules of word-disposition
    create perceptible patterns, as inscriptions show, to subliterate poets who did
    not understand the quantitative measures in which they tried to write, and adopted
    by Commodian for similarly unclassified readers whether or not he knew better.
    Even amongst the educated NA 6. 7 implies a relation between accent and princes
    (Garcea 2013: 250); this is sometimes one of coincidence and sometimes of conflict.
    The question is whether the rules, which do not match those of Greek, were adopted
    out of preference for creating certain patterns or were devised for some other
    reason and merely had that effect per accidents. That position was itself perceptible,
    by the senses or by intellect, so that in the line It Italiam pâto frogus Laquinaque
    uén the unaccented syllables I -am to -gus and the accented syllables were recognized
    as sharing a feature in the others, in my view excels alternative explanations
    even in the heliocentric model of the solar system did geocentric, which then
    the phenomena had to be saved by increasingly complex and


    > ¹⁴ References from Gronovius to ‘F’ or ‘Fuv’. indicate independent knowledge,
    possibly from ‘emiquod recto cum divers codicibus collatum’ that Lucas Gentmann
    (1625–82) reported finding in Rome (letter to J. F. Gronovius, iis seris Pascalibus
    = 31 Mar. 1652 NS, in Jac. Gronovius 1706. sig. ***4]), though it is strange he
    did not know it was Orsini’s. Some information from Y came from Muretus’ letters


    > ¹⁵ Principles denotes a long in metres resolvable but never ancest (West 1982:
    18).'
