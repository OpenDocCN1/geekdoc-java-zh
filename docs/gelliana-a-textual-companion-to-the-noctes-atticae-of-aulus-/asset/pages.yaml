    with the texts of pagan authors, e.g. laudative codit post paulum graffiti christi
    (for ponti, viying monstrous heresy) in the eleventh-century manuscripts Brussels,
    KBR 10012 and Leipzig, UB 1465 in Manil. 4. 422 and iturine natus (for maius)
    in the 5 at 182, (see Houseman ad loc.); besides Graia for Graia (so 20. 1. 20
