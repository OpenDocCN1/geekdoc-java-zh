  md: '# Conventions


    In speaking of ‘Homer’ I take no position on the Homeric Question, but follow
    the general practice of ancient authors of thus calling the blind bard to whom
    the *Iliad* and the *Odyssey* were attributed, paying no more attention to occasional
    ancient and frequent modern doubts whether he wrote both or either than the archaic
    and early classical opinion that assigned him the Theban and Trojan Cycles as
    well. Nevertheless, for brevity’s sake, and to minimize the use of this *façon
    de parler*, I cite those poems by Greek letters, capital for the *Iliad*, lower-case
    for the *Odyssey*.


    Quotation-marks round an author’s name indicate that the authenticity of the work
    quoted is in dispute. The fourth book of *Stagemata* has not been conclusively
    vindicated for Frontinus, *De mundo* and *De Platone* for Apuleius, but they have
    their defenders, who in the latter case are currently in the ascendant. Also in
    doubt, and in the English-speaking world under a dark cloud, remains *Prometheus
    Vinctus*, which whether or not it is by Aeschylus I admire, though rather in the
    manner of Milton than de Marx.


    When I write ‘cf.’ I mean ‘compare’, not (as some people do) that what I cite
    is wrong; if I think so I say so.'
