    **16. diligentiae.** If Tius breaks Seius’ limb, the principle of talio (says
    Favorinus) lets Seius do the same to Tius, but only the same; hence, if the injury
    was unintentional, the retaliation must be unintentional, which is of course impossible.
    With the transmitted reading licentiae, Seius is denied the right to lash out
    and maim Tius at will, even if he seeks to do no more than he suffered the law
    forbids such calibration. Madvig’s emendment not only clears that the law denies
    Seius the right to take care when Tius had not, but affords a more natural antithesis
    between the abstracts and clarifies the structure of the passage: the problem
    is first stated at large ($15) and intentional ($17) before the two cases are
    recombined in $18. Hertz’s defence of licentiae (1873: 86–7) as looking forward
    to the as yet uncommented section disrupts the structure and muddles the thought.


    **28. uectabulum, 30. uectabulum.** Finding the change of word incredible, and
    having encountered uectabulum nowhere else in Tertullian, Marshall imposed the
    latter on $28 and banished the former from the Latin language; Gamerle, finding
    uectabulum confirmed by Nonius, and agreeing that Gellius must have used the same
    word in both places, ousted uectabulum in his favour at $30. However, variation
    is no more incredible in the man who could write, far more obtrusely, pari crassamento
    longitudinis in $17. 9–6.


    **31. insubide.** The transmitted uide makes no sense, such tinkering as (id)
    uide pride (Praecicus 1650: 730: 9–12) or ipsus/ipide ou tu uideris (Boot 181:197)
    only a poor one. Against Heraeus’ emendment Marshall proved that one would have
    expected insubide, but non omnine omnnes, me Faurine shows Caecilius to stating
    Favorinus’ position in order to refute it; Gellius, unlike Seneca, he uses the
    second-person inquis that might have marked the hypophora. His either enim is
    enquired on objection-introducing αλλὰ γαμπ³, or it marks the transition from
    morph-the port for his injury⁴


    **40. siqui.** A simpler correction to siquis → qui → cui; would entail a two-stage
    correction requuis qui = elsewhere Gellius uses qui =


    > ³ Denison 1954: 104–5; for an actual objection Xenophon Anab. 7. 7. 35. Here,
    Favorinus would be objecting, not to what has been said, but to Caecilius’ theme,
    which is the perfect justice, in their day, of the Twelve Tables.


    > ⁴ Both this use of sed enim (for which cf. 1. 7. 18, 3. 3. 14, 11, 18), and
    the frequent sense ‘on the contrary; recall αλλὰ γαμπ (Denniston 1954: 105–7).'
