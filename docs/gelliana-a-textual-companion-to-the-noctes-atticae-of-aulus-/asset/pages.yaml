  md: '# Prolegomena xv


    In the pentameter, where such a pattern as fällt sie melódisch heráb was virtually
    impossible in Latin.¹⁸ my reason cannot explain why the disyllabic ending achieved
    pre-eminence, and in the Ars amatoria exclusivity; my ear tells me that the accentual
    pattern cármine cóctus ámet applies a gentler brake to the couplet before the
    now compulsory pause than flórida uér ágeret, Taurus álat Cílicas, and even ánte
    cupidinibus. Those who can judge only by reason had best leave poets alone.


    Addendum to p. xii. For Orsini’s use of ''v.c.'' see Nolac 119. Some of his and
    Chacón’s notes reappear in Milan, Bibl. Ambros. MS I 129 inf., 335r–367r, merged
    with others including indoctum 1. 22. 11 anticipating Falster, 10. 24. 5 edi Pantanus,
    {pacisci} 20. 11(10). 9 perhaps worth considering.


    ¹⁸ To be sure, poets might have bidden the emperor (or made Jupiter do so) áurea
    saecla reducúc; but they did not.'
