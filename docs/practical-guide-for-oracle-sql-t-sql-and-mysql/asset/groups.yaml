    | | YEAR (p) 2017 |


    # Boolean Data Type


    Table 2.4 Boolean data types for the three systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|

    | Boolean | CHAR(1) (0 or 1) | BIT 0 or 1; Not NULL | BOOLEAN, BOOL 0 or 1 |


    # Summary


    Chapter 2 covers several data types for the three systems.


    - Character data types

    - Number data types

    - Date and time types in the three systems

    - Boolean data type


    Although this chapter is short it takes time to get familiar with all those types.
    When you study Chapter 5 “Creating Databases and Tables” you will use data types
    for columns.


    In the next chapter we will install Oracle 12c, SQL Server 2016 and MySQL 5.7
