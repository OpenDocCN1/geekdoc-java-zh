    # 带 HAVING GROUP BY


    问题：编写一个查询统计拥有三个员工的部门。


    答案 (Oracle & MySQL):


    ```sql

    SELECT COUNT (Employee_ID), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    HAVING COUNT(Employee_ID) = 3;

    ```


    答案 (T-SQL):


    ```sql

    SELECT COUNT (Employee_ID) AS ''Number of Employees'', Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    HAVING COUNT(Employee_ID) = 3;

    ```


