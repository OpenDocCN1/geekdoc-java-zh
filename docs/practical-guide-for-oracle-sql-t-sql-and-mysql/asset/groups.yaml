    \n# Summary\n\nChapter 12 covers the following:\n\n- Exporting Oracle data from\
    \ a query result\n- Exporting SQL Server data from a query result\n- Exporting\
    \ MySQL data from a query result\n- How to import data to an Oracle table.\n-\
    \ How to import data to a SQL Server table.\n- Using a load script for SQL Server\
    \ data import.\n- How to import data to a MySQL table.\n\n# Exercise\n\n12.1\n\
    \nExport records in Employees table to a csv file. Create a new table or delete\
    \ the records in the Employees table. Using the csv file to import data to the\
    \ table.\n\n# Chapter 13\n\n# Stored Procedures\n\n# What is a Stored Procedure\n\
    \nWhen you create a useful query in your working place it's possible that you\
    \ need to run it again. For example, you may need to run a monthly sales report\
    \ at the beginning of a month. Stored procedures can do that job for you. You\
    \ can save the query in a stored procedure and schedule a task to run the job\
    \ automatically. A stored procedure usually has three parts:\n\n- Declaration\n\
    - Execution\n- Exception (Optional)\n\n# A Simple Stored Procedure\n\nSyntax:\n\
    \n```sql\nCREATE [OR REPLACE] PROCEDURE proc_name (parameter1, parameter2 ...)\n\
    is (Oracle)\nAS (SQL Server)\n[declaration part]\nBEGIN\nexecutable part\n[EXCEPTION]\n\
    exception part\nEND;\n```\n\nLet us create a stored procedure to count row numbers\
    \ in the regions table. There is no input parameters and output values.\n\n# Steps\
    \ to Create an Oracle Stored Procedure\n\n- Enter SQL code in the query editor.\n\
    - Run the code to create a stored procedure.\n- Enter EXEC proc_name to run the\
    \ stored procedure.\n\n- To display message you need to SET SERVEROUTPUT ON and\
    \ using dbms_output.put_line().\n\nTable 13.1 Comparison for a simple stored procedure\n\
    \n| Oracle PL/SQL | SQL SERVER T-SQL | MySQL |\n| :--- | :--- | :--- |\n| SET\
    \ SERVEROUTPUT ON; | CREATE procedure p1 | DELIMITER // |\n| CREATE OR REPLACE\
    \ procedure p1 | AS | CREATE procedure p1() |\n| IS | BEGIN | SELECT(*) |\n| num\
    \ INT; | DECLARE @num INT; | FROM regions; |\n| SELECT count(*) INTO num | SET\
    \ NOCOUNT ON; | END; |\n| dbms_output.put_line(num); | FROM regions = count(*)\
    \ | // |\n| END; | PRINT @num; | CALL p1(); |\n| EXEC p1; | END; | |\n\n![](img/86805baec19af0039b39fad6b4ce02e0_188_0.png)\n\
    \n# Steps to create a SQL Server Stored Procedure\n\n- Enter SQL code in the query\
    \ editor.\n- Run the code to create a stored procedure.\n- Declare variable(s)\
    \ under BEGIN keyword.\n- Enter EXEC proc_name to run the stored procedure.\n\
    - Using SET NOCOUNT ON.\n\n![](img/86805baec19af0039b39fad6b4ce02e0_189_0.png)\n\
    \nFigure 13.2 a simple SQL Server Stored Procedure\n\n# Steps to Create a MySQL\
    \ Stored Procedure\n\n- Create a delimiter like // or $. The delimiter is used\
    \ to complete an SQL statement.\n- Enter SQL code in the query editor.\n- Run\
    \ the code to create a stored procedure.\n- Enter CALL proc_name() to run the\
    \ stored procedure.\n\n![](img/86805baec19af0039b39fad6b4ce02e0_189_1.png)\n\n\
    Figure 13.3 a simple MySQL procedure\n"
