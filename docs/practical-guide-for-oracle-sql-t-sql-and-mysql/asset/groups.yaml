    # 第 2 章

    数据类型


    你在第一章中已经学习了表格由许多列组成。在设计或修改数据库时，理解不同的数据类型非常重要。主要有三种数据类型：字符、数字和日期/时间。


    # 字符数据类型


    表 2.1 三种数据库系统的字符数据类型


    | 数据类型 | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | 固定长度字符 | CHAR(n) 最多 2000 个字符 | CHAR(n) 最多 8000 个字符 | CHAR(n) 最多 255 个字符 |

    | 适用于任何语言的 NCHAR | NCHAR(n) 最多 2000 个字符 | NCHAR 最多 4000 个字符 | NCHAR(n) 最多 65,535
    个字符 |

    | 可变长度字符串 | VARCHAR2(n) 最多 4000 个字符 | VARCHAR(n) 最多 8000 个字符, VARCHAR(max) 最多
    2097 亿 | VARCHAR(n) 最多 255 个字符 |

    | 适用于任何语言的 NCHAR2 | NCHAR2(n) 最多 4000 个字符 | NCHAR2(n) 最多 4000 个字符, VARCHAR2(max)
    最多 536 亿 | NCHAR2(n) 最多 65,535 个字符 |

    | 适用于任何语言的 TEXT | TEXT 最多 4GB | TEXT 最多 4000 个字符 | TEXT 最多 65,535 个字符 |

    | | RAW(n) 二进制数据，最多 2000 字节 | BINARY(n) 固定二进制数据，最多 8000 字节 | MEDIUM(n) 最多 1600
    万 |

    | 字符大对象 | NCLOB 最多 4GB | CLOB 变宽，最多 8000 字节 | LONGTEXT 最多 4GB |

    | 二进制大对象 | BLOB 最多 4GB | VARIARY(max) 变宽，最多 2GB | LONBLOB 最多 4294 万 |

    | | IMAGE 变宽，最多 2GB | ENUM(a, b, c, ...) 最多 65535 个值 | SET 最多 64 个值 |


    固定长度字符和可变长度字符有什么区别？


    固定长度字符——当你创建固定大小的内容（如电话号码、社会安全码 SSN）时，CHAR 是很好的选择。


    可变长度字符——许多字段是可变长度。当你为名字创建 `VARCHAR(30)` 或 `VARCHAR(32)` 时，由于每个人的长度不同，你需要使用 VARCHAR
    或 VARCHAR2。如果一个名字是 "Peter"，在表中只存储了 5 个字符（5 字节），而不是 30 个。如果我们对名字使用 `CHAR(30)`，则所有名字都将存储在
    30 个字符中。显然，这将浪费大量的存储空间。


    # 数字数据类型


    表 2.2 三种数据库系统的数字数据类型


    | 数据类型 | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | 小整数 | NUMBER(3) | TINYINT TINYINT(n) 0 到 255 | 0 到 255 | 0 到 255 UNSIGNED |

    | 中等整数 | NUMBER(5) -32,768 到 32,767 | SMALLINT SMALLINT(n) -32,768 到 32,767 |
    0 到 65,535 | 0 到 65,535 UNSIGNED |

    | | | MEDIUM(n) -8,388,608 到 8,388,608 | 0 到 16,772,215 UNSIGNED |

    | 32 位整数 | NUMBER(10) -2,147,483,648 到 2,147,483,647 | INT(n) -2,147,483,648 到
    2,147,483,647 | | |

    | | NUMBER(38) -9,223,372,036,854,775,808 到 9,223,372,036,854,775,808 | BIGINT
    BIGINT(n) -9,223,372,036,854,775,808 到 9,223,372,036,854,775,808 | | |

    | | | | REAL(n, d) | |

    | | | 浮点数 -3.40E+3 到 3.40E+8 | 小浮点数 n——最多 d 位小数 | |

    | | | SMALLMONEY -2,174,368 到 2,174,368 | DOUBLE(n, d) 大浮点数 n——最多 d 位小数 | |

    | | | MONEY -922,333,203,685,477,580 到 922,333,203,685,477,580 | DECIMAL(n, d)
    | |

    | | | | DECIMAL(p, s) NUMERIC(p, s) 存储为字符串 | -10^p + 1 到 10^p n——最多 d 位 | |

    | | | | | p 从 1 到 38 | |

    | | | | | s 从 -8 到 12 | |


