    # Preface


    Databases are used everywhere. They effect on our daily lives widely. Online business
    companies use databases to store critical data for their products and users; Doctor
    offices use databases to keep patient, pharmacy and insurance information; Banks
    use databases to track millions of financial transactions.


    Relational database management systems (RDBMS) have become the standard database
    type from 1980s. The most popular relational database management systems in the
    world are Oracle, SQL Server and MySQL. To get data or manipulate data from database
    systems developers and database administrators use Structured Query Language (SQL).


    I have worked on Web applications using Oracle and MySQL on the backend. In order
    to display important data I write SQL statements to access databases in php or
    other development tools. I also use SQL to create databases or update database
    structures. SQL is so powerful that I can process millions of records in seconds.


    As a database administrator I have been working on Oracle, SQL Server and MySQL
    for decades. Although the basic SQL statements for Oracle, SQL Server and T-SQL
    are similar to each other, some functions and styles are quite different. I often
    need to work with different database systems at the same time and it takes time
    for me to check SQL syntax for the three systems. There are a lot of SQL books
    available in the market, but it is very hard to find a practical SQL book comparing
    the differences between the three major systems. That''s why I want to write this
    reference book for Oracle, SQL Server and MySQL.


    # Why Learn SQL?


    - SQL is one of the most desirable skills

    - SQL is used by all types of career fields

    - You can use SQL to ask about your database

    - You can get useful reports from SQL statements

    - You can import data to a database

    - You can export data from a database

    - You can embed SQL to other programming languages


    # Who This Book Is For


    This book is for beginning and intermediate SQL developers, database administrators,
    database programmers and students. It starts from database concepts, installation
    of database management systems, database creation and datatypes. It introduces
    basic and advanced SQL syntax with side-by-side examples in Oracle, T-SQL and
    MySQL.


    # How to Use This Book


    To run the examples from this book you need to install the following database
    systems and development tools:

    - Oracle 11g or 12c

    - Oracle SQL Developer

    - SQL Server 2012 or above

    - SQL Server Management Studio 2012 or above

    - MySQL Server 5.7

    - MySQL Workbench 6.3


    All of the above software can be downloaded from Oracle.com and Microsoft.com


    # Acknowledge


    I wish to express appreciation to the Science Publisher editors who have supporting
    this book and made it a reality. My deepest expression of gratitude goes to my
    mom who has been learning for 30 years after her retirement.


