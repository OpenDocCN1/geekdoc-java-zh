    ## Order of Arithmetic Operators


    Priority Level 1: % Modulo / * Multiplication

    Priority Level 2: + Addition – Minus


    ## General Rule


    Modulo operator, multiplication operator and division operator are calculated
    first then addition and minus operator are processed. In order to change the priority
    we can add parentheses.


