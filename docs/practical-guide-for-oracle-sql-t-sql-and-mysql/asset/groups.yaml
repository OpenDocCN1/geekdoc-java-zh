    \nFigure 4.20 Testing a SQL statement\n\n# Summary\n\nChapter 4 covers the following:\n\
    \n- Introduction to SQL Plus\n- Introduction to MySQL Command Line Client\n- Installation\
    \ of Oracle SQL Developer\n- Installation of SQL Server Management Studio\n- Installation\
    \ of MySQL Workbench\n\nNow you are ready to create databases and tables in the\
    \ next chapter.\n\n# Exercises\n\n# 4.1\n\nInstall SQL Developer, SQL Server Management\
    \ Studio and MySQL Workbench on your computer based on your need. If you want\
    \ to test SQL statements in the three database systems then install them all on\
    \ your computer. Test each tool by running a SQL command.\n\n# 4.2\n\nView the\
    \ databases and tables in Oracle SQL Developer, SQL Server Management Studio and\
    \ MySQL Workbench.\n\n# Chapter 5\n\n# Data Definition Language (DDL)\n\nWe have\
    \ installed the database systems and development tools in Chapter 3 and Chapter\
    \ 4. Now we are ready to create databases and tables.\n\nSQL statements are divided\
    \ into three main groups:\n\n- Data Definition Language (DDL)\n- Data Manipulation\
    \ Language (DML)\n- Data Control Language (DCL)\n\nBelow is the statement summary\
    \ for DDL, DML and DCL.\n\n| Table 5.1 DDL, DML and DCL |\n| Language | Statements\
    \ |\n| --- | --- |\n| Data Definition Language (DDL) | CREATE DROP ALTER RENAME\
    \ TRUNCATE | To Create objects in the database / To delete objects from the database\
    \ / To change database structure / To rename a database object / To remove all\
    \ records from a table |\n| Data Manipulation Language (DML) | SELECT INSERT INTO\
    \ UPDATE SET DELETE FROM | To retrieve data from a database / To insert data into\
    \ a table / To update data in a table / To delete rows from a table |\n| Data\
    \ Control Language (DCL) | GRANT REVOKE | To grant privileges to a user / To revoke\
    \ privileges from a user |\n\nWe cover Data Definition Language (DDL) in this\
    \ chapter. Data Manipulation Language (DML) and Data Control Language (DCL) will\
    \ be discussed in the next chapter.\n\n## Data Definition Language Statements\n\
    \n### Creating a Database\n\nWe can create a database in two ways:\n\n- 1. Using\
    \ SQL Command\n- 2. Using Graphic User Interface (GUI) Tools\n\n# 1. Using SQL\
    \ Commands to Create a Database\n\nSyntax\n\n```\nCREATE DATABASE Database_Name;\n\
    ```\n\nSteps to Create a Database in Oracle:\n\n- 1. Login to Oracle SQL Plus\
    \ as system user\n2. At the sql prompt enter:\n\n```sql\n> CREATE USER TEST_DB\
    \ IDENTIFIED BY pw;\n```\n\nNote: Oracle's user name acts as database name. We\
    \ created a user \"TEST_DB\" with password \"pw\".\n\n- 3. Grant privileges to\
    \ the user.\n\n```\nSql> GRANT CONNECT, DBA TO TEST_DB;\n```\n\n- 4. Create all\
    \ the objects like tables under the user.\n\nSteps to Create a Database in SQL\
    \ Server:\n\n- 1. In the SQL Management Studio query worksheet enter:\n2. Run\
    \ the query and refresh Connect pane.\n3. The TEST_DB database is created in the\
    \ Connect pane.\n\n```\nCREATE DATABASE TEST_DB;\n```\n\n![](img/86805baec19af0039b39fad6b4ce02e0_60_0.png)\n\
    \nFigure 5.1 Creating a database in SQL Server\n\nSteps to Create a Database in\
    \ MySQL:\n\n- 1. In the MySQL Workbench query worksheet enter:\n\n```sql\nCREATE\
    \ DATABASE TEST_DB;\n```\n"
