    \n# MySQL AUTO_INCREMENT 示例\n\n第 1 步——创建一个名为 STATE 的表，并设置主键 AUTO_INCREMENT。初始数字和间隔值默认为\
    \ 1。\n\n```sql\nCreate TABLE STATE (\n  ID int NOT NULL Primary Key AUTO_INCREMENT,\n\
