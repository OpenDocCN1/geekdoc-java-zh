    ## Using Data from an Existing Table to Create a Table


    Syntax (Oracle & MySQL)


    ```

    CREATE TABLE Table_Name AS

    SELECT ... FROM

    ```


    Syntax (T-SQL)


    ```

    SELECT ... INTO Table_Name

    FROM Original_Table

    ```


    Question 1: Write a query to create a table Emp using the Employees table and
    having the employees who were hired after January 1st 2017.


    Answer in Oracle SQL:


    ```

    CREATE TABLE Emp AS

    SELECT First_name, Last_Name

    FROM Employees

    WHERE Hire_date >= ''01-JAN-2017'';

    ```


