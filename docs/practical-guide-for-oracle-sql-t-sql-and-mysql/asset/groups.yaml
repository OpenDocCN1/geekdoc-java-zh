    # GROUP BY and HAVING Clause


    The HAVING statement is used with the aggregate functions to group data from a
    column. HAVING clause is used in a GROUP BY statement. It sets conditions on group(s).
    HAVING clause is used in SELECT statement.


    # Syntax


    ```sql

    SELECT Aggregate Function (column_name)

    FROM tables

    [WHERE conditions]

    GROUP BY column_name

    [HAVING conditions]

    [ORDER BY column(s) [ASC | DESC]];

    ```


    # GROUP BY with AVG () Function


    Question: Write a query to find average salary for each department.


    Answer (Oracle & MySQL):


    ```sql

    SELECT AVG (salary), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```


    Answer (T-SQL):


    ```sql

    SELECT AVG (Salary) AS ''Average Salary'', Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

