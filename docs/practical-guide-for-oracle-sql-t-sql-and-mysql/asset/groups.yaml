    ## Records (Rows)


    Each table consists of one or more records (rows).

    For example, the COUNTRY table has the following rows:


    | COUNTRY_ID | COUNTRY_NAME | REGION_ID |

    | --- | --- | --- |

    | AR | Argentina | 2 |

    | AU | Australia | 3 |

    | BE | Belgium | 1 |

    | BR | Brazil | 2 |

    | CA | Canada | 2 |

    | CH | Switzerland | 3 |

    | CN | China | 3 |

    | DE | Germany | 1 |


    Figure 1.3 Record examples


    ## Primary Key


    Each table can have only one primary key.

    For example, the COUNTRY table has a primary key COUNTRY_ID.


    ## Foreign Key


    Database tables might be related by (foreign key) common column(s).

    For example, Location_ID is the common column for Departments and Locations tables.


    | department_id | int | PK | location_id | int | PK |

    | --- | --- | --- | --- | --- | --- |

    | department_name | text | | street_address | text | |

    | manager_id_per_unit | decimal(6,0) | | postal_code | text N |

    | location_id | decimal(4,0) | | city | text |

    | Locations_location_id | int | FK | state_province | text |

    | | | | country_id | text |


    Figure 1.4 Foreign key example


    ## NULL


    Null value is a field with no value. It is different from a zero value and it
    has been left blank during record creation.


    ## Constraints


    Constraints define rules to restrict what values can be stored in columns. This
    assures the correctness of the data in the database. For example, we can set a
    primary key for a table so that there are no duplicated rows in the table.


    Common Constraints


    - NOT NULL—A column does not accept NULL values.

    - DEFAULT—A default value to a column when no value is specified to a column.

    - UNIQUE—No duplicated values in a column.

    - Primary Key—A column or combination of columns that uniquely defines a row.
    The primary key column cannot contain a NULL value.

    - Foreign Key—A foreign key in one table points to a candidate key in another
    table.

    - CHECK—Check whether the value is valid or not.


    ## Data Integrity


    - Entity Integrity—No duplicate records in a table.

    - Referential Integrity—Referential integrity is violated when deleting a row
    that is referenced by a foreign key in another table.


    For example, a user cannot delete the Marketing department from the Departments
    table, as there are two employees working for the Marketing department (#20).
    Deleting the Marketing department violates the referential integrity. See the
    records below:


    | DEPT_ID | DEPT_NAME | MANAGER_ID | LOCATION_ID |

