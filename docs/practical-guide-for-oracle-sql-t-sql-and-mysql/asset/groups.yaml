    \n# Summary\n\nChapter 9 covers the following:\n\n- Manipulating Union, Union\
    \ All commands\n- Using INTERSECT (Oracle and T-SQL) and IN (MySQL) commands\n\
    - How to use Except (T-SQL), MINUS (Oracle) and NOT IN (MySQL) commands\n- Understanding\
    \ ROWNUM (Oracle), TOP (T-SQL) and LIMIT (MySQL) commands\n- Defining Subquery\n\
    - Using Sequence (Oracle), Identity (T-SQL) and Auto_Increment (MySQL) to generate\
    \ sequence numbers.\n\n# Exercises\n\n# 9.1\n\nWrite a query to combine the names\
    \ in the customers table with the names in the employees table.\n\n# 9.2\n\nModify\
    \ the query in 9-1 to sort the results by last name.\n\n# Chapter 10\nJoins\n\n\
    In relational database design Employee and Department are two entities. Employee\
    \ related data is saved to the Employees table while department related data is\
    \ saved to the Departments table. For linking purpose the Department_ID is created\
    \ between the two tables.\n\nIf we want to display employee names and department\
    \ names it is not possible to only use the Employees table or the Departments\
    \ table. To list the department names after the employee names we need to use\
    \ SQL JOIN.\n\nThere are four basic SQL joins: (Inner Join, Left Join, Right Join,\
    \ and Full Join. The most useful join is (Inner Join).\n\nTable 10.1 Common Join\
    \ types\n\n| (INNER) JOIN | Get records that have matching values in both tables.\
    \ |\n| --- | --- |\n| LEFT JOIN | Get all records from the table1 (LEFT table1)\
    \ and the matched records from table2 (RIGHT table2). If no match the result is\
    \ NULL from table2. |\n| RIGHT JOIN | Get all records from table2 (RIGHT table1)\
    \ and the matched records from the table1 (LEFT table2). If no match the result\
    \ is NULL from table1. |\n| FULL JOIN | Get all rows from both the table1 and\
    \ table2. |\n\nSyntax\n\n```sql\nSELECT table1.col_name, table2.col_name\nFROM\
    \ table1\n(INNER) JOIN table2 ON table1.col_name = table2.col_name;\nSELECT table1.col_name,\
    \ table2.col_name\nFROM table1\nLEFT JOIN table2 ON table1.col_name = table2.col_name;\n\
    SELECT table1.col_name, table2.col_name\nFROM table1\nRIGHT JOIN table2 ON table1.col_name\
    \ = table2.col_name;\nSELECT table1.col_name, table2.col_name\nFROM table1\nFULL\
    \ JOIN table2 ON table1.col_name = table2.col_name;\n```\n\n# Older JOIN\n\n```sql\n\
    SELECT table1.col_name, table2.col_name\nFROM table1, table2\nWHERE table1.col_name\
    \ = table2.col_name;\n```\n\n# JOIN USING clause (Oracle)\n\nSyntax\n```sql\n\
    SELECT table1.col_name, table2.col_name\nFROM table1\nJOIN table2 USING (col_name);\n\
    ```\n\nLet's use Employees and Locations tables for examples.\n\nFigure 10. Employees\
