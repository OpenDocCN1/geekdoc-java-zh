    ## Aggregate Functions


    Syntax SELECT Aggregate Function (column_name) FROM Table


    Below are the main aggregate functions to:


    - AVG(): To select the average value for certain column.

    - COUNT(*): To select the number of rows in a database table.


    # MAX()

    To select the highest value for a certain column.

    It returns the maximum value for numeric data column.

    It returns the latest date for date column.

    It returns the last records for character column.


    # MIN()

    To select the lowest value for a certain column.

    It returns the minimum value for numeric data column.

    It returns the earliest date for date column.

    It returns the first records for character column.


    # SUM()

    To select the total for a numeric column.


    # ROUND()

    To round a number to a specified decimal places.


