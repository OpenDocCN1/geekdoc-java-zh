    # Chapter 11

    Views


    A view is a virtual table. It looks like a table. A view is created in a SQL statement
    using one or more tables (views). Because views do not store data they only take
    small amount of disk space. Views can contains certain fields from a table. A
    Database administrator can create a view for non-sensitive data and set permission
    for the view to users.


    # Syntax


    ```

    CREATE VIEW view_name AS

    SELECT column(s)

    FROM tables

    [WHERE conditions];

    ```


