    # Data Control Language 5 DCL


    We mentioned in Chapter 5 that there are two main statements in Data Control Language:
    GRANT and REVOKE. Actually, we have already used GRANT statement on page 48 when
    we create database in Oracle.


    GRANT: Assigns privileges on database objects to a user. The system privileges
    can be CONNECT, CREATE. The table privileges can be INSERT, UPDATE, DELETE, or
    ALTER.


    Syntax


    ```

    GRANT system privileges TO user;

    GRANT table privileges ON objects TO user;

    ```


    In the following example, we GRANT CONNECT and DBA privileges to a user TEST_DB.

    GRANT CONNECT, DBA TO TEST_DB;


    In the following example, we GRANT INSERT privileges to a user TEST_DB.

    GRANT INSERT ON Departments TO TEST_DB;


    If you want to grant all privileges to a user you can use ALL keyword:

    GRANT ALL ON Departments TO TEST_DB;


    REVOKE: Removes privileges from a user.


    Syntax


    ```

    REVOKE privileges ON objects FROM user;

    ```


    Example:


    ```

    REVOKE DBA TO TEST_DB;

    REVOKE INSERT ON Departments TO TEST_DB;

    ```


