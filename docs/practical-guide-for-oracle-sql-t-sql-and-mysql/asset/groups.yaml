    ## 聚合函数


    语法 SELECT Aggregate Function (column_name) FROM Table


    以下是主要的聚合函数：


    - AVG():选择某列的平均值。

    - COUNT(*):选择数据库表中的行数。

    - MAX()：选择某列的最大值。返回数值列的最大值；返回日期列的最新日期；返回字符列的最后一条记录。

    - MIN():选择某列的最小值。返回数值列的最小值；返回日期列的最早日期；返回字符列的第一条记录。

    - SUM()：选择数值列的总和。

    - ROUND():将数字四舍五入到指定的位数。


