    # 第1章

    SQL 与关系型数据库简介


    关系型数据库管理系统（RDBMS）自 20 世纪 80 年代以来已成为各行业的标准数据库类型。这些系统允许用户在图形用户界面中存储和访问数据。它还允许用户设置安全规则。


    结构查询语言（SQL）是关系型数据库管理系统的标准计算机语言。SQL 有不同的方言。例如，Oracle SQL 被称为 PL/SQL，MS SQL Server
    被称为 T-SQL（事务 SQL）。


    SQL 是数据库开发者和数据库管理员极有帮助的工具。数据库开发者使用 SQL 来选择、插入和更新数据。数据库管理员（DBA）运用其 SQL 技能来支持 Oracle、SQL
    Server、MySQL 和其他数据库系统。


    本章的重点包括：


    - SQL 和数据库系统的发展简史

