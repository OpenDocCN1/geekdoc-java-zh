    # A Stored Procedure with Parameters


    Oracle Parameters


    +   - IN (optional)—To pass value(s) to a stored procedure. The values are not
    changed in the procedure. The IN keyword is optional.

    - OUT—To get value(s) from a stored procedure. The value(s) can be passed to OUT
    parameter(s) inside the stored procedure. A calling program is needed to get the
    output value(s).

    - IN OUT—To pass and get value(s) from a stored procedure.


    SQL Server Stored Procedure Parameters


    +   - IN (optional)

    - OUT | OUTPUT


    MySQL Server Stored Procedure Parameters


    +   - IN (optional)

    - OUT

    - INOUT


    # To Create an Oracle Stored Procedure with IN and OUT Parameters:


    ```

    CREATE OR REPLACE procedure get_Location_Info

    (L_ID IN NUMBER,

    L_City OUT VARCHAR2,

    L_Country_ID OUT CHAR

    )

    AS

    BEGIN

    SELECT City, Country_ID INTO L_City, L_Country_ID FROM LOCATIONS

    WHERE LOCATION_ID = L_ID;

    END get_Location_Info;

    ```


    # To Execute an Oracle Procedure with IN and OUT Parameters:


    ```

    DECLARE

    Location_City LOCATIONS.CITY%TYPE;

    Location_Country_ID LOCATIONS.Country_ID%TYPE;

    ```'
