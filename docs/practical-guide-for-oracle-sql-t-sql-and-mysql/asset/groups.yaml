    ```sql

    SELECT COUNT(Employee_ID), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```


    答案 (T-SQL):


    ```sql

    SELECT COUNT(Employee_ID) AS ''Number of Employees'', Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

