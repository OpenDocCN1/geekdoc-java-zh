    - Introduction to the brief history of SQL and relational databases.

    - Introduction to SQL standards.

    - The basic terms of relational database management systems.

    - Introduction to Oracle, SQL Server and MySQL versions.

    - Displaying sample entity relationship diagram used in this book.

    - Defining one-to-one relationships.

    - Defining one-to-many relationships.

    - Defining many-to-many relationships.


    # Chapter 2

    Data Types


    You have learned in Chapter 1 that tables are consisted of many columns. When
    you design or modify databases it is very important to understand the different
    data types. There are three main data types: Characters, Numbers, and Date/Time.


    # Character Data Types


    Table 2.1 Characters data types for the three database systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | Fixed-length Character | CHAR(n) Hold up to 2000 characters | CHAR(n) Hold up
    to 8000 characters | CHAR(n) Hold up to 255 characters |

    | NCHAR for any language | NCHAR(n) Hold up to 2000 characters | NCHAR Hold up
    to 4000 characters | NCHAR(n) Hold up to 65,535 characters |

    | variable-length character strings | VARCHAR2(n) Hold up to 4000 characters |
    VARCHAR(n) Hold up to 8000 characters, VARCHAR(max) Hold up to 2097 million |
    VARCHAR(n) Hold up to 255 characters |

    | NCHAR2 for any language | NCHAR2(n) Hold up to 4000 characters | NCHAR2(n) Hold
    up to 4000 characters, VARCHAR2(max) Hold up to 536 million | NCHAR2(n) Hold up
    to 65,535 characters |

    | TEXT for any language | TEXT Hold up to 4GB | TEXT Hold up to 4000 characters
    | TEXT Hold up to 65,535 characters |

    | | RAW(n) Binary data Hold up to 2000 bytes | BINARY(n) Fixed binary data Hold
    up to 8000 bytes | MEDIUM(n) Hold up to 16 million |

    | Character Large Object | NCLOB Hold up to 4GB | CLOB Variable width Hold up
    to 8000 bytes | LONGTEXT Hold up to 4GB |

    | Binary Large Object | BLOB Hold up to 4GB | VARIARY(max) Variable width Hold
    up to 2GB | LONBLOB Hold up to 4294 million |

    | | IMAGE Variable width Hold up to 2GB | ENUM(a, b, c, ...) List to 65535 values
    | SET List to 64 values |


    What is the difference between fixed-length characters and variable-length?


    Fixed-length characters—When you create a fixed size, like phone numbers, SSN,
    CHAR data is a good choice.


    Variable-length characters—Many fields have variable-length. When you create VARCHAR(30)
    or VARCHAR(32) for first name, as length is different for each person you need
    to use VARCHAR or VARCHAR2. If a first name is “Peter”, only 5 characters are
    stored in table (5 bytes), not 30. If we use CHAR(30) for first name, all the
    names will be stored in 30 characters. Obviously, it will waste a lot of storage.


    # Number Data Types


    Table 2.2 Number data types for the three database systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | Small Integer | NUMBER(3) | TINYINT TINYINT(n) 0 to 255 | 0 to 255 | 0 to 255
    UNSIGNED |

    | Medium Integer | NUMBER(5) -32,768 to 32,767 | SMALLINT SMALLINT(n) -32,768
    to 32,767 | 0 to 65,535 |

    | | | MEDIUM(n) -8,388,608 to 8,388,608 | 0 to 16,772,215 UNSIGNED |

    | Integer 32 bit | NUMBER(10) -2,147,483,648 to -2,147,483,647 | INT INT(n) -2,147,483,648
    to -2,147,483,647 |

    | | NUMBER(38) -9,223,372,036,854,775,808 to 9,223,372,036,854,775,808 | BIGINT
    BIGINT(n) -9,223,372,036,854,775,808 to 9,223,372,036,854,775,808 |

    | | | REAL FLOAT(n, d) |

    | | | Floating number -3.40E+3 to 3.40E+8 | Small floating number n—maximum of
    digits d—decimal points |

    | | | SMALLMONEY -2,174,368 to 21,744,368 | DOUBLE(n, d) Large floating number
    n—maximum of digits d—decimal points |

    | | | MONEY -922,333,203,685,477,580 to 922,333,203,685,477,580 | DECIMAL(n, d)
    |

    | | | DECIMAL(p, s) NUMERIC(p, s) Stored as a string | -10^p + 1 to 10^p – 1 n—maximum
    of digits d |

    | | | | p from 1 – 38 |

    | | | | s from -84 to 12 |


    # NUMBER (p, s) (Oracle)


    # NUMERIC (p, s) (Oracle)


    p—precision

    s—scale


    For example, NUMERIC (5, 2) including 3 digits before the decimal and 2 digits
    after the decimal.


    # DECIMAL (p, s) (T-SQL)


    # NUMERIC (p, s) (T-SQL)


    p—precision

    s—scale


    p—the number of digits that can be stored (including all digits from the left
    and right of decimal point).

    s—the number of digits to the right of decimal point.


