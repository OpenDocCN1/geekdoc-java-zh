    # # Chapter 6

    Data Manipulation Language (DML)


    We have learned Data Definition Language (DDL) in the last chapter. After creating
    a database and tables the next task is to insert data. If there are errors in
    a table we should update a record or delete a record. Data Manipulation Language
    (DML) is used to retrieve and manipulate data in SQL. The main statements for
    DML are:


    ```

    SELECT

    INSERT INTO

    UPDATE... SET

    DELETE FROM

    ```


    Let us start with INSERT INTO command. How can we select data from a table without
    data? The following INSERT INTO statements are used to add records to the tables
    in the last chapter. These statements work for Oracle, T-SQL and MySQL.


    # INSERT INTO


    **Description**—Inserts one or more records into a table


    Syntax 1


    ```

    INSERT INTO table (col1, col2, ...)

    VALUES (exp1, exp2, ...);

    ```


    Syntax 2


    ```

    INSERT INTO table

    VALUES (exp1, exp2, ...);

    ```


    Note:

    Inserting data in the same order as that in the table for the second style.


    Although INSERT INTO statements are the same for Oracle, T-SQL and MySQL but the
    date format is different:

    For example, Oracle date format is **DD-MM-YY**.


    ```

    INSERT INTO Employees

    VALUES (100,''Douglas'',''Grant'',''DGRANT'',''650.507.9844'',''23-Jan-08'',''SH_CLERK'',2600,114,50);

    ```


