    # Date and Time Types


    Table 2.3 Date and time types for the three systems


    | Oracle | SQL SERVER | MySQL |

    |---|---|---|

    | DATE Example: 25-JAN-17 | DATE Example: 2017-01-25 | DATE Example: 2017-01-25
    |

    | If we do not specify a time then it defaults to six places. | If we do not specify
