    # 前言


    数据库无处不在。它们对我们的日常生活产生了广泛影响。在线业务公司使用数据库存储关键数据；诊所使用数据库保存患者、药房和保险信息；银行使用数据库跟踪数百万金融交易。


    关系型数据库管理系统（RDBMS）自20世纪80年代以来已成为标准的数据库类型。世界上最流行的数据库管理系统是 Oracle、SQL Server 和 MySQL。开发者和数据库管理员使用结构化查询语言（SQL）在
    Oracle 和 MySQL 开发 Web 应用。为了显示重要数据，使用 SQL 语句访问数据库或更新数据库结构。SQL 如此强大，可以在几秒内处理数百万记录。作为一名数据库管理员，我在
    Oracle、SQL Server 和 MySQL 上工作了几十年。尽管 Oracle、SQL Server 和 T-SQL 的基础 SQL 语句相似，但某些功能和风格不同。市场上有很多
    SQL 书，但很难找到一本比较这三个系统差异的实战书籍。这就是我想要写这本关于 Oracle、SQL Server 和 MySQL 参考书的原因。


    # 为什么要学习 SQL？


    - SQL 是最需要的技能之一

    - SQL 被所有职业领域使用

    - 你可以使用 SQL 从数据库获取有用的报告

    - 你可以使用 SQL 向数据库导入数据

    - 你可以使用 SQL 从数据库导出数据

    - 你可以将 SQL 嵌入其他编程语言


    # 本书对象


    本书适用于初级和高级 SQL 开发者、数据库管理员、数据库程序员和学生。


    # 如何使用本书


    要运行书中的示例，你需要安装以下数据库系统和开发工具：

    - Oracle 11g 或 12c

    - Oracle SQL Developer

    - SQL Server 2012 或以上

    - SQL Server Management Studio 2012 或以上

    - MySQL Server 5.7

    - MySQL Workbench 6.3


    以上软件均可 Oracle.com 和 Microsoft.com 下载


    # 致谢


    感谢 Science Publisher 的编辑支持本书使其成为现实。向我母亲深表感谢，她在退休后已学习了30年。


