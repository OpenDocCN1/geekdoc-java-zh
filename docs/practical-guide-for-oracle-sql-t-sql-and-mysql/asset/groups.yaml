    # NUMBER (p, s) (Oracle)


    # NUMERIC (p, s) (Oracle)


    p—precision

    s—scale


    For example, NUMERIC (5, 2) including 3 digits before the decimal and 2 digits
    after the decimal.


    # DECIMAL (p, s) (T-SQL)


    # NUMERIC (p, s) (T-SQL)


    p—the maximum number of digits that can be stored (including all the digits from
    the left and right of decimal point).

    s—the maximum number of digits that can be stored to the right of the decimal
    point.


    # Oracle Number Example


    | Datatype | Input Data | Stored Value |

    | NUMBER | 634,782.59 | 634782.59 |

    | NUMBER (8) | 634,782.59 | 634783 |

    | NUMBER (8, 2) | 634,782.59 | 634782.59 |

    | NUMBER (8, 1) | 634,782.59 | 634782.5 |


