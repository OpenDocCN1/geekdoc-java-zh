    ## 1. UNION, UNION ALL


    UNION: Returns a distinct list of rows from both tables.


    UNION ALL: Returns all rows from both tables, including duplicates.


    ## 2. INTERSECT (Oracle and T-SQL), IN (MySQL)


    INTERSECT: Returns only rows that are common between two tables.


    IN: Used to check if a value exists within a set.


    ## 3. EXCEPT (T-SQL), MINUS (Oracle), NOT IN (MySQL)


    EXCEPT: Returns rows from the first query that are not in the second.


    MINUS: Oracle equivalent of EXCEPT.


    NOT IN: Used to check if a value is not in a set.


    ## 4. ROWNUM (Oracle), TOP (T-SQL) and LIMIT (MySQL)


    ROWNUM: A pseudocolumn used to limit rows in Oracle queries.


    TOP: Used to specify the first N rows of a result set.


    LIMIT: Used to limit the number of rows returned by a query.


