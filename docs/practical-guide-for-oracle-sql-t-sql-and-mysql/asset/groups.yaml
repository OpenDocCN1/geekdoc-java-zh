    # Chapter 6 Data Manipulation Language (DML)


    We have learned Data Definition Language (DDL) in the last chapter. After creating
    a database and tables the next task is to insert data, update a record or delete
    a record. Data Manipulation Language (DML) is used to retrieve and manipulate
    data. The main statements for DML are:


    **Description**—Inserts one or more records into a table


    Syntax 1

    ```

    INSERT INTO table (col1, col2, ...)

    VALUES (exp1, exp2);

    ```


    Syntax 2

    ```

    INSERT INTO table

    VALUES (exp1, exp2);

    ```


    Note: Inserting data in the same order as that in the table for example, Oracle
    date format is **DD-MM-YY**, T-SQL and MySQL date format is YYYY-MM-DD. For example,


    ```

    INSERT INTO Employees

    VALUES (100,''Douglas'',''Grant'',''DABROS.507.994'',''23-JAN-08'',''SH_CLERK'',2600,114,50);

    ```


