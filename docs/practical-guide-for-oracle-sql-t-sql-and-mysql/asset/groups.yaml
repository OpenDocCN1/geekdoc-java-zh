    表 2.4 三种系统的布尔数据类型


    | 数据类型 | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---|

    | 布尔 | CHAR(1) (0 或 1) | BIT 0 或 1；非空 | BOOLEAN, BOOL 0 或 1 |


    # 总结


    第二章涵盖了三个系统的多种数据类型。


    - 字符数据类型

    - 数字数据类型

    - 三种系统的日期和时间类型

    - 布尔数据类型


    虽然这一章很短，但熟悉所有这些类型需要时间。当你学习第五章“创建数据库和表”时，你将在列中使用数据类型。


