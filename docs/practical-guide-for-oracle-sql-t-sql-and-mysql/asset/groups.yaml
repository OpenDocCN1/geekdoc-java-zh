    SELECT AVG (salary), Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```


    Answer (T-SQL):


    ```

    SELECT AVG (Salary) AS ''Average Salary'', Dept_ID

    FROM Employees

    GROUP BY Dept_ID

    ORDER BY Dept_ID;

    ```'
