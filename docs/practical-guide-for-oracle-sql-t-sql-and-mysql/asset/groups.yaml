    # Updating Views


    Syntax (Oracle)


    ```

    CREATE OR REPLACE VIEW view_name AS

    SELECT column(s)

    FROM tables

    WHERE conditions];

    ```


    Syntax (T-SQL & MySQL)


    ```

    ALTER VIEW view_name AS

    SELECT column(s)

    FROM tables

    [WHERE conditions];

    ```


    Example (Oracle):


    ```

    CREATE OR REPLACE VIEW

    Location_US AS

    SELECT Location_ID, City, Country_ID

    FROM Locations

    WHERE Country_ID = ''US'';

    ```


