  md: 'What is the difference between fixed-length characters and variable-length
    characters?


    Fixed-length characters—When you create a fixed size field, like phone numbers,
    SSN, State, CHAR data is a good choice.


    Variable-length characters—Many fields have variable-length characters. When you
    create VARCHAR(30) or VARCHAR(32) for first name, as first name length is different
    for each person you need to use VARCHAR or VARCHAR2. If a first name is “Peter”,
    only 5 characters are stored in a table (5 bytes), not 30. If we use CHAR(30)
    for a first name, all the names will be stored in 30 characters. Obviously, it
    will waste a lot of storage spaces.


    # Number Data Types


    Table 2.2 Number data types for the three database systems


    | Data Type | Oracle SQL | SQL SERVER | MySQL |

    |---|---|---|---||

    | Small Integer | NUMBER (3) | TINYINT | TINYINT(n)

