    Hold up to 4000 characters | NCHAR(n)

    Hold up to 65,535 characters |

    | variable-length character strings | VARCHAR2(n)

    Hold up to 4000 characters | VARCHAR(n)

    Hold up to 8000 characters

    VARCHAR(max)

    Hold up to 2,097 million characters | VARCHAR(n)

    Hold up to 255 characters |

    | NCHAR2(n) for any language | NCHAR2(n)

    Hold up to 4000 characters | NCHAR2(n)

    Hold up to 4000 characters

    VARCHAR2(max)

    Hold up to 536 million characters | NCHAR2(n)

    Hold up to 65,535 characters |

    | TEXT for any language | Variable width

    Hold up to 2 GB characters | TEXT

    Hold up to 4000 characters | TEXT

    Hold up to 65,535 characters |

    | | RAW(n)

    Binary data

    Hold up to 2,000 bytes | BINARY(n)

    Fixed width binary data

    Hold up to 8,000 bytes | MEDIUM

    Hold up to 16 million characters |

    | Character Large Object NCLOB for any language | CLOB

    NCLOB

    Hold up to 4G characters | VARIARY

    Variable width binary data

    Hold up to 8000 bytes | LONGTEXT

    4G bytes |

    | Binary Large Object | BLOB

    Hold up to 4G characters | VARIARY(max)

    Variable width; Hold up to 2 GB | LONBLOB

    Hold up to 4,294 million characters |

    | | | IMAGE

    Variable width; Hold up to 2 GB | ENUM(a, b, c, ...)

    List up to 65,535 values |

    | | | SET

    List up to 64 values |'
