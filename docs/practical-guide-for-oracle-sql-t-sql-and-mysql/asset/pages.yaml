  md: '# Preface


    Databases are used everywhere. They effect on our daily lives lives widely. Online
    business companies use databases to store critical data for their products and
    users; Doctor offices use databases to keep patient, pharmacy and insurance information;
    Banks use databases to track millions of financial transactions.


    Relational database management systems (RDBMS) have become the standard database
    type from 1980s. The most popular relational database management systems in the
    world are Oracle, SQL Server and MySQL. To get data or manipulate data from database
    systems developers and database administrators use Structured Query Language (SQL).


    I have worked on Web applications using Oracle and MySQL on the backend. In order
    to display important data I write SQL statements to access databases in php or
    other development tools. I also use SQL to create databases or update database
    structures. SQL is so powerful that I can process millions of records in seconds.


    As a database administrator I have been working on Oracle, SQL Server and MySQL
    for decades. Although the basic SQL statements for Oracle SQL, SQL Server T-SQL
    and MySQL are similar to each other, some functions and styles are quite different.
    I often need to work with different database systems at the same time and it takes
    time for me to check SQL syntax for the three database systems. There are a lot
    of SQL books available in the market, but it is very hard to find a practical
    SQL book that comparing the differences between the three major database systems.
    That''s why I want to write this reference book with step step examples in the
    real working environment.


    I hope that this book can be a quick reference book for Oracle SQL, SQL Server
    T-SQL and MySQL.


    # Why Learn SQL?


    +   - SQL is one of the most desirable programming skills

    - SQL is used by all types of career fields

    - You can use SQL to ask questions about your database

    - You can get useful business reports from SQL statements

    - You can manipulate millions of records in seconds

    - You can import data to a database

    - You can export data from a database

    - You can embed SQL statements to other programming languages'
  merge: -1
