- img_proc: true
  md: '+   **Entity*


    Entity is any person, place, or thing that the data can represent in a database
    design. For example, Employees and Departments are entities. Entities are converted
    to tables at the physical design stage.


    +   **Data Type*


    SQL developers need to choose a data type for each column when creating a table.
    The common data types are boolean, integer, float, currency, string, date and
    time.


    +   **DDL*


    DDL stands for Data Definition Language. DDL commands can be used to create, modify
    database structures. Sample DDL commands are CREATE, ALTER and DROP.


    +   **DML*


    DML stands for Data Manipulation Language. DML commands can be used to insert
    data into database tables, retrieve or modify data, deleting data in database.
    Sample DML commands are INSERT, DELETE and UPDATE.


    +   **DCL*


    DCL stands for Data Control Language. DCL commands can be used to create rights
    and permissions. Sample DCL commands are GRANT and REVOKE.


    +   **Query*


    SQL developers can use a query to get data or information from one or more database
    tables.


    # Attributes


    Entity has its own attributes. For example, an Employee entity may have name,
    phone and salary as attributes.


    Types of Attributes


    Simple attribute—An attribute that cannot be divided into subparts. For example,
    employee''s age is a simple attribute.


    Composite attribute—An attribute that can be divided into simple attributes. For
    example, an employee''s name has First_Name and Last_Name.


    Derived attribute—An attribute whose value can be derived (calculated) from other
    attribute. For example, Average_Age for employees can be calculated.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Single-value attribute—An attribute contains a single value. For example, City
    or State.


    Multi-value attribute—An attribute have more than one values. For example, an
    employee can have more than one skills.


    # Tables


    Each database contains collection of tables.

    For example, the HR databases has country, customer, departments, employees, job
    and locations tables.


    ![](img/86805baec19af0039b39fad6b4ce02e0_17_0.png)


    Figure 1.2 Table examples


    +   - Fields (Columns)


    Each table consists of smaller entities called fields or columns.

    For example, The Country table has three fields (columns): Country_ID, Country_Name
    and Region_ID.'
  merge: -1
  pgno: 17
