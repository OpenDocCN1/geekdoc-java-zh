  md: '# Who This Book Is For


    This book is for beginning and intermediate SQL developers, database administrators,
    database programmers and students. It starts from database concepts, installation
    of database management systems, database creation and datatypes. It introduces
    basic and advanced SQL syntax with side by side examples in Oracle SQL, T-SQL
    and MySQL. The SQL code in this book is fully tested in Oracle 12c, SQL Server
    2012 and MySQL 5.7.


    # How to Use This Book


    To run the examples from this book you need to install the following database
    systems and developpement tools:


    +   - Oracle 11g or 12c

    - Oracle SQL Developer

    - SQL Server 2012 or above

    - SQL Server Management Studio 2012 or above

    - MySQL Server 5.7

    - MySQL Workbench 6.3


    All of the above software can be download from Oracle.com and Microsoft.com


    # Acknowledge


    I wish to express appreciation to the Science Publisher editors who have been
    supporting this book from the beginning and made this book a reality.


    My deepest expression of gratefulness goes to my mom who has been learning for
    30 years after her retirement.'
