    # ## Types of Relationships


    +   - One-to-Many Relationships

    - Many-to-Many Relationships

    - One-to-One Relationships

    - Self-Referencing Relationships


    # ## One-to-Many Relationships


    One-to-Many Relationships define the situation when each row in the table_1 has
    many linked rows in table_2. It is the most common type of relationship.


    From the Entity Relationship diagram we can see:


    The relationship between the Employees and Departments is a one-to-many relationship.
    The Dept_ID is the primary key in the Departments table and the foreign key in
    the Employees table. One DEPARTMENT_ID can relate to many rows in the Employees
    table. One department can have one or many employees; an employee is assigned
    to one department.


    The relationship between the JOB and Employees is a one-to-many relationship.
    The Job_ID is the primary key in the JOB table and the foreign key in the Employees
    table. One Job_ID can relate to many rows in the Employees table. One job title
    can be used for or many employees; however, an employee only can have one job
    title.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1 Introduction to SQL and Relational Databases


    The relationship between the Locations and Departments is a one-to-many relationship.
    The Location_ID is the primary key in the Locations and the foreign key in the
    Departments table. One Location_ID can relate to many rows in the Departments
    table. One location can have one or many departments; a department only has one
    location.


    The relationship between the Country and Locations is a one-to-many relationship.
    The Country_ID is the primary key in the Country and the foreign key in the Locations
    table. One Country_ID can relate to many rows in the Locations table. One can
    have one or many locations (States or Provinces); a location (State or Province)
    only belongs to one country.


    The relationship between the Regions and Country is a one-to-many relationship.
    The Region_ID is the primary key in the Regions table and the foreign key in the
    Country table. One Region_ID can relate to many rows in the Country table. One
    region have one or many countries; a country only belongs to one region.


    # Many-to-Many Relationships


    A record in table_1 has matching records in table_2, and a record in table_2 has
    many matching records in table_1. For example, an employee may work on one or
    more projects, and each project may have one or more employees. In this case,
    MANY employees are related to MANY projects.


    How can we build many-to-many relationship in a database system? Suppose we have
    finished two tables: Employees and Projects table. We can accomplish many-to-many
    relationships by creating two one-to-many relationships and adding a link table
    between the two tables. For example, we can create a "Emp_Project" that has a
    composite Primary Key that consists of the two primary keys from the Employees
    table and Projects table. Thus, the two-one-many relationships are:


    +   1. From Employees table to Emp_Project table: One-to-Many relationships.


    +   2. From Project table to Emp_Project table: One-to-Many relationships.


    # One-to-Many Relationships


    One-to-Many Relationships define the situation when one row in table_1 has one
    linked row in table_2.


    For example, every person has a social security number. We can create a Person
    table with name, address, phone info and a Person_2 table with social security
    number. We link the two tables with a key.


    # Self-Referencing Relationships


    A database model with a relationship to itself.


    For example, Adam (Employee_ID 101) has a manager (Manager_ID 109). By linking
    the manager ID 109 to Employee_ID 109 we know Adam’s manager is Lex Hann.'
