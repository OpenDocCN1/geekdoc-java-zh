    | TIMESTAMP (3) DD-MM-YY HH:MI:SS | TIMESTAMP Format: YYYY-MM-DD HH:MI:SS | TIMESTAMP
    Format: YYYY-MM-DD HH:MI:SS |

    | | | YEAR ( ) Format: YY (70 to 69) 1970 to 2069 YYYY: 1901 to 2155 |'
