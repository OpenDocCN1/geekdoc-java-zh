    # 4. ROWNUM (Oracle), TOP (T-SQL) and LIMIT (MySQL)


    Description: Specifies the number of records to return


    Oracle Style SELECT column_name(s)

    FROM table_name

    WHERE ROWNUM <= number;


    T-SQL Style SELECT TOP number | percent column_name(s)

    FROM table_name;


    MySQL Style SELECT column_name(s)

    FROM table_name

    LIMIT number;


    ROWNUM is a special virtual column in an Oracle Database that gets many people
    into trouble. When you learn what it is and how it works, it can be very useful.

    ROWNUM is available in a query, but is not part of the table. ROWNUM will be assigned
    the numbers 1, 2, 3, 4, ... N, where N is the number of rows row set. ROWNUM can
    be'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'used as part of the where clause of the query to return specific rows. ROWNUM
    value is not assigned permanently to a row (this is a common misconception). Queries
    that < (less than) or > (greater than) on ROWNUM will not always work; you must
    use <= (less than or equal to) or >= (greater than or equal to).

    For example,


    ```

    SELECT ROWNUM, firstname

    FROM customer;

    ```


