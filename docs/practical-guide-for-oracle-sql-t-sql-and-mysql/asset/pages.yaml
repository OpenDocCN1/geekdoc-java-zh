    | --- | --- | --- |

    | SET SERVEROUPUT ON; | CREATE procedure p1 | DELIMITER // |

    | CREATE OR REPLACE procedure p1 | AS | CREATE procedure p1() |

    | IS | BEGIN | SELECT(*) |

    | num INT; | DECLARE @num INT; | FROM regions; |

    | SELECT count(*) INTO num | SET NOCOUNT ON; | END; |

    | dbms_output.put_line(num); | FROM regions = count(*) | // |

    | END; | PRINT @num; | CALL p1(); |

    | EXEC p1; | END; | |


    ![](img/86805baec19af0039b39fad6b4ce02e0_188_0.png)


