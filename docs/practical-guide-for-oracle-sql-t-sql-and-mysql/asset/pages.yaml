  md: '# About the Author


    Preston Zhang has over 20 years of experiences in database design and implementation.
    As a database administrator, he manages Oracle, SQL Server and MySQL database
    servers for university departments in Georgia. He has written many queries in
    Oracle SQL, SQL Server T-SQL and MySQL to process millions of records for business
    reports. He has developed Web applications using Oracle database as back-end for
    a large health care company. He has taught undergraduate database and programming
    courses in private universities for over 10 years. He has a Master of Science
    degree in Computer Information Systems from University of Wisconsin-Parkside.
    He lives in Georgia with his family and can be reached at prestonz668@gmail.com.'
