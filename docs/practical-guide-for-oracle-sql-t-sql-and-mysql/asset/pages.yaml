  md: '# Chapter 13


    # Stored Procedures


    # What is a Stored Procedure


    When you create a useful query in your working place it''s very possible that
    you need to run that query again.  For example, you may need to run a monthly
    sales report automatically at the beginning of a month. Stored procedures can
    do that job for you. You can save the query in a stored procedure and schedule
    a task to run the job automatically.  A stored procedure usually has three parts:


    +   * Declaration

    * Execution

    * Exception (Optional)


    # A Simple Stored Procedure


    Syntax:


    ```

    CREATE [OR REPLACE] PROCEDURE proc_name [ (parameter1, parameter2 ... ) ]

    is | AS (Oracle)

    AS (SQL Server)

    [declaration part]

    BEGIN

    executable part

    [EXCEPTION]

    exception part

    END;

    ```


    Let us create a stored procedure to count row numbers in the regions table. There
    is no input parameters and output values.


    # Steps to Create an Oracle Stored Procedure


    +   * Enter SQL code in the query editor.

    * Run the code to create a stored procedure.

    * Enter EXEC proc_name to run the stored procedure.'
  merge: -1
  pgno: 187
- img_proc: true
