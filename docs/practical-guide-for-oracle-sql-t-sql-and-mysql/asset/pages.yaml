    | Median Integer | NUMBER (5) | SMALLINT

    -32,768 to 32,767 | SMALLINT(n)

    -32,768 to 32767 | 0 to 65,535 |

    | | | | MEDIUMINT(n)

    -8,388,608 to 8,388,608 | 0 to 16,772,215 UNSIGNED |

    | Integer 32 bit | NUMBER (10) | INT

    -2,147,483,648 to -2,147,483,647 | INT(n)

    -2,147,483,648 to -2,147,483,647 |

    | | NUMBER (38) | BIGINT | BIGINT(n)

    -9,223,372,036,854,775,808 to 9,223,372,036,854,775,808 | -9,223,372,036,854,775,808
    to 9,223,372,036,854,775,808 |

    | | | REAL | FLOAT(n, d)

    | | | Floating number

    -3.40E+3 to 3.40E+8 | Small floating number

    n—maximum of digits

    d—decimal points |

    | | | SMALLMONEY

    -2,174,368 to 21,744,368 | DOUBLE(n, d)

    Large floating number

    n—maximum of digits

    d—decimal points |

    | | | MONEY

    -922,333,203,685,477,580 to 922,333,203,685,477,580 | DECIMAL(n, d)

    | | | DECIMAL(p, s)

    NUMERIC(p, s)

    Stored as a string

    | | | -10^p + 1 to 10^p – 1

    n—maximum of digits

    d

    | | | p from 1 – 38

    | | | s from -84 to 12 |'
