    # 6. CASE


    Description: the CASE statement has the functionality of an IF-THEN-ELSE statement.


    Syntax 1


    ```

    CASE

    WHEN condition_1 THEN result_1

    WHEN condition_2 THEN result_2 ...

    WHEN condition_n THEN result_n

    ELSE result

    END

    ```'
  merge: -1
