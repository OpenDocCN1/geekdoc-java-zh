  \ >\n    <item android:id=\"@+id/action_settings\"\n        android:title=\"@string/action_settings\"\
  \n        android:priority=\"100\"\n        app:showAsAction=\"never\" />\n    <item\n\
  \        android:id=\"@+id/action_print\"\n        android:priority=\"100\"\n  \
  \      app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n配置菜单的剩余工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理器：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrint(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n一旦实现了 `onOptionsItemSelected()` 方法，当从溢出菜单中选择打印选项时，该活动将调用名为 `createWebPrint()`\
  \ 的方法。该方法的实现与之前的 HTML 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\nimport\
  \ android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\nimport\
  \ android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrint(WebView webView)\
  \ {\n        PrintManager printManager = (PrintManager) this\n                .getSystemService(Context.PRINT_SERVICE);\n\
  \        PrintDocumentAdapter printAdapter =\n                webView.createDocumentAdapter(\"\
  MyDocument\");\n        String jobName = getString(R.string.app_name) +\n      \
  \          \" Print Test\";\n        printManager.print(jobName, printAdapter,\n\
  \                new PrintAttributes.Builder().build());\n    }\n}\n```\n\n代码更改完成后，在物理\
  \ Android 设备或运行 Android 版本 5 及以上版本的模拟器上运行应用程序。\n\n## 75.10 总结\n\nAndroid 打印框架包含了\
  \ `WebView` 的扩展，允许在应用程序内部打印 HTML 内容。对于动态创建的 HTML，重要的是使用 `WebViewClient` 实例以确保在 HTML\
  \ 完全加载之前不开始打印。\n\n# 76. Android 自定义打印指南\n\n正如我们在前面的章节中所看到的，只要内容是以图像或 HTML 标记的形式，Android\
  \ 打印框架就可以轻松地构建打印支持。更高级的打印需求可以通过使用框架的自定义打印功能来满足。\n\n## 76.1 Android 自定义打印概述\n\n简单来说，自定义打印使用画布（canvas）来表示要打印的页面。应用程序在这些画布上以形状、颜色、文本和图像绘制要打印的内容。实际上，画布是由\
  \ `Canvas` 类的实例表示，从而提供了丰富的绘制选项。一旦绘制了所有页面，即可进行打印。\n\n虽然这听起来很简单，但实际上需要执行许多步骤才能实现，可以总结如下：\n\
  \n- 实现继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 获取打印服务的引用\n- 创建 `PdfDocument` 类的实例以存储文档页面\n\
  - 以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument` 中\n- 获取与文档页面相关的 `Canvas` 对象引用\n\
  - 在画布上绘制内容\n- 将 PDF 文档写入打印框架提供的目标输出流\n- 通知打印框架文档已准备好打印\n\n在本章中，将提供这些步骤的概述，随后将提供一个旨在演示\
  \ Android 中实现自定义打印的详细教程。\n\n### 76.1.1 自定义打印适配器\n\n\n\n\n打印适配器（print adapter）的作用是为打印框架提供需要打印的内容，并确保其按照用户选择的偏好进行正确的格式化（考虑纸张大小和页面方向等因素）。\n\
  \n在打印 HTML 和图像时，大部分工作由 Android 打印框架提供的打印适配器完成，这些适配器是为这些特定的打印任务设计的。例如，在打印网页时，当我们调用\
  \ `WebView` 类实例的 `createPrintDocumentAdapter()` 方法时，就会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，设计打印适配器并实现绘制和格式化内容以准备打印是应用程序开发者的责任。\n\
  \n自定义打印适配器通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些方法会在打印过程的各个阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n- `onStart()` – 该方法在打印过程开始时被调用，提供该方法是为了让应用程序代码有机会在创建打印作业之前执行任何必要的任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n- `onLayout()` – 该回调方法在调用 `onStart()` 方法之后被调用，并且每当用户更改打印设置（如更改方向、纸张大小或颜色设置）时都会调用。此方法应根据需要调整内容和布局以适应这些更改。一旦完成更改，方法必须返回要打印的页数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n- `onWrite()` – 该方法在每次调用 `onLayout()`\
  \ 后被调用，负责在要打印页面的画布上渲染内容。除其他外，此方法还会接收一个文件描述符，渲染完成后必须将 PDF 写入该描述符。随后将调用 `onFinished()`\
  \ 回调，并传递一个包含要打印页范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()` 方法是强制的。\n- `onFinish()`\
  \ – 可选方法。如果实现，它将在打印过程完成时由打印框架调用，从而为应用程序提供执行任何必要的清理操作的机会。\n\n## 76.2 准备自定义文档项目\n\n\
  从欢迎界面选择“New Project”（新建项目）选项，在生成的项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Activity”（空活动）模板。在“Name”（名称）字段中输入\
  \ `CustomPrint`，并指定 `com.ebookrenzy.customprint` 为包名。在点击“Finish”（完成）按钮之前，将“Minimum\
  \ level”（最低级别）设置改为 API 26 (Oreo)，并将“Language”（语言）设置为 Java。\n\n在 Layout Editor（布局编辑器）工具的\
  \ Design 模式加载 `activity_main.xml` 文件，选择并删除“Hello World!” TextView 对象。从调面板的 Widgets（小部件）部分拖入一个\
  \ Button 视图，并将其放置在布局视图的中心。选中 Button 后，将 text 属性更改为“Print Document”，并将字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 76-1 所示。\n\n当在应用程序中选择按钮时，需要调用一个方法来启动文档打印。保持在 Attributes（属性）窗口中，设置 `onClick` 属性以调用名为\
  \ `printDocument` 的方法。\n\n## 76.3 创建打印适配器\n\n在 Android 应用程序内部打印自定义文档的大部分工作涉及自定义适配器的实现。此示例将需要一个实现了\
  \ `onLayout()` 和 `onWrite()` 方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其内容如下：\n\
  \n```java\npackage com.ebookrenzy.customprint;\n\nimport android.os.CancellationSignal;\n\
  import android.os.ParcelFileDescriptor;\nimport android.print.PageRange;\nimport\
  \ android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\nimport\
  \ android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n        Context context;\n\n        MyPrintDocumentAdapter(Context context)\
  \ {\n            this.context = context;\n        }\n\n        @Override\n     \
  \   public void onLayout(PrintAttributes oldAttributes,\n                      \
  \       PrintAttributes newAttributes,\n                             CancellationSignal\
  \ cancellationSignal,\n                             LayoutResultCallback callback,\n\
  \                             Bundle metadata) {\n        }\n\n        @Override\n\
  \        public void onWrite(final PageRange[] pageRanges,\n                   \
  \         final ParcelFileDescriptor destination,\n                            CancellationSignal\
  \ cancellationSignal,\n                            LayoutResultCallback callback)\
  \ {\n        }\n    }\n}\n```\n\n目前该新类包含一个在创建新实例时被调用的构造函数。该构造函数接收 context 作为参数，然后将其存储以便稍后引用。\n\
  \n## 76.4 实现 onLayout 方法\n\n继续留在 `MainActivity.java` 中，首先添加 `onLayout()` 方法所需的某些指令：\n\
  \n```java\npackage com.ebookrenzy.customprint;\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedDocument;\nimport android.graphics.pdf;\n```\n\n\
  接下来，修改 `MyPrintDocumentAdapter` 类以声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic\
  \ static class MyPrintDocumentAdapter extends PrintDocumentAdapter {\n    Context\
  \ context;\n    int pageHeight;\n    int pageWidth;\n    int totalpages;\n```\n\n\
  注意，对于本示例而言，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容数量和布局相对于用户纸张大小和方向的选择，动态计算要打印的页数。声明变量后，按照以下代码概述实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                     PrintAttributes newAttributes,\n                     CancellationSignal\
  \ cancellationSignal,\n                     LayoutResultCallback callback,\n   \
  \                  Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \n    if (cancellationSignal.isCanceled()) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n```\n\n\n\n\n```java\nif (totalpages > 0) {\n\
  \    PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n            .Builder(\"\
  print_output.pdf\")\n            .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n显然，该方法执行了相当多的任务，每项任务都需要详细的解释。\n\n首先，会以 `PdfDocument`\
  \ 类实例的形式创建一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是一个 `PrintAttributes` 类型的对象，它包含了用户为打印输出选择的纸张大小、分辨率和颜色设置的细节。在创建\
  \ PDF 文档时，会使用这些设置，以及我们的构造方法之前为我们存储的活动上下文（context）：\n\n`myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);`\n\n然后，该方法使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度以千分之一英寸的形式存储在对象中。由于本示例中后续使用这些值的方法是以\
  \ 1/72 英寸为单位的，因此这些数字在存储之前会进行转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;`\n\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\
  \n尽管此示例没有使用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME` 之一。\n\n当 `onLayout()` 方法被调用时，会传入一个\
  \ `LayoutResultCallback` 类型的对象。该对象为方法提供了通过一组方法向打印框架传回状态信息。例如，如果用户取消了打印过程，将调用 `onLayout()`\
  \ 方法。进程已取消通过 `CancellationSignal` 参数中的一个设置来指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled())\
  \ {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n当布局工作完成后，该方法要求调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传递两个参数。第一个参数是一个 `PrintDocumentInfo`\
  \ 对象，其中包含了有关要打印文档的信息。这些信息包括用于 PDF 文档的名称、内容类型（在这种情况下是文档而不是图像）以及页数。第二个参数是一个布尔值，表示自上一次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n            .Builder(\"print_output.pdf\")\n\
  \            .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n        \
  \    .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。\n\n调用 `onLayoutFinished()` 方法会通知打印框架布局工作已完成，从而触发对 `onWrite()` 方法的调用。\n\
  \n## 76.5 实现 onWrite() 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好打印。完成后，onWrite()`\
  \ 方法的内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport android.graphics.pdf.PdfDocument.Info;\n\n@Override\n\
  public void onWrite(final PageRange[] pageRanges, final FileDescriptor destination,\
  \ final CancellationSignal cancellationSignal, final WriteCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth, pageHeight,\
  \ i).create();\n            PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.writeTo(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n    } catch (IOException\
  \ e) {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法从遍历文档中的每一页开始。然而，必须考虑的情况是，用户可能并没有请求组成文档的所有页面。事实上，打印框架的用户面板提供了指定特定页面或页范围打印的选项。例如，图\
  \ 76-2 显示打印面板配置为打印文档的第 1-4 页、第 9 页以及第 11-13 页。\n\n![图 76-2](img/Image24365.jpg)\n\
  \n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架作为参数传递了一个 `PageRange`\
  \ 对象数组，指示要打印的页范围。在上面的 `onWrite()` 实现中，对每一页都会调用 `pagesInRange()` 方法来验证该页是否在范围内。`pagesInRange()`\
  \ 方法的代码将在本章晚些部分实现。\n\n\n\n\n\n`drawPage()` 方法负责将内容绘制到页面上，并在 `onWrite()` 方法完成后完成实现。\n\
  \n当向 PDF 文档添加了所需数量的页面后，文档将使用通过 `onWrite()` 方法作为参数传递的文件描述符写入目标流。如果由于任何原因导致写入操作失败，该方法将通过调用\
  \ `WriteResultCallback` 对象的 `onWriteFailed()` 方法来通知框架（该对象也是作为参数传递给 `onWrite()` 方法的）。\n\
  \n```java\ntry {\n    myPdfDocument.writeTo(new FileOutputStream(\n            destination.getFileDescriptor()));\n\
  } catch (IOException e) {\n    callback.onWriteFailed(e.toString());\n    return;\n\
  } finally {\n    myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用\
  \ `WriteResultsCallback` 对象的 `onWriteFinish()` 方法，通知打印框架文档已准备好打印。\n\n## 76.6 检查页面是否在范围内\n\
  \n如前所述，当调用 `onWrite()` 方法时，会传入一个 `PageRange` 对象数组，该数组指示了文档中要打印的页面范围。`PageRange`\
  \ 类设计用于存储页面范围的起始和结束页码，可以通过该类的 `getStart()` 和 `getEnd()` 方法访问这些信息。\n\n在上一节实现 `onWrite()`\
  \ 方法时，调用了一个名为 `pageInRange()` 的方法，该方法接收一个 `PageRange` 对象数组和一个页码作为参数。`pageInRange()`\
  \ 方法的作用是识别指定的页码是否在指定的范围内，可以如下所示在 `MainActivity.java` 类的 `MyPrintDocumentAdapter`\
  \ 类中实现：\n\n```java\npublic class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n\n.\n.\n    private boolean pageInRange(PageRange[] pageRanges, int page)\n\
  \    {\n        for (PageRange pageRange : pageRanges) {\n            if ((page\
  \ >= pageRange.getStart()) &&\n                (page <= pageRange.getEnd()))\n \
  \               return true;\n        }\n        return false;\n    }\n.\n.\n}\n\
  ```\n\n## 76.7 在页面画布上绘制内容\n\n现在我们到了需要编写某些代码在页面上绘制内容的步了，以便它们准备好打印。绘制的内容完全取决于应用程序，仅限于使用\
  \ `Canvas` 类所能实现的内容。然而，为了本示例的目的，将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为 `drawPage()`\
  \ 的方法，该方法接收代表当前页的 `PdfDocument.Page` 对象和一个代表页码的整数作为参数。在 `MainActivity.java` 文件中，该方法的现在的实现如下：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\n.\n.\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter\n    {\n.\n.\n        private void drawPage(PdfDocument.Page\
  \ page, int pagenumber) {\n            Canvas canvas = page.getCanvas();\n     \
  \       pagenumber++; // 让页码从 1 开始\n            int titleBaseLine = 2;\n       \
  \     int leftMargin = 5;\n            Paint paint = new Paint();\n            paint.setColor(Color.BLACK);\n\
  \            paint.setTextSize(0);\n            canvas.drawText(\"Test Print Page\
  \ \" + pagenumber, leftMargin, titleBaseLine, paint);\n            paint.setTextSize(14);\n\
  \            canvas.drawText(\"This is some content to verify that custom printing\
  \ works\", leftMargin, titleBaseLine + 35, paint);\n            if (pagenumber %\
  \ 2 == 0)\n                paint.setColor(Color.RED);\n            else\n      \
  \          paint.setColor(Color.GREEN);\n            PageInfo pageInfo = page.getInfo();\n\
  \            canvas.drawCircle(pageInfo.getPageWidth()/2f, pageInfo.getPageHeight()/2f,\
  \ 150, paint);\n        }\n.\n.\n}\n```\n\n代码中的页码从 0 开始。由于文档传统上从 1 开始，该方法首先递增存储的页码。然后获取与页面关联的\
  \ `Canvas` 对象的引用，并声明了一些边距和基线：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置字体大小并绘制页面标题（包括页码）：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Print Page \" + pagenumber, leftMargin,\
  \ titleBaseLine, paint);\n```\n\n然后缩小字体大小，并在标题下方绘制一些文本：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some content to verify that custom printing works\", leftMargin,\
  \ titleBaseLine + 35, paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页红色，奇数页绿色）。在确定页面是奇数还是偶数后，方法获取了页面的高度和宽度，然后使用这些信息将圆位于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2f,\
  \ pageInfo.getPageHeight()/2f, 150, paint);\n```\n\n在画布上绘制完成后，该方法将控制权返回给 `onWrite()`\
  \ 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类现在已经完成。## 76.8 启动打印任务\n\n当用户点击“打印文档”按钮时，将调用\
  \ `printDocument()` 点击事件处理方法。因此，在开始测试之前剩下的工作是将此方法添加到 `MainActivity.java` 文件中，特别注意将其放置在\
  \ `MyPrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n.\nimport android.print.PrintManager;\nimport android.view.View;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    public void printDocument(View\
  \ view)\n    {\n        PrintManager printManager = (PrintManager) this\n      \
  \          .getSystemService(Context.PRINT_SERVICE);\n        String jobName = this.getString(R.string.app_name)\
  \ + \" Document\";\n        printManager.print(jobName, new MyPrintDocumentAdapter(this),\
  \ null);\n    }\n.\n}\n```\n\n该方法在获取设备上运行的打印服务的引用之前，创建一个新的 `String` 对象作为打印任务的名称。最后，调用\
  \ `PrintManager` 的 `print()` 方法来启动打印任务，传入任务名称和自定义打印文档适配器类的实例。\n\n## 76.9 测试应用程序\n\
  \n\n\n\n在运行 Android 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“打印文档”（Print\
  \ Document）按钮启动打印作业，并选择合适的输出目标（“保存为 PDF”选项是避免浪费纸张打印机墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形在内的\
  \ 4 个页面。例如，图 76-3 显示了作为 PDF 文件查看的文档四个页面，准备好保存到设备上。\n\n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每项设置更改都应反映在打印输出中，表明自定义打印文档适配器正在正常工作。\n\
  \n![](img/as_4.1_custom_print_running.jpg)\n\n图 76-3\n\n## 76.10 总结\n\n虽然自定义文档打印的实现比\
  \ Android 打印框架的 HTML 和图像打印选项更复杂，但它在 Android 应用内部打印复杂内容方面提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义的\
  \ `Print Adapter` 类，使其不仅能在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\n# 77. Android\
  \ 应用链接（App Links）简介\n\n随着技术的演进，Web 内容与移动端内容之间的传统区别开始模糊。这一点尤为明显的一个领域是渐进式 Web 应用（PWA）的日益普及，Web\
  \ 应用的外观和行为非常类似于传统的移动应用。\n\n另一个趋势是让移动应用中的内容可以在 Web 搜索和通过 URL 链接被发现。在 Android 应用开发背景下，`App\
  \ Links` 功能专门设计用于让用户即使在没有安装该应用的情况下，也能更容易地发现和访问存储在 Android 应用中的内容。\n\n### 77.1 Android\
  \ 应用链接概述\n\n应用链接（app link）是一个标准的 HTTP URL，旨在作为从网站或应用等外部源直接链接到应用中特定位置的便捷方式。`App links`（也称为深度链接）主要用于鼓励用户与应用交互，并允许用户分享应用内容。\n\
  \n应用链接的实现是一个多步骤过程，涉及向项目清单（manifest）添加意图过滤器（intent filters）、在关联应用活动（activities）中实现链接处理代码，以及使用数字资产链接文件（digital\
  \ asset links files）来关联应用和 Web 内容。\n\n这些步骤既可以通过修改项目来手动完成，也可以使用 Android Studio 的\
  \ `App Links Assistant` 自动完成。\n\n本章的剩余部分将根据对项目所需的更改来概述应用链接的实现。下一章（“Android Studio\
  \ 应用链接教程”）将演示如何使用 `App Links Assistant` 实现相同的结果。\n\n### 77.2 应用链接意图过滤器\n\n应用链接 URL\
  \ 需要映射到应用项目中的某个特定活动。这是通过向项目的 `AndroidManifest.xml` 文件添加意图过滤器来实现的，这些过滤器设计用于响应 `android.intent.action.VIEW`\
  \ 动作以启动活动。意图过滤器声明在要启动的活动元素内，并且必须包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了一个检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时，启动名为 `MyActivity` 活动的意图过滤器：\n\n```xml\n\
  <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter\
  \ android:autoVerify=\"true\">\n        <action android:name=\"android.intent.action.VIEW\"\
  \ />\n        <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \      <category android:name=\"android.intent.category.BROWSABLE\" />\n       \
  \ <data\n            android:scheme=\"http\"\n            android:host=\"www.example.com\"\
  \n            android:pathPrefix=\"/welcome\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n可以使用意图过滤器标签的 `order` 属性按如下方式指定处理歧义意图过滤器的顺序：\n\n```xml\n<application>\n  \
  \  <activity android:name=\" com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n.\n.\n```\n\n意图过滤器将导致应用链接启动正确的活动，但仍需要在目标活动中实现代码以妥善处理该意图。\n\
  \n### 77.3 处理应用链接意图\n\n在大多数情况下，启动的活动需要获取应用链接 URL 的访问，并根据 URL 的结构采取特定操作。继续上例示例，当通过包含\
  \ `/welcome/newuser` 路径的 URL 启动时，该活动显示的内容可能与路径设置为 `/welcome` 的 URL 启动时不同。\n\n当通过链接启动活动时，会传递一个包含动作数据的\
  \ `intent` 对象。在活动的初始化阶段，可以添加代码来提取这些数据，如下：\n\n```java\nIntent appLinkIntent = getIntent();\n\
  String appLinkAction = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来对要执行的操作做出决策。在下面的代码示例中，URL 的最后一个组件被用于识别是否应该为新用户或现有用户显示内容：\n\
  \n```java\nString userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"\
  newuser\")) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n### 77.4 将应用关联网站\n\
  \n在应用链接生效之前，应用链接 URL 需要与其所在的网站进行关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的\
  \ `.well-known` 文件夹中实现的。注意，数字资产链接仅适用于基于 的网站。\n\n数字资产链接包含一个允许使用网站链接启动目标应用的关系声明，以及一个声明配套应用包名和\
  \ SHA256 证书指纹的目标声明。例如，典型的资源链接文件可能如下：\n\n```json\n[\n  {\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\": {\n      \"namespace\": \"android_app\",\n      \"package_name\"\
  : \"<应用包名>\",\n      \"sha256_cert_fingerprints\": [\"<应用证书>\"]\n    }\n  }\n]\n\
  ```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，从而允许单个网站与多个配套应用关联。\n\n### 77.5 总结\n\nAndroid\
  \ 应用链接允许通过外部网站和其他应用的 URL 链接启动应用活动。应用链接的实现通过项目清单文件中的意图过滤器和启动活动中的意图处理代码相结合。此外，通过使用数字资产链接文件可以将应用链接中使用的域名与相应的网站关联。一旦关联建立，当使用应用链接时，Android\
  \ 就不再需要用户选择目标应用。\n\n\n\n\n本章将为现有的 Android 应用添加应用链接（app linking）支持，允许通过应用链接 URL 启动\
  \ activity。除了启动 activity 外，显示的内容将在 URL 的路径中指定。\n\n## 78.1 关于示例应用\n\n本章使用的项目命名为 `AppLinking`，这是一个基础应用，允许用户查找有关伦敦地标的信息。该应用使用\
  \ `SQLite` 数据库，通过标准的 Android `content provider` 类进行访问。应用提供了一个现有的数据库，其中包含了一些伦敦热门景点的记录。除了现有的数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n在目前的形式下，该应用允许搜索现有记录并添加和删除新记录。\n\n该项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的 activity 组成。`AppLinkingActivity` 是应用启动时启动的主 activity。该 activity 允许用户输入搜索标准向数据库添加额外的记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 将启动并显示相关地标的信息。\n\n本章的目标是增强该应用以添加对应用链接的支持，以便可以使用 URL 在应用内显示特定的地标记录。\n\n## 78.2\
  \ 数据库结构\n\n示例应用的数据包含在名为 `landmarks.db` 的文件中，位于项目层次结构的 `app -> assets -> databases`\
  \ 文件夹中。数据库包含一个名为 `locations` 的表，其结构如表 78-1 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :---\
  \ | :--- |\n| `_id` | String | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| `title` | String |\
  \ 地标的名称（例如：伦敦桥）。 |\n| `description` | String | 地标的描述。 |\n| `personal` | Boolean\
  \ | 表示记录是私人的还是公共的。对于用户添加的所有记录，此值设置为 `true`。数据库提供的现有记录设置为 `false`。 |\n\n## 78.3 加载并运行项目\n\
  \n项目包含位于以下 URL 的示例源码下载包的 `AppLinking` 文件夹中：\n\nhttps://www.ebookfrenzy.com/retail/dolphinjava/index.php\n\
  \n找到文件夹后，在 `Android Studio` 中打开它并在设备或模拟器上运行该应用。一旦应用启动，将出现图 78-1 所示的屏幕：\n\n![](img/as_applinking_ui_home.jpg)\n\
  \n图 78-1\n\n按照目前的实现，地标是通过位置 ID 定位的。默认数据库配置当前包含两个由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的记录。通过在 ID 字段中输入 `londonbridge` 并点击 `Find` 按钮来测试搜索功能。当找到匹配的记录时，会启动第二个 activity（`LandmarkActivity`）并传递要显示的记录信息。这些信息以添加到\
  \ `Intent` 对象的额外数据形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 78-2 所示的屏幕显示给用户。\n\
  \n![](img/as_applinking_ui_london_bridge.jpg)\n\n图 78-2\n\n## 78.4 添加 URL 映射\n\n\
  现在应用已加载到 `Android Studio` 并通过了测试，项目已准备好添加应用链接支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击点击启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n当完成所有步骤后，例如以下 URL 应该导致应用显示伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先使用 `Tools -> App Links Assistant` 菜单选项打开 `App Links Assistant`。打开后，助手程序将如图\
  \ 78-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 78-3\n\n点击 `Open URL\
  \ Mapping Editor` 按钮开始将 URL 映射到 activity。在映射屏幕中，点击 `+` 按钮（如图 78-4 中高亮所示）添加新 URL：\n\
  \n![](img/Image2473.jpg)\n\n图 78-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入你自己的网站\
  \ URL。如果你没有自己的网站供本教程使用，仍然可以使用 `http://www.example.com` 遵循本章的大部分内容，但无法测试需要存在 `Digital\
  \ Asset Links` 文件才能实现的功能。\n\n`Path` 字段（在图 78-5 中标记为 A）是声明 URL 路径组件的地方。路径必须以 `/`\
  \ 开头，因此在此字段中输入 `/landmarks`。\n\n`Path` 菜单 (B) 提供以下三种路径匹配选项：\n\n- `path` – URL 必须与\
  \ URL 的路径组件完全匹配才能启动 activity。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks`\
  \ 被视为匹配。然而，URL `http://www.example.com/landmarks/londonbridge` 将不被视为匹配。\n- `pathPrefix`\
  \ – 指定路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如 `http://www.example.com/landmarks/londonbridge`\
  \ 将视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*[l-L]ondon/*`\n\
  \n由于由于示例中的路径是地标 ID 的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应链接启动的 activity：\n\n![](img/Image24811.jpg)\n\n图 78-5\n\n完成对话框中的设置后，点击 `OK`\
  \ 按钮提交更改。在映射屏幕的 `Check URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为在 `Host` 字段中指定的域名），以检查\
  \ URL 格式是否正确并已分配给适当的 activity：\n\n`http://<your domain>/landmarks/toweroflondon`\n\
  \n如果映射配置正确，`LandmarkActivity` 将列为映射的 activity：\n\n![](img/Image2489.jpg)\n\n图 78-6\n\
  \n最新版本的 Android 要求同时为 HTTP 和 HTTPS 协议声明应用链接，即使只使用其中一个。因此，在继续下一步之前，请重复上述步骤将 URL 的\
  \ HTTPS 版本添加到列表中。\n\n下一步也将在 `App Links Assistant` 的 URL 映射屏幕中执行，因此请保持屏幕选中状态。\n\n\
  ## 78.5 添加 Intent Filter\n\n需要 intent filter 来允许目标 activity 响应应用链接点击启动。事实上，当你添加\
  \ URL 映射时，intent filter 已自动添加到了项目清单文件中。在 `App Links Assistant` URL 映射列表中选中 URL 映射后，向下滚动屏幕直到\
  \ intent filter 预览部分进入视野。预览应包含包含新添加 intent filter 的修改 `AndroidManifest.xml` 文件：\n\
  \n![](img/Image2496.jpg)\n\n图 78-7\n\n\n\n\n\n尽管 `App Links Assistant` 为我们添加了意图过滤器（intent\
  \ filters），但它可能没有包含应用链接（app links）所需的 `autoVerify` 设置。打开 `manifests -> AndroidManifest.xml`\
  \ 文件，并如下所示向两个意图过滤器添加此设置：\n\n```xml\n<intent-filter android:autoVerify=\"true\">\n\
  \    <data\n        android:scheme=\"http\"\n        android:host=\"www.ebookfrenzy.com\"\
  \n        android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n\n<intent-filter\
  \ android:autoVerify=\"true\">\n    <data\n        android:scheme=\"https\"\n  \
  \      android:host=\"www.ebookfrenzy.com\"\n        android:pathPrefix=\"/landmarks\"\
  \ />\n</intent-filter>\n```\n\n## 78.6 添加意图处理代码\n\n到为止的步骤确保了在响应格式正确的应用链接 URL 时，会启动正确的\
  \ activity。下一步是在 `LandmarkActivity` 类中处理意图（intent），以便从数据库中提取正确的记录并将其显示给用户。在修改 `LandmarkActivity.java`\
  \ 文件中的代码之前，最好检查现有代码的某些区域。在代码编辑器中打开 `LandmarkActivity.java` 文件，并找到 `onCreate()` 和\
  \ `handleIntent()` 方法，它们目前的内容如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId =\n        intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在目前的形式下，代码期望在 `Intent` 包的额外数据中找到地标\
  \ ID。由于 activity 现在也可以通过应用链接启动，因此需要更改此代码以处理这两种情况。首先，删除 `onCreate()` 方法中的 `handleIntent()`\
  \ 的调用：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接意图处理代码，返回 `App Links Assistant` 面板，并点击步骤 2 下列出的 `Select Activity`\
  \ 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity` 项：\n\n![](img/Image2504.jpg)\n\
  图 78-8\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成请求，您可以手动添加此代码）：\n\n```java\n// ATTENTION: 这是自动生成的，用于处理应用链接。\nIntent\
  \ appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n这段代码访问 `Intent` 对象并提取 `Action`\
  \ 字符串和 `Uri`。如果 activity 的启动是应用链接的结果，则 action 字符串将设置为 `android.intent.action.VIEW`，这与添加到\
  \ manifest 文件中的意图过滤器中声明的 action 相匹配。相反，如果 activity 是由主活动中 `findLandmark()` 方法的标准意图启动代码启动的，则\
  \ action 字符串将为 null。通过检查赋值给 action 字符串的值，可以编写代码来识别 activity 的启动方式并采取相应操作：\n\n```java\n\
  import android.net.Uri;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n\n    // ATTENTION: 这是自动生成的，用于处理应用链接。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的就是在方法中添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为地标 ID：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    // ATTENTION: 这是自动生成的，用于处理应用链接。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    if (\"android.intent.action.VIEW\"\
  .equals(appLinkAction)) {\n        String landmarkId = appLinkData.getLastPathSegment();\n\
  \        if (landmarkId != null) {\n            displayLandmark(landmarkId);\n \
  \       }\n    }\n}\n```\n\n\n\n\n\n触摸传感器现在已内置在许多 Android 设备中，用于识别用户并提供对设备及应用功能的访问，例如使用指纹识别进行应用内支付。当然，指纹识别只是多种不同的身份验证方法之一，包括密码、PIN\
  \ 码以及最近的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但可能在不久的将来，这会变得更加常见。针对这一点，Google 已开始从以指纹为中心的应用添加身份验证的方法，转向一种不那么特定的方法，这种被称为“生物识别认证”（biometric\
  \ authentication）。在 Android 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但将在 Android 操作系统和 SDK 的未来发布和更新中发生变化。\n\
  \n本章将提供生物识别认证的概述，并提供了一个详细的逐步操作教程，演示了在 Android 应用项目中实现生物识别认证的实用方法。\n\n# 79.1 生物识别认证概述\n\
  \n关键的生物识别组件是 `BiometricPrompt` 类。该类执行了许多以前在早期 Android 版本中必须通过编写代码完成的工作，包括显示标准对话框以引导用户完成身份验证过程、执行身份验证并将结果报告给应用。该类还处理了过度失败的身份验证尝试，并在用户再次尝试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣类 `Builder`，可以使用它可以配置和创建 `BiometricPrompt` 实例，包括定义显示在生物识别认证对话框中的文本，以及对对话框中取消按钮（也称为负向按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组身份验证回调，这些回调将被调用以向应用提供身份验证操作的结果。`CancellationSignal`\
  \ 实例也允许应用在身份验证过程中将其取消。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n# 79.2 创建生物识别认证项目\n\
  \n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n\
  在 `Name` 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 29: Android 9.0 (Pie)`，并将 `Language` 菜单更改为\
  \ `Java`。\n\n# 79.3 配置设备指纹认证\n\n指纹认证仅适用于包含触摸传感器且已采取适当配置步骤以保护设备并录入至少一个指纹的设备。有关配置模拟器会话以测试指纹认证的步骤，请参考标题为\
  \ Using and Configuring the Android Studio AVD Emulator 的章节。\n\n要在物理设备上配置指纹认证，首先打开\
  \ `Settings` 应用并选择 `Security` 。在安全设置屏幕内，选择 `Fingerprint` 。在弹出的信息屏幕上，点击 `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置一种备份锁屏解锁方法（例如\
  \ PIN 码）。如果锁屏尚未加密，请按照步骤配置 PIN、模式或密码安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（图 79-1），如果需要，重复此过程以添加额外的指纹。\n\
  \n![](img/Image24256.jpg)\n\n图 79-1\n\n# 79.4 向 Manifest 文件添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio 项目窗口中，找到并编辑 `app -> manifests -> AndroidManifest.xml`\
  \ 文件，如下所示添加权限请求：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n```\n\n## 79.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 。找到并选择 `activity_main.xml`\
  \ 布局资源文件将其加载到 Layout Editor 工具中。\n\n删除示例 `TextView` 对象，从调色板的 Common 类别拖放一个 `Button`\
  \ 对象，并将其放置在布局画布的中心。使用 Attributes 工具窗口，将按钮上的 `text` 属性更改为“Authenticate”，并将字符串提取到资源。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与 图 79-2 所示。\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\
  \n图 79-2\n\n# 79.6 添加 Toast 便利方法\n\n在示例代码的各个点上，应用将设计为通过 `Toast` 消息向用户显示信息。与其多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 `Toast` 消息的形式显示给用户。现在编辑\
  \ `MainActivity.java` 文件并添加该方法：\n\n```java\nimport android.widget.Toast;\n\nprivate\
  \ void notifyUser(String message) {\n    Toast.makeText(this,\n                \
  \  message,\n                  Toast.LENGTH_LONG).show();\n}\n```\n\n# 79.7 检查安全设置\n\
  \n在本章之前，已经采取了在测试应用的设备或模拟器上配置锁屏并注册指纹的步骤。然而，在尝试寻求指纹认证之前，在应用中包含防御性代码以确保这些这些要求。这些将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并使用 `Keyguard` 和 `PackageManager` 服务。注意，还添加了代码来验证应用已配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.Keyguard;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n            (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        if (!keyguardManager.isKeyguardSecure()) {\n            notifyUser(\"Lock\
  \ screen security not enabled in Settings\");\n        }\n        if (ActivityCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.USE_BIOMETRIC) !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint authentication permission not enabled\"\
  );\n        }\n    }\n}\n```\n\n\n\n\n上述代码首先通过使用 `Keyguard manager` 来验证是否已配置了备份屏幕解锁方法（换句话说，可以使用\
  \ `PIN` 或其他验证方式作为指纹认证的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并从该方法返回。\n\n随后，该方法会在通过 `package\
  \ manager` 验证设备是否支持指纹认证之前，先检查用户是否已为应用启用了生物识别权限。\n\n## 79.8 配置身份验证回调\n\n在配置生物识别提示对话框时，需要分配一组身份验证回调方法，这些方法可以用来通知应用身份验证过程的成功或失败。这些方法需要封装在\
  \ `BiometricPrompt.AuthenticationCallback` 类实例中。继续留在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了这些适当方法的类实例：\n\
  \n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\
  \ CharSequence errString) {\n            notifyUser(\"Authentication error: \" +\
  \ errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\
  \ CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode, helpString);\n\
  \        }\n        @Override\n        public void onAuthenticationFailed() {\n\
  \            super.onAuthenticationFailed();\n        }\n        @Override\n   \
  \     public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n## 79.9\
  \ 添加取消信号 (CancellationSignal)\n\n一旦启动，生物识别认证过程将独立于应用执行。为了给应用提供取消操作的方法，会创建一个 `CancellationSignal`\
  \ 类实例并将其传递给生物识别认证过程。该 `CancellationSignal` 实例可以在需要时用于取消过程。取消信号实例可以配置一个监听器，该监听器会在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下：\n\n```java\nimport android.os.CancellationSignal;\n\
  \nprivate CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ ->\n        notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n\
  }\n```\n\n## 79.10 启动生物识别提示\n\n剩下的工作是在 `authenticateUser()` 方法中添加代码，以创建并配置 `BiometricPrompt`\
  \ 实例并启动认证。如下所示添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n        .setTitle(\"Biometric Demo\")\n \
  \       .setSubtitle(\"Authentication is required to continue\")\n        .setDescription(\"\
  This app uses biometric authentication to protect your data.\")\n        .setNegativeButton(\"\
  Cancel\", this.getMainExecutor(), (dialogInterface, i) ->\n            notifyUser(\"\
  Authentication cancelled\"))\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(), getAuthenticationCallback());\n}\n```\n\n使用 `BiometricPrompt.Builder`\
  \ 类创建一个新的 `BiometricPrompt` 实例，并配置用于显示提示对话框中的标题、副标题和描述文本。负按钮被配置为显示“Cancel”文本，并配置了一个在点击此按钮时显示消息的监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程执行认证。这是通过传递一个配置为所需线程的 `Executor` 来定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将一个主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用的主线程上进行。\n\n## 79.11 测试项目\n\
  \n现在项目已完成，在物理 Android 设备或模拟器会话上运行应用，并点击 Authenticate 按钮以显示如图 79-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n图 79-3\n\n运行后，可以触摸指纹传感器或使用模拟器内的扩展控制面板来按照“使用和配置\
  \ Android Studio 模拟器”章节中所述的方法模拟指纹触摸。假设检测到已注册指纹，提示对话框将返回主活动，此时将显示来自成功身份验证回调方法的 toast\
  \ 消息。\n\n再次点击 Authenticate 按钮，这次使用未注册的指纹尝试身份认证。这次，生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  图 79-4\n\n通过点击生物识别提示对话框之外活动区域来验证错误处理回调是否正常。提示对话框将消失，并弹出带有以下消息的 toast ：\n\nAuthentication\
  \ error: Fingerprint operation cancelled by user.\n\n检查使用 Cancel 按钮取消提示对话框是否会触发“Authentication\
  \ Canceled” toast 消息。最后，尝试使用未注册的指纹多次身份认证，并注意在尝试多次后，提示对话框会指示发生了过多失败，在之后之前无法再次尝试。\n\
  \n## 79.12 总结\n\n本章概述了如何在 Android 应用项目中集成生物识别认证。这涉及对 `BiometricPrompt` 类的使用，该类在配置了适当的消息文本和回调后，会自动处理大部分认证过程。\n\
  \n## 80 创建、测试和上传 Android App Bundle\n\n一旦 Android 应用程序的开发完成并在各种 Android 设备上进行了测试，下一步是准备将应用程序提交到\
  \ Google Play。但在提交之前，必须对应用程序进行发布打包并使用私密钥进行签名。本章将介绍获取私密钥、准备项目的 Android App Bundle\
  \ 以及将其上传到 Google Play 的步骤。\n\n\n\n\n到本书目前为止，我们一直在以一种适用于测试和调试的模式构建应用程序项目。另一方面，要通过\
  \ `Google Play` 向客户发布应用程序包，则需要采取一些额外的步骤。第一个要求是应用程序必须在 `release mode`（发布模式）下编译，而不是\
  \ `debug mode`（调试模式）。其次，应用程序必须使用 `private key`（私钥）进行签名，该密钥将唯一标识你作为应用程序的开发者。最后，应用程序必须被打包成一个\
  \ `Android App Bundle`（Android 程序包）。\n\n虽然这些任务中的每一项都可以在 `Android Studio` 环境之外完成，但正如本章其余部分所概述的那样，可以更方便地使用\
  \ `Android Studio` 构建机制来完成。不过，首先，进一步了解 Android App Bundles 是重要的。\n\n## 80.2 Android\
  \ App Bundles\n\n当用户从 `Google Play` 安装应用时，应用将以 `APK` 文件的形式下载。该文件包含了在用户设备上安装和运行该应用所需的所有内容。在\
  \ `Android Studio 3.2` 引入之前，开发者会使用 `Android Studio` 生成一个或多个 `APK` 文件并将其上传到 `Google\
  \ Play`。为了支持多种设备类型、屏幕尺寸和本地语言，这需要创建并上传针对每个目标设备和本地语言定制的多个 `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的单个包的大型通用\
  \ `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且每次应用需要更新时都必须重复这些工作，为应用发布过程造成了相当的时间开销。\n\n通用 `APK`\
  \ 选项虽然减轻了开发者的负担，但导致了一个完全意料之外的问题。通过分析应用安装指标，`Google` 发现安装 `APK` 文件越大（导致下载时间变长和设备上的存储占用增加），该应用获得的转化率就越低。转化率的计算方式为：在\
  \ `Google Play` 上查看该应用后完成应用的用户的用户占百分比。事实上，`Google` 估计 `APK` 文件大小每增加 `6MB`，应用的转化率就会下降\
  \ 1%。\n\nAndroid App Bundles 解决了这两个问题，它为开发者提供了一种方法，可以在 `Android Studio` 内部创建一个包，并让\
  \ `Google Play` 为每个单独支持的配置自动生成自定义的 `APK` 文件（这一概念被称为 `Dynamic Delivery`，动态交付）。\n\n\
  Android App Bundle 本质上是一个 `ZIP` 文件，包含了为应用项目内已支持的设备和本地语言构建 `APK` 文件所需的所有文件。例如，项目可能包含不同屏幕尺寸的资源和图像。当用户安装应用时，`Google\
  \ Play` 会接收有关用户设备的信息，包括显示器、处理器架构和本地语言。使用这些信息，相应的预生成的 `APK` 文件将被传输到用户的设备上。\n\n`Dynamic\
  \ Delivery` 的额外优点是能够将应用拆分为多个模块，称为 `dynamic feature modules`（动态功能模块），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分开的\
  \ `APK` 文件中，并且只有在用户需要该功能时才会下载到设备。`Dynamic Delivery` 和应用包还允许创建快速动态功能模块，这些模块可以在无需安装整个应用的情况下在设备上立即运行。这些主题将从标题为\
  \ Android 动态功能模块概述 的章节开始进行更详细的介绍。\n\n尽管仍然从 `Android Studio` 生成 `APK` 文件，但应用包现在是向\
  \ `Google Play` 上传应用的推荐方式。\n\n## 80.3 注册 Google Play Developer Console 账户\n\n应用提交过程的第一步是创建一个\
  \ `Google Play Developer Console` 账户。要这样做，请访问 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。注意，注册需要支付一次性的 `$25` 费用。一旦应用开始销售，`Google` 将保留与应用相关的所有收入的 30%。\n\n账户创建后，下一步是收集有关应用程序的信息。为了将您的应用程序推向市场，需要以下信息：\n\
  \n*   **Title（标题）** – 应用程序的标题。\n*   **Short Description（简述）** – 最多 80 个单词的应用描述。\n\
  *   **Full Description（完整描述）** – 最多 4000 个单词的应用完整描述。\n*   **Screenshots（截图）** –\
  \ 最多 8 张应用运行的截图（至少需要两张）。`Google` 建议提交在 7 英寸或 10 英寸平板上运行的应用截图。\n*   **Language（语言）**\
  \ – 应用程序的语言（默认为美式英语）。\n*   **Promotional Text（推广文本）** – 当您的应用出现在 `Google Play` 环境内的特殊推广功能时将使用的文本。\n\
  *   **Application Type（应用类型）** – 您的应用程序被视为游戏还是应用程序。\n*   **Category（类别）** – 最能描述您的应用程序的类别（例如：金融、健康健身、教育、体育等）。\n\
  *   **Locations（地区）** – 您希望您的应用程序可供购买的地理位置。\n*   **Contact Details（联系方式）** – 用户通过哪些方法与您联系以获取应用支持。选项包括网站、电子邮件和电话。\n\
  *   **Pricing & Distribution（定价与发行）** – 关于应用程序价格以及营销和销售的地理位置的信息。\n\n收集上述信息后，点击 `Google\
  \ Play Console` 内的 `Create app`（创建应用）按钮。\n\n## 80.4 在控制台中配置应用\n\n首次点击 `Create app`\
  \ 按钮时，将显示应用详情和声明屏幕，如下图 80-1 所示：\n\n```\nimage/as_4.1_play_create_app.jpg\n```\n\
  图 80-1\n\n配置完应用条目后，点击图中高显示的 `Create app` 按钮添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial setup`（初始设置）部分并展开配置应用商店的列表：\n\
  \n```\nimage/as_4.1_play_app_initial_steps.jpg\n```\n图 80-2\n\n按照列表提供应用所需的信息，确保在每一步都保存更改。\n\
  \n## 80.5 启用 Google Play 应用签名\n\n直到最近，`Google Play` 的上传是在 `Android Studio` 内部使用\
  \ `release app signing key`（发布应用签名密钥）进行签名，然后上传到 `Google Play console`。虽然该选项仍然可用，现在推荐的上传方式是使用名为\
  \ `Google Play App Signing` 的过程。对于新应用，这涉及加入 `Google Play App Signing` 并生成一个 `upload\
  \ key`（上传密钥），用于在 `Android Studio` 内部签名应用包文件。当上传由 `Android Studio` 生成的应用包文件时，`Google\
  \ Play console` 会移除 `upload key`，然后使用安全存储在 `Google Play` 服务器中的 `app signing key`\
  \ 对文件进行签名。对于现有应用，还需要额外的步骤来启用 `Google Play Signing`，这些将在章末尾介绍。\n\n在 `Google Play\
  \ console` 中，从 `All Apps` 屏幕选择新添加的应用条目（通过位于左侧导航面板顶部的选项访问），展开 `Setup` 部分（如图 80-3\
  \ 中的标记 A 所示），并选择 `App Signing` 选项（B）。\n\n\n\n\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 80-3\n\n点击 Create release（创建发布）按钮来启用 Google Play 应用签名。现在控制台已准备好创建您的应用程序的第一个版本进行测试。但在在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥（upload key）。这是生成签名应用包（signed app bundle）过程的一部分。请保持浏览器中加载当前的\
  \ Google Play Console 页面，我们将在本书的稍后部分返回此处。\n\n## 80.6 创建 Keystore 文件\n\n要创建 keystore\
  \ 文件，选择 Android Studio 中的 `Build` -> `Generate Signed Bundle / APK…` 菜单选项，以显示“生成签名\
  \ Bundle 或 APK”向导对话框，如图 80-4 所示：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\
  \n图 80-4\n\n在点击 Next（下一步）按钮之前，请确认已选择 Android App Bundle（Android 应用包）。\n\n如果您已有现有的发布版\
  \ keystore 文件，点击下一屏幕上的 Choose existing…（选择现有…）按钮导航并选择该文件。如果您尚未创建 keystore 文件，点击\
  \ Create new…（新建…）按钮以显示 New Key Store（新建密钥库）对话框（图 80-5）。点击 Key store path 字段右侧的按钮导航到文件系统上的合适位置，为\
  \ keystore 文件输入名称（例如 `release.keystore.jks`）并点击 OK 按钮。\n\nNew Key Store 对话框分为两个部分。上半部分与\
  \ keystore 文件有关。在此部分中，在 `Password`（密码）和 `Confirm`（确认）字段中输入强密码以保护 keystore 文件。对话框的下半部分与存储在\
  \ keystore 文件中的上传密钥有关。\n\n![](img/Image2483.jpg)\n\n图 80-5\n\n在 New Key Store 对话框的\
  \ Certificate（证书）部分中，输入以下详细信息：\n\n-   引用密钥的别名（alias）。可以是任何字符序列，但系统仅使用前 8 个字符。\n\
  -   保护密钥的足够强力的密码。\n-   密钥的有效期年数（Google 建议有效期超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名，或组织名称）。\n\
  \n![](img/Image24921.jpg)\n\n图 80-6\n\n信息输入完成后，点击 OK 按钮继续创建包。\n\n## 80.7 创建 Android\
  \ App Bundle\n\n下一步是指示 Android Studio 在发布模式（release mode）下构建应用包文件，然后使用新创建的私钥对其进行签名。此时，Generate\
  \ Signed Bundle or APK 对话框应仍显示着，且 keystore 路径、密码和密钥别名字段已填充了相关信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  \n图 80-7\n\n确保 Export Encrypted Key（导出加密密钥）选项已启用，并在假设其他设置均正确的情况下，点击 Next 按钮进入应用包生成屏幕（图\
  \ 80-8）。在此屏幕中，检查 `Destination Folder:`（目标文件夹：）设置，以验证生成应用包文件的位置是否可以接受。如果首选其他位置，点击文本字段右侧的按钮导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n\n图 80-8\n\n点击 Finish（完成）按钮并等待\
  \ Gradle 系统构建应用包。构建完成后，将弹出一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹，或将文件加载到 APK Analyzer 中的选项：\n\
  \n![](img/android_studio_3.2_app_bundle_generated.jpg)\n\n图 80-9\n\n此时，应用程序已准备好提交到\
  \ Google Play。点击 locate（定位）链接打开文件系统浏览器窗口。该文件应命名为 `bundle.aab`，并位于项目文件夹的 `app/release`\
  \ 子目录下（除非指定了其他位置）。\n\n在此过程中生成的私钥应在未来签名和发布应用程序时使用，因此，应将其保存在安全的地方，并进行安全备份。\n\n## 80.8\
  \ 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包生成 APK 文件，并在设备或模拟器会话中安装并运行它们。Google 提供了一个名为 `bundletool`\
  \ 的命令行工具专门专门用于此目的，可以从以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 文件的形式提供，可以如下从命令行执行（请注意版本号自本书出版以来可能已经更改）：\n\n```bash\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中提供的所有选项。要从应用包生成 APK 文件，使用\
  \ `build-apks` 选项。要生成可以安装到设备或模拟器上的 APK 文件，这些文件还需要签名。为了实现这一点，请包含 `--ks` 选项（指定在本章之前创建的\
  \ keystore 文件的路径）以及 `--ks-key-alias` 选项（指定生成密钥时提供的别名）。\n\n最后，必须使用 `--output` 标志指定生成\
  \ APK 文件的路径（称为 APK Set）。该文件不能已存在，且必须具有 `.apks` 扩展名。结合这些要求，得到如下命令：\n\n```bash\njava\
  \ -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --key-alias=MyRelease\n\
  ```\n\n当执行此命令时，在生成 APK 文件到指定的 Set 之前，将弹出提示请求 keystore 密码。APK Set 文件只是包含所有 APK 文件的\
  \ ZIP 文件。\n\n要将相应的 APK 文件安装到连接的设备上，请使用类似下面的命令：\n\n```bash\nbundletool install-apks=/tmp/MyApks.apks\n\
  ```\n\n此命令将指示工具识别连接设备的相应 APK 文件并安装它们，以便启动应用程序。\n\n也可以从 APK Set 中提取 APK 文件而不进行安装。此过程的第一步按如下方式获取连接设备的规格：\n\
  \n```bash\njava -jar bundletool-all-0.9.0.jar get-device-spec --output=/tmp/device.json\n\
  ```\n\n上述命令将生成类似下面的 JSON 文件：\n\n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"\
  supportedLocales\": [\"en-US\"],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n\
  }\n```\n\n接下来，使用此规格文件从 APK Set 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行后，通过 `--output-dir` 标志指定的目录将包含适用于指定设备的 APK 文件。\n\n## 80.9 将应用包上传到 Google\
  \ Play Developer Console\n\n将 Android 推向市场的下一步将其提交到 Google Play Developer Console\
  \ 以便测试。\n\n返回 Google Play Console，在导航面板的 Testing 部分选择 Internal testing 选项（在图 80-10\
  \ 中标记为 A），然后点击 Create new release（新建发布）按钮（B）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\
  \n图 80-10\n\n\n\n\n\n在弹出的屏幕上，点击“继续”（Continue）按钮（下方标记为 A）以确认使用 Google Play 应用签名，然后将\
  \ Android Studio 生成的包文件（bundle file）拖放到上传投放点 (B)：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n\
  \n图 80-11\n\n上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助你识别该发布版本的信息，且它对用户不可见。\n\n在应用包文件上传成功后，Google\
  \ Play 将生成所有必要的 APK 文件以供测试。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”（Save）按钮。设置保存后，点击“审核发布版本”（Review\
  \ release）按钮。\n\n## 80.10 探索应用包\n\n在审核界面上，如图 80-12 所示，点击已上传包右侧的箭头：\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n\
  \n图 80-12\n\n在弹出的面板中，点击“探索包”（Explore bundle）链接以加载应用包探索器。此工具提供了与应用包支持的 API 级别、屏幕布局和平台相关的摘要信息：\n\
  \n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\n图 80-13\n\n点击“前往设备目录”（Go to device\
  \ catalog）链接将显示 APK 文件支持的设备：\n\n![](img/as_4.1_device_catalog.jpg)\n\n图 80-14\n\n\
  此时，应用已准备好进行测试，但在控制台中设置好某些测试人员之前，无法发布。\n\n## 80.11 管理测试人员\n\n如果应用仍处于内部测试（Internal）、Alpha\
  \ 或 贝测试（Beta）测试阶段，可以通过在 Google Play 控制台中选择该应用、点击导航面板中的“内部测试”（Internal testing），并选择“测试人员”（Testers）选项卡（如图\
  \ 80-15 所示）来指定授权测试人员列表：\n\n![](img/as_4.1_play_testers.jpg)\n\n图 80-15\n\n要添加测试人员，点击“创建邮件列表”（Create\
  \ email list）按钮，为列表命名并手动或通过上传 CSV 文件为测试用户指定电子邮件地址。\n\n现在可以从屏幕复制“网页加入”（Join on the\
  \ web）URL 并提供给测试人员，以便他们接受测试邀请并下载应用。\n\n## 80.12 发布应用进行测试\n\n现在已经创建了内部发布版本并添加了测试人员列表，应用已准备好发布进行测试。留在内部测试界面中，在点击最近创建的版本的“编辑”（Edit）按钮之前，先选择“发布版本”（Releases）选项卡：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n\n图 80-16\n\n在审核界面上，滚动到最后并点击“开始内部测试发布”（Start\
  \ rollout to Internal testing）按钮。在发布版本经过简短延迟后，应用将可以供指定用户下载和测试。\n\n## 80.13 上传新的应用包版本\n\
  \n为你的应用程序上传的第一个应用包文件版本号始终为 `1`。如果尝试上传具有相同版本号的另一个包文件，控制台将通过以下错误拒绝该文件：\n\n`You need\
  \ to use a different version code for your APK because you already have one with\
  \ version code 1.`\n\n要解决这个问题，需要增加嵌入到包文件中的版本号。这在项目的模块级 `build.gradle` 文件中完成，如图 80-17\
  \ 高亮所示：\n\n![](img/Image2561.jpg)\n\n图 80-17\n\n默认情况下，该文件通常内容如下：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 31\n    defaultConfig {\n        applicationId \"com.example.myapplication\"\n\
  \        minSdkVersion 26\n        targetSdkVersion 31\n        versionCode 1\n\
  \        versionName \"1.0\"\n    }\n}\n```\n\n要更改版本号，只需更改 `versionCode` 旁边声明的数字。要同时更改显示给应用用户的用户的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n`versionCode 2`\n`versionName \"2.0\"`\n\n做出这些更改后，重新构建\
  \ APK 文件并再次执行上传。\n\n## 80.14 分析应用包文件\n\nAndroid Studio 提供了分析应用包内容的能力。要分析包文件，选择 Android\
  \ Studio Build -> Analyze APK… 菜单选项，并导航到选择要审核的包文件。一旦加载到工具中，将显示有关包的原始大小和下载大小的信息，以及包的文件结构列表，如图\
  \ 80-18 所示：\n\n![](img/android_studio_3.2_analyzer.jpg)\n\n图 80-18\n\n选择 `classes.dex`\
  \ 将显示文件的类结构。在此面板中，可以探索到方法层级的单个类详情：\n\n![](img/253.jpg)\n\n图 80-19\n\n同样，在文件中选择资源或图像文件将显示大小差异，这可以通过点击“与之前的版本比较”（Compare\
  \ with previous APK）进行查看。\n\n## 80.15 总结\n\n一旦应用项目完成或准备好测试，就可以将其上传到 Google Play\
  \ 控制台并发布生产、内部或贝测试。在上传应用之前，必须在控制台中创建一个应用条目，并包含用于商店的信息。随后应用包文件将通过 Android Studio 生成并使用签名密钥签名。\n\
  \n\n\n\n随后，需要将应用上传到控制台并启用应用内购买。然而，除非在模块级 `build.gradle` 文件添加了 `Google Play Billing\
  \ Library`，否则控制台不会为应用激活应用内购买支持。在配合 Kotlin 时，建议使用 `Google Play Kotlin Extensions\
  \ Library`：\n\n```\ndependencies {\n    implementation 'com.android.billingclient:billing:<latest\
  \ version>'\n}\n```\n\n一旦修改了构建文件并将应用程序包上传到控制台，下一步是添加供用户购买的应用内产品或订阅。\n\n## 81.2 创建应用内产品和订阅\n\
  \n产品和订阅是通过 Play 控制台导航面板中 `Monetize`（变现）部分下方列出的选项创建和管理的，如下文 图 81-1 所示：\n\n![](img/play_console_monetization.jpg)\n\
  \n图 81-1\n\n每个产品或订阅都需要 ID、标题、描述和定价信息。购买分为消耗性（用户每当需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户仅需购买一次，例如内容访问权限）和订阅制。消耗性和非消耗性产品统称为受管产品。\n\
  \n订阅适用于销售需要按定期更新的项目，例如新闻内容访问权限或应用的高功能。在创建订阅时，会定义一个基础方案，指定价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供折扣优惠，并提供预购订阅的选项。\n\
  \n## 81.3 初始化 Billing Client\n\n应用与 `Google Play Billing Library` 之间的通信由 `BillingClient`\
  \ 实例处理。此外，`BillingClient` 包含一组可以调用的方法，用于执行同步和异步计费相关活动。在初始化结算客户端时，需要为其提供一个 `PurchasesUpdatedListener`\
  \ 回调处理器的引用。客户端将调用此处理器来通知您的应用任何购买活动的结果。为了避免重复通知，建议每个应用只保留 `BillingClient` 实例。\n\n\
  可以使用 `newBuilder()` 方法创建 `BillingClient` 实例，传入当前的 activity 或 fragment 上下。然后通过 `setListener()`\
  \ 方法将购买更新处理器分配给客户端：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ =\n    new PurchasesUpdatedListener() {\n        @Override\n        public void\
  \ onPurchasesUpdated(BillingResult billingResult,\n                List<Purchase>\
  \ purchases) {\n            if (billingResult.getResponseCode() ==\n           \
  \         BillingClient.BillingResponseCode.OK\n                    && purchases\
  \ != null) {\n                // 购买成功\n                for (Purchase purchase :\
  \ purchases) {\n                    // 处理购买\n                }\n            } else\
  \ if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                // 在此处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 81.4 连接到 Google Play Billing Library\n\n在成功创建 `Billing Client`\
  \ 后，下一步是初始化与 `Google Play Billing Library` 的连接。要建立此连接，需要调用结算客户端的 `startConnection()`\
  \ 方法。由于连接是异步进行的，因此需要实现 `BillingClientListener` 处理器以接收指示连接成功的回调。还应该添加代码来重写 `onServiceDisconnected()`\
  \ 方法。当与 Billing Library 的连接丢失时会调用此方法，用于报告问题并重试连接。一旦设置和连接任务完成，`BillingClient` 实例将调用\
  \ `onBillingFinished()` 方法，该方法可以检查客户端是否就绪：\n\n```java\nbillingClient.startConnection(new\
  \ BillingClientListener() {\n    @Override\n    public void onBillingFinished(@NonNull\
  \ BillingResult billingResult) {\n        if (billingResult.getResponseCode() ==\n\
  \                BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n\
  \        } else {\n            // 连接失败\n        }\n    }\n    @Override\n    public\
  \ void onServiceDisconnected() {\n        // 连接丢失\n    }\n});\n```\n\n## 81.5 查询可用产品\n\
  \n一旦计费环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详情。这通过调用 `BillingClient` 的 `queryProductDetailsAsync()`\
  \ 方法并传入配置配置的 `QueryDetailsParams` 实例来实现，该实例包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，受管产品使用\
  \ `ProductType.INAPP`）：\n\n```java\nQueryDetailsParams queryProductDetailsParams\
  \ =\n    QueryDetailsParams.newBuilder()\n        .setProductList(\n           \
  \ ImmutableList.of(\n                QueryDetailsParams.Product.newBuilder()\n \
  \                   .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配的产品列表\n            } else {\n                // 未找到匹配的产品\n\
  \            }\n        }\n    }\n);\n```\n\n`queryProductDetailsAsync()` 方法接收一个\
  \ `ProductDetailsResponseListener` 处理器，该处理器反过来会被调用并传入一个包含匹配产品信息的 `ProductDetail`\
  \ 对象列表。例如，我们可以调用这些对象的方法来获取如产品名称、标题、描述、价格和优惠详情等信息。\n\n## 81.6 启动购买流程\n\n一旦用户查询并选择了要购买的产品或订阅，购买流程就可以启动了。我们通过调用\
  \ `BillingClient` 的 `launchBillingFlow()` 方法来实现，传入当前的 activity 和一个配置了所购项目 `ProductDetail`\
  \ 对象的 `BillingFlowParams` 实例。\n\n```java\nBillingFlowParams billingFlowParams =\n\
  \    BillingFlowParams.newBuilder()\n        .setProductDetailsParamsList(\n   \
  \         ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build()))\n\
  \        .build();\n\nbillingClient.launchBillingFlow(this, billingFlowParams);\n\
  ```\n\n购买操作的成功与否将通过在本章前面概述的 `PurchasesUpdatedListener` 回调处理器调用来报告。\n\n\n\n\n当购买成功时，`PurchasesUpdatedListener`\
  \ 处理器将接收一个包含每个项目对应的 `Purchase` 对象的列表。你可以通过如下方式调用 `Purchase` 实例的 `getPurchaseState()`\
  \ 方法来验证项目是否已购买：\n\n```\nif (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\
  \ {\n    // 购买完成。\n} else if (purchase.getPurchaseState() == Purchase.PurchaseState.PENDING)\
  \ {\n    // 支付仍在处理中\n}\n```\n\n请注意，只有在初始化期间调用了 `enablePendingPurchases()` 方法，你的应用才会支持待处理购买。待处理购买将一直保持该状态，直到用户完成支付流程。\n\
  \n当非消耗性项目的购买完成后，需要对其进行确认（acknowledged），以防止向用户发放退款。这需要项目的购买令牌，该令牌通过调用 `Purchase`\
  \ 对象的 `getPurchaseToken()` 方法获取。该令牌用于配合 `AcknowledgePurchaseResponseListener`处理器创建一个\
  \ `AcknowledgePurchaseParams` 实例。托管型商品购买和订阅通过如下方式调用 `BillingClient` 的 `acknowledgePurchase()`\
  \ 方法进行确认：\n\n```\nAcknowledgePurchaseParams acknowledgePurchaseParams =\n    AcknowledgePurchaseParams.newBuilder()\n\
  \        .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\nAcknowledgePurchaseResponseListener\
  \ acknowledgePurchaseResponseListener =\n    new AcknowledgePurchaseResponseListener()\
  \ {\n        @Override\n        public void onAcknowledgePurchaseResponse(\n   \
  \             @NonNull BillingResult billingResult) {\n            // 检查确认结果\n \
  \       }\n    };\n```\n\n对于消耗性购买，你需要在项目被消耗时通知 Google Play，以便用户可以再次购买。这需要一个包含购买令牌的已配置\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener` 以及调用 billing client 的 `consumeAsync()`\
  \ 方法：\n\n```\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n  \
  \      .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n                                    @NonNull String purchaseToken)\
  \ {\n        if (billingResult.getResponseCode() ==\n            BillingClient.BillingResponseCode.OK)\
  \ {\n            // 购买已成功消耗\n        }\n    }\n};\nbillingClient.consumeAsync(consumeParams,\
  \ listener);\n```\n\n# 81.8 查询之前的购买记录\n\n在处理应用内购买时，常见的需求是检查用户是否已经购买了某个商品或订阅。通过调用\
  \ `BillingClient` 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户特定类型的所有之前的购买列表。例如，以下代码获取了所有尚未消耗的先前购买项目列表：\n\
  \n```\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \    new PurchasesResponseListener() {\n        @Override\n        public void onPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                                        @NonNull\
  \ List<Purchase> list) {\n            // 处理列表\n        }\n    });\n```\n\n或者，要获取订阅列表，请将\
  \ `ProductType` 值从 `INAPP` 改为 `SUBS`。要获取最近购买的列表，请调用 `queryPurchasesAsync()`：\n\n\
  ```\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.SUBS)\n        .build();\nbillingClient.queryPurchasesAsync(queryPurchasesParams,\n\
  \    new PurchasesResponseListener() {\n        @Override\n        public void onPurchasesResponse(@NonNull\
  \ BillingResult billingResult,\n                                        @NonNull\
  \ List<Purchase> list) {\n            // 处理列表\n        }\n    });\n```\n\n# 81.9\
  \ 总结\n\n应用内购买了一种通过销售商品和订阅从应用内部产生收入的方法。在本章中，我们探索了托管商品和订阅，并解释了消耗性与非消耗性商品之间的区别。下一章将包含如何使用\
  \ Google Play Billing Library 向 Android 项目添加应用内购买的教程。\n\n# 82. Android 购买教程\n\n\
  在上一章中，我们探索了如何将应用内购买集成到项目中，并查看了代码示例。本章将通过创建一个示例来将这些理论付诸实践，演示如何在 Google Play Console\
  \ 中添加和管理购买。\n\n## 82.1 关于应用内购买示例项目\n\n该项目背后的简单概念是一个应用：在点击按钮之前，必须购买一个应用内商品。该应用内商品在每次点击按钮时都会被消耗，因此用户每次想要点击它时，都需要重新购买该商品。在初始化时，应用将连接到应用商店，获取商品详情并显示商品名称。一旦应用确认商品可用，将启用一个购买按钮，点击该按钮将进入购买流程。购买完成后，将启用第二个按钮，以便用户点击它并消耗购买的项目。\n\
  \n## 82.2 创建 InAppPurchase 项目\n\n此项练习的第一步是创建一个新项目。首先启动 Android Studio 并在欢迎界面上选择\
  \ New Project（新建项目）选项。在新项目对话框中，选择 Empty Activity 模板，然后点击 Next（下一步）按钮。\n\n在 Name\
  \ 字段中输入 `InAppPurchase`，并指定在 Google Play 生态系统中唯一标识你的应用的包名（例如 `com.<your company>.InAppPurchase`）。在点击\
  \ Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将语言菜单为 Java。项目创建后，按照步骤将项目转换为使用\
  \ view binding（视图绑定）。\n\n## 82.3 为项目添加库\n\n在开始编写代码之前，需要向项目配置添加一些库，包括标准的 Android\
  \ billing 库。在随后的项目中，我们还需要使用 `ImmutableList` 类，它是 Google Guava Core Java 库的一部分。现在通过修改\
  \ `build.gradle` (Module: `InAppPurchase.app`) 文件并进行以下更改来添加这些库：\n\n```gradle\ndependencies\
  \ {\n    implementation 'com.android.billingclient:billing:5.0.0'\n    implementation\
  \ 'com.google.guava:guava:24.1-jre'\n    implementation 'com.google.guava:guava:27.0.1-android'\n\
  }\n```\n\n点击编辑器面板顶部的 Sync Now（立即同步）链接以提交这些更改。\n\n\n\n\n\n## 82.4 设计用户界面\n\n用户界面将由现有的\
  \ `TextView` 和两个 `Buttons` 组成。在编辑器加载 `activity_main.xml` 文件后，将两个 `Button` 视图拖动到布局中，使一个位于\
  \ `TextView` 上方，另一个位于下方。选择 `TextView`并将 `id` 属性更改为 `statusText`。\n\n点击工具栏上的“Clear\
  \ all Constraints”（清除所有约束）按钮，并按 Shift 点击所有三个视图。右键点击最顶部的 `Button` 视图，选择“Center ->\
  \ Horizontally in Parent”（父布局水平居中）菜单选项。再次重复此步骤，这次选择“Chains -> Create Vertical Chain”（创建垂直链）。更改顶部按钮的\
  \ `text` 属性显示为“Consume Purchase”，并将 `id` 改为 `consumeButton`。同时，配置 `onClick` 属性以调用名为\
  \ `consumePurchase` 的方法。\n\n选择最底部的按钮并重复上述步骤，这次将 `text` 设置为“Buy Product”，“`id` 设置为\
  \ `buyButton”，并将 `onClick` 回调设置为 `makePurchase`。完成后，布局应与图 82-1 所示所示：\n\n![](img/in_app_billing_ui.jpg)\n\
  \n图 82-1\n\n## 82.5 将应用添加到 Google Play 商店\n\n使用标题为创建、测试和上传 Android App Bundle 的章节中概述的步骤，登录\
  \ Play Console，创建一个新应用，并设置一个新的内部测试轨道，其中包含指定测试人员的电子邮件地址。返回 Android Studio 为项目生成一个已签名的发布版\
  \ app bundle。一旦生成了 bundle 文件，将其上传到内部测试轨道并发布进行测试。\n\n现在应用已出现在 Google Play 商店中，我们准备好为该项目创建一个应用内产品了。\n\
  \n## 82.6 创建应用内产品\n\n在 Play Console 中选中应用，向下滚动左侧面板中的选项列表直到“Monetize”（变现）部分出现。在该部分，选择“Products”下的“In-app\
  \ products”（应用内产品）选项，如图 82-2 所示：\n\n![](img/play_console_monetization1.jpg)\n\n\
  图 82-2\n\n在应用内内产品页面上，点击“Create product”（创建产品）按钮：\n\n![](img/play_console_create_product.jpg)\n\
  \n图 82-3\n\n在新产品屏幕上，在保存新产品之前输入以下信息：\n\n- Product ID: `one_button_click`\n- Name:\
  \ A Button Click\n- Description: 这是一个测试应用内产品，允许按钮被点击一次。\n- Default price (默认价格):\
  \ 设置为你偏好货币的最低价格。\n\n# 82.7 启用许可测试人员\n\n在测试应用内结算时，能够在不花费任何资金的情况下进行测试购买是有用的。这可以通过为内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收费。\n\
  \n在 Play Console 中，返回主屏幕并选择“Setup -> License testing”（设置 -> 许可测试）选项：\n\n![](img/play_console_license_testing.jpg)\n\
  \n图 82-4\n\n在许可测试屏幕内，添加为内部测试轨道添加的测试人员，将 `License response` 设置更改为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![](img/play_console_license_testing_screen.jpg)\n\n图 82-5\n\n现在应用和应用内产品都已在\
  \ Play Console 中设置，我们可以开始向项目添加代码了。\n\n## 82.8 初始化 Billing Client\n\n编辑 `MainActivity.kt`\
  \ 文件并进行以下更改以开始实现应用内购买功能：\n\n```kotlin\nimport androidx.annotation.NonNull;\nimport\
  \ android.util.Log;\nimport com.android.billingclient.api.*;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ BillingClient billingClient;\n    private ProductDetails productDetails;\n   \
  \ private Purchase purchase;\n    static final String TAG = \"InAppPurchaseTag\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n                    .setListener(purchasesUpdatedListener)\n\
  \                    .enablePendingPurchases()\n                    .build();\n\
  \        billingClient.startConnection(new BillingStateListener() {\n          \
  \  @Override\n            public void onBillingSetup(@NonNull BillingResult billingResult)\
  \ {\n                if (billingResult.getResponseCode() == BillingClient.ResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnSetupFinish connected\");\n            \
  \        queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnSetupFinish failed\");\n                }\n            }\n            @Override\n\
  \            public void onBillingServiceDisconnected() {\n                Log.i(TAG,\
  \ \"OnSetupFinish connection lost\");\n            }\n        });\n    }\n}\n```\n\
  \n当应用启动时，`onCreate()` 方法现在将调用 `billingSetup()`，反过来这将创建一个新的 billing client 实例并尝试连接到\
  \ Google Play Billing Library。`onBillingSetup()` 监听器将在连接尝试完成后被调用，并输出连接成功或失败的 Logcat\
  \ 信息。最后，我们还实现了 `onBillingServiceDisconnected()` 回调，当 Google Play 连接丢失时将调用它。\n\n\
  如果连接成功，将调用名为 `queryProduct()` 的方法。现在需要添加此方法以及分配给 billing client 的 `purchasesListener`。\n\
  \n## 82.9 查询产品\n\n为了确保产品可以购买，我们需要创建一个 `QueryProductDetailsParams` 实例，配置为 Play Console\
  \ 中指定的产品 ID，并将其传递给 billing client 的 `queryProductDetailsAsync()` 方法。这将要求我们添加 `onProductDetailsResponse()`\
  \ 回调方法，我们在其中检查产品是否存在、提取产品名称并显示在状态 `TextView` 上。现在我们已经获取了产品详情，也可以安全地启用购买按钮。在 `MainActivity`\
  \ 文件中添加 `queryProduct()` 方法，其内容如下：\n\n```kotlin\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \            .setProductList(\n                ImmutableList.of(\n             \
  \       QueryProductDetailsParams.Product.newBuilder()\n                       \
  \ .setProductId(\"one_button_click\")\n                        .setType(BillingClient.Type.INAPP)\n\
  \                        .build())\n            )\n            .build();\n    billingClient.queryProductDetailsAsync(\n\
  \        queryProductDetailsParams,\n        new ProductDetailsListener() {\n  \
  \          public void onProductDetailsResponse(\n                @NonNull BillingResult\
  \ billingResult,\n                @NonNull List<ProductDetails> productDetailsList)\
  \ {\n                if (!productDetailsList.isEmpty()) {\n                    productDetails\
  \ = productDetailsList.get(0);\n                    runOnUiThread(() -> {\n    \
  \                    binding.buyButton.setEnabled(true);\n                     \
  \   binding.statusText.setText(productDetails.getName());\n                    });\n\
  \                }\n            }\n        });\n}\n```\n\n\n\n\n\n```java\nLog.i(TAG,\
  \ \"onProductDetailsResponse: No products\");\n// ...\n```\n\n这里使用的许多代码在上一章中应该已经熟悉了。监听器代码检查是否至少找到一个符合查询标准的产品。然后，从第一个匹配的产品中提取\
  \ `ProductDetails` 对象，并将其存储在 `productDetails` 变量中，并将产品名称属性显示在 `TextView` 上。\n\n\
  需要注意的是点是，当我们在状态 `TextView` 上显示产品名称时，是通过调用 `runOnUiThread()` 实现的。这是必要的，因为监听器运行在主线程之外，因此无法安全地直接对用户界面进行更改。`runOnUiThread()`\
  \ 方法提供了一种在主线程上执行代码的快速方便的方法，而无需使用协程。\n\n## 82.10 启动购买流程\n\n当用户点击购买按钮时，将调用名为 `makePurchase()`\
  \ 的方法来启动购买流程。我们现在如下添加此方法：\n\n```java\npublic void makePurchase(View view) {\n  \
  \  BillingFlowParams billingFlowParams =\n        BillingFlowParams.newBuilder()\n\
  \            .setProductDetailsParamsList(\n                ImmutableList.of(\n\
  \                    BillingFlowParams.ProductDetailsParams.newBuilder()\n     \
  \                   .setProductDetails(productDetails)\n                       \
  \ .build()\n                )\n            )\n            .build();\n    billingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n}\n```\n\n## 82.11 处理购买更新\n\n购买流程的结果将通过在初始化阶段分配给结算客户端的 `PurchaseUpdatedListener`\
  \ 报告给应用。现在如下添加此处理程序：\n\n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener\
  \ = new PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult,\n                                List<Purchase> purchases) {\n\
  \        if (billingResult.getResponseCode() ==\n                            BillingClient.BillingResponseCode.OK\n\
  \                && purchases != null) {\n            for (Purchase purchase : purchases)\
  \ {\n                completePurchase(purchase);\n            }\n        } else\
  \ if (billingResult.getResponseCode() ==\n                BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理程序将输出日志消息。然而，成功的购买将导致调用 `completePurchase()`\
  \ 方法，并向其传递当前的 `Purchase` 对象。如下所示添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.State.PURCHASED)\n\
  \        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n}\n\
  ```\n\n此方法在验证产品已购买且支付仍处于挂起状态之前存储购买记录。然后启用“消耗”按钮并通知用户购买成功。\n\n## 82.12 消耗产品\n\n现在用户已经可以点击“消耗”按钮了，下一步是使产品被消耗掉，这样在购买另一个按钮之前，只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams =\n        ConsumeParams.newBuilder()\n       \
  \     .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\n  \
  \  ConsumeResponseListener listener = new ConsumeResponseListener() {\n        @Override\n\
  \        public void onConsumeResponse(BillingResult billingResult,\n          \
  \  @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ ==\n                            BillingClient.BillingResponseCode.OK) {\n    \
  \            runOnUiThread(() -> {\n                    binding.consumeButton.setEnabled(false);\n\
  \                    binding.statusText.setText(\"Purchase consumed\");\n      \
  \          });\n            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建一个 `ConsumeParams` 实例并使用当前购买的购买令牌进行配置（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）。它被传递给 `consumePurchase()` 方法，该方法在带有 `IO` 调度器的协程中启动。如果产品成功消耗，将在主线程中执行代码以禁用消耗按钮并更新状态文本。\n\
  \n## 82.13 恢复之前的购买\n\n通过目前为止添加的代码，我们可以在单个会话中购买并消耗产品。如果我们进行购买并在消耗之前退出应用，那么购买记录在应用重启时将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并将其传递给结算客户端的 `queryPurchasesAsync()` 方法，同时带上监听器的引用，监听器将带有结果被调用。如下在\
  \ `MainActivity.kt` 文件中添加新函数和监听器：\n\n```java\nprivate void reloadPurchase() {\n\
  \    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n \
  \   billingClient.queryPurchasesAsync(\n        queryPurchasesParams,\n        purchasesListener\n\
  \    );\n}\n\nprivate final PurchasesResponseListener purchasesListener = new PurchasesResponseListener()\
  \ {\n    @Override\n    public void onPurchasesResponse(@NonNull BillingResult billingResult,\n\
  \        @NonNull List<Purchase> list) {\n        if (!list.isEmpty()) {\n     \
  \       purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n如果传递给监听器的购买列表为空，则将列表中的第一个购买分配给 `purchase` 变量，并启用消耗按钮（在更完整的实现中应该添加检查以是正确产品并处理多个购买返回）。如果没有找到购买，则在再次购买之前将禁用消耗按钮。剩下的就是在结算过程中如下调用我们的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n    if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n        Log.i(TAG, \"OnBillingSetup\
  \ connected\");\n        queryProduct();\n        reloadPurchase();\n    } else\
  \ {\n        Log.i(TAG, \"OnBillingSetup failed\");\n    }\n}\n```\n\n## 82.14 测试应用\n\
  \n在测试应用之前，我们需要将此版本上传到 Play Console。由于我们已经上传了版本 1，首先需要在 `build.gradle` (Module: InAppPurchase.app)\
  \ 文件中增加版本号：\n\n```gradle\ndefaultConfig {\n    applicationId \"com.ebookfrenzy.inapppurchase\"\
  \n    minSdk 26\n    targetSdk 32\n    versionCode 2\n    versionName \"2.0\"\n\
  }\n```\n\n\n\n\n同步构建配置，然后按照“创建、测试和上传 Android App Bundle” 章节中的步骤生成新的程序包，将其上传到内部测试轨道并发布给测试人员。使用测试轨道链接，在登录了其中一个测试账户的设备或模拟器上安装应用。\n\
  \n应用启动后，经过短暂的延迟，它应该在 `TextView` 上显示产品名称。点击购买按钮将开始如图 82-6 所示的购买流程：\n\n![](img/in_app_billing_test_purchase.jpg)\n\
  \n图 82-6\n\n点击购买按钮使用测试卡完成购买，并等待 `Consume Purchase` 按钮启用。在点击此按钮之前，尝试再次购买产品，并验证无法再次购买，因为你已经拥有该产品。\n\
  \n点击 `Consume Purchase` 按钮，等待 `TextView` 上出现“Purchase consumed”（购买已消费）消息。产品被消费后，现在应该可以再次购买。再次进行一次购买，然后终止并重启应用。应用程序应该找到之前的未消费购买并启用消费按钮。\n\
  \n### 82.15 故障排除\n\n如果在购买过程中遇到问题，请确保设备已通过 USB 线或 WiFi 连接到 Android Studio，并在 `Logcat`\
  \ 面板中选择它。在 `Logcat` 搜索栏中输入 `InAppPurchaseTag` 并检查诊断输出，必要时在代码中添加额外的 `Log` 调用。关于失败的更多信息，一个实用的技巧是从\
  \ `BillingResult` 实例访问调试消息，例如：\n\n```java\n} else if (billingResult.getResponseCode()\n\
  \            == BillingClient.BillingResponseCode.USER_CANCELED) {\n    Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG, billingResult.getDebugMessage());\n\
  }\n```\n\n请注意，只要你不更改模块级 `build.gradle` 文件中的应用版本号，你现在应该能够直接在设备或模拟器上运行修改后的应用版本，而无需重新打包并上传到控制台。\n\
  \n如果未显示测试支付卡，请确保设备上的用户账户已添加到许可测试人员列表中。如果应用运行在物理设备上，请尝试在模拟器上运行。如果所有其他方法都失败，你可以输入有效的支付方式进行测试购买，然后通过\
  \ Play 控制台首页访问的订单管理界面为自己退款。\n\n### 82.16 总结\n\n在本章中，我们创建了一个项目，演示了如何向 Android 应用中添加内购产品。这包括在\
  \ Google Play 控制台中创建产品、编写初始化并连接计费客户端的代码、查询可用产品，最后对产品进行购买和消费。我们还解释了如何使用 Play 控制台添加许可测试人员，以便在测试期间进行购买而无需花费费用。\n\
  \n# 83. Android 动态功能模块概述\n\n如前一章所述，应用包（App Bundles）和动态交付（Dynamic Delivery）的引入显著减少了用户在\
  \ Android 设备上安装应用时需要下载的应用包文件的大小。尽管最初初衷是为每种可能的设备配置自动生成独立的包文件，但动态交付的另一个关键优势是可以将应用拆分成多个可以按需安装的动态功能模块。\n\
  \n在本章中，我们将开始探索动态功能模块的基本概念，为在下一章中详细的实践示例做准备。\n\n### 83.1 动态功能模块概述\n\n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许将组成 Android 应用的不同功能打包成单独的模块，这些模块仅在用户需要时才会被下载并安装到设备上。例如，一个应用可能包含新闻功能和讨论功能。在这种情况下，应用默认可能只安装新闻功能，并将讨论功能单独拆分为一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问过该功能，该模块将永远不会被安装，从而确保应用仅使用绝对最少的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和安装时间具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常使用的模块。\n\
  \n动态功能还可能被指定为“即时”（instant）模块。这取代了早期 Android 版本中的“即时应用”（Instant App）概念，允许动态功能模块在无需安装应用的情况下在设备上运行。这使得应用可以在\
  \ Google Play 应用商店中带有“立即尝试”按钮出现，或者通过点击网络 URL 在设备上立即启动。\n\n### 83.2 动态功能模块架构\n\n\
  Android 从设计之初就考虑了模块化，特别是在 `Intents` 和 `Activities` 方面。动态功能将这种哲学推向了逻辑终，允许应用在用户需要的时候安装用户需要的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块使用拆分 APK 文件（split APK files）构建，这些文件允许多个 APK 文件组合成一个单一应用。\n\n正如我们在“创建、测试和上传\
  \ Android App Bundle”中学学的，动态交付和应用包通过生成自定义 APK 文件来工作，该文件仅包含在特定设备配置上运行应用所需的字节码和资源。在这种情况下，应用仍然通过单个\
  \ APK 文件安装，尽管它是针对用户定制的。\n\n相比之下，动态功能模块通过将应用拆分为多个称为拆分 APK 的来工作。\n\n当应用使用拆分 APK 文件时，在首次下载应用时只会安装基础模块（base\
  \ module）。基础模块通过可启动的 Activity 作为应用的入口点，并包含了应用基础功能所需的字节码和资源，以及应用其余部分所需的配置和构建资源。例如，基础模块的清单包含了与绑定的任何动态功能模块清单的合并结果。基础模块还包含了应用包中动态功能模块的列表，且所有动态功能模块必须在它们的构建配置中列出基础模块作为依赖项。\n\
  \n\n\n当用户从应用商店请求安装应用时，商店将为模块生成一个 `Base APK` 文件，该文件包含所有设备配置通用的字节码和资源，此外还会生成一组专门针对用户设备配置的\
  \ `Configuration APK` 文件。同样，安装动态功能模块的请求将生成一个 `Dynamic Feature APK` 文件，并包含相应的 `Configuration\
  \ APK` 文件，如下方的图 83-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\n图 83-1\n\
  \n### 83.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目中添加动态功能。要添加新模块，只需选择 Android Studio\
  \ 菜单中的 `File -> New -> New Module...` 即可。在弹出的对话框中，根据你要创建的动态功能类型，在左侧面板选择 `Dynamic\
  \ Feature Module`（动态功能模块）或 `Instant Dynamic Feature Module`（即时动态功能模块）选项：\n\n![](img/as_4.2_add_dynamic_feature.jpg)\n\
  \n图 83-2\n\n选择好相应的动态功能选项后，为模块命名并修改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将构建失败）。\n\
  \n再次点击 `Next` 按钮配置 `On-Demand`（按需）选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\
  \n图 83-3\n\n当启用 `Fusing` 选项时，在运行旧版本 Android（Android 4.4 API 20 或更版本）的设备上，模块将与基础\
  \ APK 一起下载。`Module Title`（模块标题）字符串长度最大可达 50 个字符，Google Play 将在消息和通知中向用户描述该功能。\n\n\
  `Install-time`（安装时）包含菜单提供了选项，用于控制模块按需安装的条件，而不是包含在用户设备上的应用初始安装中。该菜单提供以下选项：\n\n- **Do\
  \ not include module at install time (on-demand only)**（安装时不包含模块（仅限按需）） - 无论设备配置和用户国家如何，在应用请求之前，模块不会被安装。\n\
  - **Include module at install time**（安装时包含模块） - 禁用所有设备和用户国家的按需动态安装。模块将在应用安装到设备的同时安装。\n\
  - **Only include module at install-time for devices with specified features**（仅对具有特定功能的设备在安装时包含模块）\
  \ - 对于符合指定标准的设备配置和用户国家将在安装时包含模块。所有其他国家和设备配置将使用动态按需安装。当选择此选项时，将出现额外选项允许输入设备功能。在图\
  \ 83-4 中，例如模块将在带有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，模块将根据需要动态动态安装：\n\n![](img/as_4.2_dynamic_feature_device_features.jpg)\n\
  \n图 83-4\n\n其他标准（如国家和 API 级别）必须在项目清单文件（`AndroidManifest.xml`）声明。例如，以下条目将禁用法国用户以及运行比\
  \ API 21 旧的 Android 版本的动态按需功能安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries\
  \ dist:exclude=\"true\">\n      <dist:country dist:code=\"FR\"/>\n  </dist:user-countries>\n\
  \  <dist:min-sdk dist:value=\"21\"/>\n</dist:conditions>\n```\n\n### 83.4 将现有模块转换为动态交付模式\n\
  \n如果应用包含一个非常适合动态交付的现有功能，可以通过几个基本步骤将其转换为动态功能。例如，考虑以下项目结构：\n\n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\
  \n图 83-5\n\n在此项目中，app 模块将作为基础模块，而 `secondfeature` 模块是转换为动态功能模块的理想理想候选者。\n\n要将应用中的现有模块转换为动态功能模块，首先编辑模块级的\
  \ `build.gradle` 文件（在上述示例中为 `Gradle Scripts -> build.gradle (Module: secondfeature)`），并修改为使用\
  \ `com.android.dynamic-feature` 代替 `com.android.application` 插件，同时更改依赖关系，使模块仅依赖基础（app）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\napply plugin: 'com.android.dynamic-feature'\n\
  \n.\n\ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.0.2'\n    api 'androidx.constraintlayout:constraintlayout:1.1.3'\n\
  \    testImplementation 'junit:junit:4.12'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑该模块的 `AndroidManifest.xml` 文件并进行如下修改（注意，在此示例中，这是一个按需模块，而不是即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n  xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n  package=\"frenzy\">\n  <dist:module\n    instant=\"false\"\n    onDemand=\"\
  true\"\n    title=\"@string/dynamic_feature\">\n    <dist:fusing include=\"true\"\
  \ />\n  </dist:module>\n</manifest>\n```\n\n注意，这里的 `title` 属性引用了一个字符串资源，该资源需要在 `strings.xml`\
  \ 中声明。\n\n下一步，需要修改基础模块的 `build.gradle` 文件（`Module: app`）以引用动态功能并添加 Play Core 依赖：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 29\n    dynamicFeatures = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.0.3'\n\
  }\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件以声明 `SplitCompat`：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n  package=\"frenzy.mydemoapp\">\n  <application\n    android:name=\"com.google.android.play.core.splitcompat.SplitCompat\"\
  \n    android:allowBackup=\"true\">\n</manifest>\n```\n\n### 83.5 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这涉及检查模块是否已安装、安装模块以及删除不再需要的已安装模块。所有这些任务都通过使用\
  \ Play Core 库提供的 API 完成，并且大多数 API 调用都涉及 `SplitInstallManager` 实例的使用，其创建方式如下：\n\n\
  ```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能的第一步是检查相应的模块是否已经安装。例如，以下代码获取已模块列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法，可以安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n```\n\n\n\n\n```java\n\
  SplitInstallRequest request = SplitInstallRequest\n            .newBuilder()\n \
  \           .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\n\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        @Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId\n        }\n    })\n    .addOnFailureListener(new\
  \ OnFailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，模块安装将立即开始。或者，也可以通过向 `deferredInstall()`\
  \ 方法传递一个特性模块名称数组来执行延迟安装：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n延迟下载将由操作系统根据实际情况在后台执行。\n\n虽然无法跟踪延迟安装的状态，但可以通过向管理器添加监听器来跟踪非延迟安装的状态：\n\
  \n```java\nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitInstallSessionState state)\
  \ {\n        if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    // 大模块需要用户确认\n                    break;\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    // 模块正在下载\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    // 已下载的模块正在安装中\n                    break;\n              \
  \  case SplitInstallSessionStatus.DOWNLOADED:\n                    // 模块下载完成\n \
  \                   break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    // 模块已安装\n                    break;\n                case\
  \ SplitInstallSessionStatus.CANCELED:\n                    // 用户取消了下载\n        \
  \            break;\n                case SplitInstallSessionStatus.PENDING:\n \
  \                   // 安装已延迟\n                    break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    // 安装失败\n                    break;\n            }\n      \
  \  }\n    }\n};\n```\n\n一旦实现了监听器，就需要将其在 `SplitInstallManager` 实例上进行注册，并在不再需要时取消注册。\n\
  \n```java\nmanager.registerListener(listener);\nmanager.unregisterListener(listener);\n\
  ```\n\n### 8.6 处理动态特性模块\n\nAndroid 交付系统在未先向用户请求权限的情况下，允许下载大小大于 10MB 的动态特性。当请求下载大型特性模块时，监听器将被调用并传递一个\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，应用程序有责任显示确认对话框，并可选地实现 `onActivityResult()`\
  \ 处理程序，以识别用户是批准还是拒绝了下载。\n\n```java\nprivate static final int REQUEST_CODE = 101;\n\
  \nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitInstallSessionState state)\
  \ {\n        if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    try {\n                        manager.startConfirmationDialogForResult(state,\
  \ MainActivity.this, REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        // 请求失败\n                    }\n              \
  \      break;\n            }\n        }\n    }\n};\n```\n\n上述代码启动了一个意，该意随后显示内置的确认对话框。该意会将结果码返回给\
  \ `onActivityResult()` 方法，该方法可以实现如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准安装\n        } else\
  \ {\n            // 用户拒绝安装\n        }\n    }\n}\n```\n\n### 8.7 总结\n\n动态特性模块允许将\
  \ Android 应用拆分为单独特性，这些特性在用户需要时进行下载。动态特性模块还可以被配置为即时特性（instant features）。即时特性无需安装应用即可运行，用户可以通过商店页面上的“立即体验”按钮或通过网络\
  \ URL 访问它们。\n\n\n\n\n一旦动态功能模块完成下载，用户很可能需要立即访问组成该功能的代码和资源资产。然而，默认情况下，新安装的功能模块在应用重启之前对应用的其他部分不可用。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。到目前为止，实现最简单的方法是在主 `AndroidManifest.xml` 文件（也称为基础模块清单文件）中将应用程序声明为\
  \ `SplitCompatApplication` 的子类，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.dynamicfeature\">\n<application\n      android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n      android:allowBackup=\"\
  true\"\n      android:icon=\"@mipmap/ic_launcher\"\n      android:label=\"@string/app_name\"\
  \n      android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n## 84.3 设计基础 Activity\
  \ 用户界面\n\n此时，项目包含一个 activity，它将作为应用基础模块的入口点。该基础模块将负责请求、安装和管理动态功能模块。\n\n为了演示动态功能的使用，基础\
  \ activity 由一系列按钮组成，允许安装、启动和移除动态功能模块。用户界面还将包含一个 `TextView` 对象，用于显示与动态功能模块相关的状态信息。考虑到这些要求，将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，删除默认的 `TextView` 对象，并实现设计使其类似于下面的图 84-1。\n\n\
  ![](img/as_4.1_dynamic_feature_ui.jpg)\n图 84-1\n\n一旦定位了对象，选择 `TextView` 控件并使用“属性（Attributes）”工具窗口将\
  \ `id` 属性设置为 `status_text`。通过选择布局中的所有对象，右键点击 `TextView` 对象并从菜单中选择 `Center -> Horizontally`\
  \ 选项开始应用布局约束，从而将所有四个对象约束在屏幕的水平中心。\n\n在所有对象仍被选中的情况下，再次右键点击 `TextView`，这次选择 `Chains\
  \ -> Vertical Chain` 菜单选项。在继续之前，将所有按钮文本字符串提取到资源，并配置三个按钮分别调用名为 `launchFeature`、`installFeature`\
  \ 和 `deleteFeature` 的方法。\n\n## 84.4 添加动态功能模块\n\n要向项目添加动态功能模块，选择 `File -> New ->\
  \ New Module...` 菜单选项，在弹出的对话框中，从左侧面板选择 `Dynamic Feature`。在主面板中，将模块命名为 `my_dynamic_feature`，并将最小\
  \ API 设置为 `API 26: Android 8.0 (Oreo)`，以便与基础模块选择的 API 级别匹配，如图 84-2 所示：\n\n![](img/as_4.2_add_dynmaic_feature.jpg)\n\
  图 84-2\n\n再次点击 `Next` 按钮以配置按需（On-Demand）选项，确保已启用 `Fusing` 选项。在 `Module Title` 字段中输入文本“My\
  \ Example Dynamic Feature”：\n\n![](img/as_4.2_dynamic_feature_options1.jpg)\n图 84-3\n\
  \n为了本示例的目的，在点击 `Finish` 按钮之前，将 `Install-time` 包含菜单设置为 `Do not include module at\
  \ install time (on-demand only)`，以提交更改并将动态功能模块添加到项目中。\n\n## 84.5 检查动态功能模块\n\n在继续下一步之前，值得花些时间查看\
  \ Android Studio 对项目所做的更改。理解这些更改在解决问题以及将现有应用功能转换为动态功能时都是非常有用的。\n\n首先参考 `Project`\
  \ 工具窗口，那里将出现一个新条目，代表包含新动态功能模块的文件夹：\n\n![](img/as_3.5_dynamic_feature_in_project_window.jpg)\n\
  图 84-4\n\n注意，该功能有自己的子结构，包括一个清单文件、一个可以添加代码和资源的包以及一个 `res` 文件夹。打开并检查 `AndroidManifest.xml`\
  \ 文件，它应该包含在功能创建过程中选择的属性设置，包括按需、合并（fusing）和功能标题的值：\n\n```xml\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n      \
  \  dist:instant=\"false\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:delivery>\n            <dist:demand />\n        </dist:delivery>\n\
  \        <dist:fusing dist=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n\
  值得感兴趣的一点是，模块标题已存储为资源，而不是直接输入清单文件中。这是标题的先决条件，可以在基础模块的 `strings.xml`（app -> values）中找到并在必要时修改。\n\
  \n动态构建配置可以在 `Gradle Scripts -> build.gradle (Module:my_dynamic_feature)` 中找到，其内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 33\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件的关键项是 `com.android.dynamic-feature` 插件，它确保该模块被视为动态功能，以及 `implementation`\
  \ 行，表明该功能依赖于基础模块。\n\n基础模块的 `build.gradle` 文件（Gradle Scripts -> build.gradle (Module:app））也包含列出动态功能的新条目。在查看文件时，添加启用视图绑定（view\
  \ binding）的指令：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n    dynamicFeatures\
  \ = [':my_dynamic_feature']\n}\n```\n\n项目中添加的任何动态功能都需要在此处引用，例如：`dynamicFeatures\
  \ = [\":my_dynamic_feature\", \":my_second_feature\", ...]`\n\n## 84.6 添加动态功能 Activity\n\
  \n如图 84-4 所示，动态功能目前只有一个清单文件。下一步是向模块添加一个 activity，以便功能在从基础模块启动时能够实际运行。在项目工具窗口中，右键点击\
  \ `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity -> Empty Activity` 菜单选项。将活动命名为\
  \ `MyFeatureActivity` 并启用 `Generate Layout File` 选项，但禁用 `Launcher Activity` 选项，然后点击\
  \ `Finish` 按钮。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n图 84-5\n\n一旦活动已添加到模块中，编辑\
  \ `AndroidManifest.xml` 文件并修改它以添加意图过滤器，允许该活动被基础模块启动（将 `<com.yourcompany>` 替换为为了使应用在\
  \ Google Play 上唯一而选择的包名）：\n\n\n\n\n\n```xml\n<manifest>\n    <dist:delivery>\n \
  \       <dist:on-demand />\n    </dist:delivery>\n    <dist:fusing dist:include=\"\
  true\" />\n  </dist:module>\n  <application>\n    <activity android:name=\".MyFeatureActivity\"\
  \ android:exported=\"true\">\n      <intent-filter>\n        <action android:name=\"\
  android.intent.action.VIEW\" />\n        <action android:name=\"com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n        <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \    </intent-filter>\n    </activity>\n  </application>\n</manifest>\n```\n\n接下来，编辑\
  \ `build.gradle`（Module: `DynamicFeature.my_dynamic_feature`）文件的依赖部分以包含 Google Play\
  \ 库：\n\n```gradle\ndependencies {\n    .\n    implementation 'com.google.android.play:core:1.10.1'\n\
  \    .\n}\n```\n\n为了能够从动态模块内部访问资源，需要在 `MyFeatureActivity` 中调用 `SplitCompat.install()`\
  \ 方法。编辑 `MainActivity.java` 文件并按所示修改 `onCreate()` 方法，包括添加视图绑定（view binding）支持的变化：\n\
  \n```java\nimport android.view.View;\nimport com.google.android.play.core.splitcompat.SplitCompat;\n\
  import <com.yourcompany>.dynamicfeature.databinding.ActivityMainBinding;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_my_feature);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n未执行此步骤通常会导致应用在启动动态功能时崩溃，并出现类似下面的错误：\n\n`AndroidRuntime: java.lang.RuntimeException:\
  \ Unable to start activity ComponentInfo{com.ebookfrenzy.dynamicfeature/com.ebookfrenzy.my_dynamic_feature.MyFeatureActivity}:\
  \ android.content.res.Resources$NotFoundException: Resource ID #0x80020000`\n\n\
  将 `activity_my_feature.xml` 文件加载到布局编辑器工具中，并添加一个显示“My Dynamic Feature Module”文本的\
  \ `TextView` 对象以完成该功能：\n\n![](img/as_3.4_dynamic_feature_activity_ui.jpg)\n\n图 84-6\n\
  \n### 84.7 实现 `launchIntent()` 方法\n\n项目结构和用户界面设计完成后，现在是时候使用 Play Core 库开始处理动态功能模块了。第一步是实现\
  \ `launchFeature()` 方法，其目的是使用 intent 启动动态功能 activity。然而，尝试在尚未安装的动态功能模块中启动 activity\
  \ 会导致应用崩溃。因此，`launchFeature()` 方法需要包含一些防御性代码以确保动态功能已经安装。为了实现这一点，我们需要创建一个 `SplitInstallManager`\
  \ 类的实例，并调用该对象的 `getInstalledModules()` 方法来检查 `my_dynamic_feature` 模块是否已经安装。如果已安装，就可以安全地启动模块中包含的\
  \ activity，否则需要在状态 `TextView` 上向用户显示消息。在 `MainActivity.java` 文件中，对该类进行以下更改：\n\n\
  ```java\nimport android.content.Intent;\n.\nimport com.google.android.play.core.splitinstall.SplitInstallManager;\n\
  import com.google.android.play.core.splitinstall.SplitInstallFactory;\n.\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private SplitInstallManager manager;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n            Intent i = new Intent(this, \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\n            startActivity(i);\n        } else {\n            binding.statusText.setText(\"\
  Feature not installed\");\n        }\n    }\n}\n```\n\n### 84.8 上传 App Bundle 进行测试\n\
  \n项目现在已准备好进行第一阶段测试。这涉及生成一个 release bundle 并上传到 Google Play Console。实现这些步骤的操作在“创建、测试和上传\
  \ Android Bundle”章节中已概述，但可以总结如下：\n\n1. 登录 Google Play Console 并创建一个新应用。\n2. 按照步骤在标题、描述和图像资源方面配置应用（示例图像资源可以在随书附带示例代码的\
  \ `image_assets` 文件夹中找到）并保存草稿。同时，确保为 bundle 启用 Google Play 应用签名。\n3. 使用 Android\
  \ Studio 中的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成签名的 release app\
  \ bundle。\n4. 在 Google Play Console 中，从左侧导航面板中选择 `Testing`（测试）-> `Internal testing`（内部测试）。\n\
  5. 在内部测试界面上，点击 `Create Release`（创建发布），将生成的签名的 app bundle 文件拖入上传框中，并点击 `Save`（保存）。\n\
  6. 切换到 `Testers`标签页，添加要在物理设备上测试应用的账户邮箱。\n7. 返回 `Releases`（发布）标签页，点击 `Edit`（编辑）按钮。滚动到页面底部并点击\
  \ `Review release`（审核发布）按钮。\n8. 在确认屏幕上，点击 `Start rollout to Internal testing`（发布到内部测试）按钮。应用将显示为\
  \ `Pending`（等待中）。\n\n一旦发布，将向所有内部测试用户发送通知，让他们加入测试。或者，复制 `Testers` 屏幕上的 URL 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开时将启动\
  \ Play Store 并打开图 84-7 所示的 `DynamicFeature` 应用下载页：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 84-7\n\n点击按钮安装应用，然后打开它并点击 `Launch Feature` 按钮。动态功能尚未安装的事反映在状态文本中。\n\n### 84.9\
  \ 实现 `installFeature()` 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个\
  \ `SplitInstallRequest` 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示指示请求状态的\
  \ `Toast` 消息。仍在 `MainActivity.java` 文件中，按所示添加 `installFeature()` 方法：\n\n```java\n\
  import android.widget.Toast;\n.\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  .\npublic void installFeature(View view) {\n    SplitInstallRequest request =\n\
  \            SplitInstallRequest.newBuilder()\n                .addModule(\"my_dynamic_feature\"\
  )\n                .build();\n\n    manager.startInstall(request)\n}\n```\n\n\n\n\
  ```java\n            .addOnSuccessListener(new OnSuccessListener<Integer>() {\n\
  \                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    Toast.makeText(MainActivity.this,\n                   \
  \         \"Module installation started\",\n                            Toast.LENGTH_SHORT).show();\n\
  \                }\n            })\n            .addOnFailureListener(new OnFailureListener()\
  \ {\n                @Override\n                public void onFailure(Exception\
  \ exception) {\n                    Toast.makeText(MainActivity.this,\n        \
  \                    \"Module installation failed\" + exception.toString(),\n  \
  \                          Toast.LENGTH_SHORT).show();\n                }\n    \
  \        });\n    }\n}\n```\n\n编辑 `Gradle Scripts` -> `build.gradle (Module: DynamicFeature.app)`\
  \ 文件，并增加 `versionCode` 和 `versionName` 的值，以便将新版本的 App 包上传进行测试：\n\n```gradle\nandroid\
  \ {\n    versionCode 2\n    versionName \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts`\
  \ -> `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件中声明匹配的版本号。\n\n\
  生成一个包含更改的新 App 包，然后返回 Google Play Console 中该应用的 `Testing` -> `Internal testing`\
  \ 页面，并点击下方图 84-8 所示的高亮 `Create new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\
  \n图 84-8\n\n按照步骤上传新的 App 包并将其发布到内部测试。在测试设备上，打开 Google Play Store 应用，并确保 `Install`\
  \ 按钮已变为 `Update` 按钮（如果尚未 way，请关闭 App Store 应用并在等待几分钟后重试），并更新到新版本。更新完成后，运行应用，点击 `Install\
  \ Feature` 按钮并检查 `Toast` 消息，以确保安装已成功。在下载功能时，屏幕顶部状态栏将短暂出现下载图标。下载完成后，点击 `Launch Feature`\
  \ 按钮显示第二个活动（activity）。\n\n如果安装失败或应用崩溃，通常可以从 `LogCat` 输出中识别原因。要查看此输出，请将设备连接到开发计算机，打开终端或命令提示窗口并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n## 84.10 添加更新监听器（Update Listener）\n\n为了更详细地跟踪动态功能模块的安装进度，可以在应用中添加 `SplitInstallStateUpdatedListener`\
  \ 实例。由于可能同时安装多个功能，需要添加代码来跟踪分配给安装过程的会 ID。首先添加一些导入，在 `MainActivity.java` 文件中声明一个变量来包含当前的会\
  \ ID，并修改 `installFeature()` 方法，以便每次启动安装时存储会 ID 并注册监听器：\n\n```java\nimport com.android.play.core.install.SplitInstallSession;\n\
  import com.android.play.core.install.SplitInstallStateUpdatedListener;\nimport com.android.play.core.install.model.SplitInstallStatus;\n\
  import java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private SplitInstallManager manager;\n\
  \    private int mySessionId = 0;\n\n    public void installFeature(View view) {\n\
  \        manager.registerListener(listener);\n        manager.startInstall(request)\n\
  \            .addOnSuccessListener(new OnSuccessListener<Integer>() {\n        \
  \        @Override\n                public void onSuccess(Integer sessionId) {\n\
  \                    mySessionId = sessionId;\n                    Toast.makeText(MainActivity.this,\n\
  \                            \"Module installation started\",\n                \
  \            Toast.LENGTH_SHORT).show();\n                }\n            });\n \
  \   }\n```\n\n接下来，实现监听器代码，其读取如下：\n\n```java\nSplitInstallStateUpdatedListener listener\
  \ = new SplitInstallStateUpdatedListener() {\n    @Override\n    public void onStateUpdate(SplitInstallSessionState\
  \ state) {\n        if (state.sessionId() == mySessionId) {\n            switch\
  \ (state.status()) {\n                case SplitInstallStatus.DOWNLOADING:\n   \
  \                 long size = state.totalBytesToDownload();\n                  \
  \  long downloaded = state.bytesDownloaded();\n                    binding.statusText.setText(String.format(Locale.getDefault(),\n\
  \                            \"%d of %d bytes downloaded.\", downloaded, size));\n\
  \                    break;\n                case SplitInstallStatus.INSTALLING:\n\
  \                    binding.statusText.setText(\"Installing feature\");\n     \
  \               break;\n                case SplitInstallStatus.DOWNLOADED:\n  \
  \                  binding.statusText.setText(\"Download Complete\");\n        \
  \            break;\n                case SplitInstallStatus.INSTALLED:\n      \
  \              binding.statusText.setText(\"Installed - Feature is ready\");\n \
  \                   break;\n                case SplitInstallStatus.CANCELED:\n\
  \                    binding.statusText.setText(\"Installation cancelled\");\n \
  \                   break;\n                case SplitInstallStatus.PENDING:\n \
  \                   binding.statusText.setText(\"Installation pending\");\n    \
  \                break;\n                case SplitInstallStatus.FAILED:\n     \
  \               binding.statusText.setText(\n                            \"Installation\
  \ Failed. Error code: \" + state.errorCode());\n                case SplitInstallStatus.CANCELING:\n\
  \                    binding.statusText.setText(\"Installation canceling\");\n \
  \                   break;\n                case SplitInstallStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    binding.statusText.setText(\"User Confirmation Required\");\n\
  \                    break;\n                case SplitInstallStatus.UNKNOWN:\n\
  \                    binding.statusText.setText(\"Unknown Status\");\n         \
  \           break;\n            }\n        }\n    }\n};\n```\n\n该监听器捕获了许多常见的安装状态并相应更新状态文本，包括提供下载大小和目前已下载字节数总和的信息。在继续之前，添加\
  \ `onPause()` 和 `onResume()` 生命周期周期方法，以确保在应用非活动时注销监听器：\n\n```java\n@Override\npublic\
  \ void onResume() {\n    manager.registerListener(listener);\n    super.onResume();\n\
  }\n\n@Override\npublic void onPause() {\n    manager.unregisterListener(listener);\n\
  \    super.onPause();\n}\n```\n\n\n\n\n通过增加两个模块级 `build.gradle` 文件中的版本号信息、生成并上传新的发布版\
  \ App Bundle 以及将其推出测试，验证监听器代码是否正常。如果设备上已经安装了动态功能模块，`Play Core Library` 类将忽略再次下载该模块的尝试。因此，为了完全测试监听器，必须在安装更新的发布版本之前，从\
  \ Play Store 应用内部卸载应用。当然，移除应用后，将没有“更新”按钮来我们新版本已准备就绪安装。要查看 Play Store 应用将安装哪个版本，请向下滚动应用页面到“关于此应用”(About\
  \ this app) 按钮，点击它并检查下方 图 84-9 所示的“应用信息”(App Info) 区域中的“版本”(Version) 字段：\n\n![](img/as_dynamic_feature_version.jpg)\n\
  \n图 84-9\n\n如果仍列出旧版本，请退出 Play 应用并在几分钟后再再次检查。一旦列出新版本，完成安装，打开应用并检查在下载动态功能模块时状态文本是否相应更新。\n\
  \n### 84.11 使用延迟安装\n\n延迟安装会导致动态功能模块在后台下载，并由操作系统决定何时完成。当启动延迟安装时，监听器将以挂起（pending）状态被调用，除了检查模块是否已安装外，没有其他方法可以跟踪安装进度。\n\
  \n要尝试延迟安装，请修改 `installFeature()` 方法使其如下所示：\n\n```java\npublic void installFeature(View\
  \ view) {\n  manager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"));\n}\n\
  ```\n\n注意，`deferredInstall()` 方法传递了一个数组，允许对多个模块进行延迟安装。\n\n### 84.12 移除动态模块\n\n该项目的最后一个任务是在\
  \ `MainActivity.java` 文件中按所示实现 `deleteFeature()` 方法：\n\n```java\nimport java.util.Collections;\n\
  \npublic void deleteFeature(View view) {\n    manager.deferredUninstall(Collections.singletonList(\"\
  my_dynamic_feature\"));\n}\n```\n\n功能的移除将由操作系统在需要额外存储空间时在后台执行。与 `deferredInstall()`\
  \ 方法一样，可以在单次调用中调度多个功能的移除。\n\n## 84.13 总结\n\n本章完成了一个示例应用的创建，该旨在演示如何在 Android 应用中使用动态功能模块。涵盖的主题包括创建动态功能模块，以及使用\
  \ `Play Core Library` 的类和方法来安装和管理动态功能模块。\n\n# 85 使用 Material Design 3 主题\n\nAndroid\
  \ 应用的外观旨在符合 `Material Design` 定义的一系列指南。Material Design 由 Google 开发，旨在为不同应用之间提供某种层面的设计一致性，同时允许应用开发者在颜色、字体和形状选择方面包含他们自己的品牌标识（这一概念称为\
  \ Material 主题）。除了设计指南外，Material Design 还包含了一组用于设计用户界面布局的 UI 组件，其中许多组件我们在整书中一直在使用。\n\
  \n在本章中，我们将概述主题化在 Android Studio 项目中是如何运作的，并探索如何修改为新创建的项目提供的默认设计配置，以满足您的品牌需求。\n\n\
  ### 85.1 Material Design 2 与 Material Design 3\n\n在开始之前，重要的是，Google 目前正在从 `Material\
  \ Design 2` 向 `Material Design 3` 过渡，且使用 Android Studio Dolphin 创建的项目默认使用 Material\
  \ Design 2，除非在创建新项目时选择了 `Basic Activity (Material3)` 模板。Material Design 3 为 `Material\
  \ You` 基础，这是 Android 12 中引入的一个功能，允许应用自动调整主题元素，以配合用户在设备上配置的偏好。例如，Material Design\
  \ 3 提供的动态颜色支持允许应用使用的颜色自动自适应以匹配用户的壁纸选择。\n\n### 85.2 理解 Material Design 主题\n\n我们当然知道，Android\
  \ 应用的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们在 XML 布局资源文件中或通过编写代码显式覆盖颜色属性，否则所有这些组件都使用默认颜色显示。这些默认颜色由项目的主题定义。主题由一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，并为其分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都被编写为使用主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 小部件的前景和背景颜色）。因此，我们可以仅通过更改分配给特定主题槽的颜色来更改应用的全局主题。当应用运行时，当用户界面被渲染时，新的默认颜色将作为所有小部件的默认值。\n\
  \n### 85.3 Material Design 2 主题\n\n在探索 Material Design 3 之前，我们首先需要查看如何在 Android\
  \ Studio 项目中使用 Material Design 2。应用项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application`\
  \ 元素的属性，例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.themedemo\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:supportsRtl=\"\
  true\"\n        android:targetApi=\"31\"\n        android:theme=\"@style/Theme.MyApp\"\
  >\n```\n\n如之前所述，与主题相关的所有文件包含在 `res` 文件夹下的 `colors.xml` 和 `themes.xml` 文件中，如图 85-1\
  \ 所示：\n\n![](img/as_theme_files_window.jpg)\n\n图 85-1\n\n主题本身位于两个 `themes.xml` 文件中。这些资源文件为设备处于亮色模式或暗色模式时声明不同的调色板。注意每个文件样式名称必须与\
  \ `AndroidManifest.xml` 文件中引用的名称匹配：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- 基础应用主题 -->\n    <style name=\"Theme.MyApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- 主品牌颜色 -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/white</item>\n        <!-- 次要品牌颜色 -->\n       \
  \ <item name=\"colorSecondary\">@color/teal_200</item>\n    </style>\n```\n\n这些颜色槽（也称为颜色属性）用于\
  \ Material 组件在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽用于 `Material Button` 组件的背景颜色。分配给槽的实际颜色在\
  \ `colors.xml` 资源文件中声明如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <color name=\"purple_200\">#FFBB86FC</color>\n    <color name=\"\
  purple_500\">#FF620EE</color>\n    <color name=\"purple_700\">#FF3700B3</color>\n\
  \    <color name=\"teal_200\">#FF03DAC5</color>\n    <color name=\"teal_700\">#FF018786</color>\n\
  \    <color name=\"black\">#FF000000</color>\n    <color name=\"white\">#FFFFFFFF</color>\n\
  </resources>\n```\n\n\n\n\n例如，`colorPrimary` 插槽被分配了颜色 `purple_500`，而该颜色又被分配了 RGB\
  \ 颜色值 `FF6200EE`。\n\n创建自定义主题只需编辑这些文件以使用不同的颜色设置。这些更改将由 Material 组件作为默认颜色使用。\n\n##\
  \ 85.4 Material Design 3 主题\n\nMaterial Design 3 (MD3) 仍然使用 `colors.xml` 和 `themes.xml`\
  \ 文件，但为 MD3 组件提供了更广泛的颜色插槽。事实上，MD3 提供了 25 种颜色插槽用于自定义应用主题。颜色名称也不同，它们描述的是颜色的用途而非颜色本身。例如，在\
  \ Material Design 2 中，我们有一个命名为 `purple_500` 的颜色：\n\n```xml\n<color name=\"purple_500\"\
  >#FF6200EE</color>\n```\n\n这反过来被用于浅色模式 `themes.xml` 文件中的 `colorPrimary` 主题槽：\n\n\
  ```xml\n<item name=\"colorPrimary\">@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary`\
  \ 从紫色改为红色。当然，我们可以直接将一种红色的 RGB 值分配给 `purple_500` 颜色声明。遗憾的是，我们现在有了一个名称暗示它是紫色的红色颜色声明。唯一的选项是在\
  \ `colors.xml` 文件中为红色添加一个新条目，然后将其分配给 `themes.xml` 文件中的 `colorPrimary` 插槽。这种方法行得通，但为了实现这一点，我们必须编辑颜色文件和主题文件。在\
  \ MD3 中，颜色名称不再引用它们所代表的实际颜色。MD3 主题文件中的 `colorPrimary` 插槽声明如下：\n\n```xml\n<item name=\"\
  colorPrimary\">@color/md_theme_light_primary</item>\n```\n\n该颜色随后在 `colors.xml`\
  \ 文件中声明：\n\n```xml\n<color name=\"md_theme_light_primary\">#B82000</color>\n```\n\
  \n我们现在可以更改此颜色的 RGB 值，而保持 `themes.xml` 文件不变，且无需在 `colors.xml` 文件中创建新的颜色元素。\n\n此外，MD3\
  \ `themes.xml` 文件中的元素是基于 `Theme.Material3.*` 而不是 `Theme.MaterialComponents.*`。例如，以下是\
  \ MD3 `themes.xml` 文件的片段：\n\n```xml\n<resources>\n    <style name=\"Base.Theme.MyAppDemo\"\
  \ parent=\"Theme.Material3.DayNight.NoActionBar\">\n    .\n    </style>\n    <style\
  \ name=\"Theme.MyAppDemo\" parent=\"Base.Theme.MyAppDemo\" />\n</resources>\n```\n\
  \nMD3 中的颜色插槽分为 Primary（主）、Secondary（次）、Tertiary（三级）、Error（错误）、Background（背景）和 Surface（表面）。这些插槽进一步分为对，由一个基础颜色和一个“在其之上（on）”的基础颜色组成。这通常对应于\
  \ Material 组件的背景颜色和前景颜色。\n\n不同组件之间使用的特定颜色组会有不同。例如，Material Button 组件将使用 `colorPrimary`\
  \ 基础颜色作为背景颜色，并使用 `colorOnPrimary` 作为其内容（即它显示的文本或图标）。相反，`FloatingActionButton` 组件使用\
  \ `colorPrimaryContainer` 作为背景颜色，使用 `colorOnPrimaryContainer` 作为前景。通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果，来快速识别特定组件类型的正确颜色组。\n\
  \nMD2 和 MD3 之间最大的区别是对动态颜色和 Material You 的支持，这两者将在标题为 “从 Material Design 2 迁移到 Material\
  \ Design 3` 的章节中介绍。注意，动态颜色只有当用户在 Android 设置应用的“壁纸和样式”部分在设备上启用时才会生效。\n\n## 85.5 构建自定义主题\n\
  \n正如我们目前所见，实现主题的编码工作相对简单。然而，困难的部分通常是选择一组互补色来组成主题。幸运的是，Google 开发了一个工具，可以轻松地为你的应用设计自定义颜色主题。该工具称为\
  \ Material Theme Builder，地址如下：\n\n[`material-foundation.github.io/material-theme-builder`](https://material-foundation.github.io/material-theme-builder)\n\
  \n在构建工具内部，选择一个示例壁纸选项（在 图 85-2 中被标记为 A），然后点击 Custom（自定义）选项卡 (B)。或者，使用标记为 C 的按钮上传你自己的壁纸：\n\
  \n![](img/compose_theme_builder_home.jpg)\n\n图 85-2\n\n在自定义屏幕上（图 85-3），通过点击颜色矩形以显示颜色选择对话框，为主色颜色键\
  \ (A) 进行颜色选择。一旦选择了颜色，主题面板 (B) 将更改，以反映所有 MD3 颜色插槽的推荐颜色。Secondary、Tertiary 和 Neutral\
  \ 插槽生成的颜色可以通过点击颜色选项 (C) 并从颜色选择面板中选择不同的颜色来覆盖：\n\n![](img/compose_theme_builder_custom.jpg)\n\
  \n图 85-3\n\nAndroid View (XML) 选项。一旦下载，可以使用 `colors.xml` 和 `themes.xml` 文件替换现有文件。\n\
  \n## 85.6 总结\n\nMaterial Design 提供了定义 Android 应用外观的指南和组件。通过设计指定颜色、字体和形状的主题，可以将个人品牌应用于应用中。Google\
  \ 正在引入 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能。为了设计自己的主题，Google\
  \ 还提供了 Material Theme Builder，简化了选择互补色的任务。一旦使用该工具设计了主题，导出的文件就可以用于 Android Studio\
  \ 项目。\n\n## 86 从 Material Design 2 迁移到 Material Design 3\n\n本章将演示如何将 Android Studio\
  \ 项目从 Material Design 2 迁移到 Material Design 3，并集成使用 Builder 生成的自定义主题。教程还将演示如何为应用添加并测试动态颜色。\n\
  \n## 86.1 创建 ThemeMigration 项目\n\n在欢迎界面选择 New Project（新建项目）选项，在新项目对话框中选择 Empty Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `ThemeMigration` 并指定 `com.ebookrenzy.thememigration`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API 级别改为 API 26: Android 8.0 (O)，并将 Language 设置为\
  \ Java。\n\n## 86.2 设计用户界面\n\n主活动由一个简单的布局组成，包含一些用户界面组件，让我们能够看到切换到 Material Design\
  \ 3 以及本章后续执行的主题化的效果。有关 MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个 Text view。在布局编辑器中打开此文件，删除 Text view，禁用\
  \ Autoconnect（自动连接）模式（在 图 86-1 中被标记为 A），并点击按钮清除布局中的所有约束 (B)。\n\n![](img/as_theme_demo_disable_autoconnect.jpg)\n\
  \n图 86-1\n\n从色板的 Buttons 部分，将 Chip、CheckBox、Switch 和 Button 视图拖到布局画布上。接下来，将 `FloatingActionButton`\
  \ 拖到布局画布上，使其位于 Button 组件下方。当提示选择显示在 `FloatingActionButton` 上的图标时，从资源工具窗口选择 `ic_lock_power_off`\
  \ 图标，如图 86-2](#Material_Design_Migration.xhtml__idTextAnchor1627) 所示：\n\n\n\n\n\n\
  ![](img/as_theme_demo_select_icon.jpg)\n图 86-2\n\n将 `Chip` 控件的文本属性更改为“This is my\
  \ chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，使布局类似于图 86-3 左侧所示的内容：\n\
  \n![](img/as_theme_demo_layout.jpg)\n图 86-3\n\n要设置图中蓝图视图（blueprint view）中所示约束，选择所有组件，右键点击\
  \ `Chip` 视图，并在弹出的菜单中选择 `Chains -> Create Vertical Chain`。重复此步骤，这次选择 `Center -> Horizontally\
  \ in Parent` 菜单选项。\n\n在设备或模拟器上编译并运行应用，并验证用户界面是否与上方的图 86-3 所示。该布局使用了 Material Design\
  \ 2 组件。下一步是将主题迁移到 Material Design 3。\n\n## 86.3 迁移到 Material Design 3\n\n要切换到 Material\
  \ Design 3 组件，我们只需要需要编辑位于 `app -> res -> values -> themes` 下的两个 `themes.xml` 文件。第一个\
  \ `themes.xml` 中 `style` 元素的 `name` 属性需要更改如下：\n\n```xml\n<resources xmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <!-- Base application theme. -->\n    <style\
  \ name=\"Theme.ThemeMigration\" parent=\"Theme.Material3.Light\">\n```\n\n同样，对 `themes.xml\
  \ (night)` 文件进行以下更改，以将深模式迁移到 MD3：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- Base application theme. -->\n    <style name=\"Theme.ThemeMigration\"\
  \ parent=\"Theme.Material3.Dark\">\n```\n\n进行更改后，再次运行应用，并注意下方图 86-4 所示的 MD2 和 MD3\
  \ 之间的外观差异：\n\n![](img/as_theme_demo_md2_vs_md3.jpg)\n图 86-4\n\n现在我们已经将项目迁移到 MD3，下一步是创建一个自定义主题并将其应用到项目中。\n\
  \n## 86.4 构建新主题\n\n如果您完成了上一个章节（“Material Design 3 主题化和动态颜色教程”），则可以使用该章节中创建的自定义主题。如果您还没有自定义主题，请打开浏览器窗口并导航到以下\
  \ URL 以访问构建器工具：\n\n[https://material-foundation.github.io/material-theme-builder/]\n\
  \n一旦加载了构建器，选择一张壁纸，然后点击屏幕顶部的 `Custom` 按钮，然后点击 `Core Colors` 部分中的 `Primary` 颜色圆显示颜色选择器。从颜色选择器中，选择任何颜色作为主题的主色：\n\
  \n![](img/compose_theme_builder_color_chooser.jpg)\n图 86-5\n\n在 `Your Theme` 面板中检查颜色方案，并使用\
  \ `Core` 颜色设置进行任何必要的调整，直到您对颜色槽满意为止。主题准备好后，点击右上角的 `Export` 按钮并选择 `Android Views (XML)`\
  \ 选项。在提示时，将文件保存到计算机文件系统中的合适位置。主题将保存为名为 `material-theme.zip` 的压缩文件。\n\n使用适用于您的操作系统的工具解压主题文件，该文件应包含一个名为\
  \ `material-theme` 文件夹中的以下文件夹和文件：\n\n* `values/colors.xml` - 颜色定义。\n* `values/themes.xml`\
  \ - 亮模式主题。\n* `values-night/themes.xml` - 深色模式主题。\n\n现在主题文件已经生成，需要将它们集成到 Android\
  \ Studio 项目中。\n\n## 86.5 将主题添加到项目\n\n在将新主题添加到项目之前，我们需要移除旧的 MD2 主题文件。如果 `Project`\
  \ 工具窗口处于 `Project Files` 模式，这样做会更容易。要切换模式，使用如下所示的 `Project` 工具窗口顶部的菜单并选择 `Project\
  \ Files` 选项：\n\n![](img/as_theme_demo_project_files_menu_option.jpg)\n图 86-6\n\n\
  在选中 `Project Files` 模式的情况下，导航到 `app -> src -> main -> res -> values` 文件夹，选择并删除 `colors.xml`\
  \ 和 `themes.xml` 文件。还要删除位于 `values-night` 文件夹中的 `themes.xml` 文件。\n\n打开您操作系统的文件导航工具，找到新材料主题\
  \ `values` 文件夹中的 `colors.xml` 和 `themes.xml` 文件，并将它们粘贴到 `Project` 工具窗口内的 `values`\
  \ 文件夹中。重复此步骤复制位于 `values-night` 文件夹中的 `themes.xml` 文件，这次粘贴到 `values-night` 文件夹中。\n\
  \n将 `Project` 工具窗口切换回 `Android` 模式，此时值资源文件部分应匹配图 86-7：\n\n![](img/as_new_theme_files_added.jpg)\n\
  图 86-7\n\n接下来，修改亮色 `themes.xml` 文件以匹配当前：\n\n```xml\n<resources>\n    <style name=\"\
  Theme.ThemeMigration\" parent=\"Theme.Material3.Light\">\n        <item name=\"\
  colorPrimary\">@color/md_theme_primary</item>\n        <item name=\"colorOnPrimary\"\
  >@color/md_theme_on_primary</item>\n    </style>\n</resources>\n```\n\n对 `themes.xml\
  \ (night)` 文件重复这些步骤。返回 `activity.xml` 文件再次运行应用以确认用户界面现在使用的是自定义主题。\n\n## 86.6 启用颜色支持\n\
  \n为了测试动态颜色，应用需要在运行 Android 12 或更高版本的设备上具有正确的设置。在设备或模拟器上启动 `Settings` 应用并选择 `Wallpaper\
  \ & style`。在壁纸设置上点击更改壁纸（图 86-8 中的 A），并选择一张与主题颜色显著不同的壁图像。一旦选择，将壁纸设置为主屏幕。\n\n返回 `Wallpaper\
  \ & style` 屏幕，在尝试不同的颜色方案之前，确保已选择 `Wallpaper colors` 选项（B）。点击每个选项时，壁纸示例将反映选择（C）：\n\
  \n![](img/compose_theme_wallpaper_and_styles.jpg)\n\n要启用动态颜色，我们需要调用 `DynamicColors`\
  \ 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用启用动态颜色支持，需要在自定义 `Application` 实例的\
  \ `onCreate()` 方法中调用它。通过在项目 `app -> java -> com -> ebookfrenzy -> thememigration`\
  \ 下添加新的 Java 文件 `ThemeMigrationApplication.java` 并对其进行修改，如下：\n\n```java\npackage\
  \ com.ebookfrenzy.thememigration;\n\nimport android.app.Application;\nimport com.google.android.material.color.DynamicColors;\n\
  \npublic class ThemeMigrationApplication extends Application {\n    @Override\n\
  \    public void onCreate() {\n        super.onCreate();\n        DynamicColors.applyToActivitiesIfAvailable(this);\n\
  \    }\n}\n```\n\n创建自定义 `Application` 类后，我们现在需要配置项目使用该类而不是默认的 `Application` 实例。为此，编辑\
  \ `AndroidManifest.xml` 文件并添加引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.thememigration\">\n    <application\n        android:name=\"\
  .ThemeMigrationApplication\"\n        android:allowBackup=\"true\">\n    </application>\n\
  </manifest>\n```\n\n\n\n\n构建并运行应用，并注意布局现在正在使用与壁纸颜色匹配的主题。将 `ThemeMigration` 应用置于后台，返回到\
  \ `Wallpaper & styles` 设置屏幕并选择不同的壁纸。再次将 `ThemeMigration` 应用带到前台，此时它将已经动态适应以匹配新的壁纸。\n\
  \n## 86.7 总结\n\n在本章中，我们演示了如何将 Android Studio 项目从 Material Design 2 迁移到 Material\
  \ Design 3。该项目还利用了 `Material Theme Builder` 设计了自定义主题，并解释了将生成的主文件集成到旧项目中的步骤。\n\n\
  # 87. Android Studio 中 Gradle 概述\n\n直到为止，人们在很大程度上认为理所当然，即 Android Studio 会采取必要的步骤来编译和运行创建的应用程序项目。Android\
  \ Studio 一直通过一个名为 `Gradle` 的系统在后台实现这一点。\n\n现在是时候查看如何使用 `Gradle` 来编译和打包应用程序项目中的各种元素，并开始探索当在\
  \ Android Studio 中构建项目有更高级的需求时，如何配置该系统。\n\n## 87.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义如何构建项目、为了成功构建项目需要满足哪些依赖项，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令行的环境，可以通过插件的使用将其集成到其他环境中。在 Android\
  \ Studio 的情况下，`Gradle` 集成是通过命名恰当的 `Android Studio Plugin` 提供的。\n\n尽管 Android Studio\
  \ 插件允许从 Android Studio 内部启动和管理 `Gradle` 任务，但仍然可以使用 `Gradle` 命令行包装器构建基于 Android Studio\
  \ 的项目，包括在未安装 Android Studio 的系统上。\n\n构建项目的配置规则声明在基于 `Groovy` 编程语言的 `Gradle` 构建文件和脚本中。\n\
  \n## 87.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android 应用程序项目带来了许多强大的功能。一些关键功能如下：\n\
  \n### 87.2.1 智能的默认值\n\n`Gradle` 实现了一种被称为“约定优于配置”（`convention over configuration`）的概念。这意味着\
  \ `Gradle` 拥有一套预定义的、合理的默认配置设置，除非它们被构建文件中的设置覆盖，否则它们将被使用。这意味着可以使用开发者所需的最少配置来执行构建。只有当默认配置不能满足您的构建需求时，才需要更改构建文件。\n\
  \n### 87.2.2 依赖\n\n`Gradle` 功能的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的一个模块，它触发一个 `intent`\
  \ 来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖关系，因为如果在运行时无法找到并启动第二个模块，应用程序将无法构建。这种依赖关系可以在第一个模块的\
  \ `Gradle` 构建文件中进行声明，以便将第二个模块包含在应用程序构建中，或者在无法找到或构建第二个模块时标记错误。依赖项的其他示例是项目编译和运行所依赖的库和\
  \ `JAR` 文件。\n\n`Gradle` 依赖项可以分为本地或远程。本地依赖引用存在执行构建的计算机系统本地文件系统上的项。远程依赖引用存在远程服务器（通常称为\
  \ `repository`，仓库）上的项。\n\nAndroid Studio 项目的远程依赖使用另一个名为 `Maven` 的项目管理工具进行处理。如果在\
  \ `Gradle` 构建文件中使用 `Maven` 语法声明了远程依赖，则该依赖将自动从指定的仓库下载并包含在构建过程中。例如，下面的依赖声明会导致从 Google\
  \ 仓库将 `AppCompat` 库添加到项目中：\n\n```\nimplementation 'androidx.appcompat:appcompat:1.5.1'\n\
  ```\n\n### 87.2.3 构建变体\n\n除了依赖项外，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行在许多不同的设备上，涵盖了各种处理器和屏幕尺寸。为了针对尽可能广泛的设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个适用于手机的用户界面，另一个适用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可以实现的。\n\n### 87.2.4 Manifest 条目\n\n每个 Android Studio\
  \ 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含有关应用程序的配置细节。在 `Gradle` 构建文件中可以指定许多清单条目，这些条目会在项目构建时自动生成到清单文件中。此功能与构建变体功能互补，允许为每个构建变体配置不同的应用程序版本号、应用程序\
  \ ID 和 SDK 版本信息。\n\n### 87.2.5 APK 签名\n\n标题为[创建、测试和上传 Android App Bundle]的章节涵盖了使用\
  \ Android Studio 环境创建带签名的发布版 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在 `Gradle`\
  \ 构建文件中，以便从命令行生成签名的 APK 文件。\n\n### 87.2.6 ProGuard 支持\n\n`ProGuard` 是 Android Studio\
  \ 自带的一个工具，它可以优化、压缩和混淆 `Java` 字节码，使其更高效且更难进行逆向工程（通过分析编译的 `Java` 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件提供了控制在构建应用程序时是否运行 `ProGuard` 的能力。\n\n## 87.3 属性和设置 Gradle 构建文件\n\n`gradle`\
  \ 配置由一组配置、属性和设置文件组成。例如，`gradle.properties` 文件包含了与 Java 虚拟机 (`JVM`) 使用的命令行标志、项目是否使用\
  \ `AndroidX` 库以及 `Kotlin` 代码风格支持设置。作为典型用户，你可能不需要更改此文件中的任何设置。\n\n相反，`settings.gradle`\
  \ 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，搜索哪些在线仓库，以及项目名称。典型的 `settings.gradle` 文件如下：\n\
  \n```gradle\npluginManagement {\n    repositories {\n        gradlePluginPortal()\n\
  \        google()\n        mavenCentral()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories\
  \ {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name = \"\
  AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n## 87.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含构建 Android 应用程序所需的所有内容，由模块、库、清单文件和\
  \ Gradle 构建文件组成。\n\n\n\n\n每个项目都包含一个顶层 Gradle 构建文件。该文件列为 `build.gradle`（项目: <项目名称>），并可以在项目工具窗口中找到，如图\
  \ 87-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\n图 87-1\n\n默认情况下，顶层 Gradle\
  \ 构建文件的内容如下：\n\n```gradle\n// 顶层构建文件，你可以在此处添加适用于所有子项目/模块的配置选项。\nplugins {\n    id\
  \ 'com.android.application' version '7.3.0' apply false\n    id 'com.android.library'\
  \ version '7.3.0' apply false\n}\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n\
  }\n```\n\n目前，该文件的作用仅仅是声明使用 `jcenter` 仓库获取远程库，并声明构建依赖于 Android Gradle 插件。在大多数情况下，没有必要对此构建文件进行任何更改。\n\
  \n## 87.5 模块级 Gradle 构建文件\n\n一个 Android Studio 应用程序项目由一个或多个模块组成。例如，有一个名为 `GradleDemo`\
  \ 的假设应用程序项目，它包含两个命名为 `Module1` 和 `Module2` 的模块。在这种情况下，每个模块都需要它们自己的 Gradle 构建文件。在项目结构中，这些文件位于如下：\n\
  \n* `Module1/build.gradle`\n* `Module2/build.gradle`\n\n默认情况下，`Module1/build.gradle`\
  \ 文件将类似于以下列表所示：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\nandroid\
  \ {\n    buildFeatures {\n        viewBinding true\n    }\n    namespace 'com.ebookfrenzy.fragmentexample'\n\
  \    compileSdk 33\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.fragmentexample\"\
  \n        minSdk 26\n        targetSdk 33\n        versionCode 1\n        versionName\
  \ \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n    compileOptions {\n        sourceCompatibility\
  \ JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n\
  \    }\n}\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.5.1'\n\
  \    implementation 'com.google.android.material:material:1.6.1'\n    implementation\
  \ 'androidx.constraintlayout:constraintlayout:2.1.4'\n    testImplementation 'junit:junit:4.13.2'\n\
  \    androidTestImplementation 'androidx.test.ext:junit:1.1.3'\n    androidTestImplementation\
  \ 'androidx.test.espresso:espresso-core:3.4.0'\n}\n```\n\n从文件内容显而易见，构建文件开头声明了使用\
  \ Gradle Android 应用程序插件：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  ```\n\n文件的 `android` 部分随后阐明了在构建 `Module1` 时使用的 SDK 版本。\n\n```gradle\nandroid {\n\
  \    compileSdk 33\n```\n\n`defaultConfig` 部分中声明的项定义了在构建期间生成到模块 `AndroidManifest.xml`\
  \ 文件中的元素。这些设置可以在构建文件中修改，它们取自模块首次创建时在 Android Studio 中输入的的设置：\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId \"com.ebookfrenzy.fragmentexample\"\n    minSdk 26\n    targetSdk\
  \ 33\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 部分包含了关于在构建应用程序发布版本时，是否以及如何对\
  \ APK 文件上运行 ProGuard 的指令：\n\n```gradle\nbuildTypes {\n    release {\n        minifyEnabled\
  \ false\n        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n    }\n}\n```\n\n按照当前的配置，在构建 `Module1` 时不会运行 ProGuard。要启用\
  \ ProGuard，需要将 `minifyEnabled` 条目从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在项目的模块目录中找到。对此文件进行的更改将覆盖位于\
  \ Android 安装目录 `tools/proguard` 下的 `proguard-android.txt` 中的默认设置。\n\n由于此文件中没有声明\
  \ `buildType`，将使用默认值（不带 ProGuard 的构建、使用调试密钥签名并带有调试符号）。\n\n模块构建文件中还可能包含一个标题为 `productFlavors`\
  \ 的额外部分，以启用创建构建变体（build variants）。\n\n接下来，包含了指令用以指定构建项目时使用的 Java 编译器版本：\n\n```gradle\n\
  compileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n    targetCompatibility\
  \ JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies` 部分列出了模块所依赖的任何本地和远程依赖。上述示例中的依赖行指定了需要从仓库包含的\
  \ Android 库：\n\n```gradle\nimplementation 'androidx.appcompat:appcompat:1.5.1'\n\
  ```\n\n注意，依赖声明包含了版本号，以指示使用哪个版本。\n\n## 87.6 在构建文件中配置签名\n\n上传 Android Bundle 章节涵盖了设置密钥和生成签名\
  \ APK 的步骤。这些设置也可以在构建文件的 `signingConfigs` 部分定义。例如：\n\n```gradle\ndefaultConfig {\n\
  }\nsigningConfigs {\n    release {\n        storeFile(\"keystore.release\")\n  \
  \      storePassword \"your keystore password\"\n        keyAlias \"your key alias\"\
  \n        keyPassword \"your key password\"\n    }\n}\nbuildTypes {\n}\n```\n\n\
  上面的示例将密码直接嵌入到构建文件中。这种方法的替代方案是从系统环境变量中提取这些值：\n\n```gradle\nsigningConfigs {\n   \
  \ release {\n        storeFile(\"keystore.release\")\n        storePassword System.getenv(\"\
  KEYSTOREPASSWD\")\n        keyAlias \"your key alias\"\n        keyPassword System.getenv(\"\
  KEYPASSWD\")\n    }\n}\n```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入：\n\n```gradle\n\
  signingConfigs {\n    release {\n        storeFile(\"keystore.release\")\n     \
  \   storePassword System.console().readLine(\"\\nEnter Keystore password: \")\n\
  \        keyAlias \"your key alias\"\n        keyPassword System.console().readLine(\"\
  \\nEnter Key password: \")\n    }\n}\n```\n\n## 87.7 从命令行运行 Gradle 任务\n\n每个 Android\
  \ Studio 项目都包含一个 Gradle 封装，用于从命令行调用 Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然此封装在 Windows 系统上是可以执行的，但在\
  \ Linux 和 macOS 上可能需要启用执行权限。要启用执行权限，打开终端窗口，进入到需要该封装的项目文件夹并执行以下命令：\n\n```bash\nchmod\
  \ +x gradlew\n```\n\n一旦文件具有执行权限，则需要将文件路径添加到 `$PATH` 环境变量中，或者在运行时在名称名前加上 `./`。例如：\n\
  \n```bash\n./gradlew tasks\n```\n\nGradle 通过不同的任务来看待项目构建。可以通过在项目目录下运行以下命令获取当前项目可用任务的完整列表（如果在\
  \ macOS 或 Linux 上运行，请记住在命令前加上 ./）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的调试版本，请使用\
  \ `assembleDebug` ：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\n\
  \n\n\n\n```\ngradlew assembleRelease\n```\n\n## 87.8 总结\n\n在大多数情况下，Android Studio\
  \ 会在后台执行应用构建，无需开发人员干预。此构建过程是使用 `Gradle` 系统处理的，它是一个自动化构建工具包，旨在允许通过一组构建配置文件来配置和管理项目的构建方式。虽然\
  \ `Gradle` 的默认行为对于满足许多基础项目构建的需求，但对于更复杂的项目，配置构建过程的需求是不可避免的。本章概述了在 Android Studio\
  \ 项目背景下的 `Gradle` 构建系统和配置文件。\n\n## 索引\n\n### 符号\n- `<fragment>` 239\n- `<fragment>`\
