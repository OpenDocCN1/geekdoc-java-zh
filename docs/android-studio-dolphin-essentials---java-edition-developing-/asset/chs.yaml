  ## 87.8 总结\n\n# 1. 引言\n\n本书已针对 Android Studio Dolphin 进行完全更新，旨在教你如何使用 Java 编程语言开发\
  \ Android 应用。\n\n本书从基础知识开始，概述了设置 Android 开发和测试环境所需的步骤。书中包含了 Android Studio 的概述，涵盖了工具窗口、代码编辑器和布局编辑器工具等领域。在介绍\
  \ Android 架构之后，将深入探讨如何使用 Android Studio 环境设计 Android 应用和用户界面。\n\n章节还涵盖了 Android\
  \ 架构组件，包括视图（ViewModel）、生命周期管理、Room 数据库访问、数据库检查器（Database Inspector）、应用导航、可存数据（LiveData）和数据绑定（Data\
  \ Binding）。\n\n书中同样涵盖了 Intent 等高级主题，以及触摸屏处理、手势识别以及音频的录制和播放。本版还涵盖了打印、过渡动画以及折叠设备支持。\n\
  \n书中还详细介绍了 Material Design 的概念，包括悬浮操作按钮、Snackbars、标签页界面、卡片视图（Card Views）、导航抽屉和折叠工具栏。\n\
  \n此外，还详细介绍了 Android Studio Dolphin 和 Android 的其他关键特性，包括应用链接（App Links）、动态交付（Dynamic\
  \ Delivery）、Gradle 构建配置、内应用购买以及向 Google Play 开发者控制台提交应用。\n\n\n\n\n\n假设你已经具备一些 Java\
  \ 编程经验，准备下载 Android Studio 和 Android SDK，拥有 Windows、Mac 或 Linux 系统，并且对要开发的应用有了一些想法，那么你就可以开始了。\n\
  \n## 1.1 下载代码示例\n\n本书中包含的示例源代码和 Android Studio 项目文件可以在以下地址下载：\n\nhttps://www.ebookfrenzy.com/retail/dolphinjava/index.php\n\
  \n从代码示例将项目加载到 Android Studio 的步骤如下：\n\n1. 在 `Welcome to Android Studio` 对话框中，点击\
  \ `Open` 按钮。\n2. 在项目选择对话框中，导航并选择包含要导入的项目的文件夹，然后点击 `OK`。\n\n## 1.2 反馈\n\n我们希望你对购买此本书感到满意。如果你在书中发现任何错误，或者有任何意见、问题或疑虑，请通过\
  \ `feedback@ebookfrenzy.com` 与我们联系。\n\n## 1.3 勘误表\n\n尽管我们尽力确保本书内容的准确性，但对于一本涵盖如此规模和复杂领域的书籍，包含一些错误和遗漏是不可避免的。书中所有已知问题及其解决方案将在以下\
  \ URL 列出：\n\nhttps://www.ebookfrenzy.com/errata/dolphinjava.html\n\n如果你发现了勘误表中未列出的错误，请通过邮件向我们的技术支持团队\
  \ `feedback@ebookfrenzy.com` 反馈。他们将为你提供帮助并努力解决你可能遇到的任何问题。\n\n# 2. 设置 Android Studio\
  \ 开发环境\n\n在开始开发 Android 应用之前，第一步是配置计算机系统作为开发平台。这涉及几个步骤，包括安装 Android Studio 集成开发环境\
  \ (IDE)，其中包含 Android 软件开发包 (SDK) 和 OpenJDK Java 开发环境。本章将介绍在 Windows、macOS 和基于 Linux\
  \ 的系统上安装 Android 应用开发所需所需的步骤。\n\n## 2.1 系统要求\n\nAndroid 应用开发可以在任何类型的系统上进行：\n\n-\
  \ Windows 8/10/11 64 位\n- 运行 Intel 或 Apple 芯片的 macOS 10.14 或更高版本\n- 配置 Intel i5\
  \ 或更高处理器的 Chrome OS 设备\n- 版本为 2.31 或更高的 GNU C Library (`glibc`) 的 Linux 系统\n- 至少\
  \ 8GB 内存（见下文）\n- 大约 8GB 可用磁盘空间\n- 最低屏幕分辨率 1280 x 800\n\n尽管 Android Studio 可以在 8GB\
  \ 内存的电脑上运行，但在内存更大的系统上性能将得到极大提升。如果你计划使用 Android 虚拟设备模拟器 (`AVD`) 测试应用，这个问题尤为突出。\n\n\
  ## 2.2 下载 Android Studio 包\n\n开发 Android 应用的大部分工作将在 Android Studio 环境中完成。本书的内容和示例是基于\
  \ Android Studio Dolphin 2021.3.1 创建的，使用了 Android API 33 SDK (Tiramisu)，在编写时这些是最新版本。\n\
  \n然而，Android Studio 频繁更新，因此自本书出版以来可能已经发布了更新版本。\n\n可以在主下载页面下载最新版本的 Android Studio，该页面\
  \ URL 为：\n\nhttps://developer.android.com/studio/index.html\n\n如果该页面提供了下载新版本 Android\
  \ Studio 的说明，请注意本书与软件之间可能存在某些细微差异。如果这些差异成为问题，在网络上搜索“Android Studio Dolphin”应该会提供下载旧版本的选项。或者，访问以下网页在存档中找到\
  \ Android Studio Dolphin 2021.3.1：\n\nhttps://developer.android.com/studio/archive\n\
  \n## 2. 安装 Android Studio\n\n下载完成后，安装 Android Studio 的具体步骤取决于执行安装的操作系统。\n\n### 2.3.1\
  \ 在 Windows 上安装\n\n在 Windows 资源管理器窗口中找到下载的 Android Studio 安装可执行文件（名为 `android-studio-<version>-windows.exe`），并双击它开始安装过程。如果弹出用户账户控制对话框，请点击\
  \ `Yes` 按钮。\n\n一旦出现 Android Studio 安装向导，按照各个屏幕操作配置安装，以满足你的需求，包括 Android Studio 应该安装的文件系统位置，以及是否应供系统的其他用户使用。在提示选择要安装的组件时，确保勾选了\
  \ `Android Studio` 和 `Android Virtual Device` 选项。\n\n虽然对 Android Studio 安装在系统中的位置没有严格规定，但本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio`，并且 Android SDK 包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置选项后，点击 `Install` 按钮开始安装过程。\n\n在带有开始菜单的 Windows 版本上，可以从安装期间添加到该菜单的项目启动新安装的\
  \ Android Studio。可以通过导航到 `Android Studio\\bin` 目录，右键点击 `studio64` 并选择 `固定到任务栏` 选项来将其固定，以便方便访问。\n\
  \n### 2.3.2 在 macOS 上安装\n\nmacOS 版 Android Studio 以磁盘镜像 (`.dmg`) 文件的形式下载。下载 `android-studio-<version>-mac.dmg`\
  \ 文件后，在 Finder 窗口中找到它并双击打开。\n\n要安装该包，只需将 Android Studio 图标拖到 `Applications` 文件夹。Android\
  \ Studio 包将安装到系统的 `Applications` 文件夹，此过程通常需要几秒钟。\n\n要启动 Android Studio，在 `Applications`\
  \ 文件夹中找到可执行文件并双击。为了以后方便访问工具，请从 Finder 窗口将 Android Studio 图标拖到 Dock。\n\n### 2.3.3\
  \ 在 Linux 上安装\n\n下载 Linux Android Studio 包后，打开终端窗口，切换到要安装 Android Studio 的目录并执行以下命令：\n\
  \n```bash\nunzip /<path to package>/android-studio-ide-<version>-linux.zip\n```\n\
  \n注意，Android Studio 包将安装到名为 `android-studio` 的子目录。假设上述命令是在 `/home/demo` 执行的，软件包将解压到\
  \ `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端窗口，切换到 `android-studio/bin`\
  \ 子目录并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux 系统上运行时，可能需要安装一些 32 位支持库才能运行\
  \ Android Studio。在 Ubuntu 上可以使用以下命令安装这些库：\n\n```bash\nsudo apt-get install libc6:i386\
  \ libncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386\n```\n\n在基于 Red Hat 和\
  \ Fedora 的 64 位系统，使用以下命令：\n\n```bash\nsudo yum install zlib.i686 ncurses-libs.i386\
  \ bzip2-libs.i386\n```\n\n\n\n\n\n## 2.4 Android Studio 安装向导\n\n如果你是首次安装 Android\
  \ Studio，当安装过程开始后出现的初始对话框可能如下图 2-2 所示：\n\n![](img/as_no_sdk_found.jpg)\n图 2-2\n\n\
  如果出现此对话框，点击 `Next` 按钮显示 SDK 组件设置对话框（图 2-3）。在此对话框中，在点击 `Next` 按钮之前，请确保已选择 `Android\
  \ SDK` 选项以及最新的 API 程序包：\n\n![](img/as_install_sdk.jpg)\n图 2-3\n\n点击 `Next` 后，Android\
  \ Studio 将下载并安装 `Android SDK` 和工具。\n\n如果你之前安装过较旧版本的 Android Studio，在首次启动此新版本时，可能会弹出一个对话框，提供从之前的\
  \ Android Studio 版本导入设置的选项。如果你有以前版本的设置并希望将其导入到最新安装中，请选择相应的选项和位置。或者，指示你不需要导入任何之前的设置并点击\
  \ `OK` 按钮继续。\n\n在完成这些初始设置步骤后，点击 `Finish` 按钮显示 Android Studio 欢迎界面：\n\n![](img/as_welcome_screen.jpg)\n\
  图 2-4\n\n## 2.5 安装额外的 Android SDK 程序包\n\n到目前为止的操作已经安装了 Android Studio IDE 和当前一组默认的\
  \ `Android SDK` 程序包。在继续之前，值得花些时间验证安装了哪些程序包，并安装任何缺失或更新的程序包。\n\n此任务可以通过点击欢迎对话框中的 `More\
  \ Actions` 链接并在下拉菜单中选择 `SDK Manager` 选项来完成。一旦调用，将出现 `Preferences` 对话框中的 `Android\
  \ SDK` 界面，如图 2-5 所示：\n\n![](img/as_sdk_manager.jpg)\n图 2-5\n\n在首次安装 Android Studio\
  \ 之后，可能只安装了最新发布的 `Android SDK` 版本。要安装旧版本的 `Android SDK`，只需选择对应版本的复选框并点击 `Apply`\
  \ 按钮即可。本书的其余部分假设已安装了 `Android Tiramisu (API Level 33) SDK`。\n\n本书中的大多数示例将支持一直到 Android\
  \ 8.0 (Oreo) 的旧版本 Android。这是为了确保应用程序可以在各种 Android 设备上运行。在 SDK 版本列表中，勾选 `Android\
  \ 8.0 (Oreo)` 旁边的复选框并点击 `Apply` 按钮。在生成的确认对话框中，点击 `OK` 按钮安装 `SDK`。后续对话框将在执行安装前寻求对许可和条款的接受。安装完成后点击\
  \ `Finish`。\n\n可能还会列出最新 `SDK` 有可用更新。要访问有关准备更新的程序包的详细信息，请启用屏幕右下角的 `Show Package Details`\
  \ 选项。这将显示与图 2-6 所示相似的信息：\n\n![](img/Image2471.jpg)\n图 2-6\n\n上面的图片强调了更新的可用性。要安装更新，勾选项目名称左侧的复选框并点击\
  \ `Apply` 按钮。\n\n除了 `Android SDK` 程序包外，还安装了几个用于构建 Android 应用程序工具。查看当前安装的程序包并检查更新，请留在\
  \ `SDK` 设置界面并选择如图 2-7 所示的 `SDK Tools` 标签：\n\n![](img/as_sdk_tools.jpg)\n图 2-7\n\n\
  在 `Android SDK Tools` 界面中，请确保以下程序包在 `Status` 列中显示为 `Installed`：\n\n*   `Android\
  \ SDK Build-tools`\n*   `Android Emulator`\n*   `Android SDK Platform-tools`\n*\
  \   `Google Play Services`\n*   `Intel x86 Emulator Accelerator (HAXM installer)`\n\
  *   `Google USB Driver (Windows only)`\n*   `Layout Inspector image server for API\
  \ 31 and T`\n\n注意 `Intel x86 Emulator Accelerator (HAXM installer)` 无法在基于 Apple\
  \ silicon 的 Mac 上安装。\n\n如果上述任何程序包列为 `Not Installed` 或需要更新，只需选择这些程序包旁的复选框并点击 `Apply`\
  \ 按钮启动安装过程。如果出现 `HAXM` 模拟器设置对话框，请选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n图 2-8\n\
  \n安装完成后，检查程序包列表并确保所选程序包现在在 `Status` 列中被列为 `Installed`。如果任何一个被列为 `Not installed`，请确保它们已选中并再次点击\
  \ `Apply` 按钮。\n\n## 2.6 使 Android SDK 工具可在命令行中访问\n\n大多数情况下，`Android SDK` 的底层工具将在\
  \ Android Studio 环境内部访问。但尽管如此，在某些情况下，能够从命令提示符或终端窗口调用这些工具将非常有用。为了让你正在开发的操作系统能够找到这些工具，有必要将它们添加到系统的\
  \ `PATH` 环境变量中。\n\n无论使用何种操作系统，都需要配置 `PATH` 变量以包含以下路径（其中`<path_to_sdk_installation>`\
  \ 代表安装 Android SDK 的系统位置）：\n\n`<path_to_sdk_installation>/sdk/tools`\n\n`<path_to_sdk_installation>/tools/bin`\n\
  \n`<path_to_sdk_installation>/platform-tools`\n\n可以通过启动 `SDK Manager` 并参考图 2-9 所示面板顶部的\
  \ `Android SDK Location:` 字段来确定系统上的 SDK 位置：\n\n![](img/sdk_location.jpg)\n图 2-9\n\
  \n一旦确定了 SDK 的位置，将其添加到 `PATH` 变量的操作取决于操作系统：\n\n### 2.6.1 Windows 8.1\n\n1. 在开始屏幕，将鼠标移动到屏幕右下角并从生成的菜单选择\
  \ `Search`。在搜索框中输入 `Control Panel`。当 `Control Panel` 图标出现在结果区域时，点击它在桌面上启动。\n\n2.\
  \ 在 `Control Panel` 中，使用 `Category` 菜单将显示更改为 `Large Icons`。从列表中选择 `System`。\n\n\
  3. 在 `Environment Variables` 对话框中，在 `System variables` 列表中找到 `Path` 变量，选中并点击 `Edit…`\
  \ 按钮。使用编辑对话框中的 `New` 按钮向路径添加三个条目。例如，假设 Android SDK 安装在 `C:\\Users\\demo\\AppData\\\
  Local\\Android\\Sdk`，需要添加以下条目：\n\n`C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\\
  platform-tools`\n\n`C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\tools`\n\n`C:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk\\tools\\bin`\n\n4. 在每个对话框中点击 `OK` 并关闭系统属性控制面板。\n\
  \n通过键盘按下 `Windows + R`  `Run` 对话框中输入 `cmd` 打开命令提示符窗口。在命令提示符窗口中输入：\n\n`echo %Path%`\n\
  \n返回的路径变量值应包含 Android SDK 平台工具的路径。通过尝试运行 `adb` 工具来验证 `platform-tools` 值是否正确：\n\n\
  `adb`\n\n执行后工具应输出命令行选项列表。\n\n同样，通过尝试运行 `AVD Manager` 命令行工具来检查 `tools` 路径设置（不要担心\
  \ `avdmanager` 工具报告 Java 有问题 - 这稍后会解决）：\n\n`avdmanager`\n\n如果其中一个或两个命令出现类似下所示的消息，最可能是将错误的路径追加到了\
  \ `Path` 环境变量中：\n\n\n\n\n\n`adb` 不是内部或外部命令、可程序或批文件。\n\n### 2.6.2 Windows 10\n\n\
  右键点击“开始”菜单，从弹出的菜单中选择“设置”，并在“搜索”文本框中输入“编辑系统环境变量”。在“系统属性”对话框中，点击“环境变量...”按钮。按照 Windows\
  \ 8.1 概述的步骤，从第 3 步开始操作。\n\n### 2.6.3 Windows 11\n\n右键点击任务栏上的“开始”图标，从弹出的菜单中选择“设置”。当设置对话框出现时，向下滚动列表并选择“关于”选项。在“关于”屏幕中，从“相关链接”部分选择“高级系统设置”。当“系统属性”窗口出现时，点击“环境变量...”按钮。按照\
  \ Windows 8.1 概述的步骤，从第 3 步开始操作。\n\n### 2.6.4 Linux\n\n在 Linux 上，此配置通常通过向家目录下的 `.bashrc`\
  \ 文件添加命令来实现（具体细节取决于所使用的特定 Linux 发行版）。假设 Android SDK 软件包安装在 `/home/demo/Android/sdk`，则\
  \ `.bashrc` 文件中的 export 行内容如下：\n\n```bash\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/tools:/home/demo/Android/sdk/tools/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n请注意，上述命令将 `android-studio/bin` 目录添加到 `PATH` 变量中。这将允许在终端窗口的任何当前目录下均执行 `studio.sh`\
  \ 脚本。\n\n### 2.6.5 macOS\n\n在 macOS 上可以使用多种技术来修改 `$PATH` 环境变量。最干净的方法是在 `/etc/paths.d`\
  \ 目录下创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录下创建一个名为 `android-sdk` 的新文件并包含以下行来配置路径：\n\n```\n/Users/demo/Library/Android/sdk/tools\n\
  /Users/demo/Library/Android/sdk/tools/bin\n/Users/demo/Library/Android/sdk/platform-tools\n\
  ```\n\n注意，由于这是一个系统目录，在创建文件时需要使用 `sudo` 命令。例如：\n\n```bash\nsudo vi /etc/paths.d/android-sdk\n\
  ```\n\n## 2.7 Android Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的应用程序，由许多后台进程组成。尽管 Android\
  \ Studio 过去因性能不佳而受到过批评，但 Google 在最近的发布中已显著改进了性能，并在每个新版本中持续优化。这些改进包括允许用户配置 Android\
  \ Studio IDE 以及用于构建和运行应用程序的后台进程所使用的内存。这使得软件能够利用内存更大的系统。\n\n如果你在具有足够空闲内存以增加这些值值的系统上运行\
  \ Android Studio（此功能仅适用于具有 5GB 或更多内存的 64 位系统），并发现 Android Studio 的性能似乎有所下降，那么尝试调整这些内存设置可能是值得的。Android\
  \ Studio 还可能通过类似于底图所示的对话框通知你可以提高性能：\n\n![](img/as_3.5_increase_memory_notification.jpg)\n\
  图 2-10\n\n要查看并修改当前的内存配置，请选择 `File -> Settings...`（macOS 上为 `Android Studio -> Preferences...`）菜单选项，并在弹出的对话框中，选择左侧导航面板\
  \ `System Settings` 下列出的 `Memory Settings` 选项，如下图 2-11\n图 2-11\n\n## 2.8 更新 Android\
  \ Studio 和 SDK\n\nAndroid Studio 和 Android SDK 会定期发布新版本。新版本的 SDK 使用 Android SDK\
  \ Manager 安装。当有更新准备好安装时，Android Studio 通常会通知你。\n\n若要手动检查 Android Studio 更新，请使用 Android\
  \ Studio 主窗口的 `Help -> Check for Updates...` 菜单选项（macOS 上为 `Android Studio -> Check\
  \ for Updates...`）。\n\n## 2.9 总结\n\n在开始开发 Android 应用程序之前，第一步是搭建合适的开发环境。这由 Android\
  \ SDK 和 Android Studio IDE（包含 OpenJDK 开发环境）组成。在本章中，我们涵盖了在 Windows、macOS 和 Linux\
  \ 上安装这些包所需的步骤。\n\n# 3. 在 Android Studio 中创建 Android 示例\n\n本书的前几个章节已经涵盖了使用 Android\
  \ Studio IDE 配置适用于 Android 应用程序开发的环境所需的步骤。在进入稍高级级的话题之前，现在是验证所有所需的开发包均已安装并正常运行的好时机。实现这一目标的最佳方法是创建一个\
  \ Android 应用程序并编译、运行它。本章将介绍如何使用 Android Studio 创建 Android 应用程序项目。项目创建后，稍后的章节将探索如何使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n## 3.1 关于项目\n\n在本章创建的项目是一个原始的货币汇率转换器（事实上，它非常简单，仅将美元转换为欧元，并使用估算的汇率进行转换）。项目还将使用\
  \ Android Studio 最基础的项目模板之一。这种简单性允许我们介绍 Android 应用开发的关键方面，而不会因一次性引入过多概念（如推荐的应用架构和\
  \ Android 架构组件）让初学者无所从。在遵循本教程时，请放心，项目中使用的所有技术和代码将在后续章节中进行更详细介绍。\n\n## 3.2 创建新 Android\
  \ 项目\n\n开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，首先启动 Android Studio，出现“欢迎来到 Android\
  \ Studio”屏幕，如图 3-1\n图 3-1\n\n一旦此窗口出现，Android Studio 就好创建新项目。要创建新项目，只需点击 `New Project`\
  \ 选项显示向导的第一页。\n\n## 3.3 创建 Activity\n\n第一步是为应用程序定义初始 Activity 类型。可以选择为手机和平、Wear\
  \ OS、TV、Android Audio 或 Android Things 创建项目。开发 Android 应用程序可以使用多种 Activity 类型，其中许多将在后续章节中详细介绍。但对于本示例而言，只需在模板面板中选择\
  \ `Phone and Tablet` 选项，然后选择创建 `Empty Activity`。`Empty Activity` 选项会创建一个包含单个 `TextView`\
  \ 对象的模板用户界面。\n\n![](img/as_select_empty_activity.jpg)\n图 3-2\n\n选中 `Empty Activity`\
  \ 选项后，点击 `Next` 继续配置项目。\n\n## 3.4 定义项目和 SDK 设置\n\n\n\n\n\n在项目配置窗口 (图 3-3) 中，将 `Name`\
  \ 字段设置为 `AndroidSample`。应用程序名称是在 Android Studio 中引用和标识应用程序的名称，它也是当完成的应用程序在 Google\
  \ Play 商店销售时将要使用的名称。\n\n`Package name`（包名）用于在 Android 应用生态系统中唯一标识该应用程序。虽然它可以设置为任何唯一标识你应用程序的字符串，但传统上它是基于你域名的反转\
  \ URL 加上应用程序名称。例如，如果你的域名是 `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n```\ncom.mycompany.androidsample\n```\n\n如果你没有域名，可以在 `Company Domain` 字段中输入任何其他字符串，或者出于测试之目的使用\
  \ `example.com`，但在发布应用程序之前需要对其更改：\n\n```\ncom.example.androidsample\n```\n\n`Save\
  \ location`（保存位置）设置将默认指向位于你主目录下名为 `AndroidStudioProjects` 的文件夹，你可以通过点击包含当前路径设置的文本字段右侧的文件夹图标进行更改。\n\
  \n将 `minimum SDK` 设置为 `API 26`：Android 8.0 (Oreo)。除非某个必要功能仅在较新版本中可用，否则书中创建的大多数项目将使用此\
  \ SDK。这里的目标是使用最新的 Android SDK 构建应用，同时保持与运行旧版本 Android 的设备的兼容性（在这种情况下，可以追溯到 Android\
  \ 8.0）。`Minimum SDK` 设置下方的文字将概述当前运行该应用程序的 Android 设备百分比。点击 `Help me choose` 按钮（在\
  \ 图 3-3 中突出显示）可以查看仍在使用的各种 Android 版本的完整细分：\n\n![](img/as_new_project_settings.jpg)\n\
  \n图 3-3\n\n最后，将 `Language`（语言）菜单更改为 `Java` 并点击 `Finish`（完成）启动项目创建过程。\n\n## 3.5 示例应用程序\n\
  \n此时，Android Studio 已创建了一个最小的示例应用程序项目并打开了主窗口。\n\n![](img/as_4.1_main_window.jpg)\n\
  \n图 3-4\n\n新创建的项目和相关文件的引用列在主项目窗口左侧的 `Project` 工具窗口中。`Project` 工具窗口有多种显示信息的模式。默认情况下，此面板应处于\
  \ `Android` 模式。此设置由面板顶部的菜单控制，如 图 3-5 所示所示。如果面板当前不是 Android 模式，请使用菜单切换模式：\n\n![](img/as_project_tool_window_menu.jpg)\n\
  \n图 3-5\n\n## 3.6 修改用户界面\n\n我们 Activity（活动）的用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目层级结构的\
  \ `app -> res -> layout` 下。在 `Project` 工具窗口中找到它后，双击该文件将其加载到用户界面 `Layout Editor`（布局编辑器）工具中，该工具将出现在\
  \ Android Studio 主窗口的中间面板：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n`Layout\
  \ Editor` 窗口顶部的工具栏上有一个菜单（在上面的图中设置为 `Pixel`），它反映在 `Layout Editor` 面板中设备的视觉表示上。点击此菜单可以选择广泛的其他设备选项。\n\
  \n要在设备表示的横屏和竖屏之间切换，只需使用设备选择菜单正左侧的下拉菜单，该菜单显示为 ![](img/as_4.1_orientation.jpg) 图标。使用\
  \ `night` 按钮 (![](img/as_night_mode.jpg)) 来开启或关闭 `Night mode`（夜间模式）。\n\n正如设备屏幕所示，内容布局已经包含一个显示“Hello\
  \ World!”消息的标签。面板左侧是 `palette`（调色板），包含不同类别的用户界面组件，这些组件可构建用户界面，例如按钮、标签和文本字段。然而，需要注意的是，并不是所有用户界面组件对用户都是可见的。其中一类就是布局。Android\
  \ 支持多种布局，对视觉用户界面组件在屏幕上的定位和管理提供不同级别的控制。虽然很难从用户界面的视觉表示上判断，但当前的设计是使用 `ConstraintLayout`\
  \ 创建的。这可以通过查看 `Component Tree`（组件树）面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如 图\
  \ 3-7 所示：\n\n![](img/as_4.1_component_tree.jpg)\n\n图 3-7\n\n从组件树层次结构可以看出，用户界面布局由一个\
  \ `ConstraintLayout` 父对象和一个 `TextView` 子对象组成。\n\n在继续之前，还请检查 `Layout Editor` 的 `Autoconnect`（自动连接）模式已启用。这意味着当组件添加到布局中时，`Layout\
  \ Editor` 将自动添加约束，以确保组件在不同屏幕尺寸上正确定位。`Autoconnect` 按钮出现在 `Layout Editor` 工具栏中，由磁铁图标表示。当禁用时，磁铁上会有一条斜线（如\
  \ 图 3-8 所示）。如有必要，点击此按钮重新启用 `Autoconnect`。\n\n![](img/autoconnect.jpg)\n\n图 3-8\n\
  \n修改应用程序的下一步是在布局中添加一些额外的组件，其中第一个用于用户启动转换的 `Button`。\n\n`Palette`（调色板）面板由两列组成，左列包含视图组件类别列表。右列列出当前选择类别中的组件。在\
  \ 图 3-9 中，例如，`Buttons` 类别中选择了 `Button` 视图：\n\n![](img/as_4.1_palette.jpg)\n\n图 3-9\n\
  \n从 `Buttons` 列表中点击并拖动 `Button` 对象，将其放到用户界面设计的水平中心，使其位于现有的 `TextView` 组件下方：\n\n\
  ![](img/as_4.1_androidsample_button_added.jpg)\n\n图 3-10\n\n下一步是更改 `Button` 组件当前显示的文本。设计区域右侧的面板是\
  \ `Attributes`（属性）面板。此面板显示分配给布局中选中组件的属性。在此面板中，在 `Common Attributes` 中找到 `text` 属性，并将当前值从“Button”更改为“Convert”，如\
  \ 图 3-11 所示：\n\n![](img/as_4.1_text_attribute.jpg)\n\n图 3-11\n\n第二个带有扳手的文本属性允许设置仅在\
  \ `Layout Editor` 工具中显示的文本属性，但在运行时不显示。这对于测试视觉组件和布局在不同设置下的行为非常有用，而无需反复运行应用程序。\n\n\
  以防 `Autoconnect` 系统未能设置所有布局连接，请点击 `Infer constraints`（推断约束）按钮（图 3-12）为布局添加任何缺失的约束：\n\
  \n![](img/as_layout_editor_toolbar.jpg)\n\n图 3-12\n\n\n\n\n在此处，重要的是解释位于布局编辑器（Layout\
  \ Editor）工具右上角的警告按钮，如图 3-13 所示。显然，这表示布局可能存在问题。要查看任何问题的详细信息，请点击该按钮：\n\n![](img/as_3.6_layout_warnings.jpg)\n\
  \n图 3-13\n\n点击后，将出现一个面板（图 3-14），描述问题的性质并提供一些可能的纠正措施：\n\n![](img/as_hardcoded_text.jpg)\n\
  \n图 3-14\n\n目前，列出的唯一警告内容如下：\n\n硬编码字符串 \"Convert\"，应使用 @string 资源\n\n这条 I18N 消息告诉我们，项目未来的国际化（I18N）存在潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告提醒我们，在开发 Android 时，尽可能应将文本字符串等属性和值以资源的形式存储。这样做允许通过修改资源文件来更改应用程序的外观，而不是更改应用程序源代码。这在将用户界面翻译成不同的口语语言时可能特别有价值。如果用户界面中的所有文本都包含在单一资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件以包含在应用程序中。这使得无需修改任何源代码即可针对多种语言。在本例中，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击问题说明（Issue Explanation）面板中的 `Fix`\
  \ 按钮，以显示提取资源（Extract Resource）面板（图 3-15）。在此面板中，将资源名称字段更改为 `convert_string`，并在点击\
  \ `OK` 按钮之前，将资源值保留为 `Convert`。\n\n![](img/as_4.1_extract_resource.jpg)\n\n图 3-15\n\
  \n下一个要添加的部件是 `EditText` 挂件，用户将在其中输入要转换的美元金额。从调色板（Palette）面板中，选择 `Text` 类别，并点击拖动\
  \ `Number (Decimal)` 组件到布局上，使其水平居中并置于现有 `TextView` 部件上方。选中挂件后，使用 `Attributes`（属性）工具窗口将\
  \ `hint` 设置为“dollars”。点击警告图标并将字符串提取为名为 `dollars_hint` 的资源。\n\n本章稍后编写的代码将需要访问用户输入\
  \ `EditText` 字段的美元值。它将通过引用分配给用户界面布局中挂件的 `id` 来实现。当在布局中选中挂件时，可以在 `Attributes` 工具窗口查看并更改\
  \ Android Studio 为挂件分配的默认 `id`，如图 3-16 所示：\n\n![](img/as_4.0_textview_id.jpg)\n\n\
  图 3-16\n\n将 `id` 更改为 `dollarText`，并在 `Rename`（重命名）对话框中点击 `Refactor`（重构）按钮。这确保了项目其他地方对旧\
  \ id 的引用都会自动更新为使用新 id：\n\n![](img/as_4.1_rename_dialog.jpg)\n\n图 3-17\n\n点击 `Infer\
  \ constraints`（推断约束）按钮添加任何缺失的布局约束。此时，布局应该类似于图 3-18 所示：\n\n![](img/as_4.1_androidsample_ui.jpg)\n\
  \n图 3-18\n\n## 3.7 检查布局和资源文件\n\n在继续后续步骤之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用布局编辑器工具修改\
  \ `activity_main.xml` 文件对用户界面进行了一些更改。事实上，布局编辑器所做的只是提供了一种用户友好的方式来编辑文件的底层 XML 内容。在实践中，没有理由不直接修改\
  \ XML 来进行用户界面更改，在某些情况下，这实际上比使用布局编辑器工具更快。在布局编辑器面板的右上角有三个按钮，如下文图 3-19 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\
  \n图 3-19\n\n默认情况下，编辑器将处于 `Design`（设计）模式，此时仅显示布局的视觉表示。最左侧的按钮将切换到 `Code`（代码）模式以显示布局的\
  \ XML，而中间的按钮进入 `Split`（分割）模式，同时显示布局和 XML，如图 3-20 所示：\n\n![](img/as_4.1_split_mode.jpg)\n\
  \n图 3-20\n\n从 XML 文件的结构可以看出，用户界面由 `ConstraintLayout` 组件组成，它又是 `TextView`、`Button`\
  \ 和 `EditText` 对象的父级。我们还可以看到，例如 `Button` 的 `text` 属性被设置为我们的 `convert_string` 资源。尽管复杂程度和内容不同，所有用户界面布局都是以这种层次化的、基于\
  \ XML 的方式构建的。\n\n当对 XML 布局进行更改时，这些更改将反映在画布上。也可以在画布内视觉修改布局，更改出现在 XML 列表中。为了演示这种效果，切换到\
  \ `Split` 模式并修改 XML 布局，将 `ConstraintLayout` 的背景颜色改为：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\"\n    android:background=\"#ff2438\">\n\n</androidx.constraintlayout.ConstraintLayout>\n\
  ```\n\n注意布局颜色实时变化以匹配 XML 文件中的新设置。还要注意 XML 编辑器中颜色设置行的左侧边距（也称为槽）出现了一个红色小方块。这是设置了红色属性的视觉提示。点击红色方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_color_chooser.jpg)\n\n图 3-21\n\n在继续之前，从布局文件中删除 `background`\
  \ 属性，使背景返回默认设置。\n\n最后，使用 `Project` 面板找到 `app` -> `res` -> `values` -> `strings.xml`\
  \ 文件，并双击它将其加载到编辑器中。目前 XML 内容应如下：\n\n```xml\n<resources>\n    <string name=\"app_name\"\
  >AndroidSample</string>\n    <string name=\"convert_string\">Convert</string>\n\
  \    <string name=\"dollars_hint\">dollars</string>\n</resources>\n```\n\n为了演示资源的作用，将分配给\
  \ `convert_string` 资源的字符串值更改为“Convert to Euros”，然后通过编辑器面板中的布局文件标签页返回布局编辑器工具。注意布局已经获取了字符串的新资源值。\n\
  \n\n\n\n还有一种快速访问 XML 文件中引用的资源值的方法。在拆分（Split）或代码（Code）模式下，使用布局编辑器工具，点击 `@string/convert_string`\
  \ 属性设置，使其高亮显示，然后按下键盘上的 `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后会打开 `strings.xml`\
  \ 文件，并将您带到文件中声明该资源的行。利用此机会将字符串资源还原为原始的“Convert”文本，并添加以下额外的字符串资源项，该资源稍将在应用代码中引用：\n\
  \n```xml\n<resources>\n    <string name=\"convert_string\">Convert</string>\n  \
  \  <string name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\"\
  >No Value</string>\n</resources>\n```\n\n资源字符串也可以使用 Android Studio 的翻译编辑器（Translations\
  \ Editor）进行编辑。要打开此编辑器，右键点击 `app` -> `res` -> `values` -> `strings.xml` 文件，并选择 `Open\
  \ editor` 菜单选项。这会在 Android Studio 窗口的主面板中显示翻译编辑器：\n\n![](img/as_3.6_translations_editor.jpg)\n\
  \n图 3-22\n\n此编辑器允许编辑分配给资源键的字符串，并管理多种语言的翻译。\n\n## 3.8 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，以便当用户在\
  \ `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在 `TextView` 上。这涉及在 `Button` 控件上实现一些事件处理。具体来说，需要配置\
  \ `Button`，以便在触发 `onClick` 事件时调用应用代码中的方法。事件处理可以通过多种不同的方式实现，并将在后续标题为 Android 事件处理概述与示例\
  \ 的章节中进行详细介绍。将布局编辑器返回设计（Design）模式，在布局编辑器中选择 `Button` 控件，参考属性（Attributes）工具窗口并按所示指定名为\
  \ `convertCurrency` 的方法：\n\n![](img/as_3.6_set_onclick.jpg)\n\n图 3-23\n\n注意，`onClick`\
  \ 属性的文本字段现在用红色边框高亮显示，警告我们该按钮已配置调用一个尚不存在的方法。为了解决这个问题，双击项目工具窗口中的 `MainActivity.java`\
  \ 文件（`app` -> `java` -> `<package name>` -> `MainActivity`）将其加载到代码编辑器中，并在类文件中添加\
  \ `convertCurrency` 方法的代码，使其读取内容如下，请注意还有必要导入一些额外的 Android 程序包：\n\n```java\npackage\
  \ com.ebookfrenzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\n\nimport java.util.Locale;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n该方法首先通过调用名为 `findViewById` 方法并传递布局文件中分配的 id 来获取 `EditText`\
  \ 和 `TextView` 对象的引用。然后进行检查以确保用户已输入了美元值，如果是，则提取该值，将其从 `String` 转换为浮点值并转换为欧元。最后，结果显示在\
  \ `TextView` 控件上。如果这些任何内容不清楚，请放心，这些概念将在后面的章节中进行详细介绍。\n\n## 3.9 总结\n\n虽然设置 Android\
  \ 开发环境并不特别复杂，但涉及许多步骤。在完成这些步骤后，通过运行示例来确保环境已正确安装和配置是非常好的。在本章中，我们创建了一个示例应用程序，并使用 Android\
  \ Studio 布局编辑器工具修改了用户界面布局。通过这样做，我们探讨了尽可能使用资源的重要性，特别是在字符串值的情况下，并简要接触了布局主题。接下来，我们查看了用于存储\
  \ Android 应用用户界面设计的底层 XML。\n\n最后，在 `Button` 上添加了 `onClick` 事件，连接到一个已实现的方法，该方法用于从\
  \ `EditText` 组件中提取用户输入，将美元转换为欧元，然后在 `TextView` 上显示结果。\n\n由于应用程序已准备好测试，为测试之目的设置模拟器的必要步骤将在下一章中详细介绍。\n\
  \n# 4. 在 Android Studio 中创建 Android 虚拟设备 (AVD)\n\n尽管 Android Studio 的预览面板允许我们查看正在设计的布局并使用交互模式测试基本功能，但仍有必要编译并运行整个应用程序以完全测试其是否运行正常。可以通过在物理设备上或在\
  \ Android 虚拟设备 (AVD) 模拟器环境中安装并运行来测试 Android 。在使用 AVD 之前，必须先创建并配置以匹配特定设备型号的规格。在本章中，我们将以\
  \ Pixel 4 为参考创建此类虚拟设备。\n\n## 4.1 关于 Android 虚拟设备\n\nAVD 本质上是模拟器，允许在无需将应用程序安装到物理设备上的情况下测试\
  \ Android 应用程序。AVD 可以配置为模拟各种硬件功能，包括屏幕大小、内存容量以及是否存在摄像头、GPS 导航或加速度计等功能选项。作为 Android\
  \ Studio 标准安装的一部分，安装了几个模拟器模板，允许为一系列不同的设备配置 AVD。可以通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，来创建自定义配置以匹配任何物理\
  \ Android 设备。\n\nAVD 会话可以以独立窗口的形式出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 AVD 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）创建和管理，该管理器可以在命令行模式或使用更友好的图形用户界面使用。要创建新的\
  \ AVD，第一步是启动 AVD 管理器。可以在 Android Studio 环境内选择 `Tools` -> `Device Manager` 菜单选项来实现。\n\
  \n启动后，管理器将作为工具窗口出现，如图 4-1 所示：\n\n![](img/as_avd_manager.jpg)\n\n图 4-1\n\n要添加新的 AVD，首先确保选中了\
  \ `Virtual` 选项卡，然后点击 `Create device` 按钮打开虚拟设备配置对话框：\n\n![](img/as_avd_manager_select_hardware.jpg)\n\
  \n图 4-2\n\n在对话框中，执行以下步骤创建一个兼容 Pixel 4 的模拟器：\n\n1. 从 `Category` 面板中选择 `Phone` 选项以显示可用\
  \ Android 手机 AVD 模板列表。\n2. 选择 `Pixel 4` 设备选项并点击 `Next`。\n\n\n\n\n3. 在 System Image（系统镜像）屏幕上，选择最新版本的\
  \ Android。注意，如果尚未安装系统镜像，`Release Name`（发行名称）旁边将提供一个 `Download`链接。点击此链接下载并安装系统镜像，然后再进行选择。如果列表中没有你需要的镜像，请点击\
  \ `x86 Images` 标签（如果你运行的是搭载 Apple 芯片的 Mac，则点击 `ARM images`）或 `Other images` 标签以查看备选列表。\n\
  \n4. 点击 `Next` 继续，并在 name 字段中输入一个描述性名称（例如 Pixel 4 API 32），或直接接受默认名称。\n\n5. 点击 `Finish`\
  \ 创建 AVD。\n\n6. AVD 创建完成后，现在可以关闭 `Device Manager`（设备管理器）。如果以后需要对 AVD 进行修改，只需重新打开\
  \ `Device Manager`，从列表中选择 AVD，并点击 `Actions` 列中的铅笔图标来编辑设置。\n\n## 4.2 启动模拟器\n\n要对新创建的\
  \ AVD 模拟器进行测试运行，只需从 `Device Manager` 中选择该模拟器并点击启动按钮（`Actions` 列中的三角形）。模拟器将嵌入在 Android\
  \ Studio 主窗口中出现并开始启动过程。模拟器启动所需取决于 AVD 本身及其运行系统的配置：\n\n![](img/as_emulator_tool_window.jpg)\n\
  \n图 4-3\n\n要隐藏和显示模拟器工具窗口，请点击 `Emulator` 工具窗口按钮（如上方的 A 标记）。点击标签页旁边的“x”关闭按钮 (B) 退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签页表示。例如，图\
  \ 4-4 显示了一个包含两个模拟器会话的工具窗口：\n\n![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n\
  \n图 4-4\n\n要在会话之间切换，只需点击相应的标签页。\n\n虽然模拟器可能默认以竖向方向显示，但此项和其他默认选项都可以更改。在 `Device Manager`\
  \ 中，选择新的 Pixel 4 条目，并点击设备行 `Actions` 列中的铅笔图标。在配置屏幕上，找到 `Startup orientation`（启动方向）部分并更改方向设置。退出并重启模拟器会话以使更改生效。关于模拟器的更多细节请参见下一章\
  \ “使用和配置 Android Studio AVD 模拟器”。\n\n为了在本章的下一节中节省时间，请在继续之前保持模拟器运行。\n\n## 4.3 在 AVD\
  \ 中运行应用程序\n\n配置 AVD 模拟器后，之前章节中创建的示例 `AndroidSample` 应用程序现在可以编译并运行。将 `AndroidSample`\
  \ 项目加载到 Android Studio 后，确保新创建的 Pixel 4 AVD 显示在设备菜单中（如下方 图 4-5 中的 A 标记），然后点击由绿色三角形代表的运行按钮\
  \ (B)、选择 `Run -> Run ‘app’` 菜单选项，或使用键盘快捷键 `Ctrl-R`：\n\n![](img/as_avd_run_target.jpg)\n\
  \n图 4-5\n\n设备菜单 (A) 可用于选择不同的 AVD 实例或物理设备作为运行目标，也可以在多个设备上运行应用。该菜单还提供了访问 `Device Manager`\
  \ 以及设备连接配置和故障排除选项的通道：\n\n![](img/as_run_target_menu.jpg)\n\n图 4-6\n\n一旦应用程序安装并运行，第一个\
  \ fragment（碎片）的用户界面将在模拟器中出现（fragment 是 Android 项目中可重用的部分，通常由用户界面布局和一些代码组成，该主题将在题为\
  \ “Android 碎片简介” 的章节中介绍）：\n\n![](img/as_eandroid_sample_running.jpg)\n\n图 4-7\n\n\
  如果 activity（活动）没有自动启动，请检查模拟器应用列表中是否出现了启动图标。如果是，只需点击它即可启动应用程序。一旦运行过程开始，`Run` 工具窗口将可用。在应用程序包安装和启动时，`Run`\
  \ 工具窗口将显示诊断信息。图 4-8 显示了典型成功启动应用程序时 `Run` 工具窗口的输出：\n\n![](img/as_4.1_run_tool_window.jpg)\n\
  \n图 4-8\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供信息，希望这有助于隔离问题原因。\n\n假设应用程序加载到模拟器并按预期运行，我们已经安全地验证了\
  \ Android 开发环境已正确安装和配置。现在应用正在运行，尝试进行货币转换以验证应用是否按预期工作。\n\n## 4.4 在多个设备上运行\n\n上方 图\
  \ 4-6 显示的运行菜单包含一个在多个模拟器和设备上并行运行应用的选项。选择此项后，将显示如 图 4-9 所示所示的框，列出系统上配置的所有 AVD 以及任何连接的物理设备。勾选要目标模拟器或设备旁边的复选框，然后点击\
  \ `Run` 按钮：\n\n![](img/as_4.1_multiple_devices.jpg)\n\n图 4-9\n\n点击 `Run` 按钮后，Android\
  \ Studio 将在指定的模拟器和设备上启动应用。\n\n## 4.5 停止运行的应用程序\n\n要停止正在运行的应用程序，只需点击如 图 4-10 所示的主工具栏中的停止按钮：\n\
  \n![](img/as_4.1_stop_button.jpg)\n\n图 4-10\n\n也可以使用 `Run` 工具窗口终止应用。在应用运行时显示 `Run`\
  \ 工具窗口。一旦窗口出现，点击下方 图 4-11 所示的停止按钮：\n\n![](img/as_4.1_stop_button_run_window.jpg)\n\
  \n图 4-11\n\n## 4.6 支持深色主题\n\nAndroid 10 引入了期待已深色主题，Android Studio 项目默认启用。要在 AVD\
  \ 模拟器中测试深色主题，请在运行的 Android 实例中打开 `Settings` 应用。在 `Settings` 应用中，选择 图 4-12 所示的 `Display`\
  \ ，使屏幕背景变为黑色：\n\n![](img/as_avd_dark_theme_setting.jpg)\n\n图 4-12\n\n启用深色主题后，运行\
  \ `AndroidSample` 应用，并注意它以如 图 4-13 所示的深色主题显示，包括黑色背景和紫色背景按钮：\n\n![](img/as_eandroid_sample_running_dark.jpg)\n\
  \n图 4-13\n\n返回 `Settings` 应用并关闭深色模式后再继续。\n\n## 4.7 在独立窗口中运行模拟器\n\n到目前为止，我们仅将模拟器作为嵌入在\
  \ Android Studio 主窗口的工具窗口。要在独立窗口中运行模拟器，选择 `File -> Settings...` 菜单选项（macOS 为 `Android\
  \ Studio -> Preferences...`），在设置对话框的左侧导航面板中导航到 `Tools -> Emulator`，并禁用 `Launch in\
  \ a tool window` ：\n\n![](img/as_avd_separate_window_setting.jpg)\n\n图 4-14\n\n\
  禁用该选项后，点击 `Apply` 按钮以及 `OK` 提交更改，然后点击上方 图 4-3 中标记为 B 的标签页上的关闭按钮退出当前的模拟器会话。\n\n再次运行示例应用，此时模拟器将作为一个独立窗口出现，所示：\n\
  \n![](img/as_android_emulator_standalone.jpg)\n\n图 4-15\n\n\n\n\n选择独立模式或工具窗口模式取决于个人喜好。如果你喜欢让模拟器运行在工具窗口中，请返回设置界面并重新启用\
  \ `Launch in a tool window`（在工具窗口中启动）选项。然而，在决定使用独立模式之前，请记住模拟器工具窗口可以通过点击模拟器工具栏上的设置按钮（由齿轮图标表示）并选择\
  \ `View Mode -> Float`（视图模式 -> 浮动）菜单选项与主 Android Studio 窗口分离：\n\n![](img/as_avd_float_mode.jpg)\n\
  \n图 4-16\n\n## 4.8 启用设备框架\n\n模拟器可以配置为显示（参考图 4-17）或不显示（参考图 4-15）的设备框架。\n\n![](img/as_eandroid_sample_running_device_frame.jpg)\n\
  \n图 4-17\n\n要更改设置，请打开 `Device Manager`（设备管理器），从列表中选择 `AVD`，并点击 `Actions`（操作）列中的铅笔图标以编辑设置。在设置界面，找到并更改\
  \ `Enable Device Frame`（启用设备框架）选项：\n\n![](img/as_avd_device_frame_setting.jpg)\n\
  \n图 4-18\n\n## 4.9 AVD 命令行创建\n\n如前所述，除了图形用户界面外，还可以直接从命令行创建新的 `AVD`。这是通过使用 `avdmanager`\
  \ 工具结合一些命令行选项实现的。一旦启动，该工具会在创建新 `AVD` 之前提示输入额外信息。\n\n`avdmanager` 工具需要访问 Java 运行环境\
  \ (`JRE`) 才能运行。如果在尝试运行 `avdmanager` 时出现错误消息提示找不到 `java` 命令，则可以将运行该命令的命令提示符或终端窗口配置为使用与\
  \ Android Studio 捆绑的 `OpenJDK` 环境。首先通过以下方式识别 `OpenJDK` `JRE` 的位置：\n\n1. 启动 Android\
  \ Studio 并打开书中之前创建的 `ComposeDemo` 项目。\n2. 选择 `File -> Settings...`（文件 -> 设置...）菜单选项（macOS\
  \ 上为 `Android Studio -> Preferences...`）。\n3. 到 `Build, Execution, Deployment`（构建、执行、部署）部分，选择\
  \ `Build Tools`（构建工具）类别下的 `Gradle` 选项。\n4. 点击 `Gradle JDK` 设置并记录 Android Studio\
  \ 默认 `JDK` 的路径：\n\n![](img/as_gradle_jdk_setting.jpg)\n\n图 4-19\n\n在 Windows 上，在运行\
  \ `avdmanager` 的命令提示符窗口中执行以下命令（将 `<path to jre>` 替换为上方项目结构对话框中复制的路径）：\n\n```bash\n\
  set JAVA_HOME=<path to jre>\n```\n\n在 macOS 或 Linux 上，执行以下命令：\n\n```bash\nexport\
  \ JAVA_HOME=\"<path to jre>\"\n```\n\n如果你预计经常使用 `avdmanager` 工具，请按照“设置 Android Studio\
  \ 开发环境”章节概述的针对你操作系统的环境变量步骤，在系统范围内配置 `JAVA_HOME`。\n\n假设系统已配置将 `Android SDK` 工具目录包含在\
  \ `PATH` 环境变量中，可以通过在终端或命令窗口中发布以下命令获取新 `AVD` 的可用目标列表：\n\n```bash\navdmanager list\
  \ targets\n```\n\n上述命令的输出将包含系统可用的 `Android SDK` 版本列表。例如：\n\nAvailable Android targets:\n\
  \n----------\nid: 1 or \"android-29\"\n     Name: Android API 29\n     Type: Platform\n\
  \     API level: 29\n     Revision: 1\n----------\nid: 2 or \"android-26\"\n   \
  \  Name: Android API 26\n     Type: Platform\n     API level: 26\n     Revision:\
  \ 1\n\n`avdmanager` 工具还允许从命令行创建新的 `AVD` 实例。例如，要使用 Android API  29 设备的目标 ID 并使用 `x86`\
  \ `ABI` 创建名为 `myAVD` 的新 `AVD`，可以使用以下命令：\n\n```bash\navdmanager create avd -n myAVD\
  \ -k \"system-images;android-29;google_apis_playstore;x86\"\n```\n\n`avdmanager`\
  \ 工具将根据基础 Android 8 设备的规格创建新的 `AVD`，同时根据需要提供创建自定义配置以匹配特定设备规格的选项。一旦从命令行创建了新的 `AVD`，在点击\
  \ `Refresh`（刷新）按钮之前，它可能不会出现在 `Android Device Manager`（Android 设备管理器）工具中。\n\n除了创建新的\
  \ `AVD`，还可以从命令行执行其他任务。例如，可以使用 `list avd` 命令行参数获取当前可用 `AVD` 列表：\n\n```bash\navdmanager\
  \ list avd\n```\n\nAvailable Android Virtual Devices:\n\n   Name: Pixel_XL_API_28_No_Play\n\
  \   Device: pixel_xl (Google)\n   Path: /Users/neilsmyth/.android/avd/Pixel_XL_API_28_No_Play.avd\n\
  \   Target: Google APIs (Google Inc.)\n   Skin: pixel_xl\n   ABI: x86\n```\n\n同样，要删除一个\
  \ `AVD`，可以使用：\n\n```bash\navdmanager delete avd -n <avd name>\n```\n\n## 4.10 Android\
  \ 设备配置文件\n\n默认情况下，与 `AVD` 关联的文件存储在用户主目录下的 `.android/avd` 子目录中，其结构如下（其中 `<avd name>`\
  \ 替换为 AVD 的名称）：\n\n`<avd name>.avd/config.ini`\n`<avd name>.avd/userdata.img`\n\n\
  `config.ini` 文件包含了创建 AVD 时指定的设备配置，如显示和内存。这些设置可以在配置文件中直接更改，并在下次调用 AVD 时采用。\n\n`.ini`\
  \ 文件包含了对 `Android SDK` 路径的引用。注意 `config.ini` 中的 `sysdir` 也需要反映目标值。\n\n## 4.11 移动和重命名\
  \ Android 设备\n\n可以使用 `avdmanager` 工具的 `move` 参数从命令行更改 AVD 的当前名称或位置。例如，要将名为 `Pixel4`\
  \ 的 AVD 重命名为 `Pixel4a`，可以使用：\n\n```bash\navdmanager move avd -n Pixel4 -r Pixel4a\n\
  ```\n\n要物理移动 AVD 的文件，应使用以下命令格式：\n\n```bash\navdmanager move avd -n <avd name> -p\
  \ <path to new location>\n```\n\n注意在执行移动 AVD 的命令之前，目标目录必须存在。\n\n## 4.12 总结\n\n典型的应用程序开发过程遵循编码、编译和在测试环境中运行的循环。Android\
  \ 应用程序可以在物理 Android 设备或使用 虚拟设备（AVD）模拟器上进行测试。AVD 使用 `Android Studio Device Manager`\
  \ 工具创建和管理，该工具既可以通过命令行使用，也可以通过图形界面使用。在模拟特定的 Android 设备模型时，应配置为与物理设备匹配的硬件规格。\n\nAVD\
  \ 模拟器可以以独立窗口的形式显示，也可以嵌入 Android Studio 用户界面。\n\n# 5. 使用和配置 Android Studio AVD 模拟器\n\
  \n在下一章探索物理 Android 设备之前，本章将花一些时间提供 Android Studio AVD 模拟器的概述，并突出许多在独立和工具窗口模式下用于自定义环境的配置功能。\n\
  \n## 5.1 模拟器环境\n\n以独立模式启动时，模拟器会在加载过程中显示初始启动屏幕。加载完成后，会出现主模拟器窗口，包含所选设备类型的表示（对于图 5-1\
  \ (#AVD_Configuration.xhtml__idTextAnchor108) 而言，这是一个 Pixel 4 设备）：\n\n\n\n\n\n![](img/android_12_avd_running_standalone.jpg)\n\
  \n图 5-1\n\n窗口右侧边缘设置了工具栏，提供了快速访问模拟器控件和配置选项的功能。\n\n## 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的系列选项访问。\n\
  \n![](img/as_3.5_avd_toolbar.jpg)\n\n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上并等待工具提示出现，或者通过扩展控制面板的帮助选项来识别。\n\
  \n尽管工具栏中包含许多选项都是自俗易懂的，但为了完整性，我们将介绍每个选项：\n\n* `Exit / Minimize`（退出/最小化）——工具栏中最顶部的“x”按钮退出模拟器会话，而“-”选项则最小化整个窗口。\n\
  * `Power`（电源）——`Power`按钮模拟物理 Android 设备上的硬件电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。长按此按钮将启动设备的“关机”请求序列。\n\
  * `Volume Up / Down`（音量增大/减小）——控制模拟器环境内播放音量的两个按钮。\n* `Rotate Left/Right`（左转/右转）——在模拟设备的纵屏和横屏方向之间旋转设备。\n\
  * `Take Screenshot`（截图）——对设备屏幕当前显示的内容截图。截取的图像存储在扩展控制面板 `Settings` 屏幕指定的路径（本章稍后概述）。\n\
  * `Zoom Mode`（缩放模式）——此按钮切换进入和退出缩放模式，细节将在本章后续介绍。\n* `Back`（返回）——执行标准的 Android“返回”导航回到上一个屏幕。\n\
  * `Home`（主页）——显示设备主屏幕。\n* `Overview`（概述）——模拟选择标准的 Android“概述”导航，显示设备上正在运行的应用。\n\
  * `Fold Device`（折叠设备）——模拟折叠设备的折叠和展开。此选项仅在模拟器运行折叠设备系统镜像时才可用。\n* `Extended Controls`（扩展控制）——显示扩展控制面板，允许配置此类选项，如模拟位置和电话活动、电池强度、蜂窝网络类型和指纹识别。\n\
  \n## 5.3 在缩放模式下工作\n\n模拟器工具栏上的缩放按钮用于切换进入和退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，且鼠标指针悬停在设备屏幕上时显示放大镜。点击左鼠标键将导致显示相对于屏幕上的选定点放大，重复点击将增加缩放级别。相反，点击右鼠标键将降低缩放级别。关闭缩放按钮将显示恢复为默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮时视图将缩放至该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条对屏幕可见区域进行移动。\n\
  \n## 5.4 调整模拟器窗口大小\n\n可以通过点击并拖动窗口的任何角或侧边，随时更改模拟器窗口的大小（以及相应的设备表示）。\n\n## 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮显示如 图 5-3 所示的面板。默认情况下将显示位置设置。从左侧面板选择不同的类别将显示相应的控件组：\n\n![](img/as_avd_location.jpg)\n\
  \n图 5-3\n\n### 5.5.1 位置\n\n位置控制允许以十进制或六十进制制坐标的形式将模拟位置信息发送到模拟器。位置信息可以是单个位置，也可以是代表设备移动的点序列，后者通过\
  \ GPS 交换 (GPX) 或 Keyhole 标记语言 (KML) 格式的文件提供。或者，可以使用集成的 Google Maps 面板视觉化地选择点或旅行路线。\n\
  \n### 5.5.2 显示器\n\n除了模拟器屏幕内显示的主显示外，`Displays` 选项允许在同一个 Android 实例中运行额外的显示器。这对于为如\
  \ Microsoft Surface Duo 等双屏设备测试应用可能非常有用。这些额外屏幕可以配置为任何所需的尺寸，并与主屏幕在同一个模拟器窗口中显示。\n\n\
  ### 5.5.3 蜂窝\n\n可以在蜂窝设置屏幕内更改模拟的蜂窝连接类型。提供了可以模拟不同网络类型（CSM、EDGE、HSDPA 等）的选项，以及一系列漫游和拒绝访问等语音和数据场景。\n\
  \n### 5.5.4 电池\n\n扩展控制屏幕的此面板可以模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及当前是否连接了 AC 充电器。\n\n###\
  \ 5.5.5 摄像头\n\n模拟器在摄像头激活时模拟 3D 场景。这表现为虚拟建筑内部，在模拟器内录制视频或拍照之前，可以通过按住 `Option` 键（Windows\
  \ 上为 Alt）同时使用鼠标指针和键盘键进行导航。此扩展配置选项允许上传不同的图像以在虚拟环境中显示。\n\n### 5.5.6 电话\n\n电话扩展控制为模拟器提供了两个非常简单但实用的模拟。第一个选项允许模拟来自指定电话号码的入电电话。这在测试应用如何处理此类高级级中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与现实世界一样，这些消息将显示在消息应用中，并触发模拟器内的标准通知。\n\n### 5.5.7 方向键\n\n\
  方向键 (D-Pad) 是内置在 Android 设备中或外部连接（如游戏控制器）的额外组控件，提供方向控制（左、右、上、下）。方向键设置允许在模拟器内模拟 D-Pad\
  \ 交互。\n\n### 5.5.8 麦克风\n\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供按钮启动模拟器上的语音助手。\n\n### 5.5.9\
  \ 指纹\n\n许多 Android 设备现在都配备了内置指纹检测硬件。AVD 模拟器使得测试指纹识别成为可能，无需在带有指纹传感器的物理设备上测试应用。关于如何在模拟器中配置指纹测试的细节将在本章后面详细介绍。\n\
  \n### 5.5.10 虚拟传感器\n\n虚拟传感器选项允许模拟加速度计和磁力计，通过偏航、俯仰和横滚设置模拟设备的物理运动（如旋转、移动和倾斜）。\n\n\
  ### 5.5.11 快照\n\n快照包含当前运行 AVD 会话的状态，可以进行保存并快速恢复，使模拟器能够返回精确状态。快照将在本章后续介绍。\n\n###\
  \ 5.5.12 录制与回放\n\n允许将模拟器屏幕和音频录制并保存为 WebM 或动态 GIF 格式。\n\n### 5.5.13 Google Play\n\
  \n\n\n\n如果模拟器运行的是安装了 Google Play 服务的 Android 版本，此选项将显示当前的 Google Play 版本，并提供将模拟器更新到最新版本的选项。\n\
  \n### 5.5.14 设置\n\n设置面板提供了一小组配置选项。使用此面板为工具栏和扩展控制面板选择更深色的主题，指定用于保存截图的文件系统位置，配置 OpenGL\
  \ 支持级别，并配置模拟器窗口在桌面上位于其它窗口之上。\n\n### 5.5.15 帮助\n\n帮助屏幕包含三个子面板，分别包含键盘快捷键列表、访问模拟器在线文档的链接、报告\
  \ Bug 和发送反馈的链接，以及模拟器版本信息。\n\n## 5.6 使用快照 (Snapshots)\n\n当模拟器首次启动时，它会执行冷启动，这就像物理\
  \ Android 设备开机时一样。由于操作系统需要加载并启动所有后台进程，此冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器都经过这一过程，系统被配置为每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将被加载到内存中，并从之前停止的地方继续执行，允许模拟器在冷启动完成所需时间的一小部分内重启。\n\
  \n扩展控制面板的快照屏幕用于在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。在屏幕中，可以使用\
  \ `Take Snapshot`（拍摄快照）按钮（标记为 图 5-4 中的 A）拍摄快照。要恢复现有的快照，从列表中选择它 (B) 并点击屏幕底部的运行按钮\
  \ (C)。还提供了编辑 (D) 快照名称和描述以及删除 (E) 当前所选快照的选项：\n\n![](img/as_emulator_snapshot.jpg)\n\
  \n图 5-4\n\n设置选项 (F) 提供了配置自动保存快速启动快照的选项（默认情况下，模拟器每次退出时都会询问是否保存快速启动快照）以及重新加载最近的快照。要强制模拟器话执行冷启动而不是使用之前的快速启动快照，请打开\
  \ AVD Manager（`Tools -> AVD Manager`），点击模拟器操作列中的向下箭头，并选择 `Cold Boot Now`（立即冷启动）菜单选项。\n\
  \n![](img/as_avd_cold_boot.jpg)\n\n图 5-5\n\n## 5.7 配置指纹模拟\n\n模拟器允许配置 10 个模拟指纹，用于测试\
  \ Android 应用中的指纹身份验证。要配置模拟指纹，首先启动模拟器，打开 `Settings` 应用并选择 `Security & Location`（安全与位置）选项。\n\
  \n在安全设置屏幕内，选择 `Use fingerprint`（使用指纹）选项。在生成的信息屏幕上点击 `Next`（下一步）按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备用屏幕解锁方法（例如\
  \ `PIN`）。点击 `Fingerprint + PIN` 按钮，并在出现提示时，选择在设备启动时不需要 `PIN`。输入并确认合适的 `PIN`，通过接受默认通知选项完成\
  \ `PIN` 输入过程。\n\n继续通过剩余的屏幕，直到设置应用请求传感器上的指纹。此时，显示扩展控制对话框，在左侧面板中选择 `Fingerprint` 类别，并确保主设置面板中选中了\
  \ `Finger 1`：\n\n![](img/Image2468.jpg)\n\n图 5-6\n\n点击 `Touch the Sensor`（触摸传感器）按钮模拟\
  \ `Finger 1` 触摸指纹传感器。模拟器将报告成功添加指纹：\n\n![](img/Image2478.jpg)\n\n图 5-7\n\n要添加额外的指纹，点击\
  \ `Add Another`（添加另一个）按钮，并在扩展控制面板菜单中选择另一个手指，然后再次点击 `Touch the Sensor` 按钮。\n\n##\
  \ 5.8 工具窗口模式下的模拟器\n\n如上一章所述（“在 Android Studio 中创建 Android 虚拟设备 (AVD)”），Android Studio\
  \ 可以配置为将模拟器作为嵌入式工具窗口启动，这样它就不会出现在单独窗口中。当在此模式下运行时，工具栏中将提供与独立模式下相同的控制控件，如 图 5-8 所示：\n\
  \n![](img/as_avd_internal_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（细节与独立模式一致）：\n\
  \n* 电源 (Power)\n* 音量增大 (Volume Up)\n* 音量减小 (Volume Down)\n* 向左旋转 (Rotate Left)\n\
  * 向右旋转 (Rotate Right)\n* 返回 (Back)\n* 首页 (Home)\n* 概览 (Overview)\n* 截图 (Screenshot)\n\
  * 快照 (Snapshots)\n* 扩展控制 (Extended Controls)\n\n## 5.9 总结\n\nAndroid Studio 包含一个\
  \ Android 虚拟设备模拟器环境，旨在使其无需在物理 Android 设备上运行即可测试应用程序。本章对模拟器进行了要介绍，并强调了用于配置和自定义环境以模拟不同测试条件的关键功能。\n\
  \n# 6. Android Studio 用户界面概览\n\n虽然运行上一章创建的示例应用程序很诱人，但这涉及使用 Android Studio 用户界面的某些方面，这些内容最好先进行描述。\n\
  \nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上用起来非常直观。尽管如此，现在花时间熟悉 Android Studio 用户界面的布局和组织将极大缩短书中后续章节的学习曲线。基于此，本章将对构成\
  \ Android Studio 环境的各个区域和组件提供初步概述。\n\n## 6.1 欢迎屏幕\n\n欢迎屏幕（图 6-1）在 Android Studio\
  \ 运行但没有打开的项目时显示（可以随时通过选择 `File -> Close Project` 菜单关闭打开的项目）。如果 Android Studio 在退出时仍有一个项目，下次启动时将跳过欢迎屏幕，自动打开之前的项目。\n\
  \n![](img/as_welcome_screen.jpg)\n\n图 6-1\n\n除了最近的项目列表，欢迎屏幕还提供了执行打开和创建项目的操作，以及访问受版本控制的项目。此外，`Customize`屏幕提供了更改\
  \ IDE 和编辑器使用的主题和字体设置。可以使用 `Plugins` 查看、安装和管理 Android Studio 插件。\n\n通过点击图 6-2 所示的菜单按钮可以使用更多选项：\n\
  \n![](img/android_studio_welcome_menu.jpg)\n\n图 6-2\n\n## 6.2 主窗口\n\n当创建新项目或打开现有项目时，Android\
  \ Studio 主窗口将出现。当同时打开多个项目时，每个项目将分配一个自己的主窗口。窗口的精确配置取决于上次打开项目时显示了哪些工具和面板，但通常类似于图 6-3\
  \ 所示。\n\n![](img/as_4.2_main_window_labelled.jpg)\n\n图 6-3\n\n主窗口的各个元素总结如下：\n\n\n\
  \n\n\n### 组件\n\n#### A – 菜单栏 (Menu Bar)\n包含一系列用于在 Android Studio 环境执行任务的菜单。\n\n\
  #### B – 工具栏 (Toolbar)\n一组用于常用操作的快捷键。工具栏按钮提供了快速访问一组特定菜单栏操作的方法。可以通过右键点击工具栏并选择 `Customize\
  \ Menus and Toolbars…` 菜单选项来自定义工具栏。如果工具栏可见，可以使用 `View -> Appearance -> Toolbar`\
  \ 菜单将其显示。\n\n#### C – 导航栏 (Navigation Bar)\n导航栏提供了一种在项目文件和文件夹之间移动的便捷方式。点击导航栏中的元素将弹出一个菜单，列出该位置的子文件夹和文件供选择。同样，点击类名将显示包含该类中包含的方法列表。从列表中选择一个方法将跳转到代码编辑器中的相应位置。使用\
  \ `View -> Appearance -> Navigation Bar` 菜单选项隐藏或显示此栏。\n\n#### D – 编辑窗口 (Editor Window)\n\
  编辑器窗口显示开发者当前正在的文件内容。当打开多个文件时，每个文件都由位于图 6-4 所示编辑器顶部边缘的标签页表示：\n\n![](img/as_4.1_editor_File_tabs.jpg)\n\
  \n图 6-4\n\n#### E – 状态栏 (Status Bar)\n状态栏显示关于项目和 Android Studio 活动的消息信息，以及位于最左角的工具菜单按钮。悬停在状态栏条目上将显示该字段的描述。许多字段是可交互的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  \n#### F – 项目工具窗口 (Project Tool Window)\n项目工具窗口提供了项目文件结构的层次级概述，允许对特定文件和文件夹进行导航。可以使用工具栏以多种方式显示项目。默认设置是\
  \ Android 视图，这是本书其余部分主要使用的模式。\n\n项目工具窗口只是 Android Studio 环境中提供的许多工具窗口之一。\n\n## 6.3\
  \ 工具窗口 (The Tool Windows)\n\n除了项目视图工具窗口外，Android Studio 还包含许多其他窗口，启用后，它们将显示在主窗口的底部和两侧。通过将鼠标指针悬停在状态栏最左角的按钮上（图\
  \ 6-5）而无需点击鼠标按钮，即可显示工具窗口快速访问菜单。\n\n![](img/as_tool_window_menu.jpg)\n\n图 6-5\n\n\
  从快速访问菜单中选择项目将导致相应的工具窗口在主窗口中出现。\n\n或者，可以通过点击状态栏中的快速访问图标来显示一组工具窗口栏。这些栏出现在主窗口的左侧、右侧和底部边缘（如图\
  \ 6-6 中的箭头所示），并包含显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏中的按钮将把它们隐藏。\n\n![](img/as_4.1_tool_window_bars.jpg)\n\
  \n图 6-6\n\n点击按钮将显示相应的工具窗口，而再次点击将隐藏窗口。带有数字前缀的按钮（例如 `1: Project`）表示可以通过按下键盘上的 `Alt`\
  \ 键（macOS 为 `Command` 键）配合相应的数字来显示该工具窗口。\n\n工具窗口栏中按钮的位置指示了窗口显示时将位于窗口的哪侧。可以通过点击并拖拽按钮到其他窗口工具栏中的不同位置来更改这些位置。\n\
  \n每个工具窗口在顶部边缘都有自己的工具栏。这些工具栏内的按钮随工具而异，但所有工具窗口都包含由齿轮图标表示的设置选项，允许更改窗口的各个方面。图 6-7 显示了项目工具窗口的设置菜单。提供可用选项，例如取消停靠窗口并将其浮在\
  \ Android Studio 主窗口边界之外，以及移动和调整面板大小。\n\n![](img/android_studio_tool_window_options.jpg)\n\
  \n图 6-7\n\n所有窗口在工具栏上还包含一个最右侧的按钮，提供了隐藏工具窗口视图的额外方法。只需通过点击窗口使其获得焦点然后输入搜索词，即可对工具窗口内的项目进行搜索（例如项目工具窗口中的文件名）。搜索框将出现在窗口的工具栏中，与搜索匹配的项将被高亮显示。\n\
  \nAndroid Studio 提供了各种工具窗口，最常用的如下：\n\n*   **App Inspector (App 检查器)**：提供数据库 (Database)\
  \ 和后台任务 (Background Task) 检查器的访问。数据库检查器允许你在应用程序运行时检查、查询和修改应用程序的数据库。后台任务检查器允许对使用\
  \ `WorkManager` 创建的后台工作任务进行监控和管理。\n*   **Build (构建)**：构建工具窗口显示项目在编译和打包时的构建过程信息，并显示遇到的任何错误的详情信息。\n\
  *   **Build Variants (构建变体)**：构建变体工具窗口为当前应用程序项目配置不同的构建目标提供了快速方法（例如应用程序调试版本和发布版本的不同构建，或针对不同设备类别的多个构建）。\n\
  *   **Device File Explorer (设备文件浏览器)**：通过 `View -> Tool Windows -> Device File Explorer`\
  \ 菜单可用，此工具窗口直接访问当前连接的 Android 设备或模拟器的文件系统，允许浏览文件并将文件复制到本地文件系统。\n*   **Device Manager\
  \ (设备管理器)**：访问设备管理器窗口，可以在其中添加、删除和管理 Android 设备连接和模拟器。\n*   **Emulator (模拟器)**：如果启用了在工具窗口中运行模拟器的选项，则包含\
  \ AVD 模拟器，如`创建 Android 设备 (AVD)章节所示。\n*   **Event Log (事件日志)**：事件日志窗口显示与 Android\
  \ Studio 内执行的事件和活动相关的消息。例如，项目的成功构建或应用程序正在运行将在此工具窗口中报告。\n*   **Favorites (收藏)**：可以将各种项目项添加到收藏列表。例如，在项目视图中右键点击文件，可以提供\
  \ `Add to Favorites` 菜单选项。同样，可以通过在结构 (Structure) 工具窗口中右键点击源文件中的方法作为收藏。添加到收藏列表的任何内容都可以通过此收藏工具窗口进行访问。\n\
  *   **Gradle**：Gradle 工具窗口提供了项目构建配置所需的 Gradle 任务视图。该窗口列出了将项目元素编译为可执行应用程序所需的任务。右键点击顶级\
  \ Gradle 任务并选择 `Open Gradle Config` 菜单选项，可以将当前项目的 Gradle 构建文件加载到编辑器。Gradle 将在本书后部分进行详细介绍。\n\
  *   **Layout Inspector (布局检查器)**：提供构成用户界面布局的组件层次结构的视觉 3D 渲染。\n*   **Logcat**：Logcat\
  \ 工具窗口提供了对运行应用程序的监控日志输出的访问，此外还有拍摄应用程序截图和视频以及停止和重启进程的选项。\n\n\n\n\n\n## 工具\n\n- **Problems（问题）**：用于查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带您进入该问题所在的文件和位置。\n\
  - **Profiler（性能分析器）**：Android `Profiler` 工具窗口为识别运行应用程序中的性能问题提供实时监控和分析工具，包括 CPU、内存和网络使用情况。当应用程序当前正在运行时，此选项将变为可用。\n\
  - **Project（项目）**：`project` 视图提供了构成项目的文件结构概览，允许在文件之间快速导航。通常情况下，在项目视图中双击文件将导致该文件加载到相应的编辑器工具中。\n\
  - **Resource Manager（资源管理器）**：用于添加和管理项目包含的资源和资产的工具，如图像、颜色和布局文件。\n- **Run（运行）**：当应用程序正在运行时，`run`\
  \ 工具窗口将变为可用，并提供运行结果视图，以及停止或重启运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供与问题相关的诊断信息。\n\
  - **Structure（结构）**：`structure` 工具提供当前编辑器中显示的源文件结构的高级视图。这些信息包括文件中的类、方法和变量等项列表。从结构列表中选择一个项将带您进入编辑器窗口中源文件的对应位置。\n\
  - **Terminal（终端）**：提供对运行 Android Studio 的系统上的终端窗口的访问。在 Windows 系统上，这是 `Command Prompt`（命令提示符）界面，而在\
  \ Linux 和 macOS 系统上，它表现为 `Terminal`（终端）提示符。\n- **TODO**：顾顾名，此工具提供了一个查看项目中尚未完成项的地方。Android\
  \ Studio 通过扫描构成项目的源文件并查找匹配指定 `TODO` 模式的注释来编译此列表。可以通过选择 `File -> Settings…` 菜单选项（macOS\
  \ 为 `Android Studio -> Preferences…`）并导航到 `Editor` 下的 `TODO` 页面来查看和更改这些模式。\n- **Version\
  \ Control（版本控制）**：当项目文件受源代码版本控制管理时，使用此工具窗口，允许访问 `Git` 仓库和代码更改历史。\n\n## 6.4 Android\
  \ Studio 快捷键\n\nAndroid Studio 包含了大量的键盘快捷键，旨在为执行常用任务节省时间。可以通过在 Android Studio 项目窗口中选择\
  \ `Help -> Keymap Reference` 菜单选项来查看并打印完整的键盘快捷键映射列表。您也可以通过选择 `File -> Settings...`\
  \ 菜单选项（macOS 为 `Android Studio -> Preferences...`）并点击下文图 6-8 所示的 `Keymap` 项来列出和修改键盘快捷键：\n\
  \n![](img/as_keymap_settings.jpg)\n\n图 6-8\n\n## 6.5 切换器和最近文件导航\n\n在 Android Studio\
  \ 主窗口内导航的另一种实用机制是使用 `Switcher`（切换器）。通过键盘快捷键 `Ctrl-Tab` 访问切换器，切换器将以面板形式出现，列出所有工具窗口和当前打开的文件（见图\
  \ 6-9]）。\n\n![](img/as_4.2_editor_switcher.jpg)\n\n图 6-9\n\n一旦显示，只要 `Ctrl` 键保持按下状态，切换器就会保持可见。在按住\
  \ `Ctrl` 键的同时反复敲击 `Tab` 键将在不同的选择选项之间循环，而释放 `Ctrl` 键将选中当前高中的项并在主窗口中显示。\n\n除了切换器外，`Recent\
  \ Files`（最近文件）面板还提供了到最近打开文件的导航（见图 6-10]）。可以使用 `Ctrl-E` 键盘快捷键（macOS 为 `Cmd-E`）访问该面板。一旦显示，可以使用鼠标指针选择选项，或使用键盘方向键滚动查看文件名和工具窗口选项。按下\
  \ `Enter` 键将选中当前高中的项。\n\n![](img/android_studio_recent_files.jpg)\n\n图 6-10\n\n\
  ## 6.6 更改 Android Studio 主题\n\nAndroid Studio 环境的主题可以通过欢迎界面上的 `Configure -> Settings`\
  \ 选项，或者通过主窗口的 `File -> Settings…` 菜单选项（macOS 为 `Android Studio -> Preferences…`）进行更改。\n\
  \n一旦显示设置对话框，在左侧面板中选择 `Appearance & Behavior`（外观与行为），然后选择 `Appearance`（外观），然后在点击\
  \ `Apply`（应用）按钮之前更改 `Theme`（主题）的设置。可用主题取决于平台，但通常包括 `Light`、`IntelliJ`、`Windows`、`High\
  \ Contrast` 和 `Darcula` 等选项。图 6-11 显示了选择了 `Darcula` 主题的主窗口示例：\n\n![](img/as_3.6_darcula.jpg)\n\
  \n图 6-11\n\n要将 Android Studio 主题与系统的亮黑暗模式设置同步，请启用 `Sync with OS`（与操作系统同步）选项并使用下拉菜单控制每种模式使用的主题：\n\
  \n![](img/as_theme_configuration.jpg)\n\n图 6-12\n\n## 6.7 总结\n\nAndroid Studio 环境的主要元素由欢迎界面和主窗口组成。每个打开的项目都分配有自己的主窗口，该窗口又由菜单栏、工具栏、编辑和设计区域、状态栏以及一组工具窗口组成。工具窗口出现在窗口的侧边和底部，可以通过状态栏中的快速访问菜单进行访问。\n\
  \nAndroid Studio 中极少的操作是无法通过快捷键触发的。可以随时从 Android Studio 窗口内访问默认快捷键映射。\n\n# 7. 在物理设备上测试\
  \ Android 应用\n\n虽然可以使用 Android 设备 (AVD) 进行测试来完成大部分工作，但在物理设备上进行真实测试是不可替代的，且某些 Android\
  \ 功能仅在物理设备可用。\n\n与 AVD 实例以及连接设备的通信由 Android 调试桥 (`ADB`) 处理。在本章中，我们将解释如何配置 `adb`\
  \ 环境，以便在 macOS、Windows 和 Linux 系统的 Android 设备上进行测试。\n\n## 7.1 Android 调试桥 (ADB)\
  \ 概述\n\n`ADB` 的主要目的是促进开发系统（在此例中为 Android Studio）与 AVD 模拟器以及 Android 设备之间的交互。`ADB`\
  \ 允许通过 WiFi 网络或直接使用 USB 线连接到设备。\n\n`ADB` 由一个客户端、一个在开发系统上后台运行的服务器进程以及一个在 AVD 或真实\
  \ Android 设备上运行的守护进程组成。\n\n\n\n\n\n在 `ADB` 连接到 Android 设备之前，该设备必须先配置为允许连接。在运行 Android\
  \ 6.0 或更高版本的手机和平板设备上，实现此目的的步骤如下：\n\n1. 打开设备上的`Settings”（设置）应用并选择`About tablet”（关于平板电脑）或`About\
  \ phone”（关于手机）选项（在某些 Android 版本中，这可以在`Settings`应用的`System`页面上找到）。\n2. 在`About`屏幕上，向下滚动到`Build\
  \ number`版本号）字段（图 7-1）并连续点击七次，直到出现指示开发者模式已开启的消息。如果 `About`屏幕上没有列出 `Build number`，则可以通过`Software\
  \ information`（软件信息）选项找到。或者，如果可用，展开列表中的`Advanced`（高级）部分。\n\n![](img/as_3.2_build_number.jpg)\n\
  \n图 7-1\n\n3. 返回`Settings`主屏幕，注意此时出现了一个名为`Developer options`（开发者选项）的新选项（在较新版本的 Android\
  \ 中，此选项列在`System`设置屏幕上）。选择此选项，并在生成的屏幕上找到如图 7-2 所示的`USB debugging`选项：\n\n![](img/android_12_enable_debugging.jpg)\n\
  \n图 7-2\n\n4. 启用`USB debugging`选项，并在请求确认时点击`Allow`允许）按钮。\n\n此时，设备已配置为接受来自通过 USB\
  \ 连接的开发系统上的`adb`的调试连接。剩下的工作是配置开发系统以便在设备连接时检测到它。虽然这是一个相对简单的过程，但涉及的步骤取决于开发系统运行的是 Windows、macOS\
  \ 还是 Linux。注意，以下步骤假设`Android SDK platform-tools`目录已包含在操作系统`PATH`环境变量中，正如标题为“Setting\
  \ up an Android Studio Development Environment`所示的对话框，请求许可`Allow USB debugging`允许\
  \ USB 调试）。在点击`OK`之前，勾选`Always allow from this computer`始终允许来自此计算机旁边的复选框。\n\n![](img/Image2856.jpg)\n\
  \n图 7-3\n\n再次执行`adb devices`命令现在会将设备列为可用：\n\n```\nList of devices attached\n015d41d4454bf80c\
  \ device\n```\n\n如果设备未列出，请尝试注销并重新登录 macOS 桌面，如果问题仍然，请重启系统。\n\n### 7.2.2 Windows\
  \ ADB 配置\n\n配置基于 Windows 的开发系统使用`ADB`连接到 Android 设备的第一步是在系统上安装相应的 USB 驱动程序。要安装的\
  \ USB 驱动程序取决于 Android 设备的型号。如果您拥有 Google 设备（如`Pixel`手机），则必须在您的 Windows 系统上安装并配置`Google\
  \ USB Driver`包。实现此目的的详细步骤在以下网页上概述：\n\nhttps://developer.android.com/sdk/win-usb.html\n\
  \n对于`Google USB`驱动程序不支持的 Android 设备，需要下载由设备制造商提供的驱动程序。可以在网上获取驱动程序列表以及下载和安装信息：\n\n\
  https://developer.android.com/tools/extras/oem-usb.html\n\n安装驱动程序且设备现在被识别为正确的设备类型，打开`Command\
  \ Prompt`（命令提示符）窗口并执行以下命令：\n\n```\nadb devices\n```\n\n此命令应输出关于连接设备的信息，类似于：\n\n\
  ```\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备被列为`offline`或`unauthorized`（未授权），请查看设备显示并检查是否存在如图\
  \ 7-3 所示的对话框，请求许可`Allow USB debugging`允许 USB 调试）。在点击`OK`之前，勾选`Always allow from\
  \ this computer`始终允许来自此计算机旁的复选框。再次执行`adb devices`命令现在会将设备列为已就绪：\n\n```\nList of\
  \ devices attached\nHT4CTJT01906 device\n```\n\n如果设备未列出，执行以下命令重启 `ADB` 服务：\n\n```\n\
  adb kill-server\nadb start-server\n```\n\n如果设备仍然未列出，尝试执行以下命令：\n\n```\nandroid update\
  \ adb\n```\n\n注意，可能还需要重启系统。\n\n### 7.2.3 Linux adb 配置\n\n在本章中，我们将再次使用`Ubuntu Linux`作为在\
  \ Linux 上配置`adb`以连接物理 Android 设备的参考示例。\n\n在`Ubuntu`上进行物理设备测试需要安装`android-tools-adb`包，这反过来要求`Android\
  \ Studio`用户是`plugdev`组的成员。这是大多数`Ubuntu`账户的默认设置，可以通过运行`id`命令进行验证。如果没有列出`plugdev`组，请运行以下命令将账户添加到组中：\n\
  \n```\nsudo usermod -aG plugdev $USER\n```\n\n在满足组要求后，可以通过执行以下命令安装`android-tools-adb`包：\n\
  \n```\nsudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启`Ubuntu`系统。系统重启后，打开`Terminal`窗口，启动`adb`服务器并检查设备列表：\n\
  \n```\nadb start-server\n```\n* daemon not running. starting it now on port 5037\
  \ *\n* daemon started successfully *\n\n```\nadb devices\n```\n\n```\nList of devices\
  \ attached\n015d41d454bf0c offline\n```\n\n如果设备被列为`offline`或`unauthorized`，请前往 Android\
  \ 设备并检查如图 7-3 所示的对话框，请求许可`Allow USB debugging`允许 USB 调试）。\n\n### 7.3 解决 USB 连接问题\n\
  \n如果您无法通过上述步骤成功连接到设备，显示运行目标菜单（图 7-4）并选择`Trouhoot Device Connections`（设备设备连接）选项：\n\
  \n![](img/as_pair_devices_troubleshooting.jpg)\n\n图 7-4\n\n连接助手将扫描设备并报告问题和解决方案\n\
  \n### 7.4 在 Android 设备上启用无线调试\n\n遵循上述 7.2 节的步骤 1 到 3，这次是启用如图 7-5 所示的`Wireless debugging`（无线调试）选项：\n\
  \n![](img/android_12_enable_debugging.jpg)\n\n图 7-5\n\n接下来，点击上述`Wireless debugging`项显示如图\
  \ 7-6 所示的屏幕：\n\n![](img/android_12_enable_wifi_debugging_settings.jpg)\n\n图 7-6\n\
  \n如果您使用的设备带有相机，选择`Pair device with QR code`（通过二维码配对设备），否则选择`Pair device with pairing\
  \ code`（通过配对码配对设备）。根据您的选择，`Settings`应用将启动相机会话或显示配对码，如图 7-7 所示：\n\n![](img/as_pair_devices_code.jpg)\n\
  \n图 7-7\n\n选择一个选项后，返回`Android Studio`并在运行目标菜单中选择`Pair Devices Using WiFi`（通过 WiFi\
  \ 配对设备）选项，如图 7-8 所示：\n\n\n\n\n\n![](img/as_pair_devices_wifi_menu.jpg)\n\n图 7-8\n\
  \n在配对对话框中，根据您之前在设备“设置”应用中的选择，选择“使用二维码配对”或“使用配对码配对”：\n\n![](img/as_pair_devices_qr_code.jpg)\n\
  \n图 7-9\n\n使用 Android 设备扫描二维码，或将设备屏幕上显示的配对码输入到 Android Studio 对话框（参见图 7-10），以完成配对过程：\n\
  \n![](img/as_pair_devices_wifi_enter_code.jpg)\n\n图 7-10\n\n如果配对过程失败，请尝试重启开发系统和\
  \ Android 设备并重试。\n\n## 7.5 测试 `adb` 连接\n\n假设在所选的开发平台上已成功配置了 `adb`，下一步是尝试在设备上运行在\
  \ Android Studio 中创建示例 Android 应用章节中创建的测试应用程序。启动 Android Studio，打开 `AndroidSample`\
  \ 项目，并验证设备是否出现在设备选择菜单中（如图 7-11 所示）：\n\n![](img/android_12_device_in_menu_scaled.jpg)\n\
  \n图 7-11\n\n从列表中选择设备，并点击运行按钮（位于设备菜单正右侧的绿色箭头按钮）来安装并运行应用程序。\n\n## 7.6 总结\n\n虽然 Android\
  \ 虚拟设备（AVD）模拟器提供了一个良好的测试环境，但请记住，确保应用程序在物理 Android 设备上正常运行没有真正的替代方案。毕竟，这才是应用程序在现实世界中使用的地方。\n\
  \n然而，默认情况下，Android Studio 环境未配置为将 Android 设备视为目标测试设备。因此，必须执行某些步骤，以便能够在 Android Studio\
  \ 开发环境中通过 USB 线或 WiFi 网络直接将应用程序加载到 Android 设备上。实现此目标的具体步骤取决于所使用的开发平台。在本章中，我们涵盖了适用于\
  \ Linux、macOS 和基于 Windows 平台的这些步骤。\n\n## 8. Android Studio 代码编辑器基础知识\n\n为 Android\
  \ 开发应用程序涉及大量的编程工作，根据定义，这涉及到代码行的输入、审查和修改。开发者在使用 Android Studio 时的大部分时间通常都在编辑器窗口内编辑代码，这并不令人意外。\n\
  \n现代代码编辑器需要远超最初的输入、删除、剪切和粘贴等功能。如今，代码编辑器的实用性通常由等因素衡量，例如它在多程度上减少了程序员所需的输入量、在大型源文件中导航的易用性，以及编辑器在编写代码时实时检测并突出编程错误的能力。正如本章将变得的那样，这些只是\
  \ Android Studio 编辑器出色的少数领域之一。\n\n虽然本章不是 Android Studio 编辑器功能的详尽概述，但其目的是提供该工具关键功能的指南。丰富的程序员会发现，这些功能中的某些是目前大多数代码编辑器通用的，而许多许多是该特定编辑环境独有的。\n\
  \n## 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio 编辑器会出现在主窗口中央。例如，图\
  \ 8-1 显示了一个加载了 Java 源代码文件的典型编辑器会话：\n\n![](img/as_code_editor_labelled.jpg)\n\n图\
  \ 8-1\n\n构成编辑器窗口的元素可以总结如下：\n\n**A – 文档标签页 (Document Tabs)** – Android Studio 能够同时打开多个文件进行编辑。每打开一个文件时，它都会被分配一个文档标签页，在编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签页时，标签栏的最右侧会出现一个很小的下拉菜单。点击此菜单将列出其他已打开的文件列表。标签页中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，在项目可以编译和运行之前，需要解决这些错误。\n\
  \n在文件之间切换只需点击相应的标签页，或使用 `Alt-Left` 和 `Alt-Right` 键盘快捷键。也可以使用 `Switcher` 机制（通过 `Ctrl-Tab`\
  \ 键盘快捷键访问）进行文件间的导航。\n\n要将编辑器面板从 Android Studio 主窗口中分离并使其在单独窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。如需将编辑器返回主窗口，请点击分离的编辑器窗口中的文件标签，并将其拖放到主窗口中原始的编辑器标签栏上。\n\
  \n**B – 编辑器行边区域 (Editor Gutter Area)** – 编辑器使用行边区域显示信息图标和控件。显示在此行边区域的一些典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过在行边处点击右键并选择\
  \ `Show Line Numbers`（显示行号）菜单选项来禁用。\n\n**C – 代码结构位置 (Code Structure Location)**\
  \ – 编辑器顶部的此栏显示光标当前位置相对于代码整体结构的情况。例如，在后续图中，该栏表示正在编辑 `convertCurrency` 方法，且该方法包含在\
  \ `MainActivity` 类中。\n\n![](img/as_4.2_code_location.jpg)\n\n图 8-2\n\n双击栏内的元素会将光标移动到代码中的相应位置。例如，双击\
  \ `convertCurrency` 条目将光标移动到该方法的顶部。同样，点击 `MainActivity` 条目将弹出一个供选择的代码导航点列表：\n\n\
  ![](img/as_4.2_code_location_menu.jpg)\n\n图 8-3\n\n**D – 编辑器区域 (Editor Area)** –\
  \ 这是用户显示、输入和编辑代码的主要区域。本章的后续部分将详细介绍编辑区域的关键功能。\n\n**E – 验证与标记侧边栏 (Validation and Marker\
  \ Sidebar)** – Android Studio 引入了称为“实时代码分析”的功能。这实际上意味着当你输入代码时，编辑器正在分析代码以检查警告和语法错误。验证侧边栏顶部的指示器实时更新，指示添加代码时发现的错误和警告数量。点击此指示器将显示一个包含编辑器代码问题摘要的弹出窗口，如图\
  \ 8-4 所示：\n\n![](img/as_4.2_code_editor_warning_errors.jpg)\n\n图 8-4\n\n可以使用向上向下箭头在代码中的错误位置之间移动。绿色勾钩表示未检测到警告或错误。\n\
  \n侧边栏还在检测到问题的位置显示标记，并使用相同的颜色编码。当代码行在编辑器区域可见时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口：\n\n![](img/as_warning_box.jpg)\n\
  \n图 8-5\n\n\n\n\n\n将鼠标指针悬停在当前滚动出编辑器可视区域的行行标记上，将显示一个“透镜（lens）”覆盖层，该层包含问题所在的代码块（见图\
  \ 8-6），从而无需滚动到编辑器中的该位置即可查看它：\n\n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分都会出现一个透镜，其中包含源文件中对应位置的代码。\n\
  \n### F – 状态栏\n\n虽然状态栏实际上是主窗口的一部分，而不是编辑器，但它确实包含了一些关于当前活动编辑会话的信息。这些信息包括光标在行和字符维度的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示“转到行”（Go to Line）对话框。\n\n在概述构成 Android Studio\
  \ 编辑器的元素后，本章的剩余部分将更详细地探讨编辑环境的关键特性。\n\n## 8.2 分割编辑器窗口\n\n默认情况下，编辑器将显示一个显示当前选中文件内容的面板。在同时处理多个源文件时，一个特别实用的功能是将编辑器拆分为多个窗格。要分割编辑器，右键点击编辑器窗口内的文件标签页，然后选择`垂直分割`(Split\
  \ Vertically)或`水平分割`(Split Horizontally)菜单选项。例如，图 8-7 显示了拆分器的工作状态，编辑器被分为三个面板：\n\n\
  ![](img/Image2467.jpg)\n\n图 8-7\n\n可以通过右键点击相应的标签并选择`更改拆分器方向`(Change Splitter Orientation)菜单选项来随时更改分割面板的方向。重复这些步骤可以取消单个面板的分割，此时从菜单中选择`取消分割`(Unsplit)选项。可以通过右键点击任何标签并选择`取消所有分割`(Unsplit\
  \ All)选项来移除所有分割面板。\n\n窗口分割可显示不同的文件，或为同一个文件提供多个窗口，允许并发查看和编辑同一文件的不同区域。\n\n## 8.3 代码补全\n\
  \nAndroid Studio 编辑器对 Java 编程语法以及构成 Android SDK 的类和方法拥有大量的内置知识，同时也对你自己的代码库有了解。在输入代码时，编辑器会扫描正在输入的内容，并在适当的情况下提供关于完成语句或引用可能需要的内容的建议。当编辑器检测到补全建议时，将出现一个包含建议列表的面板。例如，在图\
  \ 8-8 中，编辑器正为 `String` 声明的开头提供可能的候选项：\n\n![](img/Image2477.jpg)\n\n图 8-8\n\n如果没有任何自动补全建议是正确的，只需继续输入，编辑器将继续在适当的地方精炼建议。要采纳最顶部的建议，只需按下键盘上的\
  \ `Enter` 或 `Tab` 键。要选择不同的建议，使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键选中高亮显示的项。\n\n可以使用\
  \ `Ctrl-Space` 组合键手动调出补全建议。这在更改编辑器中的单词或声明时非常有用。当光标置于编辑器中的某个单词上时，该单词将自动高亮。按下 `Ctrl-Space`\
  \ 将显示备选建议列表。要将当前单词替换为建议列表中当前高亮的项，只需按下 `Tab` 键。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供名为“智能补全”（Smart\
  \ Completion）的系统。智能补全使用`Shift-Ctrl-Space`组合键调用，选中后根据代码的当前上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space`\
  \ 快捷键将从更广泛的范围内提供更多建议。\n\n代码补全对许多程序员来说可能是个人偏好。由于这一事实，Android Studio 对自动补全设置提供了很高的控制权限。可以通过选择`File\
  \ -> Settings…`菜单选项（macOS 上的 `Android Studio -> Preferences…`）并在设置面板中选择 `Editor\
  \ -> General -> Code Completion` 来查看和修改这些设置，如图 8-9 所示：\n\n![](img/as_3.6_code_completion_preferences.jpg)\n\
  \n图 8-9\n\n## 8.4 语句补全\n\nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以自动填充方法和循环语句等项的括号和花括号。语句补全使用`Shift-Ctrl-Enter`（macOS\
  \ 上的 `Shift-Cmd-Enter`）组合键调用。考虑以下代码：\n\n```\nmyMethod()\n```\n\n在编辑器中输入此代码后，触发语句补全将导致编辑器自动为方法添加大括号：\n\
  \n```\nmyMethod() {\n\n}\n```\n\n## 8.5 参数信息\n\n还可以请求编辑器提供关于方法接受的参数参数的信息。当光标置于方法调用括号之间时，`Ctrl-P`（macOS\
  \ 上的 `Cmd-P`）组合键将显示已知该方法接受的参数：\n\n![](img/Image2491.jpg)\n\n图 8-10\n\n## 8.6 参数提示\n\
  \n代码编辑器可以配置为在方法调用显示参数名称提示。例如，图 8-11 高亮了 `Snackbar` 类`make()` 和 `setAction()` 方法调用中的参数名称提示：\n\
  \n![](img/Image2499.jpg)\n\n图 8-11\n\n此模式的设置可以通过选择`File -> Settings`（macOS 上的`Preferences`）选项，然后在左侧面板中选择`Editor\
  \ -> Inlay Hints -> Java`来配置。在结果屏幕上，从列表中选择`Parameter Hints`并启用或禁用`Show parameter\
  \ hints`选项。要调整提示设置，点击`Exclude list...`链接并进行任何调整。\n\n## 8.7 代码生成\n\n除了输入代码时进行补全，编辑器在某些情况下还可以为你生成代码。图\
  \ 8-12 所示的可用代码生成列表可以在光标位于文件中代码生成位置时使用`Alt-Insert`（macOS 上的 `Cmd-N`）快捷键访问。\n\n![](img/as_3.4_code_editor_generate.jpg)\n\
  \n图 8-12\n\n作为示例，考虑我们需要在项目的 `Activity` 被操作系统销毁时收到通知的情况。正如本书后续章节概述的，这可以通过重写`Activity`\
  \ 超类的`onStop()` 生命周期方法来实现。要让 Android Studio 为此生成存根方法，只需从代码生成列表中选择`Override Methods…`选项，然后从可用方法列表中选择`onStop()`方法：\n\
  \n![](img/as_3.6_override_methods.jpg)\n\n图 8-13\n\n选择了要重写的方法后，点击 OK 将 Java 源文件的当前光标位置生成存根，如下：\n\
  \n```java\n@Override\nprotected void onStop() {\n       super.onStop();\n}\n```\n\
  \n## 8.8 代码折叠\n\n\n\n\n当源代码文件达到一定大小时，即使是格式最精谨、组织良好的代码也可能变得难以从和和难以导航。Android Studio\
  \ 认为，并不总是需要让每个代码块的内容始终可见。通过使用 Android Studio 编辑器的代码折叠（code folding）功能，可以使代码导航更容易。代码折叠通过位于源文件中编辑器行槽（gutter）中每个代码块开头和结尾的标记来控制。例如图\
  \ 8-14 突出了当前未折叠的方法声明的开始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n\n图 8-14\n\
  \n点击这些标记中的任意一个都会折叠语句，使得仅签名行可见，如图 8-15 所示：\n\n![](img/Image2533.jpg)\n\n图 8-15\n\n\
  要展开已折叠的代码段，只需点击编辑器行槽中的 `+` 标记。若要在不展开代码的情况下查看隐藏代码，请将鼠标指针悬停在 `{{…}` 指示上，如图 8-16 所示。编辑器将显示包含折叠代码块的透镜叠加：\n\
  \n![](img/Image2540.jpg)\n\n图 8-16\n\n文件中的所有代码块可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus`\
  \ 键盘序列进行折叠或展开。\n\n默认情况下，Android Studio 编辑器在打开源文件时会自动折叠某些代码。要配置发生这种情况的情况，请选择 `File`\
  \ -> `Settings…`（macOS 上为 `Android Studio` -> `Preferences…`）并在生成的设置面板中选择 `Editor`\
  \ -> `General` -> `Code Folding` 项（图 8-17）：\n\n![](img/as_3.6_code_folding_preferences.jpg)\n\
  \n图 8-17\n\n### 8.9 快速文档查询\n\n通过将光标置在需要文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），可以访问上下文敏感的\
  \ Java 和 Android 文档。这将显示一个包含该项目相关参考文档的弹出窗口。例如图 8-18 显示了 Android `FloatingActionButton`\
  \ 类的文档。\n\n![](img/Image2557.jpg)\n\n图 8-18\n\n显示后，可以根据需要可以在屏幕上移动文档弹出窗口。\n\n###\
  \ 8.10 代码重格式化\n\n通常，Android Studio 编辑器会在添加代码时自动根据缩进、间距以及语句和代码块的嵌套对代码进行格式化。在需要重新格式化代码的情况下（这很常见，例如从网站复制并粘贴示例代码时），编辑器提供了源代码重格式化功能，选中后它将自动重新格式化代码以匹配主流的代码风格。\n\
  \n要重新格式化源代码，请按 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键序列。要显示重格式化代码对话框（图 8-19），使用 `Ctrl-Alt-Shift-L`（macOS\
  \ 上为 `Cmd-Opt-Shift-L`）。此对话框提供了仅重新格式化当前选中的代码、编辑器中当前活动的整个源文件或仅重新格式化由于源代码控制更新而更改代码的选项。\n\
  \n![](img/as_reformat_dialog.jpg)\n\n图 8-19\n\n全范围的代码风格偏好可以在项目设置对话框中进行更改。选择 `File`\
  \ -> `Settings` 菜单选项（macOS 上为 `Android Studio` -> `Preferences…`）并在左侧面板中选择 `Code\
  \ Style` 以访问支持的编程和标记语言列表。选择一种语言将提供大量的格式化样式选项，所有选项都可以从 Android Studio 默认值进行修改以匹配你偏好的代码风格。例如，要配置上述对话框中\
  \ `Rearrange` 代码选项的设置，请展开 `Code Style` 部分，选择 `Java`，并从 `Java` 设置中选择 `Arrangement`\
  \ 选项。\n\n### 8.11 查找示例代码\n\nAndroid Studio 编辑器提供了一种访问与代码列表中当前高亮条目相关的示例代码的方法。这对于学习如何使用特定的\
  \ Android 类或方法非常有用。要查找示例代码，在编辑器中高亮方法或类名，右键点击它并选择 `Find Sample Code` 菜单选项。Find Sample\
  \ Code 面（图 8-20）将出现在编辑器下方，列出匹配的示例。从列表中选择一个示例将把相应的代码加载到右侧面板：\n\n![](img/Image2571.jpg)\n\
  \n图 8-20\n\n### 8.12 实时模板 (Live Templates)\n\n在编写 Android 代码时，你会发现有一些经常使用的常用结构。例如，一个常见需求是使用\
  \ Android `Toast` 类向用户显示弹出消息。实时模板是常用代码结构的集合，可以通过在编辑器中输入初始字符后跟一个特殊键（默认设置为 `Tab` 键）来插入模板代码。要体验这种效果，请在代码编辑器中输入\
  \ `toast` 然后按 `Tab` 键，Android Studio 将插入：\n\n```\nToast.makeText(\"\", Toast.LENGTH_SHORT).show();\n\
  ```\n\n要列出并编辑模板、更改特殊键或添加自己的模板，打开 `Preferences` 对话框并在 `Editor` 部分中选择 `Live Templates`：\n\
  \n![](img/as_4.0_live_templates.jpg)\n\n图 8-21\n\n使用图 8-21 上方的按钮添加、删除或重置模板。要修改模板，从列表\
  \ (B) 中选择并更改 C 面中的设置。\n\n### 8.13 总结\n\nAndroid Studio 编辑器极力减少编写代码所需的打字量。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器分屏、代码折叠、重格式化、文档查询和实时模板。\n\
  \n# 9 Android 架构概述\n\n到目前为止，本书已经设置了适用于使用 Android Studio 开发 Android 应用的环境。通过创建 Android\
  \ Studio 应用项目，也迈出了应用开发的第一步。\n\n然而，在进一步探讨 Android 应用开发的实际问题之前，了解 Android SDK 和通用\
  \ Android 开发的一些更抽象的概念是重要的。现在清晰理解这些概念将为后续学习奠定良好基础。\n\n从本章对 Android 架构的概述开始，并在接下来的章节中继续，目标是提供\
  \ Android 开发基础的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid 以软件栈的形式结构化，由应用程序、操作系统、运行环境、中间层、服务和库组成。这种架构或许最好通过图\
  \ 9-1 所示进行视觉化表示。栈的每一层以及每层中的相应元素都紧密集成并经过仔细调整，为移动设备提供最佳的应用开发和执行环境。本章的其余部分将介绍 Android\
  \ 栈的不同层，从底部的 Linux 内核开始。\n\n## 9.2 Linux 内核\n\n\n\n\nLinux 内核位于 Android 软件栈的底部，在设备硬件与\
  \ Android 软件栈上层之间提供了抽象层。内核基于 Linux `2.6` 版本，提供了抢占式多任务处理，以及内存、进程和电源管理等低级核心系统服务，还为显示器、WIFI\
  \ 和音频等硬件提供了网络栈和设备驱动程序。\n\n原始的 Linux 内核由 Linus Torvalds（林纳·托瓦兹）于 1991 年开发，并与自由软件基金理查德·斯托曼（Richard\
  \ Stallman）开发的系列工具、实用程序和编译器相结合，形成了名为 `GNU/Linux` 的完整操作系统。Ubuntu 和 Red Hat Enterprise\
  \ Linux 等各种 Linux 发行版都是基于这些基础衍生而来的。\n\n然而，重要的是，Android 仅使用 Linux 内核。尽管如此，值得注意的是，Linux\
  \ 内核最初是为桌面电脑和服务器形式的传统计算机设计的。事实上，Linux 现在最广泛地部署在任务关键型企业服务器环境中。我们能在 Android 软件栈的核心发现这种软件，这既证明了今天移动设备的强大，也证明了\
  \ Linux 内核的效率和性能。\n\n## 9.3 Android Runtime – ART\n\n当在 Android Studio 中构建 Android\
  \ 应用时，它会被编译为中间字节码格式（称为 `DEX` 格式）。当应用程序随后加载到设备时，Android 运行时（`ART`）使用称为提前编译（Ahead-of-Time\
  \ `AOT`）的过程将字节码翻译为设备处理器所需的本地指令。这种格式被称为可执行和链接格式（`ELF`）。\n\n之后每次启动应用程序时都会运行 `ELF`\
  \ 可执行版本，从而获得更快的应用程序性能和更高的电池寿命。\n\n这与旧版 Android 实现中使用的即时编译（Just-in-Time `JIT`）方法形成对比，后者在每次启动应用程序时都在虚拟机（`VM`）内部翻译字节码。\n\
  \n## 9.4 Android Libraries\n\n除了一组标准的 Java 开发库（提供对字符串处理、网络和文件操作等通用任务的支持）外，Android\
  \ 开发环境还包含 Android 库。这些是特定 Android 开发的 Java 库。此类库的示例包括应用程序框架库，以及促进用户界面构建、图形绘制和数据库访问的库。\n\
  \nAndroid 开发者可以使用的一些关键核心 Android 库摘要如下：\n\n- `android.app` – 提供对应用模型的访问，是所有 Android\
  \ 应用的基石。\n- `android.content` – 应用程序与应用组件之间的内容访问、发布和消息传递。\n- `android.database`\
  \ – 用于访问内容提供发布发布，， `SQLiteSQLite  管理类。\n- `android.graphics` – 一种低级 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n\
  - `android.hardware` – 提供一个对加速度计和光传感器等硬件进行访问的 API。\n- `android.opengl` – 指向 `OpenGL\
  \ ES` 3D 图形渲染 API 的 Java 接口。\n- `android.os` – 为应用程序提供标准操作系统的服务的访问，包括消息、系统服务和进程间通信。\n\
  - `android.media` – 提供启用音频和视频播放的类。\n- `android.net` – 一组访问网络栈的 API。包括 `android.net.wifi`，它提供了对设备无线栈的访问。\n\
  - `android.print` – 包括一组类，允许从 Android 应用内部将内容发送到配置的打印机。\n- `android.provider` –\
  \ 一组便利类，提供对标准 Android 内容提供者数据库的访问，例如日历和联系人应用维护的数据库。\n- `android.text` – 用于在设备显示上渲染和处理文本。\n\
  - `android.util` – 一组用于执行任务的实用类，如字符串和数字转换、XML 处理以及日期时间处理。\n- `android.view` – 应用程序用户界面的基础构建块。\n\
  - `android.widget` - 丰富的内置用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在在应用程序中构建网络浏览功能的类。\n\n在涵盖了 Android 运行时基于 Java 的库之后，现在是我们将转向 Android 软件栈这一层包含的基于\
  \ C/C++ 的库了。\n\n### 9.4.1 C/C++ 库\n\n在前节概述的 Android 运行时核心库是基于 Java 的，为编写 Android\
  \ 应用的开发者提供了主要的 API。然而，重要的是，核心库并没有执行大部分实际工作，事实上，它们本质上是对基于 C/C++ 的库的 Java “包装器”。例如，在调用\
  \ `android.opengl` 库在设备显示上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++ 库，该库反过来与底层 Linux 内核协作执行绘制任务。\n\
  \n包含 C/C++ 库是为了满足广泛多样的功能，包括 2D 和 3D 图形绘制、安全套接层（`SSL`）通信、`SQLite` 数据库管理、音频视频播放、位图和矢量字体渲染、显示系统和图形层管理以及标准\
  \ C 系统库（`libc`）的实现。\n\n典型的 Android 应用开发者仅通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用\
  \ Android Native 开发包（`NDK`），其目的是通过 Java 接口（`JNI`）在 Java 代码中调用非 Java 或 Kotlin 编程语言（如\
  \ `C` 和 `C++`）的本地方法。\n\n## 9.5 Application Framework\n\n应用程序框架是一系列共同构成 Android 应用运行和管理环境的服务。该框架实现了\
  \ Android 应用由可重用、可交换和可替换组件构建的概念。这一概念更进一步，应用程序还可以发布其功能以及相应的数据，以便其他应用程序发现和重用。\n\n\
  Android 框架包含以下关键服务：\n\n- `Activity Manager` – 控制应用程序生命周期和活动栈的所有方面。\n- `Content Providers`\
  \ – 允许应用程序发布并共享数据。\n- `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n- `Notifications\
  \ Manager` – 允许应用程序向用户显示警和通知。\n- `View System` – 用于应用程序用户界面的扩展视图集。\n- `Package Manager`\
  \ – 应用程序用于查找设备上当前安装的其他应用程序信息的系统。\n- `Telephony Manager` – 为应用程序提供有关设备可用电话服务的信息，例如状态和订阅者信息。\n\
  - `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\n## 9.6 Applications\n\n\n\n\
  \n\n应用程序位于 Android 软件栈的顶端。这些应用程序包含了特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序。\n\
  \n## 9.7 总结\n\n良好的 Android 开发知识基础要求对 Android 的整体架构有理解。Android 以软件栈架构的形式实现，由 Linux\
  \ 内核、运行时环境及相应的库、应用程序框架以及一组应用程序组成。应用程序主要使用 Java 或 Kotlin 编写，并在 Android Studio 构建环境中编译为字节码格式。当应用程序随后安装到设备上时，这些字节码将由\
  \ Android 运行时（`ART`）编译为 CPU 使用的本地格式。Android 架构的关键目标是性能和效率，这都体现在应用程序执行以及应用程序设计中的复用实现中。\n\
  \n## 10. Android 应用程序剖析\n\n无论你之前的编程经验如何（无论是基于 Windows、macOS、Linux 甚至是 iOS），Android\
  \ 开发很有可能与你之前遇到过的任何东西都大相同。\n\n因此，本章的目的是提供对 Android 应用程序架构背后高层概念的理解。在此，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协同工作以创建一个一致应用程序的机制。\n\
  \n## 10.1 Android Activity（活动）\n\n熟悉 Java、Kotlin、C++ 或 C# 等面向对象编程语言的人，会对将应用程序功能元素封装在类中，然后将其实例化为对象并进行操作以创建应用程序的概念熟悉。由于\
  \ Android 应用程序是用 Java 和 Kotlin 编写的，情况仍然如此。然而，Android 还将将复用组件的概念提升到了更高的水平。\n\nAndroid\
  \ 应用程序通过组合一个或多个被称为 Activity 的组件创建。Activity 是一个单一、独立的应用程序功能模块，通常直接对应于单个用户界面及其相应的功能。例如，一个预约应用程序可能会有一个\
  \ Activity 屏幕，显示当天设置的预约。该应用程序还可能使用第二个 Activity，其由一个用户可以在其中输入新预约的屏幕。\n\nActivity\
  \ 被设计为完全可复用且可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的 Activity。开发者可能正在编写一个应用程序，该程序也有发送电子邮件消息的需求。开发者无需为新应用程序专门开发一个邮件编写\
  \ Activity，而可以直接使用现有电子邮件应用程序中的 Activity。\n\nActivity 是作为 `Android Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他\
  \ Activity。换句话说，共享的 Activity 不能依赖在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个\
  \ Activity 不能直接调用另一个 Activity 的方法或访问其实例数据。相反，这是通过 Intent（意图）和 Content Provider（内容提供者）实现的。\n\
  \n默认情况下，Activity 不能向调用它的 Activity 返回结果。如果需要此功能，则必须将该 Activity 特别启动为源 Activity 的子\
  \ Activity。\n\n## 10.2 Android Fragment（片段）\n\n如上所述，Activity 通常代表应用中的单个用户界面屏幕。一种方案是使用单一的用户界面布局和一个相应的\
  \ Activity 类文件来构建该 Activity。然而，更好的替代方案是将 Activity 拆分为不同的部分。这些部分中的每一个部分都被称为 Fragment，每个\
  \ Fragment 都由用户界面布局的一部分和一个匹配的类文件（声明为 `Android Fragment` 类的子类）组成。在这种情况下，Activity\
  \ 仅仅变成了一个容器，其中嵌入了一个或多个 Fragment。\n\n事实上，Fragment 为每个用户界面屏幕由单独的 Activity 表示提供了一种高效的替代方案。相反，一个应用由单个\
  \ Activity 组成，并在不同的 Fragment 之间切换，每个 Fragment 代表一个不同的应用屏幕。\n\n## 10.3 Android Intent（意图）\n\
  \nIntent 是一个 Activity 启动另一个 Activity 并实现构成应用程序的 Activity 之间流的机制。Intent 由对要执行的操作的描述以及可选的要执行该操作的数据组成。\n\
  \nIntent 可以是显式的（explicit），即通过通过类名引用 Activity 来请求启动特定的 Activity；也可以是隐式的（implicit），即通过说明要执行的操作类型或提供执行该操作的特定类型的数据。在隐式\
  \ Intent 的情况下，Android 运行时将使用称为 Intent Resolution（Intent 解析）的过程，选择与 `Intent` 所指定的标准最匹配的\
  \ Activity 进行启动。\n\n## 10.4 Broadcast Intent（广播意图）\n\n另一种类型的 Intent 是广播意图（Broadcast\
  \ Intent），它是系统级的意图，发送给所有注册了“感兴趣”广播接收器（Broadcast Receiver）的应用程序。例如，Android 系统通常会发送广播\
  \ Intent 来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\n广播 Intent 可以是普通的（异步的），因为它在几乎相同的时间内发送给所有感兴趣的广播接收器；也可以是有序的，因为它一次向一个接收器发送，接收器处理后可以被中止，也可以允许传递给下一个广播接收器。\n\
  \n## 10.5 Broadcast Receivers（广播接收器）\n\n广播接收器是应用程序响应广播 Intent 的机制。广播接收器必须由应用程序注册，并配置\
  \ `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当广播匹配的意图时，无论注册接收器的应用程序当前是否运行，Android 运行时都会调用该接收器。接收器有\
  \ 5 秒钟来完成其所需的任何任务（例如启动 Service、更新数据或向用户发出通知），然后返回。广播接收器在后台运行，没有用户界面。\n\n### 10.6\
  \ Android Services（服务）\n\nAndroid Services 是在后台运行且没有用户界面的进程。它们可以从 Activity、广播接收器或其他\
  \ Service 启动并随后进行管理。Android Services 适用于应用程序需要继续执行任务但不一定需要向用户可见的用户界面的情况。虽然 Service\
  \ 缺乏用户界面，但它们仍然可以使用通知（notifications）和 Toast（在屏幕上出现且不中断当前可见 Activity 的小型通知消息）通知用户事件，并能够发布\
  \ Intent。\n\n\n\nAndroid 运行时赋予服务的优先级高于许多其他进程，系统只有在需要释放资源的最后手段情况下，才会将其终止。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦足够的资源再次可用，它将自动重启。`Service` 可以通过声明自己为在前台运行来降低被终止的风险。这通过调用 `startForeground()`\
  \ 实现。这仅建议用于终止会对用户体验产生不利的情况（例如，如果用户正在收听由 `Service` 流出的音频）。\n\n`Service` 可能作为实际解决方案的示例情况包括（如前提到的）：应用程序不再活跃时仍继续播放的音频流，或者需要在股票达到指定价格时通知用户的股票跟踪应用程序。\n\
  \n## 10.7 内容提供者 (Content Providers)\n\nContent Providers 实现了一种应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ Content Provider 向其他应用程序提供对其底层数据的访问权限，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 Content\
  \ Provider 定义的通用资源标识符 (`URI`) 提供。数据可以以文件或整个 SQLite 数据库的形式进行共享。\n\n原生 Android 应用程序包含许多标准\
  \ Content Providers，允许应用程序访问联系人和媒体文件等数据。当前 Android 系统上提供的 Content Providers 可以使用\
  \ `Content Resolver` 定位。\n\n## 10.8 应用程序清单 (The Application Manifest)\n\n将组成应用程序的各种元素结合在一起的是应用程序清单文件。在这个基于\
  \ XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供和权限。\n\n## 10.9 应用程序资源 (Application Resources)\n\
  \n除了清单文件和包含字节码的 Dex 文件外，Android 应用程序包通常还包含一组资源文件。这些文件包含了用户界面中显示的字符串、图像、字体和颜色等资源，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层级结构的 `/res` 子目录中。\n\n## 10.10 应用程序上下文 (Application\
  \ Context)\n\n当应用程序被编译时，会创建一个名为 `R` 的类，其中包含对应用程序资源的引用。应用程序清单文件和这些资源结合创建了所谓的应用程序上下文（Application\
  \ Context）。该上下文由 `Android Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文中调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 总结 (Summary)\n\n可以将许多不同的元素结合在一起创建一个 Android 应用程序。在本章中，我们提供了活动 (Activities)、片段\
  \ (Fragments)、服务 (Services)、意图 (Intents) 和广播接收器 (Broadcast Receivers) 的概述，以及清单文件和应用程序资源的概述。\n\
  \n通过创建活动和意图形式的独立功能模块可以促进最大的重用和操作性，而应用程序之间的数据共享通过实现内容提供来实现。\n\n活动专注于用户与应用程序交互的区域（活动本质等同于单个用户界面屏幕，通常由一个或多个片段组成），而后台处理通常由服务和广播接收器处理。\n\
  \n构成应用程序的组件在清单文件中为 Android 运行时系统进行了概述，该文件结合应用程序资源代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。不过，请放心，在随后的章节中将对这些概念进行广泛的探索和实际应用，以确保为构建自己的应用程序奠定坚实的知识基础。\n\
  \n## 11. Android 视图绑定概述 (An Overview of Android View Binding)\n\n开发 Android 应用程序的一个重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的可用选项，特别强调一种被称为视图绑定（view\
  \ binding）的选项。一旦涵盖了视图绑定的基础，本章将概述将 AndroidSample 项目转换为使用此方法所需的更改。\n\n### 11.1 通过\
  \ ID 查找视图 (Find View by Id)\n\n正如在“Android 应用程序剖析”章节中概述的，构成应用程序的所有资源都被编译成一个名为 `R`\
  \ 的类。这些资源中包含了定义布局的资源。`R` 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如当读取在\
  \ `EditText` 视图中输入的值或更改在 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 引入之前，从应用代码访问视图的唯一选项是编写代码，通过\
  \ `findViewById()` 方法根据其 id 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性了。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过\
  \ id 查找视图仍然是一个可行的选项，但它具有一些局限性，`findViewById()` 的最大缺点是可能会获取到一个尚未在布局中创建的视图引用，导致在尝试访问视图属性时抛出空指针异常。\n\
  \n自 Android Studio 3.6 以来，以视图绑定的形式提供了另一种从应用代码访问视图的方法。\n\n## 11.2 视图绑定 (View Binding)\n\
  \n当应用模块中启用视图绑定时，Android Studio 会自动为模块中的每个布局文件生成一个绑定类。使用此绑定类，可以在代码内部访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称是基于布局文件名转换为所谓的“驼峰命名”（camel case）并在末尾加上“Binding”字。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命名为 `ActivityMainBinding`。\n\nAndroid Studio Dolphin\
  \ 在项目模板中使用视图绑定的情况并不一致。例如，我们创建 AndroidSample 项目时使用的空活动模板没有使用视图绑定。另一方面，基础活动模板是使用视图绑定实现的。如果你使用了不使用视图绑定的模板，了解如何将该项目迁移并弃合成属性（synthetic\
  \ properties）是重要的。\n\n### 11.3 转换 AndroidSample 项目 (Converting the AndroidSample\
  \ project)\n\n在本章的剩余部分中，我们将通过将 AndroidSample 项目转换为使用视图绑定代替使用 `findViewById()` 来练习迁移。\n\
  \n首先启动 Android Studio 并打开在“在 Android Studio 中创建 Android 应用”章节中创建的 AndroidSample\
  \ 项目。\n\n## 11.4 启用视图绑定 (Enabling View Binding)\n\n\n\n\n要使用 `view binding`，必须首先对每个需要\
  \ view binding 的模块的 `build.gradle` 文件进行更改。在 `AndroidSample` 项目中，这需要对 `Gradle Scripts\
  \ -> build.gradle (Module: AndroidSample.app)` 文件进行细微更改。将此文件加载到编辑器中，找到 `android`\
  \ 部分并添加如下项以启用 `viewBinding` 属性：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n\
  完成此更改后，点击编辑器面板顶部的 `Sync Now` 链接，然后使用 `Build` 菜单清理（clean）并重新构建（rebuild）项目，以确保已生成绑定类（binding\
  \ class）。下一步是在代码中使用该绑定类。 \n\n## 11.5 使用 View Binding\n\n此过程的第一步是“膨胀”（inflate）视图绑定类，以便我们能够访问布局中的根视图（root\
  \ view）。该根视图随后将作为布局的内容视图（content view）。\n\n执行这些任务的逻辑位置是在与布局相关的 activity 的 `onCreate()`\
  \ 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n要切换到使用 view binding，需要导入视图绑定类并按照如下方式修改类。请注意，由于布局文件名为 `activity_main.xml`，我们可以推断\
  \ Android Studio 生成的绑定类命名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了 `com.example` 以外的域名，则下面的\
  \ import 语句需要更改以反映这一点：\n\n```java\nimport android.widget.EditText;\nimport android.widget.TextView;\n\
  import com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们已经有了绑定的引用，可以如下所示通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(\n                           \
  \ binding.dollarText.getText().toString());\n        Float euroValue = dollarValue\
  \ * 0.85F;\n        binding.textView.setText(String.format(Locale.ENGLISH,\"%.2f\"\
  ,\n                                             euroValue));\n    } else {\n   \
  \     binding.textView.setText(R.string.no_value_string);\n    }\n}\n```\n\n编译并运行应用，验证货币转换过程是否如以前一样正常工作。\n\
  \n## 11.6 选择选项\n\n尽管在 `Empty Activity` 项目模板中未能采用 view bindings，但 Google 仍强烈建议尽可能使用\
  \ view binding。事实上，对合成属性（synthetic properties）的支持现在已经废弃，并且可能会在 Android Studio 的未来版本中被移除。因此，在开发自己的项目时，可能应该使用\
  \ view binding。\n\n## 11.7 书中示例中的 View Binding\n\n本书中任何依赖未实现 view binding 的项目模板的章节都将首先进行迁移。然而，与其在每次需要迁移时重复这些步骤，这些章节将引导你回到此处重温记忆（别担心，过了几个章节后，必要的更改将变成你的本能）。为了帮助这一过程，接下来的部分更简洁地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到 View Binding\n\n将项目模块转换为使用 view binding 的过程涉及以下步骤：\n\n1. 编辑项目（Project）工具窗口中列出的模块级\
  \ Gradle 构建脚本文件，路径为 `Gradle Scripts -> build.gradle (Module: <project name>.app)`，其中\
  \ `<project name>` 是项目名称（例如 `AndroidSample`）。\n2. 找到 `android` 部分并添加如下项以启用 `viewBinding`\
  \ 属性：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n \
  \   }\n}\n```\n\n3. 点击编辑器顶部的 `Sync Now` 链接以重新同步项目。\n4. 编辑 `MainActivity.java` 文件并按如下方式修改它（其中\
  \ `reverse domain` 代表创建项目时使用的域名，`project name` 是项目名称，例如 `AndroidSample`，而 `ActivityMainBinding`\
  \ 是 `activity_main.xml` 的名称）：\n\n```java\nimport android.view.View;\nimport reverse\
  \ domain.databinding.ActivityMainBinding;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n5. 通过绑定对象的属性按名称访问视图。\n\n## 11.9 总结\n\n此前，在代码内部访问视图需要使用 `findViewById()`\
  \ 方法。现在有了 view bindings 这种替代方案。view bindings 由为每个 XML 布局文件自动生成的类组成。然而，从 Android\
  \ Studio Dolphin 开始，某些项目模板默认未启用 view bindings，需要额外步骤在每个模块中手动启用并配置支持。\n\n## 12 理解\
  \ Android 应用和 Activity 生命周期\n\n在之前的章节中，我们学习了 Android 应用运行在进程中，并且由 activity 和广播接收器等组件组成。本章的目标是通过查看\
  \ Android 运行时系统中应用和 activity 的生命来扩展这些知识。\n\n无论现在的移动设备与过去的桌面系统相比拥有多大的内存和计算能力，但请记住，根据现代桌面和笔记本电脑的标准，这些设备仍然被认为是“资源受限的”。因此，Android\
  \ 系统的一项关键任务是有效管理这些有限资源，并确保操作系统以及运行其上的应用程序始终对用户做出响应。为了实现这一点，Android 对运行应用程序的进程以及组成应用程序的各个组件的生命和状态拥有完全控制权。\n\
  \n## 12.1 Android 应用与资源管理\n\n\n\n\n\n每个运行的 Android 应用程序都被操作系统视为一个独立的进程。如果系统识别到设备资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建出 Google 所说的“重要性层次结构”（importance\
  \ hierarchy）。然后，系统将从最低优先级开始，按照层次结构向上终止进程，直到释放出足够的资源供系统运行。\n\n## 12.2 Android 进程状态\n\
  \n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所托管的应用程序中排名最高的活动组件定义。如图 12-1 所示，进程在任何给定时刻都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image24381.jpg)\n\n图 12-1\n\n### 12.2.1\
  \ 前台进程 (Foreground Process)\n\n这些进程被赋予了最高优先级。在任何时刻，活跃的前台进程可能只有一个或两个，这些通常是系统最后被终止的进程。一个进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n* 托管一个用户当前正在交互的 Activity（活动）。\n* 托管一个与用户正在交互的 Activity 相连的 Service（服务）。\n* 托管一个通过调用\
  \ `startForeground()` 指明终止会破坏用户体验 Service。\n* 托管一个正在执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调函数的 Service。\n* 托管一个正在执行其 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\
  \n### 12.2.2 可见进程 (Visible Process)\n\n包含一个对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个\
  \ Activity 对用户可见，但另一个 Activity（例如部分屏幕或对话框）处于前台时。如果一个进程托管着一个 Service，且该 Service 本身绑定到了可见或前台的\
  \ Activity，那么该进程也符合可见状态条件。\n\n### 12.2.3 服务进程 (Service Process)\n\n包含一个已经启动且正在执行的\
  \ Service 的进程。\n\n### 12.2.4 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的 Activity，且没有托管符合服务进程状态的\
  \ Service 的进程。如果需要为更高优先级的进程释放额外内存，属于此类的进程有很高的终止风险。Android 维护着后台进程的动态列表，按时间顺序终止进程，使得最久处于前台的进程首先被杀掉。\n\
  \n### 12.2.5 空进程 (Empty Process)\n\n空进程不再包含任何活跃的应用程序，被保留在内存中，准备作为新启动应用程序的宿主。这有点比比预计乘客到达时保持公交车门开启并引擎运转。显然，此类进程被认为优先级最低，并且是第一个被杀掉以释放资源的。\n\
  \n## 12.3 进程间依赖 (Inter-Process Dependencies)\n\n确定最高优先级进程的情况比上一节描述的稍微复杂，简单原因是进程之间通常是相互依赖的。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个更高优先级的进程提供服务（例如作为前台进程的内容提供者的服务进程）。作为一个基本规则，Android 文档规定，一个进程的排名永远不会低于它正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期 (The Activity Lifecycle)\n\n正如我们之前确定的，Android 进程的状态很大程度上取决于其托管应用程序所组成的\
  \ Activity 和组件的状态。因此，理解这些 Activity 在应用程序的执行生命周期内也会经历不同的状态很重要。Activity 的当前状态部分取决于它在所谓的\
  \ Activity 栈（Activity Stack）中的位置。\n\n## 12.5 Activity 栈 (The Activity Stack)\n\n\
  对于在 Android 设备上运行的每个应用程序，运行时系统都维护着 Activity 栈。当应用程序启动时，第一个启动的应用程序 Activity 被放入栈中。当启动第二个\
  \ Activity 时，它将被放在栈顶，而上一个 Activity 被向下推。栈顶部的 Activity 被称为活动（或运行中） Activity。当活动 Activity\
  \ 退出时，它会被运行时从栈中弹出，栈中紧邻其下方的 Activity 变成当前的活动 Activity。栈顶部的 Activity 可能会因为其负责的任务已完成而直接退出。或者，用户可能选择了屏幕上的“返回”按钮以返回到上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并因此销毁。图 12-2 展示了 Android Activity 栈的可视化表示。\n\
  \n如图所示，新 Activity 在启动时会被推到栈顶。当前的活动 Activity 位于栈顶，直到它被新的 Activity 推向栈深处，或者在它退出或用户导航回上一个\
  \ Activity 时从栈中弹出。如果资源变得紧张，运行时将杀死 Activity，从栈底开始。\n\nActivity 栈就是编程术语中所谓的“后进先出”（LIFO）栈，因为最后一个被推入栈的项是第一个被弹出的项。\n\
  \n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\n图 12-2\n\n## 12.6\
  \ Activity 状态 (Activity States)\n\n在应用程序内部的执行过程中，Activity 可以处于若干不同状态之一：\n\n* **活动\
  \ / 运行 (Active / Running)**：Activity 位于 Activity 栈顶端，是设备屏幕上可见的前台任务，拥有焦点且当前正在与用户交互。在资源短缺的情况下，这种\
  \ Activity 最不可能被终止。\n* **已暂停 (Paused)**：Activity 对用户可见，但当前没有焦点（通常是因为该 Activity 被当前的活动\
  \ Activity 部分遮挡）。已暂停的 Activity 保留在内存中，保持连接到窗口管理器，保留所有状态信息，并在被移动到 Activity 栈顶端时可以快速恢复到活动状态。\n\
  * **已停止 (Stopped)**：Activity 当前对用户不可见（换句话说，它在设备显示器上被其他 Activity 完全遮挡）。与已暂停的 Activity\
  \ 一样，它保留了所有状态和成员信息，但在低内存情况下，被终止的风险更高。\n* **已杀掉 (Killed)**：Activity 已被运行时系统终止以释放内存，不再存在于\
  \ Activity 栈中。如果应用程序需要，必须重新启动此类 Activity。\n\n## 12.7 配置更改 (Configuration Changes)\n\
  \n\n\n\n在本章中，我们已经了导致 Android activity 状态变化的两种原因，即 activity 在前台和后台之间的移动，以及运行时系统为了释放内存而对\
  \ activity 终止。事实上，还有第三种场景会导致 activity 的状态发生发生剧烈变化，这涉及到设备配置的更改。\n\n默认情况下，任何影响 activity\
  \ 外观的配置更改（例如在竖屏和横屏之间旋转设备方向，或更改系统字体设置）都会导致 activity 被销毁并重建。其后的逻辑是，此类更改会影响用户界面布局等资源，而直接销毁并重建受影响的\
  \ activity 是 activity 响应配置更改最快的方法。不过，也可以对 activity 进行配置，使其在响应特定配置更改时不被系统重启。\n\n\
  ## 12.8 处理状态变化\n\n即使没有其他内容，本章也应该让人明确：一个应用程序以及（根据定义）其中包含的组件在它的整个生命周期内会经历许多状态转换。尤为重要的一点是，这些状态变化（包括完全终止）是\
  \ Android 运行时根据用户操作和设备资源可用性施加给应用程序的。\n\n但在实践中，这些状态变化并非在完全没有通知的情况下强加的，在大多数情况下，应用程序会收到运行时系统的变化通知，并获得做出相应反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个应用程序并发运行的假象。\n\
  \nAndroid 提供了两种方法来处理应用内对象生命状态的变化。一种方法是响应操作系统的状态变化方法调用，这将在题为\"处理 Android Activity\
  \ 状态变化\"的后续章节中详细介绍。\n\n另一种新方法（也是 Google 推荐的方法）涉及 Jetpack Android 架构组件中包含的生命周期类，这些类在\"\
  使用 Jetpack 构建现代 Android 应用程序架构\"中引入，并在题为\"与 Android 生命周期感知组件一起工作\"的章节中进行了更详细的解释。\n\
  \n## 12.9 总结\n\n移动设备通常被认为是资源受限的，特别是在板内存容量方面。因此，Android 操作系统的主要职责之一是确保应用程序以及整个操作系统对用户保持响应。\n\
  \n应用程序托管在 Android 的进程中。每个应用程序反过来由以 activity 和 `Services` 形式存在的组件组成。\n\nAndroid 运行时系统有权终止进程和单个\
  \ activity 以释放内存。运行时系统在决定一个进程是否为终止的合适候选者时会考虑进程状态。进程的状态在很大程度上取决于该进程托管的 activity 的状态。\n\
  \n本章的核心信息是，应用程序在它的执行生命周期内会经历各种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。那些不与用户直接交互的进程和 activity\
  \ 面临着被运行时系统终止的较高风险。因此，Android 应用程序开发的一项基本要素就涉及应用程序响应操作系统状态变化通知的能力。\n\n## 13. 处理\
  \ Android Activity 状态变化\n\n根据\"理解 Android 应用程序和 Activity 生命周期\"章节中概述的信息，现在已经显而易见，构成应用程序的\
  \ activity 和 fragment 在应用程序的生命周期内会经过各种不同的状态。从一个状态到另一个状态的转换是由 Android 运行时系统强加的，因此在很大程度上不受\
  \ activity 自身的控制。然而，这并不意味着应用无法对这些变化做出反应并采取适当行动。\n\n本章的主要目标是提供 activity 如何被通知状态变化的高层级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及\
  \ activity 寿命的主题。\n\n## 13.1 新旧生命周期技术\n\n直到最近，一直有一种标准方法在应用中构建生命周期感知。这是本章涵盖的方法，涉及在\
  \ activity 或 fragment 实例中实现一组方法（每个生命周期状态对应一个），当该对象的生命周期状态发生变化时，操作系统调用这些方法。这种方法自\
  \ Android 操作系统早期以来一直没有改变，虽然在今天仍然是一个可行的选项，但它确实有一些局限性，这些将在本章的稍后解释。\n\n随着 Jetpack Android\
  \ 架构组件引入了生命周期类，现在有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在随后的章节中详细介绍。然而，出于以下原因，理解传统的生命周期方法仍然很重要。首先，作为一名\
  \ Android 开发人员，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中的一些。更重要的是，理解处理生命周期的旧方法将为你提供良好的知识基础，以便在书的后面开始学习新方法。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n除少数例外外，应用程序中的 activity 和 fragment 分别作为 `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类创建。\n\n例如，考虑在\"在 Android Studio 中创建 Android 示例\"中创建的 `AndroidSample`\
  \ 项目，并随后转换为使用视图绑定（view binding）。将此项目加载到 Android Studio 环境并定位 `MainActivity.java`\
  \ 文件（位于 `app -> java -> <your domain> -> androidsample`）。找到文件后，双击将其加载到编辑器，其内容如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.view.View;\nimport android.os.Bundle;\nimport java.util.Locale;\n\
  import com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
