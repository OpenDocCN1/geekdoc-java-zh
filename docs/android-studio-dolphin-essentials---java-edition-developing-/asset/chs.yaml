  \n## 75.8 将网页加载到 WebView 中\n\n在打印网页之前，需要将其加载到 `WebView` 实例中。对于本教程而言，这将通过调用 `WebView`\
  \ 实例 `loadUrl()` 方法来实现，该方法将被放置在名为 `configureWebView()` 方法中，并在 `MainActivity` 类的\
  \ `onStart()` 方法中调用。因此，编辑 `MainActivity.java` 文件并将其修改如下：\n\n```java\npackage com.ebookfrenzy.webprint;\n\
  \nimport android.view.Menu;\nimport android.view.MenuItem;\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n\
  \n    @Override\n    protected void onStart() {\n        super.onStart();\n    \
  \    configureWebView();\n    }\n\n    private void configureWebView() {\n     \
  \   myWebView = findViewById(R.id.myWebView);\n        myWebView.setWebViewClient(new\
  \ WebViewClient(){\n            @Override\n            public boolean shouldOverrideUrlLoading(\n\
  \                    WebView view, WebResourceRequest request) {\n             \
  \   return super.shouldOverrideUrlLoading(\n                        view, request);\n\
  \            }\n        });\n        myWebView.loadUrl(\n                    \"\
  https://www.answertopia.com\");\n    }\n}\n```\n\n## 75.9 添加打印菜单选项\n\n现在将使用“在 Android\
  \ 上创建和管理溢出菜单”章节中概述的技术将网页打印选项添加到溢出菜单（Overflow menu）中。第一个要求是创建一个用于标记菜单选项的字符串资源。在项目（Project）工具窗口中，找到\
  \ `app -> res -> values -> strings.xml` 文件，双击将其加载到编辑器中并修改它以添加一个新的字符串资源：\n\n```xml\n\
  <resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string name=\"\
  action_settings\">Settings</string>\n    <string name=\"print_string\">Print</string>\n\
  </resources>\n```\n\n接下来，将 `app -> res -> menu -> menu_main.xml` 文件加载到菜单编辑器中，切换到代码（Code）模式并将设置选项替换为打印选项：\n\
  \n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
