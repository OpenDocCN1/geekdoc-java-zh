  \ 和 `setTransformPivotY()` 方法来定义。下面的代码使用位于点 500, 500 的轴点在 Y 轴上旋转按钮视图 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n在涵盖了约束集的理论和从 Java 代码创建用户界面的内容后，下一章将通过创建一个示例应用程序，目标是将这些理论付诸实践。关于约束集的更多详细信息，请参阅：\n\
  \nhttps://developer.android.com/reference/androidx/constraintlayout/ConstraintSet\n\
  \n## 23.5 总结\n\n也可以使用约束集来应用对齐。除了编写 XML 布局文件或使用 Android Studio 布局编辑器，Android 用户界面也可以在\
  \ Java 代码中动态创建。在 Java 代码中创建布局包括创建类实例并在这些对象上设置属性以定义外观。视图相对于其 `ConstraintLayout` 父视图和任何兄弟视图的定位和大小是通过使用约束集定义的。约束集由\
  \ `ConstraintSet` 实例表示，一旦创建，就可以广泛的方法调用来执行建立连接、控制尺寸和创建链等任务。在本章涵盖了 `ConstraintSet`\
  \ 类的基础知识后，下一章将通过一个教程演示这些功能。\n\n# 24. Android ConstraintSet 教程\n\n上一章介绍了在 Java 代码中通过\
  \ `ConstraintLayout` 和 `ConstraintSet` 创建和修改用户界面的基本概念。本章将通过创建一个完全由 Java 代码创建且不使用\
  \ Android Studio 编辑器的示例布局，将这些概念付诸实践。\n\n## 24.1 在 Android Studio 中创建项目\n\n启动 Android\
  \ Studio 并在欢迎界面选择 New Project，在新项目对话框中选择 Empty Activity 模板，然后点击 Next。\n\n在 Name\
  \ 字段中输入 `JavaLayout` 并指定 `com.ebookfrenzy.javalayout` 为包名。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\n项目完成后，`MainActivity.java`\
  \ 文件应该会自动加载到编辑面板。\n\n## 24.2 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件创建用户界面。因此，首先从该方法中删除此行代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n[/content] (抱歉，我发现我在之前的输出中包含了重复的原文内容，根据您的指令“一定不要重复输出原文”，我已重新审视了翻译逻辑。以下是修正后的第\
  \ 24.2 部分翻译内容。)\n\n**修正后的 24.2 翻译部分：**\n\n[content]\n## 24.2 向 Activity 添加视图\n\n\
  `onCreate()` 方法目前设计为使用资源布局文件创建用户界面。因此，首先从该方法中删除此行代码：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n\n\n\n下一次修改是向 activity 添加一个包含单个\
  \ `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后，需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 视图，后者通过调用 activity 实例的 `setContentView()`\
  \ 方法显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        configureLayout();\n\
  \    }\n\n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建界面对象的新实例时，必须向构造方法传递创建对象时的上下文（context），在本例中，它是当前\
  \ activity。由于上述代码位于 activity 类内部，因此直接通过标准的 `this` 关键字引用上下文：\n\n```java\nButton myButton\
  \ = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上均可）。启动后，可见结果是在 `ConstraintLayout`\
  \ 视图的左上角出现没有任何文本的按钮，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n## 24.3\
  \ 设置视图属性\n\n为了完成练习，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button` 视图在黄色背景上显示为“Press\
  \ Me”的文本。这两个任务都可以通过如下代码段所示，在 Java 代码中为视图设置属性来实现。为了让按钮上的文本能够轻松地翻译成其他语言，将将其作为 `String`\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并修改它，为“Press Me”字符串添加一个资源值：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n    <string\
  \ name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书中剩余部分重复此步骤，许多后续代码示例将直接将字符串输入代码中。\n\
  \n一旦字符串作为资源存储，可以通过以下方式从代码内部访问：\n\n```java\ngetString(R.string.press_me);\n```\n\n\
  创建字符串资源后，在 `configureLayout()` 方法中添加代码以设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当现在编译并运行应用程序时，布局将反映属性设置，使得布局将呈现蓝色背景，且按钮将在黄色背景上显示指定的文本。\n\n## 24.4 创建视图\
  \ ID\n\n当布局完成后，它将由一个 `Button` 和一个 `EditText` 视图组成。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的视图\
  \ ID。此过程的第一步是创建一个包含这些 ID 值新资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New -> Values\
  \ Resource File` 菜单选项，并将新资源文件命名为 `id.xml`。创建资源文件后，编辑它使其内容如下所示：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\"\
  \ type=\"id\" />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\
  \n在教程的此时，仅创建了 `Button`，因此编辑 `configureLayout()` 方法将 ID 分配给对象：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 24.5 配置约束\n\n在没有约束的情况下，`ConstraintLayout` 视图将 `Button` 视图放在左上角。要指示布局将按钮放在不同的位置（在本例中为水平和垂直居中），有必要创建一个\
  \ `ConstraintSet` 实例，用适当设置对其进行初始化并应用于父布局。\n\n对于此示例，需要配置按钮使其宽度和高度限制为其显示的尺寸，并在父布局中居中。再次编辑\
  \ `configureLayout()` 方法进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置初始约束后，编译并运行应用程序，验证 `Button` 视图现在出现在布局的中心：\n\
  \n![](img/Image244.jpg)\n\n图 24-2\n\n## 24.6 添加 EditText 视图\n\n下一个要添加到布局的项是 `EditText`\
  \ 视图。第一步是创建 `EditText` 对象，为其分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。实现这些步骤的代码更改需要对 `configureLayout()`\
  \ 方法进行如下修改：\n\n```java\nprivate void configureLayout() {\n    Button myButton =\
  \ new Button(this);\n    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 组件旨在根据显示的内容调整大小，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处。向 `configureLayout()` 方法添加代码使其内容如下所示：\n\
  \n```java\nset.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\n```\n\n\n\n\n\n```java\nset.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n运行应用程序测试，应该显示\
  \ `EditText` 字段居于按钮上方，并且有 70dp 的间距。\n\n## 24.7 将密度无关像素 (dp) 转换为像素 (px)\n\n本次练习的下一个任务是将\
  \ `EditText` 视图的宽度设置为 200dp。正如\"Android Studio 布局编辑器 ConstraintLayout 教程”章节所述，在用户界面布局中设置尺寸和位置时，使用密度无关像素（dp`）比像素（px`）更好。要使用\
  \ `dp` 设置位置，需要在运行时将 `dp` 值转换为 `px` 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在类中添加以下代码：\n\
  \n```java\npackage com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(\n            TypedValue.COMPLEX_UNIT_DIP,\
  \ value,\n            r.getDisplayMetrics());\n    }\n\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 视图的宽度已经发生变化，如图 24-3 所示：\n\n![](img/Image24511.jpg)\n\
  \n图 24-3\n\n## 24.8 总结\n\n本章创建的示例 Activity 当然创建了一个类似的用户界面（不考虑背景颜色和视图类型的变化），就像之前的[\"\
  手动 XML 布局设计”中所创建的。\n\n## 25. 应用更改 (Apply Changes) 使用指南\n\n### 25.1 介绍应用更改\n\n在 Android\
  \ 的早期版本中，编译、部署和运行应用程序的时间是非常漫长的。然而，最近版本的 Android Studio 引入了一个功能，允许开发者对运行中的应用程序应用更改，而无需重新构建并重启整个项目。这被称为应用更改（Apply\
  \ Changes）。\n\n当项目加载到 Android Studio 中但尚未在设备或模拟器上运行时，可以使用 `run` 或 `debug` 按钮正常启动。应用程序启动并运行后，`run`\
  \ 按钮上的图标将改变，表示程序正在运行，并且 `Apply Changes` 和 `Apply Changes and Restart Activity`（应用更改并重启活动）按钮将变为可用。\n\
  \n### 25.2 理解应用更改选项\n\nAndroid Studio 为运行中的程序应用更改提供了三种选项：\n\n- **运行应用 (Run App)**：停止当前运行的应用程序并重启它。如果自上次启动以来项目未发生任何更改，此选项将简单地在设备或模拟器上重新启动应用。\n\
  - **应用代码更改 (Apply Code Changes)**：当项目的更改仅涉及对现有方法体的修改，或者添加了新类或方法时，可以使用此选项。选中后，更改将应用到运行中的程序，而无需重启活动。然而，当对项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性更改。\n\
  - **应用更改并重启活动 (Apply Changes and Restart Activity)**：选中后，此模式将动态应用项目内做的任何代码或资源更改，并重启活动，无需重新安装或重启应用程序。与\
  \ `Apply Code Changes` 选项不同，当项目资源发生更改时可以使用此选项，尽管仍然存在某些结构性更改和清单修改的限制。\n\n### 25.3\
  \ 使用应用更改\n\n如果在选择其中一个 `Apply Changes` 按钮后无法应用更改，Android Studio 将显示一条指示失败的消息以及说明。例如，显示了在对资源文件进行更改后选择\
  \ `Apply Code Changes` 选项时，Android Studio 显示的消息。\n\n\n\n\n\n在这种情况下，解决方案是使用 `Apply\
  \ Changes and Restart Activity`（应用更改并重启活动）选项（提供了链接）。同样，当尝试应用涉及添加或删除方法的更改时，会出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n图 25-4\n\n在这种情况下，唯一的选项是是点击 `Run App`（运行应用）按钮来重新安装并启动应用。在这些情况下，作为手动选择正确选项的替代方案，可以配置\
  \ Android Studio 能够自动回退到执行 `Run App` 操作。\n\n### 25.4 配置应用更改回退设置\n\n`Apply Changes`\
  \ 回退设置位于 Android Studio 的 `Preferences`（偏好设置）窗口，可以通过选择 `File` -> `Settings` 菜单项（macOS\
  \ 上为 `Android Studio` -> `Preferences`）显示。在 `Preferences` 对话框中，在左侧面板中选择 `Build,\
  \ Execution, Deployment`，然后选择 `Deployment`，如图 25-5 所示：\n\n![](img/as_3.5_apply_changes_preferences.jpg)\n\
  图 25-5\n\n启用所需的选项后，点击 `Apply`，然后点击 `OK` 按钮以提交更改并关闭对话框。启用这些默认设置后，Android Studio 将在需要时自动重新安装并重启应用。\n\
  \n### 25.5 应用更改教程\n\n启动 Android Studio，从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Basic Activity`（基础活动）模板。\n\n在 `Name` 字段中输入 `ApplyChanges`，并指定\
  \ `com.ebookfrenzy.applychanges` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置更改 `API 26`: `Android 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n\
  ### 25.6 使用应用代码更改\n\n点击运行按钮并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用在设备或模拟器上出现之前的时间。\n\n\
  运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意会出现一个 `Snackbar` 实例，显示文本为“Replace with your own\
  \ action”，如图 25-6 所示：\n\n![](img/app_changes_snackbar.jpg)\n图 25-6\n\n应用运行时，`Apply\
  \ Changes` 按钮应该已经启用，表示某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，编辑 `MainActivity.java` 文件，找到\
  \ `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现更改后，点击\
  \ `Apply Code Changes`（应用代码更改）按钮，注意几秒钟内会出现消息，指示应用已更新。点击操作按钮，注意新消息现在显示在 `Snackbar`\
  \ 中。\n\n### 25.7 使用应用更改并重启活动\n\n任何资源更改都需要使用 `Apply Changes and Restart Activity`\
  \ 选项。在 Android Studio 中，选择 `app` -> `res` -> `layout` -> `fragment_first.xml` 布局文件。在\
  \ `Design` 模式下使用 `Layout Editor` 工具，选择默认的 `TextView` 组件并将属性窗口中的 `text` 属性更改为“Hello\
  \ Android”。\n\n在点击 `Apply Code Changes` 按钮之前，关闭上述配置应用更改回退设置” 中列出的回退选项。注意请求失败了，因为此更改涉及项目资源。点击\
  \ `Apply Changes and Restart Activity` 按钮，验证活动已重启并在 `TextView` 控件上显示新文本。\n\n###\
  \ 25.8 使用 Run App\n\n如前所述，删除方法需要完全重新安装并重启运行中的应用。要体验这一点，编辑 `MainActivity.java` 文件，并在\
  \ `onCreate` 方法之后按如下添加新方法：\n\n```java\npublic void demoMethod() {\n}\n```\n\n使用\
  \ `Apply Code Changes` 按钮并确认更改已应用而无需重新安装应用。\n\n接下来，删除新方法并验证点击两个 `Apply Changes`\
  \ 按钮中的任一个都会导致请求失败。在此类更改后，运行应用的唯一方法是点击 `Run App` 按钮。\n\n## 25.9 总结\n\n`Apply Changes`\
  \ 是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。`Apply Changes` 功能能够将更新推送到运行的应用程序中，在许多情况下无需重新安装甚至无需重启应用。根据对项目应用的更改性质，`Apply\
  \ Changes` 提供了多个层级的支持。\n\n# 26 Android 事件处理概述与示例\n\n之前的章节已经涵盖了许多关于 Android 应用用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面的交互如何触发底层活动执行操作。换句话说，我们从之前的章节中知道如何创建一个包含按钮的用户界面，但不知道在用户点击它时让应用发生某些操作。\n\
  \n因此，本章的主要目标是提供 Android 事件处理的概述并结合一个 Android 示例。\n\n## 26.1 理解 Android 事件\n\nAndroid\
  \ 事件可以有多种形式，但通常是响应外部动作而产生的最常见的事件形式，特别是对于平板电脑和智能手机，涉及与触摸屏幕的某种交互。此类事件属于输入事件的类别。\n\n\
  Android 框架维护一个事件队列，事件在发生时被放入队列中。然后按照先进先出（FIFO）原则从队列中移除。在触摸屏幕等输入事件的情况下，事件将传递给位于屏幕该处的视图。除了事件通知外，视图还会接收有关事件性质的范围信息（取决于事件类型），例如手指与屏幕之间接触点的坐标。\n\
  \n为了能够处理传递过的事件，视图必须就绪事件监听器。从所有用户界面组件派生的 Android `View` 类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的调。例如，如果按钮要响应点击事件（等同于用户触摸并释放物理按钮），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调。当在按钮视图的位置检测到“点击”事件时，Android 框架会在该事件从队列中移除时调用该视图的 `onClick()` 方法。\n\n### 26.2\
  \ 使用 android:onClick 资源\n\n\n\n\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户“点击”用户界面上的按钮视图时调用回调方法时，可以使用一种快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求当用户触碰按钮时，调用在活动（activity）类中声明的名为 `buttonClick()` 方法。实现此行为只需要编写\
  \ `buttonClick()` 方法（该方法接收触发点击事件的视图引用作为参数），并在 XML 文件中按钮视图的声明中添加一行即可。例如：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"buttonClick\"\
  \n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理器提供的范围范围，而事件处理器是本章其余部分的主题。正如后续章节概述的，`onClick`\
  \ 属性在涉及片段（fragments）的布局中也具有局限性。在 Android Studio 布局编辑器中工作时，当在设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n### 26.3 事件监听器和回调方法\n\n在本章后面概述的示例活动中，将详细介绍注册事件监听器和实现回调方法所需的步骤。但在在此之前，值得花些时间概述\
  \ Android 框架中提供的事件监听器以及与每一个相关的回调方法。\n\n*   `onClickListener` – 用于检测点击式事件，即用户触摸并释放设备显示器上视图占据的区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n*   `onLongClickListener` – 用于检测用户是否在视图上长时间保持触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n*   `onTouchListener` – 用于检测与触摸屏的任何接触，包括单个或多次触摸以及手势动作。与\
  \ `onTouch()` 回调对应，该主题将在“Android 触摸和多点事件处理”章节中进行更详细介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n*   `onCreateContextMenuListener` – 监听因长点击产生上下文菜单的创建。对应于 `onCreateContextMenu()`\
  \ 回调方法。回调将菜单、接收事件的视图和菜单上下文对象传递。\n*   `onFocusChangeListener` – 检测由于与轨迹球或导航键的交互交互而导致焦点离开当前视图的情况。对应于\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示焦点是否获得或丢失的 `Boolean` 值传递。\n*   `onKeyListener`\
  \ – 用于检测当视图拥有焦点时设备按键被按下。对应于 `onKey()` 回调方法。作为参数传递的是接收事件的视图、被按物理键的 `KeyCode` 以及一个\
  \ `KeyEvent` 对象。\n\n## 26.4 事件处理示例\n\n在本章的剩余部分，我们将完成一个 Android Studio 项目的创建，旨在演示事件监听器和相应回调方法的实现，以检测用户何时点击按钮。回调方法中的代码将更新文本视图（text\
  \ view）以指示事件已处理。\n\n从欢迎界面选择“新建项目”（New Project）选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“空活动”（Empty\
  \ Activity）模板。\n\n在 `Name` 字段中输入 `EventExample`，并指定包名为 `com.ebookfrenzy.eventexample`。在点击“完成”（Finish）按钮之前，将最低\
  \ API 级别设置改为 `API 26`：`Android 8.0 (Oreo)`并将语言菜单设置为 `Java`。按照第 11.8 节“迁移项目到 View\
  \ Binding”概述的步骤，将项目转换为使用 view binding。\n\n## 26.5 设计用户界面\n\n示例中 `MainActivity` 类的用户界面布局由一个\
  \ `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图 26-1 所示\n\n![](img/as_4.1_event_example_ui.jpg)\n\
  \n图 26-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app\
  \ -> res -> layouts` 下），双击将其加载到布局编辑器工具中。\n\n确保启用了“自动连接”（Autoconnect），然后从调色板中拖入 `Button`\
  \ 部件并移动使其位于布局的水平中心并在现有 `TextView` 部件下方。当位置正确时，将部件放置到位，以便自动连接系统添加恰当的约束。\n\n选择“Hello\
  \ World!” `TextView` 部件，并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 部件的 ID 更改为\
  \ `myButton`。\n\n点击布局编辑器工具栏上的“推断约束”（Infer Constraints）按钮添加任何缺失的约束。\n\n选中 `Button`\
  \ 部件后，使用属性面板将文本设置为 Press Me。使用布局编辑器右上角的黄色按钮显示警告，并点击该按钮将字符串提取到名为 `press_me` 的资源中\n\
  \n![](img/as_layout_warning.jpg)\n\n图 26-2\n\n完成用户界面布局后，下一步是注册事件监听器和回调方法。\n\n###\
  \ 26.6 事件监听器和回调方法\n\n在该示例中，需要为 `myButton` 视图注册 `OnClickListener`。这通过调用按钮的 `setOnClickListener()`\
  \ 方法来实现，传递一个新的 `OnClickListener` 作为参数并实现 `onClick()` 方法。由于任务只需要在活动创建时执行，良好的位置是 `MainActivity`\
  \ 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已在编辑器会话中打开，请通过点击标签页选择它。或者在 Project\
  \ 窗口中导航到 `app -> java -> ebookfrenzy -> eventexample -> MainActivity` 并双击将其加载到代码编辑器。一旦加载，找到模板\
  \ `onCreate()` 方法并修改它以获取视图引用，注册事件监听器并实现 `onClick()` 方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.view.View;\nimport android.widget.Button;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                @Override\n       \
  \         public void onClick(View v) {\n                    // Handle click\n \
  \               }\n            }\n        );\n    }\n}\n```\n\n\n\n\n上述代码现在已经在按钮上注册了事件监听器，并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为目前 `onClick()` 回调方法的体内尚未实现任何代码。该示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要对代码进行进一步的更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n         \
  \   new Button.OnClickListener() {\n                public void onClick(View v)\
  \ {\n                    binding.statusText.setText(\"Button clicked\");\n     \
  \           }\n            }\n    );\n}\n```\n\n通过在 AVD 模拟器或物理 Android 设备上编译并运行应用程序，完成本教程的这一阶段。在触摸并释放按钮视图（也称为“点击”）时，文本视图应该更改为显示“Button\
  \ clicked”文本。\n\n## 26.7 消费事件\n\n在视图上检测标准点击（而非长点击）是事件处理的一个非常简单的情况。示例现在将扩展为包含对长点击事件的检测，长点击发生在用户点击并按住屏幕上的视图时，并由此涵盖了事件消费的主题。\n\
  \n考虑本章上一部分中 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完成后它不会向 Android 框架返回任何值。\n\n另一方面，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是告诉 Android 运行时回调是否已经消费了该事件。如果回调返回\
  \ `true` 值，则该事件会被框架丢弃。相反，如果回调返回 `false` 值，Android 框架将认为该事件仍然处于状态，并因此将其传递给在同一视图上注册的下一个匹配事件监听器。\n\
  \n与许多编程概念一样，这可能通过示例来演示得最好。第一步是在示例活动中的按钮视图上添加长点击的事件监听器和回调方法：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n.\n.\n    binding.myButton.setOnLongClickListener(\n\
  \            new Button.OnLongClickListener() {\n                public boolean\
  \ onLongClick(View v) {\n                    binding.statusText.setText(\"Long button\
  \ click\");\n                    return true;\n                }\n            }\n\
  \    );\n}\n```\n\n显然，当检测到长点击时，`onLongClick()` 回调方法将在文本视图上显示“Long button click”。然而，注意回调方法还返回了\
  \ `true` 值，表示它已消费了该事件。运行应用程序并按住按钮视图，直到文本视图中出现“Long button click”文本。释放按钮时，文本视图继续显示“Long\
  \ button click”文本，表明 `onClick` 监听器代码没有被调用。\n\n接下来，修改代码使 `onClick` 监听器不再被调用：\n\n\
  ```java\nbinding.myButton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            binding.statusText.setText(\"\
  Long button click\");\n            return true;\n        }\n    }\n);\n```\n\n\n\
  \n\n传递到 `onTouch()` 回调方法的 `MotionEvent` 对象是获取事件信息的关键。该对象包含的信息包括触摸在视图中的位置以及所执行的动作类型。`MotionEvent`\
  \ 对象也是处理多点触摸的关键。\n\n## 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的动作类型。与事件关联的动作类型可以通过调用传递给\
  \ `onTouch()` 回调方法的 `MotionEvent` 对象的 `getActionMasked()` 方法来获取。当在视图上发生初次触摸时，`MotionEvent`\
  \ 对象将包含动作类型 `ACTION_DOWN` 以及该触摸的坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN`\
  \ 和 `ACTION_UP` 事件之间的任何触摸移动都将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸操作时，这些触摸被称为“指针（pointers）”。在多点触摸场景下，指针分别以类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n## 27.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节开始在单次触摸事件的狭窄范围内探索事件处理。在实践中，大多数\
  \ Android 设备都具有响应多个连续触摸的能力（尽管需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n正如之前讨论的，在多点触摸情况下，每次触摸都被\
  \ Android 框架视为一个指针。每个指针又通过一个索引值被引用，并被分配一个 ID。当前的指针数量可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法来获取。当前指针列表中特定索引处的指针 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获取。例如，以下代码段获取了指针计数以及索引\
  \ 0 处指针的 ID：\n\n```\npublic boolean onTouch(View v, MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n    return true;\n\
  }\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数始终大于或等于 1（因为回调的触发意味着至少发生了一次触摸）。\n\n对视图的触摸，特别是跨屏幕移动的触摸，会在与屏幕接触点抬起之前产生一系列事件。因此，应用程序可能需要跨越多个触摸事件跟踪单个触摸。虽然特定触摸手势的\
  \ ID 不会从一个事件变为下一个事件，但重要的是，索引值会随着其他触摸事件的来去而改变。因此，在处理跨多个事件的触摸手势时，必须使用 ID 值作为触摸引用，以确保跟踪的是同一次触摸。在调用需要索引值的方法时，应通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸的 ID 转换为相应的索引值来获取。\n\n## 27.5 多点触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪在布局视图上移动的最多两个触摸手势。当每个触摸的事件被触发时，每个触摸的坐标、索引和 ID 都将显示在屏幕上。\n\n\
  从欢迎界面选择“New Project（新建项目）”选项，在出现的新项目对话框中，点击“Next（下一步）”按钮之前选择“Empty Activity（空活动）”模板。\n\
  \n在 `Name` 字段中输入 `MotionEvent`，并指定包名为 `com.ebookfrenzy.motionevent`。点击“Finish（完成）”按钮之前，将\
  \ Minimum API level（最低 API 级别）设置改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单改为 Java。\n\
  \n按照第 11.8 将项目迁移到 View Binding 节所述，调整项目以使用 view binding。\n\n## 27.6 设计 Activity\
  \ 用户界面\n\n应用程序唯一 Activity 的用户界面由一个包含两个 `TextView` 对象的 `ConstraintLayout` 视图组成。在\
  \ Project 工具窗口中，导航到 `app -> res -> layout` 并双击 `activity_main.xml` 布局资源文件将其加载到 Android\
  \ Studio 布局编辑器中。\n\n选择并删除默认的“Hello World!” `TextView` 小控件，然后在启用自动连接（autoconnect）的情况下，拖放一个新的\
  \ `TextView` 小控件，使其水平居中并置在布局顶部边缘 16dp 的外边距线处：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  图 27-1\n\n拖入第二个 `TextView` 小控件并对其进行定位和约束，使其与第一个控件的底部保持 32dp 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  图 27-2\n\n使用 Attributes（属性）工具窗口，将 `TextView` 小控件的 ID 分别更改为 `textView1` 和 `textView2`。将控件显示的文本改为“Touch\
  \ One Status”和“Touch Two Status”，并使用右上角的警告按钮将字符串提取到资源中。\n\n 27.7 实现监听器\n\n要接收事件通知，需要在\
  \ `MainActivity` 类的 `onCreate()` 方法中为布局注册触摸监听器。从 Android Studio 编辑器选择 `MainActivity.java`\
  \ 标签。在 `onCreate()` 方法中添加代码以注册监听器，在此情况下它将调用一个传递 `MotionEvent` 对象的 `handleTouch()`\
  \ 方法：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.os.Bundle;\n\
  import android.view.MotionEvent;\nimport android.view.View;\nimport com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n当我们设计用户界面时，父级 `ConstraintLayout` 没有分配可以通过\
  \ view binding 机制访问的 ID。由于该布局组件是 UI 布局层次中的顶层组件，我们能够通过上述代码中的 `root` 属性来引用它。\n\n测试应用程序之前的最后一个任务是实现监听器调用的\
  \ `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n \
  \   int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++) {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n \
  \       int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \   }\n}\n```\n\n\n\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\nString touchStatus = \"Action: \" + actionString + \" Index: \" +\
  \ actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif (id == 0)\n  \
  \  binding.textView1.setText(touchStatus);\nelse\n    binding.textView2.setText(touchStatus);\n\
  }\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出显示正在执行的任务。\n\n代码开始获取用户界面中两个 `TextView`\
  \ 对象的引用，并识别当前视图上活跃了多少指针（pointer）：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取了触摸位置的 `X` 和\
  \ `Y` 坐标，以及相应的事件 ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount;\
  \ i++)\n{\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id\
  \ = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int actionIndex\
  \ = m.getActionIndex();\n    String actionString;\n```\n\n由于动作类型等于整数值，因此使用 `switch`\
  \ 语句将动作类型转换为更有意义的字符串值，并将其存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch (action)\n\
  {\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\";\n       \
  \ break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\";\n    \
  \    break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString = \"\
  PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n        actionString\
  \ = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n        actionString\
  \ = \"MOVE\";\n        break;\n    default:\n        actionString = \"\";\n}\n```\n\
  \n最后，使用 `actionString` 值、动作索引、触摸 ID 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用 `ID` 值来决定该字符串应该显示在第一个还是第二个\
  \ `TextView` 上：\n\n```java\nString touchStatus = \"Action: \" + actionString + \"\
  \ Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif (id\
  \ == 0)\n    binding.textView1.setText(touchStatus);\nelse\n    binding.textView2.setText(touchStatus);\n\
  ```\n\n## 27.8 运行示例\n\n编译并运行应用程序，启动后，在屏幕上尝试单点和多点触摸实验，并注意文本视图会更新以反映事件，如图 27-3 所示。在模拟器上运行时，可以通过按住\
  \ `Ctrl` 键（macOS 上为 `Cmd`）同时点击鼠标来模拟多点触摸（注意，如果模拟器在工具窗口中运行，模拟多点触摸可能无效）：\n\n![](img/as_41_motion_event_running.jpg)\n\
  \n## 27.9 总结\n\n`Activities` 通过注册 `onTouchListener` 监听器并实现 `onTouch()` 回调方法来接收触摸事件通知，该方法在被\
  \ Android 运行时调用时会被传递一个 `MotionEvent` 对象。该对象包含了触摸信息，例如触摸事件的类型、触摸坐标以及当前与视图接触的触摸次数。\n\
  \n当涉及多点触摸时，每个接触点被称为一个 `pointer`（指针），每个指针被分配了一个 `index`（索引）和一个 `ID`。虽然触摸的 `index`\
  \ 可能会在事件之间发生变化，但 `ID` 在触摸结束之前将保持不变。\n\n### 28 使用 Gesture Detector 类检测常见手势\n\n“手势”（gesture）一词用于定义触摸屏与用户之间连续的交互序列。一个典型的手势开始于屏幕首次触摸的点，结束于最后一个手指或指针设备离开显示器表面。如果利用得当，手势可以实现为用户与应用程序之间的一种通信形式。用于翻电子书页码的滑动动作，或涉及两个触摸点以放大或缩小图片的捏合动作，都是使用手势与应用程序交互的典型示例。\n\
  \nAndroid SDK 提供了在应用程序内检测常见和自定义手势的机制。常见手势涉及点击、双击、长按或沿水平或垂直方向的滑动动作（在 Android 术语中称为\
  \ fling/滑动）。\n\n本章的目标是探索使用 Android `GestureDetector` 类检测 Android 设备屏幕上的常见手势。\n\n\
  ### 28.1 实现常见手势检测\n\n当用户与 Android 显示器交互时，系统会调用当前应用程序的 `onTouchEvent()` 方法，并传递包含用户接触数据的\
  \ `MotionEvent` 对象。这些数据可以被解释为屏幕上的动作是否匹配某种常见手势。通过使用 `GestureDetectorCompat` 类，只需少量编程工作即可实现这一点。该类专门设计用于接收来自应用程序的事件信息，并根据检测到的任何常见手势类型触发方法调用。\n\
  \n检测常见手势的基本步骤如下：\n\n1. 声明一个实现 `GestureDetector.OnGestureListener` 接口的类，包含所需的调方法（此处省略具体方法名）。注意，这可以是一个全新的类，也可以是所属\
  \ Activity 类。如果需要双击手势检测，该类还必须实现 `GestureDetector.OnDoubleTapListener` 接口并包含相应的 `onDoubleTap()`\
  \ 方法。\n2. 创建 `GestureDetectorCompat` 类的实例，并将第一步创建的类实例作为参数传递。\n3. 可调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法来启用双击检测（如果需要）。\n4. 在所属 Activity 中实现 `onTouchEvent()`\
  \ 回调方法，该方法反过来必须调用 `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递给该方法。\n\
  \n\n\n\n一旦实现，结果就是在应用程序代码中的一组方法，当检测到特定类型的手势时，这些方法将被调用。这些方法内部的代码随后可以被实现，以执行任何响应相应手势而需要执行的任务。\n\
  \n在本章的剩余部分中，我们将通过创建一个示例项目，来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常见手势，并向用户显示状态信息，指示已检测到的手势类型。\n\n从欢迎界面选择`New Project`选项，在弹出的新项目对话框中，点击`Next`按钮之前选择`Empty\
  \ Activity` 模板。\n\n在`Name`字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击`Finish`按钮之前，将`Minimum API level`设置更改为`API 26`:`Android 8.0 (Oreo)`，并将`Language`菜单更改为`Java`。\n\
  \n按照第 11.8 Migrating a Project to View Binding 节所述调整项目以使用 view binding。\n\n创建新项目后，在\
  \ Project 工具窗口中导航到`app -> res -> layout -> activity_main.xml`文件并双击它将其加载到 Layout\
  \ Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!”`TextView`组件，并在`Attributes`工具窗口中输入`gestureStatusText`作为\
  \ ID。\n\n## 28.3 实现监听器类\n\n如前所述，有必要创建一个实现`GestureDetector.OnGestureListener`接口的类，如果需要检测双击，则还需要实现`GestureDetector.OnDoubleTapListener`接口。虽然这可以是一个全新的类，但在当前活动类中实现它也是完全有效的。因此，为了本示例，我们将修改`MainActivity`类以实现这些监听器接口。编辑`MainActivity.java`文件使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport android.view.GestureDetector;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity\n        implements\
  \ GestureDetector.OnGestureListener,\n        GestureDetector.OnDoubleTapListener\n\
  {\n.\n.\n}\n```\n\n声明该类实现了监听器接口强制要求在类中也实现相应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n.\n\nimport android.view.MotionEvent;\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener {\n.\n.\n\n    @Override\n    public boolean\
  \ onDown(MotionEvent event) {\n        binding.gestureStatusText.setText (\"onDown\"\
  );\n        return true;\n    }\n\n    @Override\n    public boolean onFling(MotionEvent\
  \ event1, MotionEvent event2,\n                                   float velocityX,\
  \ float velocityY) {\n        binding.gestureStatusText.setText(\"onFling\");\n\
  \        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                                  float distanceX, float distanceY) {\n       \
  \ binding.gestureStatusText.setText(\"onScroll\");\n        return true;\n    }\n\
  \n    @Override\n    public void onShowPress(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onShowPress\");\n    }\n\n    @Override\n    public boolean onSingleTapUp(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapUp\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleTap\");\n      \
  \  return true;\n    }\n\n    @Override\n    public boolean onDoubleEvent(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleEvent\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onSingleTapConfirmed(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n\
  \        return true;\n    }\n}\n```\n\n## 28.4 创建 GestureDetector 实例\n\n现在活动已更新以实现监听器接口，下一步是创建一个`GestureDetectorCompat`的实例。由于只需要在活动创建时执行一次，因此此代码的最佳位置是`onCreate()`方法中：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\n\nimport androidx.view.GestureDetector;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n```\n\n## 28.5 实现 onTouchEvent() 方法\n\n如果此时编译并运行应用程序，即使在设备上执行手势也不会发生任何事情。这是因为还没有添加代码来拦截触摸事件并传递给`GestureDetectorCompat`。为了实现这一点，有必要重写活动类中的`onTouchEvent()`方法并实现它以调用`GestureDetectorCompat`的`onTouchEvent()`方法。因此，留在`MainActivity.java`文件中，实现该方法使其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、长按、滚动动作以及双击和单击。注意文本视图会如图 28-1 所示进行更新：\n\
  \n![](img/Image2425.jpg)\n\n图 28-1\n\n## 28.7 总结\n\n用户与设备触摸屏之间的任何物理接触都可以认为是“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然手势可以由几乎任何动作序列组成，但有一组触摸屏用户所熟悉的广泛使用的手势集。通过使用\
  \ Android 手势检测类，可以在应用程序中轻松检测到许多此类“常见手势”。在本章中，我们从理论和通过示例项目实现两个概述了该技术的使用。\n\n\n\n\n\
  \n上一章涵盖了如何从 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，手势理论上可以涉及 Android 设备屏幕上的几乎任何触摸动作序列。由于这一事实，Android\
  \ SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行这些手势时触发事件。这是一个多阶段的过程，其细节将是本章的主题。\n\n## 29.1\
  \ Android Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后将这些自定义手势存储在与 Android\
  \ 应用程序包捆绑的手势文件中。创建这些自定义手势文件最简单的方法是使用 Android SDK 提供的示例包中附带的 Gesture Builder 应用程序。创建文件的过程涉及在物理设备或模拟器上启动\
  \ Gesture Builder 应用程序，并在灰色画布上“画出”应用程序需要检测的手势。一旦设计好手势，就可以将包含该手势数据的文件从设备或模拟器的 SD\
  \ 卡中提取出来并添加到应用程序项目中。在应用程序代码中，该文件会被加载到 `GestureLibrary` 类的实例中，在该类中可以使用它来搜索用户在设备屏幕上执行的任何手势的匹配项。\n\
  \n## 29.2 GestureOverlayView 类\n\n为了方便在应用程序内检测手势，Android SDK 提供了 `GestureOverlayView`\
  \ 类。这是一个透明视图，可以放置在用户界面其他视图之上，其唯一目的是检测手势。\n\n## 29.3 检测手势\n\n手势的检测是通过加载使用 Gesture\
  \ Builder 应用创建的手势文件，然后在 `GestureOverlayView` 类的实例上注册一个 `GesturePerformedListener`\
  \ 事件监听器来实现的。随后声明封装类同时实现 `OnGesturePerformedListener` 接口以及该接口所需的 `onGesturePerformed`\
  \ 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed` 回调方法的调用。\n\n## 29.4 识别特定手势\n\
  \n当检测对手势时，会调用 `onGesturePerformed` 回调方法，并参数传递检测到手势的 `GestureOverlayView` 对象的引用，以及一个包含手势信息的\
  \ `Gesture` 对象。\n\n通过访问 `Gesture` 对象，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中所包含的手势进行比较。`GestureLibrary`\
  \ 通过计算每个手势的预测得分，报告用户执行的手势与手势文件条目匹配的概率。预测得分为 1.0 或更高通常被认为文件中存储的手势与用户在设备屏幕上执行的手势之间良好匹配。\n\
  \n## 29.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件的简单方法是使用一个允许捕捉并保存手势动作的应用程序。虽然 Google\
  \ 最初提供过一个用于此目的的应用程序，但它在较新的 Android 版本上已没有得到良好的维护。幸运的是，有一个名为 Gesture Builder Tool\
  \ 的替代方案，该程序可以通过以下 URL 从 Google Play 商店获取：\n\n[`play.google.com/store/apps/details?id=migueldp.runeforge`](https://play.google.com/store/apps/details?id=migueldp.runeforge)\n\
  \n## 29.6 创建手势文件\n\n一旦 Gesture Builder Tool 加载，点击设备屏幕底部的 `Create New Gesture` 按钮，并在图\
  \ 29-1 所示所示在灰色画布上使用圆形运动“画出”手势。假设手势如预期所示（由设备屏幕上的黄线表示），点击 `save` 按钮将手势添加到手势文件中，并在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![](img/as_gesture_builder_app.jpg)\n\n图 29-1\n\n手势保存后，Gesture Builder\
  \ Tool 将显示当前定义的手势列表，此时该列表将仅包含新生成的 Circle Gesture。\n\n## 29.7 创建示例项目\n\n从欢迎界面选择 `New\
  \ Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入\
  \ `CustomGestures`，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 `Finish` 按钮之前，将\
  \ Minimum API level 设置为 API 26：Android 8.0 (Oreo)，并将 Language 更改为 `Java`。\n\n##\
  \ 29.8 从 SD 卡提取手势文件\n\n由于每个手势都是在 Gesture Builder 应用程序中创建的，因此它们被添加到名为 `gesture.txt`\
  \ 的文件中，该文件位于运行应用程序的模拟器或设备的存储空间中。然而，在将此文件添加到 Android Studio 项目之前，必须先将其从设备存储中复制并保存到本地文件系统。最简单的方法是使用\
  \ Android Studio 的 `Device File Explorer` 工具窗口。使用 `View -> Tool Windows -> Device\
  \ File Explorer` 菜单选项显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\
  \n在该文件夹中找到 `gesture.txt` 文件，右键点击它，选择 `Save As…` 菜单选项并将文件保存到命名为 `gestures` 的临时位置。\n\
  \n![](img/as_gesture_file.jpg)\n\n图 29-2\n\n一旦从设备存储提取了手势文件，就可以作为资源文件添加到 Android\
  \ Studio 项目中了。\n\n## 29.9 将手势文件添加到项目\n\n在 Android Studio 项目中中找到并右键点击 `app` 下的 `res`\
  \ 文件夹，选择 `New -> Directory`。在 `New Directory` 对话框中输入 `raw` 作为文件夹名称并按回车键。使用适用于您操作系统的文件管理器，找到之前从设备存储提取的\
  \ `gestures` 文件，并将其粘贴到新的 `raw` 文件夹中。\n\n## 29.10 设计用户界面\n\n此示例应用程序需要一个由 `ConstraintLayout`\
  \ 视图的用户界面，并在上方叠加 GestureOverlayView` 以拦截用户执行的手势。找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件，双击它将其加载到布局编辑器并选择并删除默认的 `TextView` 组件。\n\n切换到布局编辑器的 Code 模式并修改 XML 如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n\n    <android.gesture.GestureOverlayView\n\
  \        android:id=\"@+id/gOverlay\"\n        android:layout_width=\"0dp\"\n  \
  \      android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n## 29.11 加载手势文件\n\n\n\n\n\n既然 `gestures` 文件已经添加到项目中，下一步是编写一些代码以便在 Activity\
  \ 启动时加载该文件。对于本项目而言，实现此目的的代码将添加到位于 `MainActivity.java` 源文件的 `MainActivity` 类中，如下所示：\n\
  \n```java\npackage com.ebookfrenzy.customgestures;\n\n.\n\n.\n\nimport android.gesture.GestureLibraries;\n\
  \nimport android.gesture.GestureLibrary;\nimport android.gesture.GestureOverlayView;\n\
  \nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ =\n                GestureLibraries.fromRawResource(this,\n                  \
  \      R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n\
  \        }\n    }\n.\n.\n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将位于原始（raw）资源文件夹的手势文件内容加载到其中。Activity 类也被修改为实现 `OnGesturePerformedListener`\
  \ 接口，这需要实现 `onGesturePerformed` 回调方法（该方法将在本章的后续部分创建）。\n\n### 29.12 注册事件监听器\n\n为了让\
  \ Activity 接收到用户在屏幕上执行手势的通知，必须在 `gLayout` 视图上注册 `OnGesturePerformedListener` 事件监听器。如下面的代码片段所示，可以使用\
  \ `findViewById` 方法获取其引用：\n\n```java\nprivate void gestureSetup() {\n    gLibrary\
  \ =\n            GestureLibraries.fromRawResource(this,\n                    R.raw.gestures);\n\
  \    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView gOverlay\
  \ = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n### 29.13 实现 onGesturePerformed 方法\n\n在对应用程序进行首次测试之前，只需实现 `onGesturePerformed`\
  \ 回调方法。该方法会在在 `GestureOverlayView` 实例上执行手势时被调用：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.Prediction;\n\nimport android.widget.Toast;\n\
  import android.gesture.Gesture;\nimport java.util.ArrayList;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements OnGesturePerformedListener {\n    private\
  \ GestureLibrary gLibrary;\n.\n.\n\n    public void onGesturePerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions =\n   \
  \             gLibrary.recognize(gesture);\n        if (predictions.size() > 0 &&\
  \ predictions.get(0).score > 1.0)\n        {\n            String action = predictions.get(0).name;\n\
  \            Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n        }\n\
  \    }\n.\n.\n.\n}\n```\n\n当 Android 运行时检测到手势覆盖层视图对象上的手势时，就会调用 `onGesturePerformed`\
  \ 方法。传递的参数是检测到手势的 `GestureOverlayView` 对象的引用以及一个 `Gesture` 类型的对象。`Gesture` 类设计用于存储定义特定手势的信息（本质上是屏幕上一系列带时间的点，描述了构成手势的笔画路径）。\n\
  \n`Gesture` 对象被传递给 `gLibrary` 实例的 `recognize()` 方法，其目的是将当前手势与从手势文件中加载的每个手势进行比较。一旦完成此任务，`recognize()`\
  \ 方法将返回一个 `ArrayList` 对象，其中包含每次比较产生的 `Prediction` 对象。列表按照最佳匹配（数组位置 0 处）到最差匹配进行排序。每个预测对象中包含了手势文件中对应手势的名称以及一个指示匹配程度的预测评分。\n\
  \n## 29.14 测试应用程序\n\n在模拟器或物理设备上构建并运行应用程序，然后执行圆形手势。执行后，应该弹出 toast 通知。注意，当手势被识别时，它会在显示器上用亮黄色轮勒显示，而覆盖层不确定的手势则显示为淡线。虽然这在开发期间非常有用，但对于真实应用来说可能并不理想。\n\
  \n### 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为显示黄色线条。用于绘制识别和未识别手势的颜色可以通过\
  \ `gestureColor` 和 `uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请按如下修改 `activity_main.xml`\
  \ 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"@+id/gOverlay\"\
  \n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    android:gestureColor=\"\
  #000000\"\n    android:uncertainGestureColor=\"#000000\" />\n```\n\n重新运行应用程序时，手势现在应该是不可见的（因为它们被绘制在\
  \ `ConstraintLayout` 视图的白色背景上）。\n\n## 29.16 拦截手势\n\n如之前所述，`GestureOverlayView` 是一个可以放置在其他视图之上的透明覆盖层。这引出了一个问题：当识别出手势后，拦截的事件是否应该传递给底层视图。这通过\
  \ `GestureOverlayView` 实例的 `eventsInterceptionEnabled` 属性控制。设置为 true 时，当识别出手势时，事件将不会传递给底层视图。当手势在可能配置滚动的视图上执行时，这可能非常有用的设置。\n\
  \n### 29.17 检测缩放手势\n\n在离开通用触摸处理特别是手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节概述的步骤创建并检测各种范围的手势，但事实上，使用目前讨论的技术无法检测缩放手势（使用两个手指进行拉伸和收缩动作，通常用于缩放视图或图像）。\n\
  \n\n\n\n\n1. 声明一个实现 `SimpleOnScaleGestureListener` 接口的新类，包含所需的 `onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。。\n\
  3. 在外层 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分中，我们将创建一个用于演示缩放手势（pinch gesture）识别实现的示例。\n\n## 29.18 缩放手势示例项目\n\
  \n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n\
  在 `Name` 字段中输入 `PinchExample`，并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为\
  \ `Java`。按照 11.8 Migrating a Project to View Binding 中的步骤将项目转换为使用 view binding。\n\
  \n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用 `Attributes` 属性工具窗口将 `ID` 设置为\
  \ `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android Studio 编辑器中并按所示修改文件：\n\n\
  ```java\npackage com.ebookfrenzy.pinchexample;\n\n.\n.\n\nimport android.view.MotionEvent;\n\
  import android.view.ScaleGestureDetector;\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ =\n                new ScaleGestureDetector(this,\n                        new\
  \ MyOnScaleGestureListener());\n    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent\
  \ event) {\n        scaleGestureDetector.onTouchEvent(event);\n        return true;\n\
  \    }\n\n    public class MyOnScaleGestureListener extends\n            SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n.\n.\n.\n```\n\n该代码定义了一个名为 `MyOnScaleGestureListener`\
  \ 的新类，它继承了 Android 的 `SimpleOnScaleGestureListener` 类。该接口要求实现三个方法（`onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()`）。在此实例中，`onScale()` 方法识别缩放因子并在文本视图上显示指示检测到的缩放手势类型的消息。\n\n在 `onCreate()`\
  \ 方法中创建了一个新的 `ScaleGestureDetector` 实例，并将外层 activity 的引用以及我们新类 `MyOnScaleGestureListener`\
  \ 的实例作为参数传递。最后，为 activity 实现了一个 `onTouchEvent()` 回调方法，它简单地调用了 `ScaleGestureDetector`\
  \ 对象对应的 `onTouchEvent()` 方法，并将 `MotionEvent` 对象作为参数传递。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，然后在屏幕上执行缩放手势，注意文本视图将根据缩放动作显示放大或缩小的消息。在模拟器的独立模式模式下，可以通过按住\
  \ `Ctrl`（或 `Cmd`）键并点击拖动鼠标指针来模拟缩放手势，如图 29-3\n图 29-3\n\n## 29.1 总结\n\n手势本质上是涉及一个或多个点的屏幕接触动作。手势可以在应用程序设计阶段设计并在应用程序中使用。一旦创建，手势就可以保存到文件中并在运行时加载到\
  \ activity 中。\n\n缩放手势可以通过实现 `ScaleGestureDetector` 类来检测，本章也提供了该类的示例。\n\n# 30. Android\
  \ Fragments 简介\n\n随着你对本书章节的深入，你会越来越明显，Android 系统背后的许多设计概念其构思目标是促进不同元素之间的复用和交互。本章将探讨的一个领域涉及\
  \ Fragments 的使用。\n\n本章将概述 fragments 的基础知识，包括它们是什么以及如何创建它们。下一章将通过教程展示 fragments 在开发应用程序时的实际运行情况。\n\
  \n### 30.1 什么是 Fragment？\n\nFragment 是应用程序界面及其相应行为的自包含、模块化部分，可以嵌入到 activity 中。Fragments\
  \ 可以在设计阶段组合以创建一个 activity，并在运行时添加或从 activity 中移除以创建动态变化的用户界面。\n\nFragments 只能作为\
  \ activity 的一部分而不能作为独立元素实例化。尽管如此，fragment 可以被认为是一个功能性的“子 activity”，具有与完整 activity\
  \ 类似的生命周期。\n\nFragments 以 XML 布局文件的形式存储并通过在 activity 的布局文件中放置 `<fragment>` 元素或直接通过\
  \ activity 类中的代码添加到 activity 中。\n\n### 30.2 创建 Fragment\n\n构成 fragment 的两个组件是 XML\
  \ 布局文件和相应的 Java 类。fragment 的 XML 布局格式与任何其他 activity 的布局相同，可以包含任何组合和复杂性的布局管理器和视图。例如，以下\
  \ XML 布局用于一个由红色背景的 `ConstraintLayout` 组成的 fragment，其中包含一个白色前景的 `TextView`：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n```\n\n\n\n\n\n```xml\n          android:layout_width=\"wrap_content\"\n     \
  \     android:layout_height=\"wrap_content\"\n          android:text=\"My First\
  \ Fragment\"\n          android:textAppearance=\"@style/TextAppearance.AppCompat.Large\"\
  \n          android:textColor=\"@color/white\"\n          app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n          app:layout_constraintEnd_toEndOf=\"parent\"\n          app:layout_constraintStart_toStartOf=\"\
  parent\"\n          app:layout_constraintTop_toTopOf=\"parent\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n与布局对应的类必须是 `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment\
  \ 布局。例如：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n  \
  \              ViewGroup container,\n                Bundle savedInstanceState)\
  \ {\n        // 加载此 fragment 的布局\n        binding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()`\
  \ 方法外，该类还可以重写标准的生命周期方法。\n\n一旦创建了 fragment 布局和类，fragment 就可以在应用程序活动（activities）中使用了。\n\
  \n### 30.3 使用布局 XML 文件向 Activity 添加 Fragment\n\n可以通过编写 Java 代码或将 fragment 嵌入到活动的\
  \ XML 布局文件中将其整合到活动中。无论使用哪种方法，需要注意的关键点是，当使用支持库来兼容旧版本的 Android 发布时，任何使用 fragment 的活动都必须实现为\
  \ `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\npackage com.example.myfragmentdemo;\n\
  \nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\nimport\
  \ android.view.Menu;\n\npublic class MainActivity extends FragmentActivity {\n.\n\
  .\n```\n\n使用 `FragmentContainerView` 类将 fragment 嵌入到活动布局文件中。以下示例布局将本章上一节中创建的 fragment\
  \ 嵌入到活动布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n\
  \          android:id=\"@+id/fragment2\"\n          android:name=\"com.ebookfrenzy.myfragmentdemo.FragmentOne\"\
  \n          android:layout_width=\"0dp\"\n          android:layout_height=\"wrap_content\"\
  \n          android:layout_marginStart=\"32dp\"\n          android:layout_marginEnd=\"\
  32dp\"\n          app:layout_constraintBottom_toBottomOf=\"parent\"\n          app:layout_constraintEnd_toEndOf=\"\
  parent\"\n          app:layout_constraintStart_toStartOf=\"parent\"\n          app:layout_constraintTop_toTopOf=\"\
  parent\"\n          tools:layout=\"@layout/fragment_one\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n`<fragment>` 元素中的关键属性是 `android:name`，它必须引用与 fragment 关联的类以及 `tools:layout`，它必须引用包含\
  \ fragment 布局的 XML 资源文件。\n\n一旦添加到活动的布局中，可以在 Android Studio 布局编辑器工具中查看并操作 fragment。例如，图\
  \ 30-1 显示了在 Android Studio 布局编辑器中带有嵌入 fragment 的布局：\n\n![](img/as_4.1_my_first_fragment.jpg)\n\
  \n图 30-1\n\n## 30.4 在代码中添加和管理 Fragment\n\n通过活动的 XML 布局文件向活动添加 fragment 的便利性是以活动无法在运行时移除\
  \ fragment 为代价的。为了在运行时对 fragment 进行完全动态控制，必须通过代码添加这些活动。这种方法的优点是，当应用程序运行期间，可以动态地添加、删除，甚至让\
  \ fragment 相互替换。\n\n当使用代码管理 fragment 时，fragment 本身仍然由一个 XML 布局文件和一个相应的类组成。区别在于在宿主活动中操作\
  \ fragment。使用代码添加 fragment 时有一套标准的步骤序列：\n\n1. 创建 fragment 实例。\n2. 传递任何参数。\n3. 获取\
  \ fragment manager 的引用。\n4. 在 fragment manager 实例上调用 `beginTransaction()`。这返回一个\
  \ fragment 事务实例。\n5. 调用 fragment 实例的 `add()` 方法，将视图的资源 ID 和 fragment 实例作为参数传递。\n\
  6. 调用 fragment 事务的 `commit()` 方法。\n\n例如，以下代码添加了由 `FragmentOne` 定义的 fragment，使其显示在\
  \ ID 为 `LinearLayout1` 的容器中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\n\
  firstFragment.setArguments(getIntent().getExtras());\nFragmentManager fragManager\
  \ = getSupportFragmentManager();\nFragmentTransaction transaction = fragManager.beginTransaction();\n\
  transaction.add(R.id.LinearLayout1);\ntransaction.commit();\n```\n\n上述代码为了清晰，将每个步骤分成了独立的语句。然而，最后四行可以缩减为一行代码：\n\
  \n```java\ngetSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器，随后可以通过调用 fragment 事务实例的 `remove()` 方法移除\
  \ fragment，传递要移除的 fragment 实例：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment 事务的 `replace()` 方法将一个 fragment 替换为另一个。该方法接收新 fragment\
  \ 实例作为参数。被替换的 fragment 还可以放在所谓的回栈（back stack）中，以便在用户返回时快速恢复。这是通过在调用 `commit()` 之前调用\
  \ fragment 事务的 `addToBackStack()` 方法实现的：\n\n```java\nFragmentTwo secondFragment\
  \ = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n### 30.5 处理 Fragment\
  \ 事件\n\n正如前面提到的，fragment 非常像具有布局、类和生命周期的子活动。fragment 内部视图组件（如按钮和文本视图）可以产生事件。这引发了哪个类接收来自\
  \ fragment 视图事件的问题：是 fragment 本身，还是嵌入它的活动？这个问题的答案取决于如何声明事件处理器。\n\n在名为 Android 事件处理概述与示例\
  \ 的章节中，讨论了两种处理事件的方法。第一种方法是在代码中配置事件监听器和回调方法。例如：\n\n```java\nbinding.button.setOnClickListener(\n\
  \    new Button.OnClickListener() {\n        public void onClick(View v) {\n   \
  \         // 点击时执行的代码\n        }\n    });\n```\n\n\n\n\n\n```java\n        // the\
  \ button is clicked\n    }\n}\n);\n```\n\n在拦截点击事件时，第二种方法是在 XML 布局文件中设置 `android:onClick`\
  \ 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  onClick\"\n    android:text=\"Click me\" />\n```\n\nFragment 中的视图生成的事件的通用规则是：如果事件监听器是在\
  \ Fragment 类中通过事件监听器和回调方法声明的，那么该事件将首先由 Fragment 处理。然而，如果使用了 `android:onClick` 资源，事件将直接传递给包含该\
  \ Fragment 的 Activity。\n\n## 30.6 实现 Fragment 间的通信\n\n一旦一个或多个 Fragment 被嵌入到 Activity\
  \ 中，很可能需要在 Fragment 与 Activity 之间、以及 Fragment 之间进行某种形式的通信。事实上，良好的做法是 Fragment 之间不进行直接通信。所有的通信都应该通过封装它们的\
  \ Activity 进行。\n\n为了让 Activity 与 Fragment 建立通信，Activity 必须通过分配给它的 ID 来识别 Fragment\
  \ 对象。一旦获取此引用，Activity 就可以直接调用 Fragment 对象的公共方法。\n\n反向通信（从 Fragment 到 Activity）则稍微复杂一些。首先，Fragment\
  \ 必须定义一个监听器接口，然后在 Activity 类中实现该接口。例如，以下代码在名为 `ToolbarFragment` 的 Fragment 类上声明了一个名为\
  \ `ToolbarListener` 的接口。代码还声明了一个变量，稍后存储 Activity 的引用：\n\n```java\npublic class ToolbarFragment\
  \ extends Fragment {\n    ToolbarListener activityCallback;\n\n    public interface\
  \ ToolbarListener {\n        public void onButtonClick(int position, String text);\n\
  \    }\n.\n.\n}\n```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现名为 `onButtonClick`\
  \ 的回调方法，该方法接受一个整数和一个 `String` 作为参数。\n\n接下来，需要重写并实现 Fragment 类的 `onAttach()` 方法。当\
  \ Fragment 初始化并与 Activity 关联时，Android 系统会自动调用此方法。该方法会接收包含该 Fragment 的 Activity 引用。该方法必须存储该\
  \ Activity 的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n@Override\npublic void\
  \ onAttach(Context context) {\n    super.onAttach(context);\n    try {\n       \
  \ activityCallback = (ToolbarListener) activity;\n    } catch (ClassCastException\
  \ e) {\n        throw new ClassCastException(activity.toString()\n            +\
  \ \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，Activity 的引用将存储在本地变量\
  \ `activityCallback` 中，如果该 Activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\n下一步是从 Fragment\
  \ 内部调用 Activity 的回调方法。何时以及如何发生这种情况完全取决于 Fragment 需要联系 Activity 的情况。例如，以下代码在点击按钮时调用\
  \ Activity 上的回调方法：\n\n```java\npublic void buttonClicked (View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作是修改 Activity 类，使其实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n    implements ToolbarFragment.ToolbarListener\
  \ {\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n.\n.\n}\n```\n\n从上面的代码可以看出，Activity 声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n## 30.7 总结\n\nFragment 为创建可重用的用户界面布局和应用程序行为提供了一种强大的机制，这些模块一旦创建，就可以嵌入到\
  \ Activity 中。Fragment 由一个用户界面布局文件和一个类组成。可以通过将 Fragment 添加到布局文件或通过编写代码在运行时管理 Fragment\
  \ 来使用它们。所有的通信都应该通过 Fragment 所在的 Activity 执行。\n\n# 31. 在 Android Studio 中使用 Fragment\
  \ - 示例\n\n正如上一章所述，Fragment 提供了一种创建可重用用户界面布局和应用程序行为模块的便捷机制。一旦创建，就可以嵌入 Activity 中。在上一章探索了\
  \ Fragment 的整体理论后，本章的目标是使用 Android Studio 创建一个 Android 应用，演示创建和使用 Fragment 的实际步骤。\n\
  \n## 31.1 关于示例 Fragment\n\n本章创建的应用将由一个 Activity 和两个 Fragment 组成。第一个 Fragment 的用户界面将包含一个\
  \ `EditText`、一个 `SeekBar` 和一个 `Button`，都包含在一个 `ConstraintLayout` 视图中。第二个 Fragment\
  \ 将仅包含一个 `TextView`，同样包含在一个 `ConstraintLayout` 视图中。\n\n这两个 Fragment 将嵌入到应用的主 Activity\
  \ 中，并实现通信逻辑：当第一个 Fragment 中的按钮被按下时，输入到 `EditText` 中的文本将出现在第二个 Fragment 的 `TextView`\
  \ 上，字体大小由第一个 Fragment 中 `SeekBar` 的位置决定。由于此应用程序旨在在较早版本的 Android 上运行，因此还有必要使用适当的支持库。\n\
  \n## 31.2 创建示例项目\n\n从欢迎界面选择 New Project 选项，在生成的新项目对话框中选择 Empty Activity 模板，然后点击\
  \ Next 按钮。\n\n在 Name 字段中输入 `FragmentExample`，并指定 `com.ebookrenzy.fragmentexample`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 设置为 Java。按照第 11.8 节“迁移项目到 View Binding”概述的步骤修改项目以使用 view binding。\n\n返回 Gradle\
  \ Scripts -> `build.gradle (Module: FragmentExample.app)` 文件，并在 dependencies 部分添加以下指令（请注意现在可能有更新版本的库）：\n\
  \n```gradle\nimplementation 'androidx.navigation:navigation-fragment:2.5.2'\n```\n\
  \n## 31.3 创建第一个 Fragment 布局\n\n下一步是为将在我们的 Activity 中使用的第一个 Fragment 创建用户界面。\n\n\n\
  \n\n此用户界面将由一个 XML 布局文件和一个 fragment 类的类组成。虽然可以手动添加它们，但让 Android Studio 为我们创建会更快。在项目工具窗口中，找到\
  \ `app -> java -> com -> ebookfrenzy -> fragmentexample` 条目并右键点击它。在弹出的菜单中，选择 `New\
  \ -> Fragment -> Gallery...` 选项显示下方图 31-1 所示的对话框：\n\n![](img/as_4.2_fragment_gallery.jpg)\n\
  图 31-1\n\n在点击 `Next` 按钮之前选择 `Fragment (Blank)` 模板。在后续屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件命名为\
  \ `fragment_toolbar`：\n\n![](img/as_4.2_new_fragment_java.jpg)\n图 31-2\n\n使用 `Design`\
  \ 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器，在 `Component Tree`（组件树）面板中右键点击 `FrameLayout`\
  \ 条目，选择 `Convert FrameLayout to ConstraintLayout` 菜单选项，并在确认对话框中接受默认设置。将 id 从 `frameLayout`\
  \ 改为 `constraintLayout`。选择并删除默认的 `TextView`，向布局中添加一个 `Plain EditText`、`Seekbar`\
  \ 和 `Button`，并将视图 id 分别更改为 `editText1`、`button1` 和 `seekBar1`。\n\n将按钮文本改为“Change\
  \ Text”，将文本提取为名为 `change_text` 的字符串资源，并移除 `EditText` 视图中的 `Name` 文字。最后，将 `Seekbar`\
  \ 的 `layout_width` 属性设置为 `match_constraint`，并将左右边缘边距设置为 `16dp`。\n\n使用 `Infer constraints`（推断约束）工具栏按钮添加任何缺失的约束，此时布局应与下方的图\
  \ 31-3 所示：\n\n![](img/as_4.1_toolbar_fragment_ui.jpg)\n图 31-3\n\n## 31.4 将 Fragment\
  \ 迁移到 View Binding\n\n与 `Empty Activity` 模板一样，当向项目中添加新 fragment 时，Android Studio\
  \ 不会启用视图绑定（view binding）支持。因此，在继续本教程的下一步之前，我们需要进行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件并按如下导入 fragment 的绑定类：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（这包括添加 `onDestroyView()` 方法以确保在 fragment\
  \ 毁时移除绑定引用）：\n\n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\n\
  public View onCreateView(LayoutInflater inflater, ViewGroup container,\n       \
  \                  Bundle savedInstanceState) {\n    // 加载此 fragment 的布局\n    return\
  \ inflater.inflate(R.layout.fragment_toolbar, container, false);\n    binding =\
  \ FragmentToolbarBinding.inflate(inflater, container, false);\n    return binding.getRoot();\n\
  }\n\n@Override\npublic void onDestroyView() {\n    super.onDestroyView();\n    binding\
  \ = null;\n}\n```\n\n完成这些更改后，该 fragment 就可以使用视图绑定了。\n\n## 31.5 添加第二个 Fragment\n\n\
  重复创建 toolbar fragment 的步骤，添加另一个名为 `TextFragment` 的空 fragment，布局文件名为 `fragment_text`。再次将\
  \ `FrameLayout` 容器转换为 `ConstraintLayout`（将 id 改为 `constraintLayout2`）并移除默认的 `TextView`。\n\
  \n从调色板拖入一个 `TextView` 组件并将其放置在布局中心，使用 `Infer constraints` 按钮添加任何缺失的约束。将 `TextView`\
  \ 的 id 改为 `textView2`，文本改为“Fragment Two”，并修改 `textAppearance` 属性为 `Large`。\n\n完成后，布局应与下方的图\
  \ 31-4 所示：\n\n![](img/as_4.0_fragment_text_layout.jpg)\n图 31-4\n\n重复上一节执行的步骤，将 `TextFragment`\
  \ 类迁移到使用视图绑定，如下：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentTextBinding;\n\
  \nprivate FragmentTextBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // 加载此 fragment 的布局\n    return inflater.inflate(R.layout.fragment_text,\
  \ container, false);\n    binding = FragmentTextBinding.inflate(inflater, container,\
  \ false);\n    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView()\
  \ {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n## 31.6 将 Fragments\
  \ 添加到 Activity\n\n应用程序的主活动关联有一个名为 `activity_main.xml` 的 XML 布局文件。为了本例演示，fragment\
  \ 将使用该文件中的 `<fragment>` 元素添加到活动中。使用 Project 窗口，导航到 `app -> res -> layout` 部分并双击\
  \ `activity_main.xml` 将其加载到 Android Studio 布局编辑器。\n\n在 `Design` 模式的布局编辑器中，选择并删除布局中的默认\
  \ `TextView`，并在调色板中选择 `Common` 类别。从列表中拖出 `FragmentView` 组件并将其释放到布局上，使其水平居中，并放置在虚线所示顶部边距的位置：\n\
  \n![](img/as_3.5_fragment_example_add.jpg)\n图 31-5\n\n当将 fragment 释放到布局上时，会出现一个对话框，显示项目中可用的\
  \ Fragments 列表，如图 31-6 所示：\n\n![](img/as_4.1_fragment_list.jpg)\n图 31-6\n\n从列表中选择\
  \ `ToolbarFragment` 条目并点击 `OK` 按钮关闭 Fragments 对话框。添加完成后，点击布局编辑器右上角的红色警告按钮显示警告面板。将列出一条“未知\
  \ fragments”的消息，表示布局编辑器在预览会话期间需要知道显示哪个 fragment。点击错误消息中如图 31-7 所示的 `Pick Layout...`\
  \ 链接：\n\n![](img/as_unkown_fragment.jpg)\n图 31-7\n\n在结果出的对话框（图 31-8）中，选择 `fragment_toolbar`\
  \ 条目，然后点击 `OK` 按钮：\n\n![](img/as_select_fragment.jpg)\n图 31-8\n\n选中 fragment 后，将\
  \ `layout_width` 属性设置为 `match_constraint`，使其占据整个屏幕宽度。从调色板点击并拖入另一个 `FragmentView`\
  \ 条目，并将其使其水平居中并位于第一个 fragment 下方。在提示时，从 fragment 对话框中选择 `TextFragment` 条目，然后点击 `OK`\
  \ 按钮。再次显示错误面板并点击 `Use @layout/fragment_text` 选项。使用 `Infer constraints` 按钮建立任何缺失的布局约束。\n\
  \n注意现在布局中可见 fragments，如图 31-9 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n图 31-9\n\
  \n在继续之前，选择布局中的 `TextFragment` 实例，并在 Attributes 工具窗口将 fragment 的 ID 改为 `text_fragment`。\n\
  \n### 31.7 让 Toolbar Fragment 与 Activity 通\n\n当用户触摸 toolbar fragment 中的按钮时，fragment\
  \ 类将从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送给 text fragment。正如[“Android Fragments\
  \ 简介”(#Fragments.xhtml__idTextAnchor679)]所述，fragment 之间不直接通信，而是使用嵌入它们的活动作为中介。\n\n\
  \n\n此过程的第一步是确保工具栏碎片（toolbar fragment）对按钮的点击做出响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本示例，我们将在\
  \ `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其进行修改，使其内容如下列表所示：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.annotation.Nullable;\nimport android.content.Context;\nimport android.widget.SeekBar;\n\
  \npublic class ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n    @Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.seekBar1.setOnSeekBarChangeListener(this);\n        binding.button1.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n\n    public void\
  \ buttonClicked (View view) {\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress,\n                                  boolean fromUser) {\n\
  \        seekvalue = progress;\n    }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar\
  \ arg0) {\n    }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0)\
  \ {\n    }\n}\n```\n\n在继续之前，我们需要花一些时间解释上述代码更改。首先，该类被声明为实现了 `OnSeekBarChangeListener`\
  \ 接口。这是因为用户界面包含一个 `SeekBar` 实例，而碎片在用户滑动滑条更改字体大小时需要接收这些通知。实现 `OnSeekBarChangeListener`\
  \ 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()` 和 `onStopTrackingTouch()`\
  \ 方法。这些方法已经实现，但实际上只需要 `onProgressChanged()` 方法来执行任务，在本例中，是将新值存储在名为 `seekvalue` 的变量中，该变量在类的开头声明。此外还声明了一个变量用于存储对\
  \ `EditText` 对象的引用。\n\n添加了 `onViewCreated()` 方法以便在按钮上设置 `onClickListener`，它被配置为检测到点击事件时调用名为\
  \ `buttonClicked()` 的方法。该方法随后也被实现，尽管在目前它什么都没做。\n\n此过程的下一阶段是设置监听器，允许碎片在按钮被点击时调用活动（activity）。这遵循上一章节中概述的机制：\n\
  \n```java\npublic class ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n    private FragmentToolbarBinding\
  \ binding;\n    ToolbarListener activityCallback;\n\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n\n  \
  \  @Override\n    public void onAttach(Context context) {\n        super.onAttach(context);\n\
  \        try {\n            activityCallback = (ToolbarListener) context;\n    \
  \    } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\
  \ + \" must implement ToolbarListener\");\n        }\n    }\n\n    public void buttonClicked\
  \ (View view) {\n        activityCallback.onButtonClick(seekvalue, binding.editText1.getText().toString());\n\
  \    }\n}\n```\n\n上述实现将在当用户点击按钮时，在活动类中产生一个名为 `onButtonClick()` 的方法。因此，剩下的工作只是声明活动类实现了新创建的\
  \ `ToolbarListener` 接口并实现 `onButtonClick()` 方法。由于在较早的 Android 版本中使用 Android Support\
  \ Library 来支持碎片，活动也需要更改为继承 `FragmentActivity` 而不是 `AppCompatActivity`。将这些要求结合产生了下面的\
  \ `MainActivity.java` 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.os.Bundle;\n\npublic class MainActivity extends FragmentActivity\
  \ implements ToolbarFragment.ToolbarListener {\n    public void onButtonClick(int\
  \ fontsize, String text) {\n    \n}\n```\n\n按照目前的代码更改，工具栏碎片将检测用户何时点击了按钮，并调用活动上的一个方法，传递\
  \ `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在活动的任务是与 `TextFragment` 通信并传递这些值，以便碎片可以更新\
  \ `TextView` 对象。\n\n### 31.8 让活动与 TextFragment 碎片进行通信\n\n正如“Android 碎片简介”中所概述的，活动可以通过获取碎片类实例的引用，然后在该对象上调用公共方法与碎片进行通信。因此，在\
  \ `TextFragment` 类中，我们现在实现一个名为 `changeTextProperties()` 的公共方法，该方法接收一个字体大小的整数和一个用于显示的新文本的字符串。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\npublic class TextFragment extends\
  \ Fragment {\n\n    public void changeTextProperties(int fontsize, String text)\
  \ {\n        binding.textView2.setTextSize(fontsize);\n        binding.textView2.setText(text);\n\
  \    }\n}\n```\n\n当 `TextFragment` 碎片放置在活动的布局中时，它被赋予了 ID `text_fragment`。使用此 ID，活动现在可以获取碎片的引用并调用该对象的\
  \ `changeTextProperties()` 方法。编辑 `MainActivity.java` 文件并如下修改 `onButtonClick()` 方法：\n\
  \n```java\npublic void onButtonClick(int fontsize, String text) {\n    TextFragment\
  \ textFragment = (TextFragment) getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n## 31.9 测试应用程序\n\
  \n随着该项目的代码编写完成，最后的任务是运行应用程序。当应用程序启动时，主活动将启动，并相应创建显示两个碎片。当用户触摸工具栏碎片中的按钮时，活动的 `onButtonClick()`\
  \ 方法将被工具栏碎片调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 视图的当前值。然后活动将调用第二个碎片的 `changeTextProperties()`\
  \ 方法，这将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n## 31.10 总结\n\n本章旨在演示在 Android 应用程序中使用碎片的步骤。涵盖的主题包括使用 Android Support\
  \ Library 以兼容碎片引入之前的 Android 版本、在活动布局中包含碎片以及碎片间通信的实现。\n\n\n\n\n直到最近，Google 并没有为构建\
  \ Android 应用推荐特定的方法，而是提供工具和开发工具包，让开发者自行决定什么方案最适合特定的项目或个人编程风格。这种情况在 2017 年随着 Android\
  \ 架构组件（Android Architecture Components）的引入发生了改变，这些组件随后在 2018 年发布成为 Android Jetpack\
  \ 的一部分。\n\n本章的目的是概述 Jetpack 的概念、Android 应用架构建议以及一些关键架构组件。在介绍基础知识后，将在后续章节中对这些主题进行详细介绍，并通过实际示例进行演示。\n\
  \n## 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 `Android Studio`、`Android Architecture\
  \ Components` 和 `Android Support Library`组成，并包含了一组关于 Android 应用结构的指南。`Android Architecture\
  \ Components` 的设计目的是为了让开发者在开发 Android 应用时既能更快速、更方便地执行常用任务，又能符合架构指南的核心原则。\n\n虽然本书书将涵盖所有的\
  \ `Android Architecture Components`，但本章的目标是介绍关键的架构指南以及 `ViewModel`、`LiveData`、`Lifecycle`\
  \ 组件，同时介绍 `Data Binding`（数据绑定）和 `Repositories`（存储库）的使用。\n\n在继续之前，重要的是理解 Jetpack\
  \ 应用开发方法并非强制性的。虽然 Google 强调了一些多年来流行的其他技术的缺点，但它并没有完全谴责那些应用开发方法。Google 似乎采取了这样立场：虽然开发应用的方法没有绝对的对错之分，但存在一种被推荐的方法。\n\
  \n## 32.2 “旧”架构\n\n在标题为在 Android Studio 中创建示例 Android 应用的章节中，创建了一个由单个 activity 组成的\
  \ Android 项目，该 activity 包含了显示和管理用户界面的所有代码，以及应用的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，即应用由多个\
  \ activity（应用中的每个屏幕各对应一个）组成，每个 activity 类在某种程度上都混合了用户界面代码和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时，activity\
  \ 被销毁并重建，导致任何未保存到持久化存储形式的应用数据丢失），以及诸如导航效率低下等问题（涉及到用户访问的每个应用屏幕都要启动一个新的 activity）。\n\
  \n## 32.3 现代 Android 架构\n\n在最基础层面，Google 现在提倡单 activity 应用，将不同的屏幕作为内容加载到同一个 activity\
  \ 中。\n\n现代架构指南还建议将应用中不同的职责划分到完全独立的模块中（Google 将此称为“关注点分离”）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n## 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将与用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码分离。当按照这种方式设计时，应用将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n实际上，`ViewModel` 只知道数据模型和相应的逻辑。它完全不知道用户界面，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供数据即可。同样，当用户在用户界面的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内被重建了多少次，`ViewModel` 实例都会保留在内存中，从而保持数据一致性。例如，activity\
  \ 使用的 `ViewModel` 将一直留在内存中，直到 activity 完全结束（在单 activity 应用中，这意味着直到应用退出才会结束）。\n\n\
  ![](img/jetpack_diagram_1.jpg)\n\n图 32-1\n\n## 32.5 LiveData 组件\n\n考虑一个显示实时数据（如金融股票当前价格）的应用。该应用可能会使用某种形式的股票价格网络服务，用最新信息持续更新\
  \ `ViewModel` 中的数据模型。显然，如果不能及时显示给用户，这些实时数据将无用用处。UI 控制器只有两种方式可以确保在用户界面中显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel`，以确定数据自上次显示以来是否发生了变化。然而，这种方法的问题是效率低下。为了保持数据馈送的实时性，UI 控制器必须在循环中运行，不断检查数据是否变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 中的特定数据项发生变化时接收通知。这是通过使用 `LiveData` 组件实现的。`LiveData`\
  \ 是一个数据持有者，允许一个值变得可观察。简单来说，可观察对象具有在其数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel`\
  \ 中的数据匹配的问题。\n\n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置观察者，观察者会在值变化时接收通知。例如，在我们假设的应用中，股票价格将被封装在\
  \ `ViewModel` 中的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。该方法在数据变化触发时，将从 `ViewModel`\
  \ 读取更新后的值并用其更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 32-2\n\n`LiveData` 实例也可以被声明为可变的，允许观察实体更新\
  \ `LiveData` 对象持有的底层值。使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 activity 包含一个\
  \ `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 生命周期周期状态的变化并做出相应响应。如果 activity 暂停（例如应用进入后台），`LiveData`\
  \ 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便\
  \ activity 拥有最新的值。同样，`LiveData` 实例会在 activity 销毁时知道移除观察者以释放资源。\n\n到为止，我们只讨论了 UI\
  \ 控制器使用观察者。然而，在实践中，观察者可以在任何符合 Jetpack 生命周期管理方法的对象中使用。\n\n## 32.6 ViewModel Saved\
  \ State\n\n\n\n\n\nAndroid 允许用户将活跃的应用置于后台，并在在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源不足时，操作系统将通过终止后台应用进程来纠正，并从最久未使用的应用开始。然而，当用户返回被终止的后台应用时，无论它是否被终止，它都应该以其进入后台时的相同状态出现。对于与\
  \ `ViewModel` 关联的数据，可以通过利用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在系统发起的进程终止时恢复，该主题将在本章标题为\
  \ Android ViewModel 保存状态教程”的章节中介绍。\n\n## 32.7 LiveData 和数据绑定\n\nAndroid Jetpack\
  \ 包含了 Data Binding 库，它允许将 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的 `AndroidSample`\
  \ 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许在 XML 布局文件中直接引用存储在\
  \ `ViewModel` 中的 `LiveData` 值，避免了编写代码来更新布局视图的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据绑定将从标题为 “Android Jetpack 数据绑定概览”的章节开始进行详细介绍。\n\n## 32.8 Android 生命周期\n\
  \n从 Android 组件创建到其被销毁的时间被称为生命周期。在这一生命周期内，组件将在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，`activity`\
  \ 将从初始化状态开始，然后过渡到创建状态。一旦活动开始运行，它将切换到启动状态，从该状态开始将循环经过包括创建、启动、恢复和销毁在内的各种状态。\n\n许多\
  \ Android 框架类和组件允许其他对象访问其当前状态。可以使用生命周期观察者（Lifecycle observers），以便对象在另一个对象的生命周期状态更改时接收通知。这是\
  \ `ViewModel` 组件在背后用于识别观察者何时重启或被销毁所采用的技术。此功能不仅限于 Android 框架和架构组件，也可以内置到任何使用架构组件包含的一套生命周期组件的其他类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命周期感知（lifecycle-aware），而提供其生命周期状态访问的对象被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为\
  \ “与 Android 生命周期感知组件协作”的章节中进行更详细的介绍。\n\n## 32.9 仓库模块\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与\
  \ `ViewModel` 类分离是至关重要的。否则，这样做将违反关注点分离（separation of concerns）的指南原则。为了避免将此功能与 `ViewModel`\
  \ 混合，Google 的架构指南建议将此代码放在单独的 `Repository`（仓库）模块中。\n\n仓库不是 Android 架构组件，而是应用开发者创建的\
  \ Java 类，负责与各种数据源进行交互。该类随后为 `ViewModel` 提供一个接口，允许将数据存储在模型中。\n\n![](img/Jetpack_diagram_4.jpg)\n\
  \n图 32-4\n\n## 32.10 总结\n\n直到最近，Google 倾向于不推荐构建 Android 应用的特定方法。随着 Android Jetpack\
  \ 的引入，情况现在发生了变化，Android Jetpack 包含了一套工具、组件、库和架构指南。Google 现在建议将应用项目分成单独的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\
  \n特别是，指南建议将应用的视图数据模型与负责处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集数据的代码应该构建在单独的仓库模块中，而不是与视图模型捆绑。\n\
  \nAndroid Jetpack 包含了 Android 架构组件，这些组件专门设计设计，以便更更容易地开发符合推荐指南的应用。本章介绍了 `ViewModel`、`LiveData`\
  \ 和 `Lifecycle` 组件。这些将从下一章开始进行更详细的介绍。本章中未提到的其他架构组件将在书的后部分介绍。\n\n# 33. 一个 Android\
  \ Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念，并概述了现代 Android 应用架构的基础。Jetpack\
  \ 本质上定义了一套描述 Android 应用项目应该如何构建的建议，同时提供了一套库和组件，使其更容易符合这些指南，其目标是用更少的代码和更少的错误开发可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步演示一个使用 `ViewModel` 组件的示例应用项目的创建。该示例将在下一章中通过包含 `LiveData`\
  \ 和数据绑定的支持得到进一步增强。\n\n## 33.1 关于项目\n\n在标题为 “在 Android Studio 中创建示例 Android 应用”的章节中，创建了一个名为\
  \ `AndroidSample` 的项目，其中应用的所有代码都捆装在主 `Activity` 类文件中。在随后的章节中，创建并使用了一个 `AVD` 模拟器来运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时，设备旋转会导致\
  \ `TextView` 上的数据丢失的问题。\n\n本章将实现相同的货币转换器，但这次使用 `ViewModel` 组件并遵循 Google 架构指南以避免\
  \ Activity 的复杂性。\n\n## 33.2 创建 ViewModel 示例项目\n\n本练习的第一步是创建一个新项目。首先启动 Android Studio，如果有必要，使用\
  \ `File -> Close Project` 菜单关闭任何打开的项目，以便显示欢迎界面。\n\n当创建 `AndroidSample` 项目时，选择了 `Empty\
  \ Activity` 模板作为项目的基础。然而，对于本项目，将使用 `Fragment + ViewModel` 模板。这将生成一个符合架构指南的 Android\
  \ Studio 项目。\n\n在欢迎屏幕上选择 New Project 选项，并在出现的新项目对话框中选择 `Fragment + ViewModel` 模板，然后点击\
  \ Next 按钮。\n\n在 Name 中输入 `ViewModelDemo`，将 Minimum API 级别设置为 `API 26: Android 8.0\
  \ (Oreo)`并将 Language 菜单更改为 Java。编辑 `build.gradle (Module: ViewModelDemo.app)` 文件，启用视图绑定并点击编辑器面板顶部的\
  \ Sync Now 链接：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding\
  \ true\n    }\n}\n```\n\n## 33.3 审查项目\n\n\n\n\n\n当使用 `Fragment` + `ViewModel` 模板创建项目时，其结构在许多方面与创建\
  \ `AndroidSample` 项目时使用的 `Empty Activity` 有何。项目的关键组件如下：\n\n### 33.3.1 主 Activity\
  \ (MainActivity)\n\n需要注意的第一点是，主 Activity 的用户界面结构经过设计，允许单个 Activity 作为完成后的应用所需的所有屏幕的容器。Activity\
  \ 主用户界面布局包含在 `app -> res -> layout -> activity_main.xml` 文件中，并以 `FrameLayout`的形式提供了一个空容器（在图\
  \ 33-1 中突出），屏幕内容将显示其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n### 33.3.2 内容 Fragment (Content Fragment)\n\n`FrameLayout` 容器只是一个占位符，运行时会被应用启动时显示的第一个屏幕的内容替换。该内容通常以\
  \ `Fragment`的形式存在，由一个 XML 布局资源文件和一个相应的类文件组成。事实上，在创建项目时，Android Studio 已经为此目的创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> fragment_main.xml` 找到，并在加载到布局编辑器时将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 包含一个显示“MainFragment”文本的 `TextView`，但已准备好被修改以包含应用第一个屏幕的布局。此时值得花时间查看 Android Studio\
  \ 已生成的用于在 Activity 容器区域显示此 fragment 的代码。\n\n将 `FrameLayout` 占位符替换为 fragment 的开始于\
  \ `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）。关键代码出现在该类的\
  \ `onCreate()` 方法中，并将容器 ID（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow();\n    }\n}\n```\n\n伴随 fragment\
  \ 的代码可以在 `MainFragment.java` 文件中找到（`app -> <package name> -> ui.main -> MainFragment`）。类文件中包含\
  \ `onCreateView()` 方法，它在 fragment 创建时被调用。此方法加载 `fragment_main.xml` 布局文件，使其在主 Activity\
  \ 布局的容器区域显示：\n\n```java\n@Override\npublic View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n    return inflater.inflate(R.layout.fragment_main, container, false);\n}\n\
  ```\n\n### 33.3.3 ViewModel\n\nActivity 的 `ViewModel` 包含位于 `app -> java -> ui.main\
  \ -> MainViewModel` 的 `MainViewModel.java` 类文件中。它被声明为 `ViewModel` Android 架构组件类的子类，并准备好被修改以存储应用的数据模型：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    // TODO: Implement the ViewModel\n\
  }\n```\n\n## 33.4 设计 Fragment 布局\n\n下一步是设计 fragment 的布局。在 Project（项目）工具窗口中找到 `fragment_main.xml`\
  \ 文件并双击它将其加载到布局编辑器。加载完成后，选择现有的 `TextView` 控件并使用 Attributes（属性）工具窗口将 `id` 属性更改为 `resultText`。\n\
  \n从调色板中拖入一个 `Number (Decimal)` 视图并将其放置在现有 `TextView` 之上。在布局中选中该视图后，引用 Attributes\
  \ 工具窗口并将 `id` 更改为 `dollarText`。\n\n将一个 `Button` 控件拖到布局中，使其位于 `TextView` 之下，并将文本属性更改为“Convert”。在按钮仍处于选中的状态时，将\
  \ `id` 属性更改为 `convertButton`。此时，布局应该类似于图 33-3 中所示（注意这三个视图已使用垂直链进行了约束）：\n\n![](img/as_4.2_viewmodeldemo_ui.jpg)\n\
  \n图 33-3\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n## 33.5 实现 View Model\n\n完成用户界面布局后，需要在\
  \ view model 中创建应用的数据模型。在 Project 工具窗口中，找到 `MainViewModel.java` 文件，双击将其加载到代码编辑器并修改类，使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText) * rate;\n    }\n\n    public\
  \ Float getResult() {\n        return result;\n    }\n}\n```\n\n## 33.6 将 Fragment\
  \ 与 ViewModel\n\n显然，fragment 需要某种方式来获取 ViewModel 的引用，以便访问模型并观察数据变化。Fragment 或 Activity\
  \ 使用 `ViewModelProvider` 实例来维护其依赖的 ViewModel。\n\n在 Fragment 内部使用 `ViewModelProvider`\
  \ 类创建 `ViewModelProvider` 实例。调用时，类初始化器接收当前 Fragment 或 Activity 的引用并返回 `ViewModelProvider`\
  \ 实例：\n\n```java\nViewModelProvider viewModelProvider = new ViewModelProvider(this);\n\
  ```\n\n一旦创建了 `ViewModelProvider` 实例，即可调用该实例 `get()` 方法并传入所需的 `ViewModel` 类。提供者将创建该\
  \ `ViewModel` 类的新实例，或返回一个现有实例：\n\n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n\
  ```\n\n编辑 `MainFragment.java` 文件并验证 Android Studio 是否已在 `onCreate()` 方法中包含了此步（尽管为了简洁在一行代码中完成了操作）：\n\
  \n```java\nviewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\
  \n## 33.7 修改 Fragment\n\n现在需要更新 fragment 类以响应按钮点击，并与 ViewModel 中存储的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前的美元值以及显示转换后的货币金额。\n\
  \n\n\n\n\n在标题为“在 Android Studio 中创建一个 Android 示例”的章节中，`Button` 控件的 `onClick` 属性被用于指定用户点击按钮时要调用的方法。遗憾的是，该属性只能调用\
  \ `Activity` 上的方法，而无法用于调用 `Fragment` 中的方法。为了绕过这一局限性，我们需要在 `Fragment` 类中添加一些代码，以在按钮上设置\
  \ `onClick` 监听器。这可以通过在下文所示的 `MainFragment.java` 文件中重写 `onViewCreated()` 生命周期方法来实现。在进行这些更改时，我们还将转换\
  \ fragment，使其使用视图绑定（view binding）：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.databinding.FragmentMainBinding;\n\
  \npublic class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater,\n              \
  \               @Nullable ViewGroup container,\n                             @Nullable\
  \ Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n        binding = FragmentMainBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onViewCreated(@NonNull View view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n        });\n    }\n}\n\
  ```\n\n添加监听器后，每当用户点击按钮时，放置 `onClick()` 方法中的任何代码都会被调用。\n\n## 33.8 访问 ViewModel 数据\n\
  \n当点击按钮时，`onClick()` 方法需要从 `EditText` 视图中读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的 `setAmount()`\
  \ 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法，并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未使用\
  \ `LiveData`，因此在每次创建 `Fragment` 时，都有必要从 `ViewModel` 中获取最新的结果值。\n\n在 `MainFragment.java`\
  \ 文件中，在 `onViewCreated()` 方法按如下方式实现这些要求：\n\n```java\nimport java.util.Locale;\n\n\
  @Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n \
  \           mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n        \
  \            binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                    mViewModel.getResult()));\n        } else {\n     \
  \       binding.resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n\
  ## 33.9 测试项目\n\n添加监听器后，每当用户点击按钮时，放置 `onClick()` 方法中的任何代码都会被调用。\n\n当点击按钮时，`onClick()`\
  \ 方法需要从 `EditText` 视图中读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的 `setAmount()` 方法。随后，该方法需要调用\
  \ `ViewModel` 的 `getResult()` 方法，并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未使用 `LiveData`，因此在每次创建\
  \ `Fragment` 时，都有必要从 `ViewModel` 中获取最新的结果值。\n\n当点击按钮时，`onClick()` 方法需要从 `EditText`\
  \ 视图中读取当前值，确认该字段为空，然后调用 `ViewModel` 实例的 `setAmount()` 方法。随后，该方法需要调用 `ViewModel`\
  \ 的 `getResult()` 方法，并将转换后的值显示在 `TextView` 控件上。\n\n由于项目尚未使用 `LiveData`，因此在每次创建 `Fragment`\
