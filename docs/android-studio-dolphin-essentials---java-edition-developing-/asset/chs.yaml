  当数据绑定与 `LiveData` 组件结合使用时，会变得格外强大。例如，考虑使用数据绑定将一个 `EditText` 视图绑定到 `ViewModel` 内部的\
  \ `LiveData` 变量。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText` 视图中；当使用双向绑定时，在\
  \ `EditText` 中输入的任何数据都将自动用于更新 `LiveData` 的值。可能最令人印象深刻的是，实现这一点除了初始设置绑定所需的代码之外，无需编写任何代码。\n\
  \n传统上，将 `Button` 控件等交互式视图连接到 `UI controller` 中的方法时，需要开发者编写代码来实现一个监听器方法，以便在点击按钮时调用。而数据绑定使得这一切变得简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要被调用的方法即可。\n\n## 35.2 数据绑定的核心组件\n\n默认情况下，Android Studio\
  \ 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些元素涉及项目构建配置、布局 XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来这可能有些无从从，但分开来看，这些实际上是非常简单的步骤，一旦完成，在节省编码工作量方面是非常值得的。在本章的剩余部分中，将详细介绍这些元素中的每一个。在涵盖了这些基础知识后，下一章将通过详细的教程在实际中演示这些步骤。\n\
  \n### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先配置为使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，只需在模块级\
  \ `build.gradle` 文件中添加几行代码即可实现（该文件在项目工具窗口的 Gradle Scripts 下，显示为 `build.gradle (Module:\
  \ app)`）。以下列表列出了一个启用了数据绑定的部分构建文件：\n\n```gradle\nandroid {\n    buildFeatures {\n\
  \        dataBinding = true\n    }\n}\n```\n\n### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在这些布局文件中的视图能够利用数据绑定之前，必须先将布局文件转换为数据绑定布局文件。\n\n正如书前面概述的，XML 布局文件定义了布局中组件的层级结构，从顶层或根视图开始。根视图总是采用布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，就像 `ViewModelDemo` 项目中的 `fragment_main.xml`\
  \ 文件所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够使用数据绑定，布局层级必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父视图。\n\n在上述示例的情况下，这需要对现有的布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据元素\n\n数据布局文件需要某种方式来声明视图绑对应的类（例如 `ViewModel`）。在声明这些类后，布局文件还需要一个变量来引用它们。这是通过使用\
  \ `data` 元素实现的，示例所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"viewModel\"\n            type=\"com.example.myapp.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n[/content]\n\
