  \")) {\n            float dollarValue = Float.parseFloat(\n                binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```java\nString.format(Locale.ENGLISH,\"%f\"\
  , euroValue));\n\n} else {\n    binding.textView.setText(R.string.no_value_string);\n\
  }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时也创建一个名为 `MainActivity.java` 的初始化 Activity。如上面的代码所示，`MainActivity`\
  \ 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity` 类的引用文档可以发现，它本身也是 `Activity`\
  \ 类的子类。在 Android Studio 编辑器中使用 `Hierarchy` 工具窗口窗口可以验证这一点。在编辑器中加载 `MainActivity.java`\
  \ 文件后，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。随后会弹出层级工具窗口，显示所选类的类层级结构。如图\
  \ 13-1 所示，`AppCompatActivity` 显然继承自 `FragmentActivity` 类，而 `FragmentActivity` 最终也是\
  \ `Activity` 类的子类：\n\n![](img/as_3.6_class_heirachy.jpg)\n\n图 13-1\n\n`Activity`\
  \ 和 `Fragment` 类包含了一系列方法，旨在由 Android 运行时调用，以便在状态发生变化时通知对象。在本章中，我们将这些方法称为生命周期方法。Activity\
  \ 或 fragment 类只需要重写这些方法并在其中实现必要的功能，以对状态变化做出相应响应。\n\n其中一个方法名为 `onCreate()`，再次回到上面的代码片段，我们可以看到该方法已经在\
  \ `MainActivity` 类中为我们重写并实现。在随后的章节中，我们将详细探 ` `onCreate()` 以及 `Activity` 和 `Fragment`\
  \ 类的其他相关生命周期方法。\n\n## 13.3 动态状态 vs. 持久状态\n\n生命周期管理的关键目标是确保 Activity 的状态在适当的时间被保存和恢复。当我们在此语境下讨论状态时，指的是当前在\
  \ Activity 中保存的数据以及用户界面的显示。例如，Activity 可能在内存中维护一个数据模型，该模型需要保存到数据库、内容提供程序或文件中。这种状态信息因为从一次应用程序调用到另一次调用持续存在，因此被称为**持久状态**。\n\
  \n用户界面的显示（例如输入到文本框但尚未提交到应用程序内部数据模型的文本）被称为**动态状态**，因为它通常只在应用程序的单调用期间保留（也称为用户界面状态或实例状态）。\n\
  \n理解这两种状态之间的差异非常重要，因为它们保存的方式以及保存的原因都是不同的。\n\n保存持久状态的目的是避免 Activity 在后台运行时被运行时系统杀死而导致的数据丢失。另一方面，动态状态的保存和恢复的原因稍微复杂一些。\n\
  \n例如，假设应用程序包含一个 Activity（我们将其称为 `Activity A`），该 包含一个文本框和一些单选按钮。在使用应用程序的过程中，用户在文本框中输入了一些文本并在单选按钮上进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ Activity，导致 `Activity A` 被推入 Activity 堆栈（`Activity Stack`）并被置于后台。一段时间后，运行时系统确定内存不足，因此杀死了\
  \ `Activity A` 以释放资源。然而，对于用户来说，`Activity A` 只是被放到了后台，并随时准备移动到前台。当返回 `Activity A`\
  \ 到前台时，用户会理所当然地预期输入的文本和单选按钮的选择已被保留。在这种情况下，将创建一个 `Activity A` 的新实例，如果动态状态没有被保存和恢复，之前的用户输入就会丢失。\n\
  \n因此，保存动态状态的主要目的是提供一种在前台和后台 Activity 之间进行无缝切换的感知，无论 Activity 实际上可能在用户不知情的情况下被杀死并重启。\n\
  \n保存持久和动态状态的机制将在本章的后续章节中变得更加清晰。\n\n### 13.4 Android 生命周期周期方法\n\n如前所述，`Activity`\
  \ 和 `Fragment` 类包含许多生命周期方法，它们在实例状态更改时充当事件处理器。Android `Activity` 和 `Fragment` 类支持的主要方法如下：\n\
  \n- `onCreate(Bundle savedInstanceState)` – 当 Activity 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个\
  \ `Bundle` 对象形式的参数，该参数可能包含来自 Activity 之前调用的动态状态信息（通常与用户界面状态有关）。\n- `onRestart()`\
  \ – 当 Activity 在之前被运行时系统停止后准备重启时调用。\n- `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()`\
  \ 方法后立即调用，此方法通知 Activity 它即将对用户可见。如果 Activity 移动到 Activity 堆栈的顶部，则此调用之后将将调用 `onResume()`；如果它被另一个\
  \ Activity 推入堆栈，则将调用 `onStop()`。\n- `onResume()` – 表示 Activity 现在位于 Activity 堆栈的顶部，并且是用户当前正在交互的\
  \ Activity。\n- `onPause()` – 表示之前的 Activity 即将成为前台 Activity。此调用之后将调用 `onResume()`\
  \ 或 `onStop()` 方法，取决于 Activity 是移回前台还是变为不可。在此方法中可以采取措施存储尚未由应用保存的持久状态信息。为了避免切换 Activity\
  \ 延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。\n- `onStop()` – Activity 不对用户可见。此调用之后可能的两种场景是：再次回到前台时调用\
  \ `onRestart()`，或者 Activity 终止时调用 `onDestroy()`。\n- `onDestroy()` – Activity 即将销毁，要么是因为\
  \ Activity 完成任务并调用了 `finish()` 方法，要么是因为运行时为了释放内存或由于配置更改（如设备方向改变）而终止它。需要注意的是，终止时并不总是调用\
  \ `onDestroy()`。\n- `onConfigurationChanged()` – 当发生 Activity 已指示不会重启的配置更改时调用。该方法传递一个\
  \ `Configuration` 对象，概述了新的设备配置，随后响应该更改是 Activity 的责任。\n\n以下生命周期方法仅适用于 `Fragment`\
  \ 类：\n\n- `onAttach()` – 当 Fragment 分配给 Activity 时调用。\n- `onCreateView()` – 用于创建并返回\
  \ Fragment 的用户界面布局视图层级结构。\n- `onViewCreated()` – 在 `onCreateView()` 返回后调用。\n- `onStatusRestored()`\
  \ – Fragment 保存的视图层级结构已恢复。\n\n\n\n\n\n上述上述出的生命周期方法外，还有两个专门用于保存和恢复 activity 动态状态的方法：\n\
  \n- `onRestoreInstanceState(Bundle savedInstanceState)` – 当 activity 从之前保存了状态的调用中重启时，该方法会在调用\
  \ `onStart()` 方法后立即被调用。与 `onCreate()` 类似，该方法会接收一个包含之前状态数据的 `Bundle` 对象。该方法通常用于此类情况：即在\
  \ `onCreate()` 和 `onStart()` 中完成 activity 的初始化后，恢复之前的状态在逻辑上更具合理性。\n- `onSaveInstanceState(Bundle\
  \ outState)` – 在 activity 被销毁之前调用，以便可以保存当前的动态状态（通常与用户界面有关）。该方法会传递一个 `Bundle` 对象，状态应保存到该对象中，并在\
  \ activity 重启时，该对象会被随后传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，只有在运行时确定需要保存动态状态时，此方法才会被调用。\n\
  \n在重写上述方法时，必须记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法的实现必须包含对父类中对应方法的调用。例如，下面的方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例方法的调用：\n\n```java\nprotected void onRestart() {\n \
  \   super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n```\n\n如果在方法重写中未调用此父类方法，将导致运行时在执行期间抛出异常。虽然在\
  \ `onRestoreInstanceState()` 和 `onSaveInstanceState()` 方法中调用父类是可选的（例如，在实现自定义的保存和恢复行为时可以省略它们），但使用它们有许多益处，这一主题将在题为保存和恢复\
  \ Android Activity 状态的章节中进行介绍。\n\n## 13.5 生命周期 (Lifetimes)\n\n最后一个要涵盖的主题涉及 activity\
  \ 或 fragment 在执行过程中将经历的整个可见和前台生命周期概述：\n\n- **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从初始调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- **可见生命周期 (Visible Lifetime)**\
  \ – 涵盖了调用 `onStart()` 和 `onStop()` 之间的执行期间。在此期间，activity 或 fragment 对用户是可见的，尽管它可能不是用户当前正在交互的实例。\n\
  - **前台生命周期 (Foreground Lifetime)** – 指在调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\
  \n需要注意的是，activity 或 fragment 在整个生命周期期间可能会多次经过前台和可见生命周期。\n\n生命周期和生命周期方法的概念在图 13-2\
  \ 中所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\
  \n## 13.6 折叠屏设备与多恢复 (Foldable Devices and Multi-Resume)\n\n正如之前讨论的，当 activity 移动到前台并是用户当前交互的\
  \ activity 时，它被认为处于恢复状态。在标准设备上，一个应用任何时候只能有一个 activity 处于恢复状态，而所有其他 activity 都可能处于暂停或停止状态。\n\
  \n长期以来，Android 一直包含了多窗口支持，允许多个 activity 同时在分屏或自由窗口配置中出现。虽然此功能最初主要用于大屏幕平板设备，但随着折叠屏设备的引入，它可能会变得更加流行。\n\
  \n在运行 Android 10 且启用多窗口支持的设备上（大多数折叠屏设备也是如此），多个应用 activity 可能同时处于恢复状态（这一概念被称为“多恢复”，multi-resume），允许这些可见的\
  \ activity 即使在另一个 activity 当前拥有焦点的情况下继续运行（例如流媒体内容或更新视觉数据）。尽管多个 activity 可以处于恢复状态，但这些\
  \ activity 中只有一个会被视为最顶层的恢复 activity（换句话说，就是用户最近交互的 activity）。\n\nactivity 可以通过实现\
  \ `onTopResumedActivityChanged()` 回调方法来接收获得或丢失顶层恢复状态的通知。\n\n## 13.7 禁用配置更改重启 (Disabling\
  \ Configuration Change Restarts)\n\n正如之前概述的，activity 可以指明在某些配置更改发生时不重启。这是通过在项目清单文件（manifest）的\
  \ activity 元素中添加 `android:configChanges` 指令实现的。例如，下面的清单文件片段表明在发生与方向或全局字体大小相关的配置更改时，不重启该\
  \ activity：\n\n```xml\n<activity android:name=\".MainActivity\"\n         android:configChanges=\"\
  orientation|fontScale\"\n         android:label=\"@string/app_name\">\n```\n\n##\
  \ 13.8 生命周期方法的局限性 (Lifecycle Method Limitations)\n\n正如在本章开头提到的，生命周期方法已经使用了多年，直到最近它们一直是处理\
  \ activity 和 fragment 生命周期周期状态变化的唯一可用机制。然而，这种方法存在缺点。\n\n生命周期方法的一个问题是，它们没有提供一种简单的方法让\
  \ activity 或 fragment 在应用执行的任何一点发现其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\n\
  此外，这些方法没有提供简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为应用中的许多其他对象都可能受到特定 activity\
  \ 或 fragment 生命周期周期状态变化的影响。\n\n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期的自定义类。\n\
  \n最后，生命周期方法导致大多数生命周期处理代码写在 activity 或 fragment 中，这可能导致代码变得复杂且易出错。理想情况下，这部分代码应该位于受状态变化影响的其他类中。例如，一个视频流媒体应用可能会包含一个专门设计用于管理输入流的类。如果应用需要在主\
  \ activity 停止时暂停流，那么执行该操作的代码应该位于流类中，而不是主 activity 中。\n\n所有这些问题以及更多问题都可以通过使用感知感知（lifecycle-aware）组件来解决，该主题将从题为使用\
  \ Jetpack 构建现代 Android 应用架构的章节开始介绍。\n\n## 13.9 总结 (Summary)\n\n\n\n\n\n所有的活动都源自\
  \ `Android Activity` 类，该类包含许多生命周期方法，这些方法设计用于在活动状态发生时由运行时系统调用。同样，`Fragment` 类也包含许多可比的方法。通过重写这些方法，活动和碎片可以对状态变化做出响应，并在必要时采取步骤保存并恢复活动及应用程序的当前状态。生命状态可以认为有两种形式。持久化状态（persistent\
  \ state）指的是在应用程序调用之间需要存储的数据（例如存储到文件或数据库）。另一方面，动态状态（dynamic state）与用户界面的当前显示有关。\n\
  \n虽然生命周期方法有很多局限性，但可以通过生命周期感知组件（lifecycle-aware components）来避免，但理解这些方法对于充分理解本书后面介绍的生命周期管理新方法至关重要。\n\
  \n在本章中，我们重点介绍了活动可用的生命周期方法，并涵盖了活动生命周期的概念。在下一章（标题为通过示例理解 Android Activity 状态变化）中，我们将实现一个示例应用程序，将这些大部分理论付诸实践。\n\
  \n# 14 通过示例理解 Android Activity 状态变化\n\n之前的章节已经详细讨论了组成 Android 应用程序的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用程序，将处理活动状态变化的理论付诸实践。该示例应用程序的目的是提供一个真实的演示，展示活动如何在\
  \ Android 运行时中通过各种不同的状态。在下一章（标题为保存和恢复 Android Activity 状态）中，在章章构建的示例项目将得到扩展，演示动态活动状态的保存和恢复。\n\
  \n## 14.1 创建状态变化示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File -> Close\
  \ Project` 菜单选项关闭当前打开的项目，以便显示欢迎界面。\n\n从欢迎界面选择 `New Project` ，在出现的新项目对话框中，选择 `Empty\
  \ Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `StateChange` 并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。项目创建过程完成后，`StateChange` 项目应列在 Android Studio 主窗口左侧的 `Project`\
  \ 工具窗口中。使用节 11.8 迁移项目到 View Binding 中概述步骤将项目转换为使用 view binding。\n\n接下来的操作涉及活动用户界面的设计。它存储在名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有，请在项目工具窗口中导航到它，可以在\
  \ `app -> res -> layout` 文件夹找到它。找到后，双击文件将将其加载到 Android Studio Layout Editor 工具中。\n\
  \n![](img/as_4.2_statechange_layout_editor.jpg)\n\n图 14-1\n\n## 14.2 设计用户界面\n\n\
  当用户界面布局加载到 `Layout Editor` 工具后，现在是为示例应用程序设计用户界面了。与用户界面设计中目前的“Hello World!” `TextView`\
  \ 不同，活动实际上需要一个 `EditText` 视图。在 Layout Editor 画布上选择 `TextView` 对象，并按键盘上的 `Delete`\
  \ 键将其从设计中删除。\n\n从 Layout Editor 左侧的 `Palette` 中，选择 `Text` 类别，从文本组件列表中点击并拖动 `Plain\
  \ Text` 组件到设备屏幕的可视化表示上。将组件移动到显示中心，直到中心引导线出现，然后放置到位，使布局类似于图 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\
  \n图 14-2\n\n使用 `EditText` 控件时，有必要为视图指定输入类型（input type）。这只是定义了用户将输入的文本或数据类型。例如，如果输入类型设置为\
  \ `Phone`，则用户被限制在视图中输入数字。或者，如果输入类型设置为 `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以组合。\n\
  \n为了本示例的目的，我们将设置输入类型以支持普通文本输入。为此，选择布局中的 `EditText` 控件，并在 `Attributes` 工具窗口中找到 `inputType`\
  \ 条目。点击当前设置左侧的图标以打开选项列表，并在列表中，关闭 `textPersonName` 并启用 `text`，然后点击 `Apply` 按钮。留在\
  \ `Attributes` 工具窗口中，将视图的 `id` 更改为 `editText`，并在生成的对话框中点击 `Refactor` 按钮。\n\n默认情况下，`EditText`\
  \ 显示名为“Name”的文本。留在 `Attributes` 面板中，从 `text` 属性字段删除删除内容，使视图在布局中保持空白。\n\n在继续之前，点击布局编辑器工具栏中的\
  \ `Infer Constraints` 按钮以添加缺失的约束。\n\n## 14.3 重写活动生命周期方法\n\n此时，项目包含一个名为 `MainActivity`\
  \ 的活动，它派自 `AppCompatActivity` 类。该活动的源代码包含在 `MainActivity.java` 文件中，该文件已经在编辑器会话中打开并由标签页表示。\n\
  \n到目前为止，活动重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为设置用户界面之前调用父类实例。现在我们将修改此方法，使其在每次执行时都在\
  \ Android 面板中输出诊断消息。为此，我们将使用 `Log` 类，这需要我们导入 `android.util.Log` 并声明一个标签，以便在日志输出中过滤这些消息：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\nimport android.util.Log;\nimport\
  \ androidx.annotation.NonNull;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ static final String TAG = \"StateChange\";\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用 `Alt-Insert`\
  \ 快捷键生成，如标题为 Android Studio 代码编辑器基础](Code_Editor.xhtml__idTextAnchor196)的章节所述。请注意，如果方法是自动生成的，仍然需要手动添加\
  \ Log 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  }\n```\n\n\n\n\n\n```java\nLog.i(TAG, \"onStart\");\n\n}\n\n@Override\nprotected\
  \ void onResume() {\n    super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n\
  @Override\nprotected void onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\"\
  );\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n    Log.i(TAG,\
  \ \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n    super.onRestart();\n\
  \    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n\
  \    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  \    Log.i(TAG, \"onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n## 14.4 过滤 Logcat 面\n\n\
  在 `MainActivity.java` 的重写方法中添加代码的目的是将日志信息输出到 `Logcat` 工具窗口。此输出可以配置为显示与设备或模拟器会话相关的所有事件，也可以限制为仅与当前选定应用相关的事件。输出还可以进一步限制为仅显示匹配指定过滤器的日志事件。\n\
  \n当在当前应用运行时，`Logcat` 工具窗口将如下方的图 14-3 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  \n图 14-3\n\n如果面板与上述图形不符，请选择`File -> Settings...`菜单选项（macOS 上为 `Preferences`），选择`Experimental”（实验性）类别并开启`Enable\
  \ new Logcat tool window”（启用新的 Logcat 工具窗口）选项。\n\n上图中标记为 A 的菜单允许你选择要显示日志输出的设备或模拟器。这些输出将显示在标记为\
  \ C 的输出面板中。可以通过在标记为 B 的字段中输入选项来过滤日志输出。默认键设置 `package:mine` 将输出限制为由当前应用包生成的日志消息（在此例中\
  \ `com.ebookfrenzy.statechange`）。留空此字段将允许显示来自所选设备或模拟器的日志输出，包括操作系统生成的诊断消息。也可以组合多个键以进一步过滤输出。例如，我们可以配置\
  \ `Logcat` 面板仅显示与我们的 `StateChange` 标签相关的消息，如下：\n\n`package:mine tag:StateChange`\n\
  \n我们还可以通过在键名前加加上减号（`-`）来排除输出。除了 `StateChange` 标签外，我们可能还有使用名为“OtherTag”的不同标签的诊断消息。为了过滤日志以排除此第二个标签的输出，我们可以输入以下键选项：\n\
  \n`package:mine tag:StateChange -tag:OtherTag`\n\n除了你自己的标签值外，还可以从 Android 内置的一系列预定义诊断标签中进行选择。当你向过滤器字段中输入内容时，`Logcat`\
  \ 将显示匹配的标签列表，如图 14-4 所示：\n\n![](img/as_logcat_tool_window_tags.jpg)\n\n图 14-4\n\n\
  级别键（level）可以根据严重程度控制显示哪些消息。要过滤掉错误消息之外的所有消息，将使用以下键：\n\n`level:error`\n\n除了 error，`Logcat`\
  \ 面板还支持 `verbose`、`info`、`warn` 和 `assert` 级别设置。\n\n`Logcat` 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，点击上方图\
  \ 14-3 中标记为 D 的 `+` 按钮。使用相应的标签在不同面板之间切换，或者通过右键点击当前显示的面板并选择`Split-Right`向右拆分）或`Split-Down`向下拆分）菜单选项来水平或垂直排列面板。要重命名面板，右键点击标签并选择`Rename\
  \ Tab`重命名标签）选项。在继续之前，关闭除一个以外的所有 Logcat 面板并配置如下配置：\n\n`package:mine tag:StateChange`\n\
  \n## 14.5 运行应用程序\n\n为了获得最佳效果，应在物理 Android 设备或模拟器上运行应用程序。设备配置好并连接到开发计算机后，点击 Android\
  \ Studio 工具栏中绿色三角形表示的运行按钮，如下方的图 14-5 所示，选择`Run -> Run…`菜单选项或使用快捷键 `Shift+F10`：\n\
  \n![](img/as_3.5_run_state_change_app.jpg)\n\n图 14-5\n\n如果出现`Choose Device`选择设备）对话框，请从从中选择物理\
  \ Android 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用程序并将其安装到设备后，它应该会启动并在前台运行。\n\
  \n![](img/as_logcat_statechange.jpg)\n\n图 14-6\n\n## 14.6 对 Activity 进行实验\n\n诊断功能工作正常后，现在是时候通过运行应用程序来练习生命周期了。首先，考虑初始的生命周期序列：\n\
  \n`onCreate`\n`onStart`\n`onResume`\n\n显然，初始状态的变化正如理解 Activity 生命周期周期 中所示。然而，点击设备底部状态栏上的`Home`\
  \ 图，注意后续序列：\n\n`onPause`\n`onStop`\n`onSaveInstanceState`\n\n在这种情况下，运行时注意到活动已不再在前台，用户不可见且活动已停止，但在此之前提供了保存状态的机会。取决于运行时最终是销毁了活动还是简单重启了它，活动将通过调用\
  \ `onRestart()` 被通知已重启，或者在用户返回时再次通过创建序列。\n\n正如理解 Activity 生命周期 所示，活动的销毁和重建可以通过对设备进行更改（例如从竖屏旋转到横屏）来触发。为了观察这一过程，只需在\
  \ StateChange 应用程序在前台时旋转设备。在使用模拟器时，可以使用工具栏中的旋转按钮模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。它位于设备或模拟器屏幕的底部，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n日志中的方法调用序列结果如下：\n\
  \n`onPause`\n`onStop`\n`onSaveInstanceState`\n`onDestroy`\n`onCreate`\n`onStart`\n\
  `onRestoreInstanceState`\n`onResume`\n\n显然，运行时系统在活动被销毁和重启之前提供了保存状态的机会。\n\n## 14.7\
  \ 总结\n\n“一图胜千言”对于学习新编程范式的示例来说同样适用。在本章中，我们创建了一个示例 Android 应用程序，用于演示活动可能会经历的不同生命周期状态。在本章开发项目期间，我们还查看了从活动内部生成诊断日志信息的机制。\n\
  \n\n\n\n\n在下一章中，我们将扩展 `StateChange` 示例项目，以演示如何保存和恢复 Activity 的动态状态。\n\n# 15. 保存和恢复\
  \ Android Activity 状态\n\n如果前面的几个章节已经实现了目标，那么现在你对于在 Activity 生命周期中的特定时间点保存和恢复用户界面状态的重要性，应该变得更清晰了一些。\n\
  \n在本章中，我们将扩展在通过示例学习 Android Activity 状态变化中创建的示例应用程序，以演示当 Activity 被运行时系统销毁并重建时，保存和恢复状态所需的步骤。\n\
  \n保存和恢复动态状态的关键组件涉及使用 Android SDK 的 `Bundle` 类，这个主题在本章中也会被介绍。\n\n## 15.1 保存动态状态\n\
  \n正如我们已经学到的，Activity 有机会通过运行时系统调用其实现的 `onSaveInstanceState()` 方法来保存动态状态信息。作为方法的参数传递的是一个\
  \ `Bundle` 对象的引用，该方法需要向该 `Bundle` 中存储任何需要保存的动态数据。随后，运行时系统会代表 Activity 存储该 `Bundle`\
  \ 对象，并在 Activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法被调用时将其作为参数传递过去。然后，可以在这些方法中从\
  \ `Bundle` 对象中检索数据，并将其用于恢复 Activity 的状态。\n\n## 15.2 用户界面状态的默认保存\n\n在上一章中，`StateChange`\
  \ 示例应用程序的诊断输出显示，当运行它的设备旋转得足够以触发方向变化时，该 Activity 会经历多次状态变化。\n\n再次启动 `StateChange`\
  \ 应用程序，这次在执行设备旋转之前向 `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击位于状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中会出现以下状态变化序列：\n\n```text\nonPause\nonStop\nonSaveInstanceState\nonDestroy\n\
  onCreate\nonStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 Activity 的销毁和重建。然而，通过查看运行中应用程序的用户界面，应该会发现输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 Activity 已经被销毁并重建了，而且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图小部件已经实现了在 Activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是 Activity\
  \ 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法包含对父类对应方法的调用：\n\n\
  ```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ Bundle savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n可以通过在 XML 布局文件中将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图状态的自动保存。为了示例起见，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在 Activity\
  \ 重启时不再保存和恢复状态，请编辑 `activity_main.xml` 文件，使视图的条目如下所示（注意，点击 Layout Editor 面板底部的 Text\
  \ 标签可以直接编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n进行更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\
  \n## 15.3 Bundle 类\n\n对于需要在用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个容器，使用键值对机制来存储数据。键的形式为字符串形式型值，而与这些键关联的值可以是原始值的形式，也可以是实现\
  \ Android `Parcelable` 接口的任何对象。许多类已经实现了 `Parcelable` 接口。通过实现 `Parcelable` 接口中定义的一组方法，可以将自定义类变为“可序列化的”，详细信息可以在\
  \ Android 文档中找到：\n\nhttps://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（如 `String` 和 `CharSequence`）。\n\n为了本示例，并且由于已经禁用了 `EditText` 视图的文本自动保存，我们需要确保输入到\
  \ `EditText` 中的文本被保存到 `Bundle` 对象中并恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态并将分别使用 `Bundle`\
  \ 类的 `putCharSequence()` 和 `getCharSequence()` 方法。\n\n## 15.4 保存状态\n\n扩展 `StateChange`\
  \ 应用程序的第一步是确保在 `MainActivity` Activity 的 `onSaveInstanceState()` 方法中从 `EditText`\
  \ 组件中提取用户文本，然后作为键值对保存到 `Bundle` 对象中。\n\n为了从 `EditText` 对象中提取文本，我们首先需要在用户界面中标识该对象。显然，这涉及到\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间的桥接。为了提取到 `EditText` 中的文本，我们需要访问该用户界面对象。\n\n用户界面中的每个组件都关联有一个唯一标识符。默认情况下，Layout\
  \ Editor 工具根据新添加组件的类型来构造 `id`。如果布局中包含多个相同类型的视图，类型名称后面会跟一个顺序数字（尽管开发者可以并且应该将其更改为更具意义的内容）。正如通过在\
  \ Android Studio 主窗口中选择 `activity_main.xml` 文件并显示 Layout Editor 工具时检查 Component\
  \ Tree 面板所所示，`EditText` 组件被分配了 id `editText`：\n\n![](img/as_4.1_state_change_component_tree.jpg)\n\
  \n图 15-1\n\n现在，可以通过对象的 `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来返回当前文本：\n\n```java\n\
  CharSequence userText = binding.editText.getText();\n```\n\n\n\n\n最后，我们可以使用 `Bundle`\
  \ 对象的 `putCharSequence()` 方法来保存文本，并将键（这可以是任何字符串值，但在本例中，我们将将其声明为“savedText”）和 `userText`\
  \ 对象作为参数：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n```\n\n\
  将这些内容整合在一起，我们在 `MainActivity.java` 文件中得到了一个修改后的 `onSaveInstanceState()` 方法，其代码如下：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\n.\n.\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n.\n.\n.\n    protected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n        super.onSaveInstanceState(outState);\n        Log.i(TAG,\
  \ \"onSaveInstanceState\");\n        CharSequence userText = binding.editText.getText();\n\
  \        outState.putCharSequence(\"savedText\", userText);\n    }\n.\n.\n```\n\n\
  现在已经采取了保存状态的步骤，下一个阶段是确保在需要时对其进行恢复。\n\n### 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的那些生命周期方法中恢复。这为开发者提供了使用\
  \ `onCreate()` 或 `onRestoreInstanceState()` 的选择。使用哪种方法取决于传入的性质。在执行完活动初始化任务后最好恢复状态的情况下，通常\
  \ `onRestoreInstanceState()` 方法更合适。为了本例的目的，我们将向 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”\
  \ 键从 `Bundle` 中提取保存的状态。然后，我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n\
  @Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText =\n               savedInstanceState.getCharSequence(\"\
  savedText\");\n    binding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\
  \n剩下的只是再次构建并运行 StateChange 应用。运行并处于前景时，触摸 `EditText` 组件并输入一些文本，然后将设备旋转到另一个方向。以前文本的更改会丢失，但得益于我们在本章向活动中添加的代码，新文本将保留在\
  \ `editText` 组件中。\n\n在验证代码按预期执行后，注释掉两个方法中的 `super.onSaveInstanceState()` 和 `super.onRestoreInstanceState()`\
  \ 调用，重新启动应用，并注意在设备旋转后文本仍然保留。默认的保存和恢复系统本质上被自定义实现取代，从而提供了一种在活动内动态且选择性保存和恢复状态的方法。\n\
  \n### 15.7 总结\n\nAndroid 应用中动态状态的保存和恢复仅仅是在适当的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由 `Activity`\
  \ 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据以键值对的形式保存到运行时系统传递给活动的\
  \ `Bundle` 对象中。\n\n可以通过在活动的 `onCreate()` 或 `onRestoreInstanceState()` 方法中从 `Bundle`\
  \ 对象中提取值并根据存储的值更新活动，从而恢复状态。\n\n在本章中，我们使用了这些技术更新了 StateChange 项目，使 `Activity` 能够通过活动的销毁和随后的重建保留更改。\n\
  \n# 16. 理解 Android 视图、视图和布局\n\n除了听流媒体音频外，用户与 Android 设备的交互在本质上主要是视觉和触觉的。所有这些交互都通过设备上安装的应用的用户界面进行，包括内置应用和用户安装的任何第三方应用。因此，开发\
  \ Android 应用的关键元素涉及用户界面的设计和创建，这并不意外。\n\n在本章中，将涵盖 Android 用户界面的结构主题，并概述组成用户界面的不同元素；即\
  \ `Views`（视图）、`View Groups`（视图组）和 `Layouts`（布局）。\n\n## 16.1 为不同的 Android 设备设计\n\n\
  “Android 设备”术涵盖了具有不同屏幕尺寸和分辨率的海板电脑和智能手机产品。因此，应用程序的用户界面现在必须仔细设计，以确保在尽可能广泛的显示尺寸上正确显示。关键之一是确保用户界面布局在不同设备上运行时能够正确缩放大小。这在很大程度上可以通过仔细的规划和使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数基于 Android 的手机和平板电脑都可以用户以竖屏和横屏模式手持。良好的用户界面应该能够适应这些变化，并进行合理的布局调整以利用每种方向上的可用屏幕空间。\n\
  \n## 16.2 视图和视图组\n\n用户界面中的每个项目都是 `View` 类的子类（准确地说是 `android.view.View`）。Android\
  \ SDK 提供了一组预构建的视图，可用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar` 和 `TextView`\
  \ 类。这些视图也被小部件（widgets）或组件。对于 SDK 提供的小部件无法满足的需求，可以通过子类和扩展现有类来创建新视图，或者通过直接在 `View`\
  \ 类之上构建来创建一个全新的组件。\n\n视图也可以由多个其他视图组成（另一种称为复合视图）。此类视图继承自 Android `ViewGroup` 类（`android.view.ViewGroup`），而该类本身是\
  \ `View` 的子类。这种视图的一个示例是 `RadioGroup`，它旨在包含多个 `RadioButton` 对象，使得在任何时候只有一个处于“开启”状态。从结构上来说，复合视图由单个父视图（派自\
  \ `ViewGroup` 类，另一种称为容器视图或根元素）组成，该视图能够包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n## 16.3 Android 布局管理器\n\n除了上一节讨论的小部件样式视图外，SDK 还包含了一组称为布局的视图。布局是容器视图（因此继承自 `ViewGroup`），其设计目的仅用于控制子视图在屏幕上的位置。\n\
  \nAndroid SDK 包含以下布局视图，可用于 Android 用户界面设计中：\n\n- `ConstraintLayout` – 在 Android\
  \ 7 中引入，建议对于大多数布局需求使用此布局管理器`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置来定义布局中视图的位置和行为。这种布局的灵活性允许快速方便地创建复杂的布局，而无需嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 也与 Android Studio 布局编辑器工具深度集成。除非另有说明，它是书中大多数示例的布局首选。\n\n\n\n\n\n- `LinearLayout`\
  \ – 根据所选的方向（orientation），将子视图在单行或单列中排列。可以为每个子视图设置权重（weight）值，以指定该子视图相对于其他子视图占据布局空间的比例。\n\
  \n- `TableLayout` – 将子视图以行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子视图表示，而 `TableRow` 又包含每个单元格的一个\
  \ `view` 对象。\n\n- `FrameLayout` – `FrameLayout` 的目的是分配屏幕上的一个区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将相互堆叠，并定位在布局区域的左上角。通过为每个子视图设置\
  \ `gravity`（重力）值可以实现单个子视图的交替定位。例如，在子视图上设置 `center_vertical` 重力值将使其定位在容器 `FrameLayout`\
  \ 视图的垂直中心位置。\n\n- `RelativeLayout` – `RelativeLayout` 允许通过指定子视图的对齐方式（alignments）和间距（margins），将子视图相对于彼此以及容器布局视图进行定位。例如，可以将子视图\
  \ `View A` 配置为位于容器 `RelativeLayout` 视图的垂直和水平中心。另一方面，`View B` 也可以被配置为在布局视图水平居中，但位于\
  \ `View A` 顶部上方 30 像素处，从而使其垂直位置相对于 `View A` 进行定位。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout`\
  \ 管理器可能特别有用。\n\n- `AbsoluteLayout` – 允许子视图定位在容器布局视图内特定的 `X` 和 `Y` 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\
  \n- `GridLayout` – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直方向覆盖多个单元格，从而能够快速方便地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隔可以通过在相邻单元格中放置名为 `Space` 的特殊类型视图，或设置边距（margin）参数来实现。\n\n- `CoordinatorLayout`\
  \ – 作为 Android 5.0 中 Android 设计支持库的一部分引入，`CoordinatorLayout` 专门用于协调应用程序屏幕顶部的应用栏（app\
  \ bar）与其他视图元素的外观行为。当使用 Basic Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout` 实例实现。该布局管理器将从标题为“使用\
  \ Floating Action Button 和 Snackbar”的章节开始进行更详细的介绍。\n\n在考虑 Android 应用程序的用户界面中使用布局时，值得记住，正如下一节将概述的，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n## 16.4 视图层次结构 (View Hierarchy)\n\n用户界面中的每个视图都代表显示器上的一个矩形区域。视图负责在该矩形内绘制的内容，并负责响应屏幕该部分发生的事件（例如，触摸事件）。\n\
  \n用户界面屏幕由一个视图层次结构组成，其中根视图（root view）位于树的顶端，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并被限制在父视图显示区域的边界内。例如，考虑图\
  \ 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上还包含许多布局视图，这些视图控制可见视图的定位方式。图\
  \ 16-2 显示了用户界面的另一种视图，这次强调了布局视图与子视图之间的对应关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\
  \n正如之前讨论的，用户界面是以视图层次结构的形式构建的，顶部有一个根视图。正因如此，我们也可以以图 16-3 所示的视图树的形式来视觉化上述用户界面示例：\n\
  \n![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能最清晰地概述了构成图 16-1 所示用户界面的各种视图之间的关系。当用户界面显示给用户看时，Android\
  \ 运行时会遍历视图层次结构，从根视图开始沿树向下移动，并在过程中渲染每个视图。\n\n## 16.5 创建用户界面\n\n在对视图、布局和视图层次结构概念有了更清晰的理解后，接下来的章节将重点关注为\
  \ Android 活动（activities）创建用户界面的步骤。事实上，有三种不同的用户界面设计方法：使用 Android Studio Layout 编辑器工具、手动编写\
  \ XML 布局资源文件或编写 Java 代码，每种方法都将被涵盖。\n\n## 16.6 总结\n\nAndroid 应用程序用户界面屏幕中的每个元素都是视图，它们最终继承自\
  \ `android.view.View` 类。每个视图代表设备显示器的一个矩形区域，并负责该矩形内出现的内容，以及处理发生在该视图边界内的事件。多个视图可以组合创建一个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（`ViewGroup` 也是 `android.view.View` 的子类）。用户界面是由视图层次结构的形式构成的。\n\
  \n\n\n\n\n正如“Android 应用程序结构”章节概述，Android 应用程序由一个或多个活动（activities）组成。活动是应用程序功能的独立模块，通常直接对应于单个用户界面屏幕。因此，在使用\
  \ Android Studio 布局编辑器（Layout Editor）工作时，我们总是在为某个活动编写布局。\n\n在创建新的 Android Studio\
  \ 项目时，可以使用许多不同的模板作为主活动用户界面的起点。这些模板中是最基础的是 `Basic Activity`（基础活动）和 `Empty Activity`（空活动）模板。尽管它们初看之下非常相似，但这两个选项之间实际上存在显著差异。要在布局编辑器中查看这些差异，请使用\
  \ `View Options`（视图选项）菜单启用 `Show System UI`（显示系统界面），如下方的图 17-1 所示：\n\n![](img/as_layout_editor_system_ui.jpg)\n\
  \n图 17-1\n\n`Empty Activity` 模板创建一个单一布局文件，其中包含一个 `ConstraintLayout` 管理器实例，该实例包含一个\
  \ `TextView` 对象，如图 17-2 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\
  \n相反，`Basic Activity` 模板包含多个布局文件。顶层布局文件具有 `CoordinatorLayout` 作为根视图，包含一个可配置的标题栏（包含一个工具栏），显示在设备屏幕顶部（在图\
  \ 17-3 中标记为 A），以及一个浮动操作按钮（标记为 B 的邮件按钮）。除了这些项目外，`activity_main.xml` 布局文件还引用了一个名为\
  \ `content_main.xml` 的第二个文件，该文件包含内容布局（标记为 C）：\n\n![](img/as_basic_activity_layout.jpg)\n\
  \n图 17-3\n\n`Basic Activity` 包含两个屏幕的布局，这两个屏幕都包含一个按钮和一个文本视图。该模板的目的是演示如何在应用内实现多个屏幕之间的导航。如果运行使用\
  \ `Basic Activity` 模板的未修改的程序，将显示这两个屏幕中的第一个（在图 17-4 中标记为 A）。点击 `Next`（下一步）按钮将导航到第二个屏幕\
  \ (B)，该屏幕又包含一个返回第一个屏幕的按钮：\n\n![](img/as_basic_activity_layout_1.jpg)\n\n图 17-4\n\
  \n此应用行为使用了两个 Android 功能：片段（fragments）和导航（navigation），这两个功能都将在后续的“Android 片片简介”和“导航架构组件概述”章节开始介绍。\n\
  \n`content_main.xml` 文件包含一个名为 `Navigation Host Fragment`（导航宿主片段）的特殊片段，它允许根据 `res\
  \ -> layout -> nav_graph.xml` 文件中配置的设置，在视图中切换不同的内容。在 `Basic Activity` 模板的情况下，`nav_graph.xml`\
  \ 文件被配置为根据用户对 `Next` 和 `Previous` 按钮的选择，在在 `fragment_first.xml` 和 `fragment_second.xml`\
  \ 文件定义的用户界面布局之间进行切换。\n\n显然，如果你的活动中既不需要浮动操作按钮也不需要菜单，并且不需要 `CoordinatorLayout` 提供的特殊标题栏行为（例如在某些滚动操作期间使标题栏和工具栏从视图中折叠的选项，该主题在“与\
  \ AppBar 和折叠工具栏布局一起工作”](#AppBar.xhtml__idTextAnchor1002)章节中介绍过），那么 `Empty Activity`\
  \ 模板就是很有用的。然而，`Basic Activity` 的用用之处在于它默认提供了这些元素。事实上，使用 `Basic Activity` 模板创建一个新活动并删除你不需要的元素，通常比使用\
  \ `Empty Activity` 模板并手动实现折叠工具栏、菜单或浮动操作按钮等行为要快。\n\n然而，由于本书中的并非所有示例都需要 `Basic Activity`\
  \ 模板的功能，除非示例需要 `Basic Activity` 模板提供的某项功能，否则本章中的大多数示例都将使用 `Empty Activity` 模板。\n\
  \n为了以以后参考，如果你需要菜单但不需要浮动操作按钮，请使用 `Basic Activity` 并按照以下步骤删除浮动操作按钮：\n\n1. 双击 Project\
  \ 工具窗口中 `app -> res -> layout` 下的主 `activity_main.xml` 布局文件，将其加载到布局编辑器中。在布局编辑器工具中，选择浮动操作按钮并按下键盘上的\
  \ `Delete` 键从布局中删除该对象。\n\n2. 找到并编辑活动的 Java 代码（位于 `app -> java -> <package name>\
  \ -> <activity class name>`），并如下所示从 `onCreate` 方法中删除浮动操作按钮代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController);\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with action\", Snackbar.LENGTH_LONG).show();\n\
  \        }\n    });\n}\n```\n\n如果你需要浮动操作按钮但不需要菜单，请使用 `Basic Activity` 并按照以下步骤操作：\n\
  \n1. 编辑活动类文件，删除 `onCreateOptionsMenu` 和 `onOptions` 方法。\n2. 选择 Project 工具窗口中的 `res\
  \ -> menu` 项并按下键盘 `Delete` 键删除文件夹和资源文件。\n\n如果你需要使用 `Basic Activity` 模板但不需要导航功能或第二个内容片段，请遵循以下步骤：\n\
  \n1. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，选择图中的 `SecondFragment` 项并按下删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`) 文件。\n4. 最后的任务是从 `FirstFragment` 类中移除某些代码，以便点击按钮视图时不再导航到已不存在的第二个片段。找到\
  \ `FirstFragment.java` 文件，双击它加载到编辑器中，并从 `onViewCreated()` 方法中删除代码，使其内容如下：\n\n```java\n\
  public void onViewCreated(@NonNull View view, Bundle savedInstanceState) {\n   \
  \ super.onViewCreated(view, savedInstanceState);\n    binding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n \
  \               .navigate(R.id.action_FirstFragment_to_SecondFragment);\n      \
  \  }\n    });\n}\n```\n\n\n\n\n如前面的章节所所示，布局编辑器（Layout Editor）工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调色板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，还可以使用属性（Attributes）工具窗口修改与所选视图相关的各种属性。\n\
  \n在底层，布局编辑器工具实际上会构建一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以不同的模式运行，称为设计（Design）、代码（Code）和拆分（Split）模式。\n\
  \n## 17.3 设计模式\n\n在设计模式下，可以通过直接操作视图调色板和布局的图形表示来视觉化操作用户界面。图 17-5 展示了 Android Studio\
  \ 布局编辑器工具在设计模式下的关键区域：\n\n![](img/as_4.2_layout_editor_labelled.jpg)\n\n图 17-5\n\n\
  **A – 调色板（Palette）** – 调色板提供了访问 Android SDK 提供的系列视图组件的通道。这些组件被分类以便于导航。可以通过从调色板中拖拽视图组件并将其掉到布局所需的位置来向布局中添加项。\n\
  \n**B – 设备屏幕（Device Screen）** – 设备屏幕提供了设计中的用户界面布局的视觉“所见即所得”表示。该布局允许对设计进行直接操作，允许选择、删除、移动和调整视图的大小。可以使用位于工具栏的菜单随时更改布局所代表的设备模型。\n\
  \n**C – 组件树（Component Tree）** – 如前一节（“理解 Android 视图、视图组和布局”中标记为 A）列出了 Android SDK\
  \ 支持的不同类别视图组件。当从列表中选择一个类别时，第二个面板（B）会更新并显示该类别下的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要将调色板中的组件添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置并释放到位即可。\n\n在当前选定的类别内搜索特定组件，可以通过点击调色板工具栏中的搜索按钮（在图\
  \ 17-6 上方标记为 C）并输入组件名称来启动。随着字符的输入，匹配的结果将实时显示在组件列表面板中。如果您不确定组件属于哪个类别，只需在搜索操作之前或期间期间选择“全部（All）”类别即可。\n\
  \n## 17.5 设计模式与布局视图\n\n默认情况下，布局编辑器将以设计模式出现，如上方的图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击如图\
  \ 17-7 所示的最右侧模式切换控制按钮来随时选择设计模式：\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\
  \n图 17-7\n\n当布局编辑器工具处于设计模式时，可以用两种不同的方式查看布局。上方图 17-5 中显示的视图是设计视图，显示了布局和小部件在运行应用程序中的样式。第二种模式称为蓝图视图（Blueprint\
  \ view），可以替代设计视图显示，也可以与设计视图同时显示。图 17-8 所示的工具栏菜单提供了显示设计、蓝图或两种视图的选项。还有可用设置进行调整。第五个选项“强制刷新（Force\
  \ Refresh）”会重新构建布局。当布局进入意外状态或未反映当前设计时，此功能非常有用：\n\n![](img/as_layout.jpg)\n\n图 17-8\n\
  \n显示布局视图、设计视图或两者都取决于个人喜好。一种好的方法是显示两者，如图 17-9 所示：\n\n![](img/as_3.5_layout_and_blueprint.jpg)\n\
  \n图 17-9\n\n## 17.6 夜间模式\n\n要在设计期间以夜间模式查看布局，选择下方图 17-10 所示的菜单并设置为“夜间（Night）”：\n\n\
  ![](img/as_layout_editor_night_mode.jpg)\n\n图 17-10\n\n## 17.7 代码模式\n\n在使用 Android\
  \ Studio 布局编辑器工具时重要的是它实际上提供了一种创建 XML 资源文件的友好方法。在设计过程中，可以通过点击布局编辑器工具右上角的代码（Code）按钮查看并直接编辑底层\
  \ XML，如图 17-11 所示：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\n图 17-11\n\
  \n图 17-12 显示 Android Studio 布局编辑器处于代码模式，允许通过更改 XML 来修改用户界面声明：\n\n![](img/as_3.6_layout_editor_code_mode.jpg)\n\
  \n图 17-12\n\n## 17.8 拆分模式\n\n在拆分模式下，编辑器并排显示设计视图和代码视图，允许通过设计画布视觉化修改用户界面，或直接更改 XML\
  \ 声明。要进入拆分模式，点击下方图 17-13 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n\n\
  图 17-13\n\nXML 的任何更改都会自动反映在设计画布上，反之亦然。图 17-14 显示编辑器处于拆分模式：\n\n![](img/as_4.1_layout_split_mode.jpg)\n\
  \n\n\n\n\n# 图 17-14\n\n## 17.9 设置属性\n\n属性（Attributes）面板提供了当前所选组件的所有可用设置的访问。例如图 17-15\
  \ 显示了 `TextView` 控件的属性：\n\n![](img/as_4.1_layout_attributes.jpg)\n\n图 17-15\n\n\
  属性工具窗口分为以下不同的部分：\n\n- `id` - 包含 `id` 属性，该属性定义了在应用源码中引用当前所选对象的名称。\n- `Declared Attributes`（已声明属性）\
  \ - 包含所有已赋值的属性。\n- `Layout`（布局） - 定义当前所选视图对象相对于屏幕以及布局中其他对象的定位和缩放的设置。\n- `Transforms`（变换）\
  \ - 包含允许当前所选对象进行旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性） - 当前所选视图对象类中通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性） - 当前所选对象可用属性的完整列表。\n\n可以通过选择属性工具窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用资源（Resources）对话框来帮助选择合适的属性值。要显示对话框，只需点击该按钮。此按钮的外观变化将反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，文本属性字段右侧的按钮将填充，以指示该值不是硬编码的，如下方的图\
  \ 17-16 所示：\n\n![](img/as_3.4_resource_extracted.jpg)\n\n图 17-16\n\n具有有限数量有效选项的属性将显示下拉菜单（图\
  \ 17-17），可以从中进行选择。\n\n![](img/as_4.0_type_face_menu.jpg)\n\n图 17-17\n\n可以点击滴管图标（如上方图\
  \ 17-16 中 `backgroundTint` 字段所示）来显示颜色选择调板。同样，当此位置出现旗帜图标时，点击它可以显示该属性的可用选项列表而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n## 17.10 变换\n\n属性工具窗口内的变换面板（图 17-18）提供了一组控件和属性，用于控制当前所选对象在旋转、alpha（用于视图的淡入淡出）、缩放（大小）和平移（相对于当前位置的偏移）方面的视觉效果：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n\n图 17-18\n\n面板包含视图的可视化表示，它会随着属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n## 17.11 工具可见性切换\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会注意到许多定义视图外观和行为的属性都以\
  \ `android:` 前缀开头。这表示属性是在 `android` 命名空间内设置的，并在应用运行时生效。例如，布局文件的以下摘录在 `Button` 视图上设置了各种属性：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了一个 `tools` 命名空间。当在此命名空间内设置属性时，它们仅在布局编辑器预览中生效。在设计布局时，例如你可能发现\
  \ `EditText` 视图显示某些文本很有帮助，但在应用运行时需要视图为空。为了实现这一点，你可以如下所示使用 `tools` 命名空间设置视图的 `text`\
  \ 属性：\n\n```xml\n<EditText\n    android:id=\"@+id/editTextTextPersonName\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"textPersonName\"\n    tools:text=\"\
  Sample Text\"\n```\n\n此类工具属性在属性工具窗口中的设置方法是通过在标记有扳手图标的属性字段中输入值，如图 17-19 所示：\n\n![](img/as_4.1_text_tools_property.jpg)\n\
  \n图 17-19\n\n工具属性对于在设计过程中更改视图的可见性特别有用。布局中可能包含一个视图，它根据用户操作在应用运行时程序化地显示和隐藏。为了模拟视图的隐藏，可以在视图\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n使用 `invisible`\
  \ 设置时，尽管视图将不再可见，但它仍然存在布局中并占据相同的空间。要让布局的行为就像视图不存在一样，应将可见性属性设置为 `gone`：\n\n```xml\n\
  tools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，对运行应用没有影响。若要在布局编辑器和运行应用中控制可见性，可以使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑布局文件是一个繁琐的过程。为了方便更改这些设置，Android\
  \ Studio 在布局编辑器组件树面板提供了一组切换控件。要访问这些控件，点击对应视图右侧的边距。例如，图 17-20 显示了名为 `myButton` 的\
  \ `Button` 视图的工具可见性控件：\n\n![](img/as_4.2_layout_tools_visibility.jpg)\n\n图 17-20\n\
  \n这些切换控件控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供未设置、可见（`visible`）、隐藏（`invisible`）和消失（`gone`）选项。当设置冲突冲突时（例如\
  \ `android` 命名空间切换设置为可见，而 `tools` 值设置为隐藏），`tools` 命名空间在布局预览中具有优先级。当做出切换选择时，Android\
  \ Studio 会自动在布局文件的 XML 视图元素中添加相应的属性。\n\n除了组件树中的可见性切换外，布局编辑器还包含下方图 17-21 中高亮显示的工具可见性与位置切换按钮：\n\
  \n![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\n图 17-21\n\n此按钮切换当前的工具可见性设置。例如，如果上方\
  \ `Button` 视图当前的工具可见性属性设置为 `gone`，切换此按钮将使其变为可见。这便于快速检查视图添加和从布局中移除时的布局行为。此切换按钮对于检查布局中的视图是否正确约束也很有用，该主题将在\
  \ Android Studio 中使用 ConstraintLayout 的指南章节中讨论。\n\n## 17.12 转换视图\n\n\n\n\n在布局中将视图从一种类型转换为另一种类型（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松实现，只需在屏幕布局或组件树（Component\
  \ tree）窗口中右键点击视图，并选择 `Convert view...`（转换视图）菜单选项（图 17-22）：\n\n![](img/as_layout_convert_view.jpg)\n\
  \n图 17-22\n\n选中后将弹出一个对话框，其中包含所选对象可以转换的兼容视图类型列表。例如，图 17-23 显示了现有 `TextView` 可以转换的类型：\n\
  \n![](img/as_3.2_convert_layout_textview.jpg)\n\n图 17-23\n\n这种技术也适用于将布局从一种类型转换为另一种（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 17.13 显示样本数据\n\n在 Android Studio\
  \ 中设计布局时，可能会出现这样的情况：用户界面内要显示的内容在应用完成并运行之前无法可用。这有时会导致很难从布局编辑器内部评估布局在应用运行时的外观。为了解决这个问题，布局编辑器允许指定样本数据，用样本图像和数据填充布局编辑器中的视图。这些样本数据仅显示在布局编辑器中，在应用运行时不会显示。可以通过直接编辑布局的\
  \ XML，或者通过视觉化使用设计时助手（在设计区域中右键点击小部件并选择 `Set Sample Data`（设置样本数据）菜单选项）来配置样本数据。设计时助手面板将显示显示在所选视图项上一系列预配置样本数据选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-24 显示了在选择在 `RecyclerView` 列表中显示样本数据时显示的选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，可以在布局设计过程中提供自定义文本和图像进行显示。在布局编辑器中使用样本数据的示例包含在随后的章节 “布局编辑器样本数据教程”\
  \ 中。由于样本数据是实现为 `tools` 属性的，可以使用上方 图 17-21 中突出显示的切换按钮来控制预览中内数据的可见性。\n\n## 17.14 创建自定义设备定义\n\
  \n布局编辑器工具栏中的设备菜单（图 17-25）提供了预配置设备类型的列表，选中后它们将作为设备屏幕画布出现。除了预配置的设备类型外，任何之前在 Android\
  \ Studio 环境中配置过的 AVD 实例也将列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项，并按照\
  \ “在 Android Studio 中创建 Android 虚拟设备 (AVD)”章节中概述的步骤进行。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n## 17.15 更改当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单中选择 `Custom`（自定义）选项，点击设备屏幕右下角附近的缩放句柄（图\
  \ 17-26）并拖动以选择另一种设备显示格式。随着屏幕缩放，将出现标记指示可选择的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n## 17.16 布局验证（多预览）\n\n布局验证（也称为多预览）选项允许在范围内的 Pixel 尺寸屏幕上同时预览用户界面布局。要访问多预览，点击位于\
  \ Android Studio 主窗口右上角附近的页签，如 图 17-27 所示：\n\n![](img/as_4.0_layout_validation_tab.jpg)\n\
  \n图 17-27\n\n一旦加载，该面板将如 图 17-28 所示显示，在多个设备屏幕配置上渲染布局：\n\n![](img/as_layout_validation.jpg)\n\
  \n图 17-28\n\n## 17.17 总结\n\n开发 Android 应用的关键部分涉及创建用户界面。在 Android Studio 环境中，这是使用布局编辑器工具完成的，它以三种模式运行。在设计（Design）模式下，从调板中选择视图组件并将其放置在代表\
  \ Android 设备屏幕的布局上，并使用属性列表进行配置。在代码（Code）模式下，可以直接编辑表示用户界面布局的底层 XML。而拆（Split）模式允许既可以通过视觉化方式也可以通过直接编辑\
  \ XML 来创建和修改布局。这些模式结合提供了一个广泛且直观的用户界面设计环境。\n\n布局验证面板允许在各种不同的设备屏幕尺寸上快速预览用户界面布局。\n\n\
  ## 18 ConstraintLayout 指南\n\n正如在理解 Android 、视图组和布局章节中讨论的那样，Android 提供了多种布局管理器用于设计用户界面。从\
  \ Android 7 开始，Google 引入了一种新的布局，旨在解决旧布局管理器的许多缺点。这种名为 `ConstraintLayout` 的新布局将简单、表现力且灵活的布局系统与内置到\
  \ Android Studio 布局编辑器中的强大功能相结合，以便创建能够适应屏幕尺寸和设备方向变化的响应式用户界面布局。\n\n本章将概述 `ConstraintLayout`\
  \ 的基本概念，下一章将详细概述如何在 Android Studio 布局编辑器中使用 `ConstraintLayout` 创建基于约束的布局。\n\n##\
  \ 18.1 ConstraintLayout 如何工作\n\n与其他所有布局一样，`ConstraintLayout` 负责管理它包含的视觉组件（也称为小部件）的位置和尺寸行为。它是根据设置在每个小部件上的约束连接来实现的。要充分理解并使用\
  \ `ConstraintLayout`，理解以下关键概念是非常重要的：\n\n- 约束（Constraints）\n- 边距（Margins）\n- 对抗约束（Opposing\
  \ Constraints）\n- 约束偏移（Constraint Bias）\n- 链（Chains）\n- 链样式（Chain Styles）\n- 指南（Guidelines）\n\
  - 组（Groups）\n- 障碍（Barriers）\n- 流（Flow）\n\n### 18.1.1 约束\n\n约束本质上是规则集，规定了部件相对于其它部件、容器\
  \ `ConstraintLayout` 边缘以及称为指南的特殊元素的对齐和距离方式。约束还决定了 Activity 用户界面布局在设备方向变化或在不同屏幕尺寸设备上显示时如何响应。为了充分配置，小部件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 18.1.2 边距\n\n\n\n\n\n边距（margin）是一种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右侧边缘开始的边距约束，并将其连接到父级 `ConstraintLayout` 的相应侧边来实现，如图\
  \ 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n如上图所示，这些约束连接中的每一个都关联着一个边距值（margin\
  \ value），该值决定了组件距离父级布局两侧的固定距离。在这种配置下，无论屏幕大小或设备方向如何，`Button` 对象将始终根据这两个约束连接的指定，分别距离父级\
  \ `ConstraintLayout` 的顶部和右边缘 20 和 15 个设备独立像素（dp）。\n\n虽然上述配置在某些情况下是可以接受的，但它没有提供足够的灵活性，无法让\
  \ `ConstraintLayout` 布局引擎通过调整组件的位置来响应设备旋转并支持不同尺寸的屏幕。要为布局添加这种响应性，必须实现对向约束。\n\n###\
  \ 18.1.3 对向约束（Opposing Constraints）\n\n在单个组件上沿同一轴线运行的两个约束被称为对向约束。换句话说，一个左侧和右侧都具有约束的组件被认为具有水平对向约束。例如，图\
  \ 18-2 演示了在之前的布局中同时添加水平和垂直对向约束的情况：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴线上实现了对向约束，组件的定位将变为基于百分比而非基于坐标。例如，组件不再固定在距离布局顶部\
  \ 20dp 的位置，而是被放置在距离布局顶部 30% 的位置。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 将始终处于相对于父级布局尺寸的相同位置。\n\
  \n现在需要理解的是，图 18-2 所示的布局不仅使用了对向约束，还应用了约束偏置（constraint bias）。\n\n### 18.1.4 约束偏置（Constraint\
  \ Bias）\n\n现在已经确定 `ConstraintLayout` 中的组件可能会受到对向约束连接的影响。默认情况下，对向约束是相等的，导致相应的组件在对向轴线上居中。例如，图\
  \ 18-3 显示了一个使用水平和垂直对向约束的、且在包含它的 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在存在对向约束的情况下调整组件位置，`ConstraintLayout` 实现了一种名为约束偏置（constraint bias）的功能。约束偏置允许组件沿对向轴线的定位根据指定的百分比产生偏置，以有利于其中一个约束。例如，图\
  \ 18-4 显示了之前具有 75% 水平偏置和 10% 垂直偏置的约束布局：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n\
  下一章的主题为“在 Android Studio 中使用 ConstraintLayout 的指南，将更详细地介绍这些概念，并解释这些功能如何集成到 Android\
  \ Studio 布局编辑器工具中。然而，还需要涵盖 `ConstraintLayout` 类的其他领域。\n\n### 18.1.5 链（Chains）\n\n\
  `ConstraintLayout` 链提供了一种方法，可以将两个或多个组件的布局行为定义为一个组。链可以在垂直或水平轴线上声明，并进行配置以定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接在一起时，它们就成了链。例如，图 18-5 演示了三个以这种方式成链的组件：\n\n![](img/Image24681.jpg)\n\
  \n图 18-5\n\n链中的第一个元素是链头（chain head），它在垂直链中对应顶部的组件，在水平链中对应最左侧的组件。整个链的布局行为主要通过在链头组件上设置属性来配置。\n\
  \n### 18.1.6 链样式（Chain Styles）\n\n`ConstraintLayout` 链的布局行为由应用于链头组件的链样式设置决定。`ConstraintLayout`\
  \ 类目前支持以下链布局样式：\n\n-   **散布链（Spread Chain）** – 链包含的组件均匀地分布在可用空间内。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\
  \n图 18-6\n\n-   **内部散布链（Spread Inside Chain）** – 链包含的组件均匀地分布在链头和链中的最后一个组件之间。头部和最后一个组件包含在间距分布中。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n-   **权重链（Weighted Chain）** –允许通过权重属性定义链中每个组件占据的空间。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n-   **紧凑链（Packed Chain）** – 构成链的组件聚集在一起，没有任何间距。可以应用偏置来控制链相对于容器的水平或垂直位置。\n\
  \n![](img/Image2500.jpg)\n\n图 18-9\n\n### 18.2 基线对齐（Baseline Alignment）\n\n到目前为止，本章仅提到了相对于组件侧边的约束（通常称为侧约束）。然而，一种常见的需求是组件相对于其显示的内容而非组件本身对齐。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n例如，假设图 18-1 中的布局需要一个 `TextView` 位于 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本垂直对齐。该布局的额外约束需要如图 18-10\
  \ 所示进行连接：\n\n![](img/Image2508.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button` 的基线垂直对齐，并在水平上距离\
  \ `Button` 对象左边缘 40dp。\n\n### 18.3 配置组件尺寸\n\n控制组件尺寸是用户界面设计过程的关键元素。`ConstraintLayout`\
  \ 提供了三种选项，可以设置在单个组件上以管理尺寸行为。这些设置单独为高度和宽度配置：\n\n-   **固定（Fixed）** – 组件固定为指定的尺寸。\n\
  -   **匹配约束（Match Constraint）** – 允许布局引擎调整组件大小以满足主流约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n-   **包裹内容（Wrap Content）** – 组件的大小由其包含的内容（即文本或图形）决定。\n\n### 18.4 辅助线辅助工具（Guideline\
  \ Helper）\n\n\n\n\n\nGuidelines（指南）是 `ConstraintLayout` 内部的一种特殊元素，它们提供了一个额外的目标，约束可以连接到该目标。一个\
  \ `ConstraintLayout` 实例中可以添加多个指南，这些指南可以进一步被配置为水平或垂直方向。一旦添加，就可以在布局中的控件与指南之间建立约束连接。这在多个控件需要沿某个轴对齐时特别有用处。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 内的三个 `Button` 对象沿着一条垂直指南进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n## 18.5 Group Helper（组辅助类）\n\n`ConstraintLayout` 的此功能允许将控件放置在逻辑组中，并作为一个单一实体控制这些控件的可见性。`Group`\
  \ 本质上是布局中其他控件的引用列表。一旦定义，更改 `Group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将该更改应用到所有组员。这使得通过更改单个属性就能轻松地隐藏和显示多个控件。一个布局可以包含多个组，而一个控件可以属于多个组。如果组之间发生冲突，则在\
  \ XML 文件中最后声明的组具有优先级。\n\n## 18.6 Barrier Helper（屏障辅助类）\n\n与指南类似，barriers（屏障）是用于约束布局内视图的虚拟视图。与指南一样，屏障可以是垂直或水平的，并且可以将一个或多个视图约束到它上面（为了避免混淆，这些将被被称为受约束视图）。然而，与指南在布局中保持固定位置不同，屏障的位置是由一组所谓的“引用视图”（reference\
  \ views）定义的。屏障的引入是为了解决某些情况下经常发生的视图重叠问题。例如，考虑下方的图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n关于上述布局需要注意的关键点是，`View 3` 的宽度设置为匹配约束模式，并且视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现方式，增加\
  \ `View 1` 的宽度将产生预期效果，即减少 `View 3` 的宽度：\n\n![](img/Image25331.jpg)\n\n图 18-13\n\n\
  然而，如果增加的是 `View 2` 的宽度而不是 `View 1`，就会出现问题：\n\n![](img/Image25401.jpg)\n\n图 18-14\n\
  \n显然因为 `View 3` 仅受到 `View 1` 的约束，它不会调整大小以适应 `View 2` 宽度的增加，导致视图重叠。\n\n解决此问题的方法是添加一个垂直屏障并将\
  \ `Views 1` 和 `View 2` 分配为屏障的引用视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的宽度增加时，屏障将移动以适应较宽视图，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\n\
  ![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的引用视图和受约束视图的数量没有限制。\n\n## 18.7\
  \ Flow Helper（流辅助类）\n\n`ConstraintLayout Flow` 辅助类允许视图组以流式网格布局样式显示。与 `Group` 辅助类一样，`Flow`\
  \ 包含了对其负责定位的视图引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大控件数量）、间隔和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括 spread（分布）、spread inside（内部分布）和 packed（打包）选项。\n\n图 18-16 代表了使用 `Flow`\
  \ 辅助类实例以水平模式且无换行设置的五个等大小按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\n\
  图 18-17 显示了相同的按钮在水平流配置中的情况，换行设置为每第三个控件后发生一次：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了换行设置为使用 spread inside 链模式的按钮（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap` 属性以在按钮之间添加间隔：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\
  \n作为 `Flow` 辅助类灵活性的最后一个演示，图 18-19 显示了五个大小不一的按钮，配置为水平、打包链模式，并在每第三个控件后换行。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0`，网格内容已右对齐（值为 `0.0` 将导致左对齐，而 `0.5` 将使网格内容居中对齐）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 Ratios（比例）\n\n可以使用比例设置定义控件的尺寸。例如，一个控件可以使用比例设置进行约束，使得无论如何调整大小，宽度始终是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供了这种灵活性，允许在需要嵌套多个布局的情况下，通过单个布局实例实现许多旧布局的功能。这通过允许设计所谓的“扁平”或“浅”布局层次，避免了布局嵌套固有的问题，从而提高了运行时界面的性能。\n\
  \n`ConstraintLayout` 也是为了解决广泛的 Android 设备屏幕尺寸而实现的。`ConstraintLayout` 的灵活性使得设计适应并响应运行应用程序的设备的用户界面变得更容易。\n\
  \n最后，正如“在 Android Studio 中使用 ConstraintLayout 的”(#Constraint_Layout_in_Studio.xhtml__idTextAnchor443)章节将展示的那样，Android\
  \ Studio 布局编辑器针对基于 `ConstraintLayout` 的界面设计进行了增强。\n\n## 18.10 ConstraintLayout 的可用性\n\
  \n尽管 `ConstraintLayout` 是在 Android 7 中引入的，但它是作为独立的支持库从主 Android SDK 中提供的，并向下追溯到\
  \ API 9 (Gingerbread) 的旧 Android 版本。这使得使用这种新布局的应用程序可以在运行旧版本 Android 的设备上运行。\n\n\
  ## 18.11 总结\n\n`ConstraintLayout` 是在 Android 7 中引入的布局管理器。它的设计目的是为了创建适应目前市场上许多 Android\
  \ 设备尺寸和方向的灵活布局。`ConstraintLayout` 使用约束来控制相对于父 `ConstraintLayout` 实例、指南、屏障以及布局中其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建的 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以以惊人的便利实现复杂且响应式的用户界面。\n\
  \n\n\n\n\n正如前面的章节中多次提到的那样，Google 对 Android Studio 布局编辑器（Layout Editor）工具进行了重大更改，其中许多更改仅是为了支持使用\
  \ `ConstraintLayout` 进行用户界面布局设计。在上一节概述了 `ConstraintLayout` 的基本概念之后，本章将详细探讨这些概念，同时概述布局编辑器工具允许设计和实现基于\
  \ `ConstraintLayout` 的用户界面的方法。\n\n## 19.1 设计与布局视图\n\n标题为 \"Android Studio 布局编辑器工具指南\"\
  的章节解释了 Android Studio 布局编辑器工具提供了两种查看 Activity 的用户界面布局的方式，即设计（Design）视图和布局（Layout）视图（也称为蓝图视图）。这些布局视图可以单独显示，也可以像图\
  \ 19-1 所示那样并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n`Design`\
  \ 视图（位于图左侧）呈现了布局的“所见即所得”表示，其中布局的外观与在运行程序中的显示的完全一致。另一方面，`Layout` 视图显示的是蓝图风格的视图，组件由阴影轮廓表示。如上面的图\
  \ 19-1 所示，`Layout` 视图还显示了约束连接（在这种情况下，用于将按钮居中在布局中的对立约束）。当选择布局中的特定组件或鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观都可以使用图 19-3 所示的 `View Options` 菜单进行更改：\n\n![](img/as_show_constraints.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局的两种模式外，布局编辑器工具还提供了三种不同的方法来为特定的布局设计建立约束。\n\n## 19.2 自动连接模式\n\
  \n`Autoconnect` 正顾其名，它会在项目添加到布局时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮来启用或禁用 `Autoconnect`\
  \ 模式：\n\n![](img/as_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法，根据组件的位置以及组件与父布局边缘及布局中其他元素的接近程度，来决定建立最佳约束。如果任何自动约束连接未能提供预期的行为，可以像本章稍后概述的那样手动修改。\n\
  \n## 19.3 推断模式\n\n`Inference` 模式使用涉及算法和概率的启发式方法，在组件已添加到布局后自动实现约束连接。这种模式通常在 `Autoconnect`\
  \ 功能被关闭且对象在没有任何约束连接的情况下被添加到布局时使用。这允许通过简单地从调色板将对象拖放到布局画布上，并不断更改尺寸和位置，直到布局符合要求，从而完成设计。本质上，这涉及在不担心约束的情况下“绘制”布局。`Inference`\
  \ 模式也可以在设计过程中的任何时候填充布局中缺失的约束。\n\n当点击图 19-5“Infer constraints”按钮时，约束会自动添加到布局中：\n\n\
  ![](img/as_inference_mode.jpg)\n\n图 19-5\n\n与 `Autoconnect` 模式一样，布局编辑器工具始终可能推断错误的约束，尽管可以手动进行修改和修正。\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解布局编辑器工具中组件周围出现的各种句柄将很有帮助。例如，考虑图 19-6\
  \ 所示的组件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n显然，像弹簧一样的线条 (A)\
  \ 代表了从组件边缘到目标的已建立约束连接。对象每个角的小正方形标记 (B) 是缩放句柄，点击并拖动它们可以缩放组件尺寸。位于组件每侧的小圆圈句柄 (C) 是侧约束锚点。要创建约束连接，点击句柄并将生成的线条拖动到要连接的元素上（例如辅助线或父布局或另一个组件的侧边），如图\
  \ 19-7 所示。当连接到另一个组件的侧边时，只需将线条拖到该组件的侧约束句柄，并在组件和句柄高亮时释放线条。\n\n![](img/as_4.1_constraint_drag_line.jpg)\n\
  \n图 19-7\n\n如果将约束线拖到组件并释放，但未附加到约束句柄，布局编辑器将显示一个菜单，列出可以附加的侧。在图 19-8 中，约束可以附加到目标组件的顶部或底部：\n\
  \n![](img/as_4.1_constraint_between_widgets.jpg)\n\n图 19-8\n\n额外的标记表示基线约束的锚点，使用组件内部内容而非外部边缘作为对齐点。要显示此标记，只需右键点击组件并选择\
  \ `Show Baseline`。要从基线句柄建立约束连接，只需将鼠标指针悬停在句柄上直到其高亮，然后点击并拖到目标（如图 19-9 所示的另一个组件的基线锚点）。\n\
  \n![](img/as_baseline_constraint.jpg)\n\n图 19-9\n\n再次右键点击组件并选择 `Hide Baseline` 选项即可隐藏基线锚点。\n\
  \n## 还可以使用图 19-10 所示位于 `Attributes` 工具窗口中的 `Inspector` 面板向视图中添加约束。中间的正方形代表当前选中的视图，正方形周围的区域表示应用于视图对应侧的约束（如果有的话）：\n\
  \n![](img/as_3.5_constraint_attributes.jpg)\n\n图 19-10\n\n视图侧缺少约束由指向带有加号的蓝色圆圈的虚线表示（如上图视图底部所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将添加连接到它认为布局中最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n可以通过显示下方图 19-11 所示的 `Attributes` 工具窗口中的 `Constraints` 部分，来查看当前选中组件的配置约束列表：\n\
  \n![](img/as_3.5_attributes_constraints_list.jpg)\n\n图 19-11\n\n\n\n\n\n点击列表中的约束将在设计布局中选中该约束。\n\
  \n### 19.7 删除约束\n\n要删除单个约束，只需在设计布局或 `Attributes`（属性）工具窗口中选择该约束，使其变为高亮状态（例如图 19-12\
  \ 所示，选中了最右侧的约束），然后按下键盘上的 delete（删除）键。该约束将将从布局中移除。\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  \n图 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS 上为 `Cmd`）的同时将鼠标指针悬停在约束锚点上，并在变为红色后点击锚点：\n\n\
  ![](img/as_4.1_constraint_delete.jpg)\n\n图 19-13\n\n或者，通过右键点击小组件并选择 `Clear Constraints\
  \ of Selection`（清除选中约束）菜单选项来移除该组件上的所有约束。\n\n要移除布局中每个组件的所有约束，请使用图 19-14 中高亮的工具栏按钮：\n\
  \n![](img/as_clear_constraints.jpg)\n\n图 19-14\n\n### 19.8 调整约束偏置\n\n在上一章中，概述了使用偏置（bias）设置来倾向于一个相对约束而非另一个的概念。`Android\
  \ Studio Layout Editor` 工具中的偏置是通过位于 `Attributes` 工具窗口中的 `Inspector`（检查器）调整的，如图 19-15\
  \ 所示。图中由箭头指示的两个滑块用于控制当前选中组件的垂直和水平相对约束的偏置。\n\n![](img/as_3.2_constraint_bias_sliders.jpg)\n\
  \n图 19-15\n\n### 19.9 理解 ConstraintLayout 边距\n\n约束可以结合边距使用，以便在组件与其他元素（如另一个组件、辅助线或父布局侧边）之间实现固定间隙。例如，考虑图\
  \ 19-16 中应用于 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\n\
  图 19-16\n\n按照目前的配置，水平约束延伸到父 `ConstraintLayout` 的左、右边缘。因此，该组件具有相对水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时组件的实际位置方面具有裁量权。这使得布局具有一定的灵活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置也能控制组件的位置直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的相同按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n图 19-17\n\
  \n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他部分的布局变化时，组件也无法移动到间隙内。在图\
  \ 19-18 中，显示了 50% 的边距，即使在调整偏置或响应活动其他部分的布局变化时，组件也无法移动。\n\n![](img/as_4.1_constraint_bias_50.jpg)\n\
  \n图 19-18\n\n组件上现有的边距值可以通过 `Inspector` 修改。如图 19-19 所示，下拉菜单允许在右侧输入数字。\n\n![](img/as_3.2_constraint_margins.jpg)\n\
  \n图 19-19\n\n新约束的默认边距可以使用工具栏图 19-20 随时更改：\n\n![](img/as_constraints_margins.jpg)\n\
  \n图 19-20\n\n### 19.10 相对约束的重要性\n\n正如上一章所讨论的，相对约束、边距和偏置形成了响应式布局的基石。在使用 `ConstraintLayout`\
  \ 时，相对约束在编辑器中以实线形式视觉化地指示，如图 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\
  \n图 19-21\n\n结果是，如果设备发生旋转，该组件将不再可见（如图 19-22 所示）。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现相对约束时，约束连接由弹簧状线条表示（使用弹簧比喻是为了位置没有固定在绝对 X 和 Y 坐标上）：\n\n![](img/as_4.1_constraints_constrained.jpg)\n\
  \n图 19-23\n\n在上述布局中，垂直和水平偏置设置已配置，使得组件始终位于距离底部 90% 距离父布局左边缘的 35%。因此，当旋转时，组件相对于屏幕尺寸仍处于相同位置：\n\
  \n![](img/as_4.1_constraints_constrained_landscape.jpg)\n\n图 19-24\n\n### 19.11\
  \ 配置组件尺寸\n\n`ConstraintLayout` 中组件的内部尺寸也可以通过 `Inspector` 配置。如上一章概述的，组件尺寸可以设置为内容包裹（wrap\
  \ content）、固定（fixed）或匹配约束（match constraint）。当前选中组件每个维度的现有设置显示 `Inspector` 中代表组件的正方形内，如图\
  \ 19-25 所示：\n\n![](img/as_3.2_constraint_widget_dimensions.jpg)\n\n图 19-25\n\n在图中，水平和垂直维度都设置为内容包裹模式（由向内的\
  \ V 形指示）。检查器使用以下视觉指示器来表示三种维度模式：\n\n| 固定尺寸 | ![](img/Image2826.jpg) |\n| 匹配约束 | ![](img/Image2834.jpg)\
  \ |\n| 内容包裹 | ![](img/Image2844.jpg) |\n\n表 19-1\n\n更改当前设置，只需点击指示器并在三种不同设置之间循环。当布局编辑器中视图的维度设置为匹配约束模式时，视图相应的边将用弹簧状线条代替通常的直线。例如在图\
  \ 19-26 中，仅视图的宽度被设置为匹配约束：\n\n![](img/Image2855.jpg)\n\n图 19-26\n\n\n\n\n\n此外，可以通过\
  \ `Expand horizontally`（水平扩展）和 `Expand vertically`（垂直扩展）选项将组件的大小扩展到约束以及布局中其他组件允许的最大范围。这些选项可以通过在布局中的组件上**点击右键**，并在弹出的菜单中选择\
  \ `Organize`（组织）选项来访问（图 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大尺寸，以填充其周围的可用空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n## 19.12 设计时工具定位\n\n标题为 Android Studio 布局编辑器工具指南的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器中生效的可见性属性。在后台，Android\
  \ Studio 还会使用 `tools` 属性在组件放置于布局中但没有约束时，将它们保持在原有位置。例如，想象一下在禁用自动连接模式时将一个 `Button`\
  \ 放置在布局中。虽然组件在预览画布中似乎处于正确位置，但在运行应用时它会出现在屏幕的左上角。这是因为组件没有约束来告诉父级 `ConstraintLayout`\
  \ 将其放在哪里。\n\n组件在布局编辑器中看起来位于正确位置的原因是 Android Studio 设置了绝对 X 和 Y 定位 `tools` 属性，以便在添加约束之前将其保持在正确位置。在\
  \ XML 布局文件中，内容可能如下：\n\n```xml\n<Button\n    android:id=\"@+id/button4\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  Button\"\n    tools:layout_editor_absoluteX=\"111dp\"\n    tools:layout_editor_absoluteY=\"\
  88dp\" />\n```\n\n一旦为组件添加了足够的约束，这些 `tools` 属性将由布局编辑器移除。一种快速识别哪些组件缺少约束的实用技巧（而无需等待应用运行）是点击图\
  \ 19-28 中高亮的按钮来切换工具位置的可见性。任何跳转到左上角的组件都是未完全约束的，它们正被临时的 tools 绝对 X 和 Y 定位属性保持在位。\n\
  \n![](img/as_4.1_toggle_tools_positions.jpg)\n\n图 19-28\n\n## 19.13 添加辅助线\n\n辅助线（Guidelines）提供了约束可以在其锚定的额外元素。可以通过在布局上点击右键并选择\
  \ `Vertical Guideline`（垂直辅助线）或 `Horizontal Guideline`（水平辅助线）菜单选项，或者使用工具栏菜单选项（如图\
  \ 19-29 所示）来添加辅助线：\n\n![](img/as_guidelines_menu.jpg)\n\n图 19-29\n\n或者从 `Palette`（调色板）的\
  \ `Helpers` 部分拖动水平和垂直 `Guidelines`，将其将其到布局画布或 `Component Tree`（组件树）面板：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n一旦添加，辅助线将在布局中以虚线的形式出现，可以通过点击并拖动线来简单移动。要建立到辅助线的约束连接，请点击组件的约束句柄，并在释放之前拖动到辅助线。在图\
  \ 19-31 中，两个 `Buttons` 的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（对于水平辅助线则为顶部或底部）。例如，上图中的垂直辅助线距离父级左边缘\
  \ 96dp。\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-31\n\n或者，辅助线可以定位为父布局总宽度或高度的百分比。要在这这模式模式之间切换，请选择辅助线并点击辅助线顶部或起始处的圆圈（取决于辅助线是垂直还是水平）。图\
  \ 19-32 例如显示了一个基于百分比定位的辅助线：\n\n![](img/as_4.1_constraint_guideline_percentage.jpg)\n\
  \n图 19-32\n\n## 19.14 添加屏障\n\n添加屏障可以通过在布局上点击右键并在 `Add helpers...` 中选择 `Vertical\
  \ Barrier`（垂直屏障）或 `Horizontal Barrier`（水平屏障）选项，或者像之前在图 19-29 所示所示工具栏菜单选项。或者，在 `Palette`\
  \ 的 `Helpers` 部分找到 `Barrier` 类型并将其拖放到布局画布或 `Component Tree` 面板。\n\n一旦布局中添加了屏障，它将作为\
  \ `Component Tree` 面板中的项出现：\n\n![](img/as_4.2_barrier_added.jpg)\n\n图 19-33\n\n\
  要将视图作为引用视图（换句话说，控制屏障位置的视图），只需将组件从 `Component Tree` 内部拖到屏障上。在图 19-34 中，例如，`textView1`\
  \ 和 `textView2` 已分配给 `barrier`：\n\n![](img/as_4.2_barrier_children.jpg)\n\n图 19-34\n\
  \n在添加引用视图后，需要配置屏障以指定其相对于这些视图的方向。当在 `Component Tree` 中选择屏障时，这是属性窗口中定义的屏障方向设置：\n\n\
  ![](img/as_4.1_layout_direction.jpg)\n\n图 19-35\n\n下图了一个包含 `barrier` 的布局，其中 `textView1`\
  \ 和 `textView2` 作为引用视图，`textview3` 作为约束视图。由于屏障从引用视图的 `end` 推向约束视图，因此屏障方向已设置为 `end`：\n\
  \n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n## 19.15 添加组\n\n要在布局中添加\
  \ `Group`（组），请在布局上点击右键并在辅助工具菜单中选择 `Group` 选项，或者使用之前在图 19-29 所示的工具栏菜单选项。或者，在 `Palette`\
  \ 的 `Helpers` 部分找到 `Group` 项目并将其拖放到布局画布或 `Component Tree` 面板。\n\n要向组添加组件，请在 `Component\
  \ Tree` 中选择它们并将它们拖到 `Group` 项上。图 19-37 例如显示了三个选中的组件被添加到组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\
  \n图 19-37\n\n组引用的任何组件在 `Component Tree` 中的组项下方均*斜体*显示，如图 19-38 所示。要从组中移除组件，只需选择它并按下键盘删除键：\n\
  \n![](img/as_4.1_group_widget_list.jpg)\n\n图 19-38\n\n一旦将组件分配给组，使用属性窗口的 `Constraints`\
  \ 部分来修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n\n图 19-39\n\n## 19.16 使用\
  \ Flow 辅助工具\n\n`Flow` 辅助工具可以像之前其他辅助工具那样使用菜单或调色板添加。与 `Group` 辅助工具一样（图 19-37），通过将组件从\
  \ `Component Tree` 内部拖到 `Flow` 实例来添加组件。在了 `Flow` 辅助工具并为其分配组件后，在 `Component Tree`\
  \ 中选择它并使用属性窗口的 `Common Attributes` 部分来配置流布局行为：\n\n\n\n\n\n![](img/as_4.1_flow_attributes.jpg)\n\
  \n图 19-40\n\n## 19.17 组件组的对齐与分布\n\nAndroid Studio 布局编辑器工具在选择两个或多个组件时，提供了一系列对齐和分布操作。只需按住\
  \ Shift 键点击要包含在操作中的每个组件，右键点击布局，并从 `Align`（对齐）菜单显示的许多选项中进行选择：\n\n![](img/as_layout_align_menu.jpg)\n\
  \n图 19-41\n\n如下方的图 19-42 所示，这些选项也可以通过布局编辑器工具栏上的 `Align` 按钮访问：\n\n![](img/as_align_menu.jpg)\n\
  \n图 19-42\n\n同样，`Pack`（打包）菜单（图 19-43）可以用于共同重新定位所选组件，使其在垂直或水平方向上紧凑地排列在一起。它通过更改组件的绝对\
  \ x 和 y 坐标来实现，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上均匀间距，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n\n## 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用一个或多个其他 Android 布局类（例如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，布局编辑器工具提供了一个将用户界面转换为使用\
  \ `ConstraintLayout` 的选项。\n\n当布局编辑器工具打开并处于设计模式时，`Component Tree`（组件树）面板显示在 `Palette`（调面板）下方。要将布局转换为\
  \ `ConstraintLayout`，在 `Component Tree` 中找到它，右键点击它并选择 `Convert <current layout>\
  \ to Constraint Layout`（将当前布局转换为 Constraint Layout）菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\
  \n图 19-44\n\n选择此菜单选项后，Android Studio 将将所选布局转换为 `ConstraintLayout`，并使用推断来建立旨在匹配原始布局类型行为的约束。\n\
  \n## 19.19 总结\n\n重新设计的布局编辑器工具结合 `ConstraintLayout`，使得使用 Android Studio 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束、外边距（margins）和偏移（bias）的概念，同时探索了基于\
  \ `ConstraintLayout` 的设计是如何集成到布局编辑器工具中的。\n\n## 20 在 Android Studio 中使用 ConstraintLayout\
  \ 链和比例\n\n之前的章节介绍了 `ConstraintLayout` 类的关键特性，并概述了在 Android Studio 布局编辑器中基于 `ConstraintLayout`的用户界面设计的最佳实践。虽然\
  \ `ConstraintLayout` 链和比例的概念在标题为“Android ConstraintLayout 指南”的章节中已经过过，但我们尚未讨论过如何在布局编辑器中使用这些功能。因此，本章的重点是提供在使用\
  \ `ConstraintLayout` 类时如何创建和管理链与比例的实际步骤。\n\n## 20.1 创建链（Chain）\n\n链可以通过向 Activity\
  \ 的 XML 布局资源文件添加几行代码来实现，也可以通过使用布局编辑器的某些链特定功能来实现。\n\n考虑一个由三个 `Button` 组件组成的布局，它们被约束为位于\
  \ `ConstraintLayout` 父布局的左上角、顶部中央和右上角，如图 20-1](#Chains_and_Ratios.xhtml__idTextAnchor506)所示：\n\
  \n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含以下按钮组件的条目：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\" />\n```\n\n按照目前的配置，这些组件没有双向约束来将它们组合成链。要解决这个问题，需要从\
  \ `button1` 的右侧向 `button2` 的左侧添加约束，并从 `button3` 的左侧向 `button2` 的右侧添加约束，如下：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改，组件现在具有了双向水平约束。这在本质上构成了一个 `ConstraintLayout` 链，在布局编辑器中通过链连接视觉化表示，如下方的图\
  \ 20-2](#Chains_and_Ratios.xhtml__idTextAnchor508)所示。注意，在此配置下，链默认使用了散链样式。\n\n![](img/as_4.1_layout_horizontal_chain.jpg)\n\
  \n图 20-2\n\n链也可以通过右键点击其中一个视图并选择 `Chains -> Create Horizontal Chain`（创建水平链）或 `Chains\
  \ -> Create Vertical Chain`（创建垂直链）菜单选项来。\n\n## 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout`\
  \ 将默认使用散链。可以通过右键点击链中的任何组件并选择 `Cycle Chain Mode`（循环链模式）菜单选项来更改链样式。每点击一次菜单选项，样式就会在散（spread）、内散（spread\
  \ inside）和打包（packed）设置之间切换。\n\n或者，也可以在 `Attributes` 工具窗口中展开 `layout_constraints`\
  \ 属性，并根据链的方向更改 `horizontal_chainStyle` 或 `vertical_chainStyle` 属性来指定样式：\n\n\n\n\n\
  \n![](img/as_4.1_chain_style_attribute.jpg)\n\n图 20-3\n\n## 20.3 链式样式内部扩散 (Spread\
  \ Inside)\n\n图 20-4 展示了使用上述技术将链式样式更改为内部扩散链式样式的效果：\n\n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\
  \n图 20-4\n\n## 20.4 紧凑链样式 (Packed Chain)\n\n使用相同的技术，将 `chain style` 属性更改为 `packed`会导致布局发生变化，如\
  \ 图 20-5 所示：\n\n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n\
  ## 20.5 带有偏移的紧凑链样式 (Packed Chain with Bias)\n\n紧凑链的定位可能会受到应用偏移值（bias）的影响。偏移值可以是\
  \ `0.0` 到 `1.0` 之间的任何值，其中 `0.5` 代表父容器的中心。可以通过选择链头小部件并在属性（Attributes）面板中为 `layout_constraintHorizontal_bias`\
  \ 或 `layout_constraintVertical_bias` 属性赋值来控制偏移。图 20-6 显示了一个水平偏移设为 `0.2` 的紧凑链：\n\n\
  ![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\n图 20-6\n\n## 20.6 权重链\
  \ (Weighted Chain)\n\n最后一种需要探索的链区域涉及对单个控件设置权重，以控制链中每个控件在可用空间中所占据的比例。权重链只能通过 `spread`\
  \ 链式样式实现，并且链中任何要响应 `weight` 属性的控件必须将其相应的维度属性（垂直链为 `height`，水平链为 `width`）配置为 `match\
  \ constraint`（匹配约束）模式。控件维度的匹配约束模式可以通过选择小部件、显示属性面板并将维度更改为 `match_constraint`（等于 `0dp`）来配置。在图\
  \ 20-7 中，例如按钮的 `layout_width` 约束已设置为 `match_constraint` (`0dp`)，表示该控件的宽度将根据现有的约束设置来确定：\n\
  \n![](img/as_3.5_chain_match_constraints.jpg)\n\n图 20-7\n\n假设已选择 `spread` 链式样式，并且三个按钮都已配置为\
  \ `width` 维度设置为匹配约束，则链中的控件将等宽扩展以填充可用空间：\n\n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\
  \n图 20-8\n\n每个控件相对于链中其他控件所占空间的大小可以通过向小部件添加权重属性来控制。图 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight`\
  \ 属性设置为 `4`，将 `button2` 和 `button3` 均设置为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了空间的一半 (`4/8`)，而 `button2` 和 `button3` 各占据空间的四分之一\
  \ (`2/8`)。\n\n## 20.7 使用比例 (Working with Ratios)\n\nConstraintLayout 比例允许控件的一个维度相对于控件的另一个维度（也称为纵横比）进行尺寸调整。例如，可以将比例设置应用到\
  \ `ImageView` 上，以确保其宽度始终是高度的两倍。\n\n维度比例约束通过将受限制的维度设置为 `match constraint` 模式，并将该控件上的\
  \ `layout_constraintDimensionRatio` 属性配置为所需的比例完成配置。该比例值可以指定为浮点值，也可以指定为 `width:height`\
  \ 比例设置。例如，下面的 XML 代码为 `ImageView` 控件配置了 `2:1` 的比例：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"100dp\"\n    android:id=\"@+id/imageView\"\n\
  \    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为\
  \ `match constraint` 模式时，也可以应用比例。这涉及在比例前前加上 `H` 或 `W`，以指示哪一个维度是相对于另一个维度受限制的。\n\n\
  例如，考虑以下针对 `ImageView` 对象的 XML 代码：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    android:id=\"@+id/imageView\"\n  \
  \  app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintRight_toRightOf=\"\
  parent\"\n    app:layout_constraintLeft_toLeftOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintDimensionRatio=\"W,1:3\" />\n```\n\n在上面的示例中，高度将由应用到它的约束定义。在这种情况下，约束被配置为使其连接到父容器的顶部和底部，从而拉满整个高度。无论布局在什么尺寸或方向上，宽度都是父容器的三分之一。同样的结果也可以无需手动编辑\
  \ XML 文件来实现。当控件维度被设置为匹配约束时，属性面板的检查器区域会出现比例控件。图 20-10 显示了按钮的布局宽度和高度设置为匹配约束，并高亮了比例控件：\n\
  \n![](img/as_3.2_toggle_ratio_constraint.jpg)\n\n图 20-10\n\n默认情况下比例控制是关闭的。点击该控件可以启用比例约束并显示可以更改的额外字段：\n\
  \n![](img/as_3.2_toggle_ratio_settings.jpg)\n\n图 20-11\n\n## 20.8 总结\n\n链和比例都是 ConstraintLayout\
  \ 的强大功能，旨在为设计灵活的用户界面提供更多选项。正如本章所述，Android Studio Layout Editor 已经增强，便于在用户界面设计中使用这些功能。\n\
  \n# 21. Android Studio Layout 教程\n\n最简单且有效的方法是使用 Android Studio Layout Editor。本章将概述如何使用这种方法创建基于\
  \ ConstraintLayout 的用户界面。本章包含的练习也将作为一种机会，引导从空白 Android Studio 项目开始创建一个 activity。\n\
  \n## 21.1 布局工具示例\n\n示例阶段的第一步是创建一个新项目。首先启动 Android Studio，并通过选择 File -> Close Project\
  \ 选项关闭任何之前打开的项目。\n\n在欢迎屏幕上选择 New Project 选项。在之前的示例中，我们要求 Android Studio 为项目创建一个模板\
  \ activity。然而，我们将使用此教程学习如何手动创建一个全新的 activity 以及相应的布局资源文件，因此在点击 Next 按钮之前，请确保选择了\
  \ No Activity 。\n\n在 Name 字段中输入 LayoutSample，并指定包名为 `com.ebookfrenzy.layoutsample`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单更改为\
  \ Java。\n\n\n\n\n\n# 创建 Activity (Activity)\n\n一旦完成项目创建过程，就会出现 Android Studio 主窗口，我们就可以准备好创建一个新的\
  \ Activity。这将是一次非常有价值的学习练习，因为在开发 Android 应用程序的过程中，有很多场景需要从零开始创建新的 Activity。\n\n\
  首先，使用快捷键 `Alt-1`/`Cmd-1` 显示 `Project` 工具窗口（如果尚未显示）。在显示 Android 层次结构后，点击 `Project`\
  \ 窗口中项目右侧的右箭头将其展开。此的目标是访问项目层级中的 `app -> java -> com -> ebookfrenzy -> layoutsample`\
  \ 文件夹。一旦包名可见，右键点击它，并选择 `New -> Activity -> Empty Activity` 菜单选项，如图 21-1 所示。或者，选择\
  \ `New -> Activity -> Gallery...` 选项来浏览可用模板，并在 `New Android Activity` 对话框中选择。\n\n\
  ![](img/Image2435.jpg)\n\n图 21-1\n\n在弹出的 `New Android Activity` 对话框中，将新 Activity\
  \ 命名为 `MainActivity`，将布局命名为 `activity_main`。当然，该 Activity 需要一个布局资源文件，请确保启用 `Generate\
  \ a Layout File` 选项。\n\n为了让应用程序能够在设备上运行，它需要指定一个 Activity 作为启动 Activity（launcher\
  \ activity）。如果没有启动 Activity，操作系统将不知道在应用程序首次启动时启动哪个 Activity，导致应用程序启动失败。由于此示例只有一个\
  \ Activity，因此需要将其指定为应用程序的启动 Activity，请在点击 `Finish` 按钮之前确保 `Launcher Activity` 选项已启用。\n\
  \n此时，Android Studio 应该已经向项目添加了两个文件。Activity 的 Java 源代码文件位于 `app -> java -> com ->\
  \ ebookfrenzy -> layoutsample` 文件夹中。\n\n此外，用户界面的 XML 布局文件已经在 `app -> res -> layout`\
  \ 文件夹中创建。注意，此 Activity 选择了 `Empty Activity` 模板，因此布局完全包含在 `activity_main.xml` 文件，没有独立的内容布局文件。此外，由于我们不会编写任何代码来访问用户界面布局中的视图，因此没有必要将项目转换为支持视图绑定（view\
  \ binding）。\n\n最后，新 Activity 应该已添加到 `AndroidManifest.xml` 文件中并被指定为启动 Activity。清单文件可以在项目窗口的\
  \ `app -> manifests` 文件夹下找到，并应包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    package=\"com.ebookfrenzy.layoutsample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.LayoutSample\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".MainActivity\"\n         \
  \   android:exported=\"true\" >\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n## 21.3 准备布局编辑器环境\n\n找到并双击位于 `app -> res\
  \ -> layout` 文件夹中的 `activity_main.xml` 布局文件，将其加载到 `Layout Editor` 工具中。由于教程的目的是消除布局编辑器的神秘感，我们将使用它为三星\
  \ Galaxy S6 应用设计一个简单的界面。布局编辑器提供三种视图：`Code`、`Design` 和 `Split`。`Code` 视图显示 XML 源码，`Design`\
  \ 视图显示 UI 的视觉表示，而 `Split` 视图显示两者。对于本教程，我们将主要使用 `Split` 视图。\n\n在 `Split` 视图中，你将在左侧看到\
  \ XML 代码，右侧是视化编辑器。要向布局添加控件（widgets），你可以从 `Palette` 面板拖拽它们并释放到可视化编辑器上，或者直接输入到 XML\
  \ 代码中。`Palette` 分为几类，包括 `Buttons`、`Text`、`Common`、`Widgets` 和 `Helper`。\n\n## 21.4\
  \ 向用户界面添加控件\n\n从调板的 `Common` 中，将一个 `ImageView` 对象拖到显示器中心。注意指示显示中心轴的水平和垂直虚线。居中后，释放鼠标按钮将视图放置在相应位置。一旦放置在布局中，将出现\
  \ `Resources` 对话框寻找图像。在对话框顶部的搜索栏中，输入 `galaxy` 以定位 `galaxy6.png` 资源，如图 21-5 所示。\n\
  \n![](img/245.jpg)\n\n选择该图像并点击 `OK` 将其分配给 `ImageView`。如有必要，使用调整柄调整 `ImageView` 的大小，并将其重新置在布局中心。此时，布局应与图\
  \ 21-6 一致。\n\n![](img/335.jpg)\n\n图 21-6\n\n从调板的 `Common` 部分点击并拖拽 `TextView` 对象，并对其定位使其出现在\
  \ `ImageView` 上方，如图 21-7 所示。\n\n使用 `Attributes` 面板，展开 `Common Attributes` 部分中的 `textAppearance`\
  \ 项，将 `textSize` 属性更改为 `24sp`，`textAlignment` 设置为 `center`，并将 `text` 设置为 `Samsung\
  \ Galaxy S6`。\n\n![](img/34.jpg)\n\n图 21-7\n\n接下来在布局底部添加三个 `Button` 控件，并将这些视图的 `text`\
  \ 属性设置为 `Buy Now`、`Pricing` 和 `Details`。完成后的布局现在应与图 21-8 一致。\n\n![](img/41.jpg)\n\
  \n图 21-8\n\n此时，控件尚未足够的约束，以使布局引擎能够在运行时对控件进行定位和尺寸调整。如果现在运行应用程序，所有控件都将位于显示器的左上角。\n\n\
  在布局中添加控件后，使用 `Layout Editor` 工具栏中的设备旋转按钮（如图 21-9 中的箭头所示）在横屏模式下查看用户界面：\n\n![](img/44.jpg)\n\
  \n图 21-9\n\n\n\n\n由于缺乏约束，导致布局无法适应设备方向的变化，使得内容未居中，并且部分图像以及三个按钮都处于了屏幕可视区域之外。显然，要将其转变为响应式用户界面，仍需进行一些工作。\n\
  \n## 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸的布局的关键。首先，将布局旋转回竖屏方向，并选择位于 `ImageView` 之上的\
  \ `TextView` 小部件。选中部件后，将 `TextView` 的左侧、右侧和顶部建立约束到父 `ConstraintLayout` 对应的侧边，如图\
  \ 21-10 所示：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\
  \n设置好 `TextView` 小部件后，选择 `ImageView` 实例，并在左侧和右侧建立相对的约束，每个约束都连接到父布局对应的侧边。接下来，从 `ImageView`\
  \ 的顶部到 `TextView` 的底部建立约束连接，从 `ImageView` 的底部到中间 `Button` 小部件的顶部建立约束。如有必要，点击并拖动\
  \ `ImageView`，使其保持在布局的垂直中心位置。\n\n在保持 `ImageView` 选中状态的情况下，使用属性面板中的 `Inspector` 将\
  \ `ImageView` 的顶部和底部边距分别更改为 `24` 和 `8`，并将部件的高度和宽度维度属性均更改为 `match_constraint`，以便部件能够调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局的变化：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n\
  图 21-12 显示了 `ImageView` 相对于布局中其他元素的当前实现约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后一个任务是为三个 `Button` 小部件添加约束。在本例中，按钮将以链（chain）的形式放置。首先，通过点击图 21-2 中突出显示的工具栏按钮，在\
  \ `Layout Editor` 中开启 `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后按住 Shift 点击另外两个按钮，使三个按钮都被选中。右键点击\
  \ `Buy Now` 按钮，并在弹出的菜单中选择 `Chains -> Create Horizontal Chain` 选项。默认情况下，链将使用 `spread`\
  \ 样式显示，这是本例的正确行为。\n\n最后，在 `Buy Now` 按钮底部和布局底部之间建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应按照如图\
  \ 21-13 所示的方式进行约束：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\n图 21-13\n\n## 21.6\
  \ 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式，并验证布局是否适应了新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具为设计用户界面布局提供了一个实用的可视化环境，但在涉及测试时，运行应用程序进行测试是不可替代的。在物理\
  \ Android 设备或模拟器会话上启动应用，验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图 21-14 显示了横屏下运行的应用：\n\
  \n![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要进行定位、约束并设置属性即可。\n\
  \n## 21.7 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具随时查看组成用户界面布局的组件层次结构。要访问这些信息，应用必须在运行\
  \ `Android API 29` 或更高版本的设备或模拟器上运行。应用运行后，选择 `Tools -> Layout Inspector` 选项，然后使用下方图\
  \ 21-15 中标记为 A 的菜单选择要检查的进程）。\n\n一旦检查器加载，最左侧的面板 (B) 显示组成用户界面布局的组件层次结构。中间面板 (C) 显示布局设计的视觉化表示。点击视觉布局中的部件将导致该项在层次结构列表中高亮，从而易于找到视觉组件相对于整个布局层次结构所在的位置。\n\
  \n最后，最右侧的面板（在图 21-15 中标记为 D）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元将包含一个指向项目源代码中属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，点击标记为 E 的按钮。这将显示层次结构的“爆炸式”表示，以便对其进行旋转和检查。这对于识别被遮挡的视图非常有用：\n\
  \n![](img/as_4.1_layout_inspector.jpg)\n\n图 21-16\n\n使用图中指示的箭头拖动渲染进行三维旋转。点击标记为 E\
  \ 的按钮返回 2D 视图\n\n## 21.8 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout`\
  \ 类紧密集成。本章通过创建一个示例用户界面，概述了如何通过 `Layout Editor` 添加部件和设置约束来实现基于 `ConstraintLayout`\
  \ 的用户界面。本章还介绍了 `Layout Inspector` 工具，它对于分析用户界面的结构非常有用。\n\n## 22 Android Studio 中的手动\
  \ XML 布局\n\n虽然使用 Android Studio 设计布局极大提高了效率，但仍然可以通过手动编辑 XML 来创建布局。本章将介绍 Android\
  \ XML 布局的基础。\n\n## 22.1 手动创建 XML 布局\n\nXML 布局的结构实际上简单，遵循视图树的层次结构。XML 资源文件的第一行应当包含以下标准声明：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\n该声明之后应该是布局的根元素，通常是一个容器视图（如布局管理器）。它由起始和结束标签以及需要在视图上设置的属性表示。例如，以下\
  \ XML 声明 `ConstraintLayout` 视图作为根元素，分配了 ID `activity_main` 并设置了 `match_parent` 属性，以填充设备显示的所有空间：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\n\n\n```xml\n\
  tools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素的每个侧边都配置了 `16dp`（密度无关像素）的内边距。Android 布局中的任何间距规范必须使用以下测量单位之一：\n\
  \n* `in` – 英寸。\n* `mm` – 毫米。\n* `pt` – 磅（1/72 英寸）。\n* `dp` – 密度无关像素。一种基于设备显示器相对于\
  \ `160dpi` 显示基准的物理密度的抽象测量单位。\n* `sp` – 缩放无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n* `px`\
  \ – 实际屏幕像素。不建议使用，因为不同的显示器每英寸像素不同。请优先使用 `dp` 而非此单位。\n\n任何需要添加到 `ConstraintLayout`\
  \ 父元素的子元素都必须嵌套在起始和结束标签之间。在下面的示例中，已添加了一个 `Button` 控件作为 `ConstraintLayout` 的子元素：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"My Button\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:id=\"@+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距而缩进了 `16dp`）。然而，如果按钮两侧添加了相反的约束，它将在布局居中显示：\n\
  \n```xml\n<Button\n    android:text=\"My Button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\n \
  \   app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n注意，每个约束都连接到名为 `activity_main` 的元素上，在这种情况下，它是父级 `ConstraintLayout`\
  \ 实例。\n\n要向布局中添加第二个控件，只需将其嵌入 `ConstraintLayout` 元素的体中。例如，下面的修改为布局中添加了一个 `TextView`\
  \ 控件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingTop=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\"\n \
  \       app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"My Text\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  \n\n\n\n# 23.1 Java 代码对比 XML 布局文件\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面有许多优势。事实上，Google\
  \ 在 Android 文档中花费了大量精力来赞扬 XML 资源优于 Java 代码的优点。正如上一节所讨论的，XML 方法的一个关键优势包括可以使用 Android\
  \ Studio 布局编辑器工具，该工具本身可以生成 XML 资源。另一个优势是，一旦创建了应用程序，就可以通过简单的修改 XML 文件对用户界面屏幕进行更改，从而避免了重新编译应用程序的必要。此外，即使是手动编写\
  \ XML 布局，也可以通过 Android Studio 布局编辑器工具的预览功能获取用户界面外观的即时反馈。而要测试通过 Java 创建的用户界面外观，开发者不可避免地需要反复循环“编写代码、编译和测试”的过程，才能完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 相比 XML 资源文件最显著的优势可能在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是那些在每次调用\
  \ activity 之间不太可能发生显著变化的布局。另一方面，Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次执行 activity\
  \ 时显示得不同的情况下特别有用。\n\n当需要在 activity 运行时对基于静态 XML 资源的布局进行实时动态更改时，在 Java 代码中处理用户界面组件的知识也会有用。\n\
  \n最后，无论后期方法提供哪些优势，某些开发者简单地倾向于编写 Java 代码而不是使用布局工具和 XML。\n\n## 23.2 创建视图\n\n如前所述，Android\
  \ SDK 包含了一个视图类工具箱，旨在满足大多数基本用户界面设计需求。在 Java 中创建视图只需创建这些类的实例，并传递一个与该视图关联的 activity\
  \ 引用作为参数即可。\n\n第一个视图（通常是一个可以在其添加额外子视图的容器视图）通过调用 activity 的 `setContentView()` 方法向用户显示。可以通过调用对象的\
  \ `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的 ID。对于在\
  \ Java 中创建的视图也遵循相同的规则。因此，对于后续 Java 代码中需要某些类型访问的任何视图，必须为其分配一个 ID。这通过调用相关视图对象的 `setId()`\
  \ 方法来实现。在后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象将如何显示或行为。属性的示例包括显示在\
  \ `Button` 对象上的文本，或者 `ConstraintLayout` 视图的背景颜色。Android SDK 内的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用该方法以将按钮上显示的文本设置为特定的字符串值。相反，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackground()` 方法来设置。\n\n## 23.4 约束集\n\n虽然属性设置是视图内部的并决定了视图的外观和行为，但约束集用于控制视图相对于其父视图和其他兄弟视图的显示方式。每个\
  \ `ConstraintLayout` 实例都关联一组约束，定义了其子视图是如何定位和受限制的。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行诸如创建、配置和将约束应用于 `ConstraintLayout` 实例等任务。此外，`ConstraintLayout`\
  \ 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的约束应用于其他布局（带有或不带修改）。\n\n`ConstraintSet`\
  \ 实例的创建就像任何其他 Java 对象一样：\n\n```\nConstraintSet set = new ConstraintSet();\n```\n\
  \n一旦创建了约束集，就可以调用实例的方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，并有 70dp 的间距：\n\
  \n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\n           editText1.getId(),\
  \ ConstraintSet.RIGHT, 70);\n```\n\n## 23.4.2 将约束应用于布局\n\n一旦配置了约束集，必须将其应用于 `ConstraintLayout`\
  \ 实例才能生效。约束集通过调用 `applyTo()` 方法应用，传递要应用设置的布局对象的引用：\n\n```\nset.applyTo(myLayout);\n\
  ```\n\n### 23.4.3 父约束连接\n\n也可以通过引用 `ConstraintSet.PARENT_ID` 常量在子视图与其父 `ConstraintLayout`\
  \ 之间建立连接。在下面的示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，间距为 100dp：\n\n```\n\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP,\n           ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n\
  ```\n\n### 23.4.4 尺寸约束\n\n许多方法可以控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将\
  \ `ImageView` 实例的垂直尺寸最大 250dp：\n\n```\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移\n\n正如“在\
  \ Android Studio 中使用 ConstraintLayout”章节概述，当视图具有相反的约束时，它会在约束轴上居中（即水平或垂直）。这种居中可以通过在特定的约束轴上应用偏移来调整。当使用\
  \ Android Studio 布局编辑器时，这是通过属性窗口中的控件实现的。然而，在处理约束集工作时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，引用视图 ID 和 0 到 1 之间的浮点值作为偏移量。\n\n例如，以下代码在应用 25% 的水平偏移之前，将\
  \ `Button` 的左侧和右侧约束到父布局的相应侧边：\n\n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \           ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n           ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n\
  \n\n\n\n## 对齐\n\n也可以使用约束集（constraint set）来应用对齐。Android Studio 布局编辑器提供的完整对齐选项也可以通过\
  \ `centerVertically()` 和 `centerHorizontally()` 方法使用约束集进行配置，这两个方法都会根据正在配置的对齐方式接收各种参数。此外，还可以使用\
  \ `center()` 方法将一个视图在两个其他视图之间居中。\n\n在下面的代码中，`button2` 的位置使其与 `button1` 水平对齐：\n\n\
  ```java\nset.centerHorizontally(button2.getId(), button1.getId());\n```\n\n### 23.4.7\
  \ 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout` 实例的当前约束集复制到约束集对象中。例如，下行代码将名为\
  \ `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象中：\n\n```java\nset.clone(myLayout);\n\
  ```\n\n一旦复制，可以将约束集直接应用于另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\n```java\nConstraintSet\
  \ set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n也可以使用约束集中的 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法创建垂直和水平链。这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n```\n\
  \n基于语法，下面的示例创建了一个从 `button1` 开始到 `button4` 结束的水平散布链（spread chain）。在这些视图之间是 `button2`\
  \ 和 `button3`，它们的权重设置为零：\n\n```java\nint[] chainViews = {button2.getId(), button3.getId()};\n\
  float[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT,\
  \ button4.getId(), ConstraintSet.RIGHT, chainViews, chainWeights, ConstraintSet.CHAIN_SPREAD);\n\
  ```\n\n可以通过将要删除的视图的 ID 传递给 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()`\
  \ 方法，将视图从链中移除。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链。在这两种情况下，方法接收的参数是新视图要插入的视图之间的\
  \ ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 指南（Guidelines）\n\n使用 `create()` 方法将指南添加到约束集，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直指南并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧无边距地连接到该指南：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集中的视图移除约束，传递的参数为视图\
  \ ID 和要移除约束的锚点：\n\n```java\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\
  \n同样，通过在 `clear()` 方法调用中仅引用视图，可以一次性移除视图上的所有约束：\n\n```java\nset.clear(button.getId());\n\
  ```\n\n### 23.4.11 缩放\n\n可以使用 `ConstraintSet.setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收要操作的视图以及表示缩放的浮点值。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在\
  \ X 轴或 Y 轴上旋转视图，这两个方法都必须传递旋转视图的 ID 和表示旋转角度的浮点值。旋转发生的轴心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。下面的代码使用位于点 500, 500 的轴点在 Y 轴上旋转按钮视图 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n在涵盖了约束集的理论和从 Java 代码创建用户界面的内容后，下一章将通过创建一个示例应用程序，目标是将这些理论付诸实践。关于约束集的更多详细信息，请参阅：\n\
  \nhttps://developer.android.com/reference/androidx/constraintlayout/ConstraintSet\n\
  \n## 23.5 总结\n\n也可以使用约束集来应用对齐。Android Studio 布局编辑器提供的完整对齐选项也可以通过 `centerVertically()`\
  \ 和 `centerHorizontally()` 方法使用约束集进行配置，这两个方法都会根据正在配置的对齐方式接收各种参数。此外，还可以使用 `center()`\
  \ 方法将一个视图在两个其他视图之间居中。\n\n在下面的代码中，`button2` 的位置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout`\
  \ 实例的当前约束集复制到约束集对象中。例如，下行代码将名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n一旦复制，可以将约束集直接应用于另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n也可以使用约束集中的 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法创建垂直和水平链。这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n```\n\
  \n基于语法，下面的示例创建了一个从 `button1` 开始到 `button4` 结束的水平散布链（spread chain）。在这些视图之间是 `button2`\
  \ 和 `button3`，它们的权重设置为零：\n\n```java\nint[] chainViews = {button2.getId(), button3.getId()};\n\
  float[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT,\
  \ button4.getId(), ConstraintSet.RIGHT, chainViews, chainWeights, ConstraintSet.CHAIN_SPREAD);\n\
  ```\n\n可以通过将要删除的视图的 ID 传递给 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()`\
  \ 方法，将视图从链中移除。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链。在这两种情况下，方法接收的参数是新视图要插入的视图之间的\
  \ ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 指南（Guidelines）\n\n使用 `create()` 方法将指南添加到约束集，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直指南并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧无边距地连接到该指南：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
