  \n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚未成为实体。要使此类成为实体并使其在\
  \ SQL 语句中可访问，需要按照所示添加某些 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\
  public class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n  \
  \  @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了表名 `customers`。每个数据库表都需要一列作为主键。在这种情况下，`id`\
  \ 被声明为主键。还添加了注解来分配一个被引用的列名。最后，`id` 值是自动生成的。\n\n```java\n@Entity(tableName = \"customers\"\
  )\npublic class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n\
  \    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n注意，外键声明还指定了当父记录被删除或更新时要采取的操作。可选范围 `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT`\
  \ 和 `SET_NULL`。\n\n## 63.4 数据访问对象\n\n数据访问对象（DAO）提供了一种访问存储在 SQLite 数据库中数据的方法。\n\n\
  `DAO` 被声明为标准的 Java 接口，并带有一些额外的注解，将特定的 SQL 语句映射到随后由仓库调的方法。\n\n第一步创建接口并使用 `@Dao` 注解将其声明为\
  \ `DAO`：\n\n```java\n@Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，添加由 SQL\
  \ 语句和对应方法组成的条目。例如，下面的声明允许通过调用 `getAllCustomers()` 方法获取 customers 表中的所有行：\n\n```java\n\
  @Dao\npublic interface CustomerDao {\n    @Query(\"SELECT * FROM customers\")\n\
  \    LiveData<List<Customer>> getAllCustomers();\n}\n```\n\n\n\n注意，`getAllCustomers()`\
  \ 方法返回一个 `List` 对象，其中包含从数据库表中检索到的每条记录的 `Customer` 实体对象。`DAO` 还使用了 `LiveData`，以便仓库（repository）能够观察数据库的变化。\n\
  \n参数也可以传递给方法，并在相应的 SQL 语句中引用。考虑下面的 DAO 声明，它搜索与客户名称匹配的数据库记录（注意，`WHERE` 条件中引用的列名是实体类中分配给列的名称）：\n\
  \n```java\n@Query(\"SELECT * FROM customers WHERE name = :customerName\")\nList<Customer>\
  \ findCustomer(String customerName);\n```\n\n在此示例中，方法接收了一个字符串值，该值随后通过在变量名前前加冒号 (:)\
  \ 被包含在 SQL 语句中。\n\n可以使用 `@Insert` 方便注解按如下声明一个基本的插入操作：\n\n```java\n@Insert\nvoid\
  \ addCustomer(Customer customer);\n```\n\n这被称为方便注解，因为 Room 持久化库可以推断传递给 `addCustomer()`\
  \ 方法的 `Customer` 实体将被插入数据库，而无需提供 SQL 插入语句。也可以像所示在单个事务中插入多条数据库记录：\n\n```java\n@Insert\n\
  public void insertCustomers(Customer... customers);\n```\n\n下面的 DAO 声明删除了所有与提供的客户名称匹配的记录：\n\
  \n```java\n@Query(\"DELETE FROM customers WHERE name = :name\")\nvoid deleteCustomer(String\
  \ name);\n```\n\n作为使用 `@Query` 注解执行删除的替代方案，也可以使用 `@Delete` 方便注解。在下面的示例中，所有与传递给 `deleteCustomers()`\
  \ 方法的实体集匹配的 `Customer` 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供了类似的行为：\n\n```java\n@Update\npublic\
  \ void updateCustomers(Customer... customers);\n```\n\n这些数据库操作的 DAO 方法也可以声明返回一个\
  \ `int` 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer...\
  \ customers);\n```\n\n## 63.5 Room 数据库\n\n`RoomDatabase` 类通过扩展 `RoomDatabase` 类来创建，它作为嵌入在\
  \ Android 系统的实际 SQLite 数据库之上的层。该类负责创建并返回一个新的 Room 数据库实例，并提供对数据库关联的 `DAO` 实例的访问。\n\
  \nRoom 持久化库提供了一个创建数据库实例的构建器。每个 Android 应用应该只有一个 `room-database` 实例，因此最好在类中实现防御性代码，以防止创建多个实例。\n\
  \n接下来的代码列表列出了用于示例客户表的 Room 数据库实现示例：\n\n```java\nimport android.content.Context;\n\
  import android.arch.persistence.room.Database;\nimport android.arch.persistence.room.Room;\n\
  import android.arch.persistence.room.RoomDatabase;\n\n@Database(entities = {Customer.class},\
  \ version = 1)\npublic class CustomerRoomDatabase extends RoomDatabase {\n    public\
  \ abstract CustomerDao customerDao();\n\n    private static CustomerRoomDatabase\
  \ INSTANCE;\n\n    static CustomerRoomDatabase getDatabase(final Context context)\
  \ {\n        if (INSTANCE == null) {\n            synchronized (CustomerRoomDatabase.class)\
  \ {\n                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(\n\
  \                            context.getApplicationContext(),\n                \
  \            CustomerRoomDatabase.class, \"customer_database\")\n              \
  \              .build();\n                }\n            }\n        }\n        return\
  \ INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域是：类声明上方声明数据库将处理的实体的注解、检查类实例是否已经创建的代码，以及为实例分配名称\
  \ `customer_database`。\n\n## 63.6 仓库\n\n仓库负责获取 Room 数据库实例，使用该实例访问关联的 `DAOs`，然后调用\
  \ `DAO` 方法执行数据库操作。一个设计用于与 Room 数据库工作的仓库的典型构造函数可能如下所示：\n\n```java\npublic class CustomerRepository\
  \ {\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase db;\n\
  \n    public CustomerRepository(Application application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n}\n```\n\n一旦仓库获取了 `DAO`，它就可以调用数据访问方法。例如，接下来的代码调用了\
  \ `getAllCustomers()` DAO 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，重要的是，除非方法返回 `LiveData`\
  \ 实例（该实例自动在单独线程上运行查询），否则无法在应用的主线程上执行该操作。事实上，尝试这样做会导致应用崩溃并输出以下诊断信息：\n\n`Cannot access\
  \ database on the main thread since it may potentially lock the UI for long period`\n\
  \n由于某些数据库事务可能需要更长时间才能完成，因此在单独线程上运行操作可以避免应用出现假死现象。正如在“Android Room Database and Repository”章节中将演示的那样，这个问题可以通过使用\
  \ Java 线程轻松解决（如需更多信息或关于如何使用线程的提醒，请参考“Java 线程基础概述”章节）。\n\n## 63.7 内存数据库\n\n本章概述的示例涉及使用作为\
  \ Android 设备持久化存储上文件的 SQLite 数据库。这确保了数据在应用程序终止后仍然存在。\n\nRoom 持久化库还支持内存数据库。这些数据库完全存储在内存中，并在应用程序终止时丢失。要使用内存数据库，唯一的更改是调用\
  \ `Room` 类的 `Room.inMemoryDatabaseBuilder()` 方法而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建文件存储数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \        CustomerRoomDatabase.class, \"customer_database\")\n        .build();\n\
  \n// 创建内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \        CustomerRoomDatabase.class)\n        .build();\n```\n\n## 63.8 数据库检查器\n\
  \nAndroid Studio 包含一个数据库检查器工具窗口，允许对运行中应用程序关联的 Room 数据库进行查看、搜索和修改，如图 63-3 所示：\n\n\
  ![](img/as_database_inspector_window.jpg)\n\n图 63-3\n\n数据库检查器的使用将在“Android Room\
  \ Database and Repository”章节中介绍。\n\n## 63.9 总结\n\n\n\n\n\nAndroid Room 持久库包含在 Android\
  \ 架构组件中，它作为低级 SQLite 数据库之上的抽象层。该库的设计旨在使其符合 Android 架构指南的同时，更容易进行数据库操作。本章介绍了在 Android\
  \ 应用项目中构建基于 Room 的数据库存储的不同交互元素，包括实体（entities）、仓库（repositories）、数据访问对象（DAO）、注解以及\
  \ Room 数据库实例。\n\n在涵盖了 SQLite 和 Room 架构组件之后，下一步是创建一个示例应用将这些理论付诸实践。由于示例应用程序的用户界面需要基于表单的布局，下一章标题为“Android\
  \ TableLayout 和 TableRow 教程”的章节将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础知识。\n\
  \n# 64. Android TableLayout 和 TableRow 教程\n\n当开始编写本书的下一章（“Android Room 数据库和仓库教程”）时，最初打算包含为\
  \ Room 数据库示例应用设计用户界面布局的步骤。然而，显而易见，实现用户界面的最佳方法是利用 Android `TableLayout` 和 `TableRow`\
  \ 视图，而且这一主题值得单独成章。因此，本章将专门专注于下一章要完成的数据库应用程序的用户界面设计，并在此过程中花一些时间介绍 Android Studio\
  \ 中表格布局的基本概念。\n\n## 64.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图的目的是允许用户界面元素以行和列组成的表格格式组织在屏幕上。`TableLayout`\
  \ 中的每一行都由一个 `TableRow` 实例占据，该实例又被分为多个单元格，每个单元格包含一个子视图（该单元格本身可以是具有多个视图子项的容器）。\n\n\
  表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可延伸（或两者兼有），使其相对于父级 `TableLayout`\
  \ 变化。此外，单个单元格可以配置为跨列。\n\n考虑图 64-1 所示的用户界面布局：\n\n![](img/as_4.1_room_demo_ui.jpg)\n\
  \n图 64-1\n\n从布局的外观来看，很难识别出设计界面的 `TableLayout` 结构。然而，图 64-2 所示的层级树使得结构变得稍微容易理解：\n\
  \n![](img/as3.2_tablelayout_tree.jpg)\n\n图 64-2\n\n显然，该布局由一个父级 `LinearLayout` 视图带有\
  \ `TableLayout`、`LinearLayout` 和 `RecyclerView` 子项。`TableLayout` 包含三个 `TableRow`\
  \ 子项，代表表格中的三行。`TableRow` 包含两个子视图，每个子视图代表表格列单元格的内容。`LinearLayout` 子视图包含三个 `Button`\
  \ 子项。\n\n图 64-2 所示的布局是下一章将完成的数据库示例所需的确切布局。因此，本章的其余部分将用于使用 Android Studio 布局编辑器工具逐步完成此用户界面的设计。\n\
  \n## 64.2 创建 Room 数据库项目\n\n从欢迎界面选择 `New Project`（新建项目）菜单选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Fragment + ViewModel` 模板。\n\n在 `Name` 字段输入 `RoomDemo` 并指定 `com.ebookfrenzy.roomdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n## 64.3 转换为 LinearLayout\n\n在 Project\
  \ 工具窗口（app -> res -> layout）中找到 `fragment_main.xml` 文件并双击它将其加载到布局编辑器工具中。默认情况下，Android\
  \ Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要转换为垂直方向的 `LinearLayout`。在设计模式下的布局编辑器工具中，在组件树（Component\
  \ tree）中找到主 `ConstraintLayout` 组件，右键点击它显示图 64-3 所示的菜单，并选择 `Convert view...`（转换视图...）选项：\n\
  \n![](img/as_4.1_room_demo_convert_view.jpg)\n\n图 64-3\n\n在结果结果对话框（图 64-4）中，点击 `Apply`（应用）按钮之前，选择转换为\
  \ `LinearLayout` 的选项：\n\n![](img/as_4.1_room_demo_convert_linear.jpg)\n\n图 64-4\n\
  \n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平的 `LinearLayout`，因此在组件树窗口中选择布局组件，参考 `Attributes`（属性）工具窗口并将\
  \ `orientation`（方向）属性改为 `vertical`（垂直）：\n\n![](img/as_3.4_linearlayout_change_orientation.jpg)\n\
  \n图 64-5\n\n转换完成后，选择并删除默认的 `TextView`。\n\n## 64.4 向用户界面添加 TableLayout\n\n留在 `fragment_main.xml`\
  \ 文件中并在调色板（Palette）的 `Layouts` 类别中拖入 `TableLayout` 视图使其位于 `LinearLayout` 顶部。\n\n\
  一旦完成这些初始步骤，布局的组件树应类似于图 64-6 所示。\n\n![](img/as3.2_tablelayout_in_tree.jpg)\n\n图 64-6\n\
  \n显然，Android Studio 自动为 `TableLayout` 添加了四个 `TableRow` 实例。由于示例只需要三行，请选择并删除第四个 `TableRow`\
  \ 实例。可以随时通过从调色板将 `TableRow` 对象到 `TableLayout` 条目中添加额外的行。\n\n选中 `TableLayout`，使用\
  \ `Attributes` 工具窗口将 `layout_height` 属性更改为 `wrap_content`并将 `layout_width` 更改为 `match_parent`。\n\
  \n## 64.5 配置 TableRows\n\n从调色板 `Text` 部分将两个 `TextView` 对象拖放到组件树中最顶部的 `TableRow`\
  \ 条目中（图 64-7）：\n\n![](img/as3.2_tablerow_textviews.jpg)\n\n图 64-7\n\n选择屏幕布局内左侧的\
  \ `TextView`，并在 `Attributes` 工具窗口中将 `text` 属性更改为“Product ID”。对右侧的 `TextView` 重复此步骤，这次将文本改为“Not\
  \ assigned”并指定 ID 值 `productID`。\n\n将另一个 `TextView` 组件拖放到组件树中的第二个 `TableRow` 条目中，并将视图上的文本改为“Product\
  \ Name”。在调色板中找到 `Plain Text` 对象并将其拖入使其位于组件树中 `Product Name` `TextView` 的下方，如图 64-8\
  \ 所示。选中 `EditText` 对象，将 `inputType` 属性从 `textPersonName` 改为 `none`，删除 `text` 属性中的“Name”字符串并将\
  \ ID 设置为 `productName`。\n\n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n\n\
  图 64-8\n\n将另一个 `TextView` 和一个 `Number (Decimal) Text Field` 拖放到第三个 `TableRow` 中，使\
  \ `TextView` 在层级结构中位于 `EditText` 上。将 `TextView` 上的文本更改为“Product Quantity”，并将 `EditText`\
  \ 对象的 ID 更改为 `productQuantity`。\n\n\n\n\n\n按住 Shift 并点击以选择下方 图 64-9 所示布局中的所有控件，并使用属性（Attributes）工具窗口将所有对象的\
  \ `textSize` 属性设置为 `18sp`：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\n图\
  \ 64-9\n\n在继续之前，请确保将上述步骤中添加的所有文本属性提取到字符串资源中。\n\n## 64.6 向布局中添加按钮栏\n\n下一步向父级 `LinearLayout`\
  \ 视图添加一个 `LinearLayout (Horizontal)` 视图，其位置紧邻 `TableLayout` 视图下方。首先点击组件树（Component\
  \ Tree）中 `TableLayout` 条目左侧的小展开收起箭头，使 `TableRows` 折叠隐藏。从布局编辑器面板（Layout Editor palette）面板的布局（Layouts）部分拖入一个\
  \ `LinearLayout (horizontal)` 实例，将其放置在组件树面板中 `TableLayout` 条目的正下方，并将 `layout_height`\
  \ 属性更改为 `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.jpg)\n\n图\
  \ 64-10\n\n将三个 `Button` 对象拖放到新的 `LinearLayout` 上，并为每个按钮分配分别读取为“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应显示为无边框样式（borderless）。对于每个按钮，使用属性工具窗口将样式设置为\
  \ `Widget.AppCompat.Button.Borderless`，并将 `textColor` 属性设置为 `@color/black`。将按钮的\
  \ ID 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\n![](img/as_3.4_change_button_style.jpg)\n\
  \n图 64-11\n\n在组件树中选中新的水平 `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域内水平居中。\n\
  \n## 64.7 添加 RecyclerView\n\n在组件树中，点击新添加的水平 `LinearLayout` 条目右侧的展开箭头，折叠所有子项。\n\n\
  从调面板（Palette）的容器（Containers）部分拖入一个 `RecyclerView` 实例并将其释放到组件树上，如 图 64-12 所示，位于按钮栏\
  \ `LinearLayout` 下方。确保 `RecyclerView` 是作为父级垂直 `LinearLayout` 视图的直接元素添加，而不是水平按钮栏\
  \ `LinearLayout` 的元素。\n\n![](img/as_3.6_tablelayout_recyclerview.jpg)\n\n图 64-12\n\
  \n在布局中选中 `RecyclerView`，将视图的 ID 更改为 `product_recycler`并将 `layout_height` 属性设置为 `match_parent`。在继续之前，检查组件树面板中的布局层级结构是否与下图所示：\n\
  \n![](img/as_4.1_room_demo_table_tree.jpg)\n\n图 64-13\n\n## 64.8 调整布局边距\n\n剩下的只需调整一些布局设置。首先点击组件树面板中的第一个\
  \ `TableRow` 条目以选中它。按住键盘上的 `Cmd/Ctrl` 键，点击第二个和第三个 `TableRows`、水平 `LinearLayout`\
  \ 以及 `RecyclerView`，以便选中所有五个项目。在属性面板中，找到 `layout_margin` 属性类别，一旦找到，将其值更改为 图 64-14\
  \ 所示的 `10dp`：\n\n![](img/as_3.4_layout_margin.jpg)\n\n图 64-14\n\n设置好边距后，用户界面应如 图\
  \ 64 所示。\n\n## 64.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种以行列配置排列视图的方法。虽然 `TableLayout`\
  \ 视图提供了整体容器，但每一行及其中的单元格是通过 `TableRow` 视图实例实现的。在本章中，在 Android Studio 中使用 `TableLayout`\
  \ 和 `TableRow` 容器设计了一个用户界面。下一章将为此用户界面添加功能，使用存储库（repository）和 Room 库实现 SQLite 数据库。\n\
  \n# 65. Room 数据库与存储库教程\n\n本章将“Android 持久化库”（#Room_Overview.xhtml__idTextAnchor2）章节中学知识与上一章创建的初始项目相结合，提供关于如何使用\
  \ Room 库实现 SQLite 存储的详细教程。遵循 Android 架构指南，项目将使用视图模型（view model）和存储库（repository）。该教程将利用“Android\
  \ 持久化库”（#Room_Overview.xhtml__idTextAnchor2）中涵盖的所有内容，包括实体（entities）、数据访问对象（Data\
  \ Access Object）、Room 数据库以及异步数据库查询。\n\n## 65.1 关于 RoomDemo 项目\n\n上一章创建的用户界面布局是创建一个用于存储产品名称和数量的简单应用的第一步。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示数据库中当前存储的所有产品的可滚动列表。此产品列表将随着数据库条目的添加或删除而更新。\n\
  \n## 65.2 修改构建配置\n\n首先启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加一些额外的库，包括\
  \ Room 库。现在是时候在 `build.gradle` 文件中启用视图绑定。定位并编辑模块级 `build.gradle`（`app -> Gradle\
  \ Scripts -> build.gradle (Module: RoomDemo)`）并进行如下修改：\n\n```gradle\nandroid {\n\
  \    buildFeatures {\n        viewBinding true\n    }\n}\n\ndependencies {\n   \
  \ implementation \"androidx.recyclerview:1.2.1\"\n    implementation \"androidx.room:room-runtime:2.4.3\"\
  \n    implementation \"androidx.fragment:fragment-ktx:1.5.3\"\n    annotationProcessor\
  \ \"androidx.room:room-compiler:2.4.3\"\n}\n```\n\n## 65.3 构建实体\n\n该项目将从创建定义数据库表的实体开始。实体将包含一个用于产品\
  \ ID 的整数、一个存储产品名称的字符串。产品 ID 将作为主键并自动生成。表 65-1 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :---\
  \ | :--- |\n| productid | Integer / 主键 / 自动增长 |\n| productname | String |\n| productquantity\
  \ | Integer |\n\n表 65-1\n\n通过右键点击项目窗口中的 `app -> java -> com.ebookrenzy.roomdemo`\
  \ 条目并选择 `New -> Java Class` 菜单选项为实体添加类文件。在新类对话框中，将类命名为 `Product`，选择列表中的 `Class`\
  \ 条目并按回键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改如下所示：\n\n```java\npackage com.ebookrenzy.roomdemo;\n\
  \npublic class Product {\n    private int id;\n    private String name;\n    private\
  \ int quantity;\n\n    public Product(String name, int quantity) {\n        this.name\
  \ = name;\n        this.quantity = quantity;\n    }\n\n    public int getId() {\n\
  \        return this.id;\n    }\n\n    public String getName() {\n        return\
  \ this.name;\n    }\n\n    public int getQuantity() {\n        return this.quantity;\n\
  \    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setQuantity(int quantity) {\n        this.quantity = quantity;\n    }\n}\n```\n\
  \n\n\n\n该类现在包含了对应数据库表列的变量以及相应的 getter 和 setter 方法。当然，在该类添加注解之前，它不会成为一个实体（entity）。在编辑器中保持该类文件打开，添加注解和相应的导入语句：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n}\n\
  ```\n\n这些注解声明该类为名为 `products` 的表的实体，并为 `id` 和 `name` 变量分配了列名。`id` 列被配置为主键并自动生成。由于主键永远不能为空，因此也应用了\
  \ `@NonNull` 注解。因为在 SQL 查询中不需要引用 `quantity` 列，所以没有为 `quantity` 变量分配列名。\n\n## 65.4\
  \ 创建数据访问对象\n\n定义好产品实体后，下一步是创建 DAO 接口。再次引用 Project 工具窗口，右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项，并选择 `New` -> `Java Class` 菜单选项。在新类对话框中，在 `Name` 字段中输入 `ProductDao`，并从列表中（如图\
  \ 65-1 所示）选择 `Interface`：\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n\n图 65-1\n\
  \n点击 OK 生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\nimport androidx.room.Insert;\n\
  import androidx.room.Query;\nimport java.util.List;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n   \
  \ void deleteProduct(String name);\n\n    @Query(\"SELECT * FROM products\")\n \
  \   LiveData<List<Product>> getAllProducts();\n}\n```\n\nDAO 实现了从 `products` 数据库中插入、查找和删除记录的方法。插入方法接收一个包含要存储数据的\
  \ `Product` 实体对象，而查找和删除记录的方法接收一个包含操作产品名称的字符串。`getAllProducts()` 方法返回一个包含数据库中所有记录的\
  \ `LiveData` 对象。此方法将用于保持用户界面布局中 `RecyclerView` 产品列表与数据库的同步。\n\n## 65.5 添加 Room 数据库\n\
  \n在将仓库（repository）添加到项目之前，最后一个任务是实现 Room 数据库实例。向项目添加一个名为 `ProductRoomDatabase` 的新类，这次选择\
  \ `Class` 选项。\n\n文件生成后，按照按照“Android Room 持久库”章节中概述的步骤对其进行修改：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\nimport androidx.room.Database;\n\
  import androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\n@Database(entities\
  \ = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase extends\
  \ RoomDatabase {\n    public abstract ProductDao productDao();\n\n    private static\
  \ ProductRoomDatabase INSTANCE;\n\n    static ProductRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (ProductRoomDatabase.class) {\n                INSTANCE =\n                  \
  \  Room.databaseBuilder(context.getApplicationContext(),\n                     \
  \       ProductRoomDatabase.class,\n                            ).build();\n   \
  \         }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n## 65.6 添加仓库\n\
  \n向项目添加一个名为 `ProductRepository` 的新类，选择 `Class` 选项。仓库类负责代表 `ViewModel` 与 Room 数据库进行交互，并需要提供插入、删除和查询的方法。除了\
  \ `getAllProducts()` 方法（返回 `LiveData` 对象）外，这些操作都需要需要在单独线程上执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加用于返回结果的处理器：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.os.Handler;\n\
  import android.os.Looper;\nimport android.os.Message;\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \    private Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\n\
  \        public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n\n```\n\n上述代码声明了一个 `MutableLiveData` 变量 `searchResults`，当任务完成时会将结果存储其中。`ViewModel`\
  \ 将监控此数据数据。\n\n仓库类现在需要提供供 `ViewModel` 调用以启动这些操作的方法。然而，这需要通过 `ProductRoomDatabase`\
  \ 实例获取 DAO 引用。为 `ProductRepository` 类添加构造函数以执行这些任务：\n\n```java\nimport android.app.Application;\n\
  \npublic class ProductRepository {\n    // ... (上述字段)\n    private final ProductDao\
  \ productDao;\n\n    public ProductRepository(Application application) {\n     \
  \   ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n存储 DAO 引用后，可以按照以下方法添加到\
  \ `ProductRepository` 类中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmptyMessage(0);\n    });\n    executor.shutdown();\n}\n```\n\
  \n在插入和删除方法的情况下，创建并使用了相应的新的线程来执行相应的数据库操作。在 `findProduct()` 方法的情况下，向处理器发送一条消息，表示新结果可用。\n\
  \n\n\n\n还剩最后一个任务来完成仓库类（Repository）。用户界面布局中的 `RecyclerView` 需要能够同步数据库存储的当前产品列表。`ProductDao`\
  \ 类已包含一个名为 `getAllProducts()` 的方法，它使用 SQL 查询来选择数据库中的所有记录并将其封装在 `LiveData` 对象中返回。仓库需要在初始化时调用此方法，并将结果存储在一个\
  \ `LiveData` 对象中，该对象可以被 `ViewModel` 观察，进而被 UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器的观察者都会收到通知，`RecyclerView`\
  \ 就可以更新为最新的产品列表。在 `ProductRepository.java` 文件中，在构造函数内添加 `LiveData` 变量并调用 DAO 的 `getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults =\n        \
  \    new MutableLiveData<>();\n\n    private List<Product> results;\n    private\
  \ final LiveData<List<Product>> allProducts;\n    private final ProductDao productDao;\n\
  \n    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n        allProducts = productDao.getAllProducts();\n    }\n\
  }\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用的方法以获取 `allProducts` 和 `searchResults` 活数据对象的引用：\n\
  \n```java\npublic LiveData<List<Product>> getAllProducts() {\n    return allProducts;\n\
  }\n\npublic MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n## 65.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供 UI 控制器可以使用的方法和 `LiveData`\
  \ 对象，以保持用户界面与底层数据库的同步。正如在 `ProductRepository.java` 中实现的那样，仓库构造函数需要访问应用上下文以便获取 Room\
  \ 实例。为了让应用上下文在 `ViewModel` 中可访问并传递给仓库，`ViewModel` 需要派自 `AndroidViewModel` 而不是 `ViewModel`。因此，首先开始编辑\
  \ `MainViewModel.java` 文件（位于 Project 窗口的 `app -> java -> com.ebookfrenzy.roomdemo\
  \ -> ui.main` 下），并将类更改为扩展 `AndroidViewModel` 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.app.Application;\nimport androidx.lifecycle.AndroidViewModel;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.lifecycle.MutableLiveData;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.ProductRepository;\n\
  import java.util.List;\nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel\
  \ extends AndroidViewModel {\n    final private ProductRepository repository;\n\
  \    final private LiveData<List<Product>> allProducts;\n    final private MutableLiveData<List<Product>>\
  \ searchResults;\n\n    public MainViewModel (Application application) {\n     \
  \   super(application);\n        repository = new ProductRepository(application);\n\
  \        allProducts = repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数本质上创建了一个仓库实例，然后使用它来获取结果和活数据对象的引用，以便它们被 UI 控制器观察。现在 `ViewModel`\
  \ 中剩下的工作是实现 UI 控制器内部调用以响应按钮点击以及在设置 `LiveData` 对象观察者时调的方法：\n\n```java\nMutableLiveData<List<Product>>\
  \ getSearchResults() {\n    return searchResults;\n}\n\nLiveData<List<Product>>\
  \ getAllProducts() {\n    return allProducts;\n}\n\npublic void insertProduct(Product\
  \ product) {\n    repository.insertProduct(product);\n}\n\npublic void findProduct(String\
  \ name) {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String\
  \ name) {\n    repository.deleteProduct(name);\n}\n```\n\n## 65.8 创建产品项布局\n\n数据库中每个产品的名称将出现在主用户界面的\
  \ `RecyclerView` 列表中。这需要一个布局资源文件，其中包含一个用于列表每行的 `TextView`。现在，通过在右键点击 Project 窗口中的\
  \ `app -> res -> layout` 项并选择 `New -> Layout Resource File` 菜单选项来添加此文件。将文件命名为 `product_list_item`并将根节点更改为\
  \ `LinearLayout`。\n\n正如“使用 RecyclerView”章节所述，`RecyclerView` 实例需要一个适配器（adapter）来提供显示的数据。通过右键点击\
  \ `app -> java -> com.ebookfrenzy.roomdemo -> ui.main` 项并选择 `New -> Java Class`\
  \ 来添加此类。在对话框中，将类命名为 `ListAdapter` 并从列表中选择 `Class`。在编辑器中加载 `ListAdapter.java` 类后，按如下实现该类：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.TextView;\n\
  import com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ListAdapter extends RecyclerView.Adapter<ListAdapter.ViewHolder>\
  \ {\n    private final int layoutId;\n    private List<Product> productList;\n\n\
  \    public ListAdapter(int layoutId) {\n        gridLayout = layoutId;\n    }\n\
  \n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(parent.getContext()).inflate(gridLayout,\
  \ parent, false);\n        return new ViewHolder(view);\n    }\n\n    @Override\n\
  \    public void onBindViewHolder(final ViewHolder holder, final int listPosition)\
  \ {\n        TextView item = holder.item;\n        item.setText(productList.get(listPosition).getName());\n\
  \    }\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n      \
  \  TextView item;\n        ViewHolder(View itemView) {\n            super(itemView);\n\
  \            item = itemView.findViewById(R.id.product_row);\n        }\n    }\n\
  }\n```\n\n## 65.10 准备主 Fragment\n\n\n\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要为 `Button`\
  \ 视图配置监听器，并为位于 `ViewModel` 类中的 live data 对象配置观察者。在添加这些代码之前，需要进行一些准备工作，例如添加一些导入语句、变量并获取视图\
  \ ID 的引用。我们还需要修改 fragment 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\
  \n.\n\n.\n\n```java\nimport com.ebookfrenzy.roomdemo.databinding.FragmentMainBinding;\n\
  \n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private FragmentMainBinding binding;\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater,\n                                 @Nullable ViewGroup container,\n \
  \                                @Nullable Bundle savedInstanceState) {\n      \
  \  return inflater.inflate(R.layout.fragment_main, container, false);\n        binding\
  \ = FragmentMainBinding.inflate(inflater, container, false);\n        return binding.getRoot();\n\
  \    }\n\n    @Override\n    public void onDestroyView() {\n        super.onDestroyView();\n\
  \        binding = null;\n    }\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        listenerSetup();\n\
  \        observerSetup();\n        recyclerSetup();\n    }\n.\n\n.\n}\n```\n\n在代码的各个阶段，应用需要清除用户界面上显示的产品信息。为了避免代码重复，请添加以下方便函数\
  \ `clearFields()`：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在应用可以编译和测试之前，需要将上述从 `onViewCreated()` 方法调用的三个设置方法添加到类中。\n\n### 65.11\
  \ 添加按钮监听器\n\n主 fragment 的用户界面布局包含三个按钮，每个按钮在用户点击时都需要执行特定的特定的任务。编辑 `MainFragment.java`\
  \ 文件并添加 `listenerSetup()` 方法：\n\n```java\n.\n\n.\n\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \n.\n\n.\n\n    private void listenerSetup() {\n        binding.addButton.setOnClickListener(view\
  \ -> {\n            String name = binding.productName.getText().toString();\n  \
  \          String quantity = binding.productQuantity.getText().toString();\n   \
  \         if (!name.equals(\"\") && !quantity.equals(\"\")) {\n                Product\
  \ product = new Product(name,\n                        Integer.parseInt(quantity));\n\
  \                mViewModel.insertProduct(product);\n                clearFields();\n\
  \            } else {\n                binding.productID.setText(\"Incomplete information\"\
  );\n            }\n        });\n        binding.findButton.setOnClickListener(view\
  \ ->\n            mViewModel.findProduct(binding.productName.getText().toString()\n\
  \            )\n        );\n        binding.deleteButton.setOnClickListener(view\
  \ -> {\n            mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \            clearFields();\n        });\n    }\n.\n\n.\n```\n\n`addButton` 监听器执行了一些验证，以确保用户同时输入了名称和数量，并使用这些数据创建一个\
  \ `Product` 对象（注意数量已转换为整数）。随后在清除字段之前，会调用 `mViewModel.insertProduct()` 方法传入该对象。`findButton`\
  \ 和 `deleteButton` 监听器将名称传递给 `mViewModel.findProduct()` 或 `mViewModel.deleteProduct()`。\n\
  \n### 65.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以与 `ViewModel`内部的 `searchResults` 和\
  \ `allProducts` 数据保持同步。在 `MainFragment.java` 中，实现 `observerSetup()` 方法：\n\n```java\n\
  .\n\nimport androidx.lifecycle.Observer;\n\n.\n\nimport java.util.Locale;\n\n.\n\
  \n    private void observerSetup() {\n        mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\
  \ products -> {\n            adapter.setList(products);\n        });\n        mViewModel.getSearchResults().observe(getViewLifecycleOwner(),\
  \ products -> {\n            if (products.size() > 0) {\n                binding.productID.setText(String.format(Locale.US,\
  \ products.get(0).getId()));\n                binding.productName.setText(products.get(0).getName());\n\
  \                binding.productQuantity.setText(String.format(Locale.US, \"%d\"\
  , products.get(0).getQuantity()));\n            } else {\n                binding.productID.setText(\"\
  No Match\");\n            }\n        });\n    }\n```\n\n`allProducts` 观察者仅将当前列表传递给\
  \ `adapter.setList()`。`searchResults` 观察者检查数据库中是否至少找到一个结果，提取第一个 `Product` 对象并将其赋值给\
  \ EditText 视图。\n\n### 65.13 初始化 RecyclerView\n\n添加如下最后的设置方法以初始化 RecyclerView 和适配器：\n\
  \n```java\n.\n\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\n.\n\n\
  .\n\n    private void recyclerSetup() {\n        adapter = new ProductListAdapter(R.layout.product_item);\n\
  \        binding.productRecycler.setLayoutManager(new LinearLayoutManager(getContext()));\n\
  \        binding.productRecycler.setAdapter(adapter);\n    }\n```\n\n### 65.14 测试\
  \ Room 应用\n\n在设备或模拟器上编译并运行应用，添加一些产品，并确保它们自动出现在 RecyclerView 中。对现有产品进行搜索，并验证产品 ID\
  \ 和数量字段相应更新。最后，输入一个现有产品的名称，从数据库中删除它，并确认它已从 RecyclerView 产品列表中移除。\n\n### 65.15 使用数据库检查器\
  \ (Database Inspector)\n\n正如在“Android 持久库”中所述，可以使用数据库检查器工具检查与运行应用相关的 Room 数据库内容，并进行细微的数据更改。在使用\
  \ RoomDemo App 添加一些数据库记录后，使用 View -> Tool Windows -> App Inspection 菜单显示数据库检查器工具：\n\
  \n在检查器窗口中，从图 65-3 所示的标记 A 中选择运行的应用：\n\n![](img/database_inspector.jpg)\n\n图 65-3\n\
  \n在数据库面板 (B) 中双击 `products` 表，查看当前存储在数据库中的表行。启用实时更新 (C) 选项，然后使用运行的应用向数据库添加更多记录。注意数据库检查器会实时更新表数据\
  \ (D) 以反映更改。\n\n关闭实时更新以使表格不再是只读的，双击表行中的数量单元格，并在按下键盘 Enter 键之前更改该值。返回到运行的应用并搜索该产品，以确认在检查器中对数量的更改已保存到数据库表中。\n\
  \n\n\n\n最后，点击表格查询按钮（如下方图 65-4 中的箭头所示）显示一个新的查询标签页 (A)，确保已选择 `product_database` (B)，并在查询文本框中输入\
  \ SQL 语句 (C) 并点击 `Run` 按钮 (D) ：\n\n![](img/as_database_inspector_query.jpg)\n\n\
  图 65-4\n\n行列表应该会更新，以反映 SQL 查询的结果 (E)。\n\n## 65.16 总结\n\n本章演示了如何使用 Room 持久化库在 SQLite\
  \ 数据库中存储数据。完成的项目使用了仓库（repository）模式将 `ViewModel` 与所有数据库操作分离，并演示了实体（entities）、`DAO`\
  \ 以及 Room 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\n# 66. 使用 Android 存储访问框架访问云存储\n\n多年来，远程存储服务（又称为“云存储”）在存储用户文件和数据方面已被广泛采用。驱动这一增长有两个关键因素。首先，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又便宜。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备在内部存储资源方面受到限制。例如，今天高规格的\
  \ Android 平板通常具有 128Gb 的存储容量。与带有 750Gb 硬盘驱动器的中端笔记本系统相比，对文件的无缝远程存储已成为今天许多移动应用程序的关键需求。\n\
  \n由于这一事实，Google 在 Android 4.4 SDK 的中引入了存储访问框架（Storage Access Framework）。本章将提供存储访问框架的高级概述，为下一章节中更注重细节的教程做准备，该章节的标题为“Android\
  \ 存储访问框架示例”。\n\n## 66.1 存储访问框架\n\n从用户的角度来看，存储访问框架提供了一个直观的用户界面，允许用户在 Android 应用程序内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过此浏览界面（也称为选择器\
  \ picker），用户可以浏览其所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图 66-1 显示了选择器界面显示由文档提供者服务托管的文件集：\n\
  \n![](img/as3.0_storage_demo_picker.jpg)\n\n图 66-1\n\n文档提供者可以从云服务到与客户端应用程序运行在同一设备上的本地文档提供者不等。在编写时，与存储访问框架兼容的最著名文档提供者是\
  \ Box 以及意料之中的 Google Drive。其他云存储提供者和应用程序开发者很快也会提供符合 Android 存储访问框架的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供了文件存储选项。\n\
  \n通过一组 `Intents`，Android 应用程序开发者只需几行代码将这些存储功能集成到应用程序中。从开发者角度来看，存储访问框架的一个特别吸引人的方面是，用户选择的底层文档提供者对应用程序完全透明的。一旦在应用程序中使用框架实现了存储功能，它将能够在不修改任何代码的情况下与所有文档提供者配合。\n\
  \n## 66.2 使用存储访问框架\n\nAndroid 包含一组设计用于将存储访问框架的功能集成到 Android 应用程序中的 `Intents`。这些意图向用户显示存储访问框架选择器界面，并通过调用启动意图的\
  \ activity 的 `onActivityResult()` 方法将交互结果返回应用程序。当 `onActivityResult()` 方法被调用时，它将接收所选文件的\
  \ `Uri` 以及一个指示操作成功或与否的值。\n\n存储访问框架的意图可以总结如下：\n\n*   `ACTION_OPEN_DOCUMENT` – 为用户提供访问选择器界面的权限，以便从设备上配置的文档提供者选择文件。所选的文件以\
  \ `Uri` 对象的格式传回应用程序。\n*   `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供者存储器上的位置以及新文件的文件名。一旦选择完成，将由存储访问框架创建该文件，并将该文件的\
  \ `Uri` 返回给应用程序进行进一步处理。\n\n## 66.3 过滤选择器文件列表\n\n当启动意图时，选择器界面中列出的文件可以使用各种选项进行过滤。例如，考虑以下用于配置\
  \ `ACTION_OPEN_DOCUMENT` 意图的代：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动后，上述意图将显示选择器界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了文件，应用程序将以 `Uri` 对象的格式获得该文件的引用。应用程序随后可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某些风险，并不是所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改意图来实现选择器中排除此类文件。例如：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.CATEGORY_OPENABLE;\n```\n\n现在显示意图时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出来，但用户无法选择。\n\
  \n另一种有效的过滤方法是按文件类型限制可选的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者选择图像文件的选项。这是通过为\
  \ `intent` 对象配置供用户选择文件的 MIME 类型来实现的。例如，以下代码指定了选择器中仅适用于图像文件：\n\n```\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步细化以限制选择 JPEG 图像：\n\n```\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器可能只能处理音频文件：\n\n```\nintent.setType(\"audio/*\");\n\
  ```\n\n音频应用可能被进一步限制为仅支持播放 MP4 格式的音频：\n\n```\nintent.setType(\"audio/mp4\");\n```\n\
  \n在处理存储访问框架时，可以使用广泛的 MIME 类型设置，更常见的可以在网上找到：\n\nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 66.4 处理意图结果\n\n由于我们启动了会返回结果的意图，需要使用 `registerForActivityResult()` 方法（在标题为“Android\
  \ 显式意图——工作示例”](#Explicit_Intents.xhtml__idTextAnchor1058) 的章节中介绍）创建一个启动器并声明处理返回数据的\
  \ Lambda 表达式，例如：\n\n```\nActivityResultLauncher<Intent> startOpenForResult = registerForActivityResult(\n\
  ```\n\n\n\n\n\n```java\nnew ActivityResultContracts.StartActivityForResult(),\n\n\
  new ActivityResultCallback<ActivityResult>() {\n    @Override\n    public void onActivityResult(ActivityResult\
  \ result) {\n        if (result.getResultCode() == Activity.RESULT_OK) {\n     \
  \       Intent data = result.getData();\n            // Read file content from Uri\
  \ here\n        }\n    }\n});\n```\n\n一旦声明，即可按照如下方式配置并启动 `intent`：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 66.5\
  \ 读取文件内容\n\n读取由文档提供者托管的文件内容，所需的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤就与读取图像或音频文件的步骤不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以 `“r”` 模式打开的。这表示文件是为了读取而打开。其他选项包括用于写访问的\
  \ `“w”` 以及用于读写的 `“rwt”，其中文件中的现有内容将被新内容截断。\n\n读取文本文件的内容需要稍多的工作，并需要使用 `InputStream`\
  \ 对象。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行某些操作\n\
  }\ninputStream.close();\n```\n\n## 66.6 向文件写入内容\n\n向由文档提供者托管的打开文件写入内容与读取类似，区别在于使用的是输出流而不是输入流。例如，以下代码向由指定\
  \ `Uri` 用的存储基础文件的输出流中写入文本：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = this.getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件的写权限。随后使用该文件描述符获取文件输出流的引用。在关闭文件描述符和输出流之前，将内容（在本例中为某些文本）写入输出流。\n\
  \n## 66.7 删除文件\n\n是否可以从存储中删除文件取决于文档提供者是否支持删除。假设允许删除，可以执行如下操作：\n\n```java\nif (DocumentsContract.delete(getContentResolver(),\
  \ uri)) {\n    // 删除成功\n} else {\n    // 删除失败\n}\n```\n\n## 66.8 获取文件的持久访问权限\n\n\
  当应用程序通过存储访问框架（Storage Access Framework）获取文件访问时，该权限将一直有效直到设备重启。例如，以下代码为 `Uri` “获取”必要的权限：\n\
  \n```java\nint takeFlags = intent.getFlags();\ngetContentResolver().takePersistableUriPermissions(uri,\
  \ takeFlags & Intent.FLAG_GRANT_READ_PERMISSION | Intent.FLAG_GRANT_WRITE_PERMISSION);\n\
  ```\n\n如果在任何时候不再需要持久化权限，可以通过调用来释放它们：\n\n```java\nint releaseFlags = intent.getFlags();\n\
  getContentResolver().releasePersistableUriPermissions(uri, releaseFlags & Intent.FLAG_GRANT_READ_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\n```\n\n## 66.9 总结\n\n考虑近年来人们对“存储”的感知发生的变化很有趣。“存储”一词曾是大容量内部硬盘驱动器的同义词，现在它同样可能指代远程托管在云端并通过互联网连接访问的存储空间。对于资源受限、“始终连接”的且存储容量极微的移动设备来说，这种情况日益普遍。\n\
  \nAndroid 存储访问框架提供了一个简单的机制，让用户和应用程序开发者都能无缝访问存储在云端的文件。通过使用一组 `intent` 以及用于选择文档提供者和文件的内置用户界面，现在可以用极少的代码将全面的云端存储集成到\
  \ Android 应用程序中。\n\n# 67. 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云端存储集成到 Android 应用程序的过程。该框架由一个选择器用户界面和一组新的\
  \ `intent` 组成，访问 Google Drive 和 Box 等文档提供者存储的文件现在可以相对容易地构建到 Android 应用中。\n\n## 67.1\
  \ 关于存储访问框架示例\n\n在本章创建的 Android 应用程序将采用原始文本编辑器的形式，旨在将文本文件远程创建并存储到云端存储服务中。在实践中，该示例适用于任何兼容存储访问框架的云存储提供者，尽管本示例假设使用\
  \ Google Drive。\n\n从功能角度来看，该应用程序将向用户提供一个多行文本视图，用户可以在其中输入和编辑文本，并带有一允许创建、打开和保存存储基础文本文件的按钮。\n\
  \n## 67.2 创建存储访问框架示例\n\n\n\n\n用户界面将包含三个 `Button` 视图和一个 `EditText` 视图。在 `Project`\
  \ 工具窗口中，导航到位于 `app` -> `res` -> `layout` 的 `activity_main.xml` 布局文件，并双击它将其加载到 `Layout\
  \ Editor` 工具中。在工具的 `Design` 模式下，选择并删除 `Hello World!` `TextView` 对象。\n\n在布局的左上角拖动并放置一个\
  \ `Button` 控件，以便在释放控件到指定位置之前出现左侧和顶部的虚线边距引导线。放置第二个 `Button`，使其中心和顶部的边距引导线出现。放置第三个\
  \ `Button` 控件，使其出现顶部和右侧的边距引导线。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个 `Plain\
  \ Text` 控件，使其水平居中并位于中间的 `Button` 下方，以便用户界面布局与图 67-1 所示所示匹配。使用 `Layout Editor` 工具栏中的\
  \ `Infer Constraints` 按钮添加任何缺失的约束。\n\n在布局中选择 `Plain Text` 控件，删除当前的文本属性设置使该字段初始为空白，并将\
  \ `ID` 设置为 `fileText`，记住将所有字符串属性提取为资源值：\n\n![](img/as_4.1_storage_demo_ui.jpg)\n\
  \n图 67-1\n\n使用 `Attributes` 工具窗口配置 `Button` 控件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 的方法。\n\n## 67.4 添加 Activity 启动器\n\n按照名为 Android Explicit Intents\
  \ – 一个示例”章节概述的步骤，我们需要开始注册 activity 启动器以处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，如下所示为三个操作中的每个添加一个启动器：\n\
  \n```java\n.\n.\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\n.\n.\n\n    ActivityResultLauncher<Intent> startOpenForResult\
  \ =\n        registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        });\n\n    ActivityResultLauncher<Intent> startSaveForResult =\n\
  \        registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        result -> {\n            if (result.getResultCode() == Activity.RESULT_OK)\
  \ {\n                Intent data = result.getData();\n                if (data !=\
  \ null) {\n                    Uri currentUri = data.getData();\n              \
  \      try {\n                        writeFileContent(currentUri);\n          \
  \          } catch (IOException e) {\n                        // Handle error\n\
  \                    }\n                }\n            }\n        });\n\n    ActivityResultLauncher<Intent>\
  \ startCreateForResult =\n        registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle error\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        });\n```\n\n## 67.5 创建新文件\n\n此代码创建了一个新的 `ACTION_DOCUMENT` `Intent`\
  \ 对象。然后配置该意，使其仅返回可以使用文件描述符打开的文件（通过 `Intent.CATEGORY_OPENABLE`）。接下来，代码指定要打开的文件具有纯文本\
  \ MIME 类型，并提供了一个占位文件名（用户可以在选择器界面中更改该文件名）。\n\n在 `MainActivity.java` 文件中，如下实现此方法：\n\
  \n```java\npackage com.ebookrenzy.storagedemo;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n.\n.\n    public void newFile(View view) {\n        Intent\
  \ intent = new Intent(Intent.ACTION_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n.\n```\n\
  \n当 intent 完成分配的任务时，将调用 startCreateForResult lambda 表达式并传递新创建文档的 `Uri`。\n\n编译并运行应用程序，选择\
  \ New 按钮。Storage Access Framework 随后应显示如图 67-3 所示的下载界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\
  \n图 67-2\n\n点击上方显示的菜单按钮，选择 Drive 选项，然后选择 My Drive，并导航到 Google Drive 存储中合适的位置以保存文件。在选择器界面底部的文本框中，在选择\
  \ Save 之前，将名称从“newfile.txt”更改为合适的名称（但保留 .txt 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\
  \n图 67-3\n\n一旦创建新文件，应用程序应返回主 activity，通知面板可能会出现“1 file uploaded”的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 67-4\n\n此时，应该可以在浏览器窗口中登录您的 Google Drive 账户，并在请求的位置找到新创建的文件。如果文件丢失，请确保运行应用程序的\
  \ Android 设备已连接到互联网。也可以通过运行 Google Drive 应用来验证设备对 Google Drive 的访问，该应用在许多 Android\
  \ 设备上预装，并可从 Google Play 商店下载。\n\n\n\n现在应用程序已经能够创建基于存储的文件了，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面已配置为在用户选择“保存（Save）”按钮时调用\
  \ `saveFile()` 方法。该方法负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图（intent），这将显示文件选择器界面，使用户可以选择存储文本的文件。由于我们只处理纯文本文件，因此需要对意图进行配置，将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其添加到 `MainActivity.java`\
  \ 类文件中，如下：\n\n```java\npublic void saveFile(View view) \n{\n    Intent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent)\n}\n\
  ```\n\n赋值给 `startSaveForResult()` 的 lambda 表达式调用了一个名为 `writeFileContent()` 的方法，并传递了要写入文本文件的\
  \ `Uri`。在 `MainActivity.java` 文件中继续实现此方法，其读取方式如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n.\n.\n    private void writeFileContent(Uri\
  \ uri) throws IOException\n    {\n        try{\n            ParcelFileDescriptor\
  \ pfd =\n                    this.getContentResolver().\n                    openFileDescriptor(uri,\
  \ \"w\");\n            FileOutputStream fileOutputStream =\n                   \
  \ new FileOutputStream(\n                            pfd.getFileDescriptor());\n\
  \            String textContent =\n                    binding.fileText.getText().toString();\n\
  \            fileOutputStream.write(textContent.getBytes());\n            fileOutputStream.close();\n\
  \            pfd.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n.\n.\n}\n```\n\n该方法首先从用户选择的文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此以写入模式（`\"\
  w\"`）打开描述符。然后，使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑框对象中提取，并在文件描述符和流关闭之前写入输出流。代码还添加了处理文件写入过程中任何\
  \ IO 异常的代码。添加新方法后，编译并运行应用程序，在文本视图中输入一些文本并选择“保存（Save）”按钮。从选择器界面中，从 Google Drive 存储中找到之前创建的文件，并将文本保存到该文件中。返回浏览器窗口中的\
  \ Google Drive 并选择该文本文件以显示内容。现在，该文件应该包含了在 Android 设备上的 StorageDemo 中输入的文本。\n\n###\
  \ 7 打开和读取存储文件\n\n在编写了创建和保存文件的代码后，最后一个任务是添加从存储器中打开和读取文件的功能。这将涉及编写 `openFile()` `onClick`\
  \ 事件处理程序并实现它，使其启动 `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void openFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startOpenForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startOpenForResult()` lambda 调用的 `readFileContent()` 方法：\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n.\n.\nimport java.io.BufferedReader;\nimport\
  \ java.io.InputStream;\nimport java.io.InputStreamReader;\n.\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n    private String readFileContent(Uri uri)\
  \ throws IOException {\n        InputStream inputStream =\n                getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n                new BufferedReader(new InputStreamReader(inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n.\n.\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其以读取。然后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。读取文件中的每一行并存储在 `StringBuilder` 对象中。一旦读取完所有行，输入流和文件描述符都将关闭，文件内容以 `String`\
  \ 对象的形式返回。\n\n### 8 测试存储访问应用程序\n\n编码阶段完成后，应用程序现在已准备好完全测试。首先在配置了您的 Google 账户身份的 Android\
  \ 设备或 AVD 上启动应用程序，并选择“新建（New）”按钮。在生成的存储选择器界面中，选择一个 Google Drive 位置，并将文本文件命名为 `storagedemo.txt`，然后选择文件名右侧的保存（Save）选项。\n\
  \n当控制权返回到您的应用程序时，寻找文件上传通知，然后在在选择“保存（Save）”按钮之前向文本区域输入一些文本。从选择器中选择之前创建的 `storagedemo.txt`\
  \ 文件，将内容保存到该文件中。返回应用程序后，删除文本并选择“打开（Open）”按钮，再次选择 `storagedemo.txt` 文件。当控制权返回应用程序时，文本视图应该已经填充了文本文件的内容。\n\
  \n需要注意的是，如果 Android 设备缺少活跃的互联网连接，存储访问框架（Storage Access Framework）将在本地缓存存储文件。然而，一旦重新建立连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口中登录您的\
  \ Google Drive 账户，导航到 `storagedemo.txt` 文件，一切顺利的话，内容应该包含应用程序保存的文本。\n\n本章介绍了一个示例\
  \ Android Studio 应用程序的创建，该程序是一个非常原始的文本编辑器，旨在使用 Android 存储框架利用云存储来创建、保存和打开文件。\n\n\
  68 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\n智能手机和平板的主要用途之一是访问在线内容。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\
  \nAndroid SDK 包含了两个类，使得在开发应用程序时在 Android 设备上实现视频播放变得极其简单。本章将在创建视频播放应用程序之前，提供对这两个类——`VideoView`\
  \ 和 `MediaController` 的概述。\n\n### 8.1 介绍 Android VideoView 类\n\n在 Android 应用程序中显示视频最简单的方法是使用\
  \ `VideoView` 类。这是一个视觉组件，当它被添加到活动的布局时，提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n•H.263\n\
  \n•H.264 AVC\n\n\n\n\n- H.265 HEVC\n- MPEG-4 SP\n- VP8\n- VP9\n\n`VideoView` 类有一系列方法可以被调用来管理视频播放。以下是一些较常用的方法：\n\
  \n- `setVideoPath(String path)` – 指定要播放的视频媒体的路径（字符串格式）。这可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n\
  - `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法相同的任务，但接受一个 `Uri` 对象作为参数而不是字符串。\n\
  - `start()` – 开始视频播放。\n- `stopPlayback()` – 停止视频播放。\n- `pause()` – 暂停视频播放。\n- `isPlaying()`\
  \ – 返回一个 `Boolean` 值，表示视频当前是否正在播放。\n- `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备好播放时调用回调方法。\n- `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生时调用回调方法。\n\
  - `setOnCompletionListener(MediaPlayer.OnCompletionListener)` - 允许在视频结束时调用回调方法。\n\
  - `getDuration()` – 返回视频的持续时间。除非从 `OnPreparedListener()` 回调方法内部调用，否则通常会返回 `-1`。\n\
  - `getCurrentPosition()` – 返回表示当前播放位置的整数值。\n- `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控制控件。\n\n## 68.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例来解决。此时 `MediaController` 将提供一组控制控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前快进）。\n\
  \n控制控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控制控件在播放开始时会短暂出现，随后用户可以通过点击实例所锚定的视图来在任何时候恢复这些控件。\n\
  \n该类的一些关键方法如下：\n\n- `setAnchorView(View view)` – 指定控制器要锚定的视图。这决定了控制控件在屏幕上的位置。\n\
  - `show()` – 显示控制控件。\n- `show(int timeout)` – 控制控件在指定持续（毫秒）内显示。\n- `hide()` – 向用户隐藏控制器。\n\
  - `isShowing()` – 返回一个 `Boolean` 值，表示控制控件当前是否对用户可见。\n\n## 68.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，该程序旨在使用\
  \ `VideoView` 和 `MediaController` 类来播放 MPEG-4 视频文件。\n\n从欢迎屏幕选择 `New Project`（新项目），在生成的新项目对话框中，在点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `VideoPlayer`，并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。使用章节 `[11.8 Migrating a Project to View Binding]` 中的步骤为项目启用视图绑定（view\
  \ binding）。\n\n## 68.4 设计 VideoPlayer 布局\n\n主 Activity 的界面将仅由一个 `VideoView` 类的实例组成。使用\
  \ `Project` 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击它，将 `Layout\
  \ Editor` 工具切换到 `Design` 模式并删除默认的 `TextView` 组件。\n\n从 `Palette` 面板的 `Widgets` 类别中将\
  \ `VideoView` 实例拖放到布局中，使其如 `[Figure 68-1]` 所示填充可用画布区域。使用 `Attributes` 面板，将 `layout_width`\
  \ 和 `layout_height` 属性分别更改为 `match_constraint` 和 `wrap_content`。此外，移除连接 `VideoView`\
  \ 底部到父 `ConstraintLayout` 底部的约束。最后，将组件的 `ID` 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\
  \n图 68-1\n\n## 68.5 下载视频文件\n\nVideoPlayer 应用程序将播放的视频是一个 MPEG-4 格式编码的短动画片段。使用网络浏览器导航到以下\
  \ URL 来播放视频：\n\n`https://www.ebookfrenzy.com/android_book/movie.mp4`\n\n在浏览器窗口内，右键点击视频播放并选择保存或下载视频到本地文件的选项，选择一个合适的临时文件系统位置并将文件命名为\
  \ `movie.mp4`。\n\n在 Android Studio 中，在 `Project` 工具窗口找到 `res` 文件夹，右键点击它并选择 `New\
  \ -> Directory` 菜单选项，在名称字段中输入 `raw` 然后点击 `OK` 按钮。使用操作系统的文件导航器找到上述下载的 `movie.mp4`\
  \ 文件并复制它。回到 Android Studio，右键点击新创建的 `raw` 目录并选择 `Paste` 将视频文件复制到项目中。添加完成后，`Project`\
  \ 工具窗口中的 `raw` 文件夹应符合 `[Figure 68-2]`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\n\
  图 68-2\n\n## 68.6 配置 VideoView\n\n下一步是用视频路径配置 `VideoView` 然后开始播放。这将在主 Activity 初始化后执行，因此请将\
  \ `MainActivity.java` 文件加载到编辑器中，并按照后续代码列表所示进行修改：\n\n```\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        configureVideoView();\n\
  \    }\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\" + getPackageName() + \"/\" + R.raw.movie));\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n这段代码的作用是获取布局中 `VideoView` 实例的引用，为其分配指向 raw 资源中文件的 `Uri` 对象，然后开始播放视频。\n\
  \n在物理 Android 设备上运行应用程序进行测试。在应用程序启动后，视频开始播放之前可能会由于视频内容缓冲而出现短暂延迟（`[Figure 68-3]`）。\n\
  \n![](img/as_3.6_video_player_playing.jpg)\n\n图 68-3\n\n这展示了将视频播放集成到 Android 应用中有多简单。到目前为止，示例中的所有操作都是通过一个\
  \ `VideoView` 实例和少量代码实现的。\n\n## 68.7 为视频视图添加 MediaController\n\n目前 VideoPlayer 应用程序的状态是用户无法控制播放。如前所述，这可以通过\
  \ `MediaController` 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\
  \n```\npackage com.ebookfrenzy.videoplayer;\n\nimport android.widget.MediaController;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private MediaController mediaController;\n```\n\n\n\n\n\n```java\n\
  private void configureVideoView() {\n    binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n            + getPackageName() + \"/\" + R.raw.movie));\n\
  \    mediaController = new MediaController(this);\n    mediaController.setAnchorView(binding.videoView1);\n\
  \    binding.videoView1.setMediaController(mediaController);\n    binding.videoView.start();\n\
  }\n```\n\n当应用实现这些更改并启动时，点击 `VideoView` 画布将导致媒体控件显示在视频播放上层。这些控件应该包含一个 `seekbar` 以及快进、后退和播放/暂停按钮。当控件从视图中消失后，可以通过再次点击\
  \ `VideoView` 画布来随时恢复它们。只需多写三行代码，我们的视频播放器应用程序现在就如图 68-4 所示拥有媒体控件：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 68-4\n\n## 68.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，该 Activity  现在将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，其目的是将视频时长作为消息输出到\
  \ Android Studio Logcat 面板中。该监听器还将配置视频播放持续循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n// ... imports ...\n\nimport android.util.Log;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\n    private\
  \ MediaController mediaController;\n\n    String TAG = \"VideoPlayer\";\n\n    private\
  \ void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                + getPackageName() + \"/\" + R.raw.movie));\n\
  \        MediaController mediaController = new\n                    MediaController(this);\n\
  \        mediaController.setAnchorView(binding.videoView1);\n        binding.videoView1.setMediaController(mediaController);\n\
  \        binding.videoView1.setOnPreparedListener(mp -> {\n            mp.setLooping(true);\n\
  \            Log.i(TAG, \"Duration = \" +\n                    binding.videoView1.getDuration());\n\
  \        });\n        binding.videoView.start();\n    }\n}\n```\n\n现在在视频播放开始之前，Android\
  \ Studio Logcat 面板中将一条如下所示的消息，并且视频将在播放结束后重启：\n\n`11-05 10:27:52.256 12542-12542/com.ebookfrenzy.videoplayer\
  \ I/VideoPlayer: Duration = 13504`\n\n## 68.9 总结\n\nAndroid 设备是向用户传递内容的极佳平台，特别是视频媒体形式。正如本章概述的，Android\
  \ SDK 提供了两个类，即 `VideoView` 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用中变得快速且简单，通常只需要几行\
  \ Java 代码。\n\n## 69. Android 画中画模式\n\n在之前的章节中介绍 Android 的多任务处理时，简要提到了画中画（PiP）模式，但没有进行任何详细介绍。PiP\
  \ 模式主要为视频播放设计，允许 Activity 屏幕缩小尺寸并放置在屏幕上的任何位置。在这种状态下，无论设备上运行任何其他 Activity，Activity\
  \ 都会继续运行且窗口保持可见。这允许用户例如在执行检查邮件或处理电子表格等任务的同时，继续观看视频播放。\n\n本章将提供画中画模式的概述，在下一章中为 VideoPlayer\
  \ 项目添加画中画支持。\n\n### 69.1 画中画功能\n\n正如本章稍后将解释的以及在下一章中演示的那样，可以通过 API 调用将 Activity 置于\
  \ PiP 模式。进入 PiP 模式后，可以指定控制 Activity 屏幕宽高比例的配置选项。例如，图 69-1 显示了视频播放：\n\n![](img/247.jpg)\n\
  \n图 69-1 图 69-2 显示了窗口被点击后：\n\n![](img/236.jpg)\n\n图 69-2\n\n### 69.2 启用画中画\n\nPiP\
  \ 模式目前支持运行 API 26 (Oreo) 或更高版本的设备。实现 PiP 的第一步是在清单文件中启用它。通过添加以下行，基于 Activity 配置 PiP\
  \ 模式：\n\n```xml\n<activity android:name=\".MyActivity\"\n    android:supportsPicturePicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestSize|orientation\">\n   \
  \ <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\" />\n\
  \        <category android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n\
  </activity>\n```\n\n`android:supportsPicturePicture` 条目启用该 Activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 Activity 能够处理布局变化。如果没有此设置，每次 Activity 进入或退出 PiP 模式时，该 Activity\
  \ 都将从头重新启动。\n\n### 69.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInParams` 类来定义，该实例可以通过 `Builder`\
  \ 类创建：\n\n```java\nPictureInParams params = new PictureInParams.Builder().build();\n\
  ```\n\n上述代码创建一个默认的 `PictureInParams` 实例。可以使用以下方法调用来自定义参数：\n\n- `setActions()`：用于定义在\
  \ Activity 处于 PiP 模式时从 PiP 窗口内执行的操作。本将在稍后将详细介绍。\n- `setAspectRatio()`：声明 PiP 窗口外观的首选宽高比例。该方法接收一个包含宽高比例的\
  \ `Rational` 对象作为参数。\n- `setSourceHint()`：接收一个 `Rect` 对象作为参数，定义在 PiP 窗口内显示的 Activity\
  \ 区域。\n\n\n\n\n通过调用 `enterPictureInPictureMode()` 方法并传递一个 `PictureInPictureParams`\
  \ 对象，可以将 Activity 置于画中模式：\n\n```\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，只需按照上一节所述创建一个默认的\
  \ `PictureInPictureParams` 对象。如果之前使用 `setPictureInPictureParams()` 方法设置了参数，则这些参数将与调用\
  \ `enterPictureInPictureMode()` 方法时指定的参数进行合并。\n\n## 69.5 检测画中画模式的变化\n\n当 Activity\
  \ 进入 PiP 模式时，隐藏任何不必要的视图，这样 PiP 窗口内就只显示视频播放。当 Activity 重新进入全屏模式时，需要恢复任何隐藏的用户界面组件。这些以及任何其他特定于应用程序的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。当该方法添加到 Activity 后，每当 Activity 在 PiP 和全屏模式之间切换时，都会调用该方法，并传递一个\
  \ `Boolean` 值，表示 Activity 当前是否处于 PiP 模式：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n## 69.6 添加画中画动作\n\n当 PiP 窗口被用户点击时，画中画动作将以图标的形式显示。实现\
  \ PiP 动作是一个多步骤过程，首先要实现一种让 PiP 窗口通知 Activity 已选择某个动作的方法。这通过在 Activity 中设置一个 `broadcast\
  \ receiver`（广播接收器）来实现，然后在 PiP 动作中创建一个 `pending intent`（待处理意图），该意图被配置为广播广播接收器正在监听的意图。当广播接收器由意图触发时，可以使用意图中存储的数据来识别所执行的动作，并在\
  \ Activity 中采取必要的操作。\n\nPiP 动作使用 `RemoteAction` 实例声明，这些实例在初始化时包含图标、标题、描述以及 `PendingIntent`\
  \ 对象。一旦创建了一个或多个动作，它们就会被添加到 `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给 `setActions()`\
  \ 方法。\n\n以下代码段演示了 `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及 `PictureInPictureParams`\
  \ 实例，然后该实例被应用于 Activity 的 PiP 设置：\n\n```java\nfinal ArrayList<RemoteAction> actions\
  \ = new ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal\
  \ PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\n\
  \                              REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal\
  \ Icon icon = Icon.createWithResource(MyActivity.this,\n                       \
  \                  R.drawable.action_icon);\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \                                             \"My Action Title\",\n           \
  \                                  \"My Action Description\",\n                \
  \                             pendingIntent);\nactions.add(remoteAction);\nPictureInPictureParams\
  \ params =\n    new PictureInPictureParams.Builder()\n              .setActions(actions)\n\
  \              .build();\nsetPictureInPictureParams(params);\n```\n\n## 69.7 总结\n\
  \n画中模式是 Android 8.0 引入的一种多任务功能，专门设计用于允许视频在用户执行其他应用和 Activity 任务的同时在小窗口继续播放。在使用 PiP\
  \ 模式之前，必须在清单文件中支持 PiP 的 Activity 中启用它。\n\nPiP 模式的行为通过 `PictureInPictureParams` 类的实例进行配置，并通过\
  \ Activity 内部调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应只显示视频播放，这要求在选择全屏模式之前隐藏任何其他用户界面元素。这些和其他与模式切换相关的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来实现。\n\nPiP 动作在用户点击 PiP 窗口时以图标的形式覆盖在窗口上。当动作被选中时，这些动作会触发\
  \ Activity 内部的行为。PiP 窗口通过 `broadcast receivers` 和 `pending intents` 通知 Activity\
  \ 动作。\n\n## 70. Android 画中画教程\n\n接上章节，本章将采用现有的 `VideoPlayer` 项目并对其增强，以添加画中画支持，包括检测\
  \ PiP 模式的变化以及添加用于显示当前正在运行视频信息的 PiP 动作。\n\n### 70.1 在 Manifest 中添加画中画支持\n\n在 Android\
  \ 应用项目中添加 PiP 支持的第一步是在清单文件中启用它。打开 `AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n    android:supportsPictureInPicture=\"\
  true\"\n    android:configChanges=\"screenSize|smallestScreenSize|orientation\"\n\
  \    android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n### 70.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ 的布局仅包含一个 `VideoView`。现在向布局中添加一个按钮，用于切换到 PiP 模式。加载 `activity_main.xml` 文件并从调板中拖入一个\
  \ `Button` 对象到布局中。更改按钮文本使其显示为“进入画中模式”，并将字符串提取为名为 `enter_pip` 的资源。在继续下一步之前，将按钮的 ID\
  \ 改为 `pipButton`，并配置按钮调用 `enterPipMode` 方法。\n\n### 70.3 进入画中模式\n\n现在需要将 `enterPipMode`\
  \ `onClick` 回调方法添加到 `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开并添加此方法：\n\n```java\n\
  import android.app.PictureInPictureParams;\nimport android.util.Rational;\n\npublic\
  \ void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \                                     binding.videoView1.getHeight());\n    PictureInPictureParams\
  \ params = new PictureInPictureParams.Builder()\n              .setAspectRatio(rational)\n\
  \              .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n\
  \    binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取按钮视图的引用，创建一个包含 VideoView 宽度和高度的 `Rational` 对象。使用 `PictureInPictureParams`\
  \ Builder 创建一组 `PictureInPictureParams` 参数，并将 `Rational` 对象作为视频播放的宽高比传递。由于在 PiP\
  \ 模式下不需要按钮，因此将其设置为不可见。视频播放控件也被隐藏，以便在 PiP 模式下视频视图不受遮挡。\n\n在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，并在视频开始播放之前点击画中画模式按钮。视频播放应该最小化并显示在\
  \ PiP 窗口中。\n\n\n\n\n![](img/as_3.6_video_player_action_bar.jpg)\n\n图 70-2\n\n虽然视频现在正在\
  \ PiP（画中画）窗口中播放，但大部分视图被标准的 Android 操作栏遮挡了。要移除此内容，需要更改 activity 的应用程序主题样式。在 Android\
  \ Studio 中，找到并编辑 `app -> res -> values -> themes.xml` 文件，并修改 `AppTheme` 元素使用 `NoActionBar`\
  \ 主题：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n\
  \    <!-- Base application theme. -->\n    <style name=\"Theme.VideoPlayer\" parent=\"\
  Theme.MaterialComponents.DayNight.NoActionBar\">\n        <!-- Primary brand color.\
  \ -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n        <item\
  \ name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n</resources>\n\
  ```\n\n对 `themes.xml (night)` 资源文件重复此步骤。编译并运行应用，将视频播放进入 PiP 模式，并注意操作栏不再出现在窗口中：\n\
  \n![](img/as_3.6_video_player_no_action_bar.jpg)\n\n图 70-3\n\n点击 PiP 窗口使其增大，然后点击窗口中心出现的全屏模式标记内。虽然\
  \ activity 回到了全屏模式，但请注意按钮和媒体播放控件仍然保持隐藏状态。\n\n显然，需要在项目中添加一些代码，以检测 activity 内部何时发生\
  \ PiP 模式切换。\n\n## 70.4 检测画中画模式变化\n\n如前一节所述，PiP 模式的变化是通过重写受影响 activity 内部的 `onPictureInPictureModeChanged()`\
  \ 方法来检测的。在这种情况下，需要编写该方法，使其能够检测 activity 是正在进入还是退出 PiP 模式，并采取适当的操作重新激活 PiP 按钮和播放控件。继续留在\
  \ `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当该方法被调用时，会传递一个 `Boolean` 值，指示 activity 现在是否处于 PiP 模式。上述方法中的代码只需检查此值，即可决定是否显示 PiP\
  \ 按钮并重新激活播放控件。\n\n## 70.5 添加广播 Receiver\n\n项目的最后一步是为 PiP 窗口添加一个操作。该操作目的是显示一个包含当前播放视频名称的\
  \ `Toast` 消息。这需要在 PiP 窗口和 activity 之间进行通信。实现此点的最简单方法之一是在 activity 内部实现广播接收器，并使用\
  \ `pending intent` 从 PiP 窗口向 activity 广播消息。每次 activity 进入 PiP 模式时都需要执行这些步骤，因此需要在\
  \ `onPictureInPictureModeChanged()` 方法中添加代码。现在找到该方法，并开始添加一些代码来创建 `intent filter`\
  \ 并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter);\n\
  \        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 70.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。为了本示例，将使用一个名为 `ic_info_24dp.xml` 的图像文件。该文件可以在从以下\
  \ URL 获取的源码存档 `project_icons` 文件夹中找到：[`www.ebookfrenzy.com/retail/dolphinjava/index.php`](https://www.ebookfrenzy.com/retail/dolphinjava/index.php)\n\
  \n找到此图标文件，将其复制并粘贴到 Project 窗口中的 `app -> res -> drawables` 文件夹内：\n\n![](img/Image2442.jpg)\n\
  \n图 70-4\n\n下一步是创建一个将发送给广播接收器的 Intent。然后，此意需要封装在 `PendingIntent` 对象中，允许在用户稍后点击 PiP\
  \ 窗口中的操作时触发该意。\n\n编辑 `MainActivity.java` 文件，添加创建 `Intent` 和 `PendingIntent` 对象的方法：\n\
  \n```java\nimport android.app.PendingIntent;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static final int REQUEST_CODE = 101;\n\n    private\
  \ void createAction() {\n        Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n        final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n现在已经创建了 `Intent`\
  \ 对象以及包含它的 `PendingIntent` 实例，需要创建一个 `RemoteAction` 对象，配置表示 PiP 窗口内操作的图像以及 `PendingIntent`\
  \ 对象。留在 `createAction()` 方法中，添加以下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createAction() {\n    final ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", pendingIntent);\n    actions.add(remoteAction);\n}\n```\n\n现在需要创建一个包含该操作的\
  \ `PictureInPictureParams` 对象，并应用这些参数，以便该操作出现在 PiP 窗口中：\n\n```java\nPictureInPictureParams\
  \ params = \n```\n\n\n\n\n\n```java\n                new PictureInPictureParams.Builder()\n\
  \                        .setActions(actions)\n                        .build();\n\
  \nsetPictureInPictureParams(params);\n}\n```\n\n在测试操作之前的最后一项任务是在 activity 进入 PiP\
  \ 模式时调用 `createPipAction()` 方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    registerReceiver(receiver, filter);\n    createPipAction();\n} else {\n   \
  \ binding.pipButton.setVisibility(View.VISIBLE);\n    binding.videoView1.setMediaController(mediaController);\n\
  }\n```\n\n## 70.7 测试画中画操作\n\n再次构建并运行应用，并将 activity 置于 PiP 模式。点击 PiP 窗口，新的操作按钮将如图\
  \ 70-5 所示出现：\n\n![](img/as_3.6_video_player_action_button.jpg)\n图 70-5\n\n点击操作按钮并等待\
  \ Toast 消息出现显示视频名称：\n\n![](img/as_3.6_video_player_action_toast.jpg)\n图 70-6\n\n\
  ## 70.8 总结\n\n本章演示了如何在 Android Studio 应用项目添加添加画中画（Picture-in-Picture）支持，包括启用和进入\
  \ PiP 模式以及 PiP 操作实现。这包含了使用广播接收器（broadcast receiver）和等待意图（pending intents）来实现 PiP\
  \ 窗口与 activity 之间的通信。\n\n## 71. 在 Android 中请求运行时权限\n\n在前面的章节中创建的许多示例项目中，已对 `AndroidManifest.xml`\
  \ 文件进行了修改，以请求应用执行特定任务的权限。在某些情况下，例如，已请求了访问访问权限以允许应用下载和显示网页。在目前为止的每种情况下，只需在清单文件中添加请求，应用即可获得用户授予执行指定任务的权限。\n\
  \n然而，对于某些权限，在 Android 6.0 或更高版本上运行时，需要额外的步骤才能使应用正常工作。这些所谓的“危险”权限中的第一个将在下一章遇到。但在到达那里之前，本章将概述在最新一代\
  \ Android 上运行时请求此类权限的涉及步骤。\n\n### 71.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来强制安全性。在\
  \ Android 6 引入之前，权限总是在应用安装到设备上时获取的。例如，图 71-1 显示了通过 Google Play 安装应用期间寻求各种权限的典型屏幕。\n\
  \n![](img/Image24254.jpg)\n图 71-1\n\n对于许多类型的权限，这种场景仍然适用于 Android 6.0 或更高版本上的应用。这些权限被称为**普通权限**（normal\
  \ permissions），并且仍要求在安装时点由用户接受。第二类权限被称为**危险权限**（dangerous permissions），也必须像普通权限一样在清单文件中声明，但必须在应用程序首次启动时向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 71-2 所示：\n\n![](img/Image24343.jpg)\n图 71-2\n\n属于危险类别的权限完整列表包含表 71-1 中：\n\n| 权限组\
  \ | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDARWRITE_CALENDAR |\n| 相机 | CAMERA |\n\
  | 联系人 | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS |\n| 位置 | ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION\
  \ |\n| 麦风 | RECORD_AUDIO |\n| 电话 | READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGEREAD_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE |\n\
  表 71-1\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问存储上的所有文件，包括属于其他应用的文件。因此，只有当 Google 在审核期间确认需要该级别后，权限才会被启用。在提交到\
  \ Google Play 之前测试您的应用，可以执行以下 `adb` 命令临时启用应用的访问：\n\n```bash\nadb shell appops set\
  \ <package name> MANAGE_EXTERNAL_STORAGE allow\n```\n\n可以通过以下方式禁用此模式：\n\n```bash\n\
  adb shell appops set <package name> MANAGE_EXTERNAL_STORAGE default\n```\n\n###\
  \ 71.2 创建权限示例\n\n从欢迎界面选择 New Project（新项目），并在新项目中选择 Empty Activity（空活动）模板。在 Name\
  \ 字段中输入 `PermissionDemo` 并指定 `com.ebookrenzy.permissiondemo` 为包名。在点击 Finish 按钮之前，将\
  \ Minimum API 设置为 `26: Android 8.0` 并语言设置为 Java。\n\n## 71.3 检查权限\n\nAndroid 强制通过要求用户授予应用执行某些任务的权限来实施安全。在\
  \ Android 6 引入之前，权限总是在应用安装到设备上时获取的。\n\nAndroid 支持库包含许多方法，用于在 Android 应用中寻求和管理危险权限。这些\
  \ API 调用无论在何种 Android 版本上都是安全的，但只有在 Android 6.0 或更高版本上执行时才有意义。\n\n在应用尝试使用需要权限的功能之前，无论之前是否已授予，代码都必须检查是否已授予。这可以通过调用\
  \ `ContextCompat` 的 `checkSelfPermission()` 实现，传入当前 activity 的引用和请求的权限。该方法将返回匹配\
  \ `PERMISSION_GRANTED` 或 `PERMISSION_DENIED` 的整数。\n\n在示例项目的 `MainActivity.java`\
  \ 文件中，修改代码以检查是否已授予权限：\n\n\n\n\n\n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.permissiondemoactivity\">\n    <uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n    <application\n      \
  \  android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n\
  \        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n再次编译并运行应用，注意这次没有出现出现拒绝权限的消息。显然，在较旧版本的 Android 上请求此权限所需的所有工作都已完成。然而，在运行 Android\
  \ 6.0 或更高版本的设备或模拟器上运行应用，你会发现尽管权限已添加到 manifest 文件中，检查结果仍然报告权限被拒绝。这是因为 Android 6 及更高版本要求应用在运行时也请求危险权限。\n\
  \n## 71.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后将调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。\n\n`requestPermissions()` 方法的参数是当前活动的引用、正在请求的权限的标识符以及一个请求代码。请求代码可以是任意整数值，并将用于标识是哪一个请求触发了对\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件声明请求代码，并在权限检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，使其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        @NonNull String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied\");\n        } else {\n\
  \            Log.i(TAG, \"Permission has been granted by user\");\n        }\n \
  \   }\n}\n```\n\n在运行 Android 6 或更高版本的模拟器或设备上编译并运行应用，注意看到如图 7-3 所示的用于请求录音权限的对话框。点击“在使用应用期间”按钮，并检查\
  \ Logcat 中是否出现了“Permission has been granted by user”的消息。一旦用户授予了请求的权限，`checkSelfPermission()`\
  \ 方法的后续调用将返回 `PERMISSION_GRANTED` 结果，直到用户卸载并重新安装应用，或者在设置中更改了应用的权限。\n\n## 7.5 为权限请求提供理由\n\
  \n如图 7-3 所示，用户可以选择拒绝所请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项，否则应用在每次启动时都会继续请求该权限。用户的反复拒绝可能表明用户不理解为什么应用为什么需要该权限。因此，如果在发出请求时解释需求的原因，用户可能更容易授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。\n\
  \n最好的做法是将解释包含在一个独立的对话框中，可以在请求对话框显示给用户之前显示。这引出了何时显示此解释对话框的问题。Android 文档建议仅在用户之前拒绝过权限时才显示解释对话框，并提供了一个方法来识别此类情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestRationale()` 方法，如果用户之前拒绝过对特定权限的请求，则将返回\
  \ `true` 结果；如果之前未请求过，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示一个包含权限理由的对话框，并在用户阅读并关闭该对话框后，应重复权限请求。\n\
  \n要向示例应用添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder = new AlertDialog.Builder(this);\n            builder.setMessage(\"Permission\
  \ to access the microphone is required for this app to record audio.\")\n      \
  \              .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。\n\
  \n## 7.6 测试权限应用\n\n在进行测试的 Android 6 或更高版本的设备或模拟器话上，启动“设置”应用，选择“应用”选项，并滚动选择 PermissionDemo\
  \ 应用。在应用设置界面上，点击卸载按钮从设备中移除应用。\n\n再次运行应用，当权限请求对话框出现时，点击“不允许”按钮。停止并重启应用，验证理由对话框是否出现。点击“确定”按钮，当权限请求对话框出现时，点击“在使用应用期间”按钮。\n\
  \n\n\n\n返回设置应用，选择应用选项，并再次从列表中选择 `PermissionDemo` 应用。一旦列出该应用的设置，请验证权限（Permissions）部分是否已列出麦克风权限：\n\
  \n![](img/as_permission_microphone.jpg)\n\n图 71-4\n\n## 71.7 总结\n\n在 Android 6.0\
  \ 引入之前，应用请求访问某些功能的唯一必要步骤是在应用程序的清单文件（manifest）中添加适当的行。用户将在安装应用时会被提示其批准该权限。对于大多数权限来说，情况仍然如此，但一组被认为是“危险”的权限除外。被认为危险的权限通常具有允许应用违反用户隐私的潜力，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n正如本章所述，基于 Android 6 或更高版本的应用现在除了在清单文件中包含权限请求外，还在应用启动时向用户请求危险权限的批准。\n\n## 72. 使用\
  \ MediaPlayer 和 MediaRecorder 进行 Android 音频录制和播放\n\n本章将概述 `MediaRecorder` 类，并解释如何使用该类录制音频或视频的基本知识。还将涵盖使用\
  \ `MediaPlayer` 类播放音频的内容。在介绍基础之后，将创建一个示例应用程序以演示这些技术的实际应用。除了查看音频和视频处理，本章还将涉及将文件保存到\
  \ SD 卡的主题。\n\n## 72.1 播放音频\n\n在音频播放方面，Android 的大多数实现支持 AAC LC/LTP、HE-AACv1 (AAC+)、HE-AACv2\
  \ (enhanced AAC+)、AMR-NB、AMR-WB、MP3、MIDI、Ogg Vorbis 和 PCM/WAVE 格式。\n\n可以使用 `MediaPlayer`\
  \ 或 `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，使用流音频缓冲区并对音频提供更大的控制。相比之下，`MediaPlayer`\
  \ 类为实现音频播放提供了更简单的编程接口，能够满足大多数音频需求。\n\n`MediaPlayer` 类有一系列关联的方法，应用程序可以通过这些方法来执行特定任务。该类一些关键方法的子集如下：\n\
  \n- `create()` – 调用以创建类的新实例，传递要播放音频的 `Uri`。\n- `setDataSource()` – 设置播放音频的源。\n-\
  \ `prepare()` – 指令播放器准备开始播放。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。可以通过调用 `resume()`\
  \ 方法恢复播放。\n- `stop()` – 停止播放。\n- `setVolume()` – 接收两个浮点参数，指定左右声道的播放音量。\n- `resume()`\
  \ – 恢复之前暂停的播放会话。\n- `reset()` – 重置多媒体播放器实例的状态。本质上是将实例重置为未初始化状态。至少，重置后的播放器需要重新设置数据源并调用\
  \ `prepare()` 方法。\n- `release()` – 在播放器实例不再需要时调用此方法。此方法确保播放器持有的任何资源都会被释放。\n\n在典型的实现中，应用程序将实例化\
  \ `MediaPlayer` 类的实例，设置要播放的音频源，然后调用 `prepare()` 随后调用 `start()`。例如：\n\n```\nMediaPlayer\
  \ mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n### 72.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用许多不同的技术进行。一种方案是使用 `MediaRecorder` 类，与 `MediaPlayer`\
  \ 类一样，它提供了许多用于录制音频的方法：\n\n- `setAudioSource()` – 指定录制音频的源（通常对于设备麦克风，这将是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()` – 指定录制视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`\
  \ – 指定录制的音频或视频存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定用于录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` –\
  \ 配置存储录制音频或视频的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` –\
  \ 开启录制过程。\n- `stop()` – 停止录制过程。一旦录制器停止，在重新启动之前需要对其完全重新配置和准备。\n- `reset()` – 重置录制器。实例在重新启动之前需要完全重新配置和准备。\n\
  - `release()` – 在录制器实例不再需要时应调用此方法。此方法确保实例持的所有资源都被释放。\n\n使用此类的典型实现将设置源、输出和编码格式以及输出文件。然后将调用\
  \ `prepare()` 和 `start()` 方法。录制结束时调用 `stop()` 方法，然后调用 `reset()` 方法。当应用程序不再需要录制器实例时，建议调用\
  \ `release()` 方法：\n\n```\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  ...\nmediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release();\n```\n\
  \n为了录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n```\n\n### 72.3 关于示例项目\n\n\
  本章其余部分将通过创建一个示例应用程序，来演示如何使用 `MediaPlayer` 和 `MediaRecorder` 类在 Android 设备上实现音频的录制和播放。\n\
  \n在开发使用特定硬件功能的应用程序（以麦克风为例）时，在尝试在代码中访问该功能之前，检查该功能的可用性重要的。因此，本章创建的应用程序将包含检测设备上是否存在麦克风的代码。\n\
  \n### 72.4 创建 AudioApp 项目\n\n在欢迎界面上选择 New Project 选项，并在出现的新项目对话框中，选择 Empty Activity\
  \ 模板，然后点击 Next 按钮。\n\n\n\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 31: Android 12.0`，并将 `Language`\
  \ 菜单更改为 `Java`。按照第 11.8 将项目迁移到 View Binding 节列出的步骤为项目添加视图绑定支持。\n\n## 72.5 设计用户界面\n\
  \n一旦创建了新项目，从 `Project` 工具窗口选择 `activity_main.xml` 文件，并在 `Design` 模式下使用 `Layout Editor`\
  \ 工具，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。对于本示例而言，按钮的位置并不至关重要，但图\
  \ 72-1 显示了一个使用垂直链的建议布局。\n\n配置按钮以显示读取为 `Play`、`Record` 和 `Stop` 的字符串资源，并分别为它们赋予 `playButton`、`recordButton`\
  \ 和 `stopButton` 视图 ID。\n\n选择 `Play` 按钮，并在 `Attributes` 面中，配置 `onClick` 属性以便在用户选择时调用名为\
  \ `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/as_3.5_audioapp_ui.jpg)\n\
  \n图 72-1\n\n## 72.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录音会导致 Android 系统抛出异常。因此，代码在尝试之前检查麦克风的存在至关重要。有很多方法可以实现这一点，包括检查设备是否存在。一种更容易且更有可能在不同的\
  \ Android 设备上运行的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。在这种情况下，`PackageManager.FEATURE_MICROPHONE` 是关注的特性。\n\n\
  为了本示例，我们将创建一个名为 `hasMicrophone()` 的方法，可以调用它来检查麦克风的存在。在 `Project` 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并修改它以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n.\n\n.\n\nimport\
  \ android.content.pm.PackageManager;\n\n.\n\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    protected boolean hasMicrophone() {\n        PackageManager\
  \ pmanager = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n\
  \                PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n## 72.7 初始化\
  \ Activity\n\n下一步是修改 activity 以执行若干初始化任务。留在 `MainActivity.java` 文件中，按如下所示修改代码：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\nimport java.io.IOException;\n\
  import androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\nimport\
  \ android.os.Environment;\nimport android.media.MediaPlayer; \n.\n.\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private boolean isRecording\
  \ = false;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ audioSetup();\n    }\n    private void audioSetup() {\n        if (!hasMicrophone())\
  \ {\n            binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );\n        audioFilePath = audioFile.getAbsolutePath();\n    }\n.\n}\n```\n\n添加的代码首先获取用户界面中三个按钮视图的引用。接下来，调用之前实现的\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果不包含，则所有按钮都被禁用；否则只禁用 `Stop` 和 `Play` 按钮。\n\n\
  下一行代码需要稍微解释一下：\n`File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\");`\n\
  `audioFilePath = audioFile.getAbsolutePath();`\n这段代码在应用程序的内部存储中创建一个名为 `myaudio.3gp`\
  \ 的新文件，用于存储音频录制。\n\n## 72.8 实现 recordAudio() 方法\n\n当用户触摸 `Record` 按钮时，将调用 `recordAudio()`\
  \ 方法。该方法需要启用和禁用适当的按钮，并配置 `MediaRecorder` 实例，提供音频源、输出格式和编码以及存储音频的文件位置的信息。最后，需要调用\
  \ `MediaRecorder` 对象的 `prepare()` 和 `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下实现：\n\
  \n```java\npublic void recordAudio (View view) {\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 72.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法负责启用 `Play` 按钮、禁用 `Stop` 按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如下所示，并应添加到 `MainActivity.java`文件中：\n\
  \n```java\npublic void stopAudio (View view) {\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording) {\n        binding.recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        binding.recordButton.setEnabled(true);\n \
  \   }\n}\n```\n\n## 72.10 实现 playAudio() 方法\n\n`playAudio()` 方法只需创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException {\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 72.11 配置并请求权限\n\n在测试应用程序之前，必须在文件中请求适当权限。特别是，应用程序需要访问麦克风。在\
  \ `Project` 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 以添加权限标签：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n   package=\"com.ebookfrenzy.audioapp\" >\n```\n\n\n\n\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n\n<application\n```\n```.\n\
  .\n.\n```\n上述步骤将确保当应用安装在运行 Android 6.0 之前的版本的设备上时，用户启用麦克风访问权限。在 Android 中，麦克风访问被归类为危险权限，因为它可以让应用有可能损害用户的隐私。因此，为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，需要添加代码以在应用运行时专门请求权限。\n\n编辑 `MainActivity.java` 文件，开始添加一些额外的导入指令和常量，用作所请求权限的请求识别码：\n\
  \n```\n.\n.\n\n```\n\n```java\nimport androidx.core.app.ActivityCompat;\n\nimport\
  \ androidx.core.content.ContextCompat;\n\nimport android.widget.Toast;\n\nimport\
  \ android.Manifest;\n\n.\n.\n\npublic class MainActivity extends AppCompatActivity\
