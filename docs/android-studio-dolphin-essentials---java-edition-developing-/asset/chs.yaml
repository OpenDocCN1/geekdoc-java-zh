  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据元素\n\n数据布局文件需要某种方式来声明视图绑对应的类（例如 `ViewModel`）。在声明这些类后，布局文件还需要一个变量来引用它们。这是通过使用\
  \ `data` 元素实现的，示例所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"viewModel\"\n            type=\"com.example.myapp.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n\n\n\n\n\
  ```java\nbinding = DataBindingUtil.inflate(\n        inflater, R.layout.fragment_main,\
  \ container, false);\nbinding.setLifecycleOwner(this);\nView view = binding.getRoot();\n\
  return view;\n```\n\n### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含一个 `<data>` 元素，该元素包含了变量元素，这些变量由变量名以及要建立绑定的类类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要额外的额外的步骤，将 App 中使用的 `MainViewModel` 实例赋值给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该引用是在上一节中获取的：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述 `<data>` 元素中的第二个变量引用了名为 `MainFragment` 的 Fragment 形式的\
  \ UI 控制器类。在这种情况下，UI 控制器（无论是 `Activity` 还是 `Fragment`）中的代码只需要如下方式将自己赋值给变量：\n\n```java\n\
  binding.setVariable(uiController, this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图与绑定对象之间如何交互。例如，`Button`\
  \ 上的绑定表达式可以声明响应点击时调用对象上的哪个方法。或者，绑定表达式可以定义存储在 `ViewModel` 中的哪个数据值显示在 `TextView` 中，以及如何对其进行展示和格式化。\n\
  \n绑定表达式使用声明式语言，允许在决定如何使用绑定数据时使用逻辑以及对其他类和方法的访问。例如，表达式可以包含数学表达式、方法调用、字符串拼接、数组元素访问和比较操作。此外，所有标准的\
  \ Java 语言库都默认导入，因此 Java 中可以实现的许多功能在绑定表达式中也可以执行。正如已经讨论过的，`<data>` 元素还可以用于导入自定义类以为表达式增加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，后跟包含在大括号（`}`}`中的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已分配给数据绑定布局文件中名为\
  \ `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便该视图始终显示最新的结果值。如果此值被存储为 `String` 对象，则在布局文件中的声明如下：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  @{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为存储在 `viewModel` 对象 `result` `LiveData` 属性中的值。\n\n然而，考虑结果存储在模型中是 `Float`\
  \ 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，在 `TextView` 显示它之前，需要将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准\
  \ Java 语言类完成转换的必要步骤：\n\n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\
  \n```\n\n在进行此更改后运行 App 时，需要注意 Android Studio 控制台中可能会出现以下警告：\n\n`warning: myViewModel.result.getValue()\
  \ is a boxed field but needs to be un-boxed to execute String.valueOf(myViewModel.result.getValue()).`\n\
  \nJava 中的值可以以原始值的形式（例如 `boolean` 类型，称为“未拆箱”）存在，也可以封装在 Java 对象中（例如 `Boolean` 类型），并通过对该对象的引用进行访问（即“装箱”）。拆箱过程涉及从对象中拆出原始值。\n\
  \n为了避免此消息，请如下所示将错误的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值之后包含单词“dollars”，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的字符串被封装在双引号中，现在表达式本身用单引号封装，以避免语法错误。表达式语法还允许三元语句。在下面的表达式中，根据结果值是否大于\
  \ 10，视图将显示不同的文本：\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\" : \"In\
  \ range\"}\n```\n\n表达式还可以构造为访问数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n\
  ```\n\n### 35.2.7 绑定表达式（双向）\n\n为止过的表达式类型被称为单向绑定。换句话说，布局随着值的变化不断更新，但布局的更改不会更新数据模型。\n\
  \n相反，双向绑定允许响应布局的变化来更新数据模型。例如，`EditText` 视图可以配置双向绑定，当用户输入不同的值时，该值将用于更新相应的数据模型。声明双向表达式时，语法与单向表达式类似，但它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件与绑定\n\n绑定表达式也可以用于响应视图的事件触发方法调用。例如，`Button` 视图可以配置为点击时调用方法。在之前的“在 Android Studio\
  \ 中创建示例 App”章节中，按钮的 `onClick` 属性被配置为调用 App 主 Activity 中名为 `convertCurrency()` 的方法。在\
  \ XML 文件中这表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法定义如下：\n\n```java\npublic void convertCurrency(View view) {\n}\n```\n\n注意，这种类型的方法调用始终会被传递事件发生视图的引用。数据绑定可以使用以下表达式来实现相同的效果（假设布局已绑定到名为\
  \ `uiController` 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\
  \n```\n\n另一种选择，也是提供向方法传递参数的方法，被称为监听绑定。下面的表达式使用这种方法调用同一 `viewModel` 实例上的方法，且没有参数：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n下面的表达式调用了一个接受三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n\n\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要学习更多关于绑定表达式的知识，请查看\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一种系统，可以在用户界面布局中的视图与应用 架构中其他对象的数据和方法之间建立连接，而无需编写代码。在完成一些初始配置步骤后，数据绑定仅涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的或双向的，并且还可以用于绑定方法，以响应用户界面中按钮点击等事件的回调。\n\
  \n# 36. Android Jetpack 数据绑定教程\n\n到本书为止，我们已经涵盖了现代 Android 应用架构的基础概念，并更详细地查看了 `ViewModel`\
  \ 和 `LiveData` 组件。上一章也涵盖了数据绑定的概念，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n## 36.1\
  \ 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中在本章结束时不再需要的所有代码来演示数据绑定的力量。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并进行如下代码：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\n.\n.\n\nimport android.arch.lifecycle.Observer;\n\
  \n.\n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ mViewModel;\n.\n.\n    @Override\n    public void onViewCreated(@NonNull View\
  \ view,\n                             @Nullable Bundle savedInstanceState) {\n \
  \       super.onViewCreated(view, savedInstanceState);\n        final Observer<Float>\
  \ resultObserver = new Observer<Float>() {\n            @Override\n            public\
  \ void onChanged(@Nullable final Float result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                                    \"%.2f\", result));\n            }\n      \
  \  };\n        mViewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                                    binding.dollarText.getText()));\n       \
  \     } else {\n                binding.resultText.setText(\"No Value\");\n    \
  \        }\n        });\n    }\n.\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按如下删除代码（同时注意\
  \ `dollarText` 变量到 `LiveData` 的转换）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    private public MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n尽管我们在实现数据绑定的过程中会添加几行额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n## 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 项目中启用它。这涉及向 `Gradle Scripts` -> `build.gradle (Module:\
  \ ViewModelDemo.app)` 文件添加新属性。\n\n在 `build.gradle` 文件中，添加以下元素以启用数据绑定：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n\
  \        viewBinding true\n        dataBinding true\n    }\n}\n```\n\n一旦添加了条目，编辑器顶部会出现一个包含\
  \ `Sync` 链接的栏。点击它重新同步项目。\n\n### 36.3 添加布局元素\n\n正如“数据绑定”部分所述，为了能够使用数据绑定，布局必须有一个 `layout`\
  \ 组件作为根节点。这要求对 `fragment_main.xml` 文件（`app` -> `layout` -> `fragment_main.xml`）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ `Code` 模式并进行更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  完成这些更改后，切换回 `Design` 模式，注意新的画布上不可见但在组件树列表中可见。构建并运行应用以验证布局的添加没有更改界面。\n\n### 36.4\
  \ 在文件中添加数据元素\n\n将布局文件转换为数据绑定布局的下一步是添加 `data` 元素。在本示例中，布局将绑定到 `MainViewModel`，因此编辑\
  \ `fragment_main.xml` 文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    </data>\n\
  \    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"@+id/main\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n</layout>\n\
  ```\n\n再次构建并运行应用以确保更改生效。\n\n### 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java` 文件中的代码以膨胀数据绑定。通过重写\
  \ `onCreateView()` 方法可以最好地实现这一点：\n\n```java\n.\n.\n\nimport androidx.databinding.DataBindingUtil;\n\
  \n.\n.\n\npublic class MainFragment extends Fragment {\n.\n.\n    @Override\n  \
  \  public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        binding = FragmentMainBinding.inflate(inflater, container, false);\n\
  \        binding = DataBindingUtil.inflate(\n            inflater, R.layout.fragment_main,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n    }\n}\n```\n\n\
  \n\n\n```java\nreturn binding.getRoot();\n}\n```\n\n旧代码简单地加载了 `fragment_main.xml`\
  \ 布局文件（换句话说，创建包含所有视图对象的布局），并返回了根视图（顶层布局容器）的引用。`Data Binding Library` 包含一个工具类，它提供了一个特殊的加载方法，该方法在构建\
  \ UI 的同时，还会初始化并返回布局数据绑定类的实例。新代码调用了此方法，并将绑定类实例的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(inflater,\
  \ R.layout.fragment_main, container, false);\n```\n\n`binding` 对象只需要在 fragment 存在期间保留在内存中。为了确保\
  \ fragment 在消失时销毁实例，将当前 fragment 声明为绑定对象的生命周期所有者（lifecycle owner）。\n\n```java\n\
  binding.setLifecycleOwner(this);\nreturn binding.getRoot();\n```\n\n### 36.6 将 ViewModel\
  \ 实例赋值给 Data Binding 变量\n\n此时，数据绑定知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局文件中声明的 `viewModel` 变量。将以下代码添加到 `MainFragment.kt`\
  \ 文件的 `onViewCreated()` 方法中：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 菜单选项重新构建项目以强制生成该类。完成这些更改后，下一步是开始在数据绑定布局文件的视图元素中插入一些绑定表达式。\n\n### 36.7\
  \ 添加绑定表达式（Binding Expressions）\n\n第一个绑定表达式将 `resultText` `TextView` 绑定到模型视图中的结果值。编辑\
  \ `fragment_main.xml` 文件，找到 `resultText` 元素并修改 text 属性，使元素内容如下：\n\n```xml\n<TextView\n\
  \    android:id=\"@+id/resultText\"\n    android:layout_width=\"wrap_content\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:text=\"MainFragment\"\n\
  \    android:text='@{safeUnbox(myViewModel.result) == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条指示用户输入数值的消息。然而，如果结果不为零，则将该值转换为字符串，并与单词“euros”拼接，然后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相比之下，`dollarValue` `EditText` 视图需要使用双向绑定，以便根据用户输入的最新值更新数据模型，并允许在发生如设备旋转触发的生命周期事件时，将当前值重新显示在视图中。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在已经添加这些初始绑定表达式，现在需要编写一个方法在用户点击\
  \ `Button` 小部件时执行转换。\n\n### 36.8 添加转换方法\n\n点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法来执行转换计算，并将欧元值放入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic\
  \ class MainViewModel extends ViewModel {\n    static final Float usd_to_rate =\
  \ 0.74;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ void convertValue() {\n        if (dollarValue.getValue() != null && !dollarValue.getValue().equals(\"\
  \")) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()) * usd_to_rate);\n\
  \        } else {\n            result.setValue(0F);\n        }\n    }\n}\n```\n\n\
  注意，在没有有效的美元值的情况下，为 `result` `LiveData` 分配零值。这确保了到 `resultText` 的绑定表达式会显示“Enter value”。\n\
  \n### 36.9 添加监听绑定\n\n测试项目前的最后一步是在布局文件中的 `Button` 元素添加监听表达式，以便在点击按钮时调用 `convertValue()`\
  \ 方法。再次以代码模式编辑 `fragment_main.xml` 文件，找到 `convertButton` 元素并添加如下 onClick 项：\n\n\
  ```xml\n<Button\n    android:id=\"@+id/convertButton\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  77dp\"\n    android:onClick=\"@() -> myViewModel.convertValue()}\"\n    android:text=\"\
  Convert\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ## 36.10 测试应用\n\n编译并运行应用，测试在美元字段中输入值并点击 `Convert` 按钮会在 `TextView` 上显示正确的结果（带有“euros”后缀），以及当美元字段为空时尝试转换是否会显示提示。此外，验证在设备旋转时用户界面显示的信息是否保留。\n\
  \n### 36.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向、双向和监听绑定表达式的使用。本章还提供了一个实用示例，展示了通过结合数据绑定和\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接，可以节省多少代码编写。\n\n### 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保护和恢复是为了确保在应用进入后台后，在外观和行为上为用户提供连续性。用户已经习惯从一个应用切换到另一个应用，并在返回原始应用时，发现它仍处于切换之前的完全状态。\n\
  \n\n\n\n正如“理解 Android 应用和 Activity 生命周期”章节中概述的，当用户将应用程序置于后台时，如果资源受限，该程序可能会被操作系统可能会终止。当用户尝试将已终止的应用恢复到前台时，Android\
  \ 只会在一个新的进程中重新启动该应用。由于这一切对用户来说是不可见的，因此由应用负责将自己恢复到最初被置于后台时的状态，而不是以其“初始启动”状态呈现出来。对于基于\
  \ `ViewModel` 的应用，这种行为的很大一部分可以使用 ViewModel Saved State 模块来实现。\n\n### 37.1 理解 ViewModel\
  \ 状态保存\n\n如前面的章节所示，`ViewModel` 为应用开发带来了许多好处，包括在设备旋转等配置更改时恢复 UI 状态。要查看其操作效果，请运行 `ViewModelDemo`\
  \ 应用（或者如果您尚未创建项目，请从书籍附带的示例代码下载中向 Android Studio 加载 `ViewModelDemo_LiveData` 项目）。\n\
  \n运行后，输入一个美元金额并将其转换为欧元。在同时显示美元和欧元值的情况下，旋转设备或模拟器，并注意：一旦应用响应了方向变化，两个值仍然可见。\n\n遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍在运行时，点击设备上的主页键将\
  \ `ViewModelDemo` 应用置于后台，然后通过打开终端或命令提示符窗口并运行以下命令将其终止（其中 `<package name>` 是您创建项目时使用的名称，例如\
  \ `com.ebookfrenzy.viewmodeldemo`）：\n\n```\nadb shell am kill <package name>\n```\n\
  \n如果未找到 `adb` 命令，请参考“设置 Android Studio 开发环境”章节中有关设置您的 Android Studio 环境的步骤。\n\n\
  一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要直接在 Android Studio 内部重新运行该应用）。一旦应用出现，它的表现就像是刚刚启动的一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，该应用仅仅是从后台恢复的，理应仍包含原始数据。在这种情况下，该应用未能未能提供用户在\
  \ Android 应用中预期期望的连续性。\n\n### 37.2 实现 ViewModel 状态保存\n\n基础的 ViewModel 状态保存通过引入 ViewModel\
  \ Saved State 库而成为可能。该库本质上扩展了 `ViewModel` 类，以支持在后台进程终止及后续重新启动期间维护状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射（key-value\
  \ map），允许通过引用相应的键来保存和恢复值。\n\n为了支持保存状态，需要声明一种不同的 `ViewModel` 子类，在这种情况下，它包含一个可以接收\
  \ `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时包含一个 `SavedStateViewModelFactory` 对象来创建此类类型的\
  \ `ViewModel` 实例。考虑以下来自标准 `ViewModel` 声明的代码摘录：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \npublic class MainViewModel extends ViewModel {\n\n.\n\n.\n\n}\n```\n\n创建此类类实例的代码可能如下所示：\n\
  \n```java\nprivate MainViewModel mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持保存状态的 `ViewModel` 子类需要如下声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\n\nimport androidx.lifecycle.ViewModel;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  \n.\n\n.\n}\n```\n\n当创建上述 `ViewModel` 实例时，必须如下所示向 `ViewModelProvider` 类初始化器传递一个\
  \ `SavedStateViewModelFactory` 实例：\n\n```java\nSavedStateViewModelFactory factory\
  \ =\n      new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n###\
  \ 37.3 保存和恢复状态\n\n可以通过从 `ViewModel` 内部将对象或值传递给 `SavedStateHandle` 实例的 `set()` 方法来保存，并提供在执行检索时用于引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当与 `LiveData` 对象一起使用，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前保存的值，再次如下引用相应的键：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复一个普通的（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\n\
  String restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回保存状态是否包含指定键的布尔值。\n- `remove(String key)`\
  \ - 从保存状态中移除值和键。返回被移除的值。\n- `keys()` - 返回保存状态中包含的所有键集合。\n\n### 37.4 为 ViewModelDemo\
  \ 项目添加保存状态支持\n\n在掌握了 ViewModel 保存状态的基础知识后，可以扩展 `ViewModelDemo` 应用以包含此支持。首先，向 Android\
  \ Studio 加载在“Android Jetpack LiveData 教程”中创建的 `ViewModelDemo_LiveData` 项目（示例代码下载中该项目），打开\
  \ `build.gradle` (Module: ViewModelDemo.app) 文件并添加 Saved State 库（如既往一样检查是否有更新的库版本）：\n\
  \n```gradle\ndependencies {\n.\n\n.\n    implementation \"androidx.savedstate:savedstate:1.2.0\"\
  \n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.5.1\"\
  \n.\n\n.\n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使其构造函数接收并存储 `SavedStateHandle`\
  \ 实例。同时导入 `androidx.lifecycle.SavedStateHandle`，声明键常量并修改 `result` 变量，使其从保存状态中获取值：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n    private SavedStateHandle savedStateHandle;\n\
  private MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n\n.\n\n.\n}\n```\n\
  \n在 `MainViewModel.java` 文件中继续，修改 `setAmount()` 方法，包含代码以在每次计算新的欧元金额时保存结果值：\n\n```java\n\
  public void setAmount(String value) {\n    this.dollarText = value;\n}\n```\n\n\n\
  \n\n```java\nresult.setValue(Float.valueOf(dollarText)* rate);\n\nFloat convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n\nresult.setValue(convertedValue);\n\n\
  savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成 `ViewModel` 的更改后，打开\
  \ `MainFragment.java` 文件，并进行以下更改，以便在 `ViewModel` 创建过程中包含一个 `Saved State factory`\
  \ 实例：\n\n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n            new SavedStateViewModelFactory(\n\
  \                    getActivity().getApplication(),this);\n    mViewModel = new\
  \ ViewModelProvider(this, factory).get(MainViewModel.class);\n    // TODO: Use the\
  \ ViewModel\n}\n```\n\n完成更改后，构建并运行应用，然后执行货币转换。当屏幕 UI 填充了美元和欧元数值后，将应用置于后台，使用 `adb`\
  \ 工具将其终止，然后从设备或模拟器屏幕上重新启动。重启后，之前的货币金额应仍然显示在 `TextView` 和 `EditText` 组件中，这确认状态已成功保存并恢复。\n\
  \n## 37.5 总结\n\n设计良好的应用在从后台切回时，应该始终向用户呈现相同的状态，无论期间包含应用的进程是否被操作系统终止。在与 `ViewModels`\
  \ 工作时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受一个 `SavedStateHandle`\
  \ 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据值。当创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在后台终止期间自动保存和恢复状态。\n\n### 38. 与 Android 生命周期周期感知组件一起工作\n\n早些之前名为“理解\
  \ Android 应用和 Activity 生命周期周期”的章节描述了如何使用生命周期方法跟踪 UI 控制器（如 `activity` 或 `fragment`）内部的生命周期状态变化。这些方法的主要问题之一是它们将处理生命周期变化的负担转嫁给了\
  \ UI 控制器。从表面上看，这似乎是逻辑上的方法，因为 UI 控制器终究是经历状态更改的对象。然而，事实是，通常受状态更改影响的代码往往存在于应用中的其他类中。这导致\
  \ UI 控制器中出现了复杂的代码，这些代码需要响应生命周期状态的变化来管理和操作其他对象。显然，在遵循 Android 架构指南时，这种情况是应该尽量避免的。\n\
  \n更整洁、更有逻辑的方法是让应用中的对象能够观察其他对象的生命周期状态，并负责对变化采取任何必要的行动。例如，负责跟踪用户位置的类可以观察 UI 控制器的生命周期状态，并在控制器进入暂停（paused）状态时挂位置更新。当控制器进入恢复（resumed）状态时，重新开始跟踪。这是通过\
  \ Android 架构组件包含的 `Lifecycle` 包所提供的类和接口实现的。\n\n本章将引入能够在 Android 应用中构建生命周期感知能力的术语和关键组件。\n\
  \n#### 38.1 生命周期周期感知\n\n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称该对象是生命周期感知的。某些 Android 组件（`LiveData`\
  \ 是一个典型的例子）已经是生命周期感知的。通过在类中实现 `LifecycleObserver` 接口，也可以将任何类配置为生命周期感知。\n\n#### 38.2\
  \ 生命周期所有者\n\n生命周期感知组件只能观察生命周期所有者（lifecycle owners）对象的状态。生命周期所有者实现 `LifecycleOwner`\
  \ 接口，并被分配一个伴的 `Lifecycle` 对象，该对象负责存储组件当前的状态并向生命周期观察者提供状态信息。大多数标准的 Android Framework\
  \ 组件（如 `activity` 和 `fragment` 类）都是生命周期所有者。自定义类也可以通过使用 `LifecycleRegistry` 类并实现\
  \ `LifecycleObserver` 接口来配置为生命周期所有者。例如：\n\n```java\npublic class SampleOwner implements\
  \ LifecycleOwner {\n    private LifecycleRegistry lifecycleRegistry;\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n    @NonNull\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n除非生命周期所有者另一个生命周期感知组件的子类，否则该类需要通过调用 `LifecycleRegistry` 类的方法来自己触发生命周期状态变化。可以使用\
  \ `markState()` 方法传递新状态值来触发生命周期状态变化：\n\n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用也将导致对相应事件处理程序的调用。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n#### 38.3 生命周期观察者\n\n为了让生命周期感知组件能够观察生命周期所有者的状态，它必须实现 `DefaultLifecycleObserver`\
  \ 接口，并对它需要观察的任何生命周期变化事件重方法。\n\n```java\npublic class SampleObserver implements DefaultLifecycleObserver\
  \ {\n    // 生命周期事件方法重写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到 `Lifecycle` 对象维护的列表中。\n\n\
  ```java\ngetLifecycle().addObserver(new SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，可以随时从\
  \ `Lifecycle` 对象中移除。\n\n[图 38-1] 展示了提供生命周期感知能力的关键元素之间的关系：\n\n![](img/lifecycle_component.jpg)\n\
  \n图 38-1\n\n#### 38.4 生命周期状态与事件\n\n当生命周期所有者的状态更改时，分配的 `Lifecycle` 对象将更新为新状态。在任何给定时刻，生命周期所有者处于以下五个状态之一：\n\
  \n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n\
  - `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\n当组件在不同状态之间切换时，`Lifecycle`\
  \ 对象将在任何添加的观察者上触发事件。生命周期观察者可以重写以下事件方法：\n\n- `onCreate()`\n- `onResume()`\n- `onPause()`\n\
  - `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()`\
  \ 方法：\n\n```java\n@Override\npublic void onResume(@NonNull LifecycleOwner owner)\
  \ {\n    // 响应 状态事件执行任务\n}\n```\n\n[图 38-2] 中的流程图说明了生命周期所有者状态变化的顺序，以及在每个状态转换之间观察者上触发的生命周期事件：\n\
  \n![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n### 38.5 总结\n\n\n\n\
  \n本章介绍了生命周期感知的基础知识，以及 Android Jetpack 包含的 Android Lifecycle 包中的类和接口。该包包含许多用于创建生命周期所有者（lifecycle\
  \ owners）、生命周期观察者（lifecycle observers）和生命周期感知组件的类和接口。生命周期所有者分配有一个 `Lifecycle` 对象，用于维护所有者的状态记录以及订阅观察者的列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便对变化做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括创建生命周期观察者和所有者，以及处理生命周期状态变化和事件。\n\
  \n# 39. Android Jetpack 生命周期感知感知教程\n\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目中实现这一特点的关键类和接口。本章将在这些知识的基础上，通过构建一个\
  \ Android Studio 项目，旨在突出生命周期感知的实际应用。\n\n## 39.1 创建示例生命周期项目\n\n从欢迎界面选择 `New Project`（新建项目）快速启动选项，在生成的新项目对话框中，在点击\
  \ `Next`（下一步）按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name`（名称）字段中输入 `LifecycleDemo`\
  \ 并指定 `com.ebookfrenzy.lifecycledemo` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n## 39.2\
  \ 创建生命周期观察者\n\n如前所述，activity 和碎片已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中查看，本教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口中键单击 `app` -> `java` -> `com` -> `ebookfrenzy`\
  \ -> `lifecycledemo`，并在生成的菜单中选择 `New` -> `Java Class...`。在 `New Class` 对话框中，将类命名为\
  \ `DemoObserver` 并按下键盘 Return 键创建 `DemoObserver.java` 文件。新文件应自动在编辑器中打开，内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.lifecycledemo;\n\npublic class DemoObserver {\n\
  \n}\n```\n\n留在编辑器中，修改类文件以声明将实现 `DefaultLifecycleObserver` 接口：\n\n```java\npackage\
  \ com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n\n}\n```\n\n\
  下一步是重写 `DefaultLifecycleObserver` 类的生命周期方法。为了本示例，所有的事件都将被处理，每个事件都会向 Logcat 面板输出显示事件类型的消息。按照以下列表更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n    private String\
  \ LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainFragment` 类中。\n\n\
  ## 39.3 添加观察者\n\n通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法将观察者添加到生命周期所有者，该引用通过调用\
  \ `getLifecycle()` 方法获取。编辑 `MainFragment.java` 类文件并重写 `onViewCreated()` 生命周期周期方法以添加观察者：\n\
  \n```java\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n\n@Override\npublic\
  \ void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState) {\n\
  \    super.onViewCreated(view, savedInstanceState);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n创建观察者并将其添加到生命周期所有者后，应用已准备就绪。\n\n## 39.4 测试观察者\n\n\
  由于 `DemoObserver` 类向 Logcat 输出诊断信息，如果配置了过滤器仅显示 `DemoObserver`，则将更容易看到输出。使用之前描述的步骤，显示\
  \ Logcat 面板并输入以下键：`DemoObserver`。\n\n在成功启动应用后，输出应指示以下内容：\nonCreate\nonResume\n\n\
  在应用运行时，执行设备旋转以触发碎片的销毁和重建，生成以下输出：\nonPause\nonStop\nonDestroy\nonCreate\nonStart\n\
  \n在移动到章的下一节之前，花些时间将输出与上一章的流程图进行比较。\n\n## 39.5 创建生命周期所有者\n\n本章的最后一个任务是创建一个生命周期所有者，并演示如何触发事件和修改生命周期状态。\n\
  \n在 Project 工具窗口中，键单击 `app` -> `java` -> `com` -> `ebookfrenzy` -> `lifecycledemo`\
  \ 项并选择 `New` -> `Java Class...` 添加新类。在按下 Return 键之前将类命名为 `DemoOwner`。将 `DemoOwner.java`\
  \ 文件加载到编辑器后，修改如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.Lifecycle;\n\
  import androidx.lifecycle.LifecycleOwner;\nimport androidx.lifecycle.LifecycleRegistry;\n\
  import androidx.annotation.NonNull;\n\npublic class DemoOwner implements LifecycleOwner\
  \ {\n}\n```\n\n该类需要一个使用引用初始化的 `LifecycleRegistry` 实例，以及一个返回 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明一个存储 `LifecycleRegistry` 引用的变量、初始化 `LifecycleRegistry`\
  \ 实例的构造函数并添加 `getLifecycle()` 方法：\n\n```java\npublic class DemoOwner implements\
  \ LifecycleOwner {\n    private final LifecycleRegistry lifecycleRegistry;\n\n \
  \   public DemoOwner() {\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n}\n```\n\n接下来，该类需要向注册表通知生命周期状态变化。可以通过使用\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或者通过使用 `handleLifecycleEvent()` 方法触发事件来实现。自定义类中什么是状态变化取决于类的目的。对于本示例，我们将添加一些在调用时会触发生命周期事件的方法：\n\
  \n```java\nprivate LifecycleRegistry lifecycleRegistry;\n\npublic void startOwner()\
  \ {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n}\n\n\
  public void stopOwner() {\n```\n\n\n\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \n}\n\n@NonNull\n@Override\npublic Lifecycle getLifecycle() {\n    return lifecycleRegistry;\n\
  }\n```\n\n`DemoOwner` 类中的最后一项更改是将 `DemoObserver` 类作为观察者添加。此调用将在构造函数中执行：\n\n```java\n\
  public DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n   \
  \ getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n将 `MainFragment.java`\
  \ 文件加载到代码编辑器中，找到 `onViewCreated()` 方法并添加代码以创建 `DemoOwner` 类的实例并调用 `startOwner()`\
  \ 和 `stopOwner()` 方法。请注意，已经删除了添加 `DemoObserver` 作为观察者的调用。虽然一个观察者可以用于多个所有者，但在情况下将其删除是为了避免在\
  \ Logcat 工具窗口中出现重复且混淆的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n### 39.6 测试自定义生命周期所有者\n\n最后一次构建并运行应用，参考 Logcat 工具窗口并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\
  \n1. `onCreate`\n2. `onStart`\n3. `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，但“已（created）”状态的变化仍被触发了。事实上，这些变化是在所有者实例首次被创建时以及随后的处理\
  \ `ON_STOP` 事件时自动触发的。\n\n## 39.7 总结\n\n本章实际演示了在 Android 应用中实现生命周期感知（lifecycle awareness）的步骤。这包括了创建生命周期观察者以及基础生命周期所有者类的设计与实现。\n\
  \n# 40. 导航架构组件概述\n\n如今很少有 Android 应用仅由单个屏幕组成。事实上，大多数应用包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在屏幕之间进行导航。在\
  \ Android Jetpack 引入之前，应用内的导航实现很大程度上是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入以及 Android Studio 对导航图（navigation graphs）的支持，这种情况得到了显著改善。\n\n## 40.1\
  \ 理解导航\n\n每个应用都有一个主屏幕，它在应用启动且任何启动屏出现后显示（启动屏是在应用加载时临时显示的应用品牌屏幕）。从这个主屏幕开始，用户通常会执行会导致其他屏幕出现的任务。这些屏幕通常以应用内其他\
  \ Activity 和 Fragment 的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户从那里导航到另一个屏幕以访问联系人列表，或者导航到设置屏幕。联系人列表屏幕又允许用户导航到其他屏幕，在其中可以添加新用户或更新现有联系人。从图上看，应用的导航图可以如图\
  \ 40-1 所示：\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为“目的地（destination）”，通常是一个\
  \ Fragment 或 Activity。Android 导航架构使用导航栈（navigation stack）来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个被放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地并推入主目的之栈上方。当用户导航到其他屏幕时，它们也会被推入栈中。例如图\
  \ 40-2 显示了假设的消息应用在用户启动应用并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/jetpack_navigation_stack_diagram.jpg)\n\
  \n图 40-2\n\n当用户使用系统返回键在屏幕间向后导航时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户已从“添加联系人”屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，它由\
  \ `NavController` 类表示。\n\n使用导航架构组件为 Android 项目添加导航是一个简单的过程，涉及导航主机（navigation host）、导航图（navigation\
  \ graph）、导航动作（navigation actions）以及少量的代码编写，以获取导航控制器实例的引用并与其交互。\n\n## 40.2 声明导航主机\n\
  \n导航主机仅仅是嵌入到 Activity 用户界面的特殊 Fragment（`NavHostFragment`），作为用户将导航的目的地的占位符。例如图 40-4\
  \ 显示了一个典型的 Activity 屏幕，并突出了导航主机的区域：\n\n![](img/jetpack_navhost.jpg)\n\n图 40-4\n\n\
  `NavHostFragment` 可以通过从调板中拖放实例放置到 Activity 布局中，或者通过如下手动编辑 XML：\n\n```xml\nxml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n\n</FrameLayout>\n```\n\n上述导航主机元素的重点在于 `name` 属性对 `NavHostFragment` 的引用、将\
  \ `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 Activity 启动时，此导航主机将被导航图中指定的首页目的地替换。当用户在应用屏幕间导航时，主机\
  \ Fragment 将被对应目的地的 Fragment 替换。\n\n## 40.3 导航图\n\n\n\n\n\n导航图是一个 XML 文件，其中包含了包含在应用导航中的目的地（destinations）。除了这些目的地，该文件还包含了定义目的地之间导航的导航动作，以及用于从一个目的地传递数据到另一个目的地的可选参数参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图表并实现动作。\n\n图 40-5 显示了处于 Design 模式的 Android\
  \ Studio 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表\
  \ (A) 提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将会在图中定位并选中相应的目的地（这对于在大型图表中定位特定目的地特别有用）。导航图面板\
  \ (B) 包含每个目的地的一个对话框，显示了用户界面布局的表示。在例例中，此图表包含两个名为 `mainFragment` 和 `secondFragment`\
  \ 的目的地。目的地之间的箭头 (C) 代表导航动作连接。可以通过将鼠标指针悬停在源节点的边缘直到出现一个圆圈，然后从圆圈拖到目的地来添加动作。属性面板 (D)\
  \ 允许查看和修改当前选中目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可以选择将现有的\
  \ fragment 或 activity 作为目的地，也可以创建新的空白 fragment 目的地。组件树面板 (F) 提供了导航图的层级概览。\n\n可以通过将编辑器切换到\
  \ Code 模式查看并修改导航图的底层 XML。以下 XML 列表表示了上述 [图 40-5] 中所示目的地和动作连接的导航图：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n    </fragment>\n</navigation>\n```\n\n如有必要，导航图也可以拆分到多个文件中，以改进结构并促进复用。以这种结构组织时，嵌套图会被嵌入到根图中。要创建嵌套图，只需对要嵌套的目的按\
  \ shift-点击，右键点击第一个目的地并选择 `Move to Nested Graph -> New Graph` 菜单选项。嵌套图随后将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点将图文件加载到编辑器中。\n\
  \n### 40.4 访问导航控制器 (Navigation Controller)\n\n从一个目的地导航到另一个目的地通常是响应应用内部的某种事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，下面的代码可以访问 activity\
  \ 的导航控制器。注意，为了使代码生效，activity 必须包含一个导航主机 fragment：\n\n```java\nNavController controller\
  \ =\n    Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n\
  ```\n\n在这种情况下，方法调用传递了 activity 的引用以及嵌入 activity 布局中的 `NavHostFragment` 的 ID。\n\n\
  或者，可以通过简单将该视图传递给方法来识别与视图关联的导航控制器：\n\n```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一种选项通过调用 `NavHostFragment` 的 `findNavController` 方法查找 fragment 的导航控制器：\n\
  \n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n### 40.5 触发导航动作\n\n一旦找到导航控制器，可以通过调用 `navigate()` 方法并传递动作的资源 ID 来触发导航动作。例如：\n\
  \n```java\ncontroller.navigate(R.id.goToList);\n```\n\n动作的 ID 在导航图的属性面板中定义。\n\n\
  ### 40.6 传递参数\n\n在导航动作期间，可以使用导航图内声明的参数将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在 XML\
  \ 中手动添加，也可以使用属性面板添加。在 图 40-6 中，声明了一个名为 `contactsCount` 的整数参数，其默认值为 0：\n\n![](img/jetpack_navigation_action.jpg)\n\
  \n图 40-6\n\n添加后，参数将放置在接收目的地的 XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"\
  @+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"contactsCount\"\n        android:defaultValue=\"\
  0\"\n        app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入\
  \ `Bundle` 对象中，在动作期间将其传递给目的地，然后在该处进行解包并提取参数。\n\n这种特定方法的主要缺点是它**不是类型安全的**（type safe）。换句话说，如果接收端目的地将参数处理为与声明不同的类型（例如将一个字符串视为整数），此错误将不会被编译器捕获，并可能在运行时引发问题。\n\
  \n一个更好的选择（也是本书中使用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它可以自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 参数传递方法将在下一章（“Jetpack 导航组件教程”）中进行描述和演示。\n\n## 40.7 总结\n\n在 Android 应用用户界面的语境下，“导航”（Navigation）指的是用户在不同屏幕之间来回的能力。曾经实现导航非常耗时且难以组织，现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更加简单。\n\n\n\n\n\n应用中的不同屏幕被称为目的地（destinations），通常由片段（fragments）或活动（activities）表示。所有应用都有一个主页（home\
  \ destination），包含应用首次加载时显示的屏幕。该布局的内容区域被一个导航宿主片段（navigation host fragment）替换，当用户导航应用时，该片段会切换为其他目的地片段。导航路径由导航图文件定义，该文件由目的地以及将它们连接在一起的动作（actions）以及在目的地之间传递的任何参数组成。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码内部启动导航动作的方法。\n\n# 41. Android Jetpack 导航组件教程\n\
  \n上一个章节描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航图表功能集成，从而为在 Android 应用屏幕之间实现导航提供了方便的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，利用这些导航功能来实现一个包含多个屏幕的示例应用。除此演示 Android Studio 导航图表编辑器的使用外，示例项目还将实现使用类型安全参数（type-safe\
  \ arguments）在源屏幕和目的地屏幕之间传递数据。\n\n## 41.1 创建 NavigationDemo 项目\n\n从欢迎屏幕选择 `New Project`\
  \ 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入\
  \ `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。\n\
  \n## 41.2 在构建配置中添加导航\n\n新的 Android Studio 项目默认不会在构建配置文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用层级的\
  \ `build.gradle` 文件。在项目工具窗口找到该文件（`Gradle Scripts -> build.gradle (Module: NavigationDemo.app)`），双击它将其加载到代码编辑器中，并修改\
  \ `dependencies` 部分以添加导航库。同时利用此机会启用此模块的视图绑定（view binding）：\n\n```gradle\nandroid\
  \ {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\ndependencies {\n\
  \    implementation 'androidx.navigation:navigation-fragment:2.5.2'\n    implementation\
  \ 'androidx.navigation:navigation-ui:2.5.2'\n}\n```\n\n注意，自本书出版以来，这些库可能已发布更新版本。在文件中添加导航依赖后，点击\
  \ `Sync Now` 链接以重新同步项目的构建配置。\n\n## 41.3 创建导航图资源文件\n\n在构建配置中添加导航库后，现在可以将导航图资源文件添加到项目中。正如\
  \ \"导航架构组件概述\" 中所示，这是一个 XML 文件，包含了用户可以导航的片段和活动，以及执行转换的动作和在目的地之间传递的任何数据。\n\n在 Project\
  \ 工具窗口中，找到 `res` 文件夹（`app -> res`），右键点击并选择 `New -> Android Resource File` 菜单选项：\n\
  \n![](img/as_3.2_navigation_new_resource_menu.jpg)\n图 41-1\n\n选择菜单项后，将出现 `New Resource\
  \ File` 对话框。对话框中，将文件命名为 `navigation_graph`，并在点击 `OK` 按钮创建文件之前，如图 41-2 所示，将 `Resource\
  \ type` 菜单更改为 `Navigation`\n\n![](img/as_3.2_navigation_new_resource_file.jpg)\n\
  图 41-2\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备添加新目的地。将编辑器切换到 `Code` 模式，并在添加任何目的地之前检查图的 XML：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n</navigation>\n```\n\n将编辑器切换回 `Design`\
  \ 模式，注意 `Destinations` 面板的 `Host` 部分指示项目内未检测到导航宿主片段：\n\n![](img/as_4.1_navigation_no_hosts.jpg)\n\
  图 41-3\n\n在向导航图添加任何目的地之前，下一步是向项目添加导航宿主片段。\n\n## 41.4 声明导航宿主\n\n对于此项目，导航宿主片段将包含在主活动的用户界面布局中。这意味着导航图中的目的地片段将出现在主活动当前由\
  \ `fragment_main.xml` 布局占据的内容区域。在 Project 工具窗口中找到主活动布局文件（`app -> res -> layout ->\
  \ activity_main.xml`）并将其加载到布局编辑器工具中。\n\n在布局编辑器的 `Design` 模式下，从 `Palette` 的 `Containers`\
  \ 部分拖出一个 `NavHostFragment` 元素，并将其放置到活动布局的容器区域，如图 41-4 中的箭头所示：\n\n![](img/as_3.6_add_navhostfragment.jpg)\n\
  图 41-4\n\n从弹出的 `Navigation` 对话框中，选择创建的 `navigation_graph` 文件并点击 `OK` 按钮。在布局中选中新添加的\
  \ `NavHostFragment`，使用 `Attributes` 窗口将元素的 `ID` 更改为 `demo_host_fragment`。\n\n将布局编辑器切换到\
  \ `Code` 模式并检查 XML。注意编辑器已正确配置 `navigation` 属性以引用 `navigation_graph` 文件，并且设置了 `defaultHost`\
  \ 属性：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/demo_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n在主活动布局文件中配置了宿主片段后，需要从 `MainActivity.java` 类中删除某些代码，以防止活动在运行时加载\
  \ `fragment_main.xml` 文件。将此文件加载到代码编辑器，找到 `onCreate()` 方法并删除显示主片段的代码：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commitNow();\n    }\n}\n```\n\n返回 `navigation_graph.xml`\
  \ 文件并确认已检测到 `NavHostFragment` 实例（可能需要关闭并重新打开文件才能显示更改）：\n\n![](img/as_navigation_host_added.jpg)\n\
  图 41-5\n\n## 41.5 添加导航目的地\n\n\n\n\n\n继续留在导航图中，现在是时候添加第一个目的地了。由于项目已经有一个第一个屏幕的片段（`fragment_main.xml`），这将是被添加到图中的第一个目的地。点击如图\
  \ 41-6 所示的新目的地按钮来选择或创建一个目的地：\n\n![](img/as_navigation_add_destination.jpg)\n图 41-6\n\
  \n选择 `fragment_main` 作为目的地，使其显示在导航图中：\n\n![](img/as_navigation_destination_added.jpg)\n\
  图 41-7\n\n此位于目的地节点上方的主页图标表示这是起始目的地。这意味着当包含 `NavHostFragment` 的 activity 被创建时，该目的地将是第一个显示的界面。要将起始目的地更改为另一个目的地，请在图中选择该节点并点击位于工具栏上的主页按钮。\n\
  \n通过将编辑器切换到 Code 模式来检查导航图的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少还需要一个目的地。这次，将使用导航图编辑器创建一个新的空白目的地。切换回 Design\
  \ 模式并再次点击 New Destination 按钮，这次从菜单中选择 Create new destination（创建新目的地）选项。在弹对话框中，选择\
  \ Fragment (Blank) 模板，将新片段命名为 `SecondFragment`，布局命名为 `fragment_second`，然后点击 Finish\
  \ 按钮。在项目重新构建的简短延迟后，新片段将作为另一个目的地出现在图中，如图 41-8 所示：\n\n![](img/as_3.2_navigation_second_destination.jpg)\n\
  图 41-8\n\n## 41.6 设计目的地片段布局\n\n在添加用于在目的地之间导航的动作之前，现在是为图中两个目的地片段添加一些用户界面组件的好时机。首先双击\
  \ `mainFragment` 目的地，使 `fragment_main.xml` 文件加载到布局编辑器中。选择并删除当前的 `TextView` 控件，然后将\
  \ `Button` 和 `Plain Text EditText` 控件拖到布局中，使其看起来像下方图 41-9 所示：\n\n![](img/as_4.1_navigation_demo_ui.jpg)\n\
  图 41-9\n\n一旦视图定位正确，点击工具栏上的 Infer constraints（推断约束）按钮为布局添加任何缺失的约束。选择 `EditText` 视图并使用\
  \ Attributes 工具窗口删除默认的“Name”文本，并将控件的 ID 更改为 `userText`。返回 `navigation_graph.xml`\
  \ 文件并双击 `secondFragment` 目的地将 `fragment_second.xml` 文件加载到布局编辑器，然后选择并删除默认的 `TextView`\
  \ 实例。在 Component Tree 面板中，右键点击 `FrameLayout` 条目并选择 `Convert from FrameLayout to\
  \ ConstraintLayout...` 菜单选项，接受生成的转换对话框中的默认设置：\n\n![](img/as_3.2_navigation_convert_framelayout.jpg)\n\
  图 41-10\n\n使用 Attributes 工具窗口将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`。由于片段的父级布局管理器已转换为更灵活的\
  \ `ConstraintLayout`，拖放一个新的 `TextView` 控件，使其位于布局中心，并点击 Infer constraints 按钮以添加任何缺失的约束。选中新的\
  \ `TextView` 后，使用 Attributes 面板将 ID 更改为 `argText`。\n\n## 41.7 为导航图添加动作\n\n现在两个目的地已经添加到图中，并且相应的用户界面布局也已设计，项目现在需要一种方法让用户能够从主片段导航到第二个片段。这将通过向图中添加动作来实现，然后可以在应用代码中引用该动作。\n\
  \n要建立一个以主片段为起点、第二个片段为目的地的动作连接，打开导航图并将鼠标指针悬停在 `mainFragment` 目的地右边缘的垂直中心，会出现一个高亮的圆圈，如图\
  \ 41-11 所示：\n\n![](img/as_4.1_navigation_connection_circle.jpg)\n图 41-11\n\n点击圆圈并将生成的线条拖动到\
  \ `secondFragment` 目的地：\n\n![](img/as_4.1_navigation_connecting.jpg)\n图 41-12\n\n\
  释放线条以建立起点和目的地之间的动作连接，此时线条将变为箭头，如图 41-13 所示：\n\n![](img/as_4.1_navigation_connected.jpg)\n\
  图 41-13\n\n随时可以通过选中它并按 Delete 键来删除动作。选中箭头后，在 Attributes 窗口中查看 ID 为 `mainToSecond`。这是代码中引用该动作的\
  \ ID：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\
  \n    app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n## 41.8 实现 OnFragmentInteractionListener\n\n在添加触发动作的代码之前，`MainActivity`\
  \ 类需要实现 `OnFragmentInteractionListener`。这是在导航编辑器中创建空白片段时在 `SecondFragment` 类中生成的接口。为了符合接口，activity\
  \ 需要实现 `onFragmentInteraction()` 方法，并用于片段与 activity 之间的通信。\n\n编辑 `MainActivity.java`\
  \ 文件，使其内容如下：\n\n```java\nimport android.net.Uri;\n\npublic class MainActivity extends\
  \ AppCompatActivity implements SecondFragment.OnFragmentInteractionListener {\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些版本会自动添加，而其他版本则不会），请编辑\
  \ `SecondFragment.java` 文件并如下添加：\n\n```java\nimport android.net.Uri;\n\npublic interface\
  \ OnFragmentInteractionListener {\n    // TODO: 更新参数类型和名称\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n```\n\n\n\n\n# 41.9 为目标 Fragment 添加视图绑定（View Binding）支持\n\n我们需要访问 fragment\
  \ 布局中的某些视图，我们需要修改当前代码以启用视图绑定支持。首先，编辑 `MainFragment.java` 文件并进行以下更改：\n\n```java\n\
  import com.ebookfrenzy.navigationdemo.databinding.FragmentMainBinding;\n\npublic\
  \ class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        // return inflater.inflate(R.layout.fragment_main, container, false);\n\
  \        binding = FragmentMainBinding.inflate(inflater, container, false);\n  \
  \      return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，这次引用 `FragmentSecondBinding`。\n\n## 41.10 触发动作\n\
  \n现在动作已添加到导航图中，下一步是在主 fragment 中添加一些代码，以便在点击 `Button` 控件时触发该动作。找到 `MainFragment.java`\
  \ 文件，将其加载到代码编辑器中并重写 `onViewCreated()` 方法以获取按钮实例的引用，并配置一个 `onClickListener` 实例，在用户点击按钮时调用：\n\
  \n```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        binding.button.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ view) {\n                Navigation.findNavController(view).navigate(R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n上述代码获取了导航控制器的引用并在该实例上调用 `navigate()`\
  \ 方法，将导航动作的资源 ID 作为参数传递。\n\n编译并运行应用，验证点击主 fragment 中的按钮是否跳转到第二个 fragment。\n\n作为这种设置监听器方法的替代，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目标。因此，可以使用以下单行代码来启动跳转：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(R.id.mainToSecond,\
  \ null));\n```\n\n## 41.11 使用 Safeargs 传递数据\n\n下一个目标是将主 fragment 中 `EditText` 视图中输入的文本传递到第二个\
  \ fragment，并在那里显示在 `TextView` 控件上。如前一章所述，Android Navigation 组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\
  \n使用 `safeargs` 的第一步是向 Gradle 构建配置添加 `safeargs` 插件。使用 Project 工具窗口，找到并编辑项目层级的 `build.gradle`\
  \ 文件（`Gradle Scripts -> build.gradle (Project: NavigationDemo)`），按如下方式添加插件依赖（再次记住，现在可能有更更新的版本）：\n\
  \n```gradle\n// 根级构建文件，可以在其中添加适用于所有子项目/模块的配置选项。\nbuildscript {\n    dependencies\
  \ {\n        classpath(\"androidx.navigation:navigation-safe-args-gradle-plugin:2.5.2\"\
  )\n    }\n}\n\nplugins {\n    id 'com.android.application' version '7.3.0' apply\
  \ false\n    id 'com.android.library' version '7.3.0' apply false\n}\n```\n\n接下来，编辑模块层级的\
  \ `build.gradle` 文件（`Gradle Scripts -> build.gradle (Module: App)`）按如下方式应用插件并重新同步项目：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n    id 'androidx.navigation.safeargs'\
  \ // 或 androidx.navigation.safeargs.kotlin\n}\n```\n\n下一步是定义目标将接收的任何参数。编辑导航图，选择\
  \ `secondFragment` 并找到 `Arguments` 部分。点击 `+` 按钮添加新参数：\n\n```xml\n<fragment\n   \
  \ android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \n        android:defaultValue=\"No Message\" />\n</fragment>\n```\n\n下一步是向 `MainFragment.java`\
  \ 添加代码，以从 `EditText` 提取文本并在导航动作期间将其传递给第二个 fragment。这将涉及使用一些由 `safeargs` 自动生成的特殊类。目前导航涉及\
  \ `MainFragment` 类、`SecondFragment` 类、一个名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\
  \n当构建项目时，`safeargs` 插件将生成以下额外的类，用于传递和接收导航参数：\n\n- `MainFragmentDirections`: 此类表示导航动作的起点（使用导航源的类名并加上\
  \ `Directions` 命名），并提供对动作对象的访问。\n- `ActionMainToSecond`: 该类代表执行跳转的动作（根据导航图中分配给动作的\
  \ ID 加上 `Action` 命名）。该类包含目标配置的每个参数的 setter 方法。例如，由于第二个 fragment 目标包含名为 `message`\
  \ 的参数，该类包含一个名为 `setMessage()` 的方法。配置完成后，将该类的实例传递给导航控制器的 `navigate()` 方法以导航到目标。\n\
  - `SecondFragmentArgs`: 用于目标 fragment 中访问从源点传递的参数的类（使用导航目标的类名并加上 `Args` 命名）。该类包含传递给目标的每个参数的\
  \ getter 方法（即 `getMessage()`）。\n\n使用这些类，可以对 `MainFragment.java` 文件中 `onViewCreated()`\
  \ 方法内的 `OnClickListener` 代码如下，以提取 `EditText` 控件中的当前文本，将其应用于动作并启动到第二个 fragment 的跳转：\n\
  \n```java\nbinding.button.setOnClickListener(view1 -> {\n    MainFragmentDirections.MainToSecond\
  \ action =\n            MainFragmentDirections.mainToSecond();\n    action.setMessage(binding.userText.getText().toString());\n\
  \    Navigation.findNavController(view1).navigate(action);\n});\n```\n\n\n\n\n\n\
  上述代码获取 action 对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航器的 `navigate()` 方法并传递 action\
  \ 对象。如果 Android Studio 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make Project`\
  \ 菜单选项重新构建项目以生成该类。\n\n剩下的工作是修改 `SecondFragment.java` 类文件，在导航执行后接收参数并在 `TextView`\
  \ 小部件上显示它。在本例中，将使用 `onStart()` 周期方法添加实现这些任务的代码。编辑 `SecondFragment.java` 文件并添加此方法，使其内容如下：\n\
  \n```java\n@Override\npublic void onStart() {\n    super.onStart();\n    SecondFragmentArgs\
  \ args = SecondFragmentArgs.fromBundle(getArguments());\n    String message = args.getMessage();\n\
  \    binding.argText.setText(message);\n}\n```\n\n上述方法中的代码首先获取 `TextView` 小部件的引用。接下来，调用\
  \ `SecondFragmentArgs` 类的 `fromBundle()` 方法来从源头提取 `SecondFragmentArgs` 对象。由于示例中的参数在\
  \ `navigation_graph.xml` 文件中命名为 `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法以获取字符串值。该字符串随后显示在\
  \ `TextView` 小部件上。\n\n编译并运行应用，在点击 `Button` 小部件之前输入一些文本。当第二个片段目标出现时，`TextView` 现在应该显示在主片段中输入的文本，这表明数据已在导航目的地之间成功传递。\n\
  \n## 41.12 总结\n\n本章提供了一个如何使用 Navigation 架构组件结合 Android Studio 导航图编辑器实现 Android 应用导航的实用示例。涵盖的主题包括创建包含现有和新新目标片段的导航图、在\
  \ Activity 布局中嵌入导航宿片段、编写触发导航事件的代码，以及使用 Gradle `safeargs` 插件在目的地之间传递参数。\n\n# 42.\
  \ MotionLayout 简介\n\n`MotionLayout` 类为给用户界面布局中的视图添加动画效果提供了一种简单的方法。本章将首先提供 `MotionLayout`\
  \ 的概述，并介绍 `MotionScenes`（场景）、`Transitions`（过渡）和 `Keyframes`（帧）的概念。在涵盖这些基础知识后，接下来的章节（标题为\
  \ \"Android MotionLayout 编辑器教程 和 \"MotionLayout KeyCycle 教程）将通过创建示例项目提供 `MotionLayout`\
  \ 动画的更多细节和示例。\n\n## 42.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是对布局内视图从一个状态到另一个状态的过渡进行动画处理。例如，`MotionLayout`\
  \ 可以在指定时间内动画 `ImageView` 实例从屏幕左上角到右下角的运动。除了视图的位置外，其他属性的变化也可以进行动画处理，例如颜色、大小或旋转角度。这些状态变化还可以进行插值处理（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循位于起点和终点之间不同位置的中间点的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全声明在 XML 中，通常不需要编写任何代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行可视化实现，或者结合这两种方法。\n\n## 42.2 MotionLayout\n\
  \n在实现动画时，通常用于用户界面的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（此任务可以通过右键点击布局编辑器中的\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单来实现）。`MotionLayout` 还需要至少 2.0.0\
  \ 版本的 `ConstraintLayout` 库。\n\n由于它是 `ConstraintLayout` 的子类，并不意外 `MotionLayout` 支持\
  \ `ConstraintLayout` 的所有布局功能。因此，在使用 `MotionLayout` 设计任何不需要动画的视图时，其方式完全相同。\n\n对于需要进行动画的视图，声明了两个\
  \ `ConstraintSets` 来定义视图在动画开始和结束时的外观和位置。`transition` 声明定义了关键帧，用于在这些结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理器。\n\
  \n起始和结束的 `ConstraintSets` 以及 `transitions` 都声明在 `MotionScene` XML 文件中。\n\n## 42.3\
  \ MotionScene\n\n正如我们在前面的章节中看到的，XML 布局文件包含了配置呈现给用户的静态视图的外观和布局行为所需的信息，在使用 `MotionLayout`\
  \ 时也是如此。对于非静态视图（即将进行动画处理的视图），这些视图仍然声明在布局文件中，但与这些视图相关的起始、结束和过渡声明存储在一个单独的 XML 文件中，称为\
  \ `MotionScene`（之所以这样做是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入到布局 XML 文件中，包含起始和结束的\
  \ `ConstraintSets` 以及 `Transition` 声明（单个文件可以包含多个 `ConstraintSet` 对，针对用户界面布局中的特定视图）。\n\
  \n以下列表显示了 `MotionScene` 文件的模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上述 XML 中，声明了名为 `start` 和 `end`（尽管可以使用任何名称）的 `ConstraintSets`，目前尚未包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画起始和结束点，并包含一个空的 `KeyFrameSet` 元素，准备填充额外的动画关键帧。`Transition`\
  \ 元素还包含一个毫秒 `duration` 属性来控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的运动。例如，可以让起始和结束声明屏幕上的相同位置，然后使用过渡动画其他属性的变化，例如缩放和旋转角度。\n\
  \n### 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将完整的 `ConstraintLayout`\
  \ 设置应用于视图（在定位、尺寸以及与父布局和其他视图的关系方面）。此外，以下属性也可以包含在 `ConstraintSet` 声明中：\n\n- alpha\n\
  - visibility\n- elevation\n- rotation\n- rotationX\n- rotationY\n- translationX\n\
  - translationY\n- translationZ\n- scaleX\n- scaleY\n\n\n\n\n例如，为了在动画期间将视图旋转 180°，可以在起始和结束约束中声明如下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        .\n\
  \        .\n        motion:layout_constraintStart_toStartOf=\"parent\"\n       \
  \ android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet\
  \ android:id=\"@+id/end\">\n    <Constraint\n        .\n        .\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图将从 0° 开始，并在动画过程中旋转完整的 180°，最后以倒置状态停止。\n\n## 42.5\
  \ 自定义属性\n\n除了上述列出的标准属性外，还可以指定范围内的自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上提供的几乎任何属性都可以指定为自定义属性，以便包含在动画中。要识别属性的名称，请从目标视图类的文档中找到\
  \ getter/setter 名称，移除 get/set 前缀并将剩余字符的首字母转换为小写。例如，在代码中更改 `Button` 视图的背景颜色，我们可能如下调用\
  \ `setBackgroundColor()` setter 方法：\n\n```java\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束集或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下选项列表中的相应类型声明值：\n\n\
  - `motion:customBoolean` - 布尔属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension`\
  \ - 维度属性值。\n- `motion:customFloatValue` - 浮点型属性值。\n- `motion:customIntegerValue`\
  \ - 整数属性值。\n- `motion:customStringValue` - 字符串属性值\n\n例如，颜色设置将需要使用 `customColorValue`\
  \ 类型赋值：\n\n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\
  \n    motion:customColorValue=\"#43CC76\" />\n```\n\n例如，以下 `MotionScene` 文件的节选除了将背景颜色从绿色改为红色外，还为视图声明了起始和结束约束：\n\
  \n```xml\n.\n.\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n   \
  \     android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\
  \n        motion:layout_editor_absoluteX=\"21dp\"\n        android:id=\"@+id/button\"\
  \n        motion:layout_constraintTop_toTopOf=\"parent\"\n        motion:layout_constraintStart_toStartOf=\"\
  parent\" >\n        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\
  \n            motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  .\n```\n\n\n## 42.6 触发动画\n\n如果没有某种形式的事件告诉 `MotionLayout` 开始动画，则 `MotionScene` 文件中的任何设置都不会产生影响（视图将根据\
  \ `ConstraintSet` 进行定位除外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动（`OnSwipe`）手势启动。`OnClick`\
  \ 处理器会导致动画开始并运行到完成，而 `OnSwipe` 则将同步动画，使其沿时间轴线反复移动。`OnSwipe` 处理器还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了配置选项，用于设置动画如何对不同方向的拖动做出，以及滑动动作锚定在目标视图的哪一边。这允许例如向左的运动移动视图，同时防止向上运动导致视图侧向移动（除非这确实是需要的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 包含在 `MotionScene` 文件的 `Transition` 元素中。在两种情况下，必须指定视图 ID。例如，要实现一个响应于锚定在名为\
  \ `button` 的视图底部边缘的向下拖动的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition` 元素中：\n\n```xml\n\
  .\n.\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n.\n```\n\
  \n或者，为同一个按钮添加 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\n\
  \    motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已设置为 `toggle` 模式。这种模式和其他可用选项可以总结如下：\n\
  \n- `toggle` - 动画到相反状态。例如，如果视图当前处于过渡起点，它将过渡到终点，反之亦然。\n- `jumpToStart` - 立即更改到起始状态，无动画。\n\
  - `jumpToEnd` - 立即更改到结束状态，无动画。\n- `transitionToStart` - 带有动画过渡到起始状态。\n- `transitionToEnd`\
  \ - 带有动画过渡到结束状态。\n\n## 42.7 弧形运动\n\n默认情况下，视图位置的移动将在起点和终点之间沿直线。要将运动更改为弧形路径，只需在起始约束中使用如下\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧是凹形还是凸形：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" />\n</ConstraintSet>\n```\n\n[图 42-1] 展示了 `startVertical` 和 `startHorizontal`\
  \ 弧与默认直线运动的对比：\n\n![](img/motionlayout_arc_three.jpg)\n\n图 42-1\n\n## 42.8 关键帧\n\
  \n为止概述的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。也就是说，如果 `rotation` 属性在终点被设置为 180°，则旋转将在动画开始时开始并在到达终点时完成。因此，无法配置旋转在动画进行\
  \ 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，这种效果可以使用关键帧（Keyframes）实现。\n\n关键帧用于定义动画期间状态变化的中间点。例如，可以声明关键帧，使视图的背景颜色在动画进行\
  \ 50% 处过渡到蓝色，在 75% 处变为绿色，并在动画结束时回到原始颜色。关键帧在 `MotionScene` 文件的 `Transition` 元素内部实现，嵌入在\
  \ `KeyFrameSet` 元素中。\n\nMotionLayout 支持多种关键帧，总结如下：\n\n### 42.8.1 属性关键帧\n\n\n\n\n\
  \n# 属性关键帧\n\n关键帧（使用 `KeyAttribute` ）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持上述 `ConstraintSets`\
  \ 列出的相同属性集，并允许指定更改在动画时间轴的何处生效。例如，以下关键帧声明将导致按钮视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大，并在时间轴\
  \ 50% 处达到完全尺寸。在时间轴的剩余时间内，视图将尺寸缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n</Transition>\n```\n\n### 42.8.2 位置关键帧\n\n位置关键帧（`KeyPosition`\
  \ ）用于修改视图在起始和结束位置之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用几乎任何复杂程度的路径。位置使用 `x` 和 `y`\
  \ 坐标结合过渡时间轴中的对应点进行声明。这些坐标必须相对于以下坐标系之一声明：\n\n- `parentRelative`：`x` 和 `y` 坐标相对于坐标所在的父容器，坐标以百分比表示（表示为\
  \ 0.0 到 1.0 之间的值）：\n  ![](img/motionlayout_parentRelative.jpg)\n  图 42-2\n\n- `deltaRelative`：`x`\
  \ 和 `y` 坐标不是相对于父容器，而是相对于起始和结束位置。例如，起点为 (0, 0)，终点为 (1, 1)。请记住 `x` 和 `y` 坐标可以是负值：\n\
  \  ![](img/motionlayout_deltaRelative.jpg)\n  图 42-3\n\n- `pathRelative`：`x` 和 `y`\
  \ 坐标相对于路径，其中起点和终点之间的直线作为图表的 X 轴。同样，坐标以百分比表示（0.0 到 1.0）。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。同样，坐标可以是负值：\n\
  \  ![](img/motionlayout_pathRelative.jpg)\n  图 42-4\n\n例如，以下 `ConstraintSets` 在设备屏幕的两侧声明了起始点和终点。默认情况下，使用这些点的视图过渡将将如图\
  \ 42-5 所示所示跨越屏幕的直线移动：\n  ![](img/motionlayout_straight_path.jpg)\n  图 42-5\n\n然而，假设视图需要遵循下方图\
  \ 42-6 所示的类似路径：\n  ![](img/motionlayout_wave_path.jpg)\n  图 42-6\n\n为了实现这一点，可以在过渡中如下声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置放置在坐标 (0.25, 0.3)，第二个放置在 (0.75, -0.3)。这些位置关键帧可以如下方图\
  \ 42-7 所示可视化：\n  ![](img/motionlayout_curve_path.jpg)\n  图 42-7\n\n## 42.9 时间线性\n\
  \n在没有任何额外设置的情况下，上述动画将以恒定速度执行。要更改动画的速度（例如使其加速和减速），可以在 `ConstraintSet` 中使用 `transitionEasing`\
  \ 属性。\n\n对于复杂需求，可以通过在贝塞尔曲线上绘制点来定义线性度，例如：\n```xml\ntransitionEasing=\"cubic(0.2,\
  \ 0.3, 0.7, 1)\"\n```\n\n如果您不熟悉贝塞尔曲线，可以考虑 [cubic-bezier.com](https://cubic-bezier.com/)\
  \ 上的在线生成器。然而，对于大多数需求，可以使用内置值指定淡动效果：\n```xml\ntransitionEasing=\"accelerate\"\ntransitionEasing=\"\
  decelerate\"\n```\n\n## 42.10 KeyTrigger\n\n`KeyTrigger` 允许在动画到达指定位置时调用视图上的方法。这考虑了动画的方向。例如，根据动画是向前还是向后运行，调用不同的方法。考虑当动画移动时间轴的\
  \ 20% 以上时使按钮可见。`KeyTrigger` 在 `FrameSet` 中使用 `onCross` 属性实现：\n\n```xml\n<KeyTrigger\n\
  \    motion:framePosition=\"20\"\n    motion:onCross=\"show\"\n```\n\n同样，如果动画在反向运行并下降到\
  \ 10% 以下，可以添加第二个关键触发器：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"10\"\n\
  \    motion:onCross=\"hide\"\n```\n\n如果动画使用切换操作，只需使用 `onCross` 属性：\n\n```xml\n<KeyTrigger\n\
  \    motion:framePosition=\"20\"\n    motion:onCross=\"toggle\"\n```\n\n## 42.11\
  \ 循环和时间循环关键帧\n\n虽然位置关键帧可以用于向动画添加中间状态，但如果需要实现大量的重复位置更改，将变得非常复杂。对于需要重复执行预测状态更改的情况，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧，该主题将在 MotionLayout KeyCycle Tutorial 中详细介绍。\n\n\
  ## 42.12 从代码启动到为止，本节只查看了使用 `OnSwipe` 和 `OnClick` 处理程序控制动画。也可以通过调用 `MotionLayout`\
  \ 实例上的方法从代码启动动画。例如，以下代码为名为 `motionLayout` 的布局以 2000ms 的持续时间从开始过渡到结束：\n\n```java\n\
  motionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n```\n\
  \n在没有额外设置的情况下，动画使用的起始和结束状态将是 `MotionScene` 文件中 `Transition` 声明的那些。要使用特定的起始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法通过 id 引用它们：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n要在动画运行时监控状态，如下所示为 `MotionLayout` 实例添加过渡监听器：\n\
  \n```java\nmotionLayout.setTransitionListener(transitionListener);\nMotionLayout.TransitionListener\
  \ transitionListener = new MotionLayout.TransitionListener() {\n```\n\n\n\n\n```java\n\
  @Override\npublic void onTransitionStarted(MotionLayout motionLayout, int startId,\
  \ int endId) {\n    // 当过渡开始时调用\n}\n\n@Override\npublic void onTransitionChange(MotionLayout\
  \ motionLayout, int startId, int endId, float progress) {\n    // 每次属性变化时调用。通过跟踪进度值来查找\n\
  \    // 当前位置\n}\n\n@Override\npublic void onTransitionCompleted(MotionLayout motionLayout,\
  \ int currentId) {\n    // 当过渡完成时调用\n}\n\n@Override\npublic void onTransitionTrigger(MotionLayout\
  \ motionLayout, int triggerId, boolean positive, float progress) {\n    // 当跨越触发关键帧阈值时调用\n\
  }\n```\n\n## 42.13 总结\n\n`MotionLayout` 是 `ConstraintLayout` 的子类，专门用于为用户界面布局中的视图添加动画效果。`MotionLayout`\
  \ 的工作原理是通过动画视图在由起始和结束约束集（constraint sets）定义的两个状态之间的过渡来实现。通过利用关键帧（keyframes），可以在这些起始和结束点之间添加额外的动画效果。\n\
  \n动画可以通过 `OnClick` 或 `OnSwipe` 处理器触发，也可以通过对 `MotionLayout` 实例的方法调用进行编程触发。\n\n# 43.\
  \ Android MotionLayout 编辑器教程\n\n既然已经介绍了 `MotionLayout` 的基础知识，本章将提供在示例项目中尝试 `MotionLayout`\
  \ 的机会。除了继续探索 `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout` 编辑器并探索如何使用它可视化地构建和修改 `MotionLayout`\
  \ 动画。\n\n在本章创建的项目将使用起始和结束 `ConstraintSets`、手势处理器以及属性（AttributeAttribute）和位置关键帧（Position\
  \ Keyframes）。\n\n## 43.1 创建 MotionLayoutDemo 项目\n\n点击欢迎界面上的 `New Project` 按钮，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `MotionLayoutDemo`，并指定 `com.ebookfrenzy.motionlayoutdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n## 43.2 ConstraintLayout 到 MotionLayout 的转换\n\n按照惯例，Android\
  \ Studio 会在 `activity_main.xml` 布局文件中放置一个 `ConstraintLayout` 容器作为父视图。下一步是将该容器转换为\
  \ `MotionLayout` 实例。在 `Component Tree` 中，右键点击 `ConstraintLayout` 条目并选择 `Convert\
  \ to MotionLayout` 菜单选项：\n\n![](img/as_4.0_motionlayout_conversion.jpg)\n\n图 43-1\n\
  \n做出选择后，点击确认对话框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android Studio 主窗口中，如[图\
  \ 43-2] 所示。\n\n![](img/as_4.0_motionlayout_editor.jpg)\n\n图 43-2\n\n作为转换过程的一部分，Android\
  \ Studio 还会创建一个名为 `res -> xml` 的新文件夹，并在其中放置一个名为 `activity_main_scene.xml` 的 `MotionLayout`\
  \ 场景文件：\n\n![](img/as_4.0_motionlayout_scene_file.jpg)\n\n图 43-3\n\n该文件包含一个顶层 `MotionScene`\
  \ 元素，其中包含 `ConstraintSet` 和 `Transition` 条目，这些条目定义了要在主布局中执行的动画。默认情况下，文件将包含起始和结束约束集的空元素以及初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrame />\n    </Transition>\n\
  \    <ConstraintSet android:id=\"@+id/start\"></ConstraintSet>\n    <ConstraintSet\
  \ android:id=\"@+id/end\"></ConstraintSet>\n</MotionScene>\n```\n\n对 `MotionLayout`\
  \ 编辑器进行的任何更改都将存储在此文件中。随着本章的不断进行，你会发现 `MotionScene` 的语法实际上非常简单。\n\n## 43.3 配置起始和结束约束\n\
  \n加载 `activity_main.xml` 文件后，确保选中了 `MotionLayout` 框。因此，实现动画的第一步是指定定义这些状态的约束。对于此示例，起始点将是布局的顶部中央。\n\
  \n使用 `MotionLayout` 编辑器，删除默认的 `TextView`，然后从调色板拖入一个 `Button` 到布局的左上角。\n\n![](img/as_4.1_motionlayout_added.jpg)\n\
  \n图 43-4\n\n起始约束集需要将按钮置在布局顶部，带有 `8dp` 的偏移量并水平居中。在选中 `myButton` 的情况下，使用 `Attributes`\
  \ 窗口为视图的顶部、左侧和右侧设置约束如下：\n\n![](img/as_4.0_motionlayout_start.jpg)\n\n图 43-5\n\n\
  选择结束约束集并重复这些步骤创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 `8dp` 的偏移：\n\n![](img/as_4.0_motionlayout_end.jpg)\n\
  \n图 43-6\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件，并这些约束已添加到文件中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_constraintTop_toTopOf=\"parent\"\n            android:layout_left_toLeftOf=\"\
  parent\"\n            android:layout_right_toRightOf=\"parent\"\n            android:layout_marginTop=\"\
  8dp\" />\n    </ConstraintSet>\n    <ConstraintSet android:id=\"@+id/end\">\n  \
  \      <Constraint\n            android:id=\"@+id/myButton\"\n            android:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            android:layout_left_toLeftOf=\"parent\"\n            android:layout_right_toRightOf=\"\
  parent\"\n            android:layout_marginBottom=\"8dp\" />\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n\n\n\n```xml\n            android:layout_width=\"wrap_content\"\
  \n            android:layout_height=\"wrap_content\"\n            motion:layout_constraintTop_toTopOf=\"\
  parent\"\n            android:layout_marginTop=\"8dp\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_editor_absoluteY=\"\
  6dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            android:layout_marginBottom=\"8dp\" />\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n请注意，`Transition` 元素已经预配置，将在 1000 毫秒内执行起始点和结束点之间的过渡动画。尽管我们尚未添加触发过渡的动作，但仍然可以在\
  \ MotionLayout 编辑器中预览该动画。\n\n### 43.4 预览 MotionLayout 动画\n\n要在不构建和运行 App 的情况下预览动画，请在\
  \ MotionLayout 编辑器中选择下方[图 43-9] 中标记为 A 的过渡箭头。这将显示动画时间轴面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  \n图 43-9\n\n要测试动画，请点击滑块 (C) 并沿着时间轴拖动它。随着滑块的移动，布局画布中的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮 (E)\
  \ 可以执行完整动画，或以不同的速度连续重复动画（向前、向后或来回切换）。\n\n### 43.5 添加 OnClick 点击手势\n\n虽然我们已经创建了一个简单的\
  \ MotionLayout 动画过渡，但我们仍然需要一种方法在运行的 App 内部启动动画。这可以通过分配点击或滑动处理程序来实现。在本例中，我们将配置在用户点击按钮时启动动画。在\
  \ MotionLayout 编辑器中，首先如果时间轴动画正在循环运行，请先将其暂停。接下来，选择过渡箭头（在上方[图 43-9] 中标记为 A），在属性工具窗口中找到\
  \ `OnClick` 属性部分，并点击下方[图 43-10] 中箭头指示的 + 号：\n\n![](img/as_4.0_motionlayout_onclick_add.jpg)\n\
  \n图 43-10\n\n`OnClick` 面板中会出现一个第一个属性的空行。对于属性名称，输入 `targetId`，在值字段中输入按钮的 ID `@id/myButton`。再次点击\
  \ + 号，这次在属性名称字段中输入 `app:clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n![](img/as_4.0_motionlayout_onclick_actions.jpg)\n\
  \n图 43-11\n\n对于此例，选择切换操作（toggle action）。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与[图 43-12]\
  \ 中所示的内容相匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 43-12\n\n再次打开\
  \ `activity_main_scene.xml` 文件并检查 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n\
  \    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        <OnClick\
  \ motion:targetId=\"@id/myButton\"\n            motion:clickAction=\"toggle\" />\n\
  \    </Transition>\n```\n\n在设备或模拟器上编译并运行 App，并确认点击按钮会导致它在 MotionScene 中定义的起始点和结束点之间来回切换。\n\
  \n### 43.6 为过渡添加属性关键帧\n\n到为止，示例仅演示了按钮视图从一个位置移动到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，可以指定时间轴内的点，使其他属性的变化在该处生效。例如，可以定义一个\
  \ `KeyAttribute`，使得视图在移动到时间轴 30% 时，其尺寸必须增加了 50%。在本例中，我们将在动画的中点处添加一个旋转效果。\n\n首先在\
  \ MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接器显示时间轴，然后点击图 43-13 中高亮的按钮：\n\n\
  ![](img/as_4.0_motionlayout_timeline_add_button.jpg)\n\n图 43-13\n\n从菜单中选择 `KeyAttribute`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_menu.jpg)\n\n图 43-14\n\n选择后，将出现[图\
  \ 43-15]所示的对话框。在对话框中，确保选择了 ID 选项并引用了 `myButton`。在位置 字段中，输入 50（以百分比形式指定，0 是起点，100\
  \ 是终点）。最后在点击 Add 按钮之前，从属性下拉菜单中选择旋转（rotation）项：\n\n![](img/as_4.0_motionlayout_timeline_key_dialog.jpg)\n\
  \n图 43-15\n\n一旦添加了 `KeyAttribute`，时间轴中会出现该属性行。点击该行将其高亮，然后点击行左侧的展开箭头以展开属性过渡。注意时间轴上出现了一个小菱形标记（如[图\
  \ 43-16]所示），指示关键帧的位置。图表显示了效果的线性。在这种情况下，按钮将稳稳地旋转到指定的角度，并在关键帧位置达到最大旋转。在到达终点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请时间轴上选择它，然后参考属性工具窗口。在 `KeyAttribute` 面板中，将 `rotation` 属性更改为 360 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\
  \n图 43-17\n\n通过拖动滑块并观察按钮在遍历画布动画路径时的旋转来检查属性是否有效。参考 `activity_main_scene.xml` 文件，它现在应该如下：\n\
  \n```xml\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n      \
  \  motion:constraintSetStart=\"@id/start\"\n        motion:duration=\"1000\">\n\
  \        <KeyFrameSet>\n            <KeyAttribute\n                motion:motionTarget=\"\
  @+id/myButton\"\n                motion:framePosition=\"50\"\n                android:rotation=\"\
  360\" />\n        </KeyFrameSet>\n        <OnClick motion:targetId=\"@+id/myButton\"\
  \n            motion:clickAction=\"toggle\" />\n    </Transition>\n```\n\n使用过渡滑块或通过编译并运行\
  \ App 来测试动画，验证按钮现在在动画期间会旋转。\n\n### 43.7 为过渡添加自定义属性\n\n\n\n\n`KeyAttribute` 属性仅限于缩放和旋转等内置效果。通过声明\
  \ `CustomAttributes`（自定义属性）也可以实现额外的更改。与存储在 `Transition` 元素中的 `KeyAttributes` 不同，`CustomAttributes`\
  \ 位于起始和结束约束集（constraint sets）。因此，这些属性只能声明为在起始和结束点生效（句话句话，你无法在过渡时间轴的中间位置指定属性帧）。\n\
  \n在本示例中，我们将配置按钮使其颜色从红色逐渐变为绿色。首先，选择图 43-18 中标记为 `A` 的起始框，然后选择 `myButton` 视图约束集 (B)：\n\
  \n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\n图 43-18\n\n参考 `Attributes`\
  \ 属性窗口，点击下文所示 `CustomAttributes` 区域的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  \n图 43-19\n\n在弹出的对话框（图 43-20）中，将属性类型更改为 `Color`，并在 `Attribute Name` 字段输入 `backgroundColor`。最后，将值设置为\
  \ `#F80A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 43-20\n\n\
  点击 `OK` 更改，然后选择上方图 43-18 中标记为 `C` 的结束约束集，并重复上述步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB\
  \ 值。\n\n使用时间轴滑块或运行应用程序，确保按钮在动画期间更改了颜色。\n\n这些 `CustomAttributes` 的添加将如下所示反映在 `activity_main_scene.xml`\
  \ 文件中：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint>\n\
  \        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n\
  \            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n### 43.8 添加位置帧\n\n本教程的最后一个任务是向动画路径添加两个位置帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ MotionLayout 编辑器中显示过渡时间轴的情况下，点击按钮如上方图 43-13 所示创建一个关键帧，并从下文图 43-21 所示的菜单中选择 `KeyPosition`\
  \ ：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\n图 43-21\n\n在弹出的对话框中，按照图\
  \ 43-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n\n图 43-22\n\n\
  点击 `Add` 按钮提交更改，然后重复上述步骤添加第二个配置如下的位置帧：\n\n- Position: 75\n- Type: `parentRelative`\n\
  - PercentX: 0.85\n- PercentY: 0.75\n\n在完成这些更改后，`activity_main_scene.xml` 文件中的 `transition`\
  \ 元素将添加以下关键帧项：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"25\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.15\"\n        motion:percentY=\"0.25\"\
  \ />\n    <KeyPosition\n        motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"\
  75\"\n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.85\"\n        motion:percentY=\"0.75\" />\n</KeyFrameSet>\n```\n\n最后测试一次应用程序，验证按钮现在在遵循下方所示路径的同时，仍在旋转并改变颜色：\n\
  \n![](img/as_4.0_motionlayout_zig_zag.jpg)\n\n图 43-23\n\n位置帧由如图 43-24 所示，预览画布中表示运动路径的虚线上的菱形标记表示：\n\
  \n![](img/as_4.0_motionlayout_position_markers.jpg)\n\n图 24\n\n要从视觉上调整关键帧的位置，只需点击标记并将其拖到新位置：\n\
  \n![](img/as_4.0_motionlayout_position_drag.jpg)\n\n图 25\n\n## 43.9 总结\n\n本章介绍了\
  \ MotionLayout，并探索了如何将其用于用户界面。本章涵盖的示例包括 `ConstraintLayout` 转换为 `MotionLayout`、起始和结束约束集的创建以及\
  \ `CustomAttributes` 的添加。\n\n### 44 MotionLayout KeyCycle\n\n之前的章节介绍并演示了如何使用 MotionLayout\
  \ 将动画集成到用户界面。MotionLayout 简介 简要提到了循环（`Cycle`）和时间循环（`TimeCycle`）帧，并解释了如何使用它们来实现动画。\n\
  \n本章将详细介绍循环帧，并在示例中演示如何使用它们。\n\n### 44.1 循环帧概述\n\n显然，位置帧可以用于添加中间状态变化。虽然这对于少量状态变化效果良好，但在数量较大时会非常繁琐。例如，为了让按钮在点击时抖动\
  \ 50 次以指示错误，需要手动创建 100 个位置帧。同样，在视图跨屏幕时实现弹跳效果也是耗时的任务。\n\n对于需要重复执行状态更改的情况，MotionLayout\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧。两者执行相同的任务，区别在于 `KeyCycle` 帧基于帧位置，而 `TimeCycles`\
  \ 基于时间（每秒循环）。\n\n使用这些循环帧，动画时间轴本质上被分为子部分（循环），每个子部分包含一个或多个波形，定义了在时间范围内如何修改属性。创建 `KeyCycle`\
  \ 需要以下信息：\n\n- target view: 要更改的视图 ID。\n- frame position: 循环开始的时间轴位置。\n- wave period:\
  \ 循环中包含的波形数量。\n- attribute: 被波形修改的视图属性。\n- wave offset: 按指定量从关键帧基准线偏移循环。\n- wave\
  \ shape: 波形的形状（sin、余、锯齿、方波、三角形、弹性或反锯齿）。\n\n考虑以下循环帧集：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyCycle\n        motion:framePosition=\"0\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"/>\n    <KeyCycle\n```\n\n\n\n\n```xml\nmotion:framePosition=\"\
  25\"\nmotion:motionTarget=\"@+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"\
  0dp\"\nmotion:waveShape=\"sin\"\nandroid:translationY=\"50dp\"/>\n```\n\n```xml\n\
  <KeyCycle\n    motion:framePosition=\"50\"\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"50dp\"/>\n<KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  50dp\"/>\n<KeyCycle\n    motion:framePosition=\"100\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"50dp\"/>\n</KeyFrameSet>\n```\n\n上述关键帧集将时间线划分为四个等周期。每个周期都配置为包含一个\
  \ `sin` 波形形状，该形状会将按钮的 `translationY` 属性调整 50dp。执行时，此动画将导致按钮在指定范围内进行多次垂直振荡。该关键帧集的可视化结果如\
  \ 图 44-1 所示，其中五个圆点代表了关键帧的位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n\n图 44-1\n\
  \n按照目前的实现方式，每个周期包含一个波形。假设我们需要的不是均匀分布的波形，而是在最后一个周期内需要四个波形。可以通过如下增加最后一个 `KeyCycle`\
  \ 元素的 `wavePeriod` 属性轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"75\"\
  \n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\n\
  做出此更改后，帧集可以按如下波形形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\n图 44-2\n\
  \n到目前，本章的示例一直使用 `sin` 波形。事实上，在 MotionLayout 中处理循环关键帧（cycle key frames）时，可以使用许多不同的波形。例如，图\
  \ 44-3 展示了将所有循环关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  \n图 44-3\n\n除了 `sin` 和 `sawtooth` 之外，MotionLayout 还支持 `triangle`、`square`、`bounce`\
  \ 和 `reverseSawtooth` 波形。\n\n在上面的示例中，每个周期都沿 Y 轴在相同范围内移动按钮。然而，假设我们需要第二个周期沿 Y 轴正方向移动按钮的距离更大。这涉及如下所示对第二个周期的\
  \ `waveOffset` 属性进行调整：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\n \
  \   motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\
  \n通过此此更改，我们得到了一个类似于 图 44-4 的时间线：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\
  \n图 44-4\n\n现在，在第二个周期期间，按钮在 Y 轴上的范围大约在 0 到 150dp 之间。如果我们仍然需要范围的低端与其他波形相匹配，我们自然需要为\
  \ `translationY` 值加上 100dp：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\
  \n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"/>\n```\n\
  \n此更改现在为我们提供了以下波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\n图 44-5\n\
  \n## 44.2 使用循环编辑器 (Cycle Editor)\n\n虽然不是特别复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle`\
  \ 条目来获取所需的精确循环配置可能会花费一些时间。考虑到这一点，Google 的 Android 工程师开发了 `Cycle Editor`。这是一个独立的基于\
  \ Java 的工具，尚未包含在 Android Studio 中。`Cycle Editor` 允许你可视化地设计和测试循环帧集。\n\n`Cycle Editor`\
  \ 工具以 Java 归档文件（`.jar`）的形式提供，这需要在你的开发系统中安装 Java 运行时。安装 Java 的步骤取决于你的操作系统。\n\n一旦你安装了\
  \ Java，可以从以下 URL 下载 `CycleEditor.jar` 文件：https://github.com/googlesamples/android-ConstraintLayoutExamples/download/CycleEditor.jar\n\
  \n下载完成后，打开命令提示符或终端，切换到 jar 文件所在的目录并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将显示如 图 44-6 所示的界面：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n\
  上述图中图中标记为 A 的面板显示了关键帧集的 XML，可以使用面板 B 中的控件进行编辑。面板 C 显示了波形形式的循环。遗憾的是，更改时不会实时重绘。你需要通过选择\
  \ `File -> Parse XML` 选项来刷新。点击面板 B 中的播放按钮，标记为 D 的面板将显示动画的渲染。`Examples` 菜单提供了示例帧集的集合，可以作为你动画的基础。\n\
  \n为了演示关键帧和循环编辑器的用法，本章剩余部分将创建一个实现循环动画的示例项目。\n\n## 44.3 创建 CycleDemo 项目\n\n在欢迎界面选择\
  \ `New Project` 选项，并在新建项目对话框中选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name`\
  \ 字段中输入 `CycleDemo`，并指定 `com.ebookfren.keycycledemo` 为包名。在点击 `Finish` 按钮之前，将最低 API\
  \ 级别设置为 `API 26: Android 8.0 (Oreo)`并将 `Language` 菜单设置为 `Java`。\n\n## 44.4 配置开始和结束约束\n\
  \n本教程的目标是制作按钮从屏幕一侧移动到另一侧的动画，包括视图沿 Y 轴上下移动的循环效果。第一步是配置开始和结束约束。\n\n用 MotionLayout\
  \ 编辑器加载 `activity_main.xml` 文件，选择并删除默认的 `TextView` 控件。在从调色板拖放 `Button` 视图之前，确保已选中下方\
  \ 图 44-9（标记为 E）的 Motion Layout 框，将其放置使其在垂直方向上居中并位于布局画布的左边缘：\n\n![](img/as_4.1_keycycledemo_button_added.jpg)\n\
  \n图 44-8\n\n要配置起始点的约束，选择编辑器窗口中的起始约束集条目（如 图 44-9 中标记为 A 处）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  \n图 44-9\n\n\n\n\n接下来，在 `ConstraintSet` 列表中选择按钮项 (B)。在按钮项仍处于选中状态时，点击编辑按钮 (C) 并从菜单中选择\
  \ `Create Constraint`（创建约束）。\n\n在保持按钮选中状态的情况下，使用 `Attributes` 工具窗口对视图的顶部、左侧和底部设置约束，如下所示：\n\
  \n![](img/as_4.0_keycycle_start_constraint.jpg)\n\n图 44-10\n\n选择结束约束集项（在下方的图 44-9\
  \ 中标记为 D），并重复步骤以创建一个新的约束，这次对按钮的顶部、底部和右侧边缘设置约束：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  \n图 44-11\n\n## 44.5 创建循环 (Cycles)\n\n下一步是使用 `Cycle Editor`（循环编辑器）为动画生成循环关键帧。在 `Cycle\
  \ Editor` 运行时，请参考下方的图 44-12 所示的控制面板：\n\n![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n\
  \n图 44-12\n\n使用标记为 A 的菜单，将要修改的属性从 `rotation`（旋转）更改为 `translationY`（垂直偏移）。\n\n接下来，使用\
  \ `KeyCycle` 控制 (B) 选择 `cycle 0`，这样对面板其他部分的更改将应用于第一个循环。将 `Period`（周期）滑动块移动到 `1`，将\
  \ translationY 滑动块移动到 `60`，如图 44-13 所示（在移动滑动块时，参考 XML 面板查看 `translationY` 值的精确设置）：\n\
  \n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n\n图 44-13\n\n为了在图中查看目前为止的变化，选择\
  \ `File -> Parse XML`（文件 -> 解析 XML）菜单选项。使用表 44-1 中列出的值，配置 `KeyFrames 1` 到 `4` 的设置（记住你已经配置了\
  \ `KeyCycle 0` 列中的设置）：\n\n| | KeyCycle 0 | KeyCycle 1 | KeyCycle 2 | KeyCycle 3\
  \ | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position | 0 | 25 | 50\
  \ | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60 | 60 | 150 |\
  \ 60 | 60 |\n\n表 44-1\n\n完成这些更改后，关键帧 XML 应该如下：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n\
  \      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n \
  \     motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  25\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"2\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n    <KeyCycle\n\
  \      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新循环的图，选择 `File -> Parse XML` 菜单选项以刷新波形，波形现在应该如图\
  \ 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\n图 44-14\n\
  \n## 44.6 预览动画\n\n现在可以在 `Cycle Editor` 中预览循环动画。点击图 44-15 中的播放按钮启动动画。要将循环与水平移动结合，将第二个菜单\
  \ (B) 从 `Stationary`（静态）更改为 `East`（东）。还要花一些时间尝试线性设置（C 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  \n图 44-15\n\n## 44.7 将 KeySet 添加到 MotionScene\n\n在 `Cycle Editor` 中，突出并拷贝 XML 面板中的\
  \ `KeyCycle` 元素，将其到 Android Studio 中 `res -> activity_main_scene.xml` 文件的 `Transition`\
  \ 部分，使其位于现有的 `KeySet` 标记之间。注意增加的持续时间设置以及启动动画的 `OnClick` 处理程序：\n\n```xml\n<Transition\n\
  \    motion:constraintEnd=\"@+id/end\"\n    motion:constraintStart=\"@id/start\"\
  \n    motion:duration=\"7000\">\n    <KeySet>\n        <KeyCycle\n          motion:framePosition=\"\
  0\"\n          motion:motionTarget=\"@+id/button\"\n          motion:wavePeriod=\"\
  1\"\n          motion:waveOffset=\"0dp\"\n          motion:waveShape=\"sin\"\n \
  \         android:translationY=\"60dp\"/>\n        <KeyCycle\n          motion:framePosition=\"\
  25\"/>\n    </KeySet>\n    <OnClick motion:targetId=\"@id/button\" motion:clickAction=\"\
  toggle\" />\n```\n\n继续之前检查每个目标是否声明正确。在编写时，`Cycle Editor` 使用旧的 `motion:target` 标签。例如：`motion:target=\"\
  @+id/button\"` 需要为五个 `KeyCycle` 项更改为 `motion:motionTarget=\"@+id/button\"`。\n\n\
  完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮开始并查看动画。注意 `KeyCycle` 波形形成也可以在 Android Studio `MotionLayout`\
  \ 编辑器中查看，如下方的图 44-16 所示：\n\n![](img/as_4.0_keycycle_motion_layout_waves.jpg)\n\n\
  图 44-16\n\n`KeyCycle` 关键帧集不限于每个一个。例如，将以下 `KeySet` 添加到 `activity_main_scene.xml`\
  \ 文件的 `Transition` 部分，以便在按钮移动时添加一些旋转效果：\n\n```xml\n<KeySet>\n    <KeyCycle\n   \
  \   motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n    \
  \  motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"45\"/>\n  \
  \  <KeyCycle\n      motion:framePosition=\"25\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n  \
  \  <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"150dp\"\n      android:rotation=\"45\"/>\n \
  \   <KeyCycle\n      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n  \
  \  <KeyCycle\n      motion:framePosition=\"100\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"45\"/>\n</KeySet>\n\
  ```\n\n## 44.8 总结\n\n循环关键帧提供了一种实用的方法，用于构建可能涉及大量匹配波形状态变化的帧动画。如本章所述，通过使用 `Cycle Editor`\
  \ 应用可以显著简化生成这些循环关键帧的过程。\n\n# 45. 使用悬浮操作按钮和 Snackbar\n\n\n\n\n\n本章的目标之一是提供材料设计（Material\
  \ Design）概念的概述。材料设计最初作为 Android 5.0 的引入，是一套设计指南，规定了 Android 用户界面以及运行在 Android 上的应用程序的显示和行为。\n\
  \n作为材料设计概念实现的一部分，Google 还引入了 Android 设计支持库（Android Design Support Library）。该库包含许多不同的组件，允许将材料设计的许多关键功能构建到\
  \ Android 中。这些组件中的两个——悬浮操作按钮（Floating Action Button）和 `Snackbar` 将在本章中介绍，并在随后的章节中介绍许多其他组件。\n\
  \n## 45.1 材料设计\n\nAndroid 环境的整体外观由材料设计的原则定义。材料设计由 Google 的 Android 团队创建，它规定了构成 Android\
  \ 用户界面以及运行其上的应用的元素在行为、阴影、动画和样式方面以特定方式显示和运行。材料设计的原则之一是，用户界面的元素似乎具有物理深度，并且感觉物品是由物理材料层层构建而成的。例如，按钮通过使用阴影效果，看起来悬浮在其所在的布局表面之上。按下按钮会导致按钮弯曲并抬起，就像是由薄薄材料制成的，释放时会产生波纹一样。\n\
  \n材料设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是位于屏幕顶部的应用栏（App Bar）应该显示的方式，以及它相对于活动主内容内滚动活动的行为方式。\n\
  \n事实上，材料设计涵盖了广泛的领域，从推荐的颜色样式到对象动画的方式。可以通过以下链接在网上找到材料设计概念和指南的完整描述，它是所有 Android 开发者的推荐读物：\n\
  \n[`material.io/design/introduction`](https://material.io/design/introduction)\n\
  \n## 45.2 设计库\n\n实现采用材料设计原则的 Android 应用程序所需的许多构建块包含在 Android 设计支持库中。该库包含一组用户界面组件，可以包含在\
  \ Android 应用程序中以实现材料设计的大部分外观、感觉和行为。该库中的两个组件——悬浮操作按钮和 `Snackbar` 将在本章介绍，而其他将在后面的章节中介绍。\n\
  \n## 45.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一个悬浮在应用程序用户界面表面之上的按钮，通常用于促进用户界面屏幕中最常见的操作。例如，悬浮操作按钮可以放置在屏幕上，允许用户向联系人列表添加条目或从应用内部发送电子邮件。图\
  \ 45-1 展示了允许用户在标准 Android 电话应用中显示键盘的悬浮操作按钮：\n\n![](img/as_phone_app.jpg)\n\n图 45-1\n\
  \n为了符合材料设计指南，使用悬浮操作按钮时应遵循许多规则。悬浮操作按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x 40dp（微型）。按钮在手机上距离屏幕边缘至少\
  \ 16dp，在桌面设备和平板设备上距离至少 24dp。无论大小如何，按钮必须包含一个大小为 24x24dp 的内部图标，并且建议每个用户界面只有一个悬浮操作按钮。\n\
  \n悬浮操作按钮可以带有动画，或设计为在触摸时变形为其他项目。例如，悬浮操作按钮可以在点击时旋转，或变形为其他元素，如工具栏或列出相关操作的面板。\n\n##\
  \ 45.4 Snackbar\n\n`Snackbar` 组件提供以面板形式向用户呈现信息的方法，该面板如图 45-2 所示。`Snackbar` 实例包含一条短的文本消息和一个可选的操作按钮，该按钮在用户点击时将执行某任务。一旦显示，`Snackbar`\
  \ 将自动超时，或者可以由用户通过滑动操作手动移除。在 `Snackbar` 显示期间，应用程序将继续运行并以正常方式响应用户交互。\n\n![](img/Image2434.jpg)\n\
  \n图 45-2\n\n在本章的剩余部分，将创建一个示例应用程序，该程序利用悬浮操作按钮和 `Snackbar` 的基本功能向项目列表添加条目。\n\n## 45.5\
  \ 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目），在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Basic\
  \ Activity`（基础活动）模板。\n\n在 `Name` 字段中输入 `FabExample` 并指定 `com.ebookfrenzy.fabexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置更改 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n## 45.6 审查项目\n\n由于选择了 `Basic Activity`\
  \ 模板，该活动包含四个布局文件。`activity_main.xml` 文件由一个 `CoordinatorLayout` 布局组成，包含应用栏、`Material\
  \ toolbar`（Material 工具栏）和悬浮操作按钮的条目。\n\n`content_main.xml` 文件代表活动内容区域的布局，包含一个 `NavHostFragment`\
  \ 实例。该文件通过以下指令嵌入 `activity_main.xml` 中：\n\n```xml\n<include layout=\"@layout/content_main\"\
  \ />\n```\n\n`activity_main.xml` 中的悬浮操作按钮元素如下：\n\n```xml\ncom.google.android.material.floatingbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n```\n\n这声明按钮将出现在屏幕右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识表示（在此情况下设置为 16dp）。XML 进一步声明按钮的内部图标将采用标准内置绘图的形式。\n\n空白模板还配置了悬浮操作按钮在用户点击时显示\
  \ `Snackbar` 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()` 方法中找到，如下：\n\n```java\n\
  binding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n   \
  \ public void onClick(View view) {\n        Snackbar.make(view, \"Replace with your\
  \ own action\", Snackbar.LENGTH_LONG)\n            .setAction(\"Action\", null).show();\n\
  \    }\n});\n```\n\n代码通过视图绑定访问悬浮操作按钮，并添加了一个点击时调用的 `OnClickListener` 处理程序。该方法简单显示带有消息但没有操作的\
  \ `Snackbar` 实例。\n\n当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图 45-3](#Floating_Action_Button.xhtml__idTextAnchor934)所示：\n\
  \n![](img/fab_button.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `onClick` 处理方法，导致 `Snackbar`\
  \ 在屏幕底部出现：\n\n![](img/fab_snackbar.jpg)\n\n图 45-4\n\n\n\n\n\n## 45.7 移除导航功能\n\n\
  如《Android Studio 布局编辑器指南》所示，`Basic Activity` 模板包含多个片段和按钮，用于从一个片段导航到另一个片段。对于本教程而言，这些功能是不必要的，而且如果不移除，稍后将会引起问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 `Project` 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在 `Component Tree`（组件树）面板中选择 `SecondFragment` 条目，并按下键盘上的删除键将其从图中移除。\n3.\
  \ 找到并删除 `SecondFragment.java`（`app -> java -> <package name> -> SecondFragment`）和\
  \ `fragment_second.xml`（`app -> res -> layout -> fragment_second.xml`）。\n4. 找到 `FirstFragment.java`\
  \ 文件，双击将其加载到编辑器，并删除 `onViewCreated()` 方法中的代码，使其内容如下：\n\n```\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n               \
  \       .navigate(R.id.action_FirstFragment_to_SecondFragment);\n    }\n});\n```\n\
  \n## 45.8 更改悬浮操作按钮\n\n由于此示例的目标是配置悬浮操作按钮向列表添加条目，因此当前显示在按钮上的邮件图标需要更改为更能指示所执行操作的内容。按钮将使用的图标命名为\
  \ `ic_add_entry.png`，可以在以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/dolphinjava/index.php`](https://www.ebookfrenzy.com/retail/dolphinjava/index.php)\n\
  \n在你的操作系统的文件系统导航器中找到此图像并复制该文件。在 `Project` 工具窗口中右键点击 `app -> res -> drawable` 条目，并从菜单中选择\
  \ `Paste`（粘贴）将文件添加到文件夹中：\n\n![](img/as_fab_icon_added.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml`\
  \ 文件，将图标的图像源从 `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry`，如下：\n\
  \n```\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的内部图标将变为加号。\n\n我们也可以通过简单向 `OnClickListener`\
  \ 添加代码，让悬浮操作按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件进行以下更改，每次点击按钮时都会调用 `displayMessage()`\
  \ 方法来显示 toast 消息：\n\n```\nimport android.widget.Toast;\n\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        displayMessage(\"Fab clicked\");\n        Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                      .setAction(\"\
  Action\", null).show();\n    }\n});\n\npublic void displayMessage(String message)\
  \ {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\n## 45.9\
  \ 为 Snackbar 添加操作\n\n也可以为 `Snackbar` 添加操作，当用户点击时会执行某项任务。编辑 `MainActivity.java` 文件并修改\
  \ `Snackbar` 的创建代码，添加一个标题为“My Action”的操作，并配置一个名为 `actionOnClickListener` 的 `OnClickListener`，该监听器反过来会显示\
  \ toast 消息：\n\n```\nbinding.fab.setOnClickListener(new View.OnClickListener() {\n\
  \    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                    \
  \  .setAction(\"My Action\", actionOnClickListener).show();\n    }\n});\n```\n\n\
  在 `MainActivity.java` 文件中添加监听器处理：\n\n```java\nView.OnClickListener actionOnClickListener\
  \ = new View.OnClickListener() {\n    @Override\n    public void onClick(View view)\
  \ {\n        displayMessage(\"Action clicked\");\n        Snackbar.make(view, \"\
  Action Complete\", Snackbar.LENGTH_LONG)\n                      .setAction(\"Action\"\
  , null).show();\n    }\n};\n```\n\n运行应用并点击悬浮操作按钮，此时 toast 消息和 `Snackbar` 都应该出现。在\
  \ `Snackbar` 可见时，点击 `Snackbar` 中的 `My Action` 按钮，并验证 `Snackbar` 上的文字已变为“Action Complete”：\n\
  \n![](img/fab_action_clicked.jpg)\n\n图 45-6\n\n## 45.10 总结\n\n本章提供了 Material Design（材质设计）、悬浮操作按钮和\
  \ `Snackbar` 的总体概述，并完成了一个使用这些功能的示例。悬浮操作按钮和 `Snackbar` 都是该设计的一部分。\n\n# 46. 使用 TabLayout\
  \ 组件创建标签页界面\n\n上一章概述了 Android 设计的设计，并介绍了悬浮操作按钮和 `Snackbar`。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与\
  \ `ViewPager` 结合。\n\n## 46.1 ViewPager2 简介\n\n虽然 `ViewPager2` 不是设计库的一部分，但在与 `TabLayout`\
  \ 配合实现标签页界面时它非常有用。`ViewPager2` 的主要作用是允许用户切换不同的页面，每个页面通常由一个片段表示。与 `ViewPager2` 关联片段由\
  \ `FragmentPagerAdapter` 实例管理。\n\n分配给 `ViewPager2` 的适配器至少需要实现两个方法。第一个 `getItemCount()`\
  \ 返回要显示的页面总数。第二个 `createFragment()` 接收一个页面编号并返回相应的给用户的片段对象。\n\n## 46.2 TabLayout\
  \ 组件概述\n\n如前所述，`TabLayout` 是作为材质设计的组件之一，并包含在设计支持库中。`TabLayout` 的目的是向用户展示标签，可以通过选择显示不同的页面。标签可以是固定的，也可以是滚动的，用户可以向左右滑动查看比屏幕显示更多的标签。标签上显示的信息可以是文本、图像或文本与图像的组合。图\
  \ 46-1，例如，显示了一个包含四个显示图像标签的应用标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n图 46-2，另一方面，显示了一个包含四个显示文本标签的滚动\
  \ `TabLayout` 配置：\n\n![](img/Image24341.jpg)\n\n图 46-2\n\n本章的剩余部分将通过创建一个示例项目，演示如何结合\
  \ `TabLayout` 组件、`ViewPager2` 以及四个片段。\n\n## 46.3 创建 TabLayoutDemo 项目\n\n\n\n\n\n\
  从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前，选择 `Basic Activity` 模板。\n\n\
  在 `Name` 字段中输入 `TabLayoutDemo`，并指定 `com.ebookfrenzy.tablayoutdemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。\n\n项目创建完成后，在 `Layout Editor` 工具中加载 `content_main.xml` 文件，选择 `NavHostFragment`\
  \ 对象并将其删除。由于我们不打算使用 `Basic Activity` 模板的导航功能，请编辑 `MainActivity.java` 文件并修改 `onCreate()`\
  \ 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController =\n        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n最后，删除 `onSupportNavigateUp()`\
  \ 方法：\n\n```java\n@Override\npublic boolean onSupportNavigateUp() {\n    NavController\
  \ navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration)\n      \
  \      || super.onSupportNavigateUp();\n}\n```\n\n## 46.4 创建第一个 Fragment\n\n`TabLayout`\
  \ 上的每个标签在被选中时将显示不同的 fragment。在 Project 工具窗口中右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo`\
  \ 条目，选择 `New -> Fragment -> Fragment (Blank)` 选项来创建其中的第一个 fragment。在弹出的对话框中，在 `Fragment\
  \ Name:` 字段中输入 `Tab1Fragment`，并在 `Fragment Layout Name:` 字段中输入 `fragment_tab1`。点击\
  \ `Finish` 按钮创建新 fragment：\n\n![](img/as_4.2_new_fragment_java1.jpg)\n图 46-3\n\n\
  编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有自动添加，请如下所示添加 `OnFragmentInteractionListener`\
  \ 接口声明：\n\n```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n```\n\n将新创建的 `fragment_tab1.xml` 文件（位于 `app -> res -> layout`）加载到 `Layout\
  \ Editor` 工具中，在 `Component Tree` 面板中右键点击 `FrameLayout` 条目，选择 `Convert FrameLayout\
  \ to ConstraintLayout` 选项。在弹出的对话框中，点击 `OK` 之前确保所有转换选项都已选中。将布局的 ID 改为 `constraintLayout`。\n\
  \n一旦布局已转换为 `ConstraintLayout`，从布局中删除 `TextView`。从 `Palette` 中找到 `TextView` 控件，并将其拖放到布局的中心。编辑该对象的\
  \ `text` 属性，使其显示为“Tab 1 Fragment”，并将字符串提取为命名为 `tab_1_fragment` 的资源，此时布局应与[图 46-4]\
  \ 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n图 46-4\n\n## 46.5 复制 Fragments\n\
  \n到目前为止，项目仅包含了四个所需的 fragment 中的一个。与其使用之前的步骤创建其余三个 fragment，不如复制第一个 fragment 快快。每个\
  \ fragment 都由一个布局 XML 文件和一个 Java 类文件组成，每者都需要被复制。\n\n在 Project 工具窗口中右键点击 `fragment_tab1.xml`\
  \ 文件，从弹出的菜单中选择 `Copy` 选项。再次右键点击布局条目，选择 `Paste` 选项。在弹出的对话框中，将新布局文件命名为 `fragment_tab2.xml`。编辑新的\
  \ `fragment_tab2.xml` 并将 `View` 上的文本改为“Tab 2”，按照步骤将字符串提取为命名为 `tab_2` 的资源。\n\n要复制\
  \ `Tab1Fragment` 类，右键点击 `app -> java -> com.ebookfrenzy.tablayoutdemo`。右键点击 `com.ebookfrenzy.tablayoutdemo`\
  \ 并选择 Copy。在 Copy 对话框中，在名称字段输入 `Tab2Fragment` 并点击 OK。编辑 `Tab2Fragment.java` 文件并修改\
  \ `onCreateView()` 方法：\n\n```java\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ false);\n}\n```\n\n再次执行上述复制操作以创建 fragment 布局和类。完成这些步骤后，项目结构应与[图 46-5] 一致：\n\n\
  ![](img/as_tab_layout_files.jpg)\n图 46-5\n\n## 46.6 添加 TabLayout 和 ViewPager\n\n\
  创建完成后，下一步是在主布局中添加 `TabLayout` 和 `ViewPager`。编辑 `activity_main.xml` 文件并按如下所示添加这些元素。注意\
  \ `TabLayout` 嵌入在 `AppBarLayout` 中而 `ViewPager` 放在 `AppBarLayout` 之后：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.Demo\">\n\n        <androidx.appcompat.widget.Toolbar\n\
  \            android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"\n            android:background=\"\
  ?attr/colorPrimary\"\n            app:popupTheme=\"@style/Theme.Demo.PopupOverlay\"\
  />\n\n        <com.google.android.material.tabs.TabLayout\n            android:id=\"\
  @+id/tabLayout\"\n            android:layout_width=\"match_parent\"\n          \
  \  android:layout_height=\"wrap_content\"\n            app:tabMode=\"fixed\"\n \
  \           app:tabGravity=\"fill\"/>\n\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \n    <androidx.viewpager2.widget.ViewPager\n        android:id=\"@+id/view_pager\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\
  \ />\n\n    <include layout=\"@layout/content_main\" />\n\n    <com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_marginEnd=\"@dimen/fab_margin\"\n        android:layout_marginBottom=\"\
  16dp\"\n        app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n## 46.7 创建 Pager 适配器\n\n\n\n本示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 标签页的\
  \ fragment。在向布局资源文件添加 `ViewPager2` 后，需要向项目中添加一个子类 `FragmentPagerAdapter` 的新类，用于管理当用户选择标签项时将显示的\
  \ fragment。\n\n在 Project（项目）工具窗口中，右键点击 `com.ebookfrenzy.tablayoutdemo` 项，并选择 `New\
  \ -> Java Class` 菜单选项向项目添加一个新类。在新类对话框中，在 `Name:` 字段中输入 `TabPagerAdapter`，选择列表中的\
  \ `Class` 项并按下键盘的回车键。\n\n编辑 `TabPagerAdapter.java` 文件，使其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \n    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n该类声明为扩展 `FragmentPagerAdapter` 类，并实现了一个构造函数，允许在创建实例时将所需的页面数量传递给类。当需要特定页面时将调用\
  \ `createFragment()` 方法。使用 `switch` 语句来识别请求的页码并返回相应的 fragment 实例。最后，`getItemCount()`\
  \ 方法简单返回创建实例时传递的计数值。\n\n### 46.8 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2`\
  \ 和 `TabPagerAdapter` 实例并声明主活动类实现四个标签页 fragment 的 fragment 交互监听器。编辑 `MainActivity.java`\
  \ 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport android.net.Uri;\n\
  import com.google.android.material.tabs.TabLayoutMediator;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements\n    Tab1Fragment.OnFragmentInteractionListener,\n\
  \    Tab2Fragment.OnFragmentInteractionListener,\n    Tab3Fragment.OnFragmentInteractionListener,\n\
  \    Tab4Fragment.OnFragmentInteractionListener {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        configureTabLayout();\n  \
  \  }\n\n    protected void configureTabLayout() {\n        for (int i = 0; i < 4;\
  \ i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n  \
  \      }\n        final TabPagerAdapter adapter = new TabPagerAdapter(this, binding.tabLayout.getTabCount());\n\
  \        binding.viewPager.setAdapter(adapter);\n        new TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n            (tab, position) -> tab.setText(\"Tab \" + (position\
  \ + 1) + \" Item\")).attach();\n    }\n\n    @Override\n    public void onFragmentInteraction(Uri\
  \ uri) {\n    }\n}\n```\n\n代码首先创建四个标签页并如下所示将其添加到 `TabLayout` 实例中：\n\n```java\nfor\
  \ (int i = 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来创建一个 `TabPagerAdapter` 类实例。注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter(this, binding.tabLayout.getTabCount());\nbinding.viewPager.setAdapter(adapter);\n\
  ```\n\n最后，使用 `TabLayoutMediator` 类实例来连接 `TabLayout` 和 `ViewPager2` 对象：\n\n```java\n\
  new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n    (tab, position)\
  \ -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n```\n\n该类确保\
  \ `TabLayout` 标签与当前选中的 fragment 保持同步。此过程的一部分是确保在每个标签页上显示正确的文本。在这种情况下，文本被配置为“Tab\
  \ `<n>` Item”，其中 `<n>` 被替换为当前选中标签的数字。\n\n### 46.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择某个标签会导致相应的\
  \ fragment 出现在屏幕的内容区域：\n\n![](img/as_tab_layout_running.jpg)46-6\n\n### 46.10 自定义\
  \ TabLayout\n\n此示例项目中的 `TabLayout` 是使用固定模式（fixed mode）配置的。这种模式适用于数量较少且标题较短的标签。如图\
  \ 46-7 所示，当使用固定模式时，较数量的标签或较长的标题可能会迅速变成一个问题：\n\n![](img/as_4.1_tab_layout_truncated.jpg)46-7\n\
  \n为了让标签适应到可用的显示宽度，`TabLayout` 使用了多行文本。尽管如此，第二行被截断了，导致无法看到完整标题。解决此问题的方案是将 `TabLayout`\
  \ 切换到滚动模式（scrollable mode）。在这种模式下，标题以单行格式显示，允许用户水平滑动查看可用项目，如图 46-8 所示：\n\n![](img/as_4.1_tab_layout_scrollable.jpg)46-8\n\
  \n要将 `TabLayout` 切换到滚动模式，只需将 `activity_main.xml` 布局文件中的 `app:tabMode` 属性从 \"fixed\"\
  \ 改为 \"scrollable\"：\n\n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"\
  @+id/tabLayout\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  wrapContent\"\n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 以控制标签项如何占据屏幕可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在横屏平板等宽显示器上更为明显。例如，设置为\
  \ \"fill\" 时，将将分布在 `TabLayout` 的宽度，如图 46-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)46-9\n\
  \n将属性值更改为 \"center\" 将导致项目相对于标签栏的中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)46-10\n\
  \n### 46.11 总结\n\n`TabLayout` 是作为 Android Material 设计实现引入的组件之一。`TabLayout` 组件的目的是展示一系列标签项，这些项被选中时会用户显示不同的内容。标签项可以显示文本、图像或两者的结合。\n\
  \n\n\n\n\n正如使用悬浮操作按钮和 Snackbar 章节中概述的 `ListView` 类一样，`RecyclerView` 的目的是允许以滚动列表的形式向用户呈现信息。然而，`RecyclerView`\
  \ 相比 `ListView` 具有许多优势。特别是 `RecyclerView` 在管理组成列表的视图方面效率高得多，它本质上是在列表项滚出屏幕时复用现有的列表项视图，而不是创建新视图（因此得名为“recycler”，即复用器）。这既提高了性能，又减少了列表的资源，这一特性在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器供选择，以控制列表项呈现给用户的方式：\n\n* `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n  ![](img/Image2427.jpg)\n  图 47-1\n* `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项大小相同时，使用此管理器效果最佳。\n  ![](img/Image2436.jpg)\n  图 47-2\n* `StaggeredGridLayoutManager`\
  \ - 列表项以交错网格格式呈现。当列表项大小不相同时，使用此管理器效果最佳。\n  ![](img/Image2443.jpg)\n  图 47-3\n\n\
  对于这三种内置管理器都无法提供所需布局的情况，可以通过子类化 `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n在 `RecyclerView`\
  \ 中显示的每个列表项都是作为 `ViewHolder` 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示项的视图布局。\n\
  \n与 `ListView` 一样，`RecyclerView` 依赖于适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间的中间媒介。适配器被创建为\
  \ `RecyclerView.Adapter` 类的子类，并且至少实现以下方法，这些方法会被分配给适配器的 `RecyclerView` 对象在多个时间点调用：\n\
  \n* `getItemCount()` – 此方法必须返回列表中要显示的项的数量计数。\n* `onCreateViewHolder()` – 此方法创建并返回一个\
  \ `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过膨胀 XML 布局文件创建。\n* `onBindViewHolder()`\
  \ – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法的责任是用与指定项对应的文本和图形填充布局中的视图中，并将该对象返回给\
  \ `RecyclerView`，由其将项呈现给用户。\n\n在布局中添加 `RecyclerView` 只需要向出现在该位置的 activity 的 XML\
  \ 内容布局文件中添加相应的元素。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主 activity 布局文件的 `CoordinatorLayout` 中，与 `AppBar`\
  \ 和 `Toolbar` 在一起。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时它们会滚出屏幕（该主题在使用\
  \ AppBar 和折叠 Toolbar 布局 章节中有更详细的介绍）。\n\n## 47.2 CardView 概述\n\n`CardView` 类是一种允许使用卡片形式呈现信息的用户界面。卡片通常使用\
  \ `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影和圆角出现。例如 47-4 显示了配置的 `CardView` 实例，用于显示包含一个\
  \ `ImageView` 和两个 `TextView` 的布局：\n![](img/Image2452.jpg)\n图 47-4\n\n使用 `CardView`\
  \ 呈现的用户界面定义在 XML 文件中，并在运行时加载到 `CardView` 中。`CardView` 可以包含任何复杂性的布局，例如标准的 `RelativeLayout`。以下\
  \ XML 文件表示一个包含 `RelativeLayout` 的卡片布局：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    android:id=\"\
  @+id/card_view\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_margin=\"5dp\"\n    card_view:cardRadius=\"12dp\"\
  \n    card_view:cardElevation=\"3dp\"\n    card_view:contentPadding=\"4dp\">\n\n\
  \    <RelativeLayout\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n\n        <ImageView\n      \
  \      android:id=\"@+id/item_image\"\n            android:layout_width=\"100dp\"\
  \n            android:layout_height=\"100dp\"\n            android:layout_alignParentLeft=\"\
  true\"\n            android:layout_alignParentTop=\"true\"\n            android:layout_marginRight=\"\
  16dp\" />\n\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n\
  当与 `RecyclerView` 结合创建卡片滚动列表时，滚动视图 `onCreateViewHolder()` 方法会膨胀布局资源文件，将其分配给 `ViewHolder`\
  \ 实例并返回给 `RecyclerView` 实例。\n\n## 47.3 总结\n\n本章介绍了 Android 的 `RecyclerView` 和 `CardView`\
  \ 组件。`RecyclerView` 提供了一种在 Android 应用中显示滚动视图列表的高资源效率的方法。`CardView` 在以卡片形式呈现组数据（例如姓名和地址列表）时非常有用。正如之前概述并且将在下一章节的教程中演示的，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 48. Android RecyclerView 和 CardView 教程\n\n\n\n\n\
  \n在本章中，将创建一个示例项目，该项目将同时利用 `CardView` 和 `RecyclerView` 组件来创建一个可滚动的卡片列表。完成后的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为选择卡片时会向用户显示消息，指示点击了哪一个卡片。\n\
  \n## 48.1 创建 CardDemo 项目\n\n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 菜单设置为 `Java`。\n\n## 48.2 修改 Basic Activity 项目\n\n由于选择了 `Basic Activity`，布局中包含了一个此项目所需的悬浮操作按钮（floating\
  \ action button）。在 `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，选择悬浮操作按钮并按下键盘上的删除键将该对象从布局中移除。编辑\
  \ `MainActivity.java` 文件，从 `onCreate` 方法中移除悬浮操作按钮和导航控制器代码如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \            Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n            new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController,\n       \
  \     appBarConfiguration);\n    binding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n同样，移除 `onSupportNavigateUp()`\
  \ 方法，然后打开 `content_main.xml` 文件并删除布局中的 `nav_host_fragment_content_main` 对象，使只保留\
  \ `ConstraintLayout` 父布局。\n\n## 48.3 设计 CardView 布局\n\n卡片内视图的布局将在单独的 XML 布局文件中定义。在\
  \ `Project` 工具窗口中，右键点击 `app -> res -> layout` 条目并选择 `New -> Layout Resource File`\
  \ 菜单选项。在 `New Resource Dialog` 中，在 `File name:` 字段中输入 `card_layout`，并在点击 `OK` 按钮之前在根元素字段中输入\
  \ `androidx.cardview.widget.CardView`。\n\n在 `Layout Editor` 工具中加载 `card_layout.xml`\
  \ 文件，切换到 `Code` 模式并修改布局，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\
  \n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n \
  \   app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toOf=\"\
  parent\"\n            app:layout_constraintStart_toStart=\"parent\"\n          \
  \  app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n         \
  \   android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  itemImage\"\n            app:layout_constraintStart_toEndOf=\"itemImage\"\n    \
  \        app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n   \
  \         android:id=\"@+id/itemDetail\"\n            android:layout_width=\"236dp\"\
  \n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  itemImage\"\n            app:layout_constraintStart_toEndOf=\"itemImage\"\n    \
  \        app:layout_constraintTop_toBottomOf=\"@+itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件，从调色板的 `Containers` 部分将 `RecyclerView` 对象拖到布局中，使其位于屏幕中心。使用 `Infer constraints`\
  \ 按钮为视图添加缺失的布局约束。使用 `Attributes` 窗口，将 `RecyclerView` 实例的 `ID` 改为 `recyclerView`，并将\
  \ `layout_width` 和 `layout_height` 属性设置为 `match_constraint`。\n\n## 48.5 添加图像\n\n\
  除了两个 `TextView`，卡片布局还包含一个 `ImageView`，`Recycler` 适配器已配置显示图像。在测试项目之前必须添加这些图像。项目使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\nhttps://www.ebookfrenzy.com/retail/dolphinjava\n\
  \n在操作系统文件系统中找到这些图像并复制。右键点击 `Project` 工具窗口中的 `app -> res -> drawable` 条目并选择 `Paste`\
  \ 将文件添加到文件夹中：\n\n![](img/Image24252.jpg)\n图 48-1\n\n## 48.6 创建 RecyclerView Adapter\n\
  \n上一所述，`RecyclerView` 需要一个适配器来处理列表项的创建。通过右键点击 `Project` 工具窗口中的 `app -> java -> com\
  \ -> ebookfrenzy -> carddemo` 条目并选择 `New -> Java Class` 选项将此新类添加到项目中。在新类对话框中，在 `Name`\
  \ 字段中输入 `RecyclerAdapter`并在列表中选择 `Class`，然后按键盘 `Return` 创建新的 Java 类文件。\n\n编辑新的 `RecyclerAdapter.java`\
  \ 文件，添加一些导入指令并声明该类现在继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供显示的数据，将在适配器中添加一些数组作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final final String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter\
  \ Three\", \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\"\
  , \"Chapter Eight\"};\n    final final String[] details = {\"Item one details\"\
  , \"Item two details\", \"Item three details\", \"Item four details\", \"Item five\
  \ details\", \"Item six details\", \"Item seven details\",\n```\n\n\n\n\n\n```java\n\
  \"Item eight details\"};\n\nfinal private int[] images = { \n    R.drawable.android_image_1,\n\
  \    R.drawable.android_image_2,\n    R.drawable.android_image_3,\n    R.drawable.android_image_4,\n\
  \    R.drawable.android_image_5,\n    R.drawable.android_image_6,\n    R.drawable.android_image_7,\n\
  \    R.drawable.android_image_8 \n};\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要实现自己的\
  \ `ViewHolder` 类，并配置以引用 `card_layout.xml` 文件中的视图元素。在 `RecyclerAdapter.java` 文件中，按照如下方式实现该类：\n\
  \n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n\n    // ...\n\n    static class ViewHolder extends RecyclerView.ViewHolder\
  \ {\n        ImageView itemImage;\n        TextView itemTitle;\n        TextView\
  \ itemDetail;\n\n        ViewHolder(View itemView) {\n            super(itemView);\n\
  \            itemImage = itemView.findViewById(R.id.itemImage);\n            itemTitle\
  \ = itemView.findViewById(R.id.itemTitle);\n            itemDetail = itemView.findViewById(R.id.itemDetail);\n\
  \        }\n    }\n}\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个构造方法，该方法通过指向\
  \ `card_layout.xml` 文件中三个视图项的引用来初始化这些变量。\n\n要添加到 `RecyclerAdapter.java` 文件的下一个项是\
  \ `onCreateViewHolder()` 方法的实现：\n\n```java\n@NonNull\n@Override\npublic ViewHolder\
  \ onCreateViewHolder(ViewGroup viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n\
  \            .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n该方法将由 `RecyclerView` 调用以获取 `ViewHolder` 对象。它会填充布局层次文件 `card_layout.xml`，并创建一个初始化了该视图层次的\
  \ `ViewHolder` 类实例，然后将其返回给 `RecyclerView`。\n\n`onBindViewHolder()` 方法的作用是将要显示的数据填充到\
  \ `ViewHolder` 对象中的视图层次结构中。它接收一个 `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在应该添加此方法，并使用项目编号作为数据数组的索引。这些数据将使用\
  \ `ViewHolder` 类构造方法中创建的引用显示在布局视图上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItemCount()` 方法，在此情况下，它简单地返回 `titles` 数组中项的数量：\n\n```java\n@Override\npublic\
  \ int getItemCount() {\n    return titles.length;\n}\n```\n\n## 48.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 文件以及一个 `RecyclerView`\
  \ 适配器。在测试目前进展之前的最后一步是使用布局管理器（layout manager）初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView`\
  \ 对象。为了本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局。\n\n这里有一点复杂之处，因为我们需要通过视图绑定（view\
  \ binding）从 `MainActivity` 类访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局中，而该布局又包含在 `activity_main.xml` 文件中。为了访问 `content_main.xml`，我们需要在包含它时给它分配一个 `id`。为了做到这一点，编辑\
  \ `activity_main.xml` 并修改 `include` 元素如下所示：\n\n```xml\n<include android:id=\"@+id/contentMain\"\
  \ layout=\"@layout/content_main\" />\n```\n\n为文件分配了 `id` 后，可以使用以下绑定 `binding.contentMain.recyclerView`\
  \ 访问 `recyclerView` 组件。现在编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法来实现初始化代码：\n\
  \n```java\npackage com.ebookrenzy.carddemo;\n\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  import androidx.recyclerview.widget.RecyclerView;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private RecyclerView recyclerView;\n    private RecyclerView.LayoutManager\
  \ layoutManager;\n    private RecyclerView.Adapter adapter;\n\n    @Override\n \
  \   protected void onCreate(Bundle savedInstanceState) {\n        // ...\n     \
  \   setSupportActionBar(toolbar);\n        layoutManager = new LinearLayoutManager(this);\n\
  \        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n   \
  \     adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n## 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动查看列表中不同的卡片项：\n\n![](img/card_demo_running.jpg)\n\
  \n## 48.9 响应卡片选择\n\n该项目的最后一个阶段是使列表中的卡片变为可选的，这样点击卡片就会触发应用内的事件。在本例例中，卡片将被配置为在用户点击时显示一条消息。为了响应点击，需要修改\
  \ `ViewHolder` 类为每个项视图分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 声明如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\nclass\
  \ ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n    TextView\
  \ itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView) {\n    \
  \    super(itemView);\n        itemImage = itemView.findViewById(R.id.itemImage);\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle);\n        itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override \n            public void onClick(View\
  \ v) {\n                // ...\n            }\n        });\n    }\n}\n```\n\n在 `onClick`\
  \ 处理程序的体内，现在可以添加代码来显示消息。由于点击产生的结果可能会取决于点击了哪张卡片，因此识别选定的卡片也很重要。此信息可以通过调用 `RecyclerView.ViewHolder`\
  \ 类的 `getAdapterPosition()` 方法获取。在 `RecyclerAdapter.java` 文件中，添加 `onClick` 处理程序如下：\n\
  \n```java\n@override\npublic void onClick(View v) {\n    int position = getAdapterPosition();\n\
  \    Snackbar.make(v, \"检测到点击项 \" + (position + 1), Snackbar.LENGTH_LONG)\n    \
  \        .setAction(\"操作\", null).show();\n}\n```\n\n最后一个任务是启用 Android 应用中点击项时出现的材质设计波纹效果（ripple\
  \ effect）。这只需在 `card_layout.xml` 文件中的 `CardView` 实例声明中添加一些属性即可：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\" />\n```\n\n\n\n\n\n\
  android:clickable=\"true\" >\n\n再次运行应用并验证点击列表中的卡片是否会触发接触点的标准波纹效果（ripple effect），以及显示报告所选项目编号的\
  \ `Snackbar`。\n\n# 48.10 总结\n\n本章详细介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚滚的基于卡片的项列表的步骤。示例还涵盖了对列表项点击的检测，包括识别所选项目以及在被点击的\
  \ `CardView` 实例上启用波纹效果视觉反馈。\n\n# 49. 布局编辑器示例数据教程\n\n在上一章节中创建的 `CardDemo` 项目提供了一个很好的示例，说明了在完成应用并测试之前，从布局编辑器内部准确评估用户界面的外观是多么困难。每当用户界面中要显示的内容只有在用户安装并运行应用后才能生成或获取时，这个问题就会经常发生。\n\
  \n长期一段时间以来，Android Studio 布局编辑器一直提供了指定简单属性的能力，这些属性仅在设计布局时有效。例如，可以为布局编辑器中的 `TextView`\
  \ 分配一个仅用于设计时的字符串资源，该资源在应用运行时不会显示。随着 Android Studio 布局编辑器引入示例数据支持，此功能得到了显著扩展，并将在本章中用于改进\
  \ `CardDemo` 项目的布局编辑器体验。\n\n## 49.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图\
  \ 49-1）与上一章节末尾测试的运行应用几乎没有相似之处：\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  \n图 49-1\n\n在书中前面的使用 Jetpack 构建现代 Android 应用架构章节中，引入了示例数据的概念。为了演示示例数据的使用，现在将修改项目，使得完全填充的卡片可以在布局编辑器内部显示在\
  \ `RecyclerView` 中。但在在此之前，值得注意的是，布局编辑器拥有一组预配置的示例数据模板，可以在设计用户界面时使用。要查看这些模板的用法，将 `content_main.xml`\
  \ 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set Sample Data`（设置示例数据）菜单选项以显示设计视图属性面板：\n\
  \n![](img/as_3.2_design_time_attributes.jpg)\n\n图 49-2\n\n将模板更改为 `Email Client`\
  \ 选项并将项目计数更改为 12，注意 `RecyclerView` 发生了变化，显示来自模板的数据：\n\n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\
  \n图 49-3\n\n这些模板对于在无需任何额外工作的情况下显示示例数据非常有用，通常足以完成布局设计。然而对于本示例，将使用示例数据来显示 `RecyclerView`\
  \ 中的卡片，正如它们在运行应用中的预期外观所示。在布局编辑器仍加载着 `content_main.xml` 文件的情况下，切换到代码模式并找到 `RecyclerView`\
  \ 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n    android:id=\"\
  @+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，用于在列表中显示 12 个项，每个项使用包含在 `recycler_view_item.xml`\
  \ 文件中的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools` 选项。虽然涵盖所有这些设置超出了本书的范围，但可以在以下 URL 处找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述的 `recycler_view_item.xml` 文件是布局编辑器在选择示例数据模板时自动生成的，可以在项目工具窗口中找到。\n\n切换回设计模式，在选中\
  \ `RecyclerView` 的情况下，使用设计视图属性面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目中删除，同时\
  \ `content_main.xml` XML 文件中的两个 `tools` 属性行也会被删除（如果 Android Studio 未能删除这些行，则可以从代码视图手动删除）。\n\
  \n要切换到使用卡片布局显示示例数据，添加一个 `listitem` 属性来引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`\
  \ 后，在属性工具窗口中搜索 `listitem` 属性，并在属性字段中输入 `@layout/card_layout`，如图 49-4 所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\
  \n图 49-4\n\n切换回设计模式，注意每个项现在都显示卡片布局，尽管没有任何图像且使用的是示例数据：\n\n![](img/as_3.6_recyclerview_sample_data.jpg)\n\
  \n图 49-5\n\n下一步是在卡片布局中的视图显示一些图像和不同的文本。这可以是布局编辑器提供的模板数据，也可以为项目添加的自定义数据。将 `card_layout.xml`\
  \ 文件加载到布局编辑器，选中 `ImageView` 并显示设计视图属性面板。从 `srcCompat` 菜单中，选择内置的 `scenic` 图像，如图 49-6\
  \ 所示：\n\n![](img/as_3.6_recyclerview_sample_data_images.jpg)\n\n图 49-6\n\n接下来，右键点击\
  \ `itemTitle` `TextView` 对象，选择 `Set Sample Data` 菜单选项，并在设计属性面板中选择 `cities` 文本。对\
  \ `itemDetail` 视图此步骤，这次选择 `full_names` 选项，如图 49-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_text.jpg)\n\
  \n图 49-7\n\n以设计模式打开 `content_main.xml` 文件，注意 `RecyclerView` 现在使用的是内置图像和示例文本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data.jpg)\n\n图 49-8\n\n## 49.2 使用自定义示例数据\n\n\
  本章的最后一步是在布局编辑器中使用自定义示例数据图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在项目工具窗口，右键点击 `app` 条目并选择 `New\
  \ -> Sample Data Directory` 菜单选项，此时名为 `sampledata` 的新目录将出现在工具窗口中。如果新文件夹不可见，将工具窗口从\
  \ Android 切换到 Project 模式，并在 `CardDemo -> app` 下找到文件夹，如图 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\
  \n图 49-9\n\n右键点击 `sampledata` 目录，创建一个名为 `images` 的子目录，并按照上一章节概述的步骤将 Android 图像复制粘贴到新文件夹。再次显示\
  \ `ImageView` 的设计视图属性面板，这次点击 `Browse` 并在资源对话框中选择新添加的 Android 图像（如果文件夹没有出现，请尝试重新构建项目）：\n\
  \n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\n图 49-10\n\n\n\n\n再次右键点击 `sampledata`\
  \ 目录，选择 `New -> File`get，将文件命名为 `chapters`，在 `Register New File Type Association`\
  \ 对话中选择 `Text`，并输入以下内容：\n\n```\nChapter One\nChapter Two\nChapter Three\nChapter\
  \ Four\nChapter Five\nChapter Six\nChapter Seven\nChapter Eight\n```\n\n接下来，创建一个名为\
  \ `items` 的第二个文本文件，内容如下：\n\n```\nItem one details\nItem two details\nItem three\
  \ details\nItem four details\nItem five details\nItem six details\nItem seven details\n\
  Item eight details\n```\n\n创建好示例数据文本文件后，剩下的就是在 `card_layout.xml` 文件的视图元素中按如下方式引用它们：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/itemTitle\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\
  \n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:id=\"\
  @+id/itemDetail\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  16dp\"\n    android:layout_marginStart=\"16dp\"\n    android:layout_marginTop=\"\
  8dp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n \
  \   tools:text=\"@sample/items\" />\n```\n\n重新构建应用并返回 `content_main.xml` 文件的布局设计界面，此时自定义的示例数据和图像应该显示在\
  \ `RecyclerView` 列表中：\n\n![](img/as_3.6_sample_data_running.jpg)\n\n图 49-11\n\n\
  与其使用两个独立的文本文件并对图片集的引用，另一种方案是在 JSON 文件中声明示例数据。例如：\n\n```json\n{\n  \"mydata\": [\n\
  \    {\n      \"chapter\" : \"Chapter One\",\n      \"details\": \"Item one details\"\
  ,\n      \"image\": \"@sample/images\"\n    },\n    {\n      \"chapter\" : \"Chapter\
  \ Two\",\n      \"details\": \"Item two details\",\n      \"image\": \"@sample/images\"\
  \n    },\n    ...\n  ]\n}\n```\n\n假设上述内容包含在一个名为 `chapterdata.json` 的文件中，则示例数据将在视图\
  \ XML 元素中按如下方式引用：\n\n```xml\n<ImageView\n    ...\n    tools:src=\"@sample/chapterdata.json/mydata/image\"\
  \ />\n\n<TextView\n    ...\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\"\
  \ />\n\n<TextView\n    ...\n    tools:text=\"@sample/chapterdata.json/mydata/details\"\
  \ />\n```\n\n## 49.3 总结\n\n本章演示了在布局编辑器中使用示例数据，以提供用户界面运行时外观的更真实的表示。本教程涵盖的步骤包括使用现有的示例数据模板以及集成自定义示例数据。\n\
  \n### 50. 使用 AppBar 和折叠工具栏布局\n\n在本章中，我们将探索如何自定义活动布局中的应用栏（app bar），并使其响应屏幕上其他视图发生的滚动事件。通过结合使用\
  \ `CoordinatorLayout` 与 `AppBarLayout` 以及 `CollapsingToolbarLayout` 容器，可以配置应用栏显示图像，并在进入和退出视图时执行动画效果。例如，列表上的向上滚动动作可以配置为让应用栏从视图中退回，然后在执行向下滚动动作时重新出现。\n\
  \n本章将从构成应用栏的元素概述开始，然后处理各种应用栏配置的示例。\n\n### 50.1 AppBar 的结构\n\n应用栏是应用运行时显示在屏幕顶部的区域，可以配置为包含各种不同的项目，包括状态栏、工具栏（toolbar）、标签栏（tab\
  \ bar）和弹性空间区域。例如，[图 50-1] 显示了一个一个包含状态栏、工具栏和标签栏的应用栏：\n\n![](img/Image24271.jpg)\n\
  \n图 50-1\n\n弹性空间区域可以用空白颜色填充，或者如[图 50-2]所示，用图像填充：\n\n![](img/Image2436.jpg)\n\n图\
  \ 50-2\n\n正如本章其余部分将演示的那样，如果活动布局包含可滚动内容，就可以对应用栏元素进行配置。\n\n### 50.2 示例项目\n\n为了本示例演示，将对项目进行更改。首先启动\
  \ Android Studio 并加载此项目。项目加载后，运行应用，并注意在滚动时工具栏是如何保持可见的，如[图 50-3]所示：\n\n![](img/Image2443.jpg)\n\
  \n图 50-3\n\n第一步是进行一些配置，使工具栏在向上移动时收起。\n\n#### 50.3 协调 RecyclerView 和工具栏\n\n将 `activity_main.xml`\
  \ 文件加载到布局编辑器中，切换到代码模式并查看 XML 布局，其层级结构由[图 50-4]中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 50-4\n\n层次结构的顶层是 `CoordinatorLayout`，正如其名称所示，它协调各种视图之间的交互。例如，在“使用浮动按钮和 Snackbar”章节所示，`CoordinatorLayout`会自动向上移动浮动按钮以适应\
  \ Snackbar 的出现，然后在条形消失后将按钮移回。\n\n`CoordinatorLayout` 同样可以用于根据某些视图的滚动使应用栏元素滑入或滑出视图。上述层级结构中的此类元素是\
  \ `ConstraintLayout`。要实现这一点，需要对发生滚动的元素以及与之协调的元素设置属性。\n\n在滚动元素（本例中 `RecyclerView`）上，必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶级 `ConstraintLayout` 元素，并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到代码模式并找到 `AppBarLayout` 元素。注意 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。要让工具栏响应在 `RecyclerView` 中发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。分配给此属性的值取决于所需的交互性质，并且必须由以下一个或多个项组成：\n\n- `scroll`: 表示该视图将被滚动出屏幕。如果不设置此项，在滚动事件期间该视图将固定在屏幕顶部。\n\
  \n\n\n\n- `enterAlways` – 与 `scroll` 选项配合使用时，向上滚动动作将导致视图收回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n\
  \n- `enterAlwaysCollapsed` – 在视图上设置此项时，在向下滚动动作达到列表限制之前，该视图将不会从折叠状态展开。如果设置了 `minHeight`（最小高度）属性，视图将在初始滚动过程中出现，但仅持续到达到最小高度。随后它将保持在该高度，并且在到达列表顶部之前不会完全展开。请注意，此选项仅在同时配合\
  \ `enterAlways` 和 `scroll` 选项使用时才有效。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n\n- `exitUntilCollapsed` – 设置后，视图在向上滚动过程中会折叠，直到达到\
  \ `minHeight` 阈值，此时它将保持在该高度，直到滚动方向发生变化。\n\n为了本示例的目的，`scroll` 和 `enterAlways` 选项将如下设置在\
  \ `Toolbar` 上：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n    app:layout_scrollFlags=\"scroll|enterAlways\"\
  \ />\n```\n\n设置好相应的属性后，再次运行应用，并在 `RecyclerView` 列表中执行向上滚动动作。这应该导致工具栏折叠到视图之外（图 50-5）。向下滚动动作将导致工具栏重新出现。\n\
  \n![](img/Image2459.jpg)\n图 50-5\n\n## 50.4 引入折叠应用工具栏布局 (Collapsing Toolbar Layout)\n\
  \n`CollapsingToolbarLayout` 容器通过提供更广泛的选项以及对响应协调滚动动作的标题栏及其子视图的折叠进行更高级别的控制，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子项添加，并提供诸如随着工具栏的折叠和展开自动调整工具栏标题字体大小的功能。`parallax`（视差）模式允许应用栏中的指定内容在折叠时淡出视图，而\
  \ `pin`（固定）模式则允许应用栏的元素在收缩期间保持在固定位置。\n\n可以使用使用 `scrim`（遮罩）选项，用于指定工具栏在折叠序列期间过渡的颜色。\n\
  \n为了看到这些功能的实际效果，将修改 `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout`\
  \ 类，并添加一个 `ImageView` 以更好地演示 `parallax` 模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级由图\
  \ 50-6 中的图表表示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n图 50-6\n\n在 Code 模式下将\
  \ `activity_main.xml` 文件加载到布局编辑器工具中，并修改布局使其读取内容如下：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n \
  \   xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.CardDemo.AppBarOverlay\">\n\
  \        <com.google.android.material.appbar.CollapsingToolbarLayout\n         \
  \   android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:expandedTitleMarginBottom=\"30dp\"\n            app:expandedTitleMarginStart=\"\
  15dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <androidx.appcompat.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n                app:layout_collapseMode=\"\
  pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include\n        android:id=\"\
  @+id/contentMain\"\n        layout=\"@layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n除了添加新元素外，还移除了背景颜色设置。这种更改允许应用栏中显示更多图像。使用文件系统导航器，在项目窗口中找到 `app` -> `res` ->\
  \ `drawable` 条目并选择它。\n\n运行时，应用栏应如图 50-7 所示：\n\n![](img/as_layout_image.jpg)\n图 50-7\n\
  \n向上滚动列表将导致应用栏逐渐折叠。在收缩期间，图像将淡入 `scrim` 属性定义的颜色，同时标题文本字体大小按比例减小，直到只剩下工具栏：\n\n![](img/as_layout_image_collapsed.jpg)\n\
  图 50-8\n\n在滚动初始阶段，工具栏保持可见（但如果继续向上滚动，工具栏也会收回），因为 `activity_main.xml` 文件中的工具栏元素被配置为\
  \ `pin` 模式：\n\n`app:layout_collapseMode=\"pin\"`\n\n如果将压缩模式设置为 `parallax`，工具栏将与图像一起收回。\n\
  \n继续向上滚动将导致工具栏也折叠，只留状态栏可见：\n\n![](img/as_layout_image_fully_collapsed.jpg)\n图 50-9\n\
  \n由于 `CollapsingToolbarLayout` 元素的滚动标志属性包含了 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。\n\
  \n为了固定工具栏使其在向上滚动过程中不再收回，将 `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的\
  \ `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`：\n\n```xml\n\
  <com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"@+id/collapsing_toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 50.5 修改标题和罩颜色\n\n作为最后一个任务，编辑\
  \ `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局管理器实例上的标题文本，并设置不同的遮罩颜色（注意，遮罩颜色也可以在布局资源文件中设置）：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n```\n\n\n\n\n\n## 50.6 总结\n出现在大多数\
  \ Android 应用程序顶部的应用栏（app bar）可以由多个不同的元素组成，包括工具栏、选项卡布局甚至图像视图。当嵌入在 `CoordinatorLayout`\
  \ 父容器时，可以使用许多不同的选项来控制应用栏响应 Activity 中主内容滚动事件的行为。为了对这种行为进行更细的控制，`CollapsingToolbar`\
  \ 管理器提供了一系列额外的控制级别，用于控制应用栏内容随滚动进行展开和收缩的方式。\n\n# 51 Android Studio 主列表/详情流教程\n本章将在详细探索\
  \ Android Studio 自带的主列表/详情（Primary/Detail）模板的组成元素之前，先解释主列表/详情用户界面设计的概念。随后，将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的各个步骤。\n\
  \n## 51.1 主列表/详情流\n主列表/详情流是一种界面设计概念，其中向用户显示项目列表（称为主列表）。当用户从列表中选择一个项目时，系统便会在详情窗格（detail\
  \ pane）中向用户展示与该项目相关的额外信息。例如，一个电子邮件应用程序可能包含一个接收消息的主列表，其中包含发送者地址和邮件主题。当从主列表中选择一条消息后，邮件正文将出现在详情窗格中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左侧的窄垂直面板中。屏幕的其余部分留给详情窗格，这种布局被称为双窗模式（two-pane\
  \ mode）。例如，图 51-1 显示了主列表/详情的双窗布局，其中列出了主项目并将项目一的内容显示在详情窗格中：\n\n![](img/as_detail_flow_tablet.jpg)\n\
  图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情窗格出现在独立的屏幕上，当用户从主列表中进行选择时就会显示。在这种模式下，详情屏幕包含一个返回主列表的操作栏条目。例如，图\
  \ 51-2 展示了 4 英 手机屏幕上针对同一项目列表的主界面和详情界面：\n\n![](img/as_detail_flow_phone.jpg)\n图 51-2\n\
  \n## 51.2 创建主列表/详情流 Activity\n在本章的下一节中，将详细介绍组成主列表/详情模板的各种元素。最佳做法是使用主列表/详情模板创建一个项目，并在学习这些信息时使用它。该项目随后将作为章节末尾教程的基础。\n\
  \n从欢迎界面选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Primary/Detail Flow` 模板。\n\
  \n在 `Name` 字段中输入 `PrimaryDetailFlow` 并指定 `com.ebookfrenzy.detailflow` 为包名。在点击 `Finish`\
  \ 按钮之前，将最低 API （Minimum API level）改为 `API 26: Android 8.0 (Oreo)`并将语言（Language）改为\
  \ `Java`。\n\n## 51.3 修改主列表/详情模板\n虽然主列表/详情流模板的结构最初看起来很复杂，但事实证明，模板提供的许多功能对于大多数主列表/详情需求可以保持不变。在本章的剩余部分中，将修改\
  \ `PrimaryDetailFlow` 项目，使主列表显示网站列表，并将详情窗格更改为包含 `WebView` 对象而不是当前的 `TextView`。当用户选择某个网站时，相应的网页随后将在详情窗格中加载并显示。\n\
  \n## 51.4 更改内容\n当前示例的内容由 `PlaceholderContent` 文件定义。因此，首先选择 `PlaceholderContent.java`（位于\
  \ Project `窗口中的 `app` -> `com.ebookfrenzy.detailflow` -> `placeholder`）并查看代码。文件底部有一个\
  \ `PlaceholderItem` 类的声明，它目前能够存储表示内容和详情的三个 对象。相反，更新后的项目需要每个对象包含 ID、网站名称字符串以及相应的\
  \ URL。为了添加这些功能，请修改 `PlaceholderItem` 类如下：\n\n```java\npublic static class PlaceholderItem\
  \ {\n    public String id;\n    public String website_name;\n    public String website_url;\n\
  \n    public PlaceholderItem(String id, String website_name, String website_url)\
  \ {\n        this.id = id;\n        this.website_name = website_name;\n        this.website_url\
  \ = website_url;\n    }\n\n    @Override\n    public String toString() {\n     \
  \   return website_name;\n    }\n}\n```\n\n注意，封装 `PlaceholderContent` 类包含一个 `for`\
  \ 循环，通过多次调用名为 `createPlaceholderItem()` 和 `makeDetails()` 的方法来添加 25 个项目。这些代码将不再需要，应从类中删除如下：\n\
  \n```java\npublic static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String,\
  \ PlaceholderItem>();\nprivate static int COUNT = 25;\nstatic {\n    // 添加一些示例项目。\n\
  \    for (int i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n\
  \    }\n}\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改以用所需的网站数据初始化数据模型：\n\n```java\npublic\
  \ static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String, PlaceholderItem>();\n\
  static {\n    // 添加 3 个示例项目。\n    addItem(new PlaceholderItem(\"1\", \"eBookFrenzy\"\
  , \"https://www.ebookfrenzy.com\"));\n    addItem(new PlaceholderItem(\"2\", \"\
  Amazon\", \"https://www.amazon.com\"));\n    addItem(new PlaceholderItem(\"3\",\
  \ \"New York Times\", \"https://www.nytimes.com\"));\n}\n```\n\n\n\n\n代码现在利用修改后的\
  \ `PlaceholderItem` 类来存储每个项的 `ID`、网站名称和 `URL`。\n\n## 51.5 更改详情窗\n\n详情窗的布局（用户从主列表中选择一个项目时显示的屏幕）包含在\
  \ `activity_item_detail.xml` 文件中，该文件包含一个 `FrameContainerView` 实例，用于显示实际的详情内容。如果应用以单窗模式显示，则框架容器将显示\
  \ `fragment_item_detail.xml` 文件中的布局，而多窗模式将显示 `fragment_item_detail.xml (sw600dp)`\
  \ 布局。\n\nAndroid Studio 为 `fragment_item_detail.xml` 提供的模板布局包含一个 `Coordinator` 布局，其中包含一个应用栏、工具栏、浮动按钮和一个\
  \ `text` 视图。在本示例中，我们只需要显示一个 `WebView`，因此打开此文件并删除布局中 `item_detail_container` 视图以外的所有视图。实现此操作的最简单方法如下所示，在\
  \ `Component Tree`（组件树）中选择所有不需要的视图，然后按键盘上的删除键：\n\n![](img/as_primary_detail_component_tree.jpg)\n\
  \n图 51-3\n\n从 `Palette`（调色板）的 `Widgets` 部分拖出一个 `WebView` 对象并将其到布局画布中心，并将 `id` 更改为\
  \ `website_detail`。\n\n接下来，编辑 `fragment_item_detail.xml (sw600dp)` 文件，在将 `WebView`\
  \ 放到布局之前删除默认的 `TextView` 实例，再次将 `id` 更改为 `website_detail`。这两个文件的布局现在应该类似于 图 51-4：\n\
  \n![](img/as_3.5_master_detail_webview.jpg)\n\n图 51-4\n\n## 51.6 修改 ItemDetailFragment\
  \ 类\n\n此时，用户界面详情窗已经修改，但相应的 Java 类仍设计用于处理 `TextView` 对象而不是 `WebView`。通过在 `Project`\
  \ 工具窗口中双击 `ItemDetailFragment.java` 文件来加载该类的源代码。\n\n要加载与当前所选项目对应的网页 URL，只需要更改几行代码。完成此更改后，代码读取如下：\n\
  \n```java\n.\n.\n\nimport android.webkit.WebResourceRequest;\n\nimport android.webkit.WebView;\n\
  \nimport android.webkit.WebViewClient;\n\n.\n.\n\npublic class ItemDetailFragment\
  \ extends Fragment {\n\n.\n.\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                             Bundle savedInstanceState)\
  \ {\n        binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\
  \        View rootView = binding.getRoot();\n        mToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \        mTextView = binding.ItemDetail;\n        updateContent();\n        rootView.setOnDragListener(dragListener);\n\
  \        return rootView;\n    }\n.\n.\n    private void updateContent() {\n   \
  \     if (mItem != null) {\n            binding.ItemDetail.setWebViewClient(new\
  \ WebViewClient(){\n                @Override\n                public boolean shouldOverrideUrlLoading(\n\
  \                        WebView view, WebResourceRequest request) {\n         \
  \           return super.shouldOverrideUrlLoading(\n                           \
  \                  view, request);\n                }\n            });\n       \
  \     binding.ItemDetail.loadUrl(mItem.getUrl());\n        }\n    }\n}\n```\n\n\n\
  \n\nIntent（`android.content.Intent`）是一种消息系统，允许一个活动（activity）启动另一个活动。例如，一个活动可以发出一个\
  \ Intent 来请求启动同一个应用程序内的另一个活动。然而，Intent 的概念超出了此范围，它允许一个活动请求设备上任何其他已配置权限并适当注册的活动提供的服务。\n\
  \n例如，考虑应用程序中的一个需要加载并向用户显示网页的活动。该应用程序不需要在内部包含一个第二个活动来执行此任务，代码可以简单地向 Android 运行时发送一个\
  \ Intent，请求任何已注册显示网页能力的活动提供服务。运行时系统会将该请求与设备上可用的活动进行匹配，并启动匹配的活动；或者在存在多个匹配项的情况下，允许用户决定使用哪一个活动。\n\
  \nIntent 还允许将数据从发送方活动传输到接收方活动。例如在之前描述的场景中，发送方活动需要将显示的网页 URL 发送给第二个活动。同样，接收方活动也可以配置为在完成所需任务后将数据返回给发送方活动。\n\
  \n虽然在后面的章节中才会介绍，但值得强调的是，Intent 除了启动活动外，还用于启动和通信服务（services）以及广播接收器（broadcast receivers）。\n\
  \nIntent 分为显式（explicit）或隐式（implicit）。\n\n## 52.2 显式 Intent\n\n显式 Intent 通过引用目标活动的组件名称（实际上是该类名）来请求启动特定的活动。当启动与发送方活动位于同一个应用程序的活动时，这种方法最为常见（因为开发者知道该类名）。\n\
  \n显式 Intent 通过创建 `Intent` 类的实例来发出，并时传入活动上下文（activity context）和要启动的活动的组件名称。然后调用 `startActivity()`\
  \ 方法，并将 Intent 对象作为参数传递。例如，以下代码段发出了一个启动类名为 `ActivityB` 活动的 Intent：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n可以通过调用\
  \ Intent 对象的 `putExtra()` 方法，在启动它之前将数据添加到 Intent 对象中，从而将其传输到接收方活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ Intent 添加了键键为“myString”和“myInt”的字符串值和整数值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为 `Bundle` 对象的一部分接收这些数据，该对象可以通过调用\
  \ `getIntent().getExtras()` 获得。`Activity` 类的 `getIntent()` 方法返回启动该活动的 Intent，而 `Intent`\
  \ 类的 `getExtras()` 方法返回一个包含数据的 `Bundle` 对象。例如，要提取传递给 `ActivityB` 的数据值：\n\n```java\n\
  Bundle extras = getIntent().getExtras();\nif (extras != null) {\n    String myString\
  \ = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"myInt\");\n\
  }\n```\n\n当使用 Intent 启动同一应用程序内的其他活动时，这些活动必须列在应用程序清单文件（application manifest file）中。以下\
  \ `AndroidManifest.xml` 内容对于包含名为 `ActivityA` 和 `ActivityB` 活动的应用程序配置是正确的：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 52.3 从活动返回数据\n\n\
  如上一节示例所示，虽然数据传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们将称为 `ActivityA`）。然而，这可以通过将 `ActivityB`\
  \ 作为子活动（sub-activity）来实现。通过调用 `registerForActivityResult()` 创建 `ActivityResultLauncher`\
  \ 实例，并传递一个回调处理器。代码通常读取如下：\n\n```java\nActivityResultLauncher<Intent> startForResult\
  \ = registerForActivityResult(\n    new ActivityResultContracts.StartForResult(),\n\
  \    new ActivityCallback<<>() {\n        @Override\n        public void onResult(ActivityResult\
  \ result) {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n \
  \               Intent data = result.getData();\n                // 处理返回数据的代码\n\
  \            }\n        }\n    });\n```\n\n一旦启动器准备就绪，就可以调用它并传递要启动的 Intent：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n```\n\n\
  要向父活动返回数据，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含数据的新 Intent 对象，然后调用外层活动的 `setResult()`\
  \ 方法，传入结果代码和 Intent。结果代码通常为 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求自定义值。如果子活动崩溃，父活动将接收到\
  \ `RESULT_CANCELED` 结果代码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法实现：\n\n```java\npublic\
  \ void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString1\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n## 52.4 隐式 Intent\n\n显式 Intent 引用要启动活动的类名，隐式 Intent 通过指定要执行的操作和接收方活动处理的数据类型来识别要启动的活动。例如，一个\
  \ `ACTION_VIEW` 类型的的操作配以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动具备浏览器功能的活动。以下隐式\
  \ Intent 在 Android 设备上执行时，会导致指定的网页在网络浏览器活动中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n\
  \    Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\
  \n\n\n\n\n当活动发布上述隐式意图时，Android 系统将通过称为“意图解析”（intent resolution）的过程，在设备上搜索注册了能够处理\
  \ `http` 方案数据的 `ACTION_VIEW` 请求的活动。在系统使用隐式意图启动活动之前，该活动必须已经经过用户验证或启用。如果这两个条件都不满足，则该活动不会通过该意图被启动。在探索这两个选项\
  \ 之前，我们首先需要讨论一下意图过滤器（intent filters）。\n\n## 52.5 使用意图过滤器\n\n意图过滤器是活动向 Android 意图解析过程“宣称”其支持的操作和数据处理能力的机制。这些声明还包含了执行链接验证过程所需的设置。以下\
  \ `AndroidManifest.xml` 文件展示了名为 `MyWebView` 的应用中一个名为 `WebActivity` 的活动的配置，并包含了配置适当的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest>\n    <application\n\
  \        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyWebView\"\
  >\n        <activity\n            android:name=\"WebActivity\"\n            android:exported=\"\
  true\">\n            <intent-filter android:autoVerify=\"true\">\n             \
  \   <action android:name=\"android.intent.action.VIEW\" />\n                <category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n                <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n                <data android:scheme=\"\
  https\" />\n                <data android:host=\"www.ebookfrenzy.com\"/>\n     \
  \       </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n该清单文件配置了 `WebActivity` 活动，当意图包含 `https://www.ebookfrenzy.com` URL 时，响应来自另一个活动的隐式意图并启动它。例如，以下代码将启动\
  \ `WebActivity` 活动（假设 `MyWebView` 应用已通过用户验证或启用作为支持链接）：\n\n```java\nIntent intent\
  \ = new Intent(Intent.ACTION_VIEW,\n        Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n## 52.6 自动链接验证\n\n使用网页链接启动 Android 设备上的活动被认为存在潜在的安全风险。为了最大限度地降低这种风险，用于启动意图的链接必须是自动验证的，或者由用户在设备上手动添加为支持链接。要启用自动验证，目标活动中相应的意图声明必须将\
  \ `autoVerify` 设置为 `true`，如下：\n\n```xml\n<intent-filter android:autoVerify=\"true\"\
  >\n    ...\n</intent-filter>\n```\n\n接下来，链接 URL 需要与应用链接所基于的网站相关。这是通过创建一个名为 `assetlinks.json`\
  \ 的数字资产链接文件并将其安装网站的 `.well-known` 文件夹中来实现。\n\n数字资产链接文件包含一个关系声明（relation statement），用于授权目标应用使用网站的链接\
  \ URL 进行启动，以及一个目标声明（target statement），用于声明该项目的配套应用包名和 SHA-256 证书指纹。一个典型的资产链接文件内容可能如下：\n\
  \n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n\
  \  \"target\": {\n    \"namespace\": \"android_app\",\n    \"package_name\": \"\
  com.ebookfrenzy.mywebview\",\n    \"sha256_cert_fingerprints\": [\n      \"<your\
  \ certificate fingerprint here>\"\n    ]\n  }\n}]\n```\n\n注意，你可以手动创建此文件，也可以使用在线工具工具生成：`https://developers.google.com/digital-asset-links/tools/generator`。在处理\
  \ Android 开发时，`namespace` 值始终设置为 `android_app`，而 `package_name` 对应于要启动的应用。最后，`certificate\
  \ fingerprint` 是构建应用所需的哈希值。当你测试应用时，这将是包含在 `debug.keystore` 文件中的证书。在 Windows 系统上，Android\
  \ Studio 将此文件存储在以下位置：`\\Users\\<用户名>\\.android\\debug.keystore`。在 macOS 和 Linux\
  \ 系统上，可以在以下位置找到文件：`$HOME/.android/debug.keystore`。\n\n一旦找到该文件，就可以在终端或命令窗口中运行以下命令获取\
  \ SHA-256 指纹：\n\n```bash\nkeytool -list -v -keystore <path to debug.keystore file>\n\
  ```\n\n当提示密码时，输入 `android`，随后将出现包含 SHA256 指纹的输出：\n\n```\nCertificate fingerprints:\n\
  \    SHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C\n    SHA256:\
  \ 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C\n\
  ```\n\n当你准备好构建应用时，为了查看链接是否已验证，可以在终端中运行以下命令：\n\n```\nadb shell pm get-links cur\n\
  ```\n\n输出将包含链接已验证的确认：\n\n```\ncom.example.mywebview:\n  ID: e39bca-bf58-4cfc-8c7b-d1a3b065ec\n\
  \  Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C]\n\
  \  Domain verification state:\n    www.ebookfrenzy.com: verified\n  User 0:\n  \
  \  Verification link allowed: true\n  Selection state:\n    Disabled: www.ebookfrenzy.com\n\
  ```\n\n如果你想通过设置应用检查状态，可以按照以下步骤操作：\n\n1. 打开设置。\n2. 选择“应用”。\n3. 在已应用列表中找到并选择你的应用。\n\
  4. 在应用的设置页面上，选择“默认打开”选项。\n\n一旦显示，页面将指示链接已验证，如图 52-1 所示：\n\n![](img/as_verified_link.jpg)\n\
  图 52-1\n\n要查看哪些链接已验证，点击上图中箭头指示的信息按钮以显示以下面板：\n\n![](img/as_verified_links.jpg)\n\
  图 52-2\n\n`assetlinks.json` 文件可以包含多个数字资产链接，从而允许单个网站关联到多个应用。如果你无法使用自动链接验证，你需要在应用中添加代码来提示用户手动启用链接。\n\
  \n## 52.7 手动启用链接\n\n在无法通过上述步骤自动验证链接的情况下，唯一的选项是请求用户手动启用应用链接。这涉及启动目标应用的“默认打开”屏幕，用户可以在该处启用链接。由于突然弹出“默认打开”屏幕可能会让普通用户感到困惑，建议在启动设置应用之前显示解释性的对话框。\n\
  \n为了给用户手动启用链接的选项，在尝试启动意图之前需要执行以下代码：\n\n```java\n// 此处编写显示需要启用链接的对话框的代码\n```\n\n\n\
  \n\n\n```java\nIntent intent = new Intent(\n        Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \        Uri.parse(\"package:com.ebookfrenzy.mywebview\"));\nstartActivity(intent);\n\
  ```\n上面的示例代码将显示我们目标 MyWebView 应用的“默认打开”设置屏幕，用户可以在那里点击“添加链接”按钮：\n\n![](img/as_links_add_link.jpg)\n\
  图 52-3\n\n一旦点击，将会出现一个对话框，其初始化时使用了通过 `intent` 的链接。可以通过勾选 图 52-4 所示的复选框来启用：\n\n![](img/as_adding_support_link.jpg)\n\
  图 52-4\n\n## 52.8 检查 Intent 的可用性\n\n通常假设某个 activity 对于特定的 `intent` 是可用的是不明智的，特别是因为缺少匹配的动作（action）通常会导致应用程序崩溃。幸运的是，在将\
  \ `intent` 发送到运行时系统之前，可以识别 activity 对于特定 `intent` 的可用性。可以使用以下方法根据指定的 `intent` 动作类型来识别\
  \ activity 的可用性：\n\n```java\npublic static boolean isIntentAvailable(Context context,\
  \ String action) {\n    final PackageManager packageManager = context.getPackageManager();\n\
  \    final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n \
  \           packageManager.queryIntentActivities(intent,\n                    PackageManager.MATCH_DEFAULT_ONLY);\n\
  \    return list.size() > 0;\n}\n```\n\n## 52.9 总结\n\n`Intents` 是一个 Android activity\
  \ 启动另一个 activity 的消息机制。显式意（explicit intent）通过通过类名引用接收 activity 来引用要启动的特定 activity。显式意通常（但不仅限于）用于启动包含在同一个应用程序中的\
  \ activity。隐式意（implicit intent）指定了要执行的动作和要处理的数据类型，并让 Android 运行时找到一个匹配的 activity\
  \ 进行启动。隐式意通常用于启动位于不同应用程序中的 activity。\n\n在使用隐式意时，安全限制要求在启动 `intent` 之前，包含 `intent`\
  \ 目标 activity 的应用必须先经过自动验证或由用户手动启用。自动验证涉及在与链接 URL 对应的网站上放置数字资产链接文件（Digital Assets\
  \ Link file）。\n\nactivity 可以通过以键值对的形式封装在 `intent` 对象中，将数据发送给接收 activity。只有当 activity\
  \ 作为发送 activity 的子 activity 启动时，才能从该 activity 返回数据。\n\nActivity 通过在应用程序清单文件中指定 `intent-filters`\
  \ 向 Android intent 解析过程宣告其功能。发送和接收 activity 必须请求适当的权限以执行如访问设备联系人数据库或互联网等任务。\n\n\
  在涵盖 `intents` 的理论后，接下来的章节将通过在 Android Studio 中创建示例，将显式意和隐式意投入实践。\n\n## 53. Android\
  \ 显式意 – 实例演示\n\n标题为 Android Intent 概览 的章节涵盖了使用 `intents` 启动 activity 的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\
  \n在本章创建的 Android Studio 示例项目将演示如何使用显式意启动 activity，包括在发送和接收 activity 之间传输数据。下一章（Android\
  \ 隐式意 – 实例演示]）将演示隐式意的使用。\n\n### 53.1 创建显式意示例应用程序\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Activity（空活动）模板。\n\n在 Name（名称）字段中输入 `ExplicitIntent`，并指定\
  \ `com.ebookfrenzy.explicitintent` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低\
  \ 级别）设置为 `API 26`: Android 8.0 (Oreo)，并将 Language（语言）菜单更改为 `Java`。按照节 11.8 将项目迁移到\
  \ View Binding 中概述的步骤，将项目转换为使用 view binding。\n\n### 53.2 设计 MainActivity 用户界面布局\n\
  \n`MainActivity` 的用户界面将由一个 `ConstraintLayout` 视图组成，其中包含名为 `editText1`、`textView1`\
  \ 和 `button1` 的 `EditText`（纯文本）、`TextView` 和 `Button` 视图。使用 Project 工具窗口，找到 `MainActivity`\
  \ 的 `activity_main.xml` 资源文件（位于 `app -> res -> layout` 下），并双击将其加载到 Android Studio\
  \ Layout Editor 工具中。选择默认的“Hello World!” `TextView` 并使用 Attributes 工具窗口为其分配 ID `textView1`。\n\
  \n从调板中拖入一个 `Button` 对象并将其置于水平居中且位于 `TextView` 的底边缘下方。更改 `text` 属性使其显示为“Send Text”，并配置\
  \ `onClick` 属性调用名为 `sendText` 的方法。\n\n接下来，添加一个 Plain Text（纯文本）对象，使其水平居中并位于 `TextView`\
  \ 的顶边缘上方。使用 Attributes 工具窗口删除分配给 text 属性的“Name”字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的\
  \ Infer constraints（推断约束）按钮以添加适当的约束：\n\n![](img/Image2434.jpg)\n图 53-1\n\n最后，点击\
  \ Layout Editor 右角的红色警告按钮，并在生成的面板将“Send Text”字符串提取到名为 `send_text` 的资源中。布局完成后，用户界面应类似于\
  \ 图 53-2：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n图 53-2\n\n### 53.3 创建第二个 Activity\
  \ 类\n\n当用户触摸“Send Text”按钮时，将发出 `intent` 请求启动一个可以在其中输入响应的第二个 activity。因此，下一步是创建第二个\
  \ activity。在 Project 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.explicitintent`\
  \ 包名，选择 New -> Activity -> Empty Activity 选项以显示如 图 53-3 所示的 New Activity 对话框：\n\n\
  ![](img/as_4.2_intent_new_java_activity.jpg)\n图 53-3\n\n在 Activity Name 和 Title\
  \ 字段中输入 `SecondActivity`，命名布局文件为 `activity_second`，由于此 activity 不会在应用程序启动时启动（它将由\
  \ `MainActivity` 通过 `intent` 启动），因此在点击 Finish 按钮之前，确保禁用了 Launcher Activity（启动活动）选项非常重要。\n\
  \n### 53.4 设计 SecondActivity 用户界面布局\n\n第二个 activity 用户界面所需的元素是一个纯文本 `EditText`、`TextView`\
  \ 和 `Button` 视图。根据这些要求，将 `activity_second.xml` 布局加载到 Layout Editor 工具中并添加视图。\n\n\
  在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，且 `TextView` 和 `EditText`\
  \ 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于 图 53-4。注意按钮上的文本（显示为“Return Text”）已提取到名为\
  \ `return_text` 的字符串资源。\n\n布局完成后，点击工具栏上的 Infer constraints 按钮，为布局添加必要的约束。\n\n\n\n\
  \n\n![](img/as_4.1_explicit_intent_ui_2.jpg)\n\n图 53-4\n\n## 53.5 检查应用清单文件\n\n为了让\
  \ `MainActivity` 能够使用意图启动 `SecondActivity`，`AndroidManifest.xml` 文件中必须存在 `SecondActivity`\
  \ 的条目。在 Project 工具窗口（`app` -> `manifests`）中找到该文件，双击将其加载到编辑器中并验证 Android Studio 是否已自动为活动添加了条目：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.ExplicitIntent\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".SecondActivity\"\n       \
  \     android:exported=\"false\" />\n        <activity\n            android:name=\"\
  .MainActivity\"\n            android:exported=\"true\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n第二个活动已经创建并列在清单文件中，现在是时候在 `MainActivity` 类中编写代码来发出意图了。\n\n### 53.6 创建意图\n\n\
  `MainActivity` 的目标是在用户点击“Send Text”按钮时创建并启动意图。作为意图创建过程的一部分，用户在 `EditText` 中输入的查询字符串将作为键值对被添加到意图对象中。当创建\
  \ `MainActivity` 的用户界面布局时，按钮对象被配置为在用户“点击”时调用名为 `sendText()` 的方法。现在需要如下将此方法添加到 `MainActivity`\
  \ 类 `MainActivity.java` 源文件中：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \n.\n.\n\nimport android.content.Intent;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    public void sendText(View view) {\n        Intent\
  \ i = new Intent(this, SecondActivity.class);\n        String myString = binding.editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n        startActivity(i);\n    }\n\
  }\n```\n\n`sendText()` 方法的代码遵循了 \"Android Intent 概述\"]中概述的技术。首先，创建一个新的 `Intent`\
  \ 实例，并将当前活动和 `SecondActivity` 的类名作为参数传递。接下来，将输入 `EditText` 对象的文本作为键值对添加到意图对象中，并通过调用\
  \ `startActivity()` 启动意图，将意图对象作为参数传递。\n\n编译并运行应用程序，点击“Send Text”按钮启动 `SecondActivity`。使用返回按钮（位于显示器底部工具栏中）或从屏幕边缘向右滑动返回\
  \ `MainActivity` 屏幕。\n\n## 53.7 提取意图数据\n\n现在 `SecondActivity` 已从 `MainActivity`\
  \ 启动，下一步是提取意图中包含的 `String` 值，并将其赋值给 `SecondActivity` 用户界面中的 `TextView` 对象。这涉及在适配活动以使用视图绑定之外，向\
  \ `SecondActivity.java` 源文件 `SecondActivity` 的 `onCreate()` 方法添加一些代码：\n\n```java\n\
  package.ebookfrenzy.explicitintent;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import com.ebookfrenzy.explicitintent.databinding.ActivityBinding;\n\npublic class\
  \ SecondActivity extends AppCompatActivity {\n    private ActivityBinding binding;\n\
  \    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivityBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些。现在消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n## 53.8 将 SecondActivity 作为子活动启动\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerActivityResult()` 并声明一个回调处理器，在 `SecondActivity` 返回时调用。该回调将提取 `SecondActivity`\
  \ 返回的数据并显示在 `textView1` 上。\n\n`registerActivityResult()` 返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 中调用它来启动意图。编辑 `MainActivity.java` 文件使其如下：\n\n```java\n.\n.\n\
  import android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n.\n.\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    String returnString = data.getExtras().getString(\"\
  returnData\");\n                    binding.textView1.setText(returnString);\n \
  \               }\n            }\n        });\n\n    public void sendText(View view)\
  \ {\n        Intent i = new Intent(this, SecondActivity.class);\n        String\
  \ myString = binding.editText1.getText().toString();\n        i.putExtra(\"qString\"\
  , myString);\n        startForResult.launch(i);\n    }\n}\n```\n\n## 53.9 从子活动返回数据\n\
  \n现在 `SecondActivity` 作为 `MainActivity` 的子活动启动，而 `MainActivity` 反反也经过修改以处理来自 `SecondActivity`\
  \ 的数据。剩下的就是修改 `SecondActivity.java` 以实现 `finish()` 方法并为 `returnText()` 方法添加代码，该方法在点击“Return\
  \ Text”按钮时调用。`finish()` 方法在活动退出时触发（例如当用户选择设备上的返回键时）：\n\n```java\npublic void returnText(View\
  \ view) {\n    finish();\n}\n\n@Override\npublic void finish() {\n    Intent data\
  \ = new Intent();\n    String returnString = binding.editText2.getText().toString();\n\
  \    data.putExtra(\"returnData\", returnString);\n    setResult(RESULT_OK, data);\n\
  \    super.finish();\n}\n```\n\n### 53.10 测试应用程序\n\n\n\n\n\n编译并运行应用程序，在 `MainActivity`\
  \ 的文本字段中输入一个问题并点击“Send Text”按钮。当 `SecondActivity` 出现时，向 `EditText` 视图输入文本，并使用返回按钮或“Return\
  \ Text”按钮返回 `MainActivity`，此时响应将显示在文本视图对象中。\n\n## 53.11 总结\n\n在上一节介绍了意图（intents）的基础知识后，本章的目标是在\
  \ Android Studio 中完成一个应用程序项目，用以演示显式意图（explicit intents）的使用，以及父活动与子活动之间数据传输的概念。下一章将通过一个示例来演示隐式意图（implicit\
  \ intents）的作用。\n\n# 54. Android 隐式意图 – 实例演示\n\n在本章中，将在 Android Studio 中创建一个示例应用程序，用于演示隐式意图的实际实现。其目标是创建并发送一个意图，请求加载并向用户显示特定网页的内容。由于示例应用程序本身不包含能够执行此任务的活动，因此将发布一个隐式意图，以便触发\
  \ Android 意图解析算法，从另一个应用程序中识别并启动合适的活动。这最可能是 Android 操作系统自带的 Chrome 浏览器活动。\n\n在成功启动内置浏览器后，将创建一个新项目，该项目也包含一个能够显示网页的活动。它将被安装到设备或模拟器上，并用于演示隐式意图的使用和链接验证。\n\
  \n### 54.1 创建 Android Studio 隐式意图示例项目\n\n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next`\
  \ 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `ImplicitIntent` 并指定 `com.ebookfrenzy.implicitintent`\
  \ 为包名。由于此示例将使用仅限较新 Android 版本中的功能，在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API\
  \ 31: Android 12.0 (S)`，并将 `Language` 菜单改为 `Java`。\n\n### 54.2 设计用户界面\n\n`MainActivity`\
  \ 类的用户界面非常简单，仅由 `ConstraintLayout` 和两个 `Button` 对象组成。在 `Project` 工具窗口中，找到 `app ->\
  \ res -> layout -> activity_main.xml` 文件并双击它将其加载到 `Layout Editor` 工具中。\n\n删除默认的\
  \ `TextView`，并在启用 `Autoconnect` 模式的情况下，将 `Button` 组件放置在布局中，使其显示所示：\n\n![](img/as_implicit_intent_ui.jpg)\n\
  \n图 54-1\n\n将按钮上的文本分别设置为 `Show Web Page` 和 `Enable Links`，并将文本提取到字符串资源。依次选择每个 `Button`，使用\
  \ `Attributes` 工具窗口配置 `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 的方法。\n\n\
  ### 54.3 创建隐式意图\n\n如上述，隐式意图将在名为 `showWebPage()` 的方法内部创建并发布，该方法反过来需要在 `MainActivity`\
  \ 类中实现，其代码位于 `MainActivity.java` 源文件中。在 `Project` 工具窗口中找到该文件并双击它将其加载到编辑面板。加载后，修改代码以添加\
  \ `showWebPage()` 和 `enableLink()` 方法以及一些必要的导入：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.net.Uri;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_implicit_intent);\n    }\n\n    public\
  \ void showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务实际上非常简单。首先，创建一个新的 `intent` 对象。然而，代码并没有指定意图的类名，而是使用 `ACTION_VIEW` 选项简单指示意图的性质（向用户显示某些内容）。`intent`\
  \ 对象还包含一个要显示的 URL 的 `URI`。这告诉 Android 意图解析系统，该活动正在请求显示网页。然后通过调用 `startActivity()`\
  \ 方法发布该意图。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，运行后，点击 `Show Web Page` 按钮。点击后，应该出现一个浏览器视图并加载\
  \ URL 指定的网页。一个成功的隐式意图现在已经执行完毕。\n\n### 54.4 添加第二个匹配的活动\n\n本章的剩余部分将用于演示当设备上安装了多个符合隐式意图要求的活动时产生的结果。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。首先在\
  \ Android Studio 中创建一个新项目，将应用程序名称设置为 `MyWebView`，使用与创建 `ImplicitIntent` 时相同的 SDK\
  \ 选项，并再次选择 `Empty Activity`。\n\n如果你有一个网站来托管 Digital Asset Links 文件并想尝试自动验证，请在指定包名时使用你的网站\
  \ URL。例如，如果你的网站是 `www.mycompany.com`，则包名需要为：`com.mycompany`\n\n如果你没有网站或计划使用自动验证，请使用以下包名：\n\
  \n`com.ebookfrenzy.webview`\n\n点击 `Finish` 创建项目，然后按照 11.8 节将项目转换为视图绑定（view bindings）。\n\
  \n### 54.5 在 UI 中添加 Web View\n\n新 `MyWebView` 项目中唯一活动的用户界面将包含一个 Android `WebView`\
  \ 组件实例。在 `Project` 工具窗口中，找到包含活动界面描述的 `activity_main.xml` 文件并双击它将其加载到 `Layout Editor`\
  \ 工具中。\n\n在 `Layout Editor` 工具的 `Design` 模式下，选择默认的 `TextView` 组件并通过删除键从布局中移除。\n\n\
  从调板的 `Widgets` 部分拖入 `WebView` 对象到现有的 `ConstraintLayout` 视图中，如图 54-2 所示：\n\n![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\
  \n图 54-2\n\n在继续之前，将 `WebView` 实例的 ID 改为 `webView1` 并使用 `Infer constraints` 按钮添加缺失的约束。\n\
  \n### 54.6 获取意图 URL\n\n当创建显示浏览器窗口的隐式意图对象时，要显示的网页 URL 将封装在意图对象的 `Uri` 对象中。`MainActivity`\
  \ 类 `onCreate()` 方法的任务是从意图对象提取此 `Uri`，将其转换为 `URL` 字符串并赋值给 `WebView` 对象。为了实现此功能，修改\
  \ `MainActivity.java` 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n```\n\n\n\n\n\n```java\n    handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(),\n                          data.getHost(),\n\
  \                          data.getPath());\n        } catch (Exception e) {\n \
  \           e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 方法中的新代码执行了以下任务：\n\n- 获取导致此活动启动的 `intent` \n-\
  \ 从 `intent` 对象中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到 Web View 中，在此过程中将\
  \ `URL` 转换为 `String`\n\n`MyWebView` 项目的编码部分已经完成。剩下的工作是修改清单（manifest）文件。\n\n## 54.7\
  \ 修改 MyWebView 项目的清单文件\n\n在进行测试之前，必须对 `MyWebView` 的清单文件进行多处更改。首先，活动需要请求访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加适当的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，对 `MyWebView` 项目的 `AndroidManifest.xml` 文件中的 `intent filter` 部分进行审查将发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n在上面的 XML 中，`android.intent.action.MAIN` 项表示该活动在没有任何任何数据输入启动时是应用程序的入口点。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该活动应该列在设备的应用程序启动器屏幕中。\n\n由于该活动不需要作为应用程序的入口启动，在没有数据输入（在此情况下为 `URL`）的情况下无法运行，且不需要显示在启动器中，因此该活动的清单文件中不需要\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` 活动的 `intent filter` 需要进行修改，以指示它能够处理针对\
  \ `http` 数据方案的 `ACTION_VIEW` intent 操作。\n\nAndroid 还要求任何能够处理不包含 `MAIN` 和 `LAUNCHER`\
  \ 项的隐式 intent 的活动必须在 `intent filter` 中包含所谓的可浏览（browsable）和默认（default）类别。因此，修改后的\
  \ `intent filter` 部分应如下所示，其中 `<website url>` 被替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你在创建\
  \ `MyWebView` 项目时使用的包名：\n\n```xml\n<intent-filter android:autoVerify=\"true\">\n\
  \    <action android:name=\"android.intent.action.VIEW\" />\n    <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n    <data android:scheme=\"https\" />\n    <data android:host=\"<website url>\"\
  />\n</intent-filter>\n```\n\n结合这些要求，得到了完整的 `AndroidManifest.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n通过双击 Project 工具窗口中的文件名将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载，修改 XML 以匹配上述内容，并记住输入正确的网站 URL。在对清单文件进行适当修改后，新活动就已准备好进行安装。\n\
  \n## 54.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动可以作为隐式 intent 的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件既不包含\
  \ `android.intent.action.MAIN` 包含 `android.intent.category.LAUNCHER` 设置，因此需要指示 Android\
  \ Studio 只安装但不启动应用。要配置此行为，请从工具栏上选择 app -> Edit configurations… 菜单，如图 54-3 所示：\n\n\
  ![](img/as_implicit_intent_edit_config.jpg)\n\n在 Run/Debug Configurations 对话中，将面板中的\
  \ Launch 选项更改为 `Nothing`，然后点击 Apply 并点击 OK：\n\n![](img/as_implicit_intent_nothing.jpg)\n\
  \n配置此设置后，照常运行应用。注意应用已安装，但尚未启动。\n\n### 54.9 测试应用程序\n\n当 `MyWebView` 主活动安装后，再次运行 `ImplicitIntent`\
  \ 并点击 Show Web Page 按钮。注意网页仍然加载到 Chrome 浏览器而不是 `MyWebView` 活动中。这是因为 `MyWebView`\
  \ 活动尚未经过验证或启用以打开链接。要手动启用链接，需要在 `enableLink()` 方法中添加代码。\n\n## 54.10 手动启用链接\n\n在 `enableLink()`\
  \ 方法中，我们现在需要创建并启动一个 intent 来显示 `MyWebView` 应用的默认设置界面。将 `MainActivity.java` 文件加载到代码编辑器并修改\
  \ `enableLink()` 方法如下所示，确保将 `<reverse domain>` 替换为 `com.ebookfrenzy` 或你自己的反域名，取决于你在创建\
  \ `MyWebView` 项目时选择的包名：\n\n```java\nimport android.provider.Settings;\n\npublic\
  \ void enableLink(View view) {\n    Intent intent = new Intent(\n        Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \        Uri.parse(\"package:<reverse domain>.mywebview\"));\n    startActivity(intent);\n\
  }\n```\n\n再次运行 `ImplicitIntent` 应用并点击 Enable Link 按钮以显示 `MyWebView` 应用的默认设置界面：\n\
  \n![](img/as_implicit_intent_open_by_default.jpg)\n\n点击 Add Link 按钮（如上 A 所示），勾选\
  \ URL 旁边的复选框并点击 Add 按钮：\n\n![](img/as_implicit_intent_add_link.jpg)\n\n在返回 `ImplicitIntent`\
  \ 应用之前，确认链接现在已列为支持，然后点击返回箭头（如图 54-5 中的 B 所示）。点击 Open Web Page 现在应该将页面加载到 `MyWebView`\
  \ 应用中而不是 Chrome 浏览器。\n\n\n\n\n如果你选择使用自己的网站 URL 作为 `MyWebView` 的包名，现在可以采取额外步骤进行自动链接验证。首先，从你目前为止一直在测试的设备或模拟器上卸载\
  \ `MyWebView` 应用。在数字资产链接（Digital Asset Links）文件放置在网站之后，我们将重新安装应用以触发验证过程。\n\n按照“Android\
  \ Intent 概述”章节中列出的步骤操作，找到你的 `debug.keystore` 文件，并使用如下方式通过 `keytool` 获取 `SHA-256`\
  \ 证书指纹：\n\n```\nkeytool -list -v -keystore <path to debug.keystore file here>\n\
  ```\n\n接下来，在浏览器中打开以下页面：\n\nhttps://developers.google.com/digital-asset-links/tools/generator\n\
  \n页面加载后，在“托管站点域名”（Hosting site domain）字段中输入你的网站 URL，使用 `com.<domain here>.mywebview`\
  \ 作为应用包名，并将你的 `SHA-256` 指纹输入到“应用包指纹”（App package fingerprint (`SHA256`)）字段中：\n\n\
  ![](img/as_implicit_intent_link_generator.jpg)\n\n图 54-8\n\n点击 `Generate` 按钮显示生成的语句，并将其放在名为\
  \ `assetlinks.json` 的文件中，位于 Web 服务器上名为 `.well-known` 的文件夹中。返回生成器页面并点击 `Test statement`\
  \ 按钮验证文件是否有效且位置正确。\n\n假设测试成功，我们现在可以尝试应用链接了。在你的设备或模拟器上重新安装 `MyWebView` 应用，并使用 `Settings`\
  \ 应用导航到 `MyWebView` 的“默认打开”页面。该页面应该显示链接已验证：\n\n![](img/as_implicit_intent_verified.jpg)\n\
  \n图 54-9\n\n再次运行 `ImplicitIntent` 应用，点击 `Open Web Page` 按钮，并验证页面内容是否出现在 `MyWebView`\
  \ 应用中而不是 `Chrome` 浏览器。\n\n## 54.12 总结\n\n隐式意（Implicit intents）提供了一种机制，一个活动可以通过指定操作类型（以及可选的要执行该操作的数据）来请求另一个活动的服务。然而，要成为隐式意的目标候选者，活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，包括适当的权限和意图过滤器。包含目标活动的应用还必须通过使用数字资产链接文件进行验证，或由用户手动启用。\n\
  \n在本章中，创建了一个示例来演示隐式意的发送、能够处理此类意图的示例活动的创建，以及链接验证过程。\n\n## 55 Android 广播意图和广播接收器\n\
  \n意图（intents）除了提供启动应用活动的机制外，还被用面向系统其他组件广播系统级消息的方法。这涉及广播意图（Broadcast Intents）和广播接收器（Broadcast\
  \ Receivers）的实现，都是本章的主题。\n\n### 55.1 广播意图概述\n\n广播意图是 `Intent` 对象，通过调用 `Activity`\
  \ 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()` 方法进行广播（后者在需要广播结果时使用）。除了在应用组件之间提供消息和事件系统外，广播意图还被\
  \ Android 系统用于通知感兴趣的应用有关关键系统事件（例如外部电源或耳机的连接或断开连接）。\n\n在创建广播意图时，除了可选的数据和分类字符串外，必须包含一个操作字符串（action\
  \ string）。与标准意图一样，数据使用意图对象的 `putExtra()` 方法结合键值对添加到广播意图中。可选的分类字符串可以通过调用 `addCategory()`\
  \ 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码在运行低于\
  \ 3.0 版本的 Android 的设备上将成功启动相应的广播接收器。然而，在较新版本的 Android 中，该 `intent` 将不会被广播接收器接收。这是因为\
  \ Android 3.0 引入了一种启动控制安全措施，防止停止状态的应用组件通过意图启动。如果一个应用刚刚安装且尚未启动过，或者被用户使用设备上的应用程序管理器手动停止了，则该应用被认为处于停止状态。然而，为了解决这个问题，可以在发送\
  \ `intent` 之前添加一个标记，以指示允许该意图启动停止状态应用的组件。该标记是 `FLAG_INCLUDE_STOPPED_PACKAGES`，其用法如下文对之前代码段的适配所示：\n\
  \n```java\nIntent intent = new Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  intent.setAction(\"com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\n\
  sendBroadcast(intent);\n```\n\n### 55.2 广播接收器概述\n\n应用通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展\
  \ `AndroidBroadcastReceiver` 类并重写 `onReceive()` 方法来实现。然后可以注册广播接收器，可以在代码内部（例如在活动内部），也可以在清单文件中。注册的实现涉及创建意图过滤器（intent\
  \ filters）以指示接收器需要的特定意图。这通过引用广播意图的操作字符串来实现。当检测到匹配的广播时，广播接收器的 `onReceive()` 方法会被调用，此时方法有\
  \ 5 秒的时间执行任何任务。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android 运行时会在调用 `onReceive()` 方法之前自动启动广播接收器。\n\
  \n以下代码概述了一个接收器子类：\n\n```java\npackage com.example.broadcastdetector;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n    public MyReceiver() {\n    }\n\n \
  \   @Override\n    public void onReceive(Context context, Intent intent) {\n   \
  \     // 在检测到广播时在此处执行代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加 `<receiver>` 条目。\n\
  \n以下清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.google.com/apk/res/android\"\n    package=\"com.example.broadcastdetector.broadcastdetector\"\
  \n    android:versionCode=\"1\"\n    android:versionName=\"1.0\" >\n\n    <uses-sdk\
  \ android:minSdkVersion=\"17\" />\n\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\" >\n\n        <receiver android:name=\"\
  MyReceiver\" >\n        </receiver>\n\n    </application>\n</manifest>\n```\n\n\
  在 Android 8.0 之前的 Android 版本上运行时，与接收器关联意图过滤器可以放在清单文件的 receiver 元素中，如下所示：\n\n```xml\n\
  <receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n```\n\n\n\n\n\n```xml\n\
  <receiver>\n    <intent-filter>\n        <action android:name=\"com.example.Broadcast\"\
  >\n    </intent-filter>\n</receiver>\n```\n\n在 Android 8.0 或更高版本上，接收器必须通过 `Activity`\
  \ 类的 `registerReceiver()` 方法结合一个适当配置的 `IntentFilter` 对象在代码中进行注册：\n\n```\nIntentFilter\
  \ filter = new IntentFilter(\"com.example.Broadcast\");\nMyReceiver receiver = new\
  \ MyReceiver();\nregisterReceiver(receiver, filter);\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类中的\
  \ `unregisterReceiver()` 方法来取消注册，并时将接收器对象的引用作为参数传递。例如，以下代码将注销上述广播接收器：\n\n```\nunregisterReceiver(receiver);\n\
  ```\n\n需要注意的是，某些系统广播意图只有在代码中注册而不是在清单文件中注册时，才能被广播接收器检测到。查看 Android `Intent` 类文档获取有关系统广播意图及其要求的详细概述，地址如下：[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n### 55.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起的活动无法从任何接收该广播的广播接收器获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按照顺序顺序传递给每个注册了相关兴趣的广播接收器。\n\n调用 `sendOrderedBroadcast()`\
  \ 方法时会传入多个参数，包括另一个广播接收器的引用（称为结果接收器），该接收器将在所有其他广播接收器处理意图后收到通知，以及一组供接收器在其中放置结果数据的数据引用。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用并传递结果数据。\n\n## 55.4 粘性广播意图（Sticky Broadcast Intents）\n\n默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理就会消失。然而，意图可以定义为“粘性”。粘性意图及其包含的数据在完成后仍保留在系统中。存储在粘性广播意图中的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，使用通常的参数（广播接收器引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电池量状态相关的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，并将要移除的广播意图的引用作为参数传递。\n\n### 55.5 广播意图示例\n\
  \n本章的剩余部分将实现一个基于 Android Studio 的广播意图运行示例。首先，将创建一个简单的应用程序，用于发送自定义广播意图。随后，将创建一个相应的广播接收器，当检测到广播时，它将在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开的通知。\n\n### 55.6 创建示例应用程序\n\n从欢迎界面选择“New\
  \ Project”（新建项目）选项，在生成的项目对话框中，点击“Next”（下一步）按钮之前选择“Empty Activity”模板。\n\n在 Name 字段中输入\
  \ `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\n\
  一旦创建了新项目，在 Project 工具窗口的 `app -> res -> layout` 下加载 `activity_main.xml` 布局文件，并在\
  \ Design（设计）模式下使用 Layout Editor 工具，将 `TextView` 对象替换为 `Button` 视图，并设置文本属性使其显示“Send\
  \ Broadcast”。设置好文本值后，按照通常步骤将字符串提取到名为 `send_broadcast` 的资源中。\n\n在布局中仍选中按钮的情况下，在 Attributes（属性）面板中找到\
  \ `onClick` 属性，并配置其调用一个名为 `broadcastIntent` 的方法。\n\n## 55.7 创建并发送广播意图\n\n创建好 `SendBroadcast`\
  \ 应用程序的框架后，现在是实现发送广播意图代码了。这涉及实现之前指定的作为用户界面 `Button` 视图的 `onClick` 目标的 `broadcastIntent()`\
  \ 方法。找到并双击 `MainActivity.java` 文件，并修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n// ... omitted ...\n\n\
  \    public void broadcastIntent(View view)\n    {\n        Intent intent = new\
  \ Intent();\n        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n    \
  \    intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n        sendBroadcast(intent);\n\
  \    }\n}\n```\n\n注意，在此例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章后续章节中创建广播接收器类时，意图过滤器必须匹配此字符串。\n\
  \n发送广播意图的应用程序创建完成。剩下的就是构建匹配的接收器。\n\n### 55.8 创建广播接收器\n\n要创建广播接收器，需要创建一个子自 `BroadcastReceiver`\
  \ 基类的类。在 Project 工具窗口，导航到 `app -> java` 并右键点击包。在生成的菜单中，选择 `New -> Other -> Broadcast\
  \ Receiver` 选项，将类命名为 `MyReceiver`，并确保勾选了 `Exported` 和 `Enabled` 选项。这些设置允许 Android\
  \ 系统在需要时启动接收器，并确保该类可以接收来自其他应用程序的消息。配置完成后，点击 Finish。\n\n一旦创建，Android Studio 将将 `MyReceiver.java`\
  \ 类文件加载到编辑器中，内容如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport\
  \ android.content.BroadcastReceiver;\nimport android.content.Context;\nimport android.content.Intent;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: 此方法在 BroadcastReceiver\
  \ 接收\n        // Intent 广播时被调用。\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n从代码可以看出，Android Studio 为新类生成了模板并为 `onReceive()`\
  \ 方法生成了存根。现在需要对类进行一些更改以实现所需的行为。因此，留在 `MyReceiver.java` 文件中，修改代码如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: 此方法在 BroadcastReceiver\
  \ 接收时被调用。\n    }\n}\n```\n\n\n\n\n\n```java\n// an Intent broadcast.\n\nthrow new\
  \ UnsupportedOperationException(\"Not yet implemented\");\n\nToast.makeText(context,\
  \ \"Broadcast Intent Detected.\",\n             Toast.LENGTH_LONG).show();\n}\n\
  }\n```\n\n广播接收器的代码现在已经完成。\n\n### 55.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并且必须包含一个意过滤器（intent\
  \ filter）来指定接收器感兴趣的广播意图。在上一节创建 `BroadcastReceiver` 类时，Android Studio 自动在清单文件中添加了\
  \ `<receiver>` 元素。因此，剩下的就是在 `MainActivity.java` 文件中添加代码来创建意过滤器并注册接收器：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\n.\n\n.\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.IntentFilter;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    BroadcastReceiver receiver;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n        IntentFilter filter =\
  \ new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n.\n.\n}\n```\n\n在不再需要广播接收器时注销它也是同样重要的：\n\n```java\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    unregisterReceiver(receiver);\n\
  }\n```\n\n### 55.10 测试广播示例\n\n要测试广播发送者和接收器，请在设备或 AVD 上运行 `SendBroadcast` 应用并等待它显示在屏幕上。运行后，点击按钮，此时显示为“Broadcast\
  \ Intent Detected.”的 toast 消息将弹出几秒钟然后消失。\n\n### 55.11 监听系统广播\n\n此示例的最后阶段是修改广播接收器的意过滤器，使其也监听当外部电源从设备断开时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n              \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，值得修改代码，使当前意图的\
  \ action 字符串也显示在 toast 消息中。此字符串可以通过调用作为参数传递给 `onReceive()` 方法的 `intent` 对象的 `getAction()`\
  \ 方法获得：\n\n```java\npublic void onReceive(Context context, Intent intent) {\n  \
  \  String message = \"Broadcast intent detected \"\n                     + intent.getAction();\n\
  \    Toast.makeText(context, message,\n             Toast.LENGTH_LONG).show();\n\
  }\n```\n\n重新安装修改后的 `SendBroadcast` 包来测试接收器。现在，点击 `SendBroadcast` 中的按钮应该会产生一个包含自定义\
  \ action 字符串的新消息：\n\n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\
  \n接下来，移除当前为 Android 设备供电 USB 连接器，此时接收器应该会在 toast 消息中报告以下内容。如果应用运行在模拟器上，请显示扩展控制面板，选择\
  \ Battery 选项并将充电器连接设置设置为 None。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免在每次设备断开电源时都出现此消息，请启动设备上的 `Settings` 应用并选择 `Apps` 选项。从结果列表中选择 `SendBroadcast`\
  \ 应用并点击 `Uninstall` 按钮。\n\n## 55.12 总结\n\n除了提供广播意图的概述外，本章还有一个发送广播意图和接收器的示例。\n\n\
  # 56. Android 绑定服务 – 实例演示\n\n如上一节所述，绑定服务（bound services）为客户端组件之间的通信提供了机制。本章的目标是在开始本地绑定服务示例之前，对绑定服务的概述进行深入介绍。\n\
  \n### 56.1 理解绑定服务\n\n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务，并在绑定后与其交互。\n\n绑定服务是作为\
  \ `Service` 类的子类创建的，并且至少必须实现 `onBind()` 方法。客户端通过调用 `bindService()` 方法绑定到服务。对绑定服务的首次绑定请求将导致调用该服务的\
  \ `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端必须实现一个 `ServiceConnection`\
  \ 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这些方法将分别在客户端-服务器连接建立或断开后被调用。在\
  \ `onServiceConnected()` 方法的情况下，它将传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的全部信息。\n\n###\
  \ 56.2 绑定服务的交互选项\n\n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是与客户端组件同地且私有的本地（也就是说，它在同一个进程中运行，并且对其他应用程序的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。该 `Binder` 对象的实例将由 `onBind()` 方法返回，并随后供客户端组件用于直接访问服务中保存的方法和数据。\n\
  \n在绑定服务不是应用程序本地的情况下（也就是说，它与客户端组件在不同的进程中运行），最佳交互方式是使用 `Messenger/Handler` 实现。\n\n\
  ### 56.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由单个 activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给\
  \ activity，以便显示给用户查看。该绑定服务将是与 activity 同地且私有的。\n\n\n\n\n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `LocalBound`，并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。参考 11.8 Migrating a Project to View Binding 部分中的步骤将项目迁移到\
  \ view binding。\n\n项目创建完成后，下一步是添加一个新类作为绑定服务（bound service）。\n\n### 56.4 向项目添加绑定服务（Bound\
  \ Service）\n\n要向项目添加一个新类，请在 Project 工具窗口中右键点击包名（位于 `app -> java -> com -> ebookfrenzy\
  \ -> localbound` 下），并选择 `New -> Service -> Service` 菜单选项。指定 `BoundService` 为类名，并确保在点击\
  \ `Finish` 创建类之前勾选了 `Exported` 和 `Enabled` 选项。Android Studio 将 `BoundService.java`\
  \ 文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n    public BoundService() {\n    }\n\n    @Override\n    public\
  \ IBinder onBind(Intent intent) {\n        // TODO: Return the communication channel\
  \ to the service.\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n### 56.5 实现 Binder\n\n如前所述，本地绑定服务可以通过向客户端传递适当配置的 `Binder` 对象来与客户端进行通信。这是通过在绑定服务类内部创建一个\
  \ `Binder` 子类，并通过添加一个或多个可以供客户端调用的新方法来扩展来实现的。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问数据并调用绑定服务中的方法。\n\
  \n因此，出于本示例的目的，需要对上一节创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为\
  \ `getService()` 的方法，该方法只需返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java`\
  \ 文件并对其修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n对类进行修改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个单一方法，唯一目的是返回 `BoundService` 类当前实例的引用。创建了 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现了一个新的公共方法，以便在任何绑定到服务的客户端调用调用时返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  \nimport java.util.Date;\n\nimport java.util.Locale;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n \
  \   public String getCurrentTime() {\n        SimpleDateFormat dateformat = new\
  \ SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US);\n        return (dateformat.format(new\
  \ Date()));\n    }\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n此时，绑定服务已完成，并准备好添加到项目清单（manifest）中。在工具窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml`\
  \ 文件，一旦加载到 Manifest 编辑器，验证 Android Studio 是否已如下为服务添加了 `<service>` 条目：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <service\n            android:name=\"\
  .BoundService\"\n            android:enabled=\"true\"\n            android:exported=\"\
  true\" />\n        <activity\n            android:name=\".MainActivity\" >\n   \
  \         <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一个阶段是在 Activity 中实现必要的代码以绑定服务并调用 `getCurrentTime()` 方法。\n\n### 56.6 将客户端绑定到服务\n\
  \n对于教程而言，客户端是运行中的 `MainActivity` 实例。如之前所述，为了成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并对其修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final private ServiceConnection myConnection = new ServiceConnection()\n\
  \    {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder)\
  \ service;\n            myService = binder.getService();\n            isBound =\
  \ true;\n        }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法以参数的形式接收由服务的 `onBind()` 方法返回的 `IBinder` 对象。该参数被强制转换为\
  \ `MyLocalBinder` 类型的对象，然后调用 binder 对象的 `getService()` 方法以获取服务实例的引用，该引用随后被赋值给 `myService`。使用一个布尔标志来表示连接已成功建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法，它简单地将布尔标志设置为 `false`。\n\n建立连接后，下一步是修改\
  \ activity 以绑定到该服务。这涉及创建一个 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()`\
  \ 方法中执行：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n### 56.7 完成示例\n\n剩下的工作是实现一种调用\
  \ `getCurrentTime()` 方法并将结果显示给用户的机制。按照现在的惯例，Android Studio 已经为 activity 创建了一个模板化的\
  \ `activity_main.xml` 文件，其中仅包含一个 `TextView`。将此文件加载到 Layout Editor 工具中，使用 Design（设计）模式选择\
  \ `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加一个 `Button` 视图，并将按钮上的文本更改为“Show\
  \ Time”，将文本提取到名为 `show_time` 的字符串资源中。完成这些更改后，布局应当类似于图 56-1 所示。如果缺少任何约束，点击 Layout\
  \ Editor 工具栏中的“Infer Constraints（推断约束）”按钮。\n\n![](img/as_4.1_local_bound_ui.jpg)\n\
  \n图 56-1\n\n通过选择 `Button` 并配置 `onClick` 属性以调用名为 `showTime` 的方法，来完成用户界面设计。\n\n最后，编辑\
  \ `MainActivity.java` 文件中的代码以实现 `showTime()` 方法。该方法简单调用服务的 `getCurrentTime()` 方法（得益于\
  \ `onServiceConnected()` 方法，现在可以通过 activity 内部的 `myService` 引用调用），并将生成的字符串赋值给 `TextView`：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\nimport android.widget.TextView;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n    public void showTime(View view) {\n        String\
  \ currentTime = myService.getCurrentTime();\n        TextView myTextView = findViewById(R.id.myTextView);\n\
  \        myTextView.setText(currentTime);\n    }\n}\n```\n\n### 56.8 测试应用程序\n\n\
  代码更改完成后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图更改为显示当前日期和时间。该示例已成功启动并绑定到服务，然后调用了该服务的方法来执行任务并将结果返回给\
  \ activity。\n\n## 56.9 总结\n\n当绑定服务是本地的且对应用程序私有时，该应用程序中的组件可以与服务进行交互，而无需使用进程间通信（IPC）。通俗地说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向正在运行的服务实例的引用。客户端组件实现 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法在服务连接和断开时被调用。前一个方法接收由 `onBind()` 方法返回的 `IBinder` 对象，允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\n# 57. Android 远程绑定服务 – 实例示例\n\n\
  在关于 Android 服务的最后一章中，将开发一个示例应用程序，演示如何使用 messenger 和 handler 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 57.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，在远程服务的情况下，这种方法不起作用，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n对于远程服务，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息在客户端和服务之间跨进程边界进行传递。\n\n具体来说，服务创建一个\
  \ `Handler` 实例，当接收到来自客户端的消息时将调用它。在初始化方面，由 `Handler` 负责创建一个 `Messenger` 对象，该对象又创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后向\
  \ handler 发送消息。每当发送消息时，handler 的 `handleMessage()` 方法就会被调用并传递消息对象。\n\n本章创建的示例将由运行在单独进程中的\
  \ activity 和绑定服务组成。将使用 Messenger/Handler 机制向服务发送字符串，服务随后输出该字符串。\n\n### 57.2 创建示例应用程序\n\
  \n在欢迎界面选择 New Project 选项，并在新建项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name\
  \ 字段中输入 `RemoteBound`，并在 package name 字段指定为 `com.ebookfrenzy.remotebound`。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 设置为 Java。\n\
  \n### 57.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到 Layout Editor\
  \ 工具中。在 Layout Editor 的 Design 模式下，右键点击默认的 `TextView` 实例，选择 Convert view... 选项并在对话框中选择\
  \ `Button` 视图，然后点击 Apply。将按钮的文本属性更改为“Send Message”，将其提取到名为 `send_message` 的新资源。\n\
  \n最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n### 57.4 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在\
  \ Project 工具窗口中右键点击包名（位于 app -> java 下）为项目添加新类，选择 New -> Service -> Service 选项。指定类名为\
  \ `RemoteService`，并确保 Exported 和 Enabled 选项已勾选，然后点击 Finish 创建类。\n\n\n\n\n下一步是为新服务实现处理器类（handler\
  \ class）。通过扩展 `Handler` 类并实现 `handleMessage()` 方法来实现。当从客户端接收消息时，该方法会被调用。它将接收一个 `Message`\
  \ 对象作为参数，该对象包含了客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的 `Bundle` 对象。一旦完成此功能，`RemoteService.java`\
  \ 文件中的修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Bundle;\n\
  import android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.util.Log;\n\npublic class RemoteService\
  \ extends Service {\n    public RemoteService() {\n    }\n\n    static class IncomingHandler\
  \ extends Handler {\n        String TAG = \"RemoteService\";\n        public IncomingHandler()\
  \ {\n            super(Looper.getMainLooper());\n        }\n        @Override\n\
  \        public void handleMessage(Message msg) {\n            Bundle data = msg.getData();\n\
  \            String dataString = data.getString(\"MyString\");\n            Log.i(TAG,\
  \ \"Message = \" + dataString);\n        }\n    }\n\n    @Override\n    public IBinder\
  \ onBind(Intent intent) {\n        // TODO: Return the communication channel to\
  \ the service.\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n实现处理器后，服务代码方面唯一剩余的任务是修改 `onBind()` 方法，使其返回一个包含 `Messenger`\
  \ 对象的 `IBinder` 对象，而该 `Messenger` 对象又包含对处理器的引用：\n\n```java\nfinal Messenger myMessenger\
  \ = new Messenger(new IncomingHandler());\n\n@Override\npublic IBinder onBind(Intent\
  \ intent) {\n    return myMessenger.getBinder();\n}\n```\n\n上述代码段的第一行创建了处理器类的新实例，并通过新\
  \ `Messenger` 对象的构造函数将其传递。在 `onBind()` 方法中，调用 messenger 对象的 `getBinder()` 方法来返回\
  \ messenger 的 `IBinder` 对象。\n\n### 57.5 在清单文件中配置远程服务\n\n为了准确描述客户端与远程服务之间的通信，有必要将服务运行在与应用程序其余部分的独立进程中。通过在清单文件中服务的\
  \ `<service>` 标签内添加 `android:process` 属性来实现。要启动远程服务，还需要为服务提供意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 5.6 启动并绑定到远程服务\n\n作为一个绑定服务，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。此外，对于本地服务，`onServiceConnected()` 方法将接收由远程服务的 `onBind()`\
  \ 方法返回的 `IBinder` 对象，该对象将向处理器发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`\
  \ 中。加载此文件并修改它，以添加 `ServiceConnection` 类和一个用于存储 `Messenger` 对象引用的变量，以及一个指示连接是否已建立的标志：\n\
  \n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.ServiceConnection;\nimport\
  \ android.view.View;\n\npublic class MainActivity extends AppCompatActivity {\n\
  \    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final ServiceConnection\
  \ myConnection = new ServiceConnection() {\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            myService = new Messenger(service);\n\
  \            isBound = true;\n        }\n        public void onServiceDisconnected(ComponentName\
  \ className) {\n            myService = null;\n            isBound = false;\n  \
  \      }\n    };\n}\n```\n\n接下来，需要添加代码来绑定远程服务。这涉及创建一个与清单文件中声明的服务意图过滤器匹配的 `intent`，然后调用\
  \ `bindService()` 方法，提供 `intent` 和 `ServiceConnection` 实例。为了本示例的目的，此代码将实现在 Activity\
  \ 的 `onCreate()` 方法中：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(), RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n##\
  \ 5.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置在用户触摸界面上的按钮时调用。此方法需要检查服务是否连接，创建一个包含要由服务器显示的字符串的\
  \ `Bundle` 对象，将其添加到 `Message` 对象中并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。加载后，打开\
  \ Logcat 工具窗口并在过滤器字段中输入以下内容：\n\n`package:mine tag:RemoteService`\n\n在 Logcat 窗口可见的情况下，点击用户界面上的按钮，此时日志消息应显示如下：\n\
  \nMessage = Message Received\n\n## 57.8 总结\n\n\n\n为了实现客户端与远程绑定服务之间的交互，必须实现一个处理器/消息通信框架。该技术背后的基本概念在本章中进行了介绍，并实现了一个示例应用程序，该程序旨在演示客户端与绑定服务之间的通信，它们分别运行在独立的进程中。\n\
  \n# 58. Java 线程、处理器（Handlers）和执行器概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程中的微进程，其目的是在应用程序中至少实现并行执行路径的表象。在本章中，我们将探讨在\
  \ Android 应用开发中使用线程的重要性，并演示如何创建和管理它们。\n\n## 58.1 应用程序主线程\n\n当 Android 应用首次启动时，运行时系统会创建一个线程，所有应用程序组件默认都将在该线程中运行。此线程通常被称为主线程。主线程的主要作用是处理用户界面，包括事件处理以及与用户界面中视图的交互。应用程序内启动的任何额外组件默认也会运行在主线程上。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来像死掉了，直到任务完成。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这远不是任何应用程序所希望的行为。这可以通过将要执行的任务启动在单独的线程中来避免，允许主线程不受干扰地继续处理其他任务。\n\
  \n## 58.2 线程处理器（Thread Handler）\n\n显然，Android 开发的关键规则之一是永远不要在应用程序的主线程上执行耗时操作。第二个同样重要的规则是，在任何情况下，独立线程中的代码都不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须在主线程内部执行。之所以这样做是因为 Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全的代码通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这通过在主线程中创建一个 handler 来完成，该 handler 继而接收来自另一个线程的消息并相应地更新用户界面。\n\
  \n## 58.3 线程示例\n\n本章的剩余部分将通过一些简单的示例，旨在对线程提供基础介绍。第一步将强调在主线程之外的线程中执行耗时任务的重要性。\n\n\
  启动 Android Studio，从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中选择“Empty Activity”模板，然后点击“Next”（下一步）按钮。\n\
  \n在 Name 字段中输入 `ThreadExample` 并指定 `com.ebookfrenzy.threadexample` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。按照第\
  \ 11.8 Migrating a Project to View Binding 节中的步骤将项目转换为使用 view binding。\n\n## 58.4\
  \ 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 Layout Editor（布局编辑器）工具中。选择默认的 `TextView`\
  \ 组件，并在 Properties（属性）工具窗口将视图的 ID 更改为 `myTextView`。\n\n在用户界面添加一个 Button 视图，位于现有\
  \ `TextView` 对象的正下方，如图图 58-1 所示。添加按钮后，点击工具栏上的 Infer Constraints（推断约束）按钮以添加缺失的约束。\n\
  \n将文本更改为“Press Me”，并将字符串提取到名为 `press_me` 的资源。在布局中仍选中按钮视图时，找到 `onClick` 属性并输入方法名\
  \ `buttonClick`。\n\n![](img/as_4.2_threadexample_ui.jpg)\n\n图 58-1\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，当用户点击 Button 时调用。由于此处的目标是演示在主线程上执行耗时任务的问题，代码将简单地暂停\
  \ 20 秒，然后在 `TextView` 对象上显示不同的文本：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n代码更改完成后，在物理设备或模拟器上运行应用程序。应用程序运行时，点击按钮，此时应用程序将看起来假死。例如，在某些操作系统会报告应用程序未响应的情况下，你将是无法触摸按钮的。\n\
  \n![](img/as_4.2_thread.jpg)\n\n图 58-2\n\n显然，`buttonClick()` 方法中任何将花费时间的操作都需要在单独的线程中执行。\n\
  \n58. 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放置在实例的 `run()` 方法中。需要创建一个 `Thread` 对象。最后，需要调用线程的\
  \ `start()` 方法来启动。因此，为了在 `buttonClick()` 方法中执行任务，需要进行以下更改：\n\n```java\npublic void\
  \ buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n        public\
  \ void run() {\n            long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  \            while (System.currentTimeMillis() < endTime) {\n                synchronized\
  \ (this) {\n                    try {\n                        wait(endTime - System.currentTimeMillis());\n\
  \                    } catch (Exception e) {\n                    }\n          \
  \      }\n            }\n            binding.myTextView.setText(\"Button Pressed\"\
  );\n        }\n    };\n    Thread myThread = new Thread(runnable);\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式来简化 runnable 的声明。此更改将导致如下结果：\n\n```java\nRunnable runnable = ()\
  \ -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n};\nThread myThread = new Thread(runnable);\n\
  myThread.start();\n```\n\n现在运行应用程序时，点击按钮会导致延迟在新的线程中执行，留出主线程继续处理用户界面，包括响应额外的按钮点击。事实上，每次点击按钮都会创建一个新线程，允许并发执行多次任务。\n\
  \n\n\n\n仔细检查 `buttonClick()` 方法更新后的代码，可以发现更新 `TextView` 的代码已被移除。正如之前提到的，从主线程以外的线程更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，必须为线程实现一个 `Handler`。\n\n## 58.6 实现线程处理器 (Thread\
  \ Handler)\n\n线程处理器（Thread handlers）在应用程序的主线程中实现，主要用于响应运行应用程序进程的其他线程发送的消息并对用户界面进行更新。\n\
  \n处理器是 Android `Handler` 类的子类，可以通过指定一个在线程需要执行的 `Runnable`，或者通过重写 `Handler` 子类中的\
  \ `handleMessage()` 回调方法来使用。当线程向处理器发送消息时，该回调方法会被调用。\n\n在本示例中，将实现一个处理器以便从之前创建的线程内部更新用户界面。将\
  \ `MainActivity.java` 文件加载到 Android Studio 编辑器中，并修改代码为活动添加一个 `Handler` 实例：\n\n```java\n\
  import android.os.Handler;\nimport android.os.Message;\nimport android.os.Looper;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    Handler handler = new\
  \ Handler(Looper.getMainLooper()) {\n        @Override public void handleMessage(Message\
  \ msg) {\n            binding.myTextView.setText(\"Message Received\");\n      \
  \  }\n    };\n}\n```\n\n上面的代码更改声明了一个处理器，并在该处理器内部实现了 `handleMessage()` 回调，当线程向处理器发送消息时，该方法会被调用。在此实例中，代码简单地在用户界面的\
  \ `TextView` 对象上显示一个字符串。\n\n现在剩下的就是修改 `buttonClick()` 方法中创建的线程，在延迟完成后向处理器发送消息：\n\
  \n```java\npublic void buttonClick(View view) {\n    Runnable runnable = () -> {\n\
  \        long endTime = System.currentTimeMillis() + 20 * 1000;\n        while (System.currentTimeMillis()\
  \ < endTime) {\n            synchronized (this) {\n                try {\n     \
  \               wait(endTime - System.currentTimeMillis());\n                } catch\
  \ (Exception e) {\n                }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了处理器的 `sendEmptyMessage()` 方法。由于处理器目前没有对收到的任何消息内容进行任何操作，因此向它发送了一个空消息对象。\n\
  \n编译并运行应用程序，并在执行后，点击按钮。20 秒后，新文本将出现在用户界面的 `TextView` 对象中。\n\n## 58.7 向处理器传递消息\n\n\
  虽然上一个示例触发了对 `handleMessage()` 处理器回调的调用，但它没有利用消息对象向处理器发送数据。在教程的这一阶段，将进一步修改该示例，以便在线程和处理器之间传递数据。首先，`buttonClick()`\
  \ 方法中更新的线程将以字符串格式从系统获取日期和时间，并将该信息存储在 `Bundle` 对象中。然后，将调用处理器对象的 `obtainMessage()`\
  \ 方法从消息池中获取一个消息对象。最后，在通过调用处理器对象的 `sendMessage()` 方法发送之前，将 bundle 添加到消息对象中：\n\n```java\n\
  public void buttonClick(View view) {\n    Runnable runnable = () -> {\n        long\
  \ endTime = System.currentTimeMillis() + 20 * 1000;\n        while (System.currentTimeMillis()\
  \ < endTime) {\n            synchronized (this) {\n                try {\n     \
  \               wait(endTime - System.currentTimeMillis());\n                } catch\
  \ (Exception e) {\n                }\n            }\n        }\n        Message\
  \ msg = handler.obtainMessage();\n        Bundle bundle = new Bundle();\n      \
  \  bundle.putString(\"myKey\", \"Thread\");\n        msg.setData(bundle);\n    \
  \    handler.sendMessage(msg);\n    };\n    Thread myThread = new Thread(runnable);\n\
  \    myThread.start();\n}\n```\n\n接下来，更新处理器的 `handleMessage()` 方法，从 `bundle` 对象中提取日期和时间字符串并显示在\
  \ `TextView` 上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，并测试点击按钮现在是否会在线程结束后在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n## 58.8 Java 执行器并发 (Executor Concurrency)\n\
  \n到本章为止，我们一直只关注直接创建和管理 Java 线程。虽然对于简单的多线程任务是可以的，但在处理涉及大量线程的复杂情况时，这可能证明是不够的。例如，启动和停止线程涉及系统开销。因此，创建和销毁大量线程的应用程序面临性能下降的风险。基本的线程\
  \ API 没有提供用于调度或重复任务执行、或从任务中返回结果的预构建选项。\n\n通过使用 Java 并发框架（`java.util.concurrent`\
  \ 包的一部分）的 `Executor` 类，可以克服直接操作线程的缺点。该框架允许创建活动线程池，并管理如何分配任务。这允许重用现有线程，而不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果（称为 `Callable` 任务）、检查线程状态以及在超时后或重复间隔调度任务。\n\n## 58.9 使用\
  \ Runnable 任务\n\n探索此框架的第一步是修改 `buttonClick()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable() {\n        public void run() {\n           \
  \ long endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程中执行。然而，对方法的更改需要一些解释。首先，从系统\
  \ `Executors` 实例获取 `ExecutorService` 实例引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个仅包含一个线程的池。也可以按如下方式请求指定线程数量的池：\n\n\n\n\n\n```java\nExecutorService\
  \ executor = Executors.newFixedThreadPool(10);\n```\n\n接下来，通过调用执行服务实例的 `submit()`\
  \ 方法，在线程上启动一个 `Runnable` 任务：\n\n```java\nexecutor.submit(new Runnable(){\n    public\
  \ void run(){\n        long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  \    }\n});\n```\n\n注意，上面的声明可以通过将其转换为 lambda 表达式来简化：\n\n```java\nexecutor.submit(()\
  \ -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n});\n```\n\n\
  从这一点起，任务将一直运行直到完成。然而，一旦完成，执行服务仍将继续运行。如果你不再需要该服务，应该将其关闭。\n\n## 58.10 关闭执行器服务\n\n\
  `ExecutorService` 提供了几种启动关闭的技术。若要通知服务在当前运行的任务完成后自动关闭，应如下所示调用 `shutdown()` 方法：\n\n\
  ```java\nexecutor.shutdown();\n```\n\n与此相反，调用 `shutdownNow()` 方法会停止服务上正在运行的所有任务，并取消正在等待的任务的处理：\n\
  \n```java\nexecutor.shutdownNow();\n```\n\n## 58.11 使用 Callable 任务和 Future\n\n如前所述，`ExecutorService`\
  \ 支持所谓的“Callable”任务，这些任务能够在任务完成后返回结果。运行在独立线程上的任务通常预计需要一些时间才能完成（否则它们可能从根本就不需要运行在独立线程中了）。这引出了一个问题：结果如何返回到启动任务的线程代码中？这是通过使用\
  \ `Future` 值类型实现的，它代表一个将在未来某个点提供的值。\n\n当执行一个可调用任务时，它会返回一个 `Future` 实例，应用程序随后可以使用该实例在任务完成时获取结果。要查看其运行效果，首先编辑\
  \ `activity_main.xml` 文件，添加一个标记为“Status”的按钮，并配置 `onClick` 属性以调用名为 `statusClick`\
  \ 的方法：\n\n![](img/as_4.2_threadexample_status_button.jpg)\n\n图 58-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务配置为通过 `Future` 变量返回 `String` 值：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                return(\"Task Completed\");\n            }\n   \
  \     });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，启动任务的方式也发生了一些更改：\n\n```java\nfuture = executor.submit(new\
  \ Callable<String>() {\n    public String call() {\n```\n\n这里的关键点是，我们现在不是向执行服务提交\
  \ `Runnable` 任务，而是传递了一个 `Callable` 任务（声明返回 `String` 值）。同样注意，任务的结果被赋值给 `Future` 变量。此外，在提交\
  \ `Runnable` 任务时使用的是之前使用的 `run()` 方法，而现在使用的是 `call()` 方法。最后，添加了一个返回语句来返回字符串：`return(\"\
  Task Completed\")`。\n\n## 58.12 处理 Future 结果\n\n`buttonClick()` 方法现在配置为启动一个 `Callable`\
  \ 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。一种方案是调用 `Future` 变量的 `get()`\
  \ 方法。由于该方法在执行失败或被中断时可能会抛出异常，因此必须在 `try/catch` 语句中执行，如下：\n\n```java\nString result\
  \ = null;\ntry {\n    result = future.get();\n} catch (ExecutionException | InterruptedException\
  \ e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()` 方法将阻塞当前线程，直到线程中运行的任务完成，这违背了在独立线程中运行任务的初衷。另一种方案是为\
  \ `get()` 方法调用提供一个超时时间，到后它会将控制交回当前线程。例如，下面的代码将导致 `get()` 调用在 3 秒后超时：\n\n```java\n\
  result = future.get(3, TimeUnit.SECONDS);\n```\n\n然而，更好的替代方案是调用 `Future` 实例的 `isDone()`\
  \ 方法来检查线程状态，仅在任务完成后调用 `get()` 方法。为了实现这种行为，请在 `MainActivity.java` 文件中如下添加 `statusClick()`\
  \ 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\nimport java.util.concurrent.TimeUnit;\n\
  import java.util.concurrent.TimeoutException;\n\npublic void statusClick(View view)\
  \ {\n    if (future != null && future.isDone()) {\n        String result = null;\n\
  \        try {\n            result = future.get(3, TimeUnit.SECONDS);\n        }\
  \ catch (ExecutionException | InterruptedException | TimeoutException e) {\n   \
  \         e.printStackTrace();\n        }\n        binding.myTextView.setText(result);\n\
  \    } else {\n        binding.myTextView.setText(\"Waiting\");\n    }\n}\n```\n\
  \n完成更改后，运行应用程序并点击“Press Me”按钮。在任务运行期间，点击 Status 按钮。只要任务仍在运行，TextView 就会显示“Waiting”。一旦任务完成，`isDone()`\
  \ 方法将返回 true 值，调用 `get()` 方法并将任务的字符串（Task Complete）显示在 `TextView` 上。\n\n## 58.13\
  \ 调度任务\n\n最后一个领域涉及使用 `ExecutorService` 调度任务。这涉及到使用 `ScheduledExecutorService` 实例，在其上需要调用\
  \ `schedule()` 方法，传递要执行的 `Runnable` 任务以及延迟时间。`schedule()` 调用将返回一个 `ScheduledFuture`\
  \ 实例，可以识别启动前的剩余时间。\n\n下面的代码调度了一个任务在 30 秒后运行，并访问剩余延迟：\n\n```java\nScheduledExecutorService\
  \ executor = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n   \
  \ // 在此处执行任务\n};\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样，`ScheduledExecutorService`\
  \ 可用于在可选初始延迟后定隔重复执行任务。下面的代码导致任务在初始 30 秒延迟后每 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成，都会启动下一个任务实例。若要指定执行结束与下一次执行开始之间的固定时间，请使用\
  \ `scheduleWithFixedDelay()` 方法。在下面的示例中，第一个任务在 0 秒延迟后调度，随后的每次执行在前一次完成后 10 秒后发生：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n\n\n\n本章的目标是概述 Android 应用中的线程处理。当应用程序在进程中首次启动时，运行时系统会创建一个主线程，随后启动的所有应用程序组件默认都会在该线程中运行。主线程的主要作用是处理用户界面，因此，在该线程中执行任何耗时任务都会导致应用程序出现假死现象。因此，将可能需要时间完成的任务启动在单独的线程中是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程中更改用户界面。可以通过在主线程中创建一个 handler 来用户界面的更改，从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java Concurrent 框架的执行服务。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果返回以及执行调度。\n\
  \n# 59. Android 通知教程\n\n通知提供了一种方法在应用程序未运行或当前处于后台时向用户传递消息的方法。例如，消息应用可能会发布通知，让用户知道收到了联系人的新消息。通知可以分为本地通知和远程通知。本地通知是由运行在设备上的应用程序本身触发的。相反，远程通知由远程服务器发起并递送到设备上供用户展示。\n\
  \n通知出现在从屏幕状态栏向下拉出的通知栏中，每个通知都可以包含某些操作，例如打开发送通知的应用程序的按钮。Android 还支持直接回复（Direct Reply）通知，该功能允许用户在通知面板内直接输入并提交对通知的回复。\n\
  \n本章的目标是概述并演示 Android 应用中本地通知的实现。下一章（“Android 直接回复通知教程”）将涵盖直接回复通知的实现。\n\n## 59.1\
  \ 通知概述\n\n当 Android 设备上启动通知时，它将以图标的形式出现在状态栏中。例如，图 59-1 显示了一个带有若干个通知图标的状态栏：\n\n![](img/Image24253.jpg)\n\
  \n图 59-1\n\n要查看通知，用户需要从状态栏开始向下滑动动作，以拉下通知栏，如图 59-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  \n图 59-2\n\n在运行 Android 8 或更高版本的设备上，长按应用启动图标将显示与该应用相关的所有待处理通知，如图 59-3 所示：\n\n![](img/Image2442.jpg)\n\
  \n图 59-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，通知点会出现在应用启动图标上。\n\n典型的通知将简单地显示消息，并在被点击时启动发布该通知的应用程序。通知还可能包含操作按钮，点击这些按钮时会执行对应应用程序特定的任务。例如，图\
  \ 59-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\n![](img/Image2450.jpg)\n\n图 59-4\n\n\
  用户还可以在通知中输入内联文本回复并将其发送给应用程序，如下方的图 59-5 所示。这允许用户无需将相应的应用程序切换到前台即可对通知做出响应。\n\n![](img/Image2458.jpg)\n\
  \n图 59-5\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。直接回复支持的主将在下一章——标题为“Android 直接回复通知教程”中介绍。\n\
  \n## 59.2 创建 NotifyDemo 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ Empty Activity 模板。\n\n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 26`：Android 8.0 (Oreo)，并将\
  \ Language（语言）菜单设置为 Java。\n\n## 59.3 设计用户界面\n\n主 Activity 将包含一个按钮，其目的是创建并发布一个 intent。在\
  \ Layout Editor 工具中定位并加载 `activity_main.xml` 文件，并删除默认的 `TextView` 挂件。\n\n在启用 Autoconnect（自动连接）的情况下，从面板中拖放\
  \ `Button` 对象到布局画布的中心，如图 59-6 所示。\n\n在布局中选中 `Button` 挂件后，使用 Attributes（属性）面板配置 `onClick`\
  \ 属性，以调用名为 `sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\n图 59-6\n\
  \n选中 `Button` 挂件，在 Attributes 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取为字符串资源。\n\n## 59.4\
  \ 创建第二个 Activity\n\n为了本示例，应用程序将包含一个由用户从通知内部启动的 Activity。通过右键点击 `app -> java` 下的\
  \ `com.ebookfrenzy.notifydemo` 包并选择 `New -> Activity -> Empty Activity` 为项目添加此 Activity。\n\
  \n在 `Activity Name` 字段中输入 `ResultActivity`并将布局文件命名为 `activity_result`。由于该 Activity\
  \ 不会在应用程序启动时启动（而是通过意图启动），因此在点击 Finish 按钮之前，确保禁用了 Launcher Activity 选项是非常重要的。\n\n\
  打开第二个 Activity 的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个 `TextView`\
  \ 挂件使其位于布局中心。编辑 `TextView` 的文本使其显示为“Result Activity”，并将属性值提取为字符串资源。\n\n## 59.5 创建通知通道\n\
  \n在应用程序发送通知之前，它必须先创建一个通知通道。通知通道由在应用程序内唯一标识该通道的 ID、通道名称和通道描述组成（后两个会被用户看到）。通道的创建是通过配置\
  \ `NotificationChannel` 实例，然后将其通过 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法。对于此示例，应用程序将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现启动启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager =\n            (NotificationManager)\n            \
  \    getSystemService(Context.NOTIFICATION_SERVICE);\n    }\n}\n```\n\n\n\n\n\n\
  ```java\ncreateNotificationChannel(\n    \"com.ebookfrenzy.notifydemo.news\",\n\
  \    \"NotifyDemo News\",\n    \"Example News Channel\");\n}\n\nprotected void createNotificationChannel(String\
  \ id, String name,\n        String description) {\n    int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \    NotificationChannel channel =\n        new NotificationChannel(id, name, importance);\n\
  \    channel.setDescription(description);\n    channel.enableLights(true);\n   \
  \ channel.setLightColor(Color.RED);\n    channel.enableVibration(true);\n    channel.setVibrationPattern(\n\
  \    new long[]{100, 200, 300, 400, 500, 400, 300, 200, 400});\n    notificationManager.createNotificationChannel(channel);\n\
  }\n```\n\n该代码声明并初始化了一个 `NotificationManager` 实例，然后使用低优先级级别（其他选项有 `high`、`max`、`min`\
  \ 和 `none`）创建一个新通道，并配置了名称和描述属性。该通道还添加了一系列可选设置，以自定义用户接收通知到达提醒的方式。这些设置适用于发送到此通道的所有通知。最后，通过将通知通道对象传递给通知管理器实例的\
  \ `createNotificationChannel()` 方法来创建该通道。\n\n完成代码更改后，编译并在运行 Android 10 或更高版本的设备或模拟器上运行应用。应用启动后，将其置于后台并打开\
  \ `Settings` 应用。在 `Settings` 应用中，选择 `Apps & notifications` ，然后选择 `App info`。在 `App\
  \ info` 屏幕上找到并选择 `NotifyDemo` 项目，在随后的屏幕上，点击 `Notifications` 项。通知屏幕应该列出 `NotifyDemo\
  \ News` 类别对用户处于激活状态：\n\n![](img/as_3.5_notifications_enabled.jpg)\n\n图 59-7\n\n\
  在继续之前，检查 `Advanced` 设置，以确保已为应用启用通知圆点和气泡。\n\n虽然这不是本示例的强制要求，但值得注意的是，可以通过调用通知管理器的 `deleteNotificationChannel()`\
  \ 方法从应用内部删除通道，并传递要删除通道的 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n## 59.6 创建并发布通知\n\
  \n通知是使用 `Notification.Builder` 类创建的，并且包含图标、标题和内容。打开 `MainActivity.java` 文件并如下所示实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n```java\n.\n.\n\nimport android.app.Notification;\n\
  import android.view.View;\n\n.\n.\n\npublic void sendNotification(View view) {\n\
  \    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n        new Notification.Builder(MainActivity.this,\n                     \
  \               channelID)\n            .setContentTitle(\"Example Notification\"\
  )\n            .setContentText(\"This is an example notification.\")\n         \
  \   .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .build();\n}\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要如下所示添加到 `sendNotification()` 方法中：\n\n\
  ```java\nprotected void sendNotification(View view) {\n    int notificationID =\
  \ 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification\
  \ notification =\n        new Notification.Builder(MainActivity.this,\n        channelID)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You've\
  \ received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并在稍后更新通知时使用。编译并运行应用，然后点击主活动上的按钮。当通知图标出现在状态栏中时，触摸并向下拖动状态栏以查看完整通知：\n\
  \n![](img/Image2481.jpg)\n\n图 59-8\n\n点击并向右滑动通知，然后选择设置图标以查看有关通知的附加信息：\n\n![](img/as_3.5_notification_settings.jpg)\n\
  \n图 59-9\n\n接下来，将应用置于后台，导航到显示所有应用启动图标的主屏幕，并注意 `NotifyDemo` 启动图标上出现了一个通知圆点，如图 59-10\
  \ 中的箭头所示：\n\n![](img/Image24991.jpg)\n\n图 59-10\n\n如果未显示圆点，请检查 `Settings` 应用中 `NotifyDemo`\
  \ 的通知选项，以确认已如前所述启用了通知圆点。如果圆点仍然未出现，触摸并长按设备主屏幕的空白区域，从生成的菜单中选择 `Home Settings` 选项并启用\
  \ `Notification dots` 。在启动图标上长按将显示一个包含通知的弹出窗口：\n\n![](img/as_3.5_notifydemo_long_press_popup.jpg)\n\
  \n图 59-11\n\n如果有多个待处理通知，长按弹出菜单将包含通知数量（上所示）。此数字可以通过在构建通知时调用 `setNumber()` 方法从应用内部配置：\n\
  \n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(CHANNEL_ID)\n    .setNumber(10)\n    .build();\n```\n\n目前的实现方式无论何时点击通知都没有效果。下一步是配置通知在点击时启动活动。\n\
  \n## 59.7 从通知启动活动\n\n通知理想情况下应该允许用户执行某些操作，例如启动相应的应用程序或响应通知采取其他形式的操作。常见的需求是在用户点击通知时启动属于该应用的活动。\n\
  \n这种方法需要启动一个活动并配置启动该活动的意。假设应用包含名为 `ResultActivity` 的活动，其创建方式如下：\n\n```java\nIntent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n```\n\n该意还需要封装在 `PendingIntent`\
  \ 实例中。`PendingIntent` 设计用于将意传递给其他应用程序，从而授予这些应用程序在未来某个时刻执行该意的权限。在这种情况下，`PendingIntent`\
  \ 对象用于为通知系统提供一种在用户点击通知面板时启动 `ResultActivity` 活动的方法：\n\n```java\nPendingIntent pendingIntent\
  \ =\n    PendingIntent.getActivity(\n        this,\n        0,\n        resultIntent,\n\
  \        PendingIntent.FLAG_UPDATE_CURRENT\n    );\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()`\
  \ 方法分配 `PendingIntent` 对象。\n\n将这些更改结合起来，得到的修改后的 `sendNotification()` 方法如下所示：\n\n\
  ```java\n.\n.\n\nimport android.app.PendingIntent;\nimport android.content.Intent;\n\
  import android.graphics.drawable.Icon;\n\n.\n.\n\npublic void sendNotification(View\
  \ view) {\n    int notificationId = 101;\n```\n\n\n\n\n\n```java\nIntent resultIntent\
  \ = new Intent(this, ResultActivity.class);\n\nPendingIntent pendingIntent =\n \
  \       PendingIntent.getActivity(\n                        this,\n            \
  \            0,\n                        resultIntent,\n                       \
  \ PendingIntent.FLAG_UPDATE_CURRENT\n        );\n\nString CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nNotification notification = new Notification.Builder(MainActivity.this,\n   \
  \                                                                 CHANNEL_ID)\n\
  \        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .build();\nnotificationManager.notify(notificationId, notification);\n```\n\
  \n再次编译并运行应用，点击按钮并显示通知栏。与之前不同，这次点击通知将启动 `ResultActivity`。\n\n## 59.8 向通知中添加操作（Actions）\n\
  \n为通知添加交互性的另一种方法是创建操作（actions）。这些操作显示为通知消息下方的按钮，并被设计为在用户点击时触发特定的意图（intent）。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加标记为“Open”的操作按钮，在选择时会启动引用的待处理意图（pending intent）：\n\n\
  ```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  \nNotification.Action action =\n        new Notification.Action.Builder(icon, \"\
  Open\", pendingIntent)\n                .build();\n\nNotification notification =\
  \ new Notification.Builder(MainActivity.this, CHANNEL_ID)\n        .setContentTitle(\"\
  Example Notification\")\n        .setContentText(\"This is an example notification.\"\
  )\n        .setSmallIcon(R.drawable.ic_info_24dp)\n        .setChannelId(channelID)\n\
  \        .setContentIntent(pendingIntent)\n        .setActions(action)\n       \
  \ .build();\nnotificationManager.notify(notificationId, notification);\n```\n\n\
  将上述代码添加到方法中并运行应用。发布通知并注意通知中出现的“Open”操作（取决于 Android 版本，可能需要向下下滑通知面板以显示“Open”操作）：\n\
  \n![](img/as_3.5_notification_with_action.jpg)\n\n图 59-12\n\n点击操作将触发待处理意图并启动 `ResultActivity`。\n\
  \n## 59.9 组合通知（Bundled Notifications）\n\n如果一个应用倾向于定期发布通知，可能会出现这些通知迅速占用状态栏和通知栏的危险，从而给用户带来不佳的体验。对于新闻或消息类应用尤为如此，这类应用每当有突发新闻或来自联系人的新消息到达时都会发送通知。例如，考虑图\
  \ 59-13 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 59-13\n\n现在想象一下收到了十条甚至二十条消息。为了避免这类问题，Android\
  \ 允许将通知组合在一起。要组合通知，必须通过 `setGroup()` 方法将每个通知指定为属于同一个组，并且发布一条额外的配置为摘要（summary）的通知。例如，以下代码创建并发布了图\
  \ 59-13 所示的三个通知，但将它们打包到了同一个组中。该代码还发布了一个作为摘要的通知：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\nNotification.Builder builderSummary =\n        new Notification.Builder(this,\
  \ channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentTitle(\"A Bundle\")\n                .setContentText(\"\
  You have 3 new messages\")\n                .setGroup(GROUP_KEY_NOTIFY)\n      \
  \          .setGroupSummary(true);\nNotification.Builder builder1 =\n        new\
  \ Notification.Builder(this, channelID)\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentTitle(\"New Message\")\n                .setContentText(\"\
  You have a new message from Kassidy\")\n                .setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder2 =\n        new Notification.Builder(this, channelID)\n\
  \                .setSmallIcon(android.R.drawable.ic_dialog_info)\n            \
  \    .setContentTitle(\"New Message\")\n                .setContentText(\"You have\
  \ a new message from Caitlyn\")\n                .setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder3 =\n        new Notification.Builder(this, channelID)\n\
  \                .setSmallIcon(android.R.drawable.ic_dialog_info)\n            \
  \    .setContentTitle(\"New Message\")\n                .setContentText(\"You have\
  \ a new message from Jason\")\n                .setGroup(GROUP_KEY_NOTIFY);\n\n\
  int notificationId0 = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\n\
  int notificationId3 = 103;\nnotificationManager.notify(notificationId1, builder1.build());\n\
  notificationManager.notify(notificationId2, builder2.build());\nnotificationManager.notify(notificationId3,\
  \ builder3.build());\nnotificationManager.notify(notificationId0, builderSummary.build());\n\
  ```\n\n当代码执行时，状态栏中只会出现一个通知图标，尽管应用实际上发布了四个通知。在通知栏中，会显示单个摘要通知，列出每个组合通知中的信息：\n\n![](img/Image2528.jpg)\n\
  \n图 59-14\n\n在通知项上进一步向下滑可以展开面板，显示每个组合通知的详情：\n\n![](img/Image2536.jpg)\n\n## 59.10\
  \ 总结\n\n通知提供了一种在应用未运行或处于后台时向用户传递消息的方式。通知出现在状态栏和通知栏中。本地通知由设备应用触发，而远程通知由远程服务器启动并传递到设备。本地通知使用\
  \ `NotificationCompat.Builder` 创建并使用 `NotificationManager` 服务发布。\n\n## 60. Android\
  \ 直接回复（Direct Reply）教程\n\n直接回复是 Android 7 引入的一项功能，它允许用户在通知中输入文本并发送到与通知关联的应用。这允许用户在无需启动应用活动的情况下直接回复消息。本章将基于上一章中学的知识，创建一个使用此通知功能的示例应用。\n\
  \n### 60.1 创建 DirectReply 项目\n\n在欢迎界面选择 New Projectget，在弹出的新项目对话框中选择 Empty Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `DirectReply`，并将 `com.ebookfrenzy.directreply`\
  \ 指定包包。在点击 Finish 按钮之前，将 Minimum API level 设置为 `API 31: Android 12`并将 Language 菜单更改为\
  \ Java。按照第 [11.8 Migrating a Project to View Binding] 节概述的步骤修改项目以支持 view binding。\n\
  \n### 60.2 设计用户界面\n\n\n\n\n将 `activity_main.xml` 布局文件加载到布局工具。在启用 `Autoconnect` 的情况下，在现有的“Hello\
  \ World!”标签下方添加一个 `Button` 对象，如图图 60-1 所示。在布局中选中 `Button` 控件后，使用属性（Attributes）工具窗口将\
  \ `onClick` 属性设置为调用一个名为 `sendNotification` 的方法。如有必要，使用 `Infer Constraints` 按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!” `TextView`并将 `id` 属性更改为 `textView`，并将按钮上的文本修改为“Notify”。\n\n![](img/as_4.1_direct_reply_ui.jpg)\n\
  \n图 60-1\n\n## 60.3 创建通知通道\n\n与上一章的示例相同，在发送通知之前必须创建一个通道。编辑 `MainActivity.java` 文件并添加以下代码来创建一个新通道：\n\
  \n```java\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        notificationManager = (NotificationManager)\n\
  \            getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(channelID,\
  \ \"DirectReply News\", \"Example News Channel\");\n    }\n\n    protected void\
  \ createNotificationChannel(String id, String name, String description) {\n    \
  \    int importance = NotificationManager.IMPORTANCE_HIGH;\n        NotificationChannel\
  \ channel = new NotificationChannel(id, name, importance);\n        channel.setDescription(description);\n\
  \        channel.enableLights(true);\n        channel.setLightColor(Color.RED);\n\
  \        channel.enableVibration(true);\n        channel.setVibrationPattern(new\
  \ long[]{100, 200, 300, 400, 500, 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n## 60.4 构建 RemoteInput 对象\n\n在通知中实现内联直接回复的关键元素是 `RemoteInput`\
  \ 类。之前的章节引入了 `PendingIntent` 类，并解释了它如何允许一个应用程序创建一个意图（intent），然后授予其他应用程序或服务从原始应用之外启动该意图的能力。在该章中，在“Android\
  \ 通知教程” 中创建了一个等待意图，允许从通知内部启动原始应用中的活动。`RemoteInput` 类允许将用户输入请求与意图一起包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的意图被触发时（例如启动一个活动），该活动 也会接收到用户提供的任何输入。\n\n在通知中实现直接回复的第一步是创建\
  \ `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。要构建 `RemoteInput` 对象，需要一个键字符串，用于从生成的意图提取提取输入。该对象还需要一个标签字符串，将显示在通知的文本输入字段中。编辑\
  \ `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。同时请注意添加了一些导入指令和变量，它们将在章节后续进展中被使用：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.view.View;\nimport\
  \ android.app.PendingIntent;\nimport android.app.RemoteInput;\nimport android.content.Intent;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static int notificationId = 101;\n    private static String\
  \ KEY_TEXT_REPLY = \"key_text_reply\";\n    private NotificationManager notificationManager;\n\
  \    private static String channelID = \"com.ebookfrenzy.directreply.news\";\n\n\
  \    public void sendNotification(View view) {\n        String replyLabel = \"Enter\
  \ your reply here\";\n        RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    }\n}\n```\n\n现在已经使用键和标签创建了\
  \ `RemoteInput` 对象，需要将其放置在通知对象内部。但在执行该步骤之前，需要先创建 `PendingIntent` 实例。\n\n## 60.5\
  \ 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android 通知”（#Notifications.xhtml__idTextAnchor49）章节中概述的相同，不同在于意图将配置为启动\
  \ `MainActivity`。留在 `MainActivity.java` 文件中，添加以下代码创建 `PendingIntent`：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \        .setLabel(replyLabel)\n        .build();\n    Intent resultIntent = new\
  \ Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent = PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_MUTABLE\n\
  \    );\n}\n```\n\n## 60.6 创建回复操作\n\n内联回复将通过操作按钮在通知中访问。现在需要创建此操作并使用图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象进行配置。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\n\
  import android.graphics.drawable.Icon;\nimport android.app.Notification;\nimport\
  \ android.graphics.Color;\nimport androidx.core.content.ContextCompat;\n\npublic\
  \ void sendNotification(View view) {\n    String replyLabel = \"Enter your reply\
  \ here\";\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \        .setLabel(replyLabel)\n        .build();\n    Intent resultIntent = new\
  \ Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent = PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    );\n    Icon icon = Icon.createWithResource(MainActivity.this, R.drawable.dialog_info);\n\
  \    Notification.Action replyAction = new Notification.Action.Builder(\n      \
  \  icon,\n        \"Reply\",\n        resultPendingIntent\n    )\n    .addRemoteInput(remoteInput)\n\
  \    .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了准备使用的 `RemoteInput`、`PendingIntent` 和通知操作对象。下一步是构建并发布通知：\n\
  \n```java\npublic void sendNotification(View view) {\n    String replyLabel = \"\
  Enter your reply here\";\n    RemoteInput remoteInput = new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \        .setLabel(replyLabel)\n        .build();\n    Intent resultIntent = new\
  \ Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent = PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_UPDATE_CURRENT\n\
  \    );\n    final Icon icon = Icon.createWithResource(MainActivity.this,\n```\n\
  \n\n\n\n```java\nandroid.R.drawable.ic_dialog_info);\n\nNotification.Action replyAction\
  \ =\n    new Notification.Action.Builder(\n            icon,\n            \"Reply\"\
  , resultPendingIntent)\n            .addRemoteInput(remoteInput)\n            .build();\n\
  Notification newMessageNotification =\n    new Notification.Builder(this, channelID)\n\
  \            .setColor(ContextCompat.getColor(this,\n                    R.color.design_default_color_primary))\n\
  \            .setSmallIcon(\n                    android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"My Notification\")\n            .setContentText(\"\
  This is a test message\")\n            .addAction(replyAction).build();\nNotificationManager\
  \ notificationManager =\n    (NotificationManager)\n            getSystemService(Context.NOTIFICATION_SERVICE);\n\
  notificationManager.notify(notificationId,\n    newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，测试点击按钮是否成功发送了通知。当查看通知栏时，通知应该如图 60-2 所示：\n\n![](img/as_4.1_direct_reply_notification.jpg)\n\
  \n图 60-2\n\n点击回复（Reply）操作按钮，文本输入字段将会出现并显示创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_4.1_direct_reply_enter_reply.jpg)\n\
  \n图 60-3\n\n输入一些文本并点击位于输入字段末尾的发送箭头按钮。\n\n## 60.7 接收直接回复输入\n\n现在通知已成功地向用户请求输入，应用需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本显示在活动用户界面的\
  \ `TextView` 控件上。\n\n当用户输入文本并点击发送按钮时，系统将通过 `PendingIntent` 对象包含的 `intent` 启动 `MainActivity`。该\
  \ `intent` 中包含了用户通过通知输入的文本。在 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回启动该应用的 `intent`\
  \ 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法将反过来返回一个包含回复文本的 `Bundle` 对象，该文本可以被提取并赋值给\
  \ `TextView` 控件。这导致 `MainActivity.java` 文件中的 `onCreate()` 方法被修改，内容如下：\n\n.\n\n.\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n.\n\
  .\n    createNotificationChannel(channelID, \"DirectReply News\",\n            \
  \                  Example News Channel\");\n    handleIntent();\n}\n\nprivate void\
  \ handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(\n            KEY_TEXT_REPLY).toString();\n\
  \        binding.textView.setText(inputString);\n    }\n}\n```\n\n.\n\n完成这些更改后，再次构建并运行应用。点击按钮发出通知，并在通知面板内输入一些文本。注意\
  \ `MainActivity` 中的 `TextView` 控件已更新，以显示所输入的内联文本。\n\n## 60.8 更新通知\n\n在通知中发送回复后，你可能会注意到进度器在通知面板中继续旋转，如图\
  \ 60-4 所示：\n\n![](img/Image2441.jpg)\n\n图 60-4\n\n通知显示此指示器是因为它正在等待应用的响应，以确认收到发送的文本。执行此任务的推荐方法是使用新消息更新通知，表明回复已收到。由于原始通知在发布时已分配了一个\
  \ ID，可以再次使用该 ID 来执行更新。将以下代码添加到 `handleIntent()` 方法中以执行此任务：\n\n```java\nprivate void\
  \ handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(\n            KEY_TEXT_REPLY).toString();\n\
  \        binding.myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n            new Notification.Builder(this, channelID)\n                .setSmallIcon(\n\
  \                    android.R.drawable.ic_dialog_info)\n                .setContentText(\"\
  Reply received\")\n                .build();\n        notificationManager.notify(notificationId,\n\
  \            repliedNotification);\n    }\n}\n```\n\n最后测试一次应用，验证在发送内联回复文本后进度器会消失，并且出现了一个新面板表示回复已收到：\n\
  \n![](img/Image2457.jpg)\n\n图 60-5\n\n## 60.9 总结\n\n直接回复通知功能允许用户在通知中输入文本，并通过 `intent`\
  \ 传递给相应应用程序的活动。直接回复的实现是通过 `RemoteInput` 类实现的，该类的实例可以嵌入到操作中并与通知打包在一起。在处理直接回复通知时，让\
  \ `NotificationManager` 服务知道回复已收到并处理至关重要。实现这一点的最佳方法是使用首次发布通知时提供的 `notification ID`\
  \ 直接更新通知消息。\n\n# 61. 折叠设备与多窗口支持\n\n折叠设备无论我们是否准备好都会到来（对于第一代三星 Galaxy Fold 来说，甚至可能在设备本身准备好之前）。为了给这种新设备做好准备，了解需要采取的一些额外步骤以确保你的应用在折叠设备上运行正常至关重要。\n\
  \n幸运的是，支持折叠设备的许多行为已经以多窗口支持的形式存在于 Android。\n\n## 61.1 折叠屏与多窗口支持\n\n当应用在折叠设备上运行时，它可能会与其他应用共享屏幕并遇到重大的配置更改（例如当用户折叠或展开显示屏时屏幕尺寸的变化）。如果你的应用已经设计为能够处理设备方向的变化，那么它很可能也能处理由屏幕折叠引起的变化，尽管仍然建议进行彻底测试。\n\
  \n多窗口支持最初在 Android 7 中引入。与之前的 Android 版本不同，Android 7 的多窗口支持允许设备屏幕上同时显示多个活动。\n\n\n\
  \n\n\n自由窗口模式（Freeform mode）为大屏幕设备提供了一个窗口化环境，目前由设备制造商决定是否启用。自由窗口模式与分屏模式的区别在于，它允许每个活动（activity）在独立的、可调整的窗口中显示，并且不受同时显示两个活动的限制。例如图\
  \ 61-2 显示了一个处于自由窗口模式下的设备，其中计算器和另一个应用显示在独立的窗口中：\n\n![](img/Image24362.jpg)\n\n图 61-2\n\
  \n画中画（Picture-in-picture）支持正如其名，允许视频在用户执行其他任务时在较小的窗口中继续播放，该主题将在标题为 Android 画中画模式的章节中开始介绍。\n\
  \n## 61.2 使用折叠屏模拟器\n\n尽管在编写时，市场上还没有可用于应用测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，请选择\
  \ `Android Studio Tools -> AVD Manager` 菜单选项，点击 `Create Virtual Device` 按钮，并在硬件选择屏幕上，从下方图\
  \ 61-3 所示的任一 `Foldable` 选项：\n\n![](img/as_3.5_foldable_emulator.jpg)\n\n图 61-3\n\
  \n在选择折叠屏后，继续完成创建过程，选择 `Android 10 API 29` 或更高版本作为系统镜像。\n\n一旦模拟器运行，工具栏中将出现一个额外的按钮，允许模拟器在折叠和展开的配置之间进行切换：\n\
  \n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n\n图 61-4\n\n## 61.3 进入多窗口模式\n\
  \n可以通过显示总览（Overview）屏幕、长按工具栏中列出的应用的图标，并选择如图 61-5 所示的 `Split screen` 菜单选项来进入分屏模式：\n\
  \n![](img/as_3.5_split_screen_button.jpg)\n\n图 61-5\n\n进入分屏模式后，总览按钮将变为显示两个矩形（如图\
  \ 61-6 中标记为 `A`），当前活动将占据屏幕部分 (B)，总览屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示 (C)：\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n\
  \n图 61-6\n\n一旦选择了第二个应用，屏幕将如上文图 61-1 所示所示被平分。\n\n要退出分屏模式，只需将分隔两个活动的分割线拖动到最远边缘，使之只剩一个活动占据整个屏幕，或长按总览按钮直到它恢复为单个正方形。\n\
  \n## 61.4 启用并使用自由窗口支持\n\n虽然在所有设备上尚未得到官方支持，但在大屏幕设备和模拟器上可以启用自由多窗口模式。要启用此模式，请在模拟器运行或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n进行此更改后，可能需要重启设备使设置生效。\n\n一旦启用，在总览屏幕中长按应用图标时，将出现一个额外的选项，如图 61-7 所示：\n\n![](img/as_3.5_freeform_button.jpg)\n\
  \n图 61-7\n\n## 61.5 检查是否支持自由窗口\n\n正如本章节早些时候概述，Google 将启用自由多窗口模式的选择权交给了各个 Android\
  \ 设备制造商。由于自由窗口仅在大屏幕设备上才才有意义，因此无法保证在可能运行应用的每个设备上都提供自由窗口功能。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有自由窗口特定的方法和属性，因此使用这些方法不会导致应用在不支持自由窗口的设备上崩溃。然而，可能会出现需要检测设备是否支持自由多窗口模式的情况。幸运的是，这可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查了自由多窗口支持情况，并根据测试结果返回布尔值：\n\
  \n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 61.6\
  \ 在应用中启用多窗口支持\n\n`android:resizableActivity` 清清单文件设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个活动级进行。例如，以下代码片段配置了名为\
  \ `MainActivity` 的活动同时支持分屏和自由多窗口模式：\n\n```xml\n<activity\n    android:name=\".MainActivity\"\
  \n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止该活动出现在分屏或自由窗口模式中，且相应的按钮将不会出现在总览菜单中。在分屏配置中选择一个不支持多窗口的活动作为第二个活动，将显示一条消息，提示该应用可能不支持多窗口。\n\
  \n## 61.7 指定多窗口属性\n\n`<layout>` 元素提供了若干属性，用于指定活动在多窗口模式下启动时的尺寸和位置。当活动在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性：\n\
  \n- `android:defaultWidth`：指定活动的默认宽度。\n- `android:defaultHeight`：指定活动的默认高度。\n- `android:gravity`：指定活动的初始位置（`start`、`end`、`left`、`right`、`top`）。\n\
  \n注意，上述属性仅适用于活动在自由窗口模式显示。以下示例配置活动在屏幕顶部以特定的高度和宽度显示：\n\n```xml\n<activity android:name=\"\
  .MainActivity \">\n    <layout android:defaultHeight=\"350dp\"\n             android:defaultWidth=\"\
  450dp\"\n             android:gravity=\"start|end\" />\n</activity>\n```\n\n以下 `<layout>`\
  \ 属性可指定活动在分屏或自由窗口模式下可缩小的最小宽度和高度：\n\n- `android:minimalHeight`：指定在分屏或自由窗口模式下，活动可以缩小的最小高度。\n\
  - `android:minimalWidth`：指定在分屏或自由窗口模式下，活动可以缩小的最小宽度。\n\n当用户将分屏分割线滑最小高度或宽度边界时，系统将停止调整收缩活动的布局，并仅裁剪用户界面为相邻活动留出空间。\n\
  \n以下清清单文件片段实现了活动的最小宽度和高度属性：\n\n```xml\n<activity android:name=\".MainActivity \"\
  >\n    <layout android:minimalHeight=\"400dp\"\n             android:minimalWidth=\"\
  290dp\" />\n</activity>\n```\n\n## 61.8 在活动中检测多窗口模式\n\n\n\n\n可能会出现某些情况，此时 Activity\
  \ 需要检测当前是否正以多窗口模式显示给用户。当前状态可以通过调用 `Activity` 类的 `isInMultiWindowMode()` 方法获取。当调用此方法时，它将根据\
  \ Activity 当前是否处于全屏状态返回真或假的布尔值：\n\n```java\nif (this.isInMultiWindowMode()) {\n\
  \    // Activity 正在多窗口模式下运行\n} else {\n    // Activity 不在多窗口模式\n}\n```\n\n## 61.9\
  \ 接收多窗口通知\n\n如果 Activity 重写了 `onMultiWindowModeChanged()` 回调方法，它将接收到其正在进入或退出多窗口模式的通知。传递给该方法的第一个参数在进入多窗口模式时为\
  \ `true`，在 Activity 退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n\
  ```java\n@Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,\n\
  \                                     Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // Activity 已进入多窗口模式\n  \
  \  } else {\n        // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如“处理 Android Activity\
  \ 状态变化`章节概述的，Android 10 及更高版本允许多个 Activity 同时处于恢复（resumed）状态（也称为多重恢复，multi-resume）。用户最近交互的\
  \ Activity 被称为顶层恢复 Activity。为了跟踪 Activity 获取和失去顶层恢复状态的过程，可以在 Activity 内部实现 `onTopResumedActivityChanged()`\
  \ 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // Activity 现在是顶层恢复 Activity\n    } else\
  \ {\n        // Activity 不再是顶层恢复 Activity\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在\
  \ App 清单清单文件中启用以下属性，也可以在 App 中利用多重恢复：\n\n```xml\n<meta-data android:name=\"android.allow_multiple_resumed_activities\"\
  \ android:value=\"true\" />\n```\n\n## 61.10 在多窗口模式下启动 Activity\n\n在本书的 Android\
  \ 显式意图——实例示例`章节中，了一个示例 App，其中 Activity 使用 `intent` 启动第二个 Activity。默认情况下，通过 `intent`\
  \ 启动的 Activity 被认为与源 Activity 位于同一个任务栈（task stack）中。然而，通过向 `intent` 传递相应的标志，可以将\
  \ Activity 启动到新的任务栈中。\n\n当多窗口模式下的 Activity 在同一个任务栈内启动另一个 Activity 时，新 Activity 将替换分屏或自由窗口窗口中的源\
  \ Activity（用户可以通过返回键返回到原始 Activity）。\n\n然而，当在分屏模式下启动到新的任务栈时，第二个 Activity 将出现在与原始\
  \ Activity 邻接的窗口中，从而允许两个 Activity 同时被查看。在自由窗口模式下，启动的 Activity 将出现在与原始 Activity 独立的窗口中。\n\
  \n要将 Activity 启动到新的任务栈中，在启动 `intent` 之前必须对其设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了一个设计为独立窗口显示的第二个\
  \ Activity：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 61.11 配置自由窗口 Activity 的大小和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ Activity 将位于屏幕中心，大小由系统决定。可以通过通过 `ActivityOptions` 类向 `intent` 传递启动边界（launch bounds）设置来控制此窗口的位置和尺寸。此过程的第一步是创建一个\
  \ `Rect` 对象，并配置表示矩形的左（`X`）、顶（`Y`）、右（`X`）和底（`Y`）坐标。以下代码创建一个 `Rect` 对象，其左上角位于 0,0，右下角位于\
  \ 100：\n\n```java\nRect rect = new Rect(100, 800, 900, 700);\n```\n\n下一步是创建 `ActivityOptions`\
  \ 的基本实例，并通过 `setLaunchBounds()` 方法通过 `Rect` 初始化它：\n\n```java\nActivityOptions options\
  \ = ActivityOptions.makeBasic();\noptions.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 并与 `Intent` 一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n当源 Activity 处于自由窗口模式时，通过 `intent` 启动第二个 Activity，新\
  \ Activity 将按照 `Rect` 中定义的位置和尺寸出现。\n\n## 61.12 总结\n\nAndroid 7 引入了多窗口支持，这允许在屏幕上同时显示多个窗口。该功能现在是支持折叠屏设备的基础。多窗口支持三种模式：分屏、自由窗口和画中画。在分屏模式下，屏幕水平或垂直分割，每个窗格显示一个\
  \ Activity。自由窗口模式（仅支持某些 Android 设备）允许每个 Activity 在独立的、可移动且可调整的窗口中出现。正如本章概述，Android\
  \ SDK 提供了许多方法和属性设置用于检测、响应和控制 App 内的多窗口行为。\n\n## 62 Android SQLite 概述\n\n不需要存储某些持久化数据的移动应用程序寥寥无几。数据库是大多数应用程序的核心组成部分，从完全数据驱动的应用程序到仅需存储游戏得分等少量数据的应用程序。\n\
  \n在考虑到典型的 Android 应用具有短暂的生命周期时，持久化数据存储的重要性变得更加明显。由于 Android 运行时系统随时可能终止应用组件以释放资源，制定避免数据丢失的全面数据存储策略是任何应用开发策略的关键因素。\n\
  \n本章将概述 Android 操作系统自带的 SQLite 数据库管理系统，并概述用于在 Android 内部实现持久化 SQLite 数据库存储的 Android\
  \ SDK 类。然而，在深入探讨 Android 开发背景下的 SQLite 之前，我们将简述数据库和 SQL。\n\n### 62.1 理解数据库表\n\n\n\
  \n\n\n# 数据库表提供了数据库中最基础的数据结构。每个数据库可以包含多个表，每张表都设计用于存储特定类型的信息。例如，一个数据库可能包含一个客户表，其中包含了特定业务每位客户的名称、地址和电话号码。同一个数据库还可能包含一个产品表，用于存储该业务销售的商品描述以及相关的产品代码。\n\
  \n数据库中的每个表都将被分配一个名称，该名称在该特定数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库的范围内，否则不能用于另一个表。\n\
  \n## 62.2 简介数据库模式 (Database Schema)\n数据库模式（Schemas）定义了存储在数据库表中的数据的特征。例如，客户数据库表的模式可能会定义客户名称为长度不超过\
  \ 20 个字符的字符串，并且客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n## 62.3\
  \ 列与数据类型\n在此阶段，开始将数据库表视为类似于电子表格是有帮助的，数据存储在行和列中。\n\n每一列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列又被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n## 62.4 数据库行\n保存到表中的每条新记录都存储在行中。每一行反过来由与保存记录关联的数据列组成。\n\
  \n再次考虑本章前面描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每一列都包含每位客户的数据（名称、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在新行的相应列中。\n\
  \n行（Rows）也被称为记录（records）或条目（entries），这些术语通常可以互换。\n\n## 62.5 简介主键 (Primary Keys)\n\
  每个数据库表都应该包含一列或多列，这些列可以唯一地标识表中的每一行。这在数据库术语中被称为主键（Primary Key）。例如，一个表可以使用银行账户列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\
  \n主键允许数据库管理系统唯一地识别表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定是否选中了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个姓为“Smith”的客户，可能会出现什么问题。如果没有某种保证的方法来唯一地标识特定行，就无法在任何时候确保访问的是正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的条件，任何两行不能包含匹配的主键值。当使用多列构造主键时，单个列的值不需要是唯一的，但所有列的值组合在一起必须是唯一的。\n\
  \n## 62.6 什么是 SQLite?\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 为主要示例）都是独立运行的独立服务器进程，并与需要数据库访问的应用程序协作工作。SQLite 被称为“嵌入式”，是因为它以库的形式提供，并链接到应用程序中。因此，后台没有运行一个独立的数据库服务器。所有的数据库操作都是通过调用\
  \ SQLite 库中包含的函数，在应用程序内部处理的。\n\nSQLite 的开发者已将该技术投入公共领域，结果是它现在已成为广泛部署的数据库解决方案。\n\n\
  SQLite 用 C 语言编写，因此 Android SDK 在底层数据库接口周围提供了一个基于 Java 的“封装器”（wrapper）。这本质上由一组类组成，可以在应用程序的\
  \ Java 或 Kotlin 代码中创建并管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参考 [`www.sqlite.org`](https://www.sqlite.org)。\n\
  \n## 62.7 结构化查询语言 (SQL)\nSQLite 数据库使用一种名为结构化查询语言的高级语言访问数据。这通常简称为 `SQL`，读作 sequel。`SQL`\
  \ 是大多数关系型数据库管理系统使用的标准语言。SQLite 基本符合 `SQL-92` 标准。\n\n`SQL` 本质上是一种非常简单易用的语言，专门设计用于读写数据库数据。由于\
  \ `SQL` 包含一小组关键字，可以快速学习。此外，`SQL` 语法在大多数 DBMS 实现之间大体相同，因此在学习了一个系统的 `SQL` 后，你的技能可能会转移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基本的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，还有许多其他资源提供了比我们希望在此单一章节中提供的详得多的\
  \ `SQL` 概述。\n\n## 62.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n对于对通用数据库特别是 SQLite 不熟悉的读者来说，直接上手并创建一个使用\
  \ SQLite 的 Android 应用程序可能看起来有些令人畏惧。幸运的是，Android 在带时预装了 SQLite，包括一个可以从连接到运行的 `adb\
  \ shell` 会话中发布 `SQL` 命令的交互环境。这既是学习 SQLite 和 `SQL` 的有用方法，也是识别应用程序创建的数据库问题的宝贵工具。\n\
  \n要启动交互式 SQLite 会话，首先要运行 AVD。这可以通过 Android Studio 内部启动 Android 虚拟设备管理器（Tools ->\
  \ AVD Manager），选择一个之前配置过的 AVD 并点击启动按钮。\n\n一旦 AVD 启动运行，打开终端或命令提示符窗口并使用 `adb` 命令行工具连接到模拟器（注意\
  \ `-e` 标志指示工具查找要连接的模拟器而不是物理设备）：\n\n```\nadb -e shell\n```\n\n连接后，shell 环境将提供一个可以在其中输入命令的提示符。首先使用\
  \ `su` 命令获取超级用户权限：\n\n```\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果出现不允许超级用户权限的消息，可能是因为\
  \ AVD 实例包含了 Google Play 支持。要解决这个问题，创建一个新的 AVD，并在“选择设备定义”屏幕上选择一个在“Play Store”列没有标记的设备。存储在\
  \ SQLite 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统上。默认情况下，这些数据库文件的文件系统路径如下：\n\n```\n\
  /data/data/<package name>/databases/<database filename>.db\n```\n\n\n\n\n\n例如，如果一个包名为\
  \ `com.example.MyDBApp` 的应用程序创建一个名为 `mydatabase.db` 的数据库，则该文件在设备上的路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n出于本次练习的目的，请在 `adb` shell 中切换到 `/data/data` 目录，并创建一个适用于 SQLite 实验的子目录结构：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建合适的位置后，按照以下方式启动交互式 SQLite 工具：\n\n```bash\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\nSQLite version 3.8.10.2 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含存储\
  \ ID、名称、地址和电话号码字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每一行都应该有一个对于该行唯一的主键。在上面的示例中，我们将\
  \ `ID` 字段指定为主键，将其声明为 `integer` 类型，并要求 SQLite 在每次添加新行时自动递增数字。这是确保每行都具有唯一主键的常用方法。在大多数其他平台上，主键名称的选取是任意的。然而，在\
  \ Android 的情况下，务必将主键命名为 `_id`，以便能够使用所有的 Android 数据库相关类来完全访问数据库。其余字段每个都被声明为 `text`\
  \ 类型。\n\n要列出当前选择数据库中的表，请使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n\
  ```\n\n向表中插入记录：\n\n```sql\nsqlite> insert into contacts (name, address, phone) values\
  \ (\"Bill Smith\", \"123 Main Street, California\", \"123-555-2323\");\nsqlite>\
  \ insert into contacts (name, address, phone) values (\"Mike Parks\", \"10 Upping\
  \ Street, Idaho\", \"444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select\
  \ * from contacts;\n1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike\
  \ Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite>\
  \ select * from contacts where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n退出 `sqlite3` 交互环境：\n\n```sql\nsqlite> .exit\n```\n\n\
  在模拟器环境环境中运行 Android 应用程序时，任何数据库文件都将使用之前讨论的路径约定创建在模拟器的文件系统上。这样做的好处是，你可以通过 `adb` 连接，导航到数据库文件所在，将其加载到\
  \ `sqlite3` 交互式工具中，并对数据进行操作，以识别应用程序代码中可能出现的问题。\n\n同样重要的是，虽然可以通过 `adb shell` 连接到物理\
  \ Android 设备，但该 shell 默认没有获得足够的权限来创建和管理 SQLite 数据库。因此，数据库问题的调试最好使用 AVD 会话进行。\n\n\
  # 62.9 Android Room 持久化库\n\n如前所述，SQLite 是用 C 语言编写的，而 Android 应用程序主要使用 `Java` 或 `Kotlin`\
  \ 开发。过去，为了弥补这种“语言差异”，Android SDK 包含了一组类，它们在 SQLite 数据库管理系统之上提供层。尽管这些类在 SDK 中仍然可用，但使用它们仍然需要编写大量的代码，并且没有利用\
  \ `LiveData` 和生命周期管理等新的架构指南和特性。为了解决这些缺点，Android Jetpack 架构组件包含了 Room 持久化库。该库在 SQLite\
  \ 数据库系统之上提供了一个层级接口，使其能够最少的代码在 Android 设备上在本地存储数据，同时符合现代应用程序架构的建议。\n\n接下来的章节将提供使用\
  \ Room 持久化库进行 SQLite 数据库管理的概述和教程。\n\n## 62.10 总结\n\nSQLite 是一种轻量级的嵌入式关系型数据库管理系统，作为\
  \ Android 框架的一部分，它为 Android 应用程序实现组织的持久化数据存储提供了机制。与 Room 持久化库结合时，Android 提供了一种从\
  \ Android 应用内部实现数据存储的现代方法。\n\n本章的目标是在 Android 应用程序开发的背景下，提供通用数据库特别是 SQLite 的概述。接下来的章节将提供\
  \ Room 持久化库的概述，之后我们将完成示例应用程序的。\n\n# 63. Android Room 持久化库\n\nRoom 持久化库包含在 Android\
  \ 架构组件中，专门设计用于方便地为 Android 应用添加数据库存储支持，且这种方法符合 Android 架构指南。在上一章涵盖了 SQLite 数据库的基础知识后，本章将探索基于\
  \ Room 的数据库管理的基本概念、协作实现 Android 应用中 Room 支持的关键元素，以及如何在架构和代码方面实现它们。在涵盖这些主题后，接下来的两个章节将通过示例数据库项目把理论付诸实践。\n\
  \n## 63.1 回顾现代应用架构\n\n名为“现代应用架构”的章节介绍了现代应用架构的概念，并强调了在应用内部划分不同职责区域的重要性。图 63-1 所示所示概述了典型\
  \ Android 应用的推荐架构：\n\n![](img/room_diagram.jpg)\n\n图 63-1\n\n随着该架构的前三个层在前面的章节中进行了详细介绍，现在是时候在\
  \ Room 持久化库的背景下探索仓库和数据库架构层。\n\n## 63.2 Room 数据库持久化的关键元素\n\n在之后详细介绍之前，首先值得总结使用 Room\
  \ 持久化库处理 SQLite 数据库涉及的关键元素：\n\n### 63.2.1 仓库\n\n如前所述，仓库模块包含了直接处理应用使用的所有数据源所需的代码。这避免了\
  \ UI 控制器和 ViewModel 包含直接访问数据库或网络服务的代码。\n\n### 63.2.2 Room Database\n\nroom database\
  \ 对象提供了底层 SQLite 数据库的接口。它还为仓库提供了数据访问对象 (DAO)。一个应用应该只有一个 room 数据库实例，然后它可以访问多个数据库表。\n\
  \n### 63.2.3 数据访问对象 (DAO)\n\nDAO 包含了仓库在 SQLite 数据库中插入、检索和删除所需的 SQL 语句。这些 SQL 语句映射到方法，从仓库内部调用这些方法来执行相应的查询。\n\
  \n### 63.2.4 实体\n\n\n\n\n实体（entity）是一个定义数据库表中结构（schema）的类，它定义了表名、列名数据类型，并指定哪列作为主键。除了声明表结构外，实体类还包含\
  \ getter 和 setter 方法，用于访问这些数据字段。`DAO` 在响应 SQL 查询方法调用时返回给仓库的数据将以这些实体类实例的形式存在。随后将调用\
  \ getter 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过调用 setter 在对象上配置值，然后调用在 `DAO`\
  \ 中声明的插入方法，并传递要保存的实体实例。\n\n### 63.2.5 SQLite 数据库\n\n负责存储和提供数据访问的实际 SQLite 数据库。应用程序（包括仓库）绝不应直接访问此底层数据库。所有的数据库操作都通过\
  \ Room 数据库、`DAOs` 和实体（entities）的组合完成。\n\n图 63-2 中的架构图说明了这些不同元素如何交互，从而在 Android 应用中提供基于\
  \ Room 的数据库存储：\n\n![](img/room_architecture_diagram.jpg)\n\n图 63-2\n\n上述架构图中的带编号连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取数据库实例，该实例反过来被用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并在将其传递给\
  \ `DAO` 之前对其配置数据，以便用于搜索和插入操作。\n3. 仓库调用 `DAO` 上的方法并传递要插入到数据库的实体，并在响应搜索查询时接收实体实例。\n\
  4. 当 `DAO` 有结果要返回给仓库时，它会将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理所有与底层 SQLite 数据库的低级交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久库进行数据库访问的关键要素大纲后，现在是时候详细探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n## 63.3 理解实体\n\n每个数据库表都将有一个关联实体类。该类定义了表的结构，并表现为标准的 Java 类，其中穿插了一些特殊的\
  \ Room 注解。一个声明存储在数据库表中的数据的 Java 类示例如下：\n\n```java\npublic class Customer {\n   \
  \ private int id;\n    private String name;\n    private string address;\n\n   \
  \ public Customer(String name, String address) {\n        this.id = id;\n      \
  \  this.name = name;\n        this.address = address;\n    }\n\n    public int getId()\
  \ {\n        return this.id;\n    }\n\n    public String getName() {\n        return\
  \ this.name;\n    }\n\n    public int getAddress() {\n        return this.address;\n\
  \    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setAddress(int quantity) {\n        this.address = address;\n    }\n}\n```\n\n\
  按照目前的实现，上述代码声明了一个基础 Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚未成为实体。要使此类成为实体并使其在\
  \ SQL 语句中可访问，需要按照所示添加某些 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\
  public class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n  \
  \  @ColumnInfo(name = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"customerName\")\n    private String name;\n\n    private String address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类尚未成为实体。要使此类成为实体并使其在 SQL 语句中可访问，需要按照所示添加某些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n \
  \   @ColumnInfo(name = \"customerName\")\n    private String name;\n\n    private\
  \ String address;\n\n    public Customer(String name, String address) {\n      \
  \  this.id = id;\n        this.name = name;\n        this.address = address;\n \
  \   }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(int id) {\n  \
  \      this.id = id;\n    }\n\n    public void setName(String name) {\n        this.name\
  \ = name;\n    }\n\n    public void setAddress(int quantity) {\n        this.address\
  \ = address;\n    }\n}\n```\n（原文重复了一些带有细微差异的区块。我将遵循原文的内容。）\n\n按照目前的实现，上述代码声明了一个基础\
  \ Java 类，包含若干表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚未成为实体。要使此类成为实体并使其在 SQL 语句中可访问，需要按照所示添加某些\
  \ Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\npublic class Customer\
  \ {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name =\
  \ \"customerId\")\n    private int id;\n\n    @ColumnInfo(name = \"customerName\"\
  )\n    private String name;\n\n    private String address;\n\n    public Customer(String\
  \ name, String address) {\n        this.id = id;\n        this.name = name;\n  \
  \      this.address = address;\n    }\n\n    public int getId() {\n        return\
  \ this.id;\n    }\n\n    public String getName() {\n        return this.name;\n\
