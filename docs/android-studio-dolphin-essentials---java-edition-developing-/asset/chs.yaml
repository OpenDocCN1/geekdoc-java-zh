  \n## 2.3 在 Android 中使用 Google Maps\n\n当 Google 多年前决定推出地图服务时，很难说他们是否曾预见到移动应用程序版本。当时\
  \ iPhone 尚未引发手机革命，而开发 Android 操作系统的公司六个月后才被 Google 收购。无论 Google 对 Google Maps 的未来有什么打算，现在可以通过\
  \ Android 应用访问它的功能。\n\n### 3.1 Google Maps API 的元素\n\nGoogle Maps API 由一组类组成，为 Android\
  \ 应用提供地图功能。地图的关键元素如下：\n\n- `GoogleMap`: Google Maps API 的主类。该类负责下载和显示地图瓦片，以及显示和响应地图控件。`GoogleMap`\
  \ 对象不是由应用程序直接创建，而是在创建 `MapView` 或 `MapFragment` 实例时创建的。应用程序代码中可以通过调用 `MapView`、`MapFragment`\
  \ 或 `SupportFragment` 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView`: `View`\
  \ 类的子类，该类提供画布，`GoogleMap` 对象在上面绘制地图，允许在活动的用户界面布局中放置地图。\n- `SupportFragment`: `Fragment`\
  \ 类的子类，该类允许在 Android 布局的 Fragment 中放置地图。\n- `Marker`: `Marker` 类的目的是允许在地图上标记位置。通过获取与地图相关的\
  \ `GoogleMap` 对象，然后调用该对象实例的 `addMarker()` 方法即可添加标记。标记的位置通过 `Longitude` 和 `Latitude`\
  \ 定义。标记可以以多种方式配置，包括指定标题、文本和图标。标记还可以被设置为“可拖动”，允许用户将标记移动到地图的不同位置。\n- `Shapes`: 在地图上绘制线条和形状是通过使用\
  \ `Polyline`、`Polygon` 和 `Circle` 类实现的。\n\n\n\n\n\n- `UiSettings` – `UiSettings`\
  \ 类提供了从应用程序内部控制用户界面控件是否显示在地图上的控制级别。例如，使用此类类，应用程序可以控制缩放、当前位置和指南针控件是否显示在地图上。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer` – 启用后，`My Location Layer` 会地图上显示一个按钮，用户选择该按钮会将地图中心置于用户当前的地理位置。如果用户是静的，该位置在地图上用一个蓝色标记表示。如果用户正在移动，该位置将由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时重点介绍\
  \ API 的关键领域。\n\n## 73.2 创建 Google Maps 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前，选择 `Google Maps Activity` 模板。\n\n在 `Name`（名称）字段中输入 `MapDemo`，并指定\
  \ `com.ebookfrenzy.mapdemo` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API\
  \ 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n## 73.3\
  \ 获取开发者签名\n\n应用程序在使用 Google Maps Android API 之前，必须先在 Google APIs Console 中注册。然而，在注册应用程序之前，必须识别与开发环境相关的开发者签名（也称为\
  \ `SHA-1` 指纹）。它包含在位于主目录下 `.android` 子目录下的 keystore 文件中，可以使用 Java SDK 提供的 `keytool`\
  \ 工具获取。不过，为了使过程更简单，在项目创建过程中选择 `Google Maps Activity` 选项时，Android Studio 会向项目添加一些额外文件。其中一个文件名为\
  \ `google_maps_api.xml`，位于项目的 `app -> res -> values` 文件夹。\n\n`google_maps_api.xml`\
  \ 文件包含指向 Google 开发者控制台的链接。将此链接复制并粘贴到浏览器窗口中。加载后，将出现类似下面的页面：\n\n![](img/Image24274.jpg)\n\
  \n图 73-1\n\n在点击 `Continue`（继续）按钮之前，确保菜单设置为 `Create a new project`（创建一个新项目）。启用 API\
  \ 后，点击 `Create API Key`（创建 API 密钥）按钮。稍等后，将创建一个新项目并出现一个提供应用程序 API 密钥的面板。\n\n![](img/Image24364.jpg)\n\
  \n图 73-2\n\n复制此密钥，返回 Android Studio 并将 API 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分\n\n```xml\n\
  <string name=\"google_maps_key\" templateMergeStrategy=\"preserve\" translatable=\"\
  false\">YOUR_KEY_HERE</string>\n```\n\n## 73.4 添加 Apache HTTP Legacy 库需求\n\n由于此示例项目将为用于\
  \ Android 9.0 或更高版本而构建，因此需要在 `AndroidManifest.xml` 文件的 `<application>` 部分内添加如下声明：\n\
  \n```xml\n<application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
  \n    android:label=\"@string/app_name\"\n    android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n    android:supportsRtl=\"true\"\n    android:theme=\"@style/Theme.MapDemo\">\n\
  \    <uses-library\n        android:name=\"org.apache.http.legacy\"\n        android:required=\"\
  false\" />\n</application>\n```\n\n## 73.5 测试应用程序\n\n运行应用程序以验证配置是否正确。如果地图没有显示，请检查：\n\
  \n- API 密钥是否正确配置。如果未显示，通常意味着 API 密钥输入错误，或者包名不匹配。\n- 检查 `Logcat` 输出中任何与 API 密钥相关的问题。\n\
  - 确认 Google Maps API 已启用。\n\n## 73.6 理解地理编码和反向地理编码\n\n在没有进行地理编码之前，无法讨论地图。地理编码可以被描述为将文本位置（例如地址）转换为坐标的过程。可以使用\
  \ `Geocoder` 类来实现。以下代码通过传递一个代表位置的字符串来请求：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\n\n\
  try {\n    geocodeMatches = new Geocoder(this).getFromLocation(\"600 Independence\
  \ SW, Washington, DC 20560\", 1);\n} catch (IOException e) {\n    // TODO-generated\
  \ catch block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty()) {\n\
  \    latitude = geocodeMatches.get(0).getLatitude();\n    longitude = geocodeMatches.get(0).getLongitude();\n\
  }\n```\n\n注意 `1` 的值作为第二个参数传递。这只是告诉 `Geocoder` 只返回一个结果。考虑到提供的地址具有特定性，应该只有一个匹配项。对于更模糊的位置名称，可能需要请求更多的匹配项并允许用户选择正确的一个。\n\
  \n上面的代码是正向地理编码的示例，坐标是基于描述计算的。反向地理编码正如其名，涉及将地理坐标转换为人类可读的地址字符串。考虑以下代码：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\n\ntry {\n    geocodeMatches\
  \ = new Geocoder(this).getFromLocation(38.8874245, -77.0200729, 1);\n} catch (IOException\
  \ e) {\n    // TODO-generated catch block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty())\
  \ {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  }\n```\n\n\n\n\n\n```java\nCountry = geocodeMatches.get(0).getCountryName();\n}\n\
  ```\n\n在这种情况下，`Geocoder` 对象通过 `getFromLocation()` 方法使用经度和纬度值进行初始化。再次，系统仅请求单个匹配结果。然后从生成的\
  \ `Address` 对象中提取基于文本的地址信息。\n\n需要注意的是，地理编码并不是在 Android 设备上实际执行的，而是在服务器上执行。当需要翻译时，设备会连接到服务器，并在翻译完成后返回结果。因此，只有当设备具有活跃的互联网连接时才能进行地理编码。\n\
  \n## 73.7 在应用程序中添加地图\n\n向应用程序添加地图的最简单方法是在 activity 的用户界面布局 XML 文件中指定它。下面的示例布局文件显示了在\
  \ Android Studio 创建的 `activity_maps.xml` 文件中添加的 `SupportMapFragment` 实例：\n\n```xml\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 73.8 请求当前位置权限\n\n正如“在 Android 中请求运行时权限”章节概述所示，某些权限被归类为危险权限，对于 Android\
  \ 6.0 或更高版本需要特殊处理。其中一种权限赋予了应用程序识别用户当前位置的能力。默认情况下，Android Studio 已在 `AndroidManifest.xml`\
  \ 文件中放置了位置权限请求。在 Project 工具窗口中找到 `app -> manifests` 下的文件，并找到以下权限行：\n\n```xml\n<uses-permission\n\
  \    android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n```\n\n这将确保在在旧版本的\
  \ Android 上安装应用时，应用有机会获得提供以获取位置信息的权限；但为了完全支持 Android 6.0 或更高版本，应用还必须在运行时特定地请求此权限。为了实现这一点，需要在\
  \ `MapsActivity.java` 文件中添加一些代码。\n\n首先添加一些导入指令和一个常量作为权限请求代码：\n\n```java\npackage\
  \ com.ebookfrenzy.mapdemo;\n\n.\n\n.\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.core.content.ContextCompat;\nimport androidx.core.app.ActivityCompat;\n\
  import android.Manifest;\nimport android.widget.Toast;\nimport android.content.pm.PackageManager;\n\
  \n.\n\n.\n\npublic class MapsActivity extends FragmentActivity implements OnMapReadyCallback\
  \ {\n    private static final int LOCATION_REQUEST_CODE = 101;\n    private GoogleMap\
  \ mMap;\n.\n\n.\n}\n```\n\n接下来，需要向类中添加一个方法来向用户请求特定权限。留在 `MapsActivity.java` 类文件中，按如下方式实现此方法：\n\
  \n```java\nprotected void requestPermission(String permissionType,\n           \
  \                     int requestCode) {\n    ActivityCompat.requestPermissions(this,\n\
  \        new String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应时，将调用\
  \ `onRequestPermissionsResult()` 方法。留在 `MapsActivity.java` 文件中，现在实现此方法，使其读取如下：\n\
  \n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \                                    @NonNull String[] permissions, @NonNull int[]\
  \ grantResults) {\n    super.onRequestPermissionsResult(requestCode, permissions,\
  \ grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                \"Unable to show location\
  \ - permission required\",\n                Toast.LENGTH_LONG).show();\n       \
  \ } else {\n            SupportMapFragment mapFragment = (SupportMapFragment) getSupportFragmentManager()\n\
  \                .findFragmentById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户未授予权限，应用将显示一条指示无法显示当前位置的消息。相反，如果授予了权限，地图将刷新，为显示位置标记提供机会。\n\
  \n## 73.9 显示用户的当前位置\n\n一旦授予了适当的权限，可以通过获取显示地图的 `GoogleMap` 对象的引用，并调用该实例的 `setMyLocation()`\
  \ 方法传递 `true` 值，从而在地图上显示用户的当前位置。\n\n当地图准备好显示时，将调用 activity 的 `onMapReady()` 方法。当地图在\
  \ `onRequestPermissionsResult()` 方法中刷新时，也会调用此方法。默认情况下，Android Studio 已实现此方法并添加了一些代码，将地图对准澳大利亚并在悉尼市上方放置标记。找到并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，移除此模板代码，并添加代码在启用显示用户当前位置之前检查是否已授予权限。如果尚未授权，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加标记并移动相机\n    LatLng sydney =\
  \ new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n    if\
  \ (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用时，将出现如图\
  \ 73-3 所示请求权限对话框。如果授权，地图上将出现一个蓝点表示设备的当前位置。\n\nimage/as_map_permission.jpg\n\n图 73-3\n\
  \n## 73.10 修改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法动态修改显示的地图类型，传递以下值之一：\n\
  \n- `GoogleMap.MAP_TYPE_NONE` – 不显示地图片的空白网格。\n- `GoogleMap.MAP_TYPE_NORMAL` – 由经典道路地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE` – 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID` –\
  \ 显示叠加了道路地图的卫星图像。\n- `GoogleMap.MAP_TYPE_TERRAIN` – 显示等高线和颜色等地形信息。\n\n例如，对 `onMapReady()`\
  \ 方法的以下更改会将地图切换到卫星模式：\n\n```java\n.\n.\nif (mMap != null) {\n    int permission\
  \ = ContextCompat.checkSelfPermission(\n        this, Manifest.permission.ACCESS_FINE_LOCATION);\n\
  \    if (permission == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \            LOCATION_REQUEST_CODE);\n    }\n}\n\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n\n```\n.\n.\n\n\n\n\n另一种，可以在嵌入地图的 XML 布局文件中指定地图类型，使用 `map:mapType` 属性并结合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 等值来指定。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n       \
  \   xmlns:map=\"http://schemas.android.com/apk/res-auto\"\n          android:id=\"\
  @+id/map\"\n          android:layout_width=\"match_parent\"\n          android:layout_height=\"\
  match_parent\"\n          map:mapType=\"hybrid\"\n          android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n# 73.11 向用户显示地图控件\n\nGoogle Maps Android API 提供了许多可以可选显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮和指南针。\n\
  \n缩放控件和指南针控件是否显示，可以通过编程方式控制，也可以在 XML 布局资源中的地图元素中控制。要通过编程方式配置控件，必须获取与 `GoogleMap`\
  \ 对象关联的 `UiSettings` 引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\
  \n.\n.\n\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n\
  通过调用 `UiSettings` 对象的 `setZoomControlsEnabled()` 方法来启用或禁用缩放控件。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n另一种，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法显示，也可以通过 XML\
  \ 资源使用 `map:uiCompass` 属性进行显示。请注意，指南针图标只有在地图相机倾斜或旋转偏离默认朝向时才会出现。\n\n“我的位置”按钮只有在如本章前文所述的那样，启用了“我的位置”模式时才会出现。即使在该模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法来防止按钮出现。\n\n# 73.12 处理地图手势交互\n\
  \nGoogle Maps Android API 能够响应许多不同的用户交互。这些交互可以用于更改地图的显示区域、缩放级别甚至视角角度（例如为某些城市显示地图区域的\
  \ 3D 表示）。\n\n### 73.12.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法来启用或禁用与地图缩放相关的手势。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中通过将 `map:uiZoomGestures` 属性设置为 true 或 false 也可以相同的结果。\n\n当启用时，当用户在屏幕上进行捏合手势时，将发生缩放。同样，双击会放大，而双指点击会缩小。相反，单指缩放手势是通过双击两次但不松开第二次点击，然后在屏幕上上下滑动手指分别进行放大和缩小。\n\
  \n### 73.12.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指动作在屏幕上拖动地图来在地图上移动。可以通过调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n另一种，可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动功能。\n\n### 73.12.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动它们来调整地图投影角度的角度。例如，可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法来启用或禁用倾斜手势：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n倾斜手势也可以使用 XML 布局资源文件中的 `map:uiTiltGestures`\
  \ 属性来启用和禁用。\n\n### 73.12.4 地图旋转手势\n\n通过在屏幕上放置两个手指并呈圆形旋转它们，当地图旋转手势启用时，用户可以旋转地图的朝向。这种手势的支持在代码中通过调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法启用或禁用，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n旋转手势也可以使用 XML 资源布局文件中的 `map:uiRotateGestures` 属性来启用或禁用。\n\n## 73.13 创建地图标记\n\
  \n标记（Markers）用于通知用户地图上的位置，形式可以是标准图标或自定义图标。标记还可以包含标题和可选文本（称为 snippet），并可以配置为允许用户将其拖动到地图上的不同位置。点击时将弹出一个信息窗口。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。传递给方法的参数是 `MarkerOptions`\
  \ 实例，它包含了标记所需的各种选项，如标题和 snippet。标记的位置通过指定经纬度值来定义，这些值也包含在 `MarkerOptions` 实例中。例如，以下代码向地图添加包含标题、snippet\
  \ 和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\nimport com.google.android.gms.maps.model.LatLng;\n\
  import com.google.android.gms.maps.model.MarkerOptions;\n\n.\n.\n.\n\nLatLng position\
  \ = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new MarkerOptions()\n\
  \    .position(position)\n    .title(\"Museum\")\n    .snippet(\"National Air and\
  \ Space Museum\"));\n```\n\n执行上述代码将标记指定的地点，点击时将显示如图 73-4 所示的信息窗口：\n\n![](img/Image24513.jpg)\n\
  \n图 73-4\n\n# 73.14 控制地图相机\n\n由于 Android 设备屏幕是平面的而地球是球体，Google Maps Android API\
  \ 使用墨投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并正对着地图的相机一样。Google Maps Android API 允许从应用程序内部实时更改相机的目标、缩放、航向和倾斜角度：\n\
  \n- **Target（目标）**：设备中心中心的位置，用经纬度指定。\n- **Zoom（缩放）**：以级别指定的相机缩放级别。缩放级别增加 1.0，显示的地图宽度将翻倍。\n\
  - **Tilt（倾斜）**：相机的视角角度，以跨越可视地图区域中心的弧线位置表示，从弧线顶部计算角度（顶部为相机正对着地图的底点）。\n- **Bearing（航向）**：地图的朝向，以从北顺时针的角度表示。\n\
  \n\n\n通过创建一个具有适当设置的 `CameraUpdate` 类实例来实现相机的更改。`CameraUpdate` 实例是通过调用 `CameraUpdateFactory`\
  \ 类的方法来创建的。一旦创建了 `CameraUpdate` 实例，就可以通过调用 `GoogleMap` 实例的 `moveCamera()` 方法将其应用到地图。为了在相机变化时获得平滑的动画效果，可以调用\
  \ `animateCamera()` 方法代替 `moveCamera()`。\n\n`CameraUpdateFactory` 方法的摘要如下：\n\n-\
  \ `CameraUpdateFactory.zoomIn()` – 提供一个放大一个层级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()`\
  \ - 提供一个缩小一个层级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 产生一个将缩放级别更改为指定值的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别按指定量增加或减少的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放级别的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机的目标纬度和经度的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 产生一个更改相机纬度、经度和缩放级别的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将相机移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机放大一个层级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n相反，以下代码将相机移动到新位置并将缩放级别调整为 10，且不使用动画：\n\n```java\nprivate static final LatLng\
  \ position =\n    new LatLng(38.8874245, -77.0200729);\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个更改了目标、缩放、方位角和倾角的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n    .bearing(70)\n\
  \    .tilt(25)\n    .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(\n\
  \    cameraPosition));\n```\n\n## 73 总结\n\n本章概述了构成 Google Maps Android API 的关键类和方法，并概述了准备开发环境和应用程序项目以使用该\
  \ API 的涉及步骤。\n\n## 74. 使用 Android 打印框架进行打印\n\n随着 Android 4.4 KitKat 的发布，从 Android\
  \ 应用程序内部打印内容已成为可能。虽然随后的章节将更详细地探讨为自己的应用程序添加打印支持的选项，但本章将重点关注 Android 中现提供的各种打印选项以及启用这些选项的步骤。在涵盖了这些初始主题后，本章将概述\
  \ Android 开发者在为应用程序构建打印支持方面可以使用的各种打印功能。\n\n## 74.1 Android 打印架构\n\nAndroid 打印由打印框架（Printing\
  \ framework）提供。简单来说，该框架由一个 `Print Manager`（打印管理器）和若干打印服务插件组成。`Print Manager` 负责处理来自设备应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求得到。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他打印类型的打印服务插件（如果尚未安装）也可以从\
  \ Google Play 商店获取。目前提供适用于 HP、爱普生、三星和佳能打印机的打印服务插件，其他打印机制造商的插件未来可能会发布，尽管 Google Cloud\
  \ Print 服务插件也可以从 Android 设备打印到几乎任何类型和型号的打印机。就本书而言，我们将 HP 打印服务插件作为参考示例。\n\n## 74.2\
  \ 打印服务插件\n\n打印服务插件的目的是允许应用程序打印到通过本地局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\n可以通过加载 Google\
  \ Play 应用并搜索“Print Service Plugin”来验证 Android 设备上是否存在打印服务插件。一旦插件在 Play Store 中列出，如果该插件尚未安装，可以通过选择安装按钮进行安装。例如图\
  \ 74-1 显示了 Google Play 中的 HP 打印服务插件。\n\n打印服务插件会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\
  \n![](img/as_4.1_hp_printer_plugin.jpg)\n\n图 74-1\n\n## 74.3 Google Cloud Print\n\
  \nGoogle Cloud Print 是 Google 提供的一项服务，允许你从任何连接互联网的地方将内容打印到你自己的打印机上。Google Cloud\
  \ Print 支持广泛的设备和打印机型号，包括云打印机和传统打印机两种形式。云打印机内置了通过网络进行打印的技术。提供云打印机的制造商包括惠得、佳能、戴尔、爱普生、HP\
  \ 和三星。要确定你的打印机是否支持云打印并受 Google Cloud Print 支持，请查看以下 URL 中的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于传统的非云打印打印机，Google Cloud Print 通过在连接到传统打印机的计算机系统（直接连接或通过家庭/办公室网络）上安装软件来实现云打印。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用你登录 Android 设备时相同的 Google 账号 ID：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦打印机添加到你的 Google Cloud Print 账户，从设备上的 Android 应用程序打印时，它们将被列为打印目标选项。\n\n## 74.4\
  \ 打印到 Google Drive\n\n除了支持实体打印机，还可以将打印输出保存到你的 Google Drive 账户。从设备打印时，选择打印面板中的“保存到\
  \ Google Drive”选项。待打印内容将被转换为 PDF 文件并保存到与设备当前活跃 Google 账号 ID 关联的 Google Drive 云存储空间中。\n\
  \n## 74.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项是将打印内容本地保存为 Android 设备上的 PDF 文件。一旦选择此选项，该程序将请求\
  \ PDF 文件的名称以及将文档保存到设备上的位置。\n\n保存为 PDF 和 Google Drive 选项在测试自己的 Android 应用程序的打印功能时，在节省纸方面是非常宝贵的。\n\
  \n## 74.6 从 Android 设备打印\n\n\n\n\n\nGoogle 建议提供打印内容功能的应用程序将打印选项放置在溢出菜单（Overflow\
  \ menu）中。许多与 Android 捆绑的应用程序现在已包含了“打印……”菜单选项。例如，图 74-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享……”选项来访问打印选项：\n\
  \n![](img/as_3.5_chrome_print_option.jpg)\n\n图 74-2\n\n一旦在应用程序内选择了打印选项，就会出现标准的 Android\
  \ 打印屏幕，显示待打印内容的预览，如图 74-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 74-3\n\
  \n点击屏幕顶部的面板将显示全量范围的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 74-4\n\nAndroid\
  \ 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和打印份数。通过点击当前打印机或 PDF 输出选择，可以访问其他打印目标选项。\n\n## 74.7 在\
  \ Android 应用中构建打印支持的选项\n\n打印框架为将打印支持整合到 Android 应用程序提供了多种选项。这些选项可以分类如下：\n\n### 74.7.1\
  \ 图像打印\n\n顾如名，此选项允许将图像打印整合到 Android 中。在应用程序添加此功能时，第一步是创建一个 `PrintHelper` 类的新实例：\n\
  \n```\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n接下来，可以通过调用 `PrintHelper`\
  \ 实例的 `setScaleMode()` 方法来指定打印图像的缩放模式。选项如下：\n\n• `SCALE_MODE_FIT` – 图像将缩放以适应纸张大小，而不进行任何裁剪或改变纵横比。这通常会导致一个维度上出现留白。\n\
  \n• `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现留白。\n\n在没有设置缩放模式的情况下，系统将默认使用\
  \ `SCALE_MODE_FILL`。例如，以下代码对之前定义的 `PrintHelper` 实例将缩放设置为适应模式：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向 `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一来实现的：\n\
  \n• `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n\n• `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\
  \n打印框架将默认进行彩色打印，除非如下所示指定了单色选项：\n\n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作所需的只需要待打印的图像以及调用 `PrintHelper` 实例的 `printBitmap()` 方法，该方法传递一个代表分配给打印任务名称的字符串以及图像的引用（以\
  \ `Bitmap` 对象或图像的 `Uri` 引用的形式存在）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  \                R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print\
  \ Job\", bitmap);\n```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n\
  ### 74.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架还提供了从应用程序内部打印基于 HTML 内容内容的方法。这些内容可以是由托管在网站页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已扩展，以以最少的代码要求支持打印。\n\
  \n在动态创建 HTML 内容（而不是加载并打印现有的网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置\
  \ web view 客户端在 HTML 加载到 `WebView` 之后启动打印任务。在配置好 web view 客户端后，HTML 被加载到 `WebView`\
  \ 中，此时触发打印过程。\n\n例如，考虑以下代码：\n\n```\npublic void printContent()\n{\n    WebView webView\
  \ = new WebView(this);\n    webView.setWebViewClient(new WebViewClient() {\n   \
  \     public boolean shouldOverrideUrlLoading(WebView view,\n                  \
  \  String url)\n        {\n            return false;\n        }\n        @Override\n\
  \        public void onPageFinished(WebView view) {\n            createPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    String htmlDocument = \"\
  <html><body><h1>Android Print</h1><p>\" + \"This is sample content.</p></body></html>\"\
  ;\n    webView.loadDataWithBase(null, htmlDocument, \"text/HTML\", \"UTF-8\", null);\n\
  }\n```\n\n该方法代码首先声明了一个变量 `myWebView`，其中将存储方法中创建的 `WebView` 引用。在 `printContent()`\
  \ 方法内部，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient` 实例。然后配置 web view 客户端，在 HTML\
  \ 加载到 `WebView` 之后启动打印任务。在配置好 web view 客户端后，HTML 被加载到 `WebView` 中，此时触发打印过程。\n\n\n\
  \n\n最后，通过调用打印管理器的 `print()` 方法启动打印任务，并传入任务名称、`print adapter` 以及一组默认的 `print attributes`。如果需要，可以对打印属性进行自定义，以指定\
  \ `resolution`（每英寸点数）、`margin` 和颜色选项。\n\n### 74.7.3 打印网页\n\n打印网页涉及的步骤与上述概述的类似，不同在于\
  \ web 接收的是要打印网页的 `URL`，而不是动态创建的 HTML，例如：\n\n```\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\"\
  );\n```\n\n同样重要的是，只有当网页在加载后需要立即自动打印时，才需要配置 `WebViewClient`。如果打印是由用户在页面加载后选择菜单选项来启动的，则只需要在应用程序代码中包含上述\
  \ `createWebPrintJob()` 方法中的代码即可。下一章标题为“Android HTML 和 Web 内容打印示例”，将演示这样一个这样一个场景。\n\
  \n### 74.7.4 打印自定义文档\n\n虽然 `Printing` 框架引入的 HTML 和网页打印功能为从 Android 应用程序打印内容提供了便利路径，但显然，对于更高级的打印需求，这些选项将过于简单。对于更复杂的打印任务，`Printing`\
  \ 框架提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到 `canvas` 上然后打印。\n\n与可以较实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，它将在本书的“Android\
  \ 自定义文档打印指南”章节中概述。这些步骤可以总结如下：\n\n* 连接到 Android 打印管理器\n* 创建一个继承自 `PrintDocumentAdapter`\
  \ 类的 `Custom Print Adapter`\n* 创建一个 `PdfDocument` 实例来表示文档页面\n* 获取 `PdfDocument`\
  \ 实例页面的引用，每个页面都关联着一个 `Canvas` 实例\n* 在页面画布上绘制内容\n* 通知打印框架文档已准备好打印\n\n上述步骤概述的自定义打印适配器需要实现许多方法，Android\
  \ 系统将在打印过程中调用这些方法来执行特定任务。其中最重要的是 `onLayout()` 方法，它负责根据用户更改纸张大小或页面方向等设置来重新排列文档布局，以及\
  \ `onWrite()` 方法，负责渲染要打印的页面。此主题将在名为“Android 自定义文档打印指南”的章节中详细介绍。\n\n## 74.8 总结\n\n\
  `Android SDK` 包含了从运行中的应用打印内容的能力。打印输出可以重定向到配置适当的打印机、本地 `PDF` 文件或通过 `Google Drive`\
  \ 到云端。从 Android 应用程序开发者的角度来看，可以通过使用 `Printing` 框架在应用程序中使用这些功能。目前最实现的打印选项是涉及图像和 HTML\
  \ 形式的内容。然而，可以使用框架的自定义文档打印功能实现更高级的打印。\n\n# 75. Android HTML 和 Web 内容打印示例\n\n如上一章标题为“使用\
  \ Android 打印框架进行打印”所述，`Android Printing framework` 可用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差异。本章将通过创建两个示例应用程序来使这两种打印选项更加清晰。\n\
  \n## 75.1 创建 HTML 打印示例应用程序\n\n从欢迎屏幕选择 `New Project`get，在生成的新项目对话框中，选择 `Empty Activity`\
  \ 模板然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `HTMLPrint` 并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n## 75.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建一些 HTML\
  \ 内容并以打印任务的形式将其发送给 `Printing framework`。\n\n首先找到 `MainActivity.java` 文件（位于 Project\
  \ 工具窗口的 `app -> java -> com -> ebookfrenzy -> htmlprint` 下）并将其加载到编辑面板。加载后，修改代码使其按如下列表所示进行读取：\n\
  \n```java\npackage com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ myWebView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            @Override\n            public boolean shouldOverrideUrl(WebView\
  \ view, WebResourceRequest request) {\n                return false;\n         \
  \   }\n\n            @Override\n            public void onPageFinished(WebView view,\
  \ String url) {\n                createWebPrintJob(view);\n                myWebView\
  \ = null;\n            }\n        });\n        String htmlDocument = \"<html><body><h1>Android\
  \ Print Test</h1><p>\" + \"This is some sample content.</p></body></html>\";\n \
  \       webView.loadDataWithBaseURL(null, htmlDocument, \"text/HTML\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n\n\n\n接下来，将创建一个 `String`\
  \ 对象，包含一些 HTML 内容并将其加载到视图中。一旦 HTML 加载，`onPageFinished()` 回调方法将触发。最后，在之前声明的 `myWebView`\
  \ 变量中存储视图的引用。如果没有这一关键步骤，Java 运行时系统将认为应用程序不再需要视图并将其丢弃，导致打印任务在完成之前终止。\n\n示例中剩下的工作是实现\
  \ `createWebPrintJob()` 方法，该方法当前配置为由 `onPageFinished()` 回调调用。在 `MainActivity.java`\
  \ 文件中，实现如下：\n\n```java\nprivate void createWebPrintJob(WebView webView) {\n    PrintManager\
  \ printManager = (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  Document\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务引用并创建打印适配器。创建一个新的字符串来存储打印任务名称（基于应用程序名称和“Print Test”）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法启动打印任务，传递任务名称、适配器和一组打印属性。\n\n在运行 Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。一旦启动，标准的\
  \ Android 打印页面将如图 75-1 所示。\n\n![](img/Image2425.jpg)\n\n图 75-1\n\n如果你配置了物理打印机，则打印到那里；或者，选择保存为\
  \ PDF 文件的选项。一旦打印任务启动，检查所选的目标。注意，当使用保存为 PDF 选项时，系统会请求 PDF 文件的名称和位置。可以通过设备上的 Downloads\
  \ 文件夹（Android 8 中重命名为 Files）查看其内容。\n\n### 创建网页打印示例\n\n本章中创建的第二个示例应用程序将为用户提供打印 `WebView`\
  \ 实例中显示网页的功能。\n\n从欢迎屏幕选择 New Project（新建项目）选项，在出现的新项目对话框中，点击 Next（下一步）按钮之前选择 Basic\
  \ Activity 模板。\n\n在 Name（名称）字段输入 `WebPrint`，并指定 `com.ebookrenzy.webprint` 为包名。在点击\
