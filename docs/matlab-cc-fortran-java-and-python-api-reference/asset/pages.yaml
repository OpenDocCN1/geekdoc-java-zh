    # Description


    **Note** To write MEX functions using modern C++ features and the "MATLAB Data
    API for C++", "Write C++ Callable from MATLAB (MEX Files)".


    mexCallMATLAB to invoke internal MATLAB numeric functions, MATLAB operators, user-defined
    functions, or other MEX functions.


    Both mexCallMATLAB and mexEvalString execute MATLAB commands. mexCallMATLAB for
    returning results (left side arguments) back to the MEX function. The mexEvalString
    function does not return values to the MEX function.


    # Input Arguments


    **nlhs — Number of output arguments**

    int


    Number of expected output mxArrays, specified as an integer less than or equal
    to 50.


    **plhs — MATLAB arrays**

    mxArray*


    Array of pointers to the mxArray output arguments.


    > **Caution** The plhs argument for mexCallMATLAB is not the same as the plhs
    for mexFunction. Do not destroy an mxArray returned in plhs for mexFunction.


    **nhrs — Number of input arguments**

    int


    Number of input mxArrays, specified as an integer less than or equal to 50.


    **prhs — MATLAB arrays**

    mxArray*


    Array of pointers to the mxArray input arguments.'
