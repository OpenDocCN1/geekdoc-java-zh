  md: "# mxCalcSingleSubscript (C)\n\nOffset from first element to desired element\n\
    \n# C Syntax\n\n```\n#include \"matrix.h\"\nmwIndex mxCalcSingleSubscript(const\
    \ mxArray *pm, mwSize nsubs, mwIndex *subs);\n```\n\n# Description\n\nCall mxCalcSingleSubscript\
    \ to determine how many elements are between the beginning of the mxArray and\
    \ a given element of that array. The function converts subscripts to linear indices.\n\
    \nFor example, given a subscript like (5,7), mxCalcSingleSubscript returns the\
    \ distance from the first element of the array to the (5,7) element. Remember\
    \ that the mxArray data internally represents all elements to have. In a one-dimensional\
    \ array no matter many dimensions's MATLAB array appears to have. For examples\
    \ showing the internal representation, see \"Data Storage\".\n\nAvoid using mxCalcSingleSubscript\
    \ to traverse the elements of an array. In C, it is more efficient to find the\
    \ starting address of the array and use pointer autoincrement to access successive\
    \ elements. For example, to find the starting address of a numerical array, call\
    \ one of the typed data access functions, for example, mxGetDoubles or mxGetComplexDoubles.\n\
    \n# Input Arguments\n\n+   - MATLAB array\n  const mxArray*\n\nPointer to an mxArray\
    \ array, specified as const mxArray*.\n\n+   - nsubs — Number of elements\n  mwSize\n\
    \nNumber of elements in the subs array, specified as mwSize. Typically, you set\
    \ nsubs equal to the number of dimensions in the mxArray that pm points to.\n\n\
    +   - subs — Array of subscripts\n  mwIndex\n\nArray of subscripts, specified\
    \ as mwIndex. Each value in the array specifies that dimension's subscript. The\
    \ value in subs(1) specifies the row subscript, and the value in subs(2) specifies\
    \ the column subscript. Use I-based indexing for subscripts. For example, to express\
    \ the starting element of a two-dimensional mxArray in subs, set subs(1) to 1\
    \ and subs(2) to 1.\n\n# Examples\n\nSee these examples in matlabroot/extern/examples/mx:\n\
    \n+   - mxcalcsubscript.c"
