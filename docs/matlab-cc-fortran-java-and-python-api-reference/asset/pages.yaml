  md: '# Results of mxSetData are different based on build option


    Behavior changed in R2018a


    For a complex numeric mxArray, the mxSetData function sets different values based
    on the mex build option.


    If you build the MEX file with the default release-specific option (-R2017b),
    then the function sets the elements of the array to the real-only values.


    If you build the MEX file with the -R2018a option, then:


    +   * When pm is a real array, pa becomes the real component of pm.

    * When pm is complex array, pa also must be complex. Otherwise, the elements of
    pa become interleaved real and imaginary values, not real-only values.


    # See Also


    Topics


    arrayFillSetData.c

    "Typed Data Access in C MEX Files"

    "MATLAB Support for Interleaved Complex API in MEX Functions"'
