  md: '# mxGetInt16s (C)


    Real data elements in `mxINT16_CLASS array


    # C Syntax


    ```

    #include "matrix.h"

    mxInt16 *mxGetInt16s(const mxArray *pa);

    ```


    # Input Arguments


    +   - pa — MATLAB array

    const mxArray *


    Pointer to an `mxINT16_CLASS array.


    # Output Arguments


    +   - dt — Data array

    mxInt16 *


    Pointer to the first `mxInt16` element of the data. If `pa` is `NULL`, then the
    function returns NULL.


    If `mxArray` is not an `mxINT16_CLASS array`:


    +   - MEX file — Function terminates the MEX file and returns control to the MATLAB
    prompt.

    - Standalone (non-MEX file) application — Function returns NULL. A NULL return
    value indicates that `pa` is either empty or not an `mxINT16_CLASS array`.


    # Examples


    See these examples in `matlabroot/extern/examples/mex/`


    +   - explore.c


    # API Version


    This function is available in the interleaved API. To build `myMexFile.c` using
    this function, type:


    ```

    mex -R2018a myMexFile.c

    ```


    # Version History


    Introduced in R2018a


    # See Also


    mxSetInt16s | mxGetUint16s | mxGetComplexInt16s'
