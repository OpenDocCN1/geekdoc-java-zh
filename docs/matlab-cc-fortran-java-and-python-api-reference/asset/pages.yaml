    \ function:\n\n```\nstr(1) = \"\";\nstr(2) = \"Gemini\";\nstr(3) = string(missing);\n\
    result = myMexFcn(str);\n```\n\nIn the MEX function, assign the input to array\
    \ of type matlab::data::MATLABString.\nmatlab::data::TypedArray<matlab::data::MATLABString>\
    \ stringArray = inputs(0);\n\n# Pass String Array from MEX function to MATLAB\n\
    \nCreate a string array in the MEX function and pass it to MATLAB as output. The\
    \ array defines elements, an empty string, and a missing string element.\n\n```\n\
    matlab::data::ArrayFactory factory;\noutput(0) = factory.createArray<matlab::data::MATLABString>({\
    \ 1, 3 });\nmatlab::data::MATLABString(output(1))=u\"\";\nmatlab::data::MATLABString(output(2))=u\"\
    Gemini\";\nmatlab::data::MATLABString(output(3))=missing;\n```\n\nThe result returned\
    \ to MATLAB is a string array.\n\n```\nresult = \n1×3 string array\n\"\" \"Gemini\"\
    \ <missing>\n```\n\n# Version History\n\nIntroduced in R2017b"
