    ```

    #include "matrix.h"

    mxArray = mxCreateCharMatrixFromStrings(mwSize m, const char **str);

    ```


    # Description


    mxCreateCharMatrixFromStrings to create a two-dimensional mxArray, where each
    row is initialized to a string from str. The mxArray has dimensions m-by-max,
    where max is the length of the longest string in str.


    The mxArray represents its data elements as mxChar rather than C char.


    # Input Arguments


    +   * m — Number of strings\ mwSize


    Number of strings, specified as mwSize.


    +   * str — Array of strings\ const char **


    Array of strings, specified as const char **. The array must contain at least
    m strings.


    # Output Arguments


    +   * pm — Pointer to mxArray\ nmArray * | NULL


    Pointer to an mxArray of type mxChar, specified as mxArray.


    The function is unsuccessful when str contains fewer than m strings or there is
    not enough free space to create the mxArray.


    +   * MEX file — Function terminates the MEX file and returns control to the MATLAB
    prompt.

    * Standalone (non-MEX) application — Function returns NULL.


