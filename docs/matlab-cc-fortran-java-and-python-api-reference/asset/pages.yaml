  md: '# matlab::data::ObjectArray


    C++ class to access MATLAB object arrays


    # Description


    Use ObjectArray to access objects MATLAB object arrays. To create an ObjectArray,
    call createArray in the ArrayFactory class using this syntax:


    ```

    template <typename ItType, typename Tname>

    TypedArray<T> createArray(ArrayDimensions dims,

    ItType begin,

    ItType end)

    ```


    To create a scalar object, call createScalar using this syntax:


    ```

    ObjectArray createScalar(const Object& val);

    ```


    ObjectArray is defined as:


    ```

    using ObjectArray = TypedArray<Object>;

    ```


    # Class Details


    Namespace: matlab::data

    Include: ObjectArray.hpp


    You cannot combine elements of an ObjectArray into a heterogeneous array.


    If the class defining the Object overrides subsref or subsasign, then you cannot
    access the elements of the ObjectArray.


    # Objects in MEX and C++ Applications


    C++ MEX and C++ Engine applications can get and set property values on MATLAB
    objects. For information on how to access MATLAB objects in these applications,
