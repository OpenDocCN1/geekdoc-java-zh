  md: '# Call MATLAB Functions


    ```

    ret = MATLABEngine.matlabfunc(dynamic argl, ..., dynamic argN);

    ```


    ```

    ret = MATLABEngine.matlabfunc(RunOptions options, __);

    ```


    ```

    ret = MATLABEngine.matlabfunc(_, "Name": Value);

    ```


    ```

    ret = MATLABEngine.matlabfunc(_, "Name", Value);

    ```


    # Description


    Call MATLAB function matlabfunc.


    # Parameters


    dynamic argl, ..., dynamic argN Arguments for the MATLAB function with default
    execution options. Use the dynamic type to resolve the required, positional, named,
    and optional parameters at run. The MATLAB function determines the type for argl,
    ..., argN.


    RunOptions options Execution options for the function, specified as a MathWorks.MATLAB.Types.RunOptions
    object. Specify the execution options before the function arguments.


    Name and Value Pairs of arguments, specified in any of these formats:


    +   * Name: Value

    * "Name", Value


    where Name is the argument name and Value is the corresponding value. Specify
    the name-value arguments after all the arguments in any of the previous syntaxes.


    # Returns


    Output of the MATLAB function. For functions called synchronously, the returned
    value is:


    +   * null, for MATLAB commands

    * Output of the function, for functions with single outputs

    * ValueTuple wrapping each output, for functions with multiple outputs


    For functions called asynchronously, the return value is a Task that completes
    when the MATLAB function completes, an exception occurs, or the task is canceled.
    The Task.Result property contains the output of the function.


    # Throws


    ```

    MathWorks.MATLAB.Exc Connection to MATLAB is lost.

    options.MATLABNotAvailableException

    ```


    ```

    MathWorks.MATLAB.Exc MATLAB run-time error occurred.

    options.MATLABExecionException

    ```'
