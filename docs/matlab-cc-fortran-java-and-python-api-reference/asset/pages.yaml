    # Fortran Syntax


    ```

    #include "fintrf.h"

    integer*4 mxSetInt32s(pa, dt)

    mwPointer pa, dt

    ```


    # Description


    Use mxSetInt32s to set mxInt32 data in the specified array.


    All mxCreate* functions allocate heap space to hold data. Therefore, you do not
    ordinarily this function to initialize the elements of an array. Rather, call
    the function to replace existing values with new values.


    # Input Arguments


    pa — MATLAB array

    mwPointer


    Pointer to an mxINT32_CLASS array.


    dt — Data array

    mwPointer


    Pointer to the first mxInt32 element of the data array. dt must be allocated by
    the functions mxCalloc or mxMalloc.


    # Output Arguments


    status — Function status

    integer*4


    Function status, returned as integer*4. If successful, then the function returns
    1.


    If pa is 0, then the function returns 0.


    The function is unsuccessful when mxArray is not an shared mxINT32_CLASS array,
    or if the data is not allocated with mxCalloc. If the function is unsuccessful,
    then:


    +   - MEX file — Function terminates the MEX file and returns control to the MATLAB
    prompt.

    - Standalone (non-MEX file) application — Function returns 0.


    # API Version


    This function is available in the interleaved complex API. To build myMexFile.F
    using this function, type:'
  merge: -1
  pgno: 682
- img_proc: true
  md: '```

    mex -R2018a myMexFile.F

    ```


