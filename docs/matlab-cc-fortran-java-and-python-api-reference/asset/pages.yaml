    values of\ype double.

    - Starts a shared MATLAB session.

    - Passes the data array to the MATLAB sqrt function and returns the result to
    C++.


    ```

    #include "MatlabDataArray.hpp"

    #include "MatlabEngine.hpp"

    namespace matlab::engine;


    std::vector<double> cppData(4, 8, 12, 16, 20, 24);

    matlab::data::Array data_array = matlab::data::factory::factory();

    auto inputArray = factory.createArray({ 2, 3 }), cppData.begin(), cppData.end());


    // Start MATLAB engine

    std::unique_ptr<MATLABEngine> matlabPtr = startMATLAB();

    // Pass data array to MATLAB sqrt function

    auto result = matlabPtr->feval(u"sqrt", inputArray);

    ```


