  md: "# mxGetNzmax (C and Fortran)\n\nNumber of elements in IR, PR, and PI arrays\n\
    \n# C Syntax\n\n```\n#include \"matrix.h\"\nmwSize mxGetNzmax(const mxArray *pm);\n\
