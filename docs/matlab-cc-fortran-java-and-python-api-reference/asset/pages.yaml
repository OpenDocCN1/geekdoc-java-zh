  md: '# mxCalloc (C and Fortran)


    Allocate dynamic memory for array, initialized to 0, using MATLAB memory manager


    # C Syntax


    ```

    #include "matrix.h"

    #include <stdlib.h>

    void mxCalloc(mwSize n, mwSize size);

    ```


    # Fortran Syntax


    ```

    #include "fintrf.h"

    wmPointer mxCalloc(n, size)

    mwSize n, size

    ```


    # Arguments


    n

    Number of elements to allocate. This must be a nonnegative number.


    size

    Number of bytes per element. (The sizeof operator calculates the number of bytes
    per element.)


    # Returns


    Pointer to the start of the allocated dynamic memory, if successful. If unsuccessful
    in a MAT or engine standalone application, mxCalloc returns NULL in C (0 in Fortran).
    If unsuccessful in a MEX file, the MEX file terminates and returns control to
    the MATLAB prompt.


    mxCalloc is unsuccessful when there is insufficient free space.


    # Description


    mxCalloc allocates contiguous free space to hold n elements of size bytes each,
    and initializes this newly allocated memory to 0. To allocate memory in MATLAB
    applications, use mxCalloc instead of the ANSI C call function.


    In MEX files, not MAT or engine applications, mxCalloc registers the allocated
    memory with the MATLAB manager. When control returns to the MATLAB prompt, the
    memory manager automatically frees, or deallocates, this memory.


    How you manage the memory created by this function depends on the purpose of the
    data assigned to it. If you assign it to an output argument in plhs[] using a
    function such as mxSetDoubles, then MATLAB is responsible for freeing the memory.


    If use the data internally, then the MATLAB memory manager maintains a list of
    all memory allocated by the function and automatically frees (deallocates) the
    memory when control returns to the MATLAB prompt. In general, we recommend that
    MEX file functions destroy their temporary'
  merge: -1
  pgno: 329
- img_proc: true
  md: 'arrays and free their own dynamically allocated memory. It is more efficient
    to perform this cleanup in the source MEX file than to rely on the automatic mechanism.
    Therefore, when you finish using the memory allocated by this function, call mxFree
    to deallocate the memory.


    If you do not assign this data to an output argument, and you want it to persist
    after the MEX file completes, then call mexMakeMemoryPersistent after calling
    this function. If you write a MEX file with persistent memory, then be sure to
    register a mexAtExit function to free allocated memory in the event your MEX file
    is cleared.


