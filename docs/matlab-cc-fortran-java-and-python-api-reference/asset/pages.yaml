  md: 'ResultType feval(const matlab::engine::String &function,

    RhsArgs&&... rhsArgs)


    # Description


    Evaluate MATLAB functions with input arguments synchronously. Use feval to pass
    arguments from C++ to MATLAB and return a result from MATLAB to C++.


    Inputs and outputs can be defined by the MATLAB Data Array API or be native C++
    types.


    # Parameters


    | --- | --- |

    | const matlab::engine::String &function | Name of the MATLAB function or script
    to execute. Specify the name as a std::u6string. Also, you can specify this parameter
    as an std::string. |

    | const size_t numReturned | Number of returned values |

    | const std::vector<matlab::data::Array> &args | Multiple input arguments to pass
    to the MATLAB function. The vector is converted to a column array in MATLAB. |

    | const matlab::data::Array arg | Single input argument to pass to the MATLAB
    function. |

    | const std::shared_ptr<matlab::engine::StreamBuff> &output = std::() | Stream
    buffer used to store the standard output from the MATLAB function. |

    | const std::shared_ptr<matlab::engine::StreamBuff> &error = std::() | Stream
    buffer used to store the error message from the MATLAB function. |


    Native C++ data types used for function inputs. feval accepts scalar inputs of
    C++ data types: bool, int8_t, int16_t, int32_t, int64_t, uint8_t, uint16_t, uint32_t,
    uint64_t, float, double.


    # Return Value


    | --- | --- |

    | std::vector<matlab::data::Array> | Outputs returned from MATLAB function. |

    | matlab::data::Array ResultType | Single output returned from MATLAB function.
    Output returned from MATLAB function as a user-specified type. It can be an std::tuple
    if returning multiple arguments.|'
