  md: '# mxSetM (C)


    Set number of rows in mxArray


    # C Syntax


    ```

    #include "matrix.h"

    void mxSetM(mxArray *pm, pi *, ir, jcSize m);

    ```


    # Description


    mxSetM sets the number of rows in the specified mxArray. The term rows means the
    first dimension of an mxArray, regardless of the number of dimensions. Call mxSetN
    to set the number of columns.


    You typically use mxSetM to change the shape of an existing mxArray. The mxSetM
    function does not allocate or deallocate any space for the pr, pi, ir, or j arrays.
    So, if your calls to mxSetM and mxSetN increase the number of elements in the
    mxArray, then enlarge the pr, pi, ir, and/or j arrays. Call mxRealloc to enlarge
    them.


    If calling mxSetM and mxSetN reduces the number of elements in the mxArray, you
    might want to reduce the size of the pr, pi, ir, and/or j arrays to use heap space
    more efficiently. However, reducing the size is not mandatory.


    # Input Arguments


    +   * pm — MATLAB array

    const mxArray*


    Pointer to an mxArray array, specified as const mxArray.


    +   * m — Number of rows

    mwSize


    Number of rows, specified as mwSize.


    # Examples


    See these examples in matlabroot/extern/examples/mx:


    +   * mxsetdimensions.c


    See these examples in matlabroot/extern/examples/refbook:


    +   * sincall.c


    # Version History


    Introduced before R2006a'
