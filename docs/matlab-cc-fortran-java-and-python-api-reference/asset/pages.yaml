  md: '# functionName — MATLAB function name

    const char*


    Name of the MATLAB built-in function, user-defined function, operator, or MEX
    function to call specified as const char*.


    If functionName is an operator, place the operator inside a pair of double quotes,
    for example, "+".


    # Output Arguments


    Status — Status

    int


    The function returns 0 if successful, and a nonzero value if unsuccessful.


    # Error Handling


    If functionName detects an error, MATLAB terminates the MEX function and returns
    control to the MATLAB prompt. To trap errors, use the mexCallMATLABWithTrap function.


    # Limitations


    +   * Avoid using the mexCallMATLAB function in Simulink® S-functions. If you
    do, do not store the resulting mxArray pointers in any S-function block state
    that persists after the MEX function finishes. Outputs of mexCallMATLAB have temporary
    scope and are automatically destroyed at the end of the MEX function call.

    * It is possible to generate an object of type mxUNKNOWN CLASS using mexCallMATLAB.
    For example, this function returns two variables but only assigns one of them
    a value.


    ```

    function [a,b] = foo(c)

    a = 2*;

    ```


    If you call foo using mexCallMATLAB, the unassigned output variable is now type
    mxUNKNOWN_CLASS.


    # Examples


    See these examples in matlabroot/extern/examples/mex:


    +   * mexcallmatlab.c

    * mexevalstring.c

    * mexcallmatlabwithtrap.c


