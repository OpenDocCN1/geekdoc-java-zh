  md: '# matGetNextVariable (C and Fortran)


    Next array in MAT-file


    # C Syntax


    ```

    #include "mat.h"

    mxArray *matGetNextVariable(MATFile *mfp, const char **name);

    ```


    # Fortran Syntax


    ```

    #include "mat.h"

    mwPointer matGetNextVariable(mfp, name)

    mwPointer mfp

    char*(*) name

    ```


    # Arguments


    +   mfp


    +   Pointer to MAT-file information


    +   name


    +   Pointer to the variable containing the mxArray name


    # Returns


    Pointer to a newly allocated mxArray structure representing the next mxArray from
    the MAT-file pointed to by mfp. The function returns the name of the mxArray in
    name.


    matGetNextVariable returns NULL in C (& in Fortran) for end of file or if there
    is an error condition. In C, useof and ferror from the Standard C Library to determine
    status.


    # Description


    matGetNextVariable allows you to step sequentially through a MAT-file and read
    every mxArray in a single pass. The function reads and returns the next mxArray
    from the MAT-file pointed to by mfp.


    UseGetNextVariable immediately after opening the MAT-file with matopen and not
    with MAT-file rules. Otherwise, the concept of the next mxArray is undefined.


    Use mxDestroyArray to destroy the mxArray created by this runtime when you are
    finished with it.


    The order of variables returned from successive calls to matGetNextVariable is
    not guaranteed to be the same order in which the variables were written.


