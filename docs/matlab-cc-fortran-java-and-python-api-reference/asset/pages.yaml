  md: "# mxMakeArrayComplex (C)\n\nConvert real mxArray to complex, preserving real\
    \ data\n\n# C Syntax\n\n```\n#include \"matrix.h\"\nint mxMakeArrayComplex(mxArray\
    \ *pa);\n```\n\n# Description\n\nUse mxMakeArrayComplex to convert a real mxArray\
    \ to a complex mxArray. The real part of the updated array contains the real data\
    \ from the original array.\n\nIf pa is empty, then the function returns a complex\
    \ empty mxArray.\n\nIf pa is complex, the function does nothing.\n\n# Input Arguments\n\
    \n**pa — MATLAB array**\nmArray *\n\nPointer to a numeric mxArray array.\n\n#\
    \ Output Arguments\n\n**status — Function status**\nint\n\nFunction status, returned\
    \ as int. If successful, then the function returns 1.\n\nReturns 0 if unsuccessful.\
    \ The function is unsuccessful if pa is NULL, nonnumeric, or read-only.\n\n# Examples\n\
    \nSuppose that your application processes complex data and you create mxArrays\
    \ to handle the data. If you pass a complex array containing only real data to\
    \ a MATLAB function, then the returned value is a real array. For example, call\
    \ the MATLAB sqrt function with the following input:\n\n```\na = complex([2,4])\n\
    ```\n\n```\na =\n\n    2.0000 + 0.0000i  4.0000 + 0.0000i\n```\n\nAlthough the\
    \ input argument is complex, the data is real-only, and the output of the function\
    \ is no longer complex.\n\n```\nal = sqrt(a)\n```"
  merge: -1
