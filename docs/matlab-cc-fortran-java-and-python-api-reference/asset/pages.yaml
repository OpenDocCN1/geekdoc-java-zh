  md: '# com.mathworks.matlab.types.Struct


    Java class to pass MATLAB struct to and from MATLAB


    # Description


    The Struct class provides support for passing data between MATLAB and Java as
    a MATLAB struct. The Struct class implements the java.util.Map interface.


    The Struct class is designed as an immutable type. Attempting to change the mappings,
    keys, or values of the returned Struct causes an UnsupportedOperationException.
    Calling these methods can cause the exception: put(), getAll(), entrySet(), keySet(),
    and values().


    For an example, see "Using MATLAB Structures in Java".


    # Creation


    Struct s = new Struct("field1","field2",value2, ...) creates an instance of Struct
    with the specified field name and values.


    # Methods


    # Public Methods


    +   containsKey(Object key) Returns true if this map contains a mapping for the
    specified key.

    containsValue(Object key) Returns true if this map maps one or more keys to the
    specified value.

    entrySet() Returns a Set view of the mappings contained in this map.

    equ(Object o) Compares the specified object with this map for equality.

    get(Object key) Returns the value to which the specified key is mapped, or null
    if this map contains no mapping for the key.

    hashCode() Returns the hash code value for this map.\isEmpty() Returns true if
    this map contains no key-value mappings.

    keySet() Returns a Set of the keys contained in this map.

    size() Returns the number of key-value mappings in this map.

    values() Returns a Collection view of the values contained in this map.'
