  md: '# API Reference


    If size is 0 and ptr is not NULL in C (0 in Fortran), then mxRealloc frees the
    memory pointed to by ptr and returns NULL in C (0 in Fortran).


    In MEX files, not MAT or engine applications, mxRealloc registers the allocated
    memory with the MATLAB memory manager. When return control to the MATLAB prompt,
    the memory manager then automatically frees, or deallocates, this memory.


    How you manage memory created by this function depends on the purpose of the data
    assigned to it. If you assign it to an output argument in plhs[] using a function
    as mxSetDoubles, then MATLAB is responsible for freeing the memory.


    If you use the internally, the MATLAB memory manager maintains a list of all memory
    allocated by the function and automatically frees (deallocates) the memory when
    return control to the MATLAB prompt. In general, we recommend that MEX file functions
    destroy their own temporary arrays and free their dynamically allocated memory.
    It is more efficient to perform this cleanup in the source MEX file to run on
    the automatic mechanism. When using the memory allocated by this function, call
    mxFree to deallocate the memory.


    If you do not assign this data to an output argument, and you want it to persist
    after the MEX file completes, call mxMakeMemoryPersistent after calling this function.
    If you write a MEX file with persistent memory, then be sure to register a mxAtExit
    function to free allocated memory in the event your MEX file is cleared.


