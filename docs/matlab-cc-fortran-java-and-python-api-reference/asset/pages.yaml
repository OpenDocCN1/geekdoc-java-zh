  md: '# MathWorks.MATLAB.Engine.MATLABEngine


    .NET class using MATLAB as a computational engine


    # Description


    The MATLABEngine class uses a MATLAB process as a computational engine for .NET
    applications. You can call MATLAB functions as methods of a MATLABEngine object
    because the functions are dynamically invoked when you call them. You can also
    call functions and scripts that you define. You can send data to retrieve data
    from the MATLAB workspace associated with the MATLABEngine object.


    Use the MATLABEngine to start a new MATLAB session or to connect to an existing
    one.


    For information about exceptions, see "MathWorks.MATLAB.Exceptions Exception Classes
    for .NET".


    # Class Details


    Namespace: MathWorks.MATLAB.Engine

    Superclass: System.Dynamic.DynamicObject

    Interface: System.IDisposable


    # Unsupported Startup Options


    The engine does not support these startup options:


    +   -h

    -help

    -?

    -n

    -e

    -softwareopengl

    -logfile


    For information on MATLAB startup options, see "Common Used Startup Options".


    # Method Summary


    # Static Methods


    "StartMATLAB" on page 1-3: Start MATLAB synchronously.

    "StartMATLABAsync" on page 1-4: Start MATLAB synchronously.

    "ConnectMATLAB" on page 1-5: Connect to shared MATLAB session synchronously.'
  merge: -1
  pgno: 7
