  md: '# mxDestroyArray (C)


    Free dynamic memory allocated by MXCREATE* functions


    # C Syntax


    ```

    #include "matrix.h"

    void mxDestroyArray(mxArray *pm);

    ```


    # Description


    mxDestroyArray deallocates memory for the specified mxArray including:


    +   - Characteristics fields of the mxArray, such as size (m and n) and type

    - Associated data arrays, such as ir and j for sparse arrays

    - Fields of structure arrays

    - Cells of cell arrays


    Do not call mxDestroyArray on a left-side argument of an myArray:


    +   - Returned in the left of a MEX file

    - Returned by the mxGetField or mxGetFieldByIndex function

    - Returned by the mxGetCell function


    # Input Arguments


    pm — Pointer to mxArray

    mxArray *


    Pointer to the mxArray to free, specified as mxArray *. If pm is a NULL pointer,
    then the function does nothing.


