  md: '# mxAssert (C)


    Check assertion value for debugging purposes


    # C Syntax


    ```

    #include "matrix.h"

    void mxAssert(int expr, char *error_message);

    ```


    # Arguments


    expr


    Value of assertion


    error_message


    Description of why assertion failed


    # Description


    Like the ANSI C assert macro, mxAssert checks the value of an assertion, and continues
    execution only if the assertion holds. If expr evaluates to 1 (true), mxAssert
    does nothing. If expr evaluates to 0 (false), mxAssert terminates the MEX file
    and prints an error to the MATLAB command window. The error contains the expression
    of the failed assertion, the file name, and line number where the failed assertion
    occurred, and the error message text. The error_message allows you to specify
    a better description of why the assertion failed. Use an empty string if you do
    not want a description to follow the failed assertion message.


    The mex script turns off these assertions when building optimized MEX functions,
    so use assertions for debugging purposes. To use mxAssert, build the MEX using
    the -g filename syntax.


    Assertions are a way of maintaining internal consistency of logic. Use them to
    keep yourself from missing your code and to prevent logical errors from propagating
    before they are caught. Do not use assertions to prevent users of your code from
    missing it.


    Assertions can be taken out of your code by the C preprocessor: You can use these
    checks during development and remove them when the code works properly. Use assertions
    for troubleshooting during development without slowing down the final product.


    # See Also


    mxAssert, mexErrMsgIdAndTxt


    # Version History


    Introduced before R2006a'
  merge: -1
