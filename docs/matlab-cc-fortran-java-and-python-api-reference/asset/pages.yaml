  md: '# mxGetField (C and Fortran)


    Pointer to field value from structure array, given index and field name


    # Syntax


    ```

    #include "matrix.h"

    mArray *mxGetField(const mxArray *pm, mwIndex index, const char *fieldname);

    ```


    # Fortran Syntax


    ```

    #include "intrf.h"

    mwPointer mxGetField(pm, index, fieldname)

    mPointer pm

    mwIndex index

    char*(*) filename

    ```


    # Arguments


    pm


    Pointer to a structure mxArray


    index


    Index of the desired element.


    In C, the first element of an mxArray has an index of 0. The index of the last
    element is N-1, where N is the number of elements in the array. In Fortran, the
    first element of an mxArray has an index of 1. The index of the last element is
    N, where N is the number of elements in the array.


    fieldname


    Name of the whose value you want to extract.


    # Returns


    Pointer to the mxArray in the specified field at the specified fieldname, success.
    Returns NULL in C (0 in Fortran) if passed an invalid argument or if there is
    no value assigned to the specified field. Common causes of failure:


    +   * Specifying an array pointer pm that does not point to a structure mxArray.
    To determine whether pm points to a structure mxArray, call mxIsStruct.

    * Specifying an index outside the bounds of the mxArray. For example, given a
    structure mxArray that contains 10 elements, you cannot specify an index greater
    than 9 in C (10 in Fortran).

    * Specifying a nonexistent fieldname. Call mxGetFieldNameByNumber or mxGetFieldNameNumber
    to get existing field names.

    * Insufficient heap space.'
  merge: -1
  pgno: 437
- img_proc: true
  md: '# Description


    Call mxGetField to get the value held in the specified element of the specified
    field. In pseudo-C

    terminology, mxGetField returns the value at:


    pm[index]. fieldname


    mxGetFieldByNumber is like mxGetField. Both functions return the same value. The
    only

    difference is in you specify the field. mxGetFieldByNumber takes a field number
    as its third

    argument, and mxGetField takes a field name as its third argument.


    Do not call mxDestroyArray on an myArray returned by the mxGetField function.


    Note Inputs to a MX-file are constant read-only mxArrays. Do not modify the inputs.
    Using

    mSetCell* or mxSetField* functions to modify the cells or fields of a MATLAB argument
    causes

    unpredictable results.


    In C, calling:


    ```

    mxGetField(pa, index, "field_name");

    ```


    is equivalent to calling:


    ```

    field_num = mxGetFieldByNumber(pa, "field_name");

    mGetFieldByNumber(pa, index, field_num);

    ```


    where, if you have a 1-by-1 structure, index is 0.


    In Fortran, calling:


    ```

    mxGetField(pm, index, ''fieldname'')

    ```


    is equivalent to calling:


    ```

    fieldnum = mxGetFieldNumber(pm, ''fieldname'')

    mGetFieldByNumber(pm, index, fieldnum)

    ```


    where, if you have a 1-by-1 structure, index is 1.


    # Examples


    See the following example in matlabroot/extern/examples/eng_mat.


    +   - matreadstructarray.c


    # See Also


    mxGetFieldByNumber, mxGetFieldNameByNumber, mxGetFieldNumber,

    mGetNumberOfFields, mxStruct, mxSetField, mxSetFieldByNumber'
