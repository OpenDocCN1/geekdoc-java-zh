  md: '# matlab.engine.MatlabEngine


    **Package:** matlab.engine


    Python object using MATLAB as computational engine within Python session


    # Description


    The MatlabEngine class uses a MATLAB process as a computational engine for Python.
    You can call MATLAB functions as methods of a MatlabEngine object because the
    functions are dynamically invoked when you call it. You can call functions and
    scripts that you define. You can send data to, and retrieve data from, the MATLAB
    workspace associated with a MatlabEngine object.


    # Creation


    The matlab.engine.start_matlab method creates a MatlabEngine object each time
    it is called. There is no need to call matlab.engine.MatlabEngine() to create
    MatlabEngine objects of yours.


    # Attributes


    | Attribute | Description |

    |---|---|\| workspace | Python dictionary containing references to MATLAB variables.
    You can assign data to, and get data from, a MATLAB variable through the workspace.
    The name of each MATLAB variable you create becomes a key in the workspace dictionary.
    The keys in workspace must be valid MATLAB identifiers (for example, you cannot
    use numbers as keys). |


    # Methods


    **Public Methods**


    The matlab::engine::MATLABEngine class provides these methods.


    +   * matlab.engine.start_matlab — Start MATLAB

    * matlab.engine.find_matlab — Find shared MATLAB sessions to connect to MATLAB
    Engine for Python

    * matlab.engine.connect_matlab — Connect to shared MATLAB session


    **Specialized Operators and Functions**


    You can call any MATLAB function as a method of a MatlabEngine object. The engine
    dynamically invokes a MATLAB function when you call it. The syntax supports positional,
    keyword, and output arguments of a function call.'
  merge: -1
