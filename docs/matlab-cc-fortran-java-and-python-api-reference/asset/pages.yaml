  md: '# engEvalString (C)


    Evaluate expression in string


    # C Syntax


    ```

    #include "engine.h"

    int engEvalString(Engine *ep, const char *string);

    ```


    # Description


    engEvalString evaluates the expression contained in string for the MATLAB engine
    session, previously started by engOpen.


    # UNIX Operating Systems


    On UNIX systems, engEvalString sends commands to the MATLAB workspace by writing
    down a pipe connected to it. MATLAB reads back from stdout any output resulting
    from the command that ordinarily appears on the screen, into the buffer defined
    by engOutputBuffer.


    To turn off output buffering in C, use:

    engOutputBuffer(ep, NULL, 0);


    # Microsoft Windows Operating Systems


    On a Windows system, engEvalString communicates with MATLAB using a Component
    Object Model (COM) interface.


    # Input Arguments


    +   * ep — Pointer to engine

    Engine *


    Pointer to engine, specified as Engine *.


    +   * string — Expression to evaluate

    const char *


    Expression to evaluate, specified as const char *.


    # Output Arguments — Status


    +   * status — Status

    int


    Status, returned as int. The function returns 1 if the engine session is no longer
    running or the engine pointer is invalid or NULL. Otherwise, returns 0 even if
    the MATLAB engine session cannot evaluate the command.'
  merge: -1
