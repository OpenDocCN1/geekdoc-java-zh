  md: '# MATFile (C and Fortran)


    Type for MAT-file


    # Description


    A handle to a MAT-file object. A MAT-file is the data file format MATLAB software
    uses for saving to your disk.


    MATFile is a C language opaque type.


    The MAT-file interface library contains routines for reading and writing MAT-files.
    Call these routines from your own C/C++ and Fortran programs, using MATFile to
    access your data file.


    The header file containing this type is:


    ```

    #include "mat.h"

    ```


    # Examples


