  md: '# mxGetPr (C)


    (Not recommended) Real data elements in mxDOUBLE_CLASS array


    Note mxGetPr is not recommended. Use mxGetDoubles or mxComplexDoubles instead.
    For more information, see "Compatibility Considerations".


    # C Syntax


    ```

    #include "matrix.h"

    mDouble *mxGetPr(const mxArray *pm);

    ```


    # Description


    Use mxGetPr on real arrays of type mxDOUBLE_CLASS only. For other numeric mxArray
    types, use "Typed Data Access in C MEX Files" functions. For complex arrays, see
    the description for output argument dt on page 1-0.


    Call mxIsDouble to validate the mxArray type. Call mxIsComplex to determine whether
    the data is real.


    # Input Arguments


    +   - pm - Pointer to MATLAB array

    mxArray *


    Pointer to a MATLAB array of type mxDOUBLE_CLASS, specified as mxArray *.


    # Output Arguments


    +   - dt - Pointer to data array

    mDouble * | NULL


    Pointer to the data array within an mxArray, specified as mxDouble *. The data
    in the output depends on which version of the C API you use:


    +   - If you build with the separate complex API (mex -R2017b option), then the
    function returns a pointer to the first mxDouble element of the real part of the
    data.

    - If you build with the interleaved complex API (mex -R2018a option) and pm is
    complex, then the function terminates the MEX file and returns control to the
    MATLAB prompt. In a non-MEX file application, the function returns NULL.


    If pm is NULL, the function returns NULL.


    # Version History


    Introduced before R2006a'
