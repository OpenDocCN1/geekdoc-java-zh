    \ a copy of the value. If the property uses a large amount of memory, creating\
    \ a copy might be a concern. There must be sufficient memory (the heap) to hold\
    \ the value.\n\n# Examples\n\n# Display Name Property of timeseries\n\nCreate\
    \ a MEX file, disproperty.c, in a folder for your MATLAB path.\n\n```\n/*==========================================================\n\
