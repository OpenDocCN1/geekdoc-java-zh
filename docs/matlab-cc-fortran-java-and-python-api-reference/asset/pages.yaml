    functions from within a MEX file. In addition, mexCallMATLABWithTrap lets you
    catch (trap) errors. Using this function for exception handling is more flexible
    using mexCallMATLAB with the mexSetTrapFlag function.


    Existing MEX files built with mexSetTrapFlag continue to run.


