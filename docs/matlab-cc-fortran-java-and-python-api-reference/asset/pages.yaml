  md: '# Description


    Connect synchronously to a shared MATLAB session on the local machine or start
    a new session if none exist.


    +   * If you specify the name of a shared MATLAB session but the engine cannot
    find a session with that name, the engine throwsnMathWorks.MATLAB.Exceptions.MATLABNotAvailableException.


    +   * If you do not specify a name and there are no shared MATLAB sessions available,
    the engine starts a new shared MATLAB session with default options.


    +   * If you do not specify a name and there are shared MATLAB sessions available,
    the engine connects to the first available session.


    # Parameters


    string name Name of the shared MATLAB session. Use FindMATLAB to get the name
    of shared MATLAB sessions.


    # Returns


    Instance of MATLABEngine


    # Throws


    MathWorks.MATLAB.Exc MATLAB fails to start or connect.

    options.MATLABNotAvailable Null string is not a valid argument.

    System.ArgumentNullException


    # C# Example


    ```

    Connect to the first shared MATLAB session found or start a new one.


    using (dynamic matlab = MATLAB.ConnectMATLAB()) {

    matlab.disp(newRunOptions(nargout: 0), ''Hello, shared MATLAB.'');

    }

    ```


    An example that displays a message if unable to locate or connect to MATLAB_1234,
    see "MathWorks.MATLAB.Exceptions.MATLABNotAvailableException".


    # VB.NET Example


    ```

    Connect to the first shared MATLAB session found or start a new one.


    Using matlab As Object = MATLABEngine.ConnectMATLAB()

    lab.disp(newRunOptions(nargout: 0), ''Hello, shared MATLAB.'')

    End Using

    ```


    # Strict Off


    ```

    Using matlab As Object = MATLABEngine.ConnectMATLAB("MATLAB_1234")

    matlab.disp(newRunOptions(nargout: 0), ''Hello, ''MATLAB_1234.'')

    End Using

    ```'
