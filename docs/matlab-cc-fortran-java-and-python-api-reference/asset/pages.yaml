  md: "# mexFunction (C)\n\nEntry point to C/C++ MEX function built with C Matrix\
    \ API\n\n# C Syntax\n\n```\n#include \"mex.h\"\nvoid mexFunction(int nlhs, mxArray\
    \ *plhs[], int nrhs,\n    const mxArray *prhs[])\n```\n\n# Description\n\nTo write\
    \ MEX functions using modern C++ features and the \"MATLAB Data API for C++\"\
    , see \"Write C++ Functions Callable from MATLAB (MEX Files)\".\n\nmexFunction\
    \ is not a routine. Rather, mexFunction is the name of the gateway in C which\
    \ every MEX function requires. When you invoke a MEX function, MATLAB finds and\
    \ loads the corresponding MEX function of the same name. MATLAB searches for a\
    \ symbol named mexFunction within the MEX function. If it finds one, it calls\
    \ the MEX function using the address of the mexFunction symbol. MATLAB displays\
    \ an error message if it cannot find a routine named mexFunction inside the MEX\
    \ function.\n\nWhen you invoke a MEX function, MATLAB automatically seeds nlhs,\
    \ plhs, nrhs, and prhs with the calling arguments. In the syntax of the MATLAB\
    \ language, functions have the general form:\n\n```\n[a,b,c,...] = fun(d,e,f,...).\n\
    ```\n\nwhere ... denotes more items of the same format. The a,b,c... are left-side\
    \ output arguments, and the d,e,f... are right-side input arguments. The arguments\
    \ nlhs and nrhs contain the number of left side and right side arguments, respectively.\
    \ prhs is an array of mxArray whose length is nrhs. plhs is an array whose length\
    \ is nlhs, where you function must set pointers for the output mxArrays.\n\n>\
    \ It is possible to return an output value even if nlhs = 0, which corresponds\
    \ to returning the result in the ans variable.\n\nTo experiment with passing input\
    \ arguments, build the mexFunction.c example, following the instructions in \"\
    Tables of MEX Function Source Code Examples\".\n\n# Input Arguments\n\n+   - nlhs\
    \ — Number of output arguments\nint\n\nNumber of expected mxArray output arguments,\
    \ specified as an integer.\n\n+   - plhs — MATLAB arrays\nmxArray*"
