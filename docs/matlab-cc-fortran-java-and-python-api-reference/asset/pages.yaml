  md: '# mxRealloc (C and Fortran)


    mxRealloc dynamic memory using MATLAB memory manager


    # C Syntax


    ```

    #include "matrix.h"

    #include <stdlib.h>

    void mxRealloc(void *ptr, mwSize size);

    ```


    # Fortran Syntax


    ```

    #include "fintrf.h"

    mwPointer mxRealloc(ptr, size)

    mwPointer ptr

    mwSize size

    ```


    # Arguments


    +   - ptr


    Pointer to a block of memory allocated by mxCalloc, mxMalloc, or mxRealloc.


    +   - size


    New size of allocated memory, by bytes.


    # Returns


    Pointer to the start of the allocated block of memory, if successful. If unsuccessful
    in a MAT or engine standalone application, then mxRealloc returns NULL in C (
    in Fortran) and leaves the original memory block unchanged.(Use mxFree to free
    the original memory block). If unsuccessful in a MEX file, the MEX file terminates
    and returns control to the MATLAB prompt.


    mxRealloc is unsuccessful when there is insufficient heap space.


    # Description


    mxRealloc changes the size of a memory block that has been allocated with mxCalloc,
    mxMalloc, or mxRealloc. To allocate memory in MATLAB applications, use mxRealloc
    instead of the ANSI C realloc function.


    mxRealloc changes the size of the memory block pointed by ptr to size. The contents
    of the allocated memory are unchanged up to the smaller of the new and old. The
    allocated memory might be in a different location from the original memory, so
    the returned pointer can be different from ptr. If the memory location changes,
    then mxRealloc frees the original memory block pointed to ptr.


    If size is greater than 0 and ptr is NULL in C ( in Fortran), then mxRealloc behaves
    like mxCalloc. mxRealloc allocates a new block of memory of size bytes and returns
    a pointer to the new block.'
  merge: -1
  pgno: 550
