  md: "# mxSetPi (C)\n\n(Not recommended) Set imaginary data elements in mxDOUBLE_CLASS\
    \ array\n\n**Note** mxSetPi is not available in the interleaved complex API. Use\
    \ mxSetComplexDoubles instead. For more information, see \"Compatibility Considerations\"\
    .\n\n# C Syntax\n\n```\n#include \"matrix.h\"\nvoid mxSetPi(mxArray *pm, double\
    \ *pi);\n```\n\n# Description\n\nUse mxSetPi to set the imaginary data of the\
    \ specified mxArray.\n\nmxCreate* functions optionally allocate heap space to\
    \ hold imaginary data. If you allocate heap space when calling an mxCreate* function,\
    \ then do not use mxSetPi to initialize the imaginary elements of the array. Call\
    \ this to replace existing values with new values. Examples of allocating heap\
    \ space include setting the ComplexFlag to mxCOMPLEX or setting pi to a non-NULL\
    \ value.\n\nThe mxSetPi function does not free any memory allocated for existing\
    \ data that it displaces. To free existing memory, call mxFree on the pointer\
    \ returned by mxGetPi.\n\n# Input Arguments\n\n+   - pm — Pointer to MATLAB array\n\
    \  mxArray *\n\nPointer to a MATLAB array of type mxDOUBLE_CLASS, specified as\
    \ mxArray *.\n\n+   - pi — Pointer to data array\n  double *\n\nPointer to the\
    \ first mxDouble element of the imaginary part of the data within an mxArray,\
    \ specified as double *. Each element in the array contains the imaginary component\
    \ of a value.\n\nThe array must be in dynamic memory. Call mallocalloc to allocate\
    \ this memory. Do not use the ANSI C calloc function, which can cause memory alignment\
    \ issues leading to program termination. If pi points to static memory, then memory\
    \ leaks and other memory errors can result.\n\n# Version History\n\nIntroduced\
    \ before R2006a\n\n**Do not use separate complex API**\n recommended starting\
    \ in R2018a"
  merge: -1
