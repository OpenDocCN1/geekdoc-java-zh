  md: '# mxSetData (C)


    Set pointer to elements in nonnumeric mxArray


    > **Note** mxSetData is not recommended for numeric arrays. Use typed, data-access
    functions instead. For more information, see "Compatibility Considerations".


    # C Syntax


    ```

    #include "matrix.h"

    void mxSetData(mxArray *pm, void *pa);

    ```


    # Description


    Use mxSetData to set data elements for nonnumeric arrays.


    For numeric arrays, MathWorks recommends that you create MEX files and update
    existing MEX files using the typed, data-access functions in the interleaved complex
    API. For more information, see:


    +   * "Typed Data Access in C MEX Files"

    * "MATLAB Support for Interleaved Complex API in MEX Functions"

    * "Upgrade MEX Files to Use Interleaved Complex API"

    * Example arrayFillData.c


    To build the MEX file, call mex with the -R2018a option.


    The mxSetData function does not free memory allocated for existing data. To free
    existing memory, call mxFree on the pointer returned by mxGetData.


    # Input Arguments


    **pm — Pointer to nonnumeric MATLAB array**

    mxArray *


    Pointer to a nonnumeric MATLAB array, specified as mxArray *.*


    **pa — Pointer to data array**

    void *


    Pointer to the data array within an mxArray, specified as void *.


    The array must be dynamic in memory. Call mxCalloc to allocate this memory. Do
    not use the ANSI calloc function, which can cause memory alignment issues leading
    to program termination.


    # Version History


    Introduced before R2006a'
