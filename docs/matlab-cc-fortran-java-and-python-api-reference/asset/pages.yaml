  md: "# mxSetDimensions (C)\n\nModify number of dimensions and size of each dimension\n\
    \n# C Syntax\n\n```\n#include \"matrix.h\"\nint mxSetDimensions(mxArray *pm, const\
    \ mxSize *dims, mxSize nddim);\n```\n\n# Description\n\nmxSetDimensions returns\
    \ 0 on success, and 1 on failure. mxSetDimensions allocates heap space to hold\
    \ the input array size. So it is possible (though unlikely) increasing the number\
    \ of dimensions can cause the system to run out of heap space.\n\nCall mxSetDimensions\
    \ to reshape an existing mxArray, mxSetDimensions is like mxSetM and mxSetN; however,\
    \ mxSetDimensions provides greater control for reshaping mxArray that has more\
    \ than two dimensions.\n\nmxSetDimensions does not allocate or deallocate space\
    \ for the pr or pi arrays. If your call to mxSetDimensions increases the number\
    \ of elements in the mxArray, enlarge the pr (and pi, if it exists) accordingly.\n\
    \nIf you call mxSetDimensions reduces the number of elements in the mxArray, you\
    \ can optionally reduce the size of the pr and pi arrays using mxRealloc.\n\n\
    MATLAB automatically removes any trailing singleton dimensions specified in the\
    \ dims argument. For example, if nddim equals 5 and dims equals [4 7 1 1 1], then\
    \ the resulting array has the dimensions 4-1-by-7.\n\n# Input Arguments\n\n+ \
    \  - MATLAB array\n  const mxArray*\n\nPointer to an mxArray array, specified\
    \ as const mxArray*.\n\n+   - Dimensions array\n  mwSize\n\nDimensions array.\
    \ Each element in the dimensions array contains the size of the array in that\
    \ dimension, specified as mwSize. For example, in Fortran, setting dims(1) to\
    \ 5 and dims(2) to 7 establishes a 5-by-7 mxArray. In most cases, there are nddim\
    \ elements in the dims array.\n\n+   - Number of dimensions\n  mwSize\n\nNumber\
    \ of dimensions, specified as mwSize."
