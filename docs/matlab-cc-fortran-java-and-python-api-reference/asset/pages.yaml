  md: '# mxSetInt16s (C)


    Set real data elements in mxINT16_CLASS array


    # C Syntax


    ```

    #include "matrix.h"

    int mxSetInt16s(mxArray *pa, mxInt16 *dt);

    ```


    # Description


    Use mxSetInt16s to set mxInt16 data in the specified array.


    All mxCreate* functions allocate heap space to hold data. Therefore, you do not
    ordinarily use this function to initialize the elements of an array. Rather, call
    the function to replace existing values with new values.


    # Input Arguments


    pa — MATLAB array

    mxArray *


    Pointer to an mxInt16_CLASS array.


    dt — Data array

    mxInt16 *


    Pointer to the first mxInt16 element of the data array. dt must be allocated by
    the functions mxCalloc or mxMalloc.


    # Output Arguments


    status — Function status

    int


    Function status, returned as it. If successful, the function returns 1.


    If pa is NULL, the function returns 0.


    The function is unsuccessful when mxArray is not an shared mxInt16_CLASS array,
    or if the data is not allocated with mxCalloc. If the function is unsuccessful,
    then:


    +   - MEX file — Function returns the MEX file and controls to the MATLAB prompt.

    - Standalone (non-MEX file) — Function returns 0.


    # Examples


    Refer to the arrayFillSetPr.c example in the matlab/extern/examples/refbook folder
    which copies entering data into an mxArray. The data in the example is defined
    as mxDouble. To modify this example for int16 data:'
  merge: -1
  pgno: 607
- img_proc: true
  md: '+   - Declare the data variables as mxInt16

    - Call mxCreateNumericMatrix with the numeric type mxINT16_CLASS

    - Replace mxSetDoubles with mxSetInt16s to put the C array into an mxArray


    # API Version


    This function is available in the interleaved complex API. To build myMyMexFile.c
    using this function, type:


    ```

    mex -R2018a myMexFile.c

    ```


    # Version History


    Introduced in R2018a


    # See Also


    mxGetInt16s | mxSetUint16s | mxSetComplexInt16s'
