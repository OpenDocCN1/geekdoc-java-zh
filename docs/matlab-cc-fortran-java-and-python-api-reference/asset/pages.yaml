  md: '# mxSetComplexInt8s (C)


    Set complex data elements in mxINT8_CLASS array


    # C Syntax


    ```

    #include "matrix.h"

    int mxSetComplexInt8s(mxArray *pa, mxComplexInt8 *dt);

    ```


    # Description


    Use mxSetComplexInt8s to set mxComplexInt8 data in the specified array.


    All mxCreate* functions allocate heap space to hold data. Therefore, you do not
    ordinarily use this function to initialize the elements of an array. Rather, call
    the function to replace existing values with new values.


    # Input Arguments


    +   pa — MATLAB array

    mxArray *


    Pointer to an mxINT8_CLASS array.


    +   dt — Data array

    mxComplexInt8 *


    Pointer to the first mxComplexInt8 element of the data array, dt must be allocated
    by the functions mxCalloc or mxMalloc.


    # Output Arguments


    +   status — Function status

    int


    Function status, returned as int. If successful, the function returns 1.


    If pa is NULL, the function returns 0.


    The function is unsuccessful when mxArray is not an mxINT8_CLASS array, or if
    the data is not allocated with mxCalloc. If the function is unsuccessful, then:


    +   * MEX file — Function terminates the MEX file and returns control to the MATLAB
    prompt.

    * Standalone (non-MEX file) application — Function returns 0.


    # Examples


    Refer to the arrayFillSetComplexPr.c example in the matlabroot/extern/examples/refbook
    folder which copies existing complex numeric data into an mxArray. The data in'
