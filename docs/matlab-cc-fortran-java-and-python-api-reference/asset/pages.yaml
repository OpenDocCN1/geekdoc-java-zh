  md: "# mxSetN (C)\n\nSet number of columns in mxArray\n\n# C Syntax\n\n```\n#include\
    \ \"matrix.h\"\nvoid mxSetN(mxArray *pm, mwSize n);\n```\n\n# Description\n\n\
    mxSetN sets the number of columns in the specified mxArray. The term columns always\
    \ means the second dimension of a matrix. Calling mxSetN forces an mxArray to\
    \ have two dimensions. For example, if pm points to an mxArray having three dimensions,\
    \ then calling mxSetN reduces the mxArray to two.\n\nYou typically use mxSetN\
    \ to change the shape of an existing mxArray. The mxSetN function does not allocate\
    \ or deallocate any for the pr, pi, ir, or j arrays. So, if your calls to mxSetN\
    \ and mxSetM increase the number of elements in the mxArray, then enlarge the\
    \ pr, pi, ir, and/or j arrays.\n\nIf calling mxSetM and mxSetN reduces the number\
    \ of elements in the mxArray, you might want to reduce the sizes of the pr, pi,\
