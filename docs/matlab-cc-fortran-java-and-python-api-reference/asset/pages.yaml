  md: '# matlab.engine.start_matlab


    Start MATLAB Engine for Python


    # Syntax


    ```

    eng = matlab.engine.start_matlab()

    eng = matlab.engine.start_matlab(option)

    eng = matlab.engine.start_matlab(background)

    eng = matlab.engine.start_matlab(async)

    eng = matlab.engine.start_matlab(__)

    ```


    # Description


    eng = matlab.engine.start_matlab() starts a new MATLAB process, and returns Python
    variable eng, which is a MatlabEngine object for communicating with the MATLAB
    process.


    If MATLAB cannot be started, the engine raises an RuntimeError exception.


    eng = matlab.engine.start_matlab(option) uses startup options specified by option.


    For example, call matlab.engine.start_matlab(''-desktop'') to start the MATLAB
    desktop from Python.


    eng = matlab.engine.start_matlab(background) starts MATLAB asynchronously if background
    is True.


    eng = matlab.engine.start_matlab(async) starts MATLAB asynchronously if async
    is True. Not recommended. Use the background argument instead. Do not use for
    Python Version 3.7 or later. For more information, see "Compatibility Considerations"
    on page 1-250.


    eng = matlab.engine.start_matlab(__) can include any of the input arguments in
    previous synt.


    # Examples


    # Start MATLAB Engine from Python


    Start an engine and a new MATLAB process from the Python command line.


    ```

    import matlab.engine

    eng = matlab.engine.start_matlab()

    ```


    # Start Multiple Engines


    Start a different MATLAB process from each engine.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '```

    import matlab.engine

    eng1 = matlab.engine.start_matlab()

    eng2 = matlab.engine.start_matlab()

    ```


    # MATLAB Desktop with Engine


    Start an engine with the MATLAB desktop.


    ```

    import matlab.engine

    eng = matlab.engine.start_matlab("-desktop")

    ```


    You can also start the desktop after you start the engine.


    ```

    import matlab.engine

    eng = matlab.engine.start_matlab()

    eng.desktop(nargout=0)

    ```


    > Note you call MATLAB functions from both the desktop and Python.


    # Start Engine Asynchronously


    Start the engine with background=True. While MATLAB starts, you can enter commands
    at the Python command line.


    ```

    import matlab.engine

    future = matlab.engine.start_matlab(background=True)

    eng = future.result()

    eng.sqrt(4).

    ```


    2.0


    # Input Arguments


    +   option — Startup options for MATLAB process

    ''-desktop'' (default) | string


    Startup options for the MATLAB process, specified as a string. You can specify
    multiple startup options. The engine supports all MATLAB startup options, except
    the options listed in "Limitation" on page 1-250. For a list of options, see the
    platform-specific command matlab (Windows), matlab (macOS), or matlab (Linux).


    To start MATLAB with the desktop, use the ''-desktop'' option.


    Example: matlab.engine.start_matlab(''-desktop -r "format short") starts the desktop
    from Python. The engine passes ''-r "format short"'' to MATLAB.


    +   background — Start MATLAB synchronously or asynchronously

    False (default) | logical


    Start MATLAB synchronously or asynchronously, specified as a logical keyword argument.
    background is an alias for async.'
