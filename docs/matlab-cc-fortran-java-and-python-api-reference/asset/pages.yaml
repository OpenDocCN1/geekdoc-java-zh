  md: '# mxGetPi (Fortran)


    (Not recommended) Imaginary data elements in mxDOUBLE_CLASS array


    **Note** mxGetPi is not available in the interleaved complex API. Use mxGetComplexDoubles
    instead. For more information, see "Compatibility Considerations".


    # Fortran Syntax


    ```

    #include "intrff.h"

    mwPointer mxGetPi(pm)

    mwPointer pm

    ```


    # Description


    When building MEX files using the separate complex API, call mxGetPi to get the
    contents of the pi field. pi is an array containing the imaginary data of the
    mxArray. Use mxGetPi on arrays of type mxDOUBLE_CLASS only. For numeric mxArray
    types, use mxGetImagData.


    Call mxIsDouble to validate the mxArray type. Call mxIsComplex to determine whether
    the data is complex.


    If any of the input matrices to a function are complex, then MATLAB allocates
    the imaginary parts of all input matrices.


    # Input Arguments


    +   pm — Pointer to MATLAB array

    mwPointer


    Pointer to a MATLAB array of type mxDOUBLE_CLASS, specified as mwPointer. Complex
    Number Support: Yes


    # Output Arguments


    +   pi — Pointer to data array

    mwPointer


    Pointer to the first mxDouble element of the imaginary part of the data array
    within an mxArray, specified as mwPointer. The function returns θ if no imaginary
    data exists or if an error occurs.


    # Version History


    Introduced before R2006a


    **Do not use separate complex API**

    Not recommended starting in R2018b'
