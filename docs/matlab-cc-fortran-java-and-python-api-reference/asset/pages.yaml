  md: '# mxSetJc (C and Fortran)


    JC array of sparse array


    # C Syntax


    ```

    #include "matrix.h"

    void mxSetJc(mxArray *pm, mwIndex *jc);

    ```


    # Fortran Syntax


    ```

    #include "fintrf.h"

    subroutine mxSetJc(pm, jc)

    mPointer pm, jc

    ```


    # Arguments


    +   pm

    Pointer to a sparse mxArray

    jc

    Pointer to the jc array


    # Description


    Use mxSetjc to specify a new jc array for a sparse mxArray. The jc array is an
    integer array having n+1 elements, where n is the number of columns in the sparse
    mxArray.


    If the jth column of the sparse mxArray has any nonzero elements, then:


    +   - j[j] is the index in ir, pr, and p1 (if it exists) of the first nonzero
    element in the jth column.

    - jc[j+1]-1 is the index of the last element in the jth column.

    - For the jth column of the sparse matrix, jc[j] is the total number of nonzero
    elements in the preceding columns.


    The number of nonzero elements in the jth column of the sparse mxArray is:


    ```

    jc[j+1] - jc[j];

    ```


    For the jth column of the sparse mxArray, jc[j] is the total number of nonzero
    elements in all preceding columns. The last element of the jc array, jc[number
    of columns], is equal to nnz, which is the number of nonzero elements in the entire
    sparse mxArray.


    For example, consider a 7-by-3 sparse mxArray containing six nonzero elements,
    created by typing:


    ```

    Sparrow = zeros(7,3);

    Sparrow(2,1) = 1;

    Sparrow(5,1) = 1;

    Sparrow(3,2) = 1;

    Sparrow(2,3) = 2;

    ```'
