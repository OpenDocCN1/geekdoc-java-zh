  md: '# mxIsClass (Fortran)


    Determine whether mxArray is object of specified class


    # Fortran Syntax


    ```

    #include "fintrf.h"

    integer*4 mxIsClass(pm, classname)

    mPointer pm

    character*(*) classname

    ```


    # Description


    Each mxArray is tagged as being a certain type. mxIsClass returns 1 if the mxArray
    is of the specified type. Otherwise, the function returns 0.


    MATLAB does not check if the class is derived from a base class.


    In Fortran:


    ```

    mxIsClass(pm, ''double'')

    ```


    is equivalent to calling either one of the following:


    ```

    mxIsDouble(pm)

    mxGetClassName(pm) .eq ''double''

    ```


    It is more efficient to use the mxIsDouble form.


    # Input Arguments


    +   pm — MATLAB array

    mwPointer


    Pointer to an mxArray array, specified as mwPointer.


    +   classname — Array category to test

    character(*)


    Array category to test, specified as character(*). Use one of these predefined
    constants. Do not specify classname as an integer identifier.


    | Value of classname | Corresponding Class |

    |---|---|n| cell | mxCELL_CLASS |

    | char | mxCHAR_CLASS |

    | double | mxDOUBLE_CLASS |

    | function_handle | mxFUNCTION_CLASS |

    | int8 | mxINT8_CLASS |

    | int16 | mxINT16_CLASS |'
