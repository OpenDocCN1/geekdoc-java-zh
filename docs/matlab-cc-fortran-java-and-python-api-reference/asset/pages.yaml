    # Input Arguments


    name — Name of shared MATLAB session

    character array


    Name of the shared MATLAB session, specified as a character array. The name must
    be a valid MATLAB variable name.


    background — Start MATLAB synchronously or asynchronously

    False (default) | logical


    Connect to MATLAB synchronously or asynchronously, specified as a logical keyword
    argument.

    Example: matlab.engine.connect_matlab(background=True)


    async — Start MATLAB synchronously or asynchronously

    False (default) | logical


    Connect to MATLAB synchronously or asynchronously, specified as a logical keyword
    argument. Not recommended. Use the background argument instead. For more information,
    see “Compatibility Considerations” on page 1-250.


    # Output Arguments


    eng — Python variable for communicating with MATLAB

    MatlabEngine object


    Python variable for communicating with MATLAB, returned as a MatlabEngine object.
    eng communicates with a shared MATLAB session that is already running on your
    local machine


    # Limitations


    +   - Do not connect the engine multiple times to the same shared MATLAB session.


    # Version History


    Introduced in R2015b


    Use background Argument to Start Engine Asynchronously'
