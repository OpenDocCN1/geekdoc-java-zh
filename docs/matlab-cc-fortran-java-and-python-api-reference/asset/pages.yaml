    # # Examples


    # ## Test Array for COMPLEX_DOUBLE Type


    Suppose that you have an array declared as follows.

    matlab::data::TypedArray<double> const argArray


    After you set values for argArray, call the sqrt function.


    ```

    matlab::data::Array count results = matlab::pytr::eval(u''sqrt'', argArray);

    ```


    These statements test the result for type COMPLEX_DOUBLE and then set the array
