  md: '# Engine (C)


    Type for MATLAB engine


    # Description


    A handle to a MATLAB engine object.


    Engine is a C language opaque type.


    You can call MATLAB as a computational engine by writing C programs that use the
    MATLAB engine library. Engine is the link between your program and the separate
    MATLAB engine process.


    The header file containing this type is:


    ```

    #include "engine.h"

    ```


    # Examples


    See these examples in matlabroot/extern/examples/eng_mat:


    +   * engdemo.c shows how to call the MATLAB engine functions from a C program.

    * engwindemo.c show how to call the MATLAB engine functions from a C program for
    Windows systems.

    * fengdemo.F shows how to call the MATLAB engine functions from a Fortran program.


    # See Also


    engopen'
  merge: -1
  pgno: 204
