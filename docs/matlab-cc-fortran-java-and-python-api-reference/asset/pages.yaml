  md: '# mxCalcSingleSubscript (Fortran)


    Offset from first element to desired element


    # Fortran Syntax


    ```

    #include "fintrf.h"

    mwIndex mxCalcSingleSubscript(pm, nsubs, subs)

    mwPointer pm

    mSize nsubs

    mwIndex subs

    ```


    # Description


    Call mxCalcSingleSubscript to determine how many elements are between the beginning
    of the mxArray and a given element. The function converts subscripts to indices.


    For example, a given subscript like (5,7), mxCalcSingleSubscript returns the distance
    from the first element of the array to the (5,7) element. Remember that the mxArray
    data internally represents all data in a one-dimensional array no matter how many
    dimensions the mxArray appears to be. For examples showing the internal representation,
    see “Data Storage”.


    # Input Arguments


    +   - pm — MATLAB array

    mPointer


    Pointer to an mxArray, specified as mwPointer.


    +   - nsubs — Number of elements

    mSize


    Number of elements in the subs array, specified as mwSize. Typically, you set
    nsubs equal to the number of dimensions in the mxArray that pm points to.


    +   - subs — Array of subscripts

    mIndex


    Array of subscripts, specified as mwIndex. Each value in the array specifies that
    dimension''s subscript. The value in subs (1) specifies the row subscript, and
    the value in subs (2) specifies the column subscript. Use 1-based indexing for
    subscripts. For example, to express the starting element of a two-dimensional
    mxArray in subs, subs (1) to 1 and subs (2) to 1.


    # Returns


    The number of elements, or index, between the start of the mxArray and the specified
    subscript. This number is the linear index equivalent of the subscripts. Many
    Matrix Library routines (for example, mxGetField) require an index as an argument.'
  merge: -1
