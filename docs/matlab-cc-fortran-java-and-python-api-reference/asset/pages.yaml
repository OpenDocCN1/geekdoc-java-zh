  md: "# Description\n\nFind all shared MATLAB sessions on the local machine synchronously.\n\
    \n# Parameters\n\nNone\n\n# Returns\n\nArray of the names of all shared MATLAB\
    \ sessions on the local machine, or an empty array if none are available\n\n#\
    \ C# Example\n\nConnect to a specific MATLAB session.\n\n```\n// Find shared MATLAB\
    \ sessions\nstring[] names = MATLABEngine.FindMATLAB();\nif (names.Length == 0)\n\
    \    Console.WriteLine(\"No shared MATLAB sessions found.\");\nmyMATLAB = names[0];\
    \ // Pick the first\nusing matlab matlab = MATLABEngine.ConnectMATLAB(myMATLAB);\n\
    matlab.disp(new RunOptions(nargout: 0), \"Hello, shared MATLAB.\");\n```\n\n#\
    \ VB.NET Example\n\nConnect to a specific MATLAB session.\n\n```\nOption Strict\
    \ Off\nFind shared MATLAB sessions\nDim names As String() = MATLABEngine.FindMATLAB()\n\
    If names.Length = 0 Then\n    Console.Error.WriteLine(\"No shared MATLAB sessions\
    \ found.\")\nEnd If\nDim myMATLAB = names(0) 'Pick the first\nUsing MATLAB As\
    \ Object = MATLABEngine.ConnectMATLAB(myMATLAB)\nmatlab.disp(new RunOptions(nargout=0),\
    \ \"Hello, shared MATLAB.\")\n```\n\n# FindMATLABAsync\n\n```\nstatic Task<string[]>\
    \ FindMATLABAsync(System.Threading.CancellationToken token);\n```\n\n# Description\n\
    \nFind and return asynchronously the names of all shared MATLAB sessions on the\
    \ local machine.\n\n# Parameters\n\n| CancellationToken | Cancellation token used\
    \ to cancel asynchronous tasks. The default is System.Threading.CancellationToken.None.\
    \ |\n\n# Returns\n\nTask that completes with an array of the names of all shared\
    \ MATLAB sessions on the local machine"
