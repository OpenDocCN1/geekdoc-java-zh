  md: '# matlab::engine::connectMATLAB


    Connect to shared MATLAB session synchroniously


    # Description


    std::unique_ptr<MatlabEngine> connectMATLAB()


    std::unique_ptr<MatlabEngine> connectMATLAB(const matlab::engine::String& name)


    Connect synchronously to a shared MATLAB session on the local machine.


    +   * If you specify the name of a shared MATLAB session, but the engine cannot
    find a session with that name, the engine throws an exception.

    * If you do not specify a name and there is no shared MATLAB session available,
    the engine starts a new shared MATLAB session. The MATLAB desktop is not started.

    * If you do not specify a name and there are shared MATLAB sessions available,
    the engine connects to the first available session.


