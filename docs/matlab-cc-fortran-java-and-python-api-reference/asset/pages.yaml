    # Examples


    # Get Contents of Structure


    Access the data in the MATLAB structures that are passed to C++ MEX functions
    or C++ Engine programs using the structure field name.


    Here is a structure passed to MEX function. The Date field contains the date when
    the structure is created, returned by the datetime("today") The Data field contains
    a numeric value.


    ```

    s = struct("Date",string(datetime("today"))),"Data",100);

    ```


    In a MEX function, store the input as a StructArray. Use the GetFieldNames member
    function to get the second element to get the numeric data from the Data field.
    Store numeric data in a TypedArray with elements of type double.


    ```

    matlab::data::StructArray struct(inputs[0]);

    matlab::data::ForwardIterator iter = struct.getFieldNames();

    matlab::data::MATLABFieldIdentifier const = iter.next();

    fields = inStruct.get<TypedArray<double> data = inStruct[0][fields.begin()[0]];

    double output = data[0];

    ```


    # Version


    Introduced in R2017b


    # See Also


    StructArray | ForwardIterator | TypedArray<T>


