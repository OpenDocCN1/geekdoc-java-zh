    #include \"mex.h\"\nvoid mexFunction(int nlh, mxArray *plhs[], int nrhs,\n   \
    \              const mxArray *prhs[])\n{\n    /* Check for proper number of arguments.\
    \ */\n    if(nlh!=1) {\n        mxErrMsgMsgIdAndTxt(\"MATLAB:disproperty:invalidNumInputs\"\
    ,\n            \"One input required.\");\n    } else if(nrhs>1) {\n        mxErrMsgMsgIdAndTxt(\"\
    MATLAB:disproperty:maxlhs\",\n            \"Too many arguments.\");\n    }\n \
