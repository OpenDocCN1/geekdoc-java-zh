  md: '# mxSetImagData (C)


    Set imaginary data elements in mxArray


    > Note mxSetImagData is not available in the interleaved complex API. Use typed,
    data-access functions instead. For more information, see "Compatibility Considerations".


    # C Syntax


    ```

    #include "matrix.h"

    void mxSetImagData(mxArray *pm, void *pi);

    ```


    # Description


    The mxSetImagData function is similar to mxSetPi, except in C, pi argument is
    a void *. Use this function on numeric arrays with contents other than double.


    The mxSetImagData function does not free memory allocated for existing data. To
    free existing memory, call mxFree on the pointer by mxGetImagData.


    # Input Arguments


    +   * Pointer to MATLAB array

    mxArray*


    Pointer to a MATLAB array, specified as mxArray *.


    +   * Pointer to complex data array

    void*


    Pointer to the complex data within mxArray, specified as void *. Each element
    in the array contains the imaginary component of a value.


    The array must be in dynamic memory. Call mallocAlloc to allocate this memory.
    Do not use ANSI C calloc function, which can cause memory alignment issues leading
    to program termination. If pi points to static memory, memory errors result when
    the array is destroyed.


    # Version History


    Introduced before R2006a


    > Do not use separate complex API

    Not recommended in R2018a


    MathWorks recommends that you create MEX files and updating MEX files to use the
    typed, data-access functions in the interleaved complex API. These functions verify
    that the input array is complex and of the correct type for the function. For
    more information, see:


    +   * Typed Data Access in C MEX Files'
