  md: "# mexEvalString (C)\n\nExecute MATLAB command in caller workspace\n\n# C Syntax\n\
    \n```\n#include \"mex.h\"\nint mexEvalString(const char *command);\n```\n\nNote\
    \ To write MEX functions using modern C++ features and the \"MATLAB Data API for\
    \ C++\", see \"Write C++ Functions from MATLAB (MEX Files)\".\n\nCall mexEvalString\
    \ to invoke a MATLAB command in the workspace of the caller.\n\nmexEvalString\
    \ and mexCallMATLAB both execute MATLAB commands. Use mexCallMATLAB for returning\
    \ values (left side arguments). The mexEvalString function does not return values\
    \ to the MEX function.\n\nAll arguments that appear to the right of an equal sign\
    \ in the command string must be variables of the caller. Do not use MATLAB function\
    \ names for variable names. Common variable names that conflict with function\
    \ names include i, j, mode, char, size, or path. Determine whether a particular\
    \ name is associated with a MATLAB function, use the function help. For more information,\
    \ see \"Variable Names\".\n\n# Input Arguments\n\n+   - MATLAB command name\n\
    const char*\n\nName of the MATLAB command to execute, specified as const char*.\
    \ The function supports UTF-8 characters.\n\n# Output Arguments\n\n+   - **Status\
    \ — Status**\rint\n\nThe function returns 0 if successful, and 1 if an error occurs.\n\
    \n# Error Handling\n\nIf command detects an error, MATLAB returns control to the\
    \ MEX function and mexEvalString returns 1. To trap errors, use the mexEvalStringWithTrap\
    \ function."
