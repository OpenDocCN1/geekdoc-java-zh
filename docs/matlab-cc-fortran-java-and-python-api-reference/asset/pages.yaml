    mwPointer pm\n```\n\n# Arguments\n\n+   pm\n  Pointer to a sparse mxArray\n\n\
    # Returns\n\nNumber of elements allocated to hold nonzero entries in the specified\
    \ sparse mxArray, on success.\nReturns an indeterminate value on error. The most\
    \ likely cause of failure is that pm points to a full\n(nonsparse) mxArray.\n\n\
    # Description\n\nUse mxGetNzmax to get the value of the nzmax field. The nzmax\
    \ field holds an integer value that signifies the number of elements in the ir,\
    \ pr, and, if it exists, the pi arrays. The value of nzmax is always greater than\
    \ equal to the number of nonzero elements in a sparse mxArray. In addition, the\
    \ value of nzmax is always less than equal to the number of rows times the number\
    \ of columns.\n\nAs you adjust the number of nonzero elements in a sparse mxArray,\
    \ MATLAB software often adjusts the value of the nzmax field. MATLAB adjusts nzmax\
    \ to reduce the number of costly reallocations and to optimize its use of heap\
    \ space.\n\n# Examples\n\nSee these examples in matlab/root/extern/examples/mx:\n\
    \n+   * mxgetnzmax.c\n* mxsetnzmax.c\n\n# See Also\n\nmxSetNzmax"
