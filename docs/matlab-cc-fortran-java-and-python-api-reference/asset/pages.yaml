  md: '# mxCreateStructArray (C)


    N-D structure array


    # C Syntax


    ```

    #include "matrix.h"

    mArray mx = mxCreateStructArray(dims, const int nfields, const char **fieldnames);

    ```


    # Description


    Call mxCreateStructArray to create an unoccupied structure mxArray. Each element
    of a structure mxArray contains the same number of fields (specified in nfields).
    Each field has a name, specified in fieldnames. A MATLAB structure is conceptually
    identical to an array of structs in the C language.


    Each field holds one mxArray pointer initialized to NULL. Call mxField or mxFieldName
    to place a non-NULL mxArray pointer in the field.


    The function automatically removes trailing dimensions specified in the dims argument.
    For example, if ndim equals 5 and dims equals [4 1 7 1 1], the dimensions of the
    resulting array are 4-by-1-by-7.


    Call mxDestroyArray when you finish using the mxArray to deallocate mxArray and
    its associated elements.


    # Input Arguments


    +   **ndim — Number of dimensions**

    mSize


    Number of dimensions, specified as mwSize. If ndim is less than 2, then mxCreateStructArray
    sets the number of dimensions to 2.


    +   **dims — Dimensions array**

    ray const mwSize


    Dimensions array, specified as an array const mwSize contains the size of the
    array in that dimension. For example, to create a 5-by-7 array, set dims[0] to
    5 and dims[1] to 7.


    Usually, the dims array contains ndim elements.


    +   **nfields — Number of fields**

    int


    Number of fields in each element, specified as int.


    +   **fieldnames — Field names**

    const char **'
