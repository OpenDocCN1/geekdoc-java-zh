  md: '# mxCreateNumericArray (C)


    N-D numeric array


    # C Syntax


    ```

    #include "matrix.h"

    mArray *mxCreateNumericArray(mwSize ndim, const mwSize *dims,

    mxClassID classid, mxComplexity ComplexFlag);

    ```


    # Description


    Use mxCreateNumericArray to create an N-dimensional mxArray. The data elements
    have the numeric type specified by classid.


    mxCreateNumericArray differs from mxCreateDoubleMatrix as follows:


    +   - All data elements in mxCreateDoubleMatrix are double-precision, floating-point
    numbers. The data elements in mxCreateNumericArray can be any numerical type,
    including integer precisions.

    - mxCreateDoubleMatrix creates two-dimensional arrays only. mxCreateNumericArray
    can create arrays of two or more dimensions.


    MATLAB automatically removes any trailing singleton dimensions in the dims argument.
    For example, if ndim equals 5 and dims equals [4 1 7 1 1], then the resulting
    array has the dimensions 4-by-1-by-1.


    This table shows the C classid values that are equivalent to MATLAB classes.


    | MATLAB Class Name | C classid Value |

    |---|---|n| int8 | mxINT8_CLASS |

    | uint8 | mxUINT8_CLASS |

    | int16 | mxINT16_CLASS |

    | uint16 | mxUINT16_CLASS |

    | int32 | mxINT32_CLASS |

    | uint32 | mxUINT32_CLASS |

    | int64 | mxINT64_CLASS |

    | uint64 | mxUINT64_CLASS |

    | single | mxSINGLE_CLASS |

    | double | mxDOUBLE_CLASS |


    Call mxDestroyArray when finish using the mxArray. The mxDestroyArray function
    deallocates the mxArray and its associated real and imaginary elements.'
  merge: -1
  pgno: 381
