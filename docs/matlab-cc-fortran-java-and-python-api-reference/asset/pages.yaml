  md: '# mxGetString (C and Fortran)


    mxChar array to C-style string or Fortran character array


    # C Syntax


    ```

    #include "matrix.h"

    int mxGetString(const mxArray *pm, char *str, mwSize strlen);

    ```


    # Fortran Syntax


    ```

    #include "intrf.h"

    integer4 mxGetString(pm, str, strlen)

    mwPointer pm

    character(*) str

    mwSize strlen

    ```


    # Arguments


    +   pm Pointer to an mxChar array.


    str Starting location. mxGetString writes the character data into str and then,
    terminates the string with a NULL character (in the manner of C strings). str
    can point to either dynamic or static memory.


    strlen In bytes of destination pointed to str. Typically, in C, you set strlen
    to 1 plus the number of elements in the mxArray to which pm points. Get the number
    of elements, use mxGetN or mxGetN.


    Do not use "Multibyte Encoded Characters" on page 1-482.


    # Returns


    0 on success if strlen == 0, and 1 on failure. Possible reasons for failure include:


    +   - mxArray is not an mxChar array.

    - strlen is not large enough to store the entire mxArray. If so, then the function
    returns 1 and truncates the string.


    # Description


    Call mxGetString to copy the character data of an mxArray into a C-style string
    in C or a character array in Fortran. The copied data starts at str and contains
    no more than strlen-1 characters in C (no more than strlen characters in Fortran).
    In C, the C-style string is always terminated with a NULL character.'
