  md: '# mxGetimagData (C)


    Imaginary data elements in numeric mxArray


    Note mxGetimagData is not available in the interleaved complex API. Use typed,
    data-access functions instead. For more information, see "Compatibility Considerations".


    # C Syntax


    ```

    #include "matrix.h"

    void *mxGetimagData(const mxArray *pm);

    ```


    # Description


    The mxGetimag function is similar to mxGetPi, except that in C it returns a void
    *. For more information, see the description for the mxGetData function.


    # Input Arguments


    +   - pm — Pointer to MATLAB array

    mxArray *


    Pointer to a MATLAB array, specified as mxArray *.


    # Output Arguments


    +   - pi — Pointer to complex data array

    void * — NULL


    Pointer to the complex data array within an mxArray, specified as void *. Since
    void pointers point to a value that has no type, cast the return value to the
    pointer type that matches the type specified by pm. For information on mapping
    MATLAB types to their equivalent C types, see mxClassID.


    If pm is NULL, the function returns NULL.


    Complex Number Support: Yes


    # Version History


    Introduced before R2006a


    Do not use separate complex API

    Not recommended starting in R2018a


    MathWorks recommends that you create MEX files and update existing MEX files to
    use the typed, data-access functions in the interleaved complex API. These functions
    verify that the input array is complex and of the correct type for the function.
    For more information, see:


    +   - Typed Data Access in C MEX Files'
