  md: '"ConnectMATLABAsync Connect to shared MATLAB session asynchronously."


    "FindMATLAB" on page 1-7 Find shared MATLAB sessions synchronously.


    "FindMATLABAsync" on page 1-8 Find shared MATLAB sessions asynchronously.


    "Dispose" on page 1-9 Implicitly called to free resources created by the using
    statement.


    "TerminateEngineClient" on page 1-9 Release all MATLAB resources at runtime.


    # Member Variable


    +   Workspace Access to MATLAB base workspace. Access to the global workspace
    is supported.


    # Specialized Operators and Functions


    You can call any MATLAB function as a method of a MATLABEngine object assigned
    to a variable of type dynamic. The engine dynamically invokes a MATLAB function
    when you call it. Details, see "Call MATLAB Functions" on page 1-10.


    # Method Details


    # StartMATLAB


    ```

    static MATLABEngine StartMATLAB();

    ```


    ```

    static MATLABEngine StartMATLAB(string option);

    ```


    ```

    static MATLABEngine StartMATLAB(string option1, ..., string optionN);

    ```


    ```

    static MATLABEngine StartMATLAB(string[]) options);

    ```


    # Description


    Start MATLAB synchronously in a separate process with optional MATLAB startup
    options and connect to it.


    # Parameters


    +   string option string[] options Startup options used to start the MATLAB engine.
    You can specify multiple startup options. The engine supports all MATLAB startup
    options except for options listed in "Unsupported Startup Options" on page 1-2.
    For a list of options, see the platform-specific command matlab (Windows), matlab
    (macOS), or matlab (Linux).


    # Returns


    Instance of MATLABEngine connected to a shared MATLAB session'
