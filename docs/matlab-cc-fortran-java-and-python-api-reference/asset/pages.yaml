  md: '# engOpenSingleUse (C)


    # C Syntax


    ```

    #include "engine.h"

    Engine engOpenSingleUse(const char *startcmd, void *dcom);

    int *retstatus);

    ```


    # Arguments


    startcmd


    String to start MATLAB process. On Microsoft Windows systems, the startcmd string
    must be NULL.


    dcom


    Reserved for future use; must be NULL.


    retstatus


    Return status; possible cause of failure.


    # Returns


    # Microsoft Windows Operating Systems Only


    Pointer to an engine handle, or NULL if the open fails.


    # UNIX Operating Systems


    Not supported on UNIX systems.


    # Description


    This routine allows you to start multiple MATLAB processes using MATLAB as a computational
    engine.


    engOpenSingleUse starts a MATLAB process, establishes a connection, and returns
    a unique identifier, or NULL if the open fails. Each call to engOpenSingleUse
    starts a new MATLAB process.


    engOpenSingleUse opens a COM channel to MATLAB. This starts the MATLAB software
    registered during installation. If you did not register during installation, enter
    the following command at the MATLAB prompt:


    ```

    !matlab -regserver

    ```


    engOpenSingleUse allows single-instances of an engine server. engOpenSingleUse
    differs from engOpen, which allows multiple applications to use the same engine
    server.


    See "MATLAB COM Integration" for additional details.'
  merge: -1
  pgno: 207
