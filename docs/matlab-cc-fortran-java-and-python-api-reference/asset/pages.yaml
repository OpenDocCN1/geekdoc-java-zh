  md: '# mexFunction (Fortran)


    Entry point to Fortran MEX function


    # Fortran Syntax


    ```

    #include "fintrf.h"

    subroutine mexFunction(nlhs, plhs, nrhs, prhs)

    integer nlhs, nrhs

    mPointer plhs(*), prhs(*)

    ```


    # Arguments


    nlhs


    Number of expected output mxArrays


    plhs


    Array of pointers to the expected output mxArrays


    nrhs


    Number of input mxArrays


    prhs


    Array of pointers to the input mxArrays. Do not modify any prhs values in your
    MEX file. Changing the data in these read-only mxArrays can produce undesired
    side effects.


    # Description


    mexFunction is not a you call. Rather, mexFunction is the name of the gateway
    subroutine in Fortran which every MEX function requires. For more information,
    see “Components of Fortran MEX File”. When you invoke a MEX function, MATLAB finds
    and loads the corresponding function of the same name. MATLAB searches for a symbol
    named mexFunction within the MEX function. If it finds one, it calls the function
    using the address of the mexFunction symbol. MATLAB displays an error message
    if it cannot find a named mexFunction inside the MEX function.


    When you invoke a MEX function, MATLAB automatically seeds nlhs, plhs, nrhs, and
    prhs with the calling arguments. In the syntax of the MATLAB language, functions
    have:


    ```

    [a,b,c,...] = fun(d,e,f,...)

    ```


    where ... denotes more items of the same format. The a,b,c... are left-side output
    arguments, and the d,e,f... are right-side input arguments. The arguments nlhs
    and nrhs contain the number of left side and right side arguments, respectively.
    prhs is an array of mxArray pointers whose length is nrhs. plhs is an array whose
    length is nlhs, where your function must set pointers for the output mxArrays.


    Note It is possible to return an output value if nlhs = 0, which corresponds to
    returning the result in the ans variable.'
