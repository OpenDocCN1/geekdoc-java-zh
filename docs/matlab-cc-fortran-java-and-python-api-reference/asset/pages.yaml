    The Fortran preprocessor translates mwPointer to the Fortran declaration that
    is appropriate for the platform on which you compile. On 64-bit platforms, the
    type is INTEGER*. On 32-bit platforms, If Fortran compiler supports preprocessing,
    you can use mwPointer to declare functions, arguments, and variables that represent
    pointers. If you cannot use mwPointer, then ensure that your declarations have
    the correct size for the platform on which you are compiling Fortran code.


