  md: '# mxCreateCellArray (C and Fortran)


    N-D cell array


    # C Syntax


    ```

    #include "matrix.h"

    mxArray *mxCreateCellArray(mwSize ndim, const mwSize *dims);

    ```


    # Fortran Syntax


    ```

    #include "intrf.h"

    mwPointer mxCreateCellArray(ndim, dims)

    mSize ndim

    mSize dims(ndim)

    ```


    # Arguments


    ndim


    Number of dimensions in the created cell. For example, to create a three-dimensional
    cell mxArray, set ndim to 3.


    dims


    Dimensions array. Each element in the dimensions contain the size of the mxArray
    in dimension. For example, in C, setting dims[0] to 5 and dims[1] to 7 establishes
    a 5-by-7 mxArray. In Fortran, setting dims(1) to 5 and dims(2) to 7 establishes
    a 5-by-7 mxArray. Usually, the dims array contains some dimensional elements.


    # Returns


    Pointer to the created mxArray. If unsuccessful in a standalone (non-MEX file)
    application, returns NULL in c (0 in Fortran). If unsuccessful in a MEX file,
    the MEX file terminates and returns control to the MATLAB prompt. The function
    is unsuccessful when there is not enough free heap space to create the mxArray.


    # Description


    Use mxCellArray to create a cell mxArray with size defined by ndim and dims. For
    example, in C, to establish a three-dimensional cell mxArray having dimensions
    4-by-8-7, set:


    ```

    ndim = 3;

    dims[0] = 4; dims[1] = 8; dims[2] = 7;

    ```


    In Fortran, to establish a three-dimensional cell mxArray having dimensions 4-by-8-7,
    set:


    ```

    ndim = 3;

    dims(1) = 4; dims(2) = 8; dims(3) = 7;

    ```


    The created cellArray is unpopulated; mxCreateCellArray initializes each cell
    to NULL. To put data into a cell, call mxSetCell.'
  merge: -1
