  md: '# engOutputBuffer (C)


    Specify buffer for MATLAB output


    # C Syntax


    ```

    #include "engine.h"

    int engOutputBuffer(Engine *ep, char *p, int n);

    ```


    # Description


    engOutputBuffer defines a character buffer for engEvalString to return any output
    that ordinarily appears on the screen. Returns 1 if you pass a NULL engine pointer.
    Otherwise, 0.


    The default behavior of engEvalString is to discard any standard output caused
    by the command it is executing. Call to engOutputBuffer with a buffer of nonzero
    length tells any subsequent calls to engEvalString to save output in the character
    buffer pointed to by p.


    To turn off output buffering in C, use:


    ```

    engOutputBuffer(ep, NULL, 0);

    ```


    > Note The buffer returned by engEvalString is not NULL terminated.


    # Input Arguments


    +   ep — Pointer to engine

    Engine *


    Pointer to engine, specified as Engine *


    +   p — Pointer to character buffer

    char *


    Pointer to character buffer, specified as char *


    +   n — Length of buffer

    int


    Length of buffer, specified as int.


    # Examples


    See these examples in matlabroot/extern/examples/eng_mat: operating systems.


    +   * engdemo.c for a C example on UNIX operating systems.

    * engwind.c for a C example on Microsoft Windows operating systems.'
  merge: -1
