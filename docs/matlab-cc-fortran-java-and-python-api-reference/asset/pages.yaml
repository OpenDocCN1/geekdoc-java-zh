    ```


    # Fortran Syntax


    ```

    #include "intrf.h"

    integer*4 mexIsLocked()

    ```


    # Description


    Call mexIsLocked to determine if the MEX file is locked. By default, MEX files
    are unlocked, meaning you can clear the MEX file at any time.


    To unlock a MEX file, call mexUnlock.


    # Output Arguments — Status


