    ```


    Description


    MatlabEngine provides the close() method to implement the java.lang.AutoCloseable
    interface for MatlabEngine objects. This close() method enables you to use a try-with-resources
    statement to automatically disconnect or terminate the MATLAB session at the end
    of the statement.


    The MatlabEngine close() method disconnects or terminates the current MATLAB session,
    depending on the context.


    +   - If a Java process starts the MATLAB session as a default non-shared session,
    close() terminates MATLAB.

    - If the MATLAB session is a shared session, close() disconnects MATLAB from this
    Java process. MATLAB terminates when there are no other connections.'
