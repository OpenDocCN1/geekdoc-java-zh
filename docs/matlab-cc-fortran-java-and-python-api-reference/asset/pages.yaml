  md: '# # engOpen (C)


    Start MATLAB engine session


    # ## Syntax


    ```

    #include "engine.h"

    Engine *engopen(const char *startcmd);

    ```


    # ## Description


    engOpen starts a MATLAB process for using MATLAB as a computational engine.


    # ### Windows Platforms


    engOpen launches MATLAB without a desktop.


    The function opens a COM channel to MATLAB. The MATLAB software registered during
    installation starts. If you did not register during installation, then see "Register
    MATLAB as a COM Server".


    # ### UNIX Platforms


    On UNIX systems, engOpen:


    +   1. Creates two pipes.

    2. Forks a new process. Sets up the pipes to pass stdin and stdout from MATLAB
    (parent) software to two file descriptors in the engine program (child).

    3. Executes a command to run MATLAB software (rsh for remote execution).


    # ## Input Arguments


    ```

    startcmd — MATLAB startup command

    const char *NULL

    ```


    MATLAB startup command, specified as const char *.


    On Windows systems, the startcmd must be NULL.


    On UNIX systems:


    +   - If startcmd is NULL or the empty string, engOpen starts a MATLAB process
    on the current host using the command matlab. If startcmd is a hostname, engOpen
    starts a MATLAB process on the designated host by embedding the specified hostname
    string into the larger string;

    - "rsh hostname \/bin/sh -c ''setenv DISPLAY\nhostname:0; matlab\*\''"

    - If startcmd is any other string (has white space in it, or nonalphanumeric characters),
    MATLAB executes the string literally.'
  merge: -1
  pgno: 205
