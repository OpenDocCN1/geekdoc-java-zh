  md: "# mxSetN (Fortran)\n\nSet number of columns in mxArray\n\n# Fortran Syntax\n\
    \n```\n#include \"fintrf.h\"\nsubroutine mxSetN(pm, n)\nmwPointer pm\nmSize n\n\
    ```\n\n# Description\n\nmxSetN sets the number of columns in the specified mxArray.\
    \ The term columns always means the second dimension of a matrix. Calling mxSetN\
    \ forces an mxArray to have two dimensions. For example, if pm points to an mxArray\
    \ having three dimensions, then calling mxSetN reduces the mxArray to two dimensions.\n\
    \nYou typically use mxSetN to change the shape of an existing mxArray. The mxSetN\
    \ function does not allocate or deallocate space for the pr, pi, ir, or jc arrays.\
    \ So, if you calls to mxSetN and mxSetM increase the number of elements in the\
    \ mxArray, then enlarge the pr, pi, ir, and/or jc arrays.\n\nIf calling mxSetM\
    \ and mxSetN reduces the number of elements in the mxArray, then you might want\
    \ to reduce the size of the pr, pi, ir, and/or jc arrays to use heap space more\
    \ efficiently. However, reducing the size is not mandatory.\n\n# Input Arguments\n\
    \n+   - MATLAB array\n  mwPointer\n\nPointer to an mxArray, specified as mwPointer.\n\
    \n+   - Number of columns\n  mwSize\n\nNumber of columns, specified as mwSize.\n\
