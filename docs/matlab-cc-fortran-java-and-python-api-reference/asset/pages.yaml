  md: '# mxMalloc (C and Fortran)


    Allocate uninitialized dynamic memory using MATLAB memory manager


    # C Syntax


    ```

    #include "matrix.h"

    #include <stdlib.h>

    void *mxMalloc(mwSize n);

    ```


    # Fortran Syntax


    ```

    #include "fintrf.h"

    mwPointer mxMalloc(n)

    mwSize n

    ```


    # Arguments


    +   n

    Number of bytes to allocate for n greater than 0


    # Returns


    Pointer to the start of the allocated dynamic memory, if successful. If unsuccessful
    in a MAT or engine standalone application, then mMalloc returns NULL in C (0 in
    Fortran). If unsuccessful in a MEX file, the MEX file terminates and control returns
    to the MATLAB prompt.


    mxMalloc is unsuccessful when there is insufficient heap space.


    If you call mMalloc in C with value n = 0, then MATLAB returns either NULL or
    a valid pointer.


    # Description


    mxMalloc allocates contiguous heap space to hold n bytes. To allocate memory in
    MATLAB applications, use mMalloc instead of the ANSI C function.


    In MEX files, but not MAT or engine applications, mMalloc registers the allocated
    memory with the MATLAB memory manager. When control returns to the MATLAB prompt,
    the memory manager automatically frees, or deallocates, it.


    How you manage the memory created by this function depends on the purpose of the
    data assigned to it. If it is an output argument in plhs[] using a function as
    mxSetDoubles, MATLAB is responsible for freeing the memory.


    If you use the data, then the MATLAB manager maintains a list of all memory allocated
    by the function and automatically frees (deallocates) when control returns to
    the MATLAB prompt. In general, we recommend MEX file functions destroy their own
    temporary arrays and free their own dynamically allocated memory. It is more efficient
    to perform this cleanup in the source MEX file than to rely on the automatic mechanism.
    Therefore, when you finish using the memory allocated by this function, call mxFree
    to deallocate the memory.'
  merge: -1
