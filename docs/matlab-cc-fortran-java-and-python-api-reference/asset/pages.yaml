    element is N-1, where N is the number of elements in the array. In Fortran, the
    first element of an mxArray has an index of 1. The index of the last element is
    N, where N is the number of elements in the array.


    See mxCalcSingleSubscript for details on calculating an index.


    fieldnumber


    Position of the field in the structure. The field must exist in the structure.


    In C, the first field within each element has a fieldnumber of 0. The fieldnumber
    of the last is N-1, where N is the number of fields.


    In Fortran, the first field within each element has a fieldnumber of 1. The fieldnumber
    of the last is N, where N is the number of fields.


    pvalue


    Pointer to the mxArray containing the data you want to assign.


    # Description


    Use mxSetFieldByNumber to assign the contents of pvalue to the field specified
    by fieldnumber of element index. mxSetFieldByNumber is like mxSetField; however,
    the function identifies the field by position number, not by name.'
