    | string name | Name of the shared MATLAB session. Use FindMATLABAsync to get
    the names of shared MATLAB sessions. |

    | CancellationToken token | Cancellation token used to cancel asynchronous tasks.
    The default is System.Threading.CancellationToken.None. |


    # Returns


