  md: '# MathWorks.MATLAB.Types.RunOptions


    .NET class to specify options for MATLAB function evaluation


    # Description


    Use a .NET RunOptions object to pass execution parameters when calling MATLAB
    functions from .Net. The options specify whether to run synchronously, where to
    direct output streams, and how to return arguments.


    # Class Details


    Namespace: MathWorks.MATLAB.Types


    # Creation


    RunOptions(output, error, nargout, async, cancelToken); creates an instance of
    RunOptions with optional parameters set by the corresponding property name.


    # Properties


    Output stream, specified as:


    +   * null—Use default value Console.Out.

