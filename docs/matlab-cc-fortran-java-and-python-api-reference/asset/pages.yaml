  md: '# matlab.engine.connect_matlab


    Connect shared MATLAB session to MATLAB Engine for Python


    # Syntax


    ```

    eng = matlab.engine.connect_matlab(name=None)

    eng = matlab.engine.connect_matlab(background,_)

    eng = matlab.engine.connect_matlab(_, async);

    ```


    # Description


    eng = matlab.engine.connect_matlab(name=None) connects to the shared MATLAB session,
    name, and returns a MATLABEngine as eng. The input argument specifies the name
    of a MATLAB session that is already running on your local machine.


    +   * If you specify a name and the engine cannot find a shared MATLAB session
    of the same name, you receive an EngineError exception.

    * If you do not specify a name and the engine cannot find any shared MATLAB sessions,
    then it starts a new MATLAB session.

    * If you do not specify a name and the engine finds multiple shared sessions running,
    then it connects to the first created session.


    eng = matlab.engine.connect_matlab(_, background) connects asynchronously if background
    is True. You can use this with the name input argument in the previous syntax.


    eng = matlab.engine.connect_matlab(_, async) connects asynchronously if async
    is True. Not recommended. Use the background argument instead. Do not use for
    Python® Version 3.7 or later. For more information, see “Compatibility Considerations”
    on page 1-234.


    # Examples


    Connect to MATLAB Session

    Connect to a shared MATLAB session that is already running on your local machine.


    ```

    import matlab.engine

    eng = matlab.engine.connect_matlab()

    eng.sqrt(4.0)

    2.0

    ```


    matlab.engine.connect_matlab connects to the first created shared MATLAB session.
    If no MATLAB sessions are shared, then matlab.engine.connect_matlab starts a new
    session.


    # Connect to MATLAB Sessions by Name


    When there are multiple shared MATLAB sessions on your local machine, connect
    to two different sessions one at a time by specifying their names.'
  merge: -1
  pgno: 238
