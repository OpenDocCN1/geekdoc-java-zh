  md: '# com.mathworks.engine.MatlabEngine


    Java class using MATLAB as a computational engine


    # Description


    com.mathworks.engine.MatlabEngine class uses a MATLAB process as a computational
    engine for Java. This class provides an interface between the Java language and
    MATLAB, enabling you to evaluate MATLAB functions and statements from Java.


    # Creation


    The MatlabEngine class provides static methods to start MATLAB and connect to
    a shared MATLAB session synchronously or asynchronously. Only these static methods
    can instantiate this class:


    +   * "startMatlab" on page 1-173—Start MATLAB synchronously.

    * "connectMatlab" on page 1-175—Connect to shared MATLAB session synchronously.

    * "startMatlabAsync" on page 1-174—Start MATLAB asynchronously.

    * "connectMatlabAsync" on page 1-176—Connect to shared MATLAB session asynchronously.


    # Unsupported Startup Options


    The engine does not support these MATLAB startup options:


    +   * -h

    * -help

    * -?

    * -n

    * -e

    * -softwareopengl

    * -logfile


    For information on MATLAB startup options, see "Common Used Startup Options".


    # Method Summary


    # Static Methods


    +   * "startMatlab" on page 1-173 Start MATLAB synchronously.

    * "startMatlabAsync" on page 1-174 Start MATLAB asynchronously.

    * "findMatlab" on page 1-175 Find all shared MATLAB sessions on the local machine
    synchronously.'
