    Use mxSetDoubles to set mxDouble data in the specified array.


    All mxCreate functions allocate heap space to hold data. Therefore, you do not
    ordinarily use this function to initialize the elements of an array. Rather, call
    the function to replace existing values with new values.


    # Input Arguments


    pa — MATLAB array

    mxArray *


    Pointer to an mxDOUBLE_CLASS array.


    dt — Data array

    mxDouble *


    Pointer to the first mxDouble element of the data array. dt must be allocated
    by the functions mxCalloc or mxMalloc.


    # Output Arguments


    status — Function status

    int


    Function status, returned as int. If successful, then the function returns 1.


    If pa is NULL, then the function returns 0.


    The function is unsuccessful when mxArray is not an shared mxDOUBLE_CLASS array,
    or if the data is not allocated with mxCalloc. If the function is unsuccessful,
    then,


    +   * MEX file — Function terminates the MEX file and returns control to the MATLAB
    prompt.

    * Standalone (non-MEX file) application — Function returns 0.


    # Examples


    See the arrayFillSetPr.c example in the matlab/extern/examples/refbook folder.'
