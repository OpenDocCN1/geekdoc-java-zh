    double mxGetInf(void);

    ```


    # Fortran Syntax


    ```

    real*8 mxGetInf

    ```


    # Returns


    Value of infinity on your system.


    Call mxGetInf to return the value of the MATLAB internal inf variable. inf is
    a permanent variable representing IEEE® arithmetic positive infinity. Your system
    specifies the value of inf; you cannot modify it.


    Operations that return infinity include:


    +   - Division by 0. For example, 5/0 returns infinity.

    - Operations resulting in overflow. For example, exp(10000) returns infinity because
    the result is too large to be represented on your machine.


