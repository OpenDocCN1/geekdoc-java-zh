  \  }\n}\n```\n\n属性定义了对象的状态，并提供了存储和检索信息的方法。\n\n### 类中的方法：定义行为\n\n方法定义类的行为，封装了类可以执行的操作。在\
  \ `Dog` 类中，`bark()` 和 `fetch()` 方法代表了与狗相关的行为。\n\n```java\nclass Dog {\n  // ...\
