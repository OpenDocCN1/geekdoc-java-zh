  }\n```\n\n构造函数确保对象在产生时被正确初始化。理解如何在类中定义属性和方法对于构建结构良好且模块化的 Java 应用程序至关重要。随着学习者深入学习“面向对象编程（OOP）简介”模块，设计具有清晰属性和方法的类的能力成为在《Java\
  \ 编程》更广泛背景下进行有效编程的不可或的一部分。\n\n## Java 中的访问修饰符与封装\n\n《Java 编程》书中的“面向对象编程（OOP）简介”模块深入探讨了访问修饰符和封装这些关键概念，探索了这些原则有助于创建健壮且安全的\
  \ Java 应用程序。\n\n```java\npublic class BankAccount {\n  // Private Attributes\n \
  \ private String accountHolder;\n  private double balance;\n\n  // Public Constructor\n\
  \  public BankAccount(String accountHolder, double initialBalance) {\n    this.accountHolder\
  \ = accountHolder;\n    this.balance = initialBalance;\n  }\n\n  // Public Method\
  \ to Get Balance\n  public double getBalance() {\n    return balance;\n  }\n\n \
  \ // Public Method to Deposit\n  public void deposit(double amount) {\n    if (amount\
  \ > 0) {\n      balance += amount;\n      System.out.println(\"Deposit of $\" +\
  \ amount + \" successful. New balance: $\" + balance);\n    }\n  }\n\n  // Public\
  \ Method to Withdraw\n  public void withdraw(double amount) {\n    if (amount >\
  \ 0 && amount <= balance) {\n      balance -= amount;\n      System.out.println(\"\
  Withdrawal of $\" + amount + \" successful. New balance: $\" + balance);\n    }\
  \ else {\n      System.out.println(\"Insufficient funds for withdrawal.\");\n  \
  \  }\n  }\n}\n```\n\n### 封装：保护内部状态\n\n封装是一个基本的 OOP 概念，将数据（属性）和方法（行为）封装在单一单元（类）中。`BankAccount`\
  \ 类封装了银行账户的内部，包括 `accountHolder` 和 `balance` 属性。\n\n通过将属性标记为 `private`，封装确保了对象的内部状态不受外部干扰，从而提高了数据完整性和安全性。\n\
  \n### 访问修饰符：控制可见性\n\n\n\n\n\n访问修符决定了 Java 中类、属性和方法的可见性。在 `BankAccount` 类中，`public`\
  \ 修饰符用于构造函数以及需要从类外部访问的方法。\n\n```java\npublic class BankAccount {\n\n    // ... (Private\
  \ Attributes)\n\n    // Public Constructor\n    public BankAccount(String accountHolder,\
  \ double initialBalance) {\n        // ... (Constructor Implementation)\n    }\n\
  \n    // 用于获取余额的公共方法\n    public double getBalance() {\n        // ... (Method Implementation)\n\
  \    }\n\n    // 用于存款的公共方法\n    public void deposit(double amount) {\n        //\
  \ ... (Method Implementation)\n    }\n\n    // 用于取出的公共方法\n    public void withdraw(double\
  \ amount) {\n        // ... (Method Implementation)\n    }\n}\n```\n\n访问修符有助于控制类成员的可见性，能够创建出定义良好且安全的\
  \ API 来与对象进行交互。\n\n理解访问修符和封装对于设计为程序其他部分提供清晰安全的类至关重要。随着学习者通过“面向对象编程（OOP）介绍”模块，这些原则将成为“Java\
  \ 编程”大背景下高效 Java 编程不可或缺的一部分。\n\n# 模块 12：Java 方法与构造函数\n\n“Java 中的方法和构造函数”模块是《Java\
  \ 编程》书中的关键章节，深入探讨了驱动 Java 程序功能和组织的基础概念。方法和构造函数是模块化和复用代码的基石，允许开发者封装功能、提高代码可读性并促进对象的创建。该模块作为了一份全面的指南，揭示了\
  \ Java 中方法和构造函数的语法、原理和应用。\n\n## Java 方法的基础\n\n该模块的核心是对方法的探索，方法是 Java 程序中执行特定任务的封装代码单元。学习者将学习到方法声明的语法，理解参数、返回类型以及方法调用的重要性。这种基础理解为学习者创建模块化和复用的代码结构奠定了基础。\n\
  \n### 创建和调用方法\n旅程从创建方法开始，学习者在其中获得定义对程序整体功能有贡献的函数的见解。实践示例引导学习者完成调用方法的过程，演示了如何将模块化功能无缝集成到他们的\
  \ Java 程序中。这种模块化方法不仅增强了代码组织，还促进了高效且易维护的程序的创建。\n\n### 方法重载与可变参数\n探索延伸到方法重载等高级主题，学习者借此理解相同名称的方法如何适应不同的参数。此外，学习者还被介绍了可变参数（变长参数列表），这提供了一种灵活的机制，向方法传递数量数量的参数。这些特性丰富了方法的通用性，使开发者能够通过同一个方法名适应各种场景。\n\
  \n## 构造函数：构建对象\n\n在方法的基础上，该模块无缝过渡到构造函数，即负责初始化对象的特殊方法。学习者将熟练掌握构造函数在创建对象、设置初始状态和确保对象正确实例化方面的作用。实践示例说明了构造函数如何有助于\
  \ Java 编程的面向对象特性。\n\n### 默认构造函数与构造函数重载\n模块探索了默认构造函数和构造函数重载，展示了开发者如何提供多种实例化对象的方法。学习者理解了具有不同参数集的构造函数如何增强对象创建的灵活性，并符合封装和模块化的原则。\n\
  \n## 方法与构造函数在 Java 程序中的应用\n\n该模块以实际应用结束，引导学习者在实际 Java 程序中整合方法和构造函数。学习者将在创建类、定义方法以及利用构造函数构建健壮且功能完\
  \ Java 应用方面获得实践经验。这种实际应用强化了理论概念，使学习者能够无缝地将其知识应用于真实的编码场景中。\n\n随着学习者通过“Java 中的方法和构造函数”模块，他们不仅获得了创建和调用方法的技术熟练，还对方法和构造函数为\
  \ Java 编程带来的模块化和组织化结构有了更深的理解。该模块成为一个基础组件，让学习者能够在“Java 编程”的大背景下有效利用方法和构造函数。\n\n##\
  \ 在 Java 中编写方法\n\n《Java 编程》中的“Java 中的方法和构造函数”模块探索了编写方法的本质概念，方法是 Java 类功能的构建块。这部分至关重要，因为它演示了方法如何封装可用的代码块，从而增强了\
  \ Java 程序的模块化和可维护性。\n\n```java\npublic class Calculator {\n\n    // 加两个数的方法\n  \
  \  public int add(int num1, int num2) {\n        return num1 + num2;\n    }\n\n\
  \    // 减去两个数的方法\n    public int subtract(int num1, int num2) {\n        return\
  \ num1 - num2;\n    }\n\n    // 乘两个数的方法\n    public int multiply(int num1, int num2)\
  \ {\n        return num1 * num2;\n    }\n\n    // 除两个数的方法\n    public double divide(double\
  \ num1, double num2) {\n        if (num2 != 0) {\n            return num1 / num2;\n\
  \        } else {\n            System.out.println(\"不能除以零.\");\n            return\
  \ Double.NaN; // 不是数字\n        }\n    }\n}\n```\n\n在这个示例中，`Calculator` 类展示了用于基础算运算的不同方法。\n\
  \n### 定义方法：封装功能\nJava 方法在类内部封装功能。在 `Calculator` 类中，`add`、`subtract`、`multiply` 和\
  \ `divide` 等方法封装了特定的算运算。\n\n```java\npublic class Calculator {\n    public int add(int\
  \ num1, int num2) {\n        return num1 + num2;\n    }\n    // ... (其他方法)\n}\n\
  ```\n\n每个方法定义了一个特定的动作，促进了代码的组织和重用。\n\n### 方法签名：参数与返回类型\n方法签名包含方法名、参数和返回类型。在 `Calculator`\
  \ 类中，`add` 方法签名指定了两个 `int` 参数和一个 `int` 返回类型。\n\n```java\npublic int add(int num1,\
  \ int num2) {\n    return num1 + num2;\n}\n```\n\n理解方法签名对于正确调用方法至关重要。\n\n### 返回语句：提供输出\n\
  方法通常包含一个返回语句以提供输出。在 `divide` 方法中，条件语句确保了避免除以零，并在此类情况下返回 `Double.NaN`。\n\n```java\n\
  public double divide(double num1, double num2) {\n    if (num2 != 0) {\n       \
  \ return num1 / num2;\n    } else {\n        System.out.println(\"不能除以零.\");\n \
  \       return Double.NaN;\n    }\n}\n```\n\n返回语句是方法方法传递结果的核心。\n\n\n\n\n\n《Java\
  \ 编程》（Programming With Java）书籍中的“Java 方法和构造函数”模块介绍了**方法重载**和**方法签名**这两个强大的概念。这一节对于理解\
  \ Java 如何允许开发者创建具有相同名称但参数列表不同的方法至关重要，这增强了代码的灵活性和可读性。\n\n```java\n// Class Definition\n\
  public class PrintData {\n    // Method Overloading for Different Data Types\n \
  \   public void print(String data) {\n        System.out.println(\"Printing String:\
  \ \" + data);\n    }\n\n    public void print(int data) {\n        System.out.println(\"\
  Printing Integer: \" + data);\n    }\n\n    public void print(double data) {\n \
  \       System.out.println(\"Printing Double: \" + data);\n    }\n\n    // Method\
  \ Overloading with Different Number of Parameters\n    public void display(String\
  \ message) {\n        System.out.println(\"Displaying: \" + message);\n    }\n\n\
  \    public void display(String message, int count) {\n        System.out.println(\"\
  Displaying \" + count + \" times: \" + message);\n    }\n}\n```\n\n在这个示例中，`PrintData`\
  \ 类展示了针对不同数据类型和不同参数数量的方法重载。\n\n### 方法重载：多个签名，单一名称\n\n方法重载允许开发者在类中定义多个具有相同名称的方法。在\
  \ `PrintData` 类中，`print` 方法被重载以处理不同的数据类型（`String`、`int` 和 `double`）。\n\n```java\n\
  public class PrintData {\n    public void print(String data) {\n        // ... (Method\
  \ Implementation)\n    }\n\n    public void print(int data) {\n        // ... (Method\
  \ Implementation)\n    }\n\n    public void print(double data) {\n        // ...\
  \ (Method Implementation)\n    }\n}\n```\n\n`print` 方法的每个版本都为处理各种类型的数据提供了灵活性。\n\n\
  ### 方法签名：唯一标识符\n\n方法签名作为方法的唯一标识符，包含了方法名和参数列表。在 `PrintData` 类中，每个重载的 `print` 方法都根据其参数的数据类型具有不同的签名。\n\
  \n```java\npublic void print(String data) {\n    // ... (Method Implementation)\n\
  }\n\npublic void print(int data) {\n    // ... (Method Implementation)\n}\n\npublic\
  \ void print(double data) {\n    // ... (Method Implementation)\n}\n```\n\n理解方法签名对于调用正确的重载方法版本至关重要。\n\
  \n### 不同参数数量的重载\n\n方法重载不仅限于不同的数据类型；它还包括参数数量不同的方法。在 `PrintData` 类中，`display` 方法被重载以处理不同数量的参数。\n\
  \n```java\npublic void display(String message) {\n    // ... (Method Implementation)\n\
  }\n\npublic void display(String message, int count) {\n    // ... (Method Implementation)\n\
  }\n```\n\n这种灵活性允许开发者创建能够适应各种场景的方法。\n\n掌握方法重载并理解方法签名可以增强开发者设计多功能且具可读性代码的能力。随着学习者深入学习“Java\
  \ 方法和构造函数”模块，这些概念将成为《Java 编程》大背景下进行有效 Java 编程的不可或缺的一部分。\n\n## 构造函数与构造函数重载\n\n《Java\
  \ 编程》书籍中的“Java 方法和构造函数”模块介绍了**构造函数**和**构造函数重载**这两个关键概念。这一节对于理解 Java 如何促进对象的创建和初始化是基础，它为开发者提供了设置对象状态和行为的方法。\n\
  \n```java\n// Class Definition\npublic class Car {\n    // Instance Variables\n\
  \    private String make;\n    private String model;\n    private int year;\n\n\
  \    // Default Constructor\n    public Car() {\n        make = \"Unknown\";\n \
  \       model = \"Unknown\";\n        year = 0;\n    }\n\n    // Parameterized Constructor\n\
  \    public Car(String make, String model, int year) {\n        this.make = make;\n\
  \        this.model = model;\n        this.year = year;\n    }\n\n    // Constructor\
  \ Overloading\n    public Car(String make, String model) {\n        this.make =\
  \ make;\n        this.model = model;\n        this.year = 0;\n    }\n}\n```\n\n\
  在这个示例中，`Car` 类演示了使用构造函数和构造函数重载来用不同属性集初始化汽车对象。\n\n### 构造函数：初始化对象状态\n\nJava 中的构造函数是特殊方法，在创建对象时初始化其状态。在\
  \ `Car` 类中，有两个构造函数——一个默认构造函数和一个带参数构造函数。\n\n```java\npublic class Car {\n    // Default\
  \ Constructor\n    public Car() {\n        make = \"Unknown\";\n        model =\
  \ \"Unknown\";\n        year = 0;\n    }\n\n    // Parameterized Constructor\n \
  \   public Car(String make, String model, int year) {\n        this.make = make;\n\
  \        this.model = model;\n        this.year = year;\n    }\n}\n```\n\n默认构造函数用默认值初始化对象，而带参数构造函数允许在创建对象时指定自定义值。\n\
  \n### 构造函数重载：提供灵活性\n\n构造函数重载允许在类中定义具有不同参数列表的多个构造函数。在 `Car` 类中，有两个参数不同的构造函数——一个包含所有属性，另一个只包含品牌和型号。\n\
  \n```java\npublic class Car {\n    // Parameterized Constructor\n    public Car(String\
  \ make, String model, int year) {\n        // ... (Constructor Implementation)\n\
  \    }\n\n    // Constructor Overloading\n    public Car(String make, String model)\
  \ {\n        // ... (Constructor Implementation)\n    }}\n}\n```\n\n这种灵活性允许开发者根据需求以不同方式创建对象。\n\
  \n### this 关键字：区分属性\n\n在带参数的构造函数中，`this` 关键字用于区分实例变量与同名的参数。\n\n```java\npublic class\
  \ Car {\n    // Parameterized Constructor\n    public Car(String make, String model,\
  \ int year) {\n        this.make = make;\n        this.model = model;\n        this.year\
  \ = year;\n    }\n}\n```\n\n`this` 关键字指向当前对象，有助于解决歧义。\n\n理解构造函数和构造函数重载对于创建对象和初始化其状态至关重要。随着学习者深入学习“Java\
  \ 方法和构造函数”模块，这些概念将成为《Java 编程》大背景下进行有效 Java 编程的不可或缺的一部分。\n\n## 使用 this 和构造函数链调\n\n\
  《Java 编程》书籍中的“Java 方法和构造函数”模块，关于使用 `this` 和构造函数链调的节探讨了增强代码清晰度和效率的高级技术。这些概念是 Java\
  \ 开发者优化构造函数功能和简化对象创建的基础。\n\n```java\n// Class Definition\npublic class Book {\n\
  \    // Instance Variables\n    private String title;\n    private String author;\n\
  \    private int year;\n\n    // Default Constructor\n    public Book() {\n    \
  \    this(\"Unknown\", \"Unknown\", 0); // Constructor Chaining\n    }\n\n    //\
  \ Parameterized Constructor\n    public Book(String title, String author, int year)\
  \ {\n        this.title = title;\n        this.author = author;\n        this.year\
  \ = year;\n    }\n\n    // Constructor Chaining\n    public Book(String title, String\
  \ author) {\n        this(title, author, 0);\n    }\n}\n```\n\n在这个示例中，`Book` 类展示了使用\
  \ `this` 和构造函数链来简化代码并避免冗余。\n\n### 使用 this：解决歧义\n\nJava 中的 `this` 关键字指向当前对象。在 `Book`\
  \ 类中，它被用于带参数的构造函数以区分实例变量与同名的参数。\n\n```java\n// Parameterized Constructor\npublic\
  \ Book(String title, String author, int year) {\n    this.title = title;\n    this.author\
  \ = author;\n    this.year = year;\n}\n```\n\n使用 `this` 明确了赋值对象是当前对象的实例变量，而不是方法参数。\n\
  \n### 构造函数链：代码重用\n\n构造函数链是一种技术，其中一个构造函数调用类中的另一个构造函数。在 `Book` 类中，默认构造函数和参数较构造函数利用构造函数链来重用代码。\n\
  \n\n\n\n\n```java\n// Default Constructor\npublic Book() {\n    this(\"Unknown\"\
  , \"Unknown\", 0); // Constructor Chaining\n}\n\n// Constructor Chaining\npublic\
  \ Book(String title, String author) {\n    this(title, author, 0);\n}\n```\n这种做法提高了代码的可重用性，并确保了公共初始化逻辑的集中管理。\n\
  \n### 使用 `this` 和构造函数链的益处\n使用 `this` 和构造函数链增强了代码的可维护性和可读性。它允许开发者创建具有不同复杂程度的构造函数，同时避免了代码重复。在多个构造函数需要共享共同初始化步骤的场景下，这尤为有价值。\n\
  \n随着学习者学习“Java 中的方法和构造函数”模块，理解并应用 `this` 和构造函数链将成为他们 Java 编程工具箱中宝贵的工具，在“Java 编程”的更广泛范围内提供了处理对象创建和初始化的高效方法。\n\
  \n# 第 13 模块：Java 中的类关系与继承\n\n“Java 中的类关系与继承”模块是《Java 编程》一书中的关键部分，深入探讨了塑造 Java 程序结构和设计的进阶概念。类关系和继承是面向对象编程的核心组件，为开发者提供了创建层级结构、重用代码以及建模实体间复杂关系的工具。该模块作为一份深度指南，揭示了\
  \ Java 中类关系和继承的原理、语法和应用。\n\n### 理解面向对象设计中的类关系\n该模块的核心是对类关系的探索，这是设计健壮且可扩展软件的关键方面。学习者将被介绍到关联（Association）、聚合（Aggregation）和组合（Composition）的概念，理解类如何能够协作并形成有意义的关系。这种基础性的理解为创建复杂且互联的系统奠定了基础。\n\
  \n#### 关联：连接类\n旅程从探索关联开始，学习者将理解类如何以各种方式建立联系，从简单的连接到更复杂的依赖关系。实际示例将引导学习者了解类如何协作以实现特定功能的场景，并强调了设计高内聚、模块化系统的重要性。\n\
  \n#### 聚合与组合：建模复杂关系\n在关联的基础上，该模块无缝过渡到聚合和组合的概念。学习者将深入洞察类如何按层次结构组织，形成更错综复杂的关系。示例说明了如何使用聚合和组合来对现实世界的关系建模，为学习者提供了设计可扩展和可维护代码结构的工具。\n\
  \n#### 继承导论：扩展类\n探索延伸到继承的核心概念，这是一种强大的机制允许基于现有类创建新类。学习者将理解继承如何促进代码重用、增强模块化，并允许创建分级类结构。实际示例将引导学习者通过实现继承来建模关系并扩展功能。\n\
  \n#### 方法重写与多态\n在继承原理的基础上，该模块深入探讨了方法重写和多态。学习者将熟练掌握派生类如何为被继承的方法提供自己的实现，从而增强代码的灵活性和适应性。该模块还探讨了多态的概念，展示了不同类的对象如何被视为共同基类的对象。\n\
  \n### 类关系与继承在 Java 程序中的应用\n该模块以类关系和继承在 Java 程序中的实际应用结束。学习者将参与实践练习，创建类层级结构、建立关系并实现继承以解决现实世界的问题。这种实践经验强化了理论概念，使学习者能够将类关系和继承无缝集成到他们的\
  \ Java 编程工具箱中。\n\n随着学习者学习“Java 中的类关系与继承”模块，他们不仅在建模复杂系统方面获得了技术熟练度，还对构建扩展和可维护软件设计的底层面向对象原理产生了更深刻的体会。该模块成为了一个基石，使学习者能够在“Java\
  \ 编程”的更广泛范围内有效利用类关系和继承。\n\n## 理解 Java 中的继承\n《Java 编程》一书的“Java 中的类关系与继承”模块引入了继承的基础概念，这是面向对象编程（OOP）的一个关键特性。本节探讨了\
  \ Java 如何实现类与类之间的层级关系，促进代码重用并增强软件系统的结构。\n\n```java\n// 父类（超类）\npublic class Animal\
  \ {\n    protected String species;\n\n    public Animal(String species) {\n    \
  \    this.species = species;\n    }\n\n    public void makeSound() {\n        System.out.println(\"\
  Animal makes a sound.\");\n    }\n}\n\n// 子类（子类）\npublic class Dog extends Animal\
  \ {\n    private String breed;\n\n    public Dog(String breed) {\n        super(\"\
  Canine\"); // 调用父类构造函数\n        this.breed = breed;\n    }\n\n    // 专门针对 Dog 类的类的方法\n\
  \    public void bark() {\n        System.out.println(\"Dog barks!\");\n    }\n\
  }\n```\n在这个示例中，`Animal` 类作为超类，`Dog` 类作为子类，说明了继承的概念。\n\n### 定义继承：超类与子类\nJava 中的继承涉及在超类和一个或多个子类之间建立关系。`Animal`\
  \ 类是超类，代表了动物的通用概念，而 `Dog` 类是子类，将该概念特化以代表一种特定的动物。\n\n```java\n// 父类（超类）\npublic class\
  \ Animal {\n    // ... (超类的实现)\n}\n\n// 子类（子类）\npublic class Dog extends Animal\
  \ {\n    // ... (子类的实现)\n}\n```\n`extends` 关键字建立了继承关系，表示 `Dog` 类继承了 `Animal` 类的属性和方法。\n\
  \n### 继承中的构造函数：用于超类的 super()\n在示例中，`Dog` 类有一个构造函数会调用其超类（`Animal`）的构造函数。`super(\"\
  Canine\")` 语句初始化了 `Animal` 类的 `species` 属性。\n\n```java\n// 子类构造函数\npublic Dog(String\
  \ breed) {\n    super(\"Canine\"); // 调用父类构造函数\n    this.breed = breed;\n}\n```\n\
  这确保了 `Dog` 类继承并设置了 `Animal` 类定义的公共属性。\n\n### 方法重写：自定义行为\n继承允许子类重写在其超类中定义的方法，提供了一种自定义行为的方法。在\
  \ `Dog` 类中，`makeSound()` 方法被重写以反映狗发出的特定声音。\n\n```java\n// 子类的方法重写\npublic class\
  \ Dog extends Animal {\n    @Override\n    public void makeSound() {\n        System.out.println(\"\
  Dog barks!\"); // 自定义行为\n    }\n}\n```\n理解继承对于构建健壮且可扩展的软件系统至关重要。随着学习者学习“Java 中的类关系与继承”模块，他们获得了设计和实现类层级结构的技能，从而在“Java\
  \ 编程”的更广泛范围内促进代码重用和可维护性。\n\n\n\n\n\n《Java 编程》（Programming With Java）书中的“Java 中的类关系与继承”模块探索了创建子类和父类的复杂性，深入探讨了面向对象编程的精髓——通过建立类与类之间的关系来促进代码重用和组织结构的清晰性。\n\
  \n```java\n// Superclass\npublic class Vehicle {\n    protected String model;\n\
  \    public Vehicle(String model) {\n        this.model = model;\n    }\n    public\
  \ void start() {\n        System.out.println(\"Vehicle starts.\");\n    }\n}\n```\n\
  \n### 定义父类\n在 Java 世界中，继承的基础始于父类的创建。在本例中，`Vehicle` 类被引入为父类，封装了各种车辆通用的属性和行为。\n\n\
  ```java\n// Subclass\npublic class Car extends Vehicle {\n    private int numDoors;\n\
  \    public Car(String model, int numDoors) {\n        super(model); // Call to\
  \ superclass constructor\n        this.numDoors = numDoors;\n    }\n    public void\
  \ honk() {\n        System.out.println(\"Car honks!\");\n    }\n}\n```\n\n### 创建子类\n\
  由 `Car` 类表示的子类扩展了父类 `Vehicle` 的功能。`Car` 类包含了汽车特有的特定属性和行为，强调了子类的专门化性质。\n\n```java\n\
  // Instantiating Objects\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Vehicle vehicle = new Vehicle(\"Generic Model\");\n        vehicle.start();\
  \ // Output: Vehicle starts.\n        Car car = new Car(\"Sedan\", 4);\n       \
  \ car.start(); // Output: Vehicle starts.\n        car.honk(); // Output: Car honks!\n\
  \    }\n}\n```\n\n### 实例化父类和子类对象\n从父类和子类实例化对象展示了这种关系的灵活性。`Vehicle` 对象演示了所有车辆共享的共同功能，而\
  \ `Car` 对象则展示了汽车特有的专门行为。\n\n### 构造函数链：调用父类构造函数\n`Car` 类中的 `super(model);` 语句体现了构造函数链，在该语句中调用了父类（`Vehicle`）的构造函数。这确保了共享属性被正确初始化，提高了代码效率并减少了冗余。\n\
  \n```java\n// Constructor in Subclass\npublic Car(String model, int numDoors) {\n\
  \    super(model); // Call to superclass constructor\n    this.numDoors = numDoors;\n\
  }\n```\n\n### 子类和父类的优势\n在 Java 中创建子类和父类促进了模块化和扩展的代码结构。父类封装了公共属性和行为，允许子类继承并在此基础上进行构建。这种方法增强了代码的可维护性，并促进了良好定义组件的可用性。\n\
  \n随着学习者学习“Java 中的类关系与继承”模块，掌握子类和父类的创建将成为他们在“Java 编程”更宏观背景下设计灵活且可扩展软件的能力不可组成部分。\n\
  \n## 方法重写与 @Override 注解\n《Java 编程》书中的“Java 中的类关系与继承”模块深入探讨了方法重写和 `@Override` 注解的使用高级概念。本节引入了面向对象编程中的一种强大机制，允许子类为其在父类中已定义的方法提供特定的实现。\n\
  \n```java\n// Superclass\npublic class Shape {\n    public void draw() {\n     \
  \   System.out.println(\"Drawing a shape.\");\n    }\n}\n```\n\n### 定义父类方法\n在示例中，父类\
  \ `Shape` 引入了一个 `draw()` 方法，作为绘制任何形状的通用表示。其意图是让子类根据它们特定的形状来定制此方法。\n\n```java\n//\
  \ Subclass\npublic class Circle extends Shape {\n    private double radius;\n  \
  \  // Constructor and other methods specific to Circle\n    @Override\n    public\
  \ void draw() {\n        System.out.println(\"Drawing a circle.\"); // Specific\
  \ implementation\n    }\n}\n```\n\n### 子类中的方法重写\n`Circle` 类作为 `Shape` 的子类，重写了 `draw()`\
  \ 方法以为绘制圆提供专门的实现。这种定制确保了 `Circle` 类实例表现出符合其本质的行为。\n\n```java\n// Invoking Overridden\
  \ Method\npublic class Main {\n    public static void main(String[] args) {\n  \
  \      Shape shape = new Circle();\n        shape.draw(); // Output: Drawing a circle.\n\
  \    }\n}\n```\n\n### 多态调用\n`Main` 类演示了多态行为，其中父类类型的引用（`Shape`）用于指向子类类型的对象（`Circle`）。`Circle`\
  \ 类中重写的 `draw()` 方法被调用，阐明了动态方法分发。\n\n```java\n// Using @Override Annotation\npublic\
  \ class Square extends Shape {\n    @Override\n    public void draw() {\n      \
  \  System.out.println(\"Drawing a square.\"); // Specific implementation\n    }\n\
  }\n```\n\n### @Override 注解\n`@Override` 注解是一个编译器指令，通过指示被注解的方法应该重写父类中的方法来帮助防止细微的错误。如果存在不匹配（例如方法名拼写错误），编译器将生成错误，从而及早发现潜在问题。\n\
  \n```java\n// Incorrect Usage (Compiler Error)\npublic class Triangle extends Shape\
  \ {\n    // Incorrect method name\n    @Override\n    public void draww() {\n  \
  \      System.out.println(\"Drawing a triangle.\");\n    }\n}\n```\n\n### 方法重写和\
  \ @Override 的优势\n方法重写有助于创建更专门的类。`@Override` 注解确保了子类中的重写方法准确匹配父类中的方法。随着学习者学习“Java\
  \ 中的类关系与继承”模块，掌握方法重写和 `@Override` 注解对于在“Java 编程”更宏观背景下构建良好设计的类层次结构至关重要。\n\n\n\n\n\
  \n# 数组中的多态\n\n超类类型的数组可以持有各种子类的对象，从而实现态行为。`Zoo` 类演示了 `Animal` 对象的数组，每个对象都指向不同子类的实例（`Dog`、`Cat`\
  \ 和 `Bird`）。\n\n```\n// Output:\n// Dog barks!\n// Cat meows!\n// Bird chirps!\n\
  ```\n\n## 多态与动态方法分派的好处\n\n多态通过允许通过通用接口与多种类型的对象协作，增强了代码的活性和重用性。动态方法分派确保在运行时调用适当的方法，有助于设计健壮且适应良好的软件系统。\n\
  \n随着学习者完成“Java 中的类关系与继承”模块，对多态和动态方法分派的理解将成为他们在“Java 编程”宏大背景下设计和实现多功能且可扩展的 Java 应用程序能力的基础。\n\
  \n# 模块 14：Java 中的访问修饰符与封装\n\n“Java 中的访问修饰符与封装”模块是《Java 编程》一书中的关键部分，深入了控制 Java 类、方法和字段可见性和可访问性的基础概念。访问修饰符和封装是面向对象编程的核心组件，为开发者提供了控制代码可见性和强制数据保护的手段。该模块作为了一份深度指南，揭示了\
  \ Java 中访问修饰符和封装的原理、语法和应用。\n\n## 理解访问修饰符：控制可见性\n\n该模块的核心是对访问修饰符的探索，这些是调节 Java 中类、方法和字段可见性的强大工具。学习者将学习四种主要的访问修饰符：`public`、`private`、`protected`\
  \ 和默认（包级私有）。理解这些修饰符如何控制访问是创建健壮、安全且模块化代码的基础。\n\n### 公共访问：全局可见性\n旅程从探索 `public` 访问修饰符开始，学习者将借此理解被标记为\
  \ `public` 的元素是如何全局可见的。实际示例引导学习者了解公共访问有益的场景，促进了代码的互操作性，并方便了程序不同部分甚至不同程序之间的通信。\n\n\
  ### 私有访问：受限可见性\n在基础之上，模块无缝过渡到 `private` 访问修饰符。学习者将掌握 `private` 访问如何将可见性限制在定义类内部，从而增强数据保护和封装。实际示例说明了如何利用\
  \ `private` 访问来创建封装且安全的类，防止外部干扰。\n\n### 保护访问：继承与子类\n探索延伸到 `protected` 访问修饰符，这是促进类之间类继承和协作的关键组件。学习者将深入了解\
  \ `protected` 访问如何实现定义类及其子类内部的可见性。实际示例引导学习者了解 `protected` 访问在类层次结构中促进代码复用和灵活性的场景。\n\
  \n### 默认（包级私有）访问：有限可见性\n该模块阐明了默认访问修饰符，通常称为包级私有（package-private）。学习者将理解具有默认访问权限的元素仅在同一个包内可见，促进了包级别的封装和模块化设计。实际示例强调了默认访问在创建凝聚且组织良好的代码结构中的作用。\n\
  \n## 封装：保护数据与行为\n\n在访问修饰符的基础上，模块无缝地整合了封装的概念。学习者将理解封装如何将类中的数据和方法结合，强制数据保护并促进模块化设计。实际示例引导学习者创建封装类，培养代码组织能力并增强程序的安全性。\n\
  \n## 访问修饰符与封装在 Java 程序中的应用\n\n模块以访问修饰符和封装在 Java 程序中的实际应用作为结束。学习者将参与实践练习，设计类、设置适当访问级别并封装数据，以创建健壮且安全的代码结构。这种实践经验强化了理论概念，使学习者能够无缝将访问修饰符和封装集成到他们的\
  \ Java 编程工具箱中。\n\n随着学习者完成“Java 中的访问修饰符与封装”模块，他们不仅在控制可见性和保护数据方面获得了技术熟练度，还对安全和模块化软件设计的原理产生了更深层次理解。该模块成为了一个基础组件，使学习者能够在“Java\
  \ 编程”的广泛背景下有效利用访问修饰符和封装。\n\n## Public, Protected, Default 和 Private 访问修饰符\n\n在《Java\
  \ 编程》的“Java 中的访问修饰符与封装”模块中，探索了访问修饰符的细微世界，强调了它们在控制 Java 程序中类、方法和变量的可见性和可访问性方面的关键作用。\n\
  \n```\n// 公共访问修饰符\npublic class PublicExample {\n    public void publicMethod()\
  \ {\n        System.out.println(\"此方法可以任何地方访问。\");\n    }\n}\n```\n\n### 公共访问修饰符\n\
  `PublicExample` 类展示了 `public` 访问修饰符。当类或方法被声明为 `public` 时，它可以从任何其他类或包访问。在示例中，`publicMethod()`\
  \ 可以从程序的任何部分访问。\n\n```\n// 保护访问修饰符\npublic class ProtectedExample {\n    protected\
  \ void protectedMethod() {\n        System.out.println(\"此方法可以在同一个包和子类内访问。\");\n\
  \    }\n}\n```\n\n### 保护访问修饰符\n`ProtectedExample` 类演示了 `protected` 访问修饰符。被标记为 `protected`\
  \ 的方法或变量可以在同一个包内以及通过子类访问，说明了功能到特定范围的封装。\n\n```\n// 默认（包级私有）访问修饰符\nclass DefaultExample\
  \ {\n    void defaultMethod() {\n        System.out.println(\"此方法仅在同一个包内可见。\");\n\
  \    }\n}\n```\n\n### 默认（包级私有）访问修饰符\n在 Java 中，如果未指定访问修饰符，则应用默认访问修饰符。`DefaultExample`\
  \ 类及其 `defaultMethod()` 仅在同一个包内可见，限制了来自包外部的访问。\n\n```\n// 私有访问修饰符\npublic class\
  \ PrivateExample {\n    private void privateMethod() {\n        System.out.println(\"\
  此方法仅在同一个类内访问。\");\n    }\n}\n```\n\n### 私有访问修饰符\n`PrivateExample` 类引入了 `private`\
  \ 访问修饰符。当方法或变量被标记为 `private` 时，它仅在同一个类内访问。这种限制确保了封装的功能对外部类完全隐藏。\n\n```\n// 访问修饰符用法\n\
  public class AccessModifierUsage {\n    public static void main(String[] args) {\n\
  \        PublicExample publicObj = new PublicExample();\n        publicObj.publicMethod();\
  \ // 可访问\n\n        ProtectedExample protectedObj = new ProtectedExample();\n  \
  \      protectedObj.protectedMethod(); // 在同一个包内可见\n\n        DefaultExample defaultObj\
  \ = new DefaultExample();\n        defaultObj.defaultMethod(); // 在同一个包内可见\n\n \
  \       PrivateExample privateObj = new PrivateExample();\n        privateObj.privateMethod();\
  \ // 仅在同一个类内可见\n    }\n}\n```\n\n### 访问修饰符的实际用法\n\n\n\n\n\n`AccessModifierUsage`\
  \ 类阐述了各种访问修饰符的实际用法。通过实例化具有不同访问修饰符的类对象并调用其方法，展示了封装原则的应用。\n\n理解并策略性地应用 `public`、`protected`、`default`\
