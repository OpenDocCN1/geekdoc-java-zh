  Say 'Hello World'\");\n        btn.setOnAction(event -> System.out.println(\"Hello\
  \ World!\"));\n        StackPane root = new StackPane();\n        root.getChildren().add(btn);\n\
  \        primaryStage.setScene(new Scene(root, 300, 250));\n        primaryStage.show();\n\
  \    }\n}\n```\n\n### JavaFX 的构建块：场景图与节点\n\n在提供的 JavaFX 代码段中，展示了 JavaFX 的基本概念。扩展了\
  \ `Application` 类并重写了 `start` 方法以设置主阶段（Stage），它是 Java 应用的主窗口。场景图作为表示图形用户界面的层次结构，被用于组织和显示视觉元素。\n\
  \n### JavaFX：声明式 UI 设计与样式\n\n\n\n\n\nJavaFX 以其声明式的 UI 设计方法脱颖而出，允许开发者使用 `FXML` 或通过编程方式描述用户界面的结构和外观，如代码所示。场景通过\
  \ `StackPane` 布局构建，并向其中添加了一个简单的 `button`。样式和定制可以通过 CSS 实现，为开发者提供了强大的工具，用以创建视觉上吸引人且响应响应式的界面。\n\
  \n### JavaFX 中的事件处理：为 UI 带来交互性\n\n`btn.setOnAction` 方法演示了 JavaFX 的事件处理能力。在这种情况下，点击按钮会触发\
  \ Lambda 表达式，展示了在 JavaFX 中处理用户交互的简单与简洁。\n\n### JavaFX 与 UI 开发的演进\n\n当开发者探索 JavaFX\
  \ 时，他们拥抱了一个专为满足现代 UI 开发需求设计的框架。JavaFX 促进了响应式、交互式且视觉吸引力用户界面的创建，使其成为从桌面端到移动端应用程序的理想选择。“JavaFX\
  \ 框架简介”部分为希望利用 JavaFX 潜力构建下一代 Java 基础用户界面的开发者提供了基石。\n\n## 使用场景图和节点构建 UI\n\n在模块“现代\
