  \    }\n}\n```\n\n\n\n\n\n```java\nthrow new CustomDataProcessingException(\"Data\
  \ cannot be null or empty.\");\n\n}\n\n// Code to process valid data\n\n// ...\n\
  \n}\n\n}\n```\n\n## 利用自定义异常进行针对性错误处理\n\n上面的示例展示了在 `DataProcessor` 类中自定义自定义异常。`validateData`\
  \ 方法在遇到无效数据时抛出 `CustomDataProcessingException`。在调用方法 `processData` 中捕获了此自定义异常，允许进行特定且细致的错误处理。这种针对性的方法增强了代码的可维护性，有助于开发者快速识别并解决问题。\n\
