  md: 'Applications calls services that provide a specific function, such as calculation
    of the interest rate for a home loan, sending a request (including the input data)
    and receiving the reply (including the result). In most cases, these call services
    wait for the result to arrive before they continue processing. That is, the service
    blocks the processing. In most technologies, the application can wait forever
    if the service becomes unavailable. So, the application designer has to plan for
    service outages. In the case of a JEE calling a service implemented by EJB, at
    least an exception is thrown if the service is not available. So, the application
    might catch the exception, and the processing can continue by using an alternative
    service or by notifying the user about the service outage.


    On the other hand, many service calls must not block processing if the service
    becomes unavailable. For example, auditing and logging is important. However,
    in case of a auditing service outage, the processing of an account balance query
    should not be stopped. A better action is to call the service asynchronously,
    so the service is issued and the application continues processing without waiting
    for a confirmation response from the service. Optionally, the confirmation messages
    can be collected later in the process to assure that the audit systems have written
    to the audit record.


    New JEE applications and EIS systems typically reside on different hosts and servers.
    To connect from applications to the EIS systems, physical networks have to be
    established and connections have to be configured. The network infrastructure
    may change from time to time. That is, hosts, TCP/IP addresses, and ports for
    EIS systems can vary. Management of these changes is an issue if these parameters
    are hard coded or, in general, are held in the application. In many situations
    it is of advantage to hide the actual destination of an EIS request and provide
    the application with an abstraction of the destination. In this case, changes
    and updates of the EIS system infrastructure can be managed without touching the
    application.


    To conclude, these are the main requirements that can lead to selecting and need
    for extensive messaging-based integration style:


    +   - No common data model established and need for extensive data transformation
    at the interface application to EIS system


    +   - Geographically remote application and EIS system calls


    +   - Need for non-blocking EIS service calls'
