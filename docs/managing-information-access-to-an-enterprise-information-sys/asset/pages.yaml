  md: '# 1.1 Who should read this book


    Integrating to an EIS is not a trivial exercise. You probably have come to appreciate
    the complexity of this process if you have gone through similar exercises in your
    organization. Most organizations have enterprise architectures, including principles,
    frameworks, and components for their EIS integrations. Whether these architectures
    are actually used across the enterprise by the different development channels
    or development teams is another debate. However, the real challenge is whether
    your organization or channel EIS integration methodologies are working for or
    against you.


    For example, ask yourself these questions about your EIS integration architecture:


    +   - Is it easy to maintain?

    - Is it developer friendly?

    - Is it a disciplined development environment?

    - Does it perform fast?

    - Does it abstract your EIS integration from your business processes?

    - Can you add connectors?

    - Can you change from a CICS® or COBOL transaction to a JDBC-stored procedure
    without affecting the business process?

    - Can your business processes invoke an EIS transaction and be totally agnostic
    to where the EIS is located?

    - Can your business processes invoke an EIS transaction and be agnostic to any
    connector that is used for the integration?

    - How are your business processes or applications affected when you back-end transaction?
    Does it require extensive re-factoring to processes and/or applications?

    - Do you have questions on which technologies you can or use for your EIS integration
    (for example, J2C connectors, JDBC, JMS, Web services, BPEL processes, and so
    on). Importantly, what is the right fit for your organization?


    If any of these questions relate to your situation and the challenges that you
    face in your environment then the information in this book will be helpful to
    you.


    Architects, designers, and developers of all skills will benefit by reading some
    of the chapters in this book. Part 1, “Scenario introduction” on page 1 covers
    the architecture, business scenario, design, and environment. Architects and designers
    should read all of the chapters in this part of the book. Developers'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'also benefit from these chapters because they present an overview of the architectural
    challenges, concepts, vision, and objectives that influenced the architecture
    for the EIS integration scenarios.


    Part 2, "Development example" on page 93 implements an EIS integration solution,
    using JEE, Web services, J2C connectors, JMS, and BPEL processes into a real-world
    EIS running IMS™ and CICS and Cobol transactions. This part of the book is for
    designers and developers who want to see how the architecture was implemented
    using technologies and development tool sets, such as WebSphere Studio Application
    Developer Edition.


    # 1.2 What we do in this book


    In this redbook, we modelled our EIS integration architecture and design from
