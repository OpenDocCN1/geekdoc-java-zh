  md: '# Business services


    At the heart of the Integration Edition programming model are business services,
    which are used to consistently model different kinds of service providers. Services
    are the business functions of your enterprise, or of your business partners. You
    can use the integration tools to develop various types of services, including
    Web services, processes, EIS (JEE Connector) services, JMS services, and so on.
    WSDL is used as the model for describing any kind of service.


    # Business processes


    A process is service implementation that represents a part of your business operations.
    It can be totally automated or may require human interaction at certain points.WebSphere
    Studio Application Integration Edition provides a model that allows you to implement
    these processes in a very efficient graphical way.


    The following sections discuss how to expose the developed process as a Web service,
    how to invoke a Web service inside the process, and what are the main related
    issues.


    See 7.6, "Further information" on page 195 for reference information about WebSphere
    Studio Application Developer Integration Edition and how to develop Web services.


    # 7.4.2 Expose the process as a Web service


    To expose a process as a Web service is a simple activity. The business on process
    engine of WebSphere Business Integration Server Foundation is based on the BPEL4WS
    language that uses Web service concepts.


    BPEL states that any from the process to the external world is a Web service and
    is physically described by a WSDL file. As a consequence, you need to establish
    only the details of the communication, which is called in Web services jargon,
    defining the binding.


    The binding defition for a process is done during the last development phase,
    which is Generate Deploy Code. The deploy wizard of WebSphere Studio Application
    Developer Integration Edition shows all the interfaces of the process. The Interfaces
    for Partners section contains all the interfaces that the process exposes to its
    clients. For each interface (PortType), it is possible to select which binding
    to make available. For an example, see Figure 7-4 on page 176.'
