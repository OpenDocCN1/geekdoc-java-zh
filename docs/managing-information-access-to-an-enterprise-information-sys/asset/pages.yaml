    > Note: The WS-I has recently updated the WS Basic Profile to version 1.1. The
    content of the document has been reorganized. However, it is equivalent to the
    previous version with the addition of published errata.


    # Security and interoperation


    At the time we wrote this book, the Basic Security Profile Version 1.0 was still
    a draft. Thus, we cannot give a WS-I certification for the WS-Security implementations.
    Nevertheless, there are many test cases of interoperability between the implementation
    by IBM and the implementation by Microsoft.


    IBM is one of three editors of the Basic Security Profile 1.0, along with Microsoft
    and Nortel Networks.


    # 7.6 Further information


    Because Web services technology is fast growing and touches many fields, it is
    impossible to give a complete view of the technology in this redbook. For a chapter
    discussed Web services as they relate to our purpose in this book. For a deeper
    understanding of Web services, this section lists some useful readings.'
