    # 6.3.4 Extending the building block


    The previous sections presented the EIS integration building block by referring
    to JMS destinations and WebSphere MQ queues. Besides the point-to-point interaction
    pattern, JMS and many MOM products support the publish-subscribe interaction pattern.
    With a publish-subscribe method, a message sender broadcasts to a set of receivers.
    The potential receiver subscribes to a specific topic to receive the messages.
    Instead of using destinations for the sender to locate the message receiver, the
    sender sends the message to JMS and the MOM by specifying a topic. Using this
    pattern, the application can send messages to many receivers simultaneously with
    just one JMS interaction. The MOM, not the application, is in charge of delivering
    the message to all interested receivers.


    Transformation of data is a core requirement for EIS integration. With the integration
    using JMS, transformation from the application data model to the EIS data model
    is performed close to the EIS in the EIS-specific message enabler (in our approach,
    the EIS component). Across the application and the messaging infrastructure, the
    data model of the application is used. For many reasons, introducing a broker
    component is an advantage that builds a central hub in the messaging infrastructure
    (see 6.2.3, “Hub-and-spoke integration pattern” on page 126). The broker is in
    charge of routing messages to potential receivers and may also be used to transform
    the message from the application domain model to the EIS system data model.


    This traditional EAI style was mainly introduced to reduce complexity for integration
    problems. In addition, broker implementations such as WebSphere Business Integration
    Message Broker provide a comprehensive and powerful framework for message transformation.
    Although this book does not cover complex integration problems, extending the
    messaging infrastructure with a broker might be of advantage because of its transformation
    capabilities. For example, EIS systems may require the generation and parsing
    of EDI documents, because their data model relies on the EDI standard. WebSphere
    Business Integration Broker supports EDI parsing and EDI document generation,
