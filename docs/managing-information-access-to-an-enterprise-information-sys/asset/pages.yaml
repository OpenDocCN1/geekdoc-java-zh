    # 7.3 Service-oriented architecture


    To better comprehend Web services technology, we need to understand its place
    in the more general service oriented architecture (SOA). This section describes
    the technology stack that supports the SOA. For a detailed description of SOA,
    see “Further information” on page 195.


    Figure 7-3 on page 173 describes briefly the layers of the SOA architecture.'
  merge: -1
