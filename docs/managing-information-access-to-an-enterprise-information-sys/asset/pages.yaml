    infrastructure component recovers, the MOM sends the messages to their receiver.


    # The EIS system


    To be enabled for the messaging-based integration style, the EIS system must be
    able to send and receive messages from the JMS connector or directly from the
    MOM. There are a number of approaches to enable an EIS for messaging. We focus
