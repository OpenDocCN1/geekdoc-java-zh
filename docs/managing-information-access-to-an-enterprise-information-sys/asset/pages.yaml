    # The J2EE application server


    The J2EE application, including Web and EJB components, runs on the application
    server. The application server is in charge of managing the application components.
    For example, it forwards requests to the components and initializes a thread pool
    to process requests simultaneously. The administration console of the application
    server is used to enable the application to use JMS and the underlying messaging
    infrastructure. Typical tasks for the administrator are the configuration of JMS
    connection factories, destinations, and topics. For WebSphere Application Server,
    you can also select the JMS provider that is used. A lightweight implementation
    is named WebSphere Embedded Messaging. Alternatively, WebSphere MQ can be used.
    WebSphere Business Integration Server includes Extended Messaging that facilitates
    sending and receiving of messages by providing support for interaction patterns
    as send and wait for reply.


    # The application


    Web and EJB components build up the J2EE application. JMS messages are typically
    sent by and received from EJB applications. The EJB 2.0 standard defines MDB that
    are used to receive and process messages.


    We recommend that you use specific message beans to send and receive the messages.
    Message beans encapsulate the JMS-specific setup that you have to perform before
    you can send a message. For example, you have first to create a JMS connection
    using a connection factory. Then you create a sender object by specifying the
    JMS destination, initialize the message, and'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'finally, send the message using the sender object. Using the JMS API, the application
    uses abstract representations of the actual physical destination that the message
