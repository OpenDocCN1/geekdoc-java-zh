    message using JMS APIs.

    2. The JMS connector implements the API creates the message and forwards it to
    the JMS provider. The message is put on the queue

    3. The JMS provider and the underlying messaging infrastructure accepts the message
    and transports the message to its destination, either directly to the receiving
    host or by routing the message through other servers


