    set JDBCPATH="*CROSSWORLDS\*bin\xwut1.Java;"C:\Program

    Files\IBM\SQLIB\db2java.zip"

    set JDBCLIB="C:\Program Files\IBM\SQLIB"

    ```


    +   3. Start the JDBC ODA by clicking Start → Programs → IBM WebSphere Business
    Integration Adapters → Adapters → Object Discovery Agents → JDBC Object Discovery
    Agent.


    The JDBC Object Discovery Agent is now ready for use by the Business Object Designer.'
