    by developing COBOL artifacts to connect to the MOM. Many other EIS systems are
    written in Java or provide a Java runtime environment. For those EIS systems,
    Java beans can be developed to interact with the JMS provider on the EIS host
    (see Figure 6-3 on page 130).


    We recommend the development of an EIS component that contains the following features:


    +   - It can be exposed as a service with a JMS binding to participate in a MOM
