  md: '# 2.2.2 Architecture options


    Decomposing the back-end integration system into smaller building blocks presents
    some architectural options that we need to decide on before we present the final
    blue print of the architecture to the designers. Here are some of the options
    we have in context to an EIS integration level 3:


