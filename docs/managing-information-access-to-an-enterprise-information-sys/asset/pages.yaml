- img_proc: true
  md: 'BPEL implementation from IBM in various white papers and Redbooks. The following
    sections address two other important requirements: transaction support and usability
    of technology and tools.


    # 9.4.1 Transaction support


    In 9.1.3, "Deploying and running business processes" on page 246, we introduce
    the transactional support in the BPEL process engine of WebSphere Business Integration
    Foundation. BPEL business processes are atomic if the process is short-running
    and non-interruptible. In this case, service invocations are part of the global
    process transactions. If service support transactions, for example EJB invocations
    and J2C-based services, technical rollback using the XA protocol is performed
    in case of failures.


    If processes processes are long-running and interruptible, the process consists
    of a series of single transactions, including one service invocation. For long-running
    processes there is no transactional context spanning the whole business process.
    Instead, WebSphere Business Integration Server Foundation introduces the notation
    of compensation to undo activities in case of failures.


    Compensation requires that services functions can be undone. For instance, a log
    record that was created in a database can be deleted if service invocation of
    another function fails. An e-mail was sent to confirm a client''s order cannot
    be withdrawn and deleted in case later in the process it is detected that the
    order is out of stock. A possible undo action would be to send another e-mail
    informing the customer that the order is no longer available.


    Compensations is initiated if faults occur in a business process. Faults are indicated
    by an exception that is thrown by an activity or other business process that are
    invoked in the process. Exceptions have to be specified in the WSDL service description
    of the service or business process. To introduce compensation in a BPEL process
    the following tasks to be performed:


    +   - Add exceptions to the WSDL description of the operations that are used to
    invoke the service or business process.

    - Add fault handlers for activities and business processes to catch or rethrow
    exceptions.

    - Enable compensation for the business process by setting the Sphere attribute
    to Required.

    - Select undo operations for activities that have to be invoked if compensation
    is performed.'
