    # 2.2.1 Architecture challenges


    Every architect or designer, when challenged with a new business problem, will
    try to create an architecture that adheres to common architecture principles,
    such as extensibility, stability, scalability, portability, flexibility, and so
    on. One can argue that the architects of a high-rise building must consider possible
    disaster scenarios such as earthquakes, high winds, thunderstorms, and so on.
    Likewise,'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'software architects attempt to design a robust software system that not only
    exceeds the business expectations but that also adheres to architecture and design
    principles.


    Imagine for a moment that you are an architect of a high rise building in downtown
    Johannesburg, South Africa. What are some of the challenges you face? In this
    location, there are natural challenges, such as earthquakes, thunderstorms, and
    high winds, as well as man-made challenges, such as adequate parking and access
    to the building. As the architect, you must consider all the challenges in your
    final blue print. Software architects should apply the same time when designing
    new systems software.


    As discussed in previous sections of this chapter (see 2.1, "Integrating a remote
    EIS" on page 10), back-end system integration can be very complex. Back-end system
    integration presents its own set of unique, and common architectural issues that
    must be considered when creating a software solution that exceeds business expectations
    at the same time adhering to IT principles.


    # Wide area network (WAN)


    The application or business process that must integrate with a back-end system
    can be physically remote from the back-end. (See 2.1, "Integrating a remote EIS"
    on page 10 for descriptions of local, remote, and external back-end systems.)
    When your application must integrate with a back-end system over the WAN, you
    will have to consider the available bandwidth.


    For example, if your bandwidth is 64 KB and you share SNA and IP traffic over
    the same physical infrastructure, you would definitely want to consider using
    compression between your application and the back-end system. The fact that you
    may have a 256 KB, or even 1 MB, link available between your application and the
    back-end system should not mean that you can push XML documents over the WAN.


    Consider, for example, that the volume and concurrency of transactions to the
    back-end system might increase. You might have designed elegant solutions on the
    application and back-end integration layers. However, the WAN might void all that
    if it cannot handle the volume.


    > Suggestion: Consider designing a back-end integration solution where you can
    declaratively enable or disable data compression to a back-end system over the
    network. For example, using the J2C CICS connector, you can specify security classes.
    These classes can handle the compression of requests to the back-end system and
    the decompression of responses from the back-end. Figure 2-4 illustrates how to
    configure J2C CICS connector that are used for data compression.


    20 Managing Information Access to an EIS Using J2EE and Services Oriented Architecture'
