  md: '# 9.1.4 Monitoring business processes


    The WebSphere process engine is managed by use of the administration console,
    which is implemented as Web application, and by use of standard WebSphere scripting
    mechanisms. In addition, WebSphere Business Integration Server Foundation provides
    a Web application to monitor execution of business processes, to manually suspend
    or end long-running processes, and to manage assignment and delegation of workflow
    activities of a business process.


    Deployment of applications is supported by use of the administration console and
    by scripting mechanisms, respectively. For standard J2EE applications, multiple
    versions may be installed on separate application instances. You can manually
    activate and deactivate these different application versions by starting and stopping
    the corresponding server instances, preferably using scripts. For BPEL, you can
    deploy multiple versions of business process flows on the server instances, which
    become active at a specific date and time.


    More sophisticated monitoring capabilities are available in the WebSphere Business
    Integration Monitor product. WebSphere Integration Monitor Version 5.1 will extend
    monitoring and reporting capabilities that are available for WebSphere Business
    Integration Workflow Message Broker and will include support for the WebSphere
    Business Integration Server Foundation environment. The currently available WebSphere
    Business Integration Monitor Version 4.2 offers:


    +   - The ability to monitor work-in-process items based on the user perspective
    and to perform corrective actions by reassigning, re-prioritizing, or suspending
    those items

    - The ability to represent monitored information in an event way, not just process-
    and activity-centric

    - The business process dashboard for tracking processes, work items, and business
    performance measures

    - The report builder to choose the layout of reports and the information graphics
    used to visualize information

    - Rules-based alerts and support for multiple user notification methods (dashboard,
    e-mail, and mobile)


    WebSphere Business Integration Monitor Version 5.1 will be integrated with WebSphere
    Business Integration Modeler and will include the capability to feedback real-time
    process data into process models.'
  merge: -1
