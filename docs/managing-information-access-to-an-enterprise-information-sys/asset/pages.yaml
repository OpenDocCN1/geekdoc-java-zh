  md: '# 5.2.2 J2C inbound integration pattern


    For inbound communication the EIS component can make calls on session beans, entity
    beans, and Message Driven Beans (MDB). This event notification or asynchronous
    messaging is defined in the message inflow contract.


    The message inflow contract defines how a resource adapter communicates with interested
    parties to events happening in the EIS. Each interested party is a MessageEndpoint.
    The application server loads the MessageEndpoints into the MessageEndpointFactory
    and registers each of them with the resource adapter through the message inflow
    contract.


    Figure 5-1 illustrates the contract.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_116_0.png)


    Figure 5-1 Inbound message flow contract


    The application server uses the activation specification which was configured
    by the MessageEndpoint during deployment to register the endpoint with the resource
    adapter. The application server calls the endpointActivation() method on the resource
    adapter, which should enable the resource adapter to send messages to the application
    component represented by the endpoint. The MessageEndpoint implements a MessageListener
    interface which the resource adapter specifies through the ActivationSpec. Using
    the method(s) of the MessageListener interface the resource adapter notifies the
    MessageEndpoint about events in the EIS.


    The resource adapter serves as a conduit between the application component (MessageEndpoint)
    and the EIS. The resource adapter can monitor the EIS for activity using with
    work management contract to schedule work with the WorkManager. The resource adapter
    can also register with the EIS if an event notification registration system exists
    within the EIS. In this there is'
  merge: -1
  pgno: 116
- img_proc: true
  md: 'either call back mechanism or some intermediate event store that is used for
    triggering and sending the events to the resource adapter. Finally, the message
    endpoint is notified of the event by a call to MessageEndPoint.


    The delivery of events from EIS can also be triggered using managed transactions
    and Java Transaction API (JTA). This method of delivery uses the transaction management
    contract and controlling the transaction boundaries beforeDelivery and afterDelivery
    methods. These methods signify when the application server should enable XARource
    to start and end the transaction.


    For more information, see the JCA 1.5 specification at:


    ```

    http://java.sun.com/j2ee/connector/download.html

    ```


    # 5.3 The integration building block using J2C


    This section describes the integration building blocks that use J2C and how the
    IBM CICS J2C resource adapter helps to solve the scenario problem. It describes
    the components of the building block and the system architecture used for the
    EIS integration.


    # 5.3.1 Scenario problem statement


    Many EIS have their services and functions exposed through the use of a J2C resource
    adapter that is 1.0 or 1.5 compliant. Application components are more often built
    to run in a J2EE application server. To manage EIS data and use functionality,
    the application components use resource adapters to interact with these enterprise
    systems.


    For our specific scenario, the ITSO Trading Firm has an Internet Trading System
    J2EE application that processes trade requests made over the Web. The Internet
    Trading System uses a company list to verify whether buy or sell requests can
    be made through the system. The information for the company list is stored in
    a CICS system that the firm owns.


    Our Buy Shares requires verification of the order against the company list. The
    trade shares business component of the Internet Trading System uses the list of
    available companies from which customers are allowed to buy shares. The component
    needs this process to be quick, synchronous retrieval from the CICS system. This
    process is facilitated by the CICS resource adapter which can be integrated into
    the trade shares business component as a service.'
