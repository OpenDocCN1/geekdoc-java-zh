    # Connection pooling


    The connection management contract of the specification defines the roles of the
    resource adapter and application server when maintaining connections to the EIS.
    This connection enables the application server to provide efficient connection
    pooling. It allows the application server to deal with dead and idle connections
    and reuse existing connections.


    # Security


    The security contract allows the resource adapter to use container managed security,
    which are easily defined using J2C JAAS authentication entries, similar to the
    ones used earlier in “Creating and configuring the integrated test environment”
    on page 115.


    Security can also be achieved by leveraging the EIS systems authentication mechanism
    at the connection and interaction level. Depending on the EIS and the design of
    the interaction interface, there could be additional security provided by the
    resource adapter.


