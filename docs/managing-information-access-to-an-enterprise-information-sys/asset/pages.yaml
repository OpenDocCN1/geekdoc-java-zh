    Integration Modeler. We have noticed that the definition of a business use case
    is accelerated significantly, if the modeling tool is used in a requirements capture
    workshop, even for our rather simple scenario. In most cases, the reports and
    figures that can be easily generated with the modeling tool provide a sufficient
    level of detail to describe the functional requirements on a business level. Sharing
    these documents across a team of business analysts improves collaboration and
    provides for more effective and efficient discussions.


