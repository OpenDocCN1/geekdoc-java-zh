    Log and Send activities are tightly coupled because you only want to create the
    log record if the message was successfully taken over by the MOM. On the other
    hand, if the request cannot be recorded because of a database failure, the message
    should not be sent, and the exception handling is needed.


    WebSphere Business Integration Server Foundation allows the specification of transactional
    behavior of activities in a long-running process. In the Server tab


    290 Managing Information Access to an EIS Using J2EE and Services Oriented Architecture'
