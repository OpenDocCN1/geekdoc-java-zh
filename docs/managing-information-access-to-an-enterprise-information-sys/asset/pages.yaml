    # # Logical architecture layers


    The architecture layers in Figure 2-1 illustrate the different levels of back-end
    system integrations. These architecture layers represents a logical view of an
    enterprise''s layered architecture. We acknowledge that every enterprise probably
    has its own layered architecture that adheres to its own naming standards and
    the principles of its IT department. These logical layers represents a general
    (or abstract) view for discussion and illustration of the different levels of
    back-end integration. Most enterprises probably have many channels or business
    units. Often, you will find that channels have implemented their own applications,
    using their own EIS integration frameworks, patterns, and components.'
