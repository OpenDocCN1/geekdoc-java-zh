- img_proc: true
  md: '| Business Processes | | BPEL4WS |

    | --- | --- | --- |

    | Quality of Service | Reliable Messaging | Security Transactions |

    | | | | Coordination |

    | Description | WSDL, UDDI, Inspection | |

    | Messaging | SOAP (Logical Messaging) | Other Protocols |

    | | XML, Encoding | Other Services |

    | Transport | HTTP, SMTP, BEEP, RPC, MOM (JMS), etc. |


    Figure 7-3 SOA stack


    The *Transport* is the foundation layer for the Web services programming stack.
    All Web services must be available over some network. The network is often based
    on HTTP protocol, but other kinds of network protocols, such as the Internet Inter-ORB
    Protocol (IIOP) or the message-oriented middleware (MOM), such as WebSphere MQ,
    are also used.


    On top of the Transport layer is a *Messaging* layer that facilitates communications
    between Web services and their clients. The Messaging layer usually is based on
    SOAP. SOAP is a simple request-response protocol that is based on XML, which defines
    how to invoke the operations of a service.


    The *Description* layer is simpler but covers a key role. It describes the service
    details to the clients. WSDL takes the form of XML documents for the programming
    interface and for the location of Web services. Publication of a service is really
    any action by the service provider that makes the WSDL available to a potential
    service requester. Sending the WSDL (or a URL pointer to the WSDL) as an e-mail
    to a developer is considered to be publishing. Publishing is also advertising
    the WSDL in a UDDI registry that be thought of as a reachable collector of WSDL.
    The UDDI registry acts as a search engine. The UDDI registry can be useful internally
    as a reference for many developers, or it can be exposed externally to facilitate
    integration.


    The next layer is *Quality of Service*. To be viable for e-business, Web services
    must possess the same characteristics that business applications in an enterprise
    must possess, including reliability, availability, manageability, security,'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'an so on. All these qualities are discussed in 7.5, "Quality of service for
    Web

    services" on page 180.


    The topmost layer in the stack is the Business Process layer (also known as

    Service Orchestration). This layer is implemented using Business Process

    Execution Language for Web Services (BPEL4WS or BPEL for). It adds

    the capability to compose many services into a workflow to deliver a new

    complex business service. Although it is logically positioned as the last layer,
    it is

    independent of the Quality of Service layer. So, we can run a BPEL process even

    without security, reliability, coordination, and transaction.


