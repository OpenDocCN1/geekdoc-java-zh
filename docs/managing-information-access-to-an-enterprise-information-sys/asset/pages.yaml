    # Architecture


    Integration to a back-end EIS requires a detailed analysis of technology options
    and architectural issues so that you can create an EIS integration architecture
    that can support changing systems and infrastructures. This chapter illustrates
    and discusses the meta, conceptual, and logical architecture for our EIS integration
