  md: '# Preface


    This IBM Redbook focuses on issues associated with the integration of an existing
    enterprise information system (EIS) into a new Java 2 Platform, Enterprise Edition
    (J2EE), and other service-oriented applications. The book specifically discusses
    quality of service issues that are associated with the integration of geographically
    remote EIS. It describes how to use Web services, Java Message Service (JMS),
    and J2EE Connector Architecture (JCA) technologies in combination to enable access
    to existing transactions while addressing transport difficulties due to variable
    network conditions. It also addresses security context and transaction propagation
    issues.


    The audience for this book is architects and developers who are implementing new
    J2EE and service oriented architecture (SOA) solutions that need to be integrated
    with existing systems.


    # The team that wrote this red


    This redbook was produced by a team of specialists from around the world working
    at the International Technical Support Organization (ITSO), Raleigh Center.


    William Moore is a WebSphere specialist at the ITSO, Raleigh Center. He writes
    extensively and teaches classes on WebSphere and related topics. Before joining
    the ITSO, Bill was a Senior AIM Consultant at the IBM Transarc laboratory in Sydney,
    Australia. He has 19 years of application development experience on a wide range
    of computing platforms and uses many different coding languages. He holds a Master
    of Arts degree in English from the University of Waikato, in Hamilton, New Zealand.
    His current areas of expertise include application development tools, object-oriented
    programming and design, and e-business application development.


    Corville Allen is a Software Engineer working in WebSphere Business Integration
    development based at the Burling Lab, in the U.S. He has six years of experience
    in software development, business integration, and J2EE technologies. Currently,
    he is working on business integration adapters and integration components for
    WebSphere Application Server. Corville has Bachelor of Science degree in Mathematics
    and Computer Science from Iona College in New Rochelle, New York.'
  merge: -1
  pgno: 12
- img_proc: true
