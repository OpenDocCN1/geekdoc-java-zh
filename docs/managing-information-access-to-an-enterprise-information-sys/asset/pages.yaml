    # Transaction management


    A key service that is required for robust server-side development is transactions.
    Transactions, when used properly, can make your mission-critical operations run
    predictably in an enterprise environment. Transactions are an advanced programming
    paradigm that allow you to write robust code. Transactions are also very useful
    constructs to use when performing persistent operations, such as updates to a
    database.


    Distributing your application or business processes across the network introduces
    failure and reliability concerns. For example, what happens if the network crashes
    during a banking operation? Typically, an exception will be generated and thrown
    back to the code. However, this exception is quite ambiguous in nature. The network
    may have failed before money was withdrawn from an account. It is also possible
    that the network failed after the withdrawal. There is no way to distinguish between
    these two cases. All the client code sees is for how much money is in the bank
    account.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'In fact, the network may not be the only source of problems. Because we''re
    dealing with bank account data, we are dealing with persistent information that
    resides in a database. It is entirely feasible that the database itself crash.
    The machine on which the database is deployed could also crash. If a crash occurs
    during a database write, then the database could be in an inconsistent, corrupted
    state.


    For a mission-critical enterprise application, none of these situations is acceptable.
    Mainframe systems and other highly available systems offer preventive measures
    to avoid system crashes. In reality, however, nothing is perfect. Machines, processes,
    or networks will always fail. There needs to be a recovery process that can handle
    these crashes.


    In 2.1.1, "Levels of EIS integration" on page 12, we discuss the different levels
    of EIS integration and, in particular, on level 3 integration where the application
    or business processes use an EIS system processes for all of its back-end integration
    requirements. In the domain of processes, or more specifically BPEL and Business
    Process Choreographer, transactional behavior depends on the interoperability
    of the processes. (See 2.3, "Key technologies" on page 58 of BPEL and Business
    Process Choreography.)


    Non-interruptible processes execute within a single transaction. In contrast,
    each activity within an interruptible process can have its transactional behavior.
    In either case, if a failure is detected, the current uncommitted transaction
    is rolled back, and any pending compensation activities are applied.


    # Interoperability


    A major benefit of Web services is interoperability between heterogeneous platforms.
    You want to design your services to be interoperable with any platform. The Web
    Services Interoperability (WS-I) organization helps in this regard. WS-I promotes
    a set of generic protocols for the interoperable exchange of messages between
    Web services. The WS-I basic promotes interoperability by defining and recommending
    how a set of core Web services specifications and standards (including SOAP, WSDL,
    UDDI, and XML) can be used for developing interoperable Web services.


    Using Web services does not imply that you will achieve interoperability by default.
    If your EIS system process is exposed as an enterprise service, then you must
    consider that consumers of your EIS service system can run on a .NET platform,
    or even a Siebel or SAP system for that matter. Your development tool set, such
    as WebSphere Studio Application Developer Integration, has the ability to generate
    services that are WS-I compliant, but it can also generate service bindings that
    are not supported by the WS-I'
