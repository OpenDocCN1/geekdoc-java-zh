  md: '# 9.2 Modeling and designing business processes


    Business process modeling is performed mainly by business analysts. These subject
    matter experts usually do not have detailed IT knowledge. The challenge for software
    development methodologies and project management is to enable the business analysts
    to provide sufficient information to IT architects and designers so that the design
    reflects the business requirements.


    This chapter focuses on the methodology and tools that can ensure unbiased flow
    of information from business analyst to IT architect and designer. It shows in
    detail how you can model and design business processes using WebSphere Business
    Integration Modeler, Rational XDE Developer, and WebSphere Studio Application
    Developer Integration.


    # 9.2.1 Modeling the stock trade scenario


