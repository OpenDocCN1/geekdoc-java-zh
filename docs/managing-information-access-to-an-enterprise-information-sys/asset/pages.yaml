  md: '# Integration using WebSphere Business Integration Adapters


    This chapter describes how to integrate an EIS system using WebSphere Business
    Integration Adapters. In particular, it focuses on how to use the JDBC adapter
    to interact with an EIS running on WebSphere Business Integration Server Foundation.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 8.1 WebSphere Business Integration Adapters overview


    IBM WebSphere Business Integration Adapters provide integration with an enterprise
    information system (EIS). In today''s world, where enterprises have disparate
    systems that need to be integrated, the WebSphere Business Integration Adapter
    suite provides access to information in a heterogeneous environment.


    The adapter framework provides a common runtime and API that are used to develop
    and run the adapters. The adapters are configurable at design time and are metadata
    driven at runtime, allowing an organization to be responsive and flexible by incorporating
    new integration processes with very little development.


    The WebSphere Business Integration Adapters allow for data exchange and business
    process integration through the use of integration brokers or integration processes.
    The integration brokers, such as IBM WebSphere InterChange Server and IBM WebSphere
    Integration Message Broker, provide integration using a hub-and-spoke approach
    for the adapters, and message flows that are available for managing the data integration
    scenarios. The integration processes are available through the use of Business
    Process Choreographer and the Business Process Integration Server Foundation.
    The integration processes are created in Business Process Choreographer which
    uses the adapters to integrate different business processes with an enterprise.


    The WebSphere Business Integration Adapters have a set of features that allow
    them to provide an on demand e-business with the ability to adapt, scale processes,
    and rapidly deploy the solution. The adapters are:


    +   - Configurable

    The adapters are configurable at design time to connect to different EIS. The
    adapters can be quickly and easily configured for different integration brokers
    and quality of service.


    +   - Metadata driven

    The adapters are metadata driven, allowing many different integration patterns
    without changing code or needing any development effort. The presence of application-specific
    metadata allows the adapter to integrate with different components and services
    within an EIS without the need to recode or do new development. Using the metadata,
    the adapter can do context-based processing by prioritizing requests and providing
    optional quality of service, such as support for long-running processes in conjunction
    with the EIS.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '+   Bi-directional


    The adapters have the ability to send information to the EIS and to retrieve events
    from the EIS. The process of sending information to the EIS is referred to as
    *request processing*. Processing a request from an integration broker or a client
    service to perform an operation in the EIS. *Event notification* is the retrieval
    of changes and updates to an EIS component and propagating these changes to an
    integration broker or client service.


    +   Multi-threaded requested processing


    Typically, an adapter is multi-threaded during request processing. The adapter
    can handle multiple simultaneous requests to perform different operations on the
    EIS, allowing for scalability and better performance.


    There are two distinct type of adapters:


    +   Application adapters


    +   Technology adapters


    These two types of adapters allow integration with legacy applications, mainframe
    systems, and different technologies. The application adapters provide integration
    through the use of the EIS-specific API. The EIS include SAP, PeopleSoft, I2,
    JD Edwards, Siebel, and Oracle Applications. The technology adapters provide integration
    using standard technologies such as JDBC, JMS, database, JText for text files,
    and Web services for service integration to WebSphere Business Integration.


    For a complete list of available adapters, see:


    http://www.ibm.com/software/integration/wbadapters


    The adapters typically include an object discovery component that allows for metadata
    introspection and business object creation. Metadata introspection is the process
    of retrieving information about the data, program objects, or processes in an
    EIS.


    # 8.2 Adapter-based integration


    Integration using WebSphere Business Integration Adapters can be accomplished
    by using an integration broker or a client service to initiate requests or accept
    events from the adapter. Through the use of the adapter framework, the broker
    or client can integrate with different enterprise applications using multiple
    WebSphere Business Integration Adapters.'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Business objects are developed, and the adapter is configured to connect to
    a specific instance of the EIS. The adapter is then deployed, its service and
    operations are exposed within an integration broker or client, which then makes
    calls on the underlying EIS.


    # 8.2.1 Adapter request processing interaction pattern


    With request processing, the integration broker and clients send requests that
    use a business object to the adapter through the adapter framework. The adapter
    parses the incoming business object and makes the request specified on the EIS
    using application-specific metadata and the business object content. The adapter
    then returns the results, if any, of the call. WebSphere Business Integration
    Adapters typically perform create, update, delete, and retrieve functions using
    the verb attribute within a business object. Adapters can also execute business
    processes in an underlying EIS (for example, to calculate an order).


    Within the interaction pattern for request processing within WebSphere Integration
    Server Foundation, the BPEL process makes a request through JMS on the adapter.
    Figure 8-1 shows the components view for this interaction style.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_217_0.png)


    Figure 8-1 Request interaction pattern components view


    The adapter can process requests from a business process in two ways:


    +   - The BPEL process can send a synchronous request to the adapter, where the
    process sends a request to the adapter and waits for a response. This process
    is also referred to as the *Hub Request* interaction pattern, where the hub is
    in the executing business process. The names of the port types in the adapter
    service WSDL files reflect this pattern in naming convention.


    +   - The BPEL process can also invoke an asynchronous request on the adapter,
    where the process sends a request to the adapter without waiting for a response.
    This process is referred to as the *Hub One Way* interaction pattern.


    The WebSphere Business Integration Adapter is created as a WebSphere Application
    Service project within the WebSphere Business Integration tool and is configured
    to access the EIS with the appropriate business objects.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'project is then exported with a JMS binding service, which exposes the operations
    and business objects available for the adapter. The adapter service is then incorporated
    into a BPEL process, which makes WSIF calls to the adapter through the configured
    WebSphere MQ queue connection factory and queues.


    The adapter retrieves the request, processes the business object by parsing and
    analyzing application specific metadata, then executes the operation on the underlying
    EIS. The result is parsed and transformed into a business object and sent to the
    business process.


    # 8.2.2 Adapter event notification interaction pattern


    With event notification, the adapter sends a messages to the integration broker
    or client, signifying that a data change or process activity has happened in the
    EIS.


    There are several different mechanisms for event propagation from an EIS to the
    integration broker. The mechanism relies on a capabilities of the EIS. Mechanisms
    for event propagation include a registering for events, a service callback system,
    polling an event data store, and using triggering scripts.


    Most EIS vendors do not provide any event notification mechanism. The WebSphere
    Business Integration Adapters need to develop or include an appropriate notifying
    device to capture and express these events.


    Adapters typically use an event store located within the EIS. This event store
    is populated using a triggering mechanism that is specific to the EIS component.
    The events are retrieved from the event store and propagated to the integration
    broker or client.


    The interaction pattern for event notification within WebSphere Business Integration
    Server Foundation involves the adapter invoking a BPEL service after an event
    has happened in the EIS. Figure 8-2 on page 204 shows the components involved
    in an event notification interaction.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '![](img/5b2c9dea5bc3d31d7583d88aca94b088_219_0.png)


    Figure 8-2 Event Interaction notifications in two ways to the business process.


    The adapter can send event notifications in two ways to the business process.


    +   * The adapter can send a synchronous event delivery, where the adapter sends
    a message to the processes and expects a response. This process is also referred
    to as the Agent Request interaction pattern. The names of the port types in the
    adapter service WSDL files reflect this pattern naming convention.

    * The adapter can also do an asynchronous event delivery, where the adapter sends
    a message to the business process and does not wait for a response. This process
    is referred to as the Agent Delivery interaction pattern.


    In both scenarios MDB is used to listen for events the queue configured for event
    delivery. The adapter polls for events in the EIS retrieves the events and places
    them on the appropriate delivery queue. The event messages are retrieved from
    the queues and sent to the business process.


    # 8.2.3 Adapter object discovery


    The adapters object discovery agent (ODA) introspect metadata information from
    the EIS by either analyzing the application''s data store, business processes,
    and components or by using a metadata introspection API.


    The ODA is written using the object discovery development kit (ODK). It provides
    a set of APIs that allows for tight integration with the WebSphere Business Integration
    Object Designer Tool. The ODK also provides guidance to developers on how to develop
    an ODA.


    The ODA generally creates ready-to-use business objects, with application-specific
    metadata already in place. There is little to no customization required on the
    developers part at design time.'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'In conjunction with the Business Object Designer, the ODA can allow batch business
    object creation and special filtering, providing for an easier development path
    to integrate with the underlying EIS.


    # 8.3 Adapter-based integration building block


    The WebSphere Business Integration Adapter integration building block involves
    the adapter exposed as a service in the Business Process Container of WebSphere
    Business Integration Server Foundation. A request process is exposed as a service
    to the Stock Analysis business process.


    # 8.3.1 Scenario problem statement


    The buy scenario requires stock information, which is stored in an external EIS.
    The EIS has the information that is required. The WebSphere Integration Adapter
    for JDBC provides for the retrieval of this information from the database of the
    EIS.


    # 8.3.2 System architecture


    The WebSphere Business Integration Adapter for JDBC resides on the machine where
    the database repository is located. The system business processes makes a request
    for stock information through the system process. The context information that
    is passed within the request allows the system to route the message to the appropriate
    provider. The stock analysis business process and the system process are both
    running in WebSphere Business Integration Server Foundation on a separate machine
    and making calls on the adapter through its exposed service process.


    See Chapter 3, “Scenario overview and design” on page 65 for the system design
    view.


    # 8.3.3 Components of the building block


    The components of the adapter integration building block include:


    +   * WebSphere Business Integration Adapter Framework

    * The BPEL process, which wraps the adapter service

    * The adapter service, which exposes the adapters stock retrieval operation

    * The business object, which is used to represent the stock data

    * The critical business process, which uses this service.'
  merge: -1
  pgno: 220
- img_proc: true
  md: "# 8.4 The buy shares scenario\n\nDuring the buy shares scenario, after the\
    \ Stock Analysis service validates the stock request, a system process makes a\
    \ request to retrieve the stock information. The stock information is retrieved\
    \ from the database repository for the trading system to use in a risk and profile\
    \ evaluation.\n\n# 8.5 Developing the adapter-based EIS Developing\n\nThe artifacts\
    \ required to build this solution are the WebSphere Integration Adapter for JDBC\
    \ and the Adapter Framework. The WebSphere Business Integration System Manager\
    \ 4.2.2 is used to create the WebSphere Application Server project and the adapter\
    \ business objects. Business Process Choreographer is used to create the business\
    \ process that wraps this service. DB2, WebSphere Business Integration Server\
    \ Foundation, and WebSphere MQ 5.3 are also used.\n\nDetails of the software artifacts\
    \ and the versions that we are:\n\n+   * WebSphere Business Integration Adapter\
    \ for JDBC Version 2.5.0\n* WebSphere Business Integration Adapter Framework Version\
    \ 2.4.0\n* WebSphere Business Integration Tools\n    * WebSphere Business Integration\
    \ System Manager Version 4.2.2 installed with the Adapter Framework\n    * WebSphere\
    \ Business Integration Connector Configurator Version 4.2.2\n    * WebSphere Business\
    \ Integration Business Object Designer Version 4.2.2\n* WebSphere Studio Application\
    \ Developer Integration Edition Version 5.1.1\n* WebSphere Business Integration\
    \ Server Foundation Version 5.1\n* WebSphere MQ 5.3 CSD07\n* IBM DB2 Universal\
    \ Database™ Version 8.1.0.36\n\nThere are several steps involved in developing\
    \ the service:\n\n+   1. Installing and configuring DB2.\n2. Configuring WebSphere\
    \ MQ.\n3. Creating the business objects using the JDBC ODA.\n4. Building and exporting\
    \ the adapter project.\n5. Exposing the adapter as a service.\n6. Creating and\
    \ configuring the integrated test environment (ITE)."
  merge: -1
  pgno: 221
- img_proc: true
  md: 'The next sections explain how to create the service. In these sections, we
    refer to the JDBC adapter guide found at:


    http://publib.boulder.ibm.com/infocenter/wbihelp/index.jsp


    # 8.5.1 Installing and configuring the DB2 software


    The database that we used was IBM DB2 UDB Version 8.1.0.36.


    Table 8-1 shows the structure of the stock quote analysis data. The database name
    is STOCKSYS, and the name is StockInfo.


    Table 8-1 Structure of the stock quote analysis data


    | Column Name | Type |

    |---|---|n| Symbol | VARCHAR(4)-Not Null and Primary Key |

    | Value | VARCHAR(10) |

    | Trend | INTEGER- Default 0, valid values -1,0,1 |

    | Change | VARCHAR(10) |

    | High | VARCHAR(10) |

    | Low | VARCHAR(10) |

    | Company | VARCHAR(60) |


    # 8.5.2 Configuring WebSphere MQ queue manager and queues


    You need to create the queue manager, queues, and channels that the JDBC Adapter
    uses. You also need to create the WebSphere MQ JMS provider Connection Factory.


    +   1. Create a queue manager ITF using the WebSphere MQ Explorer.

    2. Expand the **Advanced** → **Channels** folders. Right-click **Channels** and
    choose **New** → **Server Connection Channel**. Name the channel and choose OK.

    3. Open a command line and execute the following command using the text file shown
    in Example 8-1 on page 208.


    ```

    runmqsc ITF < configure_mq.txt

    ```'
