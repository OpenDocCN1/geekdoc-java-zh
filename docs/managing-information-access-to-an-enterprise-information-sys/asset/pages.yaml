    # ## 9.1.2 Developing business processes


    You can develop BPEL-compliant business processes with WebSphere Application Developer
    Integration Edition. You then deploy the generated artifacts on the Business Process
    Container of WebSphere Business Integration Server Foundation.


    The BPEL standard includes specifications of modeling artifacts and structuring
    elements. Among others, the following artifacts are available:


    +   * Partner links that describe parties that interact with the business process


    +   * Invoke, receive, and reply activities to call services and to send and receive
    messages


    +   * Variables to hold data in the business process that is sent to and received
    from services


    +   * Sequence, flow, switch, and while elements that are used to structure the
    business process


    The Business Process Container available in WebSphere Business Integration Server
    Foundation extends the BPEL specification by providing the following additional
    features:


    +   * Staff activities that describe human interaction with the business process,
    for example approvals and data provisioning


    +   * Service bindings to call services implemented in Java or as EJBs


    +   * Java snippets to run Java code from within the business process


    The development of BPEL business processes using WebSphere Application Developer
    Integration Edition is described in detail in 9.3.2, “Developing the BPEL process”
    on page 267. For more information refer to:


    +   * WebSphere Business Integration Server Foundation V5.1 Handbook, SG24-6318'
  merge: -1
  pgno: 260
- img_proc: true
  md: '+   Using BPEL processes in WebSphere Business Integration Foundation. Business
    Process Integration and Supply Chain Solutions, SG24-6324


    # 9.1.3 Deploying and running business processes


    You must deploy the business process that is designed by arranging the BPEL elements
    into the BPEL process engine for execution. The deployment process results in
    the generation of an enterprise application (EAR module) that includes EJB modules
    and the BPEL file. You can install the generated EAR file on WebSphere Business
    Integration Server Foundation using the administration console.


    If a client application initiates a BPEL process, the WebSphere Business Process
    Container triggers and executes the business processes. The process flow is interpreted,
    the potentially distributed services are called, and state changes in the business
    process are recorded. A business process can be interrupted until an external
    event indicates that the process can be resumed.


    The abstract interface and technology binding describe the services called. If
    the internal service implementation changes, the business process is not affected.
    In case of interfaces and technology, the process model is also not affected,
    but you have to update the service definitions.


    The BPEL process engine records all state changes of business processes in its
    database. State changes typically occur after having successfully called services
    or receiving events from external applications. Processes may also call other
    processes to form a nested process model. The process engine records dependencies
    and the relationship between processes and their subprocess and provides end-to-end
    state management. Exceptions thrown in sub processes are forwarded to and handled
    in the main process to provide an integrated exception handling mechanism. Exception
    handling is to be modeled for the specific business process. The BPEL editor of
    WebSphere Studio Application Developer Integration Edition provides all of the
    required artifacts and concepts to support comprehensive exception handling, such
    as exception nodes and a compensation mechanism for undo actions.


    Sub processes may share state and data if a specific modeling artifact (block)
    is used to define the sub processes. Processes can also be split up into parallel
    processes or branches that are executed concurrently. A specific modeling artifact
    (join) ensures that the main process continues only if all the sub processes have
    successfully ended.'
