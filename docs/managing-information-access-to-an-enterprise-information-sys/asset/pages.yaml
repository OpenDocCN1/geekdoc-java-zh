    # 3.1.3 Business requirements


    The ITSO Trading Firm requires that the customer has easy-to-use, responsive,
    and customizable interactions with the Internet Trading System. The solution provided
    be an on demand operating environment that enables the company to adapt to changes,
    as well as be for growth, scalable, and resilient.


    The solution should contain components to allow different departments of the business
    to take advantage of the solution. These components also enable the software to
    be moved to different environments or even isolated if necessary. The solution
    must be standards-based, where a mature and robust enough standard exists. The
    solution should be kept allowing for the use of proposed specifications that will
    soon be standards or are going through the review processes.


