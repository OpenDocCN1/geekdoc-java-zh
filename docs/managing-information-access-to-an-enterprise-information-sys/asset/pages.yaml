  md: 'A WS-I profile includes the following deliverables:


    +   Profile specification


    The profile specification includes a list of non-proprietary Web services specifications
    at certain version levels, plus a list of clarifications and restrictions on those
    specifications to facilitate the development of interoperable Web services.


    +   Use cases and usage scenarios


    These requirements capture the business and technical requirements for the use
    of Web services. Use cases and usage scenarios reflect the classes of real-world
    requirements that support Web solutions and provide a framework to demonstrate
    the guidelines that are described in WS-I profiles.


    +   Sample applications


    These applications demonstrate the implementation of applications that are built
    from Web services usage scenarios and cases that conform to a set of profiles.
    Implementations of the same sample application on multiple platforms, using different
    languages and development tools, allow WS-I to demonstrate interoperability in
    action and to provide readily usable resources for the Web services practitioner.


    +   Testing tools


    These tools are used to monitor and analyze interactions with a Web service to
    determine whether the messages that are exchanged conform to WS-I profile guidelines.


    For more information about the WS-I, refer to:


    http://www.ws-i.org/


    # WS-Basic Profile 1.0


    WS-I has delivered its first profile of interoperable Web services called WS-Basic
    Profile 1.0. The profile focuses on the core foundation technologies upon which
    Web services are based, including HTTP, SOAP, WSDL, UDDI, XML, and XML Schema.
    Basic Profile 1.0 was unanimously approved on July 22, 2003, by the organization’s
    board of directors and members.


    The WS-I Basic Profile 1.0, Profile Specification consists of the non-proprietary
    Web services specifications:


    +   SOAP 1.1


    +   WSDL 1.1


    +   UDDI 2.0


    +   XML 1.0 (Second Edition)'
  merge: -1
  pgno: 209
- img_proc: true
