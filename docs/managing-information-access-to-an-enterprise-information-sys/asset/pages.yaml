  md: '# BPEL tool set


    Using WebSphere Studio Application Developer Integration Edition, you can assemble
    processes in a graphical tooling environment, called the BPEL process editor,
    and deploy it to a separate run-time environment that executes it.


    # Process editor


    The Process editor is a graphical programming environment that you use to visually
    create and manipulate business processes. The BPEL-based Process editor displays
    a visual representation of an instance of the Business Process Execution Language.
    It builds upon the existing functionality of the language and adds a number of
    useful extensions like Java snippets and Staff activities.


    Using the Process editor is almost like creating a new Graphical User Interface
    (GUI) panel using widgets from palette. When you create a GUI panel, you typically
    drag-and-drop your widgets onto a panel, align them, set custom properties for
    the GUI widgets, and add event handling.


    With the Process editor, you select activities from a palette which you drop onto
    a canvas. You can then set custom properties for the activities in the details
    area of your Process editor and link your activities together using control links,
    if you have a flow-based BPEL process. So, it would appear that creating a new
    business process using the Process editor is almost like creating a new GUI panel,
    using the Visual Editor for Java in WebSphere Studio Developer.


    Having a graphical view of a business processes will revolutionize the way you
    build and interact with your business process. However, you must be aware that
    there are a lot of artifacts and components generated by the Process editor, especially
    when you deploy code.


    In a multi-developer, multi-project type of environment you must consider how
    to manage, control and maintain all of the components, projects and artifacts
    being produced behind the scenes. For example, if you are working with Rational
    Clear Case and you want to generate deploy code from a process that is under the
    control of Clear Case, confirm that all of the relevant files have been checked
    out of the repository or else the generation will fail.


    The Process editor generates a lot of artifacts behind the scenes, and it also
    depends on a other artifacts from other services or business processes in other
    projects. Carefully consider how you want to approach, manage, and maintain such
    a development environment between multiple developers or multiple projects.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '**Note:** Do not get a false sense of security that the tool will do everything
    for you. Indeed, the tool does generate most (if not all in certain scenarios)
    of the artifacts, components, and projects for you.


    Rather than clients calling your business processes directly, in some situations
    you might want to add another layer of abstraction between consumers of your business
    process and the actual process. You might want to consider doing common processing
    in a service end-point, such as request and response handling, caching, security,
    adding your own custom SOAP handlers, and so on.


    Common architecture, design and implementation standards, principles , and patterns
    must be adhered to. A principle concern should be stability through interfaces.
    In a services-based architecture using Web services technologies, you should layer
    your service end-points, typically using an interaction and processing layer.
    Designing your service interface, and designing the business process (service
    implementation) requires the same effort.


    # Documentation


    The documentation is good, intuitive, easy to read and understand, and it is readily
    available. In WebSphere Studio Application Developer Integration, click **Help**
    → **Help Contents** to bring up the Information Center. Select **WebSphere Studio**
    on the left. Select **Developing** → **Processes** → **The Process editor** (BPEL).


    The online help contains detailed information explaining how to use the Process
    editor, create processes, and set attribute values in the Attributes view of the
    Process editor. It also explains concepts and describes all of the BPEL activities.
    This is an excellent source of information that you should read before developing
    your own business processes in the Process editor.'
  merge: -1
