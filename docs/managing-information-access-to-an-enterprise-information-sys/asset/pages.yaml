    # 2.2.3 Components and SOA


    One of the most important principles of SOA, and possibly the most widely misunderstood,
    is that loose coupling. Today, development productivity is no longer the one concern
    of IT management. This means either that the original software crisis has been
    fixed or that it has simply been overtaken by a new, more serious crisis — the
    crisis of adaptability. The crisis of adaptability moves the priority away from
    new development to integration and reuse. Table 2-7 and Table 2-8 on page 34 show
    the potential benefits and drawbacks of components without and with SOA.


    # Table 2-7 Components without SOA


    | Potential benefits | Potential drawbacks |

    |---|---|

    | Economics of scale achieved from reusing components. | Components are permanently
    assembled into applications. It is easier to plug-in than unplug. |

    | Software solutions are developed rapidly from existing components. | Lack of
    post implementation flexibility. |

    | Choice of different components yields some pre-implementation flexibility. |
