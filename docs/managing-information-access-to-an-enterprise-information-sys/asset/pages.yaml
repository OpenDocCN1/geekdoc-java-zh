  md: 'Suggestion: Using process modeling development tools, such as WebSphere Studio
    Application Developer Integration Edition Business Process Choreographer, it is
    possible to invoke a BPEL process directly without creating an additional service
    end-point.


    If you layer your process using a layered service end-point and a business delegate,
    you build defense into your architecture. Remember, there is defense in layers


    Using Web services, you can expose the EIS system process using SOAP/HTTP (or
    over SOAP/JMS). This structure opens up quite a few opportunities. Now, your .NET
    applications potentially call your EIS system process for their back-end system
    integration requirements!


    It makes sense for the service end-point to do request handling as close as possible
    to the service end-point, allowing you to throw a fault to any consumers that
    might not have valid requests. You do not want to pass unvalidated requests to
    your processing layer resulting in unnecessary round-trips.


    By using a business delegate between your service end-point and your business
    process, you can change the implementation of your service without having to re-factor
    your service interface or potentially the processing layer of your service end-point.


    Using the business delegate also enables you to test your business process from
    a J2SE or a J2EE application client, without calling the service end-point. At
    the same time, you can test your EIS service end-point without having to run the
    EIS system process.


