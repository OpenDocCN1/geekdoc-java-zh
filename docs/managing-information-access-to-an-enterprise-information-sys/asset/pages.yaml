  md: '# 5.3.2 System architecture


    The Internet Trading System is a JEE application component which includes BPEL
    processes that are running in the Business Process Container, JSPs, and EJB. This
    scenario concentrates on the business process that is implemented using BPEL and
    its associated system processes.


    The Internet Trading System runs in the WebSphere Business Integration Foundation
    application server space. The trading system BPEL executes requests on the CICS
    system via the J2 resource adapter. The resource adapter is configured to make
    calls to the CICS system through the CICS Transaction Gateway that is running
    on a z/OS system.


    The application is running on WebSphere Business Integration Foundation with the
    resource adapter. The CICS system is running on a z/OS platform that is internal
    to the company. Figure 5-2 shows the components of the system.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_118_0.png)


    Figure 5-2 System view of components


    The trade shares business component makes a request on the system process requesting
    the company list information. The system process makes a call on the CICS resource
    adapter exposed as a service. The GetCompanyList operation is invoked via a partner
    link in the system process, and the results are returned to the trade shares business
    process.'
  merge: -1
