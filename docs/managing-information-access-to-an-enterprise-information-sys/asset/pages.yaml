  md: '# 6.1 Message-oriented middleware and JMS


    Message-oriented middleware MOM is one of the most established areas of middleware
    software. It is an intermediary that facilitates enterprise messaging by allowing
    enterprise applications to exchange information in the form of messages across
    the network. Applications exchange messages through virtual channels known as
    destinations. When a message client sends a message, it sends the message to a
    destination, and the MOM delivers the message to applications that register to
    receive messages from that destination.


    This asynchronous communication de-couples the sender and receiver, allowing the
    applications to send and receive messages as they fit. In addition to asynchronous
    communication, MOM also provides fast, reliable, and guaranteed message delivery
    with fault tolerance, load balancing, scalability, and transactional support.
    WebSphere MQ is the message-oriented middleware product available from IBM that
    is widely used by customers for EIS integration. WebSphere MQ is the market-leading
    software product in that segment.


    MOM vendors provide application developers with APIs for sending and receiving
    messages. While a MOM vendor can use proprietary message formats and implement
    its own networking protocols to exchange messages, the basic semantics of the
    developer APIs provided by different MOMs are the same. This similarity in APIs
    makes the JMS possible.


    JMS is an API for enterprise messaging that was created by Sun Microsystems. JMS
    is not a messaging system itself. Instead, JMS is a vendor-oriented API. It is
    a set of interfaces and associated semantics that are needed by messaging clients
    to communicate with messaging systems. Just as JDBC abstracts accesses to relational
    databases, JMS abstracts accesses to MOMs and allows application developers to
    reuse the same API to access many different JMS-compliant messaging systems. Thus,
    JMS provides a common API and framework that simplifies the development of enterprise
    applications and enables the development of portable, message-based applications.


    For information, refer to the following publications:


    +   * Richard Monson-Haafel & David A. Chappell, Java Message Service. O''Reilly,
    2001, ISBN 0-595-00068-5

    * Scott Grant et. al., Professional JMS, Wrox Press, 2001, ISBN 1-861004-93-3

    * Enterprise Integration with IBM Connectors and Adapters, SG-241-22

    * WebSphere Application Server and WebSphere MQ Family Integration, SG24-6878

    * WebSphere Studio Application Developer Version 5 Programming Guide, SG24-6957'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# 6.2 Message-based EIS integration


    It has become increasingly important for applications to connect to enterprise
    information systems (EIS) because of:


    +   - The advent of Web-enabled applications, where data from disparate applications
    is assembled and presented to Web clients.

    - A trend towards business-to-business communication, where data is exchanged
    between applications that are owned by different organizations.

    - A recognition that information in various systems is interrelated and that the
    true value of information, processes, and events can be achieved only when the
    entire virtual enterprise is seen as a unified whole, instead of islands of applications.
    The value achieved through automation and integration of business processes drives
    competitive advantage.


    In these situations, it is important to reuse existing applications and their
    data with no or minimal modification regardless of whether they are legacy systems,
    newly developed applications, or vendor packages. Recognizing the importance of
    integration, EIS providers and software companies developed connectors to aid
    system integration. However, these connectors have proprietary architectures and
    implementations which present another challenge to EIS integration.


    For many years, distributed application development faced many challenges in EIS
    integrations until the emergence of MOM MOM reduces the complexity that is involved
    in integrating disparate, heterogeneous applications that span multiple operating
    systems and networking protocols. MOM achieves this by encapsulating the details
    and intricate workings of the various operating systems and network interfaces
    from the application developers. By providing API implementations that extend
    transparency across diverse platforms and networks, MOM increases the flexibility
    of an architecture and enables applications to exchange messages with other programs
    without having to know on which platform or processor the other application resides.


    Additional advantages of using MOM include:


    +   - Robustness to change on heterogeneous platforms communicate and operate
    independently through standard MOM interfaces. These interfaces allow applications
    to be maintained separately and to be replaced individually.

    - Temporally distributed


    With MOM, applications communicate asynchronously where neither the sender nor
    the receiver needs to be available at the same time. If the'
  merge: -1
  pgno: 138
- img_proc: true
  md: A fundamental concept of MOM is that communication between applications is intended
    to be asynchronous. So, when a client application sends out a message to a receiving
    application, MOM allows the client application to handle other tasks without waiting
    for a response from the receiving application. This non-blocking asynchronous
    communication de-couples application systems from one another. Thus, a failure
    in one system does not have an immediate and debilitating impact on other systems.
  merge: -1
  pgno: 139
- img_proc: true
  md: '+   Guaranteed message delivery

    When network systems are up and running, MOM delivers messages from the senders
    to the receivers as part of reliable messaging characteristics. However, network
    failure may occur or applications that need to be shut down because of unpredictable
    failure or regular system maintenance. In recognition of these situations, MOM
    provides guaranteed message delivery which ensures the intended message consumers
    receive messages as soon as network connections are established and the receiving
    application request for sent messages.


    +   Transaction support

    MOM supports transactions and is also tightly integrated with transaction services.
    When transaction services are present, they can participate in MOM transaction.


    +   One time, in-order delivery

    MOM can guarantee that each message is delivered once and only once and that messages
    are received in the order that they are sent.


    +   Message routing services

    These services allow the client application to send the message to their destination
    using least-cost routing. The administrator needs to define only the cost of each
    route, and MOM automatically calculates the most economical path for the message.
    Moreover, this routing is capable of eliminating single points of failure. Thus,
    MOM can reroute around network problems.


    +   Notification services

    Even though MOM allows messages to be sent asynchronously to free up the client
    application, in some instances, the sending application might want to be notified
    whether the message was received successfully. So, MOM also allows the sender
    to receive responses, let another application handle them, or for example, a request-reply
    mechanism can be employed by the sender to receive notification from the receiver.


    +   Scalability

    In a MOM system, system scalability can be addressed relative to anticipated messages
    volume and desired processing throughput. However, this approach only applies
    to situations where messages can be processed in any order and not first-in-first-out
    fashion. So, the number of message producers increases, processing capacity can
    be increased by adding more message consumers that monitor the message destination.
    This approach provides flexibility in operational design to allocate adequate
    hardware capacity according to processing needs.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# 6.2.2 Point-to-point integration pattern


    In a point-to-point topology, each application has a direct connection to invoke
    another application''s services. The applications and EIS systems are enabled
    to invoke remote services and to exchange messages by implementing a messaging
    adapter. The adapter has to transform the messages to a format that the receiving
    applications and systems are able to process. Alternatively, the adapter can generate
    a canonical representation of the data that has to be agreed upon across the participating
    parties.


    A domain with N being the number of applications that has a total of N*(N-1) connections.
    Figure 6-1 is an example of a point-to-point topology.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_141_0.png)


    Figure 6-1 Point-to-point topology


    As the number of applications increases, the complexity and manageability of the
