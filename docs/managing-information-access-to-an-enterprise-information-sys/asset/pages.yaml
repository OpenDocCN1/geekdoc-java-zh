    # Wrapping the JMS service in an EJB service


    The scenario requires the request to be synchronous and the results be returned
    promptly. We use a microflow for this process. The adapter service is exported
    as JMS, which simulates a synchronous implementation by requiring a send message
    on the request queue and waiting on a reply on the response queue. We wrapped
    this JMS service in an EJB service to enable the microflow to execute in a single
    transaction.'
