    # Components with SOA


    The true potential of components and SOA only really comes when you have both
    of them. With both, you have:


    +   - Components and services assembled with loose coupling and dynamic recoupling

    - Coherent service interfaces supported by flexible component-based application.

    - Service-based approach applies both inside and outside the application.

    - Scalable, flexible, on demand solutions.


    # 2.2.4 Meta-architecture


    The meta-architecture is a set of high-level decisions that strongly influenced
    the integrity and structure of the EIS system process and EIS component, but is
    not itself the structure of the overall back-end integration solution. The meta-architecture,
    through style, patterns of composition, principles, and philosophy, rules out
    certain structural choices, and guides selection decisions and trade-offs among
    others.


    # Principles


    The purpose of this meta-architecture is not to define the principles of a service
    orientation architecture style but rather to focus on the principles of the EIS
    process and component.'
