    # # Using J2EE Connector Architecture


    This chapter gives an overview of the J2EE Connector Architecture. It explains
    how a J2C Resource Adapter can participate in EIS integration scenarios. This
    chapter also describes how to use a J2C resource adapter for the CICS in our scenario.
    It explains what quality of service can be associated with using this solution
    and how to implement it.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 5.1 J2EE Connector Architecture overview


    The J2EE Connector Architecture (JCA) defines a set of standards about how a resource
    adapter provides connectivity to an EIS and how the system contracts with an application
    server.


    The set of contracts between the resource adapter and the application server provides
    services to the resource adapter and maintains a pluggable mechanism when running
    in the application server.


    There are currently two versions of the JCA specification. The JCA 1.0 specification
    includes only outbound communication and does not include life cycle management
    and work management. The JCA 1.5 specification includes inbound communication
    and the following system contracts:


    +   - Transaction management


    Involves the coordination of the application servers transaction manager and the
    EIS transaction resource managers to provide transactional functionality through
    the resource adapter.


    +   - Connection management


    Involves connection pooling and the framework for creating and managing physical
    connections to the EIS.


    +   - Life cycle management


    Involves the start and shut down functions of the resource adapter, and provides
    timely and consistent contracts for these procedures.


    +   - Work management


    Allows the resource adapter to schedule and submit work tasks with the application
    server. These work tasks can facilitate processes that involve monitoring tasks.


    +   - Security


    Provides the resource adapter with features to enable secure security using application
    server mechanisms.


    Components that want to access information from the EIS can do in two ways. They
    can use the Common Client Interface (CCI) to make requests on the EIS, which is
    referred to as an outbound communication. The component can also allow the EIS
    to make inbound calls that send information from the EIS to the component.


    The CCI provides an API that the resource adapter can implement and extend, which
    allows for clients to make remote function calls on the EIS. A client gets a connection
    to the EIS using a connection factory.'
  merge: -1
  pgno: 111
- img_proc: true
  md: 'The client uses an interaction to execute functions on the EIS. The interaction
    modes involves how the request is handled by the resource adapter and is specified
    on the InteractionSpec by stating one of the following:


    +   SYNC_SEND


    The execution only sends an input to the EIS via the resource adapter. No output
    is expected.


    +   SYNC_RECEIVE


    The execution receives a synchronous output record from the EIS.


    +   SYNC_SEND_RECEIVE


    The execution sends an input to the EIS, and a synchronous output record is expected.


    The EIS can also make calls into the application component using Enterprise JavaBeans
    (EJB) that are deployed on the application server. Inbound communication is only
    available when the application is running in a J2EE application server.


    # 5.2 EIS integration using J2C


    This section describes how to use a J2C resource adapter in various integration
    schemes. EIS-based integration typically involves a J2C resource adapter that
    is running in managed mode to take advantage of the EIS services quality of service
    functionality.


    As mentioned earlier, a resource adapter can expose its outbound functionality
    through CCI. This functionality can directly interact with the EIS. The EIS connectivity
    framework provides a facade into the EIS via the resource adapter, which provides
    de-coupling between the service provided by the J2C resource adapter and application
    services.


    The JCA 1.5 specification stipulates how inbound communication can be accomplished
    using EJB. EJB enables the EIS to make calls to the application component when
    events occur in the EIS system.


    # 5.2.1 J2C outbound integration pattern


    The outbound integration pattern involves an application component that is running
    on an application server or stand-alone Java application, which executes requests
    on the J2C resource adapter that interacts with the EIS.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'There are two basic patterns when running on an application server, one involves

    straight calls and the other involves exposing the resource adapter as a service.


    # Common Interface invocation


    The patterns when interacting from within an application server use an EJB to

    make calls on the resource adapter through CCI calls. The EJB can then be

    exposed as an Enterprise Application Integration framework within the managed

    application space, or it can be used directly. Developing a framework gains flexibility

    and potentially eases integration with other parts of the application.


    Example 5-1 shows the sample code which makes a call on a resource

    adapter.


    ```

    Example 5-1 Sample cisFactory=ServiceLocator.getConnectionFactory("eis/CICS");

    Connection conn = cisFactory.getConnection();

    Interaction spec = new EECInteractionSpec(spec);

    spec.setCommAreaLength(commAreaLength);

    spec.setTPName("TRIDB");

    FunctionName("TRADERBL");

    Interaction interaction = conn.createInteraction(spec);

    interaction.execute(spec,requestRecord, responseRecord);

    ```


    # Enterprise Application Integration framework


    The Enterprise Application Integration (EAI) framework is the implementation of

    a system process of the EIS component model that is described in the

    sections:


    +   - 2.2.2, "Architecture options" on page 30

    - 2.2.5, "Conceptual architecture" on page 37

    - 2.2.6.6, "Logical architecture" on page 47


    The EIS system process uses a session bean implementation. The EIS features

    are a Java implementation of existing functions in the EIS.


    The EAI framework interacts with the EIS through the resource adapter and is

    exposed as features that the session bean uses. This interaction creates

    flexibility and de-coupling of the EIS features that are used when integrating.

    allows for the quick reuse of existing features (for example, GetCompanyList

    is is used to retrieve a list of companies in the system). The EAI framework gives

    developers a clearly defined infrastructure on how they should add new

    features and extend the EIS access.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Service invocation


    The resource adapter can be used within the Business Process Container as a partner
    link. It can also be used in conjunction with the Web Services Gateway, providing
    for some routing and flexibility.


    When the resource adapter is exposed as a service within the Business Process
    Container, the clients make use of the Web Service Invocation Framework (WIF)
    to make requests using the binding type that was specified when the service was
    deployed.


    WSIF provides an abstract model that invokes Web services through a set of APIs
    regardless of how the service is implemented and where it can be found.


    WSIF is composed of these features:


    +   - An API, which provides binding independent access of a Web service through
    the use of an abstract model of the service.


    +   - WSIF providers, which implement support for different transports and encodings
    through the use of the dynamic port factory.


    +   - Utilities such format handlers, which support the functionality that is
    provided by the WSIF providers and the API.


    There are several binding types, including EJB, JMS, SOAP, and J2C. The WSI J2C
    binding extension provides for an easy mapping of ports, operations, and messages
    to the resource adapters connection, interaction, and records. The connector binders
    extension allows the resource adapter WSDL to specify InteractionSpec values in
    a way that is understandable. A format binding specifies what message style and
    encoding are used, mapping the data to its native format. For example, IBM CICS
    Resource Adapter, which uses COBOL copybook, has an encoding value of `ibmcobol`.


    The client looks up the port, where the resource adapter service is located and
    uses the WIFPort to create an operation that specifies the operation name as well
    as input and output message types. It creates an input object and sets the parts
    of the message. Finally, the client executes the operation.


    After the adapter service is created using the WIF J2C binding extension, it can
    then be wrapped into a service using one of the following bindings for easy access
    within the application server.


    +   - EJB binding

    - Exposes the functionality as an EJB call into the resource adapter service.'
  merge: -1
  pgno: 114
- img_proc: true
  md: '+   JMS binding

    Uses a simulated synchronous JMS system to send messages to the resource adapter''s
    service.


    When the resource adapter is exposed as a service, a client can use the IBM Web
    Services Gateway to make requests on the resource adapter.


    # IBM Web Services Gateway overview


    The IBM Web Services Gateway is a runtime infrastructure component that serves
    as a SOAP processing engine that provides configurable mappings between Web service
    providers and requesters. Services defined with WSDL can be routed to available
    transport channels and ultimately the target service. The gateway components are:


    +   Channels that define the entry-points into the gateway and carry the service
    request and response through the gateway.


    +   Filters that are used to intercept service invocations which come into the
    gateway and act upon the services.


    +   Services that are described with the help of a Web Services Description Language
    (WSDL) document.


    +   UDDI references to manage the publishing of an exposed Web service to a private
    or public UDDI registry.


    The Web Services Gateway provides the following functionality:


    +   1. Routes messages to the target destination.

    2. Provides processing for custom header tags.

    3. Provides for message level security using WS-Security.

    4. Provides for changes to the incoming protocol with a different protocol (SOAP-HTTP-JMS).


    When the resource adapter service is exposed through the IBM Web Services Gateway
    there is a mapping from the requester to the providing channels. The resource
    adapters then make a call to the EIS, returning the results through the service.
    This integration pattern enables the integration of the EIS through an ESB implementation.


    For more information about the IBM Web Service Gateway, see:


    +   WebSphere Version 5.1 Application Developer 5.1.1 Web Services Handbook, SG24-6891

    Patterns: Service-Oriented Architecture and Web Services, SG24-6303


    100 Managing Information Access to an EIS Using J2EE and Services Oriented Architecture'
