  md: 'both tools in a single environment is possible, Modeler functions are provided
    in an additional perspective of WebSphere Studio Application Developer Integration
    Environment.


    Business processes designed with Modeler V5.1 can be exported to BPEL format and
    thereafter easily imported into the BPEL development environment. Modeler V5.1
    also allows you to export the business process in UML format so that you use Rational
