    # 9.1.1 Modeling of business processes


    Line of business staff and business analysts typically model the business processes
    of an organization. They have the skills and knowledge to define and optimize
    the processes. To capture the business processes and document the business rules,
    they need tools. Often, they rely on office tools, such as text processors and
    drawing tools, to generate the business process and rules documentation.


    PAFF, however, suggests using more powerful tools. WebSphere Business Integration
    Modeler provides a comprehensive environment for business process modeling. The
    tool includes:


    +   - A visual modeling editor to create business process models.

    - A Palette of predefined modeling elements such as tasks and decision nodes.

    - Definitions of business items which are the input and output of tasks.

    - The documentation of processes and tasks by definition of resources, duration,
    and cost.

    - Analysis and query capabilities to investigate the process details.

    - Report generation to generate text and visual documentation.

    - A simulation mode to simulate the business process and to analyze the process
    dynamics.


    The first step in the modeling phase is to document the current process as it
    is and record as many data elements as possible so you can run a simulation to
    understand the bottlenecks and inefficiencies. After you have determined a baseline
    process and all stakeholders have agreed that this new process represents the
    current state, you next need to develop a new process by applying techniques to
    improve the process. Even if you intend to develop a new application and focus
    on the new process, we strongly recommend that you model the business processes
    using WebSphere Business Integration Modeler. In many environments, we have seen
    that the tool improves the communication between business analysts and IT architects.


    WebSphere Business Integration Modeler Version 5.1 is based on the Eclipse source
    tool infrastructure. Because WebSphere Application Developer Integration Edition
    is based on the same Eclipse infrastructure, seamless integration between both
    tools is provided. A combined installation of'
  merge: -1
