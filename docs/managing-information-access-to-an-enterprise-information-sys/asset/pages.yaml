    # # Security


    Security is a major consideration for multi-tier deployments. In integrating with
    back-end systems, J2EE components might use different security mechanisms and
    operate in different protection domains than the resources they access. In these
    cases, the calling can be configured to manage the authentication for the resource
    for the calling component. This form of authentication is called *container-managed
    resource manager sign on.


    The J2EE architecture also recognizes that some components require an ability
    to manage the specification of caller identity and the production of a suitable
    authenticator directly. For these applications, the J2EE architecture provides
    a means for an application component to engage in what is called *application-managed
    resource manager sign on*. Application-managed resource manager sign on is used
    when the identity is able to manipulate the authentication details as a fundamental
    aspect of the component''s functionality.


    You should ensure that access to any component that encapsulates or is provided
    by its container with a capability to sign on to another resource is secured by
    appropriate authorization rules.'
