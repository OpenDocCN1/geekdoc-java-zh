  md: '# IMService.jar


    The file contains the IMS access code generated with WebSphere Studio Application
    Developer Integration Edition. It includes:


    +   - The WSDL files including the IMS binding: Trader.wsdl, TraderIMS*.wsdl

    - The utility classes: INPUT, OUTPUT, WSIF Format Handlers

    - The proxy class to call the IMS transaction: TraderProxy.java

    - The JUnit test class to test the proxy: TraderProxyTest.java


    # TraderEISCompEAR.ear


    This file contains the TraderEISCompEJB module and utility Jars required to compile
    the module (IMSService.jar, IMService.jar). The TraderEISCompEJB module includes
    the following EJBs:


    +   - The IMS session bean: TraderIMSFeature

    - The EIS component session bean: TraderIntegration

    - The MDB that processes incoming messages and calls TraderIntegration: TraderIntegrationMDB

    - The session bean sent to the reply to clients: TraderReply


    # IMServiceEAR.ear


    This file contains the client code for the EIS component. The EJBs have been used
    to test the Trader EIS process. Later they have been included in the Trader system
    process (BPEL) to call the EIS component. The EAR includes utility JARs required
    to compile the module (IMService.jar, TraderEISCompEJB.jar) and the IMServiceEJB
    module has the following EJBs:


    +   - The session bean to create and send the JMS request to the EIS component:
    TraderIntegrationTest

    - The MDB to receive and log the reply from the EIS component: TraderReplyTest


