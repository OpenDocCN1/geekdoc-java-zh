    from the back-end transaction. However, you can potentially have one feature class
    supporting many back-end transactions or many database transactions.


    For example, you could have a JDBC feature class that performs multiple database
    transactions. While this scenario is not a problem, consider that other projects
    or developers might want to re-use some of your feature classes in their development
    efforts. If your feature class does many things, instead of one thing, chances
    are good that your feature class is not re-usable across projects or other use
    case implementations by other developers.


    As an example, decide how you would implement the following scenario. You must
    get the details of the branch or center, and you must get the description of a
    product. You need to get this data in a business process for one of your use cases.
    You can implement the feature(s) this way:


    +   - One class that performs two SQL queries

    - Two feature classes, each performing only one SQL query, one against the branch
    or center and the other against the product descriptions table


    Both implementation have benefits and drawbacks, depending on which way you look
    at it (developer role versus enterprise architect business executive). Think of
    performance versus re-use and so on.


    Be aware that you have choices when you design and implement your feature classes.
    Consider not only the standards and principles of your project, but also what
    your organization or customers'' standards and principles are, specifically considering
    re-use of components across projects and development teams.


