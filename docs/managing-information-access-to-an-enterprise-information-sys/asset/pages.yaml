- img_proc: true
  md: '![](img/5b2c9dea5bc3d31d7583d88aca94b088_178_0.png)


    Figure 6-15 Logging mechanism in complex messaging environment


    To facilitate problem determination and resolution in the complex environment,
    we recommend that you establish a common policy and procedure for logging and
    auditing of activities and exceptions. To provide a single view of all activities
    performed and messages delivered in a distributed environment, a staged log mechanism
    can be implemented. Figure 6-15 shows the environment for staged logging in a
    mixed application server and MOM environment.


    At the first stage, log messages are recorded in log data stores at the physical
    node the corresponding software component is running on. The data store can be
    a flat file, but also a database or a persistent message queue can be used to
    store the logs.


    At a second stage, log events are extracted from the log data stores of the physical
    nodes. Log events extracted can include messages that are delivered by the MOM
    infrastructure and provide detailed information about how requests have been processed
    in the application and EIS component. The extraction mechanism can be based on
    scripts running at customizable time intervals or can run continuously in parallel
    to first stage logging. The extracted'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'events can be stored in a central data warehouse. Sophisticated analysis can
    be performed on the database. For example, log events for all messages related
    to a specific application request can be combined and analyzed together.


    The main reason for introducing a staged approach rather than setting up a central
    log datastore is that log events are available on each node independent of the
    availability of the centralized log service. Particularly, detection and resolving
    of failures is still possible even if the system affected from all other infrastructure
    components.


    In WebSphere Business Integration Server Foundation the WebSphere Common Event
    Infrastructure (CEI) recently became available. WebSphere CEI is an implementation
    of a consistent, unified framework for the creation, transmission, persistence,
    and distribution of a wide range of business events, such as log and audit messages.
    CEI is based on the Common Base Event (CBE) format which was proposed as a new
    standard to the Organization for the Advancement of Structured Information Standards
    (OASIS). Although we have not attempted to include WebSphere CEI into the design
    presented in this chapter, we recommend that you evaluate its use for real environments.'
