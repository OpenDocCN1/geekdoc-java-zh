    # 7.5.3 Transactions


    One of the most important concepts in information technology is the transaction
    concept. Broadly speaking, the transaction concept is the basic capability of
    a system to execute a set of operations in an assured and safe manner.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'Computer science defines the essential properties of a transaction as:


    +   - Atomicity

    If a transaction is successful, then all the operations happen, If it is unsuccessful,
    then none of the operations happen.


    +   - Isolation

    The effects of the operations are not shared outside the transaction until it
    completes successfully.


    +   - Durability

    Once a transaction successfully completes, the changes survive failure.


    An extension of this concept is the distributed transaction, which applies to
    distributed systems. Distributed systems consist of a number of computers connected
    by a network. Such systems complicate the handling of failures of any of the components
    involved in a distributed transaction. To face this issue, the two-phase commit
    protocol was introduced. This protocol implies that holding onto the resources
    for the entire duration of transaction can reduce the concurrency in the system.
    This protocol is heavyweight and has many requirements, so even in the traditional
    transactional environments, it is a rarely achieved target.


    The network of systems that interact in SOA can be seen as another kind of distributed
    system. However, this environment is even more complex than the traditional distributed
    systems concept. A legacy distributed system is a hierarchical organization of
    systems tightly coupled, while the SOA is like an ecosystem where the parts cooperate
    in a loosely coupled manner. This environment makes it difficult to propose traditional
    atomic transactions as part of the business-to-business relationship.


    As a result of these considerations, there is not really a necessity for atomic
    transactions in an SOA world. Instead, you often have to model the business interactions
    in an asynchronous manner. For interactions that require a status change in the
    target system, you should always define an undo activity. It helps to think of
    SOA interactions as being similar to a reservation request rather than a committed
    transaction.


    # WS-Transaction


    WS-Transaction includes support for two types of transactions. It describes coordination
    types that are used with the extensible coordination framework as'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'described in WS-Coordination. Two coordination types are defined: atomic transaction
    and business activity.


    +   - Atomic transactions


    The protocols for atomic transactions handle activities that are short-lived.
    Atomic transactions are often referred to as transactions that provide a two-phase
    commit protocol. The transaction scope states that all work is completed in its
    entirety, and the result of an activity, if successful, is that all operations
    are performed. If the activity is unsuccessful, then no operations have been performed.
    Upon successful completion of an activity the results of the activity are available
    to other users.


    +   - Business activity


    The protocols for business transactions handle long-lived activities. These activities
    differ from atomic transactions in such activities can take much longer to complete.
    To minimize latency of access by other potential users of the resources used by
    the activity, the results of interim operations need to be released before the
    overall activity has completed. Thus, mechanisms for fault and compensation handling
    are introduced to reverse the effects of a completed business tasks.


    WS-Coordination is a building block used with other specifications (for example,
    WS-Coordination and WS-Security) and application-specific protocols that are able
    to accommodate a wide variety of coordination protocols that are related to the
    coordination actions of distributed applications.


    For information about the published specifications that are available, see:

    http://ibm.com/developerworks/library/specification/ws-tx/


    # WS-Coordination


    WS-Coordination is a general purpose and extensible framework that provides protocols
    to coordinate the actions of distributed transactions. The framework enables an
    application service to create a context that is needed to propagate an activity
    to other services and to register for coordination protocols. The framework also
    enables existing transaction processing, workflow, and other systems to hide their
    proprietary protocols and to operate in a heterogeneous environment. It can be
    used with message sequencing and state machine synchronization.


    For information about the published specification that is available, see:

    http://ibm.com/developerworks/library/specification/ws-tx/'
  merge: -1
  pgno: 206
- img_proc: true
  md: '# Conclusions


    There are no products that implement WS-Transaction as it is currently defined.

    Nevertheless, WebSphere Business Integration Server Foundation implements Compensation,
    which is the mechanism at the basis of a business activity as it is defined by
    the WS-Transaction specification.


    At this time, we can combine the use of the compensation with a carefully designed
    business process to solve the almost all the business requirements of a business-to-business
    interaction.


    In a scenario of EIS integration, the lack of a two-phase commit protocol can
    be an important issue. However, before you exclude a Web services solution, consider
    the following:


    +   - It is possible to implement application logic that works around the lack
    of a two-phase commit.

    - WS-Transaction will be available soon.


    For further information about process choreography, see Patterns: Serial and Parallel
    Processes for Process Choreography and Workflow, SG24-6306.


    # 7.5.4 Manageability


    Every time you offer a service, you need to control it. You need the following
    management capabilities:


    +   - Discover the service existence

    - Test the service availability

    - Monitor and tune performance

    - Audit the service usage

    - Modify the service configuration


    Web services are not just another API. If you must entrust your business to this
    technology, you need a stable and proven middleware to run it. WebSphere Application
    Server and WebSphere Business Integration Server Foundation offer tools to address
    Web services manageability, including:


    +   - The private UDDI registry, provides a way to publish and discover information
    about Web services.

    - The Web Services Gateway, which handles Web service invocations between Internet
    and intranet environments.

    - The Performance Monitoring Infrastructure (PMI), which collects data from the
    run-time. Tivoli Performance Viewer then visualizes the data and gives hints on
    how to optimize the configuration.'
  merge: -1
