    # 6.3.1 Problem statement


    In many organizations, EIS systems are still the core component of the IT infrastructure.
    New applications that are built to support emerging business domains have to make
    use of those systems, because the core business processes and business rules are
    implemented. For example, Internet banking that is supported by Web browsers was
    an emerging business domain for all banks in the past. However, the core banking
    processes, such as account credit or debit domains, are still processed in the
    EIS systems.


    The emerging business domains in many organizations have become large, independent
    divisions. Internet banking is for many banks now a separate channel with its
    own management structure, marketing, and IT departments. In addition to the structural
    independence of the new business domains, often the new business unit is in a
    different location to the traditional business units. Large organizations tend
    to smaller, more flexible emerging companies rather than building up the new business
    domains within their organization.


    The application required to integrate with the EIS system and the EIS system itself
    are not controlled by the same organizational unit of the company. Thus, in most
    cases, there is no common approach for software development, and more specifically,
    no common methodology and best practices for data modeling. If Methodologies have
    been established, they are usually different. Many EIS systems have a proprietary
    data modeling method, or even rely on a specific data model. New applications
    are designed using object-oriented technology and standards such as UML. The lack
    of a coherent data model imposes the need for extensive data transformations if
    new business applications and EIS systems must communicate.


    New business applications and EIS applications are often deployed in geographically
    remote processing centers. Although consolidation of data centers is important
    for many organizations, these activities often fail or are delayed due organizational
    independence of business units. In most cases, however, business units share a
    private network. Virtual Private Networks (VPN) might have been established, or
    organizations can lease dedicated connections from network providers to connect
    to their sites.


    In addition to this business level requirements, there are a number of technical
    requirements on the EIS integration style. From an application design perspective,
    most important are two: non-blocking calls to the external systems and abstraction
    of the location of the external systems.'
