    Typically, JMS providers have to be installed and configured on the hosts in a
    network. Hosts, network and MOM together built up the messaging infrastructure.
    For the applications running on the hosts to send messages to applications and
    EIS systems on different hosts, the MOM connections have the hosts to be established.
    WebSphere MQ uses the notation of queue managers, channels, and clusters that
    are the basic elements to set up the messaging infrastructure. A queue manager
    is the endpoint and the control process of the messaging infrastructure on the
    host. A channel is a dedicated messaging connection between two hosts. A cluster
    is a set of queue managers and queues that build a specific administrative domain.


    Having set and configured these elements, can have different paths to route a
    message from its sender to its receiver. 6-3 on page 130 illustrates this setup
