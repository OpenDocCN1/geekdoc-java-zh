    A message that is sent by an application is supposed to be delivered at the receiver
    despite systems and network outages. The MOM must guarantee the delivery of the
    messages. For many MOM implementations, delivery is ensured by two mechanisms:


    +   - Transactional send and receive

    - Persistent message queues


    Messages are typically put on the queues in and from the MOM, or in case of the
