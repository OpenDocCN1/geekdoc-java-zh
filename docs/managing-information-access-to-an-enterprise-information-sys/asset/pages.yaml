    +   - The business does not justify a private network.

    - There is a need to exchange information with a remote partner.

    - The service request does not have a side effect on the remote system (basic
    inquiry).

    - The service request triggers a remote transaction; however, that transaction
    can be isolated by a local one.

    - There is a need for quick implementation.


    Web services technology can provide answers to each of these requirements.


    #  7.2.2 Expose the EIS


    In all organizations, it is common to find a great variety of software platforms
    provided by different software vendors. In addition to mainframe solutions, there
    are many vertical solutions for ERP, eCommerce, Office Automation, CRM, and so
    on. There is also horizontal application technology for client and server computing
    such as J2EE application servers and Microsoft.Net Niche technology (for example
    PHP, Perl, Python, and Borland Delphi) can also be used.


    To make this different software work together, there are two options:


    +   - Create an ad-hoc point-to-point translator.

    - Modify all the components to speak a common language.


    The first option leads potentially to the implementation of (n-1)! translator.
    The second option, in the worst case, leads to the implementation of n translator.
    In the recent years, many software vendors have provided Web services implementation.
    The choice to use the Web services as a common language is one of the least expensive
    and most viable options.


    Many EIS solution do not offer Web services interfaces, or if they do offer an
    interface, it lacks in terms of features. So, we suggest that you wrap


    170 Managing Information Access to an EIS Using J2EE and Services Oriented Architecture'
