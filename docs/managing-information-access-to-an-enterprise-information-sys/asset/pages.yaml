    # 9.3.3 Deploying BPEL processes


    When WebSphere Studio Application Developer Integration Edition generates deploy
    code, an EJB module including the BPEL process and a number of other artifacts
    are created. The EJB module is added to an Enterprise Application archive. To
    run and debug the BPEL process, you must install this Enterprise Application archive
    on a WebSphere Business Integration Server Foundation test server.


    You can configure a test server in WebSphere Studio Application Developer Integration
    Edition from the server perspective.


    +   1. In the Server Configuration view, right-click and select New → Server Configuration.


    +   2. Enter a name for the server and select Integration Test Environment as
    the server type.


    +   3. Add the Enterprise Application, including the BPEL process, to the server
    by right-clicking the server and selecting Add and remove projects.


    +   4. Deploy the applications to the server by selecting Publish.


    To run the BPEL process in the test environment of WebSphere Application Developer
    Integration Edition, no specific configuration of the server is required. If you
    deploy interruptible, long-running processes, select Create tables and data sources
    before you start the server. For long-running processes, entity beans are needed
    that require definition and setup of database tables and the configuration of
    a DataSource. You can create process instances using the business process Web
    client. Start the client by selecting Launch Business Process Web Client.


    If you wish to deploy and run the processes using a standalone WebSphere Business
    Integration Server Foundation installation, configuration and setup of the process
    engine is required.


    # 9.4 Qualities of service for business processes


    This section focuses on non-functional requirements. Non-functional requirements
    such as security and high-availability have been described for the'
  merge: -1
