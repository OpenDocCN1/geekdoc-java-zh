    #  5.4.5 Quality of service for J2C resource adapters


    There are inherent qualities of service made available when the CICS resource
    adapter is wrapped into the BPEL process. These services allow for staff activities,
    transactions, and flexibility. There are other qualities of service that comes
    from the J2C resource adapter and from leveraging the application server functions.
    This section briefly discusses a few of these quality features.


    # Transactions


    The application server provides transaction management to the resource adapter.
    The applications server''s transaction management and the architecture contracts
    define how transactions should be performed when a resource adapter is running
    in managed mode. The transaction manager coordinates transactions from the application
    component and the resource adapter to the underlying enterprise system. It allows
    for easier integration with two-phase commit transactions and multiple resource
    managers.


    To provide transactions when interfacing with a CICS system, depending on the
    environment and deployment scenario, use of the CICS ECI resource adapter and
    the CTG are required. Support for global transactions is available when the resource
    adapter is running on WebSphere Application Server for z/OS and'
