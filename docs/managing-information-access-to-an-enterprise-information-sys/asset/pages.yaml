- img_proc: true
  md: 'The levels of EIS integration should not be seen as levels of maturity or technical
    capabilities of any particular organization. The levels illustrate the different
    styles for EIS integration and set the scene for the architecture that we propose
    in this redbook.


    Table 2-1 gives a description for the logical layers that the diagrams in this
    redbook use.


    Table 2-1 EIS architecture layer descriptions


    | Layer | Description |

    | --- | --- |

    | Application | Represents the business-facing solution which consumes services
    from one or more providers and integrates those solutions into the application-
    or channel-specific business processes or presentations. |

    | Process | Where enterprise business processes are exposed as services that can
    be used by applications or other enterprise business processes. Enterprise processes
    are exposed using a service-based architecture style. The process layer can contain:

    - Enterprise business processes

    - Create and maintain customer

    - Buy and sell stock

    - And so on

    - System processes

    - EIS connectivity process

    - Security service

    - Utility processes |

    | Components | The various components that support the implemented processes,
    the business objects, and their implementations. |

    | EIS | Back-end data processing or transactions systems. |


    # Level 1, application to EIS


    Before the J2C specification was created many project teams using the Common Connector
    Framework (CCF) from IBM to integrate with back-end systems. In some instances,
    developers created their own legacy frameworks using sockets and proprietary protocols
    between their applications and a corporate back-end system.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'This level of integration is typically where the application layer integrates
    directly with a back-end system. An application in this context could be a Swing-based
    J2SE application running on a desktop or a Web-based application running in a
    Web application server. It can be argued that the integration is using a component.
    For example, it could use a managed or non-managed J2C connector component. In
    this case, why does the level 1 line on page 13 not connect to the component layer?
    With a level 1 integration style, the component (be it a CCF or J2C component)
    is part of the application, either explicitly or implicitly. An application could
    use a component for its back-end integration requirements, but that is part of
    the application.


    Table 2-2 lists the benefits and drawbacks of EIS integration at level 1.


    Table 2-2 Benefits and drawbacks of EIS integration at level 1


    | Benefits | Drawbacks |

    |---|---|

    | The development team can extend or re-factor the implementation requirements
    (for example, compressing records over the WAN). | Implementation is open to everyone
    in the team. |

    | There is direct control over security aspects. | There are few incentives to
    formalize interfaces.

    | | Component reuse across channels is implemented by copy and paste.

    | | Reuse of enterprise processes is difficult to achieve. There is a strong possibility
    that different channels are implemented to different back-integration frameworks.
    |


    # Level 2, application to J2C component and service


    This level of back-end integration is where an application starts to use a J2C
    component that has been exposed as a service that is using Web services technology.
    An example of such a level of integration is where you expose your back-end transactions
    as services, using J2C connectors. (See Chapter 3: Building CICS ECI enterprise
    services in the IBM Redbook WebSphere Studio Application Developer Edition V5,
    SG24-6200 for detailed step-by-step instructions on how to create a service from
    a J2C connector.)'
  merge: -1
