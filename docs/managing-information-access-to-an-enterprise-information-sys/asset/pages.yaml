  md: '# BPEL technology


    If you have been implementing message flows in WebSphere Business Integration
    Message Broker or process flows in WebSphere Business Integration Workflow, then
    you are probably familiar with a lot of the concepts of BPEL technology.


    > Definition: BPEL is an XML-based language for describing a flow of messages
    across a set of services. Example:

    - First send A to service A

    - Then wait until you receive message B from service B

    - Then transform message B into service C

    - Then send C in parallel to service D and Service F


    BPEL aims to provide a language that formally specifies business processes based
    on Web services, extending the Web services interaction model to support business
    processes. IBM has extended the standard BPEL specification (sometimes referred
    to as BPEL+) to support Java snippet and Staff activities.


    Using a services-based architecture style, we exposed our components and business
    processes using Web technologies. We created composite applications by using (or
    rather reusing) services. BPEL is crucial for business process interoperability
    across Web services. Running business processes over Web services is crucial for
    enterprise adoption of Web Services.


    BPEL is best suited to provide the standards-based solution that addresses only
    business process representation and execution but also the sharing of business
    processes across disparate systems. Business processes specified in BPEL are fully
    executable and they are portable between BPEL compliant environments. A BPEL business
    process interoperates with the Web services of its partners, whether these Web
    services are realized based BPEL.


    BPEL is based on XML and WSDL, WSDL offers a very flexible binding framework.
    SOAP over HTTP is only one binding. Other bindings allow developers to reach out
    to EJB/RMI components, JMS destinations or Java objects without any performance
    degradation. The only constraint is that the input and output parameters have
    to be describable using XML schema. However, this is a very good constraint because
    it creates an important abstraction that allows for better tooling.


    For additional information about the specification, you can refer to the Business
    Process Execution Language for Web Services Version 1.1 at:


    ```

    http://ibm.com/developerworks/library/ws-bpel/

    ```'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# Summary


    At the time of writing this Redbook, the team used WebSphere Studio Application
    Developer Integration Edition Version: 5.1.0 Build id: 20040319_0845 for creating
    and testing our BPEL processes in the Process editor.


    The Process editor tool is easy to use, if you understand the key concepts. Some
    of the key concepts you must be familiar with are:


    +   - Flow- versus sequence-based BPEL processes

    - Which activities are available, when, where, how, and why you would use each
    activity

    - Transactions and compensation handling

    - Correlation sets

    - Partner links

    - Variables

    - Exception handling

    - WSIF: if you want to invoke your business processes using the BusinessProcess
    or LocalBusinessProcess session bean


    You have the ability to debug your BPEL processes, but at the time of writing
    of this book, the debugger performance was slow. It was quite a time consuming
    process to trace a BPEL business process.


    We expect that BPEL will continue to move forward and serve as the primary foundational
    technology for executable business process descriptions. We also expect that BPEL
    runtime environments and tools will move forward to provide a efficient, effective,
    stable, and performant environment for business process implementations.'
  merge: -1
  pgno: 311
