  md: '# 9.1 Managing business processes


    An SOA typically includes a business process management solution as its main building
    block. From a business perspective, the business processes are the procedures
    and rules that describe how the organization runs its business. From an IT perspective,
    a business process is the function of an IT application that supports users in
    completing a business-related task.


    In SOA, an IT business process calls services that are provided by components
    and applications which are enabled for the SOA infrastructure. Implementation
    of a business process management solution comprises all activities that are required
    to capture, design, develop, and run the business processes of an organization
    on the IT infrastructure.


    Organizations have historically focused on departmental efficiency and common
    infrastructural concerns, as implementing EIS systems for reporting and supply
    chain management. However, in today''s competitive world, the opportunity for
    differentiation lies in quick and efficient integration and automation of horizontal
    business processes. Often, business process efficiency cannot be achieved solely
    by purchasing packaged applications. The need for customization has lead to a
    series of home-grown applications that are integrated but both inefficient and
    expensive to maintain.


    Enablement of the applications for an SOA and implementation of the business process
    in a dedicated business process management layer is the preferred solution for
    the optimization and integration problem. Successful organizations not only optimize
    and automate business processes, they achieve integration across these business
    processes, monitor them in execution, and provide real-time feedback to improve
    business processes in light of changes to their customers'' needs.


    The key to improving and streamlining the business processes of an organization
    is bridging the business-technology gap through better communication between the
    stakeholders in the enterprise. More effective and timely coordination between
    ideas and execution is needed, all focusing on improvement results. The Process
    and Activity Flow and Framework (PAFF) provided by IBM is an approach that focuses
    on serving the business by tight alignment of business and technology.


    One of the biggest chasms in an organization is the chase between business and
    technology. Different stakeholders in an organization need a common way to communicate
    and reduce the gap between business and technology. Line of business staff are
    concerned with understanding the business processes, including the costs, cycle
    times, resources, and bottlenecks in a process. Business analysts want to know
    which changes will yield the greatest return.'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'what the return on investment will yield, and how the changes will positively
    benefit the company. The IT group needs to understand the system requirements
    that are required to support the suggested improvements in the business process
    and should be able to accurately and quickly implement the process changes to
    meet the needs of the business. The key is to make seamless transitions between
    these stakeholders, from strategy to execution, while keeping an eye on the value
    proposition.


    Cod knowledge without needing to rekey, exporting data from simulated processes
    into financial spreadsheets, and moving from logical blueprints into physical
    assets are key attributes providing benefits to the business and IT community.
    The PAFF software tools allow for dynamic generation of workflow as well as architectural
