  md: 'In a distributed computing system, a significant amount of information is transmitted
    through networks in the form of messages. Message content is subject to three
    main types of attacks. Messages might be:


    +   - Intercepted and modified for the purpose of changing the affects they have
    on their recipients.

    - Captured and reused one or more times for the benefit of another party.

    - Monitored by an eavesdropper in an effort to capture information that would
    not be available.


    You can minimize such attacks by using integrity and confidentiality mechanisms.


    > Note: Message Driven Beans do not receive the security identity of the producer
    sends the message, because there is no standard to stick security information
    into a Java Message (JMS) message. Therefore, you cannot perform Enterprise JavaBeans
    (EJB) security operations with Message Driven Beans.


