    is done by configuration (for example, in the administration console of the J2EE
    application server). Optionally, you can provide multiple methods at the message
    bean that are specific for a destination, request type, or message type you intend
    to send.


    MDB should be used for receiving messages. The interface specification for MDB
    includes an onMessage method that is called by the EJB container. The onMessage
    typically only includes the mapping of the message content to a specific request
    or reply object. A separate session bean should be called for further processing
    of the message that runs the business logic. The use of MDBs may require the configuration
    of resources in the application server and the EJB container. For WebSphere Application
    Server listeners have to be set up to map queues or topics to the corresponding
    MDB that is supposed to receive the message.


    We recommend that you define the message type according to the data model of the
    application, meaning that business objects may be passed via the MOM infrastructure
    to the JMS connector on the EIS host. Various alternatives are available. For
    example, JMS provides a map-type format using name-value pairs. Also, an XML message
    type can be selected. Another option is the definition of generalized business
    objects that include a hierarchical structure of attributes of name-value pairs.


    In context of the EIS integration architecture and design that we presented in
    the previous chapters, the sender and the receiver of messages is a business process.
    The business process either can be business related (enterprise or critical business
    process) or can be of more technical nature (system process). The process is implemented
    using BPEL technology and runs on a J2EE application server that supports deployment
    and execution of the BPEL processes. For the business process, sending and receiving
    messages means invoking services. Figure 6-4 on page 133 illustrates the system
