    # 2.4 Architecture validation


    A bad "architecture" can have the following characteristics:


    +   - Monolithic, so even small changes are distributed through code and cause
    unpredictable results with long compile, link, and debug cycles times

    - Hidden implicit coupling in code

    - Multiple and inconsistent ways of doing the same thing

    - Not documented and so a high learning curve


    What is the criteria that you should use to validate an architecture? Table 2-10
    lists some suggestions by Dana Bredemeyer (see http://www.bredemeyer.com).


    Table 2-10 Architecture validation


    | Architecture validation | Description |

    | --- | --- |

    | Good | Technically sound and clearly represented. A good architecture solves
    the problem it solves well, but it does not necessarily solve the right problem.
    |

    | Right | Meets the needs and objectives of stakeholders and the system. A right
    architecture is one that enables the development organization to implement the
    current business strategy and to evolve to keep pace with changes in business
    strategy. |

    | Successful | The architecture was actually used in designing and developing
    the system. |'
