  md: '+   For the EIS component session beans, the transaction type of the methods
    has to be set correctly (Supports, Required).


    +   The JCA IMS connector supports XA transactions out-of-the-box but ensures
    that the IMS connect and IMS subsystem on the zSeries host are enabled to participate
    in a XA transaction.


    If a confirmation message is required for the calling business process, the sender
    bean creates and puts the message on the reply queue also has to be enabled to
    participate in the transaction by setting the appropriate transaction type.


    In case of failures and system outages, the WebSphere transaction coordinator
    rolls the back and the message is not deleted from the WebSphere MQ file. If WebSphere
    itself fails while a transaction is in-flight, the transaction continues as soon
    as the application server recovers. The IMS Connect and the IMS system, however,
    do not always rollback or recover the transactions correctly. We have encountered
    situations where manual interaction on the IMS side was required if transactions
    failed.


    To be able to resolve these issues, detailed information about the messages received
    and processed in the EIS component is needed. Therefore, a powerful and reliable
    logging and audit mechanism across the application server and messaging infrastructure
    is useful. We discuss this requirement in 6.5.2, "Problem determination and resolution"
    on page 162.


    # 6.5.2 Problem determination and resolution


    WebSphere Application Server and WebSphere MQ log relevant events and exceptions
    in log files on the hosts. We also recommend that all application artifacts, such
    as business processes and EJBs log activities, messages, and exceptions, generate
    log events or log messages. To detect the probable cause for failures, the WebSphere
    Administrative Console provides functions to visualize and analyze the log files.


    The WebSphere Administrative Console provides the single entry point to a WebSphere
    cluster. For the integration building block using JMS, however, the application
    host and the EIS host typically belong to separate WebSphere clusters. Problem
    detection and resolution can become cumbersome if many different log files on
    separate hosts have to be checked.'
