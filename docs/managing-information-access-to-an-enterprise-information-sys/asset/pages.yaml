  md: '# Error handling services and reporting


    Because Web services are not immune from errors, you must decide how to throw
    or otherwise handle exceptions or errors that occur. You need to address such
    issues as whether to throw service-specific exceptions or whether to let the underlying
    system-specific exceptions. You must also formulate a plan for recovering from
    exceptions in those situations that require recovery. Just like Java or J2EE application,
    an EIS service may encounter an error while processing a client request. The EIS
    service needs to properly catch any exceptions thrown by an error condition and
    propagate these exceptions.


    With a J2EE or Java application that is not a Web service or BPEL process, you
    can propagate exceptions up the call stack until reaching a method with an exception
    handler that handles the type of exception thrown. You can continue to throw exceptions
    up the entire stack trace. You can also write exceptions that extend or inherit
    other exceptions. However, the EIS service and BPEL process have additional constraints
    that impact the design of the EIS system service.


    Consider the following when designing your error reporting and exception handlers:


    +   - Wrap application-specific errors and exceptions into meaningful service-specific
    exceptions and throw these service-specific exceptions to the clients.


    +   - Exception inheritances are lost when you throw a service-specific exception.


    +   - The exception stack trace is not passed to the client.


    +   - The EIS system process must have an exception handler to log system and
    application specific errors and to return a meaningful fault to consuming business
    processes and applications.'
  merge: -1
