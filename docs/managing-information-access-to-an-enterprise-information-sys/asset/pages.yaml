  md: 'In the scenario (described in Chapter 3, "Scenario overview and design" on
    page 65), we introduced Web services technology because the relationship between
    the bank and the stock analyst firm is changeable and cannot justify the implementation
    of a private communication infrastructure. The bank wants to provide a new service
