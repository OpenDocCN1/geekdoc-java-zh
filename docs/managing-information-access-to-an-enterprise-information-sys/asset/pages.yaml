- img_proc: true
  md: 'Any application can invoke J2C service using its generated proxies and stubs.
    With a back-end integration at level 2, the focus is on exposing EIS integration
    components as services, using Web services technology in a service-based architecture.
    With a level 2 EIS integration, the EIS component and service is not part of the
    application or business process.


    Table 2-3 lists the benefits and drawbacks of EIS integration at level 2.


    Table 2-3 Benefits and drawbacks of EIS integration at level 2

    | Benefits | Drawbacks |

    | :--- | :--- |

    | There is a separation of provider and consumer. | Services that are remote to
    consumers can impact service agreements. |

    | The implementation is hidden from the consumer. | There is versioning and testing
    across multiple channels. |

    | Interfaces must be formalized. | Services that are a direct reflection of an
    existing interface may not be sufficiently abstracted away from the implementation
    to provide any real notion of loose coupling. |

    | You can reuse services across channels, not components by copy and paste. |
    It can require a high level of understanding of the implementation for service
    consumer to correctly use the service. |

    | It enables loose coupling, at least in a platform dependency sense. | The granularity
    of the existing interface may not match the new requirements. |

    | | Taxonomy and semantic issues must be resolved.


    # Level 3, application to EIS system process


    The next level of back-end integration is where an application invokes a business
    process, or rather a system process, to handle its back-end integration. Figure
    2-2 on page 17 illustrates a more detailed view of this level of EIS integration.'
