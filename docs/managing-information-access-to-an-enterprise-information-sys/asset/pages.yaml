    # Web services


    The W3C Web Services Architecture Working Group has provided the following definition
    for Web services:


    +   - A Web service is a software application identified by a URI, whose interfaces
    and bindings are capable of being defined, described, and discovered as XML artifacts.
    A Web service supports direct interactions with other software agents using XML-based
    messages exchanged via internet-based protocols.


    The primary technologies that make up Web services consist of:


    +   - Extensible Markup Language (XML)

    - A specification developed by W3C that provides a generic language for describing
    content in a structured way to facilitate data interchange between computer applications.


    +   - SOAP

    - A XML-based protocol that is used to facilitate exchange of information in a
    decentralized, distributed environment. It is used in combination with a variety
    of other standard Internet technologies such as SMTP, HTTP, and FTP.


    +   - Web Service Description Language (WSDL)

    - A XML-based language that provides a standardized way of describing the interface
    of a Web service.


    +   - Universal Description, Discovery, and Integration (UDDI)

    - A worldwide registry of Web services to facilitate advertisement, discovery
    and integration.


    The following is a list of key characteristics of Web services:


    +   - Web services are language independent and interoperable.

    - The core technologies of Web services, as XML, SOAP, WSDL, and UDDI , are built
    using open source projects, promoting vendor independence and interoperability.
    In addition, the use of technologies allows the service provider and service requester
    to communicate without knowing the platforms and languages that the other is using.
    This language and turn facilitates interoperability.


    +   - Web services are loosely coupled

    - Traditionally, application design depended on tight connections at both ends.
    In Web services, a consumer of a Web service is not tied to the service provider.
    Instead, the service provider can change its interface over'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'time without compromising the consumer''s ability to interact with the service.
    This results in a loosely coupled system, allowing a more flexible re-configuration
    for an integration of the services in question as well as ease of maintaining
    software systems.


    +   Web services can be composable.


    Simple Web services can be aggregated to form complex Web services through workflow
    techniques or by invoking lower-layer Web services from a Web service implementation.
    This composition is made possible and easier because Web services are modular,
    coarse-grained units.


    # BPEL4WS


    BPEL4WS is the notation for Business Process Execution Language for Web Services
    (BPEL4WS). It was first specified in July 2002 by BEA, IBM, Microsoft®, SAP, and
    Siebel to combine XLANG and WSFL, approaches that were described previously by
    Microsoft and IBM respectively. BPEL4WS aims to provide a language that formally
    specifies business processes that are based on Web services, extending the Web
    services interaction model to support business processes.


    At the time of this writing, the latest release of the version is 1.1, which was
    submitted to the OASIS standards group in May 2003. A copy of the standard is
    available at:


    ```

    http://www.ibm.com/developerworks/webservices/library/ws-bpel/

    ```


    Support for BPEL4WS at the time of this writing is emerging in some products and
    technology previews. IBM provides BPWS4J as a runtime engine for WebSphere Application
    Server and Apache Tomcat. The BPWS4J toolkit also includes a development tool
    which can be downloaded from:


    ```

    http://www.alphaworks.com/tech/bpws4j

    ```


    # JCA


    J2EE Connector Adapter (JCA) is part of the J2EE 1.3 specification. It defines
    an open, portable standard that allows JCA access to resources in diverse, heterogeneous
    EIS systems. These EIS systems include Enterprise Resource Planning (ERP), mainframe
    transaction processing systems (such as IBM CICS), non-relational databases, and
    legacy applications. JCA achieves this by providing a set of Java interfaces that
    are scalable and secure and provide transactional support.


    From the EIS vendors'' perspective, the JCA allows an EIS vendor to provide a
    standard resource adapter for its EIS. This resource adapter plugs into an J2EE
    application server to provide connectivity between the J2EE application running
    on the server and the target EIS systems. So,'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'JCA-compliant application vendor is assured of seamless connectivity to multiple
    systems.


    # WebSphere Business Integration Adapters


    WebSphere Business Integration Adapters facilitate application integration to
    different legacy applications, technologies, and mainframes through one consistent
    approach. These adapters allow heterogeneous business applications to exchange
    data over an integration broker such as WebSphere Integration Message Broker or
    WebSphere Integration Server Foundation.


    The WebSphere Business Integration Adapters are built using a common adapter framework
    and generally have the following characteristics:


    +   * Bi-directional

    * Configurable through metadata

    * Reusable infrastructure component

    * Supports multi-threaded business object processing


    You can find more information about these characteristics in the IBM redbook,
    Patterns: Implementing SOA Using An Enterprise Service Bus, SG24-6346. For a complete
    and current list of WebSphere® Business Integration Adapters,


    http://www.ibm.com/software/integration/wbiadapters


    # JMS


    Messaging oriented middleware (MOM) is a popular choice for integrating applications
    with existing enterprise information systems. So, MOM vendors provide application
    developers with APIs to perform this integration. These APIs are vendor specific
    and hence are proprietary. However, while a MOM vendor may use proprietary message
    formats and implements its own networking protocols to exchange messages, the
    basics of the developer APIs provided by different MOMs are the same. This similarity
    in APIs makes the JMS possible.


    JMS is an API for enterprise messaging created by Sun Microsystems. The purpose
    is to provide a standard, open and portable way for Java based applications to
    access messaging middleware. The use of JMS in EIS integration is described in
    a later section.


    # Business Process Container


    The Business Process Container, also known as the Business Process Choreographer,
    is a business-process engine in WebSphere Business Integration Server Foundation.
    It is used to choreograph all kinds of business'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'processes and provides efficient execution of both short-running and long-running
    processes.


    The business processes that are implemented in an enterprise typically require
    a mixture of human and IT resources. The types of business processes can vary
    greatly, ranging from Web services navigation to business transaction support.
    Business processes can be automatic, recoverable processes or processes that require
    human interaction. With Business Process Container, you can combine business process
    technology with any other service offered by the open JEE architecture.


    # J2SE


    Some of the J2EE purists will probably question why J2SE can be a possible implementation
    option, or indeed, why should it even considered?


    Consider for a moment deployment environment where applications and business processes
    execute at a remote branch or retail site to cater for offline scenarios. Typically,
    in these kinds of deployment architectures, you find that the presentation, application,
    process, and component layers are deployed to every site. (See Table 2-1 on page
    14 for architecture layer descriptions.)


    Depending on the number of remote sites (and of course the IT budget of your organization),
    you sometimes find that these type of deployment scenarios do not have a fully
    compliant J2EE application server processing their applications at every remote
    site. Sometimes, you find a lightweight application server with only a Web connector
    to process J2 Servlets or JSP, or you find only J2SE running in remote sites.


    Maintaining and supporting hundreds of application server installations across
    a country, or even across the globe, can be very costly and difficult to maintain.
    Some remote sites in rural areas might have to support only one to two users,
    and if offline processing is important for your business, deploying full J2EE-compliant
    application servers to all of these sites might be very expensive, again, depending
    your organizations IT budget.


    Plain Old Java Objects (POJOs) can be used to implement this architecture. You
    do not have to use a J2EC connector in a managed environment, nor do you have
    to use an application server''s pooling services, and so. Of course, you would
    probably have to develop most of the quality of services (QoS) that an application
    server provides to your applications yourself. You would have to develop services
    such as connection pooling, transaction management, security, multi-threaded access,
    object pooling, and so on by yourself, as well as a component and execution architecture
    for your application(s) executing in remote sites.'
