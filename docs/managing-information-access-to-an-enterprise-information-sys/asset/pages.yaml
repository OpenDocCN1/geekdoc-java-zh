    frequently. Refer to the WebSphere Studio Application Developer Integration Help
    for more details (search for batch import).


    IMS transactions often return multi-segmented messages which means that they return
    a byte stream with variable length and data structures. The WebSphere Studio Application
    Developer Integration tools cannot generate the WSIF format handlers and helper
    classes for multi-segmented messages. A workaround is to generate helper classes
    for the different segments by using an artificial operation that returns each
    segment. The segment data type can be selected from the COBOL copybook for that
    transaction. Having created the WSIF format handlers for the segments, development
    of code to parse the byte stream returned by the IMS transaction is facilitated.


