    \ enterprise service. The next sections discuss the two major architecture elements\
    \ of the structural view.\n\n# EIS system process\n\nThe major architectural elements\
    \ of the EIS system process include:\n\n+   - EIS system process executes in the\
    \ process layer\n- Exposed as a service, using a services-based architecture and\
    \ Web services technologies\n- Service end-point is layered\n\n+   - Interaction\
    \ layer\n  - Request handling\n  - Response handling\n  - Security\n  - Cache\n\
    - Processing layer\n  - Implementation layer of the service end-point\n  - Implemented\
    \ using BPEL and Business Choreographer\n\n+   - Processing layer uses business\
    \ delegate to delegate processing to the EIS system process\n\n+   - EIS system\
    \ process has an exception handler to handle any exceptions that either the EIS\
    \ system process or any of the local or remote EIS components can potentially\
    \ create. This exception handler must handle:\n\n+   - EIS system process faults\n\
    - EIS system process configuration faults\n\n+   - If the system process cannot\
    \ find any configuration data for given business process\n- Invalid configuration\
    \ data or no configuration data\n\n+   - EIS component errors (local and remote)\n\
    \n+   - The EIS component can potentially also have J2C connector or JDBC Connection\
    \ errors\n\n+   - General or Catch-All handling"
