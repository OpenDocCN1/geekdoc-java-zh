  md: '# Stock Broker (Place Order Service)


    The Stock Broker process is a logical system with a remote physical component.
    It consists of a BPEL process which resides in the same system as the trading
    system. Requests to the stock broker application are made asynchronously by the
    Place Order Service.


    Figure 3-13 shows the Place Order Service process.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_96_0.png)


    The Place Order process uses the Send Order Request system to submit an order
    via WebSphere MQ over JMS to the stock broker application running on a remote
    server over the intranet. The message is retrieved by the system process from
    the message store and sent to the IMS based stock broker application.


    The implementation of this solution uses WebSphere MQ JMS providers to send messages
    between each other. A message is placed on the local queue, then the queue manager
    through channels transfer the message to the remote WebSphere MQ provider.


    This solution could have been implemented differently by putting the message directly
    on the remote queue to provide for fault tolerance if the remote system is down.
    This setup allows the trading system to complete the transaction of the buy or
    sell order without disrupting the customers request during a brief failure of
    the external system. So, this solution provides both an asynchronous mechanism'
