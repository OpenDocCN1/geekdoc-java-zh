  md: '# 3.1 Scenario description and requirements


    This scenario involves ITSO Trading Firm, which provide customers with the service
    to buy and sell stocks.


    A customer at an internet trading site creates a request to buy a number of shares
    at a target price. The system processes the order by validating the order. Then,
    the system retrieves the current stock analysis information and performs a risk
    analysis using the customer''s profile. The system debits the users account for
    the amount required, then places a request with the brokerage system for the number
    of shares desired. If successful, the customer is sent an e-mail notification.
    If the purchase request fails, the customer''s account is then credited, and a
    notification of the failure is sent via e-mail.


    # 3.1.1 Business description


    ITSO Trading Firm allows customers to login to the trading Web site and perform
    queries on company stocks and purchases to sell shares of stocks.


    A customer can place an order with the system, which retrieves a quote to withdraw
    money to purchase the stock, then place an order with the broker. Figure 3-1 shows
    the business view for this scenario.


    ![](img/5b2c9dea5bc3d31d7583d88aca94b088_81_0.png)


    Figure 3-1 ITSO Trading Firm business


    The Internet Trading System from ITSO Trading Firm provides customers the option
    to link to their account to provide funds for the stocks they buy and sell. The
    firm uses the stock quote service from ITSO FastQuote Incorporated which updates
    the firm''s quote store periodically.'
