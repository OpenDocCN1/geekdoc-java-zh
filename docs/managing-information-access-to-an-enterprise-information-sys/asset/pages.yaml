  md: '# Managing Information Access to an Enterprise Information System Using J2EE
    and Services Oriented Architecture


    Discusses EIS integration architecture with J2EE and SOA


    This IBM Redbook focuses on issues associated with the integration of an existing
    enterprise information system (EIS) into a new Java 2 Platform, Enterprise Edition
    (J2EE), and other service-oriented applications. The book specifically discusses
    quality of service issues that are associated with the integration of geographically
    distributed Architecture (JCA) technologies in combination to use Web Services,
    Java Message Service (JMS), and J2EE Connector Architecture to enable access to
    existing transactions while addressing transport difficulties due to variable
    network conditions. It also addresses security context and transaction context
    propagation issues.


    INTERNATIONAL TECHNICAL SUPPORT ORGANIZATION


    Includes J2EE and BPEL solution examples


    BUILDING TECHNICAL INFORMATION BASED ON PRACTICAL EXPERIENCE


    Contains WebSphere Business Integration Server Foundation sample scenario


    The audience for this book is architects and developers who are implementing new
    J2EE and service oriented architecture (SOA) solutions that need to be integrated
    with existing EIS systems.


