    什么是 OpenTelemetry 以及你如何在 Python 中使用它？OpenTelemetry 是一个观测性框架，用于从应用程序生成和收集遥测数据（指标、日志、追踪）。在\
    \ Python 中，你通过 pip 安装 OpenTelemetry API 和 SDK 包（例如，`pip install opentelemetry-api\
