    \ due to its readability. In scientific and numeric computing, Python's powerful\
    \ libraries make it ideal for research and simulations.\n\n**What are basic data\
    \ types?** Python's built-in types include **numeric types** (int, float, complex),\
    \ **sequence types** (str for, list, tuple, range), **mapping type** (dict), **set\
    \ types** (set, frozenset), **bool** and **binary types** (bytes, bytearray, memoryview).\
    \ For example, x = 42 creates an int, s = \"hello\" as a str and l = [1,2,3]\n\
    \n**What is the difference between a list and a tuple?** A list is a mutable sequence\
    \ (defined with []) whose elements can be changed, added or removed after creation.\
    \ A **tuple** is an immutable sequence (defined with ()) that cannot be modified.\
    \ In other words, lists are variable-length and changeable, whereas tuples are\
    \ fixed-size. Because tuples are immutable, they cannot be used as dictionary\
    \ keys, lists cannot.\n\n**What is a list and how is it different from an array?**\
    \ A list is a dynamic, heterogeneous container (elements can be of any types)\
    \ and can grow or shrink as needed. Python also has an **array** module and third-party\
    \ arrays (**numpy**) which require fixed data types for performance. In general,\
    \ use a list for general-purpose collections; use specialized arrays (NumPy arrays)\
    \ when you need efficient storage and computation on large datasets.\n\n**How\
    \ do you install external packages?** The standard way is using the package manager.\
    \ For example, to install the NumPy library you would run `pip install numpy`\
    \ which downloads the package from PyPI and installs it into your environment.\
    \ You can also install specific versions (e.g., `pip install package==1.2.3`)\
    \ and upgrade or uninstall packages using `pip`.\n\n**What is virtual environment\
    \ and why use it?** A virtual environment (created with `python -m venv`) is an\
    \ isolated Python environment with its own interpreter and libraries. It ensures\
    \ that dependencies for one project do not conflict with others. Each virtual\
    \ env has its own site-directories, so you can install different versions of packages\
    \ per project. This avoids \"dependency hell\" and makes projects reproducible.\n\
    \n**How do if, elif, else statements work?** These are Python's conditional blocks.\
    \ Example:\n\n```\nif condition1:\n    # code block A\nelif condition2:\n    #\
    \ code block B\n```"
