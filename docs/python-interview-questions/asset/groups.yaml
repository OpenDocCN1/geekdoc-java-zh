    \n**线程（threading）和异步（async）之间的区别是什么？** 线程使用操作系统线程来实现并发（尽管受 GIL 限制），适用于 I/O 密集型任务；异步使用单线程事件循环和协程（async/await）来处理并发；默认不使用线程。对于许多小任务，异步通常更高效（无开销），但代码必须以异步风格编写。线程使用库，而异步则需要非阻塞库。\n\
    \n**Python 的内置优化技术有哪些？** Python 自动应用了一些优化：布尔操作的短路求值、小整数/字符串缓存以及编译后的字节码缓存（.py 文件）。你可以通过使用内置函数（`sum()`，列表推导式）、避免全局查找（局部变量更快）以及最小化属性查找（为频繁访问的属性使用局部变量）来手动优化。\n\
    \n**什么是内存视图（memoryview）？** `memoryview` 是一个内置类型，允许 Python 代码在不复制的情况下访问二进制对象（如\
