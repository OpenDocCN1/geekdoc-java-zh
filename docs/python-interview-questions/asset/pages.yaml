    - **Class methods** use the @classmethod decorator and take cls as the first parameter\
    \ (the class itself). They can access or modify class state.\n- **Static methods**\
    \ use @staticmethod and take no special parameter; they behave like regular functions\
    \ but live in the class namespace.\n\nExample:\n\n```\nclass C:\n    def f(self):\
    \ pass        # instance method\n    @classmethod\n    def g(cls): pass      \
    \  # class method\n    @staticmethod\n    def h(x): return x*x   # static method\n\
    ```\n\nUse class methods for factory patterns or operations related to the class,\
    \ static methods for utility functions related to the class.\n\n**What is multiple\
    \ inheritance and how does Python handle it?** Python classes can inherit from\
    \ multiple base classes: C(A, B). Method resolution order (MRO) defines the order\
    \ in which base classes are searched for methods. You can use C.__mro__ or help\
    \ to see it. Python uses the C linearization algorithm for multiple bases define\
    \ the same method, the leftmost in the class definition is used unless overridden.\n\
    \n**What are magic (dunder) methods?** These are special methods surrounded by\
    \ underscores (e.g. __init__, __str__, __len__, __add__). They allow to define\
    \ or override built-in behaviors (construction, string representation, arithmetic\
