  md: "# Java Code Geeks MINBOOKS 10\nPYTHON INTERVIEW QUESTIONS\n\n```\ndef greet(name):\n\
    \    print(\"Hello\", name)\ngreet(\"Alice\")\n```\n\nThis will print \"Before\"\
    , then \"Hello Alice\", then \"After\". Decorators are often used for logging,\
    \ authorization checks, caching, etc. Under the hood, @my_deco transforms greet\
    \ into greet = @my_deco(greet).\n\n**What is a generator in Python?** A generator\
    \ is a special kind of iterator defined by a function using the yield keyword,\
    \ or by generator function returns a generator object without running the function\
    \ immediately. Each yield pauses saving its state, and returns a value to the\
    \ caller. Calling next() on the generator resumes execution until the next yield.\
    \ This allows producing values one at a time on-demand. Generators are memory-efficient\
    \ for large sequences because they don't hold the whole list in memory. For example:\n\
    \n```\ndef count_up_to(n):\n    i = 1\n    while i <= n:\n        yield i\n  \
    \      i += 1\n```\n\nHere, call to next() yields the next number. Generator expressions\
    \ provide a quick way to define generators (e.g. \"*x for x in range(5)\"). Unlike\
    \ normal functions that return, generators use yield, which returns a value and\
    \ pauses the function (without exiting).\n\n**What are comprehensions and when\
    \ should you use them?** Comprehensions (list/dict comprehensions) are concise\
    \ for constructing collections from items. They often replace loops for building\
    \ lists, improving readability and performance. For example, [**2 for x in nums\
    \ if x%2==0] quickly creates a list of squares even. Use them for simple transformations.\
    \ For more complex logic, traditional loops might be clearer. Generator expressions\
    \ (**x2 for x in nums) similarly create iterators for lazy evaluation.\n\n**What\
    \ are modules and packages, and how do you organize code?** We covered modules\
    \ and packages earlier. For intermediate, emphasize organization: Place related\
    \ functionality in modules (e.g. utils.py). Group related modules into packages\
    \ (directories with __init__.py). Use absolute or relative imports to access code.\
    \ Follow a clean project layout, e.g:\n\n```\nmyproject/\napp/\n__init__.py\n\
    models.py\nviews.py\ntests/\nrequirements.txt\n```\n\nUse __name__ == \"__main__\"\
    \ in scripts to allow modules to run as programs.\n\n**What are some Python best\
    \ practices?** Follow PEP 8 style (naming, indentation, line length), write readable\
    \ code. Use virtual environments per project. Prefer list/set/dict comprehensions\
    \ over manual loops when concise. Handle exceptions properly (don't use except:).\
    \ Write meaningful docstrings"
