    **What are some strategies for scaling Python applications?** By scaling multiple
    workers (via WSGI servers with multiple workers), use load balancers, or container
    orchestration (Kubernetes). Offload static files to a CDN. Use caching (Redis,
    Memcached). For CPU-bound tasks, run them in background workers (Celery with multiple
    processes). Use asynchronous frameworks (FastAPI, ahttp) to handle many I/O-bound
    requests. Profile and optimize bottlenecks, considering sharing or microservices
    for large tasks.


    **What is the difference between threading and async?** Threading uses OS threads
    to allow concurrency (though limited by GIL), suitable for I/O-bound tasks, async
    uses a single-threaded event and coroutines (async/await) to handle concurrency;
    it doesn''t use threads by default. Async is often more efficient (no overhead)
    for many small tasks, but code must be written in async style. Threading uses
    libraries, whereas async requires non-blocking libraries.


    **What are Python''s built-in optimization techniques?** Python applies a few
    optimizations automatically: short-circuit evaluation for boolean ops, caching
    small integers/strings, and compiled bytecode caching (.py files). You can manually
    optimize by using built-ins (sum(), list comprehensions), avoiding global lookups
    (local variables are faster), and minimizing attribute lookups (local variables
    for frequently accessed attributes).


    **What is a memory view?** A memoryview is a built-in allows Python code to access
    the memory of binary objects (like bytes, bytearray) without copying. It supports
    slicing and views large data buffers. For zero-copy manipulation of binary data,
    e.g. in networking or image processing. Example:


    ```

    ba = bytearray(b"Hello")

    mv = memoryview(ba)

    m[0] = 74 # changes ba to b"Jello"

    ```


    **How do you ensure code quality in large projects?** Use linters (flake8, pylint),
    formatters (black), type checkers (mypy) for consistency. Enforce code style with
    CI. Write comprehensive unit/integration tests and use continuous integration
    to run them on every commit. Perform regular code reviews. Use dependency management
    (requirements.txt with exact versions or lock files) and documentation (doctrings,
    Markdown docs).


    **How do you call C from Python?** Several ways:


    These allow leveraging existing C libraries or writing performance-critical code
    in C.


    +   * ctypes: allow to call C functions in shared libraries (DLLs) at runtime
    without compiling Python extension.

    * cffi: to call C by interfacing with the C ABI.

    * Cython or Python API: write C extensions (compile .pyx or .c files).

    * subprocess: run a C program as a process.


    **What is PyPy project?** PyPy is an alternative Python interpreter with a JIT
    compiler, faster for long-running code. It is compatible with CPython but may
    have issues with C extensions (though support has improved). PyPy can run many
    Python programs faster without code changes. Mention as an option for performance
    tuning.'
