  md: "Explain Python's structural pattern matching (match-case) introduced in Python\
    \ 3.10. Provide an example. Structural pattern matching (PEP 634) adds a match\
    \ statement that compares a value against a series of patterns. The syntax is:\n\
    \n```\nmatch subject:\n    case <pattern1>:\n        <action1>\n    case <pattern2>:\n\
    \        <action2>\n    case _:\n        <fallback>\n```\n\nThe subject is evaluated\
    \ and checked against each case in order, executing the first matching block.\
    \ Patterns can be literals, types, sequences, or even class instances. For example:\n\
    \n```\ndef http_error(status):\n    match status:\n        case 400:\n       \
    \     return \"Bad request\"\n        case 404:\n            return \"Not found\"\
    \n        case _:\n            return \"Something else\"\n```\n\nHere, if status\
    \ is 404, the function returns \"Not found\", and if no literal matches, the wildcard\
    \ _ case handles the rest. Pattern matching is more powerful than simple if/elif\
    \ chains when you need to destructure data or match on complex conditions.\n\n\
