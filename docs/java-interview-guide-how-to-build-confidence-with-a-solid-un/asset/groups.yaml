    # Creational Design Patterns


    Creational design patterns solve common problems that arise during the creation
    of objects.


    ### Builder Pattern


    The builder pattern provides an alternative to a constructor with an excessive
    number of parameters. A builder object temporarily stores the state of a new object
    through a chain of fluent method calls, until the target object is constructed
    in one final step. The MapMaker class in the Google Guava library is an example
    of the builder pattern.


    ### Factory Pattern


    The factory pattern provides an instance of an abstract class or an interface
    without burdening the client with implementation details. This is useful for encapsulating
    complicated creational logic or utilizing object pools for performance. The Calendar.getInstance()
    method is an example of the factory pattern.


    ### Abstract Factory Pattern


    The abstract factory pattern, also known as a factory of factories, provides instances
    of factory classes without burdening the client with implementation details. This
    is useful for encapsulating the creational logic of a set of related factory classes.
    The DocumentBuilderFactory class is an example of the abstract factory pattern.


    # CREATIONAL DESIGN PATTERNS


    ### Prototype Pattern


    The prototype pattern creates a cloned object out of a prototype. This is useful
    when an object is prohibitively expensive to create, such as the result of a database
    query. The Object.clone() method is an example of the prototype pattern.


    ### Singleton Pattern


    The singleton pattern restricts the instantiation of a class to a single instance.
    Singletons are preferable to global variables because they can be lazily initialized,
    although some implementations require explicit synchronization to do. The Runtime.getInstance()
    method is an example of the singleton pattern.


    # Questions


    What is the builder pattern? When is it useful?


    What is the factory pattern? When is it useful?


    What is the abstract factory pattern? When is it useful?


    What is the prototype pattern? When is it useful?


    What is the singleton pattern? When is it useful?


    # Structural Design Patterns


    Structural design patterns solve common problems that arise due to the relationship
    between different objects.


    ### Adapter Pattern


    The adapter pattern converts an incompatible object into a form that a module
    accepts. This allows separate modules of code to communicate without coupling
    them. The Arrays.asList() method is an example of the adapter pattern.


    ### Composite Pattern


    The composite pattern treats a collection of objects as if it were a single object.
    This is useful when a group of objects share similar functionality, such as the
    elements of a Swing application. The Container.add() method is an example of the
    composite pattern.


    ### Decorator Pattern


    The decorator pattern provides additional behavior to an object by wrapping it
    with a delegator. This provides a flexible alternative to creating multiple subclasses.
    The Collections.unmodifiableList(List) method is an example of the decorator pattern.


    ### Facade Pattern


    The facade pattern provides a simplified interface over a large body of code.
    This is useful when a system is complex or poorly designed and clients are only
    interested in a subset of functionality. The Logger interface in the SLF4J library
    is an example of facade pattern.


    ### Flyweight Pattern


    The flyweight pattern reduces the memory footprint of an application by reusing
    objects. This is useful when a large number of immutable objects are frequently
    instantiated. The Integer.valueOf(String) method is an example of the flyweight
    pattern.


    # Questions


    What is the adapter pattern? When is it useful?


    What is the composite pattern? When is it useful?


    What is the decorator pattern? When is it useful?


    What is the facade pattern? When is it useful?


    What is the flyweight pattern? When is it useful?


    # Behavioral Design Patterns


    Behavioral design patterns solve common problems that arise due to the interaction
    of different objects.


    ### Command Pattern


    The command pattern encapsulates all of the information needed to execute an action.
    This is useful for operations that need to be invoked outside of the context in
    which they were created. The Runnable interface is an example of the command pattern.


    ### Observer Pattern


    The observer pattern notifies a collection of observers about state changes to
    a subject of interest. This is useful for decoupling a subject from the concerns
    of its followers. The Observer class and Observable interface are examples of
    the observer pattern.


    ### Strategy Pattern


    The strategy pattern dynamically chooses the behavior of an algorithm at runtime.
    This is useful for operations that have a variety of custom implementations. The
    Collections.sort(List, Comparator) method is an example of the strategy pattern.


    ### Visitor Pattern


    The visitor pattern separates an algorithm from the object structure on which
    it operates. This is useful when different algorithms need to traverse a similar
    path through a complex object. The ElementVisitor interface is an example of the
    visitor pattern.

