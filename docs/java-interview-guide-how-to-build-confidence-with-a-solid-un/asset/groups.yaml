    # Important Interfaces


    # Autocloseable


    The Autocloseable interface is used in a try-with-resources block to cleanup resources.
    Autocloseable defines a close ( ) method that is invoked by the JVM after a try-with-resources
    block completes.


    # Comparable


    The Comparable interface determines the natural ordering between objects of the
    same type. Comparable defines a generic compareTo(T) method that returns an integer
    indicating whether an object is less than, equal to, or greater than a comparable
    object. A list of Comparable objects can be sorted in the Collections#sort(List)
    method.


    # Comparator


    The Comparator interface determines a sorting strategy between objects of the
    same type. This can be used to sort objects that do not implement Comparator,
    or to sort objects in a manner distinct from their natural ordering. Comparator
    defines a generic compare(T, T) method that returns an integer indicating whether
    the first object is less than, equal to, or greater than the second object. Lists
    can be sorted by comparators in the Collections#sort(List, Comparator) method.


    # Iterable


    The Iterable interface defines a method that returns an Iterator. An object that
    implements Iterable can be used in an enhanced for-loop. Note that although arrays
    can be used in enhanced-loops, they do not implement the Iterable interface.


