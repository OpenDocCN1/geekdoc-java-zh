    # Algorithms


    ## Big O Notation


    Big O notation measures the complexity of an operation relative to the size of
    its input.


    O(1) describes an algorithm whose complexity is independent of the input, such
    as accessing an element in an array by its index.


    O(n) describes an algorithm whose complexity increases linearly, such as iterating
    through an array.


    O(n^2) describes an algorithm whose complexity increases quadratically, such as
    comparing every element in an array to every other element in an array.


    O(log n) describes an algorithm whose complexity increases logarithmically, such
    as dividing an array in half until only one element remains.


    O(n log n) describes an algorithm whose complexity increases logarithmically,
    such as dividing an array in half and iterating through each half.


    # Binary Search


    Binary search is an O(log n) algorithm that is used to find a value in a sorted
    list of items. It works by searching for a value in the middle of a list, and
    recursively discarding whichever half of the list is out of range. The result
    of a binary search is undetermined if the list is unsorted. Binary search is available
    in the Arrays and Collections classes.


    # ALGORITHMS


    # Insertion Sort


    Insertion sort is an O(n^2) average-case sorting algorithm. It works by traversing
    through a list and sorting the previous elements by swapping them in place.


    # Merge Sort


    Merge sort is a stable O(n log n) average-case sorting algorithm. It works by
    recursively dividing a list into individual sublists, and merging each sublist
    together to produce a sorted result. Merge sort is an example of a divide and
    conquer algorithm, which recursively reduces a problem to a trivial solution.


    # Quicksort


    Quicksort is an unstable O(n log n) average-case sorting algorithm. It works by
    defining a pivot and swapping elements so that lesser values appear before the
    pivot and greater values after the pivot. The remaining pivots are sorted recursively.
    As of Java 7, quicksort is the default implementation for sorting primitives in
    the Arrays class.


    # Timsort


    Timsort is a stable O(n log n) average-case sorting algorithm. Timsort is a hybrid
    algorithm derived from merge sort and insertion sort. It works by identifying
    runs of naturally sorted data or by using insertion sort to create runs of a minimum
    size. The runs are merged together in the same manner as merge sort. Timsort often
    performs fewer than O(n log n) comparisons because it takes advantage of partially
    sorted values. As of Java 7, Timsort is the default implementation for sorting
    objects in the Arrays and Collections classes.


    # Questions


    What is Big O notation? What are some common examples?


    What is a binary search? How well does it perform?


    What is insertion sort? How well does it perform?


    What is merge sort? How well does it perform?


    What is quickicksort? How well does it perform?


    What is timsort? How well does it perform?


    # JAVA COLLECTIONS FRAMEWORK


    # Java Collections class Framework


    The Java Collections Framework (JCF) provides common data structures that implement
    the Collection interface. A collection is an abstract representation of a generic
    group of objects.


    # List


    A List is a data structure that holds an indexed collection. The ArrayList class
    uses an indexed array to hold its values. The values are copied into a larger
    array if the capacity is exceeded, but this can be avoided by specifying an initial
    capacity in the constructor. ArrayList is not thread-safe, CopyOnWriteArrayList
    is a thread-safe alternative.


    The LinkedList class uses a chain of Node objects to create a dynamically-sized
    list. A node contains a value along with a reference to the previous node and
    the next node in the chain. This allows nodes to be inserted or removed without
    reorganizing the list, but it requires iterating through the list to access an
    element by its index. LinkedList is not thread-safe, but it can be decorated by
    the Collections#synchronizedList method.


    # Map


    A Map is a data structure that associates keys with values. The HashMap class
    uses an array of linked lists to store Entry objects. An entry contains a key,
    a value, and a reference to the next entry in the chain. When you put a key/value
    pair in the map, a mathematical function such as the modulo operator (%) constrains
    the key''s hash code to an index in the array. Unique keys that map to the same
    index are linked together, but duplicate keys will overwrite the existing entries.
    When you look up a value by key, the index is computed again and every entry in
    the linked list is inspected until a matching key is found.


    HashMap requires that keys implement the hashCode() and equals() methods correctly.
    If the hash code is not unique, performance of the map will suffer because the
    linked lists will grow disproportionately. If the hash code is not consistent,
    entries can get lost in the map and leak memory.


    If the size of a HashMap exceeds 75% of its capacity, the array is doubled and
    all of the entries are rehashed. This can be avoided by specifying an initial
    capacity and its load factor in the constructor. HashMap does not maintain the
    insertion order of its entries, but LinkedHashMap provides that functionality
    by storing its entries in an auxiliary LinkedList. HashMap is not thread-safe,
    but ConcurrentHashMap is a thread-safe alternative.


    # Deque


    A Deque (double-ended queue) is a data structure that can insert or retrieve values
    from two sides. A deque that removes elements in a last-in-first-out (LIFO) policy
    is called a stack. A deque that removes elements in a first-in-first-out (FIFO)
    policy is called a queue. The ArrayDeque class uses an object array to store its
    values. ArrayDeque can be used as a stack or a queue, and generally outperforms
    the Stack and LinkedList classes for the same purpose. ArrayDeque is not thread-safe,
    but ConcurrentLinkedDeque is a thread-safe alternative.


    # Binary Search Tree


    A binary search tree (BST) is a data structure that sorts nodes in a hierarchical
    tree. A red-black tree is a BST implementation that colors each node according
    to its location. The color of adjacent nodes can determine whether a tree is balanced.
    An unbalanced tree degrades to O(n) time lookups, so a balancing operation is
    used after inserting or removing nodes to guarantee lookups in O(log n) time.


    TreeMap is a red-black tree implementation that uses entry nodes to store its
    values. An Entry object contains a key, a color, and a reference to its parent
    entry, left entry, and right entry. TreeMap stores its entries according to the
    natural ordering of its keys or by a sorting strategy provided by a Comparator.
    A naturally sorted tree requires keys to correctly implement the compareTo() and
    equals() methods in the Comparable interface. TreeMap iterates through its entries
    in sorted order. TreeMap is not thread-safe, but it can be decorated by Collections#synchronizedSortedMap()
    method.


    # Heap


    A heap is an unsorted data structure that organizes nodes in a hierarchical tree.
    In a max-heap, the values of a parent node are always greater than the values
    of its child nodes. In a min-heap, the values of a parent node are always less
    than the values of its child nodes.


    A heap is a maximally efficient implementation of a priority queue. A priority
    queue serves elements according to their priority and falls back to a FIFO policy
    for identical priorities. The PriorityQueue class uses an object array to store
    its values. Although heaps are visually represented as a tree, they can be compactly
    stored inside an array and nodes can be located by index arithmetic. PriorityQueue
    is not thread-safe, but PriorityBlockingQueue is a thread-safe alternative.


    # Set


    A Set is a data structure that holds a collection of unique values. Sets often
    delegate functionality to maps because the keys in a map are already unique. HashSet
    utilizes a HashMap, which does not maintain the insertion order of its elements.
