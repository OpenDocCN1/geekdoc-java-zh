    Java 中的每个类都直接或间接地是 Object 类的后代。Object 类提供了几个方法，可以在子类中可选地扩展它们。


    ## 克隆 (Clone)


    `clone()` 方法最初设计用于返回实现 `Cloneable` 接口的对象的副本。克隆既可以是**浅拷贝**（与原始对象共享相同的引用），也可以是**深拷贝**（将原始对象的值复制到新对象中）。遗憾的是，正确地重写此方法是非常困难的，而且它并没有拷贝构造函数的优势，拷贝构造函数提供了更大的灵活性更整洁的契约。


    ## 等等 (Equals)


    `equals()` 方法比较两个对象的等等性。默认实现依赖于标识符 (==) 来判断两个对象是否指向内存中的相同地址。鼓励子类重写此方法，以测试两个对象是否包含相同的信息，而不是内存中的相同位置。请注意，如果你重写了
    `equals()` 方法，根据约定你也必须重写 `hashCode()` 方法。


    ## 哈希码 (HashCode)


    `hashCode()` 方法将对象的状态处理成一个整数，这对于哈希表数据结构非常有用。默认情况下，哈希值是通过将对象的内部地址转换为整数来实现的。哈希值必须保持一致性，并且对于根据
    `equals()` 方法相等的对象，必须始终返回相等的值。


    ## 字符串表示 (ToString)


    `toString()` 方法返回对象的文本表示，主要用于日志记录和调试。默认情况下，`toString()` 方法返回对象的类名，随后是其哈希码的十六进制表示。


    ## 获取类 (GetClass)


    `getClass()` 方法返回一个 `Class` 对象，其中包含有关类的信息以及用于反射访问字段和方法的工具方法。`getClass()` 方法是 `final`
    的，不能被子类重写。


    ## 最终化 (Finalize)


    `finalize()` 方法最初设计在对象被垃圾回收器销之前调用。然而，如果一个对象从未被解除引用，或者应用程序在垃圾回收器运行之前退出，则该对象可能不会进入垃圾回收状态。由于其不确定性以及对象可能通过创建额外的引用而被无意“复活”的可能性，通常不建议依赖此方法进行清理操作。


    ## 等待、通知、全通知 (Wait, Notify, NotifyAll)


    最终类方法 `wait()`、`notify()` 和 `notifyAll()` 提供了底层并发操作，允许线程之间的通信。例如，一个线程可以停止执行，直到收到来自另一个线程的通知。Java
    在 `java.util.concurrent` 包中提供了层级并发数据结构。


    ( [ 24 ]


    ## 问题


    - 浅拷贝和深拷贝之间的区别是什么？

    - 为什么拷贝构造函数优于 `clone` 方法？

    - 标识符运算符与 `equals()` 方法之间的区别是什么？

    - `hashCode()` 方法与 `equals()` 方法之间是什么关系？

    - `toString()` 方法的默认实现是什么？

    - 为什么 `finalize()` 方法对于清理操作不可靠？


    ## 组合与继承 (Composition & Inheritance)


    ## 组合 (Composition)


    组合是一种通过将功能委托给其他对象来防止代码重复的技术。例如，`Party` 类可以将方法调用委托给一个 `List` 对象，以便为宾客列表提供功能。这允许
    `Party` 类选择性地暴露 `addGuest()` 等方法，而不是暴露 `List` 接口中的所有方法。


    ## 继承 (Inheritance)


    继承是一种通过从父对象继承功能来防止代码重复的技术。例如，`Party` 类可以扩展 `ArrayList` 来为宾客列表提供功能。这允许 `Party`
    对象被用于增强 for 循环或接受 `List` 的方法中。不允许多重继承，以防止父类在独立实现相同功能时产生的歧义。这种歧义由于生成的对象层次结构的形状被称为“菱形问题”（或“死亡菱形”）。


    ## 方法重写 vs 方法重载 (Method Overriding vs Method Overloading)


    方法重写允许子类更改父类的功能。这发生在子类定义了一个与父类方法具有相同方法签名的非静态时。从 Java 5 开始，重写的方法可以声明相同的返回类型或协变（子类）返回类型。即使对象被强制转换为其父类类型，重写的方法也会被调用。


    方法重写经常与方法重载混淆。当一个类中的两个或多个方法具有相同名称但不同的方法签名时，就会发生方法重载。([26])


    方法重载通过允许客户端调用方法的适当版本，而无需为可选参数传递空值，从而为 API 提供了灵活性。


    ## 组合 vs 继承 (Composition vs Inheritance)


    组合和继承都提供代码复用，但很难确定哪种关系更合适。作为一条通用规则，询问两个对象之间是“拥有”（HAS-A）关系还是“是”（IS-A）关系。例如，一个派对“拥有”一个宾客列表，因此
    `Party` 应该由一个 `List` 组成。另一方面，一个学生“是”一个人，因此 `Student` 应该继承自 `Person`。


    虽然两种方法都是强大的，但它们各自都有缺点。组合需要委托代码，并在没有引入额外接口的情况下阻止了多态。继承强制了类与类之间的紧耦合。在疑问时，组合是优选方法，因为它比继承更灵活。


    ## 问题


    - 组合和继承之间的区别是什么？

    - 方法重写和方法重载之间的区别是什么？

    - 如何决定使用组合还是继承？


    ## 抽象类与接口 (Abstract Classes & Interfaces)


    ## 抽象类 (Abstract Classes)


    抽象类设计用于扩展，且不能实例化。例如，抽象类 `Person` 可能包含通用属性，并依赖 `Employee` 和 `Student` 等具体子类提供额外功能。抽象类可以同时包含具体方法抽象方法，但它只能通过在对象层次中实现所有抽象方法的具体子类来实例化。


    ## 接口 (Interfaces)


    接口通过描述对象可以的形式来促进多态性。例如，想象一个对纳税人员感兴趣的政府机构。与其代码库与 `Student` 和 `Employee` 对象紧密耦合，他们不如引入一个
    `Taxable` 接口并要求人们提供自己的实现。接口只能包含常量字段和空方法。一个类可以实现多个接口，但它必须为每个方法提供实现（重复的方法被视为一个）。


    ## 抽象类对比接口 (Abstract Classes vs Interfaces)


    认为抽象类和接口在功能上竞争是一个常见的误区；实际上它们经常协作工作。例如，Java 的 `AbstractList` 类部分实现了 `List` 接口的方法，减轻了
    `ArrayList` 和 `LinkedList` 等子类的负担。总的来说，抽象类用于规划继承层次结构并简化子类的工作。接口用于引入抽象层并解耦代码模块。


