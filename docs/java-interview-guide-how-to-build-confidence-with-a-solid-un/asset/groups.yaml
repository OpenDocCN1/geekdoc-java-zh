    # Reflection


    Reflection allows a program to manipulate an object at runtime without knowing
    about the object at compile time. For example, if you wanted to debug an object
    that didn''t override the toString() method, you could use reflection to inspect
    every field. Reflection is possible due to a collection of classes that represent
    programming constructs such as Class, Field, and Method.


    # Class


    A Class is a special object constructed by the JVM that represents classes and
    interfaces in an application. If you consider a class file as the blueprint for
    an object, you can consider the Class class as the blueprint for blueprints. A
    Class instance can be retrieved from an object by calling the getClass() method,
    or it can be looked up by its fully qualified name with the Class#forName() method.


    A Class provides type introspection for an object. Type introspection allows a
    program to examine the properties of an object at runtime. For example, a Class
    object contains introspective methods such as getName(), getDeclaredFields(),
    and getDeclaredMethods(). A Class can also create an object with the newInstance()
    method. This is widely used in frameworks that need to instantiate objects defined
    in XML files.


    # Field


    A Field provides access to a single field in a class or an interface. A Field
    contains introspective methods that allow you to get a value from a field, as
    well as reflective methods that allow you to set a value into a field. However,
    a flag must be set on the Field object via the setAccessible() method to allow
    access to fields with limited visibility.


    # Method


    A Method object provides access to a single method in a class or interface. A
    Method contains introspective methods that provide information about the method
    declaration, as well as reflective methods that allow you to invoke the method.
    However, a flag must be set on the Method object via the setAccessible() method
    to allow access to methods with limited visibility.


    # Pros and Cons


    Reflection is a powerful tool that plays a crucial role in countless extensions
    to the Java library, such as test frameworks, IoC containers, ORM mappers, profilers,
    and debuggers. On the other hand, Java is a strongly-typed language that provides
    robust compile-time checking, and much of that protection is lost with reflection.
    Reflection also breaks encapsulation by allowing access to fields and methods
    outside of their intended scope. Finally, reflection has slower performance than
    non-reflective code due to the additional overhead on the JVM.


    # Questions


    What is reflection?


    What is type introspection?


    What is a Class object?


    What is a Field object?


    What is a Method object?


    What are some of the pros and cons of reflection?


    # Dependency Injection


    # Inversion of Control


    Inversion of Control (IoC) is a pattern that decouples software components from
    their dependencies. For example, a password recovery service would need access
    to a service that could deliver emails. A password service with control over its
    dependencies would need to instantiate and configure an email service directly.
    A password service with inverted control over its dependencies would have an email
    service provided by some other object. A service that relinquishes control of
    its dependencies is more flexible because different implementations can be provided
    without changing any code in the service. For example, a mock email service could
    be injected during testing to avoid sending emails or to simulate a failure.


    # Service Locator vs Dependency Injection


    Two common implementations of IoC are the service locator pattern and dependency
    injection. A service locator provides a central repository for objects to request
    dependencies. Dependency injection takes the inversion principle even further
    by allowing a container to inject dependencies directly into components through
    constructor arguments or setter methods.


    # Constructor Injection vs Setter Injection


    Constructor injection requires a component to declare a constructor with arguments
    for every dependency. This allows any initialization logic to run in the constructor,
    but components with multiple dependencies may have unwieldy constructor declarations.
    Setter injection requires a component to declare setter methods for every dependency.
    Setter injection is more flexible, but any initialization logic must take place
    after all the dependencies have been injected. In either case, a container is
    required to manage the relationship between components and their dependencies.


    # The Spring Container


    The Spring framework is one of the most popular extensions to the Java language.
    Although the Spring library has spread into numerous domains, the heart of the
    library is a dependency injection container. The Spring container is responsible
    for instantiating, configuring, and injecting components (called beans) into a
    running application.


    # Spring Configuration


    The Spring container requires configuration that defines beans and their relationship
    within an application. Configuration can be provided in the form of XML, annotations,
    or java code. XML configuration is commonly used due to its intuitive nature,
    but it''s susceptible to refactoring errors because the names of classes and packages
    often change. Annotations provide an alternative to XML, but the resulting configuration
    is decentralized and any changes require modifications to the source code. Java
    configuration files combine the centralized configuration of XML with the convenience
    of annotations, but it lacks some of the flexibility that XML provides.


    # Spring Lifecycle


    The Spring container begins by instantiating an ApplicationContext with one of
    the available configuration options. The container instantiates all of the beans
    and injects their dependencies via constructor injection, setter injection, or
    reflection. Finally, the container invokes callback methods on beans that hook
    into the lifecycle. For example, the container will invoke afterPropertiesSet()
    on any bean that implements InitialBean.


    # Questions


    What is the inversion of control pattern?


    What is the difference between a service locator and dependency injection?


    What is the difference between constructor injection and setter injection?


    What is the Spring container?


    What are the different ways of configuring a Spring container?


    What is the lifecycle of a Spring container?


    # Aspect-Oriented Programming


    # Core Concerns vs Cross-Cutting Concerns


    A core concern is a unit of work that contributes to the business logic of an
    application, such as storing records in a database or generating reports. A cross-cutting
    concern is a feature that spans across core concerns and supports an application,
    such as logging or caching.


    # Aspect-Oriented Programming


    Aspect-oriented programming (AOP) isolates cross-cutting concerns through the
    use of aspects. Aspects work by targeting a method, called a join point, and surrounding
    it with additional code. Join points are determined by an expression called a
    pointcut. For example, in order to find the slowest method in an application,
    you could declare a pointcut that targets all public methods and compare the time
    before and after each join point executes.


    # Proxy Objects


    A simple way to implement aspect-oriented programming is through the use of proxy
    objects. A proxy is a wrapper that provides additional functionality to an object
    of interest. Proxies can be implemented through interfaces or inheritance.


    # Interface Proxies


    An object that implements an interface can be proxied by another class that implements
    the same interface. For example, in order to log every method call on an ArrayList,
    you could create a ProxyList class that implements List and delegates every method
    to a private ArrayList.

