    ## Composition & Inheritance


    ## Composition


    Composition is a technique that prevents code duplication by delegating functionality
    to other objects. For example, a Party class could delegate method calls to a
    List object to provide functionality for a guest list. This would allow the Party
    class to selectively expose methods such as addGuest() instead of exposing every
    method in the List interface.


    ## Inheritance


    Inheritance is a technique that prevents code duplication by inheriting functionality
    from parent objects. For example, a Party class could extend an ArrayList to provide
    functionality for a guest list. This would allow Party objects to be used in enhanced
    for-loops or methods that accept a List. Multiple inheritance is not allowed in
    order to prevent the ambiguity that arises when parents implement the same feature
    independently. This ambiguity is called The Diamond Problem (or the Deadly Diamond
    of Death) due to the shape of the resulting object hierarchy.


    ## Method Overriding vs Method Overloading


    Method overriding allows a subclass to change the functionality of a superclass.
    This occurs when a subclass defines a non-static method with the same method signature
    as a parent method. As of Java 5, the overridden method can declare either the
    same return type or a covariant (subclassed) return type. An overridden method
    will be invoked even when an object is cast to its parent''s type.


    Method overriding is commonly confused with method overloading. Method overloading
    occurs when two or more methods in a class have the same name with different method
    signatures. ([26])


    Method overloading provides an API with flexibility by allowing clients to call
    up an appropriate version of a method without having to pass in null values for
    optional parameters.


    ## Composition vs Inheritance


    Composition and inheritance both provide code reuse, but it can be difficult to
    determine which relationship is more appropriate. As a general rule, ask whether
    two objects share a HAS-A or an IS-A relationship. For example, a party HAS-A
    guest list, so it follows that a Party should be composed of a List. On the other
    hand, a student IS-A person, so it follows that a Student should inherit from
    a Person.


    Although both methods are powerful, they each have their own weaknesses. Composition
    requires delegation code and prevents polymorphism unless additional interfaces
    are introduced. Inheritance forces a rigid object hierarchy and tightly couples
    two classes. When in doubt, composition is the preferred approach because it''s
    more flexible than inheritance.


    ## Questions


    - What is the difference between composition and inheritance?

    - What is the difference between method overriding and method overloading?

    - How would you determine whether to use composition or inheritance?


    ## Abstract Classes & Interfaces


    ## Abstract Classes


    Abstract classes are designed to be extended and cannot be instantiated. For example,
    an abstract class Person might contain common attributes and rely on concrete
    subclasses like Employee and Student to provide additional functionality. An abstract
    class can have both concrete and abstract methods, but it can only be instantiated
    by a concrete subclass that implements every abstract method somewhere along the
    object hierarchy.


    ## Interfaces


    Interfaces promote polymorphism by describing a form that an object can take.
    For example, imagine a government agency that is interested in taxing people.
    Rather than tightly couple their codebase to the Student and Employee objects,
    they could instead introduce a Taxable interface and require people to provide
    their own implementations. Interfaces can only contain constant fields and empty
    methods. A class can implement more than one interface, but it must provide the
    implementation for every method (duplicate methods are treated as one).


    ## Abstract Classes vs Interfaces


    It''s a common misconception to assume that abstract classes and interfaces compete
    for functionality; in practice they frequently work together. For example, Java''s
    AbstractList class partially implements methods from the List interface, lessening
    the burden for subclasses such as ArrayList and LinkedList. In general, abstract
    classes are used to plan an inheritance hierarchy and simplify the work of subclasses.
    Interfaces are used to introduce a layer of abstraction and decouple modules of
    code.

