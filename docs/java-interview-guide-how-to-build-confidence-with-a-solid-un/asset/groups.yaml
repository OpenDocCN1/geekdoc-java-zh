    # Generics


    ## Compile-Time Errors vs Runtime Errors


    Compile-time errors are errors that prevent a program from compiling, such as
    syntax errors. Runtime errors are errors that occur during the execution of an
    application, such as casting an object to an invalid type. Compile-time errors
    are easier to fix because the compiler tells you where they occur. Runtime errors
    are more difficult to detect and may cause unpredictable behavior in unrelated
    parts of the application. It is therefore preferable to catch as many errors as
    possible during the compile-time phase.


    # Generics


    Generics were introduced to prevent runtime errors caused by invalid type casting.
    For example, it would be legal to add a String to a non-generic List and retrieve
    it with a cast to an Integer, resulting in a ClassCastException. However the same
    situation with a generic List<String> would cause a compile-time error. Without
    generics, the only way to accomplish type safety would require a List implementation
    for every possible object, such as a StringList, IntegerList, etc.


    ## Generic Wildcards


    Unlike arrays, generics are invariant, meaning that generic objects do not share
    the same relationship as its types. For example, even though Integer extends Number,
    List<Integer> does not extend List<Number>. The common parent of List<Integer>
    and List<Number> is the wildcard type List<?>.


    Wildcards can be used to create restrictions on generic types. For example, the
    upper bounded wildcard List<? extends Number> allows the Number type and all subclasses
    of Number. The lower bounded wildcard List<? super Number> allows the Number type
    and all superclasses of Number.


    # Type Erasure


    In order to preserve backwards compatibility, generic types are removed by the
    compiler and replaced with object casts in a process called type erasure. Type
    erasure prevents the need for legacy code to be recompiled, but it also introduces
    several limitations. For example, generic exceptions are not allowed because a
    catch block cannot tell the difference between a GenericException<String> and
    a GenericException<Integer>. Similarly, a class cannot implement both Comparable<String>
    and Comparable<Integer>, because without generic types they both represent the
    same interface.


