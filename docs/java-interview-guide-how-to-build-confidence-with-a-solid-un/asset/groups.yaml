    # Exceptions


    Exceptions are special objects that are thrown whenever an error interrupts the
    normal execution of code. All exceptions are descendants of the Throwable class
    and are divided into two categories: unchecked exceptions and checked exceptions.


    ## Unchecked Exceptions


    Unchecked exceptions represent a defect in the application, such as invoking a
    method on a null object reference or casting an object to an invalid type. A method
    can throw an unchecked exception without forcing its callers to establish an error-handling
    policy. Unchecked exceptions extend the RuntimeException class. Common unchecked
    exceptions include NullPointerExceptions, IllegalArgumentArgumentExceptions, and
    ClassCastExceptions.


    ## Checked Exceptions


    Checked exceptions represent a defect that occurs outside of the control of the
    application, such as opening a file that doesn''t exist or connecting to a database
    with invalid credentials. A method that throws a checked exception forces its
    callers to establish an error-handling policy. Callers must either surround the
    method in a try/catch block or add the exception to its method declaration to
    push the responsibility further up the call stack. Checked exceptions extend the
    Exception class. Common checked exceptions include IOExceptions, FileNotFoundExceptions,
    and InterruptedExceptions.


    # Unchecked Exceptions vs Checked Exceptions


    Checked exceptions have been a source of contention in the Java community because
    they are frequently misused. The official documentation states: “If a client can
    reasonably be expected to recover from an exception, make it a checked exception.
    If a client cannot do anything to recover from the exception, make it an unchecked
    exception.” When in doubt, unchecked exceptions are preferred because it allows
    clients to choose whether or not an error-handling policy is appropriate.


    # Errors


    An Error is thrown by the JVM to indicate that a fatal condition has occurred.
    Errors extend the Throwable class directly, which gives them the behavior of unchecked
    exceptions. Common errors include OutOfMemoryErrors or StackOverflowErrors.


    # Try/Catch/Finally


    Java provides three keywords that are used to establish an error-handling policy.
    The try keyword delineates a block of code that might throw an exception. The
    catch keyword designates a handler for a specific type of exception. An exception
    that is thrown within a try block will be caught by the first catch block whose
    exception type either matches the thrown exception or is a superclass of the thrown
    exception.


    The finally keyword delineates a block of code that will be invoked regardless
    of whether or not an exception was thrown. A finally block is generally used to
    provide clean cleanup operations. For example, code that attempts to update a
    database might be surrounded with a finally block because the database connection
    should be closed regardless of whether or not the update was successful.


    EXCEPTIONS


    ## Try-With-Resources

    Java 7 introduced the `try-with-resources` statement, which allowed resources
    that implement the `AutoCloseable` interface to be declared as parameters inside
    of the try block. When the try block completes, the JVM will automatically call
    the close() method on those resources, eliminating the need for a finally block.


