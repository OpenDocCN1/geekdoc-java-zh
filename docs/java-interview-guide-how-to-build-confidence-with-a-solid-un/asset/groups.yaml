    ## ASPECT-ORIENTED PROGRAMMING


    Each delegated method provides a join point that can be surrounded by logging
    code.


    This proxy could be passed to any method that accepts a List. However, one limitation
    of interface proxies is that any self-invoked method inside the composed object
    will not be proxied. For example, if the `remove()` method in ArrayList internally
    calls the `get()` method, that call will not be logged because the join point
    will never be invoked.


    ## Inheritance Proxies


    An object that is not-final can be proxied by another class that extends it. For
    example, in order to log every method call on an ArrayList, you could create a
    ProxyList that extends ArrayList and overrides every method with a delegated call
    to `super()`. Each overridden method provides a join point that can be surrounded
    by logging code.


    This proxy could be passed to any method that accepts a List or an ArrayList.
    However, one limitation of inheritance proxies is that final classes and final
    methods cannot be proxied.


    ## Runtime Weaving vs Binary Weaving


    Weaving is the process of linking aspects and objects together. Proxy objects
    are examples of runtime weaving, which can be accomplished through pure coding
    patterns. Binary weaving injects aspects directly into bytecode. Binary weaving
    can take place at compile-time with a custom compiler or at load-time with a custom
    class loader. Binary weaving has none of the limitations of interface or inheritance
    proxies, but it usually requires the help of a dedicated library.


    ## ASPECT-ORIENTED PROGRAMMING


    ### AspectJ


    AspectJ is a widely used AOP framework with support for compile-time weaving,
    load-time weaving, and post-compile weaving for external classes. AspectJ is often
    used in conjunction with the Spring framework, which provides additional support
    for aspects as well as runtime weaving.


    ## Questions


    - What is the difference between a core concern and a cross-cutting concern?

    - What is aspect-oriented programming?

    - What is the difference between an interface proxy and an inheritance proxy?

    - What is the difference between runtime weaving and binary weaving?

    - What is the AspectJ library?


    ## Unit Testing


    ### Test-Driven Development


    Test-driven development encourages loosely coupled, highly cohesive, and frequently
    tested modules of code. The TDD cycle begins by writing an automated test case
    for functionality that doesn''t exist. Then, a developer produces the minimum
    amount of code needed to make the test succeed. As more and more test cases are
    added, a comprehensive test suite emerges that can detect and prevent bugs caused
    by new functionality.


    TDD can also be applied to bug fixing. Writing a test case before fixing a bug
    will determine whether a fix was effective and at the same time guarantee that
    the bug will never resurface.


    ## Unit Tests


    A unit test relies on assertions to verify the behavior of code. An assertion
    throws an error if an expectation isn''t met, such as when a field doesn''t match
    an expected value. A unit test succeeds if it completes without falling any assertions
    or throwing any exceptions. Java provides the `assert` keyword, but it relies
    on JVM arguments to enable and it''s preferable to use a framework with more flexibility.
    JUnit is a popular unit testing framework that includes a rich API for assertions
    as well as support for test fixtures.


    ## Test Fixtures


    A test fixture is a fixed state of objects used as a baseline for running tests.
    For example, a test fixture could drop and recreate an in-memory database to allow
    data access tests to work on a clean set of data after every test execution.


    ## UNIT TESTING


    ### Mock Objects


    Mock objects mimic the behavior of objects that are too impractical to incorporate
    into unit tests. For example, it would be prohibitive to charge a credit card
    or launch a missile every time a unit test runs. Mock objects implement the same
    interface as the objects they mimic, allowing developers to simulate controlled
    scenarios without modifying the code that''s being tested. Mock objects can be
    created manually, but frameworks such as Mockito provide powerful proxies that
    can trace and verify the behavior of method calls.


    ## Questions


    - What is test-driven development? Why is it beneficial?

    - What is a unit test?

    - What is JUnit?

    - What are text fixtures?

    - What are mock objects?


    ## Programming Problems


    ### How to Approach Programming Problems


    During the interview you may be asked to solve high-level programming problems.
    In order to demonstrate a healthy approach to problem solving, follow these steps:


    - 1) Restate the problem to ensure that you understand it correctly.

    - 2) Provide a simple solution regardless of efficiency.

    - 3) Critique your solution and analyze it for optimizations.


    Identifying the nature of a problem can help you solve it. For example, problems
    that require repetitive steps lend themselves to recursion. Problems involving
    collections of data often utilize existing data structures. Practice solving sample
    problems and study the process of discovering a solution rather than memorizing
    the solution itself.


    ### Sample Programming Problems


    How would you write a method that calculates the factorial of a number?


    A factorial is the product of an integer and all of the integers below it (4!
    = 4*3*2*1). A factorial is a naturally recursive operation, which is apparent
    if you visualize the formula as part of the solution (4*31). The formula can then
    be converted into a recursive method call: `n * factorial(n-1)`. However, the
    first line in a recursive algorithm should define a termination condition. Here,
    an input of 1 requires no recursion because the result is simply 1.


    Recursive methods are slower loops due to the overhead of method invocations.
    A recursive method can be converted to an iterative method by creating a loop
    that steps towards the termination condition and updates the state of local variables.
    In practice, you should always favor simplicity over premature optimization, but
    in the context of an interview you should be critical as possible.


    How would you determine whether a identical palindrome?


    A palindrome is a word that is identical forwards and backwards. A simple solution
    is to reverse the string and compare it to the original. There is no reverse method
    in the String class, but you could use the `StringBuilder#reverse()` method or
    a recursive formula: `hello = o + reverse(hell)`.


    Rather than create additional String instances, a more efficient solution would
    use the String#charAt() method with pointers on both ends. If each character matches
    before the pointers converge, the string is a palindrome.


    How would you verify that the parentheses are balanced?


    In order to simplify this problem, you could ignore the irrelevant characters
    and add all of the parentheses to a string. Then, you could recursively loop through
    the string and remove every immediate pair of open and closed parentheses (())
    -> (). When the string has no more pairs, the remaining characters will determine
    if the parentheses were balanced.


    As an optimization, every time you added a closed parenthesis to the string you
    could check to see if the last character was an open parenthesis and discard them
    both. In fact, there would be no need for recursion if you did this because you
    are essentially treating the string like a stack. Knowing that, you could solve
    this problem efficiently by using an ArrayDeque to push and pop open parentheses
    and checking if the stack was empty afterwards.


    Given an unsorted list with one missing number from 1 to 100, how would you determine
    the missing number?


    The simplest solution to this problem is to iterate through the list 100 times
    and search for a specific value during each iteration. However, it''s worth criticizing
    any solution that runs in quadratic time. If you sort the list first, you could
    find the number that didn''t correspond to an appropriate index in linearithmic
    time. Faster still, you could put each value into a HashSet, and find the missing
    value in linear time.


    It''s impossible to solve this problem faster than linear time, but it''s important
    to note that time complexity only measures the growth rate of an algorithm. In
    fact, this problem can be solved more efficiently by computing the sum of all
    numbers and subtracting it from the total sum provided by the formula n(n+1)/2.
    Whenever you critique a solution, remember to take memory into consideration when
    time complexity is no longer a factor.

