    ## The Object Superclass


    Every class in Java is a descendant, directly or indirectly, of the Object class.
    The Object class provides several methods that can be optionally extended in subclasses.


    ## Clone


    The clone() method was originally designed to return a copy of an object that
    implements the Cloneable interface. A clone can either be a shallow copy, which
    shares the same references as the original object, or a deep copy, which copies
    the values of the original object into new objects. Unfortunately, overriding
    this method correctly is difficult and it provides no benefit over a copy constructor,
    which offers more flexibility and a cleaner contract.


    ## Equals


    The equals() method compares two objects for equality. The default implementation
    relies on the identity operator (==) to determine whether two objects point to
    the same address in memory. Subclasses are encouraged to override this method
    to test whether two objects contain the same information rather than the same
    location in memory. Note that if you override the equals() method you must by
    contract override the hashCode() method as well.


    ## HashCode


    The hashCode() method digests the state of an object into an integer, which is
    primarily useful for hash table data structures. By default, the hash code is
    implemented by converting the internal address of an object into an integer. The
    hash code must be consistently returned and always return equal values for objects
    that are equal according to the equals() method.


    ## ToString


    The toString() method returns a textual representation of an object, which is
    primarily useful for logging and debugging. By default, the toString() method
    returns the class of the object followed by a hexadecimal representation of its
    hash code.


    ## GetClass


    The getClass() method returns a Class object that contains information about a
    class and utility methods for reflection-based access to fields and methods. The
    getClass() method is final and cannot be overridden by subclasses.


    ## Finalize


    The finalize() method was originally designed to be invoked before an object was
    destroyed by the garbage collector. However, an object might not become eligible
    for garbage collection if it''s never dereferenced or if the application exits
    before the garbage collector runs. It''s generally discouraged to rely on this
    method for cleanup operations due to its uncertainty and the possibility that
    an object can be unintentionally revived by creating additional references to
    it.


    ## Wait, Notify, NotifyAll


    The final methods wait(), notify(), and notifyAll() provide low-level concurrency
    operations that allow communication between threads. For example, one thread could
    halt its execution until it receives a notification from another thread. Java
    provides high-level concurrent data structures in the java.util.concurrent package.


