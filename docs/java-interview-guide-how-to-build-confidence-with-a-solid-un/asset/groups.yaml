    # Algorithms


    # Big O Notation


    Big O notation measures the complexity of an operation relative to the size of
    its input.


    O(1) describes an algorithm whose complexity is independent of the input, such
    as accessing an element in an array by its index.


    O(n) describes an algorithm whose complexity increases linearly, such as iterating
    through an array.


    O(n^2) describes an algorithm whose complexity increases quadratically, such as
    comparing every element in an array to every other element in an array.


    O(log n) describes an algorithm whose complexity increases logarithmically, such
    as dividing an array in half until only one element remains.


    O(n log n) describes an algorithm whose complexity increases logarithmically,
    such as dividing an array in half and iterating through each half.


    # Binary Search


    Binary search an O(log n) algorithm that is used to find a value in a sorted list
    of items. It works by searching for a value in the middle of a list, and recursively
    discarding whichever half of the list is out of range. The result of a binary
    search is undetermined if the list is unsorted Binary search is available in the
    Arrays and Collections classes.'
  - '[PAGE 55]


    # ALGORITHMS


    # Insertion Sort


    Insertion sort is an O(n^2) average-case sorting algorithm. It works by traversing
    through a list and sorting the previous elements by swapping them in place.


    # Merge Sort


    Merge sort is a stable O(n log n) average-case sorting algorithm. It works by
    recursively dividing a list into individual sublists, and merging each sublist
    together to produce a sorted result. Merge sort is an example of a divide and
    conquer algorithm, which recursively reduces a problem to a trivial solution.


    # Quicksort


    Quicksort is an unstable O(n log n) average-case sorting algorithm. It works by
    defining a pivot and swapping elements so that lesser values appear before the
    pivot and greater values after the pivot. The remaining pivots are sorted recursively.
    As of Java 7, quicksort is the default implementation for sorting primitives in
    the Arrays class.


    # Timsort


    Timsort is a stable O(n log n) average-case sorting algorithm. Timsort is a hybrid
    algorithm derived from merge sort and insertion sort. It works by identifying
    runs of naturally sorted data or by using insertion sort to create runs of a minimum
    size. The runs are merged together in the same manner as merge sort. Timsort often
    performs fewer than O(n log n) comparisons because it takes advantage of partially
    sorted values. As of Java 7, Timsort is the default implementation for sorting
    objects in the Arrays and Collections classes.


