    # JAVA COLLECTIONS FRAMEWORK


    # Java Collections class Framework


    The Java Collections Framework (JCF) provides common data structures that implement
    the Collection interface. A collection is an abstract representation of a generic
    group of objects.


    # List


    A List is a data structure that holds an indexed collection. The ArrayList class
    uses an indexed array to hold its values. The values are copied into a larger
    array if the capacity is exceeded, but this can be avoided by specifying an initial
    capacity in the constructor. ArrayList is not thread-safe, CopyOnWriteArrayList
    is a thread-safe alternative.


    The LinkedList class uses a chain of Node objects to create a dynamically-sized
    list. A node contains a value along with a reference to the previous node and
    the next node in the chain. This allows nodes to be inserted or removed without
    reorganizing the list, but it requires iterating through the list to access an
    element by its index. LinkedList is not thread-safe, but it can be decorated by
    the Collections#synchronizedList method.


    # Map


    A Map is a data structure that associates keys with values. The HashMap class
    uses an array of linked lists to store Entry objects. An entry contains a key,
    a value, and a reference to the next entry in the chain. When you put a key/value
    pair in the map, a mathematical function such as the modulo operator (%) constrains
    the key''s hash code to an index in the array. Unique keys that map to the same
    index are linked together, but duplicate keys will overwrite the existing entries.
    When you look up a value by key, the index


