    # Unchecked Exceptions vs Checked Exceptions


    Checked exceptions have been a source of contention in the Java community because
    they are frequently misused. The official documentation states: “If a client can
    reasonably be expected to recover from an exception, make it a checked exception.
    If a client cannot do anything to recover from the exception, make it an unchecked
    exception.” When in doubt, unchecked exceptions are preferred because it allows
    clients to choose whether or not an error-handling policy is appropriate.


    # Errors


    An Error is thrown by the JVM to indicate that a fatal condition has occurred.
    Errors extend the Throwable class directly, which gives them the behavior of unchecked
    exceptions. Common errors include OutOfMemoryErrors or StackOverflowErrors.


    # Try/Catch/Finally


    Java provides three keywords that are used to establish an error-handling policy.
    The try keyword delineates a block of code that might throw an exception. The
    catch keyword designates a handler for a specific type of exception. An exception
    that is thrown within a try block will be caught by the first catch block whose
    exception type either matches the thrown exception or is a superclass of the thrown
    exception.


    The finally keyword delineates a block of code that will be invoked regardless
    of whether or not an exception was thrown. A finally block is generally used to
    provide clean cleanup operations. For example, code that attempts to update a
    database might be surrounded with a finally block because the database connection
    should be closed regardless of whether or not the update was successful.'
