    # Interview Preparation


    ## Before the Interview


    The best way to prepare for an interview is to study. You only have a short time
    to convince someone that you''re worth hiring, so you want to appear knowledgeable
    and confident. Keep in mind that some topics may be outside the scope of this
    guide, such as relational databases, front end web development, or algorithm design.
    Try not to get overwhelmed by the amount of information out there. The majority
    of interviewers believe that a candidate with strong fundamentals is capable of
    learning new technologies quickly.


    Before your interview, get a good night''s sleep, eat a healthy breakfast, and
    wear a suit to look your best. Confirm your appointment and plan to arrive at
    least a half hour early. If you are doing a phone interview, charge your phone,
    bring a bottle of water, and find a quiet place where you won''t get distracted.


    ## During the Interview


    A technical interview usually begins with casual questions about your background,
    as such:


    - Could you tell us about yourself and your experience?

    - Could you tell us about any side projects you''ve worked on?

    - Could you tell us about a time you solved a particularly challenging problem?

    - Could you tell us about a time you resolved a disagreement with a coworker?

    - What was your previous development environment like?

    - Why are you interested in working at our company?

    - Why are you leaving your previous job?

    - What is your biggest weakness? What is your biggest strength?


    During the technical interview, do your best to answer the interviewer''s questions
    in your own words. If you are unfamiliar with a topic, it''s much better to admit
    that rather than bullshit your way through it. If you are on the phone, don''t
    try to look up an answer on google. It''s exceedingly obvious when a candidate
    stands out, taps away on their keyboard, and spits out a flawless response thirty
    seconds later.


    During the wrap up, you will usually be asked if you have any questions? You should
    always ask at least one, but never ask about salary or benefits. You are trying
    to advertise what you can do for a company, not what company can do for you. Some
    examples questions are:


    - What is the culture like at your company?

    - What is the development environment like at your company?

    - What is the software development lifecycle at your company?

    - Is there anything about me that you are concerned about?

    - Is there anything I should learn while waiting for your response?

    - What was the correct answer to <a question that you missed>

    - What are the next steps?


    ## After the Interview


    Every interview is a learning experience. Regardless of whether or not you get
    the job, you''ll gain valuable knowledge about the interview process. Write down
    all of the the questions you were asked and the ones that were difficult for you.
    They will be a valuable resource in the future, especially when you are the one
    conducting the interviews!


    Have fun, and good luck!


    # Interview Questions


    ### The Java Programming Language

    - What is the WORA principle? Why is it beneficial?

    - How can Java applications run on multiple platforms?

    - What is the difference between the JRE and the JDK?

    - What is the difference between procedural programming and object-oriented programming?


    ### Object-Oriented Concepts

    - What is the purpose of abstraction in software development?

    - What is encapsulation? How does Java support it?

    - What is polymorphism? How does Java support it?

    - What is the difference between a mutable object and an immutable object?

    - How can you design an object to be immutable?

    - What is the difference between coupling and cohesion?

    - What is the preferred relationship between software components and why?


    ### Object-Oriented Programming (Part I)

    - What is the difference between a class and an object?

    - What happens when an object is instantiated for the first time?

    - What is the difference between a primitive type and an object?

    - What is the difference between autoboxing and unboxing?

    - What is an array?

    - How is a String different from a regular object?

    - What is the difference between a StringBuilder and a StringBuffer?

    - Why are enums superior to String or Integer constants?

    - What is the difference between package-by-layer and package-by-feature?


    ### Object-Oriented Programming (Part II)

    - What is the difference between a method declaration and a method signature?

    - What is a recursive method?

    - What is the final keyword used for?

    - What is the static keyword used for?

    - Why can''t a static method access a nonstatic field?

    - What are access modifiers used for? What are the different types?

    - What are annotations used for?


    ### The Object Superclass

    - What is the difference between a shallow copy and a deep copy?

    - Why is a copy constructor preferable to the clone method?

    - What is the difference between the identity operator and the equals() method?

    - What is the relationship between the hashCode() method and the equals() method?

    - What is the default implementation of the toString() method?

    - Why is the finalize() method unreliable for cleanup operations?


    ### Composition & Inheritance

    - What is the difference between composition and inheritance?

    - What is the difference between method overriding and method overloading?

    - How would you determine whether to use composition or inheritance?


    ### Abstract Classes & Interfaces

    - What is the difference between an abstract class and an interface?

    - How would you determine whether to use an abstract class or an interface?

    - Why can''t a class be declared both final and abstract?

    - What is the value of designing a codebase around the use of interfaces?

    - What are anonymous classes used for?

    - What is a closure?

    - What is a lambda expression?


    ### Exceptions

    - What is an exception?

    - What is the difference between an unchecked and a checked exception?

    - How would you determine whether to use an unchecked or a checked exception?

    - How does a try/catch/finally block work?

    - How does the try-with-resources statement work?


    ### Generics

    - What is the difference between a compile-time error and a runtime error?

    - What is the purpose of generics?

    - What are the different types of generic wildcards?

    - What is type erasure?

    - What are some of the limitations of generics?


    ### Concurrency

    - What is the lifecycle of a Thread?

    - Why is synchronization necessary on shared resources?

    - What is used as a lock for synchronized static and synchronized non-static methods?

    - What would happen if two different threads hit two synchronized non-static methods
    on the same object simultaneously?

    - What would happen if two different threads hit a synchronized static method
    and synchronized non-static method on the same object simultaneously?

    - What one thing does the volatile keyword guarantee about a variable?

    - What two things does the synchronize keyword guarantee about a block of code?

    - What are some built-in concurrent data structures?

    - What is the executor framework?

    - What is a ThreadLocal variable?

    - What are atomic variables?


    ### Memory Management

    - How does the JVM divide memory on the heap?

    - What is the standard algorithm for garbage collection?

    - What are memory leaks? How can they be identified?

    - What are the four different types of references?

    - What is a ReferenceQueue?

    - Why is a phantom reference safer than using the finalize() method?


    ### Java Database Connectivity

    - What is JDBC?

    - What are the two ways of acquiring a Connection object?

    - What is the difference between the three types of Statements?

    - What is a ResultSet?

    - What is an SQL injection attack? How can it be prevented?

    - What are the advantages and disadvantages of object-relational mapping?

    - What is Hibernate?


    ### Web Applications

    - What is a servlet container?

    - What is a web application?

    - What is a WAR file?

    - What is a web.xml file?

    - What is the difference between a Servlet and an HttpServlet?

