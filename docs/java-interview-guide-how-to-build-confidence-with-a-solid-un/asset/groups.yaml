    # Phantom References


    A phantom reference is an object that is wrapped inside of a PhantomReference
    container. However, invoking the get( ) method on a PhantomReference will always
    return null. A phantom reference in conjunction with a reference queue provides
    a safer alternative to the finalize( ) method because there is no possibility
    of reviving a dead object with new references.


