    ## 关于作者


    Anthony DePalma 是一位 Java 爱好者，曾在财富 500 强企业进行过 100 多场面试。当他不在编程时，你可以发现他在新泽西美丽的海浪中冲浪。他与妻子和两只猫住在海边。《Java
    Interview Guide》是他的第一本书。


    更多信息请访问：

    www.javainterviewguide.com


    技术面试可能是一次令人痛苦的经历。你只有很短的时间来说服别人你值得被雇用，因此你负担不起在没有准备的情况下参加面试。遗憾的是，仅仅背诵面试题的答案是不够的。你需要理解底层的概念。


    这本书是一份全面的指南，将帮助你准备 Java 面试。我曾在财富 500 强企业中进行过 100 多场面试，并精心收集了最有效的问题，并配有简单直观的解释。


    这本书将以面试所需的节奏教授你面向对象概念、数据结构、设计模式和算法，包含超过 150 个对应问题。我承诺，如果你彻底阅读它，将提升你的信心和谈判筹码。


    技术面试是一个向潜在雇主展示你价值的稀有机会。你对自己负责，阅读这份指南并充分利用它！


