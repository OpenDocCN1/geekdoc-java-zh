    # Java Database Connectivity


    The Java Database Connectivity (JDBC) API is an interface for querying and updating
    a database.


    # Connection


    The Connection interface encapsulates the communication to a database. A Connection
    is provided by either a DriverManager or a DataSource. A DriverManager requires
    connection details such as the url and credentials, but a DataSource hides the
    connection details behind an interface. A DataSource is usually provided by an
    application server through a lookup service called the Java Naming and Directory
    Interface (JNDI). DataSources are preferable to DriverManagers because they are
    more flexible and easier to change.


    # Statements


    Statements are provided by a Connection to encapsulate SQL queries. PreparedStatements
    are pre-compiled by the database and improve performance for queries that are
    executed repeatedly or contain input parameters. CallableStatements are used to
    execute stored procedures that contain both input and output parameters.


    # ResultSets


    ResultSets are provided by Statements to encapsulate the result of a query. A
    ResultSet contains a cursor that can scroll through rows and extract type-safe
    values. ResultSets can be configured to support bidirectional scrolling as well
    as row modifications depending on the capabilities of the database.


    # SQL Injection


    SQL injection is a popular attack vector that allows malicious queries to be embedded
    into Statements that were constructed out of string concatenations. SQL injection
    can be prevented by using PreparedStatements to register input values.


    # Object-Relational Mapping


    Object-relational mapping (ORM) is a technique that bridges the gap between objects
    and relational databases. An ORM decouples the persistence layer of an application
    by generating SQL queries automatically. However, the relationship between objects
    and tables needs to be defined through configuration files, and it can be difficult
    to map complicated object hierarchies or address performance concerns for queries
    that are automatically generated. Hibernate is a popular ORM tool that is often
    used in conjunction with the Spring framework.


    # Questions


    What is JDBC?


    What are the two ways of acquiring a Connection object?


    What is the difference between the three types of Statements?


    What is a ResultSet?


    What is an SQL injection attack? How can it be prevented?


    What are the advantages and disadvantages of object-relational mapping?


    What is Hibernate?


    # Web Applications


    A web application is software that is delivered by a server and rendered by a
    browser. Java provides support for web applications through the Servlet API.


    # The Servlet API


    The Servlet API provides the specification for a servlet container. A servlet
    container handles an HTTP request by delegating the request to a web application,
    which in turn delegates the request to a Servlet.


    A web application is packed into a web archive called a WAR file. A WAR file contains
    classes, libraries, and a deployment descriptor called web.xml. A deployment descriptor
    is a configuration file that describes how an application should be deployed.
    For example, the web.xml file tells the servlet container which URL patterns map
    to Servlets.


    # Servlets


    Servlets are singleton objects that are managed by a servlet container. The container
    invokes the init() method when the servlet is initially loaded. Incoming requests
    are delegated to the service() method concurrently. Finally, the container invokes
    the destroy() method when the application is shutting down.


    HttpServlet is a Servlet implementation that contains methods corresponding to
    HTTP requests, such as doGet(), doPost(), doPut(), and doDelete(). HttpServlet
    provides access to request parameters as well as a session object that can store
    state across requests. Sessions are correlated by an identifier that is stored
    in a cookie by the browser.


    # JavaServer Pages


    Servlets are notoriously clumsy at constructing HTML documents through Java code.
    JavaServer Pages (JSP) are text documents that contain static and dynamic content
    through the use of tags and a unified expression language (EL). JSPs are compiled
    into Servlets and have implicit access to the request and response objects.


    Servlets and JSPs frequently work together through a RequestDispatcher. A RequestDispatcher
    transfers control of a request from one resource to another. For example, a servlet
    typically handles the logic for a request and delegates to a JSP to render the
    response.


    # Filters


    Filters intercept servlet requests to provide cross-cutting functionality. For
    example, a security filter could redirect unauthenticated users to a login page.
    Filters are mapped to URL patterns in the deployment descriptor.


    # Model-View-Controller


    Model-view-controller (MVC) is a design pattern that encourages the separation
    of concerns in a web application. The model represents domain objects, such as
    data retrieved from a database. The view is a visualization of the model, such
    as a JSP that constructs an HTML document. The controller facilitates changes
    to the model, such as a Servlet that handles the submission of a form. Multiple
    frameworks exist to facilitate the MVC pattern, such as Spring MVC.


    # Questions


    What is a servlet container?


    What is a web application?


    What is a WAR file?


    What is a web.xml file?


    What is the difference between a Servlet and an HttpServlet?


    What is the difference between a Servlet and a JSP?


    What is a servlet filter?


    What is the model-view-controller pattern?


    # Web Services


    # Service-Oriented Architecture


    Service-oriented architecture (SOA) is a pattern that provides services to clients
    over a network. Services span a wide array of applications, including delivering
    emails to generating random numbers.


    # Web Services


    A web service is an implementation of SOA over the internet. Web services expose
    a contract that is independent of platforms or programming languages. The two
    most popular implementations are Simple Object Access Protocol (SOAP) and Representational
    State Transfer (REST).


    # SOAP


    SOAP is a communication protocol that uses XML to define a Services Description
    Language (WSDL). The API described by WSDL documents can be parsed by consumers
    to generate classes automatically. The Java API for XML Web Services (JAX-WS)
    provides the specification for producing SOAP-based web services via annotations.
    Apache CXF is a popular open source implementation of JAX-WS.


    # REST


    REST is a pattern for designing web services that rely on the HTTP protocol alone.
    REST web services expose meaningful URLs that utilize the GET, POST, PUT, and
    DELETE methods to access resources. REST architecture does not specify a standard
    data format, but JSON is frequently used as a lightweight alternative to XML.
    The Java API for RESTful Web Services (JAX-RS) provides the specification for
    producing REST-based web services via annotations. Jersey is a popular open source
    implementation of JAX-RS.


    # SOAP vs REST


    SOAP web services are useful when a rigid contract is required to support complex
    operations between tightly coupled systems. REST web services are more flexible,
    but the lack of a WSDL document can be prohibitive for complex services. SOAP
    web services are generally slower than REST due to the verbosity of XML payloads.


    # Questions


