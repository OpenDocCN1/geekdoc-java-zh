    # 并发


    Java 通过使用线程支持并发编程。线程是应用程序中的单一执行路径。JVM 通常作为单进程启动，产生多个共享其资源的线程。修改共享资源的线程必须经过协调以防止不可预测的行为。


    # 线程生命周期


    线程通过实例化 `Thread` 类的子类，或通过带有 `Runnable` 参数实例化 `Thread` 对象来产生。当调用 `start()` 方法时，线程进入可运行状态。JVM
    使用基于优先级的调度算法来决定执行哪个线程。当调度程序调用 `run()` 方法时，线程进入运行状态。然而，如果需要获取锁或等待另一个线程的通知，线程可能会到阻塞状态。线程在
