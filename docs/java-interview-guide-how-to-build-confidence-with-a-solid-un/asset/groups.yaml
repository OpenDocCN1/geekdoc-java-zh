    # Pros and Cons


    Reflection is a powerful tool that plays a crucial role in countless extensions

    to the Java library, such as test frameworks, IoC containers, ORM mappers,

    profilers, and debuggers. On the other hand, Java is a strongly-typed

    language that provides robust compile-time checking, and much of that

    protection is lost with reflection. Reflection also breaks encapsulation

    by allowing access to fields and methods outside of their intended scope.

    Finally, reflection has slower performance than non-reflective code

    due to the additional overhead on the JVM.'
