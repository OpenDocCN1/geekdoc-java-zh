    # 面试准备


    ## 面试之前


    准备面试最好的方法就是学习。你只有很短的时间来说服别人你值得被雇，因此你希望表现得博学且自信。请记住，某些主题可能超出了本指南的范围，例如关系型数据库、前端
    Web 开发或算法设计。尽量不要被海量的信息所淹没。大多数面试官认为，基础扎实的候选人能够快速学习新新技术。


    在面试之前，请保证充足的睡眠，吃一顿健康的早餐，并穿西装以展现最佳状态。确认你的预约时间，并计划提前半小时到达。如果是参加电话面试，请给手机充电，带一瓶水，并找一个不会被打扰的安静地方。


    ## 面试期间


    技术面试通常从关于背景的闲聊问题开始，例如：


    - 你能介绍一下你自己和你的经验吗？

    - 你能介绍一下你做过的个人项目吗？

    - 你能介绍一次你解决特别挑战性问题的经历吗？

    - 你能介绍一次你与同事解决分歧的经历吗？

    - 你之前的开发环境是怎样的？

    - 为什么对在我们公司工作感兴趣？

    - 为什么要离开上一份工作？

    - 你最大的缺点是什么？你最大的优势又是什么？


    在技术面试期间，尽力用你自己的语言回答面试官的问题。如果你对某个主题不熟悉，承认这一点比胡说乱道要好得多。如果你是在打电话，不要不要尝试在 Google 上查找答案。当一个候选人脱颖而出、在键盘上敲击，并在三十秒后吐出一个完美的回答时，那是极其显而易见的。


    在结束阶段，你通常会被问及是否有任何问题？你应该至少问一个，但永远不要询问薪水或福利。你是在推销你能为公司做什么，而不是公司能为你提供什么。示例问题包括：


    - 公司的文化是怎样的？

    - 公司的开发环境是怎样的？

    - 公司的软件开发生命周期是怎样的？

    - 关于我，有什么让你担心的地方吗？

    - 在等待您的回复期间，我应该学习什么吗？

    - <你漏掉的问题> 的正确答案是什么？

    - 下一步计划是什么？


    ## 面试之后


    每一次面试都是一次学习经历。无论你是否获得工作，你都会获得关于面试流程的价值知识。写下所有你被问到的问题以及对你来说困难的问题。它们将是你未来宝贵的资源，尤其是当你成为面试官时！


    祝得开心，好运！


    # 面试题


    ### Java 编程语言

    - 什么是 WORA 原则？它有什么好处？

    - Java 应用如何在多个平台上运行？

    - JRE 和 JDK 之间有什么区别？

    - 过程编程和面向对象编程有什么区别？


    ### 面向对象概念

    - 软件开发中抽象目的是目的是？

    - 什么是封装？Java 如何支持它？

    - 什么是形态？Java 如何支持它？

    - 可变对象和不可变对象有什么区别？

    - 如何设计一个不可变对象？

    - 耦合和内聚之间有什么区别？

    - 软件组件之间倾向的关系是什么？为什么？


    ### 面向对象编程（第一部分）

    - 类和对象之间有什么区别？

    - 对象第一次被实例化时会发生什么？

    - 基本类型和对象之间有什么区别？

    - 自动装箱（autoboxing）和拆箱（unboxing）有什么区别？

    - 什么是数组？

    - String 与普通对象有什么区别？

    - StringBuilder 和 StringBuffer 之间有什么区别？

    - 为什么枚举（enums）比 String 或 Integer 常量更好？

    - 按层包（package-by-layer）和按功能包（package-by-feature）有什么区别？


    ### 面向对象编程（第二部分）

    - 方法声明（method declaration）和方法签名（method signature）有什么区别？

    - 什么是递归方法？

    - final 关键字作用什么？

    - static 关键字作用什么？

    - 为什么静态方法不能访问非静态字段？

    - 访问修饰符作用什么？有哪些不同的类型？

    - 注解（annotations）作用什么？


    ### 对象超类

    - 浅拷贝和深拷贝有什么区别？

    - 为什么拷贝构造函数比 clone 方法更好？

    - 标识操作符（==）和 equals() 方法之间有什么区别？

    - hashCode() 方法和 equals() 方法之间是什么关系？

    - toString() 方法的默认实现是什么？

    - 为什么 finalize() 方法在清理操作中不可靠？


    ### 组合与继承

    - 组合和继承之间有什么区别？

    - 方法重写（overriding）和方法重载（overloading）有什么区别？

    - 你如何决定使用组合还是继承？


    ### 抽象类与接口

    - 抽象类和接口之间有什么区别？

    - 你如何决定使用抽象类还是接口？

    - 为什么一个类不能同时声明为 final 和 abstract？

    - 围绕接口设计代码库的价值是什么？

    - 匿名类作用什么？

    - 什么是闭包（closure）？

    - 什么是 lambda 表达式？


    ### 异常

    - 什么是异常？

    - 未检异常（unchecked exception）和检异常（checked exception）有什么区别？

    - 你如何决定使用未检异常还是检异常？

    - try/catch/finally 块是如何工作的？

    - try-with-resources 语句是如何工作的？


    ### 泛型

    - 编译时错误和运行时错误有什么区别？

    - 泛型的目的是什么？

    - 泛型通配符有哪些不同的类型？

    - 类型擦除（type erasure）是什么？

    - 泛型的局限性有哪些？


    ### 并发

    - 线程（Thread）的生命周期是什么？

    - 为什么共享资源需要同步（synchronization）？

    - 静态方法和 synchronized 非静态方法使用什么作为锁？

    - 如果两个不同的线程同时访问同一个对象上的两个 synchronized 非静态方法，会发生什么？

    - 如果两个不同的线程同时访问同一个对象上的一个静态方法和一个非静态方法，会发生什么？

    - volatile 关键字对变量保证了哪一点？

    - synchronize 关键字对代码块保证了哪一点？

    - 有哪些内置的并发数据结构？

    - 什么是执行器框架（executor framework）？

    - 什么是 ThreadLocal 变量？

    - 什么是原子变量（atomic variables）？


    ### 内存管理

    - JVM 如何划分堆（heap）？

    - 标准的垃圾收集算法是什么？

    - 什么是内存泄漏？如何识别它们？

    - 引用的四种类型是什么？

    - 什么是 ReferenceQueue？

    - 为什么虚引用（phantom reference）比使用 finalize() 方法安全？


    ### Java 数据库连接

    - 什么是 JDBC？

    - 获取 Connection 对象的两种方法？

    - 三种 Statement 类型之间有什么区别？

    - 什么是 ResultSet？

    - 什么是 SQL 注入攻击？如何防止？

    - 对象关系映射（ORM）的优缺点是什么？

    - 什么是 Hibernate？


    ### Web 应用

    - 什么是 servlet 容器？

    - 什么是 Web 应用？

    - 什么是 WAR 文件？

    - 什么是 web.xml 文件？

    - Servlet 和 HttpServlet 之间有什么区别？


