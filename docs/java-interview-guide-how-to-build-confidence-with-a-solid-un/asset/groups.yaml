    # 反射


    反射允许程序在运行时操作对象，而无需在编译时了解该对象。例如，如果你想调试一个没有重写 `toString()` 方法的对象，可以使用反射来检查每一个字段。反射之所以可能，是因为存在一组代表编程结构的类，如
    `Class`、`Field` 和 `Method`。


    # Class


    `Class` 是由 JVM 构建的特殊对象，代表应用程序中的类和接口。如果你将类文件视为对象的蓝图，那么可以将 `Class` 类视为“蓝图的蓝图”。可以通过调用
    `getClass()` 方法从对象获取 `Class` 实例，也可以通过 `Class#forName()` 方法通过其全限定名进行查找。


    `Class` 为对象提供了类型内省。类型内省允许程序在运行时检查对象的属性。例如，`Class` 对象包含了内省方法，如 `getName()`、`getDeclaredFields()`
    和 `getDeclaredMethods()`。`Class` 还可以使用 `newInstance()` 方法创建对象。这在需要实例化 XML 文件定义的对象的框架中被广泛使用。


    # Field


    `Field` 提供了对类或接口中单个字段的访问。`Field` 包含了内省方法，允许你从字段中获取值，同时也包含了反射方法，允许你向字段中设置值。然而，必须通过
    `setAccessible()` 方法在 `Field` 对象上设置标记，以允许访问可见性有限的字段。


    # Method


    `Method` 对象提供了对类或接口中单个方法的访问。`Method` 包含了内省方法，可以提供有关方法声明的信息，同时也包含了反射方法，允许你调用该方法。然而，必须通过
    `setAccessible()` 方法在 `Method` 对象上设置标记，以允许访问可见性限制的方法。


    # 优缺点


    反射是一种强大的工具，在 Java 库的无数扩展中起着至关重要的作用，例如测试框架、IoC 容器、ORM 映射器、性能分析器和调试器。另一方面，Java 是一种强类型语言，提供了稳健的编译时检查，而这种保护在反射中很大会丢失。反射还允许访问预期范围之外的字段和方法，从而破坏了封装。最后，由于
    JVM 上的额外开销，反射的性能比非反射代码慢。


