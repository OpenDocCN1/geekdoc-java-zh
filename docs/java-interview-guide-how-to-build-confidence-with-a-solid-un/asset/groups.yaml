    ## 编译时错误 vs 运行时错误


    编译时错误是阻止程序编译的错误。运行时错误是在执行期间发生的错误，例如非法类型转换。编译时错误更容易修复。运行时错误更难检测并可能导致不可预测的行为，因此应在编译阶段尽可能捕获。


    # 泛型


    泛型的引入是为了防止由于类型转换引起的运行时错误。例如，泛型是为了类型安全。如果没有泛型，实现 `List` 将需要类型转换。


    ## 泛型通配符


    与数组不同，泛型是不变的，这意味着泛型对象不共享相同的关系。例如，泛型上界通配符 `? extends Number` 允许 `Number` 类型及其所有子类。下界通配符
    `? super Number` 允许 `Number` 类型及其所有父类。


    # 类型擦除


    为了保持后兼容性，泛型类型被编译器移除并替换为对象转换，这一过程被称为类型擦除。类型擦除消除了重新编译旧代码的需求，但也引入了一些限制。例如，泛型异常是不允许的，因为
    `catch` 块无法区分 `GenericException<String>` 和 `GenericException<Integer>`。


