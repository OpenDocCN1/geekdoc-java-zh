    # 控制反转


    控制反转（IoC）是一种将软件组件与其依赖项解耦的模式。例如，一个密码找回服务可能需要访问一个可以发送电子邮件的服务。一个控制其依赖项的密码服务需要直接实例化并配置电子邮件服务。而一个对依赖项具有反转控制的密码服务将由其他对象提供电子邮件服务。放弃对依赖项控制的服务更加灵活，因为可以在不更改服务任何代码的情况下提供不同的实现。例如，在测试期间可以注入一个模拟电子邮件服务，以避免发送邮件或模拟失败。


    # 服务定位器 vs 依赖注入


    IoC 的两种常见实现方式是服务定位器模式和依赖注入。服务定位器为对象请求依赖项提供了一个中心存储库。依赖注入进一步利用了反转原则，允许容器通过构造函数参数或
    setter 方法直接将依赖项注入到组件中。


    # 构造函数注入 vs 注入


    构造函数注入要求组件为每个依赖项声明一个带有参数的构造函数。这允许任何初始化逻辑在构造函数中运行，但具有多个依赖项的组件可能有复杂的构造函数声明。Setter注入要求组件为每个依赖项声明
    setter 方法。Setter注入更加灵活，但任何初始化逻辑必须在所有依赖项注入之后进行。在任何情况下，都需要一个容器来管理组件与其依赖项之间的关系。


    # Spring 容器


    Spring 框架是 Java 语言最流行的扩展之一。尽管 Spring 库已扩展到许多领域，该库的核心是一个依赖注入容器。Spring 容器负责实例化、配置并将组件（称为
    bean）注入到运行中的应用程序。


    # Spring 配置


    Spring 容器需要配置来定义 bean 及其在应用程序中的关系。配置可以以 XML、注解或 Java 代码的形式提供。XML 配置由于其直观性被广泛使用，但它容易受到重构错误的影响，因为类和包名通常会发生变化。注解提供了
    XML 的替代方案，但生成的配置是分散的，任何更改都要求修改源码。Java 配置文件结合了 XML 的集中配置和注解的便利性，但缺乏 XML 提供的某些灵活性。


    # Spring 生命周期


    Spring 容器通过使用可用配置选项之一实例化 `ApplicationContext` 开始。容器实例化所有 bean，并通过构造函数注入、setter
    注入或反射注入它们的依赖项。最后，容器会调用 bean 上挂钩到生命周期的回调方法。例如，容器将在任何实现 `InitialBean` 的 bean 上调用
    `afterPropertiesSet()`。


    # 问题


    什么是控制反转模式？


    服务定位器和依赖注入有什么区别？


    构造函数注入和 setter 注入有什么区别？


    什么是 Spring 容器？


    配置 Spring 容器有哪些方法？


    Spring 容器的生命周期是什么？


    # 切面面向编程


    # 核心关注 vs 横切关注


    核心关注是对应用程序业务逻辑有贡献的工作单元，例如在数据库中存储记录或生成报告。横切关注是跨越核心关注并支持应用程序的功能，例如日志记录或缓存。


    # 切面面向编程


    切面面向编程（AOP）通过切面（aspects）的使用隔离横切关注。切面的工作方式是针对一个方法（称为连接点，join point）并在周围封装额外的代码。连接点由一个称为切点（pointcut）的表达式确定。例如，为了找到应用程序中最慢的方法，你可以声明一个针对所有公共方法的切点，并比较每个连接点执行前后的时间。


    # 代理对象


    实现切面面向编程的一种简单方法是使用代理对象。代理是一个包装器，可以为感兴趣的对象提供额外功能。代理可以通过接口或继承来实现。


    # 接口代理


    实现接口的对象可以由实现相同接口的另一个类代理。例如，为了记录 ArrayList 的每个方法调用，你可以创建一个实现 List 的 `ProxyList`
    类，并将每个方法委托给一个私有的 `ArrayList`。


