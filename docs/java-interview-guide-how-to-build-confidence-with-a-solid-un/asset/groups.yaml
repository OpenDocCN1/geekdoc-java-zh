    # 算法


    ## 大 O 表示法


    大 O 表示法用于衡量操作相对于输入规模的复杂度。


    O(1) 描述复杂度与输入无关的算法，例如通过索引访问数组中的元素。


    O(n) 描述复杂度随输入线性增长的算法，例如遍历数组。


    O(n^2) 描述复杂度呈平方级增长的算法，例如将数组中的每个元素与数组中的其他所有元素进行比较。


    O(log n) 描述复杂度呈对数增长的算法，例如不断将数组对半直到只剩一个元素。


    O(n log n) 描述复杂度呈对数级增长的算法，例如将数组对半并对每个半部分进行遍历。


    # 二分查找


    二分查找是一种 O(log n) 算法，用于在排序的项列表中查找值。它通过在列表中间查找值，并递归地丢弃超出范围的一半列表来工作。如果列表未排序，则二分查找的结果是不确定的。Arrays
    和 Collections 类提供了二分查找方法。


    # 算法


    # 插入排序


    插入排序是一种平均复杂度为 O(n^2) 的排序算法。它通过遍历列表并通过原地交换元素来对之前的元素进行排序。


    # 合并排序


    合并排序是一种稳定的平均复杂度为 O(n log n) 的排序算法。它通过递归地将列表拆分为单个子列表，并合并每个子列表以产生排序结果。合并排序是分治算法的一个示例，该算法递归地将问题简化为平凡的解决方案。


    # 快速排序


    快速排序是一种不稳定的平均复杂度为 O(n log n) 的排序算法。它通过定义一个基准（pivot）并交换元素，使得较小的值位于基准之前，较大的位于基准之后。剩余的基准被递归排序。从
    Java 7 开始，快速排序是 Arrays 类中排序基本类型的默认实现。


    # Timsort


    Timsort 是一种稳定的平均复杂度为 O(n log n) 的排序算法。Timsort 是一种源自合并排序和插入排序的混合算法。它通过识别自然排序的数据序列（runs）或使用插入排序创建最小尺寸的序列来工作。这些序列以与合并排序相同的方式合并。由于
    Timsort 能够利用部分排序的值，其比较次数通常少于 O(n log n)。从 Java 7 开始，Timsort 是 Arrays 和 Collections
    类中排序对象的默认实现。


    # 问题


    什么是大 O 表示法？有哪些常见的例子？


    什么是二分查找？它的性能如何？


    什么是插入排序？它的性能如何？


    什么是合并排序？它的性能如何？


    什么是快速排序？它的性能如何？


    什么是 Timsort？它的性能如何？


    # JAVA 集合框架


    # Java 集合框架


    Java 集合框架 (JCF) 提供了实现 `Collection` 接口的常用数据结构。集合是泛型对象对象的抽象表示。


    # List（列表）


    List 是一个持有索引集合的数据结构。ArrayList 类使用索引数组来存储其值。如果超过了容量，则会将值复制到更大的数组中，但可以通过在构造函数中指定初始容量来避免。ArrayList
    不是线程安全的，CopyOnWriteArrayList 是一个线程安全的替代方案。


    LinkedList 类使用 Node 对象链来创建一个动态大小的列表。一个节点包含一个值，以及指向链中前一个节点和后一个节点的引用。这允许在不重组列表的情况下插入或删除节点，但需要遍历列表来通过索引访问元素。LinkedList
    不是线程安全的，但可以通过 Collections#synchronizedList 方法进行装饰。


    # Map（映射）


    Map 是一个将键与值关联的数据结构。HashMap 类使用链表数组来存储 Entry 对象。一个条目包含一个键、一个值，以及指向链中下一个条目的引用。当你将一个键/值对放入
    map 时，一个数学函数（如模运算符 `%`）会将键的哈希码限制在数组的索引上。映射到相同索引的唯一键会被链接在一起，但重复的键将覆盖现有的条目。当你通过键查找值时，会重新计算索引并检查链表中的每个条目，直到找到匹配的键。


    HashMap 要求键正确实现 `hashCode()` 和 `equals()` 方法。如果哈希值不唯一，map 的性能将会下降，因为链表将不成比例地增长。如果哈希值不一致，条目可能会在
    map 中丢失并内存内存。


    如果 HashMap 的大小超过容量的 75%，数组将翻倍并对所有条目进行重新哈希。这可以通过在构造函数中指定初始容量和负载因子来避免。HashMap 不维护条目的插入顺序，但
    LinkedHashMap 通过在辅助 LinkedList 中存储条目提供了该功能。HashMap 不是线程安全的，ConcurrentHashMap 是一个线程安全的替代方案。


    # Deque（双端队列）


    Deque（双端队列）是一种可以两端插入或检索值的数据结构。按照后进先出（LIFO）策略移除元素的双端队列称为栈。按照先进先出（FIFO）策略移除元素的双端队列称为队列。ArrayDeque
    类使用对象数组存储其值。ArrayDeque 可以作为栈或队列，在相同用途下通常优于 Stack 和 LinkedList 类。ArrayDeque 不是线程安全的，ConcurrentLinkedDeque
    是一个线程安全的替代方案。


    # Binary Search Tree（二分查找树）


    二分查找树 (BST) 是一种在分层树中排序节点的数据结构。红黑树是 BST 的一种实现，根据其位置为每个节点着色。相邻节点的颜色可以决定树是否平衡。不平衡的树会退化为
