    ## Object-Oriented Programming (Part I)


    ## Classes & Objects


    Java objects are built from a blueprint called a class. A class defines the name
    of an object, what type of state the object has in the form of fields, and what
    kind of behavior the object has in the form of methods.


    When an object is instantiated with the new keyword, the class file and all of
    its superclasses are loaded into the JVM by the system class loader. After the
    one-time initialization of the class, the object is initialized by invoking a
    special method called a constructor. A constructor performs initialization logic
    after recursively invoking all of the constructors of its superclasses. Superclasses
    must be initialized before subclasses in case a child object relies on functionality
    from a parent.


    ## Primitive Types


    A primitive type is a fixed-size data type that is predefined and reserved as
    a keyword. Primitive types serve as the building blocks for storing state in an
    object. There are eight primitive types: boolean, byte, short, int, long, float,
    double, and char. Primitive types are not objects, but every primitive type has
    a corresponding wrapper object.


    The compiler can automatically convert primitive types into their wrapper objects
    in a process called autoboxing. Conversely, the compiler can convert wrapper objects
    into their primitive types in a process called unboxing. One common pitfall from
    unboxing occurs when a null object reference is unboxed into a primitive type,
    resulting in a NullPointerException.


    ## OBJECT-ORIENTED PROGRAMMING (PART I)


    ## Arrays


    An array is an object that can hold a fixed number of values of a single type.
    The capacity of an array is defined when the array is initialized, and its elements
    can be accessed by a zero-based index. Arrays are covariant, meaning that an array
    can be cast to an array of its superclass type. For example, a String[ ] could
    be cast to an Object[ ], because the String class extends the Object class.


    ## Strings


    Strings are unique objects that are used to represent text. String values can
    be assigned without the use of the new keyword, although the compiler is actually
    creating String objects internally. Strings can be concatenated via the overloaded
    + operator, which the compiler converts into a chain of method calls on a StringBuilder
    char[ ] buffer before creating an immutable String instance. A StringBuilder (and
    thread-safe alternative StringBuilder) improves performance by modifying a mutable
    char[ ] buffer. The immutable property of strings allows the compiler to cache
    them in a process called interning.


    ## Enums


    Enums, short for enumerated types, are special classes that represent a set of
    single-instance constants. Practical applications include the days of the week,
    the status levels of a task, or the roles of a security group. Enums were introduced
    to replace String and Integer constants and they are far more powerful because
    they can contain methods, implement interfaces, and provide type safety. However,
    enums cannot be subclassed or extend any class besides the implicitly extended
    Enum class.


    17]


    ## OBJECT-ORIENTED PROGRAMMING (PART I)


    ## Packages


    Classes and other resources are organized into folders with unique namespaces
    called packages. Packages are commonly organized by two competing methodologies:
    package-by-layer and package-by-feature.


    A package-by-layer strategy groups classes together according to their layer in
    an application. For example, a package-by-layer structure might include a model,
    controller, service, dao, and utility package. Package-by-layer works for small
    applications, but it doesn''t scale well due to the large number of tightly coupled
    classes that span a relatively small number of packages.


    A package-by-feature strategy groups classes together according to their cohesiveness
    in an application. For example, a package-by-feature structure might include a
    customer, order, product, review, and report package. Package-by-feature encourages
    high modularity and loose coupling and is preferable to package-by-layer.


    ## Questions


    What is the difference between a class and an object?


    What happens when an object is instantiated for the first time?


    What is the difference between a primitive type and an object?


    What is the difference between autoboxing and unboxing?


    What is an array?


    How is a String different from a regular object?


    What is the difference between a StringBuilder and a StringBuffer?


    Why are enums superior to String or Integer constants?


    What is the difference between package-by-layer and package-by-feature?


    ## Object-Oriented Programming (Part II)


    ## Methods


    Methods contain the logic that provide an object with behavior. A method declaration
    contains a list of modifiers, a return type, a method name, a list of parameter
    types and their corresponding names, and a list of throwableable exceptions. A
    method signature is the combination of the method name as well as the types and
    order of its parameters. Note that the names of parameters are not included in
    the method signature.


    A method can invoke itself in a process called recursion. Recursion is an alternative
    to looping that provides an elegant solution for problems that naturally repeat,
    such as mathematical sequences or divide and conquer algorithms. A recursive method
    must have a termination condition that determines when the method stopping itself
    and starts returning values to previous invocations on the call stack. A recursive
    method with no termination condition will eventually cause a StackOverflowError.


    ## Pass-by-Reference vs Pass-by-Value


    The manner in which arguments are passed to methods depends on whether a programming
    language is pass-by-reference or pass-by-value. For example, imagine flying a
    kite and passing control of the kite to a friend. Pass-by-reference would be akin
    to tieing the string to them, but pass-by-value would require tying a duplicate
    string to the same kite and passing that instead. In both scenarios your friend
    could exert over the kite, but with pass-by-reference your friend has the freedom
    to change what kite points to.


    Every argument in Java is pass-by-value. With a primitive argument, the value
    of the primitive is copied and passed to the method. With an object argument,
    a pointer to the object is copied and passed to the method.


    ## OBJECT-ORIENTED PROGRAMMING (PART II)


    ## The Final Keyword


    The final keyword determines whether an object reference can be changed after
    being assigned. In the kite example, using the final keyword would be akin to
    superglue the string to your hand. The final keyword is often used in conjunction
    with the static keyword to create constants. However, it''s important to note
    that the final keyword does not prevent an object''s internal state from changing.
    The final keyword can also be applied at the class level to prevent subclasses
    from extending a class, or at the method level to prevent subclasses from overriding
    a method.


    ## The Static Keyword


    The static keyword determines whether a property belongs to a class or to an object
    instance. For example, imagine holding a blueprint for a house. Properties that
    can be unique between houses, such as the number of windows or doors, are examples
    of instance properties. Properties that can be written on the blueprint, such
    as the number of houses built, are examples of static properties. An object can
    access static properties on a class, but a class cannot access instance properties
    unless it holds a reference to an object.


    ## Access Modifiers


    Access modifiers determine the visibility of classes, fields, and methods, so
    that information can be hidden in order to reduce complexity. The four types of
    access modifiers are:


    - Public - Visible to all classes.

    - Protected - Visible to subclasses and classes in the same package.

    - <None> - Visible to classes in the same package.

    - Private - Visible to the enclosing class.


