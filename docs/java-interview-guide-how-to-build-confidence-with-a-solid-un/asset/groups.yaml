    ## 面向面向的编程


    每个委托方法都提供了一个可以被日志代码包裹的连接点（join point）。


    该代理可以传递给任何接受 `List` 的方法。然而，接口代理的一个局限性是组合对象内部的任何自调用方法都不会被代理。例如，如果 `ArrayList` 中的
    `remove()` 方法内部调用了 `get()` 方法，那么该调用将不会被记录，因为连接点永远不会被触发。


    ## 继承代理


    非最终（not-final）的对象可以由扩展它的类进行代理。例如，为了记录 `ArrayList` 上的每个方法调用，你可以创建一个扩展 `ArrayList`
    的 `ProxyList`，并重写每个方法，通过对 `super()` 的委托调用。每个重写的方法都提供了一个可以被日志代码包裹的连接点。


    该代理可以传递给任何接受 `List` 或 `ArrayList` 的方法。然而，继承代理的一个局限性是最终（final）类和最终方法无法被代理。


    ## 运行时织入 vs 二进制织入


    织入（Weaving）是将切面和对象链接在一起的过程。代理对象是运行时织入的示例，可以通过纯代码模式实现。二进制织入则将切面直接注入字节码中。二进制织入可以在编译时通过自定义编译器进行，也可以在加载时通过自定义类加载器进行。二进制织入没有接口代理或继承代理的所有局限性，但它通常需要专用库的帮助。


    ## 面向面向的编程


    ### AspectJ


    AspectJ 是一种广泛使用的 AOP 框架，支持编译时织入、加载时织入以及针对外部类的编译后织入。AspectJ 通常与 Spring 框架使用，Spring
    为切面以及运行时织入提供了额外的支持。


    ## 问题


    - 核心关注点（core concern）和交叉关注点（cross-cutting concern）之间的区别是什么？

    - 什么是面向面向的编程？

    - 接口代理和继承代理有什么区别？

    - 运行时织入和二进制织入有什么区别？

    - 什么是 AspectJ 库？


    ## 单元测试


    ### 测试驱动开发


    测试驱动开发鼓励编写松耦合、高内聚且频繁测试的代码模块。TDD 周期从为不存在的功能编写自动化测试用例开始。然后，开发者产生使测试成功的最少代码。随着越来越多的测试用例的加入，会形成一个全面的测试套件，能够检测并防止由新功能导致的
    bug。


    TDD 也可以用于修复。在修复 bug 之前编写测试用例可以确定修复是否有效，同时保证 bug 永远不会再次出现。


    ## 单元测试


    单元测试依赖断言（assertions）来验证代码的行为。如果未满足预期，断言将抛出错误，例如字段与预期值不匹配。如果单元测试在完成时没有触发任何断言或抛出任何异常，则测试成功。Java
    提供了 `assert` 关键字，但它依赖于 JVM 参数来启用，因此最好使用更灵活的框架。JUnit 是一个流行的单元测试框架，它包含了丰富的断言 API
    以及对测试固件（test fixtures）的支持。


    ## 测试固件


    测试固件（test fixture）是对象的固定状态，作为运行测试的基准。例如，测试固件可以丢弃并重建内存数据库，以便允许数据访问测试在每次测试执行后都在干净的数据集上运行。


    ## 单元测试


    ### 模拟对象（Mock Objects）


    模拟对象模仿那些因不实际而不纳入单元测试的对象的行为。例如，每次运行单元测试时都给信用卡充电或发射导弹是极其高昂的。模拟对象实现了与其所模仿的对象相同的接口，允许开发者在不修改被测试代码的情况下模拟控制场景。模拟对象可以手动创建，但像
    Mockito 等框架提供了强大的代理，可以追踪并验证方法调用的行为。


    ## 问题


    - 什么是测试驱动开发？它有什么好处？

    - 什么是单元测试？

    - 什么是 JUnit？

    - 什么是测试固件（test fixtures）？

    - 什么是模拟对象？


    ## 编程问题


    ### 如何处理编程问题


    在面试期间，你可能会被要求解决高级编程问题。为了展示健康的解决问题方法，请遵循以下步骤：


    - 1) 复述问题以确保你正确理解了它。

    - 2) 提供一个简单的解决方案，无论效率如何。

    - 3) 批判你的解决方案并对其进行优化分析。


    识别问题的本质可以帮助你解决它。例如，需要重复步骤的问题适合递归。涉及数据集合的问题通常会利用现有的数据结构。练习解决示例题，学习发现解决方案的过程，而不是记忆解决方案本身。


    ### 示例编程问题


    你会如何写一个计算数字阶乘的方法？


    阶乘是一个整数及其下方所有整数的积（4! = 4*3*2*1）。阶乘是一个自然的递归操作，如果你将公式可视化为解决方案的一部分（4*3*2*1），这一点是显而易见的。该公式可以被转换为递归方法调用：`n
    * factorial(n-1)`。然而，递归算法的第一行应该定义一个终止条件。在这里，输入为 1 不需要递归，因为结果仅仅是 1。


    由于方法调用的开销，递归方法比循环要慢。可以通过创建一个向终止条件迈进并更新局部变量状态的循环，将递归方法转换为迭代方法。在实践中，你应该始终优先考虑简单性优于过早优化，但在面试语境下，你应该尽可能保持批判性。


    你会如何判断一个字符串是否是回文？


    回文是一个正向读和反向读都相同的单词。一个简单的解决方案是反转字符串并与原始字符串进行比较。String 类没有反转方法，但你可以使用 `StringBuilder#reverse()`
    方法或递归公式：`hello = reverse(hell)`。


    与其创建额外的 实例，更有效的解决方案是使用带有双指针的 `String#charAt()` 方法。如果指针在汇合前每个字符都匹配，则该字符串是回文。


    你会如何验证括号是否平衡？


    为了简化这个问题，你可以忽略无关字符并将所有的括号添加到字符串中。然后，你可以递归地遍历字符串并移除每一对相邻的开闭括号 ()。当字符串不再有配对时，剩余的字符将决定括号是否平衡。


    作为一种优化，每当你向字符串添加闭括号时，都可以检查上一个字符是否是开括号并丢弃它们。事实上，如果这样做，就不需要递归了，因为你实际上是在将字符串当作栈处理。这一点，你可以使用
    `ArrayDeque` 推入和弹出开括号，并在结束后栈是否为空。


    给定一个 1 到 100 缺失一个数字的无序列表，你会如何确定缺失的数字？


    解决问题的简单方案是遍历列表 100 次，并在每次迭代中搜索特定值。然而，应该批评任何平方时间运行的解决方案。如果你先对列表进行排序，可以在线性对数时间内找到与相应索引不符的数字。更快的方法是你可以将每个值放入
    `HashSet` 中，在线性时间内找到缺失值。


    无法比线性时间更快地解决这个问题，但重要的是，时间复杂度只衡量算法的增长率。事实上，可以通过计算所有数字之和并从由公式 $n(n+1)/2$ 提供的总和中减去它来更有效地解决这个问题。每当你批判一个解决方案时，当时间复杂度不再是因素时，记住考虑内存。


    '
