    ## 引言


    ## 本指南的目的


    本指南将帮助你应对 Java 软件开发初级或高级职位的面试。它旨在作为一份高层级的资源，并假设你已经熟悉 Java 语言并知道如何编写基础应用程序。


    本书分为几个相关概念的章节，以适合面试的颗粒呈现。每个章节的末尾都有一系列潜在的面试问题。阅读每个章节，并研究你不熟悉的主题，直到你能够自信地回答每一个问题。所有问题都再次列在书的最后。


    为了充分利用本指南的价值，请确保你能够用自己的话回答每一个问题。从面试官的角度来看，听候选人用独特的方式解释某些事情总是好的，因为这证明了你理解了底层概念。这也能让你应对同类问题的变体。你对概念的理解越深，在面试中你表现得就越自信。准备好了吗？


    ## Java 编程语言


    ## Java 的历史


    Java 是由 Sun Microsystems（太阳系统公司）于 1995 年的一种面向对象的编程语言。与 C++ 不同，它允许开发者编写可以在多个平台上运行的代码。这种原则被称为“一次编写，随运行”（WORA），它避免了开发者为不同的操作系统编写不同的应用程序。Java
    借鉴了 C++ 的大部分语法，但通过提供自动内存管理等功能以及消除多重继承等陷阱简化了开发工作。


    ## Java 虚拟机


    WORA 原则的实现归于 Java 虚拟机（JVM）。虚拟机是模拟物理机器的软件。在传统的编程语言中，代码被编译为特定平台的机器语言。在 Java 中，代码被编译为称为字节码（bytecode）的虚拟机语言。JVM
    充当字节码和底层物理机器之间的中间媒介。


    每个支持 Java 的平台都有自己的 JVM 实现。Java 应用程序是可移植的，因为每个 JVM 都遵循标准接口。JVM 和标准库的发行包称为 Java
    运行环境（JRE）。JRE 和开发工具（如编译器和调试器）的发行包称为 Java 开发包（JDK）。


    ## 过程化编程 vs 面向对象编程


    过程化编程是一种编写代码风格，通过执行一系列线性过程来产生结果。面向对象编程是一种使用对象来封装状态和行为的代码编写风格。由于其无状态的，过程化代码在小型项目或多线程环境中更容易使用，但面向对象的代码要灵活得多且更易维护。


    ## 问题


    - 什么是 WORA 原则？它有什么好处？

    - Java 应用程序如何在多个平台上运行？

    - JRE 和 JDK 之间有什么区别？

    - 过程化编程和面向对象编程之间有什么区别？


    ## 面向对象概念


    ## 抽象


    抽象是从狭窄视角感知实体的行为。例如，在教育语境下，一个人可以被简化为学生；在就业语境下，一个人可以被简化为员工。每个抽象都将人的属性减少为相关信息的子集。抽象的目标是减少软件系统的复杂性。


    ## 封装


    封装是一种通过故意隐藏信息来鼓励抽象的技术。例如，汽车发动机的机械细节被封装在方向盘和脚踏板之后。任何熟悉此接口的人都可以开车，而无需知道引擎盖下是什么种类型的引擎。Java
    通过使用接口以及提供限制类、字段和方法可见性的访问修饰符来鼓励封装。


    ## 多态态


    多态性是一种通过允许实体承担多种形式来鼓励抽象的技术。例如，智能手机是多态的，因为它可以承担相机、网络浏览器、音乐播放器或数字钟的角色。每个应用程序都向用户暴露一个相关的接口。在
    Java 中，对象可以采取其层次结构中任何父类的形式或任何接口的形式。


    ## 可变性


    可变性指的是实体改变其状态的能力。iPod 是可变实体的例子，因为它的内容经常变化。黑胶唱片是不可变实体的例子，因为它的内容是永久刻制的。不可变对象在软件应用程序中提供了许多好处，例如稳定性和线程安全。String
    和所有原始类型包装类都是不可变对象的示例。为了使一个对象变为不可变，该类必须是 `final` 的，所有字段必须是 `final` 的，并且不能暴露任何可变字段或修改可变字段的方法。


    ## 耦合


    耦合指的是实体之间依赖程度。例如，焊接在主板上的手机电池是紧耦合的，因为在不影响另一个组件的情况下，无法替换电池或主板。卡扣式在手机背部的电池是松耦合的，因为这两个实体可以独立地替换。在软件应用程序中，解耦的组件更灵活且更易维护。


    ## 内聚性


    内聚性指的是实体的关注点。例如，瑞士军刀是一个低内聚实体，因为它能做很多事情，但每项工作都做得不够好。多功能工具永远无法比一个充满高内聚性工具的工具箱更有生产力。在软件应用程序中，内聚性强的组件更健壮且更于测试。


    '
