    `RuntimeException` 类。常见的未检查异常包括 `NullPointerException`、`IllegalArgumentException`
    和 `ClassCastException`。


    ## 检查异常


    检查异常表示发生在应用程序控制之外的缺陷，例如打开一个不存在的文件或使用无效凭据连接数据库。抛出检查异常的方法会强制其调用者建立错误处理策略。调用者必须将方法封装在
    `try/catch` 块中，或者将异常添加到其方法声明中，以将责任进一步推向调用栈顶部。检查异常继承自 `Exception` 类。常见的检查异常包括 `IOException`、`FileNotFoundException`
    和 `InterruptedException`。


    # 未检查异常 vs 检查异常


    检查异常一直是 Java 社区中争议的焦点，因为它们经常被误用。官方文档指出：“如果可以合理预期客户端能从异常中恢复，请将其变为检查异常。如果客户端无法采取任何操作从异常中恢复，请将其变为未检查异常。”当不确定时，优先选择未检查异常，因为它允许客户端选择是否合适的错误处理策略适当。


    # 错误


    `Error` 是由 JVM 抛出的，用于表示发生了致命条件。`Error` 直接继承自 `Throwable` 类，这使得它们具有未检查异常的行为。常见的错误包括
    `OutOfMemoryError` 或 `StackOverflowError`。


    # Try/Catch/Finally


    Java 提供了三个用于建立错误处理策略的关键字。`try` 关键字界定了一个可能抛出异常的代码块。`catch` 关键字指定特定类型异常的处理器。在 `try`
    块内抛出的异常将由第一个 `catch` 块捕获，该块的异常类型要么与抛出的异常匹配，要么是抛出异常的父类。


    `finally` 关键字界定了一个无论是否抛出异常都会被调用的代码块。`finally` 块通常用于提供的清理操作。例如，尝试更新数据库的代码可能会被一个
    `finally` 块封装，因为无论更新是否成功，都应该关闭数据库连接。


