    ## 面向对象编程（第一部分）


    ## 类与对象


    Java 对象是由称为“类”（class）的蓝图构建的。类定义了对象的名称、对象以字段（fields）的形式拥有的状态类型，以及对象以方法（methods）的形式拥有的行为。


    当使用 `new` 关键字实例化对象时，类文件及其所有的父类都会被系统类加载器加载到 JVM 中。在类的一次初始化之后，对象将通过调用一个名为构造函数（constructor）的特殊方法进行初始化。构造函数在递归调用其所有父类的构造函数后执行初始化逻辑。在初始化子类之前必须初始化父类，因为子对象可能依赖父类的功能。


    ## 基本类型


    基本类型是固定大小的数据类型，它是预定义的并保留作为关键字。基本类型是用于存储对象中状态的构建块。共有 8 种基本类型：boolean、byte、short、int、long、float、double
    和 char。基本类型不是对象，但每个基本类型都有一个对应的包装对象（wrapper object）。


    编译器可以通过一个名为“自动装箱”（autoboxing）的过程自动将基本类型转换为其包装对象。相反，编译器可以通过一个名为“自动拆箱”（unboxing）的过程将包装对象转换为其基本类型。自动拆箱的一个常见陷阱发生在
    null 对象引用被拆箱为基本类型时，导致 `NullPointerException`。


    ## 面向对象编程（第一部分）


    ## 数组


    数组是一个可以持有固定数量单类型值的对象。数组的容量在数组初始化时定义，并且可以通过从零开始的索引访问其元素。数组是协变的（covariant），这意味着数组可以强制转换为其父类类型的数组。例如，`String[]`
    可以强制转换为 `Object[]`，因为 `String` 类继承了 `Object` 类。


    ## 字符串


    字符串是表示文本的唯一对象。可以在不使用 `new` 关键字的情况下分配字符串值，尽管编译器实际上在内部创建了 String 对象。可以通过重载的 `+`
    运算符进行字符串拼接，编译器会在创建不可变的 String 实例之前，将其转换为在 `StringBuilder char[]` 缓冲区上的方法调用链。`StringBuilder`（以及线程安全的替代方案
    `StringBuffer`）通过修改可变量的 `char[]` 缓冲区来提高性能。字符串的不可变属性允许编译器在一个名为“内化”（interning）的过程中将其缓存。


    ## 枚举


    枚举（Enums）是枚举类型的缩写，是表示一组单例常量的特殊类。实际应用包括星期的几几天、任务的状态级别或安全组的角色。引入枚举是为了取代 String 和
    Integer 常量，它们要强大得多，因为它们可以包含方法、实现接口并提供类型安全。然而，枚举不能被子类化或扩展除了隐式继承的 `Enum` 类之外的任何类。


    17]


    ## 面向对象编程（第一部分）


    ## 包


    类和其他资源被组织在具有唯一命名空间的文件夹中，这些文件夹被称为“包”（packages）。包通常按照两种竞争性的方法论进行组织：按层级分包（package-by-layer）和按功能分包（package-by-feature）。


    按层分包策略根据类在应用程序中的层级将类分组。例如，按层分包的结构可能包含模型（model）、控制器（controller）、服务（service）、dao
    和工具（utility）包。按层分包适用于小型应用程序，但由于跨越较少包的紧耦合类过多，它的可扩展性并不良好。


    按功能分包策略根据类在应用程序中的内聚性将类分组。例如，按功能分包的结构可能包含客户（customer）、订单（order）、产品（product）、评论（review）和报告（report）包。按功能分包鼓励高模块化和松耦合，优于按层分包。


    ## 问题


    类和对象之间有什么区别？


    对象第一次被实例化时会发生什么？


    基本类型和对象之间有什么区别？


    自动装箱和自动拆箱之间有什么区别？


    什么是数组？


    String 与普通对象有什么不同？


    数组与 `StringBuilder` 和 `StringBuffer` 之间有什么区别？


    为什么枚举比 String 或 Integer 常量更好？


    按层分包和按功能分包之间有什么区别？


    ## 面向对象编程（第二部分）


    ## 方法


    方法包含了提供行为的逻辑。方法声明包含修饰符、返回类型、方法名、参数类型及其对应的名称以及可抛出的异常。方法签名是参数的组合。注意，参数名称不包含在方法签名中。


    方法可以通过一个名为递归（recursion）的过程调用自身。递归是循环的替代方案，提供了自然重复的问题，例如数学序列或分治算法。没有终止条件的递归方法最终会导致
    `StackOverflowError`。


    ## 引用传递与值传递


    传递给方法的方式取决于编程语言是引用传递还是值传递。例如，想象在放风筝并将风筝的控制权传递给朋友。引用传递类似于将线系给他们，而值传递则需要系一个重复的风筝并传递它。在这两种情况下，朋友都可以对风筝施影响，但在引用传递中朋友可以更改指向的对象。


    Java 中的所有参数都是值传递的。对于基本类型参数，基本类型的值复制并传递给方法。对于对象参数，对象的指针被复制并传递给方法。


    ## 面向对象编程（第二部分）


    ## final 关键字


    `final` 关键字决定对象引用在赋值后是否可以更改。在风筝的例子中，使用 `final` 关键字类似于将线胶在手上。`final` 关键字通常与 `static`
    关键字结合使用创建常量。但是要注意 `final` 关键字并不防止对象的内部状态改变。`final` 关键字也可以应用于类级别以防止子类扩展该类，或应用于方法级别以防止子类重写方法。


    ## static 关键字


    `static` 关键字决定属性是属于类还是属于对象实例。例如，想象拿着一个房屋的蓝图。不同房屋之间唯一的属性（例如窗户或门的数量）是实例属性的示例。写在蓝图上的属性（例如建造房屋的数量）是静态属性的示例。对象可以访问类的静态属性，但类在没有对象引用的情况下无法访问实例属性。


    ## 访问修饰符


    访问修饰符决定了类、字段和方法的可见性，以便隐藏信息以降低复杂度。四种访问修饰符有：


    - public（公有的）：对所有类可见。

    - protected（保护的）：对子类和同一包中的类可见。

    - <无>（默认）：对同一包中的类可见。

    - private（私有的）：仅对闭包类可见。


