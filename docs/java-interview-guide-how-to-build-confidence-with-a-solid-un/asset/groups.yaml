    # MEMORY MANAGEMENT


    ## Memory Management


    ## Heap Memory


    Java objects reside in a dynamically sized area of memory called the heap. The
    heap is divided into young generation objects and old generation objects. In a
    typical application, the vast majority of objects are short lived. In order to
    improve performance, surviving objects are migrated to the old generation heap
    space where they are ignored during the aggressive garbage collection of the young
    generation heap space.


    ## Garbage Collection


    The garbage collection routine is automatically invoked when the heap fills up.
    The garbage collector identifies objects that are no longer referenced by the
    application and removes them to free up memory. The garbage collector can be manually
    invoked through the System.gc() method, but there is no guarantee when the process
    will start.


    The algorithm used for garbage collection is called mark and sweep. In the first
    step, objects that are referenced in memory are identified and marked. In the
    second step, unmarked objects are deleted, freeing up chunks of memory. The remaining
    memory can then be compacted into contiguous blocks in a process similar to defragmenting
    a hard drive.


    ## Strong References


    A strong reference is a typical reference such as assigning an object to a variable
    or putting an object in an array. A strong reference to an object guarantees that
    the object will remain on the heap. An object is eligible for garbage collection
    if it cannot be accessed through any chain of strong references.


    Strong references can accumulate over time. When an application uses more memory
    than the allocated heap space, the result is an OutMemoryError. Fortunately, Java
    provides different Reference objects to prevent this problem. When an application
    fills up the heap the result is a memory leak.


    ## Memory Leaks


    Memory leaks are possible despite Java''s automatic memory management. For example,
    imagine hosting the world''s largest database. In order to improve performance
    we could use a ConcurrentMap to cache a star by associating its name to a User.
    However, as more users looked up stars, our cache would grow like a black hole
    until it eventually consumed all the available space.


    Memory leaks are often difficult to locate, since the resulting OutMemoryError
    could be thrown from any part of the application. Debugging a memory leak usually
    requires the help of a profiler. A profiler can analyze the heap dump created
    when the JVM crashes and recreate the reference hierarchy to pinpoint where the
    majority of memory is being retained.


    ## Soft References


    A soft reference is an object that can be retrieved by invoking the get() method
    on a SoftReference container. Softly reachable objects will not be eagerly garbage
    collected, making them ideal for caches. For example, if we stored SoftReference<Star>
    values inside our map, our cache could grow until it filled the heap, at which
    point the get() method would start returning null.


    ## Weak References


    A weak reference is an object that can only be retrieved by invoking the get()
    method on a WeakReference container. Weakly reachable objects will be eagerly
    garbage collected, making them ideal for short-lived object associations. For
    example, if we allowed our users to edit stars, we could use a ConcurrentMap to
    synchronize access to a star by associating its name to a User. However, if the
    user closed their browser prematurely the star would remain locked in the map.
    Assuming that the User was also stored as a strong reference in a session object,
    we could use a WeakReference<User> to determine when that session expired because
    the get() method would return null soon after the session garbage collected.


    ## Reference Queue


    In both of our examples, there is a subtle problem. Our SoftReference<Star> cache
    automatically removes Star objects, but we could still fill up the map with keys
    and empty SoftReference containers. Fortunately, Java provides us with an elegant
    solution in the form of a ReferenceQueue.


    A ReferenceQueue is a queue that can be passed into the constructor of Reference
    objects. When an object wrapped by a Reference becomes garbage collected, the
    Reference is enclosed onto the ReferenceQueue. This queue can then be polled for
    cleanup operations. If we were to subclass the SoftReference and WeakReference
    classes to store the name of a star, we would have a convenient callback for removing
    expired map entries.


