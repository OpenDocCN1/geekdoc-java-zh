    # OBJECT-ORIENTED PROGRAMMING (PART II)


    ## Annotations


    Annotations can be applied to fields, methods, classes, and packages to embed
    metadata alongside code. Annotations alone have no effect on a codebase, but they
    can be detected during compile-time or runtime to provide additional functionality.
    For example, the @Override annotation can be used on methods that override a superclass
    method, allowing the compiler to prevent bugs due to invalid method signatures.
    The @Column(name) annotation can be used to map fields to database columns, allowing
    data access objects to dynamically generate SQL queries at runtime.


