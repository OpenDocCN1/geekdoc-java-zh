    Servlets 在通过 Java 代码构建 HTML 文档方面是著名的笨拙。JavaServer Pages (JSP) 是文本文档，通过使用标签和统一表达式语言
    (EL) 静态和动态内容。JSPs 被编译为 Servlets，并对请求和响应对象具有隐式访问。


    Servlets 和 JSPs 经常通过 RequestDispatcher协同工作。RequestDispatcher 将请求控制从一个资源转移到另一个资源。例如，servlet
    通常处理请求的逻辑并委托给 JSP 渲染响应。


    # 过滤器


    过滤器 拦截 servlet 请求以提供交叉切点功能。例如，安全过滤器可以将未身份验证的用户重定向到登录页面。过滤器映射到部署描述符中的 URL 模式。


    # 模型-视图-控制器


    模型-视图-控制器 (MVC) 是一种鼓励 Web 应用中关注点分离的设计模式。模型（Model）表示领域对象，例如从数据库检索的数据。视图（View）是模型的可视化，例如构建
    HTML 文档的 JSP。控制器（Controller）促进模型的更改，例如处理表单提交的 Servlet。存在多个框架来促进 MVC 模式，例如 Spring
    MVC。


    # 问题


    什么是 servlet 容器？


    什么是 Web 应用？


    什么是 WAR 文件？


    什么是 web.xml 文件？


    Servlet 和 HttpServlet 之间有什么区别？


    Servlet 和 JSP 之间有什么区别？


    什么是 servlet 过滤器？


    什么是模型-视图-控制器模式？


    # Web 服务


    # 面向服务的架构


    面向服务的架构 (SOA) 是一种通过网络向客户端提供服务的模式。服务跨越广泛的应用程序，从发送电子邮件到生成随机数。


    # Web 服务


    Web 服务是 SOA 在互联网上的实现。Web 服务暴露了独立于平台或编程语言的契约。两种最流行的实现方式是简单对象访问协议 (SOAP) 和表象性状态转移
    (REST)。


    # SOAP


    SOAP 是一种通信协议，它使用 XML 定义服务描述语言 (WSDL)。WSDL 文档描述的 API 可以被调用者解析以自动生成类。Java XML Web
    服务 API (JAX-WS) 提供了通过注解生成基于 SOAP 的 Web服务的规范。Apache CXF 是 JAX-WS 流行的开源实现。


    # REST


    REST 是一种仅依赖 HTTP 协议设计 Web 服务的模式。REST Web 服务暴露了意义的 URL，利用 GET、POST、PUT 和 DELETE
    方法访问资源。REST 架构没有规定标准数据格式，但 JSON 经常作为 XML 的轻量级替代方案。Java RESTful Web 服务 API (JAX-RS)
    提供了通过注解生成基于 REST 的服务的规范。Jersey 是 JAX-RS 流行的开源实现。


    # SOAP vs REST


    当需要严格的契约来支持紧耦合系统之间的复杂操作时，SOAP Web 服务非常有用。REST Web 服务更灵活，但缺少 WSDL 文档对于复杂服务来说可能是不可接受的。由于
    XML 负载的冗余，SOAP Web 服务通常比 REST 慢。


    # 问题


    什么是面向服务的架构？


    什么是 Web 服务？


    SOAP Web 服务和 REST Web 服务之间有什么区别？


    JAX-WS 和 JAX-RS 之间有什么区别？


    有哪些框架有助于开发 Java Web 服务？


