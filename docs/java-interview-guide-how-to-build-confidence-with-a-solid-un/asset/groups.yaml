    # Object-Oriented Programming (Part II)


    # Methods


    Methods contain the logic that provide an object with behavior. A method declaration
    contains a list of modifiers, a return type, a method name, a list of parameter
    types and their corresponding names, and a list of throwableable exceptions. A
    method signature is the combination of the method name as well as the types and
    order of its parameters. Note that the names of parameters are not included in
    the method signature.


    A method can invoke itself in a process called recursion. Recursion is an alternative
    to looping that provides an elegant solution for problems that naturally repeat,
    such as mathematical sequences or divide and conquer algorithms. A recursive method
    must have a termination condition that determines when the method stopping itself
    and starts returning values to previous invocations on the call stack. A recursive
    method with no termination condition will eventually cause a StackOverflowError.


    # Pass-by-Reference vs Pass-by-Value


    The manner in which arguments are passed to methods depends on whether a programming
    language is pass-by-reference or pass-by-value. For example, imagine flying a
    kite and passing control of the kite to a friend. Pass-by-reference would be akin
    to tieing the string to them, but pass-by-value would require tying a duplicate
    string to the same kite and passing that instead. In both scenarios your friend
    could exert over the kite, but with pass-by-reference your friend has the freedom
    to change what kite the string points to (or to let it go completely).


    Every argument in Java is pass-by-value. With a primitive argument, the value
    of the primitive is copied and passed to the method. With an object argument,
    a pointer to the object is copied and passed to the method.'
