    ## The Synchronize Keyword


    The synchronize keyword is used to designate synchronized methods and statements.
    A synchronized block of code is guarded by a lock that can only be acquired by
    one thread at a time. In a synchronized static method, the singleton Class object
    is implicitly used as the lock. In a synchronized non-static method, the object
    instance is implicitly used as the lock. In a synchronized statement, the lock
    must be provided as an argument. Multiple locks allow for more granular levels
    of synchronization.


    For example, imagine a Counter class with a synchronized count() method. If the
    count() method was static, only one thread in the application could increment
    the counter at a time. If the count() method was non-static, multiple Counter
    objects could be instantiated and incremented concurrently. If the Counter class
    had two variables and two separate count() methods, each method could use synchronized
    statements with different locks so that both variables could be incremented concurrently.


    ## The Volatile Keyword


    The volatile keyword is used to indicate that the value of a variable may be modified
    by multiple threads. Java''s memory model permits threads to cache the value of
    variables for performance. The volatile keyword must be used if a method relies
    on the latest value of a shared variable. For example, a method that executes
    a while (!finished) loop would need to declare the finished variable as volatile
    if a separate thread was responsible for updating its value.


    The guarantee that a memory write will be visible to another block of code is
    called a happens-before relationship. Both the volatile keyword and the synchronize
    keyword guarantee a happens-before relationship, however the synchronize keyword
    also guarantees atomic access to a block of code.


    ## Concurrent Data Structures


    Java 5 introduced several high-level data structures in the java.util.concurrent
    package. CopyOnWriteArrayList is a thread-safe alternative to ArrayList that only
    copies the underlying array during modifications. ConcurrentHashMap is a thread-safe
    alternative to HashMap that only incurs a synchronization penalty on segments
    of the map that were modified. The BlockingQueue was introduced to allow producers
    to block and wait while a queue is full, and allow consumers to block and wait
    while a queue is empty.


    ## The Executor Framework


    The executor framework provides a layer of abstraction over multithreaded task
    execution. The ExecutorService manages a thread pool that accepts Runnable or
    Callable tasks. Submitting a task immediately returns a Future object, which contains
    methods that return the status and result of a running task. The executor framework
    effectively decouples tasks from their execution policies.


    ## ThreadLocal Storage


    The ThreadLocal class allows values to be stored inside of the currently running
    Thread object. For example, imagine tracing an HTTP request starts in a servlet
    and traverses through a service. Rather than pass a transaction ID as an argument
    in every method, you could instead store the ID in a ThreadLocal object and retrieve
    it statically along the way. ThreadLocal variables reduce the verbosity of methods,
    but care must be taken to ensure that a value is removed if the thread is returned
    to a thread pool.


    ## Atomic Variables


    Java introduced several variables with built-in concurrency such as AtomicInteger,
    AtomicLong, and AtomicBoolean. For example, an AtomicInteger could replace and
    even outperform our Counter class because it''s implemented with native method
    calls. A native method call executes outside of the JVM in a platform-dependent
    programming language.


