  md: '# UNIT TESTING


    # Mock Objects


    Mock objects mimic the behavior of objects that are too impractical to incorporate
    into unit tests. For example, it would be prohibitive to charge a credit card
    or launch a missile every time a unit test runs. Mock objects implement the same
    interface as the objects they mimic, allowing developers to simulate controlled
    scenarios without modifying the code that''s being tested. Mock objects can be
    created manually, but frameworks such as Mockito provide powerful proxies that
    can trace and verify the behavior of method calls.


