  md: '# OBJECT-ORIENTED PROGRAMMING (PART I)


    # Packages


    Classes and other resources are organized into folders with unique namespaces
    called packages. Packages are commonly organized by two competing methodologies:
    package-by-layer and package-by-feature.


    A package-by-layer strategy groups classes together according to their layer in
    an application. For example, a package-by-layer structure might include a model,
    controller, service, dao, and utility package. Package-by-layer works for small
    applications, but it doesn''t scale well due to the large number of tightly coupled
    classes that span a relatively small number of packages.


    A package-by-feature strategy groups classes together according to their cohesiveness
    in an application. For example, a package-by-feature structure might include a
    customer, order, product, review, and report package. Package-by-feature encourages
    high modularity and loose coupling and is preferable to package-by-layer.'
  merge: -1
