  md: '# Exceptions


    Exceptions are special objects that are thrown whenever an error interrupts the
    normal execution of code. All exceptions are descendants of the Throwableable
    class and are divided into two categories: unchecked exceptions and checked exceptions.


    # Unchecked Exceptions


    Unchecked exceptions represent a defect in the application, such as invoking a
    method on a null object reference or casting an object to an invalid type. A method
    can throw an unchecked exception without forcing its callers to establish an error-handling
    policy. Unchecked exceptions extend the RuntimeException class. Common unchecked
    exceptions include NullPointerExceptions, IllegalArgumentArgumentExceptions, and
    ClassCastExceptions.


    # Checked Exceptions


    Checked exceptions represent a defect that occurs outside of the control of the
    application, such as opening a file that doesn''t exist or connecting to a database
    with invalid credentials. A method that throws a checked exception forces its
    callers to establish an error-handling policy. Callers must either surround the
    method in a try/catch block or add the exception to its method declaration to
    push the responsibility further up the call stack. Checked exceptions extend the
    Exception class. Common checked exceptions include IOExceptions, FileNotFoundExceptions,
    and InterruptedExceptions.


