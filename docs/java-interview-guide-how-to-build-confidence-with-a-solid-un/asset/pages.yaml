  md: '# ASPECT-ORIENTED PROGRAMMING


    Each delegated method provides a join point that can be surrounded by logging
    code.


    This proxy could be passed to any method that accepts a List. However, one limitation
    of interface proxies is that any self-invoked method inside the composed object
    will not be proxied. For example, if the remove () method in ArrayList internally
    calls the get () method, that call will not be logged because the join point will
    never be invoked.


    # Inheritance Proxies


    An object that is not-final can be proxied by another class that extends it. For
    example, in order to log every method call on an ArrayList, you could create a
    ProxyList that extends ArrayList and overrides every method with a delegated call
    to super (). Each overridden method provides a join point that can be surrounded
    by logging code.


    This proxy could be passed to any method that accepts a List or an ArrayList.
    However, one limitation of inheritance proxies is that final classes and final
    methods cannot be proxied.


    # Runtime Weaving vs Binary Weaving


    Weaving is the process of linking aspects and objects together. Proxy objects
    are examples of runtime weaving, which can be accomplished through pure coding
    patterns. Binary weaving injects aspects directly into bytecode. Binary weaving
    can take place at compile-time with a custom compiler or at load-time with a custom
    class loader. Binary weaving has none of the limitations of interface or inheritance
    proxies, but it usually requires the help of a dedicated library.'
