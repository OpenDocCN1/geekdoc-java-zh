  md: '# Concurrency


    Java supports concurrent programming through the use of threads. A thread is a
    single path of execution in an application. The JVM typically launches as a single
    process, spawning multiple threads that share its resources. Threads that modify
    shared resources must be coordinated in order to prevent unpredictable behavior.


    # Thread Lifecycle


    A thread is born by instantiating a subclass of the Thread class, or by instantiating
    a Thread object with a Runnable argument. A thread enters a runnable state when
    its start () method is invoked. The JVM uses a priority-based scheduling algorithm
    to determine which thread to execute. A thread enters a running state when its
    run () method is invoked by the scheduler. However, a thread can transition to
    a blocked state if it needs to acquire a lock or if it waits for a notification
    from another thread. A thread dies after the run () method completes.


    # Synchronization


    Synchronization is required on mutable resources because the operations of multiple
    threads can interleave. For example, the c operation may appear to be atomic,
    but it is actually composed of three steps: read the value of c, increment the
    value of c, and write the value of c. If one thread reads the value of c and enters
    a blocked state, a second thread could read the same value and the counter would
    only be incremented by one. Synchronizing access to the c operation would force
    all three steps to be completed atomically.


