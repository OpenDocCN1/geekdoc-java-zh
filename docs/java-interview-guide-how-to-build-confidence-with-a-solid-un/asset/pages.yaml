  md: '# Introduction


    # The Purpose of this Guide


    This guide will prepare you for an interview to an entry-level or a senior-level
    position as a Java software developer. It''s intended to be a high-level resource
    and it''s assumed that you are already familiar with the Java language and know
    how to write basic applications.


    The book is divided into chapters of related concepts that are presented in interview-sized
    chunks. At the end of each chapter is a series of potential interview questions.
    Read through each chapter and research any topics that are unfamiliar until you
    are able to answer every question confidently. All of the questions are listed
    again at the end of the book.


    In order to get the most out of this guide, make sure that you are able to answer
    every question in your own words. From the perspective of an interviewer, it''s
    always better to hear a candidate explain something uniquely, because it proves
    that you understand the underlying concepts. It will also prepare you for variations
    of the same questions. The stronger you understand the concepts, the more confident
    you''ll appear in your interview. Are you ready?'
  merge: -1
