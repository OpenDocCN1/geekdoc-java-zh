  md: '# Procedural Programming vs Object-Oriented Programming


    Procedural programming is a style of writing code that executes a series of linear
    procedures to produce a result. Object-oriented programming is a style of writing
    code that uses objects to encapsulate state and behavior. Procedural code is easier
    to use in small projects or in multithreaded environments due to its stateless
    nature, but object-oriented code is far more flexible and easier to maintain.


    # Questions


    What is the WORA principle? Why is it beneficial?


    How can Java applications run on multiple platforms?


    What is the difference between the JRE and the JDK?


    What is the difference between procedural programming and object-oriented programming?'
