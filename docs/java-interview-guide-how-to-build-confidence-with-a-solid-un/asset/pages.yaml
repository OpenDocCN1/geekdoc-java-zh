  md: '# PROGRAMMING PROBLEMS


    Recursive methods are slower loops due to the overhead of method invocations.
    A recursive method can be converted to an iterative method by creating a loop
    that steps towards the termination condition and updates the state of local variables.
    In practice, you should always favor simplicity over premature optimization, but
    in the context of an interview you should be as critical as possible.


    How would you determine whether a string is identical palindrome?


    A palindrome is a word that is identical forwards and backwards. A simple solution
    is to reverse the string and compare it to the original. There is no reverse method
    in the String class, but you could use the StringBuilder#reverse() method or a
    recursive formula: hello = o + reverse(hell).


    Rather than create additional String instances, a more efficient solution would
    use the String#charAt() method with pointers on both ends converging towards the
    middle of the string. If each character matches before the pointers converge,
    the string is a palindrome.


    Given a line of text, how would you verify that the number of open and closed
    parentheses are balanced?


    In order to simplify this problem, you could ignore the irrelevant characters
    and add all of the parentheses to a string. Then, you could recursively loop through
    the string and remove every immediate pair of open and closed parentheses (())
    -> (). When the string has no more pairs, the remaining characters will determine
    if the parentheses were balanced.


    As an optimization, every time you added a closed parenthesis to the string you
    could check to see if the last character was an open parenthesis and discard them
    both. In fact, there would be no need for recursion if you did this because you
