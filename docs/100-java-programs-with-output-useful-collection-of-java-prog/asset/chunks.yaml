    继承 `Throwable` 类除 `RuntimeException` 和 `Error` 之外的类被称为检查异常（checked exceptions），例如
    `IOException`、`SQLException` 等。检查异常会在编译时检查。


    ![](img/index-107_1.jpg)


    ## 2) 未检查异常 (Unchecked Exception)


    继承 `RuntimeException` 的类被称为未检查异常（unchecked exceptions），例如 `ArithmeticException`、`NullPointerException`
    等。未检查异常在编译时不检查。


    ### 75) `Error` 和 `Exception` 的基类是什么？


    `Throwable`。


    ### 76) 每个 `try` 块都必须跟 `catch` 块吗？


    并不是每个 `try` 块都必须跟 `catch` 块。它后面应该跟 `catch` 块**或者** `finally` 块。任何可能抛出的异常都应该在方法的
    `throws` 子句中声明。


    ### 77) 什么是 `finally` 块？


    - `finally` 块是一个始终会被执行的块。


    ### 78) `finally` 块可以在没有 `catch` 的情况下使用吗？


    - 可以，通过 `try` 块。`finally` 后面必须跟 `try` 或 `catch`。


    ### 79) 是否存在 `finally` 不执行的情况？


    如果程序退出（通过调用 `System.exit()` 或导致了导致进程中止的致命错误），`finally` 块将不会执行。


    ### 80) `throw` 和 `throws` 之间有什么区别？


    #### `throw` 关键字

    `throws` 关键字


    1) `throw` 用于显式式地抛出异常。`throws` 用于声明异常。

    2) 检查异常不能仅通过 `throw` 传播。检查异常可以通过 `throws` 传播。用于声明一个显式异常。抛出一个异常。

    3) `throw` 后面跟一个实例。`throws` 后面跟类。


    ![](img/index-108_1.jpg)


    4) `throw` 在方法内部使用。`throws` 用于方法签名。 5) 你不能抛出多个异常。但你可以声明多个异常，例如 `public void method()
    throws IOException, SQLException`。


    ### 81) 异常可以被重新抛出吗？


    可以。


    ### 82) 如果父类方法没有抛出异常，子类重写的方法可以声明异常吗？


    可以，但仅限于未检查异常，不能是检查异常。


    ### 83) 什么是异常传播？


    将异常对象传递给调用方法被称为异常传播。这里给出了一份字符串处理面试题列表，并带有简短精要的回答。如果你知道任何字符串处理的面试题，请在评论区发布。


    ### 84) 从 `String` 的角度来看，“不可变（immutable）”什么意思？


    不可变的简单意思是不可修改或不可改变的。一旦创建了字符串对象，它的值就无法改变。


    ### 85) 为什么 Java 中的字符串对象是不可变的？


    因为 Java 使用了字符串字面量（string literal）的概念。假设有 5 个引用变量都指向同一个对象“sachin”。如果一个引用变量改变了对象的值，这将影响所有的引用变量。这就是为什么
    Java 中的字符串对象是不可变的。


    ### 86) 我们可以通过多少种方式创建字符串对象？


    创建字符串对象有两种方式：通过字符串字面量和通过 `new` 关键字。


    ### 87) 在以下代码中会创建几个对象？


    1. `String s1="Welcome";`

    2. `String s2="Welcome";`

    3. `String s3="Welcome";` 只有一个对象。


    ### 88) 为什么 Java 使用字符串字面量的概念？


    为了让 Java 的内存效率更高（因为如果字符串常量池中已经存在，就不会创建新对象）。


    ### 89) 在以下代码中会创建几个对象？


    1. `String s = new String("Welcome");`


    两个对象，一个在字符串常量池中，另一个在池外（堆）中。


    ### 90) `String` 和 `StringBuffer` 对象之间的基本区别是什么？


    `String` 是不可变对象。`StringBuffer` 是可变对象。


    ### 91) `StringBuffer` 和 `StringBuilder` 之间有什么区别？


    `StringBuffer` 是同步的，而 `StringBuilder` 不是同步的。


    ### 92) 我们如何在 Java 中创建不可变类？


    我们可以通过定义 `final` 类并创建像 `String` 类这样的不可变类。


    ### 93) Java 中 `toString()` 方法的作用是什么？


    `toString()` 方法返回任何对象的字符串表示。如果你打印任何对象，Java 编译器会在内部调用该对象上的 `toString()` 方法。因此，重写
    `toString()` 方法可以返回预期的输出，这可以是对象的状态等，取决于你的实现。


    ***核心 Java：嵌套类和接口面试题***


    ### 94) 什么是嵌套类？


    声明在另一个类内部的类被称为嵌套类。嵌套类有 4 种类型：成员内部类、局部内部类、匿名内部类和静态嵌套类。


    ### 95) 嵌套类和内部类之间有区别吗？


    有区别，内部类是非静态的嵌套类，即内部类是嵌套类的一部分。


    ### 96) 可以在局部内部类内部访问非 `final` 局部变量吗？


    不行的，如果你想在局部内部类中访问它，该局部变量必须是常量。


    ### 97) 什么是嵌套接口？


    任何声明在接口或类内部的接口即被称为嵌套接口。它是静态的。


    ### 98) 类可以有接口吗？


    是的，它是嵌套接口。


    ### 99) 接口可以有类吗？


    是的，它们是隐式的。


    ### 117) 什么是垃圾回收？


    垃圾回收是回收未使用对象的过程。它是为了内存管理。


    ### 118) `gc()` 是什么？


    `gc()` 是 `System` 类中的方法，用于向 JVM 请求执行垃圾。


    ### 119) `finalize()` 方法的作用是什么？


    `finalize()` 方法在对象垃圾回收之前被调用。它用于清理工作。


    ### 120) 被引用的对象可以重新引用吗？


    可以。


    ### 121) 垃圾回收器是什么种线程？


    守护线程。


    ### 122) `final`、`finally` 和 `finalize` 之间有什么区别？


    `final`：是一个关键字，可以是变量、方法或类。不能改变 final 变量，不能重写 final 方法，不能继承 final 类。

    `finally`：用于异常处理。始终会被执行。

    `finalize()`：用于垃圾回收。在对象被垃圾回收之前被调用。它可以用于清理工作。


    ### 123) `Runtime` 类的作用是什么？


    `Runtime` 类的作用是提供对 Java 运行系统的访问。


    ### 124) 如何在 Java 中调用任何外部进程？


    通过 `Runtime.getRuntime().exec()` 方法。


    ### 125) `Reader/Writer` 类层次和 `InputStream/OutputStream` 类层次之间有什么区别？


    `Reader/Writer` 类层次是面向字符的，而 `InputStream/OutputStream` 类层次是面向字节的。


    ### 126)  I/O 过滤器？


    I/O 过滤器是一个从一个流读取并写入另一个流的对象，通常在数据从一个流传递到另一个流时对其进行修改。


    ### 127) 什么是序列化？


    序列化是将对象状态写入字节流的过程。主要用于在网络传输对象状态。


    ### 128) 反序列化是什么？


    反序列化是从化状态重建对象。它是序列化的逆操作。


    ### 129) `transient` 关键字是什么？


    如果你将任何数据成员定义为 `transient`，它将不会被序列化。


    ### 130) 什么是 `Externalizable`？


    `Externalizable` 接口用于以压缩格式将对象状态写入字节流。它不是一个标记接口。


    ### 131) `Serializalble` 和 `Externalizable` 接口之间有什么区别？


    '
- fmt: '

    `Serializable` is a marker interface but `Externalizable` is not a marker interface.
    When you use `Serializable` interface, your class is serialized automatically
    by default. But you can override `writeObject()` and `readObject()` two methods
    to control more complex object serailization process. When you use `Externalizable`
    interface, you have a complete control over your class’s serialization process.


    ### 132) How do I convert a numeric IP address like 192.18.97.39 into a hostname
    like java.sun.com?


    By `InetAddress.getByName(“192.18.97.3 9”).getHostName()` where `192.18.97.39`
    is the IP address.


    ### 133) What is reflection?


    Reflection is the process of examining or modifying the runtime behaviour of a
    class at runtime. It is used in:


    - IDE (Integreted Development Environment) e.g. Eclipse, MyEclipse, NetBeans.

    - Debugger

    - Test Tools etc.


    ### 134) Can you access the private method from outside the class?


    Yes, by changing the runtime behaviour of a class if the class is not secured.


