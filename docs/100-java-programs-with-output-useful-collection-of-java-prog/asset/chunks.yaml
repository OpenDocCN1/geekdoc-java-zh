    员工的姓名为： \n```\nTD\nGB\nFS\n```\n```\n\n### 1) JDK、JRE 和 JVM 之间有什么区别？\n\n**JVM**\n\
    `JVM` 是 `Java Virtual Machine`（Java 虚拟机）的缩写，它是一个抽象机器，为 Java 字节码的执行提供运行时环境。它是一个规范。\n\
    `JVM` 适用于许多硬件和软件平台（因此 `JVM` 是依赖平台的）。\n\n**JRE**\n`JRE` 代表 `Java Runtime Environment`（Java\
    \ 运行环境）。它是 `JVM` 的实现。\n\n**JDK**\n`JDK` 是 `Java Development Kit`（Java 开发工具包）的缩写。它是物理上存在的。\n\
    它包含 `JRE` + 开发工具。\n\n### 2) JVM 分配了多少类型的内存区域？\n有很多类型：\n1. `Class(Method) Area`（类方法区域）\n\
    2. `Heap`（堆）\n![](img/index-97_1.jpg)\n3. `Stack`（栈）\n4. `Program Counter Register`（程序计数器）\n\
    5. `Native Method Stack`（原生方法栈）\n\n### 3) 什么是 JIT 编译器？\n**即时编译（Just-In-Time, JIT）编译器：**\
    \ 它用于提高性能。`JIT` 同时编译具有相似功能的字节码部分，从而减少编译所需的时间。在这里，“编译器”一词指的是从 Java 虚拟机（`JVM`）的指令集到特定\
    \ CPU 指令集的翻译器。\n\n### 4) 什么是平台？\n平台基本上是程序运行的硬件或软件环境。\n平台有两种类型：基于软件的和基于硬件的。Java\
    \ 提供基于软件的平台。\n\n### 5) Java 平台与其他平台之间的主要区别是什么？\nJava 平台与其他大多数平台的区别在于，它是一个运行在其他基于硬件平台之上的软件平台。它有两个组件：\n\
    1. `Runtime Environment`（运行时环境）\n2. `API(应用程序编程接口)`\n\n### 6) 是什么让 Java 具有“一次编写，随运行”的特性？\n\
    字节码。Java 被编译为字节码，字节码是源代码和机器码之间的中间语言。字节码不是特定平台的，因此可以提供给任何平台。\n\n### 7) 什么是类加载器（classloader）？\n\
    `classloader` 是 `JVM` 的一个子系统，用于加载类和接口。有很多类型的类加载器，例如 `Bootstrap classloader`（引导类加载器）、`Extension\
    \ classloader`（扩展类加载器）、`System classloader`（系统类加载器）、`Plugin classloader`（插件类加载器）等。\n\
    \n### 8) 空 .java 文件名是有效的源文件名吗？\n是的，仅用 `.java` 保存你的 java 文件，通过 `javac .java` 编译它，并通过\
    \ `java yourclassname` 运行。让我们来看一个简单的例子：\n1. `//save by .java only`\n2. `class`\
    \ `A`{\n3. `public static void` main(String args[])`\n4. `System.out.println(“Hello\
    \ java”);`\n5. `}`\n6. `}`\n7. `//compile by javac .java`\n8. `//run by java A`\n\
    用 `javac .java` 编译，用 `java A` 运行。\n\n### 9) delete, next, main, exit 或 null 是\
    \ Java 中的关键字吗？\n不是。\n\n### 10) 如果我不在命令行上提供任何参数，那么 Main 方法的 String 数组是空的还是 null？\n\
    它是空的。但不是 null。\n\n### 11) 如果我写 `static public void` 而不是 `public static void` 会怎样？\n\
    程序可以正常编译和运行。\n\n### 12) 局部变量的默认值是什么？\n局部变量没有初始化为任何默认值，无论是基本类型还是对象引用。\n这里提供了 50\
    \ 多个 OOP（面向对象编程和系统）面试题。但为了方便理解，它们被分成了许多部分，例如构造函数面试题、静态面试题、继承面试题、抽象面试题、多态面试题等。\n\
    \n### 13) 面向对象的编程语言和基于对象的编程语言有什么区别？\n基于对象的编程语言遵循 OOP 的所有特性，但继承继承。\n基于对象的编程语言示例有\
    \ `JavaScript`、`VBScript` 等。\n\n### 14) 定义为实例变量的对象引用的初始值是什么？\n在 Java 中，所有对象引用都初始化为\
    \ `null`。\n\n### 15) 什么是构造函数？\n• 构造函数就像一个方法，用于初始化对象的状态。它在对象创建时被调用。\n\n### 16)\
    \ 默认构造函数的目的是什么？\n• 默认构造函数为对象提供默认值。\n只有当类中没有构造函数时，Java 编译器才会创建一个默认构造函数。\n\n###\
    \ 17) 构造函数有返回值吗？\n是的，当前实例（返回类型）。\n\n### 18) 构造函数会被继承吗？\n不，构造函数不被继承。\n\n### 19)\
    \ 可以将构造函数为 final 吗？\n不可以，构造函数不能是 final。\n\n### 20) 什么是静态变量？\n• `static variable`\
    \ 用于所有对象的公共属性（对每个对象不是唯一的），例如公司名称、学生姓名。\n• `static variable` 在类加载时只内存一次。\n\n###\
    \ 21) 什么是静态方法？\n• 静态方法属于类而不是类的实例。\n• 静态方法可以访问静态数据成员并修改它的值。\n![](img/index-100.jpg)\n\
    \n### 22) 为什么 main 方法是静态的？\n因为如果是非静态方法，jvm 需要先创建对象再调用 main 方法，这会导致内存分配的问题。\n\n\
    ### 23) 什么是静态块？\n• 用于初始化静态数据成员。\n• 它在类加载时在 main 方法之前执行。\n\n### 24) 可以在没有 main()\
    \ 方法的情况下执行程序吗？\n答案：可以，一种方法是静态块。\n\n### 25) 如果从 main 方法的签名中删除 static 修饰符会怎样？\n\
    程序可以编译。但在运行时会抛出 `NoSuchMethodError` 错误。\n\n### 26) 静态（类）方法和实例方法之间有什么区别？\n**静态或类方法**\
    \ **实例方法**\n1)声明为 static 的被称为静态方法。未声明为 static 的被称为实例方法。\n2)调用静态方法不需要对象。调用实例方法需要对象。\n\
    3) 非静态（实例）成员无法在静态上下文（静态方法、静态块和静态嵌套类）中直接访问。静态和非静态变量都可以实例方法访问。\n\n### 27) Java 中的\
    \ this 是什么？\n它是引用当前对象的关键字。\n\n### 28) 什么是继承？\n继承是一种对象获取另一个类中对象的所有属性和行为的机制。它代表\
    \ IS-A 关系。它用于代码重用和方法重写。\n\n### 29) 哪个类是所有类的父类？\n`Object` 类。\n\n### 30) 为什么 Java\
    \ 不支持多继承？\n• 为了减少复杂性并简化语言，Java 在类的情况下不支持多重继承。\n\n"
