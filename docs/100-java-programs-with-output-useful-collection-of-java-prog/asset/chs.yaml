  \ `ArithmeticException`。如果抛出了其他类型的异常，它将不会被捕获，因此程序员需要负责处理所有异常，因为我们在 `try` 块中执行算术运算，所以我们只捕获算术异常。捕获任何异常的简单方法是使用\
