  \ 循环\nJava `while` 循环用于执行语句直到条件一直为真。在本教程中，我们将通过 Java `while` 循环示例学习循环。首先，让我们讨论 `while`\
  \ 循环的语法：\n\n```java\nwhile (condition(s)) {\n    // 循环体\n}\n```\n\n1. 如果条件为真，则执行循环体，执行完循环体后再次测试条件，如果条件为真，则再次执行循环体，此过程重复直到条件变为假。条件始终被求值为真或假，如果它是常量，例如\
  \ `while (c) {…}` 其中 `c` 是常量，则 `c` 的任何非零值都被视为真，零被视为假。\n2. 你可以测试多个条件，例如：\n\n当 `a`\
  \ 的值大于 `b` 的值且 `c` 不等于 0 时，执行循环体。\n3. 循环体可以包含多条语句。对于多个语句，你需要使用 `{}` 将它们放在一个块中；如果循环体只包含单个语句，可以可选地使用\
