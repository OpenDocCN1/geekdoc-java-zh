  \ 1) JDK、JRE 和 JVM 之间有什么区别？\n\n**JVM**\n`JVM` 是 `Java Virtual Machine`（Java 虚拟机）的缩写，它是一个抽象机器，为\
  \ Java 字节码的执行提供运行时环境。它是一个规范。\n`JVM` 适用于许多硬件和软件平台（因此 `JVM` 是依赖平台的）。\n\n**JRE**\n\
  `JRE` 代表 `Java Runtime Environment`（Java 运行环境）。它是 `JVM` 的实现。\n\n**JDK**\n`JDK` 是\
  \ `Java Development Kit`（Java 开发工具包）的缩写。它是物理上存在的。\n它包含 `JRE` + 开发工具。\n\n### 2) JVM\
  \ 分配了多少类型的内存区域？\n有很多类型：\n1. `Class(Method) Area`（类方法区域）\n2. `Heap`（堆）\n![](img/index-97_1.jpg)\n\
  3. `Stack`（栈）\n4. `Program Counter Register`（程序计数器）\n5. `Native Method Stack`（原生方法栈）\n\
  \n### 3) 什么是 JIT 编译器？\n**即时编译（Just-In-Time, JIT）编译器：** 它用于提高性能。`JIT` 同时编译具有相似功能的字节码部分，从而减少编译所需的时间。在这里，“编译器”一词指的是从\
  \ Java 虚拟机（`JVM`）的指令集到特定 CPU 指令集的翻译器。\n\n### 4) 什么是平台？\n平台基本上是程序运行的硬件或软件环境。\n平台有两种类型：基于软件的和基于硬件的。Java\
  \ 提供基于软件的平台。\n\n### 5) Java 平台与其他平台之间的主要区别是什么？\nJava 平台与其他大多数平台的区别在于，它是一个运行在其他基于硬件平台之上的软件平台。它有两个组件：\n\
  1. `Runtime Environment`（运行时环境）\n2. `API(应用程序编程接口)`\n\n### 6) 是什么让 Java 具有“一次编写，随运行”的特性？\n\
