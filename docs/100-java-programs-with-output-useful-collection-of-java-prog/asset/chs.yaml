  抽象是隐藏实现细节并仅向用户显示功能的进程。抽象让你关注对象“做什么”，而不是它是“怎么做的”。\n\n## 57) 抽象(abstraction)和封装(encapsulation)\
  \ 之间有什么区别？\n抽象隐藏实现细节，而封装将代码和数据封装成一个单元。\n\n### 58) 什么是抽象类(abstract class)？\n声明为抽象的类被称为抽象类。它需要被扩展并实现其方法。它不能被实例化。\n\
  \n## 59) 可以在没有抽象类的情况下存在抽象方法吗？\n不可以，如果一个类中存在任何抽象方法，该类必须是抽象类。\n\n## 60) 你可以在方法上同时使用\
  \ abstract 和 final 吗？\n不可以，因为抽象方法需要被重写，而你又不能重写 final 方法。\n\n### 61) 能够实例化抽象类吗？\n\
  不可以，抽象类永远不能被实例化。\n\n### 62) 什么是接口(interface)？\n接口是类的蓝图，具有静态常量和抽象方法。它可以实现完全抽象和多重继承。\n\
  \n### 63) 你可以将接口方法声明为 static 吗？\n不可以，接口方法默认是抽象的，static 和 abstract 关键字不能一起使用。\n\n\
  ### 64) 接口可以是 final 吗？\n不可以，因为它的实现是由另一个类提供的。\n\n### 65) 什么是标记接口(marker interface)？\n\
  没有数据成员和方法的接口被称为标记接口。例如 `Serializable`, `Cloneable`。\n\n### 66) 抽象类(abstract class)和接口(interface)\
  \ 有什么区别？\n\n### 抽象类\n### 接口\n1)抽象类可以有方法体（非抽象方法）。接口只有抽象方法。\n2)抽象类可以有实例变量。接口没有实例变量。\n\
  3)抽象类可以有构造函数。接口没有构造函数。\n4)抽象类可以有静态方法。接口没有静态方法。\n5)你可以扩展一个抽象类。你可以实现多个接口。\n\n![](img/index-106_1.jpg)\n\
  \n### 67) 可以在接口中定义 private 和 protected 修饰符吗？\n不可以，它们隐式为 public。\n\n## 68) 什么时候可以将对象引用转换为接口引用？\n\
  当对象实现了被引用的接口时，对象引用可以转换为接口引用。\n\n### 69) 什么是包(package)？\n包是同类型类、接口和子包的组。它提供了访问保护并消除了命名冲突。\n\
  \n### 70) 我需要导入 java.lang 包吗？为什么？\n不需要。它由 JVM 默认内部加载。\n\n## 71) 我可以重复导入同一个包/类吗？JVM\
  \ 在运行时会加载两次包吗？\n可以多次导入同一个包或同一个类。编译器或 JVM 都不会对此抱怨。但无论你导入多少次同一个类，JVM 内部都只会加载一次。\n\n\
  ### 72) 什么是静态导入(static import)？\n通过静态导入，我们可以直接访问类的静态成员，而不需要用类名来限定它。\n\n### 73) 什么是异常处理(Exception\
  \ Handling)？\n异常处理是一种处理运行时错误的机制。它主要用于处理受检查的异常(checked exceptions)。\n\n## 74) 检查异常(Checked\
  \ Exception)和未检查的异常(Unchecked Exception) 之间有什么区别？ 1)检查异常\n\n\n\n\n\n继承 `Throwable`\
  \ 类除 `RuntimeException` 和 `Error` 之外的类被称为检查异常（checked exceptions），例如 `IOException`、`SQLException`\
  \ 等。检查异常会在编译时检查。\n\n![](img/index-107_1.jpg)\n\n## 2) 未检查异常 (Unchecked Exception)\n\
  \n继承 `RuntimeException` 的类被称为未检查异常（unchecked exceptions），例如 `ArithmeticException`、`NullPointerException`\
  \ 等。未检查异常在编译时不检查。\n\n### 75) `Error` 和 `Exception` 的基类是什么？\n\n`Throwable`。\n\n###\
  \ 76) 每个 `try` 块都必须跟 `catch` 块吗？\n\n并不是每个 `try` 块都必须跟 `catch` 块。它后面应该跟 `catch` 块**或者**\
  \ `finally` 块。任何可能抛出的异常都应该在方法的 `throws` 子句中声明。\n\n### 77) 什么是 `finally` 块？\n\n-\
  \ `finally` 块是一个始终会被执行的块。\n\n### 78) `finally` 块可以在没有 `catch` 的情况下使用吗？\n\n- 可以，通过\
  \ `try` 块。`finally` 后面必须跟 `try` 或 `catch`。\n\n### 79) 是否存在 `finally` 不执行的情况？\n\n\
  如果程序退出（通过调用 `System.exit()` 或导致了导致进程中止的致命错误），`finally` 块将不会执行。\n\n### 80) `throw`\
  \ 和 `throws` 之间有什么区别？\n\n#### `throw` 关键字\n`throws` 关键字\n\n1) `throw` 用于显式式地抛出异常。`throws`\
  \ 用于声明异常。\n2) 检查异常不能仅通过 `throw` 传播。检查异常可以通过 `throws` 传播。用于声明一个显式异常。抛出一个异常。\n3) `throw`\
  \ 后面跟一个实例。`throws` 后面跟类。\n\n![](img/index-108_1.jpg)\n\n4) `throw` 在方法内部使用。`throws`\
  \ 用于方法签名。 5) 你不能抛出多个异常。但你可以声明多个异常，例如 `public void method() throws IOException, SQLException`。\n\
  \n### 81) 异常可以被重新抛出吗？\n\n可以。\n\n### 82) 如果父类方法没有抛出异常，子类重写的方法可以声明异常吗？\n\n可以，但仅限于未检查异常，不能是检查异常。\n\
  \n### 83) 什么是异常传播？\n\n将异常对象传递给调用方法被称为异常传播。这里给出了一份字符串处理面试题列表，并带有简短精要的回答。如果你知道任何字符串处理的面试题，请在评论区发布。\n\
  \n### 84) 从 `String` 的角度来看，“不可变（immutable）”什么意思？\n\n不可变的简单意思是不可修改或不可改变的。一旦创建了字符串对象，它的值就无法改变。\n\
  \n### 85) 为什么 Java 中的字符串对象是不可变的？\n\n因为 Java 使用了字符串字面量（string literal）的概念。假设有 5 个引用变量都指向同一个对象“sachin”。如果一个引用变量改变了对象的值，这将影响所有的引用变量。这就是为什么\
  \ Java 中的字符串对象是不可变的。\n\n### 86) 我们可以通过多少种方式创建字符串对象？\n\n创建字符串对象有两种方式：通过字符串字面量和通过\
  \ `new` 关键字。\n\n### 87) 在以下代码中会创建几个对象？\n\n1. `String s1=\"Welcome\";`\n2. `String\
  \ s2=\"Welcome\";`\n3. `String s3=\"Welcome\";` 只有一个对象。\n\n### 88) 为什么 Java 使用字符串字面量的概念？\n\
  \n为了让 Java 的内存效率更高（因为如果字符串常量池中已经存在，就不会创建新对象）。\n\n### 89) 在以下代码中会创建几个对象？\n\n1. `String\
  \ s = new String(\"Welcome\");`\n\n两个对象，一个在字符串常量池中，另一个在池外（堆）中。\n\n### 90) `String`\
  \ 和 `StringBuffer` 对象之间的基本区别是什么？\n\n`String` 是不可变对象。`StringBuffer` 是可变对象。\n\n###\
  \ 91) `StringBuffer` 和 `StringBuilder` 之间有什么区别？\n\n`StringBuffer` 是同步的，而 `StringBuilder`\
  \ 不是同步的。\n\n### 92) 我们如何在 Java 中创建不可变类？\n\n我们可以通过定义 `final` 类并创建像 `String` 类这样的不可变类。\n\
  \n### 93) Java 中 `toString()` 方法的作用是什么？\n\n`toString()` 方法返回任何对象的字符串表示。如果你打印任何对象，Java\
  \ 编译器会在内部调用该对象上的 `toString()` 方法。因此，重写 `toString()` 方法可以返回预期的输出，这可以是对象的状态等，取决于你的实现。\n\
  \n***核心 Java：嵌套类和接口面试题***\n\n### 94) 什么是嵌套类？\n\n声明在另一个类内部的类被称为嵌套类。嵌套类有 4 种类型：成员内部类、局部内部类、匿名内部类和静态嵌套类。\n\
  \n### 95) 嵌套类和内部类之间有区别吗？\n\n有区别，内部类是非静态的嵌套类，即内部类是嵌套类的一部分。\n\n### 96) 可以在局部内部类内部访问非\
  \ `final` 局部变量吗？\n\n不行的，如果你想在局部内部类中访问它，该局部变量必须是常量。\n\n### 97) 什么是嵌套接口？\n\n任何声明在接口或类内部的接口即被称为嵌套接口。它是静态的。\n\
  \n### 98) 类可以有接口吗？\n\n是的，它是嵌套接口。\n\n### 99) 接口可以有类吗？\n\n是的，它们是隐式的。\n\n### 117) 什么是垃圾回收？\n\
  \n垃圾回收是回收未使用对象的过程。它是为了内存管理。\n\n### 118) `gc()` 是什么？\n\n`gc()` 是 `System` 类中的方法，用于向\
  \ JVM 请求执行垃圾。\n\n### 119) `finalize()` 方法的作用是什么？\n\n`finalize()` 方法在对象垃圾回收之前被调用。它用于清理工作。\n\
  \n### 120) 被引用的对象可以重新引用吗？\n\n可以。\n\n### 121) 垃圾回收器是什么种线程？\n\n守护线程。\n\n### 122) `final`、`finally`\
  \ 和 `finalize` 之间有什么区别？\n\n`final`：是一个关键字，可以是变量、方法或类。不能改变 final 变量，不能重写 final 方法，不能继承\
  \ final 类。\n`finally`：用于异常处理。始终会被执行。\n`finalize()`：用于垃圾回收。在对象被垃圾回收之前被调用。它可以用于清理工作。\n\
  \n### 123) `Runtime` 类的作用是什么？\n\n`Runtime` 类的作用是提供对 Java 运行系统的访问。\n\n### 124) 如何在\
  \ Java 中调用任何外部进程？\n\n通过 `Runtime.getRuntime().exec()` 方法。\n\n### 125) `Reader/Writer`\
  \ 类层次和 `InputStream/OutputStream` 类层次之间有什么区别？\n\n`Reader/Writer` 类层次是面向字符的，而 `InputStream/OutputStream`\
  \ 类层次是面向字节的。\n\n### 126)  I/O 过滤器？\n\nI/O 过滤器是一个从一个流读取并写入另一个流的对象，通常在数据从一个流传递到另一个流时对其进行修改。\n\
  \n### 127) 什么是序列化？\n\n序列化是将对象状态写入字节流的过程。主要用于在网络传输对象状态。\n\n### 128) 反序列化是什么？\n\n\
  反序列化是从化状态重建对象。它是序列化的逆操作。\n\n### 129) `transient` 关键字是什么？\n\n如果你将任何数据成员定义为 `transient`，它将不会被序列化。\n\
  \n### 130) 什么是 `Externalizable`？\n\n`Externalizable` 接口用于以压缩格式将对象状态写入字节流。它不是一个标记接口。\n\
  \n### 131) `Serializalble` 和 `Externalizable` 接口之间有什么区别？\n\n\n\n\n\n`Serializable`\
  \ 是一个标记接口，但 `Externalizable` 则不是标记接口。当你使用 `Serializable` 接口时，你的类默认会被自动序列化。但你可以通过重写\
  \ `writeObject()` 和 `readObject()` 两个方法来控制更复杂的对象序列化过程。当你使用 `Externalizable` 接口时，你对类的序列化过程拥有完全的控制权。\n\
  \n### 132) 如何将像 192.18.97.39 这样的数字 IP 地址转换为像 java.sun.com 这样的主机名？\n\n通过 `InetAddress.getByName(“192.18.97.39”).getHostName()`\
  \ 实现，其中 `192.18.97.39` 是 IP 地址。\n\n### 133) 什么是反射？\n\n反射是在运行时检查或修改类的运行时行为的过程。它被用于：\n\
  \n- IDE（集成开发环境），例如 Eclipse, MyEclipse, NetBeans。\n- 调试器\n- 测试工具等。\n\n### 134) 你可以在类外部访问私有方法吗？\n\
  \n可以，如果该类没有安全限制，可以通过改变类的运行时行为来实现。\n\n# 文档大纲\n\n- 1. Hello World 示例\n- 2. 两个矩阵相加\n\
