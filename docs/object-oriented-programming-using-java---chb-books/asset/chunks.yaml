    In other words, an interface defines the availability of specified operations
    without saying anything


    about their implementation. That is left to classes which implement the interface.


    An interface is a sort of contract. The SaleableItem interface says “I undertake
    to provide, at least,


    methods with these signatures:


    public void sellCopy ();


    public double getPrice ();


    though I might include other things as well”


    Where more than one class implements an interface it provides a guaranteed area
    of commonality which


    polymorphism can exploit.


    Think of a car and a driving game in an arcade. They certainly are not related
    by any “is a” relationship –


    they are entirely different kinds of things, one a vehicle, the other an arcade
    game. But they both implement


    what we could call a “SteeringWheel interface” which we can use in exactly the
    same way, even though


    the implementation (mechanical linkage in the car, video electronics in the game)
    are very different.


    We now need to state that both Publication (and all its subclasses) and Ticket
    both offer the operations


    defined by this interface:


    class Publication implements SaleableItem


    {


    [...class details...]


    }


    class Ticket implements SaleableItem


    {


    [...class details...]


    }


    Contrast implements with extends .


    • extends causes the inheritance of both interface and implementation from a superclass.


    • implements gives a guarantee that the operations specified by an interface will
    be


    provided – this is enough to allow polymorphic handling of all classes which implement
    a


    given interface


