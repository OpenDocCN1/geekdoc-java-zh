    # 6.4 Identifying Things Outside The Scope Of The System


    An important part in designing a system is to identify those aspects of the problem
    that are not relevant or outside the scope of the system. Parts of the description
    may be purely contextual i.e. for general information purposes and thus not something
    that will directly describe aspects of the system we are designing. Furthermore
    while parts of the description may refer to tasks that are performed by users
    of the system as they are using the system, and thus describe functions that need
    to be implemented within the system, other parts may describe tasks performed
    by users while not using the system – and thus don’t describe functions within
    the system.


    By identifying things in the description that are not relevant to the system we
    are developing we keep the problem as simple as possible.


    ### Activity 2

    Look at the list of nouns and verbs above and identify one of each that is outside
    the scope of the system.


    ### Feedback 2

    Most of the first paragraph is contextual and does not describe functionality
    weneed to implement within the system. We also need to look at other parts of
    thedescription to identify parts that are not relevant.


    **Things outside the scope of the system…**


    **Nouns:-**

    * `GetFit Athletic Club` – this is the client for whom the system is beingdeveloped.
    It is not an entity we need to model within the system.

    * `Coastal location` – the location of the run is not relevant to the functionalityofthe
    system as described. Again we do not need to model this as an objectwithin the
    system.

    * `Software system` – this is the system we are developing as a whole it does
    notdescribe an entity within the system.


    **Verbs:-**

    * `Organise` – this is an activity done by members of the athletic club, thesemay
    be users of the system but this is not an activity that they are using thesystem
    for.

    * `marathon` – this is what the runners are doing. It is not something the systemneeds
    to do.


    Note: ‘Finish race’ is something that a runner does however when this happens
    theirfinish time must be recorded in the system. Therefore this in NOT in fact
    outside the scope of the system.


    # 6.5 Identifying Synonyms


    Synonyms are two words that have these same meaning. It is important to identify
    these in the description of the system. Failure to do so will mean that one entity
    will be modelled twice which will lead to duplication and confusion.


    ### Activity 3

    Look at the list of nouns and verbs and identify two synonyms, one from the list
    of nouns and one from the verbs.


    ### Feedback 3

    **Synonyms**


    **Nouns:-**

    * `world ranking`

    * `professional=professional runner`

    * `fund-raising`

    * `amateur=amateur runner`

    * `runner=competitor`


    Note: `runner` is not a synonym of `professional runner` as some runners are amateurs.


    **Verbs:-**

    * `marathon=compete`

    * `check status=display status`

    * `print collection list = print list`

    * `finish race =record`

    * `specified time`


    # 6.6 Identifying Potential Classes


    Having simplified the problem by identifying aspects that are outside the scope
    of the system and by identifying different parts of the description that are in
    reality describing the same entities and operations we can now start to identify
    potentials classes in the system to be implemented.


    Some nouns will indicate classes to be implemented and some will indicate attributes
    of classes. Good OO design suggests that data and operations should be packaged
    together – thus classes represent complex conceptual entities for which we can
    identify associated data and operations (or methods). Simple entities, such as
    an address, have associated data but no operations and thus these can be stored
    as simple attributes within a related class.


    ### Activity 4

    Look at the list of nouns above and identify five that could become classes.


    ### Feedback 4

    **Nouns that could indicate classes:-**

    * `Runner` (or `Competitor`)

    * `Amateur` (or `Amateur Runner`)

    * `Professional` (or similar)

    * `FancyDresser` (or `FancyDress`)

    * `Amateur or similar`

    * `Sponsorshipform`


    # 6.7 Identifying Potential Attributes


    Having identified potential classes the other nouns could by used to identify
    attributes of those classes.


    ### Activity 5

    Look at the list of nouns and identify one that could become an attribute of the
    class `Runner` and one for the class `FancyDresser`.


    ### Feedback 5

    **Nouns that could become attributes...**


    **For Runner:-**

    * `number`, `resultStatus` ie. finished (`boolean`)

    * `time (hours, minutes, seconds)`


    **For FancyDresser:-**

    * `costume (String)`


    Of course we need to identify all of the attributes for all of the classes. #
    6.8 Identifying Potential Methods


    Having identified potential classes we can now use the verbs to identify methods
    of those classes.


    ### Activity 6

    Look at the list of verbs and identify one that could become a method of the class
    `Runner` and one for the class `FancyDresser`.


    ### Feedback 6

    **Verbs that could become methods....**


    **For Runner:-**

    * `describe` (this will actually become an overridden version of `toString()`)

    * `finishRace`

    * `displayStatus`


    **For FancyDresser:-**

    * `describe` (`toString()` will need to be overridden again to encompass the costume)


    Of course we need to identify all of the methods for all of the classes.


    # 6.9 Identifying Common Characteristics


    Having identified the candidate classes with associated attributes and methods
    we can start structuring our classes into inheritance hierarchies by identifying
    those classes with common characteristics.


    ### Activity 7

    Look at the list of classes below and place four into an appropriate inheritancehierarchy.
    Identify the one class that would not fit into this hierarchy:-

    `Runner`, `Amateur`, `Professional`, `FancyDresser`, `Sponsorshipform`


    ### Feedback 7

    The most general class i.e. the one at the top of the inheritance tree is `Runner`.Amateur`
    and `Professional` are subclasses of `Runner` and `FancyDresser` is a specifictype
    of `Amateur` hence a subclass of `Amateur`.


    We can fit these into an inheritance hierarchy because these classes are all relatedby
    an is-a relationship. A `FancyDresser` is-a `Amateur` which in turn is-a `Runner`.
    A `Professional` is-a `Runner` as well.


    A `SponsorshipForm` is not a type of `Runner` and hence does not fit into this
    hierarchy.This class will be related to one of the other classes by some form
    of an association.Looking at the description we can see that not all runners have
    a sponsorship formonly amateurs who are running for charity. There is therefore
    an association between`Amateur` and `SponsorshipForm`. Of course `FancyDressers`
    inherit the attributes defined in `Amateur` and hence they automatically have
    a `SponsorshipForm`.


    # 6.10 Refining Our Design using CRC Cards


    Having identified the main classes in our system, and the attributes and methods
    of these classes, we could now proceed to refine these designs by defining the
