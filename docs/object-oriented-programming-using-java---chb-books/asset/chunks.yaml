    catch (UnknownClientException uce) {fail();}try { c = cb.getClient("sk");fail();}
    catch (UnknownClientException uce) {} }

    ```


    第一个用例创建一个具有 10 个单位额度的客户，增加 10 个单位额度，然后检查该客户是否有 20 个单位额度。


    单靠一个测试不足以充分证明 `increaseCredit()` 方法将始终正常工作，因此我们需要定义额外的测试。


    第二个用例创建一个空的客户账簿，创建一个客户，将客户添加到客户账簿中并尝试删除该客户——如果在此处生成了 `unknownClientException`，我们就知道存在问题。删除后，我们再次尝试删除该对象，这应该是失败的，因为现在应该会生成一个
    `unknownClientException`。如果在此处没有生成异常，则该类存在缺陷，测试应该“失败”。


    创建了测试用例后，这些代码将产生编译错误，因为 `increaseCredit()` 和 `deleteClient()` 方法并不。


    我们现在必须创建这些方法并对其进行修改，直到这些测试通过。


