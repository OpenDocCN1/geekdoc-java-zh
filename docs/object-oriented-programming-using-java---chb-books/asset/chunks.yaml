  trans: "\n\n- 绘制类图、对象图、时序图和包图。\n\n本章涵盖的内容将在书的后续章节中进行扩展，在这里开发的技能将在随后的练习中使用（特别是关于类图）。\n\
    \n本章由六部分组成：\n\n1) `UML` 简介\n2) `UML` `类图`\n3) `UML` `语法`\n4) `UML` `包图`\n5) `UML`\
    \ `对象图`\n6) `UML` `时序图`\n\n## 2. UML 简介\n\n### 2.1 UML 简介\n\n统一建模语言 `UML` 有时被描述为一种方法论。它并不是！\n\
    \n方法论是为了实现特定结果的一系列过程系统，例如为了收集用户需求而组织的有序活动序列。相反，`UML` 是一种精确的绘图符号，允许对程序设计进行表示和讨论。由于它本质上是图形化的，因此很容易可视化、理解并讨论图表中呈现的信息。然而，由于图表表示的是技术信息，它们必须精确且清晰——因此，为了使其生效，必须遵循一套精确的符号规定。\n\
    \n### 统一建模语言 (UML)\n\n由于 `UML` 不是一种方法论，因此用户可以按照任何他们认为适当的过程来生成图表所描述的设计。`UML` 并没有施加限制——它仅仅允许这些设计以一种易用但精确的图形化符号表达出来。\n\
    \n## 2.2 UML 类图\n\n### `UML` 类图\n\n类是任何面向对象软件系统的基本组件，`UML` `class 图` 提供了一种表示这些类的简单方法。类图在详细显示单个类的同时，还显示了多个类以及它们之间的关系。因此，类图展示了系统的架构。\n\
    \n一个类由以下部分组成：\n\n- 名称（通常以大写字母开头）\n- 属性列表（`int`、`double`、`boolean`、`String` 等）\n\
    - 方法列表\n\n### 统一建模语言 (UML)\n\n`Object Oriented Programming Using Java`\n\n![Wondershare](img/bg02500001.jpg)\n\
