    ### Case study


    What we want to ‘test’ here is that messages can be created, added to the `MessageSet`
    and displayed on the display.


    A point of requirements definition occurs here. There are two possibilities regarding
    the interface to the display board:-


    a) we load one message at a time, display it, then load the next message, and
    so on.

    b) we load a collection of messages in one go, then tell the board to display
    them in sequence which it does autonomously.


    The correct choice depends on finding out how the real display board actually
    works.


    Note that (a) would mean a simple display board and more complexity for the “Display
    messages” responsibility of `MessageSet`, while (b) implies the converse.


    For this exercise we will assume the answer to this is (b), hence the responsibilities
    of scrolling through a set of messages will be assigned to the `DisplayBoardControl`
    interface.


    185

    Download free eBooks at bookboon.com

    Object Oriented Programming Using Java

    Case study


    Looking at these CRC cards it would appear that we can:


    - Create a new message,

    - Add this to the message set and

    - Display these messages by invoking `load list of messages` and `run cycle of
    messages`


    So this part of our design also seems to work.


    ### The Message Purge Scenario


    The final scenario that we want to run though here is the message purge scenario.
    At the end of the day when messages have been displayed the remaining days of
    the message need to be decremented and the message will need to be deleted if
    a) the message has run out of days or b) the client has run out of credit.


    CRC cards for the classes involved in this have been drawn below…


    ![Wondershare](images/bg18600001.jpg)


    186

    Download free eBooks at bookboon.com

    Object Oriented Programming Using Java

    Case study


    ### Activity 1


    To purge the messages, the `MessageBook` cycles through its list of messages reducing
    the credit for the client who ‘owns’ this message, decrementing the days remaining
    for that message and deleting messages when appropriate.


    Looking at the CRC cards above work through the following steps and identify any
    potential problems with these classes:-


    - For each message- tell the `Message` to decrement its days remaining

    - tell the relevant `Client` to decrease its credit

    - ask the `Message` for its `clientID`

    - ask the `Message` for its cost

    - ask the `ClientBook` for the client with this ID

    - tell the `Client` to decrease its credit by the cost of the message

    - if either the `Client`’s credit is <= 0 or the `Message` is now expired delete
    the message from the list


    ### Feedback 1


    A problem becomes evident when we try to find the client associated with a message
    as `Message` does not know the `clientID`.


    We therefore need to add this responsibility to the `Message` class.


    A revised design for the `Message` class is given below…


    ![Wondershare](images/bg18700001.jpg)


    By drawing out CRC cards for each class and interface and by role playing a range
    of scenarios we have checked and revised our plans for the system – we can now
    refine these and document these using UML diagrams.


    187

