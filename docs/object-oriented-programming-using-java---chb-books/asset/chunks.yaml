    The method to display messages requires and object of type DisplayBoardControl
    to be passed as


    a parameter. Initially a DummyBoard object will be provided however when a real
    display board is


    purchased then this object will replace the DummyBoard object. This will have
    no impact on the code


    within the display() method as both objects are of the more general type DisplayBoardControl.
    This is


    another example of the application of polymorphism.


    Two additional methods have been created saveToFile() and readFromFile() which
    read and write the


    entire set of messages to file using the technique of object serialisation.


