    may have additional methods


    it must at least have all of the methods defined in the superclass and should
    therefore be substitutable.


    However what happens if a method is overridden in the subclass?


    When overriding methods we must ensure that they are still substitutable for the
    method being replaced.


    Therefore when overriding methods, while it is perfectly acceptable to tailor
    the method to the needs


