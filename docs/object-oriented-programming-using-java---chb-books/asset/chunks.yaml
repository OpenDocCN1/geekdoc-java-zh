    fancy dress, 26.2 mile route, coastal location, software system, runner, result,
    sponsorship donation, model, key characteristic, a number, time, result status,
    competitor, professional runner, amateur runner, world ranking, charity, sponsorship
    form, collection list, sponsor, sponsorship amount, total raised, costume.

