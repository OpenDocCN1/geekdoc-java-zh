    an Object type (and then cast it to Account) in order to override the equals()
    method inherited from


    Object which has the signature


    public boolean equals (Object obj)


    (You can check this in the “API and Language” section of the JDK documentation.)


    If we gave this method a signature with an Account type parameter it would not
    override Object.equals().


    Therefore we need to cast the parameter to an Account before extracting its accountNumber
    to compare


    them with those of the current object.


    One additional complication concerns how objects are stored in sets. To do this
    Java uses a hashcode


    based on the objects name. However two accounts with the same accountNumber should
    generate the


    same hashcode even if the object name is different. To make certain this happens
    we need to override


    the hashCode() method so that a hashcode is generated using the accountNumber
    rather than the object


    name (just as we needed to override the equals() method). We can ensure that the
    hashcode generated


    is based on the account number by overriding this method as shown below….


    /**


    * Override hashCode() inherited from Object


    * @return hashcode based on accountNumber


    */


    public int hashCode()


    {


    return accountNumber.hashCode();


    }


