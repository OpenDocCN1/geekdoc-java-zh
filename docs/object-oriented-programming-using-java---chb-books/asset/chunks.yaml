    This chapter will discuss different programming paradigms and the advantages of
    the Object Oriented

    approach to software development and modelling. The concepts on which object orientation
    depend

    (abstraction, encapsulation, inheritance and polymorphism) will be explained.


    ### Objectives


    By the end of this chapter you will be able to…


    • Explain what Object Oriented Programming is,

    • Describe the benefits of the Object Oriented programming approach and

    • Understand and the basic concepts of abstraction, encapsulation, generalisation
    and

    polymorphism on which object oriented programming relies.


    All of these issues will be explored in much more detail in later chapters of
    this book.


    This chapter consists of six sections:-


    1) A Brief History of Computing

    2) Different Programming Paradigms

    3) Why use the Object Oriented Paradigm

    4) Object Oriented Principles

    5) What Exactly is Object Oriented Programming?

    6) The Benefits of the Object Oriented Programming Approach.


    ### A A Brief History of Computing


    Computing is a constantly changing our world and our environment. In the 1960s
    large machines called

    mainframes were created to manage large volumes of data (numbers) efficiently.
    Bank account and payroll

    programs changed the way organisations worked and made parts of these organisations
    much more efficient.


    In the 1980s personal computers became common and changed the way many individuals
    worked. People

    started to own their own computers and many used word processors and spreadsheets
    applications (to

    write letters and to manage home accounts). In the 1990s email became common and
    the world wide web

    was born. These technologies revolutionised communications allowing individuals
    to publish information

    that could easily be accessed on a global scale. The ramifications of these new
    technologies are still not

    fully understood as society is adapting to opportunities of internet commerce,
    new social networking

    technologies (twitter, facebook, myspace, online gaming etc) and the challenges
    of internet related crime.


    Object Oriented Programming Using Java

    An Introduction to Object Orientated Programming


    Just as new computing technologies are changing our world so to are new techniques
    and ideas changing

    the way we develop computer systems. In the 1950s the use machine code (unsophisticated,
    complex

    and machine specific) languages were common.


    In the 1960s high level languages, which made programming simpler, became common.
    However these

    led to the development of large complex programs that were difficult to manage
    and maintain.


    In the 1970s the structured programming paradigm became the accepted standard
    for large complex

    computer programs. The structured programming paradigm proposed methods to logically
    structure

    the programs developed into separate smaller, more manageable components. Furthermore
    methods for

    analysing data were proposed that allowed large databases to be created that were
    efficient, preventing

    needless duplication of data and protected us against the risks associated with
    data becoming out of sync.


    However significant problems still persisted in a) understanding the systems we
    need to create and b)

    changing existing software as users requirements changed.


    In the 1980s ‘modular’ languages, such as `Modula-2` and `ADA` were developed
    that became the precursor

    to modern Object Oriented languages.


    In the 1990s the Object Oriented paradigm and component-based software development
    ideas were

    developed and Object Oriented languages became the norm from 2000 onwards.


    The object oriented paradigm is based on many of the ideas developed over the
    previous 30 years of

    abstraction, encapsulation, generalisation and polymorphism and led to the development
    of software

    components where the operation and data are modelled together.


    ### Different Programming Paradigms


    The structured programming paradigm proposed that programs could be developed
    in sensible

    blocks that make the program more understandable.


    Object Oriented Programming Using Java

    An Introduction to Object Orientated Programming


    #### Activity 1


    Assume you undertake the following activities on a daily basis. Arrange this list
    into groups and give each group a title for those activities.


    ```

    Get out of bed

    Eat breakfast

    Park the car

    Get dressed

    Get the car out of the garage

    Drive to work

    Find out what your boss wants today

    ```


    #### Feedback 1


    By structuring our list of instructions and considering the overall structure
    (getting up, go to

    work, doing job) we can change and improve one section without worrying about
    any potential impact this may have on other parts. For example we could improve
    the instructions for


    ```

    Listen to the local traffic and weather report

    Decide whether to go by bus or car

    If going by car, get the car and drive to work

    Else walk to the bus station and catch the bus

    ```


    without any potential impact on ‘getting up’ or ‘doing job’. In the same way structuring
    computer programs can make each part more understandable and make large programs
    easier to maintain.


    The Object Oriented paradigms suggest we should model instructions in a computer
    program with the

    data they manipulate and store these as components together. One advantage of
    doing this is we get

    usable software components.


    #### Activity 2


    Imagine a personal address book with some data stored about your friends:

    Name, Address, Telephone Number.


    List three things that you may do to this address book. Next identify someone
    else who may use an identical address book for some purpose other than storing
    a list of friends.


    #### Feedback 2


    With an address book we would want to be able to perform the following actions:-
    find out detailsof a friend i.e. their telephone number, add an address to the
    address book and, of course, deletean address.


    By creating a simple software component to store the data in the address book
    (i.e. list ofnames etc) and the operations we can perform (i.e add address, find
    telephone number etc) we can reuse in another software system i.e. it could be
    used by a business manager to store and finddetails of customers. It could also
    become part of a library system to be used by a librarian tostore and retrieve
    details of the users of the library.

