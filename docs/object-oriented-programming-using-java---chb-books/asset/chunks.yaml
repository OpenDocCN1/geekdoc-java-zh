    ### Feedback 2


    a) Legal – you can invoke `sellCopy()` on a publication.

    b) Illegal – the `recvNewIssue()` method does not exist in publications.

    c) Legal – `Magazine` is a type of `Publication` and therefore you can assign
    an object of type `Magazine` to a variable of type `Publication` (you can always
    substitute subtypes where a supertype is requested). Also you can invoke `sellCopy()`
    on a publication. The publication happens to be a magazine but this is irrelevant
    as far as the compiler knows in this instance `p` is just a publication.

    d) Illegal – while we can invoke `recvNewIssue` on a magazine the compiler does
    not know that `p` is a magazine…only that it is a publication.

    e) Legal – `m` is a magazine and we can invoke this method on magazines.


