    Overloading


    Historically in computer programs method names were required to be unique. Thus
    the compiler could


    identify which method was being invoked just by looking at its name.


    However several methods were often required to perform very similar functionality
    for example a method


    could add two integer numbers together and another method may be required to add
    two floating point


    numbers. If you have to give these two methods unique names which one would you
    call ‘add()’?


    In order to give each method a unique name the names would need to be longer and
    more specific. We


    could therefore call one method addInt() and the other addFloat() but this could
    lead to a proliferation


    of names each one describing different methods that are essentially performing
    the same operation ie.


    adding two numbers.


    To overcome this problem in Java you are not required to give each method a unique
    name – thus both


    of the methods above could be called add(). However if method names are not unique
    the Java Runtime


    Environment (JRE) must have some other way of deciding which method to invoke
    at run time. ie. when'
