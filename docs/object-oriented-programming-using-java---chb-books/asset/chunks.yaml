    Feedback 1


    If a client with the specified ID exists this code above will work. However if
    a client does not existwith the specified ID the getClient() method will return
    NULL.


    The second line of code would then cause a run time error (specifically a NullPointerException)
    as ittries to invoke the determineCreditRating() method on a non existent client
    and the program would crash at this point.


    Activity 2


    Consider the following amendment to this code and decide if this would fix the
    problem.


    Client c = listOfClients.getClient(pClientID) ;If (c !=NULL) {c.determineCreditRating();
    }


    Feedback 2


    If the code was amended to allow for the possible NULL value returned it would
    work – howeverthis protection is insecure as it relies on the programmer to spot
    this potential critical error.


    When writing the getClient() method the author was fully aware that a client may
    not be found and in


    this case decided to return a NULL value. However this relies on every programmer
    who ever uses this


    method to recognise and protect against this eventuality.


    156


