  raw: '• Draw class diagrams, object diagrams, sequence diagrams and package diagrams.


    The material covered in this chapter will be expanded on throughout later chapters
    of the book and the


    skills developed here will be used in later exercises (particularly regarding
    class diagrams.


    This chapter consists of six sections:-


    1) An introduction to UML


    2) UML Class Diagrams


    3) UML Syntax


    4) UML Package Diagrams


    5) UML Object diagrams


    6) UML Sequence Diagrams


    2.1


    An Introduction to UML


    The Unified Modelling Language, UML, is sometimes described as though it was a
    methodology. It is not!


    A methodology is a system of processes in order to achieve a particular outcome
    e.g. an organised


    sequence of activities in order to gather user requirements. UML on the other
    hand a precise diagramming


    notation that will allow program designs to be represented and discussed. As it
    is graphical in nature it


    becomes easy to visualise, understand and discuss the information presented in
    the diagram. However


    as the diagrams represent technical information they must be precise and clear
    – in order for them to


    work therefore there is a precise notation that must be followed.


    24


    Download free eBooks at bookboon.com


    Object Oriented Programming Using Java


    ![Wondershare](images/bg02500001.jpg)


    The Unified Modelling Language (UML)


    As UML is not a methodology it is left to the user to follow whatever processes
    they deem appropriate


    in order to generate the designs described by the diagrams. UML does not constrain
    this – it merely


    allows those designs to be expressed in an easy to use, but precise, graphical
    notation.


    2.2


    UML Class diagrams


    Classes are the basic components of any object oriented software system and UML
    class diagrams provide


    an easy way to represent these. As well as showing individual classes, in detail,
    class diagrams show


    multiple classes and how they are related to each other. Thus a class diagram
    shows the architecture of


    a system.


    A class consists of:-


    • a unique name (conventionally starting with an uppercase letter)


    • a list of attributes (int, double, boolean, String etc)


    • a list of methods


    25


    Download free eBooks at bookboon.com


    Click on the ad to read more


    Object Oriented Programming Using Java


    The Unified Modelling Language (UML)


    This is shown in a simple box structure…


    ClassName


    attributes


    methods()


    For attributes and methods visibility modifiers are shown (+ for public access,
    – for private access).


    Attributes normally being kept private and methods normally made public.


    Note: String shown above is not a primitive data type but is itself a class. Hence
    it starts with a capital letter.


    Thus a class Book, with String attributes of title and author, and the following
    methods setTitle(),


    getTitle(), setAuthor(), getAuthor() and toString() would be shown as…


    Book


    - title :String- author :String


    +setTitle()+getTitle()+setAuthor()+getAuthor()+toString()


    Activity 1


    Draw a diagram to represent a class called ‘BankAccount’ with the attribute balance
    (of type int) and methods depositMoney() and withdrawMoney(). Show appropriate
    visibility modifiers.


    26


    Download free eBooks at bookboon.com


    Object Oriented Programming Using Java


    The Unified Modelling Language (UML)


    Feedback 1


    BankAccount


    - balance :int


    +depositMoney()+withdrawMoney()+displayBalance()


    The diagram above shows this information


    UML allows us to suppress any information we do not wish to highlight in our diagrams
    – this allows


    us to suppress irrelevant detail and bring to the readers attention just the information
    we wish to focus


    on. Therefore the following are all valid class diagrams…


    Firstly with the access modifiers not shown…


    BankAccount


    balance :int


    depositMoney()withdrawMoney()displayBalance()


    Secondly with the access modifiers and the data type not shown…


    BankAccount


    balance :int


    depositMoney()withdrawMoney()displayBalance()


    27


    Download free eBooks at bookboon.com


    Object Oriented Programming Using Java


    ![Wondershare](images/bg02800001.jpg)


    The Unified Modelling Language (UML)


    And finally with the attributes and methods not shown…


    BankAccount


    i.e. there is a class called ‘BankAccount’ but the details of this are not being
    shown.


    Of course virtually all Java programs will be made up of many classes and classes
    will relate to each


    other – some classes will make use of other classes. These relationships are shown
    by arrows. Different


    type of arrow indicate different relationships (including inheritance and aggregation
    relationships).


    In addition to this class diagrams can make use of keywords, notes and comments.


    As we will see in examples that follow, a class diagram can show the following
    information:-


    • Classes


    - attributes


    - operations


    - visibility


    28


    Download free eBooks at bookboon.com


    Click on the ad to read more


    Object Oriented Programming Using Java


    The Unified Modelling Language (UML)


    • Relationships


    - navigability


    - multiplicity


    - dependency


    - aggregation


    - composition


    • Generalization / specialization


    - inheritance


    - interfaces


    • Keywords


    • Notes and Comments


    2.3


    UML Syntax


    As UML diagrams convey precise information there is a precise syntax that should
    be followed.


    Attributes should be shown as:


    Where visibility is one of:-


    - ‘+’ public


    - ‘-’ private


    - ‘#’ protected


    - ‘~’ package


    and Multiplicity is one of:-


    - ‘n’ exactly n


    - ‘*’ zero or more


    - ‘m..‘n’ between m and n


    The following are examples of attributes correctly specified using UML:-


    - custRef: int [1]


    a private attribute custRef is a single int value


    this would often be shown as – custRef: int However with no multiplicity shown
    we cannot


    safely assume a multiplicity of one was intended by the author.


    visibility name:


    type multiplicity


    29


    Download free eBooks at bookboon.com


    Object Oriented Programming Using Java


    The Unified Modelling Language (UML)


    # itemCodes: String [1..*]


    a protected attribute itemCodes is one or more String values


    validCard: boolean


    an attribute validCard, of unspecified visibility, has unspecified multiplicity


    Operations also have a precise syntax and should be shown as:


    visibility name (par1: type1, par2: type2) : returntype


    where each parameter is shown (in parenthesis) and then the return type is specified.


    An example would be


    + addName (newName: String): boolean


    This denotes a public method ‘addName’ which takes one parameter ‘newName’ of
    type String and


    returns a boolean value.


    Activity 2


    Draw a diagram to represent a class called ‘BankAccount’ with a private attribute
    balance (thisbeing a single integer) and a public method depositMoney() which
    takes an integer parameter, ‘deposit’ and returns a boolean value. Fully specify
    all of this information on a UML class diagram.


    Feedback 2


    The diagram below shows this information


    BankAccount


    - balance :int[1]


    +depositMoney(deposit :int) : boolean


    Denoting Relationships


    As well as denoting individual classes, Class diagrams denote relationships between
    classes. One such


    relationships is called an ‘Association’.


    30


    Download free eBooks at bookboon.com


    Object Oriented Programming Using Java


    ![Wondershare](images/bg03100001.jpg)


    The Unified Modelling Language (UML)


    In a class attributes will be defined. These could be primitive data types (int,
    boolean etc.) however


    attributes can also be complex objects as defined by other classes.


    OneClass


    value : OtherClass


    Thus the figure above shows a class ‘OneClass’ that has an attribute ‘value’.
    This value is not a primitive


    data type but is an object of type defined by ‘OtherClass’.


    We could denote exactly the same information by the diagram below.


    OneClass


    value


    OtherClass


    ![Wondershare](images/bg03100002.jpg)


    We use an association when we want to give two related classes, and their relationship,
    prominence on


    a class diagram


    The ‘source’ class points to the ‘target’ class.


    31


    Download free eBooks at bookboon.com


    Click on the ad to read more'
