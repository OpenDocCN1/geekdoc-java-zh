    系统架构和对象图描述了系统在某一时刻的状态。


    然而，时序图描述了系统在一段时间内是如何工作的。时序图是系统的“动态”表示而非“静态”表示。它们展示了在一段时间内对象内部以及对象之间方法调用的序列。它们对于理解对象在特定场景下如何协作非常有帮助。


    参见下例：


    ![Wondershare](img/bg04800002.jpg)![Wondershare](img/bg04800003.jpg)


    # 统一建模语言 (UML)


    在这个场景中我们三个对象。时间从上到下流动，垂直虚线（生命线）表示对象随时间的持续存在。


    此图显示了发生的以下动作：


    * 首先，从某处向 `object1` 发来一个方法调用（在面向对象术语中通常称为消息）`method0()` —— 这可能是图之外的另一个类。

    * `object1` 开始执行其 `method0()`（由从这里开始的垂直条形（称为激活条）指示）。

    * `object1.method0()` 调用了 `object2.method1()` —— 激活条表示该操作执行一段时间后会将控制权交回 `method0()`。

    * 随后 `object1.method0()` 传递两个参数调用了 `object2.method2()`。

    * `method2()` 随后调用了 `object3.method3()`。当 `method3()` 结束时，它将一个返回值传给 `method2()`。

    * `method2()` 完成并将控制权返回给 `object1.method0()`。

    * 最后 `method0()` 调用了同一对象的另一个方法 `method4()`。


    ## 选择与迭代


    场景的逻辑通常取决于选择（`if`）和迭代（循环）。有一种符号（交互帧）允许在时序图中表示 if 和循环；然而，这些符号往往会让图表变得杂乱。


    时序图通常最适合说明特定案例，而完整的细节则留给实现代码。Fowler（《UML 快速入门》，第 3 版）对这些结构进行了简要处理。


    ![Wondershare](img/bg05000001.jpg)


    ## 2.7 总结


    UML 不是一种方法论，而是一种精确的绘图符号。类图和包图非常适合描述系统架构。对象图描述了应用程序在某一时刻的数据，而时序图描述了系统在一段时间内是如何工作的。


    UML 为不同的箭头赋予了不同的含义，因此必须按照指定的规范精确使用这些符号。对于任何 UML 图，都鼓励省略细节 —— 因此，图的作者可以省略他们希望的任何细节，以便向读者传达核心信息。


    # 3 继承与方法重写


    ## 引言


    本章将讨论继承、方法重写以及 `Super` 的正确使用的核心概念。


    ### 目标


    在本章结束时，你将能够……：


    * 领继承层次结构的重要性，

    * 理解如何使用 `Abstract` 类来提取共同特征，

    * 重写方法（包括 `Object` 类中的方法），

    * 解释如何使用 `Super` 来调用正在被重写的方法，

    * 使用 UML 记录继承层次结构，

    * 在 Java 程序中实现继承和方法重写。


    本章涵盖的所有材料将在本书的后续章节中进行开发和扩展。本章将侧重于理解继承层次的应用和文档化，而第 6 章将侧重于培养定义你自己的继承层次结构所需的分析能力。


    本章由十二部分组成：


    1) 对象族

    2) 泛化与特化

    3) 继承

    4) 在 Java 中实现继承

    5) 构造函数

    6) 构造函数规则

    7) 访问控制

    8) 抽象类

    9) 重写方法

    10) `Object` 类

    11) 重写 `Object` 中定义的 `toString()`

    12) 总结


    ## 3.1 对象族


    世界上许多事物属于相关的“族”组。“继承”是从父类向子类“传递”特征的思想，在面向对象的设计和编程中起着重要作用。虽然你可能已经熟悉构造函数和访问控制（`public/private`），但在将这些与继承联系时存在特定的问题。


    此外，我们还需要考虑 `Abstract` 类的使用和方法重写，因为这些是继承背景下的重要概念。最后我们将查看 `Object` 类，它与 Java 中的所有其他类都有着特殊的关系。


    ## 3.2 泛化与特化


    类是一种泛化形式，可以从它创建具有不同细节的对象。因此，对象是其类的“实例”。例如，`Student 051234567` 是 `Student` 类的一个实例。更简洁地说，`051234567`
    是一个 `Student`。


    类本身通常可以通过类似的关系来组织。其中一个我们都有些熟悉的层次结构是描述动物界的层次结构：


    * 界 (Kingdom)

    * 门 (Phylum)

    * 类 (Class)

    * 目 (Order)

    * 科 (Family)

    * 属 (Genus)

    * 种 (Species)

    （例如：动物）

    （例如：脊椎动物）

    （例如：哺乳动物）

    （例如：肉食动物）

    （例如：猫）

    （例如：felix）

    （例如：felix leo）


    我们可以用图形形式表示这种层次结构……


    ![Wondershare](img/bg05300001.jpg)


    当然，画出完整的图所需的时间和空间比我们拥有的多。在这里我们可以看到一个特定的动物：`Fred`。Fred 不是动物类，而是一个真实的动物。Fred 是 `felix
    leo`，是 `felix`，是 `cat`，是 `carnivore`。肉食动物吃肉，所以 Fred 具有特征“吃肉”。脊椎动物有脊柱，所以 Fred 具有特征“有脊柱”。


    “是一个……”的关系将个体连接到特征的层次结构上。这种关系适用于许多现实世界的实体，例如 `BonusSuperSaver` 是 `SavingsAccount`，是
    `BankAccount`。


    ## 3.3 继承


    我们在层次结构的高层指定通用特征，在低层指定更具体的特征。这是面向对象设计中的一个重要原则 —— 我们称之为泛化和特化。层次结构中类/对象之上的类的所有特征会自动包含在其中
    —— 我们称之为继承。


    考虑书籍和杂志 —— 它们都是特定的出版物类型。我们可以在 UML 类图中用类来表示它们。这样做，我们可以看到这些类可能具有的一些实例变量和方法。属性 `title`、`author`
    和 `price` 是显而易见的。不明显的是 `copies` —— 这是当前的库存数量。


    对于书籍，`orderCopies()` 取一个参数来指定要增加库存的数量。对于杂志，`orderQty` 是每期新书收到的数量，而 `currIssue`
    是日期。


