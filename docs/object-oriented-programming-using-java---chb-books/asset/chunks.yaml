    • Assuming a client is returned the toString() method is then invoked to get a
    string


    representation of the client and this is passed as a parameter to the showMessageDialog()


    method (which displays the details of the client with that ID).


    • If getClient() fails to find a client this method will throw an UnknownclientException
    – this


    will be caught here and an appropriate message will be displayed.


    11.13


    Using Test Driven Development and Extending the System


    Now we have a working system – though two important methods have yet to be created.
    We need


    a method to increase a clients credit – this should be placed within the Client
    class. We also need a


    method to delete a client – as this means removing them from the client book this
    should be placed in


    the ClientBook class.


    It has been decided to use Test Driven Development to extend the system by providing
    this functionality


    (as discussed in Chapter 10 Agile Programming).


    In TDD we must:-


    1) Write tests


    2) Set up automated unit testing, which fails because the classes haven’t yet
    been written!


    3) Write the classes so the tests pass


    After creating these methods we must then adapt the interface so that this will
    invoke these methods.


