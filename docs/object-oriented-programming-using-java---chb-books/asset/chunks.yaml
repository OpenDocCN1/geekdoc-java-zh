    ![Wondershare](images/bg19600001.jpg)


    Thanks to the operation of polymorphism this change will have no impact at all
    on any other part of


    the system!


    Looking at the class diagram above we can see that MessageSet keeps and manages
    a set of Messages


    (DummyBoard also keeps a set of messages – once they have been uploaded for display).
    But what about


    UrgentMessages?


    Urgent messages are just a specific type of message. When the addMessage() method
    is invoked within


    MessageSet it requires an object of type Message i.e. a message to be added –
    but an object of the subtype


    UrgentMessage is still a ‘Message’ so the addMessage() method would accept an
    UrgentMessage object.


    Therefore, without making any changes at all to MessageSet, MessageSet can maintain
    a set of all messages


    to be displayed (both urgent and ordinary)!


    Furthermore when the dailyPurge() method is invoked it invokes the getCost() method
    on a Message


    object so that the client can be charged for that message. At run time the JVM
    will determine whether


    the object is of type Message or of type UrgentMessage and it will invoke the
    correct version of the


    getCost() method – remember this was overridden in UrgentMessage. This is polymorphism
    in action!


