    5) Constructors

    6) Constructor Rules

    7) Access Control

    8) Abstract Classes

    9) Overriding Methods

    10) The `Object` Class

    11) Overriding `toString()` defined in `Object`

    12) Summary


    ## 3.1 Object Families


    Many kinds of things in the world fall into related groups of ‘families’. ‘Inheritance’
    is the idea ‘passing down’ characteristics from parent to child, and plays an
    important part in Object Oriented design and programming. While you are probably
    already familiar with constructors and access control (`public/private`), and
    there are particular issues in relating these to inheritance.


    Additionally we need to consider the use of `Abstract` classes and method overriding
    as these are important concepts in the context of inheritance. Finally we will
    look at the `Object` class which has a special role in relation to all other classes
    in Java.


    ## 3.2 Generalisation and Specialisation


    Classes are a generalized form from which objects with differing details can be
    created. Objects are thus ‘instances’ of their class. For example `Student 051234567`
    is an instance of class `Student`. More concisely, `051234567` is a `Student`.


    Classes themselves can often be organised by a similar kind of relationship. One
    hierarchy, that we all have some familiarity with, is that which describes the
    animal kingdom:-


    * Kingdom

    * Phylum

    * Class

    * Order

    * Family

    * Genus

    * Species

    (e.g. animals)

    (e.g. vertebrates)

    (e.g. mammal)

    (e.g. carnivore)

    (e.g. cat)

    (e.g. felix)

    (e.g. felix leo)


    We can represent this hierarchy graphically…


    ![Wondershare](images/bg05300001.jpg)


    Of course to draw the complete diagram would take more time and space than we
    have available. Here we can see one specific animal shown here:- `Fred`. Fred
    is not a class of animal but an actual animal. Fred is a `felix leo is a felix
    is a cat is a carnivore`. Carnivores eat meat so Fred has the characteristic ‘eats
    meat’. Vertebrates have a backbone so Fred has the characteristic ‘has a backbone’.


    The ‘is a’ relationship links an individual to a hierarchy of characteristics.
    This sort of relationship applies to many real world entities, e.g. `BonusSuperSaver
    is a SavingsAccount is a BankAccount`.


    ## 3.3 Inheritance


    We specify the general characteristics high up in the hierarchy and more specific
    characteristics lower down. An important principle in OO – we call this generalization
    and specialization. All the characteristics from classes above a class/object
    in the hierarchy are automatically featured in it – we call this inheritance.


    Consider books and magazines – both specific types of publication. We can show
    classes to represent these on a UML class diagram. In doing so we can see some
    of the instance variables and methods these classes may have. Attributes `title`,
    `author` and `price` are obvious. Less obvious is `copies` this is how many are
    currently in stock.


    For books, `orderCopies()` takes a parameter specifying how many copies are added
    to stock. For magazines, `orderQty` is the number of copies received of each new
    issue and `currIssue` is the date/

