    paradigm of the 1970s.


    ### 1.3 Why use the Object Orientation Paradigm?


    While we can focus our attention on the actual program code we are writing, whatever
    development methodology is adopted, it is not the creation of the code that is
    generally the source of most problems. Most problems arise from:-


    - poor analysis and design: the computer system we create doesn’t do the right
    thing.

    - poor maintainability: the system is hard to understand and revise when, as is
    inevitable, requests for change arise.


    Statistics show 70% of the cost of software is not incurred during its initial
    development phase but is incurred during subsequent years as the software is amended
    to meet the ever changing needs of the organisation for which it was developed.
    For this reason it is essential that software engineers to everything possible
    to ensure that software is easy to maintain during the years after its initial
    creation.


    Object Oriented Programming Using Java


    #### An Introduction to Object Orientated Programming


    The Object Oriented programming paradigm aims to help overcome these problems
    by helping with the analysis and design tasks during the initial software development
    phase (see chapter 6 for more details on this) and by ensuring software is robust
    and maintainable (see chapters 9–11 for information on the support Object Orientation
    and Java provides).


    ### 1.4 Object Oriented Principles


    Abstraction and encapsulation are fundamental principles that underlie the Object
    Oriented approach to software development. Abstraction allows us to consider complex
    ideas while ignoring irrelevant detail that would confuse us. Encapsulation allows
    us to focus on what something does without considering the complexities of how
    it works.


    #### Activity 3


    Consider your home and imagine you were going to swap your home for a week with
    a new friend. Write down three essential things you would tell them about your
    home and that you would want to know about their home. Now list three irrelevant
    details that you would not tell your friend.


    #### Feedback 3


    You presumably would tell them the address, give them a basic list of rooms and
    facilities (e.g. number of bedrooms) and tell them how to get in (i.e which key
    would operate the front door and how to switch off the burglar alarm (if you have
    one).


    You would not tell them irrelevant details (such as the colour of the walls, seats
    etc) as this would overload them with useless information.


    Abstraction allows us to consider the important high level details of your home,
    e.g. the address, without becoming bogged down in detail.


    #### Activity 4


    Consider your home and write down one item, such as a television, that you use
    on a daily basis (and briefly describe how you operate this item). Now consider
    how difficult it would be to describe the internal components of this item and
    give full technical details of how it works.


    #### Feedback 4


    Describing how to operate a television is much easier than describing its internal
    components and explaining in detail exactly how it works. Most people do not even
    know all the components of the appliances they use or how they work – but this
    does not stop them from using appliances every day.


    You may not know the technical details such as how the light switches are wired
    together and how they work internally but you can still switch the lights on and
    off in your home (and in any new building you enter).


    Encapsulation allows us to consider what a light switch does, and how we operate
    it, without needing to worry about the technical detail of how it actually works.


    Two other fundamental principles of Object Orientation are Generalization/specialization
    (which allows us to make use of inheritance) and polymorphism.


    Generalisation allows us to consider general categories of objects which have
    common properties and then define specialised sub classes that inherit the properties
    of the general categories.


    #### Activity 5


    Consider the people who work in a hospital – list three common occupations of
    people you would expect to be employed there. Now for each of these common occupations
    list two or three specific categories of staff.


    #### Feedback 5


    Depending upon your knowledge of the medical profession you may have listed three
    general occupations (e.g. doctor, nurse, cleaner) or you may have listed more
    specific occupations such as radiologist, surgeon etc.


    Whatever your initial list you probably would have been able to specify more specialised
    categories of these occupations e.g.

    - Doctor: Trainee doctor, Junior doctor, Surgeon, Radiologist, etc.

    - Nurse: Triage nurse, Midwife, Ward sister

    - Cleaner: General cleaner, Cleaning supervisor


    Now we have specified some general categories and some more specialised categories
    of staff we can consider the general things that are true for all doctors, all
    nurses etc.


    #### Activity 6


    Make one statement about doctors that you would consider to be true for all doctors
    and make one statement about surgeons that would not be true for all doctors.


    #### Feedback 6


    You could make a statement that all doctors have a knowledge of drugs, can diagnose
    medical conditions and can prescribe appropriate medication.


    For surgeons you could say that they know how to use scalpels and other specialised
    pieces of equipment and they can perform operations.


    According to our list above all surgeons are doctors and therefore still have
    a knowledge of medical conditions and can prescribe appropriate medication. However
    not all doctors are surgeons and therefore not all doctors can perform operations.


    Whatever we specify as true for doctors is also true for trainee doctors, junior
    doctors etc – these specialised categories (or classes) can inherit the attributes
    and behaviours associated with the more general class of ‘doctor’.


    Generalisation / specialisation allows us to define general characteristics and
    operations of an object and allows us to create more specialised versions of this
    object. The specialised versions of this object will automatically inherit all
    of the characteristics of the more generalised object.


    The final principle underlying Object Orientation is Polymorphism which is the
    ability to interact with a object as its generalized category regardless of its
    more specialised category.


    #### Activity 7


    Make one statement about how a hospital manager may interact with all doctors
    employed at their hospital irrespective of what type of doctor they are.


