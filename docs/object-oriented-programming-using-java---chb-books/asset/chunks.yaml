- fmt: "\nProgrammers for many years have been burdened with the tedious and time\
    \ consuming task of writing documentation. Some of this documentation is intended\
    \ for users and explain what a program does and how to use it. Other documentation\
    \ is intended for future programmers who will need to amend and adapt the program\
    \ so that its functionality will change as the needs of an organisation change.\
    \ These programmers need to know what the program does and how it is structured.\
    \ They need to know:\n\n* what packages it contains\n* what classes exist in each\
    \ of these packages and what these classes do,\n* what methods exist in each class\
    \ and for each of these methods\n    * what does the method do\n    * what parameters\
    \ does it require\n    * what, if any, value is returned.\n\n### Javadoc Tool\n\
    The `javadoc` tool won’t produce a user guide but it will provide a technical\
    \ description of the program. The tool analyses `*.java` source files and produces\
    \ documentation as a set of web pages (`HTML` files) in the same format as API\
    \ documentation on the Sun website.\n\n![Wondershare](images/bg15000001.jpg)\n\
    \nThis website provides, as a set of indexed web pages, essential details of the\
    \ Java language specification including all packages, classes, methods and method\
    \ parameters and return values. This extremely useful information was not generated\
    \ by hand but generated using the `javadoc` tool.\n\nThe same tool can produce\
    \ the same style of documentation doe any Java program. However to do this it\
    \ relies on properly formatted (and informative!) javadoc-style comments in source\
    \ files, including tags such as `@author`, `@param` etc.\n\nBecause this documentation\
    \ is generated automatically, at the push of a button, it saves programmers from\
    \ a tedious, time consuming and error prone task. Furthermore the documentation\
    \ can be updated whenever a program is changed.\n\nThis tool does require a programmer\
    \ to add meaningful comments to code as it is developed and poor attention to\
    \ commenting of source code will result in poor javadoc output! On the other hand,\
    \ if the commenting is done properly then the reference documentation is produced\
    \ ‘for free’!\n\nJavadoc comments should be added at the start of every class\
    \ using the standard tags `@author` and `@version` to give an overview of that\
    \ class in the following format:\n\n```java\n/***********************************\n\
    * A description of the class\n*\n* @author name of author\n* @version details\
    \ of version (and date).\n*********************************/\n```\n\nA similar\
    \ comment should be provided for every method using the `@param` and `@return`\
    \ to describe each parameter and to describe the value returned. The details of\
    \ each parameter, starting with the name of the parameter, should be provided\
    \ on separate lines as shown below:\n\n```java\n/***********************************\n\
    * A description of the method\n*\n* @param nameOf1stParam description of first\
    \ parameter\n* @param nameOf2ndParam description of second parameter\n* @return\
    \ description of value returned\n*********************************/\n```\n\n###\
    \ Trust and responsibility\nNNE and Pharmaplan have joined forces to create NNE\
    \ Pharmaplan, the world’s leading engineering and consultancy company focused\
    \ entirely on the pharma and biotech industries.\n\nInés Aréizaga Esteva (Spain),\
    \ 25 years old Education: Chemical Engineer:\n– You have to be proactive and open-minded\
    \ as a newcomer and make it clear to your colleagues what you are able to cope.\
    \ The pharmaceutical field is new to me. But busy as they are, most of my colleagues\
    \ find the time to teach me, and they also trust me. Even though it was a bit\
    \ hard at first, I can feel overtime that I am beginning to be taken seriously\
    \ and that my contribution is appreciated.\n\nNNE Pharmaplan is the world’s leading\
    \ engineering and consultancy company focused entirely on the pharma and biotech\
    \ industries. We employ more than 1500 people worldwide and offer global reach\
    \ and local knowledge along with our all-encompassing list of services. nnepharmaplan.com\n\
    \n![Wondershare](images/bg15100002.jpg)\n\n### Activity 1\nThe method below takes\
    \ two integer numbers and adds them together. This value is returned by the method.\
    \ Write a javadoc comment, using appropriate tags, to describe this method.\n\n\
    ```java\npublic int add(int pNumber1, int pNumber2) {return (pNumber1 + pNumber2);}\n\
    ```\n\n### Feedback 1\n```java\n/************************************ This method\
    \ adds two integer numbers.** \n* @param pNumber1 first number to be added\n*\
    \ @param pNumber2 second number to be added\n* @return sum of the two numbers\n\
    *********************************/\n```\n\nThe `javadoc` tool cannot analyse the\
    \ description of a method to determine if this description provides an accurate\
    \ summary of that method. However the tool does do far more than cut and paste\
    \ a programmer's comments onto a web document. One thing this tool does is analyse\
    \ method signatures and compare this with the tags in the comments to check for\
    \ logical errors. If a method requires three parameters but the comment only describes\
    \ two then this error will be detected and reported to the programmer:\n“warning\
    \ – @param argument “pNumber3” is not a parameter name.”\n\nBy analysing the code\
    \ the tool also provides additional information about the class, the methods that\
    \ have been inherited and the methods that have been overridden.\n\nThe reference\
    \ documentation produced is for programmers using the class(es) concerned, it\
    \ does not include comments within methods intended for programmers editing the\
    \ class source code in maintenance work.\n\nThe generated documentation can be\
    \ placed in a subfolder and can be inspected by opening the file `index.html`\
    \ in a web browser. `javadoc` will only document classes and members which are\
    \ public or protected because only these are available to other programmers. Items\
    \ are private or for which no access qualifier is given are omitted.\n\n### 8.13\
    \ Summary\nThere are various ways in which source code in a programming language\
    \ can be executed. Java uses an intermediate language called `bytecode` and a\
    \ `main` method is required.\n\nWe can go ‘back to basics’ creating Java programs\
    \ using a text editor and the tools of the Java Development Kit but the use of\
    \ a professional IDE, sitting on top of the JDK, can offer additional facilities\
