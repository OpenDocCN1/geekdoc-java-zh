    \ `JFrame`、`JComponent` 和 `JButton`。最后我们展示了 `javax.swing` 包依赖 `java.awt` 包。\n\n\
    注意，这里应用了标准的 UML 抑制原则——`java.awt` 和 `javax.swing` 都包含更多的类，而 `java` 包含其他子包，但我们简单地选择不显示它们。\n\
    \n在下图中，我们使用了另一种方式来表示 `JButton` 位于 `javax.swing` 包中。同样，方的表单比顶部更简洁地显示了所有三个类。\n\n\
    # 使用 Java 进行面向对象编程\n\n![Wondershare](img/bg04300001.jpg)\n\n## 统一建模语言 (UML)\n\n\
    根据包图想要传达的内容，这些不同的表示方法在不同的情况下非常有用。\n\n## 包命名\n\n按照惯，包名通常全小写。\n\n对于本地个人项目，包可以根据个人喜好命名，例如：\n\
    - `mysystem`\n- `mysystem.interface`\n- `mysystem.engine`\n- `mysystem.engine.util`\n\
    - `mysystem.database`\n\n然而，包通常是分发性的，为了实现这一点，包需要全球唯一的名称，因此采用了基于 URL 的命名规范。\n\n\
    ![Wondershare](img/bg04300002.jpg)\n\n## FOSS Analytical\n\nFOSS Analytical A/S\
    \ 的员工是公司价值观的活证明——第一——使用新发明为我们的客户提供专门的解决方案。凭借敏锐的头脑和跨部门团队合作，我们不断努力开发新的独特产品——你想加入我们的团队吗？\n\
    \nFOSS 勤奋工作，将创新和发展作为增长的基础。这体现在 FOSS 1200 名员工中有 200 多名在斯堪的纳维亚和美国从事研发。FOSS 的工程师在生产、开发和营销领域，涵盖广泛的不同领域，即化学、电子、机械、软件、光学、微生物、化学计量学。\n\
    \n我们在一家领先且具有创新的国际公司中提供具有挑战性的工作。你将有机会与高高技能的同事一起使用最先进的技术。\n\n访问 `www.foss.dk` 更多关于\
    \ FOSS 的信息——或直接访问我们的学生网站 `www.foss.dk/sharpminds`，在那里你可以更多关于与我们合作项目、写论文等的可能性。\n\
    \n家族拥有的 FOSS 集团是专门的高科技分析解决方案的全球领先供应商，这些解决方案用于测量和控制农业、食品、制药和化学产品的生产质量。主要活动从丹麦、瑞典和美国发起，总部位于丹麦的\
    \ Hillerød。产品通过 23 家销售公司和广泛的网络进行进行全球营销。\n\n**专门的分析解决方案**\nFOSSSlangerupgade 69340\
    \ Hillerød\n电话：+45 70103370\n`www.foss.dk`\n\n## 包图的说明\n\n每个元素不是通过 `.` 分隔，而是通过\
    \ `::` 分隔。\n\n### 活动 5\n\n你和室友决定一起去购物。为了快速，将以下购物清单分成两部分——你收集的物品和你的室友收集的物品。\n\n\
    苹果、家具抛光剂、梨、胡萝卜、卫生纸、土豆、地板清洁剂。火柴、葡萄。\n\n### 反馈 5\n\n为了提高购物效率，你可能将清单分成了两个位于商店相同区域的物品列表：\n\
    \n**列表 1**：苹果、梨、葡萄、胡萝卜、土豆\n**列表 2**：家具抛光剂、地板清洁剂、火柴、卫生纸。\n\n### 活动 6\n\n你带领一个三个人的团队，需要用\
    \ Java 编写一个程序来监控和控制网络系统。该系统由下面描述七个类组成。将这些类组织到三个包中。每个程序员将负责一个包的代码。给包起任何你认为合适的名称。\n\
    \n- `MainMonitor`：此类启动系统\n- `InterfaceReconfigure`：此类监控网络性能和安全违规\n- `RecordStatsRemoteControl`：这是整个系统的视觉界面\n\
    - `PrintReports`：这允许网络重新配置\n- `database`：在数据库中存储有关网络的数据\n- `tele-management`：允许通过电话对系统进行某些远程控制\n\
    - `reports`：使用存储在数据库中的数据为组织管理层打印管理报告\n\n### 反馈 6\n\n将项目组织成包时并不总是有“唯一的正确答案”，但如果你将类组织到适当的包中（具有相关功能的类），你就改进了系统的封装性并提高了程序员的效率。对于活动\
    \ 6 的建议解决方案所示。\n\n```\ninterface:\n    `MainInterface`, `RemoteControl`\n\nnetwork:\n\
    \    `Monitor`, `Reconfigure`\n\ndatabase:\n    `RecordStats`, `PrintReports`\
    \ \n```\n\n### 活动 7\n\n假设你的组织 URL 为 `www.myorg.com`，下面所示的三个包和七个类都是 `project1`\
    \ 的部分。画一个包图来传达这一信息。\n\n```\ninterface:\n    `MainInterface`, `RemoteControl`\n\
    \nnetwork:\n    `Monitor`, `Reconfigure`\n\ndatabase:\n    `RecordStats`, `PrintReports`\n\
    ```\n\n![Wondershare](img/bg0460001.jpg)\n\n### 反馈 7\n\n![Wondershare](img/bg046002.jpg)\n\
    \n注意：包之间画了依赖箭头。当对这些关系进行更多思考时，它们可能会变成关联（一种比依赖更强的关系）。\n\n## 2.5 UML 对象图\n\n类图和包图允许我们可视化并讨论系统的架构，但有时我们希望讨论系统处理的数据。对象图允许我们可视化一个时间实例以及系统在该时刻可能包含的数据。\n\
    \n对象图看起来与类图相似，但框代表对象的特定实例。框标题为：\n\n`objectName:ClassName`\n\n由于每个框描述特定时刻的特定对象，因此框包含了属性及其值（在该时刻）。\n\
    \n`attribute = value`\n\n这些图用于说明设计期间特定的“快照”场景。下面的对象图显示了图书馆目录系统某一时刻可能存在的多个对象。该系统包含两个类：\n\
    \n- `Book`：存储书籍详情\n- `Library`：维护书籍集合。根据需要添加、搜索或删除书籍。\n\n![Wondershare](img/bg04700001.jpg)![Wondershare](img/bg04700002.jpg)\n\
