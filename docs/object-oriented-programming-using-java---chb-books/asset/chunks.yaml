    \n![Wondershare](img/bg09100002.jpg)\n\n在这里 `Mechanic` 直接与 `Car` 交互。通过这样做，它可以与\
    \ `Car` 的任何子类型交互，例如 `Petrol`（汽油）、`Diesel`（柴油）或未来任何其他类型的 `Car`（例如 `Electric` 电）。这些都是不同的（形状不同），但\
    \ `Mechanic` 仍然可以与它们交互，因为它们都是 `Cars`。这就是多态。\n\n如果添加了 `ElectricCar` 类，`Mechanic`\
    \ 仍然能够对它们进行操作，而无需对 `Mechanic` 类进行任何更改。\n\n# 对象角色与多态的重要性\n\n## 活动 6\n\n假设 `Car`\
    \ 拥有一个 `fixEngine()` 方法，该方法在 `DieselCar` 中被重写，但在 `PetrolCar` 中没有被重写（如下图所示）。\n\n\
    查看此图并回答以下问题……\n\n![Wondershare](img/bg09200002.jpg)\n\na)\n\nb)\n\n在 `repair()`\
    \ 方法内部，下一行代码是否有效？`pCar.fixEngine()`？如果将一个 `DieselCar` 对象传递给 `repair()` 方法，`pCar.fixEngine()`\
    \ 将调用哪个实际方法？\n\n# 反馈 6\n\na)\n\nb)\n\n是的！我们可以对任何 `Car` 对象应用 `fixEngine()` 方法，因为它在\
    \ `Car` 类中已经定义。这将调用被重写的方法。该方法必须在 `Car` 类中定义，否则编译器将在编译时报错。然而，在运行时，Java 运行环境 (`JRE`)\
    \ 将识别出传递的对象为子类型 `DieselCar` 的类型，并调用被重写的方法。考虑到 `repairCar()` 方法并不知道实际传递的是哪种类型的汽车，这确实是相当聪明的做法。\n\
    \n## 4.7 区分子类\n\n如果我们有一个以多态方式处理的对象，但需要检查它实际上是哪种子类型，该怎么办？`instanceof` 运算符可以做到这一点：\n\
    \n`object instanceof class`\n\n如果对象属于指定的类（或其子类），则该测试为真，否则为假。\n\n注意，`(myDiscMag\
    \ instanceof Magazine)` 将为真，因为 `DiscMag` 是一种 `Magazine`。\n\n`instanceof` 也可以在右侧使用接口名称，在这种情况下，它会测试类是否实现了该接口。\n\
    \n严格来说，`instanceof` 是在测试左侧的项目是否为右侧指定的类型，或者为右侧类型的子类型。通过这样做，我们可以扩展 `CashTill` 类，以便根据出售的对象显示特定的消息。\n\
    \n```java\npublic void saleType (SaleableItem pSelb)\n{\n    if (pSelb instanceof\
    \ Publication)\n    {\n        System.out.println(\"This is a Publication\");\n\
    \    }\n    else if (pSelb instanceof Ticket)\n    {\n        System.out.println(\"\
    This is a Ticket\");\n    }\n    else\n    {\n        System.out.println(\"This\
    \ is a an unknown sale type\");\n    }\n}\n```\n\n如果 `pSelb` 是 `Publication` 的任何子类（即\
    \ `Book`、`Magazine` 或 `DiscMag`），则 `pSelb instanceof Publication` 将为真。如果我们愿意，也可以同样测试更具体的子类型，例如\
    \ `pSelb instanceof Book`。\n\n注意，一旦我们通过检查子类型来破坏了多态性，我们也破坏了系统的扩展性——实现 `SaleableItem`\
    \ 接口的新类（例如 `Sweets`）可能也需要向此 `if` 语句中添加新的子句，因此更改会波及到整个系统，导致维护成本变得更高且更容易出错。\n\n\
    与其这样做，我们我们应该尝试将不同的行为封装到子类中，例如在 `SaleableItem` 接口中实现 `describeSelf()` 方法，以便根据出售的物品显示消息。这样不需要修改\
    \ `CashTill`，因此更改会波及到整个系统，结果是维护成本变得更高且更容易出错。\n\n## 4.8 总结\n\n- 多态允许我们根据基类来引用对象，而不是它们的实际类。\n\
    - 多态使我们能够通过添加额外的类来扩展程序，而无需更改类。\n- 我们可以通过调用基类来操作对象，而无需担心具体的子类型。\n- Java 确保在运行时调用相应的类方法。\n\
    - 有时我们需要在继承层次结构中使用多态——即在某种情况下。\n- 任何类都可以实现基类定义的操作。\n- 在这样做时，我们可以提供多态的接口（即操作的集合）。\n\
    - 任何数量类都可以实现特定的接口。\n\n# 5 重载\n\n## 引言\n\n本章将向读者介绍方法重载的概念\n\n### 目标\n\n在本章结束时，你将：\n\
    - 理解“重载”概念\n- 欣赏方法重载提供的灵活性\n- 在在线文档中识别重载方法\n\n本章由以下三个部分组成：\n1) 重载\n2) 为了灵活而重载\n\
    3) 总结\n\n## 信任与责任\n\nNNE 和 Pharmaplan 合作创建了 NNE Pharmaplan，全球领先的制药和生物技术工程与咨询公司。\n\
    \nInés Arizaga Esteva（西班牙），25 岁，教育背景：化学工程师\n——作为一个新人，你必须主动并开放心态，并向同事说明你能应对什么。制药领域对我来说是全新的。尽管他们很忙，大多数同事都会花时间教我，他们也信任我。尽管开始有点困难，但随着时间的推移，我觉得自己开始被认真对待，我的贡献也得到了认可。\n\
    \nNNE Pharmaplan 是全球领先的制药和生物技术工程与咨询公司。我们在全球雇用了 1500 多人，提供全球范围和本地知识，以及我们全面的服务列表。nnepharmaplan.com\n\
    \n## 5.1 重载\n\n在历史上，计算机程序中的方法名必须是唯一的。因此，编译器可以通过查看名称来识别正在调用哪个方法。\n\n然而，许多方法通常需要执行非常相似的功能，例如一个方法可以将两个整数相加，而另一个方法可能需要将两个浮点数相加。如果你必须给这两个方法起唯一的名称，你会给哪个命名\
    \ `add()`？\n\n为了给每个方法一个唯一的名称，名称需要更长且更具体。因此，我们可以将一个方法命名为 `addInt()`，另一个为 `addFloat()`，但这会导致名称泛滥，每个名称都在描述执行相同操作的不同方法（即相加数字）。\n\
    \n为了在 Java 中解决这个问题，你不需要给每个方法一个唯一的名称——因此，上述两个方法都可以命名为 `add()`。然而，如果方法名不是唯一的，Java\
