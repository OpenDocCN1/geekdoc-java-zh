    \ credit`\n- `cost of message`\n- `software connection`\n- `interface`\n- `dummy\
    \ display board`\n\n## List of Verbs\nAnd the following verbs:-\n\n- `acquire`\n\
    - `mount`\n- `show`\n- `advertise`\n- `give (a unique ID)`\n- `display`\n- `add\
    \ (a client)`\n- `look up`\n- `mit (duplicates – NOT!)`\n- `purge`\n- `decrement`\n\
    - `reduce credit`\n- `expire`\n- `delete`\n- `write (the software)`\n- `install`\n\
    - `implement`\n- `test`\n\n## Outside Scope of System\nBy identifying things outside\
    \ the scope of the system we simplify the problem…\n\n- **Nouns:**\n  - `shopfront`\n\
    \  - `software`\n- **Verbs:**\n  - `acquire`, `mount (the display board)`\n  -\
    \ `advertise`\n  - `give (a unique ID)`\n  - `write`, `install`, `implement`,\
    \ `test (the software)`\n\nThe `shopfront` is not part of the system and it is\
    \ not a part of the system to acquire and mount the `displayboard`. The `ID` is\
    \ assigned by the shop owner – not the system. And writing `/installing` the `software`\
    \ is the job of the programmer – it is not part of the system itself.\n\n## Synonyms\n\
    The following are synonyms:-\n\n- **Nouns:**\n  - `LCD message display board`\
    \ = `display board`\n  - `scrolling text message` = `message`\n  - `ID string`\
    \ = `ID`\n  - `credit units` = `client’s credit` = `credit`\n  - `set of current\
    \ messages` = `message set`\n  - `days` = `number of days` = `days remaining`\n\
    - **Verbs:**\n  - `show` = `display`\n\nBy identifying synonyms we avoid needless\
    \ duplication and confusion in the system.\n\n## Potential Classes, Attributes\
    \ and Methods\nNouns that describe significant entities for which we can identify\
    \ properties i.e. data and behaviour i.e. methods could become classes within\
    \ the system. These include:-\n\n- `Client`\n- `Message`\n- `ClientBook`\n- `MessageSet`\n\
    - `DisplayBoard`\n- `DummyDisplayBoard`\n\nNouns that would be better as attributes\
    \ of a class rather than becoming a class themselves:-\n\n- For a `client``:\n\
    \  - `ID`\n  - `name`\n  - `address`\n  - `phone number`\n  - `credit`\n- For\
    \ a `message`:\n  - `text`\n  - `days remaining`\n  - `cost of message`\n\nEach\
    \ of these could be modelled as a class (which `Client` or `Message` would have\
    \ as an object attribute), but we decide that each of them is a sufficiently simple\
    \ piece of information that there is no reason to do so – each one can be a simple\
    \ attribute (instance variable) of a primitive type (e.g. `int`) or library class\
    \ (e.g. `String`).\n\nThis is a design judgement – introducing classes for significant\
    \ entities (`Client`, `Message` etc.) which have a set of information and behaviour\
    \ belonging to them, but not overloading the design with trivially simple classes\
    \ (e.g. `credit` which would just contain an `int` instance variable together\
    \ with a getter and setter!).\n\nVerbs describe candidate methods and we should\
    \ be able to identify the classes these could belong to. For instance:-\n\n- For\
    \ a `client`:\n  - `decrease credit`\n- For a `message`:\n  - `decrement days`\n\
    \nThe other verbs describing potential methods should also be listed:-\n\n- `display`\n\
    - `add (client to book)`\n- `add (message to set)`\n- `lookUp (client in book)`\n\
    - `purge`\n- `decrement`\n- `expire`\n- `delete`\n\nFor each of these the associated\
    \ class should be identified.\n\n## Common Characteristics\nThe final step in\
    \ our preliminary analysis is to identify the common characteristics of classes\
    \ and to identify if these classes should these be linked in an inheritance hierarchy\
    \ or linked by an interface.\n\nLooking at the list of candidate classes provided\
    \ we can see that two classes that share common characteristics:-\n\n- `DisplayBoard`\n\
    - `DummyDisplayBoard`\n\nThis either implies these classes should be linked within\
    \ the system within an inheritance hierarchy or via ‘an interface’ (see section\
    \ 4.5 Interfaces). In this case, the clue is within the description “These will\
    \ have a ‘connection’ to the rest of the system.”\n\n## Further Analysis\nWe could\
    \ now document this design using UML diagrams and program a system accordingly.\
    \ However before doing so it would be better to find any potential faults in our\
    \ designs as fixing these faults now would be quicker than fixing the faults after\
    \ time has been spent the system.\n\nThus we should now refine our design using\
