    # 6.4 识别系统范围之外的事物


    在设计系统时，重要的一部分是识别问题中那些与系统无关或超出系统范围的方面。描述中的部分内容可能是纯粹的背景信息，即为了提供一般信息之用，因此它们不会直接描述我们正在设计的系统的方面。此外，虽然描述中的部分内容可能指的是用户在使用系统时执行的任务，从而描述了需要在系统内实现的功能，但其他部分可能描述的是用户在不使用系统时执行的任务——因此它们并不描述系统内部的功能。


    通过识别描述中与我们正在开发的系统无关的事物，我们可以保持问题尽可能简单。


    ### 活动 2

    查看上面的名词和动词列表，并每个类别中识别出一个位于系统范围之外的项。


    ### 反馈 2

    第一段的大部分是背景信息，没有描述我们需要在系统内实现的功能。我们还需要查看描述的其他部分，以识别出不相关的部分。


    **系统范围之外的事物……**


    **名词:-：**

    * `GetFit Athletic Club` – 这是我们正在开发的系统的客户。它不是我们需要在系统内部建模的实体。

    * `Coastal location` – 跑步的位置与所述的系统功能无关。同样，我们不需要将其建模为系统中的一个对象。

    * `Software system` – 这是我们正在开发的整个系统，它没有描述系统内部的实体。


    **动词:-：**

    * `Organise` – 这是体育俱乐部部成员完成的活动，他们可能是系统的用户，但这不是他们使用系统来完成的活动。

    * `marathon` – 这是跑步者正在做的事。这不是系统需要做的事。


    注意：‘Finish race’（完成比赛）是跑步者做的事，但当这种情况发生时，他们的完赛时间必须记录在系统中。因此，这在实际上并不在系统范围之外。


    # 6.5 识别同义词


    同义词是两个含义相同的单词。在系统描述中识别这些同义词至关重要。如果不这样做，将意味着一个实体被建模了两次，导致重复和混淆。


    ### 活动 3

    查看名词和动词列表，并识别两个同义词，一个在名词列表中，一个在动词列表中。


    ### 反馈 3

    **同义词**


    **名词:-：**

    * `world ranking`

    * `professional=professional runner`

    * `fund-raising`

    * `amateur=amateur runner`

    * `runner=competitor`


    注意：`runner` 不是 `professional runner` 的同义词，因为有些跑步者是业爱好者。


    **动词:-：**

    * `marathon=compete`

    * `check status=display status`

    * `print collection list = print list`

    * `finish race =record`

    * `specified time`


    # 6.6 识别潜在类


    通过识别系统范围之外的方面来简化问题，并识别描述中实际上在描述相同实体和操作的不同部分，我们现在可以开始识别系统中要实现的潜在类。


    某些名词将指示要实现的类，另一些将指示类的属性。良好的面向对象（OO）设计建议将数据和操作封装在一起——因此，类代表复杂的概念实体，我们可以为这些实体识别相关的数据和操作（或方法）。简单实体（如地址）具有相关数据但没有操作，因此这些可以存储为相关类中的简单属性。


    ### 活动 4

    查看上面的名词列表，并识别出五个可以成为类的项。


    ### 反馈 4

    **可能指示类的名词:-：**

    * `Runner`（或 `Competitor`）

    * `Amateur`（或 `Amateur Runner`）

    * `Professional`（或类似的）

    * `FancyDresser`（或 `FancyDress`）

    * `Amateur or similar`

    * `Sponsorshipform`


    # 6.7 识别潜在属性


    识别潜在类后，其他名词可以用来识别这些类的属性。


    ### 活动 5

    查看名词列表，并识别出一个可以作为 `Runner` 类属性的名词，以及一个作为 `FancyDresser` 类属性的名词。


    ### 反馈 5

    **可以成为属性的名词:-**


    **对于 Runner:-：**

    * `number`, `resultStatus` 即已完成 (`boolean`)

    * `time (hours, minutes, seconds)`


    **对于 FancyDresser:-：**

    * `costume (String)`


    当然，我们需要识别所有类的所有属性。


    # 6.8 识别潜在方法


    识别出潜在类后，我们现在可以使用动词来识别这些类的方法。


    ### 活动 6

    查看动词列表，并识别出一个可以作为 `Runner` 类方法的，以及一个可以作为 `FancyDresser` 类方法的项。


    ### 反馈 6

    **可以成为方法的动词:-：**


    **对于 Runner:-：**

    * `describe`（这实际上将成为 `toString()` 的重写版本）

    * `finishRace`

    * `displayStatus`


    **对于 FancyDresser:-：**

    * `describe`（需要再次重写 `toString()` 以包含服装）


    当然，我们需要识别所有类的所有方法。


    # 6.9 识别共同特征


    在识别了具有相关属性和方法的候选类后，我们可以通过识别具有共同特征的类开始将我们的类结构化为继承层次。


    ### 活动 7

    查看下面的类列表，并将四个类放入合适的继承层次结构中。识别出一个不符合该层次体系的类:-

    `Runner`, `Amateur`, `Professional`, `FancyDresser`, `Sponsorshipform`


    ### 反馈 7

    最通用的类，即继承树顶部的类是 `Runner`。`Amateur` 和 `Professional` 是 `Runner` 的子类，而 `FancyDresser`
    是 `Amateur` 的特定类型，因此是 `Amateur` 的子类。


    我们可以将这些类放入继承层次中，因为这些类之间都存在“是”（is-a）的关系。一个 `FancyDresser` 是一个 `Amateur`，而 `Amateur`
    也是一个 `Runner`。`Professional` 也是 `Runner`。


    `SponsorshipForm` 不是 `Runner` 的类型，因此不符合该层次体系。该类将通过某种形式的关联与其他类之一相关。查看描述可以发现，并不是所有跑步者都有赞助单，只有为慈善跑步的业爱好者才有。因此，`Amateur`
    和 `SponsorshipForm` 之间存在关联。


    # 6.10 使用 CRC 卡细化我们的设计


    在识别了系统的主要类以及这些类的属性和方法后，我们现在可以通过定义数据类型和其他细微细节来完善这些设计，文档此

