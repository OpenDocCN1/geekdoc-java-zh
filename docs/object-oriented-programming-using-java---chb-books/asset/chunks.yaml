    ## 7.12 Summary


    The Java ‘Collections Framework’ provides ready-made interfaces and implementations
    for storing collections of objects. This almost completely makes the use of arrays
    redundant.


    There are ‘untyped’ collections, and as of `JDK 5.0` ‘typed’ collections also.


    Collection interfaces include `List`, `Set` and `Map`, each defining appropriate
    operations. Collection implementations include `ArrayList`, `HashSet` and `HashMap`
    which are implementations of the `List`, `Set` and `Map` interfaces respectively.


    Special attention is required when defining objects to be stored in `Sets` (or
    as keys in `Maps`) to define the meaning of ‘duplicate’. For these we need to
    override the methods `equals()` and `hashCode()` methods inherited from `Object`.


    While we have not been able to provide a detailed discussion of collection in
    this chapter the case study, in Chapter 11, will demonstrate the use of `Maps`
    and `Sets` for storing our own objects (not just `Strings`). The code for this
    will be available to download and inspect if required.


    # 8 Java Development Tools


    ## Introduction


    This chapter will introduce the reader to various development tools that support
    the development of large scale Java systems (e.g. `Eclipse` and `NetBeans`). The
    importance of the API documentation and `JavaDoc` tool will also be demonstrated.


    ## Objectives


    By the end of this chapter you will be able to…


    * Understand the roles of the `JDK` and `JRE`

    * Investigate professional development environments (`Eclipse` and `NetBeans`)

    * Understand the importance of the `Javadoc` tool and the value of embedding `Javadoc`
    comments within your code.

    * Write `Javadoc` comments and generate automatic documentation for your programs.


    This chapter consists of thirteen sections:-


    1) Software Implementation

    2) The `JRE`

    3) Java Programs

