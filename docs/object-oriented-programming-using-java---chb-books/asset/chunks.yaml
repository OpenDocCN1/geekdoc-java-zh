  trans: '


    # 测试驱动开发 (TDD)


    自动化单元测试也支持测试驱动开发 (TDD)，这是一种主要与“敏捷”开发流程相关的技术。这已成为软件工程领域的一个热点议题。


    测试驱动开发的方法是：


    1. 编写测试代码（在编写被测试的方法之前）。

    2. 设置自动化单元测试，此时测试会失败，因为类尚未被编写！

    3. 编写类和方法以使测试通过。


    这种顺序的倒置起初看起来很奇怪，但许多软件工程辩论的卓越贡献者认为，这是一种强大的“范式转变”。


    教学任务可以被用来类比。以下哪种方式更简单？

    • 教会某人你所关于某个主题的所有知识，然后决定如何测试他们的知识。

    • 明确决定他们需要学习什么（即决定要测试什么），然后只教此人为了通过该测试所需要的知识。


    ## TDD 周期


    在进行测试驱动开发时，测试最初会引起编译错误，因为被测试的方法并不存在！


    创建一个存根方法（stub method）可以使测试通过编译，但测试本身将失败，因为方法中尚未实现被测试的实际功能。


    我们随后实现方法的正确功能，使测试成功。


    对于复杂的方法，我们可能会经历多次以下循环：`编写测试，失败，实现功能，通过，扩展测试，失败，扩展功能，通过`，以此构建解决方案。


    ## TDD 的主张


    TDD 所称的优势包括：


    • 测试成为开发的内在组成部分，而不是一个往往匆忙的事后补救。

    • 它鼓励程序员编写直接解决要求的简单代码。

    • 在代码开发的同时并行编译一套完整的单元测试套件。

    • “编写测试，编写代码，运行测试”的快速循环（每次针对一个微小的开发增量）增加了程序员的信心和生产力。


    在传统的软件生命周期中，如果软件项目进度落后，财务压力往往导致软件在未完全测试和调试的情况下就被推向市场。在测试驱动开发中，这将是不可能的，因为测试是在系统实现之前编写的。


    ## 总结


    “敏捷”开发方法强调灵活的循环开发，系统向解决方案演进。


    无论采用何种开发流程风格，单元测试都是软件工程实践的重要部分。


    自动化单元测试框架（例如 `JUnit`）允许随着系统开发的进展定期重复执行单元测试。


    测试驱动开发反转了代码创建和测试创建的正常顺序，并在“敏捷”方法中起着主要作用。


    # 11 案例研究


    本章将汇总之前所有的章节，通过一个案例研究展示这些核心概念在实践中是如何工作的。


    ### 目标


    在本章结束时，你将看到……


    • 问题描述如何转换为 `UML` 模型（如第 6 章所示）

    • 类型化集合如何被有效使用的示例，特别是你将看到使用 `sets` 和 `maps` 的示例（如第 7 章所示）

    • 多态的示例，并看到它如何使程序能够简单地扩展（如第 4 章所示）

    • 使用继承和方法重写的简单示例（如第 3 章所示）

    • 多个 `UML` 图的的示例（如第 2 章所示）

    • 最后，你将看到 `Javadoc` 工具的使用（如第 8 章所示）。


    按照本章描述开发的完整工作应用程序，可以作为导出的 `Eclipse` 项目免费下载。`Eclipse` 可以从 www.eclipse.org 免费获取。


    本章由十七个部分组成：


    1. 问题

    2. 初步分析

    3. 进一步分析

    4. 使用 `UML` 记录设计

    5. 接口原型

    6. 为了适应变化的需求修改设计

    7. 类打包

    8. 编写消息类

    9. 编写客户端类

    10. 创建和处理 `UnknownClientException`

    11. 编写主类

    12. 编写接口

    13. 使用测试驱动开发并扩展系统

    14. 生成 `Javadoc`

    15. 运行系统和潜在的编译器警告

    16. 完成的系统……

    17. 总结


    ## 11.1 问题


    用户需求分析对软件工程社区具有重要意义，且完全不在本文的范围之内。本章的目的不是展示如何获取需求，而是展示在收集需求后如何使用面向对象（OO）原则对问题描述进行建模，并将其转换为完整的工作系统。


    我们将设计解决方案的问题是：“为一家小型海滨零售商的滚动显示板开发一个消息管理系统。”


    为了本次练习，我们假设已经通过访谈店主和将使用系统的员工完成了初步需求分析，并据此生成了以下文本描述：


    Rory''s Readables 是一家位于海滨的小店，销售各种便利商品，特别是针对当地市场和游客市场的图书和杂志。它最近还充当了各种当地娱乐和交通提供商的票务处。


    Rory 计划在店面正上方安装一个 LCD 显示板，该显示板可以显示文本消息。Rory 意图利用此广告他自己的产品和优惠，并为付费客户提供消息显示服务（例如：私人销售、失物招领、招聘人员等）。


    每个客户都被赋予一个唯一的 `ID` 字符串（例如 `adams4`），并拥有一个名称、地址、电话号码和以“信用单位”计算的额度。维护一个客户簿，可以在其中添加客户，并可以根据其
    ID 查找客户。


    每条消息都针对特定客户，包含要显示的文本、显示天数以及该消息以单位为单位的费用。不允许重复的消息（即针对同一客户的相同文本）。


    需要维护一组当前消息：可以添加新消息，可以在显示板上显示消息集，并在每天结束时执行清理——每条消息的剩余天数减 1，其客户的额度按消息费用扣除，任何已过期或客户余额不足的消息将从消息集中删除。


    软件要在显示板安装之前编写——因此与显示板的连接应通过一个定义良好的接口，并在软件中实现一个测试用的虚拟显示板。


    根据上述描述，本章描述了如何对此问题进行分析、建模并编写解决方案——并在书中讨论的技术。


    ## 11.2 初步分析


    为了对这些需求进行初步分析（如第 6 章所示），我们必须：


    • 列出名词和动词

    • 识别系统范围之外的事

    • 识别同义词

    • 识别潜在的类、属性和方法


