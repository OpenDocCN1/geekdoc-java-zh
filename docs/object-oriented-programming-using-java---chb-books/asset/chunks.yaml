  trans: "\n\n# 创建和处理 UnknownClientException\n\n`ClientBook` 类中的 `getClient()` 方法在不存在指定\
    \ ID 的客户端时将返回 `null` 值。在那种情况下，在进行每日清理时，我们的程序将会崩溃，因为我们尝试在没有客户端对象的情况下调用 `decreaseCredit()`\
    \ 方法（它将因抛出 `NullPointerException` 异常而崩溃）。\n\n因此，我们需要针对这种可能性建立保护机制。为了防止这种情况发生，我们需要：\n\
    \n- 创建一种新异常（如第 9 节所示），名为 `UnknownClientException`\n- 告诉 `ClientBook` 类在找不到客户端时抛出此异常\n\
    - 在 `dailyPurge()` 方法中捕获并处理此异常。\n\n第一步非常简单，此处不再显示。\n\n## 案例研究\n\n让 `getClient()`\
    \ 方法和 `deleteClient()` 方法生成此异常相对直接（如下所示）：-\n\n```java\npublic Client getClient(String\
    \ pClientID) throws UnknownClientException {\n    Client foundClient;\n    foundClient\
    \ = clientMap.get(pClientID);\n    if (foundClient != null) {\n        return\
    \ foundClient;\n    } else {\n        throw new UnknownClientException(\" ClientBook.getClient():unknown\
    \ client ID: \" + pClientID);\n    }\n}\n```\n\n首先，我们必须告诉编译器此方法可以生成异常。然后，在适当条件下，我们使用关键字\
    \ `new` 调用异常的构造函数，并传递构造函数所需的字符串消息。构造函数返回的对象将被“抛出”。\n\n为了方便起见，字符串指定了生成此异常的方法以及未找到客户端的\
    \ `clientID`。\n\n编译器随后将确保编写 `dailyPurge()` 方法的程序员捕获此异常——希望他们随后会处理它以防止崩溃的发生。\n\n\
    最后一步是在 `dailyPurge()` 方法中捕获并处理 `UnownClientException` ——如第 11.8 节（消息类的编程）所示。\n\
    \n如果客户端不存在，我们可能会删除该消息。然而，在这种情况下，我们选择了更谨慎的做法，因为我们并不知道自己是如何拥有一个“无所有者”消息的。\n\n因此，我们决定如果消息未过期，除了报告错误之外，我们将不采取任何操作。该消息将继续显示（即使没有客户端可以计费！）。\n\
    \n如果无所有者的消息过期了，我们当然还需要将其从显示列表中移除。\n\n## 11.11 类的类的编程\n\n有两个类（在之前给出的类图中未显示）用于“驱动”系统。`Manager`\
    \ 是管理系统的主类。它执行以下功能：\n\n- 它对客户端簿和消息集有持久引用\n- 它设置数据文件\n- 它定义系统启动时发生的情况\n- 它定义系统关闭时发生的情况\n\
    - 最后，它拥有 `getClientBook()` 和 `getMessageSet()` 方法，以便系统的其他部分可以访问客户端簿和消息集。\n\n`startup()`\
    \ 方法所示：\n\n```java\npublic void startUp() {\n    try {\n        FileInputStream\
    \ fis = new FileInputStream(MMS_DATA_FILE);\n        ObjectInputStream ois = new\
    \ ObjectInputStream(fis);\n        cb = ClientBook.readFromFile(ois);\n      \
    \  ms = MessageSet.readFromFile(ois);\n        fis.close();\n    } catch (FileNotFoundException\
    \ fnfe) {\n        JOptionPane.showMessageDialog(null, \"No existingclient/message\
    \ data found\");\n        cb = new ClientBook();\n        ms = new MessageSet(cb);\n\
    \    } catch (IOException ioe) {\n        JOptionPane.showMessageDialog(null,\
    \ \"\"+ioe);\n        System.exit(1);\n    }\n}\n```\n\n`startup()` 方法尝试设置一个对象输入流，并从中尝试重构\
    \ `ClientBook` 和 `MessageSet` 对象。\n\n它有两个 `catch` 块。第一个将捕获 `FileNotFoundException`\
    \ —— 如果找不到数据文件就会发生这种情况，例如第一次运行此程序时。在这种情况下，系统将创建一个新的空的 `ClientBook` 对象和一个 `MessageSet`\
    \ 对象。\n\n第二个 `catch` 块将捕获任何其他 IO 错误，并在情况下退出程序。\n\n## 11.12 接口的编程\n\n另一个驱动类是 `GUImain`。它有一个\
    \ `main()` 方法会调用 `createGUI()` 方法。这创建了三个 `JPanels` 并根据初步设计向这些添加了按钮、文本框和标签。这些 `JPanels`\
    \ 应用了网格布局管理器（如第 8 章第 10 节所述）。\n\n`GUImain` 类还为 GUI 每个按钮定义了动作监听器。\n\n下方显示与 FindClient\
    \ 按钮关联的动作监听器：\n\n```java\nprivate class FindClientListener implements ActionListener\
    \ {\n    public void actionPerformed(ActionEvent arg0) {\n        String id =\
    \ JOptionPane.showInputDialog(null,\"Enter client ID\");\n        if (id == null)\
    \ id = \"\"; //in case Cancel pressed\n        try {\n            JOptionPane.showMessageDialog(null,manager.getClientBook().getClient(id).toString());\n\
    \        }\n    } catch (UnknownClientException uke) {\n        JOptionPane.showMessageDialog(null,\"\
    No such client\");\n    }\n}\n```\n\n## 信任与责任\n\nNNE 和 Pharmaplan 联手创建了 NNE Pharmaplan，这是完全专注于制药和生物技术行业的全球领先工程和咨询公司。\n\
    \nInés Aréiga Esteva（西班牙），25 岁，教育背景：化学工程师 —— 作为一名新人，你必须保持积极和开放的心态，并向同事明确你能胜任。制药领域对我来说是全新的。尽管他们很忙，但大多数同事都会花时间教我，他们也信任我。尽管最初有些困难，但随着时间的推移，我感到开始被认真对待，我的贡献得到了认可。NNE\
    \ Pharmaplan 是全球领先的工程和咨询公司，在全球范围内雇佣了 1500 多名员工，并在全面的服务列表中提供全球视野和本地知识。\n\n## 11.13\
    \ 使用测试驱动开发并扩展系统\n\n现在我们有一个可以运行的系统——尽管两个重要的方法尚未创建。我们需要一个增加客户端信用额的方法 —— 这应该放在 `Client`\
    \ 类中。我们还需要一个删除客户端的方法 —— 因为这意味着从客户端簿中移除他们，这应该放在 `ClientBook` 类中。\n\n已经决定使用测试驱动开发来扩展系统并提供此功能（如敏捷编程所述）。\n\
    \n在 TDD 中我们必须：\n\n1) 编写测试\n2) 设置自动化单元测试，由于类尚未编写测试将会失败！\n3) 编写类以通过测试\n\n在创建这些方法后，我们必须调整接口以便能够调用这些方法。\n\
    \n"
