    中），这也是 Java 的工作原理。


    ## 8.2 JRE


    要运行 Java 程序，我们必须首先使用 Java 开发工具包（`JDK`）中提供的编译器生成中间代码（称为 `bytecode`）——参阅下文第 8.4
    节。


    需要一个包含 Java 虚拟机（`VM`）的 Java 运行环境（`JRE`）来执行字节码和 Java 库包。因此，任何运行 Java 程序的机器上都必须存在
    `JRE`。


    Java 字节码是标准且与平台无关，由于已经为大多数计算设备（包括 PC、笔记本电脑、移动设备、移动手机、互联网设备等）创建了 `JRE`，这使得 Java
    程序具有高度的可移植性。


    ## 8.3 Java 程序


    无论采用何种执行模式，程序员都可以使用各种工具来创建源代码。选项包括根据需要手动调用的简单离散工具（例如编辑器、编译器、解释器），或者使用集成开发环境（`IDE`），它在无缝界面后集成了这些实现工具。更高级的
    `CASE`（计算机辅助软件工程）工具可以将实现过程与开发周期的其他阶段整合——此类软件可以获取 `UML` 类图并自动生成类和方法存根，从而节省了编写 Java
    代码时所需的某些精力。


    在编写 Java 程序时，Java 程序中的每个类（或接口）都有其自己的 `name.java` 文件，其中包含源代码。这些文件由编译器处理生成包含相应字节码的
    `name.class` 文件。要实际作为应用程序运行，其中一个类必须包含一个具有上述签名的 `main()` 方法。


    ## 8.4 JDK


    要开发 Java 程序，你必须首先安装 Java 开发工具包（`JDK`）。它由 Sun 公司开发，并可以通过 http://java.sun.com/ 免费从互联网上获取。在
    5.0（或 1.5）版本之前，它被称为 Java 软件开发工具包（`SDK`）。


    Java `IDE`（例如 `Eclipse` 或 `NetBeans`）构建在 `JDK` 之上以添加 `IDE` 特性——这些特性可能包括界面开发工具、代码调试工具、测试工具和重构工具（稍后将详细介绍这些）。使用
    `IDE` 时，很容易忘记许多功能实际上是 `JDK` 的一部分，当要求 `IDE` 编译程序时，它实际上只是将此请求传递给底层的 `JDK`。


    我们可以直接从命令行使用 `JDK` 来编译和运行 Java 程序，尽管大多数情况下使用 `IDE` 提供的额外功能更为方便。


    有点令人困惑的是，Java 的当前版本同时被称为 6.0、1.6 甚至 1.6.0。这些版本似乎有细微不同的含义——别担心！


    `JDK` 中有很多工具。你可以在 http://java.sun.com/javase/downloads/ 并通过点击文档、APIs 和 JDK 程序员指南的链接获取其中每个工具的描述。两个最重要的基本工具是：


