    # Object Oriented Programming Using Java


    ## The Unified Modelling Language (UML)


    Strictly we could use an association when a class we define has a `String` instance
    variable – but we would not do this because the `String` class is part of the
    Java platform and ‘taken for granted’ like an attribute of a primitive type. This
    would generally be true of all library classes unless we are drawing the diagram
    specifically to explain some aspect of the library class for the benefit of someone
    unfamiliar with its purpose and functionality.


    Additionally we can show multiplicity at both ends of an association:


    ![Wondershare](images/bg03200001.jpg)


    OneClass 1..* OtherClass


    This implies that `OneClass` maintains a collection of objects of type `OtherClass`.
    Collections are an important part of the Java framework that we will look at the
    use of collections in Chapter 7.


    ### Activity 3

    Draw a diagram to represent a class called `Catalogue` and a class called `ItemForSale`
    as defined below:-


    `ItemForSale` has an attribute `name` of type `string` and an attribute `price`
    of type `int`. It also has a method `setPrice()` which takes an integer parameter
    `newPrice`.


    `Catalogue` has an attribute `listOfItems` i.e. the items currently held in the
    catalogue. As zeroor more items can be stored in the catalogue `listOfItems` will
    need to be an array or collection. `Catalogue` also has one method `addItem()`
    which takes an `item` as a parameter (of type `ItemForSale`) and adds this item
    to the `listOfItems`.


    Draw this on a class diagram showing appropriate visibility modifiers for attributes
    and methods.


    ### Feedback 3

    The diagram below shows this information


    ```

    Catalogue

    1

    +addItem(item :ItemForSale)

    listOfItems 0..*

    ItemForSale

    - name :String

    - price : int

    +setPrice(newPrice :int)

    ```


    Note: All class names begin in uppercase, attribute and method names begin in
    lowercase. Also note that the class `ItemForSale` describes a single item (not
    multiple items). `listOfItems` however maintains a list of zero or more individual
    objects.


    ## Types of Association

    There are various different types of association denoted by different arrows:-


    * Dependency

    * Simple association

    * Bidirectional association

    * Aggregation

    * Composition


    Class A, Class B - Dependency

    ![Wondershare](images/bg03300001.jpg)


    Class A, Class B - Simple association(navigable from A to B)


    Class A, Class B - Bidirectional association

    ![Wondershare](images/bg03300002.jpg)


    Class A, Class B - Aggregation

    ![Wondershare](images/bg03300003.jpg)


    Class A, Class B - Composition

    ![Wondershare](images/bg03300004.jpg)


    Class A, Class B - Dependency

    ![Wondershare](images/bg03300005.jpg)


    * `Dependency` is the most unspecific relationship between classes (not strictly
    an ‘association’)

    * `Class A` in some way uses facilities defined by `Class B`

    * Changes to `Class B` may affect `Class A`


    ![Wondershare](images/bg03400001.jpg)


    Typical use of dependency lines would be where `Class A` has a method which is
    passed a parameter object of `Class B`, or uses a local variable of that class,
    or calls `static` methods in `Class B`.


    ### Simple Association

    ![Wondershare](images/bg03400002.jpg)


    * In an association `Class A` ‘uses’ objects of `Class B`

    * Typically `Class A` has an attribute of `Class B`

    * Navigability is from A to B: i.e. A `Class A` object can access the `Class B`
    object(s) with which it is associated. The reverse is not true – the `Class B`
    object doesn’t ‘know about’ the `Class A` object


    A simple association typically corresponds to an instance variable in `Class A`
    of the target class `B` type. Example: the `Catalogue` above needs access to 0
    or more `ItemsForSale` so items can be added or removed from a `Catalogue`. An
    `ItemForSale` does not need to access a `Catalogue` in order to set its price
    or perform some other method associated with the item itself.


    ### Trust and responsibility

    NNE and Pharmaplan have joined forces to create NNE Pharmaplan, the world’s leading
    engineering and consultancy company focused entirely on the pharma and biotech
    industries.


    Inés Aréizaga Esteva (Spain), 25 years old Education: Chemical Engineer

    – You have to be proactive and open-minded as a newcomer and make it clear to
    your colleagues what you are able to cope. The pharmaceutical field is new to
    me. But busy as they are, most of my colleagues find the time to teach me, and
    they also trust me. Even though it was a bit hard at first, I can feel overtime
    that I am beginning to be taken seriously and that my contribution is appreciated.


    NNE Pharmaplan is the world’s leading engineering and consultancy company focused
    entirely on the pharma and biotech industries. We employ more than 1500 people
    worldwide and offer global reach and local knowledge along with our all-encompassing
    list of services. nnepharmaplan.com


    ![Wondershare](images/bg03400003.jpg)


    ### Bidirectional Association

    Class A, Class B

    ![Wondershare](images/bg03500001.jpg)


    * `Bidirectional Association` is when Classes A and B have a two-way association

    * Each refers to the other

    * Navigability A to B:

    - A `Class A` object can access the `Class B` object(s) with which it is associated

    - Object(s) of `Class B` ‘belong to’ `Class A`

    - Reference from A to B

    - Also, a `Class B` object can access the `Class A` object(s) with which it is
    associated


    An example of bidirectional association may be between `Degree` and `Student`.
    ie. given a `Degree` we may wish to know which `Students` are studying on that
    Degree. Alternatively starting with a student we may wish to know the `Degree`
    they are studying. As many students study the same `Degree` at the same time there
    is still a one to many relationship here.


    ### Aggregation

    ![Wondershare](images/bg03500002.jpg)


    * `Aggregation` denotes a situation where Object(s) of `Class B` ‘belong to’ `Class
    A`

    * Implies reference from A to B

    * While aggregation implies that objects of `Class B` belong to objects of `Class
    A` it also implies that object of `Class B` retain an existence independent of
    `Class A`.


    An example of aggregation would be between a `Class Car` and a `Class Tyre`. We
    think of the tyres as belonging to the car they are on, but at the garage they
    may be removed and placed on a rack to be repaired. Their existence isn’t dependent
    on the existence of a car with which they are associated.


    ### Composition

    ![Wondershare](images/bg0360001.jpg)


    * `Composition` is similar to aggregation but implies a much stronger belonging
    relationship

    i.e. Object(s) of `Class B` are ‘part of ’ a `Class A` object

    * Again implies reference from A to B

    * Much ‘stronger’ than aggregation in this case `Class B` objects are an integral
    part of `Class A` and in general objects of `Class B` never exist other than as
    part of `Class A`, i.e. they have the same ‘lifetime’


    An example of composition would be between `Points`, `Lines` and `Shapes` as elements
    of a `Picture`. These objects can only exist as part of a picture, and if the
    picture is deleted they are also deleted.


    As well as denoting associations, class diagrams can denote:-


    * Inheritance

    * Interfaces

    '
