    # Download free eBooks at bookboon.com


    # Object Oriented Programming Using Java


    ## Case study


    Two test cases are given below:-


    ```java

    public void testIncreaseCredit() {Client c = new Client("Simon", "Room 217", "x2756",
    10);c.increaseCredit(10);assertEquals(20, c.getCredit());}


    public void testDeleteClient() {ClientBook cb = new ClientBook();Client c = new
    Client("Simon", "Room 217", "x2756", 10);cb.addClient("sk", c);try { cb.deleteClient("sk");}
    catch (UnknownClientException uce) {fail();}try { c = cb.getClient("sk");fail();}
    catch (UnknownClientException uce) {} }

    ```


    The first of these creates a client with 10 units of credit, adds an additional
    10 units of credit and then checks that this client has 20 units of credit.


    One test does alone not sufficiently prove that the `increaseCredit()` method
    will always work so we made need to define additional tests.


    The second test creates and empty client book, creates a client, adds the client
    to the client book and tries to delete this client – if at this point an `unknownClientException`
    is generated then we know there is a problem. Once deleted we try to delete the
    object for a second time and this should fail as an `unknownClientException` should
    now be generated. If an exception is not generated at this point then the class
    is flawed and the test should ‘fail’.


    Having created test cases these will generate complier errors as the methods `increaseCredit()`
    and `deleteClient()` do not exist.


    We must now create the methods and revise them until these tests pass.


    The `increaseCredit()` method is given below…


    ```java

    public void increaseCredit(int pExtraCredit) {credit = credit + pExtraCredit;
    }

    ```


    ## Theory


    Theory suggest that TDD leads to simple code. In this case by focusing our minds
    on what the `increaseCredit()` method needs to achieve we reduce the risk of over
    complicating the code. Of course we may need a range of test case to make sure
    the method has all of the essential functionality it needs.


    ## 11.14 Generating Javadoc


    Documentation is essential and can be generated automatically (as described in
    Chapter 8 – Java Development Tools) assuming appropriate comments have been placed
    in the code.


    Javadoc comments have been placed in the code to describe all classes, all constructors
    and all methods. All parameters and return values have been described.


    Three of the comments taken from the `Client` class are shown below:-


    ```java

    /************************************************************** A customer of
    the message display service** @author Simon Kendal* @version 1.0 (26 June 2009)***********************************************************/

    public class Client implements Serializable {


    ... lines missing ...


    /*** Constructor** @param pName name of client* @param pAddress client''s address*
    @param pPhone client''s phone number* @param pCredit initial credit for client*/public
    Client(String pName, String pAddress, String pPhone,int pCredit) {


    ... lines missing ...


    /*** return the client''s current credit** @return credit units remaining*/public
    int getCredit() {


    ... lines missing ...


    }

    ```


    Once Javadoc style comments have been placed throughout the code initiating the
    `javadoc` tool will generate a set of web pages to describe the system (in `Eclipse`
    this is done by selecting `Project | Generate Javadoc` menu items).


    The following picture shows part of the Java documentation describing the `UrgentMessage`
    class:-


    ![Wondershare](images/bg21300001.jpg)


    ## 11.15 Running the System and Potential Compiler Warnings


    The complete program, as described in this chapter, is available with this textbook
    as an exported `Eclipse` project. To run this program:-


    - Download the file ‘OOP Using Java’

    - Import it into `Eclipse` by selecting `File | Import | Existing Project Into
    Workspace | Select Archive File ‘OOP Using Java’ and then select the `Message
    Management System` project that is inside the archive file.

    - Using the `Eclipse` package explorer window, right click on the `GUImain` class
    which is inside the package `main` and select ‘Run as Java application’.


    In this exported file are all classes, methods and test cases discussed in this
    chapter along with the Javadoc generated by the `javadoc` tool. To view the Javadoc
    go to the `.doc` folder and double click on the `index.html` page.


    When examining this program, depending upon your compiler settings, you may notice
    some warning messages. One in particular that you are likely to see refers to
    the serializable classes (`MessageSet`, `Message` etc) as I have not given them
    version numbers.


    These warnings should have no impact on running the system and can be switched
    of if required by going to `Window | Preferences |Compiler | Errors & Warnings`
    and selecting ignore for those warnings you wish to suppress (as shown below).


    ![Wondershare](images/bg21400001.jpg)


    ## 11.16 The Finished System…


    The following screen shots show the finished system.


    Firstly the main interface window – this is very similar to the design. The only
    change was one extra button that was added to allow a message to be designated
    as an urgent message.


    ![Wondershare](images/bg21400002.jpg)


    The next two images show the pop up dialogues that appear when the ‘Find Client’
    button is pressed. Firstly asking for a client ID…


    ![Wondershare](images/bg21500001.jpg)


    Secondly displaying the client details – assuming a client with this ID has been
    added.


    ![Wondershare](images/bg21500002.jpg)


    The ‘Display Messages’ button shows each of the messages on the screen that should
    be display using the `DummyBoard` class. This is only crudely simulating a real
    display board and makes no effort to scroll the messages or display them in any
    graphically interesting way.


    ‘Purge Messages’ invokes the `purgeMessages()` method. It does nothing visible
    but decrements the days remaining for each message, decreases the clients credits
    and deletes the messages if appropriate. This can be tested by running Find Client
    before and after doing a daily purge.


    ## 11.17 Summary


    The fundamental principles of the Object Orientated development paradigm are


    - abstraction

    - encapsulation

    - generalization/specialization (inheritance)

    - polymorphism


    These principles are ubiquitous throughout the Java language and library package
    APIs as well as providing a framework for our own software development projects.
    Throughout this chapter you will hopefully have seen how Object Orientation supports
    the programmer by:-


    - using abstraction and encapsulation enables us to focus on and program different
    parts of a complex system without worrying about ‘the whole’.

    - using inheritance to ‘factor out’ common code

    - using polymorphism to make programs easier to change

    - using tools help document and manage large software projects.


    This has been exemplified using Java but the same principles and the tools demonstrated
    here are available in many modern IDE’s. Through reading this book, and doing
    the small exercises, you will hopefully have gained some understanding of these
    principles.


    I hope you have found this book helpful and I wish you all the best for the future.

