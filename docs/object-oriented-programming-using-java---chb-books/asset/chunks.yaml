    ```bash

    java MyProg

    ```


    另一个非常有用的工具是 `javadoc` – 它使用 Java 源代码中的注释为程序生成自动文档。


    ## 8.5 Eclipse


    转向“工业级强度”的 `IDE` 是你作为软件开发人员进步中的一个重要里程碑，就像第一次骑没有辅助轮的自行车一样。通过一些练习，你很快就会发现它提供了许多有用且节省时间的设施，让你流离不开……


    `Eclipse` 是一个灵活且可扩展的 `IDE` 平台。它最初由 IBM 开发，现在已开源，可以在 Eclipse Foundation 的 www.eclipse.org
    下载。


    `Eclipse` 使用 Java 编写的，像所有 Java 程序一样，它需要 `JRE` 才能工作，但默认带有 Java 开发工具 (`JDT`)，并且扩展和额外的工具支持其他语言的开发。`Eclipse`
    “运行时平台”足够灵活，甚至可以作为开发 IDE 相关应用程序的框架。


