  trans: "\n\n# 消息类的编程\n\n`Message`、`UrgentMessage` 和 `MessageSet` 的编程相对直接。\n\n`Message`\
    \ 拥有各种实例变量（字符串型：`clientID`、`text` 和整型：`daysRemaining`）。它包含一个构造函数来初始化实例变量，并具有以下方法：\n\
    \n- `void decrementDays()`\n- `boolean hasExpired()`\n- `String getClientID()`\n\
    - `int getCost()`\n- `String getText()`\n\n`Manager` 类需要将 `ClientBook` 和 `MessageSet`\
    \ 对象存储到文件中。为了实现这一点，所有的 `Client` 对象和 `Message` 对象也需要被存储，因此这些类（包括 `Message` 类）需要实现\
    \ `Serializable` 接口。\n\n最后，需求指出“不允许出现重复的消息（即：同一个客户端的相同文本）”。因此，`Message` 必须重写 `equals()`\
    \ 和 `hashCode()` 方法，以确保在将消息存储在 `Set` 中时不会允许重复。\n\n下面给出了该类的完整代码——为了简洁起见，已排除了注释。\n\
    \n```java\npackage messages;\nimport java.io.Serializable;\n\npublic class Message\
    \ implements Serializable{\n    final int COST=1;\n\n    private String clientID;\n\
    \    private String messageText;\n    private int daysRemaining;\n\n    public\
    \ Message (String pClientID, String pText,int pDaysRemaining) {\n        clientID\
    \ = pClientID;\n        messageText = pText;\n        daysRemaining = pDaysRemaining;\n\
    \    }\n\n    public void decrementDays() {\n        daysRemaining--;\n    }\n\
    \n    public boolean hasExpired() {\n        return (daysRemaining == 0);\n  \
    \  }\n\n    public String getClientID() {\n        return clientID;\n    }\n\n\
    \    public String getText () {\n        return messageText;\n    }\n\n    public\
    \ int getCost() {\n        return COST;\n    }\n\n    public int hashCode () {\n\
    \        return (clientID + messageText).hashCode();\n    }\n\n    public boolean\
    \ equals (Object pOther) {\n        Message otherMsg = (Message)pOther;\n    \
    \    return (clientID.equals(otherMsg.clientID) && messageText.equals(otherMsg.messageText));\n\
    \    }\n\n    public String toString(){\n        return (\"Message text: \" +\
    \ messageText +\"\\nClient: \" + clientID +\"\\nDays left: \" + daysRemaining);\n\
    \    }\n}\n```\n\n`UrgentMessage` 类非常短小高效，因为它几乎从 `Message` 继承了所有的功能：\n\n```java\n\
    package messages;\n\npublic class UrgentMessage extends Message{\n    final int\
    \ COST=2;\n\n    public UrgentMessage (String pClientID, String pText,int pDaysRemaining){\n\
    \        super(pClientID, pText, pDaysRemaining);\n    }\n\n    public String\
    \ getText () {\n        return \"*** \"+super.getText()+ \" ***\";\n    }\n\n\
    \    public int getCost() {\n        return COST;\n    }\n}\n```\n\n`MessageSet`\
    \ 类与 `Message` 存在一对多的关系。这意味着它使用一种集合类型，并且不允许重复消息（至少对于同一个客户端）这一事实意味着该集合应该是一个 `Set`。\n\
    \n`MessageSet` 类需要一个实例变量来持有消息集，还需要一个变量来引用 `ClientBook`——因为它在执行每日清理时需要访问客户端。\n\n\
    需要一个构造函数来将新的 `HashSet()` 分配给 `messageSet`，并将 `clientBook` 初始化为参数。还需要以下方法：\n\n\
    - `void addMessage(Message pMsgToAdd)`\n- `void display(DisplayBoardControl db)`\n\
    - `void dailyPurge()`\n\n该类的部分代码显示如下：-\n\n```java\npackage messages;\nimport ...\n\
    \npublic class MessageSet implements Serializable{\n    private Set<Message> messageSet;\n\
    \    private ClientBook clients;\n\n    public MessageSet (ClientBook pClients){\n\
    \        clients = pClients;\n        messageSet = new HashSet<Message>();\n \
    \   }\n\n    public void addMessage(Message pMsgToAdd) {\n        messageSet.add(pMsgToAdd);\n\
    \    }\n\n    public void display(DisplayBoardControl db){ \n        db.loadMessages(messageSet);\n\
    \        db.run();\n    }\n\n    public void dailyPurge() {\n        // 此处省略代码\n\
    \    }\n\n    public void saveToFile(ObjectOutputStream oos) {\n        try {\
    \ \n            oos.writeObject(this);\n        } catch (IOException ioe) {\n\
    \            JOptionPane.showMessageDialog(null, \"\"+ioe);\n        }\n    }\n\
    \n    static public MessageSet readFromFile(ObjectInputStream ois) {\n       \
    \ MessageSet cb = null;\n        try {\n            cb = (MessageSet) ois.readObject();\n\
    \        } catch (IOException ioe) {\n            JOptionPane.showMessageDialog(null,\
    \ \"\"+ioe);\n            System.exit(1);\n        } catch (ClassNotFoundException\
    \ cnfe) {\n            JOptionPane.showMessageDialog(null, \"\"+cnfe);\n     \
    \       System.exit(1);\n        }\n        return cb;\n    }\n}\n```\n\n上面的代码展示了类型化“Message”集合的创建以及添加和显示消息的方法。\n\
    \n显示消息的方法需要传递一个类型为 `DisplayBoardControl` 的对象参数。初始将提供一个 `DummyBoard` 对象，但当购买了真实的显示板时，该对象将替换\
    \ `DummyBoard` 对象。这对于 `display()` 方法内部的代码没有影响，因为这两个对象都是更通用的类型 `DisplayBoardControl`。这是多态性应用的另一个例子。\n\
    \n额外创建了两个方法 `saveToFile()` 和 `readFromFile()`，它们使用对象序列化技术将整个消息集读取并写入文件。-\n\n`dailyPurge()`\
    \ 方法在上面的代码中被排除了，以便我们专注于这个方法：-\n\n```java\npublic void dailyPurge() {\n    Client\
    \ client;\n    // 遍历所有当前消息\n    for (Message msg:messageSet) {\n        // 消息的剩余天数减\
    \ 1\n        msg.decrementDays();\n        try{\n            // 找到支付这条消息的客户端\n\
    \            client = clients.getClient(msg.getClientID());\n            // Find\
    \ 消息的费用并从客户端的余额中扣除\n            client.decreaseCredit(msg.getCost());\n      \
    \      // 如果消息过期或客户端余额不足，则移除\n            if (msg.hasExpired() || client.getCredit()\
    \ <= 0) {\n                messageSet.remove(msg);\n            }\n        }catch(UnknownClientException\
    \ uce) {\n            JOptionPane.showMessageDialog(null,\"INTERNAL ERROR IN MessageSet.Purge()\\\
    n\"Exception details: \" + uce);\n            if (msg.hasExpired()) {\n      \
    \          messageSet.remove(msg);\n            }\n        }\n    }\n}\n```\n\n\
    `dailyPurge()` 方法执行以下操作：\n1. 对于每条消息\n2. 减少消息的剩余天数\n3. 找到支付该消息的客户端\n4. 找到消息的费用并从该客户端的余额中扣除\n\
    5. 如果消息过期或客户端余额不足，将其移除\n\n注意，可能找不到客户端——因此使用了 try catch 块。这将在下一节讨论。\n\n# 客户端类的编程\n\
    \n`Client` 类的编程与 `Message` 类非常相似，此处未显示。\n\n`ClientBook` 类的编程与 `MessageSet` 非常相似，该类的大部分代码已省略，但有两个显著差异：\n\
    \n- 所有客户端都有 `clientID`，因此 `ClientBook` 使用 `Map` 而不是 `Set`。\n- 如果不存在指定 `clientID`\
    \ 的客户端，`getClient()` 方法可能会失败。我们需要为找不到客户端的情况构建保护机制。\n\n```java\npackage clients;\n\
    import ...\n\npublic class ClientBook implements Serializable {\n    private Map<String,Client>\
    \ clientMap;\n\n    public ClientBook() {\n        clientMap = new HashMap<String,Client>();\n\
    \    }\n\n    public void addClient(String pClientID, Client pNewClient) {\n \
    \       clientMap.put(pClientID, pNewClient);\n    }\n\n    public Client getClient(String\
    \ pClientID)// 省略\n\n    public void saveToFile(ObjectOutputStream oos) {\n  \
    \      // 省略\n    }\n\n    static public ClientBook readFromFile(ObjectInputStream\
    \ ois) {\n        // 省略\n    }\n}\n```\n\n上面的代码展示了 `Map` 的创建以及 `ClientBook` 类所需的其他方法。\n\
    \n"
- fmt: "\n# Creating and Handling UnknownClientException\n\nThe `getClient()` method\
    \ in the `ClientBook` class will return a `null` value if no client exists with\
    \ the specified ID. In such a case during the daily purge our program will crash\
    \ as we try to invoke the `decreaseCredit()` method without having a client object\
    \ to invoke this method on (it will crash with a `NullPointerException`).\n\n\
    We therefore need to build in protection against this eventuality. To protect\
    \ against this we need to:-\n\n- Create a new kind of exception (as described\
    \ in Chapter 9) called `UnknownClientException`\n- tell the `ClientBook` class\
    \ to throw this exception if a client is not found\n- catch and deal with this\
    \ exception in the `dailyPurge()` method.\n\nThe first step is simple and not\
    \ shown here.\n\n## Case study\n\nTelling the `getClient()` method and `deleteClient()`\
    \ method to generate this exception is relatively straightforward (as shown below):-\n\
    \n```java\npublic Client getClient(String pClientID) throws UnknownClientException\
    \ {\n    Client foundClient;\n    foundClient = clientMap.get(pClientID);\n  \
    \  if (foundClient != null) {\n        return foundClient;\n    } else {\n   \
    \     throw new UnknownClientException(\" ClientBook.getClient():unknown client\
    \ ID: \" + pClientID);\n    }\n}\n```\n\nFirstly we must tell the compiler that\
    \ this method can generate an exception. Then, under the appropriate condition,\
    \ we invoke the constructor of the exception using the keyword `new` and pass\
    \ a string message required by the constructor. The object returned by the constructor\
    \ is then ‘thrown’.\n\nTo be helpful the string specifies the method where this\
    \ exception was generated from and the `clientID` for which a client was not found.\n\
    \nThe compiler will then ensure that the programmer writing the `dailyPurge()`\
    \ method catches this exception – hopefully they will then deal with it to prevent\
    \ a crash situation.\n\nThe final step is to catch and deal with `UnownClientException`\
    \ within the `dailyPurge()` method – as shown in section 11.8 (Programming the\
    \ Message Classes).\n\nIf a client does not exist we may could remove the message.\
    \ However in this case we have chosen to be more cautious since we simply don’t\
    \ know how we have come to have an ‘unowned’ message.\n\nWe have therefore decided\
    \ that if the message has not expired we will not to take any action other than\
    \ to report the error. The message will continue to be displayed (even without\
    \ having a client to charge!).\n\nIf an unowned message has expired we course\
    \ still need to remove it from the display set.\n\n## 11.11 Programming the Main\
    \ classes\n\nThere are two classes, not shown on the class diagrams given previously,\
    \ that ‘drive’ the system. ‘Manager’ is the main class that manages the system.\
    \ It performs the following functions:-\n\n- it has a permanent reference to the\
    \ client book and message set.\n- it sets up the data file\n- it defines what\
    \ happens when the system starts and\n- it defines what happens when the system\
    \ shuts down\n- finally it has `getClientBook()` and `getMessageSet()` methods\
    \ so the other parts of the system can access the clientbook and message set.\n\
    \nThe `startup()` method is shown below:-\n\n```java\npublic void startUp() {\n\
    \    try {\n        FileInputStream fis = new FileInputStream(MMS_DATA_FILE);\n\
    \        ObjectInputStream ois = new ObjectInputStream(fis);\n        cb = ClientBook.readFromFile(ois);\n\
    \        ms = MessageSet.readFromFile(ois);\n        fis.close();\n    } catch\
    \ (FileNotFoundException fnfe) {\n        JOptionPane.showMessageDialog(null,\
    \ \"No existingclient/message data found\");\n        cb = new ClientBook();\n\
    \        ms = new MessageSet(cb);\n    } catch (IOException ioe) {\n        JOptionPane.showMessageDialog(null,\
    \ \"\"+ioe);\n        System.exit(1);\n    }\n}\n```\n\nThe `startup()` method\
    \ tries to setup an Object Input stream from which it then tries to reconstruct\
    \ `ClientBook` and `MessageSet` objects.\n\nIt has two catch blocks. The first\
    \ will catch a `FileNotFoundException` – this will occur if the file of data cannot\
    \ be found e.g. the first time this program is run. In such a case the system\
    \ will create a new and empty `ClientBook` object and a new `MessageSet` object.\n\
    \nThe second catch block will catch any other IO error and in this case will then\
    \ exit the program.\n\n## 11.12 Programming the Interface\n\nThe other driving\
    \ class is `GUImain`. This has a `main()` method which invokes the `createGUI()`\
    \ method. This creates three `JPanels` and adds buttons, text boxes and labels\
    \ to these according to the preliminary design. A Grid layout manager was applied\
    \ to these `JPanels` (as described in section 10 of chapter 8).\n\nThe `GUImain`\
    \ class also defines action listeners for each of the buttons on the GUI.\n\n\
    Shown below is the action listener associated with the FindClient button:\n\n\
    ```java\nprivate class FindClientListener implements ActionListener {\n    public\
    \ void actionPerformed(ActionEvent arg0) {\n        String id = JOptionPane.showInputDialog(null,\"\
    Enter client ID\");\n        if (id == null) id = \"\"; //in case Cancel pressed\n\
    \        try {\n            JOptionPane.showMessageDialog(null,manager.getClientBook().getClient(id).toString());\n\
    \        }\n    } catch (UnknownClientException uke) {\n        JOptionPane.showMessageDialog(null,\"\
    No such client\");\n    }\n}\n```\n\n## Trust and responsibility\n\nNNE and Pharmaplan\
    \ have joined forces to create NNE Pharmaplan, the world’s leading engineering\
    \ and consultancy company focused entirely on the pharma and biotech industries.\n\
    \nInés Aréiga Esteva (Spain), 25 years old Education: Chemical Engineer – You\
    \ have to be proactive and open-minded as anewcomer and make it clear to your\
    \ colleagues what you are able to cope. The pharmaceutical field is new to me.\
    \ But busy as they are, most of my colleagues find the time to teach me, and they\
    \ also trust me. Even though it was a bit hard at first, I can feel overtime that\
    \ I am beginning to be taken seriously and my contribution is appreciated. NNE\
    \ Pharmaplan is the world’s leading engineering and consultancy company we employ\
    \ more1500 people worldwide and offer global reach and local knowledge along our\
    \ encompassing list of services.\n\n## 11.13 Using Test Driven Development and\
    \ Extending the System\n\nNow we have a working system – though two important\
    \ methods have yet to be created. We need a method to increase a clients credit\
    \ – this should be placed within the `Client` class. We also need a method to\
    \ delete a client – as this means removing them from the client book this should\
    \ be placed in the `ClientBook` class.\n\nIt has been decided to use Test Driven\
    \ Development to extend the system by providing this functionality (as discussed\
    \ in Chapter 10 Agile Programming).\n\nIn TDD we must:-\n\n1) Write tests\n2)\
    \ Set up automated unit testing, which fails because the classes haven’t yet been\
    \ written!\n3) Write the classes so the tests pass\n\nAfter creating these methods\
    \ we must then adapt the interface so that this will invoke these methods.\n"
