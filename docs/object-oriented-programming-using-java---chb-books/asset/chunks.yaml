    public void increaseCredit(int pExtraCredit) {credit = credit + pExtraCredit;
    }

    ```


    ## 理论


    理论认为 TDD（测试驱动开发）可以产生简洁的代码。在这种情况下，通过将注意力集中在 `increaseCredit()` 方法需要实现的目标上，降低了代码过度复杂的风险。当然，我们可能需要一组测试用例来确保该方法具备所有核心功能。


    ## 11.14 生成 Javadoc


    文档是关重要的，并且在假设代码中已放置适当注释的情况下（如第 8 章 – Java 开发工具所述），可以自动生成。


