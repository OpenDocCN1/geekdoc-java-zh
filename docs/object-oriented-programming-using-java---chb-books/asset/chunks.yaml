  trans: "\n\n如果读者编写过使用文件处理功能的 Java 程序，那么他们已经编写了捕获异常的代码，即他们使用过 `try-catch` 块。本章将解释创建自定义异常的重要性，并展示如何通过扩展\
    \ `Exception` 类和使用 `throw` 机制来实现这一目标。\n\n## 目标\n在本章结束时，你将能够……\n* 学会异常的重要性\n* 理解如何创建自定义异常以及\n\
    * 理解如何抛出这些异常。\n\n本章由六部分组成：\n1) 理解异常的重要性\n2) 异常的种类\n3) 扩展 Exception 类\n4) 抛出异常\n\
    5) 捕获异常\n6) 总结\n\n## 9.1 理解异常的重要性\n异常处理编写 Java 程序的关键部分。Java 语言中文件处理类的作者深知此点，并创建了利用\
    \ Java 异常处理机制的——但这些真的重要吗？对于那些使用 Java 编写自己应用程序的程序员来说，这些功能重要吗？\n\n### 活动 1\n想象一个银行程序由三个类和三个方法组成，如下所示……\n\
    \n* `BankManager`\n    * `listOfClients`\n    * `awardLoan()`\n* `BookofClients`\n\
    \    * `getClient(pClientIID :String) :Client`\n* `Client`\n    * `determineCreditRating()`\n\
    \n上述系统由 `BankManager` 类驱动。`awardLoan()` 方法通过接口或另一个方法被调用。该方法旨在接受或拒绝贷款申请。\n\n`BookofClients`\
    \ 类维护了一组账户持有者……如果他们开户，就会被添加到此集合中，当然，他们也可以被移除。然而，我们感兴趣的方法只有 `getClient()` 方法。该方法需要一个字符串参数（客户\
    \ ID），并返回一个客户对象（如果客户在某银行有账户）——或者返回 `NULL`（如果客户不存在）。\n\n`Client` 类只有一个我们感兴趣的方法：`determineCreditRating()`。调用此方法是为了确定客户的信誉评级——`BankManager`\
    \ 类利用此评级决定是否批准贷款。\n\n考虑到上述场景，看下面的代码片段……\n\n```\nClient c = listOfClients.getClient(clientID)\
    \ ;c.determineCreditRating();\n```\n\n这段代码存在于 `awardLoan()` 方法中。首先，它会调用 `getClient()`\
    \ 方法并传递客户 ID 作为参数。该方法将返回适当的客户对象（假设该 ID 的客户确实存在），然后存储在局部变量 `c` 中。获取客户后，将对该客户调用\
    \ `determineCreditRating()` 方法。\n\n看这两行代码。你能识别出它们存在的任何潜在问题吗？\n\n### 反馈 1\n如果存在指定\
    \ ID 的客户，上述代码将正常工作。但是，如果不存在指定 ID 的客户，`getClient()` 方法将返回 `NULL`。\n\n那么第二行代码将导致运行时错误（具体为\
    \ `NullPointerException`），因为它尝试在一个不存在的客户对象上调用 `determineCreditRating()` 方法，程序将在此处崩溃。\n\
    \n### 活动 2\n考虑对此代码进行以下修改，并判断这是否能解决问题。\n\n```java\nClient c = listOfClients.getClient(pClientID)\
    \ ;If (c !=NULL) {c.determineCreditRating(); }\n```\n\n### 反馈 2\n如果将代码修改为允许可能返回的\
    \ `NULL` 值，那么它就能工作了——但这种保护是不安全的，因为它依赖于程序员去发现这个潜在的致命错误。\n\n在编写 `getClient()` 方法时，作者完全意识到可能找不到客户，并在这种情况下决定返回\
    \ `NULL` 值。然而，这依赖于每一个使用该方法的程序员都能识别并防止这种意外的发生。\n\n如果任何使用该方法的程序员未能对 `NULL` 返回进行防护，他们的程序就可能会崩溃——在这种情况下，可能会导致银行损失巨额资金。当然，在其他应用程序中，例如飞机控制系统，程序崩溃可能会导致危及生命的后果。\n\
    \n需要更安全的编程方法来确保潜在的崩溃情况总能得到处理！存在这样一种机制——它被称为“异常”的机制。\n\n通过使用这种机制，我们可以确保使用我们代码的其他程序员会收到潜在崩溃情况的警报，并且编译器将确保这些程序员处理该“问题”。因此，我们可以确保没有此类情况被“遗忘”。如何处理这些问题取决于使用我们方法的程序员的选择，但编译器将确保他们至少识别出潜在的崩溃情况。\n\
    \n在上述情况下，`getClient()` 方法应该生成一个异常，而不是返回 `NULL` 值。通过生成异常，Java 编译器将确保这种情况情况得到处理。\n\
    \n## 9.2 异常的种类\n为了生成有意义的异常，我们需要扩展 Java 语言内置的 `Exception` 类——共有两种（普通异常和运行时异常）。\n\
    \n`java.lang.Exception` 的子类用于需要管理的预期之外的问题。它们必须在源方法的 `throws` 子句中声明，并且对方法的调用必须放在\
    \ `try / catch` 块中。\n\n`java.lang.RuntimeException` 的子类用于会导致运行时失败且可能无法采取任何明智补救措施的情况。它们不需要在\
    \ `throws` 子句中声明，方法调用也不需要放在 `try / catch` 块中（但可以放在其中）。\n\n因此，我们可以选择 Java 编译器是否应该强制我们显式地处理特定类型的异常。`Exception`\
    \ 子类适用于我们知道可能出现问题且可以采取明智恢复措施的情况——例如 IO 错误。`RuntimeException` 子类适用于完全不应该发生的情况，并且可能无法做任何事情恢复局面，例如内存溢出错误或发现系统处于不应出现的状态。\n\
    \n## 9.3 扩展 Exception 类\n在编写自己的方法时，我们应该寻找潜在的失败情况（例如无法返回值、计算过程中可能出现的错误等）。当发生潜在错误时，我们应该生成一个\
    \ `Exception` 对象，即 `Exception` 类的对象。然而，最好的做法是先定义通用异常的子类，即创建一个专门的类并抛出该子类型的对象。\n\
    \n新异常就像任何新类一样，在这种情况下它是 `java.lang.Exception` 的子类。在上述情况下，如果找不到指定 ID 的客户就会发生错误。因此，我们可以创建一个名为\
    \ `UnknownClientException` 的新异常类。\n\n`Exception`构造函数的参数需要一个 `String`，因此 `UnknownClientException`\
    \ 的构造函数也需要一个 `String`。该字符串用于提供可能生成异常的问题细节。\n\n创建此新类的代码如下……\n\n```java\nimport\
    \ java.lang.Exception;\n```\n\n"
- fmt: "\n```java\n/******************************************************** Exception\
    \ thrown when attempting to get an non-existent client ID** @author Simon Kendal*\
    \ @version 1.0 (11th July 2009)********************************************************/\n\
    class UnknownClientException extends Exception{ \n    /*** Constructor** \n  \
    \   * @param pMessage description of exception\n     */\n    UnknownClientException\
    \ (String pMessage){ \n        super(pMessage);\n    } \n}\n```\n```\n\nIn some\
    \ respects this looks rather odd. Here we are creating a subclass of `Exception`\
    \ but our subclass does not contain any new methods – nor does it override any\
    \ existing methods. Thus its functionality is identical to the superclass – however\
    \ it is a subtype with a meaningful and descriptive name.\n\nIf subclasses of\
    \ `Exception` did not exist we would only be able to catch the most general type\
    \ of exception i.e an `Exception` object. Thus we would only be able to write\
    \ a catch block that would catch every single type of exception.\n\n### Creating\
    \ And Using Exceptions\n\nHaving defined a subclass we instead have a choice…\n\
    a) we could define a catch block to catch objects of the general type `Exception`\
    \ i.e it would catch ALL exceptions or b) we could define a catch block that would\
    \ catch `UnknownClientExceptions` but would ignore other types of exception.\n\
    \nBy looking at the online API we can see that many predefined subclass of exception\
    \ already exist. There are many of these including:-\n* `IOException`\n* `CharConversionException`\n\
    * `EOFException`\n* `FileNotFoundException`\n* `ObjectStreamException`\n* `NullPointerException`\n\
    * `PrinterException`\n* `SQLexception`\n\nThus we could write a catch block that\
    \ would react to any type of exception, or we could limited it to input \\ output\
    \ exceptions or we could be even more specific and limit it to `FileNotFound`\
    \ exceptions.\n\n### 9.4 Throwing Exceptions\n\nHaving defined our own exception\
    \ we must then instruct the `getClient()` method to throw this exception (assuming\
    \ a client has not been found with the specified ID).\n\nTo do this we must first\
    \ tell the compiler that this class may generate an exception – the complier will\
    \ then ensure that any future programmer who makes use of this method catches\
    \ this exception.\n\nTo tell the compiler this method throws an exception we add\
    \ the following statement to the methods signature `throws UnknownClientException`.\n\
    \n```java\npublic Client getClient(String pClientID) throws UnknownClientException\n\
    ```\n\nWe must create a new instance of the `UnknownClientException` class and\
    \ apply the `throw` keyword to this newly created object. We use the keyword `throw`\
    \ to throw an exception at the appropriate point within the body of the method.\n\
    \n```java\nif (foundClient != null){ \n    return foundClient;\n}else{ \n    throw\
    \ new UnknownClientException( \" BookOfClients.getClient():unknown client ID:\
    \ \" + pClientID); \n}\n```\n\nIn the example above if a client is found the method\
    \ will return the client object. However it will no longer return a NULL value.\
    \ Instead if a client has not been found the constructor for `UnknownClientException`\
    \ is invoked, using `new`. This constructor requires a `String` parameter – and\
    \ the string we are passing here is an error message that is trying to be informative\
    \ and helpful. The message is specifying:-\n* the class which generated the exception\
    \ (i.e. `BookOfClients`),\n* the method within this class (i.e. `getClient()`),\n\
    * some text which explains what caused the exception and\n* the value of the parameter\
    \ for which a client could not be found.\n\nBy defining an `UnknownClientException`\
    \ and using the `throw` clause in the header of the `getClient()` method we are\
    \ providing a warning to all methods calling this one that an exception may be\
    \ thrown. This enables the Java compiler to make sure a try/catch block is provided\
    \ where required. By doing this we are preventing potentially critical errors\
    \ from going unnoticed.\n\n### 9.5 Catching Exceptions\n\nHaving specified to\
    \ the compiler that this method may generate an exception we are forcing other\
    \ programmers to protect against critical errors by placing calls to this method\
    \ within a try/catch block. The code in the try block will be terminated if an\
    \ exception is generated and the code in the catch block will be initiated instead.\n\
    \nThus in the example above the `awardLoan()` method can decide what to do if\
    \ no client with the specified ID is found:\n\n```java\ntry {\n    Client c =\
    \ listOfClients.getClient(clientID);\n    c.determineCreditRating();\n    // add\
    \ code to award or reject a loan application based on this rating\n}\ncatch (UnknownClientException\
    \ uce) { \n    System.out.println(\"INTERNAL ERROR IN BankManager.awardLoan()\\\
    n\"+ \"Exception details: \" + uce);\n}\n```\n\nNow, instead of crashing with\
    \ a `NullPointerException` if the client ID is not found, the `UnknownClientException`\
    \ we have deliberately thrown will be handled by the Java Virtual Machine which\
    \ will terminate the code in the try clause and invoke the code in the catch clause,\
    \ which in this case will display a message warning the user about the problem.\n\
    \n### 9.6 Summary\n\n* Java exceptions provide a mechanism to deal with abnormal\
    \ situations which occur during program execution.\n* By making use of the Java\
    \ exception mechanism we are protecting against potentially life threatening program\
    \ failure.\n* The exception mechanism will ensure other programmers who use our\
    \ methods recognise and deal with error situations.\n* When exceptions are generated\
    \ the code in a catch block will be initiated – this code could take remedial\
    \ action or terminate the program generating an appropriate error message. In\
    \ either case at least the program doesn’t just ‘stop’.\n\n### 10 Agile Programming\n\
    \nWhile a detailed discussion of Agile development methods is beyond the scope\
    \ of this book, this chapter will explain the claims made by proponents of agile\
    \ programming methods and show how modern IDE’s\n"
