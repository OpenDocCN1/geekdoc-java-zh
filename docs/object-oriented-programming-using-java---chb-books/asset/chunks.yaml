  trans: "\n例如 Java 内部存在的测试设施。\n\n# 10.8 JUnit\n\nJUnit 是一个非常广泛使用的 Java 单元测试框架。它以一组开源类的形式被开发，并集成到\
    \ Eclipse 和 NetBeans 等流行的 Java IDE 中。\n\n虽然 `JUnit` 提供了一个自动化测试框架，但我们仍然需要设置测试用例——然而，一旦设置好，只需点击按钮即可运行数千个测试用例，并且在每次修改程序时都可以重新运行同一组测试用例。\n\
    \n`JUnit` 测试类被构建为 `junit.framework.TestCase` 的子类。使用 `assert…()` 方法检查被测试代码的正确行为，这些方法必须为真测试才能通过。\n\
    \n目前 `JUnit` 的 3.8 版本和第 4 版本被广泛使用，但它们之间存在显著差异。在这里我们使用的是更广泛认可的 `Junit 3.8`。\n\n\
    # 10.9 断言示例\n\n在设置测试用例时，我们会进行断言。断言是一个如果代码运行正常，则该语句应当为真的陈。断言的示例包括……\n\n- `assertTrue(…)`\n\
    - `assertFalse(…)`\n- `assertEquals(…)`\n- `assertNotEquals(…)`\n- `assertNull(…)`\n\
    - `assertNotNull(…)`\n- `fail()`\n\n正如我们在这里看到的，`assertEquals()` 和 `fail()` 对于许多测试目的都是足够的的。`fail()`\
    \ 表示到达这一行意味着测试失败了！（我们将看到一个示例）。\n\n# 10.10 若干测试示例\n\n为了说明 `JUnit` 测试框架，我们将创建三个测试用例来测试下面所示的\
    \ `BankManagment` 系统的功能:-\n\n在该系统中，`BankManager` 类维护了一个客户端的“映射”（map）。可以通过 `addClient()`\
    \ 方法添加 `Client` 对象，该方法需要该客户端的 ID 和要添加的客户端对象。可以通过 `getClient()` 方法检索客户端，该方法需要一个\
    \ `ClientID` 作为参数并返回客户端对象（如果存在）或生成异常（如果不存在指定 ID 的客户端）。\n\n`Client` 类有一个构造函数，它需要客户端的名称和地址，并提供了相关的访问器方法。\n\
    \n我们将专门测试以下能力……\n\n- 向 `BookofClients` 添加一个客户端\n- 尝试查找一个不存在的客户端\n- `Client` 类\
    \ `toString()` 方法产生的字符串表示。\n\n这当然只是为了彻底演示系统内所有类和所有方法的正确运行所需的测试用例中的一小部分。\n\n##\
    \ 测试添加客户端\n\n为了测试是否可以添加客户端，我们需要创建一个 `JUnit` 测试用例，该用例将：\n\n1) 创建一个新的空的 `BookofClients`\n\
    2) 创建一个新的客户端并将其添加到 `BookofClients`\n3) 尝试检索与刚刚添加的客户端相同 ID 的客户端（这显然应该是通通的），并且最后\n\
    4) 我们需要测试检索到的客户端与我们刚刚添加的客户端具有相同的属性——以确保它没有被损坏。\n\n代码如下……\n\n```java\npublic void\
    \ testAddClient() {\n    BookofClients bofc = new BookofClients();\n    Client\
    \ c = new Client(\"Simon\",\"No 5, Main St., Sunderland, SR1 0DD\");\n    Client\
    \ c2 = null;\n    bofc.addClient(\"SK001\", c);\n    try {\n        c2 = bofc.getClient(\"\
    SK001\");\n    } catch (UnknownClientException uce) {\n        fail();\n    }\n\
    \    assertEquals(\" Simon \" , c2.getName());\n    assertEquals(\" No 5, Main\
    \ St., Sunderland, SR1 0DD \" ,c2.getAddress());\n}\n```\n\n注意测试方法的名称始终以 `test…()`\
    \ 开始。\n\n如果抛出了 `UnknownClientException`，测试将失败，因为我们本应该找到已添加的“SK001”客户端。\n\n如果我们成功检索了客户端，我们断言\
    \ `getName()` 的值应该等于“Simon”，`getAddress()` 的值应该等于“No 5, Main St., Sunderland,\
    \ SR1 0DD”。如果其中任一情况不符，测试将失败。\n\n注意 `assertEquals()` 方法的两个参数第一个是预期值，第二个是实际值。虽然交换这两个值后断言的结果是相同的，但如果测试失败，会导致\
    \ `JUnit` 给出误导性的报告。\n\n如果测试方法结束时没有触发任何断言失败，则测试通过。\n\n注意，为了使此测试生效，我们需要在 `Client`\
    \ 类中访问器方法 `getName()` 和 `getAddress()`。在设计类时，通常做法是创建纯用于支持单元测试的访问器方法，即使这些方法在实际系统中并不是需要的。\n\
    \n## 测试未知客户端\n\n我们需要执行的一个测试用例是测试：当我们尝试检索一个不存在的客户端时，是否会抛出异常。为了测试这一点，我们创建一个新的空的\
    \ `BookofClients` 并尝试从中检索一个客户端——代码如下……\n\n```java\npublic void testGetClient()\
    \ {\n    BookofClients bofc = new BookofClients();\n    try {\n        bofc.getClient(\"\
    SK001\");\n        fail();\n    } catch (UnknownClientException uce) {\n}\n```\n\
    \n在这种情况下，我们预期会抛出一个 `UnknownClientException`（因为我们还没有添加客户端！），因此如果执行了 `getClient()`\
    \ 之后的行，测试将失败。如果异常被捕获，`catch` 块没有要执行的操作，测试完成。\n\n## 测试 toString() 方法\n\n间接测试所有属性是否正确存储的一种方法是测试\
    \ `toString()` 方法是否返回预期的值。这有点困难，因为字符串的格式必须完全匹配，包括每个空格和换行。\n\n另一种是测试每个访问器方法的返回值。\n\
    \n### 活动 1\n\n假设 `Client` 类的 `toString()` 方法定义如下，创建一个测试方法来测试 `toString()` 方法返回的值是否符合预期。\n\
    \n```java\npublic String toString() {\n    return (\"Client name: \" + mName +\
    \ \"\\nAddress: \" + mAddress);\n}\n```\n提示：首先创建一个具有指定属性的新 `Client` 对象，然后通过使用断言测试该对象的属性是否符合预期。\n\
    \n### 反馈 1\n\n此练习的一个解决方案如下，但显然创建的客户端属性是随意的。\n\n```java\npublic void testClientToString()\
    \ {\n    Client c = new Client(\"Simon\", \"5 Main St., Sunderland\");\n    assertEquals(\"\
    \ Client name: Simon\\nAddress: 5 Main St.,Sunderland \" , c.toString()\n);\n\
    }\n```\n在这里我们断言 `c.toString()` 返回的字符串等于我们预期的字符串。\n\n# 10.11 运行测试\n\n设计好一组测试用例后，我们需要设置这些测试，以便根据需要通过按钮频繁运行它们。\n\
    \n在 Eclipse 中实现这一点，我们\n- 创建新包 `tests`\n- 在 `tests` 中创建新的 `JUnit` 测试用例 `ClientTests`\n\
    - 添加三个测试方法\n- 运行…`JUnit test`\n- 修改代码以导致其中一个测试失败并观察结果\n"
- fmt: "\n# Test Driven Development (TDD)\n\nAutomated unit testing also supports\
    \ Test Driven Development (TDD) which is a technique mainly associated with ‘agile’\
    \ development processes. This has become a hot topic in software engineering.\n\
    \nThe Test Driven Development approach is to:\n\n1. Write the tests (before writing\
    \ the methods being tested).\n2. Set up automated unit testing, which fails because\
    \ the classes haven’t yet been written!\n3. Write the classes and methods so the\
    \ tests pass\n\nThis reversal seems strange at first, but many eminent contributors\
    \ to software engineering debates believe it is a powerful ‘paradigm shift’.\n\
    \nThe task of teaching can be used as an analogy. Which of the following is simpler?\n\
    • Teach someone everything you know about a subject and then decide how to test\
    \ their knowledge\n• Decide specifically what it is they need to learn (i.e. decide\
    \ what to test) and then teach the person just what they need to know in order\
    \ to pass that test.\n\n## TDD Cycles\n\nWhen undertaking test driven development\
    \ the test will initially cause a compilation error as the method being tested\
    \ doesn’t exist!.\n\nCreating a stub method enables the test to compile but it\
    \ the test itself will fail because the actual functionality being tested has\
    \ not been implemented in the method.\n\nWe then implement the correct functionality\
    \ of the method so that the test succeeds.\n\nFor a complex method we might have\
    \ several cycles of: `write test, fail, implement functionality, pass, extend\
    \ test, fail, extend functionality, pass` to build up the solution.\n\n## Claims\
    \ for TDD\n\nAmong the advantages claimed for TDD are:\n\n• testing becomes an\
    \ intrinsic part of development rather than an often hurried afterthought.\n•\
    \ it encourages programmers to write simple code directly addressing the requirements\n\
    • a comprehensive suite of unit tests is compiled in parallel with the code development\n\
    • a rapid cycle of “write test, write code, run test”, each for a small developmental\
    \ increment, increases programmer confidence and productivity.\n\nIn conventional\
    \ software lifecycles if a software project is running late financial pressures\
    \ often result in the software being rushed to market not having been fully tested\
    \ and debugged. With Test Driven Development this is not possible as the tests\
    \ are written before the system has been implemented.\n\n## Summary\n\n‘Agile’\
    \ development approaches emphasize flexible cyclic development with the system\
    \ evolving towards a solution.\n\nUnit testing is an important part of software\
    \ engineering practice whatever style of development process is adopted.\n\nAn\
    \ automated unit testing framework (e.g. `JUnit`) allows unit tests to be regularly\
    \ repeated as system development progresses.\n\nTest Driven Development reverses\
    \ the normal sequence of code and test creation, and plays a major part in ‘agile’\
    \ approaches.\n\n# 11 Case Study\n\nThis chapter will bring together all of the\
    \ previous chapters showing how these essential concepts work in practise through\
    \ one example case study.\n\n### Objectives\n\nBy the end of this chapter you\
    \ will see…\n\n• how a problem description is turned into a `UML` model (as described\
    \ in Chapter 6)\n• an example of how typed collections can be effectively used,\
    \ in particular you will see an example of the use of `sets` and `maps` (as described\
    \ in Chapter 7)\n• an example of polymorphism and see how this enables programs\
    \ to be extended simply (as described in Chapter 4)\n• a simple example of the\
    \ use of inheritance and method overriding (as described in Chapter 3)\n• several\
    \ example of `UML` diagrams (as described in Chapter 2)\n• finally you will see\
    \ the use of the `Javadoc` tool (as described in Chapter 8).\n\nThe complete working\
    \ application, developed as described throughout this chapter, is available to\
    \ download for free as an exported `Eclipse` project. `Eclipse` is freely available\
    \ from `www.eclipse.org`.\n\nThis chapter consists of seventeen sections:\n\n\
    1. The Problem\n2. Preliminary Analysis\n3. Further Analysis\n4. Documenting the\
    \ design using `UML`\n5. Prototyping the Interface\n6. Revising the Design to\
    \ Accommodate Changing Requirements\n7. Packaging the Classes\n8. Programming\
    \ the Message Classes\n9. Programming the Client Classes\n10. Creating and Handling\
    \ `UnknownClientException`\n11. Programming the Main classes\n12. Programming\
    \ the Interface\n13. Using Test Driven Development and Extending the System\n\
    14. Generating `Javadoc`\n15. Running the System and Potential Compiler Warnings\n\
    16. The Finished System…\n17. Summary\n\n## 11.1 The Problem\n\nUser requirements\
    \ analysis is a topic of significant importance to the software engineering community\
    \ and totally outside the scope of this text. The purpose of this chapter is not\
    \ to show how requirements are obtained but to show how a problem statement is\
    \ modelled using OO principles and turned into a complete working system once\
    \ requirements are gathered.\n\nThe problem for which we will design a solution\
    \ is ‘To develop a message management system for a scrolling display board belonging\
    \ to a small seaside retailer.’\n\nFor the purpose of this exercise we will assume\
    \ preliminary requirements analysis has been performed by interviewing the shop\
    \ owner, and the workers who would use the system, and from this the following\
    \ textual description has been generated:\n\nRory ’s Readables is a small shop\
    \ on the seafront selling a range of convenience goods, especially books and magazines\
    \ aimed at both the local and tourist trades. It has recently also become a ticket\
    \ agency for various local entertainment and transport providers.\n\n Rory plans\
    \ to acquire an LCD display board mounted above the shopfront which can show text\
    \ messages. Rory intends to use this to advertise his own products and offers\
    \ and also to provide a message display service for fee-paying clients (e.g. private\
    \ sales, lost and found, staff required etc.)\n\nEach client is given a unique\
    \ `ID` string (e.g. `adams4`) and has a name, an address, a phone number and an\
    \ amount of credit in ‘credit units’. A book of clients is maintained to which\
    \ clients can be added and in which we can look up a client by their ID.\n\nEach\
    \ message is for a specific client and comprises the text to be displayed, the\
    \ number of days for which it should be displayed and the cost of that message\
    \ in units. No duplicate messages (i.e. the same text for the same client) are\
    \ permitted.\n\nA set of current messages is to be maintained: new messages can\
    \ be added, the message set can be displayed on the display board, and at the\
    \ end of each day a purge is performed – each message has its days remaining decremented\
    \ and its client’s credit reduced by the cost of the message, and any messages\
    \ which have expired or whose client has no more credit are deleted from the message\
    \ set.\n\nThe software is to be written before the display board is installed\
    \ – therefore the connection to the board should be via a well-defined interface\
    \ and a dummy display board implemented in software for testing purposes.\n\n\
    Given the description above this chapter describes how this problem may be analysed,\
    \ modelled and a solution programmed – thus demonstrating the techniques discussed\
    \ throughout this book.\n\n## 11.2 Preliminary Analysis\n\nTo perform a preliminary\
    \ analysis of these requirement as (described in Chapter 6) we must:\n\n• List\
    \ the nouns and verbs\n• Identify things outside the scope of the system\n• Identify\
    \ the synonyms\n• Identify the potential classes, attributes and methods\n• Identify\
    \ any common characteristics\n"
