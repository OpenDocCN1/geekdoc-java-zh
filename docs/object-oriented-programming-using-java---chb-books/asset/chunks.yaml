    最后，一条消息被构建并显示给用户，例如：


    ```

    Sold Windowcleaning Weekly (Sept 2005) @ 2.75

    Subtotal = 2.75

    ```


    注意当 `pPub` 与字符串拼接运算符 `+` 一起出现时。这会隐式地调用该对象子类的 `toString()` 方法，并记住，书籍和杂志的 `toString()`
    方法是不同的。


    这就是多态的体现——使用 `toString()` 操作来调用相关类相应的 `toString()` 方法！


    # 使用 Java 进行面向对象编程

    ## 对象角色与多态性的重要性


    我们可以像下面的类图中所示 `CashTill`：


    ![Wondershare](img/bg08000001.jpg)


    注意 `CashTill` 对 `Publication` 有依赖关系，因为 `sale()` 方法接收了一个类型为 `Publication` 的参数。实际传递的当然将会是继承自
    `Publication` 的某一个具体类型的对象。


    ### 活动 2


    查看下图，并假设 `Publication` 不是抽象类型，判断所示的操作对中，哪一组是合法的。


    ![Wondershare](img/bg08000002.jpg)


    a) `Publication p = new Publication(…); p.sellCopy();`

    b) `Publication p = new Publication(…); p.recvNewIssue();`

    c) `Publication p = new Magazine(…); p.sellCopy();`

    d) `Publication p = new Magazine(…); p.recvNewIssue();`

    e) `Magazine m = new Magazine(…); m.recvNewIssue();`


    ### 活动 2


    查看下图，并假设 `Publication` 不是抽象类型，判断所示的操作对中，哪一组是合法的。


    ![Wondershare](img/bg08100001.jpg)


    a) `Publication p = new Publication(…); p.sellCopy();`

    b) `Publication p = new Publication(…); p.recvNewIssue();`

    c) `Publication p = new Magazine(…); p.sellCopy();`

    d) `Publication p = new Magazine(…); p.recvNewIssue();`

    e) `Magazine m = new Magazine(…); m.recvNewIssue();`


    ### 反馈 2


    a) 合法——你可以在出版物上调用 `sellCopy()`。

    b) 不法——出版物中不存在 `recvNewIssue()` 方法。

    c) 合法——`Magazine` 是 `Publication` 的类型，因此你可以将类型为 `Magazine` 的对象赋值给类型为 `Publication`
    的变量（在需要超类的地方，你始终可以替换子类型）。此外，你可以在出版物上调用 `sellCopy()`。该出版物恰好是杂志，但就编译器而言，这并不重要，因为在这种情况下
    `p` 只是一个出版物。

    d) 不法——虽然我们可以在杂志上调用 `recvNewIssue`，但编译器不知道 `p` 是杂志……只知道它是一个出版物。

    e) 合法——`m` 是一个杂志，我们可以在杂志上调用此方法。


    ### 活动 3


    查看下图，并注意 `Student` 是一个抽象类，判断以下代码段中哪些是有效的……


    ```

    <<abstract>>Student

    Lecturer

    printTimetable()

    help(Student pStudent)

    PtStudent

    FtStudent

    applyForJob()

    applyForLoan()

    ```


    注意：`FtStudent` 是 Full Time Student（全日学生）的缩写，`PtStudent` 是 Part Time Student（兼职学生）的缩写。


    a) `Student s = new Student(); Lecturer l = new Lecturer(); l.help(s);`

    b) `Student s = new FtStudent(); Lecturer l = new Lecturer(); l.help(s);`


    ### 反馈 3


    a) 这无效，因为 `Student` 类是抽象的，不能实例化。

    b) 这是有效的。`FtStudent` 是 `Student` 的类型，可以赋值给类型为 `Student` 的变量。它可以作为参数传递给 `l.help()`。


    ### 活动 4


    采用图并直接调用下面的代码，判断在 `help(Student pStudent)` 方法内部，以下行 (a) 或 (b) 哪个是有效的……


    ```

    Student s = new FtStudent(); Lecturer l = new Lecturer(); l.help(s);

    ```


    ```

    <<abstract>>Student

    Lecturer

    printTimetable()

    help(Student pStudent)

    PtStudent

    FtStudent

    applyForJob()

    applyForLoan()

    ```


    a) `pStudent.printTimetable();`

    b) `pStudent.applyForLoan();`


    ### 反馈 4


    a) 这是有效的——我们可以在 `Student` 对象上调用此方法，也可以在 `FtStudent` 对象上调用（因为该方法是被继承的）。

    b)无效！虽然我们可以在 `FtStudent` 对象上调用此方法，并且我们将一个 `FtStudent` 对象作为参数传递给 `help()` 方法，但
    `help()` 方法无法知道传递的对象将是 `FtStudent`（它可以可以是任何 `Student` 类型的对象）。因此，无法保证传递的对象将支持此方法。因此，这行代码将产生编译器错误。


    ## 4.5 接口


    继承有两个方面：


    - 子类继承父类的接口（即对公共成员的访问）——这使得多态成为可能

    - 子类继承父类的实现（即实例变量和方法实现）——这节省了我们在子类定义中复制父类细节的费用。


    在 Java 中，`extends` 关键字会自动应用这两个方面。


    子类是一个子类型。它的接口必须包含父类的所有接口，尽管这种实现可以是不同的（通过重写），并且子类的接口可能更广泛。


    然而，有时我们可能希望两个类共享一个公共接口，而不将它们放在层次结构中。这可能是：


    - 它们之间没有真正的“是”关系

    - 我们希望一个类拥有与多个父类共享的接口，但 Java 不允许这种“多重继承”

    - 我们希望在软件组件之间创建“插拔式”安排，某些组件可能尚未创建。


    这就像确保两辆汽车的控制方式完全相同，但让不同的工程师设计实现汽车功能的引擎。


    小心使用“接口”一词——在 Java 编程中它至少有三个含义：


    1) 类的公共成员——上述使用的含义

    2) 程序的“用户界面”，通常是“图形用户界面”——一个本质相关的含义

    3) 我们即将遇到的特定 Java 构造


    # 对象角色与多态性的重要性


    回顾 `Publication` 的子类如何提供额外和修订的行为，同时保留了它定义的操作 set（即接口）。


    ![Wondershare](img/bg08500001.jpg)


    这就是为什么 `CashTill` 类可以处理 `Publication` 而无需担心它是哪一个子类的实例。（记住 `Publication` 是一个抽象类——现实中的
    `Publication` 总是某个子类。）


    ## 票务


    现在考虑一种可能性：除了书籍和杂志之外，我们现在还想销售票务，例如娱乐活动、公共交通等。这些与 `Publication` 不同，因为：


    - 我们没有有限的“库存”，而是在收银台按需打印

    - 票务简单地由描述、价格和客户（为谁销售）组成

    - 这些销售本质上是服务而非产品


