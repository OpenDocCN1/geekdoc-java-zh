    通过相同的理念，多态允许计算机系统进行扩展，通过创建新的专门对象，同时允许系统的当前部分与新对象交互，而无需担心新对象的特定属性性。


    ## 1.5 到底什么是面向对象编程？


    ### 活动 8

    想一个你拥有的对象。描述它的当前状态，并列出你可以对该对象做的二到三件事。


    ### 反馈 8

    你可能想了一个完全物理的物体，例如手表、笔或汽车。


    对象具有当前状态。手表有时间（内部由车轮和齿轮或电子元件表示）。笔有一定量的墨水，且盖子是开启还是关着的。汽车有当前速度，里面有一定数量的燃料。


    每个对象也可以关联特定的行为（即你可以对它做的事）：可以查看手表以获取时间，也可以设置时间。笔可以用来写字，汽车可以行驶。


    你也可以将其他非物理实体考虑为对象：例如银行账户。银行账户不是物理上可以触到的东西，但在智力上我们可以将银行账户视为一个对象。它也有当前状态（账户中的金额），并且与之相关的行为（最明显的是存款和取款）。


    面向对象编程是一种编程方法，涉及创建智力对象来为我们试图解决的业务问题建模（例如：银行账户、银行客户和银行经理——这些都可以计算机化银行系统中的对象）。对于每个对象，我们模拟了与之相关的数据（即它在任何特定时间的状态）以及与之相关的行为（我们的计算机程序应该允许该对象做的事）。


    在创建面向对象的程序时，我们定义了一类对象的属性（例如所有的银行账户），然后从该类创建单个对象（例如你的银行账户）。


    ## 类 (Class)

    “类”是一种软件设计，描述了软件正在建模的事物的通用属性。


    ![Wondershare](img/bg02100001.jpg)


    ### 每个实际的事物都根据类设计创建具体的“对象”

    对象 1

    对象 2

    对象 3


    然而，决定在系统中应该创建哪些类并不是一项简单的任务，因为现实世界是复杂且混乱的（关于如何操作的更多建议请参见第 6 章）。本质上，我们需要创建一个现实世界的抽象模型，关注问题的本质方面并忽略无关的复杂性。例如，在现实世界中，账户持有人有时需要借钱，偶尔他们的钱可能会被小偷偷走。如果我们创建一个银行账户系统，我们应该允许客户借钱吗？我们是否应该承认他们的现金可能被盗，并内置某种让他们获得即时贷款的方法——或者这是一个无关紧要的细节，增加系统的复杂性，而对银行没有实际益处？


    使用面向对象的分析和设计技术，我们的工作就是观察现实世界并得出一个简化的抽象模型，我们可以将其转换为计算机系统。我们的最终系统有多好将取决于我们的软件模型有多好。


    ![Wondershare](img/bg02100002.jpg)![Wondershare](img/bg02100003.jpg)


    ### 活动 9

    考虑一个允许从图书馆预留物品的计算机系统。想象一个你可能想要预留的物品，并列出管理员可能想要关于该物品的二到三件事。


    ### 反馈 9

    你可能想了一本想要预留的书，在这种情况下，管理员可能需要知道书名和它的作者。


    因此，对于我们在系统中创建的每个对象，我们都需要定义该对象的属性，即我们需要了解关于它的信息。


    ### 活动 10

    注意，我们可以将预留视为一个智力对象（其中实际物品是物理对象）。考虑这个智力对象（物品预留），列出管理员可能需要在该对象上执行的二到三项操作。


    ### 反馈 10

    管理员可能需要取消这次预留（如果你改变了主意），他们可能还需要 true 你物品已到货供你取回。


    因此，对于每个对象，我们需要定义在该对象上执行的操作（以及它的属性）。


    ### 活动 11

    考虑到可以从图书馆借出的最通用对象类别——“借出的物品”，列出图书馆可以借出的另外二到三个更具体的对象子类。


    ### 反馈 11

    在定义了最通用的对象类别（我们称之为类）——可以被借出的东西之后，我们可能想要定义更专门的子类（例如：书籍、杂志、视听材料）。这些子类将共享通用类定义的属性，但会有特定的差异（例如，借用视听材料可能会产生费用）。


    ## 1.6 面向对象方法的益处

    无论你是否以面向的方式开发程序，在编写软件之前，你必须先开发一个关于软件能够做什么以及它应该如何工作的模型。面向对象建模基于抽象、封装、继承和多态的思想。面向方法的通用支持者声称这种模型提供了：

    - 更好的抽象（将信息和行为建模在一起）

    - 更好的可维护性（更易理解，不易脆弱）

    - 更好的可重用性（类作为封装的组件）


    我们将在第 11 章回来查看这些观点，届我们将看到一个案例研究，详细展示面向对象分析是如何运作的，以及生成的模型如何在面向对象的编程语言（即 `Java`）中实现。


    ## 1.7 总结

    面向对象编程涉及通过对现实世界建模来创建类。这允许创建更专门的类来继承通用类的行为。多态行为意味着系统可以随着业务需求通过添加新的专门类来改变，而系统的部分访问这些类无需考虑它们的专门行为，也不会更改当前系统的其他部分。


    ## 2 统一建模语言 (UML)

    ### 引言

    本章将介绍统一建模语言 (UML)的作用，并解释四种最常见图表（类图、对象图、时序图和包图）的目的。将重点放在类图，因为它们是 UML 表示法中最常用的部分。


    ### 目标

    到本章结束，你将能够

    • 解释 UML 是什么并解释四种最常见图表的作用，

