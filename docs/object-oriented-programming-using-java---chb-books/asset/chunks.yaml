    # 使用 Java 进行面向对象编程


    ## 统一建模语言 (UML)


    严格来说，当我们定义的类中有一个 `String` 实例变量时，我们可以使用关联（association），但我们不会这样做，因为 `String` 类是
    Java 平台的一部分，被视为类似于基本类型的属性“理所当然”的。这通常适用于所有库类，除非我们专门绘制图表是为了向某些不熟悉该库类目的和功能的人员解释该库类的某个方面。


    此外，我们还可以在关联的两端显示多重性：


    ![Wondershare](img/bg03200001.jpg)


    OneClass 1..* OtherClass


    这意味着 `OneClass` 维护一个 `OtherClass` 类型对象的集合。集合是 Java 框架的重要部分，我们将在第 7 章介绍集合的使用。


    ### 活动 3

    绘制一个图表来表示名为 `Catalogue` 的类和一个名为 `ItemForSale` 的类，定义如下：


    `ItemForSale` 有一个类型为 `string` 的属性 `name` 和一个类型为 `int` 的属性 `price`。它还有一个方法 `setPrice()`，接受一个整数参数
    `newPrice`。


    `Catalogue` 有一个属性 `listOfItems`，即当前目录中持有的项目。由于目录中可以存储零或多个项目，`listOfItems` 需要是一个数组或集合。`Catalogue`
    还有一个方法 `addItem()`，它接受一个 `item` 作为参数（类型为 `ItemForSale`）并将该项目添加到 `listOfItems`
    中。


    在类图上绘制此内容，并为属性和方法显示适当可见性修饰符（visibility modifiers）。


    ### 反馈 3

    下面的图显示了这些信息


    ```

    Catalogue

    1

    +addItem(item :ItemForSale)

    listOfItems 0..*

    ItemForSale

    - name :String

    - price : int

    +setPrice(newPrice :int)

    ```


    注意：所有类名均大写字母开头，属性和方法名以小写字母开头。还要注意 `ItemForSale` 类描述的是单个项目（而不是多个项目）。然而，`listOfItems`
    维护了一个零或多个独立对象的列表。


    ## 关联的类型

    通过不同的箭头表示多种不同类型的关联：


    * 依赖 (Dependency)

    * 简单关联 (Simple association)

    * 双向关联 (Bidirectional association)

    * 聚合 (Aggregation)

    * 组合 (Composition)


    Class A, Class B - 依赖

    ![Wondershare](img/bg03300001.jpg)


    Class A, Class B - 简单关联（从 A 到 B 可导航）


    Class A, Class B - 双向关联

    ![Wondershare](img/bg03300002.jpg)


    Class A, Class B - 聚合

    ![Wondershare](img/bg03300003.jpg)


    Class A, Class B - 组合

    ![Wondershare](img/bg03300004.jpg)


    Class A, Class B - 依赖

    ![Wondershare](img/bg03300005.jpg)


    * `Dependency` 是类之间最不具体的关系（不属于严格意义上的“关联”）

    * `Class A` 在某种程度上使用了 `Class B` 定义的功能

    * `Class B` 的变化可能会影响 `Class A`


    ![Wondershare](img/bg03400001.jpg)


    依赖线的典型用法是：`Class A` 有一个方法传递了 `Class B` 的参数对象，或者使用了该类的局部变量，或者调用了 `Class B` 中的 `static`
    方法。


    ### 简单关联

    ![Wondershare](img/bg03400002.jpg)


    * 在关联中，`Class A` “使用” `Class B` 的对象

    * 通常 `Class A` 拥有一个 `Class B` 的属性

    * 导航性从 A 到 B：即 `Class A` 对象可以访问与其关联的 `Class B` 对象（或多个）。反之则不然——`Class B` 对象“不知道”
    `Class A` 对象


    简单关联通常对应于 `Class A` 中类型为目标类 `B` 的实例变量。例如：上面的 `Catalogue` 需要访问 0 或多个 `ItemsForSale`，以便从
    `Catalogue` 中添加或删除项目。`ItemForSale` 不需要访问 `Catalogue` 即可设置其价格或执行某些与项目本身相关的其他方法。


