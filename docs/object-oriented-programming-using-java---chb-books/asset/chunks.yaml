    （例如 `Eclipse`）提供了支持敏捷编程的工具。特别是，我们将研究重构和 JUnit 测试工具。


    ## 目标


    在本章结束时，你将能够…


    * 学会敏捷开发所提出的主张的重要性

    * 理解重构的必要性以及现代 IDE 如何支持这一点

    * 理解单元测试的优势以及

    * 理解如何创建 JUnit 测试用例

    * 理解针对测试驱动开发（TDD）提出的主张


    ##


    本章由以下十五部分组成：


    1) 敏捷方法

    2) 重构

    3) 重构示例

    4) 对重构的支持

    5) 单元测试

    6) 自动化单元测试

    7) 回归测试

    8) JUnit

    9) 断言示例

    10) 若干测试示例

    11) 运行测试

    12) 测试驱动开发 (TDD)

    13) TDD 周期

    14) TDD 的主张

    15) 总结


    ## 10.1 敏捷方法


    传统的开发方法强调详细的远期规划和软件生命周期的线性进展`推后写代码，一次做对（真的吗？）`。


    最近的“敏捷”开发方法强调灵活的循环开发，使系统向解决方案演进`尽早写代码，边做边修复并改进`。


    这是目前软件工程领域一个非常热门的话题，而且像所有此类进展一样，它也有自己的狂热分子和意识形态者！


    瀑布型生命周期模型真的能让大型复杂项目从开始到结束而无需回顾吗？敏捷方法的支持者认为，这些方法更符合软件开发的现实。


    然而，敏捷编程需要能够让软件改变和演变的工具。现代 IDE 支持敏捷编程提供的两个特定工具是重构和测试工具。


    ## 10.2 重构


    敏捷方法的核心元素之一是“重构”。这种技术接受某些设计和实现决策可能会证明是糟糕的，或者至少是不完美的。


    重构意味着在不改变功能的情况下更改系统以提高其设计实现质量（在传统开发中，这种工作被称为“预防性维护”）。


    虽然从结构上改进现有软件的想法并不新鲜，但其区别在于：在传统开发中，它被视为软件设计质量下降时采取的补救措施，通常是功能修改和扩展阶段的结果。在敏捷方法论中，重构被认为是开发过程中自然且健康的一部分。


    ## 10.3 重构示例


    在开发过程中，程序员可能会发现程序中的某个变量命名非常糟糕。然而，更改它并不是一项轻而易的任务。


    更改局部变量只需要更改一个特定的方法——如果在不同的方法中存在同名变量，则不需要更改。


    相反，更改公共类变量可能需要整个系统进行更改（这也是为什么不鼓励使用公共变量的原因之一）。


    因此，实现一个看似微不足道的更改需要对该更改的后果有理解。


    可能还需要更复杂的更改。这些包括：


    * 在标识符出现的所有地方重命名它

    * 将方法从一个类移动到另一个类

    * 将代码从一个方法中拆分为另一个独立的方法

    * 更改方法的参数列表

    * 在继承层级结构中重新排列类成员的位置


    ## 10.4 对重构的支持


    即使是最简单的重构操作，例如重命名类、方法或变量，也需要仔细的分析，以确保一致地进行所有必要的更改。


    `Eclipse` 为这项活动提供了复杂的自动支持。


    不要将其与简单的文本编辑器查找/替换混淆——`Eclipse` 理解 Java 语法并智能地工作……例如，如果你在两个不同的方法中有同名的局部变量并重命名了其中一个，`Eclipse`
    知道另一个是不同的变量并且不会更改它。但是，如果你重命名一个公共实例变量，这可能需要其他类甚至其他包中的更改，因为这些类的方法可能会访问并使用该变量。


    在包结构内重新排列现有的类也是一种重构活动，`Eclipse` 让这变得非常简单。随着系统设计的演进，正如我们有时可能决定一个类变得太大、太复杂，并决定将其拆分为两个或多个独立的类一样，我们也可能决定拆分一个包。较少的情况下，我们会合并包或在现有包之间移动类。`Eclipse`
    允许我们将类从一个包拖到另一个包。当这种情况发生时，该类开头的包语句会被更改，其他类中的 import 语句将自动调整，以反映相关类现在位于新包中。


    下面的截图显示了 `Eclipse` IDE 提供的重构选项。


    现代 IDE 提供的另一个基本工具是自动化测试工具。


    ## 10.5 单元测试


    将类中的单个方法与其在构建系统中的最终上下文离开进行测试，被称为单元测试。这种测试通常“封装”在实现过程中：


    * 编写类

    * 编写测试

    * 运行测试，必要时进行调试


    ## 10.6 自动化单元测试


    可以使用工具和框架来自动化单元测试过程。使用此类工具通常比手动运行测试需要多一点精力。然而，主要的优势在于可以通过点击按钮根据需要反复重新运行测试。


    这对于每当修改以前测试过的代码时必须进行的“回归测试”是一个巨大的帮助。回归测试在敏捷方法提出很久以前开发了，自动化单元测试支持这一点。然而，自动化单元测试也支持测试驱动开发过程，这些在敏捷软件开发中起着主要作用。


    我们将在本章探索测试驱动开发过程，但在之前，我们将首先探索传统的回归测试以及 Java 测试框架 `JUnit` 提供的支持。


    ## 10.7 回归测试


    当软件为了适应变化的业务需求时，就需要回归测试。通过运行回归测试，我们希望确保代码的更改不会“破坏”现有功能。为了做到这一点，我们在编写类时也必须编写证明这些类良好的测试用例。我们遵循如下过程……


    * 编写类

    * 编写测试

    * 运行测试，必要时进行调试

    * 编写更多类

    * ……


    当我们由于错误、用户需求变化或重构而决定更改某些早期的类（或它们依赖的类）时，我们需要重新运行所有之前的测试以检查它们是否仍然通过。没有回归测试，对现有代码的任何修改都是极其危险的！


