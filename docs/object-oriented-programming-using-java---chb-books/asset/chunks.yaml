- fmt: "\nTickets seem to have little in common with `Publications` – they share a\
    \ small interface associated with being sold, but even for this the underlying\
    \ implementation will be different because we will not be decrementing them from\
    \ a current stock.\n\nFor these reasons `Ticket` and `Publication` do not seem\
    \ closely related and thus we do not want to put them in an inheritance hierarchy.\
    \ However we do want to make them both acceptable to `CashTill` as things to sell\
    \ and we need a mechanism for doing this.\n\nWithout putting them in an inheritance\
    \ hierarchy what we want is a more general way of saying “things of this class\
    \ can be sold” which can be applied to whatever (present and future) classes we\
    \ wish, thus making the system readily extensible to `Tickets` and anything else.\n\
    \n---\n\n# Object Roles and the Importance of Polymorphism\n\nWhile the `Ticket`\
    \ class is sufficiently different from a `Publication` that we don’t want to put\
    \ it in an inheritance hierarchy it does have some similarities – namely it has\
    \ a `getPrice()` method and a `sellCopy()` method – both needed by `CashTill`.\n\
    \nHowever the `sellCopy()` method is very different form the `sellCopy()` method\
    \ defined in `Publication`. To sell a publication the stock had to be reduced\
    \ by 1 – with a ticket we just need to print it.\n\n```\npublic void sellCopy()\n\
    {\n    System.out.println(\"**************************************\");\n    System.out.println(\"\
    \ TICKET VOUCHER \");\n    System.out.println(toString());\n    System.out.println(\"\
    **************************************\");\n    System.out.println();\n}\n```\n\
    \nAs the `sellCopy()` method is so different we do not want to inherit its implementation\
    \ details therefore we don’t feel that `Ticket` belongs in an inheritance hierarchy\
    \ with `Publications`. But we do want to be able to check tickets through the\
    \ till as we can with publications.\n\nJust like publications, tickets provide\
    \ the operations which `CashTill` needs:\n- `sellCopy()`\n- `getPrice()`\n\nand\
    \ thus the `CashTill` can sell a `Ticket`. In fact `CashTill` can sell anything\
    \ that has these methods not just `Publications`. To enable this to happen we\
    \ will define this set of operations as an ‘Interface’ called `SaleableItem`.\n\
    \n```java\ninterface SaleableItem\n{\n    public void sellCopy ();\n    public\
    \ double getPrice ();\n}\n```\n\nNote that the interface defines purely the signatures\
    \ of operations without their implementations. All the methods are implicitly\
    \ public even if this is not stated, and there can be no instance variables or\
    \ constructors.\n\nIn other words, an interface defines the availability of specified\
    \ operations without saying anything about their implementation. That is left\
    \ to classes which implement the interface.\n\nAn interface is a sort of contract.\
    \ The `SaleableItem` interface says “I undertake to provide, at least, methods\
    \ with these signatures:\n- `public void sellCopy ();`\n- `public double getPrice\
    \ ();`\nthough I might include other things as well” Where more than one class\
    \ implements an interface it provides a guaranteed area of commonality which polymorphism\
    \ can exploit.\n\nThink of a car and a driving game in an arcade. They certainly\
    \ are not related by any “is a” relationship – they are entirely different kinds\
    \ of things, one a vehicle, the other an arcade game. But they both implement\
    \ what we could call a “SteeringWheel interface” which we can use in exactly the\
    \ same way, even though the implementation (mechanical linkage in the car, video\
    \ electronics in the game) are very different.\n\nWe now need to state that both\
    \ `Publication` (and all its subclasses) and `Ticket` both offer the operations\
    \ defined by this interface:\n\n```java\nclass Publication implements SaleableItem\n\
    {\n    [...class details...]\n}\n\nclass Ticket implements SaleableItem\n{\n \
    \   [...class details...]\n}\n```\n\nContrast `implements` with `extends`:\n-\
    \ `extends` causes the inheritance of both interface and implementation from a\
    \ superclass.\n- `implements` gives a guarantee that the operations specified\
    \ by an interface will be provided – this is enough to allow polymorphic handling\
    \ of all classes which implement a given interface.\n\n---\n\n# The Polymorphic\
    \ CashTill\n\nThe `CashTill` class already employs polymorphism: the `sale` method\
    \ accepts a parameter of type `Publication` which allows any of its subclasses\
    \ to be passed:\n\n```java\npublic void sellItem (Publication pPub)\n```\n\nWe\
    \ now want to broaden this further by accepting anything which implements the\
    \ `SaleableItem` interface:\n\n```java\npublic void sellItem (SaleableItem pSelb)\n\
    ```\n\nWhen the type of a variable or parameter is defined as an interface, this\
    \ works just like a superclass type. Any class which implements the interface\
    \ is acceptable for assignment to the variable/parameter because the interface\
    \ is a type and all classes implementing it are subtypes of that type.\n\nThis\
    \ is now shown below…\n\n- `<<interface>>SaleableItem` <- `CashTill`\n- `<<abstract>>Publication`\
    \ <- `Ticket`, `Book`, `Magazine`, `DiscMag`\n\n`CashTill` is no longer directly\
    \ dependent on class `Publication` – instead it is dependent on the interface\
    \ `SaleableItem`. The relationships from `Publication` and `Ticket` to `SaleableItem`\
    \ are like inheritance arrows except that the lines are dotted – this shows that\
    \ each class implements the interface.\n\n---\n\n# 4.6 Extensibility Again\n\n\
    Polymorphism allows objects to be handled without regard for their precise class.\
    \ This can assist in making systems extensible without compromising the encapsulation\
    \ of the existing design.\n\nFor example, we could create new classes for more\
    \ products or services and so long as they implement the `SaleableItem` interface\
    \ the `CashTill` will be able to process them without a single change to its code!\n\
    \nAn example could be `Sweets`. We could define a class `Sweets` to represent\
    \ sweets in a jar. We can define the price of the sweets depending upon the weight\
    \ and then sell the sweets by subtracting this weight from our total stock. This\
    \ is not like selling a `Publication`, where we always subtract 1 from the stock,\
    \ nor it this like selling tickets, where we just print them.\n\nHowever if we\
    \ create a class `Sweets` that implements the `SaleableItem` interface our enhanced\
    \ polymorphic cash till can sell them because it a sell any `SaleableItem`.\n\n\
    Interfaces allow software components to plug together more flexibly and extensibly,\
    \ just as many other kinds of plugs and sockets enable audio, video, power and\
    \ data connections in the everyday world. Think of the number of different electrical\
    \ appliances which can be lugged into a standard power socket – and imagine how\
    \ inconvenient it would be if instead you had to call out an electrician to wire\
    \ up each new one you bought!\n\n### Activity 5\nAdapt the following diagram by\
    \ adding a class for Diesel cars in such a way that it canbe used to illustrate\
    \ polymorphism.\n"
