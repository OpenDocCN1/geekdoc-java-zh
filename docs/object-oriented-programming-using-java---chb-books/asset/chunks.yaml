    i.e. the same intermediate code should run on different platforms so long as an
    appropriate run-time system is available for each platform. This approach is long-established
    (e.g. in Pascal from the early 1970s) and is how Java works.


    ## 8.2 The JRE


    To run Java programs we must first generate intermediate code (called `bytecode`)
    using a compiler available as part of the Java Development Kit (`JDK`) – see section
    8.4 below.


    A version of the Java Runtime Environment (`JRE`), which incorporates a Java virtual
    machine (`VM`), is required to execute the bytecode and the Java library packages.
    Thus a `JRE` must be present on any machine which is to run Java programs.


    The Java bytecode is standard and platform independent and as `JRE`s have been
    created for most computing devices (including PC’s, laptops, mobile devices, mobile
    phones, internet devices etc) this makes Java programs highly portable.


    ## 8.3 Java Programs


    Whatever mode of execution is employed, programmers can work with a variety of
    tools to create source code. Options include the use of simple discrete tools
    (e.g. editor, compiler, interpreter) invoked manually as required or alternatively
    the use of an Integrated Development Environment (`IDE`) which incorporates these
    implementation tools behind a seamless interface. Still more sophisticated `CASE`
    (Computer Aided Software Engineering) tools which integrate the implementation
    process with other phases of the development cycle – such software could take
    `UML` class diagrams and generate classes and method stubs automatically saving
    some of the effort required to write the Java code.


    When writing java programs each class (or interface) in a Java program has its
    own `name.java` file containing the source code. These are processed by the compiler
    to produce `name.class` files containing the corresponding bytecode. To actually
    run as an application, one of the classes must contain a `main()` method with
    the signature shown above.


    ## 8.4 The JDK


    To develop Java programs you must first install the Java Development Kit (`JDK`).
    This was developed by Sun and is available freely from the internet via http://java.sun.com/
    . Prior to version 5.0 (or 1.5) this was known as the Java Software Development
    Kit (`SDK`).


    A Java `IDE`’s, e.g. `Eclipse` or `NetBeans`, sits on top of the `JDK` to add
    the `IDE` features – these may include interface development tools, code debugging
    tools, testing tools and refactoring tools (more on these later). When using an
    `IDE` it is easy to forget that much of the functionality is in fact part of the
    `JDK` and when the `IDE` is asked to compile a program it is infact just passing
    on this request to the `JDK` sitting underneath.


    We can use the `JDK` directly from the command line to compile and run Java programs
    though mostly it is easier to use the additional facilities offered by an `IDE`.


    Somewhat confusingly the current version of Java is known both as 6.0, 1.6 and
    even 1.6.0\. These supposedly have subtly different meanings – don’t worry about
    it!


    There are many tools in the `JDK`. A description of each of these is available
    from http://java.sun.com/javase/downloads/ and following the links for Documentation,
    APIs and JDK Programmer guides. The two most important basic tools are:


    - `javac` – the java compiler

    - `java` – the java program launcher (that runs the `VM`)


    To compile `MyProg.java` we type:

    ```

    javac MyProg.java

    ```

    If successful this will create `MyProg.class`


    To run `Myprog` (assuming it has a `main()` method) we type:

    ```bash

    java MyProg

    ```


    Another, extremely useful tool, is `javadoc` – this uses comments in Java source
    code to generate automatic documentation for programs.


    ## 8.5 Eclipse


    Moving to an ‘industrial strength’ `IDE` is an important stepping stone in your
    progress as a software developer, like riding a bicycle without stabilisers for
    the first time. With some practice you will soon find it offers lots of helpful
    and time-saving facilities that you will not want to work without again…


    `Eclipse` is a flexible and extensible `IDE` platform. It was first developed
    by IBM but is now open source and can be downloaded from the Eclipse Foundation
    at www.eclipse.org .


    `Eclipse` was itself written in Java and like all Java programs it needs a `JRE`
    to work but using this it will therefore run on a large range of platforms. It
    comes with Java Development Tools (`JDT`) installed by default but also has extensions
    and additional tools to support the development of programs in other languages.
    The `Eclipse` ‘runtime platform’ is sufficiently flexible that it can even be
    used as a framework for the development of applications unrelated to IDE.


    ## 8.6 Eclipse Architecture


    Because `Eclipse` relies on the `JRE` it is intrinsically multi-platform (Windows,
    Linux, Mac etc.) The elements shown are part of basic Eclipse download.


    ## 8.7 Eclipse Features


    `Eclipse` provides a range of features offering powerful support for a programmer
    wishing to develop large Java programs. These include:


    - code completion and help facilities

    - a code formatter which can automatically adjust a huge variety of code format
    aspects

    - powerful facilities to support program development including refactoring (see
    Chapter 10 section 4) and automatic testing facilities (see Chapter 10 section
    5).


    ## 8.8 NetBeans


    `NetBeans` is another very powerful `IDE`, originally developed and distributed
    by Sun Microsystems, `NetBeans` was made open source in 2000 and is extensively
    supported with plug-ins and video tutorials developed by the open source community.


    NetBbeans can be downloaded for free from www.netbeans.org


    `NetBeans` has many features that have been developed to aid novice programmers
    and save time. These include:


    - A quick start guide, on line tutorials and online videos (covering among other
    topics an introduction to the IDE, the Javascript debugger, and PHP support).

    - Help features with automatic pop up windows highlighting relevant parts of the
    Java API

    - formatting and debugging facilities

    - code completion features that will auto insert for loops, try catch blocks and
    constructors (among others).

