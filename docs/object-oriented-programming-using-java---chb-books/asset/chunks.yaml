  trans: "\n虽然在子类构造函数中可以显式调用 `super`，但出于清晰性的考虑，显式调用仍然更好。\n\n# 继承与方法重写\n\n然而，如果父类没有无参数构造函数但有一个带参数的构造函数，则必须使用\
    \ `super` 进行显式调用。\n\n为了说明这一点……\n\n在左侧:-:- 有一个没有构造函数的子类是合法的，但属于糟糕实践，因为父类有一个无参数构造函数。\n\
    \n在中间:- 如果子类构造函数没有调用 `super`，将调用父类的无参数构造函数。\n\n在右侧:- 因为父类没有无参数构造函数，子类必须有一个构造函数，且必须调用\
    \ `super`。这是因为一个只有一个带参数构造函数的 `(super)` 类只能通过提供所需的参数来初始化。\n\n## 访问控制\n\n为了实现封装，我们通常将实例变量设置为私有（private），并根据需要提供访问器（accessor）/修改器（mutator）方法。\n\
    \n`Publication` 的 `sellCopy()` 方法需要修改变量 `copies` 的值——即使 `copies` 是私有变量它也可以这样做。然而，`Book`\
    \ 和 `Magazine` 都需要修改 `copies`。\n\n有两种方法可以实现这一点……\n\n1) 将 `copies` 设为 `protected`\
    \ 而不是 `private`——这使得它对子类可见，\n2) 创建访问器和修改器方法。\n\n对于变量，我们通常倾向于创建访问器/修改器，而不是牺牲封装，尽管\
    \ `protected` 可能有助于允许子类使用某些方法（例如访问器和修改器），而我们通常不希望这些方法对其他类可用。\n\n因此，在父类 `Publication`\
    \ 中，我们将 `copies` 定义为私有变量，但创建了两个可以设置和访问 `copies` 值的方法。由于这些访问方法是公开的或受保护的，因此在子类需要访问\
    \ `copies` 时可以使用它们。\n\n因此，在父类 `Publication` 中我们会有……\n\n```java\nprivate int copies;\n\
    \npublic int getCopies () {\n    return copies;\n}\n\npublic void setCopies(int\
    \ pCopies) {\n    copies = pCopies;\n}\n```\n\n这些方法允许父类控制对私有实例变量的访问。按照目前的写法，它们实际上并没有实施任何限制，但假设我们想确保\
    \ `copies` 不被设置为负值。\n\na) 如果 `copies` 是 `private` 的，我们可以将验证逻辑（即 `if` 语句）放在这里的\
    \ `setCopies` 方法中，并确定该规则永远不会被破坏。\nb) 如果 `copies` 部分暴露为 `protected`，则我们必须查看子类方法更改实例变量的每一个地方，并在每个单独的地方进行验证。\n\
    \n我们甚至可以考虑将这些方法本身设为 `protected` 而不是 `public`，这样它们的使用就仅限于子类，其他类无法干预 `copies` 的值。\n\
    \n在子类 `Book` 和 `Magazine` 中利用这些方法，我们有了……\n\n```java\n// in Book\npublic void orderCopies(int\
    \ pCopies) {\n    setCopies(getCopies() + pCopies);\n}\n\n// and in Magazine\n\
    public void recvNewIssue(String pNewIssue) {\n    setCopies(orderQty);\n    currIssue\
    \ = pNewIssue;\n}\n```\n\n这些语句等于：\n`mCopies = mCopies + pCopies`\n以及\n`mCopies\
    \ = mOrderQty`\n\n## 抽象类\n\n一个既不是 `Book` 也不是 `Magazine` 的 `Publication` 概念是没有意义的，就像一个既不是\
    \ `MalePerson` 也不是 `FemalePerson` 的 `Person`。因此，虽然我们乐意创建 `Book` 或 `Magazine` 对象，但可能希望防止\
    \ `Publication` 类型对象的创建。\n\n如果我们想处理一种既不是 `Book` 也不是 `Magazine` 的新型 `Publication`——例如\
    \ `Calendar`——它自然会成为 `Publication` 的另一个新子类。\n\n由于 `Publication` 永远不会被实例化（即我们永远不会创建这种类型的对象），该类的唯一目的是将其子类的通用特征聚集在一个地方，供它们继承。我们可以通过将其声明为\
    \ `abstract` 来强制执行 `Publication` 不可实例化:-\n\n```java\nabstract class Publication\
    \ {\n    // etc.\n}\n```\n\n## 方法重写\n\n子类继承父类的方法，因此必须始终提供至少这些方法，通常通常更多。然而，方法的实可以在子类中进行更改。这就是方法重写（Overriding）。\n\
    \n为了做到这一点，我们在子类中编写一个新版本来替换继承的版本。\n\n但通过更改功能，可以在子类中更改方法的实现，从而改进该方法并使其功能更符合特定的子类。例如，想象一种特殊的杂志，每份都附有一张光盘——我们可以将其称为\
    \ `DiscMag`，并创建一个 `Magazine` 的子类来处理 `DiscMag`。当新的 `DiscMag` 期到达时，我们不仅想更新当前库存，还想检查光盘是否正确连接。因此，我们希望在\
    \ `recvIssue()` 方法中有一些额外的功能来提醒我们这样做。我们通过在 `DiscMag` 子类中重定义 `recvIssue()` 来实现。\n\
    \n注意：当新的 `Magazine` 期到达时，由于它们没有光盘，我们想要调用 `Magazine` 类中定义的原始 `recvIssue()` 方法。\n\
    \n这是父类中的方法。\n\n### 实现 DiscMag\n\n要实现 `DiscMag`，必须使用 `extends` 创建 `Magazine` 的子类。不需要额外的实例变量或方法，尽管如果有需要也可以创建一些。`DiscMag`\
    \ 的构造函数简单地将其所有参数直接传递给父类，并在 `discMag` 中定义了 `newIssue()` 版本来重写继承自 `Magazine` 的版本（见下代码）。\n\
    \n```java\npublic class DiscMag extends Magazine {\n    // the constructor\n \
    \   public DiscMag (String pTitle, double pPrice, int pOrderQt, String pCurrIssue,\
    \ int pCopies) {\n        super(pTitle, pPrice, pOrderQty, pCurrIssue, pCopies);\n\
    \    }\n\n    // the overridden method\n    public void recvNewIssue(String pNewIssue)\
    \ {\n        super.recvNewIssue (pNewIssue);\n        System.out.println(\"Check\
    \ discs attached to this magazine\");\n    }\n}\n```\n\n注意使用 `super` 关键字来调用父类的方法，从而在替换的同时复用现有功能，就像我们处理构造函数时那样。它随后额外为用户显示所需的消息。\n\
    \n当我们在 `DiscMag` 对象上调用 `recvNewIssue()` 方法时，Java 会自动选择新的重写版本——调用者不需要指定这一点，甚至不需要知道它是一个重写方法。当我们在\
    \ `Magazine` 上调用 `recvNewIssue()` 方法时，调用的是父类中的方法。\n\n### 操作\n\n从形式上说`recvNewIssue()`\
    \ 是一个操作。这个操作由两个不同的方法实现，\n\n"
- fmt: "\none in `Magazine` and the overriding one in `DiscMag`. However this distinction\
    \ is an important part of ‘polymorphism’ which we will meet in Chapter 4.\n\n\
    ## 3.10 The `Object` Class\n\nIn Java all objects are (direct or indirect) subclasses\
    \ of a class called `Object`. `Object` is the ‘root’ of the inheritance hierarchy\
    \ in Java. Thus this class exists in every Java program ever created.\n\nIf a\
    \ class is not declared to extend another then it implicitly extends `Object`.\n\
    \n`Object` defines no instance variables but several methods. Generally these\
    \ methods will be overridden by new classes to make them useful. An example is\
    \ the `toString()` method.\n\nThus when we define our own classes, by default\
    \ they are direct subclasses of `Object`. If our classes are organised into a\
    \ hierarchy then the topmost superclass in the hierarchy is a direct subclass\
    \ of `object`, and all others are indirect subclasses.\n\n### Inheritance and\
    \ Method Overriding\n\nThus directly, or indirectly, all classes created in Java\
    \ inherit `toString()`.\n\n## 3.11 Overriding `toString()` defined in `Object`\n\
    \nThe `Object` class defines a `toString()` method, one of several useful methods.\
    \ `toString()` has the signature:\n\n```\npublic String toString()\n```\n\nIts\
    \ purpose is to return a string value that represents the current object. The\
    \ version of `toString()` defined by `Object` produces output like: “Book@11671b2”.\
    \ This is the class name and the “hash code” of the object. However to be generally\
    \ useful we need to override this to give a more meaningful string.\n\nIn `Publication`:\n\
    ```java\npublic String toString()\n{\n    return mTitle;\n}\n```\n\nIn `Book`:\n\
    ```java\npublic String toString()\n{\n    return super.toString() + \" by \" +\
    \ mAuthor;\n}\n```\n\nIn `Magazine`:\n```java\npublic String toString()\n{\n \
    \   return super.toString() + \" (\" + mCurrIssue + \")\";\n}\n```\n\nIn the code\
    \ above `toString()` originally defined in `Object` has been completely replaced,\
    \ ie. overridden, so that `Publication.toString()` returns just the title.\n\n\
    The `toString()` method has been overridden again in `Book` such that `Book.toString()`\
    \ returns title (via superclass `toString()` method) and author. Ie. this overridden\
    \ version uses the version defined in `Publication`. Thus if `Publication.toString()`\
    \ was rewritten to return the title and ISBN number then `Book.toString()` would\
    \ automatically return the title, ISBN number and author.\n\n`Magazine.toString()`\
    \ returns title (via superclass `toString()` method) and issue.\n\nWe will not\
    \ further override the method in `DiscMag` because the version it inherits from\
    \ `Magazine` is OK. We could choose to provide more data (i.e. more, or even all,\
    \ of the instance variable values) in these strings. The design judgement here\
    \ is that these will be the most generally useful printable representation of\
    \ objects of these classes. In this case title and author for a book, or title\
    \ and current issue for a magazine, serve well to uniquely identify a particular\
    \ publication.\n\n## 3.12 Summary\n\n- Inheritance allows us to factor out common\
    \ attributes and behaviour. We model the commonalities in a superclass.\n- Subclasses\
    \ are used to model specialized attributes and behaviour.\n- Code in a superclass\
    \ is inherited to all subclasses. If we amend or improve code for a superclass\
    \ it impacts on all subclasses. This reduces the code we need to write in our\
    \ programs.\n- Special rules apply to constructors for subclasses.\n- A superclass\
    \ can be declared abstract to prevent it being instantiated (i.e. objects created).\n\
    - We can ‘override’ inherited methods so a subclass implements an operation differently\
    \ from its superclass.\n- In Java all classes descend from the class `Object`.\n\
    - `Object` defines some universal operations which can usefully be overriden in\
    \ our own classes.\n\n## 4 Object Roles and the Importance of Polymorphism\n\n\
    ### Introduction\n\nThrough the use of worked examples this chapter will explain\
    \ the concept of polymorphism and the impact this has on OO software design.\n\
    \n### Objectives\n\nBy the end of this chapter you will be able to…\n- Understand\
    \ how polymorphism allows us to handle related classes in a generalized way\n\
    - Employ polymorphism in Java programs\n- Understand the implications of polymorphism\
    \ with overridden methods\n- Define interfaces to extend polymorphism beyond inheritance\
    \ hierarchies\n- Appreciate the scope for extensibility which polymorphism provides\n\
    \nThis chapter consists of eight sections:-\n1) Class Types\n2) Substitutability\n\
    3) Polymorphism\n4) Extensibility\n5) Interfaces\n6) Extensibility Again\n7) Distinguishing\
    \ Subclasses\n8) Summary\n\n## 4.1 Class Types\n\nWithin hierarchical classification\
    \ of animals:\n- Pinky is a pig (species `sus scrofa`)\n- Pinky is (also, more\
    \ generally) a mammal\n- Pinky is (also, even more generally) an animal\n\nWe\
    \ can specify the type of thing an organism is at different levels of detail:\n\
    - higher level = less specific\n- lower level = more specific\n\nIf you were asked\
    \ to give someone a pig you could give them Pinky or any other pig. If you were\
    \ asked to give someone a mammal you could give them Pinky, any other pig or any\
    \ other mammal (e.g. any lion, or any mouse, or any human being!). If you were\
    \ asked to give someone an animal you could give them Pinky, any other pig, any\
    \ other mammal or any other animal (bird, fish, insect etc).\n\nThe idea here\
    \ is that an object in a classification hierarchy has an ‘is a’ relationship with\
    \ every class from which it is descended and each classification represents a\
    \ type of animal.\n\nThis is true in object oriented programs as well. Every time\
    \ we define a class we create a new ‘type’. Types determine compatibility between\
    \ variables, parameters etc.\n\nA subclass type is a subtype of the superclass\
    \ type and we can substitute a subtype wherever a ‘supertype’ is expected. Following\
    \ this we can substitute objects of a subtype whenever objects of a supertype\
    \ are required (as in the example above).\n\nIn other words we can ‘substitute’\
    \ an object of any subclass where an object of a superclass is required. This\
    \ is NOT true in reverse!\n\n### Activity 1\n\nLook at the class diagram above\
    \ and decide which of the following lines of code would be legal in a Java program\
    \ where these classes had been implemented:\n- `Publication p = new Book(...);`\n\
    - `Publication p = new DiscMag(...);`\n- `Magazine m = new DiscMag(...);`\n- `DiscMag\
    \ dm = new Magazine(...);`\n- `Publication p = new Publication(...);`\n\n### Feedback\
    \ 1\n\n- `Publication p = new Book(...);`: Here we are defining a variable `p`\
    \ of the general type of `Publication` we are then invoking the constructor for\
    \ the `Book` class and assigning the result to `p` this is OK because `Book` is\
    \ a subclass of `Publication` i.e. a `Book` is a `Publication`.\n- `Publication\
    \ p = new DiscMag(...);`: This is OK because `DiscMag` is a subclass of `Magazine`\
    \ which is a subclass of `Publication` ie.e. `DiscMag` is an indirect subclass\
    \ of `Publication`.\n- `Magazine m = new DiscMag(...);`: This is OK because `DiscMag`\
    \ is a subclass of `Magazine`.\n- `DiscMag dm = new Magazine(...);`: This is illegal\
    \ because `Magazine` is a SUPERclass of `DiscMag`.\n- `Publication p = new Publication(...);`:\
    \ This is illegal because `Publication` is an abstract class and therefore cannot\
    \ be instantiated.\n"
