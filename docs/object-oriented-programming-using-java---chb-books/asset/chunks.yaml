    (such as `Eclipse`) offers tools to support agile programming. In particular we
    will examine refactoring and JUnit testing tools.


    ## Objectives


    By the end of this chapter you will be able to…


    * Appreciate the importance of the claims made for Agile development

    * Understand the need for refactoring and how a modern IDE supports this

    * Understand the advantages of Unit testing and

    * Understand how to create JUnit test cases.

    * Understand the claims made for Test driven Development


    ##


    This chapter consists of fifteen sections:-


    1) Agile Approaches

    2) Refactoring

    3) Examples of Refactoring

    4) Support for Refactoring

    5) Unit Testing

    6) Automated Unit Testing

    7) Regression Testing

    8) JUnit

    9) Examples of Assertions

    10) Several Test Examples

    11) Running Tests

    12) Test Driven Development (TDD)

    13) TDD Cycles

    14) Claims for TDD

    15) Summary


    ## 10.1 Agile Approaches


    Traditional development approaches emphasized detailed advance planning and a
    linear progression through the software lifecycle `Code late, get it right first
    time (Really??)`.


    Recent ‘agile’ development approaches emphasize flexible cyclic development with
    the system evolving towards a solution `Code early, fix and improve it as you
    go along`.


    This is a very hot topic in Software Engineering circles at the moment, and as
    with all such developments it has its share of zealots and ideologues!


    Is the waterfall lifecycle model really successful in enabling large, complex
    projects to proceed from start to finish without ever looking back? Advocates
    of agile approaches contend that these better fit the reality of software development.


    However agile programming requires tools that will enable software to change and
    evolve. Two specific tools provided by modern IDEs that support agile programming
    are refactoring and testing tools.


    ## 10.2 Refactoring


    A key element of ‘agile’ approaches is ‘refactoring’. This technique accepts that
    some early design and implementation decisions will turn out to be poor, or at
    least less than ideal.


    Refactoring means changing a system to improve its design and implementation quality
    without altering its functionality (in traditional development such work was termed
    ‘preventive maintenance’).


    Although the idea of structurally improving existing software is not new, the
    difference is as follows. In traditional development it was seen as a remedial
    action taken when the software design quality had degraded, usually as a result
    of phases of functional modification and extension. In agile methodologies refactoring
    is regarded as a natural healthy part of the development process.


    ## 10.3 Examples of Refactoring


    During the development process a programmer may realise that a variable within
    a program has been badly named. However changing this is not a trivial task.


    Changing a local variable will only require changes in one particular method –
    if a variable with the same name exists in a different method this will not require
    changing.


    Alternatively changing a public class variable could require changes throughout
    the system (one reason why the use of public variables are not encouraged).


    Thus implementing a seemingly trivial change requires an understanding of the
    consequences of that change.


    Other more complex changes may also be required. These include:


    * Renaming an identifier everywhere it occurs

    * Moving a method from one class to another

    * Splitting out code from one method into a separate method

    * Changing the parameter list of a method

    * Rearranging the position of class members in an inheritance hierarchy


    ## 10.4 Support for Refactoring


    Even the simplest refactoring operation, e.g. renaming a class, method, or variable,
    requires careful analysis to make sure all the necessary changes are made consistently.


    `Eclipse` provides sophisticated automatic support for this activity.


    Don’t confuse this with a simple text editor find/replace – `Eclipse` understands
    the Java syntax and works intelligently…e.g. if you have local variables with
    the same name in two different methods and rename one of them, `Eclipse` knows
    that the other is a different variable and does not change it. However if you
    rename a public instance variable this may require changes in other classes and
    even in other packages as methods from these classes may access and use this variable.


    Rearranging existing classes within a package structure is also a refactoring
    activity `Eclipse` makes this very easy to do. As a system design evolves, just
    as we may sometimes decide a class has become too large and complex and decide
    to split it into two or more separate classes, so we might decide to split a package.
    Less often we might merge packages or move classes between existing packages.
    `Eclipse` will allow us to drag a class from one package to another. When this
    happens the package statement at the start of this class is changed and import
    statements within other classes are automatically adjusted to reflect the fact
    that the class concerned now resides in a new package.


    The screen shot below shows the refactoring options provided by the `Eclipse`
    IDE.


    Another essential tool provided by modern IDEs are automated testing tools.


    ## 10.5 Unit Testing


    Testing the individual methods of a class in isolation from their eventual context
    within the system under construction is known as Unit Testing. This testing is
    generally ‘wrapped into’ the implementation process:


    * Write class

    * Write tests

    * Run tests, debugging as necessary


    ## 10.6 Automated Unit Testing


    Tools and frameworks are available to automate the unit testing process. Using
    such a tool generally requires a little more effort than running tests manually.
    However the main benefit arises from theability to re-run the tests as often as
    desired just by pushing a button.


    This is a great aid to the ‘regression testing’ which must be undertaken whenever
    previously tested code is modified. Regression testing was developed long before
    agile methods were proposed and automated unit testing supports this. However
    automated unit testing also supports Test Driven Development processes and these
    play a major role in agile software development.


    We will explore the Test Driven Development processes within this chapter but
    before doing so we will first explore conventional regression testing and the
    support offered for this via `JUnit` a testing framework within Java.


    ## 10.7 Regression Testing


    Regression testing is required as a software is adapted to meet changing business
    needs. By running regression tests we want to ensure that changes to the code
    to not ‘break’ existing functionality. To do this as we write classes we must
    also write test cases that demonstrate these classes work. we follow a process
    of…


    * Write class

    * Write tests

    * Run tests, debugging as necessary

    * Write more classes

    * …


    As we decide its necessary to change some of the earlier classes (or classes which
    they depend on) due to bugs, changing user requirements, or refactoring we need
    to re-run all previous tests to check they still pass. Without regression testing
    any modification of existing code is extremely hazardous!


    As we regularly need to re-run sets of test cases it is helpful, and hugely timesaving,
    to have automated

