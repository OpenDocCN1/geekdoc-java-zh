    Case tudy


    MessageSet requires messages but, thanks to the application of polymorphism and
    method overriding,


    MessageSet will happily deal with any Message subtype as though it were a Message
    object. If later we


    decided to create new message types (such as a Christmas message) MessageSet would
    be able to deal


    with these as well without changing a single line of code!


    Thus in this application we are able to extend the system to add the facility
    for urgent messages by adding


    only one class and making one small change to the interface.


    Without the application of polymorphism we would need to have made additional
    changes to other


    parts of the system – namely MessageSet and DummyBoard.


    Object Orientation has enabled to the system to be extended with minimal effort!


