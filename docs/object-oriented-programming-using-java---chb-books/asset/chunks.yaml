  trans: '


    -   项目管理功能可以监控项目的更改，并允许项目回滚到早期的状态。


    Netbeans 还包含了一系列 Java 应用程序的模板，包括窗口应用、企业级、Web 和移动应用程序。它甚至还有针对 C++/PHP/Ruby 和数据库应用程序的模板。因此，只需点击几次按钮，Netbeans
    就会创建一个带有 `main` 方法的简单 Java 应用程序，该方法将调用所示的空白 GUI……


    ![Wondershare](img/bg14300001.jpg)


    此外，许多可用插件之一提供了创建 UML 图的支持。虽然这个工具具有局限性，但它不仅支持创建图表，还提供了你可能在 CASE 工具期望的功能，例如自动代码生成（从图表）和反向工程（即通过分析当前代码从代码生成
    UML 图）。


    ![Wondershare](img/bg14300002.jpg)


    因此，根据上述图表，NetBeans 将创建四个类，其中三个将自动放置在继承层次结构中。为每个指定的方法将创建方法存根，虽然每个方法内部的代码仍需编写，但
    `CurrentAccount` 的构造函数将自动调用 `Bank Account` 的构造函数，并将参数 `pBalance` 向上传递。


    ![Wondershare](img/bg14400001.jpg)


    ## 8.9 使用 NetBeans 开发图形界面


    NetBeans 具有一个可视化工具来帮助开发图形用户界面。该工具允许创建一个窗口并将一系列对象拖到窗口上，包括面板、标签页、滚动面板、按钮、单选按钮、复选框、组合框、密码字段、进度条和树形。


    ![Wondershare](img/bg14400002.jpg)


    ## 8.10 使用 NetBeans 应用布局管理器


    在设计图形用户界面时，将对象放置在窗口的精确位置上是“正常”的。因此，界面将完全按照设计的方式显示。为了让其良好工作，界面设计师通常对他们正在设计的界面的显示尺寸有一个大致了解。大多数
    PC 游戏设计在 14 英–21 英寸的窗口上运行。大多数移动游戏设计在小得多的屏幕上运行。


    然而，Java 程序被认为是平台无关的——Java 的优势之一就是是用 Java 编写的代码可以在 PC、笔记本电脑或小型移动设备上运行，无论这些设备使用什么硬件或操作系统（只要它们都带有
    `JRE`）。因此，同一个界面应该在大视觉显示单元或小型移动屏幕上运行。由于这个原因，在 Java 中开发界面时，通常会赋予 Java 一些控制权来决定具体如何/在何处显示。因此，在运行时，Java
    可以重新配置窗口以适应运行程序的任何设备。这有好处，因为显示器将自动重新配置以适应运行程序的任何设备，但这种灵活性是需要代价的。由于给了 Java 一些控制权，界面设计师无法确定界面的具体外观，尽管他们可以给
    Java 提供关于界面应如何显示的某些“指令”。


    布局管理器是定义界面如何显示的“对象”，创建一个布局管理器并将其分配给“容器”对象（如窗口框）是正常的。


    有很多常用的布局管理器——其中最常见的是流式布局（flow layout）和网格布局（grid layout）。使用流式布局，Java 将对象排列成行，如果窗口不足以在每行中放置每个对象，对象将自动流到另一行。


    ### 流式布局实例


    下方显示了两个窗口，每个窗口有十个按钮——在第二张图中，由于窗口被调整了大小且对象无法在一行中，Java 将部分按钮放置在第二行。


    ![Wondershare](img/bg14500001.jpg)


    ![Wondershare](img/bg14600001.jpg)


    可以使用各种属性创建流式管理器，以定义对象的对齐方式（居中、左侧或右），并定义对象之间的水平和垂直空间。


    ### 网格布局实例


    另一个非常常用的布局管理器是 `grid layout`。在网格中应用对象时，可以指定行数。Java 将计算需要使用多少列，以便在这些行数中放置所需数量的对象。对象将调整大小以适应窗口。Java
    将缩小或放大对象以适应窗口——即使这意味着无法显示所有文本。


    下方的两图显示了在三行网格上显示的相同 10 个按钮。


    ![Wondershare](img/bg14600002.jpg)![Wondershare](img/bg14600003.jpg)


    ![Wondershare](img/bg14700001.jpg)


    注意第二张图，按钮已调整大小以适应不同的窗口——因此这样做没有足够的空间显示第十个按钮的所有文本。


    布局管理器可以分层使用并应用于任何容器上。因此，我们可以创建一个网格，其中一个元素包含多个以流式方式排列的对象。


    使用 NetBeans 创建布局管理器：右键点击容器对象将弹出一个上下文相关菜单，其中一个选项是应用布局管理器。选择此选项将显示可能的布局管理器列表。一旦选择了布局管理器，将出现一个窗口允许指定其属性。


    ![Wondershare](img/bg14800001.jpg)


    ## 8.11 添加动作监听器


    创建可工作界面的最后一步是创建动作监听器（Action Listeners）并将它们应用到界面上的对象。动作监听器是监听用户操作并做出相应响应的对象——因此，当按下“计算”按钮时，程序将计算并显示结果。


    可以为界面上的所有对象创建动作监听器，并为每个对象创建一系列操作。尽管许多对象（如标签）不需要响应用户的交互。


    在 NetBeans 中创建动作监听器非常简单。在设计模式下，选择任何对象时，会显示属性窗口。选择事件（events）选项卡将允许为此对象创建一系列操作。一旦选择了其中一个，将编写一个“动作监听器”存根。将自动编写代码创建该类的对象并将其分配给选中的对象。


    剩下的只需程序员编写定义对用户操作响应的代码。在下面的示例中，创建了一个事件来监听 `button1` 被按下。


    ![Wondershare](img/bg14900001.jpg)![Wondershare](img/bg14900002.jpg)


    ## 8.12 Javadoc 工具


    JDK 中一个特别有用的工具是 `javadoc`。


