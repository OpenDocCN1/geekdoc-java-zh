  trans: "\n门票（Tickets）与出版物（Publications）似乎没什么共同之处——它们共享一个与销售相关的简单接口，但即使如此，它们的底层实现也将是不同的，因为我们不会从当前库存中扣减它们。\n\
    \n由于这些原因，`Ticket` 和 `Publication` 似乎并不密切相关，因此我们不想将它们放入继承体系中。然而，我们确实希望它们都能作为销售物品被\
    \ `CashTill` 接受，我们需要一种机制来实现。\n\n在不将它们放入继承体系的情况下，我们想要一种更通用的方式来表示“此类别的对象是可以出售的”，这种方式可以应用于我们想要的任何（现在及未来的）类，从而使系统能够扩展到\
    \ `Tickets` 以及其他任何类型。\n\n---\n\n# 对象角色与多态的重要性\n\n虽然 `Ticket` 类与 `Publication`\
    \ 的差异大到让我们我们不想将其放入继承体系，但它确实具有一些相似之处——即它拥有 `getPrice()` 方法和 `sellCopy()` 方法，这两个方法\
    \ `CashTill` 都需要的。\n\n然而，`sellCopy()` 方法与 `Publication` 中定义的 `sellCopy()` 方法非常不同。销售出版物时，库存必须减少\
    \ 1 —— 而对于门票，我们只需要打印它。\n\n```\npublic void sellCopy()\n{\n    System.out.println(\"\
    **************************************\");\n    System.out.println(\" TICKET VOUCHER\
    \ \");\n    System.out.println(toString());\n    System.out.println(\"**************************************\"\
    );\n    System.out.println();\n}\n```\n\n由于 `sellCopy()` 方法如此不同，我们不想继承它的实现细节，因此我们认为\
    \ `Ticket` 不应该属于与 `Publications` 的继承体系。但我们确实希望能够像处理出版物一样通过收银机来检查门票。\n\n就像出版物一样，门票提供了\
    \ `CashTill` 需要的操作：\n- `sellCopy()`\n- `getPrice()`\n\n因此 `CashTill` 就可以销售 `Ticket`。事实上，`CashTill`\
    \ 可以销售任何具有这些方法的物品，而不仅仅是 `Publications`。为了实现这一点，我们将这组操作定义为一个名为 `SaleableItem` 的“接口”。\n\
    \n```java\ninterface SaleableItem\n{\n    public void sellCopy ();\n    public\
    \ double getPrice ();\n}\n```\n\n注意，接口仅定义了操作的签名，而不包含它们的实现。所有的方法都是隐式的公共的（即使没有这样说明），并且不能有实例变量或构造函数。\n\
    \n换句话说，接口定义了指定操作的可用性，而不对其实现做任何说明。这被留给了实现接口的类。\n\n接口是一种契约。`SaleableItem` 接口表示：“我承诺至少提供具有以下签名的方法：\n\
    - `public void sellCopy ();`\n- `public double getPrice ();`\n尽管我也可能包含其他内容”。当有多个类实现一个接口时，它提供了一个保证的共性区域，多态性可以利用这个区域。\n\
    \n想一下汽车和街机里的驾驶游戏。它们之间显然没有任何“是一个（is a）”的关系——它们是完全不同的东西，一个是交通工具，另一个是街机游戏。但它们都实现了我们可以称为“方向盘接口”的东西，我们可以完全相同的方式使用它，尽管实现（汽车中的机械联动和游戏中的视频电子设备）非常不同。\n\
    \n我们现在需要声明 `Publication`（及其所有子类）和 `Ticket` 都提供了此接口定义的操作：\n\n```java\nclass Publication\
    \ implements SaleableItem\n{\n    [...class details...]\n}\n\nclass Ticket implements\
    \ SaleableItem\n{\n    [...class details...]\n}\n```\n\n对比 `implements` 和 `extends`：\n\
    - `extends` 导致从父类继承接口和实现。\n- `implements` 保证了接口所指定的操作将被提供——这足以允许对实现给定接口的所有类进行多态化处理。\n\
    \n---\n\n# 多态收银机\n\n`CashTill` 类已经使用了多态性：`sale` 方法接受一个 `Publication` 类型的参数，这允许传递它的任何一个子类：\n\
    \n```java\npublic void sellItem (Publication pPub)\n```\n\n我们现在想进一步扩大它，接受任何实现了\
    \ `SaleableItem` 接口的物品：\n\n```java\npublic void sellItem (SaleableItem pSelb)\n\
    ```\n\n当变量或参数的类型被定义为接口时，它的工作方式就像父类类型一样。任何实现接口的类都可以赋值给该变量/参数，因为接口是一种类型，而所有实现它的类都是该类型的子类型。\n\
    \n下文所示……\n\n- `<<interface>>SaleableItem` <- `CashTill`\n- `<<abstract>>Publication`\
    \ <- `Ticket`, `Book`, `Magazine`, `DiscMag`\n\n`CashTill` 不再直接依赖于 `Publication`\
    \ 类——相反依赖于接口 `SaleableItem`。从 `Publication` 和 `Ticket` 到 `SaleableItem` 的关系就像继承箭头，只是线条是虚线——这表示每个类都实现了该接口。\n\
    \n---\n\n# 4.6 再次回到扩展性\n\n多态性允许在不考虑对象精确类的情况下处理对象。这有助于构建可扩展的系统，同时不破坏现有设计的封装性。\n\
    \n例如，我们可以为更多产品或服务创建新类，只要它们实现了 `SaleableItem` 接口，`CashTill` 就能处理它们，而无需对其代码进行任何更改！\n\
    \n一个例子可以是 `Sweets`（糖果）。我们可以定义一个 `Sweets` 类来代表罐里的糖果。我们可以根据重量定义糖果的价格，然后通过从总库存中减去这个重量来销售糖果。这与销售\
    \ `Publication` 不同（我们总是从库存中减 1），也不像销售门票那样（我们只需要打印它们）。\n\n然而，如果我们创建一个实现 `SaleableItem`\
    \ 接口的 `Sweets` 类，我们增强后的多态收银机就可以销售它们，因为它可以销售任何 `SaleableItem`。\n\n接口允许软件组件更灵活、更具扩展地连接在一起，就像日常世界中许多其他类型的插头和插座实现了音频、视频、电源和数据连接一样。想象一下可以插到标准电源插座上的不同电器数量——想象一下如果每买一个新电器都得请电工来家里布线，将是多么不方便！\n\
    \n### 活动 5\n修改以下图表，添加一个柴油汽车类，使其能够用于说明多态性。\n"
- fmt: "\n![Wondershare](images/bg09100001.jpg)\n\n# Feedback 5\n\nThis is one solution\
    \ to this exercise…there are of course others.\n\n![Wondershare](images/bg09100002.jpg)\n\
    \nHere `Mechanic` is directly interacting with `Car`. In doing so it can interact\
    \ with any subtype of `Car` e.g. `Petrol`, `Diesel` or any other type of `Car`\
    \ developed in the future e.g.(`Electric`). These are all different (different\
    \ shapes) and yet `Mechanic` can still interact-with them as they are all `Cars`.\
    \ This is polymorphic.\n\nIf an `ElectricCar` class was added `Mechanic` would\
    \ still be able to work with them without making any changes to the `Mechanic`\
    \ class.\n\n# Object Roles and the Importance of Polymorphism\n\n## Activity 6\n\
    \nAssume `Car` has a `fixEngine()` method that is overridden in `DieselCar` but\
    \ not overridden in `PetrolCar` (as shown on the diagram below).\n\nLook at this\
    \ diagram and answer the following questions…\n\n![Wondershare](images/bg09200002.jpg)\n\
    \na)\n\nb)\n\nWould the following line of code be valid inside the `repair()`\
    \ method ? `pCar.fixEngine()`?If a `DieselCar` object was passed to the `repair()`\
    \ method which actual method would be invoked by `pCar.fixEngine()` ?\n\n# Feedback\
    \ 6\n\na)\n\nb)\n\nYes! We can apply the method `fixEngine()` to any `Car` object\
    \ as it is defined in the class `Car`. This would invoke the overridden method.\
    \ The method must be defined in the class `Car` else the compiler will complain\
    \ at compile time. However at run time the Java Runtime Environment (`JRE`) will\
    \ identify the object passed as being of the subtype `DieselCar` and will invoke\
    \ the overridden method. Clever stuff given that the `repairCar()` method is unaware\
    \ of which type of car is actually passed.\n\n## 4.7 Distinguishing Subclasses\n\
    \nWhat if we have an object handled polymorphically but need to check which subtype\
    \ it actually is? The `instanceof` operator can do this:\n\n`object instanceof\
    \ class`\n\nThis test is true if the object is of the specified class (or a subclass),\
    \ false otherwise.\n\nNote that `(myDiscMag instanceof Magazine)` would be TRUE\
    \ because a `DiscMag` is a `Magazine`.\n\n`instanceof` can also be used with an\
    \ interface name on the right, in which case it tests whether the class implements\
    \ the interface.\n\nStrictly `instanceof` is testing whether the item on the left\
    \ is of the type , or a subtype of, the type specified on the right. Doing this\
    \ we could extend the `CashTill` class such that it displas a specific message\
    \ depending upon the object sold.\n\n```java\npublic void saleType (SaleableItem\
    \ pSelb)\n{\n    if (pSelb instanceof Publication)\n    {\n        System.out.println(\"\
    This is a Publication\");\n    }\n    else if (pSelb instanceof Ticket)\n    {\n\
    \        System.out.println(\"This is a Ticket\");\n    }\n    else\n    {\n \
    \       System.out.println(\"This is a an unknown sale type\");\n    }\n}\n```\n\
    \n`pSelb instanceof Publication` will be true if `pSelb` is any subclass of `Publication`\
    \ (i.e. a `Book`, `Magazine` or `DiscMag`). If we wished to we could equally test\
    \ for a more specific subtype, e.g. `pSelb instanceof Book`\n\nNotice that once\
    \ we compromise the polymorphism by checking for subtypes we also compromise the\
    \ extensibility of the system – new classes (e.g. `Sweets`) implementing the `SaleableItem`\
    \ interface may also require new clauses adding to this if statement, so the change\
    \ ripples through the system with the consequence that it becomes more costly\
    \ and error-prone to maintain.\n\nInstead of doing this we should try to package\
    \ different behaviours into the subclasses themselves, e.g. we could define a\
    \ `describeSelf()` method in the interface `SaleableItem` this would then need\
    \ to be implemented in each class that implements the `SaleableItem` interface.\
    \ Thus each subtype would display a message giving the type of item being sold.\
    \ The if statement above, in `CashTill`, can then be replaced with `pSelb.describeSelf()`\
    \ . Thus when we add new classes to the system we would not need to change the\
    \ `CashTill` class.\n\n## 4.8 Summary\n\n- Polymorphism allows us to refer to\
