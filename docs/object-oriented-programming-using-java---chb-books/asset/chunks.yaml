  trans: '

    用户通过图形用户界面与系统进行交互，添加客户端、消息等。


    另一个额外的类 `Manager` 将控制店主未指定但隐式要求的额外功能——例如，在一天结束时时，需要将 `ClientBook` 和 `MessageSet`
    的详情保存到文件中。当下次运行系统时，需要恢复这些数据，因为店主显然不想每次运行程序时都重新输入所有客户端的详情。


    ### 11.5 接口原型


    虽然收集用户需求的方法超出了本文的范围——但在继续开发之前，对接口进行原型设计并获取反馈始终是一个好主意。


    下图显示了该系统的建议界面:-




    ![Wondershare](img/bg19300001.jpg)


    该界面由三个区域组成。从左到右分别是：a) 用于添加新客户端的区域，b) 用于添加新消息的区域，c) 用于其他基本操作的按钮区域。


    这三个区域每个都将使用放置在一个较大的 `JFrame` 中的 `JPanel` 实现。


    ### 11.6 修改设计以适应变化的需求


    软件需求的变化是生活的常态，而面向对象（OO）编程旨在帮助软件工程师更轻松、更快速、更廉价且风险更小地进行程序调整。继承、方法重写和多态原理是帮助实现此点的重要
    OO 特性。


    **使用 Java 的面向对象编程 - 案例研究**


    在项目中，当从店主处获得原型界面的反馈时，他们表示通常喜欢这个界面，但他们有一个额外的系统需求:-


    某些消息是“紧急消息”。这些消息应该通过在消息前后三个星号在显示器上突出显示，这些消息的费用将是普通消息的两倍。除此之外，紧急消息与普通消息完全一样。


    修改界面设计以适应这一变化很容易——我们可以选择:-


    - 创建一个新面板来适应创建“紧急消息”

    - 既然所需数据与普通消息相同，我们只需要在中间面板添加一个额外的按钮即可。


    但这些额外需求将如何影响系统中的底层类呢？


    如果 OO 原理有效，那么实现这一额外需求应该相对简单。首先，`Message` 和 `Urgent Message` 之间显然存在强的关系。


    如果这两个类都有某些独特特征，但在功能上有显著重叠，我们可以引入继承层次结构来处理这个问题:-


    然而，在这种情况下，普通消息没有独特特征——消息具有相关的费用，可以获取费用和文本，并创建新消息。这一切对于紧急消息也是如此。紧急消息与普通消息一样，只是文本和费用略有不同。因此，`UrgentMessage`
    是 `Message` 的一种类型，可以继承 `Message` 的所有特征，并重写费用和文本方法。


    因此，`Message` 和 `UrgentMessage` 类的关系如下所示，`UrgentMessage` 继承了与 `Message` 关联的所有值和方法，但重写了
    `getCost()` 和 `getText(0)` 方法以反映与紧急消息相关的费用和文本。


    ![Wondershare](img/bg19500001.jpg)


    **使用 Java 的面向对象编程 - 案例研究**


    下面是修改后的类图。但这种变化将如何影响系统的其他部分？


    ![Wondershare](img/bg19600001.jpg)


    得益于多态的操作，这种变化将完全不会影响系统的任何其他部分！


    查看上面的类图，我们可以看到 `MessageSet` 维护并管理一组 `Messages`（`DummyBoard` 也保留了一组消息——一旦它们被上传显示）。但
    `UrgentMessages` 呢？


    紧急消息只是消息的一种特定类型。在 `MessageSet` 内部调用 `addMessage()` 方法时，它需要一个 `Message` 类型的对象，即一个要添加的消息——但子类型
    `UrgentMessage` 的对象仍然是一个 `Message`，因此 `addMessage()` 方法将接受 `UrgentMessage` 对象。


    因此，无需对 `MessageSet` 进行任何更改，`MessageSet` 就可以维护所有要显示的消息（包括紧急和普通）！


    此外，当调用 `dailyPurge()` 方法时，它会调用 `Message` 对象的 `getCost()` 方法，以便为该消息收取费用。在运行时，`JVM`
    将确定对象是 `Message` 类型还是 `UrgentMessage` 类型，并将调用正确版本的 `getCost()` 方法——记住这在 `UrgentMessage`
    中被重写了。这就是多态的体现！


    `MessageSet` 需要消息，但得益于多态和方法重写的应用，`MessageSet` 将乐意处理任何 `Message` 子类，就像它们是 `Message`
    对象一样。如果我们以后决定创建新的消息类型（例如圣诞消息），`MessageSet` 也能处理这些类型，而无需更改任何代码！


    因此，在应用程序中，我们仅通过添加一个类和对界面进行一个微小更改，就能扩展系统添加紧急消息的功能。


    如果不应用多态，我们需要对系统的其他部分进行额外的更改——即 `MessageSet` 和 `DummyBoard`。


    面向对象使系统能够以最小的努力进行扩展！


    ### 11.7 类的打包


    大型程序应该分段成包，因为这提供了适当的封装层次和访问控制（如第 2 章所述）。


    此处用于演示书中理论的系统很难算大型——尽管如此，仍决定将相关类打包在一起，如下。


    像你一样创新。


    如果你渴望一种真正的现代教育，一种鼓励你发表见解并考虑长远的教育，无论是对于自己的未来还是地球的未来。那么哥滕堡大学将是你的选择。在瑞典哥滕堡学习硕士学位课程
    | www.gu.se/education


    ![Wondershare](img/bg19700001.jpg)


    **使用 Java 的面向对象编程 - 案例研究**


    此图显示了使用的四个包以及每个包中的类。还显示了包之间的关联。不意外的是，包含系统界面的主包与其他所有包都关联——这是因为界面调用了整个系统的功能。


    ![Wondershare](img/bg19800001.jpg)![Wondershare](img/bg19800002.jpg)


    完成设计并适应变化的需求后，我们可以开始实现系统。这将分两个阶段进行:-


    - 第一阶段将实现一个基础系统，允许创建消息和客户端，将详情写入文件并显示消息。

    - 第二阶段将扩展系统功能，允许删除客户端并增加其信用额。这将以允许演示测试驱动开发（如第 10 章所述）的方式进行。


    ![Wondershare](img/bg19900001.jpg)


    ### 11.8


