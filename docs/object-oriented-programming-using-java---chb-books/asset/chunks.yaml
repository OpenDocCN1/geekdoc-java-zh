    ## 6.12 总结


    收集用户需求是软件工程过程的一个至关重要的阶段（且超出本文的范围）。将复杂的需求规范转换为优雅、简单的面向对象的架构设计是一项需要经验的技能任务。然而，一个良好的起点是遵循本章列出的简单流程。


    通过一系列任务，我们看到了如何分析对问题的文本描述。我们：


    - 了描述中超出系统范围的方面；

    - 识别了描述在何处使用不同的词指代同义项；

    - 使用名词和动词识别潜在的类、属性和方法；

    - 查看了类以识别潜在的继承层次结构并识别类之间的其他关系（例如关联）；

    - 使用 `CRC` 卡记录了结果类，并通过角色扮演一系列场景测试了设计的有效性，并根据需要修改了我们的设计；

    - 最后，我们可以详细化这些细节并使用类图记录结果。


    本章列出的设计过程将在第 11 章描述的案例中再次详细演示。


    ## 7 集合框架


    ### 引言


    本章将向读者介绍集合框架——这是 Java 标准库的重要部分。


    ### 目标


    在本章结束时，你将能够……


    - 理解 Java 集合框架的基本概念

    - 对比各种 `Collections` 接口的特性

    - 理解迭代器（iterators）的相关概念


    ![Wondershare](img/bg11400001.jpg)


    ### 集合框架


    本章由十二部分组成：


    1) 集合简介

    2) `Collection` 接口

    3) 旧与新集合

    4) `Lists`

    5) `Sets`

    6) `Maps`

    7) `Collection` 实现

    8) 集合框架概述

    9) 使用无类型集合的示例

    10) 使用泛型集合的示例

    11) 关于 Set 的说明

    12) 总结


    #### 7.1 集合简介


    大多数软件系统需要存储各种实体组，而不仅仅是单个项目。`Arrays` 提供实现此点的方法，但 Java `Collections` 支持更多样、灵活的分组形式。


    在 Java 中，集合（或“容器”）是用于汇聚其他对象组类。Java 平台提供了一个“集合框架”，这是一组一致的接口和实现：


    - 接口定义了可用功能

    - 实现影响其他问题，包括性能


    #### 7.2 Collection 接口


    集合框架的核心是一个一个名为 `Collection` 的接口。它定义了框架核心的方法。`List` 和 `Set` 是 `Collection` 的扩展接口——它们继承了所有的操作并增加了一些额外的操作。


    请注意，这些是接口而不是类，它们只定义了操作签名，而没有定义其实现的任何方面。


    另一个重要的额外接口是 `Map`。它不是 `Collection` 的扩展——因为由于某些原因（我们稍后会看到），映射并不完全符合 `Collection`
    层次结构，尽管它们仍然是“集合框架”的一部分。


    因此，我们有以下接口：


    - `Collection`：最通用的分组

    - `List`：按特定顺序的对象集合（允许重复）

    - `Set`：无特定顺序的唯一对象集合

    - `SortedSet`：按升序排列的集合

    - `Map`：唯一“键”及其关联对象的集合

    - `SortedMap`：按键升序排列的映射


    正如 `List` 和 `Set` 扩展 `Collection` 接口一样，`SortedSet` 是 `Set` 的扩展，`SortedMap` 是 `Map`
    的扩展。


    我们本章中查看 `List`、`Sets` 和 `Maps`。


    #### 7.3 旧与新集合


    在 Java SDK 1.4 之前，集合持有 `Object` 类型——即任何类的对象，因为所有类都是 Object 的子类。这允许在集合中混合对象。然而，当从集合中取出对象时，编译器不知道该对象是什么，这会导致一些额外的复杂性。


    在实践中，我们几乎总是希望特定的集合中只有某些特定类型的对象。因此在 Java JDK 5.0 中引入了泛型（generics）。泛型允许在不指定类型的情况下定义类

    '
- fmt: '

    types of data items it handles. Instead the types are specified when the class
    is instantiated, and so are fixed for particular objects.


    Thus using ‘generics’ we can create collections that only store objects of a specified
    type.


    ## 7.4 Lists


    Lists are the most commonly used type of collection – where you might have used
    an array, a `List` will often provide a more convenient method of handling the
    data.


    Lists are very general-purpose data structures, with each item occupying a specific
    position. They are in many ways like arrays, but are more flexible as they are
    automatically resized as data is added. They are also much easier to manipulate
    than arrays as many useful methods have been created that do the bulk of the work
    for you. `Lists` store items in a particular sequence (though not necessarily
    sorted into any meaningful order) and duplicate items are permitted.


    ## 7.5 Sets


    A set is like a ‘bag’ of objects rather than a list. They are based on the mathematical
    idea of a ‘set’ – a grouping of ‘members’ that can contain zero, one or many distinct
    items.


    Unlike a `List`, duplicate items are not permitted in a set and a `Set` does not
    arrange items in order (but a `SortedSet` does).


    Like lists, sets are resized automatically as items are added.


    Many of the operations available for a `List` are also available for a `Set`:

    - we CANNOT add an object at a specific position since the elements are not in
    any order

    - we CANNOT ‘replace’ an item for the same reason (though we can add one and delete
    another)

    - retrieving all the items is possible but the sequence is indeterminate

    - it is meaningless to find what position an element is in.


    ## 7.6 Maps


    Maps are rather different from `Lists` and `Sets` because instead of storing individual
    objects they store pairs of objects. The pair is made up of a ‘key’ and a ‘value’.
    The key is something which identifies the pair. The value is a piece of information
    or an object associated with the key.


    Example: in an address book the keys would be people’s names and the values their
    address, phone, email etc. There is only one value for each key, but since values
    are objects they can contain several pieces of data. Duplicate keys are not permitted,
    though duplicate values are. So in the previous example if you looked up two people
    in the address book you may find them living at the same address – but one person
    would not have two homes.


    Like a set, a `Map` does not arrange items in order (but a `SortedMap` does, in
    order of keys) and like lists and sets, maps are resized automatically as items
    are added or deleted.


    ## Activity 1


    For each of the following problems write down which would be most appropriate:-
    a list, a set or a map.


    1) We want to record the members of a club.

    2) We want to keep a record of the money we spend (and what it was spent on).

    3) We want to record bank account details – each identified by a bank account
    number.


    ### Feedback 1


    1) For this we would use a `Set`. Members can be added and removed as required
    and the members are in no particular order.

    2) For this we would use a `List` – this would record the items bought in the
    order in which they were purchased. Importantly as lists allows duplicate items
    we could buy two identical toys (perhaps for birthday presents for two different
    children).

    3) We would not have two identical Bank accounts so a `Set` seems appropriate
    however as each is identified by a unique account number a `Map` would be the
    most appropriate choice.


    ## 7.7 Collection Implementations


    Up to now we have been looking at the collections interfaces – specifications
    of functionality from which we can pick what we want to use. To actually use them
    we need classes which implement these interfaces.


    The implementations shown here are all part of the Java platform library packages,
    but programmers can also write implementations of their own for special purposes.


    - `ArrayList` implements the `List` interface: generally fast access for an ordered
    list

    - `LinkedList` this also implements the `List` interface: may be faster than `ArrayList`
    in some less usual circumstances

    - `HashSet` implements the `Set` interface: It provide fast access but the items
    are unordered

    - `TreeSet` this also implements the `Set` interface: slower than the `HashSet`
    but it maintain elements in order ie. it provides us with a `SortedSet`

    - `HashMap` implements the `Map` interface: It provide fast access but the items
    are unordered

    - `TreeMap` which also implements the `Map` interface: slower than a `HashMap`
    it maintain elements in order of the `Key` ie. it provides us with a `SortedMap`


    You can’t create a ‘List object’ as `List` is an interface – but you can create
    an `ArrayList` object or a `LinkedList` object, and either of these will provide
    the functionality defined by the `List` interface.


    ## 7.8 Overview of the Collections Framework


    The diagram below gives us a slightly simplified overview of the collections framework.
    It shows the interfaces and the classes that implement the interfaces. Remember,
    interfaces have no implementation within them, they just contain public method
    signatures with must be fulfilled by any class implementing that interface.


    There are two types of arrows shown. Arrows with solid lines denote inheritance;
    e.g. the `Set` interface extends the `Collection` interface. Arrows with dotted
    lines denote implementation; e.g. the `HashSet` class implements the `Set` interface.


    Note that `Map` is not a subinterface of `Collection`. This is because, unlike
    `Lists` and `Sets` which store individual objects, `Maps` store pairings of key
    objects and value objects. We still consider `Map` to be part of the collections
    framework.


    ## Activity 2


    Documentation for all the collections interfaces and implementations is available
    to browse online or download at: `http://java.sun.com/javase/6/docs/api/`


    The interfaces and implementation classes of the Collections Framework can all
    be found in the `java.util` package. Use the online API documentation to find
    the methods for an `ArrayList`. List three of the methods you think would be most
    useful.


    ### Feedback 2


    Some of the clearly useful methods include:

    - `add()` – which adds an element into a specified position in the list

    - `clear()` – which clears the list

    - `contains()` – which returns true if this list contains the specified object

    - `get()` – which returns the object at a specified position and `remove()` –
    which removes an object from a list


    Note some of these methods are overloaded such as `remove()` which can either
    remove an object at a specified position or remove the first instance of a specified
    object.


