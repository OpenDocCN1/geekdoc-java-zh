    Creating And Using Exceptions


    9.3


    Extending the Exception Class


    When writing our own methods we should look for potential failure situations (e.g.
    value that cannot be


    returned, errors that may occur in calculation etc). When a potential error occurs
    we should generate


    an ‘Exception’ object i.e. an object of the Exception class. However it is best
    to first define a subclass of


    the general Exception i.e. to create a specialised class and throw an object of
    this subtype.


    A new exception is just like any new class in this case it is a subclass of java.lang.Exception


    In the case above an error could occur if no client is found with a specified
    ID. Therefore we could create


    a new exception class called ‘UnknownClientException’.


    The parameter to the constructor for the Exception requires a Sting thus the constructor
    for


    UnknownClientException also requires a String. This string is used to give details
    of the problem that


    may generate an exception.


    The code to create this new class is given below…


