    \ (183)\n    - 11.14 完成的系统 (183)\n    - 11.15 总结 (188)\n\n![Wondershare](img/bg00700001.jpg)\n\
    \n前言\n\n本书旨在让读者理解面向对象的编程方法，并在过程中培养一些实用技能。这些实用技能将通过读者受邀的小练习来开发，并提供反馈。书中解释的概念和开发的技能在许多面向对象的语言的程序员中都很常见，因此可以在不同语言之间迁移。然而，出于实际目的，我们使用\
    \ Java 语言来探索和演示这些概念。虽然使用 Java 语言来突出和演示基本的面向对象原则和建模技术，但本书并不是 Java 编程入门。读者应该已经理解编程概念及其在\
    \ Java 中的实现（包括循环、选择语句、计算、数组、数据类型以及对文件处理的基本理解）。本书的设计并不是作为理论教科书，而是作为有助于理解理论概念和学习实现这些概念所需的实用技能的学习工具。为此，每章都包含带有答案和反馈的小练习。在书最后将描述一个较大的案例研究——这将说明早期章节中探索的技术。该案例研究将以开发一个可以随本书下载的完整\
    \ Java 程序而结束。\n\n![Wondershare](img/bg00700002.jpg)\n\n技术大学介绍了工程与自然科学的研究，以及技术相关的数学和自然科学。理解计算机可以解决的一切...\n\
