- fmt: "\ninformation on a UML diagram and program the system. However in a real world\
    \ system the problem would be larger and less well-defined than the problem we\
    \ are working on here and the analysis and refinement of design would therefore\
    \ be a longer more complex process that we can realistically simulate. \n\nAs\
    \ real world problems are more complex our initial designs are unlikely to be\
    \ perfect therefore it makes sense to check our designs and to resolve any potential\
    \ problems before turning these designs into a finished system.\n\nOne method\
    \ of doing checking our designs is to document our designs using `CRC` cards and\
    \ to check if these work by role-playing different scenarios.\n\n`CRC` cards are\
    \ not the only way of doing this and are not part of the UML specification. `CRC`\
    \ stands for `Class`, `Responsibilities` and `Collaborations`. A `CRC` card is\
    \ set out below and is made up of three panes with the class responsibilities\
    \ shown on the left and the collaborations shown on the right.\n\n![Wondershare](images/bg11000001.jpg)\n\
    \nResponsibilities are the things the class needs to know about (ie the attributes)\
    \ and the things it should do (ie. the methods) though on a `CRC` card these are\
    \ not as precisely defined as on a UML diagram.\n\nThe collaborations are other\
    \ classes that this class must work with in order to fulfil its responsibilities.\
    \ The diagram below shows `CRC` cards developed for two classes in the system.\n\
    \n![Wondershare](images/bg11100001.jpg)![Wondershare](images/bg11100002.jpg)\n\
    \nHaving developed `CRC` cards we can roleplay a range of scenarios in order to\
    \ check the system works ‘on paper’. If not we can amend before getting into the\
    \ time consuming process of programming a flawed plan.\n\nOne sample scenario\
    \ would be when a runner gets an additional sponsor. In this case by looking at\
    \ the `CRC` cards above a `Runner` is able to record sponsorship information in\
    \ collaboration with the `SponsorshipForm` class. The `SponsorshipForm` class\
    \ records a list of sponsors and can add additional sponsor to this list.\n\n\
    Testing out a range of scenarios may highlight flaws in our system designs that\
    \ we can then fix – long before any time has been wasted by programming weak designs.\n\
    \n## 6.11 Elaborating Classes\n\nHaving identified the classes in our system design,\
    \ and documented and tested these using `CRC` cards, we can now elaborate our\
    \ `CRC` cards and document our classes using a UML class diagram. To do this we\
    \ need to take our general specification documented via `CRC` cards and our resolve\
    \ any ambiguities e.g. exact data types.\n\nHaving elaborated our `CRC` cards\
    \ we can now draw a class diagram for proposed design (see below):-\n\n![Wondershare](images/bg11200001.jpg)\n\
    \n## 6.12 Summary\n\nGathering User Requirements is an essential stage of the\
    \ software engineering process (and outside the scope of this text). Turning a\
    \ complex requirements specification into an elegant simple object oriented architectural\
    \ design is a skilled task that requires experience. However a good starting point\
    \ is to follow a simple process set out in this chapter.\n\nThrough a sequence\
    \ of tasks we have seen how to analyse a textual description of a problem. We\
    \ have:\n\n- Looked for aspects of the description that are outside the scope\
    \ of the system,\n- Identified where the description refers to synonymous items\
    \ using different words\n- Used the nouns and verbs to identify potential classes,\
    \ attributes and methods\n- Looked at the classes to identify potential inheritance\
    \ hierarchies and to identify other relationships between classes (e.g. associations).\n\
    - Document the resulting classes using `CRC` cards and tested the validity of\
    \ our design by role-playing a range of scenarios and amending our designs as\
    \ appropriate\n- Finally we can elaborate these details and document the results\
    \ using a class diagram.\n\nThe design process set out in this chapter will be\
    \ demonstrated again in detail using the case study described in chapter 11.\n\
    \n## 7 The Collections Framework\n\n### Introduction\n\nThis chapter will introduce\
    \ the reader to the collections framework – an important part of the standard\
    \ Java library.\n\n### Objectives\n\nBy the end of this chapter you will be able\
    \ to…\n\n- Understand the basic concepts of the Java Collections Framework\n-\
    \ Contrast the characteristics of various `Collections` interfaces\n- Understand\
    \ the related concept of an iterators\n\n![Wondershare](images/bg11400001.jpg)\n\
    \n### The Collections Framework\n\nThis chapter consists of twelve sections:\n\
    \n1) An Introduction to Collections\n2) `Collection` Interfaces\n3) Old and New\
    \ Collections\n4) `Lists`\n5) `Sets`\n6) `Maps`\n7) `Collection` Implementations\n\
    8) Overview of the Collections Framework\n9) An Example Using Un-typed Collections\n\
    10) An Example Using Typed Collections\n11) A Note About Sets\n12) Summary\n\n\
    #### 7.1 An Introduction to Collections\n\nMost software systems need to store\
    \ various groups of entities rather than just individual items. `Arrays` provide\
    \ one means of doing this, but the Java `Collections` support much more varied\
