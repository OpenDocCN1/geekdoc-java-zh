    ## 8.1 Software Implementation


    Before a computer can complete useful tasks for us (e.g. check the spelling in
    our documents) software needs to be written and implemented on the machine it
    will run on. Software implementation involves the writing of program source code
    and preparation for execution on a particular machine. Of course before the software
    is written it needs to be designed and at some point it needs to be tested. There
    are many iterative lifecycles to support the process of design, implementation
    and testing that involve multiple implementation phases. Of particular concern
    here are the three long established approaches to getting source code to execute
    on a particular machine…


    * compilation into machine-language object code

    * direct execution of source code by ‘interpreter’ program

    * compilation into intermediate object code which is then interpreted by run-time
    system


    Implementing Java programs involves compiling the source code (Java) into intermediate
    code which is then interpreted by a run-time system called the `JRE`. This approach
    has some advantages and disadvantages and it is worth comparing these three options
    in order to appreciate the implications for the Java developer.


    ### Compilation


    The compiler translates the source code into machine code for the relevant hardware/OS
    combination. Strictly speaking there are two stages: compilation of program units
    (usually files), followed by ‘linking’ when the complete executable program is
    put together including the separate program units and relevant library code.


    The compiled program then runs as a ‘native’ application for that platform. This
    is the oldest model, used by early languages like Fortran and Cobol, and many
    modern ones like C++. It allows fast execution speeds but requires re-compilation
    of the program each time the code is changed.


    ### Interpretation


    Here the source code is not translated into machine code. Instead an interpreter
    reads the source code and performs the actions it specifies.


    We can say that the interpreter is like a ‘virtual machine’ whose machine language
    is the source code language. No re-compilation is required after changing the
    code, but the interpretation process inflicts a significant impact on execution
    speed. Scripting languages tend to work in this way.


    ### Intermediate Code


    This model is a hybrid between the previous two. Compilation takes place to convert
    the source code into a more efficient intermediate representation which can be
    executed by a ‘run-time system’ (again a sort of ‘virtual machine’) more quickly
    that direct interpretation of the source code. However, the use of an intermediate
    code which is then executed by run-time system software allows the compilation
    process to be independent of the OS/hardware platform.

