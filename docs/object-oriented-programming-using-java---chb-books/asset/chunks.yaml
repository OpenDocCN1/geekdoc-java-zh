    ### 11.6 Revising the Design to Accommodate Changing Requirements


    Changing software requirements are a fact of life and OO programming is intended
    to help software engineers make program adaptations easier, quicker, cheaper and
    with less risk of generating errors. The principles of inheritance, method overriding
    and polymorphism are essential OO features that help in this manner.


    **Object Oriented Programming Using Java - Case study**


    In this project when gaining feedback from the shop owner on the prototype interface
    they comment that they generally like the interface but that they have an additional
    system requirement:-


    Some messages are ‘urgent messages’. These should be highlighted on the display
    by placing three stars before andafter the message and the cost of these messages
    will be twice the cost of ordinary messages. Other than that urgent messages are
    just like ordinary messages.


    Modifying the interface design to accommodate this change is easy – we can either:-


    - create an new panel to accommodate the creation of ‘Urgent Messages’

    - since the data required is identical to normal messages we can just add an extra
    button to the middle panel.


    But how will these extra requirements impact on the underlying classes within
    the system?


    If OO principles work implementing this additional requirement should be relatively
    simple. Firstly there is clearly a strong relationship between a `Message` and
    an `Urgent Message`.


    If both classes had some unique features but there was a significant overlap in
    functionality we could introduce an inheritance hierarchy to deal with this:-


    However in this case there are no unique features of an ordinary message – messages
    have an associated cost, the cost and text can be obtained and new messages can
    be created. All this is true for urgent messages. An urgent message is just the
    same as an ordinary message where the text and the cost has been changed slightly.
    Thus `UrgentMessage` is a type of `Message` and can inherit ALL of the features
    of `Message` with the cost and text methods being overridden.


    Thus the `Message` and `UrgentMessage` classes are be related as shown below,
    with `UrgentMessage` inheriting all of the values and methods associated with
    `Message` but overriding `getCost()` and `getText(0)` methods to reflect the different
    cost and text associated with urgent messages.


    ![Wondershare](images/bg19500001.jpg)


    **Object Oriented Programming Using Java - Case study**


    A revised class diagram is below. But how will this change impact upon other parts
    of the system?


    ![Wondershare](images/bg19600001.jpg)


    Thanks to the operation of polymorphism this change will have no impact at all
    on any other part of the system!


    Looking at the class diagram above we can see that `MessageSet` keeps and manages
    a set of `Messages` (`DummyBoard` also keeps a set of messages – once they have
    been uploaded for display). But what about `UrgentMessages`?


    Urgent messages are just a specific type of message. When the `addMessage()` method
    is invoked within `MessageSet` it requires an object of type `Message` i.e. a
    message to be added – but an object of the subtype `UrgentMessage` is still a
    `Message` so the `addMessage()` method would accept an `UrgentMessage` object.


    Therefore, without making any changes at all to `MessageSet`, `MessageSet` can
    maintain a set of all messages to be displayed (both urgent and ordinary)!


    Furthermore when the `dailyPurge()` method is invoked it invokes the `getCost()`
    method on a `Message` object so that the client can be charged for that message.
    At run time the `JVM` will determine whether the object is of type `Message` or
    of type `UrgentMessage` and it will invoke the correct version of the `getCost()`
    method – remember this was overridden in `UrgentMessage`. This is polymorphism
    in action!


    `MessageSet` requires messages but, thanks to the application of polymorphism
    and method overriding, `MessageSet` will happily deal with any `Message` subtype
    as though it were a `Message` object. If later we decided to create new message
    types (such as a Christmas message) `MessageSet` would be able to deal with these
    as well without changing a single line of code!


    Thus in this application we are able to extend the system to add the facility
    for urgent messages by adding only one class and making one small change to the
    interface.


    Without the application of polymorphism we would need to have made additional
    changes to other parts of the system – namely `MessageSet` and `DummyBoard`.


    Object Orientation has enabled to the system to be extended with minimal effort!


