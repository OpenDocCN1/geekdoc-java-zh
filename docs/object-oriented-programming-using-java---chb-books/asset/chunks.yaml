  trans: "\n\n多年来，程序员一直承担着编写文档这一繁琐且耗时的任务。其中部分文档是面向用户的，用于解释程序的功能以及如何使用。另一部分文档则是面向未来的程序员的，他们需要对程序进行修改和调整，使其功能随着组织需求的变化而发生变化。这些程序员需要了解程序的功能及其结构。他们需要知道：\n\
    \n* 它包含哪些包（packages）\n* 每个包中存在哪些类（classes）以及这些类的作用\n* 每个类存在哪些方法（methods），以及每个方法：\n\
    \    * 该方法的作用是什么\n    * 它需要哪些参数\n    * 它返回了什么值（如果有的话）。\n\n### Javadoc 工具\n`javadoc`\
    \ 工具不会生成用户指南，但它会提供程序的技术描述。该工具分析 `*.java` 源文件，并生成一组网页页（`HTML` 文件）作为文档，其格式与 Sun\
    \ 网站上的 API 文档相同。\n\n![Wondershare](img/bg15000001.jpg)\n\n该网站以一组索引网页页的形式，提供了 Java\
    \ 语言规范的关键细节，包括所有的包、类、方法以及方法参数和返回值。这些极其有用的信息并非手工生成，而是使用 `javadoc` 工具生成的。\n\n使用同一个工具可以为任何\
    \ Java 程序生成相同风格的文档。然而，这依赖于源文件中格式正确（且包含丰富信息！）的 javadoc 风格注释，包括如 `@author`、`@param`\
    \ 等标签。\n\n由于这些文档是点击一个按钮即可自动生成的，它将程序员从繁琐、耗时且易出错的任务中解放出来。此外，每当程序更改时，都可以更新文档。\n\n\
    该工具确实要求程序员在开发过程中为代码添加有意义的注释，对源代码注释的疏忽将导致 javadoc 输出结果很差！另一方面，如果注释得当，参考文档就可以“免费”生成了！\n\
    \nJavadoc 注释应该添加在每个类的开头，使用标准标签 `@author` 和 `@version` 按照以下格式给出该类的概述：\n\n```java\n\
    /***********************************\n* 类的描述\n*\n* @author 作者姓名\n* @version 版本详细信息（以及日期）。\n\
    *********************************/\n```\n\n每个方法也应该提供类似的注释，使用 `@param` 和 `@return`\
    \ 来描述每个参数和返回的值。每个参数的详细信息应从参数名称开始，如下所示分行提供：\n\n```java\n/***********************************\n\
    * 方法的描述\n*\n* @param nameOf1stParam 第一个参数的描述\n* @param nameOf2ndParam 第二个参数的描述\n\
    * @return 返回值的描述\n*********************************/\n```\n\n### 信任与责任\nNNE 和\
    \ Pharmaplan 合作建立了 NNE Pharmaplan，这是全球领先的工程咨询公司，完全专注于制药和生物技术行业。\n\nInés Aréizaga\
    \ Esteva（西班牙），25 岁，教育背景：化学工程师：\n– 作为一个新人，必须保持积极和开放的心态，并向同事明确你能处理什么工作。制药领域对我来说是全新的。尽管他们很忙，但大多数同事都会抽时间教我，他们也信任我。尽管起初有点困难，但我能感觉到自己开始受到重视，我的贡献也得到了认可。\n\
    \nNNE Pharmaplan 是全球领先的工程咨询公司，完全专注于制药和生物技术行业。我们在全球范围内雇佣了 1500 名员工，并凭借全方位的服务列表提供全球视野和本地知识。nnepharmaplan.com\n\
    \n![Wondershare](img/bg15100002.jpg)\n\n### 活动 1\n下面的方法接收两个整数并将它们相加。该方法返回此值。请使用适当标签编写一个\
    \ javadoc 注释来描述此方法。\n\n```java\npublic int add(int pNumber1, int pNumber2) {return\
    \ (pNumber1 + pNumber2);}\n```\n\n### 反馈 1\n```java\n/************************************\
    \ 此方法将两个整数相加** \n* @param pNumber1 要相加的第一个数字\n* @param pNumber2 要相加的第二个数字\n* @return\
    \ 两个数字的和\n*********************************/\n```\n\n`javadoc` 工具无法通过分析方法的描述来判断该描述是否是对该方法的准确总结。然而，该工具的作用远不止是将程序员的注释剪切粘贴到网页文档上。该工具的一个功能是分析方法签名，并将其与注释中的标签进行比较，以检查逻辑错误。如果一个方法需要三个参数，但注释只描述了两个，则会检测到此错误并报告给程序员：\n\
    “warning – @param argument “pNumber3” 不是参数名。”\n\n通过分析代码，该工具还提供了关于类、被继承的方法以及被覆盖方法的额外信息。\n\
    \n生成的参考文档是供使用相关类的程序员使用的，它不包含旨在供维护工作中编辑类源码的程序员阅读的方法内部注释。\n\n生成的文档可以放在子文件夹中，并通过在网络浏览器中打开\
    \ `index.html` 文件进行查看。`javadoc` 只会记录公共（public）或保护（protected）的类和成员，因为只有这些成员对其他程序员可用。私有（private）或未给出访问修符的项目将被省略。\n\
    \n### 8.13 总结\n编程语言中的源代码有多种执行方式。Java 使用一种称为 `bytecode` 的中间语言，并且需要一个 `main` 方法。\n\
    \n我们可以使用文本编辑器和 Java 开发工具包（JDK）中的工具“回归基础”创建 Java 程序，但使用构建在 JDK 之上的专业 IDE（集成开发环境）可以提供额外的功能支持。\n\
    \n对于开发的各个方面（如 GUI 设计、绘图和文档编制），可以使用专用工具，但某些 IDE 超越了基础功能，在 IDE 中内置了部分这些功能。`Eclipse`\
    \ 和 `NetBeans` 是两个强大的开源 IDE，支持标准的 Java 程序开发。它们都可以免费下载。\n\n这些工具起初可能看起来令人望畏，因为它们为专业开发提供了广泛的支持，包括代码格式化和重构，尽管有在线帮助，且两个工具都提供了某种程度的自动代码生成（例如\
    \ `main` 方法），以减轻程序员的工作负担。\n\n`javadoc` 工具是一个极其有用且节省时间的设备，但它确实要求程序员在代码中插入有意义的 javadoc\
    \ 风格注释（针对所有类和所有公共方法）。\n\n"
- fmt: "\nIf the reader has written Java programs that make use of the file handling\
    \ facilities they will have written code to catch exceptions i.e. they will have\
    \ used `try-catch` blocks. This chapter explains the importance of creating your\
    \ own exceptions and shows how to do this by extending the `Exception` Class and\
    \ using the `throw` mechanism.\n\n## Objectives\nBy the end of this chapter you\
    \ will be able to…\n* Appreciate the importance of exceptions\n* Understand how\
    \ to create your own exceptions and\n* Understand how to throw these exceptions.\n\
    \nThis chapter consists of six sections:-\n1) Understanding the Importance of\
    \ Exceptions\n2) Kinds of Exception\n3) Extending the Exception Class\n4) Throwing\
    \ Exceptions\n5) Catching Exceptions\n6) Summary\n\n## 9.1 Understanding the Importance\
    \ of Exceptions\nException handling is a critical part of writing Java programs.\
    \ The authors of the file handling classes within the Java language knew this\
    \ and created routines that made use of Java exception handling facilities – but\
    \ are these really important? and do these facilities matter to programmers who\
    \ write their own applications using Java?\n\n### Activity 1\nImagine part of\
    \ a banking program made up of three classes, and three methods as shown below…\n\
    \n* `BankManager`\n    * `listOfClients`\n    * `awardLoan()`\n* `BookofClients`\n\
    \    * `getClient(pClientIID :String) :Client`\n* `Client`\n    * `determineCreditRating()`\n\
    \nThe system shown above is driven by the `BankManager` class. The `awardLoan()`\
    \ method is invoked, either via the interface or from another method. This method\
    \ is intended to accept or reject a loan application.\n\nThe `BookofClients` class\
    \ maintains a set of account holders…people are added to this set if they open\
    \ an account and of course they can be removed. However the only method of interest\
    \ to us is the `getClient()` method. This method requires a string parameter (a\
    \ client ID) and either returns a client object (if the client has an account\
    \ at that bank) – or returns `NULL` (if the client does not exist).\n\nThe `Client`\
    \ class has only one method of interest: `determineCreditRating()`. This method\
    \ is invoked to determine a clients credit rating – this is used by the `BankManager`\
    \ class to decide if a loan should be approved or not.\n\nConsidering the scenario\
    \ above look at the snippet of code below …\n\n```\nClient c = listOfClients.getClient(clientID)\
    \ ;c.determineCreditRating();\n```\n\nThis fragment of code would exist in the\
    \ `awardLoan()` method. Firstly it would invoke the `getClient()` method, passing\
    \ a client ID as a parameter. This method would return the appropriate client\
    \ object(assuming of course that a client with this ID exists) which is then stored\
    \ in a local variable `c`. Having obtained a client the `determineCreditRating()`\
    \ method would be invoked on this client.\n\nLook at these two lines of code.\
    \ Can you identify any potential problems with them?\n\n### Feedback 1\nIf a client\
    \ with the specified ID exists this code above will work. However if a client\
    \ does not exist with the specified ID the `getClient()` method will return `NULL`.\n\
    \nThe second line of code would then cause a run time error (specifically a `NullPointerException`)\
    \ as it tries to invoke the `determineCreditRating()` method on a non existent\
    \ client and the program would crash at this point.\n\n### Activity 2\nConsider\
    \ the following amendment to this code and decide if this would fix the problem.\n\
    \n```java\nClient c = listOfClients.getClient(pClientID) ;If (c !=NULL) {c.determineCreditRating();\
    \ }\n```\n\n### Feedback 2\nIf the code was amended to allow for the possible\
    \ `NULL` value returned it would work – however this protection is insecure as\
    \ it relies on the programmer to spot this potential critical error.\n\nWhen writing\
    \ the `getClient()` method the author was fully aware that a client may not be\
    \ found and in this case decided to return a `NULL` value. However this relies\
    \ on every programmer who ever uses this method to recognise and protect against\
    \ this eventuality.\n\nIf any programmer using this method failed to protect against\
    \ a `NULL` return then their program could crash – potentially in this case losing\
    \ the bank large sums of money. Of course in other applications, such as an aircraft\
    \ control system, a program crash could have life threatening results.\n\nA more\
    \ secure programming method is required to ensure that that a potential crash\
    \ situation is always dealt with! Such a mechanism exists – it is a mechanism\
    \ called ‘exceptions’.\n\nBy using this mechanism we can ensure that other programmers\
    \ who use our code will be alerted to potential crash situations and the compiler\
    \ will ensure that these programmers deal with the ‘issue’. Thus we can ensure\
    \ that no such situation is ‘forgotten’. How they are dealt with remains a choice\
    \ with a programmer who uses our methods but the compiler will ensure that they\
    \ at least recognise a potential crash situation.\n\nIn the situation above rather\
    \ than return a `NULL` value the `getClient()` method should generate an exception.\
    \ By generating an exception the Java compiler will ensure that this situation\
    \ is dealt with.\n\n## 9.2 Kinds of Exception\nIn order to generate meaningful\
    \ exceptions we need to extend the `Exception` classes built into the Java language\
    \ – there are two of these (normal exceptions and run time exceptions).\n\nSubclasses\
    \ of `java.lang.Exception` are used for anticipated problems which need to be\
    \ managed. They must be declared in the originating method’s `throws` clause and\
    \ a call to method must be placed in `try / catch` block.\n\nSubclasses of `java.lang.RuntimeException`\
    \ are used for situations which lead to runtime failure and where it may not be\
    \ possible to take any sensible remedial actions. They do not need to be declared\
    \ in `throws` clause and a call need not be in `try / catch` block (but can be).\n\
    \nThus we have the choice as to whether the Java compiler should force us to explicitly\
    \ deal with a particular kind of exception. `Exception` subclasses are appropriate\
    \ for things we know might go wrong and where we can take sensible recovery action\
    \ – e.g. IO errors. `RuntimeException` subclasses are appropriate for things which\
    \ should not happen at all and where there is probably nothing we can do to recover\
    \ the situation, e.g. an out of memory error or discovering that the system is\
    \ in an inconsistent state which should never be able to arise.\n\n## 9.3 Extending\
    \ the Exception Class\nWhen writing our own methods we should look for potential\
    \ failure situations (e.g. value that cannot be returned, errors that may occur\
    \ in calculation etc). When a potential error occurs we should generate an `Exception`\
    \ object i.e. an object of the `Exception` class. However it is best to first\
    \ define a subclass of the general `Exception` i.e. to create a specialised class\
    \ and throw an object of this subtype.\n\nA new exception is just like any new\
    \ class in this case it is a subclass of `java.lang.Exception`. In the case above\
    \ an error could occur if no client is found with a specified ID. Therefore we\
    \ could create a new exception class called `UnknownClientException`.\n\nThe parameter\
    \ to the constructor for the `Exception` requires a `String` thus the constructor\
    \ for `UnknownClientException` also requires a `String`. This string is used to\
    \ give details of the problem that may generate an exception.\n\nThe code to create\
    \ this new class is given below…\n\n```java\nimport java.lang.Exception;\n```\n"
