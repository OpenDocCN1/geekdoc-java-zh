  trans: "\n一个在 `Magazine` 中，另一个在 `DiscMag` 中被覆盖。然而，这种区别是“多态”的重要部分，我们将在第 4 章中遇到。\n\
    \n## 3.10 `Object` 类\n\n在 Java 中，所有对象都是（直接或间接的）一个名为 `Object` 的类的子类。`Object` 是\
    \ Java 继承层次结构中的“根”。因此，这个类存在于每一个创建的 Java 程序中。\n\n如果一个类没有声明为自另一个类（extend），那么它就会隐式地继承\
    \ `Object`。\n\n`Object` 没有定义实例变量，但定义了几个方法。通常，这些方法会被新类重写以使它们变得有用。`toString()` 方法就是一个例子。\n\
    \n因此，当我们定义自己的类时，默认情况下它们是 `Object` 的直接子类。如果我们的类被组织成层次结构，那么该层次结构中最顶部的父类是 `Object`\
    \ 的直接子类，而其他所有都是间接子类。\n\n### 继承与方法重写\n\n因此，无论是直接还是间接，在 Java 中创建的所有类都继承了 `toString()`。\n\
    \n## 3.11 重写 `Object` 中定义的 `toString()`\n\n`Object` 类定义了一个 `toString()` 方法，这是几个有用方法中的一个。`toString()`\
    \ 的签名如下：\n\n```\npublic String toString()\n```\n\n它的目的是返回一个表示当前对象的字符串值。`Object`\
    \ 定义的 `toString()` 版本产生的输出类似于：“Book@11671b2”。这是类名和对象的“哈希码”。然而，为了具有通用的性，我们需要重写它以给出一个更有意义的字符串。\n\
    \n在 `Publication` 中：\n```java\npublic String toString()\n{\n    return mTitle;\n\
    }\n```\n\n在 `Book` 中：\n```java\npublic String toString()\n{\n    return super.toString()\
    \ + \" by \" + mAuthor;\n}\n```\n\n在 `Magazine` 中：\n```java\npublic String toString()\n\
    {\n    return super.toString() + \" (\" + mCurrIssue + \")\";\n}\n```\n\n在上面的代码中，在\
    \ `Object` 中定义的 `toString()` 被完全替换了，即被重写了，使得 `Publication.toString()` 只返回标题。\n\
    \n`toString()` 方法在 `Book` 中再次被重写了，使得 `Book.toString()` 返回标题（通过父类的 `toString()`\
    \ 方法）和作者。即：这个重写版本使用了在 `Publication` 中定义的版本。因此，如果 `Publication.toString()` 被重写为返回标题和\
    \ ISBN 号，那么 `Book.toString()` 将自动返回标题、ISBN 号和作者。\n\n`Magazine.toString()` 返回标题（通过父类的\
    \ `toString()` 方法）和期数。\n\n我们不会在 `DiscMag` 中进一步重写该方法，因为因为它继承自 `Magazine` 的版本已经足够。我们可以选择在这些字符串中提供更多数据（即更多，甚至全部的实例变量的值）。这里的设计判断是，这些将是这些类对象最通用的可打印表示。在这种情况下，书的标题和作者，或者杂志的标题和当前期数，能够很好地唯一标识特定的出版物。\n\
    \n## 3.12 总结\n\n- 继承允许我们提取共同的属性和行为。我们在父类中对共性进行建模。\n- 子类用于建模专门的属性和行为。\n- 父类中的代码被继承到所有子类。如果我们修改或改进了父类的代码，它会影响所有子类。这减少了我们在程序中需要编写的代码。\n\
    - 子类的构造函数适用特殊规则。\n- 父类可以声明为抽象类，以防止它被实例化（即创建对象）。\n- 我们可以“重写”继承的方法，以便子类以不同于父类的方式实现操作。\n\
    - 在 Java 中，所有类都源自 `Object` 类。\n- `Object` 定义了一些通用操作，这些操作可以在我们自己的类中被用作重写。\n\n##\
    \ 4 对象角色与多态的重要性\n\n### 引言\n\n通过使用经过的示例，本章将解释多态的概念以及它对面向对象软件设计的影响。\n\n### 目标\n\n\
    在本章结束时，你将能够……\n- 理解多态如何允许我们以通用方式处理相关类\n- 在 Java 程序中使用多态\n- 理解带有重写方法的泛态的影响\n- 定义接口以将多态扩展到继承层次结构之外\n\
    - 领会多态提供的可扩展性范围\n\n本章包含八部分：\n1) 类的类型\n2) 可替代性\n3) 多态\n4) 可扩展性\n5) 接口\n6) 再次可扩展性\n\
    7) 区分子类\n8) 总结\n\n## 4.1 类类型\n\n在动物的层次分类中：\n- Pinky 是一头猪（物种 `sus scrofa`）\n- Pinky\
    \ 也是（更通用地说）哺乳动物\n- Pinky 也是（甚至更通用地说）动物\n\n我们可以在不同的细节级别指定生物所属的类型：\n- 高级别 = 不那么具体\n\
    - 低级别 = 更具体\n\n如果你被要求给某一个猪，你可以给他们 Pinky 或任何其他的猪。如果你被要求给某一个哺乳动物，你可以给他们 Pinky、任何其他的猪或其他任何哺乳动物（例如，任何狮子、任何老鼠或任何人类！）。如果你被要求给某一个动物，你可以给他们\
    \ Pinky、任何其他的猪、任何哺乳动物或其他任何动物（鸟、鱼、昆虫等）。\n\n这里的想法是，分类层次结构中的对象与它所属的每一个类都具有“是一个”（is\
    \ a）的关系，每个分类代表一种动物类型。\n\n这在面向对象的程序中也是如此。每当我们定义一个类时，我们就创建一个新的“类型”。类型决定了变量、参数等之间的兼容性。\n\
    \n子类类型是父类类型的子类型，我们可以在任何需要“父类型”的地方替换子类型。据此我们可以在任何需要父类型对象的地方替换子类型对象（如示例所示）。\n\n\
    换句话说，我们可以在任何需要父类对象的地方“替换”子类对象。这反过来是不成立的！\n\n### 活动 1\n\n查看上面的类图，并判断以下代码行在这些类已实现的\
    \ Java 程序中哪些是合：\n- `Publication p = new Book(...);`\n- `Publication p = new DiscMag(...);`\n\
    - `Magazine m = new DiscMag(...);`\n- `DiscMag dm = new Magazine(...);`\n- `Publication\
    \ p = new Publication(...);`\n\n### 反馈 1\n\n- `Publication p = new Book(...);`：在这里我们定义了一个\
    \ `Publication` 类型的变量 `p`，然后调用 `Book` 类的构造函数并将结果赋值给 `p`，这是正确的，因为 `Book` 是 `Publication`\
    \ 的子类，即 `Book` 是 `Publication`。\n- `Publication p = new DiscMag(...);` 这是正确的，因为\
    \ `DiscMag` 是 `Magazine` 的子类，而 `Magazine` 是 `Publication` 的子类，即 `DiscMag` 是 `Publication`\
    \ 的间接子类。\n- `Magazine m = new DiscMag(...);` 这是正确的，因为 `DiscMag` 是 `Magazine` 的子类。\n\
    - `DiscMag dm = new Magazine(...);` 这是非法的，因为 `Magazine` 是 `DiscMag` 的父类。\n- `Publication\
    \ p = new Publication(...);` 这是非法的，因为 `Publication` 是一个抽象类，因此无法实例化。\n\n"
- fmt: "\n# Object Oriented Programming Using Java\n\n## Object Roles and the Importance\
    \ of Polymorphism\n\n### 4.2 Substitutability\n\nWhen designing class/type hierarchies,\
    \ the type mechanism allows us to place a subclass object where a superclass is\
    \ specified. However this has implications for the design of subclasses – we need\
    \ to make sure they are genuinely substitutable for the superclass. If a subclass\
    \ object is substitutable then clearly it must implement all of the methods of\
    \ the superclass – this is easy to guarantee as all of the methods defined in\
    \ the superclass are inherited by the subclass. Thus while a subclass may have\
    \ additional methods it must at least have all of the methods defined in the superclass\
    \ and should therefore be substitutable.\n\nHowever what happens if a method is\
    \ overridden in the subclass?\n\nWhen overriding methods we must ensure that they\
    \ are still substitutable for the method being replaced. Therefore when overriding\
    \ methods, while it is perfectly acceptable to tailor the method to the needs\
    \ of the subclass a method should not be overridden with functionality which performs\
    \ an inherently different operation.\n\nFor example, `recvNewIssue()` in `DiscMag`\
    \ overrides `recvNewIssue()` from `Magazine` but does the same basic job (“fulfils\
    \ the contract”) as the inherited version with respect to updating the number\
    \ of copies and the current issue. However, it extends that functionality in a\
    \ way specifically relevant to `DiscMags` by displaying a reminder to check the\
    \ cover discs.\n\nWhat do we know about a ‘Publication’?\n\nAnswer: It’s an object\
    \ which supports (at least) the operations:\n\n```\nvoid sellCopy()\ndouble getPrice()\n\
    int getCopies()\nvoid setCopies(int pCopies)\nString toString()\n```\n\nInheritance\
    \ guarantees that objects of any subclass of `Publications` provides at least\
    \ these. Note that a subclass can never remove an operation inherited from its\
    \ superclass(es) – this would break the guarantee. Because subclasses extend the\
    \ capabilities of their superclasses, the superclass functionality can be assumed.\n\
    \nIt is quite likely that we would choose to override the `toString()` method\
    \ (initially defined within ‘Object’) within `Publication` and override it again\
    \ within `Magazine` so that the `String` returned provides a better description\
    \ of Publications and Magazines. However we should not override the `toString()`\
    \ method in order to return the price – this would be changing the functionality\
    \ of the method so that the method performs an inherently different function.\
    \ Doing this would break the substitutability principle.\n\n### 4.3 Polymorphism\n\
    \nBecause an instance of a subclass is an instance of its superclass we can handle\
    \ subclass objects as if they were superclass objects. Furthermore because a superclass\
    \ guarantees certain operations in its subclasses we can invoke those operations\
    \ without caring which subclass the actual object is an instance of.\n\nThis characteristic\
    \ is termed ‘polymorphism’, originally meaning ‘having multiple shapes’. Thus\
    \ a `Publication` comes in various shapes…it could be a `Book`, `Magazine` or\
    \ `DiscMag`. We can invoke the `sellCopy()` method on any of these Publications\
    \ irrespective of their specific details.\n\nPolymorphism is a fancy name for\
    \ a common idea. Someone who knows how to drive can get into and drive most cars\
    \ because they have a set of shared key characteristics – steering wheel, gear\
    \ stick, pedals for clutch, brake and accelerator etc – which the driver knows\
    \ how to use. There will be lots of differences between any two cars, but you\
    \ can think of them as subclasses of a superclass which defines these crucial\
    \ shared ‘operations’.\n\nIf `p` ‘is a’ `Publication`, it might be a `Book` or\
    \ a `Magazine` or a `DiscMag`. Whichever, it has a `sellCopy()` method.\n\nSo\
    \ we can invoke `p.sellCopy()` without worrying about what exactly ‘p’ is. This\
    \ can make life a lot simpler when we are manipulating objects within an inheritance\
    \ hierarchy. We can create new types of `Publication` e.g. a `Newspaper` and invoke\
    \ `p.sellCopy()` on a `Newspaper` without have to create any functionality within\
    \ the new class – all the functionality required is already defined in `Publication`.\
    \ Polymorphism makes it very easy to extend the functionality of our programs\
    \ as we will see in Chapter 11.\n\n### 4.4 Extensibility\n\nHuge sums of money\
