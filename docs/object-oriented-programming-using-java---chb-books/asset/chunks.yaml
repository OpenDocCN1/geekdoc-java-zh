    # Keywords and Notes


    ## Inheritance


    - Aside from associations, the other main modelling relationship is inheritance:

    - `Class A` ‘inherits’ both the interface and implementation of `Class B`, though
    it may override implementation details and supplement both.


    We will look at inheritance in detail in Chapter 3.


    ## Interfaces


    - Interfaces are similar to inheritance however with interfaces only the interface
    is inherited. The methods defined by the interface must be implemented in every
    class that implements the interface.

    - Interfaces can be represented using the `<<interface>>` keyword:


    ![Wondershare](images/bg03700001.jpg)


    There is also a shorthand for this. In both cases these examples denote that the
    `SaleableItem` interface is required by `CashTill` and implemented by `Publication`.


    NB the dotted-line version of the inheritance line/arrow which shows that `Publication`
    ‘implements’ or ‘realizes’ the `SaleableItem` interface.


    The “ball and socket” notation is new in UML 2 – it is a good visual way of representing
    how interfaces connect classes together.


    We will look at the application of interfaces in more detail in Chapter 4.


    ## Keywords


    UML defines keywords to refine the meaning of the graphical symbols.

    We have seen `<<interface>>` and we will also make use of `<<abstract>>` but there
    are many more.

    An abstract class may alternatively be denoted by showing its name in italics
    though this is perhaps less obvious to a casual reader.


    ## Notes


    Finally we can add notes to comment on a diagram element. This gives us a ‘catch
    all’ facility for adding information not conveyed by the graphical notation.


    ## Activity 4


    From your own experience, try to develop a model which illustrates the use of
    the following elements of UML Class Diagram notation:


    - simple association

    - bidirectional association

    - aggregation (tricky!)

    - composition

    - association

    - multiplicity

    - generalization (inheritance)

    - interfaces

    - notes


    For this exercise concentrate on the relationships between classes rather than
    the details of their members. Explain and discuss your model with other students
    and your tutor. To help you get started some small examples are given below.


    - In a University administration system we might produce a transcript of results
    for each year the student has studied (including a possible placement year). This
    association relationship is naturally unidirectional – given a student we might
    want to find their transcript(s), but it seems unlikely that we would have a transcript
    and need to find the student to whom it belonged.

    - In a library a reader can borrow up to eight books. A particular book can be
    borrowed by at most one reader. We might want a bidirectional relationship as
    shown here because, in addition to being able to identify all the books which
    a particular reader has borrowed, we might want to find the reader who has borrowed
    a particular book (for example to recall it in the event of a reservation).

    - This might be part of the model for some kind of educational virtual anatomy
    program. Composition – the “strong” relationship which shows that one object is
    (and has to be) part of another seems appropriate here. The multiplicities would
    not always work for real people though – they might have lost a finger due to
    accident or disease, or have an extra one because of a genetic anomaly. And what
    if we were modelling the “materials” in a medical school anatomy lab? A hand might
    not always be part of a body! Perhaps the “weaker” aggregation relationship would
    reflect this better.

    - A customer can have any number of bank accounts, and a bank account can be held
    by one person or two people (a “joint account”). We have suppressed the navigability
    of this relationship, perhaps because we have not yet decided this issue. A bank
    account must either be a current account or a savings account – hence `BankAccount`
    itself is abstract. (We could have shown this using italics rather than the `<<abstract>>`
    keyword)

    - Part of a clock is a display to show the time. This might be an analogue display
    or a digital display. We could use a superclass and two subclasses, but since
    the implementation of the two displays will be entirely different it may be more
    appropriate to use an interface to define the operations which `AnalogDisplay`
    and `DigitalDisplay` must provide.

    - A note is used here to add some information which cannot be conveyed with standard
    UML notation and may not be obvious simply from the names and relationships of
    the classes depicted.


