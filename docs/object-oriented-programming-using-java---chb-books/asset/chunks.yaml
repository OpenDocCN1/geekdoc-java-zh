  trans: '

    本章将讨论不同的编程范式，以及面向对象方法在软件开发和建模中的优势。我们将解释面向对象所信赖的概念（抽象、封装、继承和多态）。


    ### 目标


    在本章结束时，你将能够……


    • 解释什么是面向对象编程，

    • 描述面向对象编程方法的优点，以及

    • 理解面向对象编程所信赖的抽象、封装、泛化和多态的基本概念。


    这些问题都将在本书后面的章节中进行更详细的探讨。


    本章由六部分组成：


    1) 计算机的简史

    2) 不同的编程范式

    3) 为什么使用面向对象范式

    4) 面向对象原则

    5) 什么是面向对象编程？

    6) 面向对象编程方法的益处。


    ### 计算机的简史


    计算不断改变着我们的世界和环境。在 20 世纪 60 年代，人们创建了称为大型主机（mainframes）的大机器，以高效地管理海量数据（数字）。银行账户和工资程序改变了组织的工作方式，并让这些组织的某些变得更加高效。


    在 20 世纪 80 年代，个人电脑变得普及，改变了许多人的工作方式。人们开始拥有自己的电脑，许多人使用文字处理和电子表格应用程序（用于写信和和管理家庭账目）。在
    20 世纪 90 年代，电子邮件变得常见，万维网诞生了。这些技术彻底改变了通信，允许个人发布可以在全球范围内轻松访问的信息。这些新技术产生的影响尚未被完全理解，因为社会正在适应电子商务的机遇、新的社交网络技术（推特、脸书、Space、在线游戏等）以及网络相关犯罪的挑战。


    使用 Java 的面向对象编程

    面向对象编程导论


    正如新的计算技术正在改变我们的世界一样，新的技术和思想也在改变我们开发计算机系统的方式。在 20 世纪 50 年代，使用机器码（不成熟、复杂且针对特定机器）语言是常见的。


    在 20 世纪 60 年代，使编程更简单的高级语言变得常见。然而，这些语言导致了大型复杂程序的开发，难以管理和维护。


    20 世纪 70 年代，结构化编程范式成为大型复杂计算机程序的认可标准。结构化编程范式提出的方法是将开发的程序在逻辑上结构化为独立的、更小的、更易于管理的组件。此外，还提出了分析数据的方法，允许创建高效的大型数据库，防止数据的数据复制，并保护我们免受数据不同步的相关风险。


    然而，在 a) 理解我们需要创建的系统以及 b) 随着用户需求变化改变现有软件方面，仍然存在重大问题。


    在 20 世纪 80 年代，开发了“模块化”语言，如 `Modula-2` 和 `ADA`，它们成为现代面向对象语言的前身。


    在 20 世纪 90 年代，面向对象范式和基于组件的软件开发思想被开发，从 2000 年起，面向对象语言成为常态。


    面向对象范式基于过去 30 年开发的许多关于抽象、封装、泛化和多态的理念，并导致了软件组件的开发，其中操作和数据被结合在一起建模。


    ### 不同的编程范式


    结构化编程范式认为，程序可以在合理的区块中开发，使程序更易于理解。


    使用 Java 的面向对象编程

    面向对象编程导论


    #### 活动 1


    假设你每天执行以下活动。将此列表分组，并为每组活动起一个标题。


    ```

    起床

    吃早餐

    停停车

    穿衣服

    把车从车库开出来

    开车上班

    找出老板今天想要什么

    ```


    #### 反馈 1


    通过结构化我们的指令列表并考虑整体结构（起床、上班、工作），我们可以在不担心对其他部分产生任何潜在影响的情况下，改变和改进某一部分。例如，我们可以改进以下指令：


    ```

    收听当地交通和天气预报

    决定乘坐公交车还是开车

    如果开车，取车并开车上班

    否则走到公交站等公交车

    ```


    而不会对“起床”或“工作”产生任何潜在影响。同样，结构化计算机程序可以使每个部分更易于理解，并使大型程序更容易维护。


    面向对象范式建议，我们应该将计算机程序中的指令与其操作和存储的数据建模，并将它们共同存储为组件。这样做的优点之一是我们可以获得可用的软件组件。


    #### 活动 2


    想象一个个人通讯录，其中存储了关于你朋友的数据：姓名、地址、电话号码。


    列出你可能对这个通讯录做的三件事。接下来，识别另一个可能出于存储朋友列表以外的其他目的而使用相同通讯录的人。


    #### 反馈 2


    对于通讯录，我们希望能够执行以下操作：查找朋友的详细信息（即他们的电话号码）、在通讯录中添加地址，以及当然，还有删除地址。


    通过创建一个简单的软件组件来存储通讯录中的数据（即姓名列表等）以及我们能执行的操作（即添加地址、查找电话号码等），我们可以在另一个软件系统中重用它，例如，它可以被业务经理用于存储和查找客户的详细信息。它也可以成为图书馆系统的一部分，供管理员用于存储和检索图书馆用户的详细信息。

    '
