    Object Oriented Programming Using Java

    Case study


    ### 11.4 Documenting the design using UML


    To fully document our designs we need to:-


    - Determine in detail what attributes go in each class

    - Determine how the classes are related and

    - Put classes into appropriate packages.


    #### Elaborating the Classes


    Having worked through CRC scenarios we can make an initial assignment of instance
    variables and methods among our classes, including some accessors and mutators
    whose necessity has become evident (see diagram below).


    ```

    `Client`

    `name`, `address`, `phone`, `credit`

    `decreaseCredit()`


    `ClientBook`

    `?`

    `addClient()`, `getClient()`


    `MessageSet`

    `?`

    `addMessage()`, `display()`, `dailyPurge()`


    `Message`

    `clientID`, `text`, `daysRemaining`, `cost`

    `decrementDays()`, `getText()`, `hasExpired()`, `getCost()`


    <<interface>>DisplayBoardControl`

    `loadMessages()`, `run()`

    ```


    188

    Download free eBooks at bookboon.com

    Object Oriented Programming Using Java

    ![Wondershare](images/bg18900001.jpg)

    Case study


    We don’t know of any simple attributes which `ClientBook` and `MessageSet` will
    require, but they will need to be associated with other classes so we still have
    some work to do there – hence the `?`s (which are not an official part of UML)!


    #### Relationships Between Classes


    We can now start to work out how these classes are related.


    Starting with `ClientBook` and `Client`: a `ClientBook` will record details of
    zero or more clients. The navigability will be from `ClientBook` to `client` because
    the book “knows about” its `Clients` (in implementation terms it will have references
    to them) but the individual `Clients` will not have references back to the book.


    The one-to-many relationship suggests that `ClientBook` will have a `Collection`
    (of some kind) of `Clients`. The specification states that each `Client` will
    have a unique ID thus the collection will in fact be a map where each entry is
    made up of a pair of values – in this case a `clientID` (a string) and a `Client`
    object.


    189

    Download free eBooks at bookboon.com

    Object Oriented Programming Using Java

    Case study


    ![Wondershare](images/bg19000001.jpg)


    The relationship between `MessageSet` and `Message` is very similar to the relationship
    between `ClientBook` and `Clients`.


    Although `MessageSet` appears to have no attributes, its one-to-many association
    with `Message` again implies an attribute which is a `Collection` type. The specification
    states that messages must be unique but does not imply a key value is required
    thus a simple set will suffice.


    ![Wondershare](images/bg19000002.jpg)


    190

    Download free eBooks at bookboon.com

    Object Oriented Programming Using Java

    Case study


    #### Relating the Classes: MessageSet, ClientBook, and DisplayBoardControl


    Because `MessageSet` is responsible for initiating the display of the messages
    on the display board it has a dependency on a class implementing the `DisplayBoardControl`
    interface.


    `MessageSet` also has a relationship with `ClientBook` because it needs to access
    and update Client information when the daily purge is carried out. This is shown
    below.


    ![Wondershare](images/bg19100001.jpg)![Wondershare](images/bg19100002.jpg)


    #### Relating the Classes Overall


    The diagram below shows how all these classes are related. An additional class,
    `DummyBoard`, has been included which will implement the `DisplayBoardControl`
