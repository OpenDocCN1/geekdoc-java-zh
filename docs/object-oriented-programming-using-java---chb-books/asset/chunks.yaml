    that can beborrowed – we may want to define more specialised sub-classes (e.g.
    books, magazines, audio/visual material). These will share the attributes defined
    for the general class but will have specific differences (for example there could
    be a charge for borrowing audio/visual items).


    1.6


    The Benefits of the Object Oriented Programming Approach


    Whether or not you develop programs in an object oriented way, before you write
    the software you must


    first develop a model of what that software must be able to do and how it should
    work. Object oriented


    modelling is based on the ideas of abstraction, encapsulation, inheritance and
    polymorphism.


    The general proponents of the object oriented approach claims that this model
    provides:


    • better abstractions (modelling information and behaviour together)


    • better maintainability (more comprehensible, less fragile)


    • better reusability (classes as encapsulated components)


    We will return to look at these claims later in Chapter 11 as we see a case study
    showing in detail how


    object oriented analysis works and how the resultant models can be implemented
    in an object oriented


    programming language (i.e. Java).


    1.7


    Summary


    Object oriented programming involves the creation of classes by modelling the
    real world. This allows


    more specialised classes to be created that inherit the behaviour of the generalised
    classes. Polymorphic


    behaviour means that systems can be changed, as business needs change, by adding
    new specialised


    classes and these classes can be accessed by the rest of the system without any
    regard to their specialised


    behaviour and without changing other parts of the current system.


