- fmt: "\n# Programming the Message Classes\n\n`Message`, `UrgentMessage` and `MessageSet`\
    \ are relatively straight forward to program.\n\n`Message` has various instance\
    \ variables (Strings: `clientID`, `text` and int: `daysRemaining`). It has a constructor\
    \ to initialize the instance variables and it has the following methods:\n\n-\
    \ `void decrementDays()`\n- `boolean hasExpired()`\n- `String getClientID()`\n\
    - `int getCost()`\n- `String getText()`\n\nThe `Manager` class will need to store\
    \ the `ClientBook` and `MessageSet` objects to a file. To do this all `Client`\
    \ objects and `Message` objects will also need to be stored hence these classes\
    \ (including the `Message` class) will need to implement the `Serializable` interface.\n\
    \nFinally the requirements state that “No duplicate messages (i.e. the same text\
    \ for the same client) are permitted.” Therefore `Message` must override the `equals()`\
    \ and `hashCode()` methods to ensure that duplicates will not be permitted when\
    \ the messages are stored in a `Set`.\n\nThe complete code for this class is given\
    \ below – though comments have been excluded for the sake of brevity.\n\n```java\n\
    package messages;\nimport java.io.Serializable;\n\npublic class Message implements\
    \ Serializable{\n    final int COST=1;\n\n    private String clientID;\n    private\
    \ String messageText;\n    private int daysRemaining;\n\n    public Message (String\
    \ pClientID, String pText,int pDaysRemaining) {\n        clientID = pClientID;\n\
    \        messageText = pText;\n        daysRemaining = pDaysRemaining;\n    }\n\
    \n    public void decrementDays() {\n        daysRemaining--;\n    }\n\n    public\
    \ boolean hasExpired() {\n        return (daysRemaining == 0);\n    }\n\n    public\
    \ String getClientID() {\n        return clientID;\n    }\n\n    public String\
    \ getText () {\n        return messageText;\n    }\n\n    public int getCost()\
    \ {\n        return COST;\n    }\n\n    public int hashCode () {\n        return\
    \ (clientID + messageText).hashCode();\n    }\n\n    public boolean equals (Object\
    \ pOther) {\n        Message otherMsg = (Message)pOther;\n        return (clientID.equals(otherMsg.clientID)\
    \ && messageText.equals(otherMsg.messageText));\n    }\n\n    public String toString(){\n\
    \        return (\"Message text: \" + messageText +\"\\nClient: \" + clientID\
    \ +\"\\nDays left: \" + daysRemaining);\n    }\n}\n```\n\nThe `UrgentMessage`\
    \ class is extremely short and sweet as it inherits almost all of its functionality\
    \ from `Message`:-\n\n```java\npackage messages;\n\npublic class UrgentMessage\
    \ extends Message{\n    final int COST=2;\n\n    public UrgentMessage (String\
    \ pClientID, String pText,int pDaysRemaining){\n        super(pClientID, pText,\
    \ pDaysRemaining);\n    }\n\n    public String getText () {\n        return \"\
    *** \"+super.getText()+ \" ***\";\n    }\n\n    public int getCost() {\n     \
    \   return COST;\n    }\n}\n```\n\nThe `MessageSet` class has a one-to-many relationship\
    \ with `Message`. This implies a collection type and the fact that duplicate massages\
    \ are not allowed (at least for the same client) implies the collection should\
    \ be a `Set`. \n\nThe `MessageSet` class requires an instance variable to hold\
    \ the set of messages and also one to reference a `ClientBook` – as it needs access\
    \ to the clients when performing a daily purge.\n\nA constructor is required to\
    \ assign a new `HashSet()` to `messageSet` and to initialize `clientBook` to a\
    \ parameter. The following methods are also required:\n\n- `void addMessage(Message\
    \ pMsgToAdd)`\n- `void display(DisplayBoardControl db)`\n- `void dailyPurge()`\n\
    \nSome of the code from this class is shown below:-\n\n```java\npackage messages;\n\
    import ...\n\npublic class MessageSet implements Serializable{\n    private Set<Message>\
    \ messageSet;\n    private ClientBook clients;\n\n    public MessageSet (ClientBook\
    \ pClients){\n        clients = pClients;\n        messageSet = new HashSet<Message>();\n\
    \    }\n\n    public void addMessage(Message pMsgToAdd) {\n        messageSet.add(pMsgToAdd);\n\
    \    }\n\n    public void display(DisplayBoardControl db){ \n        db.loadMessages(messageSet);\n\
    \        db.run();\n    }\n\n    public void dailyPurge() {\n        // code omitted\
    \ here\n    }\n\n    public void saveToFile(ObjectOutputStream oos) {\n      \
    \  try { \n            oos.writeObject(this);\n        } catch (IOException ioe)\
    \ {\n            JOptionPane.showMessageDialog(null, \"\"+ioe);\n        }\n \
    \   }\n\n    static public MessageSet readFromFile(ObjectInputStream ois) {\n\
    \        MessageSet cb = null;\n        try {\n            cb = (MessageSet) ois.readObject();\n\
    \        } catch (IOException ioe) {\n            JOptionPane.showMessageDialog(null,\
    \ \"\"+ioe);\n            System.exit(1);\n        } catch (ClassNotFoundException\
    \ cnfe) {\n            JOptionPane.showMessageDialog(null, \"\"+cnfe);\n     \
    \       System.exit(1);\n        }\n        return cb;\n    }\n}\n```\n\nThe code\
    \ above shows the creation of a typed collection of ‘Message’ and methods to add\
    \ and display messages.\n\nThe method to display messages requires an object of\
    \ type `DisplayBoardControl` to be passed as a parameter. Initially a `DummyBoard`\
    \ object will be provided however when a real display board is purchased then\
    \ this object will replace the `DummyBoard` object. This will have no impact on\
    \ the code within the `display()` method as both objects are of the more general\
    \ type `DisplayBoardControl`. This is another example of the application of polymorphism.\n\
    \nTwo additional methods have been created `saveToFile()` and `readFromFile()`\
    \ which read and write the entire set of messages to file using the technique\
    \ of object serialisation.\n\nThe `dailyPurge()` method was excluded from the\
    \ code above so we could concentrate on this method:-\n\n```java\npublic void\
    \ dailyPurge() {\n    Client client;\n    // loop through all current messages\n\
    \    for (Message msg:messageSet) {\n        // deduct 1 from days remaining for\
    \ message\n        msg.decrementDays();\n        try{\n            // Find the\
    \ client who paid for this message\n            client = clients.getClient(msg.getClientID());\n\
    \            // Find the cost of the message and deduct this from clients credit\n\
    \            client.decreaseCredit(msg.getCost());\n            // if message\
    \ expired or client out of credit remove it\n            if (msg.hasExpired()\
    \ || client.getCredit() <= 0) {\n                messageSet.remove(msg);\n   \
    \         }\n        }catch (UnknownClientException uce) {\n            JOptionPane.showMessageDialog(null,\"\
    INTERNAL ERROR IN MessageSet.Purge()\\n\"Exception details: \" + uce +\"\\nMesspage\
    \ details:\\n\" + msg);\n            if (msg.hasExpired()) {\n               \
    \ messageSet.remove(msg);\n            }\n        }\n    }\n}\n```\n\nThe `dailyPurge()`\
    \ method performs the following actions:\n1. For each message\n2. Decrement the\
    \ days remaining for that message\n3. Find the client who paid for that message\n\
    4. Find the cost of the message and deduct this from that clients credit\n5. If\
    \ the message has expired or the client has run out of credit remove it\n\nNote\
    \ it is possible that a client could not be found – hence the try catch block.\
    \ This will be discussed in the next section.\n\n# Programming the Client Classes\n\
    \nProgramming the `Client` class is very similar to programming the `Message`\
    \ class and is not shown here.\n\nProgramming the `ClientBook` class is also very\
    \ similar to programming `MessageSet`, and most of this class is omitted however\
    \ there are two significant differences:-\n\n- All clients have a `clientID` so\
    \ `ClientBook` uses a `Map` instead of a `Set`.\n- The method `getClient()` could\
    \ fail if no client exists with the specified `clientID`. We need to build in\
    \ protection in case a client cannot be found.\n\n```java\npackage clients;\n\
    import ...\n\npublic class ClientBook implements Serializable {\n    private Map<String,Client>\
    \ clientMap;\n\n    public ClientBook() {\n        clientMap = new HashMap<String,Client>();\n\
    \    }\n\n    public void addClient(String pClientID, Client pNewClient) {\n \
    \       clientMap.put(pClientID, pNewClient);\n    }\n\n    public Client getClient(String\
    \ pClientID)// details omitted\n\n    public void saveToFile(ObjectOutputStream\
    \ oos) {\n        // details omitted\n    }\n\n    static public ClientBook readFromFile(ObjectInputStream\
    \ ois) {\n        // details omitted\n    }\n}\n```\n\nThe code above shows the\
    \ creation of the `Map` and the other methods required by the `ClientBook` class.\n"
