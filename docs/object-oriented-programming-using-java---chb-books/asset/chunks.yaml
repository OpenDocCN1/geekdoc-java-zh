  trans: "\n\n# 使用 Java 进行面向对象编程\n\n## 对象角色与多态性的性\n\n### 4.2 可替换性\n\n在设计类/类型层次结构时，类型机制允许我们在指定父类的地方放置一个子类对象。然而，这会对子类的设计产生影响——我们需要确保它们确实是可以与父类相互替换的。如果一个子类对象是可替换的，那么它显然必须实现父类的所有方法——这一点很容易被保证，因为父类中定义的所有方法都由子类继承了。因此，虽然子类可能拥有额外的方法，但它至少必须拥有父类中定义的所有方法，并且应该是可替换的。\n\
    \n但是，如果一个方法在子类中被重写了会发生什么？\n\n在重写方法时，我们必须确保它们仍然可以被替换的方法所替换。因此，在重写方法时，虽然根据子类的需求定制方法是完全可以接受的，但不应该用执行本质不同操作的功能来重写方法。\n\
    \n例如，`DiscMag` 中的 `recvNewIssue()` 重写了 `Magazine` 中的 `recvNewIssue()`，但在更新副本数量和当前期数方面，它与继承的版本执行了相同的基本工作（“履行了合约”）。然而，它以特别适用于\
    \ `DiscMags` 的方式扩展了该功能，显示检查光盘的提醒。\n\n我们对“Publication”（Publication）知道什么？\n\n答案：它是一个支持（至少）以下的操作：\n\
    \n```\nvoid sellCopy()\ndouble getPrice()\nint getCopies()\nvoid setCopies(int\
    \ pCopies)\nString toString()\n```\n\n继承保证了 `Publications` 的任何子类的对象至少提供了这些操作。注意，子类永远无法删除从其父类（或类）继承的操作——这将破坏这种保证。因为子类扩展了其父类的能力，所以可以假设父类的功能可用。\n\
    \n我们很有可能在 `Publication` 中重写（最初定义在“Object”中）的 `toString()` 方法，并在 `Magazine` 中再次重写它，以便返回的\
    \ `String` 能够对出版物和杂志提供更好的描述。然而，我们不应该为了返回价格而重写 `toString()` 方法——这将改变方法的功能，导致方法执行了本质不同的功能。这样做将破坏可替换性原则。\n\
    \n### 4.3 多态性\n\n因为子类的实例是其父类的实例，所以我们可以像处理父类对象一样处理子类对象。此外，因为父类保证了其子类中的某些操作，我们可以调用这些操作，而不必关心实际对象是哪个子类的实例。\n\
    \n这种特性被称为“多态性”（polymorphism），原意是“具有多种形状”。因此，一个 `Publication` 有各种形状……它可能是一个 `Book`、`Magazine`\
    \ 或 `DiscMag`。我们可以调用这些 `Publication` 的任何 `sellCopy()` 方法，而不考虑它们的具体细节。\n\n多态性是对一个常见概念的华丽说法。一个会开车的人可以进入并驾驶大多数汽车，因为它们拥有一组共同的特征——方向盘、档位杆、离合踏板、刹车板和加速板等——驾驶员知道如何使用它们。任何两辆汽车之间会有很多差异，但你可以将它们想象成某个父类的子类，该父类定义了这些关重要的共享“操作”。\n\
    \n如果 `p` “是一个” `Publication`，它可能是一个 `Book`、`Magazine` 或 `DiscMag`。无论是哪种，它都有一个\
    \ `sellCopy()` 方法。\n\n所以我们可以调用 `p.sellCopy()`，而不必担心 `p` 到底是什么。当我们操作继承层次结构中的对象时，这可以让生活变得简单得多。我们可以创建新类型的\
    \ `Publication`，例如 `Newspaper`，并在 `Newspaper` 上调用 `p.sellCopy()`，而无需在新类中创建任何功能——所有所需的功能已经定义在\
    \ `Publication` 中了。多态性使得扩展我们程序的功能变得容易，正如我们将在第 11 章中看到的那样。\n\n### 4.4 可扩展性\n\n\
    每年投入了巨额资金来创建新的计算机程序，但多年来，花费的更多资金用于更改和调整这些程序以满足组织不断变化的需求。因此，作为专业的软件工程师，我们有责任促进这一点，并帮助使这些程序更容易于维护和适应。当然，应用良好的编程标准、注释和布局等在此也起着作用，但多态性也能提供帮助，因为它允许创建易于扩展的程序。\n\
    \n#### CashTill 类\n\n想象我们想要开发一个 `CashTill` 类来处理正在出售的物品序列。如果没有多态性，我们需要为每种类型的编写单独的方法：\n\
    \n```\nsellBook (Book pBook)\nsellMagazine (Magazine pMagazine)\nsellDiscMag (DiscMag\
    \ pDiscMag)\n```\n\n有了多态性，我们只需要\n\n```\nsellItem (Publication pPub)\n```\n\n每个子类都与其父类是“类型兼容”的。因此，任何子类对象都可以作为\
    \ `Publication` 参数传递。这对于系统的可扩展性也有重要意义。我们之后可以引入 `Publication` 的更多子类，这些子类也将 `CashTill`\
    \ 对象的 `sellItem()` 方法接受，即使在实现 `CashTill` 时这些子类型是未知的。\n\n#### Publications 自销！\n\
    \n如果没有多态性，我们需要检查每个物品 `p`，以确保我们调用了正确的方法来销售该子类型的副本：如果 `p` 是 `Book`，调用 Book 的 `sellCopy()`；否则如果\
    \ `p` 是 `Magazine`，调用 Magazine 的 `sellCopy()`；否则如果 `p` 是 `DiscMag`，调用 DiscMag\
    \ 的 `sellCopy()`。相反，我们信任 Java 虚拟机在运行时查看对象 `p`，以确定其“类型”以及它自己的销售方法。因此，我们可以调用：\n\n\
    `p.sellCopy()`\n\n如果该对象是 `Book`，它将调用 Book 的 `sellCopy()` 方法。如果 `p` 是 `Magazine`，Java\
    \ 在运行时同样会确定这一点并调用 Magazine 的 `sellCopy()` 方法。多态性通常允许我们避免条件 `if ` 语句——相反，“决定”是根据实际存在的哪种类型的子类对象隐含得的。\n\
    \n#### 实现 CashTill\n\n下面的代码展示了如何实现 `CashTill` 以利用多态性。\n\n```\nclass CashTill\n\
    {\n  private double runningTotal;\n\n  CashTill ()\n  {\n    runningTotal = 0;\n\
    \  }\n\n  public void sellItem ( Publication pPub )\n  {\n    runningTotal = runningTotal\
    \ + pPub.getPrice() ;\n    pPub.sellCopy();\n    System.out.println(\"Sold \"\
    \ + pPub + \" @ \" +\n    pPub.getPrice() + \"\\nSubtotal = \" +\n    runningTotal);\n\
    \  }\n\n  public void showTotal()\n  {\n    System.out.println (\"GRAND TOTAL:\
    \ \" + runningTotal);\n  }\n}\n```\n\n`CashTill` 拥有一个实例变量——一个用于运行总额的 `double`。构造函数只是将其初始化为\
    \ 0。\n\n`sellItem()` 方法是 `CashTill` 的核心特性。它接收一个 `Publication` 参数，该参数可能是 `Book`、`Magazine`\
    \ 或 `DiscMag`。首先，使用 `getPrice()` 将出版物的价格加上运行总额。然后，在出版物上调用 `sellCopy()` 操作。\n\n"
