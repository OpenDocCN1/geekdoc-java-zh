    设计的维度模型，以便人们在桥梁实际建成之前就能对完工方案进行可视化。


    • 管理员可能需要一个软件来跟踪个人信息、他们分配了哪些项目、拥有哪些技能以及需要培养哪些技能。


    但是，我们如何从对某些软件的“需求”转向满足这一需求的面向对象的软件设计呢？


    一些软件工程师专门从事 `Requirement Analysis`（需求分析）任务，该任务是准确明确对软件的具体需求。通常这是通过迭代执行以下任务完成的：


    1) 访谈客户和系统的潜在用户，以了解他们对所需系统的描述

    2) 记录这些对话的结果，

    3) 识别所需系统的核心特性

    4) 产出初步设计（可能还有系统的原型）

    5) 与客户和潜在用户一起评估这些初始计划

    6) 重复上述步骤，直到演化出一个完备的设计。


    执行需求分析是一项专业技能，超出了本文的范围，但在这里我们将关注上述的第三和第四步，即：给定一个系统描述，我们如何将其转换为潜在的 OO（面向对象设计）。


    虽然我们希望开发初步设计技能，但经验是这项任务中的一个重要因素。如果我们想让软件运行良好且易于开发，产出简单优雅的设计是非常重要的；然而，从较差的设计中识别出优秀的设计并不简单，经验是关键因素。新手棋手可能知道所有规则，但要学会从坏招中选出好招需要经验，而经验对于成为熟练选手至关重要。同样，经验对于熟练执行用户需求分析和产出良好的设计也至关重要。


    在这里我们将尝试培养基础技能，希望你以后有机会机会练习这些技能并获得经验。


    从问题规范开始，我们将通过以下步骤工作：


    • 列出名词和动词

    • 识别系统范围之外的事物

    • 识别同义词

    • 识别潜在类

    • 识别潜在属性

    • 识别潜在方法

    • 识别共同特征

    • 使用 `CRC Cards` 完善我们的设计

    • 详细化类


    通过这种方法，我们能够获取问题的通用描述，并为系统生成一个可行的、理想优雅的 OO 设计来满足这些需求。


    ## 6.2 问题


    我们将为设计解决方案的问题是：“为一个组织马拉松的体育俱乐部开发一个小型管理系统。”


    为了本次练习，我们假设已经完成了初步需求分析，并通过访谈俱乐部经理和使用该系统的员工，生成了以下文本描述。


    “GetFit”体育俱乐部将在明年春季举办他们的首场国际马拉松。一支由世界排名专业人士和慈善募捐业余人士（有些穿着奇装异服！）组成的队伍将在围绕迷人的沿海地区的
    26.2 英里路线上进行竞争。作为跟踪跑步者并宣布结果和赞助捐款的软件系统的一部分，需要一个代表跑步者关键特征的模型（这只是完工系统的一部分）。


    马拉松中的每位跑步者都有一个编号。跑步者被描述为例如“Runner 42”，其中 `42` 是他们的编号。他们在指定的时刻（以小时、分、秒记录）完成比赛。他们的结果状态可以检查，并将显示为“Not
    finished”或“Finished in hh:mm:ss”。


    每位参赛者要么是专业选手，要么是业余选手。


    除此之外，专业人士还有一个世界排名，描述为例如“Runner 174 (Ranking 17)”。


    所有业余人士都在为慈善募捐，因此每个人额外有一份赞助表。当业余人士完成比赛时，他们会从赞助表上打印一份收集列表。


    赞助表包含赞助者数量、赞助者列表以及金额列表。可以添加赞助者和金额，并打印出显示赞助者、赞助金额和总筹款的列表。奇装异服跑步者是业余人士的一种（带有赞助等），他们还有一套服装，描述为例如“Runner
    316 (Yellow Duck)”。


    ## 6.3 列出名词和动词


    分析上述描述的第一步是识别名词和动词：


    • 名词表示实体或对象，其中一些将作为类出现在最终系统中，另一些将作为属性出现。

    • 动词表示要执行的操作，其中一些将作为方法出现在最终系统中。


    复数形式的名词和动词以单数形式列出（例如 `books` 变为 `book`），当名词或动词单独不足以描述时，使用名词和动词短语，例如动词 `print`
    不如 `print receipt` Clear。


    ### 活动 1

    查看上述描述，列出五个名词和五个动词（在适当的情况下使用名词和动词短语）。


