    它处理的数据项类型。相反，类型在类实例化时指定，因此对于特定对象来说是固定的。


    因此，通过使用“泛型”（generics），我们可以创建只存储指定类型对象的集合。


    ## 7.4 列表 (Lists)


    列表是最常用的集合类型——在您可能使用数组的地方，`List` 通常会提供一种更方便的方法来处理数据。


    列表是非常通用的数据结构，每个项目都占据一个特定的位置。它们在许多方面与数组相似，但它们更灵活，因为它们会随着数据的添加自动调整大小。它们也比数组更易操作，因为人们已经创建了许多实用的方法，可以替你完成大部分工作。`Lists`
    按照特定的顺序存储项目（尽管不一定按任何有意义的顺序排序），并且允许重复项。


    ## 7.5 集合 (Sets)


    集合就像是对象的“袋子”，而不是列表。它们基于数学中“集合”（set）的概念——一组“成员”的组合，其中可以包含零个、一个或多个不同的项目。


    与 `List` 不同，集合中不允许重复项，且 `Set` 不会对项目进行排序（但 `SortedSet` 可以）。


    与列表一样，集合在添加项目时会自动调整大小。


    `List` 中可用的许多操作也适用于 `Set`：

    - 我们**不能**在特定位置添加对象，因为元素没有顺序

    - 出同样的原因，我们**不能**“替换”项目（尽管我们可以添加一个并删除另一个）

    - 获取所有项目是可行的，但序列是不确定的

    - 查找某个元素所处的位置是由于没有意义的。


    ## 7.6 映射 (Maps)


    映射与 `Lists` 和 `Sets` 有很大不同，因为它们存储不是单个对象，而是对象的值对。该值对由一个“键”（key）和一个“值”（value）组成。键是用于标识该值对的标识。值是与键关联的一条信息或对象。


    示例：在地址录中，键是人的名字，值是他们的地址、电话、电子邮件等。每个键只有一个值，但由于值是对象，它们可以包含几条数据。不允许有重复的键，但允许有重复的值。因此，在上一个例子中，如果您在地址录中查找两个人，可能会发现他们住在同一个地址——但一个人不会有两个家。


    和集合一样，`Map` 不会对项目进行排序（但 `SortedMap` 会按键的顺序排序），并且像列表和集合一样，映射在添加或删除项目时会自动调整大小。


    ## 活动 1


    对于以下每个问题，写下哪种最合适：列表（list）、集合（set）或映射（map）。


    1) 我们想记录俱乐部的成员。

    2) 我们想记录我们花费的钱（以及花在了哪里）。

    3) 我们想记录银行账户详情——每个账户由银行账户号码识别。


    ### 反馈 1


    1) 对于此，我们将使用 `Set`。可以根据需要添加和删除成员，且成员之间没有特定的顺序。

    2) 对于此，我们将使用 `List` —— 这将按照购买顺序记录所购买的物品。重要的是，由于列表允许重复项，我们可以购买两个相同的玩具（也许是给两个不同孩子准备的生日礼物）。

    3) 我们不会有两个相同的银行账户，所以 `Set` 似乎是合适的，但由于每个账户都有一个唯一的账户号码标识，`Map` 是最合适的选择。


    ## 7.7 集合实现


    到目前为止，我们一直在查看集合接口——这些是功能的规范，我们可以从中选择我们想要使用的部分。要实际使用它们，我们需要实现这些接口的类。


    这里展示的实现都是 Java 平台库包的一部分，但程序员也可以为了特殊目的编写自己的实现。


    - `ArrayList` 实现了 `List` 接口：对于有序列表，通常访问速度快

    - `LinkedList` 这也实现了 `List` 接口：在某些不常见的情况下，它可能比 `ArrayList` 快

    - `HashSet` 实现了 `Set` 接口：它提供了快速访问，但项目是无序的

    - `TreeSet` 这也实现了 `Set` 接口：比 `HashSet` 慢，但它维护元素的顺序，即它为我们提供了一个 `SortedSet`

    - `HashMap` 实现了 `Map` 接口：它提供了快速访问，但项目是无序的

    - `TreeMap` 这也实现了 `Map` 接口：比 `HashMap` 慢，它按 `Key` 的顺序维护元素，即它为我们提供了一个 `SortedMap`


    你不能创建一个“List 对象”，因为 `List` 是一个接口——但你可以创建一个 `ArrayList` 对象或 `LinkedList` 对象，其中任何一个都将提供
    `List` 接口定义的功能。


    ## 7.8 集合框架概述


    下面的图为我们提供了集合框架的稍微简化的概述。它显示了接口以及实现接口的类。记住，接口内部没有实现，它们只包含公共方法签名，任何实现该接口的类必须履行这些签名。


    图中显示了两种箭头。实线箭头表示继承；例如 `Set` 接口扩展了 `Collection` 接口。虚线箭头表示实现；例如 `HashSet` 类实现了 `Set`
    接口。


    注意 `Map` 不是 `Collection` 的子接口。这是因为，与存储单个对象的 `Lists` 和 `Sets` 不同，`Maps` 存储的是键对象和值对象的配对。我们仍然认为
    `Map` 是集合框架的一部分。


    ## 活动 2


    所有集合接口和实现的文档都可以在在线浏览或下载：`http://java.sun.com/javase/6/docs/api/`


    集合框架的接口和实现类都可以在 `java.util` 包中找到。使用在线 API 文档查找 `ArrayList` 的方法。列出三个你认为最有用的方法。


    ### 反馈 2


    一些明显实用的方法包括：

    - `add()` —— 将元素添加到列表的指定位置

    - `clear()` —— 清空列表

    - `contains()` —— 如果此列表包含指定的对象，则返回 true

    - `get()` —— 返回指定位置的对象，以及 `remove()` —— 从列表中删除对象


    注意这些方法中的一些是重载的，例如 `remove()`，它可以删除删除指定位置的对象，也可以删除指定对象的第一个实例。

