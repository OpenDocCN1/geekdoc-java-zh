    \ and `Magazine` both need to alter `copies`.\n\nThere are two ways we can do\
    \ this…\n\n1) make `copies` `protected` rather than `private` – this makes it\
    \ visible to subclasses, or\n2) create accessor and mutator methods.\n\nFor variables\
    \ we generally prefer to create accessors/mutators rather than compromise encapsulation\
    \ though `protected` may be useful to allow subclasses to use methods (e.g. accessors\
    \ and mutators) which we would not want generally available to other classes.\n\
    \nThus in the superclass `Publication` we define `copies` as a variable private\
    \ but create two methods that can set and access the value `copies`. As these\
    \ accessor methods are public or protected they can be used within a subclass\
    \ when access to `copies` is required. \n\nIn the superclass `Publication` we\
    \ would therefore have…\n\n```java\nprivate int copies;\n\npublic int getCopies\
    \ () {\n    return copies;\n}\n\npublic void setCopies(int pCopies) {\n    copies\
    \ = pCopies;\n}\n```\n\nThese methods allow superclass to control access to private\
    \ instance variables. As currently written they don’t actually impose any restrictions,\
    \ but suppose for example we wanted to make sure `copies` is not set to a negative\
