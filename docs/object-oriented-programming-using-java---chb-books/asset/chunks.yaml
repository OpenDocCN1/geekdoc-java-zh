    Polymorphism


    Because an instance of a subclass is an instance of its superclass we can handle
    subclass objects as if they


    were superclass objects. Furthermore because a superclass guarantees certain operations
    in its subclasses


    we can invoke those operations without caring which subclass the actual object
    is an instance of.


    This characteristic is termed ‘polymorphism’, originally meaning ‘having multiple
    shapes’.


    Thus a Publication comes in various shapes…it could be a Book, Magazine or DiscMag.
    We can invoke


    the sellCopy() method on any of these Publications irrespective of their specific
    details.


    Polymorphism is a fancy name for a common idea. Someone who knows how to drive
    can get into


