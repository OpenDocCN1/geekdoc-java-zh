    Click on the ad to read more


    Object Oriented Programming Using Java


    Creating And Using Exceptions


    If any programmer using this method failed to protect against a NULL return then
    their program could


    crash – potentially in this case losing the bank large sums of money. Of course
    in other applications,


    such as an aircraft control system, a program crash could have life threatening
    results.


    A more secure programming method is required to ensure that that a potential crash
    situation is always


    dealt with!


    Such a mechanism exists – it is a mechanism called ‘exceptions’.


    By using this mechanism we can ensure that other programmers who use our code
    will be alerted to


    potential crash situations and the compiler will ensure that these programmers
    deal with the ‘issue’.


    Thus we can ensure that no such situation is ‘forgotten’. How they are dealt with
    remains a choice with a


    programmer who uses our methods but the compiler will ensure that they at least
    recognise a potential


    crash situation.


    In the situation above rather than return a NULL value the getClient() method
    should generate an


    exception. By generating an exception the Java compiler will ensure that this
    situation is dealt with.


    9.2


    Kinds of Exception


    In order to generate meaningful exceptions we need to extend the Exception classes
    built into the Java


    language – there are two of these (normal exceptions and run time exceptions).


    Subclasses of java.lang.Exception are used for anticipated problems which need
    to be managed. They


    must be declared in the originating method’s throws clause and a call to method
    must be placed in try /


    catch block.


    Subclasses of java.lang.RuntimeException are used for situations which lead to
    runtime failure and where


    it may not be possible to take any sensible remedial actions. They do not need
    to be declared in throws


    clause and a call need not be in try / catch block (but can be).


    Thus we have the choice as to whether the Java compiler should force us to explicitly
    deal with a particular


    kind of exception.


    Exception subclasses are appropriate for things which we know might go wrong and
    where we can take


    sensible recovery action – e.g. IO errors.


    RuntimeException subclasses are appropriate for things which should not happen
    at all and where there


    is probably nothing we can do to recover the situation, e.g. an out of memory
    error or discovering that


    the system is in an inconsistent state which should never be able to arise.


