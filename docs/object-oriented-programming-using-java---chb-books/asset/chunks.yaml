    `JRE` 将使用第一个方法。


    ### 活动 1


    想象一个可以作为银行系统一部分的方法 `withdrawCash()`。该方法可以接受两个参数：账户标识（一个 `String`）和用户所需的现金金额（`int`）。因此，完整的方法签名将是：


    `withdrawCash(String pAccountID, int pAmount)`。


    识别 `withdrawCash()` 方法的另一种变体，它接受不同的参数列表，并且可能是上述方法的用用变体。


    ### 反馈 1


    另一种用于提取现金的替代方法可以是 `withdrawCash(String pAccountID)`，其中没有指定金额，但默认提取 100 英镑。


    这些方法本质上执行相同的操作，但通过重载此方法，我们使系统更加灵活——用户现在有了选择，他们可以指定要提取的现金金额，也可以接受指定的默认金额。


    方法重载不仅为用户提供了更多灵活性，还为未来可能负责扩展系统的程序员提供了更多灵活性，因此，重载方法可以使系统更具未来前瞻性，并对变化的需求更具健壮性。


    构造函数也可以像普通方法一样被重载。


    ### 活动 2


    在线查看 Java 标准版 API 文档，方法如下：1) 访问 `java.sun.com/javase` 2) 跟点击 API 链接 3) 选择最新版本的
    `Core API` 文档链接。


    在编写本文时，这应该带你进入 `http://java.sun.com/javase/6/docs/api/`


    在左下角的面板中，你应该能看到 Java 程序员可用的所有类列表。向下滚动此列表，直到找到 `String` 类。如果先在左上窗口中选择 `Java.lang`
    包（因为 `String` 类就在这个包中），这样会更快。


    查看主面板中的 `String` 类文档，并找出该类存在多少个构造函数。


    ### 反馈 2


    `String` 类指定了 15 个不同的构造函数。它们显然具有相同的方法名 `String`，但它们可以通过这些方法所需的不同参数来区分。


    其中一个构造函数不接受任何参数，并创建一个空 `String` 对象。另一个需要一个 `String` 作为参数，并创建一个原始字符串副本的新 `String`
    对象。


    通过大量重载 `String` 构造函数，该类的创建者为未来可能想要使用这些不同选项的其他程序员提供了灵活性。


    我们可以通过重载构造函数和其他方法使我们的程序更具适应性。即使我们最初没有使用所有不同的构造函数或方法，通过提供它们，我们正在使我们的程序更加灵活，并适应以满足变化的需求。


    ### 活动 3


    继续查看 API 文档中的 `String` 类，寻找其他被重载的方法。


    ### 反馈 3


    有很多方法没有重载，但也有许多是重载的。这些包括：`format()`、`indexOf()`、`replace()`、`split()`、`subString()`
    和 `valueOf()`。


    查看不同的 `subString` 方法，我们发现可以通过仅指定起始点或通过指定起始和结束点来找到子字符串。


    当我们使用 `subString()` 方法时，`JRE` 将根据我们是否提供了一个两个参数在运行时选择该方法的正确实现。


    ## 5.3 总结


    方法重载是这种概念的名称，即可能存在几个本质上执行相同操作并具有相同名称的方法。`JRE` 通过查看参数列表区分它们。如果两个或多个方法具有相同的名称，那么它们的参数列表必须不同。


    在运行时，每个可能产生歧义的方法调用都由 `JRE` 通过查看传递的参数并与类定义的方法签名匹配数据类型来解决。


    通过重载构造函数和普通方法，我们为可能使用我们类的程序员提供了额外的灵活性。即使最初没有使用所有这些内容，提供它们也可以帮助程序更灵活地适应变化的需求。


    ## 6 面向对象的分析与设计


    ### 引言


    本章通过实际示例教授基础分析和建模技能。引导读者理解如何从初步规范获得面向对象的架构。


    ### 目标


    在本章结束时，你将能够：


    - 分析需求描述

    - 识别系统范围之外的项目

    - 识别候选类、属性和方法

    - 记录生成的面向对象架构


    本章由十二部分组成：


    1) 需求分析

    2) 问题描述

    3) 列出名词和动词

    4) 识别系统范围之外的事

    5) 识别同义词

    6) 识别潜在类

    7) 识别潜在属性

    8) 识别潜在方法

    9) 识别共同特征

    10) 使用 CRC 卡细化我们的设计

    11) 详细说明类

    12) 总结


    ### 6.1 需求分析


    任何程序的开发都从识别需求开始：


    • 一个专职设计桥梁的工程师可能需要一些软件来创建三

