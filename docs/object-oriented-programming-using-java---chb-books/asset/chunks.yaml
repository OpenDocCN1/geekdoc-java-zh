  trans: "\n通过阅读这段描述，我们可以看到第一段纯粹是背景介绍，没有描述任何与所需软件相关的内容。因此，这部分被忽略了。\n\n# 使用 Java 进行面向对象编程：案例研究\n\
    \n## 名词列表\n从剩余段落中，我们可以列出以下名词或名词短语：\n\n- `LCD 信息显示板`\n- `店面`\n- `滚动文本消息`\n- `客户端\
    \ ID`\n- `姓名`\n- `地址`\n- `电话号码`\n- `余额`\n- `余额单位`\n- `消息天数`\n- `客户簿`\n- `ID `\n\
    - `天数`\n- `消息费用（单位）`\n- `当前消息集`\n- `消息集`\n- `显示板`\n- `剩余天数`\n- `客户余额`\n- `消息费用`\n\
    - `软件连接`\n- `接口`\n- `虚拟显示板`\n\n## 动词列表\n以及以下动词：\n\n- `获取`\n- `安装`\n- `显示`\n- `广告`\n\
    - `赋予（一个唯一的 ID）`\n- `展示`\n- `添加（一个客户端）`\n- `查找`\n- `缓解（重复项——不是！）`\n- `清理`\n- `递减`\n\
    - `减少余额`\n- `过期`\n- `删除`\n- `编写（软件）`\n- `安装`\n- `实现`\n- `测试`\n\n## 系统范围之外\n通过识别系统范围之外的内容，我们可以简化问题……\n\
    \n- **名词：**\n  - `店面`\n  - `软件`\n- **动词：**\n  - `获取`、`安装（显示板）`\n  - `广告`\n  -\
    \ `赋予（一个唯一的 ID）`\n  - `编写`、`安装`、`实现`、`测试（软件）`\n\n`店面`不是系统的一部分，获取和安装`显示板`也不是系统的一部分。`ID`\
    \ 由店主分配——而不是系统分配。编写/安装`软件` 是程序员的工作——它本身不是系统的一部分。\n\n## 同义词\n以下是同义词：\n\n- **名词：**\n\
    \  - `LCD 信息显示板` = `显示板`\n-- `滚动文本消息` = `消息`\n  - `ID 字符串` = `ID`\n  - `余额单位`\
    \ = `客户余额` = `余额`\n  - `当前消息集` = `消息集`\n  - `天数` = `天数` = `剩余天数`\n- **动词：**\n\
    \  - `显示` = `展示`\n\n通过识别同义词，我们可以避免系统内部不必要的重复和混淆。\n\n## 潜在类、属性和方法\n描述重要实体的名词（我们可以为这些实体识别属性，即数据，以及行为，即方法）可以成为系统中的类。这些包括：\n\
    \n- `Client`（客户端）\n- `Message`（消息）\n- `ClientBook`（客户簿）\n- `MessageSet`（消息集）\n\
    - `DisplayBoard`（显示板）\n- `DummyDisplayBoard`（虚拟显示板）\n\n某些名词作为类的属性比作为类类更好：\n\n\
    - 对于 `client`：\n  - `ID`\n  - `name`\n  - `address`\n  - `phone number`\n  - `credit`\n\
    - 对于 `message`：\n  - `text`\n  - `days remaining`\n  - `cost of message`\n\n这些每一项都可以被建模为一个类（`Client`\
    \ 或 `Message` 将其作为对象属性拥有），但我们认为每一项都是足够简单的信息，没有必要这样做——每一项都可以作为基本类型（例如 `int`）或库类（例如\
    \ `String`）的简单属性（实例变量）。\n\n这是一种设计判断——为重要的实体（`Client`、`Message` 等）引入类，它们拥有属于自己的一组信息和行为，但不会用极其简单的类来过度设计设计（例如\
    \ `credit`，它只包含一个 `int` 实例变量以及一个 getter 和 setter！）。\n\n动词描述候选的方法，我们应该能够识别这些方法可能所属的类。例如：\n\
    \n- 对于 `client`：\n  - `decrease credit`\n- 对于 `message`：\n  - `decrement days`\n\
    \n描述潜在方法的其他动词也应该列出：\n\n- `display`\n- `add (将客户端添加到客户簿)`\n- `add (将消息添加到集合)`\n\
    - `lookUp (在客户簿中查找客户端)`\n- `purge`\n- `decrement`\n- `expire`\n- `delete`\n\n\
    对于这些每项，都应该识别相关的类。\n\n## 共同特征\n我们初步分析的最后一步是识别类的共同特征，并识别这些类应该通过继承层次结构链接，还是通过接口链接。\n\
    \n通过查看提供的候选类列表，我们可以看到两个类具有共同特征：\n\n- `DisplayBoard`\n- `DummyDisplayBoard`\n\n\
    这意味着这些类在系统内部通过继承层次结构或通过“接口”链接（见第 4.5 节接口）。在这种情况下，线索就在描述中：“这些与系统的其余部分‘连接’。”\n\n\
    ## 进一步分析\n我们现在可以使用 UML 图来记录此设计并相应编写系统。但在之前，最好找到我们设计中的任何潜在缺陷，因为现在修复这些缺陷比花费时间开发系统后再修复要快。\n\
    \n因此，我们现在应该使用 CRC 卡完善我们的设计并详细说明我们的类。CRC 卡（参见第 6 章第 6.10 和 6.11 节）允许我们扮演各种场景，以检查我们的设计是否可行，以便在完善这些设计并使用\
    \ UML 类图进行记录之前进行可行性检查。\n"
