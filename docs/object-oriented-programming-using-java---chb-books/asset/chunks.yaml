    本期期间（例如“2009 年 1 月”、“1 月 6 周五”、“2009 年春季”等）。当接收到 `newIssue` 时，旧的会被丢弃，`orderQty`
    副本会被放入库存。因此，`recvNewIssue()` 将 `currIssue` 设置为新发行日的日期，并将副本恢复到 `orderQty`。`adjustQty()`
    则修改 `orderQty` 以更改后续发行版本的库存副本数量。


    ## 活动 1


    查看上方定义的 `Book` 和 `Magazine` 类，并识别这两个类之间的共同点和差异。


    ## 反馈 1


    这些类有三个共同实例变量：`title`、`price`、`copies`。它们共同拥有方法 `sellCopy()`。


    差异如下……


    `Book` 额外拥有 `author` 和 `orderCopies()`。`Magazine` 额外拥有 `orderQty`、`currIssue`、`adjustQty()`
    和 `recvNewIssue()`。


    我们可以将这些类的共同成员提取（“重构”）到一个名为 `Publication` 的超类中。


    ## 继承与方法重写


    差异需要作为额外成员指定给“子类” `Book` 和 `Magazine`。


    这是一个 UML 类图。


    空心中心箭头表示继承。


    注意，子类具有泛化的超类特征 + 额外的特化特征。


    因此，`Book` 类有四个实例变量（`title`、`price`、`copies` 和 `author`），它还有两个方法（`sellCopy()` 和
    `orderCopies()`）。


    继承的特征**不会**列在子类中。箭头显示它们是从超类获取的。


    ## 活动 2


    将下列类安排为合适的层次结构，并在类图中画出它们……


    - 一个活期账户

    - 一个存款账户

    - 一个银行账户

    - Simon 的存款账户


    ## 反馈 2


    银行账户

    活期账户

    存款账户


    最通用的类位于继承层次结构的顶部，其他类随后继承该类的属性和方法。


    `Simon 的存款账户` 不应该显示在类图中，因为它是类的特定实例，即它是一个对象。


    ## 活动 3


    将下列类安排为合适的层次结构，并在类图中画出它们……


    - 一栋建筑

    - 一栋房子

    - 一辆汽车


    ## 反馈 3


    建筑

    房子

    汽车


    `house` 是 `building` 的一种，因此可以继承 `building` 的属性，但这对于 `car` 则不是。除非我们可以使用“是一个”（is
    a）这个术语，否则无法将两个类放在继承层次结构中。注意类名一如既往以大写字母开头。


    ## 活动 4


    使用合适的类图描述以下内容，并显示任何合理的的关系……


    - 一栋待租的建筑：这将有一个确定租金的方法

    - 一栋待租的房子：它将继承 `determine rent` 方法

    - 一个收租员（人）：此人将使用 `determine rent` 方法来打印账单


    提示：你可能希望使用以下箭头


    ## 反馈 4


    建筑

    determineRent()

    收租员

    房子

    printBill()


    注意：`RentCollector` 并没有继承自 `Building`，因为 `RentCollector` 是人，而不是 `Building` 的一种。然而，`RentCollector`
    和 `Building` 之间存在关系（关联），即 `RentCollector` 需要确定 `Building` 的租金以便打印账单。


    ## 活动 5


    查看活动 4 的反馈，并判断 `RentCollector` 是否可以打印房屋的期租金账单（或者他们只能打印建筑的账单？）。


    ## 反馈 5


    首先，为了打印账单，`RentCollector` 需要知道到期租金。房子没有定义 `determineRent()` 方法——但这并不意味着它不存在。


    由于 `House` 继承了 `Building` 的属性，它必须存在！


    我们只有在方法是额外方法或被重写的方法时才在子类中显示它们。


    收租员需要建筑，而 `House` 是 `Building` 的一种。所以，虽然 `RentCollector` 和 `House` 之间没有显示关联，但收租员可以打印房屋的账单。在任何需要
    `Building` 对象的地方，我们都可以用 `House` 对象代替，因为它是 `Building` 的一种。这是多态的一个例子，我们将在第 4 章看到其他例子。


    ## 活动 6


    修改此 UML 图，显示 `determineRent()` 在 `House` 中被重写。


    ## 反馈 6


    通过在 `House` 中显示 `determineRent()`，我们是在展示该方法正在重写超类（`Building`）中定义的方法。


    有趣的是，Java 将根据调用方法的对象类型使用最正确的 `determineRent()` 方法。因此，如果为房屋打印账单，`RentCollector`
    将调用在 `House` 中定义的方法，但对任何其他类型将使用在 `Building` 中定义的方法。这是自动的——`RentCollector` 中的代码不区分不同的
    `Building` 类型。重写将在本章稍后详细讨论。


    ## 3.4 在 Java 中实现继承


    创建超类不需要特殊功能。因此，除非被专门阻止，任何类都可以成为超类。子类使用 `extends` 关键字来指定它正在继承超类的特征。例如……


    ```

    class MySubclass extends MySuperclass

    {

    // 额外的实例变量和

    // 额外的方法

    }

    ```


    ## 3.5 构造函数


    每个类（无论是子类还是超类）应该封装自己的初始化，通常涉及设置实例变量的初始状态。超类的构造函数应该处理通用初始化。


    每个子类可以有自己的构造函数进行特化初始化，但它通常必须调用超类构造函数的行为。它使用 `super` 关键字来实现。


    ```

    class MySubClass extends MySuperClass

    {

    public MySubClass (sub-parameters)

    {

    super(super-parameters);

    // 其他初始化

    }

    }

    ```


    如果调用了 `super`（即超类构造函数），那么它必须是构造函数的第一个语句。通常传递给 `MySubClass` 的某些参数将是超类实例变量的初始化值，这些值将作为参数传递给超类构造函数。换句话说，`super-parameters`
    是 `sub-parameters` 的部分（或全部）。


    ```

    public Publication (String pTitle, double pPrice, int pCopies)

    {

    title = pTitle;

    // 等等

    }


    public Book (String pTitle, String pAuthor, double pPrice,

    int pCopies)

    {

    super(pTitle, pPrice, pCopies);

    author = pAuthor;

