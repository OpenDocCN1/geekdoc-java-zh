    \ Rolls, Potatoes, Floor cleaner. Matches, Grapes.\n\n### Feedback 5\n\nTo make\
    \ your shopping efficient you probably organised your list into two lists of items\
    \ that are located in the same parts of the shop:\n\n**List 1**: Apples, Pears,\
    \ Grapes, Carrots, Potatoes\n**List 2**: Furniture polish, Floor cleaner, Matches,\
    \ Toilet Rolls.\n\n### Activity 6\n\nYou run a team of three programmers and are\
    \ required to write a program in Java to monitor and control a network system.\
    \ The system will be made up of seven classes as described below. Organise these\
    \ classes into three packages. Each programmer will then be responsible for the\
    \ code in one package. Give the packages any name you feel appropriate.\n\n- `MainMonitor`:\
    \ this class starts the system\n- `InterfaceReconfigure`: this class monitors\
