    ## 1.5 What Exactly is Object Oriented Programming?


    ### Activity 8

    Think of an object you possess. Describe its current state and list two or three
    things you can do with that object.


    ### Feedback 8

    You probably thought about an entirely physical object such as a watch, a pen,
    or a car.


    Objects have a current status. A watch has a time (represented internally by wheels
    and cogs orin an electronic component). A pen has a certain amount of ink in it
    and has its lid on or off. Acar has a current speed and has a certain amount of
    fuel inside it.


    Specific behaviour can also be associated with each object (things that you can
    do with it): a watch can be checked to find out its time, its time can also be
    set. A pen can be used to write with and a car can be driven.


    You can also think of other non physical things as objects: such as a bank account.
    A bank account is not something that can be physically touched but intellectually
    we can consider a bank account to be an object. It also has a current status (the
    amount of money in it) and it also has behaviour associated with it (most obviously
    deposit money and withdraw money).


    Object oriented programming it a method of programming that involves the creation
    of intellectuals objects that model a business problem we are trying to solve
    (e.g. a bank account, a bank customer and a bank manager – could all be objects
    in a computerised banking system). With each object we model that data associated
    with it (i.e. it status at any particular point in time) and the behaviour associated
    with it (what our computer program should allow that object to do).


    In creating a object oriented program we define the properties of a class of objects
    (e.g. all bank accounts) and then create individual objects from this class (e.g.
    your bank account).


    ## Class

    A ‘class’ is a software design which describes the general properties of something
    which the software is modelling.


    ![Wondershare](images/bg02100001.jpg)


    ### Individual ‘objects’ are created from the class design for each actual thing

    Object 1

    Object 2

    Object 3


    However deciding just what classes we should create in our system is not a trivial
    task as the real world is complex and messy (see chapter 6 for more advice on
    how to go about this). In essence we need to create an abstract model of the real
    world that focuses on the essential aspects of a problem and ignores irrelevant
    complexities. For example in the real world bank account holders sometimes need
    to borrow money and occasionally their money may get stolen by a pick pocket.
    If we were to create a bank account system should we allow customers to borrow
    money? Should we acknowledge that their cash may get stolen and build in some
    method of them getting an immediate loan – or is this an irrelevant detail that
    would just add complexity to the system and provide no real benefit to the bank?


    Using object oriented analysis and design techniques our job would be to look
    at the real world and come up with a simplified abstract model that we could turn
    into a computer system. How good our final system is will depend upon how good
    our software model is.


    ![Wondershare](images/bg02100002.jpg)![Wondershare](images/bg02100003.jpg)


    ### Activity 9

    Consider a computer system that will allow items to be reserved from a library.
    Imagine one such item that you may like to reserve and list two or three things
    that a librarian may want to know about this item.


    ### Feedback 9

    You may have thought of a book you wish to reserve in which case the librarian
    may need to know the title of the book and its author.


    Thus for every object we create in a system we need to define the attributes of
    that object i.e. the things we need to know about it.


    ### Activity 10

    Note that we can consider a reservation to be is an intellectual object (where
    the actual item is a physical object). Considering this intellectual object (item
    reservation) list two or three actions the librarian may need to perform on this
    object.


    ### Feedback 10

    The librarian may need to cancel this reservation (if you change your mind) they
    may also need to tell you if the item has arrived in stock for you to collect.


    Thus for each object we need to define the operations that will be performed on
    that object (as well as its attributes).


    ### Activity 11

    Considering the most general category of object that can be borrowed from a library,
    a ‘loan item’, list two or three more specific subcategory of object a library
    can lend out.


    ### Feedback 11

    Having defined the most general category of object (we call this a class) – something
    that can be borrowed – we may want to define more specialised sub-classes (e.g.
    books, magazines, audio/visual material). These will share the attributes defined
    for the general class but will have specific differences (for example there could
    be a charge for borrowing audio/visual items).


    ## 1.6 The Benefits of the Object Oriented Approach

    Whether or not you develop programs in an oriented way, before you write the software
    you must first develop a model of what that software must be able to do and how
    it should work. Object oriented modelling is based on the ideas of abstraction,
    encapsulation, inheritance and polymorphism. The general proponents of the oriented
    approach claims that this model provides:

    - better abstractions (modelling information and behaviour together)

    - better maintainability (more comprehensible, less fragile)

    - better reusability (classes as encapsulated components)


    We will return to look at these claims later in Chapter 11 as we see a case study
    showing in detail how object oriented analysis works and how the resultant models
    can be implemented in an object oriented programming language (i.e. `Java`).


    ## 1.7 Summary

    Object oriented programming involves the creation of classes by modelling the
    real world. This allows more specialised classes to be created that inherit the
    behaviour of the generalised classes. Polymorphic behaviour means that systems
    can be changed, as business needs change, by adding new specialised classes and
    these classes can be accessed by the rest of the system without any regard to
    their specialised behaviour and without changing other parts of the current system.


    ## 2 The Unified Modelling Language (UML)

    ### Introduction

    This chapter will introduce you to the roles of the Unified Modelling Language
    (UML) and explain the purpose of four of the most common diagrams (class diagrams,
    object diagrams, sequence diagrams and package diagrams). Particular emphasis
    will be placed on class diagrams as these are the most used part of the UML notation.


    ### Objectives

    By the end of this chapter you will be able to

    • Explain what UML is and explain the role of four of the most common diagrams,

