- fmt: "\ntesting facilities such as those that exist within Java.\n\n# 10.8 JUnit\n\
    \nJUnit is a very widely used unit testing framework for Java. It has been developed\
    \ as a suite of open-source classes, and is integrated into popular Java IDEs\
    \ such as Eclipse and NetBeans.\n\nWhile `JUnit` provides an automated testing\
    \ framework we still need to set up the test cases – however once these have been\
    \ set up a thousand test cases can be run at the push of a button – and the same\
    \ set of test cases can be re-run every time a program is amended.\n\n`JUnit`\
    \ test classes are constructed as subclasses of `junit.framework.TestCase`. The\
    \ correct behaviour of code being tested is checked using `assert…()` methods\
    \ which must be true for the test to pass.\n\nCurrently version 3.8 and version\
    \ 4 of `JUnit` are widely used but there are significant differences between them.\
    \ Here we are using the more widely established `Junit 3.8`.\n\n# 10.9 Examples\
    \ of Assertions\n\nWhen setting up test cases we make assertions. An assertion\
    \ is a statement which should be true if the code has functioned correctly. Example\
    \ of assertion include…\n\n- `assertTrue(…)`\n- `assertFalse(…)`\n- `assertEquals(…)`\n\
    - `assertNotEquals(…)`\n- `assertNull(…)`\n- `assertNotNull(…)`\n- `fail()`\n\n\
    `assertEquals()` and `fail()` will be adequate for many testing purposes, as we\
    \ will see here. `fail()` indicates that having reached this line means the test\
    \ has failed! (We will see an example).\n\n# 10.10 Several Test Examples\n\nTo\
    \ illustrate the `JUnit` testing framework we will create three test cases to\
    \ test the functionality of a `BankManagment` system as represented below:-\n\n\
    In this system a `BankManager` class maintains a ‘map’ of clients. `Client` objects\
    \ can be added by the `addClient()` method which requires an ID for that client\
    \ and the client object to be added. Clients can be retrieved via the `getClient()`\
    \ method which requires a `ClientID` as a parameter and returns a client object\
    \ (if one exists) or generates an exception (if a client with the specified ID\
    \ does not exist).\n\nThe `Client` class has a constructor that requires the name\
    \ of the client and the clients address and provides associated accessor methods.\n\
    \nWe will specifically test the ability to…\n\n- Add a client to the `BookofClients`\n\
    - Trying to lookup a non-existent client\n- The string representation yielded\
    \ by the `toString()` method of the `Client` class.\n\nThis is of course only\
    \ a small fraction of the test cases which would be needed to thoroughly demonstrate\
    \ the correct operation of all classes and all methods within the system.\n\n\
    ## Testing adding a client\n\nTo test a client can be added we need to create\
    \ a `JUnit` test case that:\n\n1) Creates a new empty `BookofClients`\n2) Creates\
    \ a new client and adds this to the `BookofClients`\n3) Try’s to retrieve a client\
    \ with the same ID as the client just added (this of course should work) and finally\n\
    4) We need to test that the client retrieved has the same attributes as the client\
    \ we just added – to ensure it was not corrupted.\n\nThe code for this is given\
    \ below…\n\n```java\npublic void testAddClient() {\n    BookofClients bofc = new\
    \ BookofClients();\n    Client c = new Client(\"Simon\",\"No 5, Main St., Sunderland,\
    \ SR1 0DD\");\n    Client c2 = null;\n    bofc.addClient(\"SK001\", c);\n    try\
    \ {\n        c2 = bofc.getClient(\"SK001\");\n    } catch (UnknownClientException\
    \ uce) {\n        fail();\n    }\n    assertEquals(\" Simon \" , c2.getName());\n\
    \    assertEquals(\" No 5, Main St., Sunderland, SR1 0DD \" ,c2.getAddress());\n\
    }\n```\n\nNote that a test method name always begins `test…()`.\n\nIf an `UnknownClientException`\
    \ is thrown the test fails because we should have found the “SK001” client which\
    \ was added.\n\nIf we successfully retrieve the client we assert that the value\
    \ from `getName()` should equal “Simon” and the value from `getAddress()` should\
    \ equal “No 5, Main St., Sunderland, SR1 0DD”. If either of these is not the case\
    \ then the test will fail.\n\nNote that the two parameters of the `assertEquals()`\
    \ method are first the expected value and second the actual value. Although the\
    \ outcome of the assertion will be the same if these are reversed, it will result\
    \ in `JUnit` giving misleading reports if the test fails.\n\nIf the test method\
    \ ends without failing any assertions then the test is passed.\n\nNote that for\
    \ this test to work we need accessor methods `getName()` and `getAddress()` in\
    \ the `Client` class. It is common practice in designing classes to create accessor\
    \ methods which were intended purely to support unit testing even when these are\
    \ not required in the actual system.\n\n## Testing for Unknown client\n\nOne test\
    \ case we need to perform is to test that an exception is thrown if we try to\
    \ retrieve a client that does not exist. To test this we create an new empty `BookofClients`\
    \ and try to retrieve a client from this – The code for this is given below…\n\
    \n```java\npublic void testGetClient() {\n    BookofClients bofc = new BookofClients();\n\
    \    try {\n        bofc.getClient(\"SK001\");\n        fail();\n    } catch (UnknownClientException\
    \ uce) {\n}\n```\n\nIn this case we expect an `UnknownClientException` to be thrown\
    \ (as we haven’t added the client!) and therefore if the line after `getClient()`\
    \ is reached the test fails. If the exception is caught the `catch` block has\
    \ no action to take and the test then completes.\n\n## Testing the toString()\
    \ method\n\nOne way of implicitly testing that ALL the attributes have been stored\
    \ correctly is to test the `toString()` method returns the value expected. This\
    \ is a little tricky because the format of the string must match exactly including\
    \ every space, and newline.\n\nThe alternative however is to test the value returned\
    \ by every accessor method.\n\n### Activity 1\n\nAssuming the `toString()` method\
    \ of the `Client` class is defined below create a test method to test the value\
    \ returned by the `toString()` method is as expected.\n\n```java\npublic String\
    \ toString() {\n    return (\"Client name: \" + mName + \"\\nAddress: \" + mAddress);\n\
    }\n```\nHint: Firstly create a new `Client` object with specified attributes then\
    \ test the attributes of this object are expected by using an assertion to test\
    \ the string returned.\n\n### Feedback 1\n\nOne solution to this exercise is given\
    \ below however clearly the attributes of the client created are arbitrary.\n\n\
    ```java\npublic void testClientToString() {\n    Client c = new Client(\"Simon\"\
    , \"5 Main St., Sunderland\");\n    assertEquals(\" Client name: Simon\\nAddress:\
    \ 5 Main St.,Sunderland \" , c.toString()\n);\n}\n```\nHere we assert that the\
    \ string returned from `c.toString()` is equal to the string we are expecting.\n\
    \n# 10.11 Running Tests\n\nHaving designed a batch of test cases we need to set\
    \ these up so that they can be run as often as required at the push of a button.\n\
    \nTo do this in Eclipse we\n- create new package `tests`\n- in `tests` create\
    \ new `JUnit` test case `ClientTests`\n- add in the three test methods\n- Run\
    \ As… `JUnit test`\n- edit code to cause one of the tests to fail and observe\
    \ result\n"
