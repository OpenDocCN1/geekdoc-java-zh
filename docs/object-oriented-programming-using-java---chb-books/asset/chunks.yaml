    \n## 2. An Introduction to UML\n\n### 2.1 An Introduction to UML \n\nThe Unified\
    \ Modelling Language, `UML`, is sometimes described as though it was a methodology.\
    \ It is not!\n\nA methodology is a system of processes in order to achieve a particular\
    \ outcome e.g. an organised sequence of activities in order to gather user requirements.\
    \ `UML` on the other hand a precise diagramming notation that will allow program\
    \ designs to be represented and discussed. As it is graphical in nature it becomes\
    \ easy to visualise, understand and discuss the information presented in the diagram.\
    \ However as the diagrams represent technical information they must be precise\
    \ and clear – in order for them to work therefore there is a precise notation\
    \ that must be followed.\n\n### The Unified Modelling Language (UML)\n\nAs `UML`\
    \ is not a methodology it is left to the user to follow whatever processes they\
    \ deem appropriate in order to generate the designs described by the diagrams.\
    \ `UML` does not constrain this – it merely allows those designs to be expressed\
    \ in an easy to use, but precise, graphical notation.\n\n## 2.2 UML Class diagrams\n\
    \n### `UML` Class diagrams\n\nClasses are the basic components of any object oriented\
