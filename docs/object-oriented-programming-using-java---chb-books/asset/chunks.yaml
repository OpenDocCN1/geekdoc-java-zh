    • A manager may need a piece of software to keep track of personal, what projects
    they are assigned to, what skills they have and what skills needs to be developed.


    But how do we get from a ‘need’ for some software to an object oriented software
    design that will meet this need?


    Some software engineers specialise in the task of `Requirement Analysis` which
    is the task of clarifying exactly what is required of the software. Often this
    is done by iteratively performing the following tasks:-


    1) interviewing clients and potential user of the system to find out what they
    say about the system needed

    2) documenting the results of these conversations,

    3) identifying the essential features of the required system

    4) producing preliminary designs (and possibly prototypes of the system)

    5) evaluating these initial plans with the client and potential users

    6) repeating the steps above until a finished design has evolved.


    Performing requirements analysis is a specialised skill that is outside the scope
    of this text but here we will focus on steps three and four above ie. given a
    description of a system how do we convert this into a potential OO design.


    While we can hope to develop preliminary design skills experience is a significant
    factor in this task. Producing simple and elegant designs is important if we want
    the software to work well and be easy to develop however identifying good designs
    from weaker designs is not simple and experience is a key factor. A novice chess
    player may know all the rules but it takes experience to learn how to choose good
    moves from bad moves and experience is essential to becoming a skilled player.
    Similarly experience is essential to becoming skilled at performing user requirements
    analysis and in producing good designs.


    Here we will attempt to develop rudimentary skills in the hope that you will have
    the opportunity to practise those skills and gain experience later.


    Starting with a problem specification we will work through the following steps:-


    • Listing Nouns and Verbs

    • Identifying Things Outside The Scope of The System

    • Identifying Synonyms

    • Identifying Potential Classes

    • Identifying Potential Attributes

    • Identifying Potential Methods

    • Identifying Common Characteristics

    • Refining Our Design using `CRC Cards`

    • Elaborating Classes


    By doing this we will be able to take a general description of a problem and generate
    a feasible, and hopefully elegant, OO design for a system to meet these needs.


    ## 6.2 The Problem


    The problem for which we will design a solution is ‘To develop a small management
    system for an athletic club organising a marathon.’


    For the purpose of this exercise we will assume preliminary requirements analysis
    has been performed and by interviewing the club managers, and the workers who
    would use the system, the following textual description has been generated.


    The ‘GetFit’ Athletic Club are organizing their first international marathon in
    the spring of next year. A field comprising both world-ranking professionals and
    charity fund-raising amateurs (some in fancy dress!) will compete on the 26.2
    mile route around an attractive coastal location. As part of the software system
    which will track runners and announce the results and sponsorship donations, a
    model is required which represents the key characteristics of the runners (this
    will be just part of the finished system).


    Each runner in the marathon has a number. A runner is described as e.g. “Runner
    42” where `42` is their number. They finish the race at a specified time recorded
    in hours, minutes and seconds. Their result status can be checked and will be
    displayed as either “Not finished” or “Finished in hh:mm:ss”.


    Every competitor is either a professional runner or an amateur runner.


    Further to the above, a professional additionally has a world ranking and is described
    as e.g. “Runner 174 (Ranking 17)”.


    All amateurs are fundraising for a charity so each additionally has a sponsorship
    form. When an amateur finishes the race they print a collection list from their
    sponsorship form.


    A sponsorship form has the number of sponsors, a list of the sponsors, and a list
    of amounts. A sponsor and amount can be added, and a list can be printed showing
    the sponsors and sponsorship amounts and the total raised. A fancy dress runner
    is a kind of amateur (with sponsorship etc.) who also has a costume, and is described
    as e.g. “Runner 316 (Yellow Duck)”.


    ## 6.3 Listing Nouns and Verbs


    The first step in analysing the description above is to identify the nouns and
    verbs:-


    • The nouns indicate entities, or objects, some of these will appear as classes
    in the final system and some will appear as attributes.

    • The verbs indicate actions to be performed some of these will appear in the
    final system as methods.


    Nouns and verbs that are plurals are listed in their singular form (e.g. `books`
    becomes `book`) and noun and verb phrases are used where the nouns\verb alone
    are not descriptive enough e.g. the verb `print` is not as clear as `print receipt`.


    ### Activity 1

    Look at the description above list five nouns and five verbs (use noun and verb
    phrases where appropriate).


