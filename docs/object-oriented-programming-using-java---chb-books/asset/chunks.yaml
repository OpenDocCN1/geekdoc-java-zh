    The architecture of a system and object diagrams describe the state of a system
    at one moment in time.


    However, sequence diagrams describe how the system works over a period of time.
    Sequence diagrams are ‘dynamic’ rather than ‘static’ representations of the system.
    They show the sequence of method invocations within and between objects over a
    period of time. They are useful for understanding how objects collaborate in a
    particular scenario.


    See the example below:-


    ![Wondershare](images/bg04800002.jpg)![Wondershare](images/bg04800003.jpg)


    # The Unified Modelling Language (UML)


    We have three objects in this scenario. Time runs from top to bottom, and the
    vertical dashed lines (lifelines) indicate the objects’ continued existence through
    time.


    This diagram shows the following actions taking place:-


    * Firstly a method call (often referred to in OO terminology as a message) to
    `method0()` comes to `object1` from somewhere – this could be another class outside
    the diagram.

    * `object1` begins executing its `method0()` (as indicated by the vertical bar
    (called an activation bar) which starts at this point).

    * `object1.method0()` invokes `object2.method1()` – the activation bar indicates
    that this executes for a period then returns control to `method0()`.

    * Subsequently `object1.method0()` invokes `object2.method2()` passing two parameters.

    * `method2()` subsequently invokes `object3.method3()`. When `method3()` ends
    it passes a return value back to `method2()`.

    * `method2()` completes and returns control to `object1.method0()`.

    * Finally `method0()` calls another method of the same object, `method4()`.


    ## Selection and Iteration


    The logic of a scenario often depends on selection (`if` ) and iteration (loops).
    There is a notation (`interaction frames`) which allow ifs and loops to be represented
    in sequence diagrams; however these tend to make the diagrams cluttered.


    Sequence diagrams are generally best used for illustrating particular cases, with
    the full refinement reserved for the implementation code. Fowler (“UML Distilled”,
    3rd Edn.) gives a brief treatment of these constructs.


    ![Wondershare](images/bg05000001.jpg)


    ## 2.7 Summary


    UML is not a methodology but a precise diagramming notation. Class diagrams and
    package diagrams are good for describing the architecture of a system. Object
    diagrams describe the data within an application at one moment in time and sequence
    diagrams describe how a system works over a period of time.


    UML gives different meaning to different arrows therefore one must be careful
    to use the notation precisely as specified. With any UML diagram suppression is
    encouraged – thus the author of a diagram can suppress any details they wish in
    order to convey essential information to the reader.


    # 3 Inheritance and Method Overriding


    ## Introduction


    This chapter will discuss the essential concepts of Inheritance, method overriding
    and the appropriate use of `Super`.


    ### Objectives


    By the end of this chapter you will be able to…:


    * Appreciate the importance of an Inheritance hierarchy,

    * Understand how to use `Abstract` classes to factor out common characteristics,

    * Override methods (including those in the `Object` class),

    * Explain how to use `Super` to invoke methods that are in the process of being
    overridden,

    * Document an inheritance hierarchy using UML and

    * Implement inheritance and method overriding in Java programs.


    All of the material covered in this chapter will be developed and expanded on
    in later chapters of this book. While this chapter will focus on understanding
    the application and documentation of an inheritance hierarchy, Chapter 6 will
    focus on developing the analytical skills required to define your own inheritance
    hierarchies.


