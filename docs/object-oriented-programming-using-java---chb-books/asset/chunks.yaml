    \n### 7.9 An Example Using Un-typed Collections\n\nThe code below shows an example\
    \ of an Un-typed list of `Strings`.\n\n```java\nimport java.util.List;\nimport\
    \ java.util.ArrayList;\nimport java.util.Iterator;\n\nclass ListDemo {\n    List\
    \ mAList;\n\n    /*** Constructor*/\n    public ListDemo() {\n        mAList =\
    \ new ArrayList();\n    }\n\n    /**\n     * Append a string at the end of the\
    \ list\n     * @param pStr string to be added to list\n     */\n    public void\
    \ appendString(String pStr) {\n        mAList.add(pStr);\n    }\n\n    /**\n \
    \    * Insert a string at a specified position in the list\n     * @param pPos\
    \ position at which string to be added (0 = before first)\n     * @param pStr\
    \ string to be added to list\n     */\n    public void insertString(int pPos,\
    \ String pStr) {\n        mAList.add(pPos, pStr);\n    }\n\n    /**\n     * Delete\
    \ the string at a specified position in the list\n     * @param pPos position\
    \ at which string to be added\n     */\n    public void deleteString(int pPos)\
    \ {\n        mAList.remove(pPos);\n    }\n\n    /**\n     * Display list of strings\n\
    \     */\n    public void display() {\n        String nextItem;\n        Iterator\
    \ it = mAList.iterator();\n        while (it.hasNext()) {\n            nextItem\
    \ = (String)it.next();\n            System.out.print(nextItem + \" \");\n    \
    \    }\n        System.out.println();\n    }\n}\n```\n\nMostly the code above\
    \ is self explanatory however perhaps the `display` method needs some explanation.\n\
    \nFirstly `List`, `Set` and `Map` classes implement the `iterator()` method; this\
    \ method returns an object of type `Iterator` and this object is capable of iterating\
    \ around `Lists`, `Sets` or `Maps`. Note – this is not a simple process as each\
    \ collection can be made up of different objects but, thankfully the hard work\
    \ has been done for us.\n\nThus in the `display()` method above a variable `it`\
    \ is created of the general type `Iterator`. The method `iterator()` is then invoked\
    \ on our specific collection thus returning an object capable of iterating around\
    \ our `List` of `Strings`. The `Iterator` class has two very useful methods: `hasNext()`\
    \ which return `true` is another object exists in the collection and `next()`\
    \ which returns the next object in the collection.\n\nThus the loop above iterates\
    \ around the list rerunning and displaying each object.\n\nThere is one final\
    \ thing to note: because we are using un-typed collection each object in the list\
    \ could be a different type of object and hence when an object is retrieved from\
    \ the list the JRE does not know what type of object it is – however as we are\
    \ only using this list to store `Strings` we can cast each object retrieved onto\
    \ a `String`. This will cause a compiler warning as this will fail if we add non\
    \ `String` objects to the list.\n\nWhile this program stores and manipulates a\
    \ list of `Strings` the program could just as easily store a list of `Publication`\
    \ – or any object constructed from a class we create.\n\n### 7.10 An Example Using\
    \ Typed Collections\n\nUsing typed collections this is simpler for two reasons:\n\
    1) because we know what type of object will be returned from the list and hence\
    \ we don’t need to use the cast operator.\n2) because Java 5.0 introduced an improved\
    \ `for` loop that can loop through every item in a typed collection without using\
    \ a loop counter (or `iterator`).\n\nHence see example below….\n\n```java\nimport\
    \ java.util.List;\nimport java.util.ArrayList;\n\npublic class ListDemo {\n  \
    \  private List<String> mAList;\n\n    /**\n     * Constructor\n     */\n    public\
    \ ListDemo() {\n        mAList = new ArrayList<String>();\n    }\n\n    /**\n\
    \     * Display list of strings\n     */\n    public void display() {\n      \
    \  for (String nextItem: mAList) {\n            System.out.print(nextItem + \"\
    \ \");\n        }\n        System.out.println();\n    }\n}\n```\n\nCreating a\
    \ typed collection is very similar to creating an untyped collection except when\
    \ we create the instance variable and create the actual collection we must specify\
    \ what the collection contains (in this case it is simply a collection of `Strings`).\
    \ You can think of `< >` syntax to mean ‘of ’ ie in this case a list of `strings`.\
