    \   * @param pMessage description of exception\n     */\n    UnknownClientException\
    \ (String pMessage){ \n        super(pMessage);\n    } \n}\n```\n```在某些方面，这看起来相当奇怪。我们在这里创建\
    \ `Exception` 的子类，但我们的子类并没有包含任何新方法，它也没有重写任何现有方法。因此，它的功能与父类相同——然而，它是一个具有意义且描述性名称子类型。\n\
    \n如果不存在 `Exception` 的子类，我们只能捕获最通用的异常类型，即 `Exception` 对象。这意味着我们只能编写一个捕获所有类型异常的\
    \ catch 块（异常块）。\n\n### 创建和使用异常\n\n定义了子类后，我们有了选择……\na) 我们可以定义一个 catch 块来捕获通用类型\
    \ `Exception` 的对象，即它将捕获所有异常；b) 我们可以定义一个 catch 块来捕获 `UnknownClientExceptions` 但忽略其他类型的异常。\n\
    \n通过查看在线 API，我们可以看到已经存在许多预定义的异常子类。其中包含许多此类类，包括：\n* `IOException`\n* `CharConversionException`\n\
    * `EOFException`\n* `FileNotFoundException`\n* `ObjectStreamException`\n* `NullPointerException`\n\
    * `PrinterException`\n* `SQLexception`\n\n因此，我们可以写一个对任何类型异常做出响应的 catch 块，或者将其限制为输入/输出异常，或者我们可以更具体，将其限制为\
    \ `FileNotFound` 异常。\n\n### 9.4 抛出异常\n\n在定义了自己的异常后，我们必须指示 `getClient()` 方法抛出此异常（假设没有找到指定\
    \ ID 的客户端）。\n\n为了做到，我们必须首先告诉编译器该类可能会产生异常——编译器将确保任何以后使用此方法的程序员都会捕获此异常。\n\n要告诉编译器此方法抛出异常，我们需要在方法签名中添加以下语句\
    \ `throws UnknownClientException`。\n\n```java\npublic Client getClient(String\
    \ pClientID) throws UnknownClientException\n```\n\n我们必须创建 `UnknownClientException`\
    \ 类的新实例，并将 `throw` 关键字应用于此新创建的对象。我们使用 `throw` 关键字在方法体内的适当点抛出异常。\n\n```java\nif\
    \ (foundClient != null){ \n    return foundClient;\n}else{ \n    throw new UnknownClientException(\
    \ \" BookOfClients.getClient():unknown client ID: \" + pClientID); \n}\n```\n\n\
    在上面的示例中，如果找到了客户端，方法将返回客户端对象。然而，它将不再返回 NULL 值。相反，如果没有找到客户端，将使用 `new` 调用 `UnknownClientException`\
    \ 的构造函数。此构造函数需要一个 `String` 参数——我们在这里传递的字符串是一个试图提供信息和帮助的错误消息。消息指定了：\n* 生成异常的类（即\
    \ `BookOfClients`），\n* 该类中的方法（即 `getClient()`），\n* 解释异常原因的文本，\n* 以及无法找到客户端的参数值。\n\
    \n通过定义 `UnknownClientException` 并在 `getClient()` 方法头部使用 `throw` 子句，我们向所有调用此方法的方法提供了一个警告，可能会抛出异常。这使得\
    \ Java 编译器能够确保在需要的地方提供 try/catch 块。通过这样做，我们防止了潜在的关键错误被忽视。\n\n### 9.5 捕获异常\n\n\
    在向编译器指定此方法可能会产生异常后，我们迫使其他程序员通过将对此方法的调用放在 try/catch 块中来防止关键错误。如果产生了异常，try 块中的代码将终止，转而启动\
    \ catch 块中的代码。\n\n因此，在上面的示例中，`awardLoan()` 方法可以决定在未找到指定 ID 的客户端时该做什么：\n\n```java\n\
    try {\n    Client c = listOfClients.getClient(clientID);\n    c.determineCreditRating();\n\
    \    // 根据此评分添加代码来授予或拒绝贷款申请\n}\ncatch (UnknownClientException uce) { \n    System.out.println(\"\
    INTERNAL ERROR IN BankManager.awardLoan()\\n\"+ \"Exception details: \" + uce);\n\
    }\n```\n\n现在，如果未找到客户端 ID，程序不会因为 `NullPointerException` 而崩溃，我们故意抛出的 `UnknownClientException`\
    \ 将由 Java 虚拟机处理，虚拟机将终止 try 子句中的代码并调用 catch 子句中的代码，在这种情况下，它将显示一条消息向用户警告该问题。\n\n\
    ### 9.6 总结\n\n* Java 异常提供了一种处理程序执行过程中发生的异常情况的机制。\n* 通过利用 Java 异常机制，我们防止了潜在的致命性程序失败。\n\
    * 异常机制将确保使用我们方法的其他程序员识别并处理错误情况。\n* 当产生异常时，catch 块中的代码将启动——这些代码可以采取补救措施或在生成适当错误消息的情况下终止程序。无论何种情况，至少程序不会直接“停止”。\n\
    \n### 10 敏捷编程\n\n虽然对敏捷开发方法的详细讨论超出了本书的范围，但本章将解释敏捷编程方法支持者提出的主张，并展示现代 IDE\n\n"
