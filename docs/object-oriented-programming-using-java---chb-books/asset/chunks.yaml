    # 关键字与注释


    ## 继承


    - 除了关联之外，另一种主要的建模关系是继承：

    - `Class A` “继承”了 `Class B` 的接口和实现，尽管它可能会重写实现细节并对两者进行补充。


    我们将在第 3 章详细介绍继承。


    ## 接口


    - 接口与继承相似，但接口只继承接口部分。接口定义的方法在实现该接口的每个类中必须实现。

    - 使用 `<<interface>>` 关键字表示接口：


    ![Wondershare](img/bg03700001.jpg)


    这也有一种简写形式。在这两种情况下，这些示例都表示 `CashTill` 需要 `SaleableItem` 接口，而 `Publication` 实现了该接口。


    请注意，继承线/箭头的虚线版本表示 `Publication` “实现”或“实现”了 `SaleableItem` 接口。


    “球和插座”表示法是 UML 2 中的新特性——它是一种表示接口如何连接类的良好视觉化方式。


    我们将在第 4 章中详细介绍接口的应用。


    ## 关键字


    UML 定义了关键字来细化图形符号的含义。

    我们已经看到了 `<<interface>>`，也将使用 `<<abstract>>`，但还有许多其他的。

    抽象类也可以通过用斜体显示其名称来表示，尽管这对于普通读者来说可能不那么直观。


    ## 注释


    最后，我们可以添加注释来说明图元素。这为我们提供了一个“全能”功能，用于添加图形符号无法传达的信息。


    ## 活动 4


    根据你自己的经验，尝试开发一个模型，说明以下 UML 类图表示元素的使用：


    - 简单关联

    - 双向关联

    - 聚合（很棘手！）

    - 组合

    - 关联

    - 多重性

    - 泛化（继承）

    - 接口

    - 注释


    在本次练习中，请关注类之间的关系，而不是它们成员的细节。与其他同学和导师解释并讨论你的模型。为了帮助你开始，下面提供了一些较小的示例。


    - 在大学管理系统中，我们可能会为学生学习的每学年生成一份成绩单（包括可能的实习年）。这种关联关系在本质上是单向的——给定一个学生，我们可能想找到他们的成绩单，但似乎不太可能有一份成绩单并需要找到它所属的学生。

    - 在图书馆里，读者最多可以借八本书。某特定的书最多由一个读者借。我们可能希望像这里所示有一个双向关系，因为除了能够识别特定读者借的所有书籍外，我们可能还想找到借了某特定书籍的读者（例如在有预约时召回它）。

    - 这可能是某种教育虚拟解剖程序模型的一部分。组合——这种显示一个对象是（并且是）另一个对象的部分的“强”关系——在这里是合适的。不过，多重性并不总是适用于人类——他们可能因为事故或疾病丢失了一根手指，或者因为遗传异常多长了一根。如果我们正在对医学院解剖实验室的“材料”进行建模会怎样？手并不总是身体的一部分！也许“较弱”的聚合关系能更好地反映这一点。

    - 客户可以拥有任意数量的银行账户，一个银行账户可以由一个人或两个人持有（“联名账户”）。我们省略了这种关系的导航性，也许因为我们还没有决定这个问题。银行账户要么是活期账户要么是储蓄账户——因此
    `BankAccount` 本身是抽象的。（我们可以使用斜体而不是 `<<abstract>>` 关键字来显示这一点）

    - 钟的一部分是一个显示时间的显示器。这可能是模拟显示或数字显示。我们可以使用一个父类和两个子类，但由于这两个显示器的实现完全不同，因此使用接口来定义 `AnalogDisplay`
    和 `DigitalDisplay` 必须提供的操作可能更为。

    - 这里使用注释是为了添加一些标准 UML 表示法无法传达的信息，仅从所绘类的名称和关系可能并不显而易见。


    ## 反馈 4


    此活动没有特定的反馈。


    ## 2.4 UML 包图


    虽然类图是 UML 定义的最常用的图，且我们将在本书书中大量使用它们，但还有其他表示不同类型信息的图。在这里我们将触及其中三个：包图。


    世界地图、国家地图和城市地图都显示空间信息，只是比例和详细程度不同。大型 OO 系统可能由数百个甚至数千个类组成，因此，如果类图是表示大型系统架构的唯一方式，它将变得过于巨大且复杂。因此，由于我们需要世界地图，我们需要包图来显示大型系统的总体架构。即使是中等系统也可以被拆分为几个基本组件，即包。我们将在第
    11 章看到包的示例。现在我们只看包图的表示法。


    包不仅是一组类的视觉表示，相反，“包”是一个包含一组相关类（以及接口）的目录。包允许我们在我们在类类之上提供一个层次的组织和封装，所有的 Java 平台类都安排在一个大的包层次结构中。同样地，我们也可以使用
    Java 包机制来安排自己的类。


    包被描述为一系列用点分隔的名称，例如 `java.awt.event`。这些名称对应于文件系统中的一系列子目录，例如：


    ![Wondershare](img/bg04100001.jpg)![Wondershare](img/bg04100002.jpg)![Wondershare](img/bg04100003.jpg)


    大型 Java 开发项目应该在设计阶段拆分为合适的包。UML 提供了“包图”来表示类与包之间的关系。


    我们可以描绘：

    - 包内的类

    - 包的嵌套

    - 包之间的依赖关系


    在下图中我们看到了两个包：`java` 和 `javax`


    ![Wondershare](img/bg04200001.jpg)


    仔细观察这个，我们可以看到 `java` 包内部另一个名为 `awt` 的包，在内部


