  md: '# Chapter 4


    # DOM Document Object Model


    The creation of the Document Object Model or DOM is one of the innovations that
    has most influenced the development of dynamic web pages and the most complex
    web applications.


    DOM allows web programmers to access and manipulate XHTML pages as if they were
    XML documents. In fact, DOM was originally designed to easily manipulate XML documents.


    Despite its origins, DOM has become a utility available for most programming languages
    (Java, PHP, JavaScript) and whose only differences are in the way of implementing
    it.


    # Node Tree


    One of the usual tasks in programming web applications with JavaScript is the
    manipulation of web pages. In this way, it is usual to obtain the value stored
    by some elements (for example the elements of a form), create an element (paragraphs,
    <div>, etc.) dynamically and add it to the page, apply an animation to a item
    (to appear / disappear, to scroll, etc.).


    All these usual tasks are very simple to perform thanks to DOM. However, in order
    to use the DOM utilities, it is necessary to "transform" the original page. A
    normal HTML page is nothing more than a succession of characters, so it is a very
    difficult format to manipulate. Therefore, web browsers automatically transform
    all web pages into a more efficient structure to manipulate.


    This transformation is done by all browsers automatically and allows us to use
    the DOM tools very easily. The reason why the operation of this internal transformation
    is shown is that it determines the behavior of DOM and therefore, the way in which
    pages are manipulated.'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'DOM transforms all XHTML documents into a set of elements called nodes, which
    are interconnected and that represent the contents of web pages and the relationships
    between them. Because of its appearance, the union of all nodes is called a "node
    tree".


    It becomes the next tree of nodes. The root of the node tree of any XHTML page
    is always the same: a special type node called "Document".


    From that root node, each XHTML tag is transformed into a node of type "Element".
    The conversion of tags into nodes is done hierarchically. In this way, only the
    HEAD and BODY nodes can derive from the root node. From this derivation, each
    XHTML tag is transformed into a node that derives from the node corresponding
    to its "parent tag".


    The transformation of the usual XHTML tags generates two nodes: the first is the
    "Element" type node (corresponding to the XHTML tag itself) and the second is
    a "Text" type node that contains the text enclosed by that XHTML tag.


    Thus, the following XHTML tag:


    <title> Simple page</title> Generates the following two nodes:


    <p> This page is <strong>very simple</strong></p> It generates the following nodes:


    +   - Type node "Element"corresponding to the <p> tag.

    - Node of type "Text" with the textual content of the <p> tag.

    - Since the content of <p> includes another XHTML tag inside it, the inner tag
    is transformed into a node of type "Element" that represents the <strong>tag and
    derived from the previous node.

    - The content of the <strong>tag generates another node of type "Text" that derives
    from the node generated by <strong>..


    The automatic transformation of the page into a node tree always follows the same
    rules:'
