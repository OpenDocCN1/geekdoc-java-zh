    What do we do if the same priority is given to every provider in an expression?
    In this situation, it becomes easily evident the second property connected with
    Java operators. This property is called associativity. Associativity informs the
    operator whether or not the implementation path is left to right or right to left.
    For instance, the assignment operator a= b= c= 10. This implies c is allocated
    by 10, then b is allocated by c, and lastly a is allocated by b.


