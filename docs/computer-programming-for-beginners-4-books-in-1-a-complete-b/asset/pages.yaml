    # Set The Focus On An Element


    In programming, when an element is selected and you can write directly to it or
    you can modify any of its properties, it is said to have the focus of the program.


    If a text box of a form has the focus, the user can write directly on it without
    having to previously click with the mouse inside the box. Likewise, if a drop-down
    list has the focus, the user can select an option directly by going up and down
    with the arrow keys.


    By repeatedly pressing the TABULATOR key on a web page, the different elements
    (links, images, form fields, etc.) get the focus of the browser (the selected
    element each time usually shows a small dotted border).


    If on a web page the form is the most important element, such as on a search page
    or on a page with a form to register, it is considered a good usability practice
    to automatically assign the focus to the first element of the form when load the
    page


    To assign the focus to an XHTML element, the focus () function is used.


