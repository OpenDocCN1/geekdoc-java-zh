    Operators allow you to manipulate the value of variables, perform mathematical
    operations with their values and compare different variables. In this way, operators
    allow programs to perform complex calculations and make logical decisions based
    on comparisons and other types of conditions.


    # Assignment


    The assignment operator is the most used and the easiest. This operator is used
    to store a specific value in a variable. The symbol used is = (not to be confused
    with the operator == that will be seen later): var number1 = 3;'
