  md: '# Primitive Types vs. Reference Types


    We now have the capacity to discuss an idea that was brought up in the last chapter:
    Reference Types . If you recall, after discussing primitive data types we touched
    upon the concept of reference types. Reference types are another classification
    of data type. Reference types are used to declare variables and hold information.
    Strings and arrays are reference containers that store primitive values, reference
    types merely create locations in memory that store valuable information. Intuitively,
    you can probably tell how strings and arrays differ from ints, doubles, and the
    like. While primitives create containers that store primitive values,


    When a primitive variable is used, it simply delivers the int or double or whatever
    value that is held within that variable. When a reference type is called, it refers
    to an address where information lives. In many cases, this really means nothing
    to us. You print a primitive, it gives you a value. You print a reference, it
    gives you a statement. However, it is useful to recognize the differences between
    primitives and references when they''re being assigned or compared.


    When you assign a variable to a primitive, it''s straightforward: the content
    of the primitive is copied to the other variable. When a reference is assigned,
    the address, not the content, is copied. In the same way, when we compare primitives,
    the actual content of the variable is being compared. When two strings are compared,
    it''s really the addresses these strings refer to that being compared, not the
    content. This brings us to the idea of immutability .


    # Immutability


    Immutability means that an object''s internal state can not be altered. More generally,
    once an immutable object has been created, it will remain the same throughout
    the life of that object. Strings, for instance, are immutable. Once a string is
    declared, its content cannot be altered. Even methods contained within the String
    class such as replace(), which one assumes would change a string, must be initialized
    under a new string.'
