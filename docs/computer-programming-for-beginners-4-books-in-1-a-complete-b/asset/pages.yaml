    # ## “SAVEPOINT” Transaction


    The "SAVEPOINT" is defined as a "point in a transaction when you can roll the
    transaction back to a certain point without rolling back the entire transaction",
    as shown in the syntax below:


    "SAVEPOINT SAVEPOINT_NAME;"


    The query above is only used to create a "SAVEPOINT" within all the transaction
    statements and then the "ROLLBACK" query can be utilized to retract desired transactions,
    as shown in the query below:


    "ROLLBACK TO SAVEPOINT_NAME;"


    For example, assume you have a “customers” table as shown in the picture below
    and want to delete 3 rows and create a “SAVEPOINT” prior to every deletion and
    then subsequent “ROLLBACK” the change to the preceding state as needed.


    | | NAME | AGE | ADDRESS | SALARY |

    |---|---|---|---||

