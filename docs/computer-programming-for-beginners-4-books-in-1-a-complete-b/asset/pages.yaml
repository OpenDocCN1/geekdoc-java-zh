  md: 'The name of each event is constructed using the prefix on, followed by the
    English name of the action associated with the event. Thus, the event of clicking
    an element with the mouse is called onclick and the event associated with the
    action of moving the mouse is called onmousemove.


    The most used events in traditional web applications are onload to wait for the
    page to load completely, the events onclick, onmouseover, onmouseout to control
    the mouse and onsubmit to control the submission of forms.


    The typical actions that a user performs on a web page can lead to a succession
    of events. Pressing for example on a button of type <input type="submit"> triggers
    the events mousedown, onclick, onmouseup and onsubmit consecutively.


