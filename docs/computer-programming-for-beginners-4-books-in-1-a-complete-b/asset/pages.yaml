  md: '# # Chapter 2

    Basic Programming


    Before starting to develop programs and utilities with JavaScript, it is necessary
    to know the basic elements with which the applications are built. If you already
    know how to program in some programming language, this chapter will help you to
    know the specific syntax of JavaScript.


    If you have never programmed, this chapter explains in detail and starting from
    scratch the basic knowledge to be able to later understand the advanced programming,
    which is the one used to create the real applications.


    # Variables


    The variables in the programming languages follow a logic similar to the variables
    used in other fields such as mathematics. A variable is an element that is used
    to store and reference another value. Thanks to the variables it is possible to
    create "generic programs", that is, programs that always work the same regardless
    of the specific values used.


    In the same way that in Mathematics the variables did not exist the equations
    and formulas could not be defined, in programming one could not make really useful
    programs without the variables. If there were no variables, a program that adds
    two numbers could be written as: result = 3 + 1


    The previous program is so unhelpful that it only applies to the case where the
    first number of the sum is 3 and the second number is 1. In any other case, the
    program obtains an incorrect result.


    However, the program can be remade as follows using variables to store and refer
    to each number:


    ```

    number_1 = 3 number_2 = 1

    result = number_1 + number_2

    ```'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'Elements number_1 and number_2 are variables that store the values used by
    the program. The result is always calculated based on the value stored by the
    variables, so this program works correctly for any number of indicated numbers.
    If the value of the variables number_1 and number_2 is modified, the program continues
    to function correctly.


    Variables in JavaScript are created using the reserved word var. In this way,
    the previous example can be done in JavaScript as follows:


    ```

    var number_1 = 3; var number_2 = 1;

    ```


    ```

    var result = number_1 + number_2;

    ```


    The reserved word var should only be indicated when defining the variable for
    the first time, which is called declaring a variable. When the variables are used
    in the rest of the script instructions, it is only necessary to indicate their
    name. In other words, in the previous example it would be a mistake to indicate
    the following:


    ```

    var number_1 = 3; var number_2 = 1;

    ```


    ```

    var result = var number_1 + var number_2;

    ```


    If a value is also assigned when a variable is declared, it is said that the variable
    has been initialized. In JavaScript, it is not mandatory to initialize the variables
    since they can be declared by one party and assign them a value later. Therefore,
    the previous example can be remade as follows:


    ```

    var number_1; var number_2 = 2;

    ```


    ```

    number_1 = 3; number_2 = 1; var result = number_1 + number_2;

    ```


    One of the most surprising features of JavaScript for programmers accustomed to
    other programming languages is that it is not necessary to declare the variables.
    In other words, you can use variables that have not been previously defined by
    the reserved word. The previous example is also correct in JavaScript as follows:


    ```

    var number_1 = 3; var number_2 = 1;

    ```


    ```

    result = number_1 + number_2;

    ```'
  merge: -1
