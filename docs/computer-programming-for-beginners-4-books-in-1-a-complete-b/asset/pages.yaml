    # Example


    Assume that there is a user named "rfc" with "SELECT", "UPDATE" and "DELETE" privileges
    on the "classicmodels sample database and you would like to revoke the "UPDATE"
    and "DELETE" privileges from the "rfc" user. To accomplish this, you can execute
    the queries below.


    To start with we will check the user privileges using the "SHOW GRANTS" statement
    below:


    ```

    SHOW GRANTS FOR rfc;"

    ```


    ```

    GRANT SELECT, UPDATE, DELETE ON ''classicmodels''.* TO ''rfc''@''%''

    ```


    At this point, the "UPDATE" and "REVOKE" privileges can be revoked from the "rfc"
    user, using the query below:


    ```

    REVOKE UPDATE, DELETE ON classicmodels.* FROM rfc;

    ```


    Next, the privileges of the "rfc" user can be checked with the use of "SHOW GRANTS"
    statement:


    ```

    SHOW GRANTS FOR ''rfc''@localhost;"

    ```


    ```

    GRANT SELECT ON ''classicmodels''.* TO ''rfc''@''%''

    ```


    Now, if you wanted to revoke all the privileges from the "rfc" user, you can use
    the query below:


    ```

    REVOKE ALL PRIVILEGES, GRANT OPTION FROM rfc;

    ```


    To verify that all the privileges from the "rfc" user have been revoked, you will
    need to use the query below:


    ```

    SHOW GRANTS FOR rfc;"

    ```'
