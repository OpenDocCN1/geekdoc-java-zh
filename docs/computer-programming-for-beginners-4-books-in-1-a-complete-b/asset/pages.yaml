    • If an XHTML tag is inside another one, the same procedure as above is followed,
    the generated nodes will be child nodes of its parent tag.


    As you can guess, the usual XHTML pages produce trees with thousands of nodes.
    Even so, the transformation process is fast and automatic, being the functions
    provided by DOM (which will be seen later) the only ones that allow access to
    any node of the page easily and immediately.


    # Node Types


    The full DOM specification defines 12 types of nodes, although the usual XHTML
    pages can be manipulated by handling only four or five types of nodes:


    +   • Document, root node from which all other nodes in the tree derive.


    +   • Element, represents each of the XHTML tags. It is the only node that can
    contain attributes and the only one from which other nodes can derive.


    +   • Attr, a node of this type is defined to represent each of the attributes
    of the XHTML tags, that is, one for each attribute = value pair.


    +   • Text, node that contains the text enclosed by an XHTML tag.


    +   • Comment, represents the comments included in the XHTML page.


    The other types of existing nodes that are not to be considered DocumentType,
    CDataSection, DocumentFragment, Entity, EntityReference, ProcessingInstruction,
    and Notation.


