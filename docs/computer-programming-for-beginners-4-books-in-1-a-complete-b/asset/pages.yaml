    # HTML And JavaScript


    We have previously explained that JavaScript and HTML were closely related, with
    the HTML code that generally serves as a container for the JavaScript instruction
    block. Once the HTML page is loaded, the browser executes the JavaScript instructions
    thus allowing it to be enriched with new features. However, there is another type
    of JavaScript execution.


    # The Two Types Of JavaScript Execution


    The JavaScript code blocks can be directly present in the source code of the HTML
    page between two tags (one start and one end), or written in a JavaScript file
    with the extension .js, totally independent of the HTML code of the page. The
    first case is known as internal JavaScript as opposed to the called external JavaScript.


    Neither is better than the other, it is just a programming option. The second
    option, however, has the advantage of allowing the code to be reused in other
    HTML pages without the need to rewrite or copy it.


    Specifically, the script is written in a special document using a text editor
    and is saved without formatting under the extension .js. If the editor does not
    propose this extension by default, just add it when saving the document. It is
    recommended to explicitly name the role that your script plays in the HTML page
    so that it is easier to find it on another occasion.'
