    However, the code simply shows the contents of the clock 1 second after the page
    loads, so it is not very useful. To execute a function periodically, you use a
    JavaScript function very similar to setTimeout () is called setInterval(). Its
    definition is: setInterval(functionName, milliseconds);


    The definition of this function is identical to the setTimeout () function, except
    that in this case, the programmed function is executed periodically with a period
