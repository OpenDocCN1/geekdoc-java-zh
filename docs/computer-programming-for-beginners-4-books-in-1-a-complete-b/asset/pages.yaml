  md: '# Dropping a "SQL VIEW"


    The "DROP VIEW" statement can be utilized to delete an existing view from the
    database, using the syntax below:


    ```

    "DROP VIEW [IF EXISTS] [database_name].[view_name]"

    ```


    The IF EXISTS clause is not mandatory in the statement above and is used to determine
    if the view already exists in the database. It prevents you from mistakenly removing
    a view that does not exists in the database.


    You may, for instance, use the "DROP VIEW" statement as shown in the syntax below
    to delete the "organization" view:


    ```

    "DROP VIEW IF EXISTS organization;"

    ```


    # SQL TRANSACTIONS


    A transaction can be defined as a "unit of work that is performed against a database".
    They are "units or work sequences" that are performed in a "logical order", either
    manually or automatically using by the database program.


    Or simply puts, they are "the spread of one or more database modifications". For
    instance, if you create a row, update a row, or delete a row from the table, that
    means you are executing a transaction on that table. To maintain data integrity
    and address database errors, it is essential to regulate these transactions.


