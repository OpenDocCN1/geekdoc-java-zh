  md: '# Text Strings


    Used to store characters, words and/or text phrases. To assign the value to the
    variable, the value is enclosed in double or single quotes, to delimit its beginning
    and its end:


    ```

    var message = "Welcome to our website"; var productName = ''Product ABC''; var
    Selected letter = ''c'';",

    ```


    Sometimes, the text that is stored in the variables is not so simple. If, for
    example, the text itself contains single or double quotes, the strategy followed
    is to enclose the text with quotes (single or double) that the text does not use:


    ```

    / The content of text1 has single quotes, so it is enclosed with double quotes
    * /

    ```


    ```

    var text1 = "A phrase with ''single quotes'' inside";

    ```


    ```

    / The content of text2 has double quotes, so it is enclosed with single quotes
    * /

    ```


    ```

    var text2 = ''A phrase with "double quotes" inside'';",

    ```


    However, sometimes text strings contain both single and double-quotes. In addition,
    there are other characters that are difficult to include in a text variable (tab,
    ENTER, etc.). To solve these problems, JavaScript defines a mechanism to easily
    include special and problematic characters within a text string.",


    The mechanism consists of replacing the problematic character with a simple combination
    of characters. In this way, the previous example that contained single and double
    quotes within the text can be redone as follows:


    ```

    var text1 = ''A phrase with \'' single quotes \''inside''; var text2 = "A phrase
    with " double quotes "inside'';

    ```


    # Arrays


    Sometimes, arrays are called vectors, matrices, and even arrays. However, the
    term array is the most used and is a commonly accepted word in the programming
    environment.'
