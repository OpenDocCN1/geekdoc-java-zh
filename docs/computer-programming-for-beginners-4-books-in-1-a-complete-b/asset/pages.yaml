    # Booleans


    Boleans or Boolean type variables are also known as logical type variables. Although
    to really understand its usefulness you should study the advanced programming
    with JavaScript in the following chapter, its basic operation is very simple.


    A variable of type boolean stores a special type of value that can only take two
    values: true (true) or false (false). It cannot be used to store numbers, nor
    can it save text strings.


    The only values that can store these variables are true and false, so the true
    and false values cannot be used. Below are a couple of Boolean variables:


    ```

    var Registered client = false; var vatIncluded = true;

