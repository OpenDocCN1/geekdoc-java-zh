    in a column is distinct from one another.


    +   - “PRIMARY KEY” - This constraint is essentially a “combination of a NOT NULL
    and UNIQUE” constraints. It serves as a unique identification for each record
    in the table, which is required to contain a data value. Only one “primary key”
    can be indicated for individual tables.


    +   - “FOREIGN KEY” - This constraint serves as a unique identification for a
