  md: 'Released by Sun Microsystems in 1995, Java is famous for its portability, security,
    and robustness. It remains one of the most favorable programming languages over
    two decades later.


    The Java Virtual Machine (JVM) is one is what allows Java code to be run on most
    any operating system (OS). The “Write once, run everywhere” slogan was used by
    Sun when Java was released and by the end of this book, we hope you''ll understand
    why.


    Besides being a programming language, Java also acts as a Platform : a hardware
    or software environments that executes programs. Windows, Linux, Solaris, and
    Mac OS are platforms that you''re most likely already familiar with. Platforms
    are essentially a mixture of an operating system and the underlying hardware.
    The Java platform is unique in the act that it is software only. this is how Java
    achieves its versatility. Because Java is software-only it''s able to be run over
    any other platform that is hardware based.


    The Java platform has two components: The Java Application Programming Interface
    and the Java Virtual Machine. The API is made up of packages. Packages are libraries
    containing classes and interfaces. These packages are collected in the API and
    provide many useful abilities.'
