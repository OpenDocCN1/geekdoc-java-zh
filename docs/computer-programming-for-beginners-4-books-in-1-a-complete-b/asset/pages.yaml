    # Precedence and Associativity


    In Java, there may be more than one operators engaged in an expression when an
    object is assessed. Java has made it apparent which operator should be assessed
    first when more than one operator has to be assessed in an action. Java creates
    this choice based on the operators precedence and associativity.


    Precedence is the operator''s priority order, if there are two or more operators
    in an expression, the highest priority operator will be executed first, then the
    next highest, and so on. For example, the multiplication(*) operator will be processed
    first and then added in the expression 1 + 2* 5. This is because the rate or precedence
    of multiplication is greater than comparison.


    Alternatively, if an operand is shared by two operators (2 in the above example
    is shared by the addition and multiplication operators), then the higher priority
    operator first gets the shared operand to be processed. The above instance can
    be intuitively'
