  md: '# # Chapter 4

    # SQL Views and Transactions


    A "Database View" in SQL can be defined as a "virtual table" or "logical table"
    described as "SQL SELECT statement join function. As a "Database View" is like
    a table in the database consisting of rows and columns, you will be able to easily
    run queries on it. Many DDBMSs, including "MySQL", enable users to modify information
    in the existing tables using "Database View" by meeting certain prerequisites,
    as shown in the picture below.


    A "SQL database View" can be deemed dynamic since there is no connection between
    the "SQL View" to the physical system. The database system will store "SQL Views"
    in the form on "SELECT" statements using "JOIN" clause. When the information in
    the table is modified, the "SQL View" will also reflect that modification.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '![](img/fceb48035ba44d292dfb49e8736e8a15_360_0.png)


    # Pros of using SQL View


    A "SQL View" enables simplification of complicated queries: a "SQL View" is characterized
    by a SQL statement which is associated with multiple tables. To conceal the complexity
    of the underlying tables from the end users and external apps, "SQL View" is extremely
    helpful. You only need to use straightforward "SQL" statements instead of complicated
    ones with multiple "JOIN" clauses using the "SQL View".

    A "SQL View" enables restricted access to information depending on the user requirements.
    Perhaps you would not like all users to be able to query a subset of confidential
    information. In such cases "SQL View" can be used to selectively expose non-sensitive
    information to a targeted set of users.

    The "SQL View" offers an additional layer of safety. Security is a key component
    of every "relational database management system". The "SQL View" ensures "extra
    security" for the DBMS. The "SQL View" enables generation of a "read-only"'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'view to display “read-only” information for targeted users. In

    "read-only view", users are able to only retrieve data and

    are not allowed to update any information.

    The SQL View" is used to enable computed columns. The table

    in the database is not capable of containing computed

    columns but a "SQL View" can easily contain computed

    column. Assume in the "OrderDetails" table there

    is "quantityOrder" column for the amount of products

    ordered and "priceEach" column for the price of each item. But

    t"orderDetails" table cannot contain a calculated column

    storing total sales for every product from the order. If you,

    database schema may have never been a good design. In

    such a situation, to display the calculated outcome, you could

    gerate a computed column called "Total", which would be a

    product of "quantityOrder" and "priceEach" columns. When

    querying information from the "SQL View", the calculated

    column information will be calculated on the fly.


    A "SQL View" allows for backward compatibility. Assume that

    we have a central database that is being used by

    multiple applications. Out of the blue you have been tasked to

    redesign the database accommodating the new business

    needs. As you delete some tables and create new ones, you

    would not want other applications to be affected by

    these modifications. You could generate "SQL Views" in

    such situations, using the identical schema of the "legacy

    tables" that you are planning to delete.


    # Cons of using SQL View


    In addition to the pros listed above, the use of "SQL View" may have

    certain disadvantages such as:


    +   Performance: Executing queries against "SQL View" could be

    slow, particularly if it is generated from another "SQL View".

    Table dependencies: Since a "SQL View" is created from

    the tables of the database. Anytime the tables

    structure connected with "SQL View" is modified, you also

    need to modify the "SQL View".'
