    \ of the user account in \"username @ hostname\" format.\n\nIn the \"IDENTIFIED\
    \ BY\" clause, the password would be indicated. It is important that the password\
    \ is specified in plain text. Prior to the user account saving in the \"user\"\
    \ table, MySQL is required to encrypt the \"user password\".\n\nFor instance,\
    \ the \"CREATE USER\" statement can be utilized as below, for creating a new \"\
    user dbadmin\", that is connected to the \"MySQL database server\" from \"localhost\"\
    \ using user password as \"SECRET\".\n\n```\nCREATE USER dbadmin@localhost\nIDENTIFIED\
    \ BY 'SECRET';\n```\n\nIf you would like to check the \"privileges of a user account\"\
    , you can run the syntax below:\n\n```\nSHOW GRANTS FOR dbadmin@localhost;\n```\n\
    \n```\n+--------------------------+\n| Grants for dbadmin@localhost | \n+--------------------------+\n\
    | GRANT USAGE ON *.* TO `dbadmin``localhost` | |\n+--------------------------+\n\
    ```\n\n1 row in set (0.00 sec)\n\nThe . * * in the \"result set\" above indicates\
