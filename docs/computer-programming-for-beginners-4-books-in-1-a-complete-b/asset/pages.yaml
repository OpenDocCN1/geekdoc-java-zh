    # ## MySQL JOIN Statements


    The MySQL "JOIN" function is a way to link information between one or more tables
    on the basis of common attributes or column values between the selected tables.
    A relational database comprises of various tables that have been linked by a shared
    or common column, known as "foreign key". As a result, information in each individual
    table can be deemed incomplete from the business perspective. For instance, there
    are two separate tables in the "MySQL sample database" called "orders" and "orderdetails"
    that have been connected to each other using a column called "orderNumber". You
    will have to search for information in both the "orders" and the "orderdetails"
    table to obtain complete information.


    There are 6 different SQL "JOINS" functions, namely, "INNER JOIN", "LEFT JOIN",
    "RIGHT JOIN", "CROSS JOIN" and "SELF JOIN".


    We will be using tables named "t1" and "t2" as described in the syntax below,
    in order to facilitate your understanding of each type of "JOIN". The "pattern"
    column in both "t1" and "t2" tables serves as the common column between them.'
