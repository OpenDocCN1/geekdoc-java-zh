    # Creating a “Temporary table” in the database using MySQL server


    A "temporary table" in MySQL is a peculiar kind of table that enables storage
    of a temporary outcome set for reuse over multiple times over the same session.


    A "temporary table" is extremely useful when querying information that needs a
    single "SELECT" statement with the "JOIN" clauses which is not feasible or costly.
    In this scenario, the temporary table can be used as a storage for the immediate
    result which can be processed further using a different query.


    A "temporary table" in MySQL may have the characteristics listed below:


    A "temporary table" is generated using the CREATE TEMPORARY TABLE statement. Note
    that between "CREATE" and "TABLE" functions, the "TEMPORARY" keyword must be added.


    When the session is completed or the connection is ended, MySQL server will automatically
    remove the temporary table from its memory. Another thing to remember is that
    once you are done with the temporary table, it can be explicitly deleted utilizing
    the “DROP TABLE” command.


    A "temporary table" will only be available to accessed by the user that generates
    it. Different users can potentially generate multiple "temporary tables" with
    the same name and still not cause any error, since they can only be seen by the
    user who produced that specific temporary table. Two or more "temporary tables"
    can not, however, share the same name over the same session.


    In a database, a "temporary table" may be given the same name as a standard table.
    The existing "employee table", for instance, cannot'
  merge: -1
  pgno: 306
- img_proc: true
  md: 'be accessed if you create a "temporary table" called "employees", within the
    sample database. All queries you make against the "employees table" will now be
    referred to the "temporary employees table". When you delete the "employees temporary
    table", the permanent "employees table" would still be in the system and can be
    accessed again.


    While a "temporary table" can be given the same name as a "permanent table" without
    triggering any error, it is advised to have a different name for the "temporary
    table". As the same name can lead to confusion and may result in an unexpected
    loss of information. For example, you can not distinguish between the "temporary
    table" and the "permanent table", if the connection to the database server is
    dismissed for some reason and then automatically reconnected to the server. Thus,
    rather than the "temporary table", you could enter a "DROP TABLE" statement to
    delete the "permanent table" unexpectedly.


    Now, a "temporary table" can be created in MySQL with the use of the "TEMPORARY"
    keyword in the "CREATE TABLE" statement. For instance, the command below will
    create a "temporary table" storing the ten clients by revenue with the given table
    name as "top10customers":


    ```

    CREATE TEMPORARY TABLE top10customers

    SELECT p.customerNumber,

    customerName,

    ROUND(SUM(p.amount),2) sales

    FROM payments p

    INNER JOIN customers c ON c.customerNumber = p.customerNumber

    GROUP BY p.customerNumber

    ORDER BY sales DESC

    LIMIT 10;

    ```'
