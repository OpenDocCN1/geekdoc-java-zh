    without waiting for the response from the server.


    Reporting errors immediately through JavaScript improves user satisfaction with
    the application (what is technically known as "improving the user experience")
    and helps reduce the processing load on the server.


    Normally, the validation of a form consists of calling a validation function when
    the user clicks on the form submit button. In this function, it is checked whether
    the values entered by the user meet the restrictions imposed by the application.'
