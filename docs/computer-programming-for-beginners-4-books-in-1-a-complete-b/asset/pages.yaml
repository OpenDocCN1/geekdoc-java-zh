    # Chapter 12: Collections


    A Collections Framework is a unified architecture for representing and manipulating
    collections. All collections frameworks contain the following:


    Interfaces: These are kinds of abstract information representing collections.
    Interfaces permit the manipulation of collections regardless of the information
    of their depiction. Usually, interfaces create a hierarchy in object-oriented
    languages.


    Implementations: These are the collection interfaces'' tangible applications.
    In principle, they are data structures that can be reused.


    Algorithms: These are the techniques that conduct helpful computations on items
    that execute functions for compilation, as searching and sorting. It is said that
    the algorithms are polymorphic: that is, the same technique can be used on the
    suitable collection interface in many separate applications. Essentially, algorithms
    are features that can be reused.


