- img_proc: true
  md: '# Views in MySQL server


    As of the release of MySQL version 5+, it has been supporting database views.
    In MySQL, nearly all characteristics of a "View" conform to the "standard SQL:
    2003".


    MySQL can run queries against the views in couple of ways:


    +   1. MySQL can produce a “temporary table” on the basis of the “view definition
    statement” and then execute all following queried on this "temporary table".

    2. MySQL can combine the new queries with the query that defines the “SQL View”
    into a single comprehensive query and then this merged query can be executed.


    MySQL offers versioning capability for all "SQL Views". Whenever a "SQL View"
    is modified or substituted, a clone of the view is backed up in the "arc (archive)
    directory" residing in a particular database folder. The "backup file" is named
    as view name.frm-00001. If you modify your view again, MySQL will generate a new
    "backup file" called "view name.frm-00002".


    You can also generate a view based on other views through MySQL, by creating references
    for other views in the "SELECT" statement defining the target "SQL View".


    # **CREATE VIEW** in MySQL


    The "CREATE VIEW" query can be utilized to generate new "SQL Views" in MySQL,
    as shown in the syntax below:


    ```

    CREATE

    [ALGORITHM = {MERGE | TEMPTABLE | UNDEFINED}]

    VIEW view_name [(column_list)]

    AS

    select-statement;

    ```


    # **View processing algorithms**


    The attribute of the algorithm enables you to regulate which mechanism is utilized
    by MySQL to create the "SQL View".'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'Three algorithms are provided by MySQL, namely: "MERGE", "TEMPTABLE" and "UNDEFINED".


    To use the "MERGE" algorithm, server will start by combining the incoming query
    with the "SELECT" statement, that will define the "view" into a merged query.
    Subsequently, the merged query is executed by MySQL to retrieve the "result set".
    The "MERGE" algorithm cannot be used if the "SELECT" statement consists of "aggregate
    functions" such as "MIN, MAX, SUM, COUNT, AVG or DISTINCT, GROUP BY, HAVING, LIMIT,
    UNION ALL, subquery". If the "SELECT" statement does not refer to a table, then
    the "MERGE" algorithm cannot be utilized. In the cases, where the "MERGE" algorithm
    is not permitted, server will instead use the "UNDEFINED" algorithm. Please remember
    that the view resolution is defined as "the combination of input query and the
    query in the view definition into one query". Using the "TEMPTABLE" algorithm,
    server will start with production of a "temporary table" that describes the "SQL
    View" on the basis of the "SELECT" statement. Subsequently any incoming query
    will be executed against this "temporary table". The "TEMPTABLE" algorithm is
    lower efficiency than the "MERGE" algorithm because MySQL requires generation
    of a "temporary table to store the result set" and will transfer the data from
    the "permanent tables" to the "temporary table". Moreover, a "SQL View" using
    the "TEMPTABLE" algorithm cannot be updated.


    If you generate a "view" without explicitly stating an algorithm that needs to
    be used, then the "UNDEFINED" algorithm will be used by default. The "UNDEFINED"
    algorithm allows MySQL to choose from the MERGE or TEMPTABLE algorithm to be used.
    Since the "MERGE" algorithm is much more effective, MySQL prefers "MERGE" algorithm
    over "TEMPTABLE" algorithm.


    # View Name'
  merge: -1
  pgno: 363
- img_proc: true
  md: 'Views and tables are stored in the same space within the database, so it is
    not possible to give the same name to a view and a table. Furthermore, the name
    of a view has to be in accordance with the naming conventions of the table.


    # ## “SELECT” statement


    It is easy to query desired data from any table or view contained within a database
    by utilizing the "SELECT" statement. The "SELECT" statement is required to meet
    various guidelines, such as:


    It may comprise a "subquery" in the "WHERE" clause but cannot have one in the
    "FROM" clause.

    No variables, including "local variables", "user variables", and "session variables",
    can be referred to in the "SELECT" statement.


    The "SELECT" statement can also not have a reference to the parameters of prepared
    statements and is not required to refer to any table in the database.


    # ## Example


    To create a "SQL View" of the "orderDetails" table that contains the total "sales
    per order", you can use the query below:


    ```

    CREATE VIEW SalePerOrder AS

