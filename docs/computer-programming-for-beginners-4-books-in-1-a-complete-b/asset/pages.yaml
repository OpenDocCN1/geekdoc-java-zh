  md: '# Chapter 6:

    Control Flow Statements


    Imagine we''re writing a program that enrolls students in courses. If a student
    has completed the prerequisites, then they can enroll in a course. Else, they
    need to take the prerequisite courses. They can''t take Physics II without finishing
    Physics I.


    We represent this kind of decision-making in our program using conditional or
    Control Flow Statements. Up to this point, our code ran line-by-line from top
    to bottom. However, with control flow statements we split the execution stream
    by creating decisions, looping and branching, allowing our program to perform
    specific pieces of code on a conditional basis. Conditional statements check a
    boolean condition and run a block of code depending on the condition. Curly braces
    mark the scope of a conditional block similar to a method or class.


    This section describes if-then, if-then-else, and switch statements (conditional,
    decision making statements), (for, while, do-while), and break, continue, and
    return statements (branching, iterative, looping statements) supported by the
    Java programming language. We will also touch upon exceptions, handling exceptions,
    and other unexpected events that disrupt the flow of a program.


    # Decision Making Statements


    There are relational and logical operators to shape a conditional expression that
    returns either true or incorrect in order to promote conditional control flow
    in Java. Words true and false look like keywords, but they are actually boolean
    literals and can''t be used in Java programs as identifiers. Java program determines
    the route of execution on the grounds of conditional expressions true or false.


    If-Then Statements


    An if-then statement is the most basic control flow statement available. It tests
    whether or not an expression is true or false'
