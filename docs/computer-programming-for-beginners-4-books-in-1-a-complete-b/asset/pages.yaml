    # Upgradeable SQL Views


    The MySQL server offers the capability to not only query the view but also update
    them. The "INSERT" or "UPDATE" statements can be used add and edit the records
    of the underlying table through the updatable "MySQL View". Moreover, the "DELETE"
    statement can be used to drop records from the underlying table through the updatable
    "MySQL View".


    Furthermore, the "SELECT" statement used to generate and define an updatable view
    can not include any of the functions listed below:


    +   - "Aggregate functions" such as "MIN, MAX, SUM, AVG, and COUNT".

    - "DISTINCT".

    - "GROUP BY".

    - "HAVING".

    - "UNION" or "UNION ALL".

    - "LEFT JOIN" or "OUTER JOIN".

    - "Subquery in the SELECT statement or in the WHERE clause referring to the table
    indicated in the FROM clause".

    - "Reference to non-updatable view in the FROM clause".

    - "Reference only to literal values".

    - "Multiple references to any column of the underlying table".


    Remember, the "TEMPTABLE" algorithm cannot be used to generate an updatable "MySQL
    View".'
