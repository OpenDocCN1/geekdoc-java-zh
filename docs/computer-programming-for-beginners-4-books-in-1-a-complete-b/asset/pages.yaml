    # Division Operator (/)


    The Division Operator (/) divides the variable on the left by the variable on
    the right. Unlike the more obvious arithmetic operators, the division operator
    comes with some complications. If an integer is divided by an integer, the result
    will be left off. The caveat is here that any remainder will be left off. If one
    is a floating point type, the result will also be a floating point type. Dividing
    by zero will either result in an ArithmeticException for integers or infinite
