    it the corresponding value. In the same way, the following code would also be
    correct:


    ```

    number_1 = 3; number_2 = 1;

    result = number_1 + number_2;

    ```


    In any case, it is recommended to declare all the variables to be used.


    The name of a variable is also known as an identifier and must comply with the
    following rules:


    +   - It can only consist of letters, numbers, and the symbols $ (dollar) and
    _ (underscore).


    +   - The first character cannot be a number.


    Therefore, the following variables have correct names:


    ```

    var $ number1; var _ $ letter; var $$$ otherNumber; var $ _ to $4;

    ```


    However, the following variables have incorrect identifiers:


    ```

    var 1number; // Start with a number var number; 1_123; // Contains a character
    ":"

    ```


    # Types Of Variables


    Although JavaScript variables are created in the same way (using the reserved
    word var), the way in which they are assigned a value depends on the type of value
    to be stored (numbers, texts, etc.)


    # Numeric


    They are used to store numerical values (called integer in English) or decimals
    (called float in English). In this case, the value is assigned by directly indicating
    the integer or decimal number. Decimal numbers use the character. (period) instead
    of, (comma) to separate the whole part and the decimal part:


    ```

    var iva = 16 // integer variable var total = 234.65; // decimal type variable

    ```'
  merge: -1
