    The “UNION” function in MySQL is used to merge 2 or more “result sets” into one
    comprehensive “result set”. The syntax for the “UNION” operator is given below:


    ```

    SELECT column_list

    UNION [DISTINCT | ALL]

    SELECT column_list

    UNION [DISTINCT | ALL]

    SELECT column_list

    ```


    The fundamental rules to follow with the use of the “UNION” operator are:


    +   It is very critical that the number and the sequence of columns included in
    the “SELECT” statement is the same. The “data types” of the columns are required
    to be identical or “convertible” to the same. The redundant or duplicate rows
    will be removed without explicitly using the “DISTINCT” function in the query.


    # Example'
