    The scope of a variable (called "scope" in English) is the area of the program
    in which the variable is defined. JavaScript defines two scopes for the variables:
    global and local.


    The following example illustrates the behavior of the scopes:


    ```

    function createMessage() {

    var message = "Test message";

    } createMessage(); alert(message);

    ```


    The previous example first defines a function called createMessage that creates
    a variable called message. Then, the function is executed by the call createMessage();
    and then, the value of a variable called message is shown by the alert () function.


    However, when executing the above code, no message is displayed on the screen.
    The reason is that the message variable has been defined within the createMessage()
    function and is, therefore, a local variable that is only defined within the function.


    Any instruction that is within the function can make use of that variable, but
    all instructions that are in other functions or outside of any function will not
    have the message variable defined. Thus, to display the message in the previous
    code, the alert () function must be called from within the createMessage();


    ```

    function createMessage() {

    var message = "Test message"; alert(message);

    } createMessage();

