    # Creating a new database using “MySQL server”


    In “MySQL server”, databases are implemented as directories that contain all the
    files corresponding to the tables in a particular database.


    Now that you have installed the “MySQL Server”, you can follow the instructions
    below to generate new databases with the “CREATE” command, using the syntax below:


    ```

    “CREATE DATABASE [IF NOT EXISTS] database_name"

    “[CHARACTER SET charset_name]"

    “[COLLATE collation_name]”

    ```


    In the syntax above, the first step is specifying the “database_name” right after
    the “CREATE DATABASE” command. In the “MySQL server” instance the name of the
    new database must be unique. When you’re trying to build a database with an existing
    name, the server will abort the action. Next you can indicate the choice "IF NOT
    EXISTS” to prevent an infringement, if you erroneously generate a new database
    that shares its name with a database that already exists on the server. In this
    scenario, MySQL will not generate an issue but will terminate the “CREATE DATABASE”
    statement. Lastly, when the new database is created, you are able to indicate
    the character set and combination requirements. If the clauses "CHARACTER SET"
    and "COLLATE" are omitted, then “MySQL” utilizes the default settings for the
    new database.


    Alternatively, you can build a new database using “MySQL Workbench” and following
    the steps below:


