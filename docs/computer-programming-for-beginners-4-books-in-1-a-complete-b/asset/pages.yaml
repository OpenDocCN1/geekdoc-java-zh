    # Noscript Tag


    Some browsers do not have full JavaScript support, other browsers allow you to
    partially block it and even some users completely block the use of JavaScript
    because they believe they are browsing more securely.


    In these cases, it is common that if the web requires JavaScript for its correct
    operation, a warning message to the user is included indicating that you should
    activate JavaScript to fully enjoy the page. The following example shows a JavaScript-based
    web page when accessed with JavaScript enabled and when accessed with JavaScript
    completely disabled.


    The following code shows an example of using the <noscript> tag:


    ```

    <head> ... </head>

    <body>

    <noscript>

    <p> Welcome to My Site </p>

    <p> The page you are viewing requires the use of JavaScript for its operation.
    </p>


    ```


    If you have intentionally disabled it, please enable it again. </p>


    ```

    </noscript>

    ```'
