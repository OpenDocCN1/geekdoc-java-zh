    # Advantages of Database Management System


    The database management system (DBMS) is described as "software system that enables
    users to identify, develop, maintain and regulate access to the database". DBMS
    allows end customers to generate information in the database as well as to read,
    edit and delete desired data. It can be viewed as a layer between the information
    and the programs utilizing that data.


    DBMS offers several benefits in comparison to the "file-based data management
    system". Some of these advantages are listed below:


    Reduction in the redundancy of data - The “file-based DBMS" contain a number of
    files stored in a variety of location on a system and even across multiple systems.
    Due to this, several copies of the same file can often result in data redundancy.
    This can be easily avoided in a database since there is only a single database
    holding all the data and any modifications made to the database are immediately
    reflected across the entire system. Hence, there is no possibility that duplicate
    information will be found in the database.


    Seamless data sharing - Users can share all existing data with each other found
    within a database. Different levels of authorizations exist within the database
    for selective access to the information.'
