    # Modulo Operator (%)


    The Modulo Operator (%) is a strange one. This operator will return whatever remains
    after performing division. This operator also works from left to right. The result
    of 11%5 will be 1. The result will be positive or negative depending on the status
    of the right hand variable. In Java, floating point values and integers are treated
    equally by the modulo operator. Consider the following: performing the modulo
    operation on 11 and 5 will evaluate to 1 while performing the modulo operator
    on 11.5 and 5 will evaluate to 1.5. Similar to the division operator, performing
    modulation will zero will throw an ArithmeticException for integers and NaN for
    floating point values. NaN will also be the result if modulation is used on positive
    or negative infinity.'
