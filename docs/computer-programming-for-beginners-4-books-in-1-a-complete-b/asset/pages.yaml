    # Basic Glossary


    Script: each of the programs, applications or pieces of code created with the
    JavaScript programming language. A few lines of code form a script and a file
    of thousands of lines of JavaScript is also considered a script. Sometimes it
    is translated into Spanish directly as "escribir", although script is a more appropriate
    and commonly accepted word.


    Sentence: each of the instructions that form a script.


    Reserved words: these are the words (in English) that are used to construct JavaScript
    statements and therefore cannot be used freely.


    # Syntax


    The syntax of a programming language is defined as the set of rules that must
    be followed when writing the source code of the programs to be considered correct
    for programming language.


    The basic rules that define JavaScript syntax are as follows:


    Blank spaces and new lines are not taken into account: as is the case with XHTML,
    the JavaScript interpreter ignores any remaining blank space, so the code can
    be properly sorted to better understand it (tabulating the lines, adding spaces,
    creating new lines, etc.).


    The case is case sensitive: as is the case with the syntax of the XHTML tags and
    elements. However, if an XHTML page is used interchangeably, the page is displayed
    correctly, the only problem being the non-validation of the page. On the other
    hand, if JavaScript is exchanging upper and lower case letters, the script does
    not work.


    The type of the variables is not defined: when creating a variable, it is not
    necessary to indicate the type of data that will be stored. In this way, the same
    variable can store different types of data during script execution.'
