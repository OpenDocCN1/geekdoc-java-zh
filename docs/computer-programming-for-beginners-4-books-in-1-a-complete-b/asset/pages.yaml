    # How to include JavaScript in XHTML documents


    The integration of JavaScript and XHTML is very flexible since there are at least
    three ways to include JavaScript code in web pages.


    Include JavaScript in the same XHTML document


    The Javascript code is enclosed between <script> tags and is included anywhere
    in the document. Although it is correct to include any block of code in any area
    of the page, it is recommended to define the JavaScript code within the header
    of the document (within the <head> tag).


    Example of JavaScript code in the document itself </title>


    ```

    <script type = "text / javascript"> alert("A test message");

    </script>

    </head>

    <body>

    <p> A paragraph of text. </p>

    </body>

    </html>

    ```


    In order for the resulting XHTML page to be valid, it is necessary to add the
    type attribute to the <script>. The values included in the type attribute are
    standardized and in the case of JavaScript, the correct value is text / javascript.


    This method is used when defining a small block of code or when you want to include
    specific instructions in a specific HTML document that completes the instructions
    and functions that are included by default in all documents on the website.'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'The main drawback is that if you want to make a modification to the code block,
    it is necessary to modify all the pages that include that same block of JavaScript
    code.


    # Define JavaScript in an external file


    JavaScript instructions can be included in an external JavaScript file that XHTML
    documents link using the <script> tag. You can create the necessary JavaScript
    files and each XHTML document can link as many JavaScript files as you need.


    In addition to the type attribute, this method requires defining the src attribute,
    which indicates the URL corresponding to the JavaScript file to be linked. Each
    <script> tag can only link a single file, but on the same page you can include
    as many <script> tags as necessary.


    JavaScript files are normal text documents with the extension .js, which can be
    created with any text editor such as Notepad, Wordpad, EmEditor, UltraEdit, Vi,
    etc.


    The main advantage of linking an external JavaScript file is that the XHTML code
    of the page is simplified, that the same JavaScript code can be reused on all
    pages of the website and that any modification made to the JavaScript file is
    immediately reflected in all the XHTML pages that link it.


    # Include JavaScript in XHTML elements


    This last method is the least used, since it consists of including JavaScript
    pieces within the XHTML code of the page:


    ```

    <!DOCTYPE html PUBLIC "-// W3C // DTD XHTML 1.0 Transitional // EN "http://www.w3.org/TR/xhtml1
    / xhtml1-transitional.dtd">

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />

    <title>Example of JavaScript code in the document itself</title>

    ```'
