  md: 'Global Namespace: This involves the contents of a module that are accessible
    throughout the module. Modules can have several functions and methods.


    Local Namespace: Mostly for user-defined functions, a local namespace is restricted
    to the particular function and outside the function access is not implicitly possible.


    # Variable Scope


    Even though there might be several unique namespaces specified, it may not be
    possible to access all of the namespaces given because of scope. The concept of
    scope refers to a segment of the program from where we access the namespace directly
    without any prefix. The following are the scope types:


    +   1. Scope containing local names, current function.

    2. Scope containing global names, the scope of the module.

    3. Scope containing built-in names of the outermost scope.


    # Summary


    Type Conversion refers to the process of changing the value of one data type to
    another data type. Think of dividing two integers that lead to decimal numbers.
    In this case, it is necessary to convert force the conversion of an integer into
    a float number. Python has two types of conversion: implicit type conversion and
    explicit conversion. In Python input and output (I/O) tasks are performed by inbuilt
    functions. The print() performs output/display, while input() performs input tasks.
    Namespace in Python refers to a collection of names. While different namespaces
    can co-exist at an instance, they are completely isolated. When we start the Python
    interpreter, a namespace containing all inbuilt names is created as long the workspace
    remains application is active.'
