    # “LEFT JOIN”


    The “MySQL LEFT JOIN enables querying of data from 2 or multiple tables on a database.
    The "SELECT" statement is not required to contain the "LEFT JOIN" clause for execution,
    which appears right next to the "FROM" clause. The principles of "left table"
    and "right table" are implemented when the 2 tables are linked, using the "LEFT
    JOIN" clause.


    Unlike an “INNER JOIN", the LEFT JOIN or or “LEFT OUTER JOIN will return all records
    in the left table, the records meeting the “join condition” and even the records
    that don’t. "NULL" value appear in the "result set" of the “columns from the right
    table for rows that do not match the join condition.


    Now, to further simplify this query we will assume that we are interested in linking
    only tables “t1” and “t2” with the LEFT JOIN per the syntax below:


    # "SELECT


    ```

    t1.c1, t1.c2, t2.c1, t2.c2

    FROM

    ```'
