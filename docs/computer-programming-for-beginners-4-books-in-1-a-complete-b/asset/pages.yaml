  md: 'An array is a collection of variables, which can be all of the same type or
    each of a different type. Its utility is better understood with a simple example:
    if an application needs to handle the days of the week, seven variables of type
    text could be created:


    var day1 = "Monday"; var day2 = "Tuesday"; ... var day7 = "Sunday";


    Although the previous code is not incorrect, it is inefficient and complicates
    programming excessively. If instead of the days of the week you had to save the
    name of the months of the year, the name of all the countries in the world or
    the daily temperature measurements of the last 100 years, you would have to create
    tens hundreds of variables.


    In these types of cases, all related variables can be grouped into a collection
    of variables or array. The previous example can be remade as: days = ["Monday",
    "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];


    Now, a single variable called days stores all related values, in this case, the
    days of the week. To define an array, the characters [and] are used to delimit
    its beginning and end the character, (comma) is used to separate its elements:
    var array_name = [value1, value2, ..., valueN];


    Once an array is defined, it is very easy to access each of its elements. The
    only complication, which is responsible for many errors when starting to program,
    is that the positions of the elements begin to be counted at 0 and not 1:


    var Selected = days [0]; // selected day = "Monday var otherDay = days [5]; //
    otherDay = "Saturday"


    In the previous example, the first instruction wants to get the first element
    of the array. To do this, the name of the array is indicated and in square brackets
