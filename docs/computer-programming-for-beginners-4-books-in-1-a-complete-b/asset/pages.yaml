  md: '# byte


    A Byte has a minimum value of -128 and a maximum of 127. Bytes are helpful in
    big arrays to save time or in circumstances where memory saving counts. Instead
    of int, bytes can be used where boundaries help explain a code. Variable variety
    can be used as a paperwark type.


    # short


    A Short has a minimum of -32,768 and a max of 32.767. Shorts are similar to bytes
    in the way that they can be used to save data in situations where memory matters.


    # long


    A Long has a min of-2 up to the 63rd and a max of 2 up to the63rd. Alternatively,
    to depict values with a minimum of 0 and a maximum of 2 raised to 64th minus 1,
    you can use longs. Also the Long category has helpful techniques such as comparingUnsigned,
    dividingUnsigned, etc. These courses promote lively activities of arithmetic.


    # float


    A Float has a range of values that goes past the scope of this book. Use floats
    if you need to save save memory (similar to byte and short).


    # Reference Data Types


    Aside from primitive data types, there are reference data types . We will dive
    more into these later one but, suffice to say ,they can also be used to declare
    variables. One important thing is primitive data types, like the one discussed
    above, store and refer to primitive values (numbers, decimals, etc). Reference
    data types, on the other hand, merely refer to an address where data is stored.
    Don’t think too deeply on this now, like was said, this concept will be explained
    later on.'
