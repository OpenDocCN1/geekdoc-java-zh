  md: 'It is not necessary to end each sentence with the semicolon character (;):
    in most programming languages, it is mandatory to finish each sentence with the
    character; Although JavaScript does not require you to do so, it is convenient
    to follow the tradition of ending each sentence with the semicolon character (;).


    Comments can be included: comments are used to add information in the source code
    of the program. Although the content of the comments is not displayed on the screen,
    it is necessary to take precautions on the information included in the comments.


    JavaScript defines two types of comments: those of a single line and those that
    occupy several lines.


    Example of a single line comment:


    ```

    // below is an alert message ("test message");

    ```


    Single line comments are defined by adding two slashes (//) at the beginning of
    the line.


    Example of multi-line comment:


    ```

    / * Multi-line comments are very useful when you need to include enough information
    in comments * / alert("test message");

    ```


    Multiline comments are defined by enclosing the text of the comment between the
    symbols / * and / .


    # Possibilities And Limitations


    Since its inception, JavaScript has always been used massively by most Internet
    sites. The appearance of Flash diminished its popularity since Flash allowed to
    perform some actions impossible to carry out through JavaScript.


    However, the appearance of AJAX applications programmed with JavaScript has returned
    an unparalleled popularity within web programming languages.


    As for the limitations, JavaScript was designed to run in a very limited environment
    that would allow users to rely on the execution of the scripts.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'In this way, JavaScript scripts cannot communicate with resources that do not
    belong to the same domain from which the script was downloaded. Nor can scripts
    close windows that have not opened those scripts. The windows that are created
    cannot be too small or too large or placed outside the user''s view (although
    the specific details depend on each browser).


    In addition, scripts cannot access the files of the user''s computer (neither
    in read mode nor in write mode) and cannot read or modify browser preferences.


    Finally, if the execution of a script lasts too long (for example to a programming
    error), the browser informs the user that a script is consuming too many resources
    and gives the possibility to stop its execution.


    In spite of everything, there are alternatives to be to skip some of the above
    limitations. The most used and known alternative is to digitally sign the script
    and ask the user for permission to perform these actions.


    # JavaScript And Browsers


    The most modern browsers currently available include JavaScript support up to
    the version corresponding to the third edition of the ECMA-262 standard. The biggest
    difference lies in the dialect used while Internet Explorer uses JavaScript, the
    rest of browsers (Firefox, Opera, Safari, Conqueror) use JavaScript.


    # JavaScript In Other Environments


    The unparalleled popularity of JavaScript as a web programming language has been
    extended to other applications and other non-web related environments. Tools like
    Adobe Acrobat allow you to include JavaScript code in PDF files. Other tools such
    as Flash and Flex use ActionScript, a dialect of the same JavaScript standard.
    Photoshop allows you to make small scripts using JavaScript and Java version 6
    includes a new package (called javax.script) that allows you to integrate both
    languages.'
