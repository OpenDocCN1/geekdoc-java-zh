  md: "# 152 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER'S GUIDE\n\nThis method takes\
    \ a single argument: an int variable called newSize, which represents the new\
    \ value for maxFileSize. If this value is greater than 0, maxFileSize is set to\
    \ it. Otherwise, the method does not change maxFileSize.\n\nIn the statement that\
    \ defines the method, boolean precedes the name of the method, changeMaxFileSize.\
    \ This statement signifies that a boolean value is sent back after the method\
    \ is handled. The return statement is what actually sends a value back. In this\
    \ method, the value of true is returned if maxFileSize is set to the specified\
    \ value; false is returned otherwise.\n\nIf a method should not return a value,\
    \ you can use the keyword void.\n\nWhen a method returns a value, you can use\
    \ the method as part of an expression. For example, if you created a Virus object\
