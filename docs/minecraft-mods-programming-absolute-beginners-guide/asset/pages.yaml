  md: 'In most cases, because the destination provides more room than the source,
    the information is converted without changing its value. The main exceptions occur
    when an int or long variable is cast to a float, or a long is cast into a double.


    When you are converting information from a larger variable type into a smaller
    type, you must explicitly cast it, as in the following statements:


    ```

    // create an integer variable

    int xNum = 103;

    // cast it to a byte

    byte val = (byte) xNum;

    ```


    Here, casting converts an integer value xNum into a byte variable called val.
    This is an example where the destination variable holds a smaller range of values
    than the source variable. A byte holds integer values ranging from -128 to 127,
    and an int holds a much larger range of integer values.


    When the source variable in a casting operation has a value that isn''t enabled
    in the destination variable, Java changes the value to make the cast fit successfully.
    This can produce unexpected results if you''re not expecting the change.


    > NOTE A character can be used as an int variable because each character has a
    corresponding numeric code that represents its position in the character set.
    If you have a variable named key with the value 67, the cast (char) key produces
    the character value ''C'' because the numeric code associated with a capital C
    is 67, according to the ASCII character set. The ASCII character set is part of
    the Unicode character standard adopted by the Java language.


    # Casting Objects


    You can cast objects into other objects when the source and destination are related
    by inheritance. One class must be a subclass of the other.


    Some objects do not require casting at all. You can use an object where any of
    its superclasses are expected. All objects in Java are subclasses of the Object
    class, so you can use any object as an argument when an object is expected.


    You can also use an object where one of its subclasses is expected. However, because
    subclasses usually contain more information than their superclasses, you might
    lose some of this information. If the object doesn''t have a method that the subclass
    would contain, an error results if that missing method is used in the program.'
