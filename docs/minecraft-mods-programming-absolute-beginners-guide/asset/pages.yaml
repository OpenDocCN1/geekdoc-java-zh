    # SPAWN A MOB


    Armed with the Java knowledge that is filling your brain, assuming you didn''t
    skip past the last 14 chapters, you are ready to put it use writing Minecraft
    mods.


    One of the strengths of Java is that it employs object-oriented programming, which
    makes it possible to acquire the capabilities of an existing Java class through
    inheritance. You inherit the existing class does your new class can also do, and
    everything the existing class does the attributes (variables) and behavior (methods)
    from this superclass.


    Because of inheritance, the code you write in your new class can focus on the
    new things it does and the things it does differently than its superclass.


    All Minecraft mods are subclasses of JavaPlugin in the org.bukkit.plugin.java
    package. You inherit all the code necessary for your program and the communicate
    with each other. This code, plus a configuration file in YAML format plugin.yml,
    tell the server what should happen when the mod''s command is entered by a player
    in the game.'
