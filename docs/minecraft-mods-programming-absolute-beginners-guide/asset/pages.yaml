  md: '# IN THIS CHAPTER


    +   * Design superclasses and subclasses

    * Form an inheritance hierarchy

    * Override methods


    # 13


    ![](img/d3a8c962be273f312a438e9a471a1828_176_0.png)


    # MAKE THE MOST OF EXISTING OBJECTS


    Java objects can have kids. When you create an object—a set of attributes and
    behavior—you have designed something that''s ready to pass these qualities to
    offspring. These child objects take on a lot of the same attributes and behaviors
    as their parents. They also can do some things differently from their parents.


    This system is called inheritance, and it''s something every superclass (parent)
    gives to its subclasses (children). Inheritance is one of the most useful aspects
    of object-oriented programming (OOP), and you learn about it during this chapter.


    Another useful aspect of OOP is the capability to create an object you can use
    with different programs. Reusability makes it easier to develop error-free, reliable
    programs.'
