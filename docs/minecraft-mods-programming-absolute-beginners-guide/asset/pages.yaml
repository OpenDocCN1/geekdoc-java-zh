    # Writing Data to a Stream


    In the java.io package, the classes for working with streams come in matched sets.
    There are FileInputStream and OutputStream classes for working with byte streams,
    FileReader and FileWriter classes for working with character streams, and many
    other sets for working with other kinds of data.


    To begin writing data, you first create a file object that is associated with
    an output stream. This file doesn''t have to exist on your system.


    You can create a OutputStream in two ways. If you want to append bytes onto an
    existing file, call the OutputStream() constructor with two arguments: a file
    object representing the file and the boolean of true. The bytes you write to the
    stream are tacked onto the end of the file.


    If you want to write bytes into a new file, call the OutputStream() method with
    a file object as its only object.


    After you have an output stream, you can call different write() methods to write
    bytes to it:


    +   - Call write() with a byte as its only argument to write that byte to the
    stream.

    - Call write() with a byte array as its only argument to write all the array''s
    bytes to the stream.'
