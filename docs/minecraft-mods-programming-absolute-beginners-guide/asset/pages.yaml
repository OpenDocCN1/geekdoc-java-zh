  md: '# IN THIS CHAPTER


    +   - Create more than one type of mob

    - Let NetBeans detect and fix errors

    - Change a mob''s age from adult to baby

    - Make one mob a passenger of another

    - Customize a mob with potion effects

    - Make a potion effect permanent


    # 19


    ![](img/d3a8c962be273f312a438e9a471a1828_270_0.png)


    # MAKE ONE MOB RIDE ANOTHER


    The first Minecraft mods you create in this book all involve mobs—the animals
    and foes who make the game world a more lively place. Spawning a mob and making
    changes to a mob encounter in the game are a good starting place for this kind
    of programming.


    Each mob you can encounter in Minecraft can be created and manipulated as an object
    in Java.


    The class names are in the org.bukkit.entity package and are largely what you''d
    expect them to be, such as Zombie, Villager, Creeper, MushroomCow, and CaveSpider.


    Mobs can interact with other mobs. In your Java code, one mob will have methods
    to call that establish the relationship to the other mob.


    The mod you create in this chapter covers a common interaction: making one mob
    ride another. You create a ZombieChicken mod that spawns zombies who are mounted
    on chickens.'
