  md: '# 162 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER''S GUIDE


    > CAUTION The VirusLab project raises the issue of how to control how much memory
    a Java program uses.


    The memory available to the Java Virtual Machine (JVM) when it runs an application
    is controlled by two things: the total physical memory available on the computer
    and the amount JVM is configured to use. The default memory allocation is 256MB.
    A different amount can be set with the -Xmx command-line argument.


    To set this in NetBeans, select Run, Set Project Configuration, Customize. The
    Project Properties dialog opens with the Run settings at the front. In the VM
    Options field, enter -Xmx1024M to allocate 1024MB of memory to the JVM. Alter
    that number for more or less memory. Also fill out the Main Class and Arguments
    fields and run the program by selecting Run, Run Project.


    # THE ABSOLUTE MINIMUM


    You now have completed two of the three chapters devoted to object-oriented concepts
    in this book. You''ve learned how to create an object, give behavior and attributes
    to the object and its class of objects, and convert objects and variables into
    other forms by using casting.


    Thinking in terms of objects is one of the tougher challenges of the Java programming
    language. After you start to understand it, however, you realize that the entire
    language makes use of objects and classes.


    During the next chapter, you learn how to give your objects parents and children.'
