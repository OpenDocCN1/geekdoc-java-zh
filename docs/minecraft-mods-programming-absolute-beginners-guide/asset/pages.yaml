  md: "# 312 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER'S GUIDE\n\nWhen the executeCommand()\
    \ method loops through every location in the 3D cube, it creates a Loc object\
    \ each and adds to the searched array list:\n\n```\nLoc loc = new Loc(x, y, z);\n\
    sched.add(loc);\n```\n\nIf a location contains a log, the log is removed, the\
    \ Loc object is added to the trees array list: trees.add(loc);\n\nSo at this point,\
    \ every log inside the 3D cube has been chopped down. A searched array list contains\
    \ every (x,y,z) location in the game world that was. A trees array list contains\
    \ every (x,y,z) location used to help a log.\n\nThe last work the executeCommand()\
    \ method does is to loop through the trees array looking for adjacent logs to\
    \ chop down:\n\n```\nfor (Loc loc : trees) {\n  chopAdjacentTrees(loc);\n}\n```\n\
    \nThe chopAdjacentTrees(Loc) method will look at every block adjacent to the specified\
    \ location to see whether it contains a log. If it does, it will chop down that\
    \ log by turning it into air.\n\nThe method creates a Location object and spotX,\
    \ spotY, and spotZ integers for x, y, and coordinates of that location:\n\n```\n\
    int spotX = spot.getBlockX();\nint spotY = spot.getBlockY();\nint spotZ = spot.getBlockZ();\n\
    ```\n\nNested for loops search a 3x3x3 3D cube around the location:\n\n```\nfor\
    \ (int x = spotX - 1; x < spotX + 2; x++) {\n  for (int y = spotY - 1; y < spotY\
    \ + 2; y++) {\n    for (int z = spotZ - 1; z < spotZ + 2; z++) {\n      // interior\
    \ of loop here\n    }\n  }\n}\n```\n\nA new Loc object is created for the location\
    \ being searched:\n\n```\nLoc loc = new Loc(x, y, z);\n```"
