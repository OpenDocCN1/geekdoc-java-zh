    # STORE INFORMATION WITH ARRAYS


    Computers are ideal for the storage, categorization, and study of information.


    The most basic way that information is stored in a computer program is by putting
    it into a variable. So far, all the variables you''ve worked with have been a
    single item of information, such as a floating-point number or a string.


    A list of Minecraft mobs the player is an example of a larger collection of similar
    information. To keep track of a list of this kind, you can use arrays.


    An array is a group of related variables that share the same type. Any type of
    information that can be stored as a variable can become the items stored in an
    array. Arrays can be used to keep track of more sophisticated types of information
    than a single variable, but they are almost as easy to create and manipulate.'
