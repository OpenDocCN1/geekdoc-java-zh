  md: '# The Power of Inheritance


    You have used inheritance every time you worked with one of the standard Java
    classes such as String or Integer. Java classes are organized into a pyramid-shaped
    hierarchy of classes in which all classes descend from the object class.


    A class of objects inherits from all superclasses that are above it. To get a
    working idea of how this operates, consider the JApplet class. This class is a
    superclass of all applets and Java programs that run in a web browser. The JApplet
    class is a subclass of Applet.


    A partial family tree of JApplet is shown in Figure 13.1. Each of the boxes is
    a class, and the lines connect a superclass to any subclasses below it.


    ![](img/d3a8c962be273f312a438e9a471a1828_177_0.png)


    FIGURE 13.1


    The family tree of the JApplet class.


    At the top is the Object class. JApplet has five superclasses above it in the
    hierarchy: Applet, Panel, Container, Component, and Object.


    JApplet class inherits attributes and behaviors from each of these classes because
    each is directly above it in the hierarchy of superclasses. JApplet does not inherit
    anything from the five green classes in Figure 13.1, which include Dialog and
    Frame, because they are not above it in the hierarchy.


    If this seems confusing, think of the hierarchy as a family tree. JApplet inherits
    from its parent, the parent''s parent, and so upward. It might inherit some things
    from its great-great-great-grandparent, Object. The JApplet class doesn''t inherit
    from its siblings or its cousins, however.'
  merge: -1
  pgno: 177
