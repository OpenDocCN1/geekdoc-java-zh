    # HANDLE ERRORS IN A MOD


    Errors—the bugs, blunders, and typos that prevent a program from running correctly—are
    a natural part of the software development process. “Natural” is probably the
    kindest word that has ever been used to describe them.


    Some errors are flagged by the compiler and prevent you from creating a class.
    Others are noted by the interpreter in response to a problem that keeps it from
    running successfully. Java divided errors into two categories:


    +   * Exceptions—Events that signal an unusual circumstance have taken place as
    a program runs

    * Errors—Events that signal the interpreter is having problems that might be unrelated
    to your program


    Errors normally aren''t something a Java program can recover from, so they are
    not the focus of this chapter. You might have encountered OutMemoryError as you
    worked on Java programs. There''s nothing that can be done in a Java program to
    handle that kind of error after it occurs. The program exits with the error.


    Exceptions often can be dealt with in a way that keeps a program running properly.'
