    # 20


    # TAKE A CENSUS OF MOBS AND VILLAGES


    A useful application of mods is to discover more about Minecraft in real time
    as the game is played. This chapter''s mod takes a census of the mobs that are
    active in the world in the vicinity of the player.


    Mobs are loaded and unloaded by the game as players explore the world. The world
    is divided into chunks that are 16 blocks long, 16 blocks wide, and 256 blocks
    deep. The chunks nearest the player are loaded and another 440 chunks are loaded
    in memory at any time in multiplayer mode. The number of chunks loaded is more
    variable in single-player mode and depends on player movement and the view distance
    (how far a player can see blocks).


    Information about mobs can be retrieved in a Minecraft mod in lists, a data structure
    you learned about during Chapter 14, "Store Objects in Data Structures." Another
    data structure proves helpful in this chapter: hash maps.


    Although the mods you have programmed thus far each one command, a mod can handle
    multiple commands.'
  merge: -1
