  md: '# MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER’S GUIDE


    In this chapter, you learn enough about NetBeans to install the software and put
    it to use throughout this book.


    # Installing NetBeans


    In inausicious beginnings, the NetBeans IDE has grown to become one of the leading
    programming tools for Java developers. James Gosling, the creator of the Java
    language, gave it the ultimate vote of confidence in his foreword to the book
    NetBeans Field Guide: “I use NetBeans for all my Java development.” I’ve become
    a convert as well.


    NetBeans supports all facets of Java programming for the three editions of the
    language—Java Standard Edition (JSE), Java Enterprise Edition (JEE), and Java
    Mobile Edition (JME). It also supports web development, web services, and JavaBeans.


    You can download the software, available for Windows, MacOS, and Linux, from http://netbeans.org.
    The version to choose for this book is the JSE. NetBeans is available for download
    bundled with the Java Development Kit (JDK) and can be downloaded separately.
    You must have NetBeans and the JDK installed on your computer.


    If you’d like to ensure that you’re downloading the same versions of NetBeans
    and the JDK used in the preparation of this book, visit the book’s website at
    www.javaminecraft.com. Click the cover of this book to open the site for this
    edition, and then look for the Download JDK and Download NetBeans 8.0 links. You’ll
    be steered to the proper sites.


    # Creating a New Project


    The JDK and NetBeans are downloaded as installation wizards that set up the software
    on your system. You can install the software in any folder and group you like,
    but it’s best to stick with the default setup options unless you have a good reason
    to do otherwise.


    When you run NetBeans for the first time after installation, you see a start page
    that displays links to news and programming tutorials (see Figure 2.1). You can
    read these within the IDE using NetBeans’ built-in web browser.'
