  md: "# CHAPTER 21 TRANSMUTE MATERIALS IN AN INVENTORY 285\n\nA class method of Material\
    \ can find a material using its name as a string:\nMaterial(String).\n\nThe following\
    \ code uses this method to take a command-line argument and find\nthe material\
    \ that matches that:\n\n```\nif (arguments.length > 1) {\n    input = Material.getMaterial(arguments[0]);\n\
    \    output = Material.getMaterial(arguments[1]);\n}\n```\n\nAn if conditional\
    \ ensures the arguments exist by checking the length variable\nof the String array.\
    \ If this was not done, the program would fail with an error\nindicating that\
    \ an array index was out of bounds.\n\nThe getMaterial() method returns a Material\
    \ if a valid material was named and\null otherwise.\n\nThat null causes the command\
    \ to end prematurely with a message indicating\ninvalid material was specified.\
    \ Here's the code to reject a bad input material:\n\n```\nif (input == null) {\n\
    \    me.sendMessage(arguments[0] + \" is not a known material\");\n    return;\n\
    }\n```\n\nThe return statement ends the executeCommand() method.\n\nWhen both\
    \ the input and output objects contain a valid material, the mod\nproceeds to\
    \ load the player's inventory by calling a Player object's getInventory()\nmethod.\
    \ This method sends back a PlayerInventory object that contains a bunch\nof ItemStack\
    \ objects, each representing 1 of the 40 slots in the inventory (4 armor\nlots,\
    \ 9 hotkey slots, and 24 other slots).\n\nThere's a getSize() to find how many\
    \ slots the playerInventory object\nholds. The following code loops through the\
    \ inventory, calling getItem(int) on\nsslot to get its ItemStack:\n\n```\nfor\
    \ (int i = 0; i < getSize(); i++) {\n    ItemStack items = stack.getItem(i);\n\
    \    // ...\n}\n```\n\nWhen an ItemStack object has no items in it—in other words,\
    \ the slot is empty—ncalling getItem() returns null."
