  md: "# CHAPTER 27 BEFRIEND THE GOD OF LIGHTNING 363\n\nA mob can select a target\
    \ of attack for 12 reasons that are spelled out in the EntityTarget.TargetReason\
    \ enumeration. The names explain the reasons pretty well:\n\n+   - CLOSEST_PLAYER\n\
    - COLLISION\n- DEFEND_VILLAGE\n- FORGOT_TARGET\n- OWNER_ATTACKED_TARGET\n- PIG_ZOMBIE_TARGET\n\
    - RANDOM_TARGET\n- REINFORCEMENT_ENTITY\n- TARGET_ATTACKED_ENTITY\n- TARGET_ATTACKED_NEARBY_ENTITY\n\
    - TARGET_ATTACKED_OWNER\n- TARGET_DIED\n\nThe event has a getReason() method that\
    \ returns one of these values. This mod looks for TargetReason.CLOSE_PLAYER. When\
    \ it finds that a mob has targeted a player for that reason, it calls the mob's\
    \ getLocation() method to find out where it is and then uses the coolest method\
    \ in the World class:\n\n```\nif (event.getReason() == TargetReason.CLOSE_PLAYER)\
    \ {\n    Location loc = entity.getLocation();\n    // here comes the boom!\n \
    \   world.strikeLightning(loc);\n}\n```\n\nThe (x,y,z) location of a lightning\
    \ strike is a bad place to hang out.\n\nThat's how a Minecraft player gets a new\
    \ friend Zeus.\n\nWith the plugin.yml configuration file formatted properly and\
    \ in the right folder, it's time to create BestFriendOfZeus.java so you can put\
    \ this all together:\n\n+   1. Click File, New File.\n2. In the Categories pane,\
    \ select Java.\n3. In the File Types pane, select Empty Java File; then click\
    \ Next."
