  md: "# Creating Behavior with Methods\n\nAttributes are the way to keep track of\
    \ information about a class of objects, but for a class to describe the things\
    \ it was created to, you must create behavior. Behavior describes the parts of\
    \ a class that accomplish specific tasks. Each of these sections is called a method.\n\
    \nYou have been using methods throughout your programs up to this point without\
    \ knowing it, including one in particular: `println()`. This method displays text\
    \ onscreen. Variables, methods are used in connection with an object or a class.\
    \ The name of the object or class is followed by a period and the name of the\
    \ method, as in `robot.move(0)` or `Integer.parseInt()`.\n\n> The System.out.println()\
    \ method might seem confusing because it has two periods instead of one. This\
    \ is because two classes are involved in the statement—the System class and the\
    \ PrintStream class. The System class has a variable called `out` that is a PrintStream\
    \ object. `println()` is a method of the PrintStream class. The `System.out.println()`\
    \ statement means, in effect, \"Use the `println()` method of the instance variable\
    \ of the System class.\" You can chain together references in this way.\n\n# Declaring\
    \ a Method\n\nYou create methods with a statement that looks similar to the statement\
    \ that begins a class. Both can take arguments between parentheses after their\
    \ names, and both use `{` and ` }` marks at the beginning and end. The difference\
    \ is that methods can send a value after they are handled. The value can be one\
    \ of the simple types such as integers or Boolean values, or it can be a class\
    \ of objects.\n\nThe following is an example of a method the `virus` class can\
    \ use to change the `maxSize` variable:\n\n```\npublic boolean changeMaxSize(int\
    \ newSize) {\n    if (newSize > 0) {\n        maxSize = newSize;\n        return\
    \ true;\n    }\n    return false;\n}\n```"
