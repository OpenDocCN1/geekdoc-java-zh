- img_proc: true
  md: "# CHAPTER 23 CHOP DOWN A FOREST OF TREES 311\n\nArray lists hold objects, so\
    \ you might assume that the trees and searched data structures would hold Location\
    \ objects.\n\nThat approach was attempted the first time the mod was developed\
    \ for this chapter, but it requires a huge number of Location objects to be stored\
    \ in the program's memory by the Java Virtual Machine (JVM). A 40x40x40 cube contains\
    \ 64,000 locations, and this mod looks for even more than that because it searches\
    \ beyond the edges of the cube.\n\n![](img/d3a8c962be273f312a438e9a471a1828_324_0.png)\n\
    \n> NOTE To learn more about the kinds of trees you might find in the Minecraft\
    \ world, visit the Minecraft wiki at http://minecraft.gameedia.com/Tree. The wiki\
    \ has grown into an enormous-user edited reference for the game, which is extremely\
    \ useful for mod programmers.\n\nOne word of caution, though: if you like to discover\
    \ things about the world on your own exploring as a player, the wiki will spoil\
    \ some of that experience. Players who edited the wiki have tackled hundreds of\
    \ the game's mysterious inner workings and figured them out.\n\nWhen I encountered\
    \ a desert temple for the first time, it've be cooler not to know what the wiki\
    \ says about them.\n\nThe mod defines an inner class called Loc that is the simplest\
    \ possible representation of an (x,y,z) location. An inner class is defined inside\
    \ a class as if it was an instance variable:\n\n```\nclass Loc {\n    int x, y,\
    \ z;\n\n    Loc(int x, int y, int z) {\n        this.x = x;\n        this.y =\
    \ y;\n        this.z = z;\n    }\n}\n```\n\nThe Loc class has x, y, and z instance\
    \ variables that hold the integer (x,y,z) values. It also has a Loc(int, int,\
    \ int) constructor for creating a Loc object for the specified location.\n\nThis\
    \ class is much smaller and simpler than the Location class. Holding 64,000 or\
    \ more Loc objects in memory causes no noticeable lag."
