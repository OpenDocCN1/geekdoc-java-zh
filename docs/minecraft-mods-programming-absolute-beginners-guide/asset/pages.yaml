  md: "# Threads\n\nIn a Java program, each of the simultaneous tasks the computer\
    \ handles is called a thread and the overall process is called multithreading.\
    \ Threading is useful in animation and many other programs.\n\nThreads are a way\
    \ to organize a program so it does more than one thing at a time. Each task that\
    \ must occur simultaneously is placed in its own thread, and this is often accomplished\
    \ by implementing each task as a separate class.\n\nThreads are represented by\
    \ the Thread class and the Runnable interface, which are both part of the java.lang\
    \ package of classes. Because they belong to this package, you don't have to use\
    \ an import statement to make them available in your programs.\n\nOne of the simplest\
    \ uses of the Thread class is to slow down how fast a program does something.\n\
    \n# Slowing Down a Program\n\nThe Thread class has a sleep() method that you can\
    \ call in any program that should stop running for a short period of time. You\
    \ often see this technique used in a program that features animation because it\
    \ prevents images from being displayed faster than the Java interpreter can handle\
    \ them.\n\nTo use the sleep() method, call Thread.sleep() with the number of milliseconds\
    \ to pause, as in the following statement:\nThread.sleep(5000);\n\nThe preceding\
    \ statement causes the Java Virtual Machine (JVM) to pause for five seconds before\
    \ doing anything else. If for some reason the JVM can't pause that long, an InterruptedException\
    \ is thrown by the sleep() method.\n\nBecause this exception might be thrown,\
    \ you must deal with it in some manner when using the sleep() method. One way\
    \ to do this is to place the Thread.sleep() statement inside a try-catch block:\n\
    \n```\ntry {\n    Thread.sleep(5000);\n} catch (InterruptedException e) {\n  \
    \  // wake up early\n}\n```\n\nWhen you want a Java program to handle more than\
    \ one thing at a time, you must organize the program into threads. Your program\
    \ can have as many threads as needed, and they all can run simultaneously without\
    \ affecting each other."
  merge: -1
