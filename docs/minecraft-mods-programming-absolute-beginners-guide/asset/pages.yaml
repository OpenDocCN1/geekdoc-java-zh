  md: '338 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER''S GUIDE


    # # Creating the Project


    The HealthChecker mod handles events, which requires three things in the program
    to support this functionality:


    +   - The class must implement the Listener interface from the package org.bukkit.event.

    - In the onCreate() method, the mod must be designated as the class listening
    to events.

    - An event handler method must be defined for each event that will be monitored,
    each preceded by an @EventHandler annotation.


    The mod has a display Boolean variable that controls the health points of a mob
