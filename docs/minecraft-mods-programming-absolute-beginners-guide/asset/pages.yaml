    ![](img/d3a8c962be273f312a438e9a471a1828_273_0.png)


    # FIGURE 19.1


    Letting NetBeans fix an error as you write a Java program.


    One of the suggested fixes is Add Import for org.bukkit.plugin.java.JavaPlugin.
    Select this and the following import statement appears in the code: import org.bukkit.plugin.java.JavaPlugin;


    > NOTE This NetBeans feature is why all the programs for the rest of this book
    use import with individual classes instead of an entire package such as org.bukkit.entity.*.

    ‪‪ Most programmers import single classes like this because it''s a better practice.
    Making entire packages available in a program can lead to some confusion when
    two packages contain a class with the same short name. An example in the Java
    Class Library is that java.util and java.sql both have classes named Date.

    ‪‪ If you imported both packages with *, you could not write a statement that
    referenced Date without its full class name.'
