    # # Backing Up a Minecraft World


    This mod has more potential for creating havoc in the Minecraft game world world
    than any other you''ve developed thus far. You can create very strange landscapes
    with holes that alter the path of oceans, ponds, and lava pools and see mobs toppling
    down many blocks to their doom, taking other mobs suddenly into the surface world.


    Before you cause too much chaos, you might want to learn how to save a copy of
    the Minecraft world your server is running.


    The Bukkit server saves its world in three subfolders under the main folder. The
    base name of these three folders is the name of the world, which when you first
    run the server is world.


    So, for the game world named world, it is stored in the subfolders world, world_nether,
    and world_nether_the_end. These folders hold the main world, the Nether dimension,
    and the dimension called The End.


    If the world was named godfather, the subfolders would be godfather, godfather_nether,
    and godfather_nether_the_end.


    To save a backup copy of a Minecraft world, copy all three of the world''s subfolders
    to a new folder location. It is better to do this while the Bukkit server'
  merge: -1
  pgno: 315
- img_proc: true
  md: 'is not running, but it is not impossible to restore a world from a copy made
    off

    running server.


    The name of a world can be determined by opening the server.properties file in

    the main server folder with any text editor. This is a Java properties file that
    has a

    series of field names—one per line—followed by an equal sign and the value for

    that field. The following line sets the world name:


    ```

    level-name=world

    ```


    If you change this name, the server will look for world subfolders matching the

    new name. Finding them causes that to become the current game world.

    The old game world will still exist in its three folders, but it won''t be loaded
    by the

    server.


    If the new world name has no subfolders matching the name, a new world will be

    created and stored in newly created subfolders.


    While you''re putting around in the server.properties file, there''s another field

    you should learn about because it''s a cool way to share and explore Minecraft

    worlds with other players who have their own servers.


    The level-seed field defines a special number called the random number seed for

    the world. A random number seed is a value that controls how random numbers

    are generated in a computer program. If the same seed is used, the same random

    numbers are generated in the same sequence.


    Here''s the default for level-seed in server.properties:

    level-seed=


    The seed has not been specified, so the server chooses one at random when the

    game is created the first time it is played.


    To find the seed when one has not been specified as a server property, run the

    server, play the game, and enter the command /seed. You will see a sequence of

    numbers that could be ridiculously long, as shown in Figure 22.2.'
