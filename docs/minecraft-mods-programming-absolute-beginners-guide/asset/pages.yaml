    # 24


    ![](img/d3a8c962be273f312a438e9a471a1828_334_0.png)


    # RESPOND TO EVENTS IN THE GAME


    Mods can do something once when a command is entered by a player. Enter a /choptrees
    command and chop down a forest of trees.


    Mods can do something that affects game play for a sustained time. Enter /petwolf
    multiple times and attract a pack of wolves who come to your defense whenever
    mobs attack.


    Mods also can do nothing.


    The mod you create during this chapter does nothing until an event happens in
    the game.


    An event is an object that represent things that can happen as a program runs.
    When a user clicks a Save button, that''s an event. When a user closes a window,
    that''s another event. Waiting for an event to happen and doing something in response
    is a kind of programming called event handling. A Java class that handles an event
    is called an event listener.


    In Minecraft, hundreds of different events take place during game play. The mod
    you develop in this chapter does nothing—until a player moves.'
