    \ made from other classes can use that variable—or if they can use it all.\n\n\
    Making a variable public makes it possible to modify the variable from another\
    \ program that is using the Virus object.\n\nIf the other program attaches special\
    \ significance to the number 9201, for instance, it can change identifier to that\
    \ value. The following statements create a Virus object called influenza and set\
