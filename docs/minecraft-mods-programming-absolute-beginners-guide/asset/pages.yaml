  md: '# THE ABSOLUTE MINIMUM


    The final chapter of Minecraft Mods Programming Absolute Beginner’s Guide is only
    the first chapter of your mod programming career.


    With the skills you have developed over these 27 chapters, you have a strong foundation
    for writing mod programs. You can take these skills further on the website I launched
    for readers of this book at www.javaminecraft.com.


    Visit to see the source code files for this book, read answers to questions I’ve
    posed by readers, and share tips and techniques for all new mod programmers who
    are venturing out into the world.


    There’s a lot more to try in Bukkit, which in its current version has 685 Java
    classes. By the time you read this there will likely be more because Mojang has
    released version 1.8 of Minecraft with lots of new mobs, objects, and features
    that mod programmers will be eager to code for. The volunteers who created the
    Bukkit class library strive to keep up with everything added to the game.


    It might sound grandiose to call Minecraft mod programming a career, but Markus
    “Notch” Persson didn’t think Minecraft was a career either when he began it in
    2009—now he’s rich enough to buy 57.4 million copies of his book for his closest
    friends. At full retail price!


    In addition to having skills you can use in a colorful, block-3D world, you will
    find them pretty useful in the real world. Java is currently the world’s most
    widely used programming language, and there’s strong demand for software developers
    who know the language in many fields.


    So if anyone questions the amount of time you spend writing mods, or the time
    you’re playing Minecraft, tell them it’s for your career.


    ![](img/d3a8c962be273f312a438e9a471a1828_383_0.png)'
