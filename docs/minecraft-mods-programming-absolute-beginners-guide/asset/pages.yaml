  md: '# Starting the Project


    MobCensus mod adds two commands to a Minecraft game: /census, which reports the
    count and type of all mobs currently loaded in the game world, and /villager,
    which reports the count and type of villagers and the iron golems who protect
    them.


    Take these steps to create the project:


    +   1. Select File, New Project. The New Project dialog opens.


    +   2. Select the project category Java and type Java Application; then click
    Next.


    +   3. Enter the project name MobCensus.


    +   4. Deselect Main Class in the check box (if necessary), and click Finish.
    The project is created, as you can see in the Projects pane.


    +   5. In Projects pane, right-click the Libraries folder and select the command
    Add Library. That dialog opens.


    +   6. In the Available Libraries pane, select Bukkit.


