  md: '# Storing Text in Strings


    Strings store text and present it to users. The most basic element of a string
    is a character. A character is a single letter, number, punctuation mark, or any
    other symbol.


    In Java programs, a character is one of the types of information that can be stored
    in a variable. Character variables are created with the char type in a statement
    such as the following:


    ```

