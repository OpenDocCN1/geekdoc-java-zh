  md: "# for Loops\n\nIn programming, you find many circumstances in which a loop\
    \ is useful. You can use them to keep doing something several times, such as when\
    \ Minecraft draws flames flickering on a furnace. You can also use loops to cause\
    \ the computer to do nothing for a brief period, such as an animated clock that\
    \ displays the current time once per minute.\n\nA loop statement causes a computer\
    \ program to return to the same place after once, like a stunt plane completing\
    \ an acrobatic loop.\n\nJava's most complex loop statement is for. A for loop\
    \ repeats a section of a program fixed a number of times. The following is an\
    \ example:\n\n```\nfor (int dex = 0; dex < 1000; dex++) {\n    if (dex % 12 ==\
    \ 0) {\n        System.out.println(\"#: \" + dex);\n    }\n}\n```\n\nThis loop\
    \ displays every number from 0 to 999 that is evenly divisible by 12.\nEvery loop\
    \ has a variable that determines when the loop should begin and end. The variable\
    \ is called the counter (or index). The counter in the preceding loop is the variable\
    \ dex.\n\nThe example illustrates the three parts of a for statement:\n\n+   **The\
    \ initialization section:** In the first part, the dex variable is given an initial\
    \ value of 0.\n**The conditional section:** In the second part, there is a conditional\
    \ test like one you might use in an if statement: dex < 1000.\n**The change section:**\
    \ The third part is a statement that changes the value of the dex variable, in\
    \ this example by using the increment operator.\n\nIn the initialization section,\
    \ you set up the counter. The word initialize means to give something an initial\
    \ value and set it up.\n\nYou can create the initialization variable in the for\
    \ statement, as the preceding example does with the integer variable dex. You\
    \ can also create the variable elsewhere in the program. In either case, you should\
    \ give the variable a starting value in this section of the for statement. The\
    \ variable has this value when the loop starts."
