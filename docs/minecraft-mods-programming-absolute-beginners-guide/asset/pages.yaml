    # Multidimensional Arrays


    The arrays thus in the chapter have one dimension, so you can retrieve an element
    using a single number. Some types of information require more dimensions to store
    adequately, as points in (x,y) coordinate system. One dimension of the array could
    store the x coordinate, and the other dimension could store the y coordinate.


    To create an array that has two dimensions, you must use an additional set of
    square brackets when creating and using the array, as in these statements:


    ```

    boolean[][] selectedPoint = new boolean[50][50];

    selectedPoint[4] [29] = true;

    selectedPoint[6] [1] = true;

    selectedPoint[11] [22] = true;

    ```


    This example creates an array of Boolean values called selectedPoint. The array
    has 50 elements in its first dimension and 50 elements in its second dimension,
    so there are 2,500 individual array elements (50 multiplied by 50). When the array
    is created, each element is given the default value of false. Three elements are
    given the value true: a point at the (x,y) position of 4,29; and one at 6,1; and
    one at 11,22.


    Arrays can have as many dimensions as you need, but keep in mind that they take
    up a lot of memory if they are extremely large. Creating the 50-by-50 selectedPoint
    array was equivalent to creating 2,500 individual variables.


    The length variable can be used to find the size of any dimension in a multidimensional
    array.


    For the first dimension, use length with the name of the array, as in selectedPoint.length.
    Subsequent dimensions can be measured using length with the [0] element of that
    dimension. Consider an array called data that was created with the following statement:


    ```

    int[][][] data = new int[12][8][14];

    ```'
