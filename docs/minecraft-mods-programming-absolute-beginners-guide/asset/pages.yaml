  md: '# CHAPTER 19 MAKE ONE MOB RIDE ANOTHER 263


    The ZombieChicken mod spawns 1–10 chickens and an equal number of zombies and
    then turns the zombies into babies and makes them passengers of those chickens.


    The Math.random() class is utilized in Line 37 to generate random quantity of
    mobs.


    The location of each mob is random in the X and Z dimensions. In the Y dimension,
    which tracks how far a player is up or down, the mob''s starting position is five
    blocks higher than the player. This statement in Lines 40–43 creates a Location
    object for that spot:


    ```

    Location chickenSpot = new Location(world,

    spot.getX() + (Math.random() * 15),

    spot.getY() + 5,

    spot.getZ() + (Math.random() * 15));

    ```


    A zombie is created and spawned the same way as a chicken during Chapter 18, "Spawn
    a Mob." A factory method is called in Line 46 with the location and class to spawn:


    ```

    Zombie rob = world.spawn(chickenSpot, Zombie.class);

    ```


    This creates a zombie in the variable rob.


    Zombies are the only hostile mobs in Minecraft that can appear in child or adult
    forms (zombie villagers and zombie pigmen are others). In a mod, you must create
    an adult zombie object and call its setBaby(Boolean) method with the argument
    of true to turn it into a youngster:

    rob.setBaby(true);


    A mob can take a passenger on its back by calling mob object''s setPassenger(Entity)
    method with the passenger as the argument. An is Entity from the org.bukkit.entity
    package. All mobs in the game are subclasses of Entity. This statement makes the
    zombie ride the chicken:

    clucky.setPassenger(rob);


    This mod adds one new wrinkle to mobs by altering the speed at which the chickens
    move. You can customize a mob by adding a potion effect to, just like when your
    player in the game drinks a potion to become invisible, see clearly under the
    ocean surface, and heal.


    Potion effects are created in a mod with the PotionEffect and PotionEffect classes
    in the org.bukkit.potion package.'
