- img_proc: true
  md: '# Object-Oriented Programming Works


    You can think of Java programs you create as objects, just like physical objects
    that exist in the real world. Objects exist independently of other objects, interact
    in specific ways, and can be combined with other objects to form something bigger.
    If you think of a computer program as a group of objects that interact with each
    other, you can design a program that''s more reliable, easier to understand, and
    reusable in other projects.


    The game Minecraft is full of objects. One of them is a Location object, which
    represents a location in the game. Another is World, which represents the entire
    world that players explore. World is an object that is made up of smaller objects—individual
    locations, the blocks at each location, the mobs in the world, and more.


    Each object has things that make it different from other objects. In OOP, an object
    contains two things: attributes and behavior. Attributes are things that describe
    the object and show how it is different from other objects. Behavior is what an
    object does.


    You create objects in Java by using a class as a template. A class is a master
    copy of the object that determines the attributes and behavior an object should
    have. The term class should be familiar to you because Java programs are called
    classes.


    Every program you create with Java is a class that you can use as a template for
    the creation of new objects. As an example, any Java program that uses strings
    is using objects created from the string class. This class contains attributes
    that determine what a string object is and behavior that controls what String
    objects can do.


    With OOP, a computer program is a group of objects that work together to get something
    done. Some simple programs might seem as though they consist of only one object:
    the class file. However, even those programs are using other objects to get work
    done.


    # Objects in Action


    The developers of Minecraft needed an object that represented a spot in the game
    world, they created a Location class for this purpose. A Location object could
    consist of the following:


    +   - Attributes to store the x, y, and z coordinates at that spot


    +   - Behavior to find out what block is at that spot, such as dirt, stone, water,
    or air


    +   - Behavior to calculate the distance between two spots'
