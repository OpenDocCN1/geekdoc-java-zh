  md: "# Creating a Thread\n\nA Java class that can be run as a thread implements\
    \ is referred to as a runnable (or threaded) class. Although you can use threads\
    \ to pause a program’s execution for a few seconds, programmers often use them\
    \ for the opposite reason—to speed up a program. If you put time-consuming tasks\
    \ in their own threads, the rest of the program runs more quickly. This often\
    \ is used to prevent a task from slowing down the responsiveness of a program’s\
    \ graphical user interface (GUI).\n\nFor example, if you have written an application\
    \ that loads stock market price data from disk and compiles statistics, the most-consuming\
    \ task is to load the data. If threads are not used in the application, the program’s\
    \ interface might respond sluggishly as the data is being loaded. This can be\
    \ extremely frustrating to a user.\n\nTwo ways to place a task in its own thread\
    \ include\n\n+   - Putting the task in a class that implements the Runnable interface\n\
    - Putting the task in a class that is a subclass of Thread\n\nTo support the Runnable\
    \ interface, the implements keyword is used when the class is created, and in\
    \ this example:\n\n```\npublic class LoadStocks implements Runnable {\n    //\
    \ body of the class\n}\n```\n\nWhen a class implements an interface, it indicates\
    \ that the class contains extra behavior in addition to its own methods.\n\nClasses\
    \ that implement the Runnable interface must include the run() method, which has\
    \ the following structure:\n\n```\npublic void run() {\n    // body of the method\n\
    }\n```\n\nThe run() method should take care of the task that the thread was created\
    \ to accomplish. In the stock-analysis example, the run() method could contain\
    \ statements to load data from disk and compile statistics based on that data.\n\
    \nWhen a threaded application is run, the statements in its run() method are not\
    \ executed automatically. Threads can be started and stopped in Java, and a thread\
    \ doesn’t begin running until you do two things:"
