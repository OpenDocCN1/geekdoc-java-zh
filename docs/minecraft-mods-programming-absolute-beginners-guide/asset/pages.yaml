  md: "# CHAPTER 12 DESCRIBE WHAT YOUR OBJECT IS LIKE 157\n\nThe concept of scope\
    \ also applies to methods because they are defined by an opening bracket and closing\
    \ bracket. A variable created inside a method cannot be used in other methods.\
    \ You can use a variable in more than one method only if it was created as an\
    \ object variable or class variable.\n\n# ## Putting One Class Inside Another\n\
    \nAlthough a Java program is called a class, there are many occasions when a program\
    \ requires more than one class to get its work done. These programs consist of\
    \ a main class and all helper classes that are needed.\n\nWhen you divide a program\
    \ into multiple classes, there are two ways to define the helper classes. One\
    \ way is to define each class separately, as in the following example:\n\n```\n\
    public class Wrecker {\n    String author = \"Ignoto\";n\n    public void infectFile()\
    \ {\n        VirusCode vic = new VirusCode(1024);\n    }\n}\n\nclass VirusCode\
    \ {\n    int vSize;\n\n    VirusCode(int size) {\n        vSize = size;\n    }\n\
    n\n```\n\nIn this example, the VirusCode class is a helper class for the wrecker\
    \ class. Helper classes often are defined in the same source code file as the\
    \ class they're assisting. When the source file is compiled, multiple class files\
    \ are produced. The preceding example produces the files wrecker.class and VirusCode.class\
    \ when compiled.\n\n> CAUTION If more than one class is defined in the same source\
    \ file, only one of the classes can be public. The other classes should not have\
    \ public in their class statements. The name of the source code file must match\
    \ the public class it defines.\n\n![](img/d3a8c962be273f312a438e9a471a1828_170_0.png)"
  merge: -1
