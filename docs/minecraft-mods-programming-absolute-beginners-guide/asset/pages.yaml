    # THE ABSOLUTE MINIMUM


    The battle is over and you have emerged victorious with another mob to put in
    your warchest.


    The HealthChecker mob showed how to write an event-handling class that listens
    to new types of events related to mobs. Because mobs are called entities in the
    Bukkit class library, these events are called EntityDamageEvent and EntityTargetEvent,
    both from the org.bukkit.entity package.


    The event-handling methods for the classes can be inferred from those class names.
    Add the text on the front and drop the Event from the end, giving you onEntityDamage()
    and onEntityTarget().


    Like all the other event-handling methods, these take the associated event object
    as their only argument.


    There are 11 different event packages in Bukkit. The biggest is the one for mobs,
    org.bukkit.event.entity, which has 40.


    Because you''ll be spending a lot of time poring over the Javadoc documentation
    for Bukkit, this chapter helps to get a head start on that as you write Java programs
    in the NetBeans source code editor.


