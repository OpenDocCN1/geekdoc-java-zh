    1.0 (full), so a 0.7 means that when the buckets are 70 percent full, the capacity
    increases. The defaults are a capacity of 16 and load factor of .75, which often
    are sufficient.


    Generics should be used to indicate the class of the keys and values. They are
    placed within < and > characters, and the class names are separated by a comma,
    as in this example:


    ```

    HashMap<String, Long> phonebook = new HashMap<>();

    ```


    This creates a hash map called phonebook with keys that are strings and values
    that are Long objects. The second set of < and > characters is empty, which assumes
    the same classes as those in the previous < and on that statement.


    Objects are stored in a hash map by calling its put(Object, Object) method with
    two arguments, and the key and value:


    ```

    phonebook.put("Butterball Turkey Line", 8002888372);

    ```


    This stores an item in the hash map with the key "Butterall Turkey Line" and a
    Long object for the value 8002888372—the phone number of that.


    ![](img/d3a8c962be273f312a438e9a471a1828_198_0.png)


    > NOTE These statements are putting Long objects in the hash map using long values.
    This would have been an error in early versions of Java because a primitive data
    type such as long couldn''t be used where an object was required.


    But it''s no longer an error because of autoboxing and unboxing, a feature of
    Java that automatically converts between primitive types and their equivalent
    object classes. When the Java compiler sees a long 8002888372, it converts it
    to a Long object for that value.


    An object can be retrieved from the map with its key by calling get(Object) the
    key as the only argument:


    ```

    long number = phonebook.get("Butterball Turkey Line");

    ```


    The get() method returns null if there''s no value matching that key. This would
    cause a problem with the preceding example because null is not a suitable long
    value.


    Another way to handle that potential problem is to call getDefault(Object, Object).
    If the key specified as the first argument is not found, the second argument is
    returned by default, as in this statement:


    ```

    long number = phonebook.OrDefault("Betty Crocker", -1);

    ```'
