    # Files


    In Java, files are represented by the File class, which is also part of the java.io
    package. Files can be read from hard drives, floppy drives, CD-ROMs, and other
    storage devices.


    A File object can represent files that already exist or files you want to create.
    To create a File object, use the name of the file as the constructor, as in this
    example:


    ```

    File bookName = new File("address.dat");

    ```


    This creates an object for a file address.dat in the current folder. You can also
    include a path in the filename:


    ```

    File bookName = new File("data\address.dat");

    ```


    > NOTE This example works on a Windows system, which uses the backslash (\) character
    as a separator in pathnames and filenames. Linux and other Unix-based systems
    use a forward slash (/) instead. To write a Java program that refers to files
    in a way that works regardless of the operating system, use the class variable
    File.pathSeparator instead of a forward or backslash, as in this statement:


    When you have a File object, you can call useful methods on that object:


    +   - exists()—true if the file exists, false otherwise

    - getName()—The name of the file, as a String

    - length()—The size of the file, as a long value

    - createFile()—Creates a file of the same name, if one does not exist already

    - delete()—Delete the file, if it exists

    - renameTo(File)—Renames the file, using the name of the File object specified
    as an argument


    You can also use a File object to represent a folder on your system rather than
    a file. Specify the folder name in the File constructor, which can be absolute
    (such as C:\MyDocuments\\) or relative (such as java\database\).


