  md: '# Statements and Expressions


    A computer program is a set of instructions that tell the computer what to do.
    Each instruction is called a statement. The following example from a Java program
    is a statement:


    ```

    int highScore = 450000;

    ```


    You can use brackets to group a set of statements together in a program. The groupings
    are called block statements. Consider the following portion of a program:


    ```

    1: public static void main(String[] arguments) {

    2: int a = 3;

    3: int b = 4;

    4: int c = 8 * 5;

    5:}

    ```


    Lines 2–4 of this example are a block statement. The opening bracket on Line 1
    denotes the beginning of the block, and the closing bracket on Line 5 denotes
    the end of the block.


    Some statements are called expressions because they involve a mathematical expression
    and produce a result. Line 4 in the preceding example is an expression because
    it sets the value of the c variable to 8 multiplied by 5. You work with expressions
    during this chapter.


    # Assigning Variable Types


    Variables are the main way that a computer remembers something as it runs a program.
    The splash program in Chapter 4 used the greeting variable to hold the text of
    a cryptic message like the ones on the Minecraft splash screen. computer needed
    to remember that text the message could be displayed later.


    In a Java program, variables are created with a statement that must include two
    things:


    +   - The name of the variable

    - The type of information the variable will store


    Variables also can include the value of the information being stored.


    To see the different types of variables and how they are created, fire NetBeans
    and create a new empty Java file in the package com.javaminecraft with the class
    name Variable.'
