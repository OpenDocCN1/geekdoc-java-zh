    # THE ABSOLUTE MINIMUM


    Although it''s fun to kill mobs and finish achievements in Minecraft, the most
    addictive aspect of the game is building and destroying stuff. Like a small child
    with a stack of wooden blocks or Godzilla clambering ashore in Tokyo, a Minecraft
    player has great power to wreak havoc on the world—and not necessarily great responsibility.


    What a player can do, a mod can do with the Bukkit class library.


    The first step in the process of learning to build and destroy the world in a
    mod was completed this chapter. You were introduced to the Material class and
    discovered how to examine materials and transform them.


    You also took your first look at the Bukkit documentation.


    It won''t be the last.


    Minecraft programming is a moving target. The Minecraft game is still getting
    col new upgrades from Mojang, and the developers of the Bukkit class library and
    do their best to keep up with them, feature by feature.


    Becoming a mod programmer is an exploratory process. Instead of attempting to
    memorize all the classes and methods before you put them in, it is generally more
    effective to stumble around learning things as you code mods and examine mods
    created by other programmers who share their source code.


    When you hit something that''s perplexing or completely new to you, the Bukkit
    documentation helps you puzzle it out and achieve the effect you seek.


    ![](img/d3a8c962be273f312a438e9a471a1828_304_1.png)'
