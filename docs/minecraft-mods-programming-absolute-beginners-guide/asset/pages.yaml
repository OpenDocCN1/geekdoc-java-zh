    the game world and counting as it ascends. Because spot holds the player''s location,
    the code spot.getY() + 10 + Math.random() * 100 is a value from 10 to 110 blocks
    above the player''s Y location.


    The X and Z locations are -15 to 15 away from the player''s X and Z location.


    The result of this is to pick a spot for the chicken that''s above the player—potentially
    way above—pretty close in the two dimensions.


    When you generate a location in a Minecraft mod, keep in mind that each block
    in the game can be air or some other material. If you put a chicken in a stone
    block, that would be a fate most fowl and would be instantly killed.


    You can prevent this by figuring what kind of material is at a specific location.
    This mod accomplishes this with the following code:


    ```

    if (chickenSpot.getBlock().getType() != Material.AIR)

    // don''t put the chicken in a solid block

    ```


    The conditional uses a pretty complex Java statement in which a method returns
    an object and that object''s method is called. (You did something similar earlier
    in the book any time you called system.out.println() to display text.)


    A Location object has a getBlock() method that returns the block at that location
    as a Block object from the org.bukkit.block package.


    A Block object has a getType() method that returns the block''s material type,
    which is a value represented by a Material variable. The AIR variable represents
    a block of air (naturally).


    So calling chickenSpot.getBlock().getType() returns the type of material in the
    block at that location. Comparing this to Material.AIR checks whether it is.


    The chicken is spawned by calling a factory method of the World object holding
    the game world:


    ```

    Chicken clucky = world.spawn(chickenSpot, Chicken.class);

    ```


    The spawn(Location, Class) method spawns a mob of the specified class at the specified
    location. It also returns this mob as an object you can store in a variable.


    The Chicken.class argument represents the class of the mob you want to spawn.
    In Java, following a class name with .class accomplishes this purpose.


    The chicken created by this statement is stored in the variable clucky. It is
    a Chicken object in the org.bukkit.entity package.'
