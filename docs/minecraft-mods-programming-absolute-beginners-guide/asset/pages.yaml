    # Exceptions That Don’t Need Catch


    Although this chapter has shown that exceptions need to be caught with try-catch
    or declared to be thrown with a throws clause, there’s an exception.


    Some exceptions that might occur as a Java program runs don’t have to be handled
    in any way. The compiler won’t come to a screaming halt when it detects that exception
    is ignored.


    These exceptions are called unchecked exceptions, while the others are checked
    exceptions.


    Unchecked exceptions are subclasses of RuntimeException in the java.lang package.
    A common example of an unchecked exception is IndexOutOfBoundsException, which
    indicates that the index used to access an array, a string, or an list is not
    within its boundaries. If an array has five elements and you attempt to read number
    10, this exception occurs.


    Another is NullPointerException, which occurs when an object is used that has
    no value. Object variables have the null value before they are assigned an object.
    Some methods also return null when an object can’t be returned. If a statement
    incorrectly assigns an object has a value, a NullPointerException Occurs.


    Both of these errors are things a programmer could (and should) prevent in the
    code, not things that require exception handling. If you write a program that
    accesses an out-of-bounds array element, fix the code that does and recompile
    it. If you expect an object and it equals null, check for that with an if conditional
    before using the object.


    The rationale for unchecked exceptions in Java is that they either can be prevented
    by well-written code or they could occur so often that catching them all the time'
