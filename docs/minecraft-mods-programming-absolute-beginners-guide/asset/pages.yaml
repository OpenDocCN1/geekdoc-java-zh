  md: "# CHAPTER 18 SPAWN MOB 249\n\n> CAUTION Word to the wise: Spawning 1,000 chickens\
    \ is a good way to send many Minecraft servers deep into lag-chicken-clucking,\
    \ server-throttling, maybe-this-wasn't-the-best-idea. In a later mod you'll be\
    \ shown how to use lightning bolts to bring some sanity to a game world that has\
    \ become overpopulated with mobs, but for now take care not to overdo your chickens.\n\
    \n![](img/d3a8c962be273f312a438e9a471a1828_262_0.png)\n\nThis mod creates a random\
    \ number of chickens, so you need a way in Java to generate a random value.\n\n\
    The Class in the java.lang package has a Random() class method that returns a\
    \ random double value from 0.0 to 1.0, including 0.0 as a potential value but\
    \ not 1.0. You can multiply this value by an integer to get a random number from\
    \ 0 to one less than that.\n\nChickenStorm multiplies Math.random() times NUM_CHICKENS\
    \ and adds 1, which produces a random number from 1 to the maximum number of chickens.\
    \ This is used in the conditional of a for loop that spawns the chickens:\n\n\
    ```\nfor (int i = 0; i < Math.random() * NUM_CHICKENS + 1; i++) {\n  // code to\
    \ spawn a chicken here\n}\n```\n\nWhen a chicken is spawned, it requires the location\
    \ where mob should be placed. Locations are created with the constructor Location(World,\
    \ double, double). The four arguments to the constructor are the game world and\
    \ the (x,y,z) coordinates of that location.\n\nMobs are spawned near the player\
    \ who issued the command to create them. You can find a player's (x,y,z) coordinates\
    \ by calling the Location object of the player's getX(), getY(), and getZ() methods.\n\
    \nPutting a chicken at the same location as the player would be accomplished with\
    \ this statement:\n\n```\nLocation chickenSpot = new Location(world, spot.getX(),\n\
    spot.getY(), spot.getZ());\n```\n\nThis mod does something more complicated. It\
    \ puts each chicken from 10 to 110 blocks above the player and up to 15 blocks\
    \ away from the player in the X and Z planes. Here's the statement to do that,\
    \ which makes use of Math.random() again:\n\n```\nLocation spot = new Location(world,\n\
    spot.getX() - 15 + Math.random() * 30,\nspot.getY() + 10 + Math.random() * 100,\n\
    spot.getZ() - 15 + Math.random() * 30);\n```"
