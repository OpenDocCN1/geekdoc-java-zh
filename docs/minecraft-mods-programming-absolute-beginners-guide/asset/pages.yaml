  md: '# CHAPTER 11 CREATE YOUR FIRST OBJECT 137


    > NOTE When a method such as System.out.println() requires a string argument,
    you can use the + operator to combine several types of information in that argument.
    As long as the things being combined is a string, the combined argument is converted
    into a string.


    Converting information to a new form is called casting. Casting produces a new
    value that is a different type of variable or object from the source. You don''t
    actually change the value when casting. Instead, a new variable or object is created
    in the format you need.


    The terms source and destination are useful when discussing the concept of casting.
    The source is some kind of information in its original form—whether it''s a variable
    or an object. The destination is the converted version of the source in a new
    form.


    # Casting Simple Variables


    With simple variables, casting occurs most commonly between numeric variables
    such as integers and floating-point numbers. One type of variable that cannot
    be used in any casting is a Boolean value.


    To cast information into a new format, you precede it with the new format surrounded
    by parentheses. For example, if you want to cast something into a long variable,
    you precede it with (long). The following two statements cast a float value into
    an int:


    ```

    // cast a float variable

    float source = 7.06F;

    // cast it to an integer

    int destination = (int) source;

    ```


    In variable casting where the destination holds larger values than the source,
    the value is converted easily, such as when a byte cast into an int. A byte holds
    values from -128 to 127, whereas an int holds values from -2.1 billion to 2.1
    billion. No matter what value the byte variable holds, the new int variable has
    plenty of room for it.


    You sometimes can use a variable in a different format without casting it at all.
    For example, you can use char variables as if they were int variables. Also, you
    can use int variables as if they were long variables, and anything can be used
    as a double.'
