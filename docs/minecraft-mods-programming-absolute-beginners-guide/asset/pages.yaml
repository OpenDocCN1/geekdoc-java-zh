  md: '# MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER''S GUIDE


    NOTE Java programs can be run on your computer by the JRE and JDK. You might be
    wondering why there are two programs filling this purpose and how they differ
    from each other.

    The JRE is a Java virtual machine for anyone who wants to run Java programs on
    a computer or other device. You can make sure your computer has one, and update
    the one you have, by visiting the website www.java.com. If you have been playing
    Minecraft on a computer, it has a version of the JRE.

    The JDK is a set of programs for developing Java programs. You might have one
    on your computer, but its is less likely than having the JRE. When you begin writing
    Java programs in the next chapter, you will be installing NetBeans, which is software
    that uses the JDK behind the scenes.


    Open that folder, then open its bin subfolder. There should be a couple applications,
    including one called java.


    Your computer''s Path variable needs to be updated to include the full name of
    this folder, which is like C:\Program Files\jdk1.8.0\bin (with your own JDK version
    number).


    To add the Java virtual machine to the Path, perform these steps:


    +   1. Open the Control Panel.

