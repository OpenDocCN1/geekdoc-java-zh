  md: '# What You Need to Write Programs


    To create Minecraft mods or any other Java programs, you must have a programming
    tool that supports the Java Development Kit (JDK) such as the NetBeans integrated
    development environment (IDE). You need a tool that can compile and run Java programs
    and a text editor to write those programs.


    With most programming languages, computer programs are written by entering text
    into a text editor (also called a source editor). Some programming languages come
    with their own editor. NetBeans includes its own editor for writing Java programs.


    Java programs are simple text files without any special formatting, such as centered
    text or boldface. The NetBeans source code editor functions like a simple text
    editor with some extremely useful enhancements for programmers. Text turns different
    colors as you type to identify different elements of the language. NetBeans also
    indents lines properly and provides helpful programming documentation inside the
    editor.


    Because Java programs are text files, you can open and edit them with any text
    editor. You could write a Java program with NetBeans, open it in Notepad or Text
    Edit and make changes, and then open it again in NetBeans without any problems.


    # Creating the Splash Program


    One of the funny quirks of Minecraft is the random message that displays in the
    game client when the program is run. It appears as yellow text across a corner
    of the Minecraft logo, as shown in Figure 4.1.'
