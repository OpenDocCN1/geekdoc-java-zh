    # Operator Precedence


    When you are using an expression with more than one operator, you need to know
    what order the computer uses as it works out the expression. Consider the following
    statements:


    ```

    int y = 10;

    y = y * 3 + 5;

    ```


    Unless you know order the computer uses when working out the math in these statements,
    you cannot be sure what the x variable will be set. It could be set to 35 or 80,
    depending on whether y * 3 + 5 is evaluated first.


    The following evaluation order is used when working out an expression:


    +   1. Incrementing and decrementing take place.

    2. Multiplication, division, and modulus division occur next.

    3. Addition and subtraction follow.

    4. Comparisons take place next.

    5. The equal sign (=) is used to set a variable''s value.'
