  md: '# Creating Your First Mod


    Mods are packaged as Java archive files, also called JAR files, the free integrated
    development environment from Oracle throughout this book, automatically creates
    JAR files every time you build a project.


    When you have finished writing a mod, you will be storing it under the server''s
    folder in a subfolder plugins.


    The mod you are creating is a simple one that demonstrates the framework you''ll
    use in every mod you create for Bukkit. The mod adds a /petwolf command to the
    game that creates a wolf mob, adds it to the world, and makes you (the player)
    its owner.


    > CAUTION There are two similar things you encounter a lot when doing Minecraft
    programming: mod and mob. A mod is a Java program that runs on a server to add
    something cool to the game. A mob is any living creature in the game, such as
    a creeper, chicken, cow, spider, catoblepas.

    Actually, there are no catoblepas in Minecraft. I was just making sure you were
    paying attention.


    Each mod will be its own project in NetBeans. To begin this project, follow these
    steps:


    +   1. In NetBeans, select the menu command File, New Project. The New Project
    wizard opens.


    +   2. In the Categories pane, select Java, and in the Projects pane, select Java
    Application. Then click Next.


    +   3. In the Project Name field, enter PetWolf (with no spaces and capitalized
    as shown).


    +   4. Click the Browse button next to the Project Location field. The Select
    Project Location dialog appears.


    +   5. Find the folder where you installed the Minecraft server. Select it and
    click Open. The folder appears in the Project location field.


    +   6. Deselect the Create Main Class check box.


    +   7. Click Finish.


    ThePetWolf project is created, and two folders appear in the Projects pane, Source
    Packages and Libraries, as shown in Figure 3.1.'
