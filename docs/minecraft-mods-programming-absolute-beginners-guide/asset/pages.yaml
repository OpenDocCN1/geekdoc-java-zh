  md: "The ( and ) statements in a program define the boundaries for a variable's\
    \ scope.\nAny variable created within these marks cannot be used outside of them.\
    \ For\nexample, consider the following statements:\n\n```\nif (numFiles < 1) {\n\
    \    String warning = \"No files remaining.\";\n}\nSystem.out.println(warning);\n\
    ```\n\nThis code does not work—and does not compile in NetBeans—because the\n\
    warning variable was created inside the brackets of the if block. Those brackets\n\
    define the scope of the variable. The warning variable does not exist outside\
    \ of the\nbrackets, so the System.out.println() method cannot use it as an argument.\n\
    \nWhen you use a set of brackets inside another set of brackets, you need to pay\n\
    attention to the scope of the enclosed variables. Take a look at the following\n\
    example:\n\n```\nif (infectedFiles < 5) {\n    int status = 1;\n    if (infectedFiles\
    \ < 1) {\n        boolean firstVirus = true;\n        status = 0;\n    } else\
    \ {\n        firstVirus = false;\n    }\n}\n```\n\nSee any problems? In this example\
    \ the assigns a value of false to the firstVirus variable\nbut the statement causes\
    \ a compiler error. Because firstVirus is created within the scope of the\nif\
    \ (infectedFiles < 1) statement, it doesn't exist inside the scope of the else\n\
    statement that follows.\n\nTo fix the problem, firstVirus must be created outside\
    \ both of these blocks so\nt its scope includes both of them. One solution is\
    \ to create firstVirus one line\nafter status is created.\n\nRules that enforce\
    \ scope make programs easier to debug because scope limits the\narea in which\
    \ you can use a variable. This reduces one of the most common errors\nthat crop\
    \ up in programming—using the same variable two different ways in\ndifferent parts\
    \ of a program."
  merge: -1
  pgno: 169
