    # THE ABSOLUTE MINIMUM


    Threads are a powerful concept implemented with a small number of classes and
    interfaces in Java. By supporting multithreading in your programs, you make them
    more responsive and can speed up how quickly they perform tasks.


    Every Minecraft mod has to be careful not to cause the server to lag, which players
    hate more than creepers dropping by and blowing up their house. One way to reduce
    this possibility is to put time-intensive tasks in their own threads.'
