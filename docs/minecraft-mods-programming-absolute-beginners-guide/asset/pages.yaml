    # CREATE YOUR FIRST OBJECT


    One of the more fearsome examples of jargon that you encounter in this book is
    object-oriented programming (OOP). This complicated term describes, in an elegant
    way, what a computer program is and how it works.


    Before OOP, a computer program was usually described as a set of instructions
    listed in a file and handled in some kind of reliable order.


    By thinking of a program as a collection of objects, you can figure out the tasks
    a program must accomplish and assign the tasks to the objects where they best
    belong.'
