    Translated into English


    The main statement is the entry point to most Java programs. Mods are an exception
    because they run by the Bukkit server and cannot be run directly. When a player
    types a command that a mod supports, the server runs that mod.


    Some other exceptions are applets, programs that run on a web page by a browser;
