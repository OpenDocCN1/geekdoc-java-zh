  md: '# Array Lists


    In Chapter 10, "Store Information with Arrays," you were introduced to arrays,
    an extremely handy way to work with groups of variables and objects in programs.
    Arrays are so essential to Java that they are built-in data type like integers
    and characters. An array packages together elements of the same data type or class.


    As useful as arrays can be, they are limited by the fact that the size of an array
    does not change. After an array is created to hold 90 elements, it cannot be altered
    to hold more or fewer. The size is fixed.


    There''s a class in the java.util package that does everything an array can do
    without that limitation: ArrayList.


    An array list is a data structure that holds objects of the same class or a common
    superclass. The list can grow or shrink as needed as a program is running.


    The simplest way to create an array list is by calling its constructor with no
    arguments:


    ```

    ArrayList servants = new ArrayList();

    ```


    Array lists can be created by specifying an initial capacity, which provides some
    guidance on how many elements the list might hold. The capacity is set as an integer
    argument to the constructor:


    ```

    ArrayList servants = new ArrayList(30);

    ```


    Although this looks like creating an array and determining its exact size, the
    capacity is just a hint. If the capacity is exceeded, the array list will be adjusted
    accordingly and continue to function properly. (The better you estimate the capacity,
    the more efficient the program will be.)


    The list holds objects that belong to the same class or share a superclass.


    When you create an array list, you know the class or superclass the list is intended
    to hold. This can be specified in the constructor with < and > signs, a feature
    of the language called generics. Here''s an improvement on the constructor for
    a list that holds String:


    ```

    ArrayList<String> servants = new ArrayList<String>();

    ```


    To add an object, call the list''s add(Object) method with that object as your
    argument. Here are statements that add five strings:


    ```

    servants.add("Bates");

    servants.add("Anna");

    servants.add("Thomas");

    servants.add("Mrs. O''Brien");

    servants.add("Daisy");

    ```'
