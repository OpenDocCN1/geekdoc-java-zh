  md: 'Objects in OOP work for themselves whenever possible. This capability makes
    it easier to incorporate them in other programs. If a Location object did not
    know how to figure out what block it holds, for instance, every time you used
    that Location object in another program, you would have to create behavior to
    determine that information.


    For another example of OOP, consider an Internet router that offers wireless Internet
    connectivity to a house.


    The router, like any computer program, can be thought of as a group of objects
    that work together. It could be broken down into the following:


    +   - A Modem object, which knows its attributes as connection speed and has behavior—for
    example, it can make the router accept a wireless connection to websites and Internet
    servers


    +   - A Network object, which keeps track of which devices are connected to the
    router and blocks unauthorized access


    Each object exists independently of the other.


    One advantage of designing a completely independent Modem object is that it could
    be used in other programs that need that.


    Another reason to use self-contained objects is that they are easier to debug.
    Computer programs quickly become unwieldy in size. If you''re debugging something
    like a Modem object and you know it''s not on anything else, you can focus on
    making sure the Modem object does the job it''s supposed to do and holds the information
    that it needs to do its job.


    Learning an object-oriented language such as Java as your first programming language
    can be advantageous because you''re not unlearning the habits of other styles
    of programming.


