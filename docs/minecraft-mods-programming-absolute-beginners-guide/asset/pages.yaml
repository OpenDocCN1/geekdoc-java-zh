  md: '# CHAPTER 18 SPAWN MOB 245


    NOTE The mod framework includes something unusual in the line immediately preceding
    the start of the onCommand() method: the text Override. This is a special message
    about the code called an annotation. Annotations provide extra information a program
    that could be helpful for the Java compiler and Java virtual machine. They are
    like comments that are readable by both humans and computers, although they do
    not in any change the code itself. All annotations begin with the at sign (@).
    The purpose of the annotation @override is to indicate that a method overrides
