    The source code editor opens with the new file plugin.yml ready to be written.

    Enter the text of Listing 19.1 into the editor, and save it by selecting the menu
    command File, Save or clicking Save All on the NetBeans toolbar.


    # LISTING 19.1 The Full Text of plugin.yml


    ```

    1: name: ZombieChicken

    2:

    3: author: Your Name Here

    4:

