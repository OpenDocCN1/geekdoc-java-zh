    # Why Classes Are Synchronized


    Array lists and hash maps are data structures that are new versions of vectors
    and hash tables. The new versions don''t require synchronization, an advanced
    concept in Java that requires some understanding of how Java programs run.


    Synchronization is how the Java Virtual Machine ensures that an object''s instance
    variables and methods are accessed in a consistent and accurate manner by other
    users of the object.


    This concept will make more sense when you learn about threads in Chapter 16,
    "Create a Threaded Mod." Java programs can be designed to do more than one task
    simultaneously. Each task is put in its own thread.


    When multiple threads are accessing the same object, it''s vital that the object
    acts the same in each thread. So the method of a class requires synchronization,
    as vectors and hash tables do, the Java Virtual Machine has to work harder and
    can encounter errors that may cause a thread to stop running.


    This is why array lists and hash maps replicate the functionality of vectors and
    hash tables. Data structures were needed that don''t require synchronization and
    run much more efficiently as a consequence.


    # THE ABSOLUTE MINIMUM


    Array lists and hash maps are two of the more useful data structures in the java.util
    package. The Array list class expands on the functionality of arrays, making it
    possible to overcome the fixed-size limitation of that data type. Hash maps enable
    any kind of object to be used as the key to retrieve a value.


    There are also bit sets (the BitSet class), which hold 0-and-1 bit values; stacks
    (Stack), which are last-in, first-out collections of data similar to array lists;
    and properties (Properties), a specialized hash map that holds configuration properties
    for a program in a file or another permanent storage place.


    ![](img/d3a8c962be273f312a438e9a471a1828_201_0.png)'
