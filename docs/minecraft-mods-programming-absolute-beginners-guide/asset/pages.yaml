  md: 'Minecraft into anything you can imagine, without becoming a technical expert!
    This book is the fastest way to master Minecraft modding and use Java to transform
    Minecraft''s worlds, tools, behavior, weapons, structures, mobs... everything!
    (Plus, you''ll learn Java programming skills you can use anywhere.) Learn how
    to do what you want, the way you want, one incredibly easy step at a time. Modding
    Minecraft has never been this simple!


    ![](img/d3a8c962be273f312a438e9a471a1828_403_0.png)


    # Who knew how simple Minecraft modding could be?


    This is the easiest, most practical beginner''s guide to creating killer Minecraft
    mods in Java... simple, reliable, full-color instructions for doing everything
    you want to do! Here''s a small sample of what you''ll learn:


    +   - Set up your Minecraft server and development tools

    - Master Java basics every Minecraft modder needs to know

    - Read, write, store, and change information through your mod

    - Build mods that can make decisions and respond to player actions

    - Understand object-oriented programming and the objects you can program in Minecraft

    - Handle errors without crashing Minecraft

    - Use threads to create mobs that can do many things at once

    - Customize your mobs, and build on existing objects to write new mods

    - Spawn new mobs, find hidden mobs, and make one mob ride another

    - Dig holes and build structures

    - Create projectile weapons and potion effects

    - Share your mods with the world


    ![](img/d3a8c962be273f312a438e9a471a1828_403_1.png)


    Rogers Cadenhead is a programmer and author. He has written many books on programming
    and the Internet, including Sams Teach Yourself Java in 24 Hours and also publishes
    the Drudge Retort and other websites that receive massive acclaim.


