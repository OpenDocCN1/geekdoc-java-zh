  md: '# Compiling the Program into a Class File


    Before you can run a Java program, you must compile it. When you compile a program,
    the instructions given to the computer in the program are converted into a form
    the computer can better understand.


    NetBeans compiles programs automatically as they are saved. If you typed everything
    as shown in Listing 4.2, the program compiles successfully.


    A compiled version of the program, a new file called splash.class, is created.
    All Java programs are compiled into class files, which are given the .class file
    extension. A Java program can be made up of several classes that work together,
    but in a simple program such as splash only one class is needed.


    The compiler turns Java source code into bytecode, a form that can be run by a
    Java Virtual Machine (JVM).


    > NOTE The compiler speaks up only when there''s an error to complain about. If
    you compile a program successfully without any errors, nothing happens in response.
    This is disappointing. When I was starting out as a Java programmer, I was hoping
    successful compilation would be met with a grand flourish of celebratory horns.


    ![](img/d3a8c962be273f312a438e9a471a1828_59_0.png)


    # Fixing Errors


    As you compose a program in the NetBeans source editor, errors are flagged with
    a red alert icon to the left of the editor pane, as in Figure 4.3.'
