  md: '# THE ABSOLUTE MINIMUM


    During this chapter you were introduced to an entirely different kind of mod.


    Instead of doing something in response to a command, you made the mod wait to
    take action until a player generated an event by moving from one block to another.


    The mod is an event listener waiting for the class of event it handles: the PlayerMoveEvent
    class from the org.bukkit.player package. A class becomes an event listener by
    using implements in the class declaration and registering to monitor events in
    the Minecraft server''s mod manager.


    When a player moves, the event occurs and is detected when the onPlayerMoveEvent()
    method is called in the event listener class.


    A mod that listens to events can have a large impact on the play experience of
    Minecraft. They''re one of the most entertaining ways to extend the game by programming
    mods.


    ![](img/d3a8c962be273f312a438e9a471a1828_346_0.png)'
