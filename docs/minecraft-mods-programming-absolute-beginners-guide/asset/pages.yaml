  md: "# CHAPTER 9 REPEAT AN ACTION WITH LOOPS 109\n\nThe conditional section contains\
    \ a test that must remain true for the loop to continue looping. When the test\
    \ is false, the loop ends. In this example, the loop ends when the dex variable\
    \ is equal to or greater than 1,000.\n\nThe last section of the for statement\
    \ contains a statement that changes the value of the counter variable. This statement\
    \ is handled each time the loop goes around. The counter variable has to change\
    \ in some way or the loop ends. In the example, dex is incremented by 1 in the\
    \ change section. If dex was not changed, it would stay at its original value\
    \ of 0 and the conditional dex < 1000 would always be true.\n\nThe for statement\
    \ is executed during each trip through the loop.\nThe preceding example has the\
    \ following statements inside the for block:\n\n```\nif (dex % 12 == 0) {\n  \
    \  System.out.println(\"#\" + dex);\n}\n```\n\nThese statements are executed 1,000\
    \ times. The loop starts by setting the dex variable to 0. In each pass through\
    \ the loop, it adds 1 to dex. When dex is no longer less than 1,000, the loop\
    \ stops looping.\n\n> NOTE An unusual term you might hear in connection with loops\
    \ iteration. An iteration is a single trip (or step) through a loop. The counter\
    \ variable is used to control the loop is called an iterator.\n\nAs you have seen\
    \ with if statements, a for loop does not require brackets if it contains only\
    \ a single statement. This is shown in the following example:\n\n```\nfor (int\
    \ p = 0; p < 500; p++) {\n    System.out.println(\"Never befriend a creeper\"\
    );\n}\n```\n\nThis loop displays the text \"Never befriend a creeper\" 500 times.\
    \ Although brackets are not required around a single statement inside a loop,\
    \ you can use to make the block easier to spot, like so:\n\n```\nfor (int p =\
    \ 0; p < 500; p++) {\n    System.out.println(\"Never befriend a creeper\");\n\
    }\n```\n\nThe first program you create this chapter displays the first 200 multiples\
    \ of 9: 9, 18, 27, and so on, to 1,800 (9 × 200). In NetBeans, create a new empty\
    \ Java file named Nines in the com.javaminecraft package and enter the text of\
    \ Listing 9.1. When you use it, it is stored as Nines.java.\n\n![](img/d3a8c962be273f312a438e9a471a1828_122_0.png)"
