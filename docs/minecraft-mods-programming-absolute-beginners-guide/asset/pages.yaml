  md: 'A shorter way to do this is to use the ternary operator. A ternary expression
    has five parts:


    +   - The condition to test, surrounded by parentheses, as in (skillLevel > 5)

    - A question mark (?)

    - The value to use if the condition is true

    - A colon (:)

    - The value to use if the condition is false


    To use the ternary operator to set numberOfMobs based on skillLevel, you could
    use the following statement:


    ```

    int numberOfMobs = (skillLevel > 5) ? 20 : 10;

    ```


    You can also use the ternary operator to determine what information to display.
    Consider the example of a program that displays the text "Mr." or "Ms." depending
    on the value of the gender variable. A statement that accomplishes this:


    ```

    System.out.print(gender.equals("male") ? "Mr." : "Ms.");

    ```


    The ternary operator can be useful, but it''s also the hardest conditional in
    Java to understand. As you learn Java, you don''t encounter any situations where
    the ternary operator must be used instead of if-else statements.


