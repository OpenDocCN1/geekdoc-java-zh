    # DISPLAY A MOB’S HEALTH DURING COMBAT


    Although Minecraft is commonly described as a building game, there''s also a lot
    of enjoyment to be had from facing off in combat against mobs, other players,
    and the occasional unfortunate animal you need food, a leather hide, chicken feathers,
    or some other item.


    The mod for this chapter enhances combat by adding a feature to Minecraft that
    appears in many MMORPGs and other games: a health bar above a foe that indicates
    how much damage it has taken in battle.


    The mod displays the bar with the help of two event-handling methods for objects
    in the org.bukkit.entity package: onEntityDamage() and onEntityTarget(). The method
    names tell you names of the event classes, which are EntityDamageEvent and EntityTargetEvent.
    Just drop the on at the start of the method name and add Event to the end. This
    convention is followed throughout the event-handling classes in the Bukkit class
    library.


    It''s time to enter the fray.'
