  md: "# 112 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER'S GUIDE\n\n![](img/d3a8c962be273f312a438e9a471a1828_125_0.png)\n\
    \nCAUTION A loop will loop for as long as the condition remains true. Usually\
    \ in a program where a loop does not end, something else in the program is set\
    \ up to stop execution in some way. For example, a loop in a game program could\
    \ continue indefinitely while the player still has lives.\n\nOne bug that crops\
    \ up often as you work on programs is an infinite loop, a loop that never stops\
    \ because of a programming mistake. If one of the Java programs you run in NetBeans\
    \ gets stuck in an infinite loop, press the red alert icon to the left of the\
    \ Output pane. This stops execution of the program.\n\n# do-while Loops\n\nThe\
    \ do-while loop is similar to the while loop, but the conditional test goes in\
    \ a different place. The following is an example of a do-while loop:\n\n```\n\
    do {\n    // the statements inside the loop go here\n} while (gameLives > 0);\n\
    ```\n\nLike the while loop, this loop continues looping until the gameLives variable\
    \ is no longer than 0. The do-while loop is different because the conditional\
    \ test is conducted after the statements inside the loop, instead of them.\n\n\
    When the do loop is reached the first time as a program runs, the statements between\
    \ the do and while are handled automatically, and then the while condition is\
    \ tested to determine whether the loop should be repeated. If the while condition\
    \ is true, the loop goes around one more time. If the condition is false, the\
    \ loop ends. Something must happen inside the do and while statements that changes\
    \ the condition tested with while; otherwise, the loop continues indefinitely.\
    \ The statements inside a do-while loop are handled at least once.\n\nThe following\
    \ statements cause a do-while loop to display the same line of text several times:\n\
    \n```\nint limit = 5;\nint count = 1;\ndo {\n    System.out.println(\"Don't eat\
    \ that spider eye\");\n    count++;\n} while (count < limit);\n```"
