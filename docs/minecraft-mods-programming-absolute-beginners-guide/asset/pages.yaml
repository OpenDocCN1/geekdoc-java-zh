  md: '# THE ABSOLUTE MINIMUM


    The last two mods that you created, ChickenStorm ZombieChicken, exploited the
    ability of the Bukkit class library to represent any mob in Minecraft as a Java
    object.


    You create the mob with a factory method that needs only the class of the mob—represented
    by its class name followed by .class—and the Location object where that mob should
    appear in the game world.


    Mobs also have a lot of methods that customize the mob, such as when the Zombie
    object''s setBaby() method was called in ZombieChicken to make it a young zombie
    instead of an adult.


    Mobs also have methods to interact with other mobs. The setPassenger() method
    gives a mob a rider.


    So far you have just begun to tap into the potential of the Bukkit class library.
    The next chapter digs into it more deeply so you can create a mod and then customize
    it in unexpected ways.


