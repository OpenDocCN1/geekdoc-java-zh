  md: '# Starting the Project


    This chapter''s StoneWalker mod turns the ground under the player into stone if
    that block is dirt, grass, gravel, or cobblestone.


    Unlike other mods that changed blocks on a one-time basis in response to a user
    command, the StoneWalker mod will continue to transform blocks in real time as
    the player moves around. This requires event handling, a technique that enables
    a Java program to respond to events as they happen.


    A /stonewalk command turns the mod on, and a /stopstonewalk command turns it off.


    Begin this chapter''s mod project with these steps:


    +   1. Select File, New Project.

    2. Select project category Java and project type Java Application, and click Next.

    3. Enter the project name StoneWalker.

    4. Deselect Main Class and click Finish.

    5. In the Projects pane, right-click the Libraries folder and select the command
    Add Library.

    6. In the Available Libraries pane, select Bukkit.

    7. Click Add Library.


    The StoneWalker project is created with no files in it. This mod requires only
    a simple one-command mod configuration. To create the plugin.yml configuration
    file for the mod in the src project folder, follow these steps:


    +   1. Select File, New File.

    2. In the Categories pane, select Other.

    3. In the File Types pane, select YAML File and click Next.

    4. In the File Name field, enter plugin (leave off the .yml).

    5. In the Folder field, enter src.

    6. Click Finish.


    The NetBeans source code editor opens with plugin.yml ready to be created. Enter
    the text of Listing 24.1 in the NetBeans source code editor, and save it when
    you''re done. This configuration defines the two commands supported by the StoneWalker
    mod. Because neither command takes any command-line arguments, no usage field
    appears in the file.'
