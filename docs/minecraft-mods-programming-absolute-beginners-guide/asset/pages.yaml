    The first half of this book explains how to use the Java language to create your

    own programs from scratch. You learn all the keywords and operators that form

    t language and put them to work writing statements that make a computer

    do interesting and useful things.


    Although this approach is the best way to learn Java, it''s a bit like showing
    someone

    how to build a car by making him build every part of the car from scratch first.


    A lot of work is already done for you as a Java programmer, provided you know

    where to look for it.


    Java comes with an enormous collection of code you can utilize in your own

    programs called the Java Class Library. This library is a collection of thousands
    of

    classes, many of which can be used in the programs you write.'
