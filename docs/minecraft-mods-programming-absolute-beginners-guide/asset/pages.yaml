    Persson", the Swedish programmer who created Minecraft. A string is denoted with
    double quotation marks around the text in a Java statement. These quotation marks
    are not included in the string itself.


    Unlike the other types of variables you have used—int, float, char, boolean, and
    so on—the type of string is capitalized.


