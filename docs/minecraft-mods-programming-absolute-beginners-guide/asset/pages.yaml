    # 21


    ![](img/d3a8c962be273f312a438e9a471a1828_294_0.png)


    # TRANSMUTE MATERIALS IN AN INVENTORY


    This chapter moves away from mobs into materials, the inanimate stuff that takes
    up space in the Minecraft world. Writing a mod that manipulates the physical world
    in the game requires a thorough grounding in the Material class in the org.bukkit
    package of the Bukkit class library.


    The Transmuter mod you transforms material from one type to another at the control
    of the player. The original material must be present in the player''s inventory
    for it to work.


    All materials in the game are represented by Bukkit by Material, an enumeration
    of constants. Some of the materials are blocks that can be built, as Material.DIRT,
    Material.AIR, and Material.DIAMOND_ORE. Others are objects that can be held in
    an inventory or found on the ground, as Material.ROTTEN_FLESH and Material.RAW_CHICKEN.


    Working with a player''s inventory requires the use of the PlayerInventory and
    ItemStack classes in the org.bukkit.inventory package.'
