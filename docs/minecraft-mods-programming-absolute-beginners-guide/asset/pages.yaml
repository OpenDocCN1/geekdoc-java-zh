  md: '# CHAPTER 4 START WRITING JAVA PROGRAMS 43


    To differentiate programs with main from these other types, they are called applications.


    # Those Squiggly Bracket Marks


    In the splash program, Lines 3, 4, 6, and 7 contain a squiggly bracket mark of
    some kind—either a { or }. These brackets are a way to group lines of your program
    (in the same way that parentheses are used in a sentence to group words). Everything
    between the opening bracket ( and the closing bracket ) is part of the same group.


    These groupings are called blocks. In Listing 4.1, the opening bracket on Line
    3 is associated with the closing bracket on Line 7, which makes your entire program
    a block. You use blocks in this way to show the beginning and end of a program.


    Blocks can be located inside other blocks (just as parentheses are used in this
    sentence (and a second set is used here)). The splash program has brackets on
    Line 4 and Line 6 that establish another block. This block begins with the main
    statement. The lines inside the main statement''s block will be run when the program
    begins.


    > TIP NetBeans can help you figure out where block begins and ends. Click one
    of the brackets in the source code of the Splash program. The bracket you clicked
    turns yellow along with its corresponding bracket. The Java statements enclosed
    within the two yellow brackets are a block. This tip is not useful on a short
    program like Splash, but as you write much longer programs, it helps you avoid
    looking like a blockhead.


    The following statement is the only thing located inside the block:


    ```

    // My first Java program goes here

    ```


    This line is a placeholder. The // at the beginning of the line tells the computer
    to ignore this line because it was put in the program solely for the benefit of
    humans who are looking at the source code. Lines that serve this purpose are called
    comments.


    Right now, you have written a complete Java program. It can be compiled, but if
    you run it, nothing happens. The reason is that you haven''t told the computer
    to do anything yet. The main statement block contains only a single comment, which
    is ignored by the computer. You must add some statements inside the opening and
    closing brackets of the main block.'
