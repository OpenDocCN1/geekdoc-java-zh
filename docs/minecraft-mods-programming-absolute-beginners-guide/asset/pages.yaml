    # Deploying a Mod


    The ChickenStorm mod is packaged into a JAR file named ChickenStorm.jar. This
    file must be copied from the project folder to the Bukkit server while that server
    is not running.


    To deploy the mod, follow these steps:


    +   1. If the Minecraft server is running, stop it by going to the server window
    and typing the command stop. You will see messages related to the shutdown until
    it is finished.

    2. Hit the spacebar or any other key to close the server window.

    3. Outside of NetBeans in your computer''s file system, open the folder where
    you installed the Minecraft server.

    4. Open the ChickenStorm subfolder.

    5. Open that folder''s dist subfolder.

    6. Select the ChickenStorm file (a JAR file), and press Ctrl+C to copy it.

    7. Go back to the Minecraft server folder.'
