  md: "# 310 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER GUIDE\n\nThe material type\
    \ of a block can be determined by calling its getType() method. There are two\
    \ values in the Material class for logs in Minecraft: Material.LOG and Material.LOG_2.\
    \ If the current block is made of either material, it is cut down by setting that\
    \ block to air:\n\n```\nif (here.getType() == Material.LOG\n    | here.getType()\
    \ == Material.LOG_2 {\n\n    here.setType(Material.AIR);\n}\n```\n\nThis is all\
    \ the code required to remove every log from a 3D cube that 40 blocks tall, wide,\
    \ and deep. But cutting trees in Minecraft is more complicated than that because\
    \ some trees might extend the borders of the cube.\n\n> CAUTION You might be tempted\
    \ to solve this problem by enlarging the size of the 3D cube covered by the TreeChopper\
    \ mod. For instance, you could make the cube 80x80x80 changing the values in the\
    \ three nested for for x, y, and z. This biggest drawback to this approach is\
    \ that it is much resource intensive. The mod takes up a lot of memory as it blocks\
    \ and turns some of them from logs into air. The more memory required in a mod,\
    \ the slower it runs and the more likely it will cause lag for all players in\
    \ the world until it completes its work. When writing mods, it's important to\
    \ keep these concerns in mind. The greatest enemy of any dedicated Minecraft player\
    \ is a server lag.\n\n![](img/d3a8c962be273f312a438e9a471a1828_323_0.png)\n\n\
    Minecraft has some extra-tall species of trees such as the mega spruce, also called\
    \ redwoods. They could extend above the top surface of the cube, as other trees\
    \ on an incline above the player when the /chotrees command is used.\n\nThis mod\
    \ looks for trees that extend outside of the cube and will keep looking until\
    \ every log in the tree has been chopped down no how far it extends.\n\nThe TreeChopper\
    \ mod tackles the problem of the outside-the-cube trees by tracking two things\
    \ with array lists:\n\n+   - An array list called trees holds the (x,y,z) location\
    \ of every log block inside the 3D cube.\n- An array list called searched holds\
    \ every (x,y,z) location in the game world that has been searched looking for\
    \ logs."
