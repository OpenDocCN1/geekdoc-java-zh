    # 1


    ![](img/d3a8c962be273f312a438e9a471a1828_14_0.png)


    # DIG INTO MINECRAFT PROGRAMMING WITH JAVA


    As a Java programmer and father in a house full of teen-aged sons who are avid
    gamers, I was pleasantly surprised when they began asking questions about Java.


    They wanted to know how hard the language is to learn, what kind of software is
    required to develop programs, and whether that software is free.


    The interest of my sons in my favorite programming language had come from an unusual
    place: a 3D game world of infinite dimensions where players build cool structures,
    dig mines, hunt for food, and watch out for creators who want to kill them and
    blow up their stuff.


    Minecraft, an indie game from Sweden that has become a massive cult phenomenon
    in recent years, is transforming my sons and many other young players into aspiring
    Java programmers.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# MINCRAFT MODS PROGRAMMING ABSOLUTE BEGINNER’S GUIDE


    If I meet anyone the age of 20 who learns that I write books about Java, I always
    gets the same question: Will your book show me how to create Minecraft mods?


    This book answers that question with an emphatic "Yes!"


    Minecraft mods, extensions to the game designed and shared by players, are created
    using Java, the same language in which the programmer Markus “Notch” Persson wrote
    the game.


    This book enables you to learn the Java language and put that knowledge to use
    creating mods that do entertaining, useful, and bizarre things in Minecraft.


    To get started, this chapter covers how to download, install, and run your own
    Minecraft server on your computer. You need to download to have a place where
    you can run mods. After that server is running, the next chapter will walk through
    the process of creating, deploying, and testing a Minecraft mod.


    Some of this might sound difficult, but as I told my sons, the Java language is
    not hard to learn. Software like NetBeans streamlines the task of writing programs
    and everything—Java, NetBeans, and the Minecraft server—is free!


    It begins with a Minecraft server and a brand-new world.


    # Setting Up a Minecraft Server


    Developing mods requires access to a Minecraft server. The best way to do this
    when you’re starting out as a mod programmer is to install and run a server on
    your computer. Because there’s not yet a standard way to add mods to the game,
    different servers have different ways to make this possible.


    The easiest to use when creating mods is a server from the Bukkit Project designed
    specifically for this purpose.


    To do this requires two things: the server and the Bukkit API, a set of Java classes
    that enables you to write mods. Both are free to download and use. This uses Bukkit
    version 1.7.10, the most current as it went to press.


    Bukkit’s Minecraft server is a Java application packaged as a single JAR file.
    (A JAR is a Java archive file, which stores files together in a manner similar
    to ZIP files.)


    The Bukkit API is a collection of more than 600 Java classes that will be used
    for creating mods.


    The Bukkit API and server can be downloaded from this book’s website at www.javaminecraft.com/downloads.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# CHAPTER 1 DIG INTO MINECRAFT PROGRAMMING WITH JAVA 3


    The server is named bukkitserver.jar and will be around 19MB in size. The Bukkit
    API is named bukkitapi.jar, around 4MB in size, and can be found on the same page.


    Use the links to download both JAR files.


    When you have downloaded both files completely, create a new folder on your computer
    and store these files in. On my Windows PC, I created c:\minecraft\server and
    copied the two JAR files into it.


    The file bukkitserver.jar is the one you run to launch the Minecraft server.


    ![](img/d3a8c962be273f312a438e9a471a1828_16_0.png)


    > CAUTION If you visit the Bukkit Project''s official website at www.bukkit.org,
    you may find new versions of the Bukkit API and its server higher than 1.7.10.
    Though it is likely all of this book''s mods will work with later versions, it
    would be best to use 1.7.10 while you are starting out and creating the programs
    in these phases.


    After you have completed the book, it will be easier to understand the installation
    and use of new versions of the Bukkit API and server.


    The following command starts the server:


    ```

    java -Xms1024M -Xmx1024M -jar bukkitserver.jar

    ```


    This command tells the Java virtual machine to run the application packaged as
    the JAR file bukkitserver.jar, allocating 1024MB of memory to the program.


    To avoid typing this command every time you run the server, you can create a batch
    or shell file that contains it, and then run that file instead.


    On Windows, open a text editor such as Notepad and enter the text of Listing 1.1
    into the file, saving it as start-server.bat in the same folder where you put
    bukkitserver.jar and bukkitapi.jar.


    When typing in it, don''t enter the 1: and 2: in the file because these are line
    numbers used in this book to refer to specific lines as concepts are explained.


    # LISTING 1.1 The Full Text of start-server.bat


    +   1: java -Xms1024M -Xmx1024M -jar bukkitserver.jar

    2: pause


    Save the file and double-click its name or icon to run the server.'
  merge: -1
