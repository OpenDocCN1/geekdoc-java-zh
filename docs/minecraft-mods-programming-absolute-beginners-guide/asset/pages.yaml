    This chapter''s next project is a Java program that performs a benchmark, a test
    that measures how fast computer hardware or software is operating. The Benchmark
    program uses a loop statement to repeatedly perform the following mathematical
    expression:


    double x = Math.sqrt(index);


    This statement calls the Math.sqrt() method to find the square root of a number.
    You learn how methods work during Chapter 12, “Describe What Your Object Is Like.


    The benchmark you''re creating sees how many times a Java program can calculate
