    # DIG A GIANT HOLE


    One of the things that makes Minecraft distinct is that it can be played and enjoyed
    without any specific goals being pursued. Though the game has a path to pursue
    to reach an end level and kill a supreme boss called the end dragon, many players
    enjoy the game without ever trying to accomplish that.


    You can play Minecraft with no long-term purpose at all. It is the ultimate sandbox
    game, where venturing around the world to build and destroy things and interact
    with the environment is its own reward.


    Minecraft mods can enhance that experience by manipulating the materials of the
    world. As you know, the core of this functionality is the Material class in the
    org.bukkit package.


    In this chapter you develop a mod that enhances the digging capabilities of a
    player. The BigDig mod digs a circular hole around the player with a size determined
    by the player. The hole can be as small as 5 blocks in radius or as large as 30.'
