  md: "2. The mod's glEnable() method registers itself as an event listener and has\
    \ the\n@Override annotation.\n\n3. The onEntityTarget() method receives the event\
    \ and has the\n@EventHandler annotation.\n\nThe enable() method uses the same\
    \ three statements as the other event-\nhand mods you have developed. Create a\
    \ Server object, use it to get the\nPluginManager object, and then use it to register\
    \ as an event listener:\nmanager.registerEvents(this, this);\n\nThe onEntityTarget()\
    \ method takes an EntityTarget object as its only\nargument. This class is from\
    \ the org.bukkit.event.entity package.\n\nHere's the start of the mod with two\
    \ entity method calls:\n\n```\npublic void onEntityTarget(EntityTarget event)\
    \ {\n    Entity entity = event.getEntity();\n    Entity target = event.getTarget();\n\
    \    // ...\n}\n```\n\nThe getEntity() method retrieves the mob that found somebody\
    \ it wants to\nattack.\n\nThe getTarget() method retrieves that somebody.\n\n\
    The method must check whether the target is a player using the instanceof\nkeyword:\n\
    \n```\nif (target instanceof Player) {\n    // ...\n}\n```\n\nIf it is, the method\
    \ casts the target to a Player object:\nPlayer playa = (Player) target;\n\nBecause\
    \ the mod has a Player instance variable called me (like most in the book),\n\
    this can be compared to playa to ensure the player was targeted and not some\n\
    other player:\n\n```\nif (playa == me) {\n    // ...\n}\n```"
