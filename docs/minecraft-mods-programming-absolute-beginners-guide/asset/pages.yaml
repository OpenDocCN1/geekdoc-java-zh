  md: '# THE ABSOLUTE MINIMUM


    The mods described in this book are by necessity simple. It is easier to learn
    and master the concepts required of a Minecraft mod coder in a 100-line program
    than in the mods you''ll find shared on websites, which can be 1,000 or even 10,000
    lines long.


    A lot of mod programming is iterative. You do something simple, such as looping
    through every block in a 3D cube and turning every block of log into air. A flash
    the cube contains no trees and leaves for those trees begin to disappear, dropping
    their apples and saplings on the ground.


    When the mod''s simple task has been accomplished, you notice that there are limitations
    which make it less useful.


    Some trees have only been partially chopped down, leaving log blocks floating
    in the air. That''s not good.


    So you return to the mod and figure out how to solve the problem.


    But sometimes your solution introduces problems of its own. The mod begins to
    run noticeably slower. Messages in the server window indicate that it is suffering
    from lag.


    The most likely culprit for this problem is that the mod is taking up way too
    much memory. The array list you created that holds thousands of Location objects
    in the 3D cube is probably the problem, you surmise.


    Finally, you try another approach and create an inner class that holds the simplest
    possible object to represent an (x,y,z) location. You rewrite the mod to make
    it in the array list.


    Eureka! The mod clears a forest in instant. You find a way to make it chase a
    tree outside of the 3D cube and chop all of its logs.


    Programming a mod is lot like making a building in Minecraft. At your first home
    is just a small, square building of dirt or cobblestone with a door that keeps
    the mobs out at night. Over time you find ways to improve it and make it cooler.


    Mods go through the same stages of growth, and at some point you have finished
    something you are proud of and share with your friends, and perhaps the whole
    community of Minecraft players.


    ![](img/d3a8c962be273f312a438e9a471a1828_333_0.png)'
