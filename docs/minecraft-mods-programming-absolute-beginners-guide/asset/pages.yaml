    Programming is a specialized technical field that throws strange concepts and
    jargon at you, such as “instantiation,” “ternary operators,” and “big- and little-endian
    byte order.”


    If you''re unclear about any of the topics covered in the book, or if I was unclear
    about a topic (sigh), visit the book''s website at www.javaminecraft.com for assistance.


    The website offers the following:


