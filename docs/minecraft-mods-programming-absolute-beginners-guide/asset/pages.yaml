  md: '# IN THIS CHAPTER

    - Examine the blocks in a large area of the game world

    - Find the block at an (x,y,z) location

    - Discover trees by checking for blocks that hold logs

    - Store locations that have been searched in an array list

    - Avoid server lag by using less memory in a mod

    - Create an inner class to represent an (x,y,z) location

    - Use the programming technique of recursion


    # 23


    ![](img/d3a8c962be273f312a438e9a471a1828_320_0.png)


    # CHOP DOWN A FOREST OF TREES


    Minecraft mods that add a new command to the game all start with the same basic
    framework. You extend the JavaPlugin class from the org.bukkit.plugin.java package;
    store the player, world, and server in instance variables; and override the superclass
    method onCommand().


    When the player enters a command, onCommand() is called. If the command was entered
    by a player and it is a command this particular mod knows how to handle, an executeCommand()
    method (or something similar) is called to respond to the command and the value
    true is returned when it''s finished.


    Within simple framework, you branch out to do new things with the Bukkit class
    library, working with the classes and interfaces in the library to interact with
    the Minecraft player, the game world, and the mobs that occupy that world.


    This chapter branches into trees. You create a mod that chops down trees and explores
    the capabilities of three classes: Location, Block, and Material.'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# 308 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER GUIDE


    Along the way, you learn how to employ a powerful programming technique called
    recursion and make use of inner classes in Java.


    You also run into an issue that will be increasingly important in your mod programming:
    how to do cool things without taking up too much memory causing the Minecraft
    server to lag.


    # Starting the Project


    This chapter describes how to write a mod that defrostors a large chunk of the
    Minecraft landscape with a single command. When the TreeChopper mod is deployed
    on the Minecraft server and a `/choptrees` command is entered, a 3D cube around
    the player''s 40x40x40 blocks in size is completely denuded of logs.


    When the logs of all those trees are chopped down, the leaves of those trees gradually
    disappear as the player did it with an ax.


    Begin this chapter''s mod project with these steps:


    +   1. Select File, New Project.

    2. Select project category Java and project type Java Application, and click Next.

    3. Enter the project name TreeChopper.

    4. Deselect Create Main Class and click Finish.

    5. In the Projects pane, right-click the Libraries folder and select the Add Library.

    6. In the Available Libraries pane, select Bukkit.

    7. Click Add Library.


    The TreeChopper project is created with no files in it. This mod requires only
    a simple one-command mod configuration. To create the plugin.yml configuration
    for the mod in the erc project folder, follow these steps:


    +   1. Select File, New File.

    2. In the Categories pane, select Other.

    3. In the File Types pane, select YAML File and click Next.

    4. In the File Name field, enter plugin (leave off the .yml).

    5. In the Folder field, enter erc.

    6. Click Finish.'
