  md: "# CHAPTER 12 DESCRIBE WHAT YOUR OBJECT IS LIKE 155\n\n> CAUTION If your subclass\
    \ defines a constructor with one or more arguments, the class will no longer inherit\
    \ a constructor with no arguments from its superclass. For this reason, you must\
    \ always define a no-argument constructor when your class has other constructors.\n\
    \n# Class Methods\n\nLike class variables, class methods are a way to provide\
    \ functionality associated with an entire class instead of a specific object.\
    \ Use a class method when the method does nothing that affects an individual object\
    \ of the class. In the previous chapter, \"Create Your First Object,\" you used\
    \ the parseInt() method of the Integer class to convert a string to a variable\
    \ of the type int:\n\n```\nString count = \"25\";\nint myCamera = Integer.parseInt(count);\n\
    ```\n\nThis is a class method. To make a method into a class method, use static\
    \ of the name, as in the following code:\n\n```\nstatic void showVirusCount()\
    \ {\n    System.out.println(\"There are \" + virusCount + \" viruses\");\n}\n\
    ```\n\nThe virusCount class variable was used earlier to keep track of how many\
    \ Virus objects have been created by a program. The showVirusCount() method is\
    \ a class method that displays this total, and you can call it with a statement\
    \ such as the:\n\n```\nVirus.showVirusCount();\n```\n\nBecause class variables\
    \ and methods aren't associated with a specific object, you don't need to create\
    \ an object solely for the purpose of using them. The use of the Integer.parseInt()\
    \ method is an example of this that you don't have to create a new Integer object\
    \ just to convert a string to an int value.\n\n# Variable Scope Within Methods\n\
    \nWhen you create a variable or object inside a method in one of your classes,\
    \ it is usable only inside that method. The reason for this is the concept of\
    \ variable scope. The scope is the block in which a variable exists in a program.\
    \ If you go outside of the part of the program defined by the scope, you can no\
    \ longer use the variable."
