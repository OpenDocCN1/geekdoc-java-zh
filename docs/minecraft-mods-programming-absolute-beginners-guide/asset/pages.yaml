  md: "# 272 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER'S GUIDE\n\nAn enhanced for\
    \ loop can be used to iterate through each element in a data structure. Here's\
    \ the loop for each entity in the current list:\n\n```\nfor (Entity mob : current)\
    \ {\n    // ...\n}\n```\n\nDuring each trip through the loop, the next entity\
    \ is stored in the Entity object mob.\n\nAn Entity has a getType() method that\
    \ returns its type as an EntityType. This can be used as the key in the hash map\
    \ that keeps a current count of each mob:\n\n```\nint count = 1;\nif (mobs.containsKey(mob.getType()))\
    \ {\n    count = mobs.get(mob.getType());\n    count++;\n}\nmobs.put(mob.getType(),\
    \ count);\n```\n\nThis code does two things:\n\n+   * If the mob type is not found\
    \ in mobs, the count for that type is set to 1.\n* If the mob type is found, the\
    \ count is increased by 1.\n\nAfter every mob in current has been examined for\
    \ its type, the loop ends. The count of each mob in the mobs hash map can be displayed.\n\
    \nAnother enhanced for loop iterates through every entry in the hash map:\n\n\
    ```\nfor (Entry entry : mobs.entrySet()) {\n    // ...\n}\n```\n\nThe hash map's\
    \ entrySet() method returns a set of every element in the map, which includes\
    \ each key and value. An Entry object holds the key and value for a single element.\n\
    \nThe entity type can be retrieved from that by calling its getKey() method and\
    \ casting the value that is returned to an EntityType object:\n\n```\nEntityType\
    \ type = (EntityType) entry.getKey();\n```"
