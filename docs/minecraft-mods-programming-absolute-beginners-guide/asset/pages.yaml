    # Hash Maps


    The ability to use one piece of information to access another is common in programming.
    An array list is the simplest example of among the data structures, where an index
    number can be used to retrieve one object from the list. Here''s an example that
    pulls the first string from the aristocrats array list: String first = aristocrats.get(0);


    Arrays also use index numbers to retrieve each item in the array.


    Hash maps are data structures in Java that use an object to retrieve another object.
    The first object is the key and the second is the value. They are implemented
    as the HashMap class in the java.util package.


    The name refers to how keys are mapped to values. An example of this kind of structured
    data is a phone book. A person''s name (string) can be used to retrieve the person''s
    phone number.


    > NOTE Just array lists have another class called Vector that does the same thing
    in a more resource-intensive way, hash maps have Hashtable. Hash tables are synchronized
    and hash maps are not, so any class that makes use of hash tables takes longer
    to run. Hash maps generally are preferred.


    A hash map can be created by calling its constructor with no arguments: HashMap
    phonebook = new HashMap();


    Two things can be specified in a new hash map that control how efficient it is:
    the initial capacity and the load factor. These are set with two arguments, in
    order: HashMap phonebook = new HashMap(30, 0.7F);


    The capacity is the number of buckets in which hash map values can be stored.
    The load factor is the amount of buckets that can be used before the capacity
    is automatically increased. The value is a floating-point number from 0 (empty)
    to'
