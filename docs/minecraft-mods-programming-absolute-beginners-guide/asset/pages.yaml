  md: '358 MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER’S GUIDE


    # THE ABSOLUTE MINIMUM


    The Johnny Applechicken mod is a simple demonstration of how these programs can
    be an instigator of change in a Minecraft world. This enhances the gameplay experience
    by giving the player something new to observe in the game.


    The tree-laying chickens can turn a grassy clearing or valley into a forest over
    the course of weeks in game time.


    If the mod is used to spawn 100 chickens, they can quickly turn areas into dense—and
    sometimes impassable—forests.


    There are, of course, some drawbacks to consider when writing a mod that alters
    the world. Players build cool things in Minecraft, and a mod could wreck them
    like a griefer.


    During testing I discovered that tree-laying chickens can obliterate fences and
    enable animals to escape a farm. An egg can be laid on a fence block, so if a
    tree is placed there instead, the fence vanishes.


    ![](img/d3a8c962be273f312a438e9a471a1828_371_0.png)'
