  md: '# Starting the Project


    The ZombieChicken mod spawns from 1–10 chicken-riding zombies. The zombies are
    turned into baby zombies because a full-grown member of the living dead would
    be too big to ride a chicken.


    (This book has some weird sentences in it—and the last one might be the weirdest.)


    Before you can begin writing any Java code, you must take care of the standard
    tasks every mod requires.


    Because every Minecraft mod must be its own project, you create one in NetBeans
    by following these steps:


    +   1. Select File, New Project. The New Project dialog opens.


    +   2. Select the project category Java and the project type Java Application,
    and click Next.


    +   3. Enter the project name ZombieChicken.


    +   4. Deselect the Create Main Class check box.


    +   5. Click Finish.


    Remember to add the Bukkit class library to the new project to make its classes
    available in your program. Follow these steps:


    +   1. In the Projects pane, right-click the Libraries folder and select the pop-up
    menu command Add Library. That dialog opens.


    +   2. In the Available Libraries pane, select Bukkit.


    +   3. Click Add Library.


    The Projects pane in NetBeans will now reflect that Bukkit is one of the libraries
    in this project.


    Next, you must create the mod''s plugin-in configuration file plugin.yml and make
    sure it is stored in the proper folder. Do this:


    +   1. Select File, New File. The New File dialog opens.


    +   2. In the Categories pane, select Other.


    +   3. In the File Types pane, select YAML File; then click Next.


    +   4. In the File Name field, enter plugin (without the .yml).


    +   5. In the Folder field, enter src.


    +   6. Click Finish.'
