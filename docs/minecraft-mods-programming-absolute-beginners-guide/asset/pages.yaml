  md: 'program—the Java compiler doesn''t care. You could have written the Splash
    program without using blank spaces or used the Tab key to indent lines, and it
    would compile successfully.


    Although the number of spaces in front of lines isn''t important, you should use
    consistent spacing and indentation in your Java programs. Why? Because spacing
    makes it easier for you to see how a program is organized and to which programming
    block statement belongs.


    The programs you write must be understandable to other programmers, including
    yourself when you look at the code weeks or months later to fix a bug or make
    an enhancement. Consistency in spacing and indentation are part of what''s called
    a programming style. Good programmers adopt a style and practice it in all their
    work.


