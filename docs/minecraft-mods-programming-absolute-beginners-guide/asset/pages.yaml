  md: '# Fixing Errors


    Now that the Spartacus application has been written, compiled, and run, it''s
    time to break something to get some experience with how NetBeans respond when
    things go terribly wrong.


    Like any programmer, you''ll have plenty of practice screwing things up on your
    own, but pay attention here anyway.


    Return to Spartacus.java in the source editor and take the semicolon off the end
    of the line that calls System.out.println() (Line 17 in Listing 2.1). Even before
    you save the file, NetBeans spots the error and displays a red icon to the left
    of the line (see Figure 2.5).


    ![](img/d3a8c962be273f312a438e9a471a1828_35_0.png)


    # Figure 2.5


    Flagging errors in the source editor.


    Hover over the alert icon to see a dialog appear that describes the error NetBeans
    thinks it has spotted.


    The NetBeans source editor can identify most of the common programming errors
    and typos as you write a Java program. The detection of an error stops the file
    from being compiled until the error has been fixed.



    Put the semicolon back at the end of the line. The alert icon disappears, and
    you can save and run the class again.'
