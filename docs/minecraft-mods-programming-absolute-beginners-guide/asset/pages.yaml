    There should be no surprises in this file, which establishes that mod named ZombieChicken
    is in a class called com.javaminecraft.ZombieChicken, has version number 1.0,
    and takes the player command zombiechicken. The mod''s purpose is to "Spawn 1–10
    chicken-riding zombies."


    As long as you remembered to use spaces instead of tabs to indent Lines 8 and
    9 and have the proper number of spaces, this file is likely set up correctly.


    Now let''s make some zombies and teach them to ride chickens.


    # Writing the Mod


    Before you begin entering the source code of the mod, there''s a NetBeans feature
    you should learn that saves you some typing time.


    NetBeans is a powerful integrated development environment (IDE) that analyzes
    the code of the program you are writing as you enter each line.


    If you make an error and NetBeans knows how to fix it, it will offer to do that
    for you.


    One such error is when you refer to a class you haven''t imported yet. You can
    take advantage of NetBeans'' helpfulness to stop typing in all those import statements
    at the top of each program.'
