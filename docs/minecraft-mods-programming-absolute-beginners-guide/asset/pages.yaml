  md: "# CHAPTER 9 REPEAT AN ACTION WITH LOOPS 113\n\nLike a while loop, a do-while\
    \ loop uses one or more variables that are set before the loop statement.\n\n\
    The loop displays the text \"Don't eat that spider eye\" four times. If you gave\
    \ the count variable an initial value of 6 instead of 1, the text would be displayed\
    \ once, even though count is never less than limit.\n\nIn a do-while loop, the\
    \ statements inside the loop are executed at least once if the loop condition\
    \ is false the first time around.\n\n# Exiting a Loop\n\nThe normal way to exit\
    \ a loop is for the test condition to become false. This is true of all three\
    \ types of loops in Java. Sometimes you might want a loop to end immediately,\
    \ even if the condition being tested is still true. You can accomplish this with\
    \ a break statement, as shown in the following code:\n\n```\nint index = 0;\n\
    while (index <= 1000) {\n  index = index + 5;\n  if (index == 400) {\n    break;\n\
    \  }\n}\n```\n\nA break statement ends the loop that contains the statement.\n\
    \nIn this example, the while loop loops until the index variable is greater than\
    \ 1,000. However, a special case causes the loop to end earlier than that: If\
    \ index equals 400, the break statement is executed, ending the loop immediately.\n\
    \nAnother special-circumstance you can use inside a loop is to continue. The continue\
    \ statement causes you to exit its current trip through the loop and start over\
    \ at the first statement of the loop. Consider the following loop:\n\n```\nint\
    \ index = 0;\nwhile (index <= 1000) {\n  index = index + 5;\n  if (index == 400)\
    \ {\n    continue;\n  }\n  System.out.println(\"The index is \" + index);\nn\n\
    ```"
