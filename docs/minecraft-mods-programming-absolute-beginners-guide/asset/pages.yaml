    On each mod project, you must add a Java class library before you begin writing
    Java code: the Bukkit API JAR file you downloaded when you installed the server.
    Here''s how to do this:


    +   1. In the Projects pane, right-click the Libraries folder and select the menu
    command Add Library. The Add Library dialog opens.


    +   2. Click the Create button. The Create New Library dialog appears.


    +   3. In the Library Name field, enter Bukkit and click OK. The Customize Library
