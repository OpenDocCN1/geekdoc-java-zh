    # USE CONDITIONAL TESTS TO MAKE DECISIONS


    When you write a computer program, you provide the computer with a list of instructions
    called *statements*, and these instructions are followed by the letter. You can
    tell the computer to work out some unpleasant mathematical formulas, and it works
    them out. Tell it to display some information, and dutifuly responds.


    There are times when you need the computer to be more selective about what it
    does. For example, if you have written a Minecraft mod that makes creeps afraid
    of the player, you want to check whether a mob is a creeper before scary it off.
    Otherwise, it will make all mobs afraid.


    The way to accomplish this task in a Java program is to use a *conditional*, a
    statement that causes something to happen in a program only if a specific condition
    is met. During this chapter, you learn how to use the conditionals *if*, *else*,
    and *switch*.'
