    # Unboxing and Unboxing


    Every one of the basic data types in Java has a corresponding object class: boolean
    (Boolean class), byte (Byte), char (Character), double (Double), float (Float),
    int (Integer), long (Long), and short (Short).


    For each of these pairs, the information has identical value. The only difference
    between them is the format value. An integer value such as 413 can be represented
    by either an int or an object of the Integer class.


    Java’s autoboxing and unboxing capabilities enable you to use the basic data type
    and object forms of a value interchangeably.


    Autobox casts a simple variable to the corresponding class.


    Unboxing casts an object to the corresponding simple value.


    These features work behind the scenes, ensuring that when you are expecting a
    simple data type like float, an object is converted to the matching data type
    with the same value. When you''re expecting an object like Float, a data type
    is converted to an object as necessary.


    The following statements show where autoboxing and unboxing come in handy:


    ```

    float total = 1.3F;

    float sum = total / 5;

    ```


    In early versions of Java, this code would fail with two errors. The first statement
    assigns a literal float value of 1.3 to a Float object (not allowed), and the
    second'
