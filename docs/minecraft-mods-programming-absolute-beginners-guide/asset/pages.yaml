  md: '# CHAPTER 12 DESCRIBE WHAT YOUR OBJECT IS LIKE 149


    In the virus class, the author variable is also public, so it can be changed freely
    from other programs. The other variable, maxFileSize, can be used only within
    the class itself.


    When you make a variable in a class public, the set loses control over how that
    variable is used by other programs. In many cases, this might not be a problem.
    For example, the author variable can be changed to any name or pseudonym that
    identifies the author of the program.


    Restricting access to a variable keeps errors from occurring if the variable is
    set incorrectly by another program. With the virus class, a sample restriction
    could require that the identifier be a number greater than 999. This could be
    accomplished by doing these two things:


    +   - Switch the variable from public to protected or private—two other statements
    that provide more restrictive access.


    +   - Add behavior to the value of the variable (if it is higher than 999), and
    report the value of the variable to other programs.


    You can use a protected variable only in the same class as the variable, any subclasses
    of that class, or by classes in the same package. A package is used to group related
    classes that serve a common purpose. An example is the java.util package, which
    contains classes that offer useful utilities such as date and time programming
    and file archiving. When you use the import statement in a Java program with an
    asterisk, as in import java.util.*, you are making it easier to refer to the classes
    of that package in a program.


    A private variable is restricted even further than a protected variable—you can
    use it only in the same class. Unless you know that a variable can be changed
    to anything affecting how its class functions, you should make the variable private
    or protected.


    The following statement makes identifier a private variable:


    ```

    private int identifier = 8603;

    ```


    If you want other programs to use the identifier variable in some way, you have
    to create behavior that makes it possible. This task is covered later in the chapter.


    There also another type of access control: the lock of any public, private, or
    protected statement when the variable is created.


    In most of the programs you have developed prior to this chapter, you didn''t
    specify any access control. When no access control is set, the variable is available
    only to classes in the same package. This is called default or package access.'
