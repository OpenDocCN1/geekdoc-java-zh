  md: '# Sending Arguments to Applications


    You can run JVM applications from a command line using java, a program that invokes
    the JVM. NetBeans uses this program behind the scenes when you run programs. When
    a Java program is run as a command, the JVM loads the application. The command
    can include extra items of information, as in this example:


    ```

    java DataEditor game.dat delta

    ```


    Any extra information sent to a program is called an argument. The first argument,
    if there is one, is provided one space after the name of the application. Each
    additional argument also is separated by a space. In the preceding example, the
    name of the application is DataEditor and the arguments are game.dat and delta.


    If you want to include a space inside an argument, you must put quotation marks
    around it, in the following:


    ```

    java DataEditor game.dat "New Game"

    ```


    This example runs the DataEditor program with three arguments: game.dat, alpha,
    and "New Game". The quotation marks prevent New and Game from being treated as
    separate arguments.


    > NOTE All arguments sent to a Java application are stored in strings, even when
    the argument is numeric. When you want to use one of these arguments as a number,
    you have to convert the value. Doing that is covered in Chapter 12, "Describe
    What Your Object Is Like."


    ![](img/d3a8c962be273f312a438e9a471a1828_67_0.png)


    You can send as many arguments as you want to a Java application (within reason).
    To do something with them, you must write statements in the application to handle
    them.


    To see how arguments work in an application, create a new program in the Minecraft
    project:


    +   1. Select File, New File.


    +   2. In the New File Wizard, select the category Java and file type Empty Java
    File.


    +   3. Give the class name command, give the package name com.javaminecraft, and
    click Finish.


    Enter the text of Listing 5.2 in the source code editor and save it when you''re
    done. Compile the program, correcting any errors that are flagged by the editor
    as you type.'
