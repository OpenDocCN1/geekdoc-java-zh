  md: '# THE ABSOLUTE MINIMUM


    This chapter was a sprint through the subject of how to write a Minecraft mod.
    The rest of the book will be at a much gentler pace that explains all the concepts
    in Java programming and the Bukkit API that are necessary to create sophisticated
    mods.


    There are a lot of different ways to learn Java. Doing it inside Minecraft is
    one of the most entertaining. You will put your programming abilities to use in
    a three-dimensional world where you fight monsters, dig tunnels, build houses,
    and dodge the legions of the living dead—including some who ride chickens.


    Minecraft is an excellent way to learn about object-oriented programming, one
    of the toughest aspects of the language to master. Everything you do in Java is
    accomplished with objects. You create them in constructors, give them knowledge
    in variables, and tell them to do things by calling methods. Objects indicate
    the tasks they can perform by implementing interfaces.


    All these concepts are new to you now, but as you learn them in the next 14 chapters,
    you will find them directly relate to mod programming. Need a zombie? Create a
    `Zombie` object. Want the player to move to a new spot? Call his `teleport()`
    method. Did lose your horse? Call its `getLocation()` method.


    So dig deep into Minecraft mod programming as you like. You''re going to be able
    to use these skills far beyond the mines.


    ![](img/d3a8c962be273f312a438e9a471a1828_48_0.png)'
