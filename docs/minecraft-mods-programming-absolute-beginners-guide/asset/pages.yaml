  md: '# Starting the Project


    There are two ways you can write the mod that has been named BestFriendOfZeus.

    One is to read along in the chapter as the code and programming techniques are
    explained, as you''ve done throughout this book.


    The other is to try to do it yourself first, with only your brain stuffed with
    newly acquired programming knowledge and one hint.


    If you''d like to see whether you can code it before reading, here''s the hint:


    The World class in the org.bukkit package has a lightningStrike() method.

    Your mod should strike every mob with lightning the moment it targets the players.


    The mod should have a command that turns this help on and turns it off. It should
    be off when the mod starts.


    If you are going to try coding it yourself, now is the time to start. The next
    heading will be waiting for you to get back.


    # Stepping Through Mod Development


    Here''s how the book''s version of BestFriendOfZeus is created.


    Create the project:


    +   1. Select File, New Project.

    2. Select project category Java and project type Java Application, and click Next.

    3. Enter the project name BestFriendOfZeus.

    4. Deselect Main Class, then click Finish.

    5. In the Projects pane, right-click the Libraries folder and select the command
    Add Library.

    6. In the Available Libraries pane, select Bukkit.

    7. Click Add Library.


    BestFriendOfZeus project is created with no files in it and needs the mod''s configuration
    file for the command /zeus. The command has an "on" argument that calls on the
    help of Zeus and an "off" argument that asks Zeus to chill out.


    Create the plugin.yml configuration file for the mod in the src project folder
    by doing this:


    +   1. Select File, New File.'
