  md: '# MINECRAFT MODS PROGRAMMING ABSOLUTE BEGINNER''S GUIDE


    The first time you run it, you will see an error message, "Failed to load eula.txt,\"
    as shown in Figure 1.1. Don''t freak out—this is supposed to happen."


    ![](img/d3a8c962be273f312a438e9a471a1828_17_0.png)


    FIGURE 1.1


    The server fails (on purpose) because of the EULA check.


    Minecraft has an end-user license agreement (EULA) that you must read and agree
    to before you can run the server. Visit the following web page to review this
    agreement: http://account.mojang.com/documents/minecraft_eula.


    There''s now a file called eula.txt in the same folder as the server. This file
    has a line that contains the following text:


    ```

    eula=false

    ```


    If you agree to the EULA, change this line to eula=true, save the file, and run
    the server again.


    If it runs successfully, a window opens that displays what the server is doing
    as it starts. The first time the server runs, it creates more than a dozen files
    and subfolders and builds the Minecraft world map. If it is successful, you see
    the final message [Info] Done and a blinking cursor next to a > prompt.


    The help command lists commands you can use to control the server and the game
    world. The stop command shuts down the server (don''t do this yet!).


    Figure 1.2 shows a running Bukkit server.'
  merge: -1
