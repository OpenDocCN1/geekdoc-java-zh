  md: '# Starting the Project


    Minecraft mods can take command-line arguments just like Java programs.

    The Transmuter mod puts an immense amount of power in the player''s hands. Any
    material currently in the player''s inventory can be transmuted to another with
    a command that specifies both materials as arguments (as shown in Figure 21.1):

    /transmute ROTTEN FLESH DIAMOND


    ![](img/d3a8c962be273f312a438e9a471a1828_295_0.png)


    FIGURE 21.1

    Transmuting zombie flesh into diamonds.


    The first argument is the input material to transmute and the second argument
    is the output, the preceding command turns rotten zombie flesh into diamonds.(Ka-ching!)

    If decide you''d rather have zombie flesh, this command changes it back:

    /transmute DIAMOND ROTTEN_FLESHnWith this, players have to guess the names of
    materials, but many of them are pretty intuitive. Here''s another command:

    /transmute GRAVEL CLAY


    If no command-line arguments are specified or the materials are not named correctly,
    the mod''s default behavior is to transmute dirt into cobblestone.'
