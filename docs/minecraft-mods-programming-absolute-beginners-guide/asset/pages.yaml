    # CREATE A MINECRAFT MOD


    Now that you have a Bukkit server for Minecraft set up and running and have installed
    the NetBeans integrated development environment (IDE), you''re ready to create
    and deploy a mod.


    Mods are special Java programs that run on a Minecraft server. They can''t be
    run anywhere else.


    Writing a mod requires the use of the Bukkit API, a set of Java programs that
    do all of the background work necessary for the program inside a Minecraft game.
    A Java program is also called a class, so the Bukkit API is called a class library.


    The Bukkit class library handles things like (x,y,z) location of any object in
    the game, including a player. Everything you interact with the game is represented
    by Bukkit.


    Before this book takes a full trip through Java, from the basics of the language
    into advanced features, this chapter demonstrates how a mod is created. This will
    give you a chance to see where all this material is headed. Many programming concepts
    will be unfamiliar to you, but all will be fully explained in subsequent chapters.'
