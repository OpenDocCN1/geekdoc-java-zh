  md: 'The home page for the documentation is divided into frames. The largest frame
    lists all the packages that compose the Java Class Library, along with a description
    of each one.


    The names of the packages help describe their purposes. For instance, java.io
    is a set of classes for input and output from disk drives, Internet servers, and
    other data sources; java.time contains classes related to time and dates; java.util
    collects helpful utility classes.


    On the documentation home page, in the largest frame is a list of packages with
    a short description of each one. Click the name of a package to learn more about
    it. A page loads the classes in the package.


    Each class in the Java Class Library has its own page of documentation on this
    reference site, which consists of more than 26,000 pages. (You don''t have to
    read all of them now, or ever).


    For this chapter''s final project, you will poke around the library and use an
    existing Java class to do some work for you.


    The Dice game uses the Math class in the java.lang package, which can be used
    to create random numbers—a common requirement in Minecraft mods.


    For this program, the random() method of the class will be employed to produce
    a random value from 1 to 20. Here is the first step in that process:


    double roll = Math.random() * 20;


    The random() method produces a randomly generated number that could be anything
    from 0.0 to 1.0, not including 1.0. This is a floating-point number, so it needs
    to be stored in a variable that can hold such numbers—a double variable named
    roll.


    Because this number is multiplied by 20, the number will be anything from 0 to
    20 (not including 20).


    The final step in generating the number is to round it down to the nearest integer
    and add 1:


    roll = Math.floor(roll) + 1;


    This statement uses another handy method of the Math class. The floor() method
    takes a floating-point number and rounds it down, so if roll was equal to 17.38,
    it would be changed to 17.0. Because 1 is added, the final value of roll would
    be 18.


    Without the Math class from the Java Class Library, you''d have to create your
    own program to produce random numbers, which is a highly complex task. Random'
