    # Sorting an Array


    When you have grouped a bunch of similar items together into an array, one thing
    you can do is rearrange items. The following statements swap the values of two
    elements in an integer array called numbers:


    ```

    int temporary = numbers[5];

    umbers[5] = numbers[6];

    umbers[6] = temporary;

    ```


    These statements result in numbers[5] and numbers[6] trading values with each
    other. The integer variable called temporary is used as a temporary storage place
    for one of the values being swapped. Sorting is the process of arranging a list
    of related items into a set order, as when a list of numbers is sorted from lowest
    to highest.


    Sorting an array is easy in Java because the Arrays class does all the work. Arrays,
    which is part of the java.util group of classes, rearrange arrays of all variable
    types.


    To use the Arrays class in a program, use the following steps:


    +   1. Use the import java.util.* statement to make all the classes in the java.util
    package available in the program.

    2. Create the array.

    3. Use the sort() method of the Arrays class to rearrange an array.


    An array of variables that is sorted by the Arrays class is rearranged into ascending
    numerical order. Characters and strings are arranged in alphabetical order.


