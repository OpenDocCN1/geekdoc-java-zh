    ![](img/d3a8c962be273f312a438e9a471a1828_28_0.png)


    # USE NETBEANS FOR MINECRAFT PROGRAMMING


    Although it''s possible to create Minecraft mods and other Java programs with
    nothing more than the Java Development Kit and a text editor, the experience is
    considerably more pleasant when you use an integrated development environment
    (IDE).


    This book employs NetBeans, a free IDE offered by Oracle for Java programmers.
    NetBeans is a program that makes it easier to organize, write, compile, and test
    Java software. It includes a project and file manager, graphical user interface
    designer, and many other tools. One killer feature is a code editor that automatically
    detects Java syntax errors as you type.


    Now in version 8.0, NetBeans has become a favorite of professional Java developers.
    It is also one of the easiest IDEs for novices to use.


    There are specific requirements for how to organize the source code of a Minecraft
    mod when you deploy it on a Minecraft server. NetBeans makes this as simple as
    possible.'
