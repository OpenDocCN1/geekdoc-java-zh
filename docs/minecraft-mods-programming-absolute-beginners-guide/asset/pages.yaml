  md: "# CHAPTER 9 REPEAT AN ACTION WITH LOOPS 111\n\nThe output window in NetBeans\
    \ does not wrap text, so all the numbers appear on a single line. To make the\
    \ text wrap, right-click the Output pane and select Wrap text from the pop-up\
    \ menu. (Figure 9.1 shows the text wrapped.)\n\n# while Loops\n\nThe while loop\
    \ does not have as many different sections as a for loop does. The only thing\
    \ it needs is a conditional test, which accompanies the while statement. The following\
    \ is an example of a while loop:\n\n```\nwhile (gameLives > 0) {\n    // the statements\
    \ inside the loop go here\n}\n```\n\nThe loop continues repeating until the gameLives\
    \ variable is no longer greater than 0.\n\nThe while statement tests the condition\
    \ at the beginning of the loop before any statements in the loop have been handled.\
    \ If the tested condition is false when a program reaches the while statement\
    \ for the first time, the statements inside the loop are ignored.\n\nIf the while\
    \ condition is true, the loop goes around once and tests the while condition again.\
    \ If the tested condition never changes inside the loop, the loop keeps looping\
    \ forever.\n\nThe following statements cause a while loop to display the same\
    \ line of text several times:\n\n```\nint limit = 5;\nint count = 1;\nwhile (count\
    \ < limit) {\n    System.out.println(\"Mooshroom!\");\n    count++;\n}\n```\n\n\
    A while loop uses one or more variables set before the loop statement. two integer\
    \ variables are created: limit, which has a value of 5, and count, which has a\
    \ value of 1.\n\nThe while loop displays the text \"Mooshroom!\" four times. If\
    \ you gave the count variable an initial value of 6 instead of 1, the text never\
    \ would be displayed."
