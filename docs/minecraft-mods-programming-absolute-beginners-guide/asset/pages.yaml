  md: '# 284 MINERAFT MODS PROGRAMMING ABSOLUTE BEGINNER''S GUIDE


    9: description: Transmute one inventory material to another.

    10: usage: </command> [inputMaterial] [outputMaterial]

    11:

    12: version: 1.0


    The new field in plugin.yml is usage in Line 10. It describes how the command
    is correctly used and what the arguments do. This line states that the command
    is followed by a first argument that identifies the input material and a second
    argument that identifies the output material.


    The squares brackets ([]) around argument descriptors are meaningful. A convention
    among programmers in documenting command-line arguments is to put these brackets
    around arguments that are optional and omit them from arguments that must be specified.


    Here''s an alternate version of Line 10:

    usage: </command> inputMaterial outputMaterial


    This indicates that the input material and output material arguments are required,
    if a user did not include those arguments, the program would fail with an error.


    The Transmut mod does not require arguments. If none are specified, /transmute
    command turns dirt into cobblestone. Because of this, the brackets are used in
    Line 10.


    # Creating the Project


    Now that the plugin.yml file is set up properly, it''s time to develop the Java
    command that implements the mod.


    The mod has a single executeCommand(String[]) method that carries out the /transmute
    command. This method has one argument, a String array that holds the command-line
    arguments (if any).


    The first thing the method does define the default input and output materials:

    Material input = Material.DIRT;

    Material output = Material.COBBLESTONE;


    Each material is a constant in the Material class. There are 341 materials defined
    in Material as the current version of the Bukkit library, and you will be introduced
    to many of them later in this chapter. The name of each material consists of letters,
    numbers, and underscore (_) characters. There are no spaces in the names, SO Material.DIAMOND_SWORD
    is correct and Material.DIAMOND_SWORD is not.'
