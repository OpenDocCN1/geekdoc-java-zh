    # Learning Bukkit Methods from NetBeans


    You will spend a lot of time on the Web reading the Bukkit Javadoc documentation
    as you learn how to become an expert in Minecraft mod programming.


    You can find out more on the events that mobs generate during the game loading
    your web browser and following these steps:


    +   1. Visit the documentation home page at http://jd.bukkit.org/dev/apidocs.

    2. In the Packages frame at the upper left, click org.bukkit.event.entity. The
    classes and interfaces in the package are loaded in the frame at the lower left.

    3. Scroll through that list until you find one sounds interesting, such as EntityExplodeEvent,
    and click it.


    The official documentation for the class appears in the main frame. You can learn
    an enormous amount about the class, including the superclasses above it in the
    Bukkit class hierarchy, the constructor to use when creating an object of this
    class, and the methods you can call.


    Different events have different methods that pertain to what the event does.

    For an explosion, there''s a setYield(float) method that determines the percentage
    of blocks that will be dropped to the ground after the explosion instead of being
    completely destroyed. There is also a getYield() method that reveals the current
    yield percentage.


    The documentation''s description for the getLocation() method, which returns the
    spot where the explosion occurred, has this amusingly grim sentence: "It is not
    possible to get this value from the Entity by the Entity no longer exists in the
    world."


    Reading the Javadoc documentation is enormously helpful, but there''s another,
    quicker way you can find out some things about the Bukkit classes you use in a
    Minecraft mod.


    NetBeans will pop up helpful information about the classes as you enter the source
    code of a mod.'
