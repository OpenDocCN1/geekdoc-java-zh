  md: '# Deploying the Mod


    If the mod''s source code has been saved and there are no errors, you can build
    the TreeChopper mod''s Java Archive (JAR) file and deploy it on the Bukkit server.


    The mod implements a /choptrees command on the server after it''s deployed.


    Within your file system, copy the JAR file TreeChopper.jar from your project folder
    to the Minecraft server through these steps:


    +   1. Stop the Minecraft server if it is running.

    2. Open the folder where you installed the Bukkit server, and then open the TreeChopper
    subfolder.

    3. Open the dist subfolder.

    4. Select the TreeChopper JAR file, and then press Ctrl+C to copy it.

    5. Open the Minecraft server folder again, and open its plugins subfolder.

    6. Press Ctrl+V to copy TreeChopper.jar into it.


    Figure 23.1 and Figure 23.2 show a top-down look at a snowy forest before and
    after the /choptrees command has been used.


