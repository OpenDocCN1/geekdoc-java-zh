  md: "# CHAPTER 13 MAKE THE MOST OF EXISTING OBJECTS 165\n\nCreating a new class\
    \ boils down to the following task: You only have to define the ways in which\
    \ it is different from an existing class. The rest of the work is done for you.\n\
    \n# Inheriting Behavior and Attributes\n\nThe behavior and attributes of a class\
    \ are a combination of two things: its own behavior and attributes and all the\
    \ behavior and attributes it inherits from its superclasses.\n\nThe following\
    \ are some of the behavior and attributes of JApplet:\n\n+   - The equals() method\
    \ determines whether JApplet object has the same value as another object.\n- The\
    \ setBackground() method sets the background color of the applet.\n- The add()\
    \ method adds user interface components such as buttons and text fields to the\
    \ applet.\n- The setLayout() method defines how the applet's graphical interface\
    \ is organized.\n\nThe JApplet can use all these methods, even though setLayout()\
    \ is the only one didn't inherit from another class. The equals() method is defined\
    \ in Object, setBackground() comes from Component, and add() comes from Container.\n\
    \n# Overriding Methods\n\nSome methods defined in the JApplet class of objects\
    \ are also defined in one of its superclasses. As an example, the update() method\
    \ is part of both the JApplet class and the Component class. When a method is\
    \ defined in a subclass and its, the subclass method is used. This enables a subclass\
    \ to change, replace, or completely wipe out some of the behavior or attributes\
    \ of its subclasses. In the case of update(), the purpose is to wipe out some\
