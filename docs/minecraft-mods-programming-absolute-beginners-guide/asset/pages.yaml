  md: '# THE ABSOLUTE MINIMUM


    Learning how to develop mods is largely a process of building on what you’ve done
    done before. With each new mod, you learn something new about the Bukkit class
    library. Each technique you acquire will be part of your tool set when you tackle
    the next mod.


    So far, you have created and customized a mob, made mobs interact with each other,
    and learned how to find and examine all the mobs that share the Minecraft game
    world with the player at any given time.


    During this chapter, you used the skills you have developed with data structures.
    All living mobs in the game world—also called living entities—were stored in a
    List and accessed using the same methods you’ve used on array lists. A count of
    those mobs was kept in a hash map.


    The List data structure turns up throughout the Bukkit class library, so you’ll
    be seeing it again.


    ![](img/d3a8c962be273f312a438e9a471a1828_293_0.png)'
