  md: '# CHAPTER 26 MAKE A WORLD CHANGE OVER TIME 353


    Sometimes in an event-handling method, you don''t want the normal behavior to
    happen. In this mod, you don''t want an egg to be laid, so the event is cancelled.


    If the event was not cancelled, the chicken would lay a tree and an egg.


    This mod places the new tree as a sapling on the spot where the egg would have
    dropped. A tree can be planted on only two types of blocks that are supported
    by the current Bukkit version—DIRT and GRASS.


    ![](img/d3a8c962be273f312a438e9a471a1828_366_0.png)


    CAUTION A third type of sapling of block in Minecraft supports tree saplings:
    podzol. This block appears in the mega biome and looks like a darker dirt block
    with green and orange flecks of color.


    The block can''t be used in a mod (yet) because the current version of Bukkit
    does not support it. Podzol was introduced in Minecraft version 1.7.2, but Bukkit
    1.7.10 does not include a Material. PODZOL enum value.


    When you are developing a mod, don''t assume that everything in the game is supported
    in the Bukkit class library. Though the volunteer programmers who designed Bukkit
    have done an excellent job of keeping up with new features as they appear in Minecraft,
    some things are not yet implemented.


    Learning about the block where the egg would have been laid by retrieving the
    Location and Block object for spot:


    ```

    Location cloc = item.getLocation();

    ```


    ```

    Block block = cloc.getBlock();

    ```


    These objects are used to get the block underneath that one and retrieve it material:


    ```

    Block under = block.getRelative(BlockFace.DOWN);

    ```


    ```

    Material below = under.getType();

    ```


    An if conditional checks whether the below object is Material.DIRT or Material.GRASS.
    If it is, block gets a tree sapling through its setType method:


    ```

    if (below == Material.DIRT || Material.GRASS) {

    block.setType(Material.SAPLING);

    }

    ```


    The mod completes its work with a server window message:


    ```

    LOG.info("[JohnnyAppleChicken] Tree planted");

    ```'
