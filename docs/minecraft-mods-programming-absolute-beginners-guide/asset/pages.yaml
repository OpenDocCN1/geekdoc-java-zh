    # REPEAT AN ACTION WITH LOOPS


    A computer program can repeat a task with ease. Programs are ideally suited to
    do the same thing over and over because of loops. A loop is a statement or block
    that is repeated in a program. Some loops run a fixed number of times. Others
    run indefinitely.


    There are three loop statements in Java: for, do, and while. Each can work like
    the others, but it''s beneficial to learn how all three operate. You often can
    simplify a loop section of a program by choosing the right statement.'
