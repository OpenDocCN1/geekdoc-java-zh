  md: "# CHAPTER 23 CHOP DOWN A FOREST OF TREES 313\n\nIf this location has been searched\
    \ already, it will be found in the searched array list. When this is the case,\
    \ the loop skips to the next location by using continue:\n\n```\nif (searched.contains(loc))\
    \ {\n    continue;\n}\n```\n\nAt this point, if the loop didn't skip, it indicates\
    \ the location has never been searched. It is added to the array list so it won't\
    \ be searched again later:\nsched.add(loc);\n\nThis location is checked for logs\
    \ using the same technique as the executeCommand() method: A Location and Block\
    \ object are created for that location, the block's getType() method looks for\
    \ Material.LOG or Material.LOG_2, and if one of them is found the block is turned\
    \ to Material.AIR.\n\nThe only task left to do for this location is to call chopAdjacentTrees\
    \ (Loc) for that location because it contains a log:\nchopAdjacentTrees(loc);\n\
    \nCalling a method inside itself is called recursion. It is an extremely powerful\
    \ technique that can do a lot of work in a short amount of code.\n\nrecursion\
    \ makes it possible to keep searching the Minecraft world for logs that grew outside\
    \ of a 3D cube until there are no logs adjacent to it. So if a tree has 10 logs\
    \ growing above the cube's top side and some branches extend to the left and right,\
    \ calling chopAdjacentTrees (Loc) finds them all.\n\nA simpler example of recursion\
    \ in Java code can help keeping double an integer until it is greater than 100:\n\
    \n```\npublic int doubleNumber(int number) {\n    if (number < 100) {\n      \
    \  return doubleNumber(number * 2);\n    }\n    return number;\n}\n```\n\nIf the\
    \ method was called with 13 as the initial value (doubleNumber(13)), it produces\
    \ the value 104. The reason is because it doubles 13 to 26, 26 to 52, and 52 to\
    \ 104 and then is done 104 is greater than 100."
