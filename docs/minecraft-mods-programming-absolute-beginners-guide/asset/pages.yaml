  md: "# Using the this Keyword\n\nBecause you can refer to variables and methods\
    \ in other classes along with variables and methods in your own classes, the variable\
    \ you're referring to can become confusing in some circumstances. One way to make\
    \ things more clear is with the this statement—a way to refer within a program\
    \ to the program's own object.\n\nWhen you use an object's methods or variables,\
    \ you put the name of the object in front of the method or variable name, separated\
    \ by a period. Consider these examples:\n\n```\nVirus chickenpox = new Virus();\n\
    chickenpox.author = \"Sneezy\";\nchickenpox.setIdentifier(7513);\n```\n\nThese\
    \ statements create a new object called chickenpox, set the name variable of chickenpox,\
    \ and then call the Identifier() method of chickenpox.\n\nSometimes in a program\
    \ you need to refer to the current object—in other words, the object represented\
    \ by the program itself. For example, inside the Virus class, you might have a\
    \ method that has its own variable called author:\n\n```\npublic void checkAuthor()\
    \ {\n    String author = null;\n}\n```\n\nIn this example, a variable called author\
    \ exists within the scope of the checkAuthor() method, but it isn't the same variable\
    \ as the object variable called author. If you want to refer to the current object's\
    \ author variable, you have to use the this statement, as in the following:\n\n\
    ```\nSystem.out.println(this.author);\n```\n\nBy using this, you make it clear\
    \ which variable or method you are referring. You can use this anywhere in a class\
    \ that you would refer to an object by name. If you want to send the current object\
    \ as an argument to a method, for example, you could use a statement such as the\
    \ following:\n\n```\nverifyData(this);\n```\n\nIn many cases, the this statement\
    \ is not needed to make it clear that you're referring to an object's variables\
    \ and methods. However, there's no detriment to using this any time you want to\
    \ be sure you're referring to the right thing."
  merge: -1
