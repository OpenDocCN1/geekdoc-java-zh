  md: 'There are thousands of mods that other programmers have shared on the Web.
    You can find many of them in the Bukkit Plugins directory at http://dev.bukkit.org/bukkit-plugins.


    Many of these mods have their Java source code available, so you can view how
    they were written and find out about new techniques for interacting with Minecraft
    in your programs.


    The TreeAssist mod is an interesting one I discovered when I was first out how
    trees can be chopped down in Minecraft mods. It has two handy features for pixelated
    lumberjacks:


    +   - When the player chops the lowest log block in a tree, the rest of its logs
    are chopped down automatically.


    +   - When a tree is chopped down, a sapling of the same type is planted at that
    location.


    Each mod in the directory has its own page. The main page for TreeAssist is http://dev.bukkit.org/bukkit-plugins/tree-assist.


    Click the Download link on the page. Another page loads with more information
    about the mod.


    Click the Download link on that page to download the JAR file that you can use
    to deploy the mod on your own server. Put the TreeAssist.jar file in the folder
    where your own mods have been saved. When you next restart the server, the mod''s
    commands will be available.


    Go back to http://dev.bukkit.org/bukkit-plugins/tree-assist, and click the Source
    Code link on that page to go to the GitHub repository and view the code that comprises
    the program.


    You will see a page with a folder and file listing, as shown in Figure 27.2.'
