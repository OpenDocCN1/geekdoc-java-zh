  md: '# THE ABSOLUTE MINIMUM


    There''s a lot of ground to cover when you begin creating Minecraft mods.


    You must learn a framework for mods that inherits from the JavaPlugin class in
    the org.bukkit.plugin.java package. Your subclass overrides the onCommand() method
    of that superclass and responds to a command typed by a player in the game.


    The command that is the mod''s responsibility is indicated by the plugin.yml file,
    a short and simple properties file in the YAML format.


    The chickenStorm mod was packaged into a single JAR file and stored in the Bukkit
    server''s plugins subfolder. When the server was run again, it discovered this
    file and tried to load it as a mod, reporting back whether it was successful or
    not in the server log window.


    This first full-fledged mod went over a lot of stuff that won''t have to be covered
    again. You now know all the fundamentals necessary to create and deploy a mod.


    On the mods you code in upcoming chapters, you learn about the Bukkit class library
    and all the different things mods can do.


    ![](img/d3a8c962be273f312a438e9a471a1828_269_0.png)'
