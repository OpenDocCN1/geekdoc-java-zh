    \ to the while statement instead of proceeding normally to the System.out.println(statement).\
    \ Because of the continue statement, the loop never displays the following text:\n\
    \nThe index is 400\n\nYou can use the break and continue statements with all three\
    \ kinds of loops.\n\nThe break statement lets you create a loop in your program\
    \ that's designed to run forever, as in this example:\n\n```\nwhile (true) {\n\
    \    if (quitKeyPressed == true) {\n        break;\n    }\n}\n```\n\n# Naming\
