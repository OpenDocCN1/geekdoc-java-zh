    # # Creating the Project


    The BigDig mods digs out a circular globe around the player with a radius of 5
    to 30 blocks in size. The player determines the size by following the /bigdig
    command with a space and a number, as in this command:/bigdig 10


    Mods can take arguments just like Java applications can. The arguments are stored
    in the fourth argument to the onCommand() method, a string array.


    After a double called rad is created and given the value 15, the following statement
    sets the radius to the value of the first argument:

    rad = Double.parseDouble(arguments[0]);


    The parseDouble() method of Java''s standard Double class converts a string to
    a double value, if such a conversion is possible.


    To guard bad input from a user, parseDouble() is put inside a try-catch block.
    A NumberFormatException occurs when the user''s value is not numeric.

    if the user''s value is a number, that becomes the radius. There''s one more check
    to ensure the input is acceptable. An if conditional ensures that the radius falls
    into the acceptable range of values:


    ```

    if ((rad < 5) || (rad > 30)) {

    rad = 15;

    }

    ```


    Now that the proper radius has been established, the BigDig class has code that
    digs out the circle.


    Like other mods, this one requires Player, Location, and World.


    Different techniques can be used to dig out a circle around a player in a three-dimensional
    grid like the Minecraft world.'
