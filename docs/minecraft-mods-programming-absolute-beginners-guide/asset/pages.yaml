    # DESCRIBE WHAT YOUR OBJECT IS LIKE


    As you learned during the past chapter''s introduction to object-oriented programming
    (OOP), an object is a way of organizing a program so it has everything it needs
    to accomplish a task. Objects consist of attributes and behavior.


    Attributes are the information stored within an object. They can be variables
    such as integers, characters, and Boolean values or objects such as string and
    calendar objects. Behavior consists of the groups of statements used to handle
    specific jobs within the object. Each of these groups is called a method.


    Up to this point, you have been working with methods and variables of objects
    without knowing it. Any time your statement had a period in that it wasn''t a
    decimal point or part of a string, an object was involved.'
