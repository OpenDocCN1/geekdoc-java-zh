  md: '# Creating Arrays


    Arrays are variables grouped together under a common name. The term array should
    be familiar to you—think of a store with an array of products or a warrior with
    an array of weapons. Like variables, arrays are created by stating the type of
    variable being organized into the array and the name of the array. A pair of square
    brackets ([]) follows the type to distinguish arrays from variables.


    You can create arrays for any type of information that can be stored as a variable.
    For example, the following statement creates a variable that can hold an array
    of strings:


    ```

    String[] monthNames;

    ```


    Here are two more examples:


    ```

    int[] itemWeights;

    boolean[] answers;

    ```


    > NOTE Java is flexible about where the brackets are placed when an array is being
    created. You can put them after the variable name instead of the variable type,
    as in the following:

    String monthNames[];


    > NOTE To make arrays easier for humans to spot in your programs, you should stick
    to one style rather than switching back and forth. Programs that use arrays in
    this book always place the brackets after the variable or class type.


    The previous examples create arrays, but they do not store any values in them.
    To do this, you can use the new keyword to store values in the array with ( )
    marks. When using new, you must specify how many different items are stored in
    the array. Each item in an array is an element. The following statement creates
    an array and sets aside space for the values it holds:


    ```

    int[] seniority = new int[250];

    ```


    This example creates an array of integers called seniority. The array has 250
    elements that could hold the many that an individual worker has employed.


    When you create an array with the new statement, you must specify the number of
    elements. Each element of the array is given an initial value that depends on
    the type of the array. All numeric arrays have the initial value 0, char arrays
    equal ''\0'', and * with'
