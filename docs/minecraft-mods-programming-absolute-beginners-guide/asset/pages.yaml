    The ArrayList class you learned during Chapter 14 implemented the List interface.
    The techniques you learned to access array lists also work with lists.


    The current list holds LivingEntity objects from the org.bukkit.entity package.
    Mobs are also called entities in Bukkit.


    Because the census command counts mobs, you need a place to store the count of
    each type of mob. The mod stores count in a hash map called mobs:


    ```

    HashMap<EntityType, Integer> mobs = new HashMap<>();

