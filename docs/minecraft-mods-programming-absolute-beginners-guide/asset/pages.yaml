  md: "# CHAPTER 12 DESCRIBE WHAT YOUR OBJECT IS LIKE 153\n\nThese methods are called\
    \ accessor methods because they enable the identifier variable to be accessed\
    \ from other objects.\n\nThe getIdentifier() method is used to retrieve the current\
    \ value of identifier. The getIdentifier() method does not have any arguments,\
    \ but it must still have parentheses after the method name. The setIdentifier\
    \ method takes one argument, an integer called newValue. This argument is the\
    \ new value of identifier. If newValue is greater than 60, the change will be\
    \ made.\n\nIn this example, the Virus class controls how the identifier variable\
    \ can be used by other classes. This process is called encapsulation, and it's\
    \ a fundamental concept of OOP. The better your objects are, able to protect themselves\
    \ against misuse, the more useful they are when you put them to work in other\
    \ programs.\n\nAlthough identifier is private, the new methods getIdentifier()\
    \ and setIdentifier() are able to work with identifier because they are in the\
    \ same class.\n\n# Similar Methods with Different Arguments\n\nAs you have seen\
    \ with the setIdentifier() method, you can send arguments to a method to affect\
    \ what it does. Different methods in a class can have different names, but methods\
    \ also can have the same name if they have different arguments.\n\nTwo methods\
    \ can have the same name if they have a different number of arguments or the arguments\
    \ are of different variable types. For example, it might be useful for the virus\
    \ class of objects to have two alert() methods. One could have no arguments and\
    \ would deliver a generic message. The other could specify the message as a string\
    \ argument. The following statements implement these:\n\n```\nvoid alert() {\n\
    \    System.out.println(\"Danger! Danger!\");\n}\n```\n\n```\nvoid alert (String\
    \ message) {\n    System.out.println(\"Danger: \" + message);\n}\n```\n\nThe methods\
    \ have the same name, but the arguments differ—one has no argument, and the other\
    \ has a single string argument. The arguments to a method are called the method's\
    \ signature. A class can have different methods with the same name as long as\
    \ each method has a different signature."
