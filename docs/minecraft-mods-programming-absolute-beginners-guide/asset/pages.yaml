    # # BEFRIEND THE GOD OF LIGHTNING


    Minecraft is a dangerous place.


    From the moment you start the game, there''s a mob of mobs eager to kill you and
    pick up your stuff—even if it''s of no use to them at all. I''m still looking
    for the zombie who has my Fortune III diamond pick axe.


    When I find him, vengeance will be mine. As will my pick axe.


    Because of the game''s many dangers, it''s good to have friends in high places.
    For this final chapter of the book, you will have one of those.


    Your friend will be able to throw lightning bolts from on high at any mob even
    thinks about attacking you. The second you are targeted for attack by a mob, boom.


    Evil eye from an enderman? Boom.


    Cross countenance of a creeper. Boom.


    Malevolent mug of a magma cube? Boom.


    We''ll call your new friend Zeus.'
