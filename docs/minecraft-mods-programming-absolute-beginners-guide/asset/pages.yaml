    # Exceptions


    Although you are just learning about them now, you have probably become wellacquainted
    with exceptions during the previous 14 chapters. These errors turn up when you
    write a Java program that compiles successfully but encounters a problem as it
    runs.


    For example, a common programming mistake is to refer to an element of an array
    that doesn''t exist, as in the the following statements:


    ```

    String[] greek = { "Alpha", "Beta", "Gamma" };

    System.out.println(greek[3]);

    ```


    The String array has three elements. Because the first element of an array is
    numbered 0 rather than 1, the first element is greek[0], and the third greek[2].
    So the statement to display greek[3] is erroneous. The preceding statements compile
    successfully, but when you run the program, the Java Virtual Machine (JVM) halts
    with a message such as the:


    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 3 at SampleProgram.main(SampleProgram.java:4)


    This message indicates that the application has generated an exception, which
    the JVM noted by displaying an error message and logging the program.


    The error message refers to a class called ArrayIndexOutOfBoundsException in the
    java.lang package. This class is an exception—an object that represents an exceptional
    circumstance that has taken place in a Java program.


    When a Java class encounters an exception, it alerts users of the class to the
    error. In this example, the user of the class is the JVM.


    ![](img/d3a8c962be273f312a438e9a471a1828_203_0.png)


    > NOTE Two terms are used to describe this process: throw and catch. Throw exceptions
    to alert others that they have occurred. These exceptions are caught by other
    objects or the Java Virtual Machine.


    All exceptions are subclasses of Exception in the java.lang package. ArrayIndexOutOfBoundsException
    does what you would expect—it reports that an array element has been outside the
    array boundaries.


    There are hundreds of exceptions in Java. Many such as the array exception indicate
    a problem that can be fixed with a programming change. These are comparable to
    compiler errors—after you correct the situation, you don''t have to concern yourself
    with the exception any longer.'
