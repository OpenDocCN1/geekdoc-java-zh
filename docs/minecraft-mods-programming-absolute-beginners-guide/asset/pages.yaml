    \ {\n    System.out.println(\"New size set!\");\n} else {\n    System.out.println(\"\
    Curses! Foiled again!\");\n}\n```\n\nYou can use a method that returns a value\
    \ at any place in the program where you could have used a variable.\n\nEarlier\
    \ in the chapter, you switched the identifier variable to private to prevent it\
    \ from being read or modified by other programs.\n\nWhen an instance variable\
    \ is private, there's still a way to make it possible for identifier to be used\
    \ elsewhere: Create public methods in the Virus class that get the value of identifier\
    \ and set identifier to a new value. These new methods should be public, unlike\
    \ the identifier variable itself, so they can be called in other programs.\n\n\
    Consider the following two methods:\n\n```\npublic int getIdentifier() {\n   \
    \ return identifier;\n}\n```\n\n```\npublic void setIdentifier(int newValue) {\n\
    \    if (newValue > 999) {\n        identifier = newValue;\n    }\n}\n```"
