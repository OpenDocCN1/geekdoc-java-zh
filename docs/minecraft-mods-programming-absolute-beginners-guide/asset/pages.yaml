    This mod registers itself as an event handler in the onItem method just like the
    mods created in Chapter 24, "Respond to Events in the Game," and Chapter 25, "Display
    a Mob''s Health During Combat."


    One event-handling method is defined in this program''s class file, onItemSpawn(),
    which has an ItemSpawnEvent object as its argument:


    ```

    public void onItemSpawn(ItemSpawnEvent event) {

    // ...

    }

    ```


    The ItemSpawnEvent class is in the org.bukkit.event.entity package.


    A check to the commandOn instance variable ensures the mod''s tree-laying capabilities
    are turned on:


    ```

    if (!commandOn) {

    return;

    }

    ```


    After that, the item that was spawned to trigger the event is examined. The ItemSpawnEvent
    object''s getEntity() method returns the item that was spawned, which is cast
    to the class.


    An item can be in a quantity of more than one when encountered in Minecraft, so
    you must retrieve the stack by calling the Item object''s getItemStack() method.
    It returns an ItemStack.


    This mod cares about only one type of item that can be spawned: eggs. The type
    is represented by the Material enumeration, and it is retrieved with the item''s
    getType() method.


    ```

    This code examines the item:

    Item item = (Item) event.getEntity();

    ItemStack stack = item.getItemStack();

    Material type = stack.getType();

    ```


    A freshly laid chicken egg is Material.EGG.


    After checking to ensure this event laid an egg, it cancels the normal event by
    calling the event object''s setCancelled(Boolean) method with true as the argument:

    event.setCancelled(true);'
