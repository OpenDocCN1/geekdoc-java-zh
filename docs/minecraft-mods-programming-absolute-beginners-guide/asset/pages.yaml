    # THE ABSOLUTE MINIMUM


    Loops are a fundamental part of most programming languages. Animation created
    by displaying several graphics in sequence is one of many tasks you could not
    accomplish in Java or any other programming language without loops.


    One common use of loops in a Minecraft mod is to load all the mobs in the vicinity
