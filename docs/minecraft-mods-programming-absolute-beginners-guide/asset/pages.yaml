  md: "When you want to create an object in a program, the new statement is used,\
    \ as in\nthe following example:\n\nVirus typhoid = new Virus();\n\nThis statement\
    \ creates a new object called typhoid. When you use the new\nstatement, a special\
    \ method of that object's class is called. This method is called\nconstructor\
    \ because it handles the work to create the object. The\npurpose of a constructor\
    \ is to set up any variables and call the methods that must\nt place for the object\
    \ to function properly.\n\nConstructors are defined like other methods, except\
    \ they cannot return a value.\nThe following are the two constructors for the\
    \ Virus class of objects:\n\n```\npublic Virus() {\n    author = \"Ignoto\"; //\
    \ author is a string\n    maxFileSize = 30000; // maxSize is an int\n}\n```\n\n\
    ```\npublic Virus(String name, int size) {\n    author = name;\n    maxFileSize\
    \ = size;\n}\n```\n\nLike other methods, constructors can use the arguments they\
    \ are sent as a way to\ndefine more than one constructor in a class. In this example,\
    \ the first constructor\nwould be called with a new statement such as the following\
    \ is used:\n\nVirus mumps = new Virus();\n\nThe other constructor could be called\
    \ only if a string and an integer are sent as\\arguments with the new statement,\
    \ as in this example:\n\nVirus rubella = new Virus(\"April Mayhem\", 60000);\n\
    \nIf you don't include any constructor methods in a class, it inherits a\nconstructor\
    \ with no arguments from its superclass. There also might be other\nconstructor\
    \ methods that it inherits, depending on the superclass used.\n\nIn any class,\
    \ there must be a constructor that has the same number and type of\narguments\
    \ as the new statement's to create objects of that class. In the\nexample of the\
    \ Virus class, which has Virus() and Virus(String name, int size)\nconstructors,\
    \ you could create virus objects with only two different types of new\nstatements:\
    \ one without arguments and one with a string and an integer as the\nonly two\
    \ arguments."
