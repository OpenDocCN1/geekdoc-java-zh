    # MAKE A WORLD CHANGE OVER TIME


    The world in a Minecraft game is incredibly huge. A player can walk in the same
    direction for 30 million blocks before reaching an edge.


    But as big as it is, the world remains almost entirely the same without a player''s
    actions. If you left an area and didn''t come back to it for weeks while exploring
    elsewhere, when you returned the hills, trees, and other objects would be the
    same—aside from the occasional block moved at random by the inexplicable whims
    of an enderman. The mobs would be in different places, of course, but they would
    be the same types of mobs who occupied that area originally.


    One way to introduce some variability into the game is with mods.


    You can make changes to the world over time that aren''t caused, directly or indirectly,
    by a player.


    This chapter''s mod can fill a clearing with trees through an unlikely source:
    an army of mutated chickens.'
