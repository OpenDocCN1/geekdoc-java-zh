  md: '# Dialect and Grammar 57


    The interrogative form τίς differs in having the tonic accent where the indefinite
    enclitic.


    # Suffixes


    The following may be added to nouns:


    +   -δε, -ζε, -σε ‘twards’: added to the accusative, e.g. οἰκόνδε (‘homwards’);

    -θε(ν) ‘from’: οἰκοθεν (‘from home’);

    -α’ ‘at’: οἰκοθ (‘at home’);

    -φι(ν) ‘with’ or ‘by’ (instrumental) or α’at (locative) or sometimes ‘from’: ἵφ
    (‘by force’), θύφη (‘at the door’), πωςτόφι (‘from the sea’).


    # Verbs


    The augment is often omitted, e.g. πλάγχχθη (Od. 1.2 n.). Reduplication is found
    in non-present tenses other than the perfect, e.g. ἔγεμε (Od. 1.218), πέφραγε
    (Od. 1.273).


    Infinitives (in addition to forms familiar from Attic) may end in –μεναι, –μευν-ν.


    The endings –ααι and –α are found in the 3 pl. as well as –νται and –ντο.


    Many ends are uncontracted: –σαο for –ω (or med.); –εαι, –ηαι for –η, –εο for
    –ου.


    # Tmesis


    In Classical Attic, we are familiar with compound verbs such as καεσθθ (‘eat up’;
    e.g. Eur. Sys. 341). Such forms are also found in Homer. But it is very common
    to the first element (‘preverb’) separated from the verb by intervening and sometimes
    not in the same line (e.g. καθοὶς ... | ...σθων (Od. 1.8–9). Grammarians refer
    to this as tmesis (‘cutting’); that is misleading in that it suggests the parts
    barred as an existing compound. It seems rather that tmesis was the original state
    of affairs and the joining of prefix to verb later. Tmesis is found in Vedic and
    Hittite texts of high antiquity but is absent from the Mycenaean texts in Linear
    B, dated to around 1200 BC, which means that the coalescence had taken place within
    then Greek. Its presence in Homer must therefore represent the preservation of
    a highly archaic phenomenon,'
