  md: 'Privative


    A privative alpha at the beginning of a word negates the root sense of the following
    element, e.g. α-θάνατος (''not-mortal'').


    Proclitic


    A word so closely associated in pronunciation with the one following that it has
    no independent accent of its own.


    Protasis


    The first limb of a conditional (''if...then'') clause.


    Prothetic vowel


    A vowel of any kind that is neither copulative nor private but is placed before
    a known root and whose function as a morpheme is often obscure (252 n.).


    Sigmatic


    Containing a sigma—as in the sigmatic aorist ἔγα beside a non-sigmatic aorist
    such as ἐλαββον.


    Stative


    A verb that indicates a state of affairs (''be heavy'', ''be in love'').


    Suppletion


    A paradigm suppletive if it contains inflectional forms that are etymologically
    unrelated to others. Examples are Greek φέρω, ἤγεικον, οἴμαι; Lat. ero, tuli;
    Eng. went.


    Syncope


    The loss, generally of an unstressed vowel, from the interior of a word as a result
    of the accent falling elsewhere.


    Syncopephones


    A phenomenon where the last syllable of a word is slurred together with the first
    syllable of the following word so as to be pronounced as a single syllabic unit,
    e.g. εἰλαδπίνην, ἵὲ (226 n.).


    Synizesis


    See Introduction, p. 49.


    Thematic


    A noun or verb that has the theme vowel#.


    A vowel placed between the stem and ending in verbs and nouns: λῶ–ο–μενν and λόγ–ο–ν
    (v < *m*) are thematic whereas ί–μεν α ἀνακτα (a < *m*) are thematic.


    Tmesis


    See Introduction, p. 57–8.


    Zero-grade


    See ablaut#.'
