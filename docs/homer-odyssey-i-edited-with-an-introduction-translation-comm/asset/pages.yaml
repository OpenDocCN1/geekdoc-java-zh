    in the Bay of Naples, perhaps near modern Sorrento.${284}$ Scylla and Chrybdis
    are placed in the Straits of Messina.${285}$ Thrinacia is partly Sicily.$^{286}$
    In general, we can see that the wanderings of Odysseus seem localized to the Western
    Mediterranean; Calypso helps keep certain constellations to the East in order
    to find his way by sailing eastwards.$^{287}$


    Clearly the tradition knows a great deal about the world not of Troy and Asia
    Minor but also of the Western Mediterranean, where Greek had been in the eighth
    century bc. But, in Book 1, the action of which chiefly takes places on Ithaca,
    the gaze much wider. The poet says that Poseidon had to go see the Ethiopians,
    the most far-flung inhabitants of the planet who dwell in territories to the uppermost
    East and West. This reflects in part knowledge of a real people in Africa, in
    mythical ideals about the places that are farthest away being home to the greatest
    abundance.$^{288}$ Athena alluded to the island of Ogygia where Calypso lives.$^{289}$
    Mentes tells Telemach that he is a merchant trading metals to Temese on Cyprus.
    The world of the archaic Aegean was no stranger to ships and at this period,$^{291}$
