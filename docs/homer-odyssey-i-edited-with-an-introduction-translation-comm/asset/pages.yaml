  md: '# Introduction


    2


    deliberately defiled. But Achilles has now seen beyond the outlook that once informed
    all his actions. He might have killed countless enemies, he might have have weathered
    the loss of many comrades; but what changes everything is the death of somebody
    close to him. His grief recalls of Gilgamesash after the death of Enkidu. The
    Iliad mesmerizes us by the unblinking way in which it presents the stark opposition
    between life and death.


    As Forgiven makes it hard to imagine another Western along traditional lines,
    it is hard to see where the genre of martial poetry about Troy can go after the
    scene in Achilles'' hut. Where it in fact goes the Odyssey is far away from the
    towers of Ilium. By the start of the poem, long years have passed. The very first
    word of the epic proclaims its subject: a man is not named for another lines;
    but he is Odysseus, commander of one contingent of mighty Achaean host that, having
    sacked Troy, had laid set for home. In the Iliad, Achilles slyifies Odysseus as
    a master of double-talk, even if others admire his strategies and rhetoric. The
    qualities that repel Achilles are those that keep Odysseus alive and bring him
    safe home to take vengeance upon those who took his life and property.


    The world of the Odyssey is utterly different from that of the Iliad—so much that
    some critics have thought the two poems cannot be the work of the same mind. Certainly
    the inwardness of Odysseus, his kindness and trickery, contrast sharply with the
    frankness of speech and cleanness in great heroes such as Achilles, Hector, Ajax,
    Glaucus, and Paris. But that is not all. Whereas the Iliad is claustrophically
    limited in time and to a short period in the tenth year of the siege before the
    walls of Troy, the Odyssey is drawn on a canvas of astonishing breadth. We begin
    on Ithaca, home of Odysseus, where his son Telemachus receives from a goddess
    in disguise. He moves to Pylos and Sparta, receiving much news by way of narrative
    flashback. This device, used sparingly in the Iliad, is essential to the structure
    of the Odyssey. The embedding of story within story is one of the chief features
    of the poem and a feature of no sophistication.


