  md: '# Preface


    The Odyssey is one of the greatest poems ever made. Nothing written about it could
    possibly exhaust the stock of things one might say. Yet this book consists of
    a lengthy introduction, a Greek text, a critical apparatus, an English translation,
    a detailed commentary, and a full vocabulary. What is it all for? The modest goal
    is just to offer pointers to enrich the experience of reading Odyssey Book 1,
    whether the reader be a relative newcomer to Homer or a more experienced traveler.


    If one listens to a great piece of music, one does not typically ask, ''What does
    this mean?'' People are less hesitant to ask this of a poem. It must mean something,
    we think, as all verbal artistry were just so much window dressing—idiom, imagery,
    and metre just convenient sauce which to serve up ''ideas''. But we reach our
    greatest mastery as readers when we stop trying to read the poem and instead allow
    the poem to read us. Do you identify with Odysseus? Perhaps you miss the ways
    in which you are more like one of his companions. Do you sympathize-ze with Calypso?
    Perhaps you are more like Penelope. Do you feel indignation at the behavior of
    the suitors? Perhaps you forget the beggar whom you ignored in the street. At
    any rate, the experience of reading a poem ought to be more than marshalling a
    series of propositions.


    But the access to the epics is not straightforward. They are the products of an
    age that had in many respects already vanished by the time Homer was at work.
    In the Iliad, for example, Achilles is monumentally angry at the loss of his concubine
    Briseis. What does it mean when he says γῖν ἐκ θμοῦ φλέων? Does φλέων mean nearly
    onto ''love''? Did he leave her romantic in the way that Romeo and Juliet loved
    each other? Or was it more visceral, as the fashion of D. H. Lawrence? What does
    he mean ''I felt romantic affection for her from the bottom of my heart or I counted
    her with all my vital spirit among close to me''? What of the fact that she is
    infuse, captured in war and sharing her bed through necessity? If we go back in
    time to the relevant periods and make a sociological study of sexual politics,
    how far would this help in interpreting a literary work of art?


    Moving to the Odyssey, we might consider the scene in Book 1 where Telemachus
    is being stand-off about his father and rude about his mother. We cannot help
    at least times glancing at this the'
