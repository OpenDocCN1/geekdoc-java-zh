    # Digraphs


    The letters ζ, ξ, ψ are digraphs—they indicate not one but two sounds: respectively
    σδ, κα, πσ. This means that a preceding syllable will always be treated as closed.
    If it contains a short vowel, it will never be met heavily: e.g. χῖ, ξῖν (Od.
    1.123). The letters θ, φ, and χ are not treated in the same way because each represents
    only a single sound—the aspirated variants of τ, π, and κ respectively.


    # Plosive and Liquid (or Nasal)


    Based on what has been said already, we should expect a sequence such as φρ or
    β be treated as closing a preceding syllable and making metric heavy if it contains
    a short vowel. This is sometimes the case: e.g. αγαθὼ φρόνων (Od. 1.43), sometimes
    not e.g. ἐται βρτών (Od. 1.66). The circumstances in which the preceding syllable
    may be treated¹³⁹¹ rather than closed are confined to situations where a plosive
    is followed by a so-called liquid (λ, ρ) or nasal (μ, ν). The term liquid was
    coined in antiquity, to describe precisely this ambivalent behaviour.³39² A sequence
    containing a voiced plosive (β, δ, γ) or a nasal is more likely to be treated
    as closing the previous syllable before releasing it. The release is hardly ever
    found with nasals before the fifth century and never in the period of γμ, γν,
    μ. Homer never treats βλ or γλ as syllable releasing.³39³


