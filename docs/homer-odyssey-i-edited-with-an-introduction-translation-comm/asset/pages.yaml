    # THE APPEAL OF THE ODYSSEY


    In Clint Eastwood''s great Western, Unforgiven,¹ we meet a young man called The
    Kid. He aspires to be a tough guy. To prove himself, he casually shoots in cold
    blood a defenseless man whose pants are down. Hit suddenly by the realization
    that this was not, after all, so heroic a deed, he tries to draw the memory in
    drink. He turns to his older associate, and seasoned gun-slinger, Bill Munny:


    +   - Jesus Christ! It doesn''t seem real. Guy ain''t gonna breathe ever again.
    Now he''s dead too, and the other one on account of pullin’


    +   - It’s all of a thing, killer’n a man. You take all he''s got and all he’s
    ever gonna have.³


    +   - Yeah. Well, I guess they had comin''.


    +   - We all have it comin’, kid.⁴


    To mention Homer in same breath as a Western film might appear to be an ill-judged
    attempt at novelty, the desperate latch of a hopelessly out-of-touch lecture in
    a David Lodge novel. But there is a direct line between this scene and the episode
    at the end of the Iliad where the youthful Achilles gives Priam the benefit of
    his considered opinion on life: no human can avoid suffering. A young but already
    hardened killer looks back cool on a lifetime of slaughter and sees that once
    he took for glory to dust and ashes. Anybody’s fortunes might at any moment turn
    towards disaster: Priam, ruler of a great city, has suffered irreparable loss,
    both of his rule and the lives of those close to him.⁵ Such of tragedy; without
    reason did Plato call Homer the “pathfinder of tragedy.”⁶ Whereas Achilles was
    prepared, unlike his comrades, to accept a short life in retreat for imperishable
    glory,⁷ he sees himself as ‘sitting’ at Troy and causing grief to Priam and his
    children.⁸ As he says all this, and pointedly encourages Priam to eat, there lies
    outside in the corpse of Hector that he


