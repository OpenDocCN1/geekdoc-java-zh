    lens of other things we know—from ‘Woman, what I have to do with

    thee?’¹ to Hamlet. This is natural; it is hard to say that some reactions are

    ‘allowed’ and others excluded because ‘anachronistic’. That said, it is not

    unreasonable at least to wonder what might have been the reactions of the

    original audience.


    Those of us who are trained in philology (in the broad sense) are accus-

    tomed to using all kinds of sharp-looking instruments to help us get

    inside the texts. We have papyrology and palaeography to help us to read

    correct versions of the poem that survive from the Hellenistic period

    an the Middle Ages; we have the resources of archaeology to help us

    understand references to the material world; we have historical anthro-

    pology to throw light on the cultural world of the archaic ballads; we have

    comparative philology and linguistics that can clarify the surface mean-

    ing of a word or phrase. But language is not a simple tool for pointing

    things out or making arguments and great literature do not exist so

    much to inform us as to form us. It is no part of my task to dictate the

    outcome of that experience; but I am bound to elucidate the opaque

    unusual language, style, and plot that show, to be worthy of comment and to offer
    a view on what the original text

    looks like and how we might construe it in modern English.


    Some pedagogues will throw their hands in horror at a commenta-

    tor also provides a translation. They say, will ‘cheat’

    by looking at the translation before having wrestled sufficiently with the

