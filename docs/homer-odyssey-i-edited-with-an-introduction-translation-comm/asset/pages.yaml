  md: '# Introduction


    adolescents, arrogant aristocrats, plucky mothers, absent fathers—these

    are not things confined to the archaic period of ancient Greece. Of course their
    values and knowledge and suppositions and prejudices were not ours; nor are they
    aliens from another planet. The reason why we still read these poems with pleasure
    and admiration is because they paint a compelling story of enduring aspects of
    the human condition.


    # The Divine


    From the earliest times for which we have evidence, the Greeks were polytheists.
    This puts them in company with the Sumerians, Egyptians, Babylonians, Hittites,
    Mittani, and others. The ancient Israelites, by contrast, believe in one god and
    this belief is found in Christianity and Islam. In the modern world, the only
    polytheistic system likely to be familiar to most people is Hinduism. Most modern
    readers will either believe in one god or no gods at all. It is thus hard to enter
    the world of the epics, where things are so different. Herodotus said that Hesiod
    and Homer (in that order) had effectively given the Greeks gods by defining their
    different spheres of operation and the cult paid them. It seems unlikely that
    these poets created the gods out of nothing—more probably, expanded and embellished
    details of cult. We also find from time references to gods and goddesses having
    temples and altars in this or confirmed by archaeology. Nevertheless, one cannot
    underestimate the influence of the epics on the Greek religious imagination.


    The *Iliad* is far more taken up with the doings of the gods than the *Odyssey*.
    On the plain Troy, we see Athena, Hera, Poseidon, Ares, Apollo, and even Aphrodite
    taking the field to promote the interests of their devotees. In the *Odyssey*,
