  md: '# Commentary on lines 218–22


    **218 ἀνέρος** The inherited form is ἀνέρός (Il. 3.62) and what we see here is
    a novelty (Sihler 1995: 292–3). Perhaps it was formed on analogy with the nom.
    pl. πέρες, which is original and beside ἀνέρ represents an innovation. The older
    forms are retained to the extent that they remain metrically useful.


    **κτέτέεσι**...ἔγρας** The martial society depicted in the epics is not one in
    which the principal characters expected to reach old age. The shortness of life
    gives rise to the heroic ethos, most memorably articulated by Sarpedon in the
    *Iliad*. He remarks that people scarce scarce warriors who could live free from
    old age and death; since death is all around, one might well seek heroic glory
    (Il. 12.322–8). Death in battle is the sort of thing that will be remembered in
    song and passed to future ages (Il. 6.358). The corollary of this outlook is that
    any warrior who survived to old age ought left to enjoy his declining years in
    peace (II. 22.71–6). The sort of prosperity that Teleachus has in mind is exemplified
    by Menelaus (Od. 4.72–5).


    **219–20 ὅδ**...|τοῦ| In Classical Attic prose, the rel. clause generally follows
    the main clause (or ‘matrix’). Here the rel. precedes the matrix and is picked
    up by an anaphoric pron. (το) in the next line (cf. 4.232–3). To judge from a
    similar state of affairs in Hittite, Vedic, and archaic Latin, this ‘left detachment’
    was probably a feature of the PIE parent language (Chantraine 1953: 236; Clackson
    2007: 174–5; Probert 2015: 44–5, 230 n. 52).


    **220 φᾶσι** This is not the vagueness that Mentes employs to conceal the identity
    of his non-existent human informants (188, 194 nn.). Teleachus is simply referring
    to people in general in Ithaca.


    **221–9** In response to this short and graceless speech from Teleachus, Mentes
    makes an equally short speech asking what is the occasion for all the feasting.


    **222 ννονμον** The MSS have νόνυμον. This will not scan and corrected by Wolf
    to the reading adopted here, which is also historically correct. The etymology
    is problematic but possibly *η-H,nomn– (Sihler 1995: 87). The epic tradition also
    knows a morphologically younger form ἀνόυμος (Od. 8.552) which exhibits loss of
    the last nu by assimilation. That is responsible for the reading of the MSS.'
