    E. M. Forster''s *Maurice*, Clive Durham advises Fetherstonehaugh to re-read Sophocles''
    *Ajax* keeping his eye on the characters.¹205 The same might have been said of
    the women in Homer. They were not called into being chiefly to generate examination
    papers in Gender Studies. We can look at them like that, if we choose, for the
    purposes of historical and anthropological investigation. But for literary appreciation,
    it is unhelpful. There are those who suppose history is key to literature. For
    example: Romans thought widows ought to remain chaste (unvira)¹206 Virgil was
    a Roman; therefore we may conclude that Dido is open to censure for loving Aeneas
    after the death of her husband Ulysses. It is one more reason why she is the first
    of many bad Carthaginians.¹207 Any sense we might have of Virgil inviting sympathy
    for Dido is to be subordinated to having historical determinant. The same sort
    of thing is easily done with Homer. There was an archaic society; everyone knows
    that at time they were less powerful than men; Penelope is an extreme example
    of the type of useful wife¹208 rather than engaging character on her own account.


    The first character mentioned in the poem is Muse. We do not know her name. She
    knows the story and the invocation is necessary if Homer is to tell what there
    is. It is striking, in a patriarchal society, the resources of memory and omniscience¹209
    should be thought to reside with female figures.¹210 It is perhaps not surprising
    that there are other goddesses distinguished by their cleverness. Among these,
