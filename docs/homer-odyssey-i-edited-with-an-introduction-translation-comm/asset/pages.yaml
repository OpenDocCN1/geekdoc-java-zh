    1.353) alternate with θάρος (Od. 1.321) proposes a καρδή (Il. 2.452). The inherited
    Proto-Indo-European ‘w’ is known to have survived into historical times since
    it is found in inscriptions written as f (taken as [w]), we sometimes treated
