    Several ancient writers thought that the place was the island of Menix (modern
    Djerba).$^{279}$ The land of the Cyclopes has been identified with the island
    of Lipari north of Sicily.${280}$ Aeolia has also been identified with Lipari.$^{281}$
    The Laestrygonians have been placed in the vicinity of Etna.${282}$ Cir has been
    placed on the Italian coast between Naples and Rome, in an area still known as
