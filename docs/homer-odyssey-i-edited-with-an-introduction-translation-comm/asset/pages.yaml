  md: '# Glossary


    Words are generally cited here in their dictionary form (1 sg. pres. ind. act.
    for verbs, nom. sg. for nouns and adjectives). This extends to irregular forms,
    so that ἐδάω and ἐσπομνην are not listed but δίδωμι and ἔπομαι are. The exceptions
    are where there is no dictionary form in use or where the form appearing in the
    text makes it difficult to establish the dictionary form. Where the epic dialect
    has a different form from Attic, the epic form is given. With proper nouns, the
    oblique cases are not always attested and cannot be predicted with certainty;
    only the nom is given. The gen. of common nouns of the 1st and 2nd declen. is
    predictable, together with that of neut. s-stems of the 3rd declen. Exceptions
    are made where the gen. is unpredictable or where other complexity arises. The
    reader is further referred to the introductory section on Dialect and Grammar
    (pp. 51–60). To wonder at the way(s) in which the word is used in Odyssey, Book
    1. This is not meant to be an exhaustive lexicon of epic Greek. For example, although
    εύχο means ''pray'' in the epic, it is not used in this way in Book 1 and so that
    sense is not listed.


