  md: "# Commentary\n\n**1–10** The proem. The poet states the subject of the epic\
    \ in a passage dense with programmatic references. It looks forward to the themes\
    \ and action of the poem as a whole, but also back to the *Iliad*. The opening\
    \ of the *Odyssey* plainly echoes that of the *Iliad*: there is the invocation\
    \ of divine aid, the request for recitation, and the statement of the subject\
    \ matter. Given (as we saw in the Introduction, pp. 1–2, 37–8) that the *Odyssey*\
    \ is later in date than the *Iliad*, it is reasonable to suppose that any apparent\
    \ contrast with the earlier poem is deliberate (see below).\n\n**1** *ἄνδρά* The\
    \ first word of the *Iliad* is *μῦην*, normally used to describe the wrath of\
    \ the gods (Mueller 1996; Pulleyn 2000: 116–17). The *Odyssey* begins with a rare\
    \ device for an uncommon thing but with an ordinary word for a man. He is not\
    \ actually named until l. 21. This is one instance of a pervasive device: Odysseus\
    \ repeatedly conceals his name (most famously by the Cyclops: Od. 9.36–7). This\
    \ is connected with some images of magic and taboo naming names (Austin 1972;\
    \ But it is a matter of art: Odysseus is a master of stratagem and lies, an attribute\
    \ that saves his life. It takes on a less creditable colour at the very end of\
    \ the poem when he conceals his identity from his grieving father (Od. 24.232–79).\
    \ It seems that all instances of verse-initial *ἄνδρά* in the *Odyssey* refer\
    \ more or less directly to Odysseus (Kahane 1992). Its marked deployment as first\
    \ word of the poem sets the pattern for these later allusive uses. This sort of\
    \ concealed referentiality is echoed in the use of deontic pronouns later in this\
    \ book (see 163 n.).\n\nIn his Teubner, M. L. West (2017: 1) prints here *ἄνδρά*\
    \ with acute accent. This is contrary to the supposed ‘rule’ that a paroxytone\
    \ word with a trochaic ending followed by an enclitic takes no accent on its final\
    \ syllable. But Herodian of accentuations such as *ἄλος* and *ἔθά ποτέ* (Probert\
    \ 2003: 148) and such writings are in MSS (M. L. West 1998a: xviii). It seems\
    \ that a sequence of vowel plus nasal ($\\mu, \nu$)"
