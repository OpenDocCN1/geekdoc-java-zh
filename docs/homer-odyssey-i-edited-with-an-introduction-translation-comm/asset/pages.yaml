  md: '# Commentary on lines 439–41


    folding and of ἀσκέ are both particip so that each appears to be an independent
    action. An attractive explanation in synchronic terms (S. R. West 1988: 127) is
    to equate ἀσκέ με κόμίζ in the sense of ‘take care of’ (cf. II 2.183); but this
    presupposes that we know more or less the semantic field into which ἀσκέ used
    itself must fall. If ἀσκέ and ἀκό were originally connected with the working of
    skins into clothes (cautiously DELG 124–5 and Linear B α-ke-ti-ra-o (= askēriāhōn,
    PY Ad 666) suggests ‘finishers’, it might be that ἀσκέ denotes smoothing the cloth
    through finishing a skin.


    440 πασάλῶ undoubtedly denotes a hook (cf. πένυμμ; DELG 860). But on the other
    occasions when it is used, it refers to the suspension of a solid item such as
    a bow (cf. II 5.209; Od. 21.53, Ad 8.67), or a yoke (II. 24.268). It seems to
    fold (πύξσα, 439) and smooth a soft garment to hang it on a hook; any folding
    would surely be spoilt.


    ἀγκρέμαασα The verb is not found elsewhere in Homer but in the Ionic prose of
    Herodotus refers to temple offerings (5.77.3, 95.1) and crucification (9.12.0).
    The simple verb is used with κατά in tmesis for taking a line down from its leg
    (Ad 8.67).


    ῥηγτοῖ The words mean ‘bored’ (i.e. with holes in) is not in doubt (cf. τετραίνν;
    Rix 2001: 632–44). Etymologic Magnum conjectures παρὰ τερήσεισα κατά τὰ ἐμπλατα,
    εἰς ἐβριλλέται πάργτος (‘from being pierced into the rails, into which the cord
    is set’). In other words, holes are bored into sides of the bedstead; on top of
    these cords lies the mattress (Laser 1968: 23).


    λέξευσ The application of this word to what has just been called a λέκτρον (437
    n) suggests the lack of real distinction between the terms (Snodrass 1970: 160).


    441 βή–μεν is The infinitive, denoting the goal of the action. This is common
    after verbs of motion (Chantraine 1968: 301). There appears to be an element of
    pleonasm when it is είναιμε (‘she went to go’); but the original sense of ἔπαϊ
    was probably that of taking a step (cf. 211 n. and μακρά βήας II. 7.213)–she took
    a step to go out.


    ἐπέρυσσε This compound is a Homeric hapax (but refers in Herodotus (4.8.3) to
    pulling a garment). It was an ordinary item in the Ionic vocabulary.


    κορήτή The noun denotes a sea-bird of some kind (Od. 5.66; 12.418). By extension,
    it may describe anything curved as the tip of a bow (II. 4.111) or a door-handle
    as it. The adj. κοωνίσ is frequently used, especially in the Iliad, to describe
    the curved beak of a ship.'
