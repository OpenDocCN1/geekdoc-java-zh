    expectation that πέν must look forward to an answering δέ, whilst in Attic prose
    does not apply in Homer. In this case, μέ has been said to be emphatic (Denniston
    1954: 359–60). γραής is a hapax in Homer but not later Greek (Eur. Held. 584).
    The related γραής is common in the Odyssey and used for Euryia (Od. 2.37: 231.1).
    Its gen. γνοής, of the correct metrical shape here, is not attested until Achilles
    in the sixth century AD (Anthologia Graeca 16.109).


    πυκυμές Homer references to μίδεια πυκνά (II. 3.208), πυκιναι φρένες (II. 14.294),
    and πυκινί βιάς (II. 2.55) make clear that this common adj., refers to the quality
    of having wise counsel. The relationship between πυκινός or πυκκό in the sense
    of wisdom and the use of πόκα to refer to tightly built structures is difficult
    to explain (see 33 n.). πυκινής is a hapax, the noun it qualifies (foreg. n.).
    ἔμβλε Not ‘threw’ but ‘put’—an attenuated sentence (cf. Il. 14.218), to be sure,
    but one that parallels in the description of putting an idea into another’s mind
    (201 n.) and 364 n.).


    439 ἦ μέν; if there is an opposition, it is marked by ἔθθα ὅ γ (443).


    τον... χιτώννα Homer generally uses ὅ,  as a demonstrative pronoun (‘that one’).
    That was the meaning of the PI ‘so, tod’ from which it is derived (Siler 1995:
    388–390). Instances as this might be taken as examples of forming (‘that thing...
    name the tunic’). It is sometimes said that the development of ὅ,  into a definite
    form was unknown in Homer; but there are instances where it is hard to construct
    it as anything else (II. 1.33, 185; Chantraine 1953: 165). Cf. 4, 9, 157 nn.


    ἀσκκάσασα This verb in the aor. ptcp. is that creative process was done carefully
    (II. 4.110; 14.179; Od. 3.438; 23.198). The construction here is different: the
    action of'
