    # Vocabulary


    We have looked at Homer''s style in terms of formulaic artistry, imagery, and
    rhetoric. Although formality is a natural focus for thinking about epic language,
    we ought not to ignore individual words, whether as part of repeated formulaic
    sequences or not. Whilst we have no samples of everyday Greek against which to
    compare the epics, it is uncontroversial—marked off by archaism, dialect, or just
    rarity. The formulaic economy tended to serve words when not only the vernacular
    of the bards but the language in which they were composing had moved on.


    Observers since antiquity have been struck by the so-called *hapaxes* in Homer,
    that occur only once. The ''absolute'' *hapax* is one which appears only in all
    of Homer (i.e. both epics together) and never again in the recorded history of
    Greek except for quotations. A Homeric *hapax* is a word which, found only once
    in Homer, is used by later Greek writers. One may also distinguish words that
    are found once in one of the epics but more often than the other. Given that Homer''s
    language is formulaic, it is surprising to find that Homeric hapaxes are quite
    common. They account for about 35 per cent of the discrete items of vocabulary
    in the *Iliad* and 33 per cent in the *Odyssey*. This is not to say that, of the
    words, 34 per cent on average are hapaxes; if one looks only 2 per cent of the
    total words used are hapaxes Even then it is striking that they occur on average
    in every ten lines.¹149


    Some of these words are true of ordinary language which, by the laws of chance,
    happen to happen only once in Homer. *περαφράζμμεθο* (76 n.) is transparent and
    much rarer prose in sense; it is hard to see that it is a Homeric coinage or to
    suppose that the audience perceived anything special about it. The same is true
    of *μέθημα* (118 n.). The noun *βουγτός* (369 n.) is plain enough in meaning but
    was probably created specially to end a line whose beginning was unique. Other
    words have the feel of exoticism, when their meaning is opaque—e.g. *ἐπαλαστω*
