    Whilst the public level there are competitive noblemen and public assemblies,
    the basic unit of society is the *oikos* (''house''). Teleachus repeatedly refers
    to the damage being done by the suitors to the wealth of the *oikos*.¹190 He also
    makes it clear to his mother¹191 and to Antinous¹192 that he has and will have
    overall power in the *oikos*. Whatever the position concerning him will be chief,
    he asserts his power over and within the household unit.


    # Slaves


    In the same breath, he mentions his ownership of the slaves, who are simply chattels,
    the booty of war brought home by Odysseus.¹193 This power is absolute and extends
    to life and death. The female slaves who have been helping the suitors and with
    them are hanged mercilessly in a death chosen to be especially ''filthy'', as
    Telemachus puts it.¹194 The nurse Eurycleia is an extraordinary case. She is a
    great support to both Telemachus and Odysseus; she is instrumental in the killing
    of the slaves and rejoices at it. But she too was a spoil of war, bought by Laertes
    for an extraordinary price when she was only a young woman.¹195 We are told that
    Laertes did not have sex with her because he feared the wife—the poet takes for
    granted, absent restraint, would have been for the taking.¹196 Apart from the
    *dikiai*, other free staff are called *amphikoloi*¹197 and *korvoi* of the *theatron*¹198
