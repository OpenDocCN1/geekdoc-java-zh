    or to the activities of later critics. In particular, the correspondences that
    are apparent when one divides the poem into two reveal the greatest degree of
    deliberation in arrangement.


    In the end, everything hinges around the visit to the Underworld Book 11. As the
    Mesopotamian hero Gilgamesh goes to Utn-Pishhtim, survivor of the Flood, and learns
    the great truths about life and death, Odysseus learns his destiny from Teiresias.94
    The Iliad is an almost unbearearably concentrated narrative of death and loss;
    the Odyssey is about life—it might be complex and challenging but it is also breath-taking
    in the possibilities that it offers and are also exemplified in a man like Odysseus.
    When Achilles says that he would occupy the lowest and most severe station on
    earth rather than being king over all the death,95 he plainly regrets of the choice
