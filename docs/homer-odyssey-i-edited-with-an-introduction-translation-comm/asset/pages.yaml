  md: '# Commentary on lines 442–4


    442 ἀγρυή The use of precious metals for a door-handle was presum- ably an aristocratic
    luxury. King Alcinous of Scheria, egregious in this respect as so many others,
    has a golden handle for his palace (Od. 7.90).


    κλειεδ’ In ancient Greek, this word routinely means ‘key’. In Homer, it may have
    a range of meanings including collar bone (Il. 8.235) or rowing bench (Od. 2.419).
    In the domestic context, it may refer to a hook that serves as a key, being inserted
    into a hole in the door to manipulate the strap (ἱ) attached to the bolt (ἄ) that
    kept the door locked. Here, it refers to the bolt itself: Euryhelia closes the
    door after by the handle and pulls on a strap that passes through the keyhole
    as to shoot the bolt into the keep and lock the door. This is a one-way operation.
    Because of the positioning of the keyhole relative to the bolt, the bolt is in
    the keep cannot be withdrawn by pulling from outside. The operation of opening
    a door is described at Od. 21.46–50. One passes through the keyhole a curved hook
    designed to catch the strap, allowing one to push and so move the bolt in the
    opposite direction out of its keep (Diels 1897:12–9). Telemachus can leave at
    any time since he is the inside and can move the bolt without a hook.


    443 πάννυχος Of the seventeen instances of this adj., only refer to persons getting
    a good night sleep (Il. 2.2, 24; 61.2; 24.678). Elsewhere and, so much, normally
    it refers to spending the night awake, even when bad things are happening (Il.
    7.476, 478; 8.508, 554: 18.315, 354;23.105, 217; Od. 2.434;7.288; 12.429).


    ἰὸς ἄτος This expression has caused much puzzlement and has been to mean ‘finest
    wool’ of the (unprovable) basis that ἄτος in Homer means ‘flower’ or so. Whether
    the case in late Greek, there is surely a formal parallelism between Homer λνοιο...ἄτος
    (Il. 9.661) and ἰτος (here and 4x elsewhere); ἄτος might mean no more than ‘which
    lies on the surface’: the nap of linen and the wool of a sheep (Raman 1975). It
    would be a poetic expression for wool with no quotations to quality. There is
    no need to suppose that Telemachus slept under a raw fleece; ἄτος can refer to
    wool that has been worked into a sling (Il. 13.599) and so, presumably, also into
    a blanket (S. R. West 1988:127).


    444 πέφραδ’ An augmented reduplicated 3 sg. aor. ind. act. of φράζω; see 273 n.
    The type is very common (Chantraine 1958: 395–8). A sigmatic aor. φράσασ is also
    found (Od. 11.22). Both forms are old.'
