    1 2 3 4 5 6

    —|—|—|—|—|—×³⁸²


    The shortest syllable is a single vowel (V). The sequence VV (unless it is a diphthong)³⁸³
    analysed as two syllables of the shape V–V. Where consonants (C) are involved,
    the sequence VCV is treated as V–CV and VCC is generally treated as VC–CV (but
    see below plosive and liquid). Any syllable ending in V is an open syllable; any
    syllable ending in C is closed.


    A syllable is light for metaphorical purposes if it is open and contains a vowel
    that is phonetically short. An open syllable that contains a phonetically long
    vowel or a diphthong is prima facie (but see ‘correction’ below). A closed syllable
    is always heavy, even if it contains a phonetically short vowel.


    For purposes of syllabification, words are treated as a continuous stream. Thus
    if word ends in a short vowel, the following word with two plosives,³⁸⁴ will be
    treated as closed and metrically heavy: e.g. ἐχθόν (Od. 1.196) is treated as ε–πίχ–θο–νυ.
    Similarly a short vowel followed by a single plosive at the end of a word becomes
    part of a heavy syllable if the following word begins with another plosive, e.g.
    νάος δενδρήσσα (Od. 1.51) is treated as νη–σος–δεν–δρη–ε–σα.


    Although it is convenient to talk of long and short syllables in metre, it is
    preferable to think in terms of heavy and light. This is because it is easier
    to distinguish clearly between vocal length and syllabic weight. In the word æ
    for example the syllable is heavy because it is closed; the vowel is phonetically
    short, pronounced as [ɛ] like the first vowel in English editor not [ɛ:] as in
    heir. The word itself would eventually have come to be written as *άστί. This
    is the mischief of the old nostrum ‘a vowel is long followed by two consonants’
    and the related idea of a vowel being ‘long by position.’ A short vowel is always
    short; it is not long because of its position.


    ³⁸² The symbol is known as anceps and represents a space in the metre that may
    be occupied by a heavy or a light element.


    ³⁸⁴ A diphthong is a sound that completely obstructs the egressive air stream,
    e.g. [p], [b], [t], [d]. It is not correct to say that a short vowel is always
    part of metrically heavy syllable if it is followed by just two consonants. A
    sound as [l] or [r] might loosely be classified as a consonant, but it does not
    completely abstract the air stream. The combination [pr] or [tr] in Greek is sometimes
    treated as though it were two plosives and sometimes not. See below ‘Plosive and
