  md: '# Commentary on line 1


    Although the verb as ἐνέπε (< *sek-* ) belongs with Lat.inseque/insecce (Andr.
    poet., 1). Germ, sagen, and Eng (Fournier 1946: 47–8). The usual form has only
    one -w-; the -iw is Aeolic, the regular outcome in that dialect of -en*ke < -en*ke
    (De Decker 2015: 121, pace Wyatt 1969: 94–6).


    Μοῦσα (“the Goddess”) invoked in the first line of the Iliad must be a Muse; here
    she is explicitly called. Hesiod told us that they are in number and gives their
    individual names (Th. 76–9); Homer invoked them generically as a group (Il. 2.484)
    or an individual (as here; also II. 2761).


    It has been suggested that Μοῦσα meant ‘lady of the mountain’, adding the suffix
