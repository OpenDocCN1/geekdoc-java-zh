  md: '# Introduction


    which in turn points up the antiquity of the linguistic tradition inherited by
    Homer.^{419}


    # Short-vowel subjunctives


    In Attic, there is a distinction between indicative forms with a short vowel and
    subjunctive forms with a long one: λύει, λῃ, λύται, λύται, λύμεν vs λύωμεν, λύνται
    vs λύωνται. This highly regular state of affairs is the result of some remodelling
    of the paradigm. If we look at an athematic form such as ἐμῖ (''I shall go''),
    the 1 pl. pr. act. is ἐμεν (''we go''). We see that the ending –μει is added to
    the root with no thematic vowel. The inherited Proto-Indo-European subjunctive
    marker was */- (e.g. Il. 2.526). Homer preserves a good many thematic short-vowel
    subjunctives besides the newer forms with a long vowel (e.g. ακειται, αγται, II.
    11.192, 21.536). The long vowel arose in the thematic forms which have a stem
    vowel /(ie. identical to the subjunctive marker) root and ending. This coalesces
    with the subjunctive marker to form a long vowel: thus *beugh + o (thematic) +
    o (subjunctive) + men > φέγυμεν (II. 9.27). The ending could then be reanalysed
    as –ωμεν in all cases and applied to a forms to give, e.g. πάύσσωμεν (II. 7.29).


    # Irregular verbs


    Even in classical Greek, it is hard to speak of irregular verbs since this implies
    there are others that are perfectly regular. Even λω is not quite that, if one
    recalls the root vowel is not stable but changes its length in some parts of the
    paradigm. Nevertheless, the parts of ἐμί (''I am'') and εἰμί (''I shall go'')
    can cause difficulty in Homeric Greek because of their irregularities and so set
    out in some detail: n/a means ''not attested''.


    > εἰμί (''I am'')


