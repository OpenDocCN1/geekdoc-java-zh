  md: '# Technical Terms


    # 285


    Grassmann''s Law


    An instance of dissimilation the first of two successive aspirates loses their
    aspiration, e.g. the genitive of Gk. θρίξ is realized as τριχός rather than *θμύχός.


    Hiatus


    The occurrence of two distinct vowels in adjacent syllables with no intervening
    consonant, e.g. between πευθού ἄλοι.


    Hypocoricistic Imperfect


    A diminutive or ''pet'' name for a person.


    See aspect.


    Inchoative


    Indicates an aspect that is being; cfg. inversive.


    Indo-Iranian


    A branch of the PIE language family that includes Vedic Sanskrit (Indic) and Avestan
    (Iranian).


    Ingressive


    A synonym for inchoative.


    Lectio deficior


    Lit.''s more difficult reading—refers to the idea that one has a choice between
    two different readings at a given point in a manuscript tradition, the more difficult
    is likely to be correct since scribes tend to brush out or ''correct'' forms that
    seem unfamiliar or difficult.


    Lectio facior


    Lit.''s easier reading—see previous entry. The easier reading is not necessarily
    the correct one.


    Lexeme


    A unit of meaning that exists irrespective of the inflected forms in which it
    is found. Thus and will belong together as different forms of the same lexeme
    represented as WILL; am, is, are and belong to the lexeme BE; goose and geese
    are instances of GOOSE; headwords in a dictionary are usually lexemes.


    Metathesis


    The rearrangement of sounds within a word (e.g. 225 n.).


    Morpheme


    A morpheme is the smallest unit of grammatical meaning in a language. Thus in
    English the plural ending -s or the past tense endings -ed are morphemes.


    O-grade


    A sound change whereby, in Greek and possibly some other PIE languages, a long
    vowel is shortened before *l, *m, *n, *r, or *u by a consonant.


    Osthoffff''s Law


    See aspect.


    Proto-Indo-European—a hypothetical parent language reconstructed as the ancestor
    of Latin, Greek, Armenian, and other languages whose historically attested forms
    show that they belong together as a family.


    PIE


    The use of more words than are necessary, e.g. cod fish.


    Pleonasm


    See p. 46 n. 34.


    Plosive


    Pre-Greek


    A stage of Greek not attested but assumed to have existed in order to explain
    the historically attested forms. It represents a phase after the PIE parent language
    broke up and began to be differentiated into its discrete daughter languages.'
