    # Travel and Trade


    In the age of Jane Austen, not so very removed in time from our own, travel by
    horse and carriage was wasesome and most ordinary people did not go outside the
    country where they lived, much less overseas. For most people, the same remained
    true until the twentieth century. In spite of the advent of the airplane, foreign
    travel was prohibitively expensive until the package holiday came into being.
    Things can scarcely have been different in archaic Greece: most people will not
    gone far. But their imaginative literature is the product of an elite, and some
    poets plainly quite wisely for poetic contests²⁷¹ and patronage. The epics, in
    particular, transcend the limits of space, albeit in different ways. The Catalog
    of Ships in Book 2 of the Iliad describes the places of origin of many military
    contingents that were present at Troy. This is the only real hint of a wider world
    in a poem whose action unfolds in an almost claustrophobic atmosphere before the
    walls of Troy. The Odyssey, on the other hand, is drawn on a much larger canvas
    of graphical information (Map 1).²⁷³ The wanderings of Odysseus are the earliest
    core of the poem around the homecoming and Telemachy coalesced later; they show
    us the much larger world. The Odyssey contains many place-names, of which are
    apparently still in use today (albeit not necessarily the same places)²⁷⁴ and
    others were the subject of speculation already in antiquity (Maps 24, 2b). The
    difficulty is that the poem is not a travelogue; it is a work of imagination that
    blends the imaginary with real in ways that are satisfying for the audience but
    less so for the geographer.²⁷⁵


    On the way back from Troy, Odysseus and men pause to pillage Ismarus in Troy,
    to the Cicon who were all allies of the Trojans.²⁷⁶


