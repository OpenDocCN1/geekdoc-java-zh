  md: 'Give it him, for he was in awe of the indignation of the everlasting gods.

    But my father gave it to him; for he loved him fearfully.

    Would that, being like that, Odysseus might join battle with the suitors.


    Then they would all die early, having attained a bitter kind of marriage.

    But indeed these things lie in the lap of the gods,

    Whether he returns home safe and takes vengeance or not,

    in his house. I urge you to ponder

    How you will drive the suitors out of the house.

    But come now, listen and take heed of my words.

    Tomorrow call the Achaean champions to an assembly,

    Make a clear speech to them all—and let the gods be witnesses.


    Bid the suitors to disperse their own property,

    And your mother—if she is eager to marry,

    Let her go back to the house of her mighty father.

    They will furnish a wedding and prepare a dowry,

    A very large one, such as it is fitting accompany a dear daughter.


    But to you I shall shrewd advice, if you will need it:

    Fit out a ship with twenty oarsmen—the best [ship] you have—nAnd go to enquire
    your father, who has been absent a long time.


    If some mortal man should tell you of him, or you hear from Zeus

    Some rumour—which is the chief bring of news to people.

    First go to Pylos and ask illustrious Nestor,

    And there to Sparta to see fair-haired Menelaus,

    For he was the last of the bronze-clad Achaeans to return.


    If you hear that your father is alive and safely on his way home,

    Then you endure for yet another year, in spite of being worn out.

    But if you hear that he has died and is no longer,\Then come safely home to the
    land of your fathers

    And heap up a mound for him and celebrate his funeral with grave grounds—


    Very great in number, as many as is fitting, and then give your mother to a husband.

    But when you have finished doing these things,

    Then ponder in your mind and in your spirit,'
