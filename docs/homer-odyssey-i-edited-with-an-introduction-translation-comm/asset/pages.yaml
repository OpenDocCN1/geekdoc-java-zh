    labourers¹⁶⁵ are confined to the limits or the Shield of Achilles or appear as
    incidental to descriptions of something. The Odyssey gives a surface impression
    of a more settled and ordinary world, but this is truer of the second half than
    the first. The poem tells us Odysseus visited many αρεία (cities); he did not.


