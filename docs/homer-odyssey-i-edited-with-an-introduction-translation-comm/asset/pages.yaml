  md: '# Technical Terms


    A number of technical terms and symbols appear in this book. Since these might
    not be familiar to all readers, explanations are given below. A certain level
    of knowledge is taken for those who come to a book of this kind, so that concepts
    such as verb, noun, active, passive, and the like are not explained. Those unfamiliar
    with such matters could begin by consulting Gwynne (2013); a convenient introduction
    to Indo-European Fortston (2009). Terms that are explained as they occur in the
    text are not explained again here. A superscript § indicates that a term used
    within a definition is itself defined elsewhere in this glossary.


    # A. Symbols


    +   * Indicates an unattested or non-existent form. Typically used for reconstructions
    of PIE''s or pre-Greek.§


    +   a > b

    Indicates that a evolved into b.


    +   c < d

    Indicates that c was the result of an earlier form d.


    +   C

    Consonant


    +   H_1, H_2, H_3

    A group of three sounds called laryngeals, not directly extant in historical Greek
    but assumed to have existed in PIE. Their prehistoric phonetic qualities are controversial
    (Clackson 2007: 57). The following developments from PIE to Greek are important:
    *CH > Ce, *CH > CaC, *CH > CoC, *HC > e, *HC > C, *HC > o, *H_2 > e, *H_2 > a,
    *H_2 > o, *H_3 > , *H_3 > ā (in Attic-Ionic), *H_3 > ö.


    +   k*, g*, g^h*

    A group of sounds called labio-velars, not directly extant in historical Greek
    but assumed to have existed in PIE. Depending on the following, *k* > Gk, p, t,
    or k; *g* > Gb, b, d, or *g^h* > Gk, p^h, t^h, or k^h.


    Vowel


    +   Ablaut

    The alteration of vowels between e, o, and zero to mark inflectional or derivational
    categories: e.g. λέπεια (e-grade verb), ἐλιμμα (o-grade verb), λογιοτικός (o-grade
    adjective), ἐλιπον (zero-grade verb).


    # B. Technical Terms


    +   Apcope

    The loss of one or more sounds at the end of a word, e.g. παρά may be reduced
    to παρ (192 n.).


    *'
