    sometimes have the unexpected effect of closing the preceding syllable so that,
    if it contains a short vowel, it is treated as metrically heavy: e.g. ἐνὶ μεγέραίσσιν
    (Od. 1.27) is treated as though it were ἐνὶ μεγέάρσιιν. This phenomenon appears
