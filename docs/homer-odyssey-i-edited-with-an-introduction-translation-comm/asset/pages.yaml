  md: '# Technical Terms


    284


    Apodosis


    The second limb of a conditional (''*if... then*) clause.


    Aspect


    Describes the marking of a verbal action in terms of the time of its occurrence
    but whether it is punctual (perfective) or durative (imperfective) in character
    ''*He threw*'' and ''*he was throwing*'' both occurred in the past; the difference
    is one of aspect, not tense. *arrive* is generally used punctual whereas walks
    is durative. But arrive may be presented imperfectively (e.g. ''he was just arriving
    when the fire alarm went off'') and walk may be used perfectly (e.g. ''he walked
    to work that morning'').


    Asyndeton


    A lack of explicit connexion between two items which nevertheless belong together,
    e.g. Visit Morecombe, die happy.


    Thematic


    A verb or noun that cognates the theme vowel.*s


    Caland


    A Caland formation is where an adjective whose stem ends in *-o* may substitute
    an -i ending when the adjective appears as the first element in a compound. (Since
    this rule was formulated by Willem Caland in the nineteenth century, it was discovered
    that other lexical forms are also involved in this phenomenon.)


    Cognate


    Two or more words are cognate when they are etymologically derived, e.g. Skt.
    *itar*, Greek *παπίτήρ*, Lat. *patēr*, Eng. *father*.


    Concordance


    interpolation


    A line attested in the MSS tradition, a Greek word derives ill-suited to the context
    where it is and finds suspects of being an interpolation, the explanation being
    that it has been lifted bodily by a scribe from its original context.


    Copulative


    The copulative alpha at the beginning of a Greek word derives expresses unity,
    e.g. *ἀ-δελφφός* (''brother'' < PIE *\*one-* (''of the same womb''). It might
    alternamely just reinforce the basic source of the word which is prefixed, e.g.
    *ἀ-σπεσχθείς* (''furiously''; 20 n.), it is opposite to the perfective.*s


    Corruption


    A verbal category specifically marking or or desire on the part of the subject.


    Desiderative


    See Introduction, p. 49.


    Diectasis


    See Introduction, p. 52.


    Digamma


    See Introduction, p. 47–8.


    Dissolution


    Where two sounds of a similar kind occur in quick succession, one or both may
    lose a distinctive feature such as aspiration or disappear afterglow.


    E-grade


    A word so closely associated in pronunciation with the one preceding that it has
    no accent of its own.


    Enclitic


    Figura


    etymologica


    A figure of speech where two words are juxtaposed which are, or imagined to be
    cognate (e.g. 241 n.).'
