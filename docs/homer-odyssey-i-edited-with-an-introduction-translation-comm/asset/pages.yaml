  md: '# Commentary on line 1


    or liquid (λ, ρ) was equivalent to a dipthong. in that such sequences are given
    two notes, just like long vowels (Vendryes 1904: 85–6). ἀνδρα could thus in principle
    be treated like other words of trochaic shape and take two accents before an enclitic.
    The first accent when written in the MSS is acute rather than the circumflex;
    but the pronunciation of ἄλλοτις, ἐνθὰ ποτε, etc., would have been equivalent
    to that of (e.g.) ἄκοις (Probert 2003: 149). Aristarchus marked the accentuation
    ἀνδρα μοῦ but refused to allow it into his text based on the idea that it would
    create ‘cacophony’ in the opening word (Chander 1881: 279). If the rule of general
    application, it is not to be disregarded simply because Aristarchus did not like
    the result. But all one of the MSS that have transmit ἀνδρα μο ἀνδρά, that could
    be the result of Aristarchan influence.


    μoi generally interposes his own personalità, in a way that he does not in the
    Iliad. He seems to make himself the mouthpiece of the Muse. But he later uses
    the phrase ἡμῖν (10 n.).


    ἐνεπε. In the Iliad the goddess is asked to sing; here the Muse is asked to tell.
    We might see in all this no more an elegant variation (Μοῦα – θεῖ; ἔνείπε – ἄῖδε).
    But speaking and singing are not the same thing. Σ ἀῖδε appropriate to the opening
    of the Iliad the poet wanted to add the pleasure of such an otherwise difficult
    subject; by contrast, Σ makes Homer seem more like an orator to a bard. Words
    of the family ἄἰδ–ἰάδ are specific to bard song, given to mortal singing by the
    Muses (Od. 8.43, 64 to 73; cf. 1.155 n.). But it is common for the Muse to be
    asked to ‘tell’ to ‘sing’ (Il. 2.484; 11.218; 14.508; 16.112).


    The verb ἐνπέω is said to be archaic and to impart sovereignty (S. R. West 1988:
    69). Its aim may be perceived from its wide aside temptation (Frisk 1954–70: 1.521)—although
    not in the IndoIranian branch, whose evidence is evident of high antiquity. For
    solemnity, it is often used to express the speech of gods–mostly in the Iliad
    (Il. 2.761; 7.447; 8.412; 11.186), but also in the Odyssey (Od. 5.98). We might
    assume that this was the original source of use (Strunk 1957: 25), especially
    as it is also used to tell by humans of oracles and dreams, which are often divine
    in origin (Il. 2.80; 5.438). It is commonly associated with ὑμεμερτης (‘errant’;
    e.g. Il. 13.470). It seems that this verb is used ‘almost always telling of things
    which are of more ordinary importance to the speaker’ (LfgrE, s.v.). Peculiar
    to the Odyssey is the use of ἐνπέω–sometimes with ὑμεμερτης (Od. 3.93, 327; 4323)
    but sometimes (Not. 3.101, 247; 4331; 17529)—when news is being sought of the
    fate of Odysseus.'
