    like the fox, showing us a vivid panorama of many kinds of things. While the cunning
    and endurance of Odysseus are major themes, there is also a palpable fascination
    for exploring the endlessly varied marvels and strangeness of the bigger world
    away from Troy. The *Iliad* might be said to be a tragic poem; the *Odyssey* is
    not. A chillingly bleak outlook that leaves little for comfort but moves us to
    great admiration for human dignity in the face of divine inscrutability and whim;
    in the *Odyssey*, we are supposed to think that things have in the somehow been
    put to rights (even the deadly and merciless justice meted out by Odysseus and
    his son not quite square with our modern sensibilities). The *Iliad* deals with
    reversal of fortune and irreparable loss; the *Odyssey* is the archetypal precursor
    of the European novel. In that sense, it might be said that George Steiner imagined
    society in which which writing about literature should be prohibited because the
    highest form of reflection on literature is more literary art. Following that
    line of thought, one might see Virgil''s *Aeneid*, Dante''s *Divine Comedy*, and
    Joyce''s *Ulysses* as more compelling responses to the *Odyssey* than much of
    the ink spilled by those of us who write books like the one you are reading. Its
    purpose, however, is not to punish people with judgements rendered incontrovertible
    by the scientific investigations upon which they rest, but to assist readers to
    form their own views through the close reading of a work of genius produced in
    a milieu very different from our own but nevertheless speaking to us freshly about
    things that matter.


