    Within the line, variations of tempo are achieved by altering the preponderance
    of light and heavy syllables. In a context where there is motion, the thought
    is underlined by the use of tripping dactyls (--) to the fullest extent allowed.
    So when Eurycleia leaves Telemachus at the end of our book, we find (441):


    > Βῆ ῥ'' ἵμεν ἐκ Θαλάμίου, θύρην δ᾿ ἐπέρυσσε κορίνην.


    This does not mean every dactylic line accompanies or implies movement, only that
    there can be a happy coincidence of content and form. By the same token, a heavily¹⁵⁵⁴
    spondaic line might be by its ponderousness solemn to what is said. Thus, when
    Eurycleia is introduced, it adds with full patronics that take up the entire line
    and represent four spondees out of a possible six:


    > Εὐδρκλεί, ώπος θυγάτηρ Πεισνηρρίδο.


    # Conclusion


    Whilst we speak of this ''effect'', one cannot suppose that there is a tool-box
    which holds bard to use dactyls for one effect, spondees for another, enjambment
    for a third, and an ascending tricolon for something else. All we can do is attentive
    to the overall pros of the verses, and to wonder whether there might be coincidences
    of form and content. But, just as matters of verbal allusion must ultimately be
    matters for individual judgement (literary criticism not being mathematics), the
    existence of these effects must also to some extent depend on what the individual
    reader finds. The most that the commentator can do is to provide suggestions and,
    where appropriate, parallels.


