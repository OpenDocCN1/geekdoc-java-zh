    # Physiology and Psychology


    We live in a world where the workings of the human body may be known by anyone
    with the curiosity to find out: the heart pumps blood, the lungs for oxygenating
    it, and the brain is thinking gets done. None of these seemingly self-evident
    facts was known to the epic tradition. The locus of thought and impulse is variously
    described as being the θυμός, φρένεις, or κράδινή (together with some other locations)²⁹⁴
    The early Ionian medical texts teach that the brain was thought of as a centre
    for the production of semen, which was identified with the cerebrospinal fluid²⁹⁵
    The function of the brain was not well understood until Galen; and it was not
    until Harvey discovered capillaries in the seventeenth century that the picture
    was complete. The ψυχή is like ''breath'' and the μένος at Athena puts more likely
    to have been considered as a vigorous motion than an abstract quality of courage.²⁹⁶


    One can draw too many conclusions from all of this. Bruno famously observed that
    Homer had no single word for the living body (ῶμα corps); instead we find the
    plurals μέλη και γົວ (limbs).²⁹⁸ By the same name, the mention of processes does
    not to a unitary organ by θυμός, φρένεις, or κράδινή, is taken as proof that Homeric
    had no sense of a unified personality; there was just a jumble of physiological
    structures that were open to psychic influences of various kinds.²⁹⁹ All of this
    evokes a worthy of noteworthy the palmy dates of live Victorian anthropology.
    As Martin West pointed out, the Greeks did not have a singular word for their
    backsides either: that they used the plural  did not mean that they lacked an
    understanding of the posterior as a unitary entity.³⁰⁰ One can go far in supposing
    that linguistic devices such as this are actually a reflection of the cognitive
    universe of the speaker. In the same way, although writers have suggested that
    Homeric characters do not make real decisions but are the puppets in a divine
    theatre, this too is an exaggeration and a careful reading of the text shows otherwise.³⁰¹
    Of course it is legitimate to point to the ''oddess'' of Homer, but it ought not
    to be overstated.


    This is important because, at some level, it is not hard to see reflections of
    the world we know in the world of the Odyssey: uncertain


