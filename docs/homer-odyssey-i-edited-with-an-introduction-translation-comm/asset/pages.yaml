    # THE WORLD OF THE ODYSSEY


    Bygone school-texts of the Odyssey often sported diagrams attempting to reconstruct
    the place of Odysseus from the indications given in the text, what the furniture
    looked like and so far. This is a perfectly reasonable endeavour—the world described
    by the poet presumably had some material and social controls and would have to
    be something that the audience could relate in its imagination. But both epochs
    come at the end of a very long tradition. As their language preserves features
    of high antiquity beside newer forms, their material and social world is not a
    snapshot of one period. In the Iliad, heroes almost always use bronze weapons;
    but there are references to iron for agricultural and industrial tools. This situation
    was unknown in the world revealed to us in the military sphere. By archaeology,
    where the replacement of bronze by iron began in the same way, warriors are described
    as chariots, but only for transport; the tradition seems unaware that people once
    used to fight from them.¹


    This only appears to be a problem if we mistake what the epics were and conclude
    that they were a bad attempt at history. No one can judge poems by the same standards
    as a monograph in historical anthropology. That is, the epics, if we allow for
    some drawbacks to the Bronze Age,¹⁵⁶ the world they depict is fundamentally Mycenaean.¹⁵⁷
    It has a sociological coherence describing ‘what some late eighteenth-century
    Greeks thought the heroic world to have been like.’¹⁵⁸ That world was probably
    located in their collective imaginary of the late ninth and eighth centuries.¹⁶⁰


