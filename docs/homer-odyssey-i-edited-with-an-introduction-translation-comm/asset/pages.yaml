    # METRE


    Metre (from Gk. μέτρον, ‘measure’) is a way of imposing a rhyth pattern on words.
    In English poetry, the organizing principle within the line is the number of syllables
    and the pattern of stresses. In some poetry, by no means all, rhyme may also be
    a feature. Thus, for example, here is a four-line stanza with a rhyme scheme of
    ABAB, a syllabic count of 8686, and stress on every second syllable (ambiac):


    > Intó my heart an air that kills

    From yón far coントリー blows:

    What are those blue remembered hills,

    What spires, what farms are those?

    A. E. Houseman, A Shropshire Lad, XL


    In Greek poetry, by contrast, there is no rhyme and the organizing principle is
    not stress but the patterning of heavy and light syllables (— and respectively).
    The epic was composed in dactylicameters, a line of six feet (or metra). The first
    five are dactyls (◡) or spondees (—), although a spondeee in the fifth foot is
    unusual. The last foot must be a spondeee or a trochee (—). The full scheme is
