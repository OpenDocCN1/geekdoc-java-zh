    # Elision


    A final vowel is regularly struck out before a vowel or diphthong at the start
    of the following word: e.g. δ’ γ’ ἐν (Od. 1.4). In the comparatively rare cases
    where this does not happen, we have apparent or actual hiatus (see below).


    # Correction


    A phonetically long vowel or a diphthong may be treated as metrically light when
    followed by a short vowel: e.g. ἦπποι, οἶ (Od. 1.8). There are about 160 places
    where a connected diagamma prevents correction of a long vowel or diphthong: e.g.
    δὴ ἕτος (Od. 1.16).<sup>39⁴</sup>


    # Synizesis


    Sometimes two vowels, a vowel and a diphthong, are blurred together and treated
    as one syllable: e.g. δατέβντο (Od. 1.112).


    # Hiatus


    It is possible, but very unusual, for two vowels to stand next to each other without
    elision, correction, or synizesis occurring. There are more than 2,300 examples
    of a digamma preventing the elision of a short vowel in what without the digamma
    would look like on the page like hiatus (e.g. ἄγεααὼν, Od. 1.4).<sup>39⁵</sup>


    # Caesura


    There are rhythmically mandated pauses (caesura) within the epic hexameter. They
    occur only at the end of a word within a foot. The caesura must have been for
    the bards far more significant than the boundaries between feet. Many formulae
