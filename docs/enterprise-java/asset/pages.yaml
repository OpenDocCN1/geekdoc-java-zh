    # 19.6 Java Naming and Directory Interface Introduction


    The Java Naming and Directory Interface (JNDI) is an application programming interface
    (API) that provides naming and directory functionality to applications written
    using the Java programming language. It is defined to be independent of any specific
    directory service implementation. There are varieties of new, emerging, and already
    deployed can be accessed in a common way. Enterprise level applications use of
    different directory services-lookup services that locate resources associated
    with a particular name.


    JNDI enables Java platform based applications to access multiple naming and directory
    services. Part of the Java Enterprise application programming interface (API)
    set, JNDI makes it possible for developers to create portable applications that
    are enabled for a number of naming and directory services; file systems; directory
    services such as Lightweight Directory Access Protocol (LDAP), Novell Directory
    Services, and Network Information System (NIS); and distributed object systems
    such as the Common Object Broker Architecture (CORBA), Java Remote Invocation
    (RMI), and Enterprise JavaBeans (EJB).


    # 19.7 What is a Naming Service?


    A fundamental facility in any computing system is the naming service--the means
    by which names are associated with objects and objects are found based on their
    names. When using almost any computer program or system, you are always naming
    one object or another. For example, when you use an electronic mail system, you
    must provide the name of the recipient. To access a file in the computer, you
    must supply its name. A naming service allows you to look up its given name.


    Naming service provides a mechanism to name objects and retrieve objects by name.


    If you want to associate an object with a particular name, you have to bind it.
    Once the object is bound, it can be accessed through the lookup operations and
    through the operations working with names (rename, rebind, unbind).


    Some objects can be bound directly so they are used in the system as references.


    A naming service''s primary function is to map friendly names to objects, such
    as addresses, identifiers, or objects typically used by computer programs.


    For example, the Internet Domain Name System (DNS) maps machine names to IP Addresses
    :


    ```

    www.test.com => 192.0.2.5

    ```'
