    The new No-Interfaces View enables the customer to use the Enterprise JavaBeans
    (EJB) class as the local interface. This is supported when :


    +   * The bean does not expose any other client views (Local, 2.x Remote Home,
    2.x Local Home, Web Service) and its implements class is empty.'
