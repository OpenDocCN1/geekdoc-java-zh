    # 2.1.4 Multier Architecture


    The Multier architecture (often referred to as n-tier architecture) or multi-layered
    architecture is a client-server architecture in which presentation, application
    processing, and data management functions are physically separated. The most use
    of multier architecture is the three-tier architecture.


    N-tier architecture provides a model by which developers can create flexible and
    reusable applications. By segregating an application into tiers, developers acquire
    the option of modifying or adding a layer, instead of reworking the entire application.
    A three-tier architecture is typically composed of a presentation tier, a domain
    logic tier, and a data tier.


    The concept of layer and tier are often used interchangeably, fairly common point
    of view is that there is a difference. This view holds that a layer is a structural
    mechanism for the elements that make up the software solution, while a tier is
    a physical mechanism for the system infrastructure. For example, a three-layer
    solution could be easily deployed on a single tier, such as a personal workstation.


    This system represented as a stack of tiers:


    +   1. Client Tier : This tier represents all device or client systems accessing
    the system or the application. A client can be a Web, a Java or other application,
    a Java applet, a WAP phone, a network application, or some device introduced in
    the future. It could even be a back process.


    +   2. Presentation Tier : This tier encapsulates all presentation logic required
    to service the clients that access the system. The presentation tier intercepts
    the client requests, provides single-sign-on, session management, controls all
    business services, and responds to the client. Servlets and JSP reside in this
    tier. Note that servlets and JSP are not UI elements, but they produce UI elements.


    +   3. Business Tier : This tier provides the business services required by the
    application clients. The tier handles the business data and business logic. Typically,
    most processing for the application is centralized into this tier. It is possible
    that, due to legacy systems, some business processing may occur in the resource
    tier. Enterprise bean components are the usual and preferred solution for implementing
    the business objects in the business tier.


