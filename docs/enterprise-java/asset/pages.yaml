  md: '# Action Elements


    only parameter page = "relativeURL". This relativeURL represents the file to which
    the request will be forwarded.


    We can pass the parameter names and values to the forwarded file by a <jsp:param>
    tag. We can use multiple <jsp:param> tag inside the <jsp:forward> tag if we have
    to pass more than one parameter to the target file. The name attribute specifies
    the parameter name and takes a string literal as a value. These parameters are
    evaluated at runtime.


    In this example we are passing parameters to a file using <jsp:forward> tag. Inside
    this tag we have used the <jsp:param> tag. This tag is used to pass the name and
    values to the targeted file. These parameters will be retrieved by the file using
    request.getParameter() method. In this way we can pass and retrieve the parameters.


    Example:


    ```

    <html><head><title>Parameters</title></head>

    <body>

    <jsp:forward page="ssParameters.jsp">

    <jsp:param name="myParam" value="Amar Patel/"

    <jsp:param name="Age" value="15"/>

    </jsp:forward>

    </body></html>

    ```


    This page has a parameter forwarded to: <br><b>Name:</b></br <%= request.getParameter("myParam")
    %><br><b>Age:</b></br <%= request.getParameter("Age") %>


    # 14.5 Loading a Javabean


    Java Bean is a java class that should follow following conventions :


    +   * It should have a no-arg constructor.

    * It should be Serializable.

    * It should provide methods to set and get the values of the properties, known
    as getter and setter methods.


    # 14.5.1 Adding a Bean to a JSP Page


    The jsp:useBean action is used to load or instantiate a bean class. If object
    of the bean is already created, it creates the bean depending on the scope. If
    object of bean is not created, it instantiates the bean.


    Synax:


    ```

    <jsp:useBean id="instanceName" scope="page | request | session | application"
    class="packageName.className" type="packageName.className" beanName="packageName.className"
    <%%= expression %>

    </jsp:useBean>

    ```


    # Attributes and Usage of jsp:useBean action tag


    +   1. id : is used to identify the bean in the specified scope.

    2. scope : represents the scope of the bean. It may be page, request, session
    or application. The default scope is page.'
