    # 6.1.2 Advantages of JDBC


    +   1. Providing Existing Data : With JDBC businesses can continue to use their
    installed databases and access information if it is stored on different database
    management systems.


    +   2. Easy Development : With JDBC development of application has become an easier
    job which is also cost effective with JDBC API & Java API JDBC made the process
    simple by hiding details at the time to access different tasks of database. The
    majority of the work inside the JDBC API is very easy to learn, Inexpensive to
    maintain & easy to deploy.


    +   3. No need of Configurations for Network Computers : With JDBC there is no
    need of configuration on the client side centralizes software maintenance. Development
    of JDBC is written in the Java, so all the information needed to make a connection
    is completely defined by the JDBC URL or a DataSource object. DataSource is registered
    with a Java Naming and Directory Interface (JNDI) naming service.


    +   4. Full Access to Metadata : The JDBC API provides metadata that enables the
    development of sophisticated applications.


    +   5. No need of installation : JDBC driver does not require special installation.
    Database Connection Identified by URL : JDBC API includes a way to identify and
    connect to a data source, using a DataSource object. This make code even more
    portable and easier to maintain.


