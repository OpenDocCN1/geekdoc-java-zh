    CGI is the part of the Web server that can communicate with other programs running
    on the server. With CGI, the Web server can call a program, using user-specific
    data to the program (such as what the user is connecting from, or input the user
    has supplied using HTML form syntax). The program then processes that data and
    the server passes the program response back to the Web server.


    Next diagram depicts the simple CGI model.


