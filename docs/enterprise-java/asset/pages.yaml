    # 15.5.5 Stand Alone EL


    The 3.0 release a stand-alone API for the Expression Language (EL). Utilization
    of such an API can be handy in various situations. In the forefront, a stand-alone
    API can be useful if you are interested in making use of Expression Language within
    a Java SE environment. However, it can also be useful when developing EL that
    will later utilized within JSPs views.


    The ELProcessor provides an API for EL in a stand-alone environment. This class
    provides a direct and simple interface for :


    +   - Evaluating expressions.

    - Assigning values to beans or setting a bean property.

    - Setting a ValueExpression to an EL variable.

    - Defining a static method as an EL function.

    - Defining an object instance as an EL name.


    This API is not replacement for the APIs in EL in 2.2. Containers that maintains
    EL environments can continue to do, without using this API. For EL users who want
    to manipulate EL environments, adding custom ELResolvers, ELManager can be used.
    The ELProcessor defines following methods :


    +   - defineBean(String, Object) : Defines a variable in the EL environment and
    assigns a JavaBean to that variable. This makes the bean available in the local
    repository.

    - defineFunction(String, String, Method) : Defines an EL function in the local
    function mapper.

    - defineFunction(String, String, String, String) : Defines an EL function with
    string parameters.

    - eval(String) : Evaluates an EL Expression.'
