    # 16.4.7.1 Locale Actions


    The fmt:setLocale tag is used for localization of the web application. Each HTTP
    request has

    the Header Accept-Language which usually contains the locale information sent
    by the browser as part of the request. JSTL tags usually

    verify this when formatting the data. If no header is in the HTTP request,

    we can set the default locale using the configuration variable. If locale configuration

    variable is not set, then the JVM''s locale is obtained from the container JSP


    We can override this behaviour by setting the user''s locale so that we can load
    locale

    sresource bundle to show localized messages.


    +   1. Setting the Locale : JSTL Set Locale Tag is used to set the locale configuration.

    SetLocal takes ISO Language Code and ISO Country Code as a value. By default it
    is set to en_US.


    Syntax:


    ```

    <fmt:setLocale value="string" variant="string" scope="string">/>

    ```'
