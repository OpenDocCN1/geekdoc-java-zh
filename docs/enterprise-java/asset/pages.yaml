    # Disadvantages


    +   - CGI programs are slow to execute.

    - The CGI programs are memory intensive programs.

    - CGI programs are not easy to write.

    - If proper care is not taken, CGI programs may compromise server security.

    - Resources cannot be shared across requests.

    - User session state cannot be preserved in memory.


    # Alternatives for CGI


    Several alternatives to CGI have appeared in recent years. They all build upon
    CGI''s legacy and provide their own approaches to the same goal: responding to
    queries and presenting content via HTTP. Most of them attempt to avoid the main
    drawback of CGI scripts: creating a separate process to execute the script every
    time it is requested.


    +   1. ASP : Active Server Pages, or ASP, was created by Microsoft for its web
    server, but it is now available for many servers. The ASP engine is integrated
    into the web server so it does not require an additional process. It allows programmers
    to mix code with HTML pages instead of writing separate programs.

    2. PHP : PHP is a programming language that is similar to Perl, and its interpreter
    is embedded within the web server. PHP supports embedded code within HTML pages.
    PHP is supported by the Apache web server.

    3. ColdFusion: Allaire''s ColdFusion creates more of a distinction than PHP between
    code pages and HTML pages. HTML pages can include additional tags that call ColdFusion.
    A number of standard functions are available with ColdFusion, and developers can
    create their own controls as extensions. ColdFusion was originally written for
    Windows, but for various Unix platforms now available.

    4. Java servlets : Java servlets were created by Sun. Servlets are similar to
    CGI scripts in that they create documents. However, servlets because they use
    Java, must be compiled as classes before they are run, and servlets are dynamically
    loaded as classes by the web server when they are run. JSP is another technology
    that allows developers to embed Java in web pages, much like ASP.'
