    # 9.1 How an HTTP session expires?


    By default web server will have a configuration set for expiry of session objects.
    Generally it will be X seconds of inactivity. When the user has not sent any request
    to the server for X seconds then the session will expire. When a session expires,
    the HttpSession and all the data will be removed from the system. When the user
    sends a request after the session has expired, server will treat it as a new and
    create a new session.


    Apart from automatic, it can also maintain a method invalidate() this unbinds
    the object that is bound to it. Mostly this is used at logout. Or the application
    can have an absurd logic like after the user logins we can use the application
    for 30 minutes. Then he will be forced out. In such scenario we can use getCreationTime().


    # 9.1.2 What is Session ID?


    A session ID is a unique number that a Web server assigns a specific user for
    the duration of that user''s visit (session). The session ID can be stored as
    a cookie, form field, or URL. Some Web servers generate session IDs by simply
    incrementing static numbers. However, most servers use algorithms that involve
    more complex methods, such as factoring in the date and time of the visit along
    with other variables by the server administrator.


    Every time an Internet user visits a Web site, a new session is assigned. Closing
    a browser and reopening and visiting the site again generates a new session'
