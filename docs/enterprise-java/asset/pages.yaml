    # 16.4.8 The Database / SQL Tag Library


    The database tag library consists of actions that allow us to perform database
    queries, access query results, perform CRUD (Create, Retrieve, Update and Delete)
    operations, create a simple DataSource for prototyping and nested database action
    elements with a shared Connection, set up to execute all statements as one transaction.


    The JSTL SQL tag library provides tags for interacting with relational databases
    (RDBMS) such as Oracle, MySQL, or Microsoft SQL Server.


    # 16.4.8.1 Datasources


    <lt:setDataSource> creates a datasource to connect to a database. A datasource
    creates ways to communicate with the database server. We use datasource to query,
    insert, update or delete information from the databases. We need to define database
    logic in the JSP used for presentation.


    Syntax:


    ```

    <lt:setDataSource var="string" scope="string" dataSource="string" driver="string"
    url="string" user="string" password="string"/&gt;

    ```


    Attributes:


    | Name | Required | Description |

    | --- | --- | --- |

    | var | False | java.String Name of the datasource configuration variable. |

    | scope | False | java.String Scope of the datasource configuration variable.
    |

    | dataSource | False | java.String relative path in the JNDI tree. |

    | driver | False | java.String JDBC Driver class name. |

    | url | False | java.String JDBC connection url of the database to connect. |

    | user | False | java.String Database name to connect. |

    | password | False | java.String Database password to connect. |


    Example:

    &lt;h1&gt;Demo&amp;&lt;/h1&gt;


    ```

    <lt:setDataSource var="myDS" driver="com.mysql.jdbc"

    url="jdbc:mysql://localhost:3306/test"

    user="root" password=""/&gt;

    &lt:out value="${myDS}"/&gt;

    ```


