  md: '+   * Extends: Specifies a superclass that the generated servlet must extend.


    +   * Import: Specifies a list of packages or classes for use in the JSP as the
    Java import statement for Java classes.


    +   * Info: Defines a string that can be accessed with the servlet''s getInfoPlist()
    method.


    +   * isThreadSafe: Defines the threading model for the generated servlet.


    +   * Language: Defines the programming language used in the JSP.


    +   * session: Specifies whether or not the JSP page participates in HTTP sessions


    +   * isIgnored: Specifies whether or not the EL expression in the JSP page will
    be ignored.


    +   * isScriptingEnabled: Determines if scripting elements are allowed for use.


    +   * The default buffer size is defined to be at least 8 KB.


    +   * The error attribute contains the relative URL for the error page to which
    this page should go if there''s an unhandled error on this page.


    +   * Error page file must declare isError="true" to have access to the Exception
    object.


    +   * The ContentType attribute defines the MIME type and the character set for
    the response. The value is "text/html" for standard JSP pages and "text/xml" when
    implementing JSP documents in Extended Markup Language (XML) format.


    +   * The pageEncoding attribute defines the character encoding for the JSP page.
    The default is specified in the ContentType attribute as "ISO-8859-1" if none
    was specified.


    # 13.3.1.2 The include Directive


    The include directive allows us to include code from another file, which is useful
    for the purpose of reusability. For every page to appear at the top of every page
    to allow a user to return to the home page.


    Syntax: <%@include file="menu.jsp"%>


    The file attribute of directive is actually a relative URL.


    # 13.3.1.3 The taglib Directive


    The JSP taglib directive is used to define tag library, which is the collection
    of tags and also defines the prefix for the tags. To use custom tags in our JSP,
    we have to use it syntax to import the tags which contain the definition of these
    tags.


    Syntax: <%@taglib uri="URLToTaglib.library" prefix="prefix"


    The uri locates the TLD file of a custom tag, the prefix is a compulsory & prefix
    defines a prefix to use for distinguishing a custom tag. Ex.


    ```

    <%@taglib uri="http://java.sun.com/jsp/jstl/core prefix="c"

    ```


    ```

    <p>Simple Example for Cout</p>

    ```


    ```

    Multiply 2 and 2:<c value="$2*2" />

    ```


    # 13.3.2 Scripting Elements


    The JSP uses three types of scripting elements as expression, Scriptlet and declaration.


    +   I. Expressions : A JSP expression is used to insert Java values directly into
    the output. The expressions have a syntax: <% expression %> they are evaluated
    and inserted into the output. Syntax: <% new java.util.Date() %>


    Example: <% new java.util.Date() %>'
