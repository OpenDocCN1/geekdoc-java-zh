    NON-BLOCKING I/O


    ### 11.1 Introduction

    Non-blocking I/O was introduced in Servlet 3.1-to develop scalable applications.
    Servlet 3.0 allowed asynchronous request processing, but the API allowed only
    traditional I/O, which can restrict scalability of your applications. In a typical
    application, ServletInputStream is read in a loop. However, if the incoming data
    is blocked or is streamed, the server thread must wait for the data. The same
    situation can happen if the data is written to ServletOutputStream.


    Servlet 3.1 resolves this by adding event listeners : Listener and WriteListener
    interfaces. You register these event listeners by using ServletInputStream.setListener
    and ServletOutputStream.addListener.

    The listeners have callback methods that are invoked when the content is available
    to be read or can be written without blocking.


    The main idea of these technologies is to avoid blocking. That''s important because
    blocked threads waste resources, threads’ memory and processor time during context
    switching. In some cases''s possible to increase servlet performance without any
    costs.


    Blocking also makes your server pool vulnerable to starvation. Consider a server
    with 200 threads in which 200 requests for large content are received from slow
    clients, then the entire server pool may be consumed by threads blocking to write
    to those clients. Asynchronous IO allows the threads to be reused to handle requests
    while slow clients are handled with minimal resources.


    # 11.2 How it works?


    The basic flow for a servlet that calls an external REST service using an async
    HTTP client (for example AsyncHttpClient) looks like this :


    +   1. First of all servlet where we want to provide async support should have
    @WebServlet with asyncSupported value as true.

    2. Since the actual work is to delegate to the another thread, we should have
    a thread pool implementation. We can create thread pool using Executors framework
    and use context listener to initiate the thread pool.

    3. We need to get instance of AsyncContext through ServletRequest.startAsync()
    method. AsyncContext provides methods to get the ServletRequest and'
