  md: '# CHAPTER 12


    # UNIT - III


    # JAVASERVER PAGES


    # 12.1 Introduction to Javaserver Pages


    Javaserver Pages (JSP) is a technology used to develop interactive web pages.
    JSP was developed by Sun Microsystems and is an improved version of Java servlets.
    JSP may be developed in a simplified manner and has a wide range of applications.
    As with most server-based technologies, JSP separates logic from the presentation
    layer.


    JSPs are normal HTML pages with embedded Java code. To process a JSP file, developers
    need a JSP engine, which is connected to a Web server. The JSP page is compiled
    into a servlet, which is handled by the servlet engine. This phase is known as
    translation. The servlet then loads the servlet class and executes it to create
    dynamic HTML, which is then sent to the browser. When the next page is requested,
    the JSP page is precompiled into the servlet and executed, unless the JSP page
    is changed. When used with Java Database Connectivity (JDBC), JSP provides a dynamic
    way to create database-driven websites.


    # 12.2 Why use Javaserver Pages?


    # 12.2.1 Advantages of JSP over servlet


    +   - Extension to Servlet : JSP technology is the extension to servlet technology.
    We can use all the features of servlet in JSP. In addition to, we can use implicit
    objects, predefined tags, expression language and Custom tags in JSP that makes
    development easy.

    - Easy to maintain : JSP can be easily managed because we can easily separate
    our business logic with presentation logic. In servlet technology, we can mix
    our business logic with the presentation logic.

    - Fast Development : No need to recompile and redeploy. If JSP page is modified,
    we don''t need to recompile and redeploy the project. The servlet class needs
    to be updated and recompiled if we have to change the look and feel of the application.

    - Less code than servlet : In JSP, we can use a type of tags such as action tags,
    JSTL, custom tags etc. reduces the code. Also, we can use EL, implicit objects
    etc.

    - The JSP serves all facilities of Java i.e. once run anywhere.

    - The JSP uses simplified scripting language based syntax for embedding HTML into
    JSP.'
