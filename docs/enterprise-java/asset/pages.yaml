    # 6.1.5 Scrollable Resultsets


    The resultsets are limited in facility. The rows in the result could be accessed
    only in the forward direction. We can''t move back and forth in a resultset or
    jumping to a particular row identified by a row number. Also, the resultsets were
    read-only in that there was no way for inserting new rows into the resultset,
    updating a particular row, or deleting a particular row.


    Scrollability refers to moving forwards or backwards through rows in a resultset.
    Positioning refers to moving the current row position to a different position
    by jumping to a specific row. These two features are provided by means of three
    additional methods, one for createStatement(), prepareStatement(), and prepareCall()
    methods. These methods take two parameters namely, the resultSetType and resultSetConcurrency.
    The definition of these new methods is as follows:


    ```

    tconn.createStatement(int resultSetType, int resultSetConcurrency);

    tconn.prepareStatement(String sql, int resultSetType, int resultSetConcurrency);

    tconn.prepareCall(String sql, int resultSetType, int resultSetConcurrency);

    ```


    The parameter resultSetType tells whether a resultset is scrollable or not. It
    can take one of the following three values only:


    +   * TYPE_FORWARD : it specifies that a resultset is not scrollable, rows within
    it can be advanced only in the forward direction.

    * TYPE_SCROLL_INSENSITIVE : it specifies that a resultset is scrollable in either
    direction but is insensitive to changes committed by other transactions or statements
    in the same transaction

    * TYPE_SCROLL_SENSITIVE : it specifies that a resultset is scrollable in either
    direction and is affected by changes committed by other transactions or statements
    within the same transaction.


    The second parameter resultSetConcurrency determines whether a resultset is updateable
    or not can take one of the two values :


    ```

    ResultSet.CONCURRENCY_READ_ONLY

    ResultSet.CONCURRENCY_UPDATABLE

    ```


