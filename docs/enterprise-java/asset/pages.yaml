    +   - All beans must have one business interface (local, remote, web-services,
    etc.)

    - The session class must be concrete, if it cannot be final or abstract.

    - You must have a no-argument constructor in the bean class this is because the
    container uses it to construct the bean instance.

    - A session bean can sub-class another session bean or any other POJO

    - The business methods and lifecycle callback methods may be defined in the bean
    class or in superclass.

    - Business method names must not start with "ejb" and must be defined as public
    not final or static.

    - Exposing a method in a remote business interface may the return and arguments
    types implement the Serializable interface.


    # 18.1.1 When to use Session Beans?


    Stateful Session Beans should be used in the following cases :


    +   - When state bean specifies the interaction of a specific client and the bean.

    - When client information is required to keep the bean across method invocations.

    - When the bean plays a role of mediator between the client and the components
    of an application which provides a simplified view to the client.

    - Where the work flow of various enterprise beans are required to manage the bean
    in background.


    Stateless Session Beans should be used in the following cases :


    +   - When state of bean has no data for a particular client.

    - When in single invocation bean is required to do a generic work for all clients.

    - When a web service is required to implement a bean.

    - Singleton Session Beans should be used in the following cases :

    - When a state of bean is required to share across the application.

    - When only one bean is required to use concurrently by multiple threads.

    - The specification of an application is that a bean does upon startup and shutdown
    of an application.

    - When a web service is implemented by a bean.


    18.2 Types of Session Beans


    There are three types of Session beans :


    # 18.2.1 Stateless Session Beans


    Stateless session beans are business objects that hold conversations that span
    a single client-invoked method. They do not maintain any conversational state
    associated with any client. The client is responsible for maintaining the conversational
    state, if any. The container could reuse the same instance to serve multiple clients.
    This makes perfect sense because the bean instance doesn''t maintain any client
    specific state.


    An example of stateless session bean is a stock quote component that returns the
    current price of a given stock symbol. Such a bean could look up the stock price
    from a database that is updated by a real-time feed.'
