    # 8.2 Kinds of Cookies


    There are three types of Cookies:


    # 8.2.1 Session / Persistent Cookies


    These are also known as a "temporary cookie", this type of cookie attaches itself

    user''s computer when they enter and browse the website. These are mainly used
    by online

    shops and also to keep items in your basket when shopping. These cookies

    expire when the browser is closed. A session cookie does not collect information
    from

    user''s computer or activity when it sits on the system.


    Disabling session cookies in your browser can be difficult because they belong
    to the

    website the user is visiting and subsequently all administrative rights with with

    administrators of the website.


    # 8.2.2 Persistent Cookies


    Unlike session cookies, a persistent cookie does not disappear after a user exits
    a site.

    These types of cookies have a specific expiration date when the cookie continuing

    transmit information to website''s server every time user visits the site until
    the expiry

    date comes up.


    For reason, persistent cookies are also known as "tracking cookies" as markers

    use the information obtained from the cookies to study user behaviour over a certain

    period of time.


    Persistent cookies are also used to keep users logged into certain website, this

    elminating the need for them to enter their credentials each time they want to

    access the site.


    > **From a security perspective, it''s important to note that users should not
    enable the

    "keep logged in" function on websites. This is not a safe practice and can be

    dangerous if any unwanted third-party to gain access to your device.


    Some websites use to disable their cookies, this causes problems in the

    functionality of the website or browser as information needed to run the sites
    as user

    IDs and recently saved searches will not be available if the user has disabled
    the

    retrieve that information. In lieu of disabling cookies altogether, a safer option
    might

    to clear your cache of cookies ever and with a free to space on your device

    and rid of any unwanted cookies.


    # 8.2.3 Third Party Cookies


    Normally, a cookie''s domain attribute will match the domain that is shown in
    the

    web''s address bar. This was a first-party cookie. A third-party cookie,

    hover, to a domain different from the one shown in the address bar. This

    of cookie typically appears when we page content from external websites, with

    banner advertisements. This opens up the potential for tracking the user''s browsing

    history and is often used by advertisers in order to serve relevant advertisements
    to

    euser.


    As an example, a user visits www.example.com. This website contains an

    belong to the advertiser''s domain (ad.foxtracking.com). Then, the user visits
    another

    website, www.foo.com, which also contains an advertisement from ad.foxtracking.com

    and sets a cookie belonging to domain (ad.foxtracking.com). Eventually, both of
    these

    cookies will be sent to the advertiser when loading their advertisements and visiting
    their

    user. The advertiser can use these cookies to build up a browsing history of the

    user across all the websites that has ads from this advertiser.'
