  md: '# 2. Using the Set Attribute


    The <set> tag is used to save the result of XPath expression into a scoped variable.
    The type of the XPath expression depends on the result of the XPath expression.
    If the result of the XPath expression is boolean, the result will be saved as
    a java.lang.Boolean, for result of string it will be saved as a java.lang.String.
    and


    The following code snippets show the syntax of the <set> tag where the square
    brackets indicate optional attributes and the curly braces indicate a choice of
    options within them.


    ```

    Syntax:\Evaluate XPath expression and save test condition to var

    `<set select="varName" scope="[page | request | session | application]"]/`

    ```


    | Name | Required | Type | Description |

    |---|---|---|--|

    | var | True | java.lang.String | Name of the variable to save the result of XPath
    expression. The type of this variable depends on the type of the result after
    the XPath expression is evaluated. |

    | select | False | java.lang.String | XPath expression to be evaluated. |

    | scope | False | java.lang.String | Scope of the var to store into. |


    The <out> tag displays the result of an XPath expression. This tag is the JSTL
    XML counterpart of the JSP expression <% <%= %>.


    ```

    Syntax:<out select="string" escapeXml="true|false"/>

    ```


    | Name | Required | Type | Description |

    |---|---|---|--|

    | select | True | java.lang.String | XPath expression to evaluate and display
    the result. |

    | escapeXml | False | java.lang.String | Defaults to true. If resulting content
    has any XML or HTML or any other markup language tags, the content will be shown
    with raw XML or HTML or markup language (we can see the tags as well). If set
    to false, the XML or HTML will be evaluated and shown. |'
