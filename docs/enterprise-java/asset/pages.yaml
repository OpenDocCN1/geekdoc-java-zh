    # 19.1 Introduction to Interceptor


    Basically, an interceptor is a class whose methods are invoked when business methods
    on a target class as methods that create/destroy the bean occur, or an EJB timeout
    method occurs.


    Interceptors are used to operate on business method invocations and lifecycle
    events that occur on an enterprise bean instance. Interceptors are used to implement
    crosscutting concerns, such as logging, auditing, and for the business logic.
    It is used when you want to intercept calls to EJB methods. If you declare an
    interceptor for a Bean, every time a method of that Bean is invoked, it will be
    intercepted with one of the interceptor. That means that the execution goes straight
    to the Interceptor''s method. The intercepting method can then decide whether
    to call the EJB method or simply replace it.


    The Interceptor can also be defined as an object that is invoked at the preprocessing
    and postprocessing of a request, which can be used to perform operations such
    as validation, exception handling, internationalization, displaying intermediate
    result etc.


    # 19.2 Request and Interceptor


    Every request that is received passes through each Interceptor.


    The Interceptor can:


    +   * Ignore the request data

    * Act on request data

    * Break the request to prevent the EJB class method from firing


    Since Interceptors deal with EJB, they have access to the EJB class being executed
    as well as all environmental variables and execution properties.


