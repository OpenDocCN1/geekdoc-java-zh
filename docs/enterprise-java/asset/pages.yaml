    # 22.6 How Hibernate Works?


    The Object-relational mapping is the main concept in Hibernate. Each class is
    mapped to table; each instance is mapped to a row in the relevant table; Fields
    are columns, and references are foreign-key columns. Each instance that is stored
    with an identifier - usually a simple auto-increment int - lets you refer to it
    in an unambiguous way.


    Relations between objects that are more complex than a "reference" are basically
    implemented in the way using a pure relational model: a table for the relation,
    with various requirements where appropriate.


    The key to whole is the mapping: Which field and which class matches which column
    and table. While simple types can be deduced from either the model or the DB schema,
    relationships between objects must be done explicit. ORMs will usually either
    generate classes from a DB schema, or the other way around, saving you the trouble
    of securing everything twice.


    The ORM framework adds a load and save methods - depending on the specific case,
    could be added to the actual objects, or be a static on some central location,
    or even called implicitly, that''s probably not going to end well.


    To retrieve an, you''d call the load method with some specification - could be
    the id of an object, a search query, or "everything", which will be translated
    into SQL, and will be de-serialized into the appropriate objects.


    The search query always looks like a SQL WHERE clause, and will be passed verbatim
    to the engine. JOINS will be added to the query as needed, based on the mapping
    schema.


    Since ORMs are most useful when there''s just too much data to store in the computer
    memory, objects might hold references to objects that are not available; when
    trying to follow them, you might be required to explicitly load them, or they
    might be loaded eagerly. With non-relational DBs getting popular days, it''s worth
    mentioning that ORM are only relevant to mapping Object-Oriented data to Relational
    model DBs.


    The objects to be persisted are defined in a mapping document, which serves to
    describe the fields and associations, as well as any subclasses or proxies of
    the persistent object. The mapping documents are compiled at start-up time and
    provide the framework with necessary information for a class. Additionally, they
    are used in support operations, such as generating the database schema or creating
    java source files. A SessionFactory is created from the compiled collection of
    mapping documents. The SessionFactory provides the mechanism for managing persistent
    classes, the Session interface. The Session class provides the interface between
    the persistent data store and the application. The Session interface wraps a JDBC
    connection, which can be'
