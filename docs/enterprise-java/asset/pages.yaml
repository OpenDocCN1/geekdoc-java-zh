    Java Transaction API (JTA) specifies standard Java interfaces between a transaction
    manager and the parties involved in a distributed transaction system: the resource
    manager, the application server, and the transactional applications. The JTA specification
    was developed by Sun Microsystems in cooperation with leading industry partners
    in the transaction processing and database system era.


    # J2EE Connector Architecture


    The J2EE Connector architecture provides a Java technology solution to the problem
    of connectivity between the many application servers and today''s enterprise information
    systems (EIS).


    # 1.3.3 Web Services Technologies


    # 1. SOAP and RESTful


    +   * SOAP (Simple Object Access Protocol) is a standards-based Web services access
    protocol that has been around for a while and enjoys all of the benefits of longterm
    use. SOAP is a protocol which was designed before REST and came into the picture.
    The main idea behind designing SOAP was to ensure that programs built on different
    platforms and programming languages could exchange data in an easier manner.

    * REST (Representational State Transfer) was designed specifically for working
    with components such as media components, files, or events on a particular hardware
    device. Any web service that is defined on the principles of REST can be a Restful
    service. A Restful service will use the normal HTTP verbs of GET, POST, PUT and
    DELETE for working with the required components.


    # 2. Java API for XML Processing


    The Java API for XML Processing (JAXP), of the Java SE platform, supports the
    processing of XML documents using the Object Document Model (DOM), the Simple
    API for XML (SAX), and Extensible Stylesheet Language Transformations (XSLT).
    JAXP enables applications to parse and transform XML documents independent of
    a particular XML-processing implementation.


    JAXP also provides namespace support, which works well with schemas that might
    have owing conflicts. To be flexible, JAXP lets you use any XML-compliant parser
    or XSL processor within your application and supports the W3C schema.


    # 3. Java API for XML Registries (JAXR)


    JAXR provides rich metadata capabilities for classification and association, as
    well as rich query capabilities. As an abstraction-based API, JAXR gives developers
    the ability to write registry client programs that are portable across different
    target registries. This is consistent with the Java philosophy of "Write Once,
    Run Anywhere." Similarly, JAXR also enables value-added capabilities beyond those
    of the underlying registries.'
