    # 12.4 Life Cycle of A JSP Page


    The page cant outputs the content to the browser it relies on early server side
    processing process which translates JSP page into the JSP class. The page class
    then handle all the requests of JSP.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_98_0.png)


    JSP''s life cycle are grouped into following phases :


    +   1. **JSP Page Translation**: A Java Servlet file is generated from the JSP
    source file. This is the first step in its double phase life cycle. In the translation
    phase, the container validates the syntax of the JSP page and tag files for correctness.
    The container interprets the direct directives and actions, and the custom actions
    referencing tag libraries used in the.


    +   2. **JSP Page Compilation**: After the page translation the generated Servlet
    file is compiled into a Java class. The translation of a JSP page into its implementation
    class can happen at any time during initial deployment of the JSP page into the
    container and the receipt and processing of a client request for the target JSP.


    +   3. **Class Loading**: The Java Class that was compiled from the JSP source
    is loaded into the container.


    +   4. **Execution phase**: in this phase the container adjust one or more instances
    of this class in response to requests and other events. Interface JSPPage contains
    jspInit() and jspDestroy() method. The JSP specification has provided a special
    interface for JSP pages serving HTTP requests and this interface contains jspService()
    method.


    +   5. **Initialization**: jspInit() method is called instantly after the instance
    was created. It is called only once during JSP life cycle.'
