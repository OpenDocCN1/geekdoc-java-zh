    # 5.1 What Is A Web Application?


    A web application or "web app" is a software program that runs on a web server.
    Unlike traditional desktop applications, which are launched by your operating
    system, web apps must be accessed through a web browser.


    Web apps have several advantages over desktop applications. Since they run inside
    web browsers, developers do not need to develop web apps for multiple platforms.
    For example a single application that runs in Chrome will work on both Windows
    and OS X. Developers do not need to distribute software updates to users when
    the web app is updated. By updating the application on the server, all users have
    access to the updated version.


    # 5.2 Organization of a Web Application (Directory Structure)


    To deploy and execute Servlet, the Servlet API specifies a fixed WAR file structure.
    The entire servers must follow this standard directory structure shown below.


    | Assembly Root |

    | --- |

    | |

    | WEB-INF | Web Resources |

    | web.xml (Deployment Descriptor File) | Classes | Html, JSP, CSS, JS, Images
    etc. |

    | Annotation |

    | All server side classes |


    **Web Resources** : The Web files, Components and Design files are called as Web
    resources. This is the top most directory of Servlet directory structure. In this
    directory we can place HTML, JSP, CSS, JS files etc that are part of our current
    application.


    **WEB-INF** : The Server root contains the directory named Web-INF. In this directory
    following File and Directory are included :


    +   - **web.xml** : This is a Web Application deployment descriptor file.'
