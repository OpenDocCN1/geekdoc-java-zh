    # 20.1 Introduction


    In computing, data is information that has been translated into a form that is
    efficient for movement or processing. Relative to today''s computers and transmission
    media, data is converted into binary digital format. It is acceptable for data
    to be used as a singular object or plural subject. Raw data is a term used to
    describe data in its most basic digital format.


    Data is an important asset to any computer application. All applications require
    that person or another computer access their data. This data is used in different
    ways. Data can be Read-only, Read for update over multiple requests, modified
    through batch updates and used in bulk data retrieval.


    The attention span of computer is only as long as its cord is connected to power
    supply. The precious data is within the limitations of electronic memory. If the
    application does not preserve data when it was powered off, the application is
    of little or no practical use. Hence it is required to make the important data
    longer than the application, this we require persistence.


    # 20.2 What is Persistence?


    Persistence refers to object and process characteristics that continue to exist
    even after the process that created it or the machine it is running on powered
    off. When an object or state is created and to be persistent, it is saved in a
    non-volatile storage location, like a hard drive, versus temporary file or volatile
    random access memory.


    In terms of data, persistence means an object should not be erased unless it is
    really meant to be deleted. This entails proper storage and certain measures that
    allow the data to persist. In terms of computer threads and processes, a persistent
    process is one that cannot be killed or shut down. This is usually true for core
    system processes that are essential to a properly functioning system.


    In the context of storing data in a computer system, this means that the data
    survives after the process with which it was created has ended. In other words,
    for a data store to be considered persistent, it must write to non-volatile storage.


    If you need persistence in your data store, then you need to also understand the
    four main design approaches that a data store can take and how (or if) these designs
    provide persistence :'
