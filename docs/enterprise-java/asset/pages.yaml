  md: '# 18.5.3 Singleton Session Bean


    Like a stateless bean, a session bean is never passivated and has only two stages,
    nonexistent and ready for the invocation of business methods.


    +   1. Dependency Injection, if any

    2. PostConstruct callback, if any


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_175_0.png)


    The EJB container initiates the singleton bean lifecycle by creating the singleton
    instance. This occurs upon application deployment of the singleton is annotated
    with the @Startup annotation. The container performs dependency injection and
    then invokes the method annotated @PostConstruct, if it exists. The singleton
    bean is now ready to have its methods invoked by the client.


    At the end of the lifecycle, the EJB container calls the method annotated @PreDestroy,
    if it exists. The singleton bean is now ready for garbage collection.


    # 18.6 Packaging Enterprise Beans


    # 18.6.1 In EJB JAR Modules


    An EJB JAR is portable and can be used for various applications. To assemble a
    Java EE application, package one or more modules, such as EJB JAR files, into
    an EAR file, the archive file that holds the application. When deploying the EAR
    file that contains the enterprise bean''s EJB JAR file, you also deploy the enterprise
    bean to the GlassFish Server. You can deploy an EJB JAR that is not contained
    in an EAR file. Following figure shows the contents of an EJB JAR file.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_175_1.png)


    # 18.6.2 In WAR Modules


    Enterprise beans often provide the business logic of a web application. In these
    cases, packaging the enterprise bean within the application''s WAR module simplifies
    deployment and application organization. Enterprise beans may be packaged within
    a WAR module programming language class files or within a WAR file that is bundled
    within the WAR module.


    To include enterprise bean class files in a WAR module, the class files should
    be in the WEB-INF/classes directory.'
