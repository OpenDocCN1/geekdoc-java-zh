  md: '# 21.3.5 Query


    The java.persistence.Query interface is implemented by each JPA vendor to find
    persistent objects that meet certain criteria. JPA standardizes for queries using
    both the Java Persistence Query Language (JPQL) and the Structured Query Language
    (SQL). You obtain Query instances from an EntityManager.


    # 21.3.6 Criteria


    The Criteria API is used to define queries for entities and their persistent state
    by creating-defining queries. Criteria queries are written using Java programming
    APIs, are type-safe, and are portable. Such queries work regardless of the underlying
    data store.


    A predefined API is used to define queries for entities. It is the alternative
    to defining a JPQL query. These queries are type-safe, and portable and easy to
    modify by changing the syntax. Similar to JPQL it follows abstract schema and
    embedded objects. The metadata API is mixed with criteria API to model persistent
    entity for criteria queries.


    The major advantage of the criteria API is that errors can be detected earlier
    during compile time. String based JPQL queries and JPA criteria based queries
    are same in performance and efficiency.


    Queries in JPA (as in SQL) are composed of clauses. Because JPQL queries and criteria
    queries use equivalent clauses. Some of the criteria that supports as follows:


    +   - SELECT clause (select, distinct, multiselect, array, tuple, construct).


    +   - FROM clause (from, join, fetch).


    +   - WHERE clause (where).


    +   - GROUP BY/HAVING clauses (groupBy, having, count, sum, avg, min, max ...).


    +   - ORDER BY clause (orderBy, Order, asc, desc).


    # 21.4 How JPA Works?


    An XML is created or annotations to POJOs, which informs the JPA provider about:


    +   - The classes are needed to store the data.


    +   - HOW the classes are related to the tables and columns in the database.


    This all way the JPA provider reads the XML and / or annotations and dynamically
    builds java classes to manage the translation between the database and the Java
    objects.


    An EntityManager is created from the compiled collection of mapping metadata.
    EntityManagerFactory provides the mechanism for managing persistent classes and
    EntityManager.


    EntityManager provides the interface between the persistent data and the application.
    EntityManager/Manager wraps a JDBC connection, which can be managed or controlled
    by the JPA provider and is intended to be used by a single application thread,
    then closed and discarded.


    All the database interaction is done via a simple, intuitive API that JPA provides.
    This API allows performing queries against the objects represented by the database.
    This API informs the JPA provider:


    +   - To save the changes whenever the objects are created.


    +   - To store the objects in the database whenever new objects are created.'
