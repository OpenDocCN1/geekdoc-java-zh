    # 16.4.3 Transforming XML


    The transform tag applies a transformation, specified by an XSLT stylesheet set
    by the attribute transform, to an XML document, specified by the attribute name.
    If the attribute is not specified, the input XML document is read from the tag''s
    body content.


    The param subtag can be used along transform to set transformation parameters.
    The attributes name and value are used to specify the parameter. The value attribute
    is optional. If it is not specified the value is retrieved from the tag''s body.


    The <x:transform> action applies an XSLT stylesheet transformation to an XML document.'
