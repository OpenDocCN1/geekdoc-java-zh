    to any type of request, they are commonly used to extend the applications hosted
    by web servers. For such applications, Java Servlet defines HTTP-specific Servlet
    classes.


    The **javax.servlet and javax.servlet.http** packages provide interfaces and classes
    for writing servlets. All servlets implement the Servlet interface, which define
    lifecycle methods. When implementing a generic service, we can use or extend the
