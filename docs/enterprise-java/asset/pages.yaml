    #  18.1 Introduction


    Java Enterprise Edition (Java EE) has a powerful facility dedicated to expressing
    the business logic of an application and for accessing a database using a Java
    concept. That facility is Enterprise JavaBeans, known as EJBs for short.


    Session Bean is an Enterprise Bean that is generated for each session from the
    client and expires when the client exits. The lifecycle of a Session Bean does
    not exceed the range from the beginning until the end of the usage of the system
    by the user. Session Beans are classified into Stateless Session Beans, Stateful
    Session Beans, and Singleton Session Beans.


    Session beans capture the logic such as creating users, add items for an auction,
    bidding for an item, it can be short-lived or span a long time. Session beans
    are the only EJB component that are invoked directly by the client, the client
    could be a web application component (servlet, JSP, JSF, etc.), a command line
    application or a Swing GUI application.


    The following facilities session beans offer :


    +   - The container will manage concurrency and thread safety automatically by
    using pooling, session management and passivation.

    - Session beans support Method Invocation (RMI) and Simple Object Access Protocol
    (SOAP) remote access which enables distributed computing and interoperability.

    - Session beans offer fully transaction management and authorization and authentication
    security.

    - Interceptors are EJB''s version of lightweight Aspect-Oriented Programming (AOP),
    which has the ability to isolate ''crosscutting'' concerns into their own modules
    and apply them across the application through configuration, that things like
    logging, auditing are repeated across an application but are not part of business
    logic.


    Each session bean implementation has two distinct parts :


    +   - One or more bean interfaces

    - Implementation class'
