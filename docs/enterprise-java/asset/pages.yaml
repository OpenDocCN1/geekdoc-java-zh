  md: '# 21.3.1 Persistence


    The javax.persistence.Persistence class contains static helper methods to obtain
    EntityManager instances in a vendor-neutral fashion. An entity is a Java class
    that represents a row in a database table. Entities can be concrete or abstract
    classes. They maintain their state using properties or fields. It consists of
    the declarative metadata that describes the relationship of entity objects to
    a relational database. The EntityManager uses this data to create a persistence
    context that can be accessed through the EntityManager.


    # 21.3.2 EntityManagerFactory


    The EntityManagerFactory interface is used by the application to obtain an application-managed
    entity factory. When the application has finished using the entity manager factory,
    and/or at application shutdown, the entity manager factory should be closed. Once
    an EntityManagerFactory has been closed, all its entity managers are considered
    to be in the closed state.


    +   * Responsible for creating EntityManager instances.

    * Initialized with the help of persistence context.


    An entity manager factory provides EntityManager instances, all instances are
    configured to the same database, or use the default settings as defined by the
    particular implementation; you can prepare several entity manager factories to
    access several data stores. This interface is similar to the SessionFactory in
    native Hibernate.


    # 21.3.3 EntityManager


    The javax.persistence.EntityManager is the primary interface used by applications.
    Each EntityManager manages a set of persistent objects, and has APIs to insert
    new objects and delete existing ones. When outside the container, there is a one-to-one
    relationship between an EntityManager and an EntityTransaction. The EntityManagers
    also act as factories for Query instances.


    It is the resource that maintains the active collection of entity objects that
    are being used by the application. The EntityManager handles the database interaction
    and metadata for object-relational mappings. An EntityManager represents a Persistence
    Context. An application in a container can obtain the EntityManager through injection
    into the application or by looking it up in the JPA component-space. The application
    manages its persistence, the EntityManager is obtained from the EntityManagerFactory.


    # 21.3.4 Entity


    Entities are persistent objects that represent data records. Entity is the persistence
    (POJO) objects that represent one record in the table. The Entity is simple annotated
    POJO class, which is easy to develop. Here are the characteristics of an Entity
    :


    +   * Entity can be persisted to the relational database.

    * Entity is identified by persistence identity (the primary key of the table).

    * Entity supports transactions.

    * Entity supports inheritance.


    # 21.3.5 EntityTransaction


    Each EntityManager has a one-to-one relation with a single javax.persistence.EntityTransaction.
    The EntityTransactions allow operations on persistent data to be grouped into
    units of work that either completely succeed or completely fail, leaving the data
    store in its original state. These all-or-nothing operations are important for
    maintaining data integrity.'
