    # 16.4.1 The Core Tag Library


    The Core tag library is the collection of the JSTL core tags in the JSP pages.
    These tags are used for manipulating data in JSP pages. Core provides support
    for iteration, conditional processing, and expression language for the tags in
    JSP pages. The core tag library can be used in JSP page using the following tag
    library:


    ```

    <@tag uri="http://java.sun.com/jsp/jstl/core" prefix="c %>

    ```


    Here,


    +   - prefix is used to define all the core tags

    - uri is the library of taglib when it is imported


