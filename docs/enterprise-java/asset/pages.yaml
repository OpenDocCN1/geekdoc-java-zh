  md: '# Introduction to Enterprise JavaBeans


    # EJB Evolution


    By 1996, Java had already become popular among developer for its friendly APIs
    and automated Garbage Collection and was starting to be used in back-end-systems.
    One problem, however, that most of these systems needed the same set of standard
    capabilities – as persistence, transaction integrity, and concurrency control
    – which the JDK lacked at that time. That, naturally, led to many-grown, closed
    implementations.


    IBM stepped forward and released the Enterprise Java Bean (EJB) specification
    in 1997, with the promise that developers could write code in a standard way,
    with many of the common concerns automatically handled.


    That’s how the first framework for the enterprise was born; the specification
    was later adopted by Sun in 1999 as EJB 1.0.


    Fast forward twenty years and EJB 3.2 is now the subset of the JavaEE specification.


    # 17.24 Enterprise Bean Containers


    An EJB container is basically a software implementing the EJB specifications.
    Enterprise JavaBeans standards standardise many of these technologies and allow
    applications developed for EJB to be deployed in multiple application servers.
    Application servers conform to the EJB standards, without requiring the development
    of specific application server. EJB has been initially focused on building applications
    needing support for a large number of users, high availability, performance and
    so on. By using and extending standard technologies, such as JDBC, JNDI, RMI,
    and CORBA, the EJB standard provides a uniform way of building applications with
    these capabilities without requiring the developer to implement them.


    The number of application servers supporting EJB is growing. Applications written
    to run in any of these application servers. Most of the differences that exist
    between application servers supporting a specified version of the EJB specification
    are not API or of application related.


    EJB supports a high degree of control over applications and components at run
    time, or after the application development is complete.


    There are two kinds of EJBs, namely session EJBs and entity EJBs. Session EJBs
    represent a client in a multierter system, and perform actions directly in support
    of client applications. Entity EJBs represent data data that is persistent in
    the database and is not specific to a client.


    # EJB Restrictions


    To support the capabilities of the application server, including database persistence,
    transactions, and clustering, it is necessary to restrict the capabilities of
    EJB components. This is to allow the EJB server to manage and provide the high-end
    capabilities expected of the application server. The restrictions limit the EJB
    from doing any of the following


    +   - Managing or synchronizing threads.

    - Accessing files and directories in the java.io package.

    - Using AWT functionality to display information or to accept information from
    a keyboard.

    - Listening on a socket, accepting connections on a socket, or using a socket
    for multicast.

    - Setting a socket factory used by ServerSocket, Socket, or the stream handler
    factory used by the URL class.

    - Loading a native library.'
