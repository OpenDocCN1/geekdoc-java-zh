    Like stateless session beans, singleton session beans can implement web endpoints.


    Singleton beans maintain their state between client invocations but are not required
    to maintain their state across server crashes or shutdowns.


    Applications that use a singleton session bean may specify that the singleton
    should be instantiated upon application start-up, which allows the singleton to
    perform'
