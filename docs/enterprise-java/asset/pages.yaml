- img_proc: true
  md: 'The output is further passed on to the web server by the servlet engine inside
    an HTTP response.


    +   - The web server forwards the HTTP response to your browser in terms of static
    HTML content.


    +   - Finally, the web browser handles the dynamically-generated HTML page inside
    the HTTP response exactly as if it were a static page.


    Typically, the JSP engine checks to see whether a servlet for the JSP file already
    exists and whether the modification date on the JSP is older than the servlet.
    If the JSP is older than its generated servlet, the JSP container assumes that
    the JSP hasn''t changed and that the generated servlet matches the JSP''s content.
    This process makes much more efficient than with other scripting languages (such
    as PHP) and therefore faster.


    So in a way, a JSP is just another way to write a servlet without having to be
    a Java wizard. Except for the translation phase, a JSP is handled exactly like
    a regular servlet


    # 12.7 About Javaerver Pages 2.3


    The JavaServer Pages (JSP) 2.3 feature provides full support for the JSP 2.3 specification.


    Descriptions of the new JSP 2.3 functions are provided in the JSP 2.3 specification
    and are not described here : However, the new specification additions are minor,
    as compared to the JSP 2.2 feature :


    +   - Support for Expression Language (EL) 3.0


    +   - Availability of Servlet 3.1 APIs to a JSP.


    +   - There are no known behavior differences between JSP 2.2 and JSP 2.3 that
    directly prevent a JSP that runs with JSP 2.2 from successfully running with JSP
    2.3. However, if a JSP uses Expression Language (EL) or Servlet API functions,
    must consider the changes between Servlet 3.1 and Servlet 3.0, and between EL
    3.0 and EL 2.2.


