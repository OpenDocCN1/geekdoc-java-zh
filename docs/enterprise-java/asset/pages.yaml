  md: '# 17.5 Accessing Enterprise Beans


    Clients access enterprise beans either through a no-interface view or through
    a business interface.


    +   1. **No-interface view**: A no-interface view of an enterprise bean exposes
    the public methods of the enterprise bean implementation class to clients. Using
    the no-interface view of an enterprise bean may invoke any public methods in the
    enterprise bean implementation class or any super classes of the implementation
    class. Well-designed interfaces and no interface views simplify the development
    and maintenance of Java EE applications. It also allows the enterprise beans to
    change internally without affecting the clients. For example, if we change the
    implementation of a session bean method, we won''t have to alter the client code.

    2. **Business interface**: A business interface is a standard Java programming
    language that contains the business methods of the enterprise bean. A client can
    access a session bean only via the methods defined in the bean''s business interface
    or through the public methods of an enterprise bean that has a no interface view.
    The business interface or no interface view define the client''s view of an enterprise
    bean. All other aspects of the enterprise bean are hidden from the client.


    If we want to change the method definitions in the interfaces, we also have to
    modify the client code. Therefore, it is important that we design the interfaces
    and no interface views carefully to isolate our clients from possible changes
    in the enterprise beans. Session beans can have more than one business interface.
    Session beans should, but are not required to, implement their business interface
    or interfaces.


    # 17.5.1 Enterprise Beans Clients


    The client of an enterprise bean gets a reference to an instance of an enterprise
    bean via dependency injection, using Java programming language annotations, or
    JND lookup, using the Java Naming and Directory Interface syntax to find the enterprise
    bean instance.


    Dependency injection is the simplest way of obtaining an enterprise bean location.
    Clients run within a Java EE server managed environment, JavaServer Faces applications,
    JAX-RS web services, other enterprise beans, or Java EE application clients, support
    dependency injection using the `javax.ejb.EJB` annotation.


    # 17.6 Enterprise Bean Application


    To develop an application of Enterprise Bean, we must provide the following beans:


    +   * **Enterprise class**: It implements the business methods of the enterprise
    bean and any lifecycle callback methods.'
