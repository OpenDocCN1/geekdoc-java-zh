  md: '# CHAPTER

    UNIT - I


    # UNDERSTANDING

    JAVA EE


    # 1.1 What Is An Enterprise Application?


    Enterprise application software is large-scale software that is aimed to support
    or solve the problems of an entire organization. This large-scale software allows
    for different user roles, and the roles define the actions that specific user
    can perform. An enterprise application is a business application, obviously. Most
    people use the term, it is a big business application. In today''s corporate environment,
    enterprise applications are complex, scalable, component-based and mission-critical.
    They may be deployed on a variety of platforms across networks, intranets, or
    the Internet. They are data-centric, user-friendly, and must meet stringent requirements
    for security, administration, and maintenance. In short, they are highly complex
    systems.


    The enterprise software includes many functions and abilities :


    +   - Salesperson can log client information, including personal and product information
    and client location in the sales pipeline.

    - Customer service representatives can track client issues and communication alongside
    internal responses and updates.

    - Internal-facing employees can take client differences to build the product.

    - Managers and C-level executives can track client and employee performance.


    # 1.1.1 Architecture of an Enterprise Application


    To reduce costs and fast-track enterprise application design and development,
    the Java 2 Platform, Enterprise Edition (Java EE) technology provides a component-based
    approach to the design, development, and deployment of enterprise applications.
    You can deliver innovative customer solutions to market faster than ever, because
    their platform-independent Java EE component solutions are not tied to the product
    and APIs of any specific server.


    The Java EE platform uses a distributed multi-tiered application model for enterprise
    applications. Application logic is divided into components according to function,
    and the application components that make up a Java application are installed on
    various machines depending on the tier in the multi-tiered Java EE environment
    to which the application component belongs.


    In distributed computing, an application is divided into smaller parts that run
    simultaneously on different computers. The smaller application parts are called
    tiers. Each'
  merge: -1
  pgno: 12
