  md: '# IV. Cookie Expiration


    One important Cookie setting is the cookie expiration time. This time tells the
    browser how long it should keep the cookie before deleting it.


    You set the cookie expiration time via the setMaxAge() method. This method takes
    the number of seconds the cookie is to live as parameter. Here is an example :


    ```

    cookie = new Cookie("uid", "123");

    cookie.setMaxAge(24 * 60 * 60); // 24 hours.

    response.addCookie(cookie);

    ```


    This example creates a Cookie instance with the name "uid" and the value "123".
    Second, it sets the expiration to 24 hours using the setMaxAge() method. 24 hours
    is 60 seconds × 60 minutes × 24 hours (24 × 60 × 60). Finally the example sets
    the cookie on the HttpServletResponse object, so the cookie is included in the
    response to the browser.


    # V. Removing Cookies


    Sometimes you may want to remove a cookie from the browser. You do so by setting
    the cookie expiration time. You can set the expiration time to 0 or -1. If you
    set the expiration to 0 the cookie will be removed immediately from the browser.
    If you set the expiration time to -1 the cookie will be deleted when the browser
    shuts down.


    Here is an example :


    ```

    cookie = new Cookie("uid", "");

    cookie.setMaxAge(0);

    response.addCookie(cookie);

    ```


    If the browser already has a cookie stored with the name "uid", it will be deleted
    after receiving the cookie with the same name "uid" with an expiration time of
    0. If the browser did not already have the cookie stored, this new cookie is just
    thrown out since its expiration time is 0.


