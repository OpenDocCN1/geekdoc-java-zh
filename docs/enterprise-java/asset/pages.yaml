  md: '# Advantages of JSP over Other Servlets


    +   - Versus active server pages (ASP) : ASP is given by Microsoft. It is also
    a tag-based programming language. ASP code is not portable. However, JSP code
    is portable because it is written in Java which is portable language. We can use
    Java for JSP, so we do not need with a particular server product or IIS.

    - Versus PHP : PHP is an HTML embedded scripting language and it is also open
    source software Java. It is similar to JSP and ASP. It is not suitable for large
    scale application and banking applications where money transaction occurs because
    of security reasons. For PHP we have to learn one language.

    - Versus JavaScript : JavaScript is in no relation with Java programming. It is
    normally used to generate HTML dynamically on the client machine. JavaScript is
    not suitable for network programming and to access server-side resources. Java
    is more powerful, flexible, reliable and portable than PHP.

    - Versus HTML : Regular HTML, that is static HTML does not contain dynamic information.
    So it does not react to user and is also not for access server pages. JSP contains
    both static and non-static content. As static part, it contains HTML.


    # DISADVANTAGES OF JSP


    +   - Output is HTML which is not rich in features.

    - Difficult to debug/trace errors when JSP are translated into servlets and are
    compiled.

    - JSP pages require more time when accessed for the first time as they are to
    be compiled on the server.

    - Database connectivity is not as easy as it should be. Most of the servlet engine
    vendors do not support connection pooling natively

    - Numerous syntax related with JSP programming


    # JSP vs/. Servlets


    +   - Servlet is faster than JSP, while JSP is slower than Servlet because it
    first translate into java code then.

    - In Servlet, if we modify the code then we need recompilation, restarting the
    server? It is consuming process. In JSP, if we do any modifications then we need
    to click on refresh button and recompilation, reloading, and restart the server
    is not required.

    - Servlet is a pure java code. JSP is tag based approach.

    - In Servlet, there is no such method for running JavaScript at client side. In
    JSP, we can use the client side validations using running the JavaScript at client
    side.

    - To run a Servlet we have to make an entry of Servlet mapping into the deployment
    descriptor file i.e. web.xml externally. For running a JSP there is no need to
    make an entry of JSP mapping into the web.xml externally, you may or not make
    an entry for JSP as file list final.

    - Coding of Servlet is harder than JSP. While Coding of JSP is easier than Servlet
    because it is tag based.

    - MVC pattern, Servlet plays a controller role. While MVC pattern, JSP is used
    for showing output data i.e. in MVC it is a view.


    +   - JSP pages require about double the disk space to hold the page servlet.'
