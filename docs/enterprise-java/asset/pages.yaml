    # 9.2.1 Methods of Session Tracking


    Session Management is a mechanism used by the Web container to store session information
    for a particular user. There are four different techniques used by Servlet application
    for session management. They are as follows :


    # I. Cookies


    Using cookies is one of the most widely and accepted ways to maintain a session.
    A cookie is a special tag identifier that your server generates and the browser
    accepts. Actually, it is a simple data structure consisting of name-value pairs
    associated with a URL, in this case, the URL to execute the servlet. For maintaining
    a session, the servlet stores the session identifier and other data as a string
    in the cookie.


    After accepting the session cookie, the browser propagates the cookie to every
    request from the browser to the servlet. A servlet can read the cookie and modify
    its contents if any. If there is no cookie, the servlet detects a new session,
    generates a unique session identifier, and sets this value to the cookie. This
    is then sent back to the browser with the response HTML page. The browser interprets
    the identifier, cookie, and sets it in the browser. After this, for every request,
    the browser sends this cookie to the servlet.


    Cookies can be transient or persistent. The Transient cookies last until the browser
    is closed, while persistent cookies are stored by the browser on the physical
    disk, to be retrieved and used when the same URL is accessed by the user again.
    Cookies, transient or have a time limit and expire after the time limit is exceeded.


    A primary limitation of cookies is the length of data that can be stored. A maximum
    of 4KB of data can be stored in a cookie. This limits the amount of session data
    that can be stored for a user.


    Browsers allow disabling cookies. If cookie acceptance is disabled, this technique
    is not going to work. For example, a servlet could do something like the following
    :

    ```nString sessionID = makeUniqueString();

    Hashtable sessionInfo = new Hashtable();

    Hashtable globalTable = findTableStoringSessions(sessionID);

    globalTable.put(sessionID, sessionInfo);

    Cookie sessionCookie = new Cookie("SESSIONID", sessionID);

    response.addCookie(sessionCookie);

    ```


    In, later the server could use the globalTable to associate a session ID from
    the SESSIONID cookie with the sessionInfo hash table of data associated with that
    particular session. This is an excellent solution and is the most widely used
    approach for session handling. Still, it is noted that servlets have a higher-level
    API that handles all this the following tedious tasks :


    +   - Extracting the cookie that stores the session identifier from the other
    cookies (there may be many cookies, after all).


    +   - Setting an appropriate expiration time for the cookie.


    +   - Associating the hash tables with each request.


    +   - Generating the unique session identifiers.'
