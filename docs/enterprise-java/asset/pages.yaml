    a service() method, which is responsible for handling Servlet requests. For generic
    servlets, we override the service method to provide routines for handling requests.
    HTTP Servlets provide a service method that automatically routes the request to
    another method in the Servlet, based on which HTTP transfer method is used. So,
    for HTTP servlets, override doPost() to process POST requests, doGet() to process
    GET requests, and so on.'
