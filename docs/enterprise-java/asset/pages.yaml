    4. Where are Cookies placed in computer?

    5. Explain in the creation of Cookie.

    6. List and Explain important methods of Cookie class.

    7. Explain setting, sending and reading of Cookie in java servlet.

    8. Write short note on Cookie expiration and removal.'
