    \ a Servlet.\n2. Invokes the service method, passing a request and response object.\
    \ Service methods are discussed in the section Writing Service Methods.\n\nIf\
    \ the container needs to remove the Servlet, it finalizes the Servlet by calling\
    \ the Servlets destroy method.\nThe following are the life cycle methods of a\
