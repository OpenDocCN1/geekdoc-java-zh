    # 20.3 Persistence in Java


    Persistence, in computer science, is a describing data that outlives the process
    that created it. There are many ways to make data persistent in Java, including
    (to name a few): JDBC, serialization, file IO, JCA, object databases, and XML
    databases. However, the majority of data is persisted in databases, specifically
    relational databases. Most things that you do on a computer or web site involve
    storing data, involve accessing a relational database. Relational databases are
    the standard mode of persistent storage for most industries, from banking to manufacturing.


    There are many ways to be stored in databases with Java. Java data includes strings,
    numbers, and byte arrays, images, XML, and Java objects. Many Java applications
    use Java objects to model their application data. Because Java is an Oriented
    language, storing object java is a natural and common approach to persisting data
    from Java.


    # 20.3.1 Persistence of Object Oriented Models


    Object-oriented models have rapidly become the choice of programming for most
    computer applications. Since most applications need to deal with persistent data,
    adding persistence to objects is essential to making object-oriented applications
    useful in practice. There are three classes of solutions for implementing persistence
    in object-oriented: the gateway-based persistence approach, which involves adding
    object-oriented programming to access persistent data stored using traditional
    non-object-oriented stores, the object-relational database management system approach,
    which involves enhancing the extremely powerful relational data model by adding
    object-oriented modelling features, and the object-oriented approach involves
    adding persistence to objects in an object-oriented programming language.


    Objects are easily traversed through relationship graph through inheritance. When
