    # 17.3 Benefits of Enterprise Bean


    +   1. Provides Architectural Independence : EJB prevents developers from the
    underlying middleware, since EJB is only concern about the Java environment. It
    also helps the EJB server/container vendor to change and make improvements on
    the middleware layer without affecting your user''s enterprise applications.


    +   2. EJB creates a base for Application Development : The EJB specification
    assigns specific roles for project participants with enterprise application development
    using EJB. The server provides support for complex system services and makes available
    an organized framework for a Bean to execute in, without assistance from Bean
    developers.


    +   3. Provides Distributed Transaction support : EJB provides transparency for
    distributed transactions. This means that a client can begin a transaction and
    invoke methods on Beans within two different servers, running on different machines,
    platforms or JVM.


    +   4. WORA for server side components : Since EJB is based on Java technology,
    both the developer and the user are guaranteed that their components are Once
    Write, No Anywhere (WORA). As long as an EJB server devotedly conforms to the
    EJB specification, any EJB application should run within that server.


    +   5. Helps to create Portable and Scalable Solutions : Beans conforming to the
    EJB API will install and run in a portable fashion on any EJB server.


    +   6. Provides vendor specific enhancements : Since the EJB specification provides
    a lot of flexibility for the vendors to create their own enhancements, the EJB
    environment may end being feature rich.


    +   7. Developer productivity : The EJB architecture improves the productivity
    of application developers by standardizing and automating the use of complex infrastructure
    services such as transaction management and security checking.


    +   8. Customization : Enterprise bean applications can be customized without
    access to the source code. Application behaviour and runtime settings are defined
    through attributes that can be changed when the enterprise bean is deployed.


    +   9. Supervision management : Enterprise beans in an EJB benefit from transaction
    management services as :


    +   (1) Shunting, (2) System log management, (3) Performance optimizations, (4)
    Runway detection, (5) Deadlock detection, (6) TCLASS management Monitoring and
    statistics


