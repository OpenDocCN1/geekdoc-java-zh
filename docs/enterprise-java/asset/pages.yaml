  md: 'Java EE Architecture, Server and Containers


    # 2.1.2 Two-Tier Architecture


    A two-tier architecture is a software architecture in which a presentation layer
    or interface runs on a client, a data layer or data structure gets stored on a
    server. Separating these two components into different locations represents a
    two-tier architecture, as opposed to a single-tier architecture.


    The Two-tier architecture is divided into two parts:


    +   1. Client Application (Client Tier)

    2. Database (Data Tier)


    Client system handles both Presentation and Application layers as Server system
    handles Database layer. It is also known as client server application. The communication
    takes place between the Client and the Server. Client system sends the request
    to the Server system and processes the request and sends back the data to the
    Client System.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_24_0.png)


    The word "tier" commonly refers to splitting the two software layers onto two
    different physical pieces of hardware. Multi-layer programs can be built on one
    tier, but because of operational preferences, many-tier architectures use a computer
    for the first tier and a server for the second tier.


    # Advantages


    +   1. Easy to maintain and modification is bit easy.

    2. Communication is faster.


    # Disadvantages


    +   1. In two-tier architecture performance will degrade upon increasing the users.

    2. Cost-ineffective.


    # 2.1.3 Three-Tier Architecture


    Three-tier architecture typically comprise a presentation tier, a business or
    data access tier, and a data tier. Three layers in the three tier architecture
    are Client layer, Business layer and Data layer.


    +   1. Client layer : Represents Web browser, a java or other application, Applet,
    WAP etc. The client makes requests to the Web server who will be serving the request
    by returning static content if it is present in the Web server or forwards the
    request to either Servlet or JSP in the application server for static or dynamic
    content.


    +   2. Business layer : This layer provides the business services. This tier contains
    the business logic and the business data. All the business logic like validation
    of data, calculations, data insertion etc. are centralized in this tier as opposed
    to 2-tier systems where the business logic is scattered across the front end and
    the backend.


    +   3. Data layer : This layer is the eternal resource as a database, ERP system,
    Mainframe etc. responsible for storing the data. This is also known as Data Tier.
    Data Access Layer contains methods to connect with database or other data source
    and to perform insert, update, delete, get data from data source based on our
    input data. Following diagram representing the 3-tier architecture.'
