    # 15.2 Scope


    # 15.2.1 Page Scope


    An object with page scope is bound to javax.servlet.JSP.PageContext. The object
    is placed in the PageContext for as long as the page is responding to the current
    request. An object with this scope can be accessed by calling the getAttribute
    method on the implicit page object. The object is created and destroyed for each
    client request to the page. It is the default scope for objects used with the
    <jsp:useBean> action.


    Note: Page scope is available only within particular page.


    # 15.2.2 Request Scope


    Request scope means that the object is bound to the javax.servlet.ServletRequest,
    and can be accessed by invoking the getAttribute method on the implicit request
    object. The object is distinct for every client request. The reference is available
    as long as the HttpRequest object exists, even if the request is forwarded to
    different page, or if the <jsp:include> action is used.


    Note: Request scope is available only from one page to next request.


    # 15.2.3 Session Scope


    An object with session scope is bound to the javax.servlet.JSP.PageContext, and
    can be accessed by invoking getValue method on the implicit session object. The
    generated Servlet relies on binding the object to the HttpSession using the setAttribute(String
    key, Object value) method. The object is different for every client, and is available
    as long as the client''s session is valid.


    Note: Session scope is available from session start to end on every page.


    # 15.2.4 Application Scope


    Application scope means that the object is bound to the javax.servlet.ServletContext.
    An object with this scope can be accessed by invoking the getAttribute method
    on the implicit application object. This is the only persistence scope. When accessing
    variables, take care your code is thread safe. Application variables are often
    populated on application startup, and read only thereafter.


    Note: Application scope is available from Application (Website) start to Application
    on every page. It can be taken as global state for an application.


    # 15.3 Character Quoting Conventions


    Escape characters (also called sequences or Character Quoting Conventions) in
    general are used to signal an alternative interpretation of some characters. There
    are many ways to escape HTML special characters in JSP. For those who are not
    familiar with HTML special characters, there are five: <, >, &, and '' '' if you
    want to print them literally like here. Then you need to escape those character
    so < becomes &lt; ; > becomes &gt; and so on. Of course, you can write your own
    custom tag or method for converting HTML special characters to entity format which
    browser understand but don''t need to do this because there are more easy and
    standard way to escape HTML special characters in JSP and java.'
