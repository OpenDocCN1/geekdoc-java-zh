  md: 'object-oriented programming (OOP) languages such as Java, ORM converts data
    between systems that are unable to coexist within relational databases and OOP
    languages.


    ORM resolves the object code and relational database mismatch with three approaches:
    bottom, top-down and in the middle. Each approach has its share of benefits and
    drawbacks. When selecting the best software solution, developers must fully understand
    the environment and design requirements.


    In addition to the data access mechanism, ORM''s benefits also include :


    +   - Simplified development because it automates object-to-table and table-to-object
    conversion, resulting in lower development and maintenance costs.


    +   - Less code compared to embedded SQL and handwritten stored procedures.


    +   - Transparent object caching in the application tier, improving system performance.


    +   - An optimized solution making an application faster and easier to maintain.


    # 20.6.1 The Impedance Mismatch


    An object-relational impedance mismatch refers to a range of problems representing
    data from relational databases in object-oriented programming languages. The term
    is used by analogy with the electrical engineering "impedance management," where
    the optimal design is in most cases to have the input match the output impedance
    for maximum power flow.


    An impedance mismatch can occur when accessing a relational database in an objectoriented
    programming language. Problems arise because object-oriented programming languages
    like Java or Python have very different approaches to accessing data.


    Some of these includes :


    +   - Type references : Object-oriented languages make heavy use of by-reference
    attributes, which is typically prohibited in relational databases. Scalar types
    also often differ between database and OO languages.


    +   - In OO languages, objects can be made of other objects, while this is impossible
    in relational databases for integrity.


    +   - Relational databases have well-defined operations for manipulating and querying
    data, while OO languages have lower-level operations.


    +   - Relational databases have more robust approaches to transactions to preserve
    atomicity and consistency. The only way to guarantee this through an OO language
    is at the level of primitive-typed fields.


    # 20.6.2 How to Map One to the Other?


    The most naive approach is a simple mapping between each class and a database
    table. This approach requires lot of complex, tedious and costly to code.


    # 20.6.3 The Solution to the Impedance Mismatch


    Java-to-data source integration is a widely underestimated problem when creating
    enterprise Java applications. This complex problem involves more than simply reading
    from writing to a data source. The data elements include tables, rows, columns,
    and primary and foreign keys. Successful solution requires bridging different
    technologies, and solving the object-persistence impedance mismatch-a challenging
    and resource-intensive problem. The solution is to use Object relational mapping
    tool which is also referred to as Object relational Mapper (ORM).'
