  md: '# Disadvantages


    +   The Bridge driver is not coded completely in Java; So Type 1 drivers are not
    portable.


    +   It is not good for the Web Application because it is not portable.


    +   It is comparatively slowest than the other driver types.


    +   The client system requires the ODBC Installation to use the driver.


    # Type 2 - Native-API/Partly Java driver


    This driver connects JDBC API calls into DBMS client API calls. Similar to the
    bridge driver, this type of driver requires some binary code loaded on each client
    computer.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_0.png)


    # Advantage


    This type of driver offer normally better performance than the JDBC-ODBC Bridge
    as the layers of communication are less than that and it uses Native/Native API
    which is Database specific.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_1.png)


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_2.png)


    # Disadvantage


    +   Most out of date now.


    +   It is usually not thread safe.


    +   This API must be installed in the Client System; Native API/Partly Java Driver
    therefore this type of drivers cannot be used for the Internet Applications.


    +   Like JDBC-ODBC Bridge, it is not coded in Java which can cause portability
    issue.


    +   If we modify the Database then also have to change the Native API as it is
    specific to a database.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_3.png)


    # Type 3 - JDBC-Net/Pure Java Driver


    This driver sends JDBC API calls to a middle tier Server that translates the calls
    into the DBMS precise Network protocol. The translated calls are sent to a particular
    DBMS.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_4.png)


    # Advantage


    +   This type of drivers is the most efficient among all driver types.


    +   This driver is totally coded in Java and hence Portable. It is suitable for
    the web Applications.


    +   This driver is server based, so there is no need for any vendor database library
    to be present on client machines.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_5.png)


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_63_6.png)


    +   With this type of driver there are many opportunities to optimize portability,
    performance, and scalability.


    +   The Net protocol can be designed to make the client JDBC driver very small
    and fast to load.


    +   This normally provides support for features such as caching, load balancing
    etc.


    +   Provides facilities for System administration such as logging and auditing.


    +   This driver is very flexible access to multiple databases using one driver.


    JDBC-Net/Pure Java Driver'
