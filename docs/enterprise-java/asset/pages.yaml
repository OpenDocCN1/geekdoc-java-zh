  md: '+   Page : specifies that you can use this bean within the JSP page. The default
    scope is page.


    +   request : specifies that you can use this bean from any JSP page that processes
    the same request. It has wider scope than page.


    +   session : specifies that you can use this bean from any JSP page in the same
    session whether processes the same request or not. It has wider scope than request.


    +   application : specifies that you can use this bean from any JSP page in the
    same application. It has wider scope than


    +   3. class : instantiates the specified bean class (i.e. creates an object of
    the bean class) but it must have no-arg or constructor and must not abstract.


    +   4. type : provides the data type if the bean already exists in the scope.
    It may be used with class or beanName attribute. If you use without class or beanName,
    no bean is instantiated.


    +   5. beanName : instantiates the bean using the java.beans.Beans.instantiate()
    method.


    # 14.5.2 Setting the Properties of the Bean


    The JSP set action sets the properties of the Bean. The Bean must have been previously
    defined before this action. There are two basic ways to use thesetProperty action:


    We can use setProperty after, but outside of a : JSP:useBean element, as :


    ```

    <JSP:useBean id="myName" />

    ```


    ```

    <JSP:setProperty name="someProperty" ... />

    ```


    In this case, the JSP:setProperty is executed regardless of whether a new bean
    was instantiated or an existing bean was found.


    A second way is which : JSP:setProperty can appear inside the body of a JSP:useBean
    element, as :


    ```

    <JSP:useBean id="myName" ... />

    ```


    ```

    <JSP:setProperty name="myName" property="someProperty" ... />

    ```


    ```

    <JSP:useBean>

    ```


    In this case the JSP:setProperty is executed only if a new object was instantiated,
    not if an existing one was found. Property will be passed to the appropriate setter
    methods.


    In <JSP:setProperty> action the name attribute tells the bean whose property will
    be set. The bean must have been previously defined. The property attribute indicates
    the property that we want to set. A value of means that all parameters match.
    The value attribute specifies which value is to be assigned to the property. If
    the parameter''s value is null, or the parameter does not exist, the property
    action is ignored. The attribute param gives the name of the request parameter
    whose value is to retrieve. We can''t use both value and param, but it is permissible
    to use name.


    # 14.5.3 Accessing the Properties of the Bean


    The getProperty action is to regain the value of a given property and converts
    it to a string, and finally inserts it into the output. The getProperty action
    has only two attributes, of which both are required.


    Syntax : <JSP:useBean id="myName" ... />


    ```

    <JSP:getProperty name="myName" property="someProperty" ... />

    ```'
