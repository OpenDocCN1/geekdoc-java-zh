  md: '# 18.5 Lifecycle of Enterprise Beans


    An enterprise bean goes through various stages during its lifetime, or lifecycle.
    Each type of enterprise bean (stateful session, stateless session, singleton session,
    or message-driven) has a different lifecycle.


    # 18.5.1 Stateful Session Bean :


    +   1. Create

    2. Dependency Injection, if any

    3. PostConstruct callback, if any

    4. Init method or ejbCreate<Method>, if any


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_174_0.png)


    +   1. Remove

    2. PreDestroy callback, if any


    The client initiates the lifecycle by obtaining a reference to a stateful session
    bean. The container performs any dependency injection and invokes the method annotated
    with @PostConstruct, if any. The bean is now ready to have its business methods
    invoked by the client.


    While in the ready state, the EJB container may decide to deactivate or passivate
    the bean by moving it from memory to secondary storage. The EJB container invokes
    the method annotated @PrePassivate, if any, immediately before passivating. If
    a client invokes a business method on the bean while it is in the passive state,
    the EJB container activates the bean, calls the method annotated @PostActivate,
    if any, and moves it to the next stage.


    At the end of the lifecycle, the client invokes a method annotated @PreDestroy,
    if any. The bean’s instance is then ready for garbage collection.


    Your code controls the invocation of only one lifecycle method, the method annotated
    @Remove. All other methods are invoked by the EJB container.


    # 18.5.2 Stateless Session Bean


    A stateless session bean is never passivated, its lifecycle has two stages: nonexistent
    and ready for the invocation of business methods.


    +   1. Dependency Injection, if any

    2. PostConstruct callback, if any


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_174_1.png)


    The EJB container typically creates and maintains a pool of stateless session
    beans, beginning the stateless bean’s lifecycle. The container performs any dependency
    injection and invokes the method annotated @PostConstruct, if it exists. The bean
    is now ready to have its business methods invoked by a client.


    At the end of the lifecycle, the EJB container calls the method annotated @PreDestroy,
    if it exists. The bean’s instance is ready for garbage collection.'
