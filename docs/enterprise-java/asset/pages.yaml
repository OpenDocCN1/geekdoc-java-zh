  md: '# CHAPTER 14


    # UNIT - III


    # ACTION ELEMENTS


    # ## 14.1 Introduction


    Action elements are basically predefined functions and there are following JSP
    actions available. JSP actions uses in XML syntax to control the behaviour of
    the Servlet engine. We can dynamically insert a file, reuse JavaBeans, forward
    the user to another page, or generate HTML for the JSP plug-in.


    ```

    <jsp:action_name="value"/>

    ```


    The JSP action element uses two common attributes as follows :


    +   a) **Id attribute** : The id attribute uniquely identifies the lifecycle of
    the Action element, and allows the attribute to be referenced inside the JSP page.
    If the Action creates an instance of an object the id value can be used to reference
    it through the implicit object PageContext.

    b) **Scope attribute** : This attribute identifies the lifecycle of the Action
    element. The id attribute and the scope attribute are directly related, as the
    scope attribute determines the lifespan of the object associated with the id.
    The scope attribute has four possible values: (a) page, (b) request, (c) session,
    and (d) application.


    # ## 14.2 Including Other Files


    The **jsp:include action tag** is used to include the content of another resource
    it may be JSP, HTML or servlet. The JSP include action tag includes the resource
    at request time so it is better for **dynamic pages** because there might be changes
    in future. The **JSP:include tag** can be used to include static as dynamic pages.
    We can use a page many times such including header and footer pages in all pages.
    It saves a lot of time.


    This action inserts the file at the time the page is requested.


    ```

    <jsp:include URL="... flush="true"/>

    ```


    In above syntax the page attribute is the relative URL of the page to be included
    & flush, a boolean attribute determines whether the included resource has its
    buffered before it is or not.


    Let us understand the use of <JSP:include> Action using an example. We define
    two files (a) myDate.JSP and (b) home.JSP as follows :'
