  md: '# Understanding Java EE


    technology in your drag-and-drop GUI tools, allowing you to use the technology
    without having to write or understand the underlying code.


    5. Facets

    JavaServer Faces (JSF) 2.0, Facets is the default view declaration language (VDL)
    instead of JavaServer Pages (J). With Facets, you don''t need to configure a view
    handler. Facets is based on compositions. A composition defines a JSF UIComponents
    structure in a Facets page. A Facets application may consist of components defined
    in different Facets pages and run as an application.


    # 1.3.2 Enterprise Applications Technologies


    +   1. Enterprise JavaBeans [EJB]


    Enterprise JavaBeans (EJB) technology is the server-side component architecture
    for Java Platform, Enterprise Edition (Java EE). EJB enables rapid and simplified
    development of distributed, transactional, secure and portable applications based
    on Java technology.


    +   2. Message Service API


    Messaging is a method of communication between software components or applications.
    A messaging system is a peer-to-peer facility. In other words, messaging client
    can send messages and receive messages from any other client. Each client connects
    to messaging agent that provides facilities for creating, sending, receiving,
    and reading messages. By combining Java technology with enterprise messaging,
    the Java Message Service (JMS) API provides a powerful tool for solving computing
    problems.


    Enterprise messaging provides a reliable, flexible service for the exchange of
    business throughout an enterprise. The JMS API adds to this common API and provider
    framework enables the development of portable messaging-based applications in
    the Java programming language. An example, the inventory component can send a
    message to the factory component when the inventory level for a product goes below
    a certain level, so the factory can make more orders. The factory component can
    send a message to the parts components so that the factory can assemble the parts
    it needs. The parts components in turn can send messages to their own inventory
    and order components to update their inventories and to order new parts from suppliers
    and so.


    +   3. Java Persistence API


    The Java Persistence API is a Java technology standards-based solution for persistence.
    Persistence uses an object-relational mapping approach to bridge the gap between
    an object-oriented model and a relational database. Java technology persistence
    consists of three areas :


    +   - The Java Persistence API

    - The query language

    - Object-relational mapping metadata


    +   4. JavaMail API


    Web applications use the JavaMail API to send email notifications. The API has
    two parts: an application-level interface that the application components use
    to send email and a service provider interface. Service providers implement particular
    email protocols, such as SMTP. Several service providers are included with the
    JavaMail API package, and others are available separately. The Java EE platform
    includes the JavaMail extension with a service provider that allows application
    components to send email. The JavaMail API is now open source.'
