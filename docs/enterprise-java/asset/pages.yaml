    # 20.4.1 Serialization


    Serialization is the conversion of an object to a series of bytes, by that the
    object can be easily saved to persistent storage or streamed across a communication
    link. The byte stream can then be de-serialized and converted into a replica of
    the original object.


    Serialization is simple but has some limitations :


    +   - It should ideally be used with large-sized objects, as it offers significant
    overhead.

    - The Serializable interface does not offer fine-grained control over object access,
    although you can circumvent this issue by implementing the complex Externalizable
    interface, instead.

    - Since serialization does not offer any transaction control mechanisms, it is
    not suitable for use within applications needing concurrent access without making
    use of additional APIs.

    - It does not have querying capacity.


    # 20.4.2 JDBC


    It gives full access to SQL database functionality. JDBC requires the developer
    to explicitly map the values of fields and map them into relational database tables.
    In this case, the developer would need to know another language (for example,
    a query language as SQL).


    JDBC overcomes a lot of issues that serialization has :


    +   - It can handle large amount of data.

    - Ensures data integrity.

    - Support concurrent access to information.

    - Provides query language in SQL.


    Still comes with problem ease to work. It is not designed for strong of an object.
    The interaction of JDBC to database is totally dependent on SQL execution. It
