    # 17.1 Introduction


    Enterprise JavaBeans (EJB) is the server-side component-based middleware standard
    for Java. The specification aims at unifying application servers to support a
    standard architecture so that compliant business applications are not only platform
    independent, but vendor independent.


    EJB is intended for complex distributed systems that use a purchased application
    server to handle the plumbing or low-level technical workload. Encapsulation and
    separation of the technical services from the business application layer allows
    application developers to focus on solving business problems. The following benefits
    are avail to developers:


    +   - Decreases time to market EJB greatly simplifies development of complex distributed
    transactional systems by shielding application builders and architects from the
    complexity of distributed transactional systems and enabling business-focused
    design and implementations.


    +   - Horizontally scalable With its distributed architecture, EJB is designed
    to take advantage of more machines as needed without requiring changes to or redesign
    the business application.


    +   - Reduces vendor and platform dependence Being a Java technology, EJB provides
    a standard mechanism for developing component-based applications regardless of
    the platform or software vendor used. This allows, for instance, development of
    a large UNIX-based system to take place in an inexpensive NET environment.


    +   - Promotes source architecture EJB by separation separates data access, business
    logic, and presentation into separate layers for maximum flexibility and maintainability.


    +   - Broad industry adoption The specification was the joint effort of industry
    leaders. As EJB takes hold, it will provide the foundation for a rich COTS server-side
    component model.


    +   - Promotes Reuse Being component-based and object-oriented, EJB promotes project
    and enterprise reuse and consistency.'
