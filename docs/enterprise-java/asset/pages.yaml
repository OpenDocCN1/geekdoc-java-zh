    # 2.1 Types of System Architecture


    # 2.1.1 Single tier architecture


    Single tier architecture involves putting all of the required components for a
    software application or technology on a single server or platform. Basically,
    a single-tier architecture keeps all of the elements of an application, including
    the interface, middleware and back-end data, in some. Some experts describe them
    as applications that could be installed and run on a single computer. The need
    for distributed models for Web applications and cloud hosting solutions has created
    all situations where one-tier architectures are not sufficient. The single-tier
    architecture is low-cost, where it might make more sense to keep simpler architectures
    contained in one easy platform.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_23_0.png)


    # Advantages


    +   1. Easy to implement and optimize performance.

    2. Do not have compatibility or Context switching issues.

    3. The cost of deployment is less Eg. Development and management cost.


    # Disadvantages


    +   1. Do not support remote/ distributed access for data resources.

    2. Monolithic manner of the code causes higher maintenance.'
