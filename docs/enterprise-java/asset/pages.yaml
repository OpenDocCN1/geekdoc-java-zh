  md: 'Understanding Java EE


    # 1.3.4 Security Technologies


    +   1. JACC


    The Java Authorization Contract for Containers (JACC) specification defines a
    contract between a Java EE application server and an authorization policy provider.
    All Java EE containers support this contract.


    +   2. JASPIC


    The Java Authentication Service Provider Interface for Containers (JASPIC) specification
    defines a service provider interface (SPI) by authentication providers that implement
    message mechanisms may be integrated into client or server message processing
    containers or runtimes. Authentication providers integrated through this interface
    operate on network messages provided to them by their calling container. They
    transform outgoing messages so that the source of the message may be authenticated
    by the receiving container, and the recipient of the message may be authenticated
    by the message sender. They authenticate incoming messages and return to their
    calling container the identity established as a result of the message authentication.


    # 1.4 EE Evolution


    The Java Platform, Enterprise Edition or Java EE (formerly known as Java 2 Platform,
    Enterprise Edition or J2EE) has undergone several changes since 1.0 as well numerous
    additions of specifications.


    The original J2EE specification was developed by Sun Microsystems.


    Starting with J2EE 1.3, the specification was developed under the Java Community
    Process. JSR 58 specifies J2EE 1.3 and JSR 151 specifies the J2EE 1.4 specification.


    The J2EE 1.3 SDK was first released by Sun as a beta in April 2001. The J2EE 1.4
    SDK was released by Sun in December 2002.


    The Java EE 5 specification was developed under JR 244 and the final release was
    made on May 11, 2006.


