    # REQUEST DISPATCHER


    # 7.1 Requestdispatcher Interface


    RequestDispatcher interface is defined in javax.servlet package. RequestDispatcher
    object contains request of client and control over another web component. The
    servlet container is responsible for creating RequestDispatcher which is used
    as a wrapper around a server resource located at a particular path or given by
    a particular name. For transferring control to the component you can invoke the
    forward method of a RequestDispatcher. This interface is intended to wrap servlets,
    a servlet container can create RequestDispatcher objects to wrap any type of resource.


    Communication between Servlets is an important task to the Programmer.


    # 7.1.1 Obtaining an Object Implementing RequestDispatcher


    For obtaining the object, two styles exist using ServletRequest object and ServletContext.
    The getDispatcher(String path) method returns an object of RequestDispatcher and
    the same method exists in both interfaces of ServletRequest and ServletContext.
    This can be achieved like following:


    +   * javax.servlet.ServletContext.getRequestDispatcher(String path)

    * javax.servlet.ServletRequest.getRequestDispatcher(String path)

    * RequestDispatcher getDispatcher(String path) : Returns a RequestDispatcher object
    that acts as a wrapper for the resource at the given path. A Request object can
    be used to forward to the resource or to include the resource in a response. The
    resource can be dynamic or static.

    * RequestDispatcher getDispatcher(String name) : This method takes the name of
    the Servlet (and JSP pages also) as parameter which is declared via Deployment
    description. It expects logical name of the destination servlet/JSP program as
    argument value.


    # 7.2 METHODS OF REQUESTDISPATCHER


    RequestDispatcher is used in two cases:


    +   1. To include the response (output) of one Servlet into another (that is,
    client gets the response of both Servlets).

    2. To forward the client request to another Servlet to honour (that is, client
    calls a Servlet but response to client is given by another Servlet).'
