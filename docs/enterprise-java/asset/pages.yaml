    | Symbol Version | Text Version |

    | --- | --- |

    | == | eq |

    | != | ne |

    | < | lt |

    | > | gt |

    | >= | ge |

    | <= | le |


    Notice that they all have a text version in addition to the more familiar symbol
    version. Here are some basic comparisons :


    Is 1 less than 2? $[1<2]<br>Does 5 equal to 5? $[5==5]<br>Is 6 greater than 7?
    $[6 gt 7]$<br>


    # 15.4.5.4 Conditional Operator


    The conditional operator (? ) is a ternary operator (it takes three operands).
    The conditional operator works as follows :


    +   - The first operand is converted to bool. It is implicitly and all side effects
    are complete before continuing.

    - If the first operand evaluates to (1), the second operand is evaluated.

    - If the first operand evaluates to (0), the third operand is evaluated.


    Example:


    ```

    <out default="None" escapeXml="true" value=${empty value ? ''None'': value}/>

    ```


    # 15.4.5.5 The . [Dot] and [ ] Operator


    The expression language provides two operators (. and [ ]) that let you access
    scoped variables and their properties. The . operator is similar to the Java .
    operator, but instead of invoking methods, you access properties; for example,
    if you have a Name stored in a variable named name that contains firstName and
    lastName properties you can access those properties like this :


    ```

    First Name: <out value="${firstName}/>

    Last Name: <out value="${lastName}/>

    ```


    Assuming that there is a bean name that has readable firstName and lastName in
    one of the four JSP scopes, meaning methods getFirstName and getLastName, the
    preceding code fragment will display those properties.


    You can also use the [ ] operator to access properties; for example, the preceding
    code fragment could be rewritten like this :


    ```

    First Name: <out value="${name[''firstName'']}/>

    Last Name: <out value="${name[''lastName'']}/>

    ```


    The [ ] operator is a generalization of the . operator, which is why the two previous
    code fragments are equivalent, but the [ ] operator lets you specify a computed
    value.'
