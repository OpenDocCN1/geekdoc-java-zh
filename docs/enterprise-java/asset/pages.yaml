  md: '# Enterprise Java (T.Y.B.S.-I.T.) (Sem.-V)


    Java EE applications are hosted on application servers, such as IBM''s WebSphere,
    Oracle''s GlassFish or Red Hat''s WildFly server, all of which either in the cloud
    or within a corporate data center. While Java EE apps are hosted on the server
    side, examples of Java EE clients include an internet of things (IoT) device,
    smartphone, RESTful web service, standard web-based application, WebSocket or
    even microservices running in a Docker container.


    Java EE provides collection of :


    +   - Standardized components that facilitates the crafting of commercial applications

    - Standard interfaces that define how the various application modules interconnect

    - Standard services that define how the different software modules communicate


    # 1.3 Java EE Technologies


    # 1.3.1 Java Servlet API


    The Java Servlet API lets you define HTTP-specific classes. A servlet class extends
    the capabilities of servers that hosts applications are activated by a request-response
    programming model. Although servlets can respond to any type of request, they
    are commonly used to extend the applications hosted by web servers. For instance,
    you might use a servlet to get the text input from an online form and print it
    back to an HTML page and format, or you might use a different servlet to write
    the data to a file or database. A servlet runs on the server side. Java Servlet
    extensions make many web applications possible.


    # 2. JavaServer Pages Technology


    JavaServer Pages (JSP) technology provides a simplified, fast way to create dynamic
    web-based applications that use JSP technology enables rapid development. Independent
    JSP technology lets you add snppets of servlet code directly into a text-based
    document. Typically, a JSP page is a text-document that contains two types of
    text :


    +   - Static data, which can be expressed in any text-based format, such as HTML,
    Wireless Markup Language (WML), or XML.

    - JSP technology elements, which determine how the page constructs dynamic content.


    # 3. JavaServer Pages Tag Library


    The JavaServer Pages Tag Library (JSTL) encapsulates core functionality for many
    JSP-technology applications. Instead of mixing tags from numerous vendors in your
    applications, you employ a single standard of tags. standardization allows you
    to deploy your applications on any JSP container that supports JSTL and makes
    it more likely that the implementation of tags is optimized.


    JSTL has iterator and conditional tags for handling flow control, tags for manipulating
    XML documents, internationalization tags, tags for accessing databases using SQL,
    and tags for custom functions.


    # 4. JavaServer Faces Technology


    JavaServer Faces technology is a UI framework for building web applications. The
    main components of JavaServer Faces technology involve a GUI component framework,
    a flexible model for rendering components in various markup languages and technologies,
    and a standardRenderKit for generating HTML markup.


    This functionality is available through standard Java APIs and XML-based configuration
    files. In addition, Sun Studio Creator IDE leverages JavaServer Faces'
  merge: -1
