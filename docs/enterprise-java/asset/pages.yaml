  md: '# 4.3 javax.servlet.http Package


    The javax.servlet.http package contains a number of classes and interfaces that
    describe and define the contracts between a servlet class running under the HTTP
    protocol and the runtime environment provided for an instance of such class by
    a conforming container.


    # 4.3.1 HttpServlet Class (javax.servlet.http)


    Provides an abstract class to be subclassed to create an HTTP servlet suitable
    for a Web site. A subclass of HttpServlet must override at least one method, usually
    one of these:


    +   * doGet, if the servlet supports HTTP GET requests

    * doPost, for HTTP POST requests

    * doPut, for HTTP PUT requests

    *相应, for HTTP DELETE requests

    * init and destroy, to manage resources that are held for the life of the servlet

    * getServletInfo, which the servlet uses to provide information about itself


    # Constructors


    +   1. HttpServlet() : Does nothing, because this is an abstract class.


    # Methods


    +   1. protected void毁灭(HttpServletRequest req, HttpServletResponse resp) : Called
    by the server (via the service method) to allow a servlet to handle a DELETE request.

    2. protected void doGet(HttpServletRequest req, HttpServletResponse resp) : Called
    by the server (via the service method) to allow a servlet to handle a GET request.

    3. protected void doHead(HttpServletRequest req, HttpServletResponse resp) : Receives
    an HTTP HEAD request from the protected service method and handles the request.

    4. protected void doOptions(HttpServletRequest req, HttpServletResponse resp)
    : Called by the server (via the service method) to allow a servlet to handle an
    OPTIONS request.

    5. protected void doPost(HttpServletRequest req, HttpServletResponse resp) : Called
    by the server (via the service method) to allow a servlet to handle a POST request.

    6. protected void doPut(HttpServletRequest req, HttpServletResponse resp) : Called
    by the server (via the service method) to allow a servlet to handle a PUT request.

    7. protected void doTrace(HttpServletRequest req, HttpServletResponse resp) :
    Called by the server (via the service method) to allow a servlet to handle a TRACE
    request.

    8. protected long getLastModified(HttpServletRequest req) : Returns the time the
    HttpServletRequest object was last modified, in milliseconds since January 1,
    1970 GMT.

    9. protected void service(HttpServletRequest req, HttpServletResponse resp) :
    Receives HTTP requests from the public service method and dispatches them to the
    doXXX methods defined in this class.

    10. void service(ServletRequest req, ServletResponse res) : Dispatches client
    requests to the protected service method.'
