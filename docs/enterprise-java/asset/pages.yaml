    # 17.7 Packaging Enterprise Beans


    EJB components are packaged into modules as jar files and are packaged into application
    enterprise archive as ear file.


    There are three components of an enterprise application :


    +   * Jar Application archive, containing EJB modules, EJB client modules and
    utility modules.

    * War Web archive, containing web modules.

    * Ear Enterprise archive, containing jars and war module.


    # 17.7.1 Packaging Enterprise Beans in EJB JAR Modules


    An EJB JAR file is portable and can be used for various applications. To assemble
    a Java EE application, package one or more modules, such as EJB JAR files, into
    an EAR file, the archive file that contains the enterprise bean''s EJB JAR file,
    you also deploy the enterprise bean to the GlassFish-Server. You can also deploy
    an EJB JAR that is not contained in an EAR file. Following figure shows the contents
    of an EJB JAR file.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_166_0.png)


    # 17.7.2 Packaging Enterprise Beans in WAR Modules


    Packaging the enterprise bean within the web application''s WAR module simplifies
    deployment and application organization. Enterprise beans may be packaged within
    a WAR module as Java programming class files or within a JAR file that is bundled
    within the WAR module.


    To include class files in a WAR module, the class files should be in the WEB-INF/classes
    directory.


    To include a jar file that contains enterprise beans in a WAR module, add the
    JAR to the WEB-INF/lib directory of the WAR module.


    WAR modules that contain enterprise beans do not require an ejb-jar.xml deployment
    descriptor. If the application uses ejb-jar.xml, it must be located in the WAR
    module''s WEB-INF directory.


    JAR files that contain enterprise beans packaged within a WAR module are not considered
    EJB JAR files, even if the bundled JAR file conforms to the format of an EJB JAR
    file. The enterprise beans contained within the JAR file are semantically equivalent
    to enterprise beans located in the WAR module''s WEB-INF/classes directory, and
    the environment namespace of all the enterprise beans are scoped to the WAR module.'
