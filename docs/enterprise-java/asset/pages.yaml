    # 21.5.6 Downcasting in JPQL


    JPQL will be downcast in the FROM and WHERE clause. The format of this will use
    the keyword “TREAT” and be part of the join clause. The operator TREAT can be
    used to cast an entity to its subclass value, i.e. downcast related entities with
    inheritance. This is typically used in JOIN queries where we want to impose a
    restriction in WHERE involving a subclass field. The following is an example:


    Example:


    ```

    select e from Employee e TREAT(e.projects AS LargeProject) lp where lp.attribute
    = value

    ```


    # 21.5.7 JOIN condition Using ON


    JOIN expressions in JPA are already bit different from JOIN in standard SQL. It
    is possible to use JOIN only when a mapping between entities already exists, and
    is not always necessary due to lazy loading of related collections using implicit
    joins. JPA provides an additional feature to standard ON keyword.


    The ON keyword makes possible to filter results after every join, leading to smaller
    result after each successive join. However, one limitation remains when using
    JOIN with ON – entities can still be joined only when they are mapped as related
    entities.


    it makes possible to relate unrelated entities in the ON condition, making it
    possible to JOIN an unrelated entity to other entities in the query. Therefore,
    it does not require that fields are mapped as related. This is convenient especially
    if we need the join condition only for a single report and we don''t want to update
    our mappings.


    Example:


    ```

    SELECT p FROM Person LEFT JOIN Person p2 ON p2.city = :city

    SELECT e FROM Employee e LEFT JOIN e.address ON a.city = :city

    ```


    # 21.5.8 Entity Listeners Using CDI


    Entity Listeners allow to handle cross-cutting lifecycle events in a non-persistent
    listener class. In JPA 2.1, entity listeners will support dependency injection
    through CDI. The usual lifecycle callback methods of @PrePersist,@PostPersist,@PreUpdate
    and @PreRemove can be used for entities. The entity listeners can also be annotated
    with @PostConstruct and @PreDestroy for their own lifecycle.'
