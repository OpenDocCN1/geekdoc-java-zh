    # ## 15.4 Unified Expression Language [Unified EL]


    # ### 15.4.1 Unified EL Evaluation Syntax


    The unified expression language initially called as SPEL (Simplest Possible Expression
    Language) provides a simple way to access external data objects. For example,
    the expression ${employee.name} is used to look up the employee JavaBeans components
    and call the getName method to retrieve the value of the name property. This value
    is rendered into the page.


    The unified expression language allows page authors to use simple expressions
    to dynamically access data from JavaBeans™ components. For example, the test attribute
    of the following conditional tag is supplied with an EL expression that counts
    the number of items in the session-scoped bean cart with 0.


    ```

    <if test="${sessionScope.cart.numberOfItems > 0}">

    ...

    </if>

    ```


    With EL, developers could drastically reduce the amount of scripting in their
    pages, resulting in greater productivity, easier maintenance, and a compliment
    learning curve in terms of page development. The expression language has more
    advanced functionality, but it is very simple to maintain.


    Because of the popularity and success of the expression language in the community,
    the JSP 2.0 expert group included it in its specification while making the EL
    more flexible. The JSP container without delay parses and resolves the expression
    when the page returns a response. For all these reasons, a more powerful expression
    language was created that included the following features :


    +   - Deferred expressions, which can be evaluated at different stages of the
    page life cycle.

    - Expressions that can set data of external objects as well as get that data.


    Method expressions, which can perform event handling, validation, and other functions
    for the JavaServer UI components.'
