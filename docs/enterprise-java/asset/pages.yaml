  md: '# 17.2 Enterprise Bean Architecture


    An enterprise bean is a non-visual component of a distributed, transaction-oriented
    enterprise application. Enterprise beans are typically deployed in EJB containers
    and on EJB servers. The primary components of the application-specific elements
    of EJB architecture are mentioned below :


    +   (1) EJB server(s), (2) EJB container(s), (3) Enterprise Beans, (4) EJB clients

    (5) Other auxiliary systems (e.g., Java Naming and Directory Interface (JNDI)
    server, Java Transaction Service (JTS) ...


    # 17.2.1 Request and Response


    +   1. A client object requests a method for a bean.

    2. After that container becomes active & checks whether the client is in the authorized
    for calling a method.

    3. If the client is authorized, either creates new instance or activates the requested
    bean from the pool.

    4. Container ensures the bean gets its own transaction.


    # 17.2.2 Enterprise Bean Server


    The EJB server provides an environment that supports the execution of applications
    developed using Enterprise JavaBeans (EJB) components. It manages and coordinates
    the allocation of resources to applications.


    The EJB server manages one or more EJB containers. An EJB container manages the
    enterprise beans within it. For each enterprise bean, the container is responsible
    for registering the object, providing a remote interface for the object, creating
    and destroying objects, checking security for the object, maintaining the active
    state for the object, and coordinating distributed transactions. Optionally, the
    container can also manage persistent data within the bean.


    Java JavaBeans technology supports both transient and persistent objects. A transient
    bean is called a session bean, and a persistent bean is called an entity bean.


    A session bean exists only for the duration of a single client/server session.
    A session bean performs operations such as accessing a database or performing
    calculations.


    # 17.2.3 An Enterprise Bean [EJB]


    An enterprise bean is a server-side component that encapsulates the business logic
    of the application. In an inventory control application, for example, the enterprise
    beans might implement the business logic in methods called checkInventoryLevel
    and orderProduct. By invoking these methods, clients can access the inventory
    services provided by the application.


    EJB container provides system-level services to enterprise beans, the bean developer
    can concentrate on solving business problems. The EJB container, rather than the
    bean developer, is responsible for system-level services such as transaction management
    and security authorization.


    Rather than the client concerns the application’s logic, the client developer
    can focus on the presentation of the client. The client developer does not have
    to code the routines that implement business rules or access databases. As a result,
    the clients are thinner, a benefit that is particularly important for clients
    that run on small devices.


    Enterprise beans are portable components, the application assembler can build
    new applications from existing beans. These applications can run on any compliant
    Java EE server provided they use the standard APIs.'
