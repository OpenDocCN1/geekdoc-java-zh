  md: '# Advantages


    +   1. Cookies reduce network traffic, compared to URL rewriting.

    2. Cookies maintain client data.

    3. Cookies help reduce the complexity of an application logic


    # Disadvantages


    +   1. Cookies are not secure, they can be viewed and modified and so personal
    information can be expressed.

    2. Cookies are HTTP specific and can be used for HTTP request only.

    3. Cookies size allocated for a client is limited and varies from one client application
    to another.


    # II. Hidden form


    In this technique, the developer assumes responsibility for implementing the sessionhandling
    functionality. The servlet generates a random identification for the client. This
    can be as simple as a random number generated using the Java API. The servlet
    generates this identification when the logical session is initiated, by logging
    in your servlet application. The servlet writes this identification for every
    page to the client browser until called by the client browser. On every request
    by the browser to the servlet for example, submission of data in an HTML form,
    the session identifier is also sent to the servlet. The servlet uses this identifier
    to maintain a logical session for the client. After processing the data, the servlet
    uses the same identifier and passes it as a value in the HTML page to the browser
    as a response.


    Since this is not tied to any server, it can be implemented for any application
    server. However, the developer bears responsibility for creating and maintaining
    the session. This technique is difficult to implement. Also, if the user refers
    to a page outside the application, only the context is lost and the session can
    break.


    HTML forms have an entry that looks like the following:


    ```

    <INPUT TYPE="HIDDEN" NAME="session" VALUE="...">

    ```


    This means that, when the form is submitted, the specified name and value are
    included in the GET or POST data. This hidden field has the disadvantage that
    only if every page is dynamically generated by a form submission. Thus, hidden
    fields cannot support general session tracking, only tracking specific series
    of operations.


    # Advantages and Disadvantages of Hidden Form


    +   1. Hidden form mechanism is similar to the URL rewriting mechanism, but works
    even with the POST method. The mechanism is not restricted to the GET method,
    can also use the POST method without path info.

    2. Hidden form mechanism also has some disadvantages For example it only works
    when every page is dynamically generated by a form submission.


    # III. URL Rewriting


    With this approach, the client adds some data to the end of each URL that identifies
    the session, and the server associates that identifier with what it has stored
    about that.


    With /http/path/file.html?sessionid=5678, the session information is attached
    to sessionid=5678. This is an excellent solution and has the advantage that it
    works when browsers do not support cookies or when the user has disabled them.
    However it has many of the same problems as cookies, the server-side program has
    a lot of straightforward but tedious processing to do. In addition, you have to
    be very careful that every URL that references your site and is returned to the
    user'
