  md: '# Implicit Objects, Scope and EL Expressions


    #  15.4.1.1 Immediate Evaluation


    All expressions using the ${ } syntax are evaluated immediately. These expressions
    can only be used within template text or the value of a tag that can accept runtime
    expressions.


    The following example shows a tag whose value attribute references an immediate
    evaluation expression that gets the total price from the session-scoped bean cart:


    ```

    <fmt value="${sessionScope.total}">

    ```


    The JavaFaces implementation evaluates the expression, converts it, and parses
    the returned value to the tag handler. Immediate evaluation expressions are always
    read-only expressions. The example shown above can only get the total price from
    the bean; it cannot set the total price.


    #  15.4.1.2 Deferred Evaluation


    Deferred evaluation expressions take the form #[expr] and can be evaluated at
    other phases of a page lifecycle defined by whatever technology is using the expression.
    In the case of JavaFaces technology, the controller can evaluate the expression
    at different phases of the lifecycle depending on how the expression is being
    used in the page.


    The following example shows a JavaFaces inputText, which represents a text field
    component into which user enters a value. The inputText tag''s value attribute
    references a deferred evaluation expression that points to the name property of
    the customer.


    ```

    <inputText id="name" value="#{customer.name}"/>

    ```


    For an initial request of the page containing this, the JavaFaces implementation
    evaluates the #{customer.name} expression during the response phase of the lifecycle.
    During this phase, the expression merely accesses the value of the customer bean,
    as is in immediate evaluation.


    For a postback, the JavaFaces implementation evaluates the expression at different
    phases of the lifecycle, during which the value is deferred until the request,
    validated, and propagated to the customer bean.


    As shown in this example, deferred evaluation expressions can be value expressions
    to be used both read and write data. They can also be method expressions. Value
    expressions (both immediate and deferred) and method expressions are explained
    in the next section.


    #  15.4.2 Types of Expressions


    The EL defines two kinds of expressions: value expressions and method expressions.
    Value expressions can either yield a value or set a value. Method expressions
    reference methods that can be invoked and return a value.


    #  15.4.2.1 Value Expressions


    Value expressions can be further categorized into rvalue and lvalue expressions.
    The rvalue expressions are those that can read data, but cannot write. lvalue
    expressions are those that can read and write data.


    All expressions that are evaluated immediately using the ${ } delimiters are always
    rvalue expressions. Value expressions whose evaluation is deferred using the #{
    } delimiters can act as both rvalue and lvalue expressions. Consider the following
    two value expressions:


    ```

    ${customer.name}

    ```


    ```

    #[customer.name]

    ```'
