    # 18.3 Remote and Local Interfaces


    When you design a Java EE application, one of the first decisions you make is
    the type of client used by the enterprise beans, either Local or Remote.


    The session bean can implement multiple interfaces. Local interface are the type
    of interface that are used for local connections to EJB. @Annotation is used for
    declaring interface as Local. The javax.ejbLocal package is used for creating
    Local interface. Remote interface is the interface that has the methods that relate
    to a particular bean instance. In the Remote interface all of the business methods
    as given below in the program. The javax.ejbRemote package is used for creating
    Remote interface.


    Whether to use local or remote access depends on the following factors :


    +   * Tight or loosely related beans: Tightly coupled depend on one another. For
    example, if a session bean that processes sales orders calls a session bean that
    emails a confirmation to the customer, these beans are tightly coupled. Tightly
    beans are good candidates for local access. Because they fit together as a local
    unit, they typically call each other often and would benefit from the increased
    performance that is possible with local access.

    * Type of client: If an enterprise bean is accessed by application clients, it
    should allow remote access. In a production environment, these clients almost
    always run on machines other than the one which the GlassFish Server is running.
    If an enterprise bean''s clients are web components or enterprise beans, the type
    of access depends on how you want to distribute your components.


    +   * Performance : Using to factors such as network latency, remote calls may
    be slower than local calls. On the other hand, if you distribute components among
    different servers, you may improve the application''s overall performance. Both
    of these statements are generalizations; performance can vary in different operational
    environments. Nevertheless, you should keep in mind how your application design
    might affect performance.


    If you aren''t sure which type of access an enterprise bean should have, choose
    remote access. This decision gives you more flexibility.


