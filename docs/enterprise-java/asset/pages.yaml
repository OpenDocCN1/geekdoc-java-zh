  md: '# Getting Started with JavaServer Pages


    The Java expression is evaluated, converted to a string, and inserted in the page.
    JSP expression we can use some predefined variables as :


    +   - request, the HttpServletRequest;

    - response, the HttpServletResponse;

    - session, the HttpSession associated with the request and out;

    - the PrintWriter (A buffered version of type PrintWriter) used to send output
    to the client.


    Example: our hostname: <%= request.getRemoteHost() %>

    II. Scriptlets : JSP Scripts insert code into the serve() method of the generated
    Servlet. These are having the form as <% code %>. If we want to do something more
    complex then we use


    Syntax: <%% Java Code %>


    Scriptlets can also use predefined variables as in expressions.

    Ex :


    ```

    <%%

    String fname = request.getParameter("fname");

    out.println("name: " + fname);

    %>

    ```


    III. Declarations : A JSP declaration definition methods or fields inserted into
    the main body of the Servlet class. It has the form <%! code %>. They are inserted
    into the body of the Servlet class, outside of any existing methods.


    Syntax: <%% Java Code %>nor


    ```

    <%!

    public int getValue() {

    return 25;

    }

