  md: '# Enterprise Java (T.Y.B.Sc.-I.T.) (Sem.-V)


    provides an independent set of services that can be consumed by the connecting
    or client tier. Enterprise architecture is divided into following tiers :


    +   - Client-tier components run on the client machine.

    - Web-tier components run on the Java EE server.

    - Business-tier components run on the Java EE server.

    - Enterprise information system (EIS)-tier software runs on the EIS server.


    The tiers can be divided into layers, which provide granular-level functions.
    Most applications have three distinct layers:


    +   - The presentation layer is responsible for the user interfaces.

    - The business layer executes the business rules. In the process, it also interacts
    with the data access layer.

    - The data access layer is responsible retrieving and manipulating data stored
    in enterprise information systems (EISs).


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_13_0.png)


    # 1.1.2 Challenges of Enterprise Application Development


    Enterprise mobility has the need of the hour. With more people bringing in their
    own devices to work, it is necessary to ensure enterprise application are developed
    for people to envision productivity and efficiency through the whole enterprise.


    Security is an important concern with enterprise mobility, and it is important
    to take security as a priority when developing enterprise application. The aim
    is to reduce the cost of your enterprise, by giving it more scalability and flexibility.
    The whole environment should be viable and enabled availability of data in real-time.


    +   - Security : This is a major concern among enterprises that are planning for
    mobility solutions. BYOD (Bring your own device) gearing up to gain attention,
    it is necessary for you to ensure security within your app solutions. You have
    crucial data stored on your central database, which can be accessed by the employees
    using their own device. In case their device crashes or is stolen, you will face
    the repercussions. It is your data that gets leaked in the process, if you have
    no provision for security. Hacking into the system through a personal device can
    make your documents vulnerable.'
  merge: -1
