    # 10.1 Uploading Files


    Upload is a term used to describe the process of transferring (sending) a file
    to another computer through a mode or network. Below are a few examples of how
    a file may be uploaded to another computer.


    Examples of an uploaded file:


    +   * **Over network**: If you are connected to a network you can upload a file
    to another computer or share using file sharing.

    * **FTP, Telnet, or SSH**: If you want to share something on the Internet, or
    have a personal web page, you would upload the files to a computer or server connected
    to the Internet. FTP is the most common method of uploading files.


    Supporting file uploads is a very basic and common requirement for many web applications.
    The Servlet 3.0 specification supports file upload out of the box, so any web
    container that implements the specification can parse multipart requests and make
    mime attachments available through the HttpServletRequest object.


    A new annotation, `javax.servlet.annotation.MultipartConfig`, is used to indicate
    that the servlet on which it is declared expects requests to use the multipart/form-data
    MIME types. Servlets are annotated with @MultipartConfig to retrieve the components
    of a given multipart/form-data by calling the `request.getPart(String name)` or
    `request.getParts()`.


    Important points:


    +   1. **FileItemFactory** is Default class for FileItem. When Apache read multipart
    content and generates FileItem, this implementation keeps file content either
    in memory or in temporary file, depending upon threshold size. Default FileItemFactory
    threshold size of 10KB and generates temporary files in temp directory, returned
    by System.getProperty("java.io.tmpdir"). Both of these values are configurable.
    You may get permission issues if user account for running Server doesn''t have
    sufficient permission to write files into temp directory.


    +   2. Choose threshold size carefully using memory usage, keeping large content
    in memory may result in `java.lang.OutOfMemory` exception, while having too small
    values may result in lots of temporary files.'
