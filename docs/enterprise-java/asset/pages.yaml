  md: '# Introduction to Enterprise JavaBeans


    (local/remote/no-interface). Message Driven Beans (also known as MDBs or Message
    Beans). MDBs also support asynchronous execution, but via a messaging paradigm.


    # 17.4.1 Session Beans


    A Session Bean is an Enterprise Bean that is generated for each session from the
    client and expires when the client ends. The lifecycle of the Session Bean does
    not exceed the range from the beginning until the end of the usage of the system
    by the user.


    # 17.4.1.1 Types of Session Beans


    There are three types of session beans:


    +   1. **Stateless Session Bean**: Stateless Session Beans are business objects
    that not have state associated with them. Access to a single bean is limited to
    only one client at a time and concurrent access to the bean is banned. In case
    concurrent access to a single bean is attempted the container simply routes each
    to a different instance. Instances of Stateless Session beans are typically pooled.
    If a second client accesses a specific bean right after a call on it by a first
    client has finished, it gets the same instance.


    *Example*: Sending an Email to customer support may be handled by a stateless
    bean since this is one off operation and not part of a multi-step process.


    +   2. **Stateful Bean**: Stateful Session Beans are business objects having state,
    they can keep track of calling which client is dealing with throughout a session
    and thus access to the bean is strictly limited to ''one client at a time''. In
    the case concurrent access to a single bean is attempted anyway the container
    serializes those requests, but via the @Timeout annotation the container can throw
    an exception instead. Stateful beans'' state may be persisted automatically by
    the container to free memory after the client has accessed the bean for some time.


    *Example*: The hotel check out may be handled by a stateful bean that would use
    its state to keep track of where the customer is in the checkout process, possibly
    holding locks on the items it is charged for.


    +   3. **Singleton Bean**: Singleton Session Beans are business objects with a
    shared state in a JVM. Concurrent access to the one and only instance instance
    can be controlled by the container or the bean itself. Container Managed concurrency
    can be tuned using the @Lock annotation, which designates a reader lock or a write
    lock will be used for a method call. Also the Singleton Bean can explicitly request
    to be instantiated when the EJB starts up, using @Startup annotation.


    *Examples*: Loading a daily price list will be the same for every user might be
    with a singleton session bean, since this will prevent the application having
    do the same query to a database over and over.


    # 17.4.2 Message Driven Beans


    Message Driven Beans are business objects whose execution is handled by the messages
    instead by method calls. Like session beans, a Message Driven Bean does not have
    any type of client view, i.e. clients cannot look up a Message Driven Bean instance.
    It listens for incoming message, or for a JMS message or topic and processes them
    automatically. Message Driven Beans can support many messaging protocols. The
    difference between session- and message beans is only in method calling and messaging.


    *Example*: Submitting a job to a work bench might be done by sending a JMS message
    to a ''message queue'' and could also be handled by a Message Driven Bean.'
