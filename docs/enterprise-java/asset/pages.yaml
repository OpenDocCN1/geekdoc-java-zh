    # 18.7 Working With Message Driven Beans


    A message-driven bean is an enterprise bean that allows Java EE applications to
    process messages asynchronously. This type of bean listener acts as a JMS message
    listener, receives JMS messages instead of events. The messages can be sent by
    any Java EE component (an application client, a web component) or by a JMS application
    or system that does not use EE technology. Message-driven beans can process JMS
    messages or other kinds of messages.


    A message-driven bean is Stateless, Server side, Transaction-aware bean used to
    process JMS messages.


    A Java client, an enterprise bean, a Java Server Pages (JSP) component, or a non-J2EE
    application may be sending the message to the destination not be aware of the
    MDBs deployed in the EJB Container. However, the message must conform to JMS specifications.'
