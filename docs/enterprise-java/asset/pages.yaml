    # A. Java Persistence API


    The Java Persistence API (JPA) defines the management of persistence and object/relational
    mapping within Java Enterprise Edition (EE) and Java Standard Edition (SE) environments.


    The Java Persistence API (JPA) represents a simplification of the persistence
    programming model. JPA manages object and relational mapping within the Java EE
    specification for Enterprise Java Beans 3.0. The JPA specification defines the
    object/relational mapping within its guidelines instead of vendor-specific mapping
    implementations. These features make applications that use JPA to implement and
    manage.


    JPA combines the best features from previous persistence mechanisms such as Java
    Database Connectivity (JDBC) APIs, Object Relational Mapping (ORM) frameworks,
    and Java Data Objects (JDO). Creating entities under JPA is as simple as Creating
    Serializable classes. JPA supports the large data sets, data consistency, concurrent
    use and query capabilities of JDBC. JPA allows the use of advanced object-oriented
    concepts such as inheritance. JPA avoids vendor-lock in because it does not rely
    on a strict specification like JDO and EJB 2.x entities.


    # B. Java Persistence API as A Specification


    The JPA specification defines the object-relational mapping, rather than relying
    on vendor-specific mapping implementations, JPA is based on the Java programming
    model that applies to Java Enterprise Edition (EE) environments, but JPA can function
    within a SE environment for testing application functions.


    The JPA specification explicitly defines the object-relational mapping, rather
    than relying on vendor-specific mapping implementations. JPA standardizes the
    important task of object-relational mapping by annotations or XML to map objects
    into one or more tables of a database. To further simplify the persistence programming
    model:


    +   - The EntityManager API can insert, retrieve, or remove objects from a database.


    +   - The EntityManager and object-relational mapping metadata handle most of
    the database operations without requiring to use JDBC or SQL code to maintain
    persistence.


    +   - JPA provides a query language, extending the independent EJB querying language
    (also known as JPQL), that you can use to retrieve objects without writing SQL
    queries specific to the database that you are working with.'
