    run on the Java EE server. Web container provides local and remote access to enterprise
    beans can be divided into session beans, entity beans, and message beans used
    by single client. Session beans represent transient objects and processes are
    typically used in a database. Message-driven beans operate asynchronously pass
    messages to application modules and services.


    # 2.3.2.2 Web Container


    A Web application runs within a Container of a Web server which is also known
    as servlet container. The Web container provides the runtime environment through
    components servlet components for Java EE applications. A Web container provides
    the same services as a JSP container. Web components and their container run on
    the Java EE server. Web server is a server which is capable of handling HTTP request
    send by a client and respond back with HTTP response.


    # 2.3.2.3 Application Client Container


    To host application components, application clients, the application client container
    is used. It runs on the client computer and it can be interacted with each other.
    It helps developers to create robust Java applications that also have access to
    Java EE resources such as data sources or EJBs. This container manages the execution
    of application client components. Application clients and their container run
    on the client. Application server can handle all application operations between
    users and databases


    # 2.3.2.4 Applet Container


