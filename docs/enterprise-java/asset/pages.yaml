    # 15.4.3 Using EL Expressions


    The following syntax identifies EL expressions within pages :


    ${ EL expression }


    When used within the attributes of tags from the JSTL, for example, you end up
    with JSP code that looks like this:


    ```

    <prefixtag attribute="${EL Expression}"/>

    ```


    When used directly within pages, you could get code like this:


    ```

    <body bgcolor="${EL Expression}">

    ```


    # 15.4.4 Literals


    A literal expression is evaluated to the text of the expression, which is of type
    String.


    If you have a literal expression that includes the reserved {} or #{} syntax,
    you need to escape these characters as follows :


    +   By creating a complex expression as shown here :

    - `${''exprA}`

    - `#{''exprB''}`


    The resulting values would be the strings ${exprA} and #{exprB}.


    +   By using the escape characters \ and \# to escape what would otherwise be
    treated as an el-expression :

    - `\${exprA}`

    - `\#{exprB\}`


    The resulting values would be the strings ${exprA} and #{exprB}.


    When a literal expression is evaluated, it can be converted to another type. The
    expression language has the following basic types that can be used for literal
    values :


    +   - String : This is a value defined within double or single quotes.

    - Boolean : Like Java, this type has only possible values of true and false.

    - Integer : This type represents integral numbers. It is implemented as a Java
    long.

    - Null : This is the same as the Java null. The literal value for this is null.


    The table contains example EL expressions with literals and the result of evaluating
    them.


    | EL Expression | Result |

    | $1 > (8/4) | false |

    | $6.0 >= 5 | true |

    | $100.0 == 10 | true |

    | $(7*7) ne 49 | false |

    | $''y'' < ''z'' | true |'
