    # # CHAPTER 6 UNIT - I


    # # WORKING WITH DATABASES


    # 6.1 What Is JDBC?


    The JDBC is a Java API for executing SQL statements and supports basic SQL functionality.
    The JDBC (Java Database Connectivity) is an API that defines interfaces and classes
    for writing database applications in Java by making database connections. It is
    a program designed to access many popular database products on a number of operating
    system platforms. Using JDBC we can send SQL, PL/SQL statements to almost any
    relational database. There JDBC RDBMS access by allowing us to embed SQL inside
    Java code.


    # ### 6.1.1 JDBC Driver


    The JDBC API defines the interfaces and classes that programmers use to connect
    to databases and send queries. A JDBC driver implements these interfaces and classes
    for a particular DBMS vendor. The JDBC driver converts JDBC calls into a network
    or database protocol into a database library API that makes communication with
    the database. In the case of any back-end database change, we only need to replace
    the JDBC driver & some code modifications are required. "The program that uses
    the JDBC API loads the specified driver for a particular DBMS before it connects
    to a database. After that the JDBC DriverManager then sends all JDBC API calls
    to the loaded driver".


    There are four types of JDBC drivers as follows


    +   1. Type 1- JDBC-ODBC Bridge ODBC driver


    This driver converts JDBC API into Microsoft Open Database Connectivity (ODBC)
    calls that are then passed to the ODBC driver. The ODBC binary code must be loaded
    on every client computer that uses this type of driver.


    # Advantage


    The JDBC-ODBC Bridge allows access to any database, since the database''s ODBC
    drivers are already available.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_62_0.png)


    Type 1 : JDBC-ODBC Bridge'
