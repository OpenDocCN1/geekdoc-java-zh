  md: '# CHAPTER 15


    # UNIT - III


    # IMPLICIT OBJECTS,

    SCOPE AND EL EXPRESSIONS


    # 15.1 Implicit Objects


    JSP provides Implicit Objects that are the Java objects whom JSP Container makes
    available to developers in each page and developer can call them directly without
    being explicitly declared. JSP Implicit Objects are also called predefined variables.


    # 15.1.1 The Request Object


    The request object is an instance of a javax.servlet.HttpServletRequest. Each
    time a client requests a page the JSP engine creates a new HttpServlet object
    to represent that request. Following sections gives information about important
    methods of request object. For details refer Javadoc.


    +   1. Cookie [] getCookies() : This method returns an array containing all of
    the Cookie objects sent with this request.

    2. Enumeration getAttributeNames() : This method returns an Enumeration containing
    the names of the attributes available to this request.

    3. Object getAttribute(String name) : This method returns the value of the named
    attribute as an object, or null if no attribute exists.

    4. Enumeration getParameterNames() : This method returns an Enumeration of String
    objects containing the names of the parameters contained in request.

    5. String [] getParameterValues(String name) : This method returns an array of
    String objects containing all of the given request parameter has, or null if the
    parameter does not exist.

    6. HttpSession getSession() : This method returns the current session associated
    with this, or if the request does not have a session, creates one.

    7. Locale getLocale() : This method returns the preferred Locale that the client
    will accept in, based on the Accept-Language header

    8. ServletInputStream getInputStream() : This method retrieves the body of the
    request as binary using a ServletInputStream.

    9. String getCharacterEncoding() : This method returns the name of the character
    encoding used in the body of this request.

    10. String getContentType() : This method returns the MIME type of the body of
    the request, or null if the type is not known.'
