    # 22.7 Hibernate.cfg.xml


    Hibernate requires to know in advance that, where to find the mapping information
    that defines your Java classes relate to the database tables. Hibernate also requires
    a set of configuration settings related to database and other related parameters.
    All such information is usually supplied as a standard Java properties file hibernate.properties,
    or as an XML file named hibernate.cfg.xml.


    We will consider XML formatted hibernate.cfg.xml to specify required Hibernate
    properties in following example. Most of the properties have their default values
    and it is not required to specify them in the property file unless it is really.
    This file is kept in the root directory of your application''s classpath.


    We will be required to configure for a databases in a standalone situation following
    properties


    +   - hibernate.dialect: This property makes Hibernate generate the appropriate
    SQL for the chosen database.


    +   - hibernate.connection.driver_class: The JDBC driver class.


    +   - hibernate.connection.url: The JDBC URL to the database instance.


    +   - hibernate.connection.username: The database username.


    +   - hibernate.connection.password: The database password.


    +   - hibernate.connection.pool_size: The number of connections waiting in the
    Hibernate database connection pool.


    +   - hibernate.connection.autocommit: Allows autocommit mode to be used for the
    JDBC connection.


    If you are using a database along an application server and JNDI, then you would
    have to configure the following properties


    +   - hibernate.connection.datasource : The JNDI name defined in the application
    server context, which you are using for the application.


    +   - hibernate.jndi.class : The InitialContext class for JNDI.


    +   - hibernate.jndi.<JndipropertyName> : Passes any JNDI property to you to the
    JNDI InitialContext.


    +   - hibernate.connection.url : Provides the URL for JNDI.


    +   - hibernate.connection.password : The database password.


