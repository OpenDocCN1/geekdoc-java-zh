  md: '# 3.6.4 Servlet Container


    Servlet execution is managed by a Servlet container. The Servlet container and
    the Web server/Application server provide the HTTP interface to the world. It
    is also possible for a Servlet container to stand alone or even run on another
    host than the web server. When a request is received by the Servlet container,
    it decides which Servlet to call in according to configuration file.


    The Servlet Container calls the service() method and passes an instance of HttpServletRequest
    and ServletResponse. Depending on the method (GET or POST), it calls doGet() or
    doPost(). The Servlet container is responsible for loading and instantiating the
