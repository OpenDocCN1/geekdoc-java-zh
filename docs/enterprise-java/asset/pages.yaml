    request header as a String.


    +   13. String getMethod() : This method returns the name of the HTTP method with
    which this request was made, for example, GET, POST, or PUT.


    +   14. String getParameter(String name) : This method returns the value of a
    request as a String, or null if the parameter does not exist.


