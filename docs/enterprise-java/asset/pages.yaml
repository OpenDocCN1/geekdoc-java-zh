    \ This pattern is used at side to invoke the servlet.\n\n# 5.6 Using Annotations\
    \ Instead of Deployment Descriptor\n\nThe deployment descriptor is a separate\
    \ file where you set configuration values in XML format, where the annotation\
    \ is directly embedded in your source code. Use annotations if you prefer to rely\
    \ on code and configuration at the same place for better readability. Deployment\
    \ descriptors are the exact opposite — you separate code and configuration. You\
    \ do not need to recompile the entire project if you want to change a single configuration\
    \ value.\n\nFor Java Enterprise components there are both versions - annotation\
    \ or descriptor. Both can be configured either with annotations or via the deployment\
    \ descriptor. In case of Servlets you can choose one or the other.\n\n**Do we\
    \ need xml when we use annotations?**\n\nYou can entirely drop web.xml file if\
    \ you choose to rely on annotations for all of your Servlet configurations. But\
    \ we still encourage you to keep that file, or at least have one like shown in\
    \ the example above. Web.xml is used for many other configurations, so you will\
    \ need sooner or later in your projects. Following code shows simple demonstration\
    \ of using annotation in servlet file.\n\n```\npackage net.io.tushar;\nimport\
    \ java.io.IOException;\nimport javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\n@WebServlet(\"hello\")\npublic\
    \ class ServletWithAnnotations extends HttpServlet {\n    private static long\
