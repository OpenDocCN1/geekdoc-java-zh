    # 9.1.3 Lifecycle of HTTP Session


    Most servlet use a cookie to identify a session.


    +   1. The user''s browser requests a servlet.

    2. The servlet creates a session.

    3. The servlet gives the session a unique ID.

    4. The servlet sets a cookie in this browser with ID.

    5. Let''s say the servlet stores the user''s name in the session.

    6. The user requests another servlet on the same server. As part of the request,
    the cookie with session ID is sent back to the server.

    7. Since the servlet container is told which session to use, it may make it again.

    8. So servlet #2 retrieves the user''s name, since we put it in the session, and
    say, "Hi, Tushar."

    9. The user close the browser without ending session.

    10. After 30 minutes web server expires the session.


    # 9.1.4 Session Management Rules


    Session typically has the following characteristics :


    +   - Session represents a conversation between client and server.

    - Information or state must be stored.

    - Session must execute on behalf of single client. They cannot be shared by more
    than one client at the time.

    - Each HTTP request must carry an identifier.

    - Can be both transaction-aware and use security.

    - Use an up-to-date web-server framework to generate and manage the session identifier
    token, as this will guarantee values that defy prediction.

    - Take every precaution to ensure that the session remains confidential to the
    application.

    - Session needs to have a timeout.


    # 9.2 Session Tracking With Servlet API


    Session tracking is a mechanism that servlets use to maintain state about a series
    of requests from the user (that is, requests originating from the same browser)
    across some period of time. Sessions are shared among the servlets used by a client.
    This is convenient for applications made of multiple servlets.


    The javax.servlet package contains a number of classes and interfaces that define
    and describe the contents of a servlet class running under the HTTP protocol and
    the runtime environment provided for an instance of a class by a conforming servlet
    container.


    The interface HttpServlet provides a way to identify a user across more than one
    page request or to visit a site and to store information about that user.


    The servlet container uses this interface to create a session between an HTTP
    client and an HTTP server. The session persists for a specified time, across more
    than one connection or page request from the user. A session usually corresponds
    to one user, who may visit many sites times. The server can maintain a session
    in many ways such as using cookies or rewriting URLs.'
