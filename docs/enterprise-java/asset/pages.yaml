    \ into each method in detail.\n\n# 4.6.1 init()\n\nThis method is called once\
    \ for a Servlet instance. When first time Servlet is called, Servlet container\
    \ creates instance of that Servlet and loaded into the memory. Future requests\
    \ will be served by the same instance without creating the new instance. init()\
    \ method is used for initializing Servlet variables which are required to be passed\
    \ from the deployment descriptor web.xml. The ServletConfig is passed as the parameter\
    \ to init() method stores all the values configured in the web.xml.\n\n**Why not\
    \ use a constructor instead of init?**\n\nThe init() method is typically used\
    \ to perform servlet initialization--creating or loading objects that are used\
    \ by the servlet in the handling of its requests. Why not use a constructor instead?\
    \ Well, in JDK 1.0 (for which servlets were originally written), constructors\
    \ for dynamically loaded Java classes (such as servlets) couldn't accept"
