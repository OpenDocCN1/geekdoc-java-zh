    # 22.1 What is Hibernate?


    Hibernate is an open source object/relational mapping tool for Java. It provides
    help for mapping from Java classes to database tables; it significantly reduce
    development time otherwise with manual data handling in SQL and JDBC. Hibernate
    is most useful with object-oriented domain modes and business logic in the Java-based
    middle-tier. It allows transparent persistence that enables the applications switch
    to any database. Hibernate can be used in Java Swing applications, Java Servlet-based
    applications, or JEE applications using EJB session beans. Hibernate is used by
    every developer from 90 to 95 percent of common data persistence related tasks.


    Hibernate allows us develop classes using common Java language, including association,
    inheritance, polymorphism, composition and the Java collections framework. Hibernate
    is Free Software. Hibernate is freely available to download and is licensed under
    the open source GNU General Public License (LGPL) at http://www.hibernate.org/.


    Features


    +   - Hibernate is Free Resource.


    +   - Hibernate provides full-featured queries as Hibernate Query Language, Query
    API, and native SQL dialect of the database.


    +   - It Filters for working with historical, regional or permissible data.


    +   - It provides full support for projection/aggregation and sum selects.


    +   - Hibernate allows Runtime performance monitoring using JMX or local Java
    API.


    +   - Hibernate reduces the development timings as it supports inheritance, polymorphism,
    composition and the Java Collection framework.


    +   - Hibernate supports the automatic generation of primary key for our data
    application.


    +   - Hibernate3 will support all four operations as methods of the Session interface.


    +   - Hibernate''s XML binding enables data to be represented as XML and POJOs
    interchangeably.


    +   - Hibernate support EJB 3.x specification for POJO persistence and annotations.'
