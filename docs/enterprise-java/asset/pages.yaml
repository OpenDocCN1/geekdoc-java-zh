    # 19.9.2 JNDI Namespace in Java EE 7


    Three JNDI namespaces are used for JNDI lookups: java:global, java:module, and
    java:app:


    +   1. The java:module JNDI Namespace

    The:module namespace is used to lookup local enterprise beans within the same
    module. JNDI addresses are of the form : java:module/enterprise beanName|InterfaceName

    The interface name is only required if the enterprise bean implements more than
    one business interface.

    2. The java:app JNDI Namespace

    The java:app namespace is used to lookup local enterprise beans packaged within
    the same application. That is, the enterprise bean is packaged within an EAR file
    containing multiple Java EE modules. JNDI addresses are of the form : java:app/interface
    name

    The module name is only required if the enterprise bean implements more than one
    business interface.

    3. The java:global JNDI Namespace

    The java:global namespace is the portable way of finding enterprise beans using
    JNDI lookups. JNDI addresses are of the form : java:global/application/module/enterprise
    bean name/interface name

    Application name and module name default to the name of the application minus
    the file extension. Application names are only required if the application is
    packaged within an EAR. The interface name is only required if the enterprise
    bean implements more than one business interface.


