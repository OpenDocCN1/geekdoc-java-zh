  md: '6. _jspService() : execution : This method is called for every request of JSP
    during its life cycle. This is where it serves the purpose of creation. It has
    to pass through all the above steps to reach this phase. It passes the request
    and the response objects, _jspService() method cannot be overridden.


    7. jspDestroy() execution : This method is called when this JSP page is destroyed.
    With this the Servlet serves its purpose and submits itself to garbage collection.
    This is the end of JSP life cycle.


    # 12.5 HOW DOES A JSP FUNCTION?


    The web server needs a JSP engine, a container to process JSP pages. The Web container
    is responsible for intercepting requests for JSP pages.


    A JSP container works with the Web server to provide the runtime environment and
    other services a JSP needs. It knows how to understand the special elements that
    are part of JSPs. Following diagram shows the position of JSP container and JSP
    files in a Web application.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_99_0.png)


    # 12.6 How Does JSP Execute?


    The following steps explain how the web server creates the Webpage using JSP :


    +   * As a normal page, your browser sends an HTTP request to the web server.

    * The web server recognizes that the HTTP request is for a JSP page and forwards
    it to a JSP engine. This is done by using the URL or JSP page which ends with
    .jsp instead of .html.

    * The JSP engine loads the JSP page from disk and converts it into a servlet.
    This conversion is very simple in all template text is converted to println()
    statements and all JSP elements are converted to Java code. This code implements
    the corresponding behaviour of the page.

    * The JSP engine compiles the servlet into an executable class and forwards the
    original request to a servlet engine.

    * A part of the web server calls the servlet engine loads the Servlet class and
    executes it. During execution, the servlet produces an output in HTML format.'
