    # 2.2 Java EE Server


    A Java EE server is a server application that implements the Java EE platform
    APIs and provides standard Java EE services. Java EE servers are sometimes called
    application servers, because they allow you to serve application data to clients,
    as web servers serve web pages to browsers. Java EE servers handle several component
    types that correspond to the tiers in a multi-tiered application. The Java EE
    server provides these services to components the underlying services in the form
    of a container for every component type. Because you do not have to develop these
    servers yourself, you are free to concentrate on solving the business problems
    at.


    # 2.3 Java EE Containers


    Java EE containers are the interface between the component and the lower-level
    functionality provided by the platform to support that component. The functionality
    of the container is defined by the platform and is different for each component
    type. Nonetheless, the server allows the different component types to work together
    to provide functionality in an enterprise application.


    Normally, client multi-tiered applications are hard to write because involve many
    lines of code to handle transaction and state management, multithreading, resource
    pooling, and other complex low-level details. The component-based and platform-independent
    Java EE architecture makes Java EE applications easy to write because logic is
    organized into reusable components.


    # 2.3.1 Container Services


    Containers are the interface between a component and the low-level platform-specific
    functionality that supports the component. Before a web, bean, enterprise, or
    application client component can be executed, it must be assembled into a Java
    EE module and deployed into its container.


    The assembly process involves specifying container settings for each component
    in the Java EE application and for the Java EE application itself. The underlying
    support provided by the Java EE server, including services as security, transaction
    management, Java Naming and Directory Interface (JNDI) lookups, and remote connectivity.
    Here are some of the highlights:


    +   - The Java EE security model configures you web component or enterprise bean
    that system resources are accessed only by authorized users.


    +   - The Java EE transaction model lets you specify relationships among methods
