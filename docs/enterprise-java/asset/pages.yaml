  md: '# 22.2 Why Hibernate?


    The reasons for choosing Hibernate as our application development framework are
    as follows :


    +   1. Hibernate is absolutely free with license.

    2. It eliminates need for repetitive SQL.

    3. It works with classes and objects instead of queries and result sets.

    4. It largely uses Object oriented features than procedural features for coding.

    5. Hibernate mapping approach can oppose changes in object/data model easily.

    6. Hibernate provides strong support for caching.

    7. It handles all create-read-update-delete operations using simple API without
    using separate SQL.

    8. It generates DDL scripts to create DB schema ex. tables, constraints, sequences.

    9. Hibernate framework provides portability across maximum type of databases.

    10. It supports over RDBMS; change the database by alteration configuration files.

    11. It supports Connection pooling.

    12. Using all above features reduces the development time.


