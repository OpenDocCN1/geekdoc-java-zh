  md: '# Javaserver Pages Standard Tag Libraries


    The param tag, analogous to the JSP:param tag, can be used with import to specify
    request parameters.


    You can use the url tag to rewrite URLs returned from a JSP page. The tag includes
    the session ID in the URL only if cookies are disabled; otherwise, the URL unchanged.
    Note that this feature requires the URL to be relative. The url tag takes subtags
    to include parameters in the returned URL.


    ```

    <c var="url" value="catalog">

    <c:param name="Add" value="[bookId]" />

    </c>

    ```


    <p><strong><a href="#{url}"></a></strong></p>


    The redirect tag sends an HTTP redirect to the client. The redirect tag takes
    param tags for including parameters in the returned URL


    # 16.4.6 The XML Tag Library


    The JSTL XML tags are used for providing a JSP-centric way of manipulating and
    creating documents.

    The xml tags provide flow control, transformation etc. The url for the xml tags
    is http://java.sun.com/jsp/jst/xml and prefix is x. The JSTL XML library has custom
    tags used for interacting with XML data. The syntax for including JSTL XML libraries
    in your JSP is


    ```

    <%@taglib uri="http://java.sun.com/jsp/jst/xml" prefix="x" %>

    ```


    # 16.4.6.1 Core Actions


    There are three XML actions, being <xset> which allows us to set an attribute
    within any scope, <out> which evaluates an XPath expression and outputs the result
    of the evaluation to the current JspWriter object and <xparse> which allows us
    to parse an XML document.


    +   1. What is XPath?


    An XPath expression generally defines a pattern in order to select a set of nodes.
    These patterns are used by XSLT to perform transformations or by XPointer for
    addressing purpose. XPath specification specifies types of nodes which can be
    the output of execution of the XPath expression. XPath uses a path to select list
    of nodes from an XML document.


    The XML tags use as a local expression language; XPath expressions are always
    specified using attribute select. This means that only values for selected attributes
    are evaluated using the rules associated with the global expression language.


    The following table shows the scopes available within an XPath expression to access
    web application data, are mapped in the same way as their EL Implicit counters:


    | Expression | Mapping |

    | $foo | pageContext.findAttribute("foo") |

    | $param:foo | request.getParameter("foo") |

    | $header:foo | request.getHeader("foo") |

    | $cookie:foo | Maps to cookie values for foo |'
