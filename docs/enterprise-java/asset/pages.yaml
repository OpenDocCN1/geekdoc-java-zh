    Interceptors can be defined in Java as a method interceptor or a class interceptor.
    The preferred way to define in Java is by using meta-data annotations. They can
    be defined in the application descriptor as well, but in case they are not portable
    across Java EE servers. Some of the meta-data annotations in the javax.interceptor
    package are : @AroundInvoke, @AroundTimeout, @PostConstruct and @PreDestroy.


    An AroundInvoke method can be defined on


    +   - Enterprise Bean Class


    +   - Interceptor class (Normal Java class without any inheritance).


    # 19.4 AroundInvoke Method


    An AroundInvoke method can be defined by either of the following :


    +   - Annotating the method with an @AroundInvoke annotation [recommended].


    +   - Using an element in bean''s deployment descriptor.


    An AroundInvoke method must satisfy the following requirements :


    +   - One AroundInvoke is allowed for each class.


    +   - It must have a public constructor.


    +   - It must accept a javax.inter.InvocationContext object as argument and return
    a java.lang.Object object.


    +   - It can throw any application exception that is specified in the business
    interface or any runtime exception.


    +   - It can be declared private, package private, or protected.


    # 19.5 Life Cycle of Interceptor


    The lifecycle of an interceptor instance is the same as that of the bean with
    it is associated. When the bean is created, interceptors are created for each
    interceptor class defined for the bean. These interceptor instances are destroyed
    when the bean is removed. In case of interceptors associated with session bean,
    the interceptor instances are pass upon bean passivation, and activated when the
    bean is activated.


    Both the interceptor instance and the bean instance are created or activated before
    any of the PostConstruct or PostActivate callbacks are invoked.


    Any PreDestroy and PrePassivate callbacks are invoked before the respective destruction
    or passivation of either the bean or interceptor instance.


    An interceptor instance may hold state. An interceptor may be the target of dependency
    injection. Dependency injection is performed when the interceptor instance is
    created, using the naming context of the associated enterprise bean.


    The PostConstruct interceptor callback method is invoked after this dependency
    injection has taken place on both the interceptor instances and the bean instance.


    Interceptors can invoke JNDI, JDBC, JMS, other enterprise beans, and the EntityManager.'
