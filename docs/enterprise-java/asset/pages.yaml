    # 9.2.3 Secure Layer (SSL)


    SSL (Secure Sockets Layer) is a standard security protocol for establishing encrypted
    links between a web server and a browser in an online communication. The usage
    of SSL technology ensures that all data transmitted between the web server and
    browser remains encrypted.


    The SSL protocol was originally developed by Netscape, to ensure security of data
    transported and routed through HTTP, LDAP or POP3 application layers. SSL is designed
    to use TCP as a communication layer to provide a reliable end-to-end and authenticated
    connection between two points over a network such as SSL client and the server.


    When an Internet user visits a web site, an SSL certificate provides identification
    information about the web server and establishes an encrypted connection. This
    process happens in a fraction of a second.


    +   1. A browser attempts to connect to a web site secured with SSL. The browser
    requests that the web server identify itself.

    2. The server sends the browser a copy of its SSL certificate.

    3. The browser checks whether it trusts the SSL certificate. If so, it sends a
    message to the server.

    4. The server sends back a digitally signed acknowledgement to start an SSL encrypted
    session.

    5. Encrypted data is shared between the browser and the server.


    # 9.2.4 Working with Sessions


    Without session management, each time a client makes a request to a server, it''s
    a new user from the server''s point of view. A session refers to the entire interaction
    between a client and a server from the time of the client''s first request, which
    generally begins the session, to the time the session is terminated. The session
    could be terminated by the client''s request, or the server could automatically
    close it after a period of time. Default technique for session tracking is to
    use cookies. Cookies are sent in the header part of an HTTP message, so they must
    be set in the response prior to writing any data to the response.'
