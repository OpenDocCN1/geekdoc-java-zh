    # 6.2.2 Using Savepoints


    The Savepoint interface is new facility in JDBC 3.0 API. It gives additional transactional
    control. When we set a savepoint we define a logical rollback point within a transaction.
    If an error occurs then only the changes made after the savepoint.


    The Connection object has two methods that use to manage savepoints :


    +   * setSavepoint(String savepointName) : This method defines a new savepoint.
    It also returns a Savepoint object.

    * releaseSavepoint(Savepoint savepointName) : This method deletes a savepoint.
    Notice that it requires a Savepoint object as a parameter. This is usually a savepoint
    generated by the setSavepoint() method.


    There is one rollback (String savepointName) method which rolls back work to the
    specified by the savepoint.


