  md: '# Enterprise Java (T.B.S.-I.T.) (Sem.-V)


    There are two methods exist : RequestDispatcher include() and RequestDispatcher
    forward().


    # 7.2.1 Include ()


    The include(ServletRequest request, ServletResponse response) method includes
    the content of a resource in the response. In essence, this enables programmatic
    server-side includes. The ServletRequest object has its elements and parameters
    unchanged from the caller''s called servlet cannot change the response status
    code or set headers; any attempt to make a change is ignored.


    The request and response parameters must be either the same objects as passed
    to the calling servlet''s service or subclasses of the ServletRequestWrapper or
    ServletResponseWrapper classes that wrap them.


    # 7.2.2 forward ()


    The forward(ServletRequest request, ServletResponse response) method forwards
    a request from one servlet to another component (servlet/JSP file/HTML file) on
    the server. This method allows one servlet to do preinary processing of a request
    and another to generate the response.


    The forward () method should be called before the response has been committed
    to the client (before response output has been flushed). If the response has already
    been committed, this method throws an IllegalStateException. Uncommitted output
    in the response buffer is cleared before the forward.


    The request and response parameters must be either the same objects as passed
    to the calling servlet''s service or subclasses of the ServletRequestWrapper or
    ServletResponseWrapperclasses that wrap them.


    # 7.2.3 Difference between forward() vs include() method


    To understand the difference between these two methods, let''s take an example:
    Suppose you have two pages X and Y. In page X you have an include tag, this means
    that the control will be in the page X it encounters include tag, after the control
    will be transferred to page Y. At the end of the processing of page Y, the control
    will return to page X starting just after the include tag and in X till the end.


    In this case the final response to the client will be sent by page X.


    Now, we are taking the same pages X and Y. In page X, we have forward tag. This
    the control will be in page X it encounters forward, after this control will be
    transferred to page Y. The main difference here is that the control will not return
    back to X, it will be in page Y till the end of it.


    In this case the response to the client will be sent by page Y.


    # 7.2.4 RequestDispatcher Application


    * Note The application demonstration using RequestDispatcher interface is covered
    in this book in the practical section.


    # QUESTIONS


    +   1. What is RequestDispatcher interface? How to obtain object implementing
    it?

    2. Explain methods of RequestDispatcher interface.

    3. What is difference between difference between forward() vs include() method?'
