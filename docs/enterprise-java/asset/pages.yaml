    **Rapid Development**: As a Java technology, Servlets have access to the rich
    Java library that will help speed up the development process.

    **Performance**: The performance of Servlet is better than CGI because there is
    no process creation for each client request. Instead, each is handled by the Servlet
    container. After a Servlet is finishing a request, it stays resident in memory,
    waiting for another.

    **Portability**: Servlet applications are portable. We can move them to other
    operating systems without any problem.

    **Robustness**: Servlets are managed by the Java Virtual Machine. We don''t need
    to worry about memory leak or garbage collection, which helps us write robust
    applications.

