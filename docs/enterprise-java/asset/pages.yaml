  md: '# 13.3 JSP Elements


    JSP elements are divided into categories as follows :


    # 13.3.1 Directives


    JSP directives are JSP elements that send messages to the JSP container. Directives
    affect the overall structure of the Servlet generated from the JSP page. JSP directives
    do not produce any output to the generated document. The general format of a JSP
    directive is :


    ```

    <% directiveType attributes %>

    ```


    The first word, directive, is one of three values: page, type, and taglib. The
    second word, attribute, is one or more name-value pairs; the name part is the
    name of the attribute relevant to the directive type and the value is a quoted
    string relevant to the attribute.


    # 13.3.1.1 The page Directive


    Using the page directive, we can instruct the Servlet to import classes, define
    a general error reporting page, or set a content type. We can code one or more
    directives in our JSP page. The exception is that we may code more than one import
    attribute. We may code page directives anywhere in our JSP page. The page directive
    follows the general form shown below :


    page is coded at the top of the JSP page. The page directive specifies attributes
    for the page; all the attributes are optional which are shown in bold with default
    values


    ```

    <%@ language="java"

    extxtends="package.class"

    import="package.class,.*, ..."

    session="true | default=zekb"

    autoFlush="true | false"

    isThreadSafe="true | false"

    info="Simple JSP"

    isisErrorPage="true | false"

    errorPage="Err.JSP"

    contentType="TYPE" | TYPE; charset=text/html; charset=ISO-8859-1"

    pageEncoding="default"

    isElIgnored="true | false"

    %>

    ```


    The attributes supported by page directives with their purpose :


    +   * Buffer : Specifies a buffering mechanism for the output stream.

    * autoFlush : Controls the behaviour of the servlet output buffer.

    * contentType : Defines the encoding scheme.

    * errorPage : Defines the URL of another JSP that reports on Java unchecked runtime
    exceptions.

    * isErrorPage : Indicates if this JSP page is a URL specified by another JSP page''s
    errorPage attribute.'
  merge: -1
  pgno: 102
