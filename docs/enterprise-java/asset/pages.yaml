    # SESSION


    # 9.1 What Are Sessions?


    HTTP protocol and Web Servers are stateless, what it means is for web server every
    request is a new request to process and can''t identify if it''s coming from client
    that has been sending request previously.


    But in we applications, we should know who the client is and process the request
    accordingly. For example, a shopping cart application know who is sending the
    request to add an item and in which the cart has to be added or by sending checkout
    request so that it can change the amount to correct client.


    The Session is a conversational state between client and server. It consists of
    multiple request and response between client and server. Since HTTP and Web Server
    both are stateless, the only way to maintain a session is when unique information
    about the session (session id) is passed between server and client in every request
    and response.


    A session is a group of user interactions with your website that take place within
    a given time frame. For example a single session can contain multiple page views,
    events, social interactions, and ecommerce transactions.


    The Session simply means a particular interval of time. Session Tracking is a
    way to maintain state (data) of a user. We need to maintain the state of the user
    to recognize to particular user.


    Session comes in two types :


    +   1. Stateful session : It creates a channel between client and server, session
    will be closed if any one of the end gets disturbed. And they need to re-authenticate
    to continue their process. Example: SSH, FTP, Telnet etc


    +   2. Stateless session : Once the user is authenticated it maintains a token
    to the further process, so there is no need to maintain any channel between client
    and server, the client needs to re-authenticate if the session is lost or expired.
    Example: http protocol, all web based application.


    There are several ways through which we can provide unique identifier in request
    and response.


    +   3. User Authentication : With this approach user can provide authentication
    credentials from the login page and then we can pass the authentication'
