  md: '# 15.1.7 The pageContext Object


    The pageContext object is an instance of a javax.servlet.JSP.PageContext object.
    The pageContext object is used to represent the entire JSP page. This object is
    used to access information about the page while avoiding the implementation details.
    This object stores references to the request and response objects for each request.
    The application, config, session, and out are derived by accessing attributes
    of this object. The pageContext object also contains information about the directives
    used to the JSP page, including the buffering information, errorURL, and page
    scope.


    The PageContext class defines several fields, including PAGE_SCOPE, REQUEST_SCOPE,
    SESSION_SCOPE, and APPLICATION_SCOPE, which identify the four scopes.


    The important method of pageContext is removeAttribute(), which accepts one or
    two arguments. For example, pageContext.removeAttribute("attrName") removes the
    attribute from all scopes, while the following only removes it from the page scope:


    ```

    pageContext.removeAttribute("attrName", PAGE_SCOPE);

    ```


    # 15.1.8 The page Object


    The JSP implicit object is an instance of the java.lang.Object class. This object
    is an representation of the entire JSP page. This page has a page scope and is
    an instance of the JSP''s Servlet class that processes the current request. Page
    object represents the current page that is used to call the methods defined by
    the translated servlet. The page is a direct synonym for the "this" object. It
    is not advisable to use this page implicit object if it consumes large memory.


    # 15.1.9 The Exception object


    The exception is normally used to generate an appropriate response to the error
    condition. When we are writing JSP code, a programmer may make coding errors which
    can occur at any part of the code. We can have following type of errors in our
    JSP code:


    +   1. Checked exceptions: A checked exception is an exception that is normally
    a user error or a problem that is not known by the programmer. For example, if
    a file is to be opened, but the file cannot be found, an exception occurs. These
    exceptions cannot simply be ignored at the time of compilation.

    2. Runtime exceptions: A runtime exception is an exception that probably can be
    avoided by the programmer. As to checked exceptions, runtime exceptions are ignored
    at the time of compilation.

    3. Errors: These are not exceptions, but problems that occur beyond the control
    of the user or programmer. Errors are typically ignored in our code because we
    can rarely do anything about an error. For example, if a stack overflow occurs,
    an error will be raised occur. They are also ignored at the time of compilation.


    # Methods


