  md: '# CHAPTER 16


    # UNIT - III


    # JAVASERVER PAGES STANDARD TAG LIBRARIES


    # 16.1 Introduction


    The JavaServer Pages Standard Tag Library (JSTL) encapsulates core functionality
    to many JSP applications. For example, instead of iterating lists using a scriptlet
    or different iteration tags from numerous vendors, JSTL defines a standard tag
    that works the same everywhere. This standardization lets you learn a single tag
    and use it on multiple JSP containers. Also, when tags are standard, containers
    can optimize their implementation.


    JSTL has support for common, structural tasks such as iteration and conditionals,
    for manipulating XML documents, internationalization tags, and tags for accessing
    databases using SQL. JSTL also introduces the concept of an expression language
    to simplify page development. JSTL also provides a framework for integrating tag
    libraries with JSTL is composed of:


    +   - An expression language

    - Standard Action Validators (42 actions in four libraries)

    - Tag Library Validators (2 validators)


    # 16.2 What is Wrong in Using Jscript Tags?


    JSP (Java Server Pages) technology provides a simplified, fast way to create the
    dynamic view for the web application. It enables the rapid development of web
    applications that are server- platform independent. But, in real life, the JSP
    technology is to be used only for the view of your web applications. All the business
    logic and the calculation must be done on the servlets or Business layers in your
    application.


    The scriptlet tags by JSP technology should not be used to embed your business
    logic and rendering the view. This is because of the following disadvantages:


    +   - No Code Reusability : Using the scriptlet tags on JSP reduces the code reusability
    as if so then will be bound to scriptlet tags.

    - Poor structure of JSP page : Scriptlet tags if used on JSP page for view management
    results in a structure of code that is difficult to understand and interpret.'
