  md: '# CHAPTER 8


    # UNIT - II COOKIES


    # 8.1 Introduction


    Cookies are very small text files placed on your computer by a web server when
    you view some sites online (not all web sites place cookies). They''re used to
    store data about you and your preferences so that a web server doesn''t have to
    repeat this information, potentially slowing down load time.


    Cookies are commonly used to store personal needs and, your name, the contents
    of a shopping cart, your preferred layout for a web page, map what you might be
    looking at, and so on. Cookies make it easy for web servers to personalize information
    to fit your specific needs and preferences when you''re visiting a web site.


    Cookies may also be called a web cookie, Internet cookie, browser cookie or HTTP
    cookie.


    The main purpose of a cookie is to identify users and possibly prepare customized
    web pages for them. When you enter a website using cookies, you may be asked to
    fill out a form providing such information as your name and interests. This information
    is packed into a cookie and sent to your browser which stores it for later. The
    next time you go to the same website, your browser will send the cookie to the
    server. The server can use this information to present you with custom pages.
    For instance, instead of sending a generic page you might see a page that welcomes
    you by name or shows when you last visited the site.


    A cookie will typically contain a string of text with information about the browser.
    Some websites use cookies to store more personal information about you, however,
    this can be done only if you provide that information.


    Cookies have parameters that can be passed to them :


    +   * The name & the value of the cookie.

    * The expiration date of the cookie : This determines how long the cookie will
    remain active in your browser.

    * The path the cookie is valid for : Web pages outside of that path cannot use
    the cookie.

    * The domain the cookie is valid for : This makes the cookie accessible to pages
    on any of the servers in a domain.'
