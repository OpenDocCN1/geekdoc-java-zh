    # 6.2 JDBC - Transactions


    By default JDBC Connection is in auto commit mode and then every SQL statement

    committed to the database upon its completion. That may be good for some applications,

    but there are three reasons we want to turn off auto-commit and manage our own

    transactions:


    +   * To increase performance.

    * To maintain the integrity of business processes.

    * To use distributed transactions.


    Transactions enable us to control when the changes are applied to the database.

    t treats a single SQL statement or a group of SQL statements as one logical unit,
    and if any

    statement fails, the whole transaction fails.


    To enable manual transaction support instead of the auto commit mode use the

    Connection object''s setCommit() method. If we pass a boolean false to

    setAutoCommit(), Turn off auto commit. We can pass a boolean true to turn it back

    again.


    Example :conn.setAutoCommit(false);'
