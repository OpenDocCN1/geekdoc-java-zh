    # 15.4.5 Operators


    The EL has a comprehensive set of operators as you might expect. We will explore
    these in this section. As you''ll see, many of them are the same as those found
    in the Java Programming language. The main difference, however, is that for many
    operators there is a textual equivalent.


    # 15.4.5.1 Arithmetic Operators


    There are the expected operators: +, -, *, /, %. You can also use the following
    for the / & operators: div and mod. Here are some basic Operations :


    ```

    <p>Now for some math:<br>

    6 + 7 = ${6+7}<br>

    8 x 9 = ${8^9}<br>

    ```


    # 15.4.5.2 Logical Operators


    The logical operators are the same as the Java Programming Language, but they
    also have their textual equivalents within the EL.


    | Symbol Version | Text Version |

    |---|---|

    | && | and |

    | || | or |

    | ! | not |'
