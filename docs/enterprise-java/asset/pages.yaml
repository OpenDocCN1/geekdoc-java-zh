  md: '166 Enterprise Java (T.Y.B.Sc.-I.T.) (Sem.-W)


    Before MDBs were introduced, JMS described a classical approach to implement asynchronous
    invocation. The approach used an external Java program that acted as the listener,
    and on receiving a message, invoked a bean method. Message-driven beans have the
    following characteristics:


    +   - A message-driven bean''s instances retains no data or conversational state
    for a specific client i.e. they are stateless.

    - A single message-driven bean can process messages from multiple clients.

    - They are invoked asynchronously.

    - They can be transaction-aware.

    - They do not represent directly shared data in the database, but they can access
    and update this data.

    - A message-driven bean has only a bean i.e. unless a session bean, the clients
    don''t access message-driven beans through interfaces.

    - They do not have the remote or local interfaces that define client access.


    # 18.7.1 Lifecycle of a Message Driven Bean


    The EJB container usually creates a pool of message-driven bean instances. For
    each instance, the EJB container performs these tasks.


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_177_0.png)


    +   1. If the message-driven bean uses dependency injection, the container injects
    references before instantiating the instance.


    +   2. The container calls the method annotated @PostConstruct, if any.


    Like a stateless bean, a message-driven bean is never passivated and has only
    two states: nonexistent and ready to receive messages.

    At the end of the lifecycle, the container calls the method annotated @PreDestroy,
    if any. The bean''s instance is ready for garbage collection.


    # 18.7.2 The onMessage(Message) Method


    A message-driven Bean is an EJB component that can be considered as a JMS MessageListener,
    it is processing messages asynchronously; it implements the onMessage(javax.jms.Message)
    method, defined in the javax.jms.MessageListener interface. It is associated with
    a JMS destination, i.e. a Queue for ''point-to-point'' messaging or a Topic for
    ''publish/subscribe''. The onMessage method is activated on receipt of messages
    sent by a client application to the corresponding JMS destination. It is possible
    to associate a JMS message selector to filter the messages that the Message-driven
    Bean should receive.


    When the queue receives a message, the EJB container invokes the listener method
    or methods. For a bean that uses JMS, this is the onMessage method of the MessageListener
    interface.'
