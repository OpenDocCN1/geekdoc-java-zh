  md: '# 4.2 javax.servlet Package


    ![](img/433cf529eb0db3cb6a09a8d7a2dee016_38_0.png)


    The javax.servlet package contains a number of classes and interfaces that describe
    and define the contracts between a servlet class and the runtime environment provided
    for an instance of such a class by a servlet container.


    # 4.2.1 Servlet Interface (javax.servlet.Servlet)


    Defines methods that all servlets must implement. Servlets receive and respond
    to requests from Web clients, universally across HTTP, the HyperText Protocol.


    To implement this, you can write a generic servlet that extends javax.servlet.GenericServlet
    or an HTTP servlet that extends javax.servlet.http.HttpServlet.


    This interface defines methods to initialize a servlet, to service requests, and
    to remove a servlet from the service. These are known as life-cycle methods and
    are called in the following sequence :


    +   1. The servlet is constructed, then initialized with the init() method.

    2. Any calls from clients to the service method are handled.

    3. The servlet is taken out of service, destroyed by the destroy method, then
    garbage collected and finalized.


    In addition to the life-cycle methods, this interface provides the getServletConfig,
    which servlet can use to get any startup information, and the getDescriptor, which
    allows servlet to return basic information about itself, such as author, version,
    and copyright.


    # Methods


    +   1. public abstract void destroy() : This method is called when the servlet
    is preparing to unload a servlet. It is used to clean up any outstanding resources
    such as database connections, file handles and else.


    +   2. public abstract ServletConfig getServletConfig() : This method returns
    the ServletConfig object passed to the init() method.


    +   3. public abstract String getServletInfo() : This method returns a programmer
    defined String that describes the Servlet.


    +   4. public abstract void init(ServletConfig config) throws ServletException
    : This method is called by the server when the Servlet is first loaded. The init()
    method'
