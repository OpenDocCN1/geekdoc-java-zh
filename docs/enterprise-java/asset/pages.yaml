    # 21.1 The Java Persistence API


    The Java Persistence API provides Java developers with an object/relational mapping
    facility for managing relational data in Java applications. Java Persistence consists
    of four areas :


    +   1. The Java Persistence API

    2. The query language

    3. The Java Persistence Criteria API

    4. Object/relational mapping metadata


    JPA is a collection of classes and methods to persistently store the vast amounts
    of data into a database. Persistence in this context covers three areas :


    +   * the JPA itself, defined in the javax.persistence package

    * the Java Persistence Query Language (JQL)

    * object/relational metadata


    Mapping objects to database tables and versa is called Object-relational mapping
    (ORM). The Java Persistence API (JPA) allows the developer to map, store, update
    and retrieve data from relational databases to JPA objects and vice versa. JPA
    can be used in Java-EE and Java-SE applications.


    +   * JPA is a specification and several implementations are available. Popular
    implementations include Hibernate, EclipseLink and Apache OpenJPA.

    * JPA permits the developer to work with objects rather than SQL statements. The
    JPA implementation is typically called persistence provider.


    The mapping between objects and database tables is defined via persistence metadata.
    The JPA provider will use the persistence information to perform the correct database
    operations.


    +   * metadata is typically defined via annotations in the Java class. Alternatively,
    the metadata can be defined via XML or a combination of both. A XML configuration
    overwrites the annotations.


    The following description is based on the usage of annotations.


    +   * JPA defines a SQL-like Query language for static and dynamic queries.

    * Most JPA persistence providers offer the option to create the database schema
    automatically based on the metadata.'
