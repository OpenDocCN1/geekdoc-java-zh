    # 2.5 Architecture of Hibernate


    | Java Application |

    | Persistent Object |

    | Hibernate |

    | Configuration | Session Factory | Session |

    | Transaction | Query | Criteria |

    | JTA | JDBC | JNDI |

    | Database |


    +   1. **Configuration Object**: The Configuration object is the first Hibernate
    object you create in any Hibernate application. It is usually created only once
    during application initialization. It represents a configuration or properties
    file required by the Hibernate.


    The Configuration object provides two keys components :


    +   - **Database Connection**: This is handled through one or more configuration
    files supported by Hibernate Framework. There two files are concerned with the
    database connection `hibernate.properties` and `hibernate.cfg.xml` file.

    - **Class Mapping**: This component creates the connection between the Java classes
    and database tables.


    +   2. **Session Factory**: Configuration object is used to create a `SessionFactory`
    object which in turn configures Hibernate for the application using the supplied
    configuration file and allows for a Session to be instantiated. The `SessionFactory`
    is a thread safe object used by all threads of an application.


    The `SessionFactory` is a heavyweight object; it is usually created during application
    start up and kept for later use. You would need one `Session` object per database
    using a separate configuration file. So, if you are using multiple databases,
    then you would have to create multiple `SessionFactory` objects.


    +   3. **Session**: A Session is used to get a physical connection with a database.
    The Session object is lightweight and designed to be instantiated each interaction
    needed with the database. Persistent objects are saved and retrieved through a
    Session object.


    The session objects should not be kept open for a long time because they are usually
    thread safe and they should be created and destroyed as needed.'
