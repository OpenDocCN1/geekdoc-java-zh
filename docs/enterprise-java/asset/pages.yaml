  md: '# Enterprise Java (T.Y.B.Sc.-I.T.) (Sem.-V)


    The <sql:transaction> tag executes the SQL queries configured using <sql:query>
    or <sql:update> in transactional context. The benefit of executing queries in
    transactional context is that, if any problem during execution changes made to
    the database will be rolled back. On the other hand if the query execution is
    successful, then the changes are committed.


    Syntax :


    ```

    <sql:transaction dataSource="$string" isolation="$string">

    ```


    | Name | Required | Description |

    | --- | --- | --- |

    | dataSource | False | java.lang.String | Associated data source configured to
    access the database. |

    | isolation | False | java.lang.String | Specifies the isolation level of the
    transaction. Possible values are READ_COMMITTED, READ_UNCOMMITTED, REPEATABLE_READ,
    or SERIALIZABLE. If not specified, the isolation level specified during data source
    configuration will be used. |


    Example :


    ```

    <sql:setDataSource var="snapshot" driver="com.mysql.jdbc.Driver"

    url="jdbc:mysql://localhost/TEST"

    user="root" password="Test123"/>

    ```


    ```

    <%

    Date DOB = new Date("2018/10/23")

    %

    int studentId = 1111;

    ```


    ```

    <sql:transaction dataSource="\$[snapshot]">

    <sql:update var="count">

    UPDATE Students SET FirstName=''Sandhya'' WHERE Id = 2222

    </sql:update>

    <sql:update var="count">

    UPDATE Students SET Fname=''Sweetu'' WHERE Id = 3333

    </sql:update>

    <sql:update var="count">

    INSERT INTO Students

    VALUES (4444,''Neha'', ''Verma'', ''2013/10/23'');

    </sql:update>

    </sql:transaction>

    ```


    ```

    <sql:query dataSource="\$[snapshot]" var="result">

    SELECT * from Students;

    </sql:query>

    ```'
