  md: '# Creating Session


    To create a new session or gain access to an existing session, use the HttpServletRequest
    method getSession(), as shown in the following example :


    ```

    HttpSession session = request.getSession();

    ```


    The getSession() returns the valid session object associated with the request,
    identified in the session cookie that is encapsulated in the request object. Calling
    the method with no arguments creates a session if one does not exist that is associated
    with the request. Additionally, calling the method with a Boolean argument creates
    a session only if the argument is true.


    # Invalidating a Session


    Direct the session to invalidate itself automatically after being inactive for
    a defined time period. Alternatively, invalidate the session manually with the
    HttpServlet method invalidate().


    To invalidate a session manually, simply call the following method: session.invalidate();


    All objects bound to the session are removed.


    Session timeout is also possible to expire session after definite time interval
    passed to user in activity, which can be set using the session-timeout element
    in the web.xml deployment descriptor file.


