  md: 'Working with Session Beans


    159


    Stateless session beans are EJB components designed with two simple objectives
    in mind :


    +   - To perform simple tasks that can be accomplished in a single method invocation.

    - To be shared by many clients at the same time. This is the root cause for the
    session bean being stateless.


    Ideal cases for the use of stateless session beans are for simple tasks, such
    as processing a payment, making a deposit, or making a withdrawal. These tasks
    all have two common features: They represent actions, and they can be performed
    in a single step.


    While stateless session beans offer a big performance benefit, they are not fit
    for all tasks.


    Stateless session beans should be used if :


    +   - First, consider if your application needs to perform be accomplished in
    a single-method invocation. Remember that a stateless session bean cannot remember
    state specific to a client method invocations.

    - Second, determine if your application is needing to be visible to multiple clients
    at the same time.


    If the task has more than a single step, the stateless session bean isn''t the
    right choice. Also if the application needs to share information and state between
    multiple clients, then you should not use stateless beans.


    # 18.2.2 Stateful Session Beans


    Unlike a stateless bean, a stateful session bean has a unique identity that is
    assigned by the EJB container at create time.


    An example of a stateful bean is a shopping cart that represents the collection
    of products selected by a particular customer during a session. The shopping cart
    should not be shared because it represents a particular interaction with a particular
    customer and always is only for the customer''s. Also, the shopping cart is not
    saved into the database unless the customer is ready to place an order.


    Stateful beans are useful in workflow management that requires the bean to manage
    client data over different methods. Behind the scenes, the bean manages the workflow
    of several enterprise beans. The bean mediates between the client and the other
    components of the application, presenting a simplified view to the client.


    # 18.2.3 Singleton Session Bean


    A singleton session bean is instantiated once per application and exists for the
    lifecycle of the application. Singleton session beans are designed for circumstances
    when a single enterprise bean is shared and concurrently accessed by clients.


