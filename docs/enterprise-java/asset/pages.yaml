    Cookies can be used by web servers to identity and track users as they navigate
    different pages on a website, and to identify users returning to a website. The
    cookies can be used for following purposes :


    +   - to recognise your computer when you visit the website.

    - to track you as you navigate the website, and to enable the use of any e-commerce
    facilities.

    - to improve the website''s usability.

    - to analyse the use of the website.

    - in the administration of the website.

    - to personalise the website for you, including targeting advertisements which
    may be particular of interest to you.

    - to build a profile of your web surfing.


