- fmt: "\nAt the beginning of the program, the symbolic constant is defined with a\
    \ `# define` feature. This feature is called the preprocessor directive.\n\nThe\
    \ definition of a symbolic constant does not end with a semi colon, like other\
    \ C statements. Take a look at this example:\n\n```c\n#define PI 3.1415\n// (PI\
    \ is the constant that will represent value 3.1415)\n#define True 1\n#define name\
    \ \"Alice\"\n```\n\nFor all numeric constants such as floating point and integer,\
    \ non-numeric characters and blank spaces are not included. These constants are\
    \ also limited by minimum and maximum bounds, which are usually dependent on the\
    \ computer.\n\n## Variables\n\nMemory locations where data is stored are called\
    \ variables. These are indicated by a unique identifier. Names for variables are\
    \ symbolic representations that refer to a particular memory location. Examples\
    \ are `count`, `car_no` and `sum`.\n\n### Rules when writing the variable names\n\
    \nWriting variable names follow certain rules in order to make sure that data\
    \ is stored properly and retrieved efficiently.\n\n- Letters (in both lowercase\
    \ and uppercase), underscore (`_`) and digits are the only characters that can\
    \ be used for variable names.\n- Variables should begin either with an underscore\
    \ or a letter. Starting with an underscore is acceptable, but is not highly recommended.\
    \ Underscores at the beginning of variables can come in conflict with system names\
    \ and the compiler may protest.\n- There is no limit on the length of variables.\
    \ The compiler can distinguish the first 31 characters of a variable. This means\
    \ that individual variables should have different sequences for the 1st 31 characters.\n\
    \nVariables should also be declared at the beginning of a program before it can\
    \ be used.\n\n## Chapter 2: What is C Programming Language?\n\nIn C, the programming\
    \ language is a language that focuses on the structure. It was developed in 1972,\
    \ at Bell Laboratories, by Dennis Ritchie. The features of the language were derived\
    \ from “B”, which is an earlier programming language and formally known as BCPL\
    \ or Basic Combined Programming Language. The C programming language was originally\
    \ developed to implement the UNIX operating system.\n\n### Standards of C Programming\
    \ Language\n\nIn 1989, the American National Standards Institute developed the\
    \ 1st standard specifications. This pioneering standard specification was referred\
    \ to as `C89` and `C90`, both referring to the same programming language.\n\n\
    In 1999, a revision was made in the programming language. The revised standard\
    \ was called `C99`. It had new features such as advanced data types. It also had\
    \ a few changes, which gave rise to more applications.\n\nThe `C11` standard was\
    \ developed, which added new features to the programming language for C. This\
    \ had a library-like generic macro type, enhanced Unicode support, anonymous structures,\
    \ multi-threading, bounds-checked functions and atomic structures. It had improved\
    \ compatibility with C++. Some parts of the `C99` library in `C11` were made optional.\n\
    \nThe Embedded C programming language included a few features that were not part\
    \ of C. These included the named address spaces, basic I/O hardware addressing\
    \ and fixed point arithmetic.\n\n### C Programming Language Features\n\nThere\
    \ are a lot of features of the programming language, which include the following:\n\
    \n- Modularity\n- Interactivity\n- Portability\n- Reliability\n- Effectiveness\n\
    - Efficiency\n- Flexibility\n\n### Uses of the C Programming Language\n\nThis\
    \ language has found several applications. It is now used for the development\
    \ of system applications, which form a huge portion of operating systems such\
    \ as Linux, Windows and UNIX.\n\nSome of the applications of C language include\
    \ the following:\n\n- Spreadsheets\n- Database systems\n- Word processors\n- Graphics\
    \ packages\n- Network drivers\n- Compilers and Assemblers\n- Operating system\
    \ development\n- Interpreters\n\n## Chapter 3: Understanding C Program\n\nThe\
    \ C program has several features and steps in order for an output or function\
    \ is carried out.\n\n### Basic Commands (for writing basic C Program)\n\nThe basic\
    \ syntax and commands used in writing a simple C program include the following:\n\
    \n```c\n#include <stdio.h>\n```\n\nThis command is a preprocessor. `<stdio.h>`\
    \ stands for standard input output header file. This is a file from the C library,\
    \ which is included before the C program is compiled.\n\n```c\nint main()\n```\n\
    \nExecution of all C program begins with this `main()` function.\n\n```c\n{\n\
