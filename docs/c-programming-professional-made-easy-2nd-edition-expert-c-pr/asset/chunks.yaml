  trans: "\n在程序开始时，使用 `# define` 功能定义符号常量。这种功能被称为预处理器指令。\n\n符号常量的定义不像其他 C 语句那样以分号结尾。请看这个示例：\n\
    \n```c\n#define PI 3.1415\n// (PI 是一个代表值 3.1415 的常量)\n#define True 1\n#define\
    \ name \"Alice\"\n```\n\n对于所有的数值型常量（如浮点数和整数），不包括非数字字符和空格。这些常量还受到最小和最大边界的限制，这通常取决于计算机。\n\
    \n## 变量\n\n存储数据的内存位置称为变量。它们通过一个唯一的标识符来指示。变量名是引用特定内存位置的符号表示。示例有 `count`、`car_no`\
    \ 和 `sum`。\n\n### 编写变量名的规则\n\n编写变量名遵循某些规则，以确保数据被妥善地存储并高效地检索。\n\n- 字母（包括大写和小写字母）、下划线（`_`）和数字是可用于变量名的唯一字符。\n\
    - 变量应该以下划线或字母开头。以下划线开头是可以接受的，但并不推荐。变量开头的下划线可能会与系统名称冲突，编译器可能会报错。\n- 变量的长度没有限制。编译器可以区分变量的前\
    \ 31 个字符。这意味着单个变量在前 31 个字符上应该具有不同的序列。\n\n变量也应该在程序开始时声明后才能使用。\n\n## 第 2 章：什么是 C\
    \ 编程语言？\n\n在 C 语言中，编程语言是一种关注结构的语言。它由 Dennis Ritchie 于 1972 年在贝尔实验室开发。该语言的特征源自“B”语言，“B”\
    \ 是一种更早的编程语言，正式名称为 BCPL 或 Basic Combined Programming Language（基础组合编程语言）。C 编程语言最初是为了实现\
    \ UNIX 操作系统而开发的。\n\n### C 语言的标准\n\n1989 年，美国国家标准协会制定了第一版标准规范。这项开创性的规范被称为 `C89`\
    \ 和 `C90`，两者都指代同一种编程语言。\n\n1999 年，对编程语言进行了修订。修订后的标准称为 `C99`。它具有了新特性，例如高级数据类型。它还有一些变化，这些变化催生了更多应用。\n\
    \n开发了 `C11` 标准，为 C 编程语言增加了新特性。它包含了类似库的泛型宏类型、增强的 Unicode 支持、匿名结构、多线程、边界检查函数和原子结构。它提高了与\
    \ C++ 的兼容性。`C11` 中 `C99` 库的一些部分被变为可选。\n\n嵌入式 C 编程语言包含了一些 C 语言不包含的特性。这些包括命名地址空间、基础\
    \ I/O 硬件寻址和定点算术。\n\n### C 语言特性\n\n该语言有很多特性，包括以下：\n\n- 模块化\n- 交互性\n- 可移植性\n- 可靠性\n\
    - 有效性\n- 效率\n- 灵活性\n\n### C 语言的用途\n\n这种语言有了许多应用。它现在被用于系统应用的开发，这形成了 Linux、Windows\
    \ 和 UNIX 等操作系统的大部分部分。\n\nC 语言的一些应用包括：\n\n- 电子表格\n- 数据库系统\n- 文字处理器\n- 图形包\n- 网络驱动程序\n\
    - 编译器和汇编器\n- 操作系统开发\n- 解释器\n\n## 第 3 章：理解 C 程序\n\nC 程序具有几个特性和步骤，以便执行输出或功能。\n\n\
    ### 基础命令（用于编写基础 C 程序）\n\n编写简单 C 程序时使用的基础语法和命令包括：\n\n```c\n#include <stdio.h>\n\
    ```\n\n该命令是一个预处理器。`<stdio.h>` 代表标准输入输出头文件。这是 C 库中的一个文件，在 C 程序编译之前被包含进来。\n\n```c\n\
    int main()\n```\n\n所有 C 程序的执行都从这个 `main()` 函数开始。\n\n```c\n{\n```\n\n此符号用于指示主函数的开始。\n\
    \n```c\n}\n```\n\n这表示主函数的结束。\n\n```c\n/* */\n```\n\n在该命令之间编写的任何内容都不会被考虑执行或编译。\n\
    \n```c\nprintf (output);\n```\n\n`printf` 命令在屏幕上打印输出。\n\n```c\ngetch();\n```\n\
    \n编写此命令将允许系统等待任何键盘字符输入。\n\n```c\nreturn 0\n```\n\n编写此命令将终止 C 程序或主函数并返回 0。\n\n\
    一个基础的 C 程序看起来如下：\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    /* 我们第一个简单的\
    \ C 基础程序 */\n    printf(\"Hello People! \");\n    getch();\n    return 0;\n}\n\
    ```\n\n这个简单程序的输出看起来如下：\n\nHello People!\n\n## 第 4 章：学习 C 编程\n\n在学习了基础元素和语言的精髓后，是时候开始\
    \ C 语言编程了。这里是最重要的步骤：\n\n### 下载编译器\n\n编译器是编译 C 代码所需的程序。它解释编写的代码并将其翻译成计算机可以理解的特定信号。通常，编译器程序是免费的。针对不同的操作系统有不同的编译器可用。Microsoft\
    \ Visual Studio 和 `MinGW` 是适用于 Windows 操作系统的编译器。`XCode` 是 Mac 上最好的编译器之一。Linux\
    \ 最常用的编译器选项是 `gcc`。\n\n### 基础代码\n\n考虑上一章节中的简单 C 程序示例：\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n    printf(\"Hello People!\\n\");\n    getch();\n    return 0;\n\
    }\n```\n\n在程序开始处放置 `#include` 命令。这对于加载函数所在的库至关重要。`<stdio.h>` 指向文件库并允许使用后续函数 `getch()`\
    \ 和 `printf()`。\n\n`int main()` 向编译器发送运行名为 `main` 函数的消息，并在结束后返回一个整数。\n\n`{}` 符号用于指定其内部的所有内容都是\
    \ `main` 函数的一部分。\n\n`printf()` 函数告诉系统将括号内的单词或字符显示在计算机屏幕上。`\\n` 序列告诉 C 编译器将光标置于下一行。在行结束处放置\
    \ `;`（分号）以表示序列完成。C 程序中的大多数代码都需要分号来标识行的结束。\n\n`return 0` 表示函数已结束。对于这个特定的 C 程序，它开头为\
    \ `int`，这意味着程序在运行时必须返回一个整数。“0”是程序正常运行的指示。如果程序结束时返回了另一个数字，则意味着程序某处存在错误。\n\n####\
    \ 编译程序\n\n要编译程序，将代码输入程序代码编辑器中。将其保存为 `*.c` 类型的文件，然后点击运行或构建按钮。\n\n#### 代码注释\n\n"
- fmt: "\nAny comments placed on codes are not compiled. These allow the user to give\
    \ details on what happens in the function. Comments are good reminders on what\
    \ the code is all about and for what. Comments also help other developers to understand\
    \ what the code when they look at it.\n\nTo make a comment, add a `/*` at the\
    \ beginning of the comment. End the written comment with `*/`. When commenting,\
    \ comment on everything except the basic portions of the code, where explanations\
    \ are no longer necessary because the meanings are already clearly understood.\
    \ \n\nAlso, comments can be utilized for quick removal of code parts without having\
    \ to delete them. Just enclose portions of the code in `/* *//`, then compile.\
    \ Remove these tags if these portions are to be added back into the code.\n\n\
    # USING VARIABLES\n\n## Understanding variables\nDefine the variables before using\
    \ them. Some common ones include `char`, `float` and `int`.\n\n### Declaring variables\n\
    Again, variables have to be declared before the program can use them. To declare,\
    \ enter data type and then the name of the variable. Take a look at these examples:\n\
    \n```\nchar name;\nfloat x;\nint f, g, i, j;\n```\n\nMultiple variables can also\
    \ be declared all on a single line, on condition that all of them belong to the\
    \ same data type. Just separate the names of the variables commas (i.e., `int\
    \ f, g, i, j;`).\n\nWhen declaring variables, always end the line with a semicolon\
    \ to denote that the line has ended.\n\n### Location on declaring the variables\n\
    Declaring variables is done at the start of the code block. This is the portion\
    \ of the code enclosed by the brackets `{}`. The program won’t function well if\
    \ variables are declared later within the code block.\n\n## Variables for storing\
    \ user input\nSimple programs can be written using variables. These programs will\
    \ store inputs of the user. Simple programs will use the function `scanf`, which\
    \ searches the user’s input for particular values. Take a look at this example:\n\
    \n```c\n#include <stdio.h>\n\nint main()\n{\n  int x;\n  printf( \"45: \" );\n\
    \  scanf( \"%d\", &x );\n  printf( \"45 %d\", x );\n  getchar();\n  return 0;\n\
    }\n```\n\nThe string `&d` informs the function `scanf` to search the input for\
    \ any integers.\n\nThe command `&` placed before the `x` variable informs the\
    \ function `scanf` where it can search for the specific variable so that the function\
    \ can change it. It also informs the function to store the defined integer within\
    \ the variable.\n\nThe last `printf` tells the compiler to read back the integer\
    \ input into the screen as a feedback for the user to check.\n\n## Manipulating\
    \ variables\nMathematical expressions can be used, which allow users to manipulate\
    \ stored variables. When using mathematical expressions, it is most important\
    \ to remember to use the `=` distinction. A single `=` will set the variable’s\
    \ value. A `==` (double equal sign) is placed when the goal is to compare the\
    \ values on both sides of the sign, to check if the values are equal.\n\nFor example:\n\
    \n```c\nx = 2 * 4; /* sets the value of \"x\" to 2 * 4, or 8 */\nx = x + 8; /*\
    \ adds 8 to the original \"x \" value, and defines the new “x” value as the specific\
    \ variable */\nx == 18; /* determines if the value of \"x\" is equal to 18 */\n\
    x < 11; /* determines if the \"x\" value is lower than 11 */\n```\n\n# CONDITIONAL\
    \ STATEMENTS\n\nConditional statements can also be used within the C program.\
    \ In fact, most programs are driven by these statements. These are determined\
    \ as either False or True and then acted upon depending on the results. The most\
    \ widely used and basic conditional statement is `if`.\n\nIn C, False and True\
    \ statements are treated differently. Statements that are “TRUE” are those that\
    \ end up equal to nonzero numbers. For example, when a comparison is performed,\
    \ the outcome is a “TRUE” statement if the returned numerical value is “1”. The\
    \ result is a “FALSE” statement if the value that returns is “0”. \n\n## Basic\
    \ conditional operators\nThe operation of conditional statements is based on mathematical\
    \ operators used in comparing values. The most common conditional operators include\
    \ the following:\n\n- `<` /* less than */ `6 < 15` TRUE\n- `>` /* greater than\
    \ */ `10 > 5` TRUE\n- `<=` /* less than or equal to */ `4 <= 8` TRUE\n- `>=` /*\
    \ greater than or equal to */ `8 >= 8` TRUE\n- `!=` /* not equal to */ `4 != 5`\
    \ TRUE\n- `==` /* equal to */ `7 == 7` TRUE\n\n### How to write a basic “IF” conditional\
    \ statement\nA conditional “IF” statement is used in determining what the next\
    \ step in the program is after evaluation of the statement. These can be combined\
    \ with other types of conditional statements in order to create multiple and powerful\
    \ options.\n\nTake a look at this example:\n\n```c\n#include <stdio.h>\nint main()\n\
    {\n  if ( 4 < 7 )\n    printf( \"4 is less than 7\");\n    getchar();\n}\n```\n\
    \n### The “ELSE/ELSE IF” statements\nThese statements can be used in expanding\
    \ the conditional statements. Build upon the “IF” statements with `ELSE` and `ELSE\
    \ IF` type of conditional statements, which will handle different types of results.\
    \ An `ELSE` statement will be run when the `IF` statement result is FALSE. An\
    \ `ELSE IF` statement will allow for the inclusion of multiple IF statements in\
    \ one code block, which will handle all the various cases of the statement.\n\n\
    Take a look at this example:\n\n```c\n#include <stdio.h>\nint main()\n{\n  int\
    \ age;\n  printf( \"Please type age: \");\n  scanf( \"%d\", &age);\n  if ( age\
    \ <= 10 ) {\n    printf(\"You are just a kid!\\n\");\n  }\n  else if ( age < 30\
    \ ) {\n    printf(\"Being an adult is awesome!\\n\");\n  }\n  else if ( age <\
    \ 50 ) {\n    printf(\"Young at heart!\\n\");\n  }\n  else {\n    printf(\"Age\
    \ comes with wisdom.\\n\");\n  }\n  return 0;\n}\n```\n\n# LOOPS\n\nLoops are\
    \ among the most important parts of C. These allow the user to repeat code blocks\
    \ until particular conditions are met. Loops make repeated actions easy and reduce\
    \ the need to write new conditional statements each time.\n\nThere are 3 main\
    \ types of loops in C. These are `FOR`, `WHILE` and `Do… WHILE`.\n\n## “FOR” Loop\n\
    The `FOR` loop is the most useful and commonly used type of loop in C programming.\
    \ This loop continues to run the function until the conditions set for loop are\
    \ met. There are 3 conditions required by the FOR loop. These include initialization\
    \ of the variable, meeting the condition and how updating of the variable is done.\
    \ All of these conditions need not be met at the same time, but a blank space\
    \ with semicolon is still needed to prevent the loop from running continuously.\n\
    \nTake a look at this example:\n\n```c\n#include <stdio.h>\nint main()\n{\n  int\
    \ y;\n  for ( y = 0; y < 10; y++){\n    printf( \"%d\\n\", y );\n  }\n  getchar();\n\
    }\n```\n\nThe value of `y` has been set to 0, and the loop is programmed to continue\
    \ running as long as the y value remains less than 10. At each run (loop), the\
    \ y value is increased by 1 before the loop is repeated. Hence, once the value\
    \ of y is equivalent to 10 (after 10 loops), the above loop will then break.\n\
    \n## WHILE Loop\nThese are simpler than the FOR loops. There is only one condition,\
