  trans: "\n\n```c\n#include <stdio.h>\n\nint main ( )\n{\n  /* local variable definition\
    \ */\n  int y = 10;\n\n  /* while loop execution */\n  while (y < 20)\n  {\n \
    \   printf (“The value of y: %d\\n”, y);\n    y++;\n    if (y > 15)\n    {\n \
    \     /* terminate the loop using break statement */\n      break;\n    }\n  }\n\
    \  return 0;\n}\n```\n\n一旦上述代码执行后，将显示以下输出：\n\nThe value of y: 10\nThe value of\
    \ y: 11\nThe value of y: 12\nThe value of y: 13\nThe value of y: 14\nThe value\
    \ of y: 15\n\n## Continue 语句 (Continue Statement)\n\n`continue` 语句与 `break` 语句相似，在于它不会强制终止，而是强制继续下一次循环迭代，同时跳过之间的任何代码。\n\
    \n如果你正在使用 `for` 循环，`continue` 语句会导致循环的递增和条件测试执行。如果你正在使用 `do while` 或 `while` 循环，`continue`\
    \ 语句会导致程序控制移动到条件测试。\n\n### 语法 (Syntax)\n\n以下是 `continue` 语句的通用语法：\n\n```\ncontinue;\n\
    ```\n\n### 流程图 (Flow Diagram)\n\n![](img/00010.jpeg)\n\n### 示例 (Example):\n\n\
    ```c\n#include <stdio.h>\n\nint main ( )\n{\n  /* local variable definition */\n\
    \  int y = 10;\n\n  /* do loop execution */\n  do\n  {\n    if ( y == 15 )\n \
    \   {\n      /* skip the iteration */\n      y = y + 1;\n      continue\n    }\n\
    \    printf (“The value of y: %d\\n”, y);\n    y++;\n  }\n  while ( y < 20 );\n\
    \  return 0;\n}\n```\n\n一旦上述代码编译并执行后，将显示以下输出：\n\nThe value of y: 10\nThe value\
    \ of y: 11\nThe value of y: 12\nThe value of y: 13\nThe value of y: 14\nThe value\
    \ of y: 16\nThe value of y: 17\nThe value of y: 18\nThe value of y: 19\n\n## Goto\
    \ 语句 (Goto Statement)\n\n`goto` 语句导致控制跳转到 `goto` 提到的对应标签。然而，`goto` 很少用于应用程序和分层编程，因为它们可能非常困惑、复杂且可读性差。它还使得程序的控制难以追踪。同样，它往往会让调试和测试变得困难。\n\
    \n### 语法 (Syntax)\n\n这是 `goto` 语句的通用语法：\n\n```\ngoto label;\n. .\n. .\nlabel:\
    \ statement;\n```\n\n### 流程图 (Flow Diagram)\n\n![](img/00011.jpeg)\n\n### 示例 (Example):\n\
    \n```c\n#include <stdio.h>\n\nint main ( )\n{\n  /* local variable definition\
    \ */\n  int w = 10;\n\n  /* do loop execution */\n  LOOP:do\n  {\n    if ( w ==\
    \ 15)\n    {\n      /* skip the iteration */\n      w = w + 1;\n      goto LOOP;\n\
    \    }\n    printf (“The value of w: %d\\n”, w);\n    w++;\n  }\n  while ( w <\
    \ 20 );\n  return 0;\n}\n```\n\n一旦上述代码执行后，将显示以下输出：\n\nThe value of w: 10\nThe\
    \ value of w: 11\nThe value of w: 12\nThe value of w: 13\nThe value of w: 14\n\
    The value of w: 16\nThe value of w: 17\nThe value of w: 18\nThe value of w: 19\n\
    \n## 无限循环 (The Infinite Loop)\n\n可以说，如果一个循环的条件永远不变为假，它就是无限循环的。传统上，`for` 循环用于此目的。然而，由于\
    \ `for` 循环中的表达式并不是强制要求的，你可以省略条件来创建一个无限循环。\n\n```c\n#include <stdio.h>\n\nint main\
    \ ( )\nfor ( ; ; )\n{\n  printf (“This is an endless loop.\\n”);\n}\nreturn 0;\n\
    ```\n\n如果条件不存在，则假设它为真。使用递增表达式或初始化是可以的，但如果你想表示无限循环，也可以使用 `for (; ;)` 结构。此外，你可以按\
    \ `Ctrl + C` 键来终止无限循环。\n\n## 第 9 章：类型转换与错误处理 (Chapter 9: Type Casting and Error\
    \ Handling)\n\n### 类型转换 (Type Casting)\n\n将变量从某种数据类型转换为另一种的一种方法是使用类型转换。例如，如果你希望将一个长值存储到整数中，可以将\
    \ `long` 转换为 `int`。此外，你还可以通过使用转换运算符 `(type_name)` 表达式将值从某种类型转换为另一种。\n\n以下是一个使用转换运算符对两个整数变量进行浮点数运算的示例：\n\
    \n```c\n#include <stdio.h>\n\nmain ( )\n{\n  int sum = 17, count = 5;\n  double\
    \ mean;\n  mean = (double) sum / count;\n  printf (“The mean value is : %f\\n”,\
    \ mean);\n}\n```\n\n一旦此代码执行，将显示以下输出：\n\nThe mean value is : 3.400000\n\n你应该注意，在这种情况下，转换运算符位于除法过程之前。因此，`sum`\
    \ 值首先转换为 `double` 类型。最终，它被除以 `count` 并产生一个双值。\n\n### 整数提升 (Integer Promotion)\n\
    \n将小于 `unsigned int` 或 `int` 的整数值转换为 `unsigned int` 或 `int` 的过程被称为整数提升。考虑以下示例：\n\
