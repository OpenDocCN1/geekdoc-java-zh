- fmt: "\n`Exp1` is first assessed. If it is proven to be true, `Exp2` is assessed\
    \ next and it serves as the current expression value. On the other hand, if `Exp1`\
    \ is proven to be false, then `Exp3` is assessed next and its value serves as\
    \ the current expression value.\n\n# Chapter 8 C Loops\n\nIn case you have to\
    \ execute a block of code a few times, you should execute the statements sequentially.\
    \ This means that you have to execute the first statement in a function first,\
    \ and then the second, and so on.\n\nA loop statement allows you to execute a\
    \ statement or a number of statements several times. The following is the general\
    \ form of a loop statement:\n\n![](images/00005.jpeg)\n\n## The Different Types\
    \ of Loops\n\n### While Loop\n\nThe `while` loop repeatedly executes a particular\
    \ statement if the given condition is true.\n\n#### Syntax\n\nThe general syntax\
    \ of a `while` loop is as follows:\n\n```c\nwhile (condition) \n{\n    statement(s);\n\
    }\n```\n\nYou can use a single statement or a block of statements in a `while`\
    \ loop. Also, you can give a condition of any expression, but non-zero values\
    \ are considered true. As long as the condition is true, the loop continues to\
    \ iterate. Once the condition becomes false, the program control passes to the\
    \ line that immediately follows the loop.\n\n#### Flow Diagram\n\n![](images/00006.jpeg)\n\
    \nIf the condition of the `while` loop is tested and found to be false, then the\
    \ first statement after the `while` loop is executed while the loop body is skipped.\n\
    \n#### Example:\n\n```c\n#include <stdio.h>\n\nint main ( )\n{\n    /* local variable\
    \ definition */\n    int x = 10;\n    /* while loop execution */\n    while (\
    \ x < 20)\n    {\n        printf (“The value of x: %d\\n”, x);\n        x++;\n\
    \    }\n    return 0;\n}\n```\n\nOnce the above code has been executed, the following\
    \ output is shown:\n\nThe value of x: 10\nThe value of x: 11\nThe value of x:\
    \ 12\nThe value of x: 13\nThe value of x: 14\nThe value of x: 15\nThe value of\
    \ x: 16\nThe value of x: 17\nThe value of x: 18\nThe value of x: 19\n\n### For\
    \ Loop\n\nThe `for` loop is used to repeat a certain block of codes for a certain\
    \ number of times.\n\n#### Syntax\n\nThis is the general syntax for a `for` loop:\n\
    \n```c\nfor ( init; condition; increment )\n{\n    statement(s);\n}\n```\n\n####\
    \ Flow Diagram\n\n![](images/00007.jpeg)\n\n#### The Flow of Control in a For\
    \ Loop\n\nFirst, the `init` is executed to enable you to initialize and declare\
    \ loop control variables. As long as you use a semicolon, there is no need for\
    \ you to place a statement here.\n\nThen, the `condition` is evaluated. If it\
    \ is proven to be true, then the loop is executed. Otherwise, the flow of control\
    \ moves on to the next statement.\n\nAfter the body of the `for` loop is executed,\
    \ the flow of control moves back to the `increment`. The `increment` statement\
    \ allows you to update your loop control variables. You can leave it blank if\
    \ you want for as long as you use a semicolon after your condition.\n\nFinally,\
    \ the `condition` is re-evaluated. If it is found to be true, then the loop executes\
    \ and the entire process is repeated. When the condition becomes false, the `for`\
    \ loop terminates.\n\n#### Example:\n\n```c\n#include <stdio.h>\n\nint main (\
    \ )\n{\n    /* for loop execution */\n    for ( int x = 10; x < 20; x = x + 1)\n\
    \    {\n        printf (“The value of x: %d\\n”, x);\n    }\n    return 0;\n}\n\
    ```\n\nOnce the above code is executed, the following output is shown:\n\nThe\
    \ value of x : 10\nThe value of x : 11\nThe value of x : 12\nThe value of x :\
    \ 13\nThe value of x : 14\nThe value of x : 15\nThe value of x : 16\nThe value\
    \ of x : 17\nThe value of x : 18\nThe value of x : 19\n\n#### Different Ways of\
    \ Using For Loop\n\nIf you want to perform a certain action multiple times, you\
    \ can use loop control statements. You can write `for` loop using the following:\n\
    \n1. **Single Statement Inside For Loop**\n   ```c\n   for (i = 0; i < 5; i++)\n\
    \   printf (“Programming”);\n   ```\n\n2. **Multiple Statements Inside For Loop**\n\
    \   ```c\n   for (i = 0; i < 5; i++)\n   {\n       printf (“First Statement”);\n\
    \       printf (“Second Statement”);\n       printf (“Third Statement”);\n   \
    \    if (condition)\n       {\n       }\n   }\n   ```\n\n3. **No Statement Inside\
    \ For Loop**\n   ```c\n   for (i = 0; i < 5; i++)\n   {\n   }\n   ```\n\n4. **Semicolon\
    \ at the End of For Loop**\n   ```c\n   for (i = 0; i < 5; i++);\n   ```\n\n5.\
    \ **Multiple Initialization Statement Inside For Loop**\n   ```c\n   for (i =\
    \ 0; j = 0; i < 5; i++)\n   {\n       statement 1;\n       statement 2;\n    \
    \   statement 3;\n   }\n   ```\n\n6. **Missing Increment/Decrement Statement**\n\
    \   ```c\n   for (i = 0; i < 5; )\n   {\n       statement 1;\n       statement\
    \ 2;\n       statement 3;\n       i++\n   }\n   ```\n\n7. **Missing Initialization\
    \ in For Loop**\n   ```c\n   i = 0;\n   for ( ; i < 5; i++)\n   {\n       statement\
