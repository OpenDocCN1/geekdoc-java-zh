  trans: "\n\n放置在代码上的注释不会被编译。这些注释允许用户详细说明函数中发生了什么。注释是关于代码内容及其用途的良好备忘。此外，注释还能帮助其他开发者在查看代码时理解其含义。\n\
    \n要编写注释，请在注释开头添加 `/*`。用 `*/` 结束编写的注释。在注释时，请对代码基础部分以外的所有内容进行注释，因为基础部分的含义已经很明确了，不再需要解释。\n\
    \n此外，注释还可以用于快速移除代码部分，而无需删除它们。只需将代码部分封装在 `/* *//` 中，然后编译即可。如果需要将这些部分重新加入代码中，请移除这些标签。\n\
    \n# 使用变量\n\n## 理解变量\n在使用变量之前定义它们。常见的变量包括 `char`、`float` 和 `int`。\n\n### 声明变量\n\
    同样，在程序使用变量之前必须对其声明。要进行声明，输入数据类型，然后是变量名。看这些示例：\n\n```\nchar name;\nfloat x;\nint\
    \ f, g, i, j;\n```\n\n也可以在同一行声明多个变量，前提是它们都属于同一种数据类型。只需用逗号分隔变量名即可（例如 `int f, g,\
    \ i, j;`）。\n\n在声明变量时，始终以分号结尾，以表示该行结束。\n\n### 变量声明的位置\n变量声明是在代码块的开始完成的。这是由括号 `{}`\
    \ 包围的代码部分。如果变量在代码块内部后期才声明，程序将无法正常运行。\n\n## 用于存储用户输入的变量\n可以使用变量编写简单的程序。这些程序将存储用户的输入。简单程序将使用\
    \ `scanf` 函数，它会在用户的输入中搜索特定的值。看这个示例：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n  int x;\n  printf( \"45: \" );\n  scanf( \"%d\", &x );\n  printf( \"45 %d\"\
    , x );\n  getchar();\n  return 0;\n}\n```\n\n字符串 `&d` 告诉 `scanf` 函数在输入中搜索任何整数。\n\
    \n放在变量 `x` 之前的命令 `&` 告诉 `scanf` 函数可以在哪里搜索该特定变量，以便函数可以更改它。它还告诉函数将定义的整数存储在变量中。\n\
    \n最后一个 `printf` 告诉编译器将整数输入读回屏幕上，作为供用户检查的反馈。\n\n## 变量操作\n可以使用数学表达式，允许用户操作所存储的变量。在使用数学表达式时，最重要的是记住使用\
    \ `=` 区分。单个 `=` 将设置变量的值。当目标是比较符号两边的值以检查这些值是否相等时，则放置 `==`（双等号）。\n\n例如：\n\n```c\n\
    x = 2 * 4; /* 将 \"x\" 的值设置为 2 * 4，或 8 */\nx = x + 8; /* 在原 \"x\" 的值上加 8，并将新的“x”值定义为该变量\
    \ */\nx == 18; /* 确定 \"x\" 的值是否等于 18 */\nx < 11; /* 确定 \"x\" 的值是否小于 11 */\n```\n\
    \n# 条件语句\n\nC 程序中也可以使用条件语句。事实上，大多数程序都是由这些语句驱动的。这些语句被确定为假（False）或真（True），然后根据结果执行操作。最广泛使用的最基础条件语句是\
    \ `if`。\n\n在 C 语言中，假和真语句的对待方式不同。为真”的语句是指最终等于非零数字的语句。例如，当进行比较时，如果返回的数值为“1”，则结果为“真”语句。如果返回的值为“0”，则结果为“假”语句。\n\
    \n## 基础条件运算符\n条件语句的操作基于用于比较值的数学运算符。最常见的条件运算符包括以下内容：\n\n- `<` /* 小于 */ `6 < 15`\
    \ 真\n- `>` /* 大于 */ `10 > 5` 真\n- `<=` /* 小于或等于 */ `4 <= 8` 真\n- `>=` /* 大于或等于\
    \ */ `8 >= 8` 真\n- `!=` /* 不等于 */ `4 != 5` 真\n- `==` /* 等于 */ `7 == 7` 真\n\n###\
    \ 如何编写基础的“IF”条件语句\n条件“IF”语句用于在评估语句后确定程序的下一步是什么。这些语句可以与其他类型的条件语句结合使用，以创建多个且强大的选项。\n\
    \n看这个示例：\n\n```c\n#include <stdio.h>\nint main()\n{\n  if ( 4 < 7 )\n    printf(\
    \ \"4 is less than 7\");\n    getchar();\n}\n```\n\n### “ELSE/ELSE IF”语句\n这些语句可以用于扩展条件语句。在“IF”语句的基础上构建\
    \ `ELSE` 和 `ELSE IF` 类型的条件语句，它们将处理不同类型的结果。当 `IF` 语句结果为假时，将运行 `ELSE` 语句。`ELSE IF`\
    \ 允许在一个代码块中包含多个 `IF` 语句，这将处理语句的所有各种情况。\n\n看这个示例：\n\n```c\n#include <stdio.h>\n\
    int main()\n{\n  int age;\n  printf( \"Please age: \");\n  scanf( \"%d\", &age);\n\
    \  if ( age <= 10 ) {\n    printf(\"你只是个孩子!\\n\");\n  }\n  else if ( age < 30\
    \ ) {\n    printf(\"成年状态太棒了!\\n\");\n  }\n  else if ( age < 50 ) {\n    printf(\"\
    保持童心!\\n\");\n  }\n  else {\n    printf(\"年龄增长带来了智慧。\\n\");\n  }\n  return 0;\n\
    }\n```\n\n# 循环\n\n循环是 C 语言最重要的部分之一。它们允许用户在满足特定条件之前重复代码块。循环使得重复操作变得简单，减少了每次编写新条件语句的需求。\n\
    \nC 语言中有三种主要的循环类型。这些是 `FOR`、`WHILE` 和 `Do… WHILE`。\n\n## “FOR”循环\n`FOR` 循环是 C\
    \ 编程中最且常用的循环类型。该循环在满足设置条件之前继续运行。循环需要三个条件。这些包括变量的初始化、条件的满足以及变量如何更新。这些条件不需要同时满足，但仍然需要分号空格来防止循环持续运行。\n\
    \n看这个示例：\n\n```c\n#include <stdio.h>\nint main()\n{\n  int y;\n  for ( y = 0;\
    \ y < 10; y++){\n    printf( \"%d\\n\", y );\n  }\n  getchar();\n}\n```\n\n`y`\
    \ 的值已设置为 0，程序设定为只要 y 值小于 10 就继续运行。在每次运行（循环）中，在重复循环之前 y 值增加 1。因此，一旦 y 的值等于 10（经过\
    \ 10 次循环），上面的循环将终止。\n\n## WHILE 循环\n这些比 FOR 循环更简单。它只有一个条件，即只要条件保持为真，循环继续运行。变量不需要初始化或更新，但可以在循环的主体内完成。\n\
    \n看这个示例：\n\n```c\n#include <stdio.h>\nint main()\n{\n  int y = 0;\n  while ( y\
    \ <= 20 ){\n    printf( \"%d\\n\", y );\n    y++;\n  }\n  getchar();\n}\n```\n\
    \n在上面的程序中，`y++` 命令会在每次执行循环时为变量 `y` 增加 1。当 `y` 的值达到 21 时，循环将终止。\n\n"
- fmt: "\nThis is a very useful loop to ensure at least 1 run. `FOR` and `WHILE` loops\
    \ check the conditions at the start of the loop, which ensures that it could not\
    \ immediately pass and fail. `DO…WHILE` loops will check the conditions when the\
    \ loop is finished. This ensures that the loop will run at last once before a\
    \ pass and fail occurs.\n\nTake a look at this example:\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n  int y;\n  y = 10;\n  do {\n    printf(\"This loop is running!\\\
    n\");\n  } while ( y != 10 );\n  getchar();\n}\n```\n\nThis type of loop displays\
    \ the message whether the condition results turn out TRUE or FALSE. The `y` variable\
    \ is set to 10. The `WHILE` loop has been set to run when the `y` value is not\
    \ equal to 10, at which the loop ends. The message was printed because the condition\
    \ is not checked until the loop has ended.\n\nThe `WHILE` portion of the `DO..WHILE`\
    \ loop must end with a semicolon. This is also the only instance when a loop ends\
    \ this way.\n\n# Chapter 5 Storage Classes\n\nStorage class refers to the lifetime\
    \ and visibility of functions and variables within a C program. Such specifiers\
    \ are found before the type they modify. Some of the most commonly used storage\
    \ classes in a C program include `auto`, `static`, `register`, and `extern`. So\
    \ how are these storage classes used?\n\n## Auto\n\nThis storage class is considered\
    \ as the default storage class for all the local variables. Consider this example:\n\
    \n```c\n{\nint mount;\nauto int month;\n}\n```\n\nThe above example has variables\
    \ with a similar storage class. Take note that `auto` may only be used inside\
    \ functions, such as local variables.\n\n## Register\n\nThis storage class is\
    \ typically used for local variables that have to be stored inside a register\
    \ instead of a RAM. The variable should have a size that is less than or equal\
    \ to the size of the register. It should also not use the unary `&` operator because\
    \ it does not include a memory. Look at this example:\n\n```c\n{\nregister int\
    \ kilometers;\n}\n```\n\nKeep in mind that the `register` storage class will only\
    \ be functional if used with variables that use quick access like counters. Also,\
    \ you should take note that this storage class does not necessarily store the\
    \ variable inside a register. Instead, it offers the possibility of storing that\
    \ variable inside a register based on certain implementations of restrictions\
    \ and hardware.\n\n## Static\n\nThis storage class commands the compiler to save\
    \ a local variable throughout the lifetime of the program rather than destroying\
    \ and creating it whenever it comes in and out of range. Turning your local variables\
    \ into `static` allows them to retain their values amid function calls.\n\nIn\
    \ addition, you can use the `static` modifier for global variables. If you do\
    \ this, the scope of the variable can be regulated in the file in which it has\
    \ been declared. Remember that if you use `static` on a member of the class data,\
    \ all its class objects can share just one copy of its member.\n\n```c\n#include\
    \ <stdio.h>\n\n/* function declaration */\nvoid func(void);\n\nstatic int count\
    \ = 5; /* global variable */\n\nmain()\n{\nwhile(count--)\n{\nfunc();\n}\nreturn\
    \ 0;\n}\n\n/* function definition */\nvoid func( void )\n{\nstatic int i = 5;\
    \ /* local static variable */\ni++;\nprintf(\"i is %d and count is %d\\n\", i,\
    \ count);\n}\n```\n\nThe above sample program containing the storage class `static`\
    \ yields the following result:\ni is 6 and count is 4\ni is 7 and count is 3\n\
    i is 8 and count is 2\ni is 9 and count is 1\ni is 10 and count is 0\n\n## Extern\n\
    \nThis storage class is used to provide a global variable reference that can be\
    \ seen in all program files. So whenever you use `extern`, you cannot initialize\
    \ the variable because all it can do is point the name of the variable towards\
    \ a specific storage location in which it has been defined before.\n\nIf you have\
    \ several files but you want to define a global function or variable that you\
    \ intend to use in your other files as well, you can use `extern` to provide a\
    \ function or variable reference. You should keep in mind that `extern` is for\
    \ declaring a global function or variable in another file. If there are several\
    \ files that share similar global functions or variables, the `extern` modifier\
    \ is used. Consider this example:\n\n**First File: main.c**\n```c\n#include <stdio.h>\n\
    int count ;\nextern void write_extern();\nmain()\n{\nwrite_extern();\n}\n```\n\
    \n**Second File: write.c**\n```c\n#include <stdio.h>\nextern int count;\nvoid\
    \ write_extern(void)\n{\ncount = 5;\nprintf(\"count is %d\\n\", count);\n}\n```\n\
    \nIn this example, `extern` is defined in the first file and is used to declare\
    \ `count` in the second file. If you compile both files as:\n`$gcc main.c write.c`\n\
    You can have the results of 5\n\n# Chapter 6 Operators\n\nOperators are symbols\
    \ that tell you to perform certain logical or mathematical manipulations. In the\
    \ C language, there are plenty of built-in operators such as arithmetic, relational,\
    \ logical, bitwise, assignment, and misc.\n\n## Arithmetic Operators\n\nLet `A\
    \ = 10` and `B = 20`.\n\n| Operator | Description | Example |\n| :--- | :--- |\
    \ :--- |\n| `+` | adds two operands. | `A + B = 30` |\n| `-` | subtracts the second\
    \ operand from the first operand. | `A - B = -10` |\n| `*` | multiplies the operands.\
    \ | `A * B = 200` |\n| `/` | divides the numerator by the denominator. | `B /\
    \ A = 2` |\n| `%` | it is a modulus operator. It gives the remainder after an\
    \ integer division. | `B % A = 0` |\n| `++` | it is an increment operator. It\
    \ increases the value. | `A++ = 11` |\n| `--` | it is a decrement operator. It\
    \ decreases the value. | `A-- = 9` |\n\n## Relational Operators\n\nLet `A = 10`\
    \ and `B = 20`.\n\n| Operator | Description | Example |\n| :--- | :--- | :---\
    \ |\n| `==` | checks whether not the values of both operands are equal. If they\
    \ are equal, then the condition is true. | `A == B` is not true |\n| `!=` | checks\
    \ whether not the values of both operands are equal. If they are not equal, then\
