    The `double` data type is used for storing real numbers that have double precision.
    Memory space used is 8 bytes. `Double` data type uses `long` as a type modifier.
    This uses up memory storage space of 10 bytes.


    The `void` data type is used for specifying empty sets, which do not contain any
    value. Hence, `void` data type also occupies no space (0 bytes) in the memory
    storage.


    ### `_Bool`

    This is a Boolean type of data. It is an unsigned type of integer. It stores only
    2 values, which is 0 and 1. When using `_Bool`, include `<stdbool.h>`.


    ### `_Complex`

    This is used for storing complex numbers. In C, three types of `_Complex` are
    used. There is the `float _Complex`, `double _Complex`, and `long double _Complex`.
    These are found in `<complex.h>` file.


    ### Arrays

    This identifier is used in referring to the collection of data that share the
    same name and of the same type of data. For example, all integers or all characters
    that have the same name. Each of the data is represented by its own array element.
    The subscripts differentiate the arrays from each other.


    ### Constants

    Constants are identifiers used in C. The values of identifiers do not change anywhere
    within the program. Constants are declared this way:


    ```c

    const datatype varname = value

    ```


    `const` is the keyword that denotes or declares the variable as the fixed value
    entity, i.e., the constant.


    In C, there are 4 basic constants used. These include the integer constant, floating-point,
    character and string constants. Floating-point and integer types of constant do
    not contain any blank spaces or commas. Minus signs can be used, which denotes
    negative quantities.


    #### Integer Constants

    Integer constants are integer valued numbers consisting of sequence of digits.
    These can be written using 3 different number systems, namely, decimal, octal
    and hexadecimal.


    ##### Decimal system (base 10)

    An integer constant written in the decimal system contains combinations of numbers
    ranging from 0 to 9. Decimal constants should start with any number other except
    0. For example, a decimal constant is written in C as:


    ```c

    const int size = 76

    ```


    ##### Octal (base 8)

    Octal constants are any number combinations from 0 to 7. To identify octal constants,
    the first number should be 0. For example:


    ```c

    const int a = 043; const int b = 0;

    ```


    An octal constant is denoted in the binary form. Take the octal `0347`. Each digit
    is represented as:

    `0347 = 011 100 111 = 3 * 8^2 + 4 * 8^1 + 7 * 8^0 = 231`


    ##### Hexadecimal constant (base 16)

    This type consists of any of the possible combinations of digits ranging from
    0 to 9. This type also includes letters a to f, written in either lowercase or
    uppercase. To identify hexadecimal constants, these should start with `0X` or
    `0X`. For example:


    ```c

    const int c = 0x7FF;

    ```


    For example, the hexadecimal number `0x2A5` is internally represented in bit patterns
    within C as:

    `0x2A5 = 0010 1010 0101 = 2 * 16^2 + 10 * 16^1 + 5 * 16^0 = 677`


    Wherein, `677` is the decimal equivalent of the hexadecimal number `0x2`.


    Prefixes for integer constants can either be long or unsigned. A long integer
    constant (`long int`) ends with `L`, such as `67354L` or `67354l`. The last portion
    of an unsigned long integer constant should either be `UL` or `ul`, such as `672893UL`
    or `672893ul`. For an unsigned long long integer constant, `ULL` or `ull` should
    be at the last portion. An unsigned constant should end with `U` or `u`, such
    as `673400095u` or `673400095U`. Normal integer constants are written without
    any suffix, such as a simple `67458`.


    #### Floating Point Constant

    This type of constant has a base 10 or base 16 and contains an exponent, a decimal
    point or both. For a floating point constant with a base 10 and a decimal point,
    the base is replaced by `E` or `e`. For example, the constant `1.8 * 10^-3` is
    written as `1.8e-3` or `1.8E-3`.


    For hexadecimal character constants and the exponent is in the binary form, the
    exponent is replaced by `P` or `p`. Take a look at this example: This type of
    constant is often precision quantities. These occupy around 8 bytes of memory.
    Different add-ons are allowed in some C program versions, such as `F` for a single
    precision floating constant or `L` for a long floating point type of constant.


    #### Character Constant

    A sequence of characters, whether single or multiple ones, enclosed by apostrophes
    or single quotation marks is called a character constant. The character set in
    the computer determines the integer value equivalent to each character constant.
    Escape sequences may also be found within the sequence of a character constant.


    Single character constants enclosed by apostrophes is internally considered as
    integers. For example, `''A''` is a single character constant that has an integer
    value of 65. The corresponding integer value is also called the ASCII value. Because
    of the corresponding numerical value, single character constants can be used in
    calculations just like how integers are used. Also, these constants can also be
    used when comparing other types of character constants.


    Prefixes used in character constants such as `L`, `U`, or `u` are used for character
    literals. These are considered as wide types of character constants. Character
    literals with the prefix `L` are considered under the type `wchar_t`, which are
    defined as `<stddef.h>` under the header file. Character constants that use the
    prefix `U` or `u` are considered as type `char16_t` or `char32_t`. These are considered
    as unsigned types of characters and are defined under the header file as `<uchar.h>`.


    Those do not have the prefix `L` are considered a narrow or ordinary character
    constant. Those that have escape sequences or are composed of at least 2 characters
    are considered as multicharacter constants.


    Escape sequences are a type of character constant used in expressing non-printing
    characters like carriage return or tab. This sequence always begins with a backward
    slash, followed by special characters. These sequences represent a single character
    in the C language even if they are composed of more than 1 character. Examples
    of some of the most common escape sequences, and their integer (ASCII) value,
    used in C include the following:


    | Escape Sequence | ASCII Value |

    | :--- | :--- |

    | Backspace (`\b` ) | 8 |

    | Bell (`\a` ) | 7 |

    | Newline (`\n` ) | 10 |

    | Null (`\0` ) | 0 |

    | Carriage (`\r` ) | 13 |

    | Horizontal tab (`\t` ) | 9 |

    | Vertical tab (`\v` ) | 11 |

    | Form feed (`\f` ) | 12 |


    String Literals

    Multibyte characters that form a sequence are called string literals. Multibyte
    characters have bit representations that fit into 1 or more bytes. String literals
    are enclosed within double quotation marks, for example, "A" and "Anna". There
    are 2 types of string literals, namely, UTF-8 string literals and wide string
    literals. Prefixes used for wide string literals include `u`, `U`, or `L`.


    Additional characters or extended character sets included in string literals are
    recognized and supported by the compiler. These additional characters can be used
    meaningfully to further enhance character constants and string literals.

