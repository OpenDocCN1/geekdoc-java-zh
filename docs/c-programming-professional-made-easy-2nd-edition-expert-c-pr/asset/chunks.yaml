    `double` 数据类型用于存储具有双倍精度的实数。占用的内存空间 8 字节。`Double` 数据类型使用 `long` 作为类型修饰符。这会占用 10
    字节的内存存储空间。


    `void` 数据类型用于指定空集合，它不包含任何值。因此，`void` 数据类型在内存存储中也不占用任何空间（0 字节）。


    ### `_Bool`

    这是一种布尔类型数据。它是一种无符号整数类型。它只存储 2 个值，即 0 和 1。使用 `_Bool` 时，请包含 `<stdbool.h>`。


    ### `_Complex`

    这用于存储复数。在 C 语言中，使用了三种 `_Complex` 类型：`float _Complex`、`double _Complex` 和 `long
    double _Complex`。这些可以在 `<complex.h>` 文件找到。


    ### 数组

    该标识符用于引用具有相同名称和相同数据类型的数据集合。例如，所有相同名称的整数或字符。每条数据都由其自身的数组元素表示。下标用于区分不同的数组。


    ### 常数

    常量是 C 语言中使用的标识符。标识符的值在程序的任何地方都不会改变。常量的声明方式如下：


    ```c

    const datatype varname = value

    ```


    `const` 是表示或声明变量为固定值实体（即常量）的关键字。


    在 C 语言中，有 4 种基本常量被使用。这些包括整数常量、浮点常量、字符常量和字符串常量。浮点型和整数类型的常量不包含任何空格或逗号。可以使用负号，表示负数。


    #### 整数常量

    整数常量是由数字序列组成的整数值数字。可以使用 3 种不同的数字系统编写，即十进制、八进制和十六进制。


    ##### 十进制（基数为 10）

    以十进制编写的整数常量包含 0 到 9 的数字组合。十进制常量应以除 0 以外的任何数字开头。例如，C 中的十进制常量写为：


    ```c

    const int size = 76

    ```


    ##### 八进制（基数为 8）

    八进制常量是 0 到 7 之间的任何数字组合。要识别八进制常量，第一个数字应该是 0。例如：


    ```c

    const int a = 043; const int b = 0;

    ```


    八进制常量以二进制形式表示。以八进制 `0347` 为例，每个数字表示为：

    `0347 = 011 100 111 = 3 * 8² + 4 * 8¹ + 7 * 8⁰ = 231`


    ##### 十进制常量（基数为 16）

    该类型由 0 到 9 的任何可能的组合组成。该类型还包括字母 a 到 f，可以用小写或大写字母。要识别十六进制常量，它们应该以 `0x` 或 `0X` 开头。例如：


    ```c

    const int c = 0x7FF;

    ```


    例如，十六进制数 `0x2A5` 在 C 语言内部通过位模式表示为：

    `0x2A5 = 0010 1010 0101 = 2 * 16² + 10 * 16¹ + 5 * 16⁰ = 677`


    其中，`677` 是十六进制数 `0x2` 的十进制等值。


    整数常量的前缀可以是 `long` 或 `unsigned`。长整数常量 (`long int`) 以 `L` 结尾，例如 `67354L` 或 `67354l`。无符号长整数常量的最后部分应该是
    `UL` 或 `ul`，例如 `672893UL` 或 `672893ul`。对于无符号长整数常量，最后部分应为 `ULL` 或 `ull`。无符号常量应以
    `U` 或 `u` 结尾，例如 `673400095u` 或 `673400095U`。普通整数常量不带任何后缀，例如简单的 `67458`。


    #### 浮点常量

    这种类型的常量基数为 10 或 16，并包含一个指数、小数点或两者兼有。对于基数为 10 且带有小数点的浮点常量，基数被 `E` 或 `e` 替换。例如，常量
    `1.8 * 10^-3` 写为 `1.8e-3` 或 `1.8E-3`。


    对于十六进制字符常量且指数为二进制形式的情况，指数被 `P` 或 `p` 替换。看这个示例：这种类型的常量通常是精度数值。它们占用大约 8 字节内存。在某些
    C 程序版本中允许不同的后缀，例如单精度浮点常量的 `F` 或长位浮点类型常量的 `L`。


    #### 字符常量

    由单引号包围的单个或多个字符序列序列称为字符常量。计算机中的字符集决定了每个字符常量等值的整数值。在字符常量序列中还可能发现转义序列。


    单引号包围的单字符常量在内部被视为整数。例如，`''A''` 是一个整数值为 65 的单字符常量。对应的整数值也称为 ASCII 值。由于有了相应的数值值，单字符常量可以像整数一样用在计算中。此外，这些常量也可以用于比较其他类型的字符常量。


    字符常量中使用的前缀如 `L`、`U` 或 `u` 用于字符字面量。这些被视为宽类型字符常量。带有前缀 `L` 的字符字面量被视为类型 `wchar_t`，定义在头文件
    `<stddef.h>` 中。使用前缀 `U` 或 `u` 的字符常量被视为 `char16_t` 或 `char32_t` 类型。这些被视为无符号字符，定义在头文件
    `<uchar.h>` 中。


    没有前缀 `L` 的被窄或普通字符常量。具有转义序列或由至少 2 个字符组成的被视为多字符常量。


    转义序列是一种用于表示如回车或制表符等非打印字符的字符常量。该序列始终反斜杠开头，后跟特殊字符。这些序列在 C 语言中表示单个字符，即使它们由多个字符组成。C
    语言中一些常用的转义序列及其对应的整数（ASCII）值如下：


    | 转义序列 | ASCII 值 |

    | :--- | :--- |

    | 退格 (`\b` ) | 8 |

    | 响铃 (`\a` ) | 7 |

    | 换行 (`\n` ) | 10 |

    | 空字符 (`\0` ) | 0 |

    | 回车 (`\r` ) | 13 |

    | 水平制表 (`\t` ) | 9 |

    | 垂直制表 (`\v` ) | 11 |

    | 换页 (`\f` ) | 12 |


    字符串字面量

    形成序列的多字节字符构称为字符串字面量。多字节字符的位表示适用于 1 个或多个字节。字符串字面量由双引号包围，例如 "A" 和 "Anna"。有两种类型的字符串字面量，即
    UTF-8 字符串字面量和宽字面量。宽字面量使用的前缀包括 `u`、`U` 或 `L`。


    字符串字面量包含的额外字符或扩展字符集会被编译器识别并支持。这些额外字符可以意义地进一步增强字符常量和字符串字面量。

