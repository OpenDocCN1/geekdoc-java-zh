    # 引言


    我想感谢你的下载，并祝贺你下载了《专业 C 编程精从入门：任何计算机用户都能在一天内精通 C 编程语言！》。


    这本书包含了关于如何理解和执行 C 编程的经过验证的步骤和策略。`C` 是用于广泛应用程序的最基础编程工具之一。大多数人避开它，是因为这种语言看起来很复杂，充满了各种字符、字母、序列和特殊符号。


    本书将拆解每一个元素，并详细解释`C`程序使用的每种语言。当你读完这本书时，`C`编程语言将变得易于理解且易于执行。


    继续读下去并学习吧。


    再次感谢下载本书。希望你喜欢它！


    # 第 1 章 C 的基本元素


    看似复杂的`C`程序由以下基本元素组成：


    ### 字符集


    `C`语言中使用了大小写字母。也使用了`0-9`数字，包括空格和一些特殊字符。这些字符通过不同的组合形成基础`C`程序的元素，如表达式、常量、`变量`等。


    特殊字符包括：

    `+` `,` `.` `*` `–` `/` `%` `=` `&` `!` `#` `?` `"` `^` `''` `|` `(` `)` `<` `>`
    `{` `}` `[` `]` `:` `;` `@` `~!`


    空白字符包括：

    - 空格

    - 回车符

    - 水平制表符

    - 换页

    - 换行符


    ### 标识符


    标识符是赋予程序中各种元素的名称，例如数组、变量和函数。它们包含各种排列的数字和字母。然而，标识符始终以字母开头。字母可以是大写、小写或两者兼有。但是，它们不是互换的。`C`编程是区分大小大小的，因为不同大小写的每个字母被视为相互独立的。程序允许使用下划线，因为程序将其视为字母的一种。


    有效标识符的示例包括：

    - `ab123`

    - `stud_name`

    - `average`

    - `velocity`

    - `TOTAL`


    标识符需要以字母开头，且不应包含非法字符。无效标识符的示例包括：

    - `2nd` - 应该始终以字母开头

    - `"Jamshedpur"` - 包含非法字符（`"`）

    - `stud name` - 包含空格，这是一个非法字符

    - `stud-name` - 包含非法字符（`-`）


    在`C`中，单个标识符可以用于引用同一个`C`程序中的多个不同实体。例如，数组和变量可以共享一个标识符。例如：


    变量是 `int difference`。


    数组是 `int difference[5]`。


