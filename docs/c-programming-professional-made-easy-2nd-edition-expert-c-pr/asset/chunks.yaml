  trans: "\n\n这是一个非常有用的循环，可以确保至少运行一次。`FOR` 和 `WHILE` 循环在循环开始时检查条件，这确保了它们不会立即通过或失败。`DO…WHILE`\
    \ 循环会在循环结束后检查条件。这确保了循环在通过或失败之前至少会运行一次。\n\n看下这个示例：\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n  int y;\n  y = 10;\n  do {\n    printf(\"This loop is running!\\\
    n\");\n  } while ( y != 10 );\n  getchar();\n}\n```\n\n这种循环无论条件结果是 TRUE 还是 FALSE\
    \ 都会显示消息。变量 `y` 被设置为 10。`WHILE` 循环被设置为当 `y` 值不等于 10 时运行，此时循环结束。消息之所以被打印，是因为在循环结束之前并不会检查条件。\n\
    \n`DO..WHILE` 循环的 `WHILE` 部分必须以分号结尾。这也是循环以这种方式结束的唯一实例。\n\n# 第 5 章 存储类\n\n存储类指的是函数和变量在\
    \ C 程序中的生命周期和可见性。这些限定符位于它们所修改的类型之前。C 程序中一些常用的存储类包括 `auto`、`static`、`register`\
    \ 和 `extern`。那么，这些存储类是如何使用的呢？\n\n## Auto\n\n这种存储类被认为是所有局部变量的默认存储类。考虑这个示例：\n\n\
    ```c\n{\nint mount;\nauto int month;\n}\n```\n\n上面的示例具有相似存储类的变量。请注意，`auto` 只能在函数内部使用，例如局部变量。\n\
    \n## Register\n\n这种存储类通常用于必须存储在寄存器而不是 RAM 中的局部变量。变量的大小应该小于或等于寄存器的大小。它不应该使用一元运算符\
    \ `&`，因为它不包含内存。看下这个示例：\n\n```c\n{\nregister int kilometers;\n}\n```\n\n请记住，`register`\
    \ 存储类只有在与像计数器等快速访问的变量配合使用时才会起作用。此外，你应该注意，这种存储类并不一定将变量存储在寄存器中。相反，它根据某些限制和硬件的实现提供了将该变量存储在寄存器中的可能性。\n\
    \n## Static\n\n这种存储类命令编译器在整个程序生命周期内保存局部变量，而不是每次进入和离开范围时将其销毁并创建。将你的局部变量变为 `static`\
    \ 允许它们在函数调用之间保留其值。\n\n此外，你对全局变量使用 `static` 修饰符。如果你这样做，变量的作用范围可以在声明它的文件中进行限制。请记住，如果你在类数据成员上使用\
    \ `static`，那么它所有的类对象都可以共享该成员的一个唯一拷贝。\n\n```c\n#include <stdio.h>\n\n/* 函数声明 */\n\
    void func(void);\n\nstatic int count = 5; /* 全局变量 */\n\nmain()\n{\nwhile(count--)\n\
    {\nfunc();\n}\nreturn 0;\n}\n\n/* 函数定义 */\nvoid func( void )\n{\nstatic int i\
    \ = 5; /* 局部静态变量 */\ni++;\nprintf(\"i is %d and count is %d\\n\", i, count);\n\
    }\n```\n\n上述包含存储类 `static` 的示例程序产生以下结果：\ni is 6 and count is 4\ni is 7 and count\
    \ is 3\ni is 8 and count is 2\ni is 9 and count is 1\ni is 10 and count is 0\n\
    \n## Extern\n\n这种存储类用于提供一个可以在所有程序文件中可见的全局变量引用。因此，每当你使用 `extern` 时，你不能初始化该变量，因为它所做的只是将变量名指向之前定义过的特定存储位置。\n\
    \n如果你有多个文件，但你想定义一个打算在其他文件中也使用的全局函数或变量，你可以使用 `extern` 来提供函数或变量引用。你应该记住，`extern`\
    \ 用于在另一个文件中声明全局函数或变量。如果有多个文件共享相似的全局函数或变量，则使用 `extern` 修饰符。考虑这个示例：\n\n**第一个文件：main.c**\n\
    ```c\n#include <stdio.h>\nint count ;\nextern void write_extern();\nmain()\n{\n\
    write_extern();\n}\n```\n\n**第二个文件：write.c**\n```c\n#include <stdio.h>\nextern\
    \ int count;\nvoid write_extern(void)\n{\ncount = 5;\nprintf(\"count is %d\\n\"\
    , count);\n}\n```\n\n在这个示例中，`extern` 定义在第一个文件中，并用于在第二个文件中声明 `count`。如果你按如下方式编译两个文件：\n\
    `$gcc main.c write.c`\n你可以得到结果 5\n\n# 第 6 章 运算符\n\n运算符是告诉你要执行某些逻辑或数学操作的符号。在 C\
    \ 语言中，有很多内置运算符，如算术、关系、逻辑、位、赋值和杂项。\n\n## 算术运算符\n\n假设 `A = 10`  `B = 20`。\n\n| 运算符\
    \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 将两个操作数加。 | `A + B = 30` |\n| `-`\
    \ | 从第一个操作数减去第二个操作数。 | `A - B = -10` |\n| `*` | 操作数相乘。 | `A * B = 200` |\n| `/`\
    \ | 被除数除以除数。 | `B / A = 2` |\n| `%` | 取模运算符。整数除法的余数。 | `B % A = 0` |\n| `++` |\
    \ 递增运算符。增加值。 | `A++ = 11` |\n| `--` | 递减运算符。减少值。 | `A-- = 9` |\n\n## 关系运算符\n\n\
    假设 `A = 10` 和 `B = 20`。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `==` |\
    \ 检查两个操作数是否相等。如果相等，则条件为真。 | `A == B` 为假 |\n| `!=` | 检查两个操作数是否相等。如果不相等，则条件为真。 |\
    \ `A != B` 为真 |\n| `>` | 检查左操作数的值是否大于右操作数的值。如果是，则条件为真。 | `A > B` 为假 |\n| `<` |\
    \ 检查左操作数的值是否小于右操作数的值。如果是，则条件为真。 | `A < B` 为真 |\n| `>=` | 检查左操作数的值是否大于或等于右操作数的值。如果是，则条件为真。\
    \ | `A >= B` 为假 |\n| `<=` | 检查左操作数的值是否小于或等于右操作数的值。如果是，则条件为真。 | `A <= B` 为真 |\n\
    \n## 逻辑运算符\n\n假设 `A = 1` 和 `B = 0`。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :---\
    \ |\n| `&&` | 逻辑与运算符。如果操作数均为非零，则条件为真。否则，为假。 | `A && B` 为假 |\n| `\\|` | 逻辑或运算符。如果两个操作数中有一个非零，则条件为真。\
    \ | `A \\| B` 为真 |\n\n"
- fmt: "\n| ! | It is known as the Logical NOT Operator. It is used to reverse the\
    \ logical state of the operand. If the condition is true, the Logical NOT Operator\
    \ will make it false. | `!(A && B)` is true. |\n\n## Bitwise Operators\n\nThese\
    \ operators work on bits and perform bit-by-bit operation. This is the Truth Table\
    \ for `|`, `^`, and `&`.\n\n| p | q | p & q | p \\| q | p ^ q |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| 0 | 0 | 0 | 0 | 0 |\n| 0 | 1 | 0 | 1 | 1 |\n| 1 |\
    \ 1 | 1 | 1 | 0 |\n| 1 | 0 | 0 | 1 | 1 |\n\nIf `A = 6` and `B = 13`:\n\n```\n\
    A = 00111100\nB = 00001101\n```\n\n- `A & B = 00001100`\n- `A | B = 00111101`\n\
    - `A ^ B = 00110001`\n- `~A = 11000011`\n\nLet `A = 60` and `B = 13`.\n\n| Operator\
    \ | Description | Example |\n| :--- | :--- | :--- |\n| `&` | It is known as the\
    \ Binary AND Operator. It copies a bit if it exists in both operands. | `(A &\
    \ B) = 12`, which is equivalent to `00001100` in binary. |\n| `\\|` | It is known\
    \ as the Binary OR Operator. It copies a bit if it exists in either one of the\
    \ operands. | `(A \\| B) = 61`, which is equivalent to `00111101` in binary. |\n\
    | `^` | It is known as the Binary XOR Operator. It copies a bit if it exists in\
    \ just one operand. | `(A ^ B) = 49`, which is equivalent to `00110001` in binary.\
    \ |\n| `~` | It is known as the Binary Ones Complement Operator. It is unary and\
    \ has the flipping bits effect. | `(~A) = -60`, which is equivalent to `11000011`\
    \ in binary. |\n| `<<` | It is known as the Binary Left Shift Operator. The value\
    \ of the left operand is moved to the left depending on how many bits the right\
    \ operand specified. | `A << 2 = 240`, which is equivalent to `11110000` in binary.\
    \ |\n| `>>` | It is known as the Binary Right Shift Operator. The value of the\
    \ left operand is moved to the right depending on how many bits the right operand\
    \ specified. | `A >> 2 = 15`, which is equivalent to `00001111` in binary. |\n\
    \n## Assignment Operators\n\n| Operator | Description | Example |\n| :--- | :---\
    \ | :--- |\n| `=` | It is an assignment operator. It allocates values from the\
    \ right operand to the left operand. | `C = A + B` assigns the value of `A + B`\
    \ into `C`. |\n| `+=` | It is known as the add AND assignment operator. It adds\
    \ the right operand to the left operand and then assigns the value to the left\
    \ operand. | `C += A` is equal to `C = C + A` |\n| `-=` | It is known as the subtract\
    \ AND assignment operator. It subtracts the right operand from the left operand\
    \ and then assigns the value to the left operand. | `C -= A` is equal to `C =\
    \ C – A` |\n| `*=` | It is known as the multiply AND assignment operator. It multiplies\
    \ the right operand with the left operand and then assigns the value to the left\
    \ operand. | `C *= A` is equal to `C = C * A` |\n| `/=` | It is known as the divide\
    \ AND assignment operator. It divides the left operand with the right operand\
    \ and then assigns the result to the left operand. | `C /= A` is equal to `C =\
    \ C/A` |\n| `%=` | It is known as the modulus AND assignment operator. It takes\
    \ modulus using two operands and assigns the result to the left operand. | `C\
    \ %= A` is equal to `C = C % A` |\n| `<<=` | It is known as the left shift AND\
    \ assignment operator. | `C <<= 2` is equal to `C = C << 2` |\n| `>>=` | It is\
    \ known as the right shift AND assignment operator. | `C >>= 2` is equal to `C\
    \ = C >> 2` |\n| `&=` | It is known as the bitwise AND assignment operator. |\
    \ `C &= 2` is equal to `C & 2` |\n| `^^` | It is known as the bitwise exclusive\
    \ OR and assignment operator. | `C ^= 2` is equal to `C ^ 2` |\n| `\\|=` | It\
    \ is known as the bitwise inclusive OR and assignment operator. | `C \\|= 2` is\
    \ equal to `C \\| 2` |\n\n## Chapter 7 Decision Making\n\nThe structures for decision\
    \ making require you to specify at least one condition to be tested or evaluated\
    \ by the program, along with statements that have to be executed if the condition\
    \ is found to be true. However, statements that were found to be false can also\
    \ be executed optionally. The general form of a decision making structure in most\
    \ programming languages looks something like the example given below:\n\n![](images/00001.jpeg)\n\
    \nThe C programming language assumes all non-null and non-zero values to be true.\
    \ If there is either a null or zero, C assumes it to be false. The C programming\
    \ language also makes use of the following decision making statements:\n\n###\
    \ The If Statement\n\nAn if statement consists of a Boolean expression that is\
    \ followed by at least one more statement.\n\n#### Syntax\n\nThe syntax of an\
    \ if statement is generally:\n\n```\nif (Boolean expression)\n```\n\nThe C programming\
    \ language assumes all non-null and non-zero values to be true. If there is either\
    \ a null or zero, C assumes it to be false.\n\nThe syntax of an if statement is\
    \ generally:\n\n```\nif (Boolean expression)\n{\n    // statements to be executed\
    \ if true\n}\n```\n\nIf the condition is found to be true, the statements inside\
    \ the block are executed. If the condition is found to be false, the block is\
    \ skipped.\n\n#### Example\n\n```c\n#include <stdio.h>\nint main() {\n    int\
    \ a = 10;\n    if (a < 20) {\n        printf(\"a is less than 20\\n\");\n    }\n\
    \    return 0;\n}\n```\n\n### If Else Statement\n\nAn if statement can be followed\
    \ by an else statement, which is optional. If the condition is found to be false,\
    \ the else block is executed.\n\n#### Syntax\n\nThe syntax of an if else statement\
    \ is:\n\n```\nif (Boolean expression)\n{\n    // statements executed if true\n\
    }\nelse\n{\n    // statements executed if false\n}\n```\n\n#### Example\n\n```c\n\
    #include <stdio.h>\nint main() {\n    int a = 25;\n    if (a < 20) {\n       \
    \ printf(\"a is less than 20\\n\");\n    } else {\n        printf(\"a is not less\
    \ than 20\\n\");\n    }\n    return 0;\n}\n```\n\n### If, Else If, Else Statement\n\
    \nAn if statement can be followed by an else if, else statement. This statement\
    \ is highly useful for testing different conditions using a single if structure.\n\
    \n#### Syntax\n\nThe general syntax of an if, else if, else statement is:\n\n\
    ```c\nif (first Boolean expression)\n{\n    // executes if the first expression\
    \ is true\n}\nelse if (second Boolean expression)\n{\n    // executes if the second\
    \ expression is true\n}\nelse if (third Boolean expression)\n{\n    // executes\
    \ if the third expression is true\n}\nelse\n{\n    // executes if none of the\
    \ above conditions is true\n}\n```\n\n#### Example\n\n```c\n#include <stdio.h>\n\
    int main() {\n    int a = 20;\n    if (a == 10) {\n        printf(\"the value\
    \ of a is 10\\n\");\n    } else if (a == 20) {\n        printf(\"the value of\
    \ a is 20\\n\");\n    } else if (a == 30) {\n        // this part is not reached\n\
    \    }\n    return 0;\n}\n```\n"
