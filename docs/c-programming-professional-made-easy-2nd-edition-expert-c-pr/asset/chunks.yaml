    # Android 应用开发


    Android 应用开发并不容易。你必须在程序开发方面拥有一些过硬背景。如果你了解 `Visual Basic` 和 `Java`，那将是一个加分项。如果你熟悉或已经使用过
    `Eclipse` 的 IDE（集成开发环境），那绝对将是一个巨大的优势。此外，熟悉 `XML`也会对你有所帮助。


    在开始开发应用之前，你需要准备一些东西。


    ## 1. 高端电脑

    首先，你需要一台高端电脑。通常情况下，其他编程开发工具包不需要强大的电脑就能创建应用程序。然而，为 Android 编写程序略有不同。你需要更多的计算能力来运行
    `Android emulators`（Android 模拟器），这些是允许你在计算机上测试程序的程序。


    使用没有良好处理器和足够 `RAM` 的弱性能电脑只会让你难以运行这些模拟器。即使你能够运行它，它的运行速度也会很慢。


    ## 2. Android 设备

    其次，你需要一台 Android 设备。该设备将成为你的 Beta 测试员。通过它，你将知道程序在 Android 设备上的表现。在选择测试设备时，请确保它与你应用目标市场的设备水平相当。如果你针对的是平板电脑用户，请使用平板电脑；如果你针对的是智能手机，请使用智能手机。


    ## 3. Android SDK

    第三，你需要来自 Google 的 `Android SDK`（软件开发工具包）。SDK 是一组文件和程序，允许你创建并编译程序代码。在编写本文时，最新的
    `Android SDK` 文件大小约为 350mb。下载它需要 15 到 30 分钟。如果你解压缩了 `Android SDK` 文件，它将占用你电脑大约
    450mb 的磁盘空间。下载页面链接为：http://developer.android.com/sdk/index.html


    SDK 可以运行在 `Windows XP`、`Windows 7`、`Mac OSX 10.8.5`（或更高版本）以及运行 32 位应用并带有 `glibc`（GNU
    C 库）2.11 或更高版本的 `Linux` 发行版上。


    一旦你解压了下载的文件，打开 `SDK Manager`。该程序是开发工具包的更新工具。为了确保你拥有组件的最新版本，请定期运行管理器并下载这些更新。此外，你还可以使用
    `SDK Manager` 下载旧版本的 SDK。如果你想为带有旧版 Android 系统的设备编写程序，就必须这样做。


