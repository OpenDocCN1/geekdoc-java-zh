    对于 HTML5 应用，虽然几乎所有的安全措施都需要在服务端实现，但仍有几种类型的客户端攻击是您需要注意的并在编写代码时进行防范的，以避免您的应用程序被黑客利用。这些攻击类型包括跨站脚本、跨站请求伪造和点击劫持。您还需要对应用程序的身份验证和授权实践有基本的了解，最后，还需要掌握在进行客户端安全编码时应始终遵循的一些常识做法。


    ## 跨站脚本


    跨站脚本（`XSS`）是 Web 应用中最常见的安全漏洞之一。实际上有三种 XSS 攻击：反射型、存储型和基于 DOM 的。反射和存储型 XSS 攻击是服务端攻击，必须在应用程序服务器或
    Web 服务器上处理；而基于 DOM 的 XSS 攻击是客户端攻击，必须由客户端开发者解决。


    当 Web 应用在没有先对输入进行适当验证或编码的情况下，将用户输入整合到生成的输出中，就会发生 `XSS`。来自最终用户（例如表单输入）或数据连接（例如
    REST 服务）的数据被视为不可信数据。这些数据不是你作为应用程序的一部分创建的，因此你无法验证它们是否来自受信源。你需要防范的就是这些不可信数据。


    理解 `XSS` 的最佳方法是看一些示例。虽然本节的重点是客户端安全，但服务端 `XSS` 攻击最理解，因此接下来提供了两个服务端 `XSS` 攻击的示例，随后是一个客户端示例。


    对于第一个示例，假设你决定为 404（文件未找到）错误创建一个自定义错误页面。当有人输入类似于![image](img/00016.jpg)![image](img/00120.jpg)
    的 URL 时，错误页面会返回一条消息，说明在服务器上未找到 `not-here` 文件。如果错误消息中显示的数据在浏览器读取之前没有经过适当转义，就会发生
    `XSS` 漏洞，在这种情况下，攻击者可以执行如下操作：![image](img/00016.jpg)![image](img/00121.jpg)。浏览器在解析数据并将其作为错误消息的一部分显示时，会执行
    `<script>`。


    对于第二个示例，假设你的 Web 应用有一个搜索框。当用户进行搜索时，搜索结果将在一个单独的结果页面上显示。如果结果页面使用了非常常见的模式“找到关于：x
    个结果找到：<显示所搜索的内容>”，并且没有对搜索字符串进行适当的编码，就会发生 `XSS` 漏洞。如果恶意用户输入了类似于上一个示例中 `<script>`
    块的搜索字符串，那么当搜索结果页面在浏览器中加载时，JavaScript 将被执行。


    上述两个示例通常都在服务端管理，因为错误页面和搜索结果页面通常在服务器上生成。如前所述，第三种 `XSS` 攻击是纯粹的客户端攻击，涉及到 JavaScript
    如何处理 DOM 元素的执行。


    为了演示基于 DOM 的 `XSS` 攻击如何工作，我们将使用一个与之前的搜索字段示例相似的例子。假设你的 HTML5 Web 应用有一个表单，包含一个请求用户用户名的输入字段。表单还包含一个
    `<div>`元素，当用户按下回车键时，该元素将更新以显示用户在输入字段中键入的任何内容。列表 6-1 显示了此示例的代码。![image](img/00016.jpg)

    列表 6-1 表单示例![image](img/00012.jpg)![image](img/00122.jpg)


    你想将此 `<div>` 元素的内容设置为输入 `userName` 输入字段的字符串值。使用纯 JavaScript 执行此操作可能像列表 6-2。![image](img/00016.jpg)

    列表 6-2 innerHTML 示例![image](img/00012.jpg)![image](img/00123.jpg)


    列表 6-2 中所示代码将可以正常工作。然而，通过使用 `<div>` 元素的 `.innerHTML` 属性，你让自己暴露在了基于 DOM 的 `XSS`
    攻击之下。如果恶意用户输入了一个类似于![image](img/00016.jpg)![image](img/00124.jpg) 的字符串，HTML 将按原样添加到
    DOM 中，下次有人将鼠标移动到新的 `<div>` 元素上时，JavaScript 将被执行。


    在处理不可信数据时，您应该避免某些 DOM 属性和方法。部分列表包括![image](img/00007.jpg)：


    - `element.innerHTML`

    ![image](img/00007.jpg)

    - `document.write()`

    ![image](img/00007.jpg)

    - `document.writeln()`

    ![image](img/00007.jpg)

    - `eval()`

    ![image](img/00007.jpg)

    - `eventHandlers`

    ![image](img/00007.jpg)

    - `.setTimeout`

    ![image](img/00007.jpg)

    - `.setInterval`

    ![image](img/00007.jpg)

    - `new function()`


    通常，如果你正在处理不可信数据，请设置 HTML 以便你可以使用元素的 `.textContext` 方法，如列表 6-3 所示，而不是直接添加 HTML。![image](img/00016.jpg)

    列表 6-3 textContext 示例![image](img/00012.jpg)![image](img/00125.jpg)


    如果你必须将不可信数据允许到被 JavaScript 或 HTML 解析器执行的上下文中那么你应该学习如何可以使用许多 HTML 和 JavaScript
    编码器。你可以尝试自己编写编码器，但这样做可能很困难，因为每个浏览器的 JavaScript 引擎处理方式略有不同。使用由受信安全团队开发的编码器，例如来自开放
    Web 安全项目 (OWASP) 团队的企业安全 API (ESAPI)。


    你还应该意识到，使用 jQuery 等 JavaScript 框架存在相同的问题。使用如![image](img/00016.jpg)![image](img/00126.jpg)
    的代码将打开与 `.innerHTML` 相同的 XSS 攻击向量。如果你正在使用 jQuery，请确保使用 `.text` 代替 `.html`：![image](img/00016.jpg)![image](img/00127.jpg)


    | ![image](img/00070.jpg) | **注意** 现代版本的 Firefox 和 Chrome Web 浏览器都配备了基础 XSS 审计器，可以帮助防止某些类型的
    XSS 攻击。然而，你不应以任何方式依赖此功能作为唯一的保护方法。使用适当的编码实践是真正防御 XSS 攻击的唯一方法。 |


