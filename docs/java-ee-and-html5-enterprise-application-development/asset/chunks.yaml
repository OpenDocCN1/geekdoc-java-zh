  raw: 'While almost all security measures need to be implemented on the server side
    for HTML5 applications, there are still a few types of client-side attacks that
    you need to be aware of, and properly code against, to avoid having your application
    exploited by hackers. These attack types include cross-site scripting, cross-site
    request forgery, and clickjacking. You will also want to have a basic understanding
    of authentication and authorization practices for your application and finally,
    some commonsense practices that should always be used when doing client-side security
    coding.Cross-Site ScriptingCross-site scripting (XSS) is one of the most common
    security vulnerabilities in web applications. There are actually three different
    kinds of XSS attacks: reflected, stored, and DOM-based. Reflected and stored XSS
    attacks are server-side attacks that must be handled at the application server
    or web server, whereas DOM-based XSS attacks are client-side attacks that must
    be addressed by client-side developers.XSS occurs when a web application incorporates
    user input into the output that it generates without first properly validating
    or encoding the input. Data coming from the end user (for example, form input)
    or from a data connection (for example, a REST service) is considered untrusted
    data. You didn’t create the data as part of your application, so you can’t verify
    that it came from a trusted source. It’s this untrusted data that you have to
    guard against.The best way to understand XSS is to look at some examples. Although
    the focus of this section is client-side security, server-side XSS attacks are
    the easiest to understand, so a couple of examples of server-side XSS attacks
    are provided next, followed by a client-side example.For the first example, assume
    that you’ve decided to create a custom error page for a 404 (file not found) error.
    When someone types in a URL similar to![image](images/00016.jpg)![image](images/00120.jpg)the
    error page returns a message stating that the file `not-here` could not be found
    on the server. The XSS vulnerability occurs if the data displayed in the error
    message is not escaped properly before it’s read by the browser, in which case
    an attacker could do something like this:![image](images/00016.jpg)![image](images/00121.jpg)The
    browser would execute the <script> when it parsed the data to display it as part
    of the error message.For the second example, assume that your web application
    has a search box. When a user conducts a search, the results of the search are
    displayed on a separate results page. The XSS vulnerability occurs if the results
    page uses the very common pattern of displaying “x number of results found for:
    <display what was searched for>” and does not perform proper encoding of the search
    string. If a malicious user enters a search string similar to the <script> block
    in the previous example, the JavaScript will be executed when the search results
    page is loaded in the browser.Both of the preceding examples would normally be
    managed on the server side, because the error page and the search results page
    would normally be generated on the server. As previously mentioned, the third
    kind of XSS attack is purely client side and deals with how JavaScript handles
    the execution of DOM elements.To demonstrate how a DOM-based XSS attack works,
    we’ll use a similar example to the previous search field example. Suppose your
    HTML5 web application has a form that includes an input field requesting the user’s
    username. The form also includes a <div> element that will be updated to show
    the content of whatever the user typed into the input field when the user presses
    the ENTER key. [Listing 6-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos320004)
    shows the code for this example.![image](images/00016.jpg)Listing 6-1   Form Example![image](images/00012.jpg)![image](images/00122.jpg)You
    want to set the contents of this <div> element to the value of the string entered
    into the `userName` input field. Doing this with plain JavaScript may look something
    like [Listing 6-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos320805).![image](images/00016.jpg)Listing
    6-2   innerHTML Example![image](images/00012.jpg)![image](images/00123.jpg)The
    code shown in [Listing 6-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos320805)
    will work just fine. However, by using the `.innerHTML` attribute of the <div>
    element, you have opened yourself up to a DOM-based XSS attack. If a malicious
    user were to enter a string that looked something like![image](images/00016.jpg)![image](images/00124.jpg)the
    HTML would be added to the DOM as written, and the next time someone moves their
    mouse over the new <div> element, the JavaScript would be executed.There are certain
    DOM attributes and methods that you should avoid when working with untrusted data.
    A partial list includes    ![image](images/00007.jpg)   `element.innerHTML`    ![image](images/00007.jpg)   `document.write()`    ![image](images/00007.jpg)   `document.writeln()`    ![image](images/00007.jpg)   `javascript.eval()`    ![image](images/00007.jpg)   element
    `eventHandlers`    ![image](images/00007.jpg)   `.setTimeout`    ![image](images/00007.jpg)   `.setInterval`    ![image](images/00007.jpg)   `new
    function()`In general, if you are working with untrusted data, set up your HTML
    so you can use the element’s `.textContext` method, as shown in [Listing 6-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos324460),
    instead of trying to add HTML directly.![image](images/00016.jpg)Listing 6-3   textContext
    Example![image](images/00012.jpg)![image](images/00125.jpg)If you absolutely have
    to allow untrusted data into a context that can be executed by either JavaScript
    or the HTML parser, then you should learn how to use one of the many HTML and
    JavaScript encoders that are available. You could try to write an encoder yourself,
    but doing so can be tricky because each browser’s JavaScript engine can handle
    things a little bit differently. You are better off using an encoder that has
    been developed by a trusted security team, such as the Enterprise Security API
    (ESAPI) that is available from the Open Web Application Security Project (OWASP)
    team.You should also be aware that using a JavaScript framework like jQuery poses
    the same issue. Using code such as![image](images/00016.jpg)![image](images/00126.jpg)will
    open the same XSS attack vector as using `.innerHTML`. If you are using jQuery,
    make sure you use `.text` instead of `.html`:![image](images/00016.jpg)![image](images/00127.jpg)


    | ![image](images/00070.jpg) | NOTEModern versions of both Firefox and Chrome
    web browsers come equipped with a basic XSS auditor that will help prevent some
    kinds of XSS attacks. However, you should not rely on this functionality in any
    way as the sole method of protection. Using proper coding practices is the only
    way to truly protect against XSS attacks. |'
