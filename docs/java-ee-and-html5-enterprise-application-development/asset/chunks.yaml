    Request Forgery](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos327153)                [Clickjacking](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos333182)                [Authentication
    and Authorization](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos336753)                [Client-Side
    Security Common Sense](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos343317)    [Server-Side
    Security](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos345596)                [Authentication](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos348187)                [REST
    Resource Security](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos361356)                [WebSocket
    Security](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos363833)    [Summary](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos367331)    [Index](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_015.html_filepos368288)![image](images/00005.jpg)Thanks
    to Liza Lyons for her help in visualizing the layout of the Book Club sample application.
    A very big thank you to the editors: from technical to copy. It’s amazing what
    a good editor can do with the chicken scratch of a technical-minded author. It
    was a joy working with the rest of the Oracle Press team, and, of course, a big
    thanks to my co-authors.–John BrockSincere thanks to Brandi Shailer and Amanda
    Russell for shepherding us throughout the process. Many thanks to John Yeary for
    providing a solid technical review showing his vast knowledge of the subject.
    This was definitely not possible without my two co-authors and the rest of the
    team at Oracle Press.–Arun GuptaMany thanks to Amanda Russell and Brandi Shailer,
    as well as JB Brock and Arun Gupta, for the work and cooperation in putting this
    book together, and to our primary reviewer, John Yeary.–Geertjan Wielenga![image](images/00006.jpg)Many
    books are available that cover just Java web services or just HTML5, but not both.
    So, this book strives to find a balance between what an HTML developer should
    know about the Java web services they connect to and what the Java developer should
    know about the HTML5 applications that are consuming and interacting with the
    web services.With the resurgence of JavaScript over the past few years, Java developers
    are often faced with the need to understand how HTML5 client-based applications
    interact and consume the server-side web services that the developers have been
    creating. At the same time, HTML5 developers often find that they need to understand
    how the services their applications rely on are built and configured. With the
    new HTML5 and CSS3 specifications generating a lot of industry buzz and the new
    JavaScript libraries, such as AngularJS and Knockout, becoming increasingly popular,
    some Java developers may wonder whether their skills are still relevant.Who Should
    Read This BookThis book is ideal for developers who find that they need to understand
    not only how to develop Java EE-based web services such as REST, Server-Sent Events
    (SSE), and WebSocket, but also how to develop HTML5-based clients that consume
    and interact with those web services. Whether you are primarily a Java developer
    looking for information about how HTML5 applications connect to your web services,
    or an HTML5 developer looking to better understand how the Java EE web services
    are created on the server side, this book will fit your needs.What This Book CoversThe
    primary topics covered in this book are    ![image](images/00007.jpg)   Java EE
    7 Persistence API (JPA)    ![image](images/00007.jpg)   Java EE 7 API for RESTful
    Web Services (JAX-RS)    ![image](images/00007.jpg)   Java EE 7 API for WebSocket    ![image](images/00007.jpg)   New
    features of the HTML5 specification    ![image](images/00007.jpg)   JavaScript
    Model-View-ViewModel (MVVM) architectural pattern via Knockout.js    ![image](images/00007.jpg)   JavaScript
    API for REST, WebSocket, and Server-Sent Events (SSE)    ![image](images/00007.jpg)   Responsive
    design concepts via CSS3 features    ![image](images/00007.jpg)   CSS preprocessing
    with Syntactically Awesome StyleSheets (SASS)    ![image](images/00007.jpg)   Client
    and server security concepts for web-based applicationsThese topics are covered
    in the following six chapters:    ![image](images/00007.jpg)   [Chapter 1](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_009.html_filepos34897),
    “Introduction to Java EE and HTML5 Enterprise Development,” provides a brief overview
    of the three main focus areas of the book: Java EE 7 web services, HTML5 application
    development, and NetBeans IDE.    ![image](images/00007.jpg)   [Chapter 2](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos66611),
    “Persistence,” discusses the Java Persistence API (JPA) and shows you the key
    concepts for persistence and how data can be created, read, updated, and deleted
    from a relational database using JPA.    ![image](images/00007.jpg)   [Chapter
    3](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos123818), “RESTful Resources,”
    introduces you to REST, or Representational State Transfer, as an architectural
    style for distributed systems such as the World Wide Web. The Java EE 7 API for
    RESTful Web Services (JAX-RS) is covered, including the new support for Server-Sent
    Events (SSE). You are shown how to develop your own RESTful web service and SSE
    service that you will use as the data resources for a Book Club application that
    you develop in [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295).    ![image](images/00007.jpg)   [Chapter
    4](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos159969), “WebSocket,”
    covers the development of both the server and client portions of an application
    using WebSocket. You learn about the Java API for WebSocket, as well as how to
    develop an HTML5 client that interacts with the WebSocket service.    ![image](images/00007.jpg)   [Chapter
    5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295), “HTML5, JavaScript,
    and CSS,” is all about HTML5 and client-side development. You interact with the
    REST and SSE web services that you created in [Chapter 3](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos123818).
    You are shown how to work with the Model-View-ViewModel (MVVM) architectural pattern
    through the use of the JavaScript library, Knockout. You are introduced to responsive
    design concepts as well as CSS preprocessing techniques with Syntactically Awesome
    StyleSheets (SASS).    ![image](images/00007.jpg)   [Chapter 6](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos312462),
    “HTML5 and Java Application Security,” covers security concepts for HTML5 client
    applications and Java EE–based web services.How to Use This Book and CodeThis
    book is structured such that you can read it sequentially or jump to any chapter
    and read it as a stand-alone topic. Source code is provided for all applications
    discussed in the book and is available for download at [www.OraclePressBooks.com](http://www.OraclePressBooks.com).
    This allows you to start in a later chapter and still have access to the resources
    that you would have developed had you read the earlier chapters first. For example,
    if you choose to read [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295)
    first, in which you develop the Book Club application, you have access to the
    data resources from [Chapter 3](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos123818)
    that the application relies on. Download the source code and follow along as you
    read each chapter, or deploy and run the source code from NetBeans IDE—whichever
    method works best for you. NetBeans IDE is used throughout the book to show you
    how to use wizards and other efficient methods of development, such as the built-in
    JavaScript debugger.![image](images/00008.jpg)CHAPTER1Introduction to Java EE
    and HTML5 Enterprise DevelopmentThere have been many changes taking place in the
    area of enterprise software development in recent years. Two of the largest changes
    are the trend toward Software as a Service (SaaS) and the use of HTML5 to provide
    a pure client-side user interface.In this chapter, you will be introduced to the
    main topics that will be covered throughout the book: NetBeans IDE, Java EE 7,
    and HTML5. You will be presented with information about how to obtain the applications
    and samples that will help you as you work your way through the coming chapters.
    Using this combination of IDE, platform, and HTML5 technology, you will soon be
    building powerful, dynamic enterprise applications.Development ToolsThree main
    development tools are used throughout this book: NetBeans IDE, Java EE 7, and
    HTML5\. You will learn how to use the combination of these tools to build powerful,
    modern enterprise applications. Before you begin building applications, it is
    important to first make sure you have a solid understanding of the basics of each
    of these technologies.NetBeansNetBeans IDE is the development tool you will use
    throughout this book. It provides features such as editors, templates, and code
    generators that make it a perfect fit for creating applications that use Java
    EE 7 and HTML5\. Starting with NetBeans IDE 7.3, new features have been introduced
    to support and enhance the development experience with client-side web applications
    that utilize the HTML5 family of technologies. You can use this IDE to rapidly
    and intuitively create rich web applications that support the responsive web design
    paradigm targeting desktop and mobile platforms simultaneously. In addition, from
    NetBeans IDE 7.4 onward, you can use HTML5 technologies within Java EE and PHP
    applications.![image](images/00009.jpg)The NetBeans story begins in 1996, when
    a group of students at Charles University in Prague attempted to write a Delphi-like
    Java IDE in Java. Originally called Xelfi, the student project delved into what
    was then the uncharted territory of Java IDEs. Xelfi generated enough interest
    in the developer community that, after they graduated, the students decided to
    put their new product on the market. In 1997, they formed a company and changed
    the name of the IDE to NetBeans.It wasn’t long before Sun Microsystems became
    interested in NetBeans as Sun began searching for Java development tools. In 1999,
    Sun acquired NetBeans and made the NetBeans IDE the flagship toolset for Java.
    At the time, Sun made another critical decision: to establish NetBeans IDE as
    an open source project—free to anyone who wanted to use it. Over the years, the
    NetBeans IDE has become a fully featured, cross-platform IDE, supporting all aspects
    of Java application development.When Oracle acquired Sun in 2010, NetBeans IDE
    became part of Oracle, and Oracle made the commitment to continue to support it.
    Today, more people are using NetBeans IDE than ever before. By 2010, the one million
    active user mark was reached, and the NetBeans IDE community continues to innovate
    and grow.You can download NetBeans IDE from the Oracle NetBeans website. Visit
    [http://netbeans.org/downloads](http://netbeans.org/downloads) for an overview
    of the available distributions and to find the corresponding download links. You
    need to have either the “Java EE” or “All” distribution of NetBeans IDE to be
    able to follow the instructions in this book. The instructions and code samples
    have been created in NetBeans IDE 7.4, the latest version at the time of writing.
    Subsequently released versions of NetBeans IDE should work just as well, though
    if you encounter problems when using a later version, you are recommended to switch
    to NetBeans IDE 7.4.Having just the Java Runtime Environment (JRE) installed on
    your system is not sufficient for running NetBeans IDE. You need to have the Java
    Development Kit (JDK), which includes a copy of the JRE. The IDE relies on development
    tools and sources provided by the JDK. You can go to [http://oracle.com/technetwork/java/index.html](http://oracle.com/technetwork/java/index.html)
    to find and download the latest version of the JDK.Java EE 7Java Platform, Enterprise
    Edition (Java EE) provides a standards-based platform for developing web and enterprise
    applications. The platform consists of multiple components that enable developers
    to build these applications. Each component is defined using a formal specification
    that describes the proposed component and its features. The platform is also accompanied
    by an application programming interface (API) described using Javadoc. This API
    is then used to build the application. The platform also provides some additional
    services, such as naming, injection, and resource management, that span across
    the platform. These applications are then deployed in Java EE 7 containers, such
    as GlassFish, that provide the runtime support.![image](images/00010.jpg)There
    are 33 components defined in the Java EE 7 platform. The ones that are pertinent
    to the content of this book are described in this section. For a full list of
    the components, refer to The Java EE 7 Technologies list ([www.oracle.com/technetwork/java/javaee/tech/index.html](http://www.oracle.com/technetwork/java/javaee/tech/index.html)).One
    of the major themes for the Java EE 7 platform is to simplify development of HTML5
    applications, especially the services that are needed on the server side. To enable
    that, Java API for RESTful Web Services (JAX-RS) is a component in the platform
    that defines how to develop, deploy, and invoke RESTful Web Services. A Plain
    Old Java Object (POJO) can be easily published as a Representational State Transfer
    (REST) endpoint by specifying an annotation. Regular methods can be easily invoked
    when the resource is accessed using standard HTTP verbs. A standard Java API to
    invoke these REST endpoints is also available. Server-Sent Events (SSE), a key
    part of the HTML5 specification, is used to asynchronously push data from the
    server to the client. Even though SSE is not part of the platform yet, the JAX-RS
    implementation provides support for SSE.WebSocket provides a full-duplex, bidirectional
    communication channel over a single TCP connection and significantly improves
    the latency for modern web applications. A new API was added to the Java EE 7
    platform for building WebSocket applications. Just like JAX-RS, adding an annotation
    on a POJO converts it into a WebSocket endpoint. With all the excitement around
    WebSocket and a simplified API, Java EE 7 is the best platform for building your
    HTML5 applications.JavaScript Object Notation (JSON) is a key technology for data
    transfer within HTML5 applications, and certainly a lingua franca of the Web.
    Java EE 7 adds new APIs to enable the parsing and generation of JSON text and
    objects using JSON-P 1.0\. The API allows parsing or generating the entire JSON
    text using only the API. Alternatively, the document may be structured one item
    at a time.Any web application typically requires information to be persisted in
    a permanent data store. The Java Persistence API (JPA) defines an API for the
    management of persistence and object-relational mapping using a Java domain model.
    Consistent with the overarching theme of a simplified programming model, adding
    an annotation allows a POJO to be mapped to a database table. There are reasonable
    defaults that can be overridden using annotations. The POJOs can also be used
    to generate the database tables, or even table-generation scripts. Developers
    can write string-based or type-safe queries to operate on the Java data model.In
    addition, the information from this data store needs to be stored and retrieved
    to preserve the ACID (atomicity, consistency, isolation, durability) properties.
    This can be achieved using Enterprise JavaBeans (EJB) or the newly introduced
    @Transactional annotation. EJBs provide convenient container-managed transactions.
    They also come in different flavors: stateless (where there is no state on the
    server), stateful (state is stored on the server), and singleton (single instance
    per application per JVM).The newly added @Transactional annotation can be specified
    on a POJO to provide container-managed transactions outside of Enterprise JavaBeans.
    Annotating a class means all methods of the class are going to run inside a container-managed
    transaction. Alternatively, this annotation may be specified on a method to limit
    the scope of transaction.This book will cover all of these topics in detail using
    extensive code samples.In addition, the Java EE 7 platform provides several other
    components:    ![image](images/00007.jpg)   Batch Applications for the Java Platform   Allows
    noninteractive, bulk-oriented, and long-running tasks to be easily defined and
    executed. It allows item-oriented processing style, aka Chunk, and task-oriented
    processing style, aka Batchlet. Chunk, the primary and recommended processing
    style, reads, processes, and aggregates for writing a “chunk” number of items
    at a time. Each chunk is written in a container-managed transaction and also provides
    checkpoints. Batchlet is a roll-your-own batch pattern. It is a task-oriented
    processing style where a task is invoked once, runs to completion, and returns
    an exit status.    ![image](images/00007.jpg)   Java Message Service (JMS)   Provides
    a message-oriented middleware that allows sending and receiving messages between
    distributed systems. It provides a point-to-point messaging model, where a publisher
    sends a message to a specific destination, called a queue, targeted to a subscriber.
    Alternatively, JMS provides a publish-subscribe messaging model where multiple
    publishers can publish a message to a destination, called a topic, which can then
    be subscribed to by multiple subscribers. In both cases, publisher and subscriber
    are loosely coupled from each other. They only need to know the destination and
    message format.    ![image](images/00007.jpg)   Contexts and Dependency Injection
    (CDI)   Provides a type-safe dependency injection mechanism. A bean is “strongly
    typed” as it only defines the type and semantics of other beans it depends upon,
    without a string name and using the type information available in the Java type
    system. It provides “loose coupling” as the injection request need not be aware
    of the actual life cycle, concrete implementation, threading model, or other clients
    of the bean.    ![image](images/00007.jpg)   Concurrency Utilities   Allows adding
    concurrency design principles for existing Java EE applications. It allows an
    application to create user threads that are managed by the container. The usual
    classloading context, Java Naming and Directory Interface (JNDI) context, and
    security context are propagated to these threads.    ![image](images/00007.jpg)   JavaServer
    Faces (JSF)   Provides the server-side user interface (UI) framework. It allows
    creation of web pages with a set of reusable UI components following the Model-View-Controller
    (MVC) design pattern. The components are bound to a server-side model that enables
    two-way migration of application data with the UI. JSF also defines page navigation,
    manages UI component state across server requests, and can be easily used to build
    and reuse custom components.    ![image](images/00007.jpg)   Java Servlet Technology   Allows
    a web client to interact using a request/response pattern and generates dynamic
    content. The container is responsible for the life cycle of the servlet, receives
    requests and sends responses, and performs any other encoding/decoding required
    as part of that function.Refer to The Java EE 7 Tutorial ([http://docs.oracle.com/javaee/7/tutorial/doc/home.htm](http://docs.oracle.com/javaee/7/tutorial/doc/home.htm))
    for more details on the complete set of Java EE 7 technologies.HTML5While most
    people believe HTML5 is relatively new, it has actually been in development since
    2004\. The World Wide Web Consortium (W3C) designed the original specification
    to address what it observed as common uses of HTML and XHTML across the Internet
    at the time. Other considerations the W3C addressed as it drafted the new specification
    were the trend toward incorporating multimedia into web pages and the need to
    consolidate various specifications that had become commonly used during the years
    that the HTML 4.01 specification had been in use. This consolidation included
    not only upgrading to the HTML 4 specification, but also combining the XHTML 1
    and DOM Level 2 HTML specifications into one.![image](images/00011.jpg)HTML5 Specification
    Reaches Feature CompleteWhat has brought HTML5 to the forefront the most over
    the past year is that on December 17, 2012, the W3C announced that the HTML5 specification
    was feature complete. By labeling the specification as a “Candidate Recommendation,”
    the W3C gave businesses and developers a stable specification that they could
    start working with.One major issue that you need to take into consideration when
    working with HTML5 as your client-side application framework is that, while it
    has reached a stable, feature-complete status, it has not been approved as a completed
    standard yet. The largest ramification of this is that there are still different
    implementations of what was a draft specification being used. Now that the specification
    is feature complete, the major browser vendors and user agent developers should
    be able to converge on implementations that come closer to meeting the specification.
    This will take time though, and you will need to make sure you test all of your
    HTML5 code on the browsers and user agents that you expect your customers to be
    using.In its press release announcing the completed definition of the HTML5 specification
    ([www.w3.org/2012/12/html5-cr.html.en](http://www.w3.org/2012/12/html5-cr.html.en)),
    the W3C describes as follows what the next phase of the specification process
    will involve:'
