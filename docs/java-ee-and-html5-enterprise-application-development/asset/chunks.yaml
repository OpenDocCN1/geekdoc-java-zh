- fmt: "\n# About the Authors\n\n**John Brock** is a Principal Product Manager for\
    \ Oracle Corporation. John has over 15 years’ experience working with web application\
    \ development. While working at Sun Microsystems, he was responsible for identifying\
    \ emerging Internet technologies and how they could potentially interact with\
    \ the Java Virtual Machine (`JVM`). John has worked with development teams from\
    \ `JRuby`, `Jython`, `Groovy`, `JavaFX`, and more. His current focus is on HTML5\
    \ application development, and he is the product manager for the `HTML5`, `JavaScript`,\
    \ and `CSS3` features of `NetBeans IDE`. John can easily be reached at `@peppertech`.\n\
    \n**Arun Gupta** is Director of Developer Advocacy at Red Hat and focuses on building\
    \ community around `JBoss Middleware`. As a founding member of the `Java EE` team\
    \ at Sun Microsystems, he spread the love for technology all around the world.\
    \ At Oracle, Arun led a cross-functional team to drive the global launch of the\
    \ `Java EE 7` platform through strategy, planning, and execution of content, marketing\
    \ campaigns, and programs. Arun has extensive speaking experience, including appearances\
    \ in 37 countries speaking on myriad topics, and is a `JavaOne` Rockstar. An author\
    \ of a best-selling book, an avid runner, a globe trotter, and a `Java Champion`,\
    \ he is easily accessible at `@arungupta`.\n\n**Geertjan Wielenga** is a Principal\
    \ Product Manager for Oracle Corporation. Geertjan has worked in the software\
    \ industry since 1996. While at Sun Microsystems, he worked on the documentation\
    \ of a range of technologies, primarily in the `Java EE` and web areas, developed\
    \ tutorials, and contributed to published books. Geertjan is a passionate advocate\
    \ of `NetBeans` as a central solution to tooling requirements for web-based technologies.\
    \ He also promotes the `NetBeans Platform` as a stable and versatile solution\
    \ for large Java desktop applications. He is currently a product manager assigned\
    \ to the external evangelism of `NetBeans IDE`.\n\n# About the Technical Editor\n\
    \n**John Yeary** is a Principal Software Engineer on `Epiphany CRM Marketing`\
    \ at Infor Global Solutions. John has been a Java evangelist and has been working\
    \ with Java since 1995. John is a technical blogger with a focus on `Java Enterprise\
    \ Edition` technology, `NetBeans`, and `GlassFish`. John is currently the President\
    \ of the Greenville Java Users Group (`GreenJUG`), and is its founder. He is an\
    \ instructor, a mentor, and a prolific open source contributor.\n\nJohn graduated\
    \ from Maine Maritime Academy with a `B.Sc.` Marine Engineering with a concentration\
    \ in mathematics. He is a Merchant Marine officer, and has a number of licenses\
    \ and certifications. When he is not doing Java and `F/OSS` projects, he likes\
    \ to hike, sail, travel, and spend time with his family. John is also the Assistant\
    \ Cubmaster in the Boy Scouts of America (`BSA`) Pack 833, Unit Commissioner,\
    \ and Southbounder District Chairman for Activities and Civic Service in the Blue\
    \ Ridge Council of the `BSA`.\n\n![image](images/00003.jpg)\n\n- [1 Introduction\
