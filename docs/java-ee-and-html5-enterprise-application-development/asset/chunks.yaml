    a moving target, so to speak. Different vendors support the specification in different
    ways, or may not support certain parts of the specification at all. This poses
    a problem for application developers, who have to develop for a customer base
    that could be using a wide variety of device and browser combinations. Thankfully,
    several websites have been created to help developers navigate this tricky area
    of developing HTML applications. Two of the more popular sites are    ![image](images/00007.jpg)   HTML5
    Test   [http://html5test.com/](http://html5test.com/)    ![image](images/00007.jpg)   Can
    I Use   [http://caniuse.com/](http://caniuse.com/)The HTML5 Test website will
    allow you to see how well a specific version or brand of browser implements the
    whole of the HTML5 specification. This is very useful when you are trying to decide
    what kind of browser or device support matrix your application will provide.The
    Can I Use website goes into more detail and allows you to look at a specific HTML
    element or attribute and see which browser vendors have implemented it and in
    which versions of their browsers.Use of Mobile DevicesProbably the second largest
    reason for HTML5’s recent rise in visibility is the increase in the availability
    of smartphones, tablets, and other types of mobile and embedded devices with Internet
    access (such as Internet-ready TVs, game consoles, and Blu-ray players, to name
    just a few). The reason that the rise in the availability of these devices has
    brought HTML5 to prominence is that all of them are being developed with browsers
    that already support HTML5 to some degree. Unlike on desktop operating systems,
    the developers of the browsers for these devices didn’t have to consider any issues
    of backward compatibility with existing browser implementations. Everything is
    new on these types of devices, and the manufacturers started with the latest HTML
    specifications in anticipation of it becoming the standard in the near future.This
    rise in accessing the Internet via mobile devices is also one of the factors that
    has enticed enterprise developers to look more closely at HTML5\. The traditional
    website layout does not comfortably scale down for viewing on a smaller device
    like a smartphone or tablet. The existing methods of producing a completely different
    version of the website to display when the client is detected to be a mobile device
    have proven to be fraught with maintenance problems and inefficient to scale.New
    HTML5 FeaturesOne of the major new features of HTML5 is the inclusion of new semantic
    elements (see [Table 1-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_009.html_filepos58442))
    to help developers manage the layout of the HTML page and its content so that
    it scales flawlessly for viewing on smaller devices. You can now lay out your
    HTML content using tags such as <header>, <footer>, <section>, <article>, <aside>,
    <nav>, and many others.![image](images/00012.jpg)![image](images/00013.jpg)![image](images/00012.jpg)TABLE
    1-1.   Semantic ElementsAlong with the new semantic elements in the HTML5 specification,
    there are also new syntactic elements, as listed in [Table 1-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_009.html_filepos59481),
    that are meant to remove the need to install proprietary plug-ins. These include
    elements such as <canvas>, <video>, <audio>, and <svg>. These features are designed
    to make it easier to work with multimedia and graphics.![image](images/00012.jpg)![image](images/00014.jpg)![image](images/00012.jpg)TABLE
    1-2.   Syntactic ElementsLastly, the HTML5 specification brings new attributes
    to some of the existing elements. The most notable of these are the new values
    for the type attributes of the <input> element (see [Table 1-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_009.html_filepos61368)).
    These are primarily used for forms. While all of these new type values are now
    part of the finalized HTML5 specification, each browser vendor can, and has, implemented
    how they behave when they are rendered. It is the intent of the specification
    that the vendor will be able to provide a user interface for better integration
    with each of these input types. For instance, if a browser renders an input field
    with the type set to `"date"`, the end user would see a date picker displayed
    to help select the date that they wish to enter. Unfortunately, this is one of
    the areas in which browser vendors currently have the largest separation in functionality.
    On mobile devices, the experience is better. You will often find that when you
    click or touch in an input field that has the type set to `"number"`, you will
    get a number pad instead of the normal keyboard, or a different type of keyboard
    will be displayed if the input field is set to something like `"url"`.![image](images/00012.jpg)![image](images/00015.jpg)![image](images/00012.jpg)TABLE
    1-3.   Form Input Type AttributesParts of an HTML5 ApplicationOne of the most
    common misconceptions about HTML5 applications is that they are composed of HTML5
    only. In fact, in almost all cases the application is actually made up of at least
    three different components: HTML5, JavaScript, and Cascading Style Sheets (CSS).
    By combining all of the new HTML5 elements and attributes with the new media query
    feature of CSS version 3 (CSS3), you can display the same content with different
    layouts for different device sizes. This method of modifying the content to respond
    to the device’s available display size is called responsive design; the layout
    responds to the display size that it is rendered in.There are a few important
    caveats to note about responsive design. First, although it does allow you to
    create a website that will have the same look and feel across multiple device
    sizes, the HTML5 application is still a web page that is being viewed in a web
    browser on a smaller device such as a smartphone or tablet. The application will
    not have a true “native” look and feel like an application that is written and
    compiled for a specific type of mobile device. Second, HTML5 and responsive design
    may not be the answer for developers who want their application to have access
    to specific mobile features such as the camera, contact list, and calendar. Because
    the application is running in a web browser, you can only program your application
    to use what the browser allows you to interact with.As previously mentioned, the
    third component commonly used in HTML5 applications is JavaScript. The introduction
    of JavaScript architectural libraries has been a big factor in making it more
    acceptable to enterprise developers.Developing an application in an enterprise
    environment often means the separation of development tasks, with designers and
    UI teams working on the front end or view layer, while other teams are working
    on the data and controller layers. This type of separation between application
    layers is referred to as a Model-View-Controller (MVC) architectural pattern.
    Over the past few years, JavaScript libraries have been developed to introduce
    a similar architecture, called Model-View-ViewModel (MVVM).MVVM was originally
    developed by Microsoft in 2005 as part of its Windows Presentation Foundation
    (WPF). A JavaScript implementation of this architectural pattern was introduced
    as an open source project in 2010 by Steve Sanderson. It was released under the
    name of Knockout.js ([http://knockoutjs.com/](http://knockoutjs.com/)) and has
    quickly gained popularity among JavaScript developers who are already familiar
    with the MVC architectural development practices. While a deep understanding of
    MVVM, and more specifically Knockout.js, is beyond the scope of this book, you
    will use Knockout.js in [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295)
    when creating an HTML5 application that will consume and interact with web services
    such as REST, WebSockets, and Server-Sent Events (SSE).SummaryYou’ve learned what’s
    new in the Java EE 7 specification in the area of web services that are used for
    developing the specific services that an HTML5 application will need. You’ve also
    been shown some of the new features in the HTML5 specification and the specific
    technologies that are required to develop a client-side HTML5 application. This
    introduction to the current state of development tools will help you throughout
    the rest of this book as you work with the coding concepts and samples.As you
    can see, both Java EE web development and HTML web development have matured over
    the past few years toward the common trend of providing Software as a Service.
    In keeping with this development trend, tools such as NetBeans IDE have evolved
    to provide features that make it easier than ever to combine these two types of
    technologies.In the next chapter, you will dive into the Java EE 7 Persistence
    API to learn how to create and maintain a data store for your HTML5 application.![image](images/00008.jpg)CHAPTER2PersistenceData
    is an integral part of any application and typically defines the state of an application
    at any given point of time. Persistence is the characteristic of an application
    state that outlives the process that created it. Absent persistence, application
    data would be lost when the application terminates. If a banking application could
    not persist information about the accounts, that application would be useless.
    Similarly, if a retail store application could not persist information about the
    inventory, customer orders, and shipments, it would be of no value. Persistence
    allows applications to access the data and perform CRUD (create, read, update,
    and delete) operations that change the data’s state. After an application crashes
    unexpectedly and then recovers, persistence enables the application to use the
    data in the exact state that it was in at the time of the crash.There are many
    ways to persist data in Java. Java Platform, Standard Edition (Java SE) provides
    APIs to manipulate streams and files. This requires lots of low-level handling,
    such as defining the stream location and names, opening and closing streams, and
    defining a data format. The Java Database Connectivity (JDBC) API can be used
    to store data to a relational database such as an Oracle or MySQL database server.
    This requires managing database connections, writing SQL queries, mapping results
    with Java objects, and a lot more. Different NoSQL data stores provide APIs to
    manage data specific to those data stores. The majority of data is persisted in
    databases, specifically relational databases.The Java EE platform provides the
    Java Persistence API (JPA) for the management of persistence and object/relational
    mapping. In other words, a POJO (Plain Old Java Object) can be used to represent
    a table in the relational database, and each class instance corresponds to a row
    in that table. The API defines how these rows can be managed using the POJO.Data
    stored in a relational database should maintain ACID (atomicity, consistency,
    isolation, durability) properties. To help ensure that ACID properties are maintained,
    it is very important to ensure that any addition, update, or deletion of data
    is done within a transactional boundary. The transactions can be container-managed
    or user-managed. Container-managed transactions can be managed either by the Enterprise
    JavaBeans (EJB) container or by using the `@javax.transaction.Transactional` annotation
    provided by the Java Transaction API (JTA). In this case, a transaction is automatically
    started by the container and then either committed or rolled back by the container.
    A user-managed transaction is explicitly started and completed by the user. In
    this case, the application explicitly starts the transaction and then either commits
    or rolls back the transaction before exiting out of the method.This chapter will
    introduce the main concepts of JPA, how an entity can be created, queried, and
    updated. Text-based Java Persistence Query Language (JPQL) and type-safe Criteria
    API are explained. Container-managed transactions that preserve the ACID properties
    of these entities are explained. Finally, database schema generation using persistence
    properties is explained. NetBeans IDE tools and wizards are explained in reference
    to context throughout the chapter.JPA EntityJPA defines an entity as a lightweight
    persistent domain object. Any POJO with a no-args public constructor can be defined
    as an entity. A JPA entity defining the concept of an author is shown in [Listing
    2-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos71506).![image](images/00016.jpg)Listing
    2-1   Author Entity![image](images/00012.jpg)![image](images/00017.jpg)Let us
    walk through this code:    ![image](images/00007.jpg)   `@javax.persistence.Entity`
    annotation on a POJO specifies that this is an entity. The default name of the
    entity is the unqualified name of the class. An optional `name` attribute may
    be used to specify the entity name, which is then used to refer to the entity
    in queries.    ![image](images/00007.jpg)   `@javax.persistence.Table` is an optional
    annotation on an entity and specifies the primary table for the annotated entity.
    Additional tables may be specified using `SecondaryTable` or `SecondaryTables`
    annotation.        If no `@Table` annotation is specified on the entity, or the
    annotation is specified but no name attribute is specified, then the generated
    table defaults to the entity name.    ![image](images/00007.jpg)   Implementing
    the `Serializable` interface allows the class to be passed by value through a
    remote interface.    ![image](images/00007.jpg)   The properties of the bean that
    follow the JavaBeans-style accessors (“property access”) or instance variables
    (“field access”) represent the persistent state of the entity. The persistent
    fields or properties of an entity class can be from a wide range of types, such
    as Java primitive types, any primitive wrapper type, other fine-grained classes
    defined using `@javax.persistence.Embedded` and known as embeddables, a collection
    of embeddables, and many other types.        The properties `id`, `firstName`,
    `lastName`, `bio`, and `email` have getters and setters that are omitted for brevity
    in this code. Each of these fields will map to a column in the database table.        Reasonable
    default column names are used for properties and fields. For example, the column
    name `ID` is used for the `id` property, and the column name `FIRST_NAME` is used
    for the `firstName` property. Optionally, a `@javax.persistence.Column` annotation
    may be used to override the name of the mapped column. This annotation can also
    use several attributes to control the definition of the mapped column.    ![image](images/00007.jpg)   `@javax.persistence.Id`
    annotation specifies the primary key of an entity. The field or property to which
    this annotation is applied should be one of the following types: any Java primitive
    type, any primitive wrapper type, `java.lang.String`, `java.util.Date`, `java.sql.Date`,
    `java.math.BigDecimal`, or `java.math.BigInteger.` The corresponding mapped column
    is assumed to be the primary key of the primary table.        A composite primary
    key that consists of multiple fields or properties can be defined using `@javax.persistence.IdClass`
    annotation on an entity. An embeddable class can be denoted as the primary key
    using `@javax.persistence.EmbeddedId` annotation.    ![image](images/00007.jpg)   Validation
    constraints can be specified on entities to ensure that only valid data is used
    to communicate with the database. Bean Validation 1.1, another specification in
    the Java EE 7 platform, defines several such predefined constraints in the `javax.validation.constraints`
    package. Specifying `@javax.validation.constraints.NotNull` on a field ensures
    that this field cannot be set to `null` and persisted. The `@javax.validation.constraints.Size`
    constraint allows you to specify minimum and maximum boundaries of the field.The
    Bean Validation specification even defines an extensible mechanism by which you
    can easily define custom constraints to meet application needs.An entity can capture
    the relationship between different tables using `@javax.persistence.OneToOne`,
    `@javax.persistence.OneToMany`, `@javax.persistence.ManyToOne`, and `@javax.persistence.ManyToMany`
    annotations. A join table is defined using `@javax.persistence.JoinTable` annotation.
    A collection of basic or embeddable types can be mapped using `@javax.persistence.CollectionTable`
    annotation.NetBeans IDE provides a wizard that enables you to generate JPA entities
    from a database schema. In the IDE, right-click your application and choose New
    | Other | Persistence | Entity Classes from Database. The Database Tables page
    of the New Entity Classes from Database wizard is shown in [Figure 2-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos78564).
    The tables available in the selected data source are displayed in the Available
    Tables list.![image](images/00012.jpg)![image](images/00018.jpg)![image](images/00012.jpg)FIGURE
    2-1.   Selecting tables from a databaseSelect any tables in the Available Tables
    list in the left pane and click the Add button to add them to the Selected Tables
    list on the right. If you add a table that references other tables, the referenced
    tables are automatically added to the Selected Tables list as well. The referenced
    tables are grayed out to indicate that they are referenced tables. The IDE will
    automatically generate entity classes for each of the tables listed in the Selected
    Tables list.Click Next to move to the Entity Classes page of the New Entity Classes
    from Database wizard, as shown in [Figure 2-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos79913),
    where you review or set the following:![image](images/00012.jpg)![image](images/00019.jpg)![image](images/00012.jpg)FIGURE
    2-2.   Defining classes and other files to be created    ![image](images/00007.jpg)   Class
    Names   Displays the name of the class that is generated for each table listed.
    The Generation Type column displays whether the class will be new, updated, or
    re-created. If the entity class for a selected table already exists, you can choose
    to either re-create the entity class or update the existing class by clicking
    the toggle button (…) below the Class Names table.    ![image](images/00007.jpg)   Project   Displays
    the project where the entity classes will be saved. This field is read-only.    ![image](images/00007.jpg)   Location   Select
    the source folder where you want to create the entity class.    ![image](images/00007.jpg)   Package   Select
    an existing package from the drop-down list or type the name of a new package.    ![image](images/00007.jpg)   Generate
    Named Query Annotations for Persistent Fields   If selected, the IDE generates
    named query annotations in the entity classes.    ![image](images/00007.jpg)   Generate
    JAXB Annotations   If selected, the IDE generates annotations in the entity class
    for mapping the class to an XML element that can then be used by a Java Architecture
    for XML Binding (JAXB) web service.To persist entity classes, your project requires
    a persistence unit (as described in the following section, “Packaging an Entity”).
    NetBeans IDE checks if there is a persistence unit for the project when you create
    the entity class. If the IDE cannot locate a persistence unit, the Create Persistence
    Unit check box appears, as shown in [Figure 2-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos79913).
    Alternatively, you can create a persistence unit later by choosing Persistence
    | Persistence Unit in the New File wizard.From the Entity Classes page, you can
    click Finish to create entity classes for each of the specified tables, or you
    can click Next to modify the default settings used when generating the mapping
    annotations, as shown in [Figure 2-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos83872).
    If you choose the latter option, you can set the following options for configuring
    generated annotation elements:![image](images/00012.jpg)![image](images/00020.jpg)![image](images/00012.jpg)FIGURE
    2-3.   Setting options for the creation of entity classes    ![image](images/00007.jpg)   Association
    Fetch   Select the fetch element to add to the relationship annotations. You can
    select default, eager, or lazy. If default is selected (default is selected by
    default), no fetch element is added to the relationship annotations.    ![image](images/00007.jpg)   Collection
    Type   Select the collection type for OneToMany and ManyToMany Container-Managed
    Relationship (CMR) fields. You can select `java.util.Collection, java.util.List`,
    or `java.util.Set.java.util.Collection` is selected by default.    ![image](images/00007.jpg)   Fully
    Qualified Database Table Names   If selected, `catalog` and `schema` elements
    are added to the `@Table` annotation. This option is deselected by default.    ![image](images/00007.jpg)   Attributes
    for Regenerating Database Tables   If selected, `nullable` (when it is false),
    `length` (for String type), `precision`, and `scale` (for decimal type) are added
    to the `@Column` annotation. Unique constraints are also added to the `@Table`
    annotation if this option is selected. This option is deselected by default.    ![image](images/00007.jpg)   Use
    Column Names in Relationships   If selected, when a table references a foreign
    key, the field name is generated according to the name of the column in the table.
    For example, if the table `customer` has a column named `zip` that is mapped to
    a column named `zip_code` in table `micromarket`, the generated field name will
    be `zip`. This option is selected by default.        If this option is deselected,
    the field name is generated according to the name of the table that contains the
    foreign key. In the example shown in the previous figures, the generated field
    name will be `microMarket`.    ![image](images/00007.jpg)   Use Defaults if Possible   If
    selected, only annotations that modify the default behavior or attributes will
    be generated. Selecting this option can reduce the number of unnecessary annotations
    that are generated. This option is deselected by default.    ![image](images/00007.jpg)   Generate
    Fields for Unresolved Relationships   If selected, basic generic fields are generated
    for the fields in a relationship that reference fields or entities that are missing
    or cannot be resolved. The basic fields that are generated might not accurately
    represent the columns in the tables because of the missing data.        If this
    option is deselected, fields in a relationship are not generated if any of the
    fields or entities in the relationship are missing. This option is deselected
    by default.When you click Finish, the IDE creates entity classes for each of the
    tables you specified in the wizard, as shown in [Figure 2-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos89051).![image](images/00012.jpg)![image](images/00021.jpg)![image](images/00012.jpg)FIGURE
    2-4.   Examining the result of creating new entity classesPackaging an EntityAn
    entity is managed within a persistence context, a set of managed entity instances
    in which any persistent entity identity has a unique entity instance. A persistence
    context has multiple entity managers that manage the entity instances and their
    life cycles. The entity managers, their configuration information, the managed
    entities, and optional metadata that defines the mapping of the entities to the
    database are together packaged as a persistence unit. A persistence unit is defined
    by a `persistence.xml` file and packaged within a WAR file. [Listing 2-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos90489)
    shows a sample `persistence.xml` file.![image](images/00016.jpg)Listing 2-2   Sample
    persistence.xml File![image](images/00012.jpg)![image](images/00022.jpg)The `persistence.xml`
    file can have one or more `<persistence-unit>` elements, each corresponding to
    an entity manager. Each entity manager can be configured using several standard
    `javax.persistence.* <properties>` elements.NetBeans IDE provides an editor for
    editing `persistence.xml` files. Open a `persistence.xml` file and you will see
    that three different views are available for working with the file: Design, Source,
    and History. Click the Source button to see the source of the file. When you use
    code completion in Source view—that is, you press CTRL-TAB (by default)—context-sensitive
    suggestions are shown for completing the current word, together with relevant
    documentation, as shown in [Figure 2-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos92000).![image](images/00012.jpg)![image](images/00023.jpg)![image](images/00012.jpg)FIGURE
    2-5.   Source view for persistence.xml fileWhen you click the Design button, a
    structured view is shown for working with the `persistence.xml` file (see [Figure
    2-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos92956)). A drop-down
    list lets you navigate to sections of interest, while text fields and buttons
    let you enter values into the underlying `persistence.xml` file.![image](images/00012.jpg)![image](images/00024.jpg)![image](images/00012.jpg)FIGURE
    2-6.   Design view for persistence.xml fileFinally, clicking the History button
    opens a local history view of your file. The History view lets you roll back changes
    that are saved locally.Managing an EntityEach entity goes through create, read,
    update, and delete (CRUD) operations during its life cycle. Typically, an entity
    is created once, read and updated multiple times, and then deleted once.An Enterprise
    JavaBean (EJB; also known as enterprise beans) is typically used to manage the
    entity. An EJB instance is itself managed at runtime by an EJB container. The
    container provides all the plumbing, such as transactions, remoting, concurrency,
    connection pooling, and other such details, so that the application developer
    can focus on the business logic.There are two types of EJBs: session beans and
    message-driven beans. A session bean processes the message synchronously, and
    a message-driven bean is used to process messages asynchronously. There are three
    types of session beans: stateful, stateless, and singleton. A stateful session
    bean maintains a conversational state for a specific client, a stateless session
    bean does not contain any conversational state for a specific client, and a singleton
    session bean is instantiated once per application.A stateless session bean, by
    its very nature of being stateless, can be pooled by the container and provides
    much better scalability for the application. By default, all methods of a session
    bean have container-managed transactions. This means the EJB container implements
    all the low-level transaction protocols, such as the two-phase commit protocol
    between a transaction manager and a database system, to honor the transactional
    semantics. The changes to the underlying resources are all committed or rolled
    back accordingly.A container-managed entity manager can be obtained in a stateless
    session bean using dependency injection. The entity manager is then used to perform
    operations on an entity.[Listing 2-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos96208)
    shows how a stateless session bean can be used to create or delete an entity instance.![image](images/00016.jpg)Listing
    2-3   CRUDing Author Entity![image](images/00012.jpg)![image](images/00025.jpg)A
    stateless session bean is defined by adding `@javax.ejb.Stateless` annotation
    on a POJO. To create a new row in the database table, a new entity instance is
    created using a no-args constructor or a convenience constructor. Calling setters
    or assigning instance variables then populates the entity values. This is typically
    done in a client component such as a servlet or any other Java EE component.A
    container-managed `javax.persistence.EntityManager` is obtained and used within
    the `addAuthor()` method to save the entity. Similarly, an entity instance can
    be removed by calling the `EntityManager.remove()` method. The EJB container starts
    a transaction before the method is invoked and commits the transaction after the
    method completes. All changes made to the entity manager are stored in the database
    with a transaction commit.NetBeans IDE provides a wizard that enables you to generate
    EJBs. In the IDE, right-click your application and choose New | Other | Enterprise
    JavaBeans | Session Bean to open the New Session Bean wizard, shown in [Figure
    2-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos98069).![image](images/00012.jpg)![image](images/00026.jpg)![image](images/00012.jpg)FIGURE
    2-7.   Creating new session beansFor Session Type, you can select one of the following:    ![image](images/00007.jpg)   Stateless   The
    bean does not save state information during its conversation with the user. These
    enterprise beans are useful for simple interactions between the client and the
    application service, interactions that are complete in a single method invocation.
    An example is an enterprise bean that processes orders. Each order can be processed
    by an invocation of one method, such as `processOrder()`. All the information
    needed for processing is contained in the method parameters.    ![image](images/00007.jpg)   Stateful   The
    bean saves state information during its conversation with the user. These enterprise
    beans are useful for business processes that require an interaction between a
    client and application service that lasts longer than a single method invocation
    and requires memory of the state of the interaction. An example is an online shopping
    cart. The end user, through the client program, can order a number of items. The
    stateful session bean managing the interaction must accumulate items until the
    end user is ready to review the accumulated order, approve or reject items, and
    initiate processing of the lot. The stateful session bean has to store the unprocessed
    items and enable the end user to add more.    ![image](images/00007.jpg)   Singleton   A
    singleton session bean is instantiated only once per application and exists for
    the life cycle of the application. You can create a singleton bean that the container
    instantiates when the application starts up by using the `@Startup` annotation.
    An example is a bean that is used to initialize data for an application that can
    be concurrently accessed by many clients.An alternative to using an EJB container
    providing container-managed transactions is to use the newly introduced `@javax.transaction.Transactional`
    annotation on a POJO or its method. This allows declarative definition of transaction
    boundaries on beans managed by Contexts and Dependency Injection (CDI), as well
    as classes defined as managed beans or other Java EE components. The transactional
    semantics are implemented using CDI interceptor bindings.[Listing 2-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos101944)
    shows how `@javax.transaction.Transactional` annotation can be specified on a
    method to create or delete an entity instance. Just like in EJB, a container-managed
    transaction is automatically started by the CDI runtime and committed or rolled
    back, as appropriate.![image](images/00016.jpg)Listing 2-4   Author with @Transactional![image](images/00012.jpg)![image](images/00027.jpg)Java
    Persistence Query LanguageJava Persistence Query Language (JPQL) is a string-based
    query language used to define queries over entities and their persistent state.
    JPQL allows the application developer to specify the semantics of queries in a
    portable way. The underlying persistence provider converts the query language
    to a target language, such as SQL, of a database or a persistent store.A query
    may be a SELECT statement (R from Read of CRUD), UPDATE statement (U from Update
    of CRUD), or DELETE statement (D from Delete of CRUD). An optional WHERE clause
    can be used to restrict the results, and a GROUP BY clause, HAVING clause, or
    ORDER BY clause can be used to aggregate the results. The query may be constructed
    dynamically or may be statically defined in a metadata annotation.As shown in
    the following example, `@javax.persistence.NamedQueries` annotation can be used
    on an entity to specify multiple named JPQL queries. Each query is specified using
    `@javax.persistence.NamedQuery` annotation. Each query requires a `name` attribute
    to uniquely identify the query within the persistence unit. The query string is
    defined using the `query` attribute.![image](images/00016.jpg)![image](images/00028.jpg)In
    the preceding example, both the queries are statically defined. The first query
    has the name `Author.findAll` and is equivalent to selecting all rows from the
    table. Note that the query string is defined around the entity, and not the corresponding
    database table. This is what provides portability of JPQL over multiple databases.
    The second query has the name `Author.findById`, uses a WHERE clause to restrict
    the result set, and requires a parameter `id` to be specified.NetBeans IDE provides
    a JPQL Query dialog so that you can verify queries without deploying the application.
    Before you use it, make sure to compile the JPA entities in your application,
    since these compiled classes are used by the JPQL Query dialog. Then, as shown
    in [Figure 2-8](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos105311),
    right-click the `persistence.xml` file and choose Run JPQL Query to open the JPQL
    Query dialog.![image](images/00012.jpg)![image](images/00029.jpg)![image](images/00012.jpg)FIGURE
    2-8.   Opening the JPQL Query dialogIn the JPQL Query dialog, you can use code
    completion, CTRL-TAB (by default), to help you define your queries. When you run
    a query, the results are shown in the Result tab, as shown in [Figure 2-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos106237),
    while the SQL version of the query is available in the SQL tab.![image](images/00012.jpg)![image](images/00030.jpg)![image](images/00012.jpg)FIGURE
    2-9.   Showing query resultsCriteria APIThe `javax.persistence.Criteria` API is
    an object-based, type-safe alternative to string-based JPQL. It operates on a
    metamodel of the entities, which is typically generated by an annotation processor.
    The metamodel is a set of classes that describes your domain model and provides
    a generic way to deal with an application’s domain model. The APIs in the package,
    `javax.persistence.criteria` and `javax.persistence.metamodel`, are used to create
    this strongly typed query.[Listing 2-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos107692)
    shows how you can write the `Author.findAll` query using the `Criteria` API.![image](images/00016.jpg)Listing
    2-5   Author Criteria Query![image](images/00012.jpg)![image](images/00031.jpg)The
    `Criteria` query is verbose but provides a lot more flexibility in constructing
    dynamic queries.Native SQLIn certain cases, a native SQL statement may have to
    be used to query the database. The `javax.persistence.EntityManager.createNativeQuery()`
    method can used to specify the native SQL query string. [Listing 2-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos108910)
    shows how the `Author.findAll` named query can be executed as a native SQL query.![image](images/00016.jpg)Listing
    2-6   Author Native Query![image](images/00012.jpg)![image](images/00032.jpg)In
    this simplified case, the result set is mapped directly to the `Author` entity
    class. More complex mappings can be specified using the `@javax.persistence.SQLResultSetMapping`
    annotation.NetBeans IDE provides wizards to query the database using native SQL
    query strings. Switch to the Services window (CTRL-3) and expand the Databases
    node. Right-click a table node, as shown in [Figure 2-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos110091),
    and choose View Data to view data in the related table in the database.![image](images/00012.jpg)![image](images/00033.jpg)![image](images/00012.jpg)FIGURE
    2-10.   Viewing data defined in a databaseWhen the SQL editor opens, you have
    syntax coloring and code completion available to query the database and view the
    data directly in the IDE, as shown in [Figure 2-11](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos110914).![image](images/00012.jpg)![image](images/00034.jpg)![image](images/00012.jpg)FIGURE
    2-11.   Editing SQL query strings in the SQL editorA row from the database table
    can be removed by retrieving the required entity using any method. The `javax.persistence.EntityManager.remove()`
    method is called to remove the entity. Like the `javax.persistence.EntityManager.persist()`
    method, it must be called within a transaction. The entity’s state is persisted
    to the database when the transaction is committed, either implicitly by the container
    or explicitly by the user.NetBeans IDE provides a wizard to generate JPA controller
    classes that perform CRUD functionality for an entity class. In the IDE, right-click
    your application and choose New | Other | Persistence | JPA Controller Classes
    from Entity Classes.In addition, you can generate session beans for the entity
    classes in the application. In the IDE, right-click your application and choose
    New | Other | Enterprise JavaBeans | Session Beans for Entity Classes, which displays
    the New Session Beans for Entity Classes wizard page shown in [Figure 2-12](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos112725).![image](images/00012.jpg)![image](images/00035.jpg)![image](images/00012.jpg)FIGURE
    2-12.   Getting started creating session beans for existing entity classesSelect
    any entity classes from the Available Entity Classes list in the left pane, and
    click the Add button. Any referenced entity classes are automatically added to
    the Selected Entity Class list in the right pane. If an entity class is grayed
    out, that indicates it is a referenced entity class.Click Next to move to the
    Generated Session Beans page of the wizard, shown in [Figure 2-13](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos113908),
    and review or set the following:![image](images/00012.jpg)![image](images/00036.jpg)![image](images/00012.jpg)FIGURE
    2-13.   Specifying details for creating session beans    ![image](images/00007.jpg)   Project   Displays
    the project where the entity classes will be saved. This field is read-only.    ![image](images/00007.jpg)   Location   Select
    the source folder where you want to create the entity class.    ![image](images/00007.jpg)   Package   Select
    an existing package from the Package drop-down list or type the name of a new
    package.    ![image](images/00007.jpg)   Create Interfaces   Select the session
    facade interfaces that you want the wizard to generate.When you click Finish,
    the specified session beans are created, as shown in [Figure 2-14](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos115943).![image](images/00012.jpg)![image](images/00037.jpg)![image](images/00012.jpg)FIGURE
    2-14.   New session beans created in the applicationSchema GenerationTypically,
    the database schema is already defined and JPA entity classes can be generated
    from that. Alternatively, entity managers can be configured to generate database
    table definitions in an existing schema or table generation scripts by specifying
    `javax.persistence.schema-generation.*` properties in `persistence.xml`.[Listing
    2-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos117228) shows how
    these properties can be configured on an entity manager.![image](images/00016.jpg)Listing
    2-7   Generating Schema Using persistence.xml![image](images/00012.jpg)![image](images/00038.jpg)The
    following list explains these properties:    ![image](images/00007.jpg)   The
    `javax.persistence.schema-generation.database.action` property value specifies
    to drop the existing tables and create them again. The possible values are `none`,
    `create`, `drop-and-create`, and `drop`.    ![image](images/00007.jpg)   The `javax.persistence.schema-generation.create-source`
    property value specifies that the database creation should occur on the basis
    of the scripts.    ![image](images/00007.jpg)   The `javax.persistence.schema-generation.drop-source`
    property value specifies that the database deletion should occur on the basis
    of the scripts.        The possible values for the preceding two properties are
    `metadata`, `script`, `metadata-then-script`, and `script-then-metadata`. In this
    case, either script or metadata specified on the entity or a combination is used
    to create or drop tables.    ![image](images/00007.jpg)   The `javax.persistence.schema-generation.create-script-source`
    property value specifies the location of the database creation script.    ![image](images/00007.jpg)   The
    `javax.persistence.schema-generation.drop-script-source` property value specifies
    the location of the database deletion script.    ![image](images/00007.jpg)   The
    `javax.persistence.sql-load-script-source` property value specifies the location
    of SQL bulk load script.The last three property values specify that the script
    be packaged with the application. In this case, the location of the script is
    specified relative to the root of the persistence unit. Alternatively, a URL may
    externally identify the scripts.These properties enable generation of the database
    schema from scripts or entity metadata. In addition to the properties described
    previously, the following properties may be used to specify the generation of
    scripts:    ![image](images/00007.jpg)   `javax.persistence.schema-generation.scripts.action`
    can be used to specify which scripts need to be generated. The possible values
    are `none`, `create`, `drop-and-create`, and `drop`.    ![image](images/00007.jpg)   `javax.persistence.schema-generation.scripts.create-target`
    and `javax.persistence.schema-generation.scripts.drop-target` can be used to specify
    the location of create and drop scripts. The locations are specified as strings
    corresponding to file URLs.JPA provides several annotations such as `@javax.persistence.Index`,
    `@javax.persistence.ForeignKey`, `@javax.persistence.CollectionTable`, `@javax.persistence.JoinTable`,
    and `@javax.persistence.JoinColumn` that can be specified on an entity to facilitate
    database or scripts generation.NetBeans IDE provides a wizard that simplifies
    the generation of scripts based upon metadata. In the IDE, right-click your application
    and choose New | Other | Persistence | DB Scripts for Entity Classes to generate
    the scripts.The Java Persistence API also provides a mechanism for second-level
    caching, optimistic and pessimistic locking, entity lifecycle listeners, and many
    more advanced concepts.SummaryThis chapter described the key concepts of persistence
    and explained how data can be created, read, updated, and deleted from a relational
    database using JPA. It also looked at how relational database tables can be easily
    mapped to JPA entities, and it presented the requirements around their packaging.
    Different types of Enterprise JavaBeans were introduced and their transactional
    nature was explained briefly. Finally, this chapter demonstrated how the database
    tables can be easily generated using the properties defined in `persistence.xml`.
    NetBeans IDE tools and wizards were shown throughout the chapter to highlight
    the simplified development process. The next chapter will take these JPA entities
    and publish them as RESTful endpoints.![image](images/00008.jpg)CHAPTER3RESTful
    ResourcesREST, or Representational State Transfer, is an architectural style for
    distributed systems such as the World Wide Web. This term was originally introduced
    and defined in 2000 by Roy Fielding in his dissertation Architectural Styles and
    the Design of Network-based Software Architectures. Fielding’s motivation for
    choosing the dissertation topic was his “desire to understand and evaluate the
    architectural design of network-based application software through principled
    use of architectural constraints, thereby obtaining the functional, performance,
    and social properties desired of an architecture.” See [www.ics.uci.edu/~fielding/pubs/dissertation/introduction.htm](http://www.ics.uci.edu/~fielding/pubs/dissertation/introduction.htm).
    This was achieved by defining a framework to understand the software architecture
    of network-based applications. The thesis then describes how REST is used to guide
    the design and development of the architecture for the modern Web.Modern applications
    typically publish their APIs using REST architecture. For example, Twitter’s REST
    API is published at [https://dev.twitter.com/docs/api](https://dev.twitter.com/docs/api).
    Integrating any Twitter functionality, such as searching for tweets with a particular
    hashtag or obtaining a collection of the most recent tweets, can be accomplished
    by invoking the Twitter REST API and processing the result in your application.This
    chapter explains the key REST principles and how REST services can be published
    and invoked from Java.REST PrinciplesThe World Wide Web is the largest implementation
    of a system conforming to the REST architectural style. In that context, REST
    is a set of principles that defines how web standards, such as HTTP and URIs,
    are supposed to be used for building your applications. To successfully build
    Java EE applications that utilize web standards, you’ll need to understand the
    guiding principles of REST architecture. These principles will guide you as you
    define resources and set up services.The guiding principles of REST architecture
    are    ![image](images/00007.jpg)   Resource   The key information in this architecture
    is a resource. Any information that can be named can be a resource: a document
    or image, a book, an author, a collection of other resources, and so on.    ![image](images/00007.jpg)   Client
    and server   A client-server model is used where a client initiates a request
    to the server; the server processes the request and returns an appropriate response
    to the client. Requests and responses are built around the transfer of resources.    ![image](images/00007.jpg)   Identification
    of resources   Every resource can be uniquely identified on the client and server.
    Everything on the Web can be identified as a resource, and each resource can be
    uniquely identified by a URI.    ![image](images/00007.jpg)   Resources are available
    in multiple representations   A resource can be represented in multiple formats,
    defined by a media type. The client and server can negotiate on the content type
    of the resource.    ![image](images/00007.jpg)   Standard methods can be used
    to manipulate these resources   Each resource can be created, read, updated, and
    deleted using standard methods. HTTP defines verbs such as GET, PUT, POST, and
    DELETE to manipulate resources on the Web.    ![image](images/00007.jpg)   Communicate
    statelessly   The server does not retain any communication state for any of the
    clients beyond a single request. If state is required, then it should be kept
    on the client or converted into resource state. This allows the server to scale
    much better.You will see how each of these principles is used with the Java API
    for REST as you continue in this chapter, and with the JavaScript API for REST
    in [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295).Java
    API for RESTful Web ServicesJava API for RESTful Web Services (JAX-RS) defines
    a standard, annotation-driven API that helps developers develop and invoke a RESTful
    web service in Java. JAX-RS 1.1 was first included in the Java EE 6 platform.
    Java EE 7 includes JAX-RS 2.0, which is a deep revision of JAX-RS that adds several
    features that can handle the most modern style of web applications.Let’s consider
    a REST resource that provides create, read, update, and delete operations on an
    author database. Such a REST resource can be invoked using any of the standard
    HTTP verbs such as POST, GET, PUT, or DELETE. The endpoint should have the capability
    to publish and consume resource representations in multiple formats. A complete
    list of authors or a specific author should be accessible. A REST endpoint that
    publishes and consumes multiple representations of the author resource using common
    HTTP verbs is shown in [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385).![image](images/00016.jpg)Listing
    3-1   Author REST Resource![image](images/00012.jpg)![image](images/00039.jpg)The
    following information will help you to understand this code:![image](images/00007.jpg)   A
    POJO can be converted to a REST resource by adding `@javax.ws.rs.Path` annotation
    to the class. The annotation defines the URI where the resource is accessible—`authors`
    in this case. Paths are relative. For an annotated class, the base URI is defined
    using `@javax.ws.rs.ApplicationPath` annotation on a class that extends the `javax.ws.rs.core.Application`
    class. The complete URI of the resource is defined as: ![image](images/00040.jpg)So
    if the resource is packaged in a WAR file with the context root “sahara” and deployed
    on the host “localhost” and the port “8080” with the base URI “webresources,”
    then the complete path of the resource would be ![image](images/00041.jpg)    ![image](images/00007.jpg)   A
    subresource of the main resource can be defined by annotating a method of the
    root resource with `@javax.ws.rs.Path` annotation. The base URI of this subresource
    is the effective URI of the containing class. The annotated method is invoked
    whenever the resource is accessed using the complete path defined by the base
    URI and the path specified on the method. In [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    the `count()` method is called if the resource is accessed at the `webresources/authors/count`
    path. Note that the `count()` method is also annotated with `@javax.ws.rs.GET`
    annotation, but it is available at a different path because it is defined as a
    subresource.        The `@javax.ws.rs.Path` annotation can take a URI template
    parameter. The value passed to this template parameter can be bound to a resource
    method parameter using `@javax.ws.rs.PathParam` annotation. In [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    the `find()` method is called if the resource is accessed at the `webresources/authors/``nnn`
    path, where `nnn` is some value. The `id()` method parameter is populated with
    the value `nnn` and invokes the `find()` method on the EJB.    ![image](images/00007.jpg)   In
    addition, although not shown in [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    cookies can be bound to a parameter using `@javax.ws.rs.CookieParam` annotation,
    HTTP headers can be bound to a parameter using `@javax.ws.rs.HeaderParam` annotation,
    a matrix parameter can be bound to a method parameter using `@javax.ws.rs.MatrixParam`
    annotation, and parameters coming through an HTML form can be bound to a method
    parameter using `@javax.ws.rs.FormParam` annotation.    ![image](images/00007.jpg)   Validation
    constraints, although not shown in [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    can be specified on the method parameters to ensure that only valid values are
    accepted for method parameters. A `javax.constraint.ConstraintViolation` exception
    is thrown if the incoming values do not meet the criteria (for example, an alphabetic
    value is sent when only a numeric value is expected). This can be easily specified
    using any of the `@javax.validation.constraints.Min`, `@javax.validation.constraints.Max`,
    `@javax.validation.constraints.Digits`, or similar annotations on the method parameter.
    The specification even defines an extensible mechanism by which custom constraints
    meeting application needs can be easily defined.    ![image](images/00007.jpg)   Any
    Java EE component can be injected into the resource using Dependency Injection.
    An Enterprise JavaBean, `AuthorSessionBean`, is injected in [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385)
    to ensure that all the business logic is defined in the bean. This ensures that
    any code related to retrieving, adding, or updating from the database is automatically
    done within a transaction and stays within the EJB. This is important as the runtime
    container starts and commits or rolls back the transaction to ensure the ACID
    properties of the underlying database are preserved automatically. Otherwise,
    the application will have to manually create a transaction and manage it by itself.    ![image](images/00007.jpg)   Java
    EE 7 introduces `@javax.transaction`. Transactional annotation, although not shown
    in [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    allows all methods within a bean or any method in the bean to be selectively transactional.
    This is implemented as a CDI interceptor binding and allows the application developer
    a choice of using EJB or a POJO for container-managed transactions.    ![image](images/00007.jpg)   Different
    HTTP verbs such as GET, PUT, POST, and DELETE are identified by the corresponding
    annotations in the `javax.ws.rs` package.    ![image](images/00007.jpg)   The
    `findAll()` method is called when the resource is accessed using HTTP GET. The
    path of the resource or subresource is defined as explained earlier. The media
    type generated by a method is described using `@javax.ws.rs.Produces` annotation.
    A method can support one or more media types, and the client requesting the resource
    can ask for a specific media type using the standard HTTP `Accept` header. The
    return value from the method is converted to the appropriate media type and sent
    on the wire to the client. If this annotation is not specified, then the container
    assumes that any type can be produced. It is recommended to specify the return
    media type to ensure that the client and endpoint are aware of the contract.    ![image](images/00007.jpg)   JAX-RS
    provides the `javax.ws.rs.core.MediaType` class, which provides strongly typed
    fields for commonly used media types. For example, `MediaType.APPLICATION_JSON_TYPE`
    can be used instead of `application/json`. However, some developers prefer the
    literal to be specified in their endpoint because it improves the readability
    of the code.    ![image](images/00007.jpg)   If a resource is represented using
    multiple media types and the client has not indicated any preference, then the
    endpoint can indicate a media preference using the `qs` attribute (short for “quality
    of service”). `qs` is a floating-point number with a value in the range of 0.000
    through 1.000 and indicates the relative quality of a representation compared
    to the others available, independent of the client’s capabilities. A representation
    with a `qs` value of 0.000 will never be chosen. A representation with no `qs`
    parameter value is given a `qs` factor of 1.0\. In [Listing 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos131385),
    if a client requests the resource with the `*/*` media type or no preferred representation,
    then JSON representation of the resource is returned because that has a higher
    priority (`qs=1`) than the only other media type listed, XML (`qs=0.75`). However,
    if the client explicitly asks for the `application/xml` media type, then an XML
    representation is returned instead.    ![image](images/00007.jpg)   By default,
    standard media types such as `application/xml` and `application/json` are supported.
    Providing entity providers that know how to read/write media types from the stream
    can support application-specific media types.    ![image](images/00007.jpg)   The
    `@javax.ws.rs.Consumes` annotation is used to define the media type that can be
    consumed by a method. A method can consume multiple media types, and the actual
    media type is identified using the HTTP `Content-Type` header. If this annotation
    is not specified, then the container assumes that any type can be consumed.    ![image](images/00007.jpg)   A
    resource can be updated by annotating a method with `@javax.ws.rs.PUT` annotation.
    Similarly, a resource can be deleted by annotating a method with `@javax.ws.rs.DELETE`
    annotation.Out of the box, NetBeans IDE provides many wizards to help you get
    started developing web services, many of which are shown in [Figure 3-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos142939).![image](images/00012.jpg)![image](images/00042.jpg)![image](images/00012.jpg)FIGURE
    3-1.   New File dialog showing web service wizardsFor example, RESTful web services
    can be generated directly from your database. [Figure 3-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos143841)
    shows one step in this process. No entity classes need be present in your application
    because the wizard will create those from your database, too.![image](images/00012.jpg)![image](images/00043.jpg)![image](images/00012.jpg)FIGURE
    3-2.   RESTful Web Services from DatabaseJAX-RS Client APIPrior to the release
    of JAX-RS 2.0, invoking a REST resource required writing boilerplate code using
    `java.net.URL` and a related set of classes. Marshaling and unmarshaling Java
    objects to resource representations had to be done manually. Any errors received
    from the endpoint had to be again manually mapped to more meaningful exceptions
    on the client side. JAX-RS 2.0 introduces a Client API that can be used to invoke
    a REST resource from a Java application. This API can be used to consume any web
    service exposed on top of an HTTP protocol or its extension (e.g., WebDAV) and
    is not restricted to services implemented using JAX-RS.Let’s see how a REST endpoint
    can be invoked using this API ([Listing 3-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos145419)).![image](images/00016.jpg)Listing
    3-2   JAX-RS Client API Usage![image](images/00012.jpg)![image](images/00044.jpg)The
    following list explains this code:    ![image](images/00007.jpg)   The `javax.ws.rs.client.ClientBuilder`
    is the entry point to the fluent JAX-RS Client API. A new `javax.ws.rs.client.Client`
    instance can be created by calling the `newClient()` method. This instance is
    then used to build and execute client requests in order to consume responses returned.
    It is recommended to create only a required number of `Client` instances in the
    application, as the initialization and disposal of a `Client` instance may be
    a rather expensive operation.    ![image](images/00007.jpg)   The web resource
    URI is passed to the `target()` method and builds a `javax.ws.rs.client.WebTarget`
    instance. A builder-style API is used to build a request to the targeted web resource.
    The `request()` method starts building the request. Optionally, the media types
    acceptable in the response can be specified as a method parameter. These types
    can also be specified as parameters to `request().accept()` method. Once the request
    is prepared, it can be invoked using the intuitive `get(), put(), post()`, and
    `delete()` methods. The response can be automatically converted to a Java type
    by specifying the type as a method parameter. In this case, the response is returned
    as an array of `Author`.Out of the box, NetBeans IDE provides a New RESTful Java
    Client wizard to let you quickly and easily create a Java web service client for
    an existing RESTful web service. [Figure 3-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos148065)
    shows the final step in this wizard.![image](images/00012.jpg)![image](images/00045.jpg)![image](images/00012.jpg)FIGURE
    3-3.   New RESTful Java Client wizardAfter you select the location of the web
    service and click Finish, the IDE will create the Java client for you. Alternatively,
    you can create an HTML/JavaScript/CSS front end for your RESTful web service via
    the RESTful JavaScript Client wizard, as shown in [Figure 3-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos148985).![image](images/00012.jpg)![image](images/00046.jpg)![image](images/00012.jpg)FIGURE
    3-4.   New RESTful JavaScript Client wizardIn a standard HTTP request-response
    scenario, a JavaScript client or a Java client using the JAX-RS Client API opens
    a connection to the resource endpoint, sends an HTTP request to the server (for
    example, an HTTP GET request), and then receives an HTTP response back; the server
    closes the connection once the response is fully sent/received. The client always
    initiates the request and “pulls” the information from the server as required.
    Sometimes there may be a need for a server to asynchronously “push” information
    to the client. For example, a stock ticker endpoint can push the updated stock
    price to the client. In our example, information about a new book can be pushed
    to the client.Server-Sent EventsTypically, a client initiates a request to the
    server and receives a response. Server-Sent Events (SSE) is a mechanism that allows
    the server to asynchronously push the data from the server to the client whenever
    a new “chunk” of data is available. The client is still responsible for establishing
    the connection with the server. When new data is ready to be sent on the server,
    the server sends the data event to the client, hence the name, Server-Sent Events.A
    server-sent event is generated on the server side with a predefined media type
    of `text/event-stream`. There is no restriction for a media type used in individual
    event messages. On the client side, the standard EventSource JavaScript API is
    used to open an HTTP connection for receiving push notifications from the server.
    These events are received in callback handlers registered in the client JavaScript
    and are used to update the client.Note that SSE will be a final specification
    along with the rest of HTML5\. This is targeted to be final in late 2014\. Until
    then, SSE cannot be added as a standard API to JAX-RS. However, the JAX-RS reference
    implementation, Jersey, has added support for SSE. This chapter will use Jersey
    to implement that functionality in our application and explain SSE.Let’s say you
    have a `Book` resource to represent the books written by an author. This resource
    can be described following the design pattern used for the `Author` resource.
    Now let’s say you update the `Book` resource endpoint such that it generates a
    server-sent event whenever a new book is added.First of all, you need to enable
    support for SSE for the JAX-RS application. As this is not part of the standard
    JAX-RS API, you need to update the `pom.xml` file to include the SSE media type
    module, as shown in [Listing 3-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos152750).![image](images/00016.jpg)Listing
    3-3   Jersey SSE Media Dependency![image](images/00012.jpg)![image](images/00047.jpg)Next,
    you need to register `org.glassfish.jersey.media.sse.SseFeature` in the `Application`
    class, as shown in [Listing 3-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos153499).![image](images/00016.jpg)Listing
    3-4   Adding SseFeature to JAX-RS![image](images/00012.jpg)![image](images/00048.jpg)The
    `getClasses()` method returns a set of root resources, feature, and feature classes.
    Adding `SseFeature`, in addition to other resources, to the set of classes returned
    from this method takes care of registering the feature.Then, you need to add or
    update methods that push SSE to the client, as shown in [Listing 3-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos154520).![image](images/00016.jpg)Listing
    3-5   Updating SSE Methods![image](images/00012.jpg)![image](images/00049.jpg)[Listing
    3-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_011.html_filepos154520) shows only
    the updated methods. The following list explains this code:    ![image](images/00007.jpg)   Generating
    SSE on the server side is a two-step process. First, clients that want to listen
    to SSE send a GET request to this resource at `/books/events`, which is handled
    by the `getEvents()` method. Second, the method creates a new `EventOutput` instance
    representing a connection to the requesting client and registers it with the broadcaster
    using the `add(eventOutput)` method. `EventOutput` allows the underlying connection
    to remain open so that the application can push SSE later.    ![image](images/00007.jpg)   `@Produces`
    on this method ensures that the media type of the returned type is `text/event-stream`.    ![image](images/00007.jpg)   `SseBroadcaster`
    provides a convenient way of grouping multiple `EventOutput` instances and broadcasting
    new events to all the client connections grouped in the broadcaster.    ![image](images/00007.jpg)   `SseFeature`
    adds support for a new entity Java type, namely `OutboundEvent`. This entity can
    be used to create any server outbound events. `SseFeature` also adds support for
    `InboundEvent`, which can be used for inbound client events for the JAX-RS Client
    API.    ![image](images/00007.jpg)   The `create()` method is updated to broadcast
    a message to all the clients listening on their SSE connections. A new SSE outbound
    event is built in the standard way and passed to the broadcaster by calling the
    `broadcast` message. The broadcaster internally invokes `write(OutboundEvent)`
    on all registered `EventOutput` instances. As mentioned earlier, there is no restriction
    on the media type for individual event messages. This application is sending a
    plain text message as a server-sent event.    ![image](images/00007.jpg)   Individual
    `EventOutput` instances can be stored in a collection and iterated over in the
    `create()` method. However, `SseBroadcaster` also internally identifies and handles
    client disconnects. When a client closes the connection, the broadcaster detects
    this and removes the stale connection from the internal collection of the registered
    `EventOutput` instances. The broadcaster also frees all the serverside resources
    associated with the stale connection. Additionally, `SseBroadcaster` is implemented
    to be thread-safe so that clients can connect and disconnect at any time; `SseBroadcaster`
    will always broadcast messages only to the most recent collection of registered
    and active set of clients.In addition to addressing many other HTML5 client-specific
    topics, [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295)
    will show you how SSE is consumed on the client side.SummaryYou started this chapter
    by learning about the origins of REST and what the guiding principles are for
    a RESTful architecture. You then learned from the Java EE perspective how a RESTful
    resource can be developed, deployed, and invoked using the standard Java API for
    RESTful Web Services (JAX-RS). Design patterns for integrating other Java EE technologies
    with your RESTful resources were discussed. Finally, you were introduced to how
    support for Server-Sent Events can be easily incorporated using the JAX-RS reference
    implementation, Jersey. You were also shown throughout the chapter how NetBeans
    IDE can speed the creation and implementation of these Java EE features. In the
    next chapter, you will be shown how to work with an exciting new area of HTML5
    called WebSocket.![image](images/00008.jpg)CHAPTER4WebSocketHTTP was designed
    to share information over the Internet, and it has served very well in that respect.
    But it is inherently half-duplex; that is, the client (in most cases the browser)
    initiates a request to an HTTP server, and the server processes the request and
    responds to the client. Web applications that require the server to push information
    to the client have typically achieved that functionality by abusing the protocol,
    such as via polling and long polling.In polling, a client requests a resource
    from a server using normal HTTP at regular intervals. A new connection to the
    server is opened at the specified interval, say after three seconds, and the server
    returns any new information in the response. The connection is closed after the
    client has received the information. It is likely that new information is not
    available for each request. This also requires tuning the interval at which the
    information is requested, and is generally application-specific. Therefore, this
    is not a very efficient way to push information from server to client.In long
    polling, a client requests a resource from a server using normal HTTP. The server
    does not immediately respond with the requested information but rather waits and
    responds when new information is available. The client receives the new information,
    closes the connection, and immediately sends another request to the server. This
    type of polling keeps an open connection between the client and the server indefinitely,
    with possibly no data exchanged during the majority of the time. It also requires
    opening a new connection after a response is received. This is also not efficient
    utilization of resources.The Server-Sent Events (SSE) specification included in
    HTML5 provides a similar mechanism to the long polling mechanism, except it does
    not send only one message per connection. The client sends a request and the server
    holds open a connection until a new message is ready. It sends a message back
    to the client when new information is available while still keeping the connection
    open. This allows the connection to be reused for subsequent messages, or events.For
    a regular HTTP request and response, each HTTP request requires establishing a
    new TCP connection to the server, and that connection is terminated after the
    HTTP response has been received. Setting up a TCP connection is an expensive operation
    but is rather invisible if the number of HTTP requests is low. If the number of
    requests increases, then creation and termination of the TCP connection with each
    HTTP message exchange reduces the overall performance of the application.HTTP
    also has a high overhead for a wire protocol. A minimum set of headers must be
    exchanged on-the-wire between the client and the server in order to fulfill the
    protocol requirements. There is a processing cost associated with parsing these
    headers that further reduces the performance of an application if the number of
    message exchanges increases.In short, HTTP is a half-duplex and verbose protocol
    that is inefficient for full-duplex and bidirectional communication between client
    and server. This is exactly the need served by WebSocket.What Is WebSocket?WebSocket
    is a full-duplex, bidirectional protocol that uses a single TCP connection for
    exchanging messages in both directions.WebSocket is defined by two different specifications:    ![image](images/00007.jpg)   WebSocket
    Protocol, RFC 6455   [http://tools.ietf.org/html/rfc6455](http://tools.ietf.org/html/rfc6455)    ![image](images/00007.jpg)   W3C
    WebSocket API   [www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/)RFC
    6455 defines how a WebSocket connection can be established using a handshake.
    It also defines the wire protocol for WebSocket message exchange. The W3C WebSocket
    API is a JavaScript API that is implemented by different browsers. This API can
    then be used by web applications to make connections to WebSocket endpoints and
    exchange messages.WebSocket HandshakeSection 14.42 of HTTP 1.1 (RFC 2616) defines
    an upgrade mechanism that allows a transition from the HTTP 1.1 protocol to a
    different protocol. In this case, to the WebSocket protocol. After an upgrade
    is negotiated between the client and the server, the subsequent requests use the
    newly chosen protocol for message exchanges.RFC 6455 defines how a WebSocket client
    can make an HTTP upgrade request. This is called a WebSocket client handshake
    and is shown in [Listing 4-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos166708).![image](images/00016.jpg)Listing
    4-1   WebSocket Client Handshake![image](images/00012.jpg)![image](images/00050.jpg)[Listing
    4-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos166708) shows a typical
    client opening handshake request. The header fields in the handshake may be sent
    in any order. In this fragment, the first couple of lines are like a usual HTTP
    request, indicating that this is a GET request and identifying the host and URI
    to which the request is addressed. The key part to notice here is that the WebSocket
    protocol attempts to achieve bidirectional communication in the context of existing
    HTTP infrastructure. This allows the protocol to work over HTTP ports 80 and 443
    and to support HTTP proxies and intermediaries.The WebSocket-related header fields
    in [Listing 4-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos166708)
    are as follows:    ![image](images/00007.jpg)   The `Upgrade` and `Connection`
    header fields mark this HTTP request as an upgrade request, specifically requesting
    an upgrade to WebSocket.    ![image](images/00007.jpg)   Different subprotocols
    can be negotiated using the `Sec-WebSocket-Protocol` header field. If you choose
    to define a subprotocol, that same field must be included on both the server and
    client. It is also recommended that any subprotocol be registered with the Internet
    Assigned Numbers Authority (IANA) to help avoid naming conflicts.    ![image](images/00007.jpg)   The
    `Sec-WebSocket-Version` header is returned by the server and must be set to a
    value of 13.    ![image](images/00007.jpg)   The `Origin` header field is used
    to protect against unauthorized cross-origin use of the WebSocket server by scripts
    using the WebSocket API in a web browser.    ![image](images/00007.jpg)   If the
    server is capable of handling this upgrade request, then it processes the received
    `Sec-WebSocket-Key` header field using a predefined algorithm and returns the
    generated value in the server handshake response.A typical server opening handshake
    response looks like this:![image](images/00016.jpg)![image](images/00051.jpg)The
    first line is an HTTP status line and indicates that the handshake was successful.
    The `Upgrade` and `Connection` header fields complete the HTTP upgrade. The `Sec-WebSocket-Accept`
    header field must contain the value generated on the server using the predefined
    algorithm defined by RFC 6455\. All these header fields must be present in order
    for the handshake to be complete.Once a connection is established between the
    client and server, they are considered to be peers with equal capabilities. Each
    can send messages to the other without waiting for the other to respond.Either
    peer can initiate the closing handshake by sending a Close control frame with
    data containing a specified control sequence. The receiving peer sends a Close
    control frame in response indicating that the connection is now closed.A peer
    does not send any further data after sending a Close control frame. Similarly,
    a peer discards any further data received after receiving a Close control frame.
    The WebSocket closing handshake then initiates the TCP closing handshake as well.WebSocket
    APIThe WebSocket API ([www.w3.org/TR/websockets/](http://www.w3.org/TR/websockets/))
    enables web pages to use the WebSocket protocol for two-way communication with
    a remote host.WebSocket can send and receive text and binary data. The API provides
    an overloaded `send` method that can send text or binary data by taking any of
    the following parameters:    ![image](images/00007.jpg)   Text: `String`    ![image](images/00007.jpg)   Binary:
    `Blob, ArrayBuffer, ArrayBufferView`The API provides event handlers that are invoked
    for different lifecycle events and when a message is received:    ![image](images/00007.jpg)   Lifecycle
    events: `onopen(), onerror(), onclose()`    ![image](images/00007.jpg)   Message:
    `onmessage()`Java API for WebSocketJava API for WebSocket defines a set of Java
    APIs for the development of WebSocket applications. The API enables you to define
    a server endpoint and a client endpoint. A server endpoint listens for requests
    from multiple clients. A client endpoint communicates with only one server.You
    can define a server endpoint or a client endpoint by decorating a POJO with annotations
    from the Java API for WebSocket. Such an endpoint is called an annotated endpoint.
    Alternatively, you can extend some of the classes from the Java API for WebSocket
    to provide a more fine-grained control over the endpoint. This type of endpoint
    is called a programmatic endpoint.In this chapter, we’ll build the legendary game
    of tic-tac-toe using WebSocket. In this game, two players, identified by X and
    O, take turns marking the squares in a nine-square grid composed of three columns
    and three rows. The player who succeeds in placing their respective mark (X or
    O) in three consecutive squares horizontally, vertically, or diagonally wins the
    game.The annotated endpoint for the game is shown in [Listing 4-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos175182).![image](images/00016.jpg)Listing
    4-2   WebSocket Endpoint Annotations![image](images/00012.jpg)![image](images/00052.jpg)The
    following list explains the code shown in [Listing 4-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos175182):    ![image](images/00007.jpg)   `@ServerEndpoint`
    is a class-level annotation that decorates a POJO to be a WebSocket endpoint.
    The annotation allows the developer to define the URL where this endpoint is published
    using the `value` attribute.        By default, a new instance of the endpoint
    is created per application per virtual machine (VM) to represent the logical endpoint
    per connected peer. Each instance of the endpoint in this typical case handles
    connections to the endpoint from one and only one peer.    ![image](images/00007.jpg)   The
    `configurator` attribute can be used to specify a `ServerEndpointConfig.Configurator`
    class that can be used to provide a singleton instance of the endpoint for all
    the peers. Custom configuration algorithms, such as intercepting the opening handshake,
    can also be specified using this configurator. This attribute is not used in this
    example.        Additional configuration information can be specified using other
    attributes; for example, the `decoders` attribute defines an ordered array of
    decoder classes used by this endpoint. `BoardDecoder.class` converts WebSocket
    messages into an application-defined `Board` object. The implementation creates
    a new instance of the decoder per endpoint instance per connection.    ![image](images/00007.jpg)   The
    annotated class must have a public no-args constructor.    ![image](images/00007.jpg)   `games`
    is a Map object that stores the unique identifier of the client with the corresponding
    symbol.    ![image](images/00007.jpg)   `@OnOpen` is a method-level annotation
    that decorates a Java method to be called when a new WebSocket connection is open.
    The method may take the following parameters:        ![image](images/00007.jpg)   An
    optional `Session` parameter that represents a conversation between two WebSocket
    endpoints        ![image](images/00007.jpg)   An optional `EndpointConfig` parameter
    that contains the information used during the handshake for this endpoint        ![image](images/00007.jpg)   Zero
    to n String parameters annotated with `@PathParam` annotation that maps the URI
    template specified in the path mapping of the endpoint        This method defines
    the player’s symbol, puts it in the `games` Map object keyed by the client identifier,
    and also sends a message back to the player indicating the symbol.    ![image](images/00007.jpg)   `@OnMessage`
    is a method-level annotation that decorates a Java method to be called when an
    incoming WebSocket message is received. Each WebSocket endpoint may have only
    one method for each of the native WebSocket message formats: text, binary, and
    pong. If the method is handling text messages, then the parameter may be one of
    the following:        ![image](images/00007.jpg)   `String` to receive the whole
    message        ![image](images/00007.jpg)   Java primitive or class equivalent
    to receive the whole message converted to that type        ![image](images/00007.jpg)   `String`
    and `boolean` pair to receive the message in parts        ![image](images/00007.jpg)   `Reader`
    to receive the whole message as a blocking stream        ![image](images/00007.jpg)   Any
    object parameter for which the endpoint is a text decoder        If the method
    is handling binary messages, then the parameter may be one of the following:        ![image](images/00007.jpg)   `byte[]`
    or `ByteBuffer` to receive the whole message        ![image](images/00007.jpg)   `byte[]`
    and `boolean` pair, or `ByteBuffer` and `boolean` pair, to receive the message
    in parts        ![image](images/00007.jpg)   `InputStream` to receive the whole
    message as a blocking stream        ![image](images/00007.jpg)   Any object parameter
    for which the endpoint is a binary decoder        If the method is handling pong
    messages, then the parameter should be `PongMessage`.        In this case, `Board`
    is decoded by `BoardDecoder`. An optional `Session` parameter is specified to
    represent the conversation between two endpoints.        If the received board
    status is set to `"clear"`, then all games are removed from the `games` Map and
    the connection to the client peer is also closed. Otherwise, the symbol is retrieved
    from the `games` Map.    ![image](images/00007.jpg)   Java API for JSON Processing
    provides a standard API to parse and generate JSON. It allows production/consumption
    of JSON text in a streaming fashion (similar to StAX API for XML), or allows the
    building of a Java object model (similar to DOM API for XML).A streaming generator
    is created using the `Json.createGenerator()` method. A `Writer` or an `OutputStream`
    can be passed to this method. A `Writer` is used to write to a character stream,
    and an `OutputStream` is used to write to a byte stream. A JSON structure indicating
    the current symbol used in the game and the x and y coordinates in the grid are
    created. It looks like: ![image](images/00053.jpg)    ![image](images/00007.jpg)   The
    `session.getOpenSessions()` method provides a list of all the listening clients.
    This generated JSON text is sent to all the listening clients, which then update
    the state of the game board.`BoardDecoder.class` decodes the incoming text payload
    and converts it to the application-specific `Board` class. [Listing 4-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos186569)
    shows what it looks like.![image](images/00016.jpg)Listing 4-3   BoardDecoder
    Class![image](images/00012.jpg)![image](images/00054.jpg)The following list describes
    the code shown in [Listing 4-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos186569):    ![image](images/00007.jpg)   The
    text-based decoder typically implements the `Decoder.Text<T>` interface, and the
    binary-based decoder typically implements the `Decoder.Binary<T>` interface.        In
    addition, there are `Decoder.TextStream` and `Decoder.BinaryStream` interfaces
    that read the WebSocket message from a character or binary stream, respectively.    ![image](images/00007.jpg)   The
    `Decoder.Text<T>` interface requires implementing the `decode()` method that decodes
    the given String into an object of type `T`. In our method implementation, the
    message payload is read using a `Reader` and then converted into a `JsonObject`.
    Different values read from the parsed object are used to populate the application-specific
    `Board` class. An overloaded version of the `getString()` method is used to define
    a default value of `null`.    ![image](images/00007.jpg)   The interface also
    requires implementing the `willDecode()` method. This method returns `true` if
    the given String can be decoded to an object of type `T`. Our method implementation
    tries to parse the message payload as `JsonObject`. If the parsing is successful,
    then it returns `true`; it returns `false` otherwise.Other lifecycle methods like
    `init()` and `destroy()` need to be implemented. They are no-op in this case.HTML5
    Client Application for WebSocketThe client-side code for the tic-tac-toe application
    that you’ve been working on so far is all located in the Web Pages folder in the
    NetBeans IDE navigator window, as shown in [Figure 4-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos190089).
    Over the next sections of this chapter, you will build the client code that connects
    to the WebSocket service you created in previous sections.![image](images/00012.jpg)![image](images/00055.jpg)![image](images/00012.jpg)FIGURE
    4-1.   Client code in IDEHTML5 Application SetupThe client side of this tic-tac-toe
    application is created using a couple of different JavaScript frameworks. Twitter
    Bootstrap is used for the basic look and feel, as well as to enable the application
    to resize as the browser window changes size—called responsive design (covered
    in more detail in [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295)).
    The second framework is Knockout.js.[Listing 4-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos191413)
    shows how the `index.html` file is set up to load all of the dependencies.![image](images/00016.jpg)Listing
    4-4   Loading Dependencies in index.html![image](images/00012.jpg)![image](images/00056.jpg)Let’s
    take a look at how the application is configured in the <head> section of the
    `index.html` file. This application uses Knockout.js ([http://knockoutjs.com/](http://knockoutjs.com/))
    to implement a Model-View-ViewModel (MVVM) architectural pattern. All of this
    will be explained in much more detail in [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295),
    but for now, you can see in this code that the Knockout JavaScript libraries are
    being added with a simple <script> reference. The other JavaScript libraries being
    used are jQuery and Bootstrap.To get the proper layout and style for the game,
    Twitter Bootstrap CSS files and an override CSS file are referenced. CSS files
    are read in the order in which they are listed, so the `override.css` files must
    come last in the list of all CSS files.The two JavaScript files that you will
    work with the most for connecting up the WebSocket interface and managing the
    game itself are found in `websocket.js` and `tictactoe.js`.[Listing 4-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos193435)
    shows the main sections of the body of the `index.html` file and how the view
    layer of the application is set up.![image](images/00016.jpg)Listing 4-5   Main
    Sections of index.html File![image](images/00012.jpg)![image](images/00057.jpg)![image](images/00058.jpg)![image](images/00059.jpg)Let’s
    take a look at the different sections of the code:    ![image](images/00007.jpg)   The
    first section of the code is the <header> element, which does exactly what its
    name suggests: it defines the header for the main game page.    ![image](images/00007.jpg)   The
    playing area is broken into two <section> elements. The first <section> element
    shows the current player information and any messages that may need to be displayed
    while the game is being played. The second <section> element is the game board
    itself. This is a nine-square grid (three columns by three rows) whose layout
    is managed by the CSS grid layout provided by Twitter Bootstrap. The key things
    to notice in the game board layout are that the x and y coordinates for each cell
    are being set as data attributes for the specific cell, and that a click binding
    has been set up for each cell using a Knockout data binding. Each cell also has
    a blank image set by default as a placeholder. The importance of the Knockout
    binding is that it allows us to do all of our WebSocket integration at the JavaScript
    layer and just assign the information that needs to be displayed in the game board,
    via Knockout’s two-way binding mechanism. We do not have to set up any kind of
    event listeners on HTML DOM elements ourselves. All of that is handled by Knockout
    for us.    ![image](images/00007.jpg)   The last section is the <footer> element.
    It contains a list of links for the footer of our page. Again, Knockout is being
    used to dynamically provide the links themselves.When the `index.html` file is
    loaded in the browser, each dependency is loaded in the order in which it’s listed
    in the <head> section of the page. In the `tictactoe.js` file, there is a jQuery
    JavaScript call set up to bind the Knockout.js viewmodel to the view layer once
    the HTML page is fully loaded. [Listing 4-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos196857)
    shows this code.![image](images/00016.jpg)Listing 4-6   Knockout.js Binding![image](images/00012.jpg)![image](images/00060.jpg)When
    the Knockout binding is made, the viewmodel code is run. Not all browsers support
    the WebSocket protocol yet, so the first thing that you need to do in the viewmodel
    is make sure that your current browser does provide the proper support. For our
    example, this is achieved by using the code shown in [Listing 4-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos197829)
    from the `tictactoe.js BoardViewModel()` function.![image](images/00016.jpg)Listing
    4-7   Checking for WebSocket Support![image](images/00012.jpg)![image](images/00061.jpg)If
    the browser doesn’t support the WebSocket protocol, this code will display an
    alert dialog that tells the player to use a more modern browser.JavaScript API
    for WebSocketYou’ve learned about how to create and interact with the Java API
    for WebSocket on the server side, so now let’s take a look at how that same WebSocket
    service can be consumed and interacted with from the client side.WebSocket InitializationWhen
    the `websocket.js` file is loaded, the initialization of the WebSocket connection
    is attempted as shown in [Listing 4-8](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos199355).![image](images/00016.jpg)Listing
    4-8   WebSocket Endpoint Initialization![image](images/00012.jpg)![image](images/00062.jpg)You’ll
    notice that the URL for the WebSocket endpoint is a reference to the endpoint
    that you set up during your work with the Java API for WebSocket.While you can
    set the URL directly to the service in your final production code, it’s a good
    idea to set up the URL dynamically when you are in development. The reason for
    this is more about testing than about development. When you run the code from
    the IDE, it will usually load with localhost as the hostname from your local development
    machine. However, if you hard-code the endpoint URL to localhost, you will have
    trouble connecting to the web application from some other device for testing.
    By getting the current hostname from the browser’s window object, you can connect
    from any device on the same network for testing. As an example, if you run the
    tic-tac-toe game from your local machine, it will show up in the browser as `http://localhost:8080/TicTacToe/`.
    However, if you connected to the same web app from a tablet that is connected
    to the same wireless network, you would have to do something like `http://<ip
    address of dev machine>:8080/TicTacToe`.Using the code shown in [Listing 4-8](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos199355)
    will connect using whichever hostname you join the game from.WebSocket Control
    MethodsJust as when working with the Java API for WebSocket, you have five different
    methods available in the JavaScript API:    ![image](images/00007.jpg)   `onopen()`    ![image](images/00007.jpg)   `onmessage()`    ![image](images/00007.jpg)   `onclose()`    ![image](images/00007.jpg)   `onerror()`    ![image](images/00007.jpg)   `send()`As
    part of this sample application, an HTML element is set up to show the current
    state of the WebSocket connection. You can see this being defined as “output”
    in [Listing 4-8](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos199355).
    As you review the code for each of the JavaScript API methods shown in [Listing
    4-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos203511), you will
    see that a function called `writeToScreen(message)` was defined as a simple means
    of setting the value for the output HTML element. The `onmessage()` method is
    not covered in [Listing 4-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos203511).
    It will be covered in a separate section after the other four methods.![image](images/00016.jpg)Listing
    4-9   JavaScript Methods for WebSocket![image](images/00012.jpg)![image](images/00063.jpg)Let’s
    take a closer look at the methods shown in [Listing 4-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos203511).
    Remember that during the initialization, you defined the new WebSocket object
    as a variable named `websocket`.    ![image](images/00007.jpg)   For `websocket.onopen(evt)`
    you are simply sending a message to the output variable saying that the connection
    was successful. This is the first event thrown by the WebSocket connection and
    is where you would do any additional setup code if you needed it.    ![image](images/00007.jpg)   For
    `websocket.onclose(evt)` you are going to check for the code given by the WebSocket
    protocol to help determine why the connection was closed. The tricky part with
    doing this is that the WebSocket specification (RFC 6455) says only that the endpoint
    “may” send a close code, not that it has to. If a code is sent, it should conform
    with one of the close codes defined in the IETF specification ([http://tools.ietf.org/html/rfc6455#section-7.4](http://tools.ietf.org/html/rfc6455#section-7.4)).
    The recommended codes are listed and described (quoting RFC 6455) in [Table 4-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos206307).
    In the code for this game you are only going to check for a couple of specific
    codes, and just fall back to a generic message that shows the close code for anything
    else that may be sent by the endpoint. The check for close code 1006 is just in
    case the application tries to connect to the endpoint and it’s not there. You
    can’t use the `onerror()` event for this case because the WebSocket object is
    not completely created when this happens. It closes before it has been completely
    opened. The check for close code 1000 is to indicate that the New Game button
    was clicked and the `websocket.close()` method was called and processed successfully.![image](images/00012.jpg)![image](images/00064.jpg)![image](images/00065.jpg)![image](images/00012.jpg)TABLE
    4-1.   RFC 6455 Close Codes    ![image](images/00007.jpg)   The `websocket.onerror()`
    method is pretty self-explanatory. If there is an error, the endpoint may trigger
    an error event. That error would be captured by this method and the message will
    be displayed on the game.    ![image](images/00007.jpg)   The `websocket.send()`
    method is used to send a message to the server. For this game example, only text
    is being sent and received over the WebSocket connection. However, the WebSocket
    protocol can also send and receive binary data in the form of a `Blob` or an `ArrayBuffer`.WebSocket
    Data ManagementThe final method for the WebSocket API is `websocket.onmessage()`.
    This is where the heart of the communication between the client and server is
    performed. [Listing 4-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos208432)
    shows the code from the `websocket.js` file that handles the incoming text messages
    from the server endpoint.![image](images/00016.jpg)Listing 4-10   websocket.onmessage()
    Method![image](images/00012.jpg)![image](images/00066.jpg)Let’s walk through the
    code in [Listing 4-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos208432)
    to get a better idea of how the client interacts with the server for the game:    ![image](images/00007.jpg)   The
    data that is being sent from the server is expected by the client to be in the
    form of a JSON object, except for the first time a browser connects. That first
    message is sent as plain text and indicates which player the game should be showing.
    Once the message is received, a `try-catch` block tries to parse the data from
    the event and assign it to the `json` variable. If this fails, then you know that
    this is the first connection for this player, and the `json` variable is set to
    `null`. If it succeeds, then the data is assigned to the variable and the game
    that is in progress can continue.    ![image](images/00007.jpg)   The first time
    the browser connects to the WebSocket endpoint, the server sends back a message
    saying which player that connection is assigned to. Player X always goes first
    in the game of tic-tac-toe, so the retuned string is parsed for the character
    “x” and, if found, the `onmessage()` method does all of the game setup for “Player
    One.” Any other connection string is assigned to “Player Two.”    ![image](images/00007.jpg)   If
    the `onmessage` data is a JSON object, the `symbol` member of the object is checked
    to see if this is data for player X or player Y, and the `onmessage()` method
    sets the appropriate image name for that player. It then passes the JSON object
    over to the `setCellImage()` method for further processing. [Figure 4-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos211378)
    shows the use of the NetBeans IDE Network Monitor feature to see the data being
    sent and received in the WebSocket frame.![image](images/00012.jpg)![image](images/00067.jpg)![image](images/00012.jpg)FIGURE
    4-2.   NetBeans Network Monitor windowManaging the Game LogicIn the `tictactoe.js`
    file, the rest of the game logic is processed. [Listing 4-11](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos212271)
    shows the `setCellImage()` method.![image](images/00016.jpg)Listing 4-11   setCellImage()
    Method![image](images/00012.jpg)![image](images/00068.jpg)When setting the image
    for the specific game cell, as shown in [Listing 4-11](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos212271),
    the image can be set either from the client of the player actually clicking the
    game cell or from the server to show what the opponent just selected. This method
    has to handle both cases. Here is where your use of the Knockout viewmodel starts
    to come into play. If the `symbol` member of the data object is for player X,
    the viewmodel’s `image` attribute, or observable in Knockout terms, is set to
    be the image for X. You are then going to set the viewmodel’s `symbol` observable
    to be the opposite of who just played. This is because the existing player’s turn
    is done and you are beginning to set things up for the next player now. Next you
    set the `src` attribute of the specific cell to be that location of the X or Y
    image. Finally, the status needs to be updated to tell the players whose turn
    it is. If the `gameStatus` observable is currently set to “Please wait,” then
    you switch it to say “Your turn.” Otherwise, set it to “Please wait.”So far you
    have followed the flow of how things work when data is received from the server
    with the `websocket.onmessage()` event. The flow for clicking a specific game
    cell and then sending that data to the server and then your opponent is very similar,
    but it starts with the `gameCellClicked()` method shown in [Listing 4-12](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos214471).![image](images/00016.jpg)Listing
    4-12   Capturing Game Cell Clicks and Sending Data![image](images/00012.jpg)![image](images/00069.jpg)Let’s
    walk through the two functions shown in [Listing 4-12](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos214471):    ![image](images/00007.jpg)   When
    a cell on the game board is clicked, it calls the `gameCellClicked()` method.
    The Knockout click binding that is being used for this automatically sends the
    data and the event objects as part of the method. The data object in this case
    contains the current `boardViewModel()` content. The event object is what you
    are really looking for though. You want to know which game cell was clicked so
    you can set the appropriate image, and then you want to create the JSON data for
    that cell so you can send it back to the server and have your opponent’s game
    board updated.    ![image](images/00007.jpg)   In the `gameCellClicked()` method,
    the current player is set by getting the value of `symbol` from the viewmodel.
    Then the values of the `data-x` and `data-y` attributes of the specific cell that
    was clicked are gathered. All three of these values are sent to a function that
    will format the values into the JSON object that your WebSocket endpoint expects.
    This is done in the `createJSON()` method shown in [Listing 4-12](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos214471).'
