- fmt: "\n# Summary\nIn this chapter you have learned about what the WebSocket protocol\
    \ is, and how the APIs for both Java and JavaScript are used to interact with\
    \ the WebSocket protocol on the server and in a pure client-side HTML5 application.\
    \ You have learned how to work with the Java API for JSON to read and generate\
    \ JSON objects on the server. \n\nOn the client side, you learned how to work\
    \ with `String` and JSON object data to manipulate the HTML DOM elements and interact\
    \ with the game board using the Knockout.js MVVM architectural pattern. \n\nOne\
    \ thing that you may have noticed while either playing the game or reading all\
    \ of the Knockout observables in the `boardViewModel()` is that there is not a\
    \ scoring system implemented in the game. This omission is intentional. It is\
    \ now up to you to take what you have learned and add the client- and server-side\
    \ code that can store and manage the game state. The Knockout `observables` of\
    \ win, lose, and tie are already in place and ready for you to use with the `gameStatus`\
    \ system that is in place. \n\nIn [Chapter 5](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos225295)\
    \ you will learn more details about working with HTML5, JavaScript, and CSS. The\
    \ Knockout.js library will also be given more attention.![image](images/00008.jpg)\n\
    \n# CHAPTER 5: HTML5, JavaScript, and CSS\nThe increase in development and availability\
    \ of HTML5 applications for just about every type of device, from desktop computers\
    \ to smartphones, and everything in between, has brought much-needed scrutiny\
    \ to how HTML5 applications can best be used in the enterprise application space.\
    \ In this chapter you will learn how to create a pure client-side HTML5 application\
    \ that will consume and interact with the REST, Server-Sent Events (SSE), and\
    \ WebSocket Java web services that you learned how to write in previous chapters.\
    \ \n\nYou will see how to implement the Model-View-ViewModel (MVVM) architecture\
    \ pattern through the use of the JavaScript library Knockout.js. You will also\
    \ be shown the basics of responsive design techniques using CSS3 media queries\
    \ to dynamically change the UI layout when the application is displayed on devices\
    \ of different sizes. Finally, you will be shown the basics of working with Syntactically\
    \ Awesome StyleSheets (SASS) and the Sassy CSS (SCSS) syntax for managing more\
    \ complex CSS file sets in an enterprise application.\n\n## HTML5 Project Setup\n\
    To get started, create a new HTML5 project using NetBeans IDE:\n1. Choose `File\
    \ | New Project`.\n2. As shown next, select `HTML5` in the Categories pane and\
    \ then select `HTML5 Application` in the Projects pane. Click the `Next` button\
    \ to enter details about your project.![image](images/00074.jpg)\n3. For the second\
    \ step of the wizard, enter `BookClub` in the Project Name field and click `Next`\
    \ again.![image](images/00075.jpg)\n4. In the next step of the wizard, `Site Template`,\
    \ you are given three options from which to choose how you want to configure your\
    \ new project. For this example, you are going to base your new project on a template\
    \ provided as part of this book. This template will provide the foundation for\
    \ the information covered later in this chapter. So, as shown next, click the\
    \ `Select Template` radio button, click the `Browse` button, and go to the location\
    \ of the `BookClub.zip` file. Click the `Next` button after you have the `BookClub.zip`\
    \ file selected in the Template field.![image](images/00076.jpg)\n5. The last\
    \ step in creating your new project is to add any other JavaScript libraries that\
    \ you may need. The list of JavaScript libraries, shown partially in the following\
    \ image, is pulled directly from the Content Delivery Network for JavaScript (CDNJS)\
    \ repository and can be updated at any time by clicking the link under the library\
    \ list. If you need to add more libraries at a later time, go to the `Project\
    \ Properties` dialog in NetBeans IDE and select the `JavaScript Library Manager`\
    \ option. For now, all of the JavaScript libraries that you will need for this\
    \ project are included in the template. Click the `Finish` button to create the\
    \ project.![image](images/00077.jpg)\n\n[Listing 5-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos230637)\
    \ shows the `index.html` file that the wizard loaded from the template for your\
    \ project. As you can see, the `<title>` element identifies the name of your project.\
    \ Also note how the CSS and JavaScript libraries are referenced: The `<link>`\
    \ and `<script>` tags in the `<head>` section tell the browser to load the designated\
    \ files when the `index.html` document file is run.![image](images/00016.jpg)\n\
    \nListing 5-1: Setting Up CSS and JavaScript References\n![image](images/00012.jpg)![image](images/00078.jpg)\n\
    \nNotice that the last line of the `<head>` section includes an extra `<script>`\
    \ element that references a JavaScript file called `app.js`. This file contains\
    \ JavaScript code that is specific to this application. If you were starting this\
    \ project from scratch and needed to add this file, you would right-click the\
    \ `js` node in the project navigator, as shown here, and select `New | JavaScript\
    \ File`.![image](images/00079.jpg)\n\nA dialog will be shown as in the following\
    \ illustration. Set the file name to `app` and click `Finish`.![image](images/00080.jpg)\n\
    \nYou can now run your project, and everything should load in.\n\n## REST Service\
    \ APIs\nWhen working with a REST service, you first want to identify the REST\
    \ APIs that you have available. This information is often found in the developer\
    \ documentation. For this chapter, you are going to use the REST service you created\
    \ as part of the book. If you are running from a local machine, the URL will be\
    \ `localhost:8080`. \n\nThe REST APIs that are shown in [Listing 5-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos661)\
    \ provide the following:\n* `/books` returns a list of all books.\n* `/books/{id}`\
    \ returns the details for a specific book. The `{id}` of a book is its ISBN (International\
    \ Book Number).\n* `/books/{id}/authors` returns all the authors for a specific\
    \ book.\n* `/authors` returns a list of all authors.\n* `/authors/{id}` returns\
    \ the details for a specific author. Each author has a unique ID in the database.\n\
    * `/authors/{id}/books` returns a list of all books that a specific author is\
    \ associated with.\n\n## CRUD Operations\nThe easiest way to learn how to use\
    \ a particular REST service is to write a CRUD application that exercises the\
    \ APIs required to create, read, update, and delete data. You will use the APIs\
    \ in [Listing 5-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos33261)\
    \ to do just that in this section. All of the code discussed in this section is\
    \ found in the `app.js` file of your project.\n\n### Read, Using the GET Request\
    \ (R of CRUD)\nYou’re going to start with the code shown in [Listing 5-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos26478)\
    \ to perform a read of the available data.\n\nListing 5-3: jQuery getJSON Method\
    \ Call\n![image](images/00012.jpg)![image](images/00082.jpg)\n\nThis is a very\
    \ simple call that uses the jQuery alias of `$` and calls the `.getJSON` method.\
    \ The call takes two arguments: the URL of the REST API, and a callback function\
    \ to do something with the data that is returned. [Listing 5-3] uses `.getJSON()`\
    \ to make the call, so it requests the data to be returned as a JavaScript Object\
    \ Notation (JSON) object. Because the JSON data format is syntactically identical\
    \ to the code used to create JavaScript objects, it can be parsed directly from\
    \ the JavaScript language without the need for any additional parsers or processors.\n"
