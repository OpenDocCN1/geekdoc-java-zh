    Listing 5-8 中显示的 HTML 代码包含一个 Knockout `click:` 绑定，该绑定会显示一个对话框，在其中输入你想要添加到数据库的新书信息。![image](img/00016.jpg)


    Listing 5-8 click: 绑定以显示添加新书对话框!!![image](img/00012.jpg)![image](img/00090.jpg)


    这段代码非常直观。Knockout `click:` 绑定正在调用一个名为 `showAddDialog()` 的函数。该函数使用 Twitter Bootstrap
    框架（你最初创建项目时使用的）提供的模态对话框功能来显示模态对话框。此对话框包含收集用于添加到数据库的新书详情的表单。Listing 5-9 显示了该对话框的
    HTML。显示模态对话框的一行代码是![image](img/00016.jpg)![image](img/00091.jpg)![image](img/00016.jpg)


    Listing 5-9 带有表单的新书模态对话框!!![image](img/00012.jpg)![image](img/00092.jpg)![image](img/00093.jpg)![image](img/00094.jpg)


    这是一段非常大的代码，但几乎大部分都是 HTML 布局和样式。让我们讨论一下提供功能的行：![image](img/00007.jpg)


    ```html

    <form class="form-horizontal" data-bind="submit: addBook">

    ```


    这是 Knockout `submit:` 绑定，它告诉 Knockout 在执行提交时将所有表单元素传递给 `addBook` 函数![image](img/00007.jpg)


    ```html

    <button class="btn btn-primary" type="submit">Save</button>

    ```


    通过将此按钮的 `type` 属性设置为 `"submit"`，它会在被点击时触发提交事件，导致调用初始的 `submit:` 绑定。当表单提交时，它将回调
    `addBook` 函数，该函数包含了你之前审查过的 REST 调用。上一个示例中未显示如何将数据格式化为作为请求一部分的 JSON 对象。Listing
    5-10 向你展示了如何使用 Knockout `submit:` 绑定传递的表单元素来创建 JSON 数据![image](img/00016.jpg)


    Listing 5-10 解析表单数据到 JSON 对象的示例!!![image](img/00012.jpg)![image](img/00095.jpg)


    传递到 `addBook()` 函数的数据包含一个 HTML 元素数组，你将从这些元素中提取所需的值赋值给 REST 服务要求的字段。在这种情况下，数组包含了
    Listing 5-10 中显示的五个字段。当你向 REST 服务发送数据时，必须知道每个字段期望接收的值的格式。例如，当设置 `publishedDate`
    字段时，REST 服务期望为该字段发送一个 `Date`，因此你将需要将表单数据转换为适当的格式。


    此时，可以通过两种方式进行数据验证。你可以使用来自客户端框架（如 Twitter Bootstrap）的内置验证功能，以确保在提交事件触发之前，输入表单的数据符合正确的格式，和/或者你可以在将数据赋值给
    JSON 对象时进行验证。提供的示例应用程序没有执行任何客户端验证。不过，它在“出版日期”（Published Date）表单字段上提供了一个提示，帮助最终用户知道该字段期望的格式：![image](img/00016.jpg)![image](img/00096.jpg)


    如果你在表单中也包含了不想使用的元素，确定哪个特定的 HTML 元素包含了你想赋值给 JSON 对象中特定字段的数据可能会很棘手。NetBeans IDE
    提供了一个 JavaScript 调试器，对于确定返回给函数的函数对象中的内容非常有用。图 5-2 展示了如何使用调试器来确定需要使用哪些元素来实现 Listing
    5-10 中所示的代码。点击 JavaScript 文件左侧的行槽会在该行上设置一个断点，如 图 5-2 中的第 141 行所示。当在浏览器中提交表单时，IDE
    会停这一行。你可以悬停在 `data` 变量上，在提示框中查看它的值。展开它将显示数据对象中的每个元素及其值。当然，如果你不想使用提示框，也可以在 IDE
    底部的变量（Variables）窗口中查看这些调试器信息。![image](img/00012.jpg)![image](img/00097.jpg)![image](img/00012.jpg)


    ### 图 5-2 NetBeans JavaScript 调试器


    现在你已经向 REST 服务提交了添加书籍的请求，你想完成任何可能受 POST 请求结果影响的视图层更改。再次查看 Listing 5-7，你会看到成功和错误的两个回调函数。如果发生错误，你应该采取某些操作通知最终用户请求未执行。在示例中，会调用
    `alert` 显示错误状态以及 REST 服务返回的任何文本![image](img/00016.jpg)![image](img/00098.jpg)


    在请求成功的情况下，你想将发送到服务器的相同 JSON 数据添加到绑定的 Knockout 可观测数组中。在 Listing 5-7 中，代码行 `booksVM.Books.push(new
    bookModel(json))` 根据 JSON 数据创建一个新模型并将其推入 `booksVM.Books`。由于 `Books` 是一个 Knockout
    可观测数组，只需添加新模型就会触发事件，绑定到 `foreach:` 的 HTML 将自动更新自身。


    ### 使用 PUT 请求进行更新（CRUD 中的 U）


    更新记录的过程与上一节介绍创建新条目的过程相似。首先，你想查看要编辑书籍的详情。Listing 5-11 显示了如何编写 HTML 来列出服务中的所有书籍![image](img/00016.jpg)


    Listing 5-11 Knockout foreach: 绑定示例!!![image](img/00012.jpg)![image](img/00099.jpg)


    Knockout 的 `foreach:` 绑定用于以相同的样式显示 `Books` 中的每项。`Books` 是来自你视图的 Knockout 可观测数组。HTML
    代码中最重要的元素实际上是包含每本书 ISBN 的隐藏 `div`。ISBN 是每本书的唯一 ID，这将允许你再次调用 REST 来获取某个特定书籍的信息。注意，书籍封面图像、标题和
    ISBN 的每个 `<div id="bookCoverPhoto"` 元素都有到函数 `getBookDetails()` 的绑定。该函数将加载显示特定书籍所有详情的页面。Listing
    5-12 显示了这个函数![image](img/00016.jpg)


    Listing 5-12 getBookDetails 函数![image](img/00012.jpg)![image](img/00100.jpg)


    让我们来看看这段代码：![image](img/00007.jpg)


    第一行简单地设置了一个本地变量 `bookData`，包含你刚刚离开的页面的数据![image](img/00007.jpg)


    你目前为止使用的整个示例应用程序被设计为单页应用程序。这意味着应用程序在发出请求时不会更改 URL 并加载新页面，而是将新的页面片段或模板加载到大面的特定部分。在该应用程序中，`index.html`
    页面被设计为具有头部和页脚代码以及页面中单个 `div` 用于包含所有其他页面模板。此 `div` 的 ID 为 `mainpage`。由于 Knockout
    允许在此时对 DOM 元素上只有一个绑定，因此当你加载新页面模板时需要清除现有绑定并添加新绑定![image](img/00007.jpg)


    在 `ko.cleanNode($(''#mainPage''));` 清除 mainPage 后，`$(''#mainPage'').load()` 将新模板加载到页面中。


