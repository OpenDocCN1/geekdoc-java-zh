    \n![image](images/00005.jpg)\n\nThanks to Liza Lyons for her help in visualizing\
    \ the layout of the Book Club application. A very big thank you to the editors:\
    \ from technical to copy. It’s amazing what a good editor can do with the chicken\
    \ scratch of a technical-minded author. It was a joy working with the rest of\
    \ the Oracle Press team, and of course, a big thanks to my co-authors.–John Brock\n\
    \nSincere thanks to Brandi Shailer and Amanda Russell for shepherding us throughout\
    \ the process. Many thanks to John Yeary for providing a solid technical review\
    \ showing his vast knowledge of the subject. This was definitely not possible\
    \ without my two co-authors and the rest of the team at Oracle Press.–Arun Gupta\n\
    \nMany thanks to Amanda Russell and Brandi Shailer, as well as JB Brock and Arun\
    \ Gupta, for the work and cooperation in putting this book together, and to our\
    \ primary reviewer, John Yeary.–Geertjan Wielenga!\n\n![image](images/00006.jpg)\n\
    \nMany books are available that cover just Java web services or just HTML5, but\
    \ not both. So, this book strives to find a balance between what an HTML developer\
    \ should know about the Java web services they connect to and what the Java developer\
    \ should know about the HTML5 applications that are consuming and interacting\
    \ with the web services.\n\nWith the resurgence of JavaScript over the past few\
    \ years, Java developers are often faced with the need to understand how HTML5\
    \ client-based applications interact and consume the server-side web services\
    \ that the developers have been creating. At the same time, HTML5 developers often\
    \ find that they need to understand how the services their applications rely on\
    \ are built and configured. With the new HTML5 and CSS3 specifications generating\
    \ a lot of industry buzz and the new JavaScript libraries, such as AngularJS and\
    \ Knockout, becoming increasingly popular, some Java developers may wonder whether\
    \ their skills are still relevant.\n\n## Who Should Read This Book\n\nThis book\
    \ is ideal for developers who find that they need to understand not only how to\
    \ develop Java EE-based web services such as REST, Server-Sent Events (`SSE`),\
    \ and WebSocket, but also how to develop HTML5-based clients that consume and\
    \ interact with those web services. Whether you are primarily a Java developer\
    \ looking for how HTML5 applications connect to your web services, or an HTML5\
    \ developer looking to better understand how the Java EE web services are created\
    \ on the server side, this book will fit your needs.\n\n## What This Book Covers\n\
    \nThe primary topics covered in this book are\n\n- Java EE 7 Persistence API (`JPA`)\n\
    - Java EE 7 API for RESTful Web Services (`JAX-RS`)\n- Java EE 7 API for WebSocket\n\
    - New features of the HTML5 specification\n- JavaScript Model-View-ViewModel (`MVVM`)\
    \ architectural pattern via `Knockout.js`\n- JavaScript API for REST, WebSocket,\
    \ and Server-Sent Events (`SSE`)\n- Responsive design via CSS3 features\n- CSS\
    \ preprocessing with Syntactically Awesome StyleSheets (`SASS`)\n\n## Client and\
    \ server security for web-based applications\n\nThese topics are covered in the\
    \ following six chapters:\n\n**Chapter 1**, \"Introduction to Java EE and HTML5\
    \ Enterprise Development,\" provides a brief overview of the three main areas\
    \ of the book: Java EE 7 web services, HTML5 application development, and `NetBeans\
    \ IDE`.\n\n**Chapter 2**, \"Persistence,\" discusses the Java Persistence API\
    \ (`JPA`) and shows you the key concepts for persistence and how data can be created,\
    \ read, updated, and deleted from a relational database.\n\n**Chapter 3**, \"\
    RESTful Resources,\" introduces you to REST, or Representational State Transfer,\
    \ as an architectural style for distributed systems such as the World Wide. The\
    \ Java EE 7 API for RESTful Web Services (`JAX-RS`) is covered, including the\
    \ new support for Server-Sent Events (`SSE`). You are shown how to develop your\
    \ own RESTful web service and SSE service that you will use as the data resources\
    \ for a Book Club application you develop in Chapter 5.\n\n**Chapter 4**, \"WebSocket,\"\
    \ covers the development of both the server and client portions of an application\
    \ using WebSocket. You learn about the Java API for WebSocket, as well as how\
    \ to develop an HTML5 client that interacts with the service.\n\n**Chapter 5**,\
    \ \"HTML5, JavaScript, and CSS,\" is all about HTML5 and client-side development.\
    \ You interact with the REST and SSE web services that you created in Chapter\
    \ 3. You are shown how to work with the Model-View-ViewModel (`MVVM`) architectural\
    \ pattern through the use of the JavaScript library, `Knockout`. You are introduced\
    \ to responsive design concepts as well as CSS preprocessing techniques with Syntactically\
    \ Awesome StyleSheets (`SASS`).\n\n**Chapter 6**, \"HTML5 and Java Application\
    \ Security,\" covers security concepts for HTML5 applications and Java EE–based\
    \ web services.\n\n## How to Use This Book and Code\n\nThis book is structured\
    \ such that you can read it sequentially or jump to any chapter and read it as\
    \ a standalone topic. Source code is provided for all applications discussed in\
    \ the book and is available for download at `www.OraclePress.com` (Wait, the text\
    \ says this). This allows you to start in a later chapter and still have access\
    \ to the resources you would have had you read the earlier chapters. For example,\
    \ if you choose to read Chapter 5 first, in which you develop the Book Club application,\
    \ you have access to the resources from Chapter 3 that the application relies\
    \ on.\n\nWhichever method works best for you. `NetBeans IDE` is used throughout\
    \ the book to show you how to use wizards and other efficient methods of development,\
    \ such as the built-in debugger.\n\n# Introduction to Java EE and HTML5 Enterprise\
    \ Development\n\nThere have been many changes taking place in the area of enterprise\
    \ development in recent years. Two of the largest changes are the trend toward\
    \ Software as a Service (`SaaS`) and the use of HTML5 to provide a pure client-side\
    \ interface. In this chapter, you will be introduced to the main topics that are\
    \ covered throughout the book: `NetBeans IDE`, `Java EE 7`, and `HTML5`. Using\
    \ this combination of IDE, platform, and HTML5, you will soon be building powerful,\
    \ dynamic applications.\n\n### Development Tools\n\nThree main development tools\
    \ are used throughout this book: `NetBeans IDE`, `Java EE 7`, and `HTML5`. You\
    \ will learn how to use the combination of these tools to build powerful, modern\
    \ enterprise applications. Before you begin building applications it is important\
    \ to first make sure you have a solid understanding of the basics of each of these\
    \ technologies.\n\n### NetBeans\n\nNetBeans IDE` is the development tool you will\
    \ use throughout this book. It provides features such as editors, templates, and\
    \ code generators that make it a perfect fit for creating applications that use\
    \ `Java EE 7` and `HTML5`. Starting with `NetBeans IDE 7.3`, new features have\
    \ been introduced to support and enhance the development experience with client-side\
    \ web applications. You can use this IDE to rapidly and intuitively create web\
    \ applications that support the responsive design paradigm targeting desktop and\
    \ mobile platforms. In addition, from `NetBeans IDE 7.4` onward, you can use `HTML5`\
    \ technologies within `Java EE` and `PHP` applications.\n\nThe NetBeans story\
    \ begins in 1996, when a group of students at Charles University in Prague attempted\
    \ to write a Delphi-like Java IDE in Java. Originally called `Xelfi`, the student\
    \ project delved into what was then the uncharted territory of Java IDEs. `Xelfi`\
    \ generated enough interest in the developer community that, after they graduated,\
    \ the students decided to put their new product on the market. In 1997, they formed\
    \ a company and changed the name of the IDE to `NetBeans`.\n\nIt’t not long before\
    \ Sun Microsystems became interested in `NetBeans` as Sun began searching for\
    \ Java development tools. In 1999, Sun acquired `NetBeans` and made the `NetBeans\
    \ IDE` the flagship toolset for Java. At the time, Sun made another critical decision:\
    \ to establish `NetBeans IDE` as an open source project—free to anyone who wanted\
    \ to use it. Over the years, the `NetBeans IDE` has become a fully featured, cross-platform\
    \ IDE, supporting all aspects of Java application development.\n\nWhen Oracle\
    \ acquired Sun in 2010, `NetBeans IDE` became part of Oracle, and Oracle made\
    \ the commitment to continue to support it. Today, more people are using `NetBeans\
    \ IDE` than ever before. By 2010, the one million active user mark was reached,\
    \ and the `NetBeans IDE` community continues to innovate and grow.\n\nYou can\
    \ download `NetBeans IDE` from the Oracle NetBeans website. Visit `http://netbeans.org/downloads`\
    \ for an overview of the available distributions and to find the corresponding\
    \ download links. You need to have either the “Java EE” or “All” distribution\
    \ of `NetBeans IDE` to be able to follow the instructions in this book. The instructions\
    \ and code samples have been created in `NetBeans IDE 7.4`, the latest version\
    \ at the time of writing. Subsequently released versions of `NetBeans IDE` should\
    \ work just as well, though if you encounter problems when using a later version,\
    \ you are recommended to switch to `NetBeans IDE 7.4`.\n\nHaving just the Java\
    \ Runtime Environment (`JRE`) installed on your system is not sufficient for running\
    \ `NetBeans IDE`. You need to have the Java Development Kit (`JDK`), which includes\
    \ a copy of the `JRE`. The IDE relies on development tools and sources provided\
    \ by the `JDK`. You can go to `http://oracle.com/technetwork/java/index.html`\
    \ to find and download the latest version of the `JDK`.\n\n### Java EE 7\n\nJava\
    \ Platform, Enterprise Edition (`Java EE`) provides a standards-based platform\
    \ for developing web and enterprise applications. The platform consists of multiple\
    \ components that enable developers to build these applications. Each component\
    \ is defined using a formal specification that describes the proposed component\
    \ and its features. The platform is also accompanied by an application programming\
    \ interface (`API`) described using Javadoc. This API is then used to build the\
    \ application. The platform also provides some additional services, such as naming,\
    \ injection, and resource management, that span across the platform. These applications\
    \ are then deployed in `Java EE` containers, such as `GlassFish`, that provide\
    \ the runtime support. There are 33 components defined in the `Java EE 7` platform.\
    \ The ones that are pertinent to the content of this book are described in this\
    \ section. For a full list of components, refer to `www.oracle.com/technetwork/java/javaee/tech/index.html`(`http://www.oracle.com/technetwork/java/javaee/tech/index.html`).\n\
    \nOne of the major themes for the `Java EE 7` platform is to simplify development\
    \ of HTML5 applications, especially the services that are needed on the server\
    \ side. To enable that, Java API for RESTful Web Services (`JAX-RS`) is a component\
    \ in the platform that defines how to develop, deploy, and invoke RESTful Services.\
    \ A Plain Old Java Object (`POJO`) can be easily published as a Representational\
    \ State Transfer (`REST`) endpoint by specifying an annotation. Regular methods\
    \ can be easily invoked when the resource is accessed using standard verbs. Server-Sent\
    \ Events (`SSE`), a key part of the HTML5 specification, is used to asynchronously\
    \ push data from the server to the client. Even though `SSE` is not part of the\
    \ platform yet, the `JAX-RS` implementation provides support for `SSE`. WebSocket\
    \ provides a full-duplex, bidirectional channel over a single connection and significantly\
    \ improves the latency for modern web applications. A new API was added to the\
    \ `Java EE 7` platform for building applications. Just like `JAX-RS`, adding an\
    \ annotation on `POJO` converts it into a `WebSocket` endpoint. With all the excitement\
    \ around `WebSocket` and a simplified API, `Java EE 7` is the best platform for\
    \ building your HTML5 applications. JavaScript Object Notation (`JSON`) is a key\
    \ technology for data transfer within HTML5 applications, and certainly `Java\
    \ EE 7` adds new APIs to enable the parsing and generation of JSON text and objects\
    \ using `JSON-P` 1.0. The API allows parsing or generating the entire JSON text\
    \ using only the API. Alternatively, the document may be structured one item at\
    \ a time. Any web application typically requires information to be persisted in\
    \ a permanent data store. The Java Persistence API (`JPA`) defines an API for\
    \ the management of persistence and object-relational mapping. Consistent with\
    \ the overarching theme of a simplified programming model, adding an annotation\
    \ allows `POJO` to be mapped to a database table. There are reasonable defaults\
    \ that can be overridden using annotations. The `POJOs` can also be used to generate\
    \ the database tables, or even table-generation scripts. In addition, the information\
    \ from this data store needs to be stored and retrieved to preserve the ACID (atomicity,\
    \ consistency, isolation, durability) properties. This can be achieved using Enterprise\
    \ JavaBeans (`EJB`) or the newly introduced `@Transactional` annotation. `EJBs`\
    \ provide convenient container-managed transactions. They also come in different\
    \ flavors: stateless (where there is no state on the server), stateful (state\
    \ is stored on the server), and singleton (single instance per application per\
    \ JVM). The newly added `@Transactional` annotation can be specified on `POJO`\
    \ to provide container-managed transactions outside of Enterprise JavaBeans. Annotating\
    \ a class means all methods of the class are going to run inside a container-managed\
    \ transaction. Alternatively, this annotation may be specified on a method to\
    \ limit the scope of transaction. This book will cover all of these topics in\
    \ detail using extensive code samples. In addition, the `Java EE 7` platform provides\
    \ several other components:\n\n![image](images/00007.jpg)\n\n### Batch Applications\
    \ for the Java Platform\n\nAllows noninteractive, bulk-oriented, and long-running\
    \ tasks to be easily defined and executed. It allows item-oriented processing\
    \ style, aka `Chunk`, and task-oriented processing style, aka `Batchlet`. `Chunk`,\
    \ the primary and recommended processing style, reads, processes, and aggregates\
    \ for writing a “chunk” number of items at a time. Each chunk is written in a\
    \ container-managed transaction and also provides checkpoints. `Batchlet` is a\
    \ roll-your-own batch pattern. It is a task-oriented processing style where a\
    \ task is invoked once, runs to completion, and returns an exit status.\n\n![image](images/00007.jpg)\n\
    \n### Java Message Service (`JMS`)\n\nProvides a message-oriented middleware that\
    \ allows sending and receiving messages between distributed systems. It provides\
    \ a point-to-point messaging model, where a publisher sends a message to a specific\
    \ destination, called a `queue`, targeted to a subscriber. Alternatively, `JMS`\
    \ provides a publish-subscribe messaging model where multiple publishers can publish\
    \ a message to a destination, called a `topic`, which can then be subscribed to\
    \ multiple subscribers. In both cases, publisher and subscriber are loosely coupled\
    \ from each other. They only need to know the destination and message format.\n\
    \n![image](images/00007.jpg)\n\n### Contexts and Dependency Injection (`CDI`)\n\
    \nProvides a type-safe dependency injection mechanism. A `bean` is “strongly typed”\
    \ as it only defines the type and semantics of other beans it depends upon, without\
    \ a string name and using the type information available in the Java type system.\
    \ It provides “loose coupling” as the injection request need not be aware of the\
    \ actual life cycle, concrete implementation, threading model, or other clients\
    \ of the `bean`.\n"
