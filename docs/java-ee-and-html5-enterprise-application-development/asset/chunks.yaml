    \n本书的结构使得你可以顺序阅读，也可以跳转到任何章节作为独立主题来阅读。书中讨论的所有应用程序都提供了源代码，并可以在 `www.OraclePress.com`\
    \ 下载。这允许你从后一个章节开始，仍然可以获得阅读前面的章节会拥有的资源。例如，如果你选择先阅读第 5 章（即你开发图书会应用程序），你就可以访问第 3\
    \ 章中应用程序所依赖的资源。\n\n采用最适合你的方法即可。书中全程使用 `NetBeans IDE` 向你展示如何使用向导和其他高效的开发方法，例如内置调试器。\n\
    \n# Java EE 和 HTML5 企业级开发简介\n\n近年来，企业开发领域发生了许多变化。两个最大的变化是向软件即服务 (`SaaS`) 的趋势，以及使用\
    \ HTML5 提供纯客户端界面。在本章中，你将介绍书中涵盖的主要议题：`NetBeans IDE`、`Java EE 7` 和 `HTML5`。通过这种\
    \ IDE、平台和 HTML5 的组合，你将很快就能构建强大的动态应用程序。\n\n### 开发工具\n\n书中使用了三个主要的开发工具：`NetBeans\
    \ IDE`、`Java EE 7` 和 `HTML5`。在开始构建应用程序之前，重要的是确保你对这些技术的原理有所了解。\n\n### NetBeans\n\
    \n`NetBeans IDE` 是你在书中使用的开发工具。它提供了如编辑器、模板和代码生成器等功能，非常适合创建使用 `Java EE 7` 和 HTML5\
    \ 的应用程序。从 `NetBeans IDE 7.3` 开始，引入了新功能以支持和增强 Web 的开发体验。你可以使用这个 IDE 快速直观地创建针对桌面和移动平台的应用程序。NetBeans\
    \ 的故事始于 1996 年，当时布拉格大学的一群学生尝试编写一种类似 Delphi 的 Java IDE，最初被称为 `Xelfi`。`Xelfi` 在开发者社区引起了足够的兴趣，以他们在毕业后决定将其新产品推向市场。1997\
    \ 年，他们成立了一家公司并将 IDE 命名为 `NetBeans`。在 Sun Microsystems 开始关注 `NetBeans` 没多久，1999\
    \ 年，Sun 收购了 `NetBeans` 并使其成为 Java 开发的旗舰工具集。当时，Sun 做出了另一个关键决策：将 `NetBeans` 作为一个开源项目——对任何想使用它的人免费。2010\
    \ 年，甲骨文收购了 Sun，`NetBeans` 成为甲骨文的一部分，甲骨文承诺继续支持它。如今，到 2010 年，活跃用户突破了一百万，`NetBeans`\
    \ 社区继续创新和增长。\n\n### Java EE 7\n\nJava 平台企业版 (`Java EE`) 为开发 Web 和企业应用程序提供了一个基于标准的平台。该平台由多个组件组成，允许开发者构建这些应用程序。每个组件都使用正式规范来描述所提的组件及其功能。平台还伴有使用\
    \ Javadoc 描述的应用程序接口 (`API`)。该 API 然后被用于构建应用程序。平台还提供了一些额外的服务，如命名、注入和资源管理，跨整个平台。这些应用程序随后部署在\
    \ `Java EE` 容器中，例如 `GlassFish`，它们提供了运行时支持。`Java EE 7` 平台定义了 33 个组件。本节描述了与书中内容相关的组件。组件的完整列表请参见\
    \ `www.oracle.com/technetwork/java/javaee/tech/index.html` (`http://www.oracle.com/technetwork/java/javaee/tech/index.html`)\n\
    \nJava EE 7 平台的主要主题之一是简化 HTML5 应用的应用，特别是服务端需要的服务。为了实现这一点，Java RESTful 服务 API (`JAX-RS`)\
    \ 是平台中的一个组件，定义了如何开发、部署和调用 RESTful 服务。一个简单的 Java 对象 (`POJO`) 可以通过指定注解轻松发布为表现状态转移\
    \ (`REST`) 端点。当使用标准动词访问资源时，可以轻松调用普通方法。服务器发送事件 (`SSE`) 是 HTML5 规范的关键部分，用于从服务器向客户端异步推送数据。尽管\
    \ `SSE` 尚未成为平台的一部分，但 `JAX-RS` 实现为 `SSE` 支持。WebSocket 在单连接上提供了全双工双向通道，并显著提高了现代\
    \ Web 应用的延迟。Java EE 7 平台 增加了一个新的 API 用于构建应用程序。就像 `JAX-RS` 一样，在 `POJO` 上添加注解可以将其转换为\
    \ `WebSocket`。WebSocket 允许         应用程序的                     HTML5 应用程序的     \
    \      \n\n对于 REST、WebSocket 和 Server-Sent Events (`SSE`) 的 JavaScript API。`Knockout`\
    \ 这种 库让 HTML5 变得越来越流行，Java 开发者经常需要理解 HTML5 应用是如何交互和消费的。随着过去几年 JavaScript 的复兴，HTML5\
