    如你所见，防止 CSRF 攻击的真正解决方案必须从服务器端开始，但作为客户端开发者，你也可以尽尽一份之力来防止此类攻击。


    ### 点击劫持 (Clickjacking)

    点击劫持是另一种必须保护你的 HTML5 应用程序的攻击类型。要使点击劫持攻击成功，攻击者首先必须能够将你应用程序的网页嵌入黑客创建的网站的某种框架（即 `<iframe>`）中。黑客在其创建的网站上方堆叠了一系列透明层，该网站看起来是一个正常的网站。当网站访问者认为他们正在点击该网站上的按钮或链接时，他们实际上正在与你的网站进行交互，并点击了一个不可见的按钮或链接。2009
    年，Chris Shiflett 描述了这样一种攻击（[http://shiflett.org/blog/2009/feb/twitter-dont-click-exploit]），该攻击使用
    Twitter 页面作为透明覆盖层。当终端用户点击可见的“不要点击”按钮时，他们实际上点击的是隐藏的 Twitter 页面的“发布”按钮，并发送了由攻击者设计的推文。


    与大多数此类攻击一样，防御点击劫持的最佳方法是从服务器端进行。在点击劫持的情况下，服务端的防御措施是将 `X-Frame-Options` 响应头设置为拒绝所有类型的框架，或仅允许来自同一域的框架。然而，有一种可以在客户端使用的编码实践来保护你的应用程序免受点击劫持。


    如果你无法修改服务器端的响应头，或者你需要支持不支持 `X-Frame-Options` 头的旧浏览器版本，你可以将列表 6-5 所示所示代码添加到页面的
    `<head>` 元素中，以帮助防止点击劫持攻击。这个概念来自 Aspect Security 的 Jason Li，并在此处讨论：[https://www.codemagi.com/blog/post/194]。


    ![image](img/00016.jpg)

    列表 6-5 反点击劫持示例![image](img/00012.jpg)![image](img/00129.jpg)


    在页面顶部添加 `<style>` 元素可以使紧随其后的脚本知道它正在引用你的页面。如果你只是单单独使用代码的 `else` 部分，该表达式可以通过多种规避方法被击败。通过使用列表
    6-5 中的代码，脚本会寻找 `antiClickjack <style>` 元素，如果它不是顶层，则将其移动到顶层。这是 OWASP 推荐的从客户端防止点击劫持的方法。


    ### 身份验证与授权 (Authentication and Authorization)

    开发 HTML5 Web 应用程序时，最明显的安全问题可能是处理应用程序登录的方式。书中到目前为止的所有代码示例都未包含登录过程，但如果你的应用程序将存储特定用户的信息和/或有助于让用户当前访问应用程序的体验更加愉快的信息，那么你将希望在应用程序中构建某种形式的身份验证。


    JavaScript 应用程序最常用的身份验证方法是 `OAuth` 标准。`OAuth` 是一种身份验证开放标准。2006 年，来自 Twitter 和
    Magnolia 的几位开发者共同提出了 `OAuth` 的概念。在接下来的一年里，通过一小组开发者的工作，开发了 `OAuth` 标准的草案提案，并在 2007
    年 10 月发布的最终草案。2008 年，`OAuth` 规范提交给互联网工程任务组 (IETF) 年会的一组开发者，以进行进一步的标准化工作。


    `OAuth 1.0` 协议于 2010 年 4 月发布为 `RFC 5849` (http://tools.ietf.org/html/rfc5849)。`OAuth`
    标准现在是许多领先 Web 服务（如 Twitter、Flickr 等）所需的身份验证协议。`OAuth 2.0` 规范于 2012 年发布为 `RFC 6749`
    (http://tools.ietf.org/html/rfc6749)。尽管它在互联网上逐渐变得流行，但在其开发过程中发生了许多争议。一些 `OAuth
    1.0` 协议的原始开发者由于对其方向和政策的意见分歧而退出了该项目。为了决定在特定情况下使用哪种协议，你需要对你自己进行进一步研究。如果你的应用程序需要支持身份验证，应该从
    `OAuth` 协议开始。


    在不涉及协议技术细节的情况下，`OAuth` 允许客户端（通常是 Web 应用程序）代表用户执行操作。`OAuth 2.0` 的主要组件是：

    - `Client`（客户端）

    - `Authorization server`（授权服务器）

    - `Resource server`（资源服务器）

    - `Resource owner`（资源所有者）


    `resource owner` 是一个可以授予访问资源的实体。`client` 是代表资源所有者发起请求的应用程序。根据 `authorization server`
    提供的授权，`client` 在 `resource server` 执行操作。例如，用户通过登录 Google 账户访问 `flickr.com`（资源服务器）上的图片。这种方法与在
    `flickr.com` 上创建单独登录相比的优势在于，用户不需要创建多次登录。相反，`client` 从 `authorization server` 获取
    `bearer token`（令牌令牌）并存储。然后，当需要访问 `resource server` 时，`client` 以以下格式发送特殊的 HTTP
    头：


    ![image](img/00016.jpg)![image](img/00130.jpg)


    令牌值对于 `client` 来说是不透明的，但被 `resource server` 解码，以便服务器可以检查 `client` 是否权限访问资源。


    如果你的应用程序将作为需要用户验证的大型企业环境的一部分，那么你的应用程序可能不需要提供单独的身份验证。如果你确实需要在应用程序中包含某种形式的身份验证，有许多不同语言的
    `authorization servers` 库提供了 `OAuth` 支持。在决定安全基础设施之前，值得查看它们。


    在典型的企业环境中，你的应用程序将是 `application server` 安装的一部分。该 `application server` 将为应用程序执行身份验证，直到用户通过
    `application server` 的方法验证。这就是授权概念发挥作用的地方。一旦 `application server` 或使用的身份管理系统验证了终端用户，就可以用来判断用户是否有权访问应用程序。在这种环境下，你需要从安全团队获取应用程序需要实现哪些检查。


    ### 客户端安全常识

    客户端安全的常识方法将帮助你避免许多陷阱。基于此，以下是你应该考虑遵循的一些常识实践：

    - 尽量始终使用 `HTTPS` 协议运行你的应用程序。

    - 如果你的应用程序运行在安全域 (`HTTPS`)，不要将你的应用程序连接到不安全的服务。确保你的 `REST` 调用也指向 `HTTPS` 域，并且你的
    `WebSocket` 调用使用的是 `wss` 而不是 `ws`（参见章节后的“WebSocket 安全”）。

    - 如果可能，不要在你的 HTML 文件中允许 `<script>` 元素。将 JavaScript 放在外部文件中并引用它们。

    - 如果你在使用 JavaScript 框架，请检查它对常见安全问题提供什么样的帮助，并使用那些功能。

    - 最后，花时间研究你的特定应用程序需要哪些安全措施。你会发现有很多应用程序安全信息可用，并且正在快速增长。


    ### 服务端安全

    本节解释了服务器端安全的关键概念：身份验证、授权、机密性和数据完整性。


    - **身份验证 (Authentication)**：验证客户端的身份。它确定客户端是否真的是它声称的身份。这通常涉及接收来自用户 ID 和凭据的客户端请求。Java
    EE 服务器中的 servlet 提供了利用标准协议和验证凭据的机制。

    - **授权 (Authorization)**：确保经过验证的客户端拥有访问请求资源的相应权限。这允许服务器检查用户是否可以在你的服务上调用某些操作。servlet
    容器定义了可以执行的操作。

    - **机密性 (Confidentiality)**：确保只有授权的接收者可以访问信息。这个概念与授权相似，区别在于授权防止信息到达非授权方，而机密性确保即使信息到达了非授权方，也无法被查看或使用。

    - **数据完整性 (Data integrity)**：确保信息在客户端和服务器传输过程中没有更改。数据的哈希值或签名与数据一起发送，并在接收端进行确认。


    让我们看看这些概念如何在 Java 容器中实现。


    #### 身份验证 (Authentication)

    有多种方法来实现身份验证；下面列出的两种来自 `RFC 2617` 草案标准：


    ##### 基础身份验证 (Basic Authentication)

    这是通过 HTTP 进行身份验证的最简单方法。客户端（通常是网络浏览器）打开一个登录框，提示用户输入用户名和密码。`client` 将 base64 编码的用户名和密码发送给服务。服务器检查用户账户是否存在并验证发送的密码。如果用户名和密码与账户匹配，则提供该资源；否则，向客户端返回
    HTTP 401 响应代码，告知客户端无权访问该资源。


    在底层，客户端生成一个 HTTP `Authorization` 头，格式如下：


