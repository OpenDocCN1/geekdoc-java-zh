    | ![image](img/0007.jpg) | **注意** 注意所有 `<input>` 元素都使用 `value:` 绑定，而其他 DOM 元素使用
    `text:` 绑定来获取其内容。在处理 Knockout 绑定时，为种类型的 DOM 元素绑定正确的内容属性非常重要。例如，如果你通过 `value` 属性设置
    DOM 元素的内容，那么你应该使用 `value` Knockout 绑定。 |


    其次，注意在所有的表单元素绑定中，Knockout 可观测对象（observ）都是作为函数调用的：`data-bind="value: isbn()"`。这非常。由于
    Knockout 的双向绑定，如果你尝试直接绑定到可观测对象，一旦你在表单字段中更改了它，它就会在书籍详情页中同步更新。你不希望这种情况立即发生，以防最终用户点击“取消”按钮而不是提交更改。通过作为函数调用可观测对象，你获取的是变量的实际而不是可观测对象。[Listing
    5-16] 显示了表单是如何处理的，以及如何在 REST API 中执行实际的更新。


    ![image](img/00016.jpg)

    Listing 5-16 提交更新


    ![image](img/00012.jpg)

    ![image](img/00105.jpg)


    让我们通过这段代码来检查正在发生什么：


    ![image](img/00007.jpg)

    传递给 REST API 用的 JSON 对象是使用 Knockout `submit:` 绑定触发时传递的表单数据创建的。


    ![image](img/00007.jpg)

    你用于添加新书籍的相同 AJAX 调用被再次用于更新书籍。然而，现在使用的 `type` 属性是 `PUT` 而不是添加方法时使用的 `POST`。


    ![image](img/00007.jpg)

    你同样拥有 `success:` 和 `error:` 回调函数。`error:` 函数与之前完全相同。


    ![image](img/00007.jpg)

    更新完成后，应用程序返回到主页。`success:` 函数关闭 `updateBookDialog` 对话框，然后等待关闭操作完成。随后它调用 `loadDefaults()`
    函数，该函数会重置 ViewModel 并将正确的绑定带回主页。


    ### 使用 DELETE 请求（CRUD 中的 D）


    更新过程的设置有点长，但该设置也开启了删除功能。`confirmDeleteDialog` 对话框的显示方式与 `updateBookDialog` 相同，通过调用
    `showDelete()` 函数来实现。[Listing 5-17] 显示了执行删除所需的 REST API 调用。


    ![image](img/00016.jpg)

    Listing 5-17 DELETE API 调用示例


    ![image](img/00012.jpg)

    ![image](img/00106.jpg)


    当用户在 `confirmDeleteDialog` 确认对话框中点击“是”按钮后，将调用 `deleteBook(data)` 函数并将当前的 `Books`
    详情传递给该函数。要使用 REST API 删除记录，你需要为想要删除的记录准备一个唯一 ID。在示例应用程序案例中，这就是 `ISBN` 值。让我们看看
    [Listing 5-17] 中的代码：


    ![image](img/00007.jpg)

    传递给 AJAX 用的 JSON 对象只需要包含你想要删除的记录的唯一 ID。注意，再次你设置的是可观测对象的实际值，而不是可观测对象的引用。


    ![image](img/00007.jpg)

    一个本地变量被设置为当前的 `ISBN` 值，以便稍后在比较函数可以使用 ISBN 值。


    ![image](img/00007.jpg)

    一个本地变量被设置为 `Books` 可观测数组（observableArray），这样如果 REST API 调用成功，你就可以移除 Model 条目。


    ![image](img/00007.jpg)

    AJAX 调用中的 URL 设置为使用 REST API 来获取你想要删除的精确书籍。


    ![image](img/00007.jpg)

    `type` 属性被设置为 `DELETE`。


    ![image](img/00007.jpg)

    `dataType` 和 `contentType` 都被设置为 `JSON`，以便服务知道你发送和期望返回的是什么。


    ![image](img/00007.jpg)

    与所有其他调用一样，有 `success:` 和 `error:` 回调函数。`error:` 函数与之前完全相同。


    ![image](img/00007.jpg)

    `success:` 函数使用 Knockout 实用函数 `arrayFirst()` 在 `observableArray` 中找到第一个匹配项。一旦找到，它会返回该
    Model 的引用，以便可以使用另一个名为 `arrayRemoveItem()` 的 Knockout 实用函数将其移除。


    ![image](img/00007.jpg)

    就像处理 `updateBookDialog` 对话框一样，`confirmDeleteDialog` 对话框被关闭，一旦关闭完成后，调用 `loadDefaults()`
    函数来重置 ViewModel 并加载主页。


    ### 服务器发送事件 (SSE)


    服务器发送事件有时被称为推送技术，因为数据流是单向的。所有内容都来自服务器。浏览器选择连接到 SSE 流，以便在有新信息可用时向其发送信息。示例应用程序设置了一个事件部分来显示来自
    SSE 流的数据。Knockout 双向绑定对于显示数据非常有帮助，因为你可以设置传入数据与特定 DOM 元素之间的绑定，并在新数据更改可观测对象时让其更新。[Listing
    5-18] 显示了如何连接到 SSE 流以及用于处理流及其数据的函数。


