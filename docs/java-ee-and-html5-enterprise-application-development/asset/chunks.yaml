- fmt: "\n# Cross-Site Request Forgery\n\nAttacks that exploit the cross-site request\
    \ forgery (CSRF) security vulnerability are uncommon because they are successful\
    \ only under a very limited set of conditions. However, if you don’t take some\
    \ measures to guard against CSRF attacks, you are exposing your website visitors\
    \ to a potentially very nasty result.\n\n## Understanding CSRF Attacks\n\nA good\
    \ way to explain the CSRF attack is to use an example of a banking website. Let’s\
    \ call the website `megabank.com`. When you log into your account on this bank’s\
    \ website, the login stores a session cookie in your browser. This is a perfectly\
    \ normal and acceptable practice for a banking website. \n\nThe CSRF vulnerability\
    \ exists if you leave the website without first logging out manually by clicking\
    \ the `Logout` button. Your browser still has that session cookie in its cache\
    \ up until the cookie expires. The expiration of the session cookie is set by\
    \ the `megabank.com` website and in most cases will expire approximately 15 minutes\
    \ after the last activity on the website. This expiration time can vary though.\n\
    \nSuppose you next navigate to some other website that happens to have been hacked\
    \ to include malicious code that, when activated (via a button click, for example),\
    \ instructs your browser to send a request to `megabank.com` to transfer funds\
    \ from “your” account to the hacker’s account listed in the malicious code. When\
    \ the `megabank.com` website receives the request, it will look for a session\
    \ cookie to identify the user, which it will find in your browser because you\
    \ just visited the website and didn’t log out. The transfer will go through as\
    \ if you performed the request yourself.\n\n## Risks and Impact\n\nAlthough the\
    \ chances are low that all the variables required for a successful CSRF attack\
    \ will be present, it would take only one successful attack to ruin the reputation\
    \ of the `megabank.com` website. If you’ve encountered spam emails or spam forum\
    \ comment posts that just have links in them to some seemingly random websites,\
    \ they could very well be attempts to lure you into a CSRF attack.\n\nThe worst\
    \ part of the CSRF vulnerability is that the end user doesn’t even have to click\
    \ anything on the website that is hacked. The entire attack can be handled via\
    \ `JavaScript` when the page is loaded.\n\n## Prevention Strategies\n\nSo, what\
    \ can you do to help make sure your HTML5 application doesn’t allow this kind\
    \ of CSRF attack? \n\n1. Be aware that your application has to be maintaining\
    \ a session cookie in order for this type of attack to happen.\n2. If your application\
    \ doesn’t maintain session cookies (a stateless application), then it isn’t vulnerable\
    \ to this type of attack and you do not need to do anything.\n3. If your application\
    \ does maintain session cookies, then your first priority is to make sure your\
    \ website isn’t susceptible to the `XSS` types of attack described in the previous\
    \ section. If it is susceptible to `XSS` attacks, then anything you do to try\
    \ and prevent CSRF attacks is meaningless.\n\nTo implement any kind of CSRF prevention\
    \ in an HTML5 client-side application, you need to work in conjunction with what\
    \ is being done on the server side of your application. The technique that you\
    \ use to prevent CSRF is called `double-sending cookies`. \n\nThis technique involves\
    \ reading the session ID from the cookie that was sent from the server when the\
    \ web page was first requested. Using `JavaScript`, you place that same session\
    \ ID into a hidden field in all of the forms in your application, and attach it\
    \ to any `AJAX` calls that your application makes back to the server. When sending\
    \ the session ID value back to the server, it’s often referred to as a `CSRF token`.\n\
    \n| ![image](images/00070.jpg) | **NOTE** |\n| :--- | :--- |\n| | Never set a\
    \ `CSRF token` on an `AJAX` call that uses the method type of `GET`. Doing so\
    \ will potentially expose the `CSRF token` in many different places (server logs,\
    \ browser logs, network monitors, and so forth). |\n"
