    可以说，到目前为止，HTML5 规范的实现一直在针对一个移动的目标。不同的厂商以不同的方式支持该规范，或者可能完全不支持规范的某些部分。这为应用程序开发人员带来了问题，因为他们必须针对可能使用各种设备和浏览器组合的客户群进行开发。坦率地说，已经创建了一些网站来帮助开发者应对开发
    HTML 应用程序这一棘手领域。两个最流行的网站是：![image](img/00007.jpg) HTML5 Test [`html5test.com/`](http://html5test.com/)
    ![image](img/00007.jpg) Can I Use [`caniuse.com/`](http://caniuse.com/)


    HTML5 Test 网站将允许你查看特定版本或品牌的浏览器对整个 HTML5 规范的实现程度如何。当你试图决定应用程序将提供哪种浏览器或设备支持矩阵时，这非常有用。Can
    I Use 网站提供了更详细的信息，允许你查看特定的 HTML 元素或属性，并查看哪些浏览器厂商实现了它，以及是在哪些版本中实现的。


    ## 移动设备的使用


    HTML5 近期知名度上升的第二个主要原因，可能是接入互联网的智能手机、平板电脑和其他类型移动及嵌入式设备可用性的增加（例如，联网电视、游戏机和蓝光播放机等）。这些设备可用性的提高之所以能让
    HTML5 脱颖而出，是因为它们的所有设备在开发时使用的浏览器已经在某种程度上支持 HTML5。与桌面操作系统不同，这些设备的浏览器开发人员不需要考虑与现有浏览器实现之间的任何向后兼容性问题。在这些类型的设备上，一切都是新的，制造商从最新的
    HTML 规范开始，以预见它将在不久的将来成为标准。


    这种这种通过移动设备访问互联网的增长也是吸引企业级开发者更密切关注 HTML5 的因素之一。传统的网站布局无法在智能手机或平板电脑等较小设备上进行舒适的缩放。现有的方法是在检测到客户端为移动设备时生成一个完全不同的网站版本进行显示，已被证明充斥着维护问题，且扩展效率低下。


    ## 新 HTML5 特性


    HTML5 的主要新特性之一是包含了新的语义化元素，帮助开发者管理 HTML 页面及其内容的布局，以便其在较小设备上查看时能够完美缩放。你现在可以使用如 `<header>`、`<footer>`、`<section>`、`<article>`、`<aside>`、`<nav>`
    等许多标签来布局你的 HTML 内容。


    ![image](img/00012.jpg)![image](img/00013.jpg)![image](img/00012.jpg)

    表 1-1. 语义元素


    除了 HTML5 规范中的新语义元素外，还存在新的语法元素，旨在消除安装专用插件的需求。这些包括如 `<canvas>`、`<video>`、`<audio>`
    和 `<svg>` 等元素。


    ![image](img/00012.jpg)![image](img/00014.jpg)![image](img/00012.jpg)

    表 1-2. 语法元素


    ## 语法元素


    最后，HTML5 规范为某些现有元素带来了新属性。其中最引人的是 `<input>` 元素 `type` 属性的新值。虽然所有这些新类型值现在都是最终定版
    HTML5 规范的一部分，但每个浏览器厂商都可以（也已经）实现它们在渲染时的行为。例如，如果浏览器渲染一个类型设置为 `"date"` 的输入字段，用户将看到一个日期选择器来帮助选择他们想要输入的日期。遗憾的是，这是目前浏览器厂商分歧最大的领域之一。在移动设备上，体验更好。你经常会发现，当你点击或触摸类型设置为
    `"number"` 的输入字段时，你会得到一个数字键盘而不是普通键盘；或者如果输入字段设置为 `"url"` 等，则会显示不同类型的键盘。


    ![image](img/00012.jpg)![image](img/00015.jpg)![image](img/00012.jpg)

    表 1-3. 表单输入属性


    ## HTML5 程序的组成


    关于 HTML5 应用程序常见的误区之一是它们仅由 HTML5 组成。事实上，在大多数情况下，应用程序实际上由三个不同的组件组成：HTML5、JavaScript
    和层叠样式表 (CSS)。通过将所有新的 HTML5 元素和属性与 CSS 版本 3 (CSS3) 的新媒体查询功能相结合，你可以为不同的设备尺寸显示相同内容的不同布局。这种修改内容以响应设备可用尺寸的方法被称为**响应式设计**；布局会对其渲染的显示尺寸做出响应。关于响应式设计，有几点需要注意的重要提示。首先，尽管它允许你创建一个在多个设备尺寸上具有相同外观和感受的网站，但
    HTML5 应用程序仍然是在智能手机或平板电脑等较小设备的网络浏览器中查看的网页。应用程序不会具有像为特定类型移动设备编写和编译的应用程序那样的真正的“原生”外观和感受。其次，HTML5
    和响应式设计对于希望应用程序能够访问特定移动功能（如摄像头、联系人列表和日历）的开发者来说可能不是答案。因为应用程序运行在网络浏览器中，你只能编写程序使用浏览器允许你交互的内容。如前所述，HTML5
    应用程序中常用的第三个组件是 JavaScript。JavaScript 架构库的引入是使其更容易被企业级开发者接受的重要因素。


    ## 开发应用程序


    在企业环境中开发应用程序通常意味着开发任务的分离，设计师和 UI 团队负责前端或视图层，而其他团队则负责数据层和控制层。这种应用层之间的分离被称为**模型-视图-控制器
    (MVC)** 架构模式。在过去的几年里，已经开发了 JavaScript 库来引入一种类似的架构，称为**模型-视图-模型 (MVVM)**。MVVM 最初由微软在
    2005 年作为 Windows 呈现框架 (WPF) 的一部分开发。这种架构模式的 JavaScript 实现由 Steve Sanderson 在 2010
    年作为一个开源项目引入。它以 Knockout.js 的名称发布（[`knockoutjs.com/`](http://knockoutjs.com/)），并已经在熟悉
    MVC 开发实践的 JavaScript 开发者中迅速流行起来。虽然深入理解 MVVM（特别是 Knockout.js）超出了本书的范围，但你将在第 5 章中使用
    Knockout.js 创建一个将消费 REST、WebSockets 和服务器发送事件 (SSE) 等网络服务的 HTML5 应用程序。


    *(注：由于提供的原文后部分存在大量重复和乱码干扰，译文已根据核心逻辑进行了清理和整合。)*

