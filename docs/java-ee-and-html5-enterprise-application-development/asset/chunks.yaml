    | ![image](images/00070.jpg) | NOTEIt would be desirable to use the HTML5 `dataset`
    method to get the `data-x` and `data-y` values in this function. If you were to
    use dataset, the code would look like this:![image](images/00071.jpg)The reason
    this is not done in this example is that the `dataset` HTML5 feature is not supported
    in all browsers at the time of writing. Internet Explorer specifically did not
    support this feature until IE 11 was released. Using a direct DOM call to get
    the attribute will work with all browsers. |


    ![image](images/00007.jpg)  The `createJSON()` function returns the formatted
    JSON as a JSON object so that it can be used in the `setCellImage()` function
    that you looked at earlier in [Listing 4-11](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos212271).
    ![image](images/00007.jpg) Once the image and game status have been set properly,
    the JSON object is converted back to a string so it can be sent to the WebSocket
    endpoint using the `websocket.send()` method. Remember that WebSocket data must
    be in either UTF-8 string format or a binary format of `Blob` or `ArrayBuffer`.
    Sending the actual JSON object will result in a WebSocket protocol error.


    While the game code used for this chapter does not make use of the `Blob` or `ArrayBuffer`
    binary data types, you may want to know a little more about how they are used.
    `Blob` is the default binary data type, and there is nothing special that you
    have to do to send data in this format. Just pass in a `Blob` object as the argument
    to the `send()` method, just as you would with a text string. The server code
    will need to check for the type of the incoming message. [Listing 4-13](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos219576)
    shows a possible way of checking for the message type and processing it appropriately.![image](images/00016.jpg)Listing
    4-13 Example of Testing for Message Type![image](images/00012.jpg)![image](images/00072.jpg)


    From the client side, you would need to provide some method for gathering the
    binary data and then passing that data to a function for processing and sending
    to the WebSocket connection. [Listing 4-14](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos220538)
    shows one possible solution: using an input type of `file` and allowing the end
    user to select a file and send it to the WebSocket stream.![image](images/00016.jpg)Listing
    4-14 Example of Client-Side Code for Sending Binary Data![image](images/00012.jpg)![image](images/00073.jpg)


    Let’s take a quick look at the code in [Listing 4-14](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_012.html_filepos220538):


    ![image](images/00007.jpg)  The first line is adding an event listener to an input
    element of type `file` in the HTML markup. This input element has an `id` attribute
    set to the name “binary.”


    ![image](images/00007.jpg)  When the event listener detects that a change has
    happened to the input element, it will call the `sendBinary()` function. This
    function uses the event object that the listener sent by default to get the file
    that the end user selected.


    ![image](images/00007.jpg)  The `sendBinary()` method then sets the `binaryType`
    property of the WebSocket connection to be a type of `ArrayBuffer`.


    ![image](images/00007.jpg)  At this point a `FileReader` object is created and
    the contents of the file are read into it using the `FileReader`’s `readAsArrayBuffer()`
    method.


    ![image](images/00007.jpg)  Finally, once the `FileReader` has completed the loading
    of the data, the data is sent over the WebSocket connection.


    | ![image](images/00070.jpg) | NOTEIt should be noted that the `FileReader` API
    is new to HTML5 and is not implemented by all browsers. Specifically, Internet
    Explorer 9 and any version of Safari older than 6.0 do not support it. |

