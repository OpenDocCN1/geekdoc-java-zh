- fmt: "\nThe implementation of the HTML5 specification so far has been done against\
    \ a moving target, so to speak. Different vendors support the specification in\
    \ different ways, or may not support certain parts of the specification at all.\
    \ This poses a problem for application developers, who have to develop for a customer\
    \ base that could be using a wide variety of device and browser combinations.\
    \ Frankly, several websites have been created to help developers navigate this\
    \ tricky area of developing HTML applications. Two of the more popular sites are\
    \ ![image](images/00007.jpg) HTML5 Test [http://html5test.com/](http://html5test.com/)\
    \ ![image](images/00007.jpg) Can I Use [http://caniuse.com/](http://caniuse.com/)\n\
    \nThe HTML5 Test website will allow you to see how well a specific version or\
    \ brand of browser implements the whole of the HTML5 specification. This is very\
    \ useful when you are trying to decide what kind of browser or device support\
    \ matrix your application will provide. The Can I Use website goes into more detail\
    \ and allows you to look at a specific HTML element or attribute and see which\
    \ browser vendors have implemented it and in which versions of their browsers.\n\
    \n## Use of Mobile Devices\n\nProbably the second largest reason for HTML5’s recent\
    \ rise in visibility is the increase in the availability of smartphones, tablets,\
    \ and other types of mobile and embedded devices with Internet access (such as\
    \ Internet-ready TVs, game consoles, and Blu-ray players, to name just a few).\
    \ The reason that the rise in the availability of these devices has brought HTML5\
    \ to prominence is that all of them are being developed with browsers that already\
    \ support HTML5 to some degree. Unlike on desktop operating systems, the developers\
    \ of the browsers for these devices didn’t have to consider any issues of backward\
    \ compatibility with existing browser implementations. Everything is new on these\
    \ types of devices, and the manufacturers started with the latest HTML specifications\
    \ in anticipation of it becoming the standard in the near future.\n\nThis rise\
    \ in accessing the Internet via mobile devices is also one of the factors that\
    \ has enticed enterprise developers to look more closely at HTML5. The traditional\
    \ website layout does not comfortably scale down for viewing on a smaller device\
    \ like a smartphone or tablet. The existing methods of producing a completely\
    \ different version of the website to display when the client is detected to be\
    \ a mobile device have proven to be fraught with maintenance problems and inefficient\
    \ to scale.\n\n## New HTML5 Features\n\nOne of the major new features of HTML5\
    \ is the inclusion of new semantic elements to help developers manage the layout\
    \ of the HTML page and its content so that it scales flawlessly for viewing on\
    \ smaller devices. You can now lay out your HTML content using tags such as `<header>`,\
    \ `<footer>`, `<section>`, `<article>`, `<aside>`, `<nav>`, and many others.\n\
    \n![image](images/00012.jpg)![image](images/00013.jpg)![image](images/00012.jpg)\n\
    TABLE 1-1. Semantic Elements\n\nAlong with the new semantic elements in the HTML5\
    \ specification, there are also new syntactic elements that are meant to remove\
    \ the need to install proprietary-ins. These include elements such as `<canvas>`,\
    \ `<video>`, `<audio>`, and `<svg>`.\n\n![image](images/00012.jpg)![image](images/00014.jpg)![image](images/00012.jpg)\n\
    TABLE 1-2. Syntactic Elements\n\n## Syntactic Elements\n\nLastly, the HTML5 specification\
    \ brings new attributes to some of existing elements. The most notable of these\
    \ are the new values for the `type` attributes of the `<input>` element. While\
    \ all of these new type values are now part of the finalized HTML5 specification,\
    \ each browser vendor can, and has, implemented how they behave when rendered.\
    \ For instance, if a browser renders an input field with the type set to `\"date\"\
    `, the end user would see a date picker to help select the date they wish to enter.\
    \ Unfortunately this is one of the areas in which browser vendors currently have\
    \ the largest separation. On mobile devices, the experience is better. You will\
    \ often find that when you click or touch an input field that has the type set\
    \ to `\"number\"`, you will get a number pad instead of the normal keyboard, or\
    \ a different type of keyboard will be displayed if the input field is set to\
    \ something like `\"url\"`.\n\n![image](images/00012.jpg)![image](images/00015.jpg)![image](images/00012.jpg)\n\
    TABLE 1-3. Form Input Attributes\n\n## Parts of an HTML5 Application\n\nOne of\
    \ the most common misconceptions about HTML5 applications is that they are composed\
    \ of HTML5 only. In fact, in almost all cases the application is actually made\
    \ up at least three different components: HTML5, JavaScript, and Cascading Style\
    \ Sheets (CSS). By combining all of the new HTML5 elements and attributes with\
    \ the new media query feature of CSS version 3 (CSS3), you can display the same\
    \ content with different layouts for different device sizes. This method of modifying\
    \ the content to respond to the device’s available size is called responsive design;\
    \ the layout responds to the display size that it is rendered. There are a few\
    \ important caveats to note about responsive design. First, although it allows\
    \ you to create a website that will have the same look and feel across multiple\
    \ device sizes, the HTML5 application is still a web page that is being viewed\
    \ in a web browser on a smaller device such as a smartphone or tablet. The application\
    \ will not have a true “native” look and feel like an application that is written\
    \ and compiled for a specific type of mobile device. Second, HTML5 and responsive\
    \ design may not be the answer for developers who want their application to have\
    \ access to specific mobile features such as the camera, contact list, and calendar.\
    \ Because the application is running in a web browser, you can only program your\
    \ application to use what the browser allows you to interact with. As previously\
    \ mentioned, the third component commonly used in HTML5 applications is JavaScript.\
    \ The introduction of JavaScript architectural libraries has been a big factor\
    \ in making it more acceptable to enterprise developers.\n\n## Developing an Application\n\
    \nDeveloping an application in an enterprise environment often means the separation\
    \ of development tasks, with designers and UI teams working on the front end or\
    \ view layer, while other teams are working on the data and controller layers.\
    \ This type of separation between application layers is referred to as a Model-View-Controller\
    \ (MVC) architectural pattern. Over the past few years, JavaScript libraries have\
    \ been developed to introduce a similar architecture, called Model-View-ViewModel\
    \ (MVVM). MVVM was originally developed by Microsoft in 2005 as part of its Windows\
    \ Presentation Foundation (WPF). A JavaScript implementation of this architectural\
    \ pattern was introduced as an open source project in 2010 by Steve Sanderson.\
    \ It was released under the name of Knockout.js ([http://knockoutjs.com/](http://knockoutjs.com/))\
    \ and has quickly gained popularity among JavaScript developers who are already\
    \ familiar with the MVC development practices. While a deep understanding of MVVM,\
    \ and more specifically Knockout.js, is beyond the scope of this book, you will\
    \ use Knockout.js in Chapter 5 when creating an HTML5 application that will consume\
    \ and interact with web services such as REST, WebSockets, and Server-Sent Events\
    \ (SSE).\n\n## Summary\n\nYou’ve learned what’s new in the Java EE 7 specification\
    \ in the area of web services that are used for developing the specific services\
    \ that an HTML5 application will need. You’ve also been shown some of the new\
    \ features in the HTML5 specification and the specific technologies that are required\
    \ to develop a client-side HTML5 application. This introduction to the current\
    \ state of development tools will help you throughout the rest of this book as\
    \ you work with the coding concepts and samples. As you can see, both Java EE\
    \ web development and HTML web development have matured over the past few years\
    \ toward the common trend of providing Software as a Service. In keeping with\
    \ this development trend, tools such as NetBeans IDE have evolved to provide features\
    \ that make it easier than ever to combine these two types of technologies. In\
    \ the next chapter, you will dive into the Java EE 7 Persistence API to learn\
    \ how to create a data store for your HTML5 application.\n\n![image](images/00008.jpg)\n\
    \n# CHAPTER 2\n\n## Persistence\n\nPersistence is an integral part of any application\
    \ and typically defines the state of an application at any given point of time.\
    \ Persistence is the characteristic of an application state that outlives the\
    \ process that created it. Absent persistence, application data would be lost\
    \ when the application terminates. If a banking application could not persist\
    \ information about the accounts, it would be useless. Similarly, if a retail\
    \ store could not persist information about the inventory, customer orders, and\
    \ shipments, it would be of no value. Persistence allows applications to access\
    \ the data and perform CRUD (create, read, update, and delete) operations that\
    \ change the data’s state. After an application crashes and then recovers, persistence\
    \ enables the application to use the data in the exact state it was in at the\
    \ time of the crash.\n\nThere are many ways to persist data in Java. Java Platform,\
    \ Standard Edition (Java SE) provides APIs to manipulate streams and files. This\
    \ requires lots of low-level handling, such as defining the stream location and\
    \ names, opening streams, and defining a data format. The Java Database Connectivity\
    \ (JDBC) API can be used to store data to a relational database such as Oracle\
    \ or MySQL server. This requires managing database connections, writing SQL queries,\
    \ mapping results with Java objects, and lot more. NoSQL data stores provide APIs\
    \ to manage data specific to those data stores. The majority of data is persisted\
    \ in databases, specifically relational databases. The Java EE platform provides\
    \ the Java Persistence API (JPA) for the management of persistence and object/relational\
    \ mapping. In other words, POJO (Plain Old Java Object) can be used to represent\
    \ a table in the relational database, and each class instance corresponds to a\
    \ row in that table. The API defines how these rows can be managed using the POJO.\
    \ Data stored in a relational database should maintain ACID (atomicity, consistency,\
    \ isolation, durability) properties. To help ensure that ACID properties are maintained,\
    \ it is very important to ensure that any addition, update, or deletion of data\
    \ is done within a transactional boundary. The transactions can be container-managed\
    \ or user-managed. Container-managed transactions can be managed either by the\
    \ Enterprise JavaBeans (EJB) container or by using `@javax.transaction.Transactional`\
    \ annotation provided by the Java Transaction API (JTA). In this case, a transaction\
    \ is automatically started by the container and then committed or rolled back\
    \ by the container. A user-managed transaction is explicitly started and completed\
    \ by the user. In this case, the application explicitly starts the transaction\
    \ and then commits or rolls back the transaction before exiting out of the method.\n\
    \nThis chapter will introduce the main concepts of JPA, how an entity can be created,\
    \ queried, and updated. Text-based Java Persistence Language (JPQL) and type-safe\
    \ Criteria API are explained. Container-managed transactions that preserve the\
    \ ACID properties of these entities are explained. Finally, database schema generation\
    \ using persistence properties is explained. NetBeans IDE tools and wizards are\
    \ explained in reference to throughout the chapter.\n\n### JPA Entity\n\nJPA defines\
    \ an entity as a lightweight persistent domain object. Any POJO with a no-args\
    \ constructor can be defined as an entity. A JPA entity defining the concept of\
    \ author is shown in Listing 2-1.\n\n![image](images/00016.jpg)\nListing 2-1 Author\
    \ Entity\n\n![image](images/00012.jpg)![image](images/00017.jpg)\n\nLet us walk\
    \ through this code:\n\n![image](images/00007.jpg)\n\n`@javax.persistence.Entity`\
    \ annotation on a POJO specifies that this is an entity. The default name of the\
    \ entity is the unqualified name of the class. An optional `name` attribute may\
    \ be used to specify the entity name, which is then used to refer to the entity\
    \ in queries.\n\n![image](images/00007.jpg)\n\n`@javax.persistence.Table` is an\
    \ optional annotation on an entity and specifies the primary table for the annotated\
    \ entity. Additional tables may be specified using `SecondaryTable` or `SecondaryTables`\
    \ annotation.\n\nIf no `@Table` annotation is specified on the entity, or the\
    \ annotation is specified but no name attribute is specified, then the generated\
    \ table defaults to the entity name.\n\n![image](images/00007.jpg)\n\nImplementing\
    \ the `Serializable` interface allows the class to be passed by value through\
    \ a remote interface.\n\n![image](images/00007.jpg)\n\nThe properties of the bean\
    \ that follow the JavaBeans-style accessors (“property access”) or instance variables\
    \ (“field access”) represent the persistent state of the entity. The persistent\
    \ fields or properties of an entity class can be from a wide range of types, such\
    \ as Java primitive types, any primitive wrapper type, other fine-grained classes\
    \ defined using `@javax.persistence.Embedded` and known as embeddables, a collection\
    \ of embeddables, and many other types.\n\nThe properties `id`, `firstName`, `lastName`,\
    \ `bio`, and `email` have getters and setters that are omitted for brevity in\
    \ this code. Each of these fields will map to a column in the database table.\n\
    \nReasonable default column names are used for properties and fields. For example,\
    \ the column name `ID` is used for the `id` property, and the column name `FIRST_NAME`\
    \ is used for the `firstName` property. Optionally a `@javax.persistence.Column`\
    \ annotation may be used to override the name of the mapped column. This annotation\
    \ can also use several attributes to control the definition of the mapped column.\n\
    \n![image](images/00007.jpg)\n\n`@javax.persistence.Id` annotation specifies the\
    \ primary key of an entity. The field or property to which this annotation is\
    \ applied should be one of the following types: any primitive type, any primitive\
    \ wrapper type, `java.lang.String`, `java.util.Date`, `java.sql.Date`, `java.math.BigDecimal`,\
    \ or `java.math.BigInteger`. The corresponding mapped column is assumed to be\
    \ the primary key of the primary table.\n\nA composite primary key that consists\
    \ of multiple fields or properties can be defined using `@javax.persistence.IdClass`\
    \ annotation on an entity. An embeddable class can be denoted as the primary key\
    \ using `@javax.persistence.EmbeddedId` annotation.\n\n![image](images/00007.jpg)\n\
    \nValidation constraints can be specified on entities to ensure that only valid\
    \ data is used to communicate with the database. Bean Validation 1, another specification\
    \ in the Java EE 7 platform, defines several such constraints in the `javax.validation.constraints`\
    \ package. Specifying `@javax.validation.constraints.NotNull` on a field ensures\
    \ that this field cannot be set to `null` and persisted. The `@javax.validation.constraints.Size`\
    \ constraint allows you to specify minimum and maximum boundaries of the field.\
    \ The Bean Validation specification even defines an extensible mechanism by which\
    \ you easily define custom constraints to meet application needs. An entity can\
    \ capture the relationship between different tables using `@javax.persistence.OneToOne`,\
    \ `@javax.persistence.OneToMany`, `@javax.persistence.ManyToOne`, and `@javax.persistence.ManyToMany`\
    \ annotations. A join table is defined using `@javax.persistence.JoinTable` annotation.\
    \ A collection of basic or embeddable types can be mapped using `@javax.persistence.CollectionTable`\
    \ annotation.\n\n## Packaging an Entity\n\nAn entity is managed within a persistence\
    \ context, a set of managed entity instances in which any persistent entity identity\
    \ has a unique entity instance. A persistence context has multiple entity managers\
    \ that manage the entity instances and their life cycles. The entity managers,\
    \ their configuration information, the managed entities, and optional metadata\
    \ that defines the mapping of the entities to the database are together packaged\
    \ as a persistence unit. A persistence unit is defined by a `persistence.xml`\
    \ file and packaged within a WAR file.\n\n![image](images/00016.jpg)\nListing\
    \ 2-2 Sample persistence.xml\n\n![image](images/00012.jpg)![image](images/00022.jpg)\n\
    \nThe `persistence.xml` file can have one or more `<persistence-unit>` elements,\
    \ corresponding to an entity manager. Each entity manager can be configured using\
    \ several `<javax.persistence.*properties>` elements. NetBeans IDE provides an\
    \ editor for editing `persistence.xml`. Open a `persistence.xml` file and you\
    \ will see three different views are available for working with the file: Design,\
    \ Source, and History. Click the Source button to see the source of the file.\
    \ When you use code completion in Source view—that is, you press CTRL-TAB—context-sensitive\
    \ suggestions are shown for completing the current word, together with relevant\
    \ documentation, shown in Figure 2-5.\n\n![image](images/00012.jpg)![image](images/00023.jpg)\n\
    FIGURE 2-5 Source for persistence.xml\n\nTo persist entity classes, your project\
