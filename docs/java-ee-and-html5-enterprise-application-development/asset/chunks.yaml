    ### Summary

    In this chapter you’ve learned how to work with an HTML5 project within NetBeans
    IDE and how to consume and interact with a REST web service to perform CRUD functions.
    You connected to a Server-Sent Events (SSE) stream using JavaScript, and then
    used the data from that stream to update an events window in the BookClub application.
    You were introduced to the Model-View-ViewModel (MVVM) architectural pattern through
