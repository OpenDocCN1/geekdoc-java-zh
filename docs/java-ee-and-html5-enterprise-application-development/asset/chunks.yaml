    | ![image](images/0007.jpg) | **NOTE** Notice that all `<input>` elements use
    a `value:` binding while other DOM elements use a `text:` binding to get their
    content. When working with Knockout bindings, it’s important to bind the proper
    content attribute for each type of DOM element. For example, if you set the content
    of a DOM element by using the `value` attribute, then you would use the `value`
    Knockout binding. |


    Second, notice that the Knockout observables are being called as a function in
    all of the form element bindings: `data-bind="value: isbn()"`. This is very important.
    Because of Knockout’s two-way binding, if you were to attempt a binding to the
    observable directly, as soon as you changed it in the form field, it would update
    in the book details page. You don’t want this to happen immediately, just in case
    the end user clicks the Cancel button instead of submitting the changes. By calling
    the observable as a function, you get the actual value of the variable instead
    of the observable object. [Listing 5-16] shows how the form is processed and the
    actual update is performed in the REST API.


    ![image](images/00016.jpg)

    Listing 5-16 Submitting Update


    ![image](images/00012.jpg)

    ![image](images/00105.jpg)


    Let’s walk through this code to examine what is going on:


    ![image](images/00007.jpg)

    The JSON object that will be passed into the REST API call is being created using
    the form data passed when the Knockout `submit:` binding is triggered.


    ![image](images/00007.jpg)

    The same AJAX call that you used to add a new book is used again to update a book.
    However, the `type` attribute used is now `PUT` instead of `POST` as was used
    for the add method.


    ![image](images/00007.jpg)

    You have the same `success:` and `error:` callback functions as well. The `error:`
    function is exactly the same as before.


    ![image](images/00007.jpg)

    After the update has been completed, the application returns to the main page.
    The `success:` function closes the `updateBookDialog` dialog and then waits for
    that close to be completed. It then calls the `loadDefaults()` function, which
    resets the ViewModel and correct bindings back to the main page.


    ### Using the DELETE Request (D of CRUD)


    The setup for the update process was a little long, but that setup also enabled
    the delete functionality. The `confirmDeleteDialog` dialog is displayed in the
    same way that the `updateBookDialog` dialog was, with a call to a `showDelete()`
    function. [Listing 5-17] shows the REST API call that is needed to perform a delete.


    ![image](images/00016.jpg)

    Listing 5-17 Example of DELETE API Call


    ![image](images/00012.jpg)

    ![image](images/00106.jpg)


    After the user clicks the Yes button in the `confirmDeleteDialog` confirmation
    dialog, the `deleteBook(data)` function is called and the current `Books` details
    are passed to the function. To delete a record using a REST API, you need to have
    a unique ID for the record you want to delete. In the example application’s case,
    this is the `ISBN` value. Let’s take a look at the code in [Listing 5-17]:


    ![image](images/00007.jpg)

    The JSON object that will be passed to the AJAX call needs to contain only the
    unique ID for the record you want to delete. Notice that, once again, you are
    setting the actual value of the observable, and not a reference to the observable
    object.


    ![image](images/00007.jpg)

    A local variable is set to the current `ISBN` value so that the ISBN value can
    be used in a comparison function later.


    ![image](images/00007.jpg)

    A local variable is set to the `Books` observableArray so that you can remove
    the Model entry if the REST API call is successful.


    ![image](images/00007.jpg)

    The URL is set in the AJAX call to use the REST API that will get the exact book
    you want to delete.


    ![image](images/00007.jpg)

    The `type` attribute is set to `DELETE`.


    ![image](images/00007.jpg)

    The `dataType` and `contentType` are both set to `JSON` so that the service knows
    that is what you are sending and expecting back.


    ![image](images/00007.jpg)

    As with all the other calls, there are `success:` and `error:` callback functions.
    The `error:` function is exactly the same as before.


    ![image](images/00007.jpg)

    The `success:` function uses the Knockout utility function `arrayFirst()` to find
    the first match in the `observableArray`. Once that is found, it returns a reference
    to that Model so that it can be removed using another Knockout utility function
    called `arrayRemoveItem()`.


    ![image](images/00007.jpg)

    Just as you did with the `updateBookDialog` dialog, the `confirmDeleteDialog`
    dialog is closed, and then once the close is completed, the `loadDefaults()` function
    is called to reset the ViewModel and load the main page.


    ### Server-Sent Events (SSE)


    Server-Sent Events is sometimes referred to as push technology because the data
    flow is in one direction only. Everything comes from the server. The browser chooses
    to attach to the SSE stream to have information sent to it whenever new information
    becomes available. The example application has an Events section set up that will
    display data coming from an SSE stream. Knockout two-way binding is really helpful
    with the displaying of the data since you can set up the binding between the incoming
    data and a specific DOM element and just let Knockout update whenever the observable
    is changed by the new data coming in. [Listing 5-18] shows how you connect to
    the SSE stream and which functions are used to work with the stream and its data.


    ![image](images/00016.jpg)

    Listing 5-18 Example of Server-Sent Events


    ![image](images/00012.jpg)

    ![image](images/00107.jpg)


    Server-Sent Events is a new feature introduced in HTML5. Some browsers do not
    support this feature at the time of writing.


    | ![image](images/0007.jpg) | **TIP** Currently, no versions of Microsoft Internet
    Explorer support Server-Sent Events. |


    Before continuing with the initialization code, it’s a good idea to perform the
    following check to make sure the browser provides SSE support:


    ![image](images/00016.jpg)

    ![image](images/00108.jpg)


    If the browser doesn’t understand the type of `EventSource`, then it doesn’t support
    SSE, in which case you can display an error message. Let’s walk through the code
    in [Listing 5-18] to see what each section does:


    ![image](images/00007.jpg)

    The first few lines set the defaults for your Knockout observables. These observables
    are bound to the SSE section of the HTML code.


    ![image](images/00007.jpg)

    Inside the `if` statement that is checking to make sure the browser supports Server-Sent
    Events, you create a new `EventSource` object and assign it to the `self.source`
    variable. The URL that is used to make the connection is for the SSE stream that
    you wrote in [Chapter 3] of the book.

