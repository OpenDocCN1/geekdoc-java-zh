    # CHAPTER 6: HTML5 and Java Application Security


    As an application developer, you may get the sense that every time you obtain
    a good understanding of the latest security issue, a new one crops up. Staying
    ahead of the security curve may seem practically impossible, but there are basic
    development practices that you can follow that will help you to at least keep
    up with the security curve. Application security can take many forms. In the case
    of HTML5 and Java web applications, the two major forms of security are client-side
    security and server-side security. The top issues and common best practices that
    apply to client-side security and server-side security differ, so this chapter
    discusses each separately, starting with securing the client side.


    ## Client-Side Security

    When working with HTML5 applications, always keep in mind this important fact:
    different HTTP traffic analyzers can read just about anything that you send or
    receive.


    | ![image](images/00070.jpg) | TIP you should treat all data entering and exiting
    your HTML5 application as potentially malicious. |

