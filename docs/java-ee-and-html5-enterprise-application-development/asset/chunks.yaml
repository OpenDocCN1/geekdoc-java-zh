- fmt: '

    Once you have the `EventSource` object, there are three events you can listen
    for and then perform the appropriate actions:


    - `onopen:`: This event is triggered on the initial opening of the connection.

    - `onmessage:`: This is triggered each time the server sends a message to the
    browser. This is the main event that you will want to work with.

    - `onclose:`: This is triggered when the connection is closed for any reason.


    In Listing 5-18, you are setting the local variable `message` to a string stating
    that the connection was opened. You are then assigning that value to the Knockout
    observable `sseData`, which will be displayed inside the SSE HTML section that
    is bound to the same observable. Because you are including HTML markup in the
    message, the Knockout binding on the HTML page is actually the `html:` binding
    instead of the plain `text:` binding.


    In the `onmessage` function, you want to lay out the message that goes into this
    area by appending the most recent message from the server onto the end of the
    existing messages. You do this by setting the local variable `message` to the
    actual value of the observable and then appending the incoming `event.data`. After
    generating the new appended message, you set the `self.sseData` observable to
    the new value.


    If the connection is closed for whatever reason, you set a message stating that
    the connection is closed and set the same `self.sseData` observable to show that
    message.


    When the original observables for `self.displayMessage` and `self.displayError`
    were initialized, they were set to `false` so they would not show these areas
    while the page is loading. Now that the connection has been established and a
    message has been set, you can set the observable to `true`, which will display
    the Message area while still leaving the Error section hidden.


    Finally, there is a small X icon in the View layer of the Event section that has
    been bound to the `closeSSE()` function. When the icon is clicked, the current
    SSE stream closes and an appropriate message is displayed.


    ## WebSocket

    Using the WebSocket API in JavaScript and connecting the resulting data to an
    HTML view layer was covered in Chapter 4. If you haven’t read Chapter 4 yet, the
    basic approach to setting up the connection to the service is the same as what
    you just learned with Server-Sent Events. However, with the WebSocket API, you
    can also send data back to the server. One of the biggest advantages of using
    a WebSocket connection instead of REST or some other type of protocol is the significant
    reduction in the amount of traffic that you send over the wire when you use the
    WebSocket protocol. The connection between the client and server is set up once
    and then maintained until the connection is closed either via the API or via the
    client closing. With other protocols, you are required to go through the connection
    setup each time you want to send or receive data from the server. To get a full
    description of the new WebSocket protocol, please read Chapter 4.


    ## Responsive Design

    The concept of responsive design addresses the need to design your web application
    such that it renders its layout appropriately in response to the screen size of
    the device on which it is being displayed. The application View layer needs to
    respond to this change in view size by changing the layout, or amount, of the
    content that is rendered.


    The CSS2 specification provided the capability to use different CSS rules dynamically
    based on the media type. The most common of these types were (and continue to
    be in CSS3) screen and print. The CSS3 specification expands this capability with
    the introduction of media queries. A media query is made up of a media type and
    zero or more expressions. These expressions check for specific conditions of media
    features. A good example of this is an expression that checks for the current
    size of the display screen.


    Through the use of media queries and a pattern of CSS classes defined as a grid
    layout, you can make your application respond to changes to the display screen.


    The grid layout pattern is something that you can design yourself, but it’s much
    easier to use an existing grid framework. Thus far, you have been using the Twitter
    Bootstrap framework to show modal dialogs and to help with the display of buttons
    and general form layout. Twitter Bootstrap also comes with a grid layout as part
    of its CSS files. The most common grid style in use is a 12-column grid. You can
    define different sections of your layout into any number of columns that would
    add up to the largest width of 12. For example, you could have three sections
    that were each set to be four columns wide. In the sample application’s model
    dialog for adding a new book, for example, the dialog uses a nine-column width
    for all of the form elements, while the label elements use three columns. Listing
    5-19 shows how this looks in part of that dialog.


    Sample Grid Layout HTML

    Notice the style class of `class="col-md-9"` in each of the `<div>` elements and
    the `class="col-md-3"` style class for the labels. The combination of these style
    classes and media queries is what makes responsive design possible. Let’s take
    a look at the CSS code in Listing 5-20.


    CSS Example for Grid Layout

    The two sections of Listing 5-20 follow the style class for `.col-md-9` through
    different media queries. The first section covers the situation in which the browser
    size doesn’t fall into any specific media query. The second section introduces
    the media query for the situation in which the browser size is set to `min-width:992px`.
    Any style rules that you place inside specific media query will override any previous
    values for the same rule while the media query expression is true. If you don’t
    override a rule, the existing rule will continue to be used. In the code shown,
    you are not overriding an existing value but rather setting new rules for `width:`
    and `float:`. Notice that the width is being set to a percentage instead of a
    specific numeric value. This will cause the nine-column grid to maintain its relative
    size as the browser is resized, but it still remains within the range that this
    media query has defined. Figure 5-3 shows the CSS property window in NetBeans.
    Selecting an element in the DOM will show that element’s current styles and rules,
    including whether the browser is currently resized to fit within a specific media
    query.


    ## Syntactically Awesome Stylesheets (SASS)

    For most HTML5 applications, you may be able to get away with a single CSS file
    that is reasonably constructed and easy to maintain. However, as the applications
    grow and become more complex, the CSS becomes just as complex. Historically, maintaining
    large CSS files has been extremely difficult. Even if you broke the files into
    smaller files and referenced each file in your HTML, you had to place the files
    in the proper order because CSS files are loaded by the browser with the order
    they are listed, but each file will overwrite any previously set classes—a concept
    of last in wins. If you happened to have the same rule defined in multiple files,
    the file in which the rule would take effect depended on the order in which the
    files were listed in your HTML code. In 2007, SASS was introduced by a developer
    named Hampton Catlin. The development of SASS is continued today by Nathan Weizenbaum
    and Chris Eppstein.


    The original stylesheet language was designed to be similar to the Haml (HTML
    abstraction markup language) programming language in its use of an indentation
    style. Referred to as indented syntax, this style doesn’t look or feel like CSS
    at all. This syntax is most often referenced with a file extension of `.sass`.
    A newer syntax has been created called Sassy CSS, or SCSS, which is designed to
    look and feel exactly like CSS itself—so much so any valid CSS code is also a
    valid subset of SCSS. This syntax is most often referenced by a file extension
    of `.scss`. SASS works as a preprocessor of the SASS or SCSS files and compiles
    these separate files into one or more CSS files that you can reference in your
    HTML code. Listing 5-21 includes two link references to stylesheets. The first
    is for the Bootstrap framework that you used as the basis of the My Club sample
    application, and the second is the reference to the application’s specific styles.
    The latter file, named `responsive.css`, is a CSS file that was generated as a
    result of the SASS preprocessing of four separate SCSS files. These files are
    shown in Figure 5-4.


    Referencing the CSS File

    As you can see in Figure 5-4, the `responsive.scss` file contains only three lines
    of real code. It imports the other three SCSS files in the order in which you
    want them to be assembled. The other three files are broken out to contain the
    classes and rules specific to a certain media query type: in this case, Desktop,
    Tablet, and Handheld. This separation is just one example. Your individual projects
    will dictate how you determine what is the best way to break up your CSS into
    more manageable sections.


    NetBeans IDE makes it very easy to work with SASS in your projects. Right-click
    your project name in the Navigator and select the Properties menu option. In the
    Project Properties dialog, select the CSS Preprocessors option, as shown in Figure
    5-5. For this project, the IDE is being instructed to look for the SCSS files
    in a directory named `/scss` and to output the compiled files into the `/css`
    directory.

