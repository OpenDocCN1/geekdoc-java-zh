    # 总结

    在本章中，你学习了什么是 WebSocket 协议，以及如何使用 Java 和 JavaScript 的 API 在服务器端以及纯客户端 HTML5 应用中与
    WebSocket 协议进行交互。你还学习了如何使用 Java 的 JSON API 在服务器上读取和生成 JSON 对象。


    在客户端，你学习了如何处理 `String` 和 JSON 对象数据以操纵 HTML DOM 元素，并使用 Knockout.js 的 MVVM 架构模式与游戏面板进行交互。


    在玩游戏或阅读 `boardViewModel()` 中的所有 Knockout 可观察对象（observables）时，你可能注意到游戏中没有实现评分系统。这种遗漏是有意为之的。现在由你根据所学的知识，添加客户端和服务器端的代码来存储和管理游戏状态。用于胜利、失败和平局的
    Knockout `observables` 已经准备就绪，可以供你结合现有的 `gameStatus` 系统进行使用。


    在第 5 章中，你将学习更多关于处理 HTML5、JavaScript 和 CSS 的细节。Knockout.js 库也将得到更多关注。![image](img/00008.jpg)


    # 第 5 章：HTML5、JavaScript 和 CSS

    从台式电脑到智能手机以及其之间所有类型的设备，HTML5 应用的发展和可用性增加，使得人们对如何在企业应用领域充分利用 HTML5 产生了高度关注。在本章中，你将学习如何创建一个纯客户端
    HTML5 应用，该应用将调用并与你在前面的章节中学习如何编写的 REST、服务器发送事件 (SSE) 和 WebSocket Java Web 服务进行交互。


    你将看到如何通过使用 JavaScript 库 Knockout.js 实现模型-视图-ViewModel (MVVM) 架构模式。你还将学习使用 CSS3
    媒体查询进行响应式设计的基础知识，以便在应用程序显示在不同尺寸的设备上时动态更改 UI 布局。最后，你将学习使用 Syntactically Awesome
    StyleSheets (SASS) 和 Sassy CSS (SCSS) 语法的基础，以管理企业应用中复杂的 CSS 文件集。


    ## HTML5 项目设置

    要开始操作，请使用 NetBeans IDE 创建一个新的 HTML5 项目：

    1. 选择 `File | New Project`。

    2. 如下所示，在 Categories 格中选择 `HTML5`，然后在 Projects 格中选择 `HTML5 Application`。点击 `Next`
    按钮进入项目详情。![image](img/00074.jpg)

    3. 在向导的第二步中，在 `Project Name` 字段中输入 `BookClub` 并再次点击 `Next`。![image](img/00075.jpg)

    4. 在向导的下一步 `Site Template`（站点模板）中，你有三个选项供选择，以决定如何配置你的新项目。对于本示例，你将基于本书提供的模板来创建新项目。该模板将为本章后面涵盖的内容提供基础。因此，如下，点击
    `Select Template` 单选按钮，点击 `Browse` 按钮，并导航到 `BookClub.zip` 文件的位置。在 Template 字段中选中
    `BookClub.zip` 后，点击 `Next` 按钮。![image](img/00076.jpg)

    5. 创建新项目的最后一步是添加你可能需要的其他 JavaScript 库。下图中部分显示的 JavaScript 库列表直接从 JavaScript 内容交付网络
    (CDNJS) 仓库提取，可以通过点击库列表下方的链接随时更新。如果你以后需要添加更多库，请进入 NetBeans IDE 中的 `Project Properties`
    对话框并选择 `JavaScript Library Manager` 选项。目前，此项目所需的所有 JavaScript 库已包含在模板中。点击 `Finish`
    按钮创建项目。![image](img/00077.jpg)


    Listing 5-1 显示了向导从模板为你项目加载的 `index.html` 文件。如所示，`<title>` 标识了你的项目名称。还要注意 CSS 和
    JavaScript 库是如何引用的：`<head>` 部分中的 `<link>` 和 `<script>` 标签告诉浏览器在运行 `index.html`
    文档时加载指定的文件。![image](img/00016.jpg)


    列表 1：设置 CSS 和 JavaScript 引用

    ![image](img/00012.jpg)![image](img/00078.jpg)


    注意`<head>` 部分的最后一行包含一个额外的`<script>` 元素，引用了一个名为 `app.js` 的 JavaScript 文件。该文件包含特定此应用的
    JavaScript 代码。如果你是从零开始此项目并需要添加此文件，应如所示右键点击项目导航器中的 `js` 节点并选择 `New | JavaScript
    File`。![image](img/00079.jpg)


    将显示如下插图所示对话框。将文件名设置为 `app` 并点击 `Finish`。![image](img/00080.jpg)


    现在你可以运行项目了，一切都应该正常加载。


    ## REST 服务

    在处理 REST 服务时，你首先需要识别可用的 REST API。这些信息通常可以在开发者文档中找到。在本章中，你将使用书中创建 REST 服务。如果你从本地机器运行，URL
    将是 `localhost:8080`。


    Listing 5-2 所示的 REST API 提供以下功能：

    * `/books` 返回所有书籍列表。

    * `/books/{id}` 返回特定书籍的详情。`{id}` 是书籍的 ISBN（书号）。

    * `/books/{id}/authors` 返回特定书籍的所有作者。

    * `/authors` 返回所有作者列表。

    * `/authors/{id}` 返回特定作者的详情。每个作者在数据库中都有唯一的 ID。

    * `/authors/{id}/books` 返回特定作者的所有书籍列表。


    ## CRUD 操作

    学习使用特定 REST 简单方法是编写一个 CRUD 应用，调用创建、读取、更新和删除数据的 API。在本节中，你将使用 Listing 5-2 中的 API
    来实现这些操作。本节讨论的所有代码都在你项目的 `app.js` 文件中。


    ### 使用 GET 请求读取（CRUD 中的 R）

    你将开始从 Listing 5-3 所示的代码开始，对可用数据进行读取。


    列表 3：jQuery getJSON 方法调用

    ![image](img/00012.jpg)![image](img/00082.jpg)


    这是一个非常简单的调用，使用了 jQuery 的别名 `$` 并调用 `.getJSON` 方法。该调用接收两个参数：REST API 的 URL 以及一个处理返回数据的回调函数。[Listing
    5-3] 使用 `.getJSON()` 发起调用，因此它请求以 JavaScript 对象表示法（JSON）返回数据。由于 JSON 数据格式在语法上与创建
    JavaScript 对象的代码相同，因此可以直接从 JavaScript 语言中解析，而无需额外的解析器或处理器。


