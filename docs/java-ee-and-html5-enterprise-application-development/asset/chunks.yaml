    一旦你拥有了 `EventSource` 对象，就有三个事件可以进行监听，然后执行相应的操作：


    - `onopen:`: 此事件在连接首次建立时触发。

    - `onmessage:`: 每当服务器向浏览器发送消息时，该事件就会触发。这是你将可能需要处理的主要事件。

    - `onclose:`: 当连接由于任何原因关闭时，会触发此事件。


    在列表 5-18 中，你正在将局部变量 `message` 设置为一个表示连接已建立的字符串。然后，你将该值赋值给 Knockout 可观测对象 `sseData`，它将显示在绑定到同一个可观测对象的
    SSE HTML 区域内。由于你在消息中包含了 HTML 标记，因此 HTML 页面上的 Knockout 绑定实际上应该使用 `html:` 绑定，而不是普通的
    `text:` 绑定。


    在 `onmessage` 函数中，你希望通过将服务器的最新消息追加到现有消息的末尾，布局进入该区域的消息。你通过将局部变量 `message` 设置为可观测对象的实际值，然后追加传入的
    `event.data` 来实现。生成新的追加消息后，你将 `self.sseData` 可观测对象设置为新值。


    如果连接由于任何原因关闭，你将设置一个表示连接已关闭的消息，并设置相同的 `self.sseData` 可观测对象来显示该消息。


    当初始化 `self.displayMessage` 和 `self.displayError` 的原始可观测对象时，它们被设置为 `false`，这样在页面加载期间它们就不会显示这些区域。现在连接已经建立并设置了消息，你可以将可观测对象设置为
    `true`，这将显示消息区域，同时保持错误部分隐藏。


    最后，在 Event 区域的视图层中有一个很小的 X 图标，它已绑定到 `closeSSE()` 函数。当点击该图标时，当前的 SSE 流将关闭，并显示相应的消息。


    ## WebSocket

    在 JavaScript 中使用 WebSocket API 并产生的数据连接到 HTML 视图层已在第 4 章中介绍过。如果你还没有阅读第 4 章，设置到服务连接的基本方法与你刚刚通过服务器发送事件（SSE）学到的方法是相同的。然而，通过
    WebSocket API，你还可以向服务器发送数据。使用 WebSocket 连接代替 REST 或其他类型协议的巨大优势之一是，当你使用 WebSocket
    协议时，显著减少了通过线路传输的数据流量。客户端和服务器之间的连接建立一次，然后一直维持到通过 API 或客户端关闭连接为止。在其他协议中，你每次想从服务器发送或接收数据时都需要经过连接设置。要获取有关新
    WebSocket 协议的完整描述，请阅读第 4 章。


    ## 响应式设计

    响应式设计概念解决了设计 Web 应用程序的需求，使其能够根据显示它的设备屏幕尺寸相应地渲染其布局。应用程序的视图层需要通过改变布局或渲染的内容量来响应这种视图尺寸的变化。


    CSS2 规范提供了根据媒体类型动态使用不同 CSS 规则的能力。这些类型中最常见（且在 CSS3 中也继续如此）是屏幕（screen）和打印（print）。CSS3
    规范通过引入媒体查询（media queries）扩展了这一能力。媒体查询由一个媒体类型和零或多个表达式组成。这些表达式检查媒体特性的特定条件。一个很好的例子是检查当前显示屏幕尺寸的表达式。


    通过使用媒体查询和定义为网格布局的 CSS 类模式，你可以让应用程序响应显示屏幕的变化。


    网格布局模式是你可以自己设计的，但使用现有的网格框架要容易得多。到目前为止，你一直在使用 Twitter Bootstrap 框架来显示模态对话框并帮助显示按钮和通用表单布局。Twitter
    Bootstrap 在其 CSS 文件中也包含网格布局。最常用的网格样式是 12 列网格。你可以将布局的不同部分定义为任意数量的列，这些列之和为最大宽度 12。例如，你可以设置三个部分，每个部分都设置为四列宽。例如，在示例应用程序添加新书籍的模态对话框中，对话框对所有表单元素使用九列宽，而标签（label）元素使用三列。列表
    5-19 显示了该对话框部分内容的显示效果。


    示例网格布局 HTML

    注意每个 `<div>` 元素中的 `class="col-md-9"` 样式类，以及标签的 `class="col-md-3"` 样式类。这些样式类和媒体查询的结合使得响应式设计成为可能。让我们看看列表
    5-20 中的 CSS 代码。


    网格布局的 CSS 示例

    列表 5-20 的两个部分通过不同的媒体查询遵循 `.col-md-9` 的样式类。第一部分涵盖了浏览器尺寸不落入任何特定媒体查询的情况。第二部分引入了浏览器尺寸设置为
    `min-width:992px` 情况的媒体查询。你在特定媒体查询内部放置的任何样式规则在媒体查询表达式为真时，都会覆盖该相同规则先前的任何值。如果你没有覆盖某个规则，则现有规则将继续被使用。在显示的代码中，你并没有覆盖现有值，而是为
    `width:` 和 `float:` 设置了新规则。注意宽度被设置为百分比。


    ## 语法优雅样式表 (SASS)

    对于大多数 HTML5 应用，你可能可以使用一个易于维护的单个 CSS 文件。然而，随着应用程序的增长和变得复杂，维护大型 CSS 文件变得异常困难。历史上，如果你将
    CSS 文件拆分成较小文件并在 HTML 中引用它们，规则的生效取决于文件的顺序，即“后者胜”原则。在 2007 年，SASS 由名为 Hampton Catlin
    的开发者引入。SASS 的开发目前由 Nathan Weizenbaum 和 Chris Eppstein 继续。


    原始的样式表语言在设计上类似于 Haml（HTML 抽象语言）编程语言，因为它使用了缩进样式。这种被称为缩进格式的样式看起来完全不像 CSS。这种语法通常使用扩展名
    `.sass` 。后来了一种新的语法称为 Sassy CSS，或 SCSS，它的设计看起来和感觉与 CSS 完全一样——以至于任何有效的 CSS 代码都是
    SCSS 的子集。这种语法通常使用扩展名 `.scss` 。SASS 作为 SASS 或 SCSS 文件的预处理器工作，并将独立文件编译为一个或多个可以在
    HTML 代码中引用的 CSS 文件。列表 5-21 包含了两个样式引用：第一个是作为 My Club 示例应用程序基础的 Bootstrap 框架，第二个是对应用程序特定样式的引用。后者文件名为
    `responsive.css`，它是作为 SASS 处理四个独立 SCSS 文件生成的 CSS 文件。这些文件见图 5-4。


    引用 CSS 文件

    如图 5-4 所示，`responsive.scss` 文件仅包含三行实际代码。它按照你想要的组合顺序导入其他三个 SCSS 文件。其他三个文件被拆分以包含针对特定媒体查询类型的类和规则：在这种情况下，分别是桌面、平板和手持设备。这种分离只是一个例子。你的个人项目将决定你如何确定将
    CSS 拆分为更易管理部分的最佳方法。


    NetBeans IDE 使在项目中使用 SASS 变得非常简单。在导航中右键点击项目名称，选择属性菜单选项。在项目属性对话框中，选择 CSS 处理器选项，如图
    5-5 所示。对于此项目，IDE 被指示在 `/scss` 目录查找 SCSS 文件，并将编译后的文件输出到 `/css` 目录。

