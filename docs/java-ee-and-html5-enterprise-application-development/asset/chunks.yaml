    ![image](images/00136.jpg)


    If a client tries to access the resource using HTTP, it is redirected to an HTTPS
    URL instead. This ensures that the data transmitted cannot be observed by other
    entities and thus allows enforcing of the key concept of confidentiality.


    The `<transport-guarantee>` subelement can also take the value of `NONE` or `INTEGRAL`.
    The later value ensures that the data cannot be changed in transit and thus allows
    enforcing the key concept of data integrity.


    It is also important to note that if one `<http-method>` is listed in `<security-constraint>`,
    then that method is protected as defined by the constraints in the deployment
    descriptor. All other HTTP methods not explicitly listed are called as uncovered
    methods. Adding a top-level `<deny-uncovered-http-methods/>` element to the deployment
    descriptor can protect these methods.


    ![image](images/00007.jpg)


    The `<login-config>` element is used to configure the authentication method and
    the realm name that should be used for this application. It has the following
    subelements:


    ![image](images/00007.jpg)


    - `<auth-method>`: Configures the authentication mechanism for the web application.
    The element content must be `BASIC`, `DIGEST`, `FORM`, `CLIENT-CERT`, or a vendor-specific
    authentication scheme. The first four values correspond to the different authentication
    schemes explained earlier.


    ![image](images/00007.jpg)


    - `<realm-name>`: Indicates the realm name to use for the authentication scheme
    chosen for the web application.


    ![image](images/00007.jpg)


    The `<security-role>` element defines a security role. The subelement `<role-name>`
    designates the name of the security role. Note that these roles are created in
    an application server–specific way.


    ## REST Resource Security


    The following are some other guidelines to keep in mind when securing REST resources:


    ![image](images/00007.jpg)


    - Username and passwords, security tokens, or API keys should not appear in the
    URL, as these can be captured in web server logs and reused for malicious purposes.


    - Every REST resource may not need to be read (GET), created (POST), updated (PUT),
    and deleted (DELETE). Make sure that only the required HTTP methods are exposed
    in the deployment descriptor and that other methods are explicitly protected using
    the mechanism defined earlier, such as `<deny-uncovered-http-methods/>`.


    - Each user need not have access to all the REST resources. Use appropriate authorization
    by defining roles using `<security-role>` and giving access rights to resources
    accordingly using `<auth-constraint>`.


    - For REST endpoints receiving multiple content types, always check the Content-Type
    header and use Bean Validation constraints, as discussed in [Chapter 2](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_010.html_filepos66611),
    to restrict the types.


    - Most third-party REST APIs allow authentication and authorization with popular
    OAuth providers like Google, Facebook, and Twitter. Consider integrating these
    providers instead of creating your own infrastructure from scratch.


    ## WebSocket Security


    WebSocket connections are upgraded from an existing HTTP connection. A plain WebSocket
    connection is established using the `ws` URI scheme, and a secure connection can
    be established using the `wss` URI scheme. This allows the WebSocket communication
    over standard ports 80 for plain text communication and 443 for secure communication,
    thus not requiring opening additional ports in firewalls. This also allows many
    existing HTTP security mechanisms to apply to a WebSocket connection.


    WebSocket uses an origin-based security model policy commonly used by web browsers.
    RFC 6454 ([www.ietf.org/rfc/rfc6454.txt](http://www.ietf.org/rfc/rfc6454.txt))
    defines how user agents, such as browsers, isolate content retrieved from different
    origins (scheme, host, and port combination of the URL) to prevent malicious website
    operators from interfering with the operation of benign websites. Basically, content
    retrieved from one origin can interact freely with other content retrieved from
    that same origin, but it is restricted on how it can interact with content retrieved
    from a different origin. RFC 6454 defines an HTTP header field, named `Origin`,
    that indicates which origins are associated with an HTTP request. A WebSocket
    opening handshake from a browser is required to have this header so that subsequent
    requests can be serviced accordingly. However, this model does not work when a
    non-browser client initializes WebSocket connections.


    In addition to the `Origin` field, the WebSocket opening handshake is required
    to have a `Sec-WebSocket-Key` field. This field is sent from the client as part
    of the opening handshake and is used by the server to prove that it received a
    valid WebSocket opening handshake. This helps to ensure that the server does not
    accept connections from non-WebSocket clients (for example, HTTP clients) that
    may be abused to send data to unsuspecting WebSocket servers.


    As you can see, WebSocket already provides a decent level of protocol-level security.
    In addition, WebSocket endpoints within a Java EE application can be secured using
    the web container security model. A WebSocket mapped to a given `ws://` URI is
    protected in the deployment descriptor with a listing to an `http://` URI with
    the same hostname, port, and path since this is the URL of the opening handshake.
    A WebSocket application may use Basic Authentication or form-based authentication
    prior to the opening handshake. Similarly, WebSocket authorization may be set
    by adding a `<security-constraint>` element to the deployment descriptor. The
    `<url-pattern>` used in the security constraint is used to match the request URI
    of the opening handshake of WebSocket. Finally, a `<transport-guarantee>` of `CONFIDENTIAL`
    allows WebSocket communication over an encrypted `wss://` connection. This allows
    WebSocket applications to assign an authentication scheme, user roles, and a transport
    guarantee using standard mechanisms.


    ## Summary


    The HTML5 specification provides many new features that also bring their own potential
    security issues. While this book is focused specifically on HTML5 interactions
    with web services of REST, and Server-Sent Events, there may be other areas you
    will want to research, such as local-storage, geolocation, and more. The Open
    Web Security Project (OWASP) is a worldwide, not-for-profit organization whose
    main focus is on improving security in software. This organization’s website ([www.owasp.org](http://www.owasp.org))
    is a great resource for researching existing and potential security issues in
    all areas of HTML5 development.


