    你会注意到，回调函数仅对成功请求有效。如果你需要进行错误处理，将希望使用在本章节稍后在列表 5-7 中所示的完整语法。


    你还会注意到示例中的 URL 是使用变量 `self.serviceURL` 设置的，而不是直接使用 字符串。这是因为这一行实际上是一个名为 `ViewModel`
    的较大函数的一部分。这是 Knockout.js 模型-视图-视图模型（MVVM）架构模式的一部分，你在第 1 章中读过相关内容。列表 5-4 显示了完整的
    `ViewModel` 代码。


    ![image](img/00016.jpg)

    列表 5-4 示例 ViewModel

    ![image](img/00012.jpg)

    ![image](img/00084.jpg)


    ### 让我们逐行分析其提供的功能：


    ![image](img/00007.jpg)


    ```javascript

    function booksViewModel() { var self = this;

    ```

    JavaScript 中的当前对象通常通过一个伪变量 `this` 来引用。在函数中始终使用 `this` 来引用变量的主要问题是，`this` 的作用域可能会根据函数的调用方式而改变。你希望将一个局部变量绑定到当前的
    `this` 对象上，这样无论以后在代码的哪个部分调用该函数，都能仍然引用到同一个对象。


    ![image](img/00007.jpg)


    ```javascript

    self.serviceURL = serviceRootURL + "/books";

    ```

    这一行设置了将用于实际 REST API 调用的 URL。由于所有的 REST API 调用都具有相同的主机名和应用程序路径，因此设置了一个全局变量来包含
    URL 中始终不变的部分。在开发模式下处理 REST 服务调用时，需要记住的一点是，当你从不同的设备测试代码时，主机名可能会变化。例如，使用“localhost”作为主机名对于任何连接到运行在同一机器上的
    REST 服务的浏览器来说都是没问题的。然而，如果你尝试从例如平板电脑测试代码并连接到你开发机器的 IP 地址，那么对“localhost”的 JavaScript
    调用将失败。出于这个原因，你会在应用程序代码的顶部看到 `serviceHostname` 变量被设置为 `serviceHostname = window.location.hostname;`，并且最终的
    `serviceRootURL` 变量是使用这个动态值创建。


    ![image](img/00085.jpg) ![image](img/00007.jpg)


    ```javascript

    self.Books = ko.observableArray([]);

    ```

    这显示了你第一次使用 Knockout.js 方法。你将变量 `self.Books` 赋值给一个 Knockout `observableArray` 并用空数组对其初始化。使用
    Knockout 可观察对象（observables）和 `observableArrays` 是在 MVVM 架构的模型层数据与视图层之间建立双向绑定的关键。你将在在本章稍后的部分看到这个
    `observableArray` 是如何使用的。


    ![image](img/00007.jpg)


    ```javascript

    $.getJSON(self.serviceURL, function(data) {

    ```

    这一行已经在列表 5-3 中出现过并在之后进行了讨论，但此时这些变量应该会更容易理解一些。当返回成功请求时，会处理回调函数。`data` 对象包含了从服务器返回的作为
    `response` 对象一部分的数据。由于你使用了 `$.getJSON()`，返回的数据是一个 JSON 对象。


    ![image](img/00007.jpg)


    ```javascript

    var mappedBooks = $.map(data, function(item) {

    ```

    这一行使用 jQuery 的 `.map()` 工具方法获取返回的 JSON 对象中的每个顶层元素，并将其添加到数组中。每个项目在从 `.map()` 方法返回之前，都会被创建一个新的
    `bookModel` 对象。


    ![image](img/00007.jpg)


    ```javascript

    return new bookModel(item);

    ```

    最后，你得到了一个包含模型集的数组。当稍后讨论列表 5-5 时，你将了解到更多关于 `Model` 对象的信息。


    ![image](img/00007.jpg)


    ```javascript

    self.Books(mappedBooks);

    ```

    最后这一行将预定义的 `observableArray` `self.Books` 的值设置为包含 `Model` 对象集合。当你将 `ViewModel`
    绑定到视图层时，将看到此对象是如何使用的。


    ### 模型 (Model)

    Model 代表你数据的一个实例。最简单的想法将其视为数据库中的单条记录或表格中的单行。在列表 5-5 中，你可以看到 Model 中的每个字段都被赋值给了一个
    Knockout 变量。这让你能够利用 Knockout.js 闻名的双向绑定。双向绑定意味着，当 `observableArray` 的值发生程序化更改或来自用户输入更改时，Knockout
    库会自动更新所有绑定到它的元素。你不需要为视图层中使用的每个变量设置监听器（当你在稍后讨论视图层时，这一点会变得更加清晰）。


    在 Model 的最后一行，你会注意到你不仅从数据中分配了每个字段，还可以定义将在视图层中使用的自定义变量。在示例中，书籍封面照片已经提供，并以其 ISBN
    代码命名。在列表 5-5 中，你可以看到变量 `this.coverImage` 被赋值给 `bookData.isbn` 的值，以便稍在 HTML 代码中加载特定的图像。


    ![image](img/00016.jpg)

    列表 5-5 示例 Model

    ![image](img/00012.jpg)

    ![image](img/00084.jpg)


    ### 视图 (View)

    现在你已经有了 Model 和 ViewModel，拼图还剩下最后一块。列表 5-6 显示了视图层的 HTML 代码。它包含在项目的 `main.html`
    文件中。


    ![image](img/00016.jpg)

    列表 5-6 示例

    ![image](img/00012.jpg)

    ![image](img/00086.jpg)


    让我们分解这段代码：


    ![image](img/00007.jpg)


    ```html

    <article id="bookInfo">

    ```

    该元素代表有助于定义页面结构的语义元素。然而，`id` 属性是重要的，因为它会被 Knockout.js 的 `applyBindings()` 方法用于此
    HTML 部分绑定到你创建的 ViewModel。


    ![image](img/00007.jpg)


    ```html

    <div class="item active" data-bind="foreach: Books ">

    ```

    这一行是渲染书籍列表的开始。这个 `div` 将一个模型的布局和样式。如果这是一个表格，这就是数据行的布局和样式。关键属性是 `data-bind`。它使用
    Knockout 的 `foreach:` 绑定来渲染 `div` 内部的每一个项目。回想关于列表 5-4 的讨论，它将 `Books` 的值设置为来自 REST
    调用返回的模型数组。


    ![image](img/00007.jpg)


    ```html

    <div id="bookCoverPhoto" class="bookCoverPhoto col-md-3" data-bind="click: getBookDetails">

    ```

    这个 `div` 是书籍封面及其的容器。它绑定了 `click:` 绑定，以便你进入页面获取该特定书籍的更多详情。你稍后将看到更多关于获取和显示书籍详情的内容，因为该详情页将用于你的
    CRUD 应用程序的操作。


    ![image](img/00007.jpg)


    接下来的三行设置了每本书将显示的内容。每本书的封面图像、标题和 ISBN 都绑定到它们自己的 HTML 元素上。这段代码中有两个注意点：


    ![image](img/00007.jpg)


    ```html

    data-bind="attr: {src: ''img/''+coverImage()+''.jpg''}"

    ```

    在这个 `data-bind` 中，Knockout 可观察对象 `coverImage` 被当作方法调用，而不是像你在之前所有的绑定中那样仅引用变量。当你想要变量的实际值而不是
    Knockout 用于双向绑定的函数引用时这样做。这破坏了该引用的双向绑定，但在某些情况下是可以的。在这种情况下，你只是使用变量动态地获取 `coverImage`
    文件。你没有在代码的其他部分更改此名称，因此不需要将其设置为双向绑定。


    ![image](img/00007.jpg)


    ```html

    class="hidden" data-bind>

    ```

    这个 `class` 是 `"hidden" data-bind`...

