    在此阶段，W3C HTML 工作组将开展各项活动，以确保规范能够在浏览器、编写工具、电子邮件客户端、服务器、内容管理系统以及其他 Web 工具中实现兼容的实现。


    该小组将分析当前的 HTML5 实现情况，确定测试开发的优先级，并与社区合作开发这些测试。HTML 工作组计划将这一实施阶段持续到 2014 年年中，此后
    W3C 预计将发布最终的 HTML5 建议书（Recommendation），实施者可以根据 W3C 专利政策免费免特许费地实现该规范。

