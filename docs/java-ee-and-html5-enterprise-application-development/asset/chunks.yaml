  trans: "\n\n# 关于作者\n\n**John Brock** 是甲骨文公司（Oracle Corporation）的主任产品经理。John 在 Web\
    \ 应用开发领域拥有超过 15 年的经验。在 Sun Microsystems 工作期间，他负责识别新兴的互联网技术以及这些技术如何与 Java 虚拟机 (`JVM`)\
    \ 交互。John 曾与 `JRuby`、`Jython`、`Groovy`、`JavaFX` 等开发团队合作过。他目前的关注重点是 HTML5 应用开发，并且\
    \ `NetBeans IDE` 中 `HTML5`、`JavaScript` 和 `CSS3` 特性的产品经理。可以通过 `@peppertech` 轻松联系到\
    \ John。\n\n**Arun Gupta** 是红帽（Red Hat）开发者倡导总监，专注于围绕 `JBoss Middleware` 构建社区。作为\
    \ Sun Microsystems `Java EE` 团队的创始成员之一，他向全世界传播了对技术的热爱。在甲骨文，Arun 领导一个跨职能团队，通过对内容、营销活动和计划的策略、规划和执行，驱动了\
    \ `Java EE 7` 平台的全球发布。Arun 拥有丰富的演讲经验，包括在 37 个国家就众多主题进行演讲，并是 `JavaOne` 星级大师。他曾是畅销书作者、狂热跑步爱好者、环游家以及\
    \ `Java Champion`，可以通过 `@arungupta` 轻松联系到他。\n\n**Geertjan Wielenga** 是甲骨文公司（Oracle\
    \ Corporation）的主任产品经理。Geertjan 自 1996 年起一直从事软件行业工作。在 Sun Microsystems 期间，他负责多种技术的文档工作（主要涉及\
    \ `Java EE` 和 Web 领域），开发了教程并为出版书籍做出了贡献。Geertjan 是 `NetBeans` 的热诚倡导者，将其作为 Web 技术工具需求的核心解决方案。他同样推崇\
    \ `NetBeans Platform` 作为大型 Java 桌面应用程序的稳定且多功能的解决方案。他目前担任负责负责 `NetBeans IDE` 外部推广的产品经理。\n\
    \n# 关于技术编辑\n\n**John Yeary** 是 Infor 全球解决方案（Infor Global Solutions）`Epiphany CRM\
    \ Marketing` 的首席软件工程师。John 一直是 Java 倡导者，自 1995 年起一直从事 Java。John 是一位技术博客作者，专注于\
    \ `Java Enterprise Edition` 技术、`NetBeans` 和 `GlassFish`。John 目前是格林维 Java 用户组（`GreenJUG`）的创始人兼主席。他是一位教师、导师以及活跃的开源贡献者。\n\
    \nJohn 毕业于缅因海事学院（Maine Maritime Academy），获得海洋工程学士学位 (`B.Sc.`），专注于数学。他是一名海洋船员，拥有多项执照和认证。不在从事\
    \ Java 和 `F/OSS` 项目时，他喜欢徒足、航海、旅行以及与家人共度时光。John 还是美国童子军（`BSA`）833 队的副小团长、单位专员，以及\
    \ `BSA` 蓝岭理事会（Blue Ridge Council）活动与公民服务的南部区主席。\n\n![image](img/00003.jpg)\n\n\
