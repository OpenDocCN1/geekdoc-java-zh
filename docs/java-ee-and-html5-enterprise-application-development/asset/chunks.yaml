    at the top of the book details template HTML code there is a knockout `click:`
    binding added to an icon for Edit and another icon for Delete. Both of these functions
    do nothing more than load and display the dialogs for their specific purposes.![image](images/00016.jpg)Listing
    5-14   Example of Icons for Edit and Delete![image](images/00012.jpg)![image](images/00103.jpg)Let’s
    look at [Listing 5-15](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos276254)
    to see how the `updateBookDialog` dialog is handled first.![image](images/00016.jpg)Listing
    5-15   Partial Edit Dialog![image](images/00012.jpg)![image](images/00104.jpg)Like
    the `addBookDialog` dialog created in [Listing 5-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos259431),
    this is a Twitter Bootstrap modal dialog. There are two important things to note
    in [Listing 5-15](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos276254).
    First, you don’t need to pass in any information to this dialog directly. Each
    field is bound to the existing Knockout observable that was also used to display
    the book details in the main page.'
