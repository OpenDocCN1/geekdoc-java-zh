    ![image](img/00136.jpg)


    如果客户端尝试使用 HTTP 访问资源，它将被重定向到 HTTPS URL。这确保了传输的数据不会被其他实体观察，从而允许强制执行机密性（confidentiality）的核心概念。


    `<transport-guarantee>` 子元素也可以取 `NONE` 或 `INTEGRAL` 的值。后者确保数据在传输过程中不会被更改，从而允许强制执行数据完整性（data
    integrity）的核心概念。


    同样重要的是，如果 `<security-constraint>` 中列出了一个 `<http-method>`，那么该方法将根据部署描述符中约束的定义受到保护。所有未显式列出的其他
    HTTP 方法统称为“未覆盖方法（uncovered methods）”。在部署描述符中添加一个顶级的 `<deny-uncovered-http-methods/>`
    元素可以保护这些方法。


    ![image](img/00007.jpg)


    `<login-config>` 元素用于配置此应用程序身份验证方法和领域名称（realm name）。它具有以下子元素：


    ![image](img/00007.jpg)


    - `<auth-method>`: 配置 Web 应用程序的身份验证机制。元素内容必须是 `BASIC`、`DIGEST`、`FORM`、`CLIENT-CERT`
    或特定厂商身份验证方案。前四个值对应于之前解释的不同身份验证方案。


    ![image](img/00007.jpg)


    - `<realm-name>`: 指明 Web 应用程序选择的身份验证方案使用的领域名称。


    ![image](img/00007.jpg)


    `<security-role>` 元素定义了一个安全角色。子元素 `<role-name>` 指定安全角色的名称。注意，这些角色是以特定应用程序服务器的方式创建的。


    ## REST 资源安全


    在保护 REST 资源时，以下是需要记住的一些其他指南：


    ![image](img/00007.jpg)


    - 用户名和密码、安全令牌或 API 密钥不应出现在 URL 中，因为这些可能会被 Web 服务器日志捕获并用于恶意目的。


    - 每一个 REST 资源并不一定需要读取 (GET)、创建 (POST)、更新 (PUT) 和删除 (DELETE)。确保在部署描述符中仅暴露了所需的 HTTP
    方法，并使用之前定义的机制（例如 `<deny-uncovered-http-methods/>`）显式地保护其他方法。


    - 每个用户并不需要访问所有 REST 资源。通过使用 `<security-role>` 定义角色，并相应地使用 `<auth-constraint>`
    资源访问权限来实现适当的授权。


    - 对于接收多种内容类型的 REST 端点，始终检查 Content-Type 头部并使用 Bean Validation 约束（如第 2 章所述）来限制类型。


    - 大多数第三方 REST API 支持使用 Google、Facebook 和 Twitter 等流行的 OAuth 提供商进行身份验证和授权。考虑集成这些提供者，而不是从开始创建自己的基础设施。


    ## WebSocket 安全


    WebSocket 连接是从现有的 HTTP 连接升级而来的。普通的 WebSocket 连接使用 `ws` URI 方案建立，而安全连接可以使用 `wss`
    URI 方案。这允许通过标准端口 80（用于明文通信）和 443（用于安全通信）进行 WebSocket 通信，因此不需要在防火墙中打开额外的端口。这也使得许多现有的
    HTTP 安全机制可以适用于 WebSocket 连接。


    WebSocket 使用 Web 浏览器常用的基于源（origin-based）的安全模型策略。RFC 6454 ([www.ietf.org/rfc/rfc6454.txt](http://www.ietf.org/rfc/rfc6454.txt))
    定义了用户代理（如浏览器）如何隔离从不同源（URL 的方案、主机和端口组合）获取的内容，以防止恶意网站运营者干扰良性网站的运行。基本上，从一个源获取的内容可以与从同一源获取的内容自由交互，但它与从不同源获取的内容交互的方式受到限制。RFC
    6454 定义了一个名为 `Origin` 的 HTTP 头部字段，它指示了哪些源与 HTTP 请求关联。浏览器的 WebSocket 开启握手需要包含此头部，以便后续请求能够得到相应的服务。然而，当非浏览器客户端初始化
    WebSocket 连接时，该模型将不起作用。


    除了 `Origin` 字段外，WebSocket 开启握手还需要包含一个 `Sec-WebSocket-Key` 字段。该字段作为握手的一部分从客户端发送，并由服务器用于证明它收到了有效的
    WebSocket 开启握手。这有助于确保服务器不接受来自非 WebSocket 客户端（例如 HTTP 客户端）的连接，这些连接可能被滥用来向不知情事的
    WebSocket 服务器发送数据。


    如你所见，WebSocket 已经提供了不错的协议级安全性。此外，Java EE 应用程序中的 WebSocket 端点可以使用 Web 容器安全模型进行保护。映射到给定
    `ws://` URI 的 WebSocket 在部署描述符中通过列出相同主机名、端口和路径的 `http://` URI 受到保护，因为这是开启握手的 URL。WebSocket
    应用程序可以在开启握手之前使用 Basic 验证或基于表单的身份验证。同样，可以通过向部署描述符中添加 `<security-constraint>` 元素来设置
    WebSocket 授权。安全约束中 `<url-pattern>` 用于匹配 WebSocket 开启握手的请求 URI。最后，`CONFIDENTIAL`
    的 `<transport-guarantee>` 允许通过加密的 `wss://` 连接进行 WebSocket 通信。这允许 WebSocket 应用程序使用标准机制分配身份方案、用户角色和传输保证。


    ## 总结


    HTML5 规范提供了许多新功能，但同时也带来了各自的潜在安全问题。虽然本节专门关注 HTML5 与 Web 服务以及服务器发送事件（Server-Sent
    Events）的交互，但可能还有你想要研究的其他领域，例如本地存储、地理位置等等。开放 Web 安全项目（OWASP）是一个全球性的非营利组织，其主要关注点是改进软件安全性。该组织的网站（[www.owasp.org](http://www.owasp.org)）是研究所有
    HTML5 开发领域现有和潜在安全问题的极佳资源。


