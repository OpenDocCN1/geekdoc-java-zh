    requested URI.For your username and password, the Authorization header looks like
    this: ![image](images/00132.jpg)        Many of the security options in Digest
    Authentication are optional so the server may operate in a security-reduced mode.
    Even though it is slightly better than Basic Authentication, it is still not intended
    to replace stronger authentication protocols, like client-cert. Like Basic Authentication,
    Digest Authentication is also susceptible to man-in-the-middle attacks. These
    types of attacks can be avoided by using HTTPS instead of HTTP.![image](images/00007.jpg)   Form-based
    Authentication   Form-based authentication allows customization of the login screen
    and error pages that are presented to the client. The contents of an HTML page
    for a login page should be coded as follows: ![image](images/00133.jpg)        The
    login form must contain fields for entering a username and a password. These fields
    must be named `j_username` and `j_password`, respectively. The action of the login
    form must be `j_security_check`.        The client is asked to enter the username
    and password and then click the Submit button, which submits the form to the server.
    If the authentication succeeds, the client is redirected to the requested resource.
    If the authentication fails, the error page is returned, which typically contains
    information about the failure.    ![image](images/00007.jpg)   Client-Cert Authentication   HTTPS
    not only provides a secure connection to the server but also can be used for authentication.
    This mechanism requires the client to possess a public key certificate (PKC) issued
    by a trusted organization, called a certificate authority. The PKC provides identification
    for the bearer. The server authenticates the client using this PKC.        The
    only disadvantage of this approach is the managing of the certificates themselves
    on both the client and server. Otherwise, this method is more secure than both
    Basic Authentication and form-based authentication.All of these authentication
