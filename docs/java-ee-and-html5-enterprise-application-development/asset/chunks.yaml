    \ version of that massive text.\n\n*Wait*, looking at the prompt again, the `[content]`\
    \ block is actually just the first few paragraphs. I'll just format what's there.\n\
    \nActually, the prompt's `[content]` block is very long. I will process the whole\
    \ thing.\n\n(Note: The user provided a very long and repetitive text. I will maintain\
    \ the core content and format as requested.)\n\n[content]\nThe implementation\
    \ of the HTML5 specification so far has been done against a moving target, so\
    \ to speak. Different vendors support the specification in different ways, or\
    \ may not support certain parts of the specification at all. This poses a problem\
    \ for application developers, who have to develop for a customer base that could\
    \ be using a wide variety of device and browser combinations. Frankly, several\
    \ websites have been created to help developers navigate this tricky area of developing\
    \ HTML applications. Two of the more popular sites are ![image](images/00007.jpg)\
    \ HTML5 Test [http://html5test.com/](http://html5test.com/) ![image](images/00007.jpg)\
    \ Can I Use [http://caniuse.com/](http://caniuse.com/)\n\nThe HTML5 Test website\
    \ will allow you to see how well a specific version or brand of browser implements\
    \ the whole of the HTML5 specification. This is very useful when you are trying\
    \ to decide what kind of browser or device support matrix your application will\
    \ provide. The Can I Use website goes into more detail and allows you to look\
    \ at a specific HTML element or attribute and see which browser vendors have implemented\
    \ it and in which versions of their browsers.\n\n## Use of Mobile Devices\n\n\
    Probably the second largest reason for HTML5’s recent rise in visibility is the\
    \ increase in the availability of smartphones, tablets, and other types of mobile\
    \ and embedded devices with Internet access (such as Internet-ready TVs, game\
    \ consoles, and Blu-ray players, to name just a few). The reason that the rise\
    \ in the availability of these devices has brought HTML5 to prominence is that\
    \ all of them are being developed with browsers that already support HTML5 to\
    \ some degree. Unlike on desktop operating systems, the developers of the browsers\
    \ for these devices didn’t have to consider any issues of backward compatibility\
    \ with existing browser implementations. Everything is new on these types of devices,\
    \ and the manufacturers started with the latest HTML specifications in anticipation\
    \ of it becoming the standard in the near future.\n\nThis rise in accessing the\
    \ Internet via mobile devices is also one of the factors that has enticed enterprise\
    \ developers to look more closely at HTML5. The traditional website layout does\
    \ not comfortably scale down for viewing on a smaller device like a smartphone\
    \ or tablet. The existing methods of producing a completely different version\
    \ of the website to display when the client is detected to be a mobile device\
    \ have proven to be fraught with maintenance problems and inefficient to scale.\n\
    \n## New HTML5 Features\n\nOne of the major new features of HTML5 is the inclusion\
    \ of new semantic elements to help developers manage the layout of the HTML page\
    \ and its content so that it scales flawlessly for viewing on smaller devices.\
    \ You can now lay out your HTML content using tags such as `<header>`, `<footer>`,\
    \ `<section>`, `<article>`, `<aside>`, `<nav>`, and many others.\n\n![image](images/00012.jpg)![image](images/00013.jpg)![image](images/00012.jpg)\n\
    TABLE 1-1. Semantic Elements\n\nAlong with the new semantic elements in the HTML5\
    \ specification, there are also new syntactic elements that are meant to remove\
    \ the need to install proprietary-ins. These include elements such as `<canvas>`,\
    \ `<video>`, `<audio>`, and `<svg>`.\n\n![image](images/00012.jpg)![image](images/00014.jpg)![image](images/00012.jpg)\n\
    TABLE 1-2. Syntactic Elements\n\n## Syntactic Elements\n\nLastly, the HTML5 specification\
    \ brings new attributes to some of existing elements. The most notable of these\
    \ are the new values for the `type` attributes of the `<input>` element. While\
    \ all of these new type values are now part of the finalized HTML5 specification,\
    \ each browser vendor can, and has, implemented how they behave when rendered.\
    \ For instance, if a browser renders an input field with the type set to `\"date\"\
    `, the end user would see a date picker to help select the date they wish to enter.\n"
