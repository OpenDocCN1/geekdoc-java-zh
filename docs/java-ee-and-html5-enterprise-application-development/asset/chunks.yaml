    During this stage, the W3C HTML Working Group will conduct a variety of activities
    to ensure that the specifications may be implemented compatibly across browsers,
    authoring tools, email clients, servers, content management systems, and other
    Web tools.


    The group will analyze current HTML5 implementations, establish priorities for
    test development, and work with the community to develop those tests. The HTML
    Working Group has planned for this implementation phase to last into mid-2014,
    after which W3C expects to publish the final HTML5 Recommendation, available Royalty-Free
    to implementers under the W3C Patent Policy.

