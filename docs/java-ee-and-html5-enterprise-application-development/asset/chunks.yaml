  trans: "\n\n# 跨站请求伪造\n\n利用跨站请求伪造（CSRF）安全漏洞的攻击并不常见见，因为它们只有在非常有限的条件下才能成功。然而，如果你不采取某些措施来防止\
    \ CSRF 攻击，你就会让你的网站访问者面临可能非常糟糕的后果。\n\n## 理解 CSRF 攻击\n\n解释 CSRF 攻击的一种良好方法是使用银行网站示例。我们将该网站命名为\
    \ `megabank.com`。当你在这个银行网站上登录账户时，登录过程会在你的浏览器中存储一个会话 cookie。对于银行网站来说，这是一个完全正常且可以的做法。\n\
    \n如果你在没有通过点击 `Logout` 按钮手动注出的情况下离开网站，就会存在 CSRF 漏洞。在 cookie 过期之前，你的浏览器缓存中会有该会话\
    \ cookie。会话 cookie 的过期时间由 `megabank.com` 网站设置，大多数情况下会在网站最后一次活动后约 15 分钟后过期。不过，这个过期时间可能会有所不同。\n\
    \n假设你随后导航到另一个网站，而该网站恰好被黑了，包含了恶意代码。当这些代码被激活（例如通过点击按钮）时，它们会指示你的浏览器向 `megabank.com`\
    \ 发送请求，将资金从“你的”账户转移到恶意代码中列出的黑客账户。当 `megabank.com` 网站接收到请求时，它会寻找识别用户的会话 cookie，由于你刚刚访问了该网站并没有登录，它会在你的浏览器中找到它。转移将会顺利，就像是你亲自执行该请求一样。\n\
    \n## 风险与影响\n\n虽然成功的 CSRF 攻击所需的所有变量同时存在的概率较低，但只需一次成功的攻击就能摧毁 `megabank.com` 网站的声誉。如果你遇到过垃圾邮件或垃圾论坛评论，其中仅包含指向某些看似随机网站的链接，那么它们很可能是诱导你进行\
    \ CSRF 攻击的尝试。\n\nCSRF 漏洞最糟糕的部分是，终端用户甚至不需要点击被黑网站上的任何内容。整个攻击过程可以在页面加载时通过 `JavaScript`\
    \ 完成。\n\n## 预防策略\n\n那么，你可以做些什么来确保你的 HTML5 应用程序不允许此类 CSRF 攻击呢？ \n\n1. 注意，你的应用程序必须维护会话\
    \ cookie，这种攻击才会发生。\n2. 如果你的应用程序不维护会话 cookie（无状态应用程序），那么它就不会容易受到此类攻击，你不需要做任何事情。\n\
    3. 如果你的应用程序确实维护会话 cookie，那么你的首要任务是确保你的网站不受前一节描述的 `XSS` 类型攻击的影响。如果它容易受到 `XSS` 攻击，那么你尝试防止\
    \ CSRF 攻击所做的一切都是徒劳的。\n\n要在 HTML5 客户端应用程序中实现任何类型的 CSRF 预防，你需要与应用程序服务器端的操作配合。你用于防止\
    \ CSRF 的技术被称为 `双重发送 cookie`（double-sending cookies）。\n\n这种技术涉及从首次请求网页时服务器发送的 cookie\
    \ 中读取 session ID。使用 `JavaScript` 将该相同的 session ID 放入应用程序中所有表单的隐藏字段中，并将其附加到应用程序发回服务器的任何\
    \ `AJAX` 调用中。当将 session ID 值发送回服务器时，它通常被称为 `CSRF token`。\n\n| ![image](img/00070.jpg)\
    \ | **注意** |\n| :--- | :--- |\n| | 永远不要在使用 `GET` 方法的 `AJAX` 调用上设置 `CSRF token`。可能会在许多不同的地方（服务器日志、浏览器日志、网络监视器等）暴露\
    \ `CSRF token`。 |\n\n"
- fmt: "\nUsing code similar to that shown in [Listing 6-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos332554)\
    \ will allow you to echo the current session ID back to the server, which will\
    \ then check to make sure that it matches the session ID in the cookie. Using\
    \ this technique makes it extremely unlikely that the server will receive from\
    \ another website a request that has both the proper session cookie and the same\
    \ session ID in a hidden form element.\n\n![image](images/00016.jpg)\nListing\
    \ 6-4 CSRF Hidden Form Token![image](images/00012.jpg)![image](images/00128.jpg)\n\
    \nAs you can see, the real solution to prevent CSRF attacks has to start at the\
    \ server, but as a client-side developer, you can also do your part to protect\
    \ against such attacks.\n\n### Clickjacking\nClickjacking is another type of attack\
    \ against which you must protect your HTML5 web application. For a clickjacking\
    \ attack to succeed, the attacker first must manage to wrap a web page from your\
    \ application inside of a frame, or `<iframe>`, of some kind on a website that\
    \ the hacker has created. The hacker creates a series of stacked transparent layers\
    \ over the top of the website that the hacker created, which appears to be a normal\
    \ website. When a website visitor thinks they are clicking buttons or links on\
    \ this website, they are really interacting with your website and clicking a button\
    \ or link that is not visible. Back in 2009, Chris Shiflett described an attack\
    \ of this kind ([http://shiflett.org/blog/2009/feb/twitter-dont-click-exploit])\
    \ that used a Twitter page as the transparent overlay. When an end user clicked\
    \ the visible “Don’t Click” button, they were actually clicking the Post button\
    \ of the hidden Twitter page and sending out a tweet devised by the attacker.\n\
    \nAs with most of these kinds of attacks, the best way to defend against clickjacking\
    \ is to do so from the server side. In the case of clickjacking, the service-side\
    \ defense is to set the `X-Frame-Options` response header to either deny all types\
    \ of frames or to allow only frames from the same domain. However, there is one\
    \ coding practice that you can use on the client side to protect your application\
    \ from clickjacking.\n\nIf you cannot modify the response headers from the server\
    \ side, or you need to support older browser versions that don’t understand the\
    \ `X-Frame-Options` header, you can add the piece of code shown in [Listing 6-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos335677)\
    \ to the `<head>` element of your pages to help protect against clickjacking attacks.\
    \ This concept comes from Jason Li at Aspect Security and is discussed here: [https://www.codemagi.com/blog/post/194].\n\
    \n![image](images/00016.jpg)\nListing 6-5 Anti-clickjacking Example![image](images/00012.jpg)![image](images/00129.jpg)\n\
    \nAdding a `<style>` element to the top of your page enables the script that immediately\
    \ follows it to know that it’s referencing your page. If you were to use only\
    \ the `else` part of the code by itself, the expression could be defeated through\
    \ multiple kinds of workarounds. With the code in [Listing 6-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos335677),\
    \ the script looks for the `antiClickjack <style>` element, and if it’s not already\
    \ the top layer, it moves it to the top. This is the OWASP-recommended method\
    \ for preventing clickjacking attacks from the client side.\n\n### Authentication\
    \ and Authorization\nProbably the most obvious security issue when developing\
    \ an HTML5 web application is how to handle your application login. None of the\
    \ coding examples presented thus far in this book have included a login process,\
    \ but if your application is going to store information that is specific to a\
    \ user and/or information that will help to make the user’s current visit to your\
    \ application more enjoyable, then you will want to build some form of authentication\
    \ into your application.\n\nThe most common method of authentication used for\
    \ JavaScript applications is the `OAuth` standard. `OAuth` is an open standard\
    \ for authentication. In 2006, a few developers from Twitter and Magnolia put\
    \ together the concept for `OAuth`. Through the work of a small group of developers\
    \ over the next year, a draft proposal for the `OAuth` standard was developed,\
    \ resulting in a final draft that was released in October of 2007. In 2008, the\
    \ `OAuth` specification was brought in front of a group of developers at the Internet\
    \ Engineering Task Force (IETF) annual meeting for work on further standardization.\n\
    \nThe `OAuth 1.0` protocol was released in April 2010 as `RFC 5849` (http://tools.ietf.org/html/rfc5849).\
    \ The `OAuth` standard is now the required authentication protocol for many leading\
    \ web service, such as Twitter, Flickr, and others. The `OAuth 2.0` specification\
    \ was released as `RFC 6749` (http://tools.ietf.org/html/rfc6749) in 2012. Although\
    \ is slowly gaining popularity across the Internet, many controversies arose throughout\
    \ its development. Some of the original developers of `OAuth 1.0` protocol have\
    \ resigned from the project because of disagreements over its direction and policies.\
    \ To decide which of the two protocols to use in your specific situation, you\
    \ will need to conduct further research on own. It’s safe to say that if your\
    \ application needs to support direct authentication, you should start with the\
    \ `OAuth` protocol.\n\nWithout getting into the technical details of the protocol,\
    \ `OAuth` enables a client application, often a web application, to act on behalf\
    \ of a user, with the user’s permission. The main components of `OAuth 2.0` are:\n\
    - `Client`\n- `Authorization server`\n- `Resource server`\n- `Resource owner`\n\
    \nThe `resource owner` is an entity that can grant access to a protected resource.\
    \ The `client` is the application that makes the access request on behalf of the\
    \ resource owner. A `client` performs actions on a `resource server` based on\
    \ authorization provided by the user at the `authorization server`. For example,\
    \ a user can access images on `www.flickr.com` (resource server) via a web browser\
    \ (client) by signing in to Flickr using their Google Account (where `www.google.com`\
    \ is the authorization server). The advantage of this approach, as opposed to\
    \ creating a separate login on `www.flickr.com`, is that the user does not have\
    \ to create and remember multiple logins. Instead, the `client` obtains a `bearer\
    \ token` from the `authorization server`, with the user’s approval, and stores\
    \ it. Then, when the resource needs to be accessed at the `resource server`, the\
    \ `client` sends a special HTTP header in the following form:\n\n![image](images/00016.jpg)![image](images/00130.jpg)\n\
    \nThe token value is opaque to the `client` but can be decoded by a `resource\
    \ server` so that the server can check that the `client`, on the user’s behalf,\
    \ has permission to access the resource.\n\nIf your application is going to be\
    \ used as part of a larger enterprise environment that requires user authentication,\
    \ then your application probably does not need to provide separate authentication.\
    \ If you do need to include some form of authentication in your application, there\
    \ are plenty of libraries in different languages by different `authorization servers`\
    \ and resource providers that provide `OAuth` support. It’s worth looking at them\
    \ before deciding on your security infrastructure.\n\nIn a typical enterprise\
    \ environment, your application will be part of a larger application server installation.\
    \ This application server will do the authentication for your application, and\
    \ the user will not get to your application’s pages until they have already been\
    \ authenticated by the application server’s methods. This is also where the concept\
    \ of authorization comes into play. Once the application server, or the identity\
    \ management system that the application server is using, authenticates the end\
    \ user, it can then be used to determine if the end user has the rights, or is\
    \ authorized, to access your application. In such an environment, you will need\
    \ to get information from your security team about what kinds of checks your application\
    \ will need to implement to make sure it behaves properly within your specific\
    \ environment.\n\n### Client-Side Security Common Sense\nA commonsense approach\
    \ to client-side security will help you to avoid many pitfalls. With that in mind,\
    \ here are some commonsense practices that you should consider following:\n- Try\
    \ to always run your application using the `HTTPS` protocol.\n- If your application\
    \ is running in a secure domain (`HTTPS`), don’t connect your application to unsecured\
    \ services. Make sure that your `REST` calls are also going to `HTTPS` domains\
    \ and that your `WebSocket` calls are using `wss` instead of `ws` (see “WebSocket\
    \ Security” later in the chapter).\n- If at all possible, don’t allow `<script>`\
    \ elements in your HTML files. Place your JavaScript in external files and reference\
    \ them.\n- If you are using a JavaScript framework, check to see what kind of\
    \ help it provides with common security issues, and use those features.\n- Finally,\
    \ take the time to research which security measures your specific application\
    \ requires. You’ll find that there is a lot of application security information\
    \ available, and it’s growing rapidly.\n\n### Server-Side Security\nThis section\
    \ explains the key concepts of server-side security: authentication, authorization,\
    \ confidentiality, and data integrity.\n\n- **Authentication**: validates the\
    \ identity of a client. It determines whether the client is, in fact, really it\
    \ is claiming to be. It usually involves receiving a request from a client that\
    \ includes user ID and credentials. The servlet container in a Java EE server\
    \ provides mechanisms to leverage standard protocols and validate the credentials.\n\
    - **Authorization**: ensures that the authenticated client has appropriate rights\
    \ to access the requested resource. This allows the server to check if the user\
    \ can invoke certain operations on your service. The servlet container typically\
    \ defines the operations that can be performed.\n- **Confidentiality**: ensures\
    \ that only the authorized recipients can access the information. This concept\
    \ is similar to authorization, the key difference being that while authorization\
    \ prevents the information from reaching unintended parties, confidentiality ensures\
    \ that even if the information reach unintended parties, it cannot be viewed or\
    \ used.\n- **Data integrity**: ensures that the information has not changed while\
    \ in transit between the client and server. A hashcode, or signature of the data\
    \ is sent along with the data and confirmed on the receiving side.\n\nLet’s take\
    \ a look at how these concepts can be realized in a Java container.\n\n#### Authentication\n\
    There are different ways to achieve authentication; the first two listed next\
    \ are from `RFC 2617` draft standard:\n\n##### Basic Authentication\nThis is the\
    \ simplest method of authentication over HTTP. The client, most often a web browser,\
    \ opens a login box prompting the user to enter a username and password. The `client`\
    \ sends a base64-encoded username and password to the service. The server then\
    \ checks if the user account exists and verifies the sent password. If the username\
    \ and password match those of the account, then the resource is made available;\
    \ otherwise, an HTTP 401 response code is returned to the client, informing the\
    \ client that it is not authorized to access the resource.\n\nUnder the covers,\
    \ the client generates an HTTP `Authorization` header set to a base64-encoded\
    \ string of the username, a colon, and the password. The authorization method\
    \ and a space (that is, “Basic ” is added before this encoded string. If your\
    \ username is `u1` and your password is `p1`, then the header will look like this:\
    \ ![image](images/00131.jpg)\n\nUsing `Basic Authentication` with `HTTPS` is highly\
    \ recommended because otherwise the username and password can be easily decoded.\n\
    \n##### Digest Authentication\nOne of the limitations of Basic Authentication\
    \ is that the password is sent in clear text and is susceptible to man-in-middle\
    \ attacks. `Digest Authentication`, which is an encrypted HTTP connection, solves\
    \ this problem. `Digest Authentication` communicates credentials in an encrypted\
    \ form by applying a hash function to the username, the password, a server-supplied\
    \ `nonce` value, the HTTP method, and the requested URI. For your username and\
    \ password, the `Authorization` header looks like this: ![image](images/00132.jpg)\n\
    \nMany of the security options in `Digest Authentication` are optional so the\
    \ server may operate in a security-reduced mode. Even though it is slightly better\
    \ than Basic Authentication, it is still not intended to replace stronger authentication\
    \ protocols, like `client-cert`. Like Basic Authentication, `Digest Authentication`\
    \ is also susceptible to man-in-middle attacks. These types of attacks can be\
    \ avoided by using `HTTPS` instead of HTTP.\n\n##### Form-based Authentication\n\
    Form-based authentication allows customization of the login screen and error pages\
    \ that are presented to the client. The contents of an HTML page for a login page\
    \ should be coded as follows: ![image](images/00133.jpg)\n\nThe login form must\
    \ contain fields for entering a username and a password. These fields must be\
    \ named `j_username` and `j_password`, respectively. The action of the login form\
    \ must be `j_security_check`.\n\nThe `client` is asked to enter the username and\
    \ password and then click the Submit button, which submits the form to the server.\
    \ If the authentication succeeds, the client is redirected to the requested resource.\
    \ If the authentication fails, the error page is returned, which typically contains\
    \ information about the failure. ![image](images/00007.jpg)\n\n##### Client-Cert\
    \ Authentication\n`HTTPS` not only provides a secure connection to the server\
    \ but also can be used for authentication. This mechanism requires the `client`\
    \ to possess a public key certificate (`PKC`) issued by a trusted organization,\
    \ called a certificate authority. The `PKC` provides identification for the bearer.\
    \ The server authenticates the `client` using this `PKC`.\n\nThe only disadvantage\
    \ of this approach is the managing of the certificates themselves on both the\
    \ client and server. Otherwise, this method is more secure than both `Basic Authentication`\
    \ and form-based authentication.\n\nAll of these authentication mechanisms can\
    \ be configured using the deployment descriptor (`web.xml`) of your application,\
    \ as shown in [Listing 6-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos354745).![image](images/00016.jpg)\n\
    Listing 6-6 Deployment Descriptor Example![image](images/00012.jpg)![image](images/00134.jpg)\n\
    \nAs you can see in [Listing 6-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_014.html_filepos354745),\
    \ the deployment descriptor has three main elements:\n- The `<security-constraint>`\
    \ element is used to associate security constraints with one or more web resource\
    \ collections. It has the following subelements:\n    - `<web-resource-collection>`\
    \ Identifies a subset of the resources and HTTP methods on those resources within\
    \ a web application to which a security constraint applies. For example, in [Listing\
    \ 6-6], the security constraints are defined for the HTTP GET method on the resource\
    \ accessible at `/webresources/authors`. Wildcards can be used to specify URL\
    \ patterns, such as:\n"
