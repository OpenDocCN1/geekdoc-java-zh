    the `Model` object when [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246027)
    is discussed a bit later.    ![image](images/00007.jpg)   `self.Books(mappedBooks);`
    This final line sets the value of the predefined observableArray `self.Books`
    to contain the collection of `Model` objects. You will see how this object is
    used when you bind the ViewModel to the View layer.The Model represents one instance
    of your data. It’s easiest to think of this as a single record in your database,
    or a single row of a table. In [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246027)
    you can see that each field in your Model is assigned to a Knockout observable
    variable. This lets you take advantage of the two-way binding that Knockout.js
    is known for. Two-way binding means that when the value of an observable or observableArray
    is changed, either programmatically or from end-user data entry, the Knockout
    libraries automatically update all of the elements that are bound to it. You do
    not have to worry about setting up listeners for every variable that is used in
    your View layer. (This will become clearer when you get to the discussion of the
    View layer a little later in the chapter.) In the last line of the Model, you
    will notice that you not only assign each field from the data set, but you can
    also define your own variables that will be used in your View layer. In the example
    application, the book cover photos are provided already and are named after the
    ISBN code for each book. In [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246027),
    you can see that the variable `this.coverImage` is being assigned to the value
    of `bookData.isbn` so that it can be used later to load that specific image in
    the HTML code.![image](images/00016.jpg)Listing 5-5   Example Model![image](images/00012.jpg)![image](images/00086.jpg)Now
    that you have your Model and ViewModel created, there is one last piece to the
    puzzle. [Listing 5-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246828)
    shows the HTML code for the View layer. This is included in the `main.html` file
    of your project.![image](images/00016.jpg)Listing 5-6   View Example![image](images/00012.jpg)![image](images/00087.jpg)Let’s
    break down this code example:    ![image](images/00007.jpg)   `<article id="bookInfo">`
    This element represents a simple semantic element that helps define the structure
    of the larger page. However, the id attribute is important because it is what
    will be used by the Knockout.js `applyBindings()` method to bind this section
    of the HTML View to the ViewModel that you created previously.    ![image](images/00007.jpg)   `<div
    class="item active" data-bind="foreach: Books ">` This line is the beginning of
    the list of books that will be rendered. This <div> will contain the layout and
    styling for one Model. If this were a table, this would be the layout and styling
    for one row of data. The key attribute is `data-bind`. This uses the Knockout
    `foreach`: binding to render everything contained inside this <div> for each item
    that is in the object “Books.” Recall from the discussion about [Listing 5-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos239020)
    that you set the value of Books to the array of Models returned from the REST
    call.    ![image](images/00007.jpg)   `<div id="bookCoverPhoto" class="bookCoverPhoto
    col-md-3" data-bind="click: getBookDetails">` This <div> is the container for
    the book cover image and its caption. It has a Knockout `click:` binding bound
    to it so that you can drill down in your page to get more details about this specific
    book. You will see more about getting and displaying the book details a little
    later, as this details page will be used for the update and delete actions of
    your CRUD application.    ![image](images/00007.jpg)   The next three lines set
    up the contents that will be displayed for each book. The cover image, the caption,
    and the ISBN for each book are bound to their own HTML elements. There are two
    items of note in this code:        ![image](images/00007.jpg)   `data-bind="attr:
    {src: ''img/''+coverImage()+''.jpg''}"` In this `data-bind` attribute, the Knockout
    observable `coverImage` is being called as a method instead of just referencing
    the variable as you have seen done in all of the previous bindings so far. You
    do this when you want to get the actual value of the variable and not a reference
    to the function that Knockout uses for the two-way binding. This breaks the two-way
    binding for this reference, but in some cases, that is fine. In this case, you
    are just using the variable to dynamically get the name of the `coverImage` file.
    You do not plan on changing this name in other parts of your code, so you don’t
    need to have it set up as a two-way binding. You will see a better example of
    why you would do this later in the chapter, when you get to the Update section
    of the code.        ![image](images/00007.jpg)   `class="hidden" data-bind="text:
    isbn">` In this code line, the value is being bound to the ISBN value for this
    particular book. You don’t actually need to use this value as part of the current
    View, but you do need this value when you get the details for this book. By setting
    the CSS style `class` to `"hidden"`, the actual <div> is not rendered, but the
    ISBN value will be available as part of the data that Knockout passes to the function
    as part of the `click:` binding.The final result of putting all of the code from
    [Listing 5-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos236478) through
    [Listing 5-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246828) together
    will look like [Figure 5-1](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos252382)
    when you run it in a browser.![image](images/00012.jpg)![image](images/00088.jpg)![image](images/00012.jpg)FIGURE
    5-1.   List of all booksCreate, Using the POST Request (C of CRUD)Now that you
    know how to do the most common task, reading data, with a REST service, you will
    learn how to add a new record to your data service.For this example, you will
    be adding a new book to the database. You will use the same REST API that you
    used for reading the list of books, `/books`; however, the request type that you
    use will be a POST request instead of the GET request that you used previously.
    [Listing 5-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos253717) shows
    the code for making this POST request.![image](images/00016.jpg)Listing 5-7   Example
    of AJAX POST Call![image](images/00012.jpg)![image](images/00089.jpg)Let’s walk
    through the code:    ![image](images/00007.jpg)   `$.ajax({,` This is the jQuery
    method for implementing an asynchronous HTTP request (AJAX).    ![image](images/00007.jpg)   `url:
    serviceRootURL + "/books",` This line sets the URL that you will make the REST
    call to.    ![image](images/00007.jpg)   `type: ''POST'',` This line sets the
    request type to POST. This tells the REST service that you want to add this new
    data to the database.    ![image](images/00007.jpg)   `data: JSON.stringify(json),`
    The data that you will pass into the request is going to come from a form, which
    you’ll learn how to create in a little while. Since the REST service is expecting
    to receive data as a JSON object, you will use the utility method `.stringify()`provided
    by the JSON object to convert the JavaScript object into a valid JSON object.    ![image](images/00007.jpg)   `dataType:
    ''json'',` This is the type of data that you are expecting back from the server
    in response to this request.    ![image](images/00007.jpg)   `contentType: ''application/json'',`
    This tells the server what type of data you are sending to it in this request.    ![image](images/00007.jpg)   `success:`
    This is the callback function that is used if the request is successful.    ![image](images/00007.jpg)   `error:`
    This the callback function that is used if the request fails.'
