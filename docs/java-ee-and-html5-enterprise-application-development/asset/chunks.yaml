- fmt: "\nYou’ll notice that the callback function only works against a successful\
    \ request. If you need to do error handling, you will want to use the full syntax\
    \ similar to what is shown in [Listing 5-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos253717)\
    \ later in the chapter.\n\nYou’ll also notice that the URL in this example is\
    \ being set using a variable, `self.serviceURL`, instead of a string for the URL\
    \ itself. This is because this line is actually part of a larger function called\
    \ a `ViewModel`. This is part of the Knockout.js Model-View-ViewModel (MVVM) architectural\
    \ pattern that you read about in [Chapter 1](CR%21HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_009.html_filepos34897).\
    \ [Listing 5-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos239020)\
    \ shows the full `ViewModel` code.\n\n![image](images/00016.jpg)\nListing 5-4\
    \ Example ViewModel\n![image](images/00012.jpg)\n![image](images/00084.jpg)\n\n\
    ### Let’s walk through what each line provides:\n\n![image](images/00007.jpg)\n\
    \n```javascript\nfunction booksViewModel() { var self = this;\n```\nThe current\
    \ object in JavaScript is often referenced by a pseudo variable called `this`.\
    \ The major problem with always using `this` to reference variables in a function\
    \ is that the scope of `this` can change depending on how the function is called.\
    \ You want to bind a local variable to the current `this` object so that the same\
    \ object can still be referenced no matter how the function is called later in\
    \ your code.\n\n![image](images/00007.jpg)\n\n```javascript\nself.serviceURL =\
    \ serviceRootURL + \"/books\";\n```\nThis line sets up the URL that will be used\
    \ to make the actual REST API call. Since all of the REST API calls have the same\
    \ hostname and application path, a global variable has been set to contain the\
    \ part of the URL that is always the same. One thing to keep in mind while working\
    \ with REST service calls in development mode is that the hostname may vary as\
    \ you test your code from different devices. For example, using “localhost” as\
    \ the hostname will work fine for any browser that you would use to connect to\
    \ the REST service that you have running on the same machine. However, if you\
    \ were to try to test your code from, say, a tablet and connect to the IP address\
    \ of your development machine, the JavaScript call to “localhost” would fail.\
    \ For this reason, you will see at the top of the same application code that the\
    \ `serviceHostname` variable is being set to `serviceHostname = window.location.hostname;`\
    \ and the final `serviceRootURL` variable is created using this dynamic value.\n\
    \n![image](images/00085.jpg) ![image](images/00007.jpg)\n\n```javascript\nself.Books\
    \ = ko.observableArray([]);\n```\nThis shows your first use of a Knockout.js method.\
    \ You are assigning the variable `self.Books` to a Knockout `observableArray`\
    \ and initializing it with an empty array. The use of Knockout observables and\
    \ `observableArrays` is the key to setting up two-way binding between the data\
    \ at the Model layer of your MVVM architecture and the View layer. You’ll see\
    \ a bit later in this chapter how this `observableArray` is used.\n\n![image](images/00007.jpg)\n\
    \n```javascript\n$.getJSON(self.serviceURL, function(data) {\n```\nThis line was\
    \ already presented in [Listing 5-3](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos236478)\
    \ and discussed thereafter, but the variables should make a little more sense\
    \ at this point. The callback function is processed when a successful request\
    \ is returned. The `data` object contains the data that is returned from the server\
    \ as part of the `response` object. Because you are using `$.getJSON()`, the data\
    \ returned is a JSON object.\n\n![image](images/00007.jpg)\n\n```javascript\n\
    var mappedBooks = $.map(data, function(item) {\n```\nThis line is using the jQuery\
    \ `.map()` utility method to take each top-level element in the returned JSON\
    \ object and add it to an array. Each item is created as a new `bookModel` object\
    \ before it is returned from the `.map()` method.\n\n![image](images/00007.jpg)\n\
    \n```javascript\nreturn new bookModel(item);\n```\nIn the end, you have an array\
    \ that contains a collection of models. You’ll find out more about the `Model`\
    \ object when [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos246027)\
    \ is discussed a bit later.\n\n![image](images/00007.jpg)\n\n```javascript\nself.Books(mappedBooks);\n\
    ```\nThis final line sets the value of the predefined `observableArray` `self.Books`\
    \ to contain the collection of `Model` objects. You will see how this object is\
    \ used when you bind the `ViewModel` to the View layer.\n\n### The Model\nThe\
    \ Model represents one instance of your data. It’s easiest to think of this as\
    \ a single record in your database, or a single row of a table. In [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos46027)\
    \ you can see that each field in your Model is assigned to a Knockout variable.\
    \ This lets you take advantage of the two-way binding that Knockout.js is known\
    \ for. Two-way binding means that when the value of an `observableArray` is changed,\
    \ either programmatically or from end-user entry, the Knockout libraries automatically\
    \ update all of the elements that are bound to it. You do not have to worry about\
    \ setting up listeners for every variable that is used in your View layer (This\
    \ will become clearer when you get to the discussion of the View layer later.).\n\
    \nIn the last line of the Model, you will notice that you not only assign each\
    \ field from the data but can also define your own variables that will be used\
    \ in your View layer. In the example, the book cover photos are provided already\
    \ and are named after the ISBN code for each book. In [Listing 5-5](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos46027),\
    \ you can see that the variable `this.coverImage` is being assigned to the value\
    \ of `bookData.isbn` so that it can be used later to load that specific image\
    \ in the HTML code.\n\n![image](images/00016.jpg)\nListing 5-5 Example Model\n\
    ![image](images/00012.jpg)\n![image](images/00086.jpg)\n\n### The View\nNow that\
    \ you have your Model and ViewModel created, there is one last piece to the puzzle.\
    \ [Listing 5-6](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos2628) shows\
    \ the HTML code for the View layer. This is included in the `main.html` file of\
    \ your project.\n\n![image](images/00016.jpg)\nListing 5-6 Example\n![image](images/00012.jpg)\n\
    ![image](images/00087.jpg)\n\nLet’s break down this code:\n\n![image](images/00007.jpg)\n\
    \n```html\n<article id=\"bookInfo\">\n```\nThis element represents a simple semantic\
    \ element that helps define the structure of the larger page. However, the `id`\
    \ attribute is important because it is what will be used by the Knockout.js `applyBindings()`\
    \ method to bind this section of the HTML View to the ViewModel that you created.\n\
    \n![image](images/00007.jpg)\n\n```html\n<div class=\"item active\" data-bind=\"\
    foreach: Books \">\n```\nThis line is the beginning of the list of books that\
    \ will be rendered. This `div` will contain the layout and styling for one Model.\
    \ If this were a table, this would be the layout and styling for one row of data.\
    \ The key attribute is `data-bind`. This uses the Knockout `foreach:` binding\
    \ to render everything inside this `div` for each item that is in the object “Books.”\
    \ Recall from the discussion about [Listing 5-4](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos239020)\
    \ that you set the value of Books to the array of Models returned from the REST\
    \ call.\n\n![image](images/00007.jpg)\n\n```html\n<div id=\"bookCoverPhoto\" class=\"\
    bookCoverPhoto col-md-3\" data-bind=\"click: getBookDetails\">\n```\nThis `div`\
    \ is the container for the book cover image and its caption. It has a Knockout\
    \ `click:` binding bound to it so that you can drill down in your page to get\
    \ more details about this specific book. You will see more about getting and displaying\
    \ the book details a little later, as this details page will be used for the update\
    \ and delete actions of your CRUD application.\n\n![image](images/00007.jpg)\n\
    \nThe next three lines set up the contents that will be displayed for each book.\
    \ The cover image, the caption, and the ISBN for each book are bound to their\
    \ own HTML elements. There are two items of note in this code:\n\n![image](images/00007.jpg)\n\
    \n```html\ndata-bind=\"attr: {src: 'img/'+coverImage()+'.jpg'}\"\n```\nIn this\
    \ `data-bind` आयु, the Knockout observable `coverImage` is being called as a method\
    \ instead of just referencing the variable as you have seen done in all of the\
    \ previous bindings so far. You do this when you want to get the actual value\
    \ of the variable and not a reference to the function that Knockout uses for the\
    \ two-way binding. This breaks the two-way binding for this reference, but in\
    \ some cases, that is fine. In this case, you are just using the variable to dynamically\
    \ get the name of the `coverImage` file. You do not plan on changing this name\
    \ in other parts of your code, so you don’t need to have it set up as two-way\
    \ binding.\n\n![image](images/00007.jpg)\n\n```html\nclass=\"hidden\" data-bind>\n\
    ```\nThis `class` is `\"hidden\" data-bind`... wait, the text says: This `class`\
