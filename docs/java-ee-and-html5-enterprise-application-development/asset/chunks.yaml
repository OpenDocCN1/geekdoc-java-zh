    The HTML code shown in [Listing 5-8](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos258081)
    includes a Knockout `click:` binding that displays the dialog in which to enter
    the information about the new book that you want to add to the database.![image](images/00016.jpg)


    Listing 5-8 click: Binding to Show New Book Dialog!![image](images/00012.jpg)![image](images/00090.jpg)


    This code is straightforward. The Knockout `click:` binding is calling a function
    called `showAddDialog()`. This function is using the modal dialog functionality
    provided by the Twitter Bootstrap framework (with which you initially created
    the project) to display a modal dialog. This dialog contains the form that gathers
    the details for new books being added to the database. [Listing 5-9](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos259431)
    shows the HTML for the dialog. The one line of code that displays the modal dialog
    is![image](images/00016.jpg)![image](images/00091.jpg)![image](images/00016.jpg)


    Listing 5-9 New Book Modal Dialog with Form!![image](images/00012.jpg)![image](images/00092.jpg)![image](images/00093.jpg)![image](images/00094.jpg)


    This is a really large piece of code, but almost all of it is just HTML layout
    and styling. Let’s discuss the lines that provide the functionality:![image](images/00007.jpg)


    ```html

    <form class="form-horizontal" data-bind="submit: addBook">

    ```


    This is the Knockout `submit:` binding that tells Knockout to pass all of the
    form elements to the `addBook` function when a submit is performed.![image](images/00007.jpg)


    ```html

    <button class="btn btn-primary" type="submit">Save</button>

    ```


    By setting the `type` attribute of this button to `"submit"`, it will fire the
    submit event when it’s clicked, causing the initial `submit:` binding to be invoked.
    When the form is submitted, it will call back to the `addBook` function that contains
    the REST call that you reviewed previously. The only thing not shown in the previous
    example is how the data was formatted into the JSON object that was passed as
    part of the request. [Listing 5-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos261951)
    shows you how the JSON data is created using the form elements passed in by the
    Knockout `submit:` binding.![image](images/00016.jpg)


    Listing 5-10 Example Parsing Form Data to JSON Object!![image](images/00012.jpg)![image](images/00095.jpg)


    The data passed into the `addBook()` function contains an array of the HTML elements,
    and you will assign the value, from those elements that you need, to the fields
    that are expected by the REST service. In this case, the array includes the five
    fields shown in [Listing 5-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos261951).
    When you are sending data to the REST service, you have to know in which format
    each field is expecting its value to be sent. For example, when the `publishedDate`
    field is being set, the REST service expects a `Date` to be sent for this field,
    so you will need to transform the data from the form into the appropriate format.


    Data validation can be done in two ways at this point. You can use built-in validation
    functionality from the client-side frameworks, such as Twitter Bootstrap, to make
    sure that the data entered into the form is in the proper formats before the submit
    event is fired, and/or you can perform validation on the data as you are assigning
    it to the JSON object. The sample application provided doesn’t perform any client-side
    validation. It does, however, provide a hint on the Published Date form field
    to help the end user know which format is expected for this field:![image](images/00016.jpg)![image](images/00096.jpg)


    Knowing which specific HTML element contains the data that you want to assign
    to a specific field in your JSON object may be tricky if you have also included
    elements in your form that you don’t want to use. NetBeans IDE provides a JavaScript
    debugger that is very useful for determining what is what in the data object returned
    to the function. [Figure 5-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos265291)
    shows an example of how the debugger can be used to determine which elements you
    need to use to achieve the code shown in [Listing 5-10](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos261951).
    Clicking in the left-hand gutter of your JavaScript file will place a breakpoint
    on that line, as shown for line 141 in [Figure 5-2](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos265291).
    When the form is submitted in the browser, the IDE will stop at this line. You
    can hover over the `data` variable to see the value of it in the tooltip. Expanding
    it will show each of the elements in the data object and their values. Of course,
    you can also see this debugger information in the Variables window at the bottom
    of the IDE if you don’t want to use the tooltip.![image](images/00012.jpg)![image](images/00097.jpg)![image](images/00012.jpg)


    ### Figure 5-2 NetBeans JavaScript debugger


    Now that you have submitted the request to add the book to the REST service, you
    want to finish any changes to the View layer that may be affected by the result
    of the POST request. Taking another look at [Listing 5-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos253717),
    you will see the two callback functions for success and error. If there is an
    error, you should do something to inform the end user that the request didn’t
    work. In this example, an `alert` is called with the error status and any text
    that the REST service returned as a result of the error:![image](images/00016.jpg)![image](images/00098.jpg)


    In the case where the request is successful, you will want to add the same JSON
    data you sent to the server to the existing Knockout observableArray that your
    View is bound to. In [Listing 5-7](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos253717),
    the line of code `booksVM.Books.push(new bookModel(json))` creates a new Model
    object out of the JSON data and then pushes it into the observableArray `booksVM.Books`.
    Because `Books` is a Knockout observableArray, just adding the new Model object
    will cause an event to be fired, and the HTML that bound to the `foreach:` binding
    will automatically update itself.


    ### Update, Using the PUT Request (U of CRUD)


    The process for updating a record is about the same as the process for creating
    a new entry, as covered in the previous section. First you will want to see the
    details for the book you are going to edit. [Listing 5-11](#CR!HG5K0ATPXH3VD7ZTWC7VX97KHV77_split_013.html_filepos267952)
    shows how the HTML is coded to list all of the books in your service.![image](images/00016.jpg)


    Listing 5-11 Example of Knockout foreach: Binding!![image](images/00012.jpg)![image](images/00099.jpg)


    The Knockout binding of `foreach:` is used to display each item in `Books` with
    the same look and feel. `Books` is the Knockout observableArray from your ViewModel.
    The most important element in the HTML code is actually a hidden `div` that contains
    the ISBN for each book. The ISBN is a unique ID for each book, which will allow
    you to make another REST call to get the information about one specific book.
    Notice that each of the `<div id="bookCoverPhoto"` elements for the book’s cover
    image, title, and ISBN has a `click:` binding to the function `getBookDetails()`.
    This function will load the page that shows all the details about a specific book.
