- img_proc: true
  md: '# time


    The compiler option -time gives the total time in milliseconds to compile a Java
    source file with the WEJAC compiler. When HelloWorld.java is compiled with the
    -time option:


    ```

    $wejac -time HelloWorld.java

    Time: 409-ms for: HelloWorld.java

    $

    ```


    # Multiple Compiler Options


    The WEJAC compiler allows the mixing of compiler options, but using only a single
    error reporting option. Consider compiling HelloWorld.java with the WEJAC compiler
    using the -echo -time options:


    ```

    $wejac -echo -time HelloWorld.java


    Java Compile Options: [-g]


    Time: 411-ms for: HelloWorld.java

    Compiler result for file: ''HelloWorld.java'' is: Success.

    $

    ```'
