- img_proc: true
  md: '# Forward


    Why another Java compiler? Simple–for simplicity in use of options and consistency
    in error reporting.


    WEJAC is an acronym for Will''s Elided Java Api Compiler. The name explains the
    compiler purpose; the primary word is ‘elided’ from the word elision, which means
    “to omit or leave out of consideration.” WEJAC omits the dizzying number of options
    for the underlying Java compiler accessed through the Java Compiler API as JSR
    199. The number of options to use WEJAC to compile Java source code is considerably
    simpler than the javac compiler.


    WEJAC also is consistent in error reporting. Some errors such as deprecation with
    the java compiler require re-compilation–yet another compiler option. WEJAC always
    provides an error report, the line and position, and the source code fragment
    to illustrate where the cause of the error is in the overall Java source code.
    Thus error message, location, and illustrative cause.


    The jac compiler has many options and features–and WEJAC provides the option to
    use other javac compiler options. But in general, I have found a simpler option
    set for compiler parameters best. WEJAC is an example of a software development
    engineer wanting a simpler tool, so then implementing, deploying, sharing, and
    here now–documenting it.


    Happy Compiling!


    William Gilreath

    July 2019'
