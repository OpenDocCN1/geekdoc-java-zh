  md: '# Afterword


    The author and creator of WEJAC welcomes comments, questions, bug reports, and
    thoughts from users. Please feel free to e-mail (wfgilreath@yahoo.com) with the
    subject "WEJAC” to connect.


    # Colophon


    The cute animal on the cover is a “Weajack” the Weajack (or more commonly referred
    to as a Fisher), is a small mammal native to North America.


    # Author


    The WEJAC compiler is created and developed by Will or William F. Gilreath. Will
    is a software development engineer, computer scientist, mathematician, writer,
    and poet. Will has been writing code 64 C-BASIC when he was a boy with a Sinclair
    ZX-81, and then moving on to the Commodore 64 C-BASIC, and later GW-BASIC on a
    Tandy 1000EX. Java is a favorite programming language, and Will wanted a simpler
    Java compiler–hence WEJAC.


    Visit Will’s home site:


    https://wgilreath.github.io/WillHome.html


    # Contributing


    WEJAC is an open-source front-end to the javac compiler API. Hence if the reader
    wants to contribute and participate with WEJAC–it is most welcome! Test cases,
    bug fixes, and contributions to the WEJAC source code are encouraged.'
