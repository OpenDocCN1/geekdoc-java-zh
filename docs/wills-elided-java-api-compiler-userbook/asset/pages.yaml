  md: '# hush


    The compiler option -hush "hush" all compiler diagnostics, except for compiler
    errors.

    Other compiler diagnostics such as warnings, notes, and mandatory warnings are
    suppressed.


    When Unchecked.java is compiled with the WEJAC compiler, it generates a deprecation
    warning:


    ```

    $wejac Unchecked.java

    Error: Unchecked.java.

    Unchecked.java uses or overrides a deprecated API.

    ```


    ```

    Error: Unchecked.java.

    Recompile with -Xlint:deprecation for details.

    ```


    When the -hush option is used, and Unchecked.java is compiled with the WEJAC compiler,
    there is no warning:


    ```

    $wejac -hush Unchecked.java

    $

    ```


    # info


    The compiler option -info gives the information about the compiler–such as the
    release, version, copyright, and software license.


    ```

    $wejac -info

    WEJAC - Will''s Elided Java Api Compiler

    (C) Copyright 2019 William F. Gilreath. All Rights Reserved

    Version 1.3 Released July 2019

    ```'
  merge: -1
