  md: '# Installation Steps


    The installation is simply install the wejac shell script, the WEJAC.jar binary
    file, and on macOS/Linux systems the wejac.1 man or manual page.


    +   1. Install wejac shell script.


    On my MacBook, the wejac shell script is installed in the directory: /usr/local/bin/


    In a terminal window wejac is installed by the shell commands:


    ```

    $sudo bash

    Password:

    #cp Downloads/wejac /usr/local/bin

    ```


    +   2. Install the WEJAC.jar file.


    On my MacBook, the WEJAC.jar file is in the directory: /usr/local/lib/


    In a terminal window WEJAC.jar is installed by the shell commands:


    ```

    $sudo bash

    Password:

    #cp Downloads/WEJAC.jar /usr/local/lib

    ```


    +   3. For Linux/macOS systems, install the manual page.


    On my MacBook, the wejac.1 man page is in the directory: /usr/local/share/man/man1/


    In a terminal window wejac.1 is installed by the shell commands:


    ```

    $sudo bash

    Password:

    #cp Downloads/wejac.1 /usr/local/share/man/man1

    ```'
