  md: "# javac\n\nThe compiler option -javac allows a Java compiler option to be passed\
    \ to the underlying Java compiler.\n\nWhen Unchecked.java is compiled with the\
    \ WEJAC compiler, it generates a deprecation warning:\n\n```\n$wejac Unchecked.java\n\
    Error: Unchecked.java.\nUnchecked.java uses or overrides a deprecated API.\n```\n\
    \n```\nError: Unchecked.java.\nRecompile with -Xlint:deprecation for details.\n\
    ```\n\nWhen Unchecked.java is compiled with the WEJAC compiler and the -javac\
    \ option of -Xlint:deprecation is used the details are given of the deprecation\
    \ warning:\n\n```\n$wejac -javac -Xlint:deprecation Unchecked.java\nError: Unchecked.java.\n\
    Line 29 At 18: [deprecation] Date(int,int,int) in java.util.Date has been deprecated\n\
    \      Date d = new Date(86, 04, 05);      // May 5, 1986\n                  \
    \             ^\n```\n\n# mute\n\nThe compiler option -mute suppresses or “mutes”\
    \ all compiler diagnostic messages of the WEJAC compiler. When HelloWorldBad.java\
    \ is compiled with the -mute option:\n\n```\n$wejac -mute HelloWorldBad.java\n\
    $\n```"
