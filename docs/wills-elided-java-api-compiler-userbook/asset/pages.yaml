  md: '# Chapter 2. Compiler Parameters


    WEJAC is designed to have fewer command-line options to use with the compilation
    of Java source files. These options are organized into different kinds of options
    used with the WEJAC tool. Overall there are only nine options for the WEJAC compiler.


    # Kinds of Parameters


    WEJAC has four kinds of options:


    +   1. Compilation

    2. Error Reporting

    3. Help or Information

    4. javac


    # Compilation


    The options for compilation are for the compilation of Java source files. The
    compiler options are:


    +   1. -echo - Print Java compiler options and success or failure.

    2. -final - Compile final release without debug information.

    3. -time - Print total time for success compiling of a source file.


    # Error Reporting


    The options for error reporting when compiling Java source files. The error reporting
    options are:


    +   1. -brief - Print only a brief count of compiler messages.

    2. -hush - Disable all compiler messages except errors.

    3. -mute - Disable all compiler messages.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Help or Information


    The options for help listing the options or information about the WEJAC Java compiler.

    There are two options but with different parameters:


    +   1. -help – Print list of compiler options and exit.

    2. -info – Print compiler version information and exit.


    # javac Parameters


    The javac option specifies the following parameter is a standard Java compiler
    option that is passed to the WEJAC compiler as-is. This allows the flexibility
    of using a javac compiler option without having to check or add the javac option
    to WEJAC.'
