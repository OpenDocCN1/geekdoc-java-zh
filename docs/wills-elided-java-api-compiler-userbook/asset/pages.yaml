  md: '# Chapter 1. Compiler Installation


    WEJAC is written in Java, and compiled into a .jar file. Thus the compiler is
    “bootstrapped” in the programming language it compiles using the Java Compiler
    API. Thus any platform (Windows/Linux/macOS) can download, install, configure,
    and use WEJAC.


    WEJAC consists of the binary bytecode executable file as a JAR file (a Java Archive
    file) and a wrapper “kicker” script or batch file that executes the JAR file on
    the Java Virtual Machine (JVM), passing the command-line arguments to the Java
    Virtual Machine.


    # Pre-Installation Steps


    +   1. Checking for the OpenJDK


    In order to use the WEJAC compiler, first the system must have the OpenJDK installed.
    There are many OpenJDK downloads from different vendors. The simplest way is to
    open a console or terminal window, and enter the following command:


    ```

    $java -version

    ```


    If the OpenJDK and Java environment are installed the result is:


    ```

    $java -version

    java version "12.0.1" 2019-04-16

    Java(TM) SE Runtime Environment (build 12.0.1+12)

    Java HotSpot(TM) 64-Bit Server VM (build 12.0.1+12, mixed mode, sharing)

    ```


    If not, download and install the OpenJDK on your system.


    The WEJAC compiler runs on the JDK 7 and upwards to (currently at the time of
    writing) JDK 12. Thus it is vital to install a compatible OpenJDK Java environment.
    Check the Java release version is compatible, greater than or equal to Java release
    version 1.7.x.'
