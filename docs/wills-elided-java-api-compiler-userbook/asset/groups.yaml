    # Chapter 3. Compiler Options


    This chapter contains a list of all WEJAC compiler options with a short example
    to illustrate with the compiler option does in practice.


    # brief


    The -brief compiler option specifies a brief, or a summary of the number of error
    diagnostics.


    ```

    wejac -brief HelloWorld.java

    1 Diagnostic messages:

    1 Error

    ```


    # echo


    The -echo compiler option specifies the compiler "echo" the jacav compiler parameters
    passed, and the final result of compiling a Java source file.


    When HelloWorld.java is compiled using the WEJAC compiler with the -echo option:


    ```

    wejac -echo HelloWorld.java


    Java Compile Options: [-g]


    Compiler result for file: ''HelloWorld.java'' is: Success.

    ```


    When HelloWorldBad.java is compiled using the WEJAC compiler with the -echo option:


    ```

    $wejac -echo HelloWorldBad.java


    Java Compile Options: [-g]


    Error: HelloWorldBad.java.

    Line 4 At 24: unclosed string literal

    System.out.println("Hello, World!!!");


    ```


    Compiler result for file: ''HelloWorldBad.java'' is: Failure!'
  - '[PAGE 13]


    # final


    The -final compiler option specifies a non-debug, final release compile of the
    Java source file. Using the -echo compiler option, the javac compiler parameter
    is shown.


    When HelloWorld.java is compiled using the WEJAC compiler with the -final option:


    ```

    $wejac -echo -final HelloWorld.java

    ```


    Java Compile Options: [-g:none]


    Compiler result for file: ''HelloWorld.java'' is Success.


    # help


    The compiler option -help prints the helpful information of the various command-line
    options to the WEJAC Java compiler, and exits without compiling.


    ```

    $wejac -help

    Usage: wejac (option)* [ -javac (javac-options)+ ] (java-file)+ | ( -help |info
    )

    WEJAC OPTIONS:

    Compiler Options: [ -echo ] | [ -final ] | [ -time ]

    -echo Print Java compiler options and success or failure.

    -final Compile final release without debug information.

    -time Print total time for success compiling of a source file.

    ```


    Error Reporting Option: [ -brief | -hush | -mute ]


    ```

    -brief Print only a brief of compiler messages.

    -hush Disable all compiler messages except errors.

    -mute Disable all compiler messages.

    ```


    Help or Version: [ -help | ? ] | ( -info | -v )


    ```

    -help Print list of compiler options and exit.

    -info Print compiler version information and exit.

    ```


    Note: All options for -javac are passed as-is to the compiler.'
