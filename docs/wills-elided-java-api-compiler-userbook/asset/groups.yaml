    ```\n\n## info\n\nThe compiler option -info gives the information about the compiler–such\
    \ as the release, version, copyright, and software license.\n\n```\n$wejac -info\n\
    WEJAC - Will's Elided Java Api Compiler\n(C) Copyright 2019 William F. Gilreath.\
    \ All Rights Reserved\nVersion 1.3 Released July 2019\n```\n\n## javac\n\nThe\
    \ compiler option -javac allows a Java compiler option to be passed to the underlying\
    \ Java compiler.\n\nWhen Unchecked.java is compiled with the WEJAC compiler, it\
