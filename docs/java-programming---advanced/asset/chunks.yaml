    BREAK AS A FORMAT OF GOTO


    The break statement can be used to create a civilized version of the goto statements.
    It is also useful with loops and switch statements. Java doesn''t have a goto
    clause because it allows you to branch in an unstructured and arbitrary way. This
    makes it difficult to understand and maintain goto-ridden Java code. This also
    prevents some compiler optimizations. However, there are a few instances where
    the goto can be useful and legal for flow control. The goto is useful in situations
    where you need to exit from a complex set of loops. Java provides an extended
    form of the break statement to handle these situations. This form of break allows
    you to break out of a block of code. These blocks do not have to be in a loop. They
    can be any type of block.


    CONTINUE


    Sometimes, it can be useful to force an earlier iteration of the loop. This means
    that you may want to keep running the loop, but not process the rest of the code
    within its body. This is essentially a geto that goes just beyond the body of
    the loop to the end. This is accomplished by the continue statement. A continue
    statement allows control to be transferred to the conditional expression controlling
    the loop in while and do-while loops. For loops have control transferred to the
    conditional expression and the iteration section of the for statement. Any intermediate
    code is ignored for all three loops.


