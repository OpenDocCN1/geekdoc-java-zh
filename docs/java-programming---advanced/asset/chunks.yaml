  trans: "\n\n# 使用 BREAK 退出循环\n\n`break` 可用于强制终止循环。它会跳过条件表达式以及循环体中剩余任何代码。如果在循环内部发现\
    \ `break` 语句，它将终止循环，程序控制将恢复到循环后的下一条语句。这里有一个示例：\n\n```java\n// Use break to exit\
    \ a loop.\nclass BreakLoop {\n    public static void main(String args[]) {\n \
    \       for (int i = 0; i < 100; i++) {\n            if (i == 10) break; // 如果\
    \ i 等于 10 则终止循环。\n            System.out.println(\"i: \" + i);\n        }\n  \
    \      System.out.println(\"Loop complete.\");\n    }\n}\n```\n\n## 作为 GOTO 形式的\
    \ BREAK\n\n`break` 语句可以用于创建 `goto` 语句的“文明版本”。它在循环和 `switch` 语句中也很有用。Java 没有 `goto`\
    \ 子句，因为它允许你以一种无结构化且任意的方式进行分支。这使得理解和维护充满 `goto` 的 Java 代码变得困难。这同时也阻止了某些编译器的优化。然而，在某些情况下，`goto`\
    \ 对于流程控制是有用且合法的。当你需要退出一组复杂的循环时，`goto` 是很有用的。Java 提供了扩展形式的 `break` 语句来处理这些情况。这种形式的\
    \ `break` 允许你跳出一个代码块。这些块不需要必须在循环中，它们可以是任何类型的块。\n\n## CONTINUE\n\n有时候，强制提前进行循环迭代是很有用的。这意味着你可能希望继续运行循环，但不处理循环体内的其余代码。这本质上是一个直接跳到循环体末尾的\
    \ `goto`。这是通过 `continue` 语句实现的。`continue` 语句允许控制转移到 `while` 和 `do-while` 循环中控制循环的条件表达式。`for`\
    \ 循环控制转移到 `for` 语句的条件表达式和迭代部分。对于这三种循环，任何中间代码都会被忽略。\n\n# 第 5 章：继承\n\n## 继承\n\n\
    ### 基础\n\n你可以仅通过使用 `extends` 关键字将一个类的定义包含在另一个类中来继承一个类。让我们来看一个简单的示例来展示如何操作。这个程序创建了一个父类\
    \ `A` 和子类 `B`。你可以看到如何使用 `extends` 关键字来为 `A` 创建子类。\n\n```java\n// An example of\
    \ inheritance.\n// Create a Superclass.\nclass A {\n    int i, j;\n    void showij()\
    \ {\n        System.out.println(\"i and j: \" + i + \" \" + j);\n    }\n}\n\n\
    // 通过扩展类 A 创建 A 的子类。\nclass B extends A {\n    int k;\n    void showk() {\n  \
    \      System.out.println(\"k: \" + k);\n    }\n    void sum() {\n        System.out.println(\"\
    i+j+k: \" + (i + j + k));\n    }\n}\n```\n\n### 成员访问与继承\n\n子类可以访问其父类的所有成员，尽管它包含了整个父类。然而，被声明为\
    \ `private` 的父类成员无法被子类访问。考虑以下类层次结构示例：\n\n私有成员不包含在类层次结构中。它们在各自的类中是私有的。这个程序有一个错误。请编译。\n\
    \n```java\n/*\n// Create a Superclass.\nclass A {\n    int i; // 默认 public\n \
    \   private int j; // private A\n    void setij(int x, int y) {\n        i = x;\n\
    \        j = y;\n    }\n}\n\n// A 的 j 在这里不可用。\nclass B extends A {\n    int total;\n\
    \    void sum() {\n        total = i + j; // 错误 j 在这里不可用\n    }\n}\n\nclass Access\
    \ {\n    public static void main(String args[]) {\n        B subOb = new B();\n\
    \        subOb.setij(10, 12);\n        subOb.sum();\n        System.out.println(\"\
    Total is \" + subOb.total);\n    }\n}\n```\n\n### 父类变量可以引用子类对象\n\n任何派自父类的子类都可以拥有父类中引用变量的引用。继承的这一方面在许多情况下非常有用。考虑以下内容：\n\
    \n```java\nclass RefDemo {\n    public static void main(String args[]) {\n   \
    \     BoxWeight weightbox = new BoxWeight(3, 5, 7, 8.37);\n        Box plainbox\
    \ = new Box();\n        double vol;\n        vol = weightbox.volume();\n     \
    \   System.out.println(\"Volume of weightbox is \" + vol);\n        System.out.println(\"\
    Weight of weightbox is \" + weightbox.weight);\n        System.out.println();\n\
    \n        // 将 BoxWeight 引用赋值给 Box 引用\n        plainbox = weightbox;\n       \
    \ vol = plainbox.volume(); // OK，volume() 在 Box 中定义\n        System.out.println(\"\
    Volume of plainbox is \" + vol);\n        /* 此语句由于 plainbox 而无效\n           它没有确定\
    \ weight 成员。 */\n        // System.out.println(\"Weight of plainbox is \" + plainbox.weight);\n\
    \    }\n}\n```\n\n### SUPER\n\n任何派自父类的子类都可以拥有父类中引用变量的引用。继承的这一方面在许多情况下非常有用。考虑以下内容（见上面的代码）。\n\
    \n上述示例中的 `super` 构造函数实现没有达到理想。`super` 显式地设置了 `BoxWeight` 的宽度、高度、深度字段。当子类需要初始化这些变量时，这是必要的。\n\
    \n### 创建多级层次结构\n\n我们已经使用了简单的层次结构，它们只由一个父类和一个子类组成。你可以创建任意层数的层次结构。使用另一个类的子类作为父类是可以接受的。如果你有三个类\
    \ `A`、`B` 和 `C`，那么 `C` 可以是子类的子类。这种情况意味着每个子类都继承父类的所有特征。`C` 继承了来自 `A` 和 `B` 的所有方面。以下程序说明了多级层次结构的用处。\n\
    \n### 构造函数的调用\n\n当类层次结构被创建时，构造函数按什么顺序被调用？如果 `A` 是 `B` 的子类，且 `B` 是父类，那么 `A` 的构造函数是如何调用的？反之如何？在类层次结构中，构造函数是从父类到子类的顺序调用的。`super()`\
    \ 必须在子类构造函数首先执行。如果没有使用 `super()`，每个父类的默认或无参数构造函数将被执行。\n\n"
- fmt: "\nJava exceptions are objects that describe an unusual (or error) condition\
    \ in a piece or code. An exception object is created when an unusual condition\
    \ occurs and is thrown in the code that caused it. The method that created the\
    \ exception may either handle it or pass it along. The exception will be caught\
    \ and processed in any case. You can either generate exceptions by the Java runtime\
    \ system or manually by your code. Java throws exceptions when there are fundamental\
    \ errors. These exceptions can be caused by Java breaking the Java language rules\
    \ or the constraints of Java's execution environment. Most commonly, exceptions\
    \ that are manually generated are used to notify the caller of a method about\
    \ an error condition.\n\n## EXCEPTION TTYPES\n\nAll exception types are subclasses\
    \ the built-in class `Throwable`. `Throwable` is the highest level of the exception\
    \ class hierarchy. Two subclasses immediately below `Throwable` divide exceptions\
    \ into distinct branches. `Exception` heads one branch. This class is for special\
    \ conditions that user programs must catch. This class is also where you'll subclass\
    \ it to create custom exception types. `RuntimeException` is a subclass of `Exception`.\
    \ These exceptions are automatically created for your programs and include invalid\
    \ array indexing and division by zero.\n\n## EXCEPTIONS\n\nIt is important to\
    \ understand what happens when you don’t handle exceptions before you can learn\
    \ how to handle them in your program. This program contains an expression that\
    \ causes a divide by zero error.\n\n```\nclass Exc0 {\n    public static void\
    \ main(String args[]) {\n        int d = 0;\n        int a = 42/d;\n    }\n}\n\
    ```\n\n## TRY AND CATCH\n\nThe Java run-time system's default exception handler\
    \ is great for debugging but you may want to manually handle any exceptions. Doing\
    \ so provides two benefits. It allows you to correct the error. It prevents the\
    \ program's termination from happening automatically. Your program would cause\
    \ confusion for most users if it stopped running and printed stack trace information\
    \ whenever an error occurred. It is easy to avoid this. You can prevent and manage\
    \ a runtime error by simply including the code you wish to monitor in a `try`\
    \ block. Include a `catch` clause immediately after the `try` block that specifies\
    \ the exception type you want to catch.\n\n## DISPLAYING THE DESCRIPTION OF A\
    \ EXCEPTION\n\n`Throwable` overrides `toString()` method (defined in `Object`).\
    \ It returns a string that contains a description for the exception. This description\
    \ can be displayed in a `println()` statement by passing the exception as an argument.\
    \ This is an example of how you can rewrite the catch block from the previous\
    \ program.\n\n```java\ncatch (ArithmeticException e) {\n    System.out.println(\"\
    Exception: \" + e);\n    // Set a = 0 to continue\n}\n```\n\nThis message is displayed\
    \ for each divide-by-zero error that occurs when this version is used in the program.\n\
    \n`Exception: java.lang.ArithmeticException: / by zero`\n\n## MULTIPLE C CLAUSES\n\
    \nSometimes, multiple exceptions can be raised with a single code block. This\
    \ situation can be handled by specifying multiple `catch` clauses that each catch\
    \ a different type. Each `catch` statement that is executed after an exception\
    \ has been thrown is reviewed in order. Once one `catch` statement is executed,\
    \ all others are ignored and execution continues after the `try/catch` block.\n\
    \n## NESTED TRY STATEMENTS\n\nYou can nest the `try` statement. A `try` statement\
    \ can be placed inside a block of another `try`. The context of the exception\
    \ is added to the stack each time a `try` is entered. If the `catch` handler for\
    \ an exception in an inner `try` statement is not present, the stack will be unwound.\
    \ The `catch` handlers for the next `try` statement are checked for a match. The\
    \ process continues until either one of the `catch` phrases succeeds or all the\
    \ nested attempt statements have been exhausted. If there is no match for a `catch`\
    \ statement, the Java runtime system will handle the exception.\n\n## JAVA’S BUILT\
    \ IN EXCEPTIONS\n\nJava defines many exception classes within the standard package\
    \ `java.lang`. Several of these exception classes have been covered in the examples.\
    \ These exceptions can be subclasses or variants of `RuntimeException`, which\
    \ is the most common. These exceptions, as previously explained, do not need to\
    \ be added to any method's `throws`. These exceptions are known in Java as unchecked.\
    \ This is because the compiler doesn't check to see whether a method handles these\
    \ exceptions. Table 10-1 lists the unchecked exceptions in `java.lang`. Table\
    \ 10-2 lists the exceptions that `java.lang` has defined that must be included\
    \ into a method’s `throws` list. These are known as checked exceptions. Java also\
    \ defines other types of exceptions related to its class libraries.\n\n# Chapter\
    \ 7: String Handling\n\n## THE STRING CONSTRUCTORS\n\nThere are several constructors\
    \ for the `String` class. You can call the default constructor to create an empty\
    \ `String`.\n\n```java\nString s = new String();\n```\n`String` will be created\
    \ with no characters.\n\nYou will often need to create strings with initial values.\
    \ This is possible with the help of the `String` class, which provides many constructors.\
    \ The constructor shown below can be used to create a `String` that is initialized\
    \ with an array of characters.\n\n`String(char chars[])`\n\nHere's an example:\n\
    \n```java\nchar chars[] = {'a', 'b', 'c'};\nString s = new String(chars);\n```\n\
    \n## STRING CONSTRUCTORS ADOPTED BY J2SE5\n\nJ2SE 5 has two constructors for `String`.\
    \ This is the first constructor that supports extended Unicode characters and\
    \ can be seen here:\n\n`String(int codePoints[], int startIndex, int numChars)`.\n\
    \n`codePoints` is an array containing Unicode code points. The range that starts\
    \ at `startIndex` and runs for `numChars` is used to create the string.\n\nThis\
    \ second constructor is compatible with the `StringBuilder` class. It can be seen\
    \ here:\n\n`String(StringBuilder strBuildObj)`.\n\nThis creates a string from\
    \ the `strBuildObj`.\n\n## STRING LENGTH\n\nThe length of a string refers to the\
    \ number of characters it contains. This value can be obtained using `length()`,\
    \ shown here.\n\n`int length()`\n\nBecause there are three characters in the string\
    \ `s`, the following fragment prints \"3\".\n\n```java\nchar chars[] = {'a', 'b',\
    \ 'c'};\nString s = new String(chars);\nSystem.out.println(s.length());\n```\n\
    \n## SPECIAL STRING OPERATIONS\n\nStrings are an important part of programming\
    \ so Java provides special support for string operations in the syntax. These\
    \ operations include automatic creation of `String` instances from string literals\
    \ and concatenation multiple `String` objects using the `+` operator. They also\
    \ allow for the conversion of data types to a `String` representation. Java performs\
    \ all these functions by using explicit methods, but Java makes it easy for programmers\
    \ and adds clarity.\n\n## CHARACTER EXTRACTION\n\n`String` objects can have characters\
    \ extracted from them in a variety of ways using the `String` class. We will examine\
    \ each one. The characters within a `String` object can't be indexed like a character\
    \ array. However, many `String` methods use an offset (or index) to the string\
    \ to perform their operations. `String` indexes start at zero, just like arrays.\n\
    \nYou can use the `charAt()` method to extract one character from a `String`.\
    \ This is its general form:\n\n`char charAt(int where)`\n\nWhere is the index\
    \ of your desired character? The `where` value must not be negative and should\
    \ specify a place within the string. `charAt()` returns the character at specified\
    \ location. Take, for example.\n\n```java\nchar ch;\nch = \"abc\".charAt(1);\n\
    ```\nThe value \"b\" is assigned to `ch`.\n\n## SEARCHING STRING\n\nTwo methods\
    \ can be used by the `String` class to search for a specific character or substring\
    \ in a string.\n\n* `indexOf()` searches for substrings or characters that are\
    \ first encountered.\n\n* `lastIndexOf()` searches for characters or substrings\
    \ that have been found in the past.\n"
  raw: 'Java exceptions are objects that describe an unusual (or error) condition
    in a piece or code. An exception object is created when an unusual condition occurs
    and is thrown in the code that caused it. The method that created the exception
    may either handle it or pass it along. The exception will be caught and processed
    in any case. You can either generate exceptions by the Java runtime system or
    manually by your code. Java throws exceptions when there are fundamental errors.
    These exceptions can be caused by Java breaking the Java language rules or the
    constraints of Java''s execution environment. Most commonly, exceptions that are
    manually generated are used to notify the caller of a method about an error condition.


    EXCEPTION TTYPES


    All exception types are subclasses the built-in class Throwable. Throwable is
    the highest level of the exception class hierarchy. Two subclasses immediately
    below Throwable divide exceptions into distinct branches. Exception heads one
    branch. This class is for special conditions that user programs must catch. This
    class is also where you''ll subclass it to create custom exception types. RuntimeException
    is a subclass of Exception. These exceptions are automatically created for your
    programs and include invalid array indexing and division by zero.


    EXCEPTIONS


    It is important to understand what happens when you don’t handle exceptions before
    you can learn how to handle them in your program. This program contains an expression
    that causes a divide by zero error.


    {class Exc0 Class Exc0


    {public static void main(String args[]) public static void main (String args[]).


    int d = 0;


    int a = 42/d;


    |}


    |}


    TRY AND CATCH


    The Java run-time system''s default exception handler is great for debugging but
    you may want to manually handle any exceptions. Doing so provides two benefits. It
    allows you to correct the error. It prevents the program''s termination from happening
    automatically. Your program would cause confusion for most users if it stopped
    running and printed stack trace information whenever an error occurred. It is
    easy to avoid this. You can prevent and manage a runtime error by simply including
    the code you wish to monitor in a try block. Include a catch clause immediately
    after the try block that specifies the exception type you want to catch.


    DISPLAYING THE DESCRIPTION OF A EXCEPTION


    Throwable overrides toString(.) method (defined in Object). It returns a string
    that contains a description for the exception. This description can be displayed
    in a println() statement by passing the exception as an argument. This is an example
    of how you can rewrite the catch block from the previous program.


    {catch (ArithmeticException e) catch (ArithmeticExceptione e)


    System.out.println("Exception: " + e);


    // Set a = 0 to continue


    |}


    This message is displayed for each divide-byzero error that occurs when this version
    is used in the program.


    Exception: java.lang.ArithmeticException: / by zero


    MULTIPLE CRATCH CLAUSES


    Sometimes, multiple exceptions can be raised with a single code block. This situation
    can be handled by specifying multiple catch clauses that each catch a different
    type. Each catch statement that is executed after an exception has been thrown
    is reviewed in order. Once one catch statement is executed, all others are ignored
    and execution continues after the "try/catch" block.


    NESTED TERY STATEMENTS


    You can nest the try statement. A try statement can be placed inside a block of
    another try. The context of the exception is added to the stack each time a try
    is entered. If the catch handler for an exception in an inner try statement is
    not present, the stack will be unwound. The catch handlers for the next try statement
    are checked for a match. The process continues until either one of the catch phrases
    succeeds or all the nested attempt statements have been exhausted. If there is
    no match for a catch statement, the Java runtime system will handle the exception.


    JAVA’S BUILT IN EXCEPTIONS


    Java defines many exception classes within the standard package Java.lang. Several
    of these exception classes have been covered in the examples. These exceptions
    can be subclasses or variants of RuntimeException, which is the most common. These
    exceptions, as previously explained, do not need to be added to any method''s
    throws. These exceptions are known in Java as unchecked. This is because the compiler
    doesn''t check to see whether a method handles these exceptions. Table 10-1 lists
    the unchecked exceptions in Java.lang. Table 10-2 lists the exceptions that java.lang
    has defined that must be included into a method’s throws list. These are known
    as checked exceptions. Java also defines other types of exceptions related to
    its class libraries.


    # Chapter 7: String Handling


    THE STRING CONSTRUCTORS


    There are several constructors for the String class. You can call the default
    constructor to create an empty String. You can use this example:


    String s = new String();


    String will be created with no characters.


    You will often need to create strings with initial values. This is possible with
    the help of the String class, which provides many constructors. The constructor
    shown below can be used to create a String that is initialized with an array of
    characters.


    String(char chars[ ])


    Here''s an example:


    char chars[] = ''a'', ''b'', ''c'' ;


    String s = new String(chars);


    STRING CONSTRUCTORS ADOPTED BY J2SE5


    J2SE 5 has two constructors for String. This is the first constructor that supports
    extended Unicode characters and can be seen here:


    String(int codePoints[?], int startIndex and int numChars).


    CodePoints is an array containing Unicode code points. The range that starts at
    startIndex runs for numChars is used to create the string.


    This second constructor is compatible with the StringBuilder class. It can be
    seen here:


    String(StringBuilder strBuildObj).


    This creates a string from the StringBuilder passed to strBuildObj.


    STRING LENGTH


    The length of a string refers to the number of characters it contains. This value
    can be obtained using the length( ), shown here.


    int length( )


    Because there are three characters in the string, s:3, the following fragment
    prints "3".


    char chars[] = ''a'', ''b'', ''c'' ;


    String s = new String(chars);


    System.out.println(s.length());


    SPECIAL STRING OPERATIONS


    Strings are an important part of programming so Java provides special support
    for string operations in the syntax. These operations include automatic creation
    of String instances from string literals and concatenation multiple String objects
    using the + operator. They also allow for the conversion of data types to a String
    representation. Java performs all these functions by using explicit methods, but
    Java makes it easy for programmers and adds clarity.


    CHARACTER XTRACTION


    String objects can have characters extracted from them in a variety of ways using
    the String class. We will examine each one. The characters within a String object
    can''t be indexed like a character array. However, many String methods use an
    offset (or index) to the string to perform their operations. String indexes start
    at zero, just like arrays.


    You can use the charAt ( ) method to extract one character from a String. This
    is its general form:


    char charAt (int where).


    Where is the index of your desired character? The where value must not be negative
    and should specify a place within the string. charAt() returns the character at
    specified location. Take, for example.


    char ch;


    ch = "abc".charAt(1)


    The value "b" is assigned to ch.


    SEARCHING STRENGS


    Two methods can be used by the String class to search for a specific character
    or substring in a string.


    * indexOf() Searches for substrings or characters that are first encountered.


    * lastIndexOf ( ) Searches for characters or substrings that have been found in
    the past.'
