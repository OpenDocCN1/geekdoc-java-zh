    \n### While\n最基本的 Java 循环语句是 `while` 循环。当控制表达式保持为真时，它重复执行块或语句。这是它的通用形式：\n\n```java\n\
    while(条件)\n{// 循环体}\n```\n\n## 循环的一些变体\n\n`for` 循环有许多变体，可以增加它的力和实用性。它是灵活的，因为它的三个部分——初始化和条件测试以及迭代——简单可以用于任何目的。`for`\
