    ![](Image00000.jpg)


    Java Programming - Advanced


    # Chapter 1: An Overview of Java


    OBJECT ORIENTED PROGRAMMING


    Java''s core is object-oriented programming (OOP). All Java programs are, in fact,
    at least partially object-oriented. OOP is an integral part of Java. It is important
    to be familiar with its principles before you start writing simple Java programs. This
    chapter will discuss the theoretical aspects and applications of OOP.


    TWO PARADIGMS


    Computer programs are composed of code and data. A program can also be conceptually
    organized around either its code or its data. This means that some programs are
    written around what is happening, while others are written around who is being
    affected. These two paradigms govern how programs are constructed. The process-oriented
    model is the first. This model describes a program in a series or steps (that
    is code). This model is code that acts on data. This model is used to great effect
    in procedural languages like C.


    ABSTRAACTION


    Abstraction is an essential component of object-oriented programming. Abstraction
    is how humans manage complexity. People don''t think of a car, for example, as
    a collection of thousands of parts. It is a clearly defined object that has its
    own behavior. This abstraction allows people the freedom to drive a car to the
    grocery without worrying about the intricate parts. They don''t have to pay attention
    to the intricate details of the engine, transmission, or braking system. They
    can instead use the entire object.


    ENCAPSULATION


    Encapsulation is a mechanism that binds code and data together and protects them
    from misuse and interference. Encapsulation can be described as a protective wrapper
    that blocks code and data being accessed by code outside of the wrapper. The interface
    that controls access to code and data within the wrapper is well-defined. This
    is analogous to an automobile''s automatic transmission. This information contains
    hundreds of bits about your engine. It includes the amount of acceleration, pitch
    of the surface, and position of the shift lever.


    POLYMORPHISM AND ENCAPSULATION WORK TOGETHER


    Polymorphism, inheritance, and encapsulation can be combined to create a programming
    environment that is far more robust than the process-oriented model. The basis
    for reuse of the code you have spent time developing and testing is a well-designed
    hierarchy. Encapsulation makes it possible to move your implementations without
    breaking any code that relies on your public interface. Polymorphism allows for
    the creation of clean, sensible, readable and resilient code.


    THE FIRST SIMPLE PROGRAM


    Let''s now look at actual Java programs after we have covered the basics of Java
    object-oriented underpinnings. Let''s begin by running and compiling the following
    sample program. This takes a bit more effort than you might think.


    /*


    This Java program is very simple.


    This file is called "Example.java".


    */


    {class Example Class Example


    // Start your program with a call back to main()


    {public static void main(String args[]) public static void main (String args[]).


    System.out.println("This is a simple Java program. "


    |}


    |}


    ENTERING THE PROGRAM


    The name of the file containing the source code for a program in most computer
    languages is irrelevant. Java is different. Java''s first lesson is to understand
    that the name of a source file is extremely important. This is an example of what
    the source file name should look like.java. Let''s find out why. A compilation
    unit is what Java calls a source file. A text file that contains one, or more,
    class definitions. Java compiler requires that source files use the extension.java.


    COMPILING


    Execute the compiler javac to compile the Example program.


    C.>javac Examples.java


    The javac compiler creates an example.class file that contains the bytecode version. The
    Java bytecode, which is an intermediate representation of your program and contains
    instructions that the Java Virtual Machine will execute, is what we discussed
    earlier. The output of javac therefore is not code that can directly be executed.


    You must use Java''s application launcher (called java) to actually run the program. As
    shown below, you need to pass the class name Example as an argument on the command
    line.


    C:\>java Example


    The following output will be displayed when the program is executed:


    This Java program is very simple.


    THE IF STATEMENT


    The Java if statement functions in the same way as any other language''s IF statement. It
    is syntactically identical with the if statements of C, C++ and C#. This is its
    simplest form:


    If(condition) statement;


    This is condition. It''s a Boolean expression. If condition is true, the statement
    will be executed.


    False condition means that the statement can be ignored. Here''s an example:


    if (num 100); System.out.println ("num is less than 100");


    /*


    Show the if.


    This file should be called "IfSample.java".


    */


    {class IfSample class IfSample


    {public static void main(String args[]) public static main(String arguments[])


    intx,y;


    x = 10,


    y = 20,


    if (x y). System.out.println ("x is less than or equal to y");


    x = * 2;


    if(x == y) System.out.println("x now equal to y");


    x = * 2;


    if(x > y) System.out.println("x now greater than y");


    // This won''t show anything


    if(x == y) System.out.println("you won''t see this");


    | }


    | }


    # Chapter 2: Data Types and Variables.


    THE PRIMITIVE TTYPES


    Java supports eight types of primitive data: byte and short, int, long; char,
    float; double; and boolean. Both simple and primitive types are commonly used
    to refer to the primitive types. You can group them into four categories:


    * Integers The group includes byte and short as well as int and long which are
    whole-valued signed numbers.


    * Floating numbers This group includes double and float, which are numbers with
    fractional precision.


    INTEGERS


    Java has four types of integers: byte (short), int (int), and long (long). All
    these integer types can be signed and have positive or negative values. Java doesn''t
    support unsigned, positive only integers. Many other computer languages can support
    both signed integers and unsigned integers. Java''s developers felt unsigned integers
    were unnecessary. They felt that unsigned integers were unnecessary because they
    could be used to describe the behavior of high-order bits, which define the sign
    of an integer value. Java adds a special "unsigned rightshift" operator to clarify
    the meaning of high-order bits. This eliminated the need to have an unsigned integer
    type.


    FLOATING POINT TYPES


    When evaluating expressions with fractional precision, floating-point numbers
    (also known as real numbers) are used. Calculations such as square root or transcendentals
    like sine and cosine can result in values whose precision requires a floating
    point type. Java implements the standard (IEEE-754) set of floating-point operators
    and types. There are two types of floating-point types: float and double. These
    represent single- or double-precision numbers.


    CHARACTERS


    Java uses char as the data type to store characters. C/C++ programmers need to
    be aware that char in Java may not be the same as C++ or C++. C/C++ has char that
    is 8 bits in width. Java, however, does not have this limitation. Java instead
    uses Unicode to represent characters. Unicode is a fully international character
    set, which can represent all characters in all human languages. Unicode is the
    unification of many character sets such as Latin Greek, Arabic Cyrillic Hebrew,
    Cyrillic Hebrew, Katakana and Hangul. It requires 16 bits to accomplish this task. Java
    char is therefore a type of 16 bits. A char can be anywhere from 0 to 65,536. There
    are no negative characters.


    BOOLEANS


    Java supports a primitive type called boolean for logical values. It can only
    have one of the two possible values, true/false. This type is returned by all
    relational operations, as in the case a b. The type required by conditional expressions
    such as for and if is boolean.'
