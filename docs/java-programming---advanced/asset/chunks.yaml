  trans: "\n\n![](img/Image00000.jpg)\n\nJava 编程 - 高级\n\n# 第 1 章：Java 概述\n\n## 面向对象编程\n\
    Java 的核心是面向对象编程（OOP）。事实上，所有的 Java 程序至少部分是面向对象的。OOP 是 Java 不可缺的一部分。在开始编写简单的 Java\
    \ 程序之前，熟悉它的原理至关重要。本章将讨论 OOP 的理论方面和应用。\n\n## 两种范式\n计算机程序由代码和数据组成。程序在概念上也可以围绕其代码或数据进行组织。这意味着某些程序是根据“发生的事情”编写的，而另一些则是根据“受影响的对象”编写的。这两种范式决定了程序的构建方式。一种是面向模型的，将程序描述为一系列步骤（即代码）。这种模型是作用于数据的代码。这种模型在\
    \ `C` 等过程化语言中被广泛使用。\n\n### 抽象\n抽象是面向对象编程的重要组件。抽象是人类管理复杂性的方式。例如，人们不会把汽车看成数千个部件的集合。它是一个定义清晰的对象，具有自己的行为。这种抽象让人们能够自由地开车去超市，而不必担心复杂的部件。他们不需要关注引擎、变速箱或刹车系统的复杂细节。相反，他们可以使用整个对象。\n\
    \n### 封装\n封装是将代码和数据结合在一起并保护它们免受误用和干扰的机制。封装可以被描述为一种保护性封装，阻止外部代码访问内部代码和数据。控制内部代码和数据访问的接口是良好定义的。这类似于汽车的自动变速箱。这些信息包含了关于你引擎的数百位数据，包括加速度的大小、路面的倾斜度和换挡杆的位置。\n\
    \n### 多态与封装的协同工作\n多态、继承和封装可以结合，创建一个比面向过程模型健壮得多的编程环境。你花费时间开发和测试的代码的复用基础是设计良好的层次结构。封装使得你可以在不破坏任何依赖于公共接口代码的情况下移动你的实现代码。多态允许创建出整洁、合理、易读且具有伸缩性的代码。\n\
    \n## 第一个简单程序\n在涵盖了 Java 面向对象基础知识之后，让我们来看实际的 Java 程序。让我们从运行和编译以下示例程序开始。这比你想象的要多费一点精力。\n\
    \n```java\n/*\n这个 Java 程序非常简单。\n该文件名为 \"Example.java\"。\n*/\nclass Example {\n\
    \    // 从回调 main() 方法开始你的程序\n    public static void main(String args[]) {\n  \
    \      System.out.println(\"This is a simple Java program.\");\n    }\n}\n```\n\
    \n## 程序\n在大多数计算机语言中，包含程序源代码的文件名无关紧要。Java 不同。Java 的第一课是理解文件名极其重要。这是源代码文件名的示例：`.java`。让我们看看为什么。Java\
    \ 将源代码称为编译单元。Java 码是程序的中间表示，包含了 Java 虚拟机将执行的指令，这是我们之前讨论过的内容。因此，`javac` 的输出不是可以直接执行的代码。\n\
    \n你必须使用 Java 应用程序启动器（称为 `java`）来实际运行程序。如下所示，需要在命令行上将类名 `Example` 作为参数传递。\n\n```\n\
    C:\\>java Example\n```\n\n执行程序时将显示以下输出：\nThis is a simple Java program.\n\n##\
    \ IF 语句\nJava 的 `if` 语句功能与任何其他语言的 `IF` 语句相同。它在语法上与 `C`、`C++` 和 `C#` 的 `if` 语句相同。这是它最简单的形式：\n\
    \n`if(condition) statement;`\n\n这里 `condition` 是条件。这是一个布尔表达式。如果 `condition` 为真（true），则执行该语句。\n\
    \n假（false）条件意味着可以忽略该语句。这里有一个示例：\n\n```java\n/*\n这个 Java 程序非常简单。\n该文件名为 \"IfSample.java\"\
    。\n*/\nclass IfSample {\n    public static void main(String args[]) {\n      \
    \  int x, y;\n        if (x < 100) {\n            System.out.println(\"num is\
    \ less than y\");\n        }\n        if (x == y) {\n            System.out.println(\"\
    x now equal to y\");\n        }\n        if (x > y) {\n            System.out.println(\"\
    x now greater than y\");\n        }\n    }\n}\n```\n\n# 第 2 章：数据类型与变量\n\n## 基本类型\n\
    Java 支持八种基本类型：`byte`、`short`、`int`、`long`、`char`、`float`、`double` 以及 `boolean`。简单类型和基本类型都很经常使用。你可以将它们分为四类：\n\
    \n* 整数：该组包括 `byte`、`short`、`int` 和 `long`，它们是有符号的整数。\n* 浮点数：该组包括 `double` 和 `float`，它们是小数数字。\n\
    \n### 整数\nJava 有四种整数类型：`byte`、`short`、`int` 和 `long`。所有整数类型都是带符号的，有正负值。Java 不支持无符号整数。许多其他语言都支持符号和无符号整数。Java\
    \ 开发者认为无符号整数是不必要的，因为可以使用高位来描述。Java 添加了特殊的无符号右移运算符来明确高位的含义。这消除了对无符号整数类型的需求。\n\n\
    ### 浮点类型\n在评估带有精度的表达式时，使用了浮点数（也称为实数）。诸如平方根或正余函数等计算会产生点类型的值。Java 实现了标准的 IEEE-754\
    \ 浮点运算符和类型。浮点类型有二：`float` 和 `double`。这些表示单精度或双精度的数字。\n\n### 字符\nJava 使用 `char`\
    \ 作为存储字符的数据类型。`C/C++` 程序员需要注意，Java 中的 `char` 可能与 `C++` 或 `C` 不同。`C/C++` 的 `char`\
    \ 宽度为 8 位。然而，Java 没有这种限制。Java 使用使用 Unicode 表示字符。Unicode 是一个完整的字符集，可以表示所有人类语言的所有字符。Unicode\
    \ 是许多字符集的统一，如拉丁希腊字母、阿拉伯西里尔字母、假名和韩语。完成这项任务需要 16 位。因此，Java `char` 是 16 位的类型。`char`\
    \ 的范围可以在 0 到 65536 之间。不存在负数字符。\n\n### 布尔值\nJava 支持一种名为 `boolean` 的基本类型，用于逻辑值。它只有两个可能的值：真（true）/假（false）。所有关系运算都返回这种类型，例如\
    \ `a < b`。条件表达式（如 `for` 和 `if`）所需的类型是 `boolean`。\n\n"
