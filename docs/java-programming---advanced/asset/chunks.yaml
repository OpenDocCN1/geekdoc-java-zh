    这两种方法都可以以多种方式进行重载。这些方法返回字符或子字符串出现的索引。如果方法执行失败，则返回 -1。


    ### 搜索方法


    使用此搜索工具查找特定字符的首次出现的位置。


    ```java

    int indexOf (int ch).

    ```


    使用此工具查找字符最后一次出现的位置。


    ```java

    int lastIndexOf (int ch).

    ```


    在这里，`ch` 代表要查找的字符。


    使用此方法搜索首次或最后一次位置的子字符串。


    ```java

    int indexOf (String str)

    int lastIndexOf (String str).

    ```


    ### 使用 VALUEOF () 进行数据转换


    `valueOf()` 是一个方法，它可以将数据从内部格式转换为人类可读的格式。它是一个静态方法，加载在 `String` 类中，适用于 Java 的所有内置类型。这使得每个
    Java 类型都能被正确地转换为字符串。`valueOf()` 也加载了 `Object` 类型，因此你创建的任何对象都可以作为参数。（请记住 `Object`
    是所有类的超类。以下是它的几种形式的示例：）


    ```java

    static String valueOf(double num)

    static String valueOf(long num)

    static String valueOf(Object ob)

    static String valueOf(char chars[ ])

    ```


    ### STRINGBUILDER


    J2SE 5 为 Java 令人叹的字符串处理能力引入了一个新的字符串类。`StringBuilder` 就是这个新类。它与 `StringBuffer`
    相同，但不是同步的。这意味着它不是线程安全的。`StringBuilder` 的性能更快。在多线程场景下建议使用 `StringBuffer`。


    '
