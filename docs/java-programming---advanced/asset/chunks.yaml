    THE UNSIGNED RIGHT SLIP


    As you can see, the >> operator fills the high order bit automatically with its
    previous contents every time there is a shift. This preserves the sign value. Sometimes,
    however, this can be undesirable. If you''re shifting something that doesn''t
    represent a numerical value, sign extension may not be desired. This is often
    the case when working with pixels-based values or graphics. These cases will require
    you to shift a zero into a high-order bit regardless of its initial value. This
    is called an unsigned shift. Java''s unsigned shift-right operator >>>, is used
    to accomplish this. It always shifts zeros into high-order bits.


    SHORT-CIRCUIT OPERATORS LOGICAL OPERATORS


    Java has two unique Boolean operators that are not available in other languages. These
