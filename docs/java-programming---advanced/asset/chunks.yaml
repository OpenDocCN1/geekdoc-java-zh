  trans: "\nJava 异常是描述代码段中异常（或错误）情况的对象。当发生异常情况时，会创建一个异常对象，并在导致该异常的代码中将其抛出。创建异常的方法可以处理它，也可以将其传递。在任何情况下，异常都会被捕获并处理。你可以通过\
    \ Java 运行时系统生成异常，也可以通过你的代码手动生成。Java 在发生根本错误时会抛出异常。这些异常可能是由于违反 Java 语言规则或 Java\
    \ 执行环境的限制而引起的。最常见的是，手动生成的异常用于通知方法调用者错误情况。\n\n## 异常类型\n\n所有异常类型都是内置类 `Throwable`\
    \ 的子类。`Throwable` 是异常类层次结构中的最高级。紧接 `Throwable` 下的两个子类将异常分为不同的分支。`Exception` 引导一个分支。该类用于用户程序必须捕获的特殊情况。你也可以通过派生该类来创建自定义异常类型。`RuntimeException`\
    \ 是 `Exception` 的子类。这些异常为你的程序自动创建，包括无效的数组索引和除以零。\n\n## 异常\n\n在学习如何在程序中处理异常之前，了解在不处理异常时会发生什么是很重要的。此程序包含一个导致除以零错误的表达式。\n\
    \n```java\nclass Exc0 {\n    public static void main(String args[]) {\n      \
    \  int d = 0;\n        int a = 42/d;\n    }\n}\n```\n\n## TRY 和 CATCH\n\nJava\
    \ 运行时系统的默认异常处理器对于调试非常有用，但你可能想手动处理任何异常。这样做有两个好处：它允许你纠正错误；它防止了程序自动终止。如果程序每当发生错误就停止运行并打印堆栈跟踪信息，将让大多数用户感到困惑。这很容易避免。你只需通过将你想要监控的代码包含在\
    \ `try` 块中，就可以防止并管理运行时错误。在 `try` 块之后紧跟一个 `catch` 子句，并指定你想要捕获的异常类型。\n\n## 显示异常描述\n\
    \n`Throwable` 重写了 `toString()` 方法（定义在 `Object` 中）。它返回一个包含异常描述的字符串。可以通过将异常作为参数传递给\
    \ `println()` 语句来显示此描述。这是一个关于如何重写之前程序中 catch 块的示例。\n\n```java\ncatch (ArithmeticException\
    \ e) {\n    System.out.println(\"Exception: \" + e);\n    // 设置 a = 0 以继续\n}\n\
    ```\n\n当程序中使用此版本时，每个发生的除以零错误都会显示此消息。\n\n`Exception: java.lang.ArithmeticException:\
    \ / by zero`\n\n## 多个 catch 子句\n\n有时，一个代码块可能会引发多个异常。这种情况可以通过指定多个 `catch` 子句来处理，每个子句捕获不同类型。在异常抛出后执行的每个\
    \ `catch` 语句都会按顺序检查。一旦执行了某个 `catch` 语句，其他都会被忽略，并在 `try/catch` 块之后继续执行。\n\n## 嵌套\
    \ try 语句\n\n你可以嵌套 `try` 语句。一个 `try` 语句可以放在另一个 `try` 块内部。每当进入一个 `try` 时，异常的上下文就会添加到栈中。如果内部\
    \ `try` 语句的异常没有对应的 `catch` 处理器，栈将回溯。将检查下一个 `try` 语句的 `catch` 处理器是否匹配。该过程一直持续，直到其中一个\
    \ `catch` 短句成功或所有的嵌套尝试语句都已耗尽。如果没有匹配的 `catch` 语句，Java 运行时系统将处理该异常。\n\n## Java 内置异常\n\
    \nJava 在标准包 `java.lang` 中定义了许多异常类。这些异常类中的几个已经在示例中介绍。这些异常可以是 `RuntimeException`\
    \ 的子类或变体，它是最常见的。如之前所述，这些异常不需要添加到任何方法的 `throws` 中。这些异常在 Java 中被称为未检查异常。这是因为编译器不会检查方法是否处理了这些异常。表\
    \ 10-1 列出了 `java.lang` 中的未检查异常。表 10-2 列出了 `java.lang` 定义的必须包含在方法 `throws` 列表中的异常。这些被称为已检查异常。Java\
    \ 还定义了与其类库相关的其他类型的异常。\n\n# 第 7 章：字符串处理\n\n## 字符串构造函数\n\n`String` 类有几个构造函数。你可以调用默认构造函数来创建一个空的\
    \ `String`。\n\n```java\nString s = new String();\n```\n创建的 `String` 将不包含任何字符。\n\
    \n你经常需要创建带有初始值的字符串。这可以通过 `String` 类提供的帮助来实现，该类提供了许多构造函数。下面所示的构造函数可以创建一个用字符数组初始化的\
    \ `String`。\n\n`String(char chars[])`\n\n示例：\n\n```java\nchar chars[] = {'a',\
    \ 'b', 'c'};\nString s = new String(chars);\n```\n\n## J2SE5 采用的字符串构造函数\n\nJ2SE\
    \ 5 为 `String` 有两个构造函数。这是第一个支持扩展 Unicode 字符的构造函数，所示：\n\n`String(int codePoints[],\
    \ int startIndex, int numChars)`。\n\n`codePoints` 是一个包含 Unicode 代码点的数组。使用从 `startIndex`\
    \ 开始并运行 `numChars` 个的范围来创建字符串。\n\n第二个构造函数与 `StringBuilder` 类兼容。所示：\n\n`String(StringBuilder\
    \ strBuildObj)`。\n\n这会根据 `strBuildObj` 创建一个字符串。\n\n## 字符串长度\n\n字符串的长度是指它包含的字符数。可以使用\
    \ `length()` 获取此值，所示：\n\n`int length()`\n\n由于字符串 `s` 中有三个字符，下面的片段将打印 \"3\"。\n\n\
    ```java\nchar chars[] = {'a', 'b', 'c'};\nString s = new String(chars);\nSystem.out.println(s.length());\n\
    ```\n\n## 特殊字符串操作\n\n字符串是编程的重要部分，因此 Java 在语法中为字符串操作提供了特殊支持。这些操作包括从字符串字面量自动创建 `String`\
    \ 实例，以及使用 `+` 运算符拼接多个 `String` 对象。它们还允许将数据类型转换为 `String` 表示。Java 通过显式方法执行所有这些功能，但\
    \ Java 使程序员变得更加方便并增加了清晰度。\n\n## 字符提取\n\n可以使用 `String` 类通过多种方式从 `String` 对象中提取字符。我们将检查每一种。`String`\
    \ 对象中的字符不能像字符数组那样索引。然而，许多 `String` 方法使用字符串的偏移量（或索引）来执行操作。String 索引从零开始，数组数组。\n\
    \n你可以使用 `charAt()` 方法从 `String` 中提取一个字符。其通用形式为：\n\n`char charAt(int where)`\n\n\
    `where` 是你所需的字符的索引吗？`where` 值不能为负，应指定字符串内的某个位置。`charAt()` 返回指定位置的字符。例如：\n\n```java\n\
    char ch;\nch = \"abc\".charAt(1);\n```\n值 \"b\" 被赋值给 `ch`。\n\n## 字符串搜索\n\n`String`\
    \ 类可以使用两个方法在字符串中搜索特定字符或子字符串。\n\n* `indexOf()` 搜索首次遇到的子字符串或字符。\n\n* `lastIndexOf()`\
    \ 搜索过去出现过的字符或子字符串。\n\n"
