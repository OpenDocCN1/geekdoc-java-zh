    \ void main(String args[]) {\n        boolean b;\n        b = false;\n       \
    \ System.out.println(\"b is \" + b);\n        b = true;\n        System.out.println(\"\
    b is \" + b);\n\n        // A boolean value may control the if statem\n      \
    \  if(b) System.out.println(\"This is executed.\");\n        b = false;\n    \
    \    if(b) System.out.println(\"This is not executed.\");\n\n        // The result\
    \ of a relational operation is a boolean number\n        System.out.println(\"\
    10 > 9 is \" + (10 > 9));\n    }\n}\n```\n\n## FLOATING POINT LITERALS\n\nFloating-point\
    \ numbers are decimal values that include a fractional component. They can be\
    \ expressed either in scientific or standard notation. Standard notation is composed\
    \ of a whole-number component, followed by a decimal and then a fractional component.\
    \ `2.`, `3.14159`, `0.6667`, and `0.6667` are valid floating-point numbers in\
    \ standard-notation. A standard-notation floating-point number and a suffix specifying\
    \ a power of 10, which is how the number should be multiplied in scientific notation.\
    \ An `E` or `e` is followed by a decimal, which can be either positive or negative.\n\
    \n## DYNAMIC INSITIALIZATION\n\nWhile the previous examples used constants as\
    \ initializers for variables, Java allows variables that are declared to be initialized\
    \ dynamically using any expression that is valid at the time they are declared.\
    \ Here is an example program that calculates the length of the hypotenuse in a\
    \ right triangle based on the lengths of its opposing sides.\n\n```java\n// Demonstrate\
    \ dynamic initialization.\n\nclass DynInit {\n    public static void main(String\
    \ args[]) {\n        Double a = 3.0, double b = 4.0;\n        // c is dynamically\
    \ initialized\n        Double c = Math.sqrt(a* a + b* b);\n        System.out.println(\"\
    Hypotenuse is \" + c);\n    }\n}\n```\n\n## TYPE CONVERSION AND CASTING\n\nYou\
    \ may have some programming experience. It is quite common to assign one type\
    \ of value to another type of variable. Java will automatically convert the types\
    \ if they are compatible. It is possible, for example, to assign an `int` value\
    \ to a `long` variable. But not all types are compatible and therefore not all\
    \ type conversions can be implicitly permitted. There is, for example, no automatic\
    \ conversion from `double` to `bytes`. It is possible to convert between incompatible\
