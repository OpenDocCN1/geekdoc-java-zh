    \n# 第 4 章：控制语句\n\n## Java 选择语句\n\nJava 支持两种选择语句：`switch` 和 `if`。这些语句可以根据运行时才知道的条件控制程序的执行。这些语句的力量和活性会让你惊讶。\n\
