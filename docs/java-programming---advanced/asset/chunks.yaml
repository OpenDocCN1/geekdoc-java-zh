    TYPE CONVERSION AND CASTING


    You may have some programming experience. It is quite common to assign one type
    of value to another type of variable. Java will automatically convert the types
    if they are compatible. It is possible, for example, to assign an int value a
    long variable. But not all types are compatible and therefore not all type conversions
    can be implicitly permitted. There is, for example, no automatic conversion from
    double to bytes. It is possible to convert between incompatible types. Casts are
    used to convert between incompatible types. Let''s take a look at casting and
    automatic type conversions.


