    Java 有若干种位运算符，可以用于整数类型 `long`、`int`、`short`、`char` 和 `byte`。这些运算符能够对单个操作数的位进行操作。\n\
    \n## 位逻辑运算符\n\n`|`、`^` 和 `~`。下面的表显示了每个操作的结果。接下来的表显示了每个操作的输出。\n\n### 位取反\n位补码也称为一元非\
