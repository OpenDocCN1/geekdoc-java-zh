    FLOATING POINT LITERALS


    Floating-point numbers are decimal values that include a fractional component. They
    can be expressed either in scientific or standard notation. Standard notation
    is composed of a whole-number component, followed by a decimal and then a fractional
    component. 2., 3.14159, 0.6667, and 0.6667 are valid floating-point numbers in
    standard-notation. A standard-notation floating-point number and a suffix specifying
    a power of 10, which is how the number should be multiplied in scientific notation. An
    E or e is followed by a decimal, which can be either positive or negative.


    DYNAMIC INSITIALIZATION


    While the previous examples used constants as initializers for variables, Java
    allows variables that are declared to be initialized dynamically using any expression
    that is valid at the time they are declared. Here is an example program that calculates
    the length of the hypotenuse in a right triangle based on the lengths of its opposing
    sides.


