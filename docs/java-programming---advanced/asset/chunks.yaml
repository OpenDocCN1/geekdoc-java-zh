- fmt: "\n![](Image00000.jpg)\n\nJava Programming - Advanced\n\n# Chapter 1: An Overview\
    \ of Java\n\n## OBJECT ORIENTED PROGRAMMING\nJava's core is object-oriented programming\
    \ (OOP). All Java programs are, in fact, at least partially object-oriented. OOP\
    \ is an integral part of Java. It is important to be familiar with its principles\
    \ before you start writing simple Java programs. This chapter will discuss the\
    \ theoretical aspects and applications of OOP.\n\n## TWO PARADIGMS\nComputer programs\
    \ are composed of code and data. A program can also be conceptually organized\
    \ around either its code or its data. This means that some programs are written\
    \ around what is happening, while others are written around who is being affected.\
    \ These two paradigms govern how programs are constructed. The process-oriented\
    \ model is the first. This model describes a program in a series or steps (that\
    \ is code). This model is code that acts on data. This model is used to great\
    \ effect in procedural languages like `C`.\n\n### ABSTRACTION\nAbstraction is\
    \ an essential component of object-oriented programming. Abstraction is how humans\
    \ manage complexity. People don't think of a car, for example, as a collection\
    \ of thousands of parts. It is a clearly defined object that has its own behavior.\
    \ This abstraction allows people the freedom to drive a car to the grocery without\
    \ worrying about the intricate parts. They don't have to pay attention to the\
    \ intricate details of the engine, transmission, or braking system. They can instead\
    \ use the entire object.\n\n### ENAPSULATION\nEncapsulation is a mechanism that\
    \ binds code and data together and protects them from misuse and interference.\
    \ Encapsulation can be described as a protective wrapper that blocks code and\
    \ data being accessed by code outside of the wrapper. The interface that controls\
    \ access to code and data within the wrapper is well-defined. This is analogous\
    \ to an automobile's automatic transmission. This information contains hundreds\
    \ of bits about your engine. It includes the amount of acceleration, pitch of\
    \ the surface, and position of the shift lever.\n\n### POLYMORPHISM AND ENCAPSULATION\
    \ WORK TOGETHER\nPolymorphism, inheritance, and encapsulation can be combined\
    \ to create a programming environment that is far more robust than the process-oriented\
    \ model. The basis for reuse of the code you have spent time developing and testing\
    \ is a well-designed hierarchy. Encapsulation makes it possible to move your implementations\
    \ without breaking any code that relies on your public interface. Polymorphism\
    \ allows for the creation of clean, sensible, readable and resilient code.\n\n\
    ## THE FIRST SIMPLE PROGRAM\nLet's now look at actual Java programs after we have\
    \ covered the basics of Java object-oriented underpinnings. Let's begin by running\
    \ and compiling the following sample program. This takes a bit more effort than\
    \ you might think.\n\n```java\n/*\nThis Java program is very simple.\nThis file\
    \ is called \"Example.java\".\n*/\nclass Example {\n    // Start your program\
    \ with a call back to main()\n    public static void main(String args[]) {\n \
    \       System.out.println(\"This is a simple Java program.\");\n    }\n}\n```\n\
    \n## ENTERING THE PROGRAM\nThe name of the file containing the source code for\
    \ a program in most computer languages is irrelevant. Java is different. Java's\
    \ first lesson is to understand that the name of a source file is extremely important.\
    \ This is an example of what the source file name should look like: `.java`. Let's\
    \ find out why. A compilation unit is what Java calls a source file. A text file\
    \ that contains one, or more, class definitions. Java compiler requires that source\
    \ files use the extension `.java`.\n\n### COMPILING\nExecute the compiler `javac`\
    \ to compile the `Example` program.\n\n```\nC.>javac Examples.java\n```\n\nThe\
    \ `javac` compiler creates an `example.class` file that contains the bytecode\
    \ version. The Java bytecode, which is an intermediate representation of your\
    \ program and contains instructions that the Java Virtual Machine will execute,\
    \ is what we discussed earlier. The output of `javac` therefore is not code that\
    \ can be directly executed.\n\nYou must use Java's application launcher (called\
    \ `java`) to actually run the program. As shown below, you need to pass the class\
    \ name `Example` as an argument on the command line.\n\n```\nC:\\>java Example\n\
    ```\n\nThe following output will be displayed when the program is executed:\n\
    This Java program is very simple.\n\n## THE IF STATEMENT\nThe Java `if` statement\
    \ functions in the same way as any other language's `IF` statement. It is syntactically\
    \ identical with the `if` statements of `C`, `C++` and `C#`. This is its simplest\
    \ form:\n\n`if(condition) statement;`\n\nThis is condition. It's a Boolean expression.\
    \ If `condition` is true, the statement will be executed.\n\nFalse condition means\
    \ that the statement can be ignored. Here's an example:\n\n```java\n/*\nThis Java\
    \ program is very simple.\nThis file is called \"IfSample.java\".\n*/\nclass IfSample\
    \ {\n    public static void main(String args[]) {\n        int x, y;\n       \
    \ if (x < 100) {\n            System.out.println(\"num is less than y\");\n  \
    \      }\n        if (x == y) {\n            System.out.println(\"x now equal\
    \ to y\");\n        }\n        if (x > y) {\n            System.out.println(\"\
    x now greater than y\");\n        }\n    }\n}\n```\n\n# Chapter 2: Data Types\
    \ and Variables\n\n## THE PRIMITIVE TYPES\nJava supports eight types of primitive:\
    \ `byte`, `short`, `int`, `long`, `char`, `float`, `double`; and `boolean`. Both\
    \ simple and primitive types are commonly used. You can group them into four categories:\n\
    \n* Integers: The group includes `byte`, `short`, `int` and `long` which are whole-valued\
    \ signed numbers.\n* Floating numbers: This group includes `double` and `float`,\
    \ which are numbers with fractional precision.\n\n### INTEGERS\nJava has four\
    \ types of integers: `byte`, `short`, `int` and `long`. All these integer types\
    \ can be signed and have positive or negative values. Java doesn't support unsigned\
    \ integers. Many other computer languages support both signed and unsigned integers.\
    \ Java's developers felt unsigned integers were unnecessary because they could\
    \ be used to describe the behavior of high-order bits, which define the sign of\
    \ an integer value. Java adds a special \"unsigned rightshift\" operator to clarify\
    \ the meaning of high-order bits. This eliminated the need for unsigned integer\
    \ type.\n\n### FLOATING POINT TYPES\nWhen evaluating expressions with fractional\
    \ precision, floating-point numbers (also known as real numbers) are used. Calculations\
    \ such as square root or transcendentals like sine and cosine can result in values\
    \ whose precision requires a point type. Java implements the standard (IEEE-754)\
    \ set of floating-point operators and types. There are two types of floating-point\
    \ types: `float` and `double`. These represent single- or double-precision numbers.\n\
    \n### CHARACTERS\nJava uses `char` as the data type to store characters. `C/C++`\
    \ programmers need to be aware that `char` in Java may not be the same as `C++`\
    \ or `C`. `C/C++` has `char` that is 8 bits in width. Java, however, does not\
    \ have this limitation. Java instead uses Unicode to represent characters. Unicode\
    \ is a fully international character set, which can represent all characters in\
    \ all human languages. Unicode is the unification of many character sets such\
    \ as Latin Greek, Arabic Cyrillic, Cyrillic Hebrew, Katakana and Hangul. It requires\
    \ 16 bits to accomplish this task. Java `char` is therefore a type of 16 bits.\
    \ A `char` can be anywhere from 0 to 65,536. There are no negative characters.\n\
    \n### BOOLEANS\nJava supports a primitive type called `boolean` for logical values.\
    \ It can only have one of the two possible values, true/false. This type is returned\
    \ by all relational operations, as in the case `a < b`. The type required by conditional\
    \ expressions such as `for` and `if` is `boolean`.\n"
