    SUPER


    The classes derived form Box were not implemented in the above examples as well
    as as as effectively as they could. BoxWeight''s constructor explicitly sets the
    BoxWeight width, height, depth fields ( ). This duplicate code is not only inefficient
    but also implies that subclasses must have access to these members. There will
    be occasions when you want to create a superclass which keeps its implementation
    details private (i.e., its data members). This would prevent a subclass from accessing
    or initializing these variables directly. Java has a solution for this problem,
    since encapsulation is an OOP primary attribute.


    CREATING A MULTILEVEL HIERARCHY


    We have used simple class hierarchies, which consist only of a superclass or subclass. You
    can create hierarchies with as many layers as you want. It is acceptable to use
    a subclass of another class as a superclass. If you have three classes A, B and
    C, then C could be a subclass or subclass of C. This type of situation means that
    each subclass inherits all the traits from all its superclasses. C inherits all
    aspects from A and B. The following program illustrates how a multilevel hierarchy
    is useful.


    CONSTRUCTORS ARE Dubbed


    In what order is the class hierarchy''s constructors called when it is created? If
    A is a subclass of B, and A is a superclass, how are A''s constructors called?
    Or vice versa. In a class hierarchy constructors are called in the order of their
    derivation from superclasses to subclasses. Super() must be executed first in
    subclass constructors. This order remains the same regardless of whether super(
    ) has been used. If super() isn''t used, the default or parameter-less constructor
    for each superclass will be executed.


    METHOD OVERRIDING


    If a method within a subclass has the exact same type signature and name as a
    superclass method, it is considered to be overriding the method in that superclass. If
    an overridden method can be called from within a class, it will always refer the
    subclass''s version. The superclass version will be hidden.


    DYNAMIC METHOD DISPATCH


    Although the examples shown in the previous section illustrate the mechanics and
    power of method overriding they don''t show it. If method overriding were limited
    to a name space convention, it would be a curiosity at best and of no real value. This
    is not true. Method overriding is the foundation for dynamic method dispatch,
    one of Java''s most powerful concepts. Dynamic method dispatch refers to the way
    that a call for an overridden method can be resolved at run-time, not compile
    time. This is the way Java implements runtime polymorphism. Dynamic method dispatch
    is crucial.


    WHY OVERRIDDEN METHODS?


    Overridden methods, as mentioned earlier, allow Java to support runtime polymorphism. Polymorphism
    is crucial to object-oriented programming because it allows a general type to
    specify methods that are common to all its derivatives while allowing subclasses
    the ability to define specific implementations of any or all of these methods. Java
    also implements polymorphism''s "one interface, many methods" concept by using
    overridden methods.


