    \n# 第 3 章：运算符\n\n## 基础算术运算符\n\n基础算术运算——加、减、乘、除——对于所有数值类型，其行为都符合你的预期。还有一种减运算符的一元形式，用于将其一个操作数取反。当除法运算符应用于整数类型时，其结果将不包含小数部分。\n\
