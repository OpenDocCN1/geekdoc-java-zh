    Both of these methods can be overloaded in many different ways. The methods return
    the index where the character or substring were found. If the method fails, it
    returns -1.


    ### Search Methods


    Use this search tool to find the first appearance of a particular character.


    ```java

    int indexOf (int ch).

    ```


    Use this tool to search for the last appearance of a character.


    ```java

    int lastIndexOf (int ch).

    ```


    Here, `ch` stands for the character being sought.


    Use this method to search for substrings that occur in their first or last instances.


    ```java

    int indexOf (String str)

    int lastIndexOf (String str).

    ```


    ### DATA CONVERSION USING VALUEOF ()


    `valueOf()`, which converts data from an internal format to a human-readable format,
    is a method. It is a static method, which is loaded within `String` for all Java''s
    built-in types. This allows each Java type to be properly converted into a string.
    `valueOf()` is also loaded for type `Object` so that any object you create can
    be used as argument. (Remember that `Object` is a superclass of all classes. Here
    are some examples of its forms:)


    ```java

    static String valueOf(double num)

    static String valueOf(long num)

    static String valueOf(Object ob)

    static String valueOf(char chars[ ])

    ```


    ### STRINGBUILDER


    J2SE 5 introduces a new string class into Java''s already impressive string handling
    capabilities. `StringBuilder` is the new class. It is identical to `StringBuffer`,
    except that it isn''t synchronized. This means it isn''t thread-safe. `StringBuilder`
    has a faster performance. `StringBuffer` is recommended for multithreading cases.

