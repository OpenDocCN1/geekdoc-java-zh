- fmt: "\n# USING BREAK TO EXIT LOOP\n\n`break` can be used to force the termination\
    \ of a loop. This bypasses the conditional expressions and any code that remains\
    \ in the loop's body. If a `break` statement is found within a loop, it terminates\
    \ the loop and program control is resumed at the next statement after the loop.\
    \ Here's an example:\n\n```java\n// Use break to exit a loop.\nclass BreakLoop\
    \ {\n    public static void main(String args[]) {\n        for (int i = 0; i <\
    \ 100; i++) {\n            if (i == 10) break; // Terminate loop if you are 10.\n\
    \            System.out.println(\"i: \" + i);\n        }\n        System.out.println(\"\
    Loop complete.\");\n    }\n}\n```\n\n## BREAK AS A FORMAT OF GOTO\n\nThe `break`\
    \ statement can be used to create a civilized version of the `goto` statements.\
    \ It is also useful with loops and `switch` statements. Java doesn't have a `goto`\
    \ clause because it allows you to branch in an unstructured and arbitrary way.\
    \ This makes it difficult to understand and maintain `goto`-ridden Java code.\
    \ This also prevents some compiler optimizations. However, there are a few instances\
    \ where the `goto` can be useful and legal for flow control. The `goto` is useful\
    \ in situations where you need to exit from a complex set of loops. Java provides\
    \ an extended form of the `break` statement to handle these situations. This form\
    \ of `break` allows you to break out of a block of code. These blocks do not have\
    \ to be in a loop. They can be any type of block.\n\n## CONTINUE\n\nSometimes,\
    \ it can be useful to force an earlier iteration of the loop. This means that\
    \ you may want to keep running the loop, but not process the rest of the code\
    \ within its body. This is essentially a `goto` that goes just beyond the body\
    \ of the loop to the end. This is accomplished by the `continue` statement. A\
    \ `continue` statement allows control to be transferred to the conditional expression\
    \ controlling the loop in `while` and `do-while` loops. `for` loops have control\
    \ transferred to the conditional expression and the iteration section of the `for`\
    \ statement. Any intermediate code is ignored for all three loops.\n\n# Chapter\
    \ 5: Inheritance\n\n## INHERITANCE\n\n### Basics\nYou can inherit a class by simply\
    \ incorporating the definition of one class into the other using the `extends`\
    \ keyword. Let's take a look at a quick example to show you how. This program\
    \ creates a superclass `A` and subclass `B`. You can see how the keyword `extends`\
    \ was used to create a subclass for `A`.\n\n```java\n// An example of inheritance.\n\
    // Create a Superclass.\nclass A {\n    int i, j;\n    void showij() {\n     \
    \   System.out.println(\"i and j: \" + i + \" \" + j);\n    }\n}\n\n// Create\
    \ a subclass of class A by extending it.\nclass B extends A {\n    int k;\n  \
    \  void showk() {\n        System.out.println(\"k: \" + k);\n    }\n    void sum()\
    \ {\n        System.out.println(\"i+j+k: \" + (i + j + k));\n    }\n}\n```\n\n\
    ### MEMBER ACCESS AND INHERITANCE\n\nA subclass can access all members of its\
    \ superclass even though it includes the entire superclass. However, the superclass\
    \ members that have been declared `private` cannot be accessed by the subclass.\
    \ Consider the following class hierarchy example:\n\nPrivate members are not included\
    \ in a class hierarchy. Private to their class. This program has an error. Compile.\n\
    \n```java\n/*\n// Create a Superclass.\nclass A {\n    int i; // public by default\n\
    \    private int j; // private A\n    void setij(int x, int y) {\n        i =\
