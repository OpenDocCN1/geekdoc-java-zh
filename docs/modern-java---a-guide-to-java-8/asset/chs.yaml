  \n祝编码愉快。\n\n# 在 Nashorn 中使用 Backbone.js\n\n2014 年 4 月 7 日\n\n本示例演示了如何将 `Backbone.js`\
  \ 模型与 Java 8 `Nashorn` 引擎结合。Nashorn 于 2014 年 3 月作为 Java SE 8 的发布，通过在 JVM 上原生运行 JavaScript\
  \ 代码扩展了 Java 的功能。对于 Java 开发者来说，Nashorn 在在服务器端复用客户端代码时可能特别有用。\n\n当使用现代的 JavaScript\
  \ [MVC](https://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller) 框架如\
  \ [Backbone.js](http://backbonejs.org/) 开发 HTML5 前端时，越来越多的代码从服务器后端移动到 Web 前端。Backbone\
  \ 允许你定义模型类并绑定到视图（例如 HTML 表单）。Backbone 在用户与 UI 交互时跟踪更新，反之亦然。它还帮助你与服务器同步模型，例如通过调用服务器端\
  \ REST 处理器的相应方法。因此，你最终会在前端中实现业务逻辑，而让服务器模型负责数据持久化。\n\n使用 Nashorn 在服务器端复用 Backbone\
  \ 模型非常简单，如下例所示。在开始之前，请确保你已经熟悉如何为 Nashorn 引擎编写 JavaScript，可以阅读我的 [Nashorn 教程]。\n\n\
  ### Java 模型\n\n\n\n\n\n首先，我们在 Java 代码中定义了一个领域类 `Product`。该类可能用于 CRUD 数据库操作（从数据源保存和从中加载数据）。请记住，这个类是一个没有包含任何业务逻辑的简单\
  \ Java Bean，因为我们希望前端能够直接在 UI 上执行业务逻辑。\n\n```java\nclass Product {\n    String name;\n\
  \    double price;\n    int stock;\n    double valueOfGoods;\n}\n```\n\n### 骨架模型\
  \ (Backbone Model)\n\n现在我们定义骨架模型作为 Java Bean 的对应物。骨架模型 `Product` 与 Java Bean 使用相同的数据结构，因为这是我们可能希望在\
  \ Java 服务器上持久化的数据。\n\n骨架模型还实现了业务逻辑：`getValueOfGoods` 方法通过将 `stock` 乘以 `price` 计算所有产品的值。每当\
  \ `stock` 或 `price` 变化时，属性 `valueOfGoods` 都必须重新计算。\n\n```javascript\nvar Product\
  \ = Backbone.Model.extend({\n    defaults: {\n        name: '',\n        stock:\
  \ 0,\n        price: 0.0,\n        valueOfGoods: 0.0\n    },\n\n    initialize:\
  \ function() {\n        this.on('change:stock change:price', function() {\n    \
  \        var stock = this.get('stock');\n            var price = this.get('price');\n\
  \            var valueOfGoods = this.getValueOfGoods(stock, price);\n          \
  \  this.set('valueOfGoods', valueOfGoods);\n        });\n    },\n\n    getValueOfGoods:\
  \ function(stock, price) {\n        return stock * price;\n    }\n});\n```\n\n由于骨架模型没有使用任何\
  \ Nashorn 语言扩展，我们可以安全地在客户端（浏览器）和服务器（Java）端使用相同的代码。\n\n请记住，为了演示目的，我故意选择了一个非常简单的函数。真实的业务逻辑应该更复杂。\n\
  \n### 将两者结合\n\n下一个目标是重用 Nashorn 中的骨架模型，例如在 Java 服务器上使用。我们希望实现以下行为：将 Java Bean 的所有属性绑定到骨架模型；计算属性\
  \ `valueOfGoods`；将结果传回 Java。\n\n首先，我们创建一个仅供 Nashorn 评估的新脚本，因此我们在这里安全地使用 Nashorn\
  \ 扩展：\n\n```javascript\nload('http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.6.0/underscore-min.js');\n\
  load('http://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js');\n\
  load('product-backbone-model.js');\n\nvar calculate = function(javaProduct) {\n\
  \    var model = new Product();\n    model.set('name', javaProduct.name);\n    model.set('price',\
  \ javaProduct.price);\n    model.set('stock', javaProduct.stock);\n    return model.attributes;\n\
  };\n```\n\n该脚本首先加载相关的外部脚本 [Underscore](http://underscorejs.org/) 和 [Backbone](http://backbonejs.org/)（Underscore\
  \ 是 Backbone 的前提条件）以及我们上面定义的 `Product` 骨架模型。\n\n`calculate` 函数接收一个 `Product` Java\
  \ Bean，将所有属性绑定到新创建的骨架 `Product` 中，并将模型的所有属性返回给调用者。通过在骨架模型上设置属性 `stock` 和 `price`，由于在模型的\
  \ `initialize` 构造函数中注册了事件处理器，属性 `valueOfGoods` 将被自动计算。\n\n最后，我们从 Java 中调用 `calculate`\
  \ 函数：\n\n```java\nProduct product = new Product();\nproduct.setName(\"Rubber\");\n\
  product.setPrice(1.99);\nproduct.setStock(1337);\n\nScriptObjectMirror result =\
  \ (ScriptObjectMirror)\n    invocable.invokeFunction(\"calculate\", product);\n\n\
  System.out.println(result.get(\"name\") + \": \" + result.get(\"valueOfGoods\"));\n\
  // Rubber: 2660.63\n```\n\n我们创建了一个新的 `Product` Java Bean 并将其传递给 JavaScript 函数。结果是\
  \ `getValueOfGoods` 方法会被触发，因此我们可以从返回的对象中读取属性 `valueOfGoods`。\n\n### 结论\n\n在 Nashorn\
  \ 引擎上重用现有的 JavaScript 库非常简单。Backbone 非常适合构建复杂的 HTML5 前端。在我看来，Nashorn 和 JVM 现在是 Node.js\
  \ 的极佳替代方案，因为你可以在 Nashorn 代码库中使用整个 Java 生态系统，例如整个 JDK API 以及所有可用的库和工具。请记住，在使用 Nashorn\
  \ 时并不局限于 Java 语言——可以考虑 Scala、Groovy、Clojure 甚至通过 `jjs` 使用纯 JavaScript。\n\n本文的可运行源代码[托管在\
  \ GitHub 上](https://github.com/winterbe/java8-tutorial)（参见[此文件](https://github.com/winterbe/java8-tutorial/blob/master/res/nashorn6.js)）。欢迎[fork\
  \ 仓库仓库](https://github.com/winterbe/java8-tutorial/fork) 或通过 [Twitter](https://twitter.com/winterbe_)\
  \ 向我提供反馈。\n\n"
