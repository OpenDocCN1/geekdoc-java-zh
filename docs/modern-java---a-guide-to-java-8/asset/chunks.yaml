  trans: "\n流（Stream）代表元素的序列，并支持各种类型的操作对这些元素执行计算：\n\n```\nList<String> myList =\n\
    \    Arrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"c1\");\n\nmyList\n    .stream()\n\
    \    .filter(s -> s.startsWith(\"c\"))\n    .map(String::toUpperCase)\n    .sorted()\n\
    \    .forEach(System.out::println);\n\n// C1\n// C2\n```\n\n流操作分为中间操作（intermediate）和终端操作（terminal）。中间操作返回一个流，因此我们可以在不使用分号的情况下链接多个中间操作。终端操作要么返回\
    \ `void`，要么返回非流的结果。在上面的示例中，`filter`、`map` 和 `sorted` 是中间操作，而 `forEach` 是终端操作。所有可用流操作的完整列表，请参阅\
    \ [Stream Javadoc](http://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html)。示例所示的流操作链被称为“操作流水线”（`operation\
    \ pipeline`）。\n\n大多数流操作接受某种 Lambda 表达式参数，即指定操作精确行为的函数接口。这些操作大部分必须同时是**非干扰的**（`non-interfering`）和**无状态的**（`stateless`）。这意味着什么？\n\
    \n如果函数没有修改流的底层数据源，则它就是[非干扰的](http://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html#NonInterference)，例如在上面的示例中，没有\
    \ Lambda 表达式通过从集合中添加或删除元素来修改 `myList`。\n\n如果操作的执行是确定性的，则它就是[无状态的](http://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html#Statelessness)，例如在上面的示例中，没有\
    \ Lambda 表达式依赖于外部作用范围内可能在执行期间变化的可变变量或状态。\n\n### 不同类型的流\n\n流可以从各种数据源创建，特别是集合。List\
    \ 和 Set 支持新方法 `stream()` 和 `parallelStream()`，用于创建顺序流或并行流。并行流能够在多线程上进行操作，将在本教程的后续章节中介绍。我们现在重点关注顺序流：\n\
    \n```\nArrays.asList(\"a1\", \"a2\", \"a3\")\n    .stream()\n    .findFirst()\n\
    \    .ifPresent(System.out::println);  // a1\n```\n\n在对象列表上调用 `stream()` 方法返回一个普通的对象流。但正如我们在下一个代码示例所示，我们不需要创建集合就可以操作流：\n\
    \n```\nStream.of(\"a1\", \"a2\", \"a3\")\n    .findFirst()\n    .ifPresent(System.out::println);\
    \  // a1\n```\n\n只需使用 `Stream.of()` 就能一组对象引用创建一个流。\n\n除了普通的对象流外，Java 8 还提供了用于处理原始数据类型\
    \ `int`、`long` 和 `double` 的特殊流。正如你可能猜到的，它们是 `IntStream`、`LongStream` 和 `DoubleStream`。\n\
    \n`IntStream` 可以利用 `IntStream.range()` 替换传统的 `for` 循环：\n\n```\nIntStream.range(1,\
    \ 4)\n    .forEach(System.out::println);\n\n// 1\n// 2\n// 3\n```\n\n所有这些原始流的工作方式与普通对象流类似，但区别在于：原始流使用专门的\
    \ Lambda 表达式，例如用 `IntFunction` 代替 `Function`，或用 `IntPredicate` 代替 `Predicate`。并且原始流支持额外的终端聚合操作\
    \ `sum()` 和 `average()`：\n\n```\nArrays.stream(new int[] {1, 2, 3})\n    .map(n\
    \ -> 2 * n + 1)\n    .average()\n    .ifPresent(System.out::println);  // 5.0\n\
    ```\n\n有时将普通对象流转换为原始流或反之是很有用的。为了此目的，对象流支持特殊的映射操作 `mapToInt()`、`mapToLong()` 和\
    \ `mapToDouble`：\n\n```\nStream.of(\"a1\", \"a2\", \"a3\")\n    .map(s -> s.substring(1))\n\
    \    .mapToInt(Integer::parseInt)\n    .max()\n    .ifPresent(System.out::println);\
    \  // 3\n```\n\n原始流可以通过 `mapToObj()` 转换为对象流：\n\n```\nIntStream.range(1, 4)\n \
    \   .mapToObj(i -> \"a\" + i)\n    .forEach(System.out::println);\n\n// a1\n//\
    \ a2\n// a3\n```\n\n这是一个组合示例：double 流首先被映射为 int 流，然后映射为字符串的对象流：\n\n```\nStream.of(1.0,\
    \ 2.0, 3.0)\n    .mapToInt(Double::intValue)\n    .mapToObj(i -> \"a\" + i)\n\
    \    .forEach(System.out::println);\n\n// a1\n// a2\n// a3\n```\n\n### 处理顺序\n\n\
    现在我们已经学习了如何创建和使用不同类型的流，让我们深入研究流操作在底层是如何处理的。\n\n中间操作的一个重要特性是**惰性**（laziness）。看这个缺少终端操作的示例：\n\
    \n```\nStream.of(\"d2\", \"a2\", \"b1\", \"b2\")\n    .filter(s -> {\n       \
    \ System.out.println(\"filter: \" + s);\n        return true;\n    })\n```\n（注：由于原文中存在大量重复和碎片化文本，此处根据逻辑流进行了整理。）\n"
- fmt: "\nNow, `map` is only called once so the operation pipeline performs much faster\
    \ for larger numbers of input elements. Keep that in mind when composing complex\
    \ method chains.\n\nLet's extend the above example by an additional operation,\
    \ `sorted`:\n\n```java\nStream.of(\"d2\", \"a2\", \"b1\", \"b3\", \"c\")\n   \
    \ .sorted((s1, s2) -> {\n        System.out.printf(\"sort: %s; %s\\n\", s1, s2);\n\
    \        return s1.compareTo(s2);\n    })\n    .filter(s -> {\n        System.out.println(\"\
    filter: \" + s);\n        return s.startsWith(\"a\");\n    })\n    .map(s -> {\n\
    \        System.out.println(\"map: \" + s);\n        return s.toUpperCase();\n\
    \    })\n    .forEach(s -> System.out.println(\"forEach: \" + s));\n```\n\nSorting\
    \ is a special kind of intermediate operation. It's a so called `stateful operation`\
    \ since in order to sort a collection of elements you have to maintain state during\
    \ ordering.\n\nExecuting this example results in the following console output:\n\
    \n```\nsort:    a2; d2\nsort:    b1; a2\nsort:    b1; d2\nsort:    b1; a2\nsort:\
    \    b3; b1\nsort:    b3; d2\nsort:    c; b3\nsort:    c; d2\nfilter:  a2\nmap:\
    \     a2\nforEach: A2\nfilter:  b1\nfilter:  b3\nfilter:  c\nfilter:  d2\n```\n\
    \nFirst, the sort operation is executed on the entire input collection. In other\
    \ words `sorted` is executed horizontally. So in this case `sorted` is called\
    \ eight times for multiple combinations on every element in the input collection.\n\
    \nOnce again we can optimize the performance by reordering the chain:\n\n```java\n\
    Stream.of(\"d2\", \"a2\", \"b1\", \"b3\", \"c\")\n    .filter(s -> {\n       \
    \ System.out.println(\"filter: \" + s);\n        return s.startsWith(\"a\");\n\
    \    })\n    .sorted((s1, s2) -> {\n        System.out.printf(\"sort: %s; %s\\\
    n\", s1, s2);\n        return s1.compareTo(s2);\n    })\n    .map(s -> {\n   \
    \     System.out.println(\"map: \" + s);\n        return s.toUpperCase();\n  \
    \  })\n    .forEach(s -> System.out.println(\"forEach: \" + s));\n\n// filter:\
    \  d2\n// filter:  a2\n// filter:  b1\n// filter:  b3\n// filter:  c\n// map:\
    \     a2\n// forEach: A2\n```\n\nIn this example `sorted` is never been called\
    \ because `filter` reduces the input collection to just one element. So the performance\
    \ is greatly increased for larger input collections.\n\n### Reusing Streams\n\n\
    Java 8 streams cannot be reused. As soon as you call any terminal operation the\
    \ stream is closed:\n\n```java\nStream<String> stream =\n    Stream.of(\"d2\"\
    , \"a2\", \"b1\", \"b3\", \"c\")\n        .filter(s -> s.startsWith(\"a\"));\n\
    \nstream.anyMatch(s -> true);    // ok\nstream.noneMatch(s -> true);   // exception\n\
    ```\n\nCalling `noneMatch` after `anyMatch` on the same stream results in the\
    \ following exception:\n\n```\njava.lang.IllegalStateException: stream has already\
    \ been operated upon or closed\n    at java.util.stream.AbstractPipeline.evaluate(AbstractPipeline.java:229)\n\
    \    at java.util.stream.ReferencePipeline.noneMatch(ReferencePipeline.java:459)\n\
    \    at com.winterbe.java8.Streams5.test7(Streams5.java:38)\n    at com.winterbe.java8.Streams5.main(Streams5.java:28)\n\
    ```\n\nTo overcome this limitation we have to to create a new stream chain for\
    \ every terminal operation we want to execute, e.g. we could create a stream supplier\
    \ to construct a new stream with all intermediate operations already set up:\n\
    \n```java\nSupplier<Stream<String>> streamSupplier =\n    () -> Stream.of(\"d2\"\
    , \"a2\", \"b1\", \"b3\", \"c\")\n            .filter(s -> s.startsWith(\"a\"\
    ));\n\nstreamSupplier.get().anyMatch(s -> true);   // ok\nstreamSupplier.get().noneMatch(s\
    \ -> true);  // ok\n```\n\nEach call to `get()` constructs a new stream on which\
    \ we are save to call the desired terminal operation.\n\n### Advanced Operations\n\
    \nStreams support plenty of different operations. We've already learned about\
    \ the most important operations like `filter` or `map`. I leave it up to you to\
    \ discover all other available operations (see [Stream Javadoc](http://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html)).\
    \ Instead let's dive deeper into the more complex operations `collect`, `flatMap`\
    \ and `reduce`.\n\nMost code samples from this section use the following list\
    \ of persons for demonstration purposes:\n\n```java\nclass Person {\n    String\
    \ name;\n    int age;\n\n    Person(String name, int age) {\n        this.name\
    \ = name;\n        this.age = age;\n    }\n\n    @Override\n    public String\
    \ toString() {\n        return name;\n    }\n}\n```\n\n#### Collect\n\nMost code\
    \ samples from this section use the following list of persons for demonstration\
    \ purposes: (see above)\n\n`collect` is a terminal operation to transform the\
    \ elements into a `list`, `set`, or `map`. This sounds complicated at first, but\
    \ we don't have to implement it yourself.\n\nThe next example joins all into a\
    \ list:\n\n```java\nList<Person> filtered =\n    persons\n        .stream()\n\
    \        .filter(p -> p.name.startsWith(\"P\"))\n        .collect(Collectors.toList());\n\
    \nSystem.out.println(filtered);    // [Peter]\n```\n\nNeed a set instead - use\
    \ `Collectors.toSet()`:\n\n```java\nSet<Person> set =\n    persons\n        .stream()\n\
    \        .collect(Collectors.toSet());\n```\n\nThe next example groups all persons\
    \ by age:\n\n```java\nMap<Integer, List<Person>> personsByAge =\n    persons\n\
    \    .stream()\n    .collect(Collectors.groupingBy(p -> p.age));\n\npersonsByAge\n\
    \    .forEach((age, p) -> System.out.format(\"age %s\\n\", age, p));\n\n// age\
    \ 18: [Max]\n// age 23: [Peter, Pamela]\n// age 12: [David]\n```\n\nIn order to\
    \ transform the stream elements into a map, we have to specify how both the keys\
    \ and the values should be mapped. Keep in mind that the mapped keys must be unique,\
    \ otherwise an `IllegalStateException` is thrown. You can optionally pass a merge\
    \ function as an additional parameter to bypass the exception:\n\n```java\nMap<Integer,\
    \ String> map =\n    persons.stream()\n    .collect(Collectors.toMap(\n      \
    \  p -> p.age,\n        p -> p.name,\n        (name1, name2) -> name1 + \";\"\
    \ + name2));\n\nSystem.out.println(map);\n// {18=Max, 23=Peter;Pamela, 12=David}\n\
    ```\n\nCollectors are extremely versatile. You can also create aggregations on\
    \ the stream, e.g. determining the average age of all:\n\n```java\nDouble averageAge\
    \ = persons\n    .stream()\n    .collect(Collectors.averagingInt(p -> p.age));\n\
    \nSystem.out.println(averageAge);     // 19.0\n```\n\nIf you're interested in\
    \ more comprehensive statistics, the summarizing collectors return a special statistics\
    \ object. So we can simply determine `min`, `max` and arithmetic `average` as\
    \ well as the `sum` and `count`.\n\n```java\nIntSummaryStatistics ageSummary =\n\
    \    persons\n        .stream()\n        .collect(Collectors.summarizingInt(p\
    \ -> p.age));\n\nSystem.out.println(ageSummary);\n// IntSummaryStatistics{count=4,\
    \ sum=76, min=12, average=19.000000, max=23}\n```\n\nThe join collector accepts\
    \ a delimiter as well as an optional prefix and suffix:\n\n```java\nString phrase\
    \ = persons\n    .stream()\n    .filter(p -> p.age >= 18)\n    .map(p -> p.name)\n\
    \    .collect(Collectors.joining(\" and \", \"In Germany \", \" are of legal age.\"\
    ));\n\nSystem.out.println(phrase);\n// In Germany Max and Pamela are of legal\
    \ age.\n```Now that we know some of the most powerful built-in collectors, let's\
    \ try to build our own special collector. We want to transform all persons of\
    \ the stream into a single string consisting of all names in upper letters separated\
    \ by the `|` pipe character. In order to achieve this we create a new collector\
    \ via `Collector.of()`. We have to pass the four ingredients of a collector: a\
    \ *supplier*, an *accumulator*, a *combiner* and a *finisher*.\n"
