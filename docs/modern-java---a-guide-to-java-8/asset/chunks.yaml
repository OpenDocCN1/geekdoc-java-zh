  trans: "\n\n流可以并行执行，以提高处理大量输入元素时的运行时性能。并行流使用通过静态方法 `ForkJoinPool.commonPool()` 可用的公共\
    \ `ForkJoinPool`。底层线程池的大小最多使用五个线程——取决于可用物理 CPU 核心的数量：\n\n```\nForkJoinPool commonPool\
    \ = ForkJoinPool.commonPool();\nSystem.out.println(commonPool.getParallelism());\
    \    // 3\n```\n\n在我的机器上，公共池默认初始化并行度为 3。可以通过设置以下 JVM 参数来减少或增加此值：\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\n集合（Collections）支持 `parallelStream()` 方法来创建元素的并行流。或者，你也可以在给定的流上调用中间方法 `parallel()`\
    \ 将顺序流转换为对应的并行流。\n\n为了理解并行流的并行执行行为，接下来的示例将当前线程的信息打印到 `sout` 中：\n\n```\nArrays.asList(\"\
    a1\", \"a2\", \"b1\", \"c2\", \"c1\")\n    .parallelStream()\n    .filter(s ->\
    \ {\n        System.out.format(\"filter: %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n\
    \        return true;\n    })\n    .map(s -> {\n        System.out.format(\"map:\
    \ %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n        return\
    \ s.toUpperCase();\n    })\n    .forEach(s -> System.out.format(\"forEach: %s\
    \ [%s]\\n\",\n        s, Thread.currentThread().getName()));\n```\n\n通过研究调试输出，我们应该更好地了解哪些线程实际上被用于执行流操作：\n\
    \n```\nfilter:  b1 [main]\nfilter:  a2 [ForkJoinPool.commonPool-worker-1]\nmap:\
    \     a2 [ForkJoinPool.commonPool-worker-1]\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\n\
    map:     c2 [ForkJoinPool.commonPool-worker-3]\nfilter:  c1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     c1 [ForkJoinPool.commonPool-worker-2]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A2 [ForkJoinPool.commonPool-worker-1]\nmap:     b1 [main]\nforEach: B1\
    \ [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-3]\nmap:     a1 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-3]\nforEach: C1 [ForkJoinPool.commonPool-worker-2]\n\
    ```\n\n如你所示，并行流利用了公共 `ForkJoinPool` 中的所有可用线程来执行流操作。连续运行的输出可能会有所不同，因为实际上使用哪个特定线程是非确定性的。\n\
    \n让我们通过增加一个流操作 `sort` 来扩展该示例：\n\n```\nArrays.asList(\"a1\", \"a2\", \"b1\", \"\
    c2\", \"c1\")\n    .parallelStream()\n    .filter(s -> {\n        System.out.format(\"\
    filter: %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n   \
    \     return true;\n    })\n    .map(s -> {\n        System.out.format(\"map:\
    \ %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n        return\
    \ s.toUpperCase();\n    })\n    .sorted((s1, s2) -> {\n        System.out.format(\"\
    sort: %s <> %s [%s]\\n\",\n            s1, s2, Thread.currentThread().getName());\n\
    \        return s1.compareTo(s2);\n    })\n    .forEach(s -> System.out.format(\"\
    forEach: %s [%s]\\n\",\n        s, Thread.currentThread().getName()));\n```\n\n\
    结果起初看起来可能很奇怪：\n\n```\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\nfilter:\
    \  c1 [ForkJoinPool.commonPool-worker-2]\nmap:     c1 [ForkJoinPool.commonPool-worker-2]\n\
    filter:  a2 [ForkJoinPool.commonPool-worker-1]\nmap:     a2 [ForkJoinPool.commonPool-worker-1]\n\
    filter:  b1 [main]\nmap:     b1 [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     a1 [ForkJoinPool.commonPool-worker-2]\nmap:     c2 [ForkJoinPool.commonPool-worker-3]\n\
    sort:    A2 <> A1 [main]\nsort:    B1 <> A2 [main]\nsort:    C2 <> B1 [main]\n\
    sort:    C1 <> C2 [main]\nsort:    C1 <> B1 [main]\nsort:    C1 <> C2 [main]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-1]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: B1 [main]\nforEach: A2 [ForkJoinPool.commonPool-worker-2]\nforEach: C1\
    \ [ForkJoinPool.commonPool-worker-1]\n```\n\n"
- fmt: "\nLearn all about the Nashorn Javascript Engine with easily understood code\
    \ examples. The Nashorn Javascript Engine is part of `Java SE 8` and competes\
    \ with other standalone engines like [Google V8](https://code.google.com/p/v8/)\
    \ (the engine that powers Google Chrome and [Node.js](http://nodejs.org/)). Nashorn\
    \ extends Javas capabilities by running dynamic javascript code natively on the\
    \ JVM.\n\nIn the next ~15 minutes you learn how to evaluate javascript on the\
    \ JVM dynamically during runtime. The most recent Nashorn language features are\
    \ demonstrated with small code examples. You learn how to call javascript functions\
    \ from java code and vice versa. At the end you're ready to integrate dynamic\
    \ scripts in your daily java business.\n\n![Baby Nashorn](nashorn.jpg \"Nashorn:\
    \ German rhinoceros\")\n\n**UPDATE** - I'm currently working on a JavaScript implementation\
    \ of the Java 8 Streams API for the browser. If I've drawn your interest check\
    \ out [Stream.js on GitHub](https://github.com/winterbe/streamjs). Your Feedback\
    \ is highly appreciated.\n\n## Using Nashorn\n\nThe Nashorn javascript engine\
    \ can either be used programmatically from java programs or by utilizing the command\
    \ line tool `jjs`, which is located in `$JAVA_HOME/bin`. If you plan to work with\
    \ `jjs` you might want to put a symbolic link for simple access:\n\n```\n$ cd\
    \ /usr/bin\n$ ln -s $JAVA_HOME/bin/jjs jjs\n$ jjs\njjs> print('Hello World');\n\
    ```\n\nThis tutorial focuses on using nashorn from java code, so let's skip `jjs`\
    \ for now. A simple HelloWorld in java code looks like this:\n\n```\nScriptEngine\
    \ engine = new ScriptEngineManager().getEngineByName(\"nashorn\");\nengine.eval(\"\
    print('Hello World!');\");\n```\n\nIn order to evaluate javascript code from java,\
    \ you first create a nashorn script engine by utilizing the `javax.script` package\
    \ already known from [Rhino](https://developer.mozilla.org/en-US/docs/Rhino) (Javas\
    \ legacy js engine from Mozilla).\n\nJavascript code can either be evaluated directly\
    \ by passing javascript code as a string as shown above. Or you can pass a file\
    \ reader pointing to your .js script file:\n\n```\nScriptEngine engine = new ScriptEngineManager().getEngineByName(\"\
    nashorn\");\nengine.eval(new FileReader(\"script.js\"));\n```\n\nNashorn javascript\
    \ is based on [ECMAScript 5.1](http://es5.github.io/) but future versions of nashorn\
    \ will include support for ECMAScript 6:\n\n> The current strategy for Nashorn\
    \ is to follow the ECMAScript specification. When we release with JDK 8 we will\
    \ be aligned with ECMAScript 5.1\\. The follow up major release of Nashorn will\
    \ align with [ECMAScript Edition 6](http://wiki.ecmascript.org/doku.php?id=harmony:specification_drafts).\n\
    \nNashorn defines a lot of language and API extensions to the ECMAScript standard.\
    \ But first let's take a look at how the communication between java and javascript\
    \ code works.\n\n## Invoking Javascript Functions from Java\n\nNashorn supports\
    \ the invocation of javascript functions defined in your script files directly\
    \ from java code. You can pass java objects as function arguments and return data\
    \ back from the function to the calling java method.\n\nThe following javascript\
    \ functions will later be called from the java side:\n\n```\nvar fun1 = function(name)\
    \ {\n    print('Hi there from Javascript, ' + name);\n    return \"greetings from\
    \ javascript\";\n};\n\nvar fun2 = function (object) {\n    print(\"JS Class Definition:\
    \ \" + Object.prototype.toString.call(object));\n};\n```\n\nIn order to call a\
    \ function you first have to cast the script engine to `Invocable`. The Invocable\
    \ interface is implemented by the `NashornScriptEngine` implementation and defines\
    \ a method `invokeFunction` to call a javascript function for a given name.\n\n\
    ```\nScriptEngine engine = new ScriptEngineManager().getEngineByName(\"nashorn\"\
    );\nengine.eval(new FileReader(\"script.js\"));\n\nInvocable invocable = (Invocable)\
    \ engine;\n\nObject result = invocable.invokeFunction(\"fun1\", \"Peter Parker\"\
    );\nSystem.out.println(result);\nSystem.out.println(result.getClass());\n\n//\
    \ Hi there from Javascript, Peter Parker\n// greetings from javascript\n// class\
    \ java.lang.String\n```\n\nExecuting the code results in three lines written to\
    \ the console. Calling the function `print` pipes the result to `System.out`,\
    \ so we see the javascript message first.\n\nNow let's call the second function\
    \ by passing arbitrary java objects:\n\n```\ninvocable.invokeFunction(\"fun2\"\
    , new Date());\n// [object java.util.Date]\n\ninvocable.invokeFunction(\"fun2\"\
    , LocalDateTime.now());\n// [object java.time.LocalDateTime]\n\ninvocable.invokeFunction(\"\
    fun2\", new Person());\n// [object com.winterbe.java8.Person]\n```\n\nJava objects\
    \ can be passed without loosing any type information on the javascript side. Since\
    \ the script runs natively on the JVM we can utilize the full power of the Java\
    \ API or external libraries on nashorn.\n\n## Invoking Java Methods from Javascript\n\
    \nInvoking java methods from javascript is quite easy. We first define a static\
    \ java method:\n\n```\nstatic String fun1(String name) {\n    System.out.format(\"\
    Hi there from Java, %s\", name);\n    return \"greetings from java\";\n}\n```\n\
    \nJava classes can be referenced from javascript via the `Java.type` API extension.\
    \ It's similar to importing classes in java code. As soon as the java type is\
    \ defined we naturally call the method.\n\n```\nvar MyJavaClass = Java.type('my.package.MyJavaClass');\n\
    \nvar result = MyJavaClass.fun1('John Doe');\nprint(result);\n\n// Hi there from\
    \ Java, John Doe\n// greetings from java\n```\n\nHow does Nashorn handle type\
    \ conversion when calling java methods? Let's find out with a simple example.\n\
    \n```\nstatic void fun2(Object object) {\n    System.out.println(object.getClass());\n\
    }\n```\n\nTo understand how type conversations are handled under the hood, we\
    \ call this method with different javascript types:\n\n```\nMyJavaClass.fun2(123);\n\
    // class java.lang.Integer\n\nMyJavaClass.fun2(49.99);\n// class java.lang.Double\n\
    \nMyJavaClass.fun2(true);\n// class java.lang.Boolean\n\nMyJavaClass.fun2(\"hi\
    \ there\")\n// class java.lang.String\n\nMyJavaClass.fun2(new Number(23));\n//\
    \ class jdk.nashorn.internal.objects.NativeNumber\n\nMyJavaClass.fun2(new Date());\n\
    // class jdk.nashorn.internal.objects.NativeDate\n\nMyJavaClass.fun2(new RegExp());\n\
    // class jdk.nashorn.internal.objects.NativeRegExp\n\nMyJavaClass.fun2({foo: 'bar'});\n\
    // class jdk.nashorn.internal.scripts.JO4\n```\n\nPrimitive javascript types are\
    \ converted to the appropriate java wrapper class. Instead native javascript objects\
    \ are represented by internal adapter classes. Please keep in mind that classes\
    \ from `jdk.nashorn.internal` are subject to change, so you shouldn't program\
    \ against those classes in client-code:\n\n> [Anything marked internal will likely\
    \ change out from underneath you.](https://twitter.com/wickund/status/451322409661259776)\n\
    \n## ScriptObjectMirror\n\nWhen passing native javascript objects to java you\
    \ can utilize the class `ScriptObjectMirror` which is actually a java representation\
    \ of the underlying javascript object. ScriptObjectMirror implements the map interface\
    \ and resides inside the package `jdk.nashorn.api`. Classes from this package\
    \ are intended to be used in client-code.\n\nThe next sample changes the parameter\
    \ type from `Object` to `ScriptObjectMirror` so we can extract some infos from\
    \ the passed javascript object:\n\n```\nstatic void fun3(ScriptObjectMirror mirror)\
    \ {\n    System.out.println(mirror.getClassName() + \": \" +\n        Arrays.toString(mirror.getOwnKeys(true)));\n\
    }\n```\n\nWhen passing an object hash to this method, the properties are accessible\
    \ on the java side:\n\n```\nMyJavaClass.fun3({\n    foo: 'bar',\n    bar: 'foo'\n\
    });\n\n// Object: [foo, bar]\n```\n\nWe can also call member functions on javascript\
    \ object from java. Let's first define a javascript type Person with properties\
    \ `firstName` and `lastName` and method `getFullName`.\n"
  raw: "Learn all about the Nashorn Javascript Engine with easily understood code\
    \ examples. The Nashorn Javascript Engine is part of Java SE 8 and competes with\
    \ other standalone engines like [Google V8](https://code.google.com/p/v8/) (the\
    \ engine that powers Google Chrome and [Node.js](http://nodejs.org/)). Nashorn\
    \ extends Javas capabilities by running dynamic javascript code natively on the\
    \ JVM.\n\nIn the next ~15 minutes you learn how to evaluate javascript on the\
    \ JVM dynamically during runtime. The most recent Nashorn language features are\
    \ demonstrated with small code examples. You learn how to call javascript functions\
    \ from java code and vice versa. At the end you're ready to integrate dynamic\
    \ scripts in your daily java business.\n\n![Baby Nashorn](nashorn.jpg \"Nashorn:\
    \ German rhinoceros\")\n\n***UPDATE** - I'm currently working on a JavaScript\
    \ implementation of the Java 8 Streams API for the browser. If I've drawn your\
    \ interest check out [Stream.js on GitHub](https://github.com/winterbe/streamjs).\
    \ Your Feedback is highly appreciated.*\n\n### Using Nashorn\n\nThe Nashorn javascript\
    \ engine can either be used programmatically from java programs or by utilizing\
    \ the command line tool `jjs`, which is located in `$JAVA_HOME/bin`. If you plan\
    \ to work with `jjs` you might want to put a symbolic link for simple access:\n\
    \n```\n$ cd /usr/bin\n$ ln -s $JAVA_HOME/bin/jjs jjs\n$ jjs\njjs> print('Hello\
    \ World');\n```\n\nThis tutorial focuses on using nashorn from java code, so let's\
    \ skip `jjs` for now. A simple HelloWorld in java code looks like this:\n\n```\n\
    ScriptEngine engine = new ScriptEngineManager().getEngineByName(\"nashorn\");\n\
    engine.eval(\"print('Hello World!');\");\n```\n\nIn order to evaluate javascript\
    \ code from java, you first create a nashorn script engine by utilizing the `javax.script`\
    \ package already known from [Rhino](https://developer.mozilla.org/en-US/docs/Rhino)\
    \ (Javas legacy js engine from Mozilla).\n\nJavascript code can either be evaluated\
    \ directly by passing javascript code as a string as shown above. Or you can pass\
    \ a file reader pointing to your .js script file:\n\n```\nScriptEngine engine\
    \ = new ScriptEngineManager().getEngineByName(\"nashorn\");\nengine.eval(new FileReader(\"\
    script.js\"));\n```\n\nNashorn javascript is based on [ECMAScript 5.1](http://es5.github.io/)\
    \ but future versions of nashorn will include support for ECMAScript 6:\n\n> The\
    \ current strategy for Nashorn is to follow the ECMAScript specification. When\
    \ we release with JDK 8 we will be aligned with ECMAScript 5.1\\. The follow up\
    \ major release of Nashorn will align with [ECMAScript Edition 6](http://wiki.ecmascript.org/doku.php?id=harmony:specification_drafts).\n\
    \nNashorn defines a lot of language and API extensions to the ECMAScript standard.\
    \ But first let's take a look at how the communication between java and javascript\
    \ code works.\n\n### Invoking Javascript Functions from Java\n\nNashorn supports\
    \ the invocation of javascript functions defined in your script files directly\
    \ from java code. You can pass java objects as function arguments and return data\
    \ back from the function to the calling java method.\n\nThe following javascript\
    \ functions will later be called from the java side:\n\n```\nvar fun1 = function(name)\
    \ {\n    print('Hi there from Javascript, ' + name);\n    return \"greetings from\
    \ javascript\";\n};\n\nvar fun2 = function (object) {\n    print(\"JS Class Definition:\
    \ \" + Object.prototype.toString.call(object));\n};\n```\n\nIn order to call a\
    \ function you first have to cast the script engine to `Invocable`. The Invocable\
    \ interface is implemented by the `NashornScriptEngine` implementation and defines\
    \ a method `invokeFunction` to call a javascript function for a given name.\n\n\
    ```\nScriptEngine engine = new ScriptEngineManager().getEngineByName(\"nashorn\"\
    );\nengine.eval(new FileReader(\"script.js\"));\n\nInvocable invocable = (Invocable)\
    \ engine;\n\nObject result = invocable.invokeFunction(\"fun1\", \"Peter Parker\"\
    );\nSystem.out.println(result);\nSystem.out.println(result.getClass());\n\n//\
    \ Hi there from Javascript, Peter Parker\n// greetings from javascript\n// class\
    \ java.lang.String\n```\n\nExecuting the code results in three lines written to\
    \ the console. Calling the function `print` pipes the result to `System.out`,\
    \ so we see the javascript message first.\n\nNow let's call the second function\
    \ by passing arbitrary java objects:\n\n```\ninvocable.invokeFunction(\"fun2\"\
    , new Date());\n// [object java.util.Date]\n\ninvocable.invokeFunction(\"fun2\"\
    , LocalDateTime.now());\n// [object java.time.LocalDateTime]\n\ninvocable.invokeFunction(\"\
    fun2\", new Person());\n// [object com.winterbe.java8.Person]\n```\n\nJava objects\
    \ can be passed without loosing any type information on the javascript side. Since\
    \ the script runs natively on the JVM we can utilize the full power of the Java\
    \ API or external libraries on nashorn.\n\n### Invoking Java Methods from Javascript\n\
    \nInvoking java methods from javascript is quite easy. We first define a static\
    \ java method:\n\n```\nstatic String fun1(String name) {\n    System.out.format(\"\
    Hi there from Java, %s\", name);\n    return \"greetings from java\";\n}\n```\n\
    \nJava classes can be referenced from javascript via the `Java.type` API extension.\
    \ It's similar to importing classes in java code. As soon as the java type is\
    \ defined we naturally call the static method `fun1()` and print the result to\
    \ `sout`. Since the method is static, we don't have to create an instance first.\n\
    \n```\nvar MyJavaClass = Java.type('my.package.MyJavaClass');\n\nvar result =\
    \ MyJavaClass.fun1('John Doe');\nprint(result);\n\n// Hi there from Java, John\
    \ Doe\n// greetings from java\n```\n\nHow does Nashorn handle type conversion\
    \ when calling java methods with native javascript types? Let's find out with\
    \ a simple example.\n\nThe following java method simply prints the actual class\
    \ type of the method parameter:\n\n```\nstatic void fun2(Object object) {\n  \
    \  System.out.println(object.getClass());\n}\n```\n\nTo understand how type conversations\
    \ are handled under the hood, we call this method with different javascript types:\n\
    \n```\nMyJavaClass.fun2(123);\n// class java.lang.Integer\n\nMyJavaClass.fun2(49.99);\n\
    // class java.lang.Double\n\nMyJavaClass.fun2(true);\n// class java.lang.Boolean\n\
    \nMyJavaClass.fun2(\"hi there\")\n// class java.lang.String\n\nMyJavaClass.fun2(new\
    \ Number(23));\n// class jdk.nashorn.internal.objects.NativeNumber\n\nMyJavaClass.fun2(new\
    \ Date());\n// class jdk.nashorn.internal.objects.NativeDate\n\nMyJavaClass.fun2(new\
    \ RegExp());\n// class jdk.nashorn.internal.objects.NativeRegExp\n\nMyJavaClass.fun2({foo:\
    \ 'bar'});\n// class jdk.nashorn.internal.scripts.JO4\n```\n\nPrimitive javascript\
    \ types are converted to the appropriate java wrapper class. Instead native javascript\
    \ objects are represented by internal adapter classes. Please keep in mind that\
    \ classes from `jdk.nashorn.internal` are subject to change, so you shouldn't\
    \ program against those classes in client-code:\n\n> [Anything marked internal\
    \ will likely change out from underneath you.](https://twitter.com/wickund/status/451322409661259776)\n\
    \n### ScriptObjectMirror\n\nWhen passing native javascript objects to java you\
    \ can utilize the class `ScriptObjectMirror` which is actually a java representation\
    \ of the underlying javascript object. ScriptObjectMirror implements the map interface\
    \ and resides inside the package `jdk.nashorn.api`. Classes from this package\
    \ are intended to be used in client-code.\n\nThe next sample changes the parameter\
    \ type from `Object` to `ScriptObjectMirror` so we can extract some infos from\
    \ the passed javascript object:\n\n```\nstatic void fun3(ScriptObjectMirror mirror)\
    \ {\n    System.out.println(mirror.getClassName() + \": \" +\n        Arrays.toString(mirror.getOwnKeys(true)));\n\
    }\n```\n\nWhen passing an object hash to this method, the properties are accessible\
    \ on the java side:\n\n```\nMyJavaClass.fun3({\n    foo: 'bar',\n    bar: 'foo'\n\
    });\n\n// Object: [foo, bar]\n```\n\nWe can also call member functions on javascript\
    \ object from java. Let's first define a javascript type Person with properties\
    \ `firstName` and `lastName` and method `getFullName`."
