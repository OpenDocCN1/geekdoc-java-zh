    executor.submit(readTask);\n\nstop(executor);\n```\n\nObtaining a read or write\
    \ lock via `readLock()` or `writeLock()` returns a stamp which is later used for\
    \ unlocking within the finally block. Keep in mind that stamped locks don't implement\
    \ reentrant characteristics. Each call to lock returns a new stamp and blocks\
    \ if no lock is available even if the same thread already holds a lock. So you\
    \ have to pay particular attention not to run into deadlocks.\n\nJust like in\
    \ the previous `ReadWriteLock` example both read tasks have to wait until the\
    \ write lock has been released. Then both read tasks print to the console simultaneously\
    \ because multiple reads doesn't block each other as long as no write-lock is\
    \ held.\n\nThe next example demonstrates *optimistic locking*:\n\n```\nExecutorService\
    \ executor = Executors.newFixedThreadPool(2);\nStampedLock lock = new StampedLock();\n\
    \nexecutor.submit(() -> {\n    long stamp = lock.tryOptimisticRead();\n    try\
    \ {\n        System.out.println(\"Optimistic Lock Valid: \" + lock.validate(stamp));\n\
    \        sleep(1);\n        System.out.println(\"Optimistic Lock Valid: \" + lock.validate(stamp));\n\
    \        sleep(2);\n        System.out.println(\"Optimistic Lock Valid: \" + lock.validate(stamp));\n\
    \    } finally {\n        lock.unlock(stamp);\n    }\n});\n\nexecutor.submit(()\
    \ -> {\n    long stamp = lock.writeLock();\n    try {\n        System.out.println(\"\
    Write Lock acquired\");\n        sleep(2);\n    } finally {\n        lock.unlock(stamp);\n\
    \        System.out.println(\"Write done\");\n    }\n});\n\nstop(executor);\n\
    ```\n\nAn optimistic read lock is acquired by calling `tryOptimisticRead()` which\
    \ always returns a stamp without blocking the current thread, no matter if the\
    \ lock is actually available. If there's already a write lock active the returned\
    \ stamp equals zero. You can always check if a stamp is valid by calling `lock.validate(stamp)`.\n\
    \nExecuting the above code results in the following output:\n\n```\nOptimistic\
    \ Lock Valid: true\nWrite Lock acquired\nOptimistic Lock Valid: false\nWrite done\n\
    Optimistic Lock Valid: false\n```\n\nThe optimistic lock is valid right after\
    \ acquiring the lock. In contrast to normal read locks an optimistic lock doesn't\
    \ prevent other threads to obtain a write lock instantaneously. After sending\
    \ the first thread to sleep for one second the second thread obtains a write lock\
    \ without waiting for the optimistic read lock to be released. From this point\
    \ the optimistic read lock is no longer valid. Even when the write lock is released\
    \ the optimistic read locks stays invalid.\n\nSo when working with optimistic\
    \ locks you have to validate the lock every time *after* accessing any shared\
    \ mutable variable to make sure the read was still valid.\n\nSometimes it's useful\
    \ to convert a read lock into a write lock without unlocking and locking again.\
    \ `StampedLock` provides the method `tryConvertToWriteLock()` for that purpose\
    \ as seen in the next sample:\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    StampedLock lock = new StampedLock();\n\nexecutor.submit(() -> {\n    long stamp\
    \ = lock.readLock();\n    try {\n        if (count == 0) {\n            stamp\
    \ = lock.tryConvertToWriteLock(stamp);\n            if (stamp == 0L) {\n     \
    \           System.out.println(\"Could not convert to write lock\");\n       \
    \         stamp = lock.writeLock();\n            }\n            count = 23;\n\
    \        }\n        System.out.println(count);\n    } finally {\n        lock.unlock(stamp);\n\
    \    }\n});\n\nstop(executor);\n```"
