  trans: "\n下一个示例演示了如何在目录或其子目录查找文件。\n\n```\nPath start = Paths.get(\"\");\nint maxDepth\
    \ = 5;\ntry (Stream<Path> stream = Files.find(start, maxDepth, (path, attr) ->\n\
    \        String.valueOf(path).endsWith(\".js\"))) {\n    String joined = stream\n\
    \        .sorted()\n        .map(String::valueOf)\n        .collect(Collectors.joining(\"\
    ; \"));\n    System.out.println(\"Found: \" + joined);\n}\n```\n\n`find` 方法接受三个参数：目录路径\
    \ `start` 是初始起点，`maxDepth` 定义了要搜索的最大文件夹深度。第三个参数是一个匹配谓词，它定义了搜索逻辑。在上面的示例中，我们搜索所有的\
    \ JavaScript 文件（文件名以 `.js` 结尾）。\n\n我们可以通过利用 `Files.walk` 方法来实现相同的行为。该方法不是传递搜索谓词，而是直接遍历任何文件。\n\
    \n```\nPath start = Paths.get(\"\");\nint maxDepth = 5;\ntry (Stream<Path> stream\
    \ = Files.walk(start, maxDepth)) {\n    String joined = stream\n        .map(String::valueOf)\n\
    \        .filter(path -> path.endsWith(\".js\"))\n        .sorted()\n        .collect(Collectors.joining(\"\
    ; \"));\n    System.out.println(\"walk(): \" + joined);\n}\n```\n\n在这个示例中，我们使用流操作\
    \ `filter` 来实现与上一个示例相同的行为。\n\n## 读取和写入文件\n\n在 Java 8 中，将文本文件读取到内存中并将字符串写入文本文件终于是一项简单的任务。不再需要处理复杂的读取器和写入器。`Files.readAllLines`\
    \ 方法将给定文件的所有行读取到字符串列表中。你可以简单地修改此列表并通过 `Files.write` 将行写入另一个文件：\n\n```\nList<String>\
    \ lines = Files.readAllLines(Paths.get(\"res/nashorn1.js\"));\nlines.add(\"print('foobar\"\
    );\");\nFiles.write(Paths.get(\"res/nashorn1-modified.js\"), lines);\n```\n\n\
    请记住，这些方法并不是内存高效的，因为整个文件会被读取到内存中。文件越大，占用的堆内存就越多。\n\n作为一种内存高效的替代方案，你可以使用 `Files.lines`\
    \ 方法。该方法不是一次性将所有行读入内存，而是通过函数式流逐行读取并流式处理每一行。\n\n```\ntry (Stream<String> stream\
    \ = Files.lines(Paths.get(\"res/nashorn1.js\"))) {\n    stream\n        .filter(line\
    \ -> line.contains(\"print\"))\n        .map(String::trim)\n        .forEach(System.out::println);\n\
    }\n```\n\n如果你需要更细粒度的控制，可以构建一个新的缓冲器：\n\n```\nPath path = Paths.get(\"res/nashorn1.js\"\
    );\ntry (BufferedReader reader = Files.newBufferedReader(path)) {\n    System.out.println(reader.readLine());\n\
    }\n```\n\n或者在你想写入文件时，只需构建一个缓冲写入器即可：\n\n```\nPath path = Paths.get(\"res/output.js\"\
    );\ntry (BufferedWriter writer = Files.newBufferedWriter(path)) {\n    writer.write(\"\
    print('Hello World');\");\n}\n```\n\n缓冲读取器也可以访问函数式流。`lines` 方法会根据缓冲读取器指示的所有行构造一个函数式流：\n\
    \n```\nPath path = Paths.get(\"res/nashorn1.js\");\ntry (BufferedReader reader\
    \ = Files.newBufferedReader(path)) {\n    long countPrints = reader\n        .lines()\n\
    \        .filter(line -> line.contains(\"print\"))\n        .count();\n    System.out.println(countPrints);\n\
    }\n```\n\n如你所见，Java 8 提供了三种简单的方法来读取文本，使得文本处理变得非常方便。遗憾的是，你必须使用 `try/with` 显式关闭函数式流，这使得代码仍然显得很杂乱。我本希望函数式流在调用\
    \ `count` 或 `collect` 等终端操作时会自动关闭，因为你无法调用两次终端操作。\n\n# 在 Java 8 中避免空值检查\n\n2015\
    \ 年 3 月 15 日\n\n如何在 Java 中防止著名的 `NullPointerException`？这是每个初学者早晚都会问到的关键问题之一。但中级和专家级程序员也会经常遇到这种错误。它是\
    \ Java 以及许多其他语言中最常见的错误类型。\n\n空引用的发明者 `Tony Hoare` 在 2009 年表达了道歉，并将这类错误称为“十亿美元的错误”。\n\
    \n> 我称之为我的十亿美元的错误。它是 1965 年发明的空引用。当时，我正在为一种面向对象的语言 (ALGOL) 设计第一个全面的引用类型系统。我的目标是确保所有引用的使用都是绝对安全的，并由编译器执行检查。但我无法抵制放入空引用的诱惑，仅仅是因为它很容易实现。这导致了无数的错误、漏洞和系统崩溃，在过去的四十年里，这可能造成了十亿美元的痛苦和损失。\n\
    \n总之，我们必须处理它。那么我们能做什么来完全防止 Null 呢？显而易见的答案是随处添加空值检查。由于空检查相当繁琐且痛苦，许多语言添加了特殊的语法通过`空合并运算符`来处理空值检查——在\
    \ `Groovy` 或 `Kotlin` 等语言中也称为`埃尔维运算符`。\n\n遗憾的是， Java 没有提供这种语法糖。但幸运的是，Java 8 版本中情况变得好起来。这篇文章描述了如何利用\
    \ Java 8 的新特性（如 Lambda 表达式）来避免编写空检查的技术。\n\n### 提高 Java 8 中的空安全性\n\n我已经在另一篇文章中展示了我们如何利用\
    \ Java 8 的 `Optional` 类型来防止空检查。这里是原始文章中的示例代码。\n\n假设我们有如下分级类结构：\n\n```\nclass Outer\
    \ {\n    Nested nested;\n    Nested getNested() {\n        return nested;\n  \
    \  }\n}\nclass Nested {\n    Inner inner;\n    Inner getInner() {\n        return\
    \ inner;\n    }\n}\nclass Inner {\n    String foo;\n    String getFoo() {\n  \
    \      return foo;\n    }\n}\n```\n\n在这种结构中解析深层嵌套路径可能会很尴尬。我们必须编写大量的空检查来确保不会抛出\
    \ `NullPointerException`：\n\n```\nOuter outer = new Outer();\nif (outer != null\
    \ && outer.nested != null && outer.nested.inner != null) {\n    System.out.println(outer.nested.inner.foo);\n\
    }\n```\n\n我们可以利用 Java 8 的 `Optional` 类型来消除所有这些空检查。`map` 方法接受 `Function` 类型的 Lambda\
    \ 表达式，并自动将每个函数结果封装在 `Optional` 中。这使我们能够连续调用多个 `map` 操作。空值检查在底层自动处理。\n\n```\nOptional.of(new\
    \ Outer())\n    .map(Outer::getNested)\n    .map(Nested::getInner)\n    .map(Inner::getFoo)\n\
    \    .ifPresent(System.out::println);\n```\n\n实现相同行为的另一种方法是利用提供者函数来解析嵌套路径：\n\n\
    ```\nOuter obj = new Outer();\nresolve(() -> obj.getNested().getInner().getFoo());\n\
    \    .ifPresent(System.out::println);\n```\n\n调用 `obj.getNested().getInner().getFoo()`\
    \ 可能会抛出 `NullPointerException`。在这种情况下，异常会被捕获，方法返回 `Optional.empty()`。\n\n"
- fmt: "\n```java\npublic static <T> Optional<T> resolve(Supplier<T> resolver) {\n\
    \    try {\n        T result = resolver.get();\n        return Optional.ofNullable(result);\n\
    \    }\n    catch (NullPointerException e) {\n        return Optional.empty();\n\
    \    }\n}\n```\n\nPlease keep in mind that both solutions are probably not as\
    \ performant as traditional null checks. In most cases that shouldn't be much\
    \ of an issue.\n\nAs usual the above code samples are [hosted on GitHub](https://github.com/winterbe/java8-tutorial).\n\
    \nHappy coding!\n\n> UPDATE: I've updated the code samples thanks to a hint from\
    \ [Zukhramm](http://www.reddit.com/user/Zukhramm) on Reddit.\n\n# Fixing Java\
    \ 8 Stream Gotchas with IntelliJ IDEA\n\nMarch 05, 2015\n\nJava 8 has been released\
    \ almost one year ago in March 2014. At [Pondus](http://www.pondus.de) we've managed\
    \ to update all of our production servers to this new version back in May 2014.\
    \ Since then we've migrated major parts of our code base to [lambda expressions](posts/2014/03/16/java-8-tutorial),\
    \ [streams](posts/2014/07/31/java8-stream-tutorial-examples) and the new Date\
    \ API. We also use [Nashorn](posts/2014/04/05/java8-nashorn-tutorial) to dynamically\
    \ script parts of our application which may change during runtime.\n\nThe most\
    \ used feature besides lambdas is the new Stream API. Collection operations are\
    \ all around the place in almost any codebase I've ever seen. And Streams are\
    \ a great way to improve code readability of all those collection crunching.\n\
    \nBut one thing about streams really bothers me: Streams only provide a few terminal\
    \ operations like `reduce` and `findFirst` directly while others are only accessible\
    \ via `collect`. There's a utility class [Collectors](projects/java8-explorer),\
    \ providing a bunch of convenient collectors like `toList`, `toSet`, `joining`\
    \ and `groupingBy`.\n\nFor example this code filters over a collection of strings\
    \ and creates a new list:\n\n```\nstringCollection\n    .stream()\n    .filter(e\
    \ -> e.startsWith(\"a\"))\n    .collect(Collectors.toList());\n```\n\nAfter migrating\
    \ a project with 300k lines of code to streams I can say that `toList`, `toSet`\
    \ and `groupingBy` are by far the most used terminal operations in our project.\
    \ So I really cannot understand the design decision not to integrate those methods\
    \ directly into the `Stream` interface so you could just write:\n\n```\nstringCollection\n\
    \    .stream()\n    .filter(e -> e.startsWith(\"a\"))\n    .toList();\n```\n\n\
    This might look like a minor imperfection at first but it gets really annoying\
    \ if you have to use this kind of stuff over and over again.\n\nThere's a method\
    \ `toArray()` but no `toList()`. So I really hope some of the more convenient\
    \ collectors will make it's way into the `Stream` interface in Java 9. [Brian](https://twitter.com/briangoetz)?\
    \ ಠ_ಠ\n\n> As a side note: [Stream.js](https://github.com/winterbe/streamjs) is\
    \ a JavaScript port of the Java 8 Streams API for the browser and addresses the\
    \ described issue nicely. All important terminal operations are directly accessible\
    \ on the stream itself for convenience. See the [API doc](https://github.com/winterbe/streamjs/blob/master/APIDOC.md#groupingbykeymapper)\
    \ for details.\n\nAnyways. [IntelliJ IDEA](https://www.jetbrains.com/idea/) claims\
    \ to be the most intelligent Java IDE. So let's see how we can utilize IDEA to\
    \ solve this problem for us.\n\n## IntelliJ IDEA to the rescue\n\nIntelliJ IDEA\
    \ comes with a handy feature called Live Templates. If you don't already know\
    \ what it is: Live Templates are shortcuts for commonly used code snippets. E.g.\
    \ you type `sout` + tabulator and IDEA inserts the code snippet `System.out.println()`.\
    \ Read [here](https://www.jetbrains.com/idea/help/live-templates.html) to learn\
    \ more about it.\n\nHow does Live Templates help with the problem described above?\
    \ Actually we can simply create our own Live Templates for all the commonly used\
    \ default Stream collectors. E.g. we can create a Live Template with the abbreviation\
    \ `.toList` to insert the appropriate collector `.collect(Collectors.toList())`\
    \ automatically.\n\nThis is how it looks like in action:\n\n![Live Template Streams\
    \ 1](img/livetemplate-streams1.gif)\n\n## Set up your own Live Templates\n\nLet's\
    \ see how we can set this up. First go to Settings and choose Live Templates in\
    \ the menu to the left. You can also use the handy filter input at the top left\
    \ of the dialog.\n\n![Live Template Settings](livetemplate-settings.png)\n\nNext\
    \ we can create a new group called `Stream` via the `+` icon on the right. Next\
    \ we add all of our stream-related Live Templates to this group. I'm using the\
    \ default collectors `toList`, `toSet`, `groupingBy` and `join` quite commonly,\
    \ so I create a new Live Template for each of those methods.\n\nThis part is **important**:\
    \ After adding a new Live Template you have to specify the applicable context\
    \ at the bottom of the dialog. You have to choose `Java` → `Other`. Afterwards\
    \ you define the abbreviation, a description and the actual template code.\n\n\
    ```\n// Abbreviation: .toList\n.collect(Collectors.toList())\n\n// Abbreviation:\
    \ .toSet\n.collect(Collectors.toSet())\n\n// Abbreviation: .join\n.collect(Collectors.joining(\"\
    $END$\"))\n\n// Abbreviation: .groupBy\n.collect(Collectors.groupingBy(e -> $END$))\n\
    ```\n\nThe special variable `$END$` determines the cursors position after using\
    \ the template, so you can directly start typing at this position, e.g. to define\
    \ the joining delimiter.\n\n> Hint: You should enable the option \"Add unambiguous\
    \ imports on the fly\" so IDEA automatically adds an import statement to `java.util.stream.Collectors`.\
    \ The option is located in: *Editor* → *General* → *Auto Import*\n\nLet's see\
    \ those two templates in action:\n\n### Join\n\n![Live Template Streams 2](livetemplate-streams2.gif)\n\
    \n### GroupBy\n\n![Live Template Streams 3](livetemplate-streams3.gif)\n\nLive\
    \ Templates in IntelliJ IDEA are an extremely versatile and powerful tool. You\
    \ can greatly increase your coding productivity with it. Do you know other examples\
    \ where Live Templates can save your? [Let me know](contact)!\n\nStill not satisfied?\
    \ Learn everything you wanted to know about Java 8 Streams in my [Streams Tutorial](posts/2014/07/31/java8-stream-tutorial-examples).\n\
    \nHappy coding.\n\n# Using Backbone.js with Nashorn\n\nApril 07, 2014\n\nThis\
    \ example demonstrates how to use `Backbone.js` models with the Java 8 `Nashorn`\
    \ `Javascript` Engine. First released in March 2014 as part of Java SE 8, Nashorn\
    \ extends Javas capabilities by running javascript code natively on the JVM. For\
    \ java web developers Nashorn might be especially useful for re-using client-side\
    \ code on the java server. Traditionally [Node.js](http://nodejs.org/) was in\
    \ a clear advantage, but Nashorns possibilities might close the gap to the JVM.\n\
    \nWhen working with modern javascript [MVC](https://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller)\
    \ frameworks like [Backbone.js](http://backbonejs.org/) for HTML5 front-ends,\
    \ more and more code moves from the server back-end to the web front-end. This\
    \ approach can greatly increase the user experience because you safe a lot of\
    \ server-roundtrips when using business logic from your views.\n\nBackbone enables\
    \ you to define model classes which can be bound to views (e.g. HTML forms). Backbone\
    \ keeps track of updating the model when the user interacts with the UI and vice\
    \ versa. It also aids you by synchronizing your model with the server, e.g. by\
    \ calling the appropriate method of your REST handler on the server side. So you\
    \ end up implementing business logic in your front-end code, leaving your server\
    \ model responsible for persisting data.\n\nReusing backbone models on the server\
    \ side is quite easy with Nashorn, as the following example will demonstrate.\
    \ Before we start make sure you're familiar with writing javascript for the Nashorn\
    \ Engine by reading my [Nashorn Tutorial](posts/2014/04/05/java8-nashorn-tutorial).\n\
    \n### The Java Model\n"
