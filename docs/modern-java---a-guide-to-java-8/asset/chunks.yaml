    \ 移植。\n\n让我们先看看顺序流是如何工作的。首先我们以字符串列表的形式创建一个示例源：\n\n```\nList<String> stringCollection\
    \ = new ArrayList<>();\nstringCollection.add(\"ddd2\");\nstringCollection.add(\"\
    aaa2\");\nstringCollection.add(\"bbb1\");\nstringCollection.add(\"aaa1\");\nstringCollection.add(\"\
    bbb3\");\nstringCollection.add(\"ccc\");\nstringCollection.add(\"bbb2\");\nstringCollection.add(\"\
    ddd1\");\n```\n\nJava 8 中的集合经过了扩展，因此你可以通过调用 `Collection.stream()` 或 `Collection.parallelStream()`\
    \ 直接创建流。后续章节将解释常用的流操作。\n\n### 过滤 (Filter)\n\nFilter 接受一个谓词来过滤流中的所有元素。该操作是中间操作，允许我们在结果上调用另一个流操作（forEach）。forEach\
    \ 接受一个消费者，并在过滤后的流的每个元素上执行。forEach 是一个终结操作。它是 `void`，所以我们不能调用另一个流操作。\n\n```\nstringCollection\n\
    \    .stream()\n    .filter((s) -> s.startsWith(\"a\"))\n    .forEach(System.out::println);\n\
    \n// \"aaa2\", \"aaa1\"\n```\n\n"
- fmt: "\n`Sorted` is an *intermediate* operation which returns a sorted view of the\
    \ stream. The elements are sorted in natural order unless you pass a custom `Comparator`.\n\
    \n```\nstringCollection\n    .stream()\n    .sorted()\n    .filter((s) -> s.startsWith(\"\
    a\"))\n    .forEach(System.out::println);\n\n// \"aaa1\", \"aaa2\"\n```\n\nKeep\
    \ in mind that `sorted` does only create a sorted view of the stream without manipulating\
    \ the ordering of the backed collection. The ordering of `stringCollection` is\
    \ untouched:\n\n```\nSystem.out.println(stringCollection);\n// ddd2, aaa2, bbb1,\
    \ aaa1, bbb3, ccc, bbb2, ddd1\n```\n\n### Map\n\nThe *intermediate* operation\
    \ `map` converts each element into another object via the given function. The\
    \ following example converts each string into an upper-cased string. But you can\
    \ also use `map` to transform each object into another type. The generic type\
    \ of the resulting stream depends on the generic type of the function you pass\
    \ to `map`.\n\n```\nstringCollection\n    .stream()\n    .map(String::toUpperCase)\n\
    \    .sorted((a, b) -> b.compareTo(a))\n    .forEach(System.out::println);\n\n\
    // \"DDD2\", \"DDD1\", \"CCC\", \"BBB3\", \"BBB2\", \"AAA2\", \"AAA1\"\n```\n\n\
    ### Match\n\nVarious matching operations can be used to check whether a certain\
    \ predicate matches the stream. All of those operations are *terminal* and return\
    \ a boolean result.\n\n```\nboolean anyStartsWithA =\n    stringCollection\n \
    \       .stream()\n        .anyMatch((s) -> s.startsWith(\"a\"));\n\nSystem.out.println(anyStartsWithA);\
    \      // true\n\nboolean allStartsWithA =\n    stringCollection\n        .stream()\n\
    \        .allMatch((s) -> s.startsWith(\"a\"));\n\nSystem.out.println(allStartsWithA);\
    \      // false\n\nboolean noneStartsWithZ =\n    stringCollection\n        .stream()\n\
    \        .noneMatch((s) -> s.startsWith(\"z\"));\n\nSystem.out.println(noneStartsWithZ);\
    \      // true\n```\n\n### Count\n\n`Count` is a *terminal* operation returning\
    \ the number of elements in the stream as a `long`.\n\n```\nlong startsWithB =\n\
    \    stringCollection\n        .stream()\n        .filter((s) -> s.startsWith(\"\
    b\"))\n        .count();\n\nSystem.out.println(startsWithB);    // 3\n```\n\n\
    ### Reduce\n\nThis *terminal* operation performs a reduction on the elements of\
    \ the stream with the given function. The result is an `Optional` holding the\
    \ reduced value.\n\n```\nOptional<String> reduced =\n    stringCollection\n  \
    \      .stream()\n        .sorted()\n        .reduce((s1, s2) -> s1 + \"#\" +\
    \ s2);\n\nreduced.ifPresent(System.out::println);\n// \"aaa1#aaa2#bbb1#bbb2#bbb3#ccc#ddd1#ddd2\"\
    \n```\n\n## Parallel Streams\n\nAs mentioned above streams can be either sequential\
    \ or parallel. Operations on sequential streams are performed on a single thread\
    \ while operations on parallel streams are performed concurrently on multiple\
    \ threads.\n\nThe following example demonstrates how easy it is to increase the\
    \ performance by using parallel streams.\n\nFirst we create a large list of unique\
    \ elements:\n\n```\nint max = 1000000;\nList<String> values = new ArrayList<>(max);\n\
    for (int i = 0; i < max; i++) {\n    UUID uuid = UUID.randomUUID();\n    values.add(uuid.toString());\n\
    }\n```\n\nNow we measure the time it takes to sort a stream of this collection.\n\
    \n### Sequential Sort\n\n```\nlong t0 = System.nanoTime();\n\nlong count = values.stream().sorted().count();\n\
    System.out.println(count);\n\nlong t1 = System.nanoTime();\n\nlong millis = TimeUnit.NANOSECONDS.toMillis(t1\
    \ - t0);\nSystem.out.println(String.format(\"sequential sort took: %d ms\", millis));\n\
    \n// sequential sort took: 899 ms\n```\n\n### Parallel Sort\n\n```\nlong t0 =\
    \ System.nanoTime();\n\nlong count = values.parallelStream().sorted().count();\n\
    System.out.println(count);\n\nlong t1 = System.nanoTime();\n\nlong millis = TimeUnit.NANOSECONDS.toMillis(t1\
    \ - t0);\nSystem.out.println(String.format(\"parallel sort took: %d ms\", millis));\n\
    \n// parallel sort took: 472 ms\n```\n\nAs you can see both code snippets are\
    \ almost identical but the parallel sort is roughly 50% faster. All you have to\
    \ do is change `stream()` to `parallelStream()`.\n\n## Maps\n\nAs already mentioned\
    \ maps do not directly support streams. There's no `stream()` method available\
    \ on the `Map` interface itself, however you can create specialized streams upon\
    \ the keys, values or entries of a map via `map.keySet().stream()`, `map.values().stream()`\
    \ and `map.entrySet().stream()`.\n\nFurthermore maps support various new and useful\
    \ methods for doing common tasks.\n\n```\nMap<Integer, String> map = new HashMap<>();\n\
    \nfor (int i = 0; i < 10; i++) {\n    map.putIfAbsent(i, \"val\" + i);\n}\n\n\
    map.forEach((id, val) -> System.out.println(val));\n```\n\nThe above code should\
    \ be self-explaining: `putIfAbsent` prevents us from writing additional if null\
    \ checks; `forEach`.\n\n## Date API\n\nJava 8 contains a brand new date and time\
    \ API under the `java.time`. The following examples cover the most important parts\
    \ of this.\n\n### Clock\n\n`Clock` provides access to the current date and time.\
    \ Clocks are aware of a timezone and may be used instead of `System.currentTimeMillis()`\
    \ to retrieve the current time in milliseconds. Such an instantaneous point on\
    \ the timeline is also represented by the class `Instant`. Instants can be used\
    \ to create legacy `java.util.Date` objects.\n\n```\nClock clock = Clock.systemDefaultZone();\n\
    long millis = clock.millis();\n\nInstant instant = clock.instant();\nDate legacyDate\
    \ = Date.from(instant);   // legacy java.util.Date\n```\n\n### Timezones\n\nTimezones\
    \ are represented by a `ZoneId`. They can easily be accessed via static factory\
    \ methods. Timezones define the offsets which are important to convert instants\
    \ and local dates and times.\n\n```\nSystem.out.println(ZoneId.getAvailableZoneIds());\n\
    // prints all available timezone ids\n\nZoneId zone1 = ZoneId.of(\"Europe/Berlin\"\
    );\nZoneId zone2 = ZoneId.of(\"Brazil/East\");\nSystem.out.println(zone1.getRules());\n\
    System.out.println(zone2.getRules());\n\n// ZoneRules[currentStandardOffset=+01:00]\n\
    // ZoneRules[currentStandardOffset=-03:00]\n```\n\n### LocalTime\n\n`LocalTime`\
    \ represents a time without a timezone, e.g. 10pm or 17:30:15. The following example\
    \ creates two local times for the timezones defined above. Then we compare both\
    \ times and calculate the difference in hours and minutes between both times.\n\
    \n```\nLocalTime now1 = LocalTime.now(zone1);\nLocalTime now2 = LocalTime.now(zone2);\n\
    \nSystem.out.println(now1.isBefore(now2));  // false\n\nlong hoursBetween = ChronoUnit.HOURS.between(now1,\
    \ now2);\nlong minutesBetween = ChronoUnit.MINUTES.between(now1, now2);\n\nSystem.out.println(hoursBetween);\
    \       // -3\nSystem.out.println(minutesBetween);     // -239\n```\n\n`LocalTime`\
    \ comes with various factory methods to simplify the creation of new instances,\
    \ including parsing of time strings.\n"
