  trans: "\n当多线程的更新操作多于读取操作时，该类通常比原子数字（atomic numbers）更优。这在获取统计数据时很常见，例如你想统计 Web 服务器处理的请求数。`LongAdder`\
    \ 的缺点是内存消耗更高，因为它在内存中保留了一组变量。\n\n### LongAccumulator\n\nLongAccumulator 是 `LongAdder`\
    \ 的更通用版本。`LongAccumulator` 类不是执行简单的加法操作，而是围绕一个类型为 `LongBinaryOperator` 的 Lambda\
    \ 表达式构建的，如下面的代码示例所示：\n\n```\nLongBinaryOperator op = (x, y) -> 2 * x + y;\nLongAccumulator\
    \ accumulator = new LongAccumulator(op, 1L);\n\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    \nIntStream.range(0, 10)\n    .forEach(i -> executor.submit(() -> accumulator.accumulate(i)));\n\
    \nstop(executor);\n\nSystem.out.println(accumulator.getThenReset());     // =>\
    \ 2539\n```\n\n我们创建了一个函数为 `2 * x + y` 且初始值为 1 的 `LongAccumulator`。每次调用 `accumulate(i)`\
    \ 时，当前结果和值 `i` 都会作为参数传递给 Lambda 表达式。\n\n`LongAccumulator` 与 `LongAdder` 一样，内部维护了一组变量以减少线程间的竞争。\n\
    \n### ConcurrentMap\n\n`ConcurrentMap` 接口扩展了 map 接口，定义了最实用的并发集合类型之一。Java 8 通过向此接口添加新方法引入了函数式编程。\n\
    \n在接下来的代码段中，我们使用以下示例 map 来演示这些新方法：\n\n```\nConcurrentMap<String, String> map =\
    \ new ConcurrentHashMap<>();\nmap.put(\"foo\", \"bar\");\nmap.put(\"han\", \"\
    solo\");\nmap.put(\"r2\", \"d2\");\nmap.put(\"c3\", \"p0\");\n```\n\n`forEach()`\
    \ 方法接受一个类型为 `BiConsumer` 的 Lambda 表达式，并将 map 的键（key）和值（value）作为参数传递。它可以替代 for-each\
    \ 循环来遍历并发 map 的条目。迭代在当前线程上顺序执行。\n\n```\nmap.forEach((key, value) -> System.out.printf(\"\
    %s = %s\\n\", key, value));\n```\n\n`putIfAbsent()` 方法仅在给定键不存在值时才将新值放入 map 中。至少对于\
    \ `ConcurrentHashMap` 的实现，该方法与 `put()` 一样是线程安全的，因此在从不同线程并发访问 map 时不需要同步：\n\n```\n\
    String value = map.putIfAbsent(\"c3\", \"p1\");\nSystem.out.println(value);  \
    \  // p0\n```\n\n`getOrDefault()` 方法返回给定键对应的值。如果该键不存在条目，则返回传递的默认值：\n\n```\nString\
    \ value = map.getOrDefault(\"hi\", \"there\");\nSystem.out.println(value);   \
    \ // there\n```\n\n`replaceAll()` 方法接受一个类型为 `BiFunction` 的 Lambda 表达式。BiFunction\
    \ 接受两个参数并返回一个单值。在这种情况下，该函数使用每个 map 条目的键和值进行调用，并返回一个新值来赋值给当前键：\n\n```\nmap.replaceAll((key,\
    \ value) -> \"r2\".equals(key) ? \"d3\" : value);\nSystem.out.println(map.get(\"\
    r2\"));    // d3\n```\n\n与其替换 map 的所有值，不如用 `compute()` 转换单个条目。该方法同时接受要计算的键和一个用于指定值转换的二\
    \ get 函数：\n\n```\nmap.compute(\"foo\", (key, value) -> value + value);\nSystem.out.println(map.get(\"\
    foo\"));   // barbar\n```\n\n除了 `compute()` 之外，还有两个变体：`computeIfAbsent()` 和 `computeIfPresent()`。这些方法的函数式参数只在键分别不存在或存在时才被调用。\n\
    \n最后，利用 `merge()` 方法可以将一个新值与 map 中的现有值合并。`merge` 接受一个键、要合并到现有条目中的新值以及一个用于指定两个值合并行为的双\
    \ get 函数：\n\n```\nmap.merge(\"foo\", \"boo\", (oldVal, newVal) -> newVal + \"\
    \ was \" + oldVal);\nSystem.out.println(map.get(\"foo\"));   // boo was foo\n\
    ```\n\n### ConcurrentHashMap\n\n上述所有方法都是 `ConcurrentMap` 接口的一部分，因此对该接口的所有实现都可用。此外，最重要的实现\
    \ `ConcurrentHashMap` 进一步通过几个新方法进行了增强，以便在 map 上执行并行操作。\n\n与并行流（parallel streams）一样，这些方法使用了\
    \ Java 8 通过 `ForkJoinPool.commonPool()` 提供的特殊 `ForkJoinPool`。该池使用取决于可用核心数的预设并行度。我的机器上有四个\
    \ CPU 核心，这导致并行度为三：\n\n```\nSystem.out.println(ForkJoinPool.getCommonPoolParallelism());\
    \  // 3\n```\n\n可以通过设置以下 JVM 参数来减少或增加此值：\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\n我们使用相同的示例 map 用于演示，但这次操作的是具体实现 `ConcurrentHashMap` 而不是接口 `ConcurrentMap`，因此我们可以访问该类的所有公共方法：\n\
    \n```\nConcurrentHashMap<String, String> map = new ConcurrentHashMap<>();\n...\
    \ (省略部分代码以保持一致)\n```\n"
- fmt: "\nThe method `reduce()` already known from Java 8 Streams accepts two lambda\
    \ expressions of type `BiFunction`. The first function transforms each key-value\
    \ pair into a single value of any type. The second function combines all those\
    \ transformed values into a single result, ignoring any possible `null` values.\n\
    \n```\nString result = map.reduce(1,\n    (key, value) -> {\n        System.out.println(\"\
    Transform: \" + Thread.currentThread().getName());\n        return key + \"=\"\
    \ + value;\n    },\n    (s1, s2) -> {\n        System.out.println(\"Reduce: \"\
    \ + Thread.currentThread().getName());\n        return s1 + \", \" + s2;\n   \
    \ });\n\nSystem.out.println(\"Result: \" + result);\n\n// Transform: ForkJoinPool.commonPool-worker-2\n\
    // Transform: main\n// Transform: ForkJoinPool.commonPool-worker-3\n// Reduce:\
    \ ForkJoinPool.commonPool-worker-3\n// Transform: main\n// Reduce: main\n// Reduce:\
    \ main\n// Result: r2=d2, c3=p0, han=solo, foo=bar\n```\n\nI hope you've enjoyed\
    \ reading the third part of my tutorial series about Java 8 Concurrency. The code\
