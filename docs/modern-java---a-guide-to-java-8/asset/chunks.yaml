    \ .forEach(f.bars::add))\n    .flatMap(f -> f.bars.stream())\n    .forEach(b ->\
    \ System.out.println(b.name));\n```\n\nFlatMap is also available for the `Optional`\
    \ class introduced in Java 8\\. Optionals `flatMap` operation returns an optional\
    \ object of another type. So it can be utilized to prevent nasty `null` checks.\n\
    \nThink of a highly hierarchical structure like this:\n\n```\nclass Outer {\n\
