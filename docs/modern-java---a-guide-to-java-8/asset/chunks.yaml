  trans: "\n\n通过简单易懂的代码示例，全面学习 Nashorn JavaScript 引擎。Nashorn JavaScript 引擎是 `Java\
    \ SE 8` 的一部分，并与其他独立引擎竞争，如 [Google V8](https://code.google.com/p/v8/)（驱动 Google\
    \ Chrome 和 [Node.js](http://nodejs.org/)）的引擎）。Nashorn 通过在 JVM 上原生运行动态 JavaScript\
    \ 代码来扩展 Java 的功能。\n\n在接下来的约 15 分钟内，你将学习如何在运行时动态地在 JVM 上评估 JavaScript。我们将通过短代码示例演示最新的\
    \ Nashorn 语言特性。你将学习如何从 Java 代码调用 JavaScript 函数，反之亦然。最后，你将准备好将动态脚本到你的日常 Java 业务中。\n\
    \n![Baby Nashorn](img/nashorn.jpg \"Nashorn: 德国犀牛\")\n\n**更新** - 我目前正在为浏览器实现一个\
    \ Java 8 Streams API 的 JavaScript 版本。如果你感兴趣，请查看 GitHub 上的 [Stream.js](https://github.com/winterbe/streamjs)。非常感谢你的反馈。\n\
    \n## 使用 Nashorn\n\nNashorn JavaScript 引擎既可以通过 Java 程序以编程方式使用，也可以通过位于 `$JAVA_HOME/bin`\
    \ 的命令行工具 `jjs` 使用。如果你计划使用 `jjs`，你可能想创建一个符号链接以便于访问：\n\n```\n$ cd /usr/bin\n$ ln\
    \ -s $JAVA_HOME/bin/jjs jjs\n$ jjs\njjs> print('Hello World');\n```\n\n本教程侧重于在\
    \ Java 代码中使用 nashorn，所以我们暂时跳过 `jjs`。Java 代码中简单的 HelloWorld 如下所示：\n\n```\nScriptEngine\
    \ engine = new ScriptEngineManager().getEngineByName(\"nashorn\");\nengine.eval(\"\
    print('Hello World!');\");\n```\n\n为了从 Java 评估 JavaScript 代码，你首先需要利用 `javax.script`\
    \ 包（已在 [Rhino](https://developer.mozilla.org/en-US/docs/Rhino)（Mozilla 的遗留 JS\
    \ 引擎）可知）创建一个 nashorn 脚本引擎。\n\nJavaScript 代码可以像上面那样通过将 JavaScript 代码作为字符串传递来直接评估。或者你可以传递一个指向\
    \ .js 脚本文件的读取器：\n\n```\nScriptEngine engine = new ScriptEngineManager().getEngineByName(\"\
    nashorn\");\nengine.eval(new FileReader(\"script.js\"));\n```\n\nNashorn JavaScript\
    \ 基于 [ECMAScript 5.1](http://es5.github.io/)，但 nashorn 的未来版本将包含对 ECMAScript 6\
    \ 的支持：\n\n> Nashorn 的当前策略是遵循 ECMAScript 规范。当我们发布 JDK 8 时，我们将与 ECMAScript 5.1 对齐。Nashorn\
    \ 的下一个大版本将与 [ECMAScript 第 6 版](http://wiki.ecmascript.org/doku.php?id=harmony:specification_drafts)\
    \ 对齐。\n\nNashorn 为 ECMAScript 标准了许多语言和 API 扩展。让我们先来看看 Java 和 JavaScript 代码之间的通信是如何工作的。\n\
    \n## 从 Java 用 JavaScript 函数\n\nNashorn 支持直接从 Java 代码调用在脚本文件中定义的 JavaScript 函数。你可以将\
    \ Java 对象作为函数参数传递，并将数据从函数返回给调用 Java 方法。\n\n以下 JavaScript 函数稍后将从 Java 端调用：\n\n\
    ```\nvar fun1 = function(name) {\n    print('Hi there from Javascript, ' + name);\n\
    \    return \"greetings from javascript\";\n};\n\nvar fun2 = function (object)\
    \ {\n    print(\"JS Class Definition: \" + Object.prototype.toString.call(object));\n\
    };\n```\n\n为了调用函数，你必须先将脚本引擎转换为 `Invocable`。`Invocable` 接口由 `NashornScriptEngine`\
    \ 实现，并定义了一个方法 `invokeFunction` 来调用给定名称的 JavaScript 函数。\n\n```\nScriptEngine engine\
    \ = new ScriptEngineManager().getEngineByName(\"nashorn\");\nengine.eval(new FileReader(\"\
    script.js\"));\n\nInvocable invocable = (Invocable) engine;\n\nObject result =\
    \ invocable.invokeFunction(\"fun1\", \"Peter Parker\");\nSystem.out.println(result);\n\
    System.out.println(result.getClass());\n\n// Hi there from Javascript, Peter Parker\n\
    // greetings from javascript\n// class java.lang.String\n```\n\n执行代码会在控制台输出三行内容。调用函数\
    \ `print`会将结果传递到 `System.out`，所以我们先看到 JavaScript 的消息。\n\n现在让我们通过传递任意 Java 对象来调用第二个函数：\n\
    \n```\ninvocable.invokeFunction(\"fun2\", new Date());\n// [object java.util.Date]\n\
    \ninvocable.invokeFunction(\"fun2\", LocalDateTime.now());\n// [object java.time.LocalDateTime]\n\
    \ninvocable.invokeFunction(\"fun2\", new Person());\n// [object com.winterbe.java8.Person]\n\
    ```\n\n传递 Java 对象时不会在 JavaScript 端丢失任何类型信息。由于脚本在 JVM 上原生运行，我们可以在 nashorn 上充分利用\
    \ Java API 或外部库的所有功能。\n\n## 从 JavaScript 调用 Java 方法\n\n从 JavaScript 调用 Java 方法非常简单。我们首先定义一个静态\
    \ Java 方法：\n\n```\nstatic String fun1(String name) {\n    System.out.format(\"\
    Hi there from Java, %s\", name);\n    return \"greetings from java\";\n}\n```\n\
    \n可以通过 `Java.type` API 扩展从 JavaScript 引用 Java 类。这类似于在 Java 代码中导入类。一旦定义了 Java 类型，我们自然而然地调用该方法。\n\
    \n```javascript\nvar MyJavaClass = Java.type('my.package.MyClass');\n\nvar result\
    \ = MyJavaClass.fun1('John Doe');\nprint(result);\n\n// Hi there from Java, John\
    \ Doe\n// greetings from java\n```\n\nNashorn 在调用 Java 方法时如何处理类型转换？让我们通过一个简单的示例来发现：\n\
    \n```\nstatic void fun2(Object object) {\n    System.out.println(object.getClass());\n\
    }\n```\n\n为了了解底层如何处理类型，我们用不同的 JavaScript 类型调用此方法：\n\n```\nMyJavaClass.fun2(123);\n\
    // class java.lang.Integer\n\nMyJavaClass.fun2(49.99);\n// class java.lang.Double\n\
    \nMyJavaClass.fun2(true);\n// class java.lang.Boolean\n\nMyJavaClass.fun2(\"hi\
    \ there\")\n// class java.lang.String\n\nMyJavaClass.fun2(new Number(23));\n//\
    \ class jdk.nashorn.internal.objects.NativeNumber\n\nMyJavaClass.fun2(new Date());\n\
    // class jdk.nashorn.internal.objects.NativeDate\n\nMyJavaClass.fun2(new RegExp());\n\
    // class jdk.nashorn.internal.objects.NativeRegExp\n\nMyJavaClass.fun2({foo: 'bar'});\n\
    // class jdk.nashorn.internal.scripts.JO4\n```\n\n原生 JavaScript 类型被转换为相应的 Java\
    \ 包装类。相反，原生 JavaScript 对象由内部适配器类表示。请记住，来自 `jdk.nashorn.internal` 的类可能会发生变化，因此不要在客户端代码中这些类进行编程：\n\
    \n> [标记为 internal 的内容可能会在你脚下发生变化](https://twitter.com/wickund/status/451322409661259776)\n\
    \n## ScriptObjectMirror\n\n将原生 JavaScript 对象传递给 Java 时，你可以利用 `ScriptObjectMirror`\
    \ 类，它实际上是底层 JavaScript 对象的 Java 表示。`ScriptObjectMirror` 实现了 map 接口并位于 `jdk.nashorn.api`\
    \ 包中。该包中的类供客户端代码。\n\n下一个示例将参数类型从 `Object` 更改为 `ScriptObjectMirror`，以便从传递的 JavaScript\
    \ 对象中提取一些信息：\n\n```\nstatic void fun3(ScriptObjectMirror mirror) {\n    System.out.println(mirror.getClassName()\
    \ + \": \" +\n        Arrays.toString(mirror.getOwnKeys(true)));\n}\n```\n\n当向此方法传递对象哈希时，属性在\
    \ Java 端是可用的：\n\n```\nMyJavaClass.fun3({\n    foo: 'bar',\n    bar: 'foo'\n});\n\
    \n// Object: [foo, bar]\n```\n\n我们还可以从 Java 调用 JavaScript 对象的成员函数。让我们先定义一个 JavaScript\
    \ 类型 Person，它具有 `firstName` 和 `lastName` 属性以及 `getFullName` 方法。\n\n"
- fmt: "\n```javascript\nfunction Person(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n    this.getFullName = function()\
    \ {\n        return this.firstName + \" \" + this.lastName;\n    }\n}\n```\n\n\
    The javascript method `getFullName` can be called on the `ScriptObjectMirror`\
    \ via `callMember()`.\n\n```javascript\nstatic void fun4(ScriptObjectMirror person)\
    \ {\n    System.out.println(\"Full Name is: \" + person.callMember(\"getFullName\"\
    ));\n}\n```\n\nWhen passing a new person to the java method, we see the desired\
    \ result on the console:\n\n```javascript\nvar person1 = new Person(\"Peter\"\
    , \"Parker\");\nMyJavaClass.fun4(person1);\n\n// Full Name is: Peter Parker\n\
    ```\n\nLanguage Extensions\n\nNashorn defines various language and API extensions\
    \ to the ECMAScript standard. Let's head right into the most recent features:\n\
    \n#### Typed Arrays\n\nNative javascript arrays are untyped. Nashorn enables you\
    \ to use typed java arrays in javascript:\n\n```javascript\nvar IntArray = Java.type(\"\
    int[]\");\n\nvar array = new IntArray(5);\narray[0] = 5;\narray[1] = 4;\narray[2]\
    \ = 3;\narray[3] = 2;\narray[4] = 1;\n\ntry {\n    array[5] = 23;\n} catch (e)\
    \ {\n    print(e.message);  // Array index out of range: 5\n}\n\narray[0] = \"\
    17\";\nprint(array[0]);  // 17\n\narray[0] = \"wrong type\";\nprint(array[0]);\
    \  // 0\n\narray[0] = \"17.3\";\nprint(array[0]);  // 17\n```\n\nThe `int[]` array\
    \ behaves like a real java int array. But additionally Nashorn performs implicit\
    \ type conversions under the hood when we're trying to add non-integer values\
    \ to the array. Strings will be auto-converted to int which is quite handy.\n\n\
    #### Collections and For Each\n\nInstead of messing around with arrays we can\
    \ use any java collection. First define the java type via `Java.type`, then create\
    \ new instances on demand.\n\n```javascript\nvar ArrayList = Java.type('java.util.ArrayList');\n\
    var list = new ArrayList();\nlist.add('a');\nlist.add('b');\nlist.add('c');\n\n\
    for each (var el in list) print(el);  // a, b, c\n```\n\nIn order to iterate over\
    \ collections and arrays Nashorn introduces the `for each` statement. It works\
    \ just like the foreach loop in java.\n\nHere's another collection foreach example,\
    \ utilizing `HashMap`:\n\n```javascript\nvar map = new java.util.HashMap();\n\
    map.put('foo', 'val1');\nmap.put('bar', 'val2');\n\nfor each (var e in map.keySet())\
    \ print(e);  // foo, bar\n\nfor each (var e in map.values()) print(e);  // val1,\
    \ val2\n```\n\n#### Lambda expressions and Streams\n\nEveryone loves lambdas and\
    \ streams - so does Nashorn! Although ECMAScript 5.1 lacks the compact arrow syntax\
    \ from the Java 8 lambda expressions, we can use function literals where ever\
    \ lambda expressions are accepted.\n\n```javascript\nvar list2 = new java.util.ArrayList();\n\
    list2.add(\"ddd2\");\nlist2.add(\"aaa2\");\nlist2.add(\"bbb1\");\nlist2.add(\"\
    aaa1\");\nlist2.add(\"bbb3\");\nlist2.add(\"ccc\");\nlist2.add(\"bbb2\");\nlist2.add(\"\
    ddd1\");\n\nlist2\n    .stream()\n    .filter(function(el) {\n        return el.startsWith(\"\
    aaa\");\n    })\n    .sorted()\n    .forEach(function(el) {\n        print(el);\n\
    \    });\n    // aaa1, aaa2\n```\n\n#### Extending classes\n\nJava types can simply\
    \ be extended with the `Java.extend` extension. As you can see in the next example,\
    \ you can even create multi-threaded code in your scripts:\n\n```javascript\n\
    var Runnable = Java.type('java.lang.Runnable');\nvar Printer = Java.extend(Runnable,\
    \ {\n    run: function() {\n        print('printed from a separate thread');\n\
    \    }\n});\n\nvar Thread = Java.type('java.lang.Thread');\nnew Thread(new Printer()).start();\n\
    \nnew Thread(function() {\n    print('printed from another thread');\n}).start();\n\
    \n// printed from a separate thread\n// printed from another thread\n```\n\n####\
    \ Parameter overloading\n\nMethods and functions can either be called with the\
    \ point notation or with the square braces notation.\n\n```javascript\nvar System\
    \ = Java.type('java.lang.System');\nSystem.out.println(10);              // 10\n\
    System.out[\"println\"](11.0);         // 11.0\nSystem.out[\"println(double)\"\
    ](12);   // 12.0\n```\n\nPassing the optional parameter type `println(double)`\
    \ when calling a method with overloaded parameters determines the exact method\
    \ to be called.\n\n#### Java Beans\n\nInstead of explicitly working with getters\
    \ and setters you can just use simple property names both for getting or setting\
    \ values from a java bean.\n\n```javascript\nvar Date = Java.type('java.util.Date');\n\
    var date = new Date();\ndate.year += 1900;\nprint(date.year);  // 2014\n```\n\n\
    #### Function Literals\n\nFor simple one line functions we can skip the\n\n####\
    \ Properties\n\nBinding properties to objects is a common task. In Nashorn, you\
    \ can use the dot notation to access properties directly.\n\n```javascript\nvar\
    \ obj = {};\nobj.name = \"Nashorn\";\nprint(obj.name);  // Nashorn\n```\n\n####\
    \ Trimming\n\nTrimming strings is straightforward using the `trim()` method.\n\
    \n```javascript\nvar str = \"  hello  \";\nprint(str.trim());  // hello\n```\n"
