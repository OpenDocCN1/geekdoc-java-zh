    \ + i)));\n\n// create bars\nfoos.forEach(f ->\n    IntStream\n        .range(1,\
    \ 4)\n        .forEach(i -> f.bars.add(new Bar(\"Bar\" + i + \" <- \" + f.name))));\n\
    ```\n\nNow we have a list of three foos each consisting of three bars.\n\nFlatMap\
    \ accepts a function which has to return a stream of objects. So in order to resolve\
    \ the bar objects of each foo, we just pass the appropriate function:\n\n```\n\
    foos.stream()\n    .flatMap(f -> f.bars.stream())\n    .forEach(b -> System.out.println(b.name));\n\
    \n// Bar1 <- Foo1\n// Bar2 <- Foo1\n// Bar3 <- Foo1\n// Bar1 <- Foo2\n// Bar2\
