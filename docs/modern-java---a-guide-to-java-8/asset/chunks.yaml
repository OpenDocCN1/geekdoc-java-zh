    来源：[java8-tutorial](https://github.com/winterbe/java8-tutorial)\n许可证：[MIT 许可证](https://github.com/winterbe/java8-tutorial/blob/master/LICENSE)\n\
    \n# 现代 Java - Java 8 指南\n\n> [“Java 还没有死——人们开始意识到这一点了。”](https://twitter.com/mreinhold/status/429603588525281280)\n\
    \n欢迎阅读我对 [Java 8](https://jdk8.java.net/) 的介绍。这本教程将引导你逐步学习所有新的语言特性。在简短简单代码示例的支持下，你将学习如何使用默认接口方法、lambda\
    \ 表达式、方法引用和可重复注解。在文章最后，你将熟悉最新的 [API](http://download.java.net/jdk8/docs/api/)\
    \ 变化，如流、函数式接口、map 扩展以及新的日期 API。**没有大段文字，只有许多带注释的代码段。尽情享受吧！**\n\n这篇文章最初发布在[我的博客](http://winterbe.com/posts/2014/03/16/java-tutorial/)上。你应该[在\
    \ Twitter 上关注我](https://twitter.com/winterbe)。\n\n## 目录\n\n* [接口的默认方法]\n* [Lambda\
    \ 表达式]\n* [函数式接口]\n* [方法和构造函数引用]\n* [Lambda 作用域]\n    * [访问局部变量]\n    * [访问字段和静态变量]\n\
    \    * [访问默认方法]\n* [内置函数式接口]\n    * [谓词 (Predicates)]\n    * [函数 (Functions)]\n\
    \    * [供应商 (Suppliers)]\n    * [消费者 (Consumers)]\n    * [比较器 (Comparators)]\n\
    \    * [可选类型 (Optionals)]\n    * [流 (Streams)]\n    * [过滤 (Filter)]\n    * [排序\
    \ (Sorted)]\n    * [映射 (Map)]\n    * [匹配 (Match)]\n    * [计数 (Count)]\n    * [归约\
    \ (Reduce)]\n    * [并行流 (Parallel Streams)]\n    * [顺序排序 (Sequential Sort)]\n\
    \    * [并行排序 (Parallel Sort)]\n    * [映射 (Maps)]\n    * [日期 API (Date API)]\n\
    \    * [时钟 (Clock)]\n    * [时区 (Timezones)]\n    * [本地时间 (LocalTime)]\n    * [本地日期\
    \ (LocalDate)]\n    * [本地日期时间 (LocalDateTime)]\n    * [注解 (Annotations)]\n   \
    \ * [接下来做什么]\n\n## 接口的默认方法\n\nJava 8 允许我们通过 `default` 关键字向接口中添加非抽象方法的实现。这一特性被称为[虚拟扩展方法](https://stackoverflow.com/a/24102730)。这是我们的第一个示例：\n\
    \n```java\ninterface Formula {\n    double calculate(int a);\n\n    default double\
    \ sqrt(int a) {\n        return Math.sqrt(a);\n    }\n}\n```\n\n除了抽象方法 `calculate`\
    \ 之外，接口 `Formula` 还定义了默认方法 `sqrt`。具体类只需要实现抽象方法 `calculate`。默认方法 `sqrt` 可以可以直接使用。\n\
    \n```java\nFormula formula = new Formula() {\n    @Override\n    public double\
    \ calculate(int a) {\n        return sqrt(a) * 100;\n    }\n};\n\nformula.calculate(100);\
    \     // 100.0\nformula.sqrt(16);           // 4.0\n```\n\n该公式是通过匿名对象实现的。代码相当冗长：对于\
    \ `sqrt(a * 100)` 这样简单的计算，用了 6 行代码。正如我们在下一节中看到的，Java 8 中有更优雅的方法来实现单方法对象。\n\n##\
    \ Lambda 表达式\n\n让我们从一个在 Java 之前的版本中对字符串列表的简单示例开始：\n\n```java\nList<String> names\
    \ = Arrays.asList(\"peter\", \"anna\", \"mike\", \"xenia\");\n\nCollections.sort(names,\
    \ new Comparator<String>() {\n    @Override\n    public int compare(String a,\
    \ String b) {\n        return b.compareTo(a);\n    }\n});\n```\n\n静态工具方法 `Collections.sort`\
    \ 接受一个列表和一个比较器，以便对给定列表的元素进行排序。你经常发现自己在创建匿名比较器并将它们传递给 sort 方法。\n\n与其整天创建匿名对象，Java\
    \ 8 提供了更短的语法：lambda 表达式：\n\n```java\nCollections.sort(names, (String a, String\
    \ b) -> {\n    return b.compareTo(a);\n});\n```\n\n你可以看到代码变得更短且更易读。但还可以更短：\n\n\
    ```java\nCollections.sort(names, (String a, String b) -> b.compareTo(a));\n```\n\
    \n对于单行方法体，可以跳过大括号 `{}` 和 `return` 关键字。还可以更短：\n\n```java\nnames.sort((a, b) ->\
    \ b.compareTo(a));\n```\n\n`List` 现在有了 `sort` 方法。此外，Java 编译器知道参数类型，因此你也可以省略它们。让我们深入研究\
    \ lambda 表达式在实际中的用法。\n\n## 函数式接口\n\nlambda 表达式如何适应 Java 的类型系统？每个 lambda 对应一个给定的类型，由接口指定。所谓的*函数式接口*必须包含**一个抽象方法**声明。该类型的\
    \ lambda 表达式将匹配到该抽象方法。由于默认方法不是抽象的，你可以自由地向函数式接口中添加默认方法。\n\n只要接口只包含一个抽象方法，我们就可以将任意接口作为\
    \ lambda 表达式。为了确保你的接口符合要求，你应该添加 `@FunctionalInterface` 注解。编译器会感知此注解，一旦你尝试向接口添加第二个抽象方法，就会抛出编译错误。\n\
    \n示例：\n\n```java\n@FunctionalInterface\ninterface Converter<F, T> {\n    T convert(F\
    \ from);\n}\n```\n\n```java\nConverter<String, Integer> converter = (from) ->\
    \ Integer.valueOf(from);\nInteger converted = converter.convert(\"123\");\nSystem.out.println(converted);\
    \    // 123\n```\n\n请记住，如果省略 `@FunctionalInterface` 注解，代码同样有效。\n\n## 方法和构造函数引用\n\
    \n利用静态方法引用可以进一步简化上面的代码：\n\n```java\nConverter<String, Integer> converter = Integer::valueOf;\n\
    Integer converted = converter.convert(\"123\");\nSystem.out.println(converted);\
    \   // 123\n```\n\nJava 8 允许通过 `::` 关键字传递方法或构造函数的引用。上面的示例展示了如何引用静态方法。但也可以引用对象方法：\n\
