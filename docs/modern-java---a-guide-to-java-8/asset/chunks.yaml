  trans: "\n\n```\ntry {\n    System.out.println(\"attempt to shutdown executor\"\
    );\n    executor.shutdown();\n    executor.awaitTermination(5, TimeUnit.SECONDS);\n\
    }\ncatch (InterruptedException e) {\n    System.err.println(\"tasks interrupted\"\
    );\n}\nfinally {\n    if (!executor.isTerminated()) {\n        System.err.println(\"\
    cancel non-finished tasks\");\n    }\n    executor.shutdownNow();\n    System.out.println(\"\
    shutdown finished\");\n}\n```\n\n`executor` 通过等待当前运行的任务终止一段特定的时间来执行软关闭。在最多五秒后，`executor`\
    \ 将通过中断所有正在运行的任务最终关闭。\n\n### Callables 和 Futures\n\n除了 `Runnable` 执行器外，执行器还支持另一种名为\
    \ `Callable` 的任务。`Callables` 与 runnable 一样是函数式接口，但它们不是返回 `void`，而是返回一个值。\n\n这个\
    \ Lambda 表达式定义了一个在睡眠一秒后返回整数的可调用对象：\n\n```\nCallable<Integer> task = () -> {\n\
    \    try {\n        TimeUnit.SECONDS.sleep(1);\n        return 123;\n    }\n \
    \   catch (InterruptedException e) {\n        throw new IllegalStateException(\"\
    task interrupted\", e);\n    }\n};\n```\n\n`Callables` 可以像 runnable 一样提交给执行器服务。但是\
    \ callable 的结果呢？由于 `submit()` 不等待任务完成，因此执行器服务无法直接返回 callable 的结果。相反，执行器返回一个类型为\
    \ `Future` 的特殊结果，可以在之后的某个时间获取实际结果。\n\n```\nExecutorService executor = Executors.newFixedThreadPool(1);\n\
    Future<Integer> future = executor.submit(task);\n\nSystem.out.println(\"future\
    \ done? \" + future.isDone());\n\nInteger result = future.get();\n\nSystem.out.println(\"\
    future done? \" + future.isDone());\nSystem.out.print(\"result: \" + result);\n\
    ```\n\n在将 callable 提交给 `executor` 后，我们首先通过 `isDone()` 检查 `future` 是否已经完成执行。我非常确定不是这种情况，因为上面的\
    \ callable 在返回整数之前会睡眠一秒。\n\n调用 `get()` 方法会阻塞当前线程并等待 callable 完成后返回实际结果 `123`。现在\
    \ `future` 终于完成了，我们在控制台上看到了以下结果：\n\n```\nfuture done? false\nfuture done? true\n\
    result: 123\n```\n\n`Futures` 与底层执行器服务紧密耦合。请记住，如果你关闭了 `executor`，每个未终止的 `future`\
    \ 都会抛出异常：\n\n```\nexecutor.shutdownNow();\nfuture.get();\n```\n\n你可能已经注意到 `executor`\
    \ 的创建与之前的示例略有不同。我们使用 `newFixedThreadPool(1)` 创建一个由大小线程池的执行器服务。这等同于 `newSingleThreadExecutor()`，但我们之后可以通过传递大于\
    \ 1 的值来增加池的大小。\n\n### 超时\n\n任何对 `future.get()` 的调用都会阻塞并等待直到底层 callable 终止。在坏的情况下，callable\
    \ 会无限运行——从而导致你的应用程序无响应。你可以简单地通过传递超时时间来应对这些场景：\n\n```\nExecutorService executor\
    \ = Executors.newFixedThreadPool(1);\n\nFuture<Integer> future = executor.submit(()\
    \ -> {\n    try {\n        TimeUnit.SECONDS.sleep(2);\n        return 123;\n \
    \   }\n    catch (InterruptedException e) {\n        throw new IllegalStateException(\"\
    task interrupted\", e);\n    }\n});\n\nfuture.get(1, TimeUnit.SECONDS);\n```\n\
    \n执行上述代码会导致产生 `TimeoutException`：\n\n```\nException in thread \"main\" java.util.concurrent.TimeoutException\n\
    \    at java.util.concurrent.FutureTask.get(FutureTask.java:205)\n```\n\n你可能已经猜到为什么抛出这个异常了：我们指定了一个一秒的最大等待时间，但\
    \ callable 在返回结果之前实际上需要两秒。\n\n### InvokeAll\n\n执行器支持通过 `invokeAll()` 一次批量提交多个\
    \ callable。该方法接受一个 callable 集合并返回一个 futures 列表。\n\n```\nExecutorService executor\
    \ = Executors.newWorkStealingPool();\n\nList<Callable<String>> callables = Arrays.asList(\n\
    \        () -> \"task1\",\n        () -> \"task2\",\n        () -> \"task3\");\n\
    \nexecutor.invokeAll(callables)\n    .stream()\n    .map(future -> {\n       \
    \ try {\n            return future.get();\n        }\n        catch (Exception\
    \ e) {\n            throw new IllegalStateException(e);\n        }\n    })\n \
    \   .forEach(System.out::println);\n```\n\n在这个示例中，我们利用 Java 8 的函数式流来处理 `invokeAll()`\
    \ 调用返回的所有 futures。我们首先将每个 future 映射到它的返回值，然后将每个值打印到控制台。如果你还不熟悉流（streams），请阅读我的\
    \ Java 8 流教程。\n\n### InvokeAny\n\n另一种批量提交 callable 的方法是 `invokeAny()` 方法，它的工作方式与\
    \ `invokeAll()` 略有不同。该方法不是返回 future 对象，而是阻塞直到第一个 callable 终止并返回该 callable 的结果。\n\
    \n为了测试这种行为，我们使用这个辅助方法来模拟不同持续时间的 callable。该方法返回一个 callable，它会睡眠一段时间直到返回给定的结果：\n\
    \n```\nCallable<String> callable(String result, long sleepSeconds) {\n    return\
    \ () -> {\n        TimeUnit.SECONDS.sleep(sleepSeconds);\n        return result;\n\
    \    };\n}\n```\n\n我们使用这个方法创建持续时间从一秒到三秒不等的一组 callable。通过 `invokeAny()` 将这些 callable\
    \ 提交给执行器会返回最快完成的结果——在这种情况下是 task2：\n\n```\nExecutorService executor = Executors.newWorkStealingPool();\n\
    \nList<Callable<String>> callables = Arrays.asList(\n    callable(\"task1\", 2),\n\
    \    callable(\"task2\", 1),\n    callable(\"task3\", 3));\n\nString result =\
    \ executor.invokeAny(callables);\nSystem.out.println(result);\n\n// => task2\n\
    ```\n\n上面的示例使用了通过 `newWorkStealingPool()` 创建的另一种类型的执行器。该工厂方法是 Java 8 的一部分，返回一个类型为\
    \ `ForkJoinPool` 的执行器，其工作方式与普通执行器不同。默认情况下，并行度 [ForkJoins](https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/ForkJoinPool.html\
    \ 是主机 CPU 的可用核心数。\n\nForkJoinPool 自 Java 7 起引入，将在本系列的后续中详细介绍。让我们通过深入研究定时执行器来结束本教程。\n\
    \n### 定时执行器\n\n我们已经学习了如何在执行器上提交并运行单个任务。为了定期多次运行常用任务，我们可以利用定时线程池。\n\n`ScheduledExecutorService`\
    \ 能够调度任务定期运行或在经过特定时间后运行一次。\n\n这段代码示例在初始延迟三秒后调度了一个任务：\n\n```\nScheduledExecutorService\
    \ executor = Executors.newScheduledThreadPool(1);\n\nRunnable task = () -> System.out.println(\"\
    Scheduling: \" + System.nanoTime());\nScheduledFuture<?> future = executor.schedule(task,\
    \ 3, TimeUnit.SECONDS);\n\nTimeUnit.MILLISECONDS.sleep(1337);\n\nlong remainingDelay\
    \ = future.getDelay(TimeUnit.MILLISECONDS);\nSystem.out.printf(\"Remaining Delay:\
    \ %ms\", remainingDelay);\n```\n\n调度任务会产生一个类型为 `ScheduledFuture` 的特殊 future，它除了\
    \ `Future` 之外还提供了 `getDelay()` 方法来获取剩余延迟。在这一延迟结束后，任务将并发执行。\n\n为了调度定期执行的任务，执行器提供了两个方法\
    \ `scheduleAtFixedRate()` 和 `scheduleWithFixedDelay()`。第一个方法能够以固定的时间频率执行任务，例如示例所示每秒执行一次：\n\
    \n"
- fmt: "\n```\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
    \nRunnable task = () -> System.out.println(\"Scheduling: \" + System.nanoTime());\n\
    \nint initialDelay = 0;\nint period = 1;\nexecutor.scheduleAtFixedRate(task, initialDelay,\
    \ period, TimeUnit.SECONDS);\n```\n\nAdditionally this method accepts an initial\
    \ delay which describes the leading wait time before the task will be executed\
    \ for the first time.\n\nPlease keep in mind that `scheduleAtFixedRate()` doesn't\
    \ take into account the actual duration of the task. So if you specify a period\
    \ of one second but the task needs 2 seconds to be executed then the thread pool\
    \ will working to capacity very soon.\n\nIn that case you should consider using\
    \ `scheduleWithFixedDelay()` instead. This method works just like the counterpart\
    \ described above. The difference is that the wait time period applies between\
    \ the end of a task and the start of the next task. For example:\n\n```\nScheduledExecutorService\
    \ executor = Executors.newScheduledThreadPool(1);\n\nRunnable task = () -> {\n\
    \    try {\n        TimeUnit.SECONDS.sleep(2);\n        System.out.println(\"\
    Scheduling: \" + System.nanoTime());\n    }\n    catch (InterruptedException e)\
    \ {\n        System.err.println(\"task interrupted\");\n    }\n};\n\nexecutor.scheduleWithFixedDelay(task,\
    \ 0, 1, TimeUnit.SECONDS);\n```\n\nThis example schedules a task with a fixed\
    \ delay of one second between the end of an execution and the start of the next\
    \ execution. The initial delay is zero and the tasks duration is two seconds.\
    \ So we end up with an execution interval of 0s, 3s, 6s, 9s and so on. As you\
    \ can see `scheduleWithFixedDelay()` is handy if you cannot predict the duration\
    \ of the scheduled tasks.\n\nThis was the first part out of a series of concurrency\
