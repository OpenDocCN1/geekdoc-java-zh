    License: [MIT License](https://github.com/winterbe/java8-tutorial/blob/master/LICENSE)\n\
    \n# Modern Java - A Guide to Java 8\n\n> [“Java is still not dead—and people are\
    \ starting to figure that out.”](https://twitter.com/mreinhold/status/429603588525281280)\n\
    \nWelcome to my introduction to [Java 8](https://jdk8.java.net/). This tutorial\
    \ guides you step by step through all new language features. Backed by short and\
    \ simple code samples you'll learn how to use default interface methods, lambda\
    \ expressions, method references and repeatable annotations. At the end of the\
    \ article you'll be familiar with the most recent [API](http://download.java.net/jdk8/docs/api/)\
    \ changes like streams, functional interfaces, map extensions and the new Date\
    \ API. **No walls of text, just a bunch of commented code snippets. Enjoy!**\n\
    \nThis article was originally posted on [my blog](http://winterbe.com/posts/2014/03/16/java-tutorial/).\
    \ You should [follow me on Twitter](https://twitter.com/winterbe).\n\n## Table\
    \ of Contents\n\n* [Default Methods for Interfaces]\n* [Lambda expressions]\n\
    * [Functional Interfaces]\n* [Method and Constructor References]\n* [Lambda Scopes]\n\
    \    * [Accessing local variables]\n    * [Accessing fields and static variables]\n\
    \    * [Accessing Default Methods]\n* [Built-in Functional Interfaces]\n    *\
    \ [Predicates]\n    * [Functions]\n    * [Suppliers]\n    * [Consumers]\n    *\
    \ [Comparators]\n    * [Optionals]\n    * [Streams]\n    * [Filter]\n    * [Sorted]\n\
    \    * [Map]\n    * [Match]\n    * [Count]\n    * [Reduce]\n    * [Parallel Streams]\n\
    \    * [Sequential Sort]\n    * [Parallel Sort]\n    * [Maps]\n    * [Date API]\n\
    \    * [Clock]\n    * [Timezones]\n    * [LocalTime]\n    * [LocalDate]\n    *\
    \ [LocalDateTime]\n    * [Annotations]\n    * [Where to go from here?]\n\n## Default\
    \ Methods for Interfaces\n\nJava 8 enables us to add non-abstract method implementations\
    \ to interfaces by utilizing the `default` keyword. This feature is also known\
    \ as [virtual extension methods](https://stackoverflow.com/a/24102730). Here is\
    \ our first example:\n\n```java\ninterface Formula {\n    double calculate(int\
    \ a);\n\n    default double sqrt(int a) {\n        return Math.sqrt(a);\n    }\n\
    }\n```\n\nBesides the abstract method `calculate` the interface `Formula` also\
    \ defines the default method `sqrt`. Concrete classes only have to implement the\
    \ abstract method `calculate`. The default method `sqrt` can be used out of the\
    \ box.\n\n```java\nFormula formula = new Formula() {\n    @Override\n    public\
    \ double calculate(int a) {\n        return sqrt(a) * 100;\n    }\n};\n\nformula.calculate(100);\
    \     // 100.0\nformula.sqrt(16);           // 4.0\n```\n\nThe formula is implemented\
    \ as an anonymous object. The code is quite verbose: 6 lines of code for such\
    \ a simple calculation of `sqrt(a * 100)`. As we'll see in the next section, there's\
    \ a much nicer way of implementing single method objects in Java 8.\n\n## Lambda\
    \ expressions\n\nLet's start with a simple example of how to sort a list of strings\
    \ in prior versions of Java:\n\n```java\nList<String> names = Arrays.asList(\"\
    peter\", \"anna\", \"mike\", \"xenia\");\n\nCollections.sort(names, new Comparator<String>()\
    \ {\n    @Override\n    public int compare(String a, String b) {\n        return\
    \ b.compareTo(a);\n    }\n});\n```\n\nThe static utility method `Collections.sort`\
    \ accepts a list and a comparator in order to sort the elements of the given list.\
    \ You often find yourself creating anonymous comparators and pass them to the\
    \ sort method.\n\nInstead of creating anonymous objects all day long, Java 8 comes\
    \ with a much shorter syntax, lambda expressions:\n\n```java\nCollections.sort(names,\
    \ (String a, String b) -> {\n    return b.compareTo(a);\n});\n```\n\nAs you can\
    \ see the code is much shorter and easier to read. But it gets even shorter:\n\
    \n```java\nCollections.sort(names, (String a, String b) -> b.compareTo(a));\n\
    ```\n\nFor one line method bodies you can skip both the braces `{}` and the `return`\
    \ keyword. But it gets even shorter:\n\n```java\nnames.sort((a, b) -> b.compareTo(a));\n\
    ```\n\n`List` now has a `sort` method. Also the java compiler is aware of the\
    \ parameter types so you can skip them as well. Let's dive deeper into how lambda\
    \ expressions can be used in the wild.\n\n## Functional Interfaces\n\nHow does\
    \ lambda expressions fit into Java's type system? Each lambda corresponds to a\
    \ given type, specified by an interface. A so called *functional interface* must\
    \ contain **exactly one abstract method** declaration. Each lambda expression\
    \ of that type will be matched to this abstract method. Since default methods\
    \ are not abstract you're free to add default methods to your functional interface.\n\
    \nWe can use arbitrary interfaces as lambda expressions as long as the interface\
    \ only contains one abstract method. To ensure that your interface meet the requirements,\
    \ you should add the `@FunctionalInterface` annotation. The compiler is aware\
    \ of this annotation and throws a compiler error as soon as you try to add a second\
    \ abstract method declaration to the interface.\n\nExample:\n\n```java\n@FunctionalInterface\n\
    interface Converter<F, T> {\n    T convert(F from);\n}\n```\n\n```java\nConverter<String,\
    \ Integer> converter = (from) -> Integer.valueOf(from);\nInteger converted = converter.convert(\"\
    123\");\nSystem.out.println(converted);    // 123\n```\n\nKeep in mind that the\
    \ code is also valid if the `@FunctionalInterface` annotation would be omitted.\n\
    \n## Method and Constructor References\n\nThe above example code can be further\
    \ simplified by utilizing static method references:\n\n```java\nConverter<String,\
    \ Integer> converter = Integer::valueOf;\nInteger converted = converter.convert(\"\
    123\");\nSystem.out.println(converted);   // 123\n```\n\nJava 8 enables you to\
    \ pass references of methods or constructors via the `::` keyword. The above example\
    \ shows how to reference a static method. But we can also reference object methods:\n\
    \n```java\nclass Something {\n    String startsWith(String s) {\n        return\
    \ String.valueOf(s.charAt(0));\n    }\n}\n```\n\n```java\nSomething something\
    \ = new Something();\nConverter<String, String> converter = something::startsWith;\n\
    String converted = converter.convert(\"Java\");\nSystem.out.println(converted);\
    \    // \"J\"\n```\n\nLet's see how the `::` keyword works for constructors. First\
    \ we define an example bean with different constructors:\n"
