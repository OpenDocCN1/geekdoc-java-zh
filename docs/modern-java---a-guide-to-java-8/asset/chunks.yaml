    \ reading!\n\n# Java 8 Stream Tutorial\n\n# Java 8 Stream Tutorial\n\nJuly 31,\
    \ 2014\n\nThis example-driven tutorial gives an in-depth overview about Java 8\
    \ streams. When I first read about the `Stream` API, I was confused about the\
    \ name since it sounds similar to `InputStream` and `OutputStream` from Java I/O.\
    \ But Java 8 streams are a completely different thing. Streams are [Monads](http://en.wikipedia.org/wiki/Monad_%28functional_programming%29),\
    \ thus playing a big part in bringing *functional programming* to Java:\n\n> In\
    \ functional programming, a monad is a structure that represents computations\
    \ defined as sequences of steps. A type with a monad structure defines what it\
    \ means to chain operations, or nest functions of that type together.\n\nThis\
    \ guide teaches you how to work with Java 8 streams and how to use the different\
    \ kind of available stream operations. You'll learn about the processing order\
    \ and how the ordering of stream operations affect runtime performance. The more\
    \ powerful stream operations `reduce`, `collect` and `flatMap` are covered in\
    \ detail. The tutorial ends with an in-depth look at parallel streams.\n\nIf you're\
    \ not yet familiar with Java 8 lambda expressions, functional interfaces and method\
    \ references, you probably want to read my [Java 8 Tutorial](http://winterbe.com/posts/2014/03/16/java-8-tutorial/)\
    \ first before starting with this tutorial.\n\n***UPDATE** - I'm currently working\
    \ on a JavaScript implementation of the Java 8 Streams API for the browser. If\
    \ I've drawn your interest check out [Stream.js on GitHub](https://github.com/winterbe/streamjs).\
    \ Your Feedback is highly appreciated.*\n\n### How streams work"
