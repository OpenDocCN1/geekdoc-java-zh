  trans: "\n\n`Sorted` 是一个*中间*操作，它返回一个流的排序视图。除非你传递了自定义的 `Comparator`，否则元素将按照自然顺序排序。\n\
    \n```\nstringCollection\n    .stream()\n    .sorted()\n    .filter((s) -> s.startsWith(\"\
    a\"))\n    .forEach(System.out::println);\n\n// \"aaa1\", \"aaa2\"\n```\n\n请记住，`sorted`\
    \ 仅创建流的排序视图，而不会改变底层集合的顺序。`stringCollection` 的顺序保持不变：\n\n```\nSystem.out.println(stringCollection);\n\
    // ddd2, aaa2, bbb1, aaa1, bbb3, ccc, bbb2, ddd1\n```\n\n### Map\n\n*中间*操作 `map`\
    \ 通过给定的函数将每个元素转换为另一个对象。下面的示例将每个字符串转换为大写字符串。但你也可以使用 `map` 将每个对象转换为另一种类型。结果流的泛型取决于你传递给\
    \ `map` 的函数的泛型类型。\n\n```\nstringCollection\n    .stream()\n    .map(String::toUpperCase)\n\
    \    .sorted((a, b) -> b.compareTo(a))\n    .forEach(System.out::println);\n\n\
    // \"DDD2\", \"DDD1\", \"CCC\", \"BBB3\", \"BBB2\", \"AAA2\", \"AAA1\"\n```\n\n\
    ### Match\n\n可以使用各种匹配操作来检查某个谓词是否匹配流。所有这些操作都是*终端*操作，并返回布尔结果。\n\n```\nboolean anyStartsWithA\
    \ =\n    stringCollection\n        .stream()\n        .anyMatch((s) -> s.startsWith(\"\
    a\"));\n\nSystem.out.println(anyStartsWithA);      // true\n\nboolean allStartsWithA\
    \ =\n    stringCollection\n        .stream()\n        .allMatch((s) -> s.startsWith(\"\
    a\"));\n\nSystem.out.println(allStartsWithA);      // false\n\nboolean noneStartsWithZ\
    \ =\n    stringCollection\n        .stream()\n        .noneMatch((s) -> s.startsWith(\"\
    z\"));\n\nSystem.out.println(noneStartsWithZ);      // true\n```\n\n### Count\n\
    \n`Count` 是一个*终端*操作，以 `long` 类型返回流中元素的数量。\n\n```\nlong startsWithB =\n    stringCollection\n\
    \        .stream()\n        .filter((s) -> s.startsWith(\"b\"))\n        .count();\n\
    \nSystem.out.println(startsWithB);    // 3\n```\n\n### Reduce\n\n此*终端*操作通过给定的函数对流中的元素进行归约。结果是一个包含归约值的\
    \ `Optional`。\n\n```\nOptional<String> reduced =\n    stringCollection\n     \
    \   .stream()\n        .sorted()\n        .reduce((s1, s2) -> s1 + \"#\" + s2);\n\
    \nreduced.ifPresent(System.out::println);\n// \"aaa1#aaa2#bbb1#bbb2#bbb3#ccc#ddd1#ddd2\"\
    \n```\n\n## Parallel Streams\n\n如上所述，流可以是是顺序的，也可以是并行的。顺序流上的操作在单个线程上执行，而并行流上的操作在多个线程上并发执行。\n\
    \n接下来的示例展示了使用并行流提高性能是多么简单。\n\n首先，我们创建一个包含大量唯一元素的列表列表：\n\n```\nint max = 1000000;\n\
    List<String> values = new ArrayList<>(max);\nfor (int i = 0; i < max; i++) {\n\
    \    UUID uuid = UUID.randomUUID();\n    values.add(uuid.toString());\n}\n```\n\
    \n现在，我们测量对该集合进行排序所需的时间。\n\n### Sequential Sort\n\n```\nlong t0 = System.nanoTime();\n\
    \nlong count = values.stream().sorted().count();\nSystem.out.println(count);\n\
    \nlong t1 = System.nanoTime();\n\nlong millis = TimeUnit.NANOSECONDS.toMillis(t1\
    \ - t0);\nSystem.out.println(String.format(\"sequential sort took: %d ms\", millis));\n\
    \n// sequential sort took: 899 ms\n```\n\n### Parallel Sort\n\n```\nlong t0 =\
    \ System.nanoTime();\n\nlong count = values.parallelStream().sorted().count();\n\
    System.out.println(count);\n\nlong t1 = System.nanoTime();\n\nlong millis = TimeUnit.NANOSECONDS.toMillis(t1\
    \ - t0);\nSystem.out.println(String.format(\"parallel sort took: %d ms\", millis));\n\
    \n// parallel sort took: 472 ms\n```\n\n你可以看到，两个代码段几乎相同，但并行排序的速度要快了大约 50%。你只需要将\
    \ `stream()` 更改为 `parallelStream()`。\n\n## Maps\n\n如前所述，map 不直接支持流。`Map` 接口本身没有提供\
    \ `stream()` 方法，但你可以通过 `map.keySet().stream()`、`map.values().stream()` 和 `map.entrySet().stream()`\
    \ 创建基于键、值或条目的专有流。\n\n此外，map 还提供了许多用于执行常见任务的新实用方法。\n\n```\nMap<Integer, String>\
    \ map = new HashMap<>();\n\nfor (int i = 0; i < 10; i++) {\n    map.putIfAbsent(i,\
    \ \"val\" + i);\n}\n\nmap.forEach((id, val) -> System.out.println(val));\n```\n\
    \n上面的代码自证其明：`putIfAbsent` 避免了我们编写额外的空值检查；以及 `forEach`。\n\n## Date API\n\nJava\
    \ 8 在 `java.time` 包下包含了一个全新的日期和时间 API。下面的示例涵盖了其中最重要的部分。\n\n### Clock\n\n`Clock`\
    \ 提供了对当前日期和时间的访问。时钟感知时区，并可以替代 `System.currentTimeMillis()` 来获取毫秒级的当前时间。时间线上的这种瞬间也由\
    \ `Instant` 类表示。Instant 可以用于创建旧的 `java.util.Date` 对象。\n\n```\nClock clock = Clock.systemDefaultZone();\n\
    long millis = clock.millis();\n\nInstant instant = clock.instant();\nDate legacyDate\
    \ = Date.from(instant);   // legacy java.util.Date\n```\n\n### Timezones\n\n时区由\
    \ `ZoneId` 表示。可以通过静态工厂方法轻松访问。时区定义了偏移量，这对于转换瞬间以及本地日期时间至关重要。\n\n```\nSystem.out.println(ZoneId.getAvailableZoneIds());\n\
    // 打印所有可用的时区 id\n\nZoneId zone1 = ZoneId.of(\"Europe/Berlin\");\nZoneId zone2\
    \ = ZoneId.of(\"Brazil/East\");\nSystem.out.println(zone1.getRules());\nSystem.out.println(zone2.getRules());\n\
    \n// ZoneRules[currentStandardOffset=+01:00]\n// ZoneRules[currentStandardOffset=-03:00]\n\
    ```\n\n### LocalTime\n\n`LocalTime` 表示不带时区的时间，例如晚上 10 点或 17:30:15。下面的示例为上面定义的时区创建两个本地时间。然后我们比较这两个时间，并计算它们之间小时和分钟的差异。\n\
    \n```\nLocalTime now1 = LocalTime.now(zone1);\nLocalTime now2 = LocalTime.now(zone2);\n\
    \nSystem.out.println(now1.isBefore(now2));  // false\n\nlong hoursBetween = ChronoUnit.HOURS.between(now1,\
    \ now2);\nlong minutesBetween = ChronoUnit.MINUTES.between(now1, now2);\n\nSystem.out.println(hoursBetween);\
    \       // -3\nSystem.out.println(minutesBetween);     // -239\n```\n\n`LocalTime`\
    \ 提供了各种工厂方法来简化新实例的创建，包括对时间字符串的解析。\n\n"
- fmt: "\n```\nLocalTime late = LocalTime.of(23, 59, 59);\nSystem.out.println(late);\
    \       // 23:59:59\n\nDateTimeFormatter germanFormatter =\n    DateTimeFormatter\n\
    \        .ofLocalizedTime(FormatStyle.SHORT)\n        .withLocale(Locale.GERMAN);\n\
    \nLocalTime leetTime = LocalTime.parse(\"13:37\", germanFormatter);\nSystem.out.println(leetTime);\
    \   // 13:37\n```\n\n### LocalDate\n\n`LocalDate` represents a distinct date,\
    \ e.g. `2014-03-11`. It's immutable and works exactly analog to `LocalTime`. The\
    \ sample demonstrates how to calculate new dates by adding or subtracting days,\
    \ months or years. Keep in mind that each manipulation returns a new instance.\n\
    \n```\nLocalDate today = LocalDate.now();\nLocalDate tomorrow = today.plus(1,\
    \ ChronoUnit.DAYS);\nLocalDate yesterday = tomorrow.minusDays(2);\n\nLocalDate\
    \ independenceDay = LocalDate.of(2014, Month.JULY, 4);\nDayOfWeek dayOfWeek =\
    \ independenceDay.getDayOfWeek();\nSystem.out.println(dayOfWeek);    // FRIDAY\n\
    ```\n\nParsing a `LocalDate` from a string is just as simple as parsing a `LocalTime`:\n\
    \n```\nDateTimeFormatter germanFormatter =\n    DateTimeFormatter\n        .ofLocalizedDate(FormatStyle.MEDIUM)\n\
    \        .withLocale(Locale.GERMAN);\n\nLocalDate xmas = LocalDate.parse(\"24.12.2014\"\
    , germanFormatter);\nSystem.out.println(xmas);   // 2014-12-24\n```\n\n### LocalDateTime\n\
    \n`LocalDateTime` represents a date-time. It combines date and time as seen in\
    \ the above sections into one instance. `LocalDateTime` is immutable and works\
    \ similar to `LocalTime` and `LocalDate`. We can utilize methods for retrieving\
    \ certain fields from a date-time:\n\n```\nLocalDateTime sylvester = LocalDateTime.of(2014,\
    \ Month.DECEMBER, 31, 23, 59, 59);\n\nDayOfWeek dayOfWeek = sylvester.getDayOfWeek();\n\
    System.out.println(dayOfWeek);      // WEDNESDAY\n\nMonth month = sylvester.getMonth();\n\
    System.out.println(month);          // DECEMBER\n\nlong minuteOfDay = sylvester.getLong(ChronoField.MINUTE_OF_DAY);\n\
    System.out.println(minuteOfDay);    // 1439\n```\n\nWith the additional information\
    \ of a timezone it can be converted to an instant. Instants can easily be converted\
    \ to legacy dates of type `java.util.Date`.\n\n```\nInstant instant = sylvester\n\
    \        .atZone(ZoneId.systemDefault())\n        .toInstant();\n\nDate legacyDate\
    \ = Date.from(instant);\nSystem.out.println(legacyDate);     // Wed Dec 31 23:59:59\
    \ CET 2014\n```\n\nFormatting date-times works just like formatting dates or times.\
    \ Instead of using pre-defined formats we can create formatters from custom patterns.\n\
    \n```\nDateTimeFormatter formatter =\n    DateTimeFormatter\n        .ofPattern(\"\
    MMM dd, yyyy - HH:mm\");\n\nLocalDateTime parsed = LocalDateTime.parse(\"Nov 03,\
    \ 2014 - 07:13\", formatter);\nString string = formatter.format(parsed);\nSystem.out.println(string);\
    \     // Nov 03, 2014 - 07:13\n```\n\nUnlike `java.text.NumberFormat` the new\
    \ `DateTimeFormatter` is immutable and `thread-safe`.\n\nFor details on the pattern\
    \ syntax read [here](https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html).\n\
    \n## Annotations\n\nAnnotations in Java 8 are repeatable. Let's dive directly\
    \ into an example to figure that out.\n\nFirst, we define a wrapper annotation\
    \ which holds an array of the actual annotations:\n\n```\n@interface Hints {\n\
    \    Hint[] value();\n}\n\n@Repeatable(Hints.class)\n@interface Hint {\n    String\
    \ value();\n}\n```\n\nJava 8 enables us to use multiple annotations of the same\
    \ type by declaring the annotation `@Repeatable`.\n\n### Variant 1: Using the\
    \ container annotation (old school)\n\n```\n@Hints({@Hint(\"hint1\"), @Hint(\"\
    hint2\")})\nclass Person {}\n```\n\n### Variant 2: Using repeatable annotations\
    \ (new school)\n\n```\n@Hint(\"hint1\")\n@Hint(\"hint2\")\nclass Person {}\n```\n\
    \nUsing variant 2 the java compiler implicitly sets up the `@Hints` annotation\
    \ under the hood. That's important for reading annotation information via reflection.\n\
    \n```\nHint hint = Person.class.getAnnotation(Hint.class);\nSystem.out.println(hint);\
    \                   // null\n\nHints hints1 = Person.class.getAnnotation(Hints.class);\n\
    System.out.println(hints1.value().length);  // 2\n\nHint[] hints2 = Person.class.getAnnotationsByType(Hint.class);\n\
    System.out.println(hints2.length);          // 2\n```\n\nAlthough we never declared\
    \ the `@Hints` annotation on the `Person` class, it's still readable via `getAnnotation(Hints.class)`.\
    \ However, the more convenient method is `getAnnotationsByType` which grants direct\
    \ access to all annotated `@Hint` annotations.\n\nFurthermore the usage of annotations\
    \ in Java 8 is expanded to two new targets:\n\n```\n@Target({ElementType.TYPE_PARAMETER,\
    \ ElementType.TYPE_USE})\n@interface MyAnnotation {}\n```\n\n## Where to go from\
    \ here?\n\nMy programming guide to Java 8 ends here. If you want to learn more\
    \ about all the new classes and features of the JDK 8 API, check out my [JDK8\
    \ API Explorer](http://winterbe.com/projects/java8-explorer/). It helps you figuring\
    \ out all the new classes and hidden gems of JDK 8, like `Arrays.parallelSort`,\
    \ `StampedLock` and `CompletableFuture` - just to name a few.\n\nI've also published\
    \ a bunch of follow-up articles on my [blog](http://winterbe.com) that might be\
    \ interesting to you:\n\n* [Java 8 Stream Tutorial](http://winterbe.com/posts/2014/07/31/java8-stream-tutorial-examples/)\n\
    * [Java 8 Nashorn Tutorial](http://winterbe.com/posts/2014/04/05/java8-nashorn-tutorial/)\n\
    * [Java 8 Concurrency Tutorial: Threads and Executors](http://winterbe.com/posts/2015/04/07/java8-concurrency-tutorial-thread-executor-examples/)\n\
    * [Java 8 Concurrency Tutorial: Synchronization and Locks](http://winterbe.com/posts/2015/04/30/java8-concurrency-tutorial-synchronized-locks/)\n\
    * [Java 8 Concurrency Tutorial: Atomic Variables and ConcurrentMap](http://winterbe.com/posts/2015/05/22/java8-concurrency-tutorial-atomic-concurrent-map/)\n\
    * [Java 8 API by Example: Strings, Numbers and Math](http://winterbe.com/posts/2015/03/25/java8-examples-string-number-math/)\n\
    * [Avoid Null Checks in Java 8](http://winterbe.com/posts/2015/03/15/avoid-null-checks-in-java/)\n\
    * [Fixing Java 8 Stream Gotchas with IntelliJ](http://winterbe.com/posts/2015/03/05/fixing-java-8-stream-gotchas-with-intellij-idea/)\n\
    * [Using Backbone.js with Java 8 Nashorn](http://winterbe.com/posts/2014/04/07/using-backbonejs-with-nashorn/)\n"
