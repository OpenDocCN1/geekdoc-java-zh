    \       // 23:59:59\n\nDateTimeFormatter germanFormatter =\n    DateTimeFormatter\n\
    \        .ofLocalizedTime(FormatStyle.SHORT)\n        .withLocale(Locale.GERMAN);\n\
    \nLocalTime leetTime = LocalTime.parse(\"13:37\", germanFormatter);\nSystem.out.println(leetTime);\
    \   // 13:37\n```\n\n### LocalDate\n\n`LocalDate` 表示一个特定的日期，例如 `2014-03-11`。它是不可变的，且工作方式与\
    \ `LocalTime` 完全相同。示例演示了如何通过增加或减少天、月或年来计算新日期。请记住，每次操作都会返回一个新实例。\n\n```\nLocalDate\
    \ today = LocalDate.now();\nLocalDate tomorrow = today.plus(1, ChronoUnit.DAYS);\n\
    LocalDate yesterday = tomorrow.minusDays(2);\n\nLocalDate independenceDay = LocalDate.of(2014,\
    \ Month.JULY, 4);\nDayOfWeek dayOfWeek = independenceDay.getDayOfWeek();\nSystem.out.println(dayOfWeek);\
    \    // FRIDAY\n```\n\n从字符串解析 `LocalDate` 与解析 `LocalTime` 一样简单：\n\n```\nDateTimeFormatter\
    \ germanFormatter =\n    DateTimeFormatter\n        .ofLocalizedDate(FormatStyle.MEDIUM)\n\
    \        .withLocale(Locale.GERMAN);\n\nLocalDate xmas = LocalDate.parse(\"24.12.2014\"\
    , germanFormatter);\nSystem.out.println(xmas);   // 2014-12-24\n```\n\n### LocalDateTime\n\
    \n`LocalDateTime` 表示一个日期时间。它将上述章节中的日期和时间合并为一个实例。`LocalDateTime` 是不可变的，且工作方式与 `LocalTime`\
    \ 和 `LocalDate` 相似。我们可以利用方法从日期时间中提取某些字段：\n\n```\nLocalDateTime sylvester = LocalDateTime.of(2014,\
    \ Month.DECEMBER, 31, 23, 59, 59);\n\nDayOfWeek dayOfWeek = sylvester.getDayOfWeek();\n\
    System.out.println(dayOfWeek);      // WEDNESDAY\n\nMonth month = sylvester.getMonth();\n\
    System.out.println(month);          // DECEMBER\n\nlong minuteOfDay = sylvester.getLong(ChronoField.MINUTE_OF_DAY);\n\
    System.out.println(minuteOfDay);    // 1439\n```\n\n带有额外的时区信息，它可以转换为 `Instant`。`Instant`\
    \ 可以轻松转换为 `java.util.Date` 类型的旧日期。\n\n```\nInstant instant = sylvester\n     \
    \   .atZone(ZoneId.systemDefault())\n        .toInstant();\n\nDate legacyDate\
    \ = Date.from(instant);\nSystem.out.println(legacyDate);     // Wed Dec 31 23:59:59\
    \ CET 2014\n```\n\n格式化日期时间的方法与格式化日期或时间一样。我们不再使用预定义的格式，而是从自定义模式创建格式化器。\n\n```\n\
    DateTimeFormatter formatter =\n    DateTimeFormatter\n        .ofPattern(\"MMM\
    \ dd, yyyy - HH:mm\");\n\nLocalDateTime parsed = LocalDateTime.parse(\"Nov 03,\
    \ 2014 - 07:13\", formatter);\nString string = formatter.format(parsed);\nSystem.out.println(string);\
    \     // Nov 03, 2014 - 07:13\n```\n\n与 `java.text.NumberFormat` 不同，新的 `DateTimeFormatter`\
    \ 是不可变的且**线程安全的**。\n\n关于模式语法的细节，请阅读[此处](https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html)。\n\
    \n## 注解 (Annotations)\n\nJava 8 中的注解是可重复的。让我们直接通过一个示例了解这一点。\n\n首先，我们定义了一个包装注解，它持有一个实际注解的数组：\n\
    \n```\n@interface Hints {\n    Hint[] value();\n}\n\n@Repeatable(Hints.class)\n\
    @interface Hint {\n    String value();\n}\n```\n\nJava 8 允许我们通过声明注解 `@Repeatable`\
    \ 来使用相同类型的多个注解。\n\n### 变体 1：使用容器注解（旧式）\n\n```\n@Hints({@Hint(\"hint1\"), @Hint(\"\
    hint2\")})\nclass Person {}\n```\n\n### 变体 2：使用重复注解（新式）\n\n```\n@Hint(\"hint1\"\
    )\n@Hint(\"hint2\")\nclass Person {}\n```\n\n使用变体 2 时，Java 编译器会在底层隐含设置 `@Hints`\
    \ 注解。这对于通过反射读取注解信息非常重要。\n\n```\nHint hint = Person.class.getAnnotation(Hint.class);\n\
    System.out.println(hint);                   // null\n\nHints hints1 = Person.class.getAnnotation(Hints.class);\n\
    System.out.println(hints1.value().length);  // 2\n\nHint[] hints2 = Person.class.getAnnotationsByType(Hint.class);\n\
    System.out.println(hints2.length);          // 2\n```\n\n尽管我们从未在 `Person` 类上声明过\
    \ `@Hints` 注解，但仍然可以通过 `getAnnotation(Hints.class)` 进行读取。然而，更方便的方法是 `getAnnotationsByType`，它允许直接访问所有被标记的\
    \ `@Hint` 注解。\n\n此外，Java 8 中注解的使用扩展到了两个新目标：\n\n```\n@Target({ElementType.TYPE_PARAMETER,\
    \ ElementType.TYPE_USE})\n@interface MyAnnotation {}\n```\n\n## 接下来该去哪里？\n\n我的\
    \ Java 8 编程指南到此结束。如果你想更多关于 JDK 8 API 的所有新类和特性，请查看我的 [JDK8 API 探索器](http://winterbe.com/projects/java8-explorer/)。它可以帮助你发现\
    \ JDK 8 的所有新类和隐藏珍宝，例如 `Arrays.parallelSort`、`StampedLock` 和 `CompletableFuture`\
    \ —— 这仅仅是其中之一。\n\n我还在[博客](http://winterbe.com)上发布了一系列后续文章，你可能也会感兴趣：\n\n* [Java\
    \ 8 Stream 教程](http://winterbe.com/posts/2014/07/31/java8-stream-tutorial-examples/)\n\
