    \ are untyped. Nashorn enables you to use typed java arrays in javascript:\n\n\
    ```\nvar IntArray = Java.type(\"int[]\");\n\nvar array = new IntArray(5);\narray[0]\
    \ = 5;\narray[1] = 4;\narray[2] = 3;\narray[3] = 2;\narray[4] = 1;\n\ntry {\n\
    \    array[5] = 23;\n} catch (e) {\n    print(e.message);  // Array index out\
    \ of range: 5\n}\n\narray[0] = \"17\";\nprint(array[0]);  // 17\n\narray[0] =\
    \ \"wrong type\";\nprint(array[0]);  // 0\n\narray[0] = \"17.3\";\nprint(array[0]);\
    \  // 17\n```\n\nThe `int[]` array behaves like a real java int array. But additionally\
    \ Nashorn performs implicit type conversions under the hood when we're trying\
    \ to add non-integer values to the array. Strings will be auto-converted to int\
    \ which is quite handy.\n\n#### Collections and For Each\n\nInstead of messing\
    \ around with arrays we can use any java collection. First define the java type\
    \ via `Java.type`, then create new instances on demand.\n\n```\nvar ArrayList\
    \ = Java.type('java.util.ArrayList');\nvar list = new ArrayList();\nlist.add('a');\n\
    list.add('b');\nlist.add('c');\n\nfor each (var el in list) print(el);  // a,\
    \ b, c\n```\n\nIn order to iterate over collections and arrays Nashorn introduces\
    \ the `for each` statement. It works just like the foreach loop in java.\n\nHere's\
    \ another collection foreach example, utilizing `HashMap`:\n\n```\nvar map = new\
    \ java.util.HashMap();\nmap.put('foo', 'val1');\nmap.put('bar', 'val2');\n\nfor\
    \ each (var e in map.keySet()) print(e);  // foo, bar\n\nfor each (var e in map.values())\
    \ print(e);  // val1, val2\n```\n\n#### Lambda expressions and Streams\n\nEveryone\
    \ loves lambdas and streams - so does Nashorn! Although ECMAScript 5.1 lacks the\
    \ compact arrow syntax from the Java 8 lambda expressions, we can use function\
    \ literals where ever lambda expressions are accepted.\n\n```\nvar list2 = new\
    \ java.util.ArrayList();\nlist2.add(\"ddd2\");\nlist2.add(\"aaa2\");\nlist2.add(\"\
    bbb1\");\nlist2.add(\"aaa1\");\nlist2.add(\"bbb3\");\nlist2.add(\"ccc\");\nlist2.add(\"\
    bbb2\");\nlist2.add(\"ddd1\");\n\nlist2\n    .stream()\n    .filter(function(el)\
    \ {\n        return el.startsWith(\"aaa\");\n    })\n    .sorted()\n    .forEach(function(el)\
    \ {\n        print(el);\n    });\n    // aaa1, aaa2\n```\n\n#### Extending classes\n\
    \nJava types can simply be extended with the `Java.extend` extension. As you can\
    \ see in the next example, you can even create multi-threaded code in your scripts:\n\
    \n```\nvar Runnable = Java.type('java.lang.Runnable');\nvar Printer = Java.extend(Runnable,\
    \ {\n    run: function() {\n        print('printed from a separate thread');\n\
    \    }\n});\n\nvar Thread = Java.type('java.lang.Thread');\nnew Thread(new Printer()).start();\n\
    \nnew Thread(function() {\n    print('printed from another thread');\n}).start();\n\
    \n// printed from a separate thread\n// printed from another thread\n```\n\n####\
    \ Parameter overloading\n\nMethods and functions can either be called with the\
    \ point notation or with the square braces notation.\n\n```\nvar System = Java.type('java.lang.System');\n\
    System.out.println(10);              // 10\nSystem.out[\"println\"](11.0);   \
    \      // 11.0\nSystem.out[\"println(double)\"](12);   // 12.0\n```\n\nPassing\
    \ the optional parameter type `println(double)` when calling a method with overloaded\
    \ parameters determines the exact method to be called.\n\n#### Java Beans\n\n\
    Instead of explicitly working with getters and setters you can just use simple\
    \ property names both for getting or setting values from a java bean.\n\n```\n\
    var Date = Java.type('java.util.Date');\nvar date = new Date();\ndate.year +=\
    \ 1900;\nprint(date.year);  // 2014\n```\n\n#### Function Literals\n\nFor simple\
    \ one line functions we can skip the curly braces:\n\n```\nfunction sqr(x) x *\
    \ x;\nprint(sqr(3));    // 9\n```\n\n#### Binding properties\n\nProperties from\
    \ two different objects can be bound together:\n\n```\nvar o1 = {};\nvar o2 =\
    \ { foo: 'bar'};\n\nObject.bindProperties(o1, o2);\n\nprint(o1.foo);    // bar\n\
    o1.foo = 'BAM';\nprint(o2.foo);    // BAM\n```\n\n#### Trimming strings\n\nI like\
    \ my strings trimmed.\n\n```\nprint(\"   hehe\".trimLeft());            // hehe\n\
    print(\"hehe    \".trimRight() + \"he\");   // hehehe\n```\n\n#### Whereis\n\n\
    In case you forget where you are:\n\n```\nprint(__FILE__, __LINE__, __DIR__);\n\
    ```\n\n#### Import Scopes\n\nSometimes it's useful to import many java packages\
    \ at once. We can use the class `JavaImporter` to be used in conjunction with\
    \ the `with` statement. All class files from the imported packages are accessible\
    \ within the local scope of the `with` statement:\n\n```\nvar imports = new JavaImporter(java.io,\
    \ java.lang);\nwith (imports) {\n    var file = new File(__FILE__);\n    System.out.println(file.getAbsolutePath());\n\
    \    // /path/to/my/script.js\n}\n```\n\n#### Convert arrays\n\nSome packages\
    \ like `java.util` can be accessed directly without utilizing `Java.type` or `JavaImporter`:\n\
    \n```\nvar list = new java.util.ArrayList();\nlist.add(\"s1\");\nlist.add(\"s2\"\
    );\nlist.add(\"s3\");\n```\n\nThis code converts the java list to a native javascript\
    \ array:\n\n```\nvar jsArray = Java.from(list);\nprint(jsArray);             \
    \                     // s1,s2,s3\nprint(Object.prototype.toString.call(jsArray));\
    \  // [object Array]\n```\n\nAnd the other way around:\n\n```\nvar javaArray =\
    \ Java.to([3, 5, 7, 11], \"int[]\");\n```\n\n#### Calling Super\n\nAccessing overridden\
    \ members in javascript is traditionally awkward because javas `super` keyword\
    \ doesn't exist in ECMAScript. Luckily nashorn goes to the rescue.\n\nFirst we\
    \ define a super type in java code:\n\n```\nclass SuperRunner implements Runnable\
    \ {\n    @Override\n    public void run() {\n        System.out.println(\"super\
    \ run\");\n    }\n}\n```\n\nNext we override `SuperRunner` from javascript. Pay\
    \ attention to the extended nashorn syntax when creating a new `Runner` instance:\
    \ The syntax of overriding members is borrowed from javas anonymous objects.\n\
    \n```\nvar SuperRunner = Java.type('com.winterbe.java8.SuperRunner');\nvar Runner\
    \ = Java.extend(SuperRunner);\n\nvar runner = new Runner() {\n    run: function()\
    \ {\n        Java.super(runner).run();\n        print('on my run');\n    }\n}\n\
    runner.run();\n\n// super run\n// on my run\n```\n\nWe call the overridden method\
    \ `SuperRunner.run()` by utilizing the `Java.super` extension.\n\n#### Loading\
    \ scripts\n\nEvaluating additional script files from javascript is quite easy.\
    \ We can load both local or remote scripts with the `load` function.\n\nI'm using\
    \ [Underscore.js](http://underscorejs.org/) a lot for my web front-ends, so let's\
    \ reuse Underscore in Nashorn:\n\n```\nload('http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.6.0/underscore-min.js');\n\
    \nvar odds = _.filter([1, 2, 3, 4, 5, 6], function (num) {\n    return num % 2\
    \ == 1;\n});\n\nprint(odds);  // 1, 3, 5\n```\n\nThe external script will be evaluated\
    \ in the same javascript context, so we can access the underscore variable directly.\
    \ Keep in mind that loading scripts can potentially break your own code when variable\
    \ names are overlapping each other.\n\nThis problem can be bypassed by loading\
    \ script files into a new global context:\n\n```\nloadWithNewGlobal('script.js');\n\
    ```\n\n### Command-line scripts"
