  trans: "\n现在，`map` 只会被调用一次，因此对于大量的输入元素，操作流水线的执行速度会快得多。在组合复杂的方法链时，请记住这一点。\n\n让我们通过增加额外的操作\
    \ `sorted` 来扩展上面的示例：\n\n```java\nStream.of(\"d2\", \"a2\", \"b1\", \"b3\", \"\
    c\")\n    .sorted((s1, s2) -> {\n        System.out.printf(\"sort: %s; %s\\n\"\
    , s1, s2);\n        return s1.compareTo(s2);\n    })\n    .filter(s -> {\n   \
    \     System.out.println(\"filter: \" + s);\n        return s.startsWith(\"a\"\
    );\n    })\n    .map(s -> {\n        System.out.println(\"map: \" + s);\n    \
    \    return s.toUpperCase();\n    })\n    .forEach(s -> System.out.println(\"\
    forEach: \" + s));\n```\n\n排序是一种特殊的中间操作。它被称为“有状态操作”（stateful operation），因为为了对元素集合进行排序，你需要在排序过程中维护状态。\n\
    \n执行此示例将得到以下控制台输出：\n\n```\nsort:    a2; d2\nsort:    b1; a2\nsort:    b1; d2\n\
    sort:    b1; a2\nsort:    b3; b1\nsort:    b3; d2\nsort:    c; b3\nsort:    c;\
    \ d2\nfilter:  a2\nmap:     a2\nforEach: A2\nfilter:  b1\nfilter:  b3\nfilter:\
    \  c\nfilter:  d2\n```\n\n首先，排序操作在整个输入集合上执行。换句话说，`sorted` 是水平执行的。在这种情况下，`sorted`\
    \ 为输入集合中每个元素的多种组合调用了八次。\n\n我们再次通过重新调整链来优化性能：\n\n```java\nStream.of(\"d2\", \"\
    a2\", \"b1\", \"b3\", \"c\")\n    .filter(s -> {\n        System.out.println(\"\
    filter: \" + s);\n        return s.startsWith(\"a\");\n    })\n    .sorted((s1,\
    \ s2) -> {\n        System.out.printf(\"sort: %s; %s\\n\", s1, s2);\n        return\
    \ s1.compareTo(s2);\n    })\n    .map(s -> {\n        System.out.println(\"map:\
    \ \" + s);\n        return s.toUpperCase();\n    })\n    .forEach(s -> System.out.println(\"\
    forEach: \" + s));\n\n// filter:  d2\n// filter:  a2\n// filter:  b1\n// filter:\
    \  b3\n// filter:  c\n// map:     a2\n// forEach: A2\n```\n\n在这个示例中，`sorted` 从未被调用过，因为\
    \ `filter` 将输入集合减少到只有一个元素。因此，对于较大的输入集合，性能大大提高。\n\n### 重用流\n\nJava 8 的流是不可重用的。一旦你调用任何终端操作，流就会关闭：\n\
    \n```java\nStream<String> stream =\n    Stream.of(\"d2\", \"a2\", \"b1\", \"b3\"\
    , \"c\")\n        .filter(s -> s.startsWith(\"a\"));\n\nstream.anyMatch(s -> true);\
    \    // ok\nstream.noneMatch(s -> true);   // exception\n```\n\n在同一个流上调用 `anyMatch`\
    \ 后调用 `noneMatch` 将导致以下异常：\n\n```\njava.lang.IllegalStateException: stream has\
    \ already been operated upon or closed\n    at java.util.stream.AbstractPipeline.evaluate(AbstractPipeline.java:229)\n\
    \    at java.util.stream.ReferencePipeline.noneMatch(ReferencePipeline.java:459)\n\
    \    at com.winterbe.java8.Streams5.test7(Streams5.java:38)\n    at com.winterbe.java8.Streams5.main(Streams5.java:28)\n\
    ```\n\n为了克服这个限制，我们必须为为想要执行的每个终端操作创建一个新的流链，例如，我们可以创建一个流供应者（stream supplier）来构造一个已经设置好所有中间操作的新流：\n\
    \n```java\nSupplier<Stream<String>> streamSupplier =\n    () -> Stream.of(\"d2\"\
    , \"a2\", \"b1\", \"b3\", \"c\")\n            .filter(s -> s.startsWith(\"a\"\
    ));\n\nstreamSupplier.get().anyMatch(s -> true);   // ok\nstreamSupplier.get().noneMatch(s\
    \ -> true);  // ok\n```\n\n每次调用 `get()` 都会构建一个新的流，我们在上面安全地调用所需的终端操作。\n\n### 高级操作\n\
    \n流支持许多不同的操作。我们已经学习了如 `filter` 或 `map` 这样最重要的操作。我留给你去发现所有其他可用操作（参见 [Stream Javadoc](http://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html)）。相反，让我们深入研究更复杂的操作\
    \ `collect`、`flatMap` 和 `reduce`。\n\n本节的大多数代码示例使用以下人员列表进行演示：\n\n```java\nclass\
    \ Person {\n    String name;\n    int age;\n\n    Person(String name, int age)\
    \ {\n        this.name = name;\n        this.age = age;\n    }\n\n    @Override\n\
    \    public String toString() {\n        return name;\n    }\n}\n```\n\n#### Collect\n\
    \n本节的大多数代码示例使用以下人员列表进行演示：（见上文）\n\n`collect` 是一个终端操作，用于将元素转换为 `list`、`set` 或 `map`。这听起来很复杂，但我们不需要自己实现它。\n\
    \n下一个示例将所有元素合并到一个列表：\n\n```java\nList<Person> filtered =\n    persons\n      \
    \  .stream()\n        .filter(p -> p.name.startsWith(\"P\"))\n        .collect(Collectors.toList());\n\
    \nSystem.out.println(filtered);    // [Peter]\n```\n\n如果需要一个集合 - 使用 `Collectors.toSet()`：\n\
    \n```java\nSet<Person> set =\n    persons\n        .stream()\n        .collect(Collectors.toSet());\n\
    ```\n\n下一个示例按年龄对所有人分组：\n\n```java\nMap<Integer, List<Person>> personsByAge =\n\
    \    persons\n    .stream()\n    .collect(Collectors.groupingBy(p -> p.age));\n\
    \npersonsByAge\n    .forEach((age, p) -> System.out.format(\"age %s\\n\", age,\
    \ p));\n\n// age 18: [Max]\n// age 23: [Pamela]\n// age 12: [David]\n```\n\n为了将流元素转换为\
    \ map，我们必须指定键和值如何映射。请记住，映射的键必须唯一，否则将抛出 `IllegalStateException`。你可以可选地传递一个合并函数来跳过异常：\n\
    \n```java\nMap<Integer, String> map =\n    persons.stream()\n    .collect(Collectors.toMap(\n\
    \        p -> p.age,\n        p -> p.name,\n        (name1, name2) -> name1 +\
    \ \";\" + name2));\n\nSystem.out.println(map);\n// {18=Max, 23=Peter;Pamela, 12=David}\n\
    ```\n\nCollectors 非常通用。你还可以在流上创建聚合，例如计算所有人的平均年龄：\n\n```java\nDouble averageAge\
    \ = persons\n    .stream()\n    .collect(Collectors.averagingInt(p -> p.age));\n\
    \nSystem.out.println(averageAge);     // 19.0\n```\n\n对全面的统计数据感兴趣，汇总收集器返回一个特殊的统计对象。因此我们可以简单地确定\
    \ `min`、`max` 和算术平均值 `average`，以及 `sum` 和 `count`。\n\n```java\nIntSummaryStatistics\
    \ ageSummary =\n    persons\n        .stream()\n        .collect(Collectors.summarizingInt(p\
    \ -> p.age));\n\nSystem.out.println(ageSummary);\n// IntSummaryStatistics{count=4,\
    \ sum=76, min=12, average=19.000000, max=23}\n```\n\njoin 收集器接受一个分隔符以及可选的前缀和后缀：\n\
    \n```java\nString phrase = persons\n    .stream()\n    .filter(p -> p.age >= 18)\n\
    \    .map(p -> p.name)\n    .collect(Collectors.joining(\" and \", \"In Germany\
    \ \", \" are of legal age.\"));\n\nSystem.out.println(phrase);\n// In Germany\
    \ Max and Pamela are of legal age.\n```现在我们已经了解了一些强大的内置收集器，让我们尝试构建我们自己的特殊收集器。我们想将流中的所有人转换为单个字符串，由大写字母名称组成并用\
    \ `|` 管道字符分隔。为了实现这一点，我们通过 `Collector.of()` 创建一个新的收集器。我们必须传递收集器的四个成分：一个*供应者*（supplier）、一个*累加器*（accumulator）、一个*合并器*（combiner）和一个*完成者*（finisher）。"
- fmt: "\n```\nCollector<Person, StringJoiner, String> personNameCollector =\n   \
    \ Collector.of(\n        () -> new StringJoiner(\" | \"),          // supplier\n\
    \        (j, p) -> j.add(p.name.toUpperCase()),  // accumulator\n        (j1,\
    \ j2) -> j1.merge(j2),               // combiner\n        StringJoiner::toString);\
    \                // finisher\n\nString names = persons\n    .stream()\n    .collect(personNameCollector);\n\
    \nSystem.out.println(names);  // MAX | PETER | PAMELA | DAVID\n```\n\nSince strings\
    \ in Java are immutable, we need a helper class like `StringJoiner` to let the\
    \ collector construct our string. The supplier initially constructs such a `StringJoiner`\
    \ with the appropriate delimiter. The accumulator is used to add each persons\
    \ upper-cased name to the `StringJoiner`. The combiner knows how to merge two\
    \ `StringJoiners` into one. In the last step the finisher constructs the desired\
    \ `String` from the `StringJoiner`.\n\n#### FlatMap\n\nWe've already learned how\
    \ to transform the objects of a stream into another type of objects by utilizing\
    \ the `map` operation. Map is kinda limited because every object can only be mapped\
    \ to exactly one other object. But what if we want to transform one object into\
    \ multiple others or none at all? This is where `flatMap` comes to the rescue.\n\
    \nFlatMap transforms each element of the stream into a stream of other objects.\
    \ So each object will be transformed into zero, one or multiple other objects\
    \ backed by streams. The contents of those streams will then be placed into the\
    \ returned stream of the `flatMap` operation.\n\nBefore we see `flatMap` in action\
    \ we need an appropriate type hierarchy:\n\n```\nclass Foo {\n    String name;\n\
    \    List<Bar> bars = new ArrayList<>();\n\n    Foo(String name) {\n        this.name\
    \ = name;\n    }\n}\n\nclass Bar {\n    String name;\n\n    Bar(String name) {\n\
    \        this.name = name;\n    }\n}\n```\n\nNext, we utilize our knowledge about\
    \ streams to instantiate a couple of objects:\n\n```\nList<Foo> foos = new ArrayList<>();\n\
    \n// create foos\nIntStream\n    .range(1, 4)\n    .forEach(i -> foos.add(new\
    \ Foo(\"Foo\" + i)));\n\n// create bars\nfoos.forEach(f ->\n    IntStream\n  \
    \      .range(1, 4)\n        .forEach(i -> f.bars.add(new Bar(\"Bar\" + i + \"\
    \ <- \" + f.name))));\n```\n\nNow we have a list of three foos each consisting\
    \ of three bars.\n\nFlatMap accepts a function which has to return a stream of\
    \ objects. So in order to resolve the bar objects of each foo, we just pass the\
    \ appropriate function:\n\n```\nfoos.stream()\n    .flatMap(f -> f.bars.stream())\n\
    \    .forEach(b -> System.out.println(b.name));\n\n// Bar1 <- Foo1\n// Bar2 <-\
    \ Foo1\n// Bar3 <- Foo1\n// Bar1 <- Foo2\n// Bar2 <- Foo2\n// Bar3 <- Foo2\n//\
    \ Bar1 <- Foo3\n// Bar2 <- Foo3\n// Bar3 <- Foo3\n```\n\nAs you can see, we've\
    \ successfully transformed the stream of three foo objects into a stream of nine\
    \ bar objects.\n\nFinally, the above code example can be simplified into a single\
    \ pipeline of stream operations:\n\n```\nIntStream.range(1, 4)\n    .mapToObj(i\
    \ -> new Foo(\"Foo\" + i))\n    .peek(f -> IntStream.range(1, 4)\n        .mapToObj(i\
    \ -> new Bar(\"Bar\" + i + \" <- \" f.name))\n        .forEach(f.bars::add))\n\
    \    .flatMap(f -> f.bars.stream())\n    .forEach(b -> System.out.println(b.name));\n\
    ```\n\nFlatMap is also available for the `Optional` class introduced in Java 8.\
    \ Optionals `flatMap` operation returns an optional object of another type. So\
    \ it can be utilized to prevent nasty `null` checks.\n\nThink of a highly hierarchical\
    \ structure like this:\n\n```\nclass Outer {\n    Nested nested;\n}\n\nclass Nested\
    \ {\n    Inner inner;\n}\n\nclass Inner {\n    String foo;\n}\n```\n\nIn order\
    \ to resolve the inner string `foo` of an outer instance you have to add multiple\
    \ null checks to prevent possible NullPointerExceptions:\n\n```\nOuter outer =\
    \ new Outer();\nif (outer != null && outer.nested != null && outer.nested.inner\
    \ != null) {\n    System.out.println(outer.nested.inner.foo);\n}\n```\n\nThe same\
    \ behavior can be obtained by utilizing optionals `flatMap` operation:\n\n```\n\
    Optional.of(new Outer())\n    .flatMap(o -> Optional.ofNullable(o.nested))\n \
    \   .flatMap(n -> Optional.ofNullable(n.inner))\n    .flatMap(i -> Optional.ofNullable(i.foo))\n\
    \    .ifPresent(System.out::println);\n```\n\nEach call to `flatMap` returns an\
    \ `Optional` wrapping the desired object if present or `null` if absent.\n\n####\
    \ Reduce\n\nThe reduction operation combines all elements of the stream into a\
    \ single result. Java 8 supports three different kind of `reduce` methods. The\
    \ first one reduces a stream of elements to exactly one element of the stream.\
    \ Let's see how we can use this method to determine the oldest person:\n\n```\n\
    persons\n    .stream()\n    .reduce((p1, p2) -> p1.age > p2.age ? p1 : p2)\n```\n\
    \nThe second one reduces a stream of elements to a single result using an accumulator.\
    \ Let's see how we can use this method to determine the oldest person:\n\n```\n\
    persons\n    .stream()\n    .reduce(identity, (p1, p2) -> p1.age > p2.age ? p1\
    \ : p2)\n```\n\nThe third one reduces a stream of elements to a single result\
    \ using an identity and an accumulator. Let's see how we can use this method to\
    \ determine the oldest person:\n\n```\npersons\n    .stream()\n    .reduce(identity,\
    \ (p1, p2) -> p1.age > p2.age ? p1 : p2, combiner);\n```\n"
