  trans: "\n\n```\nCollector<Person, StringJoiner, String> personNameCollector =\n\
    \    Collector.of(\n        () -> new StringJoiner(\" | \"),          // supplier\n\
    \        (j, p) -> j.add(p.name.toUpperCase()),  // accumulator\n        (j1,\
    \ j2) -> j1.merge(j2),               // combiner\n        StringJoiner::toString);\
    \                // finisher\n\nString names = persons\n    .stream()\n    .collect(personNameCollector);\n\
    \nSystem.out.println(names);  // MAX | PETER | PAMELA | DAVID\n```\n\n由于 Java\
    \ 中的字符串是不可变的，我们需要一个像 `StringJoiner` 这样的辅助类来让收集器构建我们的字符串。供给者（supplier）最初构造具有适当分隔符的\
    \ `StringJoiner`。累加器（accumulator）用于将每个人的大写名称添加到 `StringJoiner` 中。合并器（combiner）知道如何将两个\
    \ `StringJoiner` 合并为一个。在最后一步，完成器（finisher）从 `StringJoiner` 构建出所需的 `String`。\n\n\
    #### FlatMap\n\n我们已经学习了如何利用 `map` 操作将流中的对象转换为另一种类型的对象。`map` 有些局限性，因为每个对象只能映射到好一个另一个对象。但如果我们想将一个对象转换为多个对象或者一个都不转换呢？这就是\
    \ `flatMap` 大显身用场的地方。\n\n`flatMap` 将流中的每个元素转换为其他对象的流。因此，每个对象都将转换为零、一个或多个由流支持的其他对象。这些流的内容随后将被放入\
    \ `flatMap` 操作返回的流中。\n\n在查看 `flatMap` 的实际运行之前，我们需要一个合适的类型层次结构：\n\n```\nclass Foo\
    \ {\n    String name;\n    List<Bar> bars = new ArrayList<>();\n\n    Foo(String\
    \ name) {\n        this.name = name;\n    }\n}\n\nclass Bar {\n    String name;\n\
    \n    Bar(String name) {\n        this.name = name;\n    }\n}\n```\n\n接下来，我们利用关于流的知识来实例化对象：\n\
    \n```\nList<Foo> foos = new ArrayList<>();\n\n// create foos\nIntStream\n    .range(1,\
    \ 4)\n    .forEach(i -> foos.add(new Foo(\"Foo\" + i)));\n\n// create bars\nfoos.forEach(f\
    \ ->\n    IntStream\n        .range(1, 4)\n        .forEach(i -> f.bars.add(new\
    \ Bar(\"Bar\" + i + \" <- \" + f.name))));\n```\n\n现在我们有一个包含三个 foo 的列表，每个 foo\
    \ 由三个 bar 组成。\n\n`flatMap` 一个返回对象流的函数。因此，为了解析每个 foo 的 bar 对象，我们只需要传递相应的函数：\n\n\
    ```\nfoos.stream()\n    .flatMap(f -> f.bars.stream())\n    .forEach(b -> System.out.println(b.name));\n\
    \n// Bar1 <- Foo1\n// Bar2 <- Foo1\n// Bar3 <- Foo1\n// Bar1 <- Foo2\n// Bar2\
    \ <- Foo2\n// Bar3 <- Foo2\n// Bar1 <- Foo3\n// Bar2 <- Foo3\n// Bar3 <- Foo3\n\
    ```\n\n如你所见，我们成功地将三个 foo 对象的流转换为九 bar 对象的流。\n\n最后，上面的代码示例可以简化为单一的流操作流水线：\n\n```\n\
    IntStream.range(1, 4)\n    .mapToObj(i -> new Foo(\"Foo\" + i))\n    .peek(f ->\
    \ IntStream.range(1, 4)\n        .mapToObj(i -> new Bar(\"Bar\" + i + \" <- \"\
    \ + f.name))\n        .forEach(f.bars::add))\n    .flatMap(f -> f.bars.stream())\n\
    \    .forEach(b -> System.out.println(b.name));\n```\n\n`flatMap` 也适用于 Java 8\
    \ 引入的 `Optional` 类。Optional 的 `flatMap` 操作返回另一个其他类型的可选对象。因此，它可以被用于防止糟糕的 `null`\
    \ 检查。\n\n想象一个这样一个高度层次化的结构：\n\n```\nclass Outer {\n    Nested nested;\n}\n\nclass\
    \ Nested {\n    Inner inner;\n}\n\nclass Inner {\n    String foo;\n}\n```\n\n\
    为了解析外部实例的内部字符串 `foo`，你必须添加多个空值检查以防止可能的 `NullPointerException`：\n\n```\nOuter outer\
    \ = new Outer();\nif (outer != null && outer.nested != null && outer.nested.inner\
    \ != null) {\n    System.out.println(outer.nested.inner.foo);\n}\n```\n\n通过利用可选的\
    \ `flatMap` 操作可以获得相同的行为：\n\n```\nOptional.of(new Outer())\n    .flatMap(o -> Optional.ofNullable(o.nested))\n\
    \    .flatMap(n -> Optional.ofNullable(n.inner))\n    .flatMap(i -> Optional.ofNullable(i.foo))\n\
    \    .ifPresent(System.out::println);\n```\n\n每次调用 `flatMap` 都会返回一个包装了所需对象的 `Optional`，如果不存在则返回\
    \ `null`。\n\n#### Reduce\n\n归约（reduction）操作将流中的所有元素合并为单个结果。Java 8 支持三种不同的 `reduce`\
    \ 方法。第一种将元素流归约为流中的恰好一个元素。让我们看看如何使用这种方法来确定年龄最大的人：\n\n```\npersons\n    .stream()\n\
    \    .reduce((p1, p2) -> p1.age > p2.age ? p1 : p2)\n```\n\n第二种使用累加器将元素流归约为单个结果。让我们看看如何使用这种方法来确定年龄最大的人：\n\
    \n```\npersons\n    .stream()\n    .reduce(identity, (p1, p2) -> p1.age > p2.age\
    \ ? p1 : p2)\n```\n\n第三种使用恒等和累加器将元素流归约为单个结果。让我们看看如何使用这种方法来确定年龄最大的人：\n\n```\npersons\n\
    \    .stream()\n    .reduce(identity, (p1, p2) -> p1.age > p2.age ? p1 : p2, combiner);\n\
    ```\n\n"
- fmt: "\nStreams can be executed in parallel to increase runtime performance on large\
    \ amount of input elements. Parallel streams use a common `ForkJoinPool` available\
    \ via the static `ForkJoinPool.commonPool()` method. The size of the underlying\
    \ thread-pool uses up to five threads - depending on the amount of available physical\
    \ CPU cores:\n\n```\nForkJoinPool commonPool = ForkJoinPool.commonPool();\nSystem.out.println(commonPool.getParallelism());\
    \    // 3\n```\n\nOn my machine the common pool is initialized with a parallelism\
    \ of 3 per default. This value can be decreased or increased by setting the following\
    \ JVM parameter:\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\nCollections support the method `parallelStream()` to create a parallel\
    \ stream of elements. Alternatively you can call the intermediate method `parallel()`\
    \ on a given stream to convert a sequential stream to a parallel counterpart.\n\
    \nIn order to understate the parallel execution behavior of a parallel stream\
    \ the next example prints information about the current thread to `sout`:\n\n\
    ```\nArrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"c1\")\n    .parallelStream()\n\
    \    .filter(s -> {\n        System.out.format(\"filter: %s [%s]\\n\",\n     \
    \       s, Thread.currentThread().getName());\n        return true;\n    })\n\
    \    .map(s -> {\n        System.out.format(\"map: %s [%s]\\n\",\n           \
    \ s, Thread.currentThread().getName());\n        return s.toUpperCase();\n   \
    \ })\n    .forEach(s -> System.out.format(\"forEach: %s [%s]\\n\",\n        s,\
    \ Thread.currentThread().getName()));\n```\n\nBy investigating the debug output\
    \ we should get a better understanding which threads are actually used to execute\
    \ the stream operations:\n\n```\nfilter:  b1 [main]\nfilter:  a2 [ForkJoinPool.commonPool-worker-1]\n\
    map:     a2 [ForkJoinPool.commonPool-worker-1]\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\n\
    map:     c2 [ForkJoinPool.commonPool-worker-3]\nfilter:  c1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     c1 [ForkJoinPool.commonPool-worker-2]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A2 [ForkJoinPool.commonPool-worker-1]\nmap:     b1 [main]\nforEach: B1\
    \ [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-3]\nmap:     a1 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-3]\nforEach: C1 [ForkJoinPool.commonPool-worker-2]\n\
    ```\n\nAs you can see the parallel stream utilizes all available threads from\
    \ the common `ForkJoinPool` for executing the stream operations. The output may\
    \ differ in consecutive runs because the behavior which particular thread is actually\
    \ used is non-deterministic.\n\nLet's extend the example by an additional stream\
    \ operation, `sort`:\n\n```\nArrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"\
    c1\")\n    .parallelStream()\n    .filter(s -> {\n        System.out.format(\"\
    filter: %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n   \
    \     return true;\n    })\n    .map(s -> {\n        System.out.format(\"map:\
    \ %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n        return\
    \ s.toUpperCase();\n    })\n    .sorted((s1, s2) -> {\n        System.out.format(\"\
    sort: %s <> %s [%s]\\n\",\n            s1, s2, Thread.currentThread().getName());\n\
    \        return s1.compareTo(s2);\n    })\n    .forEach(s -> System.out.format(\"\
    forEach: %s [%s]\\n\",\n        s, Thread.currentThread().getName()));\n```\n\n\
    The result may look strange at first:\n\n```\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\n\
    filter:  c1 [ForkJoinPool.commonPool-worker-2]\nmap:     c1 [ForkJoinPool.commonPool-worker-2]\n\
    filter:  a2 [ForkJoinPool.commonPool-worker-1]\nmap:     a2 [ForkJoinPool.commonPool-worker-1]\n\
    filter:  b1 [main]\nmap:     b1 [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     a1 [ForkJoinPool.commonPool-worker-2]\nmap:     c2 [ForkJoinPool.commonPool-worker-3]\n\
    sort:    A2 <> A1 [main]\nsort:    B1 <> A2 [main]\nsort:    C2 <> B1 [main]\n\
    sort:    C1 <> C2 [main]\nsort:    C1 <> B1 [main]\nsort:    C1 <> C2 [main]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-1]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: B1 [main]\nforEach: A2 [ForkJoinPool.commonPool-worker-2]\nforEach: C1\
    \ [ForkJoinPool.commonPool-worker-1]\n```\n"
  raw: "Streams can be executed in parallel to increase runtime performance on large\
    \ amount of input elements. Parallel streams use a common `ForkJoinPool` available\
    \ via the static `ForkJoinPool.commonPool()` method. The size of the underlying\
    \ thread-pool uses up to five threads - depending on the amount of available physical\
    \ CPU cores:\n\n```\nForkJoinPool commonPool = ForkJoinPool.commonPool();\nSystem.out.println(commonPool.getParallelism());\
    \    // 3\n```\n\nOn my machine the common pool is initialized with a parallelism\
    \ of 3 per default. This value can be decreased or increased by setting the following\
    \ JVM parameter:\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\nCollections support the method `parallelStream()` to create a parallel\
    \ stream of elements. Alternatively you can call the intermediate method `parallel()`\
    \ on a given stream to convert a sequential stream to a parallel counterpart.\n\
    \nIn order to understate the parallel execution behavior of a parallel stream\
    \ the next example prints information about the current thread to `sout`:\n\n\
    ```\nArrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"c1\")\n    .parallelStream()\n\
    \    .filter(s -> {\n        System.out.format(\"filter: %s [%s]\\n\",\n     \
    \       s, Thread.currentThread().getName());\n        return true;\n    })\n\
    \    .map(s -> {\n        System.out.format(\"map: %s [%s]\\n\",\n           \
    \ s, Thread.currentThread().getName());\n        return s.toUpperCase();\n   \
    \ })\n    .forEach(s -> System.out.format(\"forEach: %s [%s]\\n\",\n        s,\
    \ Thread.currentThread().getName()));\n```\n\nBy investigating the debug output\
    \ we should get a better understanding which threads are actually used to execute\
    \ the stream operations:\n\n```\nfilter:  b1 [main]\nfilter:  a2 [ForkJoinPool.commonPool-worker-1]\n\
    map:     a2 [ForkJoinPool.commonPool-worker-1]\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\n\
    map:     c2 [ForkJoinPool.commonPool-worker-3]\nfilter:  c1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     c1 [ForkJoinPool.commonPool-worker-2]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A2 [ForkJoinPool.commonPool-worker-1]\nmap:     b1 [main]\nforEach: B1\
    \ [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-3]\nmap:     a1 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-3]\nforEach: C1 [ForkJoinPool.commonPool-worker-2]\n\
    ```\n\nAs you can see the parallel stream utilizes all available threads from\
    \ the common `ForkJoinPool` for executing the stream operations. The output may\
    \ differ in consecutive runs because the behavior which particular thread is actually\
    \ used is non-deterministic.\n\nLet's extend the example by an additional stream\
    \ operation, `sort`:\n\n```\nArrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"\
    c1\")\n    .parallelStream()\n    .filter(s -> {\n        System.out.format(\"\
    filter: %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n   \
    \     return true;\n    })\n    .map(s -> {\n        System.out.format(\"map:\
    \ %s [%s]\\n\",\n            s, Thread.currentThread().getName());\n        return\
    \ s.toUpperCase();\n    })\n    .sorted((s1, s2) -> {\n        System.out.format(\"\
    sort: %s <> %s [%s]\\n\",\n            s1, s2, Thread.currentThread().getName());\n\
    \        return s1.compareTo(s2);\n    })\n    .forEach(s -> System.out.format(\"\
    forEach: %s [%s]\\n\",\n        s, Thread.currentThread().getName()));\n```\n\n\
    The result may look strange at first:\n\n```\nfilter:  c2 [ForkJoinPool.commonPool-worker-3]\n\
    filter:  c1 [ForkJoinPool.commonPool-worker-2]\nmap:     c1 [ForkJoinPool.commonPool-worker-2]\n\
    filter:  a2 [ForkJoinPool.commonPool-worker-1]\nmap:     a2 [ForkJoinPool.commonPool-worker-1]\n\
    filter:  b1 [main]\nmap:     b1 [main]\nfilter:  a1 [ForkJoinPool.commonPool-worker-2]\n\
    map:     a1 [ForkJoinPool.commonPool-worker-2]\nmap:     c2 [ForkJoinPool.commonPool-worker-3]\n\
    sort:    A2 <> A1 [main]\nsort:    B1 <> A2 [main]\nsort:    C2 <> B1 [main]\n\
    sort:    C1 <> C2 [main]\nsort:    C1 <> B1 [main]\nsort:    C1 <> C2 [main]\n\
    forEach: A1 [ForkJoinPool.commonPool-worker-1]\nforEach: C2 [ForkJoinPool.commonPool-worker-3]\n\
    forEach: B1 [main]\nforEach: A2 [ForkJoinPool.commonPool-worker-2]\nforEach: C1\
    \ [ForkJoinPool.commonPool-worker-1]\n```\n\nIt seems that `sort` is executed\
    \ sequentially on the main thread only. Actually, `sort` on a parallel stream\
    \ uses the new Java 8 method `Arrays.parallelSort()` under the hood. As stated\
    \ in [Javadoc](https://docs.oracle.com/javase/8/docs/api/java/util/Arrays.html#parallelSort-T:A-)\
    \ this method decides on the length of the array if sorting will be performed\
    \ sequentially or in parallel:\n\n> If the length of the specified array is less\
    \ than the minimum granularity, then it is sorted using the appropriate Arrays.sort\
    \ method.\n\nComing back to the `reduce` example from the last section. We already\
    \ found out that the combiner function is only called in parallel but not in sequential\
    \ streams. Let's see which threads are actually involved:\n\n```\nList<Person>\
    \ persons = Arrays.asList(\n    new Person(\"Max\", 18),\n    new Person(\"Peter\"\
    , 23),\n    new Person(\"Pamela\", 23),\n    new Person(\"David\", 12));\n\npersons\n\
    \    .parallelStream()\n    .reduce(0,\n        (sum, p) -> {\n            System.out.format(\"\
    accumulator: sum=%s; person=%s [%s]\\n\",\n                sum, p, Thread.currentThread().getName());\n\
    \            return sum += p.age;\n        },\n        (sum1, sum2) -> {\n   \
    \         System.out.format(\"combiner: sum1=%s; sum2=%s [%s]\\n\",\n        \
    \        sum1, sum2, Thread.currentThread().getName());\n            return sum1\
    \ + sum2;\n        });\n```\n\nThe console output reveals that both the *accumulator*\
    \ and the *combiner* functions are executed in parallel on all available threads:\n\
    \n```\naccumulator: sum=0; person=Pamela; [main]\naccumulator: sum=0; person=Max;\
    \    [ForkJoinPool.commonPool-worker-3]\naccumulator: sum=0; person=David;  [ForkJoinPool.commonPool-worker-2]\n\
    accumulator: sum=0; person=Peter;  [ForkJoinPool.commonPool-worker-1]\ncombiner:\
    \    sum1=18; sum2=23;     [ForkJoinPool.commonPool-worker-1]\ncombiner:    sum1=23;\
    \ sum2=12;     [ForkJoinPool.commonPool-worker-2]\ncombiner:    sum1=41; sum2=35;\
    \     [ForkJoinPool.commonPool-worker-2]\n```\n\nIn summary, it can be stated\
    \ that parallel streams can bring be a nice performance boost to streams with\
    \ a large amount of input elements. But keep in mind that some parallel stream\
    \ operations like `reduce` and `collect` need additional computations (combine\
    \ operations) which isn't needed when executed sequentially.\n\nFurthermore we've\
    \ learned that all parallel stream operations share the same JVM-wide common `ForkJoinPool`.\
    \ So you probably want to avoid implementing slow blocking stream operations since\
    \ that could potentially slow down other parts of your application which rely\
    \ heavily on parallel streams.\n\n### That's it\n\nMy programming guide to Java\
    \ 8 streams ends here. If you're interested in learning more about Java 8 streams,\
    \ I recommend to you the [Stream Javadoc](http://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html#NonInterference)\
    \ package documentation. If you want to learn more about the underlying mechanisms,\
    \ you probably want to read Martin Fowlers article about [Collection Pipelines](http://martinfowler.com/articles/collection-pipeline/).\n\
    \nIf you're interested in JavaScript as well, you may want to have a look at [Stream.js](https://github.com/winterbe/streamjs)\
    \ - a JavaScript implementation of the Java 8 Streams API. You may also wanna\
    \ read my [Java 8 Tutorial](posts/2014/03/16/java-8-tutorial) and my [Java 8 Nashorn\
    \ Tutorial](posts/2014/04/05/java8-nashorn-tutorial).\n\nHopefully this tutorial\
    \ was helpful to you and you've enjoyed reading it. The full source code of the\
    \ tutorial samples is [hosted on GitHub](https://github.com/winterbe/java8-tutorial).\
    \ Feel free to [fork the repository](https://github.com/winterbe/java8-tutorial/fork)\
    \ or send me your feedback via [Twitter](https://twitter.com/winterbe_).\n\nHappy\
    \ coding!\n\n# Java 8 Nashorn Tutorial\n\n# Java 8 Nashorn Tutorial\n\nApril 05,\
    \ 2014"
