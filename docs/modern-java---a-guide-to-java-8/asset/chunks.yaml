    \ I recommend reading my [Java 8 Tutorial](posts/2014/03/16/java-8-tutorial) first.\n\
    \nFor simplicity the code samples of this tutorial make use of the two helper\
    \ methods `sleep(seconds)` and `stop(executor)` as defined [here](https://github.com/winterbe/java8-tutorial/blob/master/src/com/winterbe/java8/samples/concurrent/ConcurrentUtils.java).\n\
    \n### Synchronized\n\nIn the [previous tutorial]((/posts/2015/04/07/java8-concurrency-tutorial-thread-executor-examples))\
    \ we've learned how to execute code in parallel via executor services. When writing\
    \ such multi-threaded code you have to pay particular attention when accessing\
    \ shared mutable variables concurrently from multiple threads. Let's just say\
    \ we want to increment an integer which is accessible simultaneously from multiple\
    \ threads.\n\nWe define a field `count` with a method `increment()` to increase\
    \ count by one:\n\n```\nint count = 0;\n\nvoid increment() {\n    count = count\
    \ + 1;\n}\n```\n\nWhen calling this method concurrently from multiple threads\
    \ we're in serious trouble:\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    \nIntStream.range(0, 10000)\n    .forEach(i -> executor.submit(this::increment));\n\
    \nstop(executor);\n\nSystem.out.println(count);  // 9965\n```\n\nInstead of seeing\
    \ a constant result count of 10000 the actual result varies with every execution\
    \ of the above code. The reason is that we share a mutable variable upon different\
    \ threads without synchronizing the access to this variable which results in a\
    \ [race condition](http://en.wikipedia.org/wiki/Race_condition).\n\nThree steps\
    \ have to be performed in order to increment the number: (i) read the current\
    \ value, (ii) increase this value by one and (iii) write the new value to the\
    \ variable. If two threads perform these steps in parallel it's possible that\
    \ both threads perform step 1 simultaneously thus reading the same current value.\
    \ This results in lost writes so the actual result is lower. In the above sample\
    \ 35 increments got lost due to concurrent unsynchronized access to count but\
    \ you may see different results when executing the code by yourself.\n\nLuckily\
    \ Java supports thread-synchronization since the early days via the `synchronized`\
    \ keyword. We can utilize `synchronized` to fix the above race conditions when\
    \ incrementing the count:\n\n```\nsynchronized void incrementSync() {\n    count\
    \ = count + 1;\n}\n```\n\nWhen using `incrementSync()` concurrently we get the\
    \ desired result count of 10000\\. No race conditions occur any longer and the\
    \ result is stable with every execution of the code:\n\n```\nExecutorService executor\
    \ = Executors.newFixedThreadPool(2);\n\nIntStream.range(0, 10000)\n    .forEach(i\
    \ -> executor.submit(this::incrementSync));\n\nstop(executor);\n\nSystem.out.println(count);\
    \  // 10000\n```\n\nThe `synchronized` keyword is also available as a block statement.\n\
    \n```\nvoid incrementSync() {\n    synchronized (this) {\n        count = count\
    \ + 1;\n    }\n}\n```\n\nInternally Java uses a so called *monitor* also known\
    \ as [monitor lock or intrinsic lock](https://docs.oracle.com/javase/tutorial/essential/concurrency/locksync.html)\
    \ in order to manage synchronization. This monitor is bound to an object, e.g.\
    \ when using synchronized methods each method share the same monitor of the corresponding\
    \ object.\n\nAll implicit monitors implement the *reentrant* characteristics.\
    \ Reentrant means that locks are bound to the current thread. A thread can safely\
    \ acquire the same lock multiple times without running into deadlocks (e.g. a\
    \ synchronized method calls another synchronized method on the same object).\n\
    \n### Locks\n\nInstead of using implicit locking via the `synchronized` keyword\
    \ the Concurrency API supports various explicit locks specified by the `Lock`\
    \ interface. Locks support various methods for finer grained lock control thus\
    \ are more expressive than implicit monitors.\n\nMultiple lock implementations\
    \ are available in the standard JDK which will be demonstrated in the following\
    \ sections.\n\n#### ReentrantLock\n\nThe class `ReentrantLock` is a mutual exclusion\
    \ lock with the same basic behavior as the implicit monitors accessed via the\
    \ `synchronized` keyword but with extended capabilities. As the name suggests\
    \ this lock implements reentrant characteristics just as implicit monitors.\n\n\
    Let's see how the above sample looks like using `ReentrantLock`:\n\n```\nReentrantLock\
    \ lock = new ReentrantLock();\nint count = 0;\n\nvoid increment() {\n    lock.lock();\n\
    \    try {\n        count++;\n    } finally {\n        lock.unlock();\n    }\n\
    }\n```"
