  trans: "\n任务首先获取一个读锁，并将字段 `count` 的当前值打印到控制台。但如果当前值为 0，我们想给它赋予新值 `23`。我们必须先将读锁转换为写锁，以避免破坏其他线程潜在的并发访问。调用\
    \ `tryConvertToWriteLock()` 不阻塞，但可能会返回一个零时间戳（stamp），表示当前没有可用的写锁。在这种情况下，我们调用 `writeLock()`\
    \ 来阻塞当前线程，直到写锁可用。\n\n### 信号量 (Semaphores)\n\n除了锁之外，并发 API 还支持计数信号量。锁通常授予变量或资源的独占访问，而\
    \ `semaphore` 能够维护一组许可。这在需要限制对应用程序某些部分的并发访问量的场景下非常有用。\n\n以下是一个限制由 `sleep(5)` 模拟的长任务访问的示例：\n\
    \n```\nExecutorService executor = Executors.newFixedThreadPool(10);\n\nSemaphore\
    \ semaphore = new Semaphore(5);\n\nRunnable longRunningTask = () -> {\n    boolean\
    \ permit = false;\n    try {\n        permit = semaphore.tryAcquire(1, TimeUnit.SECONDS);\n\
    \        if (permit) {\n            System.out.println(\"Semaphore acquired\"\
    );\n            sleep(5);\n        } else {\n            System.out.println(\"\
    Could not acquire semaphore\");\n        }\n    } catch (InterruptedException\
    \ e) {\n        throw new IllegalStateException(e);\n    } finally {\n       \
    \ if (permit) {\n            semaphore.release();\n        }\n    }\n}\n\nIntStream.range(0,\
    \ 10)\n    .forEach(i -> executor.submit(longRunningTask));\n\nstop(executor);\n\
    ```\n\n执行器可能会并发运行 10 个任务，但我们使用大小为 5 的信号量，从而将并发访问限制在 5 个。使用 `try/finally` 块来确保即使发生异常时也能正确释放信号量是非常关重要的。\n\
    \n执行上述代码将得到以下输出：\n\n```\nSemaphore acquired\nSemaphore acquired\nSemaphore acquired\n\
    Semaphore acquired\nSemaphore acquired\nCould not acquire semaphore\nCould not\
    \ acquire semaphore\nCould not acquire semaphore\nCould not acquire semaphore\n\
    Could not acquire semaphore\n```\n\n信号量允许对 `sleep(5)` 模拟的实际长耗时操作访问最多 5 次。随后的每个\
    \ `tryAcquire()` 调用都会经过一秒的最长等待超时，导致控制台输出相应的提示，即无法获取信号量。\n\n这是系列并发教程中的第二部分。更多部分将在近期发布，请保持关注。一如既往，你可以在\
    \ [GitHub](https://github.com/winterbe/java8-tutorial) 上找到本文的所有代码示例，请随时分叉（fork）该仓库并自行尝试。\n\
    \n希望你喜欢这篇文章。如果你有任何进一步的问题，请在下方的评论中向我发送反馈。\n\n- 第 1 部分：线程与执行器\n- 第 2 部分：同步与锁\n-\
    \ 第 3 部分：原子变量与并发 Map\n\n# Java 8 并发教程：原子变量与并发 Map\n\n2015 年 5 月 22 日\n\n欢迎阅读我关于\
    \ Java 8 多线程编程系列教程的第 3 部分。本教程涵盖了并发 API 的两个重要部分：原子变量和并发 Map。随着最新的 Java 8 版本引入了\
    \ Lambda 表达式和函数式编程，这两部分都得到了极大改进。所有这些新功能都通过一系列易懂的代码示例进行了描述。请享受！\n\n- 第 1 部分：线程与执行器\n\
    - 第 2 部分：同步与锁\n- 第 3 部分：原子变量与并发 Map\n\n为了简单起见，本教程中的代码示例使用了两个辅助方法 `sleep(seconds)`\
    \ 和 `stop(executor)`，它们定义在[此处](https://github.com/winterbe/java8-tutorial/blob/master/src/com/winterbe/java8/samples/concurrent/ConcurrentUtils.java)。\n\
    \n### AtomicInteger\n\n`java.concurrent.atomic` 包包含许多用于执行原子操作的有用类。当可以在多个线程上安全地并行执行操作，而无需使用\
    \ `synchronized` 关键字或锁时（如我之前的教程 所示），该操作就是原子的。\n\n在内部，原子类大量使用了[比较并交换](http://en.wikipedia.org/wiki/Compare-and-swap)\
    \ (CAS)，这是大多数现代 CPU 直接支持的原子指令。这些指令通常通常比通过锁进行同步快得多。因此，我的建议是，如果你只需要并发更改单个可变变量，请优先使用原子类而不是锁。\n\
    \n现在让我们选择其中一个原子类来做几个示例：`AtomicInteger`\n\n```\nAtomicInteger atomicInt = new AtomicInteger(0);\n\
    \nExecutorService executor = Executors.newFixedThreadPool(2);\n\nIntStream.range(0,\
    \ 1000)\n    .forEach(i -> executor.submit(atomicInt::incrementAndGet));\n\nstop(executor);\n\
    \nSystem.out.println(atomicInt.get());    // => 1000\n```\n\n通过使用 `AtomicInteger`\
    \ 替 `Integer`，我们能够在以线程安全的方式并发地增加数字，而无需对变量访问进行同步。`incrementAndGet()` 方法是一个原子操作，因此我们可以安全地从多个线程调用此方法。\n\
    \n`AtomicInteger` 支持各种原子操作。`updateAndGet()` 方法接受一个 Lambda 表达式，以便对整数执行任意的算术操作：\n\
    \n```\nAtomicInteger atomicInt = new AtomicInteger(0);\n\nExecutorService executor\
    \ = Executors.newFixedThreadPool(2);\n\nIntStream.range(0, 1000)\n    .forEach(i\
    \ -> {\n        Runnable task = () ->\n            atomicInt.updateAndGet(n ->\
    \ n + 2);\n        executor.submit(task);\n    });\n\nstop(executor);\n\nSystem.out.println(atomicInt.get());\
    \    // => 2000\n```\n\n`accumulateAndGet()` 方法接受另一种类型的 `IntBinaryOperator` Lambda\
    \ 表达式。我们在下一个示例中使用该方法来并发地求和从 0 到 1000 的所有值：\n\n```\nAtomicInteger atomicInt = new\
    \ AtomicInteger(0);\n\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    \nIntStream.range(0, 1000)\n    .forEach(i -> {\n        Runnable task = () ->\n\
    \            atomicInt.accumulateAndGet(i, (n, m) -> n + m);\n        executor.submit(task);\n\
    \    });\n\nstop(executor);\n\nSystem.out.println(atomicInt.get());    // => 499500\n\
    ```\n\n其他有用的原子类有 [AtomicBoolean](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicBoolean.html)、[AtomicLong](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicLong.html)\
    \ 和 [AtomicReference](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicReference.html)。\n\
    \n### LongAdder\n\n`LongAdder` 类作为 `AtomicLong` 的替代方案，可连续向数字增加值。\n\n```\nExecutorService\
    \ executor = Executors.newFixedThreadPool(10);\n\nIntStream.range(0, 1000)\n \
    \   .forEach(i -> executor.submit(adder::increment));\n\nstop(executor);\n\nSystem.out.println(adder.sumThenReset());\
    \   // => 1000\n```\n\nLongAdder 提供了与原子数字类相似的 `add()` 和 `increment()` 方法，并且同样是线程安全的。但它不是累加单个结果，该类在内部维护了一组变量以减少线程之间的竞争。可以通过调用\
    \ `sum()` 或 `sumThenReset()` 获取实际结果。\n"
- fmt: "\nThis class is usually preferable over atomic numbers when updates from multiple\
    \ threads are more common than reads. This is often the case when capturing statistical\
    \ data, e.g. you want to count the number of requests served on a web server.\
    \ The drawback of `LongAdder` is higher memory consumption because a set of variables\
    \ is held in-memory.\n\n### LongAccumulator\n\nLongAccumulator is a more generalized\
    \ version of `LongAdder`. Instead of performing simple add operations the class\
    \ `LongAccumulator` builds around a lambda expression of type `LongBinaryOperator`\
    \ as demonstrated in this code sample:\n\n```\nLongBinaryOperator op = (x, y)\
    \ -> 2 * x + y;\nLongAccumulator accumulator = new LongAccumulator(op, 1L);\n\n\
    ExecutorService executor = Executors.newFixedThreadPool(2);\n\nIntStream.range(0,\
    \ 10)\n    .forEach(i -> executor.submit(() -> accumulator.accumulate(i)));\n\n\
    stop(executor);\n\nSystem.out.println(accumulator.getThenReset());     // => 2539\n\
    ```\n\nWe create a `LongAccumulator` with the function `2 * x + y` and an initial\
    \ value of one. With every call to `accumulate(i)` both the current result and\
    \ the value `i` are passed as parameters to the lambda expression.\n\nA `LongAccumulator`\
    \ just like `LongAdder` maintains a set of variables internally to reduce contention\
    \ over threads.\n\n### ConcurrentMap\n\nThe interface `ConcurrentMap` extends\
    \ the map interface and defines one of the most useful concurrent collection types.\
    \ Java 8 introduces functional programming by adding new methods to this interface.\n\
    \nIn the next code snippets we use the following sample map to demonstrates those\
    \ new methods:\n\n```\nConcurrentMap<String, String> map = new ConcurrentHashMap<>();\n\
    map.put(\"foo\", \"bar\");\nmap.put(\"han\", \"solo\");\nmap.put(\"r2\", \"d2\"\
    );\nmap.put(\"c3\", \"p0\");\n```\n\nThe method `forEach()` accepts a lambda expression\
    \ of type `BiConsumer` with both the key and value of the map passed as parameters.\
    \ It can be used as a replacement to for-each loops to iterate over the entries\
    \ of the concurrent map. The iteration is performed sequentially on the current\
    \ thread.\n\n```\nmap.forEach((key, value) -> System.out.printf(\"%s = %s\\n\"\
    , key, value));\n```\n\nThe method `putIfAbsent()` puts a new value into the map\
    \ only if no value exists for the given key. At least for the `ConcurrentHashMap`\
    \ implementation of this method is thread-safe just like `put()` so you don't\
    \ have to synchronize when accessing the map concurrently from different threads:\n\
    \n```\nString value = map.putIfAbsent(\"c3\", \"p1\");\nSystem.out.println(value);\
    \    // p0\n```\n\nThe method `getOrDefault()` returns the value for the given\
    \ key. In case no entry exists for this key the passed default value is returned:\n\
    \n```\nString value = map.getOrDefault(\"hi\", \"there\");\nSystem.out.println(value);\
    \    // there\n```\n\nThe method `replaceAll()` accepts a lambda expression of\
    \ type `BiFunction`. BiFunctions take two parameters and return a single value.\
    \ In this case the function is called with the key and the value of each map entry\
    \ and returns a new value to be assigned for the current key:\n\n```\nmap.replaceAll((key,\
    \ value) -> \"r2\".equals(key) ? \"d3\" : value);\nSystem.out.println(map.get(\"\
    r2\"));    // d3\n```\n\nInstead of replacing all values of the map `compute()`\
    \ let's transform a single entry. The method accepts both the key to be computed\
    \ and a bi-function to specify the transformation of the value:\n\n```\nmap.compute(\"\
    foo\", (key, value) -> value + value);\nSystem.out.println(map.get(\"foo\"));\
    \   // barbar\n```\n\nIn addition to `compute()` two variants exist: `computeIfAbsent()`\
    \ and `computeIfPresent()`. The functional parameters of these methods only get\
    \ called if the key is absent or present respectively.\n\nFinally, the method\
    \ `merge()` can be utilized to unify a new value with an existing value in the\
    \ map. Merge accepts a key, the new value to be merged into the existing entry\
    \ and a bi-function to specify the merging behavior of both values:\n\n```\nmap.merge(\"\
    foo\", \"boo\", (oldVal, newVal) -> newVal + \" was \" + oldVal);\nSystem.out.println(map.get(\"\
    foo\"));   // boo was foo\n```\n\n### ConcurrentHashMap\n\nAll those methods above\
    \ are part of the `ConcurrentMap` interface, thereby available to all implementations\
    \ of that interface. In addition the most important implementation `ConcurrentHashMap`\
    \ has been further enhanced with a couple of new methods to perform parallel operations\
    \ upon the map.\n\nJust like parallel streams those methods use a special `ForkJoinPool`\
    \ available via `ForkJoinPool.commonPool()` in Java 8. This pool uses a preset\
    \ parallelism which depends on the number of available cores. Four CPU cores are\
    \ available on my machine which results in a parallelism of three:\n\n```\nSystem.out.println(ForkJoinPool.getCommonPoolParallelism());\
    \  // 3\n```\n\nThis value can be decreased or increased by setting the following\
    \ JVM parameter:\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\nWe use the same example map for demonstrating purposes but this time we\
    \ work upon the concrete implementation `ConcurrentHashMap` instead of the interface\
    \ `ConcurrentMap`, so we can access all public methods from this class:\n\n```\n\
    ConcurrentHashMap<String, String> map = new ConcurrentHashMap<>();\nmap.put(\"\
    foo\", \"bar\");\nmap.put(\"han\", \"solo\");\nmap.put(\"r2\", \"d2\");\nmap.put(\"\
    c3\", \"p0\");\n```\n\nJava 8 introduces three kinds of parallel operations: `forEach`,\
    \ `search` and `reduce`. Each of those operations are available in four forms\
    \ accepting functions with keys, values, entries and key-value pair arguments.\n\
    \nAll of those methods use a common first argument called `parallelismThreshold`.\
    \ This threshold indicates the minimum collection size when the operation should\
    \ be executed in parallel. E.g. if you pass a threshold of 500 and the actual\
    \ size of the map is 499 the operation will be performed sequentially on a single\
    \ thread. In the next examples we use a threshold of one to always force parallel\
    \ execution for demonstrating purposes.\n\n#### ForEach\n\nThe method `forEach()`\
    \ is capable of iterating over the key-value pairs of the map in parallel. The\
    \ lambda expression of type `BiConsumer` is called with the key and value of the\
    \ current iteration step. In order to visualize parallel execution we print the\
    \ current threads name to the console. Keep in mind that in my case the underlying\
    \ `ForkJoinPool` uses up to a maximum of three threads.\n\n```\nmap.forEach(1,\
    \ (key, value) ->\n    System.out.printf(\"key: %s; value: %s; thread: %s\\n\"\
    ,\n        key, value, Thread.currentThread().getName()));\n\n// key: r2; value:\
    \ d2; thread: main\n// key: foo; value: bar; thread: ForkJoinPool.common-worker-1\n\
    // key: han; value: solo; thread: ForkJoinPool.common-worker-2\n// key: c3; value:\
    \ p0; thread: main\n```\n\n#### Search\n\nThe method `search()` accepts a `BiFunction`\
    \ returning a non-null search result for the current key-value pair or `null`\
    \ if the current iteration doesn't match the search criteria. As soon as a non-null\
    \ result is returned further processing is suppressed. Keep in mind that `ConcurrentHashMap`\
    \ is unordered. The search function should not depend on the actual processing\
    \ order of the map. If multiple entries of the map match the given search function\
    \ the result may be non-deterministic.\n\n```\nString result = map.search(1, (key,\
    \ value) -> {\n    System.out.println(Thread.currentThread().getName());\n   \
    \ if (\"foo\".equals(key)) {\n        return value;\n    }\n    return null;\n\
    });\nSystem.out.println(\"Result: \" + result);\n\n// ForkJoinPool.common-worker-2\n\
    // main\n// ForkJoinPool.common-worker-3\n// Result: bar\n```\n\nHere's another\
    \ example searching solely on the values of the map:\n\n```\nString result = map.searchValues(1,\
    \ value -> {\n    System.out.println(Thread.currentThread().getName());\n    if\
    \ (value.length() > 3) {\n        return value;\n    }\n    return null;\n});\n\
    \nSystem.out.println(\"Result: \" + result);\n\n// ForkJoinPool.common-worker-2\n\
    // main\n// main\n// ForkJoinPool.common-worker-1\n// Result: solo\n```\n\n####\
    \ Reduce\n"
