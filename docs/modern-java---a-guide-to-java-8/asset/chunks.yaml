  trans: "\n\n```java\npublic static <T> Optional<T> resolve(Supplier<T> resolver)\
    \ {\n    try {\n        T result = resolver.get();\n        return Optional.ofNullable(result);\n\
    \    }\n    catch (NullPointerException e) {\n        return Optional.empty();\n\
    \    }\n}\n```\n\n请记住，这两个解决方案的性能可能都不如传统的空检查。在大多数情况下，这并不是什么问题。\n\n一如既常，上述代码示例托管在\
    \ [GitHub](https://github.com/winterbe/java8-tutorial) 上。\n\n祝编码愉快！\n\n> 更新：感谢\
    \ Reddit 上用户 [Zukhramm](http://www.reddit.com/user/Zukhramm) 的提示，我已经更新了代码示例。\n\
    \n# 使用 IntelliJ IDEA 修复 Java 8 Stream 陷阱\n\n2015 年 3 月 5 日\n\nJava 8 几乎自 2014\
    \ 年 3 月发布后已经一年了。在 [Pondus](http://www.pondus.de)，我们成功在 2014 年 5 月将所有的生产服务器更新到了这个新版本。从那时起，我们已经将代码库的大部分迁移到了\
    \ lambda expressions、streams 以及新的 Date API。我们还使用 Nashorn 来动态脚本化应用程序中在运行时可能会更改的部分。\n\
    \n除了 lambda 之外，最常用的功能是新的 Stream API。在我见过的几乎任何代码库中，集合操作无处不在。而 Streams 是提高这些集合处理代码可读性的极佳方法。\n\
    \n但关于 streams 有一点非常困扰我：Streams 只直接提供如 `reduce` 和 `findFirst` 这样的少数终端操作，而其他操作只能通过\
    \ `collect` 访问。有一个工具类 Collectors，提供了一系列方便的收集器，如 `toList`、`toSet`、`joining` 和 `groupingBy`。\n\
    \n例如，这段代码过滤了一个字符串集合并创建一个新列表：\n\n```\nstringCollection\n    .stream()\n    .filter(e\
    \ -> e.startsWith(\"a\"))\n    .collect(Collectors.toList());\n```\n\n在将一个拥有 30\
    \ 万行代码的项目迁移到 streams 之后，我可以说 `toList`、`toSet` 和 `groupingBy` 是到为止我们项目中最常用的终端操作。所以我真的无法理解为什么不将这些方法直接集成到\
    \ `Stream` 接口中，这样你就可以直接写：\n\n```\nstringCollection\n    .stream()\n    .filter(e\
    \ -> e.startsWith(\"a\"))\n    .toList();\n```\n\n这初看起来可能是一个微小的缺陷，但如果你必须反复使用这类东西，它就会变得非常恼人。\n\
    \n有一个 `toArray()` 方法，但没有 `toList()`。所以我真的希望一些更方便的收集器能在 Java 9 中进入 `Stream` 接口。[Brian](https://twitter.com/briangoetz)?\
    \ ಠ_ಠ\n\n> 顺便说明：[Stream.js](https://github.com/winterbe/streamjs) 是 Java 8 Streams\
    \ API 在浏览器中的 JavaScript 移植，它很好地解决了描述的问题。为了方便起见，所有重要的终端操作都可以直接在流本身上访问。详情请参见 [API\
    \ 文档](https://github.com/winterbe/streamjs/blob/master/APIDOC.md#groupingbykeymapper)。\n\
    \n总之。[IntelliJ IDEA](https://www.jetbrains.com/idea/) 声称是最智能的 Java IDE。那么吧，让我们看看如何利用\
    \ IDEA 来为我们解决这个问题。\n\n## IntelliJ IDEA 救场\n\nIntelliJ IDEA 自带名为 Live Templates\
    \ 的方便功能。如果你还不知道它是什么：Live Templates 是常用代码片段的快捷键。例如，你输入 `sout` + `制表键`，IDEA 就会插入代码片段\
    \ `System.out.println()`。点击[这里](https://www.jetbrains.com/idea/help/live-templates.html)\
    \ 了解更多信息。\n\nLive Templates 如何帮助解决上述问题？实际上，我们可以简单地为所有常用的默认 Stream 收集器创建自己的 Live\
    \ Templates。例如，我们可以创建一个缩写为 `.toList` 的 Live Template，自动插入相应的收集器 `.collect(Collectors.toList())`。\n\
    \n这是它在运行时的效果：\n\n![Live Template Streams 1](img/livetemplate-streams1.gif)\n\n\
    ## 设置你自己的 Live Templates\n\n让我们看看如何设置。首先进入 Settings（设置），并在左侧菜单选择 Live Templates。你也可以使用对话框左上角方便的过滤器输入。\n\
    \n![Live Template Settings](img/livetemplate-settings.png)\n\n接下来，我们可以通过右侧的 `+`\
    \ 图标创建一个名为 `Stream` 的新组。我们将所有与流 相关的 Live Templates 添加到该组。我经常使用默认收集器 `toList`、`toSet`、`groupingBy`\
    \ 和 `join`，所以我为这些方法中的每一个创建了一个 Live Template。\n\n这部分**非常重要**：在添加新的 Live Template\
    \ 后，你必须在对话框底部指定适用上下文。你需要选择 `Java` → `Other`。之后你就可以定义缩写、描述和实际的模板代码。\n\n```\n//\
    \ Abbreviation: .toList\n.collect(Collectors.toList())\n\n// Abbreviation: .toSet\n\
    .collect(Collectors.toSet())\n\n// Abbreviation: .join\n.collect(Collectors.joining(\"\
    $END$\"))\n\n// Abbreviation: .groupBy\n.collect(Collectors.groupingBy(e -> $))\n\
    ```\n\n特殊变量 `$END$` 决定了在使用模板后光标的位置。\n\n> 提示：你应该开启“Add unambiguous imports”选项，以便\
    \ IDEA 自动添加 `java.util.stream.Collectors`。该选项位于：*Editor* → *General* → *Auto Import*\n\
    \n让我们来看看这两个模板的效果：\n\n### Join\n\n![Live Template Streams 2](img/livetemplate-streams2.gif)\n\
    \n### GroupBy\n\n![Live Template Streams 3](img/livetemplate-streams3.gif)\n\n\
    Live Templates 在 IntelliJ 中是多功能且强大的工具。它可以极大地提高你的编码效率。你还知道其他 Live Templates 可以节省时间的例子吗？告诉我!\n\
    \n还是不满意？通过我的 Streams 教程 学习关于 Java 8 Streams 的一切。\n\n祝编码愉快。\n\n# 在 Nashorn 中使用\
    \ Backbone.js\n\n2014 年 4 月 7 日\n\n本示例演示了如何将 `Backbone.js` 模型与 Java 8 `Nashorn`\
    \ 引擎结合。Nashorn 于 2014 年 3 月作为 Java SE 8 的发布，通过在 JVM 上原生运行 JavaScript 代码扩展了 Java\
    \ 的功能。对于 Java 开发者来说，Nashorn 在在服务器端复用客户端代码时可能特别有用。\n\n当使用现代的 JavaScript [MVC](https://en.wikipedia.org/wiki/Model%E2%80%93view%E2%80%93controller)\
    \ 框架如 [Backbone.js](http://backbonejs.org/) 开发 HTML5 前端时，越来越多的代码从服务器后端移动到 Web\
    \ 前端。Backbone 允许你定义模型类并绑定到视图（例如 HTML 表单）。Backbone 在用户与 UI 交互时跟踪更新，反之亦然。它还帮助你与服务器同步模型，例如通过调用服务器端\
    \ REST 处理器的相应方法。因此，你最终会在前端中实现业务逻辑，而让服务器模型负责数据持久化。\n\n使用 Nashorn 在服务器端复用 Backbone\
    \ 模型非常简单，如下例所示。在开始之前，请确保你已经熟悉如何为 Nashorn 引擎编写 JavaScript，可以阅读我的 [Nashorn 教程]。\n\
    \n### Java 模型\n\n"
- fmt: "\nFirst, we define a domain class `Product` in java code. This class might\
    \ be used for CRUD database operations (saving to and loading from a datasource).\
    \ Keep in mind that this class is a dumb Java Bean without any business logic\
    \ applied, because we want our front-end to be capable of executing the business\
    \ logic right from the UI.\n\n```java\nclass Product {\n    String name;\n   \
    \ double price;\n    int stock;\n    double valueOfGoods;\n}\n```\n\n### The Backbone\
    \ Model\n\nNow we define the backbone model as the counter-part of our java bean.\
    \ The backbone model `Product` uses the same data-structure as the java bean,\
    \ since this is the data we might want to persist on the java server.\n\nThe backbone\
    \ model also implements the business logic: The method `getValueOfGoods` calculates\
    \ the value of all products by multiplying `stock` with `price`. Each time `stock`\
    \ or `price` changes the property `valueOfGoods` must be re-calculated.\n\n```javascript\n\
    var Product = Backbone.Model.extend({\n    defaults: {\n        name: '',\n  \
    \      stock: 0,\n        price: 0.0,\n        valueOfGoods: 0.0\n    },\n\n \
    \   initialize: function() {\n        this.on('change:stock change:price', function()\
    \ {\n            var stock = this.get('stock');\n            var price = this.get('price');\n\
    \            var valueOfGoods = this.getValueOfGoods(stock, price);\n        \
    \    this.set('valueOfGoods', valueOfGoods);\n        });\n    },\n\n    getValueOfGoods:\
    \ function(stock, price) {\n        return stock * price;\n    }\n});\n```\n\n\
    Since the backbone model doesn't use any Nashorn language extensions, we can safely\
    \ use the same code both on the client (Browser) and on the server (Java) side.\n\
    \nKeep in mind that I deliberately chose a really simple function for demonstrating\
    \ purposes only. Real business logic should be more complex.\n\n### Putting both\
    \ together\n\nThe next goal is to re-use the backbone model from Nashorn, e.g.\
    \ on the java server. We want to achieve the following behavior: bind all properties\
    \ from the java bean to the backbone model; calculate the property `valueOfGoods`;\
    \ pass the result back to java.\n\nFirst, we create a new script to be evaluated\
    \ solely by Nashorn, so we can safely use Nashorn extensions here:\n\n```javascript\n\
    load('http://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.6.0/underscore-min.js');\n\
    load('http://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.1.2/backbone-min.js');\n\
    load('product-backbone-model.js');\n\nvar calculate = function(javaProduct) {\n\
    \    var model = new Product();\n    model.set('name', javaProduct.name);\n  \
    \  model.set('price', javaProduct.price);\n    model.set('stock', javaProduct.stock);\n\
    \    return model.attributes;\n};\n```\n\nThe script first loads the relevant\
    \ external scripts [Underscore](http://underscorejs.org/) and [Backbone](http://backbonejs.org/)\
    \ (Underscore is a pre-requirement for Backbone) and our `Product` backbone model\
    \ as defined above.\n\nThe function `calculate` accepts a `Product` java bean,\
    \ binds all properties to a newly created backbone `Product` and returns all attributes\
    \ of the model back to the caller. By setting the properties `stock` and `price`\
    \ on the backbone model, property `valueOfGoods` will automatically be calculated\
    \ due to the event handler registered in the models `initialize` constructor function.\n\
    \nFinally, we call the function `calculate` from java:\n\n```java\nProduct product\
    \ = new Product();\nproduct.setName(\"Rubber\");\nproduct.setPrice(1.99);\nproduct.setStock(1337);\n\
    \nScriptObjectMirror result = (ScriptObjectMirror)\n    invocable.invokeFunction(\"\
    calculate\", product);\n\nSystem.out.println(result.get(\"name\") + \": \" + result.get(\"\
    valueOfGoods\"));\n// Rubber: 2660.63\n```\n\nWe create a new `Product` java bean\
    \ and pass it to the javascript function. As a result the method `getValueOfGoods`\
    \ will be triggered, so we can read the property `valueOfGoods` from the returning\
    \ object.\n\n### Conclusion\n\nReusing existing javascript libraries on the Nashorn\
    \ Engine is quite easy. Backbone is great for building complex HTML5 front-ends.\
    \ In my opinion Nashorn and the JVM now is a great alternative to Node.js, since\
    \ you can make use of the whole Java eco-system in your Nashorn codebase, such\
    \ as the whole JDK API and all available libraries and tools. Keep in mind that\
    \ you're not tight to the Java Language when working with Nashorn - think Scala,\
    \ Groovy, Clojure or even pure Javascript via `jjs`.\n\nThe runnable source code\
    \ from this article is [hosted on GitHub](https://github.com/winterbe/java8-tutorial)\
    \ (see [this file](https://github.com/winterbe/java8-tutorial/blob/master/res/nashorn6.js)).\
    \ Feel free to [fork the repository](https://github.com/winterbe/java8-tutorial/fork)\
    \ or send me your feedback via [Twitter](https://twitter.com/winterbe_).\n"
