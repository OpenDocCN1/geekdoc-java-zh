    \ upon the map.\n\nJust like parallel streams those methods use a special `ForkJoinPool`\
    \ available via `ForkJoinPool.commonPool()` in Java 8\\. This pool uses a preset\
    \ parallelism which depends on the number of available cores. Four CPU cores are\
    \ available on my machine which results in a parallelism of three:\n\n```\nSystem.out.println(ForkJoinPool.getCommonPoolParallelism());\
    \  // 3\n```\n\nThis value can be decreased or increased by setting the following\
    \ JVM parameter:\n\n```\n-Djava.util.concurrent.ForkJoinPool.common.parallelism=5\n\
    ```\n\nWe use the same example map for demonstrating purposes but this time we\
    \ work upon the concrete implementation `ConcurrentHashMap` instead of the interface\
    \ `ConcurrentMap`, so we can access all public methods from this class:\n\n```\n\
    ConcurrentHashMap<String, String> map = new ConcurrentHashMap<>();\nmap.put(\"\
    foo\", \"bar\");\nmap.put(\"han\", \"solo\");\nmap.put(\"r2\", \"d2\");\nmap.put(\"\
    c3\", \"p0\");\n```\n\nJava 8 introduces three kinds of parallel operations: `forEach`,\
    \ `search` and `reduce`. Each of those operations are available in four forms\
    \ accepting functions with keys, values, entries and key-value pair arguments.\n\
    \nAll of those methods use a common first argument called `parallelismThreshold`.\
    \ This threshold indicates the minimum collection size when the operation should\
    \ be executed in parallel. E.g. if you pass a threshold of 500 and the actual\
    \ size of the map is 499 the operation will be performed sequentially on a single\
    \ thread. In the next examples we use a threshold of one to always force parallel\
    \ execution for demonstrating purposes.\n\n#### ForEach\n\nThe method `forEach()`\
    \ is capable of iterating over the key-value pairs of the map in parallel. The\
    \ lambda expression of type `BiConsumer` is called with the key and value of the\
    \ current iteration step. In order to visualize parallel execution we print the\
    \ current threads name to the console. Keep in mind that in my case the underlying\
    \ `ForkJoinPool` uses up to a maximum of three threads.\n\n```\nmap.forEach(1,\
    \ (key, value) ->\n    System.out.printf(\"key: %s; value: %s; thread: %s\\n\"\
    ,\n        key, value, Thread.currentThread().getName()));\n\n// key: r2; value:\
    \ d2; thread: main\n// key: foo; value: bar; thread: ForkJoinPool.commonPool-worker-1\n\
    // key: han; value: solo; thread: ForkJoinPool.commonPool-worker-2\n// key: c3;\
    \ value: p0; thread: main\n```\n\n#### Search\n\nThe method `search()` accepts\
    \ a `BiFunction` returning a non-null search result for the current key-value\
    \ pair or `null` if the current iteration doesn't match the desired search criteria.\
    \ As soon as a non-null result is returned further processing is suppressed. Keep\
    \ in mind that `ConcurrentHashMap` is unordered. The search function should not\
    \ depend on the actual processing order of the map. If multiple entries of the\
    \ map match the given search function the result may be non-deterministic.\n\n\
    ```\nString result = map.search(1, (key, value) -> {\n    System.out.println(Thread.currentThread().getName());\n\
    \    if (\"foo\".equals(key)) {\n        return value;\n    }\n    return null;\n\
    });\nSystem.out.println(\"Result: \" + result);\n\n// ForkJoinPool.commonPool-worker-2\n\
    // main\n// ForkJoinPool.commonPool-worker-3\n// Result: bar\n```\n\nHere's another\
    \ example searching solely on the values of the map:\n\n```\nString result = map.searchValues(1,\
    \ value -> {\n    System.out.println(Thread.currentThread().getName());\n    if\
    \ (value.length() > 3) {\n        return value;\n    }\n    return null;\n});\n\
    \nSystem.out.println(\"Result: \" + result);\n\n// ForkJoinPool.commonPool-worker-2\n\
    // main\n// main\n// ForkJoinPool.commonPool-worker-1\n// Result: solo\n```\n\n\
    #### Reduce"
