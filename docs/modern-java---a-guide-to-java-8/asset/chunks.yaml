- fmt: "\nA stream represents a sequence of elements and supports different kind of\
    \ operations to perform computations upon those elements:\n\n```\nList<String>\
    \ myList =\n    Arrays.asList(\"a1\", \"a2\", \"b1\", \"c2\", \"c1\");\n\nmyList\n\
    \    .stream()\n    .filter(s -> s.startsWith(\"c\"))\n    .map(String::toUpperCase)\n\
    \    .sorted()\n    .forEach(System.out::println);\n\n// C1\n// C2\n```\n\nStream\
    \ operations are either intermediate or terminal. Intermediate operations return\
    \ a stream so we can chain multiple intermediate operations without using semicolons.\
    \ Terminal operations are either void or return a non-stream result. In the above\
    \ example `filter`, `map` and `sorted` are intermediate operations whereas `forEach`\
    \ is a terminal operation. For a full list of all available stream operations\
    \ see the [Stream Javadoc](http://docs.oracle.com/javase/8/docs/api/java/util/stream/Stream.html).\
    \ Such a chain of stream operations as seen in the example above is also known\
    \ as `operation pipeline`.\n\nMost stream operations accept some kind of lambda\
    \ expression parameter, a functional interface specifying the exact behavior of\
    \ the operation. Most of those operations must be both `non-interfering` and `stateless`.\
    \ What does that mean?\n\nA function is [non-interfering](http://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html#NonInterference)\
    \ when it does not modify the underlying data source of the stream, e.g. in the\
    \ above example no lambda expression does modify `myList` by adding or removing\
    \ elements from the collection.\n\nA function is [stateless](http://docs.oracle.com/javase/8/docs/api/java/util/stream/package-summary.html#Statelessness)\
    \ when the execution of the operation is deterministic, e.g. in the above example\
    \ no lambda expression depends on any mutable variables or states from the outer\
    \ scope which might change during execution.\n\n### Different kind of streams\n\
    \nStreams can be created from various data sources, especially collections. Lists\
    \ and Sets support new methods `stream()` and `parallelStream()` to either create\
    \ a sequential or a parallel stream. Parallel streams are capable of operating\
    \ on multiple threads and will be covered in a later section of this tutorial.\
    \ We focus on sequential streams for now:\n\n```\nArrays.asList(\"a1\", \"a2\"\
    , \"a3\")\n    .stream()\n    .findFirst()\n    .ifPresent(System.out::println);\
    \  // a1\n```\n\nCalling the method `stream()` on a list of objects returns a\
    \ regular object stream. But we don't have to create collections in order to work\
    \ with streams as we see in the next code sample:\n\n```\nStream.of(\"a1\", \"\
    a2\", \"a3\")\n    .findFirst()\n    .ifPresent(System.out::println);  // a1\n\
    ```\n\nJust use `Stream.of()` to create a stream from a bunch of object references.\n\
    \nBesides regular object streams Java 8 ships with special kinds of streams for\
    \ working with the primitive data types `int`, `long` and `double`. As you might\
    \ have guessed it's `IntStream`, `LongStream` and `DoubleStream`.\n\nIntStreams\
    \ can replace the regular for-loop utilizing `IntStream.range()`:\n\n```\nIntStream.range(1,\
    \ 4)\n    .forEach(System.out::println);\n\n// 1\n// 2\n// 3\n```\n\nAll those\
    \ primitive streams work just like regular object streams with the following differences:\
    \ Primitive streams use specialized lambda expressions, e.g. `IntFunction` instead\
    \ of `Function` or `IntPredicate` instead of `Predicate`. And primitive streams\
    \ support the additional terminal aggregate operations `sum()` and `average()`:\n\
    \n```\nArrays.stream(new int[] {1, 2, 3})\n    .map(n -> 2 * n + 1)\n    .average()\n\
    \    .ifPresent(System.out::println);  // 5.0\n```\n\nSometimes it's useful to\
    \ transform a regular object stream to a primitive stream or vice versa. For that\
    \ purpose object streams support the special mapping operations `mapToInt()`,\
    \ `mapToLong()` and `mapToDouble`:\n\n```\nStream.of(\"a1\", \"a2\", \"a3\")\n\
    \    .map(s -> s.substring(1))\n    .mapToInt(Integer::parseInt)\n    .max()\n\
    \    .ifPresent(System.out::println);  // 3\n```\n\nPrimitive streams can be transformed\
    \ to object streams via `mapToObj()`:\n\n```\nIntStream.range(1, 4)\n    .mapToObj(i\
    \ -> \"a\" + i)\n    .forEach(System.out::println);\n\n// a1\n// a2\n// a3\n```\n\
    \nHere's a combined example: the stream of doubles is first mapped to an int stream\
    \ and than mapped to an object stream of strings:\n\n```\nStream.of(1.0, 2.0,\
    \ 3.0)\n    .mapToInt(Double::intValue)\n    .mapToObj(i -> \"a\" + i)\n    .forEach(System.out::println);\n\
    \n// a1\n// a2\n// a3\n```\n\n### Processing Order\n\nNow that we've learned how\
    \ to create and work with different kinds of streams, let's dive deeper into how\
    \ stream operations are processed under the hood.\n\nAn important characteristic\
    \ of intermediate operations is laziness. Look at this sample where a terminal\
    \ operation is missing:\n\n```\nStream.of(\"d2\", \"a2\", \"b1\", \"b2\")\n  \
