    \ [another post](posts/2014/07/31/java8-stream-tutorial-examples) how we can utilize\
    \ the `Optional` type of Java 8 to prevent null checks. Here's the example code\
    \ from the original post.\n\nAssuming we have a hierarchical class structure like\
    \ this:\n\n```\nclass Outer {\n    Nested nested;\n    Nested getNested() {\n\
    \        return nested;\n    }\n}\nclass Nested {\n    Inner inner;\n    Inner\
    \ getInner() {\n        return inner;\n    }\n}\nclass Inner {\n    String foo;\n\
    \    String getFoo() {\n        return foo;\n    }\n}\n```\n\nResolving a deep\
    \ nested path in this structure can be kinda awkward. We have to write a bunch\
    \ of null checks to make sure not to raise a `NullPointerException`:\n\n```\n\
    Outer outer = new Outer();\nif (outer != null && outer.nested != null && outer.nested.inner\
    \ != null) {\n    System.out.println(outer.nested.inner.foo);\n}\n```\n\nWe can\
    \ get rid of all those null checks by utilizing the Java 8 `Optional` type. The\
    \ method `map` accepts a lambda expression of type `Function` and automatically\
    \ wraps each function result into an `Optional`. That enables us to pipe multiple\
    \ `map` operations in a row. Null checks are automatically handled under the hood.\n\
    \n```\nOptional.of(new Outer())\n    .map(Outer::getNested)\n    .map(Nested::getInner)\n\
    \    .map(Inner::getFoo)\n    .ifPresent(System.out::println);\n```\n\nAn alternative\
    \ way to achieve the same behavior is by utilizing a supplier function to resolve\
    \ the nested path:\n\n```\nOuter obj = new Outer();\nresolve(() -> obj.getNested().getInner().getFoo());\n\
    \    .ifPresent(System.out::println);\n```\n\nCalling `obj.getNested().getInner().getFoo())`\
    \ might throw a `NullPointerException`. In this case the exception will be caught\
    \ and the method returns `Optional.empty()`."
