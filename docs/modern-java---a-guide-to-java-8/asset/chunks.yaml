  trans: "\n\n如果你对使用 Java 编写命令行（shell）脚本感兴趣，可以尝试一下 [Nake](https://github.com/winterbe/nake)。`Nake`\
    \ 是一个针对 Java 8 Nashorn 的简化版 Make。你可以在项目特定的 `Nakefile` 中定义任务，然后在命令行中输入 `nake --\
    \ myTask` 来运行这些任务。任务使用 javascript 编写，并在 Nashorn 脚本模式下运行，因此你可以充分利用终端的强大功能以及 `JDK8`\
    \ API 和任何 Java 库。\n\n对于 Java 开发者来说，编写命令行脚本比以往任何时候都变得简单……\n\n### 就此\n\n我希望本指南对你有所帮助，并且你喜欢我们探索\
    \ Nashorn JavaScript 引擎的旅程。关于 Nashorn 的更多信息，请参阅[这里](http://docs.oracle.com/javase/8/docs/technotes/guides/scripting/nashorn/)、[这里](http://www.oracle.com/technetwork/articles/java/jf14-nashorn-2126515.html)\
    \ 以及 [这里](https://wiki.openjdk.java.net/display/Nashorn/Nashorn+extensions)。使用\
    \ Nashorn 编写 shell 脚本的指南可以在[这里](http://docs.oracle.com/javase/8/docs/technotes/guides/scripting/nashorn/shell.html#sthref24)\
    \ 找到。\n\n我最近发布了一篇后续文章，介绍了如何在 Nashorn JavaScript 引擎中使用 Backbone.js 模型。如果你想了解更多关于\
    \ Java 8 的信息，请随尽管阅读我的 Java 8 教程 和我的 Java 8 Stream 教程。\n\n本 Nashorn 教程的可运行源代码[托管在\
    \ GitHub 上](https://github.com/winterbe/java8-tutorial)。欢迎[分叉（fork）](https://github.com/winterbe/java8-tutorial/fork)\
    \ 或通过 [Twitter](https://twitter.com/winterbe_) 向我提供反馈。\n\n继续编写代码吧！\n\n# Java 8\
    \ 并发教程：线程与执行器\n\n2015 年 4 月 7 日\n\n欢迎来到我的 Java 8 并发教程的第一部分。本指南将通过易于理解的代码示例教你在\
    \ Java 8 中学习[并发编程](http://en.wikipedia.org/wiki/Concurrent_computing)。这是涵盖 Java\
    \ 并发 API 系列教程的第一部分。在接下来的 15 分钟内，你将学习如何通过线程、任务和执行服务并行执行代码。\n\n*   第 1 部分：线程与执行器\n\
    *   第 2 部分：同步与锁\n*   第 3 部分：原子变量与并发 Map\n\n[并发 API](https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/package-summary.html)\
    \ 首次于 Java 5 发布引入，并在每个新 Java 发布中不断增强。本文展示的大多数概念在旧版本的 Java 中也适用。然而，我的代码示例聚焦于 Java\
    \ 8，并大量使用了 lambda 表达式和其他新特性。如果你还不熟悉 lambda，我建议先阅读我的 Java 8 教程。\n\n### 线程与 Runnable\n\
    \n所有现代操作系统都通过[进程](http://en.wikipedia.org/wiki/Process_(computing)) 和[线程](http://en.wikipedia.org/wiki/Thread_%28computing%29)\
    \ 支持并发处理。进程是程序的实例，它们通常彼此独立运行，例如，如果你启动一个 java 程序，操作系统会派生一个新的进程，该进程与其他程序并行运行。在这些进程内部，我们可以利用线程来并发执行代码，从而充分利用\
    \ CPU 的可用核心。\n\nJava 从 `JDK 1.0` 开始就支持[线程](https://docs.oracle.com/javase/8/docs/api/java/lang/Thread.html)。在启动新线程之前，你必须指定由该线程执行的代码，通常称为\
    \ `task`（任务）。这是通过实现 `Runnable` 完成的——它是一个函数式接口，定义了一个单一的无参 void 方法 `run()`，如下例所示：\n\
    \n```java\nRunnable task = () -> {\n    String threadName = Thread.currentThread().getName();\n\
    \    System.out.println(\"Hello \" + threadName);\n};\n\ntask.run();\n\nThread\
    \ thread = new Thread(task);\nthread.start();\n\nSystem.out.println(\"Done!\"\
    );\n```\n\n由于 `Runnable` 是一个函数式接口，我们可以利用 Java 8 lambda 表达式将当前线程名称打印到控制台。首先，我们在启动新线程之前直接在主线程上执行该\
    \ runnable。\n\n控制台上的结果可能如下：\n\n```\nHello main\nHello Thread-0\nDone!\n```\n\n\
    或者这样：\n\n```\nHello main\nDone!\nHello Thread-0\n```\n\n由于并发执行，我们无法预测 runnable\
    \ 会在打印 'done' 之前还是之后被调用。顺序是不确定的，这使得并发编程在大型应用程序中成为一项复杂的任务。\n\n可以使线程睡眠一段时间。这对于在后续代码中模拟耗时任务非常有用：\n\
    \n```java\nRunnable runnable = () -> {\n    try {\n        String name = Thread.currentThread().getName();\n\
    \        System.out.println(\"Foo \" + name);\n        TimeUnit.SECONDS.sleep(1);\n\
    \        System.out.println(\"Bar \" + name);\n    } catch (InterruptedException\
    \ e) {\n        e.printStackTrace();\n    }\n};\n\nThread thread = new Thread(runnable);\n\
    thread.start();\n```\n\n当你运行上述代码时，你会注意到第一个和第二个打印语句之间有一秒钟的延迟。`TimeUnit` 是一个处理时间单位的实用枚举。或者，你也可以通过调用\
    \ `Thread.sleep(1000)` 实现相同的效果。\n\n操作 `Thread` 类可能会非常繁琐且容易出错。正因如此，并发 API 在 2004\
    \ 年随 Java 5 发布时被引入。该 API 位于 `java.util.concurrent` 包中，包含了许多处理并发的有用类。从那时起，并发 API\
    \ 随着每个新的 Java 版本不断得到了增强，甚至 Java 8 也提供了处理并发的新类和新方法。\n\n现在，让我们深入查看并发 API 中最重要的部分之一——执行服务。\n\
    \n### 执行器 (Executors)\n\n并发 API 引入了 `ExecutorService` 概念，作为操作线程的高级替代方案。执行器能够运行异步任务，并且通常管理一个线程池，因此我们不需要手动创建新线程。内部池的所有线程在底层会被重用于相关任务，因此在应用程序的生命周期内，可以使用单个执行服务运行任意数量的并发任务。\n\
    \n以下是执行器实现的第一个线程示例：\n\n```java\nExecutorService executor = Executors.newSingleThreadExecutor();\n\
    executor.submit(() -> {\n    String threadName = Thread.currentThread().getName();\n\
    \    System.out.println(\"Hello \" + threadName);\n});\n\n// => Hello pool-1-thread-1\n\
    ```\n\n`Executors` 类提供了方便工厂方法来创建不同类型的执行服务。在示例中，我们使用了一个线程池大小为一的执行器。\n\n结果与上面的示例相似，但运行代码时你会发现一个重要的区别：Java\
    \ 进程永远不会停止！执行器必须显式停止——否则它们会一直监听新任务。\n\n`ExecutorService` 提供了两个用于此目的的方法：`shutdown()`\
    \ 等正在运行的任务完成，而 `shutdownNow()` 则中断所有正在运行的任务并立即关闭执行器。\n\n这是我通常关闭执行器的首选方式：\n\n"
- fmt: "\n```\ntry {\n    System.out.println(\"attempt to shutdown executor\");\n\
    \    executor.shutdown();\n    executor.awaitTermination(5, TimeUnit.SECONDS);\n\
    }\ncatch (InterruptedException e) {\n    System.err.println(\"tasks interrupted\"\
    );\n}\nfinally {\n    if (!executor.isTerminated()) {\n        System.err.println(\"\
    cancel non-finished tasks\");\n    }\n    executor.shutdownNow();\n    System.out.println(\"\
    shutdown finished\");\n}\n```\n\nThe `executor` shuts down softly by waiting a\
    \ certain amount of time for termination of currently running tasks. After a maximum\
    \ of five seconds the `executor` finally shuts down by interrupting all running\
    \ tasks.\n\n### Callables and Futures\n\nIn addition to `Runnable` executors support\
    \ another kind of task named `Callable`. `Callables` are functional interfaces\
    \ just like runnables but instead of being `void` they return a value.\n\nThis\
    \ lambda expression defines a callable returning an integer after sleeping for\
    \ one second:\n\n```\nCallable<Integer> task = () -> {\n    try {\n        TimeUnit.SECONDS.sleep(1);\n\
    \        return 123;\n    }\n    catch (InterruptedException e) {\n        throw\
    \ new IllegalStateException(\"task interrupted\", e);\n    }\n};\n```\n\n`Callables`\
    \ can be submitted to executor services just like runnables. But what about the\
    \ callables result? Since `submit()` doesn't wait until the task completes, the\
    \ executor service cannot return the result of the callable directly. Instead\
    \ the executor returns a special result of type `Future` which can be used to\
    \ retrieve the actual result at a later point in time.\n\n```\nExecutorService\
    \ executor = Executors.newFixedThreadPool(1);\nFuture<Integer> future = executor.submit(task);\n\
    \nSystem.out.println(\"future done? \" + future.isDone());\n\nInteger result =\
    \ future.get();\n\nSystem.out.println(\"future done? \" + future.isDone());\n\
    System.out.print(\"result: \" + result);\n```\n\nAfter submitting the callable\
    \ to the `executor` we first check if the `future` has already been finished execution\
    \ via `isDone()`. I'm pretty sure this isn't the case since the above callable\
    \ sleeps for one second before returning the integer.\n\nCalling the method `get()`\
    \ blocks the current thread and waits until the callable completes before returning\
    \ the actual result `123`. Now the `future` is finally done and we see the following\
    \ result on the console:\n\n```\nfuture done? false\nfuture done? true\nresult:\
    \ 123\n```\n\n`Futures` are tightly coupled to the underlying executor service.\
    \ Keep in mind that every non-terminated `future` will throw exceptions if you\
    \ shutdown the `executor`:\n\n```\nexecutor.shutdownNow();\nfuture.get();\n```\n\
    \nYou might have noticed that the creation of the `executor` slightly differs\
    \ from the previous example. We use `newFixedThreadPool(1)` to create an executor\
    \ service backed by a thread-pool of size one. This is equivalent to `newSingleThreadExecutor()`\
    \ but we could later increase the pool size by simply passing a value larger than\
    \ one.\n\n### Timeouts\n\nAny call to `future.get()` will block and wait until\
    \ the underlying callable has been terminated. In the worst case a callable runs\
    \ forever - thus making your application unresponsive. You can simply counteract\
    \ those scenarios by passing a timeout:\n\n```\nExecutorService executor = Executors.newFixedThreadPool(1);\n\
    \nFuture<Integer> future = executor.submit(() -> {\n    try {\n        TimeUnit.SECONDS.sleep(2);\n\
    \        return 123;\n    }\n    catch (InterruptedException e) {\n        throw\
    \ new IllegalStateException(\"task interrupted\", e);\n    }\n});\n\nfuture.get(1,\
    \ TimeUnit.SECONDS);\n```\n\nExecuting the above code results in a `TimeoutException`:\n\
    \n```\nException in thread \"main\" java.util.concurrent.TimeoutException\n  \
    \  at java.util.concurrent.FutureTask.get(FutureTask.java:205)\n```\n\nYou might\
    \ already have guessed why this exception is thrown: We specified a maximum wait\
    \ time of one second but the callable actually needs two seconds before returning\
    \ the result.\n\n### InvokeAll\n\nExecutors support batch submitting of multiple\
    \ callables at once via `invokeAll()`. This method accepts a collection of callables\
    \ and returns a list of futures.\n\n```\nExecutorService executor = Executors.newWorkStealingPool();\n\
    \nList<Callable<String>> callables = Arrays.asList(\n        () -> \"task1\",\n\
    \        () -> \"task2\",\n        () -> \"task3\");\n\nexecutor.invokeAll(callables)\n\
    \    .stream()\n    .map(future -> {\n        try {\n            return future.get();\n\
    \        }\n        catch (Exception e) {\n            throw new IllegalStateException(e);\n\
    \        }\n    })\n    .forEach(System.out::println);\n```\n\nIn this example\
    \ we utilize Java 8 functional streams in order to process all futures returned\
    \ by the invocation of `invokeAll()`. We first map each future to its return value\
    \ and then print each value to the console. If you're not yet familiar with streams\
    \ read my [Java 8 Stream Tutorial](posts/2014/07/31/java8-stream-tutorial-examples).\n\
    \n### InvokeAny\n\nAnother way of batch-submitting callables is the method `invokeAny()`\
    \ which works slightly different to `invokeAll()`. Instead of returning future\
    \ objects this method blocks until the first callable terminates and returns the\
    \ result of that callable.\n\nIn order to test this behavior we use this helper\
    \ method to simulate callables with different durations. The method returns a\
    \ callable that sleeps for a certain amount of time until returning the given\
    \ result:\n\n```\nCallable<String> callable(String result, long sleepSeconds)\
    \ {\n    return () -> {\n        TimeUnit.SECONDS.sleep(sleepSeconds);\n     \
    \   return result;\n    };\n}\n```\n\nWe use this method to create a bunch of\
    \ callables with different durations from one to three seconds. Submitting those\
    \ callables to an executor via `invokeAny()` returns the string result of the\
    \ fastest callable - in that case task2:\n\n```\nExecutorService executor = Executors.newWorkStealingPool();\n\
    \nList<Callable<String>> callables = Arrays.asList(\n    callable(\"task1\", 2),\n\
    \    callable(\"task2\", 1),\n    callable(\"task3\", 3));\n\nString result =\
    \ executor.invokeAny(callables);\nSystem.out.println(result);\n\n// => task2\n\
    ```\n\nThe above example uses yet another type of executor created via `newWorkStealingPool()`.\
    \ This factory method is part of Java 8 and returns an executor of type `ForkJoinPool`\
    \ which works slightly different than normal executors. Instead of using a fixed\
    \ size thread-pool [ForkJoinPools](https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/ForkJoinPool.html)\
    \ are created for a given parallelism size which per default is the number of\
    \ available cores of the hosts CPU.\n\nForkJoinPools exist since Java 7 and will\
    \ be covered in detail in a later tutorial of this series. Let's finish this tutorial\
    \ by taking a deeper look at scheduled executors.\n\n### Scheduled Executors\n\
    \nWe've already learned how to submit and run tasks once on an executor. In order\
    \ to periodically run common tasks multiple times, we can utilize scheduled thread\
    \ pools.\n\nA `ScheduledExecutorService` is capable of scheduling tasks to run\
    \ either periodically or once after a certain amount of time has elapsed.\n\n\
    This code sample schedules a task to run after an initial delay of three seconds\
    \ has passed:\n\n```\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
    \nRunnable task = () -> System.out.println(\"Scheduling: \" + System.nanoTime());\n\
    ScheduledFuture<?> future = executor.schedule(task, 3, TimeUnit.SECONDS);\n\n\
    TimeUnit.MILLISECONDS.sleep(1337);\n\nlong remainingDelay = future.getDelay(TimeUnit.MILLISECONDS);\n\
    System.out.printf(\"Remaining Delay: %ms\", remainingDelay);\n```\n\nScheduling\
    \ a task produces a specialized future of type `ScheduledFuture` which - in addition\
    \ to `Future` - provides the method `getDelay()` to retrieve the remaining delay.\
    \ After this delay has elapsed the task will be executed concurrently.\n\nIn order\
    \ to schedule tasks to be executed periodically, executors provide the two methods\
    \ `scheduleAtFixedRate()` and `scheduleWithFixedDelay()`. The first method is\
    \ capable of executing tasks with a fixed time rate, e.g. once every second as\
    \ demonstrated in this example:\n"
