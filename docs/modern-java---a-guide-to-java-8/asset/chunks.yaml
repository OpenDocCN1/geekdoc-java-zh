  trans: "\n\n```javascript\nfunction Person(firstName, lastName) {\n    this.firstName\
    \ = firstName;\n    this.lastName = lastName;\n    this.getFullName = function()\
    \ {\n        return this.firstName + \" \" + this.lastName;\n    }\n}\n```\n\n\
    可以通过 `callMember()` 在 `ScriptObjectMirror` 上调用 javascript 方法 `getFullName`。\n\n\
    ```javascript\nstatic void fun4(ScriptObjectMirror person) {\n    System.out.println(\"\
    Full Name is: \" + person.callMember(\"getFullName\"));\n}\n```\n\n当将一个新的的 `person`\
    \ 实例传递给 瓦方法（java）方法 `fun4` 时，我们在控制台上看到了预期的结果：\n\n```javascript\nvar person1 =\
    \ new Person(\"Peter\", \"Parker\");\nMyJavaClass.fun4(person1);\n\n// Full Name\
    \ is: Peter Parker\n```\n\n 语言扩展\n\nNashorn 为 ECMAScript 标准定义了各种语言和 API 扩展。让我们直接进入最新的特性：\n\
    \n#### 类型数组 (Typed Arrays)\n\n原生的 javascript 数组是无类型的。Nashorn 允许你在 javascript 中使用类型\
    \ java 数组：\n\n```javascript\nvar IntArray = Java.type(\"int[]\");\n\nvar array\
    \ = new IntArray(5);\narray[0] = 5;\narray[1] = 4;\narray[2] = 3;\narray[3] =\
    \ 2;\narray[4] = 1;\n\ntry {\n    array[5] = 23;\n} catch (e) {\n    print(e.message);\
    \  // Array index out of range: 5\n}\n\narray[0] = \"17\";\nprint(array[0]); \
    \ // 17\n\narray[0] = \"wrong type\";\nprint(array[0]);  // 0\n\narray[0] = \"\
    17.3\";\nprint(array[0]);  // 17\n```\n\n`int[]` 数组的行为就像真正的 java int 数组。但此外，当我们尝试向数组添加非整数值时，Nashorn\
    \ 在底层执行了隐式类型转换。字符串会自动转换为 int，这非常方便。\n\n#### 集合与 For Each 循环 (Collections and For\
    \ Each)\n\n与其纠结数组，我们可以使用任何 java 集合。首先通过 `Java.type` 定义 java 类型，然后根据需要创建新实例。\n\n\
    ```javascript\nvar ArrayList = Java.type('java.util.ArrayList');\nvar list = new\
    \ ArrayList();\nlist.add('a');\nlist.add('b');\nlist.add('c');\n\nfor each (var\
    \ el in list) print(el);  // a, b, c\n```\n\n为了遍历集合和数组，Nashorn 引入了 `for each`\
    \ 语句。它的工作方式与 java 中的 `foreach` 循环一样。\n\n这是另一个集合 foreach 示例，使用了 `HashMap`：\n\n\
    ```javascript\nvar map = new java.util.HashMap();\nmap.put('foo', 'val1');\nmap.put('bar',\
    \ 'val2');\n\nfor each (var e in map.keySet()) print(e);  // foo, bar\n\nfor each\
    \ (var e in map.values()) print(e);  // val1, val2\n```\n\n#### Lambda 表达式与流 (Lambda\
    \ expressions and Streams)\n\n每个人喜欢 lambda 和流——Nashorn 也是！尽管 ECMAScript 5.1 缺乏\
    \ Java 8 lambda 表达式中的紧凑箭头语法，但我们可以在任何接受 lambda 表达式的地方使用函数字面量。\n\n```javascript\n\
    var list2 = new java.util.ArrayList();\nlist2.add(\"ddd2\");\nlist2.add(\"aaa2\"\
    );\nlist2.add(\"bbb1\");\nlist2.add(\"aaa1\");\nlist2.add(\"bbb3\");\nlist2.add(\"\
    ccc\");\nlist2.add(\"bbb2\");\nlist2.add(\"ddd1\");\n\nlist2\n    .stream()\n\
    \    .filter(function(el) {\n        return el.startsWith(\"aaa\");\n    })\n\
    \    .sorted()\n    .forEach(function(el) {\n        print(el);\n    });\n   \
    \ // aaa1, aaa2\n```\n\n#### 类扩展 (Extending classes)\n\nJava 类型可以通过 `Java.extend`\
    \ 扩展进行简单的扩展。正如下一个示例所示，你甚至可以在脚本中创建多线程代码：\n\n```javascript\nvar Runnable = Java.type('java.lang.Runnable');\n\
    var Printer = Java.extend(Runnable, {\n    run: function() {\n        print('printed\
    \ from a separate thread');\n    }\n});\n\nvar Thread = Java.type('java.lang.Thread');\n\
    new Thread(new Printer()).start();\n\nnew Thread(function() {\n    print('printed\
    \ from another thread');\n}).start();\n\n// printed from a separate thread\n//\
    \ printed from another thread\n```\n\n#### 参数重载 (Parameter overloading)\n\n方法和函数可以使用点符号表示调用，也可以使用方括号表示法调用。\n\
    \n```javascript\nvar System = Java.type('java.lang.System');\nSystem.out.println(10);\
    \              // 10\nSystem.out\"println\";         // 11.0\nSystem.out\"println(double)\"\
    ;   // 12.0\n```\n\n在调用带有重载参数的方法时传递可选参数类型 `println(double)` 决定了要调用的精确方法。\n\n####\
    \ Java Beans\n\n与其显式地处理 getter（getters）和 setter（setters），你只需要使用简单的属性名来从 java bean\
    \ 中获取或设置值。\n\n```javascript\nvar Date = Java.type('java.util.Date');\nvar date\
    \ = new Date();\ndate.year += 1900;\nprint(date.year);  // 2014\n```\n\n#### 函数字面量\
    \ (Function Literals)\n\n对于简单的单行函数，我们可以跳过\n\n"
- fmt: "\nIf you're interested in writing command-line (shell) scripts with Java,\
    \ give [Nake](https://github.com/winterbe/nake) a try. `Nake` is a simplified\
    \ Make for Java 8 Nashorn. You define tasks in a project-specific `Nakefile`,\
    \ then run those tasks by typing `nake -- myTask` into the command line. Tasks\
    \ are written in javascript and run in Nashorns scripting mode, so you can utilize\
    \ the full power of your terminal as well as the `JDK8` API and any java library.\n\
    \nFor Java Developers writing command-line scripts is easy as never before...\n\
    \n### That's it\n\nI hope this guide was helpful to you and you enjoyed our journey\
    \ to the Nashorn Javascript Engine. For further information about Nashorn read\
    \ [here](http://docs.oracle.com/javase/8/docs/technotes/guides/scripting/nashorn/),\
    \ [here](http://www.oracle.com/technetwork/articles/java/jf14-nashorn-2126515.html)\
    \ and [here](https://wiki.openjdk.java.net/display/Nashorn/Nashorn+extensions).\
    \ A guide to coding shell scripts with Nashorn can be found [here](http://docs.oracle.com/javase/8/docs/technotes/guides/scripting/nashorn/shell.html#sthref24).\n\
    \nI recently published a [follow up article](posts/2014/04/07/using-backbonejs-with-nashorn)\
    \ about how to use Backbone.js models with the Nashorn Javascript Engine. If you\
    \ want to learn more about Java 8 feel free to read my [Java 8 Tutorial](posts/2014/03/16/java-8-tutorial)\
    \ and my [Java 8 Stream Tutorial](posts/2014/07/31/java8-stream-tutorial-examples).\n\
    \nThe runnable source code from this Nashorn tutorial is [hosted on GitHub](https://github.com/winterbe/java8-tutorial).\
    \ Feel free to [fork the repository](https://github.com/winterbe/java8-tutorial/fork)\
    \ or send me your feedback via [Twitter](https://twitter.com/winterbe_).\n\nKeep\
    \ on coding!\n\n# Java 8 Concurrency Tutorial: Threads and Executors\n\nApril\
    \ 07, 2015\n\nWelcome to the first part of my Java 8 Concurrency tutorial. This\
    \ guide teaches you [concurrent programming](http://en.wikipedia.org/wiki/Concurrent_computing)\
    \ in Java 8 with easily understood code examples. It's the first part out of a\
    \ series of tutorials covering the Java Concurrency API. In the next 15 min you\
    \ learn how to execute code in parallel via threads, tasks and executor services.\n\
    \n*   Part 1: Threads and Executors\n*   Part 2: [Synchronization and Locks](posts/2015/04/30/java8-concurrency-tutorial-synchronized-locks-examples)\n\
    *   Part 3: [Atomic Variables and ConcurrentMap](posts/2015/05/22/java8-concurrency-tutorial-atomic-concurrent-map-examples)\n\
    \nThe [Concurrency API](https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/package-summary.html)\
    \ was first introduced with the release of Java 5 and then progressively enhanced\
    \ with every new Java release. The majority of concepts shown in this article\
    \ also work in older versions of Java. However my code samples focus on Java 8\
    \ and make heavy use of lambda expressions and other new features. If you're not\
    \ yet familiar with lambdas I recommend reading my [Java 8 Tutorial](posts/2014/03/16/java-8-tutorial)\
    \ first.\n\n### Threads and Runnables\n\nAll modern operating systems support\
    \ concurrency both via [processes](http://en.wikipedia.org/wiki/Process_(computing))\
    \ and [threads](http://en.wikipedia.org/wiki/Thread_%28computing%29). Processes\
    \ are instances of programs which typically run independent to each other, e.g.\
    \ if you start a java program the operating system spawns a new process which\
    \ runs in parallel to other programs. Inside those processes we can utilize threads\
    \ to execute code concurrently, so we can make the most out of the available cores\
    \ of the CPU.\n\nJava supports [Threads](https://docs.oracle.com/javase/8/docs/api/java/lang/Thread.html)\
    \ since `JDK 1.0`. Before starting a new thread you have to specify the code to\
    \ be executed by this thread, often called the `task`. This is done by implementing\
    \ `Runnable` - a functional interface defining a single void no-args method `run()`\
    \ as demonstrated in the following example:\n\n```java\nRunnable task = () ->\
    \ {\n    String threadName = Thread.currentThread().getName();\n    System.out.println(\"\
    Hello \" + threadName);\n};\n\ntask.run();\n\nThread thread = new Thread(task);\n\
    thread.start();\n\nSystem.out.println(\"Done!\");\n```\n\nSince `Runnable` is\
    \ a functional interface we can utilize Java 8 lambda expressions to print the\
    \ current threads name to the console. First we execute the runnable directly\
    \ on the main thread before starting a new thread.\n\nThe result on the console\
    \ might look like this:\n\n```\nHello main\nHello Thread-0\nDone!\n```\n\nOr that:\n\
    \n```\nHello main\nDone!\nHello Thread-0\n```\n\nDue to concurrent execution we\
    \ cannot predict if the runnable will be invoked before or after printing 'done'.\
    \ The order is non-deterministic, thus making concurrent programming a complex\
    \ task in larger applications.\n\nThreads can be put to sleep for a certain duration.\
    \ This is quite handy to simulate long running tasks in the subsequent code:\n\
    \n```java\nRunnable runnable = () -> {\n    try {\n        String name = Thread.currentThread().getName();\n\
    \        System.out.println(\"Foo \" + name);\n        TimeUnit.SECONDS.sleep(1);\n\
    \        System.out.println(\"Bar \" + name);\n    } catch (InterruptedException\
    \ e) {\n        e.printStackTrace();\n    }\n};\n\nThread thread = new Thread(runnable);\n\
    thread.start();\n```\n\nWhen you run the above code you'll notice the one second\
    \ delay between the first and second print statement. `TimeUnit` is a useful enum\
    \ for working with units of time. Alternatively you can achieve the same by calling\
    \ `Thread.sleep(1000)`.\n\nWorking with the `Thread` class can be very tedious\
    \ and error-prone. Due to that reason the Concurrency API was introduced back\
    \ in 2004 with the release of Java 5. The API is located in package `java.util.concurrent`\
    \ and contains many useful classes for handling concurrency. Since that time the\
    \ Concurrency API has been enhanced with every new Java release and even Java\
    \ 8 provides new classes and methods for dealing with concurrency.\n\nNow let's\
    \ take a deeper look at one of the most important parts of the Concurrency API\
    \ - the executor services.\n\n### Executors\n\nThe Concurrency API introduces\
    \ the concept of an `ExecutorService` as a higher level replacement for working\
    \ with threads. Executors are capable of running asynchronous tasks and typically\
    \ manage a pool of threads, so we don't have to create new threads manually. All\
    \ threads of the internal pool will be reused under the hood for relevant tasks,\
    \ so we can run as many concurrent tasks as we want throughout the life-cycle\
    \ of our application with a single executor service.\n\nThis is how the first\
    \ thread-example looks like using executors:\n\n```java\nExecutorService executor\
    \ = Executors.newSingleThreadExecutor();\nexecutor.submit(() -> {\n    String\
    \ threadName = Thread.currentThread().getName();\n    System.out.println(\"Hello\
    \ \" + threadName);\n});\n\n// => Hello pool-1-thread-1\n```\n\nThe class `Executors`\
    \ provides convenient factory methods for creating different kinds of executor\
    \ services. In this sample we use an executor with a thread pool of size one.\n\
    \nThe result looks similar to the above sample but when running the code you'll\
    \ notice an important difference: the java process never stops! Executors have\
    \ to be stopped explicitly - otherwise they keep listening for new tasks.\n\n\
    An `ExecutorService` provides two methods for that purpose: `shutdown()` waits\
    \ for currently running tasks to finish while `shutdownNow()` interrupts all running\
    \ tasks and shut the executor down immediately.\n\nThis is the preferred way how\
    \ I typically shutdown executors:\n"
