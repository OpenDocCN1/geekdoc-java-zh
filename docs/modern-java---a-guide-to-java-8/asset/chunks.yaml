    \ foobar:foo:bar\n```\n\nThe second method `chars` creates a stream for all characters\
    \ of the string, so you can use stream operations upon those characters:\n\n```\n\
    \"foobar:foo:bar\"\n    .chars()\n    .distinct()\n    .mapToObj(c -> String.valueOf((char)c))\n\
    \    .sorted()\n    .collect(Collectors.joining());\n// => :abfor\n```\n\nNot\
    \ only strings but also regex patterns now benefit from streams. Instead of splitting\
    \ strings into streams for each character we can split strings for any pattern\
    \ and create a stream to work upon as shown in this example:\n\n```\nPattern.compile(\"\
    :\")\n    .splitAsStream(\"foobar:foo:bar\")\n    .filter(s -> s.contains(\"bar\"\
    ))\n    .sorted()\n    .collect(Collectors.joining(\":\"));\n// => bar:foobar\n\
    ```\n\nAdditionally regex patterns can be converted into predicates. Those predicates\
    \ can for example be used to filter a stream of strings:\n\n```\nPattern pattern\
    \ = Pattern.compile(\".*@gmail\\\\.com\");\nStream.of(\"bob@gmail.com\", \"alice@hotmail.com\"\
    )\n    .filter(pattern.asPredicate())\n    .count();\n// => 1\n```\n\nThe above\
    \ pattern accepts any string which ends with `@gmail.com` and is then used as\
    \ a Java 8 `Predicate` to filter a stream of email addresses.\n\n### Crunching\
    \ Numbers\n\nJava 8 adds additional support for working with unsigned numbers.\
    \ Numbers in Java had always been signed. Let's look at `Integer` for example:\n\
    \nAn `int` represents a maximum of 2³² binary digits. Numbers in Java are per\
    \ default signed, so the last binary digit represents the sign (0 = positive,\
    \ 1 = negative). Thus the maximum positive signed `int` is 2³¹ - 1 starting with\
    \ the decimal zero.\n\nYou can access this value via `Integer.MAX_VALUE`:\n\n\
    ```\nSystem.out.println(Integer.MAX_VALUE);      // 2147483647\nSystem.out.println(Integer.MAX_VALUE\
    \ + 1);  // -2147483648\n```\n\nJava 8 adds support for parsing unsigned ints.\
    \ Let's see how this works:\n\n```\nlong maxUnsignedInt = (1l << 32) - 1;\nString\
    \ string = String.valueOf(maxUnsignedInt);\nint unsignedInt = Integer.parseUnsignedInt(string,\
    \ 10);\nString string2 = Integer.toUnsignedString(unsignedInt, 10);\n```\n\nAs\
    \ you can see it's now possible to parse the maximum possible unsigned number\
    \ 2³² - 1 into an integer. And you can also convert this number back into a string\
    \ representing the unsigned number.\n\nThis wasn't possible before with `parseInt`\
    \ as this example demonstrates:\n\n```\ntry {\n    Integer.parseInt(string, 10);\n\
    }\ncatch (NumberFormatException e) {\n    System.err.println(\"could not parse\
    \ signed int of \" + maxUnsignedInt);\n}\n```\n\nThe number is not parseable as\
    \ a signed int because it exceeds the maximum of 2³¹ - 1.\n\n### Do the Math\n\
    \nThe utility class `Math` has been enhanced by a couple of new methods for handling\
    \ number overflows. What does that mean? We've already seen that all number types\
    \ have a maximum value. So what happens when the result of an arithmetic operation\
    \ doesn't fit into its size?\n\n```\nSystem.out.println(Integer.MAX_VALUE);  \
    \    // 2147483647\nSystem.out.println(Integer.MAX_VALUE + 1);  // -2147483648\n\
    ```\n\nAs you can see a so called **integer overflow** happens which is normally\
    \ not the desired behavior.\n\nJava 8 adds support for strict math to handle this\
    \ problem. `Math` has been extended by a couple of methods who all ends with `exact`,\
    \ e.g. `addExact`. Those methods handle overflows properly by throwing an `ArithmeticException`\
    \ when the result of the operation doesn't fit into the number type:\n\n```\n\
    try {\n    Math.addExact(Integer.MAX_VALUE, 1);\n}\ncatch (ArithmeticException\
    \ e) {\n    System.err.println(e.getMessage());\n    // => integer overflow\n\
    }\n```\n\nThe same exception might be thrown when trying to convert longs to int\
    \ via `toIntExact`:\n\n```\ntry {\n    Math.toIntExact(Long.MAX_VALUE);\n}\ncatch\
    \ (ArithmeticException e) {\n    System.err.println(e.getMessage());\n    // =>\
    \ integer overflow\n}\n```\n\n### Working with Files\n\nThe utility class `Files`\
    \ was first introduced in Java 7 as part of Java NIO. The JDK 8 API adds a couple\
    \ of additional methods which enables us to use functional streams with files.\
    \ Let's deep-dive into a couple of code samples.\n\n#### Listing files\n\nThe\
    \ method `Files.list` streams all paths for a given directory, so we can use stream\
    \ operations like `filter` and `sorted` upon the contents of the file system.\n\
    \n```\ntry (Stream<Path> stream = Files.list(Paths.get(\"\"))) {\n    String joined\
    \ = stream\n        .map(String::valueOf)\n        .filter(path -> !path.startsWith(\"\
    .\"))\n        .sorted()\n        .collect(Collectors.joining(\"; \"));\n    System.out.println(\"\
    List: \" + joined);\n}\n```\n\nThe above example lists all files for the current\
    \ working directory, then maps each path to it's string representation. The result\
    \ is then filtered, sorted and finally joined into a string. If you're not yet\
    \ familiar with functional streams you should read my [Java 8 Stream Tutorial](posts/2014/07/31/java8-stream-tutorial-examples).\n\
    \nYou might have noticed that the creation of the stream is wrapped into a try/with\
    \ statement. Streams implement `AutoCloseable` and in this case we really have\
    \ to close the stream explicitly since it's backed by IO operations.\n\n> The\
    \ returned stream encapsulates a DirectoryStream. If timely disposal of file system\
    \ resources is required, the try-with-resources construct should be used to ensure\
    \ that the stream's close method is invoked after the stream operations are completed.\n\
    \n#### Finding files"
