  trans: "\n\n```\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
    \nRunnable task = () -> System.out.println(\"Scheduling: \" + System.nanoTime());\n\
    \nint initialDelay = 0;\nint period = 1;\nexecutor.scheduleAtFixedRate(task, initialDelay,\
    \ period, TimeUnit.SECONDS);\n```\n\n此外，该方法还接受一个初始延迟，用于描述在任务首次执行之前的前的等待时间。\n\n\
    请记住，`scheduleAtFixedRate()` 不会考虑任务的实际持续时间。因此，如果你指定了一个一秒的周期，但任务需要 2 秒才能执行，那么线程池很快就会满负荷。\n\
    \n在这种情况下，你应该考虑使用 `scheduleWithFixedDelay()`。该方法的工作原理与上述的对应方法相同。区别在于，等待周期适用于上一次任务结束和下一次任务开始之间。例如：\n\
    \n```\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
    \nRunnable task = () -> {\n    try {\n        TimeUnit.SECONDS.sleep(2);\n   \
    \     System.out.println(\"Scheduling: \" + System.nanoTime());\n    }\n    catch\
    \ (InterruptedException e) {\n        System.err.println(\"task interrupted\"\
    );\n    }\n};\n\nexecutor.scheduleWithFixedDelay(task, 0, 1, TimeUnit.SECONDS);\n\
    ```\n\n这个示例调度了一个任务，在执行结束和下一次执行开始之间有一秒的固定延迟。初始延迟为零，任务持续时间为两秒。因此，我们最终得到的执行间隔为 0s、3s、6s、9s\
    \ 等。正如你所见到的，如果你无法预测调度任务的持续时间，`scheduleWithFixedDelay()` 就非常方便。\n\n这是系列并发教程的第一部分。我建议你亲自去练习所展示的代码示例。你可以在\
    \ [GitHub](https://github.com/winterbe/java8-tutorial) 上找到本文所有的代码示例，请尽管 fork 仓库并[给我点个\
    \ star](https://github.com/winterbe/java8-tutorial/stargazers)。\n\n希望你喜欢这篇文章。如果你有任何进一步的问题，请在下方的评论区或通过\
    \ [Twitter](https://twitter.com/winterbe_) 向我发送反馈。\n\n*   第 1 部分：线程与执行器\n*   第\
    \ 2 部分：同步与锁\n*   第 3 部分：原子变量与 ConcurrentMap\n\n# Java 8 并发教程：同步与锁\n\n2015 年 4\
    \ 月 30 日\n\n欢迎阅读我的 Java 8 并发教程的第二部分。该系列指南通过易于理解的代码示例教授 Java 8 中的多线程编程知识。在接下来的\
    \ 15 分钟内，你将学习如何通过 `synchronized` 关键字、锁和信号量来同步可变共享变量的访问。\n\n*   第 1 部分：线程与执行器\n\
    *   第 2 部分：同步与锁\n*   第 3 部分：原子变量与 ConcurrentMap\n\n本文展示的大多数概念在 Java 的旧版本中也适用。然而，代码示例侧重于\
    \ Java 8，并大量使用了 lambda 表达式和新的并发特性。如果你还不熟悉 lambdas，我建议先阅读我的 Java 8 教程。\n\n为了简单起见，本教程的代码示例使用了两个辅助方法\
    \ `sleep(seconds)` 和 `stop(executor)`，它们定义在[这里](https://github.com/winterbe/java8-tutorial/blob/master/src/com/winterbe/java8/samples/concurrent/ConcurrentUtils.java)。\n\
    \n## Synchronized\n\n在上一个教程)中，我们学习了如何通过执行器服务并行执行代码。在编写此类多线程代码时，必须特别注意从多个线程并发访问共享的可变变量。假设我们想要增加一个可以被多个线程同时访问的整数。\n\
    \n我们定义了一个字段 `count` 并带有一个一个 `increment()` 方法来使计数加一：\n\n```\nint count = 0;\n\n\
    void increment() {\n    count = count + 1;\n}\n```\n\n当从多个线程并发调用此方法时，我们就陷入了严重的麻烦：\n\
    \n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\nIntStream.range(0,\
    \ 10000)\n    .forEach(i -> executor.submit(this::increment));\n\nstop(executor);\n\
    \nSystem.out.println(count);  // 9965\n```\n\n我们看到的不是 10000 的常量结果计数，而是实际结果随着上述代码的每次执行而变化。原因是我们在不同线程之间共享了一个可变变量，而没有对该变量的访问进行同步，这导致了[竞态条件](http://en.wikipedia.org/wiki/Race_condition)。\n\
    \n为了增加数字，必须执行三个步骤：\n1. 读取当前值\n2. 将此值加一\n3. 写入新值\n\n如果两个线程并行执行这三个步骤，可能会获取到相同的值。幸运的是，Java\
    \ 从早期就通过 `synchronized` 关键字支持线程同步。我们可以利用 `synchronized` 来修复上述竞态条件：\n\n```\nsynchronized\
    \ void incrementSync() {\n    count = count + 1;\n}\n```\n\n当并发使用 `incrementSync()`\
    \ 时，我们得到了预期的结果 10000：\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    \nIntStream.range(0, 10000)\n    .forEach(i -> executor.submit(this::incrementSync));\n\
    \nstop(executor);\n\nSystem.out.println(count);  // 10000\n```\n\n`synchronized`\
    \ 关键字也可以作为语句块。\n\n```\nvoid incrementSync() {\n    synchronized (this) {\n   \
    \     count = count + 1;\n    }\n}\n```\n\nJava 内部使用所谓的监视器（monitor，也称为[监视器锁或内置锁](https://docs.oracle.com/javase/tutorial/essential/concurrency/locksync.html））来管理同步。例如，使用同步方法时，每个方法共享对应对象的监视器。\n\
    \n所有隐式监视器都实现了重入特性。重入意味着锁绑定到当前线程。一个线程可以安全地多次获取同一个锁，而不会导致死锁（例如，同步方法调用了同一个对象的另一个同步方法）。\n\
    \n## Locks\n\n与其使用通过 `synchronized` 关键字进行的隐式锁定，并发 API 还支持由 `Lock` 接口指定的各种显式锁。锁提供了用于细粒度控制的各种方法，因此比隐式监视器更具表现力。\n\
    \n标准 JDK 中提供了多种锁实现，将在后续章节中进行演示。\n\n### ReentrantLock\n\n`ReentrantLock` 类是一种互斥锁，与通过\
    \ `synchronized` 关键字访问的隐式监视器基本行为相同，但具有扩展的功能。正如名称所示，这种锁实现了与隐式监视器相同的重入特性。\n\n让我们看看使用\
    \ `ReentrantLock` 的上述示例是什么样子的：\n\n```\nReentrantLock lock = new ReentrantLock();\n\
    int count = 0;\n\nvoid increment() {\n    lock.lock();\n    try {\n        count++;\n\
    \    } finally {\n        lock.unlock();\n    }\n}\n```\n"
- fmt: "\nA lock is acquired via `lock()` and released via `unlock()`. It's important\
    \ to wrap your code into a `try/finally` block to ensure unlocking in case of\
    \ exceptions. This method is thread-safe just like the synchronized counterpart.\
    \ If another thread has already acquired the lock subsequent calls to `lock()`\
    \ pause the current thread until the lock has been unlocked. Only one thread can\
    \ hold the lock at any given time.\n\nLocks support various methods for fine grained\
    \ control as seen in the next sample:\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    ReentrantLock lock = new ReentrantLock();\n\nexecutor.submit(() -> {\n    lock.lock();\n\
    \    try {\n        sleep(1);\n    } finally {\n        lock.unlock();\n    }\n\
    });\n\nexecutor.submit(() -> {\n    System.out.println(\"Locked: \" + lock.isLocked());\n\
    \    System.out.println(\"Held by me: \" + lock.isHeldByCurrentThread());\n  \
    \  boolean locked = lock.tryLock();\n    System.out.println(\"Lock acquired: \"\
    \ + locked);\n});\n\nstop(executor);\n```\n\nWhile the first task holds the lock\
    \ for one second the second task obtains different information about the current\
    \ state of the lock:\n\n```\nLocked: true\nHeld by me: false\nLock acquired: false\n\
    ```\n\nThe method `tryLock()` as an alternative to `lock()` tries to acquire the\
    \ lock without pausing the current thread. The boolean result must be used to\
    \ check if the lock has actually been acquired before accessing any shared mutable\
    \ variables.\n\n### ReadWriteLock\n\nThe interface `ReadWriteLock` specifies another\
    \ type of lock maintaining a pair of locks for read and write access. The idea\
    \ behind read-write locks is that it's usually safe to read mutable variables\
    \ concurrently as long as nobody is writing to this variable. So the read-lock\
    \ can be held simultaneously by multiple threads as long as no threads hold the\
    \ write-lock. This can improve performance and throughput in case that reads are\
    \ more frequent than writes.\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    Map<String, String> map = new HashMap<>();\nReadWriteLock lock = new ReentrantReadWriteLock();\n\
    \nexecutor.submit(() -> {\n    lock.writeLock().lock();\n    try {\n        sleep(1);\n\
    \        map.put(\"foo\", \"bar\");\n    } finally {\n        lock.writeLock().unlock();\n\
    \    }\n});\n```\n\nThe above example first acquires a write-lock in order to\
    \ put a new value to the map after sleeping for one second. Before this task has\
    \ finished two other tasks are being submitted trying to read the entry from the\
    \ map and sleep for one second:\n\n```\nRunnable readTask = () -> {\n    lock.readLock().lock();\n\
    \    try {\n        System.out.println(map.get(\"foo\"));\n        sleep(1);\n\
    \    } finally {\n        lock.readLock().unlock();\n    }\n};\n\nexecutor.submit(readTask);\n\
    executor.submit(readTask);\n\nstop(executor);\n```\n\nWhen you execute this code\
    \ sample you'll notice that both read tasks have to wait the whole second until\
    \ the write task has finished. After the write lock has been released both read\
    \ tasks are executed in parallel and print the result simultaneously to the console.\
    \ They don't have to wait for each other to finish because read-locks can safely\
    \ be acquired concurrently as long as no write-lock is held by another thread.\n\
    \n### StampedLock\n\nJava 8 ships with a new kind of lock called `StampedLock`\
    \ which also support read and write locks just like in the example above. In contrast\
    \ to `ReadWriteLock` the locking methods of a `StampedLock` return a stamp represented\
    \ by a `long` value. You can use these stamps to either release a lock or to check\
    \ if the lock is still valid. Additionally stamped locks support another lock\
    \ mode called `optimistic locking`.\n\nLet's rewrite the last example code to\
    \ use `StampedLock` instead of `ReadWriteLock`:\n\n```\nExecutorService executor\
    \ = Executors.newFixedThreadPool(2);\nMap<String, String> map = new HashMap<>();\n\
    StampedLock lock = new StampedLock();\n\nexecutor.submit(() -> {\n    long stamp\
    \ = lock.writeLock();\n    try {\n        sleep(1);\n        map.put(\"foo\",\
    \ \"bar\");\n    } finally {\n        lock.unlockWrite(stamp);\n    }\n});\n\n\
    Runnable readTask = () -> {\n    long stamp = lock.readLock();\n    try {\n  \
    \      System.out.println(map.get(\"foo\"));\n        sleep(1);\n    } finally\
    \ {\n        lock.unlockRead(stamp);\n    }\n};\n\nexecutor.submit(readTask);\n\
    executor.submit(readTask);\n\nstop(executor);\n```\n\nObtaining a read or write\
    \ lock via `readLock()` or `writeLock()` returns a stamp which is later used for\
    \ unlocking within the finally block. Keep in mind that stamped locks don't implement\
    \ reentrant characteristics. Each call to lock returns a new stamp and blocks\
    \ if no lock is available even if the same thread already holds a lock. So you\
    \ have to pay particular attention not to run into deadlocks.\n\nJust like in\
    \ the previous `ReadWriteLock` example both read tasks have to wait until the\
    \ write lock has been released. Then both read tasks print to the console simultaneously\
    \ because multiple reads doesn't block each other as long as no write-lock is\
    \ held.\n\nThe next example demonstrates `optimistic locking`:\n\n```\nExecutorService\
    \ executor = Executors.newFixedThreadPool(2);\nStampedLock lock = new StampedLock();\n\
    \nexecutor.submit(() -> {\n    long stamp = lock.tryOptimisticRead();\n    try\
    \ {\n        System.out.println(\"Optimistic Lock Valid: \" + lock.validate(stamp));\n\
    \        sleep(1);\n        System.out.println(\"Optimistic Lock Valid: \" + lock.validate(stamp));\n\
    \        sleep(2);\n    } finally {\n        lock.unlock(stamp);\n    }\n});\n\
    \nexecutor.submit(() -> {\n    long stamp = lock.writeLock();\n    try {\n   \
    \     System.out.println(\"Write Lock acquired\");\n        sleep(2);\n    } finally\
    \ {\n        lock.unlock(stamp);\n        System.out.println(\"Write done\");\n\
    \    }\n});\n\nstop(executor);\n```\n\nAn optimistic read lock is acquired by\
    \ calling `tryOptimisticRead()` which always returns a stamp without blocking\
    \ the current thread, no matter if the lock is available. If there's already a\
    \ write lock active the returned stamp equals zero. You can always check if a\
    \ stamp is valid by calling `lock.validate(stamp)`.\n\nExecuting the above code\
    \ results in the following output:\n\n```\nOptimistic Lock Valid: true\nWrite\
    \ Lock acquired\nOptimistic Lock Valid: false\nWrite done\nOptimistic Lock Valid:\
    \ false\n```\n\nThe optimistic lock is valid right after acquiring the lock. In\
    \ contrast to normal read locks an optimistic lock doesn't prevent other threads\
    \ to obtain a write lock instantaneously. After sending the first thread to sleep\
    \ for one second the second thread obtains a write lock without waiting for the\
    \ optimistic read lock to be released. From this point the optimistic read lock\
    \ is no longer valid. Even when the write lock is released the optimistic read\
    \ locks stays invalid.\n\nSo when working with optimistic locks you have to validate\
    \ the lock every time after accessing any shared mutable variable to make sure\
    \ the read was still valid.\n\nSometimes it's useful to convert a read lock into\
    \ a write lock without unlocking and locking again. `StampedLock` provides the\
    \ method `tryConvertToWriteLock()` for that purpose as seen in the next sample:\n\
    \n```\nExecutorService executor = Executors.newFixedThreadPool(2);\nStampedLock\
    \ lock = new StampedLock();\n\nexecutor.submit(() -> {\n    long stamp = lock.readLock();\n\
    \    try {\n        if (count == 0) {\n            stamp = lock.tryConvertToWriteLock(stamp);\n\
    \            if (stamp == 0L) {\n                System.out.println(\"Could not\
    \ convert to write lock\");\n                stamp = lock.writeLock();\n     \
    \       }\n            count = 23;\n        }\n        System.out.println(count);\n\
    \    } finally {\n        lock.unlock(stamp);\n    }\n});\n\nstop(executor);\n\
    ```\n"
