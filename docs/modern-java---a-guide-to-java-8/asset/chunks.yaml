  trans: "\n在 Java 8 Streams 中已知的 `reduce()` 方法接受两个类型为 `BiFunction` 的 lambda 表达式。第一个函数将每个键值对转换为任意类型的单个值。第二个函数将所有这些转换后的值合并为一个单个结果，并忽略任何可能存在的\
    \ `null` 值。\n\n```java\nString result = map.reduce(1,\n    (key, value) -> {\n\
    \        System.out.println(\"Transform: \" + Thread.currentThread().getName());\n\
    \        return key + \"=\" + value;\n    },\n    (s1, s2) -> {\n        System.out.println(\"\
    Reduce: \" + Thread.currentThread().getName());\n        return s1 + \", \" +\
    \ s2;\n    });\n\nSystem.out.println(\"Result: \" + result);\n\n// Transform:\
    \ ForkJoinPool.commonPool-worker-2\n// Transform: main\n// Transform: ForkJoinPool.commonPool-worker-3\n\
    // Reduce: ForkJoinPool.commonPool-worker-3\n// Transform: main\n// Reduce: main\n\
    // Reduce: main\n// Result: r2=d2, c3=p0, han=solo, foo=bar\n```\n\n希望你喜欢这篇关于\
    \ Java 8 并发系列教程的第三部分。本教程中的代码示例[托管在 GitHub](https://github.com/winterbe/java8-tutorial)\
    \ 上，还有许多其他的 Java 8 代码片段。欢迎 fork 仓库并亲自尝试。\n\n如果你想支持我的工作，请将这篇教程分享给你的朋友。你还应该[在 Twitter\
    \ 上关注我](https://twitter.com/winterbe_)，因为我经常发布关于 Java 和编程相关的内容。\n\n*   第 1 部分：线程与执行器\n\
    *   第 2 部分：同步与锁\n*   第 3 部分：原子变量和 ConcurrentMap\n\n# 示例 Java 8 API：字符串、数字、数学与文件\n\
    \n2015 年 3 月 25 日\n\n大量的教程和文章涵盖了 Java 8 中最重要的变化，例如 lambda 表达式 和 函数式流。此外，许多现有的类在\
    \ JDK 8 API 中得到了增强，增加了实用的功能和方法。\n\n本文涵盖了 Java 8 API 中的一些较小变化——每个变化都通过易于理解的代码示例进行了描述。让我们深入查看字符串、数字、数学和文件。\n\
    \n## 切割字符串\n\n`String` 类提供了两个新方法：`join` 和 `chars`。第一个方法使用给定的分隔符将任意数量的字符串合并为一个字符串：\n\
    \n```java\nString.join(\":\", \"foobar\", \"foo\", \"bar\");\n// => foobar:foo:bar\n\
    ```\n\n第二个方法 `chars` 为字符串中的所有字符创建一个流，因此你可以对这些字符使用流操作：\n\n```java\n\"foobar:foo:bar\"\
    \n    .chars()\n    .distinct()\n    .mapToObj(c -> String.valueOf((char)c))\n\
    \    .sorted()\n    .collect(Collectors.joining());\n// => :abfor\n```\n\n不仅是字符串，正则表达式模式现在也受益于流。与其为每个字符将字符串拆分为流，我们可以按照任何模式拆分字符串并创建一个供处理的流，如示例所示：\n\
    \n```java\nPattern.compile(\":\")\n    .splitAsStream(\"foobar:foo:bar\")\n  \
    \  .filter(s -> s.contains(\"bar\"))\n    .sorted()\n    .collect(Collectors.joining(\"\
    :\"));\n// => bar:foobar\n```\n\n此外，正则表达式模式可以转换为谓词（predicate）。这些谓词例如可以用于过滤字符串流：\n\
    \n```java\nPattern pattern = Pattern.compile(\".*@gmail\\\\.com\");\nStream.of(\"\
    bob@gmail.com\", \"alice@hotmail.com\")\n    .filter(pattern.asPredicate())\n\
    \    .count();\n// => 1\n```\n\n上述模式接受任何以 `@gmail.com` 结尾的字符串，并用作 Java 8 `Predicate`\
    \ 来过滤电子邮件地址流。\n\n## 计算数字\n\nJava 8 增加了对无符号数字处理的支持。Java 中的数字一直是有符号的。以 `Integer`\
    \ 为例：\n\n一个 `int` 代表至多 2³² 个二进制位。Java 中的数字默认是有符号的，因此最后一个二进制位表示符号（0 = 正数，1 = 负数）。因此，最大的正有符号\
    \ `int` 从十进制零开始是 2³¹ - 1。\n\n你可以通过 `Integer.MAX_VALUE` 访问此值：\n\n```java\nSystem.out.println(Integer.MAX_VALUE);\
    \      // 2147483647\nSystem.out.println(Integer.MAX_VALUE + 1);  // -2147483648\n\
    ```\n\nJava 8 增加了解析无符号 int 支持。让我们看看它是如何工作的：\n\n```java\nlong maxUnsignedInt =\
    \ (1l << 32) - 1;\nString string = String.valueOf(maxUnsignedInt);\n```"
- fmt: "\nThe next example demonstrates how to find files in a directory or it's sub-directories.\n\
    \n```\nPath start = Paths.get(\"\");\nint maxDepth = 5;\ntry (Stream<Path> stream\
    \ = Files.find(start, maxDepth, (path, attr) ->\n        String.valueOf(path).endsWith(\"\
    .js\"))) {\n    String joined = stream\n        .sorted()\n        .map(String::valueOf)\n\
    \        .collect(Collectors.joining(\"; \"));\n    System.out.println(\"Found:\
    \ \" + joined);\n}\n```\n\nThe method `find` accepts three arguments: The directory\
    \ path `start` is the initial starting point and `maxDepth` defines the maximum\
    \ folder depth to be searched. The third argument is a matching predicate and\
    \ defines the search logic. In the above example we search for all JavaScript\
    \ files (filename ends with `.js`).\n\nWe can achieve the same behavior by utilizing\
    \ the method `Files.walk`. Instead of passing a search predicate this method just\
    \ walks over any file.\n\n```\nPath start = Paths.get(\"\");\nint maxDepth = 5;\n\
    try (Stream<Path> stream = Files.walk(start, maxDepth)) {\n    String joined =\
    \ stream\n        .map(String::valueOf)\n        .filter(path -> path.endsWith(\"\
    .js\"))\n        .sorted()\n        .collect(Collectors.joining(\"; \"));\n  \
    \  System.out.println(\"walk(): \" + joined);\n}\n```\n\nIn this example we use\
    \ the stream operation `filter` to achieve the same behavior as in the previous\
    \ example.\n\n## Reading and writing files\n\nReading text files into memory and\
    \ writing strings into a text file in Java 8 is finally a simple task. No messing\
    \ around with readers and writers. The method `Files.readAllLines` reads all lines\
    \ of a given file into a list of strings. You can simply modify this list and\
    \ write the lines into another file via `Files.write`:\n\n```\nList<String> lines\
    \ = Files.readAllLines(Paths.get(\"res/nashorn1.js\"));\nlines.add(\"print('foobar\"\
    );\");\nFiles.write(Paths.get(\"res/nashorn1-modified.js\"), lines);\n```\n\n\
    Please keep in mind that those methods are not very memory-efficient because the\
    \ whole file will be read into memory. The larger the file the more heap-size\
    \ will be used.\n\nAs an memory-efficient alternative you could use the method\
    \ `Files.lines`. Instead of reading all lines into memory at once, this method\
    \ reads and streams each line one by one via functional streams.\n\n```\ntry (Stream<String>\
    \ stream = Files.lines(Paths.get(\"res/nashorn1.js\"))) {\n    stream\n      \
    \  .filter(line -> line.contains(\"print\"))\n        .map(String::trim)\n   \
    \     .forEach(System.out::println);\n}\n```\n\nIf you need more fine-grained\
    \ control you instead construct a new buffered reader:\n\n```\nPath path = Paths.get(\"\
    res/nashorn1.js\");\ntry (BufferedReader reader = Files.newBufferedReader(path))\
    \ {\n    System.out.println(reader.readLine());\n}\n```\n\nOr in case you want\
    \ to write to a file simply construct buffered writer instead:\n\n```\nPath path\
    \ = Paths.get(\"res/output.js\");\ntry (BufferedWriter writer = Files.newBufferedWriter(path))\
    \ {\n    writer.write(\"print('Hello World');\");\n}\n```\n\nBuffered readers\
    \ also have access to functional streams. The method `lines` construct a functional\
    \ stream upon all lines denoted by buffered reader:\n\n```\nPath path = Paths.get(\"\
    res/nashorn1.js\");\ntry (BufferedReader reader = Files.newBufferedReader(path))\
    \ {\n    long countPrints = reader\n        .lines()\n        .filter(line ->\
    \ line.contains(\"print\"))\n        .count();\n    System.out.println(countPrints);\n\
    }\n```\n\nSo as you can see Java 8 provides three simple ways to read the lines\
    \ of text, making text handling quite convenient. Unfortunately you have to close\
    \ functional streams explicitly with try/with which makes the code still cluttered.\
    \ I would have expected that functional streams auto-close when calling terminal\
    \ operation like `count` or `collect` since you cannot call terminal operations\
    \ twice.\n\n# Avoiding Null Checks in Java 8\n\nMarch 15, 2015\n\nHow to prevent\
    \ the famous `NullPointerException` in Java? This is one of the key questions\
    \ every beginner will ask sooner or later. But also intermediate and expert programmers\
    \ get around this error every then. It's by far the most prevalent kind of error\
    \ in Java and many other languages as well.\n\n`Tony Hoare`, the inventor of the\
    \ null reference, apologized in 2009 and denotes this kind of errors as `billion-dollar\
    \ mistake`.\n\n> I call it my billion-dollar mistake. It was the invention of\
    \ the null reference in 1965. At that time, I was designing the first comprehensive\
    \ type system for references in an object oriented language (ALGOL). My goal was\
    \ to ensure that all use of references should be absolutely safe, with checking\
    \ performed by the compiler. But I couldn't resist the temptation to put in a\
    \ null reference, simply because it was easy to implement. This has led to innumerable\
    \ errors, vulnerabilities, and system crashes, which have probably caused a billion\
    \ dollars of pain and damage in the last forty years.\n\nAnyways, we have to deal\
    \ with it. So what can we do to prevent NullExceptions at all? Well the obvious\
    \ answer is to add null checks all around the place. Since null checks are kinda\
    \ cumbersome and painful many languages add special syntax for handling null checks\
    \ via `null coalescing operators` - also known as `elvis operator` in languages\
    \ like `Groovy` or `Kotlin`.\n\nUnfortunately Java doesn't provide such a syntactic\
    \ sugar. But luckily things get better in Java Version 8. This post describes\
    \ a couple of techniques how to prevent writing null checks by utilizing new features\
    \ of Java 8 like lambda expressions.\n\n### Improving Null Safety in Java 8\n\n\
    I've already shown in another post how we can utilize the `Optional` type of Java\
    \ 8 to prevent null checks. Here's the example code from the original post.\n\n\
    Assuming we have a hierarchical class structure like this:\n\n```\nclass Outer\
    \ {\n    Nested nested;\n    Nested getNested() {\n        return nested;\n  \
    \  }\n}\nclass Nested {\n    Inner inner;\n    Inner getInner() {\n        return\
    \ inner;\n    }\n}\nclass Inner {\n    String foo;\n    String getFoo() {\n  \
    \      return foo;\n    }\n}\n```\n\nResolving a deep nested path in this structure\
    \ can be kinda awkward. We have to write a bunch of null checks to make sure not\
    \ to raise a `NullPointerException`:\n\n```\nOuter outer = new Outer();\nif (outer\
    \ != null && outer.nested != null && outer.nested.inner != null) {\n    System.out.println(outer.nested.inner.foo);\n\
    }\n```\n\nWe can get rid of all those null checks by utilizing the Java 8 `Optional`\
    \ type. The method `map` accepts a lambda expression of type `Function` and automatically\
    \ wraps each function result into an `Optional`. That enables us to pipe multiple\
    \ `map` operations in a row. Null checks are automatically handled under the hood.\n\
    \n```\nOptional.of(new Outer())\n    .map(Outer::getNested)\n    .map(Nested::getInner)\n\
    \    .map(Inner::getFoo)\n    .ifPresent(System.out::println);\n```\n\nAn alternative\
    \ way to achieve the same behavior is by utilizing a supplier function to resolve\
    \ the nested path:\n\n```\nOuter obj = new Outer();\nresolve(() -> obj.getNested().getInner().getFoo());\n\
    \    .ifPresent(System.out::println);\n```\n\nCalling `obj.getNested().getInner().getFoo()`\
    \ might throw a `NullPointerException`. In this case the exception will be caught\
    \ and the method returns `Optional.empty()`.\n"
