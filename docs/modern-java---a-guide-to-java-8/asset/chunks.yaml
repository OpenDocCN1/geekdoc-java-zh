  trans: "\n锁可以通过 `lock()` 获取并通过 `unlock()` 释放。重要的是将代码封装在 `try/finally` 块中，以确保在发生异常时能够释放锁。该方法是线程安全的，与\
    \ `synchronized` 对应的方法一样。如果另一个线程已经获取了锁，后续对 `lock()` 的调用将暂停当前线程，直到锁被释放。在任何给定时刻，只有一个线程可以持有锁。\n\
    \n锁支持各种细粒度控制方法，如下一个示例所示：\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    ReentrantLock lock = new ReentrantLock();\n\nexecutor.submit(() -> {\n    lock.lock();\n\
    \    try {\n        sleep(1);\n    } finally {\n        lock.unlock();\n    }\n\
    });\n\nexecutor.submit(() -> {\n    System.out.println(\"Locked: \" + lock.isLocked());\n\
    \    System.out.println(\"Held by me: \" + lock.isHeldByCurrentThread());\n  \
    \  boolean locked = lock.tryLock();\n    System.out.println(\"Lock acquired: \"\
    \ + locked);\n});\n\nstop(executor);\n```\n\n当第一个任务持有锁一秒时，第二个任务获取了关于锁当前状态的不同信息：\n\
    \n```\nLocked: true\nHeld by me: false\nLock acquired: false\n```\n\n`tryLock()`\
    \ 方法作为 `lock()` 的替代方案，尝试在不暂停当前线程的情况下获取锁。在访问任何共享可变变量之前，必须使用布尔结果来检查是否已实际获取锁。\n\n\
    ### ReadWriteLock\n\n`ReadWriteLock` 接口指定了另一种类型的锁，它维护了一对用于读和写访问的锁。读写锁背后的思想是：只要没有人写入该变量，并发读取可变变量通常是安全的。因此，只要没有线程持有写锁，多个线程就可以同时持有读锁。在读取频率高于写入频率的情况下，这可以提高性能和吞吐量。\n\
    \n```\nExecutorService executor = Executors.newFixedThreadPool(2);\nMap<String,\
    \ String> map = new HashMap<>();\nReadWriteLock lock = new ReentrantReadWriteLock();\n\
    \nexecutor.submit(() -> {\n    lock.writeLock().lock();\n    try {\n        sleep(1);\n\
    \        map.put(\"foo\", \"bar\");\n    } finally {\n        lock.writeLock().unlock();\n\
    \    }\n});\n```\n\n上面的示例首先在睡眠一秒后获取写锁，以便向 map 中放入新值。在该任务完成之前，提交了另外两个任务，尝试从 map\
    \ 中读取项并睡眠一秒：\n\n```\nRunnable readTask = () -> {\n    lock.readLock().lock();\n\
    \    try {\n        System.out.println(map.get(\"foo\"));\n        sleep(1);\n\
    \    } finally {\n        lock.readLock().unlock();\n    }\n};\n\nexecutor.submit(readTask);\n\
    executor.submit(readTask);\n\nstop(executor);\n```\n\n当执执行此代码示例时，你会发现两个读任务都必须等待整个一秒，直到写任务完成。写锁释放后，两个读任务并行执行，并同时将结果打印到控制台。它们不需要等待对方完成，因为只要没有线程持有写锁，就可以安全地并发获取读锁。\n\
    \n### StampedLock\n\nJava 8 附带了一种名为 `StampedLock` 的新锁，它也像上面的示例一样支持读锁和写锁。与 `ReadWriteLock`\
    \ 不同，`StampedLock` 的锁定方法返回一个由 `long` 值表示的标记（stamp）。你可以使用这些标记来释放锁，或检查锁是否仍然有效。此外，带标记锁支持另一种被称为“乐观锁”（optimistic\
    \ locking）的锁模式。\n\n让我们重写上一个示例代码，使用 `StampedLock` 代替 `ReadWriteLock`：\n\n```\n\
    ExecutorService executor = Executors.newFixedThreadPool(2);\nMap<String, String>\
    \ map = new HashMap<>();\nStampedLock lock = new StampedLock();\n\nexecutor.submit(()\
    \ -> {\n    long stamp = lock.writeLock();\n    try {\n        sleep(1);\n   \
    \     map.put(\"foo\", \"bar\");\n    } finally {\n        lock.unlockWrite(stamp);\n\
    \    }\n});\n\nRunnable readTask = () -> {\n    long stamp = lock.readLock();\n\
    \    try {\n        System.out.println(map.get(\"foo\"));\n        sleep(1);\n\
    \    } finally {\n        lock.unlockRead(stamp);\n    }\n};\n\nexecutor.submit(readTask);\n\
    executor.submit(readTask);\n\nstop(executor);\n```\n\n通过 `readLock()` 或 `writeLock()`\
    \ 获取读锁或写锁会返回一个标记，随后在 `finally` 块中用于解锁。请记住，带标记锁没有实现重入性特性。每次调用锁方法都会返回一个新的标记，并且如果没有可用锁则会阻塞，即使同一线程已经持有了锁。因此，你必须特别注意不要遇到死锁。\n\
    \n与之前的 `ReadWriteLock` 示例一样，两个读任务都必须等待写锁被释放。然后，两个读任务同时打印到控制台上，因为只要没有持有写锁，多次读取就不会互相阻塞。\n\
    \n下一个示例演示了“乐观锁”：\n\n```\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    StampedLock lock = new StampedLock();\n\nexecutor.submit(() -> {\n    long stamp\
    \ = lock.tryOptimisticRead();\n    try {\n        System.out.println(\"Optimistic\
    \ Lock Valid: \" + lock.validate(stamp));\n        sleep(1);\n        System.out.println(\"\
    Optimistic Lock Valid: \" + lock.validate(stamp));\n        sleep(2);\n    } finally\
    \ {\n        lock.unlock(stamp);\n    }\n});\n\nexecutor.submit(() -> {\n    long\
    \ stamp = lock.writeLock();\n    try {\n        System.out.println(\"Write Lock\
    \ acquired\");\n        sleep(2);\n    } finally {\n        lock.unlock(stamp);\n\
    \        System.out.println(\"Write done\");\n    }\n});\n\nstop(executor);\n\
    ```\n\n乐观读锁通过调用 `tryOptimisticRead()` 获取，无论锁是否可用，它都不会阻塞当前线程。如果存在活跃的写锁，返回的标记等于零。你可以通过调用\
    \ `lock.validate(stamp)` 来检查标记是否有效。\n\n执行上述代码会导致如下输出：\n\n```\nOptimistic Lock\
    \ Valid: true\nWrite Lock acquired\nOptimistic Lock Valid: false\nWrite done\n\
    Optimistic Lock Valid: false\n```\n\n乐观锁在获取后是有效的。与普通读锁不同，乐观锁不会阻止线程立即获取写锁。在让第一个线程睡眠一秒后，第二个线程无需等待乐观读锁释放即可获取写锁。从该点开始，乐观读锁不再有效。即使写锁被释放，乐观读锁保持无效。\n\
    \n因此，在使用乐观锁时，在每次访问共享可变变量后都必须验证锁，以确保读取仍然有效。\n\n有时在不解锁并重新锁定的情况下将读锁转换为写锁是有用的。`StampedLock`\
    \ 提供了 `tryConvertToWriteLock()` 方法为此目的，如下一个示例所示：\n\n```\nExecutorService executor\
    \ = Executors.newFixedThreadPool(2);\nStampedLock lock = new StampedLock();\n\n\
    executor.submit(() -> {\n    long stamp = lock.readLock();\n    try {\n      \
    \  if (count == 0) {\n            stamp = lock.tryConvertToWriteLock(stamp);\n\
    \            if (stamp == 0L) {\n                System.out.println(\"Could not\
    \ convert to write lock\");\n                stamp = lock.writeLock();\n     \
    \       }\n            count = 23;\n        }\n        System.out.println(count);\n\
    \    } finally {\n        lock.unlock(stamp);\n    }\n});\n\nstop(executor);\n\
    ```\n"
- fmt: "\nThe task first obtains a read lock and prints the current value of field\
    \ `count` to the console. But if the current value is zero we want to assign a\
    \ new value of `23`. We first have to convert the read lock into a write lock\
    \ to not break potential concurrent access by other threads. Calling `tryConvertToWriteLock()`\
    \ doesn't block but may return a zero stamp indicating that no write lock is currently\
    \ available. In that case we call `writeLock()` to block the current thread until\
    \ a write lock is available.\n\n### Semaphores\n\nIn addition to locks the Concurrency\
    \ API also supports counting semaphores. Whereas locks usually grant exclusive\
    \ access to variables or resources, a `semaphore` is capable of maintaining whole\
    \ sets of permits. This is useful in different scenarios where you have to limit\
    \ the amount concurrent access to certain parts of your application.\n\nHere's\
    \ an example how to limit access to a long running task simulated by `sleep(5)`:\n\
    \n```\nExecutorService executor = Executors.newFixedThreadPool(10);\n\nSemaphore\
    \ semaphore = new Semaphore(5);\n\nRunnable longRunningTask = () -> {\n    boolean\
    \ permit = false;\n    try {\n        permit = semaphore.tryAcquire(1, TimeUnit.SECONDS);\n\
    \        if (permit) {\n            System.out.println(\"Semaphore acquired\"\
    );\n            sleep(5);\n        } else {\n            System.out.println(\"\
    Could not acquire semaphore\");\n        }\n    } catch (InterruptedException\
    \ e) {\n        throw new IllegalStateException(e);\n    } finally {\n       \
    \ if (permit) {\n            semaphore.release();\n        }\n    }\n}\n\nIntStream.range(0,\
    \ 10)\n    .forEach(i -> executor.submit(longRunningTask));\n\nstop(executor);\n\
    ```\n\nThe executor can potentially run 10 tasks concurrently but we use a semaphore\
    \ of size 5, thus limiting concurrent access to 5. It's important to use a `try/finally`\
    \ block to properly release the semaphore even in case of exceptions.\n\nExecuting\
    \ the above code results in the following output:\n\n```\nSemaphore acquired\n\
    Semaphore acquired\nSemaphore acquired\nSemaphore acquired\nSemaphore acquired\n\
    Could not acquire semaphore\nCould not acquire semaphore\nCould not acquire semaphore\n\
    Could not acquire semaphore\nCould not acquire semaphore\n```\n\nThe semaphores\
    \ permits access to the actual long running operation simulated by `sleep(5)`\
    \ up to a maximum of 5. Every subsequent call to `tryAcquire()` elapses the maximum\
    \ wait timeout of one second, resulting in the appropriate console output that\
    \ no semaphore could be acquired.\n\nThis was the second part out of a series\
    \ of concurrency tutorials. More parts will be released in the near future, so\
    \ stay tuned. As usual you find all code samples from this article on [GitHub](https://github.com/winterbe/java8-tutorial),\
    \ so feel free to fork the repo and try it by your own.\n\nI hope you've enjoyed\
    \ this article. If you have any further questions send me your feedback in the\
    \ comments below. You should also [follow me on Twitter](https://twitter.com/winterbe_)\
    \ for dev-related stuff!\n\n- Part 1: [Threads and Executors](posts/2015/04/07/java8-concurrency-tutorial-thread-executor-examples)\n\
    - Part 2: Synchronization and Locks\n- Part 3: [Atomic Variables and ConcurrentMap](posts/2015/05/22/java8-concurrency-tutorial-atomic-concurrent-map-examples)\n\
    \n# Java 8 Concurrency Tutorial: Atomic Variables and ConcurrentMap\n\nMay 22,\
    \ 2015\n\nWelcome to the third part of my tutorial series about multi-threaded\
    \ programming in Java 8. This tutorial covers two important parts of the Concurrency\
    \ API: Atomic Variables and Concurrent Maps. Both have been greatly improved with\
    \ the introduction of lambda expressions and functional programming in the latest\
    \ Java 8 release. All those new features are described with a bunch of easily\
    \ understood code samples. Enjoy!\n\n- Part 1: [Threads and Executors](posts/2015/04/07/java8-concurrency-tutorial-thread-executor-examples)\n\
    - Part 2: [Synchronization and Locks](posts/2015/04/30/java8-concurrency-tutorial-synchronized-locks-examples)\n\
    - Part 3: Atomic Variables and ConcurrentMap\n\nFor simplicity the code samples\
    \ of this tutorial make use of the two helper methods `sleep(seconds)` and `stop(executor)`\
    \ as defined [here](https://github.com/winterbe/java8-tutorial/blob/master/src/com/winterbe/java8/samples/concurrent/ConcurrentUtils.java).\n\
    \n### AtomicInteger\n\nThe package `java.concurrent.atomic` contains many useful\
    \ classes to perform atomic operations. An operation is atomic when you can safely\
    \ perform the operation in parallel on multiple threads without using the `synchronized`\
    \ keyword or locks as shown in my [previous tutorial](posts/2015/04/30/java8-concurrency-tutorial-synchronized-locks-examples).\n\
    \nInternally, the atomic classes make heavy use of [compare-and-swap](http://en.wikipedia.org/wiki/Compare-and-swap)\
    \ (CAS), an atomic instruction directly supported by most modern CPUs. Those instructions\
    \ usually are much faster than synchronizing via locks. So my advice is to prefer\
    \ atomic classes over locks in case you just have to change a single mutable variable\
    \ concurrently.\n\nNow let's pick one of the atomic classes for a few examples:\
    \ `AtomicInteger`\n\n```\nAtomicInteger atomicInt = new AtomicInteger(0);\n\n\
    ExecutorService executor = Executors.newFixedThreadPool(2);\n\nIntStream.range(0,\
    \ 1000)\n    .forEach(i -> executor.submit(atomicInt::incrementAndGet));\n\nstop(executor);\n\
    \nSystem.out.println(atomicInt.get());    // => 1000\n```\n\nBy using `AtomicInteger`\
    \ as a replacement for `Integer` we're able to increment the number concurrently\
    \ in a thread-safe manor without synchronizing the access to the variable. The\
    \ method `incrementAndGet()` is an atomic operation so we can safely call this\
    \ method from multiple threads.\n\nAtomicInteger supports various kinds of atomic\
    \ operations. The method `updateAndGet()` accepts a lambda expression in order\
    \ to perform arbitrary arithmetic operations upon the integer:\n\n```\nAtomicInteger\
    \ atomicInt = new AtomicInteger(0);\n\nExecutorService executor = Executors.newFixedThreadPool(2);\n\
    \nIntStream.range(0, 1000)\n    .forEach(i -> {\n        Runnable task = () ->\n\
    \            atomicInt.updateAndGet(n -> n + 2);\n        executor.submit(task);\n\
    \    });\n\nstop(executor);\n\nSystem.out.println(atomicInt.get());    // => 2000\n\
    ```\n\nThe method `accumulateAndGet()` accepts another kind of lambda expression\
    \ of `IntBinaryOperator`. We use this method to sum up all values from 0 to 1000\
    \ concurrently in the next sample:\n\n```\nAtomicInteger atomicInt = new AtomicInteger(0);\n\
    \nExecutorService executor = Executors.newFixedThreadPool(2);\n\nIntStream.range(0,\
    \ 1000)\n    .forEach(i -> {\n        Runnable task = () ->\n            atomicInt.accumulateAndGet(i,\
    \ (n, m) -> n + m);\n        executor.submit(task);\n    });\n\nstop(executor);\n\
    \nSystem.out.println(atomicInt.get());    // => 499500\n```\n\nOther useful atomic\
    \ classes are [AtomicBoolean](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicBoolean.html),\
    \ [AtomicLong](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicLong.html)\
    \ and [AtomicReference](https://docs.oracle.com/javase/8/docs/api/java/concurrent/atomic/AtomicReference.html).\n\
    \n### LongAdder\n\nThe class `LongAdder` as an alternative to `AtomicLong` can\
    \ be used to consecutively add values to a number.\n\n```\nExecutorService executor\
    \ = Executors.newFixedThreadPool(10);\n\nIntStream.range(0, 1000)\n    .forEach(i\
    \ -> executor.submit(adder::increment));\n\nstop(executor);\n\nSystem.out.println(adder.sumThenReset());\
    \   // => 1000\n```\n\nLongAdder provides methods `add()` and `increment()` just\
    \ like the atomic number classes and is also thread-safe. But instead of summing\
    \ up a single result this class maintains a set of variables internally to reduce\
    \ contention over threads. The actual result can be retrieved by calling `sum()`\
    \ or `sumThenReset()`.\n"
