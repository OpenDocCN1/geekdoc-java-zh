    \        return 123;\n    }\n    catch (InterruptedException e) {\n        throw\
    \ new IllegalStateException(\"task interrupted\", e);\n    }\n});\n\nfuture.get(1,\
    \ TimeUnit.SECONDS);\n```\n\nExecuting the above code results in a `TimeoutException`:\n\
    \n```\nException in thread \"main\" java.util.concurrent.TimeoutException\n  \
    \  at java.util.concurrent.FutureTask.get(FutureTask.java:205)\n```\n\nYou might\
    \ already have guessed why this exception is thrown: We specified a maximum wait\
    \ time of one second but the callable actually needs two seconds before returning\
    \ the result.\n\n#### InvokeAll\n\nExecutors support batch submitting of multiple\
    \ callables at once via `invokeAll()`. This method accepts a collection of callables\
    \ and returns a list of futures.\n\n```\nExecutorService executor = Executors.newWorkStealingPool();\n\
    \nList<Callable<String>> callables = Arrays.asList(\n        () -> \"task1\",\n\
    \        () -> \"task2\",\n        () -> \"task3\");\n\nexecutor.invokeAll(callables)\n\
    \    .stream()\n    .map(future -> {\n        try {\n            return future.get();\n\
    \        }\n        catch (Exception e) {\n            throw new IllegalStateException(e);\n\
    \        }\n    })\n    .forEach(System.out::println);\n```\n\nIn this example\
    \ we utilize Java 8 functional streams in order to process all futures returned\
    \ by the invocation of `invokeAll`. We first map each future to its return value\
    \ and then print each value to the console. If you're not yet familiar with streams\
    \ read my [Java 8 Stream Tutorial](posts/2014/07/31/java8-stream-tutorial-examples).\n\
    \n#### InvokeAny\n\nAnother way of batch-submitting callables is the method `invokeAny()`\
    \ which works slightly different to `invokeAll()`. Instead of returning future\
    \ objects this method blocks until the first callable terminates and returns the\
    \ result of that callable.\n\nIn order to test this behavior we use this helper\
    \ method to simulate callables with different durations. The method returns a\
    \ callable that sleeps for a certain amount of time until returning the given\
    \ result:\n\n```\nCallable<String> callable(String result, long sleepSeconds)\
    \ {\n    return () -> {\n        TimeUnit.SECONDS.sleep(sleepSeconds);\n     \
    \   return result;\n    };\n}\n```\n\nWe use this method to create a bunch of\
    \ callables with different durations from one to three seconds. Submitting those\
    \ callables to an executor via `invokeAny()` returns the string result of the\
    \ fastest callable - in that case task2:\n\n```\nExecutorService executor = Executors.newWorkStealingPool();\n\
    \nList<Callable<String>> callables = Arrays.asList(\n    callable(\"task1\", 2),\n\
    \    callable(\"task2\", 1),\n    callable(\"task3\", 3));\n\nString result =\
    \ executor.invokeAny(callables);\nSystem.out.println(result);\n\n// => task2\n\
    ```\n\nThe above example uses yet another type of executor created via `newWorkStealingPool()`.\
    \ This factory method is part of Java 8 and returns an executor of type `ForkJoinPool`\
    \ which works slightly different than normal executors. Instead of using a fixed\
    \ size thread-pool [ForkJoinPools](https://docs.oracle.com/javase/8/docs/api/java/util/concurrent/ForkJoinPool.html)\
    \ are created for a given parallelism size which per default is the number of\
    \ available cores of the hosts CPU.\n\nForkJoinPools exist since Java 7 and will\
    \ be covered in detail in a later tutorial of this series. Let's finish this tutorial\
    \ by taking a deeper look at scheduled executors.\n\n### Scheduled Executors\n\
    \nWe've already learned how to submit and run tasks once on an executor. In order\
    \ to periodically run common tasks multiple times, we can utilize scheduled thread\
    \ pools.\n\nA `ScheduledExecutorService` is capable of scheduling tasks to run\
    \ either periodically or once after a certain amount of time has elapsed.\n\n\
    This code sample schedules a task to run after an initial delay of three seconds\
    \ has passed:\n\n```\nScheduledExecutorService executor = Executors.newScheduledThreadPool(1);\n\
    \nRunnable task = () -> System.out.println(\"Scheduling: \" + System.nanoTime());\n\
    ScheduledFuture<?> future = executor.schedule(task, 3, TimeUnit.SECONDS);\n\n\
    TimeUnit.MILLISECONDS.sleep(1337);\n\nlong remainingDelay = future.getDelay(TimeUnit.MILLISECONDS);\n\
    System.out.printf(\"Remaining Delay: %sms\", remainingDelay);\n```\n\nScheduling\
    \ a task produces a specialized future of type `ScheduledFuture` which - in addition\
    \ to `Future` - provides the method `getDelay()` to retrieve the remaining delay.\
    \ After this delay has elapsed the task will be executed concurrently.\n\nIn order\
    \ to schedule tasks to be executed periodically, executors provide the two methods\
    \ `scheduleAtFixedRate()` and `scheduleWithFixedDelay()`. The first method is\
    \ capable of executing tasks with a fixed time rate, e.g. once every second as\
    \ demonstrated in this example:"
