    \ furthermore many existing classes have been enhanced in the [JDK 8 API](posts/2014/03/29/jdk8-api-explorer)\
    \ with useful features and methods.\n\nThis article covers some of those smaller\
    \ changes in the Java 8 API - each described with easily understood code samples.\
    \ Let's take a deeper look into Strings, Numbers, Math and Files.\n\n## Slicing\
    \ Strings\n\nTwo new methods are available on the `String` class: `join` and `chars`.\
    \ The first method joins any number of strings into a single string with the given\
    \ delimiter:\n\n```\nString.join(\":\", \"foobar\", \"foo\", \"bar\");\n// =>\
    \ foobar:foo:bar\n```\n\nThe second method `chars` creates a stream for all characters\
    \ of the string, so you can use stream operations upon those characters:\n\n```\n\
    \"foobar:foo:bar\"\n    .chars()\n    .distinct()\n    .mapToObj(c -> String.valueOf((char)c))\n\
    \    .sorted()\n    .collect(Collectors.joining());\n// => :abfor\n```\n\nNot\
    \ only strings but also regex patterns now benefit from streams. Instead of splitting\
    \ strings into streams for each character we can split strings for any pattern\
    \ and create a stream to work upon as shown in this example:\n\n```\nPattern.compile(\"\
    :\")\n    .splitAsStream(\"foobar:foo:bar\")\n    .filter(s -> s.contains(\"bar\"\
    ))\n    .sorted()\n    .collect(Collectors.joining(\":\"));\n// => bar:foobar\n\
    ```\n\nAdditionally regex patterns can be converted into predicates. Those predicates\
    \ can for example be used to filter a stream of strings:\n\n```\nPattern pattern\
    \ = Pattern.compile(\".*@gmail\\\\.com\");\nStream.of(\"bob@gmail.com\", \"alice@hotmail.com\"\
    )\n    .filter(pattern.asPredicate())\n    .count();\n// => 1\n```\n\nThe pattern\
    \ accepts any string which ends with `@gmail.com` and is then used as a Java 8\
    \ `Predicate` to filter a stream of email addresses.\n\n## Crunching Numbers\n\
    \nJava 8 adds additional support for working with unsigned numbers. Numbers in\
    \ Java had always been signed. Let's look at `Integer` for example:\n\nAn `int`\
    \ represents a maximum of 2³² binary digits. Numbers in Java are per default signed,\
    \ so the last binary digit represents the sign (0 = positive, 1 = negative). Thus\
    \ the maximum positive signed `int` is 2³¹ - 1 starting with the decimal zero.\n\
    \nYou can access this value via `Integer.MAX_VALUE`:\n\n```\nSystem.out.println(Integer.MAX_VALUE);\
    \      // 2147483647\nSystem.out.println(Integer.MAX_VALUE + 1);  // -2147483648\n\
    ```\n\nJava 8 adds support for parsing unsigned ints. Let's see how this works:\n\
    \n```\nlong maxUnsignedInt = (1l << 32) - 1;\nString string = String.valueOf(maxUnsignedInt);\n\
    ```\n\n## Do Math\n\nThe `Math` class has been enhanced with methods that handle\
    \ overflows. These methods throw an `ArithmeticException` if the result overflows\
    \ the primitive type. \n\n```java\ntry {\n    int result = Math.addExact(Integer.MAX_VALUE,\
    \ 1);\n} catch (ArithmeticException e) {\n    System.out.println(\"Overflow occurred!\"\
    );\n}\n```\n\nSimilarly, there are `subtractExact`, `multiplyExact`, `divideExact`,\
    \ and `floorExact` methods.\n\n## Working with Files\n\nThe utility class `Files`\
    \ was first introduced in Java 7 as part of NIO. The JDK 8 API adds a couple of\
    \ additional methods which enables us to use functional streams with files.\n\n\
    ### Listing files\n\nThe method `Files.list` streams all paths for a given directory,\
    \ so we can use stream operations like `filter` and `sorted` upon the contents\
    \ of the file system.\n\n```java\ntry (Stream<Path> stream = Files.list(Paths.get(\"\
    \"))) {\n    String joined = stream\n        .map(String::valueOf)\n        .filter(path\
    \ -> !path.startsWith(\".\"))\n        .sorted()\n        .collect(Collectors.joining(\"\
    ; \"));\n    System.out.println(\"List: \" + joined);\n}\n```\n"
