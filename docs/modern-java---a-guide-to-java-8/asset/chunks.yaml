    \            return p1;\n        });\n\nSystem.out.format(\"name=%s; age=%s\"\
    , result.name, result.age);\n// name=MaxPeterPamelaDavid; age=76\n```\n\nThe third\
    \ `reduce` method accepts three parameters: an identity value, a `BiFunction`\
    \ accumulator and a combiner function of type `BinaryOperator`. Since the identity\
    \ values type is not restricted to the `Person` type, we can utilize this reduction\
    \ to determine the sum of ages from all persons:\n\n```\nInteger ageSum = persons\n\
    \    .stream()\n    .reduce(0, (sum, p) -> sum += p.age, (sum1, sum2) -> sum1\
    \ + sum2);\n\nSystem.out.println(ageSum);  // 76\n```\n\nAs you can see the result\
    \ is *76*, but what's happening exactly under the hood? Let's extend the above\
    \ code by some debug output:\n\n```\nInteger ageSum = persons\n    .stream()\n\
    \    .reduce(0,\n        (sum, p) -> {\n            System.out.format(\"accumulator:\
    \ sum=%s; person=%s\\n\", sum, p);\n            return sum += p.age;\n       \
    \ },\n        (sum1, sum2) -> {\n            System.out.format(\"combiner: sum1=%s;\
    \ sum2=%s\\n\", sum1, sum2);\n            return sum1 + sum2;\n        });\n\n\
    // accumulator: sum=0; person=Max\n// accumulator: sum=18; person=Peter\n// accumulator:\
    \ sum=41; person=Pamela\n// accumulator: sum=64; person=David\n```\n\nAs you can\
    \ see the accumulator function does all the work. It first get called with the\
    \ initial identity value *0* and the first person *Max*. In the next three steps\
    \ `sum` continually increases by the age of the last steps person up to a total\
    \ age of *76*.\n\nWait wat? The combiner never gets called? Executing the same\
    \ stream in parallel will lift the secret:\n\n```\nInteger ageSum = persons\n\
    \    .parallelStream()\n    .reduce(0,\n        (sum, p) -> {\n            System.out.format(\"\
    accumulator: sum=%s; person=%s\\n\", sum, p);\n            return sum += p.age;\n\
    \        },\n        (sum1, sum2) -> {\n            System.out.format(\"combiner:\
    \ sum1=%s; sum2=%s\\n\", sum1, sum2);\n            return sum1 + sum2;\n     \
    \   });\n\n// accumulator: sum=0; person=Pamela\n// accumulator: sum=0; person=David\n\
    // accumulator: sum=0; person=Max\n// accumulator: sum=0; person=Peter\n// combiner:\
    \ sum1=18; sum2=23\n// combiner: sum1=23; sum2=12\n// combiner: sum1=41; sum2=35\n\
    ```\n\nExecuting this stream in parallel results in an entirely different execution\
    \ behavior. Now the combiner is actually called. Since the accumulator is called\
    \ in parallel, the combiner is needed to sum up the separate accumulated values.\n\
    \nLet's dive deeper into parallel streams in the next chapter.\n\n### Parallel\
    \ Streams"
