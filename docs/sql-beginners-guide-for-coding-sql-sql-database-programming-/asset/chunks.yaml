    ```sql

    SELECTVALUESFROMTABLENAME;

    ```


    上面的示例是一个 SQL 语句的通用示例，稍后我将对其逐一进行介绍。


    请注意，在语句中需要断言的值集或变量取决于你正尝试执行的命令。所有这些变量都跟在命令之后出现在语句中。


    ## 值的命名


    正如我之前所说的，SQL 语句是由 SQL 规范中的单词和用户创建的名称组成的。这意味着，对如键（keys）、表名、列名等值进行命名在 SQL 中是非常重要的。


    在 SQL 中，对事物命名没有绝对的规则。人们有自己命名变量的方法，但为了保持一致性，我建议你遵循我在本书中使用的方法。以下是我将在本书中实施的两个命名规则：


    - 所有的表名都必须是单数形式（例如：`person`、`email`、`phone`、`user` 等）。

    -   列名在数据库中不应重复。


    有些人更倾向于使用复数名称作为表名。这并不是错误。尽管如此，使用单数形式表名让我感到更舒服。至于列名，总会有两个或多个来自不同表的列具有相同名称的情况。因此，我的做法是为每个列命名唯一的名称以消除歧义。例如，与其在
    `user` 表和 `email` 表中将 `ID` 作为主键的列名；我更愿意使用 `user_ID` 和 `email_ID` 作为列名。


    你还应该注意，SQL 中的名称是有作用域的。这意味着数据库本身必须有一个名称。数据库中的表必须有名称。每个表内部的列也必须命名。调用表时，其名称必须通过数据库名并使用点（`.`）分隔名称来进行作用域限定。因此，它们在
    SQL 语句中被断言时将如下：


    - `数据库.表`

    - `表.列`


    ## 在 SQL 中创建数据


    我并不打算教你如何从零创建一个数据库。作为初学者，你们的任务应该只围绕向已有的数据库添加或更新值展开。然而，我感觉到你们中的某些人仍然渴望学习 SQL，以便创建包括数据库本身在内的整个应用程序。因此，我将介绍
    SQL 的这部分，但仅足以帮助你快速上手。


    创建新数据库的 SQL 关键字是语句 `CREATE DATABASE`，它属于 ANSI 规范。假设你想为人的联系电话创建一个新数据库，并将此新数据库命名为
    `Contacts`。以下是操作方法：


    ```sql

    CREATE DATABASE Contact;

    ```


    为了对该数据库进行操作，你需要先使用它。我们需要的关键字是 `USE DATABASE` 命令。这是我们的执行方式：


    ```sql

    USE DATABASE Contact;

    ```


    如果你想在 `Contact` 数据库中创建一个表，那么你需要执行的就是 `CREATE TABLE` 命令，以下是操作方法：


    ```sql

    CREATE TABLE Contacts.User (…);

    ```


    之后，你现在就可以所有的列名、类型和定义。


    ### 数据类型


    数据类型很重要，因为它们遵循列的限制。每个列都有一个关于可以在其中存储什么种类型数据的规则。


    以下是一些主要数据类型及其简短描述。


    | 数据类型 |  |

    | :--- | :--- |

    | `CHARACTER` | 用于定义列中允许的字符数。不多也不少。 |

    | `CHARACTER VARYING` | 用于定义列中允许的最大字符数。可以少于但不能超过该特定值。 |

    | `BINARY` | 用于将列专门用于十六进制数据。 |

    | `SMALLINT` | 用于存储范围内的数值数据。 |

    | `INTEGER` | 用于存储整数数据。 |

    | `BIGINT` | 用于存储大整数数据。 |

    | `BOOLEAN` | 用于存储布尔值。 |

    | `DECIMAL` | 用于存储精确精度的数值数据。 |

    | `FLOAT` | 用于存储浮点数。 |

    | `REAL` | 用于存储单精度浮点数。 |

    | `DATE` | 用于存储日期。 |

    | `TIME` | 用于存储时间。 |

    | `TIMESTAMP` | 用于存储时间戳。 |

    | `CHAR` | 用于固定长度字符。 |

    | `DATETIME` | 用于存储日期时间。 |

    | `TEXT` | 用于存储长文本数据。 |

    | `BLOB` | 用于存储大二进制对象。 |

