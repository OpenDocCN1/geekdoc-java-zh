    ## SELECT Command Anatomy


    You should have learned by now that we have the SQL keyword `SELECT` which is
    a command to get specific data from our database. After the `SELECT` keyword,
    what should follow is the list of items we want from database. We call it the
    “select list”. If the select list only contains variables, then you can simply
    write the statement in this manner:


    ```sql

    SELECT ‘Variable'',''Variable’;

    ```


    Most of the time, the select list contains the names of the columns. When it does,
    it is important to define which table can find these columns. This is where the
    `FROM` command comes in.


    For instance, our select list contains User (column A) and Email (column B) and
    we can find these columns inside the table named as Contact. In order to define
    which table to look for, we should include the `FROM` command by doing this.


    ```sql

    SELECT Email FROM Contact

    ```


    But, what if I have a lot of columns in the table and I want to select all, you
    ask? Well, this is where the power of the asterisk (`*`) comes in. This is known
    as the wildcard symbol in SQL statement. To select all columns inside a table,
    you need to execute a statement in this format.


    ```sql

    SELECT * FROM Table

    ```


    As you can see, the wildcard symbol comes after the `SELECT` command. Now this
    is useful when selecting all the columns. If you do not need to select all the
    columns, then using the wildcard symbol may become dangerous and inefficient.


    There are different ways to quickly assert multiple columns in an SQL statement
    depending upon the platform that you are using. I personally recommend that you
    avoid the wildcard command since the inefficient use of this syntax may also break
    applications.


