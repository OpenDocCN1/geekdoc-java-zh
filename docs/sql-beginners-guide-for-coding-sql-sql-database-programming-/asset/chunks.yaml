    are looking for the list of owner names that can be found under the “owner” column
    of our table. Typing it with the use of the generic format will give you this.


    | SELECTtelecommunication.ownerFROMtelecommunication; |


    Why do we need to type the table name before the column name in our format above?
    This is because we must qualify the column by using the table name. Furthermore,
    this will save you from name collisions in the future if there will be columns
    with similar names. I suggest you make this a habit.


    Going back to the topic, doing so is too much of inconvenience. We can shorten
    the table name by assigning an alias in the FROM clause. Here’s the format.'
