- fmt: '

    Columns are also categorized by being required and not required. A required column
    means that every row in the table must have a data which corresponds to what the
    column requires. A not required column, on the other hand, means that we can assert
    a `NULL` value for each row under that column. As you go through `SQL`, you will
    find that `NULL` has a lot uses in database programming.


    The primary point of using rows is to have retrievable data and containers where
    you can store data. Why do we store data? Simply because we want to get that data
    again in the future and we simply want a place for it to stay for the mean time.
    Hence, the core idea of a database.


    # Keys


    One of the vital elements of a relational database are keys. We now know that
    a table has several columns and each column has names. Each column has related
    properties as well. One of these properties that we can assert in a column is
    a key.


    In a relational database, we always assign a primary key for each row. This special
    type of key is used to uniquely determine a specific row. This means that the
    value of that key must remain unique and must not have any duplicates within the
    table. If, and only if, there is another table which contains that key in our
    relation model; then, we may merge those two tables together.


    When merging two tables, there will always be primary keys that have no duplicates.
    Upon merging, you will notice that there will be a new column in the table with
    these keys. These keys are now known as the Foreign keys. They serve as links
    to the primary keys of the second table, allowing you to conveniently link rows
    from two separated tables.


    Aside from primary keys and foreign keys, we also have the natural keys. Natural
    keys are global. This means that you cannot change them since they are used all
    over the globe to identify a single entity. Published books, for instance, always
    have natural keys which we know as `ISBN`. Each published book has its own unique
    `ISBN` which you need to use as primary keys when handling relational database
    for books. This is different when handling databases with unnatural keys like
    emails, people, where you need to invent your own primary keys for each row.


    Let us use a database for people and their contact numbers as an example. We cannot
    consider the name as the primary key. We cannot consider the person’s phone number
    as the primary key as well. This is because it is possible that there are two
    or more people in the globe that have the same contact number, first name, or
    even last name. Hence, we should create the primary key ourselves. This is where
    the identity column comes in.


    The identity column serves as an auto-incrementing column that continues to generate
    unique keys as we add data in the table. The key combination does not matter since
    what we only need is a unique key for every identity in our database.


    # Chapter 2 – Examples of Relational Models


    Since I have been using the people’s database in the previous chapter, I will
    now give to you a contacts database as a perfect example of a relational model.


    A simple database for contacts typically looks like this:


    | First Name | Last Name | Email Address |

    | John | Doe | johndoe@email.com |

    | Mae | Lee | maelee@email.com |


    In this table, we have three columns that are looking for specific data. The first
    column requests for the first name. The second for the last name and the third
    for the email address of the person.


    Our rows, excluding the first row, refers to a single entity. The row for our
    first entity refers to the person with the name John Doe and his email is johndoe@email.com.
    The row for our second entity refers to Mae Lee with an email address of maelee@email.com.


    This is an example of a database with two entities divided by three columns.


    Let us say that John Doe has two email addresses while Mae Lee has three. Some
    people will end up adding columns to add the additional data. Hence, the table
    will end up like this.


    | First Name | Last Name | Email 1 | Email 2 | Email 3 |

    | John | Doe | johndoe@... | johndoe2@... | NULL |

    | Mae | Lee | maelee@... | maelee2@... | maelee3@... |


    There is a problem here if we use this kind of database design. First, what if
    the problem we have at hand is to find how many email address each person has?
    It is quite difficult and cumbersome to get the answer we need. This is the disadvantage
    in using a column-base database. The second problem is that we will end up with
    a lot of `NULL` values for those people that only have one email address. Third,
    this design is not practical and you do not need to be a database specialist to
    realize that.


    In order to address these three issues, here is how we can do it.


    | Key | First Name | Last Name |

    | 1 | John | Doe |

    | 2 | Mae | Lee |


    The first step is to create a table for the entity first. In this table, we assigned
    the first column for the primary keys. The second step is to create another table
    where we can store the values for these people’s email addresses. The second table
    will look like this.


    | Key | Person’s Key | Email Address |

    | 1 | 1 | johndoe@email.com |

    | 2 | 1 | johndoe2@email.com |

    | 3 | 2 | maelee@email.com |

    | 4 | 2 | maelee2@email.com |

    | 5 | 2 | maelee3@email.com |


    In this table, you will see that there are two columns for the keys. The first
    column refers to the primary key designated to each email address. The second
    column refers to the foreign keys from our first table. This is an example of
    a one-to-many relational model.


    In this model, we are able to organize the data in the most practical way possible.
    It is now easier for us to answer a query on how many emails each person has as
    well. This method is known as Normalization.


    There are different ways to design your database and efficient designs depend
    on what queries you are trying to answer.


    With all that being said, you are now ready to meet SQL.


    # Chapter 3 – SQL Statements


    SQL is a specific database language. We use this language to create statements.
    These statements are made up of valid words. Some of the words should be defined
    by SQL while some of the words should be defined by you. Some words you will be
    asserting in these statements are table names, column names, and variables or
    data that is inside your tables.


    ## SQL Facts


    Before we proceed, I would like to show you some important facts about SQL.


    The first thing you need to know about SQL is that it is readable since it is
    written in the English language. In other words, it is easier to learn SQL more
    than any other programming languages.


    Second is that you can do a lot more using SQL. This is in contrast with most
    people’s impressions that SQL is only used for data queries. This is wrong.


    Third is that a valid SQL statement should end with a semi-colon (`;`). Although
    some people will tell you that it is no longer needed, I suggest adding it in
    your queries because it is part of the ANSI standard. Furthermore, it works fine
    with both old and modern databases. Semi-colons allow you to conveniently assert
    multiple statements together in what we call a batch. This method works even with
    modern databases.


    The fourth is that SQL is not case-sensitive. You can put your variables in both
    lower and upper cases. Both ways will work out just fine in the structured query
    language. One good way to practice this is to assert SQL-specific keywords in
    uppercases and user-defined keywords in lowercases. This will allow you to efficiently
    and quickly identify the different keywords within a statement.


    ## SQL Commands


    It is important to keep in mind that all SQL statements begin with a command.
    The command is typically a verb to signify what the database needs to do. One
    good example of a command used in SQL statements is `SELECT`.


    The `SELECT` command tells the database to select a set of data. As you can see,
    it is an English-based word and pretty much obvious of what the system will do.
    This is how the command looks like when used in an SQL statement.

    '
