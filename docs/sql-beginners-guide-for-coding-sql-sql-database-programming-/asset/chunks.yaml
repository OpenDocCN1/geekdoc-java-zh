    | `SELECT [TABLE_NAME_ALIAS].[COLUMN_NAME] FROM [TABLE_NAME] [TABLE_NAME_ALIAS];`
    |


    Using the owner column and telecommunication table, our new statement will look
    like this.


    | `SELECTt.ownerFROMtelecommunication t;` |


    As you can see, I assigned the letter “`t`” to be the alias of the table name.
    This is easier to write than repeating the complete name over and over again.
    Keep in mind that it is not necessary to use the first character of your table
    name as an alias. You can assign any alias to the table name and it can also be
    a combination of characters. Just make sure that you are consistent with the alias
    you use.


    ## Limiting The Results


    Whenever you execute a `SELECT` query, the database will give you all the rows
    under the column you specified. This means that if your table has 20, 000 rows,
    then it will return 20, 000 values to answer your statement.


    There are two ways to address this issue. One is to assert additional clause after
    the `FROM` clause. The other is by adding the `DISTINCT` qualifier before the
    select list. This shown in this format.


    | `SELECT DISTINCT [SELECT LIST] FROM [TABLE_NAME];` |


    This format will only give you distinct values in return instead of providing
    you with all the values under the specified column. This is the perfect way to
    have all the unique values under that column. For example, you have a table for
    your contacts and some entities were asserted in several rows because they own
    multiple phone numbers.


    Relying on the generic format will give you duplicated results. This is not efficient
    if you only want to know who are your contacts, right? Using the `DISTINCT` qualifier
    will prevent you from receiving multiple rows for the same entity.


    Here is our telecommunication table which has the column for owners and another
    column for the telecom company.


    | Key | Owner | Company |

    |---|---|---|

    | 1 | Jean Grey | AT&T |

    | 2 | Luke Skywalker | Comcast |

    | 3 | Mae Lee | AT&T |

    | 4 | Stan Lee | AT&T |


    Let us say we want to find the list of telecom companies in our database. Using
    the generic format will give us three results for AT&T which is unnecessary. With
    the `DISTINCT` qualifier, however, we will get only two results – one for Comcast
    and another for AT&T which is what we really need.


    Aside from `DISTINCT` qualifier, you can add the `WHERE` clause after the `FROM`
    clause to limit the results as well. The `WHERE` clause serves as a search engine
    with higher precision. This is done by using the following format.


    | `SELECT [SELECT LIST] FROM [TABLE_NAME] WHERE [EXPRESSION];` |


    To give you a simple example, let us use another table for people’s first and
    last names. Let us name this table “`person`”.


    | Key | First | Last |

    |---|---|---|

    | 1 | Lee | Mortis |

    | 2 | Mae | Lee |

    | 3 | John | Doe |

    | 4 | Stan | Lee |

    | 5 | Bruce | Lee |


    Let us say imagine that this is our database for our customers and we would like
    to know how many customers do we have that have Lee as their family name. In order
    to do that, we need to the execute the `WHERE` clause command.


    | `SELECTp.lastFROMperson p WHEREp.last = ‘Lee’;` |


    This will address the database to look specifically under the last name column
    and merely focus on rows with Lee value under that column. It will ignore the
    rows with no Lee value under that column. In other words, you will only get the
    rows of your customers that have Lee as their last names.


    The secret in understanding the `WHERE` clause is by taking note of the different
    operators you can use for `WHERE` expressions. These operators are similar to
    mathematical operators. This means that it is easy to remember them. In contrast
    with mathematics, the operators we use here also works for non-numerical data
    such as the equal (`=`) sign we have used in our `WHERE` clause above. Here is
    the list of the simple operators that you can use for the `WHERE` clause.


    | Operators | Name & Description |

    |---|---|

    | `=` | Equal to – gives TRUE value if data on both sides are equal to one another.
    |

    | `<>` | Not equal to – gives TRUE value if data on both sides are not equal to
    one another. |

    | `>` | Greater than – gives TRUE value if data on the left side is greater than
    the data on the right side. |

    | `<` | Less than – gives TRUE value if data on the left side is less than the
    data on the right side. |

    | `>=` | Greater than or equal to – gives TRUE value if the data on the left is
    either greater than or equal to the data on the right. |

    | `<=` | Less than or equal to – gives TRUE value if the data on the left is either
    less than or equal to the data on the right. |


    These are the operators that will give you Boolean values when handling `WHERE`
    clauses for your SQL queries.


    # Conclusion


    At this point, you are now familiar how relational databases work and how efficient
    SQL in querying data from databases that utilize relational models.


    It is important to take note how to designate restrictions to columns and how
    to call them specifically using `SELECT` statements. You have also learned that
    SQL statements contain both SQL-defined keywords and user-defined keywords. These
    keywords are not case sensitive, but organizing and writing the statements in
    a visual-friendly manner is highly recommended. Doing so will not only give you
    convenience when viewing your SQL coding but other people as well. This is a best
    practice if you are working with a team.


    It is also significant to qualify column names using table names when writing
    `SELECT` statements. This will prevent future issues when there are different
    tables with similar column names. You just learned how to shorten the table names
    using an alias.


    You can also specify data extraction of the `SELECT` statement by using clauses
    such as `FROM`. Using the `FROM` clause allows you to specify which table to look
    at whenever your SQL statement looks for columns. Aside from that, `FROM` clause
    also allows you to assign an alias for the table name.


    You also learned how to limit the number of answered values with the use of `DISTINCT`
    qualifier and the `WHERE` clause. Keep in mind that you have to avoid using the
    wildcard symbol since it is an inefficient way to extract data from your database.
    The `WHERE` clause, on the other hand, is a powerful command that you need to
    master as a beginner. Familiarize the different operators and try them out on
    an already built database.


    I am aware that this book is basic, but it is enough to prepare you in moving
    forward to advanced studies in the structured query language. As a beginner, there
    is no need for you to rush immediately on how to create your own database. It
    is important to learn which database model does SQL functions first. By understanding
    the relational model, you will easily grasp the concept of SQL together with the
    statements that you can do using this language.


    If you want to continue learning about SQL, then I suggest that you take advantage
    of the book’s sequel where you will be introduced to deeper clauses of `SELECT`
    statements. The second part also tackles about `JOINS`, handling data, and table
    creation


    Thank you for reading. I hope you enjoy it. I ask you to leave your honest feedback.

