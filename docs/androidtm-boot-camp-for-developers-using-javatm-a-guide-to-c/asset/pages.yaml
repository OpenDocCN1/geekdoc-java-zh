  md: '# CHAPTER 2 Simplify! The Android User Interface


    Android categorizes device screens using two general properties: size and density.
    You should expect that your app will be installed on devices with screens that
    vary in both size and density. Android creates a drawable resource for any of
    these images when you save them in the res/drawable folder. Android projects have
    multiple drawable folders that are named after the resolution of the device. The
    five drawable folders are identified with the dpi (dots per inch) densities shown
    in Table 2-3. To declare layouts and images for different sized screens, you must
    place these additional resources in separate directories, similar to how you do
    for different languages. Android automatically scales your to properly fit the
    screen. An app developer can create images designed specifically for different
    sized screens that look crisp and clear without any scaling or blurring. For example,
    a high-resolution image can be designed specifically for a xhdpi folder. By using
    appropriate images, you can achieve the best graphical quality and performance
    on all screen densities. In this text for brevity, one image will be placed in
    the generic drawable folder for testing purposes.


    | Name | Description |

    |---|---|n| drawable | Generic resources for any screen |

    | xxdpi | Resources for extra, high-density screens |

    | xhdpi | Resources for extra high-density screens |

    | hdpi | Resources for high-density screens |

    | mdpi | Resources for medium-density screens |

    | ldpi | Resources for low-density screens |

    | **Table 2-3** | Drawable folders |


