  md: '# CHAPTER 2 Simplify! The Android User Interface


    Before a mobile app can be coded using Java, it must be designed. Designing a
    program can be compared with constructing a building. Before cement slabs are
    poured, steel beams are in place, and walls are erected, architects and engineers
    must design the building to ensure it will perform as reliable and safe. The same
    holds true for a computer app developer. Once the program is designed within the
    user interface, it can be implemented through the use of Extensible Markup Language
    (XML) and Java code to perform the functions for which it was designed.


    # Designing an Android App


    To illustrate the process of designing and implementing an Android app, in this
    chapter you will design and code the Healthy Recipes app shown in Figure 2-1 and
    Figure 2-2.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_61_0.png)


