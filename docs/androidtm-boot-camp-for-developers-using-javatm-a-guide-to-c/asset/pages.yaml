  md: 'Android devices come in many shapes and sizes, as shown in Figure 1-2. The
    Android OS powers all types of mobile devices, including smartphones, tablets,
    netbooks, watches, MP4 players, automobiles, and Internet TVs. Android devices
    are available with a variety of screen modes where the width and height are spontaneously
    reversed depending on the orientation of the device. As you design Android, the
    screen affects the layout of the interface. To take full advantage of the capabilities
    of a particular device, you need to design user interfaces specifically for that.
    For example, a smartphone and a tablet not only have a different physical size,
    but also different screen resolutions and pixel densities which change the development
    process. As you develop an Android App, you can test the results on an emulator,
    which duplicates how the app looks and feels on a particular device. The Android
    emulator mimics all of the hardware and software features of a typical mobile
    device, except that it cannot place actual calls. You can change the Android emulators
    to simulate the layout of a smartphone with a 4.5-inch screen or a tablet with
    a larger screen, both with high-density graphics. Android automatically scales
    content to the screen size of the device you choose, but if you use low-quality
    graphics in an app, the result is often a poorly pixled display. As a developer,
    you need to continue to update your app as the market shifts to different platforms
    and screen resolutions.


    The Android market has many more variety and size options than the 4-inch to 5.5-inch
    screen options of an iPhone. Several Android phones such as the Galaxy, Android,
    and Nexus offer four inches or larger. This extra space is excellent for users
    who watch movies, play games, or view full web pages on their phone. In addition,
    many types of tablets, also called slates, run on the Android platform. Popular
    models of Android tablets include the Google Nexus, Samsung Galaxy, Amazon Kindle,
    and LG Pad. The Android tablets are in direct competition with other tablets and
    slate computers such as the iPad (various generations) and Windows tablets.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_32_0.png)


    Figure 1-3 Android tablet'
