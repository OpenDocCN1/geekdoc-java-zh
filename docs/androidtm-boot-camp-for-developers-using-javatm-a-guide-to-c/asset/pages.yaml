  md: 'To display the current system date when the DatePicker control opens, you use
    the YEAR, MONTH, and DAY_OF_MONTH variables to access the system date.


    To create a DatePickerDialog instance, you must create OnDateListener() method
    to allow user interaction. If you include a control, such as a Button, to display
    a calendar, use the OnClickListener method to implement the Button. The onClick
    method responds to your action, so use the code to launch the DatePicker dialog
    in your method.


    When a dialog box containing a DatePicker appears, you can select a date and tap
    a Button control. Trapping the Button invokes an OnDateListener in DatePickerDialog,
    which passes integers representing the year, month, and day from the DatePicker
    into OnDataSet. The selected date can then be displayed in a TextView control
    using setText using the getTime() .


    # Key Terms


    **Calendar class**—A class you can use to access the Android system date. The
    Calendar class is responsible for converting a Date object and a set of integer
    fields as YEAR, MONTH, and DAY_OF_MONTH.


    **DAY_OF_MONTH**—A date constant of the Calendar class that retrieves an integer
    value of the system''s current day.


    **DAY_OF_YEAR**—A date constant of the Calendar class that retrieves the day of
    the current year as an integer. For example, February 1 is day 32 of the year.


    **emulated application**—An application that is converted in real to run on a
    variety of platforms such as a webpage, which can be displayed on various screen
    sizes through a browser.


    **get**—The field manipulation method that accesses the system date or time.


    **getInstance**—A method of the Calendar class that returns a calendar date or
    time based on the system settings.


    **getTime()**—A method of the Calendar class that returns the time value in the
    Date object.


    **MONTH**—A date constant of the Calendar class that retrieves an integer value
    of the system''s current month.


    **native application**—A program locally installed on a specific platform such
    as a phone or tablet.


    **onDataSet**—A method that automatically obtains the date selected by the user.


    **padding property**—A property that you can use to offset the content of a control
    by a specific number of pixels.


    **set**—A method that changes the system date or time.'
