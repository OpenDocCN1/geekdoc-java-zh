    | Table 5-1 | Attraction array with index values |


    In Table 5-1, an array named attraction has five attractions. Each attraction
    is stored in an array element, and each element is assigned a unique index. The
    first string is stored in the element with the index of 0. The element is identified
    by the term Attraction(0), pronounced "attraction sub zero."


    # Declaring an Array


    Like declarations for variables of other types, an array declaration has two components:
    the array''s data type and the array''s name. An array is a container that holds
    a fixed number of values of a single type. You can declare an array containing
    numerical values as in the following examples:


    ```

    int[] age={18, 21, 38, 88};

    double[] weather={72.3, 65.0, 25.7, 99.5};

    char[] initials={''P'', ''N'', ''D''};

    ```


    Declare a String array containing the text used in the chapter project with the
    following code:


    # Code Syntax


    ```

    String[] attraction=("Art Institute of Chicago", "Magnificent Mile", "Willis Tower",
    "Water Tower");

    ```


    The array initialized in the array can be expanded to include more items at time.
    To assign the listing of attractions to the String type in an array named attraction,
    follow these steps:


