    # Toast Validation


    In the chapter project, it is important to confirm the number entered by the user
    is not a typo or other type of mistake. If a value greater than 500 is entered
    for the conversion from pounds to kilograms or greater than 225 for the conversion
    from kilograms to pounds, the user should be notified and for a valid entry. To
    alert the user that an incorrect value was entered, a message called toast notification
    (or toast message) can appear on the screen.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_184_0.png)


    # Toast Notification


    **Toast notification** communicates messages to the user. These messages pop up
    as an overlay on the user''s current screen, often displaying a validation message.
    For example, a weather application may display a toast notification if a user
    is turned a tornado warning. An instant messaging app might display a toast notification
    stating that a text message has been sent. In the chapter project, a toast notification
    displays a message warning the user that an invalid number was entered. A toast
    message only fills the amount of space required to be displayed while the user''s
    current activity remains visible and interactive. The notification animation fades
    in and out on the screen.


    The toast notification code uses Toast object and the MakeText() method with three
    parameters: the context (displays the activity name), the text message, and the
    duration of the interval that the toast is displayed (LENGTH_SHORT or LENGTH_LONG).
    To display the toast notification, a show() method displays the Toast object.


    # Code Syntax


    ```

    Toast toast = Toast.makeText(context, text, duration).show();

    ```


    The message is used for short messages. If the user enters an invalid number into
    the Medical Calculator, a warning toast notification fades in and out on the screen.
    Notice in the following syntax that the text notification displays *Pounds must
    be less than 500*.


    # Code Syntax


    ```

    Toast.makeText(MainActivity.this,"Pounds must be less than 500",

    Toast.LENGTH_LONG).show();

    ```


    GTK


    An ex-Microsoft employee of Google is credited with coined the term toast, which
    is a small notification window that slides up view, like popping out of a toaster.


