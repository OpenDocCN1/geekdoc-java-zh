    +   * After the super.onCreate(savedInstanceState); statement in MainActivity.java,
    insert a new line.

    * Type String[] attraction=("Art Institute of Chicago", "Magnificent Mile", "Willis
    Tower", "Navy Pier", "Water Tower");


    The array named attraction is assigned the five attractions (Figure 5-8).'
