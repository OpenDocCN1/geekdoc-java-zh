  md: 'Welcome to the beginning of your journey in creating Android phone applications
    and developing for the mobile device market. Mobile computing has become the most
    popular way to make a personal connection to the Internet. Mobile phones and tablets
    comprise the fastest growing category of technology in the world. Mobile phone
    usage has quickly outgrown the simple expectation of voice calls and text messaging.
    An average data plan for a mobile device, often called a smartphone, typically
    includes browsing the web, playing games such as Candy Crush or With Friends,
    using applications, checking email, listening to music, recording video, and mapping
    locations with GPS (global positioning system).


    When purchasing a smartphone, you can choose from many mobile operating systems
    (OSs), including the iOS for the iPhone, Google Android, and Microsoft Phone.
    Recently, the Android phone has become the sales leader, outselling its competitors.
    The Android market is exploding with more than a million new activations of Android
    phones per day and over one billion total activations of Android devices now used
    worldwide. Android users download more than 1.5 billion apps and games from Google
    Play each month. Nearly 73 percent of the world’s mobile devices run on the Android
    platform. About 12.7 percent of the world’s mobile devices run on the iOS platform.


    # IN TRENCHES


    More than one-third of all U.S. households have canceled their landlines for the
    convenience of handling one bill from a mobile carrier.


    Creating mobile applications, called apps, for the Android phone market is an
    exciting job opportunity. Whether you are a developer for a technology firm that
    creates professional apps for corporations or a hobbyist who creates games, niche
    programs, or savvy new applications, the Android marketplace provides a new means
    to earn income.


    # GTK


    According to U.S. News & World Report, an App Developer is considered the top
    job in the technology field, earning a median salary of $90,060.


    # Meet the Android


    The Android phone is built on a free operating system primarily created by a company
    called Android, Inc. In 2005, Google obtained Android, to start a venture in the
    mobile phone market. Google integrated the Android platform to be open source,
    the Android code was released under the Apache license, which permits anyone to
    download the full open-source Android code for free. Two years later, Google unveiled
    its first open-standards mobile'
