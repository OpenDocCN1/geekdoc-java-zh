  md: '# Life and Death of an Activity


    In Line 15 of Aloha Music app, as shown in Figure 6-11, the SplashActivity begins
    its life in the Activity life cycle with the onCreate() method. Each Activity
    has a life cycle, which is the series of actions from the beginning of an Activity
    to its death. Actions that occur during the life cycle provides ways to manage
    how users interact with your app. Each Activity in this begins with an onCreate()
    method. The onCreate() method initializes the user interface with XML layout;
    the life of the Activity is started. In any life cycle, the opposite of birth
    is death. In this case, the onDestroy() method is the end of the Activity. The
    onCreate() and onDestroy() sets up all the resources required to perform the Activity.
    The life cycle of the SplashActivity begins with onCreate() and destroys your
    mobile device. Other actions can take place during the life of the Activity. For
    example, when the scheduled timer starts (Line 26 in Figure 6-11), the SplashActivity
    is paused. If you open multiple apps on a smartphone and receive a phone call,
    you must either pause or terminate the other apps to secure enough available memory
    to respond to the incoming call. The life cycle between onCreate() and onDestroy(),
    you use methods such as onRestart(), onStart(), onResume(), onPause(), and onStop().
    Each of these methods changes the state of the Activity. The four states of Activity
    are active, paused, stopped, or dead. Life cycle of application affects how an
    app works and how the different parts are being orchestrated. Table 6-2 shows
    the development of an Activity throughout its life cycle.


    | Method | Description |

    | --- | --- |

    | onCreate() | The onCreate() method begins each Activity. This method also provides
    a Bundle containing the Activity''s previously frozen state, if it had. |

    | onRestart() | If the Activity is stopped, onRestart() begins each Activity.
    If this happens it indicates your Activity is being replayed to the user from
    a stopped state. The onRestart() method is always followed by onStart(). |

    | onStart() | If the Activity is hidden, onStart() makes it visible. |

    | onResume() | The onResume() method is called when the user begins interacting
    with the Activity. The onResume() method is always followed by onPause(). |

    | onPause() | This is called when an Activity is about to recover. |

    | onStop() | This method hides the Activity. |

    | onDestroy() | This method destroys the Activity. Typically, the finish() method
    (part of the onDestroy() method) is used to declare that the Activity is finished;
    when the next Activity is called, it releases all resources from the first Activity
    |


    Methods used in the life cycle of Activity


    When an Activity is launched using onCreate(), the app performs the actions in
    the Activity. In other words, the Activity becomes the top sheet of a stack of
    papers. The methods shown in Table 6-2 are used between the onCreate() and onDestroy()
    methods, which shuffle the order of the packs in that stack. When onDestroy()
    is called, imagine that'
