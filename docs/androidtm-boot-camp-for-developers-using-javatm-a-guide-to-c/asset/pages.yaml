  md: 'to develop this app, you create and set up a splash screen, learn about the
    Activity life cycle, pause an Activity, and start, play, stop, and resume music
    playback.


    **Chapter 7** demonstrates how to use an Android layout called a GridView, which
    shows thumbnail images in a scrolling grid. When the user taps or clicks a thumbnail,
    the app displays a larger image below the grid. You also learn how to use an array
    to manage the images.


    **Chapter 8**, you design a calendar program that includes a DatePicker for selecting
    a date to book reservation. Because this app is designed for a larger tablet interface,
    you also learn how to design an app for a tablet device and add an Android Virtual
    View specifically designed for tablets.


    **Chapter 9** continues to explore Android apps designed for tablet devices. In
    this chapter, you create a multipane interface, with list of options in the left
    pane, and details about the selected option in the right pane. Each pane displays
    a different layout and Activity. To create the multipane interface, work with
    the Master/Detail Flow template.


    **Chapter 10** explains how to create two types of animation. Using a frame-by-frame
    animation, you animate a series of images so they play in sequence. Using a motion
    animation, you apply animation to a single image


    **Chapter 11** shows you how to create an Android app that requests data, stores
    it, and then modifies data to produce a result throughout multiple activities.
    You learn about the ways Android apps can save persistent data, and use one—the
    SharedPreferences class—to store data for an airline''s customer rewards


    **Chapter 12**, you learn how to publish an Android app to the Google Play Store.
    Before publishing the app, you test it, prepare it for publication, create a package
    and digitally sign the app, and prepare promotional materials.


    # Features of the Book


    Android Boot Camp for Developers Using Java, Third Edition, includes the following
    features:


    +   **Objectives**—Each chapter contains a list of objectives as an overview of
    the topics discussed in the chapter and as a useful aid.


    +   **GTKs, In the Trenches, and Critical Thinking**—GTK stands for Good to Know.
    These notes offer tips about Android devices, Android apps, and the Android development
    tools. In the Trenches features provide programming advice and practical solutions
    to typical programming problems. The Critical Thinking features pose thought-provoking
    questions and provide answers to programming and Java.


    +   **Figures and tables**—The chapters contain a wealth of screen shots to guide
    you as you create Android apps and learn about the Android marketplace. In addition,
    many tables are included to give you an-a-glance summary of useful information.


    +   **Step-by-step tutorials**—Starting in Chapter 1, you create complete, Android
    apps by performing the series of hands-on tutorials that you learn through the
    development process.


