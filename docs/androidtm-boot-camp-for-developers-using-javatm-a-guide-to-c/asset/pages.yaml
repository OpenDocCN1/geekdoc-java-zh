    # Wrap It Up—Chapter Summary


    In this chapter, you have learned to declare variables and write arithmetic operations.
    In the chapter project, you used new controls as the Text Field to enter text
    and the Spinner control to select multiple items. You used the GetText() and SetText()
    methods to extract and display data. An Android theme was also applied to the
    application.


    +   * You can assign a theme to an activity or entire application to define its
    appearance and style and to prevent each Android app you develop from looking
    too similar.


    +   * Preview a theme by tapping or clicking the App button in the emulator, and
    then selecting a theme. To change the theme permanently in the application, define
    the theme in the strings.xml file for each activity.


    +   * Use Text Fields to request input from users, who can enter characters using
    an on-screen keyboard or a physical keyboard. You need to select the correct type
    of Text Field control for the type of data you are requesting.


    +   * The strings.xml file is part of every Android application by default and
    contains strings used in the application, as text displayed in a TextView, Spinner,
    or Button control. You can edit a string in strings.xml to update the text wherever
    it is used in the application. Strings strings can also include prompt text that
    provides instructions in a Spinner control. In the Java code, use the GetSelectedItem()
    method to return the text of the selected item.


    +   * To guide users enter the correct data in a Text Field, use the control''s
    hint property to display light-colored text, also called a watermark, describing
    what to enter. The user clicks to remove the hint and type the requested input.


    +   * To handle the input that users enter into a Text Field, use the EditText
    control, which extracts the text and converts it in the Java code. The extracted
    text must be assigned to a variable, which holds data during the execution of
    the program. To extract the text entered in an EditText control, use the GetText()
    method. To display the extracted text in a TextView, use the SetText() method.'
