  md: "# GTK\n\nGoogle created an Android Design website (http://developer.android.com/design)\
    \ to assist in best practices and to set a uniform look and feel across the various\
    \ Android platforms.\n\n# Designing a Table Layout\n\nIn the Sailing Adventures\
    \ application, two layouts are combined in activity_main.xml to organize the table\
    \ interface controls. The Linear layout and the Table layout create a simple,\
    \ clean interface on the table containing both rows and columns. The left column\
    \ described in Table 8-1 uses the Linear layout to display the sail.png image.\
    \ On the right side of Table 8-1, four rows are inserted in a Table layout to\
    \ display the title, description, button, and reservation result. (Figure 8-3\
    \ shows this with all the design elements.)\n\n| | Title |\n|---|---|n| sail.png\
    \ | Day trip description |\n| | Reservation button |\n| | Display date after selection\
    \ |\n| **Table 8** | Table for Linear layout |\n\nA user design layout named TableLayout\
    \ is composed of TableRow controls—one each row in your activity_main.xml. In\
    \ Table 8-1, the layout consists of four rows and one column. The contents of\
    \ TableRow are the controls that will go in each cell of the table grid. The TableLayout\
    \ is shown in the following code four TableRow controls with either a TextView\
    \ or Button control within each row within a LinearLayout:\n\n# Code Syntax\n\n\
    ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
    http://schemas.android.com/apk/res/android\">\n  <ImageView />\n  <TableRow>\n\
    \    <TextView />\n  </TableRow>\n  <TableRow>\n    <TextView />\n  </TableRow>\n\
    \  <TableRow>\n    <Button />\n  </TableRow>\n  <TableRow>\n    <TextView />\n\
    \  </TableRow>\n</LinearLayout>\n</LinearLayout>\n```"
