    # # Adding a String Array


    The TextView, Spinner, Button, and ImageView controls each reference an individual
    string of text assigned in the strings.xml file, but if a control holds multiple
    text strings, it is best to use a **string array** that defines a string resource
    of related items in a central location within strings.xml. In the Concert Tickets
    app, the user can select one of three performance groups: Life Revealed, Spatial
    Sense, and Zig Zag. Each of the three concert groups is an **item** within the
    string array. An item defines an individual entry within a string array. You place
    the text items representing the performance groups in strings.xml as a string
    array resource tied together within one array name. You can populate a control
    with a string array by adding XML code in strings.xml.


    Android Studio has a considerable amount of built-in XML syntax and Java programming
    methods that you can use to complete your code. As you type the editor offers
    suggestions in a panel that can complete the statement. Figure 3-14 shows the
    editor suggesting possibilities for the string-array statement in the strings.xml
    window. By selecting the second suggestion in Figure 3-14 and then pressing Ctrl+enter,
    you add the correct syntax to the statement. As you type Java code, Android Studio
    refines and adds suggestions where appropriate. If a suggestion is not displayed
    automatically, you can manually press Ctrl+space to invoke possible code completion
    suggestions. All code begins with a less than (< symbol and ends with a greater
    than (>) symbol. To add a string to the strings.xml file to represent the three
