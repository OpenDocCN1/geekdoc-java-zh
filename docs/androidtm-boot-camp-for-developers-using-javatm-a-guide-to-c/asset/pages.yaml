  md: '# CHAPTER 6 Jam! Implementing Audio in Android Apps


    Playing music on a smartphone is one of the primary uses of a mobile device, especially
    as MP3 players are losing popularity. The most common phone activities include
    texting, talking, gaming, and playing music. Talking and texting continue to remain
    communication channels, a growing proportion of users take advantage of apps,
    games, and multimedia on their phones. The principal specification when purchasing
    a smartphone is typically the ebook and amount of memory. Consumers often purchase
    a phone with more memory so they can store music.


    To demonstrate how to play music through an Android built-in media player, the
    Chapter 6 project is named Aloha Music and opens with an image and the text "Sounds
    of Hawaii." This opening screen (Figure 6-1), also called a splash screen, is
    displayed for approximately five seconds, and then the automatically opens the
    second window. The Aloha Music application (Figure 6-2) plays two songs that feature
    different instruments: Ukulele, a small guitar that originated in Hawaii; and
    Drums. If the user selects the first button, the Ukulele plays until the user
    selects the first button again to pause the Ukulele. If the user selects the second
    button, the Drums play until the user selects the second button again. The emulator
    plays the music through your computer''s speakers.


