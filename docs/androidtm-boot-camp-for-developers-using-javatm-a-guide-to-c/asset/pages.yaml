  md: '# Preparing Promotional Materials to Upload


    In the Angry Birds Android app, a high-resolution application icon is displayed
    near the top of the page. The application icon does not replace your launcher
    icon, but serves to identify and brand your app. The size of the application icon
    should be 512 × 512 pixels and stored in a PNG file. In addition, Google Play
    requires a minimum of two screenshots of the app to display in the Details section
    of your app on the Google Play. Large images (typically in the PNG format), also
    those of the Angry Birds game (Figure 12-12) are displayed in any of the following
    dimensions: 480 × 320, 800 × 480, or 854 × 480 pixels. You can upload up to seven
    screenshots for the app. The screenshots appear before a written description.
    You can also display a video to demo with your app, though Google Play does not
    require one. As an alternative, you can upload with your app a link to your demo
    video on YouTube. The short video should highlight the top features of your app
    and last between 30 seconds and 2 minutes. Remember that these visual elements
    are the first impression potential users of your app. Quality media helps improve
    an app’s marketability.


    467


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_494_0.png)


    # Providing a Description


    In addition to the promotional media items, an app description provides a quick
    overview of the purpose of the app and what it does. To intrigue your readers,
    you can include some of the features your application provides and explain why
    your app is unique in comparison with other competitors without mentioning their
    names. The description needs to sell your app to the widest audience possible.
    The description of the Angry Birds Rio in Figure 12-13 appeals to a gaming audience
    searching for a new Angry Birds experience. Notice the Angry Birds Rio description
    highlights the features and benefits of the app using and concise language. A
    good description is written to motivate users to download the app. Revise the
    description with each update of your app, adding information such as new features
    and user reviews. In Figure 12-13, notice the review section and the ratings.
    If you show the down, you can also display the date of update, current version,
    Android platform requirement, category, size, price, and content rating. Users
    search for the most popular apps as measured by their ratings. Prospective app
    buyers read reviews to determine if your app is worth their time and money. When
    a visitor writes a good review about your application, you can quote the review
    within your description. Customers value good reviews and are more likely to download
    your app if it has any of them.


