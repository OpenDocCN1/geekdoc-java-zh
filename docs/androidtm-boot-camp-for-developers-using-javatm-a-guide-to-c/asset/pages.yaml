  md: '# Features of the Android


    As a developer, you must understand a phone''s capabilities. The Android platform
    offers a wide variety of features that apps can use. Some features vary by model.
    Most Android phones provide the features listed in Table 1-1.


    | Feature | Description |

    | --- | --- |

    | 3-D graphics | The interface can support 3-D graphics for a 3-D interactive
    experience or 3-D image rendering. |

    | Facial recognition | Android provides this high-level feature for automatically
    identifying or verifying a person''s face from a digital image or a video frame.
    |

    | Front- and rear-facing camera | Android phones can use either a front or rear-facing
    camera, allowing developers to create applications using video calling. |

    | Multiple language support | Android supports multiple human languages. |

    | On-screen keyboard | The on-screen keyboard offers suggestions for spelling
    corrections as well as options for completing words you are starting. The on-screen
    keyboard also supports input. |

    | Power management | Android identifies processes running in the background using
    memory and processor resources. You can close these apps to free the phone''s
    processor memory, extending the battery power. For optimized gaming, Android supports
    the use of a gyroscope, gravity and barometric sensors, linear acceleration, and
    rotation vector, which provide game developers highly sensitive and responsive
    controls. |

    | Voice-based recognition | Android recognizes voices for calling, texting, and
    navigating with the phone. |

    | WiFi tethering | Android supports tethering, which allows a phone to be used
    as a wireless or wired hotspot that other devices can use to connect to the Internet.
    |


    Table 1-1 Android platform features


    # Writing Android Apps


    Android apps are written using the Java programming language. Java is a language
    and a platform originated by Sun Systems. Java is an object-oriented programming
    language patterned after the C++ language. Object-oriented programming encourages
    good software engineering practices such as code reuse. The official tool for
    Android development, released in December 2014, is Android Studio, an integrated
    development environment (IDE) for building and integrating development tools and
    open-source projects. Studio IDE is exclusively dedicated to the purpose of creating
    Android applications. Prior to Android Studio, Eclipse ADT was the primary Android
    development environment. Eclipse developed applications in many programming languages,
    including Java, C, C++, COBOL, Ada, and Python.'
