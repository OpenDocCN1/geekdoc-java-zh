    the following code syntax:


    # Code Syntax


    ```

    final SharedPreferences sharedPref = PreferenceManager.

    getDefaultShSharedPreferences(this);

    SharedPreferences.Editor editor = sharedPref.edit();

    editor.putInt("key1", intYears);

    editor.putInt("key2", intLoan);

    editor.putFloat("key3", decInterest);

    editor.commit();

    ```


    In the first line, a valid SharedPreferences object is instantiated. Next, a SharedPreferences
    provides a method to add, modify, or delete preference content. Within the editor,
    you can also remove a specific preference by using the remove() method or remove
    all preferences in the set using the clear() method. The two putInt and one putFloat
    methods are not called immediately. The commit() method must be called to actually
    write the values to the XML file. Save values as persistent data using SharedPreferences
