  md: '# CHAPTER 1 Voila! Meet the Android


    # Opening Android Studio to Create a New Project


    To create a new Project, you first open Android Studio. A message may appear that
    updates are available for Android Studio. Install the updates to confirm that
    you have the latest version of Android Studio. As you create your first project,
    you provide the following information:


    +   * Application name—This is the human-readable title for your application,
    which will appear on the Android device.


    +   * Company domain—This uniquely identifies your app in Google Play. Developers
    typically use a company''s name. For example, the domain name of this book is
    androidbootstrap.net.


    +   * Package name—This package namespace is where your source code will reside.
    Android Studio creates the package name by reversing the entity domain, inserting
    a period, and then adding the application name. The package name must be unique
    when posted in Google Play. The package name would be net.androidboot.HelloWorld
    in this example.


    +   * Project location—This location identifies the directory on your hard drive
    or USB drive where you store the files related to this Android project.


    +   * Form factor—This value reflects the form used to display the app. Form factors
    include the screen size and the type of devices such as a phone, tablet, TV, wearable
    (watch), and Google Glass.


    +   * Minimum SDK—This value specifies the minimum application programming interface
    (API) level required by your application


    +   * Add an activity to mobile—This selection determines the activity that the
    Android device will use. An activity is similar to a window or screen that opens
    when you launch an app. Creating an activity is optional, but an activity is always
    used as the basis for an application.


    +   * Activity name—Use the name for the class that is generated by the plug-in.
    This will be a subclass of Android’s Activity class. An activity can run and work,
    such as creating a user interface.


    # Creating the Hello World Project


    A project is equivalent to a single program or app using Java in Android Studio.
    Be sure you have a blank USB (Universal Serial Bus) drive plugged into your computer
    so you can store the Android project on this USB drive. To create a new Android
    project, follow these steps:


    # STEP 1


    +   * Open the Android Studio program.


    The Android Studio dialog box opens the Welcome to Android Studio page (Figure
    1-6). If you already have a project open, tap or click File on menu bar and tap
    New Project.'
