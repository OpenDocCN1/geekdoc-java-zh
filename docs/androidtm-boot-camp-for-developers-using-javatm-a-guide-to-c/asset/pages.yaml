  md: '# Changing the Color of Android Controls


    Thus far, each application in this text used the default color of black or white
    for the text color based on the theme for each Android control. The Android platform
    uses a color system called hexadecimal codes to display different colors. A hexadecimal
    color code is a triplet of three colors. Colors are specified by a pound sign
    followed by how much red (00 to FF), how much green (00 to FF) and how much blue
    (00 to FF) are in the final color. For example, the hexadecimal color of #FF0000
    is a true red. The TextView and RadioGroup controls in the chapter project have
    red text, which you designate by typing #FF0000 as the color property. To look
    up these color codes, search for hexadecimal color codes in a search engine or
    refer to #html-color-codes.com. If you tap or click the ellipsis button on the
    textColor property, the Resources dialog box shown in Figure 4-15 appears. On
    the Color tab, you can select any color within the circle or enter RGB (Red, Green,
    Blue) or hexadecimal values.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_170_0.png)


    Figure 4-15 Color tab in the Resources dialog box'
