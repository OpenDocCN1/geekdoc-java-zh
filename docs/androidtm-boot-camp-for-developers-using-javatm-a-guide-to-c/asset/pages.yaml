    # Adding a Text Field


    In the Concert Tickets application, a single screen opens when the application
    runs, with a Number Text Field requesting the number of concert tickets desired.
    One way to name a Text Field is to use the id property in the Properties pane
    to enter a name that begins with the prefix text, which represents a text field
    in the code. The Java code uses the id property to refer to the widget. A descriptive
    variable name as txtTickets can turn an unreadable piece of code into one that
    is well documented and easy to debug.


    # Using the String Table


    The string items that are displayed in the controls this app will not be typed
    directly in the Properties pane, but instead in a string array in the res/values
    folder. In the Concert Tickets app, the first TextView displays the Text Ticket
    Vault, and the Button control displays the FIND COST. You also need to prompt
    users to enter text and display a description of the concert image shown on the
    screen. You add the names of groups performing at the concert later steps using
    XML code. To add the Key and Default value for Text Field, Button, and ImageView
    controls to the strings.xml file, follow these steps.


