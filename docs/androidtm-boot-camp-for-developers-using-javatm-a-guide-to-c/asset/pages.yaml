  md: '# Meet the Android


    As shown in the preface of this book, the first step in setting up your Android
    programming environment to install the Android Studio IDE on your PC or Mac computer.
    The installation includes the Android Software Development Kit (SDK), which runs
    in Android Studio. The Android SDK includes a set of development tools that help
    you design the interface of the program, write the code, and test the program
    using a built-in Android handset emulator. Another language XML (Extensible Markup
    Language) is used to assist in the layout of the Android emulator.


    # Android Emulator


    The Android emulator lets you design, prototype, and test Android applications
    without a physical device. When you run an Android program in Android Studio,
    the emulator starts so you can test the program. You can use the mouse to simulate
    touching the screen of the device. The emulator mimics almost every feature of
    a real Android handset except for the ability to place a voice call. A running
    emulator can play video and audio, rendering game animation, and store information.
    Multiple emulators are available within the Android SDK to target various devices
    and versions from early Android phones onwards. Developers should test their apps
    on several versions to confirm the stability of a particular platform. Android
    Studio provides a live editing mode that previews an app''s user interface across
    a range of devices (Figure 1-4).


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_34_0.png)


    Figure 1-4 Android Studio live layout mode'
