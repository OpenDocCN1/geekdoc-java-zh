  md: '# CHAPTER 5 Investigate! Android Lists, Arrays, and Web Browsers


    Displaying a list is one of the most common design patterns used in mobile applications.
    Your morning you read the news designed as a listing of articles on a phone or
    tablet. You scrolled down the list of news articles and selected one by tapping
    the screen to display a list with text, images, and hyperlinks. As when called
    to class, you properly scrolled a list of songs on a mobile device and listened
    to your favorites.


