    # Android Animation


    Android provides two types of animation: Frame and Tween animation. **Frame animation**,
    also called frame-by-frame animation, assigns a sequence of photos to play in
    a slide show with a predefined interval between images. Frame-by-frame animation
    is typically created through steps in a process such as how-fish or to a fast-paced
    sequence such as in a cartoon. To create the illusion of movement, a cartoon image
    can be displayed on the screen and repeatedly replaced by a new image that is
    similar, but slightly adjusted in the time sequence.


    Instead using a sequence of images, **Tween animation** creates an animation by
    performing a series of transformations on a single image such as position, size,
    rotation, and transparency on the contents of a View object. Text can fly across
    the screen, an image of an engine can be rotated to display different angles,
    or the transparency of an image change from transparent to solid. A sequence of
    animation instructions defines the Tween animation using XML or Android code.
