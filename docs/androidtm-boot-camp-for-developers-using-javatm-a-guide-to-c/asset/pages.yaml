    # Designing a Tablet Application


    The Android market initially only included mobile devices, but the recent popularity
    of the tablet device provides a new platform for Android app programming. The
    growth of the Android tablet market goes in hand with dedicated applications designed
    especially for the tablet, not just enlarged versions of a phone app. Native applications
    are programs locally installed on a specific platform such as a phone or tablet.
    A native application is typically designed for a specific platform such as a 5-inch
    screen or on a 10.1-inch screen. In contrast, an emulated application is converted
    in real time to run on a variety of platforms as a webpage, which can be displayed
    on various screen sizes through a browser. A native Android tablet app creates
    an optimal user experience based on the most common tablet sizes between approximately
    7.3 and 10.1 inches, a 2560 × 1600 pixel resolution, and a 16:10 screen ratio,
    as shown in Figure 8-4. In comparison, an Apple iPad Air has a 9.7-inch screen,
    a 2048 × 1536 pixel resolution, and a screen ratio of 4:3. If you plan to create
    apps on multiple platforms, the different screen specifications will affect your
    design.'
