  md: '# CHAPTER 9 Customize! Navigating with a Master/Detail Flow Activity on a Tablet


    Creating an attractive user interface that provides simple navigation can be challenging
    when programming an Android app for a tablet, phone, and other mobile devices.
    Fortunately, the Android platform provides a flexible way to simplify layout and
    navigation using built-in Android templates. To construct apps that automatically
    fit the device, you need design elements such as fluid grids and flexible images
    that can adapt to various screen sizes, instead of creating rigid XML layouts
    heavily optimized to a number of predefined screen sizes, built-in templates are
    available using the best presentation mode based on the size of the device. Like
    multiple windows, multipane layouts can be used to show different topics within
    a single window in an intuitive interface.


    In this chapter, you use a template to create a multipane interface in an Android
    application designed for providing information about a European bike and cruise
    vacation. Bike and barge cruises combine two ways of exploring Europe—cycling
    and river cruising. On a bike and barge experience, you spend your days cycling
    through historic European sites and your nights cruising scenic rivers through
    cities such as Amsterdam and Budapest. The Bike and Barge application shown in
    Figure 9-1 features a three-item list containing Photos, Tour, and Web items.
    When the app first opens, the list is displayed in the left pane and the right
    pane is blank.


