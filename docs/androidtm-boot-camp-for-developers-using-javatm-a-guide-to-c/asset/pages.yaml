    # # Coding the EditText Class for the Text Field


    To handle the input that the user enters into the text field, you use the EditTextText
    class, which extracts the text and converts it for use in lave data. The code
    must assign the extracted text to a variable. A java program uses a **variable**
    to contain data that changes during the execution of the program. In a chapter
    project, a variable named tickets holds the text entered in the Text Field for
    the number of tickets. The following code syntax declares (or initializes) the
    ticket variables, which contains the extracted EditTextText class text from the
    user''s input. Notice the code syntax begins with the word **final**, indicating
    that tickets is a final variable. A final variable can be initialized only once;
    any attempt to reassign the value results in a compile error when the application
    runs.


    # ## Code Syntax


    ```

    `final EditText tickets = (EditText)findViewById(R.id.txtTickets);`

    ```


    > > GTK

    You can include spaces before after the equal sign or you can omit them. Java
    considers either format correct.


    Recall that if you want to refer to a control in the java code, you can use the
    id property to name the control when you add it to the interface. For example,
    the Text field has the id txtTickets. You can now access the control in the code
    using the findViewById() method. In the parentheses, the R refers to resources
    available to the app, such as a layout control, the id indicates that the resource
    is identified by the id, and txtTickets is the assigned id.'
