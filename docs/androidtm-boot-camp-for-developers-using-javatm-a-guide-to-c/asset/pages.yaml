    \ not for comparison.\n\nIn addition to numbers, strings can also be compared\
    \ in a conditional statement. A string value compares each character in two strings,\
    \ starting with the first character in each string. All characters found in strings,\
    \ including letters, numbers, and special characters, are ranked in a sequence\
    \ from low to high based on how the characters are encoded internally on the computer.\
    \ The relational operators in Table 4-3 cannot be used with string comparisons.\
    \ If strings are compared with the equals method of the String class.\n\nIf you\
    \ are comparing a string is alphabetically before another string, use the compare\
    \ method to determine the order of strings. Do not use the less-than or greater-than\
    \ symbols as shown in Table 4-3 to compare string data types. The compareTo method\
    \ returns a negative integer if the first string precedes the second. It returns\
    \ zero if two strings"
