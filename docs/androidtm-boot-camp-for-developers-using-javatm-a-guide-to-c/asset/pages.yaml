  md: '# CHAPTER 4


    # Explore Icons and Decision-Making Controls


    hexadecimal color code—A triplet of colors using hexadecimal numbers, where colors
    are specified by a pound sign followed by how much red (00 to FF), how much green
    (00 to FF), and how much blue (00 to FF) are in the final color.


    If Else statement—A statement that executes one of instructions if a specified
    condition is true and another set of instructions if the condition is false.


    If statement—A statement that executes one of instructions if a specified condition
    is true and takes no action if the condition is not true.


    isChecked() method—A method that tests a checked property to determine if a RadioButton
    has been selected.


    launcher icon—An icon that appears on the home screen to represent the application.


    margin—Blank space that offsets a control by a certain amount of indent pixels
    (dp) on each of its four sides.


    nest—To place one statement, as an If statement, within another statement.


    RadioGroup—A group of RadioButton controls; only one IconButton control can be
    selected at a time.


    toast notification—A message that appears as an overlay on a user’s screen, often
    displaying a validation warning.


    # Developer FAQs


    +   1. What is the name of the icon on the Android home screen of your device
    that opens an app?

