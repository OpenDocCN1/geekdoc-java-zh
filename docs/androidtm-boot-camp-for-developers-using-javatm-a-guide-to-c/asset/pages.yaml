  md: '# Working with Mathematical Operations


    The ability to perform arithmetic operations on numeric data is fundamental to
    many applications. Many programs require arithmetic operations to add, subtract,
    multiply, and divide numeric data. For example, the Concert Tickets app must multiply
    the cost of each ticket by the number of tickets to calculate the total cost of
    the concert tickets.


    # Arithmetic Operators


    Table 3-5 shows a list of the Java arithmetic operators, along with their use
    and an example of an arithmetic expression showing their use.


    | Arithmetic Operator | Use | Assignment Statement |

    | --- | --- | --- |

    | + | Addition | value = itemPrice + itemTax; |

    | - | Subtraction | score = previousScore - 2; |

    | * | Multiplication | totalCost = costPerTicket * numberOfTickets; |

    | / | Division | average = totalGrade / 5.0; |

    | % | Remainder | leftover = widgetAmount % 3; |

    | ++ | Increment (adds 1) | if WidgetAmount == 11 goalScore ++ |

    | -- | Decrement (stracts 1) | points -- |


    Table 3-5 Java arithmetic operators


    When multiple operations are included in a single assignment statement, the sequence
    of performing the calculations is determined by the rules in Table 3-6, which
    is the order of operations.


    | Highest to Lowest Precedence | Description |

    | --- | --- |

    | () | Parentheses |

    | ++ -- | Left to right |

    | * % | Left to right |

    | - | Left to right |


    Table 3-6 Order of operations


    For example, the result of 2 + 3 * 4 is 14 because the multiplication is higher
    precedence than the addition operation.


