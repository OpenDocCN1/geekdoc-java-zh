  md: "# Coding the getViewMethod\n\nThe most powerful method in the ImageAdapter\
    \ class is the getView() method. The getView() method uses Context to create a\
    \ new ImageView instance that temporarily holds each image displayed in the GridView.\
    \ In addition, the ImageView is scaled to fit the GridView control and sized according\
    \ to a custom height and width. The following code syntax shows how the chapter\
    \ uses the getView() method:\n\n# Code Syntax\n\n```\npublic View getView(int\
    \ position, View convertView, ViewGroup parent) {\n    pic = new ImageView(Animals[position]);\n\
    \    pic.setScale(ScaleType.FIT_XY);\n    pic.setLayoutParams(new GridView.LayoutParams(330,300));\n\
    \    return pic;\n}\n```\n\nIn getView() method, notice that a return type of\
    \ View is expected in the convertView() method. Recall that a View occupies a\
    \ rectangular area on the screen and is responsible for drawing the GridView component.\
    \ When pic is returned at the end of the method, it includes a scaled, resized\
    \ image to draw in the GridView control.\n\nIn the getView() method, an instance\
    \ of ImageView control named pic is established in the pic = new ImageView(context);\
    \ Java. On the next line, pic is given an image to display in the GridView by\
    \ a position in the Animals array. As each position is passed to the getView()\
    \ method, the ImageView control changes to hold each of the images referenced\
    \ in the Animals array. After an image is assigned to pic, the layout of the ImageView\
    \ control needs to be established. In the next statement, setScaleType scales\
    \ the image to the bounds of the ImageView. Scaling keeps or changes the aspect\
    \ ratio of the image; for example, the picture may be stretched horizontally,\
    \ but not vertically. Notice that the ScaleType is set to the option FIT_XY. Several\
    \ ScaleType options are available, but the most popular options are listed in\
    \ Table 7–4."
  merge: -1
  pgno: 313
- img_proc: true
  md: "# Coding the getView Method\n\n| ScaleType Option | Meaning |\n| --- | ---\
    \ |\n| ImageView.ScaleType.CENTER | This centers the image within the View type,\
    \ but does not change the aspect ratio (no scaling). |\n| ImageView.ScaleType.CENTER_CROP\
    \ | This centers the image within the View type and scales the image uniformly,\
    \ maintaining the same aspect ratio. |\n| ImageView.ScaleType.FIT_XY | This option\
    \ scales the image to fit the View type. The aspect ratio is changed to fit within\
    \ the control |\n\n![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_314_0.png)\n\n**Table\
    \ 7-4** ScaleType options\n\nAfter the image is loaded, the GridView are resized\
    \ to fit the custom layout. The design of the Endangered Species calls for small\
    \ thumbnail-sized images, so the LayoutParams are set to GridView.LayoutParams(330,300).\
    \ The first value, 330, represents the number of pixels across the width. The\
    \ second value, 300, determines a height of 300 pixels. If you want to display\
    \ a larger GridView, the setLayoutParams can be changed to dimensions. The last\
    \ statement in the getView() method must return the instance of the ImageView\
