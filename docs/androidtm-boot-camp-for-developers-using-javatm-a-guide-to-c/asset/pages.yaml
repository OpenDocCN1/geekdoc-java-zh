    an image or webpage.

    - Instead of extending the basic Activity class in MainActivity.java by using
    the public class Main extends Activity class statement, when you want to display
    a ListView control, extend the ListActivity class in MainActivity.java with the
    statement public class Main extends ListActivity.


    +   - Before you can select items in the list, declare the item names using an
    array variable, which can store more than one value of similar data types. For
    example, you can store five string values in an array without having to declare
    five variables.


    +   - Arrays provide access to data using a numeric index to identify each element
    in the array. Each value is stored in an element of the array, which you refer
    to index. The index for the first element in an array is zero. For example, *Attraction[0]*
    is the first element in the Attraction.


    +   - To declare an array, specify the array type and name followed by the values
    in braces, as in String[] attractions={‘Art Institute of Chicago’, ‘Magnificent
    Mile’, ‘Willis Tower’, ‘Navy Pier’;


    +   - You can display the values in an array adapter, which provides a data model
    for the layout and for converting the data into list items. A ListView control
    is the container for the list items, and an adapter such as the setListAdapter
    connects the array data to the ListView control so the items are displayed on
    the device screen. In other words, calling setListAdapter in the Java code builds
    the elements of an array to a ListView layout.


    +   - To design a simple layout, you drag controls from the Palette to the emulator
    in the Text tab. To design a custom list, add your code to the main XML file for
    the application, such as activity_main.


    +   - A setListAdapter adapter has three parameters: One to this class, the refers
    to the list used to display, and the third to the array containing the list values
    to display. For the second parameter, setListAdapter uses a standard layout, as
    in android.layout.simple_list_item_1, which specifies the built-in simple_list_item_1
    layout to display the list. Use a custom layout instead, replace the name of the
    standard'
