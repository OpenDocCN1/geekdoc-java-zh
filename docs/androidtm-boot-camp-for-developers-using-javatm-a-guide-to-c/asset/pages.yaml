  md: "# Creating a WebView XML Layout for the Third List Item\n\nInitially the Master/Detail\
    \ flow template displays each item using the TextView object displayed in the\
    \ fragment_item_detail.xml file. In the Bike and Barge app, if the user selects\
    \ the first item, the photos.xml layout is displayed, and if the user selects\
    \ the second item, the tour.xml layout is shown. The Bike and Barge app uses the\
    \ default fragment_item_detail.xml layout, but its TextView object cannot display\
    \ a webpage. Instead, the TextView control must be changed to a WebView object,\
    \ a View widget that displays webpages. The WebView object allows you to place\
    \ a web browser or display some online content within your Activity. The WebView\
    \ object uses a built-in rendering engine to display webpages.\n\nAfter placing\
    \ the WebView object in the XML layout of the app, you must add Internet permissions\
    \ to the Android Manifest file for your Activity to access the Internet and load\
    \ webpages. A Permission is a restriction limiting access to a part of the code\
    \ or data to that the device protects critical data and code that could be misused\
    \ to cause issues for your app and others. Permissions can be set in the Android\
    \ Manifest file within an Android app to allow certain actions such as set the\
    \ background wallpaper, check the device’s level, read your contacts, write events\
    \ to your calendar, and display a webpage. Every Android application must have\
    \ an AndroidManifest.xml file in its directory. The Android Manifest presents\
    \ essential information about how to add an Android to the system, information\
    \ the system must have before it can run the code. The AndroidManifest.xml file\
    \ declares each Activity within the application, and permissions necessary for\
    \ the application to interact with other applications. Without the proper permission,\
    \ attempts to access the AndroidManifest.xml will fail. The general structure\
    \ of the AndroidManifest.xml is as follows:\n\n```\n<?xml version=\"1.0\" encoding=\"\
    utf-8\"?>\n<manifest>\n  <uses-permission />\n  <permission />\n  <application>\n\
    \    icon\n    label\n    theme\n    <activity>\n      <intent-filter>\n     \
    \   <category />\n        <data />\n      </intent-filter>\n      <meta-data />\n\
    \    </activity>\n  </application>\n</manifest>\n```"
  merge: -1
