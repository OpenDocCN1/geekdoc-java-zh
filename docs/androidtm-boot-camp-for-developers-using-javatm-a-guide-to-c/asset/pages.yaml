    # Logical Operators


    An If statement can test more than one condition within a single statement. In
    many cases, more than one condition must be true or one of several conditions
    must be true in order for the statements in the braces to be executed. When more
    than one condition is included in an If statement, the conditions are a compound
    condition. For, consider the following business traveling rule: "If the flight
    costs $400.00 and the hotel is less than $120.00 per night, the trip is approved."
    In this case, both conditions (flight less than $400.00 and less than $120 per
    night) must be true for the trip to be approved. If either condition is not true,
    the business trip is not approved.


    To create an If statement that processes the business traveling rule, you must
    use a logical operator. The most common logical operators is listed in Table 4-5.


    | Logical Operator | Meaning | Example |

    |---|---|---|n| && | And-all conditions must be true | if (flight < 400 && hotel
    < 120) |

    | || | Or-at least one condition must be true | if (stamp == 0.49 || 11 = 2) |n|
    ! | Not-reverses the meaning of a condition | if (le > 70)) |


    Table 4-5 Common logical operators'
