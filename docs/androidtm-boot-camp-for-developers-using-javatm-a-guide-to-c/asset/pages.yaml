    # # Android Themes


    To prevent each App from looking too similar, the Android SDK includes themes
    that provide individual flair to each application. A theme is a style applied
    to an Activity or an entire application. Themes are Android''s mechanism for applying
    a consistent style to an app or Activity. The style specifies the visual properties
    of the elements that make up a user interface, such as color; height, padding,
    and font size. Some themes change the background wallpaper of the Activity, others
    hide the title bar or display an action bar. You can preview them in the emulator
    in activity_main.xml. The default theme for Nexus 5 shows the title bar displaying
    the name with a white background when running the app. Figure 3-3 displays Holo.
    Light theme with a translucent background and a title bar on the emulator. The
    light and transparent themes are sheer and allow you to see the starting screen
    through the background. Figure 3-4 displays a Material theme (Material.Dialog.NoActionBar)
    for dialog boxes and Activities, with no action bar at the top. The black theme
    shown in Figure 3-5 displays a black background with a gray title bar.'
