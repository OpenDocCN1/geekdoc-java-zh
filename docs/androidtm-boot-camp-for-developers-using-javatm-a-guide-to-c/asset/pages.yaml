    # # Creating an Array


    The list of attractions can be displayed, the string attraction names must be
    declared. By using an array variable, which can store more than one value, you
    can avoid assigning a separate variable for each item in the list. Every application
    developed far involved a limited number of variables. Professional programming
    applications commonly require larger sets of data using multiple variables. You
    learned that data types can store only one value at a time. If you changed a variable''s
    value, the value would be deleted because a typical variable can store only one
    value at a time. Each individual item in an array that contains a value is called
    an **element.**


    Arrays provide access to data using a numeric index, or subscript, to identify
    each element in the array. Using an array, you can store a collection of values
    of similar data. For example, you can store five strings without having to declare
    different variables. Instead, each value is stored in an individual element of
    the array, and you refer to each element by its index. The index used for the
    first element in an array is zero. Each subsequent element is referenced by an
    increasing index value, as shown in Table 5-1.'
  merge: -1
  pgno: 210
