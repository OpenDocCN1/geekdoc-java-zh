  md: 'use them to create basic Android applications that you can immediately run
    and test on an Android device of any size. Android templates are available when
    you create a new Android project, as shown in Figure 9-6. Throughout this chapter,
    you select the Blank Activity, but in this chapter’s project app, you use the
    Master/Detail Flow application template.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_374_0.png)


    **Figure 9-6** Android application templates


    # Master/Detail Flow Template


    The Bike and Barge template features an opening screen with list items on the
    left, as shown in Figure 9-1. A menu of list items on the left of a browser window
    displays webpage using intuitive navigation on the right side of the page. You
    switch between items on the list to display new content without opening browser
    windows. The **Master/Detail Flow template** creates an adaptive, responsive layout
    for a set of list items and detail content. The Master appears in a vertical pane
    along the edge of the screen. Without any customization, the Master/Detail Flow
    template as shown in Figure 9-7 can be displayed on a tablet or a smartphone.
    On a tablet, the master item appears in a vertical pane along the left edge of
    the screen. The item details are displayed on the right side of the tablet screen
    in the wider detail pane. This arrangement is referred as a two-pane layout, The
    Master/Detail Flow template is considered a responsive design. On a smaller device,
    the list and details are displayed when you select a list item.


