  md: '# Developer FAQs


    other storage medium such as a memory card or cloud service so that the data can
    be retrieved later within the app or after the termination of the program.


    +   - Persistent data can be stored using shared preferences, internal storage,
    external storage, a SQLite database, or a network connection. Use the SharedPreferences
    object to save any primitive data: Booleans, floats, ints, and strings.


    +   - When you save application using the SharedPreferences object, the data is
    saved to an XML file as a key-value pair. The key is a string such as "key1" that
    uniquely identifies the preference, and the value is retrieved as a string, int,
    float, or Boolean.


    +   - You can use the key-value pairs stored in SharedPreferences in different
    Activities of your application or in another application.


    +   - Use a putDataType() method to store the data in a SharedPreferences object,
    and use a getData() method to retrieve the data.


    # Key Terms


    **key**—The string part of a key-value pair that uniquely identifies a preference.


    **persistent data**—The type of data that stores values permanently by placing
    the information in a file.


    **SQLite**—A lightweight, preloaded mobile database engine, which has been available
    since the Cupcake 1.5 version of Android and occupies a small amount of disk memory.


    **value**—The data part of a key-value pair that represents a string, int, long,
    float, or Boolean value.


