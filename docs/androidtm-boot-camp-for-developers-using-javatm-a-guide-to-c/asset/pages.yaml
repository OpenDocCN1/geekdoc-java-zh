    # Class Variables


    In the coding examples thus far in this book, variables have been local variables.
    **Local variables** are defined by variable declaration statements within a method,
    such as a primitive integer within onCreate() method . The local variable effectively
    ceases to exist when the execution of the method is complete. The *scope* of a
    variable refers to its visibility within a class. Variables that are accessible
    only to a restricted portion of a program, such as a single method, have local
    scope. Variables that are accessible anywhere in a class, are said to have global
    scope. If a variable is needed in multiple methods within a class, the global
    variable is assigned at the beginning of a class, not within a method. This global
    scope is called a **class variable** in Java and can be accessed by multiple methods
    throughout the program. In the chapter project, the Button, MediaPlayer (necessary
    for playing sound), and an integer variable named playing are needed in the onCreate()
    method and within both onClick() methods for each Button control. To keep the
    value of these variables through multiple classes, the variables are defined as
    class variables that cease to exist when their class is unloaded.


    After classes are defined in MainActivity.java, the onCreate() method opens the
    activity_main.xml layout and defines the two controls. The Activity waits for
    the user to select one of the two buttons, each of which plays a song. If a button
    is clicked twice, the music pauses. Each button must have a setOnClickListener
    enables the user''s tap or click. When the user taps a button, the setOnClickListener
    implements Buttons.


