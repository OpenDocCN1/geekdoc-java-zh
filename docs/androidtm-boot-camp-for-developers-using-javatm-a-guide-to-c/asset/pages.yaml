    * In the New Project dialog box, enter Medical Calculator in the Application name
    box.

    * In the Company domain text box, type androidbootcamp. if necessary.

    * In the Project location box, type D:\Workspace\MedicalCalculator (if necessary,
    enter a different drive letter that identifies the USB drive) to select a workspace
    and tap or click the OK button.

    * Tap or click the Next button on the Configure your project page of the New Project
    dialog box.

    * If necessary, tap or click the Phone and Tablet box to select the form factor
    for your app will run on.

    * If necessary, tap or click Blank Activity to add an Activity to the project.

    * Tap or click the Next button on the Add to Mobile Mobile page.

    * Tap or click the Finish button on the Options page for your new page.

    * Tap or click the Hello world! TextView widget (displayed by default) in the
    emulator and press the Delete key.

    * Tap or click the ''virtual device'' to rename the layout with ''button'' (emulator)
    to the right of the Palette on the activity_main.xml tab, and click Nexus 5 (5.0",
    1080 x 1920, xhdpi).


