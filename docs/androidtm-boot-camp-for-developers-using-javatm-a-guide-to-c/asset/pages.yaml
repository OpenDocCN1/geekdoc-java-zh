  md: '# CHAPTER 10 Move! Creating Animation


    > Critical Thinking

    To make an object move across the screen, I can either use Frame animation to
    redraw the object or use Tween animation to move the object. Which is easier?


    Using Tween animations to move an object''s position, change the size of the object,
    or make opacity changes are less intensive than manually redrawing the image over
    and again like a cartoon to show movement.


    # ## Tween Animation


    Instead of rendering several images in a sequence in Frame animation, Tween animation
    manipulates a drawable image by adding tween effects. Defined in an XML file,
    **tween effects** are transitions that change objects from one state to another.
    An ImageView or TextView can move, rotate, grow, or shrink. As shown in Table
    10-1, Tween animations include a built-in library of tween effects. These effects
    are saved within an animation XML file that belongs in the res/anim/ folder of
    your Android project. With Tween animation, an Android game could show the actor
    moving towards the treasure, change the opacity of a treasure chest you can see
    inside, and spin the clock to indicate the passing of time.


    | Tween effect | Purpose |

    | --- | --- |

    | Alpha | Transitions an object from one level of transparency to another where
    0.0 is transparent and 1.0 is opaque |

    | Rotate | Spins an object from one angular position to another. To rotate an
    object completely around, start at 0 degrees and rotate to 359 degrees (a full
    circle). A pivotX and pivotY shows the amount of pivot based on the object''s
    left edge |

    | Scale | Transitions the size of an object (grow or shrink) on an X/Y scale |

    | Translate | Moves the object vertically or horizontally a percentage relative
    to the element width (e.g., deltaX="100%" would move the image one image width)
    |


    **Table 10-1** Tween animation effects


    The four tween effects in Table 10-1 can be coded in an XML file and individually
    configured or nested to animate an object in any direction or size.


    > GTK

    Android requires that your animated image stays within the bounds of the view
    object. Rotations, movement, and scaling transformations that extend beyond the
    original boundaries clip the image.'
