    \ is selected, as shown in the following code syntax:\n\n# Code Syntax\n\n```\n\
    pic.setImageResource(Animals[position]);\n```\n\nAnimals is the name of the array\
    \ and position represents the index of the array. The argument position is defined\
    \ as the position of the selected image in the GridView. To assign a picture to\
    \ the ImageView control, follow this step:\n\n# STEP 1\n\n+   - In MainActivity.java,\
    \ tap or click at the end of the Toast statement, if necessary, and press the\
