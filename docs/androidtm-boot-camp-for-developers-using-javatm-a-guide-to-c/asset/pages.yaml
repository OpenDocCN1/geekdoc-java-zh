    # Understanding Persistent Data


    The Electric Car Finanz opens with a window that requires user input. Unlike the
    project in Chapter 2 (Healthy Recipes), this program allows input that is stored
    within the device. That data serves to be used in the second Activity class. With
    the programs that you have written so far, the values did not persist beyond the
    Activity in which they were created. The data was lost because the data is in
    RAM (random access memory), which is cleared when the app (or the device) stops
    running. Android applications can save data to the device''s drive or other storage
    media such as a memory card or cloud service so that the data can be retrieved
    after the app or after the termination of the program. **Persistent data** stores
    values permanently by placing the information in a file.


    Android provides several options for you to save persistent application data.
    Persistent data can be saved in a variable or within a database, based on the
    specific need of the app. Some apps may require private storage, while others
    are accessible to other applications. Persistent data can be stored in five different
    ways in Android applications:


    +   - Shared preferences—Stores private data in Key–value pairs


    +   - Internal storage—Stores private data in the memory of the device


    +   - External storage—Stores data, which can be available to other apps on shared
    external storage


    +   - SQLite database—Stores structured data in a private database


    +   - Network connection—Stores data on a web server


    # Using Shared Preferences


    The SharedPreferences class provides one of the easiest ways to save and load
    primitive data, whether you are looking to save the user''s name or settings such
    as the font size the user prefers. In the Electric Car Finanz app, the SharedPreferences
    object is used to store data even if the user closes the application. Shared preferences
    can save any data including preferences, such as what wallpaper a user has chosen
    or values entered by the user in an EditText control.


    Shared preferences can save any primitive data: Booleans, floats, ints, and strings.
    In the chapter project includes, the number of years for the loan (int), the amount
    of the loan (float), and the interest rate (float) for the electric car. In the
    first Activity, these are saved using shared preferences, and in the second Activity,
    they are retrieved to determine which of the three displays shows the number of
    years in the loan. Shared preferences are best when your app needs to save small
    chunks of data as a name–value pair.


