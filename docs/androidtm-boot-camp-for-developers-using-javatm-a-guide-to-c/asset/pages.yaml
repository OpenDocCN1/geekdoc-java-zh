  md: '# CHAPTER 4 Explore! Icons and Decision-Making Controls


    Developers can create Android applications to make decisions based on the input
    of users or other conditions that occur. Decision making is one of the fundamental
    activities of a computer application. In this chapter, you learn to write decision-making
    statements in Java, which allows you to test conditions and perform different
    operations on the results of that test. You can test for a condition being true
    or false and change the flow of what happens in a program based on the user''s
    input.


    The sample program in this chapter is designed to run on an Android phone or tablet
    device at a hospital. The Medical Calculator application provides a nurse to convert
    the weight of a patient from pounds to kilograms and kilograms to pounds. Most
    medication amounts are prescribed based the weight of the patient. Most hospital
    scales display weight in pounds, but the prescribed medication is often based
    on the weight of a patient in kilograms. For safety reasons, the exact weight
    of the patient must be correctly converted between pounds and kilograms. The nurse
    enters the weight of the patient and selects a radio button, as shown in Figure
    4-1, to determine whether pounds are converted to kilograms or kilograms being
    converted to pounds. The mobile application computes the converted weight based
    on the conversion formulas: The conversion formulas are kilograms = pounds * 2.2
    and pounds = kilograms /2.2. To validate that correct weights are entered, if
    the value is greater than 500 for the conversion from pounds to kilograms or greater
    than 225 for the conversion from kilograms to pounds, the user is asked for a
    valid entry. If the user enters a number out of the acceptable range, a warning
    called a toast message appears on the screen. When the app is running, a nurse
    enters 225 for the value of the weight of the patient and the Convert Pounds to
    Kilograms radio button shown in Figure 4-1. After tapping the Convert Weight button,
    the application displays 102.3 kilograms (rounded off to the nearest tenth place)
    in a red font, as shown in Figure 4-2. By using a mobile device, the nurse can
    capture patient information such as weight directly at point of care anywhere
    and reduce errors made by delaying entry on a traditional computer in another
    location.'
  merge: -1
