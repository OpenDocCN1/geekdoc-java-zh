    # Changing the Margins


    After placing a control on the user interface, you can change the alignment by
    adjusting the gravity of the control. For more flexibility in controlling your
    layout, use the layout:margin property to change the spacing around each object
    by changing all the margins, or the left, top, right, or bottom margin individually.
    Each control in the Medical Calculator app use margins to add a certain amount
    of blank space measured in density independent pixels (dp) on each of its sides.
    Instead of "eyeballing" the controls on the user interface for alignment, the
    layout:margin property creates equal spacing around controls. Using the layout:margin
    property makes your user interface more organized and easier to use. For example,
    in Figure 4-1, a margin spacing of 15dp (pixels) specifies 15 extra pixels on
    the top side of the selected Text View control displaying the title. As you design
    the interface, use the same margins around each control to provide a symmetrical
    layout.


    # Changing the Layout Gravity


    The Medical Calculator displays controls from the Palette with Relative Layout.
    Relative Layout is the default layout on the Android emulator. At times, you may
    find the emulator might display a control at a different location than you placed
    it on the screen. The layout can be set for each control using a property named
    gravity to control it horizontally as well as positioning it at other places on
    the screen. After each control is placed on the emulator, a toolbar appears above
    the screen or with a shortcut to layout. Gravity is similar to the alignment feature
    in Microsoft Office that allows a control to snap to the left, center, right,
    top, or bottom. The gravity property in the Properties pane provides more options
    in the Gravity tool such as center_vertical, fill_vertical, fill_horizontal, clip_vertical,
    clip_horizontal, start, and end.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_171_0.png)


