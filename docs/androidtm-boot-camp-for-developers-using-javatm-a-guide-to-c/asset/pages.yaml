  md: '# CHAPTER 5 Investigate! Android Lists, Arrays, and Web Browsers


    with the name of the custom layout, in R.layout_activity_main, which references
    a custom layout named_main.xml. You also remove the android reference because
    you are no longer using an Android library layout default.


    +   - To have an tap action when a user selects an item in a list, you code the
    onItemClick method to respond to the user''s selection.

    - You can use the Switch decision structure with list or menu. In a Switch statement,
    an integer or character variable is evaluated and the corresponding case is executed.
    Each case is specified using the case keyword followed by a value and a colon.
    For example, if a list contains five items, the Switch statement will have five
    cases, such as case 0, case 1, case 2, case 3, and 4. End each case with a break
    statement to exit the Switch decision structure

    - Android intents send and receive activities and services, including opening
    a Web page in a browser. An intent can use the ACTION_VIEW intent to send a URL
    to a built-in Android browser and specify the wanted website.

    - As you develop an application, you must test every option and possible user
    action, including incorrect values and selections. Thoroughly test an Android
    app before publishing to Google Play.


    # Key Terms


    **ACTION_VIEW**—A generic action you can use to send any request to get the most
    reasonable action to occur.

    **adapter**—Provides a data model for the layout of a list and for converting
    the data from the array into list items.

    **array variable**—A variable that can store more than one value.

    **ArrayAdapter<String>**—AList that supplies array data to a ListView object.

    **break**—A statement that ends a case within a Switch statement and continues
    the statement following the Switch decision structure.

    **case**—A keyword used in Switch statement to indicate a condition. In a Switch
    statement, the keyword is followed by a value and a colon.

    **element**—A single individual item that contains a value in an array.

    **LoginActivity**—A class that displays list of items within an app.

    **onItemClick()**—A method called when an item is in a list. When an item is selected,
    the item is passed from the onItemClick method and evaluated with a decision structure.
    The first item is assigned the position of 0, and the second item is assigned
    the position of 1, and so.'
