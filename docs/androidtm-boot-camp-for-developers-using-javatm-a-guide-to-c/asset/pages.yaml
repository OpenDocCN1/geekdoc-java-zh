    # Registering for a Google Play Account


    Google Play is a publishing platform that distributes your Android apps to users
    around the world. Before you publish apps through Google Play, you must register
    as a developer with Gmail account username and password at http://play.google.com/apps/.
    Publishing Google Play requires a one-time payment of $25, which registers as
    an Android developer and enrolls you in a Google Merchant account. Google charges
    the one-time fee to encourage higher quality products on Google Play. To receive
    payment for the purchased apps, you must first specify a bank account. Bank information
    is not added or updated within your Google Checkout account, but rather in the'
