    # # Using the Start and Stop Methods


    After associating AnimationDrawable the animation images and coding the buttons,
    you can use the start() and stop() methods of the drawable objects to control
    the Frame animation. When the user taps the Start Frame button, the start() method
    begins the Frame animation continuously onceshot set to false. The Frame animation
    stops only when the user taps the Stop Tween button, which launches the stop()
    method and initiates the startActivity(), launching the second activity named
    Tween.java. In the following code, the start() method is placed within the onClick()
    method for the Start Animation button and the stop() method is placed within the
    onClick() method for the Start Tween button.


    # # Code Syntax


    ```

    lightsAnimation.start();

    lightsAnimation.stop();

    ```'
