  md: '# CHAPTER 4 Explore Icons and Decision-Making Controls


    # Using the Launcher Icon


    By default, Android places a standard icon as the graphic to represent your application
    on the device''s home screen and in the Launcher window. To view the opening icon
    called the launcher icon on the home screen, or click the launcher icon at the
    bottom of the emulator when an application begins to execute, as shown in Figure
    4-3. Instead of a default icon that displays an Android logo, app users in Google
    Play should have a custom graphic (Figure 4-3) representing the contents of your
    application. Launcher icons form the first impression of your app on prospective
    users in Google Play. With many apps available, high-quality launcher icon can
    influence users to purchase your Android app.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_159_0.png)


    Figure 4-3 Android home screen and launcher icons


    GTK

    Tap the circle with six small squares at the bottom of the emulator to view the
    Android home screen and the icons.'
