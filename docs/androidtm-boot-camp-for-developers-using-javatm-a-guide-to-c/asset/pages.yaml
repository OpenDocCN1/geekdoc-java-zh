    # Adding a GridView Control


    The Endangered Species app opens with a horizontal scrolling list of animal pictures
    in a View contained as a GridView, as shown in Figure 7-1. A View container is
    a rectangular area of the screen that displays an image or text. A View container
    can contain layouts such as Grid, RadioGroup, ScrollView, TabHost, and ListView.
    In Chapter 5, you used the ListView layout to create a vertical list of Chicago
    attractions. In the Endangered Species project, the GridView displays a horizontal
    list of objects with the center item displaying the current image. A GridView
    is useful when you want to show data in a grid layout to display images or icons.
    This layout can be used to build applications such as image viewers and audio
    video players to show items in a table or grid. If you have more images than be
    displayed on the screen, you can move through the grid by scrolling the page.
    The photos can be as small as thumbnail images or as large as full-screen images.
    The photos can be stored in the drawable folders, or in your phone''s storage
    (SD card), or even on a website such as Picsasa.


    The GridView control is a widget in the Composite category of the Palette. Each
    GridView control can be customized with the attributes shown in Table 7-1.


    | Grid Attribute Name | Description |

    |---|---|n| android:columnWidth | Specifies the fixed width for each column of
    the grid |

    | android:numColumns | Defines the number of columns in the grid |

    | android:horizontalSpacing | Defines the default horizontal spacing between columns
    in the grid |

    | android:verticalSpacing | Defines the default vertical spacing between rows
    in the grid |


    Table 7-1 GridView control attributes'
