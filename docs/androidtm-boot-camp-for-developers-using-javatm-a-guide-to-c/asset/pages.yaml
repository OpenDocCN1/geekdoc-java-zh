    # Wrap It Up—Chapter Summary


    Using responsive design helps to meet the challenges of creating apps for the
    wide range of Android devices. The wide screen of a tablet allows for easy navigation
    using list items in the left pane and displaying details in the right. The chapter
    provided steps to use a Master/Detail Flow template that created a simple structure
    to display three screens of content. The WebView control was introduced for opening
    Internet content directly within an app using AndroidManifest Internet permissions.


    +   - Responsive design is an approach to designing apps and websites that provide
    an optimal viewing experience across many devices as possible.

    - Android templates are available when you create a new Android project. You use
    them to create basic Android applications that you can run and test on an Android
    device of any size.

    - A tablet app created with the Master/Detail Flow template displays a list of
    items in a narrow vertical pane along the left side of the screen. When the user
    selects an item in the list, associated content appears in the detail pane on
    the right. On a smaller device, such as a smartphone, the list and detail content
    are displayed on separate screens.

    - To display the detail content for the first list item in the Bike and Barge
    app, you provide images and descriptions in an XML StatelessWidget. Each row in
    the GridLayout displays an ImageView and TextView control.

