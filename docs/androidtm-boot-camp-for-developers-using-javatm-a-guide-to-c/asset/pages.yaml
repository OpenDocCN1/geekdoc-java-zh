  md: '# Prelude! Installing the Android SDK with Android Studio


    # Setting Up the Android Environment


    To begin developing Android applications, you must first set up the Android programming
    environment on your computer. To establish a development environment, this preface
    walks you through the installation and setup for a Windows or Mac computer. The
    Android Software Development Kit (SDK) allows developers to create applications
    for the Android platform. The Android SDK includes Android Studio along with sample
    projects including source code, development tools, an emulator, and required libraries
    to build Android applications, which are written using Java programming language.


    Although installing the Android SDK with Android Studio is easy, you must follow
    the instructions in this preface to correctly prepare for creating an Android
    application. Before writing your first application in Chapter 1, complete the
    following general steps to successfully install the Android SDK with Android Studio
    on your computer:


    +   - Prepare your computer for the installation.

    - Download and install the Android Studio Integrated Development Environment (IDE).

    - Add an Android SDK.

    - Set up the emulator.


    # Preparing Your Computer


    The Android Software Development Kit is compatible with Windows Vista (32- or
    64-bit), Windows 7 (32- or 64-bit), Windows 8.x (32- or 64-bit), Windows 10 (32-
    or 64-bit), Mac OS X (Intel only) and Linux with 2 GB of RAM for all platforms.
    Java Development Kit (JDK) 7 must already be installed on the PC. To install the
    basic files needed to write an Android application, your hard drive needs at least
    1 GB of available space. Android Studio is the officially recommended IDE of Android
    development, replacing Eclipse.'
