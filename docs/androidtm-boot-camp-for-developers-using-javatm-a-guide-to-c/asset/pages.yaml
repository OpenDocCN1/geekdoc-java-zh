- img_proc: true
  md: '# Using the Launcher Icon


    An icon is a graphic that takes up a small portion of screen space and provides
    a quick, intuitive representation of an app. As you design a launcher icon, consider
    that an icon can establish brand identity. A unique image logo and program name
    can communicate your brand to potential customers. In the Medical Calculator app,
    the scale shown in Figure 4-4 communicates that this icon launches a program about
    weight. A simple image with a clear visual like the scale has a memorable impact.
    It also helps users find the app on the Google Play site. Google Play suggests
    icons should be simple and bold in design. For example, for a paint program, an
    icon shaped like a thin paintbrush may be hard to distinguish from a pencil image,
    but a large cartoon paintbrush can convey its purpose.


    Google Play also specifies the size and format of all launcher icons. Uniform
    icons should be saved in the .png file. Based on your target device, Table 4-1
    specifies the size of a finished launcher. You can use programs such as Microsoft
    Paint, Paintbrush, and Adobe Photoshop to resize the icon to the correct number
    of pixels. In the chapter project, the icon dimension is 48 x 48 pixels for the
    high-density screen used by the application, the Asset Studio within Android Studio
    can automatically resize icons to the appropriate size necessary for different
    device platforms.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_160_0.png)


    | Resolution | Dots Per Inch (dpi) | Size (px) |

    |---|---|---|n| ldpi (low-density screen) | 120 | 36 × 36 |

    | mdpi (medium-density screen) | 160 | 48 × 48 |

    | hdpi (high-density screen) | 240 | 72 × 72 |

    | xhdpi (extra high-density screen)* | 320 | 96 × 96 |

    | xxhdpi (extra extra high-density screen)* | 440 | 144 × 144 |


    **Table 4-1** Icon sizes


    +   * Used by some


    > GTK

    When you publish an app to Google Play, you must provide a 512 × 512 pixel, high-resolution
    icon for the developer console as you upload your program. This icon is displayed
    on the Google Play site to provide a description of the app and does not replace
    your launcher icon.


    Google Play recommends a naming convention for launcher icons. Typically, the
    prefix ic_ is used to name launcher icons for Android apps. In the case of the
    Medical Calculator app, the launcher icon is named ic_launcher_weight.png. After
    a custom icon is placed within the project, Android renames the icon to the name
    ic_launcher.png.'
