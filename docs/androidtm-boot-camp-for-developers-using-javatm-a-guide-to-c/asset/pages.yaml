  md: '# What This Book Is Not


    Because this book is targeted to those new to developing Android apps, it doesn''t
    cover advanced topics, such as application programming interfaces (APIs) for each
    platform. Instead, this book provides a launch pad to begin your journey into
    creating Android apps for fun and profit.


    In addition, this book is not an exhaustive information resource. You can find
    a wealth of information, tutorials, examples, and other resources for the Android
    platform online. You should learn enough from this book that you can modify and
    use code of you to fit your needs. The best way to learn how to create Android
    apps is to write code, make mistakes, and learn how to fix them.


    # Organization and Coverage


    Chapter 1 introduces the Android platform and describes the current market for
    Android apps. You create your first project using Android Studio and become familiar
    with the Android Studio interface and its tools. As programming tradition mandates,
    your first project is called Hello Android World, which you complete and run in
    an emulator.


    Chapter 2 focuses on the User interface. While developing an app for selecting
    and displaying healthy recipes, you follow a series of steps that you repeat every
    time you create an Android app. You learn how to develop a user interface using
    certain types of controls, select a layout, and write code that responds to a
    button event (such as a tap or click). While creating the project, you develop
    an app that includes more than one screen and can switch from one screen to another.
    Finally, you learn how to correct errors in Java code.


    Chapter 3 covers input variables, and operations. You develop an Android app that
    allows users to enter the number of tickets they want to purchase, and then tap
    or click a button to calculate the total cost of the tickets. To do so, you create
    a user interface using an Android theme and add controls to the interface, including
    text fields, buttons, and spinner controls. You declare variables and use arithmetic
    operations to perform calculations, and then convert and format numeric data.


    Chapter 4 discusses icons and decision-making controls. The sample app provides
    healthcare professionals with a mobile way to track the weight of a patient from
    pounds to kilograms and kilograms to pounds. You create this project using a custom
    application code, learn how to fine-tune the layout of the user interface, and
    include buttons for user selection. You learn how to program decisions using If
    statements, Else statements, and logical operators.


    Chapter 5 describes how to use lists, arrays, and web browsers in an Android app.
    You design and create an Android app that people can use as a traveler''s guide
    to popular attractions in Chicago, Illinois. To do so, you work with lists, images,
    and the decision structure. You also learn how to lets access a web browser while
    using an Android app.


    Chapter 6 explains how to include audio such as music in Android apps. The sample
    app opens with a splash screen and then displays screens where users can select
    a'
