  md: '# Wrap It Up—Chapter Summary


    This chapter has provided an overview of the Android open-source platform, which
    is positioned for fast innovation without the restraints of a proprietary system.
    With its rich feature set, the Android Studio environment allows you to develop
    useful, inventive Android apps for the platform with the largest market share.
    In the first chapter, Hello Android World, you completed steps that start your
    journey to create more interesting applications in future chapters.


    +   - The Android operating system is released under a full open-source license
    for free.

    - The Android OS powers all types of mobile devices, including smartphones, tablets,
    Internet TVs, Android wearable devices like watches, and Google Glass.

    - To write Android apps, you can use Android Studio, a developed environment for
    building Android applications, using Java, an object-oriented programming language.

    - The Android emulator lets you design, develop, prototype, and test Android applications
    without using a physical device. When you run an Android program in Android Studio,
    the emulator starts so you can test the program as if it were on a specified Android
    mobile device.

    - The Android platform consists of the Android OS, the Android development platform,
    and Google Play, a marketplace for Android applications.

    - Android supports two ways to build the user interface of an application: Java
    code and XML layout files. The XML method is preferred as it allows you to design
    the user interface of an application without needing to write large amounts of
    code.

    - The Project view on the left side of the Android Studio window contains the
    folders for an Android project.

    - To design a user interface for Android App, you can create a layout, which is
    a container that displays widgets such as TextView, Button, and CheckBox controls,
    also called objects.

    - The text property can be updated using the Translations Editor opened from the
    strings.xml file in the folder.

    - After you create an application, you can run it in the Android emulator to test
    the application and make sure it runs correctly.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_52_0.png)'
