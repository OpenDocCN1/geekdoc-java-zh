  md: "# Creating Frame-by-Frame Animation\n\n![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_414_0.png)\n\
    \n**Figure 10-6** Two Button controls in the XML code\n\n# # Creating Frame-by-Frame\
    \ Animation\n\nIn the Northern Lights App, the frame-by-frame animation displays\
    \ a sequence of Northern Lights images from the drawable folder. A single XML\
    \ file frame.xml lists the frames that contain the Northern Lights animation.\
    \ You create animation.xml in the drawable folder. Frame-by-frame animations are\
    \ also known as drawable animations. In the XML code, an **animation-list** root\
    \ element references four Northern Lights images in the drawable folder. Each\
    \ item in the animation-list specifies how many milliseconds to display each image.\
    \ In the project chapter, each image is displayed for 1/10 of a second. The `android:oneshot`\
    \ attribute includes the oneshot property, which is set to default. By setting\
    \ the oneshot attribute of the animation-list to false, as shown in the following,\
    \ the animation plays repeatedly like a film until the Start Tween animation is\
    \ tapped. If the oneshot attribute is set to true, the animation plays once and\
    \ then displays the last frame. Note that you add the oneshot attribute to the\
    \ code in the animation-tag.\n\n# ## Code Syntax for animation.xml\n\n```\n```xml\n\
    <?xml version=\"1.0\" encoding=\"utf-8?>\n<animation-list xmlns:android=\"http://schemas.android.com/apk/res/android\"\
    \ android:oneshot=\"false\">\n  <item android:drawable=\"@drawable/lights1\" android:duration=\"\
    100\" />\n  <item android:drawable=\"@drawable/lights2\" android:duration=\"100\"\
    \ />\n  <item android:drawable=\"@drawable/lights3\" android:duration=\"100\"\
    \ />\n  <item android:drawable=\"@drawable/lights4\" android:duration=\"100\"\
    \ />\n</animation-list>\n```\n```"
  merge: -1
