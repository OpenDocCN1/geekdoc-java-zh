  md: '# First Venture into the Android World


    # Modifying the Text in the TextView Control


    By default a TextView displaying the text Hello World! is placed on the emulator.
    Instead of placing text directly in the text property or hardcoding the text,
    Android recommends values such as strings be stored in the form of resources within
    the res folder. The simplest way to edit this is by modifying resource files instead
    of changing the XML source code. If the Hello Android app was developed for multiple
