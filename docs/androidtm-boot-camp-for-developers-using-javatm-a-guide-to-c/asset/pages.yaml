  md: '# IN THE TRENCHES


    To see a professional city guide app in action, download a free app created by
    Trip Advisor or Tripuso.


    To create this application, the developer must understand how to perform the following
    processes, among others:


    +   1. Create a list using a ListView.

    2. Define an array to establish the items in the list.

    3. Add the images used in the project.

    4. Define an XML file to create the custom list with a leading image.

    5. Code a Switch detail structure to handle the selection of items.

    6. Open an Android web browser to display a specified Uniform Resource Identifier
    (URI).

    7. Create multiple classes and XML layout files to display pictures of attractions.


    # Creating a List


    The Chicago Guide app begins with a vertical list of attractions on the opening
    screen, as shown in Figure 5-1. The Java class creates the list and makes it scrollable
    if it exceeds the length of the screen. Lists can be used to display-items, your
    personal contacts, receipt names, shopping items, weekly weather, Twitter messages,
    and Facebook posts, for example. You use a ListView to contain the list items.
    Android also has a TableLayout that looks similar to a List, but a ListView allows
    you to select each row in the list for further action. Selecting an item opens
    a web browser to a related webpage or displays an image of the attraction. You
    can directly use the ListView control in the Composite category of the Palette
    in the layout of the emulator (Figure 5-4) as you can with any other user interface,
    but coding the list in Java is the preferred method and is used in the chapter
    project.


