  md: '# CHAPTER 5 Investigate! Android Lists, Arrays, and Web Browsers


    To better understand an intent, imagine a student sitting in a classroom. To ask
    a question or make a request, the student raises a hand. The teacher is alerted
    and responds to the student. An intent works the same way. Your app raises its
    hand and the other apps state that they are ready to handle your request. When
    the chapter project sends an intent, the browser app handles it and opens the
    website.


    > IN THE TRENCHES

    Android platform devices have many options for supported browsers. Popular Android
    browsers include Chrome, Dolphin, Opera, Mozilla Firefox, and UC Browser.


    # Launching the browser from an Android Device


    Android phones have a built-in browser with an intent filter that intercepts requests
    from other apps. The intent sends a URI (Uniform Resource Identifier), a string
    that identifies the web resources. You might already be familiar with the term
    URL (Uniform Resource Locator), which means a website address. A URI is a URL
    with additional information necessary for gaining access to the resources for
    posting the page.


    Depending on the browsers installed on an Android device, Android selects a suitable
    browser (usually a user-preferred browser), which accepts the action ACTION_VIEW
    (which may be in caps) and displays the site. ACTION_VIEW is the most common action
    performed on data. It is a generic action you can use to send any request to get
    the most reasonable action to occur. As shown in the following code syntax, a
    startActivity statement presents the Activity that a new Activity is being started
    and the browser opens the website, in this case the Art Institute of Chicago site:


    # Code Syntax


    ```

    startActivity(new Intent(Intent.ACTION_VIEW,

    Uri.parse("http://artic.edu/"));

    ```


    When the user selects the Art Institute of Chicago intent from the attractions,
    the Switch sets a zero integer value to the states. The case  statement is true,
    the program executes the startActivity statement, which sends the parsed string
    containing the URI web address. The browser application then launches the Art
    Institute of Chicago website. When you tap or click the Back button in some browsers
    or the left arrow to the right of the menu button on the right side of the emulator,
    the previous Activity opens. In the chapter, the attractions list ListView is
    displayed again. To code the startActivity that launches a website in an Android
    browser, follow these steps:


    # STEP 1


    +   * InMainActivity.java, tap or click the blank line after the line containing
    case: inside the Switch decision structure.


    +   * Type startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("http://artic.edu")));",'
