  md: '# Key Terms


    9-patch image—A special image with predefined stretching areas that maintain the
    same look on different screen sizes.


    android:oneshot—An attribute of the animation-list that determines whether an
    animation plays once and then continues to play until the Stop Animation button
    is tapped.


    AnimationDrawable class—A class that provides the methods for Drawable animations
    to create a sequence of frame-by-frame images.


    animation-list—An XML root tree that references images stored in the drawable
    folders and used in an animation.


    Frame animation—A type of animation, also called frame-by-frame animation, that
    plays a sequence of images, as in a slide show, with a specified interval between
    images.


    motion tween—A type of animation that specifies the start state of an object,
    and then animates the object a predetermined number of times or an infinite number
    of times using a transition.


    setInBackgroundResource—A method that places images in the frame-by-frame display
    for animation, with each frame pointing to an image referenced in the XML resource
    file.


    startAnimation—A method that begins the animation process of a View object by
    calling the AnimationUtils class to access the resources necessary to load the
    animation.


    We tween—A type of animation, instead of using a sequence of images, creates an
    animation by performing a series of transformations on a single image, such as
    position, size, rotation, and transparency, on the contents of a View object.


    tween effect—A transition that changes objects from one state to another, such
    as by moving, growing, and shrinking.


