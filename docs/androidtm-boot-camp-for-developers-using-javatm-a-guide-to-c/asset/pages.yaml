  md: '# CHAPTER 3 Engage! Android User Input, Variables, and Operations


    In the Healthy Recipes app developed in Chapter 2, the user tapped or clicked
    a button in the user interface to trigger events, in many applications, users
    enter data and the program uses the data in processing. Engaging the user by requesting
    input customs the user experience each time the application runs. When data entered
    by a user, a common requirement is to perform arithmetic operations on the data
    to generate useful information. Arithmetic operations include include adding,
    subtracting, multiplying, and dividing numeric data.


    To illustrate the use of user data input and arithmetic operations, the Android
    app in this chapter allows the user to enter the number of concert tickets to
    purchase. The application calculates the total cost of the concert tickets. Figure
    3-1 shows the user interface for the named app Concert Tickets with the company
    name Ticket Vault displayed at the top of the screen.


    In Figure 3-2, the user entered 4 as the number of tickets to purchase. When the
    user clicked the FIND COST button, the program multiplied 4 times the concert
    cost ($79.99) and displayed the result as the total cost of the concert tickets,
    as shown in Figure 3-2. To create this application, the developer must understand
    how to perform the following processes, among others:


