  md: '# Preface


    Welcome to Android Boot Camp for Developers Using java: A Guide to Creating Your
    First Android Apps, Third Edition. This book is designed for people who have some
    programming experience or are new to Java programming and want to move into the
    exciting world of developing apps for Android mobile devices on a Windows or Mac
    computer. Google Android is quickly becoming the operating system of choice for
    mobile devices, including smartphones and tablets, with nearly three-quarters
    of the world''s mobile devices running on the Android platform. To help you participate
    in the growing Android market, this book focuses on developing apps for Android
    devices.


    # Approach


    The approach used in Android Boot Camp for Developers Using Java, Third Edition,
    is straightforward. You review a completed Android app and identify why people
    use the app, and then analyze the tasks it performs and the problems it solves.
    You also learn about the programming logic, Java tools, and code syntax how to
    use to create the app. Next, you work through a hands-on tutorial that guides
    you through the steps of creating the Android app, including designing the user
    interface and writing the code. After each step, you can compare your work to
    an illustration that shows exactly how the interface should look or what the code
    should contain. Using the illustrations, you can avoid mistakes in creating the
    app and finish the chapter with an appealing, real-world Android app.


    The main tool used in Android Boot Camp for Developers Using Java, Third Edition,
    is the standard one developers use to create Android apps: Android Studio, a free,
    open-source integrated development environment (IDE). Android Studio includes
    an emulator for testing your apps, so you don''t need a smartphone or tablet to
    run any of the apps covered in this book. Instructions for downloading and setting
    up Android Studio are provided later in this preface.


    # What This Book Is


    This book introduces you to writing apps for Android mobile devices. It familiarizes
    you with the development software for creating Android apps, programming logic
    used in the apps, and Java code that puts the software design and logic into practice.
    You don''t need an Android device because you can run the apps you create by using
    an Android emulator.'
  merge: -1
