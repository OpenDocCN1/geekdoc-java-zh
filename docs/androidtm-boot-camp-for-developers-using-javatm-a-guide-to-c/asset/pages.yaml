    # Getting Oriented with Market Deployment


    The Android platform consists of the Android OS, the Android application development
    tools, and a marketplace for Android applications. After you write and test a
    program, you compile the app into an Android package file with the filename .apk.
    Programs for the Android are sold and deployed through an online store called
    Google Play (play.google.com), which provides registration services and certifies
    that the programs meet minimum standards of reliability, efficiency, and performance.
    Google Play requires that you sign an agreement and pay a one-time registration
    fee ($25). After registration, you can publish your app on Google Play, provided
    the app meets the standards. You can also release updates as needed for your app.
    If your app is free, Google Play allows your app at no cost. If you want to charge
    for your app, your stand is 70 percent of sales for the developer and 30 percent
    for the wireless carriers. For example, if you created an app for your city that
    featured all the top spots, hotels, attractions, and festivals and sold the app
    for $1.99, you would need $1.39 for each app. If you sell 5,000 copies of your
    app, you would earn almost $7,000. You can use Google Play to select a wide range
    of content, including downloadable,'
