    # Key Terms


    Activity—An Android component that represents a single screen.xml with a user
    interface.

    Android Manifest—A file with the filename AndroidManifest.xml that is required
    in every Android application. This file provides essential information to the
    Android device, such as the name of your Java application and a listing of each
    Activity.


    class—A group of objects that establishes an introduction to each object''s properties.


    event handler—A part of a program coded to respond to the specific event.


    ImageView—Control that displays an icon or a graphic from a picture file.


    import—To make the classes from a particular Android package available throughout
    the application.


    import statement—A statement that makes Java functions available to the program.


    instantiate—To create an object of a specific class.


    intent—Code in the Android Manifest file that allows an Android application with
    more than one Activity to navigate among Activities.


    Linear layout—A layout that arranges components in a vertical column or horizontal
    row.


    method—A set of statements that can be included in a Java class.


    method body—The part of a method containing a collection of statements that defines
    what the method does.


    object—A specific, concrete instance of a class.


    Pascal case—Text that begins with an uppercase letter and uses an uppercase letter
    to start each new word.


    Relative layout—A layout that arranges components in relation to each other. Relative
    layout is the default of the emulator.


    ContentView—The Java code necessary to display the content of a screen.'
