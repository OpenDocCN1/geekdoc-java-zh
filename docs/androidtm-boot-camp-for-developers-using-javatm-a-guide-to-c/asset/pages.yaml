  md: '# String Data Type


    In addition to the primitive data types, Java has another data type for working
    with text. The String type is a class and not a primitive data type. Most strings
    that you use in the Java language are an object of type String. String can be
    a character, word, or phrase. If you assign a phrase to a String variable, place
    the phrase between double quotation. In the Concert Tickets app, after the user
    selects a musical group from the Spinner control, the program assigns group to
    a String variable named groupChoice, as shown in the following code:


    # Code Syntax


    ```

    String groupChoice;

    ```


    > GTK

    When defining variables, good programming practice dictates that the variable
    names you should reflect the actual values to place in the variable. That way,
    anyone reading the program code can easily understand the use of the variable.


    > Critical Thinking

    Should assign a postal code to a number variable or a String variable?

    Assign a postal code to a String variable. Assign numbers to a String variable
    when you do not plan to use those values mathematically.


    # Declaring the Variables


