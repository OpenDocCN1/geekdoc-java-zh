    AutoComplete TextView control can suggest the completion of a word after the user
    begins typing the first few letters. For example, if the input is requesting the
    name of a city the user wants to book hotel, you could suggest the completed name
    from a coded list of names that match the prefix extended by the user.


    In the chapter project, the Concert Tickets requests the number of concert tickets.
    This quantity is an integer value you cannot purchase of a ticket. By selecting
    the Number Text Field, users can enter only positive integers from the keyboard.
    The app does not accept letters and symbols from the keyboard, which saves you
    time as the developer because you not have to write lengthy validation code.


