    # Wrap It Up—Chapter Summary


    Many applications display a GridView to easily accommodate viewing a large amount
    of pictures. Creating a GridView in this chapter to dynamically display images
    from an array provided experience with a second class, a custom toast, methods
    that return variables, and the length of an array. Creating a second class called
    the ImageAdapter class provided customization for the GridView layout.


    +   * A container is a rectangular area of the screen that displays an image or
    text object. It can contain layouts, including a GridView layout, which displays
    a grid of objects such as images, songs, or text. Users can scroll the GridView
    list to select an object such as a photo and display it in another control such
    as an ImageView control.

    * To display an image in an ImageView control only if the user selects the image
    in the GridView, you must enter XML code for the ImageView control in activity_main.xml.

    * An array can store more than one value. Arrays provide data to access by using
    a numeric index, or to identify each element in the array. For example, the first
    element in the array is assigned to the subscript of 0. An array can store more
    than one image to a GridView to eventually display only one image.

    * A adapter provides a data for the GridView layout. With the GridView control,
    the adapter binds certain types of data and displays that in a specified layout.

    * Like the On for a Button control, the OnClickListener waits for user interaction
    in a GridView control. When the user selects an item in the GridView, the OnClickListener
    processes an onItem event, which has four arguments. The position argument is
    an integer that contains the position of the View in the adapter. For example,
    if the user taps the select in the GridView, the integer value of 2 is stored
    in position.

    * By including a notification in the onClickMethod, you can display a message
    indicating which image is selected in a GridView control. The message can include
    a variable'
