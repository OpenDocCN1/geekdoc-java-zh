  md: '# Designing an XML TableLayout


    When the user selects the first item in the Bike and Barge app, three images are
    displayed in a table: in Amsterdam, a passenger boat on the Danube River, and
    the Parliament building in Budapest. Each image has a text description in an XML
    TableLayout as shown in Figure 9-2. In Android Studio, a TableLayout can be used
    to arrange images in rows and columns just like in Microsoft Word. Each row in
    a TableLayout is associated with a TableRow instance, which is divided into cells.
    In the project, you create this layout in a new resource file named photos.xml.


    # Critical Thinking


    How can I create a wider TableRow within a TableLayout?

    The size of eachTableRow is determined by the size of the text or image placed
    within the TableRow. If you want the TableRow to be wider, change the size of
    the text or image.


    The string, responsible for the text displayed in the app, has two initial strings
    in the template. The first string is named appName and is displayed in the title
    bar of the tablet. By default, it is Bike and Barge, the application name. The
    second string is title_item_detail and is displayed in the title bar of a smaller
    device such as a smartphone. By default, it is Set to Item. This text should be
    changed to Bike and Barge to create a consistent experience when someone is using
    a tablet or smartphone. An image description appears for each of the three images
    in the app. To create a string for the text descriptions throughout the app and
    to code the XML for photos.xml, follow these steps:


    # STEP 1


    +   - In the Android Project view, expand the values folder within the res.

    - Double-tap or double-click the strings.xml file to display its contents.

    - Tap or click the Open editor link.

    - Tap or click _item_detail in the String and change the text in the Value box
    to Bike and Barge.

    - Tap or click the Add Key button.

    - In the Key text box, txtBarge to name the string.

    - In the Default Value text box, Bikes equipped with gel seats are our mode of
    transportation to view the landscape, history, customs and traditions.

    - Tap or click the OK button, and then tap or the Add Key button.

    - In the Key text box, txtarge to name the string.

    - In the Default Value text box, this luxury boat leaves beautiful Amsterdam and
    7 days in Budapest, Hungary.

    - Tap or click the OK button, and then tap or the Add Key button.'
