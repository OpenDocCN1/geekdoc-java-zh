    # Wrap It Up—Chapter Summary


    In this chapter, the Android platform created a memorable multimedia experience
    with the

    sounds of Hawaiian music. A splash screen provided time to load extra files if
    needed and

    displayed an initial logo for brand recognition. Methods such as setText() and
    setVisibility()

    helped to create an easy-to-use Android application that could use the user. The
    app used

    start() and pause() methods of the MediaPlayer to fill your classroom or home
    with music.


    +   - An Android application can show a splash screen that displays the name of
    the program, a

    brand logo for the application, or the name of the author. The splash screen opens
    as you

    launch your application, providing time for Android to initialize its resources.


    +   - A TextView widget can draw background color or store one of the project''s

    drawable folders.


    +   - A timer in Java executes a one-time task such as displaying an open splash
    screen, or

    performs a continuous process, such as a wake-up call that rings each morning
    at the same

    time. Timers can be used pause an activity temporarily or for time-dependent and
    repeated

    activities. The timer object uses milliseconds as the unit of time.


    +   - After including a reference to the Task in your code, schedule a timer for
    the

    amount of time that an event occurs, as a splash screen being displayed.


    +   - Each Activity has a life cycle, which is the series of actions from the
    beginning of an Activity

    An Activity starts with the onCreate() method, which uses all the resources

    required to perform the Activity. An Activity usually ends with the onDestroy()
    method,

    which releases all resources to free memory on the mobile device. Other activities

    can take during the life of the activity, including onStart(), onResume(), onPause(),nonPause(),
    and onStop().'
