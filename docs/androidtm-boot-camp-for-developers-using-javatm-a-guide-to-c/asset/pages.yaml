  md: "# Date Format\n\nThe DateFormat class in Java, as the name suggests, formats\
    \ the date into a String value and is part of the java.text.DateFormat class.\
    \ By default, the DateFormat class sets the date to the long style for your default\
    \ country with a full representation of the date such as March 17, 2017, in the\
    \ United States. If you were in France, the default format and the country format\
    \ for the same date would be 17 March 2017 because most countries list the day\
    \ before the month.\n\n# Code Syntax\n\n```\nDateFormat fmtdDate = DateFormat.getInstance();\n\
    ```\n\n# DatePickerDialog Input\n\nThe Android platform has multiple dialog boxes\
    \ that allow different types of user input. For example, the DatePickerDialog\
    \ allows you to select a date from a DatePicker, the TimePickerDialog allows you\
    \ to select a time from the TimePicker, and ProgressDialog displays a progress\
    \ bar. The input dialog box has a specialized purpose, a message box to inform\
    \ you how long a time-consuming operation is lasting. In the Sailing Adventures\
    \ app, a DatePickerDialog opens when the users tap the Button. The DatePickerDialog\
    \ is launched in the onClick method, and must be passed the values for year, month,\
    \ and day. For the present date must be set for the DatePicker to display today's\
    \ date. When the DatePicker opens, an OnClickListener is necessary to await the\
    \ user's selection of the desired reservation date.\n\nIn the code syntax discussed\
    \ earlier, notice that c is an instance of the Calendar class. The statement c.set(Calendar.YEAR,YEAR)\
    \ represents the date of the system year, c.set(Calendar.MONTH,MONTH) represents\
    \ the system's month, and c.set(Calendar.DAY_OF_MONTH,OfMonth) represents the\
    \ day of month is set on the system calendar. The manipulation method get accesses\
    \ the system date or time, and set changes the current date or time.\n\n# Code\
    \ Syntax\n\n```\npublic void onClick(View v) {\n    // TODO Auto-generated method\
    \ stub\n    new DatePickerDialog(MainActivity,this,d,c.get(Calendar.YEAR),c.get(Calendar.MONTH),c.get(Calendar.DAY_OF_MONTH)).show();\n\
    }\n```\n\nThe variable d in the code is assigned to the date to be used by the\
    \ user for the sailing reservation, when the OnClickListener is established. Just\
    \ like the listener that awaits user interaction, a second listener is necessary\
    \ to \"listen\" for the"
