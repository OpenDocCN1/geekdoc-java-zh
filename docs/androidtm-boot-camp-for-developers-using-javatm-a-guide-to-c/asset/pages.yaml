  md: "# Customizing the ImageAdapter Class\n\nThe ImageAdapter class must provide\
    \ the information to set up the GridLayout with data and specifications necessary\
    \ for the display. A Context variable is used to load and access resources for\
    \ the application. In the following code, the class variable named context is\
    \ initialized so it can hold each image in the GridView before it is displayed.\
    \ The ImageAdapter is constructed from the MainActivity to handle the Context\
    \ resources necessary for the GridLayout. **Constructors** are used to initialize\
    \ the instance variables of an object. Constructors enable the programmer to set\
    \ default values, limit instantiation, and write code that is flexible and easy\
    \ to read. This command is called a constructor because it constructs the value\
    \ of data members of the class.\n\n# Code Syntax\n\n```\nprivate Context context;\n\
    public ImageAdapter(Context c){\n    context=c;\n}\n```\n\nThis ImageAdapter class\
    \ constructor is where where the Context for an ImageAdapter instance is defined.\
    \ To define the Context for the ImageAdapter, follow these steps:\n\nSTEP 1\n\n\
    +   * Save your work. Tap or click the blank line after the public class ImageAdapter\
    \ extends BaseAdapter { line }.\n* Initialize the Context variable by typing **private\
    \ Context context**;\n* Tap or click context, press Alt+Enter, and select Import\
    \ Class.\n\n**The Context variable is initialized (Figure 7-21).**\n\n| 30 @Override\
    \ | public void onBind(ViewHolder parent, View view, int position, long id) {\
    \ | |\n| 31 | Toast.makeText(parent.getContext(), \"Selected: \" + (position +\
    \ 1), Toast.SHORT_SHORT).show(); | |\n| 32 | setImageResource(R.drawable(position));\
    \ | |\n| 33 | } | |\n| 34 | | |\n| 35 | | |\n| 36 | public class ImageAdapter\
    \ extends BaseAdapter { | |\n| 37 | private Context context; | context variable\
    \ is initialized in the ImageAdapter class |\n| 38 | public ImageAdapter(MainActivity\
    \ activity) { | |\n| 39 | | |\n| 40 | | |\n| 41 | | |\n| 42 | public Context getContext()\
    \ { | |\n| 43 | return context; | |\n| 44 | } |\n| 45 | | |\n\n![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_310_0.png)\n\
    \n283"
