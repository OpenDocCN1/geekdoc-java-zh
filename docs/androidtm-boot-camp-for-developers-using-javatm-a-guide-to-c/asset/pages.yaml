  md: '# Android Text Properties


    The most popular text properties change the displayed text, modify the size of
    the text, and change the alignment of the text. The **text property** uses text
    from a string resource to display within the control. The **textSize property**
    can various units of measurement, as shown in Table 2-2. The preferred unit of
    measurement is often **sp**, which stands for scaled-independent pixels. The reason
    for using this unit of measurement is that if a user sets up an Android phone
    to display a large font size for clarity and easier visibility, the font in the
    app will be scaled to meet the user''s size preference.


    | Unit of Measure | Abbreviation | Example |

    | --- | --- | --- |

    | Inches | in | "0.5in" |

    | Millimeters | mm | "20mm" |

    | Pixels | px | "100px" |

    | Density-independent pixels | dp or dip | "100dp" or "100dip" |

    | Scaled-independent pixels | sp | "10sp"


    **Table 2-2** Measurements used for textSize property


