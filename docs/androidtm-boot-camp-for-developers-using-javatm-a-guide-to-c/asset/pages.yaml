    tasks. When you master these techniques, with the principles of user interface
    design, you will be able to design user interfaces for a variety of programs.


    +   - Instead of adding text directly to a control''s text property, you add it
    to the strings.xml file by working with the String table in the Translations Editor.


    +   - Relative layouts arrange components freely on the screen. Linear layouts
    arrange components in a vertical column or horizontal row.


    +   - Popular text properties for controls include the text property, which specifies
    the string resource for displaying text in the control, and the textSize property,
    which specifies the size of the text.


    +   - To display graphics as pictures and icons in an Android app, you use an
    ImageView control. Before you can place an ImageView control in the emulator,
    you must place a graphics in the resources folder (drawable).


    +   - An Activity is the point at which the application contacts with your users
    and is one of the core components of the Android application. The project has
    two Activities, one for each screen.


    +   - Each screen represents an Activity and each Activity must have a matching
    Java class.


    +   - Every application has an Android Manifest file (named AndroidManifest.xml),
    which provides essential information to the Android device, such as the name of
    your application and a listing of each activity. Android Studio automatically
    adds to each activity.


