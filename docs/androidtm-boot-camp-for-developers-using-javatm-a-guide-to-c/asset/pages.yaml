  md: '# CHAPTER 12 Finale: Publishing Your Android App


    After all the work of designing your Android app, the time to publish it has arrived.
    Similar to the many Android devices available, an Android app can be published
    to a variety of application distribution networks. As an Android developer, you
    can publish your app to Google Play, as well as many other Android app stores,
    such as Amazon Appstore, AppBrain, and SlideME. Because Google Play is the largest
    marketplace, this chapter targets the publication on this Android network. The
    process to publish an app consists of preparing your app for publication, and
    then registering, configuring, uploading, and finally publishing it.


    Before publishing an application, the developer must understand how to perform
    the following processes, others:


    +   1. Test your app.

    2. Prepare the app for publication.

    3. Create an APK package and digitally sign your application.

    4. Prepare promotional materials.

    5. Publish your app to Google Play.


    # Understanding Google Play


    Google Play (https://play.google.com) is a digital repository that serves as the
    storefront for Android devices and apps. It includes an online store for free
    and paid Android apps as well as music'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# Targeting Device Configurations and Languages


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_484_0.png)


    Figure 12-1 Google Play


    +   - GTK

    With Google Play, you can store up to 20,000 songs for free using the cloud services.


    # Targeting Device Configurations and Languages


    To reach a larger audience within the Google Play market, consider targeting multiple
    Android devices and translating your app into multiple languages. The Android
    platform runs on a variety of devices that offer different screen sizes and pixel
    densities. With over 100 Android handheld devices, using flexible design layouts
    that work on many screen sizes and resolutions ensures that your app work on a
    wider range of Android phones and tablets. Creating a custom experience for different
    screen sizes, pixel densities, orientations, and resolutions guarantees that each
    user feels the app was designed specifically for his or her tablet.


    Android users live in every corner of the world and speak hundreds of different
    languages. As you design an app, you can provide alternate resources as app text
    translated into multiple languages change depending on the default locale detected
    on the device. For example, if your language is Spanish, most likely your phone''s
    locale for the dialect is set to Spanish (Spain). If you want your application
    to support both English and Spanish text, you can create two resource directories
    in the strings directory (the strings.xml file) using the Translations Editor.
    By customizing the strings resources files, you can write one application that
    recognizes many local languages. When creating your app in English, remember that
    the majority of the world does not speak English and consider your app''s reach
    to worldwide pool of Android users.


