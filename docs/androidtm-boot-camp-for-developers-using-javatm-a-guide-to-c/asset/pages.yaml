    \ condition is true. If the condition is not true, no statements between the braces\
    \ are executed, and program execution continues with the statement(s) that follows\
    \ the closing brace.\n\n# Using If Else Statements\n\nIn applications, the logic\
    \ requires one set of instructions to be executed if a condition is true and another\
    \ set of instructions to be executed if a condition is false. For example, a program\
    \ requirement may specify that if a student's test score is 60 or greater, a message\
    \ stating “You passed the examination” is displayed, but if the test score is\
    \ less than 60, a message stating “You failed the examination” is displayed.\n\
    \nTo execute one set of instructions if a condition is true, another set of instructions\
    \ if the condition is false, you can use the If Else statement, as shown in the\
    \ following code:\n\n# Code Syntax\n\n```\nif (condition) {\n    //Statements\
    \ completed if condition is true\n} else {\n    //Statements completed if condition\
    \ is false\n}\n```\n\nGTK\nJava automatically indents statements to be executed\
    \ when a condition is true or not true to indicate that the lines of code are\
    \ within the conditional If.\n\n# Relational Operators\n\nIn the syntax of the\
    \ condition portion of the If statement, a condition is tested to determine if\
    \ it is true or false. The conditions that can be tested are:\n\n+   - Is one\
    \ value equal to another value?\n- Is one value not equal to another value?\n\
    - Is one value greater than another value?\n- Is one value less than another value?\n\
    - Is one value greater than or equal to another value?\n- Is one value less than\
    \ or equal to another value?\n\nTo test these conditions, Java provides relational\
    \ operators that are used within the conditional statement to express the relationship\
    \ between the numbers being tested. Table 4-3 shows these relational operators."
