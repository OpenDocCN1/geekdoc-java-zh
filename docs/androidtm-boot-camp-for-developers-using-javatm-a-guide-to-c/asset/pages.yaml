    # Running and Testing the Application


    With all this exciting animation, it is time to see both types of animation running
    in the Android emulator. Tap or click the ''app'' button on the Standard toolbar
    and display the app in the Nexus 5 emulator. Tap or click the START ANIMATION
    button to begin the Frame animation of the four Northern Lights, as shown in Figure
