    # The Background Resource


    The ImageView control named imgLights was coded in activity_main.xml to be coded
    in MainActivity.java to bind the drawable resource to the Background property.
    The Background property of an image can be set to any Background resource as a
    .png file, a 9-patch image, or a solid color designated with hexadecimal code
    as #FF0000. Red special image, called a 9-patch image, is defined "stretching"
    areas that maintain the same look on different screen sizes. These 9-patch graphics
    are named for their name-areas, patches, and that scales. For example, a button
    may change sizes when it is stretched across different factors.


