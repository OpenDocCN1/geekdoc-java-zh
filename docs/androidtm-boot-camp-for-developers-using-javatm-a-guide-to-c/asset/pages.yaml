    # Planning a Program


    As you acquire the skills necessary to design an Android user interface, you are
    ready to learn about the program development life cycle. The program development
    life cycle is a set of phases and stages that developers follow to design, create,
    and maintain an Android program. Following are the phases of the program development
    life cycle:


    +   Gather and analyze the program requirements—The developer must obtain the
    information that identifies the program requirements and document them requirements.


    +   Design the user interface—After the developer understands the program requirements,
    the next step is to design the user interface. The user interface provides the
    framework for the processing that occurs within the program.


    +   Design the program processing objects—An Android app consists of one or more
    processing objects that perform the tasks required in the program. The developer
    must determine what processing objects are required, and then determine the requirements
    of each object. Your design of the user interface plays an important part in keeping
    the overall Android experience consistent and enjoyable to use.


    +   Code the program—After the processing object has been designed, the object
    must be implemented in program code. Program code consists of the instructions
    written using XML and Java code that ultimately be executed.


    +   Test the program—As the program is being coded, and after the coding is completed,
    the developer should test the program to ensure it is executing properly.


    # GTK


    > You can use comments to document your code. Comments are ignored by the compiler.
    When you want to make a one-line comment, use two forward slashes (/), and then
    enter your comment. For example:

    // This is a single-line comment

    Another way to comment is to use block comments. For example:

    /* This is a block comment */


