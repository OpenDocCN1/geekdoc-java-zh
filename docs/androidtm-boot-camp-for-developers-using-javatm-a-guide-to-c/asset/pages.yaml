  md: '# Designing a Tablet Application


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_330_0.png)


    **Figure 8-4** Android tablet


    As you consider creating an Android tablet application, remember that tablets
    are not simply smartphones. The primary use of each device is different. A smartphone
    is most likely used on a trendy mobile phone to quickly check email, update your
    Facebook status, or send a text message between classes or as you runs. Tablets
    are typically used for longer periods of time. This prolonged interaction on tablets
    is more involved, with users sitting down at a table in Starbucks, riding a train,
    or relaxing with the tablet positioned in their laps while watching a movie. Whereas
    phone relies on simplicity, a tablet can handle the complexity of modern graphics,
    more text, and more interaction during longer sessions.


    > IN THE TRENCHES

    To gain inspiration for your tablet best practices, download the YouTube, CNN,
    CNBC, Pulse, WeatherBug, and Kindle apps.


    # Design Best Practices for Tablets


    As you begin designing an Android app, first consider how the user most likely
    will interact with your app. Will the be in his or her lap, with two hands (often
    require this), or in a tablet stand? The user will spend seconds, minutes, or
    hours using your app?


    What is the optimal way to deliver the content? As you consider the answers to
    each of these questions, keep these design guidelines in mind:


    +   * Keep screens uncluttered and touch controls such as radio buttons are of
    sufficient size for user interaction. Large controls are easier to find and enable
    simpler interaction for the user.'
