    # GTK


    Music can be used to provide sound effects to a recent event or to play when you
    are winning the level on your favorite game. Background music is often used as
    a soundtrack to create a theme in an adventure game.


    # The MediaPlayer State


    Android uses the MediaPlayer class to control the playing of the audio file. What
    determines whether the music is called the class of the MediaPlayer. The three
    common states of the audio file are when the music starts, when the music pauses,
    and when the music stops. The state of the music is established by the MediaPlayer''s
    temporary behavior. Table 6-3 provides an example of possible MediaPlayer states.'
