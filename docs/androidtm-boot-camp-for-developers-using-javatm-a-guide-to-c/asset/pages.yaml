  md: '# IN THE TRENCHES


    If you own a data plan phone, tablet, or slate device, download the free app Epicurious
    to get an idea of how this Healthy Recipes app would be used in a much larger
    application.


    # The Big Picture


    To create the Healthy Recipes application, you follow a set of steps that you
    repeat every time you create an Android application.


    +   1. Create the interface, also called an XML layout, for every screen in the
    application.

    2. Create a Java class, also called an Activity, for every screen in the application.

    3. Code each Java class with the appropriate objects and actions as needed.

    4. Test the application in the Android emulator.


    # Using the Android User Interface


    Before any code can be written for an Android application, you design the user
    interface to control the user experience. An Android application can run on various
    factors such as a smartphone, tablet, watch, glasses, televisions, car, and many
    other devices. **Form factor** refers to the screen size, configuration, or physical
    layout of a device. For an Android application, the interface is on the screen
    of any mobile device in which the user interacts with the program. The user interface
    is stored in the res/layout folder in the Android project. The layout for the
    user is stored as XML code. Android-formatted XML code is extremely compact, which
    means applications uses less space and runs faster on the device. Using XML for
    layout also saves you time in developing your code; for example, if you develop
    this recipe for eight human languages, you could use the same Java code with unique
    XML layouts, one for each language. To open the layout of the user interface of
    the Healthy Recipes app and begin the application, follow these steps:


    STEP 1


    +   - Open the Android Studio program.

    - Open the Welcome to Android Studio page of the Android Studio dialog box, tap
    or click the Start a new Android Studio project selection in the Start category.

    - In the New Project dialog box, enter the Application name **Healthy Recipes**.

    - In the Company Domain text box, type **androidbootcamp.net**. The Package name
    displays the Company Domain in reverse order, a, and the text that was entered
    for the Application Without spaces.

    - In the Project location box, type **D:\Workspace (Volumes\USB_DRIVE_NAME on
    a Mac).**


    A new application Healthy Recipes is configured to save on the USB drive (Figure
    2-3).'
