  md: '# CHAPTER 7 Reveal! Displaying Pictures in a GridView


    Using multimedia within an Android program brings personality and imagery to your
    app. Images are a powerful marketing tool and add visual appeal to any Android
    application, but it is essential to create a clean, professional effect with those
    images. To meet this goal, Android provides a layout tool called GridView, which
    shows items in a two-dimensional scrolling grid.


