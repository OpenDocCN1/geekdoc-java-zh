    # Key Terms


    DecimalFormat—A class that provides patterns for formatting numbers in program
    output.


    entries—A Spinner property that connects a string array to the Spinner control
    for display.


    final—A type of variable that can only be initialized; any attempt to assign the
    value results in a compile error when the application is executed.


    GetSelectedItem—A method that returns the text of the selected Spinner item.


    GetText—A method that reads text stored in an EditText control.


    hint—A short description of a field that appears as light text in a Text Field
    control.


    item—In a Spinner, a type of string that appears in a list for selection.


    localization—The use of the String to change text based on the user’s preferred
    language.


    Parse—A class that converts a string into a number data type.


    prompt—Text that displays instructions at the top of the Spinner.


    soft keyboard—An on-screen keyboard positioned over the lower part of an application’s
    window.


    Spinner control—A widget similar to a drop-down list for selecting a single item
    from a fixed listing.


    string—A series of alphanumeric characters that can include spaces.


    string array—Two or more strings.


    strings.xml—A default file that is part of every Android application and holds
    commonly strings in an application.


    theme—A style applied to an Activity or an entire application.


    variable—A name used in a Java program to contain data that changes during the
    execution of the program.'
