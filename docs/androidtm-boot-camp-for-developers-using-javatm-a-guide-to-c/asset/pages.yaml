    # Date, Time, and Clocks


    A Android application purpose is managing calendars and time. Whether you are
    a student or a businessperson, a scheduling app can assist in personal organization
    to remind you about an upcoming test or to pay bill, and an alarm clock can help
    you wake up every morning. Android provides controls for the user to pick a time
    or a date as ready-to-use controls or to code using Java called dialogs. In the
    chapter project, a calendar tool called DatePicker is displayed in a dialog box
    to determine the user''s preferred date for a full-day fishing trip. In the Time
    & Date category in the Palette, many calendar controls are available: TimePicker,
    DatePicker, CalendarView, Chronometer, and AnalogClock, as shown in Figure 18.
    Each picker provides controls for selecting each part of the time (hour, AM/PM)
    or date (month, day, year).'
