  md: "# Creating a Splash Screen\n\nAs an example of the Activity life cycle, the\
    \ native Android application designed for taking a picture using the built-camera\
    \ transitions through each stage in the life cycle. When the user launches the\
    \ camera app, the camera Activity executes the onCreate() method to display the\
    \ opening screen and the image captured through the camera lenses. When the user\
    \ taps a Button to take a picture. The onStop() method is called to hide the live\
    \ image and restore the rest of the app. The onStart() method is called after\
    \ the picture is taken. If the user taps to upload the image to Facebook, the\
    \ onPause() method is called to pause operations of the camera app while the image\
    \ is loaded. The onResume() method is launched after the picture is uploaded to\
    \ reactivate the camera. The user can choose to take another image, which repeats\
    \ the process, or to exit the app. If the user selects exit option, onDestroy()\
    \ or finish() frees the saved resources from the temporary memory of the device\
    \ and clears the camera application.\n\nIn the Aloha Music application, after\
    \ the timer pauses the temporarily, SplashScreen should be destroyed with onDestroy()\
    \ before launching the second Activity. The app should call the onDestroy() method\
    \ from the run() method of the timer task that was invoked by TimerTask. So guaranteeing\
    \ that the ongoing execution is the last task performed. To close the SplashActivity,\
    \ follow these steps:\n\nSTEP 1\n\n+   - In SplashActivity.java, tap or click\
    \ inside the run() auto-generated method stub in Line 22.\n- Type finish()();\n\
    \nThe finish() statement releases the resources that were created for the SplashActivity\
    \ and the Activity (Figure 6-13).\n\n```\n@Override\nvoid onCreate(Bundle savedInstanceState)\
    \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_splash);\n\
    \    TimerTask task = new TimerTask() {\n\n        @Override\n        public void\
    \ run() {\n            finish();\n        }\n    };\n    Timer opening = new Timer();\n\
    \    opening.schedule(task, 5000);\n}\n```\n\nFigure 6-13 finish() method called\n\
    \nSTEP 2\n\n+   - Save your work."
