    # Building the User Interface


    This first Android app will display the simple message, “Hello World – My First
    Android App.” Beyond the tools and gadgets of the Android environment, what will
    stand out is the user experience—how a user feels when using a particular device.
    Ensuring an intuitive interface that does not detract from functionality is the
    key to successful usage. Android supports two ways of building the user interface
    of application: through Java code and XML layout files. The XML method is preferred
    as it allows you to design the user interface of an application without needing
    to write large amounts of code. Both methods and more details about building the
    user interface are covered in later chapters.


    # Taking a Tour of the Android Project View


    The **Android project** view on the left side of the Android Studio window contains
    the key source application folders for the project. As shown in Figure 1-11, the
    Android project includes files in the following folders:


    +   - The **manifests folder** contains the AndroidManifest.xml file, which contains
    all the information about the application that Android needs to run.

    - The **java folder** contains the Java source files for the project.

    - The **res folder** contains all the resources, such as images, music, and video
    files that your application may use. The native editor activity_main.xml is in
    a subfolder of the res folder named layout.


