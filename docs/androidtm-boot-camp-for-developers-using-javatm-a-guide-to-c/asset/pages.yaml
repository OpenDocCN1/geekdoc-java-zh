    that provides patterns for formatting numbers on the Android device. For example,
    the pattern $####,##### establishes a number begins with a dollar sign, displays
    a comma if the number has more than three digits, and rounds to the nearest penny.
    If the pattern $####,##### is used, the number is multiplied by 100 and rounded
    to the first digit past the decimal point. To use a currency format for the ticket
