  md: '# Key Terms


    Android project view—A pane on the left side of the Android Studio program window
    that contains the folders for the current project.


    Android Studio—The recommended IDE for writing Java programs and for building
    and integrating application development tools and open-source projects for Android.


    Android Virtual Device (AVD)—The AVD displays emulator configuration for design
    and layout purposes.


    AndroidManifest.xml—A file containing all the information Android needs to run
    an application.


    app—A mobile application.


    Component Tree—A pane in the Android Project window that displays the structure
    of the emulator layout.


    emulator—Software that duplicates how an app looks and feels on a particular device.


    Google Play—An online store that sells programs written for the Android platform.


    Java—An object-oriented programming language and a platform originated by Sun
    Microsystems.


    java folder—The folder that includes the Java source files for the project.


    layout—A container that can hold widgets and other graphical elements to help
    you design an interface for an application.


    manifests folder—The folder that includes the AndroidManifest.xml file, which
    contains all the information about the application Android needs to run.


    object-oriented programming language—A type of programming language that allows
    good software engineering practices such as code reuse.


    OpenHand Alliance—An open-source business alliance of 80 firms that develop open
    standards for mobile devices.


    open-source system—Organizations and developers can create, modify, and use the
    source code free of charge and copyright restrictions.


    Properties pane—The window that contains the properties and settings of the currently
    project or object.


    property—A characteristic of a project or object that describes what it can do.


    res folder—A project folder that contains all the resources, such as images, music,
    and video files, that an application may need.


    Software Development Kit (SDK)—A package containing development tools for creating
    applications.'
