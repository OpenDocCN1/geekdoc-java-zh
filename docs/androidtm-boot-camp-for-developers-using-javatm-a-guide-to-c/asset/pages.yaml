    +   - In the Android project view, press and hold or right-click the res folder.

    - Tap or click New shortcut menu and then tap or click Android resource directory.
    The New Resource Directory dialog box opens.

    - Tap or click to the right of the Resource type and select raw from the drop-down
    entries.


    A resource directory named raw is created using the New Resource Directory dialog
    box (Figure 6-23).


