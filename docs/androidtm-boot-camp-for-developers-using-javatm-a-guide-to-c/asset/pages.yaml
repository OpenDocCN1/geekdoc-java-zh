    # Adding an Android Virtual Device for the Tablet


    To make your Android app deplo to any device in the Android platform starting
    with Android Honeycomb 3.2 operating system (API 13), which is the first generation
    of API’s dedicated to tablet applications, you can add Android Virtual Devices
    (AVDs) in Android Studio for your intended device and platform. Honeycomb was
    initially designed for the Xoom, the first Android tablet introduced, but newer
    SDKs support the full range of new Android tablet devices on the market. When
    you create an Android tablet app, the minimum required SDK should be to API 13:
    Android 3.2 (Honeycomb) to cover the first generation of Android tablets and the
    target API is automatically set to cover the most recent versions of Android tablets
    covered. Each Android device configuration is stored in AVD. This same technique
    can be used to cover earlier models of smartphone app development.


