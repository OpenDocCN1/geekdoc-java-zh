    # Creating a Raw Folder for Music Files


    In an Android project, music files are typically created in a new resource directory
    called raw, which is a subfolder created in the res folder. The raw resource directory
    must be created before music files can be placed there. The .mp3 files played
    in the Aloha Music app are named ukulele.mp3 and drums.mp3, and they should be
    placed in the raw folder. To create a raw folder that contains music files, follow
    these steps:


