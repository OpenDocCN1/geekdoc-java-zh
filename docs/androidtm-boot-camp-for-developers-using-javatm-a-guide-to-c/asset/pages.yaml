  md: '# Using a Network Connection


    If your device is connected to the Internet, persistent data can be stored and
    retrieved on a web service. Before an attempt to connect to a network connection,
    it should check to see whether Internet connection is available. The device may
    be out of range of a 3G/4G network or the user may have disabled both Wi-Fi and
    mobile data access. If a connection is not available, the user cannot save or
    retrieve the persistent data.


