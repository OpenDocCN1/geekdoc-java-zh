    # Creating a Timer


    When most Android apps opens, a splash screen is displayed for a few seconds,
    preloading database files and information behind the scenes in large-scale applications.
    In the Aloha Music app, a timer is needed to display the splash.xml file for approximately
    five seconds before the Main Activity intent is called. A **timer** in Java executes
    a one-task such as displaying an opening splash screen, or performs a continuous
    process, such as a waking-up call set to run at regular intervals.


    Timers can be used to pause an temporarily or for time-dependent or repeated activities
    such as animation in a cartoon application. The timer object uses milliseconds
    as the unit of time. On an Android device, 1,000 milliseconds is equivalent to
    about one second. This fixed period of time is supported by two Java classes,
    named TimerTask and **Timer**. To create a timer, the first step is to create
    a TimerTask, as shown in the following syntax:


    # Code Syntax


    ```

    TimerTask task = new TimerTask() {

    }

    ```'
