  md: '# Meet the Android


    device called the Android (Figure 1-1). In less a decade, the Android phone market
    has grown into the world''s best-selling phone platform.


    Android is the first open-source technology platform for mobile devices. Being
    an open-source operating system effectively means that no company or individual
    defines the features or direction of the development. Organizations and developers
    can extract, modify, and use the code for creating any app. The rapid success
    of the Android phone can be attributed to the collaboration of the Open Handset
    Alliance (openhandsetalliance.com), an open-source business alliance of 80 firms
    that define standards for mobile devices. The Open Handset Alliance is led by
    Google. Other members include companies such as Samsung, Kyocera, HTC, Texas Instruments,
    and LG. Google has produced its own phone, a modular device, under the name Ara.
    Competitors like Apple, which do not have an open-source coding environment, instead
    work with proprietary operating systems. The strength of the open-source community
    lies in developers'' ability to share their source code. Even the open-source
    software is free, many developers are paid to build and improve the platform.
    For example, proprietary software such as the Apple operating system is limited
    to employees to build a program within the organization. The Android open-source
    platform allows more freedom so people can collaborate and improve the source
    code.


    ![](img/cdd1bcebf9e9fef42bb06c4f42935f2f_30_0.png)


    Many manufacturers utilize the Android operating system on their brand-name phones
    due to its open-source environment. The open-source structure means that manufacturers
    do not pay fees or royalties. With a small amount of customization, each manufacturer
    can place the Android OS on their latest devices. This minimal overhead allows
    manufacturers to sell their phones for relatively low prices, often less than
    $100. Low prices on Android mobile devices have increased the sales and popularity
    of these devices.


    The open-source community also makes Android phones attractive for consumers.
    Android has a large community of developers writing apps that extend the functionality
    of the devices. Users, for example, can benefit from over 1.3 million apps available
    in the Android marketplace, many of which are free. Because the Android phone
    platform has become the leader in the mobile market, the Android application market
    is expected to keep pace.


    +   GTK

    On average, each smartphone worldwide runs 41 apps.


