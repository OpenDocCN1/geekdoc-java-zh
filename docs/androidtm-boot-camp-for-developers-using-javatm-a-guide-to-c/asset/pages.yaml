  md: "# Decision Structure—Switch Statement\n\nEach item in the list produces a result\
    \ when selected, such as opening a web browser or displaying a picture of the\
    \ attraction on a second screen. In Chapter 4, If statements evaluated the user's\
    \ selection and the decision structure determined the results. You can use another\
    \ decision structure called a Switch statement with a list or menu. The Switch\
    \ statement allows you to choose from many statements based on an integer or char\
    \ (character) input. The switch keyword is followed by an integer expression in\
    \ parentheses, which is followed by the cases, all enclosed in braces, as shown\
    \ in the following code syntax:\n\n# Code Syntax\n\n```\nswitch(position){\n \
    \ case 0:\n    //statements that are executed if position == 0\n    break;\n \
    \ case 1:\n    //statements that are executed if position == 1\n    break;\n \
    \ default:\n    //statements that are executed if position != any of the cases\n\
    }\n```\n\nThe integer position is evaluated in the switch statement and executes\
    \ the corresponding case. The case keyword is followed by a value and a colon.\
    \ Typically the statement within a case ends with a break statement, which exits\
    \ the decision structure and continues with the next statement. Be careful not\
    \ to omit the break statement or the subsequent case statement will be executed\
    \ as well. If there is no matching case, the default option is executed. A default\
    \ statement is optional. In the project chapter, a default statement is not necessary\
    \ because the user must select one of the items for an action to occur:\n\n> Critical\
    \ Thinking\nWhen should I use an If statement versus a Switch decision structure?\n\
    \nTechnically these statements are interchangeable, but a Switch statement is\
    \ best when you would otherwise use a list of If statements that all compare the\
    \ value of the variable.\n\nIn the Guide App, five attractions make up the list,\
    \ so the following positions are possible for the Switch statement: case 0, case\
    \ 1, case 2, case 3, and case 4. To code the Switch structure, follow these steps:\n\
    \n# STEP 1\n\n+   On Line 23, within the braces of the onItemClick method, type\
    \ switch(position) and press Enter for the closing brace."
