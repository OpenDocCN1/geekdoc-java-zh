  md: "# Understanding Responsive Design\n\nIN THE TRENCHES\nCycling already in Google\
    \ Play include GPS-based biking routes, personal cycling logs, mountain biking\n\
    trails, bike repair, distance tracking, and cycling fitness to your trip. In addition,\
    \ these apps can often\nbe used on Android watches.\n\nTo create this application,\
    \ the developer must understand how to perform the following\nprocesses, among\
    \ others:\n\n+   1. Create a Master/Detail Flow template app.\n2. Add the items\
    \ to the drawable folder.\n3. Add text to the String table.\n4. Create the photosTable\
    \ XML file for the details pane of the first list item.\n5. Create the tour.xml\
    \ file for the details of the second list item.\n6. Change the default TextView\
    \ widget to a WebView widget.\n7. Update the Android Manifest file to include\
    \ an Internet permission.\n8. Customize the DummyContent class to display the\
    \ list item.\n9. Customize the DummyContent class to connect to the website.\n\
    10. Modify the ItemDetailPage.java class to:\n    a. Display the photos.xml in\
    \ the details pane.\n    b. Display the tour.xml in the details pane.\n    c.\
    \ Display a website in a browser.\n\nGTK\nWatch out for stretched-out look! On\
    \ tablets, single-pane layouts lead to awkward white space and excessive\nline\
    \ lengths. Use padding to reduce the width of UI elements and consider using multipane\
    \ layouts.\n\n# Understanding Responsive Design\n\nWhen mobile devices were developed,\
    \ the apps displayed simple text content designed\nfor small screens, but the\
    \ tablet and smartphone landscape can now handle complicated\nprocesses and full\
    \ web access. This design is especially true for the Android platform.\nInstead\
    \ of creating apps for multiple sizes of Android devices, apps and webpages\n\
