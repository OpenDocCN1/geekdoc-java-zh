  md: '# Designing the User Interface Layout within the Virtual Device


    To assist in designing the Android user interface, the Android SDK includes layout
    files. You can create a layout and then add widgets to the layout. A layout is
    a container that can hold many widgets. A widget is a single element, also called
    an object, such as a TextView, Button, or Checkbox. By default, a TextView displays
    the text Hello World within the emulator. The Properties panel to the right of
    the emulator contains the properties and settings of the currently active Android
    project or object. A property describes what an object can do; for example you
    change the text property of a TextView, the updated text is displayed in the emulator.
    Upcoming chapters demonstrate many layouts, each with unique properties.


    Instead of outpping your app during testing stages of development only on a smartphone,
    Android Studio displays an emulator configuration for design and layout purposes
    called the Android Virtual Device (AVD). Typically a developer tests app on various
    devices to provide a useful and accurate environment. To change the virtual device
    and view the properties, follow these steps:


    STEP 1


    +   Tap or click the virtual device to render the layout with button (the emulator
    button) directly to the Palette on the activity_main.xml tab, and then or click
    Nexus 5 (5.0°, 1080 x 1920, xhdpi). You can test your app using any of smartphone
    and tablet emulators as the virtual device has been installed, throughout this
    select the Nexus 5 emulator.


    The Nexus 5 emulator is displayed on the activity_main.xml tab. Note that Android
    placed a default TextView control in the layout (Figure 1-2).


