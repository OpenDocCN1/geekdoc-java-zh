    sample code:


    # Code Syntax


    ```

    // Add 3 sample items.

    addItem(newDummyItem("1", "Item 1"));

    addItem(newDummyItem("2", "Item 2"));

    addItem(newDummyItem("3", "Item 3"));

    ```


    The command add displays list items in the left pane of the tablet device or in
    the first Activity of a smartphone. You can add add commands if your app has more
    than three items. In the Bike and Barge app, the list items will display the text
    Photos (Item 1), Tour (Item 2), and Web Site (Item 3). This item is different
    from the first two because it selects from the bikebarge.site in the right pane
