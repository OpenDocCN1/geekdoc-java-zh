  md: '# Instantiating the Objects


    All Android devices keep a numeric representation of the system’s current date
    and time. Numbers can be displayed in multiple formats based on the cultural preferences
    of the user’s location. For example, in the United States, the format of dates
    looks like: March 17th, 2016, or 03/17/2016. In Canada and Europe, the date value
    normally precedes the month, like this: 17 March 2016 or 17/03/2016. Similarly,
    some countries use the context of AM and PM with a 12-hour clock, whereas commonly
    use a 24-hour clock. Developers often program these cultural differences based
    on user preference and location.


    Creating a control for the date is crucial because users to type the date in a
    text box can lead to multiple errors, including incorrect format or typos. Websites
    primarily request reservation on some type of control for input in the same way
    that the Sailing Adventures app requests the reservation in a DatePicker to streamline
    the process. Initially, the Sailing Adventures does not display a DatePicker widget.
    The user displays today’s date. Date and time controls are often launched in dialog
    boxes to keep the user interface cluttered.


    # Instantiating the Objects


    In the Sailing Adventures app, the activity_layout opens, displaying the btnDate
    button. When the user interacts with the app and taps the btnDate button, a DatePickerDialog
    opens and displays today’s date in the calendar. After the user selects the date
    of the desired sailing date using the control and taps the OK button at the bottom
    of the calendar, the reservation date is displayed in the txtReservation TextView
    control. The txtReservation TextView is referenced in multiple methods, so this
    instantiation must be declared as a class variable. To instantiate the TextView
    control, Button control, and the Button OnClickListener, follow these steps.


    STEP 1


    +   * Save your work and check the activity_main.xml tab.

    * In the Android Project view, expand the java folder, expand net.android.bootcamp.
    sailingadventures, and double-tap or double-click MainActivity to open it.

    * In MainActivity, tap or click after the class MainActivity extends Activity
    { statement and press the Enter key to insert a blank line.

    * To initialize the class variable, private TextView reservation;

    * Tap or click TextView, press Alt+Enter, and import the class.


    A class variable that can be accessed by the rest of the program is initialized
    (Figure 8-19).'
