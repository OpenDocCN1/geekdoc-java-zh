    # Relative Layouts and Linear Layouts


    The Android interface includes a layout resource designer that organizes controls
    appear on the app''s screens. The Design tab at the bottom of activity_main.xml
    displays the user interface, which uses a resource file defined as a Relative
    layout by default. A **Relative layout** organizes layout components in relation
    to each other as shown in Figure 2-11. This provides more flexibility in positioning
    than other layouts. Each layout can be placed on the emulator by dragging and
    dropping the control on the screen. As shown in Figure 2-11, ImageView controls
    are placed anywhere the developer desires. Using a Relative layout, you can place
    an ImageView, TextView, RadioButton, or Button control to the left of, to right
    of, above, or below another control. Layout resources are stored as XML code in
    the res/layout resource directory for the Android application according to the
    user interface template defined by tapping or clicking the Text tab in activity_main..'
  merge: -1
