  md: '# Creating a Splash Screen


    IN THE TRENCHES

    Android apps can play music on the memory card, download music available for purchase
    or free music-sharing sites, tune in to Internet-based radio stations, or connect
    to music saved in a cloud service.


    To create this application, the developer must understand how to perform the following
    processes, among others:


    +   1. Create a splash screen with a timer.

    2. Design a TextView control with a background image.

    3. Initialize a TimerTask and a timer.

    4. Launch a second Activity.

    5. Design a second XML layout.

    6. Add music files to the raw folder.

    7. Initialize the MediaPlayer class.

    8. Play and pause music with a Button control.


    # Creating a Splash Screen


    The Music app opens with a window that is displayed for approximately five seconds
    before automatically launching the next window. Unlike the project in Chapter
    2 (Healthy Recipes), which required a button to be tapped to bring a click event
    that opened a second screen, this program does not require user interaction to
    open the second activity class. Many Android applications on the market show splash
    screens that often include the name of the program, or identify the author. A
    splash screen opens as you launch your app, providing time for the length of your
    splash screen enables your app to load necessary files.


    > Critical ThinkingnWhat kind of resources are loaded during a splash screen?

    Background processes like loading a mobile device to view a list of inventory
    or images, or making a call over a network, can consume multiple seconds when
    an app is initiated.


    The Aloha Music app, instead of using Main as the name of the initial Activity,
    the opening shown in Figure 6-4 is named SplashActivity. A java file is named
    MainActivity. java is added later in the chapter. The MainActivity is responsible
    for playing the two songs. To start the Aloha application with a splash screen,
    complete the following steps:


    STEP 1


    +   * Open the Android Studio program.

    * On the Welcome to Android Studio page of the Android Studio dialog box, tap
    or click Start new Android Project in the Quick Start.'
