  md: '# CHAPTER 2 Simply! The Android User Interface


    property of each control. After testing the app, your customer decides to change
    all the text within the app. Now you have to check for the original text control
    by control, file by file, including .xml and java files, for all the text you
    have entered, and then replace it. As a time-saving alternative, Android provides
    the strings file inside the Resources folder. If your customer wants to change
    all the text within the app, you can go to a single file location to make the
    changes.


    The items that are displayed in the TextView control in the Healthy Recipes app
    will not be typed directly in the Properties pane, but instead in a string array
    named strings.xml is a default file that is part of every Android application
    and contains many strings for application. You enter text in this file using the
    String table because it can be easily changed without changing code. A string
    is a series of alphanumeric characters that can contain spaces. Android loads
    resources from the project''s String table.


    The String table can also be used for localization. Localization is the use of
    the String table to change text based on the user''s preferred language. For example,
    Android can select text in Spanish from the string table within the Translations
    Editor, by the current device configuration and locale. The developer can add
    multiple translations to the Translations Editor.


    Every string is composed of a key, also called the id property, which is the name
    of a control, and a default value, which is the text displayed with the control.
    In the Healthy Recipes app, the first TextView control displays the Bruschetta
    recipe. The name of control is txtTitle, which is specified in it, and the second
    control on the opening screen is an ImageView which displays image of the finished
    recipe. To create an application that is accessible to those with visual disabilities,
    add descriptions to the user interface controls so can be read out to your by
    a speech-based accessibility service such as a screen reader. To display an description
    of the recipe image for accessibility purposes, add the description text to the
    String table using a key and default value. The Button control that displays the
    VIEW RECIPE specifies btnRecipe as its key and VIEW RECIPE as its default value.
    To add the text for TextView, Image, and Button to the strings.xml file for the
    opening screen, follow these steps


