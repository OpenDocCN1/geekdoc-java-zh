    # RadioButton and RadioGroup Controls


    RadioButton controls are used to select or deselect an option. In the chapter
    project, the user can select that mathematical conversion is needed. When a RadioButton
    is placed on the emulator, by default each control is arranged vertically. If
    you prefer the RadioButtons to be listed horizontally, you can set the orientation
    property to horizontal. Each RadioButton has a label defined by the Text property
    and a Checked property to set either true or false. RadioButtons are typically
    used together in a RadioGroup. Checking other buttons within the group. In other
    words, with a RadioGroup, only one RadioButton can be selected at a time. When
    the RadioGroup container is placed in the emulator window within the Container
    category RadioButton controls are included in the group by default. If you add
    additional RadioButtons, drag them from the Palette into the group. In the case
    of the Medical Calculator app, only two buttons are needed, so the third button
    is deleted.


    To make the user''s input as simple as possible, offer a default selection. For
    example, users more often convert weight from pounds to kilograms, so RadioButton
    option should be checked initially. The Checked property of this RadioButton control
    is set to true to provide a default selection.


    GTK

    Like RadioButtons, a CheckBox allows a user to check or un a listing. A user may
    select any number of checkboxes, checking zero, one, or others. Each checkbox
    is independent of all other checkboxes in the list, so checking one box does not
    affect the others. The shape of a radio button is circular and the checkbox is
    a square.


