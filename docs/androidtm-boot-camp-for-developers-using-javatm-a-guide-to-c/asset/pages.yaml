    # Playing Music


    Every Android phone and tablet has a built-in music player where you can store
    your favorite music. You can also write your applications that offer music playback
    capabilities. To enable the Alpha Music chapter to play two songs, Android includes
    a MediaPlayer that can play both audio and music files from several types of sources.
    You can play audio or video from media stored in the application''s resources
    (a folder named raw), from stand-alone files in the Android file system of the
    device, from an SD (Secure Digital) memory card in the phone, or from a data stream
    provided through an Internet connection. The most common file type of audio supported
    for audio playback with the MediaPlayer class is .mp3, but other audio file types
    such as .wav, .ogg, .midi are typically supported by most Android. The Android
    device platform supports a wide variety of media types supported by the codecs
    included in the device. A codec is a computer technology used to compress and
    decompress audio and video files.'
