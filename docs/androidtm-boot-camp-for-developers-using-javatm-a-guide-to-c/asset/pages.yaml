    In the Aloha Music project, the first user taps a button to start playing the
    music. The start () method is used to begin the playback of the selected music.
    When the user uses the same button, the app temporarily pauses the music by calling
    the pause () method. To restart the music, the start () method must be called.
    To determine the state of the MediaPlayer, the code must assess whether it is
    the first time the user is tapping the button to start the song or if the user
    is tapping twice to play the song. The user can tap the button a third time to
    start the same song. This cycle continues until the user exits the project. In
    the chapter project, an integer variable named playing is initially set to zero.
    The first time the user taps the button, the variable changed to the value of
    1 to assist the program in determining the state of the MediaPlayer. If the user
    taps the same button again to play the song, the variable is changed to the value
    of 0. Android does not have a method for determining the present state of the
    MediaPlayer, but by using this primitive variable, you can keep track of the state
    of the music. A Switch decision structure uses the variable named playing is called
    every time the user selects a button. To initiate the variable to determine the
    state of the MediaPlayer and code a Switch decision structure to determine the
    state, follow these steps:


    STEP 1


    +   - In MainActivity.java, press the Enter key to mpDrums = MediaPlayer.create(this,
    R.raw.drums); statement (Line 28) to create a new line.

    - Type playing = 0; to initialize the variable named playing as the value 0. When
    the user clicks a button, the Switch statement follows the path of case 0, which
    begins the audio playback of one of the songs.


    The variable named playing is initialized as the value 0 (Figure 6-26).'
