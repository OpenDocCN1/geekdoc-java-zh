    The scope of a variable refers to the variable''s visibility within a class. Variables
    that are accessible only to a restricted portion of the program, such as a single
    method, have local scope. Variables that are accessible from anywhere in a class,
    have global scope. A variable needed in multiple methods within a class, the global
    variable is assigned at the beginning of a class, not within a method. This global
    scope variable is called a class variable in Java and can be accessed by multiple
    methods throughout the player.


    Every Android phone and tablet have a built-in music player where you can store
    music. You can also write applications that offer music playback capabilities.
    The media types an Android device platform supports are determined by the codecs
    included in the device. A codec is a computer technology used to compress and
    decompress audio and video files.


    In an Android project, music files are typically stored in the res/raw subfolder.
    In newer versions of Android, you must create the raw subfolder before storing
    music files.


    The MediaPlayer class provides the methods to control audio playback on an Android
    device. First create an instance of the MediaPlayer class to each variable and
    assign a MediaPlayer class to each variable. Whether the music file is playing
    is called the state of the MediaPlayer. The three common states of the audio file
    are when the music starts, the music pauses, and when the music stops.


    The property that determines whether a control is displayed on the emulator is
    the Visibility property. By default, the Visibility property is set to display
    any control you place on the emulator when the program runs. To cause the control
    not to appear, you must code the setVisibility property in Java to change it to
    invisible. To change the visibility of the button to reappear, change the setVisibility
    property to visible.


    # Key Terms


    class variable—A variable with global scope; it can be accessed by multiple methods
    throughout the program.


    codec—A computer technology used to compress and decompress audio and video files.


    life cycle—The series of actions from the beginning, or, of an Activity to its
    end, and destruction.


    local variable—A variable declared by a variable declaration statement within
    a method.


    MediaPlayer class—The Java class that provides the methods to control audio playback
    on an Android device.


    onDestroy()—A method used to end an activity. Whereas the onCreate() method sets
    up resources, the onDestroy() method releases resources to free up memory.'
