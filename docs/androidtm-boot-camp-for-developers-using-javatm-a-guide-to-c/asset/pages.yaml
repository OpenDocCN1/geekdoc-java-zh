    \nThe selected image in the GridView controls displayed in the ImageView control\
    \ with the use of setImageResource(Figure 7-20).\n\n```\n@Override\npublic void\
    \ onClick(AdapterView parent, View view, int position, long id) {\n    Toast.makeText(parent.getContext(),\
    \ \"Selected: \" + (position + 1), Toast.LENGTH_SHORT).show();\n    setImageResource(Animals[position]);\n\
    }\n```\n\nFigure 7-20 ImageView control displays selected GridView picture\n\n\
    > IN THE TRENCHESnAn image can be placed on the surface of a Button by the android:src\
    \ attribute in the XML element or by the setImageResource(int) method of a button.\n\
    \n# Customizing the ImageAdapter Class\n\nAt this point in the project code, the\
    \ GridView and ImageView are initialized, the onClickListener awaits interaction,\
    \ the Toast message and ImageView are prepared for display, but the ImageAdapter\
    \ class is a simple set of auto-generated stub methods. The ImageAdapter class\
    \ was called with this line of code: setAdapter(new ImageAdapter(this)); Recall\
    \ that the ImageAdapter class determines the layout of the GridView. The context\
    \ and images of the GridView need to be referenced within the ImageAdapter. The\
    \ tasks to complete inside the ImageAdapter are to manage the layout of the GridView\
    \ and collect the data sources from an array within the GridView control."
