    When you use SharedPreferences, you can make the data change by using the SharedPreferences
    Editors.


    Writing Persistent Data with SharedPreferences

    One of the most effective ways to save application data to an Android device is
    by using the SharedPreferences object. The data is saved to an XML file as a key-pair
    value. The **key** is a string as "key1" that uniquely identifies the data, and
    the **value** is the data represented as a string, int, long, or Boolean. Android
    SharedPreferences can store data that can be used in features of your application
    or by another application. A common example of using SharedPreferences can be
    in a game like Angry Birds. The Birds need to save the high score from game, the
    user name, and current level achieved.


    In the chapter project, the first data to be stored is the number of years for
    the loan. The SharedPreference for this name is a set of data values: key1 uniquely
    identifies the preference and intYears represents the actual value of the integer.
    A preference can be any of many different types of data. The following data types
    are supported by the SharedPreferences class:


    +   * putString()-Stores values

    * putInt()-Stores integer values'
