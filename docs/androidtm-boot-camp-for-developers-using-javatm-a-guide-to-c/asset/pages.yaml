    # Adding Localization Using the Translations Editor


    The Translations Editor within Android Studio supports multiple languages. Based
    on the default language of your device, you can add translated text as you develop
    an app and have the Translations Editor display the appropriate translation strings
    when the app runs. Localization is the process of adapting an app or webpage to
    manage cultural differences such as whether the language is read left-to-right
    or right-to-left, calendar layout, currency, number formats such as date and time,
    and traditions of your target audience. For example, if an app promises to deliver
    goods on 8/10/2017, Spanish users expect this to be October 8, 2017, while American
    users receive the delivery date as August 10, 2017. Within the Translations Editor,
    the globe-shaped Add Locale localization icon provides access to a list

    ing of locales around the world. To add localization for another country, follow
    these steps:


    STEP 1


    +   - Create an Android Project named Locale in Android Studio with a Blank Activity.


    +   - Expand the values folder in the Android Project view, open strings.xml,
    and then tap or click the Open editor link.


    +   - Tap or click the Add Locale button in the Translations Editor.


    A list of countries is displayed to add app localization (Figure 12-2).'
