  md: '# Creating a Button Event Handler


    Android phones and tablets have touchscreens that create endless possibilities
    for user interaction, allowing the user to tap, swipe, and pin or out to change
    the size of the screen. As you program with this event-driven language, users
    typically see an interface containing controls, buttons, menus, and other graphical
    elements. After displaying the interface, the program waits until the user touches
    the device. When the user reacts, the app initiates an event, which executes code
    in an event handler, which is part of the program respond to the specific event.
    In the Healthy Recipes app, users have only one interaction—they can tap the Button
    control to start an event that displays the bruschetta recipe. When the user taps
    the Button control, for an event listener is necessary to begin the event that
    displays the activity_recipe.xml file on the Android screen. This event is actually
    known as a click in Java code. In the Healthy Recipes application, the MainActivity.java
    code must first hold a reference to the Button object


    +   * Class property to hold a reference to the Button object

    * onClick() method to await the button click action

    * onClick() method to respond to the click event


    The Healthy Recipes application uses a Button control on the screen. To use that,
    a reference is required in the MainActivity.java file. To reference a Button control,
    use the following syntax to create a Button property:


    # Code Syntax


    ```

    Button button = (Button)findViewById(R.id.btnRecipe);

    ```


    The syntax for the Button property includes the findViewById() method, which is
    used by any Android Activity. This method finds a layout view in the XML files
    you created when designing the user interface. The variable in the code contains
    the reference to the Button control.

    After the code is to reference the Button control, you can press Alt+Enter to
    import the Button as an Android widget (Option+Return on Mac). When you import
    the Button type as an Android widget, you make the classes from the Button package
    available throughout the application. An import statement is automatically placed
    at the top of the Java code. An import statement is way of making Java functions
    available to your specific program. Java can perform almost endless actions, and
    not every program needs to do so. So to limit the size of the code, Java has divided
    into packages that can be imported at the top of your code.


    After the Button property is referenced in MainActivity.java, an OnClickListener()
    method is necessary to detect when the user taps an on-screen button. Event listeners
    wait for user interaction, which is when the user taps the button to receive the
    recipe in the case of the project chapter. When an OnClickListener is placed in
    the code, java creates an onClick'
