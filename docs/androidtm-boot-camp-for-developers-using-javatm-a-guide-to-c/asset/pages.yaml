    tap or click TWEEN ANIMATION button. The Tween animation rotates the image six
    times in a complete cycle and ends. Practice changing the orientation of your
    emulator.


    # Wrap Up—Chapter Summary


    Android supports two types of animation: frame-by-frame and Tween animations,
    as shown in the Northern Lights animation application in this. Frame-by-frame
    animation shows different drawable images in a View in the opening window. The
    second Activity displays a Tween animation that rotates an image. Using the animation
    methods provided in the Android environment, developers can explore the user interface
    layouts to provide more usability and interest.


    +   Frame animation assigns a sequence of images as a slide with a specified interval
    between images. Tween animation performs a series of transformations on a single
    image, such as changing its position, size, rotation, and transparency.


    +   To create a Frame animation, you write code in an XML file to load a sequence
    of images from the drawable folder. In the XML code, an animation-list root element
    references these images. Each item in the animation-list specifies how many milliseconds
    to display'
