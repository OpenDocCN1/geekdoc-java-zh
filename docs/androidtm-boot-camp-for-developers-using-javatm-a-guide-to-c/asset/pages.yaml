  md: 'The two-part pair specifies a name for the data you want to save and the actual
    value. The pair is saved to an XML file that can be retrieved later in the app
    or after the app closes. To save data in a SharedPreferences file, the following
    steps must be completed when writing persistent data:


    +   - Obtain an instance of the SharedPreferences file.

    - Create a SharedPreferences.Editor object.

    - Assign values to SharedPreferences objects using the getString() method.

    - Save the values to the preferences file using the commit() method.


    #  Using Internal Storage


    Another option when saving persistent data is to store the information directly
    on the device''s internal drive. The saved files on the device are available only
    to the app that created the files. Other applications cannot access files saved
    with the internal storage. Use caution when storing internal files, low internal
    storage space can drastically affect the speed of an Android device and battery
    life.


    # Using External Storage


    Android apps can save persistent data to external storage, for example, the device''s
    SD (Secure Digital) card. All applications can read and write files on the external
    storage and the Android smartphone or tablet can remove them. To use external
    storage, the following permissions are necessary in the Android Manifest file:


    ```

    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE''/>

    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE">

    ```


    # Using SQLite Databases


    If you have a large amount of data to store as persistent data, a database is
    the perfect choice. The default database for Android is SQLite. SQLite stands
    for Structured Query Language and is a lightweight, preloaded mobile database
    engine, which has been available since the Cupcake 1.5 version of Android and
    occupies a small amount of disk memory. The data is stored within the SQLite database
    so it persists after the app is terminated. In contrast to a traditional database,
    SQLite is embedded into the user''s program or browser. By using a SQLite database,
    Android maps data items in tables and columns, with optional relationships between
    the entities within the database. The tables can be queried using SQL statements.


    > Critical Thinking

    Does Android SQLite store the information in a managed interface on the smartphone?

    No. Android SQLite is created by the app creating that handles all the operations
    required to deal with the database such as creating the database, adding tables,
    and updating records.'
