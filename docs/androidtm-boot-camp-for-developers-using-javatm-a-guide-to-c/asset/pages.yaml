  md: '# CHAPTER 10 Move: Creating Animation


    # Coding a Tween Rotation XML File


    In the Northern Lights application, the last image (lights4.png) is rotated when
    the user taps or clicks the START ANIMATION button. Android uses an XML creator
    that supports different resource types. The default resource type is Layout, but
    in the project, you select Tween animation. After entering the XML filename as
    rotation.xml, tap or click the root element of rotate to store the rotation.xml
    code for a Tween animation in the /res/anim folder. Recall that the XML file for
    a Frame animation is stored in the /res/drawable folder. The rotation.xml statements
    are shown in the following code:


    # Code Snyp


    ```

    <?xml version="1.0" encoding="utf-8"?>

    <rotate

    :android="http://schemas.android.com/apk/res/android"

    android:fromDegrees="0"

    android:toDegrees="359"

    android:pivotX="50%"

    android:pivotY="50%"

    android:duration="2000"

    android:repeatCount="5">

    ```


    The rotation code defines the attributes of the Tween animation. Notice the effect
    is set to rotate in the second line. The FromDegrees and toDegrees attributes
    spin the object from 0 to 359 degrees, which makes 360 degrees for a full circle.
    The image in the chapter project completes with pivotX and pivotY pivot an object
    from setting the pivot point, which can be a fixed coordinate or a percentage.
    By default, the object pivots around (0,0) coordinate, or the upper-left corner
    of the object. Notice pivotX and pivotY are set to 50% in the code example, which
    determines that the location is from the center of the object. The duration for
    each rotation is for 2000 milliseconds. The RepeatCount represents how many times
    the object rotates after the initial rotation. You can set RepeatCount to an integer
    or to "infinite" if you do not want the rotation to stop. Remember that the number
    of rotations is always one greater than the repeat value, if you set the RepeatCount
    to the integer 5, the object rotates six times. It rotates initially and then
    repeats the rotation four times. By creating an XML file, it is easier to make
    simple changes to fine-tune the animation. You might want to try different values
    in the rotation.xml to see the animation changes. To code the Tween animation
    to rotate an image, follow these steps:


    # STEP 1


    +   - Save and close the activity_tween.xml layout file.

    - To create a new rotation XML file, press or right-click the res folder.

    - Tap or click New on the shortcut menu, and tap or click Android resource file.
    The New Resource dialog box opens.'
