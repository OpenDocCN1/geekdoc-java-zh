  md: '# Preparing Promotional Materials to Upload


    Google Wallet Merchant Center. You can allow an unlimited number of people to
    access your Google Play developer account. You will remain the owner of the account
    and will be the only person who can grant or revoke access to other users.


    The registration process requires you to have a Google account, agree to the legal
    terms, and pay the fee via your Google Merchant account. If you charge for your
    app, Google Merchant disperses revenue for application sales. If you register
    to sell applications, you must also be registered as a Google Merchant with your
    Google Wallet. As a developer, you have access to your app ratings, comments,
    and number of downloads. If you charge for your application, you will receive
    70 percent of the commission price, with the remaining 30 percent distributed
    among the phone carriers. The profit after your first sale arrives in your Google
    account 24 hours later. After a purchaser buys and installs an app, or her credit
