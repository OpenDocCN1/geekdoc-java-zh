    # Customizing a Launcher Icon


    Instead of using the built-in generic Android icon, you can display a custom launcher
    icon on the home screen. The custom icon image can be automatically placed in
    the res\mipmap folder by adding an image asset with a built-in wizard in Android
    Studio. The Image Asset wizard creates multiple icons for different resolutions
    and provides a live preview of the resized icons. The Image Asset wizard allows
    and replaces the current launcher icon named ic_launcher.png with a custom icon
    of your choice. To perform the following steps, you need an image file ic_launcher_weight.png,
    provided with your student files, to use as the custom launcher icon for the Medical
    Calculator app. You should already have the students for this text that your instructor
    gave you or that you downloaded from the webpage for this book (www.cengage.com).
    To begin the chapter project, add a customized launcher icon and select a theme,
    by following these steps:


