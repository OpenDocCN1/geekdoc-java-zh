  md: 'In the animation-list, you can include the oneshot property to determine how
    many times to play the animation. The oneshot property is set to true by default,
    meaning the animation plays once and stops. Set the oneshot property to false
    to have the animation repeated through to the end and then again from the beginning.


    When you add the XML file with the animation-list code to the Android project,
    select Drawable as the resource type and select animation-list as the root element
    so that Android stores the file in the res/drawable folder.


    The AnimationDrawable class provides the methods for drawable animations to create
    a sequence of frame-by-frame. In Android development, frame-based animations and
    image transitions are defined as drawables.


    You can set the Background property of an image to any full Drawable resource
    as a .png file. In MainActivity.java, you must specify the ImageView control that
    can bind the drawable resources to the Background property. Assign a new image
    to the ImageView control that was originally defined in the activity_main.layout.
    Use the setBackgroundResource to connect the animations in the animation-list
    to the instance of ImageView.


    In MainActivity.java, also include an instance of AnimationDrawable and assign
    it the background of the animation images. Android constructs an AnimationDrawable
    object before setting it as the background. The animation is now ready to display
    the images, though it does not actually starting until the start( ) method is
    triggered.


    You can use the start() and stop() methods of the drawable objects to control
    Frame Animation. When the user taps begins playing the animation continuously
    if the oneshot property is set to false. The animation stops only when the user
    taps another button to execute the stop( ) method. The code can then initialize
    a startActivity that launches another activity.


    A Tween animation manipulates a Drawable image by adding tween effects, which
    are predefined transitions that change an object from one state to another. Save
    a tween effect within an animation XML file. Specify the Resource type of this
    XML file as Tween so that Android stores the file in the res/anim/ folder of your
    project.


    The XML file for a Tween animation defines rotate attributes as number of degrees
    to spin, the pivot location, the rotation duration, and the number of times to
    repeat the rotation.


    To launch a Tween animation, use the startAnimation method, which begins a View
    object by calling the AnimationUtils class utilities to access the resources it
    needs to play the animation.


