    # # The Android Manifest File


    An Android project is made up of far more than the XML layouts that create the
    user interface. The other components of any Android project are the Android Manifest
    file and the Java code in the classes. The Android Manifest file is necessary
    in every Android application and must be named AndroidManifest.xml exactly. The
    Android Manifest provides all the essential information to the device, such as
    the name of your application, a listing of each activity, any permissions needed
    to access other functions such as the use of the Internet, services, broadcast
    receivers, and the minimum level of the Android API. This file lets the Android
    system know what the components are and under what conditions they can be launched.
    AndroidManifest.xml is like a project manager of a business determines which activities
    are scheduled, the permissions that are necessary, and the devices needed to get
    the job done.


    Android Studio automatically adds each activity you create to the Android Manifest.
    In the Healthy Recipes app, the Android Manifest is only aware of the initial
    activity named MainActivity. To see which activities an application contains,
    if expand the manifests folder, and then double-tap or double-click the AndroidManifest.xml
    file in the Project view as shown in Figure 2-28. Notice that Line 11 calls an
    activity named MainActivity. The intent in Lines 13-17 is to launch the opening
    screen. Line 20 calls the second activity named Recipe. The AndroidManifest.xml
    must contain an entry for each activity.'
  merge: -1
