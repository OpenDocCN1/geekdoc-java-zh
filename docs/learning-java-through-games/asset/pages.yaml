    > Note that multiplication in Java is denoted by "*", while division is denoted
    by the character "/". This is standard for most programming languages. The second
    line of code calculates the value of the coefficient by which we multiply the
    temperature in Celsius. Note that the command does two: it declares the variable
    c as a double (i.e., a real number with double precision) and sets the value of
    c. Note that every variable must be declared before it is referenced. It is also
    the case that every variable can be defined only once. The third line sets the
    value of y. Java allows arbitrary expressions. Since multiplication has higher
    priority than addition, the multiplication of c and x will be done first and then
    32 will be added. Conversely, if we wanted the addition to be done first, we could
    have used braces as.


    ```

    y = (32 + c)*x;

    ```


    Since parentheses have the highest precedence, the addition will be performed
    first and then the multiplication.


    It is worthwhile to examine the assignment operator (a.k.a., =) in greater details.
    The left-hand side must always be a variable. Writing the following code simply
    does not sense.


    ```

