  md: "# Classes Revisited\n\nThe runtime type of an object is what the object references.\
    \ The compile-time type of an object is what it is defined to be. For example,\
    \ consider the following code: FictionalCharacter c = new Superhero(). The runtime\
    \ type of the c will be Superhero, while the compile-time type of the c object\
    \ will be FictionalCharacter.\n\nNote that polymorphism uses the runtime type\
    \ of object to decide which version of a method to call and ignores the compile-time\
    \ type of the object. Alternatively, polymorphism does not apply to static methods\
    \ and the compile-time type of the object is used to determine which version of\
    \ the method to call.\n\nThe getClass method actually returns an object of type\
    \ Class. Such an object is created for every class. One can call the getName()\
    \ to get the string description of an object of type Class. As well as the new\
    \ syntax Superhero.class. The code refers to the Class object of type Superhero.\n\
    \n# 8.12 Cloning Objects\n\nOnce a fictional character is created, it may be nice\
    \ to have the ability to clone them. After all, we may need several Batmans to\
    \ fight off the evil Joker. Inside the Object class, a clone method is already\
    \ defined. However, this method is defined as protected. Therefore, Java has to\
    \ override it as public before we can use it. The reason is that the default clone\
    \ method that defined inside the Object class does not copy inner objects. Consider\
    \ the following simple example.\n\n```\npublic class FictionalCharacter implements\
    \ Cloneable{\n    private String name;\n    private Address address;\n    public\
    \ FictionalCharacter(){\n    public FictionalCharacter(String name, Address address){\n\
    \        this.name = name;\n        this.address = address;\n    }\n    public\
    \ String toString(){\n        return name + \" lives at \"+address;\n    }\n \
    \   protected Object clone() throws CloneNotSupportedException{\n        return\
    \ super.clone();\n    }\n}\n```\n\n```\npublic class Address{\n    private String\
    \ streetName;\n    private int number;\n    public Address(){}\n    public Address(String\
    \ streetName, int number){\n        this.streetName = streetName;\n        this.number\
    \ = number;\n    }\n```"
