  md: "# 7.4 The Interface of ArrayList\n\nSince ArrayList is a class, the interface\
    \ of objects of type ArrayList is a lot different than the interface of arrays.\
    \ For example, the interface [] to access the element of an array is not supported.\
    \ An element of an ArrayList can be accessed using the get(i) method, where i\
    \ is the index of the element. The size method returns the numbers of elements\
    \ in the ArrayList. This differs from the variable length, which returns the size\
    \ of the array and not the number of elements in it. In fact, the variable length\
    \ is not defined for an ArrayList because by definition, ArrayList can store a\
    \ variable number of elements and does not have preset capacity. To demonstrate\
    \ how ArrayList works, the following methods convert an ArrayList of employees\
    \ to an array of employees.\n\n```\npublic static Employee[] convert(ArrayList<Employee>\
    \ emps) {\n    Employee[] result = new Employee[emps.size()];\n    for (int i=0;\
