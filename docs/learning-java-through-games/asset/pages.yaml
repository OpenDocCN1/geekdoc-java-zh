  md: '# Exception Handling and Files


    A method can use the syntax throws. This means that instead of handling the exception,
    the method passes the exception to the calling method. As a result, it will be
    the job of the calling method to handle the exception.


    The third retry is clever. The getNumber method only returns a single piece of
    data. When, the getNumber method does not raise an exception, the line repeat
    = false is executed and the loop is maintained. Now there is no need to send any
    argument to getNumber. If the user does not enter an integer, then the catch block
    does nothing and the block of the loop needs to be repeated.


    Note that we can rewrite the code for the getNumber method as follows.

    ppublic static int getNumber() throws InputMismatchException{


    However, since we write InputMismatchException class inherits from the Exception
    class, both versions are fine. This means the getNumber method will now handle
    any type of exception and will throw back to the originating method. Alternatively,
    the code throws InputMismatchException means the method will only throw back to
    the calling method exceptions of InputMismatchException. If the method generates
    an unchecked exception of a different type, for example as a result of dividing
    by 0, the program will crash. If we want to specify that a method handles exceptions
    of several types, then we can separate the exception classes by commas.


    We need to be careful when we write code that can raise exceptions. If a method
    in your program raises an unchecked exception and the exception is not handled,
    the program will crash and the stack trace will be printed. Alternatively, code
    that generates a checked exception that is not handled will simply compile.


    Although we use an if-else statement, a try-catch-finally block acts in a much
    different fashion. Let us consider the following example.

    public static int f(int n){

    int r = 0;

    try{

    r = n*n;

    return r;

    }

    finally{

    if (n==2) return r+1;

    }

    }


    The obvious question is what will be returned by the method. The secret to answering
    the question is knowing that the finally block is always executed. Therefore,
    the code has two return statements! The return statement in the try block will
    return 4, while the return statement in the finally block will return 5. It turns
    out that the method will return 5 because the second return statement is the last
    to be executed.


    The code in the finally block will always be executed. If there is a return statement
    in the finally block, then the method will rely on this statement to compute the
    return value. The only way to skip executing the finally block is to directly
    exit the program before writing System.exit(0). The last command terminates the
    program with exit code 0.'
