    There are two general types of software: *operating system software* and *application
    software*. Operating systems software provides the interface between the hardware
    of the computer and the application software. For example, the operating system
    of a computer allows programs to access input and output devices, such as the
    keyboard, the hard disk, the mouse, and the monitor. Most modern operating systems
    also provide Graphical User Interface (GUI) to the system. A different responsibility
    of the operating system is to allow programs to execute concurrently and share
    resources, as as the main memory and the hard disk. The application software in
    a computer is made up of the programs that are run by the end users. These include
    games, office software, and web browsers.


    # 1.5 Type of Programming Languages


    Computer software can be written using different programming languages. A programming
    language of first generation is machine code. This is a sequence of zeros and
    ones that the computer can understand. Such code can be represented, for example,
    in hexadecimal. A typical machine instruction is read data that is stored in a
    location of memory. The problem with machine code is that it is low level and
    difficult for humans to interpret. A second-generation programming language is
    referred to as *Assembly language*. Now the instructions are written using English
    words (e.g., add, sub, move, etc.). There is a straightforward mapping between
    code written in an assembly language and machine code. The disadvantage of Assembly
    is that it is a very low level language and writing code is difficult. A third-generation
    programming language provides high-level access to the data. Examples include
    C, C++, and Java. An advantage of a high-level programming language is that the
    programmer does not need to deal with physical'
