  md: "# Classes Revisited\n\nJava automatically casts an object that belongs to a\
    \ subclass to an object that belongs to the superclass. The reverse is not true.\
    \ However, an object that belongs to the subclass can be explicitly cast to an\
    \ object of type superclass. However, a ClassCastException will be raised if the\
    \ super object variable does not actually reference an object of the subclass\
    \ type.\n\nFor example, if the FictionalCharacter class was not abstract, the\
    \ following line would produce a compilation error.\n\nSuperhero s = (Superhero)\
    \ new FictionalCharacter();\n\nThe reason is that s refers to an object of type\
    \ FictionalCharacter and therefore does not support variables such as goodPower.\
    \ However, the syntax Superhero implies that the s object must have the variables\
    \ goodPower and respect associated with it. The second magical feature of our\
    \ program is that the correct toString method of character of the ArrayList is\
    \ what happens. When Java uses the syntax element.toString(), it determines the\
    \ object element refers to. If element refers to an object of type Superhero,\
    \ then the toString method is is executed. Otherwise, if element refers to an\
    \ object of type Villain, then the toString method of the Villain class is executed.\
    \ This magical property of always finding the right method to execute is called\
    \ polymorphism. This was chosen because the toString method takes many forms and\
    \ the correct one is always executed.\n\nWhen the Java compiler sees the syntax\
    \ o.m(...), where o is an object variable and m is an instance variable, it is\
    \ ignored. Java only considers the object o refers to. Suppose that this object\
    \ belongs to the C class. If the C class contains the method with the correct\
    \ parameters, then the method is executed. Otherwise, Java searches the superclass\
    \ of the C class for the m method. The search continues until Java reaches the\
    \ root or inheritance hierarchy (or on later). Note that if neither C nor one\
    \ of its ancestors contains the m method, then the code o.m(...) will not compile.\
    \ The reason is that the C class must be either the class to which the object\
    \ belongs or one of its descendants in the inheritance hierarchy.\n\nLet us examine\
    \ the following code from the main method.\n\n```\nfor (FictionalCharacter character:\
    \ characters){\n  System.out.println(character.toString());\n}\n```\n\nWe did\
    \ not need to add the call to the toString (it is automatically called for the\
    \ method println), but we did so in order to make the example clear. The variable\
    \ characters is an ArrayList of objects of type FictionalCharacter. The variable\
    \ iterates over the elements of the ArrayList. Even though the variable character\
    \ is FictionalCharacter, Java disregards this type when it tries to find the correct\
    \ method to execute. If the character object references a superhero, then the\
    \ toString method from the Superhero class is executed. Alternatively, if the\
    \ character object references a villain, then the toString method from the Villain\
    \ class is executed. Note that in order for the code to compile, the FictionalCharacter\
    \ class or one of its superclasses (or, in general, ancestors in the inheritance\
    \ hierarchy) must contain the toString method. However, this is not necessarily\
    \ the toString method that will be executed."
