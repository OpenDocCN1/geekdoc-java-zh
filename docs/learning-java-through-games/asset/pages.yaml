    Note that there are four methods in the MyApplet class. All four methods override
    methods from the JApplet class. The init method is the first method that is called.
    Its job is to initialize the local variables, get data from the user, and display
    different GUI components.


    The same applet can be started multiple times. Every time the applet starts, the
    start method is called. The start method is initially called immediately after
    the init method. The start method will also be called if the web browser decides
    to restart the applet. For example, consider a resource-intensive applet that
    displays 3D animation. If the user navigates away from the applet''s web page,
    the web browser will stop the applet. At this point, the stop method will be called.
    If the user navigates back to the web page, the start method will be to resume
    the animation, while the job of the stop method is to stop animation. Note that
    the stop method is also called just before the applet is terminated (e.g., the
    user closes the browser). The destroy method is called just before the applet
    is terminated by the web browser.


    Consider the above program. It creates a panel and adds it to the applet. The
    paintComponent of the panel displays the current value of i and the last method
    called. Note that the value of i starts at 0 and is incremented by 1 every time
    one of the four methods is called. As expected, our applet application does not
    have a main method, methods that make the applet visible, or methods that set
    the title or size of the applet. All these parameters are specified from the HTML
    file. In NetBeans, you can select the applet, right-click on it, and run. NetBeans
    will emulate a web browser and start the applet. NetBeans also automatically creates
    a .html file in the build subdirectory of the project. We can launch this file
    from a web browser to see the feel of our applet in different web browsers.


    # 15.3 Creating Popup Windows


    One may get the impression that a Java Applet is stuck inside a web browser. That
    is, we cannot create our own windows, with size and so on. This is not the case.
    The following code demonstrates how we can incorporate our Calculator program
    into a web browser. The applet launches the Calculator program in a new window.


    ```

    import java.awt.event.*;nimport java.swing.*;


    public class MyApplet extends JApplet {

    public void init() {

    JButton cancelButton = new JButton("Calculator");

    JFrame frame = new JFrame("");

    frame.setSize(200, 200);

    frame.add(new CalculatorPanel());

    cancelButton.addActionListener(new ActionListener() {

    public void actionPerformed(ActionEvent e) {

    frame.setVisible(!frame.isVisible());

    }});

    }}

    ```'
