  md: "Nested static classes are public can be accessed from everywhere by specifying\
    \ the name of the outer class followed by a dot and the name of the nested classes.\
    \ Within the outer class, nested static classes can be accessed directly by specifying\
    \ only the name of the class.\n\nNote that nested classes can be defined without\
    \ an access privilege modifier. Alternatively, they can be defined using the private\
    \ keyword. Such classes will only be visible within the outer class. Although\
    \ uncommon, nested classes can also be defined as protected. Then they will be\
    \ accessible within the package and within the subclasses of the outer class.\n\
    \nThe new code for the typing game seems a little more complex. We did not have\
    \ to create a new outer class. Probably, we do not want anyone outside the TypingGame\
    \ class to be aware of our nested class and can define it as private.\n\nThe classes\
    \ Double and Float inside the class Rectangle2D are of nested static classes.\n\
    \n# 10.2.2 Inner Classes\n\nNested classes in Java that are not static called\
    \ inner. In order to show an example of an inner class, let us refract our program\
    \ and create a separate class that handles populating the ArrayList with random\
    \ characters.\n\n```\npublic class TypingGame{\n    public static void main(String[]\
    \ args) throws Exception {\n        new PopulateChars();\n        JFrame frame\
    \ = new JFrame().setVisible(true);\n    }\n}\\public class PopulateChars {\n \
    \   ArrayList<Character> charList;\n    public PopulateChars() {\n        charList\
    \ = new ArrayList<Character>();\n        Timer timer = new Timer(200,new TimerListener());\n\
    \        timer.start();\n    }\n\nprivate class TimerListener implements ActionListener\
    \ {\n    public void actionPerformed(ActionEvent e) {\n        charList.add((char)\
    \ ('a' + (int) (Math.random() * 26)));\n        System.out.println(charList);\n\
    \    }\n}\n}\n```\n\nNow the TimerListener is an inner class for the PopulateChars\
    \ class. A nice feature of inner classes is that they have access to the variables\
    \ of the outer class. For example, the actionPerformed method has access to the\
    \ charList in the outer class. However, note that there can be multiple instances\
    \ of the PopulateChars class. therefore every object of the TimerListener class\
    \ must be associated with exactly one object that belongs to the PopulateChars\
    \ class. If this is not the case, the reference to the variable charList can be\
    \ ambiguous. Figure 10.1 shows how the object that belongs to the TimerListener\
    \ class must be related to an object of the outer class."
