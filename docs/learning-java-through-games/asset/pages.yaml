    # 7.8 Important Points


    +   1. The classes Integer, Character, Double, and String, others, are immutable.
    In other words, we cannot modify objects that belong to these classes. If we try
    to do so, new objects are created. As a consequence, if a method tries to modify
    a formal parameter object that belongs to an immutable class, the changes will
    not be seen by the calling method.


    +   2. If we want to modify the characters of a String, then we need to create
    a StringBuffer instead.


    +   3. An ArrayList takes input as a type parameter. This parameter must be the
    name of a class and cannot be the name of a primitive (e.g., int, double, or char).
    To allow an ArrayList of primitive type, the wrapper classes Byte, Short, Integer,
    Long, Float, Double, Character, and Boolean are supported by Java.


    +   4. If we want to associate a value with the constants of an enum type, then
    we need to include a private constructor and a getter method.


    +   5. Do not use the set method to add new values to an ArrayList. Instead, use
    the add method. The set method should be used to change existing values of an
    ArrayList.


    +   6. The size method for an ArrayList returns the number of elements in the
    ArrayList. This is different from the variable length for an array that returns
    the capacity of the array. An ArrayList has no capacity. We can insert in it many
