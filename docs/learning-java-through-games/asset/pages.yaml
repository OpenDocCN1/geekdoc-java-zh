    +   * <HTML> </HTML> ⇒ Start and end of an HTML file.


    +   * <HEAD> </HEAD> ⇒ Creates the HEAD part of an HTML document.


    +   * <HEAD> <TITLE> TITLE </TITLE></HEAD> ⇒ Sets the title of the document to
    TITLE.


    +   * <H3> ... </H3> ⇒ Creates text with size H3.


    +   * <P> ... </P> ⇒ Creates a paragraph that is separated by lines.


    # Important Points


    +   1. When Java files are compiled, Java code is created in the form of .class
    files. For an applet, these files are shipped and executed at the client. The
    client must have the Java Virtual Machine (JVM) software to execute the .class
    files.


    +   2. An applet does not have a method. Instead, it overrides the init method
    of the Applet class.


    +   3. The code of a Java Applet cannot set title, size, location, and so on.
    All parameters are set in the HTML file.


    +   4. Only the web browser can open an applet. Therefore, an applet should not
    have code that terminates the applet.


    +   5. Use the codebase property to define the directory of the .class files.
    Resource files, such as images, can be created in a sub True of the codebase directory.


    +   6. The HTML code <APPLET codebase="classes" code="TicTacoe.class" width =
    350 height=200></APPLET> inserts an applet with code directory classes (relative
    to the directory that contains the .html file). The code of the applet is in the
    file TicTacoe.class. The applet will be displayed in a 350 x 200 pixels rectangular
    area inside the web browser.'
