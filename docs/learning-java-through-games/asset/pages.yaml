    array will be as follows.

    7 6 3 2 1 10.


    The second pass of the sort will work exactly the same way as the first pass (i.e.,
    going from left to right swapping numbers), but it will stop one number short
    of the end (i.e., it does not have to read the number 10 we know that 10 is the
    biggest number in the array). If the input contains n numbers, then n-1 passes
    of the array will sort it.


    Write a method that sorts an array of integers using bubble sort. The method can
    use an auxiliary method that swaps two entries in the array. Use a nested loop
    to implement the bubble sort. The method should modify the input array and have
    void return type. Test your method with different inputs.


