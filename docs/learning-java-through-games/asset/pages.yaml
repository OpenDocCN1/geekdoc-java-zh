  md: "}}):\n\n}\n\nthe mouseMoved method is called when the mouse is moved without\
    \ a mouse button being pressed. The mouseDragged method is called when the mouse\
    \ is moved while one or more buttons are pressed. Note that we should not use\
    \ the code getButton() in this case because one mouse button could potentially\
    \ be pressed. Instead, when writing code for the mouseDragged method, we should\
    \ always call the getModifiersEx method. It will return code that shows us which\
    \ buttons are pressed.\n\nNote that the behavior of the getModifiersEx method\
    \ is a little tricky to understand. If we do an experiment, we will see that methods\
    \ return 1024 when the left mouse button is pressed, 2048 when the middle button\
    \ is pressed, 4096 when the right button is pressed, 3072 when both the left and\
    \ middle button are pressed and so on. In other words, Java will return all combinations\
    \ when the left button is pressed. However, this is the wrong approach because\
    \ no guarantee that the getModifiersEx method will not return different values\
    \ in the Java version.\n\nLet us look in greater detail at the codes that are\
    \ returned by the getModifiersEx method. If the left button is pressed, then the\
    \ number 1024 is returned, if the binary number 0000 0100 0000 0000 is returned.\
    \ If the middle button is pressed, then the binary number 0000 0010 0000 0000\
    \ is returned. If the left and middle button are pressed, then the number 0000\
    \ 0110 0000 0000 is returned. In other words, it is a bitmap mask for each mouse\
    \ button. If more than one button is pressed, then the combination of masks of\
    \ the buttons is returned. If we try to check the constant MouseEvent.BUTTON1_DOWN_MASK,\
    \ then we will get the binary 0000 0100 0000 0000. This corresponds to just the\
    \ left button being pressed. The operation \"&\" and bitwise operator performs\
    \ the operation on each pair of bits. The result is 1 when both buttons are one.\
    \ In other words, we can think of it as true or 0 as false. Suppose that we want\
    \ to evaluate the result of the expression getModifiersEx() & MouseEvent.BUTTON1_DOWN_MASK.\
    \ getModifiersEx() returns 0000 0100 0000 0000 and MouseEvent.BUTTON1_DOWN_MASK\
    \ is equal to 0000 0100 0000 0000, then we will get the following result.\n\n\
    ```\n0000 1100 0000 0000\n0000 0100 0000 0000\n\n      (result of &)\n0000 0100\
    \ 0000 0000\n```\n\nIn other words, the result is different from 0, which means\
    \ that the left mouse button is pressed. Alternatively, if we want to check if\
    \ the right mouse button is pressed, then we can write the following code:\n\n\
    ```\ngetModifiersEx() & ( MouseEvent.BUTTON1_DOWN_MASK | MouseEvent.\nBUTTON2_DOWN_MASK)\n\
    ```\n\nNote that the \"|\" is the bitwise operator. The resulting bit is 1 if\
    \ one of the input bits is 1. In this expression, the right-hand side of | will\
    \ create a result that has two 1s in its binary representation. If the left-hand\
    \ side has one of these 1s set (i.e., the left or middle button is pressed), then\
    \ the expression will evaluate to a number that is different from 0.\n\nOn a side\
    \ note, one might be tempted to use & instead of && and | instead of ||. This\
    \ is certainly possible. However, the operations are not equivalent. For example,\
    \ the && operation will not evaluate the second argument if the first argument\
    \ is false. Conversely, the & operation evaluates both arguments."
