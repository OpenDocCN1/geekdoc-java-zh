  md: "# Nested Classes and Event Handling 221\n\n2. Instantiate an object of that\
    \ class. This will be the event listener.\n\n3. Register the event listener with\
    \ the event source (e.g., a window or a panel).\n\nNote that a keyboard is pressed\
    \ and then released, the keyPressed, keyReleased, and keyTyped methods of the\
    \ event listener will be called in that order. Here is an example of creating\
    \ a key listener object.\n\n```\nclass MyKeyListener implements KeyListener {\n\
    \    public void keyPressed(KeyEvent e) {\n        char c = e.getChar();\n   \
    \     if (charList.contains(c)) {\n            charList.remove((Character) c);\n\
    \        }\n        System.out.println(charList);\n    }\n    public void keyReleased(KeyEvent\
    \ e) {}\n    public void keyTyped(KeyEvent e) {}\n}\n```\n\nMyKeyListener keyListener\
    \ = new MyKeyListener();\n\nNote that all methods take input as an argument. When\
    \ the event occurs, the corresponding method is called and the event is passed\
    \ as a parameter. For key events, the event is KeyEvent. The getChar() method\
    \ for the event returns the key on which the event occurred. Note that the class\
    \ at Line 5 of code is required. If it is not present, Java will take the ASCII\
    \ code of the character and remove it from the ArrayList with that index. The\
    \ keyPressed method finds the key and removes it from the ArrayList if present.\
    \ At the end, the ArrayList is redplayed. Note that the contains method of the\
    \ ArrayList class checks to see if the element belongs to the ArrayList.\n\nOften,\
    \ when writing listeners, one does not want to override all the methods of the\
    \ interface that we are inheriting. For example, the interface for a mouse listener\
    \ has five methods and one rarely needs to override all of them. To help the programmer,\
    \ abstract classes were added to the Java library that contain empty implementation\
    \ of the methods for most interfaces. For example, there is a KeyAdapter class\
    \ that contains empty implementation of the three methods of the KeyListener interface.\
    \ Here is an example of how the class can be used.\n\n```\nclass MyKeyListener\
    \ implements KeyAdapter {\n    public void keyPressed(KeyEvent e) {\n        char\
    \ c = e.getChar();\n        if (charList.contains(c)) {\n            charList.remove((Character)\
    \ c);\n        }\n        System.out.println(charList);\n    }\n}\n```\n\nMyKeyListener\
    \ keyListener = new MyKeyListener();\n\nThis saves some space because we choose\
    \ which methods to override. After the key listener is created, we need to register\
    \ it with the event source (in our case this will be a JFrame frame). Here is\
    \ an example of what one can do.\n\n```\nJFrame frame = new JFrame();\nframe.addKeyListener(keyListener);\n\
    ```"
