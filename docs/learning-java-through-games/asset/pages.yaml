  md: "# Learning Java through Games\n\nNote that sometimes a method with the same\
    \ name and parameters can exist in the inner class and the outer class. Here is\
    \ an example of how such method can be called.\n\n```\npublic class PopulateChars\
    \ {\n    ArrayList<Character> charList;\n    public PopulateChars() {\n      \
    \  charList = new ArrayList<Character>();\n    }\n    public void printChars()\
    \ {\n        System.out.println(charList);\n    }\n    public class TimerListener\
    \ implements ActionListener {\n        public void actionPerformed(ActionEvent\
    \ e) {\n            charList.add((char) ('a' + (int) (Math.random() * 26)));\n\
    \            PopulateChars.this.printChars();\n        }\n        public void\
    \ printChars() {\n        }\n    }\n}\n```\n\nThe syntax is PopulateChars.this.printChars()\
    \ which belongs to the PopulateChars class, gets this reference (i.e., the reference\
    \ to the outer object), and the printChars method on it. Conversely, the syntax\
    \ PopulateChars.printChars() can be used to call static method of the outer class\
    \ when a method with the same name exists in the nested class.\n\n# 10.2.3 Local\
    \ Classes\n\nDeclaring a class inside a class is useful when we want to quickly\
    \ define a class without creating a new class. As we saw, nested classes are particularly\
    \ useful for event handling. However, one needs to create an object that belongs\
    \ to a class inside of a method. For example, when we need to create a callback\
    \ method, we can just create an object that supports this method. Such class is\
    \ called a local class and can have a name, but it is usually anonymous. The object\
    \ can belong to a new class that is created on the fly. Note, however, if the\
    \ class is not given a name, then it cannot be reused to create more objects of\
    \ the class. Here is how typing program can be rewritten using anonymous local\
    \ classes.\n\n```\npublic class TypingGame {\n    public static void main(String[]\
    \ args) {\n        final ArrayList<Character> charList = new ArrayList<Character>();\n\
    \        Timer t = new Timer(200, new ActionListener() {\n            public void\
    \ actionPerformed(ActionEvent e) {\n                charList.add((char) ('a' +\
    \ (int) (Math.random() * 26)));\n                System.out.println(charList);\n\
    \            }\n        });\n        t.start();\n        JFrame frame = new JFrame();\n\
    \        frame.setVisible(true);\n    }\n}\n```"
