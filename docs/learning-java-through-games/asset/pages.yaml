    and make the program more efficient. In other words, the bubble sort, insertion
    sort, and selection sort are good for sorting small arrays. The quick and merge
    sort perform better on bigger arrays. Creating an algorithm that is a combination
    of two sorting algorithms can give us the best of both worlds. For example, this
    is the approach used in implementing the Arrays.sort and Collections.sort methods.


    # 14.5 Summary


    The chapter describes the mechanisms behind recursive calls. It gives examples
    of recursion and how recursion can be used to implement binary search and different
    sorting algorithms. Recursion is described in this book because it is an important
    programming technique. For example, it is not obvious how to solve the Tower of
    Hanoi or implement merge sort without recursion. On the other hand, one should
    not go overboard recursive methods and the iterative approach is preferred when
    possible because it has less overhead.


    The chapter also briefly describes dynamic programming. This is a bottom-up approach
    that calculates the result starting with small problems and merging the results.
    It is an alternative to a recursive algorithm in some cases and it is the preferred
    choice when applicable. The chapter also covered the tail of recursion. This is
    a scenario where all the recursive calls are at the end of the execution paths
    of the method. The chapter shows how tail recursion can be easily rewritten into
    an iterative solution that uses an infinite loop.


