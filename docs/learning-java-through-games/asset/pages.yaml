    # 13.6 Important Points


    +   1. There are two types of exceptions: *checked* and *unchecked*. Java forces
    us to handle checked exceptions. Conversely, unchecked exceptions do not have
    to be handled, but if an exception is generated but not handled, the program crashes.


    +   2. When handling an exception in the `catch` blocks, always start with the
    most specific exceptions and then continue with the more general exceptions. If
    this rule is not followed, then the later `catch` blocks could never be executed
    and a syntax error will be generated.


    +   3. A finally block is always executed. Use a `finally` block to close files
    and resources.'
