    is no means complete. It covers only the basic GUI components and it is a good

    starting point for creating GUI components. The chapter also covers dialog boxes.
    They are

    similar to windows, but they cannot be minimized or maximized. A dialog box can
    also be

    modal, which means that it must be closed before the user can interact with the
    rest of the

