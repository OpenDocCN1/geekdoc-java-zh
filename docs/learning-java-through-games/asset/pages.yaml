    Clifford Von Wickler in the early 1900s. Each player has a ten-by-ten board on
    which they can place different types of ships.

    The board of player can be represented as a two-dimensional array. The objective
    of the game is to sink the ships of the other. Look at Figure 5.4. All attacked
    spots are marked with an "X". You can see that the player was successful in sinking
