  md: "# Learning Java through Games\n\n![](img/efbd24814b512af8a3101a141a2f07a6_115_0.png)\n\
    \nFIGURE 5.3: Example of shallow copy.\n\n**Shallow copy** is when you copy the\
    \ address of an array, but not the array itself. The result is having two variables\
    \ that point to the same array. Any change to the array using one of the variables\
    \ will affect the other variables. This behavior is undesirable and shallow copying\
    \ should be avoided.\n\nNext, let us fix the problem and make sure that changes\
    \ to the b array do not affect the array. Below is a possible solution.\n\n```\n\
    public class Test {\n    public static void main(String [] args) {\n        int\
    \ a[] = new int[] {2,23,14,12,23};\n        int b[] = new int[6];\n        for\
    \ (int i=0; i<a.length; i++){\n            b[i] = a[i];\n        }\n        b[3]=7;\n\
    \        System.out.println(a[3]);\n    }\n}\n```\n\nNow, as expected, the final\
    \ value of a[3] will be 12. Any way to make a and b independent arrays, modifying\
    \ an element in one of the arrays does not affect the other array, is to use a\
    \ **for loop**. The loop copies all the elements from the a to the b array one\
