    +   - try{ ... } finally { ... } ⇒ The code in the finally block is always executed.


    +   - InputMismatchException ⇒ Exception that occurs when the user enters the
    wrong type. For example, the program expects an integer and the user double.


    +   - ArrayOutOfBoundsException ⇒ Exception that occurs when the user accesses
    an index of an array that is out of the elements of the array.


    +   - ArithmeticException ⇒ Exception that occurs as a result of arithmetic operations,
    for example, division by 0.


    +   - FileNotFoundException ⇒ Exception that occurs when the program tries to
    open a file that does not exist.


    +   - Exception ⇒ The main exception class. All other exception inherit from it.


    +   - throw new("...") ⇒ Creates and throws a new exception.


    +   - e.printStackTrace(); ⇒ Prints the stack trace when the exception occurs,
    that is, order of methods that were called.


    +   - try(open file() { ... } catch(Exception e) { ... } ⇒ Opens a file. If an
