    Since arguments in Java are passed by value and every method can return at most
    one entity, it is not obvious how to write a method that returns five values.
    This is the reason why the variables for the dice are declared as global variables.


    The getRandomDieValue method simply returns a random number between 1 and 6 (the
    value of dice). It can be implemented as shown below.


    ```

    public static int getRandomDieValue() {

    return (int) (Math.random()*6+1);

    }

    ```


    Recall that Math.random() returns a random double between 0 (inclusive) and 1(exclusive).
    Multiplying it by 6 will give us a double in the range [0,6]. Adding one will
    shift the range to [1,7]. When this double is cast to int, the result will be
    an integer between 1 and 6.


    Our code has so many drawback: it is not versatile. For example, suppose we decide
    to modify the game to four dice instead of five. A significant portion of the
    code we will need to duplicate the code five times: for every die (the, rollDice
    method).


    It will be beneficial if we can combine the variables d1, d2, d3, d4, and d5 so
    that we can declare them in a single statement and we can manipulate them using
    a single loop. This will make the code more compact. Compact code is not only
    easier to write, but also easier to maintain (on average, 70% of the cost to develop
    commercial software goes into maintenance). For us, arrays come to rescue!


    An array allows us to declare multiple variables of the same type in a single
    statement. For example, if we need to create one hundred instead of five dice,
    defining one hundred variables will surely be impractical. However, using an array
    we can create as many dice as we in a single statement.


    In Java, an array is declared using the new keyword.


    ```

    new int[100];

    ```


    The above line creates an array of one hundred integers. Initially, the array
    will be populated with zeros. In general, the new keyword is used to create a
    object, where an array is a special kind of object. The operator returns a reference
    to the object. The best way to think of this reference is as unique identifier
    of the object. This identifier can be used by the Java Virtual Machine to quickly
    locate the object. The new keyword does not return the address of the object because
    the Java Virtual Machine may move the object during the execution of the program,
    while the unique identifier remains constant. Consider the following.


    ```

    System.out.println(new int [100]);

    ```


    A possible result is: "I@3e25a". This means that the allocated space is for an
    array of integers. 3E25A5 is the hexadecimal representation of the result of applying
    a function to'
