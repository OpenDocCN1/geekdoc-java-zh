  md: "# Nested Classes and Event Handling\n\nWe use anonymous local classes when\
    \ we want to create an object from a class and we will never need to refer to\
    \ the class again.\n\nNote the unused syntax for creating anonymous classes. We\
    \ write new ActionListener(). However, this does not mean that we are creating\
    \ a new object of type ActionListener. After all, actionListener is an interface\
    \ and it is illegal to instantiate an object from it. We are actually creating\
    \ a new object that belongs to a class with name X, where we are not naming the\
    \ X class. It is required that the X class inherits from the ActionListener class.\
    \ In other words, the code is equivalent to the following code.\n\n```\npublic\
    \ class TypingGame {\n    public static void main(String[] args) {\n        final\
    \ ArrayList<Character> charList = new ArrayList<>();\n        class X implements\
    \ ActionListener {\n            public void actionPerformed(ActionEvent e) {\n\
    \                charList.add((char) ('a' + (int) (Math.random() * 26)));\n  \
    \              System.out.println(charList);\n            }\n        }\n     \
    \   Timer t = new Timer(1000, new X());\n        t.start();\n        JFrame frame\
    \ = new JFrame();\n        frame.setVisible(true);\n    }\n}\n```\n\nThe only\
    \ difference between the above and the original rewrite is that the X class is\
    \ given a name. However, since the X class will be referenced only once, the first\
    \ version of the code is preferred. It is shorter and more intuitive. Consider\
    \ again the anonymous class creation.\n\n```\nTimer t = new Timer(200, new ActionListener()\
    \ {\n    public void actionPerformed(ActionEvent e) {\n        charList.add((char)\
    \ ('a' + (int) (Math.random() * 26)));\n        System.out.println(charList);\n\
    \    }\n}\n```\n\nThe code creates a timer that will be executed every 200 milliseconds.\
    \ Every 200 milliseconds, the syntax that circumvents the fact that Java allows\
    \ only an object, and not a method, to be a method parameter.\n\nThe observer\
    \ reader may have noticed that the variable charList was changed to final. This\
    \ is no coincidence.\n\nA local class can access only the constant (i.e., final)\
    \ variables of the method in which it is defined. The reason is that an object\
    \ that belongs to a local class can continue to exist after the method terminates.\
    \ Local variables that are defined as final are preserved so that they can be\
    \ accessed long after the method has terminated. The reason they are preserved\
    \ is because they are defined as final and will therefore not change."
