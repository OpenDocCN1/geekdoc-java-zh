    \ be used to modify an existing element of an ArrayList. It cannot be used to\
    \ create an element at a position that does not exist. For example, the following\
    \ code will generate IndexOutOfBoundsException.\n\n```\nArrayList<Employee> emps\
    \ = new ArrayList<Employee>();\nemps.set(0,new Employee(\"John\"));\n```\n\nThe\
    \ reason is that code tries to change the element at position 0, but an element\
    \ at position 0 does not exist. The correct approach is to use the add method\
    \ to insert an element in the ArrayList. Here is the correct version of the code\
    \ above.\n\n```\nArrayList<Employee> emps = new ArrayList<Employee>();\nemps.add(new\
    \ Employee(\"John\"));\n```"
