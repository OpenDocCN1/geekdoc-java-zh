    # 3.5 The Modulus Operation


    In this section of the chapter, we will cover the remainder (a.k.a., modulus)
    operation. In math, when two integers are divided, there is a remainder. For example,
    when the number 25 is divided by 3, the result is 8 and the remainder is 1. In
    Java, the operator % is used to represent the remainder operator. For example,
    25%3 will give us the number 1. Note that 25/3 is 8 because Java implements integer
    division. In other words, 25 = (25/3)*3+1. Therefore, another way to think about
    the remainder operation is to ask, what is the difference to the closest number
    that is equal or less than the dividend and divisible by the divisor. In other
    words, writing n%a is equivalent to n-(n/a)*a.


    In order to demonstrate how the modulus operation works, us create a simple application
    that converts a decimal number into a hexadecimal number. The program will take
    a number as input and will keep dividing the number by 16. Every time the division
    is performed, the remainder will be saved as a character in the String variable
    if.'
