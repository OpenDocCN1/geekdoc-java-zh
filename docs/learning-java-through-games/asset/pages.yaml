    Number is even! Try again!\");\n            } catch (Exception e) {\n        \
    \        System.out.println(\"Something went wrong! Try again!\");\n         \
    \   }\n        }\n    }\n}\n\nclass EvenException extends Exception {\n    public\
    \ EvenException() {\n        super(\"Even number exception\");\n    }\n}\n```\n\
    \nFirst, note that we created our exception class. As expected, our exception\
    \ class inherits from the Exception class. The constructor passes the name of\
    \ the exception to the Exception class. Next, let us examine the main method.\
    \ An InputMismatchException will be generated when an integer is not entered.\
    \ Similarly, an EvenException will be generated when an even number is entered.\
    \ The throw keyword is used to generate a new exception. Our code has three catch\
    \ statements: if the user enters something that is not an integer, if the user\
    \ enters an even number, and if something else goes wrong.\n\n> Extra catch blocks\
    \ are taken in the ordering of the catch blocks. We should always order them from\
    \ the most specific exception to the most general exception.\n\ncatch(Exception\
    \ e) was the first exception, then there is no catch that another block will be\
    \ executed. When an exception object is generated, Java checks the first catch\
    \ statement. If the exception object does not belong to the class in the first\
    \ catch statement, then Java proceeds to the next catch statement and so on. On\
    \ a side note, if the catch blocks are not ordered correctly from the most specific\
    \ to the most general one, the program will simply not compile."
