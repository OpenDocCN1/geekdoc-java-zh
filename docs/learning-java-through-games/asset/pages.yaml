  md: "# 214 Learning Java through Games\n\n```\nimport java.awt.event.*;\nimport\
    \ javax.swing.Timer;\nimport java.util.*;\npublic class TypingGame {\n    public\
    \ static void main(String[] args) {\n        Timer t = new Timer(200,new ActionListener());\n\
    \        t.start();\n        JFrame frame = new JFrame();\n        frame.setVisible(true);\n\
    \    }\n}\n```\n\n```\nclass TimerListener implements ActionListener {\n    ArrayList<Character>\
    \ charList = new ArrayList<>();\n    public void actionPerformed(ActionEvent e)\
    \ {\n        charList.add((char)('a'+int)(Math.random()*26)));\n        System.out.println(charList);\n\
    \    }\n}\n```\n\nFirst, note in the Java standard libraries there are several\
    \ classes that are named Timer. Here, we want to use the class that is defined\
    \ in java.swing.Timer. Note that we cannot simply import java.swing.*; The reason\
    \ is that there is another Timer class in the package java.util and Java will\
    \ not know which one to use. Note that the above code needs to be in the file\
    \ TypingGame.java. Remember that every Java file can have several classes, where\
    \ exactly one of them can be public. The class that public must have exactly the\
    \ same name as the name of the Java file.\n\nThe first parameter of the constructor\
    \ determines the delay between method calls in milliseconds. The second parameter\
    \ of the constructor is an object that belongs to a class that implements the\
    \ ActionListener interface. Here is the code that defines the interface (it is\
    \ part of java.util.*).\n\n```\ninterface ActionListener {\n    public void actionPerformed(ActionEvent\
    \ e);\n}\n```\n\nAfter the timer is started, the actionPerformed method will be\
    \ repeatedly invoked. The Timer class knows that it can call the actionPerformed\
    \ method on the input object because the object must belong to a class that implements\
    \ the ActionListener interface. The start method is used to start the timer. If\
    \ we want to stop it, we can use the stop method.\n\nThe last lines of the main\
    \ method create a window and make it visible. This prevents the program from immediately\
    \ terminating. The actionPerformed method creates a random character, and prints\
    \ it to the ArrayList. Note that the cast (char) can convert an integer to the\
    \ character that has ASCII code. The code also explicitly references 'a', which\
    \ is converted to the ASCII code of 'a': 97. Note that hard-coding the number\
    \ 97 in the program would be an inferior choice because the ASCII table can potentially\
    \ change. The code in the actionPerformed method generates a new random character,\
    \ adds it to the ArrayList, and then the ArrayList is printed. Every 200 milliseconds,\
    \ the actionPerformed method is called."
