    \ equal: {20,3,6} and {11,45,2}. Each of the halves will be sorted recursively.\
    \ The result will be the halves: {3,6,20} and {2,11,45}. As a final step, the\
    \ two halves will be merged. At every step of the merge, the front of each of\
