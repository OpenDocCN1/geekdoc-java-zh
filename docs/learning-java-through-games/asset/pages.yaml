    The chapter teaches how to write Java code that responds to events. We will show
    how to write code that responds to keyboard strokes, mouse movement, window closing,
    and so on. Since Java is an object-oriented language, we cannot directly tell
    Java to execute a method when an event occurs. Instead, we need to create an object
    that supports the method needs to be executed when the event occurs and pass this
    object as a parameter. In other words, event handling is supported in Java by
    creating new classes and objects which can be burdensome. To simplify the code,
    Java allows us to create a class within a class and even within a method. The
    chapter describes the different ways of creating nested classes in the context
    of event handling.


    # 10.1 The Timer Class


    We will start this chapter with the Typing Game. The objective of the game is
    to type characters faster than they appear on the screen. We will create an ArrayList
    of characters, where the ArrayList will be initially empty. Every 200 milliseconds
    (1/5 of a second) we will add a new character to the list and if the user types
    that we will remove the character from the list and redraw it. The player wins
    if we are able to stay alive for more than 30 seconds. We lose if the list becomes
    longer than 10 characters. We will allow duplicate characters in the list.


    When implementing the game, we want to tell Java to execute a method that adds
    a character to the list every 200 milliseconds. However, Java does not allow us
    to send a method name as a parameter to another method. Instead, we need to create
    a new class that implements the method and pass it as an instance of that class.
    For example, Java contains a Timer class that can be used to call a method periodically.
    Consider the following'
