    \ when we divide two variables, we cannot simply put .0 at the end of the variable.\
    \ We need to either cast the variable to a double or multiply it by 1.0. For example,\
    \ Line 11 can also be rewritten as follows.\n\nThe result of an arithmetic operation\
    \ that takes input two integers is an integer. However, an operation that takes\
