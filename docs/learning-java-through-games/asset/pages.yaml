    339


    +   2. Always start a recursive method with the base cases. Add the recursive
    calls after that. If this rule is not followed, then the method may not terminate,
    that is, the method may run forever (a.k.a., infinite recursion).


    +   3. Avoid recursion when possible. An iterative solution is usually faster
    and takes less memory.


    +   4. There is a limitation to using a recursive method. Since the size of the
    stack grows with every recursive call, it is easy to get a stack overflow error
    if there are too many recursive calls.


    +   5. Tail recursion is when there is a single recursive call that appears at
    the end of every execution path. A recursive method that uses tail recursion can
    be easily rewritten into a non-recursive method that uses an infinite `while`
    loop.


    +   6. Dynamic programming represents the bottom-down approach. When applicable,
    dynamic programming can be useful to avoiding performing the computations multiple
