    # 1.6 Brief History of Computer Games


    One of the first computer games was developed in the Brookhaven National Laboratory
    in 1958. The name of the game was "Tennis for Two". A knob was used to define
    the trajectory and a button was used for hitting the ball. An oscilloscope was
    used for displaying the ball on the screen. A screen shot of the game is shown
    in Figure 1.4.


    ![](img/efbd24814b512af8a3101a141a2f07a6_29_0.png)


    **FIGURE 1.4:** The game Tennis for Two. The screen shot is taken from a video
    made by the Brookhaven National Laboratory, a United States Government laboratory.


    Later, in 1971, the game Spacewar! was introduced. It is considered to be one
    of the first commercial games. It is a two-player game. Each player has control
    of a spaceship and attempts to destroy the other player. One thousand and five
    hundred coin-operated consoles were created and placed in malls throughout the
    United States. See Figure 1.5 for a screen.


    One year later, in 1972, the game Pong was introduced to the general public. It
    is widely believed to be the first video game and 19,000 consoles were sold. The
    game is played by two players. It has a moving ball and players try to keep the
    ball inside the playing area using a paddle. A screen shot of the game is shown
    in Figure 1.6.


    One of the first color games was Space Invaders and it was produced by Atari in
    1978. It involves defending the Earth from alien invaders by shooting rockets
    at them.'
