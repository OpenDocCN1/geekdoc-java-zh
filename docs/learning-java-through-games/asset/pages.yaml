    # 10.7 Important Points


    +   1. There are four types of nested classes: nested static, inner, local, and
    local anonymous. A nested static is a static class within a class. The name of
    the outer class must be used when creating an instance of the class outside the
    outer classes. Nested static classes have access to only the static variables
    of the outer class. Inner classes are within classes where an inner class always
    has a reference to the outer object and can therefore access the variables of
    the outer class. A local class is a class within a method. It only has access
    to the final variables of the method.


    +   2. Create an anonymous inner class only when the class will not be reused.
    That is, an object is created from a class and no other objects will need to be
    created from this class again.


    +   3. When handling an event, one must be always aware of the source of the event,
    the event listener, and the event object. While the event object is created by
    Java, the event source and the event listener must be created by the programmer.
    The event listener must belong to a class that implements the appropriate interface
    so that the event source can call the correct methods.


    +   4. After creating the event source, do not forget to register the event source
    with the event listeners. Write eventSource.addActionListener(eventListener),
    where X should be substituted with the type of event (e.g., Key, Mouse, etc.).'
