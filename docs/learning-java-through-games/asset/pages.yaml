    # 13.4 Summary


    The chapter shows how to create both text and binary files. It also discusses
    the topic of checked and unchecked exceptions. While Java forces us to handle
    checked exceptions, unchecked exceptions do not need to be handled. For example,
    code can access an element of an array without worrying about an ArrayIndexOutOfBounds
    exception. Conversely, every time we open a file for reading or writing, we need
    to add code checks for exceptions. The reason is that something can go wrong (i.e.,
    the file cannot be written) and Java forces us to handle this exception case.


    # 13.5 Syntax


    +   * void m() throws Exception ⇒ If an exception is generated in the m method
    and the exception is not handled, then it is forwarded to the method that called
    the m method. This syntax is used primarily when there is a checked exception
    that needs to be addressed. If an unhandled exception is generated from the main
    method, then the program crashes.


    +   * System.err.print("error..."); ⇒ Prints the error on the screen in red.'
