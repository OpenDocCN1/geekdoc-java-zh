    # 11.8 Summary


    The chapter presented the case study of creating a fully working game. Many Java
    features were reviewed: creating subclasses, drawing shapes, different kinds of
    if and for statements, enum types, inheritance, event handling, Most importantly,
    the chapter demonstrated how to create the design and implement a non-trivial
    program. Here is a summary of the most important principles that were followed.


    +   - Delegation ⇒ Delegate responsibilities to classes and methods. For example,
    the Ball class should be responsible for the movement of the ball.


    +   - Avoid long methods ⇒ Every method is simple and performs just one task.
    For example, if a method becomes long, then it is broken into several methods.
    For example, the BreakoutPanel constructor calls the createBricks method to create
    the bricks.


    +   - Limit interaction between classes ⇒ All data is declared private. Methods
    that should not be accessed outside the class are also declared private. For example,
    the constructors in the Ball and Brick class are defined private.


    +   - Test often ⇒ Do not write the whole program in one breath. Create a simple
    feature, test it, and make sure it works before proceeding to the next feature.


    # 11.9 Syntax


    +   - t.setDelay(20); ⇒ Changes the delay of the timer t to 20 milliseconds.


    +   - startGame().CTRLStroke(KeyStroke(VK_S, InputEvent.CTRL_MASK)); ⇒ When Ctrl+S
    is pressed, an Action will be generated by the menu item startGame.


    +   - shape.setFrame(getX() + dx, getY() + dy, getWidth(), getHeight()); ⇒ Change
    the surrounding frame of the shape type of RectangularShape.


    +   - shape.getBounds() ⇒ Returns the bounds of a shape as an object of type Rectangle.


    +   - String s = KeyEvent.getKeyText(e.getKeyCode()); ⇒ Computes a textual description
    of the key that is pressed. For example, the value of s can be "F1", "Space",
    "Esc", etc.


    +   - Rectangle r3 = r1.add(r2); ⇒ Code adds two rectangles. The result is the
    smallest rectangle that encompasses rectangles r1 and r2.'
