  md: '# 9.6 Important Points


    +   1. In order to create a window in Java, create a class that inherits from
    the JFrame class and instantiate it.


    +   2. Call the setVisible method on a window in order to make it visible.


    +   3. Initialize the content of the window inside the constructor of the class
    that inherits from the JFrame class.


    +   4. The paintComponent method does the drawing inside a JPanel. It be called
    multiple times (i.e., every time the window needs to be repainted). The paintComponent
    method takes an object of type Graphics, which is used to do the drawing. Always
    call the super class at the beginning of the paintComponent method, which guarantees
    that you will start painting on a blank canvas.


    +   5. The paintComponent method only displays the data. It should never generate
    new data.


    +   6. Never call the paintComponent method directly. Instead, call the repaint
    method in order to refresh a panel.


