  md: "# Classes Revisited\n\nSuppose that we create a new methodology for computing\
    \ the strength of a fictional character. Then, if the user has saved past results,\
    \ this value would be meaningless and can result in the program behaving erroneously.\
    \ Therefore, we will rewrite our program and provide only a public interface that\
    \ allows us to compare two fictional characters.\n\nRemember that we use the compareTo\
    \ to compare two strings.\n\n```\ns1.compareTo(s2) = { positive integer if s1>s2,\
    \ negative integer if s1<s2, 0 if s1=s2 } (8.1)\n```\n\nFor strings, < > refer\
    \ to the lexicographical ordering of strings. In general, we use the compareTo\
    \ method to compare objects and define the naming of an object to be smaller,\
    \ equal to, or greater than another object.\n\nIn Java, a class includes the compareTo\
    \ method. It is a simple class; it only includes the method and defines it as\
    \ an abstract method. We can tell the world that our class supports the compareTo\
    \ method by inheriting from this class. This special because it only contains\
    \ the abstract compareTo method. It does not contain any methods with bodies,\
    \ constructors, or variables. In Java, such classes are referred to as interfaces.\n\
    \n> An interface is a special class that contains only methods without bodies\
    \ (i.e., abstract methods). The abstract keyword is not used when defining a method\
    \ inside an interface because an interface all the methods are abstract. An interface\
    \ cannot contain regular variables, but it can contain constants (i.e., final\
    \ static variables). An interface cannot construct constructors.\n\nNote that\
    \ an interface is an abstract class because one cannot directly create an object\
    \ that belongs to an interface or an abstract class. However, there is a subtle\
    \ difference. Since all the methods in an interface are abstract and there are\
    \ no instance variables inside, we will need to use the super keyword to refer\
    \ to an interface object. In other words, an object for an interface is never\
    \ created. Conversely, an object for an abstract class is created as part of the\
    \ super object of a subclass. When we inherit from an interface and a super object\
    \ is not created, Java allows us to inherit multiple interfaces.\n\n> In Java,\
    \ inheriting from an interface is different than inheriting from a class. When\
    \ inheriting from an interface, a super object is not created. In order to emphasize\
    \ the difference, Java uses extends from another class, but it implements an interface.\
    \ A class implementing an interface means that the class overrides and implements\
    \ (i.e., includes the bodies of) all the methods of the interface. In Java, one\
    \ can extend a single class, but implement multiple interfaces.\n\nThe interface\
    \ that contains the compareTo method is called Comparable. Therefore, the FictionalCharacter\
    \ class can implement this interface and override the compareTo method. Here is\
    \ the new implementation.\n\n```\npublic abstract class FictionalCharacter implements\
    \ Comparable<\n  private String name;\n  public FictionalCharacter() {\n}\n```"
