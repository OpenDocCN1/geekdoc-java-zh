  md: "180\n\nLearning Java through Games\n\nmoved, then the Superhero.memberCount()\
    \ will result in error. The reason is that the Superhero class will not contain\
    \ the method and Java will not check the superclass. The reason is that polymorphism\
    \ does not apply to methods of type static.\n\n# 8.11 Explicit Type Checking\n\
    \nLet us continue our superhero and villain example. Suppose that we have created\
    \ several superheroes and villains and have added them to the single ArrayList\
    \ characters. ArrayList<FictionalCharacter> characters = new ArrayList<>();\n\n\
    Suppose that we want to count the number of superheroes and the number of villains\
    \ in the ArrayList. We can call the member method that was described in the previous\
    \ section. However, this method will give us the total number of superheroes and\
    \ not the number of superheroes in the ArrayList. Note that in the ArrayList we\
    \ have a number of objects type FictionalCharacter. However, the FictionalCharacter\
    \ class is abstract, these objects must belong to its subclasses. Therefore, we\
    \ need a way to determine the type of object. One way of performing this task\
    \ is using the instanceof keyword.\n\n```\nint count = 0;\nfor(FictionalCharacter\
    \ el:characters){\n  if(el instanceof Superhero){\n    count++;\n  }\n}\n```\n\
    \nThe instanceof keyword checks if the object belongs to the class. It returns\
    \ true if it does and false otherwise. The above code iterates through all the\
    \ elements of the ArrayList. If an element belongs to the Superhero class, then\
    \ the counter when is incremented by one. The code computes the number of superheroes\
    \ in the ArrayList.\n\n> The expression instanceof returns true exactly when the\
    \ object is an instance of the C class or any of its descendants in the inheritance\
    \ hierarchy.\n\nNote that the: instanceof of FictionalCharacter will be true for\
    \ all elements of the ArrayList. Alternatively, one can use the getClass method\
    \ to determine the type of an object. The method returns the class of an object.\
    \ Here is an example.\n\n```\nfor(FictionalCharacter el:characters){\n  if(el.getClass()==Superhero.class){\n\
    \    count++;\n  }\n}\n```\n\nThe getClass method is defined in the Object class.\
    \ In other words, it can be called on any object. It returns the runtime type\
    \ of the object."
