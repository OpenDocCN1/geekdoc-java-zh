  md: '# 1.8 Important Points


    +   1. A computer consists of hardware and software. While the software can be
    easily changed by a programmer, the hardware of the computer can only be physically
    modified.


    +   2. There are two types of software: application software and operating systems
    software. The operating system helps the application software communicate with
    the hardware. It also allows the application software to run smoothly by providing
    features, such as concurrent program execution and graphical user interface.


    +   3. There are two ways to execute a program: using a compiler and using an
    interpreter. A compiler translates the program into executable code that can be
    later executed by the CPU. An interpreter, on the other hand, both translates
    and executes the program in real time. Since an interpreter needs to perform the
    additional task of translating the code, running a program using an interpreter
    is usually slower.


