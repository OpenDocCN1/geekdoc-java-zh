  md: "In our example, the `ArrayList` class takes as input the `Employee` class.\
    \ This means the array list can store inside it only employees. If we try to insert\
    \ an object of a different type in the `ArrayList`, an error will occur. Note,\
    \ starting with Java 7, the syntax can be simplified as follows.\n\n```\nArrayList<Employee>\
    \ emps = new ArrayList<>();\n```\n\nThe second reference to Employee class is\
    \ redundant, and therefore can be omitted. Note that a generic class can take\
    \ as input only the name of a class and not the name of a primitive type. For\
    \ example, the following code will not compile.\n\n```\nArrayList<int> dice =\
    \ new ArrayList<int>();\n```\n\nHowever we can use the Integer class as input\
    \ to the ArrayList class. For the most part, an Integer object behaves exactly\
    \ like an `int`, but it is still an object. Therefore, an `ArrayList` of integers\
    \ can be declared as shown below.\n\n```\nArrayList<Integer> dice = new ArrayList<Integer>();\n\
    ```\n\nA common mistake by novice programmers is to specify the size of the ArrayList\
    \ as a parameter in the parentheses. However, this is the wrong approach because\
    \ we do not need to specify the size of an ArrayList when we create it. The size\
    \ of an ArrayList is dynamically determined by the number of objects it stores.\
    \ Therefore, a newly created ArrayList will always have size of zero.\n\n# 7.2\
    \ Immutable Objects\n\nConsider the following code.\n\n```\nclass Test {\n  public\
    \ static void inc(Integer i) {\n    i++;\n  }\n\n  public static void main(String[]\
    \ args) {\n    Integer i=3;\n    inc(i);\n    System.out.println(i);\n  }\n}\n\
    ```\n\nThe behavior of the code is very interesting and counterintuitive. Note\
    \ that the code Integer i = 3 is rewritten by Java to: `Integer i = new Integer(3)`.\
    \ Therefore, Figure 7.1 suggests, a new object is created inside the main method.\
    \ Let the location of the new object 2000. This object is passed as a parameter\
    \ to the inc method. Rather that the object's address will be passed to the inc\
    \ method. Now the variable i inside the inc method will be initially equal to\
    \ 2000. However, if we try to display the variable, then we will see the number\
    \ 3. The reason is that the Integer class contains a toString method that returns\
    \ the value is stored inside the class.\n\nNext, let us examine the statement\
    \ i++. This is where all the magic happens! This code is equivalent to i = i +1,\
    \ which in means change the value inside the i object to 4. However, the Integer\
    \ class is immutable."
