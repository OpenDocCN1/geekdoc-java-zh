    # 4.2 Formating Output


    It will be nice if we get the program to print $384.00000000000. When it comes
    to currency, we probably want to see only two digits after the decimal dot. Java
    has the printf method (stands for formatted printing) that supports formatted
    output. Additionally, there is a format method that can be called on a System.out
    that does exactly the same thing. We can print a number with two digits after
    the decimal as


    ```

    System.out.printf("%.2f on painting and"

    + "%.2f on hardwood for total of %.2f,",

    bobPrice,peterPrice,totalPrice);

    ```


    The printf method is interesting because it takes as input variable number of
    arguments. The first argument is always a string. This is the string that is displayed.
    The string can contain zero or more % constructs. An argument needs to be specified
    for every construct. In our example, the first string contains three % constructs.
    This means we need to specify three additional parameters. Every time a % construct
    is used in the string, it is substituted with the next argument of the method.
    In our case, bobPrice is equal to $76.80, peterPrice is equal to $307.20, and
    totalPrice is equal to $384.0. The f sign means that a floating point number will
    be printed (either a float or a double). A list of some characters that can be
    used after the % sign is shown in Table 4.1.


    Between the % sign and the character, one can specify the size of the output using
    two numbers separated by a dot. To the right of the dot, one can specify the number
    of digits after the decimal dot to be displayed. To the left of the dot, one can
    specify the total number of characters to be displayed. For example, the following
    statement displays 3 digits after the decimal.


    ```

    System.out.printf("%.3f",23.3228);

    ```'
