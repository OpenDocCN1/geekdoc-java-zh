    # 12.5 Grid Layout


    We will build a simple calculator. Figure 12.3 shows what our calculator will
    look like. We will create three panels in the window: in the north, south, and
    center. The panel in the middle will use the grid layout.


    Whenever components need to be placed in a grid, one can use the grid layout.
    When adding components to a grid layout, the rows are filled from left to right
    and from top to bottom. In other words, the first row is filled and so on. The
    call to the constructor new GridLayout(3,5) will create a 3x5 grid (3 rows and
    5 columns). Alternatively, the call new GridLayout(2,4,3,6) will generate a grid
    with 2 rows, 4 columns, a 3-pixel horizontal gap, and a 6-pixel vertical gap between
    the components.


