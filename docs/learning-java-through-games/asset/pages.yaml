  md: '# About the Author


    Lubomir Stanchev is an associate professor in the Department of Computer Science
    at Indiana University — Purdue University Fort Wayne. He got his Ph.D. degree
    from the David R. Cheriton School of Computer Science at the University of Waterloo
    in Canada. He has taught introductory programming courses and software engineering
    courses about fifteen times in the past eight years. He has published more than
    five journal articles and more than twenty conference proceedings in the area
    of computer science. He has been writing software code for over thirty years and
    he has worked as a software developer in four different companies.'
