  md: "# 8.9 The final Keyword\n\nSometimes, we want to create a method and disallow\
    \ it to be overridden. In our example, we may want to fix the way the computeStrength\
    \ method works. In other words, we want to make sure that someone does not create\
    \ a class SpecialSuperhero where the strength is calculated in a different way.\
    \ This might give unfair advantage to special superheroes. To prevent this, we\
    \ can define the computeStrength method in the Superhero class as final. Here\
    \ is the rewritten code.\n\n```\npublic class Superhero extends FictionalCharacter\
    \ {\n\n  final double computeStrength() {\n    return goodPower*Math.random();\n\
    \  }\n}\n```\n\n> A final method cannot be overridden in a subclass. Polymorphism\
    \ does not apply to methods.\n\nSimilar to methods, classes can also be defined\
    \ as final. A final class cannot be inherited from. For example, consider the\
    \ following code.\n\n```\npublic final class Superhero extends FictionalCharacter\
    \ {\n  ...}\n```\n\nThis means that a SpecialSuperhero class that extends the\
    \ Superhero class cannot be created.\n\n# 8.10 Static Methods and Polymorphism\n\
    \nNote that polymorphism does not apply to static methods. In order to demonstrate\
    \ the consequences, we will add the memberCount static method to the FictionalCharacter\
    \ class. The method will simply return the number of fictional characters that\
    \ are created.\n\n```\npublic abstract class FictionalCharacter implements Comparable<FictionalCharacter>\n\
    \  private String name;\n  private static int memberCount = 0;\n  public FictionalCharacter()\
    \ {\n    memberCount++;\n  }\n  public FictionalCharacter(String name) {\n   \
    \ this.name = name;\n    memberCount++;\n  }\n```"
