    This chapter introduces the basic components of a computer: its hardware and software.
    After all, this is a computer programming textbook and we need to have a basic
    understanding of how the computer works before we can start developing software
    for it. For completeness, some historical information about computers and computer
    games is also included in the chapter.


    # ### 1.1 Brief History of Computers


    Computers are electronic devices that can perform calculations. The first electronic
    digital computer was built by professor John Atanasoff and his graduate student
    Clifford Berry in 1937. The computer could not be programmed and could be used
    only to solve linear equations. Six years later, in 1943, the first programmable
    computer was built by Tommy Flowers; see Figure 1.1.

    As you see in the picture, the first computers took a lot of space. Different
    components, as secondary storage and main memory, were in separate racks. Early
    computers could easily fill a present-day classroom. Colloquial expressions such
    as: "I will go to check the memory" were common in those days. Even the term "bug",
    which is commonly used to describe a software error, derives from the days when
    actual rodents were roaming around the different components of a computer. As
    time progressed, computers became smaller and cheaper. The personal computer was
    introduced in the late 1970s and early 1980s by the likes of Hewlett Packard,
    Apple, and IBM.


    # ### 1.2 Hardware Components of a Computer


    The brain of a computer is the Central Processing Unit (CPU); see Figure 1.2 .
    It is a device that can perform simple calculations. These include addition, deletion,
    subtraction,'
