  md: '# Exception Handling and Files


    Finally, note the break at the end of the try statement. If an exception is generated,
    then the try block will stop executing and the point of control will be transferred
    to one of the catch blocks. After the catch finishes executing, the while loop
    will bring us back to the beginning of the loop. Alternatively, if the code goes
    through the whole try block without an exception being raised, then the break
    statement will transfer control to the line immediately after the while statement.


    An obvious case is when to use the try statement and when to use the throws keyword.
    Unless you do not have to handle the exception, the calling method will take care
    of it. However, in certain situations it is impossible to use the throws keyword
    it inherits from the JPanel class. For example the original paintComponent method
    inside a class that does not throw an exception, neither can our method that overrides
    the original method. In different situations, we do not want a method to throw
    an exception because it is extra work. For example, if the calling method does
    not handle the exception, a compile-time error will be generated.


    Lastly, let us consider checked exceptions. These are exceptions that Java forces
    us to handle. Opening a file is an example of a task that can potentially generate
    a checked exception. Therefore, we must use a try-catch block or add the throws
    keyword to the method in order to handle the exception of the file. Alternatively,
    starting with Java 7, the following syntax is also allowed.


    ```

    try (statement that opens file){

    // do something with file

    catch (IOException exception) {

    // handle I/O problems.

    }

    ```


    If the file is not opened successfully, then one of the catch blocks is executed.
    This syntax also closes the file automatically, which saves us some code writing.
    The above syntax is referred to as try-with-resources. The try statement tries
    to allocate resource. If the resource is successfully allocated, it is automatically
    freed at the end. Otherwise, one of the catch blocks and/or the finally block
    is executed.


