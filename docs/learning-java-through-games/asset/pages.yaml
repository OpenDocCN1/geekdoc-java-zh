    created, for every object.


    Instance variables can have a different value for every object. They are defined
    without using the static keyword. Conversely, static variables are associated
    with the whole class. A single instance of a static variable is created regardless
    of the number of objects that are created from the class. Memory for a static
    variable is created when there are no instances (i.e., objects) of the class.


