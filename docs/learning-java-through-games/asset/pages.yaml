  md: '# The Breakout Game (Complete Version)


    Let us examine the key listener. The getKey method returns an integer that is
    associated with the pressed key. We could not use the getChar method because there
    are no characters that are associated with the arrow keys (and even if there were,
    we do not know how to refer to them). The KeyEvent class stores the code of most
    vital keys as constants. For example, KeyEvent.VK_LEFT is the left arrow. The
    code changes the coordinates of the paddle by calling the moveLeft or moveRight
    method and then refreshes the panel.


    Note that we could have written the code as follows.


    ```

    String s=getKey.getText();

    if(s.equals("Left

    ```


    The getKey method converts the key code to text. However, this is an inferior
    solution because it assumes the string Left will be returned. For example, nothing
    stops Java from returning the LEFT in future implementations.


    Note that the paddle needs to have the focus to receive key events and by default
    the paddle is not focusable. The call setFocusable(true) makes the paddle focusable.


    The mouse listener is a more interesting than the key listener. It saves the old
    position of the mouse cursor and compares it with the new position of the mouse
    cursor. The paddle is moved by the value of the difference of the two numbers.
    This means that if we move the mouse fast, the paddle will move as fast as well.
    Of course, we do not know the old value of the cursor so we need an extra variable
    and an if statement to address this special case. Finally, we can use the mouse
    to move the paddle only when the cursor is inside the paddle. The reason is that
    mouse events are reported to a component only while the mouse is inside its component.


    If we run the program that we have so far, we will notice that everything works
    except the ball goes bouncing the moving. We will then check to see if the virtual
    ball intersects inside the paddle. We will add this class in the time listener
    inside the BreakoutClass. Our code will create a virtual ball that predicts the
    ball will go without actually moving the ball. A virtual ball is created because
    we want to catch the trajectory of the ball before it overlaps with the paddle.
    If the virtual ball intersects the paddle, then we will check if it intersects
    the left or right part of the paddle. If it intersects the left part of the paddle,
    the ball will bounce to the left. Alternatively, if it intersects the right part
    of the paddle, then the ball will bounce to the right. Here is the new version
    of the Ball class that supports the extended interface.


    ```

    public class Ball extends BreakoutShape {

    private static final int SIZE = 10;

    private static final int START.X = 200;

    private static final int START.Y = 400;


    private BreakoutPanel panel;

    private int dx = 1;

    private int dy = -1;


    public Ball(Color color, BreakoutPanel panel) {

    super(new Ellipse2D.Double(Ball.START.X, Ball.START.Y, Ball.SIZE), color, true);

    this.panel = panel;

    }

    ```'
