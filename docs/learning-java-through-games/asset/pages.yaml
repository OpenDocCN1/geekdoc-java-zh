  md: "# 9.3 Panels and Drawing\n\nOur program, as written so far, will display an\
    \ empty window. Our next task is to display the bricks, ball, paddle, and player\
    \ icons inside the window (we will display a player icon for each life remaining).\
    \ Java does not allow us to directly draw inside a window. Instead, it requires\
    \ that we create a canvas (called a panel) to be drawn. The content of the panel\
    \ may be repeated many times during the execution of a program. For example, every\
    \ time a window is restored after minimizing and every time window is resized,\
    \ its content is repainted.\n\n> Java calls the paintComponent method of the panel\
    \ to do the painting. This method is unique because it cannot be directly called\
    \ by your Java program. Alternatively, you should call the repaint method in order\
    \ to force the refreshing of the content of the panel. The repaint method forces\
    \ the paintComponent method to be called sometime in the future.\n\nThe behavior\
    \ of the paintComponent method is not trivial and is tricky to understand by novice\
    \ programmers. Here is an important principle to remember.\n\nThe programmer has\
    \ no control over the paintComponent method will be called. Therefore, it is important\
    \ that the behavior of the method will be consistent with previous executions\
    \ of the method. For example, never generate data inside the method. The method\
    \ should be used to only display the data, where the data can be created in the\
    \ constructor of the panel or as the result of events occurring. If the programmer\
    \ generates and displays data inside the method, then the behavior of the application\
    \ will be strange. For example, the drawing inside the window can change just\
    \ because the screen is resized.\n\nWe will add to the constructor of the BreakoutFrame\
