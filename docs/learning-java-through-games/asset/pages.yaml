    \     }\n        } catch (Exception exception) {\n        }\n    }\n```\n\nThe\
    \ code starts with 3 method, this number is saved in a constant and can be changed.\
    \ The killPlayer method removes a life, while the isAlive method reports on whether\
    \ there are lives left. Note that this is an excellent example of data encapsulation\
    \ because the world outside the class does not know how many lives are left. It\
    \ does not know it does not need to know. As is the case in the CIA, information\
    \ between classes should be shared only on a need-to-know basis. The less information\
    \ is shared, the easier it is to identify erroneous.\n\nThe draw method draws\
