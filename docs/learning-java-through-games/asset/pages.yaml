    # 12.15 Important Points


    +   1. A window can contain multiple panels. Every panel, in turn, can contain
    multiple panels.


    +   2. In a flow layout, the components are arranged in rows from top to bottom
    in the surrounding container.


    +   3. In a border layout, the components are placed in the south, east, north,
    west, and center of the container. One can place only one component in each of
    the five areas.


    +   4. In a grid layout, the components are placed in a grid. When adding components,
    they fill the grid from top to bottom. The first row is filled from left to right
    as are the successive rows.


    +   5. The JTextField and JTextArea classes are similar. However, the first class
    should be used to display a single user input line, while the second class should
    be used to display an area that contains multiple user input lines.'
