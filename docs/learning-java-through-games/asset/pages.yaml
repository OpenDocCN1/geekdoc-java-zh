    # 2.2 Variables


    Next, let us consider a more useful program. The user enters the temperature in
    degrees Celsius and the program converts the temperature to degrees Fahrenheit.
    Before implementing program, we need to design an algorithm that solves the problem.
    An algorithm is a sequence of steps that provides a recipe that addresses the
    problem at the logical level. For our problem, an example algorithm can include
    the following steps.


    +   - Prompt the user to enter temperature in Celsius.

    - Read an integer from the keyboard and save it in memory location x.

    - Calculate the result of y = 32 + (9/5) * x, that is, the temperature in Fahrenheit,
    and save y in memory.

    - Print the value of y on the screen.


    Before transforming the algorithm into Java code, we need to learn about variables
    in Java. Variables are a way of referring to cells in main memory. Java supports
    the primitive types that are shown in Table 2.1. A variable name should always
    start with a lowercase'
