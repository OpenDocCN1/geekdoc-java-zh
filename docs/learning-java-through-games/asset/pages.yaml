    If you have used a graphical Java application, you may have noticed that Java
    has its own way of displaying windows, menus, buttons, and toolbars. In fact,
    Java has its own library for displaying graphical components called Swing. Swing
    allows Java to provide the same look and feel under different operating systems.
    In this chapter we will explore basic Swing primitives, including drawing formatted
    text, shapes, and images inside a window.


    # ### 9.1 Introduction to Swing


    A graphical user interface (GUI) allows a program to provide a graphical interface
    to the user. Unlike a text interface that involves writing text to the console
    and reading text from the keyboard, a GUI allows the user to see graphics and
    interact with the system without using the keyboard, but also using the mouse
    and other pointing devices. The advantage of using a GUI is that it is more intuitive
    and easier to learn. A GUI is usually written on top of an operating system, such
    as Microsoft Windows, Windows, Apple Mac, where every application displays one
    or more windows. All components are usually displayed inside the windows.


    In Java, there are two ways to draw a window and the graphical components inside
    it: using Swing and using the Abstract Window Toolkit (AWT). While AWT uses the
    primitives (that is, the application programming interface (API)) of the operating
    system, Swing relies on the Java native implementation to draw the components
    inside the windows.


    Menus, scroll bars, and text fields will look and behave differently under different
    operating systems under AWT. This implies that an application needs to be tested
    under different operating systems before it is released, which complicates the
    application development process. In contrast, a Swing application will look exactly
    the same under any operating system. The downside is that Swing the windows are
    drawn by the Java virtual machine rather than by the operating system.


    This chapter teaches us how to use Swing to write GUI programs. There is a perception
    among some programmers that writing GUI code is not hard work. In fact, you do
    not even need to write actual code. You can just use the mouse to drag and drop
    buttons,'
