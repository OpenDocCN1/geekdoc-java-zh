  md: '+   4. A method that `throws` an exception when you do not want to handle the
    exception. It becomes the responsibility of the calling method to handle the exception.


    +   5. A method that overrides a method that does not throw exception cannot throw
    an exception. The only alternative is to use a `try-catch` statement.


    +   6. Use `try-with-resources` when opening a file. This will close the file
    automatically and will simplify the code.


    +   7. There are three ways to handle an exception: (1) print an error and terminate
    the program, (2) print an error message or write to a log file and continue executing
    the program, or (3) fix the error (e.g., ask for valid input again). It is up
    to the programmer to choose which way to handle exceptions.


    +   8. Every time we write code we need to add exception-handling code. The reason
    is that opening a file generates a checked exception that needs to be handled.
    Using a `try-with-resources` block is the easiest way to handle a possible exception.


    +   9. All classes that have objects serialized (i.e., objects written to the
    hard disk) need to implement the `Serializable` interface.


    +   10. Java allows objects with cyclic references to be serialized. The programmer
    does not need to do anything special. Java will make sure that every object is
    serialized just once.


    +   11. When an aggregate object is serialized, all its inner objects that implement
    the `Serializable` interface are also serialized.


