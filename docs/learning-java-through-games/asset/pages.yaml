  md: "# Learning Java through Games\n\nBefore we debug a program in NetBeans, we\
    \ need to set a breakpoint. A breakpoint is a place where the program will stop\
    \ executing. After the breakpoint, we can debug the program line by line. In order\
    \ to set a breakpoint, click on the number of the line. In the case of our line,\
    \ we will set a breakpoint at Line 8. After we set a breakpoint, we will see a\
    \ red circle on it. Note that we can only set a breakpoint on a line that performs\
    \ an operation, Line 8 is the first line where we can also set a method breakpoint\
    \ at Line 5. We will then see a red triangle instead of a circle. This is called\
    \ a method breakpoint and the program is interrupted for debugging before the\
    \ method is executed.\n\nIn order to debug the program, we will select Debug and\
    \ Debug Main Project from the menu. We will see Line 8 marked in green. This is\
    \ the line that is currently executed. We will press F8 to move to the next line.\
    \ Next, we will press F8 two more times to enter and enter the temperature in\
    \ Celsius. Now we are at Line 11. We will press F8 again to move to Line 12. We\
    \ will hover with the mouse over the variable $c$ and see that $c$ is equal to\
    \ 1.0. However, we expected that $c$ will be equal to $\frac{9}{2}=1.80$. We have\
    \ isolated the error. We will press the square red button at the bottom of the\
    \ screen to stop the debugger. Our error is due to integer division.\n\nThe result\
    \ of dividing two integers is an integer. The result is rounded down to the lowest\
    \ number. For example, 8/9 is equal to 0.89, which is rounded down to 0. In other\
    \ words, Java calculates 8/9 as 0. If we want the result to be a double and not\
    \ an integer, we need to convert one of the arguments to a double before performing\
    \ the operation.\n\nThere are two popular ways to convert an integer to a double.\
    \ The first way is to write (double) before the integer. This is called a casting\
    \ operation and it converts the integer to a double. In our example, we can fix\
