  md: "# Nested Classes and Event Handling\n\nMethod callback is when a method is\
    \ passed as a parameter. When an event occurs, the method will be called back.\
    \ Java does not directly support method callbacks. The reason is that methods\
    \ themselves cannot be passed as arguments to methods. Alternatively, one needs\
    \ to create a class that supports the required methods and pass an object of that\
    \ class as a parameter. Java uses interfaces to guarantee that the object supports\
    \ the required methods.\n\n# 10.2 Nested Classes\n\nIt seems burdensome to create\
    \ a new class every time we want to implement a method callback. To simplify the\
    \ process, Java allows us to create a class within another class. Such classes\
    \ are referred to as _nested classes.\n\n# 10.2.1 Static Nested Classes\n\nLet\
    \ us explore how nested classes apply to our typing program. First, consider the\
    \ following code\n\n```\npublic class TypingGame {\n    public static void main(String[]\
    \ args) {\n        Timer t = new Timer(1000, new TimerListener());\n        t.start();\n\
    \        JFrame frame = new JFrame();\n        frame.setVisible(true);\n    }\n\
    \n    public static class TimerListener implements ActionListener {\n        ArrayList<Character>\
    \ charList = new ArrayList<>();\n\n        public void actionPerformed(ActionEvent\
    \ e) {\n            charList.add((char)('a' + (int)(Math.random() * 26)));\n \
    \           System.out.println(charList);\n        }\n    }\n}\n```\n\nThe _TimerListener_\
    \ class is defined inside the _TypingGame_ class. The class is defined as _static_\
    \ because it is not connected to a particular instance of the outer _TypingGame_\
    \ class. In other words, objects that belong to the _TimerListener_ class will\
    \ not be associated with an object of the _TypingGame_ class. Note that defining\
    \ the _TimerListener_ class without the _static_ keyword will result in an error.\
    \ The reason is that this will imply that the class is associated with an instance\
    \ of the _TypingGame_ class. However, the _TypingGame_ class is never instantiated.\n\
    \nThe nested class is defined as _public_, which means that everyone can create\
    \ an instance of it. For example, the following code is valid outside the _TypingGame_\
    \ class.\n\nTypingGame.TimerListener listener = new TypingGame.TimerListener();"
