    # 5.1.1 Deep Shallow Array Copy


    One needs to be very careful when copying arrays. Consider the following example.


    ```

    public class Test {

    public static void main(String[] args) {

    int a[]=new int[]{2,34,14,12,23,22};

    int b[]=new int[6];

    a=b;

    b[3]=7;

    System.out.println(a[3]);

    }

    ```


    This looks like a very simple program. First, the arrays a and b are created.
    Then all the elements of the a are copied to the b array. The fourth element of
    the b array is then changed (remember that index counting starts at 0). This should
    have no effect on the a array and the number 12 should be printed (the fourth
    element of the array). However, when you run the program, then we will see that
    7 is printed.


    In order to understand this counterintuitive behavior, consider Figure 5.3. It
    shows the initial setup. The variables a and b point to two different arrays.
    The line b = a is going to make b equal to 1000. In other words, after the assignment
    both a and b will be equal to 1000. When the line b[3]=7 is executed, both the
    value of b[3] and a[3] will change. Nothing will now point to the array at position
    2000 and it will be purged by the garbage collector. This type of array copy is
    known as shallow copy.'
