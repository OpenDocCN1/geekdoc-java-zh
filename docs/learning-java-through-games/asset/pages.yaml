    This chapter introduces the reader to the advanced topic of recursion. Recursion
    is when a method calls itself. Recursive algorithms try to break a complex problem
    into smaller versions of the same problem, where the smaller versions are solved
    in the same way (i.e., by breaking them further into smaller problems). Of course,
    this process should not continue infinitely and at some point the problem should
    become simple enough to be solved directly (we will refer to this as the *base
    case* of the recursive program).


    Although a powerful tool, a recursive algorithm is not always the best option.
    It requires allocating extra memory and is often inefficient. The chapter gives
    examples of where recursion should be used and when alternative approaches perform
    better. The chapter shows many examples of recursive programs. These include the
    famous Tower of Hanoi, binary search, and popular sorting algorithms.


    # ## 14.1 Base Case and General Case


    In a land far away, there lived a king that liked to play chess. He was also single
    and wanted to find his queen. One day, a peasant approached the king and made
    him the following proposal. They would play a game of chess. If the king won,
    he could marry the peasant''s daughter, who appeared to be the faire of all. However,
    if the peasant won, the king would give him one grain of wheat for the first day
    and one grain of wheat on the second day. For each day, the peasant requested
    to be given the total of the previous two days. Since there are 64 squares on
    the chessboard, the peasant suggested that he receive grain for “only” 64 days.
    Before agreeing to the deal, the king decided to write a short program that calculated
    how many grains of wheat he might need to pay in the unlikely event that he lost
    the chess match. Here is the program that he wrote.'
