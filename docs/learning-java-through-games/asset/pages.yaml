  md: "# 182 Learning Java through Games\n\n![](img/efbd24814b512af8a3101a141a2f07a6_203_0.png)\n\
    \n# FIGURE 8.7: Cloning example.\n\n```\npublic String toString() {\n    return\
    \ number+\"+streetName\";\n}\npublic void changeAddress(String streetName, int\
    \ number) {\n    this.streetName = streetName;\n    this.number = number;\n}\n\
    ```\n\n```\npublic class CloneTest {\n    public static void main(String[] args)\
    \ throws Exception {\n        Address address = new Address(\"Main\",123);\n \
    \       FictionalCharacter c1 = new FictionalCharacter(\"Superwoman\",\n     \
    \       address);\n        FictionalCharacter c2 = (FictionalCharacter) c1.clone();\n\
    \        address.changeAddress(\"Main\", 235);\n        System.out.println(c2);\n\
    \    }\n}\n```\n\nFigure 8.7 depicts what happens. We call super.clone() to perform\
    \ the cloning of our fictional object. However, the default clone method inside\
    \ the Object class does not know anything about the structure of an object of\
    \ type FictionalCharacter. It simply copies all the data. As a result, both c1\
    \ and c2 will contain the same object of type Address. Now, if this is modified,\
    \ the change will affect both objects.\n\n> > Shallow copy happens when we copy\
    \ the data of an object, but we do not make copies of the inner objects. Shallow\
    \ copy is dangerous because changes to an inner object of one class leads to changes\
    \ of the same inner object of the other class. The default clone method inside\
    \ the Object class performs shallow copy. If we want to perform deep copy, we\
    \ need to override the method."
