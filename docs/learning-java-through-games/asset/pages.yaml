  md: '# Preface


    Java is a programming language that was originally developed in 1995 by James
    Gosling at Sun Microsystems, which later became part of Oracle Corporation. Since
    then, major revisions of the language have been introduced and thousands of textbooks
    that describe every nifty-gritty detail of the language have been published. At
    the same time, many computer science departments of universities throughout the
    world have adopted Java as their introductory programming language. The reason
    is that Java is a strongly typed language that is easy to learn and apply. The
    language also helps identify erroneous code early in the coding process. The popularity
    of Java as an introductory programming language has led to the publication of
    thousands more that use Java to introduce the reader to basic programming principles.


    This textbook stands somewhere in the middle. It tries to cover as much material
    as possible from the latest Java standard (Java SE 7). At the same time, it is
    a textbook that aimed at readers with no previous programming background. It not
    only teaches how to use the different features of Java, but it also teaches the
    reader how to program. What makes this textbook is its application-motivated approach.
    The textbook contains a plethora of examples. All Java constructs are introduced
    as a necessity to implement different features. Most chapters start with a description
    of a game. Next, Java constructs that can be used to implement the features of
    the game are introduced on-need-uses. The textbook reads similar to a novel. The
    novice reader must read through the whole chapter in order to understand all the
    features that are needed to implement the game.


    The second strength of the textbook is that, unlike most Java textbooks, it spends
    a lot of time preaching good software development practices. Martin Fowler once
    wrote, "Any fool can write code that a computer can understand." This textbook
    tries to teach the reader not only to write code that works, but how to follow
    good software practices. All samples in the textbook are refactored multiple times
    in order to achieve code that is easy to understand, reuse, and maintain. The
    author of this textbook believes that even novice programmers should be taught
    good programming practices. The reason is that if one does not develop good habits
    from the outset, it is more difficult to develop them afterwards.


    The textbook is split into two parts. Chapters 1-7 cover basic programming techniques,
    such as conditional statements, loops, methods, arrays, and classes. Chapters
    8-15 cover more advanced topics, such as inheritance, recursion, sorting algorithms,
    GUI programming, exception handling, files, and applets. The textbook is designed
    to be either used by a reader who wants to learn the language on their own or
    as part of a two-course introduction to programming sequence. Most chapters build
    on each other and the best way to read the textbook is from start to finish. A
    dependency diagram of the chapters is shown in Figure 0.1.


    Chapter 1 introduces basic concepts, such as main memory, hard disk, operating
    system, and binary numbers. It should be read by readers that have little computer'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Preface


    ![](img/efbd24814b512af8a3101a141a2f07a6_15_0.png)


    Chapter 2 introduces variables and conditional statements. These are the building
    blocks of any program. Chapter 3 introduces loops. Loops allow us to execute the
    same code multiple times. Chapter 4 introduces methods. Methods allow the programmer
    to divide the code into smaller segments, which can shorten the program and eliminate
    redundant code. Chapter 5 introduces arrays. These allow us to create numerous
    pieces of data of the same type in a single statement. Chapter 6 introduces classes,
    which are the pivot of any object-oriented programming language. Classes are introduced
    late in this textbook because they are a more advanced concept that requires understanding
    of basic programming principles. Chapter 7 combines two independent topics: the
    utility `ArrayList` and the Java `enum`. An `ArrayList` is a more powerful version
    of an array that provides more capabilities. Conversely, the `enum` stands for
    *enumerate* and allows the programmer to enumerate the variables of a user-defined
    type.


    The second part of the textbook contains more advanced topics, such as inheritance
    and polymorphism. Chapter 8 revisits classes and Chapter 9 covers the basics of
    displaying text and drawings inside a window. Chapter 10 describes how events
    can be handled in Java. Concepts from Chapter 9 are used as examples. Chapter
    11 presents the *Breakout* class. The chapter shows how programming techniques
    can be applied on a non-trivial project. If you are in a hurry, the chapter can
    be skipped because it is not a prerequisite for any other chapter. Chapter 12
    describes basic graphical user interface (GUI) components, such as windows, panels,
    buttons, combo boxes, and so on. Chapter 13 describes files and exception handling.
    It requires, as a prerequisite, mainly the understanding of classes and class
    inheritance. Chapter 14 covers recursion and arrays, as a prerequisite, the understanding
    of methods and arrays. Chapter 15, which is an optional chapter, shows how to
    program Java Applets.


    Book resources, including Java code from the examples in the textbook and slides,
    can be found at http://software.ipfw.edu/~ubo/LearningJava. Please e-mail typos
    or suggestions for book improvement to stanchev@gmail.com.'
  merge: -1
