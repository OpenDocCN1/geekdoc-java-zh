    # 12.13 Summary


    The chapter describes three component layouts: flow, grid, and border. The flow
    layout

    is used when we want to place components sequentially in a window. When the top
    line

    comes full, the components are placed on the second line and so on. The grid layout
    can

    is used to place components in a grid. The border layout allows us to place components

    in the south, east, west, north, or the center of the window. All three layouts
    can also be

    applied to other windows or panels. Multiple panels can be added to a window and
    each

    panel can have its own layout scheme. Note that this overview of layouts is not
    exhaustive.

    Rather, it gives the readers to arrange GUI components in a window.

    The chapter covers basic GUI components, such as buttons, labels, text,

    text areas, scroll areas, combo boxes, radio buttons, and password fields. For
    every GUI

