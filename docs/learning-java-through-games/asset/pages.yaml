    So far, we have written all the code in the main method. Although this is fine
    for small programs, it is impractical for larger ones. Consider a program that
    consists of thousand lines of code. Scrolling through all the lines to find an
    error is not a viable option. To avoid this scenario, Java allows us to modularize
    our code into methods. Good software practices call for every method to perform
    a single task. For example, a method that reads an integer from a file and multiplies
    it will be not very reusable. The chance that one will require these two operations
    in the same order is very low. However, a method that multiplies an integer by
    a constant also has a high probability of being reused. Similarly, a method by
    rule of thumb, a method should not be too complicated and it should rarely take
    more than 50 lines of code. If a method is longer than that, we should consider
    breaking it down into smaller methods.


    Formatted printing allows us to print the result in any format that we want. For
    example, we can justify the output to the right or to the left. We can also specify
    the number of digits after the decimal dot that will be displayed for doubles.


    # 4.1 Introduction to Methods


    You can think of a method as a "friend" that does you favor. During the execution
    of a program, you can ask your friend to do something for you. When you do that,
    you can send your friend some information. Your friend will perform the required
    task and return some result. After calling a method, the program usually waits
    for the method to do its job before continuing. For example, suppose you have
    two friends Bob and Peter. Bob is a good painter and Peter is an excellent carpenter.
    If you want a room remodeled, then you can call Bob to paint the walls. You will
    call Peter to put in the hardwood floor Similar to your friends, methods also
    have names. Our fictitious example can be implemented as follows.'
