    # 10.5 Summary


    The chapter describes how to use the Timer class. It allows us to execute a method
    periodically. This method is executed in parallel with the rest of the program.
    A timer is implemented by creating a separate thread, but multithreading is an
    advanced subject that is not covered in this book.


    The chapter also describes how to create nested classes. There are four types
    of nested classes: static, inner, and anonymous. The first two allow you to create
    a class within a class, while the last two allow to create a class within a method.
    A local class that is not anonymous is rarely used and not covered in detail in
    the chapter. Static classes are associated only with the outer class, and in regard,
    there is a similarity between inner classes and subclasses. In both cases, there
    is a reference to an outside object.


    Nested classes are used to create method callbacks. Note that an event listener
    object must be created every time we want to handle an event. The reason is that
    we cannot directly tell Java to execute a method every time an event occurs. Instead,
    we need to create an object (called an event listener) and register it with the
    source of the event. Every time the event occurs, the event listener is notified
    by calling one of its methods. The event is passed as a parameter when calling
    the method.


    The chapter also covers multicasting. Multicasting occurs when several event listeners
    are registered with the same event source. This is a powerful mechanism for handling
    events because a single event can trigger multiple methods.'
