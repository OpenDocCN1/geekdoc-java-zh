    # 11.2 Game Design


    First, we need to decide on the classes and the data and methods in them. We will
    demonstrate an approach that was first proposed by Abbott in 1983. The approach
    states to identify the classes from the textual description of the problem. Looking
    at the description, we will create the Breakout class where the main method is
    written. We will also include classes for the main participants of the game: Ball,
    Brick, Paddle, and Player. We will create two enumerations: BallColor and Speed.
    There we will store the possibilities for ball color and speed. We will need to
    create two additional classes that relate to Java: BreakoutFrame and BreakoutPanel.
    These will be the window and the drawing for our application. Lastly, we will
    create a BreakoutShape that will be the superclass of all the shapes that will
    be displayed. Since drawing the paddle, ball, and brick are similar, it is reasonable
    to create a single shape. Part of our initial design is shown in Figure 11.1.


    The BreakoutShape class is used to represent a shape that is bounded by a rectangle,
    that is a ball, a paddle, or a brick. A breakout shape can have a color and can
    be filled or not filled. In our case, all breakout shapes are filled. However,
    the field fill is added just in case we want to create a breakout shape that is
    not filled in the future. Writing a class that is versatile and supports features
    that may not be currently needed is a common programming approach. However, one
    should not go overboard implementing features that are not presently required.'
