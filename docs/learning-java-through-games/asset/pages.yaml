    \ = new Employee(\"John\");\n\nbut we cannot use the following syntax:\n\nemps.get(0)\
    \ = new Employee(\"John\");\n\nThe get method retrieves an element from the ArrayList\
    \ and cannot be used to modify an element of an ArrayList. An element of an ArrayList\
    \ can be modified as follows.\n\nemps.set(0,new Employee(\"John\"));\n\nThe first\
    \ parameter of the set method is the index in the ArrayList, while the second\
