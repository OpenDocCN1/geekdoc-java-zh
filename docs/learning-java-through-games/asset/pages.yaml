    Note that a computer is not all powerful, that is, it cannot represent an arbitrary
    number. For example, we know that there are infinitely many numbers, yet the main
    memory of a computer is finite. This is why Java defines variable types that take
    a fixed amount of memory, while the long type can be used up to a 19-digit integer.
    Most of the time, we want to store an integer that is not very large (less than
    10 digits) and we will use the int. Note that most types allow for both negative
    and positive integers to be stored. Usually, the first bit of the binary representation
    of a number indicates if the number is positive or negative.


    There is a special syntax that is needed in Java to represent a long number. The
