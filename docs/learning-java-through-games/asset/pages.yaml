  md: "# Nested Classes and Event Handling 217\n\n![](img/efbd24814b512af8a3101a141a2f07a6_238_0.png)\n\
    \nFIGURE 10.1: Example of inner class.\n\nIn our example, a TimerListener object\
    \ is created within the constructor of the PopulateChars class. The outer object\
    \ for the new object of type TimerListener is the object that created the TimerListener\
    \ object. An inner object can also be created from the outer class. However, the\
    \ syntax is more involved because the outer object needs to be explicitly identified.\
    \ Here is an example.\n\n```\npublic class TypingGame {\n    public static void\
    \ main(String[] args) throws Exception {\n        PopulateChars populateChars\
    \ = new PopulateChars();\n        Timer timer = new Timer(200, populateChars.new\
    \ TimerListener());\n        timer.start();\n        JFrame frame = new JFrame();\n\
    \        frame.setVisible(true);\n    }\n}\n\npublic class PopulateChars {\n \
    \   ArrayList<Character> charList;\n    PopulateChars() {\n        charList =\
    \ new ArrayList<Character>();\n    }\n}\n\npublic class TimerListener implements\
    \ ActionListener {\n    public void actionPerformed(ActionEvent e) {\n       \
    \ charList.add((char) ('a' + (int)(Math.random() * 26)));\n        System.out.println(charList);\n\
    \    }\n}\n```\n\nExamine the code populateChars.new TimerListener(). This means\
    \ a new object of type TimerListener. However, instead of specifying the outer\
    \ object PopulateChars class, we need to specify the outer object: populateChars.\
    \ The reason is that every inner object needs to have a reference to an outer\
    \ object. This is similar to class inheritance because every object that belongs\
    \ to a subclass needs a reference to an object that belongs to the superclass.\n\
    \n> Objects of nested static classes have a reference to the outer class. Conversely,\
    \ objects of inner classes have a reference to an object of the outer class."
