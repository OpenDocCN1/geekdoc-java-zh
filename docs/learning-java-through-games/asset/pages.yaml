    ```


    The right-hand side can be an expression that evaluates to a value. Of course,
    the type of this value must be compatible with the type of the left-hand-side
    variable. The assignment operator actually returns a value. This means that you
    can write Java as shown below.


    ```

    x=z=4;

    ```


    This code will be executed from right to left. First, z will become equal to 4.
