  md: "# TABLE 8.1: Access privilege modifiers.\n\n| Modifier | Accessible from |\n\
    |---|---|\n| public | everywhere package and subclasses |\n| protected | only\
    \ within same package |\n| private | only from same class |\n\nrest of the world.\
    \ However, the computeStrength method is still defined as public and can call\
    \ it. The astute reader may suggest that we can simply define the method as private.\
    \ However, this is impossible in this case. The reasons are that (1) an abstract\
    \ method cannot be defined as private and (2) a method cannot be overridden.\n\
    \nBefore we present the solution to the problem, let us first examine the possible\
    \ modifiers for privileges in Java. Table 8.1 shows them in tabular format. The\
    \ protected keyword means that the data or access is within the same package and\
    \ within the subclasses. No modifier is when no access privileges are specified.\
    \ In this case, the class member is accessible only within the package.\n\nWhen\
    \ overriding a method in a subclass, Java does not allow us to assign access privileges.\
    \ For example, a protected method cannot be overridden by private. It can only\
    \ be overridden by protected, modifier, or public.\n\nNote that a private method\
    \ cannot be overridden. The reason is that the subclass should not know about\
    \ the existence of a private method in the superclass. Note that we cannot define\
    \ the computeStrength method in the FictionalCharacter class as private. The reason\
    \ is that we will not be able to override it in the subclasses. Our next choice\
    \ is to use no modifier. Here is the refactored code that shows a better design.\n\
    \n```\npublic abstract class FictionalCharacter implements Comparable<\n    private\
    \ String name;\n    public FictionalCharacter() {\n    }\n    public FictionalCharacter(String\
    \ name) {\n        this.name = name;\n    }\n    public String getName() {\n \
    \       return name;\n    }\n    public void setName(String name) {\n        this.name\
    \ = name;\n    }\n    abstract double computeStrength();\n    public int compareTo(FictionalCharacter\
    \ other) {\n        if(computeStrength()-other.computeStrength()>0) {\n      \
    \      return 1;\n        }\n        if(computeStrength()-other.computeStrength()<0)\
    \ {\n            return -1;\n        }\n        return 0;\n    }\n```"
