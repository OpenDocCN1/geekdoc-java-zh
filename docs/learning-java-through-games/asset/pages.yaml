  md: "resize windows, and so on. There are several GUI building tools that allow\
    \ us to do so (e.g., the ones with the NetBeans and Eclipse integrated development\
    \ environments). However, these tools are not covered in this textbook. Rather,\
    \ the book shows how to create robust GUI components from scratch by writing our\
    \ own Java code. Many of the components that we will create will have the advantage\
    \ that their size and placement will not be fixed and will be determined automatically.\n\
    \n# 9.2 Creating Windows\n\nThe basic component of any GUI program is the window.\
    \ In Java, there is a class Frame that creates a window. The Frame class is part\
    \ of the AWT library, while the JFrame class is part of the Swing library. In\
    \ fact, all the Swing library start with the letter J.\n\nAs usual, we will introduce\
    \ the different ways to create JAVA GUI using a game. Breakout is a game that\
    \ was developed by Atari in 1976. A layer of bricks covers the top third of the\
    \ screen. A ball travels across the screen, bouncing off the top and the side\
    \ walls of the. When a brick is hit, the ball bounces and is destroyed. The player\
    \ loses a turn when the ball hits the bottom of the screen. To prevent this happening,\
    \ the player has a movable paddle to bounce the ball upward, keeping it in play.\n\
    \nThis chapter describes how to display the different components of the Breakout\
    \ game (Figure 9.1). The actual Breakout game is finished in Chapter 11, where\
    \ the ball movement and keyboard interactions are addressed.\n\nThe first order\
    \ of business is to create the window where all the action happens. A typical\
    \ design is to create a class that extends the JFrame class (i.e., a Swing window).\
    \ Here is a possible implementation of the main method of the Breakout game.\n\
    \n```\npublic class Breakout {\n  public static void main(String[] args) {\n \
    \   BreakoutFrame frame = new BreakoutFrame();\n    frame.setVisible(true);\n\
    \  }\n}\n```\n\nThe first line in the main method creates a BreakoutFrame object\
    \ (i.e., the window for the Breakout game). The constructor of the BreakoutFrame\
    \ class will create the window and the paddle, and the bricks, in the window.\
    \ By default, every Java window is created to be initially invisible. This is\
    \ done in order to allow the developer to populate the window before it is displayed.\
    \ The second line of the main method displays the window.\n\nUnlike console programs,\
    \ GUI programs do not terminate immediately after all the code is executed. If\
    \ a window is open, the program will wait for the window to close before it finishes\
    \ execution, unless a command, such as System.exit(0) forces the program to terminate.\
    \ The last command quits the program with exit code 0, which means normal program\
    \ termination. Note that even putting the return inside the main method will not\
    \ terminate the program if a window is already created. Usually, it is much better\
    \ to wait for the user to close all the windows before the program terminates.\
    \ An exception to this rule is considered bad programming practice, except when\
    \ something bad happens and the program does not know how to proceed and the only\
    \ alternative is to terminate the program."
