    # 2.8 Summary


    The chapter presented an introduction to Java programming. Using an integrated
    development process, such as NetBeans, simplifies the development process. NetBeans
    not only helps us identify compiler errors instantly, but also allows us to execute
    our program by line and monitor how the variables change (a.k.a., debug the program).

    The corners of any program are the variables. They can be thought as the "memory"
    of the program. Throughout the execution, we can use variables to save important
    data. Java allows us to create variables that store characters, integers, reals,
    and strings, among others. Note that every type has a restriction. For example,
    we cannot store a number that is bigger than three billion inside. Similarly,
    we can only store a finite number of real numbers inside a variable of type double
    and loss of precision is common. Sometimes, the value of a variable can be supplied
    from the keyboard. In other cases, the value of a variable can be the result of
    some computation. As we saw, we can assign a variable to be equal to a random
    number.


    Managing the control is an important part of every program. For example, some
    want to change our program based on the validity of a condition. In this case,
    we can use an if statement. Similarly, we can use a switch statement when we want
    to check if a variable is equal to one of several values, where a switch statement
