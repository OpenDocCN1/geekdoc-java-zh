    \nA switch statement checks the value of the variable inside the parentheses.\
    \ If it is equal to the first case value, the program jumps to that case and continues\
    \ executing. A break statement is put at the end of every case block in order\
    \ to guarantee that only one case statement is executed. For example, if the break\
    \ statements are removed from the above code and the user enters the string \"\
    A\", then all print statements will be executed.\n\nThe break statement exits\
    \ out of the current switch statement and goes to the first line immediately after\
    \ the switch block. Usually, a break statement is required at the end of each\
    \ case block in order for the switch statement to work properly. A break statement\
    \ is not required after the last switch block (assuming there is no default block)\
    \ because the program exits the switch statement after that anyway.\n\nNote that\
    \ the switch syntax allows a default option. In the above code, if the input string\
    \ is not equal to \"A\", \"B\", \"C\", \"D\", or \"F\", then only the last print\
