    I have set out encounter and asceticism as two opposite and complementary modes
    of action, each informed by Javanese conceptions of potency and its effects.¹⁰
    Actually Javanese elderly males would often tell me the truly potent are engaged
    in ascetic exercise at all times. They can practice the loss of all self-interest
    and affect in the course of everyday life, therefore having no need to go off
    into seclusion to meditation. This capacity to disengage from the world while
    remaining fully functional within it suggests that such a person wields control
    over others, yet enjoys resistance to them at the same time. As such, it is an
    ideal Japanese representation of individuals'' interaction with the world. Yet
    that ideal contains within it not a model to which one may aspire to conform,
    but also a prescription and standard to which one may try to hold others accountable,
    particularly people whose status is superior to one’s. Ideal models are never
    simply inspirational guides for the right-thinking, though they are often formulated
    in such terms. They are also polemical positions adopted by people as grounds
    for criticizing others, and/or as justifications for resisting other people''s
    activity. In the chapters that follow, I will describe how people actually interact
    in a number of domains, domestic, political, curative, and aesthetic. Not surprisingly,
    self-interest, emotions, and the vagaries of events turn out to make life far
    less smooth than the ideal of selfless and potent selves might imply. Nevertheless,
