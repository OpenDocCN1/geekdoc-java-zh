    The transfer of speech or its effects from one person to another may seem unexceptional
    in the case of ritual action. Rituals in many cultures are carried out by officiants
    whose labor may be in some compensated if the sponsors wish to enjoy their fruits.
    Yet it is not only God and spirits that are addressed by an intermediary. The
    male sponsor asks the religious specialist, and often another guest in addition,
    as I have mentioned, to address the assembled guests as a group, rather than address
    them directly himself. This suggests the need to have someone intervene not only
    between sponsors and spirits but also between sponsors and guests.


    The pattern is repeated in more elaborate form when a family holds a ritual celebration
    on a large scale (nduwé gawé). Then a moderator and a series of high-status speakers
    address the guests and speak for the sponsors, the sponsors again remaining silent.
    These speeches begin with the moderator standing before the guests, flanked by
    the male and female sponsors. The moderator''s first words consist of an elaborate
    and conventional welcome to the guests, the moderator noting that he has been
    asked by the sponsors to extend these greetings because their bombobaying manah
    prevents them from speaking. Bombaying manah refers to a feeling of great pride
    and satisfaction, and the moderator explains that the sponsors are deeply honored
    by the presence of so many distinguished people at their ritual celebration. He
    goes to on to express their profuse thanks and their deepest apologies for any
    inefficiencies or errors that have been or will be committed in the course of
    the event, and their sincere wish that the'
