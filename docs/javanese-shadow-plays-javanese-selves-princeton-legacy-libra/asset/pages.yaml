    # PLEASURE AND FOCUS IN WAYANG


    Wayang plays on degrees of focus and attention in the same way gamelan. In fact,
    shifts in the degree of musical focus in a series of gendhing parallel the dramatic
    progression within each of the three sections of a performance of wayang. As mentioned
    above, a different musical mode (pathet) is used in each section of a night-long
    wayang. Every section begins with a formal discussion and ends in battle.¹⁵ The
    structure of each of these parts could be seen as a play on the sort of attention
    spectator views. The initial scene opens in each case with a long, conventionalized
    description of the place, with a musical accompaniment that exploits the full
    range and subtlety of the gamelan orchestra. Conventional greetings among all
    characters follow. At this point, spectators listen in diffuse enjoyment to the
    music and the dalhang''s torrent of words, or they pay no attention whatever,
    chatting instead with friends or, later in the evening, falling asleep. As the
    discussion among the characters becomes more specific, there is greater focus,
    and the spectators'' attention is captured. Yet the kind of interest aroused by
    whatever the lakon its impetus is soon dispersed by the set pieces, such as the
    departure of the troops and the battles that conclude each section. These battles,
    while watched vividly, are accompanied by a poundingly repetitive musical piece
    played by only the loudest of the gamelan instruments. But they draw attention
    to the excitement of the moment and to the dalhang''s skill in manipulating the
    puppets, not any overarching dramatic conflict. The outcome of the battle is in
    each case foregone: the first ends in a draw; the second in the death of mortals;
    and


