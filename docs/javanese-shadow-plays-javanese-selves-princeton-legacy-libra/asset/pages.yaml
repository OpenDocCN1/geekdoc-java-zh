    parental checks.) A girl''s first marriage may well be at an early age and against
    her will, so she may resist any sexual advances for a long time, and some marriages
    end in divorce before they are consumed.


    A woman''s fidelity is much stressed, but a man need only be discreet in his extramarital
    dalliances. Women are sometimes deeply hurt by their husbands'' infidelities.
    Yet although women in such circumstances garner pity, their husbands earn little
    censure. It is considered preferable that he go to prostitutes rather than have
    a mistress, since the financial drain is likely to prove much greater in the latter
    case. It is my impression, though, that few have long-term extramarital affairs,
    preferring the occasional time with a prostitute or perhaps a quick visit to some
    woman in the area known to be free with her favors. That men and women often look
    both for this little emotional commitment from each other may account for this
    casual attitude toward men''s extramarital sex, which is seen as more a threat
    to the household economy than to the couple''s emotional satisfaction, and for
    the unlikely of such activity leading to long-term affairs.


    A man''s authority requires that his wife defer to him in his expectations and
    demands, that she address him in some degree of refined language, and that she
    conduct herself generally in ways befitting his (and therefore their) status.
    Theoretically, a woman should never contradict her husband''s opinions or decisions.
    In practice, like anywhere else in the world, she can exercise considerable influence,
    by passive resistance, persuasion, or even fairly obvious dis-agreement. And she
    holds the purse.


    Issues of financial authority frequently give rise to conflict in a family. The
    most common cause of divorce, and the grounds for divorce neighbors find most
    compelling, is a husband''s failure to keep money flowing into the household''s
    coffers. Should a man refuse to hand over all or at least most of his earnings
    to his wife, he already appears irresponsible, unless his wife has previously
    shown herself incompetent at handling money. When a young man from another village
    wished to marry a woman in Karanganom, rumor went round that he had been divorced
    by his first wife because he gave money only in small sums, rather than letting
    her take charge of his income. His new, unwilling fiancée resisted the match to
    the end and neighbors, repeating the rumor, tended to sympathize with her.'
