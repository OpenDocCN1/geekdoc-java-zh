    # THE FAMILY


    Javanese conceive of the relationship between husband and wife in terms of his
    authority and her financial control. On the affective aspects of the relations
    between spouses, Javanese are far less romantic than Westerners. Passion is never
    thought really appropriate to marriage. To gandung (“mad with love”) implies instability
    and probable sorcery. Instead, tresna, an abiding devotion to Poerwadarminta defines
    as “affection” and generous feelings for another person (without desire) should
    characterize the tie between husband and wife. Often, the affection seems real
    and the bond as strong as in any stable Western marriage. Nevertheless, the enormous
    warmth and solicitude that mark Javanese interaction with very small children
    contrast sharply with the restraint and even brusness that obtain between spouses.


    Sexual activity is inhibited for as long as newlyweds live with one’s parents,
    and again as soon as there are children. Traditionally, newlyweds were supposed
    to wait until forty days after the wedding before consumating their marriage.
    If the couple lived with either spouse’s parents, furthermore, one of them to
    sit up until both parents had retired, as a gesture of respect. An older man joked
    about how impatient he would become, as a younger man, knowing his new wife was
    waiting for him in the area of the house in which newlyweds slept, while his father
    sat in the front room, lighting up another cigarette. “If you were lucky,” the
    man related, “You go to bed now.” But then he’d add, “But don’t secure the door.”
    That was so later the parents could look in to see the younger pair lay asleep
    close to each other, a sign they were ‘in accord’, or still sleeping on either
    side of the sleeping platform.” (Since Javanese usually sleep, and make love for
    that matter, fully clothed, modesty is not compromised by these


    text, and some of the points I present here find findings. My remarks, however,
    while far less comprehensive than Geertz’s, focus specifically on the issue of
    authority and relations to it, giving my analysis a sufficiently different emphasis.
    I hope, to justify some overlap in the ethnography.


    There is also some overlap with Bateson and Mead’s perceptive and provocative
    Balinese Character (1942). The affinities between Javanese and Balinese culture
    are many. So are the differences. That child-rearing practices in the two cultures
    bear such similarities, while social organization, religious life, and each differ
    markedly, demonstrates once again—in a backhanded way—that culture is never reducible
    to child-rearing practices or any personality traits that supposed supposedly
