  md: '# POTENCY, POSSESSION, AND SPEECH I17


    the spirit, who is said to have taken its victim''s voice.³ The wong tuwa is able
    to defeat the spirit provided his baton is stronger. If the spirit is less potent
    (kalah kuat), then it fears/respects (wedi) the wong tuwa, and when the latter
    demands to know who it is and what it is after, the spirit answers meekly and
    truthfully (still using, of course, the victim''s voice). It may explain that
    some human''s (unintended) slight provoked its attack. Often, there is no clear
