  md: '# 7. THE DHALANG, THE TROUPE, AND THE TRADITION


    The dhal becomes the central figure at a ritual celebration from the time he starts
    performing until he stops eight or nine hours later. During this time, the sponsors
    recede discreetly into the background as an unseen though crucial force. Yet if
    the dhal appears in some respects obvious, even flamboyant, in his performance,
    the active agent of an evasive authority, much about the dhal himself repeats
    the play of power both constraining and restrained, pervasive yet dismantled.
    Actually, more diversely and dynamically than in relations between dhalang and
    sponsors, the links between the dhal and the wayang tradition, the dhal and the
    audience play on degrees and kinds of authority. I will discuss each of these
    relations in turn, reserving the last-mentioned—the relations between the dhalang
    and the audience—for the next chapter.


    # THE DHALANG AND THE TROUPE


    Before World War II, at least outside town, a wayang was a much less elaborate
    affair than it is today. The gamelan consisted of only a few instruments, and
    there was no female vocalist (pesindhên). Classically, wayang was performed exclusively
    in sléndro, but recently it has become fashionable for a sponsor to rent a gamelan
    with both sléndro and pélog components.¹ In that case, dhalang then play a few
    scenes in pélog, though most of a performance continues to be performed in sléndro.
    If the sponsors do not rent a pélog set, a fairly complete sléndro set, at least,
    is thought essential, and the absence of a pesindhên would strike everyone as
    aberrant.


    ¹ There are three basic scales in gamelan music: sléndro, pélog barang, and pélog
    bem. The sléndro scale is played on one set of instruments; the two pélog scales
    must be played on another. In the case of the generic gendér (metalophones consisting
    of bronze keys suspended over individual resonating chambers), it is preferable
    to have three different instruments, one tuned in sléndro, another in pélog barang,
    and a third in pélog bem, though one occasionally finds a gênero that can play
    either pélog scale by the substitu-


    ![](img/c76e144f96e877da28e1a1be57a941eb_209_0.png)'
