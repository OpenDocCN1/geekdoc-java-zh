    # RESEARCH METHODS


    I lived twenty months in a village I will call Karanganom in the kabupaten (country)
    of Klaten, Central Java, during a twenty-two month stay in Java in 1978-1979.
    I boarded with a dhalang, whom I have given the pseudonym of Pak Cermadikrama,
    and his family. My research consisted partly of interaction with the Cerma family,
    which was five sons living at home, and one granddaughter who lived with them
    most of the time. The granddaughter''s parents, the C'' oldest son and his wife,
    lived with two other children in a hamlet nearby. The C'' daughter and her husband
    and their two children lived in the coastal city of Semarang and visited Karanganom
    only rarely.


    Most days I journeyed to the homes of dhalang in the areas of Klaten, Sala, Jogja,
