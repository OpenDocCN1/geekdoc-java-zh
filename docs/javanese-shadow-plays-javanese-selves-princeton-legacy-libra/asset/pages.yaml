    Pak Lurah''s failure to follow through came back at him in another incident that
    was a serious blow to his prestige. A few years before my stay in the village,
    a poor young woman, Yu Paiman, whose parents were dead and whose brother and sister
    had left the village, became pregnant by a middle-aged man from the adjoining
    kalurahan, Pak Tomo, who was married and relatively well-off. Although he would
    normally have been forced to marry a woman he had gotten, Pak Tomo was able, with
    Pak Lurah''s assent, to avoid marriage by promising to Yu Paiman child support.
    He gave her one small payment and that was the end ofuntil he started coming to
    her place again after a couple of years. Yu Paiman felt powerless to refuse him,
    but she notified some youths, the oftentimes upholders of public morality in a
    Javanese village, of his visits, and they captured him. Pak Lurah made a great
    show of outrage and packed him off with the police summoned from town, saying
    that Pak Tomo had made clear that he would not abide by village rules and so,
    Pak Lurah, was forced to turn him over to higher authorities.


    Imagine, then, Pak Lurah''s dismay when Pak Tomo turned up at'
