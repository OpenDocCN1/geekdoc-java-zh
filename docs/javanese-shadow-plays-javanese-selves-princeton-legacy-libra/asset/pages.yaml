    The palace dhyang constitutes a counterpart to the king, one that lives in the
    invisible realm of spirits. (Dhyang are often described as marshalling armies
    of subordinate spirits, just as the king marshals human soldiers.) The ideal king—like
    the ideal father, the ideal guru, and the ideal lurah—is without selfless or aggressive
    impulses of any kind. He is the apex of order. Nevertheless, the paired figures
    of king and palace dhyang actually exemplify the equivocal nature of any concentration
    of power. That is, the idealized view of power as potency sees its concentration
    manifested in a hierarchy of individuals joined in voluntary submission to the
    protective king. In the dark side of the dhyang, however, lurks the impression
    that in this stable order there inheres competition, conflict, and the threat
    of violence as well. Although neither king, lurah, father, or guru is believed
    to hostile impulses, behavior and ideology point in each case to a deep-seated
    distrust of their authority.


    # MAGICAL MEANS AVAILABLE TO THE POTENCY-DEFICIENT


    Because concentrations of potency are always equivocal—potentially beneficial
    and potentially threatening to one''s integrity and status—finding ways to benefit
    by such potency outside oneself is always problematic. Asceticism represents the
    ideal way to accumulate potency, increase one''s status, and attain one''s''s
    ends in Java. Not everyone, though, has the stamina to practice ascetic rigors
    consistently. For the many people whose reserves of potency are low, various means
    are available by which to make up for their own batik deficiencies. Among such
    means, to “seek wealth” with a compact with a spirit is thought perverse; to consult
    a magic specialist or other respected elder is found eminently respectable; to
    visit a medium is believed efficacious but suspect; to make a vow is thought risky
    and unpredictable in its effects. In each case, people trade some degree of their
    own sovereignty by submitting to an external authority, in the hope of attaining
    some end. And just as asceticism augments power by making people exempt from the
    power other''s speech might have over them, and'
