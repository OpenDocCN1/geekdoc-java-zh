  md: '# THE PLEASURES OF THE PERFORMANCE   II I


    contradictions, of social hierarchy, two figures, Bathara Guru and Semar, provide
    further examples of how wayang points to inconsistencies without confronting them:
    in this case, conflicting impressions of the father. Guru is a god and the king
    of heaven. In those lakon in alihan, he and his monstrous wife, Bathari Pramuni
    are the two characters most likely to be revealed in the denouement to have caused
    havoc among the cousins. Whereas Guru is powerful in hierarchical terms, Semar
    is at the bottom of the hierarchy but very potent. Semar is something of a permanent
    alihan. He, Guru, and another punakawan, Togog, and a servant to whichever foreign
    adversary figures out in a lakon, all arouse out of an original egg. Semar and
    Togog were forced to become servants on earth, while Guru became the king of heaven.
    Semar, nevertheless, is immensely potent, and he is considered the danyang of
    Java. His familiar, ugly form is just an alihan demonstrated in certain lakon
    in which he regains his original, elegant appearance. (He is never thought of
    in this form, however. A somewhat daffy dhangcumdhuk showed Semar’s “photograph,”
    which he had taken during a meeting with Semar. It showed, in a very vague image,
    Semar’s usual, obese figure dressed in the checkered cloth characteristic of the
    punakawan.) Claims are made that he still resides in certain caves in Java, and
    he crosses the boundary between the world of wayang and the everyday world more
    than any other character.


    Both figures, Guru and Semar, especially Wisnu, Bayu, and Mahadeva, are among
    the most important gods in the wayang repertoire. His monstrous son, Bathara Kala
    (born of Guru’s seed when it falls in the sea), and the relations between Guru
    and Kala, form the frame of the wat ritual, the most important ritual of wayang.
    Semar is thought of as father of the three other punakawan who join him in serving
    the righteous party (although according to relatively obscure stories, they are
    actually only his adopted sons). What is striking about both Guru and Semar, however,
    is that they fulfill the image of the strong and effective father so imperfectly.
    Guru is a conniving and lustful figure who is impelled by his own selfishness
    to side with the Kurawa. He is ostensibly structurally powerful and spiritually
    potent, yet his machinations lead over and to his disgrace and rout. Semar, for
    all his great potency, not only play'
