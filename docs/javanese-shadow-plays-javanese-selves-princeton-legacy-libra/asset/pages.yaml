- pgno: 72
  md: '# 2. FAMILY RELATIONS


    Assumptions about the self, power, and interaction inform two kinds of action—interpersonal
    encounter and ascetic practices—that stand as complementary opposites in Java.
    These assumptions do not simply suffice the atmosphere; however: they must be
    learned and acted upon. They are not systematically taught, nor are they explicitly
    articulated. Instead, they are learned and applied in specific contexts, and in
    diverse ways. My purpose in this chapter is to show how young Javanese become
    familiar with these assumptions in the workings of Javanese families. In the following
    three chapters, I will consider how people draw upon such understandings in diverse
    domains: that of political authority, in the realm of village politics; that of
    mystical status, in curative and preventive practices; and that of social status,
    in ritual celebrations. In all these domains, the ambiguous nature of the links
    between potency and power gives rise to repeating patterns in the distribution,
    use, and manifestations of power.


    Javanese acquire basic understandings of self and power first of all in the interaction
    among family members. Differences between a father''s and a mother''s role acquaint
    a child with different versions of power and the different responses they should
    evoke. In particular, the idealization of the father attributes to him great potency
    (kakuwatan batik), while effectively minimizing his actual control over other
    members of the household. To the degree therefore he fulfills the idealized Javanese
    version of masculine authority, a Javanese father protects the image of his authority
    while relinquishing an active role in much of family life. The avoidance relations
    that come to characterize relationships particularly between fathers and sons
    are then a model for the strategies by which Javanese deal with many figures of
    authority outside the family, seeking to gain by their potency while resisting
    any influence over one''s actions.


    > ¹ The student of Javanese culture is fortunate to have an excellent description
    of Javanese kinship and family relations in Hildred Geertz''s monograph The Javanese
    Family (1961). Not surprisingly, twenty-five years have wrought little change
    in the way a Javanese family functions, for all the changes in the political and
    economic con-


