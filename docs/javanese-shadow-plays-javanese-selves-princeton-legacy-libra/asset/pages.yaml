  md: 'tween classical verse and its readers. Traditionally, all Javanese literature
    was written in sung verse, called tembang. There exist several different tembang
    forms, each with a distinct name and each distinguished from the others by the
    number of lines to a verse, the number of syllables to a line, and the final vowel
    sound in each line. Only very rarely did anyone read literature in a speaking
    voice, and Javanese do not, as a rule, read silently. But readers choose to sing
    the tembang following whatever vocal line they wish. Several well-known vocal
    lines exist for each type of tembang, and some among these are thought suitable
    for particular moods. But those decisions are left to the reader. A tacet indicates
    at most, at the beginning of a series of verses in a particular form, the name
    of the verse form that follows. Often it is instead left to the reader to discern
    the meter without benefit of overt references. Having elected to sing a verse
    with a particular vocal line, readers also embell each phrase with variations
    or decorations (*cengkok*). Their use, again, is a matter of personal taste and
    skill. In public performance, singers will extend their rendering of a single
    verse with elaborate displays of their vocal technique. Simpler, less highly worked
    versions of each tembang are thought more suitable to the longer sections of classical
    texts. In each case, however, readers must be able to vary their reading of verses
    with these graceful and well-executed additions.⁴


    > * art of reading in Java is in terrible decline, today, and with it popular
    knowledge of Javanese literature. A few city people still cultivate the performance
    of tembang. Traditionally, tembang and the related *kindang* were sung by individual
    guests at a gathering of males (*jajongan*) held for several nights after a woman
    gave birth, in order to protect and child from harm. Two developments have virtually
    erased this practice. The failure of public schools to teach children Javanese
    means that many of the texts currently available to villagers are now negligible
    to most people under age four. Radios are now numerous in villages, and at a jajongan
    a child''s birth, radio blares while the men play cards.


    Young people may know few tembang. But they cannot read. In fact, there is a peculiar
    version of literacy in Indonesia today, concentrated among relatively highly educated
    people. Unless they have taken a special interest in the performance arts, especially
    wanting, young Javanese (also Balinese, and I assume Sundanese) are ignorant of
    the classical vocabulary that their fathers use, even if illiterate, can often
    understand. At school, these younger people have learned Indonesian, and they
    can read the modern amalgam of Malay, Arabic, Dutch, and English that that language,
    especially when they read, comprehends. They yet yet read no literature in any
    language, except for a few city people who read short stories published in the
