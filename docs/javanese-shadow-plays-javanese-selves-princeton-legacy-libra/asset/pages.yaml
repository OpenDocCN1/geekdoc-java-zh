  img_proc: true
- pgno: 235
  md: 'and its signs are essential aspect of the differentiation of characters. No
    matter what the lakon, the status and style of a character should be respected
    at all times. The structure of authority is apparently quite straightforward.
    The gods have superior position and power to those of the knights (satriya) and
    servant-clans (punawan), and within each of these sets are further gradations
    according to rank and age. In support of the official hierarchy stands the official,
    if unstated, conviction that superior status depends on superior accumulations
    of potency. As Anderson has pointed out, the loci classici for this notion of
    potency are, in stasis, the description of the perfect kingdom with every performance,
    and in action, the satriya''s fight against monsters around 2:30 in the morning
    (Anderson 1972b:39). In the first case it is the noble qualities and mystical
    power of the king that cause all to submit voluntarily to his suzerainty. In the
    second, it is the same store of kakuwatan batin that makes the knight invulnerable
    to attack and fearsome in the efficacy of his counterblows.


    The hierarchical distinction of types of characters does not apply so clearly,
    however to the two sets of cousins, the five Pandawa and the hundred Kurawa, whose
    struggle for the kingdom of Ngastina forms the basis of most wayang performances.
    The tension that motivates the Mahabharata stems from the intricate and intertwining
    claims of the opposing cousins, each party having at least some justice on its
    side. The Javanese response to this complexity, however, at least the current
    one, is to simplify the issues and to distinguish the sides as far as possible.
    Differences in status among the cousins are fine, but contrasts in appearance
    and character receive great emphasis. No Kurawa has the form of a truly refined
    knight. All are large, or misshapen, or at the least look straight ahead unashamedly.
    One has a defect, another a loud laugh, another an East Javanese accent. Their
    characters are unattractive: they are unscrupulous, selfish, often cowardly, stupid,
    or/rude. By depicting the Kurawa in these unflattering ways, dhalang magn the
    contrasts and minimize the connections between the Pandawa and the Kurawa.


    The division into good—righteous, attractive, admirable—and bad—devious, unattractive,
    unworthy—is thorough in wayang as to rule out the analysis of character, motivation,
    and ethics on which much Western drama is based. In fact, the aggregate of known
    traits that constitutes a puppet''s appearance and manner permits no char-'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# THE PLEASURES OF THE PERFORMANCE 207


    acter development. Each character has a voice and style that a dalang recreate
    in every performance. This maintains the careful and comprehensive separation
    of characters into contrasting sets. Action follows the movement of one or more
    sets of characters out of their proper domain. They cannot move outside of their
    established type.


    Wayang posit one means of escape from the constraints of status and type, however,
    in the common plot device of alihan. Alihan refers to the capacity of one character
    to take on the appearance, manner, voice of another, often entirely different
    sort of figure.4 In Senawagi, Bathara Pramuni changes form (malih) to become Bagawan
    Duralacika. In many lakon, Bathara Kala uses the same ploy, and in many others,
    Bathara Guru who does so. Since appearance and status are identity in wayang,
    when characters malih they overcome the constraints of their own identities. They
    impinge on others'' behavior without revealing anything about themselves. In this
    way, they minimize their implication in one and others'' action. When, for example,
    Bathara Guru takes the appearance of a priest in order to negotiate a settlement
    between the Kurawa and the Pandawa, his disguise is. He pretends to be a priest,
    rather than a god, and he pretends to work for the good of all when he really
    seeks the Kurawas'' gain. His pretense is often explained as the means by which
    he hopes to further the interests of the Kurawa—one of whose daughters he lusts
    after—without sullying the image of a god. Gods, after all, should not be given
    to such base self-interest, and should not support injustice. Its inevitable defeat
    at the hands of a powerful knight or one of the few gods who outrank him lays
    bare the deception. Then he must return to his proper place (heaven) and only
    the most powerful characters in wayang are capable of this dissolution of identity
    through alihan: the gods, the Pandawa, and one or two of the most powerful characters
    on the Kurawa side. And only an extremely powerful opponent can dispel the disguise
    through battle.


    As long as a disguise has not been penetrated, a figure who malih escapes, in
    any way subverting, a critical element in Javanese


