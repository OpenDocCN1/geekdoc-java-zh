- pgno: 46
  md: '# I. LANGUAGE, POWER, AND ASCETICISM


    Formal Javanese encounter is remarkable. Among people who are not close kin or
    longtime associates, and to an extent even among them, face-to-face encounter
    requires that everyone take great care to behave in a manner appropriate to his
    or her relative social status, no matter what the business at hand. Vocabulary,
    sentiment, gesture, timing—all must be adjusted carefully in view of the responses
    they are liable to arouse among the people present, and in view of one''s own
    social status relative to theirs. Such issues matter in encounter— certainly,
    but in Java the degree to which they have been organized in a repertoire of vocabulary
    sets and conversational strategies is quite awesome. To interact in Java means
    to anticipate, gauge, adjust for, and at times presume upon—but never unwittingly—the
    responses of one''s interlocutors.


    Yet a topic that occupies Javanese is ascetic exercise, a striking fact about
    ascetic rigors is that they suggest obliviousness to others and to the world.
    Asceticism is a means, furthermore, to make oneself more impressive and less subject
    to external influence even in everyday affairs. This among other things that a
    person who has accomplished many ascetic rigors is thought capable of controlling
    encounter in ways that other people cannot.


    Encounter and asceticism stand as two opposite but linked kinds of action. In
    Javanese thinking about experience. Each of them, and the way people relate them
    to each other, can clarify Javanese understandings of power. They enable us, as
    a result, to see how those understandings inform Javanese interaction in specific
    relationships, such as in the family, in political relations, and in the arts.


    # SOCIAL STATUS AND RELATIVE STATUS


    To appreciate the stakes in Javanese encounter, and to clarify the present discussion,
    it is worth making a somewhat arbitrary distinction between social status and
    relative status. I will take the former,'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# CHAPTER I


    social status, as an ongoing position of greater or lesser prominence in a group,
    determined largely by genealogy and control over labor and/or valued resources.
    Such control may be due to bureaucratic position, wealth, esoteric knowledge or
    skills, kinship ties, etc. What I will call relative status is the degree of deference
    a person elicits from his her interlocutors in the course of any specific encounter.
    Social status is liable to shift only relatively slowly, whereas relative status
    is entirely contingent upon who participates in a particular exchange. Of course,
    the two are intimately linked: social status determines in large measure the difference
    one evokes, and so one''s relative status, in any encounter. Yet relative status
    is always contextual, ephemeral, and to some degree negotiable. Social status
    sets the limits within which the negotiation takes place, but it still leaves
    room for "discussion," as people affirm, modify, or contest participants'' estimations
    of their relative status. Though social status certainly matters deeply to us
    all, Westerners and Javanese alike, nevertheless relative status—the degree of
    respect people elicit in any given encounter arouse an intensity of interest among
    Javanese that Westerners, and some other Indonesians, may find surprising.¹ The
    Javanese language provides the clearest means by which that interest is played
    out in encounter.


    Social status in Java is defined fairly loosely. The aristocracy in court cities
    attends meticulously to the ranks of its members according to the same system
    of "sinking status" Clifford Geertz has described for Bali (e. Geertz 1980). Abstract
    status, however, touches only a tiny fraction of the population. Instead, considerations
    of wealth, age, education, profession, and who one''s kinsmen determine, somewhat
    vaguely, a person''s status. Actually, there are few distinctions with which to
    categorize people beyond the gross labels of nobleman, civil servant, trader,
    laborer, or peasant. Individuals


    > ¹ I should point out that this analytic distinction between social status and
    relative status corresponds to no Javanese terms. Drajat("degree," "rank") comes
    closest to ranked individuals, such as aristocrats and civil servants. Other kinds
    of distinctions, such as kinds of villagers (owners of irrigated land, of households
    only, or of no land), occupations (peasants, civil servants or merchants), or
    degrees of education (ignorant people versus schooled people), imply social status,
    though by no means in any clearly ordered universe of terms. To speak of the finer
    distinctions at issue in encounter, that I am labeling relative status, however
    Javanese would simply speak of who, in any given instance, gave and received what
    specific kinship terms and what indications of respect or its opposite.'
