- pgno: 234
  md: '# THE PLEASURES OF THE PERFORMANCE 205


    so critically or satirically, only contrastively. By following out the implications
    of Javanese social norms, wayang surpasses without really undercutting the tenets
    of Javanese culture.


    Aside from the issues recurrent conventions of character and plot pose, however,
    I wish to recast the question of what wayang means more radically. The evocativeness
    of a performance should be sought, not in what a particular lakon means, but rather
    in the range of issues, such as authority, consciousness, and submission, that
    every performance of wayang plays upon by virtue of the medium itself. By considering
    the “meaning” of the medium, not the message of a particular lakon, I will treat
    all performances as equivalent. Javanese commentators do the same, but to make
    a very different point, and I should state at the outset that my interpretations
    diverge greatly from Javanese views of wayang. I hope I have not distorted any
    facts, but I have certainly fitted those facts, plus informants'' comments, into
    arguments many Javanese would reject.


    # STATUS, POTENCY, AND WAYANG


    Issues of style, status, and potency underlie the relations between characters
    and many turns of plot in wayang. Time-honored oppositions in style and status
    distinguish the characters in wayang with even greater clarity than in social
    life. All characters are marked by distinct types of eyes and noses, degrees of
    distance between the feet, kinds of dress, and qualities of voice, all of which
    establish both the status and general temperament of any character. It is a system
    of pertinent oppositions: each trait means something only by virtue of the fact
    that it differs from other possibilities within a delimited range. And one trait
    tends to imply others. The pitch of a character’s voice, for example, depends
    on the angle of the tilt of it or her face, and the higher the puppet’s gaze,
    the higher is its voice. In as in other respects, the primary distinction is in
    degrees of refinement, and Javanese culture is weighted normatively toward what
    is refined (alus) over what is crude (kasar).


    Status, regardless of style, is also critical to interaction in wayang,


    > ² I have not attempted, in the following remarks, to present a general description
    of wayang, because many such accounts have already been published. Van Ness and
    Prawoiroharjo 1981 is a recent presentation of the essential information.


    > ³ For a recent discussion of types of wayang figures, see Solomon 1980.'
