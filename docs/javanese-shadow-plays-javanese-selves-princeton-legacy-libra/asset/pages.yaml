    scary, I was assured that prwangan hardly existed in Central Java—and that East
    Java was crawling with them.)


    Yet people go to prwangan for the same reasons that they go to wonga tung, and
    the procedure of a visit and the provision of small gifts are also the same. Prwangan
    summon a spirit, usually a particular spirit familiar, in some cases any of several,
    and become-entered or possessed by that spirit. (The word for possessed is again
    kepanjangan, as in the case of a person possessed involuntarily.) Suppliants speak
    directly to the spirit, or perhaps through the offices of an attendant, and state
    their particular needs. The spirit may give instructions, ritual prescriptions,
    or general advice. Eventually, it signals the end of the audience, either by saying,
    “Fine, that’s enough,” or by departing from the prwangan’s body. Afterwards, the
    prwangan usually declares complete ignorance of what transpired and must be informed
    of the spirit’s remarks.


    The bad reputation that prwangan has does not diminish the impression of their
    efficacy. Even if prwangan are subject to disparaging remarks, their transparency
    to spirits makes consultation with them particularly effective. Rather than relying
    on the mediating ministrations of a wonga tung, a person who consults communicates
