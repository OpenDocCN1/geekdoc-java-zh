    proach often, seeking to support a point by reference to Javanese comments on
    relatively unusual events, events that take place, as it were, on the margins
    of experience. In particular, I have drawn on the many comments informants made
    in the idiom of kebatinan, the great range of mystical beliefs that color much
    Javanese thinking about events. My point is not to reduce Javanese culture to
    an assortment of odd ideas about the workings of unseen forces in the world. Rather,
    it is to use these comments on the edges of phenomena as a kind of cultural exegesis
    formulated by the culture''s own participants.


    If I may draw a rather prickly analogy, an anthropologist must discern the import
    of cultural phenomena by gaining informants'' associations to these facts. This
    means first of all recording people''s comments upon their own experience. It
    also means observing their actions. Robert Jay has applied a useful distinction
    in this regard to differing levels of generalization in Javanese conversation
    (Jay 1969:20-29). The normatively approved values expressed at high levels of
    conceptualization, notes, may be contradicted by remarks made at more immediate
    levels. The same point applies to people''s actions as well. What people do in
    Java, like everywhere else, may well conflict with the norms they profess to,
    fits Jay''s distinction between greater and lesser degrees of conceptual generality,
    because action is a kind of expression of the least generalized and most immediate
    level. It is a “statement” even more immediate and less highly conceptualized
    than casual remarks, and observed action can often put commentary in a fuller
    context. Actions, that is, are further associations to stated norms, unstated
    preconceptions, and often conflicting wants, all of which are necessarily both
    personally and culturally motivated.


    A difficulty nevertheless presents itself: even if anthropologists gather something
    akin to psychological associations in their efforts to explicate cultural phenomena,
    there is no single subject in which the associations are assimilated—except the
    anthropologist himself or herself. This supposed gathering of material is really
    the generation of further associations, now the anthropologist''s own, and this
    step immediately implies distortion. But that is my point. Distortion is a necessary
    feature in the process of interpreting a culture, or really, facets of a culture,
    all the more so when interpretation is accomplished through the agency of one
    person. Analysts of cultural data can only present their interpretations in such
    a way as to show what'
