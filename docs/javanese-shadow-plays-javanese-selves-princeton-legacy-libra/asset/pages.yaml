    and by acknowledging the superior status of Dewi Sri, as well as the distinct
    status and rights of spirits, one alloys their pride while drawing them into safe
    relations of exchange. One proffers to gods and spirits, and more importantly,
    one proffers—just as one powerful humans—respect. In return, one gains their gifts,
    their berkah (“specifically blessings”), or at least their benign neglect. Sacrifice
    not only acknowledges differential status; it is a gesture of respect that should
    be at a minimum neutralize, if it cannot actually bind, its recipients.


    Asceticism in Java is a form of sacrifice in which, more paradoxically, one gives
    up oneself in order to gain personal rewards. At the simplest, practitioners of
    laku give up their comforts. More seriously, they give up the satisfaction of
    their basic needs. Ideally, they give up all intercourse with the world. People
    therefore demonstrate in laku their willingness to surrender comfort and pleasure,
    but with the understanding that comfort, prosperity, and good fortune, although
    deferred, will accrue to them in greater degree in the end. This represents a
    complicated form of sacrifice rather than possessions, but also because it implies
    a certain attitude toward other humans, as well as toward God. A person who enters
    the rice-storage area for three days—to take a somewhat extreme, but also actually
    practiced and much idealized example—gives up not only physical comfort but also
    all social identity. In deprivation of food, sleep, sex, speech, and community,
