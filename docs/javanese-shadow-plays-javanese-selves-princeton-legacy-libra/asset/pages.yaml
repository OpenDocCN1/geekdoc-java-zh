    In this thoroughly everyday pattern in Javanese interaction stands a summation
    of the contrasts between Western and Javanese attitudes toward interpretation.
    In the West, we think that language''s first responsibility is to be representational,
    that it should conform to the shape of the world. At the same time, however, in
    using language, Westerners seek to make their particular interpretation expressive
    of their particular, unique selves. Interpretation asserts their presence in the
    world, in the meeting of phenomena and self. By rendering the world—the past,
    other people, the environment—in accurate and expressive language, in making a
    “powerful analysis,” Westerners lay claim to superior perceptivity.


    Indirect quotation emphasizes meeting. The higher Westerner''s status, the more
    worthy of attention his or her interpretations become, and the more likely he
    or she is to use indirect quotation. The complex grammatical changes wrought in
    indirect quotation illustrate the distinction between direct and indirect discourse.
    They also tend to distinguish more and less educated speakers: those who can and
    those who cannot claim authority to make significant interpretations of phenomenon.
    To speak in indirect discourse maintains the integrity of, and draws attention
    to, the speaking self.


    Claims to analytic power and the use of indirect discourse may characterize intellectuals
    more than others in the West. But political leaders are also judged by their ability
