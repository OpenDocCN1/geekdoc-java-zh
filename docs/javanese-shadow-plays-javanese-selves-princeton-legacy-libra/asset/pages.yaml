    and investments. This demonstration makes people deserving, in turn, of authority
    may figure highly praised for an inclination to use refined speech with people
    to whom he need not be so polite. By Cerma often said that her husband used refined
    vocabulary even with children. This was course of untrue, since he had appeared
    silly had he done so, but the claim shows that, at the level of ideology, to use
    refined speech extensively demonstrates refinement, something that is almost always
    thought a virtue in Java.


    To basa well (use madya and/or krama vocabularies effortlessly) can indicate refinement—elegance,
    good breeding, social sensibility—as well deference, not just because it is somewhat
    esoteric, but also because one need not insist too strongly on one''s superior
    relative status, one shows a commitment to the Javanese ideal of smoothly flowing
    social relations. Still, this has its limits. No one need basa all the time, and
