    Cerna, in contrast, liked to comment on the fact that when she went to a neighbor''s
    house to ngréawang, people would shoo her out of the kitchen, telling her instead
    to greet arriving guests, a much more prestigious responsibility. But Lurah Karangan''s
    job at a wedding was to make sure the bride was properly dressed and made up,
    that the bridal procession was properly arranged, and that the bridal couple were
    seated in a photogenic manner on their dais.


    Status distinctions among males who participate in setting up for a ritual are
    less marked. All pitch in walls of plaited bamboo went moved about, or palm leaves
    need to be braided to decorate the scene. At the end of the setting up, which
    lasts a morning, all participants (at least one male from each household in the
    hamlet), older members of the young people''s organization oversee the serving
    of tea, snacks, and food to guests, but all join in this equally. Young men in
    their teens and early twenties actually do more work than anyone else, having
    to address and hand-delivery invitations, help set up, make decorations, serve
    guests, and, afterward, restore the house to its normal condition. They receive
    several meals from the sponsors in recognition of their service.


    The highest-status relatives and friends upon whom sponsors can call for service
    are asked to seat and receive visitors during the day or days prior to as well
    as during the ritual celebration itself. At a wedding or circumcision, a line
    of distinguished men, usually dressed in formal Javanese attire, each guest or
    couple as they approach the sponsors'' house, ushers a male guest to his seat,
    while a female guest proceeds to the inner part of the house, where she is seated
    by a female representative of the sponsors. The people who seat guests must know
    many people at sight, since where guests should sit depends on their status. Notices,
