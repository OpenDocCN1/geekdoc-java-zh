  md: '# 4. POTENCY, POSSESSION,

    AND SPEECH


    A powerful figure in Java suggests the possibility of protection, well-

    being, and prosperity. He thereby invites voluntary submission. In

    return for the style and, to some degree, the services indicative of def-

    er, an individual wins some assurance of the powerful person''s

    material and/or mystical support. However, ideological precepts and

    practical patterns of avoidance show distrust of the impulse to com-\promise one''s
    own sovereignty upon or submission to

    powerful figure. At the same time, such figures may resist people''s

    tempts to put claims upon them. I have discussed the nature and

    workings of such ambivalence in relations between fathers and other

    family members, and between lurah and villagers. Kebatinan, all the

    beliefs that concern potency and the imperceptible world, present

    avanese with alternative sources of assistance when special needs or

    arise, and these are the subject of this chapter. I will begin, how-

    ever, by discussing popular notions about territorial spirits (dhan-

    yang), since these epitomize the conflicting Javanese reactions

    power.


    # DHANYANG


    Contradictory feelings about concentration of power external

    to oneself became especially clear to me in the wildly dissimilar remarks about
    territorial spirits (dhanyang). These com-\ments were inconsistent from one person
    to the next, and even

    within a single person''s remarks. Whether every household and every

    topographical feature, such as a spring or a large rock, has a dhanyang

    was moot. People agreed that every contiguous cluster of hamlets

    hits its dhanyang, and probably each hamlet. The spirits that inhabit

    a large tree or thick cluster of bamboo, are sure to be inhabited

    because they are imposing and frightening, may or may not be

    deemed worthy of the title of dhanyang, but places of great impressiveness, such
    as a mountain, a large spring, or a palace, are assumed

    to harbor powerful dhanyang.


