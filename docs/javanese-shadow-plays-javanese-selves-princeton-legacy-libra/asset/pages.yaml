  md: '# JAVANESE SHADOW PLAYS,

    JAVANESE SELVES


    Ward Keeler


    "This is one of the finest works on Java since Clifford Geertz’s The Religion
    of Java. With very great skill and authority, the author creates the world in
    which all the complexities of the shadow play make sense.\n—A. L. Becker, Professor
    Emeritus, University of Michigan


    As with many performing arts in Asia, neither the highly stylized images of the
    Javanese shadow play nor its musical complexity detracts from its wide popularity.
    Why does an art that appears as obscure exercise such broad appeal? By a context-sensitive
    analysis of shadow-play performances, Ward Keeler shows that they fascinate so
    many people in Java because they dramatize consistent Javanese concerns about
    potency, status, and speech.


    "Accounts of non-Western art forms usually presume an problematic notion of the
    self, whether as performer or spectator," writes Professor Keeler. Going beyond
    such assumptions, he describes the ambiguous status of the puppeteer as he manipulates
    the puppets and takes their voices throughout the night-long performance. Thought
    both potent and suspect, the puppeteer plays on conflicting Javanese inclinations
    to idealize all figures of authority, on the one hand, and to mistrust them, on
    the other. Responses to his performance implicate relations in the family, village
    politics, and ritual.


    Ward Keeler is Assistant Professor of Anthropology at Barnard College.'
