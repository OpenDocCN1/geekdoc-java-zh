- pgno: 49
  md: 'mode of encounter in any particular instance. That is, they must establish
    their relative statuses in the course of every exchange. When the disparities
    in status are great, such as when a peasant addresses an aristocrat, or when they
    are less relevant, as when brothers speak to each other, relative statuses are
    not much open to question. However, when disparities in social status are less
    dramatic and therefore potentially arguable and relevant, as is true in Javanese
    interaction, then relative status is very much at issue. At such times, everyone
    attends carefully to the degrees of deference and familiarity people elicit and
    in interaction, because these affect their own and others'' perceptions of themselves.


    # Language and Relative Status


    People attend to relative status above all by attending to the manipulation of
    speech levels. These make virtually every utterance a comment on the relationship
    between speaker and interlocutor. Nothing says can be thought to have an essential
    meaning apart from how it is said, as is no doubt everywhere, this depends on
    where, when, and to whom it is said. It is true, furthermore, speakers of any
    language observe the same kinds of distinctions, such as formality and informality,
    circumspection and frankness, conventional and boldness, that distinguish Javanese
    speech levels. In Java linguistic and gestural styles have been intricately and
    subtly graded, so that the connotations of style are at times present in people''s
    minds. As a result, speech levels and their corresponding gestures take over where
    the vague categories of social structure leave off. They force speakers to make
    quite explicit their views of each other''s relative status.


    Basically, one can distinguish three speech levels in Javanese, defined by the
    use of several vocabulary sets. The speech levels are ngoko, madya, and krama.
    Ngoko is the first language level a child learns to speak. It is considered by
    Javanese to be simple, straightforward


    > * Soepo Poedojoardo gives a thorough account of the formal rules guiding the
    use of speech levels (Soepoemo 1968; see Soepoemo 1969). C. Geertz discusses speech
    levels from a more sociological perspective (C. Geertz 1962:248-60). Uhlenbeck
    1978 covers a broad range of linguistic and sociolinguistic issues in Javanese.
    J. Errington (1981) focuses on changing patterns in the use of speech levels,
    especially among the aristocracy. (J. Errington [1985] summarizes much of his
    earlier work in a more readily obtainable publication.) Examples of the uses to
    which levels are put can be found in Keeler 1984.'
