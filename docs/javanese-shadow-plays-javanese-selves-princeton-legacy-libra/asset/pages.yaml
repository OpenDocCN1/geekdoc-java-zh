    with inhabitants of the kalurahan about their dissatisfaction, I became aware
    of two quite different kinds of complaints: one concerned Pak Lurah''s honesty
    and talent in fulfilling the role of modern lurah; the other, more important one,
    concerned his failure to satisfy more traditional expectations of an important
    figure.


    Pak Lurah''s handling of the village finances was one area that caused much discontent.
    Pak Lurah was rich and getting richer by the day. There was virtually no public
    scrutiny of the village finances: at the annual village meeting a lot of figures
    about income and expenditures trotted out, and that was that. Although it was
    easy to see why people would grumble about probable corruption at the village
    office, public sentiment on the subject felt far short of outrage. It seemed scandal
    less that Pak Lurah should be growing rich in questionable ways than he failed
    to use wealth that they thought appropriate. Munificence is considered an essential
    trait in any person of authority or wealth in Java. People are quite willing to
    disregard the circumstances in which wealth is accumulated, provided that it continues
    to circulate. Much of the disaffection with Pak Lurah Karanganom stemmed from
    his refusal to redistribute his wealth.


    A lurah has at his disposal a system of patronage. He can manipulate it to maximize
    the number and kind of obligations people owe to him. He can use it in stricter
    financial dealings. Pak Lurah Karanganom opted for the latter. For example, in
    renting the village treasury lands each year, since the land-rent was paid in
    advance, Pak Lurah guaranteed that a certain sum of money entered the kalurahan
    coffers. He also guaranteed that only the richest people in the kalurahan were
    able to benefit from the use of those lands, because only the very wealthy residents
    had the capital to pay such a sum in advance. Had Pak Lurah been willing to sharecrop
    the land, something that he had promised to do during his campaign but that he
    later found too difficult to monitor and too disruptive to budgetary planning,
    he would have been able to bestow the favor of land use on whomever he pleased.
    Since there were, as elsewhere in Java, many'
