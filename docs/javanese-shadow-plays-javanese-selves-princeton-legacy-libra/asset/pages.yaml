- pgno: 290
  md: '# IO. CONCLUSION


    In contemporary anthropology, much is made of the ways in which meaning is constructed
    by a culture''s members. The interpretive act by which sense is asserted, such
    as in the interpretation of art or dreams or language, is a moment in which such
    constructions of meaning become particularly clear. It seems therefore a vital
    point at which to observe a culture''s workings. The meeting of individuals and
    events at which interpretation implies a reapplication of principles, occasionally
    a revision, rarely, in Java at least, a radical reconsideration of them. But in
    interpreting phenomena of whatever sort, people act upon fundamental understandings
    of their proper interaction with the world.


    I wish to suggest that interpretation is in itself a kind of interaction, one
    constrained by culturally given patterns and comparable therefore to other kinds
    of social behavior. It is for this reason that I have treated Javanese interpretation
    as susceptible to analysis in terms similar to those I have brought to Javanese
    social life and Javanese shadow plays. Since however, I have dared to construe
    the art form in ways at variance with traditional Javanese interpretations, I
    will conclude with a consideration of how interpreting a non-Western art form
    challenges some of our own hermeneutic assumptions. If we are going to analyze
    the ways others approach so we do. More specifically, in the present context we
    must ask whether the guidelines we formulate in interpreting texts still hold
    when we look at a non-Western art form. Are our interpretive principles applicable
    to texts that are not of our making?


    Clifford Geertz, the most famous proponent of an interpretive approach in anthropology,
    has discussed current interpretive modes in the social sciences, laying particular
    emphasis on the frequently invoked models of social life as performance and social
    life as text (C. Geertz 1983). Adherents of the dramaturgical model see in collective
    life publicly enacted performances (in the case of what Geertz calls the ritual
    theory approach) try to resolve conflict among'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 262 CHAPTER 10


    social actors, and/or (in what Geertz calls the symbolic action approach) convey
    specific meanings about the nature of the world. Geertz characterizes his own
    work on the ''theatre state'' in nineteenth-century Bali as a combination of the
    two, taking Balinese social life and expressive culture combined as a ''dramatized
    statement of a distinct form of political theory'' (1983:29), a statement that
    not only asserts the theory but also draws people into its enactment.


    Adherents of the textual model, Geertz continues, treat text and action as comparable
    in that both have meanings that persist beyond the moment of speaking or doing:
    both become ''inscribed.'' Summarizing Paul Ricoeur''s understanding of inscription
    as the fixation of meaning, Geertz states:


    When we speak, our utterances fly by as events any other behavior; unless what
    is inscribed in writing (or some other established recording process), it is evanescent
    as we do. If it is so inscribed, it of course passes...; but at least its meaning—the,
    not the saying—to a degree and for what remains. This too is not different for
    action in general: its meaning can persist in a way its actuality cannot. (C.
    Geertz 1983:31; cf. Ricoeur 1981)


    Geertz suggests in taking on the notion of text, we can make of our role as observers
    of social life something akin to that of translator, exegete, or inconographer,
    and he cites Becker''s work on wayang as an example worthy of emulation.


    Geertz''s succinct summary of these interpretive approaches helps to bring out
    the particular challenges and opportunities afforded by the study of a performing
    art. The value of such a study for cultural analysis stems from the fact that
    an art form provides us indigenousously generated representations of people''s
    lives while still constituting a part of those lives. Both observed and lived,
    and so both a representation of social life and an instance of it, a performance
    provides a commentary upon interaction and yet also exemplifies it. At the same
    time, analyzing a performing art should persuade us to examine any unwanted assumptions
    the use of some metaphors might foster. It can do so because a performing art
    overturns the distinctions between ''social life,'' ''performance,'' and ''text,''
    upon which such metaphors depend.


    To analyze a performing art as a form of interaction, and so a form'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# CONCLUSION 263


    or manifestation of social life, counters the more common practice of seeing social
    life as a kind of performance. When social life is likened to a performance, the
    latter tends to become a generic term, one actually possessed of relatively elementary
    power. Specifically, if we play on the notions of role, appearance, and scenario
    to analyze everyday life, we are liable to presume Western understandings of a
    self as self-conscious actor, choosing among scripts and affecting roles. When
    an actual performance is analyzed in the context of social life, its explanatory
    power can prove much greater. Unable to say that a performance is "like a performance,"
    we must ask what a performance in a particular place actually looks like. This
    should encourage us to consider how "selves" are represented; therefore, and what
    is thought important or interesting about them and their actions. It should, furthermore,
    encourage us to think about the medium in which the performance takes place. That
    medium implies a form of interaction—between performance and spectator—but an
    obviously constructed one, it suggests focal issues more generally. By putting
    aside the dramaturgical model in favor of drama itself, we give up universalizing
    statements about self and role and take up the challenge to analyze specific conceptions
    of self and interaction.


    If the dramaturgical model turns tautological when applied to actual performances,
    the textual model proves particularly interesting and problematic when applied
    to a performing art. Ricoeur, as Geertz has noted, sees texts as fixing the "said
    of speaking," thereby enabling the meanings of discourse to develop through time.
    Ricoeur compares this to the way that action, although fleeting, develops in the
    form of its consequences. A performance, however, is both text and action. As
    a result, Ricoeur''s distinction makes it possible to look for different kinds
    of meanings in performance, seen on one hand as text and on the other as action.
    At the same time, however, a performance points up some of the difficulties in
    using a textual model that makes action comparable to texts.


    If a dramatic presentation is based on a script to which actors give voice, then
    the audience receives a text, though in the form of speaking. This means the process
    of interpretation has already been initiated by the actors and director. Yet if
    drama in performance is a partially interpreted text, it is also a form of action,
    or really, of actions. There is the action taking place within the world of the
    play,'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 264 CHAPTER IO


    and there is the action of staging the play in the world outside it. Ask- about
    the consequences of these two kinds of actions, in an effort to establish their
    significance, means on the one hand attending to the effects that action in the
    play has upon its characters, and on the other, attending to the effects that
    staging the play has upon its players, sponsors, and audience. We should, moreover,
    consider the relations between the two. Debate the effects of violence in movies
    and television on the actions of spectators in the rest of life illustrates how
    problematic that issue can become.


    Yet when a performance proposes an interpretation of a text, by supplying appropriate
    gestures and tone, it emphasizes the status of speech and action as events, rather
    than in the forms by which they may be fixed. This suggests that interpreting
    such a performance should proceed not from a meditation on the text as fixed upon
    a page, but rather from the experience and/or memory of the performance, seen
    as an ephemeral event.


    The problem with Ricoeur''s account of action in general is that he exaggerates
    its fixity, in order to support his comparison of action with texts. We cannot
    recover an event with the degree of confidence with which we recover writing.
    As a result, we must modify the way we conceive of the meanings that inline in
    events, and ask whether our reliance on a textual medium is suitable to something—whether
    a performance or any kind of action—that is experienced very differently from
    reading, and is much less subject to retrieval.


    Of course, the notion of text is often expanded beyond Ricoeur''s relatively restricted
    usage of it, as for example in Becker''s wide-ranging usage of the term (1979),
    or, for that matter, Geertz''s (1973a). Yet as long as writing is taken as constitutive
    of texts, and by analogy, as long as we take the fixing or objectifying of action
    as constitutive of its meaning, we run the risk of separating meaning from event,
    and casting off the latter as an unwanted husk. Unlike a text, action is experienced
    only within specific contexts. In analyzing it, as a result, we must not lose
    sight of what J. B. Thompson, paraphrasing Ricoeur, calls the “doing” of action,
    in too-hot pursuit of “the significance of what is done” (J. B. Thompson 1981:15).


    A performance of wayang poses these problems particularly clearly. It is quite
    resistant to being made into a text. It is shaped by conven-'
  merge: -1
  img_proc: true
