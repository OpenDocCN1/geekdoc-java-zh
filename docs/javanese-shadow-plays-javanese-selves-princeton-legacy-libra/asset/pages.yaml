    All these relations between the three agents—spirit, victim, and wong tua—turn
    on changing relations to voices. Whereas spirits seek to acquire voices, a wong
    tua uses his voice to drive a spirit from its victim''s body, forcing the spirit
    into reasonable communication. This first step, which coerces the spirit into
    locating and naming itself, marks the critical shift between the spirit''s autonomy
    and its submission. Spirits use language, but in ways beyond human control, often
    beyond human understanding. The ravings of a person who is possessed the word
    is an impersonal passive form of a root meaning enter) must be transformed by
    a wong tua''s potency into interpretable speech. By specifying a particular wish,
