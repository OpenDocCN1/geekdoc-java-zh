  md: '# THE PLEASURES OF THE PERFORMANCE 209


    heroic, to defeat their opponents, and in their complete lack of fortitude, self-restraint,
    or resistance to their own emotions. Nothing could be further from the heroic
    ethic of the epics, or from the normative stress of Javanese culture on self-control
    and discipline, than the punawakans'' forth expression of gut feelings. Yet they
    enjoy, precisely because of their humble status, a freedom of action among all
    wayang figures. They escape social constraints not by concentrating potency, as
    characters do when they malih, but rather by abjuring all claims to status.


    The punakuan are all that not caught up in status and language. They can mock
    each other, argue, and have fight-fights. They can fight against their enemies,
    using trickery, farming tools, and even excrement. Often uses his great flatulence
    to lay an opponent low. They can sing and dance, beg for money, and express their
    fears. They can do all these things because they need not protect their status.
    The punakuan have no status. They are dependents.


    The punakuan are also exempt from time and history. They are servants to all the
    heroes from the Ramayana through the Mahabharata. The punakuan are virtually without
    genealogy. And very little happens to them. They are married, it true, but no
    one ever sees their wives or children. They have no social context aside from
    each other and their masters. They are both thoroughly constrained, because they
    are servants, and virtually without constraint, because they have no status to
    protect. Perhaps the clearest indication of their lack of status is that they,
    alone among the figures in wayang, can be made to use any words at all, from Indonesian,
    or even Dutch or English (fractured), whereas at all other times a dhalang must
    be careful to avoid obviously anachronistic and foreign usages.


    Representations of the punakuan evoke the casual, humorous interaction of Javanese
    youths, who need concern themselves with their dignity and obligations far less
    than their elders. Such scenes, however, do not simply reflect a stage in a Javanese
    male''s social career. The complete dependence of the punakuan on their masters
    means that they enjoy a security Javanese society does not afford commoners today.
    They are as of the satisfaction of their basic needs, and unfettered by responsibilities
    to their own status, as the servant at the court who has "forgotten" his family.
    So they represent'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'an ideal, even though ideal is located not at the apex but rather at the base
    of social hierarchy. Ideal is perhaps best summarized by saying that they, in
    their complete dependence, be mindful of nothing except their loyalty to their
    masters. Aside from that, and the respect they must show their superiors, they
    need to be careful about very little else.


    Of low status, deformed, and dependent, the punakuan might seem to be perfect
    representatives of what Victor Turner calls generality—anti-heroic, anti-structural,
    the domain of those criticize and reject the distinctions on which a society''s
    power structure is based (Turner 1969). Unlike the role of marginal figures in
    many cultures, the punakuan are neither satirical nor critical. They are non-structural,
    in that they wield no official power, but they are not anti-structural. They do
    not affirm pan-human or pan-social values in conflict with heroic ideals and strictures.
    They simply present a contrast with them, an alternative rendering that does not
    put the normatively dominant one into question. The punakuan “know their place.”
    They speak respectfully to their masters (although some joke hinge on forgetting
    themselves and responding too casually to a superior’s remark). Among them, they
    engage in a relaxed, un-conscious, and spontaneous mode of interaction that Javanese
    society only occasionally permits an adult, particularly an adult male. The price
    the punakuan pays is their autonomy, in that they are servants, but what they
    gain is freedom from responsibility. Such that position of subordination and ease
    must be attractive to many Javanese, who show fondness for the four figures, does
    not mean that Javanese need see in the punakuan a critique of social reality.
    Rather, this idealized version of low status rounds out the base, as asceticism
    and alihan round the top, of wayang''s social hierarchy.


    While wayang suggests, therefore, two types of release from the binding considerations
    of a person''s own status in interaction, one in a superior concentration of potency,
    the other in a complete disclaimer of status, neither alternative, I must stress,
    in any way subverts the values of the system. The punakuan, once again, do not
    satirize the ethic that they appear to flout. They are outside its constraints
    inasmuch as their status is minimal. But they are not against the system.


    If alihan and the punakuan suggest opposite extremes, never'
