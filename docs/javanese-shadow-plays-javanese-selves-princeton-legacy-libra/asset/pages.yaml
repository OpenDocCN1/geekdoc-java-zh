    To experience desire is to feel a lack, to sense one''s own insuffi-ci, to become
    aware of absence. To enter into relations of ex-change in the world, to take part
    in any form of intercourse, whether commercial, sexual or verbal, is to admit
    desire, need, and de-pendiente. Then one lets oneself defined in terms of absences
    must try to fill. Ascetic rigors overcome and deny desire. They imply resistance
    to lack, and in this way they suggest plenitude.


    Asceticism, that is, posits a homology between desire overcome and desire fulfilled.
    In either case, the object of desire becomes uninvested, with the result that
    the gap between desire and object falls away. It is that gap, I believe, that
    is powerful and disturbing to the Javanese. Overcoming it, in whatever manner,
    releases one from its hold. In ascetic exercises, or simply ascetic attitudes,
    as the farmer''s remarks show, desire is denied. Desire fulfilled is then substituted
    for desire mastered. By a kind of commutative principle, this substitution achieves
    the purpose that has ostensibly fallen away—and one reaps at least a part of one''s
