    is a kind of swooning sensation, with which the subject is completely lost in
    its object, the appeal of which is so overwhelming that everything else sinks
    into nothingness and oblivion. All intellectual activity ceases; the perception
    of the object itself becomes vague, and in an experience of oneness that blurs
    the distinction between subject and object, consciousness of the self vanishes,
