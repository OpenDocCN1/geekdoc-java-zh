    A performance of wayang, as I have said, does not posit a theme, develop it, bring
    it to a climax, and then resolve it; as A. L. Becker has noted (1979), Aristotelian
    conventions are irrelevant to wayang. A series of gong periods in a gendheng,
    or a number of gendheng played in a series, a performance presents a repeating
    progression of sections that are distinguished by shifting degrees of focus. Spectators
    are not expected to pay rapt attention. Instead, they are drawn into the story
    at some times, while at others they pay little or no attention. For the most part,
    the regular structure of the performance provides a static framework, fragmenting
    the lakon into a collection of what are thematically loosely joined parts. The
    result emphasizes the incidents of music, jokes, gestures and dialogue, which
    may have little intrinsic connection to the particular lakon. It is to these surfaces
    that spectators attend, without committing themselves, or being expected to commit
    themselves, to anything more.


    The art form also suggests the possibility of a spectator''s pleasant disfocus,
    I must stress, is only one aspect of the enjoyment to be had in a performance
    of wayang. The popular taste for battles, jokes, and lightweight gendheng emphasizes
    the opposite tendency: to insist on simple contrasts and accessible language.
    So does the moral absolutism of commentary on wayang, as will be taken up in the
    next chapter. Nevertheless, a certain *chiaroscuro* is intrinsic to the experience
    of wayang, and I believe it is an important aspect of its allure and of the resistance
    it evokes. In fact, clarity, focus, and the presentation of obvious oppositions,
    though extolled in exegetical remarks about wayang, do not necessarily win praise
    in performance. The pleasure in a loss of orientation and focus pertains to wayang
    just as it does to gamelan.


