    Outbreaks of conflict must be avoided because they would indicate the father''s
    lack of potency. The powerful presence of any figure of authority would be such
    as to prevent disturbance within his domain. Since conflict of any sort would
    inevitably incur his wrath, everyone else should fear expressing hostility openly.
    Pitched battle, particularly if he engaged the father, would radically undermine
    his authority by demonstrating his inability to keep family members under the
    constraints of respect. Any occasion that caused the father to raise his voice
    in anger might well show that his speech was not effective (ora mandi), that it
    was not sufficient to maintain perfect order. Such an event would undercut the
    impression of his potency greatly.


    Tension and conflict arise, of course, in a Javanese household. The father''s
    authority is insulated from the family, at least partially, however, by the nature
    of the mother''s role. The mother takes responsibility for those areas, finances
    and chores, most likely to give rise to conflicts with children as they grow older.


