  md: 'surface, which is where tradition and variation deflects attention away from
    any particular text or meaning in an individual text. There is an assimilation
    of text and tradition that tends to undercut the supremacy and uniqueness of the
    author and particular text alike.


    A dhalang stands in a similar relation to the corpus of the wayang tradition (ngelu
    padhalangan) as a Javanese reader to a text. His text is the story (lakon) as
    he performs. It leaves him free to improvise dialogue, perform routines, and perhaps
    to rearrange the order of scenes. Were he to follow a written text slavishly (a
    few published texts of performances provide complete dialogues, not just outlines),
    he would be dismissed contemptuously as a neophyte and a dhalang with notes (dhalang
    cathetan), a phrase that implies all the mastery of a person who paints by number.
    He must be able to make his performance distinctive in its cengkok: the particular
    variations he makes in dialogue and in his manipulation of the puppets, and the
    minor shifts he introduces in the presentation of the lakon. Yet all of these
    are constrained by the tradition as a whole, which defines the characters, motivations,
    and situations, as well as the musical and structural limits within which he works.


    # THE DHALANG’S SKILLS


    Both general expectations of a dhalang and certain more technical constraints
    set up conflicting demands, as I have said, that a dhalang be both conservative
    and flexible, impervious to influence and yet sensitive to his audience’s wishes,
    “original” in performance and yet “respectful” of the tradition. Pressured to
    perform inventively and entertainingly, he must nonetheless do in such a way that
    he will leave no mark upon the tradition he transmits. The result makes him an
    active agent of the tradition, yet one who is, in theory at least, wholly transparent
    to it. In his relations to the constraints of tradition, in fact, as well as in
    the circumstances of the performance as a whole, the dhalang demonstrates especially
    vividly the paradox of effective but dissulated authority.


    The specific points on which a dhalang’s performance is judged can be reduced
    to four essentials: his dexterity and style in manipulating puppets, his musicianship
    and the beauty of his singing voice, his'
