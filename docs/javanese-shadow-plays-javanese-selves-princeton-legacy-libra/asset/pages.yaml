  md: '# LANGUAGE, POWER, AND ASCETICISM 27


    are free to try to better their social status through stratagems as amassing wealth
    and/or amassing diplomas. New wealth does not necessarily win everyone''s respect,
    at least not right away, but it does raise one''s status in the long run. The
    father of the village headman in Karangan, where I lived, was said to be illiterate,
    but had made a fortune in the tobacco business. His wealth and prestige, won through
    his dealings with the Mangkunajaran court in Sala, and accounted in part for his
    success in procuring for one of his sons the position of village headman.


    Titles obtained through membership in military or other bureaucracies have immediate
    implications for people''s social status, winning them, for example, greater authority
    in community affairs. People who obtain university degrees can also bank on greater
    prominence, and they append the symbol of those degrees to their names. One of
    Jogja''s contemporary dhalang is Ki Barno B. A., and one of the city''s most famous
    folk drama starlets appends “Master in Law” to her name.


    Social status shows not simply in people''s titles. The amount of land they own,
    the size and design of their houses, their clothes, and their ability to place
    relatives in good jobs—all these affect affect reflect people''s wealth, clout,
    and social status. But precisely because these factors are fluid, social status
    is always a bit vague.


    The issue of class in Java is much vexed. Clifford Geertz points out that disparities
    in the size of landholdings among rural Javanese are not great enough to speak
    of an exploitative and an exploited class (C. Geertz 1963, 1984). His critics
    insist that disparities may appear small from the outside are not perceived as
    such within a Javanese village, and that recent evidence points to a widening
    gap between rich and poor, putting the latter increasingly at the mercy of the
    former. (For an overview of this debate, see White 1983a). For the present purposes,
    determining whether class analysis applies to Java matters less than simply noting
    that disparities in social status do exist, and that they impinge on face-to-face
    encounter as they do on people''s access to wealth, resources, and political office.


    Formal social categories, however, as indicators of social status, present an
    only generally differentiated assortment of individuals, who must then go about
    the finer business of settling upon the proper'
