    Javanese do not, however, gloss control of refined speech sociologically. Instead,
    they see in one''s ability to use refined speech well an indication of one''s
    sensitivity to social requirements and, too, an indication of one''s self-control.
    In order to use refined speech well, it is said that people must know how to avoid
    extreme sentiments as as crude words. They show themselves sensitive to the deference
