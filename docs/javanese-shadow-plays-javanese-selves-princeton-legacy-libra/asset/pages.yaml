  md: '# 20 INTRODUCTION


    close to the surface in every encounter. Speech and writing, furthermore, are
    thought by Javanese to channel potency even on their own, and Javanese thinking
    about the nature of an individual''s relations with discourse—as master of or
    subject to its power—illuminates much about Javanese conceptions of the self and
    potency.


    Wayang is a remarkably talk art form. It is believed to, at least ideally, considerable
    reserves of potency, and it establishes relationships among performers, sponsors,
    and spectators of unusual but also telling stories. The initial four chapters
    of this book are intended to explicate four Javanese understandings of the self,
    power, and language as they inform interaction, in order then, in the remaining
    chapters, to situate the phenomenon of wayang in an intelligible, if at times
    distinctly unfamiliar, context.


    If an art form can be analyzed as a set of relationships, it may still be deemed
    less important, and so less needful of other aspects of a particular culture.
    The arts may be thought to play an only marginal role in a society, to stand somewhat
    offset in the struggle for wealth, status, and power. This provides just the reason
    for their interest. Whether or not constitute a critical commentary on the world
    in which they are played—it is my contention that wayang, at least, has no such
    intrinsically critical function—these art forms present a distillation of cultural
    assumptions, an intensification of those investments that underlie all variety
    of action. Release from such mundane constraints as gravity and time permits the
    characters in a drama to devote their full attention to the more compelling issues
    of, say, honor or potency. An analyst must then try to see how the concerns that
    seem to motivate plot, manner of performance, and its reception resonate with
    other aspects of the culture in which the performance takes place.


    In looking for areas of a culture in which those concerns appear, a researcher
    can take advantage of similarly "eccentric" phenomena. Reactions to and commentary
    upon irregularities in the run of events often reveal assumptions about the way
    things are, assumptions that "normal" patterns rarely reveal. Procedures and comments
    provoked by the birth of twins, to take an example common in the ethnographic
    literature, may point up assumptions about the nature of individual identity,
    conceptions that are not revealed, because they are not challenged, when humans
    are born singly. I have taken this ap-'
