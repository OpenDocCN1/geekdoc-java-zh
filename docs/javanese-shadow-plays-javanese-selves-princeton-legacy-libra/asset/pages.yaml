    A howlingly funny routine, its effectiveness depended on the listener''s instantaneous
    recognition of each voice as one brother interrupted another. This was possible
    because the voices of the punakawan, especially, are as readily identified by
    the Javanese as the voices of their closest kin. People will reclaim about a dhalang''s
    rendering of a character''s voice, “That''s exactly Bagong''s voice!” Bagong and
    his voice being as real and familiar to them as the child they nickname affectionately
    after him.


