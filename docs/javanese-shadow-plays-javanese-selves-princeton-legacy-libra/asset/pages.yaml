    When people speak, dhalang speak at particularly great length, of the exemplary
    function of wayang, they justify the claim with reference to precisely these clear
    contrasts. The most commonly espoused view of wayang''s effect upon its audience
    describes it as an inducement to righteous behavior. First of all, the dhalang
    makes certain characters properly elevating remarks on the virtues of filial piety,
    the need to speak with proper refinement, the importance of doing ascetic rigors,
    etc. In addition to these clearly didactic statements, a performance is also believed
    to transmit beneficial moral influence through its examples of good and evil actions
    and the fruits they reap. To most commentators, this obvious moral instruction
    is the real essence of wayang''s worth, the cause of its ceaseless appeal, and
    the indisputable justification for the whole tradition. nuances in emotions and
    moral issues are sacrificed in such a reading of wayang, and exeges reduces the
    meanings of lakon to a few moral sentiae.


    Javanese description of what wayang means usually focuses on one or two lakon,
    Dewi Ruci above, occasionally Kresna duta. These seem to me fit certain philosophical
    prejudices of both Javanese and Western analysts (or apolog), but the conventional
    commentary does not constitute an exegetical approach applicable to other lakon.
    Actually, rather than deal with stories at all, most commentary concerns the pathikan.
    It is conventional and universally accepted wisdom among educated wayang enthusiasts
    that a performance of wayang represents the life of a single person. The first
