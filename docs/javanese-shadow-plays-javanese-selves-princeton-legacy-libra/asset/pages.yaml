  md: '# POTENCY, POSSESSION, AND SPEECH 139


    However, emphasis falls not on the informational value of such words, but rather
    on the way that words link this ceremony to other ceremonies, while distinguishing
    it from everyday interaction. as language shifts away from normal usage—whether
    unintelligibility or conventional stylization, or perhaps both at once—its referential
    function diminishes its effectiveness grows.


    I believe the potency of opaque language in its suggestion of reserved reference,
    of meaning held in readiness rather than released in intelligibility. Then effectiveness
    replaces intelligibility. Like potency itself, language that is formulaic but
    obscure can be registered only in its effects. One cannot understand rapal. It
    is telling that the nearest Javanese equivalent to the English verb, “to grasp,”
    nykel (“to hold” or “to grasp”), can be used in reference to rapal—not in the
    sense of understanding them, but rather in the impersonal passive (kekel), meaning
    “to have committed to memory,” and implying that one is ready to try them out.
    One cannot understand rapal, but one can use it and see if it works. The promise
    of meaning, that is, effectiveness, is then dispersed in mere sense, but like
    potency, unleashed.


    It would clearly be false to claim that Javanese is oblivious to the effectiveness
    of direct reference. To address anyone an intimate without using a title before
    their name, to refer directly to any part of their body (especially the head),
    or to use a word from the crude (kasat) vocabulary set—each of these forms of
    directness is a serious social breach. Overt reference channels power just as
    non-referential rapal can be in a prophylactic against being bothered by spirits
    when walking by a big, dark tree or other ominous spot at night. Although people
    must avoid naming what they fear (such as a wild beast or spirit) lest they attract
    its attention, they should joke with their companions and say things like, “Hey,
    that root just like So-and-so’s cunt!” The crude language generates heat and will
    scare any spirit off. Here, it is the explicit reference that transmits power.


    Nor rapal and other forms of speech that are effective (mandi) necessarily unintelligible.
    A truly powerful person speaks in terse, clear phrases that effect themselves.
    One older dhalang stated that to use rapal indicated inferior potency. It is a
    stage one must surpass, as one’s own speech grows more efficient. Yet here, again,
    the relationship between sound and sense is special. Speech that mandi'
