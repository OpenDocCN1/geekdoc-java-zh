  img_proc: true
- pgno: 210
  md: '# DHALANG, TROUPE, AND TRADITION 181


    A successful dhalang has a fairly stable group of players who accompany him whenever
    he performs. A less active one knows where to find musicians to call upon when
    needed. These usually include brothers, uncles, cousins, and/or nephews. Traditionally,
    a dhalang''s musicians were members of his immediate family, both male and female,
    and his wife played the gender. (One reason a dhalang''s son was pressured to
    marry a dhalang''s daughter rather than a peasant''s was in order to avoid having
    to hire a gender player.) More recently, though, the ponderous Victorianism the
    Javanese think has led people to fix mixed sexes among musicians inappropriate.
    The lamentable results are the elimination of all female players from village
    performances of wayang, and the proliferation of gamelan groups for bourgeois
    ladies, “ibu-ibu,” in town. (I say lamentable because village women do not deserve
    to see yet another traditional source of income, however minor, closed to, while
    city ladies do not the astonishing amounts of radio time given over their embarrassing
    attempts to pick up simple tunes on the most basic instruments of the gamelan.)
    In any case, a wayang usually requires at least seven or eight musicians, and
    a very fancy performance would draw on the talents of twenty or more.


    The dhalang''s control of his troupe is at once total and covert. The musicians
    must be responsive to a variety of subtle cues the dhalang gives them. The name
    and rhythm of raps gives with a wooden mallet (cempala) at the outset indicate
    which certain long musical compositions (gendhing) will accompany the opening
    scene. At other points in the performance, the musicians must discern in some
    phrase the dhalang utters reference to the title of a gendhing he wishes to play.
    These allusions are sometimes obvious, at other times quite subtle, though most
    are fairly conventional.² Other signals, of which are the heavy metal plates (keprak)
    that he bangs with the mallet held between his toes, still others by singing a
    particular note, induce the musicians to play sections of certain set pieces (e.g.,
    battle music), or to stop playing, on very short notice. The drummer must pay


    one of each octave. The two stringed instruments, the rebab and the clempung,
    in contrast, since they can be returned easily, need not be duplicated.


    > ² For a thorough account of these allusions, plus a list of many of them, see
    Heinz 1970.'
