    meaning like a hand grenade, and quickly tossing it someplace else. By the more
    direct action of ripping the lizard''s jaw, the sign is neutralized by its immediate
    fulfillment. The opposite of reserved reference, this case of forced referentiality
    dramatizes the ominous nature of unrealized signification. Here, by putting a
    stop to the progress of reference, signification is controlled. Such at least
    is a person''s hope. Eerily, it was a morning barely weeks later when the youths''
    older brother Sarna passed a truck on his motorbike, crashed head on with a bus,
    and was killed. Everyone in the family then surmised that this event was what
    the falling cecak foreshadowed.


    # INTERPRETATION AND THE DISSEMBLED SELF


    The extent to which signs can be judged truthful in Java depends, as I have said,
    on their removal from any obvious, personal self, that'
