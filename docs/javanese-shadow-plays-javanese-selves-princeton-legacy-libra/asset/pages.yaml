    The range of behavior characteristic of Javanese lurah is certainly not exhausted
    by the three headmen I have discussed. There exists in particular a very different
    kind of authority figure: the abrupt


    By stressing that understanding of power that sees it evidenced in the untruffled
    harmony and prosperity of a village''s inhabitants, rather than as demonstrated
    in the activity and directives of its leaders, villagers try to balance off wants:
    to isolate themselves from political pressure while gaining by the power—spiritual,
    financial, or whatever—that political authority implies. They try to make political
    authority a potent center, rather than a coercive agency.


    It is not that villagers want idle lurah. They want signs of development as new
    schools, electricity, and improved irrigation. They do not feel bold about agitating
    for any particular project, but they hope that their lurah will arrange to have
    such projects implemented on their behalf. They believe that he has access to
