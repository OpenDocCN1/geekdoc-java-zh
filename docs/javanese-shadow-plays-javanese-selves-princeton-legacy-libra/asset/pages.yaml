    cial life and aesthetics develop out of deeply held assumptions about the world,
    and that neither one be seen as cause or effect of the other. The responsibility
    of the analyst is to discern what underlying assumptions might be, and how they
    shape both social life and aesthetic activity.


    Paul Ricoeur states, "One of the aims of all hermeneutics is to struggle against
    cultural distance" (Ricoeur 1981:159), and clearly the cultural distance between
    Java and the West—the gap between their assumptions and ours—is great. A. L. Becker
    addresses this point when he prefaces his subtle and valuable discussion of Javanese
    wayang with some general remarks about how to "recreate a conceptually distant
    context." He distinguishes four types of relations that must be examined when
    dealing with parts of the text; those with other, prior texts; those among author,
    text, and hearers and readers; and those between the text and non-literary events
    (Becker 1979). In this list Becker has set much of the program I have tried to
    follow.


    My approach begins with analysis of the more palpable relationships in Javanese
    life, and proceeds to the more elusive domains of aesthetics and epistemology.
    After discussing Javanese understandings of the self (Chapter 1), I consider relationships
    as they can be observed in daily life: interaction with the family (Chapter 2),
    in villages (Chapter 3), and among those people deemed spiritually powerful and
    their suppliers (Chapter 4). I then examine relationships as they are occasioned
    by a performance: the interaction that takes place among sponsors, performers,
    guests, and other spectators (Chapters 5, 6, and 7). Finally, I discuss relationships
    as they are defined more abstractly: the interaction, taken now in a broad sense,
    among individuals, aesthetic illusions, and knowledge (Chapters 8 and 9).


    The figure at the center of all these stages in the analysis is the dhalang. He
    is foreshadowed in the fathers, village headmen, potent and/or prescient figures,
    and ritual sponsors are the foci of Chapters 2 through 5. He takes his place at
    the center of a performance of wayang, and of my discussion, in Chapters 6 and
    7. His power and effectiveness, thought at once enticing and suspect, and the
    varying responses they elicit, point to the ambiguous status of art and knowledge,
    as discussed in the concluding Chapters 8 and 9.


