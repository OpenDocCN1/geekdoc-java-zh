    A related device, one that I will illustrate below, draws on conventional gender
    roles. As described in the preceding chapter, Javanese often contrast men and
    women in terms of their differing relations with potency and money. Ideally, men
    concern themselves with potency and dignity; women concern themselves with the
    more obvious and less prestigious matters of money and children. Villagers follow
    this conventional distinction when they represent a headman as potent and magnanimous
    as compared with his rapacious wife. In their eagerness to stress this contrast,
    as well as to blame the headman''s henchman rather than him for heavy-handedness,
    villagers appear inclined to idealize their leaders. They can maintain trust in
    the essential benevolence of a headman even when they excoriate his wife and subordinates.


    Yet if villagers wish to see in their lurah a powerful center, capable of assuring
    harmony and prosperity in the village, they also find ways to restore their power.
    They multiply the numbers of powerful people with whom they enter into relations,
    thereby reducing the degree of dependence they have upon any one of them. Just
    as important as the felt need for a powerful center, there by impulse to diminish
    the authority of any single center, thereby protecting oneself from in infringements
    upon one''s status and sovereignty.


    A fundamental tension, therefore, colors all political relations in a Javanese
    village. Villagers draw on the idea that a figure of authority should be, to use
    Clifford Geertz''s phrase, an "exemplary center" (C. Geertz 1980), not a coercive
    agent, in order to insulate themselves from direct or material processes. At times,
    those in positions of authority also draw on this understanding of potency to
    shield themselves from the demands and conflicts of political action. Yet, as
    I have said, Javanese villagers also show a real desire to find in their headman
    a figure of authority upon whom they can depend. It is this effort to rely on
    a headman''s authority, in many ways, and to resist it in others, that gives Javanese
    village politics their particular tone, and in some cases puts just everybody
    at cross-poses.


    These ambiguities in village political relations are highlighted by the national
    regime''s current efforts to modify village life through agricultural development
    projects, increased schooling, changes in political procedures, etc. Headmen are
    often caught between the bureaucracy''s expansive demands and villagers'' wants.
    In addition,'
  merge: -1
  img_proc: true
