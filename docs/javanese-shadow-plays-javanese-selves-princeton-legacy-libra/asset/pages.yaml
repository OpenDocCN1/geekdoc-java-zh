    interaction: the constraints of etiquette, status, and style. Note, however, that
    these constraints are never contradicted, despite all the dissemble of identity.
    On the contrary, they are exploited. It is precisely because a priest (pandhita)
    deserves great respect that Bathara Guru can take advantage of the situation in
    Ngastina pretending to be such a priest in order to fulfill his own names. Wayang
    does not undercut the binding authority of etiquette, it only imagines a kind
    of escape from an individual''s particular place in the social hierarchy.^5 Malih
    constitutes a logical extreme of the impulse underelling asceticism. In “life,”
    that is, in understandings of daily life, people achieve the power of a wang tuwa
    through ascetic rigors. They may thereby attain titles and high office, or may
    gain great capacity as cutters or advisors, for example. In any case, I have argued
    in Chapter 1, it is through their withdrawal from interaction and speech that
    they manage to gather potency and increase their status. To malih exaggerates
    the pattern to the point of a total dissimulation of identity. The result assures
    a character’s invulnerability, even if only provisional, to others’ behavior.


    The convention of alihan suggests that potency can be used in such a way to play
    the rules of status and etiquette to one’s advantage. People whose concentration
    of potency is sufficient can escape social definition while availing themselves
    of etiquette''s control over others’ actions. There is another kind of escape
    as well: in subservience. The punakawan who serve the Pandawa, their ancestors,
    and their descendants in wayang by their immediate accessibility.^6 It is difficult
    to find any parallel in the West for these heroes, who are as well-loved and intimately
    known as brothers to Javanese.(Buster Keaton’s or the Marx Brothers’ consistent
    personae, sustained in all of their films, probably resemble the punakawan most
    closely.) They first appear at about one in the morning, and their arrival always
    signals an interlude of jokes, light popular gendheng, and dancing. In the rest
    of the performance, they contrast with their high-status masters in the directness
    of their speech, in their practical concern with food and money, and in their
    willingness to use any means, matter how un


