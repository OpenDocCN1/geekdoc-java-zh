  md: '# 6. THE STATUS OF DHALANG AND RITUAL SPONSORS


    When sponsors invite a dhalang and his troupe to perform at a ritual celebration,
    the guests'' attention is further distracted away from the sponsors. The performance
    once again dissembles and enhances the sponsors'' aura of authority, as the sponsors
    seek to make the dhalang''s voice an extension of their own. In particular, they
    hope his voice will win the guests'' voluntary, yet total, submission. Relations
    between the wayang and the dhalang who performs it, however, are complicated.
    Is their authority shared, or are they locked in competition? The status of dhalang
    in Javanese society has long mooted, and the problem reflects ambiguity about
    the status of a dhalang, relative particularly to his sponsors. Surprisingly,
    estimations of his status vary according to the status of the informant. Above
    all, it is because the nature of a dhalang''s authority is so equivocal that such
    estimations of his status vary from something quite exalted to something close
    to that of the much-scorned musician.


    At the same time, the dhalang himself plays on contrasts between his total control
    and the dissimulation of his voice and person in his performance. The constraints
    he must observe and the criteria by which he is judged press to exert his authority
    by disassembling himself, and in this way, the dhalang repeats the pattern of
    exerting power while disulating his authority. The diverse and even contradictory
    images of authority I have discussed in the previous chapters coalesce, in fact,
    in the particularly ambiguous and imposing figure of the dhalang.


    # THE DHALANG''S STATUS


    Dhalang were often likened in the past to birds on the wing because of the way
    they moved about the countryside following the harvest. Annual village cleaning
    (bersih desa) rituals have traditionally been thought necessary to assure the
    safety and prosperity of every village. Often a village''s territorial spirit
    (dhanyang) is said to de-


