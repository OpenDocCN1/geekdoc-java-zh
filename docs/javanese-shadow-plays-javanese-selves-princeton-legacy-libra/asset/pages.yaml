  md: In Java, therefore, interpretation does not begin with an opening onto experience.
    It is not the abandonment of positions such as we claim to attempt on the forefront
    of knowledge, a move that would seem to Javanese a reckless surrender of control.
    It is instead meticulous processing of information in ways that keep it subject
    to the interpreter’s grasp. This permits interpreters to resist experience—to
    show fortitude in the face of any setback, and to be “not amazed” in the face
    of any phenomena—and so able to maintain their own power, dignity, and identity
    in the world.
