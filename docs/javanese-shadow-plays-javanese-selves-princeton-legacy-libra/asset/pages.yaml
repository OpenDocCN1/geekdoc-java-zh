  md: '# ON JAVANESE INTERPRETATION 247


    More critical to Javanese than the historical veracity of wayang stories is their
    integrity: the way in which each important story links to others in the entire
    corpus. When I asked informants the difference between sejarah and cerita, many
    spoke of the former as genealogy (sarasilah), and the latter as elaboration or
    embellishment (kemembangan). Kembangan vary, but genealogies must remain unaltered.
    The distinction underlies that between principal and secondary lakon (lakon pokok
    and lakon carangan), but principal lakon already represent elaborations upon the
    basic genealogies. The point is that principal lakon must be internally consistent,
    their several strands contributing to the progression of the whole epic cycle.
    They must follow in order (urut). This is inviability, and the impression of an
    inevitable progression, I believe, that give the classical lakon pokok their power.
    Each enters into a cycle that moves like an unstoppable chain of associations
    until the end of the Bratayuda.


    The power of this chain is great. That principal lakon are all of a piece was
    demonstrated whenever a dhalang began to tell me one of them. Once he started,
    he stopped. There is no point of resolution in these stories: each event leads
    to another, and to another, the end of the whole cycle is reached. It is as though
    there in the mythical cycle a drive to be played out exhausted. (I became reluctant
    to ask about any Bratayuda lakon because I knew it would mean listening to everything
    that happens in the war after that point.) It is perhaps reductive reasoning on
    my part, the unvarying structure of the performance (the patokhan) seems to me
    one way of breaking the chain, of imposing a beginning and, more importantly,
    an end within this long and implacable series.


    Newer lakon, in contrast, are isolated units. The preference for new lakon that
    in no way advance the epic cycle represents a means of escape from the entangling
    stories of the whole corpus. Ignoring the issue of the historicity of the tradition
    further removes it from a person''s geographical and historical environment. And
    if the power and prestige of principal lakon depend on their irreversible drive
    toward a conclusion, wayang exegesis seems to consist in draining such energy
    from the tradition, in favor of its own speedy conclusion. The reduction of all
    lakon to a stereotypical account of individual development makes exegesis not
    an investigation but an imposition, of an invariant and so largely insignificant
    “meaning.”'
