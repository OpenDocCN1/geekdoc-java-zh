- pgno: 202
  md: '# DHALANG RITUAL SPONSORS 173


    understandings, as well as estimations of his status, generally color the relations
    between sponsor and dhalang. Sponsors choose a dhalang according to two principal
    sorts of criteria, those that are lair and that are batin. One of the former is
    cost. To hold any performance increases expenditures considerably, because in
    addition to the cash payment, sponsors must provide all members of the troupe
    least one, more often two, preferably three meals. As mentioned in the Introduction,
    the sponsors can take responsibility for renting a gamelan, finding players and
    singers, and renting the necessary equipment for a performance if they like. They
    keep costs lower in this way, though everyone agrees that a performance goes more
    smoothly and the dhalang is happy if the sponsors entrust all these arrangements
    to him. The dhalang, who very likely owns a gamelan, puppets, screen, and lamp,
    and has a troupe of musicians who perform with him often, can charge a much higher
    fee, more than offsetting the wages he gives his troupe. The greater expense entailed
    in inviting a dhalang to bring his own troupe reflects well on the resources and
    munificence of the sponsors.


    During my fieldwork in 1978-1979, when a kilo of rice cost between Rp. 100 and
    Rp. 130, and a laborer received between Rp. 350 and Rp. 500 per day, a young and
    inexperienced dhalang might receive five to ten rupiah for a performance. A dhalang
    of moderate reputation might receive anywhere from fifteen to twenty thousand
    rupiah for his services alone for a night''s performance, thirty to a hundred
    thousand rupiah if he was asked to bring his own troupe and to perform during
    the day as well as at night. It is my impression that the number of sponsors who
    wish to hold a day-time performance in addition to one night is diminishing, except
    when a ruawatan performance is held. This rural defense against Bathara Kala necessarily
    takes place during the day.


    Java''s most famous dhalang can command fees ranging from Rp. 150,000 to Rp. 500,000,
    while Ki Nartosho, the most popular also the most controversial dhalang in Java,
    was rumored to charge as much as Rp. 800,000 for one performance. No one is ever
    charged admission to a performance sponsored privately. An admission charge would
    contravene impressions of the sponsors'' munificence. The spectacular expense
    of engaging a famous dhalang of course figures prominently in the prestige it
    brings sponsors. Including such a famous name on the printed invitations assures
    a large crowd of guests, and, since the news will sweep through the country-'
