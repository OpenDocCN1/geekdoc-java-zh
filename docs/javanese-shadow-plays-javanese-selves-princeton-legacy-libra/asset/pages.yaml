    The critical ritual gesture at a slametan (ngluwari kaul) of untying a kupat luwar.
    Kupat are rice cakes made by cooking rice wrapped in braided coconut leaves. A
    kupat luwar is a young coconut leaf tied into a knot that when two people pull
    it at either end and pull, the knot comes undone. The knot is called tali bali
    (tali, “knot,” “tie”; bali, “to return”), and the untying signals a return to
    the condition prior to the making of the vow, that is, to be without bonds. My
    informants’ immediate and unanimous impulse to speak of making vows or of fulfilling
    them suggested a certain anxiety about vows, one that release from them, or in
    this case, talking about such release, could alone manage. (I will use the words
    “fulfill” and “fulfillment” to refer not to attaining the goal sought but to carrying
    out, or fulfilling, obligation one had taken on.) I believe that anxiety depends
