    war. They pit Pandawa against Kurawa, therefore plus other ephemeral characters
    “from across the sea,” rather than depict the ancestors of the warring cousins.
    The great prestige of principal lakon (lakon pokok) depends on the fact that they
    urut-urut: they follow one after an inevitable series. So-called “old” lakon which
    recount events prior to the cousins'' birth, present events great and small that
