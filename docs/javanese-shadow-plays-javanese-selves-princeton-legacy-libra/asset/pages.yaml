    This conception of wayang as distraction helps account for a widely-held belief
    among Javanese that wayang was first developed by the Muslim proselytizers (wali)
    who spread Islam in Java. Although accounts vary in specifics, the story runs
    that the newly-Hindu or Buddhist or animist wayang were drawn to newly-built mosques
    by the sound of gamelan being played inside. Once gathered outside a mosque, people
    were granted entry to the mosque on the condition that they repeat a few syllables.
    These were the Muslim confession of faith, and the naive populace, by repeating,
    unwittingly converted to Islam. Wayang performances were then held in order to
    teach the precepts of the new religion. Although it is often granted that wayang
    bébé (illustrated scroll painted figures resemble wayang) existed before the advent
    of Islam, the origin of shadow puppets themselves is attributed to the Muslims.
    Some people add that the puppets are very highly stylized in deference to Muslim
    strictures against the human body. In some versions, wayang''s origin is not explained
    in this way, but its elaboration and perfection are nevertheless attributed to
    the Muslim wali.


    These accounts usually place no negative judgment upon such a manner of converting
    Java to Islam. If anything, people seem to admire the wiliness of the proselytizers,
    who knew how to play upon the Javanese taste for gamelan and performances to attain
