    When people explain why polygyny is a bad idea, they invariably cite tension over
    the division of the man''s income. Sexual and emotional jealousy between co-wives
    seem to strike Javanese as real secondary problems. Tensions between female in-laws,
    too, usually take the form of conflicting claims to the man''s property. If he
    wishes to give his kinsmen money, a man must often resort to subterfuge. Mbak
    Tuti, recently widowed, mentioned that if she visited her brother, a civil servant,
    soon after he had gotten his salary, he would slip her some money, but he would
    tell his wife that a “compulsory contribution” had been taken out of his pay at
    the office.


    That control of finances implies the possession of considerable power by no means
    escapes Javanese. How to square the husband''s putatively supreme authority (kuwasa)
    with the wife''s role in money gives some to interesting comment about Javanese.
    One jagongan (a gathering of men held following some ritual ceremony), several
    men answered my questions about why women take charge of the family''s finances.
    Their responses were phrased in terms of women''s relative weakness. A man can''t
    be bothered worrying about ten rupiah. He''ll think to himself, “Easy to go out
    and make some more.” A woman doesn''t have that option. She can''t just go out
    and earn money. Instead, she''ll think to herself, “With ten rupiah I only have
    to buy salt and chills.” So she’s more careful. And if a man is overcharged at
    a place to eat, if they tell him to pay Rp. 250 when he should only have it, he
    just pays it. He''d be ashamed to make a scene. But a woman would put up a fight.


