    obstructing the government''s pursuit of its own purposes. When he quoted telling
    the men, in low Javanese, that they were right to come to him, and that they now
    must be calm as submitted to the wisdom and authority of the government, he spoke
    in tones similar to those of a father speaking to his children.


    The lurah acts as a paternal figure once again when he exercises authority over
    beings who do not stand outside the limits of the kalurahan but rather outside
    those of the visible world. It is precisely because spirits are at such a remove
    that the lurah''s power over them is highly valued. His authority is wielded not
