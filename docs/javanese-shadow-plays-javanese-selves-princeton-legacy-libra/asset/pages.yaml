    ask of a dalang whether he has any particular wants. Unlike the musicians, no
    dhalang should eat during a performance. To do so would compromise his prestige
    considerably. A dhalang drinks and eats at least a little rice before and after
    performing. Sponsors try to learn whether the dalang has any favorite foods or
