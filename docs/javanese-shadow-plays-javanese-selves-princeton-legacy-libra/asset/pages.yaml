  md: '# 9. ON JAVANESE INTERPRETATION


    People''s relations with signs in Java, the degree to which they are master of
    or subject to, at once indicate and determine their potency. This assumption about
    the relationship between self and signs has important consequences for Javanese
    epistemology. Exegesis of away exemplifies these consequences, and I will take
    it as a starting point for a more general discussion of Javanese interpretation.
    My point is that, like speech, the signs that are an art form, a tract of ngèlmu,
    or a dream, all pose a challenge to a person''s autonomy, a challenge to which
    modes of interpretation are the defensive reaction. In interpreting these signs,
    a person seeks to control them, mastering and using—rather than falling subject
    to—their significance.


    # EXEGESIS AND THE STATUS OF WAYANG STORIES


    Indigenous commentary on wayang fits into the politics of meaning in Java because
    its reductiveness constitutes another defense against a performance''s impact:
    it indicates resistance to the performance in yet another reality. At many points
    in the epic cycle, error, oversight, and passion cause characters to become caught
    in ethically subtle and problematic situations. Even the central dispute over
    the kingdom of Ngastina is by no means clearly-cut, since each of the two camps
    can make justifiable claims to the throne. Yet contemporary Javanese commentary
    sees the Kurawa as unequivocally evil, given over to their envy, lust for power
    and coarseness, and the Pandhawa as good, models of fairness, potency, and patience.
    Their struggle is therefore the eternal one between good and evil. In stances
    in which “good” characters clearly diverge from the straight and narrow do little
    to shake this simplistic reduction of all events to clear-cut opposites. When,
    for example, in the Bratayuda, the wily and powerful Kresna tricks Arjuna into
    interceding, unfaily, in the struggle between Setyaki and Burisrawa, Kresna''s
    strat-


