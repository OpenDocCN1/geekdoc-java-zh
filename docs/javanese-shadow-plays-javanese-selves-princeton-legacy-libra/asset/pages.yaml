  md: '# HINDU JAVANESE


    TENGGER TRADITION AND ISLAM


    Robert W. Hefner


    "An ethnographically rich and historically detailed portrait of the last Hindu
    enclave in Muslim Java, Hefner''s work is also a compelling account of the symbolic
    processes involved in religious conversion. . . . A brilliant study certain to
    appeal to readers concerned with poststructuralist theory as well as to specialists
    in Asian Studies, Hinduism, and الإسلام."—Choice


    "This book is an exemplary model of sophisticated use of sociological and semiotic
    theory in the analysis of complex historical and ethnographic materials,"—Hildred
    Geertz, Princeton University


    "Hindu Javanese . . . lays the foundation for a major reinterpretation of religion
    and society in Java. . . . This book suggests new approaches to the study of world
    religious traditions. It is anthropology at its best, in which theoretical advances
    are made through an intensive ethnographic and social historical narrative."—Dale
    F. Eickelman, New York University


    ISBN 0-691-09413-6. 300 pages. 13 illus. 1985.'
