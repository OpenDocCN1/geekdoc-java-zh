    the sponsors seek to put in service to their own purposes. They hope it will assure
    both the safety and entertainment of all people present at the ritual celebration
    itself, and also their own prestige and long-term prosperity. Yet just as the
    sponsors withdraw from the act of speaking even as they rely on the medium of
    speech to attain their ends, so, too, does the dhalang disassemble the fact that
    he is the source of all the voices he takes on. Sponsors and dhalang alike engage
    in the assertion of authority through the dissimulation of speech, and beyond
    speech, of action and even presence. They make of themselves, that is, further
