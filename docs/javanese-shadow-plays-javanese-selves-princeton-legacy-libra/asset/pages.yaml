    I believe Pak Lurah had a calculated risk. By linking his position directly to
    the governmental hierarchy, he had taken a particularly modernist position. A
    more traditional response would have been to keep the affair as local as possible.
    But Pak Lurah meant to stress that he was a link in the great chain of the entire
    bureaucracy, not just the highest authority in the village. He wished to show
    that behind his authority stood authority, quite some villagers, of the supra-village
    government. His tactic failed because the hierarchy failed to exert the authority
    upon which he had relied to strengthen his position.


    In the villagers'' view, however, Pak Lurah had compromised impressions of his
    potency in several respects. If he were truly powerful, no one would have dared
    to come threatening in the village in the first place. Once apprehended, Pak Tomo
    should have felt constrained by Pak Lurah''s authority to marry Yu Paimin, or
    at the very least, to abide by the deal Pak Lurah had made with him. Finally,
    by sending Pak Tomo out of the village for punishment, Pak Lurah had in effect
    himself himself unable to impose authority upon Pak Tomo, and had brought shame
    down on the village in bargain.


    The incident epitomized contradictions in Pak Lurah''s position. He stood caught
    between a modernist image of a lurah, who he filled with erratic dedication, and
    more traditional expectations of him. By modernist meant not only "modernizing,"
