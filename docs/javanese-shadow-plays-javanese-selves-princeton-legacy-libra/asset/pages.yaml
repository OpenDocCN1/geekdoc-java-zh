    # THE DHALANG AND THE TRADITION


    Three general criteria applied when evaluating a dhalang are his

    genealogy, his training, and his sensitivity to his audiences'' tastes. A

    dhalang should be able, in the opinion of many, to trace his geneal-\ogy back
    through several generations of dhalang, and I was struck

    the ability of some dhalang to recount their genealogies back several

    gations further than other commoners. Only dhalang in such

    long lines of descent are to be in possession of a great store of

    esoteric knowledge (ngelmu padhalangan) necessary to make their per-

    formance truly effective. However, belief in the need for a long ge-

    ealogy is certainly declining. The Javanese conviction that gene-

    dinguishes people in important ways, while still strong,

    netnever lacks any ideological support today, supplanted by the

    stress on ascetic endeavors. Several of Java''s most famousem-

    porary dhalang have little or no genealogical connection to the major

    dhalang lines of Central Java.


    Schooling distinguishes dhalang in a way similar to genealogy.

    Public schools, and more importantly the schools for dhalang at royal

    courts in Jogja and Solo, give dhalang a level of general learning

    th important to their performance. The dhalang schools in

    Solo especially are considered the ideal places in which to study the

    classical Kawi vocabulary necessary for performance, and to learn

    precise links among all the different wayang characters. Furthermore,

    these schools have permitted something of a canon to be established,

    particularly in Solo, about the "correct" versions of many aspects of

    performance, such as the long lines (suluk) the dhalang sings, the

    stories (lakon) he relates, and the ghending of the orchestra plays. (The

    prestige of Abirando, the palace school for dhalang in Jogja, has

    never equaled that of the older Radya Pustaka school, and now the

    national Akademi Seni Karawitan Indonesia, in Solo. As a result, Jogja'
