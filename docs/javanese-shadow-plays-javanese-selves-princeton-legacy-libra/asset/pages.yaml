    in, really, the need to believe in the dhal''s ability to grant such mystical
    assistance has grown. Precisely because a dhal''s power is not linked to overt
    political control, dhalang have been able to maintain and foster the image of
    an authority apart. They are ready to intercede on behalf of those in need of
    their services, but they cannot be held accountable for the vagaries of mundane
    affairs.


    Dalang indeed like to emphasize one and all that they stand as something of a
    breed apart. At ritual gatherings, they do both by keeping to themselves and by
    flouting some conventional rules of etiquette. Pak Ceram mentioned that when he
