  md: 'consistent understandings of power motivate peasant as courtly traditions.
    Whether at court or in a village, it is because ritual celebrations are conceived
    as an expression of potency, rather than simply of worldly accomplishment, they
    are more persuasive evidence of status than the mere possession of bureaucratic
    position or material wealth. It is possible, therefore, to see in ritual celebrations
    and the system of exchange relations they establish not the last remains in a
    society otherwise gone flabby, but rather the real crux of Javanese society insofar
    as it is an organizational structure—even though that ritual structure organizes
    little beyond itself.


    # THE SPONSORS'' VOICE


    There is one point about the sponsors'' role that requires closer attention because
    it illuminates their relations both with their guests and, if they sponsor a wayang,
    the dhalang: their silence. Whether they hold large-scale ritual celebrations
    or a simple slametan, the sponsors never take over charge of the proceedings.
    They are replaced by at least one other person, usually by several others. The
    result at once diminishes the sponsors'' apparent manipulation of the scene and
    augments the impression of their potency.


    At the slametan, which forms the ritual crux of any observance (though, as C.
    Geertz points out in [1960:14], it may be overshadowed in the bustle of a large
    celebration), the sponsors always entrust a male of at least rudimentary religious
    training with the tasks of greeting the guests, announcing the ritual purpose,
    dedicating the offerings, and leading the prayers. This training may consist only
    in an ability to chant, not understand, Arabic, or if he is Buddhist, Pali, prayers.
    Even if he knows the necessary prayers himself, the male sponsor must ask someone
    else to accomplish these tasks. (I will refer in the present discussion to the
    male sponsor alone, since it is he who appears in the front room of the house,
    while the female sponsor remains in the kitchen area,


    > * Clifford Geertz describes the sponsors of a slametan taking a more active
    role (C. Geertz 1960:12-15). I note, however, that another still stood in chanting,
    and he was given the nominal payment, wajib, that I discuss below. It also strikes
    me, after too many years in Central Java, as typical of the East Javanese, among
    whom Geertz did his research and whom Javanese in the Principalities consider
    little refined, that they should be so less discreet in their mediation of the
    relations between sponsors and guests.'
