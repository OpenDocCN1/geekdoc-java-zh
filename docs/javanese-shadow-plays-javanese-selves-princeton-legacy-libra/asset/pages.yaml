    performatives (Austin 1962). The important difference is the Western priest, for
    example, who causes a couple to be man and wife, can do so by virtue of his position
    in a particular hierarchy. In the Javanese view, it is not one''s relation to
    that grants one''s words effectiveness, the extent to which they are subject to
    one''s own control, that matters. One''s prestige and status then follows as a
    matter of course.


    The affinities between potency and language in Java stem from the fact that both
    exist in the world: neither is conceived as in any original with itself. No one
    more creates language than one creates potency. One seeks only to tap into each,
    or really, both at once, in order to shift one''s relationship with them from
    vulnerability to resistance, and ultimately, to some degree of control. The potent
    self is an agent able to join the two together and realize them in the world.
    Language courses through people: one wants potency to do the same. Neither language
    nor potency finds a source in a person; individuals can only aspire to become
    conduits to them. People who cannot do this, however, must turn to other figures,
    whose potency consists in their relations with language, or turn to language itself,
    in a vow. And in submission to such forms of external authority as a dhukun or
    spirits or, as I will take up shortly, a dhalang, a person tries to gain some
    measure of control, or at least leverage,


    Ideas about self, potency, interpersonal relations, and speech, the subject of
