    # The Potent Self


    The potent self in Java is not really what Westerners mean by “self” at all. The
    loss of identity in ngebleng means escaping from definitions ascribed to a person
    in interaction. Following that escape, a person returns to the world, now possessed
    of greater potency. This is manifest in two principal ways: a person is without
    selfish interests (pamri of any sort), and his speech is effective. That is, he
    is less vulnerable to his own impulses, while he is more capable of defining,
    or imposing upon, other people.


    Pamri implies the investments that keep a person subject to desire, and it is
    only through its suppression that a person becomes potent. To suppress one''s
    wants, and to suppress (in the extreme forms of laku) one''s identity, means that
    one is no longer vulnerable to dependent, defined by—what is external to oneself
    in the world. In resistance to what is external stands the assurance of both one''s
    power over others and the satisfaction of one''s wants. The Javanese ideal of
    “selfhood,” a power that surpasses the vulnerability of the individual in a superior
    reserve of kakuatan batin. It is a self thought to have surpassed, as well as
    demonstrated in, language use, it is unsurpassed all constraints of identity,
    and thereby to become strong.


    Since encounter is a negotiation of relative status effected through, language
    use, that an ultimate goal of ascetic rigor, and the goal people often mentioned,
    is to make one''s speech take effect (mandi), as venom and medicine can take effect.
    This means that the instant one says something, it is/becomes true. God''s word,
    of course, is effective beyond all others. But the speech of any extremely powerful
    person is said to be mandi as well. The Sultan of Jogia is believed to be able
    to make a person go mad simply by saying “You''re mad.” People whose speech mandi
    are are said to “borrow the authority of God.”


    Speech that takes effect (mandi) reiterates on the plane of language the closing
    of the gap between desire and its fulfillment. Powerful speech is no longer simply
    referential but effective. The disjunction between speech and event is overcome.
    This puts people in'
