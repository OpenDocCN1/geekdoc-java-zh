  md: '# 8. THE PLEASURES OF THE PERFORMANCE


    Javanese accounts of submission to a king exaggerate the notion of his beneficent
    berkah to the point of seeing it a deeply satisfying influence. It is still threatening,
    however, in fact all the more so, and both the pleasure and the threat can be
    described as a kind of forgetfulness. Pak Cerma related that his father, Mbah
    Mardi, was offered the opportunity to become a dhalang at the court (abdi-dalam
    dhalang) at the Susuhan in Solo.


    The pay was poor, but it''s easy for a servant of the court [abdi-dalem] to make
    money on the side because of the prestige of his position. Anyway, Javanese say
    that working in the king''s service makes one ayem tentrem; contented because
    of the benevolent influence [berkah] and sawab [similar to berkah] of the king.
    While a man stays at court, his family may be in bad straits. Maybe they have
    no money to make contributions to other people''s ritual celebrations—and here
    the man''s contented [tentrem] at court, completely unaware of their hardship.
    It''s like the guys [arrested in the late ''60s] who are still in prison. No longer
    have to worry about getting killed, since there are laws against that now. And
    they know nothing of any difficulties their families may be going through. So
    they''re very comfortable.


    In accepting a role at court, a man enjoys the security and serenity assured by
    the king''s powerful aura. This induces a pleasant but irresponsible forgetfulness:
    the man forgets that others are dependent upon him. Meanwhile, his wife is out
    trying to maintain the family''s position in ritual exchange relations. The association
    Pak Cerma made between servants of the court and prisoners is particularly telling
    that in their similarity is seen to lie not in their common submission to authority,
    but in the comfort and forgetfulness that submission wins them. In each case,
    in place of the authoritative role he plays in the family, a man enjoys a passive,
    protected contentment, trusting in a superior authority''s care.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# THE PLEASURES OF THE PERFORMANCE 203


    This account of a pleasurable but seductive forgetfulness illuminates, as I will
    try to show, how much Javanese reactions to wayang in performance: what it is
    people savor, and what it is they fear. Comments about wayang''s value stress
    the normative, didactic function of the art form, but reactions to performance
    indicate a more enticing, yet potentially disorienting, effectiveness. The unresolved
    nature of these reactions gives rise to the simultaneous resistance to and fascination
    with wayang that Javanese envie, reactions that call to mind the seductive appeal
    of service at the royal court that Pak Cer described.


    # WAYANG AND MEANING


    Before broaching the topic of how wayang pleases, or tempts, I must consider the
    topic of what wayang means. The content of performance of wayang is obviously
    not conceived of a representation of life. Though the vagaries of its plots and
    the motivations of many of its characters be familiar, it does not attempt, as
    most Western drama has attempted, to mirror and comment upon a reality outside
    itself. No doubt realism in Western drama is as much a convention as any other
    style. Yet wayang''s disregard for realism, in contrast to the West''s embrace
    of it, marks a critical difference between the two traditions.


    If drama in the West is ideally to focus on a particular problem or set of problems,
    and to make its own form and content conform to the nature of some message, wayang
    engages in a much more fluid and analytically less focused relationship with the
    “real” world. It is a commentary on that insofar Javanese concerns—with kinds
    of power, roles, and styles—motivate much of its content. But it exaggerates,
    distorts, or even contradicts ideology without ever confronting those inconsistencies.
    Issues tend to arise and disperse in the course of a performance, often resolved
    only temporarily, or by some fortuitous shift in the plot. Fortuity is not insign,
    as A. L. Becker has made clear. Coincidence, he has a power in Java that it lacks
    in Western aesthetics and thought (A. L. Becker 1979). Although coincidence may
    suggest imperceptible forces operative in the world, however, it does not suggest
    any resolution of the conflicts that inevitably arise within an inconsistent,
    though normatively binding, ideology. Wayang'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'does not prosper solutions to such problems. If conflicts between, say, loyalty
    to one''s kin and the pursuit of kakuwatan batin in asceticism arise in the course
    of some lakon, such conflicts never become central problems around which a performance
    is organized. When, for example, a relative of the Pandawa disappears mysteriously,
    as Wrekudara in Senawang, and it turns out on his return that he was attaining
    great powers through asceticism, his new powers enable him to defeat the enemy
    that has put his relatives in jeopardy. The crisis is resolved, but not the intrinsic
    tension between kinship solidarity, which is much stressed in Java, and responsibilities
    to one''s batin, which are also found compelling.


    Actually, whatever issue motivated the first part of a performance—usually the
    topic under discussion in the long opening scene—is often left unresolved or obscured
    later in the performance, receiving only cursory attention again before the performance
    ends. What was critical from nine to midnight would be unimportant by three, when
    a whole new series of events is initiated. It is inflexible, but content often
    constitutes a running series of events, rather than a cumulative one.


    Instead of searching for a core of meaning in a particular lakon, therefore, or
    in a particular rendering of it performance, I think it more fruitful to examine
    certain repeating patterns in plot and character, and, too, in the reception of
    performances. I take this approach to seek unique or specific messages in a single
    performance of wayang, as we demand great drama in the West, imposes demands upon
    it that are at best irrelevant, at worst fundamentally misleading. A few classical
    lakon (e.g., lakon about the origin of rice and the Murwakala lakon used in the
    ruwatan ritual) seem to me susceptible of closer analysis because they originate
    in Javanese myths. An analysis is not to the point here, however. Particular turns
    in plot must be considered, not in terms of a single lakon, but rather in the
    repertoire of conventions that crop up in wayang repeatedly. I will first discuss
    a few such conventions for the ways in which they reflect critical concerns of
    Javanese culture on which I have already commented: the self and status, encounter,
    and power. In these areas, wayang suggests alternatives to the way things are
    in life, as it is experienced and/or as it is conceived. But it does not


    > ¹ I have suggested some readings of these lakon elsewhere (Keeler 1983).'
