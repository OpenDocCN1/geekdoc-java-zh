    This account of Javanese encounter will remind many readers of Erving Goffman''s
    work on face-to-face encounter (e.g., Goffman 1967). Javanese social life does
    indeed look like an intricately elaborated form of interaction ritual, in which
    all participants are concerned with how others comport themselves, how they themselves
    appear, and how their interaction redounds on the definition of one and all. But
    there are two respects in which a social interactionist approach must be supplemented.
    One, as I have noted in the preceding account, is to see that basic distinctions
    stand prior to inform any particular encounter. Interaction does not start with
    neutral players. When strangers begin speaking on a bus, for example, about dress
    and manner will already have provided signals to each speaker about the other''s
    status, and constrain the negotiation of relative status that ensues. A second
    factor that informs Javanese understandings of this negotiation consists of diffusely
    articulated but firmly held beliefs about potency. This domain of mystical forces
    at play in the world, kebatinan, is used as an idiom in which to assert the existence
    of an individual that does indeed exist apart from social status and encounter.


    # ENCOUNTER AND POTENCY


    Encounter demonstrates people''s status and in that demonstration, further defines
    them. In the Javanese view, however, the vagaries of encounter follow upon the
    distribution of spiritual strength or energy, what Benedict Anderson has called
    “the Javanese idea of power” (Anderson 1972b). Anderson writes:


    > Power is intangible, mysterious, and divine energy which animates the universe.
    In Javanese traditional thinking there is no sharp division between organic and
    inorganic matter, for everything is sustained by the same invisible power. (Anderson
    1972b:7)


    In order to contrast this understanding of power with modern Western understandings,
    Anderson adopts the convention of capitalizing the word “power” when alluding
