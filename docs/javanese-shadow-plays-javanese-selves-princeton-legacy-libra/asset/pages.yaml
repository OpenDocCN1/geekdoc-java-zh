  md: 'This distribution of responsibilities between author (usually anonymous) and
    reader means that the distinction between them is obscured. The Javanese tradition
    of tembang makes an author conform to highly formalized meters. In fact, Javanese
    literary genres are extremely conventionalized, so that language and manner of
    narration as well as meter are limited to a particular, quite restricted range.
    The author must conform to this tradition closely in composing a “new” text. A
    reader must then conform to that finished text. The reader adds so much to the
    text, and that addition is a essential part of the transmission of the text, that
    the reader in a sense participates in creating the text—more so, or at least obviously,
    I would claim, than silent readers of a Western text do in their reading. A Javanese
    text, that is, is never more than half-finished as long as it remains in its written
    form. Only as realized in a sung and embellished version does the text become
    fulfilled, and there are definite limits on how far the text can control the reader’s
    reading.


    However, each completion of the text is also purely ephemeral: the reader completes
    the text without any way affecting it the moment of reading. The text, on the
    one hand, exerts only partial control over the reader. The reader, on the other,
    for all authority or she enjoys over the text’s realization, leaves no trace.


    Author and reader are therefore co-participants in the text’s generation, while
    both are subject to strict, given form. The relative importance of author and
    reader in any particular reading depends on whether a highly embellished “concert”
    version of a tembang or a simpler reading takes place, the latter laying more
    emphasis on the sense of the words. The considerable constraints exerts upon both
    author and reader, however, means that any text and any performance represent
    variations within an all-embracing and deeply conservative tradition. These constraints
    stress both the authority of the tradition as a whole, in its permanent emergencies,
    and the transient plane of vocal line and embodiment at


    As a result, many young Indonesians, including the younger members of the elite,
    not only lose touch with the sources of tradition, they also lack appreciation
    for the “literary” side—flowery, often recherché, but also at times finally elegant
    and graceful—of the languages of the traditional performing arts. They are perhaps
    awaiting, if they are not trying their hands at creating, an Indonesian literature.
    But it seems possible that they have simply moved out of a rich, conservative,
    oral tradition into a much impoverished visual one, typified by the old American
    programs broadcast on Indonesian television.'
