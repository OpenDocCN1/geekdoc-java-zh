    sponsors or context. “If he made a joke and heard people laugh, he didn''t make
    another joke all night,” one dhalang told me approvingly. A dhalang, this received
    doctrine has, never turns his head during performance. For a dhalang to make jokes
    at the expense of anyone present is also called “to look aside, to turn one''s
    head” (nylèwèng), a verb that implies wandering from the path of righteousness
    (and in other contexts means “commit adultery”). However, despite all this praise
    for Ki Poedosoemarto''s unimpeachably correct manner of performance, I was told—when
    it eventually occurred to me to ask—that there were never spectators left past
    mid-night when he performed. What dhalang and many older Javanese praise in a
    performance is not necessarily what they actually like to see. Their praise describes
