    That authority, indeed, exert a powerful influence over people was brought to
    me the morning the terrible news came that Pak Cerma''s oldest son had just been
    killed in a motorcycle accident. In the anguish and weeping that filled the house,
    neighbors kept assuring the family that Pak Lurah was on his way, and his arrival
    with a wife few minutes later had a noticeably calming effect. Pak Lurah could
    “take responsibility.” This means of course that he would take care of arrangements
    with the morgue, the police, etc. But aside from such practical concerns, his
    presence as an important person, an authority, albeit young, a paternal figure,
    was reassuring. Even his much-resent wife could be seen to bring some comfort
    to the grieving women by her mere presence.


    The capacity and willingness to take responsibility is that distinguishing characteristic
    of the truly powerful. Most Javanese are frequently at pains to dis responsibility
    for anything they do or simply outside the purview of their control or experience,
    they are likely to dissociate themselves from it, saying, “That''s just what I''ve
    heard. I don''t know if it''s true or not.” Appointments rarely definite; work
    is never guaranteed. And one reason so little authority ever delegated in a Javanese
    office is that few subordinates want to wield authority. Whenever authorization
    for something is needed, the better part of bureaucratic valor is to add documents
    to the pile awaiting the attention of the office head—and to tell the supplicant
    to come again some other time. In this way, people forgo claims to power of their
    own. They also avoid the risk of being accountable for any consequences their
    words or actions might have.


    In contrast, those rare individuals willing to answer for their own words, to
    recognize their responsibilities to their kin and subordinates, and even to acknowledge
    their liability for those people''s actions—such individuals are clearly in possession
    of unusual resources, both material and spiritual. To act coolly and effectively
    in the face of trauma also shows that a person can take responsibility, as Pak
    Lurah did at the time of the Ceram'' bereavement.


    But to take responsibility should also imply that a person is ready to use his
    authority—and resources—for the benefit of the powerless.'
