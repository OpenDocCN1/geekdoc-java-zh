    A woman is not uninterested in status and power. She watches carefully for kinds
    of deference or presumption on the part of her neighbors and guests. Particularly
    when at home, as I have said, she attend much less carefully than her husband
    to her own dignity. To put the distinction somewhat boldly, the mother operates
    in terms of a more material understanding of power: who holds the purse and who''s
    willing to yell. The result not only keeps her in firm control of the family finances,
    it also keeps her husband''s authority insulated from the petty strains of family
    life.¹10


    It is differences children observe between their father''s and mother-authority,
    and the kinds of behavior that each of them insists upon, tolerates, or rejects,
    that teach children not just what it means to be a man or a woman in Javanese
    society, but also what it means to be mindful of one''s own and others'' status.
    First, in learning that they must fear/respect their father, and must demonstrate
    attitude in their speech, whereas with their mother they can maintain a much more
    casual tone, children first recognize the distinction between kin and non-kin.
    Javanese would reject out of hand the gesture that the father becomes to a degree
    assimilated to the category of non-kin by this distancing. After all, the definition
    of "other people" (wong liya) is that they are not bound to one by kinship ties.
    Yet the connectedness children come to adopt toward their father already sets
    the pattern for their responses to non-kin, particularly to those of high status.


