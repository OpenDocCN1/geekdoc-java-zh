    lable—obtainable—through one''s relations with language. But a vow is a form of
    language that reinstates its maker''s submission to authority. In making a vow,
    people throw themselves back into a position of dependence, in which they hope
    to see immediate satisfaction, yet out of which they eventually to free themselves.
    Granted, the figure of authority in vows is vague, and the obligation is precisely
    limited. No one would willingly—though one fears may unwittingly—put oneself into
    a bondage that admits of no release. Yet the phrase “you must fear/respect your
