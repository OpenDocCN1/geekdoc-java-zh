    The contrast I am drawing between Java and the West is, of course, more conventional
    than real. Westerners impose models upon experience arbitrarily (cf. neo-evolutionary
    anthropology), and Javanese constantly observe, analyze, and act upon their experience.
    Each of these aspects of interpretation is essential to cognition and action.
    By the two traditions, Javanese and Western, differ in em-phasis.


    In Java, only people who have successfully rid themselves of per-onal or idiosyncratic
    traits are thought capable of passing accurate judgment on events. A wong kuwa
    can discern meaning in the world because he no longer suffers the distortion of
    perception implicit in self-interest. His effectiveness in the world, and the
    impact he can have on events, are believed to depend on a similar loss of personal
    investment, and this matters rather than his interpretive skill alone. If this
    view overlaps with Western notions about objectivity, it nevertheless differs
    importantly in that it suggests not an original or penetrating analyst, but rather
    a venerable and anonymous conduit of potency. A wong kuwa who looks at a young
    person taking his leave to go to town and says, “Better not go today. Wait until
    an other day,” has noticed something that alerts him to danger or obst- aclar
    in the young person’s path. This is, certainly, an interpretive act. The wong
    kuwa is capable of it, however, because in his loss of pamri and the resultant
    increase in the power of his batin he has become sensitive to the play of mystical
    forces in the world. But his batin is powerful because it is not constrained by
