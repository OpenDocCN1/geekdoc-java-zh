  md: '# 246 CHAPTER 9


    Javanese is by means hard and fast, but several informants spoke of sejarah as
    "what happened," and crita as "what people say." Whether or not wayang recount
    the history of Java is actually moot for Javanese. Many Javanese associate features
    of the landscape with stories and characters in wayang. The cave with the monkey
    brothers, Sugriwa and Subali, suddenly became enemies is located by some north
    of the village of Wates; the village of Dwarawati near Jatim is identified by
    some with Kres''s claim of that name; and several different sites are the mountain
    on which Arjuna meditated. However, many people are skeptical of these identifications,
    particularly people who have heard, as many Javanese have heard, that the stories
    come originally from India. What is remarkable is how little difference the issue
    of stories'' historical veracity seems to make. Connections between the present
    and new world, the art form, and the past, matter little to Javanese appreciation
    of wayang.


    One reason many people speak vaguely about the historicity of stories stems from
    a habitual reluctance to pass judgment on the truthfulness of any statement. One
    in Karanganow said that sejarah and crita are the same, since they consist only
    in "things people say" (omongan wong). His tone implied that there was no use
    trying to decide what was true and wasn''t about them. Javanese often repeat another
    person''s remarks, traditional wisdom, and add, "That is just what they say. I
    don''t know myself." The comment disclaims the speaker''s commitment and responsibility
    for what he has said. It is one more manifestation of the reluctance to take responsibility
    (tanggung jawab). One Jogja dhalang answered my questions about the status of
    wayang stories by saying, "All lakon are crita: you can believe what you like.
    I don''t take responsibility for them."


    Such difficulty in pronouncing anything, including "history," true stems from
    the fact that to do so people must surpass the limits of their own perception.
    Javanese are not necessarily skeptical, but they see no reason to commit themselves
    to statements to which they feel no personal link. One doesn''t say another person''s
    stories aren''t true; one simply doesn''t say, just as one avoids lending money
    or getting involved in any situation in which trust must be extended. Incidentally,
    I believe Javanese can express belief in Gusti Allah so easily in part because
    there is so little one need believe about him. He is an anthropomorphic but otherwise
    largely blank entity.'
