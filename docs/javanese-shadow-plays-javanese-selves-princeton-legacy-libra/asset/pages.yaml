    a person of lower status to interact in the mode of exchange without any necessary
    material loss. This is not to say that Javanese value goods over status, rather
    that they consider respect rendered to be as valuable as goods or services received.
    Respect in language and gesture balances a system of exchanges and assures that
    there will build up no completely one-sided relations of creditors and debtors.
