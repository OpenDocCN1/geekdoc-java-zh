    Funerals an even more startling example of this assumption of voices. It is customary
    for a high-status speaker (often the mewah) to make an oration before the body
    is borne to the cemetery. Frequently, he speaks on behalf of the deceased, who
    takes his leave and begs forgiveness from his relatives, and then on behalf of
    the relatives, who ask forgiveness on their side. The speaker may also speak in
    turn for the bereaved family, and then for theirs, at the time of their leave-taking.
    The speaker speaks for all these different parties in order to make sure that
    the appropriate words are "exchanged."


    I do not mean to say that speaks in Java is irrelevant to the import of words.
    Often, it is the status of speakers that makes their words important, than the
    words'' sense. The greater the status of any speaker at a ritual, the more glory
    redounds to the sponsors. Yet clearly, spoken words can be thought effective beyond
    the identity of their immediate source. If a dhalang about repair a puppet can
    take heart in words he has spoken in the place of his ancestors, it is not because
    those words fulfill the necessity of an exchange regardless of who actually speaks
    them. Speakers, as I have mentioned before, do not express their "selves." Their
    words are not thought necessarily to represent them as particular individuals:
