  md: '# RITUAL CELEBRATIONS 163


    situations elicit words that are appropriate, and these should order any individuals
    in attendance according to established patterns. They should also effect the business
    at hand. In doing so, individual voices matter inasmuch as the status of the speakers
    affects the efficacy of their speech: their greater status implies the greater
    power communicated through their words. But the content of their words need not
    refer to the speakers personally, as unique or original individuals, particularly
    not in formal speech. In fact, people''s words should not reveal anything idiosyncratic
    or unusual. The conventional nature of their words should instead enable everyone
    to make their way through events without worry of surprise, upset, or any affront
    to their dignity. As a result, less intimidated tied to speakers than we are wont
    to assume, words in Java are attributable to sources—sponsors, guests, ancestors,
    the dead—who do not speak them.


    Yet the fact that words can be pronounced by one speaker on behalf of another
    does not explain the need for such substitution at a ritual celebration. In this
    context, I believe the dispersion of responsibilities to speak in two ways at
    once. When the sponsors do not speak, they dismantle their own control of the
    proceedings. They diffuse the impression of superior authority so gathering many
    people to their home implies. To play up that image of their own authority by
    speaking for them would be unbecoming in sponsors. In fact, they would appear
    to exert control over the operation and everyone associated with it that identity
    as sponsors suggests but much of the ritual tends to obscure. In confronting their
    guests, they would seen to have taken charge of them. Yet for all the baroque
    expression of deference and humility that inheres in remarks made to the guests,
    the meaning of the entire event, as an assertion of the sponsors'' superior authority,
    is clear. The meaning of the speeches—hospitable, deferential, but at the same
    time status-asserting—remains undisturbed, no matter who speaks them. They remain
    words addressed to a large crowd of people who have come to attend upon the sponsors
    at the time of their ritual need, and glory.


    The sponsors'' withdrawal from the limelight probably represents more than mere
    hesitation before making too-bold claims to power, however. In their silence,
    the sponsors maintain the authority of power never deployed. They assume the role
    of an authoritative figure whose potency is only subtly manifest, in its myriad
    effects.'
