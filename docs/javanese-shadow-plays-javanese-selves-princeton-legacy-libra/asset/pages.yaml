  md: '# RITUAL CELEBRATIONS 161


    A person can also do ascetic rigors on behalf of a non-kinsman.

    A young man, Mas Sulis, did ascetic exercises on behalf of his patron, Pak Lurah
    Karanganom, in order to help him find his lost brooch. And anyone''s great success
    is liable to be attributed by the envious to having engaged a powerful dhukun
    to do such exercises in his place.


    Speech appears to be thought susceptible of change in the same way that the fruits
    of ascetic practice are. Certainly Javanese admit with a curious dissociation
    of speech and speaker. If vows can turn upon a speaker, they are a kind of semi-autonomous
    language. Other instances imply still greater alienation of person and speech.
    A dhalang in Jogja explained that when he wished to repair an old puppet he first
    said aloud to his ancestors, madya, "I''m just going to fix this puppet''s hair
    bit, Mbah [mbah:grandfather,ancestor]." Then he answered for them, in low Javanese
    (ng), "Yes, okay, go ahead, things go all right for you." He did this, he noted,
    to make everything "feelingless" or "neutral" (tawar), is to keep his ancestral
    spirits from beginning started or upset on seeing him take tools to a venerable
    puppet, and to relieve any anxiety he felt doing so. He could speak for both himself
    and his interlocutors in order to attain these ends follows, I think, from an
    impression that words matter as much if not more for how they fit a situation,
    rather than simply for how they express the views of the people who speak them.
    The dalang did not put words in his ancestors'' mouths, he simply played their
    hand for them, getting the requisite words into the arena at the proper moment.


    Another instance of this assumption of different voices took place shortly after
    Mas Tarno held the wedding for his daughter. The youths gathered at his house
    to receive a meal and Mas Tarno''s thanks for their efforts. Mas Tarno said a
    few words of appreciation, but he deferred to Pak Bayan Krama, who spoke of considerable
    length in formal phrases to express Mas Tarno''s gratitude. Pak Bayan then switched
    roles and gave a long speech in acceptance of Mas Tar-


