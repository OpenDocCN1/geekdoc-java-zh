  img_proc: true
- pgno: 283
  md: '# 254 CHAPTER 9


    they perceive. In the interpretation of dreams, determining the truth value of
    signs becomes crucial. Nevertheless, the interpretation of dreams represents another
    form of defense against phenomena. Dreams are examined closely not to attain insight,
    as a post-Freudian Westerner claims to, but rather to attain foresight, and with
    that foresight the ability to defend oneself—or at least prepare oneself—future
    events. At the same time, the greater pertinence of truth value credited to dreams
    brings another emphasis: on the importance of signs'' insulation from any obvious
    source or agent.


    Dreams are divided into four types, distinguished according to their significance.
    In general, the greater the degree of reference to prior events and familiar context,
    the less truth is to believe in a dream. Dreams that are strange or difficult
    to unravel are thought more significant than those of obvious content. A dream''s
    import is further graded according to when a person dreams it, whether in the
    early, middle, or late portion of the night. Only dreams obtained during the last
    three hours of sleep before dawn are thought likely to contain true signs. (Numerological
    formulas [petungan] provide formulas with which to ascertain the probability of
    a dream''s fulfillment in life and when that fulfillment is likely to take place.)
    It is essential to determine whether a dream source is the dreamer''s experiences
    and wishes, a bothersome spirit (dhemit), an ancestral spirit, or God. Only the
    last two agents can provide truthful dreams. The dreams considered most important
    of all lack images of any kind. They consist only of some statement, presumed
    to be God''s words.


    Interpreting particular dream content consists of checking it against invariant
    symbolic meanings. Most people spoke of dream symbolism as “backwards” (kosok
    balon): pleasant dreams presage fortune, where unpleasant elements foretell happiness.
    If people dream of being praised and applauded, for example, they should expect
    to see themselves publicly shamed. If on the other hand they dream of wild tigers
    or feces, they can look forward to obtaining money or advancement. This rule is
    not invariable, however. In dream of losing a tooth signals someone''s death,
    the location of the tooth indicating it is a relative on the dreamer''s maternal
    or paternal side, or the dreamer himself or herself, who will die.


    People''s reactions to a dream, or to the interpretation they or a wong tuwa can
    make of it, should be guarded. If a dream means good fortune, they should simply
    put it out of their minds. To antic-'
