  img_proc: true
- pgno: 228
  md: '# DHALANG, TROUPE, AND TRADITION 199


    however, insisting that Petrúk''s “own” voice loses its special status by being
    put on an equal footing with the dhalang’s many voices, with all the other voices.
    It becomes just one more among a great many voices, none of which can be identified
    with the dhalang personally. The result further dissembles the existence of a
    dhalang “behind” all the puppets. If the sponsors dispel their presence by giving
    up their voice, letting the moderator, speech-makers, and dhalang all speak in
    their place, the dhalang, in turn, dissembles his presence by speaking in a great
    many voices, but never his own.


    The dhalang, in a word, disappears: into the refractions of his voice in antawcana,
    into the constraints of the tradition as a whole, and into the white ground of
    the screen on which the shadow of his hands should never fall. For all that, of
    course, the impression of his potency is enormous. In fact, I believe it is precisely
    the impression the dhalang makes of a hidden, unlocatable, but all-encompassing
    authority that is compelling to Javanese.


    A counter-example helps to illustrate the importance of the dhalang’s self-dissimulation.
    I have made reference several times in this account to the special skills and
    reputation of Ki Nartosabdho. There is one aspect of his performance that I always
    found disturbing and that I believe helps to explain the vehement denunciations
    that he earns from conservative way enthusiasts. Everyone in Java seems to know,
    far and away the most expensive dhalang now performing, as well as the most famous
    and popular one. He is also particularly concerned with his personal prestige.
    Unlike other dhalang, he is very willing to make allusion to himself—his fame,
    his fee, and his home address—in the course of his performances, usually in the
    routines of the punakawan. Occasional allusions on the part of any dhalang to
    the particular context are startling, and the sudden contrast in reference makes
    as especially piquant. Nartosabdho’s self-indulgent references to himself on his
    own personal situation and reputation, however, dispelling the image of the dhalang’s
    impersonal authority. The result is grating, even if it further qualifies the
    name of Nartosabdho and the glory of the sponsors who have paid his extravagant
    fee. Wayang has long operated by a version of the star system. But when the star
    shows himself clearly, the impression of his power palls, and I believe this fact
    explains much of the censure heaped upon Nartosabdho.


