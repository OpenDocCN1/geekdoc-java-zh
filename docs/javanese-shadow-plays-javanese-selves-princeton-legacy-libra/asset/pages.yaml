    performance is filled with set pieces, music, and comic exchanges.

    The stories themselves, for that matter, particularly those stories popular at
    present, of which Senawangi is a somewhat simplified but still fairly typical
    example, are highly conventionalized, and their outcomes are easily predicted.
    So there is little reason to follow them very closely. Wayang seems in many ways
    to occupy the Javanese, they pay only it intermittent attention. I wish to analyze
    the reasons for both its allure and for what sometimes looks, to an outsider,
    like its willful neglect.


    The central difficulty that confronts researchers of a non-Western art form is
    that they must avoid using it as a screen to project their own preconceptions,
    they cannot restrict themselves to wholly exegetesis. Indigenous commentary is
    essential, of course. Yet an art form can express more than any one spectator,
    or any performer, recognizes consciously. Claude Lévi-Strauss''s demonstrations
    of recurring patterns in different registers within a culture should permit us
    to presume that an art form can be motivated at least in part by constraints as
    deeply felt but also hidden from consciousness as kinship structure or pattern
    of exchange (Lévi-Strauss 1964). And Victor Turner''s observation that a ritual''s
    symbolism can express conflicting values, even if exegesis does not acknowledge
    such contradictions, applies to performances as well (Turner 1967). The problem
    then is how to surpass description without imposing alien judgments, how to remain
    sensitive to cultural context without limiting oneself to indigenous exegetical
    ''traditions.''


    ¹ In studying non-Western arts, Westerners tended to follow one of two approaches.
    Either they have provided more or less appreciative descriptions, or they have
