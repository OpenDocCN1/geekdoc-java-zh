  md: '# CONCLUSION 265


    tion, but it is not scripted. Indeed, with the ambiguous exception of sung verse,
    the traditional arts in Java almost never take to the form of written texts. Javanese
    seem unwilling to accept the impoverishment of language necessary to fix it upon
    the page, stripped as it then becomes of so much of its tone and contextual meanings.
    That wayang lakon are preserved in only three- or four-line summaries the inadequacy
    of writing to convey anything in wayang beyond “what happens.” What matters in
    performance is what is proper to performance: the tone, manner, and style of movement
    and speech. So even more acutely than scripted drama, a performance of wayang
    emphasizes its own nature as an ephemeral event.


    How then can we talk about what a performance of wayang means? How could we, following
    Ricoeur, look for a text, and how could we look for the consequences of a performance
    as “meaningful action” In response to the first query, if meaning inheres in what
    remains in a text, then we should look to what is fixed about the tradition as
    a whole—the pathokan and the recurrent conventions of plot, taken as a kind of
    textual basis for every performance. A. L. Becker does just this, establishing
    some fixing of meaning in the ephemera of performance.


    In addressing the second query, if we take the meaning of action to lie in its
    consequences, and if we take a performance of wayang as a kind of action undertaken
    by its players and sponsors, then we can look for its meaning in the effects it
    has after it takes place. Javanese themselves believe that a performance becomes
    “inscribed in the world.” They believe that its consequences surpass the intentions
    of its agents, since a performance is thought capable of exerting influence influence
    over sponsors, spectators, and surroundings long after it takes place. They also
    believe that its importance surpasses its immediate context, as it redounds the
    status of the sponsors and the reputation of the dhalang and his troupe. Furthermore,
    since a performance as a ritual celebration draws many people into its workings,
    as providers of labor and/or guests or spectators, it can have important ramifications
    in their social lives. For example, the extent of a neighbor’s financial support
    and labor will affect his or her relations with the sponsoring family for years
    to come. In all these ways, a performance of wayang fits Ricoeur’s description
    of “meaningful action considered as a text,” since its meanings persist long after
    its occurrence.'
