    associations, for English-speakers, with masculine sexuality, potentates, and
    dangerous substances are all thoroughly appropriate. In fact, they are to be fostered,
    because it is essential to recall that potency and instrumental power are not
    really opposite or mutually exclusive terms. Potency is for the possession or
    loss of political authority, sexual capacity, material wealth, and other forms
    of effectiveness, influence, or coercive control—in a word, power—in the world.
    Power of whatever sort, for Javanese, is a manifestation of potency, which, as
    Anderson makes clear, is only of a single sort: “all power is of the same type
    and has the same source” (1972b:7).


    Javanese colloquial usage occasionally distinguishes among versions of potency
    and/or power. There is a word, kasetken, to label a specifically spiritual power.
    But it is rarely used in conversation. The politically powerful, the financially
    secure, the severely ascetic, and the sexually athletic are all referred to simply
    as “strong” (kuwat). In what follows, I will speak of potency when I wish to distinguish
    a spiritual or mystical concept of power, as opposed to a more material or instrumental
    one. The distinction, however, is always somewhat arbitrary; the two are not so
    opposed as complementary in Javanese thinking. In fact, it is precisely the polyvalence
    of the concept of “strength” (kakuwatan) that motivates much of the politics of
    Javanese interaction.


    The distinction between potency and mundane powers is made in Javanese, actually,
    in reference however not to the sort of spiritual/temporal contrast familiar to
    Westerners, but rather in terms of the contrast between what is manifest and what
    is not. Lair and batin refer to two different kinds of phenomena: lair to what
    is perceptible to the senses and/or common-sense explanation, batin to what is
    generally imperceptible, mysterious, and resistant to obvious explanation. The
    lair refers to the waking reality that we all assume and that we can, in general,
    agree upon. It stands in contrast to the world of batin, that mystical forces
    on the basis of which quite a different account, or accounts, of the world are
    formulated. To speak of individuals’strength of batin” (kakuwatan batin) refers
    to their capacity to channel the immaterial potency that exists in the world.
    Such capacity is prior to, and more important than, manifest (lair) signs of power
    as physical strength, material wealth, or formal'
