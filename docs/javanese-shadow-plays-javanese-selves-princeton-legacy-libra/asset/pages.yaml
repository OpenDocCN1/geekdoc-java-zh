    Every step of the way, from pronouncement (or only thinking of) the vow to its
    fulfillment (such as in the trip the Martas made to Sendhang Semarang), admits
    of a great range of variation, and I was given contradictory comments about each
    of these steps. I find this ethnographic richness rather rich trying, but it is
    interesting to note precisely where Javanese ideas on the subject are most consistent
    and where they are most likely to vary. The two points people had perfectly clear
    were that: 1) a vow that unfulfilled would cause its greater misfortune; and 2)
    the fulfillment of the vow had to be witnessed (diseksi), and the person who acted
    witness had to attest verbally to having seen the vow fulfilled. Less was clear:
    1) to what agency appeared in making a vow; and 2) which agency insisted on its
    fulfillment and punished all lapses.


    Vows are made in a great variety of circumstances and to many different ends.
    Often, the latter are no different from the needs that prompt a person to do ascetic
    exercise and/or consult with wong tuwa or prawangan. People who wish to pass their
    exams, or to get a job in the civil service, or who wish of these things for a
    relative, can make a vow that they will offer food dhahar, that is hold slametan
    with offerings made to God and to ancestral and territorial spirits, and also
    hold a performance of some sort, if they see their wishes granted. In the discussion
    that follows, however, I will focus on what seems to be the classic instance of
