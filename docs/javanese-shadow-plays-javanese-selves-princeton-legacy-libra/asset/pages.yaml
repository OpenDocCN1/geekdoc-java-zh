    to many Javanese. Furthermore, they make up a remarkable proportion of Javanese
    exegesis, and much mystical ngèlmu consists of kerata basa. An older man with
    aspirations to the status of a respected elder (wong tua) or teacher of mystical
    wisdom (guru) will have many such etymologies for almost any topic comes up. These
    may not have the epigrammatic nature of phrase typical of the more generally known
    examples, but they are pronounced with a more significant air. To give just one
    example: an older man I met at a dhalangs house of the musical instrument, the
    bonang: “Bu le ngimanake kaya ngapa [Mother: she takes on burdens like no one
    else], because she is the leader of the family; and nang: wong lanang, weningang
    [male: he has authority]. So it is the bonang which is the leader and plays the
    opening of a gendheng, just as it was Sunan Bonang (one of the nine walt, propagators
    of Islam in Java) who gathered all the wadi together. The example is slightly
    atypical in that but is useful in indicating the diversity of links possible and
    the tolerance for links missing. But nu and nang are derived from the word bonang
    itself, and each monosyllable is linked to a parent through the usual device of
    adding syllables at will. Each parent is then identified in the role of leader,
    which is fitted to the role of the bonang as the instrument that opens a gendheng.
    (Actually, the bonang opens only some gendheng under certain circumstances.) The
    same quality of leadership is taken to justify the name, Sunan Bonang, one of
    the nine wadi, although no claim is made for the priority of either instrument
    or person. What has happened is that the explicator has succeeded in connecting
    the word to certain approved domains of meaning and religion. The assimilation
    does not really tell one more about any of the three—musical instrument, parent,
    or Muslim proselytizer. It simply associates them linguistically and justifies
    these linguistic connections by a rather loose understanding of leadership. I
    believe it is this assertion—which passes for an uncovering—of subtly motivated
    connections, connections whose motivation is linguistic, numerological, and formulaic,
    and still somewhat arbitrary, which makes kerata basa in ngèlmu so compelling.


    Ngèlmu and kerata basa are not really intended to expand a person''s understanding.
    They do not represent an analysis of the world. Instead, they assert control by
    the imposition of a grid upon data. They concern truth only inasmuch as they appeal
    to what is already'
