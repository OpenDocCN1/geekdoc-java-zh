- pgno: 241
  md: '# 212 CHAPTER 8


    servant to high-status figures, he must put up with the constant in- cults, teasing,
    and tricks to which his sons subject him. While the punakawan evince respect in
    their obeisance to their masters, to their own father they are rude and hostile
    in a manner both scandalous and, to spectators, quite entertaining. Pétruk, Nala
    Garèng, and Ba- gong treat Semar with a kind of jocular scorn out with all the
    notions of respect for one''s elders that Javanese normally espouse.


    In Guru and Semar, paternal power is undercut, distorted, occa- sion mocked. It
    is never contradicted for long, however. Guru may depart in disgrace at the end
    of a performance, but he remains the king of heaven. And Semar usually proves
    in the end that his power is superior to that of his sons. Like other contraventions
    of ide- olog in wayang, these of aberrant paternal figures are never pushed to
    their critical limits or resolved. Instead, in exaggerating contradictory versions
    of the figure of authority, suggesting alterna- tively extraordinary powers, great
    selfishness, foolishness, and at times, in Semar, heroism and Guru remain ongoing
    sources of tension. In fact, they motivate much of what happens in wayang. When
    I asked one dhalang why often behaved so outrageously, he said, "I don''t know.
    But if he didn''t, there wouldn''t be any lakon."


    Much of an audience''s interest in a performance, I believe, de- pends on the
    resonance wayang suggests with their lives. But that res onance is by no means
    univocal or even deliberately cultivated by dhalang. I have tried to show that
    certain conventions in wayang play upon important aspects of Javanese ideology
    and interaction without really resolving or even confronting the contradictions
    and inconsistencies that in in them. Perhaps the relationship is most succinctly
    typfied in the many battles that take place in every- performance. Popular dhalang
    often wins an audience''s attention in the long opening scene by staging a debate
    among several characters. As tension mounts, the debate grows increasingly hostile,
    turning into first a verbal battle (prang omong), and finally, after epithets
    fly, a physical one. These contests, verbal and physical, arouse avid inter- est.
    They contravene, however, the resolutely pacific bias in Javan- anese interaction.
    This discourages all but the most veiled expression of displeasure in most situations.
    (The exception is when a person of much higher status chastises a low-status person.
    Open expression is then permissible because the disparity in status should prevent
    any retort or argument.) To enter into sustained argument, let alone a'
