  md: '# 3. VILLAGE POLITICS


    If Javanese families potency should concentrate in the person of the father, in
    larger realms, such as the village and the state, potency should concentrate in
    males of similarly elevated status. Efforts to protect and magnify impressions
    of a leader''s potency, efforts to benefit by it, and efforts to escape any control
    it might imply mark political relations in these domains much as they do in the
    family. As a result, the paradoxical concept of quiescent power influences everyone''s
    behavior.


    That there is a politics implicit in the relations between dhalang, his sponsors,
    and his audience will be the burden of later chapters to establish. It is worth
    looking first to the more obviously political domain of villagers'' relations
    with their village headmen, in order to trace the ways in which the ideology of
    potency and the circumstances of village life actually meet on the ground.


    The king who exercises power in his slightest gesture represents a recurrent image
    in Javanese culture, one that might be termed a dissembled center. As Anderson
    has pointed out, the conventionalized description of the good king endows him
    with such attractive power that subjects and foreigners alike submit voluntarily
    to the superior strength of his batin (Anderson 1972b). This ideal view makes
    the king strong, vital, and authoritative center, one toward whom all others submit,
    whether or enemies easily defeated in battle by the superior batin, in allegiance,
    obeisance, or helpless subjugation. However, the same image suggests the king''s
    necessary stasis. In contrast to a less powerful person, who must exert himself
    strenuously to attain any end, such a king need do very little. Should he need
    to exert himself obviously, he demonstrates a lack of potency. So his power must
    always be in a sense absent: evident in the condition of the kingdom but never
    demonstrated in coercive action. This is, of course, an ideal view, not a description
    of how kings in Javanese history have attained and kept the kingship. Yet the
    re-


    > * An ethnographically more detailed version of this account can be found in
    Keeler 1985.'
