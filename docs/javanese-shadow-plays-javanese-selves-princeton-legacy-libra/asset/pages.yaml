    proceeded to terrorize the one street in town. He was also said to have been quite
    a womanizer. As imputed to a headstrong Javanese youth, he was said to have studied
    invulnerability magic assiduously. Such magic, in contrast to the wisdom sought
    by older Javanese males, is thought dangerous, because it encourages people to
    engage in many fights. As a phase in a man''s life, though, interest in such magic
    is considered normal and even admirable. It was claimed that Pak Lurah had travelled
