    A performance is divided into three sections—theoretically equal in length, though
    in practice rarely so—that are distinguished by the musical pathet used in each.
    Pathet denotes emphasis in range, somewhat similar to modes in Western music.
    The first section of a performance, lasting until around midnight or one in the
    morning, is in the scale sléndro and the pathet nem. The middle section of the
    performance, from the scene in which the servant-clowns (punakawan) first appear
    until about three or four in the morning, is in the pathet sanga, while the final
    section is in the pathet manyura. Each of these pathet is slightly higher in the
    scale sléndro than the preceding one.


    Within these large divisions, the pathokan establish sequences of scenes, and
    the general content of many of these scenes. The description of the lakon Senawangi
    provided in the Introduction indicates how closely the dhalang followed the pathokan
    that occasion. A performance necessarily opens with a long, conventional description
