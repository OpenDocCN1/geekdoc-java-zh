  md: '"empty" (kothong) and so a surveyor of powerful signs, is essentially similar.
    The word for empty, kotong, can carry exactly opposite implications and value
    judgments in Javanese: it can be used to describe someone who is empty of investments
    and so potent, or empty of potency and so vulnerable. This ambiguity in its meanings
    stems from the underlying paradox of the potent self: that a potent individual
    must be totally selfless, without an individuating self, and without selfish interests
    (pamrih). In either case, that of wong tuwa and żeangan, a person suppresses the
    self in order to become a vessel to powerful speech. A wong tuwa comforts, wants,
    and needs, whereas żeangan demands everything but the physical presence of their
    body. Whether the powerful voice that speaks is deemed "one''s own" or "a spirit''s"
    is something of a supplementary gloss.


    Préangan are scandalous, however, because they suggest that the opposition between
    the presence and absence of a self cannot be overcome. Instead, the terms can
    only be temporarily reversed, through the medium of voice. The żeangan becomes
    absent, the spirit present removal of the first is the prerequisite to the second.
    Potency, therefore, depends on the establishment of the lack of a self; the self''s
    absence is the precondition of potency''s presence. The wong tuwa, in contrast,
    makes rather grandiose claims: to be at the same time something more (potent)
    and less (individuated), than an individual self.


    Wong tuwa and żeangan both profess that in their speech, their supplicants attain
    plenitude—meaning, foresight, and the fulfillment of their desires. They themselves
    seek nothing, and in seeking nothing, the impression of their self-sufficiency
    and potency. It is telling that an accusation invariably made against żeangan
    by dhukun, against dhukun by żeangan, and in fact, by all experts in kebatinan
    against each other, is that while the speaker demands and even no payment whatsoever,
    the other party or class demands money on the line. This is equivalent to asserting
    their powerlessness. But it does so by imputing to desire, limits, lacks. If a
    person trades speech for money, then clearly that speech has no contents (isi),
    because potent speech cannot emanate from an unfull (desiring) source, and so
    it can be of no help to anyone else.


