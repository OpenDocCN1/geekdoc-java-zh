    assumed true: that father and mother run a household, say, or that Indonesia attained
    independence on August 17, 1945. Sense is kept subordinate to the demands of the
    interpreter, who insists upon links outside without sense, or at most bound within
    a circumscribed and always pre-established sense.


    It is not incidental that the links ngèmu and kērta basa disclose in phenomena
    concern numbers and sounds much more than sense. Aural associations among the
    names for things stand somewhere-between self and phenomena, between an impervious
    individual and an imposing object. That is, they assert an independent support
    for the links an interpreter may make between phenomena. But they do so outside
    obvious sense, by a more mysterious correspondence. Phonic repetition constitutes
    a kind web of links among things, outside all material or other cognitive connections.
    At the same time, sounds are more malleable than things, being fewer in number.
    So an interpreter can work with the word bonang more freely with the image—a number
    of brass pots suspended over ropes—it evokes, particularly if he is free to treat
    the word as a number of sounds he can separate and join at will.


    # DREAMS AND PORTENTS


    I have suggested that the exegesis of wayang, understandings about ngèmu, and
    rhetorical displays involving kērta basa bespoke a cautious attitude toward knowledge.
    In the case of ngèmu, control over the material becomes especially important,
    since if its accumulation is not carefully gradated, it threatens the well-being
    and even sanity of the learner. Interpreters or investigators in all the fields
    mentioned above, however, try to maintain firm control over the data under study.
    They restrict in advance the range of experience the data might evoke, and/or
    the degree of emotional involvement or intellectual credence they place in it.
    Interpretation may well constitute a pursuit of sense and a consideration of what
    is true and what is questionable. Yet the sense is permitted to make remains circumscribed.
    Outside the realm of appropriate interpretations, people avoid themselves committing
    to either belief or skepticism.


    Sense is not always predetermined in Javanese interpretation, and people do not
    always passing judgment on the veracity of what'
