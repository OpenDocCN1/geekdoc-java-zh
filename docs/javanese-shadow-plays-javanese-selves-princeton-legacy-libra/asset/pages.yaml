    is, on their insulation from personal desires and the distortion there imply.
    Insistence on the dissimation of self in a wong tuwa''s other-worldliness, the
    dhalang''s disassembled presence, and a dream''s opacity reflect the distort of
    a personal agent in the generation of signs. The greater demand for truth or efficacy,
    the more the presence of a mediating, interpreting self must be obscured. A wong
    tuwa must show himself to be without desire (pamrih). The dhalang must utilize
    his own voice and presence in performance. A dreamer must not recognize his own
    desires and experience in a dream''s content. In the West, such a suppression
    of personal investments would be intended to enable a person to uncover objectively
    verifiable connections among data. In Java, however, it means fitting data to
    externally established systems, systems neither generated by the data''s particular
    nature nor obviously dependent upon the analyst''s point of view or wishes.


    Ngèlmu, dreams and falling lizards all illustrate these principles in specialized
    areas. Another specialized kind of interpretation is employed in the pursuit of
    a thief: When Pak Lurah Karangan tried to obtain positive identification of the
    thief who stole her jewelry, he went to several dhukun. Most would not make any
    comment on the identity of the thief, indicating only various methods by which
    Pak Lurah could assure the brooch''s recovery. However, one dhukun used a method
    that is sometimes applied in such circumstances. It consists of reciting certain
    formulas (rapal) and then asking a young, prepubescent child to look in a mirror
    and describe the person he sees in it. The description should enable the child''s
    listeners to discern the culprit''s identity. The person who reads the image must
    be a child because children are not caught up in the jealousy, intrigue, and politicking
    inherent in social and sexual maturity. Once again, self-interest is thought to
    rule out the possibility of foresight, whereas innocence assures the veracity
    of the child''s words.


    A more frequent manifestation of the need to disseminate an interpretive, mediating
    presence lies in the pervasive pattern in Javanese speech of using direct rather
    than indirect quotation. I cited in Chapter 1 a to which this pattern is often
    put: when a person attributes remarks implying his or her high status to another
    speaker. But the pattern''s use is by no means restricted to such strategies.
    Any recitation of a previous encounter turns into something like a reenactment,
