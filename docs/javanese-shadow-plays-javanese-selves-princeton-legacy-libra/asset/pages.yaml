    the headman''s powerful tobacco trader father. This put him in the circle of fairly
    prominent families in the village. He was, further-related to Pak Cerma through
    marriage, since the Cismas'' daughter was married to Pak Cahya''s wife''s younger
    brother. It was difficult for Pak Cerma, in view of all these factors, to adopt
    any of the usual terms, as "younger brother" or "son," that he might otherwise
    have used to address Pak Cahya. It was important for him to recognize Pak Cahya''s
    somewhat elevated status without denying their kinship ties or Pak Cerma''s, more
    prestigious status. Pak Cerma''s solution was to call Pak Cahya "Bang." Pak Cahya''s
    old-child, so, was named Bambang. Teknonyms, terms of address and reference that
    name someone in terms of his or her relations to children or offspring, are often
    used in Java, so Pak Cahya could be referred to as "father of Bambang" (Pakné
    Bambang). Tekonyms constitute a respectful means of address, since they make it
    possible to avoid mentioning a person''s own name, but are still familiar, since
    their use implies relations with the addsee''s family. Abbreviating names are
    also familiar: "Bang" would be a very familiar term of address to use someone
    named Bambang. Pak Cerma used it as an abbreviated form of Pakné Bambang, striking
    what he felt to be the right mix of familiarity and respect.


    How one manipulates status levels, titles and names in conversation depends, like
