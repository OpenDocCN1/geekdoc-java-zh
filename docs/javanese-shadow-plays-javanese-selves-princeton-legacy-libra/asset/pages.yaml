  md: '# SOLO IN THE NEW ORDER


    LANGUAGE AND HIERARCHY IN AN INDONESESIAN CITY


    James T. Siegel


    In a wide-ranging examination of linguistic and social phenomena in modern Java,
    James Siegel discusses the adaptations made by the city of Solo to the Suharto
    regime. Solo, although populated by strong supporters of Sukarno, quickly accommodated
    itself to Suharto''s rise to power and to what he called his New Order. Nevertheless,
    the inhabitants continued to adhere to their complex ideas of deference and hierarchy
    through translations between Low Javanese and High Javanese, the two speech levels
    of their unusual “two-tiered” language. Professor Siegel describes the establishment
    of translation in Javanese culture, showing the influence of the Dutch and tracing
    the formation of hierarchy in a Javanese neighborhood. The final section of the
    book depicts the points at which translation breaks down and with it accommodation
    to the New Order.


    ISBN 0-691-09427-6. 296 pages. 6 halftones, 1 color plate. 1986.


    # ASIWINARONG


    ETHOS, IMAGE, AND SOCIAL POWER AMONG THE USEN BAROK OF NEW IRELAND


    Roy Wagner


    Roy Wagner is well known for his several distinguished works on the Daribi of
    New Guinea. Again he avoids the reading of a Western message into the Melanesian
    material; his portrayal of the Usen Barok takes into account the way in which
    they themselves conceive of their institutions and actions. The author finds that
    their culture is generated through commonly held images, which may be public actions,
    verbal metaphors, or spatial constructions like the men''s house. Each image can
    be interpreted in an indefinite number of ways, and only the image itself is equal
    to all of them. Talk, say the Barok, is cheap, and they live by the belief that
    the truth of things must be witnessed or experienced directly.


    ISBN 0-691-09421-7. 260 pages. 6 halftones, 3 maps. 1986.


