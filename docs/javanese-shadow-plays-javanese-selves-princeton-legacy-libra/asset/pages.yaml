    as to why an art form has developed in a particular place and in a particular
    way.

    In Java, one only turn to Pigeaud''s voluminous Javanese Volksvertoningen (Pigeaud
    1938) and J. Kato''s beautiful Het Javanese Toel (1923) to see what the Western
    scholarship on performing arts can attain. These and other studies of wayang cult
    have focused primarily on three major concerns: 1) the description of the puppets
