    conviction by dhalang and wayang aficionados alike, stem once again from the ambiguous
    status of the dhalang relative to that of his sponsors and that of his audiences.
    He is in charge or is he their subordinate? There is a further ambiguity in the
    dhalang''s status, in this case relative to the wayang tradition itself: is the
