- pgno: 24
  md: '# INTRODUCTION: ON INTERPRETING A JAVANESE ART FORM


    Ndrog-dhog-dhog. The puppeteer wrapped a heavy wooden mallet against the side
    of the puppet box to his left, starting a performance of the Javanese shadow play
    (wayang kulit). The great gong sounded and the Javanese orchestra arranged behind
    him began to play. A man in his early sixties, with the wide-set eyes and wide
    jaw characteristic of lowland Javanese, the puppeteer (dhalang) sat cross-legged
    in front of a long white screen with a red border, a bright light suspended above
    his head. Banana-tree trunks, held by supports about a foot off the ground, ran
    along the base of the screen. The portion of the screen directly in front of the
    dhalang was filled by a single puppet, called the kayon, an all-purpose prop shaped
    like an inverted cone. On it depicted in brilliant colors an enormous tree, with
    monkeys and birds in its branches, monstrous heads on either side, and a gateway
    and pool below. A few to either side of the kayon ran a long row of puppets extending
    to the ends of the screen and beyond. Each of the dozens of flat leather puppets,
    intricately cut and elaborately painted, was secured to the banana trunks below
    the screen by means of a pointed grip made out of horn, was jammed into the trunks''
    spongy flesh. The puppets were arranged in ascending size. Nearest the dhalang
    were small, delicate puppets depicting battles, women with demowered faces, and
    some gods. Refined knights with half-closed eyes, bare chests, and narrow waists;
    more gods dressed in long gowns and turbans; larger, bolder males; giants and
    monsters with huge round eyes, bare teeth, and paw-like hands completed the series
    on either side.


    As the orchestra, called the gamelan, began to play, Ki Cerma, the dhalang, pulled
    the stem of the kayon out of the banana trunk with his right hand and, gripping
    its tip with the fingers of his left, held it over his head while he murmured
    ritual spells to stave off danger. Then he twirled the two-foot-high kayon, secured
    it in the banana trunk to one side of the open area of the screen, and began to
    bring out the puppets that would appear in the first scene. A prince, maidservants
    to attend him, and knights figured among these. Ki Cerma'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 4 INTRODUCTION


    held the stem of each puppet in one hand as he moved it across the screen, and
    with the other hand grasped the two lighter grips, also made out of horn, connected
    to the puppets'' palms. The arms of shadow puppets are very long and joined at
    the shoulders and elbows, but these are their only movable parts. The dhalang
    moved each puppet and manipulated its hands in a manner appropriate to its particular
    character and station, the maidservants moving with elegant grace, the knights
    with dignified resolve.


    A number of microphones, some of them flat that looked like old parts from a car,
    one flashy new recently made in Japan, were fastened to the banana trunk front
    of the dhalang. They were linked to loudspeakers inside and outside the house
    in which the performance was taking place, and Ki Cerma began to speak, his voice
    flooded the scene. He spoke in a long, rapid, and highly stylized stream of words,
    describing in an idealizing and conventionalized but rather obscure vocabulary
    the kingdom and court of Pringgadani, in which the story opened. Throughout his
    narration, the gelan played softly in the background. The dhalang timed his delivery
    to mesh with a series of strokes on the various gongs in the ensemble, and he
    occasionally interrupted his description with a few lines of Old Javanese poetry
    (suluk). The account ended as the dhalang identified the characters now assembled
    in formal audience with the prince.


    With great deliberateness, the prince of Pringgadani, Gathutkaca, exchanged greetings
    with each person present in turn. The order in which he did so, and the titles
    and degree of linguistic formality he used in each of these exchanges, were determined
    by the status of each of his interlocutors. An elder visiting from another kingdom
    received long, elaborate thanks and offers of refreshment. These greetings were
    graciously acknowledged by the guest, the refreshments declined. Knights who were
    members of the prince''s own retinue received less elaborate greetings, but they
    expressed gratitude at the prince''s concern for their well-being, and they greeted
    the guest present at the royal audience.


    The exchange of greetings took several minutes to complete. Following it, Prince
    Gathutkaca summoned his prime minister, Bajrada, to come forward, in order to
    discuss a matter that was causing him great disarray. The dhalang now sang another
    suluk, after this half-hour or so of preliminaries, and the focal point of the
    story was'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# INTRODUCTION 5


    about to be revealed. Only at this stage did many members of the au-dience leave
    off chatting and start paying much attention.


    Preparations for the performance had begun months prior to this long and stately
    opening. Most performances sponsored by private families (as opposed to those
    put on by organizations, govern-ment offices, an entire village, etc.) are held
    in conjunction with some rite of passage. Weddings and circumcisions are celebrated
    with a performance especially often, but other events, such as the birth of a
    child, a rho-raising, or the final ritual in a long series of funerary observations,
    can be appropriate times at to sponsor a shadow play. The sponsors must first
    select an auspicious date on which to hold a ritual, in accordance with rather
    complicated numerological calculations. Then they must choose which dhalang they
    wish to ap-ach, and inquire, often through intermediaries, whether he can perform
    on that date and what he might see. A dhalang''s calendar and his fee both depend
    on the fame he enjoys, though the criteria by which he is judged is diverse. Dhalang
    with strong voices and quick wits are often very popular, very busy, and quite
    expensive to engage. Older dhalang whose voices have lost their flexibility and
    power may nevertheless be valued for their greater experience and wisdom. Ki Cerma''s
    and the travels of his life had taken the sweetness from his singing voice, and
    he had also lost some of the energy that had made him, twenty years earlier, a
    renowned performer very much like him. Nevertheless, he was still a respected
    dhalang, and he performed at least a few times each month during the dry season.


    If a dhalang is free to perform on the evening the sponsors wish, negotiation
    of a fee ensues. The fee depends on several factors: whether the sponsors wish
    to engage only the dhalang plus one or two musicians, assembling the rest of the
    singers and musicians on their own, or wish to let the dhalang bring musicians
    with him; whether the sponsors will run puppets and screen from someone else,
    or will ask the dhalang to bring his own; whether the sponsors wish the dha-lang
    to perform only at night, or wish to have him or a person dele-g by him perform
    during the day preceding the more important nighttime performance as well; and
    whether the sponsors can by vir-tue of some kinship, friendship, or other relationship
    with the dha-lang expect special consideration when the dhalang names a fee.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 6 INTRODUCTION


    dering is occasionally protracted, but it must be done with discretion, since
    the relations between dhalang and their sponsors must never be thought to resemble
    between buyers and sellers at the market. When an agreement has been reached,
    the dhalang is given some portion of the fee as a retainer. In this case, Ki Cerma
    was performing in the home of people living in a village near his own. He had
    agreed a fee somewhat lower than his usual one neighbors are expected to put good
    relations above financial interests.


    Several days before the performance itself, in anticipation of the many guests
    who would come both and during the performance, relatives and neighbors gathered
    to help the sponsors in their preparations. Men first took the front off the house.
    The front of older-style Javanese houses consists of a long row of wooden doors.
    These are removed and the floor and roof extended to accommodate the gamelan and
    musicians when a performance is to be held, or simply to accommodate guests when
    a ritual celebration is held without any type of entertainment. Plaited coconut
    palm were put up to decorate the sides of the performance area extended into the
    yard, and mats were unrolled to cover the floor. (In newer, Western-style houses,
    the front wall is made of cement, and only the windows and door can be removed
    to permit casual spectators a view of the performance.) Inside, the screen was
    set against two of the wooden posts that support the roof of a traditional style
    house; beneath the screen were the banana trunk runners in which the puppets were
    secured. Chairs were set up in the area behind the screen, closer to the inner
    section of the house, so that invited guests who came to see the performance were
    able to watch it on, the more prestigious side, where shadows rather than the
    puppets were visible. Traditionally, and still in some villages near Jogja, there
    were not chairs but mats spread on the floor behind the screen, where invited
    guests


    Behind the house, in the kitchen area, women had cooked enormous quantities of
    food to serve the many guests. People who came before or during the day of the
    ritual celebration to contribute money toward the costs of the event, as well
    as those who came to see the performance itself, were served snacks with tea,
    then rice with sidedishes, and again snacks and tea. A small army of women prepared
    these refreshments, cooking day and night long before as as'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'during the event, and even afterwards, to feed the people who helped to clean
    up.


    Early in the morning of the day the performance took place, the gamelan arrived,
    carried on an ox-cart, with copious amounts of straw protecting the bronze gongs,
    pots, and keys from scraping. Until performance started, children and youths tried
    their hands at various instruments, occasionally attempting to play together,
    often banging out notes on their own. Since a rented tape recorder and loudspeaker
    blared cassettes of pop music and gamelan at deafening volume throughout the day
    of the event, these additions to the general noise went largely unnoticed.


    The sponsors had chosen to hold a performance of wayang during the day, in addition
    to the nighttime performance, so by about nine or ten in the morning a troupe
    of performers arrived. They were greeted and served a meal by the sponsors. Although
    the same musicians played for both the daytime and nighttime performances, the
    dhalang in this case was a “representative” of Ki Cerma, who was to perform in
    the evening: his next to oldest son, Sigit. In other families, it is often a brother
    or other relative to whom the principal dhalang passes the task, and whom he pays,
    usually rather little, of the total sum received from the sponsors. Few dhalang
    perform both day and all night, though in fact apparently this was not uncommon.
    Ki Cerma had done so in his youth and early adulthood, on the insistence of his
    father, himself a dhalang. Many develop their skills by performing during the
    day. But if they to receive frequent invitations to perform at night, they can
    cease to take on the unprestigious and onerous job of daytime performing. Ki Cerma''s
    oldest son had practiced his skills by performing during the day for his father,
    but now received a fair number of invitations to perform at night, and so happily
    let his younger brothers take his father''s place during the day instead.


    One reason that daytime performances are so lacking in prestige is that the audience
    consists primarily of children. The gamelan, hanging onto the posts supporting
    the extended roof or struggling to get a spot where they can stand near the platform
    on which the musicians are seated. On the shadow side of the screen sit men who
    have escorted their wives or other female relatives on a preliminary visit to
    the ritual celebration. These women bring contributions to the sponsors, something
    they do with circumspect'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 8 INTRODUCTION


    gesture when greeted the female sponsor further inside the house. The men watch
    the performance briefly while eating a meal that they are served. The shadows
    barely show in the daylight, however, and the men take little interest in this
    entertainment. Within a half-hour or so they leave again, along with the women
    they escorted. They are replaced by other guests, who make equally brief visits.


    The evening performance matters more than any daytime one, although the stories
    are drawn from the same repertoire. (Occasionally sponsors request that the daytime
    and nighttime performances treat related stories, but more often the stories are
    not directly linked.) In this case, since there had been a daytime performance,
    the musicians rested and ate another meal during the hour or two after it ended
    and before the evening performance began. Ki Cerma arrived during this period.
    In the past, a dalang usually arrived on foot, on a bicycle, or occasionally in
    a horse-drawn carriage. Now Ki Cerma rode on an old German motorbike, bought long
    before in the flush of great early successes.(Very wealthy dalang arrive in a
    car or minibus with several attendants.) The sponsor greeted him and served the
    musicians a meal. At seven-thirty they joined the gamelan, and a concert began.
    The dhal himself plays the drums during this concert, but Ki Cerma''s son Sigit,
    who had performed the daytime wayang, a particularly skilful drummer, trained
    at the national music academy (Akademi Seni Kalimantan Indonesia) in Solo, so
    he drummed for the concert. He later on to accompany his father''s performance
    and was relieved at last only about three-thirty in the morning, when another
    younger brother took a turn at drumming.


    If the dalang is very popular, people of all ages, though almost exclusively males,
    start gathering outside the house where the wayang will be held during the course
    of the concert, or even earlier. In the case of Java''s four or five most popular
    dalang, hundreds of people, sometimes over a thousand, assemble, crowding together
    in whatever space the arrangement of houses nearby allows Boys often climb trees
    to get a better view of the screen—sometimes in such numbers that the trees collapse.
    Although Ki Cerma''s popularity was not great, nevertheless on the paths and roads
    near the performance itinerant sellers set up stalls and laid out mats where people
    could buy refreshments or toys, or could gamble. In the yard, immediately behind
    the gamelan, people sat or squatted'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# INTRODUCTION 9


    the performance, though spectators on the sidelines stood. These people''s attempts
    to get a better view, plus the constant coming and going of spectators, often
    made it impossible for others to see the screen without standing up.


    At about nine, Ki Cerma rose, advanced toward the screen, and sat down cross-legged
    in front of it. He took puppets that he would use in the first scene out of the
    puppet box, and checked to see that another son, Harsa, who was sitting behind
    him ready to assist him, had taken out others that he would need later. He then
    took up the wooden mallet and started the performance by rapping the side of the
    puppet box to his left.


    Many of the invited guests arrived after the performance had begun. They came
    on bicycles or motorbikes if they lived outside the hamlet where the sponsors''
    home was located. They had to make their way among the vendors and spectators
    to where vehicles were parked, overseen by the neighborhood youths, who handed
    out numbered parking checks. They then passed along line as they entered the sponsors''
    house. Although some women accompanied their husbands most of the guests came
    at this time were males. They were escorted to the area behind the screen by a
    relative or friend of the sponsors and shown a place to sit, its proximity to
    the screen depending on their social status. Women spectators—there are rarely
    very many—sat further inside the house, behind the men. Invited guests struck
    up conversation among themselves, whether they had been previously acquainted
    or not. Few of them paid much attention to the performance until the dhalang sang
    the lines of the suluk indicating that the exposition of the plot was about to
    begin.


    The pace of the long opening scene quickened once Prince Gathutaka and his courtiers
    addressed the issue at hand. Gathutaka revealed to his prime minister that his
    disarray was due to the disappearance of his father, Werkudara, the one of the
    five virtuous Pandhawa brothers. Gathutaka and his minister, Bajradenta, were
    still discussing this grave turn of events when the arrival of a priest (pandhita)
    caused a great stir at the court. The priest, named Begawan Durawicara (“Priest
    False Speech\”), aroused great suspicion among some of the courtiers, but his
    assurances that he could find Gathutaka''s father impressed the prince, who entrusted
    all responsibility'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# IO INTRODUCTION


    for the kingdom to him. Durawicara informed Gathukaca that all he needed to meet
    up with his father was to enter the magical pocket in his, the priest''s own,
    robes, while the sage did meditation. Gathukaca and the priest then left the audience
    hall together, to the general disarray of the court.


    Once the long formal opening was past, most spectators listened to the dhalang
    as he took on each puppet''s voice, and they watched more attentively as he moved
    each puppet''s hands as he spoke. The dispute between Durawicara and one of the
    courtiers doubtful of the veracity of his claims was typical of such opening scenes.
    Although the characters had to observe the constraints upon their acts and gestures
