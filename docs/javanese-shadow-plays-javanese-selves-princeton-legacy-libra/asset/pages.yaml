    to sit with other guests," Pak Ceram explained. "They like to be able to lie about,
    stretching their legs out and deking, and joking, rather than sitting politely
    cross-legged on mats or sitting on chairs, and having to watch their tongues like
    other people do." The Cerm held no ritual celebrations while I was living with
    them, but at ritual celebrations held by other dhalang there was often a screened-off
