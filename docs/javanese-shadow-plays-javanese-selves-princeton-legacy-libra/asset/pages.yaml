  md: '# 196  CHAPTER 7


    adhalang protects himself from charges of incompetence or irresponsibility. He
    can distinguish himself, he can be thought pinter, for the way in which he makes
    variations in the surface of a performance: for the comedy, verbal and visual,
    of the routines; for the mounting tension in debates and battle; for the unusual
    juxtaposition of particular characters. But this makes his role a deeply conservative
    one. He does not alter the tradition in any way; his performance leaves the fulsome
    prize bestowed upon Ki Poedojoarto, as I have said, always dwells on the classical
    purity of his performance and his devotion to the full range of the pathokan,
    down to his finest details. Only few of the most famous dhalang in Java now make
    any modifications in the pathokan. These changes consist primarily in introducing
    divertissements—light gending and dancing and/or clown routines—places in which
    they did not figure in the past. An abomination in the eyes of many conservative
    wayang fans, these win popular approval. But they really exaggerate a tendency
    to make the dhalang''s relation to his material that of propagator and embellisher
    of a set form.


    # Antawakana


    It is telling in this regard, according to Javanese, the most important skill
    that a dhalang possesses is not good sanggit but good antikakana. This refers
    to the ability to distinguish the timbre of each character''s voice and or her
    manner of speaking. The interplay of convention and variation is particularly
    interesting here. The voices of perhaps ten or twenty of the most popular characters
    in wayang are so well individuated that an experienced listener can pick them
    out almost without reference to the content of their words. Of course, each dhalang
    reproduces these voices slightly differently. Yet adherence to the general pattern
    is so close that it is often possible to tune into a broadcast of wayang and within
    seconds which main characters are speaking. Even when lesser characters play a
    scene, a good dhalang can have the different figures identify themselves at the
    outset and then differentiate their voices sufficiently to keep the identity of
    each speaker clear without any further cues.


    > During a long court scene, a dhalang usually proposes verbal wayang against
    the screen, the central support of each one stuck into the banana trunks along
    the base of the screen. He then moves one hand of each character slightly as it
    speaks. Some dhalang get lazy and neglect to do this even. Pak Cerma loved to
