    greater jurisdiction within the household, a child begins to see that power can
    be conceived of in different ways. The mother''s power is overt. She tends to
    the family''s obvious, external (lair) needs, such as food and money. A man''s
    power is at once more subtle and impressive. It is its potency (kakuwatan batin)
    that commands deference, which controls others'' behavior, and at the same time
    determines the family''s condition, that is, its fortunes and status. The extent
