    Popular appraisal of great dhalang would seem to contradict any notion of resistance
    on the part of wayang''s audiences. When people praise an especially fine dhalang,
    they invariably say, “When the scene played was joyful, everyone in the audience
    felt happy, and when it was sad, members of the audience wept.” Such praise is
    always reserved for dhalang who are now dead. It proves that Javanese fans of
    wayang are concerned with a performance''s emotional impact, that is, with its
    ability to exert an effect upon a spectator''s mood. But the remark always surprised
    me, since I have never seen a dhalang play a scene in such a way as to create
    and sustain a tragic mood.


    Tragedy seems not alien to the tradition, but rather suppressed. The reason for
    suppression, I believe, is to become too engrossed in a performance would threaten
    a spectator''s awareness and equanimity. Even in performances of Bratayuda lakon,
    in which the heroes beloved to the Javanese are killed, dhalang persistently undercut
