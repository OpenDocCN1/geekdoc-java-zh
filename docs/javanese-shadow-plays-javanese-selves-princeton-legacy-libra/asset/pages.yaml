    tricacies of honorifics and self-humbling vocabulary, and perhaps more importantly,
    confidence in one''s ability to use them properly, are greater among people of
    superior wealth, education, and/or experience in aristocratic and other high-status
    circles. These attributes are not necessarily all of a piece. A servant at court
