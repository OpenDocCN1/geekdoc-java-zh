    Those domains are many. In the Javanese family, the father''s role is glorified
    and constrained in such a way as to make his power at the same time unquestioned
    and largely unexercised. Villagers who press their headman into particular molds
    seek to determine the nature and extent of his power over them in much the same
    way. The dissembled center—king, ritual sponsor, or dhalang—iterates the paradoxical
    effectively but absent figures of authority that the father and headman are pressed
    to become. Each of these figures should support and protect people, but in no
    way impinge on their autonomy. The spectators who impose a conventional meaning
    upon a performance of way define their relationship with the art form and with
    the dhalang in a similarly idealizing yet defensive way. Certainly, family members,
    villagers, and spectators all seek to gain certain benefits from the very power
    that they distrust. The authority of the lurah, the influence (berkah) and esoteric
    wisdom (ngelu) communicated by a dhalang in performance, are all judged at least
    potentially beneficial. The pleasure afforded by a performance of wayang as entertainment
    is also great. At the same time, however, submission to a powerful political authority,
    classically to the king, and surrender of self-conscious control, such as to the
    dhalang, constitute seductive and mistrusted conservatives, clarity, and guarded
    Javanese norms. Whether in political or aesthetic subjection to headman or dhalang,
    dissimulation of a superior’s control mitigates the impression of loss of personal
    control or autonomy. The dis self also gains a particular authority: a diffuse
    idealized highly respected position as agent both operating within and surpassing
    the world. The peculiar fascination of the dhalang in Javanese culture stems from
    this fact: he is at once a dissembled authority, one whose power is great, non-coercive,
    and worldly, and a dissembled interpreter, one who mediates between an unreal
    but distracting world, and our own.'
