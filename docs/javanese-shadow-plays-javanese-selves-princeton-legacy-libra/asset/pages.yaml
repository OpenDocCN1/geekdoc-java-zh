    Another stated reason for the frequent performance of new lakon is that lakon
    is believed to exercise a certain power over events. A lakon that recounts a hero’s
    wedding is thought suitable to the ritual celebration of a wedding the lakon will
    exert its influence to the benefit of the newlyweds. If a wayang is held for a
    final funerary ritual (one thousand days after death), a lakon describing a character''s
    admission to heaven is appropriate, since it will facilitate the similar passage
    of the soul of the deceased. More importantly, many lakon are considered dangerous.
    *Bratayuda* lakon and other lakon that depict the violent deaths of heroes are
    highly volatile, likely to bring misfortune to sponsors who request their performance.
    Better always to stick with tried-and-true, formulaic lakon that depicts no one
    will suffer any ill effects. Secondary lakon fit these requirements better than
    principal lakon that relate important and often disturbing events in the epic
    cycle. Dhalang, too, to avoid that they fear might unleash destructive powers.
    If sponsors request a lakon, a dhalang is careful to explain the danger and to
    stress that it is the sponsors who must take responsibility (tang jawab) for any
    mishap that follows.


    It is not only sponsors and dhalang who express a preference for new, rather bland
    lakon. Huge crowds will assemble to see dangerous *Bratayuda* performances held
    by villages, organizations, or other assemblies, and excitement runs particularly
    high on such occasions. *Bratayuda* performances can be performed under such circumstances
    because large numbers of people—the village as a whole, or an organization''s
    entire membership—take responsibility for any consequences that may ensue, rather
    than just a single sponsoring family. However, some dhalang mentioned that *Bratayuda*
    performances were sponsored by committees in the sixties. People saw what happened
