  md: 'potency varies individually, and some women show an interest in de-veloping
    their own spiritual power. Yet as an assumption about what underlies the phenomena
    of social life in Java, potency remains preeminently a masculine concern.


    The third point children learn as they mature in a Javanese family is that status,
    and the potency that underlies it, must be protected. I have argued that roles
    in a Javanese household are organized in such way to insulate the father from
    conflict, and that this guards the image of his authority from contradiction or
    challenge. I would suggest, furthermore, that in learning that other people''s
    behavior has implications about one''s status—or more concretely, learning that
    a father''s status depends in large part on the behavior he elicits from his wife,
    children, and others—young Javanese come to under-stand their father''s, and so
    eventually their, how relative status is constrained in encounter, and how very
    much it matters.


    There is one circumstance in which the concern for potency and status loses all
    significance. Very small children provide Javanese adults opportunities to express
    a range and especially an intensity of feelings in interaction among adults. This
    is because relative status pertains so little to young children. As soon as children
    develop an awareness of how persons fit into differential sets, they must make
    their behavior conform to the requirements their own and others'' status. An adult''s
    behavior toward them must also shift. Very young children do not yet understand
    etiquette, however, and their behavior and dependence is total, and is a version
    of respect. Even a high-status man, therefore, need not be restrained with very
    young children, because their behavior cannot compromise his status. Neither he
    nor they are susceptible to feelings of shame (isin). Some Western males shed
    self-consciousness and reserve when playing with children, but others, especially
    when confronted with a baby, grow anxious, thrown off by the apparent lack of
    social conventions. Javanese males seem remarkably relaxed around children under
    five and often appear happiest of all when playing with infants who cannot yet
    speak.


    # Potency and Fathers and Sons


    Relations between father and son are problematic because as a son matures, he
    seeks to establish his own identity and sovereignty. This'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 80 CHAPTER 2


    is not simply to impute adolescent rebellion to Javanese teen-agers, however.
    Careful avoidance of open conflict precludes much of the paternal assertion of
    authority, and adolescent reaction to it, that can make life in an American household,
    for example, tumultuous. On the contrary, the pattern of mutual avoidance and
    the son''s use of refined language grow increasingly marked as the father ages.
    Nevertheless, both behavior patterns and certain beliefs about potency indicate
    an ongoing tension in father-son relations, suggesting that a son poses a potential
    threat to the status and well-being of his father.


    Javanese believe, as mentioned above, that if a man and his wife have intercourse
    while a baby is still nursing, the father''s semen will mix with the mother''s
    milk and cause the baby to grow sickly and perhaps die. This belief indicates
    hostility between father and a child of either sex even while the child is still
    an infant. Such hostility focuses more specifically on a male child. Mothers and
    siblings often play with a baby boys penis, causing him to have an erection. This
    practice stops as the boy gets to about three. Adolescent and adult males, however,
    will tease a boy by reaching to pull at his penis and saying, “Kacuk!” (Kacuk
    means “penis,” but is used to refer to a boy’s penis, not a man’s). The boy brings
    his legs together and squirms unhappy. Ostensibly a game, this pattern must appear
    to the boy openly hostile. By the age of five or six, a boy learns to respond
    defensively to any older male who approaches him too intently.


    Javanese believe it inauspicious if a child is born on the same birthday (weton,
    the conjunction of five- and seven-day calendrical cycles) as either of its parents.
    They are particularly concerned when a son’s weton coincides with that of his
    father. In such cases, one of them is thought likely to grow sick or die (say
    that such a son should be sent to live in another family, or by magical means
    have his weton “changed.” In this belief, Javanese appear anxious that a son will
    replace his father, or that the father will weaken or kill his son. While the
    avoidance that characterizes their relations already implies some sense of potential
    conflict between them, when a son takes so “personal” an attribute as his father’s
    weton for himself, the suggestion of competition becomes too intense and some
    disjunction, either physically separating father and son, or magically distinguishing
    their weton, becomes necessary.'
