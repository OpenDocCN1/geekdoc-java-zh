  md: '# ACKNOWLEDGMENTS


    As a general rule, Javanese say “thank you” (natur nuwun) only in impersonal situations:
    in very formal encounters, or in addressing groups. True gratitude indebtedness
    cannot be reduced to stock phrases, no matter how refined. In fact, to say “thank
    you” in Java can arouse disappointment, since it implies that such words can cancel
    the bonds between people that exchange relations set up. A student muster. To
    his friends, he offers good company and whatever material gifts he can the unspoken
    promise of support thick and thin. But he never presumes that the debt he owes
    them be paid, whether materially or by the expression of thanks.


    I have been fortunate to find friends among my teachers, and teachers among my
    friends. I wish to acknowledge the debts I owe all of them, without presum that
    such debts could ever be cancelled. Benedict Anderson and James Siegel introduced
    me to the study of Indonesia, and since my first days as an undergraduate at Cornell
    I have benefited immeasurably from their insightful writings, of their classes,
    from their advice and encouragement of my own work. Terence Turner and Victor
    Turner, in addition to James Siegel, were my first teachers in anthropology, and
    they imbued the field with the sense of excitement that it still holds for me—an
    inestimable gift.


    I have turned to those same teachers times since leaving Cornell, but I have also
    benefited greatly from the advice and encouragement of other scholars I have met
    more recently. Alton Becker, Judith Becker, Donald Emmerson, Clifford Geertz,
    Hildred Geertz, Wendy O''Flaherty, Valerio Valeri, and Paul Wheatley all helped
    me formulate my ideas about Javanese culture, and to them I am deeply grateful.


    If my teachers in the United States have provided me with questions and skills,
    countless teachers in Java have provided me with the information, advice, and
    friendship that made living in Java such an enriching experience. Lest I appear
    unduly nostalgic, I should say'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# ACKNOWLEDGMENTS


    that to be a Westerner in Java occasionally has its trials. Then again, being
    a Western strikes me as a fairly arduous business anywhere, in as well as outside
    the West. Teachers and friends in Java I received with unfailing graciousness,
    I must attribute what sense I have made of Javanese culture to their wonderful
    people and generosity.


    To single out among the many people who showed me such kindness seems tedious.
    Yet I would feel remiss I was not to mention Bapak Sastrapastra of Yogyakarta,
    and Ki Dhalang Sarwasidana and Ki Dhalang Gandawijaya, of Klaten, for their invaluable
    teaching and kindness. I treasure the memory of the times I spent with each of
    them, times in which I felt, as the phrase in wayang puts it, as cool as though
    bathed in a thousand waters.


    The ethnographic literature tells us that a special bond often unites ritual initiates.
    Indonesia overlapped, at one point or another, with my own. Anthony Day, Joseph
    Errington, Barbara Hatley, Ron Hatley, Terrence Hull, Valerie Hunt, Jenny Lindsay,
    Anton Lucas, Ann McCauley, Gerry Meister, Hisako Nakamura, and Mizuko Nakamura
    provided intellectual stimulus and good fellowship during the two stays in Java
    on which this study is based. Shelly Errington conducted research in Sulawesi,
    not Java, but conversation with her has proved particularly important for all
    my thinking about Java.


    In writing and rewriting this study of wayang, I have obtained invaluable advice
    from many quarters, including many of the scholars I have already mentioned. I
    am particularly grateful to Alton Becker, Thomas Beidelman, and David Sapir for
    excellent suggestions about the entire text, and to Peter Metcalf for an extraordinarily
    close and helpful reading. I appreciate as well the comments on portions of the
    text by Judith Ferster, Susan McKinnon, Leslie Morris, and Nancy Munm.


    The Indonesian Institute of Sciences granted me research permits during both of
    my stays in Java, and I am indebted to Syamsiah Ahmad and Mr. Napituluplo and
    other members of that institute for their assistance in making my research possible.
    Mr. Hardamani and Ki Dhalang Sutrisno of the Akademi Seni Karawati Indonesia in
    Solo kindly sponsored my research in 1978-1979. My research in 1978 was supported
    by a Fulbright-Hays prectoral grant, and in 1978-1979 by a grant from the National
    Institute of Mental Health. The latter grant also provided support during the
    writing of my dis-'
