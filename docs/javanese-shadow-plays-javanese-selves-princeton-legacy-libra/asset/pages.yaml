  img_proc: true
- pgno: 242
  md: '# THE PLEASURES OF THE PERFORMANCE 213


    fist-fight, is disgraceful no matter what justification either party may have
    for anger. Hostility and bitterness are always thought dissembled until they recede
    from consciousness, or at least from view. The relentless pressure for smooth,
    polite interaction usually suffices to prevent their overt expression. If it does
    not, people often simply break off all relations.


    When restraint gives way to insults and then violence in wayang, etiquette''s
    compelling force is abrogated. Spectators'' insatiable taste for battles, both
    verbal and physical, must stem from this exciting contrast with their own experience.
    Nevertheless, even in battle, the structures of status must be maintained: characters
    should battle in a series of single encounters with adversaries of equivalent
    rank, and a king must never be struck above his shoulders. The world of wayang
    suggests, therefore, departure from the principles of interaction that are binding
    in the world of humans. Yet at the same time it asserts the capacity of status
    to determine relations more surely than it can in real experience. When violence
    does break out in Java, as it only rarely does but then with astonishing vengeance,
    issues of status and honor may well underlie people''s acts, but etiquette falls
    by the wayside.


    # RESISTING THE PERFORMANCE


    A performance of wayang may suggest tensions within the basic assumptions of Javanese
    culture, but it is unlikely to draw out the implications of those conflicts. This
    lack of interest in developing a specific problematic contravenes Western criteria
    for great drama—but that is beside the point. I remark upon the contrasts between
    Javanese performances and Western aesthetics not to criticize the former, but
    rather to raise questions about the nature of Javanese aesthetics. The lack of
    a sustained problematic is interesting because it can be linked to a broader issue:
    the ways in which Javanese deliberately insulate themselves from the impact of
    wayang, both in their reactions to a performance and in their commentary upon
    the tradition.


    Audience''s tastes in lakon already point to a curiously defensive or resistant
    attitude toward wayang. I have mentioned that the ethical nuances intrinsic to
    the Mahabharata are little developed in wayang. The inclination to reduce the
    complexity and dimensions of lakon is'
