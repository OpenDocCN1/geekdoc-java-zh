    Intimations of tension between fathers and sons are common to so many cultures
    that it may seem superfluous to illustrate the point once again in the Javanese
    case. The interest in doing so lies in ob-serving the particular domains in which
    Javanese behavior makes such tension apparent. The conflicts we deem oedipal seem
    to be played out in life in the stress on appropriate speech and gesture, and
    in the disjunction of weton and ngèlèmu, shows how importantly these figure in
    the definition and maintenance of selves.¹² A father''s identity and potency depend
    on the maintenance of certain critical disjunctions: between his own and his wife''s
    roles, between his own and his children''s—particularly his sons''—leton and ngèlèmu,
    and between the impression of his superior potency and their subordinate status.
    The latter impression is constructed out of his own and their studied patterns
    of interaction and avoidance. As children grow up in a Javanese household, they
    understand from just these patterns the nature of authority and how to deal with
    it, that is, how to defer to, benefit by, and/or elude it. Similar patterns then
    mark their relations with other figures of authority, among them the village headman,
    the territorial spirit, and the dhalang. In fact, as the following chapters are
    intended to demonstrate, all mediations of self and other in Java, whether that
    other is a person, an aesthetic impression, or any type of sign, are colored by
    these contradictory impulses to depend upon and to resist what is external to
    the self, through its simultaneous idealization and control.


