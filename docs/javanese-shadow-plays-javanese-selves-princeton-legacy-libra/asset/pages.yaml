    # Ritual Celebrations as Status Displays


    The ability to attract a great many réwang and guests to a ritual celebration
    indicates people''s power, much as the ability to elicit respectful speech and
    behavior does in other interaction. Although style in personal encounter is dyadic
    and fairly private, a ritual celebration is an extravagantly public act. Nets
    of exchange relations, as well as estimations of relative status, become manifest
    in these brief but dramatic periods of ritual activity. And in contrast to the
    great normative stress on humility and a self-effacting manner in Java, and despite
    the constant talk of ritual celebrations as expressions of mutual help and respect,
    holding a ritual celebration invariably implies some attempt to maximize impressions
    of one''s wealth, status, and above all, authority over other people. Suddenly,
    all of a family''s efforts to assert their status, and all of the particular relations
    they enter into others, come into sharp focus. The corporate vagueness that Clifford
    Geertz has remarked upon in Javanese villages (C. Geertz 1965) is counterbalanced,
    on the one hand, by the rigorously marked system of encounter in day-to-day life,
    and on the other,'
