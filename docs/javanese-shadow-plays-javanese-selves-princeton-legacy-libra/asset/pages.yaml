    for an external authority, or it reestablishes an external authority over the
    self.


    In this way, vows draw on attitudes toward language that are instilled in children
    as they grow up in a Javanese household. Because refined language is imposed quite
    arbitrarily on children at about the age of five or six, and it stands as the
    clearest concurrent signs of the changed relations they must enter into with their
    fathers, language and the father must become for them two aspects of a single
    authority. Children must come to see language not as an instrument of their self-expression,
    but as an agent apart from them they must use with care. The feeling that language,
    especially refined language, has a range and complexity far beyond their own competence
    persists for life. Most Javanese claim fervently that they cannot speak krama
    well, that there exist areas of it that are thoroughly obscure to them. In expressions
    of modesty, these protests nevertheless point up a belief in language''s independent
    authority, over which one can never be truly master.


    In seeing their speech people see themselves vulnerable to language. To free oneself
