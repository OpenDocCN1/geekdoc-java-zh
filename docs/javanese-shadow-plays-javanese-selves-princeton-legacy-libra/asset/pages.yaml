    by making their own speech effective in the world, so these alternate sources
    of power are defined in large part by reference to language.


    # Seeking Wealth


    In contrast to asceticism, which is a version of sacrifice said to be directed
    to God, Javanese conceive of another, monstrous form of sacrifice, in which one
    gains selfish ends by making secret deals with spirits. This Faustian practice
    is usually called “to seek wealth” (golek pasugihan), and the spirits with which
    one trafficks are called inhuk and but iyo.² A person goes to some special spot,
    usually in a cemetery, summons a spirit, and deals with it. In return for providing
    people with great wealth, the spirit will take the lives of children and other
    one. An alternative or additional effect is that people will become the spirit’s
    slaves after death and join the armies of Nyai Rara Kidul, the dread goddess of
    the South Sea. Bu Cerma explained, “They said the inhuk hops on your shoulders
    and says, ''Okay, I supported you all these years. Now you support me.''” Whereas
    any wealth one gains from ascetic exercise comes directly from God and therefore
    implies no one''s loss, wealth gained from an inhuk comes out of the hands of
    other people. If people come home from the market with less than they thought
    they had, they realize that an inhuk has gotten away with some of it and taken
    it to its clients. Any person who enjoys particularly good fortune, especially
    sudden good fortune, will be said to have gotten an inhuk. Neighbors, Bu Cerma,
    had whispered such things about her and her husband when Pak Cerma was such a
    successful dhalang in the early sixties, especially after the death of their five-year-old
    daughter. Having reported this hurt and outrage, she went on to state as common
    knowledge that the people with a little store up the road enjoyed the services
    of a but ijo.


    To seek wealth (golek pasugihan) perverts relations of exchange. In fact, it is
    a demonic version of asceticism, a negative form of sacrifice that contrasts with
    asceticism''s positive form. ... it implies enjoying material pleasure at the
    expense of those people whose money is stolen and of those kin whose souls are
    snatched. One does not win potency


