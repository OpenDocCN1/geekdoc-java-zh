  md: '# ON JAVANESE INTERPRETATION 255


    ipate happy events would diminish their likelihood and/or cause the disppointment
    and disarray. Indications of imminent fortune, however, would prompt a person
    to exercise caution. One morning when Pak Cerda planned to travel to Klaten, he
    decided against it because a disturbing dream during the night had made him believe
    any movement outside the village ill-advised. Dreaming of a tooth falling out
    may prompt a person to do ascetic exercise in order to avert its significance.
    In any case, the accuracy of an interpretation can only be determined with hindsight.
    "Oh yes," dreamer think to themselves at some future time, "this must be what
    that dream was about."


    As I have said of obscure language in wayang—meaning that is held in reserve—is
    often thought more powerful than signification in immediately intelligible sense.
    Clear connection to the dreamer''s experience, or one''s particular desires, vitiates
    a dream''s significance. Immediate intelligibility indicates a dream''s origin
    in experience, proving that it has no progressive referential function. A dream
    is dismissed as "the flower of sleep" (kembang turut). Elements of a dream that
    are obscure, suggest greatest significance. Furthermore, obscure signs imply the
    dream''s origin in an external source. The dreamer then acts as a conduit through
    which messages flow, and interpretation becomes a manner of appropriating those
    signs.


    Specifically, interpreting a dream enables a person to achieve, or at least to
    achieve, some mastery over events, whether through ascetic action or perhaps just
    a spiritual reading. The dreamer of significant dreams has become empty of personal
    desire and memory, just as a jung tuwa must in order to make himself a conduit
    to potency and powerful speech. Actually, the more obvious analogue to the dreamer
    is the preawang, whose consciousness and voice have been usurped by an external
    agent, thereby enabling him or her to provide truthful messages. In the case of
    dreams, truthful messages are predictive ones, and if the messages disaster, the
    dreamer hopes it is only provisional and still subject to manipulation.


    The Javanese interpretation of dreams brings out two points: that their predictive
    significance depends on their insulation from the dreamer, and that they are of
    interest to the degree that they enable a person to control events by anticipating
    them. This second point, that one tries in Java to take active control of signification,
    was illus-'
