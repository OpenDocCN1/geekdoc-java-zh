    In the second, the wong tuwa controls both his own voice and the second one, seized
    by the spirit. Potency means both self-control and control of others. But as in
    interaction among humans, control means above all the ability to control people''s
    voices and actions through the effectiveness of one''s own speech.


    The importance of voice is that it is the point of intersection between batin
    and the world. Batin is a constituent element of the self that is not subsumed
    in interaction: the potency of a person batin can be sensed only through its effects.
    Language, as an old puppeteer was fond of saying, “is the messenger of batin,”
    and voice is the instrument of language. Voice, therefore, is the means of expression
    in the manifest (lair) world of the imperceptible realm of batin. The transformation
    one seeks in asceticism is to use language to express deference and remaining
    vulnerable to others'' speech, to being in a position to manipulate power and
    language in the same breath. It is for this reason, I think, that when Javanese
    describe a dhukun, wong tuwa, or any other authoritative figure of great potency,
    they may extol over the allure of his person, the fear and respect aroused by
    his presence, the instances in which he has proved himself invulnerable to attack.
    Invariably, however, they state that “the sound [of his voice] is potent” (unile
    mandi). Rather than enter into perverse dependence upon spirits, he uses his potent
    speech to exert his authority over.


    # Mediums


    To Javanese, wong tuwa and mediums (prewangan) differ radically. The former are
    highly respected, whereas the latter are much aligned. It was extremely difficult
    for me to collect information about prewangan, particularly to observe them directly.
    People were so anxious to steer me away from them that they would not reveal where
    any were to be found. The idea of “disinterested” questions is foreign to most
    Javanese. If I wanted to locate prewangan, clearly I wanted to avail myself of
    their services. Rather than have a hand in my petition, friends would invariably
    launch into an explanation of the uselessness of consulting prewangan. During
    two years of fieldwork, I managed to meet only five, three of them clustered in
    a single village in the mountains and locked in such intense rivalry that I was
    able to speak at length with only one of them. (As with all things suspect and'
