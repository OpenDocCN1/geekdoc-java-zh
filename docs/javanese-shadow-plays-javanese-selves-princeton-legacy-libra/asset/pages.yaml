    By speaking of patterns of resistance in people''s reactions to way, I do not
    mean to suggest their lack of interest. Just the opposite; resistance aroused
    because of the art form''s effectiveness. The dramatic illusion, particularly
    any sad or disturbing feelings it might arouse, threaten a spectator''s capacity
    to el: to remain in conscious control of oneself, and to resist the control implicit
    in a dhalang''s hold upon one''s interest and feelings. To support this contention,
    I must open an excursion on Javanese understandings of consciousness.


    # CONSCIOUSNESS, FORGETFULNESS, AND PLEASURE


    Éling means "to remember" and "to be conscious." It can take no direct object.
    (To specify an object root must be given the affixes ke- and -an, forming kélingan,
    a passive form.) When informants said the phrase, which is common, "You must éling"
    (kudu éling). I often tried to ask what it was one needed to be mindful of. The
    most common response was "God." Further commentary suggested an ascetic''s withdrawal
    from mundane affairs, his attention focused on God in


    > I was prompted to examine Javanese ideas of consciousness by James Siegel''s
    analysis of the Acehnese term akal (Siegel 1969). Siegel''s illuminating work
