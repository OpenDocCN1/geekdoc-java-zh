    even ingenious. A point invariably made is the hero''s battle against the fanged
    monster, Buta Cakil, midway through the performance represents a man''s struggle
    against his passions. Having subdued and killed them, he is ready to prepare himself
    for the acquisition of ngèlmu. Several informants spoke in high degeon of “young
    dhalang” who conclude the battle with the monster''s escape, not their death.
    This proves their failure to understand the “real meaning” of the scene, the contest
    with one’s impulses. Even aside from the validity of the interpretation, which
    I find questionable, I never saw a performance in which the monster did not die,
    and my informants'' excitement always seemed to be misplaced. The conversational
    landscape in Java is, however, strewn with the bodies of such puppet. The dance
    performed at the end of a performance by a wooden puppet, called a wayang golek,
    is glossed as a signal to the spectators that they must now “look for” (golek)
    the real essence of the performance, vise., its moral instruction.


    If the exegesis of lakon is stuningly reductive, this reading of a performance''s
    structure is sheer addition, lacking any necessary connection to what happens
    in a particular performance. The result—and I believe it is the aim—in either
    case is to put a stop to associations to the performance. Every performance becomes
    perfectly equivalent to every other. To take the progress of all as Everyman''s
    passage through life accomplishes this closure with particular efficacy, since
    it limits the meaning of the whole to the experience of only one person, at least
    as an ideal. Exgetes are saved from the implications of any particular lakon,
    and from any relevance of wayang to the rest of life except as expressed in the
    most domesticated of homilies. They are saved, in a word, from exegesis.


    The willed poverty of wayang exegesis strikes me as a defense against the intricacies
    of analysis, judgment, and feeling that a more nuanced consideration of the corpus
    of stories would entail. Attitudes toward the historical status of wayang stories,
    in contrast, do not indicate this reductive definitiveness, but rather its opposite,
    a generalized agnosticism. The results are much the same.


    There is a curious vagueness about the status of the Mahabharata stories, which
    are the basis of most wayang lakon. People speak of lakon alternatively as sejarah
    or crita. The first term corresponds generally to English “history,” the second
    to “story.” The distinction in'
