    The difficulties over patronage that arose between Pak Lurah and the inhabitants
    of Karanganom reflected in his impulse to keep his relationships clear-cut and
    businesslike. Daily-wage labor minimized his obligations to people while assuring
    him a maximal profit. The villagers, or some of them, would have liked to see
    their dealings with him more socially embedded. Patron-client relations would
    have not only given them a share of the yield of Pak Lurah''s lands; they would
    also have permitted the villagers to presume upon his munificence. As luxury goods
    become readily available in Java, however, class displaces patronage as the end
    sought from one''s investments. Pak Lurah''s prestige as well as his pleasures
    depended on the huge sums necessary to maintain him and his family in the opulent
    style of the new consumer society. So he was anxious to obtain the maximum cash
    income he could, for much the same reason, a subordinate was increasingly likely
    to opt for opportunities for cash employment, rather than the long-term security
    of patronage ties.


    But people did not seek only financial advantages in their dealings with Pak Lurah.
    Certainly, his extravagant wealth made them covetous. A lurah''s responsibilities
    as “father” of the community, how'
