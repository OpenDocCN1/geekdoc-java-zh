    The secrecy that surrounds vows may be linked to the obfuscation of exchange that
    vows suggest. The power of a vow may lie in part in its nature as a concealed
    exchange: it is speech that may or may not be addressed to anyone, may or may
    not even be spoken, may or may not be effective, yet that will, if not loosened,
    turn back upon its source, causing him or her misfortune. A vow is one''s own
    speech (unié dhivé), but with the peculiar twist that it is directed to no listener
    and its meaning binds itself, not others. It is also a secret deal: its secrecy
    makes it dangerous, no one will be able to help recall it; and the very vagueness
    about who or what hears and notes a vow makes it the more imposing. Perhaps it
    could be linked to “seeking wealth (golék pasughan), with the critical difference
    that one puts one''s future in hock, rather than signing away one''s own and one''s
    kin''s souls. In any case, the importance ascribed to the public nature of the
    release from the vow (luwaran kaul)—that it be witnessed, that the witness attest
    to the fulfillment of the vow, and that the witness accept some form of remuneration—this
    emphasis must depend on its opposition to the private and (in a way I will explain
    in a moment) almost perverse nature of the original statement. The public ceremonial
    of luaran kaul replaces the shadowy contract of the vow with clear, completed
    and so neutral transactions. It replaces a vague exchange with two other, more
    ordinary types of exchange: the long-term and sanctioned changes among all members
    of a hamlet ceremonial group that slametan brings into play, the momentary and
    so particularly clear-cut exchange with a seller at a market.


