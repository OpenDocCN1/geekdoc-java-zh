  md: '# LANGUAGE, POWER, AND ASCETICISM 29


    ward, and unrefined. One uses it with intimates and subordinates, and in anger,
    when joking. Krama is more elegant and polite. It is suitable for formal occasions,
    and in speaking to people one knows only slightly or to whom one owes deference.
    Madya (also called krama madya) is a less refined manner of speaking than krama,
    but it is also less familiar than koko. It is used in several types of encounter:
    with among persons of low status; with people one has known a long but with whom
    one is not truly intimate; and with people whom one is close but to whom one must
    still show respect.


    Speech levels are distinguished by the use of one or several vocabulary sets.
    The vast majority of words in Javanese are invariant forms. The word for “tree,”
    wit, for example, is used without modification in all three speech levels. But
    in addition to this invariant vocabulary set, there are words and affixes that
    differ in form though not in sense, the different forms expressing differing degrees
    of refinement. A number of words and affixes follow the basic opposition between
    ngoko and krama. In speaking ngoko, one speaks of a letter as layang, whereas
    in krama, one says serat. There is also a limited number of words that “this”
    is expressed iki in ngoko, niki in madya, punika in krama. When no distinct madya
    exists, a person speaking madya selects words from other sets. For example, one
    might use layang or serat in a madya utterance, there being no madya term for
    “letter.”


    Two vocabulary sets are not linked to a specific speech level. Krama andhap (Literally,
    “low krama”) is a set indicating the humbler status of the speaker or of a third
    person relative to the person addressed or referred to. Krama inggil (literally,
    “high krama”) indicates great respect for one interlocutor or a third person.
    Krama andhap and krama inggil can be used when speaking in any of the three speech
    levels. They are not used solely in the speech level krama.


    Javanese themselves usually speak of speech levels not with the terms ngoko, krama,
    krama andhap, and krama inggil, but rather with the terms omong Jawa (omong: “speech”;
    Java: “Java, Javanese”) for ngoko, and basa (“language”) for any mixture of vocabulary
    sets, that is, any usage that includes madya and/or krama vocabulary. These terms
