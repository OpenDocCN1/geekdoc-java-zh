    headmen and villagers all develop new expectations and wants as consumer goods
    flood the market and definitions of prestige and status in Java shift. This does
    not mean that conceptions of spiritual potency and the powerful center, or centers,
    evaporate. Rather, they are construed in new ways, as they apply to new contexts.


    The relations people entered into with their headmen in three villages in the
    area where I did my research illustrated all these tensions and contrasts. The
    headman in the first village I will discuss, Karanganom, fulfilled the conventions
    of a potent leader least effectively, and was by far the least popular and least
    respected of the three. The second headman was greatly admired as a potent elder.
    The third had an effective and original mediation of “traditional” and “modern”
    versions of leadership.


    # PAK LURAH KARANGANOM


    A kalurahan is an administrative unit, usually translated “village,” made up of
    several hamlets. At the time of my stay, Karanganom had a population of close
    to three thousand inhabitants. The former lurah was removed from office in 1965,
    due to some sympathy he had shown for communist-affiliated organizations. A powerful
    tobacco trader in the area was able to make his nephew “caretaker” lurah, in such
    a way as to make his son was elected.² It was this son who was lurah during my
    stay in the village.


    Pak Lurah presented himself, to any assembly as well as to an outsider, in such
    a way as to emphasize his interest in modernization. Soon after his election,
    he supported several irrigation projects in the kalurahan, some small-scale (proving
    water conduits to the fields), one large-scale (the construction of a dam and
    waterworks connected to it). Indeed, when compared with the accomplishments of
    other Javanese lurah, Pak Lurah Karanganom’s record looked good. He was active
    and energetic when other lurah in Java are simply ineffective. In concerning himself
    with irrigation, building projects, and village


