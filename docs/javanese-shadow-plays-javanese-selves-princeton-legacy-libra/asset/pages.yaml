    When Javanese speculate on what impels spirits to take possession of people, they
    often attribute to them the characteristics of naughty children or dissatisfied
    and rather ill-mannered adults. For example, a spirit may feel hungry or thirsty,
    so it takes possession of someone in order to force the people into giving it,
    which are its food and drink. It may simply be feeling lonely, or perhaps impish,
    or insulted by some human''s thoughtlessness. That spirits are bothersome and
    truculent follows from their origins. They are the spirits of stillborn babies,
    or of people who died suddenly, violently, and “before their time,” before the
