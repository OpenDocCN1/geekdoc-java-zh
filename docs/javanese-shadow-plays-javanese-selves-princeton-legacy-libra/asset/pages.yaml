    # NGÈLMU AND KÉRATA BASA


    Though yang stories and ngèlmu threaten the unwary with a dispersal of self, external
    objects and knowledge are not necessarily pernicious. Just as powerful heirlooms
    (pusaka) exert an equivocal power, so may any type of ngèlmu is an aid to those
    who know their potency adequate to it—provided, that is, that they can exercise
    control over it. Two kinds of wisdom much appreciated by Javanese, the displays
    of ngèlmu a halhal often in a performance and the device of kérata basa alluded
    to several times already, illustrate what such control consists of: the subjugation
    of phenomena by connections made from obvious sense.

    A dhal can show off ngèlmu in performance in a variety of ways. The punakawan
    Pétruk''s homiletic discourses on propriety and honesty are termed ngèlmu, are
    as much more esoteric accounts about the immaterial world. Many displays of ngèlmu
    repeat the correspondences between the cardinal points, gods, colors, traits,
    etc., that are a mainly of the genre. Another favorite form is a bantah,, which
    means literally “debate” but is actually an exposition of any doctrine through
    a kind of catechism. Ki Anom Suroto gave the most impressive exposition of ngèlmu
    I have seen in his rendering of the classical bantah Parta déwa. In it, Pandhita
    Durna tries to credit a mysterious newcomer to Ngamarta, a certain Parta déwa,
    who has been given the throne by the sons of the Pandawa following the disappearance
    of their fathers. Durna challenges Parta déwa in a series of questions as what
    is associated with the number of fingers on his hands. In a countdown from ten
    to one, Parta déwa names the following series: ten pengajaran (meaning unclear);
    nine watak (“character traits”); eight rules of priestly conduct; seven gods;
    six types of water; five kinds of bayu (“wind”, “energy”); four kinds of windu
    (“eight-year cycles”); three types of light; two elements in any set of opposites;
    and one question, which he puts in turn to his challenger. This question leads
    to the exposition of five plus four plus eight more categories, and this non-classical
    section concludes with the manipulation of the figures to arrive at the magic
    date of 17/8/45.'
