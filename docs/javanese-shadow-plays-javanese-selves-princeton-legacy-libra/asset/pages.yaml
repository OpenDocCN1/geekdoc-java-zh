  md: 'rived from a root, réwang, meaning both "servant" and "friend."

    The ranks of those ngréwang are filled by relatives, neighbors, and friends. They
    can be divided into three groups: 1) the women who join in the cooking; 2) the
    men who participate in setting up a ritual (*tarupan*), a job that often involves
    removing sections of the house, extending the root, setting up mats or chairs,
    decorating entrances, and if there is to be a performance, setting up a stage,
    etc.; and 3) the young people, of either sex, who perform the above functions
    and guests tea, snacks, and food before and during the celebration. Except for
    a few people who perform the menial functions (e.g., the man who boils water for
    tea, a grueling and endless chore), none of people are remunerated for their labor.
    Instead, they work in fulfillment of the Javanese ideal of working cooperatively
    (*gotong royong*, literally, "to bear together"). Their reward lies in the assurance
    that they nduwé gawé, they will be able to count on people whom they have helped
    to assist them in turn. Javanese take great pride in this expression of solidarity
    among neighbors and kin.


    Despite pressures to dissemble disparities in status among fellow villagers, almost
    all social relations in Java tend to demonstrate such disparities. While informants
    informally choose to stress the egalitarian side of mutual cooperation, saying
    that who does what is a matter of chance, in fact the distribution of chores among
    réwang reflects such status considerations. Among the many women who gathered
    to cook in the home of Mas Tarno, the rice trader, at the time of his daughter''s
    wedding, his oldest female relative guarded the supply of uncooked rice. This
    is thought a particularly important task, one beating the dignity of an older
    person, because there is some fear that the guests will consume more rice than
    anticipated, or that mystical action by one''s enemies will cause the rice supply
    to diminish precipitously. Another high-status female relative coordinated activities
    in the kitchen, distributing chores as she saw fit. There seemed little differentiation
    by status among the many jobs of preparing snacks and food. But another distinction
    by status was apparent in the amount of time a woman spent in Mas Tarno''s kitchen.
    Poorer neighbor women


