    strategy neutralizes the potential of the superiors'' language to constrain their
    own acts, even as it maximizes that language''s capacity to ensure their prosperity
    and well-being.


    This program for resisting others'' speech should complement a program for making
    one''s speech effective. Studying with a guru or undertaking ascetic exercises
    in order to gain potency means facto potent language. Magical formulas (rapal)
    constitute a form of language in which the world becomes susceptible to a vulnerability
    to a superior''s language by enabling people to master in their own the potency
    of language. A particular kind of rapal, aji pembungkeman, illustrates the point
    well. Mbungkem means “to cover someone''s mouth” (in order to prevent him from
    speaking). Pak Cerma told me that aji pembungkeman he knew was effective in two
    ways: it prevented beasts from eating you, by keeping their jaws shut tight; and
    it prevented adversaries in a court case, by making them unable to speak. Wild
    beasts and court cases seem to almost equally rare in contemporary Java. But the
    equation of words in court with violent attack implies a violent potential in
    speech, and the existence of such a rapal suggests the ability of potent language
    to protect one from either. Rapal such as this are not communicative. They imply
