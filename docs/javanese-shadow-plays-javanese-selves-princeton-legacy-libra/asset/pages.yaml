  md: '# ON JAVANESE INTERPRETATION 251


    This is something of a white rabbit pulled out of Indonesian displays of mystical
    rhetoric: it is the date of Indonesia''s independence.⁵


    The significance of this demonstration lies not in the content of the words, many
    of which were unintelligible to the spectators, and are so even to dhalang. It
    lies rather in the display that the scene affords of the dhalang''s mastery. The
    dhalang names a vast array of phenomena that lack any connection among themselves.
    Order is not discovered within them, but is instead imposed upon them, through
    the device of the countdown. In this respect, the *bantah* resembles the entire
    performance, in which a story is ordered through the imposition upon it a series
    of set scenes (pathokhan). The countdown, furthermore, can organize the material
    so effectively only because the dhalang reels off all the categories so fluently.
    The routine rules for its power not on the subtlety of any analysis it makes of
    the world, but rather on the assertion of the dhalang''s indomitable mastery.


    Kéra basa constitute a system of linguistic glossing, the workings of which are
    less sheer arbitrary than the imposition of order upon the diverse quantities
    in the *bantah Parta dewa*. But especially when intended seriously, kérata basa
    also illustrate the tendency to assert meaning by imposing associations on and
    among words quite arbitrarily. Some examples of kérata basa have been provided.
    The device depends on dividing a word into syllables, then fitting other words
    containing those syllables in a phrase that illustrates or is otherwise connected
    to the meaning of the original word. For example, the word *dongèng* (“story”,
    “legend”) is separated into do and ngèng, and glossed *Dipaido*, *kèngng* (“You
    may disbelieve it if you like”).⁷ Another name for the practice, *jarwa dhosok*
    (jarwa, “to clarify”), “to render literary Javanese into popular speech”; *dhosok*,
    “to push, force”), shows that the device does not claim authority, and the effect
    sought is often humorous or witty, as in the risque of the kérata basa for “penis”
    given in the preceding chapter. Nevertheless, this etymolog plays a much more
    important role in Javanese culture than popular etymologies in English.⁶


    There are dozens of standardized examples of kérata basa familiar


