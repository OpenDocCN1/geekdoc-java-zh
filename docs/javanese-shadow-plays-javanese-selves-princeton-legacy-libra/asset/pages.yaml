    Except in the rather specialized instance of the ruwatan, the dhalang does not
    usually accomplish a specific ritual purpose (though he can help sponsors free
    themselves from vows). Putting aside speculation, which must remain speculation,
    about the dhalang’s “shamistic” origins, I think it possible to see in his speech
    a substitute for the sponsors'' own voices. Once again, the substitution depends
    on relations of exchange. The money sponsors pay a dhalang is the most obvious
    element in this exchange, but it is not the only one. Sponsors must also provide
    dhalang certain ritual offerings (sajèn), which are dedicated to God, Muhammad,
    the dhanyang, and other spirits, and placed near the screen during the performance.
    The dhalang takes these offerings in the morning. One dhalang, speaking of the
