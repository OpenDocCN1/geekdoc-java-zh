    was also disputed, though the identification was often made. A related issue was
    whether or not a dhanyang is the spirit of a once-living person. A few informants
    identified the dhanyang of Java''s great volcanoes as the spirits of the Hindu-Javanese
    gods, banished there on Java''s conversion to Islam. Others said instead of the
    spirits of Java''s nine Muslim proselytizers (wali sanga) inhabited those peaks.
    As for the houseyard, some among informants who attributed dhanyang to every yard
    identified the miscarried feasts that are buried outside the front door.


    Vagueness about the origins and distribution of dhanyang is less surprising than
    the contradictory impressions of their intentions. Many people expressed the rather
    startling view that dhanyang are tut spirits who do only good, or at most harm
    only people who deliberately provoke them. Numerological calculations (petungan)
