    Kurawa cousins. Senawangi moves the action from Ngastina to Pringgadani, but otherwise
    follows this formula very closely. The novelty of the names and a few of the incidents
    that transpire in such lakon give an impression of “creativity,” but the fundamentally
    stereotypical shape of the lakon makes it in no way tennious or startling.


    I have used the word “creativity” here and “original,” above. The Javanese word
    for “original,” *asli*, is a borrowing from Indonesian. It cannot be used in the
    sense I mean here, because it connotes “place of origin or source,” not “imagativeness,”
    as it may in English. (A dhalang asli, incidentally, refers to a dhalang descended
    from many dhalang.) “Creative” is sometimes rendered *kreatip* in Indonesian now,
    and educated Javanese sometimes avail themselves of the term. What they mean by
    it, I think, is the Javanese term with which most people would praise a dhalang,
    namely pinter, which means “clever,” or “shrewd.” The term would not be applied
    to a dhalang who came up with entirely unprecedented lakon. Nartosabd’s experiments
    with biographical lakon, really just a selection of key moments from principal
    ones, were considered by a great many people. Nartosabd himself told me that he
    created such lakon only at the urging of some influential friends, and that he
    himself preferred to stick to the classical repertoire.


    Good sangsit means above all sangsit that does not counter any of the pathokan.
    By conforming to the essential structure of the pathokan, and further, by conforming
    to the usual overall order of scenes,'
