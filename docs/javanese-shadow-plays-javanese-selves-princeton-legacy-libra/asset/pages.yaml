    # PLEASURE AND FOCUS IN JAVANESE MUSIC


    To attend a performance of wayang waging combines what I have called sensual and
    political understandings of pleasure. Both are translated into a constant play
    on degrees of focus. The gamelan accompaniment to a performance illustrates this
    changing focus especially clearly, and since it plays such an important role in
    the varying impressions a performance of wayang makes upon its spectators, I will
    begin this discussion of wayang’s aesthetics by reference to its music.


    Gamel integrates a great variety of musical lines in shifting degrees of aural
    clarity. Judith Becker points out that melodic line was not originally essential
    to the formulation of Javanese musical pieces (gendheng) (J. Becker 1979). Instead,
    principles of gong structure, under which the coincidence of gong marks off sections
    of repeating cycles, each gendheng''s organization. Samsams, it is true, speaks
    of an “inner melody” in Solanese gendheng (Sumarsam 1984). But although this musical
    line is present to the play of the players, no single instrument plays it. Judith
    Becker contrasts this Solanese tradition to the Jogiananes one, where the formal
    gong structure is more clearly evident. In either tradition, as one goes through
    the series of different rhythms, and from one gendheng to the next, the balungan
    or skeletal line (also referred to in English, somewhat misleading, as “nuclear
    melody”) becomes first increasingly clear. This is because of changes in “rhythm”
    (wirama), each one of which indicates a different ratio of strokes on the instruments
    that play the skeletal line to strokes on instruments that play embellishments.
    As one passes from wirama one to two to four, which like shifting gears, the strokes
    on the saron and slent, which play the skeletal line, become rarer. This permits
    the other “inner” or embellishing instruments—the gender, gambang, clepung, and
    rebah, each of which has a highly distinctive tonal quality—plus the female singer
    (pesinden), to superimpose increasingly long and complex variations. The result
    is greater aural richness and less aural clarity. A wealth of embell takes precedence
    over any clear line. In Solo, especially, the embellishing instruments simply
    take over, playing such a variety of almost autonomous varia-'
