  md: '# 190    CHAPTER 7


    tators lack the musical sophistication to pass judgment on this aspect of dhalang''s
    performance. The beauty of his voice, however, figures prominently in public appreciation
    of a. A powerful voice, capable of holding the sustained notes of the suluk and
    covering an extended range from high to low registers, wins a dhalang great fame.
    One of Jogja''s top dhalang is notoriously lacking in dramatic skills—his stories
    rarely make sense whatsoever—but the sumptuous beauty of his voice, plus the musical
    skill he demonstrates, put him much in demand. Shear beauty of tone seems to matter
    less than the technical virtuosity with which a dhalang sings the ornamented lines
    of the suluk, although it''s true that a very nasal tone can seriously diminish
    a dhalang''s success. Ki Nartosadhno''s voice is not the purest in tone, but is
    probably the most flexible among those of current dhalang, and it is one reason
    for his great popularity.


    # Sanggit


    The third major aspect of a dhalang''s skill, his sanggit, could be translated
    roughly as dramatic skill. It concerns, essentially, the way a dhalang mediates
    two constraints upon his performance: the required scenes (pathokan) that structure
    every performance, and the story (lakon), which is the outline of the story he
    presents. The lakon may be traditional or it may be a dhalang''s invention. Sponsors
    may request a particular lakon at the time they engage a dhalang to perform, they
    may wait until the dhalang is about to perform before making the request, or they
    may defer to the dhalang''s own judgment. It is a point of pride among dhalang
    to be able to perform any lakon requested without reference to any notes or aids,
    though dhalang often keep brief written synopsis of dozens or even hundreds of
    lakon at home. I was frequently astonished by the ability of some dhalang to recall
    a moment''s notice the complicated, interwoven lines of a great number of lakon,
    including the order of court scenes in which the performance would be organized.
    But no matter what the lakon, the pathokan can be altered only by the omission
    or inclusion of certain scenes, never by the wholesale revision of the performance''s
    shape.


