    Other speakers who follow may choose to touch on other topics, perhaps including
    advice appropriate to the ritual occasion. But they, too, often speak on behalf
    of the sponsors in thanking guests for their attendance and apologizing for any
    shortcomings. The moderator thanks each speaker on behalf of the sponsors'' name,
    he invites the guests to eat their fill without feelings of shame or retic. He
    voices the sponsors'' thanks and apologies yet before the guests leave. If a performance
    is included in the agenda, he urges the guests to stay until its completion. All
    these remarks, those of the moderator and those of other speakers, while they
    may be embroidered, nevertheless fall into what Pak Bayan Krama referred to as
    "dead words." A speaker should never stray beyond the range of topics and sentiments
    appropriate to the occasion.


    Sponsors do often feel themselves inadequate to the task of addressing their guests.
    Many Javanese lack the ability to speak in the well-tuned, flowery phrases thought
    suitable to public speaking. The rhetorical ability of sponsors is actually irrelevant
    as is their emotional state at the time of the ritual celebration. Never do sponsors
