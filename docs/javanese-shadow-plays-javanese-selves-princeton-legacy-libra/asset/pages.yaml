    # PATRONS, SPEECH, AND AUTHORITY


    Two issues then converge in the subservience of patrons and clients. One concerns
    patrons and clients, the other fathers and sons.


    In Java, people who are without means have traditionally held the option of throwing
    in their lot with a person of superior wealth, status, and power. In doing so,
    they compromise claims to status they make on their own. Any such claims they
    would make would have to be phrased in terms of their privileged relations with
    some powerful figure. When I spoke to Mas Sulis, Pak Lurah Karangan''s night watchman
    and factotum, he lay much stress on the fact that he alone sharecaprok Pak Lurah''s
    land. This turned out to be true. Pak Lurah granted Mas Sulis more favors than
    any other person in the village, but a few other men worked his salary lands (lungguh)
    at times. They, however, minimized the number of people who enjoyed such opportunities,
    reserving for themselves the prestige of a special relationship with Pak Lurah,
    a fact that was essentially demeaning to their status, their dependence, was turned
    to opposite, or at least less compromising, effect.


    At the same time, people who have become dependents of an important person gain
    satisfaction of immediate needs and/or assured long-term security. In this relationship
    there is something of the same tendency, as in vows, to obscure the exchange relations
    that underlie it. Mas Sulis, for all his efforts positions, did not have "rights,"
    nor did he receive any salary. Like many Javanese in subordinate positions, he
    could assume Pak Lurah''s gifts of money when he applied for them, but he was
    wary of asking too often. To make his position more precise, to specify, say,
    his position''s responsibilities and his pay, would have made of his relations
    with Pak Lurah a series of individual exchanges, each one complete (sah) and so
    without implication of further ties, rather than the relations "like those among
    kin" that Javanese prefer to see in patron-'
