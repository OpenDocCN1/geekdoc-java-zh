    full range of his voice, from deep and resonant to high and slightly shrill. He
    listens to the gamelan to guide the pitch of his speaking voice and also to differentiate
    the voices of the different figures, tying characters'' voices to particular notes
    and in some cases shifting to higher notes in the course of the performance. The
    pitch of each voice also varies slightly according to what figures are present
    in a scene: in order to maintain sufficient contrast, voices may have to be "pushed
    apart" temporarily. All of these considerations and modifications are set by tradition,
    although different dhalang observe them more or less scrupulously.


    # THE DHALANG''S PRESENCE


    In contrast to an actor in the modern Western theatre, whose every line of dialogue
    is set, a Javanese dhalang enjoys considerable freedom. He is playwright and director,
    as well as actor, in each performance. Yet his "contribution" to the tradition,
    that is, his realization of it in performance, is always momentary. Even if a
    lakon dhalang creates should a standard one in the repertoire, his name becomes
    detached from within a generation. Although dhalang, especially since the spread
    of radios and cassette tape recorders voices are easily recognized by many people,
    it remains true that under the constraints of the tradition, the figure of the
    dhalang as a particular artist tends always to disappear.


    The importance of antawacana in evaluating a dhalang''s presence epitomizes this
    effacement of the dhalang''s presence. Antawacana, like sangjit, challenges a
    dhalang to conform in as accurate and entertaining a manner possible preestablished
    norms. A dhalang must splinter his voice into a great array of distinctive voices,
    all of the characters plus the narrator. The latter, as I have mentioned, is particularly
    stylized, as is the language, highly Sanskritized and often obscure, that he uses
    in narration. The narrator''s voice is not the dhalang''s "own" voice. In Jogjia,
    the punakan Petruk should speak in the natural speaking voice of the dhalang outside
    performance. Since Petruk speaks in a direct but right-thinking and at times sententious
    manner, as dhalang tend to do on occasions in "life," I long assumed that Petruk
    was to be understood as the dhalang speaking for himself. No dhalang would agree
    to that formulation,'
