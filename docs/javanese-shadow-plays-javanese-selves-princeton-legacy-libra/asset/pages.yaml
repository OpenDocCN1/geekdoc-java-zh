- pgno: 38
  md: '# INTRODUCTION 17


    The resolution of this problem lies in considering an art form in light of the
    relationships its performance occasions. Those relationships are many: they include
    those among performers, between performers and their sponsors, between sponsors
    and their guests, etc. Most important of all, however, are the relations between
    the artistic illusion itself and its audience, implicit in these links, the relations
    between artist and spectator. These relations immediately suggest questions: what
    effect upon the audience is sought; what the nature of the spectators'' satisfaction
    is thought to be; and what reactions the performance el. Much of this material
    can be obtained from indigenous commentary, though perhaps as much in casual remarks
    about particular performances as in more formal, generalized pronouncements. But
    commentary must be judged in view of what actually happens at performances, as
    how performers use the conventions of the art form, and what arouses the spectators''
    interest, approval, and/or censor. Commentary and practice do not necessarily
    coincide on any of these points, and any disparities demand careful consideration.


    To understand a performance as a relationship does not simply permit investigators
    to challenge with observed reactions, however. It permits them, much more significantly,
    to integrate the art form with other kinds of relationships that obtain among
    the members of culture. It is here that aesthetics, sociology, and ideology meet:
    in recurrent patterns in the mediation of self and other. My analysis of wayang
    develops out this premise, that an art form constitutes a relationship, or really,
    a series of relationships, that can be compared with other (i.e., social and political)
    relations.


    By taking this approach, I hope to avoid a conundrum that bedevils analysis of
    performing arts, namely, whether the arts are simply "reflections" of other, more
    important aspects of social life, or are themselves effective agents in the world.
    (Peacock 1968 struggles with this issue in his account of another Javanese performing
    art, the transgender melodrama called ludruk.) My contention is that both


