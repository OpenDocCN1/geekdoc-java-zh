    # SHADOW PLAYS AND SOCIAL SCIENCE


    Javanese wayang is an eight-hour performance that draws on the energies of a great
    many people and fits into a larger event that can mobilize dozens or hundreds
    more. It is by no means the only major art form in Java. On the contrary, Java
    offers a remarkable number and range of performing arts. These include village
    performances in which many go into trance, commercial folk drama, several court
    dance traditions, stand-up comics, singers of Indonesian, Javanese, and Islamic
    pop music, and many more. It is true that traditional performances are now nearly
    forgotten. Few are the performances of topèng (dance with masks) or langen mandra
    waranan (a performance in which players sing, but gesture only from a kneeling
    position) that take place in contemporary Java. But new forms crop up, and the
    Javanese taste for all forms of theatre shows no sign of diminishing. In fact,
    theatre seems to pervade Javanese life. Whenever Westerners speak of polite Javanese
    encounter, with its elaborately orchestrated conversations and choreographed gestures,
    they fall almost instantly into theatrical metaphors. But in all the dramaturgy,
    the shadow play stands out as the preeminent art form in Java. It is the tradition
    most important, the most prestigious to sponsor or perform, and the most distinctly
    Javanese. Even Javanese who do not much care for wayang, nevertheless speak of
    it as uniquely meaningful, or as they put it, "full." Its influence on traditional
    art forms is great. Much of the court dance tradition consists not only of stories
    adapted from the shadow play tradition, but also of move-'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# INTRODUCTION 15


    ments modeled after those of its flat theatre puppets. In fact, such dance is
    called wayang wong: a human shadow play. In conversation Javanese speak of someone
    showing up or leaving a place, they often illustrate the point with a particular
    gesture. They hold one hand in front of their chests, fingers pointing upward
    and the back of the hand facing outward. They then move their arm to the side,
    raising and lowering it slightly, in imitation of the way a puppet moves across
    the screen.


    Wayang''s influence goes beyond the arts and beyond conventional gestures. Imagery
    taken from wayang crops up frequently in Javanese speech, and the art form provides
    a metaphor for Javanese comments on all sorts of events. Children are nicknamed
    after the servant-clowns, and the labels for characters are used to characterize
    kinds of humans as well. In a religious mode, people often remark that we are
    all just puppets, moved by the ultimate dhalang, God. In political discourse,
    any important political official is liable to be labeled a puppet manipulated
    by an unseen dhalang. Much discussion about the current regime has centered on
    who at any given movement the real dhalang.


    As these last two examples suggest, the dhalang himself holds particular fascination
    for Javanese, as he might. The extent of his learning and his ability to create
    narrative and dialogue on the spot are usually remarkable, and he is often an
    extremely clever comic. His authority over the performance is total. He crafts
    the story, manipulates the puppets, takes all their voices, and directs the gamelan,
    all at the same time. In the course of a performance, as dhalang are fond of putting
    it, the dhalang is the king.


    Yet as I have tried to suggest in the foregoing description, there is something
    puzzling about wayang in performance. The tradition fascinates people, but most
    individuals do not. Relatively few people watch an entire performance. Granted,
    Java''s four or five most popular dhalang will keep a large crowd present all
    night. But even they cannot keep spectators attentive through the narrative introductions
    to many scenes, nor awake through the entire eight-hour performance. The vast
    majority of dhalang keep very few people watching beyond halfway through the performance.
    And in the half of the performance that many people do see, the first half, the
    story is only barely set in motion. Most of the story, as I have mentioned much
    later, after about three in the morning. The rest of the the'
