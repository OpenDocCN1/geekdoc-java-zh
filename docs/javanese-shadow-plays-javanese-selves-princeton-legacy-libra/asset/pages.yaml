  md: 'mand that a yang was performed in the village for its enjoyment at least once
    a year. Failure to do so would provoke its wrath and lead to great misfortune.
    (Some village dhanyang, in contrast, are known to despise danyang and forbid its
    performance. Such dhanyang turn out to inhabit santri [orthodox or strict] Muslim
    villages.) Whereas the new rice strains now make it possible for farmers to keep
    rice fields within a small area at very different points in the growing cycle,
    the older strains were planted and harvested in a single area at the same time.
    Differences in altitude and climate do stagger harvests, however, from one area
    to another, and by moving about a dhalang hope to be engaged for harvest celebrations
    in many hamlets. Many dhalang worked the same villages year after year, and their
    sons after them, the villagers believing it more important to stick with dhalang
    familiar and acceptable to the village’s danyang than to seek out novelty by engaging
    ones.


    Any performer in Java who travels about the countryside is said to mbeharang.
    This is considered a very humble way to earn one’s living, only slightly less
    than begging.¹ The ritual importance of a dhalang in accomplishing the village
    rites saved his prestige from the lowly regard which itinerant dancers were. But
    he was by no means guaranteed respect. Frequently, dhalang and his family took
    up residence in lodgings provided them by a lurah, district officer (camat), or
    other influential figure. An older dhalang I spoke reminisced about travelling
