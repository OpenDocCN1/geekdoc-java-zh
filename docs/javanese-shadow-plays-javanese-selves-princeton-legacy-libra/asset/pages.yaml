  md: '# 86 CHAPTER 3


    lations between figures of authority and their subordinates in Java villagers
    all colored by this idealized conception of power.


    Like Javanese princes, like Javanese fathers as well, Javanese village headmen
    must concern themselves with the impression their authority makes upon those around
    them. It should impose order and respect upon the people subject to that authority
    without requiring any overt, coercive action. A truly potent headman need never
    do so. In practice, this ideal of a serenely potent leader is rarely fulfilled.
    On the contrary, the village headmen (lurah) and villagers enter into alliances
    and conflicts, in constant renegotiation of their relations. Nevertheless, the
    ideology of potency informs the behavior of both lurah and villagers.


    Some lurah choose to make claims to potency in terms of ascetic action andor communication
    with spirits; others ground their authority in more mundane definitions of power,
    based on control over labor and material resources. Yet most presume the obeisance
    of villagers, and they do this in ways suggesting that they believe their title
    should entitle them to the respect granted powerful figures. Villagers, for their
    part, try to hold their lurah to the ideal of a potent, largely quiescent, center,
    protective rather than coercive. They seek to tap his power, while at the same
    time restraining it, in a characteristically ambivalent approach toward and avoidance
    of any powerful figure. As a result, the ideology of the potent center colors
    everyone''s views of political action in Javanese villages. Nevertheless hardly
    so uniformly. Like any set of assumptions, those about potency and its manifestations
    contain ambiguities upon which villagers play in pursuit of their own purposes,
    stressing one now now, another element in the system as suits their needs.


    Villagers want very much to see in their headmen powerful leaders. But powerful
    in this means first all potent, and endowed with the qualities—generosity, even-handedness,
    and a paternalistic regard for their welfare—that potency implies. Bureaucratic
    power as exercised at higher levels of the government, such as in obtaining government
    funds allocated at meetings at the kabupatenatn (“regency”) level, and for that
    matter, personal wealth, also impress villagers. To an extent, these are seen
    as concomits of potency. More crucial, however, in the view of most villagers,
    are other responsibilities a headman should be able and willing to fulfill: to
    give ma'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# VILLAGE POLITICS 87


    terial aid to people holding ritual celebrations or who are in distress, to assure
    harmony among neighbors; and/or to protect villagers from outside influence, mundane
    or mystical. In fact, a headman, like any elder, who can cure the sick or stave
    off spirits'' attacks fulfils expectations of his potency especially dramatically
    and effectively.


    What we would call “aggressive leadership” within the village, in contrast, in
    which a headman makes demands upon people in the name of improvement and progress,
    is seen as a deflection from the ideal of an effective but non-coercive authority.
    If the headman''s potency was sufficiently great, there would be no contests of
    will: people would submit voluntarily to his benevolent guidance. If there is
    discord, it reflects poorly upon the headman''s potency, which is proved insufficient
    to assure harmony. As Wilner has written,


    > the traditional authority figure . . . [is] hopefully perceived by his subjects
    as benevolent paternal, and is so treated in the expectation that he will respond
    to their perceptions of him. . . Paradoxically, exerting force tends to diminish
    presumptive authority in constituting tacit admission that it can no longer be
    taken for granted. (Wilner 1970:271-72)


    Since at times there is very likely to tension between villagers and their headmen,
    although headmen as well as villagers are aware that coercive action compromises
    the impression of their potency, certain strategies must be adopted—by both villagers
    and headmen—to obscure at least the contradictions that arise between idealized
    image and action. Such one device is for a headman to make the people who surround
    him “the heavies”: to give them the task of carrying out his wishes and so in
    the rough, intimidating manner that would contravene impressions of the headman''s
    potency were he be to behave in such a way himself. Schulte Nordholt provides
    a good example of this in his account of elections in six Central Javanese villages:


    +   [The] candidates themselves take little or no part in the campaign. They leave
    this to their jagos [lit., fighting cocks; campaign workers]. here, the latter
    on the one hand make promises and dole out gifts, and on the other hand make kasar
    (rough, crude in behavior and speech) and if necessary intimidate people. (Schulte
    Nordholt 1982:122; my translation)'
