  md: '# I40 CHAPTER 4


    implies a correspondence so perfect between sign and effect that the latter follows
    necessarily upon—in fact, in no way distinguishable from—the former. Rather than
    promising fulfillment in the displacement of sense, as opaque language does, the
    straightforward potent speech of a king, makes sound and sense, intention and
