    # Magic Specialists


    Appeals to respected elders (wong tuwa) and magic specialists (dhukun) for assistance
    in matters of kebatin are culturally approved and very frequent. Any person thought
    to have much potency is a wong tuwa. The term, as previously mentioned, means
    literally "old person." It can also mean parent, or any relative of one''s "parents"
    generation or order. Then again, it can refer to quite a young person, someone
    younger than oneself, if he is thought to have substantial kakuatan batin. (I
    use the masculine pronoun because people to whom one goes for assistance are male;
    women would not usually be thought potent enough for such work. The exception
    dhukun bayi, women who double as midwives and as magic specialists before, during,
    and after childbirth.) Dhukun are those people who have set up shop: they are
    recognized as experts and people come to them for assistance frequently. The slightly
    commercial look to this makes the term dhukun equivocally marked, slightly demeaning
    in some people''s view, while the term wong tuwa is unambiguously positive in
    connotation. But almost everyone in Java, with the exception of the most highly
    educated reformist Muslims, has occasion at some point to consult a dhukun. This
    may be to inquire about mystically auspicious dates for a ritual, to win someone
    in love, to improve one''s profits in trade, to seek a cure for sickness, to ask
    for clues in a search for lost or stolen goods, to assure success in one''s studies
    or a bid for higher bureaucratic rank, or in pursuit of many other needs.


    The procedure is usually roughly as follows. If a couple goes to a dhukun together,
    arriving at the dhukun''s house, the woman goes to the kitchen to give the dhukun''s
    wife small gifts of food that guests take their hosts (olēh-oléh) in the front
    room, which is where public business is conducted, and his wife eventually joins
    him there. The man lays an unopened pack of cigarettes on the low table'
