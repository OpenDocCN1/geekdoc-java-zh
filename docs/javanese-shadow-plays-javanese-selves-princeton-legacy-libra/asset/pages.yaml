  md: '# 5. RITUAL CELEBRATIONS


    The dissimulation of exertion at the center, whether of kingdoms, of villages,
    or even of families, is necessary to maintain impressions of a respected figure''s
    potency and prestige. It is in terms of this conception (of what might be called
    the dissembled center), that I wish to discuss the the roles of the sponsors and
    the dhalang at a ritual celebration. The important and problematic fact about
    these events is that they are occasions in which the "center" is occupied by two
    such different kinds of central figures: the ritual''s sponsors and the dhalang.
    Their simultaneous presence is made possible by their distinctly different comportment,
    the sponsors appearing reticent, the dhalang in contrast appearing commanding
    and even overbearing. This difference becomes particularly clear in the differing
    relations they enter into speech: the sponsors say nothing, whereas the dhalang
    speaks all not. Yet the principles motivating their respective behaviors turn
    out to follow equally from Javanese ideas of power and its necessary dissimance.


    A ritual celebration enables households, as sponsors, to assume a position of
    some importance and authority, though only temporarily and only within the limits
    of the ritual context itself. The notion of dissimulated power shapes the relations
    between the sponsors and their assistants and guests because it encourages the
    former to seek people''s attendance while minimizing impressions of their overt
    control over them. Principles of reciprocity assure cooperation between sponsors
    and assistants, but with their guests, sponsors have other intermediaries substitute
    for them. In particular, these people take on the sponsors'' voices. If the sponsors
    decide to hold a wayang, the dhalang performs this function especially. But he,
    too, dissimulates his control over his troupe and the spectators, by means of
    the conventions of a wayang''s performance.


    In this chapter, I will describe at some length the net of relations that gathers
    sponsors, assistants, and guests we together at a ritual celebration. I do this
    both because ritual celebrations are the context in which most performances of
    wayang take place and because they'
