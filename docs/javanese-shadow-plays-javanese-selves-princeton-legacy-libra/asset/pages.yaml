    his case, too, his father''s influence in the area, notably among district political
    officers, enabled him to be named caretaker lurah, after the removal and imprisonment
    of the previous lurah. He later elected permanent lurah.


    Despite his father''s orthodox religious views, as a young man Pak Lurah Kenthangan
    had developed quite a reputation as a rowdy. His father had given him a big old
