- pgno: 222
  md: '# DHALANG, TROUPE, AND TRADITION 193


    Below the level of the order of scenes, pathakan determine the way that a single
    scene progresses from greetings to discussion and often to battle. They further
    shape the course of a single battle, since a set pattern pits opponents of progressively
    higher status against each other.


    The power of the pathakan is extraordinary. Only ruwatan and Bratayuda lakon (the
    latter any of a series of lakon depicting the final cataclysmic war in the Mahabharata)
    are said to escape the invariable order of scenes. But of the performances I saw
    of Bratayuda lakon, all adhered to the pathakan quite strictly. Even Nartosabdho’s
    new, unprecedented performances, in which he follows one character from birth
    to death, observe the set divisions. Neither Nartosabdho’s innovations is strong
    enough to subvert the given structure.


    A dhalang’s dramaturgy (sanggit) consists in the way he fits the particular lakon
    he performs to the constraints of this fairly inflexible shape. This means first
    of all the order in which he chooses to present the different sets of characters:
    whether the longer opening scene, for example, will take place in the palace of
    one kingdom or in another. Though many classical lakon are traditionally played
    in a particular order, a dhalang may vary that sequence. One dhalang explained
    that he may shift the order in which characters appear in order to permit a figure
    to do battle against a particular figure from another camp, that being unusual
    and suggestive of novel jokes. However, tampering with the usual arrangement of
    a classical lakon does expose a dhalang to the criticism of many wayang devotees,
    who rarely find the taking of such liberties warranted.


    Aside from the overall arrangement of the lakon, sanggit concerns as well the
    skill with which a dhalang creates dialogue. Each figure must speak in a manner
    suitable to his or her character. A dhalang’s language must also conform to certain
    standards. He must not introduce modern words, particularly from Indonesian or
    other foreign languages, except when a punakawan is speaking. Furthermore, the
    progression of the dialogue, particularly in the longer court scenes, from polite
    greetings to mounting tension and battle, must appear artless. There should be
    no sudden or unmotivated'
