  md: 'There is a similar effort to distinguish fathers and sons in their re-spective
    stores of mystical knowledge (ngèlmu), consisting of magical formulas (aji-aji
    and rapal), arcane lore, and knowledge of various as-etic and mystical practices.
    Ngèlmu can be translated most generally as “knowledge” or “wisdom.” It contrasts
    with ʿilmah,“science.” The latter may be difficult and obscure, and it confines
    itself to the exter-nal world, understood by and subject to everyday relations
    of cause and effect. It is what one learns about school and what Westerners have
    such a knack for. Ngèlmu, on the contrary, deals with all manner of things which
    are not susceptible to obvious analysis: formulas, spirits, sorcery, asceticism,
    vows—in a word, all things that are tied to the operations of kakuwat batin. A
    youth in his late teens may begin to develop an interest in ngèlmu in the form
    of invulnerability magic. As he achieves adult status, his interests should diversify.
    The great spiritual potency of an old man accounts for his ability to re-member
    and deploy this esoterica. But people assured me that a man could not find a guru
    (a teacher of ngèlmu) in his father. The particular bond of respect and loyalty
    that ties a student to a guru, a bond highly idealized in Java, is distinguished
    from between father and son. Granted, Javanese also idealize a son’s relationship
    with his fa-ther when they insist on a son’s obligation to fear/respect his father,
    and to support him in his old age. The conventional image of the young man given
    guidance and strength through the teachings of a guru stands at a remove from
    family relations. In fact, the special-tus of the bond between guru and student,
    while likened normatively to that between father and son, differs from that relation
    because it fills in conscious and positive affective ties that are lacking among
    males within the family.


    I was given various justifications for the need to distinguish be-tween guru and
    fathers. Most important among them was the notion that the son might not be strong
    enough (ora kuwat) for his father’s ngèlmu. To assimilate ngèlmu beyond the capacity
    of one’s own spiritual potency causes confusion, madness, and even death. A guru
    will know to introduce ngèlmu to his student by degrees, and to take proper ritual
    precautions along the way. The student then suffers no ill effects. A father,
