    demo which is an interactive handheld home-entertainment controller, also known
    as the Star.


    Java is considered a portable language, and Java can run on any operating system.
    It is a high-end programming language that allows developers to write programs
    that can exist independent of any working operating system like a computer. Mostly
    high-level programming languages are way easier to compose and maintain. However,
    the code needs to be translated by a compiler. It should be interpreted in a machine
    language in order to be executed because it is the machine language that a computer
    understands.


    You will need a Java Virtual Machine(JVM) for Java so that Java can be run on
    a computer. A JVM is required for the execution of different Java programs that
    you create. This platform will convert the code of Java into a machine language
    that the computer understands. After the conversion, it will execute the same.


    The compile source code of other high-level programming languages is compiled
    directly into the machine code that is specifically designed to run on a microprocessor
    operating system like UNIX or Windows. JVM, on the other hand, mimics the Java
    processor and makes it possible for Java programs to be interpreted as a sequence
    of actions on a processor no matter what the operating system is.


    ## The Development Environment


    When you make up your mind to start working in Java, you need a couple of things
    properly installed on your operating system. Here is the rundown of the requirements
    you need. First of all, you need Java support on your operating system. You also
    need an integrated development environment (IDE), which is an application to write
    code to compile and execute.


    The recommended IDE is IntelliJ IDE. You can browse their website to get the community
    edition for free. You also can choose a highly popular IDE, namely Eclipse, which
    you can get for free. The third version of IDE is called NetBeans.


    Gradle is a built-in tool that is used for the organization of projects so that
    you can easily handle dependencies. It can facilitate your work as your projects
    become bigger. Another version Git is a versioning system that you may use to
    get the sources for this book.


    ## How To Install


    You have got your computer system. First of all, you have to get a JDK and then
    install it right away on your computer system. You will need a stable internet
    connection to open it and install it from the website.


    When it has been opened, you need to scroll down to the Downloads section. Now
    click the Java SE link. Look out for the latest version of Java on the official
    website of Oracle. Now click the Download JDK button, and you will be redirected
    to a new page.


    JDK is available for a couple of operating systems. You may download the one that
    matches yours. You should accept the license agreement before you are allowed
    to download the version of JDK you need. You can read the agreement if you want
    to get yourself familiar with the contents before you start. If we summarize it
    in simple words, the agreement tells you that the user will be allowed to use
    Java if you do not have any planning to modify the original components. It tells
    you that you will be responsible for its usage.

