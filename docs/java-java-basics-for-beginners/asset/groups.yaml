    # Introduction


    This book contains proven steps and strategies on how to learn the basics of Java.
    Java is a comparatively tough language to learn because it is not scripted but
    compiled. You need a Java Development Kit and a compiler to create projects, save
    files, and run codes.


    I have written this book in a way that explains the basics of Java programming.
    You will be introduced to the installation process of the Java Development Kit
    and the compilers. There are many compilers available in the market. You can use
    one of your choice and create Java codes. As classes are inherent in Java, you
    should make sure that the file names you are creating are in line with the names
    of the classes. Otherwise, you will see an error in the compiler.


    This book contains an introduction to Java syntax, variables, conditionals, loops,
    and object-oriented programming. I recommend that you should keep an editor and
    compiler ready to write and test the codes that you learn from the book. You can
    introduce some changes to the code and test them again to see whether they work
    or not.


    Java is a bit different from other programming languages Python because of its
    different names for lists, arrays, and dictionaries. Therefore, if you get yourself
    acquainted with the vocabulary, you will find it easy to navigate through the
    codes. For example, HashMap is similar to dictionaries in other programming languages.
