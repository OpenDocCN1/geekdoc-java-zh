  mdcn: "\n\nJava 循环倾向于循环遍历代码块，直到条件变为真。在下文示例中，代码将反复运行，直到代码块中的变量小于 7。让我们来写下这段代码并看看它是如何工作的。之后我将解释这些代码。\n\
    \n```\npublic class Java {\n  public static void main(String[] args) {\n    int\
