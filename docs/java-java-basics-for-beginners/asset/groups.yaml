    # 引言


    本书包含了学习 Java 基础的经过验证的步骤和策略。Java 是一门相对较难的语言，因为它不是脚本语言，而是编译型语言。你需要 Java 开发工具包 (JDK)
    和一个编译器来创建项目、保存文件并运行代码。


    我编写这本书的方式解释了 Java 编程的基础知识。你将介绍 Java 开发工具包和编译器的安装过程。市场上上有许多编译器可供。你可以使用你喜欢的其中一个来创建
    Java 代码。由于类在 Java 中是固有的，你应该确保你创建的文件名与类名一致。否则，你将在编译器中看到错误。


    本书包含了 Java 语法、变量、条件、循环和面向对象编程的介绍。我建议你准备好编辑器和编译器，以编写和测试你从书中学习的代码。你可以对代码进行一些更改并再次测试，以查看它们是否有效。


    Java 与 Python 等其他编程语言略有不同，因为它对列表、数组和字典的命名不同。因此，如果你熟悉了这些词汇，你会发现导航代码变得很容易。例如，HashMap
    类似于其他编程语言中的字典。ArrayList 和 LinkedList 的工作方式就像其他语言中的普通列表。


    你不需要成为编程专家就可以开始这本书。任何对编码感兴趣的人都可以购买这本书，并理解 Java 编程的来龙。我为书的每个章节都包含了一个代码示例，以便当你在书中看到代码时能够理解它是如何运行的。甚至书中的每个方法都通过适当的示例进行了解释。


    因此，最好的方法是阅读这本书的同时进行实践。使用这些代码，编辑它们并编译它们，看看你能产生什么结果。自定义代码以便你能够学习如何编写自己的代码。在过去的几年里，Java
    成功地保持了它在程序员中的普及。而且在未来可能会获得更多增长。


    # 第一章


    ## Java 安装


    Java 属于影响力最大、使用最广泛的编程语言之一。Java 之之旅始于 1990 年，当时一家正寻求领导计算机行业革命的美国公司选择汇集顶尖工程师，并指派他们一项任务：开发一种最终使他们在新兴的互联网世界中成为关键角的产品。工程师中
    James Arthur Gosling。James 是一位加拿大计算机科学家，现在作为 Java 之父而闻名世。


    Java 的第一个版本于 1996 年发布。一个名为“绿色小组”的团队开发了原型语言，该语言当时被称为 Oak。它有一个可行的演示，是一个交互式手持家用娱乐控制器，也称为
    Star。


    Java 被认为是一门可移植语言，Java 可以运行在任何操作系统上。它是一种高级编程语言，允许开发者编写可以独立于任何特定工作操作系统（如计算机）的程序。大多数高级编程语言更容易编写和维护。然而，代码需要通过编译器进行翻译。它必须被解释为机器语言才能执行，因为计算机只能听懂机器语言。


    你需要一个 Java 虚拟机 (JVM) 来让 Java 运行在计算机上。你创建的不同的 Java 程序的执行都需要 JVM。该平台会将 Java 代码转换为计算机能理解的机器语言。转换后，它将执行该代码。


    其他高级编程语言的源代码直接编译成机器码，专门设计用于运行在 UNIX 或 Windows 等微处理器操作系统上。而相反，JVM 模拟了 Java 处理器，使得无论操作系统是什么，Java
    程序都可以被解释为在处理器上的一系列动作。


    ## 开发环境


    当你决定开始从事 Java 工作时，你需要在你的操作系统上正确安装一些东西。以下是你需要的要求的清单。首先，你的需要在操作系统上需要 Java 支持。你还需要一个集成开发环境
    (IDE)，这是一个用于编写代码、编译和执行代码的应用程序。


    推荐的 IDE 是 IntelliJ IDE。你可以浏览他们的网站免费获取社区版。你也可以选择一个非常流行的 IDE，即 Eclipse，你可以免费获取。第三种
    IDE 称为 NetBeans。


    Gradle 是一个用于组织项目的内置工具，让你能够轻松处理依赖关系。随着你的项目变大，它可以方便你的工作。另一个 Git 是一个版本控制系统，你可以用它获取本书的源码。


    ## 如何安装


    你已经有了计算机系统。首先，你必须获取一个 JDK，然后将其安装到你的计算机系统上。你需要稳定的互联网连接来从网站打开并安装它。


    打开后，你需要滚动到“下载”部分。现在点击 Java SE 链接。在 Oracle 官方网上寻找最新的 Java 版本。现在点击“下载 JDK”按钮，你将被重定向到一个新页面。


    JDK 适用于几种操作系统。你可以下载与你系统匹配的那一个。在允许下载你需要的 JDK 版本之前，你应该接受许可协议。如果你想在开始之前熟悉内容，可以阅读该协议。


