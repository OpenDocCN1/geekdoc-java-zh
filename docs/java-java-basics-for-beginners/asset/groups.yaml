    # Java Conditionalsn& Switch Statement


    You have learned how to create statements and which types of operators you must
    use. Elements of logic must be added at times to run the code and keep it running
    without interruption. This chapter will walk you through the process of manipulating
    the code execution, using conditional statements and repetitive statements to
    achieve the goal. You can represent an algorithm and a solution using flowcharts.


    Java supports the logical conditions in mathematics. Here is a rundown of the
    conditions that you can use in the codes in Java. You can use the less than condition
    x<y, the less than equal to sign x <= y, the greater than sign x > y, the greater
    than or equal condition x >= y, the equal to condition x == y, and the not equal
    to condition x != y.


    You can use all these conditions for performing a set of actions for various reasons.
