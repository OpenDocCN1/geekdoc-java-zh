    \n最需要记住的是，你应该增加变量 `x`，否则循环将是无限的。它永远不会结束，并最终导致其所属的程序崩溃。\n\n当你处理一个并非始终在线的特定资源时，`while`\
    \ 语句效果最好。假设你为应用程序使用了一个存在不稳定网络中的远程数据库。`while` 语句可以帮助你在多次超时后保存数据，直到成功。\n\n## do-while\
    \ 循环\n\n`do-while` 循环与 `while` 循环没有区别。唯一的区别是继续的条件通常是在代码块执行后评估的。这触发代码块至少执行一次，除非开发者在代码中嵌入了退出条件。在大多数情况下，`do-while`\
    \ 循环和 `while` 循环可以容易且无缝地交换。大多数情况下，你只需要对代码块的逻辑进行微小的更改。可以使用 `do-while` 循环来编写遍历数组并打印元素的值。这不需要更改代码。\n\
    \n当代码块需要至少执行一次时，`do-while` 语句工作非常完美。否则，你必须至少评估一次条件。\n\n在接下来的示例中，我将使用 `do-while`\
    \ 循环。编译器即使在第一次运行时条件结果为假，也会让语句执行一次。其原因是位于条件之前的代码块总是会被测试的。\n\n```\npublic class\
