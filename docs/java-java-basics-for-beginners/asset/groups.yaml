    \n面向对象编程为程序提供了清晰的结构。它还有助于防止 Java 代码重复和使程序混乱。它让你的代码更容易维护、调试或修改。它还让你能够用更少的代码和更短开发时间创建可用的应用程序。因此，它将为你节省资源。面向对象编程技术遵循\
    \ DRY 原则，全称为“不要重复自己”。该原则侧重于减少代码的重复。你必须分离出应用程序中公共的代码，然后将其放在一个地方。从那里你可以提取并重复使用它们，而不是重复。\n\
    \n# 类\n\n类和对象是面向对象编程的两个部分。类就像对象的通用模板，而对象就像单个类的实例。当你创建单独的对象时，它们将继承类中的变量和不同的方法。\n\
    \nJava 中的一切都与对象或类以及它们的方法或属性有关。豹子是一个对象，它具有高度、颜色和姿态等属性。它坐、吃、跑、战斗。同样，我们为 Java 类中的对象赋予了属性。在下面的示例中，我将从类中创建一个对象。我将使用关键字\
    \ `new` 配合对象的名称。\n\n```java\npublic class Java {\n    int a = 50;\n\n    public\
