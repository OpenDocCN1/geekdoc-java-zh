    # Java Generics


    Java Generic methods and classes tend to enable programmers to specify a set of
    methods or a set of related methods with one declaration of class. Java generic
    provides compile-time type safety that will allow programmers to detect the invalid
    types at the time of compilation. By using Java Generic concept, I will write
    a generic method to sort out an array of different objects and then invoke a generic
    method with the help of Double arrays, Integer arrays, and String arrays.


    # Generic Methods


    You may write one single method declaration that will be called with different
    types of arguments. Based on argument passed to generic method, the Java compiler
    will handle each method appropriately. Here are the rules for defining Generic
    Methods.


    +   All of the declarations of generic methods must have a type parameter section
    delimited by the angle brackets that will precede the method''s return type.'
