    # RegEx Syntax


    The following is given different regular expression metacharacters that Java entertains.


    +   1. The subexpression ^ matches start of lines.

    2. The subexpression $ matches end of lines.

    3. The subexpression [...] matches a single character that exists inside the brackets.

    4. The subexpression [^...] matches a single character but not inside the brackets.

    5. The subexpression \A shows the start of a string.

    6. The subexpression \z shows the end of string.

    7. The subexpression \Z shows end of string except the allowable last line terminator.'
