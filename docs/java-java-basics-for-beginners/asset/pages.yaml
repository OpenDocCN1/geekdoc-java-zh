  md: '# Chapter Six


    # Java Loops


    The while loop does not have a fixed number of steps that you need to execute.
    Therefore, you do not always need a counter in the code. The total number of repetitions
    of the while statement depend on how many times you evaluate the continuation
    condition to be true. A while statement does not need the initialization statement
    in the block of code or out of the statement. The while statement may replace
    the for statement in most of the cases. However, the major advantage of the for
    statement that keeps developers from quitting it is that it can encapsulate the
    initialization of the code. Also, the for statement offers the termination condition
    and counter modification. You can get all that in a single block, which makes
    the for statement superior to the while loop. However, each statement has its
    distinct advantages and disadvantages.


    In programming, sometimes, you need repetitive steps that demand the same variables.
    To write the statement over and over again to get the job done would be painful.
    Loops make this job easy and fun.'
