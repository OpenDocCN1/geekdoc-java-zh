    # Java RegEx


    Java has the java.util.regex package to match different types of patterns with
    the help of regular expressions. Java regular expressions are easy to learn. A
    regular expression is like a special sequence of characters that will help you
    match a set of strings with the help of a specialized syntax held in a specific
    pattern. You can use them to search, then edit, and also exploit data.


    The java.util.regex has three main classes. The first is the Pattern class. An
    object in the Pattern class offers no public constructors. For creating a pattern,
    you should invoke one of the public static compile() methods, which will return
    the Pattern object. These specific methods tend to accept regular expression as
    first argument.


    The matcher object is like an engine that will interpret the pattern and perform
    match operations against input strings. Like Pattern class, Matcher does not define
    the public constructors. You can obtain the Matcher by using the matcher() method
    on Pattern object. A PatternSyntaxException is like an unchecked exception that
    will point out error in the syntax in the form of a regular expression pattern.'
