- pgno: 8
  md: '# Introduction


    This book contains proven steps and strategies on how to learn the basics of Java.
    Java is a comparatively tough language to learn because it is not scripted but
    compiled. You need a Java Development Kit and a compiler to create projects, save
    files, and run codes.


    I have written this book in a way that explains the basics of Java programming.
    You will be introduced to the installation process of the Java Development Kit
    and the compilers. There are many compilers available in the market. You can use
    one of your choice and create Java codes. As classes are inherent in Java, you
    should make sure that the file names you are creating are in line with the names
    of the classes. Otherwise, you will see an error in the compiler.


    This book contains an introduction to Java syntax, variables, conditionals, loops,
    and object-oriented programming. I recommend that you should keep an editor and
    compiler ready to write and test the codes that you learn from the book. You can
    introduce some changes to the code and test them again to see whether they work
    or not.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Java is a bit different from other programming languages Python because of
    its different names for lists, arrays, and dictionaries. Therefore, if you get
    yourself acquainted with the vocabulary, you will find it easy to navigate through
    the codes. For example, HashMap is similar to dictionaries in other programming
    languages. ArrayLists and LinkedLists work like normal lists in other programming
    languages.


    You don’t have to be an expert in programming to start this book. Anyone who has
    an interest in coding can buy this book and understand the ins and outs of Java
    programming. I have included a code sample for each section of the book so that
    you can understand how a code works whenever you see that in the book. Even each
    method in the book is explained with a proper example.


    Therefore, the best way is to read the book and practice it as well at the same
    time. Use the codes, edit them, and compile them to see what results you can produce.
    Customize the codes so that you can learn how to write your own codes. Java, over
    the past years, managed to retain its popularity among programmers. And it is
    likely to gain more in the future.'
  merge: -1
  img_proc: true
