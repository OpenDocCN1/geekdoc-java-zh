    # Polymorphism


    Polymorphism is the ability of a particular object to take up different forms.
    The most common polymorphism happens in object oriented programming when a particular
    parent class refers to an object of the child class. Any particular Java object
    that passes multiple IS-A test is considered as polymorphic. All Java objects
    are polymorphic since any of them will pass IS-A test for its own type.


    With the help of a reference variable, you can access an object. The reference
    variable may be reassigned to different other objects that are not considered
    as final. The reference type determines the particular methods that it may invoke
    about the object. A reference variable refers to an object of any subtype of the
    declared type. You can declare a reference variable as an interface type.


    A Buffalo class can take inheritances as Animal, Buffalo, Object, Dinner, Victim,
    Vegetarian, etc. In this situation, we may say that the Buffalo class is polymorphic.


    In the next example, I will explain how overriding behavior in Java lets you take
    advantage of this specific trait of polymorphism while designing the classes.'
