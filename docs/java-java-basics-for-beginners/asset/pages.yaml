    # Java Fundamental Building Blocks


    If you want to be an expert coder, you need to have a good grasp of what happens
    inside Java blocks. What are the building blocks, and how have those building
    blocks been connected with each other? You need to be well-versed in the building
    blocks of the Java ecosystem. The core of the ecosystem is classes. Classes are
    the most important because they represent templates for objects that make up different
    types of applications. A class groups different methods and fields. When you create
    an object, the values of all the fields define what the state of an object is.
    It also describes the behavior of methods.


    The Java object models a real-world object. If you choose to model a bike in Java,
    you will have to define different fields that will describe the bike. The fields
    can be the model of the car, the make of the car, the price of the car, the color
    of the car, the engine power'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'of the car, the type of the car, and the seating capacity of the car. It will
    define its functions like speeding and braking as well.


    You need to describe all types of objects in files and add to them the .java extension.
    You can organize object types in the form of packages. A package in Java is a
    logical collection of different types. Some of these types are completely visible
    out of the package, and some are not based on the scope. A package is like a hierarchy
    of directories, and the Java object types are the last.


    The name of the packages must be unique, and their name should also follow a set
    template. In order to ensure meaning and unicity, you need to start the name with
    the Internet Domain name of your organization in reverse order. You then need
    to add different types of grouping criteria. Each package can contain a file named
    package-info.java that will contain the package declaration, the annotations,
    the comments, and Javadoc tags. The comments are then exported to Javadoc for
    the package. The package file needs to rest in the last directory inside the package.


    The files that carry *.java extension have the object types definitions and are
    compiled in the form of files that have *.class, organized as per the package
    structure, and then packaged into multiple JARs.


    The code that rests inside a package spans more than one JARs, which means that
    if you have more than one subproject in the project, you will have the name of
    the same package multiple times. Also, it will contain different classes. A Java
    library makes use of'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'multiple libraries. In order to be run, it needs all the dependencies on the
    classpath. It means that you need JDK to run Java, the app jars, and the dependencies,
    which are also named external JARS.


    The JARs that make up the classpath are not necessarily interdependent on each
    other. In complex apps, complications were caused by packages that are scattered
    more than jars, transitive dependencies, and accessibility problems. All of these
    problems are added to one category, namely The Jar Hell. This problem was resolved
    when Java9 was launched.


    # Access Modifiers


    When you are declaring the type of an object in Java, you may configure who will
    be able to use the same. The Access modifiers tend to specify your access to the
    classes. In this case, we may say that you can use them at the top level. They
    also tend to specify your access to the members of the class. In this case, you
    use them at the member level. When you are using top-level, you can use only two
    modifiers, one is called public, and the other is called none.


    At top-level class that you declare as public needs to be defined in the Java
    file with the same file name. That’s why the following class named Java.java is
    stored under com.apress.bgn.ch0 package.


    ```

    apress.bgn.ch0 package.

    package com.apress.bgn.ch0;

    //it is the top-level’s access modifier

    public class Java {

    ```'
  merge: -1
  img_proc: true
- pgno: 22
  md: '```

    ...

    }

    ```


    A public class can be seen by anyone anywhere. It always remains visible. The
    option to defy the use of an access modifier is called by the use of package-private
    and default modifier, which means that if the class lacks a modifier, it will
    only be visible to classes that are defined inside the same package. A class that
    lacks an access modifier may be defined in the Java file. The file must have the
    same name as that of the class. If you have declared a classX in the X.java file,
    creating an object of the same type in the Main class is not possible.


    You will still be able to write the code, but the Java compiler you are using
    will defy compiling it. There will be no bytecode for execution purposes. Java
    editors, who are smart, show you the error of ways by making the code painted
    red and also refusing to provide code resistance when you are writing it. A class
    that lacks an access modifier will be visible to all the classes inside the same
    package.


    Inside a Java class, the members of the class are properly defined. These members
    are called methods and fields. The access modifiers are applied to the members
    of the class as well. At the member level, you apply two more modifiers known
    as protected and private, and the access modifiers carry the following effects
    on the code.


    The first is public. It is the same spot as at the top level. You can access the
    members from everywhere in the code.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The second is known as private. The members may be accessed

    from inside their own class.


    The third is known as protected. The member may only be accessed

    from inside the package or through a subclass of the class in some

    other package.


    The fourth is none. Here you only can access the member from

    inside your own package.


    It may appear to be highly complicated to you at the moment.

    However, the complications remain until you start writing the code.


    # Modules


    In Java 9, developers were treated with the gift of modules.

    Modules are used for grouping and encapsulating the packages. The

    implementation of the new concept consumed a decade to develop.

    The discussion about the creation of modules began in 2005. They

    were proposed for Java7. namely Project Jigsaw, was

    started as an exploratory phase in 2008. Java developers hoped that

    a modular JDK would enter the markets with Java8. However, they

    had to face disappointment. The release of the modules was only

    possible in Java9.


    This is the reason the official release of Java9 was postponed until

    September 2017.


    Modules in Java represent an innovative way to aggregate

    packages. A module is an innovative way to group all of them and

    also configure the granulated access to the contents of the package.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'A module has a unique name. It is a reusable group of packages.

    There is a file name like the following: module-information.java. A

    module file carries the following information.


    +   1. The first information is the name of the module.


    +   2. The second is the dependencies of the module, like how

    any modules it depends on.


    +   3. The third is packages it makes explicitly available to

    different other modules. All the other packages remain

    implicit available to the other modules.


    +   4. It shows the services it offers.


    +   5. It carries the services it consumes.


