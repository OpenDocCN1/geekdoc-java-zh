  md: '# Chapter One


    # Java Installation


    Java falls into the category of one of the most influential and most used programming
    languages. The journey of Java began in 1990 when an American company, which was,
    at that point, in the quest to lead the revolution in the computer industry, opted
    to collect the top engineers and assign them the task to develop a product that
    would ultimately make them a key player in the emerging world of the internet.
    Among the engineers was Hames Arthur Gosling. James was a Canadian computer scientist
    who is now well-known as the father of Java.


    The first version of Java got its release in 1996. A team named the Green team
    worked on the prototype language, which was then known as Oak. It had a working
    demo which is an interactive handheld home-entertainment controller, also known
    as the Star.


    Java is considered a portable language, and Java can run on any operating system.
    It is a high-end programming language that allows developers to write programs
    that can exist independent of any working operating system like a computer. Mostly
    high-level'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'programming languages are way easier to compose and maintain. However, the
    code needs to be translated by a compiler. It should be interpreted in a machine
    language in order to be executed because it is the machine language that a computer
    understands.


    You will need a Java Virtual Machine(JVM) for Java so that Java can be run on
    a computer. A JVM is required for the execution of different Java programs that
    you create. This platform will convert the code of Java into a machine language
    that the computer understands. After the conversion, it will execute the same.


    The compile source code of other high-level programming languages is compiled
    directly into the machine code that is specifically designed to run on a microprocessor
    operating system like UNIX or Windows. JVM, on the other hand, mimics the Java
    processor and makes it possible for Java programs to be interpreted as a sequence
    of actions on a processor no matter what the operating system is.


    # The Development Environment


    When you make up your mind to start working in Java, you need a couple of things
    properly installed on your operating system. Here is the rundown of the requirements
    you need. First of all, you need Java support on your operating system. You also
    need an integrated development environment (IDE), which is an application to write
    code to compile and execute.


    The recommended IDE is IntelliJ IDE. You can browse their website to get the community
    edition for free. You also can choose'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'a highly popular IDE, namely Eclipse, which you can get for free. The third
    version of IDE is called NetBeans.


    Gradle is a built-in tool that is used for the organization of projects so that
    you can easily handle certain dependencies. It can facilitate your work as your
    projects become bigger. Another version Git is a versioning system that you may
    use to get the sources for this book.


    # How To Install


    You have got your computer system. First of all, you have to get a JDK and then
    install it right away on your computer system. You will need a stable internet
    connection to open it and install it from the website.


    When it has been opened, you need to scroll down to the Downloads section. Now
    click the Java SE link. Look out for the latest version of Java on the official
    website of Oracle. Now click the Download JDK button, and you will be redirected
    to a new page.


    JDK is available for a couple of operating systems. You may download the one that
    matches yours. You should accept the license agreement before you are allowed
    to download the version of JDK you need. You can read the agreement if you want
    to get yourself familiar with the contents before you start. If we summarize it
    in simple words, the agreement tells you that the user will be allowed to use
    Java if you do not have any planning to modify the original components. It tells
    you that you will be responsible for its usage,'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'so if you use the same to either write or execute its dangerous applications,
    you will be held legally responsible.


    If you want to declare the JAVA_HOME environment variable on Windows, you must
    open the dialog box to set up the variables of the system. On the Windows operating
    system, you need to hit the Start button. Inside the menu section, you will find
    a search box. Now type in the word environment. The exact option, namely Environment,
    will show up for clicking. Click the button. There will be another dialog box,
    split up into two sections called system variables and user variables.


    After you have defined the JAVA_HOME variable, you have to add executables to
    the path of the system. This will be done by formally editing the Path variable.
    All you need is select the variable from the list of System Variables and then
    hit the Edit button. You can see each section of the Path variable onto a different
    line so that you may add a different line.


    # Using Shell


    The Java Shell tool or JShell is a really interactive tool to learn the ins and
    outs of Java programming and prototyping Java code, which means that you can write
    the code and also execute it in the same console. You don''t have to save it first
    and then compile it into bytecode to run it, and after that, get it interpreted
    by the operating system as a line of instructions for execution. JShell is a bit
    late to the world of Java as Scripting languages such as Node and Python have
    already introduced similar kinds of utilities a couple of years ago. JVM languages
    like Cloj, Scala, and Groovy have also'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'adopted it a while ago. However, as the saying goes, it is better late than
    never. Therefore, even the late coming has been accepted.


    JShell REPL, which means Read-Eval-Print Loop. It tends to evaluate the declarations,
    the statements, and the expressions as you enter them, and then it shows the results
    fast. It is quite practical to try out fresh ideas and techniques faster without
    the need to have a full development environment or a complete text for the code
    to be executed.


    JShell is like a standard component of JDK and is quite executable to begin. It
    rests in the bin directory that is located in the JDK installation directory.
    It means that you just have to open up a terminal like a command prompt in Windows
    and then type jshell as the command. You will see something like the following.


    ```

