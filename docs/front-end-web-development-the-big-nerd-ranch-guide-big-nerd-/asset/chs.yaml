  \n当水獭和标记准备就绪且开发者工具打开时，你已经准备好在下一章开始为你的项目样式了。\n\n## 进阶探索：CSS 版本\n\nCSS 的版本历史包含了标准版本\
  \ 1、2 和 2.1。在 2.1 之后，人们决定标准变得太大了，需要进行拆分。\n\n并没有所谓的版本 3。相反，CSS3 是许多模块的统称，每个模块都有自己的版本号。\n\
  \n**表 2.1�  CSS 版本：现实与想象**\n\n| 版本号 | 发布年份 | 显著特性 |\n| --- | --- | --- |\n| 1 |\
  \ 1996 | 基础字体属性（`font-family`、`font-style`）、前景和背景颜色、文本对齐、外边距、边框和内边距。 |\n| 2 | 1998\
  \ | 绝对、相对和固定定位；新的字体属性。 |\n| 2.1 | 2011 | 删除了浏览器支持较差的功能。 |\n| “3” | 各异 | 不同规范的集合，例如媒体查询、新选择器、半透明颜色、`@font-face`。\n\
  \n## 进阶探索：favicon.ico\n\n你是否注意到在访问大多数网站时，浏览器地址栏左侧会出现一个小图标？有时它们也会出现在你的浏览器标签页中，如图\
  \ 2.19 所示。\n\n**图 2.19�  `bignerdranch.com` 的 `favicon.ico`**\n\n![bignerdranch.com\
  \ 的 favicon.ico](img/bnr-favicon.png)\n\n这就是 `favicon.ico` 图片文件。许多网站都有，浏览器默认会请求它。由于\
  \ Ottergram 没有，你可能会在开发者工具中看到类似图 2.20 中的错误。\n\n**图 2.20�  缺少 `favicon.ico` 的错误**\n\
  \n![缺少 favicon.ico 的错误](img/favicon-warning.png)\n\n如果出现这个错误，请不要担心。它不会影响你的项目。不过，你可以轻松添加一个\
  \ `favicon.ico` 图片——这就是你的第一个挑战。\n\n## 银牌挑战：添加 favicon.ico\n\n你已经决定比起看到 `favicon.ico`\
  \ 错误信息，你更喜欢水獭。你将使用其中一张水獭图像创建一个 `favicon.ico` 文件。\n\n在网络上搜索“favicon generator”，你应该能看到一个可以为你进行文件转换的网站列表。大多数允许你上传图片，然后为你提供一个\
  \ `favicon.ico` 版本。\n\n选择其中一个并上传任意一张水獭图像。\n\n将生成的 `favicon.ico` 文件保存到与 `index.html`\
  \ 文件相同的文件夹中。最后，刷新你的浏览器。你的浏览器标签页看起来将类似于图 2.21。\n\n**图 2.21�  带有 favicon.ico 的 Ottergram**\n\
  \n![带有 favicon.ico 的 Ottergram](img/img-favicon.png)\n\n# 3 样式\n\n在本章中，你将为 Ottergram\
  \ 设计一个静态版本。在随后的章节中，你将让 Ottergram 交互起来。\n\n当你到达本章结束时，你的网站将看起来像图 3.1。\n\n**图 3.1�\
  \  样式化**\n\n![样式化](img/oh-yeah.png)\n\n本章介绍了许多概念和示例。如果你在结束时觉得还没有掌握所有内容，请不要担心。随着学习，你会反复遇到它们。\n\
  \n当然，我们只能介绍 CSS 中可用样式的一小部分。你可能需要查阅 MDN 获取有关完整属性和值的信息。\n\n前端开发者在为网站建模时需要在两种方法之间选择：从整体布局开始到最小细节，或者从最小细节开始到整体布局。\n\
  \n从细节到大观的方法不仅能产生整洁、可重用的代码，它还有一个很酷的名字：原子样式。你将在样式缩略图时使用这种方法，然后是缩略图布局。在下一章中，你将处理整个网站的布局。\n\
  \n## 创建样式基准\n\n你将从向项目添加 `normalize.css` 文件开始。`normalize.css` 帮助你编写的 CSS 在不同浏览器中显示一致。所有浏览器都自带一套默认样式，但不同浏览器之间的默认值不同。`normalize.css`\
  \ 为网站或应用程序开发自定义 CSS 提供了一个良好的起点。\n\n`normalize.css` 在线免费获取。你不需要下载它。要将其添加到 Ottergram，你只需要在\
  \ `index.html` 中链接它。\n\n为了确保你使用的是最新版本的 `normalize.css`，你将从内容共享网站获取其地址。访问 `cdnjs.com/libraries/normalize/`\
  \ 并找到以 `.min.css` 结尾的文件。（此版本比其他版本小，删除了多余空白。）点击 `Copy` 按钮复制其地址（图 3.2）。\n\n**图 3.2�\
  \  从 cdnjs.com 获取 `normalize.css`**\n\n\n\n\n\n![从 cdnjs.com 获取 normalize.css 的链接](img/normalize-cdn.png)\n\
  \n写作时的版本为 3.0.3，但你使用的版本可能更高。\n\n在 `Atom` 中打开你的 Ottergram 文件夹，然后打开 `index.html`。添加\
  \ `<link>` 标签并粘贴地址。（在下面的代码中，`<link>` 标签为了适应页面被分成了两行。你可以让它保持单行。）\n\n```\n<!doctype\
  \ html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>ottergram</title>\n\
  \    <link rel=\"stylesheet\"\n      href=\"https://cdnjs.cloudflare.com/ajax/libs/normalize/3.0.3/normalize.min.css\"\
  >\n    <link rel=\"stylesheet\" href=\"styles.css\">\n  </head>\n```\n\n确保你在 `styles.css`\
  \ 的 `<link>` 标签之前添加 `normalize.css` 的 `<link>` 标签。浏览器需要先读取 `normalize.css` 中的样式。就这样这样，你的项目就可以利用这个工具了。不需要进行其他设置。你可能会奇怪为什么你要链接到一个完全不同服务器上的地址。事实上，HTML\
  \ 文件指定不同服务器上的资源并不不寻常（图 3.3）。\n\n### 图 3.3 从不同的服务器请求资源\n\n![从不同的服务器请求资源](img/request-multiple-servers.png)\n\
  \n在这种情况下，`normalize.css` 托管在 `cdnjs.com` 上，这是一个内容分发网络中的公共服务器。CDN 在全球都有服务器，每台服务器都有相同文件的副本。当用户请求文件时，他们会从最近的服务器接收，从而缩短该文件的加载时间。cdnjs.com\
  \ 托管了许多流行前端库和框架的版本。\n\n## 为样式化准备 HTML\n\n在上一章中，你创建了一个名为 `styles.css` 的样式表，在本章中你将向其中添加许多\
  \ CSS 样式规则。但在添加样式之前，你需要设置 HTML，以便你的样式规则有可以引用的目标。你将添加 `class` 属性，将带有水獭名称的 `span`\
  \ 元素标识为“缩略图标题”。`class` 属性是识别一组 HTML 元素的方法，通常用于样式化。你的“缩略图标题” `class` 将允许你一次性轻松设置所有名称。\n\
  \n在 `index.html` 中，为 `li` 元素内部的 `span` 添加 `thumbnail-title` 类名作为属性，如下所示：\n\n```\n\
  ...\n    <ul>\n      <li>\n        <a href=\"#\">\n          <img src=\"img/otter1.jpg\"\
  \ alt=\"the Otter\">\n          <span>Barry</span>\n          <span class=\"thumbnail-title\"\
  >Barry</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"#\">\n \
  \         <img src=\"img/otter2.jpg\" alt=\"the Otter\">\n          <span>Robin</span>\n\
  \          <span class=\"thumbnail-title\">Robin</span>\n        </a>\n      </li>\n\
  \      <li>\n        <a href=\"#\">\n          <img src=\"img/otter1.jpg\" alt=\"\
  the Otter\">\n          <span>Maurice</span>\n          <span class=\"thumbnail-title\"\
  >Maurice</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"#\">\n\
  \          <img src=\"img/otter4.jpg\" alt=\"the Otter\">\n          <span>Lesley</span>\n\
  \          <span class=\"thumbnail-title\">Lesley</span>\n        </a>\n      </li>\n\
  \      <li>\n        <a href=\"#\">\n          <img src=\"img/otter5.jpg\" alt=\"\
  the Otter\">\n          <span>Barbara</span>\n          <span class=\"thumbnail-title\"\
  >Barbara</span>\n        </a>\n      </li>\n    </ul>\n...\n```\n\n稍后，你将使用这个类名为所有图片标题设置样式。\n\
  \n## 样式的结构\n\n当你创建单独样式时，是通过编写样式规则来实现的，这些规则由两个主要部分组成：选择器 `selectors` 和声明声明 `declarations`）（图\
  \ 3.4）。\n\n### 图 3.4 样式规则的结构\n\n![样式规则的结构](img/anatomy-of-a-style-declaration.png)\n\
  \n样式规则的第一部分是一个或多个选择器。选择器描述了样式应该应用的元素，例如 `h1`、`span` 或 `img`。但选择器不仅限于标签名。你可以通过增加选择器的\
  \ `specificity`（特殊性）来编写适用于更具针对性的元素集的选择器。\n\n例如，你可以根据属性编写选择器——例如你刚刚添加到 `span` 标签上的\
  \ `thumbnail-title` 类属性。基于属性的选择器比基于元素名的选择器更具体。\n\n除了可以确保样式仅应用于特定的元素集（例如，具有类名 `thumbnail-title`\
  \ 的元素对比所有 `span` 元素）之外，特殊性还决定了选择器的相对优先级。如果一个样式表包含多个可以应用于同一个元素的样式，则将使用选择器特殊性较高的样式，而不是选择器特殊性较低的样式。你可以在本章末尾的“好奇进阶”章节中阅读更多关于特殊性的知识。\n\
  \n在本章中，你将接触许多具有不同特殊性的选择器。虽然有很多方法可以针对同一个元素，但理解特殊性是选择最佳选择器的关键，这样你的样式才是可维护的。\n\n样式规则的第二部分是声明块，定义了要应用的样式。块中的每个声明都包含一个属性名称和该属性的值。\n\
  \n在你的第一个样式规则中，你将使用刚刚添加的 `class` 属性作为选择器应用样式。\n\n## 你的第一个样式规则\n\n要在样式规则中使用 `class`\
  \ 作为选择器，需要在类名前面加一个点（period），例如 `.thumbnail-title`。你将添加的首批样式将设置 `thumbnail-title`\
  \ 类的背景和前景颜色。\n\n打开 `styles.css` 并添加你的样式规则：\n\n```css\n.thumbnail-title {\n  background:\
  \ rgb(96, 125, 139);\n  color: rgb(202, 238, 255);\n}\n```\n\n你将在本章稍后学习更多关于颜色的知识。现在只需查看你的更改。保存\
  \ `styles.css` 并确保 `browser-sync` 正在运行。如果你需要重启它，命令是：\n\n```\nbrowser-sync start\
  \ --server --browser \"Google Chrome\"\n                   --files \"stylesheets/*.css,\
  \ *.html\"\n```\n\n将在 Chrome 中打开你的网页（图 3.5）。\n\n### 图 3.5 稍微彩色 Ottergram\n\n![稍微彩色\
  \ Ottergram](img/look-colors.png)\n\n你可以看到你已经将缩略图标题的背景设置为深蓝色，字体颜色设置为浅蓝色。很好。\n\n\
  继续为缩略图标题：返回 `styles.css` 并在现有的 `.thumbnail-title` 类样式规则中添加，如下所示：\n\n```css\n.thumbnail-title\
  \ {\n  display: block;\n  margin: 0;\n  padding: 4px 10px;\n\n  background: rgb(96,\
  \ 125, 139);\n  color: rgb(202, 238, 255);\n}\n```\n\n\n\n\n\n你添加的三个声明都会影响元素的 `box`（盒）。对于每一个具有视觉呈现的\
  \ HTML 标签，浏览器都会在页面上绘制一个矩形。浏览器使用一种名为`标准盒模型”（或直接称为“盒模型”）的方案来确定该矩形的尺寸。\n\n### 盒模型\n\
  \n为了理解盒模型，你将查看它开发者工具（DevTools）中的表示。保存 `styles.css`，切换到 `Chrome`，并确保开发者工具已打开（图 3.6）。\n\
  \n**图 3.6 探索盒模型**\n\n![探索盒模型](img/opened-after-linking-css.png)\n\n点击元素面板左上角的![探索盒模型](img/inspect-element-icon.png)按钮。这是`检查元素`按钮。现在，将光标移动到网页上的“ottergram”单词上。当你悬停在单词单词上时，开发者工具会用一个蓝色和桃红色的矩形框住标题（图\
  \ 3.7）。\n\n**图 3.7 悬停在标题上**\n\n![悬停在标题上](img/heading-being-inspected.png)\n\n点击网页上的单词“ottergram”。尽管你不再看到彩色的叠加层，但该元素现在已被选中，元素面板中的\
  \ DOM 树视图将展开并突出显示相应的 `h1` 标签。\n\n元素面板右下角的矩形图表示 `h1` 元素的盒模型。你可以看到，图中的某些区域与你检查标题时覆盖在标题上的矩形具有某些相同的颜色（图\
  \ 3.8）。\n\n**图 3.8 查看元素的盒模型**\n\n![查看元素的盒模型](img/box-model.png)\n\n盒模型包含了为元素绘制的矩形的四个方面（开发者工具在图中用四种不同的颜色渲染它们）。\n\
  \n- content（显示为蓝色）：视觉内容——在这里是文本\n- padding（内边距，显示为绿色）：内容周围的透明空间\n- border（边框，显示为黄色）：内容和内边距周围的边界\n\
  - margin（外边距，显示为桃红色）：边框周围的透明空间\n\n图 3.8）中的数字是 `pixel`（像素）值；像素是计算机屏幕上可以显示单色的最小矩形区域的单位。对于\
  \ `h1` 元素，内容区域分配了 197 像素乘以 54 像素的（你的值可能不同，取决于浏览器窗口的大小）。左侧有 40 像素的内边距。边框设置为 0，元素上下有\
  \ 16 像素的外边距。\n\n那个外边距值是从哪里来的？每个浏览器都提供了一个默认样式表，称为`user agent stylesheet`代理样式表），以防\
  \ HTML 文件未指定样式。你指定的样式会覆盖默认值。由于你没有为 `h1` 元素的盒指定值，因此应用了默认样式。\n\n现在，你准备好理解你添加的样式声明了：\n\
  \n```\n.thumbnail-title {\n  display: block;\n  margin: 0;\n  padding: 4px 10px;\n\
  \n  background: rgb(96, 125, 139);\n  color: rgb(202, 238, 255);\n}\n```\n\n`display:\
  \ block` 更改了所有类为 `.thumbnail-title` 的元素的盒，使其占据其父容器元素允许的整个宽度。（注意图 3.6 所示，标题的背景颜色现在覆盖了更宽的区域）。其他的\
  \ `display` 值，例如你之后将看到的 `display: inline` 属性，会让元素的宽度适应其内容。\n\n你还将将缩略标题的外边距设置为 0，并将内边距设置为两个不同的值：4px\
  \ 和 10px（`px` 是“pixels”的缩写）。这把内边距设置为特定的像素值，覆盖了代理样式表设置的默认尺寸。\n\n内边距、外边距以及某些其他样式可以写为`简写属性`，其中一个值被应用于多个属性。你在这里利用了这一点：当为内边距提供两个值时，第一个值应用于两个垂直方向（顶部和底部），第二个值应用于水平方向。\n\
  \n### 样式继承\n\n接下来，你将添加样式来更改文本的大小和外观。在 `styles.css` 中添加一条新的样式规则，为 `body` 设置字体大小。要做到这一点，你将使用不同类型的选择器——`元素选择器`，通过使用元素的名称。\n\
  \n```\nbody {\n  font-size: 10px;\n}\n\n.thumbnail-title {\n  display: block;\n\
  \  margin: 0;\n  padding: 4px 10px;\n\n  background: rgb(96, 125, 139);\n  color:\
  \ rgb(202, 238, 255);\n}\n```\n\n这条样式规则将 `body` 的 `font-size` 设置为 `10px`。你很少会在样式表中使用元素选择器，因为你通常不会想对特定标签的所有出现应用完全相同的样式。使用它们意味着你可能会在样式表中重复编写相同的声明。但在这种情况下，针对\
  \ `body` 元素的特殊性恰好。只有一个 `<body>` 元素，而且你不会复用它的样式。\n\n保存 `styles.css` 并在 `Chrome` 中查看你的网页（图\
  \ 3.9）。\n\n**图 3.9 设置字体大小**\n\n![设置字体大小](img/ottergram-with-10px-font.png)\n\n你的标题和缩略标题都变小了。你可能预到了这一点，也可能没有。虽然标题直接位于你声明\
  \ `font-size` 属性的 `body` 元素内，但缩略标题不是。它们嵌套了许多层。然而，许多样式（包括字体大小）会被应用于样式规则指定的元素以及这些元素的`后代`。\n\
  \n你文档的结构可以使用树形图来描述，如图 3.10 所示。将元素表示为树是可视化 DOM 的良好方法。\n\n**图 3.10 简化的 Ottergram 结构**\n\
  \n![简化的 Ottergram 结构](img/ottergram-dom.png)\n\n包含元素的元素被称为元素的后代。在这种情况下，你的 `span`\
  \ 都是 `body`（以及 `ul` 及其相应的 `li`）的后代，因此它们继承了 `body` 的 `font-size` 样式。\n\n\n\n\n\n\
  在 DevTools 的 DOM 树视图中，找到并选择一个 `span` 元素。在样式面板中，注意标记为 `<samp class=\"guilabel\">Inherited\
  \ from a</samp>`、`<samp class=\"guilabel\">Inherited from li</samp>` 和 `<samp class=\"\
  guilabel\">Inherited from ul</samp>` 的框。这三个区域如所示，显示了从用户代理样式表（user agent stylesheet）在每一层继承的样式。在`<samp\
  \ class=\"guilabel\">Inherited from body</samp>` 下，你可以看到 `font-size` 属性已从 `styles.css`\
  \ 中为 `body` 元素设置的集（图 3.11）。\n\n**图 3.11 从祖先元素继承的样式**\n\n![从祖先元素继承的样式](img/devtools-demo-cascade.png)\n\
  \n如果在另一个层级（例如 `ul`）设置了不同的字体大小会怎样？来自更近祖先元素的样式具有优先级，因此在 `styles.css` 中为 `ul` 设置的字体大小将覆盖为\
  \ `body` 设置的，而为 `span` 元素本身设置的字体大小将同时覆盖两者。\n\n要查看这一点，请点击 DOM 树视图中的 `ul` 元素。这将允许你尝试尝试样式。你在这里添加的样式将立即反映在网页视图中，但不会添加到你的实际项目文件中。\n\
  \n在元素面板中样式面板的顶部，你会看到一个标记为 `elements.style` 的区域。点击 `elements.style` 花括号之间的任何位置，DevTools\
  \ 都会给出一个提示（图 3.12）。\n\n**图 3.12 输入样式规则提示**\n\n![输入样式规则提示](img/elements-style-prompt.png)\n\
  \n开始输入 `font-size`，DevTools 将为你建议可能的补全选项（图 3.13）。\n\n**图 3.13 样式面板中的自动补全选项**\n\n\
  ![样式面板中的自动补全选项](img/begin-typing-font-size.png)\n\n选择 `font-size`，然后按 Tab 键。输入一个大值，例如\
  \ `50px`，并按 Return。你可能需要滚动页面，但你会发现 `ul` 的 `font-size` 已经覆盖了 `body` 的（图 3.14）。\n\n\
  **图 3.14 为 `ul` 设置 50px 的 `font-size`**\n\n![为 ul 设置 50px 的 font-size](img/scroll-big-font.png)\n\
  \n并不是所有的样式属性都是继承的——例如，`border` 就不是。要确定某个属性是否被继承，请参考该属性的 MDN 参考页面。\n\n回到 `styles.css`，更新\
  \ `.thumbnail-title` 类的声明块，以覆盖 `body` 的 `font-size` 并使用更大的字体。\n\n```css\nbody {\n\
  \  font-size: 10px;\n}\n\n.thumbnail-title {\n  display: block;\n  margin: 0;\n\
  \  padding: 4px 10px;\n\n  background: rgb(96, 125, 139);\n  color: rgb(202, 238,\
  \ 255);\n\n  font-size: 18px;\n}\n```\n\n对于类 `.thumbnail-title` 的元素，你将字体大小更改为了 18\
  \ 像素。\n\n保存 `styles.css`  `Chrome` 中欣赏你的缩略图标题（图 3.15）。\n\n**图 3.15 样式化的缩略图标题**\n\
  \n![样式化的缩略图标题](img/thumbnail-title-box.png)\n\n它们看起来很好，但用户代理样式表正在为 `.thumbnail-title`\
  \ 元素添加下划线。这是因为你将它们（以及 `.thumbnail-image` 元素）封装在了锚点标签中，使它们继承了下划线样式。\n\n你不需要这些下划线，因此你将通过在\
  \ `styles.css` 的新样式中更改锚点标签的 `text-decoration` 属性来移除它们。为此规则使用什么选择器？\n\n如果你确定要移除缩略图标题`<samp\
  \ class=\"emphasis\">以及 Ottergram 中任何其他锚点元素</samp>` 的下划线，你可以直接使用元素选择器：\n\n```css\n\
  a {\n  /* style declaration */\n}\n```\n\n（`/* */` 之间的文本是 CSS `<samp class=\"firstterm\"\
  >注释</samp>`。浏览器会忽略代码注释；它们允许开发者在代码中记录以便将来参考。）\n\n如果你认为可能将锚点用于其他用途（并希望对其进行不同的样式处理），可以将元素选择器与`<samp\
  \ class=\"firstterm\">属性选择器</samp>` 配对，如下：\n\n```css\na {\n  /* style declaration\
  \ */\n}\n```\n\n此选择器将匹配具有 `href` 属性的元素。当然，锚点元素通常都有 `href` 属性，因此可能不够精确到仅匹配目标。为了使属性选择器更精确，你还可以指定属性的值，如下：\n\
  \n```css\na[href=\"#\"] {\n  /* style declaration */\n}\n```\n\n此选择器将匹配 `href` 属性值为\
  \ `#` 的锚元素。\n\n顺便说一下，你也可以单独使用带不值的属性选择器，例如：\n\n```css\n[href] {\n  /* style declaration\
  \ */\n}\n```\n\n碰巧，Ottergram 是一个非常简单的项目，你实际上不会在缩略图和标题以外的地方使用标签。因此，使用元素选择器是安全的，而且你应该这样做，因为它是最直接的解决方案。\n\
  \n在 `styles.css` 中添加新的样式声明：\n\n```css\nbody {\n  font-size: 10px;\n}\n\na {\n  text-decoration:\
  \ none;\n}\n\n.thumbnail-title {\n  ...\n}\n```\n\n保存文件并检查浏览器。下划线消失了，你的缩略图标题也变得精美了（图\
  \ 3.16）。\n\n**图 3.16 设置 `text-decoration` 为 `none` 后**\n\n![设置 text-decoration 为\
  \ 后](img/removed-text-decoration.png)\n\n注意，你不应该移除正文中链接的下划线——即不是明显的标题、标题或说明的文本。链接的下划线是预期的重要视觉指示。你在这里这样做是因为缩略图不需要同样的视觉提示。用户会合理认为它们是可以点击的。\n\
  \n在本章的剩余部分，你将使用类选择器来为缩略图图像、无序列表、列表项（包括缩略图及其标题）以及页眉设置样式。先为 `index.html` 中的 `h1`、`ul`、`li`\
  \ 和 `img` 元素添加类名以备之用。\n\n\n\n\n\n```html\n...\n  </head>\n  <body>\n    <header>\n\
  \      <h1>ottergram</h1>\n      <h1 class=\"logo-text\">ottergram</h1>\n    </header>\n\
  \    <ul>\n    <ul class=\"thumbnail-list\">\n      <li>\n      </li>\n      <li\
  \ class=\"thumbnail-item\">\n        <a href=\"#\">\n          <img src=\"img/otter1.jpg\"\
  \ alt=\"Barry the Otter\">\n          <img class=\"thumbnail-image\" src=\"img/otter1.jpg\"\
  \ alt=\"Barry the Otter\">\n          <span class=\"thumbnail-title\">Barry</span>\n\
  \        </a>\n      </li>\n      <li>\n      </li>\n      <li class=\"thumbnail-item\"\
  >\n        <a href=\"#\">\n          <img src=\"img/otter2.jpg\" alt=\"Robin the\
  \ Otter\">\n          <img class=\"thumbnail-image\" src=\"img/otter2.jpg\" alt=\"\
  Robin the Otter\">\n          <span class=\"thumbnail-title\">Robin</span>\n   \
  \     </a>\n      </li>\n      <li>\n      </li>\n      <li class=\"thumbnail-item\"\
  >\n        <a href=\"#\">\n          <img src=\"img/otter3.jpg\" alt=\"Maurice the\
  \ Otter\">\n          <img class=\"thumbnail-image\" src=\"img/otter3.jpg\" alt=\"\
  Maurice the Otter\">\n          <span class=\"thumbnail-title\">Maurice</span>\n\
  \        </a>\n      </li>\n      <li>\n      </li>\n      <li class=\"thumbnail-item\"\
  >\n        <a href=\"#\">\n          <img src=\"img/otter4.jpg\" alt=\"Lesley the\
  \ Otter\">\n          <img class=\"thumbnail-image\" src=\"img/otter4.jpg\" alt=\"\
  Lesley the Otter\">\n          <span class=\"thumbnail-title\">Lesley</span>\n \
  \       </a>\n      </li>\n      <li>\n      </li>\n      <li class=\"thumbnail-item\"\
  >\n        <a href=\"#\">\n          <img src=\"img/otter5.jpg\" alt=\"Barbara the\
  \ Otter\">\n          <img class=\"thumbnail-image\" src=\"img/otter5.jpg\" alt=\"\
  Barbara the Otter\">\n          <span class=\"thumbnail-title\">Barbara</span>\n\
  \        </a>\n      </li>\n    </ul>\n...\n```\n\n通过为这些元素添加类名，你为你将要添加的样式设定了目标。\n\
  \n我们更倾向于使用类选择器而不是其他的选择器，你也应该这样做。你可以编写非常具描述性的类名，使你的代码易于开发和维护。此外，你还可以为元素添加多个类名，使它们成为样式化的灵活且强大的工具。\n\
  \n在继续之前，请确保保存 `index.html`。\n\n## 让图片适应窗口\n\n遵循原子样式模式，接下来是需要进行样化的图片。它们太大了，除非浏览器窗口也很大，否则它们会被裁剪。在\
  \ `styles.css` 中为 `.thumbnail-image` 添加样式规则，使缩略图适应窗口：\n\n```css\n...\na {\n  text-decoration:\
  \ none;\n}\n\n.thumbnail-image {\n  width: 100%;\n}\n\n.thumbnail-title {\n  ...\n\
  }\n```\n\n你将 `width` 设置为 `100%`，这将其限制在容器的宽度内。这意味着当你加宽浏览器窗口时，图片会按比例变大。尝试一下：保存 `styles.css`，切换到浏览器，并放大和缩小你的浏览器窗口。图片会随着浏览器窗口同步放大和缩小，始终保持比例。图\
  \ 3.17 显示了在一个较窄和一个较较宽的浏览器窗口中的 Ottergram。\n\n**图 3.17 按宽度调整图片**\n\n![按宽度调整图片](img/constrained-width.png)\n\
  \n如果你仔细观察，`.thumbnail-title` 周围的间距是不正确的，导致标题看起来和它们下方的图片在了一起。在 `styles.css` 中通过将\
  \ `.thumbnail-image` 的 `display` 属性设置为 `block` 来修复这个问题。\n\n```css\n...\n.thumbnail-image\
  \ {\n  display: block;\n  width: 100%;\n}\n...\n```\n\n现在，图片与其标题之间的空格消失了（图 3.18）。\n\
  \n**图 3.18 设置 `.thumbnail-image` 为 `display: block` 后**\n\n![设置 .thumbnail-image\
  \ 为 display: block 后](img/fixed-li-spacing-display-block.png)\n\n为什么这样做有效？图片默认是\
  \ `display: inline`。它们遵循与文本相似的渲染规则。当文本被渲染时，字母沿着共同的基线（baseline）绘制。某些字符，如 `p`、`q`\
  \ 和 `y`，具有“下降部”（descender）——即超出此基线的尾巴。为了容纳这些字符，基线下方会留了一些空白。\n\n将 `display` 属性设置为\
  \ `block` 会移除空白，因为不需要容纳任何文本（或任何可能与图片并排渲染的 `display: inline` 元素）。\n\n## 颜色\n\n是时候深入探索颜色了。在\
  \ `styles.css` 中为 `body` 元素和 `.thumbnail-item` 类添加以下颜色样式：\n\n```css\nbody {\n  font-size:\
  \ 10px;\n  background: rgb(149, 194, 215);\n}\n\na {\n  text-decoration: none;\n\
  }\n\n.thumbnail-item {\n  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n}\n```\n\
  \n你为 `.thumbnail-item` 的边框声明了两次值。为什么？注意到这两个声明使用了不同的颜色函数：`rgb` 和 `rgba`。`rgba` 颜色函数接受第四个参数，即透明度。某些浏览器不支持\
  \ `rgba`，因此提供两个声明是一种回退（fallback）机制。\n\n所有浏览器都会看到第一个声明（rgb）并注册值。不支持 `rgba` 的浏览器会忽略第二个声明。支持\
  \ `rgba` 的浏览器将使用第二个声明并丢弃第一个。\n\n（好奇 `body` 的背景颜色是用整数定义的，而 `.thumbnail-item` 的边框颜色是用百分比定义的吗？稍后我们会回来讨论。）\n\
  \n保存 `styles.css` 并切换到浏览器（图 3.19）。\n\n**图 3.19 背景与边框**\n\n![背景与边框](img/thumbnail-item-border-width.png)\n\
  \n在开发工具中，你可以看到 Chrome 支持 `rgba`。它通过划掉样式表示 `rgb` 颜色未被使用（图 3.20）。\n\n**图 3.20 使用 rgba**\n\
  \n![使用 rgba](img/inheritance-crossout.png)\n\n现在，仍然在开发工具中，请选择 `body`。在样式面板中，注意你刚刚添加的背景颜色声明。RGBA\
  \ 值左侧有一个小正方形，显示了颜色的外观。\n\n点击那个正方形，会打开颜色选择器（图 3.21）。颜色选择器允许你选择颜色，并以多种格式提供 CSS 颜色值。\n\
  \n**图 3.21 样式面板中的颜色选择器**\n\n![样式面板中的颜色选择器](img/color-picker.png)\n\n要以不同的颜色格式查看背景颜色，点击\
  \ RGBA 值右侧的向上和向下箭头。可以在 HSLA、HEX 和 RGBA 格式之间切换。\n\nHSLA 格式（代表色相、饱和度、亮度透明度）的使用频率比其他格式低，部分是因为一些流行的设计工具没有提供适用于\
  \ CSS 的准确 HSLA 值。如果你对 HSLA 感兴趣，请访问 [css-tricks.com/examples/HSLaExplorer](https://css-tricks.com/examples/HSLaExplorer)\
  \ 查看 HSLA 探索器。\n\n\n\n\n\n查看背景色的 HEX 值：`#95C2D7`。HEX（或十六进制）是最古老的颜色规范格式。每个数字都代表一个从\
  \ 0 到 15 之间的值。（如果你不熟悉十六进制，这是通过包含 A 到 F 字符作为数字来实现的。）每对数字则可以表示一个从 0 到 255 之间的值。从左到右，这些数字对对应于指定颜色中红、绿、蓝的强度（图\
  \ 3.22]）。\n\n**图 3.22 HEX 值对应红色、绿色和蓝色值**\n\n![HEX 值对应红色、绿色和蓝色值](img/hex-diagram.png)\n\
  \n许多人认为 HEX 颜色并不直观。一种现代的替代方案是使用 RGB（红、绿、蓝）值。在这一模型中，每种颜色也被分配了一个从 0 到 255 之间的值，但这些值用更熟悉的十进制数表示，并用颜色隔开。如前所述，对于功能更强大的浏览器，第四个值可以指定指定颜色的透明度，范围从\
  \ 0.0（完全透明）到 1.0（完全不透明）。该透明度正式被称为 <samp class=\"firstterm\">alpha</samp> 值 ——因此\
  \ RGBA 中的 A 代表它。`body` 背景色的 RGBA 值为 `(149, 194, 215, 1)`。\n\n除了为红、绿、蓝声明整数值外，你也可以使用百分比，就像你为\
  \ `.thumbnail-item` 边框做的那样。这两个选项在功能上没有区别。只需不要在同一个声明中混合百分比和整数即可。\n\n顺便提一下，为了帮助选择好看的配色方案，Adobe\
  \ 在 [<samp class=\"uri\">color.adobe.com</samp>](https://color.adobe.com/) 提供了一个免费的在线工具。\n\
  \n## 调整项目之间的间距\n\nOttergram 现在有一些漂亮的颜色，让人联想到海獭的海园。但添加颜色后，`.thumbnail-item` 元素的边框内部出现了一些不需要的空白。此外，那些讨厌的项目项目符号分散了人们对海獭光彩的注意力。\n\
  \n要去掉项目符号，请在 <samp class=\"filename\">styles.css</samp> 中将 `.thumbnail-list` 的 `list-style`\
  \ 属性设置为 `none`：\n\n```\n...\n.thumbnail-item {\n  border: 1px solid rgb(100%, 100%,\
  \ 100%);\n  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n}\n\n.thumbnail-list\
  \ {\n  list-style: none;\n}\n\n.thumbnail-image {\n  ...\n}\n```\n\n要消除空白，你将使用处理\
  \ `.thumbnail-image` 时相同的技术。每个 `.thumbnail-item` 默认都有该空白以适应列表中的项目，就像 `.thumbnail-image`\
  \ 元素有空白以适应相邻文本一样。为 `.thumbnail-item` 添加 `display: block` 声明来移除它。\n\n```\n...\n.thumbnail-item\
  \ {\n  display: block;\n  border: 1px solid rgb(100%, 100%, 100%);\n  border: 1px\
  \ solid rgba(100%, 100%, 100%, 0.8);\n}\n...\n```\n\n通过这些添加，项目符号和图像上方的多余空间消失了，形成了更精美的布局，如图\
  \ 3.23 所示。\n\n**图 3.23 改进的布局**\n\n![改进的布局](img/whitespace-removed.png)\n\n如果你不需要项目符号，为什么要使用项目符号列表？最好的方法是根据\
  \ HTML 标签的含义而不是浏览器如何对其进行默认样式来选择。在这种情况下，你需要一个图像的无序列表，因此 `ul` 是正确的选择。当你向 第 4 章 中的项目添加详细细节图像时，用于图片的\
  \ `ul` 容器将允许你将其样式化为滚动列表。浏览器默认用项目符号表示 `ul` 这一点并不重要，因为它们很容易被移除。\n\n接下来，你将调整列表项目的间距。单独的\
  \ `.thumbnail-item` 元素之间没有间距。你将在相邻的缩略图之间添加边距（margin）。\n\n然而，你不想为*所有*列表项目添加边距。为什么呢？因为标题已经有了边距，所以第一个列表项目不需要。这意味着你不能直接使用\
  \ `.thumbnail-item` 类选择器，至少不能单独使用它。相反，你将使用根据元素与其他元素之间关系来目标元素的选择器语法。\n\n### 关系选择器\n\
  \n再次查看图 3.10 中的项目图表。它看起来非常像家族树，不是吗？这种相似性为这组关系选择器命名：<samp class=\"firstterm\">后代选择器</samp>、<samp\
  \ class=\"firstterm\">子级选择器</samp>、<samp class=\"firstterm\">兄弟选择器</samp> 和 <samp\
  \ class=\"firstterm\">相邻兄弟选择器</samp>。\n\n关系选择器语法包含两个选择器（如类选择器或元素选择器），它们由一个名为 <samp\
  \ class=\"firstterm\">组合符</samp> 的符号连接，该组合符决定了它们之间的目标关系。要理解关系选择器如何工作，重要的是记住浏览器是从*右到左*读取选择器语法的。让我们看一些例子。\n\
  \n后代选择器针对是另一个指定元素的后代的任何类型元素。例如，要选择 `body` 元素的后代的任何 `span` 元素，语法为：\n\n```\nbody span\
  \ {\n  /* 样式声明 */\n}\n```\n\n此语法没有使用组合符。由于它是从右到左读取的，它针对任何来自 `body` 的 `span`，在当前代码中这意味着缩略图标题。它还会影响可能在\
  \ `header` 或其他地方添加的任何 `span`。\n\n注意，你也可以在关系选择器中使用类选择器（或属性选择器，或任何类型的选择器），因此上面的选择器也可以写成：\n\
  \n```\nbody .thumbnail-title {\n  /* 样式声明 */\n}\n```\n\n子级选择器针对是另一个元素直接孩子的指定类型元素。子级选择器语法使用组合符\
  \ `>`。要使用子级选择器针对 Ottergram 中所有的 `span`，语法为：\n\n```\nli > span {\n  /* 样式声明 */\n\
  }\n```\n\n从右到左读取，此选择器针对是 `li` 的直接孩子的 `span` —— 再次缩略图标题。\n\n兄弟选择器语法使用组合符 `~`。正如你预期的，这种语法针对具有相同父元素的元素。然而，由于关系选择器的方向性，结果可能并不如你所愿。考虑这个例子：\n\
  \n```\nheader ~ ul {\n  /* 样式声明 */\n}\n```\n\n此选择器针对位于相同父元素的 `header` 之前的任何 `ul`。此选择器会有效地针对\
  \ Ottergram 的 `ul`，因为它在代码中前面有一个兄弟 `header`。然而，反转语法（`ul ~ header`）会导致没有元素被选中，因为没有位于兄弟\
  \ `ul` 之前的 `header`。\n\n最后的关系选择器类型是相邻兄弟选择器，它针对*紧邻*指定类型兄弟之前的元素。相邻兄弟组合符为 `+`：\n\n\
  ```\nli + li {\n  /* 样式声明 */\n}\n```\n\n此语法将选择所有紧邻兄弟 `li` 之前的 `li` 元素。结果是声明的样式将应用到第二个到第五\
  \ `li` —— 但不是第一个，因为它的前面没有另一个 `li`。（注意，由于 Ottergram 相对简单的结构，目前通用兄弟选择器和相邻兄弟选择器的效果相同。）\n\
  \n\n\n\n回到正要的任务：为每个列表项添加顶部边距，第一个除外。如果你使用后选择器或子选择器来定位 `.thumbnail-item` 类或 `span`\
  \ 或 `li` 元素，那么边距将应用于所有五个缩略图。由于你想对第一个以外的所有项设置样式，请在 `styles.css` 中使用相邻兄弟语法，仅为那些紧跟在另一个缩略图之后的缩略图添加顶部边距。\n\
  \n```\n...\na {\n  text-decoration: none;\n}\n\n.thumbnail-item + .thumbnail-item\
  \ {\n  margin-top: 10px;\n}\n\n.thumbnail-item {\n  ...\n```\n\n保存文件并在浏览器中查看结果（图\
  \ 3.24）。\n\n**图 3.24  相邻 `.thumbnail-item` 元素之间的间距**\n\n![相邻 .thumbnail-item 元素之间的间距](img/adjacent-spacing.png)\n\
  \n请注意，开发者工具（DevTools）提供了一种查找元素嵌套路径的简单方法，这有助于编写关系选择器。如果你点击 `li` 元素内部的某个 `span` 元素，可以在元素面板的底部看到它的路径（图\
  \ 3.25）。\n\n**图 3.25  元素面板显示的嵌套路径**\n\n![元素面板显示的嵌套路径](img/selector-path.png)\n\n\
  为了对缩略图列表的外观进行最后一次微调，返回 `styles.css` 并覆盖 `ul` 继承自用户代理样式表的内内边距（padding），使得图像不再有缩进。\n\
  \n```\n...\n.thumbnail-list {\n  list-style: none;\n  padding: 0;\n}\n...\n```\n\
  \n像往常一样，保存文件并切换到浏览器查看结果（图 3.26）。\n\n**图 3.26  去除了内边距的 ul**\n\n![去除了内边距的 ul](img/removed-ul-padding.png)\n\
  \nOttergram 看起来开始精美了。通过为标题添加一些样式，你将拥有一个漂亮的静态网页。\n\n## 添加字体\n\n早些，你为 `h1` 元素添加了 `.logo-text`\
  \ 类。使用该类作为 `styles.css` 中新样式规则的选择器。将它插入到锚点标签（anchor tag）样式之后。（通常情况下，只有当你对同一个选择器有多个规则集时，样式的顺序才重要。在\
  \ Ottergram 中，样式的排列与它们在代码中出现的顺序大致一致。这取决于个人喜好，你可以根据自己的需要组织样式。）\n\n```\n...\na {\n\
  \  text-decoration: none;\n}\n\n.logo-text {\n  background: white;\n\n  text-align:\
  \ center;\n  text-transform: uppercase;\n  font-size: 37px;\n}\n\n.thumbnail-item\
  \ + .thumbnail-item {\n  ...\n```\n\n首先，你为标题设置了白色背景。然后，你在 `.logo-text` 元素内部居中了文本，并使用\
  \ `text-transform` 属性将其格式化为大写。最后，你设置了字体大小。你的结果看起来将像 图 3.27）。\n\n**图 3.27  标题样式化**\n\
  \n![标题样式化](img/plain-header.png)\n\nOttergram 看起来极了。很棒……但对于一个有*水獭*的网站来说，有点单调。为了增添一些活力，你可以为标题使用除用户代理样式表提供的字体以外的字体。\n\
  \n我们在你已经下载并添加到项目目录的资源文件中包含了一些字体。要使用它们，你需要将 `fonts` 文件夹复制到你的项目中。将其放置在你的 `stylesheets`\
  \ 文件夹*内部*（图 3.28）。\n\n**图 3.28  stylesheets 文件夹内的 fonts 文件夹**\n\n![stylesheets 文件夹内的\
  \ fonts 文件夹](img/fonts-inside-stylesheets.png)\n\n现在你只需要将某些样式指向这些字体。\n\n资源文件包含了每种字体的多种格式。如既往，不同的浏览器厂商支持不同类型的字体。为了支持最广泛的浏览器，你需要将它们全部包含在项目中。是的，全部包含。\n\
  \n为了帮助你，`@font-face` 语法允许你为字体族指定自定义名称，然后你可以在样其余部分使用它。`@font-face` 块与你使用的块稍有不同。`@font-face`\
  \ 块包含三个主要部分：\n\n*   首先是 `font-family` 属性，其值是一个字符串，用于识别你可以在样式其他部分使用的自定义名称。\n*   接下来是几个\
  \ `src` 声明，指定不同的字体文件。\n*   最后是修改字体的声明，例如 `font-weight` 和 `font-style`。\n\n在 `styles.css`\
  \ 顶部为 `lakeshore` 字体族添加 `@font-face` 声明并使用该自定义字体。\n\n```\n@font-face {\n    font-family:\
  \ 'lakeshore';\n    src: url('fonts/lakeshore.eot') format('opentype'),\n      \
  \   url('fonts/lakeshore.woff') format('woff'),\n         url('fonts/lakeshore.ttf')\
  \ format('truetype'),\n         url('fonts/lakeshore.svg') format('svg');\n    font-weight:\
  \ normal;\n    font-style: normal;\n}\n\nbody {\n  font-size: 10px;\n  background:\
  \ rgb(149, 194, 215);\n}\n\n}\n\na {\n  text-decoration: none;\n}\n\n.logo-text\
  \ {\n  background: white;\n\n  text-align: center;\n  text-transform: uppercase;\n\
  \  font-size: 37px;\n}\n```\n\n诚然，要正确设置 `@font-face` 声明可能是困难的，因为各个 `url` 值的顺序很重要。保留一份声明以供参考是一个好主意。你还可以查看\
  \ Atom 的片段文档 `flight-manual.atom.io/using-atom/snippets/` 来了解如何创建你自己的“片段”或模板。\n\n\
  声明 `@font-face` 之后，你的 CSS 其他部分就可以访问 `font-family` 属性的新值 `lakeshore`。在 `.logo-text`\
  \ 声明中，你设置了 `font-family: lakeshore` 来应用新字体。\n\n保存 `styles.css`，切换到 Chrome，看看拥有像水獭一样时尚的网页感觉有多棒（图\
  \ 3.29）。\n\n**图 3.29  应用自定义字体**\n\n![应用自定义字体](img/oh-yeah-header.png)\n\n## 铜挑战：更改颜色\n\
  \n更改 `body` 的背景颜色样式。使用开发者工具中的颜色选择器（图 3.21）来帮助选择。\n\n为了获得更高级的色板，请访问 [color.adobe.com](https://color.adobe.com/)\
  \ 并为 `body` 和 `.thumbnail-title` 背景颜色创建你自己的方案。\n\n# 给更有好奇心的人：优先级！当选择器发生冲突时……\n\n\
  \n\n你已经看到了了如何覆盖样式。例如，你将 `normalize.css` 的链接放在了 `styles.css` 之前。这使得浏览器使用 `normalize.css`\
  \ 的样式作为基准，而你的样式优先级高于这些基准样式。\n\n这是浏览器如何选择将哪些样式应用于页面元素上的第一个基本概念，前端开发人员称之为“**时效性**”（`recency`）：当浏览器处理\
  \ CSS 规则时，新规则可以覆盖较早处理的规则。你可以通过更改 `<link>` 标签的顺序来控制浏览器处理 CSS 的顺序。\n\n当规则具有相同的选择器时，这种情况非常简单（例如，如果你的\
  \ CSS 和 `normalize.css` 为 `body` 元素声明了不同的 `margin`）。在这种情况下，浏览器会选择最近的声明。但对于被多个选择器命中的元素，该如何处理呢？\n\
  \n假设你在 Ottergram 的 CSS 中有以下两条规则：\n\n```\n.thumbnail-item {\n  background: blue;\n\
  \  }\n\nli {\n  background: red;\n}\n```\n\n这两者都会匹配你的 `<li>` 元素。你的 `<li>` 元素将具有什么背景颜色？尽管\
  \ `li { background: red; }` 规则更晚，但 `.thumbnail-item { background: blue; }` 将被使用。为什么？因为它使用了类选择器，它比元素选择器更具特殊性（即被分配了更高的优先级值）。\n\
  \n类选择器和属性选择器具有相同的优先级，且它们的优先级都高于元素选择器。最高优先级属于 `ID 选择器`，你还没有见过它。如果你给一个元素添加 `id` 属性，你就可以编写一个比任何其他选择器都更具体的\
  \ ID 选择器。\n\nID 属性看起来与其他属性相似。例如：\n\n```html\n<li class=\"thumbnail-item\" id=\"\
  barry-otter\">\n```\n\n要在选择器中使用该 ID，需要在它前面加上 `#` 前缀：\n\n```css\n.thumbnail-item\
  \ {\n  background: blue;\n}\n\n#barry-otter {\n  background: green;\n}\n\nli {\n\
  \  background: red;\n}\n```\n\n在这个例子中，`<li>` 被三个选择器全部命中，但它将具有绿色背景，因为 ID 选择器的优先级最高。你的规则集的顺序在这里没有区别，因为每个规则的优先级都不同。\n\
  \n关于使用 ID 选择器的一点：最好避免使用它们。ID 值在文档中必须唯一的，因此你不能在文档的任何其他元素中使用 `id=\"barry-otter\"`\
  \ 属性。尽管 ID 选择器具有最高优先级，但它们关联样式无法重用，这使其成为维护上的“反实践”。\n\n要学习更多关于优先级的知识，请访问 MDN 页面 `developer.mozilla.org/en-US/docs/Web/CSS/Specificity`。\n\
  \n`specificity.keegan.st` 上的优先级计算器是比较不同选择器优先级的 get 工具。查看它可以让你更精确地理解优先级是如何计算的。\n\n\
  # 使用 Flexbox 实现的 4 种响应式布局\n\n前端开发人员的职责之一是无论用户使用什么设备或浏览器，都能为他们提供最佳体验。\n\n这并不一直是主流态度，浏览器制造商对此负有部分责任。在\
  \ Web 早期，浏览器制造商正在进行一场战争。每个人都会发明新的非标准特性，试图超越对手。作为回应，Web 开发人员想出了方案来检测哪个浏览器正在请求文档以及使用了多大的屏幕尺寸。根据这些信息，会提供不同版本的文档。\n\
  \n遗憾的是，这意味着前端开发背上了沉重的负担，需要为网站上的每个页面创建多个副本，每个副本都是用适用于特定屏幕尺寸下运行的特定浏览器版本的标记和样式构建的。维护所有这些副本既耗时又令人令人沮丧。\n\
  \n幸运的是，浏览器大战已经结束，浏览器制造商现在力求符合同一套标准特性——现代前端开发人员可以自由地关注网站的单一代码库。需要创建特定特定页面的时代已经过去。但这并不意味着开发者不能再根据不同的屏幕尺寸或方向提供定制化页面了。新技术——如你将在本章中学习的\
  \ `flexbox`——允许布局根据用户的屏幕尺寸进行调整，而不需要重复的文档。\n\n在本章中，你将把 Ottergram 从一个简单的图像列表扩展为准备好处理交互内容的正式用户界面。使用\
  \ flexbox 和 CSS 定位，你将构建一组界面组件，它们会根据浏览器窗口大小的变化进行调整，同时保持整体布局。在章节结束时，Ottergram 将包含一个缩略图滚动列表以及一个显示单张图片大尺寸详细版本的区域（图\
  \ 4.1）。\n\n**图 4.1 具有灵活布局的 Ottergram**\n\n![具有灵活布局的 Ottergram](img/flexbox-otters.png)\n\
  \n你将分两个部分完成。首先，你将添加显示大图和缩小缩略图所需的最小标记和样式。然后，你将添加样式让页面部分拉伸和收缩以适应尺寸变化。\n\n## 扩展界面\n\
  \n自从 iPhone 问世以来，通过手机而非桌面或笔记本电脑访问互联网的趋势一直在增长。\n\n对于前端开发人员来说，这种趋势意味着“移动优先”（mobile-first）开发证明是最佳设计方法：先为小屏幕设计，然后在此设计的基础上构建平板电脑尺寸的设计，最后扩展到桌面尺寸的设计。\n\
  \nOttergram 的简单布局已经是移动友好的。它以适合较小尺寸的比例显示文本和图像。正如此，你可以直接为布局添加下一级别的复杂度。\n\n垂直滚动的海獭列表是可以的，但如果用户还能看到图片的放大版本将会更好。Ottergram\
  \ 的计划是让缩略图列表水平滚动，同时展示一张更大的详细图。目前，详细图将位于列表下方。该计划如图 4.2 所示。\n\n**图 4.2 Ottergram 的新布局**\n\
  \n![Ottergram 的新布局](img/layout-diagram.png)\n\n你将从添加详细图开始。\n\n### 添加详细图\n\n目前，你的详细图将固定在单张图片上。在第\
  \ 6 章中，你将添加功能，让用户点击缩略图使任何图片变为详细图。\n\n在 index.html 中添加一段新代码来创建详细图：\n\n```html\n...\n\
  \      <li class=\"thumbnail-item\">\n        <a href=\"#\">\n          <img class=\"\
  thumbnail-image\" src=\"img/otter5.jpg\" alt=\"Barbara the Otter\">\n          <span\
  \ class=\"thumbnail-title\">Barbara</span>\n        </a>\n      </li>\n    </ul>\n\
  \n    <div class=\"detail-image-container\">\n      <img class=\"detail-image\"\
  \ src=\"img/otter1.jpg\" alt=\"\">\n      <span class=\"detail-image-title\">Stayin'\
  \ Alive</span>\n    </div>\n\n  </body>\n</html>\n```\n\n\n\n\n你添加了一个带有 `detail-image-container`\
  \ 类的 `<div>`。`<div>` 是一个通用的内容容器——通常用于对包含的内容应用样式，而这正是你将使用它的方式。\n\n在 `<div>` 内部，你添加了一个\
  \ `<img>` 标签来显示水獭图像的大尺寸。你还添加了一个 `<span>` 标签，包裹了详情图片的标题文本。你分别为 `<img>` 和 `<span>`\
  \ 标签赋予了 `detail-image` 和 `detail-image-title` 类名。\n\n保存 `index.html`，切换到 `styles.css`，最后限制你新定义的\
  \ `.detail-image` 类的宽度。\n\n```\n...\n.thumbnail-title {\n  ...\n}\n\n.detail-image\
  \ {\n  width: 90%;\n}\n```\n\n保存 `styles.css` 并启动 `browser-sync` 在 `Chrome` 中打开你的项目（图\
  \ 4.3）。（命令是 `browser-sync start --server --browser \"Google Chrome\" --files \"\
  stylesheets/*.css, *.html\"`。）\n\n**图 4.3 详情图的初始样式**\n\n![详情图的初始样式](img/detail-image-initial-style.png)\n\
  \n你的 `.detail-image` 将出现在页面底部，比你的缩略图略窄。通过将详情图的宽度设置为容器宽度的 90%，你在它旁边留出了一点空间。浏览器会将\
  \ `.detail-image-title` 的文本放在该空间内（你将在本章稍后对该文本进行样式设置）。\n\n如果你调整页面大小，你会发现一个 bug：当缩略图调整到新宽度时，详情图可能会被挤出视野。你将在本章的稍后部分解决这个问题。\n\
  \n## 缩略图的水平布局\n\n接下来，你将更新 `.thumbnail-list` 和 `.thumbnail-item` 类，以便图像能够水平滚动。\n\n\
  为了帮助你测试滚动效果，请复制 `index.html` 中所有的五个 `<li>` 元素。这将为你提供大量内容供滚动。要做到这一点，只需选择 `<ul class=\"\
  thumbnail-list\">` 和 `</ul>` 之间的所有行，复制它们并将结果粘贴到 `</ul>` 之上。你最终应该会有 10 个列表项，其中包含两次\
  \ `otter1.jpg` 到 `otter5.jpg` 的图像。\n\n完成后，务必保存 `index.html`。在开发过程中复制内容是模拟更健壮项目的好方法。它能让你看到代码如何处理真实世界的情况。\n\
  \n对于水平滚动的缩略图列表，每个缩略图必须限制在特定的宽度，并且缩略图应该在单行内水平布局。\n\n你已经多次使用的 `display: block` 属性无法产生预期的效果。它会导致浏览器在元素之前和之后渲染换行。然而，一个相关的样式\
  \ `display: inline-block` 非常适合这种情况。使用 `inline-block` 时，元素的盒模型绘制方式就像你声明了 `display:\
  \ block` 一样，但没有换行——这允许你的缩略图保持成排对齐。\n\n在 `styles.css` 中为 `.thumbnail-item` 类添加 `width`\
  \ 声明并更改 `display` 声明。\n\n```\n...\n.thumbnail-item {\n  display: block;\n  display:\
  \ inline-block;\n  width: 120px;\n  border: 1px solid rgb(100%, 100%, 100%, 0.8);\n\
  \  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n}\n...\n```\n\n（注意，`Atom` 的代码检查器可能会警告你“带有\
  \ border 使用 width 有时会导致元素比你预期的要大。”这是因为 `width` 属性仅适用于元素盒的内容部分——而不是内边距或边框。你不需要对此警告做任何处理。）\n\
  \n当 `.thumbnail-item` 元素的宽度设置为 `120px` 的绝对值时，`.thumbnail-image` 也有效地被固定了，因为 `.thumbnail-image`\
  \ 会根据其容器调整宽度。\n\n为什么不直接将 `.thumbnail-image` 设置为 `width: 120px` 呢？你希望 `.thumbnail-image`\
  \ 和 `.thumbnail-title` 具有相同的宽度。与其为这些元素每一个都设置 `width` 属性，不如在它们的共同父元素上设置。这样，如果你需要更改宽度，只需要在一个地方修改即可。通常情况下，让内部元素适应它们的容器是一种良好实践。\n\
  \n保存 `styles.css`  `Chrome` 中检查你的页面。你可以看到 `.thumbnail-item` 元素并排排列——但当它们填满容器宽度时，它们会换行（图\
  \ 4.4）。\n\n**图 4.4 inline-block 创建行**\n\n![inline-block 创建了换行的行](img/wrapping-thumbnails.png)\n\
  \n为了获得你想要的滚动效果，请在 `styles.css` 中设置 `.thumbnail-list` 禁止换行并允许滚动。\n\n```\n...\n.thumbnail-list\
  \ {\n  list-style: none;\n  padding: 0;\n\n  white-space: nowrap;\n  overflow-x:\
  \ auto;\n}\n```\n\n`white-space: nowrap` 阻止了 `.thumbnail-item` 换行。`overflow-x: auto`\
  \ 告诉浏览器在 `.thumbnail-list` 的水平空间（x 轴）添加滚动条。再次保存文件并在浏览器中查看结果。缩略图现在处于单行中，你应该可以滚动了（图\
  \ 4.5）。\n\n**图 4.5 水平滚动的缩略图**\n\n![水平滚动的缩略图](img/wrapping-thumbnails.png)\n\n这是增强\
  \ Ottergram 界面的良好开始。它在某些尺寸下工作良好。然而，它并不完美，因为它无法很好地适应尺寸范围——特别是比你使用的电脑大得多的尺寸。\n\n在接下来的两个章节中，你将添加代码使\
  \ Ottergram 具有流式布局，并允许其 UI——其用户界面——在不同布局之间切换。\n\n## Flexbox\n\n你已经见过指定 `block` 和\
  \ `inline` 属性的 `display` 样式。内联元素（如你新列表中的缩略图）彼此排列，而块元素占据自己的水平行（图 4.6）。\n\n**图 4.6\
  \ 块级与内联元素**\n\n![块级与内联元素](img/block-vs-inline.png)\n\n`display` 属性告诉浏览器元素在布局中如何流动。对于博客或在线百科全书，`inline`\
  \ 和 `block` 值效果良好。但对于像 Web 版邮箱和社交媒体网站这样的应用程序布局，有一项新的 CSS 规范允许元素更动态地流动。这就是弹性盒模型，或\
  \ flexbox。\n\nFlexbox CSS 属性可以确保缩略图和详情区域填充屏幕并保持它们之间的比例关系。这正是 Ottergram 所需要的。你还可以使用\
  \ flexbox 属性在水平和垂直方向上居中详情内容，这在使用标准盒模型属性时是一项极困难的任务。\n\n\n\n\n创建一个 flex 容器\n\n在添加你的第一个\
  \ flexbox 属性之前，请在 `styles.css` 中将你的 `<html>` 和 `<body>` 元素设置为 `height: 100%`。`<html>`\
  \ 元素是你的 DOM 树的根元素，而 `<body>` 是在其内部绘制的子元素。将两者的 `height` 都设置为 `100%` 可以让内容填充整个浏览器或设备窗口。\n\
  \n```\n@font-face {\n  ...\n}\n\nhtml, body {\n  height: 100%;\n}\n\nbody {\n  font-size:\
  \ 10px;\n  background: rgb(149, 194, 215);\n}\n...\n```\n\n注意，在这条样式规则中，你将两个选择器用逗号分组在一起。任何类型的选择器都可以以这种方式组合以设置通用样式。\n\
  \n同样注意，你现在有两个针对 `body` 元素选择器的样式规则。当浏览器看到某个选择器额外的样式声明时，它仅仅会将其添加到该选择器现有的样式信息中。在这种情况下，它首先看到\
  \ `<body>` 应该具有 100% 的 `height` 并存储了该信息。当它读取下一个针对 `<body>` 的样式规则时，它会将 `background`\
  \ 和 `font-size` 信息与 `height` 样式一起存储。\n\n现在你准备好创建你的第一个 flex 容器了。当一个元素成为 flex 容器时，它可以控制其子元素（即\
  \ flex 项目）的布局。在 flex 容器内部，flex 项目的尺寸和位置沿着 `main axis`（主轴）和 `cross axis`（交叉轴）发生(图\
  \ 4.7）。\n\n**图 4.7  flex 容器的主轴和交叉轴**\n\n![flex 容器的主轴和交叉轴](img/main-cross-axes.png)\n\
  \n通过在 `styles.css` 的 `<body>` 元素样式规则中添加 `display: flex` 声明，让你的 `<body>` 元素成为 flex\
  \ 容器。\n\n```\n...\nbody {\n  display: flex;\n\n  font-size: 10px;\n  background:\
  \ rgb(149, 194, 215);\n}\n...\n```\n\n如果你现在保存，你的浏览器将显示一个看起来相当忧伤的 Ottergram，如图 4.8\
  \ 所示。这是因为主轴从左到右延伸，将 flex 项目（`<body>` 的所有子元素）以行的行的方式排列。\n\n**图 4.8  沿主轴排列的 flex 项目**\n\
  \n![沿主轴排列的 flex 项目](img/broken-in-flex-direction-row.png)\n\n然而，你可以看到各个项目正在收缩以适应空间，而不是换行。这是第一个好消息。第二个好消息是，你只需要一种样式就可以修复布局。（嗯，几乎如此。）\n\
  \n### 更改 flex-direction\n\n要修复布局，请在 `styles.css` 中将 `<body>` 元素的 `flex-direction`\
  \ 设置为 `column`：\n\n```\n...\nbody {\n  display: flex;\n  flex-direction: column;\n\
  \n  font-size: 10px;\n  background: rgb(149, 194, 215);\n}\n...\n```\n\n这交换了 flex\
  \ 容器的主轴和交叉轴方向，如图 4.9 所示。\n\n**图 4.9  设置 flex-direction: column 的主轴和交叉轴**\n\n![设置\
  \ flex-direction: column 的主轴和交叉轴](img/main-cross-axes-column.png)\n\n在将 `flex-direction`\
  \ 更改为 `column` 后，Ottergram 恢复了正常——几乎如此。当浏览器窗口比高宽很多时，布局中会出现一个视觉 Bug，如图 4.10 所示。\n\
  \n**图 4.10  页面拉伸宽时缺少缩略图**\n\n![页面拉伸宽时缺少缩略图](img/missing-thumbnails.png)\n\n你可以通过添加一个包装元素并应用新的\
  \ flexbox 属性来解决这个问题。\n\n### 在 flex 项目内分组元素\n\n`<body>` 有三个 flex 项目：`<header>`、`.thumbnail-list`\
  \ 和 `.detail-image-container`。无论 Ottergram 在开发（和使用）过程中发生什么，`<header>` 的布局或复杂度都不可能发生很大变化。它将位于页面顶部显示文本。仅此如此。\n\
  \n另一方面，`.thumbnail-list` 和 `.detail-image-container` 可能会发生。为了实现这一点，将 `.thumbnail-list`\
  \ 和 `.detail-image-container` 包在一个 `<main>` 标签中(图 4.11。\n\n**图 4.11  包裹 .thumbnail-list\
  \ 和 .detail-image-container**\n\n![包裹 .thumbnail-list 和 .detail-image-container](img/introducing-top-level-flex-item.png)\n\
  \n通过将 `.thumbnail-list` 和 `.detail-image-container` 包裹在 `<main>` 元素中，你现在可以为 `<header>`\
  \ 声明 `height`，并将 `<body>` 的剩余空间留给 `<main>` 占据。\n\n```\n<body>\n  <header>\n    <h1\
  \ class=\"logo-text\">ottergram</h1>\n  </header>\n  <main class=\"main-content\"\
  >\n    <ul class=\"thumbnail-list\">\n      ...\n    </ul>\n    <div class=\"detail-image-container\"\
  >\n      <img src=\"img/otter.jpg\" alt=\"\">\n      <span class=\"detail-title\"\
  >Stay' Alive</span>\n    </div>\n  </main>\n</body>\n```\n\n### flex 写属性\n\nflex\
  \ 容器分配内部的空间。如果 flex 项目没有指定主轴上的尺寸，那么容器将根据 flex 项目的数量平均分配空间，每个项目在主轴上获得平等的份额。这是默认情况，如图\
  \ 4.12 所示。\n\n**图 4.12  三个 flex 项目之间的空间平均分配**\n\n![三个 flex 项目之间的空间平均分配](img/flex-equal.png)\n\
  \n但想象一下图 4.12 中三个 flex 项目中的一个比其他更贪婪，占据了总空间的两个份额。在这种情况下，flex 容器将主轴上的空间分为四份。贪婪的项目占据了两份（一半空间），而其他项目每个获得一份(图\
  \ 4.13。\n\n**图 4.13  三个 flex 项目之间的空间不均分配**\n\n![三个 flex 项目之间的空间不均分配](img/flex-unequal.png)\n\
  \n\n\n\n在 Ottergram 中，你希望 `.main-content` 元素成为贪婪元素，尽可能地沿主轴占据尽可能多的空间。相反，`.main-header`\
  \ 应该占据尽可能少的空间。\n\n`flex` 属性允许你的 flex 项目指定它们将占据可用空间的多少比例。它是一个简写属性，如图 4.14 所示。\n\n\
  **图 4.14  `flex` 简写属性及其值**\n\n![flex 简写属性及其值](img/flex-property-shorthand.png)\n\
  \n我们强烈建议你使用 `flex` 而不是它所代表的单独属性。这可以防止你无意中漏掉某个属性而导致意料之外的结果。\n\n第一个值是目前需要关注的，因为它决定了\
  \ flex 项目可以增长多大。默认情况下，flex 项目完全不增长。你希望 `.main-header` 保持这种默认行为，但 `.main-content`\
  \ 则不然。\n\n在 `styles.css` 中，为 `.main-header` 类选择器添加声明块，指定带有默认值的 `flex` 简写属性：`0 1\
  \ auto`。\n\n```\n...\na {\n  text-decoration: none;\n}\n\n.main-header {\n  flex:\
  \ 0 1 auto;\n}\n\n.logo-text {\n  background: white;\n  ...\n```\n\n值 `0 1 auto`\
  \ 可以被读为：“我不希望增长得更大；我会根据需要进行缩小；请为我计算尺寸。” 最终结果是，`.main-header` 只占据它需要的空间，而不再多。\n\n\
  接下来，为 `.main-content` 添加声明块，将其 `flex` 设置为 `1 1 auto`。\n\n```\n...\n.logo-text {\n\
  \  ...\n}\n\n.main-content {\n  flex: 1 1 auto;\n}\n\n.thumbnail-item + .thumbnail-item\
  \ {\n  ...\n}\n```\n\n`.main-content` 的 `flex` 声明中的第一个值对应于 `flex-grow` 属性。值 `1`\
  \ 告诉容器：“我想尽可能地增长。” 因为它唯一的兄弟元素已声明它*不会*增长，因此 `.main-content` 元素将增长以占据所有 `.main-header`\
  \ 所需之外的空间。\n\n`<body>` 的两个 flex 项目——`.main-header` 和 `.main-content` 元素——根据它们的需求占据弹性空间。现在是调整\
  \ `.main-content` 元素布局的时间了。\n\n### flex 项目的排序、对齐和对对齐\n\nFlexbox 还允许你将 flex 项目细分为\
  \ flex 容器。这种技术让你专注于层级。稍后，你将让 `.main-content` 成为一个 flex 容器。\n\n处理嵌套的 flex 容器是创建视觉组件外观和感受的原子样式方法的一个例外。与其先为最小、最内层的元素设置样式，然后向外处理到最大的元素，在用\
  \ flexbox 处理布局时，从最外层元素开始向内处理更有用。\n\n这里是你接接下来要处理的内容。你将把 `.main-content` 改为具有垂直主轴的\
  \ flex 容器。此外，你为 `.main-content` 的 flex 项目指定 `flex` 属性，以便 `.thumbnail-list` 占据默认空间，而\
  \ `.detail-image-container` 增长以填充剩余空间。最后，你将 `.thumbnail-list` 移动到 `.detail-image-container`\
  \ 下（图 4.15）。\n\n**图 4.15  将 `.main-content` 变为 flex 容器**\n\n![将 .main-content 变为\
  \ flex 容器](img/main-content-as-flex-container.png)\n\n在 `styles.css` 中进行这些更改：为 `.main-content`\
  \ 的声明块添加 `display: flex` 和 `flex-direction: column`，为 `.thumbnail-list` 的声明块添加 `flex`\
  \ 属性，并为 `.detail-image-container` 类编写一个新的声明块。\n\n```\n...\n.main-content {\n  flex:\
  \ 1 1 auto;\n  display: flex;\n  flex-direction: column;\n}\n\n...\n\n.thumbnail-list\
  \ {\n  flex: 0 1 auto;\n  list-style: none;\n  padding: 0;\n\n  white-space: nowrap;\n\
  \  overflow-x: auto;\n}\n\n...\n\n.thumbnail-title {\n  ...\n}\n\n.detail-image-container\
  \ {\n  flex: 1 1 auto;\n}\n\n.detail-image {\n  ...\n```\n\n你可能在奇怪，为什么你不像定义 `.detail-image`\
  \ 宽度那样，用百分比来定义 `.thumbnail-list` 和 `.detail-image-container` 框的高度。将 `.thumbnail-list`\
  \ 的高度设置为 25%，将 `.detail-image-wrapper` 设置为 75% 似乎合逻辑——但它不会按照你预期的方式工作。使用 `.detail-image`\
  \ 的 `flex` 属性会导致 `.thumbnail-list` 太大或太小。简而言之，使用 `flex` 设置尺寸是不可行的。\n\n要将项目移动到底部，可以使用\
  \ `order` 属性。`order` 的默认值为 `0`，告诉浏览器使用源顺序。任何其他值（包括负数）都会告诉浏览器在其他项目之前或之后绘制。给 `.thumbnail-list`\
  \ 设置 `order: 2` 会告诉浏览器在任何值较小的项目之后绘制它。\n\n保存 `styles.css` 并切换到 Chrome。你会看到缩略图已在底部渲染（图\
  \ 4.16）。\n\n**图 4.16  绘制元素的顺序**\n\n![绘制元素的顺序](img/flexbox-order.png)\n\n`order`\
  \ 属性可以分配任何整数。要更改顺序，为 `.thumbnail-list` 添加 `order` 声明。\n\n```\n...\n.thumbnail-list\
  \ {\n  flex: 0 1 auto;\n  order: 2;\n  list-style: none;\n  padding: 0;\n\n  white-space:\
  \ nowrap;\n  overflow-x: auto;\n}\n...\n```\n\n接下来，你在处理 Ottergram 布局时将继续应用 `display:\
  \ flex`。到目前为止，你处理的是只有几个 flex 项目的 flex 容器。让 `.thumbnail-list` 成为 flex 容器，以便你进一步探索\
  \ flexbox 能为你提供什么。\n\n```\n...\n.thumbnail-list {\n  flex: 0 1 auto;\n  order: 2;\n\
  \  display: flex;\n  list-style: none;\n  padding: 0;\n\n  white-space: nowrap;\n\
  \  overflow-x: auto;\n}\n...\n```\n\n如果你保存更改后看到缩略图渲染异常，请不要惊慌，如图 4.17 所示。\n\n**图\
  \ 4.17  异常的海獭**\n\n![异常的海獭](img/janky-otter-thumbnails.png)\n\n要修复这个问题，请将 `.thumbnail-item`\
  \ 的 `width` 声明替换为对声明，一个用于 `min-width`，另一个用于 `max-width`。这将消除导致奇怪布局的尺寸差异。\n\n你也可以删除为\
  \ `.thumbnail-item + .thumbnail-item` 元素设置 `margin-top` 的声明块。它对于这种布局不再需要了。\n\n\n\
  \n\n```css\n...\n.thumbnail-item + .thumbnail-item {\n  margin-top: 10px;\n}\n\n\
  .thumbnail-item {\n  display: inline-block;\n  width: 120px;\n  min-width: 120px;\n\
  \  max-width: 120px;\n  border: 1px solid rgb(100%, 100%, 100%);\n  border: 1px\
  \ solid rgba(100%, 100%, 100%, 0.8);\n}\n...\n```\n\n接下来，你将处理 `.thumbnail-list`\
  \ 内部 flex 项目的间距。在 `styles.css` 中，为 `.thumbnail-list` 选择选择器添加 `justify-content` 声明。\n\
  \n```css\n...\n.thumbnail-list {\n  flex: 0 1 auto;\n  order: 2;\n  display: flex;\n\
  \  justify-content: space-between;\n  list-style: none;\n  padding: 0;\n\n  white-space:\
  \ nowrap;\n  overflow-x: auto;\n}\n...\n```\n\n`justify-content` 属性允许 flex 容器控制\
  \ flex 项目在主轴上的绘制方式。你使用了 `space-between` 作为值，以确保每个单独的 flex 项目周围都有均匀的距。\n\n你可以为 `justify-content`\
  \ 指定五种不同的值。图 4.18 阐释了这些值每一个是如何工作的。\n\n**图 4.18 `justify-content` 属性的值**\n\n![justify-content\
  \ 属性的值](img/flex-justification.png)\n\n你已经处理好了 `.thumbnail-list` 的布局。接下来，你将处理 `.detail-image-container`\
  \ 及其内容。\n\n### 居中详细图像\n\n详细图像应该是 Ottergram 的视觉焦点。它应该处于正中央，以确保用户能够欣赏到水獭的雄伟姿态。它还应该装饰有一个酷炫的标题。\n\
  \n为了居中详细图像，你将首先将图像及其标题封装在一个容器中，然后在 `.detail-image-container` 内部居中 `wrapper`。这个思路在\
  \ 图 4.19 中所示。\n\n**图 4.19 `.detail-image` 和 `.detail-image-title` 的留框**\n\n![detail-image\
  \ 和 .detail-image-title 的留框](img/image-frame-centering.png)\n\n虽然你可以在 `.detail-image-container`\
  \ 内部居中 `.detail-image` 本身，但很难正确偏移 `.detail-image-title`，因为 `.detail-image` 和 `.detail-image-container`\
  \ 都在动态调整大小。\n\n中间包装器元素是处理这种情况的一种非常有用的技术。它将限制 `.detail-image` 的尺寸，并为定位 `.detail-image-title`\
  \ 提供参考依据。\n\n在 `index.html` 中，首先开始添加一个类名为 `detail-image-frame` 的 `<div>`：\n\n```html\n\
  ...\n      </ul>\n\n      <div class=\"detail-image-container\">\n        <div class=\"\
  detail-image-frame\">\n          <img class=\"detail-image\" src=\"img/otter1.jpg\"\
  \ alt=\"\">\n          <span class=\"detail-image-title\">Stayin' Alive</span>\n\
  \        </div>\n      </div>\n    </main>\n  </body>\n</html>\n```\n\n保存 `index.html`。现在，在\
  \ `styles.css` 中，为 `.detail-image-frame` 添加一个包含单一样式声明的声明块：`text-align: center`。这是不使用\
  \ flexbox 居中内容的方法之一，但注意它只对水平方向有效。\n\n```css\n...\n.detail-image-container {\n  flex:\
  \ 1 1 auto;\n}\n\n.detail-image-frame {\n  text-align: center;\n}\n\n.detail-image\
  \ {\n  width: 90%;\n}\n```\n\n接下来，为了在 `.detail-image-container` 内部居中 `.detail-image-frame`，更新\
  \ `styles.css` 使 `.detail-image-container` 成为一个 flex 容器。使用 `justify-content: center`\
  \ 将其 flex 项目绘制在主轴中心（在这种情况下是水平方向——默认值），并添加一个新的 flexbox 属性 `align-items: center` 将其\
  \ flex 项目绘制在交叉轴中心（垂直方向）。\n\n```css\n...\n.detail-image-container {\n  flex: 1 1\
  \ auto;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n\
  }\n...\n```\n\n保存你的更改并欣赏这只在 `.detail-image-container` 中完美居中的自豪水獭（图 4.20）。\n\n**图\
  \ 4.20 在 .detail-image-container 内部居中 `.detail-image-frame` 后**\n\n![在 .detail-image-container\
  \ 内部居中 .detail-image-frame 后](img/centered-otter.png)\n\n### 绝对定位\n\n有时你需要将元素放置在另一个元素的精确位置。CSS\
  \ 提供了使用**绝对定位**来实现这一点的方法。\n\n你将使用绝对定位将 `detail-image-title` 放置在 `.detail-image-frame`\
  \ 的左上角，如图 4.21 所示。\n\n**图 4.21 绝对定位的 .title**\n\n![绝对定位的 .title](img/title-pos.png)\n\
  \n绝对定位有三个要求：\n\n*   `position: absolute` 属性，告诉浏览器将其移出文档流而不是与其兄弟元素一起布局\n*   坐标，通过\
  \ `top`、`right`、`bottom` 和 `left` 属性中的一个；绝对长度（如像素）或相对长度（如百分比）可以作为值使用\n*   一个声明了\
  \ `position` 属性为 `relative` 的祖元素；如果祖元素没有 `position` 属性，绝对定位元素将相对于 `<html>` 元素（浏览器窗口）进行。\n\
  \n当你指定坐标时，你实际上是在相对于元素的边缘（相对于其容器的边缘）指定距离，如图 4.22 所示。\n\n**图 4.22 绝对定位的示例**\n\n![绝对定位的示例](img/absolute-positioning.png)\n\
  \n图 4.22 显示了绝对定位的两个示例。在第一个示例中，元素的位置使其顶部边缘距离容器顶部边缘 `50px`，左边缘距离容器左边缘 `200px`。第二个示例显示了一个变体，即通过底部和左边缘对元素进行定位。\n\
  \n为了定位 `.detail-image-title`，首先在 `styles.css` 中声明 `.detail-image-frame` 为 `position:\
  \ relative`。你将相对于它定位 `.detail-image-title`。\n\n```css\n...\n.detail-image-frame\
  \ {\n  position: relative;\n  text-align: center;\n}\n...\n```\n\n你为 `.detail-image-frame`\
  \ 使用 `position: relative` 是因为你希望它保持在正常流中。你还希望它作为绝对定位后代的容器，因此它的 `position` 属性必须显式定义。\n\
  \n在 `styles.css` 的末尾，为 `.detail-image-title` 选择器添加一个声明块。现在，将标题设为白色，并将字体设置为默认值的四倍。\n\
  \n```css\n...\n.detail-image {\n  width: 90%;\n}\n\n.detail-image-title {\n  color:\
  \ white;\n  font-size: 40px;\n}\n```\n\n到目前为止，一切顺利（[图 4.23）。但太基础了。\n\n\n\n\n![.detail-image-title\
  \ 的基础文本样式](img/basic-white.png)\n\n为了增加一点风格，让我们为 `.detail-image-title` 添加一些文本效果。在定位已样化的文本元素时，请记住元素的盒模型可能会因为自定义字体的视觉特征或其他效果而发生。在本示例中，你将在设置位置之前完成对\
  \ `.detail-image-title` 的所有文本样式设置。在 `styles.css` 中为 `.detail-image-title` 添加 `text-shadow`\
  \ 属性。\n\n```\n...\n.detail-image-title {\n  color: white;\n  text-shadow: rgba(0,\
  \ 0, 0, 0.9) 1px 2px 9px;\n  font-size: 40px;\n}\n```\n\n顾如名，`text-shadow` 属性为文本添加阴影。它接受一个阴影颜色、一对用于\
  \ `offset`（偏移）的长度（即阴影落在文本的上方还是下方、左侧还是右侧），以及一个 `blur radius`（模糊半径）——这是 `text-shadow`\
  \ 声明中的可选部分，随着值的增大，阴影会变得越大且颜色越浅。\n\n你为阴影设置了颜色属性 `rgba(0, 0, 0, 0.9)`，使其呈现微透明的黑色。它向右偏移了\
  \ `1px`，向下方偏移了 `2px`（负值将使其置于文本左侧或上方）。最后一个值 `9px` 是模糊半径。图 4.24 显示了你新增的阴影。\n\n**图\
  \ 4.24 .detail-image-title 的 `text-shadow`**\n\n![detail-image-title 的文本阴影](img/gotta-have-more-shadow.png)\n\
  \n尝试在开发者工具元素面板的样式窗中调整 `text-shadow` 值，以感受它们是如何运作的（图 4.25）。\n\n**图 4.25 使用开发者工具夸大文本阴影**\n\
  \n![使用开发者工具夸大文本阴影](img/ottergram-exaggerated-text-shadow.png)\n\n准备好后，使用自定义字体添加最后的点睛。就像你在第\
  \ 3 章 中做的那样，在 `styles.css` 中添加 `@font-face` 声明，将 Airstream 字体引入项目。为 `.detail-image-title`\
  \ 添加 `font-family: airstreamregular` 声明以使用它。\n\n```css\n@font-face {\n    font-family:\
  \ 'airstreamregular';\n    src: url('fonts/Airstream-webfont.eot');\n    src: url('fonts/Airstream-webfont.eot?#iefix')\
  \ format('embedded-opentype'),\n         url('fonts/Airstream-webfont.woff') format('woff'),\n\
  \         url('fonts/Airstream-webfont.ttf') format('truetype'),\n         url('fonts/Airstream-webfont.svg#airstreamregular')\
  \ format('svg');\n    font-weight: normal;\n    font-style: normal;\n}\n\n@font-face\
  \ {\n    font-family: 'lakeshore';\n    ...\n}\n\n...\n\n.detail-image-title {\n\
  \  font-family: airstreamregular;\n  color: white;\n  text-shadow: rgba(0, 0, 0,\
  \ 0.9) 1px 2px 9px;\n  font-size: 40px;\n}\n```\n\n到目前为止，非常时髦（图 4.26！\n\n**图 4.26\
  \ 我想要更花丽的**\n\n![想要更花丽](img/so-slick.png)\n\n现在你已经完成了 `.detail-image-title` 的样式设置，给它添加\
  \ `position: absolute` 声明，这样浏览器将将其放置在 `.detail-image-frame` 内的精确位置。使用 `bottom: -16px`\
  \ 和 `left: 4px` 指定该位置，使其刚好位于 `.detail-image-frame` 底部下方，并略位于 `.detail-image-frame`\
  \ 的左边缘内部（坐标使用负值是可以的）。\n\n```css\n...\n.detail-image-title {\n  position: absolute;\n\
  \  bottom: -16px;\n  left: 4px;\n\n  font-family: airstreamregular;\n  color: white;\n\
  \  text-shadow: rgba(0, 0, 0, 0.9) 1px 2px 9px;\n  font-size: 40px;\n}\n```\n\n\n\
  \n\n在第 3 章中，你为 Ottergram 添加了 `normalize.css`。这确保了任何查看 Ottergram 的浏览器都具有相同的默认样式。在这些默认样式的基础上，你可以放心地添加自己的\
  \ CSS，并确信它在不同浏览器之间的表现是一致的。\n\n你将对布局视口（layout viewport）进行类似的操作。就像每个浏览器可能有不同的用户代理样式一样，每个浏览器也可能有不同的默认布局视口。然而，与使用\
  \ `normalize.css` 不同，你不会将所有浏览器的视口重置为相同的值。相反，你将使用 `<meta>` 标签告诉所有浏览器以设备物理屏幕的最佳尺寸显示\
  \ Ottergram。\n\n在 `index.html` 中，添加一个 `<meta>` 标签，告诉浏览器布局视口的 `width` 与设备的屏幕宽度相同。确保通过将\
  \ `initial-scale` 设置为 `1` 来将缩放比例设置为 100%。\n\n```\n<!doctype html>\n<html\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1\">\n    <link rel=\"stylesheet\"\n      href=\"https://cdnjs.cloudflare.com/ajax/libs/normalize/3.0.3/normalize.min.css\"\
  >\n    <link rel=\"stylesheet\" href=\"stylesheets/styles.css\">\n    <title>Ottergram</title>\n\
  \  </head>\n...\n```\n\n保存你的更改。这项技术将布局视口设置为 `ideal viewport`（理想视口）。理想视口是浏览器制造商推荐的特定设备的最佳视口尺寸。由于存在许多许多不同的设备和相当数量的不同浏览器，这种尺寸差异很大。\n\
  \n表 5.1 总结了不同类型的视口。\n\n### 表 5.1 不同视口的汇总\n\n| 视口 | 描述 | 设备 |\n| --- | --- | ---\
  \ |\n| viewport | 等于浏览器窗口的区域。它充当 `<html>` 元素的容器。 | 桌面式电脑，笔记本电脑 |\n| layout viewport\
  \ | 一个虚拟屏幕，比实际设备屏幕大，用于计算页面布局。 | 移动设备 |\n| visual viewport | 用户可以在设备屏幕上看到的可以缩放区域。缩放对页面布局没有影响。\
  \ | 移动设备 |\n| ideal viewport | 特定设备上特定浏览器的最优尺寸。 | 移动设备 |\n\n启动 `browser-sync` 并确保在\
  \ `Chrome` 中打开了开发者工具（DevTools）。在 `Elements` 项目的左侧找到 `Toggle Device Mode`（切换设备模式）按钮，它看起来像这样![不同视口的汇总](img/toggle-device-mode-button.png)。它在图\
  \ 5.3 中显示上下文。\n\n### 图 5.3 切换设备模式按钮\n\n![切换设备模式按钮](img/responsive-testing-tool.png)\n\
  \n点击此按钮激活 `device mode`（设备模式）。你将看到网页视图现在在模拟的智能手机屏幕上显示 Ottergram。有一个菜单可以根据流行设备在不同的屏幕尺寸之间。你还可以点击预设下方的灰色条，在小、中、大屏幕尺寸之间切换。这里还有一个菜单可以快速选择横屏或竖屏屏幕方向。图\
  \ 5.4 显示了本文写作时设备模式的截图。你的看起来可能完全不同，因为开发者工具会定期更新。\n\n### 图 5.4 使用设备模式进行响应式测试\n\n![使用设备模式进行响应式测试](img/device-mode-tools.png)\n\
  \n你可以看到，得益于你新的 `<meta>` 元素，Ottergram 在小屏幕（如智能手机）上显示良好。对于屏幕较大的设备（如平板电脑或笔记本电脑），不同的布局可能更合适。接下来，你将结合\
  \ flexbox 和媒体查询（media queries）应用不同的布局样式。\n\n在继续之前，再次点击![使用设备模式进行响应式测试](img/toggle-device-mode-button.png)按钮以禁用设备模式。\n\
  \n## 添加媒体查询\n\n媒体查询允许你组合 CSS 声明块，并指定应用它们的条件。这些条件可能类似于“如果屏幕宽度至少为 640 像素”或“如果屏幕宽大于高且具有高像素密度”。\n\
  \n语法以 `@media` 开头，后面跟着匹配的条件。接着是一组大括号，包裹整个声明块。让我们看看它是什么样的。\n\n在 `styles.css` 的末尾开始你的第一个媒体查询。你将创建一个媒体查询，当视口至少为\
  \ 768 像素时，在任何种设备上查看都会激活样式。\n\n```\n...\n.detail-image {\n  ...\n}\n\n@media all\
  \ and (min-width: 768px) {\n  /* 样式将放在这里 */\n}\n```\n\n\n\n\n根据你的设计，缩略图应该位于左侧。你可以通过更改\
  \ `.thumbnail-list` 的 `order` 来解决这个问题。之前，你将其设置为 `2`，以便让它在 `.detail-image-container`\
  \ 之后绘制。现在，在 `styles.css` 的媒体查询将其设置为 `0`，这样它就会遵循源顺序并在 `.detail-image-container` 之前绘制。\n\
  \n```css\n...\n@media all and (min-width: 768px) {\n  .main-content {\n    flex-direction:\
  \ row;\n    overflow: hidden;\n  }\n\n  .thumbnail-list {\n    flex-direction: column;\n\
  \    order: 0;\n  }\n}\n```\n\n保存你的更改并确认缩略图已绘制在页面的左侧。\n\n你快要成功了！在 `styles.css` 中为\
  \ `.thumbnail-list` 和 `.thumbnail-item` 再添加一些样式，让尺寸和间距看起来更美观。\n\n```css\n...\n@media\
  \ all and (min-width: 768px) {\n  .main-content {\n    flex-direction: row;\n  \
  \  overflow: hidden;\n  }\n\n  .thumbnail-list {\n    flex-direction: column;\n\
  \    order: 0;\n    margin-left: 20px;\n  }\n\n  .thumbnail-item {\n    max-width:\
  \ 260px;\n  }\n\n  .thumbnail-item + .thumbnail-item {\n    margin-top: 20px;\n\
  \  }\n}\n```\n\n再次保存 `styles.css` 并切换到浏览器。无论视口是窄是宽，你的布局现在看起来非常精美（如图 5.7）。\n\n**图\
  \ 5.7 响应式水獭**\n\n![响应式水獭](img/double-otter-responsive.png)\n\nOttergram 正在稳步进展！你已经创建了一个精美的网站，其布局可以适应许多屏幕尺寸。在下一章中，你将开始使用\
  \ JavaScript 为 Ottergram 添加一层交互性。\n\n## 铜级挑战：竖屏模式\n\n你目前的媒体查询根据视口的宽度来更改布局。你可以从不同的角度来看待：一种针对高度大于宽度的视口，另一种针对宽度大于高度的视口。这些是视口可能处于的两种\
  \ `orientation`（取向）模式。\n\n检查 MDN 关于媒体查询的文档，并更新你的媒体查询，使布局根据方向而不是宽度发生变化。\n\n## 针对更有好奇心的人：Flexbox\
  \ 布局的常见解决方案（及 Bug）\n\nPhilip Walton 是一个维护两个非常重要的 flexbox 资源的开发者。第一个是 Solved by Flexbox\
  \ 网站（[`philipwalton.github.io/solved-by-flexbox`](https://philipwalton.github.io/solved-by-flexbox/)）），它提供了使用\
  \ flexbox 实现的常见布局演示，以及你亲自创建它们所需的所有信息。某些布局如果没有 flexbox 的话很难实现。\n\n第二个资源是位于 [`github.com/philipwalton/flexbugs`](https://github.com/philipwalton/flexbugs)\
  \ 上的 Flexbugs 页面。Flexbox 非常棒，但它并不完美。Flexbugs 为开发者在使用 flexbox 时遇到的常见问题提供了解决方案和规避方法。这些信息由遇到过这些\
  \ bug 的开发社区成员提供，且列表维护良好。\n\n## 金级挑战：圣杯布局\n\n在尝试尝试此挑战之前，务必为你的代码创建一个副本！这将对标记和样式进行重大更改。使用你的副本来完成挑战，并保留原始文件以便开始下一章。\n\
  \n以 Solved by Flexbox 为参考，在 Ottergram 中实现圣杯布局。创建一个带有缩略图的第二个导航栏，但将其放置在视口的另一侧。\n\n\
  确保在页面底部添加一个 `footer` 元素。使用 `<footer>` 标签并在里面放入一个 `<h1>`。\n\n# 6 使用 JavaScript 处理事件\n\
  \n你知道水獭酷的地方在哪里吗？除了其他之外，它们睡觉时会手拉手，这样它们就不会漂走了。在学习使用 JavaScript 中的事件回调时，请记住这个形象。\n\n\
  JavaScript 是一种通过操作页面上的 DOM 元素和 CSS 样式为网站添加交互性的编程语言。它最初是为非专业程序员设计的。它的功能和人气不断增长，现在被用于各种应用程序开发。当你使用\
  \ Gmail 或 Netflix 等网站时，你正在与用 JavaScript 编写的程序进行交互。事实上，`Atom` 编辑器实际上是一个用 JavaScript\
  \ 编写的桌面应用程序。\n\n尽管它功能强大且被广泛使用，但它像任何编程语言一样也有自己的特性。当你继续开发 Ottergram 和书中的其他项目时，你将学会应对该语言的棘手部分，并利用它最好的部分。\n\
  \nJavaScript 有几个版本，你将在书中的项目中使用其中三个。它们都是一个被称为 ECMAScript（或“ES”）的标准规范的修订版。[表 6.1]对它们进行了总结。\n\
  \n**表 6.1 书中使用的 JavaScript 版本**\n\n| ECMAScript 版本 | 发布日期 | 备注 |\n| --- | --- |\
  \ --- |\n| 3 | 1999 年 12 月 | 支持最广泛的版本；涵盖了你将使用的大多数语言特性，如变量、类型和函数。 |\n| 5 | 2009 年\
  \ 12 月 | 向后兼容，带有增强功能，如 `严格模式`，可以防止语言中易出错的部分。 |\n| 6 | 2015 年 6 月 | 包含了新的语法和语言特性；在编写此时，大多数浏览器尚未支持\
  \ ES6，但 ES6 代码可以转换为 ES5 以便使用。 |\n\n在本章中，你将使用 JavaScript 让 Ottergram 具有交互性：当用户点击或触摸缩略图时，详情图像和标题会发生。\n\
  \n为了实现这一点，你将编写一个 JavaScript `function`（一组浏览器遵循的步骤），来读取图像 URL 并将其显示在详情区域。然后你将确保在点击缩略图时运行该函数。你还将编写一个独立的函数，在按下\
  \ Escape 键时隐藏详情区域。\n\n在本章结束时，Ottergram 将能够在详情图像中展示任何水獭（如图 6.1）。\n\n**图 6.1 点击缩略图更改详情图像和标题**\n\
  \n![点击缩略图更改详情图像和标题](img/finito.png)\n\n在编写这些函数时，你将使用内置的预定义接口与页面进行交互。这些接口有很多，代码将引导你完成任务所需的部分。如果你好奇，可以在\
  \ MDN 的 [`developer.mozilla.org/en-US/docs/Web/API/Element`](https://developer.mozilla.org/en-US/docs/Web/API/Element)\
  \ 上找到更多深入的信息。\n\n## 为锚点标签准备就\n\n在使用 JavaScript 添加交互功能之前，你需要对标记进行一些更新。你的缩略图封装在锚点标签中，但这些标签并没有链接到任何资源。相反，它们\
  \ `href` 属性使用的是 `#` 值，这告诉浏览器留在当前页面。为了让点击缩略图产生任何有趣的操作，你需要修复这个问题。\n\n首先，在 `index.html`\
  \ 中删除除五个以外的所有 `.thumbnail-item` 元素。你不再需要那些重复项了，因为你的布局已经很完善了。\n\n\n\n\n然后，更改锚标签的\
  \ `href` 属性，使其不再使用占位符 `#`。相反，将这些值设置为与每个 `<img>` 标签的 `src` 值相同。\n\n`Atom` 可以帮助你完成这些更改，消除处理\
  \ HTML 的繁琐工作。像任何文本编辑器一样，它都有查找和替换文本的方法。选择`Find`查找）→`Find in Buffer`在缓冲区中查找）或使用快捷键\
  \ `Command-F` (Ctrl-F)。将在编辑器窗口底部打开 `Find in Buffer` 面板（图 6.2）。\n\n**图 6.2 使用 Atom\
  \ 的查找和替换功能**\n\n![Using Atom 的查找和替换功能](img/atom-find-replace.png)\n\n在 `Find in\
  \ current buffer` 文本框中输入“”，在 `Replace in current buffer` 文本框中输入“img/otter.jpg”。然后点击右下角的`Replace\
  \ All`全部替换）。\n\n这将将所有的 `<a href=\"#\">` 标签更改为 `<a href=\"img/otter.jpg\">`。现在只需为每个标签添加相应的数字即可（`img/otter1.jpg`、`img/otter2.jpg`\
  \ 等）。\n\n按 Escape 键关闭 `Find in Buffer` 面板。`index.html` 看起来应该是这样的：\n\n```\n...\n\
  \      <ul class=\"thumbnail-list\">\n        <li class=\"thumbnail-item\">\n  \
  \        <a href=\"#\">\n          <a href=\"img/otter1.jpg\">\n            <img\
  \ class=\"thumbnail-image\" src=\"img/otter1.jpg\" alt=\"\">\n            <span\
  \ class=\"thumbnail-title\">Barry</span>\n          </a>\n        </li\n       \
  \ <li class=\"thumbnail-item\">\n          <a href=\"#\">\n          <a href=\"\
  img/otter2.jpg\">\n            <img class=\"thumbnail-image\" src=\"img/otter2.jpg\"\
  \ alt=\"\">\n            <span class=\"thumbnail-title\">Robin</span>\n        \
