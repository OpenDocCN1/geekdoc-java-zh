  \ Final Challenge`\n## `Shameless Plugs`\n## `Thank You`\n Index\n\n\n\n没有一家公司能完全控制浏览器的运行方式。这意味着前端开发者不会获得一个年度一次的\
  \ `SDK` 发布，其中包含了他们在未来十二个月内可能需要处理的所有变化。原生平台像是一片结冰的湖面，你可以在上面舒服地滑冰。而 Web 是一条河流；它弯曲、流动迅速，并且在某些地方布满岩石——但这正是它的魅力所在。Web\
  \ 是目前演变最快的平台。适应变化是前端开发者的生活方式。\n\n本书的目的是教你如何为浏览器开发程序。随着本指南的引导，你将经历构建一系列项目的过程。每个项目都会要求前端技术光谱中不同技术的组合。由于可用的前端工具、库和框架数量极多，本书将重点介绍最核心且可移植的模式和技术。\n\
  \n## 前提条件\n\n本书并不是一本编程入门书。它假设你具有编写代码基础知识的经验。你应该熟悉基础类型、函数和对象。\n\n尽管如此，它也不假设你已经认识\
  \ `JavaScript`。我们会在你需要时，结合上下文向你介绍 `JavaScript` 概念。\n\n## 本书的结构\n\n本书将引导你编写四个不同的\
  \ Web 应用程序。每个应用程序在书中都有对应的章节。每个章节中的每一章都会为你正在构建的应用程序添加新功能。\n\n构建这四个应用程序的工作将带你从前端光谱的一端走向到另一端。\n\
  \n| Ottergram |\n| CoffeeRun |\n| Chattrbox |\n| Tracker |\n\n在完成这些应用程序的过程中，你将接触到许多工具，包括：\n\
  \n* `Atom` 文本编辑器以及一些用于处理代码的实用插件\n* 如 `Mozilla Developer Network`（MDN）之类的文档资源\n*\
  \ 命令行，使用 `OS X Terminal` 应用或 Windows 命令提示符\n* `browser-sync`\n* `Google Chrome’s\
  \ Developer Tools`\n* `normalize.css`\n* `Bootstrap`\n* `jQuery` 以及如 `crypto-js`\
  \ 和 `moment` 等库\n* `Node.js`、Node 包管理器 (`npm`) 以及 `nodemon`\n* `WebSockets` 和 `wscat`\
  \ 模块\n* `Babel`、`Babelify`、`Browserify` 和 `Watchify`\n* `Ember.js` 以及如 `Ember CLI`、`Ember\
  \ Inspector`、`Ember CLI Mirage` 和 `Handlebars` 等插件\n* `Bower`\n* `Homebrew`\n* `Watchman`\n\
  \n## 如何使用本书\n\n本书不是一本参考书。它的目标是帮助你跨越最初的坎，让你能够充分利用现有的参考书和食谱书。它基于我们在 `Big Nerd Ranch`\
  \ 的五天课程，在很大程度上，它是为了从头开始学习的。章节之间环环相扣，跳跃式阅读将毫无意义的。\n\n在我们的课程中，学生学习这些材料，但他们也受益于良好的环境——专门的教室、良好的食物和舒适的白板、一群充满动力的同伴以及一位可以回答问题的导师。\n\
  \n作为读者，你可能希望环境也是类似的。这意味着保证充足的睡眠并找一个安静的地方工作。这些因素也有帮助：\n\n* 与你的朋友或同事建立一个阅读小组。\n* 安排专门的专注时间来学习章节。\n\
  * 参加 `forums.bignerdranch.com` 为本书提供的论坛，你可以在那里讨论书籍并找到错误和解决方案。\n* 找一个了解前端 Web 开发的人来帮助你。\n\
  \n## 挑战\n\n本书中的大多数章节都以至少一个挑战结束。挑战是回顾你所学知识并将章节中的工作更进一步一步的机会。我们建议你尽可能多地尝试挑战，以巩固你的知识，并从从我们这里学习\
  \ `JavaScript` 开发变为独立进行 `JavaScript` 开发。\n\n挑战分为三个难度等级：\n\n* **铜牌挑战**通常要求你做一些与章节中进行的内容非常相似的事情。这些挑战强化了你在章节中学到的知识，并迫使你在没有参考布局的情况下输入类似的代码。熟能生巧。\n\
  * **银牌挑战**要求你进行更深层次的挖掘和思考。有时你可能需要使用以前从未见过的函数、事件、标记和样式，但任务仍与章节中的内容相似。\n* **黄金挑战**难度很大，可能需要几个小时才能完成。它们要求你理解章节中的概念，然后独立进行高质量的思考和问题解决。应对这些挑战将为你从事现实世界的\
  \ `JavaScript` 开发做好准备。\n\n在进行任何章节的挑战之前，你应该为你的代码创建一个副本。否则，你所做的更改可能与后续练习不兼容。\n\n如果你迷路了，可以随时访问\
  \ `forums.bignerdranch.com` 寻求帮助。\n\n## 进阶好奇者\n\n许多章节还有“进阶好奇者”部分。这些章节对书中介绍的话题提供了更深入的解释或额外信息。这些章节中的信息并非绝对必要，但我们希望你会发现它们有趣且有用。\n\
  \n## 使用电子书\n\n如果你在电子阅读器上阅读本书，阅读代码有时可能会很困难。根据你选择的字体大小，较长的代码可能会换到第二行。\n\n本书中最长的代码行是\
  \ 86 个等宽字符，如下所示：\n\n```\n<link href=\"https://cdnjs.cloudflare.com/ajax/libs/normalize/3.0.3/normalize.min.css\"\
  >\n```\n\n你可以调整电子阅读器的设置以找到最适合查看长代码的方式。\n\n如果你在 iPad 上使用 `iBooks` 阅读，我们建议你进入`设置`\
  \ 应用，选择 `iBooks`，并将`两对齐`关闭、`自动连字符`关闭。\n\n# 第一部分：核心浏览器编程\n\n# 第一章：搭建你的开发环境\n\n前端开发有无数工具和资源，并且不断产生产生。对于所有水平的开发者来说，选择最好的工具都是一项挑战。在本书的项目中，我们将引导你使用一些我们最喜爱的工具。\n\
  \n在开始之前，你需要三个基础工具：浏览器、文本编辑器以及用于前端开发中许多技术的良好参考文档。此外，还有一些额外工具——虽然并非不可少，但它们会让你的开发体验更加顺畅和愉快。\n\
  \n\n\n\n为了本书的需要，我们建议你使用与我们相同的软件，以便从我们的说明和截图中获得最大的益处。本章将引导你安装并配置 `Google Chrome`\
  \ 浏览器、`Atom` 文本编辑器、`Node.js` 以及许多插件和扩展。你还将将了解良好的文档选择，并学习一个关于在 Mac 和 Windows 上使用\
  \ `command line`（命令行）的快速课程。在下一章中，当你开始第一个项目时，你将开始使用这些资源。\n\n## 安装 Google Chrome\n\
  \n你的电脑默认应该已经安装了一个浏览器，但最适合前端开发使用的浏览器是 `Google Chrome`。如果你还没有最新版本的 `Chrome`，可以 [`www.google.com/​chrome/​browser/​desktop`](https://www.google.com/chrome/browser/desktop/)\
  \ 获取（图 1.1](#ch01.html_fig-chrome-download-page \"Figure 1.1  下载 Google Chrome\"\
  )）。\n\n**图 1.1 下载 Google Chrome**\n\n![下载 Google Chrome](img/chrome-download-page.png)\n\
  \n## 安装并配置 Atom\n\n在众多的文本编辑器程序中，GitHub 开发的 `Atom` 编辑器是前端开发最好的选择之一。它是一个很好的选择，因为它高度可配置，拥有许多插件可以帮助编写代码，并且免费下载和使用。\n\
  \n你可以从 [`atom.io`](https://atom.io) 下载 Mac 或 Windows 版本的 `Atom`（图 1.2](#ch01s02.html_fig-atom-download-page\
  \ \"Figure 1.2  下载 Atom\")）。\n\n**图 1.2 下载 Atom**\n\n![下载 Atom](img/atom-download-page.png)\n\
  \n按照对应平台的安装说明进行操作。安装 `Atom` 后，你还会想要安装几个插件。\n\n### Atom 插件\n\n你对文本编辑器的主要需求是文档查询、自动补全、代码格式化和代码静态检查（linting，稍后会详细介绍）。`Atom`\
  \ 默认提供了其中一些功能，但安装几个插件会让它变得更好。\n\n打开 `Atom` 并显示其设置（Settings）界面。在 Mac 上，通过选择 `Atom`\
  \ → `Preferences...`（偏好设置）或使用快捷键 `Command-,`（即 Command 键加逗号）完成。在 Windows 上，你可以通过\
  \ `File` → `Settings`（设置）或使用快捷键 `Ctrl-,` 访问。\n\n在设置界面的左侧，点击 `+ Install`（安装）（图 1.3](#ch01s02.html_fig-atom-settings-install\
  \ \"Figure 1.3  Atom 的安装包界面\"）。\n\n**图 1.3 Atom 的安装包界面**\n\n![Atom 的安装包界面](img/atom-settings-install.png)\n\
  \n在这里，你可以通过名称搜索插件包。首先搜索“emmet”。\n\n编写大量的 HTML 可能非常枯燥且容易出错。`emmet` 插件（图 1.4](#ch01s02.html_fig-emmet-install\
  \ \"Figure 1.4  安装 emmet\")）让你能够使用方便的简写编写格式良好的 HTML。点击 `Install`（安装）按钮获取 `emmet`。\n\
  \n**图 1.4 安装 emmet**\n\n![安装 emmet](img/package-emmet.png)\n\n接下来，搜索“atom-beautify”。`atom-beautify`\
  \ 插件（图 1.5](#ch01s02.html_fig-beautify-install \"Figure 1.5  安装 atom-beautify\"\
  ）有助于处理代码缩进，从而提高可读性。再次点击 `Install` 按钮获取该插件。\n\n**图 1.5 安装 atom-beautify**\n\n![安装\
  \ atom-beautify](img/package-atom-beautify.png)\n\n搜索并安装 `autocomplete-paths` 插件（图\
  \ 1.6](#ch01s02.html_fig-autocomplete-install \"Figure 1.6  安装 autocomplete-paths\"\
  ）。通常情况下，你的代码需要引用项目中的其他文件和文件夹。该插件通过在输入时在自动补全菜单中提供文件名来帮助。\n\n**图 1.6 安装 autocomplete-paths**\n\
  \n![安装 autocomplete-paths](img/package-autocomplete-paths.png)\n\n你下一个要安装的包是 `api-docs`（图\
  \ 1.7](#ch01s02.html_fig-api-docs-install \"Figure 1.7  安装 api-docs\"），它让你根据关键词查找文档。它会在编辑器的单独标签页中显示文档。\n\
  \n**图 1.7 安装 api-docs**\n\n![安装 api-docs](img/package-api-docs.png)\n\n接下来，搜索并安装\
  \ `linter` 包（图 1.8](#ch01s02.html_fig-linter-install \"Figure 1.8  安装 linter\"）。`linter`\
  \ 是一个检查代码语法和风格的程序。确保你找到并安装了名为“linter”的包。这是一个基础 linter，可以与特定语言的插件配合。为了使用下方的其他 linter\
  \ 插件，你需要它。\n\n**图 1.8 安装 linter**\n\n![安装 linter](img/package-linter.png)\n\n你有三个\
  \ `linter` 辅助插件想要安装，用于检查 CSS、HTML 和 JavaScript。从 `linter-csslint` 开始（图 1.9](#ch01s02.html_fig-csslint-install\
  \ \"Figure 1.9  安装 linter-csslint\"），它确保你的 CSS 语法正确，并对编写高效 CSS 提供建议。\n\n**图 1.9\
  \ 安装 linter-csslint**\n\n![安装 linter-csslint](img/package-linter-css.png)\n\n下一个要安装的\
  \ `linter` 辅助插件是 `linter-htmlhint`（图 1.10](#ch01s02.html_fig-htmlhint-install \"\
  Figure 1.10  安装 linter-htmlhint\"），它确认你的 HTML 格式正确。它会警告你标签不匹配的问题。\n\n**图 1.10 安装\
  \ linter-htmlhint**\n\n![安装 linter-htmlhint](img/package-linter-html.png)\n\n最后一个要安装的\
  \ `linter` 辅助插件是 `linter-eslint`（图 1.11](#ch01s02.html_fig-eslint-install \"Figure\
  \ 1.11  安装 linter-eslint\"）。该插件检查 JavaScript 的语法，并可以配置为检查代码的风格和格式（例如，缩进多少空格，注释前后留多少空行）。\n\
  \n**图 1.11 安装 linter-eslint**\n\n![安装 linter-eslint](img/package-linter-eslint.png)\n\
  \nChrome 和 Atom 现在已准备好进行前端开发。完成编码环境还需要最后几个步骤：访问文档、学习命令行基础知识以及下载两个工具。\n\n## 文档与参考资源\n\
  \n前端开发与 iOS 和 Android 等平台的编程有所不同。除了明显的差异外，前端技术除了技术规范外没有官方的开发者文档。这意味着你需要从其他地方寻求指导。我们建议你熟悉以下资源，并在阅读本书以及继续进行前端开发时经常查阅。\n\
  \n\n\n\nMozilla 开发者网络（MDN）是处理 HTML、CSS 和 JavaScript 相关任何内容的最佳参考。访问它的方法方法是 [devdocs.io](http://devdocs.io)，这是一个出的文档接口（图\
  \ 1.12）。它从 MDN 获取核心前端技术的文档——并且可以离线工作，因此你即使在没有互联网连接时也可以查看。\n\n**图 1.12  通过 `devdocs.io`访问文档**\n\
  \n![通过 devdocs.io 访问文档](img/devdocs-io.png)\n\n请注意，`Safari` 目前不支持 [devdocs.io](http://devdocs.io)\
  \ 使用的离线缓存机制。你需要使用不同的浏览器，例如 `Chrome` 来访问它。\n\n你也可以使用 MDN 的网站，[developer.mozilla.org/en-US/](https://developer.mozilla.org/en-US/)（图\
  \ 1.13），或简单地将“MDN”作为搜索引擎关键词来找到你需要的信息。\n\n**图 1.13  Mozilla 开发者网络网站**\n\n![Mozilla\
  \ 开发者网络网站](img/mdn.png)\n\n另一个值得关注的网站是 [stackoverflow.com](http://stackoverflow.com)（图\
  \ 1.14）。从官方角度来说，这不是文档来源。它是开发者可以互相询问代码的地方。答案的质量差不齐，但通常非常详尽且非常有帮助。因此它是一个很有用的资源——只要你记住由于其众包性质，这些答案并不是决定性的。\n\
  \n**图 1.14  Stack Overflow 网站**\n\n![Stack Overflow 网站](img/stackoverflow.png)\n\
  \nWeb 技术始终在变化。对功能和 API 的支持随浏览器和时间而异。两个可以帮助确定哪些浏览器（以及各个浏览器的哪些版本）支持哪些网站是 [html5please.com](http://html5please.com)\
  \ 和 [caniuse.com](http://caniuse.com)。当你需要关于功能支持的信息时，我们建议从 [html5please.com](http://html5please.com)\
  \ 开始，以了解某个功能是否被推荐。关于特定功能哪些浏览器支持的更多详细信息，请访问 [caniuse.com](http://caniuse.com)。\n\n\
  ## 命令行快速上手\n\n在本书中，你将被指示使用 `command line`（命令行）或 `terminal`（终端）。你将使用的许多工具将专门作为命令行程序运行。\n\
  \n要在 Mac 上访问命令行，打开 `Finder` 并进入 `Applications` 文件夹，然后进入 `Utilities` 文件夹。找到并打开 `Terminal`\
  \ 程序（图 1.15）。\n\n**图 1.15  在 Mac 上查找 Terminal 应用**\n\n![在 Mac 上查找 Terminal 应用](img/mac-finder-utilities.png)\n\
  \n你应该会看到一个看起来像[图 1.16]的窗口。\n\n**图 1.16  Mac 命令行**\n\n![Mac 命令行](img/mac-terminal.png)\n\
  \n要在 Windows 上访问命令行，进入启动菜单并搜索“cmd”。找到并打开 `Command Prompt` 程序（图 1.17）。\n\n**图 1.17\
  \  在 Windows 上查找 Command Prompt 程序**\n\n![在 Windows 上查找 Command Prompt](img/windows-cortana-cmd.png)\n\
  \n点击它来运行标准的 Windows 命令行界面，它看起来像[图 1.18]。\n\n**图 1.18  Windows 命令行**\n\n![Windows\
  \ 命令行](img/windows-cmd.png)\n\n从现在起，我们将“终端”或“命令行”来同时指代 Mac 的 `Terminal` 和 Windows\
  \ 的 `Command Prompt`。如果你不熟悉使用命令行，这里有一个关于常见任务的简要介绍。所有命令都通过在提示符处输入并按 Return 键来完成。\n\
  \n### 查找你所在的目录\n\n命令行是基于位置的。这意味着在任何给定时刻，它都“位于”文件结构中的特定目录，你输入的任何命令都将在该目录内执行。命令行提示符显示它所在目录的缩略版本。要在\
  \ Mac 上查看完整路径，请输入命令 `pwd`（代表“print working directory”，即打印工作目录），如[图 1.19]所示。\n\n\
  **图 1.19  在 Mac 上使用 `pwd` 显示当前路径**\n\n![在 Mac 上使用 pwd 显示当前路径](img/mac-terminal-pwd.png)\n\
  \n\n\n\n\n### 图 1.21 切换和检查目录\n\n![切换和检查目录](img/terminal-cli-tutorial.png)\n\n你并不局限于一次只向上或向下移动一个目录。假设你有一个更复杂的目录结构，如图\
  \ 1.22 所示。\n\n### 图 1.22 一个文件结构示例\n\n![一个文件结构示例](img/finder-folder-structure.png)\n\
  \n假设你处于 `<samp class=\"filename\">ottergram</samp>` 目录，想要直接进入 `<samp class=\"filename\"\
  >coffeerun</samp>` 目录下的 `<samp class=\"filename\">stylesheets</samp>` 目录。你可以使用 `cd`\
  \ 后加上路径，该路径的意思是“当前所在父目录的 `<samp class=\"filename\">coffeerun</samp>` 目录下的 `<samp\
  \ class=\"filename\">stylesheets</samp>` 目录”：\n\n```\ncd ../coffeerun/stylesheets\n\
  ```\n\n在 Windows 上，你可以使用相同的命令，但要使用反斜杠：\n\n```\ncd ..\\coffeerun\\stylesheets\n```\n\
  \n### 在目录中列出文件\n\n你可能需要查看当前目录下的文件列表。在 Mac 上，你使用 `ls` 命令来实现此（图 1.23）。如果你想列出另一个目录中的文件，可以提供路径：\n\
  \n```\nls\nls ottergram\n```\n\n### 图 1.23 使用 ls 列出目录中的文件\n\n![使用 ls 列出目录中的文件](img/terminal-ls.png)\n\
  \n默认情况下，如果目录为空，`ls` 不打印任何内容。\n\n在 Windows 上，命令是 `dir`（图 1.24），你可以选择地提供路径：\n\n```\n\
  dir\ndir ottergram\n```\n\n### 图 1.24 使用 dir 列出目录中的文件\n\n![使用 dir 列出目录中的文件](img/windows-dir.png)\n\
  \n默认情况下，`dir` 命令将打印有关日期、时间以及文件大小的信息。\n\n### 获取管理员权限\n\n在某些版本的 OS X 和 Windows 上，你需要`<samp\
  \ class=\"firstterm\">superuser</samp>` 权限或管理员权限才能运行某些命令，例如安装软件或修改受保护文件的命令。\n\n\
  在 Mac 上，你可以通过在命令前加上 `sudo` 来给自己赋予权限。当你第一次在 Mac 上使用 `sudo` 时，它会给你一个严肃的警告，如图 1.25\
  \ 所示。\n\n### 图 1.25 sudo 警告\n\n![sudo 警告](img/sudo-warning.png)\n\n`sudo` 在以超级用户身份运行命令之前会提示你输入密码。在你输入时，按键不会回显，因此请务必小心输入。\n\
  \n在 Windows 上，如果你需要给自己赋予权限，可以在打开命令行界面的过程中完成。在 Windows 的 `<samp class=\"guimenu\"\
  >开始菜单</samp>` 中找到命令提示符，右键点击它，并选择`<samp class=\"guilabel\">以管理员身份运行</samp>`（图 1.26）。你在此命令提示符中运行的任何命令将以超级用户身份运行，因此请小心。\n\
  \n### 图 1.26 以管理员身份打开命令提示符\n\n![以管理员身份打开命令提示符](img/windows-cmd-as-administrator.png)\n\
  \n### 退出程序\n\n在学习过程中，你会从命令行运行许多应用程序。其中某些完成工作后会自动退出，但另一些会一直运行直到你停止。要退出命令行程序，请按 Control-C。\n\
  \n## 安装 Node.js 和 browser-sync\n\n开始第一个项目之前，还有最后一个配置步骤。\n\n`<samp class=\"application\"\
  >Node.js</samp>`（简称 `<samp class=\"application\">Node</samp>`）允许你从命令行使用 JavaScript\
  \ 编写的程序。大多数前端开发工具都是为配合`<samp class=\"application\">Node.js</samp>` 使用而编写。你将在第 15\
  \ 章中学习更多关于`<samp class=\"application\">Node.js</samp>`的知识，但你现在就可以开始使用依赖它的工具——`browser-sync`。\n\
  \n通过 [<samp class=\"uri\">nodejs.org</samp>](https://nodejs.org/en/) 下载安装程序来安装`<samp\
  \ class=\"application\">Node</samp>`（图 1.27）。\n\n### 图 1.27 下载 Node.js\n\n![下载 Node.js](img/nodejs-download-site.png)\n\
  \n书中使用了 `<samp class=\"application\">Node.js</samp>`，你可能会看到不同的版本。`<samp class=\"\
  application\">Node.js</samp>` 适用于。\n\n\n\n\n# 建立你的第一个项目\n\n当你访问一个网站时，你的浏览器会与服务器（互联网上的另一台计算机）进行对话。\n\
  \n浏览器：“嘿！可以给我看看名为 `cat-videos.html` 的文件内容吗？”\n\n服务器：“没问题。我来找找……在这里了！”\n\n浏览器：“啊，它告诉我还需要一个名为\
  \ `styles.css` 的文件。”\n\n服务器：“当然可以。我来找找……在这里了！”\n\n浏览器：“好的，那个文件说我还需要一个名为 `animated-background.gif`\
  \ 的文件。”\n\n服务器：“没问题。我来找找……在这里了！”\n\n这种对话会持续一段时间，有时会持续数千毫秒（图 2.1）。\n\n**图 2.1  浏览器发送请求，服务器响应**\n\
  \n![浏览器发送请求，服务器响应](img/request-response.png)\n\n浏览器的工作是向服务器发送请求；解析从服务器响应中收 HTML、CSS\
  \ 和 JavaScript；并将结果展示给用户。这三种技术中的每项都在用户对网站的体验中起着作用。如果你的应用是一个生物体，那么 HTML 就是它的骨骼和器官（机械结构），CSS\
  \ 是它的皮肤（视觉层），而 JavaScript 则是它的性格（它的行为方式）。\n\n在本章中，你将为你的第一个项目 Ottergram 建立基础 HTML。在下一章中，你将设置\
  \ CSS，并在第 4 章 中对其进行完善。在第 6 章 中，你将开始添加 JavaScript。\n\n## 设置 Ottergram\n\n在第 1 章中，你为书中的项目创建一个文件夹，同时也为\
  \ Ottergram 创建了一个文件夹。启动你的 `Atom` 文本编辑器，点击 `File`（文件）→ `Open`（或在 Windows 上点击 `File`\
  \ → `Open Folder...`）打开 `ottergram` 文件夹。在对话框中，导航到 `front-end-dev-book` 文件夹并选择 `ottergram`\
  \ 文件夹。点击 `Open` 告诉 `Atom` 使用此文件夹（图 2.2）。\n\n**图 2.2  在 Atom 中打开你的项目文件夹**\n\n![在\
  \ Atom 中打开你的项目文件夹](img/atom-file-open-dialog.png)\n\n你会在 `Atom` 的左侧面板看到 `ottergram`\
  \ 文件夹。此面板用于在项目的文件和文件夹之间导航。\n\n你将使用 `Atom` 在 `ottergram` 项目文件夹内创建一些文件和文件夹。在左侧面板 Control-点击（右键点击）`ottergram`，并在弹出菜单中点击\
  \ `New File`（新文件）。会提示你为新文件命名。输入 `index.html` 并按回车键（图 2.3）。\n\n**图 2.3  在 Atom 中创建新文件**\n\
  \n![在 Atom 中创建新文件](img/new-file-prompt.png)\n\n你可以使用相同的过程通过 `Atom` 创建文件夹。再次在左侧面板\
  \ Control-点击（右键点击）`ottergram`，但这次在弹出窗口中点击 `New Folder`（新文件夹）。在出现的提示中输入名称 `stylesheets`（图\
  \ 2.4）。\n\n**图 2.4  在 Atom 中创建新文件夹**\n\n![在 Atom 中创建新文件夹](img/new-folder-prompt.png)\n\
  \n最后，在 `stylesheets` 文件夹中创建一个名为 `styles.css` 的文件：在左侧面板 Control-点击（右键点击）`stylesheets`\
  \ 并选择 `New File`。提示符会预填充文本“stylesheets/”。之后，输入 `styles.css` 并按回车键（图 2.5）。\n\n**图\
  \ 2.5  在 Atom 中创建新的 CSS 文件**\n\n![在 Atom 中创建新的 CSS 文件](img/new-css-file-prompt.png)\n\
  \n完成后，你的项目文件夹应该看起来像图 2.6。\n\n**图 2.6  Ottergram 的初始文件和文件夹**\n\n![Ottergram 的初始文件和文件夹](img/initial-folder-setup.png)\n\
  \n关于文件和文件夹的结构或命名并没有规定。然而，Ottergram（与书中的其他项目一样）遵循了许多前端开发者使用的约定。你的 `index.html` 文件将包含你的\
  \ HTML 代码。将主 HTML 文件命名为 `index.html` 可以追溯到网页早期，这种约定一直延续至今。`stylesheets` 文件夹正如其名，将包含\
  \ Ottergram 的样式信息文件。这些将是 CSS，即“级联表”文件。有时开发者会根据 CSS 文件所属的页面或网站来命名，例如 `header.css`\
  \ 或 `blog.css`。Ottergram 是一个简单的项目，只需要一个文件，因此你将其命名为 `styles.css` 以反映其全局作用。\n\n###\
  \ 初始 HTML\n\n开始编码吧。在 `Atom` 中打开 `index.html` 并添加一些基础 HTML 开始。\n\n从输入 `html` 开始。`Atom`\
  \ 将为你提供自动补全选项，如图 2.7 所示。（如果没有，请确保你已按照第 1 章的说明安装了 `emmet` 插件。）\n\n**图 2.7  Atom 的自动补全菜单**\n\
  \n![Atom 的自动补全菜单](img/html-autocomplete.png)\n\n按下回车键，`Atom` 将为你提供基础 HTML 元素（图 2.8）。\n\
  \n**图 2.8  使用自动补全创建 HTML**\n\n![使用自动补全创建 HTML](img/html5-doc.png)\n\n你的光标位于 `<title>`\
  \ 和 `</title>` 之间——即起始和结束的 `title` 标签之间。输入“ottergram”为项目命名。现在，点击将光标放在起始和结束的 `body`\
  \ 标签之间的空行中。在那里，输入“header”并按回车键。`Atom` 将文本“header”转换为起始和结束的 `header` 标签，并在之间留有空行（图\
  \ 2.9）。\n\n**图 2.9  使用自动补全创建 header 标签**\n\n![使用自动补全创建 header 标签](img/header-autocomplete.png)\n\
  \n\n\n接下来，输入“h1”并按回车键。再次，你的文本被转换成了标签，但这次没有空行。再次输入文本“ottergram”。这将是出现在你网页上的标题。\n\n\
  你的文件看起来应该像这样：\n\n```\n<!doctype html>\n<html\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>ottergram</title>\n  </head>\n  <body>\n    <header>\n      <h1>ottergram</h1>\n\
  \    </header>\n  </body>\n</html>\n```\n\n`Atom` 和 `emmet` 共同为你节省了一些打字时间，并帮助你构建了格式良好的初始\
  \ HTML。\n\n让我们检查你的代码。第一行 `<!doctype html>` 定义了 `doctype`——它告诉浏览器文档是用哪个版本的 HTML 编写的。浏览器可能会根据\
  \ `doctype` 略有不同地渲染或绘制页面。在这里，`doctype` 指定的是 HTML5。\n\n早期版本的 HTML 通常有很长、复杂且难以记忆的\
  \ `doctypes`，例如：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\
  \n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n```\n\n通常，人们在每次创建新文档时都必须查找\
  \ `doctype`。\n\n在 HTML5 中，`doctype` 既短又简洁。它将在书中所有的项目中被反复使用，你也应该在你的应用中使用它。\n\n在 `doctype`\
  \ 之后是一些基础的 HTML 标记，由 `head` 和 `body` 组成。\n\n`head` 将包含有关文档的信息以及浏览器应该如何处理该文档。例如，文档标题、页面使用的\
  \ CSS 或 JavaScript 文件，以及文档最后修改时间都包含在 `head` 中。\n\n在这里，`head` 包含一个 `<meta>` 标签。`<meta>`\
  \ 标签为提供提供有关本身的信息，例如文档作者的姓名或搜索引擎的关键词。Ottergram 中的 `<meta>` 标签 `<meta charset=\"utf-8\"\
  >` 指定文档使用 UTF-8 字符集编码，该字符集包含了所有的 Unicode 字符。在你的文档中使用此标签，以便最广泛的浏览器能够正确解释它们，特别是当你预计会有国际流量时。\n\
  \n`body` 将包含代表你页面内容的所有 HTML 代码：出现在页面上的所有图像、链接、文本、按钮和视频。\n\n大多数标签都封装着其他内容。看看你包含的\
  \ `h1` 标题；它的结构已在图 2.10 所示。\n\n**图 2.10 简单 HTML 标签的结构**\n\n![简单 HTML 标签的结构](img/anatomy-of-a-tag.png)\n\
  \nHTML 代表“超文本标记语言（hypertext markup language）”。标签被用来“标记”你的内容，指定它们的用途——例如标题、列表项目和链接。\n\
  \n一组标签封装的内容也可以包含其他 HTML。注意，例如，`<header>` 标签封装了上面所示的 `<h1>` 标签（而 `<body>` 标签封装了 `<header>`！）。\n\
  \n有许多标签可以选择——超过 140 种。要查看它们的列表，请访问 MDN 的 HTML 元素参考，地址位于 [developer.mozilla.org/en-US/docs/Web/HTML/Element](https://developer.mozilla.org/en-US/docs/Web/HTML/Element)。该参考包含了对每个元素的简要描述，并按用法对元素进行分组（例如：文本内容、内容分节或多媒体）。\n\
  \n### 链接样式表\n\n在样式表中，在第 3 章 中，使用 `<link>` 标签将外部样式表连接到 HTML 文档。`<link>` 标签有两个属性，告诉浏览器\
  \ `stylesheets.css`。你将 `rel` 属性设置为 `\"stylesheet\"`，让浏览器知道它的关系。`href` 属性向 `stylesheets`\
  \ 发起请求。\n\n```\n<!doctype html>\n<<html>\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>ottergram</title>\n    <link rel=\"stylesheet\" href=\"stylesheets.css\"\
  >\n  </head>\n  <body>\n    <header>\n      <h1>ottergram</h1>\n    </header>\n\
  \    ...\n```\n\n`<link>` 标签是将将样式表连接到 HTML 文档的方式。它有两个属性（图 2.11）所示（属性的顺序并不重要）。\n\n\
  **图 2.11 带有属性的标签**\n\n![带有属性的标签的结构](img/tag-tag.png)\n\n### 添加内容\n\n没有内容的网页就像没有咖啡一样。你将使用\
  \ `<ul>` 标签添加一个无序列表（即项目符号列表）。在列表中，你包含五个 `<li>` 标签，在每个列表项目中你将包含由 `<span>` 标签封装的文本。\n\
  \n```html\n<!doctype html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n   \
  \ <title>ottergram</title>\n    <link rel=\"stylesheet\" href=\"stylesheets.css\"\
  >\n  </head>\n  <body>\n    <header>\n      <h1>ottergram</h1>\n    </header>\n\
  \    <ul>\n      <li>\n        <span>Barry</span>\n      </li>\n      <li>\n   \
  \     <span>Robin</span>\n      </li>\n      <li>\n        <span>Maurice</span>\n\
  \      </li>\n      <li>\n        <span>Lesley</span>\n      </li>\n      <li>\n\
  \        <span>Barbara</span>\n      </li>\n    </ul>\n  </body>\n</html>\n```\n\
  \n嵌套在 `<li>` 标签内部的 `<span>` 标签没有特殊含义。它们是内容的通用容器。你将在 Ottergram 中用它们进行样式处理，并在继续阅读本书时将看到其他容器元素的示例。\n\
  \n接下来，你将为你输入的名称添加水獭的图像。\n\n### 添加图像\n\n书中所有项目的资源文件位于 [www.bignerdranch.com/downloads/front-end-dev-resources.zip](http://www.bignerdranch.com/downloads/front-end-dev-resources.zip)。它们包含了由\
  \ Michael L. Baird、Joe Robertson 和 Agunther 拍摄的五张 Creative Commons 许可的水獭图像，发现于 [commons.wikimedia.org](https://commons.wikimedia.org)。\n\
  \n下载并解压资源。在 `ottergram-resources` 文件夹中找到 `img` 文件夹。将 `img` 文件夹复制到你的 `ottergram/`\
  \ 项目目录。（该 .zip 包含其他资源，但目前你只需要 `img` 文件夹。）\n\n\n\n[content]\n你希望列表不仅包含标题，还包含可以点击的缩略图。你将通过为\
  \ `ul` 中的每个项目添加锚点标签和图像标签来实现这一目标。在你输入这些内容后，我们将详细解释这些更改。（如果你使用自动补全功能，请注意你需要移动 `</a>`\
  \ 标签，使其紧跟在 `<span>` 标签之后。）\n\n```\n...\n    <ul>\n      <li>\n        <a href=\"\
  #\">\n          <img src=\"img/otter1.jpg\" alt=\"Barry the Otter\">\n         \
  \ <span>Barry</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"\
  #\">\n          <img src=\"img/otter2.jpg\" alt=\"Robin the Otter\">\n         \
  \ <span>Robin</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"\
  #\">\n          <img src=\"img/otter3.jpg\" alt=\"Maurice the Otter\">\n       \
  \   <span>Maurice</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"\
  #\">\n          <img src=\"img/otter4.jpg\" alt=\"Lesley the Otter\">\n        \
  \  <span>Lesley</span>\n        </a>\n      </li>\n      <li>\n        <a href=\"\
  #\">\n          <img src=\"img/otter5.jpg\" alt=\"Barbara the Otter\">\n       \
  \   <span>Barbara</span>\n        </a>\n      </li>\n    </ul>\n...\n```\n\n如果你的代码行没有良好对齐，你可以利用已经安装的\
  \ `<samp class=\"application\">atom-beautify</samp>` 插件。点击 `<samp class=\"guimenu\"\
  >Packages</samp>` → `<samp class=\"guisubmenu\">Atom Beautify</samp>` → `<samp class=\"\
  guimenuitem\">Beautify</samp>`，代码就会自动为你对齐并缩进。\n\n让我们来看看你添加了的内容。\n\n`<a>` 标签是 `anchor`（锚点）标签。锚点标签让页面上的元素变得可点击，从而将用户带到另一个页面。它们通常被称为“链接（links）”，但注意：它们与你之前使用的\
  \ `<link>` 标签不同。\n\n锚点标签有一个 `href` 属性，指示锚点指向的资源。通常该值是一个网页地址。但有时，你并不希望链接跳转到任何地方。目前的情况如此，所以你为\
  \ `href` 属性分配了“占位”值 `#`。这会让浏览器在点击图像时滚动到页面顶部。稍后，你将使用锚点标签在点击缩略图时打开图片的放大版本。\n\n在锚点标签内部，你添加了\
  \ `<img>` 或 `image` 标签，其 `src` 属性指示你之前添加的 `<samp class=\"filename\">img</samp>`\
  \ 目录中的文件名。你还为图像标签添加了描述性的 `alt` 属性。`alt` 属性包含在图像无法加载时替换图像的文本。`alt` 文本也是屏幕阅读器用于向视觉受障的用户描述图像的内容。\n\
  \n图像标签与大多数其他元素不同之处在于，它们不包裹其他元素，而是引用一个资源。当浏览器遇到 `<img>` 标签时，它会将图像绘制到页面上。这被称为“替换元素（replaced\
  \ element）”。其他替换元素包括嵌入文档和应用程序（applets）。\n\n因为它们不包含内容或其他元素，`<img>` 标签没有对应的闭合标签。这使得它们成为自闭合标签（self-closing，也称为\
  \ `void` 标签）。有时你会看到自闭合标签在右角括号前带有一个斜杠，例如 `<img src=\"otter.jpg\"/>`。是否包含斜杠取决于个人偏好，对浏览器没有影响。在本书中，自闭合标签是不带斜杠书写的。\n\
  \n保存 `<samp class=\"filename\">index.html</samp>`。稍后，你将看到你代码的结果。\n\n## 在浏览器中查看网页\n\
