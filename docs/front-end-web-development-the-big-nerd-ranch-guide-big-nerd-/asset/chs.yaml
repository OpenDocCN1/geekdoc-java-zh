  \ 元素。（在后续章节中，你将学习更多关于 DOM（即“文档对象模型”）的内容。）元素面板右侧是样式面板。它显示了应用于单个元素的任何视觉样式。\n\n工作时将开发者工具停靠在屏幕右侧通常很方便。如果你想更改开发者工具的位置，可以点击右上角附近的![显示元素面板的开发者工具](img/devtools-config-button.png)按钮。这将显示一个选项菜单，包括`Dock\
