  \ 中添加以下属性：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  alertMessage: null,\n  alertType: null,\n  isAlertShowing: false\n});\n```\n\n\
  *(注：原文中包含大量重复的代码块和句子。我将根据技术教程的逻辑提供一个清晰的整合版本。)*\n\n\n\n\n![闪电提醒 – 新发现](img/component-flash-alert-new.png)\n\
  \n最后一步是添加用于从屏幕上移除警告的动作（action）和事件。你只想在创建新消息后显示 `flash-alert`，因此在移除它时，你需要切换开关来隐藏警告。\n\
  \n在 `app/controllers/application.js` 中，添加一个名为 `removeAlert` 的动作：\n\n```\n...\nexport\
  \ default Ember.Controller.extend({\n\n  alertMessage: null,\n  alertType: null,\n\
  \  isAlertShowing: false,\n  actions: {\n    removeAlert(){\n      this.set('alertMessage',\
  \ \"\");\n      this.set('alertType', \"success\");\n      this.set('isAlertShowing',\
  \ false);\n    }\n }\n});\n```\n\n这会将 `isAlertShowing` 设置为 `false`，将 `alertMessage`\
  \ 设置为空字符串，并将 `alertType` 设置为 `\"success\"`。\n\n接下来，向组件发送 `removeAlert` 动作。在 `app/templates/application.hbs`\
  \ 中添加以下内容：\n\n```\n......</header>\n<div class=\"container\">\n  {{#if isAlertShowing}}\n\
  \    {{flash-alert message=alertMessage alertType=alertType}}\n      close=(action\
  \ \"removeAlert\")}}\n  {{/if}}\n  {{outlet}}\n</div>\n```\n\n`close=(action \"\
  removeAlert\")` 语法看起来可能很奇怪。这是 `Ember` 2.0 的新特性，被称为“闭包动作”（closure action）。该函数字面量被传递传递，并作为名为\
  \ `close` 的属性从组件调用，就像别名一样。\n\n旧版本的 `Ember` 这种流程版本更为复杂。从底层来说，闭包动作不仅仅是作为参数从对象传递函数。要了解更多关于闭包动作的信息，请访问\
  \ EmberJS 博客上关于版本 1.13 和 2.0 特性的文章：[emberjs.com/​blog/​2015/​06/​12/​ember-1-13-0-released.html`](http://emberjs.com/blog/2014/06/12/ember-1-13-0-released.html)。\n\
  \n接下来，你需要从组件中调用此动作。组件是 DOM 元素的实例；因此，它们拥有代表 DOM 元素事件的键值对。你可以添加 `click` 事件监听器的声明，`Ember`\
  \ 会将该监听器添加到包裹模板的 `<div>` 元素上。在 `app/components/flash-alert.js` 中添加以下内容：\n\n```\n\
  import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  ...\n \
  \ typeTitle: Ember.computed('alertType', function() {\n    return Ember.String.capitalize(this.get('alertType'));\n\
  \  }),\n  click() {\n    this.get('close')();\n  }\n});\n```\n\n属性 `close` 在被调用时将触发在应用程序控制器上定义的\
  \ `\"removeAlert\"` 动作。通过使用闭包动作，你将组件的属性分配了一个定义在父控制器中的函数，并将组件的功能绑定到其父级的作用域中。你可以在任何级别添加\
  \ `flash-alert`，并根据上下文为 `close` 分配不同的功能。\n\n你添加了一个可以响应向下传递的数据以自定义组件，以及一个可以响应向上上传的动作以从父控制器设置组件外部状态的组件。这就是组件的生命周期：数据向下，动作向上。在创建组件时，请记住这种模式。\n\
  \n在整个应用程序架构章节中，你学习了使用 `Ember` 构建的现代应用程序的结构。你学习了 MVC 模式以及此框架如何帮助你通过预构建的 JavaScript\
  \ 对象分离关注点。它还帮助你通过命名模式、脚架生成、构建工具和约定来保持逻辑清晰。从现在起，你可以放心地使用 `ember new` 创建新应用。你可以直接投入到应用程序的需求：建模数据、创建路由和构建组件。\n\
  \n`Ember` 社区维护着这个极佳的框架，并随着 JavaScript 的成熟不断提高效率。这个框架是由这些人构建的，他们在磨练 JavaScript 技能时遇到过与你相同的挑战。记住，当某些功能不起工作时要提问，当你发现有错误时帮助修复，并在可能时给予回馈。你现在是整个\
  \ JavaScript 社区的一员。\n\n## 铜级挑战：自定义警告消息\n\n你在添加发现时触发的 `{{flash-alert}}` 是通用的。请将发现的位置和日期添加到消息中。\n\
  \n## 银级挑战：将 NavBar 变为组件\n\n将应用程序模板中的 `NavBar` 变为组件。添加一个属性状态来显示两个版本的导航。在 `NavBar`\
  \ 组件中添加条件语句以显示特定的链接。\n\n## 金级挑战：警告数组\n\n重构 `flash-alert` 组件，使其接受一个带有不同警告类型和消息的警告数组。你可能需要同时在屏幕上显示多个警告。使用\
  \ `Ember.ArrayProxy` 代替单独的警告属性设置。向数组中添加消息、类型和一个新的 `index` 属性，以便你可以在点击它时从数组中移除该项。\n\
