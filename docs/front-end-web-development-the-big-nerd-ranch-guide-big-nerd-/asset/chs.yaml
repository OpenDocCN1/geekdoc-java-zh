  \ {\n  this.route('sightings', function() {\n    this.route('new');\n  });\n  this.route('sighting',\
  \ function() {\n    this.route('edit');\n  });\n  this.route('cryptids');\n  this.route('cryptid',\
  \ {path: 'cryptids/:cryptid_id'});\n  this.route('witnesses');\n  this.route('witness');\n\
  });\n...\n```\n\n尝试一下。点击其中一张加密生物图片后，你应该看到一个空白页面。这是好的。你的应用正将你路由到 `CryptidRoute`，它正在渲染单数的\
  \ `app/templates/cryptid.hbs`。该文件目前是空的。\n\n如果你点击了独角兽 Charlie 的图片，可能会收到一个错误。记得他的记录是在\
  \ `beforeModel` 钩子中创建的，并且没有 `id`。这意味着它尝试传递给 `{{#link-to}}` 辅助函数的值是 `null`。\n\n这是一个移除该\
  \ `beforeModel` 钩子的好机会。创建操作应该留给创建新加密生物的页面，我们将在第 24 章 中介绍。\n\n从 `app/routes/cryptids.js`\
  \ 中移除该钩子。\n\n```\n...\n  beforeModel(){\n    this.store.createRecord('cryptid',\
  \ {\n      \"name\": \"Charlie\",\n      \"cryptidType\": \"unicorn\"\n    });\n\
  \  },\n  model(){\n    return this.store.findAll('cryptid');\n  }\n...\n```\n\n\
  接下来，在 `app/routes/cryptid.js`（单数）中添加加密生物数据的请求。\n\n```javascript\nimport Ember from\
  \ 'ember';\n\nexport default Ember.Route.extend({\n  model(params){\n    return\
  \ this.store.findRecord('cryptid', params.cryptid_id);\n  }\n});\n```\n\n`cryptid_id`\
  \ 动态路由参数被传递给路由的 `model` 钩子。使用 `store.findRecord` 方法获取加密生物。\n\n现在，编辑单数的模板 `app/templates/cryptid.hbs`\
  \ 以显示生物的图片和名称：\n\n```handlebars\n{{outlet}}\n<div class=\"container text-center\"\
  >\n  <img class=\"img-rounded\" src=\"{{model.profileImg}}\" alt=\"{{model.name}}\"\
  >\n  <h3>{{model.name}}</h3>\n</div>\n```\n\n`{{outlet}}\n<div class=\"container\
  \ text-center\">\n  <img class=\"img-rounded\" src=\"{{model.profileImg}}\" alt=\"\
  {{model.name}}\">\n  <h3>{{model.name}}</h3>\n</div>\n```\n\n使用 `NavBar` 导航到加密生物并查看其详情页（图\
  \ 23.6）。\n\n\n\n\n```\n...\n          {{#if sighting.location}}\n            <h3>{{sighting.location}}\
  \ - {{sighting.sightedAt}}</h3>\n            <p>{{moment-from sighting.sightedAt}}</p>\n\
  \          {{else}}\n...\n```\n\n`moment-from` 助手函数接受单个参数，并返回格式化为 HTML 字符串的日期。当你使用自定义助手函数渲染\
  \ HTML 元素时，`Ember` 提供了 `Ember.Handlebars.SafeString` 方法来输出整洁的标记。\n\n查看你新格式化的日期（图\
  \ 23.7）。\n\n**图 23.7 观测 `moment.js` 日期**\n\n![Sightings moment.js date](img/templates-sighting-moment-date.png)\n\
  \n`moment.js` 库接收日期对象并将其格式化为类似“2 个月前”的内容。这看起来比“Tue Feb 9 2016 19:00:00 GMT-0500\
  \ (EST)”要好得多！（`moment.js` 有许多格式化日期的选项——访问 [`momentjs.com](http://momentjs.com) 了解更多信息。）\n\
  \n通过创建一个输出特定文本的助手函数，你可以从模板中移除一些逻辑。自定义助手函数允许你减少重复并集中处理 UI 格式化。这是将代码抽象为 `Ember Components`\
  \ 的第一步，你将在第 25 章 中学习到相关内容。\n\n在本章中，你学习了如何显示基础模型属性，并使用条件判断和循环自定义模板。你将 HTML 元素属性绑定到属性，并创建了带有动态属性的新路由，以加载单个记录作为模板的后数据模型。最后，你使用了助手函数进行页面链接，并通过构建一个自己的用于格式化日期的助手函数，完善了对助手函数的理解。\n\
  \n在下一章中，你将通过控制器创建和编辑数据来完成应用程序的生命周期。你将学习操作（actions）、从数据存储中检索多个集合以及创建装饰器（decorators）。\n\
  \n## 铜级挑战：添加链接悬停效果\n\n你创建的链接需要一些悬停内容。要实现这一点，请为你的 `{{#link-to}}` 助手添加 `title` 属性。该标题应该是神秘生物（cryptid）的名称。\n\
  \n## 银级挑战：更改日期格式\n\n`{{moment-from}}` 助手函数让日期不再那么笨拙，但现在它提供的信息没有那么充分。查看 `moment`\
  \ 文档并更改助手函数的输出，将日期格式化为“Sunday May 31, 2016”。\n\n## 金级挑战：创建一个自定义缩略图助手\n\n神秘生物缩略图的标记有点长。创建一个自定义助手，通过将图像路径传递给助手来显示神秘生物缩略图。在所有出现神秘生物图像的地方使用助手来清理你的代码。\n\
  \n# 24 控制器\n\n控制器是 MVC 模式的最后一部分。正如你在第 19 章 中学到的，控制器持有应用程序逻辑，检索模型实例并将其交给视图，并且包含更改模型实例的处理器函数。\n\
  \n你在本章中构建的控制器不会是巨大的代码块。这就是 MVC 的理念：将应用程序的复杂性分配到它所属的地方。管理数据是模型的工作，处理 UI 是视图的职责。控制器只需要，嗯，*控制*模型和视图。\n\
  \n在你不知情的情况下，`Ember` 在程序运行时一直在向你的应用程序添加控制器对象。控制器是路由对象和模板之间的代理，负责传递模型。当你没有添加控制器对象时，`Ember`\
  \ 知道模型数据足够传递给模板，它会为你完成这一操作。\n\n在 `Ember` 中创建控制器允许你在激活时定义操作。为了让用户能够创建新的观测，你需要路由、控制器和属性。为了让现有的观测被编辑，你需要创建一个控制器。新的观测需要拥有一个（has）或多个（has\
  \ many）见证者。你已经创建了 `app/sightings/new.js`。你的表单将看起来像图 24.1。\n\n**图 24.1 观测缩略图表单**\n\
  \n![Sightings moment.js date](img/templates-sighting-moment-date.png)\n\n当你设置好所有内容后，将使用该组件来管理新表单的事件。\n\
  \n## 新观测\n\n你设置的 `SightingsRoute` 模型返回所有观测。对于新观测，将返回单个观测。为了这样做，你需要神秘生物和见证者。\n\n\
  让我们开始。打开 `app/sightings/new.js` 并添加一个 model 钩子来返回一个 `Promise` 集合：\n\n```javascript\n\
  ...\nexport default Ember.Route.extend({\n  model() {\n    return Ember.RSVP.hash({\n\
  \      sighting: this.store.createRecord('sighting')\n    });\n  }\n});\n```\n\n\
  当此路由激活时，返回一个新的观测记录。如果你返回 `sightings`，你会看到空条，因为你创建了一个记录。你将在本末处理*脏数据*（已更改但未保存的模型数据）。现在，知道\
  \ `createRecord` 已向本地集合添加了一个新观测。\n\n在创建新观测时，你需要神秘生物和见证者列表。这里使用 `Ember.RSVP.hash`\
  \ 表示你正在返回一个 `Promise` 哈希。唯一的键是 `sighting`，这意味着你模板中的 `model` 引用需要查找 `model.sighting`\
  \ 来引用你创建的观测。\n\n在此哈希中添加神秘生物和见证者的检索方法（不要忘记 `this.store.createRecord('sighting')`\
  \ 之后的逗号）。\n\n```javascript\n...\nexport default Ember.Route.extend({\n  model()\
  \ {\n    return Ember.RSVP.hash({\n      sighting: this.store.createRecord('sighting'),\n\
  \      cryptids: this.store.findAll('cryptid'),\n      witnesses: this.store.findAll('witness')\n\
  \    });\n  }\n}\n```\n\n\n\n\n\n所有模型数据设置完成后，你现在可以编辑模板 `app/templates/sightings/new.hbs`\
  \ 来创建一个新的目击表：\n\n```html\n<h1>New Route</h1>\n<h1>New Sighting</h1>\n<form>\n  <div\
  \ class=\"form-group\">\n    <label for=\"name\">Cryptid</label>\n    {{#x-select\
  \ value=model.sighting.cryptid class=\"form-control\"}}\n      {{#x-option}}Select\
  \ Cryptid{{/x-option}}\n      {{#each model.cryptids as |cryptid|}}\n        {{#x-option\
  \ value=cryptid}}{{cryptid.name}}{{/x-option}}\n      {{/each}}\n    {{/x-select}}\n\
  \  </div>\n  <div class=\"form-group\">\n    <label>Witnesses</label>\n    {{#x-select\
  \ value=model.sighting.witnesses multiple=true class=\"form-control\"}}\n      {{#x-option}}Select\
  \ Witnesses{{/x-option}}\n      {{#each model.witnesses as |witness|}}\n       \
  \ {{#x-option value=witness}}{{witness.fullName}}{{/x-option}}\n      {{/each}}\n\
  \    {{/x-select}}\n  </div>\n  <div class=\"form-group\">\n    <label for=\"location\"\
  >Location</label> {{input value=model.sighting.location\n      type=\"text\" class=\"\
  form-control\" name=\"location\" required=true}}\n  </div>\n</form>\n```\n\n哇！这包含了你一直以来所的一切——甚至更多。该路由使用了新的\
  \ `Ember.RSVP` 方法，模板使用了辅助函数（helpers），并且使用了新的 `x-select` 和 `x-option` 组件。\n\n`x-select`\
  \ 组件的构建用于使用 `<select>` 元素为属性赋值。它的设计工作方式就像在 `Ember` 数据绑定环境中的原生 `<select>` 元素一样。你将\
  \ `value` 赋值给 sightings 模型的 `cryptid` 属性，当选择新选项时，该组件将处理 `onchange` 事件。这之所以行得通，是因为\
  \ `cryptid` 属性需要一个 `cryptid` 记录作为它的值。\n\n对于 witnesses（见证者），有一个额外的属性 `multiple=true`，它允许用户为一次目击选择多个见证者。多次选择将转换为\
  \ `hasMany` 见证者的集合。\n\n在继续下一步之前，你需要为 sightings 路由添加一个链接，这样你就有办法进入 `sightings` 路由了。打开\
  \ `app/templates/sightings.hbs` 并处理它：\n\n```html\n<h1>Sightings</h1>\n<div class=\"\
  row\">\n  <div class=\"col-xs-6\">\n    <h1>Sightings</h1>\n  </div>\n  <div class=\"\
  col-xs-6\">\n    {{#link-to \"sightings.new\" class=\"pull-right btn-primary\"}}\n\
  \      New Sighting\n    {{/link-to}}\n  </div>\n</</div>\n{{outlet}}\n```\n\n你的链接利用了\
  \ `Bootstrap` 格式的简单性来创建一个按钮。加载 [`localhost:4200/sightings`](http://localhost:4200/sightings)\
  \ 查看它（图 24.2 新目击按钮）。\n\n**图 24.2 新目击按钮**\n\n![New Sighting button](img/ember-new-button.png)\n\
  \n现在你拥有了导航到 `sightings.new` 路由的能力。新按钮添加了一个可以在 sightings 路由树中任何地方创建新目击的链接。\n\n此外，注意当你处于\
  \ `sightings.new` 路由时，按钮是激活状态。`Ember` 考虑了一切，即使当前路由就是该链接的路由，也会为链接提供一个激活类（active class）。按钮或链接上的激活状态以\
  \ UI 的形式表示当前路由。\n\n动作（Actions）是处理表单事件——你应用中任何其他事件的关键。`actions` 是一个哈希（hash），你在其中将函数赋值给键。这些键将在模板中用于触发回调函数。\n\
  \n你已准备好使用此终端命令为 `sightings.new` 路由创建控制器了：\n\n```bash\nember g controller sightings/new\n\
  ```\n\n`Ember` 创建了 `app/controllers/sightings/new.js` 文件。打开它并添加创建目击所需的 `create`\
  \ 和 `cancel` 动作：\n\n```javascript\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Controller.extend({\n  actions: {\n    create() {\n    },\n    cancel()\
  \ {\n    }\n  }\n});\n```\n\n在创建表单元素时，`action` 属性通常有一个提交表单的 URL。在 `Ember` 中，表单元素只需要函数名称即可运行。\n\
  \n在 `app/templates/sightings/new.hbs` 中，让表单元素为 `submit` 设置动作。同时添加 `Create` 和 `Cancel`\
  \ 按钮：\n\n```html\n<h1>New Sighting</h1>\n<form {{action \"create\" on=\"submit\"\
  }}>\n...\n  <div class=\"form-group\">\n    <label for=\"location\">Location</label>\
  \ {{input value=model.location\n      type=\"text\" class=\"form-control\" name=\"\
  location\" required=true}}\n  </div>\n  <button type=\"submit\" class=\"btn btn-primary-block\"\
  >Create</button>\n  <button {{action 'cancel'}} class=\"btn btn-link-block\">Cancel</button>\n\
  </form>\n```\n\n`Atom` 可能会对带有 `action` 的辅助函数的行发出警告。你可以忽略这些警告。（你也可以安装 `Language-Mustache`\
  \ 并在 `Atom` 偏好中启用它，以便 `Atom` 识别这种语法。该软件包可以在 [atom.io/packages/language-mustache](https://atom.io/packages/language-mustache)\
  \ 找到。）这两个 `action` 辅助函数使用的字符串参数与你在 `app/controllers/sightings/new.js` 中创建的动作匹配。`action`\
  \ 辅助函数接受一个 `on` 参数，你将动作赋值给它。如果你没有添加 `on` 参数，则会将点击事件绑定到该动作。\n\n在新目击表单中，你为 `submit`\
  \ 设置了 `action`，以指定调用 `create` 动作。另一方面，你没有为取消按钮提供 `on` 参数，因此事件将是点击事件。\n\n\n\n\n\n\
  ```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  model() {\n    let record1 = this.store.createRecord('sighting', {\n      location:\
  \ 'Atlanta',\n      sightedAt: new Date('2016-02-09')\n    });\n    record1.set('location',\
  \ 'Paris, France');\n    console.log(\"Record 1 location: \" + record1.get('location'));\n\
  \n    let record2 = this.store.createRecord('sighting', {\n      location: 'Calloway',\n\
  \      sightedAt: new Date('2016-03-14')\n    });\n\n    let record3 = this.store.createRecord('sighting',\
  \ {\n      location: '',\n      sightedAt: new Date('2016-03-21')\n    });\n\n \
  \   return [record1, record2, record3];\n    // return this.store.findAll('sighting',\
  \ {reload: true});\n  }\n});\n```\n\n现在你的应用已经具备创建和检索功能。\n\n请注意 `findAll()` 的第二个参数，即带有单个键\
  \ `reload` 的对象字面量。此参数告诉 `store` 在每次调用路由模型时都从 API 请求新鲜数据。添加此参数可以显式地表示，你希望每次查看列表时都始终获取最新的数据。\n\
  \n接下来，`cancel` 操作需要删除内存中的“脏”（dirty） sighting 记录实例。你将像在第 21 章中做的那样使用 `model.deleteRecord()`。将其添加到\
  \ `app/controllers/sightings/new.js`。\n\n```javascript\n...\n  actions: {\n    create()\
  \ {\n      var self = this;\n      this.get('model.sighting').save().then(function()\
  \ {\n        self.transitionToRoute('sightings');\n      });\n    },\n    cancel()\
  \ {\n      this.get('model.sighting').deleteRecord();\n      this.transitionToRoute('sightings');\n\
  \    }\n  }\n...\n```\n\n删除记录后，用户将返回到列表页。这种场景在用户点击 `cancel` 按钮时有效，但当使用顶部导航返回列表页或其他路由时，会发生什么呢？\n\
  \n如果你不销毁这个脏记录，它会在用户会话激活期间一直留在内存中。要销毁该记录，你将在路由中使用一个操作。\n\n在路由的生命周期中，会有操作在不同的状态和转换期间调用。你可以重写这些操作，为路由转换的不同阶段自定义回调函数。\n\
  \n打开 `app/routes/sightings/new.js` 并重写 `willTransition` 操作，以确保脏记录被删除：\n\n```javascript\n\
  ...\n  model(){\n    return Ember.RSVP.hash({\n      sighting: this.store.createRecord('sighting'),\n\
  \      cryptids: this.store.findAll('cryptid'),\n      witnesses: this.store.findAll('witness')\n\
  \    });\n  },\n  actions: {\n    willTransition() {\n      var sighting = this.get('controller.model.sighting');\n\
  \      if(sighting.get('hasDirtyAttributes')){\n        sighting.deleteRecord();\n\
  \      }\n    }\n  }\n});\n```\n\n操作 `willTransition` 将会在路由发生改变时触发。使用 `deleteRecord()`\
  \ 将销毁模型对象，但仅当模型属性 `hasDirtyAttributes` 为 true 时才执行。\n\n现在你已经处理了创建过程中的脏记录问题。你也准备好通过对控制器极少的更改即可将数据保存到持久化数据源。\n\
  \n## 编辑 Sighting\n\n在创建和读取数据之后，CRUD 告诉我们更新是下一步。你有一个针对 sighting 的编辑路由，但你需要通过在 sighting\
  \ 列表中添加一个导航到编辑路由的按钮来使用它。你还需要向编辑模板添加一个包含 sighting 字段的表单；让编辑路由的 `model()` 获取证人（witnesses）、cryptid\
  \ 和 sighting；以及在 `app/router.js` 的路由对象中添加路由参数。最后，你需要创建一个控制器为编辑表单添加操作。\n\n让我们从 `app/templates/sightings/index.hbs`\
  \ 中添加一个 `Edit` 按钮开始。为了给列表更多上下文，同时也添加被发现的 cryptid 的名称和图像。\n\n```handlebars\n...\n\
  \      <div class=\"media well\">\n        <img class=\"media-object thumbnail\"\
  \ src=\"{{if sighting.cryptid.profileImg\n          sighting.cryptid.profileImg\
  \ 'assets/images/cryptids/blank_th.png'}}\"\n          alt=\"{{sighting.cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3>{{sighting.cryptid.name}}</h3>\n\
  \          {{#if sighting.location}}\n            <h3>{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </div>\n        {{#link-to 'sighting.edit' sighting.location}}\n         \
  \ Edit\n        {{/link-to}}\n      </</div>\n...\n```\n\n(注：由于原始文本中存在部分截断和重复，此处已根据上下文修复了逻辑排版)\n\
  \n\n\n\n与创建模型记录类似，更新操作像调用 `save` 一样简单。你只需要在记录发生变化时才调用 API，因此可以使用 `sighting.get('hasDirtyAttributes')`。`Ember`\
  \ 已经考虑了一切！\n\n注意 `Ember.computed.alias` 的使用。这是一个赋值的计算属性，这样在调用活跃的 `sighting` 时就不需要输入这么多内容。你可以为任何属性设置别名以进行快速访问，当属性是嵌套的时尤其如此。\n\
  \n## 删除目击记录\n\n偶尔会有报告的神秘生物目击被证明是骗局。虽然这很罕见，但你确实需要一种方法来删除旧或被揭穿的数据。回想第 1 章，销毁记录是通过调用\
  \ `record.destroyRecord` 实现的。非常简单。\n\n实现它：在 `app/templates/sighting/edit.hbs` 模板中添加一个删除按钮。\n\
  \n```\n <button type=\"submit\" class=\"btn btn-info btn-block\">Update</button>\n\
  \  <button {{action 'cancel'}} class=\"btn btn-block\">Cancel</button>\n</form>\n\
  \n<hr>\n<button {{action 'delete'}} class=\"btn btn-block btn-danger\">\n  Delete\n\
  </button>\n```\n\n除了新按钮外，你在表单元素之间添加了一个水平规则（一条简单的线），将 `Update`（更新）和 `Cancel`（取消）按钮与新的\
  \ `Delete`（删除）按钮分开。`<hr>` 是你使用的的一种 UI 工具，用于表示删除记录是一个与编辑记录独立的进程。\n\n接下来，在你的控制器 `app/controllers/sighting/edit.js`\
  \ 中添加 `delete` 动作：\n\n```\n...\n    cancel() {\n      if(this.get('sighting').get('hasDirtyAttributes')){\n\
  \        this.get('sighting').rollbackAttributes();\n      }\n      this.transitionToRoute('sightings');\n\
  \    },\n    delete() {\n      var self = this;\n      if (window.confirm(\"Are\
  \ you sure you want to delete this sighting?\")) {\n        this.get('sighting').destroyRecord().then(()\
  \ => {\n          self.transitionToRoute('sightings');\n        });\n      }\n \
  \   }\n  }\n});\n```\n\n`delete` 动作添加了 `window.confirm` 来获取用户的确认。除了条件判断外，此动作与其他动作相似：获取模型，调用一个方法，并添加一个异步的\
  \ `then` 在 API 请求完成后调用。\n\n现在导航到 `http://localhost:4200/sightings` 并点击其中一个目击记录的\
  \ `Edit` 按钮，查看 `app/templates/sightings/edit.hbs` 及其新的 `Delete` 按钮（图 24.5）。\n\n\
  **图 24.5 编辑目击记录表单**\n\n![编辑目击记录表单](img/ember-controller-edit-template.png)\n\n循环完成：从创建到销毁。\n\
  \n## 路由动作\n\n动作不仅用于控制器。路由可以为模板声明动作并覆盖生命周期动作。当动作被调用时，它会从模板向上冒泡到控制器、路由以及父级路由。\n\n\
  因此，在不需要定义控制器时，路由可以充当控制器的角色。在我们讨论了分离应用程序关注点之后，这似乎是矛盾的，但 `Ember` 确实将控制器的工作分成了两个单元：路由信息和控制器逻辑。有时路由文件包含更多逻辑，有时控制器包含更多逻辑。当另一个文件有大量动作或装饰器时，文件分离允许产生小而易于理解的代码块。\n\
  \n为了看到如何工作，你把 `create` 和 `cancel` 动作从 `app/controllers/sightings/new.js` 移动到 `app/routes/sightings/new.js`。此更改还将拓宽你对这些文件之间传递的方法和对象的视角——而且当你只想用路由文件和组件来控制应用视图时，这是一个良好的实践。（你将在下一章中学习组件。）\n\
  \n首先，在 `app/routes/sightings/new.js` 中添加动作：\n\n```\nimport Ember from 'ember';\n\
  \nexport default Ember.Route.extend({\n  model() {\n  ...\n  },\n  sighting: Ember.computed.alias('controller.model.sighting'),\n\
  \  actions: {\n    willTransition() {\n      var sighting = this.get('controller.model.sighting');\n\
  \      if(sighting.get('hasDirtyAttributes')) {\n        sighting.deleteRecord();\n\
  \      }\n    },\n    create() {\n      var self = this;\n      this.get('sighting').save().then(function(data)\
  \ {\n        self.transitionTo('sightings');\n      });\n    },\n    cancel() {\n\
  \      this.get('sighting').deleteRecord();\n    }\n  }\n});\n```\n\n你还在路由中为 sighting\
  \ 创建了 `Ember.computed.alias`。`model.sighting` 将免去你每次都输入那些内容。\n\n现在，从 `app/controllers/sightings/new.js`\
  \ 中删除动作：\n\n```\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  actions: {\n    create() {\n      var self = this;\n      this.get('sighting').save().then(function()\
  \ {\n        self.transitionToRoute('sightings');\n      });\n    },\n    cancel()\
  \ {\n      this.get('sighting').deleteRecord();\n      this.transitionToRoute('sightings');\n\
  \    }\n  }\n});\n```\n\n确保你的应用程序已加载（或重启 `ember server`）。导航到 [`localhost:4200/sightings/new`](http://localhost:4200/sightings/new)\
  \ 并创建一个新的目击记录，以确保你可以运行路由动作。\n\n此时，`app/controllers/sightings/new.js` 是不再需要的。你可以删除该文件。`Ember`\
  \ 在应用程序运行时仍创建控制器对象，但你不需要它来填充 `app` 目录。\n\n本章专注于 `Ember` 控制器，向你展示如何为模板创建动作和属性、保存数据后跳转到新路由，并在取消或更改路由时销记录。动作允许你通过简单的回调更改应用程序的模型数据。控制器属性允许你在向模型数据添加关系之前拥有页面属性。最后，你完成了从编辑路由更新和删除记录的基本\
  \ CRUD 操作。\n\n`Ember` 通过允许在需要路由特定细节时可选创建控制器，实现了快速开发。动作是用户交互的关键。此外，动作可以位于路由、控制器和组件中——这些是下一章（也是最后一章）的主题。\n\
  \n## 铜级挑战：目击详情页\n\n使用 `app/templates/sighting/index.hbs` 和 `app/routes/sighting.js`\
  \ 创建一个目击详情页，显示神秘生物图片、位置和证人列表。为了起见，添加一个 `Edit` 按钮。（提示：你可以在路由上添加动作。）\n\n## 银级挑战：目击日期\n\
  \n\n\n\n\n在创建和编辑目击（sighting）时，为控制器添加一个 `sightingDate` 属性以及一个绑定到该属性的输入框。使用基础文本输入或\
  \ `input[type=\"date\"]` 来获取目击日期。使用 `moment` 将日期转换为 ISO8601 字符串，并用该字符串设置目击属性 `sightingAt`。\n\
  \n 黄金挑战：添加和删除证人\n\n在创建新的目击时，通过 `select onchange` 动作构建一个证人列表。为证人列表创建一个新属性。在创建时，将对象添加到\
  \ sightings 的 `witnesses` 属性中。\n\n在页面上，让选定的证人集合渲染为带有 `Remove` 按钮的列表。使用 `select`\
  \ 元素向列表添加项，同时从 `select` 元素中移除选项。你需要两个动作：`addWitness` 和 `removeWitness`。\n\n# 25\
  \ 组件\n\n组件是 `Ember` 中持有控制器和视图属性的对象。组件背后的概念是拥有具有独立上下文或作用域的可复 DOM 元素。组件接受属性（attributes）来定制其模板内部渲染的内容。此外，组件允许从父控制器或父路由将动作分配给属性\
  \ (图 25.1])\n\n**图 25.1 组件属性**\n\n![组件属性](img/component-reusable-property-change.png)\n\
  \n当你评估应用程序架构时，你会开始在许多路由和模板中看到具有微小差异组合。如果一组元素可以从模板中移除，并通过描述元素状态的变量来描述，那么它们就是变成组件的理想候选。\n\
  \n本章将向你展示将 DOM 元素封装在 JavaScript 对象中以便在多个路由中使用的简单示例。就像你在第 23 节 中看到的助手一样，组件以属性的形式接收参数并生成\
  \ HTML。它们还具有额外功能，即拥有自己的动作和作用域属性，以便在用户交互时更新自身。\n\n本章仅向你展示扩展应用开发的冰山一角。生产环境中的 `Ember`\
  \ 严重依赖组件来创建一致的用户界面和可维护的代码库，这些代码库有时跨越数百个路由。然而，你在这里看到的示例将为未来的项目提供基础理解，在你想将路由模板转换为可复用页面或单个元素时。\n\
  \n## 作为组件的迭代项\n\n经常可以变成组件的组合元素示例是 `{{#each}}` 迭代器中渲染的元素。可能会有一个根据迭代对象具有特定 `className`\
  \ 的 `<div>` 容器元素、一个标题、图像路径、带有动作的按钮，和/或根据对象的属性状态的样式。为了让这些易于复用，你可以将所有 DOM 代码封装在组件模板中，并创建一个组件\
  \ JavaScript 文件来处理控制器通常处理的装饰器和动作。\n\n你的目击列表是用 `{{#each}}` 迭代器构建的，你将创建第一个组件来表示目击列表项。首先在终端通过\
  \ `Ember CLI` 生成组件：\n\n```\nember g component listing-item\n```\n\n这创建了三个文件：`app/components/listing-item.js`、`app/templates/components/listing-item.hbs`\
  \ 以及测试文件 `tests/integration/components/listing-item-test.js`。\n\n现在组件已创建，你需要找到想要让组件替换的代码。打开\
  \ `app/templates/sightings/index.hbs` 并找到此代码块。稍后你把这段部分代码移动到组件中。现在，只需查看它。\n\n```\n\
  <div class=\"row\">\n  {{#each model as |sighting|}}\n    <div class=\"col-xs-12\
  \ col-sm-3 text-center\">\n      <div class=\"media well\">\n        <img class=\"\
  media-object thumbnail\" src=\"{{if sighting.cryptid.profileImg\n          sighting.cryptid.profileImg\
  \ 'assets/images/cryptids/blank_th.png'}}\"\n          alt=\"{{sighting.cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3{{sighting.cryptid.name}}</h3>\n\
  \          {{#if sighting.location}}\n            <h3{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </div>\n        {{#link-to 'sighting.edit' sighting.id tagName=\"button\"\n\
  \          class=\"btn btn-success btn-block\"}}\n          Edit\n        {{/link-to}}\n\
  \      </div>\n    </div>\n  {{/each}}\n</div>\n```\n\n带有 `col-xs-12` 类的容器 `<div>`（即阴影部分的\
  \ `<div>`）需要位于此特定页面。（注：原文此段存在大量重复文本，翻译已按要求处理）。\n\n\n\n\n```\n<div class=\"row\"\
  >\n  {{#each model as |sighting|}}\n    <div class=\"col-xs-12 col-sm-3 text-center\"\
  >\n      <div class=\"media well\">\n        <img class=\"media-object thumbnail\"\
  \ src=\"{{if sighting.cryptid.profileImg\n          sighting.cryptid.profileImg\
  \ 'assets/images/cryptids/blank_th.png'}}\"\n          alt=\"{{sighting.cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3>{{sighting.cryptid.name}}</h3>\n\
  \          {{#if sighting.location}}\n            <h3{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </div>\n        {{#link-to 'sighting.edit' sighting.id tagName=\"button\"\n\
  \          class=\"btn btn-success btn-block\"}}\n          Edit\n        {{/link-to}}\n\
  \      </div>\n      {{#listing-item imagePath=sighting.cryptid.profileImg\n   \
  \     name=sighting.cryptid.name}}\n      {{/listing-item}}\n    </div>\n  {{/each}}\n\
  </div>\n```\n\n你已经用单行代码替换了大量的代码。在此过程中，某些功能被删除了，但你很快就会修复它们。下一步是在组件元素上添加容器样式。它目前缺少了\
  \ `\"media\"` 和 `\"well\"` `Bootstrap` 样式。\n\n打开 `app/components/listing-item.js`\
  \ 并为 `listing-item` 组件添加一个 `classNames` 属性：\n\n```\nimport Ember from 'ember';\n\
  \nexport default Ember.Component.extend({\n  classNames: [\"media\", \"well\"]\n\
  });\n```\n\n`classNames` 属性将将其值传递给组件创建的 `div` 元素的 `classNames` 属性。\n\n现在渲染后的组件看起来如下：\n\
  \n```\n<div class=\"media well\">\n  <img class=\"media-object thumbnail\" src=\"\
  [imagePath string]\" alt=\"[name string]\"\n    width=\"100%\" height=\"100%\">\n\
  \  <div class=\"caption\">\n    <h3>[name string]</h3>\n    {{yield}}\n  </div>\n\
  </div>\n```\n\n接下来，你将向组件模板的 `{{yield}}` 部分添加元素，使得该组件实例的实现对于 `sightings` 路由是唯一的。首先，在\
  \ `app/templates/sightings/index.hbs` 中，添加将渲染在 `{{yield}}` 中的组件语境内容：\n\n```\n...\n\
  \      {{#listing-item imagePath=sighting.cryptid.profileImg\n        name=sighting.cryptid.name}}\n\
  \        {{#if sighting.location}}\n          <h3>{{sighting.location}}</h3>\n \
  \           <p>{{moment-from sighting.sightedAt}}</p>\n        {{else}}\n      \
  \    <h3 class=\"text-danger\">Bogus Sighting</h3>\n        {{/if}}\n        {{#link-to\
  \ 'sighting.edit' sighting.id tagName=\"button\"\n          class=\"btn btn-success\
  \ btn-block\"}}\n          Edit\n        {{/link-to}}\n      {{/listing-item}}\n\
  ```\n\n这段代码看起来很眼熟，它恢复了目击地点、时间以及 `Edit` 按钮。\n\n## 用于 DRY 代码的组件\n\n是时候让你的代码 DRY 一了。\n\
  \n什么？DRY 是一项编程原则，全意思是“不要重复”（don’t repeat yourself）。换句话说，如果你写了一些内容，请只在一个地方写它。\n\n\
  目击（sightings）和神秘生物（cryptids）的列表都使用了带有 `class=\"media well\"` 的元素，并包含图片和标题。因此，这是可以进行\
  \ DRY 处理的代码。组件与神秘生物的列表项并不完全匹配，但这正是 `{{yield}}` 发挥用场的地方。\n\n在神秘生物的列表中添加新的 `{{#listing-item}}`\
  \ 组件。在 `app/templates/cryptids.hbs` 中，替换 `div class=\"media well\"` 元素及其子元素：\n\n\
  ```\n<div class=\"row\">\n  {{#each model as |cryptid|}}\n    <div class=\"col-xs-12\
  \ col-sm-3 text-center\">\n      <div class=\"media well\">\n        {{#link-to\
  \ 'cryptid' cryptid.id}}\n          <img class=\"media-object thumbnail\"\n    \
  \        src=\"{{if cryptid.profileImg cryptid.profileImg\n            'assets/images/cryptids/blank_th.png'}}\"\
  \n            alt=\"{{cryptid.name}}\" width=\"100%\" height=\"100%\">\n       \
  \ {{/link-to}}\n        <div class=\"caption\">\n          <h3{{cryptid.name}}</h3>\n\
  \        </div>\n      </div>\n      {{#link-to 'cryptid' cryptid.id}}\n       \
  \ {{listing-item imagePath=cryptid.profileImg name=cryptid.name}}\n      {{/link-to}}\n\
  \    </div>\n  {{else}}\n    <div class=\"jumbotron\">\n      <h1>Creatures</h1>\n\
  \    </div>\n  {{/each}}\n```\n\n你注意到你在两个模板中引用组件的方式之间的差异了吗？目击模板使用了 `{{#listing-item}}`，而神秘生物模板使用了\
  \ `{{listing-item}}`。这是因为目击模板使用 `{{yield}}` 来渲染块特定的内容，而神秘生物模板只是向组件传递了参数。\n\n`{{listing-item}}`\
  \ 组件是一个可重用的封装器。通过 `{{yield}}`，我们可以为每个路由注入不同的内容，同时将公共布局（`media well` 结构）保留在一个地方。\n\
  \n\n\n在这里，你为 `typeClass` 添加了一个计算属性，它将用于为组件的 `<div>` 元素添加一个 `className`。该计算属性期望一个名为\
  \ `alertType` 的属性（你稍后会添加它），并返回一个带有 `\"alert-\"` 前缀的 `\"alertType\"` 字符串。这让你允许你传入一个值为\
  \ `\"success\"`、`\"info\"`、`\"warning\"` 或 `\"danger\"` 的属性，以提供警报的上下文。你将在另一个计算属性中使用同一个这个\
  \ `alertType` 属性。\n\n最后，在 `app/components/flash-alert.js` 文件中添加绑定到组件属性的 `className`\
  \ 绑定：\n\n```\n...\nexport default Ember.Component.extend({\n  classNames: [\"alert\"\
  ],\n  classNameBindings: ['typeClass'],\n  typeClass: Ember.computed('alertType',\
  \ function() {\n    return \"alert-\" + this.get('alertType');\n  })\n});\n```\n\
  \n这会根据计算属性 `typeClass` 的值向 `classNames` 数组中添加一个 `className`。当你设置 `alertType` 属性时，组件上的样式会发生变化。\n\
  \n使用 `classNameBindings` 专门用于元素的 `classNames` 属性。对于其他属性，有一个补充的 `Ember` 组件属性：`attributeBindings`。你可以将组件属性绑定到组件元素的属性上。一个基础示例是将链接的\
  \ `href` 设置为一个 `computedProperty`。例如：\n\n```\nexport default Ember.Component.extend({\n\
  \  attributeBindings: ['href', 'customHREF:href'],\n  href: \"http://www.mydomain.com\"\
  ,\n  customHREF: \"http://www.mydomain.com\"\n});\n```\n\n通过属性绑定，你可以使用传递到组件的状态数据设置组件的所有属性。如需进一步探索，请查看在线的\
  \ `Ember` 文档。\n\n接下来，添加一个计算属性来以字符串形式显示警报类型。组件模板期望一个 `typeTitle` 属性，因此你必须将此计算属性添加到\
  \ `app/components/flash-alert.js`：\n\n```\nimport Ember from 'ember';\n\nexport\
  \ default Ember.Component.extend({\n  ...\n  typeClass: Ember.computed('alertType',\
  \ function() {\n    return \"alert-\" + this.get('alertType');\n  }),\n  typeTitle:\
  \ Ember.computed('alertType', function() {\n    return Ember.String.capitalize(this.get('alertType'));\n\
  \  })\n});\n```\n\n现在，你在消息中有一个绑定到警报类型的字符串，该字符串已首字母大写，并且在模板中是一个 `<strong>` 元素。你通过通过\
  \ `alertType` 属性传递到组件的数据计算每个值的值，为组件绑定了一个类名和一个装饰性属性。\n\n接下来，你需要将你的组件添加到 `app/templates/application.hbs`\
  \ 页面中：\n\n```\n<header>\n  ...\n</header>\n<div class=\"container\">\n  {{flash-alert}}\n\
  \  {{outlet}}\n</div>\n```\n\n该组件是一个内联组件（inline component），这意味着 `{{yield}}` 中将没有要渲染的元素，且组件模板不需要\
  \ `{{yield}}`。\n\n## 数据向下传递 (Data Down)\n\n此时，警报没有任何状态数据来渲染内容和 `classNames`，只有容器。在\
  \ `app/templates/application.hbs` 中传递组件的状态：\n\n```\n...\n  {{flash-alert message=\"\
  This is the Alert Message\" alertType=\"success\"}}\n  {{outlet}}\n</div>\n```\n\
  \n启动服务器并打开浏览器访问 `http://localhost:4200/sightings`，查看 `{{flash-alert}}` 组件如何用你提供的内联数据渲染（图\
  \ 25.3]）。\n\n**图 25.3 Flash 警报**\n\n![Flash alert](img/component-flash-alert.png)\n\
  \n现在警报已出现在屏幕上，你想动态地设置 `message` 和 `alertType` 属性。你需要一个应用控制器来实现这一点。使用 `Ember CLI`\
  \ 生成器添加控制器：\n\n```bash\nember g controller application\n```\n\n应用控制器将维护 `{{flash-alert}}`\
  \ 组件的动态状态。控制器需要属性来维护警报的状态。在 `app/controllers/application.js` 中添加以下属性：\n\n```javascript\n\
  import Ember from 'ember';\n\nexport default Ember.Controller.extend({\n  alertMessage:\
  \ null,\n  alertType: null,\n  isAlertShowing: false\n});\n```\n\n你添加了将被 action\
  \ 设置的属性。现在你有了可以传递给 `app/templates/application.hbs` 中 `flash-alert` 组件的控制器属性：\n\n\
  ```javascript\n...\n</header>\n<div class=\"container\">\n  {{#if isAlertShowing}}\n\
  \    {{flash-alert message=\"This is the Alert Message\" alertType=\"success\"\n\
  \                          alertMessage alertType=alertType}}\n  {{/if}}\n  {{outlet}}\n\
  </div>\n```\n\n应用控制器维护 `{{flash-alert}}` 组件的动态状态。控制器需要属性来维护警报的状态。在 `app/controllers/application.js`\
  \ 中添加以下属性：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  alertMessage: null,\n  alertType: null,\n  isAlertShowing: false\n});\n```\n\n\
  你添加了将被 action 设置的属性。现在你有可以传递给 `app/templates/application.hbs` 中 `flash-alert` 组件的控制器属性：\n\
  \n```javascript\n...\n</header>\n<div class=\"container\">\n  {{#if isAlertShowing}}\n\
  \    {{flash-alert message=\"This is the Alert Message\" alertType=\"success\"\n\
  \                          alertMessage alertType=alertType}}\n  {{/if}}\n  {{outlet}}\n\
  </div>\n```\n\n应用控制器维护 `{{flash-alert}}` 组件的动态状态。控制器需要属性来维护警报的状态。在 `app/controllers/application.js`\
  \ 中添加以下属性：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  alertMessage: null,\n  alertType: null,\n  isAlertShowing: false\n});\n```\n\n\
  应用控制器维护 `{{flash-alert}}` 组件的动态状态。控制器需要属性来维护警报的状态。在 `app/controllers/application.js`\
  \ 中添加以下属性：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  alertMessage: null,\n  alertType: null,\n  isAlertShowing: false\n});\n```\n\n\
  应用控制器维护 `{{flash-alert}}` 组件的动态状态。控制器需要属性来维护警报的状态。在 `app/controllers/application.js`\
  \ 中添加以下属性：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
