  \ 2.17。\n\n**图 2.17�  显示元素面板的开发者工具**\n\n![显示元素面板的开发者工具](img/labeled-dev-tools.png)\n\
  \n开发者工具展示了代码与生成的页面元素之间的关系。它们允许你检查单个元素的属性和样式，并立即查看浏览器是如何解释你的代码的。这种关系对于开发和调试都至关重要。\n\
