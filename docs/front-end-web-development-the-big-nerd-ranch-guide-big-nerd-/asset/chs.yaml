  \n我们下一章将使用开发者工具。现在，请打开窗口并熟悉它的主要区域。\n\n要打开开发者工具，点击 `<samp class=\"application\">Chrome</samp>`\
  \ 地址栏右侧的 ![Chrome 开发者工具](img/hamburger.png) 图标。接下来，点击`<samp class=\"guimenu\">更多工具</samp>`\
