  md: '# Chapter 3: Basic Messaging 49


    The WebSocket specification defines that ping and pong messages may carry 125
    bytes of binary data: this is the reason for the ByteBuffer parameter on each
    of the methods. If this limit is exceeded when calling this method with a ByteBuffer
    with more than 125 bytes of binary data in it, an IllegalArgumentException will
    be thrown. As with all the sending methods on the RemoteEndpoint interface and
    its descendants, IOException is used to indicate an error during transmission
    of the message. This could happen, for example, if the underlying connection turns
    out to have disconnected before making the call to send the message.


    Now let''s turn to the more common types of messages: text and binary. In Chapter
    5, we will examine the APIs and semantics in the Java WebSocket API for sending
    messages asynchronously; for now, we will limit our review of sending messages
    synchronously. This means we will need to look at the RemoteEndpoint.Async interface
    and save our examination of the RemoteEndpoint.Async until then.


    # Sending String Messages


    There are three ways to send a String using the RemoteEndpoint.Basic API. The
    first, and simplest, is the


    > Listing: RemoteEndpoint.Basic Sending a Text Message


    ```

    public void sendText(String text) throws IOException

    ```


    method. This method sends the text parameter as a WebSocket text message. This
    means the other end of the WebSocket connection will receive the message in textual
    form. The method only returns when the message is sent or throws an error if there
    was some problem sending it. An example of this might be a broken connection occurring
    in the middle of the send. We already saw this method in action, both in Chapters
    1 and 2; it forms the most basic and frequently used way of sending a WebSocket
    message.


    Since WebSocket messages often take the form of higher-level object that gets
    serialized into a String in order to be sent, the Java WebSocket API also offers
    a way to send a String message using the familiar Writer API:


    > Listing: RemoteEndpoint.Basic Sending a Text Message to a Stream


    ```

    public Writer getEndStream() throws IOException

    ```'
