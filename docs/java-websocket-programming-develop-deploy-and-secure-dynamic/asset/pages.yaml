  md: '# 26 Java WebSocket Programming


    connection as well. Well, the open notification is analogous to the termination
    of the ring tone and the click establishing that the connection is now open.


    Once the open notifications have been received by both ends of the WebSocket conversation,
    either participating WebSocket can then send a message. How many messages get
    sent, with what time, in what order, and with what contents is, of course, very
    dependent on the application. In our analogy to a phone call, this is the time
    during the lifecycle when each party in the conversation takes the opportunity
    to say what they want to say during the call.


    At any time during the WebSocket conversation, there may be some kind of error
    during transmission of a message. The WebSocket endpoint receiving the message
    itself may generate an error (for example, if it receives a message it does not
    know how to handle properly), or the WebSocket implementation itself may generate
    an error in response to some situation if it receives a message that is bigger
    than it is able to handle). This stage in the WebSocket endpoint lifecycle may
    result in one of two outcomes: either the error will be fatal, in which the connection
    will be closed and no more messages will be able to be sent, or the error will
    be nonfatal and the endpoint will be able to continue sending and receiving messages
    if it wishes to. In the analogy of the phone call, messages may come in either
    end of the conversation, are garbled for a while but then become coherent again,
    or some more serious error in fact cause the call to terminate.


    When either party in the WebSocket conversation is ready to end the conversation,
    in this case, the WebSocket implementation communicates to the other end of the
    conversation to notify that the connection is about to close. In the analogy of
    the phone call, this is a little like in the party that is ready to end it by
    saying "goodbye" to terminate the call. Actually, the WebSocket protocol does
    not need to wait for the phone click immediately after your conversation partner
    has said said goodbye, but before you have a chance to respond in kind. A little
    rude, perhaps, for humans on a phone call, but perfectly adequate for WebSocket
    endpoints!


    Let''s review the lifecycle of a WebSocket conversation with the help of a diagram
    (see Figure 2-1). Here we can see by looking at the diagram from top to bottom
    that, once the WebSocket connection is established between the client and the
    server, each end of the WebSocket conversation is notified of the session opening.
    Once the session has been opened, each end of the WebSocket conversation receives
    a number of messages from the other party.'
