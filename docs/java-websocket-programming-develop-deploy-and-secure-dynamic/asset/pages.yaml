  md: '# Guaranteeing Message Delivery


    The WebSocket protocol offers no iron guarantee that WebSocket messages you send
    actually get properly received by the peer at the other end of the connection.
    In most cases, the WebSocket implementation will know if there is a problem during
    transmission of the message, but it can happen that the message does not get to
    the peer without any error being raised to you. So when considering the send operations
    of the Java WebSocket API, it is important to remember that the result of the
    send operation is telling you the message was transmitted, but not necessarily
    that it was received. If you need to know for sure that WebSocket messages in
    your application are received by the intended recipients, you should consider
    using some kind of return receipts that the recipient sends to confirm it actually
    got the message sender sent. Fortunately, creating message handling methods that
    return a short acknowledgment of receipt is particularly easy using the @OnMessage
    annotation: simply include a return value on your method and it will be sent back
    immediately.


