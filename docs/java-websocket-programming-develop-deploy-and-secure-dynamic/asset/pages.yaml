    # Connection Properties


    The Session object holds several properties that characterize the underlying connection.
    Some of them are not changeable once the Session has been established, an example
    being the subprotocol in use, which cannot be changed without restarting the connection
    because it is only negotiated between the client and the server during the opening
    handshake. Other properties such as the maximum idle timeout property, which governs
    the longest time the underlying connection may be idle before the WebSocket implementation
    is able to close it due to inactivity, can be changed while the Session is open.
    Rather than step through all of the Session API for these properties, we will
    summarize them in the following table:


    | Property | Use | Mutable? |

    | maxBinaryMessageSize | The maximum size of an incoming binary message that will
    be handled | Yes |

    | maxIdleTimeout | The longest a session can be inactive before it can be closed
    due to inactivity | Yes |

    | maxTextMessageSize | The maximum size of an incoming text message that will
    be handled | Yes |

    | negotiatedExtensions | The list of WebSocket extensions that were decided during
    the opening handshake | No |

    | negotiatedSubprotocols | The WebSocket subprotocol that was decided during the
    opening handshake | No |

    | protocolVersion | The version of the WebSocket network protocol in use | No
    |

    | userPrincipal | The Java UserPrincipal representing the authenticated peer user
    | No |

    | secure | Whether the underlying connection is encrypted | No |

    | userProperties | A map applications may use to store information with the session
    | Yes |'
