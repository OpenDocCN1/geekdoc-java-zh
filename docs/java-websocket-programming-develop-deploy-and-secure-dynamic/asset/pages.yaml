    the messages on a RemoteEndpoint, if your application calls this method to allow
    the batching technique to be applied, even on an implementation that supports
    it, none of the messages will be batched! This also means that if you do not care
    about batching, whether or not the WebSocket implementation you use it, it will
    never be used on your application''s messages as long as you never allow it for
    your applications.


