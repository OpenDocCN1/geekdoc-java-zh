  md: '# 210 Java WebSocket Programming


    endpoint has two EJBs that it uses to formulate the message: a stateful session
    bean and a singleton. Using the @EJB annotation, the Java EE platform takes care
    of ensuring that these instance variable references to the EJBs are initialized
    correctly before the open handling method is called when a new client connects
    to the EndpointWithEJBs endpoint. Each EJB does the same thing: when it is first
    instantiated, it notes the current time. Whenever either EJB''s getMessage() method
    is called, it returns a string containing the time it created. This is a rough
    and ready way of being able to differentiate between different instances of the
    same bean by creation time.


