  md: "# Chapter 3: Basic Messaging 61\n\nIn order for the Java WebSocket implementation\
    \ to be able to map an incoming message to the correct message handling method\
    \ on an annotated endpoint, it places a hard restriction on how these modes may\
    \ be combined, which is that each annotated endpoint may have at most one message\
    \ handling method per native WebSocket message type: text, binary, and pong.\n\
    \nThe upshot of this is that, for example, you cannot have two methods annotated\
    \ @OnMessage indicating that both wish to handle text messages. For example, you\
    \ may not have an annotated endpoint that declares the following:\n\n+   Listing:\
    \ Illegal Use of Multiple Message Handling Methods\n\n```\n@ServerEndpoint(\n\
    \    value=\"orchard\",\n    decoders={OrangeDecoder.class}\n)\npublic class FruitTree\
    \ {\n    @OnMessage\n    public void handleString(String message) {\n    }\n \
    \   @OnMessage\n    public void handleOrange(Orange orange) {\n    }\n}\n```\n\
    \nwhere OrangeDecoder implements either Decoder.Text<Orange> or Decoder.TextStream<Orange>.\
    \ This example violates the rule of having at most one message handling method\
    \ per native WebSocket message type, because it has two methods for handling incoming\
    \ text messages. If you tried to deploy such an endpoint, you would find that\
    \ doing so would cause a deployment error and your endpoint would not be deployed.\
    \ To make the above example a valid annotated endpoint, you would need to start\
    \ by separating the two message handling methods onto two distinct endpoints.\n\
    \n# Receiving WebSocket Messages in Programmatic Endpoints\n\nNow we have taken\
    \ a comprehensive look at how to handle incoming WebSocket messages on annotated\
    \ endpoints in a variety of forms, let's turn to how to handle incoming messages\
    \ on the sibling of the annotated endpoint, the programmatic endpoint."
