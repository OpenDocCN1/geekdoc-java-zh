    a WebSocket server endpoint by integrating with other Java EE components in the
    Java EE platform. We looked at how to associate the current WebSocket endpoint
    with an HttpSession and locate the ServletContext of the containing web container,
    and explored the possibilities of sharing user state and global application state
    with other web components in'
