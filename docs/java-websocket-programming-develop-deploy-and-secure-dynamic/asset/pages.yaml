  md: '# Summary


    This completes our look at the topic of advanced messaging. In this chapter, you
    have learned how to use the Java WebSocket API to send messages asynchronously,
    either using a Future object to track the progress of the transmission, or by
    supplying a SendHandler object that is called back when the transmission has concluded.
    You have learned how to configure timeouts for these send operations, and how
    to configure an application to limit the size of the incoming messages. You also
    learned that some WebSocket implementations include message batching features,
    and how to take advantage of those features when they are available.'
