    # Checking Up on Your Connection: Pings and Pongs


    We touched on the topic of ping and pong messages in Chapter 2. A ping-pong interaction
    is just the sending of a special kind of WebSocket message, called a ping message,
    and receiving in return another special (almost identical) WebSocket message,
    called a pong message. You might wish to use a ping-pong interaction for a few
    reasons.


    First, initiating a ping-pong interaction is a quick and dirty way of determining
    if the connection is actually working. Although you should be notified in your
    close event handlers if the connection is brought down, there are situations where
    this might not occur—for example, if the underlying socket has stopped responding
    because of a hardware failure.


    Second, you might use them in order to keep a connection alive that otherwise
    might be closed due to a long period of inactivity. You will remember from Chapter
    4 that you can configure the timeout property on the Session if you want to, but
    you may not have control of the other end of the WebSocket connection—for example,
    if the peer of your connection is a non-Java implementation of the WebSocket protocol
    as a browser. In such cases, sending a ping and waiting for a pong response acts
    as a manual to prevent the timeout at both ends.


    Third, you may wish to evaluate the health of the connection by timing how long
    a ping-pong interaction takes. This gives you a rough guide as to how much latency
    there might be in the connection. Ping and pong messages are only able to carry
    a very small payload of data, so a ping-pong interaction may not be a reliable
    guide as to how quickly large messages will flow backward and forward in an application,
    but it may provide some clues.'
