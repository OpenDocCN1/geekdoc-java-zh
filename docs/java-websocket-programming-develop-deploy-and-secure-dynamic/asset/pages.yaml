    # URI Template Paths


    The second kind of path you can use to publish a server endpoint is called a URI
    template. A URI template is defined as a compact sequence of characters for describing
    a range of variable expansion. In other words, a URI template is like a URI, except
    that parts of the URI have been replaced by variables. Before you look more into
    URI templates, here is a simple example of a relative URI template:


    ```

    /travel/{access-level}/flights

    ```


    In this URI-template, one of the path segments has a representation as a variable,
    access-level. URI templates are useful because, by representing segments of the
    URI as variables, a URI template can actually represent a range of URIs, each
