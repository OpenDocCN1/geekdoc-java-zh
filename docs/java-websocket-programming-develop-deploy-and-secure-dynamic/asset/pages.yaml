  md: '# WebSocket Subprotocols and WebSocket Extensions


    Even in a relatively simple application such as a chat application, we saw earlier
    in this chapter that it defines a particular format for the text messages it uses
    for its client/server communication, and it also defines a particular sequencing
    or choreography of message interactions. In fact, all WebSocket applications define
    some sort of application-specific message formats and some sort of application-specific
    choreography. The WebSocket protocol uses the name subprotocols for these application-specific
    formats and choreographies that build on top of the raw WebSocket message formats
    and connection lifecycle. A WebSocket subprotocol is marked by a simple string
    name. In our Chat example, we defined our particular choreography of chat messages
    to be the "chat" subprotocol. It may turn out that some standard WebSocket protocols
    will emerge, in which case you should be careful when thinking up subprotocol
    names for your application, but while there is a WebSocket subprotocol registry
    at www.iana.org, it seems that the subprotocol name is being used mostly as a
    simple way to mark applications with a more concise name to encapsulate its particular
    conversational conventions.


    At a deeper level, the WebSocket protocol allows for arbitrary events and data
    to be inserted within the data frames that it uses to communicate events and data
    between endpoints. This data may be used to route the frames through intermediate
    servers carrying the connection or may be used to describe or qualify the WebSocket
    data held within the data frame. If a WebSocket implementation decided to use
    this facility of the protocol, in doing so would actually be extending the WebSocket
    protocol, and such schemes are called WebSocket extensions.


    WebSocket extensions are known by a string name and a collection of name-value
    pairs that configure the extension. A small number of extensions have been formally
    proposed, such as an extension called DEFLATE, which allows compressed data to
    be carried in a WebSocket message to improve transmission efficiency, and the
    MUX extension that allows multiple logical WebSocket connections to run over one
    physical TCP connection to improve network scalability. As WebSockets get ever
    more popular, the number of subprotocols and extensions is sure to rise.'
  merge: -1
  pgno: 123
