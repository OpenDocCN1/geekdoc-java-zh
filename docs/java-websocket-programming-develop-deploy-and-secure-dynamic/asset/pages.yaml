  md: '# 24 Java WebSocket Programming


    In this chapter, we will examine the lifecycle of the WebSocket endpoint. The
    WebSocket endpoint lifecycle offers the developer a framework for managing resources
    needed by the endpoint, as well as a framework for intercepting messages. We will
    look closely at the sequencing and semantics of the lifecycle events and how the
    Java WebSocket API provides API and annotation support for processing them. We
    will see how they can be applied in a sample application in both annotated and
    programmatic form.


    # The WebSocket Protocol


    We''ll start with a little background on the WebSocket protocol itself. Readers
    need not to know every detail of this section in order to be able to use the WebSocket
    API, but it serves as a useful background to help in a general understanding of
    WebSocket technology and why the Java WebSocket API is the way it is.


    Unlike HTTP-based technologies, the WebSockets have a lifecycle that is underpinned
    by the WebSocket protocol itself. For example, in servlet technology, the underlying
    protocol defines a simple request/response interaction that is wholly independent
    of the next interaction. In fact, in most cases the underlying network connection
    that carried it will vanish completely. Technologies such as the Java Servlet
    API had to build conventions on top of this request/response interaction model
    to help developers create applications that live longer than the scope of single,
    isolated interactions; and the Java Servlet component lifecycle are good examples
    of this.


    In contrast, the WebSocket protocol defines a longer-lived and dedicated TCP connection
    between a client and a server, and because it does so, it goes further in defining
    a longer lifecycle than the traditional web request/response model. In addition,
    the WebSocket protocol defines the format of chunks of data that are transmitted
    backward and forward over the WebSocket connection. Once the connection has been
    established, these transmissions are framed with metadata that describes its purpose.
    There are two main types of frames in the WebSocket protocol: control frames and
    data frames. The control frames are transmissions of data that perform some housekeeping
    function of the protocol. For example, the protocol defines a close frame. The
    close frame* is a particular transmission that means the sender is going to close
    down the connection. The other control frames are the ping and pong frames. *Ping
    and pong frames* are transmissions of data that serve'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Chapter 2: Java WebSocket Lifecycle 25


    as a check on the health of the connection: if a WebSocket wants to check up on
    the health of the connection it has with a WebSocket peer, it can send a ping
    frame. Upon receiving a ping frame, the WebSocket peer in turn must respond as
    soon as it can with a pong frame. Mimicking a game of ping/pong, the health of
    the connection (how fast it is, or whether it is functioning at all) can be checked
    at any time.


    The other kind of data frame defined by the WebSocket protocol is the data frame.
    A data frame carries application data. The echo messages you sent in Chapter 1
    are examples of text data frames. Data frames come in two basic types, textual
    and binary, one to carry text messages and one to carry binary data as image data.
    One feature of the WebSocket protocol is that it is able to transmit messages,
    whether they are textual or binary, over multiple individual transmissions. Such
    an individual transmission that carries part of a complete message as part of
    a sequence of such transmissions is called a partial frame. This technique of
    sending a message as a sequence of partial frames is particularly useful when
    the WebSocket implementations are sending very large messages, or for sending
    messages even as they are being formulated. While the protocol is most often for
    sending only short messages, there is no defined limit on the size of a WebSocket
    message, so there will be some applications that use WebSocket messages to carry
    very large amounts of data, such as a video or a large archive of financial data.


    As you will see, hints of the low-level WebSocket protocol framing are apparent
    in some of the Java WebSocket API calls, though developers don''t need to understand
    this lower level of detail.


    # Lifecycle of a Java WebSocket


    Now that you understand a little of what is going backward and forward over the
    wire during a WebSocket session, let''s look at how the Java WebSocket API models
    the lifecycle of an endpoint.


    The first event in the lifecycle of any Java WebSocket endpoint is the open notification,
    which is the indication that the connection to the other end of the WebSocket
    session has been established. Using an analogy to a phone call, in Chapter 1 we
    talked about the handshake interaction being akin to the kind of negotiation that
    happens during the establishment of an Internet telephone call: the routing of
    the number, the selection of the connection speed to use, and whether to use voice
    only or whether to use a video'
