    20 minutes. As you move up to the silver level, you get a new color scheme and
    the quotes are more recent and occur more frequently. At the gold level, the quotes
    are tracking the market without delay, and you have a more attractive color scheme
    to reflect your elevated status. Figure 6-2 illustrates the gold access level,
    with all the data fields showing.


    Each time you change an option in the control panel, the JavaScript client is
    closing the existing connection and reestablishing a new connection. All the information
    about the member level and the data fields you wish to see'
