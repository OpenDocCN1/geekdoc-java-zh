    Notice this time that the singleton bean is saying it was created at the same
    time when you made the first connection to the WebSocket endpoint. But this time,
    the stateful session bean referenced by the WebSocket endpoint is saying it was
    created at a different time.


    This is a simple visual illustration of the fact that when you connected the second
    time to the WebSocket endpoint, the Java EE container created a second instance
    of the WebSocket endpoint to deal with the new connection. When it injected the
    EJBs into the second instance of the WebSocket endpoint, it used the same singleton
    bean as before because it is shared across all users, but it used a new instance
    of the stateful session bean, because this is a new connection.


