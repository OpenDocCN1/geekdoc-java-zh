  md: '# Chapter 6: WebSocket Path Mapping 149


    /travel/business/flights, when the access-level variable is vip

    /travel/coach/flights, when the access-level variable is coach.


    A URI that is equivalent to a URI template with specific values set for the variables
    is described as a valid expansion of the URI template.

    The following is an example of a WebSocket server endpoint mapped to the example
    URI template:


    ```

    @ServerEndpoint("/travel/{access-level}/flights")

    public class BookingService {


    }

    ```


    You can easily imagine the code that would create a ServerEndpointConfig with
    the same path, /travel/{access-level}/flights, which could be used to configure
    a programmatic endpoint.

    Now we to Rule 4.


    Rule 4: An incoming opening handshake matches a server endpoint mapped to a URI
    template if the request URI of the handshake is a valid expansion of the URI template.


    Using Rule 4, you can see that if our BookingService is deployed at fun.org within
    a WAR file with context root /customer/services, a client could connect to the
    BookingService with any of the following URIs:


    ```

    ws://fun.org/customer/services/travel/vip/flights

    ws://fun.org/customer/services/travel/premier/flights

    ws://fun.org/customer/services/travel/executive/flights

    ws://fun.org/customer/services/travel/cattleclass/flights

    ```


    The value of the access-level variable would be vip, premier, executive, and cattleclass,
    respectively.


    There are several levels of complexity of URI templates out in the wild. You have
    just seen an example of simple variable substitution. There are more complex levels
    that include regular expressions on portions of the URI, whose expansions are
    calculated using regular expression matching. The Java WebSocket API allows only
    the simpler forms of URI templates, which brings us to Rule 5.


    Rule 5: For mapping server endpoints, the Java WebSocket API allows URI templates
    templates level 1 only.'
