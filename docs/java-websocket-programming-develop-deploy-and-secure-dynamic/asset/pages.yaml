  md: 'Level-1 URI templates allow path variables that are single named

    variables that are enclosed in {} and do not contain any URI reserved characters

    such as +, * or /. This means that the following URI reserved characters templates
    are level 1, and

    are therefore allowable as WebSocket endpoint paths:


    ```

    /{foo}

    /street/{number}/{directionality}

    /{color}/trees/{seasonality}/{name}

    ```


    but the following expressions are not


    ```

    /**/

    /{day}/pants

    map/{x,y}

    /{key*}

    /location/(country/country)

    ```


    This brings a simplicity to the matching scheme for the Java WebSocket

    API at the cost of ultimate flexibility. Nevertheless, from now on we will use

    t term URI template as a shorthand for URI templates level 1 only because

    they are the only ones allowed in the Java WebSocket API. The matching rule

    for URI templates is covered by Rule 6.


    > Rule 6: An incoming URI is a match of a URI template

    level 1 path if, and only if, each variable in the URI template can

    be expanded with a non-empty value such that the resulting expansion

    is exactly the same as the URI.


    # APIs Relating to URI Template Matching


    The usefulness of using URI templates to map a server endpoint is not

    limited to using multiple URIs to connect to a published endpoint, but to

    make use of the values of the URI template variables that are a byproduct of

    the match. For example, to continue with the previous BookingService

    example, if we are able to connect to our BookingService endpoint using

    the following URI:


    ```

    ws://fun.org/customer/services/travel/vip/flights

    ```


    we might expect a better level of service and options (and price!) than if we

    connected to the BookingService endpoint using this URI:


    ```

    ws://fun.org/customer/services/travel/cattleclass/flights

    ```'
