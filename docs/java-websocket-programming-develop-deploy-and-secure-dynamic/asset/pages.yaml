    In this chapter, you will look at some of the more specialized forms of message
    processing in the Java WebSocket API. In Chapter 3, we examined the simpler synchronous
    forms of sending messages and some of the options for receiving messages. In this
    chapter, you will take a look at the asynchronous forms of message sending, the
    use of buffers for incoming messages, the configurable timeouts for send operations,
    and batching techniques. We will use the example of the MessageModes application
