- img_proc: true
  md: 'When a WebSocket message arrives in parts, the Java WebSocket API must ensure
    that the corresponding endpoint is called in the correct order and that the message
    parts do not interleave with other messages.


    These three assurances guarantee a straightforward single-threaded model for endpoints
    and rules out some of the unfortunate situations described above. This also means
    that each endpoint instance only sees the same single session instance representing
    the unique client connection that caused its creation. The session can be held
    as an instance variable, as it is in the DrawingServer endpoint.


    # # Threading and Lifecycle of Encoders and Decoders


    For developers of Encoder and Decoder classes, the Java WebSocket API guarantees
    that one instance of the Encoder or Decoder class is created per WebSocket connection.
    Together with the assurances during message processing outlined above, this means,
    for example, that decoders can expect no more than one thread to be in the decode()
    method at a time, removing the need to develop code defensively for concurrent
    access to the method. The `init()` method of Encoder and Decoder instances are
    called after the connection to which they are attached has been established but
    before the first message that will need them processing. The destroy() method
    of Encoder and Decoder instances are called as the connection is closing.


    One question that does come to mind, especially for developers of WebSocket applications
    on the server side, is where can application state be held that is common to all
    the client connections? We might easily want to extend the DrawingBoard application
    to retain the drawings that multiple clients collaborate on, or we might want
    a new client joining the group to be updated with the complete group drawing up
    to the point at which it joined. Since there is a new server endpoint instance
    for each new client, we cannot hold the group drawing there. We will return to
    the topic of endpoint state in Chapter 4 as we examine more closely the properties
    and uses of the Session object.'
