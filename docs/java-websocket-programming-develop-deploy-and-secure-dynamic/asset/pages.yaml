  md: '# 172 Java WebSocket Programming


    You may not want everyone to have access to a WebSocket endpoint you publish,
    and for those that do have access, you may want to tailor its interactions to
    suit the person who has access to it. If you are using a WebSocket on a social
    networking site that broadcasts your location on a map, you may not want the map
    containing your location to be seen by just. If a WebSocket endpoint sends news
    updates, you may well wish that it tailored the news to those topics in which
    you have shown interest in the past.


    The security model in the Java WebSocket API largely focuses on the main deployment
    setup for WebSockets: a JavaScript WebSocket client running in a web page accessing
    a Java WebSocket API server endpoint running in a web server. This chapter looks
    at the various mechanisms in the Java WebSocket API for selectively gating access
    to Java WebSocket server endpoints to particular users. We will mostly focus on
    how WebSocket endpoints running on a server and accessed by a browser client can
    be published to meet a variety of constraints.


    Those of you who are very familiar with the security for Java Servlets in the
    Java EE platform should find the security model for the Java WebSocket API relatively
    straightforward because it builds on the declarative security model of the web
    layer in the Java EE platform. We will start with some basic security concepts
    to use as a foundation for understanding the model.


    # Security Concepts


    Let''s start by looking at our basic deployment scenario: someone using a web
    browser to access a resource on a web server (see Figure 7-1).


    In the picture, the user is initiating a request from a web page loaded into the
    browser for a resource that is protected by the security model on the server.
    Before the request can be fulfilled, the server''s security model has to consider
    the following three questions.


    +   * Who is asking for the resource? If the user has not logged into the server,
    the request is anonymous. It may be that the security model allows anonymous access
    to the resource, or it may be that the server has to know the identity of the
    user requesting the resource in order to answer the next question.'
  merge: -1
  pgno: 193
- img_proc: true
  md: '# Chapter 7: Securing WebSocket Server Endpoints 173


    ![](img/c9ec5416de710861f72e10a15e0abe11_194_0.png)


    FIGURE 7-1. The three security questions


    +   - May this person have it? If the server does not allow anonymous access to
    the resource, then it will hold somewhere the information necessary to determine
    if this particular user is allowed access to the resource or not. Once the server
    has made this determination, the server will need to consider the next question.


    +   - How private is its data? The server may have decided that the data resource
    yields in response to the request must be delivered back to the client in such
    a way that there is a level of guarantee that the information has not been altered
    en route. Or the server may wish to ensure, to some level of certainty, that anyone
    intercepting the data it sends from the resource to the client cannot read it.


    The processes of determining the answers to these questions are more commonly
    known as


    +   - Authentication The process of communicating the identity of a user making
    a request


    +   - Authorization The process of granting or denying access to a resource


    +   - Guaranteeing data privacy The determination of how private the communication
    channel used to transmit data between the resource and the client is'
