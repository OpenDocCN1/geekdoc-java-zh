  md: '# Chapter 1: Java WebSocket Fundamentals 15


    To some extent, whether you will always want to stick using annotated endpoints,
    programmatic endpoints, or a mixture of approaches, is a matter of personal taste.
    Some developers prefer the more traditional approach of using APIs explicitly.
    On the other hand, some developers prefer the brevity of the annotated style of
    programming and the additional flexibility it gives in being able to change configuration
    and setup information quickly by altering annotations rather than rewriting a
    configuration class. Functionally speaking, both approaches are largely equivalent,
    though there are cases where the programmatic approach gives greater control and
    more features that are not available through the annotated endpoint approach.


    While this book leans toward the annotated approach, we will be sure to mix in
    examples of the programmatic approach as well. This book recommends that you learn
    the fundamentals of both approaches with an open mind in order to explore for
    yourself which approach will work best for the application (or applications) you
    are going to write, and what your tastes will turn out to be.


    # Inside the Echo Samples


    Now that we have developed, deployed, and run our first applications, it''s worth
    taking a moment or two to absorb what we have done by examining what is actually
    happening when we deploy and run our application. The simple functionality of
    these examples reveals some of the major elements of the Java WebSocket API. It
    is worth spending some time looking at these important building blocks because
    they will recur in some variant in nearly every WebSocket application you create.


    # Deployment Phase


    When we deploy the WAR file, which contains our endpoints to the application server,
    a number of things happen in order to ready the application for its first connection.
    The first is that the WebSocket implementation will examine the WAR file to try
    to locate any endpoints in it that may be deployed. The first examination will
    locate any Java classes that are annotated with the @Endpoint and any Java classes
    that extend the Endpoint class from the Java WebSocket API. It will also locate
    in the WAR file any classes that implement the ServerApplicationConfig interface;
    these classes will tell it how to deploy the endpoints.'
