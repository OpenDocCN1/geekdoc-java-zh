  md: '# 42 Java WebSocket Programming


    own implementation of an Endpoint method. Now that you have learned

    about the WebSocket lifecycle, the following methods of the

    Endpoint class should look pretty familiar to you:


    | Event | Endpoint Method |

    |---|---|

    Open | public abstract void onOpen(Session ses, EndpointConfig config) |

    Error | public void onError(Session ses, Throwable thr)|

    Close | public void onClose(Session ses, CloseReason cr) |


    In fact, the only event a programmatic endpoint always has to handle is the open
    event, which gives it access to the session and the configuration

    information. The programmatic endpoint is not required to intercept any of

    the other lifecycle events.


    # Handling Messages


    By now you are probably wondering how to intercept message events, though

    of course you have already seen this. In the Java WebSocket API, this works

    slight differently because of the wide range of options available to the

    developer in terms of how you want to handle the messages.


    As you in the Chapter 1, in order to handle incoming messages,

    you have to provide a MessageHandler implementation. Just as for\annotated endpoints,
    there is a wide range of options for creating

    MessageHandler implementations to handle different kinds of WebSocket

    messages in different ways. We will return to examine this full set of options

    in Chapter 3, but for now we will just note that for handling basic text and

    binary messages, you only need to implement:


    ```

    MessageHandler<String> for text messages, and

    MessageHandler<ByteBuffer> for binary messages.

    ```


    Once you have implemented one or both of these interfaces to define the

    way you want to consume the messages, all you need to do is register your

    message handler or message handlers on the Session object representing

    t connection you are interested in listening to by calling


    ```

    session.addHandler(myMessageHandler)

    ```


    sometimes before you expect the first message you are interested to arrive.

    Typically, endpoints will add their message handlers in the onOpen ()

    method so they are sure not to miss any messages.'
