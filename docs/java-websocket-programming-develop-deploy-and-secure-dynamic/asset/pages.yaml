  md: '# Chapter 4: Configurations and Sessions 101


    You may have different Java objects in your application that you would like to
    send to a peer. In this case, you may need to provide multiple encoders. In such
    cases, the JavaWebSocket implementation will select the first Encoder in the list
    that can encode the object you are trying to send. For example, if you had two
    encoders for your Banana class, one that implemented Encoder.Text<Banana> and
    one that implemented Encoder.Binary<Banana>, your application would send Bananas
    in either text or binary form, depending on whether the encoder implementing Encoder.Text<Banana>
    was before the encoder implementing Encoder.Binary<Banana>, in the list you supplied
    in the WebSocket annotation or on the EndpointConfig classes you constructed.


    The decoders list is a list of Java classes that implement one of the Decoder
    interfaces. When a WebSocket message arrives for processing by the endpoint, the
    WebSocket implementation uses the first Decoder class that declares it can deal
    with the native type (text or binary) of the message and returns true from its
    willDecode() method. For example, if your application has elected to receive Banana
    objects and you have some Decoder classes that can decode WebSocket messages into
    Banana instances, if a binary message arrives, the WebSocket implementation will
    look for the first Decoder in the list that can decode binary WebSocket messages
    into Banana instances (that is to say, classes that implement either Decoder.Binary<Banana>
    or Decoder.BinaryStream<Banana>). If the Decoder is a Decoder, the implementation
    will perform the additional check to see that the Decoder''s willDecode() method
    returns true before using it if it does or looks further down the Decoder list
    if not.


    The developer map object is an editable java.util.Map with String keys and Object
    values that developers may use to store any application state that is common to
    all instances of the endpoint configuration object is configuring. As we saw in
    the Chat sample, this developer object map was a great place to store and maintain
    the list of currently signed-in users of the Chat application.


    Before we look at the various other client- and server-side configuration properties
    for WebSocket endpoints, we''ll take a small diversion into a pair of mechanisms
    built into the WebSocket network protocol that we will need to understand first.'
