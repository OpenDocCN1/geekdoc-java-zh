  md: 'The web container. We started an exploration of how to inject other Java EE
    components such as EJBs into WebSocket server endpoints in order to use preexisting
    middleware EJB components, and take advantage of the other services readily available
    to EJB components such as transactions and database connectivity.


    Finally, we took the Chat application from Chapter 4 and made it HttpSession-aware,
    allowing it to share its state with a singleton EJB and web components that presented
