  md: '# Chapter 1: Java WebSocket Fundamentals 9


    NOTE

    There are two kinds of Java WebSocket endpoints: annotated endpoints and programmatic
    endpoints. Annotated endpoints are Java classes that have been transformed into
    Java WebSocket endpoints using Java annotations from the Java WebSocket API. Programmatic
    endpoints are Java classes that subclass the Endpoint class from the Java WebSocket
    API.


    Before discussing the circumstances under which you might want to write annotated
    endpoints and the circumstances under which you might want to choose to write
    programmatic endpoints, you should know that, whichever approach you take, by
    and large you have access to most all of the features of the Java WebSocket API.


    # Programmatic Endpoints


    Since we have already taken a look at an annotated endpoint, let''s take a look
    at a programmatic endpoint. The next example will soon become very familiar because
    you have already seen it; it is the same EchoServer sample as before, but written
    with a programmatic endpoint instead of an annotated endpoint.


    In order to create the EchoServer server-side endpoint as a programmatic endpoint,
    the first thing we will do is write a Java class that subclasses the Endpoint
    class from the Java WebSocket API. In order to do so, the Endpoint class requires
    you to implement its onOpen() method. The purpose of this method is to breathe
    into life the instance of the endpoint that gets created as soon as a client connects
    to it. The parameters passed into this method are central classes in the Java
    WebSocket API. Before we get into any more details about the API, let''s take
    a look at the code.


    We will not list it here, but if you examine the JavaScript client to the programmatic
    EchoServer application, you will see that it is almost exactly the same as for
    the annotated EchoServer. The one difference is that it uses a different URI to
    connect to the programmatic EchoServer endpoint:


    ```

    ws://localhost:8080/programmaticechoserver/programmaticcho

    ```'
