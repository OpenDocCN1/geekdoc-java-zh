    the MessageModesClient endpoint needs to make to the user interface. In turn,
    the MessageModesWindow class, which holds all the GUI code for the client piece
    of the application, implements this interface, thereby allowing the MessageModesClient
    endpoint to keep the GUI up to date. Let''s look at each of these updates, are,
    of course, the individual methods on the MessageModesClientListener interface.

    The method


    ```

    public void setConnected(boolean isConnected, CloseReason cr)

    ```


    is called by the client endpoint when its connection to the server is either opened
    or closed. When the connection is closed, it supplies the reason for the closure
    in the form of an instance of the CloseReason class.

    The method


    ```

    public void reportMessage(String message);

    ```


    is called by the client endpoint when it receives a message from the server endpoint.
    This is the call that the GUI uses to fill out the messages in the text area at
    the bottom of the window. The method


    ```

    public void reportConnectionHealth(long millis);

    ```


    is called by the client endpoint when it receives a pong in response to a ping
    with the time the roundtrip code, which in turn the GUI uses to update its display.

    The MessageModesClient holds the local state of the session object to which it
    is connected. Notice that this is necessary because the MessageModesClient needs
    a reference to the session object outside the context of its lifecycle methods
    (which we already know can ever have the session passed in them). This is in contrast
    to the MessageModesServer endpoint, which only ever sends updates to the client
    in response to an incoming message. So in the server endpoint, it is not necessary
    to store the session as an instance variable. The other state that is controlled
    by the slider widget in the user interface using the setTimeout() call.


    The lifecycle methods of the MessageModesClient are relatively straightforward.
    The open handler method sets the session instance variable and notifies the GUI
    that the endpoint is connected. The close handler'
