  md: '# 2 Java WebSocket Programming


    His chapter introduces the Java WebSocket API and gives a high-level tour of its
    functions. The chapter will dive right into the sample application, an application
    whose server side simply echoes any messages sent to it by its client. We will
    use it to illustrate the major features of the Java WebSocket API. In doing so,
    this chapter will establish a foundation for the major features covered in the
    rest of the book. If you need a refresher on the main concepts of the WebSocket
    protocol, please take a look at the Introduction before reading on.


    # Creating Your First WebSocket Application


    Since the core of the WebSocket protocol is to enable messaging between two peers,
    we will start our examination of the Java WebSocket API with the simplest of examples:
    the EchoServer application.


    The EchoServer application is a client/server application. Its client is a small
    snippet of JavaScript running in your web browser, and its server is a WebSocket
    endpoint written using the Java WebSocket API and deployed as part of a web application
    running on the application server. When the user loads the page into the browser,
    or his her command, the snippet of JavaScript code is executed. The first thing
    that this code does is to connect to the Java EchoServer WebSocket endpoint residing
    in the application server, and immediately thereafter sends it message. The Java
    EchoServer endpoint running on the application server awaits incoming connections,
    and when it receives a message from one of its connected clients, it immediately
