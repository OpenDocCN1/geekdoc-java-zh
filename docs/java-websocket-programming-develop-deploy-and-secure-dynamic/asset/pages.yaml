    Some of the more sophisticated WebSocket implementations have a feature called
    message batching. This feature enables the WebSocket implementation to collect
    a number of outgoing messages on a connection until the size of the collection
    reaches some critical level. At that point, even though the application thinks
    it has sent the messages, the WebSocket implementation has not actually sent them
    on the connection. When the'
