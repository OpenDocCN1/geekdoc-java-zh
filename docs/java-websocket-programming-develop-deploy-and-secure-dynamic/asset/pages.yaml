    # DrawingBoard Application


    In this section, we will bring together many of the concepts and details we have
    surveyed in the form of a sample application. DrawingBoard sample is a multi-client/server
    Java WebSocket application. The client-side of the application is a Java Swing
    application that contains a client Java WebSocket endpoint. It presents a simple
    drawing canvas on which the user can draw a variety of different shapes of different
    sizes and colors. The server side of the DrawingBoard application is a web application
    containing a single server-side Java WebSocket endpoint. Whenever the user draws
    a shape on the drawing board, the client sends an update. When the server receives
    the update, it broadcasts to all other connected clients the nature of the update
    it just received. As the clients get updates from the server, they update their
    drawing canvases to reflect the changes made in the original drawing client. In
    this way, all connected clients are actually collaborating on a group drawing.
    Figure 3-1 shows two windows collaborating on drawing a pastoral scene.


