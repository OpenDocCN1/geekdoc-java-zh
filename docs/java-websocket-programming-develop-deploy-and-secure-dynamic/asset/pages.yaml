  md: 'Chapter 1: Java WebSocket Fundamentals 11


    # # Fundamental Java WebSocket API Objects


    The Session object in the Java WebSocket API gives the developer a view onto the
    open WebSocket connection. Each client connection to the ProgrammaticEchoServer
    endpoint is represented by a unique instance of the Session interface. It holds
    the means by which to adjust some of the properties of the connection; and probably
    most importantly, it provides the endpoint a way to gain access to the RemoteEndpoint
    object. The RemoteEndpoint represents the other end of the WebSocket conversation,
    and in particular provides the means by which the developer can send messages
    back to the client.


    The other parameter of the onOpen() method is the EndpointConfig object. The EndpointConfig
    interface represents the information that the WebSocket implementation used to
    configure the endpoint. We will not discuss this interface much at this stage,
    as our example does not use it. For readers who cannot wait, the API endpoint
    configuration is covered in detail in Chapter 4.


    Returning to the example, the first thing the implementation of the onOpen() method
    does is add aMessageHandler to the session. TheMessageHandler (and its descendants)
    defines all the ways in which a programmatic endpoint can register its interest
    in receiving incoming messages. For example, developers can use MessageHandler
    interfaces to receive text messages or binary messages, and they can elect to
    receive each in one piece or, as is especially useful for developers of applications
    that exchange very large messages, in smaller pieces as the message arrives. In
    this example, we have implemented the most straightforward of theMessageHandler<String>
    interface. This interface defines how to register an interest in receiving text
    messages in one piece. It requires the developer to implement a single method,
    which is called by the WebSocket implementation every time WebSocket message arrives
    from the client:


    ```

    public void onMessage(String text)

    ```


    In the example, when the WebSocket implementation delivers such a text message,
    we immediately obtain a reference to the RemoteEndpoint that we are going to use
    to return a message right back to the client by calling the following method on
    the Session object:


    ```

    public RemoteEndpoint.Basic getBasicRemote()

    ```


    ![](img/c9ec5416de710861f72e10a15e0abe11_32_0.png)'
  merge: -1
