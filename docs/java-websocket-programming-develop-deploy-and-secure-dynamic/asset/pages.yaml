  md: '# Java WebSocket Programming


    # # Java WebSocket API Security


    The Java WebSocket API contains a number of features that allow you to configure
    a security model for a web application containing the WebSocket endpoint you want
    to protect. It allows you to configure a variety of authentication schemes for
    access to the web application, it allows you to grant or deny access to specific
    classes of user of your web application, and it allows you to indicate which level
    of data privacy you wish to require for access to WebSocket endpoints in the web
    application.


    The Java WebSocket API contains a number of API calls that allow you to access
    aspects of the security model from a running application, and also allows you
    to build your own application-specific security features into your application,
    should the features built into the Java WebSocket API not be sufficient for the
    needs of the application.


    Of course, every security model has many more features outside the core three
    we have described, such as auditing, non-repudiation, and interoperability. Every
    implementation of the Java WebSocket API will have some level of support for these
    features, but the level of support is likely to differ from implementation to
    implementation. We will focus on the three core features because they are supported
    in a standard way by the Java WebSocket API and because they cover the security
    needs of the majority of Java WebSocket applications.


    Let''s start by taking a look at how to configure authentication in a Java WebSocket
    application.


    # # Authentication


    If you plan on allowing only authenticated users to use your WebSocket endpoint,
    then you have a choice of schemes when the Java WebSocket API is running in a
    Java EE implementation, as you are about to see in the subsections that follow.


    # # Basic Authentication


    This is the simplest of HTTP-based authentication schemes. The client sends the
    username and password pair (usually known as the credentials) encoded in an HTTP
    header. The client may either send this preemptively or in reaction to a challenge
    that the server issues if the client sends an unauthenticated request. This is
    a good scheme to use in a WebSocket'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'application if you need a kind of sign-in and to know which user is accessing
    the WebSocket. This is useful in applications where you wish to tailor the content
    to the user because you already know something about them, but you do not necessarily
    need a strong security scheme to protect the data you are sending or receiving.
    Because the credentials in the HTTP Basic scheme are sent un-encrypted, they are
    very vulnerable to being intercepted and decoded. It is for this reason that many
    web applications that do wish to protect the credentials and the application data
    choose to use HTTP Basic authentication only over an encrypted or private connection.


    Browsers typically use a basic modal username password dialog to retrieve the
    user credentials, so the user experience, while simple, is not easy to customize.


    # Form-Based Authentication


    Form-based authentication is a mechanism that defines a set of request parameters
    that signify a user''s username and password, which are encoded in a special <form>
    element in the web page. Like basic authentication, the credentials are sent unencrypted,
    so this suits the same class of applications. The main difference between form
    authentication and HTTP Basic authentication is that the look and placement of
    the login form is customizable, so it suits applications that are more conscious
    of the user experience.


    # Digest Authentication


    Digest authentication is a mechanism that gathers a username-password combination
    from the client and sends it in a protected form to the server for verification.
    Because the credentials are sent in a protected form, this is inherently a more
    secure form of authentication than either HTTP Basic or form-based authentication.
    However, because there is no way for the client to know it is sending the credential
    information to the correct server, and not one masquerading as such, it is not
    the most secure form of encryption.


    # Client Certificate Authentication


    Client-certified authentication is a process by which the server and, optionally,
    the client authenticate another one using a digital certificate, which acts as
    a kind of encrypted passport that verifies the agent''s identity.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 176 Java WebSocket Programming


    The process is inherently more secure than either HTTP Basic or form-based authentication
    whose credentials are always transferred using HTTP SSL and because the client
    is able to verify the server identity.


    Unfortunately, none of these mechanisms are reliably invoked by directly attempting
    an unauthenticated handshake from a JavaScriptWebSocket endpoint. While the WebSocket
    protocol theoretically allows to insert their own authentication interactions
    within the opening handshake, implementations of the WebSocket protocol do not
    typically do so. However, when a browser attempts the opening handshake of a JavaScript
    WebSocket from within a web page, the opening handshake it carries the authentication
    context of the enclosing web page. What this means is that, in order to access
    a WebSocket endpoint that requires authentication from client-side JavaScript
    WebSocket, you have to ensure that the web page holding the JavaScript WebSocket
    has been authenticated with a user identity that is authorized to access the endpoint.


    As motivation for picking an authentication scheme for your application, you will
    need to authenticate your users if you wish to limit access to either any of your
    WebSocket endpoints to known users, or any subset, or the WebSocket endpoints
    in the application need to access the user identity at runtime, perhaps to do
    some kind of application level security, or simply to display a username.


    Once you have decided which scheme you wish to use, configuring it is relatively
    easy: You specify it in the deployment descriptor of the WAR file in which your
    endpoints are packaged. The key element to include in the deployment descriptor
    is the <login-config> element. The table below shows its sub-elements.


    | Element Name | Value | Purpose |

    | --- | --- | --- |

    | auth-method | BASIC, FORM, DIGEST, or CLIENT-CERT | Defines the authentication
    scheme |

    | realm-name | Name of the user realm used for basic authentication | Defines
    which server realm will be used to verify the basic authentication credentials
    |'
