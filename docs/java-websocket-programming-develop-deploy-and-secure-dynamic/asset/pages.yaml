  md: '# Chapter 6: WebSocket Path Mapping 167


    This application chose to use the request parameters sent in the query string
    to represent which data fields to send in the updates, essentially to define what
    information should be sent. It used the path parameter to define how the data
    should be sent; the member level path attribute was the key for the server endpoint
    to define how the updates should be sent and how it should be portrayed.


    But the application could equally have defined a format of a WebSocket message
    that the client sent contained all these pieces of qualifying information that
    helped the server endpoint structure the conversation.


    So when do you choose to encode this kind of qualifying information in a message,
    in a collection of path parameters, or in a collection of request parameters contained
    in a query string?


    As with many questions, there isn''t really a clear answer that covers all applications.
    But here are four guidelines to think about as you decide.


    # Guideline 1: How is structured the qualifying data you want to send?


    If the qualifying data you want to send is at all structured simple key value
    pairs, then you could easily fit it into either path parameters or request parameters.
    If you have more than one level of information, you should probably consider inventing
    a message format so you can send it in a WebSocket message. However, if the qualifying
    data is a simple list of single-valued properties, then being able to have the
    Java WebSocket API parse out the values for you can be a big savings in design
    and implementation of message encoding and decoding code. Any of your qualifying
    data properties are multivalued, because each request parameter can take multiple
    values, this approach may be a better fit than path parameters, which can only
    be single valued.


    If, in the Portfolio application, you wanted to add parameters to govern how many
    decimal points you wanted the stock prices quoted in for both the current price
    and the opening price, that might be the point at which you would decide it is
    time to create a message format to hold the qualifying data because defining such
    parameters would bring in a second level of structure to the data that would need
    to be carried in the query string.


    However, this data in the Portfolio application is easily represented as value
    pairs where the values are empty. In doing so, it avoids having to define'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'a message format to carry the data completely. Instead of having to write decoding
    code, the application is able simply to use the parsing capabilities of the Java
    WebSocket API for the request and path parameters.


    # Guideline 2: How often do you need or want to send the qualifying data?


    If it is necessary in your application to update the qualifying information without
    bringing down the connection and establishing a new one each time, you will not
    be able to use the request and path parameters because they are sent only when
    the connection is first established.


    # Guideline 3: How much data is there?


    Although very long URIs are formulated, web browsers impose an upper limit on
    the length of the URI they can cope with. For example, Internet Explorer has a
    maximum length of 2,048 characters for the URIs it will handle. This should be
    a factor in whether you decide to use either path parameters or the query string
    for this kind of application “metadata”.


    # Guideline 4: What other path mappings are in your application?


    As you saw in some of the rules for path mapping in this chapter, once you have
    more than one endpoint in an application, there are some limitations in how you
    combine path mappings. If you have simple, flat qualifying information to convey
    at the time of opening a connection, the rules for path mapping may limit your
    options for using path parameters widely. However, because query strings are not
    part of the processing decisions for matching incoming URI to endpoints, the format
    of the query string you use is entirely unlimited by other endpoints in the application.


    # Summary of WebSocket Path Mapping APIs


    We’ll end this chapter by summarizing the APIs relating to path mapping in the
    Java WebSocket API.'
