  md: '# Chapter 7: Securing WebSocket Server Endpoints 183


    ```

    <security-role>

    <role-name>customer</role-name>

    </security-role>

    <security-role>

    <role-name>administrator</role-name>

    </security-role>

    ```


    Now when a new user tries to access the home.html page, the server will issue
    an HTTP Basic authentication challenge because the home.html page is only allowed
    to be accessed by users who are in the customer role, as you can see from the
    security-constraint in the preceding example. Notice that the web application
    has two roles, customer and administrator. If the challenge meets with success,
    the user will be able to access the home.html web page. If the user causes the
    home.html page to attempt to connect to the WebSocket server endpoint mapped to
    /endpoint by the JavaScript client endpoint embedded in the web page, the server
    will intercept the opening handshake issued by the browser on behalf of the client
    endpoint. The opening handshake request will carry the authentication context
    of the user (unless the user was logged out in the meantime, or the session timed
    out), which the server will use to verify access to the /endpoint URI. If the
    opening handshake carries the correct authentication context, the opening handshake
    will proceed, and the connection will be established.


    Note that unauthenticated opening handshakes issued in any way by the client to
    this protected WebSocket server endpoint will meet with failure. Specifically,
    any unauthenticated opening handshake will receive an HTTP 401 (Not Authorized)
    HTTP response in place of a successful opening handshake response.


    You can see the sequence of steps, from top to bottom, in Figure 7-3.


    # Private Communication


    In order to protect the data exchanged between WebSocket endpoints, the syntax
    of the web.xml deployment descriptor allows you to mark portions of the URI space
    as one of the following:


    +   INTEGRAL This means that no third party should be able to tamper with the
    data as it is being exchanged by changing it during transmission.


    +   CONFIDENTIAL This means that no third party should be able to tamper or even
    read the data as it is being exchanged.'
