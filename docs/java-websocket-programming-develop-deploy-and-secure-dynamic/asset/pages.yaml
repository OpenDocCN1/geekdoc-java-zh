  md: '# 8 Java WebSocket Programming


    Now that you have created, we can take a break from the code and turn to looking
    at this very simple application in terms of the fundamental Java WebSocket API
    concepts that it contains.


    # WebSocket Endpoints


    We use the term "endpoint" to mean one end of the WebSocket conversation. When
    you annotated the EchoServer class with the @ServerEndpoint annotation, it turned
    a plain old Java class into a logical WebSocket endpoint. When you deployed the
    application containing the EchoServer class, the WebSocket implementation made
    a scan of the WAR file that contains the EchoServer class and found that there
    was a WebSocket endpoint in it. Then it registered the class as a WebSocket endpoint
    so that when a client attempted to make a connection to the endpoint at the /echo
    URI, the WebSocket implementation created a new instance of the EchoServer class
    because the URI matched the one being requested and that instance of the EchoServer
    class into service for the subsequent WebSocket conversation. This is the instance
    that was called when you pressed the button in the sample web page, and it lives
    as long as the WebSocket connection is active.


    ![](img/c9ec5416de710861f72e10a15e0abe11_29_0.png)


    > NOTE

    The endpoint is the central component model of the Java WebSocket API: every WebSocket
    application you create uses the Java WebSocket API will have WebSocket endpoints
    in it.


    We have seen one of two ways in which you can use the Java WebSocket API to create
    endpoints. The EchoServer example showed how you can use the annotations in the
    Java WebSocket API to turn a plain Java class into a WebSocket endpoint. The second
    way is to subclass the abstract Endpoint class included in the Java WebSocket
    API. If you do this, your subclass becomes a WebSocket endpoint, as we will see
    in a moment.'
