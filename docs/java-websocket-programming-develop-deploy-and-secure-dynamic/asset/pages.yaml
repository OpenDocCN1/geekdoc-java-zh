  md: '# Chapter 8: WebSockets in the Java EE Platform 201


    client endpoints and Java WebSocket client server endpoints. Suppose that the
    JavaScript client endpoints connect to the Java WebSocket server endpoints; then,
    each time user downloaded the web page and caused the WebSockets to connect, you
    would have an HttpSession associated with three separate WebSocket Sessions. In
    Figure 8-2, you can see this arrangement, with two users using the web application.


    Now, the HttpSession object holds a dictionary that developers may use to hold
    application data, which is a very useful feature. Naturally, because there is
    one HttpSession instance per user of the application, this application data is
    associated with the user. The dictionary is accessed with the methods in the listing
    that follows.


