  md: 'You will see in the example that the method that has been designated with the
    @OnOpen annotation to handle the open event for this WebSocket endpoint is the
    following method:


    # Listing: Lifecycle Open Event Handling Method Signature


    ```

    @OnOpen

    public void whenOpening(Session session)

    ```


    We have opted to receive the reference to the Session object, which we keep around
    for later use. By looking at the implementation of this method, we see that we
    are doing this in response to receiving the open event is noting the current time,
    adding it to the dictionary of user properties on the Session object, and then
    sending a message to the client indicating that we want the third (green) light
    to be switched on to indicate that message traffic may now flow.


    You will also see in the example that we have indicated that the following method
    should be called whenever a message is received:


    # Listing: Lifecycle Message Event Handling Method Signature


    ```

    @OnMessage

    public void whenGettingMessage(String message)

    ```


    We have opted to receive only text messages (any binary messages coming to this
    endpoint will be ignored) and to do so in the form of a String object. This format
    is entirely appropriate, as opposed to electing to receive text messages in partial
    form or in the form of a java.io.Reader, as we discussed earlier, because we know
    that these are only short messages. In fact, in all probability we know that you
    will elect to receive your text messages in this simplest form on many occasions.
    You''ll see in the implementation of this message handling method that we are
    first checking whether the message has a particular sequence of bad characters
    in it. (These traffic signals are, after all, in a family neighborhood!) If all
    is not OK, it raises a runtime exception with an explanation. If all is OK, the
    method then checks if the client is requesting that this server-side endpoint
    close the connection, in which case it does after sending the client a message
    to turn the light red. Finally, if this is any other kind of message, the implementation
    of this method sends a message to the client indicating that the light should
    remain green.'
