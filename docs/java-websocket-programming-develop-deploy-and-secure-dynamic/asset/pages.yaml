  md: "You'll notice that you may throw a DecodeException if the raw data you are\
    \ asked to decode cannot be turned into the Java object you wish. In all such\
    \ decoding failures, the incoming message that caused the failure will not be\
    \ delivered, but the DecodeException that is generated in the decoder will be\
    \ delivered to the error handling method of the endpoint.\n\n# TIP\n\n![](img/c9ec5416de710861f72e10a15e0abe11_80_0.png)\n\
    \nAlways include an error handling method in your WebSocket endpoints. Runtime\
    \ exceptions generated in other WebSocket methods on your endpoint, such as the\
    \ open event handling method, will be passed here, in addition to any errors processing\
    \ incoming messages. If you don't have an error handling method, you may not know\
    \ that a message has arrived!\n\nOne convenience provided by the Java WebSocket\
    \ API is built-in text decoders for the Java primitive types and their class equivalents.\
    \ The approach the WebSocket implementations take is to use the standard Java\
    \ string representation of the primitive type or class equivalent. This means\
    \ that the the decode operation is equivalent to the Java primitive class equivalent\
    \ that would be constructed using the single String parameter constructor of the\
    \ class. For example, if a developer wrote a method hoping to handle incoming\
    \ text messages in the form of Java integers, like:\n\n+   Listing: Handling an\
