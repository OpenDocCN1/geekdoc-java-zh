  md: '# 184 Java WebSocket Programming


    ![](img/c9ec5416de710861f72e10a15e0abe11_205_0.png)


    FIGURE 7-3. Authorization interactions


    Most application servers interpret either option as meaning they should only allow
    access to the resource—in our case, to a WebSocket endpoint on the server—using
    a secure connection, i.e., WebSockets over SSL, or wss. There are two ways to
    specify to ensure private communication between a JavaScript WebSocket and a server
    side WebSocket written using the Java WebSocket API.


    First, the client must specify wss:// in its opening handshake and use the SSL
    port of the server hosting the WebSockets. The following is a quick example of
    the JavaScript code to create a WebSocket object that will connect using wss://


    ```

    var myWebSocket = new WebSocket("wss://localhost:8181/SecureApp/secure-endpoint");

    ```


    In this case, the server uses port 8181 for SSL connections.


    Second, the web application containing the server WebSocket endpoint needs to
    specify that it may only be accessed over a private WebSocket connection. To do
    this, you must define a security-constraint with a url-pattern that matches the
    path of the endpoint you wish to communicate privately, and add to it a user-data-constraint.
    The table that follows shows the sub-elements of user-data-constraint.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '# Chapter 7: Securing WebSocket Server Endpoints 185


    | Subelements of | Value | Purpose |

    | --- | --- | --- |

    | user-data-constraint description | text | An optional text description of the
    constraint when looking at the deployment descriptor in a tool |

    | transport-guarantee | NONE, INTEGRAL, or CONFIDENTIAL | The level of privacy
    defined by the constraint. NONE, the default, is interpreted as no private communication
    is needed; INTEGRAL and CONFIDENTIAL as access only by wss |


    For example, you can adapt the example to illustrate authorization by adding the
    following user-data-constraint to the security-constraint to mean that both the
    page and the endpoint within it can only be accessed by authenticated users in
    the customer role using wss, rather than ws.


    Listing: CONFIDENTIAL CONNECTION


    ```

    <user-data-constraint>

    <transport-guarantee>CONFIDENTIAL</transport-guarantee>

    </user-data-constraint>

    ```


    Therefore, now you would need to alter the URL used by the JavaScript WebSocket
    to use wss instead of ws to ensure both ends of the connection agree that the
    connection be private.


    If you wish to communicate from a web page to an endpoint wss, typically you will
    only be able to do so in a browser that has already established an HTTPS connection
    with your web application. What this means in real terms is if you have a web
    page containing a JavaScript WebSocket endpoint that wishes to connect wss to
    a server-side Java WebSocket endpoint, you will need to ensure there is a security-constraint
    for both user-data-constraint that is set to either INTEGRAL or CONFIDENTIAL.
    This is similar to the situation you already encountered with authentication;
    the web page holding the client must already be authenticated if you wish it to
    access a server-side Java WebSocket that requires authentication.'
