  md: "# Chapter 3: Basic Messaging 75\n\n```\n@Override\npublic boolean willDecode(String\
    \ s) {\n    return s.startsWith(DrawingObject.MESSAGE_NAME);\n}\n```\n\nAgain,\
    \ you can see that the DrawingDecoder does not need to take advantage of the lifecycle\
    \ init() and destroy() methods of the Decoder interface, and you can see immediately\
    \ that the DrawingDecoder implements the Decoder.Text<DrawingObject> interface,\
    \ the contract it must uphold is to convert WebSocket messages into DrawingObject\
    \ instances—exactly the opposite process of the DrawingEncoder. The implementation\
    \ of the willDecode() method makes a preliminary look of the text message to sanity-check\
    \ that it is likely to be something it can decode. If the willDecode() method\
    \ does not return true, the WebSocket implementation will not attempt to call\
    \ the decode() method and the message will not be able to be delivered as a DrawingObject.\
    \ However, if the willDecode() method implementation will go on to call the decode()\
    \ method, passing in the text message. You can see the implementation of decode()\
    \ that we have DrawingDecoder breaks up the text message into the constituent\
