  md: 'associated with all of the connected peers. Imagine a pizza delivery application
    where customers can enter their orders and their addresses. At periodic intervals,
    the pizza delivery team can ask the application to generate a listing of orders
    and a delivery map for the orders. Each order and address is application state
    associated with a single client, whereas the order list and delivery map is application
    state associated with many clients. Imagine the group drawing application is application
