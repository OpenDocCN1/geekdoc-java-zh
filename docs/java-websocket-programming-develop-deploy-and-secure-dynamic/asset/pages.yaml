  md: '# Chapter 1: Java WebSocket Fundamentals 17


    the client that wished to connect is armed with the full URI address, including
    the hostname and relative path from the hostname to where the endpoint is published,
    and it issues a specially formed HTTP request to that URI. There are other parameters
    that can be associated at this point with the client side of the opening handshake,
