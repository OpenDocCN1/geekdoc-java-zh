  md: '# Chapter 6: WebSocket Path Mapping 145


    The query string is a piece of data that qualifies the URI path. It takes the
    form of a list of request parameters, which are key value pairs: key=value separated
    either by & or ;;


    Here are some examples of WebSocket URIs:


    +   - ws://example.org/Play/tictactoe

    - wss://example.org:8000/FINANCE/secure/account-updates

    - wss://example.org:8080/websockets/Chat?mode=lazy&timeout=60


    Request parameters are sometimes known as query parameters.


    # WebSocket Path Mapping


    There are two mechanisms for mapping server endpoints to paths in the Java WebSocket
    API: exact URI mapping and URI template mapping. We’ll start with the mechanism
    that you have already seen.


    # Exact URI Mapping


    As you have seen in all the examples so far in this book, you can map a server-side
    WebSocket endpoint to a URI path. A URI path is a non-absolute URI in this context
    that takes the form of the uri-path we defined previously and always begins with
    a /. Once you have decided on the path, you declare it in your WebSocket endpoint
    for annotated endpoints, as you can see in the listing that follows where the
    URI path is /tools/chat.


    > Listing: Exact URI M Annotated Endpoint


    ```

    @ServerEndpoint("/tools/chat")

    public class MyChatServer {

    }

    ```


    Or, in the case of programmatic endpoints, when you create the ServerApplicationConfig
    implementation, you need to provide an instance of a ServerEndpointConfig for
    your endpoint, as you saw in Chapter 1. You supply the URI path when you create
    a'
