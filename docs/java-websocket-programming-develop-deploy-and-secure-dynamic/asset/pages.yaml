  md: '# Chapter 2: Java WebSocket Lifecycle 41


    If there are bad characters in the message, it sets up an error event that may
    need to be handled. So the Lifecycle endpoint declares the following method, which
    will handle any error events:


    ```

    Listing: Lifecycle Error Handling Method Signature

    @OnError

    public void whenSomethingGoesWrong(Throwable t)

    ```


    This method simply sends the client a message containing a description of the
    error and asking it to turn the traffic signals yellow. When you run the application,
    you send a bad message the Lifecycle message handling method is called. This raises
    an exception, which in turn causes the error handling method to be called, which
    turns up the yellow light on the traffic signal. Yellow indicates that traffic
    can still flow, which is appropriate in this case since the error event did not
    cause the session to close. There are, of course, many other things you can do
    in such error handling methods, such as closing the connection by calling the
    session.close().


    Finally, the Lifecycle endpoint declares the following method, which is to be
    called when client connection closes:


    ```

    Listing: Lifecycle Event Handling Method Signature

    @OnClose

    public void whenClosing()

    ```


    You will notice whether it is the Lifecycle client or the Lifecycle server endpoint
    that terminates the connection, the LifecycleEndpoint’s whenClosing() method is
    called.


    # Programmatic Endpoint Lifecycle


    Before continuing with the discussion of more aspects of the example you just
    looked at, let''s take a short diversion by looking at the programmatic endpoint
    version of the WebSocket endpoint lifecycle.


    # Lifecycle Events


    You will remember from Chapter 1 that programmatic endpoints all must subclass
    the javax.websocket.Endpoint class. You can intercept the open, close, and error
    events on a programmatic endpoint by providing your'
