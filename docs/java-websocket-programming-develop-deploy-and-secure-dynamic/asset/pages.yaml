    of web components, perhaps some EJB components, with a database either directly
    from the web components, or through the EJB components. Users access these Java
    EE applications through a browser client, or a rich client application of some
    kind, including a Java or JavaFX rich client application. Browser interactions
    occur over HTTP and WebSocket connections engaging web components that in turn
    engage EJB components or the data layer, encrypted or open. Rich client application
    interactions occur over these same web protocols, too, engaging the web components
    in the application. Alternatively, the Java EE platform includes a managed container
    for client applications called the Application Client Container, which allows
    direct communication to EJB components, in addition to the option of communication
    with the web layer through web protocols.'
