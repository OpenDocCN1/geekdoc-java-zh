    \ makes this kind of bean useful to tie in with application state specific to\
    \ a particular WebSocket connection. If, in the preceding code listing, the MyEJB\
    \ component is a singleton bean, then each time the WebSocket endpoint is instantiated,\
    \ the Java EE platform will inject the same instance of the MyEJB component into\
    \ WebSocket endpoint instance. This injecting singleton EJBs into WebSocket endpoints\
    \ is a very useful way to share application state common to all connections to\
    \ the application.\n\nWith this very simple introduction to key use cases of how\
    \ to bring EJBs into an application, let's take a look at a quick example.\n\n\
