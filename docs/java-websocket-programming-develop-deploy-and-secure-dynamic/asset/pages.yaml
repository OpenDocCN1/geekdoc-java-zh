    size, the WebSocket implementation will actually transmit them. The WebSocket
    implementation will, of course, send the messages in the order that the application
    intended them to be sent. This approach can offer some big performance rewards,
    particularly for applications that send large numbers of messages in a short amount
    of time.


    If a WebSocket implementation does support batching, WebSocket applications that
    wish to take advantage of the possible performance gains have to explicitly tell
