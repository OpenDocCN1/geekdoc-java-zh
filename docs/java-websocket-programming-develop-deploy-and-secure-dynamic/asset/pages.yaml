  md: '# Chapter 1: Java WebSocket Fundamentals 13


    The ServerApplicationConfig interface defines two methods that allow the developer
    to configure the endpoints in the application. Let''s deal with the first method,
    because it is particularly simple:


    ```

    public Set<Class<?>> getAnnotatedEndpointClasses(Set<Class<?>> scanned)

    ```


    This method is called by the WebSocket implementation while it is deploying the
    application. The scanned parameter it passes is a Set, which contains all the
    Java classes that are annotated with @ServerEndpoint annotation. In other words,
    it passes in all the annotated endpoints. The developer implements this method
    in such a way that it returns the Set of all the annotated endpoints he actually
    wants to be deployed. In general, returning the scanned set will allow the implementation
    to deploy all of the annotated endpoints in the WAR file. For example, in our
    application, there are no annotated endpoints, so the scanned set passed in will
    be empty.


    The second method of the ServerApplicationConfig interface is the one we need
    to implement in order to deploy our programmatic endpoint:


    ```

    public Set<ServerEndpointConfig> getEndpointConfigs(Set<Class<? extends Endpoint>>
    endpointClasses)

    ```


    Like for annotated endpoints, this method is called during the application deployment
    phase. The Set passed into the method is the set of all classes that extend Endpoint
    in the application. That is to say, it is the set of all programmatic endpoints
    in the application. The developer has to implement this method so that it returns
    the Set of ServerEndpointConfig objects that correspond to all the programmatic
    endpoints he or she wishes the WebSocket implementation to deploy. In our case,
    the method is going to be called with one class in the Set passed in: the class
    is of course the ProgrammaticEchoServer class. What we need to do is create a
    ServerEndpointConfig object to return from the method that the WebSocket implementation
    will use to deploy the endpoint. Let''s look at the code:


    +   Listing: A ServerApplicationConfig for the Echo Sample


    ```

    import java.util.HashSet;

    import java.util.Set;

    import javax.websocket.Endpoint;

    ```'
