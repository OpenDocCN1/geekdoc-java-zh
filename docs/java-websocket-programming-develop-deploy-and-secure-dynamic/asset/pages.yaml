    # Sending Java Objects as Messages


    Now that you have seen there are several ways to send messages in either text
    or binary form, it is worth noting that there is a large class of applications
    for which this is sufficient. Such applications tend to send rather simple messages:
    perhaps simple stock updates, a temperature measurement, or headlines, for example;
    but there are many WebSocket applications that send a more complex form of messages.
    These messages might include both data and an instruction or qualification. They
    might contain data that is highly structured. For this kind of application, it
    is extremely useful to be able to model these messages, not as text or binary
    data, but as higher-level Java objects.


    The WebSocket API allows you to send any kind of Java object using the RemoteEndpoint.Basic
    method call:


    ```

    Listing: RemoteEndpoint.Basic Sending a Java Object

    void sendObject(Object data) throws IOException, EncodeException

    ```


    You may be wondering how the WebSocket implementation turns this into a WebSocket
    message. (As you read in Chapter 2, only three basic flavors of WebSocket message
    can be sent on the wire: text, binary, or one of the heartbeat messages, ping
    or pong.) The answer is that it depends on what kind of object you pass in.


    If you pass in a Java primitive (or basic equivalent), the WebSocket implementation
    will turn the data into a standard Java representation as a String (that is, to
    toString() representation).


    If you pass in any other object, you will need to provide the WebSocket implementation
    an implementation of one of the javax.websocket.Encoder interfaces. You''ll see
    an example of this later in the chapter, but for now, let''s take a quick look
    at one of them. The most common interface in the encoder family is the javax.websocket.Encoder.Text<T>
    interface, where T is'
