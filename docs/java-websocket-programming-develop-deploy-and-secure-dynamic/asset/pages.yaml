    be annotated with @OnMessage.

    In all the examples far so, the return types of the @OnMessage methods have been
    void. However, you will remember from the Chapter 1 Echo sample that there is
    a very convenient way to respond immediately to an incoming WebSocket message,
    and that is to provide a return value on the method you annotate with @OnMessage.
    The return type dictates the kind of WebSocket message that the WebSocket implementation
    will send back to the sender of the incoming message.

    In order to respond with a text message, the return type should be String. In
    order to respond with a binary message, the return type should be byte[] Finally,
    you are allowed to respond with text messages that are the standard Java representation
    of primitives or their class equivalents by using the same conversion rules we
    have already discussed in this chapter. This means that all the following methods
    are valid message handling methods on an annotated endpoint:


