  md: '# 56 Java WebSocket Programming


    These three variants cover the main two WebSocket message types, text and binary,
    and how to catch incoming pong messages.


    # NOTE


    What happened to listening to ping messages? You may be wondering at this point
    why we have not looked at a way to listen to incoming ping messages: the answer
    is that the Java WebSocket API implementations are required to answer any incoming
    ping messages on a connection (for example, one you sent manually using the sendPing()
    method on a RemoteEndpoint) for you with a pong message containing the same data
    as soon as they possibly can. So there is never a need for you to explicitly write
    code to listen for ping messages.


    Very similar to the variants for sending messages and for processing text and
    binary messages, there are a number of variants on how you can to receive them.
    Just as for sending messages, you are able to receive messages in the form of
    a sequence of partial messages. For example, if you know that the other end of
    your WebSocket session is going to send you very large messages, it is likely
    that each message will be broken up into a sequence of smaller ones by the WebSocket
    implementation. In this case, you can elect to receive each message as it arrives,
    rather than having to wait for the whole thing. In this case, you would declare
    a method like this:


    +   Listing: Handling a Text Message Arriving in Pieces with @OnMessage


    ```

    @OnMessage

    public void handleMessagePartial(String textMessagePart, boolean isLast)

    ```


    where each new part of the message arrives, the WebSocket implementation calls
    this method with the message part in the textMessagePart parameter, and the boolean
    isLast flag set to false if there is more to come, or to true if this part is
    the last part arriving. You can use a similar form for binary messages as well,
    as you are about to see.'
