  md: '# 144 Java WebSocket Programming


    ust as many of us are reachable by various addresses—e-mail, phone numbers, instant
    messaging handles, street addresses—server WebSocket endpoints have an address
    in the URI space of the server hosting them.


    You have already seen how client WebSocket connect to server endpoints, and you
    have seen how to map a server endpoint to a simple relative URI in the namespace
    of the web server. In this chapter, you will explore all the techniques for mapping
    server endpoints into the URI space of the web container hosting them, and how
    they can be best exploited in WebSocket applications. You will learn the nine
    rules of path mapping for the Java WebSocket API!


    # Terminology of URLs


    This book assumes you are familiar with URLs (uniform resource identifiers). However,
    the terminology around URI, URLs, and URNs can be used somewhat informally depending
    the setting, so we start by defining a few terms that you will need to know in
    order to explore the capabilities of the path mapping mechanisms in the Java WebSocket
    API. The absolute URIs that refer to all of the following:


    ```

    <websocket-protocol-scheme>://<authority>:<port-number>/<uri-path>?<query-string>

    ```


    where


    +   * The websocket-protocol-scheme is either ws or wss on whether the connection
    to the endpoint will not be encrypted or will be encrypted, respectively. We return
    to the topic of security in Chapter 7.


    +   * The authority is usually the hostname of the web server hosting the WebSocket
    endpoint.


    +   * The port number is the number on which the web container hosting the WebSocket
    endpoint is listening for incoming handshake requests. For implementations of
    the Java WebSocket API, this is typically the same as the port number that the
    web server is listening to for HTTP requests of any kind, typically 8080.


    +   * The uri-path is a string composed of path segments separated by a delimiter.
    The path refers to some kind of resource—in our case, a possible WebSocket endpoint
    in the URI space of the web container.'
