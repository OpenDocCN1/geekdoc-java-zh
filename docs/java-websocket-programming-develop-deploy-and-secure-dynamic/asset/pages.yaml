  md: '# Chapter 6: WebSocket Path Mapping 147


    So, for example, if you packaged either endpoint into a WAR file with context-root
    equal to /employee and deployed it to a web server publishes web applications
    to the root of its namespace, you would be able to access the endpoint by connecting
    to


    ```

    ws://example.org/employee/tools/chat

    ```


    Rule 1 should already be very familiar to you: all the server endpoints so far
    in this book have used exact URI mappings. They have been accessed from their
    respective clients with absolute URLs that are derived by applying Rule 1 to the
    URI path of the server endpoint.


    Now, if you tried to deploy both the annotated endpoint and the programmatic snippets
    from the preceding example snippets as part of the same web application, you would
    find that the Web Socket implementation would reject the WAR file because of Rule
    2.


    Rule 2: No two endpoints with the same URI path may be deployed in the same web
    application.


    The reason for this rule is, we hope, already obvious to you: if you were allowed
    to deploy both the annotated and the programmatic endpoint, then they would both
    be published under the same absolute URI by the web server:


    ```

    ws://example.org/employee/tools/chat

    ```


    When a client tried to connect to this URI, the web server would have no indication
    as to which endpoint to deliver the opening handshake to. If you try to deploy
    an application that breaks this rule, the WebSocket implementation will fail the
    deployment.


    You could, of course, deploy both endpoints to the web server without changing
    the URI paths you mapped each WebSocket to, but you would have to put each endpoint
    into a different web application. By doing so, you would be required to provide
    two distinct context roots and the web server would no longer be confronted with
    attempting to publish two web resources to the same URI in its own namespace.


    Let''s consider Rule 3.


    Rule 3: URI paths are treated by web servers case sensitively'
