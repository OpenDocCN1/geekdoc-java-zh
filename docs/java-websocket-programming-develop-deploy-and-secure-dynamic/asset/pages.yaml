    the class of the object you want to send. The main method of the interface is
    shown here:


    > Listing: The encode Method of the Encoder.Text-<T> Interface

    public String encode(T object) throws EncodeException


    Each time you try to send an object of type T using the sendObject method of RemoteEndpoint.Basic,
    the WebSocket implementation will call the encoder you provide here with the object.
    The string you return out of implementation of the encode() method is the one
    that actually will be sent to the endpoint. If your encoder is unable to encode
    as a string object provided, you may throw an EncodeException. Returning to the
    sendObject() method of RemoteEndpoint.Basic, this is the EncodeException that
    would be thrown from this method in this situation.


    There are other Encoder interfaces you can choose as alternatives. For example,
    if you want to encode your objects as binary WebSocket messages, you can implement
    the Encoder.Binary-<T> interface. If you want to encode your objects to Java I/O
    streams, you can implement either Encoder.CharacterStream<T> or Encoder.BinaryStream<T>


    Once you have created the encoder you want to use, you have a choice on how to
    configure it your endpoint.


