  md: "# 10 Java WebSocket Programming\n\nbecause the programmatic endpoint on the\
    \ server is mapped to\nprogrammaticecho instead of /echo, as we are about to see.\n\
    Now that we have that out of the way, let's look at the programmatic endpoint.\n\
    \n+   Listing: A Programmatic Endpoint\n```java\\import java.io.IOException;\n\
    import javax.websocket.Endpoint;\nimport javax.websocket.EndpointConfig;\nimport\
    \ javax.websocket.MessageHandler;\nimport javax.websocket.Session;\npublic class\
    \ ProgrammaticEchoServer extends Endpoint {\n    @Override\n    public void onOpen(Session\
