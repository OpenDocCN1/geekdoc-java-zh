    Even though the DrawingServer endpoint sends the drawing updates as sequences
    of partial strings, the client needs the whole message in order to interpret it
    as a drawing update, so the WebSocket implementation is buffering the incoming
    message until all of it has been received. Only does it make its call to the DrawingDecoder
    in order to convert it into a DrawingObject representing the drawing update.


    We included a range of message processing choices in the DrawingBoard application
    in order to illustrate some of the options laid out at the beginning of the chapter.
    In a real world application, you would probably choose one or two of those options.
    In fact, in the interest of simplicity and short code, you might be tempted to
    refactor the DrawingServer endpoint to use the DrawingEncoder and DrawingDecoder
    before you finish reading the chapter!


    # Messaging and Threading


    Before we conclude this chapter, we turn to a very important topic for Java developers:
    threading. You can easily see in the drawing example that as you increase the
    number of clients you increase the chances that two clients will simultaneously
    update the server at the same time. This will also increase the chances that a
    client will send an update at the same time the server is in the middle of updating
    some of the other clients. What guarantees do you have as a WebSocket developer
    about how many threads will call your endpoint at the same time, and what guarantees
    do you have, particularly if a WebSocket message is being sent as a sequence of
    partial messages, that the messages will arrive in the order you send them and
    won''t get mixed up with other messages?


    # WebSocket Endpoint Threading and Messaging


    Fortunately, for developers, Java WebSocket API provides a number of simple answers
    that answer these questions:


    +   - The Java WebSocket API creates a new instance of a server endpoint each
    time a new client connects.


    +   - Each WebSocket endpoint instance is only ever called by one thread at a
    time.'
