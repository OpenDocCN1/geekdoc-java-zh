  md: "# 74 Java WebSocket Programming\n\nAs we shall see at the end of this chapter,\
    \ like endpoints themselves, WebSocket implementations will create one instance\
    \ of encoders per connection. So in our DrawingBoard application, there will be\
    \ one DrawingEncoder instance for each DrawingWindow, since each DrawingWindow\
    \ connects to one peer, the DrawingServer endpoint. In this DrawingEncoder, the\
    \ implementations of the lifecycle methods are empty since no such resources are\
    \ needed.\n\nNow let's consider the reverse operation. When the DrawingObject\
    \ is encoded, it is turned into a WebSocket text message by the DrawingEncoder\
    \ and sent to the server. When the server sends out its update of a DrawingObject,\
    \ having been added to the group canvas, it sends a WebSocket text message out\
    \ to all the connected clients, each of which uses a DrawingDecoder to convert\
    \ the text message containing the DrawingObject data into a DrawingObject instance.\n\
    \n# The DrawingDecoder Class\n\n```\nimport java.awt.Color;\nimport java.awt.Point;\n\
    import java.util.StringTokenizer;\nimport javax.websocket.Decoder;\nimport javax.websocket.EndpointConfig;\n\
    import javax.websocket.DecodeException;\n\npublic class DrawingDecoder implements\
    \ Decoder.Text<DrawingObject> {\n    @Override\n    public void init(EndpointConfig\
    \ config) {\n\n    @Override\n    public void destroy() {}\n\n    @Override\n\
    \    public DrawingObject decode(String s) throws DecodeException {\n        StringTokenizer\
    \ st = new StringTokenizer(s, \" **\");\n        String messageName = st.nextToken();\n\
    \        Shape shape = Shape.fromString(st.nextToken());\n        Point center\
    \ = new Point(new Integer(st.nextToken()),\n            new Integer(st.nextToken()));\n\
    \        int radius = new Integer(st.nextToken());\n        Color color = new\
    \ Color(new Integer(st.nextToken()));\n        return new DrawingObject(shape,\
    \ center, radius, color);\n    }\n}\n```"
