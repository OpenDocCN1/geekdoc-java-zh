  md: '# 202 Java WebSocket Programming


    This makes it a very useful shared object for any component that has access to
    it. All Java Servlet and Java Servlet-based technologies have access to the HttpSession
    object, so they are able to share application state associated with a particular
    user.


    Fortunately, Java WebSocket endpoints can also get to the HttpSession object associated
    with their WebSocket Sessions in order to share application data associated with
    a particular user with other components. You can do this by intercepting the opening
    handshake with a custom ServletEndpointConfig.Configurator and overriding the


    ```

    public void modifyHandshake(ServerEndpointConfig sec,

    HandshakeRequest request,

    HandshakeResponse response)

    ```


    and obtain a reference to the HttpSession instance associated with the opening
    handshake from the HandshakeRequest object by calling


    ```

    public Object getHttpSession()

    ```


    Later in the chapter, you see an example of sharing data between web components
    and a WebSocket endpoint using this technique.


    # HttpSession to WebSocket Session Association


    Once the application has been running for a while, the association between the
    WebSocket Session instances and the HttpSession instance may not hold. If the
    HttpSession is terminated either by an explicit invalidation call or it times
    out, you cannot assume that the implementation will close any of the WebSocket
    sessions started within that HttpSession. The situation in which the WebSocket
    implementation will in fact close WebSocket sessions associated with an HttpSession
    that terminates when the user has authenticated with the web application and the
    WebSocket endpoints are protected by a security constraint. You do not protected
    resources to remain active after the authenticated state that has granted access
    to them has ended.


    This means that if you want to make a stronger association between the HttpSession
    and WebSocket sessions that are initiated within it, you will have some work to
    do.'
