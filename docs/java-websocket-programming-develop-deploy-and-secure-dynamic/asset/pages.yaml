  md: '# Java WebSocket Security APIs


    There are various APIs that you can access at runtime to give your application
    a view into the security model you have set up in the containing web application
    deployment descriptor.


    # Security Information Available on the Session Object


    It is often useful to access the authenticated user of the connection to the WebSocket.
    This information is available from the Session object using the following method
    call:


    ```

    public Principal getUserPrincipal()

    ```


    This returns a java.security.Principal object representing the user, from which
    you can obtain the name, and by further examining the sub-type, more information
    about the user and her associated credentials. If the connection was not authenticated,
    then the method returns null. This method is useful for a number of things, for
    embedding the user''s name in WebSocket messages that your endpoint sends, building
    your own authorization checks into the application rather than relying on the
    security-constraint mechanism provided for you in the web container, which we
    examined earlier in this chapter.


    From the Session object, you can also ascertain whether the connection is private
    or not, that is to say, if the WebSocket connection is encrypted or not. This
    information is available using the following call:


    ```

    public boolean isSecure()

    ```


    # Security Information Available on the HandshakeRequest


    As you know from Chapter 4, you can intercept the opening handshake request in
    a server WebSocket endpoint. This is done by subclassing the ServerEndpointConfig.Configurator
    class and overriding it


    ```

    public void modifyHandshake(ServerEndpointConfig sec, HandshakeRequest request,
    HandshakeResponse response)

    ```


    method, and by linking the endpoint to the configurator class either using the
    @ServerEndpoint configurator attribute for annotated endpoints, or by setting
    the configurator on the ServerEndpointConfig instance you create when deploying
    a programmatic endpoint.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# Chapter 7: Securing WebSocket Server Endpoints 187


    When you do this, from your modifyHandshake() method, you have access to the HandshakeRequest
    object. This is the same method as you already saw on the Session object:


    ```

    public Principal getUserPrincipal()

    ```


    Additionally, the HandshakeRequest has the method


    ```

    public boolean isUserInRole(String rolename)

    ```


    The purpose of this method is to allow you to determine whether the authenticated
    user making the opening handshake request is a member of the role name you pass
    in. For example, if you list a security-role of customer in the web.xml deployment
    descriptor in the web application containing an endpoint, from the HandshakeRequest
    object that you obtain when a client connects to the endpoint, you can determine
    if the client user identity is part of the customer role. This can be useful if
    you wish to provide different levels of interaction from your endpoint depending
    on which role each active user belongs to, or if you wish to provide your own
    security model as part of the application rather than relying on the security
    mechanism provided for you in the web container. If the client has made an unauthenticated
    connection to the endpoint, then this method always returns false, as it does
    if you pass in a role that is not known in the web application.


    Our example application for this chapter will make use of these security APIs,
    but we leave this topic, the following is a summary of all the security-related
    APIs in the Java WebSocket API.


    | API Object | API Call | Purpose |

    | --- | --- | --- |

    | Session | getUserPrincipal() | Obtain the authenticated user of the connection.
    |

    | Session | boolean isSecure() | Establish if the current connection is encrypted.
    |

    | HandshakeRequest | boolean isUserInRole(String rolename) | Establish if the
    current authenticated user is in the role supplied. |'
