    Before we move from the topic of URI templates in the Java WebSocket API, we come
    to the next rule, which deals with what happens when a WebSocket application contains
    two URI templates that are equivalent. Two URI templates are said to be equivalent
    in the Java WebSocket API if they have path variables at the same positions in
    the uri-path, and the same values in the path segments are not variables. Note
    that two URI templates with path variables at the same positions in their uri-paths
    can be equivalent even if they use different variable names in the variable segments.
    So, for example, the following two URI templates are considered equivalent in
    the Java WebSocket API:


    ```

    /{member-level}/{access-code}

    ```


    Also considered equivalent are


    ```

    /booking/{transport-mode}/europe

    /booking/{name}/europe

    ```


    and


    ```

    /a/{b}/c/{d}

    /a/{x}/c/{y}

    ```'
