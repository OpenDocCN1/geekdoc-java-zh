  md: "# 4 Java WebSocket Programming\n\nThe @ServerEndpoint annotation is a class\
    \ level annotation that is used to tell the Java platform the class it decorates\
    \ is actually going to be a WebSocket endpoint. The only mandatory parameter of\
    \ this annotation is the relative URI (uniform resource identifier) that the developer\
    \ wants to make this endpoint available under. This is bit like giving someone\
    \ the phone number where people are able to call them. In this case, we will keep\
    \ things simple and use the URI /echo to publish this new endpoint we are creating.\n\
    \nSo to the EchoServer class we add the following annotation:\n\n```\nListing:\
    \ A POJO Evolving into a WebSocket Endpoint\nimport javax.websocket.server.ServerEndpoint;\n\
    \n@ServerEndpoint(\"/echo\")\npublic class EchoServer {\n    public String echo(String\
    \ incomingMessage) {\n        return \"I got this (\" + incomingMessage + \")\
    \ so I am sending it back !\";\n    }\n}\n```\n\nYou'll notice that the name of\
    \ the attribute that defines the path under the endpoint will be published is\
    \ value, which means that you don't even need to put the name of the attribute\
    \ in the annotation definition.\n\nNow your code has enough information that the\
    \ WebSocket implementation will run it will know where in its URI space to publish\
    \ it. You may be wondering to what URI the relative URI is relative: it's to the\
    \ context root of the web application that will contain the EchoServer endpoint.\
    \ We are not turning this Java class into a WebSocket endpoint, however, because\
    \ we have not yet told the implementation which of the methods we want to call\
    \ when it receives a message for this endpoint. It may seem obvious in this example,\
    \ because your EchoServer class only has one method; but in a more complicated\
    \ example, Java classes that are WebSocket endpoints may have several methods,\
    \ some of which you may wish to be called when WebSocket events other than WebSocket\
    \ messages occur, and some of which may not have anything directly to do with\
    \ a WebSocket event. In any case, in order to mark your implementation method\
    \ as being ready to handle any incoming messages, you use the method @OnMessage\
    \ annotation.\n\n![](img/c9ec5416de710861f72e10a15e0abe11_25_0.png)"
