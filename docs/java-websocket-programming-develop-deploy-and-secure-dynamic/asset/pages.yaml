    # Session State and Logical Endpoint State


    We arrived at this chapter through a discussion of the Group Drawing sample. The
    users of this application collaborated on a group drawing. However, as you probably
    realized, in the group drawing didn''t actually exist anywhere except as a series
    of drawing updates over a period of time in which the users were connected. Most
    web applications of any importance generate some form of information or effect
    that is longer than the application that results in a reproducible drawing to
    show others, a reproducible drawing, a sequence of guest comments that over time
    forms a community critique of a restaurant, a number of customer addresses that
    results in a route to follow on a pizza delivery map, a series of messages that
    results in a permanent record of a conversation, and so on. This leads us to the
    following question:


    Where in a WebSocket application can we hold application state that is common
    to all the connected clients? Where in our drawing application could we hold the
    collective drawing?


    Now, the Java Enterprise Edition (Java EE) developer has many options for holding
    application state, but they are all dependent on understanding where to pull application
    state from the Java WebSocket application.


    Inherent in a multiple client, single-server model are the following two application
    states: state associated with a single connected peer and state'
