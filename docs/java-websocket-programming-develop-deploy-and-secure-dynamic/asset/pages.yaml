  md: '# 200 Java WebSocket Programming


    Given WebSocket endpoint''s place in the web container, it is natural to want
    to share application state with other web components in the same web application,
    whether it application state associated with one client, or application state
    shared across all clients of the application. Equally, in order to interact with
    pre-existing components in the EJB layer, it is natural to want to call EJBs from
    a WebSocket endpoint.


    These two use cases will be the focus of our examination here: once a WebSocket
    endpoint can share data with other web components and interact with EJB components,
    it is truly part of the wider Java EE application that contains it.


    # Sharing Web Application State


    The key to sharing application state in the web container is in obtaining references
    to the following objects:


    ```

    javax.servlet.ServletContext

    javax.servlet.http.HttpSession

    ```


    The HttpSession object represents a sequence of HTTP interactions from the same
    HTTP client to a web application. This means that the same user making a sequence
    of HTTP requests from a browser client, for example, will be associated with the
    same instance of the HttpSession. This is provided that the user doesn''t wait
    long between interactions, and that no one decides to terminate the session between
    requests. Web containers offer more than one mechanism to support the validity
    of an HttpSession in the web container. They use cookies when the client supports
    and allows them, and a technique called URL rewriting to track session state in
    the query string of the URLs used in the web application.


    Because WebSocket connections begin with the opening handshake, and because the
    opening handshake is an HTTP interaction, each WebSocket Session object is related
    to the HttpSession object that was initiated or already in place during the opening
    handshake it established it. This means that from every WebSocket endpoint running
    inside a web application, there is an HttpSession object that it is related to:
    the one in place for its opening handshake.


    In more practical terms, any WebSocket connection initiated from a JavaScript
    WebSocket endpoint in a web page is related to the same HttpSession object created
