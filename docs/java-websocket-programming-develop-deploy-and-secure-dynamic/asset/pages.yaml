  md: '# Path Properties


    As we saw earlier in this chapter, server endpoints may be mapped either to a
    URI or to a URI-template (level-1). As we will see in Chapter 6 when we examine
    the path-mapping mechanisms in the Java WebSocket API in detail, when an opening
    handshake is made to a specific URI, if there is a match to a URI-template, the
    match will yield a list of path parameters where the variable segments correspond
    to specific values on the incoming URI. The incoming URI may also hold a query
    string with request parameters; all these aspects of the incoming URI are available
    from the Session object, as you can see in the following table:


    | Method | Use |

    | --- | --- |

    | URI getURI() | Returns the complete URI relative to the web application context
    root used by the connecting client |

    | Map<String, String> getParameters() | Returns a map of the name-value pairs
    when the match with the request URI is to a URI-template |

    | String getQueryString() | The query string of the request URI |

    | Map<String, List<String>> getParameterMap() | The request parameters extracted
    from the query string


    Here are some examples. If a server endpoint is mapped to


    ```

    /pets/cat

    ```


    and a client connects with the URI


    ```

    /pets/cat?color=black&fur=long

    ```


    then the request URI is /pets/cat?color=black&fur=long, the query string is color=black&fur=long,
    and the request parameters are (color, black) and (fur, long). The path parameters
    are empty because the endpoint is mapped to an exact URI.


    If a server endpoint is mapped to


    ```

    /travel/{mode}/{level}

    ```


    and the incoming URI the client uses to connect


    ```

    /travel/air/gold

    ```


    then the request URI is /travel/air/gold, the query string and request parameters
    are empty, and the path parameters are (mode, air) and (level, gold).'
