  md: '# Chapter 4: Configurations and Sessions 113


    # Session Management


    There are three methods that have to do with managing sessions. The isOpen() call
    allows you to determine if a session still represents an open connection. The
    getOpenSessions() allows you to list out all the open connections to the endpoint
    that the session you are calling it is connected to, and the close() method allows
    you to close the connection.


    The close() method comes in two flavors. The first with no parameters closes the
    connection with no particular descriptive information. The second allows you to
    pass in a reason, a CloseReason instance, for the closure. Since this information
    is transmitted to the peer when the connection is closed, it is a good idea to
    include a close reason.


    > NOTE A session being open is no guarantee that the underlying connection is
    active. It simply means that the WebSocket implementation has received no information
    to say that the connection has been closed. It may be that the connection has
    closed without telling anyone! If you really want to know if a Session represents
    an active connection, you should send a PingMessage on the connection and await
    a PongMessage to confirm the connection is working. In practice, on stable networks,
    a Session being open is usually a pretty good bet that you are able to send and
    receive messages through it.


    # Closing the Connection


    When a connection is being closed, it may be happening for a number of reasons.
    The Session may be closed gracefully to the peer endpoint calling the close()
    method, in which case the local endpoint''s close() handling method is called
    prior to the underlying connection actually being shut down. The Session may also
    be closed because the underlying connection has been found to have a problem and
    is already closed for business. In both cases, the close() handling method is
    called, but you need to use caution when using the Session object at this point
    in its life.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# 114 Java WebSocket Programming


    Care must be taken, however, in the implementation of the close() handling method
    based on how the Session was closed. This means that you cannot depend on able
    to send any last messages from the close() handling method. You can, however,
    depend on being able to retrieve any stored objects in the user property map on
    the Session object, and any of the other readable properties of the session, such
    as the Session ID or the timeout interval.


    Once the close() handling method has been called on the endpoint, the session
