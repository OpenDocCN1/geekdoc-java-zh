  md: '# Chapter 3: Basic Messaging 63


    The following table lists all the variants ofMessageHandler and describes the
    types of incoming messages they will consume and how they will present them to
    the programmatic endpoint that uses them.


    | MessageHandler | Message Type | Delivery As |

    | :--- | :--- | :--- |

    | MessageHandler.<String> | Text | Java String object |

    | MessageHandler.<Reader> | Text | Java I/O stream |

    | MessageHandler.<ByteBuffer> | Binary | Java NIO ByteBuffer |

    | MessageHandler.<byte[]> | Binary | Byte array |

    | MessageHandler.<InputStream> | Partial text | Sequence of Java strings |

    | MessageHandler.<PartialString> | Partial binary | Sequence of ByteBuffers |

    | MessageHandler.<ByteBuffer> | Partial binary | Sequence of byte arrays |

    | MessageHandler.<byte[]> | Partial binary | Sequence of byte arrays |


    If something looks familiar here, it is because the options for consuming incoming
    WebSocket messages in programmatic endpoints are the same as for annotated endpoints.


    Just as for annotated endpoints, you may choose to receive incoming WebSocket
    messages in the form of a Java object of your choosing. If you do so, you must
    provide an implementation of the Decoder interface able to perform the conversion
    from native WebSocket message to your Java object. So, to the preceding table
    we add the following option:


    | MessageHandler | Message Type | Delivery As |

    | :--- | :--- | :--- |

    | MessageHandler.Whole<T> with Decoder.Text<T> or Decoder.TextStream<T> | Text
    | Object type T |

    | MessageHandler.Whole<T> with Decoder.Binary<T> or Decoder.BinaryStream<T> |
    Binary | Object type T |'
