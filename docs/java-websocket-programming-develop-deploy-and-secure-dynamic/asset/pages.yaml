    \ onOpen(Session session, EndpointConfig config) {\n    final Session mySession\
    \ = session;\n    mySession.addHandler(new MessageHandler.Whole<String>() {\n\
    \        @Override\n        public void onMessage(String text) {\n           \
    \ handleTextMessage(text);\n        }\n    });\n}\n\nprivate void handleTextMessage(String\
    \ text) {\n    // incoming messages here\n}\n```\n\nAs you may have come to expect\
    \ with the Java API, there are a number of ways you can elect to process incoming\
    \ messages in programmatic WebSocket endpoints. Whichever way you choose, you\
    \ will always require the following two steps:\n\n+   1. Implement some subtype\
    \ of MessageHandler, depending on the type of message you want to handle and how\
    \ you want to handle it. You may elect to receive whole WebSocket messages or\
    \ receive WebSocket messages as sequences of partial messages.\n\n+   2. Configure\
    \ your MessageHandler implementation on the current Session object in your programmatic\
