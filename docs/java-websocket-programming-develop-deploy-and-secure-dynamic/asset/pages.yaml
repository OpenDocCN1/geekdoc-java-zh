    # The Portfolio Application


    In order to give you some ideas as to when to use exact path mapping and when
    to use URI templates, let''s turn to the Portfolio application. The Portfolio
    application is a client WebSocket application. The client is a simple JavaScript
    client; the server is a single WebSocket endpoint using the Java WebSocket API.
    When the client page opens, the JavaScript client connects to the server endpoint,
    which in turn broadcasts a sequence of updates on a portfolio of stocks back to
    client. The goal of this application is to easily be embed data that is being
    frequently updated to some portion of a larger web page. Depending on what URI
    the client uses to connect to the server endpoint, the updates will contain more
    or less detailed information on the changing prices and volumes of the stock data
    in the portfolio, and will be delivered in more or less timely and attractive
    fashions.


    Let''s take a look at the Portfolio application in action.


    At the top of the page is a control panel that allows you to formulate which of
    the stock data fields you want to see in your updates, and allows you to choose
    which level of access you want to have. Below the control panel is the output
    area, which updates each time the server endpoint sends out an update on the portfolio
    according to the parameters requested.


