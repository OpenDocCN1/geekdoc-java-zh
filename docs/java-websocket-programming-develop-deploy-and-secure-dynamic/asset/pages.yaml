  md: "# Chapter 3: Basic Messaging 55\n\n# Receiving WebSocket Messages\n\nNow that\
    \ we have taken a look at some of the ways in which a WebSocket application can\
    \ send messages, let's turn the tables and look at the ways in which a WebSocket\
    \ endpoint can elect to receive messages.\n\n# Receiving WebSocket Messages in\
    \ Annotated Endpoints\n\nWe saw in Chapter 1 that the simplest way to receive\
    \ a text message for annotated endpoints is to write a Java method that takes\
    \ a String parameter and mark the method with the @OnMessage annotation, as shown\
    \ here:\n\n+   Listing: Handling a Text Message with @OnMessage\n\n```\n@OnMessage\n\
    public void handleTextMessages(String textMessage) {\n    return \"I got this\
    \ \" + textMessage + \" !\";\n}\n```\n\nThis is the simplest but not the only\
    \ form in which you can choose to receive text messages in this endpoint. You\
    \ can elect to receive binary WebSocket messages and pong messages by simply using\
    \ an appropriate method parameter to “catch” them. In order to receive a binary\
    \ message, the easiest way to do so is to use a byte[] array parameter:\n\n+ \
    \  Listing: Handling a Binary Message with @OnMessage\n\n```\n@OnMessage\npublic\
    \ String handleBinaryMessages(byte[] messageData) {\n    return \"I got \" + messageData.length\
    \ + \" bytes of data !\";\n}\n```\n\nIn order to receive pong messages, you simply\
    \ declare a method parameter of type javax.websocket.PongMessage. For example:\n\
    \n+   Listing: Handling a Pong Message with @OnMessage\n\n```\n@OnMessage\npublic\
    \ String handlePongMessages(PongMessage pongMessage) {\n    return \"I got a pong\
    \ message carrying \" + \n           pongMessage.getApplicationData().length +\
    \ \n           \" bytes of data !\";\n}\n```"
