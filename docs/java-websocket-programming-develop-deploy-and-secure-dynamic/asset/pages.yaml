  md: '# 198 Java WebSocket Programming


    The Java WebSocket API is a standard part of the Java EE 7 platform, and is therefore
    available to all developers using an application server that supports the Java
    EE 7 APIs. So far in this book, we have focused on applications that use the Java
    WebSocket API, except for some commonly used libraries from the Java SE platform.
    While this has allowed us to look in detail at all the important aspects of using
    the Java WebSocket API, many real-world WebSocket endpoints will be part of a
    larger enterprise application that has access to a variety of services and other
    technologies. In particular, the origins of the WebSocket protocol as a solution
    for various forms of web application polling, and given the high level of support
    for the WebSocket protocol in web browsers, it is likely to be common to see WebSockets
    as part of a larger web application.


    Therefore, this book would not be complete without some guidance on how to write
    Java EE and web applications that incorporate WebSockets. There are already many
    books devoted to explaining how to use all of the Java APIs and components in
    the Java EE platform, and this is not one of them! So chapter devotes some attention
    to the key points of how to connect WebSocket endpoints with other web components
    in the web container, and how to connect WebSocket endpoints to Enterprise Java
    Beans. With these two connections as a starting point, you should be in a good
    position to apply your knowledge of all the other Java EE technologies to expand
    the reach and power of your Java WebSocket endpoints.


    # The Role of Java WebSockets in the Java EE Platform


    The Java EE platform (see Figure 8-1) shows the role of the Java WebSocket API
    in the web container.


    The Java EE platform is home to two server-side containers: the web container
    and the EJB container. Both containers host and manage-created components. The
    web container hosts Java Servlets and a family of technologies that build on the
    Java Servlet model such as Java Pages and JavaServer Faces, in addition to WebService
    endpoints, and of course, WebSocket endpoints. The EJB container is home to a
    variety of flavors of Enterprise JavaBeans. Both server containers employ and
    make available to developers a variety of services. These include JDBC and Java
    Persistence for'
