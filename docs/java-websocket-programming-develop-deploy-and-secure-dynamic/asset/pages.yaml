  md: "In this chapter, we will examine the fundamental aspects of messaging in the\
    \ Java WebSocket API, which includes many means by which to send and consume messages.\
    \ We will look at the most straightforward and widespread way to send messages:\
    \ synchronous sending and receiving messages. In order to illustrate the concepts\
    \ and functions we will cover, we will look in detail at the DrawingBoard application.\
    \ This application uses a Java client front end, so we will introduce the client\
    \ API of the Java WebSocket API at the same time.\n\n# Messaging Overview\n\n\
    You will remember from Chapter 2 that the WebSocket protocol defines three native\
    \ message types: text, binary, ping and pong messages. Let's review all the parts\
    \ of the Java WebSocket API necessary for sending and receiving messages.\n\n\
    # Sending Messages\n\nIn order to send a WebSocket message, the API is the same,\
    \ whether you are creating an annotated WebSocket endpoint or a programmatic WebSocket\
    \ endpoint: the RemoteEndpoint interface and its subtypes, RemoteEndpoint.Basic\
    \ and RemoteEndpoint.Async, hold all the methods for sending messages. \n\nPing\
    \ and pong messages are used by developers who wish to check the health of the\
    \ underlying WebSocket connection. There might be reasons for doing this: they\
    \ may be checking whether the connection is still active, or they may be making\
    \ some rough measurement of efficiency by how long it takes for the other end\
    \ of the WebSocket connection to respond with a pong message to a ping. Now, it's\
    \ safe to say that many applications will not rely on these kinds of messages.\
    \ If you need to send either of these kind of messages, however, the RemoteEndpoint\
    \ instance you obtain from the Session object holds the following two methods:\n\
    \n+   - RemoteEndpoint Pings and Pongs\n\n```\npublic void sendPing(ByteBuffer\
    \ applicationData)\n    throws IOException, IllegalArgumentException\n```\n\n\
    ```\npublic void sendPong(ByteBuffer applicationData)\n    throws IOException,\
    \ IllegalArgumentException\n```"
