  md: '# Chapter 6: WebSocket Path Mapping 157


    pushing the submit button produces an HTTP request to the URI /form-processor?user=Jared


    relative to the page holding the HTML code, and where the input field contains
    the text Jared. Depending on the nature of the web resource located at the uri-path/form-processor,
    the query string user=Jared can be used to determine what kind of response should
    be made. For example, if the resource at form-processor is a Java Servlet, the
    Java Servlet can retrieve the query string from the HttpServletRequest using the
    getQueryString() call.


    In a similar spirit, query strings can be used in the URIs used to connect to
    WebSocket endpoints using the Java WebSocket API. This brings us immediately to
    Rule 8.


    Rule 8: A query string sent as part of the request URI of an opening handshake
    request is not used by the Java WebSocket API to determine the endpoint to which
    it may match.


    In other words, whether or not a request URI contains a query string or makes
    no difference to whether it will match a server endpoint''s published path. Additionally,
    query strings are ignored in paths used to publish. As CGI programs and other
    kinds of web components do, WebSocket endpoints can use the query string to further
    configure a connection that is making. Because the WebSocket implementation essentially
    ignores the value of the query string on an incoming request, any logic that uses
    the value of the query string is purely inside the WebSocket component. The main
    methods you can use to retrieve the value of the query string are all on the Session
    object


    ```

    public String getQueryString()

    ```


    which returns the whole query string (everything after the ? character) and


    ```

    public Map<String, List<String>> getRequestParameterMap()

    ```


    which gives you a data structure with all the request parameters parsed from the
    query string. You''ll notice that the values of the map are lists of strings;
    this is because a query string may have two parameters of the same name, but different
    values. For example, you might connect to your HotelBookingService using the URI


    ```

    ws://fun.org/customer/travel/hotels/4?showpics=thumbnails&description=short

    ```'
