  md: '# 50 Java WebSocket Programming


    This is particularly useful when using other APIs that provide methods to write
    character data to a writer, for example, the javax.swing.text.htmlHTMLEEditorKit
    API that allows you to write an HTML document to a writer.


    Now, the WebSocket protocol allows very large WebSocket messages to be split into
    smaller pieces. This enables WebSocket implementations to start transmitting messages,
    even before the whole message has been passed to the implementation by the application,
    and yield a performance advantage, particularly for applications that send very
    large messages. In order for developers to be able to take advantage of this kind
    of partial message transmission, the Java WebSocket API also has


    +   Listing: RemoteEndpoint Sending a Text Message in Pieces


    ```

    public void sendText(String partialMessage, boolean isLast) throws IOException

    ```


    method, which allows developers to send large string messages in a sequence of
    smaller pieces, each invocation with the isLast parameter set to false until the
    last piece is ready to be sent with the isLast parameter set to true to indicate
    that there are no more pieces of this message to.


    # Sending Binary Messages


    For the more garden variety application, sending messages in text form can be
    enough. However, for applications that have a particular data format—like small
    image files—or applications that require absolutely minimal message sizes, sending
    messages in binary form is an excellent choice. Fortunately the Java WebSocket
    API handles a variety of means of sending messages in binary form. As we did for
    text messages, we will only look at sending messages synchronously using the RemoteEndpoint.Basic
    interface, deferring our examination of sending messages asynchronously with the
    RemoteEndpoint.Async interface until Chapter 5.


    There are three ways to send binary messages. First, we have the two sendBinary
    methods:


    +   Listing: RemoteEndpoint Sending Binary Messages


    ```

    public void sendBinary(ByteBuffer data) throws IOException

    public void sendBinary(ByteBuffer partialByte, boolean isLast) throws IOException

    ```


