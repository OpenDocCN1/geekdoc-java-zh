  md: '# 212   Java WebSocket Programming


    As you saw in Chapter 4, you can override the instance

    creation mechanism for server endpoints by creating a custom

    ServerEndpointConfig.Configurator class and overriding

    the following call:


    ```

    public T getEndpointInstance(Class<T> c)

    ```


    If you do not override this method, the Java EE platform creates the instances

    for you with the injectability properties of managed beans.

    You can manage your own instances of client endpoints simply by

    instantiating them yourself, and using either of the following methods

    on the WebSocketContainer, depending on what style of WebSocket

    endpoint you have:


    ```

    Session connectToServer(EndpointInstance,

    ClientEndpointConfig cec,

    URI path)

    ```


    ```

    Session connectToServer(Object annotatedEndpointInstance,

    URI path)

    ```


    If you stick to the supplementary connectToServer() methods that take

    the endpoint class instead of the instance,


    ```

    Session connectToServer(Class<? extends Endpoint>+ endpointClass,

    ClientEndpointConfig cec,

    URI path)

    ```


    ```

    Session connectToServer(Class<??> annotatedEndpointClass,

    URI path)

    ```


    you will get the injectability properties of managed beans.


