  md: 'use only URI paths to publish WebSocket endpoints, each WebSocket endpoint
    path must have a different value. But in a WebSocket application that also contains
    endpoints mapped to URI templates, it is possible to have a situation where two
    endpoints paths could both match an incoming request URI. For example, suppose
    you have a WebSocket application containing endpoints ClementineEndpoint and CitrusEndpoint.
    These endpoints are mapped as follows:


    +   - ClementineEndpoint is mapped to /clementine

    - CitrusEndpoint is mapped to /{fruit}


    It is clear by the rules we already have that a client request for ws://fruits.org/fruit-app/lemon
    or ws://fruits.org/fruit-app/grapefruit will both connect to the CitrusEndpoint.
    But what about the following URI:


    ws://fruits.org/fruit-app/clementine


    The answer is that the client using this URI will connect to the ClementineEndpoint
    endpoint because the JavaWebSocket API prefers exact matches. Because the paths
    used to publish server endpoints may have multiple segments, the Java WebSocket
    API compares the incoming URI with each endpoint path, reading each path segment
    of the URI path from left to right, preferring at each segment an exact match
    over a match with a variable segment. This gives you Rule 9.


    Rule 9: When determining which of several URI path and URI templates in a WebSocket
    application match an incoming URI, the Java WebSocket API compares path segment
    by segment, starting from the left, preferring at each segment an exact match
    over a match with a path variable.


    Before we move on to looking at an application that uses some of the path mapping
    features we have been looking at, let''s look at some examples of these mapping
    precedence rules in action.'
