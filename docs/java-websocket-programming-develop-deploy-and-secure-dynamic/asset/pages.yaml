  md: 'For this to work, the WebSocket implementation must know how to convert an
    incoming message into an Orange object, and to do this you must provide an implementation
    of the Decoder interface. As with Encoder interfaces, there''s a variety of possible
    subtypes you can implement. For now, we will illustrate the general concept by
    looking at the Decoder.Text<T> interface, which governs how the WebSocket implementation
    will decode an incoming text message into a Java object of type T. In our example,
    the primary method of the Decoder.Text<Orange> interface you need to implement
    decode():


    ```

    Listing: The decode() Method Signature of the Decoder.Text<Orange> Interface

    public Orange decode(String rawMessage) throws DecodeException

    ```


    The interface will also require you to implement the willDecode() method:


    ```

    Listing: The willDecode() Method Signature of the Decoder.Text<Orange> Interface

    public boolean willDecode(String s)

    ```


    This method is always called by the WebSocket implementation prior to the calling
    of decode() in order for you to have the chance to skip decoding any text message
    that is obviously in the wrong format.


    There are a number of subtypes of the Decoder interface that allow you to differentiate
    between which kinds of WebSocket messages you wish to convert into Java objects,
    and to some extent between the modes by you convert them. The following table
    gives a summary of all the Decoder interfaces and what they are used for, where
    you want to receive messages in the form of T objects:


    | Interface | Conversion | Primary Decode Method |

    | --- | --- | --- |

    | Decoder.Text<T> | String to T | T decode(String raw) throws DecodeException
    |

    | Decoder.TextStream<T> | Reader to T | T decode(Reader raw) throws DecodeException
    |

    | Decoder.Binary | ByteBuffer to T | T decode(ByteBuffer raw) throws DecodeException
    |

    | Decoder.BinaryStream | InputStream to T | T decode(InputStream raw) throws DecodeException
    |'
