    all in one go. The second variant sends a binary message in the form of a sequence
    of one or more partial binary messages. The isLast parameter on this variant is
    used to indicate whether the partial message being sent is the last one in the
    sequence that will make up the whole message, or whether there is more to come.
    This second variant is a good choice if either the message is very large or if
    creating the message is a process that can be ongoing while you send the first
    parts of the message that are ready to go.


    > NOTE

    For binary and text messages, this form of sending a message as a sequence of
    partial messages can have some powerful performance gains for some applications.
    However, the exact form in which the message is ultimately transmitted is up to
    the WebSocket implementation. Some implementations may transmit a large message
    in a large number of small pieces, and some implementations may transmit a large
    message as a small number of larger pieces. Some implementations may let you configure
    this aspect of their implementation. Others may even tune these parameters based
    on local network conditions! So it is worth doing a little experimentation and
    testing before arriving at the variant that works efficiently for your application
    and the WebSocket implementation it is running on.


    Finally, you may obtain a reference to a java.io.OutputStream from which you can
    write binary message data. This can be useful, especially when working with Java
    APIs that write data objects directly to Java I/O APIs. It is your responsibility
