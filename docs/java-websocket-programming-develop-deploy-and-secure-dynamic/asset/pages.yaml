    # The WebSocket Session


    If the EndpointConfig represents common state and algorithms common to all peers
    connecting to a WebSocket endpoint; the Session object represents all the common
    state associated with a single WebSocket connection from a peer to the endpoint.
    Client-side endpoints will only ever have a single Session object at a time, since
    client-side WebSocket endpoints only only connect to a single server-side endpoint.
    Server-side endpoints will be associated with as many Session objects as there
    are client connections connecting to them. Either, way, it is important to understand
    the possibilities for using the Session object, starting with its lifecycle.


    # The Lifecycle of the WebSocket Session


    The Session object is created upon the successful establishment of the WebSocket
    connection. It is assigned a unique identifier that may be accessed using the
    getID() call. The WebSocket implementation passes'
