  md: '# 12 Java WebSocket Programming


    It is worth noting that there are two kinds of RemoteEndpoint: RemoteEndpoint.Basic
    and RemoteEndpoint.Async. Each subinterface of RemoteEndpoint provides a different
    way to send messages to the client it represents. The RemoteEndpoint.Async interface
    provides a number of methods for sending messages asynchronously; that is to say,
    methods initiate the sending of a message but do not wait for the message to be
    sent before returning. This way, developers can be busy doing other work in their
    applications without the current thread blocking until the message has actually
    been sent. The simpler RemoteEndpoint.Basic interface defines a number of methods
    for sending messages to the client synchronously; that is to say, each send method
    returns only when the message has been sent. In the example, this simpler approach
    is the one we have chosen to use. The call:


    ```

    public void send(String text) throws IOException

    ```


    RemoteEndpoint sends the message to the client, and you will see that it requires
    the developer to handle the checked IOException, which may be thrown if there
    is a problem with the underlying connection while sending the message.


    Now that we have looked through the code, what happens when the programmatic endpoint
    is deployed when the client connects to the endpoint, the WebSocket implementation
    calls the onOpen() method on the ProgrammaticEchoServer class that we have just
    walked through. The onOpen() method creates the implementation of MessageHandler
    that is going to bounce back any text messages it handles to the client, and adds
    that EventHandler instance to the session representing the client connection.
    After that has been done, the method completes, and next time a text message arrives
    from the client on the connection, it will be routed by the WebSocket implementation
    to this MessageHandler''s onMessage().


    Everything is exactly analogous to the annotated endpoint example. Or is it? The
    missing piece that the programmatic endpoint does not have is the path to we want
    to deploy the endpoint on the server. You will remember in the annotated endpoint
    example that the path was an attribute on the @serverEndpoint example. In this
    programmatic endpoint case, assigning the path is a little more complicated. In
    order to deploy this example, we are going to have the WebSocket implementation
    how to deploy the endpoint. In order to do that, we need to provide an implementation
    of the ServerApplicationConfig interface, which will provide this missing piece
    of information that the WebSocket implementation needs to deploy.


    ![](img/c9ec5416de710861f72e10a15e0abe11_33_0.png)'
  merge: -1
  pgno: 33
