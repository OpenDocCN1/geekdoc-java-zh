    To summarize, this application uses the declarative security model to do the following:


    +   - Restrict all access to the endpoints to being over only encrypted connections


    +   - Restrict certain forms of access to its WebSocket endpoints to only authenticated
    users


    +   - Allow open access to one of the endpoints to unauthenticated users


    Using some of the runtime Java WebSocket security APIs, we can interrogate the
    security model in order to differentiate the WebSocket activity depending on who
    is accessing the application.


    # Summary


    In this chapter, you learned how the web container''s declarative security model
    can be used to restrict access to Java WebSocket server endpoints just to certain
    users. You learned the available methods of authenticating the identity of a user
    attempting to access a Java WebSocket server endpoint, and you learned how to
    ensure that Java WebSocket server endpoints can be accessed exclusively over encrypted
    connections. You learned about the runtime access Java WebSocket developers to
    have the encrypted state of the connection and to the identity of the authenticated
    client. Finally, you looked at the Stock Account application that applied the
    security model to a brokerage account containing valuable personal data and which
    provided tiered service levels depending on the user.'
