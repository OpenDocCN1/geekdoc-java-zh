  md: "Now let's look at Rule 7, which gives an analogous rule for equivalent URI\
    \ templates as Rule 2 does for equal URI paths:\n\nRule 7: No two endpoints with\
    \ the equivalent URI templates may be deployed in the same web application.\n\n\
    The reason for this rule is not hard to guess: if the Java WebSocket API allowed\
    \ multiple endpoints mapped to equivalent URI templates in the same web application\
    \ and a client tried to connect to the web application with a URI that was a valid\
    \ expansion of the URI template, it would not be possible to work out which endpoint\
    \ the client should be connected to!\n\nAs with Rule 2, if you try to deploy an\
