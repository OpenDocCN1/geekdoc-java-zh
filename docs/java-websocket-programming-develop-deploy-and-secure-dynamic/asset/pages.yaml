  md: '# Configuring Endpoints: ClientEndpointConfig and ServerEndpointConfig


    In this section, we will examine in some detail the various configuration options
    that are available to developers of all kinds of WebSocket endpoints, whether
    they are deployed on a server, whether they are intended as part of a client application,
    or whether they are programmatic or annotated endpoints.


    # Supplying and Accessing Endpoint Configuration Information


    In the Java WebSocket API, WebSocket endpoints are configured using information
    and algorithms that are modeled in EndpointConfig classes. Server-side endpoints
    are configured with the information held in the API’s ServerEndpointConfig class,
    and client-side endpoints are configured with the information held in its ClientEndpointConfig
    class.


    If you only ever use annotated endpoints, you will see that you supply the configuration
    information using the @ClientEndpoint or the @ServerEndpoint annotations. The
    WebSocket uses the information held in these annotations to create the instances
    of ClientEndpointConfig or ServerEndpointConfig, respectively, that are used at
    deployment time to configure each endpoint instance and that are available as
    optional parameters to the lifecycle methods.


    If you only ever use programmatic endpoints, you will know that you supply the
    configuration information for your endpoints by constructing instances of the
    appropriate EndpointConfig by using either the ClientEndpointConfig.Builder class
    or the ServerEndpointConfig.Builder class. In the case of server-side endpoints,
    you supply the ServerEndpointConfig instance you want to use in the ServerApplicationConfig
    implementation provide with your programmatic server endpoint. We saw this, for
    example, in Chapter 1 when deploying the ProgrammaticEcho sample. In the case
    of client-side endpoints, you supply the ClientEndpointConfig instance you want
    to use to the relevant WebSocketContainer.connectToServer() method'
