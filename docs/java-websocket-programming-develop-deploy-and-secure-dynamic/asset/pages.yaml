    \ in the listing that follows, where we are mapping this programmatic endpoint\
    \ to the same path, /tools/chat.\n\n# Listing: Configuring an Exact URI Mapped\
    \ Programmatic Endpoint\n\n```\nServerEndpointConfig sec = ServerEndpointConfig.Builder()\n\
    \    .create(MyChatEndpoint.class, \"/tools/chat\")\n    .build();\n```\n\nWhen\
    \ you deploy each endpoint, you package the endpoint class (and additionally ServerApplicationConfig\
    \ in the case of the programmatic endpoint) into a WAR file. When you create the\
    \ WAR file, you are required to supply a URI path called the context root of the\
    \ web application. The context root of a web application defines the root of the\
    \ URI namespace for all the resources in the WAR file when it is deployed on the\
    \ web server. So if, example, the web server publishes its web applications to\
    \ a namespace under a path /web-apps/, then like so:\n\n```\n<hostname>/<web-apps>\n\
    ```\n\nthe root of the URI namespace for a WAR file can be accessed using the\n\
    \n```\n<hostname>/<web-apps>/<context-root>\n```\n\nwhere <context-root> is the\
    \ context root of the WAR file. Many web servers simply publish web applications\
    \ to the root of their URI namespace (they use an empty path for the <web-apps>\
    \ path).\n\nHere is the first rule of URI mapping for the Java WebSocket API.\n\
    \nRule 1: The URI path of a server WebSocket is treated by web servers as relative\
    \ to the web application context root of the web application in which it is deployed.\n\
    \nTherefore, the absolute WebSocket URIs used to access server endpoints mapped\
    \ to a URI path will look like this, with possibly a query string at the end,\
    \ as you shall see:\n\n```\nws or wss://<hostname>:<port>/<webserver-root>/<context-path>/<websocket-uri-path>\n\
    ```"
