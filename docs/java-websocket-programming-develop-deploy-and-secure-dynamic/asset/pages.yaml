  md: '# Java WebSocket Programming


    The second piece of information you may wish to access at runtime from within
    an endpoint is the URI that the client used to connect to it. This information
    is available in a variety of forms as you shall see later, but the workload method
    that contains all the information is


    ```

    Session.getRequestURI()

    ```


    This gives you the URI path relative to the web server root of the WebSocket implementation.
    Notice that this includes the context root of the web application that contains
    the WebSocket. So, for example, in the hotel example, suppose the HotelBookingService
    endpoint is deployed in a web application with context root /customer/services.
    Now suppose a client has connected to the endpoint with the


    ```

    ws://fun.org/customer/services/travel/hotels/3

    ```


    then the request URI that the HotelBookingService endpoint will get from the Session
    by calling getRequestURI() is


    ```

    /customer/services/travel/hotels/3

    ```


    There are two other methods on the Session object that parse further information
    from this request URI when the request URI includes a query string. So let''s
    take a look at query strings.


    # Query Strings and Request Parameters


    As you saw at the beginning of the chapter, following the URI path of a WebSocket
    endpoint is the optional query string


    ```

    <websocket-protocol-scheme>://authority:<port-number>/<uri-path>?<query-string>

    ```


    Query strings in URIs originally became popular in CGI (Common Gateway Interface)
    applications. The uri-path portion of a URI would locate the CGI program (often
    /cgi-bin) and the query string appended after the uri-path would supply a list
    of parameters to the CGI program to qualify the request. The query string is also
    commonly used when posting data using an HTML form. For example, in a web application,
    in the following HTML code


    ```

    <form name="input" action="form-processor" method="post">

    Your Username: <input type="text" name="user">

    <input type="submit" value="Submit">

    </form>

    ```'
