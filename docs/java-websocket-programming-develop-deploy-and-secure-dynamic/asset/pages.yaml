  md: '# Chapter 2: Java WebSocket Lifecycle 45


    because the WebSocket implementation is using a separate instance of the LifecycleEndpoint
    for each connected client.


    What this means is that for each WebSocket endpoint definition, whether it is
    an annotated Java class or a programmatic endpoint, the WebSocket container instantiates
    a new instance of the endpoint each time a new client connects. The consequence
    of this is that each WebSocket endpoint instance only ever "sees" the same session
    instance: it is the instance representing the unique connection from the unique
    client connected to that endpoint instance.


    You could equally write the Lifecycle sample to take the session into the whenGettingMessage()
    method. If you did so, you would find that the instance passed in would be the
    same Session object as the one that passed into the opening(Session session) method.


    There is another important guarantee that the WebSocket implementation makes for
    you: no two threads from the same session (or underlying connection) are allowed
    to call an endpoint instance at the same time. This might sound rather abstract,
    but what it means is your endpoint instance will never be called by more than
    one thread from the WebSocket implementation at a time. It means that if a client
    sends multiple messages, the WebSocket implementation must call your endpoint
    one message at a time. This is particularly important to know because it means
    you never have to worry about programming for concurrent access to your endpoint
    instance. It is a key difference between the programming model for Java WebSockets
    and the programming model for Java Servlets, in which a Java Servlet instance
    may be called simultaneously by multiple threads, each handling a request/response
    interaction from a different client. It means programming WebSockets is significantly
    easier!


    # Summary


    In this chapter, you learned about the events that govern the lifecycle of WebSocket
    endpoints. You learned about the sequencing and semantics of the open, message,
    error, and close events, as well as the methods and annotations that allow developers
    to process these events. Finally, you learned the threading policy that WebSocket
    implementations use when they call developer-created WebSocket endpoints, which
    means WebSocket developers do not usually have to deal with multiple threads calling
    an endpoint at the same time.'
