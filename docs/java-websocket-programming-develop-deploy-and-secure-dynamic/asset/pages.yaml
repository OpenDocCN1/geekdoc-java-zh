  md: 'Once the WebSocket implementation obtains this information, it uses to build
    the set of endpoints to deploy. In the EchoServer sample, our WAR file simply
    held one annotated endpoint. If there are no ServerApplicationConfig implementations
    in the WAR file, the WebSocket implementation will automatically deploy all the
    annotated endpoints. This is indeed the case for our annotated endpoint example,
    so that that endpoint becomes deployed. In the programmatic Echo sample, the WAR
    file contains one implementation of the ServerApplicationConfig interface, so
    the WebSocket implementation instantiates this class once during the deployment
    phase and queries its methods to know which endpoints to deploy. In our programmatic
    example, the ServerApplicationConfig implementation asks that the single programmatic
    endpoint we wrote be.


    There are other deployment options for developers with the Java WebSocket API,
    and it is possible to package multiple ServerApplicationConfig implementations
    into the same WAR.


    Once the implementation has determined the set of WebSocket endpoints to be deployed
    from the WAR file, most implementations will run out checks on the endpoints before
    proceeding any further and will only deploy an application that is well formed.
    Different WebSocket implementations may catch and report possible configuration
    or programming errors such as two endpoints mapped to the same path or WebSocket
    annotations used at the wrong semantic level at different points in the deployment
    phase and in different ways they are architected and designed. Some may report
    failures in a log file. If if all is well and the application is valid, the WebSocket
    implementation will associate the endpoints with the URLs they declare, and then
    the application will be ready to accept incoming connections.


    # Accepting the First Connection


    You will remember from the Introduction that when initiating a WebSocket connection
    the first thing that has to occur is an initial HTTP request/response interaction.
    This interaction is called the WebSocket opening handshake. Many WebSocket developers
    will never need to understand the details of how this interaction works any more
    than the mechanics of phone exchange or cellular networks to complete a phone
    call. We will, however, cover this topic in Chapter 4. Suffice to say, at this
    point,'
