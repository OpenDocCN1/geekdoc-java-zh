    The ability to specify an authentication scheme for the web pages that contain
    the client-side JavaScript WebSocket endpoints to access protected server-side
    Java WebSocket endpoints is not of any unless you know how to protect these server-side
    endpoints in the first place. So we turn to the language of authentication in
    Java WebSocket applications.


    # Authorization


    Authorization is the process by which the WebSocket implementation decides if
    a particular user is permitted access to a particular endpoint. The Java EE platform
    uses a level of indirection in defining users called a role, or simply a role.
    A role is a kind of abstraction of a user that allows authorization rules to be
    set up in the application without the developer having to hardwire actual usernames
    in the application configuration.


    When an authenticated opening handshake request comes in to the server, the server
    must carry out three things in order to decide whether it will grant access to
    the endpoint it requests for.


    First, the server must determine which role or roles the authenticated user belongs.
    This information is not part of the standard configuration defined by the Java
    WebSocket API, and so will vary from WebSocket implementation to WebSocket implementation.
    In the Glassfish 4.0 application server, you can make the association between
    the user and the roles in a deployment descriptor specific to Glassfish called
    the glassfish.xml file that you co-package with the WAR file containing your endpoints,
    but other application servers use different schemes.'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# 180 Java WebSocket Programming


    Second, once the server knows the roles to which the opening handshake request
    belongs to, it decides by looking at the application’s web deployment descriptor
    (the web.xml file co-packaged in the WAR file). You will look at some specific
    examples of this in the material that follows, but for now, it is enough to know
    that for a given URI (the URI of the opening handshake) the web.xml’s security
    constraints contain all the information necessary to determine which roles are
    allowed access to that URI.


    Finally, of course, as you have seen, the WebSocket endpoint is mapped to a path
    in its own configuration mechanism, either using ServerEndpointConfig for programmatic
    endpoints or in the value attribute of the ServerEndpoint annotation for annotated
    endpoints.


    With these three pieces of information, the server can then decide for a given
    user and opening handshake request any of the roles to which the user belongs
    are allowed access to the URI.


    This mechanism and the locations of the configuration information necessary to
    make this determination are summarized in Figure 7-2.


    Let’s take a look at the configuration syntax in web.xml for restricting access
    on an endpoint to a set of user roles.


