    \ i = 0; i<m.size();i++)\n{}\n```\n\n在 `for` 语句内部，我们使用下面的 `if` 语句将元素的成员 ID 与用户输入的成员\
    \ ID 进行比较。\n\n```\nif (m.get(i).getMemberID() == memberID)\n{}\n```\n\n如果成员 ID\
