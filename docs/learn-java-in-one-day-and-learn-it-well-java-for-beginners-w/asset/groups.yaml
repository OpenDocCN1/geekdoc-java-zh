    \ `BufferedReader` 类提供的 `readLine()` 方法来读取文件的第一行。我们使用以下语句来实现：\n\n```\nline = reader.readLine();\
    \ // 看起来是下一行的任何内容\n```\n\n如果 `line` 不为空（即存在数据），将执行第 15 到 19 行的 `while` 语句。在 `while`\
    \ 语句内部，我们首先使用 `println()` 方法将行显示在屏幕上。然后我们使用另一个 `readLine()` 语句（第 18 行）读取下一行。此循环将一直运行，直到读取最后一行。\n\
    \n接下来，从第 21 行到 24 行是 `catch` 块。如果发生异常，该块将简单地显示错误消息。\n\n从第 25 行到 36 行是 `finally`\
    \ 块。在此块内部，我们使用一个内部 `try` 块（第 27 到 31 行）来关闭 `BufferedReader` 对象，以释放该对象可能使用的任何系统资源。一旦不再需要\
    \ `BufferedReader`，你就应该始终关闭它。如果由于原因，我们未能正确关闭对象，第 32 到 35 行的内部 `catch` 块将捕获此错误并显示相应的错误消息。\n\
    \n这就是在 Java 中读取文本文件的方法。要运行此代码，请创建一个名为 `myfile.txt` 的文本文件并将其保存在项目相同的文件夹中。如果你找不到项目文件夹，可以在\
    \ NetBeans 的项目浏览器（Project Explorer）中右键点击项目名称并选择“属性”（Properties）。这将打开显示项目存储位置的对话框。\n\
    \n你也可以将文件保存在其他地方，但记得更新程序中的路径。例如，如果你使用 Windows 并将其保存在“文档”（Documents）文件夹中，路径看起来像：\n\
    \n```\nC:\\Users\\<UserName>\\Documents\\myFile.txt\n```\n\n其中 `<UserName>` 应该替换为你自己的用户名。在编写此路径时，我们必须使用双斜杠\
    \ `\\\\`。这是因为如果我们只使用单斜杠 `/`，编译器将认为单斜杠是转义序列的开头，并将 `\\U`、`\\D` 等解释为转义序列。这将导致错误。\n\
    \n现在运行程序。你将看到文本文件的内容作为输出显示在屏幕上。不复杂对吧？\n\n事实上，在 Java 中读取文件有一种更简单的方法。包含前面的部分是因为有很多遗留代码使用了这种旧方法。然而，如果你使用的是\
    \ Java 7 或更高版本，可以使用被称为 **try-with-resources**（带资源的尝试）的语句。该语句将自动为我们关闭 `BufferedReader`\
    \ 对象，这样我们不需要显式地调用 `close()` 方法。要尝试这种方法，请将 `main()` 方法中之前的代码替换为下面的代码。\n\nString\
    \ line;\n\n```\ntry (BufferedReader reader = new BufferedReader(new FileReader(\"\
    myFile.txt\"))) {\n    String line = reader.readLine();\n    while (line != null)\
    \ {\n        System.out.println(line = reader.readLine());\n    }\n} catch (IOException\
    \ e) {\n```\n\n> 重要：必须覆盖 \"line\"，否则你将反复打印同一行并结束。\n\n```\n{\n  System.out.println(e.getMessage());\n\
    }\n```\n\n注意我们移动了语句\n\n```\nBufferedReader reader = new BufferedReader(new\nFileReader(\"\
    myfile.txt\"))\n```\n\n并将其放置在 `try` 关键字后的一对括号内？如果你这样做，就不需要显式地关闭 `BufferedReader`\
    \ 对象了。当它不再需要时，Java 会自动为我们关闭对象。这使得代码变得短得多，而且更安全，因为它消除了我们忘记关闭对象的风险。尝试运行这个新程序。它的运行方式与之前的程序相同。\n\
    \n# 10.2 写入文本文件\n\n接下来，让我们看看如何向文本文件。写入文件与从文件中读取非常相似。\n\n要写入文本文件，我们使用 `BufferedWriter`\
    \ 和 `FileWriter` 类。下面的代码展示了如何实现。将上面示例中 `main()` 方法中的代码替换为下面的代码。\n\n```\nString\
    \ text = \"Hello World\";\ntry (BufferedWriter writer = new BufferedWriter(new\n\
    FileWriter(\"myfile2.txt\", true)))\n{\n  writer.write(text);\n  writer.newLine();\n\
    }\ncatch ( IOException e )\n{\n  System.out.println(e.getMessage());\n}\n```\n\
    \n注意上面的代码与我们想要读取文件时写的代码非常相似吗？确实，主要的区别在于我们在这里创建了 `BufferedWriter` 和 `FileWriter`\
    \ 对象。\n\n此外，当我们创建 `FileWriter` 对象时，我们传递了两个参数——文件路径和值 `true`。\n\n当我们这样创建 `FileWriter`\
    \ 对象时，如果文件不存在，程序将创建 `myfile2.txt`。如果文件已存在，程序将追加数据（因为我们在第二个参数中指定了 `true`）。\n\n\
    如果你想覆盖现有数据，可以像这样创建 `FileWriter` 对象：\n\n```\nnew FileWriter(\"myfile.txt\", false);\n\
    ```\n\n或者\n\n```\nnew FileWriter(\"myfile.txt\");\n```\n\n当省略第二个参数时，程序默认将覆盖数据。接下来，创建\
    \ `FileWriter` 对象后，我们使用 `write()` 和 `newLine()` 方法写入文件。`write()` 方法将文本写入文件。`newLine()`\
    \ 方法将光标移动到新行。\n\n尝试运行这段代码。如果 `.txt` 不存在，将在项目文件夹中创建一个文件。双击创建的文件，你会看到上面写着 \"Hello\
    \ World\"。\n\n再次运行程序。你会看到文件中添加了第二个 \"Hello World\" 行。\n\n如果你不想追加新数据，将语句\n\n```\n\
    try (BufferedWriter writer = new BufferedWriter(new\nFileWriter(\"myfile2.txt\"\
    , true)))\n```\n\n改为\n\n```\ntry (BufferedWriter writer = new BufferedWriter(FileWriter(\"\
    myfile2.txt\")))\n```\n\n运行程序两次看看发生了什么。第二次运行时，只显示一行 \"Hello World\"。因为之前的 \"Hello\
    \ World\" 被覆盖了。\n\n在上面的示例中，我们使用了 try-with-resources 语句来创建 `BufferedWriter` 对象。因此，我们不需要显式地关闭它。如果你使用的是早于\
    \ Java 7 的版本，则需要在 `finally` 块中关闭 `BufferedWriter` 对象。这种方法与本章第一个示例非常相似。如果不确定如何操作，可以参考它。\n\
    \n# 10.3 重命名和删除文件\n\n现在我们已经知道了如何读取和写入文件，让我们看看重命名和删除的方法。要重命名和删除文件，我们使用 `File` 类中的两个预定义方法。\n\
    \n重命名文件需要创建两个 `File` 对象。例如，如果我们想将 `myfile.txt` 重命名为 `myNewFile.txt`，我们创建包含这两个文件名的两个\
    \ `File` 对象，如下：\n\n```\nFile f = new File(\"myfile.txt\");\nf = new File(\"myNewFile.txt\"\
    );\n```\n\n![](img/e54e623de3257a5898317957ad237a2d_169_0.png)\n\n我们可以通过编写以下代码来重命名文件：\n\
    \n```\nf.renameTo(nf);\n```\n\n如果文件重命名成功，`renameTo()` 方法返回 `true`；如果没有成功，则返回 `false`。\n\
    \n如果你想删除文件，可以使用所示的 `delete()` 方法：\n\n```\nnf.delete();\n```\n\n该方法删除文件成功返回 `true`，否则返回\
    \ `false`。\n\n我们将在稍后的项目中使用这两个方法。\n"
