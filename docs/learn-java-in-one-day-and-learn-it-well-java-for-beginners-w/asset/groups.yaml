    # 快速学习编程


    JAMIE CHAN


    # 一天学会 Java 并精通它

    带实战项目的 Java 入学者教程

    让你能够立即开始 Java 编程的唯一书籍


    作者：Jamie Chan


    http://www.learncodingfast.com/java


    版权所有 © 2018 (修订版)


    保留所有权利。未经出版者事先书面许可，不得以任何形式或通过任何手段（包括复印、录制或其他电子或机械方法）复制、传播或传输本书的任何部分，但性评论中的简短引用以及版权法允许的某些其他非商业用途除外。


    # 前言


    本书的编写目的是为了帮助你**快速**学习 Java 并**精通**它。


    本书不假设你具备任何编程背景。如果你是一个完全的初学者，你会发现这本书以易于理解的方式解释了复杂的概念。如果你是一个有经验的程序员但刚接触 Java 新手，这本书将为你提供足够的深度，让你能够立即开始
    Java 编程。


    书中主题经过精心挑选，旨在让你广泛接触 Java，同时又不会让你淹没信息过载。这些主题包括面向对象的编程概念、错误处理技术、文件处理技术等。此外，还涵盖了
    Java 的新功能，如 Lambda 表达式。书中所有的示例都经过仔细选择，以演示每个概念，以便你对该语言有更深入的理解。


    此外，正如理查德·布森所说：“学习任何东西最好的方法就是实践”。本书包含一个项目，你将在指导下从零编写一个会员管理软件。该项目使用了书中涵盖的概念，并为你提供了一个观察所有元素如何有机结合在一起的机会。


    你可以在 http://www.learncodingfast.com/java 下载该项目的源代码以及书中所有的示例程序。


    # 联系信息


    我非常乐听到你的反馈。如需反馈或查询，可以通过 jamie@learncodingfast.com 与我联系。


