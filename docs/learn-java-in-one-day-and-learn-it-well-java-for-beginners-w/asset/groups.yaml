    # Chapter 8: Object-Oriented Programming Part 2


    Now, let us move on to some of the more advanced topics in object-oriented programming.
    In this chapter, we''ll learn about inheritance, polymorphism, abstract classes
    and interfaces.


    # 8.1 Inheritance


    Inheritance is one of the key concepts in object-oriented programming. Simply
    stated, inheritance allows us to create a new class from an existing class so
    that we can effectively reuse existing code. In fact, all classes in Java are
    inherited from a pre-written base class known as the Object class.


    The Object class consists of a number of pre-written methods that we can use whenever
    we work with classes. One method is the toString() method that returns a string
    that represents the object. We used the toString() method previously when we discussed
    arrays. We''ll be looking at the toString() method again when we work on our project.


    So what exactly is inheritance?


    # 8.1.1 Writing the Parent Class


    Let us work through a small program together to illustrate the concept of inheritance.


    Suppose we are writing a program for a fitness club that has two types of membership
    – VIP and Normal. To do that, let''s launch NetBeans and create a new Java Project
    called InheritanceDemo.'
