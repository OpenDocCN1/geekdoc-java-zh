- md: "\n# Name of the file\n\n```java\npublic class HelloWorld {\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Hello World\");\n \
    \   }\n}\n```\n\n> Mouse over the red line to display this error message\n\n#\
    \ Error Message in Output Window\n\nIf all goes well, you will see the following\
    \ in the output window.\n\nrun:\nHello World\nBUILD SUCCESSFUL (total time: 0\
    \ seconds)\n\nThis program simply displays the words \"Hello World\" in the output\
    \ window. The other two sentences are additional information provided by NetBeans\
    \ and are not part of our program output.\n\nThat's it! You have successfully\
    \ coded your first program. Give yourself a pat on the shoulders.\n\nThe name\
    \ of the Java file that you just wrote is HelloWorld.java. You can find the name\
    \ at the top of the text editor window (refer to image above).\n\n## 2.4 Basic\
    \ Structure of a Java Program\n\nNow, let us do a quick run-through of the basic\
    \ program that you just coded.\n\n### 2.4.1 Package\n\nOn the first line, we have\
    \ the statement\n\n```java\npackage helloworld;\n```\n\nThis statement tells the\
    \ compiler that the Java file we wrote belongs to the `helloworld` package.\n\n\
    A package is simply a grouping of related classes and interfaces. Do not worry\
    \ if you do not know what classes and interfaces are, we'll cover them in subsequent\
    \ chapters.\n\nWhen we write `package helloworld;` at the top of our file, we\
    \ are asking the compiler to include this file in the `helloworld` package. The\
    \ compiler will then create a folder named \"helloworld\" and save the file into\
    \ that folder. Files that belong to the same package are stored in the same folder.\n\
    \nIf you navigate to your \"NetBeansProjects\" folder now, you'll find a folder\
    \ named \"HelloWorld\". The \"NetBeansProject\" folder is normally located in\
    \ your \"Documents\" folder. If you can't find this folder, try searching for\
    \ it using your computer's search function.\n\nWithin the \"HelloWorld\" folder,\
    \ you'll find a \"src\" folder that contains the \"helloworld\" folder.\n\nThis\
    \ folder stores the files of the `helloworld` package. It is a convention for\
    \ us to name our packages in lowercase. Note that Java is a case-sensitive language.\
    \ Hence, \"HelloWorld\" is not the same as \"helloworld\". Inside the \"helloworld\"\
    \ folder, you'll find the `HelloWorld.java` file.\n\nThe advantage of declaring\
    \ packages is that it prevents naming conflicts. Two or more files can have the\
    \ same name as they belong to different packages. This is similar to how you can\
    \ have two or more files of the same name on your computer as long as you put\
    \ them in different folders. We'll learn how to create different packages in Chapter\
    \ 8.\n\nIn addition to packages created by us, Java also comes with a large number\
    \ of pre-created packages that contain code we can use in our programs. For instance,\
    \ code for input and output is bundled in the java.io package while code for implementing\
    \ the components of a graphical user interface (like buttons, menus, etc) is bundled\
    \ in the java.awt package. To use these pre-written packages, we need to import\
    \ them into our programs. We'll learn how to do that at a later time.\n\n### 2.4.2\
    \ The HelloWorld Class\n\nNext, let's move on to the HelloWorld class. We'll talk\
    \ about classes in Chapter 7. For now, just know that in our example, the HelloWorld\
    \ class starts on line 3 with an opening curly brace and ends on line 10 with\
    \ a closing curly brace. Curly braces are used extensively in Java to indicate\
    \ the start and end of a code element. All opening braces in Java must be closed\
    \ with a corresponding closing brace.\n\nWithin the HelloWorld class, we have\
    \ the main() method which starts on line 5 and ends on line 8.\n\n### 2.4.3 The\
    \ main() Method\n\nThe main() method is the entry point of all Java applications.\
    \ Whenever a Java application is started, the main() method is the first method\
    \ to be called.\n\nNotice the words String[] args inside the parenthesis of our\
    \ main() method? This means the main() method can take in an array of strings\
    \ as input. Do not worry about this for the moment. We'll cover arrays and input\
    \ in subsequent chapters.\n\nIn our example, the main() method contains two lines\
    \ of code. The first line\n\n```java\n//Print the words Hello World on the screen\n\
    ```\n\nis known as a comment and is ignored by the compiler.\n\nThe second line\n\
    \n```java\nSystem.out.println(\"Hello World\");\n```\n\ndisplays the line \"Hello\
    \ World\" (without quotes) on the output window (located at the bottom of the\
    \ screen). Note that this statement ends with a semi-colon. All statements in\
    \ Java must end with a semi-colon (;). This is similar to most of the other programming\
    \ languages like C and C++.\n\nAfter the System.out.println(\"Hello World\");\
    \ statement, we end our code with two closing braces to close the earlier opening\
    \ braces. That's it! There's all there is to this simple program.\n\n## 2.5 Comments\n\
    \nWe've covered quite a bit in this chapter. You should now have a basic understanding\
    \ of Java programming and be reasonably comfortable with NetBeans. Before we end\
    \ this chapter, there's one more thing to learn - comments.\n\nWe mentioned in\
    \ the previous section that the line\n\n```java\n//Print the words Hello World\
    \ on the screen\n```\n\nis a comment and is ignored by the compiler.\n\nA comment\
    \ is actually not part of the program. It is added to our code to make it more\
    \ readable for other programmers. As such, comments are not compiled into bytecode.\n\
    \nTo add comments to our program, we type two slashes\n\n```java\n//Print the\
    \ words Hello World on the screen\n```\n\nAlternatively, we can use multiline\
    \ comments like this\n\n```java\n/*\nThis is a multiline comment.\nIt can span\
    \ multiple lines.\n*/\n```\n\n## Chapter 3: The World of Variables and Operators\n\
    \nNow that you are familiar with NetBeans and have some understanding of Java,\
    \ let's get down to the real stuff. In this chapter, you'll learn about variables\
    \ and operators. Specifically, you'll learn what variables are and how to name,\
    \ declare and initialize them. You'll also learn about common operations we can\
    \ perform on them.\n\n### 3.1 What are variables?\n\nVariables are names given\
    \ to data we need to store. For instance, suppose your program needs to store\
    \ the age of a user. To do that, we can name this `userAge` using the following\n\
    \nThis declaration first states the data type, followed by its name. The data\
    \ type of a variable refers to the type of data the variable will store (such\
    \ as whether it's a number or text). After you declare the variable, your program\
    \ will allocate a certain area of memory space to store this data. You can then\
    \ access and modify this data by referring to it by its name.\n\n### 3.2 Primitive\
    \ Data Types in Java\n\nThere are eight basic data types that are predefined in\
    \ Java. These are known as primitive data types.\n\nThe first 4 data types are\
    \ for storing integers (i.e. numbers with no parts). They are as follows:\n\n\
    # byte\n\nThe byte data type is used for storing integers from -128 to 127. It\
