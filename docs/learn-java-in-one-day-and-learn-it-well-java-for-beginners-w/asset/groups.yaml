  mdcn: "\n编译器认为这是一个函数接口，正如我们上面的示例所示。\n\n现在我们已经定义了什么是函数接口，让我们来看看如何实现这个接口。之前，我们学习了如何使用类来实现一个接口。在本章中，我们将学习如何使用\
    \ lambda 表达式来实现此类接口。\n\n`lambda` 表达式的语法如下：\n\n```\n(parameter list) -> lambda\
    \ body\n```\n\n这个语法在目前看起来可能毫无意义。让我们看一些例子来说说明它是如何使用的。\n\n假设你想如下所示实现 `getValue()`\
    \ 方法：\n\n```\ndouble getValue() {\n    return 12.3;\n}\n```\n\n该方法没有参数，简单地返回值\
    \ 12.3。我们可以将该方法重写为下面的 lambda 表达式：\n\n```\n() -> 12.3;\n```\n\nlambda 表达式的左侧是一对空括号，表示该方法没有参数。右侧仅包含数字\
    \ 12.3。这等同于语句：\n\n```\nreturn 12.3;\n```\n\n只是省略了 `return` 关键字。\n\n让我们来看另一个例子。假设你想如下所示实现\
    \ `getValue()`：\n\n```\ndouble getValue()\n{\n    return 2 + 3;\n}\n```\n\n该方法没有参数并返回\
    \ 2 和 3 之和。我们可以将该方法重写为下所示的 lambda 表达式：\n\n```\n() -> 2 + 3;\n```\n\n接下来，让我们来看更复杂的例子。\n\
    \n假设你想如下实现 `getValue()`：\n\n```\ndouble getValue()\n{\n    int counter = 1;\n\
    \    int sum = 0;\n    while (counter<5){\n        sum = sum + counter;\n    \
    \    counter++;\n    }\n    return sum;\n}\n```\n\n你可以将其重写为下面的 lambda 表达式：\n\n\
    ```\n() -> {\n    int counter = 1;\n    int sum = 0;\n    while (counter<5){\n\
    sum = sum + counter;\ncounter++;\n\nreturn sum;\n}\n```\n\n注意，这个 lambda 表达式与之前的两个有所不同。首先，lambda\
    \ 体——即 lambda 表达式的右侧——不是由单一表达式组成的（例如前两个例子中的 12.3 和 2+3）。相反，它包含一个 `while` 语句。之前的两个\
    \ lambda 体被称为**表达式体**（expression bodies），因为它们由单一表达式组成。相比之下，第三个例子中的 lambda 体被称为**块体**（block\
    \ body）。\n\n块体允许 lambda 表达式的体包含多个语句。要创建一个块体，你只需要像上面的示例那样用大括号括起语句。此外，你必须在闭大括号后添加分号。最后，由于块体包含多个表达式，因此需要使用\
    \ `return` 关键字来返回值。这与前两个省略 `return` 关键字的例子形成了对比。\n\n现在我们已经熟悉了无参数 lambda 表达式的工作原理，让我们来看涉及参数的\
    \ lambda 表达式示例。假设我们有另一个名为 `MyNumberPara` 的函数接口，如下：\n\n```\n@FunctionalInterface\n\
    interface MyNumberPara{\n    double getValue2(int n, int m);\n}\n```\n\n该接口有一个名为\
    \ `getValue2()` 的方法，具有两个 int 参数 `n` 和 `m`。\n\n如果你想如下实现 `getValue2()`：\n\n```\n\
    double getValue(int n, m)\n{\n    return n + m;\n}\n```\n\n我们可以将该方法重写为下面的 lambda\
    \ 表达式：\n\n```\n(n, m) -> n + m;\n```\n\n此 lambda 表达式的左侧包含两个参数，右侧显示计算返回值的表达式。在使用\
    \ lambda 表达式时，我们不需要显式说明参数的数据类型。但是当我们调用 `getValue2()` 方法时，必须传入正确的数据类型。稍后我们将查看如何调用\
