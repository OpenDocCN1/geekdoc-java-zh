    \ 7.2.1 Fields\n\nWe'll first declare the fields for our Staff class. To do that,\
    \ add the following lines of code inside the curly braces of the class.\n\n```\n\
    private String nameOfStaff;\nprivate final int hourlyRate = 30;\nprivate int hoursWorked;\n\
    ```\n\nHere, we declare one String variable (nameOfStaff) and two int variables\
