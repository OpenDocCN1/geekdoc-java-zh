    \ myVeh = new FourWheelVehicle();\n```\n\nwill give you an error as you cannot\
    \ create an object of an abstract class.\n\nAbstract classes may have fields and\
    \ methods just any other classes. In addition, they can have a special type of\
    \ method known as abstract methods. Abstract methods are methods that have no\
    \ body and MUST be implemented in the derived class. They can only exist in abstract\
    \ classes.\n\nIn the fitness club example above, we declared a method called calculateAnnualFee()\
    \ in the parent class (Member) and set the annual fee to zero. This method does\
    \ not make any logical sense as the annual fee is zero.\n\nInstead of adding such\
