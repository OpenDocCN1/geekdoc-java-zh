    # Preface


    This book is written to help you learn Java FAST and learn it WELL.


    The book does not assume any prior background in coding. If you are an absolute
    beginner, you''ll find that this book explains complex concepts in an easy to
    understand manner. If you are an experienced coder but new to Java, this book
    will provide you with enough depth to start coding in Java immediately.


    Topics are carefully selected to give you a broad exposure to Java, while not
    overwhelming you with information overload. These topics include object-oriented
    programming concepts, error handling techniques, file handling techniques and
    more. In addition, new features of Java such as lambda expressions are also covered.
    All examples in the book are carefully chosen to demonstrate each concept so that
    you can gain a deeper understanding of the language.


    In addition, as Richard Branson puts it: "The best way of learning about anything
    is by doing". This book comes with a project where you''ll be guided through the
    coding of a membership management software from scratch. The project uses concepts
    covered in the book and gives you a chance to see how it all ties together.


    You can download the source code for the project and all the sample programs in
    this book at http://www.learncodingfast.com/java


    # Contact Information


    I would love to hear from you. For feedback or queries, you can contact me at
    jamie@learncodingfast.com.


