    \ class LambdaDemo {\n\npublic static void main(String[] args) {\n    MyNumber\
    \ num1;\n    num1 = () -> 12.3;\n    System.out.println(\"The value is \" + num1.getValue());\n\
    \n    MyNumberPara num2;\n    num2 = (n, m) -> n + m;\n    System.out.println(\"\
    The value is \" + num2.getValue(2, 3));\n\n    num2 = (n, m) -> {\n        if\
    \ (n > 10)\n            return m;\n        else\n            return m+1;\n   \
    \ };\n    System.out.println(\"The value is \" + num2.getValue(3, 9));\n    //System.out.println(\"\
    The value is \" + num2.getValue(3, 9.1));\n}\n\n@FunctionalInterface\ninterface\
    \ MyNumber{\n    double getValue();\n}\n\n@FunctionalInterface\ninterface MyNumberPara{\n\
    \    double getValue2(int n, int m);\n}\n```\n\n从第45行到48行，我们声明了函数接口 `MyNumber`。从第50行到53行，我们声明了另一个函数接口\
    \ `MyNumberPara`。从第5行到41行，我们有 `main()` 方法。在 `main()` 方法内部，我们在第7行为 `MyNumber` 声明了引用\
    \ `num1`。接下来，我们在第9行为 `num1` 分配了 lambda 表达式。在第10行，我们通过编写 `num1.getValue()` 调用了\
