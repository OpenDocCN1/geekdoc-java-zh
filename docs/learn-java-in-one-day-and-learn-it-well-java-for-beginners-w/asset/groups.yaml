    ## float


    float 数据类型使用 4 字节存储，范围大约从负 3.40282347 x 10⁻⁸ 到正 3.40282347 x 10³⁸。它的精度约为 7 位数字。这意味着，如果你使用
    float 来存储一个像 1.23456789（10 位数字）这样的数字，该数字将被四舍入到大约 7 位数字（即 1.234568）。


    ## double


    double 数据类型使用 8 字节存储，范围大约从负 1.7976931348623157 x 10⁻³⁰⁸ 到正 1.7976931348623157
    x 10³⁰⁸，精度约为 15 位数字。


    默认情况下，当你在 Java 中指定一个浮点数时，它会被视为 double 而不是 float。如果你想让 Java 将浮点数视为 float，你必须在数字末尾添加后缀
    "F"。


    除非担心内存空间，否则你应该始终使用 double 而不是 float，因为它更精确。


    除了上述六种数据类型外，Java 还有两种原始数据类型。它们是：


    ## char


    char 代表字符（character），用于存储单个 Unicode 字符，如 ''A''、%''、''@'' 和 ''p'' 等。它使用 2 字节内存。


    ## boolean


    boolean 是一种特殊的数据类型，可以包含两个值：true 和 false。它通常用于控制流语句。我们将在第6章介绍控制流语句。


    ## 3.3 变量命名


    Java 中的变量名只能包含字母、数字、下划线 (_) 或美元符号 ($)。然而，第一个字符不能是数字。因此，你可以将变量命名为 _userName、$username、username
    或 userName2，但不能命名为 2userName。


    然而，惯成用法是始终让变量名以字母开头，而不是 "$" 或 "_"。此外，在命名变量时几乎从未使用美元符号（尽管在技术上使用它并没有错）。


    变量名应该短小但有意义，旨在让读者理解其使用的意图。将变量命名为 userName、userAge 和 accountNumber 比命名为 n 和 un
    更有意义。


    此外，还有一些你不能作为变量名的保留字，因为它们在 Java 中已经有了预先定义的含义。这些保留字包括 System、if、while 等词。我们将在后续章节中学习每一个。


    在 Java 中命名变量时，使用驼峰命名法（camel casing）是一种常见做法。驼峰命名法是用混合大小写编写复合单词，除了第一个单词外，每个单词的首字母大写（例如
    thisIsVariableName）。这是我们在书的其他部分将使用的约定。


    最后，变量名对大小写敏感。thisIsVariableName 与 thisisavariablename 不同。


    ## 3.4 变量初始化


    每当你声明一个新变量时，都需要给它一个初始值。这被称为初始化变量（initializing the variable）。你可以在程序之后更改变量的值。


    初始化变量有两种方法。你可以在声明时初始化它，也可以在单独的语句中初始化。


    下面的代码展示了如何在声明点初始化变量（左侧的行号供参考，不属于代码部分）。


    ```

    1 byte userAge = 20;

    2 short numberOfOfStudents = 45;

    3 int numberOfOfEmployees = 500;

    4 long numberOfOfInhabitants = 21021313012678L;

    5

    6 float hourlyRate = 60.5F;

    7 double numberOfOfHours = 5120.5;

    8

    9 char grade = ''A'';

    10 boolean promote = true;

    11

    12 byte level = 2, userExperience = 5;

    ```


    如上述，为了指定一个 long 值，你必须在数字末尾添加后缀 "L"。因此，在第 4 行我们初始化 numberOfOfInhabitants 时，我们在数字末尾添加了
    "L"。如果不这样做，编译器将抱怨该数字太大并向我们返回错误。


    此外，当我们在第 6 行初始化变量 hourlyRate 时，我们添加了后缀 "F"。这是因为默认情况下，Java 将任何浮点数视为 double。我们需要添加后缀
    "F" 来告诉编译器 hourlyRate 是 float 数据类型。


    最后，在初始化 char 数据类型时，我们需要像第 9 行所示，将字符括在单引号中。


    在第 12 行，我们看到了如何在单条语句中声明并初始化两个相同数据类型的变量的示例。两个变量之间用逗号隔开，不需要说明第二个变量的数据类型。


    上面的示例展示了你如何在声明点初始化变量。或者，你可以选择在两个单独的语句中声明并初始化变量，如下所示：


    ```

    byte year; // 先声明变量

    year = 20;   // 后初始化

    ```


    ## 3.5 赋值运算符


    编程中的 = 符号与我们在数学中学到的 = 符号含义不同。在编程中，= 符号被称为赋值运算符（assignment operator）。它意味着右侧的值赋值给左侧的变量。


    假设我们声明了 x 和 y：


    ```

    int x = 5;

    int y = 10;

    ```


    如果我们写 x = y，y 的值将被赋值给 x。所以 x 变为 10。


    ## 3.6 运算符


    除了给变量赋值，我们还可以进行数学运算。基础运算符包括 +, -, *, /, %。


    | 运算符 | 符号 | 示例 |

    | :--- | :--- | :--- |

    | 加法 | + | x + y |

    | 减法 | - | x - y |

    | 乘法 | * | x * y |

    | 除法 | / | x / y |

    | 取模 | % | x % y |


    在第一情况下，当整数除以另一个整数时，你得到整数答案。然而，如果 x 或 y 中有一个是非整数，你得到的整数。答案的小数部分（如果有）会被截断。


    ## 3.7 更多赋值运算符


    除了 = 运算符，还有几个赋值运算符。这些包括 +=、-= 和 *= 等运算符。


    假设变量 x 的初始值为 10。如果我们想让 x 增加 2，我们可以写：


    ```

    x = x + 2;

    ```


    程序将先计算右侧表达式 (x + 2)，并将结果赋值给左侧。最终 x 变为 12。


    与其写 x = x + 2，我们也可以写 x += 2 来表示相同的含义。+= 运算符是将赋值运算符与加法运算符结合的简写。同样，如果我们想做减法，可以写
    x = x - 2 或 x -= 2。这适用于上述所有运算符。


    大多数编程语言还有 ++ 和 -- 运算符。++ 运算符用于你想让变量的值增加 1。例如，假设


    ```

    int x = 2;

    ```


    如果你写


    ```

    x++;

    ```


    x 的值变为 3。使用 ++ 运算符时不需要使用 = 运算符。x++ 等同于 x = x + 1。


    ++ 运算符可以放在变量名的前面或后面。这会影响执行任务的顺序。假设我们有一个名为 counter 的整数。如果我们写


    ```

    System.out.println(counter++);

    ```


    程序先打印 counter 的原始值，然后将 counter 增加 1。也就是说，它按顺序执行以下任务：


    ```

    System.out.println(counter);

    counter = counter + 1;

    ```


