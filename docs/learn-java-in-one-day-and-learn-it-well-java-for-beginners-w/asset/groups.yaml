    # 8.2 Polymorphism


    Now that we have seen an example of how inheritance works, let us move on to discuss
    another topic that is closely related to inheritance - the concept of polymorphism.
    Polymorphism refers to a program''s ability to use the correct method for an object
    based on its run-time.


    The best way to explain polymorphism is through an example. Let''s expand on our
    fitness club example above.


    First, delete or comment out all the code in the previous main() method and add
    the following lines to it.


    ```

    Member[] clubMembers = new Member[6];


    clubMembers[0] = new NormalMember("James", 1, 2010);

    clubMembers[1] = new NormalMember("Andy", 2, 2011);

    clubMembers[2] = new NormalMember("Bill", 3, 2011);

    clubMembers[3] = new VIPMember("Carol", 4, 2012);

    clubMembers[4] = new VIPMember("Evelyn", 5, 2012);

    clubMembers[5] = new Member("Yvonne", 6, 2013);

    ```


    Here, we declare an array of Member objects and add 6 members to it. The first
    three members are objects of the NormalMember class, the next two are objects
    of the VIPMember class while the last is an object of the Member class.


    Although clubMembers is declared to be an array of Member type, we can assign
    objects of NormalMember and VIPMember to it as they are child classes of the Member
    class. We do not need to declare separate arrays for NormalMember and VIPMember
    objects.'
