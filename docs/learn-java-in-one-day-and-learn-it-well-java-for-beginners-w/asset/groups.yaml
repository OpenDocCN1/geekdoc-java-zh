    In the last two chapters, you learned how to write your own classes and instantiate
    objects.


    In this chapter, we are going to look at a framework that Java provides to enable
    us to easily store and manipulate these objects. Specifically, we''ll be looking
    at the Java Collections Framework.


    ## 9.1 The Java Collections Framework


    The Java Collections Framework is a set of pre-written classes and interfaces
    that Java provides to help us organise and manipulate of objects. Using the Collections
    Framework, we can choose to organise our objects in different formats such as
    lists, sets, queues or maps.


    We''ll be looking at how to use lists in this chapter.


    The Java Collections Framework standardizes the way in which groups of objects
    are handled. Hence, once you know how to use lists, you''ll find it easier to
    learn other collections such as sets or queues.


    ## 9.2 Autoboxing and Unboxing


    We can discuss the Java Collections Framework, we need to first discuss the concept
    of autoboxing and unboxing.


    Previously in Chapter 3, we learned about the 8 primitive types in Java. These
    8 primitive types are basic data types and not objects.


    However, Java is an object-oriented language and much of language revolves around
    the idea of treating everything as an object. Hence, oftentimes, we find it necessary
    to convert a primitive type into an object.


    ## the from primitive types to objects


    To facilitate this conversion, Java provides us with what is known as wrapper
    classes. Each primitive type in Java has a corresponding wrapper class. These
    wrapper classes contain a number of useful methods that we can use. The wrapper
    classes for


    ```

    boolean, char, byte, short, int, long, float and double

    ```


    are


    Boolean, Character, Byte, Short, Integer, Long, Float and Double respectively.


    Converting from a primitive data type into a wrapper class object is easy.


    For instance, to convert int into an Integer object, we do the


    ```

    Integer addObject = new Integer(100);

    ```


    Here, we declare and instantiate an Integer object by passing an int value of
    100 to the Integer class constructor. This constructor accepts the value and creates
    an Integer object based on that value.


    If we want to convert the Integer object back to an int, we use the intValue()
    method. The code is as follows:


    ```

    int m = addObject.intValue();

    ```


    The intValue() method returns an int type which we assign to m.


    As you can see, converting from a primitive data type to an object and vice versa
    is relatively straightforward. However in practice, it is actually simpler than
    what is shown above. Java provides us with two mechanisms known as autoboxing
    and unboxing. This allows for automatic conversion.


    To convert from int to Integer, instead of writing


    ```

    Integer intObject = new Integer(100);

    ```


    we can simply write


    ```

    Integer intObject = 100;

    ```


    Here, we simply assign the value 100 to intObject. We do not need to pass this
    int value to the Integer constructor; Java does it for us behind the scene. This
    process is known as autoboxing.


    To convert from Integer to int, instead of writing


    ```

    int m = intObject.intValue();

    ```


    ![](img/e54e623de3257a5898317957ad237a2d_146_0.png)


    ```

    int m = intObject;

    ```


    We do not need to explicitly use the intValue() method. When we assign an Integer
    object to an int variable, Java automatically converts the Integer object to int
    type. This process is known as unboxing.


    > from the Class to the Primitive = unboxing


    As we can see, wrapper classes provide us with a convenient way to convert primitive
    types into objects and vice versa. Besides this purpose, wrapper classes also
    have another major use – they provide us with methods for converting strings into
    primitive types. Suppose you want to convert a string into an int, you can use
    the parseInt() method in the Integer class as shown below:


    ```

    int n = Integer.parseInt("5");

    ```


    Note that "5" is a string as we use double quotes. The Integer.parseInt("5") method
    returns the int value 5, which we then assign to n.


    If the string cannot be converted into an int, the method will throw a NumberFormatException.
    For instance, the statement below will give us an error:


    ```

    int p = Integer.parseInt("ABC");

    ```


    In addition to converting a string to an int, we can also convert a string into
    a double using the parseDouble() method found in the Double class:


    ![](img/e54e623de3257a5898317957ad237a2d_147_0.png)


    ```

    double q = Double.parseDouble("5.1");

    ```


    Similarly, we''ll get an error if the string cannot be converted into an double.


    ## 9.3 Lists


    Now that we are familiar with wrapper classes, let us look at lists. A list is
    very similar to an array, but is more flexible. Specifically, its size can be
    changed.


    Previously, in Chapter 4, we learned that the size of an array cannot be changed
    once we initialize the array or if we state the array.


    If you need greater flexibility in your program, you can use a list. Java comes
    with a pre-written List interface that is part of the Collections Framework. This
    interface is implemented by a few classes. We''ll look at ArrayList first.


    ## 9.4 ArrayList


    The ArrayList class is a pre-written class that implements the List interface.
    Like all other collections in the Java Collections Framework, an ArrayList can
    only be used to store objects (not primitive types). Hence, if we want to declare
    a list of integers, we have to use Integer instead of int.


    Whenever you use an ArrayList, you have to import the java.util.ArrayList class
    using the statement below


    ``` evenimport java.util.ArrayList;

    ```


    The syntax for declaring and instantiating an ArrayList is as follows:


    ```

    ArrayList<Type> nameOfArrayList = new ArrayList<>();

    ```


    For instance, to declare and instantiate an ArrayList of Integer objects, we write


    ```

    ArrayList<Integer> userArrayList = new ArrayList<>();

    ```


    On the left side of the statement, we declared an ArrayList variable.


    ArrayList is a keyword to indicate that you are declaring an ArrayList


    <Integer> indicates that this ArrayList is used to store Integer objects


    userArrayList is the name of the ArrayList.


    On the right side, we instantiate a new ArrayList object using the new keyword
    and assign it to userAgeList.


    If you want the ArrayList to store String objects instead, you declare and instantiate
    it as


    ```

    ArrayList<String> userNameList = new ArrayList<>();

    ```


    In both examples above, we specifically declared an ArrayList and assigned an
    ArrayList to it. However, if you prefer, you can also choose to declare a List
    instead and assign an ArrayList to it.


    This is allowed because List is the superinterface of ArrayList.


    To declare a List and assign an ArrayList to it, we write


    ```

    List<String> userNameList2 = new ArrayList<>();

    Hero <Alien> thor = new Avenger<>();

    ```


    You need to import java.util.List if you do it this way.


    ### 9.4.1 ArrayList Methods


    The ArrayList class comes with a large number of pre-written methods that we can
    use. All methods discussed below can be used whether you declared an ArrayList
    or you declared a List and assigned an ArrayList to it.


    ```

    add()

    ```


    To add members to a list, use the add() method.


    ```

    userList.add(40);

    userList.add(53);

    userList.add(45);

    userList.add(53);

    ```

