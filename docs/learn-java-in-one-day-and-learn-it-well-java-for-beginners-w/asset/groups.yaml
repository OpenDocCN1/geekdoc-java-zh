    # Annotations


    Next, notice the @Override line above the method declaration? This is known as
    an annotation. In Java, annotations are metadata that we add to our code to provide
    extra information to the compiler.


    When we use the @Override annotation, we are informing the compiler that the method
    that follows is meant to override the calculateAnnualFee() method declared in
    the base class (i.e. the Member class).


    When overriding a method, there are some rules that we must follow. For instance,
    the method in the child class must have the same parameter list as the method
    in the parent class. If the method in the child class fails to override the method
    in the parent class correctly, the compiler will generate an error. If that happens,
    you can hover your mouse over the error for more information.


    Using the @Override annotation is optional when overriding a method. However,
    you are strongly encouraged to do so to prevent compilation errors.


    Annotations follow a fixed syntax and are case sensitive. @override, @overriding
    or @ThisMethodOverrideAnother are all invalid annotations. Java comes with a number
    of predefined annotations. You can find the full list of predefined annotations
    here https://docs.oracle.com/javase/tutorial/java/annotations/predefined.html


