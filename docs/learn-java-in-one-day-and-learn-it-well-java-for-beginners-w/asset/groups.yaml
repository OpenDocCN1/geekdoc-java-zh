    extends is a Java keyword used to indicate that one class inherited from another
    class. In our example, the NormalMember class is inherited from the Member class.


    We have to use the extends keyword whenever we want to show that one class is
    inherited from another class. The only exception is when inheriting from the Object
    class. As all classes in Java are inherited from the Object class, there is no
    need for us to state this inheritance explicitly.


    When one class is inherited from another class, it inherits all the public and
    protected fields and methods from the parent class. This means that the child
    class can use these fields and methods as if they are part of its own code; we
    do not have to declare these fields and methods again in the child class. In other
    words, even though we have not started coding our child class yet, it already
    has two fields (welcome and annualFee) and four methods (getDiscount, setDiscount,
    displayMemInfo and calculateAnnualFee) inherited from the parent class. This facilitates
    code reuse and is especially valuable if the parent class has a large number of
    public/protected fields and methods that the child class can use.


    However, the child class does not inherit the private fields and methods of the
    parent class. This means that the child class will not be able to access these
    private fields and methods directly, it''ll have to access them using other methods.
    We''ll see an example of this later.


    Now that we have declared NormalMember as a child class of Member, we need to
    write the constructor for the child class.


    Whenever we write the child class constructor, it is a must for us to call the
    parent class'' constructor first. If we do not do that, Java will automatically
    call the parameterless constructor in the parent class for us.


