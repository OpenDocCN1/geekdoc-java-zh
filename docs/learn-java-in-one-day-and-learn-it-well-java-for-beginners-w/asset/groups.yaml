    # Master Java Programming with a unique Hands-On Project


    # 4th Book in the Learning Coded Fast Series by Best-Selling Author Jamie Chan


    Have you always wanted to learn computer programming but are afraid it''ll be
    too difficult for you? Or perhaps you know other programming languages but are
    interested in learning Java programming fast?


    This book is for you.


    # What this book offers...


    - Complex concepts are broken down into simple steps to ensure that you can easily
    master the Java language even if you have never coded before.


    - Examples are given to illustrate all concepts.


    - Topics are carefully selected to give you a broad exposure to Java, while not
    overwhelming you with information overload.


    - Concepts are presented in a "to-the-point" style to cater to the busy individual.


    # How is this book different?


    The best way to learn Java is by doing.


    At the end of this book, you''ll be guided through a unique project that requires
    the application of all the concepts taught previously.


    Working through the project will not only help you see how all fits together,
    it''ll also give you an immense sense of achievement.


