    \ is $1200 and the annual fee for the last member is $0.\n\nThis is the result\
    \ of polymorphism. At run time (i.e. when the program runs), the program determines\
    \ that the first three members of clubMembers are of NormalMember type and executes\
    \ the calculateAnnualFee() method from that class. It also determines that the\
    \ next two members are of VIPMember type and executes the method from that class.\
    \ Finally, it determines that the last member is Member type and executes the\
    \ method from the parent class.\n\nWe say that the runtime type of the first three\
    \ elements of clubMembers is NormalMember, the runtime type of the next two is\
    \ VIPMember and the runtime type of the last element is Member. In contrast, the\
    \ declared type of all the 5 elements is Member.\n\nPolymorphism simply means\
    \ that at runtime, although all objects are declared to be of Member type, the\
    \ program is smart enough to use the correct calculateAnnualFee() method based\
    \ on the runtime type of the element.\n\n## 8.3 Abstract Classes and Methods\n\
    \nNext, let us move on to discuss two special types of \"parent class\" in Java\
