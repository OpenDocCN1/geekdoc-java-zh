    \ that we’ll be following in the book.\n\nThe contents of the class are enclosed\
    \ within the pair of curly braces that follows the class name. Contents of a class\
    \ include constructors, methods, interfaces, and other classes. We’ll cover some\
    \ of them in this chapter.\n\nNow, let's build a class from scratch together.\n\
    \nFirst, launch NetBeans and create a new Java Application called ObjectOrientedDemo.\n\
    \nStudy the code that is generated for you. Notice that NetBeans has automatically\
