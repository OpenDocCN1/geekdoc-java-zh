    foundIndex 将等于 5。这表示数字 78 位于索引 5 处。


    另一方面，如果你写：


    ```

    int foundIndex2 = Arrays.binarySearch(myInt, 39);

    ```


    foundIndex2 将等于 -4。


    这个结果包含两个部分：负号和数字 4。


    负号仅表示未找到 39。


    另一方面，数字 4 有点奇怪。它告诉你是，如果该数字存在于数组中，它应该所在的位置。然而，它在该索引的基础上加了 **1**。换句话说，如果数字 39 存在于数组中，它应该在索引
    4-1 = 3 的位置。


    我们在这一节中已经介绍了一些常用的数组方法。要查看 Java 中所有可用数组方法的完整列表，请访问此页面：

    https://docs.oracle.com/javase/8/docs/api/java/util/Arrays.html


    ## 4.2.2 查找数组长度


    最后，让我们来看看如何找到数组的长度。数组的长度告诉我们数组中有多少个元素。之前我们在讨论字符串时，提到过可以使用 `length()` 方法来查找字符串的长度。


    与大多数人的认为相反，数组并没有可用的 `length()` 方法。相反，要找到数组的长度，我们使用 `length` 字段。我们将在第 7 章中讨论字段与方法的区别。目前，你只需要知道，要找到数组的长度，不需要在
    `length` 单词后添加括号。


    例如，如果我们有：


    ```

    int [] userAge = {21, 22, 26, 32, 40};

    ```


    userAge.length 等于 5，因为数组中有 5 个数字。


    ## 4.3 基本类型 vs. 引用类型


    现在我们已经熟悉了字符串和数组，让我们来讨论关于 Java 数据类型的一个重要概念。


    Java 中的所有数据类型都可以归分为基本类型（primitive type）或引用类型（reference type）。Java 中只有 8 种基本类型（byte,
    short, int, long, float, double, char 和 boolean），其余的引用类型。引用类型的示例包括本章讨论的字符串和数组，以及将在第
    7 章和第 8 章中讨论的类和接口。


    基本类型和引用类型之间的主要区别之一是所存储的数据。


    基本类型存储其自己的数据。


    当我们写：


    ```

    int myNumber = 5;

    ```


    变量 `myNumber` 存储的是实际值 5。


    另一方面，引用类型并不存储实际数据。相反，它存储指向数据的引用。它不告诉编译器数据的值是多少；它告诉编译器去哪里找到实际数据。


    引用类型的一个示例是 String。当你写下类似这样的语句时：


    ```

    String message = "Hello";

    ```


    变量 `message` 实际上并没有存储字符串 "Hello"。


    相反，字符串 "Hello" 被创建并存储在计算机内存的其他地方。变量 `message` 存储该内存位置的地址。


    这就是我们目前对引用类型需要了解的所有内容。由于这是一本初学者书籍，我们不会详细介绍为什么需要引用类型。只需注意基本类型和引用类型之间存在差异：前者存储值，而后者存储地址。


    ## 4.4 字符串是不可变的


    在结束本章之前，我想涵盖关于字符串的另一个一个概念。具体来说，我想指出在 Java（以及大多数其他语言）中，字符串是不可变的（immutable）。


    不可变意味着字符串的值不能被改变。每当我们更新一个 String 变量时，我们实际上是在创建一个新字符串，并将内存地址分配给该 String 变量。让我们考虑一个例子。假设我们有


    ```

    String message = "Hello";

    ```


    我们之前学过编译器会创建字符串 "Hello" 并将其存储在计算机内存某处。变量 `message` 存储该位置的地址。现在，如果我们如下所示将 `message`
    的值更新为 "World"


    message = "World";


    编译器实际上并没有去存储 "Hello" 的位置将其值改为 "World"。相反，它创建了一个新字符串 "World"，并将其存储在计算机内存的其他地方。然后将这个新地址分配给
    `message`。换句话说，现在有两个字符串："Hello" 和 "World"。`message` 存储 "World" 的地址。如果程序不再需要 "Hello"，它最终会被销毁以释放该内存位置。这个过程被称为垃圾回收（garbage
    collection），由 Java 自动处理。


    ## 第 5 章：让我们的程序交互


    现在我们已经涵盖了变量和数据类型的基础，让我们写一个接受用户输入、将数据存储在变量中并向用户显示信息的程序。毕竟，如果一个计算机程序不能与其用户交互，那还有什么用呢？


    ## 5.1 显示输出


    我们在第 2 章和第 4 章已经见过向用户显示输出的一些示例。


    简单来说，为了向用户显示输出，我们可以使用 Java 的 `print()` 或 `println()` 方法。为了使用这些方法，我们必须在方法名之前加上
    `System.out`。这是因为这两个方法属于 `PrintStream` 类，我们必须使用 `System.out` 来访问它们。如果现在听起来非常困惑，不要担心，我们将在第
    7 章学习更多关于类和方法的知识。


    `println()` 和 `print()` 方法的区别在于 `println()` 在显示消息后会将光标移动到下一行，而 `print()` 则不会。


    例如，如果我们写：


    ```

    System.out.println("Hello "); System.out.println("How are you?");

    ```


    我们将得到：


    Hello

    How are you?


    如果我们写：


    ```

    System.out.print("Hello ");

    System.out.print("How are you?");

    ```


    我们将得到：


    Hello How are you?


    除此之外，这两个方法是相同的。


    让我们来看几个如何使用 `println()` 向用户显示信息的示例。`print()` 方法的工作方式完全相同。


    ### 显示简单的文本消息


    为了显示简单的消息，我们写：


    ```

    System.out.println("Hi, my name is Jamie.");

    ```


    输出：


    Hi, my name is Jamie.


    ### 显示变量的值


    为了显示变量的值，我们写：


    ```

    int number = 30;

    ```


