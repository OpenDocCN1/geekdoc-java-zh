    Java 也被设计为平台无关的。正如前面提到的，Java 代码首先被编译成字节码，可以在任何安装了 Java 虚拟机（JVM）的机器上运行。因此，使用 Java，你可以编写一次代码，并在任何你想运行的地方运行它。


    接下来，Java 是一种面向对象编程（OOP）语言。面向对象编程是一种编程方法，它将编程问题拆分为相互作用的对象。在这一本书中，我们将介绍各种面向对象编程的概念。一旦你掌握了
    Java，你就会熟悉这些概念。这将使你未来更容易地掌握其他面向对象的编程语言。


    确信 Java 是一门非常棒的学习语言了吗？让我们继续吧。


    ## 第 2 章：准备学习 Java


    ## 2.1 安装 JDK 和 NetBeans


    在我们开始开发 Java 应用程序之前，我们需要下载并安装 JDK 和 NetBeans。这两者都可以免费下载。


    ### 2.1.1 什么是 JDK？


    JDK 代表 Java Development Kit（Java 开发工具），是 Oracle 提供的一套免费工具包，其中包含许多帮助我们开发 Java 应用程序的工具。其中一些工具包括：将我们编写的代码编译成字节码的编译器（`javac.exe`）、用于打包和分发
    Java 文件的归档器（`jar.exe`）以及从 Java 代码生成 HTML 文档的文档生成器（`javadoc.exe`）。


    此外，JDK 还包含 Java 运行时环境（JRE）。JRE 包含了第 1 章提到的 JVM 以及 JVM 运行 Java 程序所需的资源。


    如果你只对运行 Java 程序感兴趣，你只需要 JRE 即可。但是，由于我们对开发 Java 程序也感兴趣，我们需要 JDK。


    要下载 JDK，请访问 https://www.oracle.com/java/technologies/javase-jdk11-downloads.html
    并滚动到页面底部。你会看到一个包含多个下载链接的表格。你要下载的版本取决于你正在使用的操作系统。x86 和 x64 分别指 32 位和 64 位操作系统。例如，如果你使用
    64 位 Windows 操作系统，你将下载 "Windows-x64 Installer" `.exe` 文件。


    下载完成后，双击下载的文件来安装 JDK。


    ### 2.1.2 什么是 NetBeans？


    除了 JDK 之外，我们还需要安装 NetBeans。


    NetBeans 是一个集成开发环境（IDE），我们将用它来辅助我们的编码过程。严格来说，我们可以在不使用 NetBeans 的情况下开发 Java 应用程序。我们可以在记本文（或任何文本编辑器）中编写代码，并使用
    JDK 提供的工具编译并执行它们。下面的截图显示了如何操作的示例。


    ![](img/e54e623de3257a5898317957ad237a2d_12_0.png)


    然而，虽然仅使用 JDK 开发 Java 应用程序是可能的，但这个过程繁琐且容易出错。


    为了让编码更简单，强烈建议你使用 IDE。IDE 包含一个具有高级功能的文本编辑器用于编写代码，并为我们提供图形化用户界面来调试、编译和运行我们的应用程序。正如我们后面看到的，这些功能在编码时将会有很大帮助。我们将使用的
    IDE 是 Oracle 提供的 NetBeans。


    要下载 NetBeans，请访问 https://netbeans.apache.org/download/nb90/nb90.html。滚动到“Downloading”部分并点击“Binaries”链接来下载文件。下载完成后，将文件解压到桌面。


    完成后，你就可以开始编写你的第一个 Java 程序了。


    ## 2.2 如何使用这本书？


    然而，在我们开始之前，我想强调一个事实：Java 中的大部分代码由相当较长的语句组成。因此，某些语句可能会换行到下一行。如果你在阅读过程中遇到问题，请参考书中的示例。

