    \ in the interface. Hence, if you add an abstract method to your interface, you\
    \ need to ensure that all classes that implement your interface implement the\
    \ new method. This is often impossible to do as you may have no idea which classes\
    \ implemented your interface.\n\nTo overcome this problem, Java added support\
    \ for default and static methods for interfaces. This allows us to add methods\
    \ to our interfaces without having to make any changes to the classes that implemented\
    \ it.\n\n## 8.5 Access Modifiers Revisited\n\nNow that we have covered various\
    \ topics related to inheritance, let us take a second look at the concept of access\
    \ modifiers in object oriented programming. Earlier, we learnt that an access\
    \ modifier is like a gatekeeper. It controls who has access to a certain field\
    \ or method. Java comes with 3 access modifiers: `private, public` and `protected`.\
    \ If an access modifier is not stated, the access level is taken to be package-private.\n\
    \nTo understand how `private, public, protected` and package-private work, let's\
    \ consider the example below. We'll be using fields to demonstrate the concept.\
    \ The same applies to methods.\n\nCreate a new NetBeans project and name it `ModifierDemo`.\
    \ Replace the code in `ModifierDemo.java` with the following\n\n```\npackage modifierdemo;\n\
    \npublic class ModifierDemo {\n\n    public int publicNum = 2;\n    protected\
    \ int protectedNum = 3;\n    int packagePrivateNum = 4;\n    private int privateNum\
    \ = 1;\n\n}\n```\n\nNow create another class in the `modifierdemo` package and\
    \ name it `ClassesInSamePackage`. Replace the code in `ClassesInSamePackage.java`\
    \ with the following\n\n```\npackage modifierdemo;\n\npublic class ClassesInSamePackage\n\
    {\n    //just an empty class\n}\n\nclass ClassA extends ModifierDemo\n{\n    public\
    \ void printMessages()\n    {\n        //This is ok\n        System.out.println(publicNum);\n\
    \n        //This is ok\n        System.out.println(protectedNum);\n\n        //This\
    \ is ok\n        System.out.println(packagePrivateNum);\n\n        //This is NOT\
    \ ok\n        System.out.println(privateNum);\n    }\n}\n\nclass ClassB\n{\n \
    \   public void printMessages()\n    {\n        ModifierDemo p = new ModifierDemo();\n\
    \n        //This is ok\n        System.out.println(p.publicNum);\n\n        //This\
