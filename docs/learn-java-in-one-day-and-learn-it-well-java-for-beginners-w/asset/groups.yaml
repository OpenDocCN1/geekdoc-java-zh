    }\n```\n\n我们可以将该方法重写为下面的 lambda 表达式：\n\n```\n(n, m) -> {\n    if (n > 10)\n  \
    \      return m;\n    else\n        return m+1;\n\n\n现在现在熟悉了一些了一些 lambda 表达式，让我们来看看如何调用这些方法。要调用这些方法需要做两件事：首先，我们需要为每个函数接口声明引用：\n\
    \n```\nMyNumber num1;\nMyNumberPara num2;\n```\n\n记得我们不能实例化接口，所以不能写类似这样的代码：\n\n\
    ```\nMyNumber num1 = new MyNumber();\n```\n\n但声明引用是可以的。声明引用后，我们可以为它们分配 lambda\
    \ 表达式。我们将无参数的 lambda 表达式分配给 `num1`，将两个参数的 lambda 表达式分配给 `num2`。随后，我们可以使用点运算符通过\
    \ `num1` 和 `num2` 调用 `getValue()` 和 `getValue2()` 方法。让我们来看一个完整的工作示例。启动 NetBeans\
