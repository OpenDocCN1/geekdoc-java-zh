    \n### 6.4.1 break 语句\n\n第一个分支语句是 `break` 语句。我们已经看到过该语句如何在 `switch` 语句中使用。除了用于\
    \ `switch` 语句，`break` 语句也可以用于其他控制流语句。它会在满足特定条件时程序提前退出循环。让我们来看 `break` 语句在 `for`\
    \ 语句中的用法。\n\n考虑下面的代码段：\n\n```java\n1 for (int i = 0; i < 5; i++)\n2 {\n3   System.out.println(\"\
