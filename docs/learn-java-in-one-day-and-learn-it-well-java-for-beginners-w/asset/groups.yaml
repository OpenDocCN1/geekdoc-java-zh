    \ compatibility. Simply stated, binary compatibility means that when you change\
    \ your interface, you do not need to make any changes to the classes that implement\
    \ it.\n\nFor instance, suppose we want to add a new method to our interface MyInterface.\
    \ If we simply add the method declaration to the interface as shown below, we\
    \ will get an error.\n\n```\ninterface MyInterface{\n\n    int myInt = 5;\n  \
    \  void someMethod();\n    void someNewMethod();\n}\n```\n\nThis is because the\
    \ class that implements this interface (MyClass) did not implement the new method.\
