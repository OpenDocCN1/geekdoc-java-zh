    \n现在保存并运行程序。你会发现，前三个成员（NormalMember）的年费为 $460，接下来的两个（VIPMember）的年费为 $1200，而最后一名成员的年费为\
    \ $0。\n\n这就是多态性的结果。在运行时（即程序运行期间），程序会确定 `clubMembers` 中的前三个成员是 `NormalMember` 类型，并执行该类中的\
    \ `calculateAnnualFee()` 方法。它还会确定接下来的两个成员是 `VIPMember` 类型，并执行该类中的方法。最后，它确定最后一个成员是\
    \ `Member` 类型，并执行父类中的方法。\n\n我们说，`clubMembers` 前三个元素的运行时类型是 `NormalMember`，接下来的两个元素的运行时类型是\
    \ `VIPMember`，而最后一个元素的运行时类型是 `Member`。相比之下，所有 5 个元素的声明类型都是 `Member`。\n\n多态性简单意味着，在运行时，虽然所有对象都被声明为\
    \ `Member` 类型，但程序足够智能，根据元素的运行时类型使用正确的 `calculateAnnualFee()` 方法。\n\n## 8.3 抽象类和方法\n\
    \n接下来，让我们讨论 Java 中两种特殊的“父类”类型——抽象类和接口。\n\n我们首先来看抽象类。\n\n抽象类是一种特殊的类，其创建的严格目的是为了作为其他类派基的基类。它们不能被实例化。换句话说，如果\
    \ `FourWheelVehicles` 是一个抽象类，那么语句\n\n```\nFourWheelVehicle myVeh = new FourWheelVehicle();\n\
    ```\n\n将导致错误，因为你不能创建抽象类的对象。\n\n抽象类可以像任何其他类一样拥有字段和方法。此外，它们还可以拥有特殊类型的方法，即抽象方法。抽象方法是没有体的方法，**必须**在派生类中实现。它们只能存在于抽象类中。\n\
