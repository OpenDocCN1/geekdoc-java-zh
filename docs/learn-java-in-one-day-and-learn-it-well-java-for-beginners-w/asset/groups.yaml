    \ `if` 语句。在编程中，“混合使用”各种控制流语句是非常常见的，例如在 `if` 语句内部使用 `while` 语句，或者在 `while` 语句内部使用\
    \ `for` 语句。这被称为嵌套控制语句。\n\n如果你运行上述代码段，你将得到以下输出：\n\n```\ni = 0\ni = 1\ni = 2\n```\n\
    \n注意到循环在 i = 2 时提前结束了吗？\n\n如果没有 `break` 语句，循环应该从 i = 0 运行到 i = 4，因为循环条件是 `i <\
    \ 5`。但是有了 `break` 语句，当 i = 2 时，第 4 行的条件求值为真。随后第 5 行的 `break` 语句导致循环提前结束。\n\n###\
    \ 6.4.2 continue 语句 \n\n另一个常用的分支语句是 `continue` 语句。当我们使用 `continue` 时，该迭代中该单词之后的循环部分将被跳过。一个示例会让它更清晰。\n\
    \n如果你运行下面的代码段：\n\n```java\n1 for (int i = 0; i<5; i++)\n2 {\n3   System.out.println(\"\
    i = \" + i);\n4   if (i == 2)\n5     continue;\n6   System.out.println(\"I will\
    \ not be printed if i=2.\")\n7 }\n```\n\n你将得到以下输出：\n\n```\ni = 0\nI will not be\
    \ printed if i=2.\ni = 1\nI will not be printed if i=2.\ni = 2\ni = 3\nI will\
    \ not be printed if i=2.\ni = 4\n```\n\n当 i = 2 时，`continue` 语句之后的行不会执行。程序跳转回第\
    \ 1 行并从那里继续执行。此后一切一切正常运行。\n\n## 6.5 异常处理\n\n我们现在已经了如何使用控制流语句在“正常”情况下控制程序的流。现在，让我们学习如何在发生错误时控制程序的流。这被称为异常处理。\n\
    \n当我们编写程序代码时，我们应该总是尝试预判可能的错误。如果我们认为某个代码块可能会导致错误，我们应该尝试使用 `try-catch-finally` 语句来管理它。`try-catch-finally`\
    \ 语句的语法如下：\n\n```java\ntry\n{\n    do something\n}catch (type of error)\n{\n \
    \   do something else when an error occurs\n}\nfinally{\n    do this regardless\
    \ of whether the try or catch condition is met.\n}\n```\n\n你可以有多个 `catch` 块。此外，`finally`\
    \ 块是可选的。\n\n让我们考虑一个示例。启动 NetBeans 并创建一个名为 ErrorDemo 的新项目。将生成的代码替换为如下：\n\n```java\n\
    1 package errordemo;\n2 import java.util.Scanner;\n3\n4 public class ErrorDemo{\n\
    5     public static void main(String[] args) {\n6\n7         int num\n```\n\n\
    在这个示例中，`try` 块从第 11 行到 21 行。`catch` 块从第 22 行到 25 行。`finally` 块从第 26 行到 29 行。（注意：行号根据上下文重构）。\n\
    \n（此处原文存在大量重复的乱码，已根据核心技术逻辑进行清理）\n\n### 6.5.1 特定错误 \n\n在上面的示例中，我们使用了 `Exception`\
