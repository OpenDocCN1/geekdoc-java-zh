    ```\n\nNow, save and run the program. You'll get the following output:\n"
  mdcn: "\n接下来，我们将使用增强型 `for` 语句来计算每个成员的年费并显示信息。\n\n为了实现这一点，我们使用：\n\n```\nfor (Member\
