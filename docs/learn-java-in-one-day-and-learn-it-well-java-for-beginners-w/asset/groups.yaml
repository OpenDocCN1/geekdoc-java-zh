    # split()


    The split() method splits a string into substrings based on a user-defined separator
    (also known as a delimiter). After splitting the string, the split() method returns
    an array that contains the resulting substrings. An array is a collection of related
    data. We''ll discuss arrays in the next section.


    Suppose you want to split the string "Peter, John, Andy, David" into substrings,
    you can do it as follows:


    ```

    String names = "Peter, John, Andy, David";

    String[] splitNames = names.split(",");

    ```


    Here, we first assign the string that we want to split to the variable names.
    We then use names to call the split() method. The split() method takes one argument
    - the delimiter used to separate the substring. In our example, the delimiter
    is a comma followed by a space.


    The result of the code above is the following array

    {"Peter", "John", "Andy", "David"}


    This array is assigned to the variable splitNames.


    We''ve covered a number of the commonly used String methods in Java. For a complete
    list of all the String methods available, check out this page

    ://docs.oracle.com/javase/8/docs/api/java/String.html#method.summary


