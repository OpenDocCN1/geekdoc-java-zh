    ## 3.8 Type Casting In Java


    Sometimes in our program, it is necessary to convert from one data type to another,
    such as from a double to an int. This is known as type casting.


    If we want to convert a smaller data type into a larger data type, we do not need
    to do anything explicitly. For instance, the code below assigns a short (2 bytes)
    to a double (8 bytes). This is known as a widening primitive conversion and does
    not require any special code on our part.


    ```

    short age = 10;

    double myWeb = age;

    ```


    However, if we want to assign a larger data type to a smaller data type, we need
    to indicate it explicitly using a pair of parenthesis. This is known as a narrowing
    primitive conversion. The example below shows how it can be done.


    ```

    int x = (int) 20.9;

    ```


    Here, we can casting a double (8 bytes) into an int (4 bytes).


    Narrowing conversion is not safe and should be avoided unless absolutely necessary.
    This is because narrowing conversion can result in a loss of data. When we cast
    20.9 into an int, the resulting value is 20, not 21. The decimal portion is truncated
    after the conversion.


    We can also cast a double into a float. Recall that we mentioned earlier that
    all non integers are treated as double by default in Java? If we want to assign
    a number 20.9 to a float, we need to add a suffix ''F'' to the number. Another
    way to do it is to use a cast, like this:


    ```

    float numl = (float) 20.9;

    ```


    The value of numl will be 20.9.


    In addition to casting between numeric types, we can also do other types of casting.
    We''ll explore some of these conversions in subsequent chapters.


    ## Chapter 4: Arrays and Strings


    In the previous chapter, we covered the eight primitive data types in Java. Besides
    these primitive types, Java also comes with a few advanced data types. In this
    chapter, we are going to cover two of them: strings and arrays. In addition, we
    are going to discuss the difference between a primitive data type and a reference
    data type.


    ## 4.1 String


    First, let us look at strings. A string is essentially a piece of text such as
    "Hello World" or "Good morning".


    To declare and initialize a String variable, you write


    ```

    String message = "Hello World";

    ```


    where message is the name of the String variable and "Hello World" is the string
    assigned to it. Note that you need to enclose the string in double quotes ("").


    You can also assign an empty string to a String variable like this:


    ```

    String anotherMessage = "";

    ```


    If you want to join two or more strings together, you can use the concatenate
    sign (+). For instance, you can write


    ```

    String myName = "Hello World, " + "my name is Jamie";

    ```


    This is the same as


    ```

    String myName = "Hello World, my name is Jamie";

    ```


    ## 4.1.1 String Methods


    Unlike the 8 primitive types we looked at in the previous chapter, a String is
    actually an object. Specifically, it is an object of the String class.


    Do not worry if you don''t understand what this means; we''ll discuss classes
    and objects in Chapter 7. For now, all that you have to know is that the String
    class provides us with a number of pre-written methods that we can use when working
    with strings. A method is a block of reusable code that performs a certain task.
    We''ll look at some examples later.


    In Java, a method may have different variations. Most of the examples below discuss
    only one of the variations for each method. However, if you learn how to use one
    variation, you can figure out how to use the other variations with relative ease.
    Let''s look at some of the commonly used String methods now.


    ### length()


    The length() method tells us the total number of characters the string has.


    To find the length of the string "Hello World", we write


    ```

    int maxLength = "Hello World".length();

    ```


    Whenever we use a method, we need to use the dot operator. We type the name of
    the method (length in this case) after the dot operator, followed by a pair of
    parenthesis(). Most methods return an answer after they complete their tasks.
    The length() method returns the length of the string. You can assign this result
    to a variable as shown below.


    ```

    int maxLength = "Hello World".length();

    ```


    In the example above, myList will be equal to 11 as "Hello" and "World" both have
    5 characters each. When you add the space between the two words, you get a total
    length of 11.


    You can display the result of the length() method using the statements below.


    ```

    int myList = "Hello World".length();

    System.out.println(myLength);

    ```


    Try adding the two statements above to the HelloWorld.java file you wrote earlier
    in Chapter 2. You''ll have to add them inside the opening and closing braces of
    the main() method. Run the program. You''ll see the value 11 displayed as the
    output. We''ll talk more about displaying outputs in the next chapter.


    ### toUpperCase()/toLowerCase()


    The toUpperCase() method is used to convert a string to uppercase characters.
    The toLowerCase() method is used to convert a string to lowercase characters.


    For instance, to change the string "Hello World" to upper case, we can write


    ```

    String uCase = "Hello World".toUpperCase();

    ```


    On the right side of the statement, we use the string "Hello World" to call the
    toUpperCase() method. We then assign the result to the variable uCase.


    uCase will thus be equal to "HELLO WORLD".


    ### substring()


    The substring() method is used to extract a substring from a longer string.


    Some methods in Java require certain data for them to work. These data are known
    as arguments. We include these arguments in the pair of parenthesis that follows
    the method name. The substring() method is an example of a method that requires
    one argument to work.


    For instance, to extract a substring from "Hello World", we can use the statement
    below:


    ```

    String firstSubstring = "Hello World".substring(6);

    ```


    On the right side of the statement, we use the "Hello World" string to call the
    substring() method. The number 6 in the parenthesis is known as the argument.
    This argument tells the compiler to start extracting the substring. Essentially,
    it is asking the compiler to extract the substring from index 6 (i.e. position
    6) to the end of the string.


    Note that in programming, index starts with a value of ZERO not 1. This is a common
    practice in all programming languages such as Python and Java. Hence, in our example,
    ''H'' is at index 0 while ''W'' is at index 6.


    The statement above will extract the substring "World". This result is then assigned
    to firstSubstring.


    firstSubstring is thus equal to "World".


    The substring() method also comes with another variation that allows us to extract
    a substring from one index to another. Suppose you want to extract a substring
    from position 1 to 7, you can do it as follows:


    ```

    String message = "Hello World";

    String secondSubstring = message.substring(1, 8);

    ```


    In the example above, we first assigned "Hello World" to the variable message.
    We then use message to call the substring() method.


    The two arguments are 1 and 8.


    As before, the first argument tells the compiler the index of the starting position
    to extract. The second argument tells the compiler the index of the first position
    to stop extracting. In other words, in our example, the compiler stops extracting
    at position 8 (not after position 8). That means the letter at position 8 is not
    included in the substring. Hence, the substring extracted is "ello Wo".


    secondSubstring is thus equal to "ello Wo".

    message remains as "Hello World".


    ### charAt()


