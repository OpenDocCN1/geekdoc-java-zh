    \ Refer to Chapter 2.3.1 if you have forgotten what a package is. Package-private\
    \ is the default access level. If we do not write any access modifier, it means\
    \ the class is package-private.\n\nWe’ll look at access modifiers in greater depth\
    \ in Chapter 8.5.\n\nAfter declaring the access level of the class, we type the\
    \ class keyword to indicate that we are declaring a class, followed by the name\
    \ of the class (ManagementStaff).\n\nIt is common practice to use PascalCasing\
    \ when the practice of naming our classes. PascalCasing refers to the first letter\
