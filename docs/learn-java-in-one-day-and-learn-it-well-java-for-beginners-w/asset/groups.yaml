    \ to that class. In other words, they control whether other classes can use a\
    \ particular field or method in that class.\n\nA class can either be public or\
    \ package-private. In the example above, the class is public.\n\npublic means\
    \ the class can be accessed by any class in the program.\n\nPackage-private, on\
    \ the other hand, means the class is only accessible to other classes within the\
