    \ meaningful, designed to indicate the casual reader the intent of its use. It\
    \ makes more sense to name your variables userName, userAge and accountNumber,\
    \ instead of n, and un.\n\nIn addition, there are some reserved words that you\
    \ cannot use as a variable name because they already have pre-assigned meanings\
    \ in Java. These reserved words include words like System, if, while etc. We'll\
