    \ x and y as follows:\n\n```\nint x = 5;\nint y = 10;\n```\n\nIf we write x =\
    \ y, the value of y is assigned to x. So eventually x becomes 10.\n\n## 3.6 Basic\
    \ Operators\n\nBesides assigning a value to variables, we can perform mathematical\
