- md: "\n# Chapter 11: Advanced Java Topics\n\nCongratulations! We've come to the\
    \ last chapter before the project. In this chapter, we are going to briefly cover\
    \ a few advanced topics in Java, namely: Generics, Lambda Expressions and Functional\
    \ Interfaces.\n\n> LoL\n\n## 11.1 Generics\n\nFirst, let's look at generics.\n\
    \nWe have already used generics when we discussed LinkedList and ArrayList in\
    \ Chapter 9. Recall that in Chapter 9, you learned to declare an ArrayList of\
    \ Integer using the following statement\n\n```\nArrayList<Integer> myArrayList\
    \ = new ArrayList();\n```\n\nWe mentioned that you write Integer inside the angle\
    \ brackets <> to indicate that the ArrayList contains Integer objects. In contrast,\
    \ if you want to declare an ArrayList of String objects, you write\n\n```\nArrayList<String>\
    \ myArrayList = new ArrayList();\n```\n\nThis is the gist of generics. Generics\
    \ allow us to create classes (such as the ArrayList class), interfaces and methods\
    \ in which the type of the data they operate on is specified as a parameter in\
    \ angle brackets.\n\nTo understand how this works, let's write our own generic\
    \ class. We'll start with a normal class first.\n\nLaunch NetBeans and create\
    \ a new Project called GenericsDemo.\n\nReplace the code with the code below.\n\
    \n```\npackage genericsdemo;\npublic class GenericsDemo {\n```\n\n```\npublic\
    \ static void main(String[] args) {\n\n    MyGenericsClass g = new MyGenericsClass();\n\
    \n    g.setMyVar(6);\n    g.printValue();\n}\n```\n\n```\nclass MyGenericsClass{\n\
    \n    private Integer myVar;\n\n    void setMyVar (Integer i) {\n        myVar\
    \ = i;\n    }\n\n    void printValue() {\n        System.out.println(\"The value\
    \ of myVar is \" + myVar);\n    }\n}\n```\n\nIn the code above, we created a class\
    \ called MyGenericsClass. This class contains a private field (myVar) and two\
    \ methods called setMyVar() and printValue() which sets and prints the value of\
    \ myVar respectively.\n\n> Gotta get in the habit of using setters and getters.\n\
    \nIn the main() method, we instantiated a MyGenericsClass object. Next, we set\
    \ the value of myVar to 6 and print out its value using the printValue() method.\
    \ If you run this program, everything will work fine and you'll get the following\
    \ output:\n\nThe value of myVar is 6\n\nHowever, let's suppose you want to set\
    \ the value of myVar to 6.1 instead. Try changing the line\n\n```\ng.setMyVar(6);\n\
    ```\n\nto\n\n```\ng.setMyVar(6.1);\n```\n\nand run the program again. What happens?\
    \ You get an error right? This is because myVar is declared to be of Integer type\
    \ in MyGenericsClass. Since 6.1 is not of Integer type, we get an error.\n\nIf\
    \ you want your class and method to work with both Integer and Double types? In\
    \ this case, you can use generics. To do that, you have to make two changes to\
    \ MyGenericsClass.\n\nFirstly, you need to change the class declaration to\n\n\
    ```\nclass MyGenericsClass<T>\n```\n\nT is known as a type parameter. In other\
    \ words, it is a parameter for specifying the type of data that the class will\
    \ operate on. It is a convention to use the uppercase letter T to represent a\
    \ type parameter.\n\nNext, you need to change all the Integer keywords in myGenericsClass\
    \ to T.\n\nIn other words, you need to change\n\n```\nprivate Integer myVar;\n\
    ```\n\nto\n\n```\nprivate T myVar;\n```\n\nand\n\n```\nvoid setMyVar (Integer\
    \ i);\n```\n\nto\n\nvoid setMyVar(T i)\n\nNow try to run the program again. What\
    \ happens?\n\nThe program works now right? In fact, you can set the value of myVar\
    \ to a string and the program will still work. Try changing the line\n\ng.setMyVar(6.1);\n\
    \nto\n\ng.setMyVar(\"Java\");\n\nand run the program again. It'll still work.\
    \ Nice!\n\nThis, in essence, is how generics work. Generics allow us to create\
    \ a single class, interface or method that automatically works with different\
    \ types of data.\n\nSimple enough, right?\n\nHowever, this is not the sole advantage\
    \ of using generics. Another advantage of generics is it allows for type-checking.\n\
    \nIn our example above, we've just seen that MyGenericsClass works with Integer,\
    \ Double and String type. In fact, it will work with any reference type. While\
    \ this makes our code more flexible, it can also lead to errors.\n\nFor instance,\
    \ suppose myVar is actually used to store the number of students in a class. If\
    \ there are ten students in the class and we write\n\ng.setMyVar(10);\n\nall is\
    \ good. However, suppose we make a mistake and write\n\ng.setMyVar(10.2);\n\n\
    the compiler will not be able to spot this error since setVar() is a generic method.\
    \ This leads to logical errors that can be very difficult to detect in large programs.\
    \ To overcome this problem, Java provides us with a solution. Instead of declaring\
    \ g using the statement below,\n\nMyGenericsClass g = new MyGenericsClass();\n\
    \nwe'll be more specific and declare it as follows:\n\nMyGenericsClass<Integer>\
    \ g = new MyGenericsClass();\n\nWhen we add <Integer> to the declaration, the\
    \ compiler will know that the type parameter T for MyGenericsClass should be replaced\
    \ with Integer when we are working with g.\n\n> You control it in the declaration\
    \ of the instance.\n\nHence, if we write\n\ng.setMyVar(10.2);\n\nwe'll get an\
    \ error.\n\nIn short, generics provide us with a way to write classes, interfaces\
    \ and methods that work with different types of data. Hence, we do not need to\
    \ write a new class for each data type that we want to work with.\n\nIn addition,\
    \ when we instantiate an object, we can specify what data type we want the object\
    \ to work with. This allows the compiler to check for any errors that can arise\
    \ if we use the wrong data type.\n\n## 11.1.1 Bounded Types\n\nIn the previous\
    \ section, we discussed how generics work in general. The type parameter T in\
    \ MyGenericClass can accept any data type as long as it is a reference type (generics\
    \ does not work with primitive types).\n\nIn this section, we'll look at how we\
    \ can be more specific when using generics. Sometimes, it may be useful to limit\
    \ the data types that can be passed to a type parameter. For instance, we may\
    \ want to create a generic class that only works with numbers. This generic class\
    \ may contain methods that calculate the sum and average of these numbers. For\
    \ cases like these, we can use a bounded parameter. This can be done using the\
    \ extends clause.\n\nIf you specify the type parameter as\n\n```\n<T extends A>\
    \ — the class being extended\n```\n\nT can only accept data types that are subclasses\
    \ of A.\n\nAll numeric classes in Java (e.g. Integer and Double) are subclasses\
    \ of the Number class. If we want our class to only work with numeric data types,\
    \ we can declare the class as\n\n```\nclass MyGenericsClass<T extends Number>\n\
    {\n```\n\nNow, if we instantiate a MyGenericsClass object as follows,\n\n```\n\
    MyGenericsClass<String> g2 = new MyGenericsClass();\n```\n\nwe'll get an error\
    \ as String is not a subclass of Number.\n\nIn contrast, the statements\n\n```\n\
    MyGenericsClass<Integer> g3 = new MyGenericsClass();\nMyGenericsClass<Double>\
    \ g4 = new MyGenericsClass();\n```\n\nare fine as Integer and Double are both\
    \ subclasses of Number.\n\nWe've just covered a brief introduction of generics.\
    \ A complete discussion will require a full chapter and is beyond the scope of\
    \ the book.\n\nNext, let us move on to functional interfaces and lambda expressions.\n\
    \n## 11.2 Functional Interfaces and Lambda Expressions\n\nThe concept of functional\
    \ interfaces and lambda expressions go in hand. First, let's look at the concept\
    \ of a functional interface. A functional interface is simply an interface that\
    \ contains one and only one abstract method. It can contain other static and default\
    \ methods, but there must only be one abstract method.\n\nConsider the following\
    \ interface:\n\n```\n@FunctionalInterface\ninterface MyNumber{\n    double getValue();\n\
    }\n```\n\nThis interface contains one abstract method (recall that there is no\
    \ need to use the abstract modifier here as methods in interfaces are abstract\
    \ (by default)). Since this interface only contains one abstract method, it is\
    \ known as a functional interface. In a functional interface, the abstract method\
