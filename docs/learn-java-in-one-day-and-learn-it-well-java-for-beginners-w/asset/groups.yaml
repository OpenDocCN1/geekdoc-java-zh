    method earlier. We did not use the dot operator as both methods are from the same
    class.


    After creating our staff object, the next line shows how we can use the public
    setter method setHoursWorked() to assign a value to the hoursWorked field.


    ```

    staff1.setHoursWorked(160);

    ```


