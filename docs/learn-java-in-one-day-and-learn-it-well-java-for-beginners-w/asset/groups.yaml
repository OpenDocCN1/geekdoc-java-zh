  - '[PAGE 112]


    The reason for this is because when you pass in a reference type variable, you
    are passing in the address of the variable. The compiler can go to the address
    that you passed in and make the relevant changes to the variable.


    On the other hand, when you pass in a primitive type variable, you are passing
    in the value of the variable and not the address.


    For instance, if the value of number is 2, writing


    ```

    amd.passPrimitive(number);

    ```


    is the same as writing


    ```

    amd.passPrimitive(2);

    ```


    This value 2 is assigned to the parameter primitivePara. Since we are not passing
    in the address of number, any change that occurs inside the method does not affect
    number.


    This is an important difference that you have to understand when you pass in a
    primitive type variable (e.g. int, float etc) vs a reference type variable (such
    as an array) to a method.'
