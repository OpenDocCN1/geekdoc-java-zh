    \n![](img/e54e623de3257a5898317957ad237a2d_90_0.png)\n\n## Right click on the\
    \ package name\n\nWe'll call this new class Staff and add fields, constructors\
    \ and methods to the class. The declaration of the class is as follows:\n\n```\n\
