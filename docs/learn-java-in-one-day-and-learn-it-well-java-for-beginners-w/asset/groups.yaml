- md: "\n## 7.5 Advanced Methods Concepts\n\n### 7.5.1 Using Arrays in Method\n\n\
    Before we end this chapter, I would like to discuss two more concepts about methods.\
    \ The first is regarding using arrays about methods in methods.\n\nPreviously,\
    \ we learned how to use primitive data types like int as parameters to a method.\
    \ In addition to using primitive data types, we can also use arrays.\n\nTo use\
    \ an array as a parameter, we add a square bracket [] after the parameter's data\
    \ type in the method declaration. An example is shown below.\n\n```java\npublic\
    \ void printFirstElement(int[] a)\n{\n}\n```\n\nTo call this method, we need to\
    \ declare an array and pass it in as an argument to the method. We'll see an example\
    \ of this later.\n\nIn addition to using arrays as parameters, we can also return\
    \ an array from a method. To return an array from a method, we add a square bracket\
    \ [] after the return type in the method declaration. An example is\n\n```java\n\
    public int[] returnArray()\n{\n    int[] a = new int[3];\n\n    // Some code for\
    \ updating values in the array\n\n    return a;\n}\n```\n\nTo use this method,\
    \ we need to declare an array and assign the method's result to it.\n\nTo fully\
    \ understand how we can use arrays in methods, let's create a new Java application\
    \ called ArrayMethodDemo and replace the code with the following:\n\n```java\n\
    1 package arraymethoddemo;\n2\n3 import java.util.Arrays;\n4\n5 class MyClass{\n\
    6\n7 public void printFirstElement(int[] a)\n8 {\n9 System.out.println(\"The first\
    \ element is \" + a[0]);\n10 }\n11\n12 public int[] returnArray()\n13 {\n14 int[]\
    \ a = new int[3];\n15 for (int i = 0; i < a.length; i++)\n16 {\n17 a[i] = i*2;\n\
    18 }\n19 return a;\n20 }\n21\n22 }\n23\n24 public class ArrayMethodDemo {\n25\
    \ public static void main(String[] args) {\n26\n27 MyClass amd = new MyClass();\n\
    28\n29 int[] myArray = {1, 2, 3, 4, 5};\n30 amd.printFirstElement(myArray);\n\
    31\n32 int[] myArray2 = amd.returnArray();\n33 System.out.println(Arrays.toString(myArray2));\n\
    34\n35 }\n36\n```\n\nIn this example, we included two classes - MyClass and ArrayMethodDemo\
    \ - in the same file again for simmplicity.\n\nInside the class MyClass (lines\
    \ 5 to 22), we have two methods.\n\nThe first method printFirstElement() shows\
    \ how you can use an array as a parameter.\n\nThe second method returnArray()\
    \ shows how you can return an array from a method.\n\nTo use these two methods,\
    \ we initialized a MyClass object called amd in the main() method (line 27).\n\
    \nWe then declared an array and passed it in as an argument to the printFirstElement()\
    \ method on lines 29 and 30.\n\n```java\nint[] myArray = {1, 2, 3, 4, 5};\namd.printFirstElement(myArray);\n\
    ```\n\nIn addition, we also declared a second array in the array in the main()\
    \ method and assigned the result of the returnArray() method to it on line 32.\n\
    \n```java\nint[] myArray2 = amd.returnArray();\n```\n\nFinally, on line 33, we\
    \ printed the contents of the array.\n\nIf you run the program above, you'll get\
    \ the following output:\n\nThe first element is 1\n[0, 2, 4]\n\n### 7.5.2 Passing\
    \ Primitive Type vs Reference Type Parameters\n\nNow that you know how to pass\
    \ an array to a method, let us look at the difference between a primitive type\
    \ parameter vs. a reference type parameter (such as an array). There is an important\
    \ difference.\n\nWhen you pass in a primitive type variable, any change made to\
    \ the value of that variable is only valid within the method itself. Once the\
    \ program exits the method, the change is no longer valid.\n\nTo understand how\
    \ this works, the following two methods to MyClass in ArrayMethodDemo.java.\n\n\
    ```java\npublic void passPrimitive(int primitivePara)\n{\n    primitivePara =\
    \ 10;\n    System.out.println(\"Value inside method = \" + primitivePara);\n}\n\
    \npublic void passReference(int[] refPara)\n{\n    refPara[1] = 5;\n    System.out.println(\"\
    Value inside method = \" + refPara[1]);\n}\n```\n\nThe first method has a primitive\
    \ type parameter (int primitivePara) and tries to change the value of that parameter.\
    \ It then prints the value of the parameter.\n\nThe second method has a reference\
    \ type parameter (an array) and tries to change the value of the second element\
    \ in the array. It then prints the value of that element.\n\nIn our main() program,\
    \ add the following lines of code:\n\n```java\nint number = 2;\nSystem.out.println(\"\
    number before = \" + number);\namd.passPrimitive(number);\nSystem.out.println(\"\
    number after = \" + number);\n```\n\n```java\nSystem.out.print(\"\\n\");\n```\n\
    \n```java\nSystem.out.println(\"myArray before = \" + myArray[1]);\namd.passReference(myArray);\n\
    System.out.println(\"myArray after = \" + myArray[1]);\n```\n\nIf you run the\
    \ program above, you'll get the following output:\n\nnumber before = 2\nValue\
    \ inside method = 10\nnumber after = 2\n\nmyArray before = 2\nValue inside method\
    \ = 5\nmyArray after = 5\n\n## Chapter 8: Object-Oriented Programming Part 2\n\
    \nNow, let us move on to some of the more advanced topics in object-oriented programming.\
    \ In this chapter, we'll learn about inheritance, polymorphism, abstract classes\
    \ and interfaces.\n\n### 8.1 Inheritance\n\nInheritance is one of the key concepts\
    \ in object-oriented programming. Simply stated, inheritance allows us to create\
    \ a new class from an existing class so that we can reuse existing code. In fact,\
    \ all classes in Java are inherited from a pre-written base class known as the\
    \ Object class.\n\nThe Object class consists of a number of pre-written methods\
    \ that we can use whenever we work with classes. One method is the toString()\
    \ that returns a string that represents the object. We used the toString() method\
    \ previously when we discussed arrays. We'll be looking at the toString() method\
    \ again when we work on our project.\n\nSo what exactly is inheritance?\n\n####\
    \ 8.1.1 Writing the Parent Class\n\nLet us work through a small program together\
    \ to illustrate the concept of inheritance.\n\nSuppose we are writing a program\
    \ for a fitness club that has two types of membership – VIP and Normal. To do\
    \ that, let's launch NetBeans and create a new Java Project called InheritanceDemo.\n\
    \nAdd a new class called Member to the inheriteddemo package. Refer to Chapter\
    \ 7.2 for instructions on how to add a new class if necessary.\n\nWe'll be getting\
    \ user input in the Member class. Hence, we need to add the statement\n\n```java\n\
    import java.util.Scanner;\n```\n\nto our class. Add this statement after the line\n\
    \n```java\npackage inheriteddemo;\n```\n\nNow, we are ready to start working on\
    \ the class. Add the following lines to the Member class (inside the curly braces).\n\
    \n```java\npublic String welcome = \"Welcome to ABC Fitness\";\nprotected double\
    \ annualFee;\nprivate String name;\nprivate int memberID;\nprivate int memberSince;\n\
    private int discount;\n```\n\nHere, we declare six fields for the Member class.\n\
    \nThe first is a public field that stores a welcome message. We initialise this\
    \ field with the string \"Welcome to ABC Fitness\".\n\nThe other five fields include\
    \ one protected field and four private fields. We'll talk more about protected\
    \ fields in a later section. For now, just know that a protected field is accessible\
    \ within the class in which it is declared, any class that is derived from it\
    \ and any class that is in the same package. Derived classes will be covered in\
    \ the next section.\n\nNext, let's add two constructors to our class.\n"
