    # 4.3 Primitive Type vs. Reference Type


    Now that we are familiar with strings and arrays, let us discuss an important
    concept regarding data types in Java.


    All data types in Java can be classified as either a primitive type or a reference
    type. There are only 8 primitive types in Java (byte, short, int, long, float,
    double, char and boolean), the rest are reference types. Examples of reference
    types include strings and arrays discussed in this chapter, and classes and interfaces
    that will be discussed in Chapter 7 and 8.


    One of the main differences between a primitive type and a reference type is the
    data that is stored.


    A primitive type stores its own data.


    When we write


    ```

    int myNumber = 5;

    ```


    the variable myNumber stores the actual value 5.


    A reference type, on the other hand, does not store the actual data. Instead,
    it stores a reference to the data. It does not tell the compiler what the value
    of the data is; it tells the compiler where to find the actual data.


    An example of a reference type is a String. When you write a statement like'
  - '[PAGE 47]


    ```

    String message = "Hello";

    ```


    the variable message actually does not store the string "Hello".


    Instead, the string "Hello" is created and stored elsewhere in the computer''s
    memory. The variable message stores the address of that memory location.


    That''s all that we need to know about reference types at the moment. As this
    is a book for beginners, we will not go into details about why reference types
    are necessary. Just be aware that there is a difference between primitive types
    and reference types; the former stores a value while the latter stores an address.


    # 4.4 Strings are Immutable


    Before I end this chapter, I would like to cover one more concept about strings.
    Specifically, I would like to point out that strings are immutable in Java (and
    most other languages).


    Immutable means the value of a string cannot be changed. Whenever we update a
    String variable, we are actually creating a new string and assigning the memory
    address to the String variable. Let''s consider an example. Suppose we have


    ```

    String message = "Hello";

    ```


    We learned earlier that the compiler will create the string "Hello" and store
    it somewhere in the computer''s memory. The variable message stores the address
    of that location. Now, if we update the value of message to "World" as shown below


    message = "World";


    the compiler actually does not go to the location where "Hello" is stored to change
    its value to "World". Instead, it creates a new string "World",'
  - '[PAGE 48]


    and stores it somewhere else in the computer''s memory. This new address is then
    assigned to message. In other words, there are two strings now: "Hello" and "World".
    message stores the address of "World". If "Hello" is no longer needed in the program,
    it is eventually destroyed so as to free up that memory location. This process
    is known as garbage collection and is handled automatically by Java.'
