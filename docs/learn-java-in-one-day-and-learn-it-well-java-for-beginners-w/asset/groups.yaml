    # Chapter 1: Introduction to Java


    Welcome to Java programming and thank you so much for choosing my book among the
    large selection of Java books available.


    Whether you are a seasoned programmer or a complete novice, this book is written
    to help you learn Java programming fast. Topics are carefully selected to give
    you a broad exposure to the fundamental concepts of Java while not overwhelming
    you with information overload. While it is not possible to cover every single
    Java concept in this book, rest assured that by the end of the book, you should
    have no problem writing your own Java programs. In fact, we will be coding a program
    together as part of the project at the end of the book. Ready to start?


    Let''s first answer a few questions:


    # 1.1 What is Java?


    Java is an object-oriented programming language developed by James Gosling at
    Sun Microsystems, which has since been acquired by Oracle Corporation. It was
    released in 1995 and is currently one of the most popular programming languages
    in use. It can be used to develop applications for a large variety of environments,
    such as desktop, web and even mobile devices. One of the main features of Java
    is that it is platform independent. This means that a program written in Java
    can be executed on any operating system (such as Windows, Mac or Linux).


    Like all modern programming languages, Java code resembles the English language
    which computers are unable to understand. Therefore, Java code has to be converted
    into machine code through a process known as compilation. Every computer platform
    has its own machine code instruction set. Hence, machine code that is compiled
    for one platform will not work on another platform. Most programming languages
    (like C and C++) compile written code into machine code directly. As a a'
  - '[PAGE 9]


    result, this machine code can only run on the specific platform that the code
    is compiled for.


    Java does it a little differently.


    Instead of compiling into machine code directly, Java compiles all written code
    into bytecode first. Bytecode is platform independent. That is, there is no difference
    between the bytecode for Windows, Mac or Linux.


    When a user wants to run a Java program, a program inside the user''s computer
    (known as the Java Virtual Machine or JVM) converts this bytecode into machine
    code for the specific platform that the user uses.


    The advantage of using this two-step compilation process is that it allows Java
    code to be run on all platforms as long as the computer running the Java program
    has JVM installed. JVM is free to download and there are different versions for
    different computer platforms. We''ll learn how to install JVM in the next chapter.


    # 1.2 Why Learn Java?


    There are a lot of reasons why one should learn Java. Let''s look at some of the
    reasons below.


    Firstly, Java is currently one of the most popular programming languages in use.
    According to Oracle, 3 billion devices run Java. Furthermore, Android apps are
    also developed using Java. With the growing demand for mobile apps, it is safe
    to say that Java is an essential language to learn if you are interested in becoming
    a programmer.


    Next, Java has syntax and features that resemble other programming languages like
    C and C++. If you have any prior programming experience, you will find learning
    Java a breeze. Even if you are totally new to programming, you can rest assured
    that Java is designed to be a relatively easy language to learn. Most programmers
    find it easier than say, C or C++.'
- md: '

    Java is also designed to be platform independent. As mentioned earlier, Java code
    is compiled into bytecode first, which can be run on any machine that has the
    Java Virtual Machine. Hence with Java, you can write the code once and run it
    anywhere you want.


    Next, Java is an object-oriented programming (OOP) language. Object-oriented programming
    is an approach to programming that breaks a programming problem into objects that
    interact with each other. We''ll be looking at various object-oriented programming
    concepts in this book. Once you master Java, you will be familiar with these concepts.
    This will make it easier for you to master other object-oriented programming languages
    in future.


    Convinced that Java is a great language to learn? Let''s move on.


    ## Chapter 2: Getting Ready for Java


    ## 2.1 Installing JDK and NetBeans


    Before we can start developing applications in Java, we need to download and install
    JDK and NetBeans. Both are free to download.


    ### 2.1.1 What is JDK?


    JDK stands for Java Development Kit and is a free kit provided by Oracle that
    contains a number of tools to help us develop Java applications. Some of these
    tools include a compiler to compile our written code into bytecode (javac.exe),
    an archiver to package and distribute our Java files (jar.exe) and a documentation
    generator to generate HTML documentation from our Java code (javadoc.exe).


    In addition, JDK also includes the Java Runtime Environment (JRE). JRE contains
    the JVM mentioned in Chapter 1 and the resources that JVM needs in order to run
    Java programs.


    If you are only interested in running Java programs, all you need is the JRE.
    However, since we are also interested in developing Java programs, we need the
    JDK.


    To download JDK, head over to https://www.oracle.com/java/technologies/javase-jdk11-downloads.html
    and scroll to the bottom of the page. You will see a table with multiple download
    links. The version that you''ll be downloading depends on the operating system
    that you are using. x86 and x64 refer to the 32-bit and 64-bit operating systems
    respectively. For instance, if you are using the 64-bit Windows operating system,
    you''ll be downloading the "Windows-x64 Installer" exe file.


    Once downloaded, double click on the downloaded file to install JDK.


    ### 2.1.2 What is NetBeans?


    Besides JDK, we also need to install NetBeans.


    NetBeans is an Integrated Development Environment (IDE) that we''ll be using to
    facilitate our coding process. Strictly speaking, we can develop Java applications
    without using NetBeans. We can write our code in Notepad (or any other text editor)
    and compile and execute them using the tools provided in JDK. The screenshot below
    shows an example of how this can be done.


    ![](img/e54e623de3257a5898317957ad237a2d_12_0.png)


    However, while it is possible to develop Java applications using the JDK alone,
    this process is tedious and error-prone.


    To make coding easier, you are strongly encouraged to use an IDE. An IDE includes
    a text editor with advanced features to write our code, and provides us with a
    graphical user interface to debug, compile and run our applications. As we''ll
    see later, these features will help greatly when coding. The IDE that we''ll be
    using is NetBeans provided by Oracle.


    To download NetBeans, head over to https://netbeans.apache.org/download/nb90/nb90.html.
    Scroll down to the "Downloading" section and click on the link for Binaries to
    download the file. Once downloaded, unzip the file onto your Desktop.


    Once that is done, you are ready to start coding your first Java program.


    ## 2.2 How to use this book?


    However, before we do that, I would like to highlight the fact that most of the
    code in Java consists of rather long statements. Hence, some statements may wrap
    around to the next line in this book. If you have problems reading the code samples,
    you can download the source code for all the sample programs at http://www.learncodingfast.com/java.


    ## 2.3 Your First Java Program


    Now, let''s start coding our first program.


    First, navigate to the "netbeans\bin" folder in your unzipped Netbeans installation
    folder (located on your Desktop). For Windows users, depending on whether you
    are using a 32-bit or 64-bit Windows computer, double click on the netbeans.exe
    (for 32-bit computers) or netbeans64.exe (for 64-bit computers) file to launch
    Netbeans. For Mac users, double click on the netbeans file.


    If you get an error message that says "Cannot find Java 1.8 or higher", you need
    to tell Netbeans where your JDK is installed.


    For Windows users, JDK will likely be installed in C:\Program Files\Java\jdk-***.


    For Mac users, it will likely be installed in /Library/Java/JavaVirtualMachines/jdk-***.jdk/Contents/Home.


    In both cases, *** represents the version that you installed.


    To tell Netbeans where JDK is installed, navigate to the "netbeans\etc" folder
    in your unzipped Netbeans installation folder. Open the netbeans.conf file with
    any text editor (e.g. Notepad) and use the "Find" function in your text editor
    to locate the line containing


    netbeans_jdkhome. If it is commented out (line starts with #), remove the

    # to uncomment it. Next, set the value of netbeans_jdkhome to the path

    of your JDK installation:


    For instance, if JDK is installed in C:\Program Files\Java\jdk-11.0.1, you''ll

    set netbeans_jdkhome as


    ```

    netbeans_jdkhome="C:\Program Files\Java\jdk-11.0.1"

    ```


    Once this is done, save and close the netbeans.conf file.


    Launch Netbeans again. It should launch without error now.


    If you are prompted to install the nb-javac library, you can go ahead and

    install it.


    Next, select File > New Project.... from the top menu bar.


    You''ll be prompted with the New Project dialog box. Select Java under

    Categories and Java Application under Projects. Click Next to continue.


    On the next screen, name the project HelloWorld and take note of where

    the project is stored. Finally, click Finish to create the project.


    ![](img/e54e623de3257a5898317957ad237a2d_14_0.png)


    You will be presented with a default template that NetBeans created for

    you automatically. Replace the code in the template with the below.


    Note line numbers are added for reference and are not part of the actual code.
    You may want to bookmark this page for easy reference later when we discuss the
    program. You can also download the source code for this sample program and all
    other sample programs in this book http://www.learncodingfast/java.


    If you prefer not to type the whole program below, you can just delete all the
    lines with forward slash (/) and/or asterisk (*) on the left in the template and
    add line 6 and 7 to it.


    ```

    1 package helloworld;

    2

    3 public class HelloWorld {

    4

    5     public static void main(String[] args) {

    6         //Print the words Hello World on the screen

    7         System.out.println("Hello World");

    8

    9

    10 }

    ```


    However, I strongly encourage you to type the code yourself to get a better feel
    for how NetBeans works. As you type, you will notice interesting features of NetBeans.
    For instance, you will see that words are displayed in different colours. This
    is the software''s way of making our code easier to read. Different words serve
    different purposes in our program and thus displayed using different colours.
    We''ll go into more details in later chapters.


    In addition, you will also notice that a box appears near the cursor with some
    help messages occasionally. That is known as Intellisense. For instance, when
    you type a period (.) after the word System, a dropbox list appears to let you
    know what you type after the period, with a box that provides further information.


    Finally, also note that NetBeans will automatically close brackets for you when
    you type an opening bracket. For instance, when you type "(", NetBeans will add
    the closing bracket ")" for you.


    These are some of the features that NetBeans provides to make coding easier for
    us.


    After you finish typing, save the program by selecting File > Save. NetBeans has
    a "Compile on Save" feature that compiles the code whenever you save it. You can
    then execute the compiled program by clicking on the Run button at the top menu
    (refer to image below).


    ![](img/e54e623de3257a5898317957ad237a2d_16_0.png)


    If your program fails to run, there will be a pop up box with an error message.
    Click Run Anyway to continue. You will then see a description of the error in
    the output window (refer to next image). Alternatively, you can also hover your
    mouse over the red squiggly line in the text editor window. That will provide
    you with another clue about what went wrong. Try to identify and correct the mistake
    and run the program again.

