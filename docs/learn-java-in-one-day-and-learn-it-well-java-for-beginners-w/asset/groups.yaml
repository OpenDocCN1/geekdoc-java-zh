    ```


    This statement tells the compiler that the Java file we wrote belongs to the `helloworld`
    package.


    A package is simply a grouping of related classes and interfaces. Do not worry
    if you do not know what classes and interfaces are, we''ll cover them in subsequent
    chapters.


    When we write `package helloworld;` at the top of our file, we are asking the
    compiler to include this file in the `helloworld` package. The compiler will then
    create a folder named "helloworld" and save the file into that folder. Files that
    belong to the same package are stored in the same folder.


    If you navigate to your "NetBeansProjects" folder now, you''ll find a folder named
    "HelloWorld". The "NetBeansProject" folder is normally located in your "Documents"
    folder. If you can''t find this folder, try searching for it using your computer''s
    search function.


    Within the "HelloWorld" folder, you''ll find a "src" folder that contains the
    "helloworld" folder.


    This folder stores the files of the `helloworld` package. It is a convention for
    us to name our packages in lowercase. Note that Java is a case-sensitive language.
    Hence, "HelloWorld" is not the same as "helloworld". Inside the "helloworld" folder,
    you''ll find the `HelloWorld.java` file.


    The advantage of declaring packages is that it prevents naming conflicts. Two
    or more files can have the same name as they belong to different packages. This
    is similar to how you can have two or more files of the same name on your computer
    as long as you put them in different folders. We''ll learn how to create different
    packages in Chapter 8.


    In addition to packages created by us, Java also comes with a large number of
    pre-created packages that contain code we can use in'
