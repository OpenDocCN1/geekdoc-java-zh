    # Chapter 10: File Handling


    We''ve come a long way. By now, you are familiar with quite a few core concepts
    in Java. In this chapter, we are going to cover another important topic in Java
    - reading and writing to an external file.


    In Chapter 5 previously, we learned how to get input from users using methods
    like nextInt(), next() and nextLine() etc. However, in some cases, getting users
    to enter data into our program may not be practical, especially if our program
    needs to work with large amounts of data. In this case, a more convenient way
    is to prepare the needed information as an external file and get our programs
    to read the information from the file.


    Java provides us with a number of classes and methods to work with files. The
    purpose of this chapter is to introduce you to one of the numerous ways to do
    so. The classes that we are going to look at in this chapter are the File, BufferedReader,
    FileReader, BufferedWriter and FileWriter classes. All these classes are available
    in the java.io package. To use the methods in this chapter, you have to add the
    following import statement:


    ```

    Looks like this is the same in Kotlin.

    import java.io.*;

    ```


    * indicates that we are importing the entire java.io package which contains all
    the classes that we are going to use. Alternatively, you can import the individual
    classes one by one if you prefer.


    # 10.1 Reading a Text File


    To read data from a text file, we use the FileReader. The FileReader class reads
    the contents of a file as a stream of characters, reading in one character at
    a time.'
  - '[PAGE 163]


    In theory, this is all that is needed to read from a file. Once you create a FileReader
    object, you are ready to read data from the file. However, in practice, this is
    not the most efficient way to do it. A more efficient way is to wrap a BufferedReader
    around the FileReader object.


    Like the name suggests, a BufferedReader object provides buffering for our file
    reading operation. This concept is similar to video buffering when we view videos
    online. Instead of reading one character at a time from the network or disk, BufferedReader
    reads a larger block at a time so as to speed up the process.


    Suppose we want to read data from the file myfile.txt located in the same folder
    as your project. The example below shows how it can be done. To try this example,
    launch NetBeans and create a new project called FileHandlingDemo. Replace the
