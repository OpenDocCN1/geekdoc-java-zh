    \n```\nSystem.out.println(\"The value is \" + \\\nnum2.getValue2(3, 9.1));\n```\n\
    \n这是因为在这一语句中，我们尝试为 `num2` 的 `getValue2()` 方法传入值 3 和 9.1。然而，`MyNumberPara` 中 `getValue2()`\
    \ 的声明规定它具有两个 int 参数。因此我们得到了一个错误，因为 9.1 不是 int 类型。尝试删除该语句前的 `//` 并再次运行程序。你会得到一个错误。\n\
    \n# 第12章：项目\n\n恭喜！！我们来到了书的最后一章，我们将一起完成一个项目。太棒了！\n\n在最后一个章节，我们将通过编写一个完整的控制台应用程序来尝试你刚刚学的不同概念。\n\
    \n准备好了吗？\n\n# 12.1 概述\n\n对于这个项目，我们将为一个健身中心编写一个基础会员管理程序。该健身中心有三个分支机构：水星俱乐部（Club\
