    \nThis is because the class that implements this interface (MyClass) did not implement\
    \ the new method. A class that implements an interface must implement all the\
    \ abstract methods in the interface. Hence, if you add an abstract method to your\
    \ interface, you need to ensure that all classes that implement your interface\
    \ implement the new method. This is often impossible to do as you may have no\
