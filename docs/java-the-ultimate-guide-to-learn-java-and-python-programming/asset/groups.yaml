    到目前，你已经涵盖了 Java 程序的基本部分。遗憾的是，我们还没有告诉程序具体需要做什么。


    我们希望程序执行的是传递一条消息。这就是我们所说的程序输出（Program Output）或输出流（Output Stream）。为了让程序传递消息，我们应该使用以下语法：


