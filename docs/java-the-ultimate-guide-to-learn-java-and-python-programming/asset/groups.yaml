    # Chapter Four – Importance of Comments


    The comments in python are strictly for the person reading the code, whether it''s
    you or someone else. It''s a good way to communicate with groups of people what
    the code is supposed to do so that they''re able to collaborate better. However,
    there are two ways you can add comments to python that are universally accepted
    in the programming industry.


    A single line comment is going to start with the # symbol and is terminated by
    the end of the line. Python will ignore all text that comes after the # symbol
    to the end of that line because it views that as not part of the command.


    Comments that will span more than a single line is achieved by inserting a multi-line
    string with """ as the delimiter on either end. They are meant as documentation
    for anyone who is reading the code.


    Let''s take a look at two examples so you can see what I''m talking about.


    ```

    # This is a comment in Python


    print("Hello World") #This is also a comment in Python


    """

    This is an example of a multiline

    comment that spans multiple lines


    """

    ```


    So now you know how to collaborate with others and just keep your code organized
