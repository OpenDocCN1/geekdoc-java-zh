    \ shell 中输入 `python` 命令来启动它。\n\n当你开始交互模式时，它将使用三个大于符号 `>>>` 提示输入以下命令。它在打印第一个提示符之前，会打印一条显示其版本号和版权声明的欢迎消息。\n\
    \n### 交互式\n\n当交互式使用时，每次启动解释器时执行一些标准注释是一个好主意。你可以在设置名为 `PYTHONSTARTUP` 的环境变量时，将其设置为包含启动命令的文件名来实现这一点。这类似于\
    \ Unix shell 的 `.profile` 功能。要将此行添加到你的 `.bashrc` 中：\n\n``````\nexport PYTHONSTARTUP=$HOME/.pythonstartup\n\
    ```\n\n创建或更改 `.pythonstartup` 文件并将 Python 代码放入其中，如下所示：\n\n```python\nimport os\n\
    os.system('ls -l')\n```\n\n如果你使用的是 Linux 机器，按下 Ctrl+D 即可退出交互式提示符。\n\n## 第四章 –\
    \ 注释的重要性\n\nPython 中的注释严格来说是为了阅读代码的人的，无论是你还是别人。这是向他人传达代码意图的一种良好方法，以便他们更好地协作。然而，在\
    \ Python 中添加注释有两种在编程行业中被通用的接受的方法。\n\n单行注释将以 `#` 符号开始，并以行尾结束。Python 将忽略 `#` 符号之后到行尾的所有文本，因为它认为那不是命令的一部分。\n\
    \n跨越单行的注释通过通过插入以 `\"\"\"` 为端分隔符的多行字符串来实现。它们旨在为任何阅读代码的人提供文档说明。\n\n让我们来看两个例子，这样你就能明白我在说什么了。\n\
    \n```python\n# 这是 Python 中的一个注释\n\nprint(\"Hello World\") # 这也是 Python 中的一个注释\n\
    \n\"\"\"\n这是一个跨越多行的\n多行注释示例\n\n\"\"\"\n```\n\n现在你已经知道如何与他人协作，以及如何通过注释为自己的代码保持整洁，让我们来看看\
    \ Python 的 docstrings（文档字符串字符串）。\n\n## 第五章 - Python Docstrings\n\nDocstrings（或\
    \ Python 文档字符串）提供了一种将文档与 Python 函数、模块、方法和类关联的良好方法。对象的 docstring 由对象定义中第一条语句的字符串常量组成。\n\
    \n在用于记录特定代码的源代码中指定了它。与普通的源代码注释不同，docstring 应该是对函数“做什么”的描述，而不是“如何做”。所有函数都需要有一个\
    \ docstring。\n\n这使得程序可以在运行时检查内容，例如，作为交互式帮助系统或元数据。你可以使用对象上的 `doc` 属性来访问 docstring。\n\
    \n## 它应该看起来像\n\ndocstring 行将以大写字母开头并以句号结束。第一行将是简短描述。不要写你的对象的名称。如果文档字符串有多行，第二行应该是空的，这样在视觉上将摘要与描述的其余部分隔离开。其余部分是一个或多个段落，描述了对象的调用约定以及任何其他重要内容。\n\
    \n这是一个例子，你可以看到我在表达什么：\n\n```python\n\"\"\"这是一个简单的docstring示例。\"\"\"\n\ndef my_function():\n\
    \    \"\"\"这是一个更复杂的\n    docstring。\n    它可以包含多个行\n    并提供更多细节。\n    \"\"\"\n\
    \    pass\n```\n"
