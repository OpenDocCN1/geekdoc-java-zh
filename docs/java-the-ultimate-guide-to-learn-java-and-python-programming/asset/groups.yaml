    True\n>>> False or False\nFalse\n```\n\n记住，内置的布尔类型只有两个可能的答案：True 或 False。现在你已经了解更多关于布尔值以及如何使用它们，让我们聊聊\
    \ Python 运算符。\n\n## 第八章 - Python 运算符\n\n有几种不同的运算符。有算术运算符、比较运算符和逻辑运算符。让我们更详细地查看每一个。\n\
    \n## 算术运算符\n\nPython 有模运算 `-`、`+`、`/`、`%` 和 `**` 运算符。假设变量 'a' 的值为十，变量 'b' 的值为二十。因此：\n\
    \n+ * +\n  a+b=30\n-\n  a-b=-10\n*\n  a*b=200\n/\n  b/a=2\n%\n  b%a=0\n**\n  a**b=10^20\n\
    //\n  9//2=4\n\n## 比较运算符\n\n普通的比较运算符如 `==`、`<`、`>=` 以及其他用于各种类型的值。字符串、数字、映射和序列都可以进行比较。下面的项目符号将为您展示比较运算符列表。\n\
