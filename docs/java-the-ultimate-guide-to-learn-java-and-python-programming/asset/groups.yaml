    # Introduction


    Python can be used for a wide variety of projects, and there’s a reason many programmers
    will reach for Python before they reach for any other programming language. Python
    can be used for web applications, automating tasks on systems, finding colors
    in images, and so many other different programming tasks!


    Python is a general-purpose programming language that was created in the late
    80’s, and it was named after the infamous Monty Python. It''s used by thousands
    of programmers to do anything from testing microchips at Intel to building video
    games with a PyGame library. It’s a small language that resembles the English
    language and has hundreds of third-party libraries that already exist.


    There are two main reasons as to why programmers will choose Python many different
    programming languages.


    The first reason is readability. Because it’s so close to the English language,
    using words as ‘not’ and ‘in’ make it that you can read a script out loud and
    not feel like you’re reading some long-forgotten language. This is also helped
    by the strict punctuation rules in Python that you don’t curly braces all over
    the code.


    In addition, Python has some set rules, known as PEP 8, that tell Python developers
    how to format their code. This means you will always know where to put new lines
    and every code that you pick up from someone else will look similar and be just
    as easy as yours to read. That makes for some very easy collaboration between
    developers!


    The second reason is that there are preexisting libraries for almost anything
    you want to do in Python. The language has been around for over twenty years,
    so there are many programmers out there who have mastered the language and know
    how to write what you want. So if you find yourself in doubt, try to find someone
    else who has already done it!


    So the main reasons why you should learn Python are that it’s simple and it’s
    easy for you to collaborate with others in order to hone your skills. So let’s
    get started!


    # Chapter One – Setting up Python


    When it comes to programming in python, the first thing you should know is that
    python is already installed on many of the operating systems. Most operating systems,
    other than Windows, already come with Python installed by default. If you want
    to check to be sure it’s installed on your computer, open the command line by
    running the terminal program, and type in ‘python -V’.


    ![](img/1e6b92f696f2143809e63d4be77e665e_98_0.png)


    If you see version information then Python is already installed on your computer.
    However, if you get the ‘bash: python: command not found’ then it is not installed.


    # Installation


    The first step is to go to www.python.org/downloads and download the installer
    for your operating system. Once the installer is downloaded, follow the instructions.
    Make sure to check the box that says "Add Python to PATH" during installation.
    This will allow you to run python from the command line.


    # Interpreter


    The Python interpreter is a program that executes Python code. You can use it
    interactively by typing `python` in your terminal. This will open a prompt `>>>`
    where you can type Python code line by line and see the results immediately.


    ![](img/1e6b92f696f2143809e63d4be77e665e_99_0)


    # How to Run Programs


    To run a Python script, you can save your code in a text file with a .py extension
    and then run it from the command line using the command `python filename.py`.


    # Text Editor


    There are many text editors you can use to write Python code, ranging from simple
    editors like Notepad or TextEdit to integrated development environments (IDEs)
    like PyCharm or VS Code.


    # Beginning Writing


    To write your first program, create a new file named `hello.py` and type `print("Hello,
    World!")`. Run the program to see the output printed on your screen.


    # Chapter Two – Variables


    Variables the characters you''re able to use in Python. You can use any letter,
    every number, and every special character, but you cannot start with a number.
    White spaces and the signs with special meanings like + and – are not allowed.


    Either capital or lowercase letters are allowed, but most prefer to use lowercase
    letters in order to keep it all uniform. Variables names are case sensitive, and
    python is typed dynamically, so that means you don''t need to declare what type
    every variable is. In python, the variables are placeholders for texts and numbers,
    so it has to have a name in order to find it again.


    The variable is assigned with an equal sign, followed by the value of your variable.
    There are a few reserved words in python that you cannot use for your variable.
    It''s also important to know that variables can be changed later on if you need
    to.


    For example, you can use these variables for numbers and create this formula:


    - foo = 10

    - bar = foo + 10


    Here are a few different variable types to get started.


    | # integer | X = 123 |

    | # long integer | X = 123L |

    | # double float | X = 3.14 |

    | # string | X = "hello" |

    | # list | X = [0,1,2] |

    | # tuple | X = (0,1,2) |

