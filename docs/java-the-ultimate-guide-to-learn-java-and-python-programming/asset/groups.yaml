    \n# Introduction\n\nThe company behind the Java programming language is the Sun\
    \ Microsystems. The language was initially introduced in the year 1991. It was\
    \ developed by a team of people consisting Mike Sheridan, Ed Frank, Chris Warth,\
    \ Patrick Naughton, and James Gosling. Due to its object-oriented nature, the\
    \ Java language can be reused with regards to data focus, classes creation, written\
    \ instructions, and the creation of both instances and objects.\n\n# The Four\
    \ Java Platforms\n\nThere are four primary platforms in the Java programming language.\
    \ They are as:\n\n- Java Standard Edition (Java SE)\n- Java Enterprise Edition\
    \ (Java EE)\n- Java Micro Edition (Java ME)\n- JavaFX\n\nJava-based applications\
    \ that were being used for computer software were developed on the standard edition\
    \ of Java. Java-based applications for web servers were developed on the enterprise\
    \ edition while Java-based applications for multimedia platforms were developed\
    \ on JavaFX. Most JavaFX-based applications are what we usually call flash players.\
    \ Lastly, Java-based applications for mobile devices were developed on the micro\
    \ edition Java platform. The following IDEs that you can use:\n\n# Tools for Beginners\n\
    \nIn order to begin your journey to the world of Java programming, you need to\
    \ choose which IDE to use. IDE, also known as Integrated Development Environment,\
    \ serves as your workspace in writing Java applications. Imagine it as your notepad\
    \ in writing HTML codes. However, IDEs were specifically designed for the Java\
    \ language which means it features all the tools you might need in Java development.\n\
    \nHere are the IDEs you can use:\n\n- BlueJ – this is an ideal IDE for beginners.\
    \ You can easily navigate to its simplistic interface. It was also originally\
    \ designed to help beginners in familiarizing the primary concepts of the Java\
    \ language.\n- DrJava – this is a lightweight IDE. Similar to BlueJ, DrJava was\
    \ also designed for beginners. Although it features a simplistic user interface,\
    \ DrJava has enough tools that every advanced Java developer can use as well.\n\
    - Eclipse – one of the popular IDEs today, the Eclipse is an open source platform\
    \ with responsive navigation and design. Apparently, it has the clean user interface\
    \ compared to other IDEs in this list.\n- NetBeans – this is another popular IDE\
    \ which is commonly used in Java development nowadays. This is highly recommended\
    \ for beginners due to its fast and powerful tools that are compatible in all\
    \ platforms of the Java language.\n\nEach IDE has a unique user interface and\
    \ ease of navigation. Feel free to use any IDE where you feel most comfortable\
