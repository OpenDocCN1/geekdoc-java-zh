    # 引言


    Python 可用于各种项目，许多程序员在选择任何其他编程语言之前选择 Python 是有原因的。Python 可用于 Web 应用程序、系统任务自动化、查找图像颜色以及许多其他不同的编程任务！


    Python 是一种通用编程语言，创建于 20 世纪 80 年代后期，以臭名的 Monty Python（蒙提蟒剧团）命名。成千上万的程序员使用它完成从在英特尔测试微芯片到使用
    PyGame 库构建视频游戏的任何工作。它是一门类似于英语的小型语言，并且已经存在数百个第三方库。


    程序员在许多不同的编程语言中选择 Python 主要有两个原因。


    第一个原是可读性。因为它非常接近英语，使用 `not`（不）和 `in`（在……之中）等单词使得你能够大声读出脚本，而不会觉得像在读某种被遗忘已久的语言。Python
    极其严格的标点符号规则也有助于此，你不需要在代码中到处写大括号。


    此外，Python 有一些被称为 PEP 8 的设定规则，告诉 Python 开发者如何格式化代码。这意味着你将始终知道在哪里换行，而且你从别人那里获取的每段代码看起来都很相似，并且和你的代码一样易读。这使得开发者之间的协作变得非常容易！


    第二个原因是，对于你想在 Python 中做的几乎任何事情，都有预先的库。这门语言已经存在了二十多年，因此有很多程序员已经精通这门语言，并知道如何编写你想要的内容。所以，如果你自己有疑问，尝试找另一个已经做过的人吧！


    所以，你应该学习 Python 的主要原因是它简单，而且你很容易与其他人合作来磨练你的技能。让我们开始吧！


    # 第一章 – 配置 Python


    在涉及 Python 编程时，你应该知道的第一点是，许多操作系统已经安装了 Python。除了 Windows 之外，大多数操作系统都默认安装了 Python。如果你想确认你的电脑是否安装了它，请运行终端程序打开命令行，并输入
    `python -V`。


    ![](img/1e6b92f696f2143809e63d4be77e665e_98_0.png)


    如果你看到版本信息，说明你的电脑已经安装了 Python。然而，如果你得到 `bash: python: command not found`，说明尚未安装。


    # 安装


    第一步是去 www.python.org/downloads 下载适用于你操作系统的安装程序。下载完成后，按照说明进行操作。在安装过程中，务必勾选“Add
    Python to PATH”（将 Python 添加到路径）。这将允许你从命令行运行 python。


    # 解释器


    Python 解释器是一个执行 Python 代码的程序。你可以通过在终端中输入 `python` 来交互式使用它。这将打开一个提示符 `>>>`，你可以在其中逐行输入
    Python 代码并立即看到结果。


    ![](img/1e6b92f696f2143809e63d4be77e665e_99_0)


    # 如何运行程序


    要运行 Python 脚本，你可以将代码保存为带有 `.py` 扩展名的文本文件，然后在命令行中使用命令 `python filename.py` 运行。


    # 文本编辑器


    有很多文本编辑器可以用来编写 Python 代码，从简单的记事本或 TextEdit 到像 PyCharm 或 VS Code 这样的集成开发环境 (IDE)。


    # 开始编写


    要编写你的第一个程序，创建一个名为 `hello.py` 的新文件并输入 `print("Hello, World!")`。运行程序即可在屏幕上看到输出。


