    ## Project Creation


    The first step in writing your Java program is to start a new empty project in
    your chosen IDE. You can do this by navigating through the top most toolbar as
    follows:


    File -> New Project


    After selecting New Project, a new window will appear where you will be able to
    choose from a list of categories. Under the Categories list, select Java and then
    select Java Application from the adjacent window panel. Afterward, click on the
    Next button and you will be asked for the project name and the location where
    you want to save your project.


    Always remember the project name since you will be asked to go back to the same
    project along the way.


    ## Main Class Creation


    After the creation of a new project, the IDE will automatically create both the
    package and the main class. Packages, also known as source packages, serve as
    folders where you can efficiently organize all assets of the Java project such
    as classes and instances. Take note, however, that packages are simply identifiers
    for the organization of assets. Consider them as folders in your computer where
    you organize your files accordingly.


    There should be a main class under the package. If the IDE did not automatically
    create the main class, then you can create it by navigating on the main menu as
    follows:


    File -> New File -> Java Class


    The main class has its vital role in a Java program. The main method, which is
    what initially executed when opening a Java program, is contained in the main
    class. In other programming languages, the main method is known as the entry point.


    ## Writing the Package Statement


    Now that we already have the main class in our Java project, we are now ready
    to write our first Java programming language line – the package statement. This
    statement is an optional part of the program and is only introduced to you for
    learning purposes. This is written using the following syntax:


    ```

    package [package name];

    ```


    The IDE will automatically look for the default package if this line is not written.
    In other words, the package statement might come in handy if you are working on
    a Java project with multiple packages. Keep in mind that package name must match
    with the name of the package where the class you belongs to. Let us say, for instance,
    that the name of your package is “javatestproject”. The syntax should look like
    this in your IDE:


    ```

    1

    2 package javatestproject;

    ```


    ## Writing the Class Declaration


    Next to the package statement is the class declaration. The syntax we need to
    follow here is this:


    ```

    [access modifier] class [class name]

    ```


    There are two kinds of access modifiers that you can use: public and private.
    The private modifier prevents the other classes from accessing the declared class
    while the public modifier allows other classes to access the declared class. For
    the meantime, let us focus and use the public as our access modifier for our first
    Java application.


    Class name, as what the name suggests, is the name you designated to the main
    class. Take note that the Java programming language is case sensitive so make
    sure that you name of the main class with correct upper case and lower case characters.
    Let us say that the name of our main class is “TestProject”, then this is what
    we should have right now:


    ```

    1

    2 package javatestproject;

    3

    4 public class JavaTestProject {

    5

    6 }

    7

    ```


    The open ( { ) and close ( } ) curly braces refer to the opening and closing of
    a Java code block. This helps the program in determining where a certain block
    of code begins and where it ends.


    ## Writing the Main Method


    Now that we are done declaring the class, it is now time to declare the main method
    for our first program. In our main method, we will be using two keywords: void
    and static.


    The void keyword signals the Java Virtual Machine, also known as JVM, that the
    program successfully ran and finished. The keyword static signals the program
    that the field refers to the class and neither the objects nor the instances in
    it. In other words, the program will be able to freely go through the class without
    creating instances in that class. Due to the nature of the main method to act
    as the program’s entry point, it is essential to declare it as static. Hence,
    our syntax for the main method declaration should follow this format:


    ```

    [access modifier] static void

    ```


    However, this is not a complete declaration for the main method yet. We should
    also add the parameter “main(String[] args)” to allow the program in executing
    command-line arguments. And so, our final code for the main method should look
    like this:


    ```

    public static void main(String[] args)

    ```


    If added to our line of codes above, our IDE should look like this:


    ```

    1

    2 package javatestproject;

    3

    public class JavaTestProject {

    5

    6 public static void main(String[] args) {

    7

    8 }

    9

    10 }

    11


    ## Writing the Program Output


    As of now, you already covered the basic parts of our Java program. Unfortunately,
    we are not yet telling the program what exactly it needs to do.


    What we want for the program to execute is to deliver a message. This is what
    we call as the Program Output or Output Stream. In order for the program to deliver
    a message, we should use the following syntax:


    ```

    System.out.print("message");

    ```


    Instead of the parameter "print", you may replace it with "println". This will
    print the output to a new line. Hence, the alternative format should look like
    this:


    ```

    System.out.println("message");

    ```


    Let us now tell the program to print "Java is Awesome!" using the command above.
    Our syntax should be:


    ```

    System.out.println("Java is Awesome!");

    ```


    And so, our IDE should look like this once we insert the output:


    ```

    1

    2 package javatestproject;

    3

    4 public class JavaTestProject {

    5

    6 public static void main(String[] args) {

    7

    8 System.out.println("Java is Awesome!");

    9

    10 }

    11 }

    ```


    ## Allowing User Input


    The Java programming language allows you to let users communicate with the program
    by sending inputs. We can do this by using the built-in class known as the Scanner.


    The Scanner class collects the user’s input from the computer’s keyboard. It stores
    the collected data into variables that can also be executed in the program’s output
    stream. In order to do this, we need to add the following lines right after the
    package statement:


    ```

    import java.util.Scanner;

    ```


    This is an example of an import statement which signals the program to import
    the Scanner class from the built-in Java package known as java.util. This is where
    we add them in our IDE:


    ```

    package javatestproject;

    import java.util.Scanner;

    ```


    ##


    This, however, does not do anything yet. We need to assign a variable name to
    the scanner class first in order to call the scanner’s collected data into our
    output stream. We can assign a variable name to the scanner class by using the
    following statement:


    ```

    Scanner [variable name] = new Scanner(System.in);

    ```


    You can assign any name to the variable. It is a common practice to start the
    name with an uppercase character followed by lowercase characters. It is also
    a good practice to separate words by using uppercase characters. Let us say we
    want to name our scanner variable as “userinput”. Instead of writing the entire
    variable name in lowercases, replace the first letters of the words “user” and
    “input” to uppercases. Hence, the statement will look like this:


    ```

    Scanner UserInput = new Scanner(System.in);

    ```


    We should insert the statement within the blocks of code after the declaration
    of the main method. Hence, IDE should be as follows:

