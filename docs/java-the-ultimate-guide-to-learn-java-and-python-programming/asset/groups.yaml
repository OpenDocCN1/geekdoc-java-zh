    Docstrings, or python documentation strings, provide a nice way to associate documentation
    with python functions, modules, methods, and classes. An object''s docstring is
    made up of a string constant as the first statement in the definition of the object.


    It''s specified in the source code that''s used to record a specific piece of
    code. Unlike regular source code comments, the docstring should be a description
    of what the function does rather than how. All functions need to have a docstring.


    This lets the program inspect the content during run time, for example, as an
    interactive help system or as metadata. You can use the doc attribute on objects
    to access the docstring.'
