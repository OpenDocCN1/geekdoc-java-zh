    # Chapter Ten - Exception Handling in Python


    Before you get into what you can do with exceptions, you first have to know what
    they are. An exception is an error that occurs while a program is running. When
    that error happens, Python will generate an exception that can be used in order
    to avoid crashing the program.


    Exceptions are convenient for handling special conditions and errors in programs.
    When you believe you have a code that is able to produce an error, then you can
    put in an exception handle. You can raise this exception on your own with the
    raise exception declaration. Rising an exception will break the current code execution
    and return the exception to the previous code until it can be handled.


    Here are some comon errors you might see in your program


    +   * IOError – the file is unable to be opened.

    * ImportError – Python is not able to find the module.

    * ValueError – this is brought up when a built-in operation or function obtains
    an argument that might have the right type but not the right value.

    * KeyboardInterrupt – This is brought up when the user will hit the interrupt
    key on the keyboard, this is usually the Cntrl – C or Del keys.

    * EOFError – this comes up when one of the built-in functions, input() or raw_input()
    gets to an end-of-file conditions or EOF without scanning the data.'
