    \n![](img/1e6b92f696f2143809e63d4be77e665e_11_0.png)\n\n# 引言\n\nJava 编程语言后的公司是\
    \ Sun Microsystems。该语言最初于 1991 年引入。由 Mike Sheridan、Ed Frank、Chris Warth、Patrick\
    \ Naughton 和 James Gosling 组成的团队开发。由于其面向对象的特性，Java 语言在数据关注、类创建、编写指令以及实例和对象的创建方面是可以被重用的。\n\
    \n# 四大 Java 平台\n\nJava 编程语言中有四个主要平台。它们分别是：\n\n- Java 标准版 (Java SE)\n- Java 企业版\
    \ (Java EE)\n- Java 微型版 (Java ME)\n- JavaFX\n\n用于计算机软件的 Java 应用是在 Java 的标准版上开发的。用于\
    \ Web 服务器的 Java 应用是在企业版上开发的，而用于多媒体平台的 Java 应用是在 JavaFX 上开发的。大多数基于 JavaFX 的应用就是我们通常所说的\
    \ Flash 播放器。最后，用于移动设备的 Java 应用是在微型版 Java 平台上开发的。你可以使用以下 IDE：\n\n# 初学者工具\n\n为了开启你的\
    \ Java 编程之旅，你需要选择使用哪种 IDE。IDE，也称为集成开发环境，是你是在编写 Java 应用时的工作空间。把它想象成你编写 HTML 代码时的记事本即可。然而，IDE\
    \ 是专为 Java 语言设计的，这意味着它具备了你在 Java 开发中可能需要的所有工具。\n\n以下是你可以使用的 IDE：\n\n- BlueJ –\
    \ 这是一个非常适合初学者的 IDE。你可以轻松地导航到它简单的界面。它最初的设计初衷也是为了帮助初学者熟悉 Java 语言的基本概念。\n- DrJava\
    \ – 这是一个轻量级 IDE。与 BlueJ 类似，DrJava 也是为初学者设计的。尽管它具有简单的用户界面，但 DrJava 拥有足够每个高级 Java\
    \ 开发者都可以使用的工具。\n- Eclipse – 当今流行的 IDE 之一，Eclipse 是一个具有响应式导航和设计的开源平台。显然，与列表中的其他\
