    # Classes, Instances, and Objects


    The classes, instances, and objects are the three vital elements of a program
    created using an object-oriented language such as the Java. In order to understand
    these three, you need to first look at their relationship from one another.


    Classes are the highest and they cover everything in Java programming language.
    Specific elements in a class are called Objects. Once you add the additional specification
    to an Object, then it becomes an Instance.


    In an analogy, for instance, let us say our class here is the animal. Under animal
    class, we have different kinds of animals like dogs, cats, birds, and so on. These
    are the objects under animal class. Under the category of dogs, we have different
    breeds like poodles, golden retrievers, Labradors, and so on. These are the instances
    of the object dogs.'
