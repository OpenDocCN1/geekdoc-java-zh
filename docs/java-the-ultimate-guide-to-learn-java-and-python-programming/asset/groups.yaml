    # Writing the Main Method


    Now that we are done declaring the class, it is now time to declare the main method
    for our first program. In our main method, we will be using two keywords: void
    and static.


    The void keyword signals the Java Virtual Machine, also known as JVM, that the
    program successfully ran and finished. The keyword static signals the program
    that the field refers to the class and neither the objects nor the instances in
    it. In other words, the program will be able to freely go through the class without
    creating instances in that class. Due to the nature of the main method to act
    as the program’s entry point, it is essential to declare it as static. Hence,
    our syntax for the main method declaration should follow this format:


    ```

    [access modifier] static void

    ```


    However, this is not a complete declaration for the main method yet. We should
    also add the parameter “main(String[] args)\” to allow the program in executing
    command-line arguments. And so, our final code for the main method should look
    like this:


    ```

    public static void main(String[] args)

    ```


    If added to our line of codes above, our IDE should look like this:'
