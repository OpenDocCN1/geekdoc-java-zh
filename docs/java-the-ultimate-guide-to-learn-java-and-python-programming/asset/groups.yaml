- md: "\n## Boolean Strings\n\nA string can be tested for truth value. The return\
    \ type is to be in Boolean value or True or False. Let's take a look at an example.\
    \ First, create a new variable and assign it a value.\n\n```python\nnumberone_string\
    \ = \"Hello World\"\nnumberone_string.isalnum()\nnumberone_string.isalpha()\n\
    numberone_string.isdigit()\nnumberone_string.istitle()\nnumberone_string.isupper()\n\
    numberone_string.islower()\nnumberone_string.isspace()\nnumberone_string.endswith('d')\n\
    numberone_string.startswith('H')\n```\n\n```python\n#check if all char are numbers\n\
    #check if all char are alphabetical\n#test if string has digits\n#test to see\
    \ if the string has title words\n# test to see if the string has upper case letters\n\
    # test to see if the string has lower case letters\n# test to see if the string\
    \ has spaces\n# test if the string ends with a 'd'\n#test if the string begins\
    \ with 'H'\n```\n\nTo see what the return value would be, print it out.\nnumberone_string=\"\
    Hello World\"\n\n```python\nprint numberone_string.isalnum()      #false\nprint\
    \ numberone_string.isalalpha()    #false\nprint numberone_string.isdigit()   \
    \    #false\nprint numberone_string.istitle()      #true\nprint numberone_string.isupper()\
    \       #false\nprint numberone_string.islower()       #false\nprint numberone_string.isspace()\
    \       #false\nprint numberone_string.endswith('d')   #true\nprint numberone_string.startswith('H')\
    \  #true\n```\n\n## Logical Operator Boolean\n\nThese values tend to respond to\
    \ logical operators and/or\n\n```python\n>>> True and False\nFalse\n>>> True and\
    \ True\nTrue\n>>> False and True\nFalse\n>>> False or True\nTrue\n>>> False or\
    \ False\nFalse\n```\n\nRemember the built-in type of Boolean can have only one\
    \ or two possible answers: True or False. Now that you know a little more about\
    \ Booleans and how to use them let's talk about python operators.\n\n## Chapter\
    \ Eight - Python Operators\n\nThere are a few different types of operators. There's\
    \ arithmetic, comparison, and logical operators. Let's take a look at each one\
    \ in a little more detail.\n\n## Arithmetic Operators\n\nPython has the modulus\
    \ -, +, /, % and ** operators. Assume the variable 'a' has a value of ten and\
    \ variable 'b' has a value of twenty. Therefore:\n\n+ * +\n  a+b=30\n-\n  a-b=-10\n\
    *\n  a*b=200\n/\n  b/a=2\n%\n  b%a=0\n**\n  a**b=10^20\n//\n  9//2=4\n\n## Comparison\
    \ Operators\n\nThe plain comparison operators like ==, <, >=, and the others are\
    \ utilized on all different manner of values. Strings, numbers, mappings, and\
    \ sequences are all able to be compared. The following bullets will show you a\
    \ list of comparison operators.\n\n- < is less than\n- == equal\n- <= less than\
    \ or equal to\n- >= greater than or equal to\n- > greater than\n- <> not equal\n\
    - != not equal\n\n## Logical Operators\n\nThe logical operators and also give\
    \ back a Boolean value when they're used in a decision structure. There are three\
    \ logical operators, or, and, and not. For example, x=0 and x<10 is only true\
    \ if x is greater than 0 and less than 10.\n\nOperator Description:\n\n- and:\
    \ logical AND\n- or: logical OR\n- not: logical NOT\n\nNow that you know about\
    \ operators let's talk more about using math in python.\n\n## Chapter Nine - Using\
    \ Math in Python\n\nThe Python language has the Python interpreter, which is a\
    \ simple development environment known as IDLE, tools, libraries, and documentation.\
    \ It's preinstalled on almost all Linux machines and Mac systems, but it can be\
    \ an older version. In order to begin using the calculator in the Python interpreter,\
    \ type in the following script:\n\n```python\n>>> 2+2\n4\n>>> 4*2\n8\n>>> 10/2\n\
    5\n>>> 10-2\n8\n```\n\n## Counting With Variables\n\nTo put in values in the variables\
    \ to count the area of a rectangle, try this code out:\n\n```python\n>>> length\
    \ = 2.20\n>>> width = 1.10\n>>> area = length * width\n>>> area\n2.4200000000000004\n\
    ```\n\n## Counter\n\nCounters are needed tools in programming in order to increase\
    \ or decrease a value every time it is run. The following code is a counter:\n\
    \n```python\n>>> i = 0\n>>> i + 1\n>>> i\n1\n>>> i = 1 + 2\n>>> i\n3\n```\n\n\
    ## Counting with a While Loop\n\nAnd here's an example of when it's useful to\
    \ use a counter.\n\n```python\n>>> i = 0\n>>> while i < 5:\n    print i\n    i\
    \ = i+1\n\n0\n1\n2\n3\n4\n```\n\nThe above program will count from zero to four.\
    \ Between the world while and the colon, there's an expression that is going to\
    \ be true at first and then.\n\n## Multiplication Table\n\nTo make a multiplication\
    \ table, use the following:\n\n```python\nstart = 1\nmax = 10\nwhile start <=\
    \ max:\n    print(start * start)\n    start += 1\n```\n\nThe output will be:\n\
    \n- 1\n- 4\n- 9\n- 16\n- 25\n- 36\n- 49\n- 64\n- 81\n- 100\n\n## Chapter Ten -\
    \ Exception Handling\n\nBefore you get into what you can do, first you have to\
    \ know what exceptions are. An exception is an error that occurs while running.\n\
    \n## Set Up Exception Blocks\n\nHow does it work?\n\nError handling is handled\
    \ through the use of exceptions that are made in `try` blocks and handled in `except`\
    \ blocks. If your code encounters an error, `try` block execution is going to\
    \ stop and transfer down to the `except` block.\n\nIn addition to using the `except`\
    \ block after the `try` block, you're also able to use the `finally` block. The\
    \ code in this block is going to be executed whether or not the exception happens.\
    \ Let's take a look at some code to see what will happen when you do not use error\
    \ handling in a program.\n\n### Code Example\n\nThis program is going to ask the\
    \ user to input a number between one and ten and then print that number.\n\n```python\n\
    number = int(raw_input(\"Enter number between 1-10\"))\nprint \"you entered number\"\
    , number\n```\n\nThis program will work just as long as the user enters the number,\
    \ but what happens if they put in something else, like a string?\nEnter a number\
    \ between 1-10\nhelo\n\nYou can see that the program will throw an error when\
    \ the string is entered.\nTraceback (most recent call last):\n\n```\nFile \"enter_number.py\"\
    , line 1, in\nnumber = int(raw_input(\"Enter number between 1-10\\n\"))\n\nvalueerror:\
    \ invalid literal for int() with base 10: 'hello'\n```\n\nThe ValueError is a\
    \ type of exception. Now let's see how you can utilize exemption handling to repair\
    \ the aforementioned program.\n\n```python\nimport sys\n\ntry:\n    number = int(raw_input(\"\
    Enter a number between 1-10 \\n\"))\nexcept valueerror:\n    print \"Only numbers\
    \ are accepted.\"\nsys.exit()\n```\n\nprint \"you entered number \\n\", number\n\
    \nIf you now start the program and input a string in lieu of amounts, you can\
    \ see that you'll get a different\n"
  mdcn: "\n\n## 布尔字符串\n\n可以对字符串的真值进行测试。返回类型应为布尔值或 True 或 False。让我们来看一个例子。首先，创建一个新变量并给它赋值值。\n\
