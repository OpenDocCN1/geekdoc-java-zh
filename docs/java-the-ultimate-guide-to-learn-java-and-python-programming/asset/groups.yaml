    # Writing the Class Declaration


    Next to the package statement is the class declaration. The syntax we need to
    follow here is this:


    ```

    [access modifier] class [class name]

    ```


    There are two kinds of access modifiers that you can use: public and private.
    The private modifier prevents the other classes from accessing the declared class
    while the public modifier allows other classes to access the declared class. For
    the meantime, let us focus and use the public as our access modifier for our first
    Java application.


    Class name, as what the name suggests, is the you designated to the main class.
    Take note that the Java programming language is case sensitive so make sure that
    you name of the main class with correct upper case and lower case characters.
    Let us say that the name of our main class is “TestProject”, then this is what
    should we have right now:'
