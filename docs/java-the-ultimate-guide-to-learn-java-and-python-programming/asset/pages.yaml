  md: '# Introduction


    The company behind the Java programming language is the Sun Microsystems. The
    language was initially introduced in the year 1991. It was developed by a team
    of people consisting Mike Sheridan, Ed Frank, Chris Warth, Patrick Naughton, and
    James Gosling. Due to its object-oriented nature, the Java language can be reused
    with regards to data focus, classes creation, written instructions, and the creation
    of both instances and objects.


    # The Four Java Platforms


    There are four primary platforms in the Java programming language. They are as:


    +   - Java Standard Edition (Java SE)

    - Java Enterprise Edition (Java EE)

    - Java Micro Edition (Java ME)

    - JavaFX


    Java-based applications that were being used for computer software were developed
    on the standard edition of Java. Java-based applications for web servers were
    developed on the enterprise edition while Java-based applications for multimedia
    platforms were developed on JavaFX. Most JavaFX-based applications are what we
    usually call flash players. Lastly, Java-based applications for mobile devices
    were developed on the micro edition Java'
