  md: '# Set Up Exception Handling Blocks


    ![](img/1e6b92f696f2143809e63d4be77e665e_124_0.png)


    In order to use exception handling in Python, first you have to have a catch-all
    except clause. The words ''try'' and ''except'' are Python keywords that programmers
    use in order to catch exceptions.


    For example:


    +   try - except [exception-name] (insert exception) blocks

    The code in the try clause is going to be executed statement by statement. If
    an exception happens, the rest of the block is going to be skipped and the


    except clause is going to be run.

    Try:


    some statements here


    Except:

    exception handling

    So let''s see an example of this.

    try:


    ```

    print 1/0

    except zerodivisionerror:

    print "You can''t divide by zero."

    ```'
