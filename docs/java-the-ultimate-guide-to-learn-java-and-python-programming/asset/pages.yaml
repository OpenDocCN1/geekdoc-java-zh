  md: '# Chapter 3 – Operators


    Since the first chapter, we have been using different operators and the most common
    operator we have used is the assignment operator. It is defined by the equal (=
    ) sign and signals the program to designate a certain value to a variable.


    Aside from the assignment operator, there are five other operators that you use
    to manipulate data in the Java programming language. They are as follows and their
    role as mathematical operators:


    +   • Operator for Addition which is represented by the plus sign (+ ). It commands
    the program to give you the sum of multiple values.


    +   • Operator for Subtraction which is represented by the hyphen sign (- ). It
    commands the program to give you the difference of multiple values.


    +   • Operator for Multiplication which is represented by the asterisk sign (*
    ). It commands the program to give you the product of multiple values.


    +   • Operator for Division which is represented by the slash sign ( / ). It commands
    the program to give you the quotient of multiple values.


    +   • Operator for Remainder which is represented by the percentage sign (% ).
    It commands the program to divide two numerical values and gives you the remainder
    of the numerical values.'
