    # # Introduction


    Learning JPA Programming step by step.


    JPA ( Java Persistence API ) is a powerful framework that can be used to quickly
    build robust data-driven application.


    Most of the data that our applications manipulate have to be stored in data stores,
    retrieved, processed and analyzed. If this data store is a relational database
    and you use an object-oriented programming language such as Java, then you should
    have a look at JPA.'
