  md: "JPA is an Object-Relational Mapping tool that maps Java objects to relational\
    \ databases and allows query operations.\n\nIn this book, you will learn Java\
    \ Persistence API, its annotations for mapping entities.\n\n# JPA Integration\
    \ with spring frameworks.\n\n| Different Scenario (To Apply - Different Types\
    \ of Mapping) | \n| Suppose There is to Two Object Student and Address |\n| Student\
    \ and Address Want to Communicate to each other. |\n| Student want to Access ->\
    \ Details of Address object. |\n| Student want to Access -> Details of Address\
    \ object, AND Address Also want to Access -> Details of Student object. |\n| Then\
    \ How to do this How to Achieve this Scenario |\n| Then there is a Mechanism to\
    \ Achieve this Scenario, through Primary Key and Foreign Key. |\n| If any how\
    \ we will Establish Relationship between Primary Key and Foreign Key then only.\
    \ |\n| Student Top Top |\n| Uni Directional Mapping Bi Directional Mapping |\n\
    | Address Bottom Address Bottom |"
