    \ 多对多可嵌入映射\n\n## 引言\n\n循渐式学习 JPA 编程。\n\nJPA (Java Persistence API) 是一个强大的框架，用于快速构建健壮的数据驱动应用程序。\n\
    \n我们应用程序处理的大部分数据必须存储在数据存储中、检索、处理和分析。如果该数据存储是关系型数据库，且你使用 Java 这样的面向对象的编程语言，那么你应该查看\
    \ JPA。\n\nJPA 是一种对象关系映射（ORM）工具，它将 Java 对象映射到关系型数据库并允许查询操作。\n\n在本书中，你将学习 Java Persistence\
