    \ Exercises with Successful Execution of Exercises with Output Readymade Solution\
    \ With Step By Step Explanation.\n\n# AMIT K\n\n# Contents\n\nBeginners Guide\
    \ to Learn JPA Programming Step by Step\n\nIntroduction\n\n## Chapter 1 : JPA\
    \ One to One Mapping\n\n- 1 Example 1 : JPA OneToOne Mapping\n- 2 Example 2 :\
    \ JPA OneToOne Lazy Load Mapping\n- 3 Example 3 : JPA OneToOne Join Column Mapping\n\
    - 4 Example 4 : JPA OneToOne Primary Key Join Column Mapping\n- 5 Example 5 :\
    \ JPA OneToOne Map Cascade Mapping\n- 6 Example 6 : JPA OneToOne Unidirectional\
    \ Mapping\n- 7 Example 7 : JPA OneToOne Bidirectional Mapping\n\n## Chapter 2\
    \ : JPA One to Many Mapping\n\n- 1 Example 8 : JPA OneToMany Mapping\n- 2 Example\
    \ 9 : JPA OneToMany Join Table Mapping\n- 3 Example 10 : JPA OneToMany Unidirectional\
    \ Mapping\n- 4 Example 11 : JPA OneToMany OrderBy Mapping\n- 5 Example 12 : JPA\
    \ Persist OrderedList Mapping\n- 6 Example 13 : JPA OneToMany Map Key Mapping\n\
    - 7 Example 14 : JPA OneToMany Untyped Mapping\n\n## Chapter 3 : JPA Many to One\
    \ Mapping\n\n- 1 Example 15 : JPA ManyToOne Mapping\n- 2 Example 16 : JPA ManyToOne\
    \ Join Columns Mapping\n- 3 Example 17 : JPA ManyToOne Join Column Mapping\n\n\
    ## Chapter 4 : JPA Many to Many Mapping\n\n- 1 Example 18 : JPA ManyToMany Mapping\n\
    - 2 Example 19 : JPA ManyToMany Join Table Mapping\n- 3 Example 20: JPA ManyToMany\
    \ Bidirectional Mapping\n- 4 Example 21 : JPA ManyToMany Embeddable Mapping\n\n\
    ## Introduction\n\nLearning JPA Programming step by step.\n\nJPA (Java Persistence\
    \ API) is a powerful framework that can be used to quickly build robust data-driven\
    \ application.\n\nMost of the data that our applications manipulate have to be\
    \ stored in data stores, retrieved, processed and analyzed. If this data store\
    \ is a relational database and you use an object-oriented programming language\
    \ such as Java, then you should have a look at JPA.\n\nJPA is an Object-Relational\
    \ Mapping tool that maps Java objects to relational databases and allows query\
    \ operations.\n\nIn this book, you will learn Java Persistence API, its annotations\
    \ for mapping entities.\n\n# JPA Integration with spring frameworks.\n\n| Different\
    \ Scenario (To Apply - Different Types of Mapping) | Suppose There is to Two Object\
    \ Student and Address Student and Address Want to Communicate to each other. |\
    \ Student want to Access -> Details of Address object. |\n| Student want to Access\
    \ -> Details of Address object, AND Address Also want to Access -> Details of\
    \ Student object. | Then How to do this How to Achieve this Scenario Then there\
    \ is a Mechanism to Achieve this Scenario, through Primary Key and Foreign Key.\
    \ | If any how we will Establish Relationship between Primary Key and Foreign\
    \ Key then only. Student Top Top Uni Directional Mapping Bi Directional Mapping\
    \ Address Bottom Address Bottom |\n\n## Chapter 1 : JPA One to One Mapping\n\n\
    - 1 JPA OneToOne Mapping\n- 2 JPA OneToOne Lazy Load Mapping\n- 3 JPA OneToOne\
    \ Join Column Mapping\n- 4 JPA OneToOne Primary Key Join Column Mapping\n- 5 JPA\
    \ OneToOne Map Cascade Mapping\n- 6 JPA OneToOne Unidirectional Mapping\n- 7 JPA\
    \ OneToOne Bidirectional Mapping\n\n## 1 JPA OneToOne Mapping\n\n![](img/d622a8a4a3b3256d5237a818e861f5fe_7_0.png)\n\
    \nHere you will learn how to do one to one map in JPA mapping.\n\nThis example\
    \ assumes that one Person can only be part of one department and one department\
    \ can only have one person.\n\nIn Person entity we mark the Department reference\
    \ property with @OneToOne annotation.\n\n```java\n@Entity\npublic class Person\
    \ {\n  @OneToOne\n  private Department department;\n...\n```\n\nHere is simple\
    \ code to setup the two entities and save them to database.\n\n```\nPerson p1\
    \ = new Person(\"Tom\");\np1.setName(\"Tom\");\n\nDepartment d = new Department();\n\
    d.setName(\"Design\");\np1.setDepartment(d);\n\nem.persist(p1);\nem.persist(d);\n\
    ```\n\n## Example 1 : In example assumes that one Person can only be part of department\
    \ and one department can only have one person.\n\n### Person.java\n\n```java\n\
    package com.abd.jpa;\n\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
    import javax.persistence.GenerationType;\nimport javax.persistence.Id;\nimport\
    \ javax.persistence.OneToOne;\n\n@Entity\npublic class Person {\n  @Id\n  @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
    \  private long id;\n\n  private String name;\n\n  @OneToOne\n  private Department\
    \ department;\n\n  public Person() {}\n\n  public Person(String name) {\n    this.name\
    \ = name;\n  }\n\n  public Long getId() {\n    return id;\n  }\n\n  public void\
    \ setId(Long id) {\n    this.id = id;\n  }\n\n  public String getName() {\n  \
    \  return name;\n  }\n\n  public void setName(String name) {\n    this.name =\
    \ name;\n  }\n\n  public Department getDepartment() {\n    return department;\n\
    \  }\n\n  public void setDepartment(Department department) {\n    this.department\
    \ = department;\n  }\n\n  @Override\n  public String toString() {\n    return\
    \ \"Person [id=\" + id + \", name=\" + name + \"]\";\n  }\n}\n```\n\n### Department.java\n\
    \n```java\npackage com.abd.jpa;\n\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
    import javax.persistence.GenerationType;\nimport javax.persistence.Id;\n\n@Entity\n\
    public class Department {\n    @Id\n    @GeneratedValue(strategy=GenerationType.IDENTITY)\n\
    \    private long id;\n\n    private String name;\n\n    public long getId() {\n\
    \        return id;\n    }\n\n    public void setId(long id) {\n        this.id\
    \ = id;\n    }\n\n    public String getName() {\n        return name;\n    }\n\
    \n    public void setName(String name) {\n        this.name = name;\n    }\n}\n\
    ```\n\n### PersonDaoImpl.java\n\n```java\npackage com.abd.jpa;\n\nimport javax.persistence.EntityManager;\n\
    import javax.persistence.PersistenceContext;\nimport org.springframework.transaction.annotation.Transactional;\n\
    \n@Transactional\npublic class PersonDaoImpl {\n    @PersistenceContext\n    private\
    \ EntityManager em;\n\n    public void test(){\n        Person p1 = new Person(\"\
    Tom\");\n        p1.setName(\"Tom\");\n\n        Department d = new Department();\n\
    \        d.setName(\"Design\");\n        p1.setDepartment(d);\n\n        em.persist(p1);\n\
    \        em.persist(d);\n    }\n}\n```\n\n### Helper.java\n\n```java\npackage\
    \ com.abd.jpa;\n\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.ResultSet;\nimport java.sql.ResultSetMetaData;\nimport java.sql.Statement;\n\
    \npublic class Helper {\n    public static void checkData() {\n        try{\n\
    \            Class.forName(\"com.mysql.jdbc.Driver\");\n            Connection\
    \ conn = DriverManager.getConnection(\"jdbc:mysql://localhost/db1\", \"root\"\
    , \"root\");\n            Statement st = conn.createStatement();\n\n         \
    \   ResultSet mrs = conn.getMetaData().getTables(null, null, null, new String[]\
    \ { \"TABLE\" });\n            while (mrs.next()) {\n              String tableName\
    \ = mrs.getString(3);\n              System.out.println(\"\\n\\nTable Name: \"\
    \ + tableName);\n            }\n\n            ResultSet rs = st.executeQuery(\"\
    select * from \" + tableName);\n            ResultSetMetaData metadata = rs.getMetaData();\n\
    \            while (rs.next()) {\n              System.out.println(\" Row:\");\n\
    \            }\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### persistence.xml\n\n```xml\n<?xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n<persistence version=\"1.0\"\nxmlns=\"http://java.sun.com/xml/ns/persistence\"\
    \ \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/persistence http://java.sun.com/xml/ns/persistence/persistence_1_0.xsd\"\
    >\n\n<persistence-unit name=\"jpaData\" />\n\n</persistence>\n```\n\n### applicationContext.xml\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
    \nxmlns:aop=\"http://www.springframework.org/schema/aop\" \nxmlns:context=\"http://www.springframework.org/schema/context\"\
    \nxmlns:security=\"http://www.springframework.org/schema/security\"\nxmlns:tx=\"\
    http://www.springframework.org/schema/tx\" \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi:schemaLocation=\"http://www.springframework.org/schema/aop http://www.springframework.org/schema/aop/spring-aop-3.2.xsd\n\
    \                              http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-3.2.xsd\n\
    \                              http://www.springframework.org/schema/context http://www.springframework.org/schema/context/spring-context-3.2.xsd\n\
    \                              http://www.springframework.org/schema/tx http://www.springframework.org/schema/tx/spring-tx-3.2.xsd\"\
    >\n\n<tx:annotation-driven />\n<context:annotation-config />\n\n<bean id=\"personDao\"\
    \ class=\"com.abd.jpa.PersonDaoImpl\" />\n\n<bean id=\"dataSource\" class=\"org.springframework.jdbc.datasource.DriverManagerDataSource\"\
    \ />\n\n</beans>\n```\n"
