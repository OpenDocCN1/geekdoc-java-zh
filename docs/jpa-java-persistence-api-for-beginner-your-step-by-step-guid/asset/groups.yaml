    \ Map 级联映射\n- 6 JPA 对一单向映射\n- 7 JPA 对一双向映射\n\n## 1 JPA 对一映射\n\n![](img/d622a8a4a3b3256d5237a818e861f5fe_7_0.png)\n\
    \n在这里，你将学习如何在 JPA 中实现对一映射。\n\n示例假设一个 Person 只能有一个 department。\n\n在 Person 实体中，使用\
    \ @OneToOne 注解标记 Department 属性。\n\n```java\n@Entity\npublic class Person {\n \
