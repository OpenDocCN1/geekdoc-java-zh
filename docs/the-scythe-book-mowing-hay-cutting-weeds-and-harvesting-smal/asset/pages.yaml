    Much as the fibers of wood are penetrated easier by an ax or chisel on a diagonal,
    less force is required to sever the stems of grasses if the edge approaches them,
    not straight across, but on an angle and in the direction away from the point
    of attachment. A scythe blade with a flat primary bevel will cut grass, if it
    is well honed. However, an edge as discussed above will cut with more ease....
    This should clarify that the peening of scythe blades is still the best way to
    bevel them—not because it is traditional but because it works.


    # THE QUESTION OF “THIN”


    The Austrians use an expression “a good scythe blade must run over the thumb-nail.”
    What is meant is if the thumbnail is made carefully, with upward pressure, underneath
    the edge for an inch or two, one can see the metal deflect slightly sideways and
    create a running wave. (This effect can also be seen, less distinctly, if the
    thumbnail is merely roked sideways at one point than actually moved along. Safety-oriented
    individuals can use the rim of an anvil or the edge of a natural stone to do this
    test.)


    It is a poignant description of the high standards required by the mower of old
    and catered to by the skill of the scythemith. Only a quality tool can'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'retain such an edge during extended use. However, I do not recommend an edge
    this thin for many situations. One must first have an understanding that, as such,
    it is akin to a chisel or plane blade delicately shaped for the purpose of taking
    paper-thin shavings off clear wood. The careful woodworker would not run such
    an edge forcefully into a knot—or if he did, he would pay for it with a damaged
    tool. Can we learn to use our scythe blades as a craftsman uses chisels?


    A sensible mower in fields clear of rocks would certainly appreciate the above-discussed
    edge.


    The “knots” that threaten the scythe blades are inherently very tough plants,
    or more, those that early in the season or seed stage will crumble the “perfect
    edge.” To cut such material (and it would limit the scythe’s usefulness if we
    did not) we must back off the potentially penetrating shape to one with a greater
    degree of durability. Exactly what degree is grasped as we use the tool with awareness
    and gain **“The Mower’s Sense.”**


    Listed below are examples of *some* of the cases in which I do not want an edge
    so very thin:


    +   1. A good portion of the general field mowing on our farm in August when some
    of the large goldenrod species, often growing in clumps of up to a dozen stems,
    are in full bloom.

    2. Orchards containing plum or pear species prone to send up suckers some distance
    from the main trunk.

    3. Very rocky areas.

    4. Unfamiliar yards where I might expect to find, with the blade, objects other
    than plant material.


    For these tasks a blade nearly ready for re-beveling may be just fine honed more
    frequently. In addition, one can switch to a coarser whetstone.


    The best purpose-specific edge, however, is still one with its underside flat,
    the top bevel shorter and, of course, not so thin overall; in other words, somewhat
    thicker than one which easily “runs over the thumbnail but'
