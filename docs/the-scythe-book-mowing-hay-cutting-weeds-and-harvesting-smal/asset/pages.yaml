  md: '![](img/27a09e01dbd329ab631e901469ce4b29_162_0.png)


    The snath does not need to start, nor during honing remain, in a vertical position.
    Placing its end on the ground in such a way that the blade’s angle allows one
    to carry out the honing in a comfortable manner will help to maintain the desired
    stone-to-blade angle and thus improve efficiency.


    My somewhat unusual personal technique lies in that I continue the honing directly
    in front of me while allowing the blade to move gradually to the left by the “creeping”
    of the fingers of my left hand along the rib of the blade. This works well because
    the left hand is always very near to where the stone is just then contacting the
    edge in order to give steadying support where it is needed. There is no periodic
    pause and re-gripping. Being creative, you will find the way that works best for
    you.


