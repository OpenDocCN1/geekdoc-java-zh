  md: '# VII

    Honing in the Field


    IN ORDER TO MAINTAIN AN EASY-CUTTING BLADE IN THE FIELD, IT NEEDS TO BE whetted
    at very frequent intervals. Depending on the innate toughness of the plants and
    their maturity, as well as the time of day (see Page 148), my average is after
    each 5 minutes of mowing. It takes me approximately 15 to 20 seconds, excluding
    the wiping of the blade, which should precede each honing session. I rarely make
    more than one complete “pass” (from beard to point), applying the stone in short,
    overlapping and alternating strokes and using only the action of my wrist. It
    is fast and has a nice flow to it, though learning it is easier to concentrate
    on one side at a time.


    It should be by now clear that the focus is the honing of the top side (the one
    with the primary bevel). The main purpose of the stone’s use on the underside
    of the blade is to remove or line up the “burr.” Mindful of this, I apply twice
    the pressure with the stone against the beveled side, even though an observer
    might not notice it. Approach delays the inevitable rounding of the edge’s underside,
    i.e. the creating of the short “back bevel.”


    Figure 9 represents three basic examples of the “stone-to-blade” angles. The considerations
    can, in fact, become a lot more complicated (like that of woodworkers’ chisel
    bevel angles) because, apart from understanding the nature of the material being
    cut, the angles depend on exactly how much “hollow-ground” effect was put on the
    edge during peening as well as the curve incorporated into the blade’s body by
    the scythemith.'
