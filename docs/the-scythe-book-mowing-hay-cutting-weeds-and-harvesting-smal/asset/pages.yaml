  md: '# WHETTING


    > Anew with merry stave and jest

    The shrieking hone we ply.


    > WILLIAM ALLINGHAM, THE MOWERS, 1865


    Wetting with a stone gives the blade its even razor-sharpness, and is repeated
    at intervals during the work. You mow once around the hayfield, or let us say
    you mow fifteen minutes'' worth, then stop for thirty seconds or a minute to whe
    the blade. Seen from the tradition of the hard stamped blade, which never got
    as sharp as the hammered blade, and only slowly lost the sharpness it had, this
    pause is thought lazy. However, the higher-quality blade repays this periodic
    attention to its sharpness with a much more thorough cut requiring less effort.
    The routine sharpening is not time wasted, since the mower starts afresh with
    a better tool. Using a dull blade encourages more violent swings of the scythe
    to the cutting—this is tiring and potentially dangerous. The two quotes at the
    beginning of the chapter show a conflict in attitude about how much time should
    be spent sharpening; but I prefer to sharpen as often as I can break the trance
    of mowing. This may be fifteen minutes.


    Historically, whetstones were cut from natural outcrops of the right sort of rock.
    Since the advent of 1906 of mass-produced and therefore cheaper synthetic abrasives,
    natural stones have been used less. The hardware store scythe stone is usually
    made of silicone carbide or aluminum oxide from Canada bonded with resin and baked
    at 2500 degrees Fahrenheit. These common stones are too coarse for the blade of
    finer steel. European stones of silicone carbide have a finer grit and are more
    appropriate to use following the peening of the hammered blade. Natural stones
    are of a much finer grit still; when used for the very final honing, they import
    a sort of perfection to the edge that may not be noticed by the beginner but is
    greatly appreciated by the mower with little experience. To use the metaphor of
    sandpaper grit, the common stone is like 50 grit; the European synthetic stone,
    120 grit; and the natural stone, 320 grit.'
