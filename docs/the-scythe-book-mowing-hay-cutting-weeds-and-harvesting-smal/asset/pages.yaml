  md: '# Appendix


    Between 1994 and the time of this writing, I have approached every American scythe
    importer, including most of the dealers of the “European pattern” blades and accessories,
    offering to help. (This was free service; I paid for the hours on the phone and
    spent time writing many pages of letters.)


    Some took me for a rare fanatic and treated me accordingly; some seemed to listen
    politely, yet continued carrying on as before. Others wanted suggestions (or so
    they said), but did not follow them or changed their level of service comparatively
    little.


    Unanimously they were of the opinion that:


    +   1. Customers would be confused by too many options.

    2. The interest in the tool does not justify the cost of printing more detailed
    catalog descriptions, or the stocking of a diverse inventory.

    3. Their selection, incomplete though it may be, will suffice for the “beginner.”


    Perhaps I am a naive optimist, partial to the scythe, who believes this tool deserves
    to be treated on par with those articles where the above-average quality—in terms
    of service as well as that of the item sold—is in demand and therefore provided.


    The biggest “un-success,” to date, I consider to be my experience with a Canadian
    company, within the last 20 years, has come to represent exemplary tool quality
    and service in the realms of woodworking and gardening.


    Although I did manage to “talk them into” adding the scythe to their offerings,
    I now wish I had not even tried. When their next catalog arrived,'
