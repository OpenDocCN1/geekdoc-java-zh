  md: '# Preface


    Twenty years ago, I learned the right use of the scythe from Eliot Coleman. I
    then went on to design an American version of the European snath, imported the
    best of the European blades, and put together an integrated system of tools to
    sharpen and care for this wonderful means of cutting grasses, grains, brambles.
    My company was called By Hand and Foot, Ltd.: Tools Dependent on Human Energy,
    which later became Green River Tools, and we sold many garden and farm tools by
    mail order. Ten years ago, Green River Tools was sold, and the new owners dropped
    the scythe line. Other companies who copied the snath design and other parts of
    the system deleted them from their offerings. For a long time, those who wrote
    me had no idea how to obtain good equipment, and I was hard pressed about what
    to tell them.


    Now good equipment has become available in catalogs, a combination of imported
    and handmade. Even if you don''t have the best components, once you understand
    the scythe''s principles, you can work with any part of the system to refine it—bending
    and sharpening the cheaper, dull blades, rasping down the cheaper, heavier handles—and
    bring back the thrill of a body exhilarated by the outdoors while the blade whispers
    through the plants.


    Further work on improving this tool, and understanding how it works well, continues.
    In his book, Living Energies (Bath, England: Gateway Books, 1996), Callum Coates
    offers an analysis of the scythe''s superiority to the wounding of mechanical
    cutters: “The scythe delivers a slicing cut, keeping the wound area to a minimum.
    Due to the energies inhering in the blade and implanted there by hammer-sharpening,
    the imparted ionization quickly draws the elements in the material surrounding
    the wound together and rapidly seals it.” (p. 261) In a series of articles for'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Small Farmer’s Journal (from Sisters, Oregon, especially the issues of spring
    and summer of 1995), the well-read and anti technological Canadian Peter Vido
    shares his knowledge about how to work this amazing tool. And the professional
    archaeological journal Tools and Tillage (from the National Museum of Denmark,
    at Lyngby) publishes pieces about these tools and their ancestors, including experiments
    with old tools that reveal their best use. All of these recent developments have
    far supported the tenor and conclusions of The Scythe Book and extend its invitation
    to the scythe.


    In this age when wonder how you can accomplish anything without the aid of electricity
    or gasoline, but we must reassert that a hand tool finely made has greater versatility,
    attains comparable efficiency in large areas, and even makes for good exercise
    because the tool fits the dynamics of the body. Most importantly, a finely made
    tool does not interfere with personal communion with the ever-amazing natural
    world. Without the noise and both of the big machines, and with the heightened
    senses of a body electrified by activity, we open ourselves to the profound teachings
    of Natura.


    The companies come and go. The meadow beckons forever. Good mowing to you.


    > —D. T., 1996


