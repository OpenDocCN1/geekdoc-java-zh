    I would have stated clearly—as I did to the company—that these blades will perform
    poorly if the edge is not periodically “peened.” Exasperated, though not yet ready
    to give up, I called the president on the phone. He told me that, at most, four
    people in this country use the scythe seriously, and, besides, one could not teach
