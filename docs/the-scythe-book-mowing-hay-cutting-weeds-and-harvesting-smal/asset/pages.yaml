- img_proc: true
  md: 'Until more extensive notes are in print, I would like to leave you with one
    suggestion. Practice the peening (even with the jig) on used “American” blades.
    They can often be obtained for a few dollars and save your good blade from abuse.
    I have yet to come across one that could not be peened; some, in fact, respond
    better than blades of recent production. An inexperienced person may may crack
    one (which in of itself is a good lesson and a chance to practice edge repair),
    but not because they are too hard. Rather, they will be found with edges too thick
    and rounded from both sides. They will crack or chip if hit while not well supported
    right under the jig’s cap or a hammer. Filing the bevel(s) flatter, initially,
    will help.


