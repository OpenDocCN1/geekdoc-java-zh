  md: 'These instructions sound simple enough, but they are nearly impossible to enact
    each by itself. Taken together, the three instructions make up one unified sensation,
    which Alexander called ‘the true and primary movement in each and every act.’


    The term “primary movement” is a reminder that we are always moving in response
    to the accelerating force of gravity, and the head-neck relationship is the controlling
    center of this response. Alexander also termed this “primary control” to emphasize
    how important inhibition was to suppressing habitual wrong patterns and permitting
    the body to do what it knows best. I use the term “primary movement” without ignoring
    the sense found in “primary control.”


    Primary movement can be observed in any small child, as well as in top athletes.
    Its loss leads to abuse of the body, with attendant symptoms of impaired functioning.
    To aid the client in rediscovering primary movement, the practitioner of Alexander
    technique use the lightest direction of or her hands, most often in the region
    of the head and shoulders. One can relearn to stand in a state of equilibrium,
    without tension (without military “Attention!”) and without slumping under the
    burden of one’s weight. The experience of the body’s anti gravity power used in
    the twisting exercise before mowing is an example of positive use of the primary
    movement in relationship to the earth’s power.


    The anthropologist Raymond Dart used the name “poise” for “primary movement.”
    By poise he meant a never-fixed dynamic equilibrium that is in effect even when
    the body is at rest. He related to the balanced energies in the double spiral
    of voluntary muscles twisting in opposite directions through the entire length
    of the body. The twin serpents coiled about each other in the insignia of the
    medical profession effectively illustrate this same principle.


