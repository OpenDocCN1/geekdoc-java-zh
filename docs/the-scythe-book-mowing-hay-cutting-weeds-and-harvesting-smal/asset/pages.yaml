  md: 'In the molecular alignment of cold work, the steel becomes strain-hardened
    without losing its ability to dent under severe stress (ductility). However, if
    the pounding-out is overdone and leaves an edge too thin and brittle, the blade
    will break at the weaker points. The object in peening is to maintain the bevel
    and thickness of the original blade, as it was crafted by the master smiths. A
    rule of thumb is to hold the blade as in Figure 8 and push up on the very edge
    with your thumbnail. If the edge can be slightly moved by this pressure, then
    it is the right thickness. If it does not move at all, then it needs more peening.
    If it moves but not spring back into place, then you have been hammering for much
    more than five minutes!


    Many claim they could not possibly hammer the blade every along its length, and
    that hammering would soon use up all of the blade. Not so. I have seen several
    blades used every season for twenty to thirty years, and they are from 1/4 to
    1/2-inch narrower than their original width. The edges, no longer perfectly/straight,
    have become a little wavy, showing that the wear and/ the sharpening has been
    uneven. However, this is acceptable for a scythe, and does not impair its performance.
    As Adrian Bell said in Apple Acre, “His scythe is as wavy as the sea; every nick
    is a history of his labor.”


    If by accident the blade strikes a stone or stump hidden by the grass, a section
    of the edge may be blunted, bent over, or it may even show a tear up to 1/6-inch
    long. The risk of such damage should be avoided, in the first place, by not demanding
    the scythe to do the job of an ax or billhook. These high-quality scythe blades
    will cut year-old trees and brambles, but not tree trunks the diameter of your
    finger or larger. However, accidents with stones, fences, and peening is the only
    way to straighten out a dent. The hammer and anvil are made light-weight with
    holes through strings can be attached so they may be carried easily to the place
    of work for such emergencies. By repeatedly tapping around the edges of a dent,
    you bring the blade back to its original shape. And, if you’re smart, you take
    the opportunity to remove or clearly mark the obstruction.'
