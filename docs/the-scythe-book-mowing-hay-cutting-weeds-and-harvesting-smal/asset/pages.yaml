  md: 'I would not tolerate round-shaped grips, especially on a trimming snath. They
    necessitate more “gripping” than is desired for a relaxed experience. Flattening
    only the “inside” of each grip (as pictured in Figure 25) is a quick and worthwhile
    improvement to any commercial model. Finish the flattened edges on an angle that
    feels most comfortable.


    Another feature that will help to balance the blade is adding 5–10 ounces to the
    end of the snath. Slip a pretty brass knob (from an old ham) over the tip, or
    drill a hole and tie your pet rock (not a pebble) somewhere near the upper grip.
    Experiment with the weight; it is related to snath and blade size, their respective
    weights and intended purpose.


    It took me several seasons to fully appreciate this concept. Now I am very puzzled
    why this “question of balance” has not been given attention by snath makers and
    users everywhere.


    Discussing this “upside down” idea in theory with various individuals in Europe
    had little effect; it last year, when for the first time, I traveled during the
    grass-growing season, I took several home-made snaths one of them, with blade
    mounted, mower in Austria and Switzerland who took one them, merely into his hands,
    nodded in approval. Most of those who took a few swings asked if I could make
    for them also… which I did.


    The shape and placement of the grips were additional features that they all appreciated.


    The Appendix outlines some of my attempts to inspire better service on the “home
    front,” as well as my vision for a more promising tomorrow.'
