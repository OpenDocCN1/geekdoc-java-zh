  md: '# # Sharpening


    The faults (which the unlearned man) hath he will learn how to hide and color
    them, but not much to amend them; like an ill mower, that mows on still, and never
    whets his scythe.


    > —FRANCIS BACON, THE ADVANCEMENT OF LEARNING, 1605


    He, therefore, that spends his whole time in recreation, is ever whetting, never
    mowing.


    > —BISHOP JOSEPH HALL, OCCASIONAL MEDITATIONS, 1633


    WITH THE “AMERICAN” BLADE OF HARD STAMPED STEEL, THE TRADITIONAL method of sharpening
    was on a large circular grindstone (Figure 7). Thus Robert Frost could write about
    turning the crank as a boy while an older man held the blade at just the right
    angle to the rotating stone. Frost complained about the length of time it took
    and the wear on his arms; violent emotions arose toward the end.


    > Once when the grindstone almost jumped its bearing

    It looked as if he might be badly thrown

    And wounded on his blade. So far from caring,

    I laughed inside, and only cranked the faster,

    (It ran as if it wasn''t greased but glued);

    I''d welcome any moderate disaster

    That might be calculated to postpone

