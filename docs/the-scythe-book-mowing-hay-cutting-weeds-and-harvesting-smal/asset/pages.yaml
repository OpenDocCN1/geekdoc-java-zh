    3. The skill of the smith who crafted the blade,

    4. The quality of steel it was made of, and, of course,

    5. The sense of the mower who is guiding the tool.


    Admittedly, this is a large dose of relativity and is difficult to consider all
    at once. Sooner or later most people using the scythe often, or under diverse
    conditions, will be confronted with these cracks of this type of damage.


    We may end up with several cracks close to one another with just one stroke. The
    following one, especially if directed at the side of a similar target, will compound
    the damage. It may extend the cracks, create more of them, remove little pieces
    between two cracks or along the side of one of them or bend some of them over.
    Figure 14a. An edge “schrupped up” will perform as it had been; hopefully before
    the third swinging the mower will notice what has happened, stopped, and repair
    the damage.


    This may sound dramatic but is no real cause for alarm. A few inches of such an
    edge will not be much more trouble to repair than a couple of large single cracks.


    But before we begin the mending process, let me add that very likely as many,
    if not more, of the perpendicular cracks are either directly or indirectly caused
    by the owner’s hammer. Overzealous or inaccurate hammering may stress the steel,
    in one or more spots along the edge, nearly to the point of breaking, until some
    challenge (perhaps not an obvious one) finishes the job.


    The challenge may be more of the same manner of hammering in subsequent sessions.
    We might cut only young grass in the meantime and not realize what is happening.
    The cracks may be too tiny at first to be easily noticed by the naked eye, and
