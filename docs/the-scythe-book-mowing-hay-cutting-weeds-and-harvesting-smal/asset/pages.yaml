    The most elaborate and most beautiful invention for laying out grain more neatly
    to the side in scying is the grain cradle. According to thorough research by Jared
    Van Wagenen it was invented in New England in 1776. It was really a completely
    different tool, quite like a scythe in principle, but with a rack of three to
    wooden tines curved to follow the shape of the blade (Figure 26). At the end of
    the stroke, the straws would be bunched together and supported by the tines, the
    cradle would till the whole thing to the left and let the cradle grain slide into
    a neat bundle. In the middle of the nineteenth century there were a million cradle
    scythes being used in the northeast United States; they have been used in the
    fields of hilly areas in Appalachia and the Ozarks until recently.


    Not all authorities agree with Van Wagenen this cradle scythe was an American
    invention. Axel Steenberg claims that the cradle was developed in Scandinavia
