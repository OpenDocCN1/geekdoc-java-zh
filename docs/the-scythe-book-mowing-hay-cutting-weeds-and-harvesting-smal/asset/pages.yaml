    how he would have explained, or justified, the use of the whetstone he sells to
    sharpen. Their supplier of scythes and accessories offers five natural and five
    synthetic stones. They opted for the very cheapest of the latter group.


    For now I have run out of the energy required to break established attitudes and
    business patterns. Instead, I am focusing on an alternative approach—the planting
