  md: 'that it is hardly noticed. As insignificant as it may seem, it is analogous
    in function to that of the “back bevel” on a broad ax—both reduce penetration.
    For the cutting of grass with the scythe, however, this is not desirable.


    Even though “Austrian style” blades are slightly curved in cross section, the
    outermost portion of the edge itself should be maintained flat on the underside.
    Peening, if done well, assures it automatically. Furthermore, it can accomplish
    something which neither grinder nor will; that is, create a “hollow-ground” effect,
    which makes subsequent honing faster and the cutting action smoother. It is this
    which differentiates well-peened edges of scythe blades from those which are merely
