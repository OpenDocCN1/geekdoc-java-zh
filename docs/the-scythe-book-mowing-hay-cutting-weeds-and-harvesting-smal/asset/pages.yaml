    Inhibiting my habitual tensions and permitting myself to enter into the clock
    wheel movement with the scythe, however, be done while I am unaware of my surroundings.
    Then I am entranced with the inexorable rhythm of my own primary movement that
    I do not look back on my work to check the stroke, and variations in the rhythm,
    such as are demanded by molehills, stones, and the rare toad or partridge, easily
