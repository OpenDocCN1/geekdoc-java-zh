  md: '# # VI The Practice of Shaping the Edge


    WENDELL BERRY, IN HIS INSPIRATIONAL ESSAY “A GOOD SCTHE”, SIMPLY STATES that peening
    “takes some effort and some considering.” He was referring to the classical “freehand”
    method, which Tresemer discusses in his text. Chapter V represents my attempt
    at the considering. The theory is applicable to the method of peening of scythe
    blades in general. In practice, the freehand method takes patience and a good
    aim with the hammer.


    Fortunately, for the benefit of those who are either too hurried or without a
    good teacher, some tinkerers, many decades ago, invented various forms of a device
    to make the process easier and the less complicated. In English it has been referred
    to as the “hammerer of scythe blades,” “scythe blade sharpening device,” or “hammering
    apparatus.” I will here refer to it simply as the jig. One of the two models that
    are now available in America is shown in Figure 3–4.


    Whether Tresemer did not know the existence of the jig or did not think it was
    necessary, I do not know. Perhaps he was extra talented and fast with the hammer.
    Or, while not making it explicit, he thought that without using auxiliary devices
    we have a better chance to preserve one of those skills which are now on the endangered
    list. If so, that nostalgic part of me applauds him, for personally, I am too
    partial to the traditional method of shaping the edges of scythe blades.'
