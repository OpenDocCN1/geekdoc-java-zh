  md: 'I do not refer to the latter as “hard stamped”; in fact I do not use that term
    at all. Having held in my hands many samples of the “American Pattern,” I detected
    only one, which was distinctly stamped. It was a brand new blade of old inventory
    I found in an Amish-owned hardware store in Indiana with a label “True Temper,”
    Made in USA. How many European scytheymakers stamped blades I do not yet know,
    though I think that it would have been very few. The best of them would not have
    dared to mark their reputation in this way. The chief technician in the Austrian
    factory which presently supplies most of the stock in America personally assured
