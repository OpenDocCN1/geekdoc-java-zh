    The jig will work well in cases where a longer section of the edge is seriously
    blunted (after being run into a wire fence, for instance). Often it will be somewhat
    “ragged” as well; file it first, then use the jig.


    The more troublesome damages are the perpendicular cracks, as well as “tears,”
    and variously shaped pieces missing from the edge. The latter two are often predisposed
    by cracks but can also happen independently if the blade hits a sharp-edged metal
    object (a piece of steel roofing, angle iron etc. forgotten in the grass) or a
    corner of a partially buried rock. It will likely be a “tear” if the edge was
    thin; with a thicker, more durable edge, there may be a crescent shaped piece
    broken out. (The latter, of course, would have required greater force powering
    the stroke.)


    The “cracks” themselves can be caused suddenly, for example when the blade strikes
    a dry stub of a previously cut sapling, burdock, etc. An edge shaped appropriately
    for such an encounter would dent. If too thin, it may penetrate partially, but
    before it severs the stem it will “buckle” or twist momentarily. The extent of
    the damage will be relative to:


