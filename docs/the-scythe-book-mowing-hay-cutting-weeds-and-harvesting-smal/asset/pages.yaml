  md: '# FREQUENCY OF PEENING


    As explained in Chapter 5, the whetstone starts changing the “ideal” penetrating
    profile of the edge into a more rounded one from the first whetening on. The variables
    affecting the time interval at which reshaping will be advantageous are therefore
    all related to how it is honed.


    I nearly always use fine natural stones and whet, on average, every 5 minutes.
    Mowing in a field where only an occasional rock would be found, I peen approximately
    3 to 6 hours. If I used the kind of synthetic whetstones prevalent today, I would
    halve that time interval.


    In many European traditions, 4 to 6 was a “day’s worth of mowing.\ lunch break”
    (around 7 or 8 AM) the blades were often touched up with the hammer. The only
    men who made a seasonal profession of mowing could be found out in the field the
    dry, toilsome hours. Those who could afford to own two blades (both the evening
    before) would switch halfway through the day.


    In view of the above, and from my own experience, the 15-minute whetting and 12-hour
    pe frequencies recommended by Tresemer are exceedingly long. Even if I were a
    strong man, I would consider it a poor expenditure of energy to coax a blade,
    maintained on such a schedule, through the grass. Perhaps I am lazy, or simply
    to like and hammer scythe blades.... Mowing is, after all, a very personal experience.


    The time taken to accomplish the task of peening would not concern me at all.
    The quality of the results is directly related to patience and attention to details.


    Using the jig, it can be done in perhaps 10 minutes (5 minutes per cap). I prefer
    the freehand method, and after hammering many dozens of blades, still take 15
    to 20 minutes for one of average length. It is my very enjoyable centering period
    of a summer’s day.


    However, I would find it difficult to cover the intricacies of freehand peening
    here, so please forgive me for omitting it.'
