  md: '# # IX

    Principles of Movement


    DAVID TREMER WAS CORRECT WHEN HE SAID, “... THAT FOR EVERY ‘RULE’ OR

    tradition I have for scythe design and technique, somebody someplace else

    did it a little differently and got the grass cut.”


    The commonality of all mowing styles is that the blade moves parallel to the ground
    and in various degrees of a curve, rather than in a straight line,

    to assure that the forage is being sliced instead of "chopped." More

    comprehensive guidelines to the use of the scythe, which I find efficient,

    easy on the body and pleasant overall, can be condensed to three “rules.”


    +   1. Do not carry the weight of the blade, especially during what I have

    referred to as “field mowing.” On an obstacle-free terrain, the only

    reason to lift the blade is to hone it. Children usually grasp this

    quickly; many adults, on the other hand, seem to like fighting with

    gravity and initially need frequent reminding to merely slide the

    blade forward and back in continuous contact with the surface.

    2. Attempt to cut equally to the right and left of your body’s center.


    There will be exceptions to the above two rules when trimming obstacle-strewn
    terrain. The following rule, however, should hardly ever be broken.


    +   3. Direct the blade so as to leave all cut grass on the clean stubble of

    t previous strokes.


    To make the practice even more efficient, I would like to add a fourth,

    ot exactly a “rule,” but a suggestion. The distinguishing feature of thenmowing
    style I advocate is that it takes advantage of the velocity created by'
