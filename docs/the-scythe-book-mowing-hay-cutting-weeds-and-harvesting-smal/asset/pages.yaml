  md: 'I stand upright. The stereotypical picture of the man with a scythe shows bent
    over in a posture that would leave him exhausted and crooked at the end of an
    hour. Today’s cheap hardware-store scythe also pulls the body over a stoop, a
    fatiguing position. One should be able to use a good tool all day, every day,
    without pain or abuse to the body. The great improvement in Roman Gaul of the
    long-handled scythe over the short handled scythe and sickle of early Roman times
    is the ability to stand erect and relaxed, and thus do much more.


    My body twists around the left, my left elbow bending further and leading the
    way around the back of my body. The stroke ends when the blade cuts through the
    line made by both feet (Figure 15, ending). At this point my left elbow is almost
    touching my backbone. My chest faces left. There is tension in every joint as
    the pendulum of the swing comes to its furthest point.


    At best, the stroke does not have to be stopped. It is initiated with just enough
    energy that the last of the grass is cut and the windrow as the momentum of the
    stroke is reduced to zero; the leftover energy is comfortably stored in the tendons
    to power the recovery back to the right.


    As I swing back to the beginning of the next stroke, I move both feet forward.
    The heel and toe of the scythe are parallel to the ground and just above it at
    all times. The shape of the cut is a crescent.


    The grass tends to be thrown by the left by the scythe; therefore I proceed as
    if walking the edge of the uncut grass. Many people confuse a scythe with a broom
    or a golf club. They face the field straight rather than walking along it, and
    to slash the grass. The heel of the blade always rises useless above the ground
    at the beginning of the stroke. Despite a vigorous swing, little is cut. The grass
    that is cut is thrown into the next swath. This approach is pictured in Figure
    16.


    For the right approach, I walk the edge of the field, twisting my body, keeping
    the heel of the blade down to the ground from beginning to end (Figure 17). In
    or croquet there is only one point of impact on the ball. In moving, there are
