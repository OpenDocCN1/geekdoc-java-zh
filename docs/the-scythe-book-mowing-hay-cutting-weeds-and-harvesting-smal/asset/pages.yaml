  md: '# # VIII

    Repairing the Damaged Edge


    EVENTUALLY, MOST SCYTHE BLADES WILL REQUIRE MINOR OR MAJOR EDGE repair, and as
    an opening statement, I would like to emphasize that *damages should be dealt
    with in tum as they occur and not be allowed to accumulate until such time as
    “peening proper” takes place.* The shaping of the whole edge and the repairing
    of a small portion of it are distinctly separate tasks. They can be combined in
    instances when the edge about the time the whole blade is also due to be peened.
    In this case, I would complete the repair first, and only then proceed with the
    actual peening.


    For the purpose of repairs, hammers and anvil setups were traditionally taken
    to the field, often shared by a group of mowers. I have also, on occasion, used
    two rocks to straighten out a simple “dent,” a piece of bent but *unbroken* edge.
    This would be better than ignoring such a damage; or two rough spots, even if
    a beginner does not notice the extra wear on the body, will he have on the whetstone.
    For repair work alone, you will find the hammer a handier and more accurate tool
    than the jig. This will get started, in a small way, on the practice of the freehand
    method.


    If a dent is not very pronounced and especially if bent downward, the jig will
    work well. When curled considerably, begin by getting it back into place with
    only the hammer, then finish on the jig with the second cap. More frequently dents
    are bent upward and are best dealt with “upside down.”'
