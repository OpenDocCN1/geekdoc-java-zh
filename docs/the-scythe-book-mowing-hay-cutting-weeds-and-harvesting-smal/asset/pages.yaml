- img_proc: true
  md: 'The most challenging to cut, in terms of density, are the extremes:


    +   a. A very dense, frequently mowed lawn or an intensively grazed pasture.

    b. Scant growth with burdock or unsupported individual stems.


    Regarding maturity, burdock (Arctium sp.) can be noted as an extreme example.
    Before the flowering stage, regardless of height or stem diameter, it can be cut
    with the lightest grass blade models. To deal with any sizable stand of burdocks
    at full maturity, I would trade even a sturdy bush scythe for a sharp ax or a
    pair of long-handled loppers. The above principle is true, albeit to a lesser
    extent, with practically every other plant, though most of them can certainly
    be cut with grass blades if the edge is suitably shaped and the mower ''s technique
    correct.


    # 3. The Direction of Approach


    Moving predominantly in straight lines or all the way around the field not be
    desirable in many instances. The scythe is not limited to such an approach, and
    mowing can often be transformed from hard work to pleasure simply by changing
    directions.


    Here, two factors, considered together, will determine the easiest path: topography
    and the “lean” of the vegetation (even if not apparent, it is usually there) within
    a given stand.


    My initial material on the topic of the path of least resistance was many pages
    long. As with anything I wrote, it came from the scrutiny of our 18-year-old homeschooling
    (“self-taught”) would be more accurate son Kai. He is my first and most critical
    editor. Apart from cutting up my lengthy Slavic-style sentences, he attempts to
    take out all the sentimental stuff and many philosophical passages. With his strong
    tendencies to practicality, if he wrote this addendum it would be one-third the
    length and titled: “No Nonsense Guide to Mowing!'
