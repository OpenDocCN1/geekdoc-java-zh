  md: '# # I Clarification of Terms


    SOMEWHAT RELUCTANTLY, AND IN AS FEW INSTANCES AS POSSIBLE, I CONTINUE referring
    to the subject of this book as the “Austrian style scythe.” It is convenient to
    do so, because David Tremeser—or someone before him—established the term in North
    America and many readers at least partially know what is meant.


    However, it is a misnomer, which does not acknowledge the fact that this type
    of blade has also long been made in other European countries. In the respective
    languages the tool is merely referred to as a scythe (and this is my preferred
    term as well). Sometimes, if the country of origin is known and it is desirable
    to mention it, the blade is given the prefix of “Austrian,” “Russian,” “German,”
    etc. to emphasize its reputed quality relative to another.


    Apart from Austrian-made blades, others of the same “style” have been imported
    into North America for well over a century. Most were models not used in Austria
    at all, even if made there, and some were forged in Germany, France, Sweden, the
    former Yugoslavia, or perhaps elsewhere.


    It would therefore be more accurate to call all of them collectively “the blade
    style of Continental Europe” as distinct from those made and used in the British
    Isles and North America. What differentiates them more significantly than their
    physical shape is the property of tension incorporated into the steel during the
    process of manufacture, which allows the former to be lighter in weight, yet still
    retain its shape in use. The British and American-made blades were not tensioned
    and therefore, relative to the task for which each respective model was made,
    had to be heavier.'
