    Small grains are sown in an area which has been cleaned of weeds, preferably by
    growing root crops in the plot year before. You must keep the weeds out of the
    root crops through cultivation; the grain will benefit from this clean culture.
    Excess nitrogen and lack of potassium causes lodging or falling over the grain,
    making harvesting difficult. A cradle cannot be used on lodged grain, and lodged
    grain must be harvested soon with a scythe or sickle to keep the kernels from
    sprouting by being too close to the damp earth. Lodged grain can be raked and
    tilled like hay.


    Grain can be sown in the fall or early spring, depending on the climate and the
    farming schedule. If grain is sown too late in fall, or too early in the spring,
    the cold and damp soil will rot the seed before it germin. Though higher yielding,
    winter wheat sown in August or September can be completely killed by a hard winter.
    The finest flour with the highest gluten content to promote rising is spring-season
    hard wheat, in varieties such as Neepawa, Olaf, Manitou, Justin, and Selkirk.
    Barley, oats, and buckwheat are also sown in the early spring because they are
    not hardy. Rye can be sown nearly any time since it is very hard and requires
    only a short season for growing; the saying “wheat for fat, rye for strength”
    may indicate more the types of people who live in short-season growing areas than
    the nutritional quality of the grain. The seed can be broadcast by hand from a
    sack, though a rotary hand-turned seeder will give more'
