  md: '# # Mowing Technique


    O sound to rout the brood of cares,

    nThe sweep of scythe in morning dew


    > —ALBERT, LORD TENNYSON, IN MEMORIAM LXXXIX, 1833


    MOWING SHOULD BE COMFORTABLE, NOT TOO STRENUOUS, NOT—IMMEDIATELY—tiring. If it
    is it, it is wrongly done. Dress for mowing, therefore, should also be comfortable.
    The best includes loose-fitting pants and shirt. The shoes should be light; the
    feet are not threatened, and mowing was often done barefoot. A sun hat is a good
    idea, and is always worn by the European mower. A scarf may be useful to warm
    the neck in the early morning, and to mop the brow in the afternoon.


    # # A HELPFUL EXERCISE


    An exercise to begin each mowing session helps remind me of the shape of the movement
    (Figure 14). I stand erect, neither slumping nor rigidly at attention, and consider
    gravity as the fundamental force of the earth, which acts upon my entire body
    at every moment. Gravity is an acceleration, opposed to a steady velocity: an
    ever-new force that pulls me downward faster and renewed. I respond with an acceleration
    upward, in opposition, also renewed every moment, an anti-gravity. I prefer the
    terms energy or spring to anti-gravity for denoting this counter movement; it
    is not an anti-earth force, or a rejection. The earth is the entity from which
    we spring. We are the earth’s offspring. The other connotations of spring are
    all correct. Neither pulled to merge with the source, nor flying up uncontrollably
    in escape, I stand erect, firmly grounded yet springing toward heaven. The stance
    itself is an act of creativity. Although this interaction'
  merge: -1
