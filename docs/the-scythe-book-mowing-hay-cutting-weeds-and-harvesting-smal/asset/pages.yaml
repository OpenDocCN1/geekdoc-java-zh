    I cut, always, with the blade parallel to the ground; but this lets me two different
    approaches to the grass. If I put my left hand against my belt and bring the right
    hand around through the stroke, I can make a cramped slice. The opposite approach
    is to pull the whole blade straight across the grass like a cleaver hacking meat.
    Neither works works With the narrow slice, a mere two inches of grass is cut;
    with the broad hack, the grass tends to bend over. All mowing ideally combines
    the two approaches; in varying conditions I must alter the approach to have more
    slice or more hack. If the cutting is easy, I may reach out at the beginning of
    the stroke to increase the size of the swath, while sacrificing some of the slicing
    effect. If the cutting is difficult, I may wish to maximize the slicing effect
    and minimize the hacking effect by dossing the blade inward. Within the limits
    of the scythe ring, the blade can be shifted slightly in its seat to create the
    slice or hack effects (Figure 5), but I have found that the way in which I use
