    # PASTURE


    In pastures the nutritive and sweet-tasting plants are eaten first, the less desirable.
    Finally there remain the plants that the animals won’t eat. These mature, go to
    seed, and eventually take over. The animals eat themselves out of a food supply.
    Good pasture management involves not only attention to the mineral balance of
    the soil and periodic rests of the land rotation, but also getting the worst plants
    down before they go to seed. A scythe can do this quickly, even in large fields,
    since the mower has more maneuverability than a tractor when going from one dump
    to another.


