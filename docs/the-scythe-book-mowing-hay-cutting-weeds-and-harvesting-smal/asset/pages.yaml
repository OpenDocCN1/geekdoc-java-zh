  md: 'Sometime in the fall or winter I take the sheaves of grain apart and separate
    the kernels from the straw and chaff by threshing: hitting them over the back
    of a chair, banging them around a barrel, jumping on them, or driving heavy-hooved
    animals over them, flailing them, or using a threshing drum. The two-piece flail,
    used since the fourth century, is a six-foot pole to which is hinged an eighteen-inch
    beater or swingle or sweepsle made of hardwood or occasionally knotted rope. The
    swingle is brought up easily to shoulder height and brought down along its full
    length onto the thick pile of opened sheaves with a thump, then again, and again.
    The blow need not be violent nor exhausting; the grain is not out, but shook out
    of the deep pile of straw by the blows of the flail. As scythe, there is a rhythm
    intrinsic to the task of threshing which makes the work easier. The leader of
    threshing teams coordinated the succession of blows with work songs or chants
    or even dances specific to threshing.


    The problem of design is the material for the hinge. Even leather wore out quickly,
    so elskin was used whenever available. Robert Johnston has proposed an excellent
    design to keep the swingle from getting tangled in its own hinge material (Figure
    28). The heavy wheel revolves freely around the notch at the end of the handle
    so the twine does not get too twisted.


    A field before harvest may look like amber waves of grain, but threshing reveals
    that the kernels are a small fraction of the weight taken from the field. The
    quantity of chaff and straw seem prodigious by comparison to the pile of kernels,
    which are one twenty-fifth of the whole, and a smaller fraction of the volume.


    Wheat, rye, and buckwheat thresh easily. Only the "naked," or "hull-less" varieties
    of barley and oats thresh easily. The hulled varieties require more work with
    the flail; heating and light grinding also removes the hulls.


