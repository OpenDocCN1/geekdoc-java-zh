  md: '# # Notes


    # ## The Scythe Book


    +   1. The word *scythe* is a corruption of the more easily pronounced Old English
    *sithe*. Peter Cousins suggests an earlier Dutch word, *zicht*, as an origin.
    These three share the same Indo-European root, *sek-* as "saw," "sword," "sickle,"
    as well as "plow share," "schism," "science," and so on. All the derived words
    have the sense of splitting one from place to another. The modern German word
    for scythe is *die Sense*, and relates to the Indo European root, *sent-*, meaning
    "to head for go"; in some areas, scythe is pronounced like "sigh"; there is no
    etymological relationship for the similar sound of blade cutting grass and strong
    exaltation. The French *faux* and the Italian *falce* derive from the Latin *faux
    foenaria*, without an earlier root.


    +   2. "Steel" has less than the 0.2% minimum carbon content of steel and is less
    strong, less brittle, less sharpenable, and more flexible. Gerard Jenkins *The
    Craft Industries* describes in great detail the history of blade manufacture in
    the British Isles.


    +   3. In Marc Chagall''s painting of 1911 of his childhood in Russia, *I and
    the Village* (Museum of Modern Art, New York), the top grip is held by the mower''s
    hand, the snath rests horizontally on the right shoulder, and the blade points
    behind the back. In Winslow Homer''s painting of 1869, *Man with Scythe* (Cooper-Hewit
    Museum, Washington, DC), the lower grip rests on the mower''s right elbow, the
    right hand holds the snath just below the upper grip, and the blade is bending
    and pointing to a foot above the ground.


    +   4. There is no mention of left-handed models in the writings on the scythe
    (with one exception of a passing reference in 1921 *Larousse Agricole*). Nevertheless,
    in some prominent illustrations scythes appear left-handed. An example is Bruegel''s
    "The Haymakers" (1565, Narodni Museum, Prague). A Norman Rockwell illustration
    of *Poor Richard''s Almanac* first published in 1964 seems to show a left-handed
    scythe, and that has provoked many chuckles from old-timers (Country Beautiful,
    *The Most Amazing American: Benjamin Franklin*, page 38). These'
