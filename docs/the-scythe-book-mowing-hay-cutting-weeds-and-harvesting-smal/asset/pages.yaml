    my environment permits me to perform as evenly and flexibly as Levin’s old teacher.


    The human rhythm of mowing, and the flexibility it permits, is central to the
    superiority of the scythe as a tool. The first mechanical mowing used one or several
    scythes whirling about complete circles from a horizontal wheel directly powered
    by the wheels of the machine turning on the ground. The inventors were trying
    to do what the human mower was doing, faster. In fact, these machines performed
