    UNLIKE THE LEAVES OF OTHER PLANTS, THE LEAVES OF GRASS (FAMILY GRAMINEAE) grow
    not from their tips but from cells at the base of their sheaths. Therefore they
    can be cut, mown, and nibbled again and again yet grow back. “Greenstuff” is harvested
    to feed animals and to mulch gardens and orchards. Modern farming equipment has
    made the harvest easier, so that in place of the teams of mowers is the tractor
    operator, his mowing machine, bedding machine, baling machine, and trucks for
    transport. Smaller farmers, gardeners, and homeowners have difficulty haying because
    they cannot afford this equipment, cannot rent it in the suburbs, and cannot hire
    it from the larger farmer, who needs it at the season.


    Hay cut first in spring when the leaves are green, juicy, and full of protein,
    and when the fiber content of the plant is low. The digestibility and worth of
    the hay is at its highest quality early—May 15 in Vermont and further south. Every
    day after this date digestibility decreases by half of a percent, as the proportion
    of protein to fiber decreases. Later on there is more quantity of hay as the grasses
    mature, but it is actually less useful to the animals. (Hay which is harvested
    for the first time in August has tough brown stalks without much leafy green:
    “Won’t make butter, but it’ll ‘em alive,’ as one dairy farmer said.)


