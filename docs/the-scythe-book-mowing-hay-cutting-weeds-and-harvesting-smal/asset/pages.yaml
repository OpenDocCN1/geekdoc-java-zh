    was a person who molded the sources of life; the man who tended the machines risked
    himself to the inanimate.”55


    The early threshing machines to which Massingham referred were very large, noisy,
    and dangerous. In contrast, the foot powered threshing drum, used widely on small
    quantities of grains in Japan (and pictured in Fukuoka’s One Straw Revolution),
    is a cylinder of wooden slats covered with wire loops rotated away from the operator
    by a treadle at 350–450 revolutions per minute. The straw is held in both hands
    over the moving wire loops, which beat the kernels out. This machine supposedly
    thresses six bushels an hour, with less risk of cracked kernels than in flail-threshing.
    However, in a series of experiments comparing the rotating drum to threshing with
    a flail, I found that the rotating drum performs best only when the kernels are
    extremely loose in the grain head. If the kernels are easily detachable and the
    sheaves are held carefully over the many steel fingers, the threshing drum takes
    the same amount of time as the flail—from a half hour to an hour per bushel—for
    an average of one third more kernels. Hurrying, however, decreases the yield below
    that of the flail. The expense of the threshing drum seems justified only for
    large quantities of grain.'
