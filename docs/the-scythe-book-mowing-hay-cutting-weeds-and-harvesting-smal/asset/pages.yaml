  md: '4. Shaping /Beveling (not finishing) of other tools.


    Because the classical scythe tapered stones are so easily held in the hand, I
    use them now for the majority of tasks where abrasives are called for, while the
    array of bench and other stones I have accumulated over the years is mostly neglected.
    My carpentry skills are of mediocre level required on a homestead. The blades
    I use most frequently (after the snow has covered the grass, of course) are various
    knives, and drawknives, and I like them “keen” (even if that may not be the same
    as “perfectly sharp”). Along with farrier tools, sheep shears etc., they are mostly
    kept in that state by means of scythe stones; several of differing textures are
    always close at hand.


    Having only one scythe stone is, to me, unthinkable; I am totally baffled when
    I see people quibbling over which one of the $5.00 options they should choose.
    Men used to risk being shot or thrown in dungeons for smuggling a saddle of highly
    reputed scythe stones over treacherous mountain passes ...


    Likely a few natural stones are still available. Most of these will outlast synthetic
    substitutes by several times. From the combined discussion regarding edge quality,
    it will be obvious that their *slower* wear is not the primary reason for their
    much better value. Furthermore, they can be had without anyone shot or having
    to labor a week or just to afford one, in quality equivalent to the kind that
    men used to treasure. Such stones once received very special care and were kept
    and carried in equally precious **whetstone holders**.


    The first ones, used by the mowers of old, were made of animal horn. With the
    advent of steel augers wood replaced horn in many regions, probably because it
    was more plentiful and easily decorated in a personal manner. A well-made wooden
    holder did not crack, kept the water cool and lasted a lifetime.


    Inja Smerdel, curator of the Slovene Ethnographic Museum, wrote a whole book on
    the subject (as others did before her), and I tum to the words from her text.'
