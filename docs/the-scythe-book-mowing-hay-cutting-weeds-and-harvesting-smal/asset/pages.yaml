    # WHY IS IT SO COMPLICATED?


    Apart from all other characteristics that define each blade as a *distinct model*,
    its tang is angled simultaneously in three specific planes.


    The scythesmiths do not invent these angles. They have always followed the exact
    specifications of their customers. Each respective model was “dreamed up” by someone
    who had reasons of his own for wanting it one or another. Many hundreds of models
    have been conceived and made. The Styria Company alone, for example, has patents
    for over one thousand of them. The specifications for each are in their records
    and could all be reproduced. There is no need to do this, for though the demand
    for diversity here (as with anything else) is steadily dying, they still manufacture
    over 200 models; plenty to choose from. However, we—and I refer here to both the
    dealers and the mowers—need to learn what to ask for and why.


    Whatever the benefits of the “Information Age” have been in some areas of human
    endeavor, it has obliterated much wisdom, skill, and service elsewhere. The scythe
    has been a prime example of the latter, and it is a worldwide condition. As small
    regional dealers gradually disappeared, many traditional blade and snath models
    have been replaced by others. Adaptation of the specifications and measuring methods
    have not kept pace with these changes. Some of the former fine-tuning considerations
    have been forgotten and many casual mowers do not have their units well adjusted.


    May it never come to this, if the present trends toward less diversity—in general—continue
    until the world’s scythe users are offered only one model of snath and blade,
    and if we all mowed in the same style, then very simple formulae could suffice.
    At this point we are caught in mid-stream, with many models of blades and snaths
    circulating in a haphazard manner,'
