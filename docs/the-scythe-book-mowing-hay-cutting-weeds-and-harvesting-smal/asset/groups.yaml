  - '[PAGE 147]


    retain such an edge during extended use. However, I do not recommend an edge this
    thin for many situations. One must first have an understanding that, as such,
    it is akin to a chisel or plane blade delicately shaped for the purpose of taking
    paper-thin shavings off clear wood. The careful woodworker would not run such
    an edge forcefully into a knot—or if he did, he would pay for it with a damaged
    tool. Can we learn to use our scythe blades as a craftsman uses chisels?


    A sensible mower in fields clear of rocks would certainly appreciate the above-discussed
    edge.


    The “knots” that threaten the scythe blades are inherently very tough plants,
    or more, those that early in the season or seed stage will crumble the “perfect
    edge.” To cut such material (and it would limit the scythe’s usefulness if we
    did not) we must back off the potentially penetrating shape to one with a greater
    degree of durability. Exactly what degree is grasped as we use the tool with awareness
    and gain **“The Mower’s Sense.”**


    Listed below are examples of *some* of the cases in which I do not want an edge
    so very thin:


    +   1. A good portion of the general field mowing on our farm in August when some
    of the large goldenrod species, often growing in clumps of up to a dozen stems,
    are in full bloom.

    2. Orchards containing plum or pear species prone to send up suckers some distance
    from the main trunk.

    3. Very rocky areas.

    4. Unfamiliar yards where I might expect to find, with the blade, objects other
    than plant material.


    For these tasks a blade nearly ready for re-beveling may be just fine honed more
    frequently. In addition, one can switch to a coarser whetstone.


    The best purpose-specific edge, however, is still one with its underside flat,
    the top bevel shorter and, of course, not so thin overall; in other words, somewhat
    thicker than one which easily “runs over the thumbnail but'
  - '[PAGE 148]


    shaped correctly.” It will respond better to a fine grit stone, cut easier and
    be more durable at the same time.


    I have focused on the theoretical aspect of peening which is not difficult to
    grasp and apply. The results are readily observable because they are related to
    physical shape. There are other, somewhat more abstract, reasons for partaking
    in this centuries old activity, namely the hardening of the edge and the “building
    up of opposing electromagnetic charges within the blade.” Both of these deserve
    to be covered, albeit in a lengthier text.'
  - '[PAGE 149]


    # # VI The Practice of Shaping the Edge


    WENDELL BERRY, IN HIS INSPIRATIONAL ESSAY “A GOOD SCTHE”, SIMPLY STATES that peening
    “takes some effort and some considering.” He was referring to the classical “freehand”
    method, which Tresemer discusses in his text. Chapter V represents my attempt
    at the considering. The theory is applicable to the method of peening of scythe
    blades in general. In practice, the freehand method takes patience and a good
    aim with the hammer.


    Fortunately, for the benefit of those who are either too hurried or without a
    good teacher, some tinkerers, many decades ago, invented various forms of a device
    to make the process easier and the less complicated. In English it has been referred
    to as the “hammerer of scythe blades,” “scythe blade sharpening device,” or “hammering
    apparatus.” I will here refer to it simply as the jig. One of the two models that
    are now available in America is shown in Figure 3–4.


    Whether Tresemer did not know the existence of the jig or did not think it was
    necessary, I do not know. Perhaps he was extra talented and fast with the hammer.
    Or, while not making it explicit, he thought that without using auxiliary devices
    we have a better chance to preserve one of those skills which are now on the endangered
    list. If so, that nostalgic part of me applauds him, for personally, I am too
    partial to the traditional method of shaping the edges of scythe blades.'
  - '[PAGE 150]


    ![](img/27a09e01dbd329ab631e901469ce4b29_150_0.png)


    Figure 3–4 Peening Jig


    Regrettably, I have come to consider the jig, at least for the average mower of
    today, an almost indispensable aid. (Many of the blades I have seen in America,
    “peened thin” by the freehand method, have suffered serious damage as a result
    of the owners’ lack of skill.)


    The primary advantage of the jig is that it compensates for inaccuracy with the
    hammer. One will also be effectively beveling the correct width of the edge without
    the danger of overreaching. The results will be far more consistent.


    The basis of a satisfactory job of peening is the setting up of a steady block
    at which one can sit comfortably and with good light. The jig can be clamped in
    a vise, as indeed the instructions on the packaging of some models suggest. I
    consider this a poor substitute, because few users doing this way will probably
    trouble themselves to make an auxiliary set-up to support the protruding portion
    of the blade while the opposite end is being'
  - '[PAGE 151]


    worked on. With a short blade it would not be difficult; however, in attempting
    to steady one of, say, 28" in length while the point is being hammered, the benefit
    of some means of support will be readily appreciated.


    In parts of Europe it is the custom to peen blades while they are still attached
    to a snath. Various methods of steadying the snath and blade have been devised.
    I shall not describe them here because I am convinced that more accurate results
    can be attained if the blade is disconnected from the snath. With the convenience
    of today’s attachment rings it takes only a few seconds. It will also offer a
    chance to properly re-haft the blade, clean and occasionally oil part of the snath,
    which accumulates dirt and moisture, as well as to the threads of the setscrews
    on the ring.


    My favorite means of blade support are my legs. They provide the most accurate
    and instant adjustments of the desired angles of any method I have tried.


    To set the jig into the block, it is much easier to pre-drill a slightly undersize
    hole. The central guiding shaft should never be hit unless one of the caps is
    in as it could be damaged enough to prevent the smooth movement of the cap. It
    is also better not to hit the cap hard without the blade inserted; it will retain
    the desired shape of its lower end much longer if it does not get smashed against
    the base itself. (I have seen children energetically hammering an “empty” jig
    for fun.) The blade acts as an intermediate cushion.


    Tap the jig into the hole carefully and lightly until about halfway in and somewhat
    steady. At this point you could insert the blade and begin peening. In the time
    of the jig will contact the surface of the block. In the case of the two jig models
    presently available in America, one complete peening session involves the successive
    use of two caps with differently shaped bottom ends. The first one will put a
    defined groove approximately 5/32" (4mm) from the edge. The second will flatten
    the metal between the groove and the edge and thus also move it a bit forward.


    If the blade has been neglected (not damaged by peen or left unp for too long)
    it may be necessary to repeat the process twice. Done at'
  - '[PAGE 152]


    regular intervals, the first cap may be skipped perhaps every second time or

    so.


    The advertising claims may have the prospective buyer thinking that this

    “professional sharpening device” will spit out the “perfect edge every

    time.” Relative to the freehand


    ![](img/27a09e01dbd329ab631e901469ce4b29_152_0.png)


    Figure 5


    method, using the jig is easy, yet success is still not automatic. Deviations

    from “perfection” can be caused by one or more of several factors. To

    assure uniformity watch that:


    +   1. The blade is touching evenly on both edges of the base during

    hammering. (See Figure 5)

    2. The very edge itself is well supported while the cap contacts it.

    (The overall curvature of many models of scythe blades requires

    that they are tilted slightly forward in order to accomplish this.)

    (See Figure 6)'
  - '[PAGE 153]


    3. The rhythm of the hammer strokes is synchronized with the speed at which you
    move the blade.

    4. The force with which you hit is uniform throughout.


    The jig requires no specialty hammer. Any common one, of at least 16 oz. in weight,
    will work. In cases of neglected blades and for the bush models, a 20 oz. will
    be more effective. I feel it is better to use a heavier hammer gently than a light
    one in too vigorous manner. The hammering, even if uniform, can be overdone by
    hitting too hard, especially if the primary level is relatively new and/or thin
    (as will be the case with most new blades made in Austria).


    ![](img/27a09e01dbd329ab631e901469ce4b29_153_0.png)


    Figure 6


    Focus on the flattening of the back bevel instead of the thinning per se (which
    will take place automatically). You may want to make one pass over the blade rather
    gently to get a feel for the steadying, the rhythm and the extent to which the
    edge reacts. Then check for the back bevel very carefully. It may still be there
    in a few spots. Mark these areas from the top with chalk and peen them again,
    more lightly.'
- md: '

    Coming off the jig, the blade’s edge, if the job was well done, is suitably shaped
    (i.e. beveled) but has no keenness. This is due to the fact that during peening
    it slides against the central guiding shaft, which, of course, dulls. As a compensation,
    some of the minute damages too small to be seen with the naked eye are “jointed”
    or smoothed out. So we are left with an even edge, well beveled, relatively thin,
    but dull.


    Notice the light reflection on the edge, which indicates this lack of keenness.
    Be it a pocket knife or a scythe blade, if the average person’s eye easily detects
    any reflection while the edge is held toward good light, the tool can be deemed
    too dull for many of its tasks. Examine the blade-edge. Flick it sideways back
    and forth until you are looking at it from an angle where the reflection is greatest.
    At no time during normal use should it reflect light more of its edge at this
    stage. It will now be understood why no more pressure than necessary should be
    applied with the blade against the jig’s guiding shaft.


    ## FINISHING THE PROPERLY BEVELED EDGE


    Accordingly, more work with the whestone will now be required to ready the blade
    for cutting than the in-field honing sessions. A synthetic stone will accomplish
    the first part of this task considerably faster. I suggest that this be done in
    some comfortable and steady position before mounting the blade. I hone first from
    the top. With my left hand I hold the blade by the tang, with its point in a block
    of wood, diagonally in front of me while I kneel; try other positions if you wish.


    For this task of off-the-snap honing of the blade from the top side, use the stone
    on its narrow edge (See Figure 7). The majority of scythe stones have a shape
    that corresponds somewhat to the inner curvature between the slightly upturned
    edge and the back rib of the blade. Used on their curved edge, they fit within
    this cavity and allow the chance to achieve a lower bevel angle, if this is what
    the mower desires. As has been explained on Page 115, doing so offers a more penetrating
    profile but increases vulnerability.


    So the true bush blades, for instance, are better off with a less acute secondary
    bevel and should be honed steeper than the rib-to-edge relationship. (See Figure
    9).


    If the rib is used as an angle guide, I suggest doing so in such a manner that
    the stone barely contacts it and the pressure is focused on the edge. There is
    no direct harm in rubbing both rib and edge equally hard (should you find it easiest
    at first) than needless wear on the stone.


    I hone in one direction only, away from myself, from heel to point and on a diagonal,
    as this allows me a longer stroke. How many strokes this part of the task will
    take depends on the stone one uses, the pressure applied and how hard the edge
    was pressed against the shaft of the jig during peening. Continue until you feel
    a slight “burr” developing from the other side. (For explanation see Page 103)


    Those who are new to sharpening tools need to learn to feel for the burr very
    carefully. It may help if you occasionally rinse the blade or wipe it with a rag.
    As soon as the slightest burr is detected anywhere, skip that area and keep honing
    only the rest. When it can be felt along the whole length, turn the blade upside
    down and remove the burr.


    ![](img/27a09e01dbd329ab631e901469ce4b29_155_0.png)


    Figure 7


    I prefer to use the stone on its broad face for this task and carefully stroke
    against (i.e. toward) the edge, as the burr is more quickly removed this way.
    A smaller portion of the stone will be in use and the stroke will thus be shorter.
    If you wish for a safer option, do this with the edge away from you. One complete
    pass consisting of several overlapping strokes from heel to point should suffice.
    Repeat these strokes using a natural stone making two or three passes from the
    top and one or two from underneath. Smooth-cutting edges are achieved through
    the use of abrasives of a rather gentle nature. Most synthetic whet-stones available
    today do not belong in this category.


    All sharpening stones function by cutting grooves in the steel. The larger, harder
    and/or more angular abrasive particles (i.e. the grit), the larger the grooves.
    The bits of steel removed off as dust. The inevitable side effect of this process
    is that some pieces of steel are still attached to, but protruding over, the edge.
    Most of them will be bent over to varying degrees from the opposite side some
    of the burr is bent back again. As the stone is applied from the direction away
    from the action of the stone some of the burr bent back could continue “forever,”
    for even as some burr breaks off, more is created by the grit of the abrasive.
    (The coarser the stone the more this is true.) An uninitiated person, testing
    for sharpness of an edge, may feel the individual teeth comprising the burr grabbing
    the skin of their thumb and the tool would seem deceptively “sharp.” In reality,
    they should be considered a nuisance or at best a temporary condition at a certain
    stage of a thorough sharpening process.


    ![](img/27a09e01dbd329ab631e901469ce4b29_157_0.png)


    Figure 8


    The purpose of the final honing therefore, has always been to remove the burr
    as completely as possible. The popular opinion that serrations along an edge are
    desirable is a half-myth. The objective of creating serrated edges on some cutting
    tools during the process of manufacture is to reduce the need for the usual frequency
    of sharpening.


    A serrated knife may indeed work very well when new and still cut several years
    later without having been sharpened. But a distinction must be made. Its relatively
    sturdy teeth are the result of deliberate specialty edge shaping by the maker
    and are designed to stay there for the lifetime of the tool. The type of teeth
    we are concerned with when discussing scythe blades are short-lived. At best,
    some of the smallest and best aligned ones wear off gradually. Most often, a portion
    of them bend over or break off during the first few swings. When they do, they
    leave behind a “flat,” light-reflecting surface, in other words, a dull edge at
    that point. The coarser the stone used, the wider will be this blunt surface and
    the less keen the edge. There is no doubt that edges finished with finer stones
    cut easier and smoother; the burr, being smaller and protruding less, will not
    bend over or break off as easily.


    ## FREQUENCY OF PEENING


    As explained in Chapter 5, the whetstone starts changing the “ideal” penetrating
    profile of the edge into a more rounded one from the first honing on. The variables
    affecting the time interval at which sharpening will be advantageous are therefore
    all related to how it is honed.


    I nearly always use fine stones and whet, on average, every 5 minutes. Mowing
    in a field where only an occasional rock would be found, I peen approximately
    3 to 6 hours. If I used the kind of synthetic whetstones prevalent today, I would
    halve that time.


    In many European traditions, 4 to 6 was a day’s worth of mowing. Lunch break (around
    7 or 8 AM) the blades were often touched up with the hammer. The only men who
    made a seasonal profession of mowing could be found out in the field the toome
    hours. Those who could afford to own two blades (the evening before) would switch
    halfway through the day.


    In view of the above, and from my own experience, the 15-minute whetting and 12-hour
    peening frequencies recommended by Tresemer are exceedingly long. Even if I were
    a strong man, I would consider it a poor expenditure of energy to coax a blade,
    maintained on such a schedule, through the grass. Perhaps I am lazy, or simply
    like to hammer scythe blades.


    The time taken to accomplish the task of peening would not concern me at all.
    The quality of the results is directly related to patience and attention to details.


    Using the jig, it can be done in perhaps 10 minutes (5 minutes per cap). I prefer
    the freehand method, and after hammering many dozens of blades, still take 15
    to 20 minutes for one of average length. It is my very enjoyable centering period
    of a summer’s day.


    However, I would find it difficult to cover the intricacies of freehand peening
    here, so please forgive me for omitting it.

    '
