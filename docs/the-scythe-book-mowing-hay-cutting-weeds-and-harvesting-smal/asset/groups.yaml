    源自 snath。这种联系是微弱的，而且似乎并不奏效。关于亚述述人在战车轮上安装镰刀以收割敌人的传闻是一种误译：这种目的是通过使用小刀和剑来实现，而镰刀是做不到的。事实上，镰刀正是对土地进行和平、定居式耕作的象征。在《以赛亚书》（第2:6）中，那些放弃战争的民族“要将刀打成犁锄，将矛打成镰刀”。对于约翰·米尔顿（John
    Milton）来说，镰刀也代表了和平的田园生活：


    当近处的耕夫

    在布满垄沟的土地上吹着口哨，

    当挤奶女欢快地歌唱，

    当割草者正磨着他的镰刀。


    在技巧章节中引用的每一位作者，都提到过刀刃用石头磨利时发出的那种美妙的响声。


    那么，既然镰刀的其他内涵是如此良性的，为什么时间和死亡却要挥舞镰刀呢？因为收割的节奏是如此强大且迷人，以至于它感觉就像时间一样，不可阻挡。草木不可避免的倒下与我们生命的不可避免消逝之间存在着一种对应。“因为他们像草一样被割除”（诗篇，37:2）。这种强迫性的节奏比我们经历过的任何工具都更强大。时间可以有一把锤子到处敲头，或者有一把锯子，或者……所有这些其他工具为死亡带来的想象都比收割和采收更恐怖，而收割这些行为与地球的季节并行，正对应着一个人生命的繁盛与消亡。在创造的节奏中，死亡的收割也与春季对生命的重建希望相联系。


    > 没有任何东西能抵御时间的镰刀

    > 唯有繁衍，能在它带你离去时勇敢面对它。^{60}


    因此，谷物和收获它的工具，一直与死亡和埋葬、受孕和出生联系在一起。


    专门处理收割结束、将大地果实带回家的习俗因地而异。一种共同的体验是，当最后一车谷物或干草在欢呼和歌声中被运回谷仓时，会感到一种完成、从劳作中解脱的感觉：


    > 丰收了！丰收回家了！

    > 我们耕了，我们播了种，

    > 我们割了，我们收了割，

    > 我们把所有的收获都带了家。

    > 丰收了！丰收回家了！

    > 我们想要水却得不到！


    结束了，但并未完全结束。自古以来，各地农耕习俗中一个共同的主线是相信：最后一束草承载着作为特定地区主要谷物的“生命灵魂”（“玉米”）。所有的收割者现在都会割下最后一束被收割压平的玉米。这一时刻具有极强的魔力；此时此刻路过田野会遭到白眼，而割草者会大声地磨他们的镰刀，或者有人拿着镰刀威胁性地向他走，或者他会被绑起来并做出砍掉他头的动作。陌生人被视为对重要仪式的干扰，也被视为灵魂的化身。通常，整个麦穗会被编织在一起，偶尔会被装扮成“玉米娃娃”（Corn
    Dolly），用来主持丰收晚宴并一直保存到下一次丰收。我也曾感受过在镰刀割平的田野和成堆的捆草中，最后一束谷物蕴含的能量。当最后一点被切断时，能量去了哪里？我不知道，但我理解那种对最后一束进行特殊对待的冲动，仿佛能量留在了它身上，我也以特殊的方式对待我收获的最后一束谷物。作物的丰歉由农神女神保障——希腊人的德墨忒尔（Demeter），罗马人的刻瑞斯（Ceres）。图30描绘了一个古希腊使用的德墨忒尔还愿面具，上面的祈：“愿它属于我，让那巨大的风扇筛过她的草堆，而当她手里拿着罂药站在微笑时。”在更近的时期，玉米娃娃在春季的冬季和新作物季节代表着母亲的保证——因此，在秋季的丰收庆祝中，她受到尊重，直到她回到草地。那种完美启示的伟大而神奇的奥秘，一株被割下的谷物，在基督前之前的数千年里一直是农业仪式的中心。从那时起，谷物作为饼，也一直与基督之躯保持着这种神秘的、宗教性的联系。![](img/27a09e01dbd329ab631e901469ce4b29_113_0.png)

    图29 死亡用镰刀收割


