    风干白蜡制成的直镰柄可以适应任何尺寸的成年人，这是其他可用镰柄都无法做到的。上方手柄是固定的。下方手柄可以在槽内调节，并通过两个承载螺栓和翼形螺固定（图 1）。该手柄的设置应距离上方手柄一个尺长，或稍远一点。镰柄非常长，因此必要时所有者可以自行裁剪刀跟的长度；当镰刀靠在刀刃跟部时，下方手柄应恰好位于髋骨下方。在镰柄中心，距离适配刀柄销的末端3¼英寸处，必须钻一个宽5/16英寸、深1/2英寸的孔（图
    2）。刀片按上述第2点的方法装配，并通过镰刀环的紧固螺钉固定。


    ## 锻打（PEENING）


    适用于奥地利模式的磨刀方法包含两个步骤：1) **锻打**：在小砧上敲击刀片；2) **磨石**：用磨刀石进行最后的精磨。


