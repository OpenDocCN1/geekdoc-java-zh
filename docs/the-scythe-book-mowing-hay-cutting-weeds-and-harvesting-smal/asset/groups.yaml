    my learning immensely, though that long sought, detailed “scythe user’s manual”
    is still but a dream. Perhaps it lies, dust-covered and forgotten, in some computer-less
    library—“The Zen of Scytheing”—written by a real master of this ancient tool.
    Until I discover it, or a true authority is found to take on the task of writing
    such a book, I humbly submit to serving as a poor substitute and hereby offer
    you a brief summary of what I have learned thus far.


    What David Tresemer did for all of us was that he fanned the embers of a dying
    fire. For this I am grateful and herewith add more fuel to the flickering flame.
    In doing so I hope to increase the probability that this most amazing and multi-faceted
    of the tools I have been privileged to use will gain broader appreciation. Not
    as one of necessity in the hands of toiling peasants as it was in the past, but
    rather as a tool for the visionaries of a better tomorrow.'
  - '[PAGE 126]


    # # I Clarification of Terms


    SOMEWHAT RELUCTANTLY, AND IN AS FEW INSTANCES AS POSSIBLE, I CONTINUE referring
    to the subject of this book as the “Austrian style scythe.” It is convenient to
    do so, because David Tremeser—or someone before him—established the term in North
    America and many readers at least partially know what is meant.


    However, it is a misnomer, which does not acknowledge the fact that this type
    of blade has also long been made in other European countries. In the respective
    languages the tool is merely referred to as a scythe (and this is my preferred
    term as well). Sometimes, if the country of origin is known and it is desirable
    to mention it, the blade is given the prefix of “Austrian,” “Russian,” “German,”
    etc. to emphasize its reputed quality relative to another.


    Apart from Austrian-made blades, others of the same “style” have been imported
    into North America for well over a century. Most were models not used in Austria
    at all, even if made there, and some were forged in Germany, France, Sweden, the
    former Yugoslavia, or perhaps elsewhere.


    It would therefore be more accurate to call all of them collectively “the blade
    style of Continental Europe” as distinct from those made and used in the British
    Isles and North America. What differentiates them more significantly than their
    physical shape is the property of tension incorporated into the steel during the
    process of manufacture, which allows the former to be lighter in weight, yet still
    retain its shape in use. The British and American-made blades were not tensioned
    and therefore, relative to the task for which each respective model was made,
    had to be heavier.'
  - '[PAGE 127]


    I do not refer to the latter as “hard stamped”; in fact I do not use that term
    at all. Having held in my hands many samples of the “American Pattern,” I detected
    only one, which was distinctly stamped. It was a brand new blade of old inventory
    I found in an Amish-owned hardware store in Indiana with a label “True Temper,”
    Made in USA. How many European scytheymakers stamped blades I do not yet know,
    though I think that it would have been very few. The best of them would not have
    dared to mark their reputation in this way. The chief technician in the Austrian
    factory which presently supplies most of the stock in America personally assured
    me that they had never sensed a blade of any kind. (Hay and straw knives, swords
    and, course, sickles, have also long been forged there.)


    Using “stamped” as a blanket term for all non—“European style” blades discredits
    the skill of all those British and American blacksmiths who did forge their creations.


    The concepts of hardness and “peenability” of these flat blades I discuss elsewhere
    in this text.


    A born European, for reasons irrelevant “America,” as a reference to that big
    place over the ocean, usually includes the USA and Canada. After living on this
    continent as a Canadian, for 33 years now, the associations remain to me, for
    the most part, unchanged. Thus, instead of specifying USA or Canada, I use “America”
    as a term inclusive of both.


    *Sharpening*, in technical jargon, is a two-step process consisting of i) beveling
    and ii) honing.


    My attempt here is, therefore, to avoid the use of the verb “to sharpen (the blade)
    whenever I am talking specifically either “beveling” or “honing.”


    Thus, for example, I will not write: “In the field, during mowing, the blade must
    be *sharpened* every five minutes.” Instead it would read: “…honed every five
    minutes. *Whetted* would also be correct. Because honing, at least in my mind,
    is more indicative of the finer abras, which I advocate, I prefer this term and
    use it more frequently.


    It may be pointed out that “honing” also bevels the edge, albeit to a lesser degree.
    This is true, and I will endeavor not only to explain that it is, but'
