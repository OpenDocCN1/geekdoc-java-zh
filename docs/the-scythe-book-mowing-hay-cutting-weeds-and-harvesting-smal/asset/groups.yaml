    Sometime in the fall or winter I take the sheaves of grain apart and separate
    the kernels from the straw and chaff by threshing: hitting them over the back
    of a chair, banging them around a barrel, jumping on them, or driving heavy-hooved
    animals over them, flailing them, or using a threshing drum. The two-piece flail,
    used since the fourth century, is a six-foot pole to which is hinged an eighteen-inch
    beater or swingle or sweepsle made of hardwood or occasionally knotted rope. The
    swingle is brought up easily to shoulder height and brought down along its full
    length onto the thick pile of opened sheaves with a thump, then again, and again.
    The blow need not be violent nor exhausting; the grain is not out, but shook out
    of the deep pile of straw by the blows of the flail. As scythe, there is a rhythm
    intrinsic to the task of threshing which makes the work easier. The leader of
    threshing teams coordinated the succession of blows with work songs or chants
    or even dances specific to threshing.


    The problem of design is the material for the hinge. Even leather wore out quickly,
    so elskin was used whenever available. Robert Johnston has proposed an excellent
    design to keep the swingle from getting tangled in its own hinge material (Figure
    28). The heavy wheel revolves freely around the notch at the end of the handle
    so the twine does not get too twisted.


    A field before harvest may look like amber waves of grain, but threshing reveals
    that the kernels are a small fraction of the weight taken from the field. The
    quantity of chaff and straw seem prodigious by comparison to the pile of kernels,
    which are one twenty-fifth of the whole, and a smaller fraction of the volume.


    Wheat, rye, and buckwheat thresh easily. Only the "naked," or "hull-less" varieties
    of barley and oats thresh easily. The hulled varieties require more work with
    the flail; heating and light grinding also removes the hulls.


    Threshing with a flail was considered the hardest work on the farm because of
    the large quantities of grain that were required to feed the'
  - '[PAGE 107]


    livestock. Mechanized threshers were greeted with a cheer. However, neither threshing
    nor any task is drudgery when done on a small scale; also, the work is definitely
    practical, and is valuable experience. Of the flail separating the seed from the
    hull and stalk, H.J. Massingham said, “The man who swung the flail was a person
    who molded the sources of life; the man who tended the machines risked himself
    to the inanimate.”55


    The early threshing machines to which Massingham referred were very large, noisy,
    and dangerous. In contrast, the foot powered threshing drum, used widely on small
    quantities of grains in Japan (and pictured in Fukuoka’s One Straw Revolution),
    is a cylinder of wooden slats covered with wire loops rotated away from the operator
    by a treadle at 350–450 revolutions per minute. The straw is held in both hands
    over the moving wire loops, which beat the kernels out. This machine supposedly
    thresses six bushels an hour, with less risk of cracked kernels than in flail-threshing.
    However, in a series of experiments comparing the rotating drum to threshing with
    a flail, I found that the rotating drum performs best only when the kernels are
    extremely loose in the grain head. If the kernels are easily detachable and the
    sheaves are held carefully over the many steel fingers, the threshing drum takes
    the same amount of time as the flail—from a half hour to an hour per bushel—for
    an average of one third more kernels. Hurrying, however, decreases the yield below
    that of the flail. The expense of the threshing drum seems justified only for
    large quantities of grain.'
  - '[PAGE 108]


    ![](img/27a09e01dbd329ab631e901469ce4b29_108_0.png)


    **Figure 28** Attachment of swingle to handle


    Roller threshers which take in the whole sheaf between two rollers, pressing the
    kernels out and bruising the straw for better value as livestock feed, were once
    made in one- and two-person models. But no longer; the same design is used in
    the small and expensive gasoline-operated threshers made in this country today.


    The straw remaining after threshing can be used for animal feed, for thawing of
    roofs, for animal bedding or garden mulch, for which it is superior to sawdust
    and hay, for straw rope to tie down haystacks against winter winds, or for the
    many beehives, baskets, and mats necessary around a farm, for the traditional
    straw birthing bed. Indeed, I met several European farmers who grow grain specifically
    for the straw to use with their vegetables or orchards; Fukuoka''s fertility program
    for barley and wheat depends entirely on returning the threshed straw to the fields
    with a little chicken manure. And straws of the threshed grain can be snipped
    between nodes to drink through, pleasing the children with the original organic
    drinking straw!'
