    the right relationship to the grass. The blade can, however, be manipulated to
    maximize the cutting angle.


    I cut, always, with the blade parallel to the ground; but this lets me two different
    approaches to the grass. If I put my left hand against my belt and bring the right
    hand around through the stroke, I can make a cramped slice. The opposite approach
    is to pull the whole blade straight across the grass like a cleaver hacking meat.
    Neither works works With the narrow slice, a mere two inches of grass is cut;
    with the broad hack, the grass tends to bend over. All mowing ideally combines
    the two approaches; in varying conditions I must alter the approach to have more
    slice or more hack. If the cutting is easy, I may reach out at the beginning of
    the stroke to increase the size of the swath, while sacrificing some of the slicing
    effect. If the cutting is difficult, I may wish to maximize the slicing effect
    and minimize the hacking effect by dossing the blade inward. Within the limits
    of the scythe ring, the blade can be shifted slightly in its seat to create the
    slice or hack effects (Figure 5), but I have found that the way in which I use
    my arms, as just described, is adequate to adapt to most mowing conditions.


    In some conditions I do not hold my feet stationary while cutting. I begin with
    my weight on the right foot; then, as my body begins to unwind, my weight moves
    onto the left foot. I move down the field in a slow walk.


    These and other variations are appropriate in different conditions of cutting.
    Experiment. The grass will teach you.


    The account given in Anna Karenina by Leo Tolstoy the nobleman Levin joining the
    peasants for a day of mowing is a fine articulation of the ease and style inherent
    in mowing:


    > The old man, holding himself erect, moved in front, with his feet turned out,
    taking long, regular strides, and with a precise and regular action which seemed
    to cost him more effort than swinging one''s arms in walking, as though it were
    in play, he laid down the heavy, even row of grass. It was as though it were not
    he but the sharp scythe of itself swishing through the


    > Juicy grass ...

    The longer Levin moved, the oftener he felt the moments of unconsciousness in
    which it seemed not his hands had swung the scythe, the scythe of itself, a body
    full of life'
  - '[PAGE 54]


    and consciousness of its own, and as though by magic, without thinking of it,
    the work turned regular and well-finished of itself. These were the most blissful
    moments.


    It was only hard work when he had to break off the motion, and to think; when
    he had to row a hillock or a tuff of sickle. The old man did this easily. When
    a hillock he changed his action, and at one time with the heel, and another with
    the tip of his scythe, clipped the hillock both sides with short strokes. And
    while he did this he kept looking and watching what came into his view: at one
    moment he picked a wild berry and ate it to Levin, then he flung a twig with the
    blade of the scythe, then he looked out quail''s nest, where the bird flew just
    under the grass, and caught a snake that crossed his path, and lifting it on the
    scythe as on a fork showed it to Levin and threw.


    For both Levin and the young peasant behind him, such changes of position were
    difficult. Both of them, repeating over and again the same strained movement,
    were in a perfect frenzy of toil, and incapable of shifting their position and
    at the same time watching what was before them.


    # # READING THE GRASS


    The grass will teach you how to mow better than words on a page or proddings by
    a teacher in the field. But you must pause to observe the grass if you are to
    learn its lesson. Clearly speaking from his experience, Tolstoy writes of Levin:


    > His pleasure was only disturbed by his row not being well cut. “I will swing
    less with my arm and more with my whole body,” he thought, comparing Tit’s row,
    which looked as if it had been cut with a line, with his own unevenly and irregularly
    lying grass.


    Look back over what you have cut. Do the cut ends of the grass slope to the right
    into the uncut grass? The blade is too high at the beginning of the stroke. Keep
    it down. Stop occasionally at the beginning of a stroke and look over at the blade
    to check its height.


    Are there tufts of grass between the swaths? The blade is too high at the end
    of the stroke, and you are probably trying for too wide a swath. You may also
    be throwing the cuttings into the standing grass. Step to left, take smaller bites
    of grass, and finish the stroke all the way to the left.


    Is there uncut grass in the middle of the swath? Sharpen your blade, and try more
    slicing.'
