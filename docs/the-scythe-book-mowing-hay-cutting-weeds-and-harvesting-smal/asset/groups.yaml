  mdcn: '

    将重量在双脚之间移动。这在“田间割草”时最为明显，尽管在进行许多短促的修剪动作时，我仍然（即使只是稍微）侧向摇动。这并不是我见过的任何传统镰草割法的特征，因此对于熟悉几乎所有东方武术动作原理（以及如何产生大部分力量）的读者来说，这种做法很容易被认同。


    将这些原理应用于割草时，值得强调的是，为了充分利用身体移动产生的动量，割出小于8英尺宽的路带并不是理想的。如果我坚持按照更传统的宽度（视地区而定，为5 到
    7 英尺）来割一个特定区域，会让我更加疲累。


    除了无法将身体动作与深呼吸的节奏同步外，我还无法利用腿部的天生力量。最好在切割时完全呼气（通过嘴巴），并在返回动作时吸气（通过鼻子）。短促的修剪动作无法做到这一点，尽管其他节奏仍然可以……


    使用“重心转移技术”，我们8 岁的女儿 Ashley 可以在密集的草丛中割出一条整齐的 8 英尺宽草带。承认的是，那是一个夸张的宽度，身高身高4英尺3寸。事实上，她更喜欢在杂乱的草丛或会限制这种宽幅动作的地形上割草。11
    岁的 Fairlight 的通常宽度是 7 英尺，当他们割草时，我尽量让 Ashley 割到那个宽度。经常，我回头一看，看到她再次逐渐拉长这个距离……


    图 16 是根据照片描勒的 Ashley 的真实轮廓（没有对尺寸进行“拉伸”）。她显然比我们大多数人认为舒适的高度要更贴地面，但这幅画可能会解释体重不足 50
    磅的人如何获得所需的速度并补偿手臂力量的不足。


    相对于我的身高，我站得并没有那么低或那么宽，尽管我的站姿（在田里）比大多数人似乎尝试过的要低。


    9 到 9.5 英尺是我喜欢的挥幅宽度，在右侧有高度差的微坡上，我可以割出 10 英尺宽的路带。对于每个人来说，无疑有一个最佳宽度，能够充分利用重心转移原理的潜力，同时又不会让任何单一部位劳累。


    ![](img/27a09e01dbd329ab631e901469ce4b29_175_0.png)


    图 16


    起初，那些不习惯需要侧向灵活性膝盖动作的人可能会觉得我夸大了上述测量值。有些人实际上告诉过我，他们的腿做不到那样。然而，在不引起自己不适的情况下，我建议你信任身体放松的与生潜力。我经常在仅通过一次专注的课程中就能看到非常振奋人心的进步。


    其中一个“秘密”仅仅在于学会让身体保持一些弹性，尤其是膝盖。对我来说，《割草者的镰刀》中所有的插图都描绘了他双腿笔直的样子。唯一的例外是第 34 页上的那幅旧画，我本该把它放在首页的。我的田间移动站姿更宽，膝盖弯曲更大，脚趾指向前进的方向。图
    17 所示的足间距离是我感到舒适的距离；它与人的身体比例、腿部状况和身高有关。


    ![](img/27a09e01dbd329ab631e901469ce4b29_176_0.png)


    图 17


    图 17 展示了如何应用规则 2 和规则 3。


    如所示，草堆大部分堆积在割出的路带内。只有一小部分（随草的密度和/或高度而异）会“溢出”到线之外。


    如果我是在田地中间割草，左侧的立草将“接住溢出的部分”，但不应被其推倒。因此，在完成这样一次作业后，我向左转并反转了方向；我可以割出一条路带，将新的草堆靠在第一条上。这种所谓的“双重窗口”下的残茬将没有未割的茎。


    向前的运动如下：如所示，草堆大部分堆积在割出的路带内。只有一小部分（随草的密度和/或高度而异）会“溢出”到线之外。


    如果我是在田地中间割草，左侧的立草将“接住溢出的部分”，但不应被其推倒。因此，在完成这样一次作业后，我向左转并反转了方向；我可以割出一条路带，将新的草堆靠在第一条上。这种所谓的“双重窗口”下的残茬将没有未割的茎。


