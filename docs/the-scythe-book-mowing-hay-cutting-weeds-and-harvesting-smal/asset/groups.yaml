    size twelve inches across. If the straws are too dry and brittle to tie, I use
    one or two weeds which are still green and tall from growing up at the edge of
    the stand of grain. Encircle the sheaf with the binder of straw or weed until
    the top and bottom of the binder overlap. Holding onto the very bottom of the
    binder, slip its top over its own base in a half hitch. Slide this half hitch
    along the base until the sheaf is bound tight. Stiffen the base of the binder
    back over the half hitch and tuck it under itself against the sheaf. A woolder
    for tying sheaves is a block of wood two squares with a thirty-six inch piece
    of twine through a hole in the middle. One end of the twine is knotted so it is
    tight against the weed; the other end is wound around the sheaf and then around
    the twine beneath the wood block.


    Several sheaves are stacked against each other with the grain heads to form a
    stook or shock. There are traditions about how many sheaves of wheat, oats, rye,
    and barley make a stook, but I usually lean eight or ten against each other. In
    the stook the grain heads will dry and harden in the wind and sun. With one large
    sheaf draped over the top of the stook, even the rain will be turned away, although
    if the weather becomes wet, grain must be stacked or covered or brought into the
    barn. Thomas Jefferson had a large granary for every forty-acre field, where his
    grain did most of its drying. Some people like to stack their grain atop a platform
    that is proof against rats (off the ground on mushroom-shaped stalks), grain heads
    to the center, and thatch the top of the big stack or cover it with plastic. Whatever
    method you use, slow drying in the sheaf ripens the kernels so they will store
    well. Modern methods include heat-drying treatments, which often kill the germ
    of the grain. Taking the life away from the grain leaves no seed for next year
    and leaves the grain with questionable nutritional value. On the other hand, unless
    you have a fleet of carts, storing the sheaves loose in the barn for too long
    before threshing will transfer all the nutritional value to the rodent population.


    Not all the grain cooperates by falling into neat bundles as it is cut, and the
    field may look a mess after harvest. After one time the privilege to glean a farmer’s
    fields after harvest was coveted because of what was left.'
