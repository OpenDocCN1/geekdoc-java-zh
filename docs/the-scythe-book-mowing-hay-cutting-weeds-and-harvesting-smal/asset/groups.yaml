    + 23. Jim Worthington, Natural Poultry-Keeping.


    + 24. Also pictured in Brueghel’s “Haymaking.”


    + 25. Clarence Danhof, “Gathering the Grass.” Philip Wright, in Old Farm Implements,
    gives the wages for each of these tasks in Essex in 1661. While the actual amounts
    do not mean much in terms of current prices, they can be compared with each other
    to give an idea of the relative amount of time it took to do each job. The wage
    for mowing one acre of grass was 1/10; for raking and coking one acre of grass
    2/-; reaping, shearing, and binding one acre of wheat 4/-; ditto, rye 4/-; for
    mowing an acre of peas or vet 1/9/; for threshing two pecks of wheat 1/-. The
    monetary units are shillings and pence; at twelve pence a shilling. A comb is
    for British bushels, and 4.13 American bushels.


    + 26. About cowslip-water, Margoliouth quotes from a herbal of Marvel’s: “Of the
    juice and water of the flowers of cowslips, Gentlewomen know how to clean the
    spots from or discolor therein, as also to take away the wrinkles thereof, and
    cause the skin to become smooth and faire.”


    + 27. I observed these rakes at use in France. The same design is also pictured
    in Brueghel’s painting, “Haymaking,” from the Netherlands in the sixteenth century.
    Rudolf Drills (“Fork Norms and Biomechanics”) found the measurements of rakes
    by Latvians to be personalized: length of handle equal to one height plus the
    width of a fist, the rake head equal to one cubit, and distance between teeth
    equal to the width of two fingers.


    + 28. Construction of wooden hayforks and hayrakes is detailed in Drew Lansner’s
