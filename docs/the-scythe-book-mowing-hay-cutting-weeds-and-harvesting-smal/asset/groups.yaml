    European farmers had a single scythe, often as their metal implement. In the fourteenth
    century, Dubey reports that a scythe in Haute Provence was worth a fortune. A
    presentation of probate records by John Roper shows that scythes were also valuable
    in sixteenth-century England. By comparing the appraised values for scythes and
    other items in the probate inventories, such as horses, swine, and heifers, and
    comparing with modern prices for the same farm animals, we can guess a scythe
    blade at one shilling in sixteenth-century England was worth about $87 in 1981
