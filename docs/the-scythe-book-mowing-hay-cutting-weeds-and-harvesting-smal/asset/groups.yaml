    > 我们将欢喜而归，带着麦束。


    ——乔治·米诺尔与诺尔斯·肖


    小谷物播种在清理过杂草的区域，最好在前一年在该块地上种植过根类作物。你必须通过耕作将杂草排除在根类作物之外；谷物将受益于这种清洁的栽培。过量的氮和缺乏钾会导致谷物倒伏或歪，使收割变得困难。摇镰无法用于倒伏的谷物，倒伏的谷物必须尽快用镰刀或镰收获，以防止种子因太潮湿土地而发芽。倒伏的谷物可以像干草一样耙起并耕作。


    谷物可以在秋季或早春播种，取决于气候和农事安排。如果秋季播种太晚，或春季播种太早，寒冷潮的土壤会在种子发芽前将其腐烂。尽管产量较高，但八月或九月播种的冬小麦可能被严冬完全杀死。具有最高面蛋白含量以促进膨起的最优质面粉是春季硬小麦，品种如
    Neepawa、Olaf、Manitou、Justin 和 Selkirk。大麦、燕麦和荞麦也在早春播种，因为它们不耐寒。黑麦几乎可以在任何时间播种，因为它非常耐寒，只需要很短的生长长期；小麦长肥，黑麦长力”的说法可能更多是指生活在生长期短地区的人群，而不是谷物的营养质量。种子可以从袋子里用手撒播，但旋转式手摇播种机将产生更均匀的结果。在田里按一个方向来回交叉移动，然后以与第一个方向垂直或对角线的方向再次移动，以获得最佳效果；这种方法每英亩需要一小时。每英亩平均种子率为一百磅。


    播种后，必须通过耙地将种子覆盖土壤下，以改善发芽并保护种子免受鸟类侵害。干草耙在这里起到分级的作用，耙地时最好踩耙过的土地，因为脚会将覆盖的种子压入土壤。对于较大的区域，有机器可以一次完成播种、埋种和压实土地。


    同时播种三叶草或苜蓿是个好主意。当谷物收获时，生长较的豆类植物将生长到秋季，为土地提供越冬保护，并在春天提供干草。


    关于向各个方向撒播（用手或用旋转机器）的播种效率，乔治·塞尔引用了撒种者的比喻：


    > 有一个撒种的人出去撒种；他撒种时，有些种子落在路边，被野兽吞了；有些落在岩石地上，那里没有土，它们就发芽了，因为土不深；当太阳升起时，它们被烤焦了，因为没有根就枯萎了。有些落在刺丛中；刺丛生长起来窒息了它们；但另一些落在好地上，结了果实，百倍、六十倍、三十倍。


    塞尔用这个故事作为播种机优越性的证据，播种机开一条小沟，将种子掉入其中，覆盖并压实上方的土地。如果有播种机，可以使用老而可靠的 Planet Jr. 行播器，可以将谷物密集地行播，行间距为十二英寸。播种机可以调整种子率、锄深和行间距，这些都根据土壤和气候限制内的实验决定。行间空间可以在生长季节内耕作或锄除一两次，以抑制杂草的竞争。行间作物的产量通常比撒播法好，且成熟谷物中的杂草问题较少。行播是欧洲有机农民中一种流行的行方法。然而，这涉及的工作显然更多，如果起初就有杂草，我就使用撒播法，并将撒种者的比喻当成一个比喻来读。


    1911年，美国农业部土壤管理处前主任 F. H. King 出版了他的《东方之旅》回忆录，他在那里发现生长在丘上或成丛的小麦，平均每丛四十六株。丘与丘之间的行距为二十四英寸，行与行之间为十六英寸，每对行与相邻的行对之间为三十英寸。丘间的空间在每场雨后都经过仔细锄除以消除杂草，掺入经常施用的人类粪有机肥，并创造一种保持水分的蓬松覆盖物。Mulking
    观察到的收获为每英亩12蒲耳，但计算出1901年的丰收为每英亩116蒲耳。


    什么时候应该收割谷物？农书给出了令人恼火的答案：在准备好的时候。和其他农民一起工作以及我自己种植谷物，我惊讶地发现没有更好的答案了。当你把指甲按入即将收获的谷物颗粒时，它不应该在“乳期”阶段喷出内容。但当它变得非常硬时，也准备好脱落；那时植物被切断时，穗头关闭，所有的种子都会不可挽回地落在地上。在两掌之间搓揉穗头以判断是否处于“硬壳期”。


    无论用大镰刀还是摇镰，收割的动作都比割草要宽，砍割动作较少。用摇镰时，左手尽可能靠近地面以保持摇镰直立。右手在挥动结束时抬起，将货物倾倒，头部远离未收割的区域。用镰刀时，左手在挥动结束时突然抬起，从而使头部指向未收割的区域。向左摆动过多会导致草混杂。镰刀比摇镰轻，但需要更多控制。谷物更容易割干草，因为穗头的重量和茎的高度使植物具有惯性，使其弯曲而非折断。由于这种更大的易割性，1921年的《农业百科》建议调整动作和镰柄的角度来调节宽度：12-14英寸，而干草地和牧场为6-9英寸。


    收割时，辅助人员比割草多得多。托马斯·杰斐逊在1795年雇了58个人收割他的小麦：


    - 18名摇镰者

    - 18名捆扎者

    - 6名收集者

    - 3名搬运工

    - 6名堆垛工

    - 4名运车工

    - 2名厨师


    第五十八个人是工头或“收获主”。1812年，他记录了15名摇镰者、15名捆扎者、16名收集者（这包含了搬运工和运车工）、4名堆垛工和2名厨师。收集者、搬运工和堆垛工通常是孩子。他将这群描述为一台“机器”，


    > 在精确的平衡下，任何部分的减少都不会损害整体，任何部分的增加都不会浪费力量……这每天能收割、运入并堆垛54英亩，并在6天内完成320英亩的收获。


    Stephens建议将收割组织为单位：两个镰手（不带摇镰）、两个收集者、两个捆扎者和一个耙子。


    显然，用镰刀收割谷物的时间只是整个收割过程的一部分。每一割谷物都必须聚集成麦束，并用两三根草结简单的活结扎在一起。麦束的直径由捆扎用草的长度限制，尽管有用于检查麦束的旧量规

