    图32 怀抱小麦


    我们在11月下旬举行的感恩节庆祝源于这一同样的传统，尽管它已经丧失了与季节律动的联结，失去了那种对田间和园子工作结束的感觉，也失去了那种谷仓和家中满载大地果实、为冬季提供滋养保护的感觉。现在，那些被模糊遗忘的丰收旋律，通过礼品商店出售由非专家手工大量生产的编织玉米娃娃而被拨动。但全年供应的丰收小装饰并非生活在土地上的重点。玉米灵魂的化身不必是一个美观、可售卖的物品。它的目的是通过一个符号，强化农场主/园艺师通过农业与一小块土地的交融。对我来说，埃米尔·贝尔纳德（Emile
    Bernard）在图31中创作的丰收画，最有力地唤起了与玉米灵魂交融的情感，以及从地上汲取维持生存所需的能量。


    对地球律动的依恋在现代工业时代可能会迷失，且难以找回。虽然我们不再记得有几十首可以在丰盛的丰收晚宴上吟唱的传统丰收歌，但与大地建立深层联系的体验始终随处可得。它就在家门外。苏格兰的芬德莱社区（The
    Findlay Community）甚至在与植物以及环绕它们的罕见的灵性生物互动中，将对更高意识的追求提升到了更清晰的水平。我不相信这仅仅是因为他们写了一本关于此的书。我很务实。当我与草木、杂草和谷物说话，并花时间倾听回应时，这会改变作物的性质吗？这会改变我播种、收割和食用的体验吗？

