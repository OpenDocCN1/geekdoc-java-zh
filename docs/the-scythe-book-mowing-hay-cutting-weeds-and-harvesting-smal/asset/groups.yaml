    图 8 修整：锤子、刀片和砧板


    刀片。整个修整过程需要五分钟，应每使用十二小时进行一次，或在需要时校直刀片上的意外凹痕。


    对淬火过的刀片进行冷锤，每次敲击都会拉出一点钢材，以保持理想的厚度。大多数人不相信在没有铁匠炉的情况下可以塑造钢材。对于坚硬的“美式”刀片，这可能是不可能的。然而，高质量淬钢的晶体结构是可以被塑造的。


    在冷作的分子排列中，钢变得应力硬化，而不会失去在剧烈压力下发生变形的能力（延展性）。然而，如果敲击过度导致边缘过薄且变脆，刀片会在薄弱处断裂。修整的目的是保持大师铁匠打造的原始刀片的刃角和厚度。一个经验法是像图
    8 所示握住刀片，用大拇指甲向上推边缘。如果边缘在压力下可以轻微移动，那么厚度就是正确的。如果它完全不动，则需要更多修整。如果它移动但没有弹回原位，说明你敲的时间远超过五分钟！


    许多人声称他们不可能沿着刀片的整个长度敲击，而且敲击很快就会耗光整个刀片。事实如此。我见过几把刀片每季使用二到三十年，它们比原始宽度窄了 1/4 到 1/2
    英寸。边缘不再完全平直，而是变得有些波浪，这表明磨损和磨削不均匀。然而，对于镰刀来说，这是可以接受的，不会损害它的性能。正如艾德里安·贝尔在《苹果农场》中所说：“他的镰刀像海浪一样起伏；每一处缺口都是他劳作的历史。”


    如果刀片不小心撞到隐藏在草丛中的石头或树桩，边缘的一个部分可能会变迟钝、弯曲，甚至可能出现长达 1/6 英寸的裂缝。为了避免这种损坏风险，首先不要要求镰刀承担斧头或长钩刀的工作。这些高质量的镰刀刀片可以切断一年的树和灌木，但不能切断直径像手指或更大的树干。然而，石头、围栏的意外，以及修整是校直凹痕的唯一方法。锤子和砧板是轻量化的，留有孔可以系绳子，以便方便地携带到工作地点应对此类紧急情况。通过反复敲击凹痕周围，你让刀片恢复原形状。而且，如果你足够聪明，借此机会移除或清晰地标记障碍物。


    ![](img/27a09e01dbd329ab631e901469ce4b29_36_0.png)


    图 9 修整时的锤击序列


    ![](img/27a09e01dbd329ab631e901469ce4b29_37_0.png)


    图 10 修整时固定镰刀的简单方法


    当盯着一个大凹痕看时，我必须提醒自己，刀片有凹痕比没有凹痕要好。凹痕是可以修复的；没有显示应力迹象的刀片会将损伤储存在微小的裂纹中，这会缩短它的寿命。


    # 磨石


    > 带着欢快的木杖和笑语

    > 我们挥动着尖叫的磨石。

    > WILLIAM ALLINGHAM, 《割草者》, 1865


    用石头润湿可以使刀片获得均匀的剃刀般锋利，并在工作期间定期进行。你每割完一片干草地，或者说你割了十五分钟的量，然后停止三十秒或一分钟磨刀。从硬质压制刀片的传统来看（它们从未像锤敲过的刀片那样锋利，且只会缓慢失去原有的锋利），这种休息被认为是懒惰的。然而，质量更高的刀片通过这种对锋利的定期关注，换来了更彻底的切割，从而需要更少的力。常规的磨刀不是浪费时间，因为割草者拿着更好的工具重新开始。使用钝刀会促使在割草时更用力地挥动镰刀——这既疲累又具有潜在危险。章节开头的两句引用显示了关于应该花多少时间磨刀的观点冲突；但我更倾向于每当我打破割草的专注状态就尽可能多磨。这可能是十五分钟。


    从历史上看，磨石是从合适岩石的自然露头处切割而成的。自从1906年大量生产且更廉价的合成磨料出现以来，天然石的使用越来越少。五金店的镰刀石通常由加拿大的碳化硅或氧化铝制成，用树脂粘并在
    2500 华氏度下烘烤。这些普通石头对于精钢刀片来说太粗糙了。欧洲的碳化硅石目数更细，更适合在锤敲过的刀片后使用。天然石的目数还要细得多；当用于最后的精细加工时，它们为边缘带来了一种完美感，初学者可能察觉不到，但经验较少的割草者会对此感激不尽。


    | 石头类型 | 目数 | 备注 |

    | :--- | :--- | :--- |

    | 普通石头 | 50 | 碳化硅或氧化铝 |

    | 欧洲石 | 120 | 目数更细，用于修整后 |

    | 天然石 | 320 | 极细目数，用于最终加工 |


    建议初学者缓慢进行磨刀，并戴着手套。镰刀片可以牢固地靠在树上或插入地面以保持稳定。用布或草擦净刀片。石头相对于刀片的角度为零。你应该能看到边缘1/4 英寸处在磨刀时变亮。刀片的刃角由刀片正面决定。缓慢润湿；正确的角度比速度重要得多。如图所示，从石头的基部开始，到石头的尖端结束；从根部到尖。这种顺序的原因是微小的锯齿是朝刀片方向建立的。这些锯齿有助于切割。如果我是在磨剃刀，我会从尖部开始，朝刀片方向回磨，以消除偶尔在刀片边缘之外产生的极小毛刺。对于割草来说，这种毛刺不会影响切割，而且很快就会脱落。无论如何，将磨石和手远离边缘比向边缘移动更安全。


    一种传统建议磨刀者站在那里，让光线落在左肩上，以观察石头是如何作用于边缘的。有人说磨刀时刀片不应指向北方或南方。事实上，地球磁场与刀片边缘钢分子的排列之间存在相互作用，但它们非常细微。


    磨石架（见图 11）在运输过程中保护易碎的石头。它还能盛少许水（宾夕法尼亚德国人会与醋混合），以便清理磨刀期间堵塞石头孔隙的微小金属颗粒。旧式的刀架是由牛角或精制木头制成的，具有独特性。但牛角稀有且木头会开裂，它们已被带有腰带夹的硬塑料架所取代。


    图 11 磨石与磨石架


