    # 老人的礼物


    “镰刀必须跳舞，”老人说道

    “是的，我脑海中可以想象那个画面；

    但这一步是先做的还是后做的？

    我可没读过相关的指南。

    在你临终之前，我会教你每一步吗？”


    “看我怎么做——现在仔细看！

    你将学会这种舞蹈——我会教你如何做。”小女孩微笑并鞠了一躬，

    她想着满是芬香干草的收割，

    以及她那头孤牛的绿叶饲料。


    他们每天清晨在草地上相遇，

    在黎明到来前起舞。

    一个教动作，一个学姿态，

    石头经常从盛满水的角上滑落，

    刀刃平稳地割过青草和玉米。


    自豪地看着整齐的收割区域，

    她掩饰不住内心的感激，

    感谢身边的老师，

    为了这项让心灵如此欢畅的技能——老人临终前的礼物。


    FAYE ABEND VIDO

    2001年1月


    # 引言


    在学习的某个时刻，我们可能所谓的“完整”的每一个版本，当然只是相对的；知识之径是无限的。大卫·特雷梅泽（David Tresemer）对镰刀相关的研究，用他的话说……已经“尽所能。”当我偶然遇到《镰刀书》（The
    Scythe Book）时，发现竟然有人对我正要爱上的这种工具写了这么多，这真是令人兴奋。今天，我感到沮丧，因为我目前为止找到的所有关于如何使用镰刀的文字都缺乏深度。


    尽管如此，特雷梅泽在书中包含的割草诗歌和古代记载，以及某些段落形而上学的色彩，最终发挥了作用，也许是重要的作用，激励我继续搜寻。


    对于工具本身，我可以从其自身的价值表示欣赏。我在斯洛伐克长大，虽然是个镇上孩子而非农村，但我经常看到镰刀。我推断，这是一种收割大面积饲料的高效方法，否则尽管社会主义制度有种种缺陷，它不会如此依赖它。在共产政权时代结束并带来某种“自由”之前，所有的路边水沟以及城镇界限内的草地都是由老人们用镰刀修剪的。[参见注释
    1]。


    巧合的是，就在那个夏天，一个来学习如何使用刷子的农场学徒带了那本《镰刀书》（在此之前从未见过），与此同时，我来自斯洛伐克的父母也在这里进行长时间拜访。我正在教学徒如何使用包括镰刀马拖式割草机在内的其他工具在内的工具，而我父亲拿着一把我在拍卖会上花几美元买的旧镰刀，去修剪那些马力机器无法到达的地方。幸运的是，那把镰刀由一个欧式的奥地利制造刀片组成，带有高刀背，安装在一个比平均水平更好的轻铝刀柄（snath）上。我父亲不是个话多的人，因此《镰刀书中的哲学很好地补充了发生的事情。我试用了镰刀并立刻喜欢了，尽管直到下一个季节才开始使用。一场剧烈的风暴让几英亩黑麦变得一团糟，任何机械切割机在收割时都是无用之力的。用镰刀，我可以顺着风的路径，根据茎秆所需方向在田间穿行。这种感觉很有力量，我割光了每一处，外加几英亩长得良好的倒伏谷物。


    明年夏天，当我仍在用马收割 50 到 60 英亩的土地时，我追随着父亲的足迹去了那些小地方……


    然而，刀刃的冷锻是另一回事。回到1977年，我的老农场导师的第一堂课是：铁匠只有两种罪会下地狱。第一种是锤打冷钢；第二种是不够用心。钱对我父亲来说意义不大。因此，他从未向我灌输过能量是一种受荣誉的交换手段，所以我已经处于不稳固的基础上了……去地狱还不在我的计划之内；除此之外，手工割草实在太有趣了。


    但有一句斯洛伐克谚语说：“修火之刀刃，如面包之割草者。”大卫·特雷梅泽赞同了这一点。于是，冒着进入地狱之门的风险，我尝试了修火。这时我才发现修火是一项至关重要的技能。


    面包之割草者，修火之刀刃。没有适当的修火，刀刃就会失去它的锋利和能力。大卫·特雷梅泽的作品强调了这个过程的重要性，而这在现代割草技术中往往被忽视。


    ## 术语解释


    将“冲压”（stamped）作为所有非欧式刀片的统术语，贬低了所有锻造其作品的英国和美国铁匠的技能。区分批量生产的冲压刀片和手工锻工具是重要的。后者通常具有前者无法比拟的质量和耐用性。


