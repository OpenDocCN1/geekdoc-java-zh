    在有更详细的笔记出版之前，我想给你们一个建议。请在旧的“美式”刀片上练习锻尾（即使使用夹具也一样）。这些刀片通常只需几美元就能买到，可以保护你的好刀片免受磨损。


    - 我还没有遇到过无法锻尾的刀片；事实上，有些刀片的反应甚至比近期生产的刀片更好。缺乏经验的人可能会使之开裂（这本身就是一个很好的教训和练习修复刃口的机会），但并不是因为它们太硬。


    - 反之，这些刀片的刃口两边都太厚且圆了。如果在没有被夹具盖板或锤子良好支撑的情况下受到击打，它们会开裂或崩口。最初将斜面磨得更平整会有帮助。


    ## Note


    - *The Gift of Good Land, North Point Press, 1981*


    ## VII

    ### 野外磨刀


    为了在野外保持刀片易于切割，需要非常频繁地磨削。取决于植物固有的韧性及其成熟度，以及一天中的时间（见第148页），我的平均做法是每割5分钟后磨一次。这花费我大约15到20秒，不包括擦刀片的时间，擦刀应在每次磨刀课程之前进行。


    我很少进行超过一次完整的“通过”（从刀柄到刀尖），使用磨石时采用短促、叠加且交替的动作，并仅使用手腕动作。这种方法很快且节奏良好，尽管学习这种技巧时一次集中在一侧会更容易。


    到目前应该已经清楚了，重点是磨刀片的正面（带有主斜面的那一侧）。在刀片背面使用磨刀石的主要目的是去除或对齐“毛刺”。考虑到这一点，我在斜面上使用石头时施加双倍的压力，尽管观察者可能察觉不到。延迟会导致刃口背部不可避免的圆钝，即产生短的“背斜面”。


    图9代表了三种基本的“石刀角”角度示例。事实上，考虑因素可能会变得复杂得多（类似于木工凿刀的斜面角），因为除了了解切割材料的性质外，角度还取决于在锻尾过程中刃口上精确产生了多少“磨凹”效果，以及镰刀匠在刀片主体中融入的曲线。


    ## a) b) c)


    | 刀脊 磨石边缘 |

    | :--- | :--- |

    | “通用”角度 | 可能适用于未锻尾（即圆刃）和/或灌木刀片的角度 | 适用于非常弯曲主体和/或磨凹刃刀片的角度 |


    图9


    c) 位置是最弯曲的刀片和刃口所需的。相反，在曲率较小的刃口上使用此位置将导致最小的斜面角（这意味着渗透力更好，但耐用性也较低）。这要求磨石尖端不要沿着刀脊运行，而是在其下方，几乎触及刀片主体的中心。a)
    和 b) 中随磨石角度位置的说明将是自而见明的。


    磨刀时镰刀如何握持并不重要，重要的是刀片要稳定，割草者要舒适。我偏好的位置是刀片横跨在我面前，指向我的右侧，这样我就可以观察它的背面，如图10所示。


    ![](img/27a09e01dbd329ab631e901469ce4b29_162_0.png)


    镰柄（snath）在开始或磨刀期间不需要保持垂直位置。将其一端放在地面上，使刀片的角度允许以舒适的方式进行磨刀，有助于保持所需的石刀角，从而提高效率。


    我有些奇特的个人技巧在于，我继续在正面前磨刀，同时通过左手手指沿着刀脊“爬行”，让刀片逐渐向左移动。这样做效果很好，因为左手始终非常靠近石头正接触刃口的地方，以便在该处提供稳定的支撑。


    在我们离开镰刀这个话题之前，可以补充几点反思：


    ***


    关于镰刀有很多话说，但我将重点放在石头上。天然石比近期生产的合成石好得多。它们更耐用，而且保持刃的能力更好。


    ![](img/27a09e01dbd329ab631e901469ce4b29_163_0.png)


    图11


    然而，天然石因以下用途而倍受欢迎：


    - 1. 使用夹具进行初始处理。

    - 2. 去除“背斜面”。

    - 3. 刃口修复。

    - 4. 其他工具的成型。


    '
