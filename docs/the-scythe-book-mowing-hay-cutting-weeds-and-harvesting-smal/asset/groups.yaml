    England. Inexperienced mowers would be wise to take smaller bites walking a bit
    to the left, even walking in the cut grass of the previous row. It is no disgrace
    to be cutting a swath two feet wide. The importance of a clean cut over a wide
    cut is illustrated by the scoring systems of mowing contests. At the annual meeting
    of the Dairy Herd Improvement Association of Sullivan County, New Hampshire, 45
    points are offered for neatness of the stubble, 30 points for width of swath,
    15 points for time to cut one fifty feet long, and 10 points for making it to
    the end. In the Austrian national mowing competition, the time is recorded for
    cutting an area 10 meters square (1076 square feet), and time is subtracted for
    sloppiness of cutting. The width of the swath is not counted at all, which seems
    to me fairer to different sizes and shapes of people. The emphasis is on speed
    and the amount of cleanly cut grass, which is after all aim of mowing. The same
    emphasis on a clean cut was made in the Library of Useful Knowledge in 1830: "The
    mowing should be so performed, that neither the strokes of the scythe nor the
    junction of the swaths can be discerned."


    Most it is not strength which permits a wider cut but rather the proper twisting
    to store energy in the tendons. The length and breadth of the swath also vary
    with the crop to be, its condition, and the evenness of the terrain. Poor grasses
    that are short and brown in August on hilly stony soil are obviously harder to
    mow than tall weens in May on level ground.


    # SMALL ADVANCES


    Although it is best for the beginner to stand erect without stooping over, or
    she will have the experience of being pulled forward when the width of the swath
    is increased. When this position becomes a stoop, it should be abandoned; the
    knack of positioning yourself in mowing is to learn how to lean into the work
    without losing balance.


    Even following all the rules of technique, there are still opportunities for variations.
    The snath and blade are manufactured to hold the cutting edge in'
