    from the snath. Such a connection is tenuous, and did not seem to work well. Stories
    that the Assyrians attached scythes to their chariot wheels to mow the enemy down
    are a mistranslation: knives and swords were used for this purpose, while scythes
    could not be. In fact, the scythe is the very symbol of peaceful, settled farming
    of the land. In The Book of Isaiah (2:6), the nations that have given up war “shall
    beat their swords into ploughshares and their spears into scythes.” For John Milton
    also, the scythe represents the peaceful pastoral life:


    While the ploughman near at hand

    Whistles o''er the furrowed land,

    And the milkmaid singeth blithe,

    And the mower whets his scythe.


    Every author cited in the section on technique has referred to this sweet ring
    of the blade when sharpened with a stone.


    Then why, if the scythe''s other connotations are so benign, do Time and Death
    wield a scythe? Because mowing has a rhythm so strong and compelling that it feels,
    like Time, unstoppable. There is a correspondence between the inexorable laying
    down of the grass and the inexorable laying down of our lives. “For they shall
    be cut down like the grass” (Psalms, 37:2). This compelling rhythm is stronger
    than with any tool experienced. Time could have a hammer and knocked heads about,
    or a saw, or ... All these other tools conjure more grizzly images for Death than
    does mowing and reaping, acts linked to the earth''s seasons in parallel to the
    thriving and passing of a person''s life. In the rhythm of creation, Death''s
    reaping is also linked to the hope of spring''s recreation of life.


    > And nothing ''gainst Time''s scythe can make defense

    Save breed, to brave him when he takes thee hence.^{60}


    So grain, and the tool to harvest it, have been linked to death and burial, conception
    and birth.


    Customs that deal specifically with the end of harvest, with bringing the fruits
    of the earth home, have varied from region to region. A common experience is the
    feeling of being finished, released from toil, when the last load of grain or
    hay is brought back to the barn amidst shouts and songs:


    > Harvest Home! Harvest Home!

    > We''ve ploughed, we''ve sown,

    > We''ve reaped, we''ve sown,

    > We''ve brought all the harvest home.

    > Harvest Home! Harvest Home!

    > We want water and can''t get none!


    Finished, but not altogether. Since ancient times a common thread in the customs
    of farming everywhere has been the belief that the last sheaf embodied the living
    Spirit (“corn”) as the staple grain of a particular area. All the harvesters cut
    the last sheaf of corn now flattened by the harvest. This moment was extremely
    potent; a passing by the field at this time was scowled at, while the mowers loudly
    whetted their scythes, or he was approached threateningly with scythes, or he
    was tied and motions were made to cut off his head. The stranger was treated as
    a disturbance of an important ritual, and also as an embodiment of the spirit.
    Often the very ears were plaited together, and occasionally dressed as Corn Dolly
    to preside the Harvest Supper and to be kept until the next harvest. I, too, have
    felt the concentration of energy in the last bunch of grain in a field flat by
    the scythe and the piles of tied sheaves. Where does that energy go when the last
    bit is cut? I do not know, but I understand the impulse to treat the last sheaf
    a special way as if it stayed with it, and I treat the last sheaf of my harvest
    in a special way. The welfare of the crops was to the mind of the ancestors assured
    by the Goddess of Agriculture—Demeter to the Greeks, Ceres to the Romans. In Figure
    30 is pictured an votive mask of Demeter used in ancient Greece with the prayer
    ‘‘May it mine, dig the great winnow fan through her heaps, while she stands smiling
    with poppies in her hand.” In more recent times, the Corn Dolly has held the Mother’s
    assurance through the winter of spring and new crops—the Dolly is therefore given
    respect in the autumn celebrations of plenty until she returns to the meadows.
    That great and marvelous mystery of perfect revelation, a cut stalk of


