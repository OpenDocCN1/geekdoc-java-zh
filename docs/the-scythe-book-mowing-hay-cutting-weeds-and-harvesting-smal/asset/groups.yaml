    reaping and mowing implements. What Steensburg means cradle scythe, however, is
    certainly a different design from that of the American cradle: a little rake of
    two or three teeth attached to the scythe ring, rising all of eight inches from
    the blade, the teeth extending six to fifteen inches along the blade.^43


    In the American scythe, the craftsmen were able to raise the rack fully twenty-four
    inches from the blade, with the tines curved to follow the exact contour of the
    blade for thirty-six inches. The invention, therefore, is really a dramatic extension
    of an existing design. Bigger snaths and bigger cradles for a bigger country.


    The American cradle scythe came in different shapes, most commonly a straight
    or “turkey wing” shape, a very bent or “grapevine” shape. With the grapevine,
    the cradle must be stooped to obtain the best angle of cut. In some localities
    the tradition is to balance the cradle with the right arm and left leg the bundle
    of grain is scooped off the rack with the left hand and laid on the ground. This
    balancing act always seemed to be a terrific amount of work, and hardly a good
    use of the body. With the turkey wing model of the body is better; the cradle
    stands more erect, and at the end of the stroke the cradle is tilted to the left
    and jerked to dump the bundle of grain onto the ground.


    Directions for constructing a grain cradle attachment to an “American” scythe
    are given in an article by Richard Weisteiger. There are two problems with this
    cradle. First, it is quite difficult to construct properly—bending the wooden
    tines and fitting the pieces together required experienced hands, and fine cradles
    were marked with their makers’ names (for example, “Christian Bouck” of Mineral
    Springs, New York). Secondly, the cradle attachment makes the “American” scythe
    even heavier and more difficult to work.


    In Europe cradle-like attachments were developed for the grass scythe to make
    it more efficient in harvesting grain. These attachments are usually a wooden
    or wire bow beginning at the blade end of the snath and attaching again to the
    snath just below the lower grip. Thus the cut grains were “cradled” or supported
    along the entire length of the blade, but were'
