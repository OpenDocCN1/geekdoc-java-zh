    ## VIII

    Repairing the Damaged Edge


    EVENTUALLY, MOST SCYTHE BLADES WILL REQUIRE MINOR OR MAJOR EDGE repair, and as
    an opening statement, I would like to emphasize that *damages should be dealt
    with in turn as they occur and not be allowed to accumulate until such time as
    “peening proper” takes place.* The shaping of the whole edge and the repairing
    of a small portion of it are distinctly separate tasks. They can be combined in
    instances when the edge is about the time the whole blade is also due to be peened.
    In this case, I would complete the repair first, and only then proceed with the
    actual peening.


    For the purpose of repairs, hammers and anvil setups were traditionally taken
    to the field, often shared by a group of mowers. I have also, on occasion, used
    two rocks to straighten out a simple “dent,” a piece of bent but *unbroken* edge.
    This would be better than ignoring such a damage; or two rough spots, even if
    a beginner does not notice the extra wear on the body, will he have on the whetstone.
    For repair work alone, you will find the hammer a handier and more accurate tool
    than the jig. This will get started, in a small way, on the practice of the freehand
    method.


    If a dent is not very pronounced and especially if bent downward, the jig will
    work well. When curled considerably, begin by getting it back into place with
    only the hammer, then finish on the jig with the second cap. More frequently dents
    are bent upward and are best dealt with “upside down.”


    ![](img/27a09e01dbd329ab631e901469ce4b29_167_0.png)


    Figure 12


    For this I prefer only the hammer. In the absence of a bona-fide peening anvil,
    the poll of an ax or a splitting maul driven into a block of wood is a suitable
    substitute.


    The jig will work well in cases where a longer section of the edge is seriously
    blunted (after being run into a wire fence, for instance). Often it will be somewhat
    “ragged” as well; file it first, then use the jig.


    The more troublesome damages are the perpendicular cracks, as well as “tears,”
    and variously shaped pieces missing from the edge. The latter two are often predisposed
    by cracks but can also happen independently if the blade hits a sharp-edged metal
    object (a piece of steel roofing, angle iron etc. forgotten in the grass) or a
    corner of a partially buried rock. It will likely be a “tear” if the edge was
    thin; with a thicker, more durable edge, there may be a crescent shaped piece
    broken out. (The latter, of course, would have required greater force powering
    the stroke.)


    The “cracks” themselves can be caused suddenly, for example when the blade strikes
    a dry stub of a previously cut sapling, burdock, etc. An edge shaped appropriately
    for such an encounter would dent. If too thin, it may penetrate partially, but
    before it severs the stem it will “buckle” or twist momentarily. The extent of
    the damage will be relative to:


    - 1. The toughness of the plant material as well

    - 2. The geometry of the primary bevel,

    - 3. The skill of the smith who crafted the blade,

    - 4. The quality of steel it was made of, and, of course,

    - 5. The sense of the mower who is guiding the tool.


    Admittedly, this is a large dose of relativity and is difficult to consider all
    at once. Sooner or later most people using the scythe often, or under diverse
    conditions, will be confronted with these cracks of this type of damage.


    We may end up with several cracks close to one another with just one stroke. The
    following one, especially if directed at the side of a similar target, will compound
    the damage. It may extend the cracks, create more of them, remove little pieces
    between two cracks or along the side of one of them or bend some of them over.
    Figure 14a. An edge “schrupped up” will perform as it had been; hopefully before
    the third swinging the mower will notice what has happened, stopped, and repair
    the damage.


    This may sound dramatic but is no real cause for alarm. A few inches of such an
    edge will not be much more trouble to repair than a couple of large single cracks.


    But before we begin the mending process, let me add that very likely as many,
    if not more, of the perpendicular cracks are either directly or indirectly caused
    by the owner’s hammer. Overzealous or inaccurate hammering may stress the steel,
    in one or more spots along the edge, nearly to the point of breaking, until some
    challenge (perhaps not an obvious one) finishes the job.


    The challenge may be more of the same manner of hammering in subsequent sessions.
    We might cut only young grass in the meantime and not realize what is happening.
    The cracks may be too tiny at first to be easily noticed by the naked eye, and
    may not impair the blade’s performance seriously. Been them more and they will
    grow larger and more troublesome: corners of the edge next to bend out and catching
    grass. At this point we will take note, but may curse the blade that cracked “on
    its own,” since we are sure we did not run into anything hard.


    This is not a hypothetical story, but what some people have actually told me.


    Even one session of careless peening can take the edge from a state of soundness,
    through one of stress, to minuscule cracks and then possibly serious ones. It
    is advisable to acquire the habit of periodically checking the edge under magnification.
    Even a 3x hand lens will be revealing; 10x is better. If cracks are detected,
    hammering in their vicinity should be avoided. No amount of tapping, however skillful
    or careful, will again re-connect the intermolecular bonds, i.e. rejoin the two
    sides of the crack.


    ![](img/27a09e01dbd329ab631e901469ce4b29_169_0.png)


    Figure 13


    To be effectively “repaired,” cracks must be removed completely. Here is a job
    for a file (a half-worn, 6" chainsaw raker file is my favorite).


    Before a thorough repair is considered, a compromise approach may be tried out
    in some cases. A single perpendicular crack, even if quite large (1/4" long),
    can be left intact and watched closely. It may cause no trouble for a long time
    and gradually wear off in use. Whenever the rest of the blade peeneed, avoid hitting
    the surrounding area—perhaps 3/16" to ¾" to either side of it. Instead, shape
    that part of the edge with a synthetic stone only and keep it a little thicker
    than the rest.


    The kind of diagonal crack we are left with after tapping the protruding and bent
    piece of a tear is a different story. Once the edge was stressed this much (by
    bending), it will lose some of its "stiffness."


    - a) Various examples of damages

    - b) the same after inadequate filing

    - i) not filed wide

    - ii) not filed enough

    - iii) not filed to ends


    ![](img/27a09e01dbd329ab631e901469ce4b29_170_0.png)


    Figure 14


    ![](img/27a09e01dbd329ab631e901469ce4b29_171_0.png)


    Figure 15


    ![](img/27a09e01dbd329ab631e901469ce4b29_172_0.png)


    ![](img/27a09e01dbd329ab631e901469ce4b29_172_1.png)


    Figure 15


    ## IX

    Principles of Movement


    DAVID TREMER WAS CORRECT WHEN HE SAID, “... THAT EVERY ‘RULE’ OR tradition I have
    for scythe design and technique, somebody else did it a little differently and
    got the grass cut.”


    The commonality of all mowing styles is that the blade moves parallel to the ground
    and in various degrees of a curve, rather than in a straight line, to assure that
    the forage is being sliced instead of chopped. More comprehensive guidelines to
    the use of the scythe, which I find efficient, easy on the body and pleasant overall,
    can be condensed to three “rules.”


    - 1. Do not carry the weight of the blade, especially during what I have referred
    to as “field mowing.” On an obstacle-free terrain, the only reason to lift the
    blade is to hone it. Children usually grasp this quickly; many adults, on the
    other hand, seem to like fighting with gravity and initially need frequent reminding
    to merely slide the blade forward and back in continuous contact with the surface.

    - 2. Attempt to cut equally to the right and left of your body’s center. There
    will be exceptions to the above two rules when trimming obstacle-strewn terrain.
    The following rule, however, should hardly ever be broken.

    - 3. Direct the blade so as to leave all cut grass on the clean stubble of previous
    strokes.


