    一本书不能取代手持工具的好老师，但它是一个开始。特雷梅瑟（Tresemer）的《镰刀书》（The Scythe Book）非常有启发性（且不具有威胁性），并履行了某种重要的作用。我的这部分可能会引起一些人的不满，但也提供了一份更完整的教学文本。


    我目前正在对其进行进一步扩展，也许超出了“业余割草机使用者”所欣赏的水平（它还将包括关于徒手锻制和镰刀柄制作的章节）。此外，一段教学视频正在制作中，以填补现在以及“老师匮乏时代”的空白。


    愿意帮助这一扩展项目的人可以通过写信方式与我们联系：Vido Family, 1636 Kintore Road, Lower Kintore, New Brunswick,
    E7H2L4, Canada.


    ## 注释


    ## 镰刀书


    - 1. *scythe*（镰刀）一词是更容易读的古英语 *sithe* 的变体。彼得·库金斯（Peter Cousins）建议更早的荷兰词 *zicht*
    是其起源。这三个词拥有相同的印欧语词根 *sek-*，意为“锯”、“剑”、“镰刀”，以及“犁铧”、“分裂”、“科学”等。所有派生词都有将某物从一个地方移动到另一个地方的含义。现代德语中表示镰刀的词是
    *die Sense*，它与印欧语词根 *sent-* 相关，意为“朝……而去；在某些地区，镰刀的发音像“sigh”；刀片割草的声音与这种强烈的赞叹声之间并没有词源上的关系。法语的
    *faux* 和意大利语的 *falce* 源于拉丁语的 *faux foenaria*，没有更早的词根。


    - 2. “钢”的碳含量低于0.2%，强度较低，脆性较小，更不易磨利，且更具韧性。杰拉德·詹金斯（Gerard Jenkins）在《工艺工业》（The Craft
    Industries）中详细描述了不列颠群岛刀片制造的历史。


    - 3. 在马克·夏加尔（Marc Chagall）1911年描绘其俄罗斯童年的绘画《我与村庄》（I and the Village，纽约现代艺术博物馆）中，上握由割草者的手握住，镰刀柄水平靠在右肩上，刀片指向背部。在温斯斯洛·霍默（Winslow
    Homer）1869年的绘画《持镰刀的人》（Man with Scythe，华盛顿特区库珀-海维特博物馆）中，下握靠在割草者的右肘上，右手握着上握正下方的镰刀柄，刀片弯曲并指向地面上方一点。


    - 4. 在关于镰刀的著作中没有提到左手型型号（1921年的《鲁梭农用书》*Larousse Agricole* 中有一处例外）。尽管如此，在一些著名的插图中，镰刀是以左手持的。例如布鲁格尔（Bruegel）的《割草者》（1565年，布拉格国家博物馆）。诺曼·罗克韦尔（Norman
    Rockwell）为1964年首次出版的《穷理查德年鉴》（Poor Richard''s Almanac）创作的插图似乎是一把左手镰刀，这引起了许多老法人的会笑（《乡村之美》，最令人惊讶的美国人：本杰明·富兰克林，第38页）。这些显然是左手的镰刀是因为艺术家希望呈现一种和谐的设计——许多插图虽然画得很漂亮，但镰刀技巧是错误的。


    - 5. 将镰刀柄靠在左肘窝处大大限制了双手握持偏移手柄的活动范围。尽管如此，这种方法出现在英国十一世纪历法的七月场景中（E. M. Jope，“农具”），并且令人惊讶地也出现在现代芬兰的农村（Christopher
    Williams，“必需的工匠”）中。现代旅行者在希腊和土耳其拍摄过只有一个下节的镰刀。H. J. 霍普芬（H. J. Hopfen，《农具》）介绍了镰刀柄的六个基本区域，遗憾的是没有讨论它们的不同用途。斯滕伯格（Steenberg）的《Hestredskaber》展示了在斯堪的纳维亚偏远山谷发现的各种手工镰刀柄。


    - 6. E. R.icker 和霍华·盖奇（Howard Gage），“基于人体工程学原理的手工具设计”。


