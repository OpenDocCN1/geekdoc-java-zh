    抱歉，由于您提供的文本似乎在“FINISHING THE PROPERLY BEVELED EDGE”章节之后突然中断了（缺少了关于“FREQUENCY OF
    PEENING”的后续内容），我仅针对您提供的**现有文本部分**进行了翻译。


    以下是针对给定文本的翻译：


    [content]

    从夹具取出后，如果工作完成得当，刀刃的边缘已经具有理想的形状（即已开刃），但并不锋利。这是因为在锻打过程中，刀刃会沿着中心导向轴滑动，而导轴显然会因此磨钝。作为补偿，一些肉眼无法察觉的微小损伤被“接合”或磨平了。因此，我们最终留下的的是一个平整、开刃良好、相对较薄但很钝的边缘。


    请注意边缘上的光线反光，这表明了锋利度的缺乏。无论是口袋刀还是镰刀，如果普通人的眼睛在将边缘对准良好的光线时能轻易检测到任何反光，那么该工具对于许多任务来说就可以被认为太钝了。检查刀刃边缘：向左右反复拨动它，直到你从反光最强的角度观察它。在正常使用的任何时候，该阶段的刀刃都不应反射出如此多的光线。现在就可以理解为什么在刀刃抵住夹具导向轴时，不应施加超过必要的压力了。


    ## 正确完成开刃边缘的处理


    因此，现在需要用磨刀石进行更多工作来准备刀刃切割，这比田间的磨口要多得多。使用合成石将快得多地完成这项任务的第一部分。我建议在安装刀刃之前，在舒适且稳固的位置进行此操作。我先从顶部开始磨。我用左手握住刀柄，让刀尖抵在一个木块上，跪着时斜着放在我正前方；如果你愿意，也可以尝试其他姿势。


    对于这种从顶部对刀刃进行快速磨口的任务，请使用磨刀石的窄边（见图 7）。大多数镰刀石的形状与刀刃略微上翘的边缘与背部脊之间的内曲率大致相对应。用它们的弯曲边缘时，它们可以契合这个空隙，如果割草者需要的话，这提供了获得更小刃角的机会。正如第
    115 页所示，这样做可以提供更具穿透力的轮廓，但增加了脆弱性。


    因此，真正的灌木刀（例如）最好具有不那么尖锐的次刃，且磨得应该比脊部到边缘的关系更陡。（见图 9）。


    如果用脊部作为角度引导，我建议操作方式是让磨石几乎接触到它，并将压力集中在边缘上。等等用力磨擦脊部和边缘（如果你发现最初这样做最容易的话）并没有直接伤害，只会导致磨石产生不必要的磨损。


    我只向一个方向磨，远离我的方向，从刀跟到刀尖呈斜线进行，因为这让我获得更长的行程。这项任务的这部分需要多少次动作取决于使用的磨石、施加的压力以及锻打期间刀刃压在夹具轴上的硬度。继续磨，直到你感觉到另一侧开始产生轻微的“毛刺”（burr）。（解释请参阅第
    103 页）


    刚开始磨刀工具的人需要学会非常仔细地感受毛刺。偶尔冲洗刀刃或用抹布擦拭会有帮助。一旦在任何地方检测到极微小的毛刺，就跳过该区域继续继续磨剩余部分。当沿着整个长度都能感觉到它时，将刀刃反过来并去除毛刺。


    ![](img/27a09e01dbd329ab631e901469ce4b29_155_0.png)


    图 7


    这项任务我更倾向于使用磨石的宽面，并小心地向边缘（即朝向边缘）滑动，因为这样去除毛刺更快。磨石的较小部分会被使用，因此行程也会更短。如果你想要一个更安全的选择，请让边缘远离你的方向进行操作。一次由从刀跟到刀尖的几次重叠动作组成的完整通过过程就足够了。使用天然石重复这些动作，从顶部进行二三次，从底部进行一两次。平滑的切割边缘是通过使用性质相当温和的磨料剂实现的。今天市面上大多数合成磨刀石不属于这一类。


    所有的磨刀石的工作原理都是在钢上切出凹槽。越大、越硬和/或越有棱角的磨料颗粒（即砂粒），凹槽就越大。被除去的钢屑以粉尘的形式排出。这一过程不可避免的副作用是某些钢碎片仍然附在边缘上，但凸出了边缘。它们大部分将从相反侧以不同程度地弯曲，导致部分毛刺又被折回了回来。由于磨石是从远离磨石作用的方向施加的，一些被折回的毛刺可能会“永远”存在，因为即使有些毛刺断了，磨料的砂粒也会产生更多的毛刺。（石头越粗，这种情况就越如此。）一个外行在测试边缘锋利度时，可能会感觉到组成毛刺的单个牙齿抓住了他们拇指的皮肤，工具看起来似乎具有欺骗性地“锋利”。实际上，它们应该被视为一种干扰，或者充其只是彻底磨削过程中某个特定阶段的临时状态。


    ![](img/27a09e01dbd329ab631e901469ce4b29_157_0.png)


    图 8


    因此，最后磨口的目的一直是尽可能完全地去除毛刺。关于边缘带有锯齿是理想的流行观点半是一个神话。在制造过程中在某些切割工具上创建锯齿边缘的目的是减少对通常磨削频率的需求。


    锯齿刀确实可能运行非常好。

    '
