    The attachment to earthly rhythms may be lost in the modern industrial age, but
    is hardly recoverable. While we no longer know a dozen traditional harvest songs
    to sing around an overflowing Harvest Supper, the experience of relating to the
    earth in a profound way is always available. It is just outside the door. The
    Findlay Community in Scotland has even brought the pursuit of greater awareness
    to more articulate levels in work with plants, and with the seldom-seen spiritual
    beings that surround them. I do not believe this just because they have written
    a book about it. I am practical. When I talk to the grasses, weeds, and grains,
    and spend time listening in return, does it change the nature of the crop? Does
    it change my experience in sowing, reaping, and eating? I will not argue whether
    this is fanciful superstition, or a dutiful and necessary recognition of the elemental
    kingdom. At the very least, I know, the old adage is true: “Farmer’s footsteps
    are the best manure.” It is my desire on this land, in the context of this small
    farm, to know the best use of my body, and to move with the scythe as an extension
    of my body—in relationship with the grass, and in a team of mowers—in the process
    developing my own communion with the divinity that creates the task and all its
    parts.'
