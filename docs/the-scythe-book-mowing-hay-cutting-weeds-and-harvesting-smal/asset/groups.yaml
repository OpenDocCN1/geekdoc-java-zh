  - '[PAGE 84]


    Ever since grains (which are also of the Graminae or grass family) have been harvested,
    a scythe-like tool has been used, that is, a tool with a cutting edge of stone
    or metal attached at a right angle to the handle. Europeans, who call the local
    grain of any area “corn,” discovered a very different sort of corn cultivated
    in the American continent. They called them “Indian corn” or “maize.” It is the
    only grain crop that cannot be harvested with a scythe, although the traditional
    “[Indian] corn knife” is a very sharp twelve-inch blade bladed at a right angle
    to a short wooden handle.


    This section first gives a brief history of harvesting tools for small grains,
    then a description of how small grains are produced, and finally a brief illustration
    of some old and new harvest customs.⁴⁰


    # THE SCYTHE AND ITS PREDEDECESSORS


    At first, grains were harvested by pulling the whole plant up by the roots, and
    the kernels were knocked off into a basket. Early cutting tools were animal jawbones
    with sharp chips of flint stuck in where the teeth had been, or crooks of wood,
    also with flint chips. These designs all used the idea of a hook—the tool was
    passed behind the standing grasses and jerked towards the body. Early bronze sickles
    were also hafted at a right angle to a handle of wood or bone. The blade was eventually
    made to curve to the right, and then was continued in a long curve to the point
    at the left. Thus the weight of the tool was evenly balanced and the wrist less
    strained after wielding the sickle accurately upon their hour.


    A short-handled scythe held with one hand permitted the reaper to work while standing
    erect. When using a sickle, the reaper’s left hand grabbed bunches of straw to
    cut. With the short-handled scythe, the left hand was extended with a short wooden
    crook to draw the cut grain out of the field as it fell to the scythe’s stroke.
    An easily accessible illustration of this method can be found in the famous fifteenth-century
    Tres Riches Heures de Jean, Duke of Berry..'
