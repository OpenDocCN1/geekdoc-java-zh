    呈45度角；通过翻转耙子，你可以将草推向一侧或另一侧形成草垄，而不是在脚下堆成一堆。27另一种是系在腰带上以这种方式拖动的。长柄草耙宽2½英尺，有十四个齿，且头部与手柄之间的连接非常牢固，仍然可用，并且胜任清理田地的工作。它也比一些大型大耙更容易运输。


    握持草耙的最佳方法可以在布鲁盖尔的画作《割草》以及古埃及的卷轴中观察到：上手的拇指指向杆子上方，而下手的拇指通常指向下方。这样，耙子就不会


    ![](img/27a09e01dbd329ab631e901469ce4b29_71_0.png)


    **图 21 割草设备**


    横跨在地面上，否则可能会在草中缠绕并弄断耙齿。像梳子一样，耙子将割好的草从草茬上拉出来。


    ![](img/27a09e01dbd329ab631e901469ce4b29_72_0.png)


    如果耙齿断了，必须钻掉断头，并用一根新的硬木销子填其位置。可以通过手工沿木纹劈裂制作更坚固的备用齿。在耙齿或木制草叉上，手工劈裂比加工暴露在天气中的端面更少，这使工具更耐用。28


    当动力来自役畜时，用于运草的轻型车辆很常见。现代动力设备往往无法获得、对于春季潮湿的田地太重，或者无法到达某些地方。美国大多数园艺和农用在轮子和车身之间没有保护空间；当草掉进这个区域时，就会卡住轮子。一种坚固的车载设计带有可拆卸的挡板（传统上称为“车梯”），它们保护了车身与轮子之间的脆弱区域，并在功能上将容量增加了三倍。29


    由于运草的问题是体积而非重量，使用草针可以进一步增加负载。草针是长细的金属杆，像发卡一样插在草中，将负载的顶部固定在下方的草上。这些针必须带有孔并系上绳子，以便从负载中拉出。你是否想过，草堆里丢失的针最初是怎么出现在那里的？这些就是针，在运下一批草时必须取回来。


    在装载较大的推车或卡车时，将每一叉草放在草床边缘围成一个圆。随着负载的增加，让圆变得越小，这样大部分草就会向中心倾斜。通常在生长的堆上有一个助手，他将草叉放置在最佳位置，以形成大而稳定的负载。在谷仓处，同一个人应该按照装载时的完全顺序拆卸草叉。


    当松散的草叉入草楼或草堆时，它们会随着时间的推移自然沉降；一些农民通过在上面走来鼓励这样做，排除空气，从而保存脱水的绿色。当草被压实后，只能从放入的地方取出，一次一叉从顶部开始。长双柄草刀可用于对草进行垂直切割，以便从侧面取草或进行精确的划分。1939年，美国86%的割草是松散存放的，因此这仍在在世农民的记忆中。


    # 团队协作割草


    > 镰刀挥动，镰刀挥动，我们一同割草山谷。

    > —威廉·奥尔林哈姆，《割草者》，1865年


    割草者沿田边等距排列。他们中技巧最好的将以放松的节奏进行切割，这种节奏会随着时间的推移而加快。每个人轮流在几步后跟随，每割掉同伴右侧的一条草，并将左侧的草留成整齐的行。团队绕着田移动，呈


    ![](img/27a09e01dbd329ab631e901469ce4b29_74_0.png)


    图 22 割草的进展


    顺时针方向绕田移动，每一圈都比上一次短（图 22）。在最后，田地的外缘沿逆时针方向仔细修剪，将草抛向田内。世纪交替时期，三四人的割团队在英国是常见的景象，现在在中欧和东欧的高山上仍然可见。列文在《安娜·卡列尼娜》中是以42人的团队割草的。他们一天必须覆盖多少土地！在某些地区，他们倾向于与其他农民结队割草，从一个农场移动到另一个。30


    有些记载提到把最好的割草者放在前面以设定一个适中的恒定速度；其他割草者被迫跟上。其他记载显示最好的割草者在行末尾；前面割草者脚跟传来的跳动感促使他们在想稍微聊天和休息的时刻坚持下去。尽管一些文字记载提到割草者会大喊：“小心，否则我会切断你的腿！”，但总的来说，这些队友之间关系很好。


    当镰刀停歇，夕阳已西下，

    我们将停止劳作哭泣；

    为了扑灭干渴的喉咙，

    低头入睡。

    但现在，割草仍在继续，

    草依然翠绿如新。


    # 割草季节的饮品


    > 哦，让苹果酒流淌

    > 在耕作和播种时——我所知最健康的饮料，

    > 在收获和割草时。

    > —德文郡劳动歌


    割草从清晨很早就开始，直到上午十一点。然后割草者会休息吃啤酒、奶酪和面包，然后睡午觉，两小时后恢复工作。他们可能会工作到天黑。补给是奖励也是燃料，割草季节的爱兰人预计部分获得啤酒——每个割草者四三加仑桶。除非必要，否则割草者会避免在午休休息前喝酒。但那时！


    那里产生了水汽，一个已经插好的塞子发出“砰”的一。啤酒！他的妻子来接他，递给他一个未开口的罐子。他短短点头，手抹过粘黏湿润的嘴唇，拿起熟悉的容器……神灵们一定拥有迷人的凡间关节，才能让他们那一口酒带来的全身沉浸的狂喜……33


    午休休息时大量饮用的还有硬苹果酒，其酒精含量与啤酒相似，并能在下午割草前带来良好的睡眠。在苹果生长良好的地区，冬季饲养通常需要草。优质的苹果酒由多种苹果制成，包括一小部分山苹果，并在橡木桶中陈化以改善风味。这是一种极度清爽的饮料。

    另一种流行的割草季节提神剂是甜草水（switchel）：


    - 1 杯枫糖浆、蜂蜜或红糖

    - 1 杯苹果醋

    - ½ 杯轻糖蜜

    - 1 汤匙姜粉

    - 1 加仑冷水


    混合并搅拌均匀。可制约约6个7盎司杯。赫茨伯格、沃恩和格林在《Putting Food By》中将甜草水推荐给现代运动员，认为它是“一种不会引起‘口干’的良好能量恢复剂”，34
    这种饮料是割草季节漫长劳作日子的奖励之一。现代割草者也可以享受它们。


