    Jutland with the handle intact, and so be copied exactly (c in Figure 24). It
    is dated in the early Bronze Age, approximately six thousand years ago, since
    the showed signs of being worked by metal. The dates of the bronze implements
    range between 4000 BC and 1500 BC, and have edges between 6 and 8 inches. The
    Roman short-handled scythe at Uggerby at the northern tip of Denmark (e in Figure
    24) is more recent, perhaps dating from the first century before Christ; its blade
