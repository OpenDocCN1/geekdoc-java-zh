    # Fitting the Snath to the Mower


    THERE ARE TWO ADDITIONAL TERMS I HAVE “MADE UP” FOR THE PURPOSE OF referring more
    accurately to what I view as two versions of this tool. The terms are: *field
    mowing scythe* and *trimming scythe*.


    Related to these, of course, are field mowing snath and trimming snath, respectively,
    usually used in field mowing and trimming. (By field I mean a larger area, usually
    more open and without obstacles; I may likewise describe it as a hayfield, meadow
    or a lawn).


    It is a somewhat arbitrary distinction, because during the mowing of a large field
    or lawn-like area there may be occasional need for a short trimming stroke, as
    when going around a boulder, large anthill or a lawn ornament. Conversely, while
    working in an orchard where the trees are closely spaced and for which the trimming
    scythe is generally better suited, one could, in cutting quizás half of its total
    square footage, use a longer blade/or snath (i.e. *the field scythe*) with advantage.


    Even though each tool can partially replace the other, I am convinced that the
    virtues of the two distinct versions would be readily appreciated by anyone with
    a little experience and diverse mowing tasks.


    While I can, for instance, accomplish a lot of trimming using a field snath, in
    doing so I would be continuously aware that it is more cumbersome, less accurate,
    and causes my arms to tire sooner.'
