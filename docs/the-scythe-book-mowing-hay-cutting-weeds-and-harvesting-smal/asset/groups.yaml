    decades on many years in America and Europe. The Planet Jr leaves a steady stream
    of seeds behind, in comparison to most tractor-mounted units and the “Shur Grow
    Planter” leave one or several seeds at fixed intervals in the row. The first type
    is sometimes called a sower, with a second drill.

    50. F. H. King, *Farmers of Forty Centuries*.

    51. Edwin Betts, *Jefferson’s Farm Book*. Henry Best (Rural Economy in Yorkshire
    in 1641) organized his harvest in yet another way: “We allow one stooker to bind
    three binders and six scs.”

    52. Peter Cushing estimated three worker-days per acre to reap with a scythe,
    with two worker-days to bind and stock. He estimated one worker-day per acre to
    reap with the Flemish scythe, and two-days to bind and stock, making Jefferson’s
    calculations a little optimistic.

    53. Before baking machines, some farmers bound their hay in the same way as grain.
    As a symbol of British heraldry, the tied sheaf of grain or “garb” is included
    in insignia of many regions and times, with great variation in the material and
    style of binding. Dorothy Hartley says that binders were cut from long strong
    grass where oxen dropped or urinated. The ties in Bruegel’s “Harvesters” are especially
    high on the sheaf and the straw particularly long, indicating that the straw (probably
    rye) was being carefully dried straight for use in roof thatching.


    (Wallace Wadsworth, Paul Bunyan), “When Paul Bunyan started lumbering in the West,
