    tang angle, not considering the fact that today’s customers are a different lot.


    The existence of adjustable snaths—a relatively modern invention—partially obscures
    the issue. Their purpose is to cater to mowers of different heights than variations
    in tang angles. A snath designed also with the latter in mind would need, in addition,
    a hinged joint somewhere near the bottom.


    In use, the snath meets the ground surface at various angles. Attempting to keep
    the edge-to-grass stem relationship at its best, the mower continually compensates
    for changes in terrain and the blade’s distance from the feet (hopefully by altering
    the snath and lifting or lowering the arm, rather than bending over).


    What bears consideration when matching units is that the average of this snath-to-ground
    angle will be higher with taller people. In a trimming stroke close to one’s feet,
    the difference may be as great as one degree per inch of height!


    To specifically discuss each combination of snath/blade model sold in America
    today is beyond the scope of this treatise. Though I am hoping to inspire the
    individual dealers to give this matter thought, we can collectively begin with
    a few elemental considerations.


    In addition to the correct snath size in relation to a person’s height and for
    its intended purpose, there are two important features which distinguish a well-matched
    unit from a poor one: the ability to achieve a favorable hafting angle” and the
    “lay” of the blade.


    ## CHECKING THE BLADE’S LAY


    Holding the scythe in front of you as if you were mowing, contact the surface
    with the blade as indicated in Figure 19.


    The board and point will be further from the surface than center of blade. Keep
    the point slightly higher than beard.


    Contact the ground with this area of the blade


    View in Figure 20 is in this direction


    point -> The relationship of this portion of edge to surface is indicated in Figure
    20


    Figure 19

    Cross Section

    looking down blade from heel to point


    a) Ideal lay for general purpose


    b) edge too low


    c) edge too high


    Figure 20


    The blade should lay as in Figure 20a.

    A short mower, particularly if using a curved snath with a bush blade (the tang
    of which is generally steeper), may experience condition b). If adding a wedge,
    as in Figure 21, is not enough, acquiring a straighter snath or a blade with a
    less steep tang may be in order.


    People of up to 5''8" tall are served most adequately by the present suppliers,
    though all straight snaths sold until now with grass blades, used by anyone taller
    than this, probably need the bottom 3" trimmed as in Figure 22.


    For many tall mowers this will still not be enough; adding a wedge, to further
    increase the taper at the snath''s lower end, could be the next step. Beyond that,
    a self-made snath is, from my perspective, the best solution.


    ![](img/27a09e01dbd329ab631e901469ce4b29_188_0.png)


    Figure 21


    ![](img/27a09e01dbd329ab631e901469ce4b29_189_0.png)


    ## HAFTING ANGLE


    This is the distance relationship between the center of the upper grip A), the
    blade’s beard B), and its point C.


    The style of movement, as well as the snath and blade models used, determine exactly
    what the difference (if any) should be between A–B and A–C. Please note that the
    guidelines indicated by Figure 5 on Page 11 of The Scythe Book will work only
    if the hafting angle is measured in relation to exactly where the left hand is
    moving. To use the end of the snath as a reference point around which the unit
    will be accurate if the upper grip also crossed that line, i.e. was attached so
    to form a “T” at the upper end of the snath.


    If you chose this method of hafting, i.e. standing the unit against the side of
    a building, I suggest an extra touch. Use a dataframe, or if the wall is wooden,
    drive a nail 4” to 6” from the ground upon which you can rest the center of the
    grip. In addition, this will prevent the end of the grip from hitting the ground
    and so distorting the measurement.


    If you do not think that 3” one way or the other could make much difference, tape
    or tack a piece of lath to the end of the snath, rest each position (marked by
    Xs in Figure 24) in turn upon nail and see how it affects the hafting angle.


    It may be simplest and most accurate to do the initial measuring with a tape and
    with the unit lying on the ground. Ultimately, all experienced mowers would do
    the fine-tuning and only guess the distance by eye. However, I do urge you to
    experiment, preferably by practicing the wide stroke on a dense lawn until you
    find a position in which the cutting is smoothest. It will be a worthwhile accomplishment
    because, for each specific blade design, in relation to the pattern of cut it
    is guided through, the grass stems will be lowest, while the potentially largest
    area is cut with each stroke.


    Once you think you have found that “best” setting, put a distinct mark behind
    the tang, just above the ring. It is useful in alerting the mower to the fact
    that the blade has slipped within the ring. During each whetting, the mark can
    be glanced at.


    At the risk of being considered a complainer, I will say, in all honesty, there
    is hardly a blade I have seen that is well hafted. Not I recommend this continent''s
    traditional snath; it is an example of a very un-ergonomic design.


    ![](img/27a09e01dbd329ab631e901469ce4b29_191_0.png)


    With certain blade/snath combinations, it is not easy to achieve the desired hafting
    angle without some alterations. This is because many blade models sold in America
    were designed for snaths that curve to the left and/or those with one or both
    grips pointing away from the mower. Their tang can, however, be ground or filed
    (from the front side) to make them more like the tangs of “American” blades. It
    will help (albeit not in every case) with “narrowing” or closing the hafting angle.
    (This, by the way, is all that is required to make the “Austrian style” blades
    fit within the confines of the American ring.)


    ![](img/27a09e01dbd329ab631e901469ce4b29_192_0.png)


    Figure 23


    ![](img/27a09e01dbd329ab631e901469ce4b29_193_0.png)


    Figure 24


    The bottom of a wooden snath swells with moisture when used and shrinks again
    while hanging in a dry shed. Unless the screws in the ring are carefully tightened
    each morning before use, the blade will eventually slip. Using that contact as
    a fulcrum, the knob of the tang will act as an effective wood splitting device
    the next time the blade is stressed (hitting a dry stub a rock or even a dense
    clump of grass). Many wooden snaths have been ruined in this manner; A angle that
    is too “open” may be less noticeable or even fine in scanty growth, if using short
    strokes. In serious mowing it will “drag” and require more energy from the mower.


    On the other hand I could tolerate a classical “American” blade. Apart from maintaining
    its edge with the hammer, I would make a suitable handle for it.... which is why
    I much regret at omitting a chapter on snathaking. Making your own is the ultimate
    way to solve the blade-fitting challenge. You see, I can walk into, for example,
    an alder thick with one hatchet and return in a short time with a piece of wood
    from which any body can be made to personally sit a 7-foot-tall mower using the
    flat “American” blade and wishing to mow with a straight back. This is not an
    exaggeration. The point I am trying to make is that Nature offers us snaths half-ready,
    so to speak, in any curves desired. They can be finished in the bush, if need
    be, with a hand brace and a couple of bits, in addition to that sharp hatchet.

