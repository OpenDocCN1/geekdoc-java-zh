    灌木或丛林镰刀片短至十五英寸，且通常更厚，以承受反复撞击幼树的冲击。70 厘米的草刀片适用于所有的草、杂草、刺棘和一年生树。


    ## 刀鞘


    当你拿着握柄时，不会被镰刀割伤。然而，在工作的往返途中，刀片对自己和其他都是危险的。防止割伤人和划伤刀刃的好方法是套上一个完全覆盖刀片的鞘，并牢固地系在跟部端。有时贴在刀片上以保护边缘免受快递服务的窄塑料条在送货后应丢弃，因为它们反复使用并不可靠。


    开始切割时，取下鞘并折叠放在口袋里。切割结束，擦掉刀片上的草和泥土，重新套上鞘。在刀片跟部后用一个简单的头结固定好。季节结束时，镰刀应储放在孩子够不到的高处。记住，刀鞘在修草时不能保护旁观者的腿部，也不能保护磨刀者的手。


    当镰刀使用得更广泛时，不用时会用袋子或定制鞘覆盖。在英国一个不使用镰刀鞘的地区，传统是成群结队走向田野，刀片悬空，右手握上方握柄，下方的握柄牢牢抵在右腋下。这种规范化防止了事故的发生.^3
    在每个地区，午餐休息期间，镰刀片被放置在未修剪的草或谷物中，任何男人、妇女或小孩都不会进入，从而保护了刀片和肉体。在现代，这些传统并非所有人所知，而刀鞘提供了必要的安全余量。


    ## 镰柄 (SNATH)


    各种类型的镰柄（snaths）都与同样的长弯曲镰片配合使用。一种英国传统只使用自然弯曲的幼苗，而在东欧，则将偏移手柄卯在直木杆上（通常是白蜡木或核桃）。传统的苏格兰设计有一个长偏移柄，它几乎在镰环处与镰柄相接。镰刀是少数不对称的工具之一；双手并不执行相反或互换的任务.^4


    握柄（或称为 nibs 或 nog）以不同的方式连接在镰柄上，时而指向刀片相同的方向，时而指向相反方向，偶尔是混合的。可调节握柄由环绕在镰柄上的金属圈组成，通过旋转木握柄来拧紧，在博物馆收藏中发现它们指向几乎每一个方向。在某些传统中，只使用下握柄；而在另一些传统中，镰柄的上部曲在左肘窝处。在任何当地制作的工具上都可以预见到这些无数的变化。


    美国五金店常见的典型扫掠弯镰柄是用美国南部的弯曲白蜡木制成的。木杆经过蒸汽处理，弯曲成所需的形状并干燥。这种方法的问题在于，保持永久弯曲所需的木材量增加了镰柄的重量。老辈人说，去农用用品商店买镰柄时要花半天时间测试库存中的某一个，它们每一个都略有不同。为了减少这种形状上的不确定性，现在的镰柄做得更重，以至于做出来的图案完全相同。1980
    年称量的几个样本平均重量为 4/3 磅。配上更重的冲制刀片，弯曲白蜡木镰柄刀片的总重量达到 6½ 磅，而锤制刀片和直镰柄仅为 3½ 磅。考虑一下在修剪一英亩草的大约一千次动作后这种重量差异意味着什么。


    弯曲的“美式”镰柄手柄可以绕点任何方向完全旋转，试图将锤制刀片（图 2）的角度带给更简单的冲制刀片。我更倾向于更简单的镰柄和更好的刀片。有时，旧镰柄会非常轻且平衡良好，主要缺点是木材干枯且脆弱，以及可调节握柄永久松动。此外，有些镰环非常小，只有某些非常窄的刀背（tangs）才能通过。


    沉重木镰柄的重量使得美式镰刀导致右手腕处于局促位置的倾向更加严重。这种小指背向手腕弯曲的位置（“尺侧偏斜”）会降低手腕的功能并可能导致肌腱劳损。美式的轻质镰柄偶尔有铝制的，但我怀疑铝在压力下的表现。与钢不同，铝会随着使用而变弱——没有“疲劳极限”，意味着金属没有弱化的极限。即使是微小的弯曲也会破坏镰柄的角度。在尝试了不同的镰柄三年后，我决定欧洲生产的微曲钢镰柄最适合普通用户。它轻而坚固；刀片与镰柄的角度正确；靠近刀片的下握柄可以调节，而上握柄是固定的。每个调节握柄最终都会松动，必须用硬木或皮革垫紧。刀背头部插入镰柄末端的槽内，通过镰环上的两个螺丝固定，用专用钥匙拧紧。钥匙可以存在刀鞘末端或挂在腰带上；如果丢失了钥匙，1/4
    英寸方形适配头可以很好地匹配镰环的螺丝。


