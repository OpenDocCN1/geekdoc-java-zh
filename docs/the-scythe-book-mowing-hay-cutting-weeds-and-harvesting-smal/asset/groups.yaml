    宽约十二英寸。如果稻草太干脆而无法捆扎，我就用一两根在麦田边缘生长得依然翠绿且高大的杂草。用稻草或杂草扎带环绕麦束，直到扎带的顶部和底部重叠。握住扎带的最底部，将它的顶部滑过自己的底座，打一个半结。沿着底座滑动这个半结，直到麦束被扎得紧紧。将扎带的底座重新压回半结上方，并将其塞入自身下方抵在麦束上。用于捆扎麦束的捆扎器是一个两个正方形的木块，中间的孔里穿过一根36英寸的绳子。绳子的一端打结，使其紧贴着杂草；另一端绕在麦束上，然后绕过木块方的绳子。


    几捆麦束堆叠在一起，麦穗朝向外形成一个麦垛（stook）。关于小麦、燕麦、黑麦和大麦几捆组成一个麦垛有不同的传统，但我通常习惯将八捆或十捆靠在一起。在麦垛中，麦穗会在风和阳光下干燥变硬。用一束大麦覆盖在麦垛顶部，即使是雨水也能挡开，尽管如果天气变得潮湿，就必须堆叠、覆盖或搬进谷仓。托马斯·杰斐逊为每四十英亩的地配备一个大型谷仓，他的谷物在那里完成大部分干燥。有些人喜欢将谷物堆在防鼠的平台上（离地地的蘑菇状菌柄上），麦穗朝向中心，并在大堆的顶部盖上茅草或用塑料布覆盖。无论你使用哪种方法，在束中缓慢干燥都能使籽粒成熟，从而利于储存。现代方法包括热干燥处理，这通常会杀死谷物的胚芽。夺走谷物的生命意味着明年没有种子，并使谷物的价值变得存疑。另一方面，除非你有一支推车队，否则在脱粒前将麦束散放在谷仓里太久会损失所有的营养价值。并不是所有的谷物在收割时都会掉落成整齐的束子，田地看起来可能一片狼糟。过去，收获后捡拾农民田的特权是梦寐以求的，因为留下的东西可以用来捡稻草。相反，我把鸡或鹅赶进田里。最后，浅种的三叶草和草从残茬中生长出来，提供了晚期作物并为田地提供了良好的冬季覆盖。我直到最近才发现塔瑟（Tusser）在16世纪曾给出类似的建议：


    - 携带玉米，任其贫瘠并被捡拾，

    - 在它们之后，将其彻底清理干净；

    - 然后留给云麦草（rowen）直到过去，

    - 以延长你的乳业期，你再没别的选择了。


    ![](img/27a09e01db329ab631e901469ce4b29_104_png) 图27 小五物的工具


    ![](img/27a09e01db329ab631e901469ce4b29_105_0.png) 扬场板或筛


    ![](img/27a09e01db329ab631e901469ce4b29_105_1.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_2.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_3.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_4.png)


    在秋季或冬季的某个时候，我会拆开麦束，通过脱粒将籽粒与稻草和谷壳分离：将它们放在椅背上击打、在桶里撞击、踩在上面、或者让有蹄动物在上面践踏、用打粒机或使用脱粒机。自四世纪以来使用的双节脱粒机是一根六英尺的长杆，上面铰接着一个由硬木或偶尔用打结绳子制成的18英寸长的打槌。打槌可以很容易地举到肩膀高度，然后沿着整个长度重重地打落在厚堆散开的麦上，发出砰砰声，一次又一次。击打不需要猛烈或精疲力竭；谷物不是被打出来的，而是通过脱粒机的击打从深层的草堆中抖出来的。像镰割一样，脱粒这项有一种内在的节奏，使工作变得更容易。脱粒队的领队通过工作歌、吟唱甚至舞蹈来协调连续的击打。


    设计问题在于铰链的材料。即使是皮革也会很快磨损，所以只要可用就使用羊皮。罗伯特·约翰斯（Robert Johnston）提出了一种优秀的设计来防止打槌缠入自己的铰链中（图28）。沉重的轮在手柄末端的槽处自由旋转，这样绳子就不会被扭曲。


    收割前的田地可能像琥珀色的麦浪，但脱粒显示出籽粒仅占从田里收获重量的一小部分。相比之下，谷壳和稻草的数量显得惊人，而籽粒仅占总量的二十分之一，在体积上比例更小。


    小麦、黑麦和荞麦很容易脱粒。只有“裸壳”或“无壳”品种的大麦和燕麦容易脱粒。带壳品种需要更多脱粒机工作；加热和轻微研磨也能去除壳。


    用脱粒机脱粒被认为是农场最辛苦的工作，因为需要大量的谷物来饲养牲畜。机械脱粒受到了欢呼。然而，在小规模操作时，脱粒或任何任务都不是苦差；而且这项工作是实用的。对于用打槌将种子从壳和茎分离，H.J.马西辛姆（H.J.
    Massingham）曾说：“挥动打槌的人是塑造生命源的人；而照顾机器的人是在拿命。”


    马西辛姆所指的早期脱粒机非常大、嘈杂且危险。相比之下，脚踩式脱粒机（在日本广泛用于少量谷物，并出现在福冈的《稻草革命》中）是一个覆盖有金属环的木制圆筒，通过踏板以每分钟350-450圈的速度旋转。稻草用手持在移动的金属环上方，由金属环将籽粒击出。这台机器据称每小时可以脱六桶，且籽粒破碎的风险比打槌脱粒低。然而，在将旋转筒与打槌脱粒进行比较的一系列实验中，我发现只有当籽粒在麦穗中非常松散时，旋转筒的效果最好。如果籽粒很容易脱落且麦束小心地放在许多钢指上，旋转筒所需的时间与打粒机相同——每桶半小时到小时——但能多出三分之一的籽粒。然而，急进会导致产量低于打粒机。旋转筒的开销似乎只在大数量谷物时合理。


    ![](img/27a09e01db329ab631e901469ce4b29_108_0.png) 图28 打槌与手柄的连接


    脱粒后剩下的稻草可以作为动物饲料、屋顶隔热、动物垫料或园艺覆盖物（在这方面优于锯末和干草）、用于在冬季风中固定草垛的草绳，以及农场所需的许多蜂箱、篮子和垫子，以及传统的产床。事实上，我遇到过几位欧洲农民专门种植谷物以供他们的蔬菜或果园使用；福冈的小麦肥力计划完全取决于将脱粒后的稻草回到田间。而那些脱粒后的谷物稻草可以剪成节段来吸水，让孩子们喜欢这种原始的有机吸管！

