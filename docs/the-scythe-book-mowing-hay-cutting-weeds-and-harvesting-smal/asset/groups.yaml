    （刨刀。）手柄的圆孔比方形榫眼更容易制作，而且完全符合功能性。


    ![](img/27a09e01dbd329ab631e901469ce4b29_194_0.png)


    图 25


    对极佳的贴合度、人体工程学设计以及可能的艺术触感进行综合考虑，可能会非常复杂，或者，我想补充一句，非常有趣。


    单就这个话题就可以写一本小书。我不知道有多少人会利用它；我听说过大多数现代割草机使用者根本不会花力去制作自己的刀柄（snath）。无论如何，目前我还不给你们提供一个正统的刀柄制作章节。如果兴趣足够，可以在下一版中增加一个。然而，敏锐的读者会在图
    1 中发现丰富的细微视觉暗示。这里有几条额外的建议：


    我无法忍受圆形手柄，尤其是在修剪用刀柄上。它们需要比放松体验所更多的“抓握”力度。仅将平每个手柄的“内侧”（如图 25 所示）是对任何商业型号一种快速且值得的改进。以最舒适的角度对平整后的边缘进行修饰。


    另一个有助于平衡刀片的特征是在刀柄末端增加 5–10 盎司的重量。在尖端套上一个漂亮的黄铜球（从旧火腿上取），或者钻一个洞，在上方手柄附近系上你的宠物石（不是小卵石）。尝试不同的重量；它与刀柄和刀片的大小、各自的重量以及预期用途有关。


    我花了几个季节才完全领会这个概念。现在我非常困惑，为什么这个“平衡问题”没有得到各地刀柄制造者和用户的关注。


    在欧洲与各种个人从理论上讨论这个“颠倒过来”的想法几乎没有效果；去年，当我第一次在草生长季节期间旅行时，我带了几个自制的刀柄，其中一个装了刀片。在奥地利和瑞士的一位割草机使用者接过其中一个，握在手里，了点头表示赞同。大多数挥了几几下的人问我是否也能为他们也做一个……我做到了。


    手柄的形状和位置是他们都欣赏的额外特征。


    附录概述了我为了激励“后方”提供更好服务而的一些尝试，以及我对一个更有前景的未来的愿景。


    ## 后记


    尽管我有很多不中听的言论，但我认为镰刀的未来是光明的。我的乐观通过通过遇到那些被我视为希望象征的人而定期更新。


    来自缅因州金菲尔德的18岁少女汉娜·索耶（Hannah Sawyer）就是这样的人的人，我在这里提供她家庭学校论文中的一段话：


    > “镰刀很简单；它也很放松。难怪以前的人几乎没有压力问题。宁静的节奏消除了紧张感：呼唰，割，呼唰，割，割，呼唰……如果我闭上眼睛，很容易想象自己回到了过去——一只鸟在向天空歌唱，风在对树木低语，马蹄拨起的水花，母牛唤小牛的低鸣。你想穿越旅行吗？我教教你如何做。”


    ## 谢谢


    任何像我这样的非作家，都试图将许多难以捉摸的概念和信念投入书籍的固定形式中，并让自己的家人完好无损，他们知道，支持他们的亲人才值得巨大的感激。


    除了许多塑造我以及我所做之事之外，我只知道这一切始于我的母亲玛丽（Maria）和父亲约瑟夫（Jozef）。


    许多人帮助了我与镰刀相关的追求。其中，丹麦的“惊人女性”格里特·勒彻（Grith Lerche）以及新罕布什州的奶场主、终身镰刀传教士汉斯·埃卡德（Hans
    Eccard）似乎是我有时迫切需要的力量源泉。


    此外，如果不是弗朗茨·保罗·施罗肯（Franz Paul Schrocken）镰刀工厂全体工作集体（尤其是 Peter Wagner）的热情，我在那里学到了这么多，这部分知识的书文字就不会存在了。


    如果没有兰·胡德（Alan Hood）的必要安排以及他随后表现出的极大耐心，它现在也不会在你的手中。


    这份手稿的第一版本都是在旧纸背面用铅笔写的。在我和 Kai 的争斗得到解决（或几乎解决）后，Faye 用手动打字机打印了它。我们的朋友、邻居、第二编辑兼校对员菲利普·艾伦（Philip
    Allen）花费了大量时间将文本和图表细致地转换到——嗯，是的，我羞愧地承认——一种“清晰的数字化格式”。


    你可能对构中的任何不清晰感到困扰，这是由于我固执地坚持保留一种带有异常双重含义和“言外之意”哲学的表达方式。斯洛伐克式的思维模式一定有深根，很难拔除。


    尽管我努力沟通时保持了正直，但对于本文本在概念和技术正确性方面可能存在的缺陷，我个人负责。


    ## 附录


    从 1994 年到写本文期间，我接触了每一位美国镰刀进口商，包括大多数“欧洲款式”刀片和配件的经销商，并提供帮助。（这是一项免费服务；我支付了电话费，并花了时间写了许多页信。）


    有些人把我当成一个罕见的狂热分子并以此方式对待我；有些人似乎在礼貌地听，但继续照旧行事。其他人想要建议（或他们是这么说的），但并没有采纳


    - 客户会对过多的选择感到困惑。

    - 对工具的兴趣不足以支撑打印更详细描述的成本。

    - 他们的选择虽然不完整，但对于“初学者”来说足够了。


    也许我是一个天真的乐观主义者，偏爱镰刀，相信这种工具应该被对待


    到目前为止，最大的“失败”是我在过去 20 年里与一家加拿大公司的经历，这家公司代表了园艺世界。当他们的下一个目录到达时，我对这种选择感到震惊：一片刀片、一个铝刀柄、一个石座和一个一块合成石。这对于木工来说提供了大约
    250 种不同的凿子和圆凿，以及大量的磨削方法。


    你看，我在几封信中敦促他们销售比市面上任何现有产品都短的刀片，并建议安大略省的木工用加拿大木材制作设计更好的刀柄。我自愿——免费——编写一本说明小书附在每把镰刀中；他们没有接受我的提议，后来我才意识到我本该像对公司说的那样清楚地说明——如果边缘不定期进行“修边”（peened），这些刀片的性能会很糟糕。我很沮丧，虽然还没准备好放弃，我给总裁打了了电话。他告诉我，这个国家最多只有四个人认真地使用镰刀，而且，此外，现在已经无法教普通人如何塑造工具的边缘，即使有“夹具”的帮助。

