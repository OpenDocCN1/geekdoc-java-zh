    割草动作划出的优美弧线：“帆在蓝天下来回地挥割。”镰锄是桅杆，长横杆就是镰刀。


    我在草坪上练习，在挥割和返回的过程中都拖动刀片。刀片从刀刃到刀部的横截面显示，刀刃后的区域向外微弯曲。


    ![](img/27a09e01dbd329ab631e901469ce4b29_49_0.png)


    从后面看


    从行内前方看


    图 16 挥割姿态


    ![](img/27a09e01dbd329ab631e901469ce4b29_50_0.png)


    图 17 割草时的节奏性旋转，刀片始终贴地


    ![](img/27a09e01dbd329ab631e901469ce4b29_51_0.png)


    图 18 伸出手以扩大割幅（图 5）。在近距离割草时，凸形刀片像压入式刀片一样沿着挖掘处滑动。通过这种练习，草坪被割了，我可以保持刀片平行并贴近地面。为了获得更宽的割幅，我的左右手在挥割开始时向右伸出，在挥动过程中远离身体。图
    18 中所示的割草者向草倾斜，没有失去平衡也没有弯腰。在状况良好的草地上，经验割草者可以用刀片割出七英尺或更宽的宽度。在干草场中，六到七英尺宽的平均宽度被用作长度单位。缺乏经验的割草者最好减小步幅，稍微向左走一点，即使是在上一行的割口处。整洁的切割比宽割更重要，这一点从新罕什尔州苏利文县乳制品改进协会年度会议的割草评分系统中得到了体现：


    | 准 | 分数 |

    | :--- | :--- |

    | 枯茬整洁度 | 45 |

    | 割幅宽度 | 30 |

    | 割一平方英尺的时间 | 15 |

    | 割十平方英尺的时间 | 10 |

    | 切割粗糙程度 | 扣分 |


    允许更宽切割的很大程度上不是力量，而是通过正确的扭转在肌腱中储存能量。割幅的长度和宽度也随作物的状况而变化，而切割的均匀毕竟是割草的目标。石质土地上短而枯黄的劣草显然比平地上的高杂草更难割。


    ## 小进步


    尽管对于初学者来说，直立而不弯腰最好是最好的，否则当增加割幅时，他们会有被向前拉的经历。当这种姿势变成弯腰时，就应该放弃；割草中定位的诀窍在于学习如何在不失去平衡的情况下投入工作。即便即便遵循了所有的技术规则，仍有变化的空间。镰锄柄和刀片的制造确保了切口边缘与草之间保持正确的关系。然而，可以通过操纵刀片来最大化切割角度。我总是保持刀片平行于地面切割；但这给了我两种处理草丛的方法。如果我左手按住腰带，右手在挥割过程中绕过，我可以进行狭窄的切割。相反的方法是像菜刀剁肉一样，将整个刀片直接横跨草。用狭窄的切割，只割下一英寸草；用宽阔的砍割，草往往会倒下。所有的割草都结合了两种方法；在不同的条件下，我必须改变方法以获得更多的切割或更多的砍割。如果切割容易，我可以在挥割开始时伸出手来增加割幅，同时牺牲一些切割效果。如果切割困难，我可能希望通过将刀片内倾来最大化切割效果并最小化砍割效果。在镰锄环的限制范围内，刀片可以在底座上轻微移动以产生切割或砍割效果，但我发现，如上述描述的那样使用手臂的方法已足够适应大多数割草条件。在某些情况下，我割草时并不保持脚静止。我开始将重心放在右脚上；然后随着身体开始松开，我的重量移到左脚上。我慢走着穿过田野。这些和其他变化在不同的切割条件下是合适的。去尝试吧。草会教你的。列列夫·托尔斯泰在《安娜·卡列尼娜》中描写贵族列文加入农民进行一天的割草的描述，生动地表达了割草中固有的轻松与优雅：


    > 老人挺直身体，双脚向外撇，迈着长而有节奏的步子，动作精准而规律，这种动作似乎比走路时挥动手臂更费力，仿佛是在玩耍，他铺下沉重而均匀的一行草。仿佛不是他，而是那锋利的镰刀自己在穿过多汁的草丛中沙沙……列文移动得越久，就越感到那些无意识的时刻，在那些时刻，似乎不是他的手在挥镰刀，而是镰刀本身——一个充满生命力和自我意识的物体，仿佛像魔法般，无需思索，工作就自己变得规律而完。了。这些是最幸福的时刻。


    只有当他必须停止动作并思考时，才是苦差；当他必须割一个小土丘或一丛镰草时。老人轻而易举地这样做。遇到土丘，他改变了动作，有时用脚跟，有时用镰刀尖，用短促的动作割掉土丘两侧。在做这些的同时，他不断观察视线所及的一切：时而摘下一颗野果吃给列文吃，时而用镰刀片甩出一根树枝，时而看着鹌鹑从草丛下方飞过。


