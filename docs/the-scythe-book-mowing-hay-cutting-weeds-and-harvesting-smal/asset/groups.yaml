    the different quarries local to every region. In his book, Man the Tool-maker,
    Kenneth Oakley shows a piece of sarsens (sandstone hardened by secondary silica
    intrusion) used to sharpen primitive axes thousands of years ago. Particularly
    good paving stones and monuments were once popular as stationary whetstones.9
    I have a piece of slate from the nearby Whetstone Brook and a whestone of slate
    from my grandfather worn down from years of use, and have found that they import
    a very sharp edge. The final touch comes from an English tradition which I have
    never heard mentioned in this country, though I have tried and been satisfied:
    honing with the dried shelf fungus of the sort that grows on dead birch trees
    (Polyporus betulinus), which perfectly fits the hand.


    In places the stickle was used instead of a stone, and a new set of tools was
    necessary for the sharpening process. A saw or a special iron trickle-pricker
    was used to make small “delfs” (holes) to take the tallow or grease; extra grease
    was carried to the fields in special pouches or horns; sharp or emery powder was
    found and carried to the field in little bags; snaths were sometimes made feet
    long to accommodate a stickle-holder.10 Keeping the grease cool enough not to
    run off, and the sharp edge, and so forth—these are lost arts. I am content with
    the sharpness I get from my two grades of stone.


    The final step in keeping a sharp edge is wiping the blade after each day''s use,
    shown in Figure 13, preventing rust and improving the mirror-like finish. The
    mower Damon''s blade was such that in it, “I see my Picture Done, as a crescent
    Moon the Sun.”11


    I do not loan my scythe. I reap the benefits of a carefully tended edge, and am
    reminded of my responsibility by a dull edge. Each time I peen and whe the blade,
    I remake the tool as my own; in time it becomes a mirror of my attitude toward
    work. A Finnish tale describes a tired mower who exclaimed“May the devil whe my
    scythe!” The devil died so, leaving only the snath.'
