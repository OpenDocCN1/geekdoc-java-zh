    ## 磨刀


    镰刀片相对于其刀柄（tang）是扭曲或“翘起”的。当镰刀片出厂时与刀柄没有角度，且使用简单的圆环和楔子固定刀片时，需要通过虎口钳进行小心弯曲，直到刀柄旋转到与刀刃约25度的程度（图
    2，俯视图）。


    这里的基本规则是镰刀要在其圆形的背部拖动，而不让边缘切入地面，但边缘距离地面不超过1/4英寸。这就是修剪草坪的方法，如果你能修剪草坪，说明刀片的翘起角度和装配是正确的。


