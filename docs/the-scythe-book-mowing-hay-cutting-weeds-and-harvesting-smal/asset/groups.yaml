    ## SOWING, REAPING, THRESHING, WINNOWING


    > Sowing in the sunshine, sowing in the shadows,

    fearing neither clouds nor winter''s chilling breeze;

    By and by the harvest, and the labor ended,

    We shall come rejoicing, bringing in the sheaves.


    —GEORGE MINOR AND KNOWLES SHAW


    Small grains are sown in an area which has been cleaned of weeds, preferably by
    growing root crops in the plot year before. You must keep the weeds out of the
    root crops through cultivation; the grain will benefit from this clean culture.
    Excess nitrogen and lack of potassium causes lodging or falling over the grain,
    making harvesting difficult. A cradle cannot be used on lodged grain, and lodged
    grain must be harvested soon with a scythe or sickle to keep the kernels from
    sprouting by being too close to the damp earth. Lodged grain can be raked and
    tilled like hay.


    Grain can be sown in the fall or early spring, depending on the climate and the
    farming schedule. If grain is sown too late in fall, or too early in the spring,
    the cold and damp soil will rot the seed before it germin. Though higher yielding,
    winter wheat sown in August or September can be completely killed by a hard winter.
    The finest flour with the highest gluten content to promote rising is spring-season
    hard wheat, in varieties such as Neepawa, Olaf, Manitou, Justin, and Selkirk.
    Barley, oats, and buckwheat are also sown in the early spring because they are
    not hardy. Rye can be sown nearly any time since it is very hard and requires
    only a short season for growing; the saying “wheat for fat, rye for strength”
    may indicate more the types of people who live in short-season growing areas than
    the nutritional quality of the grain. The seed can be broadcast by hand from a
    sack, though a rotary hand-turned seeder will give more uniform results. Cross
    the field back and forth in one direction, then again in a direction perpendicular
    or diagonal to the first for best results; an acre requires an hour by this method.
    One hundred pounds per acre is an average seeding rate.


    After sowing, the seed must be covered with soil by raking the area, to improve
    germination and to protect the seed from the birds. The hayrake serves here a
    grading rake, and it is best to step in the raked earth while raking, because
    the feet press the covered seeds into the earth. For larger areas, there are machines
    that spread the seeds, bury them, and firm the earth in one pass.


    It is often a good idea to sow clover or alfalfa at the same time. When the grain
    is harvested the slower legumes will grow into autumn and give the field protective
    cover through winter and a hay crop in the spring.


    On the efficiency of sowing by casting the seed in all directions, by hand or
    with a whirling machine, George Fussell cited the parable of the sower:


    > Behold a sower went forth to sow; and when he sowed, some seeds fell by wayside,
    and the bowels devoured them; some fell upon stony places, where they had not
    earth; and forthwith they sprang up because they had no deepness of earth; and
    when the sun was up, they were scorched; and because they had no root withered
    away. And some fell among thorns; the thorns sprang up and choked them; but others
    fell into good ground and brought forth fruit, some hundred fold, sixty fold,
    some third fold.


    Fussell used this story as evidence for the superiority of seed drills, which
    plow a small furrow, drop seeds into it, cover them over, and firm the earth above.
    If a drill is available, the old and dependable Planet Jr. row planter, the grain
    can be sown thickly in rows to twelve inches apart from each other The drill can
    be adjusted for seeding rate, depth of furrow, and distance between rows, all
    determined by experimentation within the limits of soil and climate. The space
    between the rows can be cultivated or hoed once or twice in the growing season
    to suppress competition from weeds. Yields in row-plots are often better than
    with broadcast seed, and there is less problem of weeds in the mature grain. Row-sowing
    is a popular method among organic farmers in Europe. There is definitely more
    work involved, however, and if weeds to begin with, I use the broadcast method,
    and read the parable of the sower as a parable.


    In 1911, F. H. King, former Chief of the Division of Soil Management of the United
    States Department of Agriculture, published his memoirs of a Tour of the Orient,
    where he found wheat grown in hills or groups averaging forty-six stalks each.
    The hills were twenty-four inches apart in the row, the rows were in sixteen inches
    apart, and each pair of rows was thirty inches from the neighboring pair. The
    spaces between the hills were hoed conscientiously after every rain to eliminate
    weeds, to incorporate frequently applied composted human wastes, and to create
    a moisture-conserving fluffy mulch. Mulking observed a harvest in 12 bushels per
    acre, but calculated that the fine harvest of 1901 measured 116 bushels per acre.


    When should grain be harvested? Farm books give the infuriating answer: When it’s
    ready. Working with other farmers and raising grains myself, I was surprised to
    find there is no better answer. When you press a fingernail into the kernel of
    grain we are about to harvest, it shouldn''t spurt out its contents in the “milk”
    stage. But when it is really hard it is also ready to fall off; then the grain
    head shutters when the plant is cut, and all the kernels fall irremediably to
    the ground. Rub a seed head between both palms to determine if it is “hard dough”
    stage.


    With either a scythe or cradle, the stroke for reaping is broader than mowing,
    with more hacking and less slicing. With the cradle, the left hand is as close
    to the ground as is comfortable in order to keep the cradle upright. The right
    hand comes up at the end of the swing, and the left hand abruptly dumps the load
    with the heads pointing away from the uncut grain. With the scythe, the left hand
    lifts abruptly at the end of the swing, thus ending the stroke with heads pointing
    toward the uncut grain. Too much swing to the left, the straws get mixed up. The
    scythe is lighter than the cradle, but requires more control. Grain is easier
    to hay, since the weight of the grain heads and the height of the stem gives the
    plant such inertia that it has little tendency to bend rather than cut. In recognition
    of this greater ease of cutting, the Larousse Agricole for 1921 recommends adjusting
    the stroke and the angle of the blade snath to regulate the depth of swath: 12–14
    inches compared with 6–9 inches for hayfields and pastures.


    With reaping, the support staff needs to be much larger than for haying. Thomas
    Jefferson hired fifty-eight people to harvest his wheat in 1795:


    - 18 craddlers

    - 18 binders

    - 6 gatherers

    - 3 loaders

    - 6 stackers

    - 4 carters

    - 2 cooks


    The fifty-eighth was the foreman or “Harvest Lord.” In 1812, he recorded 15 craddlers,
    15 binders, 16 gatherers (which must have included the loaders and carters), 4
    stackers, and 2 cooks. The gatherers, loaders, and stackers would often be children.
    He describes this group as a “machine” which


    > would in exact equilibrium, no part of the force would be lessened without retracting
    the whole, no increased without waste of force... This would cut, bring in and
    stack 54 acres a day, and complete my harvest of 320 acres in 6 days.


    Stephens recommended the harvest was organized in units of two scythemen (without
    cradles), two gatherers, two binders, and one raker.


    So it is clear that the time spent cutting grain with the scythe is only a part
    of the entire harvest process. Each cut of grain must be gathered together into
    sheaves and bound with a simple overhand knot made of two or three of the straws.
    The diameter of the sheaf is limited by the length of the straw used to tie it,
    although old gauges used to check the sheaves

