    The forward movement is as follows: As the cut proceeds, the weight gradually
    shifts to the left foot. With the slicing portion of the stroke completed and
    the blade to the extreme left, the right foot, relieved of practically all weight,
    is free to move forward. The foot is not lifted; it merely slides about the same
    distance that the blade advances into the grass with each slice. As the weight
    shifts back onto the right foot during the return stroke, the left one slides
    forward. It is a slow, continuous creeping with no up-and-down movement of the
    whole body and no real pause or distinct “stepping ahead.”


    The momentum created by the shifting of weight from the left foot to the right,
    alone, begins to bring the tool back to the starting position. The shoulders as
    well as the hands’ hold on the grips relax. Only while cutting tangled plants
    would be a slight lifting of the blade’s heel at the start of the return movement
    be required, and thus, occasionally, Rule 1 will not be observed.


    I consider the technique described above to be the “Basic Form,” and believe that
    a better mower is “made” sooner by practicing it than by deliberately cutting
    a narrower swath in an open field. The length of one’s blade, as mentioned in
    Chapter 4, will affect the swath’s width very little. I can make a 9-foot stroke
    as easily with a 20-inch blade as with a 30-inch one. Once I approach my “personal
    limit” (determined by the manner of movement as well as the length and design
    of the snath), the longer blade'
  - '[PAGE 178]


    will allow me to reach several inches further to the left (but not to the right),
    and so cut a swath 9½ feet wide.


    However, the short blade''s limitation is the amount that can be taken off the
    face of the crescent. This is further influenced by the blade''s specific pattern.
    (The “wide-bearded”) models, for instance, are designed for more “depth.”) The
    limit of the “average” 22 to 24 inch blade in a wide movement may be 4 to 5 inches.
    A novice may start, therefore, by taking only a 2-to3-inch depth, increasing gradually
    as uncut strips are left in the stubble.


    I would agree with Tresemer''s statement “It is no disgrace to cutting a swath
    two feet wide” (Page 35 of The Scythe Book) if he had continued with something
    like “where space or grass conditions are limiting factors, and if the mower stands
    in the center of that two foot swath.” However, I strongly disagree with his advice
    that “Inexperienced mowers would be wise to take smaller blades by walking a bit
    to the left, even walking in the cut grass of the previous row.” (Ibid.) Even
    if it were physically possible, [see note 7] the mower would find himself working
    predominantly the right side of the body. As such, it is a fundamentally poor
    approach through which undesirable habits will be acquired.


    The stance and technique depicted in Figure 15 (Page 30 of The Scythe Book) is
    somewhat better, but will so overext the right arm and shoulder. It is also a
    waste of energy to throw the grass so far to the left. In doing so, only a portion
    of the potential accomplishment for any given time period will be realized.


    # TRIMMING TECHNIQUES


    Once you experience, and are comfortable with, the dynamics of the Basic Form,
    you will be able to adapt it to situations of great diversity. It is difficult
    to explain how creative the cutting patterns can be, when mowing very irregular
    areas strewn with rocks and junk and interspersed'
  - '[PAGE 179]


    with trees. You can even trim those tall and uneven mounds of topsoil made by
    bulldozers and often left to grow up in “weeds.”


    As noted in Section IV (Blade Selection) it is much easier to mow uneven surfaces
    with shorter blades because they can follow the contours more accurately. The
    habit of lightly “hugging the ground” most of the time will be appreciated here.


    At times, some of the previously stated “rules” will need to be broken. The shape
    and size of the strokes, as well as how you stand in relation to the cut, may
    be continually changing. One can follow a few short movements (between narrowly
    spaced trees, for instance) with a 9-foot stroke as soon as space permits, clamp
    the pattern and possibly use a short chopping motion, then widen again for a spell.
    All this can be done in a relaxed manner, provided the blade is sharp and you
    learn to follow “the path of least resistance.”


    That path is rarely marked by signposts but is always there for the attentive
    mower to follow.


    Apart from all else I have discussed thus far, the ease of cutting is affected
    by:


    # 1. The Time of Day


    By far the easiest time for a blade to penetrate the stems is just prior to dawn.
    It has little to do with actual dew, though its presence is often indicative of
    the plant’s internal moisture content, which changes over the 24-hour cycle. With
    a gradual rise in air temperature the cells transpire water and shrink. At sunrise
    I hone the blade perhaps twice as often as at daybreak. By the time the dew is
    completely gone, any wise mower would be resting in the shade … his day’s mowing
    done.


    # 2. The Density and Maturity of the Stand'
- md: '

    The most challenging to cut, in terms of density, are the extremes:


    - a. A very dense, frequently mowed lawn or an intensively grazed pasture.

    - b. Scant growth with burdock or unsupported individual stems.


    Regarding maturity, burdock (Arctium sp.) can be noted as an extreme example.
    Before the flowering stage, regardless of height or stem diameter, it can be cut
    with the lightest grass blade models. To deal with any sizable stand of burdocks
    at full maturity, I would trade even a sturdy bush scythe for a sharp ax or a
    pair of long-handled loppers. The above principle is true, albeit to a lesser
    extent, with practically every other plant, though most of them can certainly
    be cut with grass blades if the edge is suitably shaped and the mower''s technique
    correct.


    ## 3. The Direction of Approach


    Moving predominantly in straight lines or all the way around the field is not
    desirable in many instances. The scythe is not limited to such an approach, and
    mowing can often be transformed from hard work to pleasure simply by changing
    directions.


    Here, two factors, considered together, will determine the easiest path: topography
    and the “lean” of the vegetation (even if not apparent, it is usually there) within
    a given stand.


    My initial material on the topic of the path of least resistance was many pages
    long. As with anything I wrote, it came from the scrutiny of our 18-year-old homeschooling
    (“self-taught”) would be more accurate son Kai. He is my first and most critical
    editor. Apart from cutting up my lengthy Slavic-style sentences, he attempts to
    take out all the sentimental stuff and many philosophical passages. With his strong
    tendencies to practicality, if he wrote this addendum it would be one-third the
    length and titled: “No Nonsense Guide to Mowing!


    Faye is predominantly a doer, not a talker, though occasionally she pens down,
    in a few moments, what I may have struggled with for days. After the three of
    us spent several evenings debating how to condense my extensive notes on the “Easy
    Path,” she picked up a pencil and wrote the following:


    > “Creating a path with this tool, awareness becomes the key concept ... considering
    the land, judging the lean, reflecting on the plants, examining the edge, moving
    over angles, noticing the stubble, contemplating movement, meditating on the breath
    ..."


    So there you have it—a concise recipe. Short, accurate and yet expressive of the
    fact that what I am attempting to write about is more than grass cutting. It is
    the peasant’s dance, the morning prayer under the sky ...


    Axioms such as “If you cannot rest yourself while mowing, you are not doing it
    correctly” attest to the understanding that the task can be almost effortless.
    [See note 8.]


    The practice of T’ai-Chi Chuan, with its emphasis on the executing of smooth motions
    while in a reflective state of mind, is a beautiful—even if idealistic—model.


    The concept of not “losing” the expended energy but rather guiding it in returning
    circular patterns, the manner of breathing and the related imagery I consider
    all very applicable to the art of hand mowing. Can we, one, learn to guide the
    blade’s edge through the spaces between the plants’ cells? I think it is worth
    a try ...


    ## The Blade-Fitting Challenge


    FROM SOME OF THE STATEMENTS I HAVE MADE IN THIS TEXT, THE READER MAY surmise that
    my opinion of how scythes are often fitted, adjusted, sharpened and used is rather
    low.


    To express the overall picture to a farmer 100 years ago, I might have stated
    that the average scythe of today works somewhat like an underfed and poorly shod
    horse wearing a collar two sizes too large. This is only loosely descriptive because
    the majority of contemporary mowers, or mowers-to-be, never drive such a horse.


    The analogy to a car may be more fitting, since the average person nowadays does
    know how it feels to sit behind the wheel of a smooth-running one. Using this
    metaphor, I believe very few scythe outfits run if as “on all cylinders.” Most
    of them need a push or a pull to make it up any serious hills, and with respect
    to comfort features, are like driving a vehicle without shock absorbers.


    Take this as a comical exaggeration if you wish—it may lighten your heart, which
    alone can help with the mowing. However, I am serious and also certain that until
    some elemental challenges of a fit are addressed and dealt with, for many mowers
    to maintain their body in a comfortable position while also keeping the ideal
    edge-to-ground relationship as illustrated in Figure 20a), will be mutually exclusive
    goals.


    "a" affects the lay of the blade. Disregarding its variations has been most responsible
    for many unit''s innate disharmony.


    ![](img/27a09e01dbd329ab631e901469ce4b29_183_0.png)


    "b" affects the hafting limits. Usually if the one blade model a dealer chooses
    to sell fit the specific snath, it will fit all mowers unless their style of movement
    is distinctly different.


    ![](img/27a09e01dbd329ab631e901469ce4b29_183_1.png)


    The concept of "c" I find too complex to tackle here.


    ![](img/27a09e01dbd329ab631e901469ce4b29_183_2.png)


    Figure 18


    What has not been generally considered by the scythe sellers, as well as the buyers,
    is the fact that no blade model''s specific tang position is well suited to all
    mowers using the same model of snath, even if the latter is “custom-sized” or
    adjustable. Some combinations work better than others more often or for more people.


    ## WHY IS IT SO COMPLICATED?


    Apart from all other characteristics that define each blade as a *distinct model*,
    its tang is angled simultaneously in three specific planes.


    The scythesmiths do not invent these angles. They have always followed the exact
    specifications of their customers. Each respective model was “dreamed up” by someone
    who had reasons of his own for wanting it one or another. Many hundreds of models
    have been conceived and made. The Styria Company alone, for example, has patents
    for over one thousand of them. The specifications for each are in their records
    and could all be reproduced. There is no need to do this, for though the demand
    for diversity here (as with anything else) is steadily dying, they still manufacture
    over 200 models; plenty to choose from. However, we—and I refer here to both the
    dealers and the mowers—need to learn what to ask for and why.


    Whatever the benefits of the “Information Age” have been in some areas, it has
    obliterated much wisdom, skill, and service elsewhere. The decisions as to what
    should be sold often from "above"—the large wholesalers who know little or nothing
    about mowing. What determines the choices, above all concerns, is what product
    can be had at lowest price. [See note 9].


    The exceptions to these are very few; the Sahli Company of Switzerland is one
    of them, each blade is individually matched with a snath from over 20 different
    models sold in the respective regions where are still preferred.


    This is exemplary service, rare in today’s world. It continues in those areas
    of supply where obvious benefit, in terms of greater immediate profit, is gained
    by it—i.e.the customers are willing to pay for it. Those who would buy a scythe
    as assumed, by the world of commerce, to belong to two categories:


    - 1. They need the tool, which must mean they are members of an “unprogressive”
    nation and so too poor to pay a high price.

    - 2. They are casual users in wealthy countries who cannot tell the difference
    between high quality and, its substitute, or proper improper fit. Thus, for this
    second group, it does not pay to carry the expensive line or many options either.


    The curved metal snath—an easy one to manufacture—is the biggest seller in Continental
    Europe and is distributed in regions where still use some of traditional patterns.
    This snath does not fit all of these well, but many people buying today do not
    realize this. Today the knowledge of how to fine-tune a scythe is becoming rare.
    Many of the dealers have continued ordering their models, as before, in one sold
    in poorly pairs, and without the knowledge required to make best use of them.
    Adaptation of the measuring methods have not kept pace with these changes. The
    company’s reputation was built on “service first,” and they are sticking to it.

