    当镰刀是许多农业作业的首要工具时，刀片的长度不一：从用于在藤蔓和树木周围精细工作的短刀片，到非常长的刀片（在某些地区超过四英尺），用于修剪大面积草坪等要求不那么高的任务。现在欧洲农场最常用于各种任务的长度是
