    Looking back over several strokes, does the swath have the appearance of rolling
    waves? The blade is probably not being held parallel to the ground, and the point
    is cutting at a different height from the heel.


    And so on. If I cannot understand why the swath is uneven and irregular, I try
    to reproduce the badly cut grass, with exaggeration. Then I can discover the source
    of the trouble within my stroke, and correct my technique.


    The grass will teach you, but it is easier to learn on green hay or weeds than
    on wiregrass and handback. Young clover teaches an unstrained style as the blade
    whispers through the fragrant stems. The more difficult cutting of briars and
    tough weeds can then be approached with more effort but in a good style.


    Improvement in mowing technique also requires reading the body with as much attention
    to detail as any athlete needs to apply.


    Do your biceps ache for the work, or your back? Let your right arm hang straight.
    Twist your hips more, using the power in your ankles and knees.


    Is your neck sore? Do not hunch up your shoulders, or stoop over, or work too
    hard on a wide swath.


    Does your stomach hurt? Don’t stop breathing. A common complaint is a soreness
    in the stomach because of the unaccustomed twisting. You are probably facing the
    field as in golf and should discipline yourself to keep the right and left foot
    perpendicular to the line of the cut, or even advance the right foot beyond the
    left.


    Keeping the blade under the control of the body’s twisting rhythm, rather than
    violently thrashing the grass, prevents exhaustion, and prolongs the mower’s working
    day and his working years. When all the parts are working together, you will agree
    with the experience of Sir Stephen Talents, who mows by “guiding my blade serenely
    through” the grasses.


    Watch other mowers, and have someone watch you to see how small changes affect
    the cutting of the grass. There is room for personal differences in style. In
    some people the energy bursts from the left hip-bone, in others from the left
    elbow, in others it spreads evenly throughout the body.


    ## THE USE OF THE BODY


    Levin in his urban brother after his day of mowing: “You can''t imagine what an
    effectual remedy it is for every sort of foolishness. I want to enrich medicine
    with a new word: Arbeitskur.” Arbeit is German for work, movement, energy; cure
    means.


    > —LEO TOLSTOY, ANNA KARENINA, 1876


    Awareness of the dynamics of one’s own body can be employed to improve one’s ability
    at mowing, and, indeed, versa. Most helpful for this understanding is the knowledge
    provided in the teachings of F. Matthias Alexander.


    Alexander was an actor and public lecturer at the turn of the century whose career
    was interrupted by progressively worse vocal problems. Unable to find a medical
    explanation or cure, he spent several years carefully observing himself with the
    aid of mirrors, while speaking and at rest. He discovered that just before speaking,
    and even when thinking about speaking, he had been quite unconsciously tilting
    his head backward while jutting his chin forward. Though a small movement, it
    had cramped his neck and cut off the column of energy in his spine and throat,
    stunting his voice and presentation. At the same time, Alexander found, he would
    lift his chest and narrow his back, further cramping his larynx. After months
    of observation, he found that preventing the tension and movement in his head
    resulted in a return of voice as well as an improvement in his general state of
    health. Asthma, which had plagued him throughout his life, diminished gradually,
    until the attacks ceased altogether.


    Suspecting that his discovery of the head-and-neck’s role in voice production
    contained even greater benefits, Alexander proceeded in his investigation to a
    scrutiny of the connection of head and neck to the entire human organism, and
    to the use of the body, or more accurately the use of the entire self. Working
    from the premise of the primary importance of the head-neck relationship, he was
    able to teach others to become aware of habitual use, thus freeing them for a
    re-educated teacher of their bodies more appropriate to the natural functioning
    of the human organism.


    Alexander found that he tried to keep a dynamic balance between head and torso,
    his efforts were vain. His body became rigidly fixed in a new position. He also
    found that without mirrors he could not reliably know what he was doing with his
    head and neck, and therefore did not know if he was carrying them “correctly.”
    Since he couldn’t do anything to remedy the poor use, he was left with not doing
    what was hurting him. Inhibition of wrong habitual patterns of use became the
    central feature of Alexander’s approach. In the words of a disciple of Alexander’s:


    Before an unrecognized pattern of behavior can be brought to your awareness, you
    must either recognize the habit, for example through mirrors, or by Alexander’s
    observation, or by “thinking yourself to stop” when you are about to engage an
    activity. When you are about to move, think “NO!” And, gradually, through repeated
    inhibition, rather than repeated habit, you developed an increased sense of kinesthetic
    perception, enabling you to sense yourself when “setting yourself” physically
    to do something.¹¹⁴


    In my case, I first became aware of my poor use of myself in mowing; for example,
    I found that seeing dry wiregrass ahead in the row caused my neck and shoulders
    to tense, and thus put off my scythe stroke. I learned to inhibit this constriction
    during mowing in the way just described. Once I had inhibited the habitual response,
    I caused a pause between the stimulus (perception of wiregrass) and the response
    (tensing up for the anticipated harder mowing). In that pause is the opportunity
    for re-education of my use of myself. In that pause, Alexander suggested three
    directions, to be given myself silently:


    - 1. Let the neck be free (do not increase the tension in the neck),

    - 2. Let the crown of the head go forward and up (do not pull the head back or
    down),

    - 3. Let the torso lengthen and widen out (do not shorten and narrow the back).


    These instructions sound simple enough, but they are nearly impossible to enact
    each by itself. Taken together, the three instructions make up one sensation,
    which Alexander called ‘the true and primary movement in each act.’


    The term “primary movement” is a reminder that we are always moving in response
    to the accelerating force of gravity, and the head-neck relationship is the controlling
    center of this response. Alexander also termed this “primary control” to emphasize
    how important inhibition was to suppressing habitual patterns and permitting the
    body to do what it knows best. I use the term “primary movement” without ignoring
    the sense found in “primary control.”


    Primary movement can be observed in any child, as well as in top athletes. Its
    loss leads to abuse of the body, with attendant symptoms of impaired functioning.
    To aid the client in rediscovering primary movement, the practitioner of Alexander
    technique uses the lightest direction of hands, most often in the region of the
    head and shoulders. One can relearn to stand in a state of equilibrium, without
    tension (without military “Attention!”) and without slumping under the burden
    of one’s weight. The experience of the body’s anti gravity power used in the twisting
    exercise before mowing is an example of positive use of the primary movement in
    relationship to the earth’s power.


    The anthropologist Raymond Dart used the name “poise” for “primary movement.”
    By poise he meant a never-fixed dynamic equilibrium that is in effect even when
    the body is at rest. He related to the balanced energies in the double spiral
    of voluntary muscles twisting in opposite directions through the entire length
    of the body. The twin serpents coiled about each other in the insignia of the
    medical profession effectively illustrate this same principle.


    At the beginning of the scythe stroke body is twisted from the right toe to crown;
    at the end to the left. In each stroke I pass through the centering point of relaxed
    poise; at this moment, the blade is slicing through the grasses and I am tempted
    to compress and tighten the muscles of my neck and back. It is worth the extra
