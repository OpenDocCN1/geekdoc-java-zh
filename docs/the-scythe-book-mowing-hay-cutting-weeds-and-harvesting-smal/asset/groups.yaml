    # 洁净文化


    草本在黄铜镰刀下反复生长。


    > —《萨里的里的埃涅伊德》，1547年


    ……每一位农夫都修剪了土地周边的每一寸路边。每一处草地都被割过，环绕着石墙、树木、建筑……


    > —来自佛蒙特州兰多尔夫中心的弗洛伊德·富勒 3⁵


    # 杂草


    如果有意识地割除花园周围、沿路以及每个边缘区域在杂草结实之前的，我将慢慢改善我的家庭居住地。园艺害虫最喜爱的筑巢地被消除了；多年来，成群结队的杂草将逐渐退去。我访问过的每一个无论大小的欧洲农场都至少有一把镰刀；在几处高度机械化的农场，镰刀的唯一用途就是大面积的修剪。这种执着并非老家乡的一种古怪特质。以这种方式使用镰刀度过的每一分钟，都会在除草的时间上得到报偿。


    在割除杂草时，对镰刀的控制必须比割草时更加谨慎。刀法要更短、更精确，以避开石头、树木、栅栏柱、鸟巢以及一朵想要留下的花。我正在慢慢学会利用镰刀尖在草叶和苹果树干之间做出最细微的区别。


    罗伯特·弗罗斯特在《花簇》中描述了他发现“溪流旁一簇高高的花”的情景：


    > 镰刀放过了一簇跃动的花朵

    > 镰刀在长满芦苇的溪流旁挡住了它们。


    > 露水中的割草者曾如此爱着它们，

    > 任由它们茂盛生长，不是为了我们，

    > 也不是为了引起我们的一丝思绪，

    > 仅仅是出于清晨岸边纯粹的喜悦.³³⁶


    镰刀提供了一种辨别与观察的机会，而这是机械替代品所无法提供的。许多杂草都有极大的价值，当受到控制时，人们可以更深刻地欣赏镰刀。蒲公英可以酿美酒，乳草荚是极佳的升降剂，藜子叶是非常营养丰富的早期蔬菜（这让这种植物有了另一个名字——“野菠菜”），金黄草可以为孩子的学校项目制作简单的染料，等等.³³⁷


    在家里或农场周围的不同地方割除杂草时，问自己一个问题：为什么这种特定品种生长在这里？埃伦雷希·费费勒写过一本回答这个问题的小册，名为《杂草以及它们告诉我们的事》。与拖拉机相比，镰刀允许贴近土地，使得识别杂草成为可能。这些信息可以被解读，并有助于改善土地的决策。


    # 牧场


    在牧场上，营养丰富且味道甜的植物首先被吃掉，剩下的是不理想的。最后剩下动物不吃的植物。这些植物成熟、结实，并最终占据主导。动物会吃光食物供应。良好的牧场管理不仅涉及关注土壤的矿物质平衡和轮轮的定期休息，还要在最差的植物结实之前将其铲除。镰刀可以快速做到这一点，即使在大田里也是如此，因为割草者从一个堆放点移动到另一个点时比拖拉机更具灵活性。


    # 草坪


    草坪的重点在于割掉的草后留下的部分；因此，打理草坪是洁净文化法的一种变。在1831年手推旋转式割草机发明之前，所有草坪都是通过啃食的动物或使用长叶镰刀的园艺师来修剪的（图23）。


    ![](img/27a09e01dbd329ab631e901469ce4b29_80_0.png)


    图23 **割草**


    根据旅行者的报告，镰刀在希腊和土耳其，可能在其他地方也被用于修剪草坪。修剪我那八千平方英尺的草坪，70厘米的镰刀需要一小时十五分钟；手推和汽油动力割草机都需要大约四分钟。考虑到新设备的购买和维护成本，并考虑到为自己的劳动支付合理的工资，镰刀在经济上是具有竞争力的。它没有噪音和废气，也免除了汽油动力割草机的危险（消费者产品安全委员会估计，每年有77,000人被割草机割伤或失去手指或脚趾）。在较小范围内，镰刀会更加经济，但不适用于现代高尔夫球场。


    对于草坪边缘，新型汽油动力镰刀替代品采用一条短尼龙绳，在手持的三英尺手柄末端旋转。旋转的尼龙绳将草叶击散，导致叶片受损而非整齐切断。尼龙绳也会击碎（尽管速度较慢），并加入草坪边缘的落叶物中。我多次观察到人们非常有效地使用这些工具，速度取决于他们学会挥动镰刀快慢。我也多次看到他们顽固地攻击小簇杂草，让工具在那些太平坦而无法移动的茎上来回移动。在使用镰刀时，操作者比面对机器时学会挥动镰刀的速度更灵活。


    # 收割小谷物


    清晨播种，播种善意，

    正午播种，在露间播种；

    等待收获，和收割的季节，

    我们将欢喜地到来，带着麦穗。


    > —乔治·米诺与诺尔斯·肖，《十九世纪赞美诗》


    从对美国饮食的研究来看，许多人忘记了一句直到上一代以前农业人才就熟知的格言：面包是生命的食粮。所有形式的面包——从煎饼到硬干——都是可食的谷物。虽然我们的许多孩子只知道作为甜味早餐麦片和汉堡包形式的谷物，但不久前的农民他们熟悉用于特定用途的多种谷物。他们知道在特定的工作负载和天气条件下，自己和动物吃什么最好。他们知道什么最酿酒。


    现代园艺师或小农可以很容易为自己的餐桌种植少量谷物。这值得尝试。在38平方英尺的良好土地上花费几个小时，你可以种出一蒲小麦，这可以制作1792个4英寸的煎饼。黑麦、燕麦、大麦、荞的其他部分增加了不同的口味和体验。通过熟悉这些谷物为身体提供的不同营养，你可以建立与一万年前新石器时代之前的农业土地利用遗产的联系³⁹
    圣雄马·甘地为种植自己的食物增添道德维度，他坚持每个人都应该为自己的生计贡献部分劳动；他称之为“面包劳动”。


