    The following is the result of my making and using dozens of snaths of various
    shapes and grip positions. Even though the experimenting continues, I have concluded
    that the measurements suggested here work best for me and that two inches one
    way or the other may affect the experience significantly.

    Figure 6 on Page 12 of The Scythe Book can be used as a reference to the procedure
    of fitting, though I would like to be more specific. In my experience of fitting
    snaths to people, nearly all, when asked “Where is your hip joint?,” indicate
    their waist. I want to emphasize that the spot we'
  - '[PAGE 133]


    looking for is approximately 5 to 6 inches below waistline. A tailor wanting one''s
    hip measurement would lay a tape exactly over this area. Anatomically, the hip
    joint''s bony protrusion is referred to the greater trochanter.


    I suggest that the measuring be done in the footwear similar in heel height to
    what the mower wears at work.


    A few snath samples (including specific measurements) are depicted in [Figure
    1]().


    The lower grip of the trimming scythe (the snath with the blade mounted) held
    along the side of the body (as pictured in [Figure 6](). Page 12 of The Scythe
    Book) should reach to the above discussed on the hip, never below it. The distance
    between the grips should be one''s cubit (as defined on Page 12 of The Scythe
    Book)no less, but also much more. [Figure 1]() is an example of such fit for my
    proportions. I will put up with two to three inches more than if I use a snath
    the end of which drops down as a) or c) in [Figure 1](). On a straight snath this
    extra length would require that I hold my left arm higher than I like to, because
    it predisposes the building up of tension under the shoulder blade.


    For a field snath I like the lower grip two inches higher, as in sample b) of
    [Figure 1](). The distance between grips should be one''s cubit plus two to three
    inches. In field mowing the blade is moving away from my feet, with the snath
    on a lower angle to the ground. This allows my left arm to be also lowered and
    stay in a more comfortable position. The extra inches, therefore, provide better
    leverage without paying the price of the left shoulder''s discomfort. For the
    wide field movement, especially in heavy grass, one''s cubit distance between
    grips is not enough, unless the mower has very strong arms.


    Should you choose to permanently use only one snath for both types of work, a
    "compromise model" may do.


    It needs to be pointed out that many people are not built proportionately same.
    Some of us have extra long legs (thus the hip joint is further from the ground)
    or extra long arms (so the cubit is longer). A custom-fitted'
  - '[PAGE 134]


    snath for someone 5''10” tall (even if he mows barefoot) may not be of the same
    dimensions as the samples a), b, and c in Figure 1.


    Children need, or seem to do better with, snaths slightly longer in proportion
    to their bodies than the specifications for adults as discussed. Sample d is one
