    of grain in a field flat by the scythe and dotted the piles of tied sheaves. Where
    does that energy go when the last bit is cut? I do not know, but I understand
    the impulse to treat the last sheaf a special way as if the special stayed with
    it, and I treat the last sheaf of my harvest in a special way.


