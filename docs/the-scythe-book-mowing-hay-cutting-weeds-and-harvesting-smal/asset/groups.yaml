    # # V

    # Sharpening Principles


    EVEN A SUPERB QUALITY BLADE AND ONE PARTICULARLY WELL SUITED TO THE task will
    prove of little use if its edge is dull. The importance of the mower’s sharpening
    skill can hardly be overemphasized. In order to avoid caught early early stage
    by the relativity of the term “sharpness,” we can simply say that a sharp blade
    is *one which cuts with ease*.


    At a certain early stage, believing I already knew what “sharp” meant, I dared
    to share my “knowledge” with some of my scythe-using friends. But perhaps the
    following season I came to grasp other related details and consequently doubled
    my average hourly accomplishment, or cut each with twice the ease. This phenomenon
    is no means limited to scythe blades and I think that a seasoned butcher, old-time
    barber or woodworker would agree. Many years after you already regard yourself
    as an experienced mower, therefore, the following only as an attempt of apprentice
    to share with another.


    The cliche “or-sharp” is often thrown around without understanding that, with
    reference to many blades other than razors, the analogy is somewhat meaningless.
    Sharpening is a process of thinning metal edges is or less understood by anyone
    using cutting tools. The casual user, however, gives the *specific shaping of
    bevels* too little consideration. As a result many tools like knives, axes and
    yes, scythes with relatively sharp or even “razor-sharp” edges do not perform
    well. To express this alternately, it can be stated that a thin edge does not
    always mean “easy cutting” and thick (relative to the other) is not necessarily
    dull.'
  - '[PAGE 142]


    Most of the present day woodworkers who depend on hand tools understand this,
    as did, for instance, the best of the lumberjacks. were renowned for their skill
    in shaping the bit. Consequently, their axes took the largest chips out of tree
    trunks, yet had no tendency to “bind.” Many of these men could not explain it
    well in theory, nor even knew the specific degree of angles to which they ground
    and honed their tools. What they did know was how to make their axes cut with
    ease.(Dudley Cook, by the way, explains the pertinent principles in The Ax Book,
    the only comprehensive text on the subject of axmanship I have found to date.)
    [See note 3].


    Because we cannot weave a scythe''s blade (unless a section of the blade is cut
    off), let me use axes as an example to illustrate the concept of shape. The geometry
    of their fore sections and edges is large enough to be looked at easily.


    It is not difficult to put a hair-shaving edge on almost any ax, or even a splitting
    ma, with only hand tools and a few minutes of time. [See note 4].


    A splitting ax with such an edge will be useless as a tree-felling tool. To sever
    fibers, in addition to the keenness, it would need a more penetrating profile,
    such as is afforded by the innate shape of a felling ax. Likewise, a scythe blade
    that may shave hairs is not necessarily also one that, in some mowing conditions,
    will cut with ease, not for more than a few strokes in any case. On the other
    hand, it could be less keen than “razor-sharp,” but suitably shaped, and can be
    said of the felling ax. However, “suitably shaped” and “thin” are not necessarily
    synonymous.


    While in theory the thinner edge the easier it penetrates, the reality of plants’
    resistance enters the equation as a limiting factor. An edge with a profile that
    is too thin will simply crumble. The process of sharpening can therefore be regarded
    as a game of finding the compromise between two opposing objectives—easy penetration
    and durability.


    This is a relevant consideration during both separate, yet interrelated, scythe
    blade-sharpening steps, which in Chapter 1 1 referred to as beveling and honing.'
  - '[PAGE 143]


    The bevel of a tool functions as the intermediate portion between its main body
    and the outermost point of its cutting edge—the initial compromise between the
    qualities of strength and penetration. Some tools have only one bevel, referred
    to as a *primary*; others have a *secondary* bevel as well. Either of them can
    be on one or both sides of an edge. Their exact angles further define the level
    of the aforementioned compromise.


    Most tools acquire the primary bevel during or immediately following the process
    of manufacture. The secondary bevels are sometimes intentionally added by the
    maker or later by the user. Their purpose is to increase durability as well as
    reduce honing time by making unnecessary removal of steel from the entire primary
    bevel.


    To decide on both bevels'' specific angles and whether the secondary bevels be
    made from either side, both, or neither, is the personal touch of an individual
    user. For instance, a slight (5 degree) secondary “back bevel” on the *underside*
    of some broad axes, drawknives or large paring chisels reduces their tendency
    to dig into wood too aggressively. The zone of bevels is, of course, a continuous
    process of transformation as any tool is used and honed.


    The scythe of Continental Europe, Russia, and the Near East have a clearly defined
    *primary bevel from the top*. Initially the task of the scythemith, the beveling
    is accomplished by a somewhat unusual process of *cold-shaping* referred to as
    *peening*. This is *the first step in sharpening* taken at regular intervals,
    by the mower, throughout the continued use of the tool. Its purpose is to recreate
    the *desired geometry* of the primary bevel. At even more frequent intervals (about
    5 minutes) the bevel is further finished by honing, more commonly, in reference
    to the scythe, termed whetting.


    It will be eminently helpful for the user of not only this, but also any edge
    tool to understand that honing, by its nature, is a somewhat contradictory process.
    While the use of the steel is essential to help one achieve the best performance,
    it gradually wears off the very tip of the edge, eventually necessitating the
    return to the first sharpening step—the reshaping of the primary bevel.'
  - '[PAGE 144]


    On the subject of scythe blades, it is a highly pertinent consideration because
    the honing of this tool is a classic example of unintentional creation of secondary
    bevels, which rather quickly destroys the carefully shaped geometry of the very
    edge and with it the best performance.


    After numerous whettings (from 2 to 6 hours of use) the tip acquires a certain
    soundness or convex shape. Although hardly perceptible at a casual look, the change
    is readily noticed in use. The effect of honing gradually becomes short-lived.
    At a certain stage the blade may still cut tender plant material relatively well,
    especially if used with more force.


    Eventually the stems of the tougher grasses will not be cut at all, bending over
    instead; relative to its potential, the tool has lost much of its usefulness.


    The alternately shaded areas in Figure 2 b) illustrate the change.


    Let us say that 1/16th of an inch was removed from the tip. The bevel from the
    bottom may end up even a little steeper and more rounded in shape than the top,
    but so short'
