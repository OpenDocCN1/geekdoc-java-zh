    At the commencement of cutting, remove the cover and put it folded in your pocket.
    At the end of cutting, wipe off the grass and dirt from the blade, and put the
    cover back on. Secure it with a simple overhand knot behind the heel of the blade.
    At the end of the season, the scythe would be stored high up of children''s reach.
    And remember that the cover does not protect the legs of bystanders during mowing,
    or the hands of the sharpener.


    When scythees were used more widely, the blades were covered with a bag or custom-made
    sheath when not in use. In one area of England where scythe covers were not used,
    the tradition was to march en masse to the field with the blade in the air, the
    right hand holding the top grip and the lower grip thrust firmly under the right
    armpit. This regimentation prevented mishaps.^3 In every area, during the break
    for the midday meal, the scythe blades were laid in the uncut grass or grain,
    into which no man, woman or child could stray, protecting blade and flesh. In
    modern times, these traditions are not known to all, and the blade cover gives
    a necessary margin of safety.


    # SNATH


    A great variety of sneads or sneds or snaths have been used with the same long,
    curved scythe blade. One English tradition used only naturally curving saplings,
    while in East Europe offset handle was mortised into a straight pole, usually
    of ash or hickory. A traditional Scottish design had a long offset handle which
    met the snath almost at the scythe ring. The scythe is one of the few asymmetrical
    tools; with the hands do not perform opposite or interchangeable tasks.^4


    The grips (or nibs or nogs) have been attached to the snath in different ways,
    sometimes pointing out in the same direction as the blade, sometimes in the opposite
    direction, and occasionally mixed. Adjustable grips, made of a wire hoop around
    the snath tightened by twisting the wooden grip, have been found in museum collections
    pointing in nearly'
  - '[PAGE 24]


    every direction. In some traditions only the lower nib is used; in others the
    upper part of the snath is cradled in the crook of the left elbow.These countless
    variations can be expected from any tool which is locally made.


    The typical sweeping curved snath found in American hardware stores is made with
    bent swamp ash from the Southern United States. The poles are steamed, bent to
    the desired shape, and dried. The problem with this method is that the amount
    of wood necessary to keep a permanent bend increases the weight of the snath.
    Old-timers tell of going to the farm supply store to buy a snath and taking half
    a day to try out one of the snaths in stock, all of them slightly different. To
    reduce this variability in shape, snaths are now made even heavier, so that one
    turned out an identical pattern. Several samples weighed in 1980 averaged 4/3
    pounds. With the heavier stamped blade, this added up to 6½ pounds for the bent
    ash snath blade, versus 3½ pounds for the hammered blade and straight snath. Consider
    what this difference in weight will mean after the approximately thousand strokes
    required to cut an acre of grass.


    It seems that the curving “American” snath, with handles which rotate completely
    around point in any direction, tries to bring the angles of the hammered blade
    (Figure 2) to the simpler stamped blade. I prefer the simpler snath and the better
    blade. Sometimes an old snath will be very light and well-balanced, the primary
    disadvantages being the wood is dried out and fragile, and the adjustable nibs
    are permanently loose. Also, some scythe rings are so small that only certain
    very narrow tangs could fit through them.


    The weight of the heavy wooden snath makes more serious the tendency of the American-style
    scythe to put the right wrist in a cramped position. This position where the little
    finger is bent back towards the wrist (“ulnar deviation”) reduces the capabilities
    of the wrist and may lead to strain in the tendons.6


    Lighter snaths in the American style are occasionally available from aluminum,
    but I confess to a suspicion of aluminum used in tools under stress. Unlike steel,
    aluminum gets weaker and weaker with use—there is no “fatigue limit,” meaning
    no limit to weakening of the metal from from'
  - '[PAGE 25]


    normal use.Z Eventually it breaks. Even a little bend can upset the angle of the
    snath to the blade.


    After three years of experimenting with different snaths from several different
    countries, I decided that a slightly curved tubular steel snath made in Europe
    was the best available for the average user. It is light but strong; the blade
    is set at the correct angle to the snath; the lower grip nearest the blade can
    be adjusted though the upper grip is fixed. Every adjustable grip eventually becomes
    loose and must be shimmed with a bit of hardwood or leather. The knob of the tang
    fits into a slot at the end of the snath and is secured by two screws in the scythe
    ring tightened with a special key for that purpose. The key can be stored in the
    very end of the blade cover or looped around the belt; if the key is lost, the
    1/4-inch-square adaptor from a socket wrench then fits the screws of the scythe
    ring well. The snath needs very care except a cursory wipe at the end of the day.


    I have also developed a straight wooden snath made of air dried Vermont ash. Its
    design was synthesized from several different models currently used in Europe.
    It has the additional feature of a mortised channel for the lower grip, permitting
    adjustments to different body sizes. It is light, strong, and permits use while
    standing erect. Like all wooden tools, however, wooden snath requires extra care:
    if it gets too wet, it can warp slightly and change the angle between snath and
    blade. Then it needs adjustment. It should be lightly oiled at the beginning of
    the season—one part linseed to one part turpentine is a penetrating and clean
    solution. The section between the lower grip and the blade should be oiled again
    after each extended use of the scythe in wet grass. The choice to varnish instead
    of oil must be made at the very beginning, and the snath requires four or five
    coats of varnish to be absolutely certain that every pore in the wood has been
    filled.


    Without this little extra care, the wooden snath can become a less useful tool
    than the tubular steel snath. Therefore, this snath is best for those with some
    prior experience of mowing on to base their decisions for adjustments. The advantage
    of the wooden snath is in the user’s ability to perfect it as a tool uniquely
    fitted to him- or herself, a graceful tool closely complementing the individual’s
    body proportions, rhythm, and style. It is a'
- md: '

    grander snath than any other and permits full use of the blade’s virtues in a
    balanced swing. The flexibility of wood has a nice feel as an intermediary between
    the flesh of the hand and the metal of the blade.


    Several rules for the placement of blade in relation to snath, and for the adjustment
    of the grips along the snath, recur repeatedly in the old accounts of the scythe:


    - 1. If the heel of the blade is set next to the heel of the right foot, the first
    grip should come to a point just below the right hip bone (Figure 6).

    - 2. When the scythe is held in this position, the left foot should swing out
    the blade following its curvatures. Continuing with the left foot gives a good
    idea of the shape of the longer blades once for mowing lawns. To obtain the angle
    of the blade and snath (“hafting angle”) more accurately, set the snath against
    a blade with the upper grip resting on the ground and the snath in the “twelve
    o’clock” position (Figure 5). Mark the point where the “beard” of the blade (the
    edge nearest the snath) touches the wall. Now pivot the snath to the right on
    its upper grip the snath is at about two o’clock, and the tip of the blade is
    in a vertical line with the mark on the wall. The tip should be three fingers
    below the first mark. This method can be adapted to setting in the field by using
    marks on the ground.

    - 3. The two grips should be as far apart as the length between the elbow and
    the fingertips (the Mesopot cubit). This puts the top grip at the shoulders (Figure
    6). This measurement can vary according to conditions, in easy cutting becoming
    as short as four hands (a hand being about four inches).

    - 4. The scythe should balance with the blade parallel to the ground on one finger
    held in the middle of the lower grip.


    The scythe blade is twisted, or cocked, with respect to its tang. When scythe
    blades were sent out with no angle to the tang, and the blade was attached with
    a simple ring and wedges, the fitting required a careful bending in a vise until
    the tang is rotated to an angle with the blade of about twenty-five degrees (Figure
    2, end view).


    The basic rule here is that the scythe be dragged on its rounded back without
    engaging the edge in the ground, but with the edge no more than 1/4-inch above
    the ground. This is how the lawn is mown, and if you can mow the lawn, then the
    blade is properly cocked and hafted.


