    # # Mowing Technique


    O sound to rout the brood of cares,

    nThe sweep of scythe in morning dew


    > —ALBERT, LORD TENNYSON, IN MEMORIAM LXXXIX, 1833


    MOWING SHOULD BE COMFORTABLE, NOT TOO STRENUOUS, NOT—IMMEDIATELY—tiring. If it
    is it, it is wrongly done. Dress for mowing, therefore, should also be comfortable.
    The best includes loose-fitting pants and shirt. The shoes should be light; the
    feet are not threatened, and mowing was often done barefoot. A sun hat is a good
    idea, and is always worn by the European mower. A scarf may be useful to warm
    the neck in the early morning, and to mop the brow in the afternoon.


    # # A HELPFUL EXERCISE


    An exercise to begin each mowing session helps remind me of the shape of the movement
    (Figure 14). I stand erect, neither slumping nor rigidly at attention, and consider
    gravity as the fundamental force of the earth, which acts upon my entire body
    at every moment. Gravity is an acceleration, opposed to a steady velocity: an
    ever-new force that pulls me downward faster and renewed. I respond with an acceleration
    upward, in opposition, also renewed every moment, an anti-gravity. I prefer the
    terms energy or spring to anti-gravity for denoting this counter movement; it
    is not an anti-earth force, or a rejection. The earth is the entity from which
    we spring. We are the earth’s offspring. The other connotations of spring are
    all correct. Neither pulled to merge with the source, nor flying up uncontrollably
    in escape, I stand erect, firmly grounded yet springing toward heaven. The stance
    itself is an act of creativity. Although this interaction'
  - '[PAGE 45]


    ![](img/27a09e01dbd329ab631e901469ce4b29_45_0.png)'
  - '[PAGE 46]


    Figure 14 Twisting exercise


    between myself and gravity always goes on, it is usually unconscious.

    Mowing reminds me of the relationship, as it restores the balance of gravity

    and spring.


    In the middle of these two accelerating flows of gravity and spring, I am

    relaxed; my shoulders are not hoisted, my neck is not stiff, and I can

    mentally travel from one part of my body to another releasing unnecessary

    tension. Then I begin to twist my torso from one side to another, to face my

    right, then I let my arms swing free. My right hand flops against

    my left thigh, and a full second later my left hand flops against right

    thigh. There is twisting movement in my ankles, knees, hips, and all along

    my spine. The exercise serves to remind me of three things:


    +   1. Mowing is a twisting movement, from the right side of my body

    around the front to the left side;

    2. My arms and shoulders need not be tense, but may be relaxed;

    3. My whole body is involved in the twisting motion. The human

    body can be seen as two coils twisting diagonally in opposite

    directions up through the body in dynamic equilibrium. In mowing,

    dthis dynamic equilibrium becomes a rhythm between one side and

    the other.


    The energy that issues in the mowing stroke is stored in our tendons and

    muscles as we move. Tendons are superior to the yew used in hunting

    bows for storing energy under stress. They are even superior to modern

    spring steel. In Greek and Roman times animal tendons were wound in a

    spiral to power very effective catapults that could send a 360-pound stone

    aquarter mile.12 When I am at one extreme of a twist in the body, my tendons

    are storing energy, as a wound rubber band does. This energy is released

    aid the contraction of muscles when I twist to the other side. The best stroke

    uses all the tendons in all the joints.'
  - '[PAGE 47]


    # WITH THE SCYTHE


    Moving from the exercise to mowing, I let my right arm hang loosely to the side.
    This is where I had it at the beginning of the scythe stroke. The point of the
    blade is in line with both feet (Figure 15, beginning). My left elbow is cocked
    enough to set the blade at the desired height.


    ![](img/27a09e01dbd329ab631e901469ce4b29_47_0.png)


    Figure 15 Beginning and end of the stroke'
  - '[PAGE 48]


    I stand upright. The stereotypical picture of the man with a scythe shows bent
    over in a posture that would leave him exhausted and crooked at the end of an
    hour. Today’s cheap hardware-store scythe also pulls the body over a stoop, a
    fatiguing position. One should be able to use a good tool all day, every day,
    without pain or abuse to the body. The great improvement in Roman Gaul of the
    long-handled scythe over the short handled scythe and sickle of early Roman times
    is the ability to stand erect and relaxed, and thus do much more.


    My body twists around the left, my left elbow bending further and leading the
    way around the back of my body. The stroke ends when the blade cuts through the
    line made by both feet (Figure 15, ending). At this point my left elbow is almost
    touching my backbone. My chest faces left. There is tension in every joint as
    the pendulum of the swing comes to its furthest point.


    At best, the stroke does not have to be stopped. It is initiated with just enough
    energy that the last of the grass is cut and the windrow as the momentum of the
    stroke is reduced to zero; the leftover energy is comfortably stored in the tendons
    to power the recovery back to the right.


    As I swing back to the beginning of the next stroke, I move both feet forward.
    The heel and toe of the scythe are parallel to the ground and just above it at
    all times. The shape of the cut is a crescent.


    The grass tends to be thrown by the left by the scythe; therefore I proceed as
    if walking the edge of the uncut grass. Many people confuse a scythe with a broom
    or a golf club. They face the field straight rather than walking along it, and
    to slash the grass. The heel of the blade always rises useless above the ground
    at the beginning of the stroke. Despite a vigorous swing, little is cut. The grass
    that is cut is thrown into the next swath. This approach is pictured in Figure
    16.


    For the right approach, I walk the edge of the field, twisting my body, keeping
    the heel of the blade down to the ground from beginning to end (Figure 17). In
    or croquet there is only one point of impact on the ball. In moving, there are
    a hundred points of impact and they must all be hit at the right height. Rudyard
    Kipling gave a nice metaphor for the'
- md: '

    sweeping arc of the mowing stroke: “The foresail scythed back and forth against
    the blue sky.” The Mower is the mast, the boom is the scythe.


    I practice on a lawn, dragging the blade in the stroke and in the return. A cross-section
    of the blade from edge to rib, the area behind the edge is gently curved out.


    ![](img/27a09e01dbd329ab631e901469ce4b29_49_0.png)


    from behind


    from ahead in the row


    Figure 16 The hacking stance


    ![](img/27a09e01dbd329ab631e901469ce4b29_50_0.png)


    Figure 17 The rhythmic twisting of scything, blade always close to the ground


    ![](img/27a09e01dbd329ab631e901469ce4b29_51_0.png)


    Figure 18 Reaching out to enlarge the swath (Figure 5). In close mowing the convex
    blade slides along digging as the stamped blade would. With this exercise, the
    lawn gets mowed, and I can keep the blade parallel and close to the ground. For
    a wider swath, my right and left hands reach out to the right at the beginning
    of the stroke and are further from my body in the swing. The mower painted in
    Figure 18 leans towards the grass without losing his balance and stooping. An
    experienced mower in good grass can cut a swath seven feet wide or more with the
    blade. An average swath of six to seven feet wide was used as a unit of measure
    in hayfields. Inexperienced mowers would be wise to take smaller bites walking
    a bit to the left, even in the cut of the previous row. The importance of a clean
    cut over a wide cut is illustrated by the scoring systems of mowing at the annual
    meeting of the Dairy Improvement Association of Sullivan County, New Hampshire:


    | Criteria | Points |

    | :--- | :--- |

    | Neatness of the stubble | 45 |

    | Width of swath | 30 |

    | Time to cut one square foot | 15 |

    | Time to cut ten square feet | 10 |

    | Sloppiness of cutting | Subtracted points |


    Most of it is not strength which permits a wider cut but rather the proper twisting
    to store energy in the tendons. The length and breadth of the swath also vary
    with the condition of the crop, and the evenness of the cut is after all the aim
    of mowing. Poor grasses that are short and brown on stony soil are obviously harder
    to mow than tall weeds on level ground.


    ## Small Advances


    Although it is best for the beginner to stand erect without stooping over, or
    he will have the experience of being pulled forward when the width of the swath
    is increased. When this position becomes a stoop, it should be abandoned; the
    knack of positioning yourself in mowing is to learn how to lean into the work
    without losing balance. Even following all the rules of technique, there are opportunities
    for variations. The snath and blade are manufactured to hold the cutting edge
    in the right relationship to the grass. The blade can, however, be manipulated
    to maximize the cutting angle. I cut always with the blade parallel to the ground;
    but this lets me two approaches to the grass. If I put my left hand against my
    belt and bring the right hand around through the stroke, I can make a cramped
    slice. The opposite approach is to pull the whole blade straight across the grass
    like a cleaver hacking meat. With the narrow slice, a mere inch of grass is cut;
    with the broad hack, the grass tends to bend over. All mowing combines the two
    approaches; in varying conditions I must alter the approach to have more slice
    or more hack. If the cutting is easy, I may reach out at the beginning of the
    stroke to increase the size of the swath, while sacrificing some of the slicing
    effect. If the cutting is difficult, I may wish to maximize the slicing effect
    and minimize the hacking effect by dosing the blade inward. Within the limits
    of the scythe ring, the blade can be shifted slightly in its seat to create the
    slice or hack effects, but I have found that the way in which I use my arms, as
    just described, is adequate to adapt to most mowing conditions. In some conditions
    I do not hold my feet stationary while cutting. I begin with my weight on the
    right foot; then, as my body begins to unwind, my weight moves onto the left foot.
    I move down the field in a slow walk. These and other variations are appropriate
    in different conditions of cutting. Experiment. The grass will teach you. The
    account given in Anna Karenina by Leo Tolstoy the nobleman Levin joining the peasants
    for a day of mowing is a fine articulation of the ease and style inherent in mowing:


    > The old man, holding himself erect, moved in front with his feet turned out,
    taking long, regular strides, and with a precise and regular action which seemed
    to cost him more effort than swinging one''s arms in walking, as though it were
    in play, he laid down the heavy, even row of grass. It was as though it were not
    he but the sharp scythe of itself swishing through the juicy grass... The longer
    Levin moved, the oftener he felt the moments of unconsciousness in which it seemed
    not his hands had swung the scythe, the scythe of itself, a body full of life
    and consciousness of its own, and as though by magic, without thinking of it,
    the work turned regular and well-finished of itself. These were the most blissful
    moments.


    It was only hard work when he had to break off the motion, and to think; when
    he had to row a hillock or a tuff of sickle. The old man did this easily. When
    a hillock he changed his action, and at one time with the heel, and another with
    the tip of his scythe, clipped the hillock both sides with short strokes. And
    while he did this he kept looking and watching what came into his view: at one
    moment he picked a wild berry and ate it to Levin, then he flung a twig with the
    blade of the scythe, then he looked out quail''s nest where the bird flew just
    under the grass.

