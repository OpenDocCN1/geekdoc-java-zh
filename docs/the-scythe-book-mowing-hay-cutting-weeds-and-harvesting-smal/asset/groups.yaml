    ## III

    # How Tough Is a Scythe Blade?


    I AM NOT PARTICULARLY GENTLE WITH ALL OUR BLADES AND CONTINUE TO BE awed by how
    much they can take. They are confronted with rocks frequently. Usually I survey
    the damage to the rock as well as the edge. Often it happens that a piece of the
    rock is missing and nothing from the blade. At times I have to look carefully
    against the edge for the light reflection to know which portion contacted the
    rock. I have run into wire fences and steel ground with these blades and would
    indeed dare to move a junkyard clean, weaving between all the car parts strewn
    about.


    While at the Common Ground Fair in Unity, Maine, I was discussing the “toughness”
    aspect of scythe blades with Marc Harmon, a man who had spent most of a day around
    our demonstration area asking “above average” questions. We happened to be squatting
    by the back of ''76 Chevy LUV and I in my hands Fairlight''s 24” Turkish pattern
    blade. To emphasize that it is stronger than it looks, I held it by the tang and
    drove the point times against the truck''s steel bumper. Amazed, Marc inspected
    first the blade, which bore no marks of the combat, then the bumper showed definite
    indentations.


    Right away he wanted to buy that very blade, though I assured him that there was
    nothing special about it, and every other one of these Austrian blades is made
    to the same specifications. He still insisted, so I let him have it.


    Thinking it was rather funny, I learned the story to Scott Howell of Blue Hill,
    Maine, who came by soon after, and with another used blade, that happened to lay
    there on the table (a 22" Greek pattern), showed him what I had done. Then I walked
    away to talk with someone else. On returning I learned Scott, likewise, convinced
    my son to sell him that little blade, which Fairlight and Ashley had used, among
    others, that summer. I found this even funnier. You see, Scott is built like a
    blacksmith of pioneer days when all the horses, willing or not, had to be shod
    ...


    When he came to my workshop two years ago he brought with him his own scythe,
    the battle wounds of which were a testimony to his strength. Subsequently I made
    him a snath of ironwood (hop hornbeam). There are blades more suited for extra
    hard-working people. They would not be one of the above-mentioned models, which
    are very narrow and among the lightest in weight produced in Austria today. Neither
    of them have "stone-points." They even look too delicate for "real work," I have
    been told.


    This is an illusion. Those blades and others just like them have cut a lot of
    tall, dense grass here, as well as mighty looking birdies, yearling old green
    poplar trees, clumps of mature goldenrod, raspberry canes and so on....


    They were made by the Styria scythe factory in Rossleithen, Austria; whence also
    come blades on the American market today, including the "flat ones."


    Certain sources erroneously refer to the "Austrian style" blades as made of "mild
    carbon steel" or "soft steel so they can be hammered." I reckon there is little
    that is mild about a blade which was forged out of steel with 0.8 carbon content
    and tempered to the hardness approximately equal to that of a good quality ax—unless
    one''s definition of "mild" comes from some, to me, unknown classification tables.


    Styria''s "Austrian," "American" and all other patterns are made of the same steel,
    shaped under the hammer and tempered very close to the same hardness, which today
    is 47 to 48 Rc. (Rockwell scale).


    I hope that my driving the points of scythe blades into truck bumpers will not
    encourage others to do the same. Let me add here that I have never bent or broken
    one and that, a few years ago, I would not have dared to do this.


    ## IV

    # Blade Selection


    SCYTHE BLADES ARE STILL MANUFACTURED FROM 12 TO 50 INCHES IN LENGTH, in many distinct
    patterns, and still more models of each of these. The lengths from 24 to 32 inches
    are probably most frequently worldwide. Yet to decide which is the most suitable
    single pattern, model and length for the average American user of today is, I
    feel, an impossible task. The issue should, however, given more consideration
    to the decision on the level of compromise can be made somewhat knowingly and
    collectively by dealers as well as the customers.


    The shortest and the longest blades represent the extremes of maneuverability
    to the potentially largest area of grass that can be cut with one movement. To
    limit the customer''s options to but one blade is unfair. Whatever way it is justified,
    it will not best serve most mowers under all conditions. Further, it propagates
    ignorance that most customers are not told, and so unaware that options do exist.
    Conversely, for any mower who is offered several blade lengths to be content with
    only one depreciates the scythe''s potential as well as his own. It is poor economy
    from the standpoint of time even if one''s pleasure in using a well-fitted and
    suitable tool is not taken into account.


    In spite of my barefoot mowing, as I sit here searching for an analogy, shoes
    of all things come to mind. We all get by with one pair of them. In comfortable
    hiking boots we could go to church or a dance year round, climb snowy mountains,
    stroll tropical beaches or jog the city pavements. Why we don''t, each individual
    no doubt has personal reasons for. Yet, from the perspective of each one spoiled
    by having so many different scythe blades, I would find living with one pair of
    shoes easier, or more acceptable, than with but one blade.


    Please realize, therefore, that in any way my effort to help you decide which
    is the "ideal" blade, I could write it down. The lengths available at this time
    are as follows:


    - 20" and 22"

    - 20" and 24"

    - 20" and 26" — for children or small area specialists

    - 22" and 28"

    - 22" and 30"

    - 24" and 28"

    - 24" and 30"

    - 26" and 30"

    - 28" and 32" — for relatively large areas with a smooth surface


    If I had to part with all two blades, I would keep 22” and 34”. The “general purpose
    compromisers” may be satisfied with a 24” or 26” if they do predominantly trimming
    work or 28” if most of their grass surface is relatively open.


    A 22” may be my favorite of the “short lengths,” and highly recommended to those
    who would later consider an addition, but like to “start small.” (Use it also
    for trimming!)


    A good length to complement this one would be 28” for the cutting of more open
    areas. Those who, like me, consider the scythe a serious grass-cutting tool may
    add 30”.


    Having two lengths at my disposal, instead of only one, I find it twice as useful.
    In most cases the weight difference will be appreciated. They were developed for
    those who had a lot of work for such a tool. However, if you feel the need to
    acquire one, it does not need to be long; it is used with a shorter movement,
    often directed at a single stem or a length of 20” is plenty and 18” or even 16”
    will suffice.


    In constrained areas, garden or orchard, I find a 22" blade much more suitable
    than a longer one.


    The virtue of the longer blade is in allowing a deeper bite into the grass. Those
    who consider several acres of hayfields would find it advantageous.


    There have long existed two types of blades that span the difference in purpose
    between sturdy bush blades and the light grass blades. These are the so-called
    “Forest Culture” and “Ditch” blades. I find much more frequent use for them than
    their heavier cousins. Moreover, there is little I

