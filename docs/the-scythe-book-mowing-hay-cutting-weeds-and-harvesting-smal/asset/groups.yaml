    # The Old Man''s Gift


    “The scythe must dance,” the old man said

    “Yes, I can imagine it in my head;

    But is this step first or instead?

    There''s not a guide which I have read.

    I will teach you each before you''re dead?”


    “See what I do—watch closely now!

    The dance you''ll learn—I''ll show you how.

    The young girl smiled and gave a bow

    As she thought of a fragrant hay-filled mow

    With leafy feed for her only cow.


    Together they met in the meadow each morn

    To dance before the day was born.

    One taught the steps, one learned the form,

    Stone often slipped from water-filled horn,

    Blade slicing smoothly grass and corn.


    Gazing upon neat swaths with pride

    And gratitude she did not hide,

    thanked the teacher at her side

    For a skill which makes the heart so blithe—The old man’s gift before he died.


    FAYE ABEND VIDO

    JANUARY 2001


    # Introduction


    EVERY VERSION OF WHAT WE MAY, AT A CERTAIN POINT IN LEARNING, REFER TO AS “complete”
    is, of course, only relative; the path to knowledge is infinite. David Tresemer
    took the scythe related research, in his own words “… as far as it could go.”
    At the time I crossed paths with The Scythe Book, it was exciting to learn that
    someone had indeed written so much about the tool with which I was just falling
    in love. Today I am dismayed by how all written material I have managed to find
    thus far on how to use the scythe is sorely lacking in depth.


    Nevertheless, the poetry and old accounts of mowing which Tresemer included in
    his book, along with the metaphysical undertones of certain passages, eventually
    played a role, perhaps a significant one, in inspiring me to continue the search.


    The tool itself I could readily appreciate on its own merit. Growing up in Slovakia,
    albeit as a town than country boy, I saw the scythe used frequently. It must be
    an energy-efficient method of harvesting substantial areas of forage, I reasoned,
    or the socialist system, all its various flaws notwithstanding, would not so depend
    on it. Until the era of the Communist regime ended and brought along certain kinds
    of “freedom,” all roadside ditches as well as grassy areas within town limits
    were trimmed by elderly men with the scythe. [See note 1].


    Coincidentally, that very summer when one of our farm apprentices who came to
    learn how to work with brushes, brought along his copy of The Scythe Book (which
    hitherto had not seen), my parents from Slovakia were also here on an extended
    visit. I was teaching the apprentice how to use, among other implements, the sicklebear
    team mower, while my father, with an old scythe I bought at an auction sale for
    a few dollars, went about trimming the areas the horse-drawn machine could not
    reach. By a stroke of luck the scythe consisted of a European pattern Austrian-made
    blade with an elevated tang mounted on a better-than-average light aluminum snath.
    My father was not a man of many words, and so The Scythe Book''s philosophy nicely
    complemented the events taking place. I tried the scythe and liked it instantly,
    though did not begin to use it until the next season. A turbulent storm had made
    such a mess of a couple acres of buckwheat that any mechanical cutter would have
    proven useless in harvesting it. With the scythe I could follow the trail of the
    wind, snaking through the field in whichever direction the stems required. It
    was empowering, and I cut every bit of it plus several more acres of well-standing
    grain that fall.


    Next summer, while still cutting 50 to 60 acres of fields with the horses, I followed
    those little places in my father''s footsteps ...


    The cold shaping of an edge, however, was different. Back in 1977 my old farmer
    instructor''s first lesson was: There are only two transgressions for which a
    blacksmith can go to Hell. The first is hammering cold steel; the second, not
    caring enough. Money meant little to my father. He consequently never instilled
    in me that I was an honoured means of exchange for the expending of one’s energy,
    so I was already on shaky ground ... Going to Hell was not yet on my agenda; I
    was having too much fun mowing by hand, among other things.


    Yet an Slovak axiom states: “Peening is to the scythe blade what bread is to the
    mower.” David Tresemer endorsed it. So risking that gate into Hell, I gave peening
    a try. This is when I learned that peening is a vital skill.


    What is bread to the mower, peening is to the scythe blade. Without proper peening,
    the blade loses its edge and its ability. David Tresemer''s work emphasizes the
    importance of this process, which is often overlooked in modern mowing techniques.


    ## Clarification of Terms


    Using “stamped” as a blanket term for all non-European style blades discredits
    the skill of all British and American blacksmiths who did forge their creations.
    It is important to distinguish between mass-produced stamped blades and those
    hand-forged tools. The latter often possess a quality and durability that the
    former cannot match.

