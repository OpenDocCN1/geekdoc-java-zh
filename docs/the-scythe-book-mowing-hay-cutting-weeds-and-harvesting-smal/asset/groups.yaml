    - 18. R. L. 阿德里（Ardrey），美国农业进口；乔治·福塞尔（George Fussel），农用工具：1500-1900。


    - 19. 雅各布·布朗诺夫斯基（Jacob Bronowski）在《人类的》中写道：“延伸手的工具也是视觉的仪器”（第118页）。这句话对于镰刀来说似乎特别真实，因为“镰刀”和“视觉”（古英语为
