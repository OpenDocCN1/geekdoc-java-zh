    在我们的风格下，刀刃平放在砧上，从刀刃的上侧敲打。当使用镰刀时，刀刃翻向上，从下侧敲打。为了防止金属过热，最好偶尔浸入水中。新鲜锻打的镰刀足以完成一整天的收割。


    也许“聪明”在那些日子意味着其他意思……事实上，其他公司随镰刀附带的其他说明书同样缺乏实用性。它们强调“刀刃在任何情况下都不能通过磨削来”，而且锻打需要“非常仔细地执行”……但具体如何，取决于割草者的智慧。


