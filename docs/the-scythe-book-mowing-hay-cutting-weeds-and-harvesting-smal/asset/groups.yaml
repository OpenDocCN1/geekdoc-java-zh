    loosest at this moment, while directing (ordering) my “neck to be free,” “head
    to go forward and up,” and “back to lengthen and widen.”


    The scythe grips are held by the hands only and need not involve the arms and
    shoulders in tension. The “primary movement” of head freed from the spine, forward
    and up with the crown, leaves abundant energy for the twisting through the rest
    of the body. The tool can swing freely, powered equally by every joint, and thus
    freeing them all.


    The intrinsic rhythm of tool and mower combined, like a twisting and untisting
    wheel, has a power and creates a timeframe all its own. A British farmer speaks
    of this experience:


    > I come to feel indolence in action, the scythe do it, and a force that is not
    takes possession of us both and we swing, swing^16


    # Again we construct Levin:


    Another row, yet another row, followed—long rows and short rows, with good grass
    and poor grass. Levin lost all of time and could not have told whether it was
    late or early row. A change came to over his work, which gave him immense satisfaction.
    In the mid of toil there were moments when he forgot what he was doing, and it
    made all easy to him, and at those same moments his row was almost smooth and
    well cut as Tit’s. But so soon as he recollected what he was doing, and trying
    to do better, he was conscious of all the difficulty of his task, and the row
    was badly sown.


    We see that Alexander’s “primary movement” has been well expressed by others,
    and we can encounter another aspect of the best use of the body, how it can change
    our perception of time. When I am using my body well, I enter into this timeframe
    and follow the rhythm of my primary movement in relationship to the scythe, to
    the grass, and to the earth^17


    Experiences recorded in Michael Murphy’s Golf in the Kingdom and Eugene Herrigel’s
    Zen in the Art of Archery reinforce Alexander’s lessons and articulate them in
    the spiritual realm. The Zen paradox is that if I give up hurried intention of
    “getting the hay in,” I will in fact better. From Alexander’s point of view, the
    hurried mower has forgotten the best of body in all the rush. It is so tempting
    to orient to the goal and forget the means we employ to get there. Always end-gaining,
    we forget what is actually happening. My objective is to have the hay; my attention
    is on the process of cutting it: I set myself at the beginning of the swath and
    let the mowing commence. “God speed the mowing!” as a form of salutation among
    mowers, much like “Good morning to you,” seems to me to be an invocation to promote
    primary control.


    Inhibiting my habitual tensions and permitting myself to enter into the clock
    wheel movement with the scythe, however, be done while I am unaware of my surroundings.
    Then I am entranced with the inexorable rhythm of my own primary movement that
    I do not look back on my work to check the stroke, and variations in the rhythm,
    such as are demanded by molehills, stones, and the rare toad or partridge, easily
    destroy the heavenly balance. Entering into a poised rhythm with awareness of
    my environment permits me to perform as evenly and flexibly as Levin’s old teacher.


    The human rhythm of mowing, and the flexibility it permits, is central to the
    superiority of the scythe as a tool. The first mechanical mowing used one or several
    scythes whirling about complete circles from a horizontal wheel directly powered
    by the wheels of the machine turning on the ground. The inventors were trying
    to do what the human mower was doing, faster. In fact, these machines performed
    worse than humans—they were unable to accommodate changes in terrain, type of
    grass, direction of lay in lodged grass, and obstacles. On any but the smoothest
    homogeneous ground, the blades often dug into the ground or bent the grass over
    without cutting it.¹18


    # RECONSIDERING THE TWISTING EXERCISE


    > The meditative repose in which he performs (the preparations for working) gives
    him that vital loosening and equality of all his powers, collectedness and presence
    of mind, without which no right work can be done.


    —Eugen Herrigel, Zen in the Art of Archery, 1953


    I stand again in a relaxed manner with the scythe on in front of me. I take a
    moment to relax. Then I let my ankles become looser, so that I begin to rotate
    from side to side. I loosen my knees, hips, and torso, letting my arms flop from
    one side to another. I am always aware of the relationship of my head to my neck
    and to the rest of my body.


    To this point I have concentrated on my own primary control and on inhibition
    of my habitual ways of moving, so that my body can twist more freely. Now, without
    actually doing it, I think about holding the scythe in this movement. If I tense
    up, then I can take the time to relax tension without the real distraction of
    the scythe in my hands.


    I then pick up the scythe and continue the twisting experiment, feeling the weight
    and shape of the tool. Finally, I can approach the grass with the scythe. In this
    way I proceed carefully from my relationship to gravity, to my own primary control,
    to my relationship with the tool, to my relationship with the grass. The scythe
    draws my primary control out my own body to relate to the earth. 19


    # Mowing Hay


    Grass is the forgiveness of nature—her constant benediction. ... should its harvest
    fail for a single year, famine would depopulate the world.


    > —SENATOR JOHN JAMES INGALLS


