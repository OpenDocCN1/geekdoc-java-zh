    ![](img/27a09e01dbd329ab631e901469ce4b29_32_0.png)


    Figure 7 The grindstone (E. Portland, Maine, 1910).


    Today the handyman sharpens this type of blade with a small grindstone rotated
    in an electric drill, followed by a file, followed by a coarse

    Carborundum or Crystallon-scythe stone."


    Yet old accounts tell of taking a strictle to the fields—that is, a stick

    scored with a saw, which was covered with grease and rolled in sharp sand.

    The strictle was used to touch up the edge of the blade while the mower

    was working in the hayfield; but this blade was made of a finer more

    malleable steel than the hard blade that Frost helped to sharpen. The

    grindstone would cause excessive wear on it: Worse, the grinding would

    overheat the area of the blade in contact with the stone, leading to loss of

    temper; after grinding, the softer, finer blade would not hold its edge as

    before.'
