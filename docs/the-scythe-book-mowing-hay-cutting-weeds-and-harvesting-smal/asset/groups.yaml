    of the human body means health gained. It is not imposs strenuous or difficult
    to wield a scythe; both my experience of mowing and the tool itself are resources
    of enduring value.


    Before the widespread use of mowing and harvesting machines, commencing in the
    latter part of the nineteenth century, the scythe was the main tool responsible
    for harvesting hay and grain, as well as for keeping trim and the estates of rich
    lords and freedmen. As with any common tool, little of the early writing about
    the scythe explains its use, which was general knowledge. Beginning in the early
    part of the twentieth century, however, increased interest in rural life has led
    to the acceptance of a form of autobiography, summarized as “my experiences back
    on the farm,” in the authors, recording the recollections of old country people,
    often include some instructions in forgotten practices from the oldtimers whom
    they encountered. Some of these writers have become good mowers themselves and
    have passed on what they learned.


    From these autobiographies, from old agricultural journals, from the evidence
    of drawings, paintings, and sculpture, and from the work of anthropologists and
    historians, we can piece together a fairly accurate picture of how the scythe
    was designed and used. There are many small variations depending on period and
    region. I shall not document them all. Suffice to say that for every “rule” or
    tradition I have for scythe design and technique, somebody else did it a little
    differently and got the grass cut.'
  - '[PAGE 13]


    There is a certain romance in using an ancient tool the old way, experiencing
    what our ancestors must have experienced. However, a tool must still be efficient
    today. That is, romance aside, it must make such an effective use of a person''s
    time and energy that it is competitive with other means for accomplishing the
    task at hand. A chipped stone knife, while representing an immense technological
    leap for its time, does not meet this criterion. A sickle for harvesting grain
    does meet this criterion for small areas. A good scythe meets the criterion of
    practical efficiency for larger areas, and for a wider variety of tasks.


    University extension agents argue persuasively that a farmer cannot afford the
    time to mow: he is forced by economics to sit all day atop tractor attaching one
    implement after another to produce enough to make the payments on the loan for
    the equipment. I do not offer the scythe and its related tools as an alternative
    to this scale of agriculture. yet even here the scythe has a place, trimming the
    edges where the machine cannot go.


    I do not use a scythe in order to make enough money to support a livelihood, but
    rather simply to support a livelihood. Not only is the product of my labor—hay,
    mulch, grain—superior to any I could obtain elsewhere in this chemical age. In
    addition, I deeply enjoy the experiences of contributing to my own sustenance
    and of relating intimately to the earth.


    # THIS BOOK


    The first section of this manual covers the parts of the scythe in more detail
    than the casual mower probably wants, I began this writing expecting to produce
    a brief manual on mowing technique, but found the details of manufacture and tradition
    and so forth to be so important to my mowing that I took the research as far as
    it could go, and the manual became a small book. I asked one American writer who
    had written that he was “one of the very few true authorities on the scythe” what
    resources he used for his technique. He exclaimed, “Are you kidding? Just go outside
    and swing the thing!” That was all he would say about how to use the scythe. I
    am,'
  - '[PAGE 14]


    however, convinced that with the right tool, the casual mower will soon become
    a serious mower, at which time the detail I provide here will be more interesting.
    In any case, though, reading the sections on sharpening and mowing technique is
    all that is required for stepping out to encounter the legions of dandelions.
    Sections follow which set out the minimum considerations necessary to mow hay,
    cut weeds, and harvest grains.'
  - '[PAGE 15]


    # # The Parts of the Scythe


    # ## THE BLADE


    THERE IS A STORY TOLD IN LEGRAND CANNON''S LOOK TO THE MOUNTAIN IN which the master
    blacksmith makes a scythe blade of Damascus steel for a young mower in New Hampshire
    in 1769.¹ In the high heat of his forge he pounds bars of iron and steel together,
    folding them over each other again and again. After tempering, the effect of the
    mingled metals in the blade is much like fudge ripple. The iron gives the blade
    flexibility as an antidote to the steel''s brittleness; the steel holds the edge
    razor and gives the enduring shape of the blade. The price? Twenty-one cords of
    rock maple, cut, split, and stacked. The master smith assures the young man that
    there will be at least one blow of the hammer for every strike of the ax.


    Today the common hardware-store scythe blade is stamped in a powerful drop-forge
    press and its edge is ground sharp on a high-speed grinding wheel. In contrast,
    the edge of the sharper and more delicate European- or Austrian-style blade is
    hammered to the correct thinness, in the same way it has been since the fifteenth
    century, by the scythemith guilds were established in the mountain valleys of
    Austria. The advent of water-driven trip hammers, and, now, of small but powerful
    hand-guided hammers, have made fine scythe blades less than twenty-one cords of
    split hardwood, but the hand forged Austrian blade is still more expensive than
    the stamped blade. The process at its best involves a sequence of twenty-six steps,
    pictured in Figure 3. Although little change is apparent between steps 14 and
    20, here is where the most important tempering and shaping take place. The blade
    is heated in a furnace, cooled in warm oil, sandblasted, and diagonal-hammered,
    to give the optimum curve and thickness to the back and edge.'
  - '[PAGE 16]


    The common hardware store blade is usually called the “American” type, the better
    blade the “Austrian” type. In fact, scythe blades have not been manufactured in
    this'
  - '[PAGE 17]


    ![](img/27a09e01dbd329ab631e901469ce4b29_17_0.png)


    Figure 1 The parts of the scythe'
  - '[PAGE 18]


    country for nearly twenty years, and, when they were, some were of fine quality.
    The “American” pattern blades are made in Europe by the same companies who produce
    the finer blades; they freely admit that the stamped blade is the bottom of their
    line.


    | Stamped Blade | Hammered Blade |

    |--- |--- |

    | | face view |

    | | edge view |

    | edge & tang | end view tang 25... |

    | | hafting |


    ![](img/27a09e01dbd329ab631e901469ce4b29_18_0.png)


    A fine scythe blade must be light in weight, and tempered to carry an edge that
    will cut tissue paper without tearing. Yet it must be soft enough to dent instead
    of break if a stone or stump is accidentally hit, and capable of having its edge
    restored through hammering¹ with a light hammer.


    The problem is to find a steel of the right consistency to achieve this wonderful
    balance of hard and soft. In England, “Crown” blades were once made with an edge
    of hammered iron sandwiched between two pieces of mild steel to hold the overall
    shape.'
  - '[PAGE 19]


    ![](img/27a09e01dbd329ab631e901469ce4b29_19_0.png)'
  - '[PAGE 20]


    Figure 3 Twenty-six steps in the manufacture of the hammered blade


    Blades are still made in England in which the edge steel is riveted to a stronger
    back of “mild” steel.2 The New Hampshire blacksmith of 1769 had to mix the iron
    and low-grade steel to get the right effect. In one tradition, mowers hung their
    scythes in a tree for the winter to rust the iron out, thus—according to the tradition—raising
    the percent of carbon, and the hardness blade. The carbon content of the “American”
    blade is already fairly high, and in fact makes the blade too hard; the impact
    of accidental strains from stones and stumps leads to dents but to microscopic
    cracks which will in time cause the blade to break.


    The shapes of the two types of blades differ (Figure 2). The stamped blade is
    expected flat. The hammered blade is curved in every dimension to optimize the
    relationship of the body to the task of cutting. The “beard” and heel are distinguished
    in the hammered blade because of their distance from each other; in the stamped
    blade, whole end (queue or tail in French) is the very strong projection from
    the back rib which attaches to the snath; the parts of the tang are heel, neck,
    and knob.


    The manufacture of the hammered blade shown in Figure 3 begins with a high-quality
    steel, and by working it hot and cold, aligns the molecules and strain-hardens
    the steel. Exact requirements for these blades make it clear why over half of
    the blades which begin the twenty-six stages of manufacture are rejected along
    the way. Omitting any of the manufacturing steps makes other brands of blade less
    expensive, but only at the loss of the desirable characteristics of the finest
    blades.


    The better blades are stamped on the tang with the trademarks of the manufacturers
    (Figure 4) which can be checked in the directories of Franz Schrokenfux and Josef
    Zeitlinger. These references match the trademarks with the methods of manufacture
    of the particular company as well as the genealogy of the master, leading to the
    influences of the Ottoman Empire in'
- md: '

    the fifteenth century. In recognition of these Turkish origins one brand has the
    name Turkensensen, or "Turkish scythes."


    Several models of blade have a series of a hundred hammered dots that look like
    a ball bouncing across the edge of the blade stopped in flight by a stroboscopic
    light. The dots are both a fanciful ornament and a testimony to the skill that
    guides the hammer.


    When the scythe was the predominant tool for many agricultural tasks, blades were
    made in different lengths, from very short blades for careful work around vines
    and trees, to very long blades—over four feet in some areas—for less exacting
    tasks such as mowing expansive lawns. The length now used most frequently on European
    farms for the widest variety of tasks is 27½ inches (70 centimeters).


    ![](img/27a09e01dbd329ab631e901469ce4b29_21_0.png)


    ![](img/27a09e01dbd329ab631e901469ce4b29_22_0.png)


    Figure 4 Some blade blade trademarks


    Bush or brush scythe blades are as short as fifteen inches and often thicker to
    withstand repeated blows against young saplings. The grass blade of 70 centimeters
    is adequate for all grasses, weeds, briars, and one-year old trees.


    ## BLADE COVER


    You cannot cut yourself with a scythe when you are holding the grips. In transit
    to or from work, however, the blade can be dangerous to oneself and others. A
    good way to prevent cutting people and nicking the edge is to slip on a sheath
    that completely covers the blade and tie it securely around the heel end. The
    narrow strips of plastic sometimes taped to the blade to protect the edge from
    the parcel service should be discarded after delivery, because they are unreliable
    for repeated use.


    At the commencement of cutting, remove the cover and put it folded in your pocket.
    At the end of cutting, wipe off the grass and dirt from the blade, and put the
    cover back on. Secure it with a simple overhand knot behind the heel of the blade.
    At the end of the season, the scythe would be stored high up of children''s reach.
    And remember that the cover does not protect the legs of bystanders during mowing,
    or the hands of the sharpener.


    When scythees were used more widely, the blades were covered with a bag or custom-made
    sheath when not in use. In one area of England where scythe covers were not used,
    the tradition was to march en masse to the field with the blade in the air, the
    right hand holding the top grip and the lower grip thrust firmly under the right
    armpit. This regimentation prevented mishaps.^3 In every area, during the break
    for the midday meal, the scythe blades were laid in the uncut grass or grain,
    into which no man, woman or child could stray, protecting blade and flesh. In
    modern times, these traditions are not known to all, and the blade cover gives
    a necessary margin of safety.


    ## SNATH


    A great variety of sneads or sneds or snaths have been used with the same long,
    curved scythe blade. One English tradition used only naturally curving saplings,
    while in East Europe an offset handle was mortised into a straight pole, usually
    of ash or hickory. A traditional Scottish design had a long offset handle which
    met the snath almost at the scythe ring. The scythe is one of the few asymmetrical
    tools; with the hands do not perform opposite or interchangeable tasks.^4


    The grips (or nibs or nogs) have been attached to the snath in different ways,
    sometimes pointing out in the same direction as the blade, sometimes in the opposite
    direction, and occasionally mixed. Adjustable grips, made of a wire hoop around
    the snath tightened by twisting the wooden grip, have been found in museum collections
    pointing in nearly every direction. In some traditions only the lower nib is used;
    in others the upper part of the snath is cradled in the crook of the left elbow.
    These countless variations can be expected from any tool which is locally made.


    The typical sweeping curved snath found in American hardware stores is made with
    bent swamp ash from the Southern United States. The poles are steamed, bent to
    the desired shape, and dried. The problem with this method is that the amount
    of wood necessary to keep a permanent bend increases the weight of the snath.
    Old-timers tell of going to the farm supply store to buy a snath and taking half
    a day to try out one of the snaths in stock, all of them slightly different. To
    reduce this variability in shape, snaths are now made even heavier, so that one
    turned out an identical pattern. Several samples weighed in 1980 averaged 4/3
    pounds. With the heavier stamped blade, this added up to 6½ pounds for the bent
    ash snath blade, versus 3½ pounds for the hammered blade and straight snath. Consider
    what this difference in weight will mean after the approximately thousand strokes
    required to cut an acre of grass.


    It seems that the curving “American” snath, with handles which rotate completely
    around the point in any direction, tries to bring the angles of the hammered blade
    (Figure 2) to the simpler stamped blade. I prefer the simpler snath and the better
    blade. Sometimes an old snath will be very light and well-balanced, the primary
    disadvantages being the wood is dried out and fragile, and the adjustable nibs
    are permanently loose. Also, some scythe rings are so small that only certain
    very narrow tangs could fit through them.


    The weight of the heavy wooden snath makes more serious the tendency of the American-style
    scythe to put the right wrist in a cramped position. This position where the little
    finger is bent back towards the wrist (“ulnar deviation”) reduces the capabilities
    of the wrist and may lead to strain in the tendons. Lighter snaths in the American
    style are occasionally available from aluminum, but I confess to a suspicion of
    aluminum used under stress. Unlike steel, aluminum gets weaker and weaker with
    use—there is no “fatigue limit,” meaning no limit to weakening of the metal. Even
    a little bend can upset the angle of the snath. After three years of experimenting
    with different snaths I decided that a slightly curved steel snath made in Europe
    was the best available for the average user. It is light but strong; the blade
    is set at the correct angle to the snath; the lower grip nearest the blade can
    be adjusted though the upper grip is fixed. Every adjustable grip eventually becomes
    loose and must be shimmed with a bit of hardwood or leather. The knob of the tang
    fits into a slot at the end of the snath and is secured by two screws in the scythe
    ring tightened with a special key for that purpose. The key can be stored in the
    very end of the blade cover or looped around the belt; if the key is lost, the
    1/4-inch-square adaptor from a socket wrench then fits the screws of the scythe
    ring well.


    I have also developed a straight wooden snath made of air dried ash. Its design
    was synthesized from several different models currently used in Europe. It has
    the additional feature of a mortised channel for the lower grip, permitting adjustments
    to different body sizes. It is light, strong, and permits use while standing erect.
    Like all wooden tools, however, wooden snath requires extra care: if it gets too
    wet, it can warp slightly and change the angle between snath and blade. Then it
    needs adjustment. It should be lightly oiled at the beginning of the season—one
    part linseed to one part turpentine is a penetrating and clean solution. The section
    between the lower grip and the blade should be oiled again after each extended
    use of the scythe in wet grass. The choice to varnish instead of oil must be made
    at the very beginning, and the snath requires four or five coats of varnish to
    be absolutely certain that every pore in the wood has been filled.


    Without this little extra care, the wooden snath can become a less useful tool
    than the tubular steel snath. Therefore, this snath is best for those with some
    prior experience of mowing on to base their decisions for adjustments. It is a

