    过去，将谷物与谷壳、泥土、破碎的颗粒、杂草种子、茎叶碎片以及堆落在打谷场或防水布上的其他杂质分离是非常困难的，这在许多传说中得到了很好的说明——在这些故事中，英雄或女被赋予了一项不可能的任务：要在短时间内分拣一斗谷物。除了手工清理，分离谷物与废弃物的传统方法是等待有利的风，然后将谷物和其他杂物抛向空中；谷壳和泥土会被吹向侧面，而谷粒则落回风簸箕。谷壳被用来填充床垫、香肠等。为了将谷物与茎段分离，人们会使用一系列*筛子*或滤网让谷粒通过其掉落。随后是手工挑选剩余的杂质，这使得谷物清理成为收获季节最耗时的任务。洗谷物——先冲洗后放在盘上晒——可以让剩余的谷壳浮起来并洗掉任何尘土。尽管如此，面包除了谷粉外，还必须含有其他成分。


    早期的改进是风簸扇，用于在有风的日子产生气流。奥德修斯的最后一个任务是肩扛船桨向内陆旅行，直到遇到一个将其误认为风簸扇的人。今天，一些小规模农民使用电扇来达到同样的效果。在19世纪以前，美国的风簸布会为了风而频繁拍打；每斗谷物需要三四十分钟。1898年的研究得出结论，用连枷打碎20斗谷物、用布风簸、堆放谷物和堆放稻草共需要26小时，这比现代农民认为自己自己种植谷物所拥有的时间要多得多。


    带有曲柄手柄的旋转风簸机在公元前40年就已经在中国使用，它在18世纪被引入荷兰，然后进入苏格兰，滞后了一千四百年。到1794年，英国的每个户主都在使用它，并由每个乡村的木工制造。最近，使用的筛子类型已经有了改进。在图27所示的手摇版本中，打碎的谷物从顶部倒入，通过手摇带动风扇旋转并摇动三个筛网。筛网是从一百多种筛子中选出的，以满足特定的分拣任务，我发现这种实验非常有趣。颗粒太大的从一个喷口排出，太小的从另一个出口排出，谷壳从第三个喷口吹出，谷粒则被分成两种大小。产量为每小时20到30斗，如果谷物中含有大量稻草，产量会更低。


    储物箱或粮仓需要干燥。仓位应该抬离地面，以便空气在下方流通。可以在仓内的不同位置垂直放置几根2x4木板。当仓位装满时，移除木板以供空气流动提供通道。使用厚筛网或结构坚固的木箱可以防止老鼠。通过将小部分谷物放在家用冷冻室一天，可以消除虫害侵害的可能性；对于较大量的谷物，则储存在冬天的寒冷室外。干冰（二氧化碳）对于杀死大量少量谷物中的昆虫是可行的。这些处理方法不像高温和强力化学品那样杀死种子中的胚芽。


    至于谷物的研磨和烹饪，有很多关于该主题的书。应该说，全粒是一个天然的容器，营养品质和种子活力在此保持完好。从埃及法老坟墓中出土的种子润湿后会发芽，而发现小麦在储存32年后发芽率仍达85%。当颗粒被以任何方式切开时，这种保护就会被破坏；那时内容就会开始失去效力，油脂也会变酸。最好的做法是将谷物保留到使用前不久。这样，就可以利用“生命之粮”全部的生命力量。


    我想知道我自己种的小麦与其他来源相比如何，因此我设计了一个简单的实验……（注：原文此处句子似乎不完整，翻译仅涵盖了现有内容）。


