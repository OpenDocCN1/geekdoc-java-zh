    grain, was the center of agricultural ceremonies for thousands of years before
    Christ. And, as bread, grain has continued its mysterious, religious association
    with the body of Christ ever since.


    Our celebration of Thanksgiving late in November has its roots in this same tradition,
    though it has lost its attachment to the season’s rhythms, to the feeling of being
    done with work in the fields and gardens, to the feeling of barns and homes bountous
    with the fruits of the earth, providing nurturant protection against winter. Now
    the dimly remembered strings of the harvest melody are plucked by the sale in
    gift shops of plaited Corn Dollies, mass-produced by not an expert hand. But the
    year-round availability of harvest trinkets is not the point living on the land.
    The embodiment of the Corn Spirit need not be a handsome, saleable item. Its purpose
    is to intensify in a symbol the communion of the farmer/gardener, through agriculture,
    with a little piece of the earth. For me, the painting of the harvest by Emile
    Bernard in Figure 31 evokes most powerfully the emotions of mingling with the
    Corn Spirit, and drawing up the energy for our sustenance out of the earth.


    The attachment to earthly rhythms may be lost in the modern industrial age, but
    is hardly recoverable. While we no longer know a dozen traditional harvest songs
    to sing around an overflowing Harvest Supper, the experience of relating to the
    earth in a profound way is always available. It is just outside the door. The
    Findlay Community in Scotland has even brought the pursuit of greater awareness
    to more articulate levels in work with plants, and with the seldom-seen spiritual
    beings that surround them. I do not believe this just because they have written
    a book about it. I am practical. When I talk to the grasses, weeds, and grains,
    and spend time listening in return, does it change the nature of the crop? Does
    it change my experience in sowing, reaping, and eating? I will not argue whether
    this is fanciful superstition, or a dutiful and necessary recognition of the elemental
    kingdom. At the very least, I know, the old adage is true: “Farmer’s footsteps
    are the best manure.” It is my desire on this land, in the context of this small
    farm, to know the best use of my body, and to move with the scythe as an extension
    of my body—in relationship with the grass, and in a team of mowers—in the process
    developing my own communion with the divinity that creates the task and all its
    parts.


    ## THE SCYTHE MUST DANCE


    ## PRACTICAL USE OF THE SCYTHE


    Peter Vido


    DURING ONE OF MY WINTER JOURNEYS TO AUSTRIA, LAMBERT SCHOISWOHL, a retired scythe
    smith, told me "Die Sense muss tanzen" (The scythe must dance). In the summer
    of 2000, Manfred Atzmüller, the mayor of Rossleithen and a mower himself, organized
    a brigade to trim some of the roadsides. And so I had a chance to mow along the
    side of Mr. Schoiswohl. At 72, the extremely steep slopes did not hinder him.


    On December 24, the most celebrated day in Europe, he finished decorating the
    Christmas tree, stood back to revel in his last task—and was a mower no more ...


    The following poem is dedicated to the memory of Lambert Schoiswohl and other
    "old" men with gifts in their hands.


    —Peter Vido

