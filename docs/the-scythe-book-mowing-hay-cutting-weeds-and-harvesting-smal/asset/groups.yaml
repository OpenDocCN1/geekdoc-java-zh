    at a forty-five degree angle; by turning the rake over you can push the grass
    to one side or another into windrows rather than into a heap at your feet.27 Another
    type is attached to the belt and dragged in that way. A long-handled hayrake 2½-feet
    wide, with fourteen teeth and a well-braced connection between head and handle,
    is still available, and is adequate for the job of cleaning the field. It is also
    easier to transport than some of the bigger bull rakes.


    The best way to hold a hayrake can be observed in Bruegel’s painting “Haymaking,”
    as well as on ancient Egyptian scrolls: the thumb of the upper hand points up
    the pole while the thumb of the lower hand usually points down. In this way, the
    rake is not'
  - '[PAGE 71]


    ![](img/27a09e01dbd329ab631e901469ce4b29_71_0.png)


    **Figure 21 Haying equipment


    drawn across the ground where it might get tangled in the grass and break a tooth.
    Like a comb, the rake draws the cut grass up and out of the stubble.'
  - '[PAGE 72]


    ![](img/27a09e01dbd329ab631e901469ce4b29_72_0.png)


    If a tooth is broken, the broken stub must be drilled out and a new dowel of hard-wood
    set it its place. Stronger replacement teeth can be made by hand, cleaving along
    the grain. In rake teeth or wooden pitchforks, hand cleaving exposes less end-grain
    to the weather than does make the tool much more durable.28


    Light vehicles for moving hay were common when power was provided by the draft
    animal. Modern motorized equipment is often not available, too heavy for a moist
    field in the spring, or unable to get to a certain place. Most garden and farm
    carts available in the United States have an unprotected space between the wheels
    and the body of the cart; when the grass falls into this area, it fouls the wheels.
    One sturdy cart design has detachable flare boards (also traditionally called
    “cart ladders”), which protect the vulnerable area between body and wheel and
    functionally increase the volume of the cart threefold.29


    Since volume, and not weight, is the problem in transporting hay, the load can
    be increased even further with the use of hay-pins, long thin metal rods which,
    like hairpins, were stuck down into the hay to hold the top of'
  - '[PAGE 73]


    the load fixed to the grass beneath it. These pins must have eyes with strings
    attached for pulling them out of the load. Have you ever wondered how the missing
    needle in a haystack got there in the first place? These are the needles, and
    they must be retrieved for the next load of hay.


    When loading a larger cart or truck, set each forkful of hay in a circle at the
    edge of the hay bed. Make the circle smaller as the load gets, so the bulk of
    the hay tilts towards the center. Often there is a helper on the growing pile
    who sets the forkls in the best place for a large and stable load. At the barn
    the same person should take the forkls apart in the very same order in which the
    load was made.


    When loose hay is forked into the hayloft or haymow, it naturally settles over
    time; some farmers encourage this by walking on it exclude the air and thus preserve
    the dehydrated greens. When the hay is compacted, it can only be taken out where
    it was put in, a forkful at a time from the top. Long two-handled hay knives can
    be used to make vertical cuts in the hay to get it from the side or to make exact
    divisions. In 1939, eighty-six percent of the hay cut in the United States was
    put up loose, so it is still within the memory of living farmers.


    # MOWING IN TEAMS


    > A scythe-sweep, and a scythe-sweep, We mow the dale together.


    > —William Allingham, The Mowers, 1865


    The mowers arrange themselves at intervals along the edge of the field. The best
    among them the cutting in a relaxed rhythm which will quicken as the day wears
    on. Each in turn follows a few strokes later, mowing one swath to the right of
    his fellow and leaving the grass to the left in even rows. The team progresses
    around the field in a'
  - '[PAGE 74]


    ![](img/27a09e01dbd329ab631e901469ce4b29_74_0.png)


    Figure 22 The progress of mowing


    clockwise direction, each lap shorter than the last (Figure 22). At the very end,
    the outside edge of the field is carefully trimmed in a counterclockwise'
  - '[PAGE 75]


    direction, throwing the grass into the field. Teams of three and four were a common
    sight in Britain at the turn of the century, and still can be seen in the high
    hills of central and eastern Europe. Levin in Anna Karenina mowed in a team of
    forty-two. What ground they must have covered in a day! In some areas preferred
    to mow in teams with fellow farmers, moving from one neighboring farm to another.³30


    Some accounts speak of putting the best mower first to set a moderate constant
    pace; the other mowers are compelled to keep up. Other accounts show the best
    mower at the end of the row; the ticking sensation in the heels of the mowers
    in front of him keeps them going through the moments when they felt like having
    a little conversation and rest. Even though some written accounts refer to the
    times when the mower yells, “Watch out, or I''ll cut your legs off!”, on the whole
    these teammates were well coordinated and quite used to working together. Making
    mowing a competitive match is unfair to beginners and usually ruins both the grass
    and the mower’s primary movement. There should be more space and more leeway among
    amateur teammates.


    Teammates also share their rhythm through song. Though often heard among mowers,
    none of these songs has been recorded, probably because they were simple ditties,
    half nonsense. One hint of what the songs may have sounded like is the mower’s
    lament at the foot his master was providing, muttered in time with the stroke:
    “Bread and tea, no good for me.” If the diet was changed, the chant would be,
    “Ham and eggs, look out for your legs. The main function of these chants and songs
    was to coordinate the breath and scythe stroke, and to “deceive the tedious time,
    And steal unfelt the sultry hours away.”³1


    With practice, a mower can learn to mow in relationship to the body, the tool,
    the grass, the earth, and the team of mowers. Many relationships which to be aware!
    This expertise cannot be hurried but must grow into. As the separating moving
    rhythms of the different mowers synchronize through experience, one can discover
    an intimacy of shared work that is as thrilling as the discovery of good use of
    the body in relationship to the grass.'
  - '[PAGE 76]


    # HAYTIME DRINKS


    Oh, let the cider flow

    In plowing and sowing—nThe healthiest drink I know,

    In reaping and mowing.


    > —DEVONSHIRE WORK SONG


    Mowing would begin very early in the morning and continue until eleven. Then the
    mowers would break for beer, cheese, and bread, followed by a nap, work to resume
    two hours later. They might work until dark. Refreshment was the reward and the
    fuel, and Irishmen hired out for the hay season expected to be paid partly in
    beer—a forty-three gallon barrel of it for each mower. Unless they had to, mowers
    would avoid drinking before the midday break. But at that!


    There is the moisture creates and a crack with a tap already inserted. Beer! His
    wife meets him and hands an unorked jar. He nods briefly, draws his hand across
    sticky, clammy lips, and lifts the familiar vessel.... The gods must have attractive
    temporal joints to give them the all-absorbing ecstasy of that draught ...33


    Also drunk profusely at the midday break was hard cider, which had a similar alcoholic
    content to beer and brought on a good sleep before the afternoon afternoon mowing.
    Hay is usually needed for wintertime feeding in areas where apples grow well.
    Good cider is made from many different kinds of apples, including a small portion
    of crab apples, and is aged in oak barrels to improve its flavor. It is a wonderfully
    refreshing drink.

    Still another popular pick-up tonic for haytime was switched:


    +   - 1 cup maple syrup, honey, or brown sugar

    - 1 cup cider vinegar

    - ½ cup light molasses

    - 1 tablespoon ground ginger

    - 1 quart cold water'
  - '[PAGE 77]


    Combine and stir well. Makes about 6 seven-ounce glasses. Hertzberg, Vaughan,
    and Greene, in *Putting Food By*, recommend switchel for modern athletes as a
    “good energy-restorer without promoting ‘cotton mouth,’””34 These drinks provided
    one of the rewards for the very long days of labor put in at haying time. The
    modern mower can enjoy them, too.'
