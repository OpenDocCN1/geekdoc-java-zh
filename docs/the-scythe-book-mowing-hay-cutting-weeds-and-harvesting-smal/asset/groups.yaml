    在长时间使用期间可以保持这种优势。然而，在许多情况下，我不建议使用如此薄的刃口。人们必须理解的是，这种刃口类似于凿子或刨刀刃，经过精细成型，目的是在平整的木材上削下如纸薄的木片。细心的的木工绝不会用力地将这样的刃口撞在木节上——即使他这样做了，也会以工具受损为代价。我们能学会像工匠使用凿子一样使用我们的镰刀吗？


    在没有石头的田野里，一个明智的割草者无疑会感激上述刃口。


    威胁镰刀的“木节”本质上是非常坚硬的植物，或者说，那些在季节初或种子期就会崩坏“完美刃口”的植物。为了切割这类材料（如果我们不这样做，就会限制镰刀的实用性），我们必须放弃这种具有穿透力的形状，改为具有更大耐用性的形状。当我们意识地使用工具并获得**“割草者的感觉”**时，就能掌握到具体的程度。


    下面列出了我不希望刃口如此薄的一些示例：


    - 1. 8 月份我们农场大部分的田间割草工作，此时一些大型金黄草（通常成多达十根茎簇生长）正盛开。

    - 2. 含有梅子或梨品种的果园，这些品种容易在距离主干较远的地方萌芽。

    - 3. 岩石非常多的区域。

    - 4. 不熟悉的院子，我可能预计在刀片处遇到植物材料以外的物体。


    对于这些任务，一个几乎准备重新开角的刀片可能只需要更频繁地磨削即可。此外，还可以换到较粗的磨刀石。


    然而，最符合特定用途的刃口仍然是底部平整、顶部斜角较短，且整体不是那么薄的；换句话说，它比那种“可以容易滑过指甲盖但形状正确”的刃口要厚一点。它对细砂石的反应会更好，切割起来更轻松，同时也更耐用。


    我重点关注了锻打（peening）的理论方面，这并不难理解和应用。结果是显而易见的，因为它们与物理形状有关。参与这项古代活动还有其他较为抽象的理由，即刃口的硬化和“刀片内部相反电磁荷的积累”。这两点都值得介绍，尽管是在篇幅较长的文中。


    ## VI 刃口的成型实践


    温德·贝里（WENDELL BERRY）在他的启发性散文《一把好镰刀》中简单地指出，锻打“需要一些努力和思考”。指的是经典的“手工法”，特雷梅瑟（Tresemer）在他的正书中讨论了这种方法。第五章代表了我对“思考”的尝试。该理论适用于一般的镰刀片锻打方法。在实践中，手工法需要耐心和良好的锤击瞄准。


    幸运的是，为了那些太匆忙或没有好老师的人的考虑，几十年前的一些修补匠发明了各种形式的设备，使这个过程变得更容易、不那么复杂。在英语中，它被称为“镰刀锤”、“镰刀片磨刀设备”或“锤击装置”。我在这里简单地称为“具（jig）”。美国现有的两种模型之一如图
    3–4 所示。


    特雷梅瑟是不知道这种具的存在，还是认为它没有必要，我不知道。也许他非常有天赋，锤得很快。或者，虽然没有明确说明，但他认为如果不使用辅助设备，我们有更好的机会保留现在已处于濒危名单的技能之一。如果是这样，我那怀旧的一部分会为他喝彩，因为我个人太偏于传统的镰刀刃口成型方法。


    ![](img/27a09e01dbd329ab631e901469ce4b29_150_0.png)


    图 3–4 锻打具


    遗憾的是，我开始认为对于当的普通割草者来说，这种具几乎是不可或缺的辅助。（我在美国看到的许多通过手工法“锻得很薄”的刀片，都由于所有者缺乏技巧而遭受了严重损坏。）


    具的主要优点是它补偿了锤击的不准确性。人们还可以有效地磨出正确的刃口宽度，而没有过度延伸的危险。结果将一致得多。


    完成满意的锻打工作的基础是设置一个稳定的底座，让人可以舒适地坐在那里且光线良好。具可以夹在虎钳上，正如某些型号包装上的说明建议的那样。我认为这是一个糟糕的替代品，因为用这种方法的用户可能不会费力制作一个辅助装置来支撑刀片突出的部分，而在处理另一端时。对于短刀片这并不困难；然而，在尝试固定一个例如
    28 英寸长的刀片并在锤击头部时，某些支撑手段的好处显而易见。


    在欧洲部分地区，习惯在刀片仍连接在镰柄（snath）上时进行锻打。人们发明了各种固定镰柄和刀片的方法。我不会在这里描述它们，因为我相信如果刀片与镰柄分离，可以获得更准确的结果。有了今天连接环的便利，这只需要几秒钟。它还提供了正确重新安装刀片的机会，清洁并偶尔油润积累污垢和水分的镰柄部分，以及环上螺钉的螺纹。


    我最喜欢的刀片支撑方式是我的腿。与我尝试过的任何方法相比，它们能对所需的角度提供最准确、最即时的调整。


    为了将具放入底座中，预先钻一个略小的孔要容易得多。除非装了盖子，否则绝不应该击中中央导轴，因为它可能会损坏到足以防止盖子平滑移动。在没有插入刀片的情况下，最好也不要用力敲盖子；如果它被撞扁，它保持下端理想形状的时间会长得多。


    在欧洲部分地区，习惯在刀片仍连接在镰柄上时进行锻打。人们发明了各种固定镰柄和刀片的方法。我不会在这里描述它们，因为我相信如果刀片与镰柄分离，可以获得更准确的结果。有了今天连接环的便利，这只需要几秒钟。它还提供了正确重新安装刀片的机会，清洁并偶尔油润积累污垢和水分镰柄部分，以及环上螺钉的螺纹。


    我最喜欢的刀片支撑方式是我的腿。与我尝试过的任何方法相比，它们能对所需的角度提供最准确、最即时的调整。


    为了将具放入底座中，预先钻一个略小的孔要容易得多。除非装了盖子，否则绝不应该击中中央导轴，因为它可能会损坏到足以防止盖子平滑移动。在没有插入刀片的情况下，最好也不要用力敲盖子；如果它被撞扁，它保持下端理想形状的时间会长得多。


    轻轻将具敲孔中，直到大约一半。这时你可以插入刀片并开始锻打。此时具会接触底座表面。在目前美国有两种型号具的情况下，一次完整的锻打涉及连续使用两个盖子。第一个会在边缘约
    5/32 英寸（4毫米）处产生一个槽。第二个会平整槽和边缘之间的金属，从而使其向前移动。


    如果刀片被忽视了（锻打得太久），可能需要重复此过程。定期进行，每次可以跳过第一个盖子。


    ![](img/27a09e01dbd329ab631e901469ce4b29_152_0.png)


    图 5


    广告宣传可能让潜在买家认为这种“专业磨刀设备”每次都能产生“完美刃口”。相对于手工法，使用具很容易，但成功并非自动。偏离“完美”可能是几个因素中的一个或多个引起的。为了确保均匀，请观察：


    - 1. 锤击期间刀片与底座的两侧接触均匀。（见图 5）

    - 2. 刃口本身得到了盖子的良好支撑。（许多镰刀片的整体形状需要向前倾斜以实现这一点。）（见图 6）

    - 3. 锤击的节奏与你移动刀片的速度同步。

    - 4. 你敲击的力量处处均匀。


    这种具不需要特殊的锤子。任何至少 16 盎司重的普通锤子都可以。对于被忽视的刀片和灌木型型号，20 盎司会更有效。我觉得用重锤轻轻敲击比用轻锤用力敲要好。锻打即使均匀，如果击得太猛也会过度，特别是当金属较新或较薄时（大多数在奥地利制造的新刀片都是如此）。


    专注于平整后角而不是变薄本身（这会自动发生）。你可能想轻轻地在刀片上过一遍，以感受稳固、节奏以及刃口的反应程度。然后非常仔细地检查后角。它可能仍在某几个地方。从顶部用粉笔标记这些区域，并再次锻打，力度轻一点。

