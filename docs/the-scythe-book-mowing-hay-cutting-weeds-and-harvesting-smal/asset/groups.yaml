    Figure 12 Whetting


    ![](img/27a09e01dbd329ab631e901469ce4b29_42_0.png)


    Figure 13 Cleaning the blade


    the different quarries local to every region. In his book, Man the Tool-maker,
    Kenneth Oakley shows a piece of sarsens (sandstone hardened by secondary silica
    intrusion) used to sharpen primitive axes thousands of years ago. Particularly
    good paving stones and monuments were once popular as stationary whetstones.9
    I have a piece of slate from the nearby Whetstone Brook and a whetstone of slate
    from my grandfather worn down from years of use, and have found that they import
    a very sharp edge. The final touch comes from an English tradition which I have
    never heard mentioned in this country, though I have tried and been satisfied:
    honing with the dried shelf fungus of the sort that grows on dead birch trees
    (Polyporus betulinus), which perfectly fits the hand.


    In places the stickle was used instead of a stone, and a new set of tools was
    necessary for the sharpening process. A saw or a special iron trickle-pricker
    was used to make small “delfs” (holes) to take the tallow or grease; extra grease
    was carried to the fields in special pouches or horns; sharp or emery powder was
    found and carried to the field in little bags; snaths were sometimes made feet
    long to accommodate a stickle-holder.10 Keeping the grease cool enough not to
    run off, and the sharp edge, and so forth—these are lost arts. I am content with
    the sharpness I get from my two grades of stone.


    The final step in keeping a sharp edge is wiping the blade after each day''s use,
    shown in Figure 13, preventing rust and improving the mirror-like finish. The
    mower Damon''s blade was such that in it, “I see my Picture Done, as a crescent
    Moon the Sun.”11


    I do not loan my scythe. I reap the benefits of a carefully tended edge, and am
    reminded of my responsibility by a dull edge. Each time I peen and whet the blade,
    I remake the tool as my own; in time it becomes a mirror of my attitude toward
    work. A Finnish tale describes a tired mower who exclaimed “May the devil whet
    my scythe!” The devil died so, leaving only the snath.


    ## Mowing Technique


    O sound to rout the brood of cares,

    The sweep of scythe in morning dew


    > —ALBERT, LORD TENNYSON, IN MEMORIAM LXXXIX, 1833


    MOWING SHOULD BE COMFORTABLE, NOT TOO STRENUOUS, NOT—IMMEDIATELY—tiring. If it
    is it, it is wrongly done. Dress for mowing, therefore, should also be comfortable.
    The best includes loose-fitting pants and shirt. The shoes should be light; the
    feet are not threatened, and mowing was often done barefoot. A sun hat is a good
    idea, and is always worn by the European mower. A scarf may be useful to warm
    the neck in the early morning, and to mop the brow in the afternoon.


    ## A HELPFUL EXERCISE


    An exercise to begin each mowing session helps remind me of the shape of the movement
    (Figure 14). I stand erect, neither slumping nor rigidly at attention, and consider
    gravity as the fundamental force of the earth, which acts upon my entire body
    at every moment. Gravity is an acceleration, opposed to a steady velocity: an
    ever-new force that pulls me downward faster and renewed. I respond with an acceleration
    upward, in opposition, also renewed every moment, an anti-gravity. I prefer the
    terms energy or spring to anti-gravity for denoting this counter movement; it
    is not an anti-earth force, or a rejection. The earth is the entity from which
    we spring. We are the earth’s offspring. The other connotations of spring are
    all correct. Neither pulled to merge with the source, nor flying up uncontrollably
    in escape, I stand erect, firmly grounded yet springing toward heaven. The stance
    itself is an act of creativity. Although this interaction


    ![](img/27a09e01dbd329ab631e901469ce4b29_45_0.png)


    Figure 14 Twisting exercise between myself and gravity always goes on, it is usually
    unconscious. Mowing reminds me of the relationship, as it restores the balance
    of gravity and spring.


    In the middle of these two accelerating flows of gravity and spring, I am relaxed;
    my shoulders are not hoisted, my neck is not stiff, and I can mentally travel
    from one part of my body to another releasing unnecessary tension. Then I begin
    to twist my torso from one side to another, to face my right, then I let my arms
    swing free. My right hand flops against my left thigh, and a full second later
    my left hand flops against right thigh. There is twisting movement in my ankles,
    knees, hips, and all along my spine. The exercise serves to remind me of three
    things:


    1. Mowing is a twisting movement, from the right side of my body around the front
    to the left side;

    2. My arms and shoulders need not be tense, but may be relaxed;

    3. My whole body is involved in the twisting motion. The human body can be seen
    as two coils twisting diagonally in opposite directions up through the body in
    dynamic equilibrium. In mowing, this dynamic equilibrium is the key.


