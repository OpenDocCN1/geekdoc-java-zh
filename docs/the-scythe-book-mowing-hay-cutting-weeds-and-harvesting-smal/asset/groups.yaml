    Looking back over several strokes, does the swath have the appearance of rolling
    waves? The blade is probably not being held parallel to the ground, and the point
    is cutting at a different height from the heel.


    And so on. If I cannot understand why the swath is uneven and irregular, I try
    to reproduce the badly cut grass, with exaggeration. Then I can discover the source
    of the trouble within my stroke, and correct my technique.


    The grass will teach you, but it is easier to learn on green hay or weeds than
    on wiregrass and handback. Young clover teaches an unstrained style as the blade
    whispers through the fragrant stems. The more difficult cutting of briars and
    tough weeds can then be approached with more effort but in a good style.


    Improvement in mowing technique also requires reading the body with as much attention
    to detail as any athlete needs to apply.


    Do your biceps ache for the work, or your back? Let your right arm hang straight.
    Twist your hips more, using the power in your ankles and knees.


    Is your neck sore? Do not hunch up your shoulders, or stoop over, or work too
    hard on a wide swath.


    Does your stomach hurt? Don’t stop breathing. A common complaint is a soreness
    in the stomach because of the unaccustomed twisting. You are probably facing the
    field as in golf and should discipline yourself to keep the right and left foot
    perpendicular to the line of the cut, or even advance the right foot beyond the
    left.


    Keeping the blade under the control of the body’s twisting rhythm, rather than
    violently thrashing the grass, prevents exhaustion, and prolongs the mower’s working
    day and his working years. When all the parts are working together, you will agree
    with the experience of Sir Stephen Talents, who mows by “guiding my blade serenely
    through” the grasses.


    Watch other mowers, and have someone watch you to see how small changes affect
    the cutting of the grass. There is room for personal differences in style. In
    some people the energy bursts from the left hip-'
