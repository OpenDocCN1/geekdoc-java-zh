    cradle also leaves the grain in neat piles, but it is much lighter (average weight,
    four pounds) than the large rake cradle, and to my surprise, was no slower than
    the scythe without cradle in cutting.


    # # SOWING, REAPING, THRESHING, WINNOWING


    > Sowing in the sunshine, sowing in the shadows,

    fearing neither clouds nor winter''s chilling breeze;

    By and by the harvest, and the labor ended,

    We shall come rejoicing, bringing in the sheaves.


    —GEORGE MINOR AND KNOWLES SHAW


    Small grains are sown in an area which has been cleaned of weeds, preferably by
    growing root crops in the plot year before. You must keep the weeds out of the
    root crops through cultivation; the grain will benefit from this clean culture.
    Excess nitrogen and lack of potassium causes lodging or falling over the grain,
    making harvesting difficult. A cradle cannot be used on lodged grain, and lodged
    grain must be harvested soon with a scythe or sickle to keep the kernels from
    sprouting by being too close to the damp earth. Lodged grain can be raked and
    tilled like hay.


    Grain can be sown in the fall or early spring, depending on the climate and the
    farming schedule. If grain is sown too late in fall, or too early in the spring,
    the cold and damp soil will rot the seed before it germin. Though higher yielding,
    winter wheat sown in August or September can be completely killed by a hard winter.
    The finest flour with the highest gluten content to promote rising is spring-season
    hard wheat, in varieties such as Neepawa, Olaf, Manitou, Justin, and Selkirk.
    Barley, oats, and buckwheat are also sown in the early spring because they are
    not hardy. Rye can be sown nearly any time since it is very hard and requires
    only a short season for growing; the saying “wheat for fat, rye for strength”
    may indicate more the types of people who live in short-season growing areas than
    the nutritional quality of the grain. The seed can be broadcast by hand from a
    sack, though a rotary hand-turned seeder will give more'
  - '[PAGE 99]


    uniform results. Cross the field back and forth in one direction, then again in
    a direction perpendicular or diagonal to the first for best results; an acre requires
    an hour by this method. One hundred pounds per acre is an average seeding rate.


    After sowing, the seed must be covered with soil by raking the area, to improve
    germination and to protect the seed from the birds. The hayrake serves here a
    grading rake, and it is best to step in the raked earth while raking, because
    the feet press the covered seeds into the earth. For larger areas, there are machines
    that spread the seeds, bury them, and firm the earth in one pass.


    It is often a good idea to sow clover or alfalfa at the same time. When the grain
    is harvested the slower legumes will grow into autumn and give the field protective
    cover through winter and a hay crop in the spring.


    On the efficiency of sowing by casting the seed in all directions, by hand or
    with a whirling machine, George Fussell cited the parable of the sower:


    > Behold a sewer went forth to sow; and when he sowed, some seeds fell by wayside,
    and the bowels devoured them; some fell upon stony places, where they had not
    earth; and forthwith they sprang up because they had no deepness of earth; and
    when the sun was up, they were scorched; and because they had no root withered
    away. And some fell among thorns; the thorns sprang up and choked them; but others
    fell into good ground and brought forth fruit, some hundred fold, sixty fold,
    some third fold.


    Fussell used this story as evidence for the superiority of seed drills, which
    plow a small furrow, drop seeds into it, cover them over, and firm the earth above.
    If a drill is available, the old and dependable Planet Jr. row planter, the grain
    can be sown thickly in rows to twelve inches apart from each other The drill can
    be adjusted for seeding rate, depth of furrow, and distance between rows, all
    determined by experimentation within the limits of soil and climate. The space
    between the rows can be cultivated or hoed once or twice in the growing season
    to suppress competition from weeds. Yields in row-s plots are often better than
    with broadcast seed, and there is less problem of weeds in the mature grain. Row-sowing
    is a popular method among organic farmers in Europe. There is definitely more
    work involved, however, and if'
  - '[PAGE 100]


    weeds to begin with, I use the broadcast method, and read the parable of the sower
    as a parable.


    In 1911, F. H. King, former Chief of the Division of Soil Management of the United
    States Department of Agriculture, published his memoirs of a Tour of the Orient,
    where he found wheat grown in hills or groups averaging forty-six stalks each.
    The hills were twenty-four inches apart in the row, the rows were in sixteen inches
    apart, and each pair of rows was thirty inches from the neighboring pair. The
    spaces between the hills were hoed conscientiously after every rain to eliminate
    weeds, to incorporate frequently applied composted human wastes, and to create
    a moisture-conserving fluffy mulch. Mulking observed a harvest in 12 bushels per
    acre, but calculated that the fine harvest of 1901 measured 116 bushels per acre.50


    When should grain be harvested? Farm books give the infuriating answer: When it’s
    ready. Working with other farmers and raising grains myself, I was surprised to
    find there is no better answer. When you press a fingernail into the kernel of
    grain we are about to harvest, it shouldn''t spurt out its contents in the “milk”
    stage. But when it is really hard it is also ready to fall off; then the grain
    head shutters when the plant is cut, and all the kernels fall irremediably to
    the ground. Rub a seed head between both palms to determine how fragile it is;
    chew to determine if the kernels are a “hard dough” stage-ready harvest.


    With either a scythe or a cradle scythe, the stroke for reaping is broader than
    the mowing stroke, with more hacking and less slicing. With the cradle, the left
    hand is as close to the ground through the stroke as is comfortable in order to
    keep the cradle upright. The right hand comes up at the end of the swing, and
    the left hand abruptly to dump the load with the grain heads pointing away from
    the uncut grain. With the scythe, the left hand lifts abruptly at the end of the
    swing, thus ending the stroke and leaving the straws together with heads pointing
    toward the uncut grain. Too much swing to the left, and the straws get mixed up.
    The scythe is lighter than the cradle, but requires more control. Grain is easier
    to hay, since the weight of the grain heads and the height of the stem'
  - '[PAGE 101]


    gives the plant such inertia that it has little tendency to bend rather than cut.
    In recognition of this greater ease of cutting, the Larousse Agricole for 1921
    recommends adjusting the stroke and the angle of the blade to snath to regulate
    the depth of swath: 12–14 inches compared with 6–9 inches for hayfields and pastures.


    With reaping, the support staff needs to be much larger than for haying. Thomas
    Jefferson hired fifty-eight people to harvest his wheat in 1795;51


    +   18 craddlers

    18 binders

    6 gatherers

    3 loaders

    6 stackers

    4 carters

    2 cooks


    The fifty-eighth was the foreman or “Harvest Lord.” In 1812, he recorded 15 craddlers,
    15 binders, 16 gatherers (which must have included the loaders and carters), 4
    stackers, and 2 cooks. The gatherers, loaders, and stackers would often be children.
    He describes this group as a “machine” which


    > would in exact equilibrium, no part of the force would be lessened without retracting
    the whole, no increased without waste of force... This would cut, bring in and
    stack 54 acres a day, and complete my harvest of 320 acres in 6 days.


    Stephens recommended the harvest was organized in units of two scythemen (without
    craddles), two gatherers, two binders, and one raker.52


    So it is clear that the time spent cutting grain with the scythe is only a part
    of the entire harvest process. Each cut of grain must be gathered together into
    sheaves and bound with a simple overhand knot made of two or three of the straws.
    The diameter of the sheaf is limited by the length of the straw used to tie it,
    although old gauges used to check the sheaves'
- md: '

    size twelve inches across. If the straws are too dry and brittle to tie, I use
    one or two weeds which are still green and tall from growing up at the edge of
    the stand of grain. Encircle the sheaf with the binder of straw or weed until
    the top and bottom of the binder overlap. Holding onto the very bottom of the
    binder, slip its top over its own base in a half hitch. Slide this half hitch
    along the base until the sheaf is bound tight. Stiffen the base of the binder
    back over the half hitch and tuck it under itself against the sheaf. A woolder
    for tying sheaves is a block of wood two squares with a thirty-six inch piece
    of twine through a hole in the middle. One end of the twine is knotted so it is
    tight against the weed; the other end is wound around the sheaf and then around
    the twine beneath the wood block.


    Several sheaves are stacked against each other with the grain heads to form a
    stook or shock. There are traditions about how many sheaves of wheat, oats, rye,
    and barley make a stook, but I usually lean eight or ten against each other. In
    the stook the grain heads will dry and harden in the wind and sun. With one large
    sheaf draped over the top of the stook, even the rain will be turned away, although
    if the weather becomes wet, grain must be stacked or covered or brought into the
    barn. Thomas Jefferson had a large granary for every forty-acre field, where his
    grain did most of its drying. Some people like to stack their grain atop a platform
    that is proof against rats (off the ground on mushroom-shaped stalks), grain heads
    to the center, and thatch the top of the big stack or cover it with plastic. Whatever
    method you use, slow drying in the sheaf ripens the kernels so they will store
    well. Modern methods include heat-drying treatments, which often kill the germ
    of the grain. Taking the life away from the grain leaves no seed for next year
    and leaves the grain with questionable value. On the other hand, unless you have
    a fleet of carts, storing the sheaves loose in the barn for too long before threshing
    will transfer all the nutritional value. Not all the grain comes falling into
    neat bundles as it is cut, and the field may look a mess. After one time the privilege
    to glean a farmer’s fields after harvest was coveted because what was left could
    go on and picking up straws. Instead I turn the chickens or geese into the field.
    Finally, the undersown clovers and grasses grow up through the stubble to give
    a late crop and a good winter cover for the field. I only recently discovered
    Tusser''s sixteenth-century recommendations to do the same:


    - Corn carried, let such be poor and glean,

    - and after them, to mouth it clean;

    - Then spare it for rowen till past,

    - to lengthen thy dairy, no better hast.


    ![](img/27a09e01db329ab631e901469ce4b29_104_png) Figure 27 Tools for small grains


    ![](img/27a09e01db329ab631e901469ce4b29_105_0.png) winnowing tray or sieve


    ![](img/27a09e01db329ab631e901469ce4b29_105_1.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_2.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_3.png)


    ![](img/27a09e01db329ab631e901469ce4b29_105_4.png)


    Sometime in the fall or winter I take the sheaves of grain apart and separate
    the kernels from the straw and chaff by threshing: hitting them over the back
    of a chair, banging them around a barrel, jumping on them, or driving hooved animals
    over them, flailing them, or using a threshing drum. The two-piece flail, used
    since the fourth century, is a six-foot pole to which is hinged an eighteen-inch
    beater or swingle made of hardwood or occasionally knotted rope. The swingle is
    brought up easily to shoulder height and brought down along its full length onto
    the thick pile of opened sheaves with a thump, then again, and again. The blow
    need not be violent nor exhausting; the grain is not out, but shook out of the
    deep pile of straw by the blows of the flail. As scythe, there is a rhythm intrinsic
    to the task of threshing which makes the work easier. The leader of threshing
    teams coordinated the succession of blows with work songs or chants or even dances.


    The problem of design is the material for the hinge. Even leather wore out quickly,
    so elskin was used whenever available. Robert Johnston has proposed an excellent
    design to keep the swingle from getting tangled in its own hinge (Figure 28).
    The heavy wheel revolves freely around the notch at the end of the handle so the
    twine does not get twisted.


    A field before harvest may look like amber waves of grain, but threshing reveals
    that the kernels are a small fraction of the weight taken from the field. The
    quantity of chaff and straw seem prodigious by comparison to the pile of kernels,
    which are one twenty-fifth of the whole, and a smaller fraction of the volume.


    Wheat, rye, and buckwheat thresh easily. Only the "naked," or "hull-less" varieties
    of barley and oats thresh easily. The hulled varieties require more work with
    the flail; heating and light grinding also removes the hulls.


    Threshing with a flail was considered the hardest work on the farm because of
    the large quantities of grain that were required to feed the livestock. Mechanized
    threshers were greeted with a cheer. However, neither threshing nor any task is
    drudgery when done on a small scale; also, the work is definitely practical, and
    is valuable experience. Of the flail separating the seed from the hull and stalk,
    H.J. Massingham said, “The man who swung the flail was a person who molded the
    sources of life; the man who tended the machines risked himself to the inanimate.”


    The early threshing machines to which Massingham referred were very large, noisy,
    and dangerous. In contrast, the foot powered threshing drum, used widely on small
    quantities of grains in Japan (and pictured in Fukuoka’s One Straw Revolution),
    is a cylinder of wooden slats covered with wire loops rotated away from the operator
    by a treadle at 350–450 revolutions per minute. The straw is held in both hands
    over the moving wire loops, which beat the kernels out. This machine supposedly
    thresses six bushels an hour, with less risk of cracked kernels than in flail-threshing.
    However, in a series of experiments comparing the rotating drum to threshing with
    a flail, I found that the rotating drum performs best only when the kernels are
    extremely loose in the grain head. If the kernels are easily detachable and the
    sheaves are held carefully over the many steel fingers, the threshing drum takes
    the same amount of time as the flail—from a half hour to an hour per bushel—for
    an average of one third more kernels. Hurrying, however, decreases the yield below
    that of the flail. The expense of the threshing drum seems justified only for
    large quantities of grain.


    ![](img/27a09e01db329ab631e901469ce4b29_108_0.png) Figure 28 Attachment of swingle
    to handle


    The straw remaining after threshing can be used for animal feed, for thawing of
    roofs, for animal bedding or garden mulch, for which it is superior to sawdust
    and hay, for straw rope to tie down haystacks against winter winds, for the many
    beehives, baskets, and mats necessary around a farm, for the traditional birthing
    bed. Indeed, I met several European farmers who grow grain specifically for the
    straw to use with their vegetables or orchards; Fukuoka''s fertility program for
    barley and wheat depends entirely on returning the threshed straw to the fields.
    And straws of the threshed grain can be snipped between nodes to drink through,
    pleasing the children with the original organic drinking straw!

