    stand with my feet apart to give a wide swath, and drag the blade along the ground.
    To raise the height of the cut I raise my left hand during the stroke still letting
    the blade on the ground. If I follow the blade with my eye, I can see it moving
    through the grass in a way which is obscured in the hayfield; it looks like a
