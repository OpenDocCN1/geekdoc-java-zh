    The difficulty in the past of separating the grain from the chaff, dirt, broken
    kernels, weed seeds, bits of stem and leaf, and other foreign matter that collect
    on the threshing floor or tarp is well illustrated by the many folktales where
    the hero or heroine is charged with the impossible task of sorting a bushel of
    grain in one. Besides cleaning by hand, the traditional method of separating grain
    from waste was to wait for a favorable breeze, then threw the mass of grain and
    other matter into the air; the chaff and dirt were blown to the side while the
    grains dropped back into the winnowing tray. The chaff was saved to fill mattresses,
    sausages, etc. To separate the grain from the bits of stem, a series of *riddles*
    or sieves was used through which the grains dropped. Handpicking of remaining
    impurities followed, making grain cleaning the most-consuming task of harvest.
    Washing the grain—rinsing then drying on trays—floats the remaining chaff and
    cleans off any dirt. Even so, bread must have concealed other ingredients besides
    grain meal.


    An early improvement was the winnowing fan, used to create a draft on a windy
    day. Odysseus''s last task was to travel inland with an oar over his shoulder
    until he should meet someone who mistook it for a winnowing fan. Some small-scale
    farmers today use an electric fan with the same effect. The winnowing sheet flapped
    for a breeze a great deal in the United States prior to the nineteenth century;
    three-quarters of an hour were required for every bushel of grain. Studies in
    1898 concluded that twenty-six hours were required to thresh twenty bushels with
    a flail, winnow with a sheet, stack the grain, and stack the straw,56 much more
    time than modern farmers feel have for growing their own grains.


    The rotary winnowing machine with crank handle, in use in China by 40 BC, was
    brought to Holland, and then to Scotland in the eighteenth century, a lag of fourteen
    hundred years. By 1794, it was used by every husband and made by every country
    carpenter in Britain,57 Recent improvements have been made in the types of sieves
    used. In the hand-crank version pictured in Figure 27, threshed grain is dumped
    in the top, and a hand-crank turns a fan as well as jigling three screens. The
    screens are selected from over a hundred for the specific sorting task, experimentation
    which I find very enjoyable. Particles that are too large are directed out one
    spout, too small out another, chaff is blown out a third, and the grains are separated
    into two sizes. The output be twenty to thirty bushels an hour, less if there
    is a great deal of straw with the grain.


    Storing the bin or granary requires dryness. The bin should be elevated off the
    floor so air can circulate beneath it. Several two-by-fours can be set vertically
    in different places in the bin. When the bin is full, the wood is removed to provide
    passages for air movement. Protection from rats is obtained with heavy screen
    or solidly constructed wooden bins. The possibility of insect infestation can
    be eliminated with small quantities of grain by setting portions in a home freezer
    for a day, or with larger quantities, by storing outside in the winter cold. Dry
    ice (carbon dioxide) is feasible for killing insects in the grain with large or
    small quantities. These treatments do not kill the germ in the kernel as do high
    heat and strong chemicals.


    As for grinding and cooking grains, there are many books on the subject. It should
    be said that the whole grain is a natural storage container in which the nutritional
    qualities and seed viability are kept intact. Seeds unearthed from the tombs of
    the Egyptian pharaohs have sprouted when moistened, and wheat has been found to
    have a germination rate of eighty-five percent after thirty-two years in storage.
    This protection is destroyed when the kernel is cut in any way; then the contents
    begin to lose their potency and the oils turn rancid. It is best to keep the grain
    until shortly before it is used. Then the full life-giving power of the staff
    of life can be utilized.


    I wanted to know just my homegrown wheat measured up to other sources so I designed
    a simple experiment to test it. In each of two bags I sifted six cups of a commercial
    brand of “whole wheat flour”(though it is called wheat, it does not have the full
    germ since this would shorten its supermarket shelf life). Into two more bags
    I sifted six cups of hard spring wheat from North Dakota which I ground into flour
    that morning. To the last bags I sifted six cups of wheat I had grown and harvested
    myself, and ground into flour that morning. I randomly assigned the letters A
    to F to the six bags, then delivered them to a professional whole wheat baker
    with instructions to treat all six bags in the same manner. Using a simple recipe
    for whole wheat bread by the sponge method, he baked six loaves that day. I arranged
    taste tests that evening and the next two days for several individuals. The judges
    unanimously awarded last place to the commercial flour. Distinctions between the
    other four loaves were more subtle, most judges having good things to say about
    one individual loaf or another. The baker’s favorite was a homegrown loaf: it
    rose most nicely, sliced the thinnest, and had the best flavor. The majority of
    opinion was for the homegrown bread. When the identities of the flours were revealed,
    most judges groaned, saying, “I guess I’ll have to grow some wheat next year.”
    I must confess I was surprised: “just as good” and “superior” was an unexpected
    confirmation of my labor.


    # BRINGING THE HARVEST HOME


    - Your hay it mow’d and your corn is reap,

    Your barns will be full and your hovels heap.

    Come, boys, come,

    Come, boys, come,

    And merrily roar our harvest home.


    > JOHN DRYDEN AND HENRY PURCELL, KING ARTHUR, 1691


    When grains were harvested by hand, the fields could be cared for in smaller parcels,
    and with more careful scrutiny as is usually possible today. Men, women, and children
    who worked together around the center of a farm, community, or neighborhood—home
    in its broadest sense—would come together in work at harvest time. The participants
    might act in different occupations for the rest of the year; but these could be
    put off. The harvest could not.


    The link to the land and to the harvest task was also shown in the form of payment.
    The part-time laborers took home a portion of the crop, or be paid in other forms
    of the farmer’s, and therefore the community’s, wealth. For example, Thomas Jefferson
    set the “proper allowance” for six long days of work from each of his fifty-eight
    wheat harvesters at “4 gallons whisky, 2 quarts molasses, 1 midling (i.e., side
    of bacon) besides fresh meat per day, with peas.” This was in addition to a portion
    of the crop, also given in payment. In thirteenth century England, it was customary
    for the lord to grant his mowers as much as each could lift on the scythe at the
    end of the day; at the end of the season, they were given a sheep to catch and
    share.


    Shared meals deepened the relationship between the harvesters. H.J. Massingham
    recorded eight meal breaks in the harvest day:


    - Forebit and breakfast,

    Reabbit and dinner,

    Nunchins and crunchins

    a bit after supper.


    The confirmation of the community family through work and the close bond to the
    earth through agriculture have been felt since the beginning, and it is not merely
    nostalgic to bemoan the loss of the relationships in industrial societies. The
    loss of the traditional forms of cooperative labor means it is more difficult
    to find the opportunities for companionship in work. Approaching hay, weeds, or
    small grains with a scythe is one such opportunity. To the hard-headed realistic
    we have all become, a scythe or other tool must first sense sense. Beyond that,
    we are free to discover the other benefits—physical, emotional, intellectual,
    and spiritual—which the use of the scythe permits. Exploring old customs can help
    in the articulation of these benefits.


    One old custom has the portrayal of Death and Time wielding a scythe. (Figure
    29):


    > See how Death preys on humane Race;

    Out with his Scythe the Tyrant goes,

    Great Multitudes at once he mows.⁵


    If the scythe is the Grim Reaper’s favorite tool, was it considered to be a terribly
    dangerous weapon? No. Sharp as they are, scythes could never be used in combat
    unless the blades were reattached to extend out

