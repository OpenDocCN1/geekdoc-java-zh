    # Clean Culture


    Springing herbs repeat with brassen scythes.


    > —SURREY''S AENEID, 1547


    ... every farmer mowed every bit of roadside, all around his land. Every bit of
    grass was cut, around stonewalls, trees, buildings ...


    > —FLOYD FULLER OF RANDOLPH CENTER, VERMONT 3⁵


    # WEEDS


    IF CONSCIENTLY CUT THE WEEDS AROUND THE GARDEN, ALONG THE ROADS, and in every
    marginal area before they go to seed, I will slowly improve my home-site. A favorite
    nesting site of garden pests is removed; over the years, the legions of weeds
    will retreat. Every European farm, large and small, which I have visited had at
    least one scythe; on several highly mechanized farms, the scythe''s only use was
    extensive trimming. Such obsessiveness is not a quaint trait of the old country.
    Every minute spent with the scythe in this manner is repaid in minutes spent weeding.


    When cutting weeds, the scythe must be controlled more carefully than necessary
    in mowing. The strokes will be shorter and more accurate to shave stones, trees,
    fence posts, a bird''s nest, a flower desired to be left. I am slowly learning
    to use the point of the scythe to make the finest distinctions between blade of
    grass and the trunk of apple tree.


    In “Tuft of Flowers,” Robert Frost describes his discovery of “a tall tuft of
    flowers beside a brook,”


    > A leaping tongue of bloom the scythe had spared

    > Beside a reedy brook the scythe had barred.


    > The mower in the dew had loved them thus,

    > By leaving them to flourish, not for us,

    > Nor yet to draw one thought of ours to him,

    > But from sheer morning gladness at the brim.³³⁶


    An opportunity for discrimination and observation is given with the scythe that
    is not available from its mechanical substitutes. Many weeds have great virtues,
    and when kept under control the scythe can be more deeply appreciated. Dandelions
    make a fine wine, milkweed pods make excellent lifters, lamb''s quarters make
    a very nutritious early green (which gives this plant another name, “wild spinach”),
    goldenrod makes a simple dye for children’s school projects, and so forth.³³⁷


    When cutting downs weeds in different places around the home or farm, ask the
    question: Why is this particular species growing here? Ehrenreich Pfeiffer wrote
    a short pamphlet to answer this question, entitled Weeds and What They Tell. The
    closeness to the earth which the scythe permits, compared with a tractor, makes
    identification of weeds possible. The information is available for interpretation,
    and may help in decisions to improve the land.


    # PASTURE


    In pastures the nutritive and sweet-tasting plants are eaten first, the less desirable.
    Finally there remain the plants that the animals won’t eat. These mature, go to
    seed, and eventually take over. The animals eat themselves out of a food supply.
    Good pasture management involves not only attention to the mineral balance of
    the soil and periodic rests of the land rotation, but also getting the worst plants
    down before they go to seed. A scythe can do this quickly, even in large fields,
    since the mower has more maneuverability than a tractor when going from one dump
    to another.


    # LAWN


    The emphasis in a lawn is on what is left after the cut grasses are taken away;
    therefore, lawn-tending is a variation of the clean culture approach. Until the
    invention of the hand-pushed rotary lawn mower in 1831, all lawns were kept trimmed
    by nibbling animals or by gardeners with long-bladed scythes (Figure 23).


    ![](img/27a09e01dbd329ab631e901469ce4b29_80_0.png)


    Figure 23 **Mowing the grass**


    From reports of travelers, the scythe is still used in Greece and Turkey, and
    perhaps elsewhere as well, for cutting lawns. To cut my lawn of eight thousand
    square feet, the 70-centimeter scythe requires an hour and a quarter; a hand-pushed
    and a gasoline-powered mower both about forty minutes. Considering the cost of
    new equipment and maintenance, and granting myself a reasonable wage for my labor,
    the scythe is economically competitive. It is also free of noise and exhaust,
    and free of the dangers of gasoline-powered mowers (the Consumer Product Safety
    Commission estimates that each year 77,000 people are cut or lose a finger or
    toe to lawnmowers). The scythe would be still more economical on a smaller scale,
    but not for the modern golf course.


    For the border of the lawn, the new gasoline-powered scythe substitutes feature
    a short nylon cord that whirls around the end of a three-foot handle held in the
    hands. The whirling nylon beats the grass blades apart, resulting in bruised rather
    than cleanly cut leaves. The nylon also beats apart, though more slowly, and is
    added to the litter at the lawn''s edge. I have many times observed men using
    these tools very effectively, as fast as they could learn to wield a scythe. I
    have also seen many times attacking small tufts of weeds, passing the tool back
    and forth obstinately over stems that lie too flat to be budged while the operator
    is treated to the high whine of the machine and the billows of oily blue-gray
    smoke. With the scythe, I would have learned to pull the difficult weeds by hand,
    or I would have returned with an edging hoe whose blade extends straight from
    the handle to cut through the sod along the line between the lawn and something
    else.


    One situation in which the scythe and rake definitely have the edge over conventional
    lawn mowers is a lawn that has been neglected and grown to a hayfield. However,
    an article by George Talmage titled “Cutting a Meadow” makes no mention of the
    scythe. Mowing the lawn by hand is easiest when the grass is heavy with dew. The
    scythe leaves the lawn in windrows which must be raked up, or traditionally swept
    up with a besom of branches. In August these are the greenest and most succulent
    grasses on the farm, and I feed them to the animals as “green chop.” At the end
    of the season, I am relieved of the chore of thatching the lawn—that is, raking
    it firmly to make it even. However, hillocks in the lawn are frustrating to the
    scythe.


    # HARVESTING SMALL GRArains


    Sowing in the morning, sowing seeds of kindness,

    Sowing in the noontide and the dewy eve;

    Waiting for the harvest, and the time of reaping,

    We shall come rejoicing, bringing in the sheaves.


    > —GEORGE MINOR AND KNOWLES SHAW, NINETEENTH-CENTURY HYMNS


    From studies of the American diet, it seems many people have forgotten an axiom
    known to agricultural man until just one generation ago: Bread is the staff of
    life. Bread in all its forms—from pancakes to hardack—is grain edible. While many
    of our children know grains only in the form of sugary breakfast cereals and hamburger
    buns, farmers not long ago were familiar with a diversity of grains which they
    used for specific purposes. They knew what was best to eat for themselves and
    their animals under certain workloads and in certain weather conditions. They
    knew what was best for brewing.


    The modern gardener or small farmer can easily raise a small quantity of grains
    for his or her own table. It is worth a try. With an expenditure of a couple of
    hours on a good patch of soil 38 feet square, you can grow a bushel of wheat,
    which will make 1,792 four-inch pancakes (at the rate of 30 bushels/acre). Other
    sections for rye, oats, barley, buckwheat, and so on add different tastes and
    experiences. By becoming familiar with the different sorts of nutrition these
    grains offer the body, you can make a link with the heritage of agricultural use
    of the land leading into Neolithic times, ten thousand years ago.³⁹ Mahatma Gandhi
    added a moral dimension to growing one’s: he insisted that each person should
    contribute a portion of his or her labor to his or her sustenance; he called it
    “bread labor.”

