    ![](img/27a09e01dbd329ab631e901469ce4b29_41_0.png)


    图 12 磨刀


    ![](img/27a09e01dbd329ab631e901469ce4b29_42_0.png)


    图 13 清洁刀刃


    每个地区都有当地不同的采石场。在《工具制造者》（Man the Tool-maker）一书中，肯尼斯·奥克利（Kenneth Oakley）展示了一块萨森岩（一种经次生硅侵入硬化的砂岩），它在数千年前被用于磨锐石斧。优质的铺路石和纪念碑曾作为固定式磨刀非常流行。9
    我有一块来自附近惠特斯通溪（Whetstone Brook）的板岩，还有一块我爷爷经过多年使用而磨损的板岩磨刀，我发现它们能磨出非常锋利的刃。最后的润光来自一种英国传统，我从未在这个国家听说过，但我尝试过并非常满意：使用生长在死桦树上的干壳真菌（Polyporus
    betulinus）进行细磨，它非常贴合手部。


    在某些地方，用木棍代替石头，磨刀过程需要一套新的工具。使用锯子或特殊的铁质钻孔器钻出小的“孔”（delfs）来盛入脂肪或油脂；额外的油脂装在特殊的袋子或角里带到田间；锋利的或金刚砂被装在小袋里带到田间；刀柄（snaths）有时制成一英尺长，以适应刀柄架。10
    保持油脂低温不流失，保持锋利的边缘等等——这些都是失传的艺术。我对从这两种等级的石头上获得的锋利度感到满意。


    保持刃口锋利的最后一步是每天使用后擦拭刀刃，如图13 所示，这可以防止生锈并提高镜面光泽。割草者达蒙（Damon）的刀刃使得：“我在其中看到我的作品已完成，宛如新月中的太阳。”11


    我不借出我的镰刀。我享受精心维护的刃口带来的益处，而钝的边缘则提醒我自己的责任。每当我锻锤和磨刀时，我都在重新制作属于我自己的工具；随着时间的推移，它成了我工作态度的镜像。一个芬兰故事描述了一个疲惫的割草者，他叫道：“让魔鬼磨我的镰刀吧！”魔鬼死了，留下了刀柄。


    ## 割草技巧


    以此声驱散忧虑的烦恼，

    晨露中镰刀的挥动


    > —阿尔伯特·勋爵·丁尼森，《纪念集》LIX，1833


    割草应该是舒适的，不应该太费力，不应该——立即——疲累。如果是这样，说明做法错误。因此，割草的着装也应该舒适。最好的穿着包括宽松的裤子和衬衫。鞋应该是轻的；脚不会受到威胁，而且割草经常赤脚进行。草帽是个好主意，欧洲割草者总是戴着。围巾在清晨可以用来暖脖子，在下午可以擦额头。


    ## 一项有用的练习


    每次割草开始前的一项练习帮助我记住动作的形状（图 14）。我直立着，既不萎缩，也不僵硬地立正，将重力视为地球的基本力，它每刻都作用于我的全身。重力是一种加速度，与恒速相反：一种不断产生、将我向下拉得更快且更新的力量。我以向上的加速度作为回应，相反，也每刻都在更新，这是一种反重力。我倾向于用“能量”（energy）或“弹力”（spring）而不是反重力来表示这种反向运动；它不是一种反地球力，也不是排斥。地球是我们弹出的实体。我们是地球的后代。“弹力/spring）的其他含义都是正确的。既没有拉去与源头融合，也没有失控地飞向逃离，我直立着，脚踏实地却又向天空跃动。姿势本身就是一种创造行为。尽管这种互动


    ![](img/27a09e01dbd329ab631e901469ce4b29_45_0.png)


    图 14 我与重力之间的扭转练习一直在进行，它通常是无意识的。割草提醒了我这种关系，因为它恢复了重力和弹力的平衡。


    在这重力与弹力的这两个加速度流的中间，我是放松的；我的肩膀没有耸起，脖子不僵硬，我可以在大脑中从身体的一个部位移动到另一个，释放不必要的紧张。然后我开始从一侧扭转到另一侧，面向右侧，然后让手臂自由摆动。我的右手落在左大腿上，一秒后我的左手落在右大腿上。脚踝、膝盖、臀部以及整个脊椎都有扭转动作。这项练习旨在提醒我三件事：


    1. 割草是一种扭转动作，从身体右侧绕过前方到达左侧；

    2. 我的手臂和肩膀不需要紧张，可以保持放松；

    3. 我的整个身体都参与了扭转运动。人体可以被看作两个在动态平衡中以相反方向斜向上穿过身体的扭螺旋。在割草中，这种动态平衡是关键。


