    to the natural functioning of the human organism.


    Alexander found that he tried to keep a dynamic balance between head and torso,
    his efforts were vain. His body became rigidly fixed in a new position. He also
    found that without mirrors he could not reliably know what he was doing with his
    head and neck, and therefore did not know if he was carrying them “correctly.”
    Since he couldn’t do anything to remedy the poor use, he was left with not doing
    what was hurting him. Inhibition of wrong habitual patterns of use became the
    central feature of Alexander’s approach. In the words of a disciple of Alexander’s:


    Before an unrecognized pattern of behavior can be brought to your awareness, you
    must either recognize the habit, for example through mirrors, or by Alexander’s
    observation, or by “thinking yourself to stop” when you are about to engage in
    an activity. When you are about to move, think “NO!” And, gradually, through repeated
    inhibition, rather than repeated habit, you developed an increased sense of kinesthetic
    perception, enabling you to sense yourself when “setting yourself” physically
    to do something.¹⁴


    In my case, I first became aware of my poor use of myself in mowing; for example,
    I found that seeing dry wiregrass ahead in the row caused my neck and shoulders
    to tense, and thus put off my scythe stroke. I learned to inhibit this constriction
    during mowing in the way just described. Once I had inhibited the habitual response,
    I caused a pause between the stimulus (perception of wiregrass) and the response
    (tensing up for the anticipated harder mowing). In that pause is the opportunity
    for re-education of my use of myself. In that pause, Alexander suggested three
    directions, to be given myself silently as orders:


    +   1. Let the neck be free (do not increase the tension in the neck),

    2. Let the crown of the head go forward and up (do not pull the head back or down),

    3. Let the torso lengthen and widen out (do not shorten and narrow the back).'
