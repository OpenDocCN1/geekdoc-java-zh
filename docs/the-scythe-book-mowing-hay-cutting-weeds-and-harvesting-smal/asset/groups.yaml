    it. Herbal hay is not only for ruminants such as cows and goats. For raising poultry,
    an ounce of varied greenstuff per chicken is the secret of absence of disease
    and healthy laying,23

    The scythe mower has a final reward. The cut ends of each grass have their own
    unique perfume to add to the enjoyment of diversity.


    # MAKING THE HAY


    > My long scythe whispered and left the hay to make.

    —ROBERT FROST “MOWING,” 1913


    An acre was regarded as the equivalent of a day’s mowing. However, some could
    mow two acres a day without arising too early. An English legend is a man who,
    on a bet, mowed over five acres in one day; he used two scythes and employed a
    helper to whet the scythe not being used.


    These measurements are relative to the type of “acre” being used. Our current
    acre contains 43,560 square feet; but the old Scottish acre was 1.27 of our acres,
    the old Irish acre was 1.62 acres, the old Cheshire acre was 2.12 acres, and several
    measures from Eastern Europe measure 1.42 acres. Each one originally have been
    related to the area mowed in a day.


    The serious mowers would begin at four in the morning, when they could hardly
    see to whet their blades. The early morning dew gave the grass greater weight
    and inertia; it was less likely to bend than to be cut. Ease of cutting is not
    the only reason to cut low: for hay or mulch, there is more'
  - '[PAGE 66]


    quantity in each stalk nearer the ground. Thus the saying, “An inch at the bottom
    is worth two at the top.”


    In England an attachment was used to improve the delivery of the cut grass to
    the windrow. Called a “grass nail”, it was a stiff piece of wire connecting a
    hole in the beard with a hole three inches up the snath just higher than the tang.
    Another attachment used in different parts of Europe was a small semicircular
    bow with a four-inch radius attached to the base of the snath and rising perpendicularly
    to the line of the blade (much like the large bow cradle in Figure 26).^24


    Hay has dried in a variety of ways. In one tradition, boys and girls followed
    the mower, strewing the freshly cut grass with each hand over the opposite shoulder
    to lay it as lightly as possible. They came back with a hayfork to turn it again,
    exposing different surfaces to sun and wind. In Austria I observed the use of
    saplings with several branch stuffs left, *heinzen*, were stuck in the ground,
    and the hay was draped around them using the branch stuffs as hooks. Also in Europe,
    footrocks or haystacks are made, sometimes on top and platform to let air into
    the center. Three poles lashed at the top keep the hay up off the ground for better
    drying; such a tripod is shown in the background of Figure 20. The grass on the
    surface is combed with a rake so rain deflected from the bulk of the grass while
    it dries. Small farms in the mountainous areas of Scandinavia, horizontal wires
    are rigged between support poles and the grass is hung up as a clothesline.


    Rain is not only a nuisance because it can leach away nutrients from the surface
    of the grass. “He shall come down like rain upon the moon grass” (Psalms, 72:6).
    If rain threatens, it is best to gather the windrows of drying hay into a large
    stack, and cover the stack. After the ground has dried, spread the hay out again.
    Or bring the hay under cover in a ventilated area and let it dry more slowly before
    stacking in storage.


    The purpose of drying the grass is to preserve it. If it is too wet bacteria will
    rot and ruin it. The rotting also builds up a great deal of heat, and through
    history has caused the burning of many barn. However,'
  - '[PAGE 67]


    they are too dry the leafy crops such as alfalfa (lucerne), the clovers, and herbs
    will pulverize in handling and be left in the field or on the way to the place
    of storage.


    When old-timers smelled the hay’s deliciously heavy perfume in the field, they
    knew it was dry enough, and they snatched it up so it would lose no more of its
    essences. If left too long in the sun, the hay becomes light yellow, sometimes
    bleached almost white. The best hay is dry enough to rustle when picked up, but
    is blue green. The optimum range of moisture is 16–24 percent, and there is no
    way to know what the percentage of moisture in hay is without an expensive testing
    device. Finding the point where it is as dry as possible without being brittle
    is learned with a few trials. If the hay has 39–40 percent moisture, there is
    a fire hazard; a temperature over 180 degrees Fahrenheit is critical, and the
    hay should be spread apart or removed from the barn.


    ![](img/27a09e01dbd329ab631e901469ce4b29_67_0.png)


    Figure 20 Making hay'
  - '[PAGE 68]


    Horne’s Complete Grazier (1830) gives a hay-making schedule designed for areas
    of unsettled weather. On the first day, the grass must be mown before nine in
    the morning. Then it is teded or spread, every lump shaken out to expose the maximum
    surface area to sun and wind. Then it is turned again. In the afternoon it is
    raked into windrows and lastly into grass-cocks. The cocks, or little piles of
    grass, are combed from the outside to lead any rain away from the center. On the
    second day, the grass-cocks are pulled apart into stables, then turned twice in
    the day, alternating with the tending of the grass newly mown day. Then the first
    day’s grass is raked into cocks a little larger than before. On the third day,
    the grass is raked into stables and turned; if not dry enough to carry to the
    barn, it is raked into great-cocks until the next day. And so forth. Horne is
    accurate when he estimates that the work of twenty haymakers is needed for that
    of four mowers in areas where the drying is slow. Clarence Anosov that in ideal
    conditions the work of tedding and raking takes half a day for every day of mowing.
    Francis Alexander’s painting of haymaking in Southbridge, Massachusetts, in 1822
    (Figure 19) shows four mowers, three rakers, one cart loader, and one person carrying
    refreshment to the field²⁵


    This working and reworking of the same piece of ground can lead to the sort of
    intimacy which Andrew Marvel described in 1681:


    > I am the Mower Damon, known

    Through all the Meadows I have mown.

    On me the Morr her dew distills

    Before her darling Daffodils

    And, if no one licks off my heat,

    The Sun himself licks off my Sweat.

    While, going home, the Evning sweet

    In cowswater bathes my feet²⁶


    Going over the same piece of land again and again, learning where the obstructions
    are hidden, where the grass grows well and where poorly, the original meaning
    of being the best in your field.'
