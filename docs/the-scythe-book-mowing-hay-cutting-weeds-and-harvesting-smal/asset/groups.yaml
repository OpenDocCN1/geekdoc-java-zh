    than one third of an Austrian-made blade. An experienced mower knows, simply by
    holding the two, that the “economy” blade is not a bargain.


    However, many rural lot owners are of another generation who rarely use the scythe
    and know little about it; they buy it as a sort of stand-by in case their string
    trimmer breaks down. This, after all, once-so-essential tool which should hang
    in everyone''s garden shed is an old-time relic, if nothing else.


    This adds up to a lot of sales, and the merchants probably make a higher percentage
    of profit on a Chinese blade than on an Austrian one.


    There are only two scythe makers in Austria today, which is nearly a hundred times
    less than a century ago. They are having difficulty finding replacements for their
    retiring men, because there is not enough incentive for young ones to start the
    training.


    The most frequent question a manufacturer receives from the world''s large distributors
    is “Could you make it a little cheaper?”


    **Note 10.** This last note will, hope, read as a happy one. Once certain concepts
    of “fit” — actually fundamentals of simple physics — grasped, you can make a snath
    to fit yourself, even if you desire to mow on stilts. Though I do not claim to
    have it all figured out, if someone showed me a blade of any tang position, I
    could find the material for a snath to fit it in an alder (In other areas of the
    country, it may be provided by a different species, though in this locality is
    the place where snath materials are of the most plentiful curves and nearly the
    right diameter.) Alder wood is easy to work and it is strong enough—perhaps not
    for the most “energetic” mowers, but certainly for the sensible ones.


    In the same ticket, I would also find a snath coming at a 80-degree angle. The
    world is full of gifts!


