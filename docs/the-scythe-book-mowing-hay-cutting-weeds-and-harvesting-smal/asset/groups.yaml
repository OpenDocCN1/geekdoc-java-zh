    ![](img/27a09e01dbd329ab631e901469ce4b29_34_0.png)


    Figure 8 Peening: hammer, blade, and anvil


    of the blade. The whole process of peening takes five minutes, and should be done
    every twelve hours of use, or as necessary to straighten out an accidental dent
    in the blade.


    The cold-hammering of the tempered blade draws out the steel a tiny bit with each
    blow, to maintain the ideal thickness. Most people do not believe that it is possible
    to shape steel without a blacksmith’s forge. With the hard “American” blade, it
    probably isn’t. However, the crystalline structure of high quality tempered steel
    can be molded.'
  - '[PAGE 35]


    In the molecular alignment of cold work, the steel becomes strain-hardened without
    losing its ability to dent under severe stress (ductility). However, if the pounding-out
    is overdone and leaves an edge too thin and brittle, the blade will break at the
    weaker points. The object in peening is to maintain the bevel and thickness of
    the original blade, as it was crafted by the master smiths. A rule of thumb is
    to hold the blade as in Figure 8 and push up on the very edge with your thumbnail.
    If the edge can be slightly moved by this pressure, then it is the right thickness.
    If it does not move at all, then it needs more peening. If it moves but not spring
    back into place, then you have been hammering for much more than five minutes!


    Many claim they could not possibly hammer the blade every along its length, and
    that hammering would soon use up all of the blade. Not so. I have seen several
    blades used every season for twenty to thirty years, and they are from 1/4 to
    1/2-inch narrower than their original width. The edges, no longer perfectly/straight,
    have become a little wavy, showing that the wear and/ the sharpening has been
    uneven. However, this is acceptable for a scythe, and does not impair its performance.
    As Adrian Bell said in Apple Acre, “His scythe is as wavy as the sea; every nick
    is a history of his labor.”


    If by accident the blade strikes a stone or stump hidden by the grass, a section
    of the edge may be blunted, bent over, or it may even show a tear up to 1/6-inch
    long. The risk of such damage should be avoided, in the first place, by not demanding
    the scythe to do the job of an ax or billhook. These high-quality scythe blades
    will cut year-old trees and brambles, but not tree trunks the diameter of your
    finger or larger. However, accidents with stones, fences, and peening is the only
    way to straighten out a dent. The hammer and anvil are made light-weight with
    holes through strings can be attached so they may be carried easily to the place
    of work for such emergencies. By repeatedly tapping around the edges of a dent,
    you bring the blade back to its original shape. And, if you’re smart, you take
    the opportunity to remove or clearly mark the obstruction.'
  - '[PAGE 36]


    ![](img/27a09e01dbd329ab631e901469ce4b29_36_0.png)


    Figure 9 The sequence of hammer blows in peening'
  - '[PAGE 37]


    ![](img/27a09e01dbd329ab631e901469ce4b29_37_0.png)


    Figure 10 A simple arrangement for holding the scythe when peening


    When staring down at a large dent, I must remind myself that it is better to dent
    the blade than not to. The dent can be mended; the blade that shows no evidence
    of stress has stored the damage in tiny cracks which will shorten its life.8'
  - '[PAGE 38]


    # WHETTING


    > Anew with merry stave and jest

    The shrieking hone we ply.


    > WILLIAM ALLINGHAM, THE MOWERS, 1865


    Wetting with a stone gives the blade its even razor-sharpness, and is repeated
    at intervals during the work. You mow once around the hayfield, or let us say
    you mow fifteen minutes'' worth, then stop for thirty seconds or a minute to whe
    the blade. Seen from the tradition of the hard stamped blade, which never got
    as sharp as the hammered blade, and only slowly lost the sharpness it had, this
    pause is thought lazy. However, the higher-quality blade repays this periodic
    attention to its sharpness with a much more thorough cut requiring less effort.
    The routine sharpening is not time wasted, since the mower starts afresh with
    a better tool. Using a dull blade encourages more violent swings of the scythe
    to the cutting—this is tiring and potentially dangerous. The two quotes at the
    beginning of the chapter show a conflict in attitude about how much time should
    be spent sharpening; but I prefer to sharpen as often as I can break the trance
    of mowing. This may be fifteen minutes.


    Historically, whetstones were cut from natural outcrops of the right sort of rock.
    Since the advent of 1906 of mass-produced and therefore cheaper synthetic abrasives,
    natural stones have been used less. The hardware store scythe stone is usually
    made of silicone carbide or aluminum oxide from Canada bonded with resin and baked
    at 2500 degrees Fahrenheit. These common stones are too coarse for the blade of
    finer steel. European stones of silicone carbide have a finer grit and are more
    appropriate to use following the peening of the hammered blade. Natural stones
    are of a much finer grit still; when used for the very final honing, they import
    a sort of perfection to the edge that may not be noticed by the beginner but is
    greatly appreciated by the mower with little experience. To use the metaphor of
    sandpaper grit, the common stone is like 50 grit; the European synthetic stone,
    120 grit; and the natural stone, 320 grit.'
  - '[PAGE 39]


    The beginner is advised to proceed slowly with whetting, wearing a glove on the
    hand holding the stone. The point of the scythe blade can be set firmly against
    a tree or post or into the ground for stability. The scythe can also be held upright
    with the left hand, the left foot stepping on the top grip. Wipe the blade clean
    with a rag or some cut grass. Hold the stone against the blade so that across
    the back side of the blade, the angle of stone to blade is zero degrees. You should
    see the first 1/4-inch of the edge brighten with the whetting. The bevel of the
    edge is dictated by the sharpening of the front of the blade. Here the stone is
    guided by the rib which stands along the length of the blade. Wet slowly; the
    correct angle is far more important than rapidity of strokes.


    As in the drawing (Figure 12), begin with the base of the stone and finish with
    the point of the stone at the point of the blade; from heel-and-heel to toe-and-toe,
    or base-and-beard to point-and-point. The reason for this sequence is that tiny
    serrations or sawteeth are are built up pointing in the direction of the blade''s
    point. These help the cutting of the grass. If I were sharpening a razor razor,
    I would begin sharpening at toe-and-toe and hone back, toward the blade, to eliminate
    the very small burr of excess metal that occasionally builds up beyond the blade''s
    edge. For cutting grass, this burr does not impair the cutting, and soon breaks
    off. In any case, it is less dangerous to slide the whetstone and the hand away
    from the edge rather than toward it.


    One tradition recommends that the wetter stand with the light falling over the
    left shoulder to see how the stone is bearing on the edge. Some say during whetting
    the blade should point neither nor or south. In fact there are interactions between
    the earth''s magnetic field and the alignment of steel molecules in the edge,
    but they are very subtle. (Boatbuilders traditionally lay the keel of the boats
    they are constructing in a north-south direction, presumably for the reason.)


    The whetstone-holder (see Figure 11) protects the brittle stone in transit. It
    also holds a little water (mixed with vinegar by the Pennsylvania Dutch) so that
    the stone can be cleaned of the microscopic pieces of metal that clog its pores
    during whetting. Holders of old were made of cow''s horn or wood'
  - '[PAGE 40]


    ornately turned and individualized. But cow’s horn is rare and wood cracks, and
    they have given way to hard plastic holders with a belt clip for carrying. The
    stone should be jiggled in the water every fifteen seconds during whetting to
    clean the pores.


    At one time, much discussion was devoted to the virtues of the different slates
    and sarsens of every color—blue, green with red bands, brown, grey, white—from


    Figure 11 Whetstones and holders'
