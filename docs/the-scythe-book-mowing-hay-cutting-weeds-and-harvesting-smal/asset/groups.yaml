    Hommel）在《在中国工作》（China at Work）中注意到了这种使用磨膏进行磨刀的方法；他还发现20世纪30年代固定磨石在中国和日本非常普遍。


    - 10. 在威廉·西德尼·蒙特（William Sydney Mount）1848年的绘画《农夫修理他的镰刀》中可以看到滴水痕迹，该画收藏于长岛斯托尼布克的萨福克博物馆。


    - 11. 出自安德鲁·马维尔（Andrew Marvel）《割草人达蒙》（Damon the Mower）第八章，选自Margoliouth编辑的马维尔作品集。


    - 12. 肌腱每公斤储存2500焦耳能量，而张紧状态为900焦耳（J. Gordon，《结构》）。在中世纪，木制设计更有效，弹簧为130焦耳（J.E. Gordon，《结构》）。整个镰刀动作具有“推运动”的性质（有力、直接且持续）。它由瞬间的“挥割运动”（突然、有力且间接）引发，不是抖动动作，而是一种向空气中的灵活发射，就像时钟装置一样。


    - 13. 在英格加德·巴滕尼夫（Ingard Bartenief）的《身体动作：应对环境》中，整个镰刀动作具有“推运动”的性质（有力、直接且持续）。它由瞬间的“挥割运动”（突然、有力且间接）引发，不是抖动动作，而是一种向空气中的灵活发射，就像时钟装置一样。


