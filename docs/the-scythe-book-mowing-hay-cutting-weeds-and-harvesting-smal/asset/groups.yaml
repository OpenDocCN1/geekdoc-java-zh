    By leaving them to flourish, not for us,

    Nor yet to draw one thought of ours to him,

    But from sheer morning gladness at the brim.36


    An opportunity for discrimination and observation is given with the scythe that
    is not available from its mechanical substitutes. Many weeds have great virtues,
    and when kept under control the scythe can be more deeply appreciated. Dandelions
    make a fine wine, milkweed pods make excellent lifters, lamb''s quarters make
    a very nutritious early green (which gives this plant another name, “wild spinach”),
    goldenrod makes a simple dye for children’s school projects, and so forth.37


    When cutting downs weeds in different places around the home or farm, ask the
    question: Why is this particular species growing here? Ehrenreich Pfeiffer wrote
    a short pamphlet to answer this question, entitled Weeds and What They Tell. The
    closeness to the earth which the scythe permits, compared with a tractor, makes
    identification of weeds possible. The information is available for interpretation,
    and may help in decisions to improve the land.


    # PASTURE


    In pastures the nutritive and sweet-tasting plants are eaten first, the less desirable.
    Finally there remain the plants that the animals won’t eat. These mature, go to
    seed, and eventually take over. The animals eat themselves out of a food supply.
    Good pasture management involves not only attention to the mineral balance of
    the soil and periodic rests of the land rotation, but also getting the worst plants
    down before they go to seed. A scythe can do this quickly, even in large fields,
    since the mower has more maneuverability than a tractor when going from one dump
    to another.


