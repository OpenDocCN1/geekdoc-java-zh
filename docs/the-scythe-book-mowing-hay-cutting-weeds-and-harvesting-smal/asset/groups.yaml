    ![](img/27a09e01dbd329ab631e901469ce4b29_118_0.png)


    Figure 32 Cradling wheat


    Our celebration of Thanksgiving late in November has its roots in this same tradition,
    though it has lost its attachment to the season’s rhythms, to the feeling of being
    done with work in the fields and gardens, to the feeling of barns and homes bountous
    with the fruits of the earth, providing nurturant protection against winter. Now
    the dimly remembered strings of the harvest melody are plucked by the sale in
    gift shops of plaited Corn Dollies, mass-produced by not an expert hand. But the
    year-round availability of harvest trinkets is not the point living on the land.
    The embodiment of the Corn Spirit need not be a handsome, saleable item. Its purpose
    is to intensify in a symbol the communion of the farmer/gardener, through agriculture,
    with a little piece of the earth. For me, the painting of the harvest by Emile
    Bernard in Figure 31 evokes most powerfully the emotions of mingling with the
    Corn Spirit, and drawing up the energy for our sustenance out of the earth.'
