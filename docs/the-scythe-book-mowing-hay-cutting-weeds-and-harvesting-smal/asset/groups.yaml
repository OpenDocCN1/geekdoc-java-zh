    blade’s rib, but rather below it, nearly touching the center of the blade’s

    body. The captions accompanying the stone angle positions in a) and b) will

    be self-explanatory.


    It does not matter which way the scythe is held during whetting, though

    is important that the blade be steady and the mower comfortable. The

    position I prefer is to have the blade across in front of me, pointing to my

    right, so that I am looking at its under-side, as depicted in Figure 10.'
  - '[PAGE 162]


    ![](img/27a09e01dbd329ab631e901469ce4b29_162_0.png)


    The snath does not need to start, nor during honing remain, in a vertical position.
    Placing its end on the ground in such a way that the blade’s angle allows one
    to carry out the honing in a comfortable manner will help to maintain the desired
    stone-to-blade angle and thus improve efficiency.


    My somewhat unusual personal technique lies in that I continue the honing directly
    in front of me while allowing the blade to move gradually to the left by the “creeping”
    of the fingers of my left hand along the rib of the blade. This works well because
    the left hand is always very near to where the stone is just then contacting the
    edge in order to give steadying support where it is needed. There is no periodic
    pause and re-gripping. Being creative, you will find the way that works best for
    you.


    ***


    Before we leave the topic of easy-cutting scythes, a few reflections may be added
    here.


    There were not many gifts more appreciated by a man of an agrarian culture than
    a natural whetstone of good quality. The mowers of old, however, could tell a
    good one from a “klumpat.” The synthetic versions of 50 or more years ago, though
    made of much finer and less aggressive'
  - '[PAGE 163]


    material, were already then referred to as “those which eat scythe blades.” The
    changes in quality have been for the worse. Consequently, I regret to say that
    most of the synthetic wetstones of recent production worldwide are not suited
    as the only stone for regular wheting. They are a sort of hybrid between a shaping
    tool and a honing one, yet they accomplish neither job well.


    ![](img/27a09e01dbd329ab631e901469ce4b29_163_0.png)


    Figure 11


    However, in all the instances where fast metal removal is desired, they save time;
    thus they can be appreciated for the following purposes:


    +   1. The initial treatment of a blade peened with the jig. (See “Finishing the
    Properly Beveled Edge”).

    2. The removal of of the “back bevel” on some brand new blades [see note 5].

    3. Edge repairs.'
  - '[PAGE 164]


    4. Shaping /Beveling (not finishing) of other tools.


    Because the classical scythe tapered stones are so easily held in the hand, I
    use them now for the majority of tasks where abrasives are called for, while the
    array of bench and other stones I have accumulated over the years is mostly neglected.
    My carpentry skills are of mediocre level required on a homestead. The blades
    I use most frequently (after the snow has covered the grass, of course) are various
    knives, and drawknives, and I like them “keen” (even if that may not be the same
    as “perfectly sharp”). Along with farrier tools, sheep shears etc., they are mostly
    kept in that state by means of scythe stones; several of differing textures are
    always close at hand.


    Having only one scythe stone is, to me, unthinkable; I am totally baffled when
    I see people quibbling over which one of the $5.00 options they should choose.
    Men used to risk being shot or thrown in dungeons for smuggling a saddle of highly
    reputed scythe stones over treacherous mountain passes ...


    Likely a few natural stones are still available. Most of these will outlast synthetic
    substitutes by several times. From the combined discussion regarding edge quality,
    it will be obvious that their *slower* wear is not the primary reason for their
    much better value. Furthermore, they can be had without anyone shot or having
    to labor a week or just to afford one, in quality equivalent to the kind that
    men used to treasure. Such stones once received very special care and were kept
    and carried in equally precious **whetstone holders**.


    The first ones, used by the mowers of old, were made of animal horn. With the
    advent of steel augers wood replaced horn in many regions, probably because it
    was more plentiful and easily decorated in a personal manner. A well-made wooden
    holder did not crack, kept the water cool and lasted a lifetime.


    Inja Smerdel, curator of the Slovene Ethnographic Museum, wrote a whole book on
    the subject (as others did before her), and I tum to the words from her text.'
  - '[PAGE 165]


    “... Among the various implements, the whetstone holder was a very personal tool
    with many meanings, and the mower was—regardless of his social status—an individual,
    a personality with a particular reputation in the rural community. Besides all
    its other meanings, and, of course, besides being simply useful, a whetstone holder
    was the external token and reflection of a mower’s consciousness of his own personality
    and of his wish to be recognized as such.”


    How future ethnologists, reflecting on the characteristics of a 21st century American
    scythe user toting the yellow plastic stone holder, would re-word the above paragraph
    I dare not guess [see note 6].'
