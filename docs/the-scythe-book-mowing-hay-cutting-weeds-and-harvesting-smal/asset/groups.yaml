    本节首先简要介绍了小粒物收割工具的历史，然后描述了小粒物的生产过程，最后简要阐述了一些古今收割习俗。⁴⁰


    # 镰刀及其前身


    最初，谷物是通过连根拔起整株植物来收获的，然后将谷粒打入篮中。早期的切割工具是动物的颌骨，在牙齿位置嵌上锋利的燧石碎片，或者是带有燧石碎片的弯曲木头。这些设计都利用了“钩”的概念——将工具从直立的草丛后方向身体方向拉。早期的青铜镰也是垂直安装在木制或骨制手柄上的。刀片最终被弯成向右，然后延伸成一条长弧线指向左侧。因此，在规定的时刻准确挥动镰刀后，工具的重量得到了均匀平衡，手腕的压力也减轻了。


    单手持握短柄镰刀允许收割者在直立时工作。使用镰刀时，收割者的左手抓住草丛进行切割。而使用短柄镰刀时，左手伸出一根短木钩，在收割的谷物随镰刀动作落下时将其从田里拉出。这种方法的简单易读插图可以在著名的15世纪《贝里公爵让约翰的华丽时辰书》（Tres
    Riches Heures de Jean, Duke of Berry）中找到。


    奥诺或弗兰德式的短柄镰刀刀片长超过两英尺，刀柄长十四英寸，在与刀柄垂直的处有一个雕刻精美的握手。木钩（或称mathook）也经过了精心成型以适应手部。斯蒂芬斯（《农场之书》The
    Book of the Farm）估计，这种镰刀比镰刀节省了25%的工作量。然而，弗兰德镰刀对操作者来说比双手持握的长柄镰刀危险得多。


