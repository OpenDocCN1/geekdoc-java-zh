    ## PEENING


    The method of sharpening appropriate to the Austrian-pattern involves two steps:
    1) **peening**: hammering the blade upon a small anvil; and 2) **whetting**: the
    final honing with a whetstone.


    Peening is practiced on American and European farms today in a way unchanged from
    the way it is illustrated in Bruegel''s sixteenth-century painting, "Haymaking."
    A small anvil is set into the earth or into a bench, and the blade is lightly
    hammered with a bar peen or cross-peen hammer (Figure 8). The lightest cross-peen
    hammer made in this country is an expensive blacksmith''s hammer weighing two
    and a half pounds; the imported hammer weighs about one and a half pounds.


    The edge of the blade rests perfectly on the anvil. The hammer blows begin about
    ⅜-inch away from the edge, and proceed to the edge. It is easier to achieve this
    with several fast and light taps in the direction of the sets of four blows shown
    Figure 9. The bar peen strengthens the steel along the edge; either the hammer
    or the anvil or both must have this bar. Two flat faces or a common ball-peen
    hammer would not properly align the steel along the edge.


    To keep the blade on the anvil, you may balance the snath over your right shoulder,
    or another person can hold the top grip at the right height while you hold the
    blade with one hand and the hammer with the other. The top grip can also be tied
    to a string from a branch or rafter, as diagrammed in Figure 10: the person then
    can sit on either side

