    # WEEDS


    IF CONSCIENTLY CUT THE WEEDS AROUND THE GARDEN, ALONG THE ROADS, and in every
    marginal area before they go to seed, I will slowly improve my home-site. A favorite
    nesting site of garden pests is removed; over the years, the legions of weeds
    will retreat. Every European farm, large and small, which I have visited had at
    least one scythe; on several highly mechanized farms, the scythe''s only use was
    extensive trimming. Such obsessiveness is not a quaint trait of the old country.
    Every minute spent with the scythe in this manner is repaid in minutes spent weeding.


    When cutting weeds, the scythe must be controlled more carefully than necessary
    in mowing. The strokes will be shorter and more accurate to shave stones, trees,
    fence posts, a bird''s nest, a flower desired to be left. I am slowly learning
    to use the point of the scythe to make the finest distinctions between blade of
    grass and the trunk of apple tree.


    In “Tuft of Flowers,” Robert Frost describes his discovery of “a tall tuft of
    flowers beside a brook,”


    > A leaping tongue of bloom the scythe had spared

    Beside a reedy brook the scythe had barred.


    > The mower in the dew had loved them thus,'
