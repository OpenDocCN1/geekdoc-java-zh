    Many variations of these basic designs have been found and are still in use. In
    the 1920s, the Seymour Manufacturing Company in Seymour, Indiana, offered sixteen
    different patterns of the American large grain cradle. The bow form of cradle
    has been found in every size, as small as a semicircle with an eight-inch radius
    for short grains or tall grass. It is unclear when and where of the different
    designs originated, and exactly what crop condition each variant design was trying
    to accommodate. Just after World War II, the Food and Agriculture Organization
    in Rome introduced to Third World a detachable cradle for a straight snath with
    Austrian-pattern blade, but the cradle was too complicated to manufacture and
    repair, and the emphasis in the “Green Revolution” soon came to be placed on bigger
    and better machinery.


    # CUTTING GRAIN WITH OLD AND NEW TOOLS


    In his fascinating study of modern and ancient harvesting implements, Axel Steensburg
    performed comparative time trials using a variety of sickles and scythes from
    all periods of agriculture. In August of 1938 and 1939 he cut mature barley and
    oats with each tool from a 5 meters wide and 10 meters long (538 square feet).
    Steensburg actually counted the number of straws in each plot, and arrived at
    an average figure of 26,646! In Table 1 I have given brief descriptions of the
    tools used and the time it took to harvest these matched plots. When Steensburg
    cut more than one plot, I have the repeat times; this shows some of the variations
    that can occur, apparently randomly, under identical conditions.


    All of the flint implements in Steensburg’s tests were tools used over six thousand
    years ago, which had been dug up by archeologists. They ranged from 4½ to 7 inches
    in length. The Stenild flint sickle (11.6'
