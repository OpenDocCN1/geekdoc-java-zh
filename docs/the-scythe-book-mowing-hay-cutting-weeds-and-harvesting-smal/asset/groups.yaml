    我使用镰刀收割几英亩干草，这些干草被我用作花园的覆盖，并在冬季饲养我养的小型牲畜。我也用镰刀收获用于制作面包和煎饼的小种谷物。通过投入非常少的时间和精力，我得以自己种植干草和谷物。通过镰刀，我保持我的领地边缘区域没有杂草结籽，从而将我花园里的除草工作量减少了至少等同于割草所需的时间。我发现，使用镰刀完成一项中等规模任务所需的时间，与取回、安装、适配和修理机械替代品所需的时间相当。机器的维护意味着金钱的支出；人体的维护意味着健康的获得。挥动镰刀并不费力或困难；我割草的经验以及工具本身都是具有持久价值的资源。


    在 19 世纪后期开始的割草和收割机器广泛使用之前，镰刀是收割干草、谷物，以及维持富贵主和自由民庄园整洁的主要工具。与任何普通工具一样，早期关于镰刀的文字很少解释其用法，因为这是常识。然而，从
    20 世纪初开始，对农村生活的兴趣增加导致了作者开始接受一种自传形式，被总结为“我在农场的经历”。这些作者在记录老乡下人的回忆时，往往会包含一些关于他们遇到的老一辈人被遗忘做法的说明。其中一些作家自己已经变成了优秀的割草者，并传授了他们学到的知识。


    通过这些自传、旧的农业期刊、图画、绘画和雕塑的证据，以及人类学家和历史学者的著作，我们可以拼凑出一个关于镰刀如何设计和使用的相当准确的画面。根据时期和地区，有许多细微的。我将不会记录所有的。只需说，对于我关于镰刀设计和技术的每一条“规则”或传统，总有人以略有不同的方式去做，并把草割了。


    用老办法使用古老的工具有一种特殊的浪漫，体验我们祖先可能经历过的东西。然而，工具在今天必须是高效的。也就是说，抛开浪漫不谈，它必须能够有效地利用人的时间和精力，以至于与完成手头任务的其他手段相比具有竞争力。一把缺口的石刀虽然代表了那个时代巨大的技术飞跃，但并不符合这一标准。一把用于收获谷物的镰刀在小区域内符合这一标准。一把好的镰刀在较大区域和更多样化的任务中符合实用效率的标准。


    大学推广代理人非常有说服力地论证，农民没有时间去割草：受经济因素迫使，他被迫整天坐在拖拉机上，一个接一个地安装工具具，以产生足够的产量来支付设备的贷款。我提供镰刀及其相关工具并不是作为这种规模农业的替代方案；然而，即使在这里，镰刀也有一席之地，用于修剪机器无法到达的边缘。


    我使用镰刀不是为了赚足够的钱来维持生计，而是仅仅是为了维持生计。不仅我的劳动产物——干草、覆盖物、谷物——比我在这个化学时代在任何地方能获得的都要优越。此外，我深享受这种为自己的食物做贡献以及与土地亲密联系的体验。


    # 本书


    手册的第一部分详细介绍了镰刀的各个部分，内容可能比普通割草者想的还要多。我开始写时，本想写一本关于割草技术的简明手册，但发现制造细节、传统等内容对我的割草如此重要，以至于我将研究做到了极致，结果手册就变成了一本小书。我问过一位自称是“镰刀领域极少数几个真正的权威之一”的美国作家，他在技术方面使用了哪些资源。他他惊呼道：“你在开玩笑吗？去外面挥挥那玩意儿就行了！”这就是他关于如何使用镰刀所说的全部。然而，我坚信，有了正确的工具，普通的割草者很快就会成为严肃的割草者，届时我在这里提供的细节将更有趣。无论如何，阅读关于磨刀和割草技术的章节就足够走出去面对大群蒲公英了。随后的章节列出了割干草、割除杂草和收获谷物所需的最低考虑。


    # 镰刀的部位


    ## 刀刃


    在勒格兰·坎农（Legrand Cannon）的《望山》（Look to the Mountain）中讲述了一个故事，一位大师铁匠在 1769 年为新罕布什州的一个年轻割草者制作了一把大马士钢镰刀.¹在他的锻炉的高温下，他将铁钢条锻在一起，反复地相互折叠。淬火后，刀刃中混合金属的效果非常像大理石纹。铁赋予了刀刃灵活性，作为钢脆性的解药；钢保持了边缘锋利如刃，并赋予了刀刃持久的形状。价格呢？二十一捆岩石枫木，经过切割、劈开和堆叠。大师铁匠向那个年轻人保证，每一斧头落下都至少会有一次锤击。


    今天，普通五金店的镰刀刃是在强力落锻机上冲压的，其边缘在高速磨光轮上磨利。相比之下，更锋利、更精细的欧式或奥地利风格刀刃边缘是被锤打到正确的薄度，正如自 15
    世纪奥地利斯山谷建立镰刀匠行会以来，它一直是这样做的。水力跳击锤的出现，以及现在小巧而强大的手动引导锤的出现，使得精良的镰刀刃变得不到二十一捆硬木，但手工锻造的刀刃仍然昂贵。


    普通五金店的镰刀刃通常被称为“美式”类型，较好的刀刃则是“奥地利”类型。事实上，镰刀刃在这一制造已经制造了近二十年，当它们是这样时，有些是高质量的。“美式”图案是高质量的；他们公开承认冲压刃是其产品线的底端。


    ![](img/27a09e01db329ab631e9014694b29_17.png)镰刀的部位


    | 冲压刃 | 锻造刃 |

    | :--- | :--- |

    | 正视图 | 正视图 |

    | 边缘视图 | 边缘视图 |

    | 端视图 | 端视图 |

    | 装柄 | 装柄 |


    ![](img/27a09e01db329ab631e9014694b29_18.png)精良的镰刀刃必须重量轻，并且经过淬火后可以保持边缘而不撕裂。然而，它必须足够柔软，在意外撞到石头或树桩时会凹陷而不是断裂，并且能够通过锤击恢复边缘。问题在于找到具有合适一致性的钢以实现这种完美的平衡。在英国，“皇冠”刀刃曾将边缘铆在更坚固的“软”钢背上。


    ![](img/27a09e01db329ab631e9014694b29_19.png)图 3 锻造刃的二十六个步骤


    图 3 所示的锻造刃的制造从高质量钢开始，通过热加工和冷加工，排列分子并使钢应力硬化。这些刀刃的精确要求清楚地解释了为什么在开始这二十六个阶段时，超过一半的刀刃在途中被淘汰了。尽管步骤
    14 到 20 之间没有明显变化，但这里是最重要的温度和成型的地方。刀刃在炉中加热，在油中冷却，喷砂，并对角线锤打，以赋予背部和边缘最佳的形状厚度。


    较好的刀刃在柄上盖有制造商的商标（图 4），这些可以在 Franz Schrokenfux 和 Josef Zeitlinger 的目录中查到。这些参考将商标与特定公司的制造方法以及大师的谱系联系起来，这一直受到奥斯曼帝国的影响。


