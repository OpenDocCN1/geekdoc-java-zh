    ## The Scythe Must Dance


    **Note 1.** The work-morale within a socialist state, if the utmost productivity
    mattered, was nothing to brag about. Imagine the last atmosphere we would have
    in North America if we all worked for the Government...


    In retrospect, however, I am impressed by system''s succumbing to the notion that
    machines should replace human bodies whenever possible. Shovels, hoes and of,
    scythes were used alongside their modern substitutes whenever it made sense —
    which it still does. There was no unemployment. Building foundations were dug,
    and acres of cooperative row crops hoed, by hand. Many animals'' bellies were
    filled, and still, kept full with hand-made hay ...


    **Note 2.** The Marugg Company''s “Instruction Page,” written for the 1932 catalogue
    (which, we told, “still applies today as is”), shows a man seated by a steady
    block with the blade supported on his knees. I like that picture. However, the
    combined peening-related text is as follows: “these blades are sharpened by beating
    or hammering out the cutting edge, instead of grinding. This method produces a
    wide, somewhat hollow, jagged, cutting edge, at the same time hardening it. Any
    person of ordinary intelligence can, with very little practice, produce a perfect
    ‘Dangel’ by the use of a proper hammer and anvil. Various patterns of Dangel outfits
    (hammer and anvil) are in use. We show two kinds of hammers and anvils.


    In our ‘B’ style, the blade is flat down on the anvil and the edge is hammered
    from the upper side of the blade, When using W style, which has a narrowed top,
    the blade is turned bottom side up and hammered from the bottom as shown in the
    illustration. To prevent heating of the metal, it is well to dip the hammer in
    water occasionally. A fresh hammered Dangel easily suffices for a full day’s mowing.


    Perhaps “ordinary intelligence” meant something else in those days ... Indeed,
    all other pamphlets enclosed with the scythe by other companies in other languages
    that I have found to be similarly lacking in usefulness. Of them stress that “the
    edges under no circumstances be sharpened by grinding” and that the peening needs
    to be “executed very carefully” ... but exactly how is left to the mower’s intelligence
    to figure out


    **Note 3.** Formerly titled Keeping Warm with an Ax, this is a rare one among
    the modern how-to books. The author is obviously one of those old-timers who *understands*
    the subject. Moreover, he treats holistically and can write with clarity and as
    humor. The well-explained concept of “frontal zone” alone, no doubt, saved some
    of my own blood when, years ago, I made that break from chainsaw dependency to
    a far more pleasurable time in the woods. I highly recommend this book, even if
    you do like your chainsaw! Cook uses ones, as well; and he writes from both sides
    of the fence.


    **Note 4.** I am not implying that a neglected ax can be-reconditioned in minutes.
    However, using a fine-cut file and three stones of progressively finer grit, I
    could quickly finish the last of nearly any ax so that it would shave the hairs
    off my arm. Even 60 to 70 “combined angle” of a splitting mau will. The last stone
    in succession would be a natural one from Slovakia, which is capable of leaving
    behind a polished, “razor-sharp” finish. A few strokes on a leather strop would
    be a final touch, though not necessary.


    I make an exception for those $4.99 “Made in China” hatchets or similar “economy”
