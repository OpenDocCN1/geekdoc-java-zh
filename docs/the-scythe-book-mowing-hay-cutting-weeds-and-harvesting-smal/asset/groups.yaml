    # Preface


    Twenty years ago, I learned the right use of the scythe from Eliot Coleman. I
    then went on to design an American version of the European snath, imported the
    best of the European blades, and put together an integrated system of tools to
    sharpen and care for this wonderful means of cutting grasses, grains, brambles.
    My company was called By Hand and Foot, Ltd.: Tools Dependent on Human Energy,
    which later became Green River Tools, and we sold many garden and farm tools by
    mail order. Ten years ago, Green River Tools was sold, and the new owners dropped
    the scythe line. Other companies who copied the snath design and other parts of
    the system deleted them from their offerings. For a long time, those who wrote
    me had no idea how to obtain good equipment, and I was hard pressed about what
    to tell them.


    Now good equipment has become available in catalogs, a combination of imported
    and handmade. Even if you don''t have the best components, once you understand
    the scythe''s principles, you can work with any part of the system to refine it—bending
    and sharpening the cheaper blades, rasping down the cheaper, heavier handles—and
    bring back the thrill of the body exhilarated by the outdoors while the blade
    whispers through the plants.


    Further work on improving this tool, and understanding how it works well, continues.
    In his book, Living Energies (Bath: England: Gateway Books, 1996), Callum Coates
    offers an analysis of the scythe''s superiority to that of mechanical cutters:
    “The scythe delivers a slicing cut, keeping the area to a minimum. Due to hammer-sharpening,
    the imparted edge there quickly draws the elements in the material together and
    rapidly seals it.” (p. 261) In a series of articles for Small Farmer’s Journal
    (from Sisters, Oregon, especially the issues of spring and summer of 1995), the
    well read and reassert that in this age when wonder you can accomplish anything
    without the aid of electricity or gasoline, we open ourselves to the profound
    teachings of Nature. The companies come and go. The meadow beckons forever. Good
    mowing to you. —D. T., 1996


    # Sources


    True high quality European-style scythes are available from the following companies:


    - Lehman Hardware and Appliances, PO Box 41, Kidron, OH 44636-888-5346, lehmans.com

    - The Marugg Co., PO Box 1418, Tracy City, TN 37387-931-5042, themaruggcompany.com

    - Scythe Supply, 496 Shore Road, Perry, ME 04667-207-8530, scytheupply.com


    Acknowledgments are due to Eliot Coleman for introducing me to the European scythe;
    to Tommy Thompson for introducing me to its best use; and to Castle Freeman and
    Susan Tresemer for helping me to write about it; also to Keith Squires, Stephen
    Bourne, and Brian Gabe for assisting in trials; to Tommy Thompson, Rachel Hill,
    and Peter Payne for reading portions of the manuscript and offering suggestions;
    to Bob Anderson and Irving Perkins for carefully guiding the production of the
    printed work.


