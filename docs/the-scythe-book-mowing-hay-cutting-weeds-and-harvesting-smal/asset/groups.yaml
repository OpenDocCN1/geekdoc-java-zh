    This is not a hypothetical story, but what some people have actually told me.


    Even one session of careless peening can take the edge from a state of soundness,
    through one of stress, to minuscule cracks and then possibly serious ones. It
    is advisable to acquire the habit of periodically checking the edge under magnification.
    Even a 3x hand lens will be revealing; 10x is better. If cracks are detected,
    hammering in their vicinity should be avoided. No amount of tapping, however skillful
    or careful, will again re-connect the intermolecular bonds, i.e. rejoin the two
    sides of the crack.


    ![](img/27a09e01dbd329ab631e901469ce4b29_169_0.png)


    Figure 13


    To be effectively “repaired,” cracks must be removed completely. Here is a job
    for a file (a half-worn, 6" chainsaw raker file is my favorite).


    Before a thorough repair is considered, a compromise approach may be tried out
    in some cases. A single perpendicular crack, even if quite large (1/4" long),
    can be left intact and watched closely. It may cause no trouble for a long time
    and gradually wear off in use. Whenever the rest of the'
  - '[PAGE 170]


    blade peeneed, avoid hitting the surrounding area—perhaps 3/16" to ¾" to either
    side of it. Instead, shape that part of the edge with a synthetic stone only and
    keep it a little thicker than the rest.


    The kind of diagonal crack we are left with after tapping the protruding and bent-over
    piece of a tear is a different story. Once a portion of the edge was stressed
    this much (by the extreme bending), it will lose some of its "stiffness." The
    corner may continue to bend out in use and catch grass, eventually breaking off.
    Until then it will be a nuisance.


