    drawknife.) Round holes for the grips are easier to make than square mortises
    and are perfectly functional.


    ![](img/27a09e01dbd329ab631e901469ce4b29_194_0.png)


    Figure 25


    The combined considerations of a very nice fit, ergonomic design, and possible
    artistic touches can be involved or, I might add, highly interesting.


    A small book could be written on this topic alone. How many people would make
    use of it, I do not know; I have been told that most present-day mowers will not
    bother making their own snaths. In any case, I leave you without a bona fide snathmaking
    chapter for now. One can be added to the next edition if interest justifies it.
    However, the perceptive reader will find a wealth of subtle visual hints in Figure
    1. Here are a couple of additional suggestions:


    I would not tolerate round-shaped grips, especially on a trimming snath. They
    necessitate more “gripping” than is desired for a relaxed experience. Flattening
    only the “inside” of each grip (as pictured in Figure 25) is a quick and worthwhile
    improvement to any commercial model. Finish the flattened edges on an angle that
    feels most comfortable.


    Another feature that will help to balance the blade is adding 5–10 ounces to the
    end of the snath. Slip a pretty brass knob (from an old ham) over the tip, or
    drill a hole and tie your pet rock (not a pebble) somewhere near the upper grip.
    Experiment with the weight; it is related to snath and blade size, their respective
    weights and intended purpose.


    It took me several seasons to fully appreciate this concept. Now I am very puzzled
    why this “question of balance” has not been given attention by snath makers and
    users everywhere.


    Discussing this “upside down” idea in theory with various individuals in Europe
    had little effect; it last year, when for the first time, I traveled during the
    grass-growing season, I took several home-made snaths one of them, with blade
    mounted, mower in Austria and Switzerland who took one of them, merely into his
    hands, nodded in approval. Most of those who took a few swings asked if I could
    make for them also… which I did.


    The shape and placement of the grips were additional features that they all appreciated.


    The Appendix outlines some of my attempts to inspire better service on the “home
    front,” as well as my vision for a more promising tomorrow.


    ## Postscript


    In spite of my many unflattering remarks, I see the future of the scythe as a
    bright one. My optimism is periodically renewed by meeting individuals whom I
    perceive as a symbol of hope.


    Eighteen-year-old Hannah Sawyer, from Kingfield, Maine, exemplifies such a person
    and I offer here a paragraph from her home-school essay:


    > “Scythe is simple; it is relaxing too. It is no wonder the people of yesterear
    had very little problem with stress. The quiet rhythm melts away tension; swish,
    cut, swish, cut, cut, swish... If I close my eyes it is easy to imagine myself
    back in time—a bird singing to the sky, the wind whispering to the trees, the
    splash of a horse pawing the water, the lowing of a cow calling for her calf.
    Would you like to time-travel? I''ll teach you how.”


    ## Acknowledgments


    Any non-writer, like myself has attempted to put many elusive concepts and convictions
    into the fixed form of a book and was left with his immediate family intact, would
    know that it is the supportive kin who deserve immense gratitude.


    Apart from the vast number of people contributing to who I am and what I do, I
    only know it all started with my mother, Maria and my father, Jozef.


    Many have aided my scythe-related quest. Among them, the “amazing woman” Grith
    Lerche of Denmark and the New Hampshire dairy farmer and lifelong scythe missionary
    Hans Eccard seem to stand out as wellsprings of strength I have, at times, sorely
    needed.


    Moreover, had it not been for the overwhelming hospitality of the extended working
    collective (and especially Peter Wagner) at the Franz Paul Schrocken scythe factory,
    where I learned so much, this written form of my partial know-how would not be.


    Nor would it be in your hands now without the necessary arrangements made by Alan
    Hood and the great patience he subsequently manifested.


    This manuscript’s first versions were all pencil-written on the backs of once-used
    papers. After my combats with Kai were settled (or nearly so), Faye typed it on
    a manual typewriter. Our friend, neighbor, second editor and proofreader Philip
    Allen, worked long hours to meticulously transfer the text and the diagrams into—well,
    yes, I sheepishly admit—a “clear digitized form.”


    Any lack of clarity in composition you may have been troubled is due to my stubborn
    insistence on retaining a mode of expression with sometimes uncommon double meanings
    and “between-the-lines” philosophy. The Slovak brain patterns must have long taproots
    difficult to dig out.


    In spite of the integrity with which I have attempted to communicate, I alone
    am responsible for possible shortcomings regarding the conceptual and technical
    correctness of this text.


    ## Appendix


    Between 1994 and the time of this writing, I have approached every American scythe
    importer, including most of the dealers of the “European pattern” blades and accessories,
    offering to help. (This was free service; I paid for the hours on the phone and
    spent time writing many pages of letters.)


    Some took me for a rare fanatic and treated me accordingly; some seemed to listen
    politely, yet continued carrying on as before. Others wanted suggestions (or so
    said), but did not follow


    - Customers would be confused by too many options.

    - The interest in the tool does not justify the cost of printing more detailed
    descriptions.

    - Their selection, incomplete though it may be, will suffice for the “beginner.”


    Perhaps I am a naive optimist, partial to the scythe, who believes this tool deserves
    to be treated


    The biggest “un-success,” to date, is my experience with a Canadian company, within
    the last 20 years, has come to represent the world of gardening. When their next
    catalog arrived, I was shocked at the selection: one blade, aluminum snath, stone-holder
    and one synthetic stone. This offers, to woodworkers, approximately 250 different
    chisels and gouges and a vast array of means to sharpen them.


    You see, I, in several letters, urged them to sell shorter blades than any commercially
    available and suggested that the Amish woodworkers in Ontario make snaths of Canadian
    wood of better design. I volunteered to write—free of charge—a instructional booklet
    to be included with each scythe; they did not take me up on the offer and later
    did it dawn on me as to I would have stated clearly—as I did to the company—that
    these blades will perform poorly if the edge is not periodically “peened.” Exasperated,
    though not yet ready to give up, I called the president on the phone. He told
    me that, at most, four people in this country use the scythe seriously, and, besides,
    one could not teach the average person today how to shape the edge of a tool,
    even with the aid of a “jig,” (the function of which I had previously described
    to him in detail by means of diagrams in my lengthy letters.) That really floored
    me. This man’s low regard for his fellow Canadians was one; the other is he cannot
    claim ignorance on the issue of sharpening. As one of the contemporary “keen-edge”
    gurus, he wrote an excellent book on the subject. Luckily, he did not discuss
    the scythe; I wonder how he would have explained, or justified, the use of the
    whetstone he sells to sharpen. Their supplier of scythes and accessories offers
    five natural and five synthetic stones. They opted for the very cheapest of the
    latter group.


    For now I have run out of the energy required to break established attitudes and
    business patterns. Instead, I am focusing on an alternative approach—the planting
    of seeds at ground level with the vision of establishing a cooperative network
    in America and Europe. It will consist of those who, instead of just selling the
    scythe, would like to *learn to use it well*, and by means of workshops, *pass
    the skill to others.*

