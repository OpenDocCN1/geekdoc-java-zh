    I do not look back on my work to check the stroke, and variations in the rhythm,
    such as are demanded by molehills, stones, and the rare toad or partridge, easily
    destroy the heavenly balance. Entering into a poised rhythm with awareness of
    my environment permits me to perform as evenly and flexibly as Levin’s old teacher.


    The human rhythm of mowing, and the flexibility it permits, is central to the
    superiority of the scythe as a tool. The first mechanical mowing used one or several
    scythes whirling about complete circles from a horizontal wheel directly powered
    by the wheels of the machine turning on the ground. The inventors were trying
    to do what the human mower was doing, faster. In fact, these machines performed
    worse than humans—they were unable to accommodate changes in terrain, type of
    grass, direction of lay in lodged grass, and obstacles. On any but the smoothest
    homogeneous ground, the blades often dug into the ground or bent the grass over
    without cutting it.¹18


    # RECONSIDERING THE TWISTING EXERCISE


    > The meditative repose in which he performs (the preparations for working) gives
    him that vital loosening and equality of all his powers, collectedness and presence
    of mind, without no right work can be done.


    —Eugen Herrigel, Zen in the Art of Archery, 1953


    I stand again in a relaxed manner with the scythe on in front of me. I take a
    moment to relax. Then I let my ankles become looser, so that I begin to rotate
    from side to side. I loosen my knees, hips, and torso, letting'
  - '[PAGE 61]


    my arms flop from one side to another. I am always aware of the relationship of
    my head to my neck and to the rest of my body.


    To this point I have concentrated on my own primary control and on inhibition
    of my habitual ways of moving, so that my body can twist more freely. Now, without
    actually doing it, I think about holding the scythe in this movement. If I tense
    up, then I can take the time to relax tension without the real distraction of
    the scythe in my hands.


    I then pick up the scythe and continue the twisting experiment, feeling the weight
    and shape of the tool. Finally, I can approach the grass with the scythe. In this
    way I proceed carefully from my relationship to gravity, to my own primary control,
    to my relationship with the tool, to my relationship with the grass. The scythe
    draws my primary control out my own body to relate to the earth. 19'
  - '[PAGE 62]


    # # Mowing Hay


    Grass is the forgiveness of nature—her constant benediction. ... should its harvest
    fail for a single year, famine would depopulate the world.


    > —SENATOR JOHN JAMES INGALLS, “IN PRAISE OF BLUE GRASS,”


    UNLIKE THE LEAVES OF OTHER PLANTS, THE LEAVES OF GRASS (FAMILY GRAMINEAE) grow
    not from their tips but from cells at the base of their sheaths. Therefore they
    can be cut, mown, and nibbled again and again yet grow back. “Greenstuff” is harvested
    to feed animals and to mulch gardens and orchards. Modern farming equipment has
    made the harvest easier, so that in place of the teams of mowers is the tractor
    operator, his mowing machine, bedding machine, baling machine, and trucks for
    transport. Smaller farmers, gardeners, and homeowners have difficulty haying because
    they cannot afford this equipment, cannot rent it in the suburbs, and cannot hire
    it from the larger farmer, who needs it at the season.


    Hay cut first in spring when the leaves are green, juicy, and full of protein,
    and when the fiber content of the plant is low. The digestibility and worth of
    the hay is at its highest quality early—May 15 in Vermont and further south. Every
    day after this date digestibility decreases by half of a percent, as the proportion
    of protein to fiber decreases. Later on there is more quantity of hay as the grasses
    mature, but it is actually less useful to the animals. (Hay which is harvested
    for the first time in August has tough brown stalks without much leafy green:
    “Won’t make butter, but it’ll ‘em alive,’ as one dairy farmer said.)


    The reason mechanized farmers often wait until June and July to cut hay is that
    the weather has not settled and the fields are too wet for heavy equipment. When
    mowing by hand, however, there is no danger of getting'
  - '[PAGE 63]


    stuck in the wet spots. Furthermore, grasses at the peak of nutritive value are
    more succulent and easier to mow than older grasses. An early first cut lets the
    grass grow back for equally fine second and third cuts later in the summer (even
    more further south). These second cuttings (rowen or after-grass) are very popular
    with the animals.


    ![](img/27a09e01dbd329ab631e901469ce4b29_63_0.png)


    Figure 19 Mowing in Massachusetts in 1822


    A scythe is also more versatile than a mechanical mower along the edges in the
    corners of the field. In many New England hayfields the tree line has crept onto
    the field, leaving the stonewall boundary ten or twenty yards back into the young
    forest. Tractor-drawn mowers are not designed to cut to the edge. The scythe is
    more maneuverable and precise, and can mow in corners and close along walls. For
    very large fields, it could be used for margin-trimming in conjunction with the
    machines.'
  - '[PAGE 64]


    One thing harvested along the field''s edge is small one-year-old trees. Having
    observed that all grazing animals spend so much time eating the leaves from the
    trees at the edge of the pasture, the authors of Bio-Dynamic Agriculture suggest
    adding a “leaf hay” to the daily feed ration as an added resource. With the scythe’s
    trimmings along the field''s edge are a boon to the hay.20


    Historians report a greater diversity of plants and flowers in centuries past
    in the meadows used for pasture and hay. “Biological” farmers strive for a similar
    diversity, in contrast to the one or two kinds of plant found in the hayfields
    of modern largcale agriculture. One popular seed mixture from England for permanent
    pasture or hayfield contains nineteen plants:21


