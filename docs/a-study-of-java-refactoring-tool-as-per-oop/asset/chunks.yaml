    ### Summary


    Consolidate Duplicate Conditional Fragments is used to eliminate duplicate code.
    It results in cleaner source code. The structure of the source code didn’t change
    except the conditional. Moreover, inside the `if`-statement’s body, the logical
    is straightforward with less code presents, which means less potential for making
    mistakes. In the end, this refactoring makes the conditional clearer.


    ### 7.3 Sample Input and Validation of Replace Nested Conditional with guard Clauses


    Finally, under Simplifying Conditional Expression’s Replace Nested Conditional
    with Guard Clauses, a sample code used is a single Java class named “RNCGC simpleTest.”
    This class has a single `main` method to print a double’s value, where the double’s
    value is determined by a few nested `if`-statements, and each of them is determined
    under a different boolean value. The purpose of `RNCGC` is to simplify the nested
    conditional to a list of plain view results.


    The sample source code’s three boolean variable values will be changed to test
    the refactoring thoroughly. As a result, four different inputs and outputs of
    the program will be shown. The first set of inputs occurs when any one of three
