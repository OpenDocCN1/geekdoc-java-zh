- fmt: '

    5. Developer clicks Refactoring button, and `QJRT` takes the selected source code
    from the bottom panel and uses `ASTParser` to parse it. The first step is `PDM`
    verifies if the selected code is a valid method, which should have basic method
    signature, includes following key elements: modifiers, return type, method name,
    parameter list in parenthesis, an exception list, and method body. `PDM` extracts
    value of those elements from `AST`, and temporarily save in memory. Then, `QJRT`
    finds the root of the chosen file (based on current file location); following
    the root path, `QJRT` discovers all Java files under root, and saves file name
    and location into an `ArrayList`. Next, `QJRT` parses each file by `ASTParser`
    to locate current file’s all subclasses. The final step is to add the selected
    method to the subclasses, while removing the same methods from superclass.


    6. After refactoring is complete, `QJRT` pops up a question window that gives
    the developer the option to view the modified and the original files with the
    default notepad program.


    7. In addition, on `QJRT`’s right side panel, it presents the changes that have
    been made to the current class. The bottom panel clears the selected method, and
    updates the location of affected super- and subclasses. An example of Push Down
    Refactoring is presented in Chapter 8 under heading “Sample Input and Validation
    of Push Down Method.”


    8. `PDM` requires user intervention: User is required to review and manually delete
    the unwanted method in subclasses.


    ### 5.10 Push Down Field


    `PDF` is the opposite of `PUF`. The definition of `PDF` is to move a field from
    a superclass to a subclass. Similar to Push Down Method, the motivation is the
    field in the superclass does not make sense in some subclasses at all; in other
    words, the specific field makes sense only in one of the subclasses. Thus, there
    is no reason to keep the field in the superclass. The benefit is less coding on
    superclass, and a highly cohesive method of design on subclass.


    ### 5.11 Structure


    ![](Images/image00089.jpeg)


    FIGURE 7. Push Down Field [1].


    ### 5.12 Refactoring Steps


    1. User clicks Select button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.


    2. Developer chooses Push Down Field refactoring from the drop-down menu bar under
    Refactoring menu.


    3. Upon choosing the refactoring method, `QJRT` displays `PDF` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `PDF` refactoring. And lastly,
    it sets the Refactoring button visible for user to click on.


    4. Developer then clicks Refactoring button, and `QJRT` takes the selected field
    from the bottom panel and uses `ASTParser` to parse it. The first step is `PDF`
    verifies if the selected code is a valid field, which should have basic field
    signature, includes following key elements: modifiers, type, field name, expression.
    `PDF` extracts value of those elements from `AST`, and temporarily save in memory.
    The following step is to construct a new field with these key elements: this new
    field will be saved temporarily and be extracted to subclasses. Then, `QJRT` finds
    the root of the chosen file (based on current file location); following the root
    path, `QJRT` discovers all Java files under root, and saves file name and location
    into an `ArrayList`. Next, `QJRT` parses each file by `ASTParser` to locate current
    file’s all subclasses. The final step is to add the new constructed field to the
    all subclasses, while removing the same field from the superclass.


    5. After refactoring is complete. `QJRT` pops up a question window giving the
    developer the option to view the modified and the original files with the default
    notepad program.


    6. In addition, on the right panel of the `QJRT`, it reflects the changes that
    have been made to the current selected class. The bottom panel now shows the locations
    of the original and the modified affected class fields. An example of Push Down
    Field refactoring is presented in Chapter 8 under the heading “Sample Input and
    Validation of Push Down Field.”


    7. `PDF` requires user intervention: user is required to review and manually delete
    the unwanted field in subclasses.


    ![](Images/image00090.jpeg)CHAPTER 6


    # QUICK JAVA REFACTORING TOOL


    Quick Java Refactoring Tool (`QJRT`) is a portable program performed on individual
    refactoring. Each refactoring section is divided into two parts. First is user
    interactions, and the other is refactoring.


    The user interaction section includes opening the file, selecting the code, and
    choosing the refactoring method. The refactoring section includes two modules,
    one is parsing and data collection, and the other is re-constructing and generating
    new code. The first module is parsing the selected code, collecting related data
    and saving the information to memory; this module also handles all the errors.
    Second module is to reconstruct the source code. This section runs automatically
    at the background once it’s been kicked off, and it will save new code to memory
    or a new file.


    ### 6.1 User Interaction


    `QJRT` is designed with minimal user input to refactor Java code. The GUI (graphical
    user interface) includes a menu bar, a tool bar, and three blank text areas: two
    text areas are on the top side by side and another area on the bottom alone. The
    tool bar resides between the top and bottom text areas. A message label is also
    included within the tool bar for showing which refactoring is in selected, and
    it is only visible while the refactoring is in process.


    ![](Images/image00091.jpeg)


    FIGURE 10. Initial screen of `QJRT`.


    Initial screen of `QJRT` contains of a menu bar and a tool bar. The menu bar contains
    two menu items, one is File and another is Refactoring Method. Tool bar has select,
    cancel, refactoring, and exit buttons. The Refactoring button is disabled initially,
    and it will be available upon a refactoring method is chosen by user.


    ![](Images/image00092.jpeg)


    FIGURE 11. Refactoring Method menu options in `QJRT`.


    The Figure 11 shows the refactoring methods implemented in `QJRT`. Upon user selecting
    a refactoring method from this menu, it passes the parameters to `QJRT` to prepare
    the current refactoring.


    ![](Images/image00093.jpeg)


    FIGURE 12. Initial text area for original code viewer in `QJRT`.


    `QJRT` uses window’s open file dialogue box to let developer choose Java file
    to open. The upper left text area is used for displaying Java code contained in
    the file (shown in figure 12). The code is taken in by `QJRT` as string in local
    memory. Developer then highlights the targeted code. Upon clicking Select button,
    the highlighted code is copied to the bottom text area (shown in figure 13). After
    choosing the correct refactoring method, the refactoring button is enabled (shown
    in figure 11) and user then clicks this button to initialize refactoring process.
    At this point, the user interaction is finished.


    ![](Images/image00094.jpeg)


    FIGURE 13. Highlighting and selecting targeted code to bottom text area.


    ### 6.2 Automatic Refactoring - Data Collection


    The first module is for parsing the selected code. `QJRT` uses eclipse’s `AST`
    (Abstract Syntax Tree) [5] as a library plugin, and uses `AST` to parse the code.
    The `ASTParser` is used for every refactoring. In detail, if the selected source
    code is a method or a field, `K_COMPILATION_UNIT` is used to parse; if the selected
    source code is ifstatement/ s, `K_STATEMENTS` is used to parse. Furthermore, to
    validate a selected method, `K_CLASS_BODY_DECLARATIONS` is used. While parsing
    the source code, `QJRT` also collects the necessary information on the parsed
    codes.

