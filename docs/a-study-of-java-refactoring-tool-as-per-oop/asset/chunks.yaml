    conditional expression once again can be replaced by a single method to express
    the purpose of the conditionals more clearly.


    ### 7.2 Sample Input and Validation of Consolidate Duplicate Conditional Fragments


    Secondly, to test Consolidate Duplicate Conditional Fragments refactoring, a sample
