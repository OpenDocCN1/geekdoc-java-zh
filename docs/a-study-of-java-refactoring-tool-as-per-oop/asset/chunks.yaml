    图 31. 应用 CDCF 重构后的输出。


    ![FIG15.PNG](img/image00120.jpeg)


    图 32. 应用重构后，名称已手动更改。


    ### 总结


    合并重复条件片段（Consolidate Duplicate Conditional Fragments）用于消除重复代码。它使得源代码更加整洁。除了条件外，源代码的结构没有变化。此外，在
    `if`-语句体内部，逻辑更加直观且代码量更少，这意味着出错的概率更低。最后，这种重构使得条件更加清晰。


    ### 7.3 用守卫语句替换嵌套条件的示例输入与验证


    最后，在“简化条件表达式”的“用守卫语句替换嵌套条件”（Replace Nested Conditional with Guard Clauses）下，使用的示例代码是一个名为“RNCGC
    simpleTest”的单一 Java 类。该类有一个 `main` 方法用于打印 double 值，该 double 值由几个嵌套的 `if`-语句决定，每个语句都由一个不同的布尔值决定。`RNCGC`
    的目的是将嵌套条件简化为一组平铺显示的结果列表。


    将更改示例源代码中三个布尔变量的值以彻底测试重构。结果是，程序将显示四种不同的输入和输出。第一组输入发生在三个布尔值中的任意一个为 true 时，这将返回对应的
    double 值。第二组输入发生在所有布尔值都为 false 时，将返回默认值。


    ![FIG16.PNG](img/image00121.jpeg)


