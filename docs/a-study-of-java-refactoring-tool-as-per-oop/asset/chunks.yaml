    5. 用户点击“重构”（Refactoring）按钮，这就是所有精彩机制发生的地方。QJRT 从底部面板获取选定的源代码，并使用抽象语法树 (`AST`）对其进行解析。具体而言，`AST`
    会检查选定的代码是否为多个 `if` 语句。如果它们都是有效的 `if` 语句，`AST` 将检查每一个 `if` 语句，并由 `CCE` 比较 `then`
    语句和 `else` 语句。如果所有的 `then` 语句相同；同时所有的 `else` 语句也相同；`CCE` 将提取所有表达式并构建一个新的 `if`
    语句。


    6. 在后台完成上述步骤后，新的改进后的源代码将显示在 `QJRT` 的右侧面板上。原始代码被重构后的红色代码取代，并用黄色高亮以显示差异。未更改的代码仍保持黑色。带有原始代码的左侧面板保持不变。


    7. 现在，开发者可以选择保存重构后的代码。他/她只需点击 `File` 菜单，选择“另存为...”选项将其保存到新文件或覆盖旧文件。尽管如此，如果有疑问，开发者可以简单地取消或退出整个过程。这种重构的示例在第
    8 章标题“合并重复条件表达式的示例输入与验证”中给出。


    ## 4.4 合并重复的条件片段


    `CCE` 重构通过合并条件表达式提高了源代码的可读性，并使其更加直观。此外，根据 `Folwer` 的观点，`CCE` 的重要性体现在两个方面：“首先，通过展示你确实进行单次检查（并将其他检查逻辑或在一起），使得检查更加清晰。这种顺序的效果相同，但它传达的是执行了一系列独立检查，这些检查恰被放在在一起。第二个原因……是它通常能为‘提取方法’做准备’
    [1]。”同样，`CDCF` 重构方法消除了遍布 `if` 语句体内的相同代码片段。换言之，`CDCF` 提取相同的代码片段以便独立存在。这提高了源代码的可读性，并在逻辑上明确了哪些部分发生了变化，哪些部分没有。


    ## 4.5 结构


    ![FIG 2.PNG](img/image00083.jpeg)


    图 2。合并重复的条件片段 [1]。


    ## 4.6 重构步骤


    1. 按照惯例，开发者从 `File` 菜单打开文件，并从选择文件中突出想要重构的代码部分。

    2. 用户点击 `Select` 按钮，`QJRT` 将选中代码提取到底部面板进行单独分析。

    3. 开发者从 `Refactoring` 菜单下的下拉菜单栏选择“合并重复的条件片段”重构。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `CDCF` 重构，以展示并确认正在执行哪种重构。它还将参数传递给 `QJRT` 以准备 `CDCF`
    重构。最后，它设置 `Refactoring` 按钮可见供用户点击。

    5. 开发者点击 `Refactoring` 按钮，`QJRT` 从底部面板获取选定的源代码并使用 `AST` 进行解析。`AST` 验证选中代码是否为有效的
    `if` 语句，并验证 `thenStatement` 和 `elseStatement` 中是否存在相同的片段。下一步是 `QJRT` 确定相同片段的位置。如果位置匹配（例如，两者都在语句块的开头；或者都在语句块的结尾），则
    `CDCF` 提取相同片段，并根据片段的位置将其放在 `if` 语句的开头或结尾。

    6. 在后台完成重构后，新的改进后的源代码将显示在 `QJRT` 的右侧面板上。原始代码被重构后的红色代码取代，并用黄色高亮以显示差异。未更改的代码仍保持黑色。带有原始代码的左侧面板保持不变。

    7. 开发者现在可以选择将重构后的代码保存到新文件，或覆盖旧文件。他/她只需点击 `File` 菜单，并在下拉菜单中选择“另存为...”选项保存文件或替换旧文件。尽管如此，如果有疑问，开发者在覆盖原始文件的步骤之前可以简单地取消或退出整个过程。这种重构的示例在第
    8 章标题“合并重复条件片段的示例输入与验证”中给出。


    ## 4.7 用守卫语句替换嵌套条件


    `RNCGC` 用于为读者重新排列排每个 `if` 语句中的一个普通条件，同时消除嵌套条件。此操作将使代码看起来更整洁，并使代码逻辑易于理解。许多软件开发者（包括我在内）在决定结果时打算使用许多嵌套的
    `if` 语句。使用嵌套 `if` 语句的方法并非非法，但它确实可以被视为设计不足，或者说设计得非常糟糕。“如果方法只有一个出口会更清晰，就使用单出口；否则不要使用。”
    [1]


    ## 4.8 结构


    ![FIG 3.PNG](img/image00084.jpeg)


    图 3。用守卫语句替换嵌套条件 [1]。


    ## 4.9 重构步骤


    1. 开发者从 `File` 菜单打开文件，并从选择文件中突出想要重构的代码部分。

    2. 用户点击 `Select` 按钮，`QJRT` 将选中代码提取到底部面板进行单独分析。

    3. 开发者从 `Refactoring` 菜单下的下拉菜单栏选择“用守卫语句替换嵌套条件”重构。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `RNCGC` 重构，以展示并确认正在执行哪种重构。它还将参数传递给 `QJRT` 以准备 `RNCGC`
    重构。最后，它设置 `Refactoring` 按钮可见供用户点击。

    5. 开发者点击 `Refactoring` 按钮，`QJRT` 从底部面板获取选定的源代码并使用 `AST` 进行解析。具体而言，`AST` 检查选中代码是否为有效的
    `if` 语句。然后从顶层 `if` 语句到内层 `if` 语句，`RNCGC` 分出一个由表达式和 `then` 语句构建的新 `if` 语句。

    6. 在后台完成重构后，新的改进后的源代码将显示在 `QJRT` 的右侧面板上。原始代码被重构后的红色代码取代，并用黄色高亮以显示差异。其他未更改的代码仍保持黑色。带有原始代码的左侧面板保持不变。

    7. 开发者现在可以选择将重构后的代码保存到新文件，或覆盖旧文件。他/她只需点击 `File` 并在下拉菜单中选择“另存为...”选项保存文件或替换旧文件。尽管如此，如果有疑问，开发者在覆盖原始文件的步骤之前可以简单地取消或退出整个过程。这种重构的示例在第
    8 章标题“守卫语句替换嵌套条件的示例输入与验证”中给出。


