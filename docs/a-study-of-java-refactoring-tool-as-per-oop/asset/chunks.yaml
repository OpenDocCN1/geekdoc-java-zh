    # CHAPTER 1


    ![](Images/image00078.jpeg) INTRODUCTION


    ## 1.1. Product Perspective


    Software maintenance is statistically proven to be expensive and difficult. There
    is also a sense that software maintenance is inevit able due to the fact that
    new technologies, such as new hardware are constantly being introduced; changes
    in law and regulations happen regularly business entities are re-organized frequently;
    and lastly, customers’ requirements are constantly changing and evolving. According
    to Martin Fowler [1], “Refactoring is the process of changing a software system
    in such a way that it does not alter the external behavior of the code yet improves
    its internal structure.” Additionally, in an article titled “Refactoring-Way for
    Software Maintenance”, Arora et al. said that through the practice of refactoring,
    one can accomplish re-modularization of the software, and make the software system
    easier to read, to understand, to extend, and to maintain [2]. Many of the refactorings
    described are common sense programming techniques, such as move field; some refactorings
    are common software design practice, such as encapsulate field; some refactorings
    improve readability and maintainability, such as reverse conditional. As a result,
    refactoring is all about improving sofware design and structure.


    A poorly designed or engineered system will cause problems for others. Source
    code decays over time; particularly, in the year 2000, the infamous Y2K bug drew
    worldwide fear and attention for software maintenance.


    This thesis describes nine algorithms which implement nine refactorings. A prototype
    tool named Quick Refactoring Tool (`QJRT`) was created to validate the algorithms.


    ## 1.2. Motivation


    Software is difficult and costly to change. Large software projects face challenges
    such as larger development teams, greater scope of software functionality, and
    competition-driven schedules. These issues often lead to decreased cohesion and
    increased coupling between classes. The source code grows more difficult to maintain,
    and the addition of new features becomes increasingly complex. Delegation of programming
    tasks among programmers is made more difficult by the large number of classes
    and dependencies between them.


    Programming tasks performed by more than one person are also more likely to suffer
    from inconsistencies in coding style, information-hiding methodology, and naming,
    which compromises the conceptual integrity of the software product. The intrinsic
    difficulty of good object-oriented design in complex systems is emphasized by
    the growing popularity of design patterns, which can impart experience and design
    knowledge to software designers.


    Opdyke proposes that refactoring existing class hierarchies can improve their
    maintainability and reusability [Opdyke 92, Opdyke & Johnson 90]. A refactoring
    activity changes the organization of an oriented program without changing its
    behavior. It includes changes such as encapsulating public references to member
    data in a new method or creating abstract superclasses from shared behavior in
    similar classes. Refactorings can be performed proactively by a programmer to
    ease upcoming changes or they can be performed as part of a comprehensive reengineering
    effort. Opdyke’s automated refactoring tool allows a programmer to guide the automatic
    refactoring of specific portions of a class hierarchy.


    A key problem in refactoring an object-oriented program is first identifying the
    structural problems with the current design and then exploring the possible solutions.
    For example, consider a class that consists primarily of public data members.
    As the application evolves and becomes increasingly complex, a better design for
    such a class might be to make the member data private and encapsulate the computations
    on its data members in methods of that class. To get a sense of what the methods
    of the class should be, a software designer needs to view all the references to
    the data members and categorize them according to how they are manipulated. However,
    the uses of the data members are widely distributed throughout the program and
    interspersed with computations that are unrelated to the class in question, thereby
    complicating the analysis.

