    每次重构都使用并需要不同的算法。每个重构都是独立的文件（类），用于解析代码、根据代码收集数据并将所有必要信息存储在本地内存中。所有步骤都从 `ASTParser`
    开始获取信息，然后传递给 `QJRT` 将其存储在局部变量中。相似的类具有具有相同相同的局部变量。例如，表 1 中定义的所有字段均被“字段上移（Pull Up
    Field）”和“字段下推（Push Down Field）”使用。


    ### 表 1 字段上移与字段下推重构表


    ![FIG4.PNG](img/image00095.jpeg)


    表 1 列出了字段上移和字段下推重构中使用的字段。由于松耦合，这两种重构方法是独立的文件，主要数据收集过程相似，但有一个字段（`supclass`）被专门用于字段上移重构。如文件名、字段名、起始行号、根路径等所有信息都单独存储在内存中。`File`、`str`、`line`
    来自用户输入，所有其他信息均从 AST 获取。此外，在重构代码时，会使用字段签名信息（`m_modifier`、`m_type`、`m_name` 和 `m_exp`）、`supclass`
    和 `childclass`。


    ### 表 2 方法上移与方法下推重构表


    ![fig 5.PNG](img/image00096.jpeg)


    表 2 列出了方法上移和方法下推重构中使用的字段。与表 1 类似，由于松耦合，两种重构方法是独立的文件，主要数据收集相似，但有一个字段（`supclass`）被专门用于方法上移重构。文件名、字段名、起始行号、根路径等所有信息都单独存储在本地内存中。`File`、`str`、`line`
    来自用户输入，所有其他信息均从 AST 获取。此外，在重构代码时，会使用方法签名信息（`m_name`、`m_retype`、`m_block`、`m_modifier`、`m_params`
    和 `m_throw`）、`supclass` 和 `childclass`。


    ### 表 3 反转条件与高级反转条件重构表


    ![FIG 6.PNG](img/image00097.jpeg)


    表 3 列出了反转条件和高级反转条件重构中使用的字段。两种重构方法是独立的文件，因为反转条件仅由 Fowler 和 Murphy [1, 5] 引入，他们对该主题的进阶版本进行了进一步讨论。主要数据收集相似，但在分析表达式时，高级反转条件考虑了更多条件，它们是：`PostfixExpression`、`ParenthesizedExpression`、`InfixExpression`
    和 `InstanceofExpression`。两种重构中均使用一个一个用字段，即 `PrefixExpression`。在高级反转条件的用法中，它验证表达式前面的主要操作符；而在反转条件中，它只验证表达式前面的
    NOT（`!`）操作符。`Str` 来自用户输入（选定的 `ifStatement`），所有其他信息均从 AST 获取。此外，在重构代码时，会使用 `ifStatement`
    的签名信息（`st1` - `thenStatement`、`st2` - `elseStatement`、`ifexp`）。


    ### 表 4 合并重复条件片段重构表


    ![FIG7.PNG](img/image00098.jpeg)


    表 4 列出了合并重复条件片段重构中使用的字段。所有信息都单独存储在本地内存中。`Str` 来自用户输入（选定的 `ifStatements`），所有其他信息均从
    AST 获取。此外，在重构代码时，会使用 `ifStatement` 的签名信息（`ifexp`、`ls1`、`ls2`）、`frontlist` 和 `endlist`。


    ### 表 5 合并条件表达式重构表


    ![FIG8.PNG](img/image00099.jpeg)


    表 5 列出了合并条件表达式重构中使用的字段。所有信息都单独存储在本地内存中。`Str` 来自用户输入，所有其他信息均从 AST 获取。此外，在重构代码时，会使用
    `ifStatement` 的签名信息（`s01`、`s02`、`exp_list`、`s1`、`s2`）。


    ### 表 6 用守卫语句替换嵌套条件重构表


    ![FIG9.PNG](img/image00100.jpeg)


    表 6 列出了用守卫语句替换嵌套条件重构中使用的字段。所有信息都单独存储在本地内存中。`Str` 来自用户输入，所有其他信息均从 AST 获取。此外，在重构代码时，会使用
    `ifStatement` 的签名信息（`s1`、`s2`、`ifexp`）、`new_exp`、`new_if`、`new_rt`。


    ## 6.3 自动重构 – 概述


    重构的第一步是验证用户输入。第二步是检查每次重构的条件，第三步是修改并显示重构后的代码，最后，如果需要，`QJRT` 会显示受影响的文件位置。步骤程序如图
    14 所示。


    ![FIG10.PNG](img/image00101.jpeg)


    图 14 QJRT 中的重构步骤。


    在步骤 2 中，条件是基于每次单独重构的要求。如果满足要求，则进入步骤 3；否则显示错误消息并结束。步骤 4 是重构过程中影响多个文件的额外步骤。例如，字段上移重构至少涉及三个不同的文件，包括用户选择的（子类）和程序获取的（父类）。在步骤
    4 中，`QJRT` 将底部文本区域显示文件位置。


    图 15 显示文件位置的文本区域。


    （文本继续）


    ## 第 7 章 结果


    本章描述了 `QJRT` 的验证情况。本论文包含了 Fowler [1] 描述的三个不同重构领域（简化条件；泛化；杂项）。每个领域至少有一组测试进行演示。整个验证过程通过
    `QJRT` 的截图呈现；某些步骤包含部分截图，而某些步骤包含 UML 图以帮助说明源代码。最后，截图显示了在 `QJRT` 中进行的更改，并显示了重构前后的程序输出（外部行为）是一致的。


    ### 7.1 合并条件表达式的输入与验证


