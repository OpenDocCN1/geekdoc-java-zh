    的返回值是相同的。在应用重构后，新的且改进的 `if-condition` 将替换旧的 `if-condition`。重构前后的输出保持不变。


    #### 重构前的输出


    ![Images/image00105.jpeg)


    图 17 应用 CCE 重构前的输出


