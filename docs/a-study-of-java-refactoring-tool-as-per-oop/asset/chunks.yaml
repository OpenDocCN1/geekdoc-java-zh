    expressions for better readability, while not changing the meaning of the expressions,
    after all, that is what refactoring is for.


    CCE would be used when running multiple different if-statements’ tests, no matter
    what the tests are, the results from the different if-statements would return
    the same. CDCF is applied to remove any duplicated codes within if-statement’s
    body. RNCGC is used while an if-statement has nested conditionals, usually more
    than three nested level, where the codes are hard to read. Based on developer’s
    preference, one or more of these three techniques can be applied to make the code
    more readable and tricky logic more understandable.


    4.1   Consolidate Conditional Expression


    The CCE basically involves combining all of the conditional expressions into one
    conditional expression. It results in less coding and better understanding. In
    addition, this step of refactoring makes the code highly cohesive.


    4.2    Structure


    ![FIG 1.PNG](Images/image00082.jpeg)


    FIGURE 1\. Consolidate Conditional Expression [1].


    4.3    Refactoring Steps


    1\. Developer opens the file from the File menu; the file’s entire source code
    will be loaded in the left panel of the QJRT, and highlights the portion of the
    code s/he wants to refactor.


    2\. User clicks Select button, and QJRT extracts the selected code to the bottom
    panel for individual analysis.


    3\. Developer chooses the Consolidate Conditional Expression refactoring from
    the drop-down menu bar under Refactoring menu.


    4\. Upon choosing the refactoring method, QJRT displays CCE refactoring on a message
    label to present and confirm which refactoring is being executed. It also passes
    the parameter to QJRT to prepare CCE refactoring. And lastly, it sets the Refactoring
    button visible for user to click on.'
