    ![](Images/image00190.jpeg)


    # CHAPTER 8


    ## CONCLUSION AND FUTURE ENHANCEMENTS


    A total of nine refactorings have been implemented within this thesis. Seven of
    these refactoring have been published in Fowler’s book [1] and the other two have
    been mentioned on Fowler’s website [4]. `Eclipse AST` is used in `QJRT` for parsing
    the source code. Minimal user interaction is required when using `QJRT`.


    The stepwise refactoring implementation gives users a straightforward view. The
    original and refactored source codes are side by side in most cases, and if default
    `notepad++` is not installed on the system, or users are not using windows based
    system, `QJRT` gives users the source files’ location in absolute path.


    Eliminating inputs from keyboards helps reducing human error; at last, refactoring
    is part of software maintenance, not to introduce another human error is essential.


    ## FUTURE WORKS


    `QJRT` requires minimum user interface in order to refactor. The User Interface
    (UI) is very plain sighted; developer doesn’t need to spend much time to be able
    to use it fluently. `QJRT`’s portability allows it to be downloaded and any code
    to be refactored on the fly. In addition, the program does clean up the source
    code for better readability, and improves the source code’s structure. More importantly,
    the output is not impacted. In this thesis, I have simplified one refactoring:
    replace nested conditional with guard clause, it only deals in if-else conditional
    statement level, but truly it can be expanded to method call level.


    `QJRT` is implemented only one refactoring at a time; however, some complicated
    refactorings requires multiple other refactorings work together to achieve the
    goal. `QJRT` is not implemented with automatic detection of bad smells, nor design
    patterns. This thesis can be extended to do so.


