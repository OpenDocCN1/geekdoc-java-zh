  trans: '

    Opdyke 的重构工具提供了一种执行自动语义保持重构的机制，但它无法帮助程序员决定执行哪些重构来改进设计。


    使用文本编辑器对引用进行分类是困难的，因为每个引用仅在它使用的上下文中显示，而不是与该类的其他引用一起。解决这一问题的典型方案是使用如 Unix `grep`
    这样的搜索工具，它可以只提取与指定模式匹配的程序行。


    尽管这在移除无关代码方面很有效，但它无法通过类型匹配数据引用，只能通过名称匹配。此外，它不会对匹配的引用进行任何进一步的分类，也不会建议哪些引用的计算应该放在类内部，而哪些应该保留在类外部。设计可视化工具（如类层次结构图或图形对象模型）可以揭示系统当前设计的高层级方面，但无法使用此类视图来检查源代码的潜在结构以建议适当的重设计。最后，在规划复杂的重设计时，理想情况下要有支持来记录设计者的许多发现、想法和重构计划。


    ### 1.3. 目标


    随着面向对象软件的修改，其结构往往会退化。潜在的大量类以及它们之间大量的依赖可能会使维护用对象语言编写的程序所需的分析和规划变得复杂。


    重构软件以改进其设计可以降低未来更改的成本。为了简化软件重构任务，我们描述了星型图（star diagram）概念在 Java 程序中的应用。星型图可视化为程序员提供了项目源代码的交叉视图，通过快速评估复杂的类层次结构和复杂的类间关系来简化软件维护任务。记录待执行的详细重构任务，并辅以正在修改的源代码的相关星型图部分，为程序员提供了工作的可视化，有助于软件重构的回顾和执行。


    ### 1.4. 论文结构


    - 第 1 章代表并讨论了研究引言和整体研究。

    - 第 2 章阐述了重构工具及其在 Quick Java Refactoring tool 中的重要性。

    - 第 3 章代表了文献综述及其提取的相关内容。

    - 第 4 章阐述了 `QJRT` 的条件表达式简化。

    - 第 5 章代表了对泛化的处理。

    - 第 6 章详细介绍了 `QJRT`。

    - 第 7 章讨论了研究结果和结论。


    ## 第 2 章重构


    ### 2.1 引言


    重构是软件维护中重要的一步。重构的第一个原因是大型软件通常由很多人开发。因此，即使项目开始时有一个完美的 `UML`（统一建模语言）类图作为蓝图，不同的人对编写源代码通常有不同的想法。此外，软件也会老化，需要维护。正如
    Pippin 在一个在线帖子中所说：“我感觉到这是我写过的最好的代码之一。它比我昨天写的代码更好，比我一年前写的代码更好” [3]。


    软件开发的经典方法是瀑布模型。让我们假设瀑布模型在某些项目中运行良好。然而，经过一段时间后，新技术被引入了，系统必须跟上以使用新技术（例如增强安全性）。在这种情况下，重构就大显用场了。[重构]是以一种方式改变软件系统，使其在不改变代码外部行为的情况下改进其内部结构。[1]”


    重构分为四个步骤：检测问题、分析问题、寻找解决方案并相应地更改源代码 [4]。为了检测问题，Fowler [1] 使用 `Bad Smells`（代码异味）来指代可以改进的源代码。为了分析问题，必须提出一系列问题，例如：为什么要改变某些东西？有什么好处？是否有风险？为了找到问题的解决方案，目标是消除潜在漏洞；然而结果保持不变。最后，必须修改源代码以实现目标。


    Fowler 在他的书中讨论了总共 72 种重构，后来在他的网站上提供了更多。这 72 种重构被分为七个领域：组合方法；在对象之间移动特征；组织数据；简化条件表达式；简化方法调用；处理泛化；大型重构
    [1]。


    ### 2.2. 工作范围


    本论文的的工作范围局限于描述实现 9 种重构的算法，并在过程中开发了一个工具（`QJRT`）。这 9 种重构分为以下三个领域：


    1. **简化条件表达式**：合并条件表达式 (`CCE`) 重构将一系列条件测试合并为一个单一条件表达式并将其提取。合并重复条件片段 (`CDCF`) 重构将相同的代码片段移动到表达式之外。用守护语句替换嵌套条件
    (`RNCGC`) 重构使用守护语句处理特殊情况，并使正常执行路径更加清晰。


    2. **处理泛化**：上移方法 (`PUM`) 重构将子类中具有相同结果的特定方法移动到父类。上移字段 (`PUF`) 重构将子类中特定的相同字段移动到父类。下移方法
    (`PDM`) 重构将特定方法从父类移动到该方法有意义的唯一子类。下移字段 (`PDF`) 重构将特定字段从父类移动到仅使用该字段的子类。


    3. **其他/杂**：反转条件 (`RC`) 重构将否定条件变为正向。反转条件提前 (`RCA`) 重构改变条件的相反含义。所有这些内容都由 Fowler
    [1] 描述，后来 Bill Murphy [5] 等人的工作被添加到了 Fowler 的重构网站上 [1, 5]。


