    in most cases. Therefore, this refactoring makes source code easier to understand
    and better readability. Moreover, this refactoring restricts changing from positive
    to negative conditional.


    # 7.9 Sample Input and Validation of Reverse Conditional Advance


    To test Reverse Conditional Advance refactoring, a source code with varied ifelse
    statements is used. The conditional expressions are: parenthesized, `Instanceof`,
    and infix expressions. In addition, the infix expression includes less, greater,
    less and equals, greater and equals, equals, not equals, and others. Each if-else
    is selected to refactor individually.


