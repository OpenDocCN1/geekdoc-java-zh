    The definition of Pull Up Method is to move the same function source code from
    two subclasses to the superclass. Similar to Pull Up Field, the motivation of
    this refactoring method is to eliminate duplicate source code in all subclasses.
    Furthermore, the benefit of this refactoring method is that developer can reduce
    the risk of changing only one method while not changing the others. It is easy
    to miss the duplicate method at subclass level, especially when the subclasses
    are developed by different people. The refactoring method is generally used when
    a method needs to be used by multiple implemented subclasses.


    ## 5.2 Structure


    ![](Images/image00086.jpeg)


    FIGURE 4. Pull Up Method [1]


    ## 5.3 Refactoring Steps


    1. Developer chooses a subclass from the `File` menu, and highlights the complete
    method source code s/he wants to pull up to the superclass.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses `Pull Up Method` refactoring from the drop-down menu bar
    under `Refactoring` menu.

    4. Upon choosing the refactoring method, `QJRT` displays `PUM` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `PUM` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

    5. Developer clicks `Refactoring` button, and `QJRT` takes the selected source
    code from the bottom panel and uses `ASTParser` to parse it. The first step is
    to check if the selected methods’ class has a superclass, which is done through
    analysis of the `AST`. Then, `PUM` verifies if the selected code is a valid method,
    which should have basic method signature, includes following key elements: modifiers,
    return type, method name, parameter list in parenthesis, an exception list, and
    method body. `PUM` extracts value of those elements from `AST`, and temporarily
    save in memory. Then, `QJRT` finds the root of the chosen file (based on current
    file location); following the root path, `QJRT` discovers all Java files under
    root, and saves file name and location into an `Array List`. Next, `QJRT` parses
    each file by `AST Parser` to locate current file’s superclass, and all related
    subclasses. The final step is to add the selected method to the superclass, while
    removing the same methods from all the subclasses.

    6. After refactoring is complete, `QJRT` pops up a question window that gives
    the developer the option to view the modified files and the original files with
    the default notepad program.

    7. In addition, on the right panel of the `QJRT`, it reflects the changes that
    have been made to the current class. The bottom panel shows all the location of
    the affected super- and subclasses. An example of this refactoring is presented
    in chapter 8 under heading “Sample Input and Validation of Pull Up Method.”


    ## 5.4 Pull Up Field


    The definition of `PUF` is to move a field from any subclasses to the superclass.
    Mostly, the pull up field refactoring won’t be applied when the source code was
    written by an individual, but as Fowler[1] mentioned, pull up field is used when
    the subclasses are built separately by different developers, or the subclasses
    are combined through refactoring. From combining the classes to a package, subclasses
    mostly do have duplicate features, and having identical fields is just one of
    the duplicate features.


    The benefit of `PUF` eliminates the duplicate data declaration; moreover, while
    this action moves the field behavior from subclasses to superclass, similar to
    pull up method, it reduces the risk of changing only one field while not changing
    the others.


    ## 5.5 Structure


    ![](Images/image00087.jpeg)


    FIGURE 5. Pull Up Field [1].


    ## 5.6 Refactoring Steps


    1. Developer chooses a subclass that contains the field s/he wants to move to
    the super class from the `File` menu, and then highlights the individual field.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses `Pull Up Field` method from the drop-down menu bar under
    `Refactoring` menu.

    4. Upon choosing the refactoring method, `QJRT` displays `PUF` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `PUF` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

    5. Developer then clicks `Refactoring` button, and `QJRT` takes the selected field
    from the bottom panel and uses `ASTParser` to parse it. The first step is to check
    if the selected field’s class has a superclass, which is done through analysis
    of the `AST`. Then, `PUF` verifies if the selected code is a valid field, which
    should have basic field signature, includes following key elements: modifiers,
    type, field name, expression. `PUF` extracts value of those elements from `AST`,
    and temporarily save in memory. The following step is to construct a new field
    with these key elements, one extra step `PUF` will do is to change “private” to
    “protected” in modifier: this new field will be saved temporarily and be extracted
    to superclass. Then, `QJRT` finds the root of the chosen file (based on current
    file location); following the root path, `QJRT` discovers all Java files under
    root, and saves file name and location into an `ArrayList`. Next, `QJRT` parses
    each file by `ASTParser` to locate current file’s superclass, and all related
    subclasses. The final step is to add the new constructed field to the superclass,
    while removing the same field from all the subclasses.

    6. After refactoring is complete, `QJRT` pops up a question window that gives
    the developer the option to view the modified and original files with the default
    notepad program.

    7. In addition, on the right panel of the `QJRT`, it reflects the changes that
    have been made to the current class. The bottom panel shows the locations of the
    original and modified files. An example of this refactoring is presented in Chapter
    8 under heading “Sample Input and Validation of Pull Up Field.”


    ## 5.7 Push Down Method


    PDM is the opposite of `PUM`. The definition is to move the same function source
    code from a superclass to a specific subclass. Similar to Push Down Field, the
    motivation is to eliminate source code in a superclass, since only one subclass
    implements it; in other words, the method only makes sense in the specific subclass,
    yet it is declared in the superclass. Furthermore, the Push Down Method makes
    the subclass highly cohesive, and in general makes the entire software more well
    designed.


    ## 5.8 Structure


    ![](Images/image00088.jpeg)


    FIGURE 6. Push Down Method [1].


    ## 5.9 Refactoring Steps


    1. Developer chooses a class from the `File` menu, and highlights the complete
    method source code s/he wants to push down to the subclass.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses `Push Down Method` from the drop-down menu bar under `Refactoring`
    menu.

    4. Upon choosing the refactoring method, `QJRT` displays `PDM` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `PDM` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

