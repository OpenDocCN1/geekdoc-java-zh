    ![](img/image00190.jpeg)


    # 第 8 章


    ## 结论与未来改进


    本论文总共实现了九种重构。其中七种重构已发表在 Fowler 的书中 [1] 中，另外两类在 Fowler 的网站 [4] 上被提及。`QJRT` 使用 `Eclipse
    AST` 来解析源代码。使用 `QJRT` 时只需要少量的人为交互。


    逐步重构的实现为用户提供了直观的视图。在大多数情况下，原始和重构后的源代码并排显示；如果系统没有安装默认的 `notepad++` 或用户未使用基于 Windows
    的系统，`QJRT` 会为用户提供源文件的绝对路径。消除键盘输入有助于减少人为错误；最后，重构是软件维护的一部分，不引入另一个人为错误至关重要。


    ## 未来工作


    `QJRT` 需要极少的用户界面来进行重构。用户界面（UI）非常直观；开发者不需要花费大量时间就能流畅地使用。`QJRT` 的可移植性允许其下载并实时重构任何代码。此外，程序会清理源代码以提高可读性，并改进源代码的结构。更重要的是，输出不受影响。在本文论文中，我简化了一种重构：将嵌套条件替换为守卫语句（guard
    clause），它仅处理 if-else 条件语句层级，但实际上它可以扩展到方法调用层级。


    `QJRT` 每次只实现一种重构；然而，某些复杂的重构需要多个其他重构共同工作来实现目标。


