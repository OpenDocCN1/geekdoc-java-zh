    \ 8 章“下推字段的示例输入与验证”标题下给出。\n\n7. `PDF` 需要用户干预：用户需要检查并手动删除子类中不需要的字段。\n\n![](img/image00090.jpeg)第\
    \ 6 章\n\n# 快速 Java 重构工具 QUICK JAVA REFACTORING TOOL\n\n 快速 Java 重构工具 (`QJRT`)\
    \ 是一个执行单独重构的可移植程序。每个重构部分都分为两部分：首先是用户交互，另一个是重构。\n\n用户交互部分包括打开文件、选择代码和选择重构方法。重构部分包含两个模块，一个是解析和数据收集，另一个是重构和生成新代码。第一个模块是解析选定的代码，收集相关数据并将信息保存到内存；该模块还处理所有错误。第二个模块是重建源代码。该部分一旦启动就会在后台自动运行，并将新代码保存到内存或新文件中。\n\
    \n### 6.1 用户交互\n\n`QJRT` 的设计目标是使用最少的用户输入来重构 Java 代码。GUI（图形用户界面）包括菜单栏、工具栏和三个空白文本区域：两个文本区域位于顶部并排排列，另一个区域单独位于底部。工具栏位于顶部和底部文本区域之间。工具栏内还包含一个消息标签，用于显示选定了哪种重构，它仅在重构进行期间可见。\n\
    \n![](img/image00091.jpeg)\n\n图 10. `QJRT` 的初始界面。\n\n`QJRT` 的初始界面包含菜单栏和工具栏。菜单栏包含两个项目，一个是文件（File），另一个是重构方法（Refactoring\
    \ Method）。工具栏有选择（select）、取消（cancel）、重构（refactoring）和退出（exit）按钮。重构按钮初始为禁用，用户选择重构方法后将可用。\n\
    \n![](img/image0092.jpeg)\n\n图 11. `QJRT` 中的重构方法选项。\n\n图 11 显示了 `QJRT` 实现的重构方法。用户从此菜单选择重构方法后，会将参数传递给\
    \ `QJRT` 以准备当前重构。\n\n![](img/image0093.jpeg)\n\n图 12. `QJRT` 中的原始代码查看器区域。\n\n\
    `QJRT` 使用窗口文件对话框让开发人员选择要打开的 Java 文件。左上方文本区域用于显示文件中包含的 Java 代码（所示）。代码作为字符串被 `QJRT`\
    \ 获取到本地内存中。开发人员随后高亮目标代码。点击选择按钮后，高亮的代码被复制到底部面板（所示）。选择正确的重构方法后，重构按钮变为可用（所示），用户随后点击此按钮以初始化重构过程。此时，用户交互完成。\n\
    \n![](img/image0094.jpeg)\n\n图 13. 高亮并选择代码到底部面板。\n\n### 6.2 自动重构 - 数据收集\n\n第一个模块用于解析选定的代码。`QJRT`\
