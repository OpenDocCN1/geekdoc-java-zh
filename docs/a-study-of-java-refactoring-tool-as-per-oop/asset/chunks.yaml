  trans: '


    上提方法（Pull Up Method）的定义是将相同的函数源代码从两个子类移动到父类中。这与上提字段（Pull Up Field）类似，这种重构方法的动机是消除所有子类中重复的源代码。此外，这种重构方法的用处是开发者可以降低只修改某一个方法而未修改其他方法的风险。在子类级别，很容易漏掉重复的方法，特别是当这些子类由不同的人开发时。当一个方法需要被多个实现的子类使用时，通常会使用这种重构方法。


    ## 5.2 结构


    ![](img/image00086.jpeg)


    图 4. 上提方法 [1]


    ## 5.3 重构步骤


    1. 开发者从 `File` 菜单中选择一个子类，并高亮其想要上提到父类的完整方法源代码。

    2. 用户点击 `Select` 按钮，`QJRT` 将选定的代码提取到底部面板进行单独分析。

    3. 开发者在 `Refactoring` 菜单下的下拉菜单中选择 `Pull Up Method` 重构。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `PUM` 重构，以展示并确认正在执行哪种重构。它还将参数传递给 `QJRT` 以准备 `PUM` 重构。最后，它设置
    `Refactoring` 按钮可见供用户点击。

    5. 开发者点击 `Refactoring` 按钮，`QJRT` 从底部面板获取选定的源代码并使用 `ASTParser` 对其进行解析。第一步是检查选定方法的类是否有父类，这是通过分析
    `AST` 完成的。然后，`PUM` 验证选定的代码是否为有效方法，它应该具有基本的方法签名，包括以下关键元素：修饰符、返回值、方法名、括号中的参数列表、异常列表和方法体。`PUM`
    从 `AST` 中提取这些元素的值并临时保存在内存中。然后，`QJRT` 找到所选文件的根（根据当前文件位置）；沿着根路径，`QJRT` 发现根目录下的所有
    Java 文件，并将文件名和位置保存到 `Array List` 中。接下来，`QJRT` 通过 `AST Parser` 解析每个文件，以定位当前文件的父类以及所有相关的子类。最后一步是将选定的方法添加到父类中，同时从所有子类中删除相同的方法。

    6. 重构完成后，`QJRT` 弹出一个窗口，允许开发者使用默认记事本程序查看修改后的文件和原始文件。

    7. 此外，在 `QJRT` 的右面板中反映了对当前类所做的更改。底部面板显示所有受影响的父类和子类的位置。这种重构的示例在第 8 章“上提方法的示例输入与验证”标题下给出。


    ## 5.4 上提字段


    `PUF` 的定义是将字段从任何子类移动到父类中。大多数情况下，当源代码是由个人编写时，不会应用上提字段重构，但正如 Fowler [1] 所提到的，当子类由不同的开发者分别构建，或者子类通过重构被组合在一起时，就会使用上提字段。从类合并到包，子类通常具有重复的功能，而拥有相同的字段只是这些重复功能之一。


    `PUF` 的用处是消除了重复的数据声明；此外，虽然此操作将字段行为从子类移动到父类（类似于上提方法），它降低了只修改某一个字段而未修改其他方法的风险。


    ## 5.5 结构


    ![](img/image00087.jpeg)


    图 5. 上提字段 [1]。


    ## 5.6 重构步骤


    1. 开发者从 `File` 菜单中选择包含其想要移动到父类字段的子类，然后高亮该字段。

    2. 用户点击 `Select` 按钮，`QJRT` 将选定的代码提取到底部面板进行单独分析。

    3. 开发者在 `Refactoring` 菜单下的下拉菜单中选择 `Pull Up Field` 方法。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `PUF` 重构，以展示并确认正在执行哪种重构。它还将参数传递给 `QJRT` 以准备 `PUF` 重构。最后，它设置
    `Refactoring` 按钮可见供用户点击。

    5. 开发者随后点击 `Refactoring` 按钮，`QJRT` 从底部面板获取选定的字段并使用 `ASTParser` 对其进行解析。第一步是检查选定字段的类是否有父类，这是通过分析
    `AST` 完成的。然后，`PUF` 验证选定的代码是否为有效字段，它应该具有基本的字段签名，包括以下关键元素：修饰符、类型、字段名、表达式。`PUF` 从
    `AST` 中提取这些元素的值并临时保存在内存中。下一步是用这些关键元素构建新字段，`PUF` 额外执行的一步是将修饰符中的“private”改为“protected”：此新字段将被临时保存并提取到父类。然后，`QJRT`
    找到所选文件的根（根据当前文件位置）；沿着根路径，`QJRT` 发现根目录下的所有 Java 文件，并将文件名和位置保存到 `ArrayList`。接下来，`QJRT`
    通过 `ASTParser` 解析每个文件以定位当前文件的父类以及所有相关的子类。最后一步是将构建的新字段添加到父类中，同时从所有子类中删除该字段。

    6. 重构完成后，`QJRT` 弹出一个窗口，允许开发者使用默认记事本程序查看修改后的文件和原始文件。

    7. 此外，在 `QJRT` 的右面板中反映了对当前类所做的更改。底部面板显示原始文件和修改文件的位置。这种重构的示例在第 8 章“上提方法的示例输入与验证”标题下给出。


    ## 5.7 下推方法


    PDM 是 `PUM` 的相反。其定义是将相同的函数源代码从父类移动到特定的子类。与下推字段（Push Down Field）类似，动机是消除父类中的源代码，因为只有一个子类实现了它；换句话说，该方法在特定子类中有意义，但在父类中声明。此外，下推方法使子类具有高内聚性，并通常使整个软件设计更加合理。


    ## 5.8 结构


    ![](img/image00088.jpeg)


    图 6. 下推方法 [1]。


    ## 5.9 重构步骤


    1. 开发者从 `File` 菜单中选择一个类，并高亮其想要下推到子类的完整方法源代码。

    2. 用户点击 `Select` 按钮，`QJRT` 将选定的代码提取到底部面板进行单独分析。

    3. 开发者在 `Refactoring` 菜单下的下拉菜单中选择 `Push Down Method`。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `PDM` 重构，以展示并确认正在执行哪种重构。它还将参数传递给 `QJRT` 以准备 `PDM` 重构。最后，它设置
    `Refactoring` 按钮可见供用户点击。


