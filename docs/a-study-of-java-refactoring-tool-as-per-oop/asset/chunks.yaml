    \ 重构。最后，它设置重构按钮可见供用户点击。\n\n4. 开发人员随后点击重构按钮，`QJRT` 从底部面板获取选定的字段并使用 `ASTParser`\
    \ 对其进行解析。第一步是 `PDF` 验证所选代码是否为有效字段，该字段应具有基础的字段签名，包括以下关键元素：修饰符、类型、字段名、表达式。`PDF`\
    \ 从 `AST` 中提取这些元素的值并临时保存在内存中。下一步是用这些关键元素构建一个新字段：这个新字段将被临时保存并提取到子类中。然后，`QJRT` 找到所选文件的根目录（基于当前文件位置）；沿着根路径，`QJRT`\
    \ 发现根目录下的所有 Java 文件，并将文件名和位置保存到 `ArrayList` 中。接下来，`QJRT` 通过 `ASTParser` 解析每个文件，以定位当前文件所有的子类。最后是将新构建的字段添加到所有子类中，同时从父类中移除相同字段。\n\
