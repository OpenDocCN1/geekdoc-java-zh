    Opdyke’s refactoring tool provides a mechanism for performing automatic meaning-preserving
    restructurings, but it does not help the programmer decide which restructurings
    to perform to improve the design.


    Categorization of references with a text editor is difficult because each reference
    is shown only in the context of its use, rather than with the other references
    to the class. A typical solution to this problem is to use a searching tool like
    Unix `grep`, which extracts only those program lines that match a specified pattern.


    Although successful in removing unrelated code, it is not capable of matching
    data references by type, only by name. Also, it does not perform any further categorization
    of the matched references or suggest which computations on the references belong
    inside the class and which should remain outside. A design visualization like
    a class hierarchy diagram or a graphical object model can reveal the high-level
    aspects of the system’s current design, but it is not possible to use such a view
    to examine the source code’s latent structure to suggest an appropriate redesign.
    Finally, in planning a complex redesign, it is desirable to have support for recording
    the designer’s many discoveries, thoughts, and refactoring plans.


    ### 1.3. Objective


    As object-oriented software is modified its structure tends to degrade. The potentially
    large number of classes and the large number of dependencies between them can
    complicate the analysis and planning needed to maintain a program written in an
    object-oriented language.


    Restructuring software to improve its design can lower the cost of future changes.
    To ease the task of software restructuring, we describe the application of the
    star diagram concept to Java programs. The star diagram visualization affords
    programmers a cross-cutting view of the project source code that can simplify
    software maintenance tasks by allowing the programmer to rapidly assess complicated
    class hierarchies and complex class interrelationships. The recording of detailed
    refactoring tasks to be performed, accompanied by relevant portions of star diagrams
    for the source code undergoing modification, provides the programmer with a visualization
    of the work that assists in recall and execution of the software restructuring.


    ### 1.4. Organization of Dissertation


    - Chapter 1 represents & discusses the introduction of the research and the overall
    research.

    - Chapter 2 states the refactoring tool & it’s important in Quick Java Refactoring
    tool.

    - Chapter 3 represents the literature survey & its extracted related content.

    - Chapter 4 states the simplifying conditional expression of `QJRT`.

    - Chapter 5 represents the dealing with generalization.

    - Chapter 6 states `QJRT` in detail.

    - Chapter 7 discusses the results and conclusion of the research.


    ## CHAPTER 2 REFACTORINGS


    ### 2.1 Introduction


    Refactoring is an important step in software maintenance. The first reason to
    refactor is that large software usually is developed by many people. Thus, different
    people usually have different thoughts on how to write the source code even if
    the project starts with a perfect `UML` (Unified Modeling Language) class diagram
    as its blueprint. In addition, software does age, and needs to be taken care of.
    As Pippin says in an online post, “I get the sense that tells me it is some of
    the best code I’ve written. It’s better than the code I wrote yesterday, and it’s
    better than the code I wrote a year ago” [3].


    The classic approach to software development is the waterfall model. Let us assume
    the waterfall model worked great on some projects. However, after a period of
    time, new technology has been introduced, and the system must keep up in order
    to use the new technology (e.g., to enhance security). Refactoring comes in handy
    under such situations. “[It] is the process of changing a software system in such
    a way that it doesn’t alter the external behavior of the code yet improves its
    internal structure. [1]”


    Refactoring is divided into four procedures: detect a problem, analyze the problem,
    find a solution, and change the source code accordingly [4]. To detect a problem,
    Fowler [1] used `Bad Smells` to refer to source code that can be improved. In
    order to analyze a problem, a series of questions must be asked, such as: Why
    is it necessary to change something? What are the benefits? Are there any risks
    To find a solution to the problem, the goal is eliminating potential bugs; yet,
    the outcome stays the same. Lastly, the source code must be modified to archive
    the goal.


    Fowler discussed a total 72 refactorings in his book, and later provided a few
    more on his website [5]. The 72 refactorings are catalogued into seven areas:
    (1) composing methods; (2) moving features between objects; (3) organizing data;
    (4) simplifying conditional expressions; (5) making method calls simpler; (6)
    dealing with generalization; (7) big refactorings [1].


    ### 2.2. Scope of Work


    The scope of this thesis is limited to describing nine algorithms for implementing
    nine refactorings and developing a tool (`QJRT`) in the process. Those nine refactorings
    are categorized under three areas as follows:


    1. **Simplifying Conditional Expressions**: Consolidate Conditional Expression
    (`CCE`) refactoring combines a sequence of conditional tests into a single conditional
    expression and extract it. Consolidate Duplicate Conditional Fragments (`CDCF`)
    refactoring moves the same fragment of code outside of the expression. Replace
    Nested Conditional with Guard Clauses (`RNCGC`) refactoring uses guard clauses
    for special cases and make clear the normal path of execution.


    2. **Dealing with Generalization**: Pull Up Method (`PUM`) refactoring moves the
    specific methods with identical results from subclasses to the superclass. Pull
    Up Field (`PUF`) refactoring moves the specific identical field from subclasses
    to the superclass. Push Down Method (`PDM`) refactoring moves a specific method
    from the superclass to the only subclass in which the method makes sense. Push
    Down Field (`PDF`) refactoring moves a specific field from superclass to a subclass,
    in which the field is only used.


    3. **Others / Miscellaneous**: Reverse Conditional (`RC`) refactoring makes negative
    conditional positive. Reverse Conditional Advance (`RCA`) refactoring changes
    the conditional to the opposite meaning. All of them are described by Fowler [1],
    and later on Bill Murphy [5] and others’ works were added to Fowler’s refactoring
    website [1, 5].


