    \n### 5.10 下推字段（Push Down Field）\n\n`PDF` 是 `PUF` 的相反操作。`PDF` 的定义是将一个字段从父类移动到子类。与下推方法类似，其动机是父类中的字段在某些子类中完全没有意义；换句话说，该特定字段仅在其中一个子类中才有意义。因此，没有理由在父类中保留该字段。这样做的好处是减少了父类中的代码量，并在子类中实现了高内聚的设计级方法。\n\
    \n### 5.11 结构\n\n![](img/image00089.jpeg)\n\n图 7. 下推字段 [1]。\n\n### 5.12 重构步骤\n\
