    ![](img/image00078.jpeg) 引言


    ## 1.1. 产品视角


    从统计学上证明，软件维护是昂贵且困难的。人们也感觉到软件维护是不可避免的，因为新技术的（如新硬件）不断被引入；法律法规经常发生变化；业务实体频繁重组；最后，客户的需求在不断变化和演变。根据
    Martin Fowler [1] 的观点，“重构是改变软件系统的过程，在不改变代码外部行为的同时改进其内部结构。”此外，在一篇题为《重构——软件维护的方法》的文章中，Arora
    等人指出，通过重构实践，可以实现软件的重模块化，并使软件系统更容易阅读、理解、扩展和维护 [2]。描述的许多重构是常识性的编程技术，例如移动字段；某些重构是常见的软件设计实践，例如封装字段；某些重构改进了可读性和可维护性，例如反转条件。因此，重构的核心在于改进软件的设计和结构。


    设计或工程实现糟糕的系统会给他人带来问题。源代码随着时间的推移而退化；特别是在 2000 年，臭名昭彰的千年虫引起了全球对软件维护的关注。本文描述了实现九种重构的算法。并创建一个名为快速重构工具
    (`QJRT`) 的原型工具来验证这些算法。


    ## 1.2. 动机


    软件的更改既困难又昂贵。大型软件项目面临着挑战，如开发团队规模扩大、功能范围增加以及竞争驱动的进度。这些问题通常导致内聚性下降和类之间耦合性的增加。源代码变得越来越难以维护，新功能的添加变得日益复杂。由于类的数量以及它们之间的依赖关系，在程序员之间分配编程任务变得更加困难。


    由多人执行的编程任务也更容易在编码风格、信息隐藏方法和命名上出现不一致，这损害了软件产品的概念完整性。复杂系统中良好的面向对象设计的内在困难性通过设计模式的日益流行而凸显，设计模式可以向软件设计者传递经验和设计知识。


    Opdyke 提出重构现有的类层次可以提高其可维护性和重用性 [Opdyke 92, Opdyke & Johnson 90]。重构活动在不改变程序行为的情况下改变其组织。它包括将对成员数据的公共引用封装在新方法中，或从相似类的共享行为创建抽象超类。程序员可以主动进行重构以应对未来的变化，也可以作为全面重构工作的一部分进行。Opdyke
    的自动重构工具允许程序员引导类层次中特定部分的自动重构。


    重构面向对象程序的一个关键问题是首先识别当前设计中的结构问题，然后探索可能的解决方案。例如，考虑一个主要由公共数据成员组成的类。随着应用程序的演变变得越来越复杂，此类类的更好设计可能是将成员数据私有化，并将对其数据的计算封装在该类的方法中。为了了解类应该有哪些方法，软件设计者需要查看对数据成员的所有引用，并根据其操作方式进行分类。然而，数据成员的使用分布在整个程序中，并与该类相关的计算交织在一起，从而增加了分析的难度。


