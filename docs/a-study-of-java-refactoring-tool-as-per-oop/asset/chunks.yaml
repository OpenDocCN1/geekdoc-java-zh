    探索系统的演变可以为开发者的特征提供宝贵的见解，并加强我们对系统动力学的理解。虽然我们通常期望面向对象的系统随着时间的增长而增长（增加 `classes`数量），但并不那么明显的是特定类特征演变中的模式。在本文中，我们利用通过两个工具提取的数据，并参考之前对继承深度演变的研究，探索了四个
    `Java` 开源系统的实证特征。我们以增量（每个版本的变化）而非每个版本的绝对类大小，在类“方法”（`methods`）提供的更细粒度的水平上进行演变分析。更细粒度的演变可以识别出在类范围内无法实现的趋势；因此，这种方法代表了对演变力量调查的“白盒化”视角。我们的分析还允许与之前项研究中由自动化工具提取的一组低级重构进行直接比较。对方法趋势的审查进一步源于这样一个事实：绝大多数重构并不是应用在类级别，而是应用在方法级别。


    [2] Kozo Okano ; Satoshi Harauchi ; Toshifusa Sekizawa ; Shinpei Ogata ; Shin
    Nakashima "Equivalence Checking of Java Methods: Toward Ensuring IoT Dependability”.
    IEEE 2017 Proceedings.


    IoT 设备富含软件，`Java` 有时被选作开发编程语言。尽管 `Java` 在构建大型高级程序方面效率极高，但应用程序或用户定义的 `Java` 类必须对安全和安全性问题负责。特别是两个基本方法
    `hashCode` 和 `equals` 在安全和安全性保障中起着关键作用。一些确保这两个方法正确性的现有研究依赖于静态分析，而这些分析仅限于无循环的程序。本文基于方法或函数的等效检查，为这一重要问题提出了一种新的解决方案。该方法利用了开源工具软件分析工作台（`SAW`）。该方法在进行程序重构时对于减少回归测试成本也很有用。


    [3] Gleison Brito ; Andre Hora ; Marco Tulio Valente ; Romain Robbes "Do Developers
    Deprecate APIs with Replacement Messages? A Large-Scale Analysis on Java Systems”.
    IEEE 2016 Proceedings.


    与任何其他软件系统一样，框架和库随着时间的演变，它们的 API 也是如此。因此，客户端系统应该更新以从改进的 API 中受益。为了便于这项任务并保持向后兼容性，API
    元素应该始终带有的替换消息进行弃用。然而，在实践中有证据表明 API 元素通常在没有此类消息的情况下被弃用。在本文中我们研究了关于采用弃用消息的相关问题。我们的目标有两个：衡量弃用消息的使用，并调查是否需要工具来推荐此类消息。


    [4] Jiachen Yang ; Keisuke Hotta ; Yoshiki Higo ; Shinji Kusumoto"Towards purity-guided
    refactoring in Java”. IEEE 2015 Proceedings.


    重构源代码需要保留某种程度的语义行为，这些行为很难通过 IDE 进行检查。因此，IDE 通常在应用重构之前检查语法前提条件，这些条件通常比检查语义行为更具限制性。另一方面，源代码中存在纯函数，它们没有可观测的副作用，其语义行为更容易被检查。在这项研究中，我们提出了纯性引导的重构，对可以静态检测的纯函数应用诸如
    `memoization` 等高级重构。


    [5] Hitesh Sajnani ; Vaibhav Saini ; Cristina V. Lopes"A Comparative Study of
    Bug Patterns in Java Cloned and Non-cloned Code”. IEEE 2014 Proceedings.


    通过复制粘贴进行代码克隆是软件工程中的常见做法。传统上，这种做法被认为是有害的，是某些重要设计抽象被忽略的症状。因此，许多以前的研究建议了有助于发现、删除和重构克隆的方法。然而，并没有许多研究实证调查代码克隆与代码质量之间的关系。在本文中，我们对
    31 个开源 `Java` 项目（1.7 MSLOC）进行了实证研究，探索代码克隆与 `Find Bugs`报告的一组缺陷模式之间的关系。我们发现：(i)
    克隆代码中的缺陷密度比其他代码低 3.7 倍；(ii) 与代码克隆相关的缺陷 66%与编码风格和实践问题有关（这是 `Find Bugs` 分类中问题最小的两个），而非克隆代码的这一数字为
    49%； 且 (iii) 克隆代码中 75% 的缺陷模式在没有任何任何更改的情况下重复，而 25% 仅存在一个克隆中。这些结果表明，当使用 `Find Bugs`
    检测缺陷模式时，克隆代码与其他代码相比存在正向差异：克隆代码的缺陷模式明显更少，且问题更小。


