- fmt: '

    Exploring the evolution of systems can provide valuable insights into the traits
    of developers and inform our understanding of system dynamics. While we usually
    expect an object-oriented system to grow (in `classes`) as it ages, what are not
    so obvious are patterns in the evolution of specific class features. In this paper,
    we explore empirical traits of four `Java` open-source systems using data extracted
    by two tools and informed by a previous study of inheritance depth evolution.
    We analyse evolution at a lower level of granularity given by the ‘methods’ of
    a class on an incremental (change per version) basis rather than absolute class
    size per version. Evolution at a finer-grain can identify trends not possible
    on a class-wide basis; the approach thus represents a ‘white-box’ view of the
    investigation of evolutionary forces. Our analysis also allowed direct comparison
    with a set of low-level refactorings extracted by an automated tool in a previous
    study. Scrutiny of trends in methods was further motivated by the fact that the
    vast majority of refactorings apply not at the class level but at the method level.


    [2] Kozo Okano ; Satoshi Harauchi ; Toshifusa Sekizawa ; Shinpei Ogata ; Shin
    Nakashima "Equivalence Checking of Java Methods: Toward Ensuring IoT Dependability”.
    IEEE 2017 Proceedings.


    IoT devices are software-rich and `Java` is sometimes chosen as the developing
    programming language. Although `Java` is highly productive in constructing large
    advanced programs, application or user-defined `Java` classes must be responsible
    for safety and security issues. In particular, two fundamental methods `hashCode`
    and `equals` play key roles in safety and security assurance. Some existing studies
    for ensuring the correctness of these two methods rely on static analysis, which
    are limited to loop-free programs only. This paper proposes a new solution to
    this important problem, based on equivalence checking of methods or functions.
    The proposed approach makes use of software analysis workbench (`SAW`), an open
    source tool. The approach is also useful in reducing the cost of regression testing
    when program refactoring is conducted.


    [3] Gleison Brito ; Andre Hora ; Marco Tulio Valente ; Romain Robbes "Do Developers
    Deprecate APIs with Replacement Messages? A Large-Scale Analysis on Java Systems”.
    IEEE 2016 Proceedings.


    As any other software system, frameworks and libraries evolve over time, and so
    their APIs. Consequently, client systems should be updated to benefit from improved
    APIs. To facilitate this task and preserve backward compatibility, API elements
    should always be deprecated with clear replacement messages. However, in practice,
    there are evidences that API elements are usually deprecated without such messages.
    In this paper, we study a set of questions regarding the adoption of deprecation
    messages. Our goal is twofold: to measure the usage of deprecation messages and
    to investigate whether a tool is needed to recommend such messages.


    [4] Jiachen Yang ; Keisuke Hotta ; Yoshiki Higo ; Shinji Kusumoto"Towards purity-guided
    refactoring in Java”. IEEE 2015 Proceedings.


    Refactoring source code requires preserving a certain level of semantic behaviors,
    which are difficult to be checked by IDEs. Therefore, IDEs generally check syntactic
    pre-conditions before applying refactoring, which are often too restrictive than
    checking semantic behaviors. On the other hand, there are pure functions in the
    source code that do not have observable side-effects, of which semantic behaviors
    are more easily to be checked. In this research, we propose purity-guided refactoring,
    which applies high-level refactoring such as `memoization` on pure functions that
    can be detected statically.


    [5] Hitesh Sajnani ; Vaibhav Saini ; Cristina V. Lopes"A Comparative Study of
    Bug Patterns in Java Cloned and Non-cloned Code”. IEEE 2014 Proceedings.


    Code cloning via copy-and-paste is a common practice in software engineering.
    Traditionally, this practice has been considered harmful, and a symptom that some
    important design abstraction is being ignored. As such, many previous studies
    suggest approaches to facilitate the discovery, removal, and refactoring of clones.
    However, not many studies exist that empirically investigate the relationship
    of code clones with code quality. In this paper, we conduct an empirical study
    of 31 open source `Java` projects (1.7 MSLOC) to explore the relationship between
    code clones and a set of bug patterns reported by `Find Bugs`. We found that:
    (i) the defect density in cloned code is 3.7 times less than that of the rest
    of the code, (ii) 66% of the bug patterns associated with code clones are related
    to issues in coding style and practice, the two least problematic of the `Find
    Bugs` categories, while that number is 49% for non-cloned code, and (iii) 75%
    of the bug patterns in cloned code are duplicated without any changes, while 25%
    are only present in one of the clones. These results show that, when using `Find
    Bugs` to detect bug patterns, there is a positive differentiation of cloned code
    with respect to the rest of the code: the cloned code has considerably less, and
    less problematic, bug patterns.


    ![](Images/image00081.jpeg)


    # CHAPTER 4: SIMPLIFYING CONDITIONAL EXPRESSIONS


    This section describes the algorithm for applying refactorings that simplify conditional
    expressions. The refactorings included in this section are `Consolidate Conditional
    Expression` (`CCE`), `Consolidate Duplicate Conditional Fragments` (`CDCF`), and
    `Replace Nested Conditional with Guard Clauses` (`RNCGC`).


    As Martin Fowler[1] pointed out in his book, the conditional expressions have
    their own ways of getting logically tricky. The goal is to change the conditional
    expressions for better readability, while not changing the meaning of the expressions,
    after all, that is what refactoring is for.


    `CCE` would be used when running multiple different `if-statements`’ tests, no
    matter what the tests are, the results from the different `if-statements` would
    return the same. `CDCF` is applied to remove any duplicated codes within `if-statement`’
    body. `RNCGC` is used while an `if-statement` has nested conditionals, usually
    more than three nested level, where the codes are hard to read. Based on developer’s
    preference, one or more of these three techniques can be applied to make the code
    more readable and tricky logic more understandable.


    ## 4.1 Consolidate Conditional Expression


    The `CCE` basically involves combining all of the conditional expressions into
    one conditional expression. It results in less coding and better understanding.
    In addition, this step of refactoring makes the code highly cohesive.


    ## 4.2 Structure


    ![FIG 1.PNG](Images/image00082.jpeg)


    FIGURE 1. Consolidate Conditional Expression [1].


    ## 4.3 Refactoring Steps


    1. Developer opens the file from the `File` menu; the file’s entire source code
    will be loaded in the left panel of the `QJRT`, and highlights the portion of
    the code s/he wants to refactor.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses the `Consolidate Conditional Expression` refactoring from
    the drop-down menu bar under `Refactoring` menu.

    4. Upon choosing the refactoring method, `QJRT` displays `CCE` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `CCE` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

