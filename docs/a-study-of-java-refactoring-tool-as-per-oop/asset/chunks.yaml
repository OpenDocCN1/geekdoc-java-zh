    ### 总结


    用守卫语句替换嵌套条件（RNCGC）用于以直观的方式对条件逻辑进行排序。现代语言中“单一入口出口”的规则并不有用。清晰性比任何事情都重要 [1]。当所有条件相等时，没有理由让某一个条件比其他条件更。此外，条件的不平衡权重可能会误导读者。应用
    RNCGC 重构后，整个源代码的结构保持不变，但条件结构已改变，以平等对待不同的条件。结果是 `if`-语句的逻辑变得更加清晰。最后，RNCGC 等地展示了源代码的条件。


