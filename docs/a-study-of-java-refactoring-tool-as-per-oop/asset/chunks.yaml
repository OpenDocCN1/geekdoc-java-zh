    The above figure on the right side panel shows the refactored source code. It
    must be saved to a new file named “RNCGCtestDone.java,” and accordingly, the class
    name needs to be changed manually.(Images/image00131.jpeg)

    FIGURE 43. After applying refactoring’s Source Code with manually changed names.


    ![fig18.PNG](Images/image00132.jpeg)


    FIGURE 44. After applying refactoring’s Source Code with manually changed names
    (continuted).


    ### Output After Applying Refactoring


    ![](Images/image00133.jpeg)


    FIGURE 45. Output after applying RNCGC refactoring with default boolean = false.


    ### Summary


    Replace Nested Conditional with Guard Clauses (RNCGC) is used to sort the conditional
    logic in a straightforward manner. The modern languages rule of one entry with
    one exit point is not useful. Clarity is more important than anything [1]. When
    the conditions are all equal, there is no reason to weight one more than others.
    In addition, the unbalanced weighting of the condition might confuse reader. After
    applying RNCGC refactoring, the entire source code’s structure will stay the same,
    but conditional structures have changed to weight different conditions equally.
    As a result, the logic of the `if`-statement becomes clearer. In the end, RNCGC
    presents the source code’s conditional equivalently.


