    图 89。点击 RC 重构后。


    ## 总结


    条件反转用于使条件更有意义。开发者意图将条件反向排列，但实际上在大多数情况下，RC 的结果可能更好。因此，这种重构使源代码更容易理解，可读性更好。此外，这种重构限制了从正向条件到负向条件的更改。


    # 7.9 条件反转进阶示例输入与验证


    为了测试“条件反转进阶（Reverse Conditional Advance）”重构，使用了具有各种 ifelse 语句的源代码。条件表达式包括：带括号的、`Instanceof`
    和中间表达式。此外，中间表达式包括小于、大于、小于等于、大于等于、等于、不等于等。每个 if-else 语句都被单独选中进行重构。


