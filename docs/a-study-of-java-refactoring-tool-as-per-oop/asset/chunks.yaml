    # 第 4 章：简化条件表达式


    本节描述了应用简化条件表达式重构的算法。本节包含的重构包括`合并条件表达式`（`CCE`）、`合并重复条件片段`（`CDCF`）和`将嵌套条件替换为守护语句`（`RNCGC`）。


    正如 Martin Fowler [1] 在他的书中指出的，条件表达式有其变得逻辑复杂的方式。目标是改变条件表达式以提高可读性，同时不改变表达式的含义，毕竟，这正是重构的意义所在。


    `CCE` 用于运行多个不同的 `if-statements` 测试时，无论测试内容是什么，不同 `if-statements` 的结果都相同。`CDCF`
    用于删除 `if-statement` 体内的重复代码。`RNCGC` 用于 `if-statement` 具有嵌套条件（通常超过三层嵌套）、代码难以阅读的情况。根据开发者的偏好，可以应用这三种技术中的一种或多种，使代码更具可读性，逻辑更易于理解。


    ## 4.1 合并条件表达式


    `CCE` 基本上涉及将所有的条件表达式合并为一个条件表达式。它导致了更少的代码和理解。此外，这一重构步骤使代码具有高内聚。


    ## 4.2 结构


    ![FIG 1.PNG](img/image0082.jpeg)


    图 1. 合并条件表达式 [1]。


    ## 4.3 重构步骤


    1. 开发者从 `File` 菜单打开文件；文件的完整源代码将加载到 `QJRT` 左侧面板，并突出显示想要重构的代码。

    2. 用户点击 `Select` 按钮，`QJRT` 将选中代码提取到底部面板进行单独分析。

    3. 开发者从 `Refactoring` 菜单的下拉菜单栏选择`合并条件表达式`重构。

    4. 选择重构方法后，`QJRT` 在消息标签上显示 `CCE` 重构，以展示并确认正在执行的重构。它还会将参数传递给 `QJRT` 以准备 `CCE` 重构。最后，它设置
    `Refactoring` 按钮可见供用户点击。

