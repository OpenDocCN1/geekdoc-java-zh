    5. User clicks Refactoring button, and this is where all the wonderful mechanics
    happen. QJRT takes the selected source code from the bottom panel, uses Abstract
    Syntax Tree (`AST`) to parse it. In detail, `AST` checks if the selected source
    codes are multiple if-statements. If all of them are valid if-statements, then
    `AST` checks individual if-statement, and `CCE` compares then- and else- Statement.
    If all `then` Statements are same; meanwhile, all `else` Statements are same;
    `CCE` will retrieve all expressions and constructs a new if-statement.


    6. After the above step is completed in the background, the new and improved source
    code shows on the right panel of `QJRT`. The original source code is replaced
    with the refactored source code in the color red with highlights in yellow to
    show the difference. The unchanged source codes are still in black color. The
    left side panel with the original source codes remains the same.


    7. Now, the developer has the option of saving the refactored source code. S/he
    simply clicks `File` menu, chooses the option “save as ...” to save to a new file
    or to overwrite the old one. Nonetheless, if there are doubts, the developer can
    simply cancel or exit the whole process. An example of this refactoring is presented
    in Chapter 8 under heading “Sample Input and Validating of Consolidate Conditional
    Expression.


    ## 4.4 Consolidate Duplicate Conditional Fragments


    `CCE` refactoring improves the source code for better readability and makes it
    more straightforward by combining the conditional expressions. Moreover, according
    to `Folwer`, `CCE` is important for two reasons. “First, it makes the check clearer
    by showing that you are really making a single check that’s or’ing the other checks
    together. The sequence has the same effect, but it communicates carrying out a
    sequence of separate checks that just happen to be done together. The second reason
    [...] is that it often sets you up for Extract Method” [1]. Similarly, the `CDCF`
    refactoring method eliminates the same fragment code showing all over inside the
    body of the if-statement. In other words, `CDCF` extracts the same fragments of
    code out for individual standing. This improves source code for better readability,
    and clarifies logically what changes and what does not.


    ## 4.5 Structure


    ![FIG 2.PNG](Images/image00083.jpeg)


    FIGURE 2. Consolidate Duplicate Conditional Fragments [1].


    ## 4.6 Refactoring Steps


    1. As usual developer opens the file from the `File` menu, and highlights the
    portion of the code s/he wants to refactor from the chosen file.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses the `Consolidate Duplicate Conditional Fragments` refactoring
    from the drop-down menu bar under `Refactoring` menu.

    4. Upon choosing the refactoring method, `QJRT` displays `CDCF` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `CDCF` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

    5. Developer clicks `Refactoring` button, and `QJRT` takes the selected source
    code from the bottom panel and uses `AST` to parse it. `AST` verifies the selected
    code is valid if-statement, and also verifies there are any identical fragment
    in the `thenStatement` and `elseStatement`. Next step is `QJRT` determines the
    identical fragments’ position. If the position matches, for example, both of them
    are at the beginning of the statement block; or at the end of the statement block.
    Then, `CDCF` extracts the identical fragment out, and put it either in front or
    at the end of the if-statement according to the position of the fragment.

    6. After the refactorings are completed in the background, the new and improved
    source code shows on the right panel of `QJRT`. The original source code is replaced
    with the refactored source code in the color red with highlights in yellow to
    show the difference. The unchanged source codes are still in black color. The
    left side panel with the original source codes remains the same.

    7. Developer now has the option to save the refactored source code to a new file,
    or to overwrite the old one. S/he simply clicks `File` menu and from the drop-down
    menu, choose option “save as ...” to save the file or file the old one to replace.
    Nonetheless, if there are doubts, developer can simply cancel or exit the whole
    process before the step to overwrite the original file. An example of this refactoring
    is presented in Chapter 8 under the heading “Sample Input and Validation of Consolidate
    Duplicate Conditional Fragments.”


    ## 4.7 Replace Nested Conditional with Guard Clauses


    `RNCGC` is used to re-arrange one normal condition per if-statement to the readers
    while eliminating the nested conditional. This action will make the codes look
    clean, as well as make the code logic easy to understand. Many software developers,
    including myself, intend to use many nested if-statements when deciding an outcome
    of a result. The way of using the nest if-statements is not illegal, but it certainly
    can be treated as insufficient, or in other words, very poorly designed. “If the
    method is clearer with one exit point, use one exit point; otherwise don’t.” [1]


    ## 4.8 Structure


    ![FIG 3.PNG](Images/image00084.jpeg)


    FIGURE 3. Replace Nested Conditional with Guard Clauses [1].


    ## 4.9 Refactoring Steps


    1. Developer opens the file from the `File` menu, and highlights the portion of
    the code s/he wants to refactor from the chosen file.

    2. User clicks `Select` button, and `QJRT` extracts the selected code to the bottom
    panel for individual analysis.

    3. Developer chooses the `Replace Nested Conditional with Guard Clauses` refactoring
    from the drop-down menu bar under `Refactoring` menu.

    4. Upon choosing the refactoring method, `QJRT` displays `RNCGC` refactoring on
    a message label to present and confirm which refactoring is being executed. It
    also passes the parameter to `QJRT` to prepare `RNCGC` refactoring. And lastly,
    it sets the `Refactoring` button visible for user to click on.

    5. Developer clicks `Refactoring` button, and `QJRT` takes the selected source
    code from the bottom panel and uses `AST` to parse it. In detail, `AST` checks
    if the selected code is valid if-statement. Then from the top level if-statement
    down to inner level ifstatement, `RNCGC` spins off a new if-statement constructed
    with expression and then Statement.

    6. After the refactorings are completed in the background, the new and improved
    source code shows on the right panel of `QJRT`. The original source code is replaced
    with the refactored source code in the color red with highlights in yellow to
    show the difference. The other unchanged source codes are still in black color.
    The left side panel with the original source codes remains the same.

    7. Developer now has the option to save the refactored source code to a new file,
    or to overwrite the old one. S/he simply clicks `File` and from the drop-down
    menu, choose option “save as ...” to save the file or file the old one to replace.
    Nonetheless, if there are doubts, developer can simply cancel or exit the whole
    process before the step to overwrite the original file. An example of this refactoring
    is presented in Chapter 8 under heading “Sample Input and Validation of Replace
    Nested Conditional with Guard Clause.”

