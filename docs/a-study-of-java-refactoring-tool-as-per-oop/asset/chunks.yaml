    # 摘要


    面向对象编程 (OOP) 是一种当代流行的编程方法。`OOP` 提供了更好的灵活性，使源代码更加组织化和系统化，并允许一组开发人员轻松地协作。尽管如此，设计糟糕的系统不仅会违背使用
    `OOP` 编码的初衷，还会使软件变得难以维护。重构是改进现有代码的一种强大方法。它只改变源代码的结构而不改变其功能。手动重构大型系统不仅消耗大量的时间和金钱，而且极不准确。因此，在软件领域，带有部分自动化的快速且方便的重构被广泛讨论。


    本论文提出了用于 `JAVA` 源代码的即时运行九种重构的实现算法。这些重构算法以逐步的方式实现，即首先选择要重构的源码部分，然后选择正确的重构方法，最后通过程序化更改所选源码以实现重构。


