    # CHAPTER FOUR


    ![](images/00001.jpeg)


    “Bro?”


    Kwasi jolted from his blind contemplation of the contract on the table before
    him. “Yeah? What?”


    Kojo dragged his fingers through his thick, blond mohawk. “Look, man. This is
    starting to get ridiculous. So Afia showed up again. Big deal. Forget about her.
    She’s not worth it.”


    “I wasn’t thinking about her,” Kwasi denied with as much conviction in his voice
    as he could muster.


    Kojo’s light-colored eyes narrowed in mock scorn. “Yeah, right. You forgot you’re
    talking to the left hemisphere of your brain.”


    Kwasi’s mouth twitched in humor. “If you’re the left hemisphere of my brain then
    any kids I’m going to have are doomed.”


    A look passed between them. Then Kojo sighed. “Back to the matter at hand. Afia—”


    “Her name’s Gretchen now,” he corrected.


    “Gretchen? Whose idea was that?”


    “Who knows?” He shrugged. Quiet as kept, he preferred Gretchen. The name tasted
    well on his tongue. Referring to her as he’d once known her hurt too much. His
    instinct was to flinch every time he thought of her as Afia.


    “Regardless what her name is, forget about her.”


    If it were only that easy. The past two days carried the veil of her presence.
    She’d never stepped foot in his house, nor in his car, or any other place besides
    Java Cupid, but her essence lingered. She invaded his dreams at night. Sometimes
    in an erotic fantasy with no substance except the remembered taste of her flesh
    when they were children. At other intervals, she stood front and center of his
    nightmares, watching with her doll-like eyes as the tiger brandished those razor-sharp
    claws into his back.


    No matter the dream, he’d awakened drenched in sweat.


    “Can we just go over this contract? Don Bridges is meeting us tomorrow at Java
    Cupid.”


    Kwasi straightened and glanced once more at the black and white lines. He couldn’t
    focus on this right now. Don Bridges seemed like a straight arrow.


    “Look, I’m sure you’ve gone over this with a fine-toothed comb. I trust your judgement.”


    He had more important things to worry about. Things his brother would certainly
    object to.


    “No, bro.” Kojo squinted at him. “You’re not going to get out of this. You need
    to take this business more seriously.”


    “I do take it seriously. I started it, didn’t I? How serious is that?”


    “You started it but you don’t want to grow it. You’re content to let it stagnate
    and make just enough money to do, what? Nothing.”


    Kwasi opened his mouth to respond when Kojo pushed the wheeled chair from the
    desk and got up. “That’s always been your problem. You don’t want to go after
    anything. Private security is a huge industry. We can make a lot of money in this
    if we play our cards right.”


    “I know, I know,” Kwasi answered wearily. “You keep telling me.”


    “Well, maybe it bears repeating!” his twin huffed.


    The aggravation bristling his twin’s body made him sorrowful. “Kojo, we’ve talked
    about this a thousand times. Growing the business can cause more problems than
    what it’s worth. I don’t want this operation to take over my life. I don’t want
    to spend precious time chasing down contacts, looking for the next lucrative job.
    Life’s too short to spend it hustling for one gig or another.”


    Kojo shook his head. “I know how short life is. That’s why we have to make the
    most of what we have.”


    How could two brothers share the same face, the same skin, and the same trauma,
    and be so different? Perceiving the irritation his twin projected, Kwasi wondered
    if they would ever see eye to eye on anything. Their hellish childhood culminating
    with their escape from the village made them both acknowledge the brevity of life.


    For himself, life was something to savor, to taste and explore. For Kojo, it was
    something to be grasped with clenched hands. His twin attacked anything he wanted
    with tenacity. Although the business had been his idea, it was Kojo’s drive that
    made it successful.


    Kwasi couldn’t envision himself expending so much energy on a contract. In his
    mind, if someone needed their services, they would contact them. Should he be
    one of those high-powered executives chasing after gigs for mere money? Trying
    to stay ahead of the competition, steal clients, and keep the rat race going until
    he died?


    Should he do so when something, or someone, could take away the thing he cared
    about the most?


    Gretchen’s face lifted before his eyes.


    “Bro, are you listening to me?” Kojo screeched in incredulity.'
