    When she closed her eyes, she pictured him standing in the café with his smooth,
    pearly muscles and golden hair. Her mouth watered for a taste of his plump, grapefruit
    lips. Her body stirred at night with the insatiable craving to feel his long,
    broad fingers caress her like a bow.


    The guilt warred with her longings. Kojo’s fierce anger often shattered her recollections
    of their brief time together. Plus, Gertie’s own pain had her second guessing
    the wisdom of allowing `Kwasi` to step back into her life again.


    Weren’t they better apart?


    No! her heart shouted out in defiance to the cool logic of her brain.


    “You didn’t even know I was there,” Gertie’s agonized voice haunted her after
    they came back from Java Cupid. “You’ve always been able to sense me, and I, you.
    In the space of two days, he’s broken our bond.”


    “Our bond’s not broken, Gertie,” she tried to say.


    “Don’t lie to me, Gretchen,” Gertie had said with a sheen of tears in her eyes.
    “Please don’t.”


    “What about the Java Cupid?”


    Lonnie’s voice took her away from the painful sight of her sister’s tears to the
    eager gaze of her co-worker. Her heart skipped at beat at his suggestion.


    “Java Cupid?” Oh, how sweet the words tasted on her tongue. Like the Java Blend
    concoction she’d come to crave more each day she had gone without it.


    “Yeah!” Lonnie’s eyes lit up. “That’s a great idea. Maybe I can get a message
    on my cup this time.”


    Was there a chance `Kwasi` would be there? She’d missed him in the week that had
    gone by. Although her brain argued it was ridiculous to miss a man one thought
    was dead not too long ago.


    “Don’t go there anymore,” Gertie pleaded. She’d knelt down next to Gretchen. “He’ll
    come between us.”


    Gretchen sighed. She couldn’t disappoint her twin. Hours had passed before Gertie
    had sufficiently calmed down. The fright of losing their twin connection, the
    inexplicable bond of two souls sharing one heart, had put her in a high state
    of agitation.


    It was a special thing she had with her sister. No man was worth coming between
    them.


    But wasn’t what she once shared with `Kwasi` just as divine? Their own unique
    relationship, different from her twin bond but just as dear.


    Didn’t she owe it to him to recapture it?


    Didn’t she owe it to herself to refine it?


    Didn’t Gertie deserve her trust?


    “Ah, I’m sorry, Lonnie. I won’t be able to join you. I’ll take a rain check though.”


    It killed her to say those words, but she had to think of Gertie. Something was
    going on with her sister, something she was keeping to herself but Gretchen couldn’t
    pinpoint it. Her sister didn’t have a love life, preferring computers and local
    strong woman competitions to men. Lately though, she sensed a murkiness to her
    sister’s moods.


    What could be wrong?


    “Well, walk with me anyway. I parked in public parking today so I’m in the front.”
    Lonnie gestured for her to get up.


    “Sure.” She rose and stretched. “I need to get up anyway.”


    They traversed down the hall, making the appropriate turns more out of habit than
    needing to know the direction.


    Lonnie rattled his keys as they walked. “Find any leads on the tribe you were
    researching?”


    “Not yet. I’ve tracked down a professor at one of the universities. He’s well
    versed in the number of uncontacted tribes there. Perhaps he’ll be able to assist
    me.”


    “Would you go down there for first contact?”


    Gretchen shrugged. “I don’t know. Those kinds of situations are extremely complex
    and dangerous. Language barriers, cultural mystiques, and the fear of the unknown.
    It’s a powder keg waiting to explode.”


    “I definitely wouldn’t want to be on the wrong end of a spear during that.”


    They had attained the lobby. Gleaming marble floors reflected the sunlight spilling
    through the windows. The scuff of rubber soles along with the click-clack of heels
    filled the room, echoing off the walls. Guards attended the metal detectors at
    the front door while a herd of school children raced through the revolving doors
    with a flustered chaperone calling out, “Be quiet!”


    “It’s dangerous, for sure. But the rewards of integrating an isolated society
    into the modern world is crucial for the good of—”


    A stray glance toward the front door and her breath lodged in her throat.


    `Kwasi` stood on the other side of the visitor’s rope. Although too far away to
    tell, she felt his gaze on her as potently as a touch.


    Manna from heaven!


    “Excuse me, Lonnie,” she said without breaking her eye contact with `Kwasi`. “I’ve
    seen someone I know. I’m going to go say hi. Talk to you later.”


    Without another word or look at her co-worker, Gretchen crossed the wide expanse
    of the lobby. Each step drew her closer to the craving of her soul. Her eyes ate
    up `Kwasi`’s figure with a ravenous appetite.


    He oozed a masculine appeal which his clothes accentuated. The tan buttoned shirt
    with the sleeves pushed up to his elbows revealed the toned muscles of his arms.
    His black slacks hugged his thighs like a second skin. And his big juicy lips.
    He licked them and she stumbled.


    Swiftly he came to her side. “Gretchen, are you—?”


    “You’re here,” she breathed out. “You’re really here.”


    `Kwasi` stared at her.

