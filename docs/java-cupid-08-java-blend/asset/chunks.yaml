    每向她靠近一步，都会让那些噩梦如飞溅的油漆般喷涌而出。他与 Kojo 跌落在坚硬的森林地面上。身后老虎的低吼。猎人们的嘲笑。背部传来的灼热剧痛。当他拖着弟弟、拒绝松开他的手时，那种刺骨的恐惧。


    Kwasi 转过身让她看他的背部。“你看到他们对我做了什么吗？”


    当他感觉到她的目光掠过他背上的伤痕时，他听到她吸了一口气。像是一种身体上的触碰，他能感觉到她的眼神在那片皱缩的肉上停留——那里是老虎差点就杀了他的地方。


    他转过头，低吼道。“你真的不知道我有多想杀了你。”


    她的脸色变得苍白，一片灰败。尽管如此，她的嘴唇依然抿成一条坚定的直线。


    “我知道，Kwasi。”一阵细微的颤抖席罩了她。他分不清那是因为悲伤还是愤怒。“我当时被绑在一棵树上。”她艰难地吞了下口水，“他们这样做是为了防止我去追你。我看到猎人们带着老虎在后面追你。”


    她的声音破碎了。“我听到你尖叫。那是我从你那里听到的最后一个声音。”


    那双深色的眼睛像玻璃球一样闪烁着。“所以我，我真的知道你经历了什么。我当时无力阻止它。”


    他嘶声道。“但你却强大足以开启这一切。”


    怨恨在他胃里翻腾。为了逃离出生的村庄，他经历了地狱般的生活。他竭尽全力将那些记忆埋没在过去阴湿的水流中。


    做这件事时他得到了帮助。多亏了他的领养父母，他逃到了美国，并获得了某种常人的生活。即便在这里，他的白化症也引起了欺凌者的关注，而不是猎人。


    对自己最初被吸引的厌恶在内心涌起。当她走入 Java Cupid 时，他怎么会觉得她如此惊心动魄？难道那才发生在不到一小时前吗？从那以后似乎已经过了一辈子。那是充满痛苦和无果复仇的一生。


    Kwasi 从地上抓起他的 T 恤，把它缠绕在拳头上。“你——”


    等一下，脑海里有一个声音尖叫。那个标记呢？


    一道闪电震过他的背部。他怎么能忘记那个？


    “你还带着它吗？”他咬牙切齿地问道。


    她的头垂了下去，像个被抓到现事的顽皮孩子。“我们不要——”


    “格蕾琴琴（Gretchen），”他尖锐地打断道。“看着我。”


    他不知道那道强有力的命令从何而来。这完全不符合他的性格，就像他匆忙去任何地方一样反常。也许那是他从小就根深蒂固的男性对服从预期的残留，尽管他成年的后半部分是在美国度。


    她抬起头，直视着他的目光。


    “你还带着它吗？”他又问道。


    他几乎希望她没有。当沉默持续了极其长的一段时间，他向苍穹发出了快速的祈祷。


    她的嘴像鱼一样张开合着。“我——我不能——”


    “转过身，”他命令道。他不知道这种胆量从何而来。


    她静住了，侧歪着头，眼中燃起了一抹反抗的火花。老兄，尽管体内涌动着一切，但他确实喜欢她的傲慢。


    但他不会被动摇。他必须知道。


    他看着那抹反抗的眼神离开她的眼睛，取而代之的是顺从。她缓慢地转过身，一股突然的冷汗浸透了他。恐惧中夹杂着一种不悦的兴奋。当他内心本应该只有憎恶时，这完全不合逻辑。


    他的眼睛锁定在她后颈处那个小小的瑕疵上。那块浅色皮肤的形状像一个不安的月月，边缘模糊。


    Kwasi 咽了口唾水。“在那儿。”


    如此微小的东西，那个标记却将他们两人的生活推入了痛苦的兔子洞。


    Kwasi 无法再继续看下去了。他没有朝她看一眼，径回到车旁，启动引擎，像地狱出来的蝙蝠一样冲出了 Java Cupid 的停车场。


    街道变得模糊。熟悉感驱动着车辆行驶，而非预定的目的地。一种挥之不去的警觉感告诉他有地方要去，但无论如何，他就是想不起来。


    在红绿灯前，他的车载电话响了。他把蓝牙耳机塞进耳朵，接了起来。


    “Kwasi O’Brien。”


    “怎么了？”他自己的声音略显低沉地钻进耳朵。


    Kwasi 叹了口气。“Kojo，我不知道该不该告诉你。”


    “如果我不是不知道，我不会打电话的。”


    事实确实如此。他们的双生纽带比蜘蛛侠的蜘蛛感还要灵敏。他们只需一个眼神就能读懂并知道对方的想法。


    “你不会喜欢我接下来要告诉你的。”


    “尽管放。”


    Kwasi 摇摇不定，手指死死地抓住方向盘。他如此优柔寡决极不寻常，但格蕾琴的出现让世界都乱了套。


    “我今天遇到了你的嫂子。”


    电话那头 Kojo 死一般的沉默比任何语言都更有力。最后，他开口了。“她怎么——？”


    “我不知道。起初我没认出她。但后来——”


    他的声音消失了。他有多想向哥哥揭露？“她在那里吗？”


    Kwasi 猛地一神，对自己思绪转向内心感到惊讶。“没有。”


    绿灯亮了，他松开油门。“听起来是个计划。”


    为什么他的心跳会自己加快？为什么他的脑海会闪过她走入 Java Cupid 的身影，如此惊心动魄？为什么在过了这么多年，那个标记依然烙印着她？


    他怎么能忽略那个占有的符号？


    “Kwasi，你得集中注意力，老兄。我们要加强两周后他妻子表演的户外音乐会的安保。我们需要进行分析，然后聘请保镖。”


    “好。”


    “他让我们几天后在 Java Cupid 会面讨论合同，然后从那里出发。”

