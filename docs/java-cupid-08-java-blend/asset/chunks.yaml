    他的声音充满了沮丧。“格蕾琴。”人怎么能如此残忍？


    “但我不再打算退缩了。我那时学会了为自己的肤色感到快乐。”


    他们两人低头看着十十的手。“人的内在远比肤色丰富得多。为什么大家不能像我一样，清清楚楚看到这一点呢？”


    “因为……” 他的声音渐渐消失了。


    她抬起眼睛。“因为什么？”


    “因为‘救不了愚蠢’。”


    笑声在他们之间回荡。当格蕾琴直起身体，刻意用身体像团热浪一样贴近他时，笑结束了。“现在，用你那硕大多汁、性感的双唇掠夺我吧。”


    他欣若惊喜，收紧双臂搂住她。“让我吻它，让一切变得好起来。”


    ![](img/00002.jpeg)


    格蕾琴打开家门，迎接来她姐姐格特鲁德愤怒的目光。


    “格蒂蒂？怎么了？一切都还好吗？”


    紧锁的表情让她姐姐的五官变得更加冷峻。“不，格蕾琴。一切都不好。”


    她关上门，放下手包和爪哇丘神杯。“那是因为什么？”


    “你和他在一起，对吧？” 格蒂那指责的目光几乎要刺穿了她。


    格蕾琴肿起来的嘴巴像鱼一样张合着。“我——”


    “我告诉过你要离他远点，不是吗？我说过不要让他在我们之间产生矛盾。但你没有听我的，对吧？”


    “没必要不高兴，格蒂。我们已经对二十年前发生的事释怀了。”


    噢！他们可是怎么释怀的呢。过去一小时的甜蜜回忆让她的身体泛起残余的热量。他的吻夺夺了她的感官。那是令人陶醉、深邃的吻，随着他那葡萄柚般的嘴每一次掠过而愈发激烈。


    “格蕾琴，”他低吼道。“我们得停下来。”他的舌头舔着她的肩膀。


    “为什么？” 她最不想做的事停下来。尤其在现在感觉这么好的时候。


    “因为——嗯！” 当她轻咬他的耳垂时，他发出了闷吟。


    “因为什么，夸西？”她用小女孩的声音问道。


    他更有力地吻她，将她向后推，直到他们撞在办公室坚硬平坦的墙面上。稍后当他让她呼吸时，他的眼中闪烁着炽热而沉重的欲望。他的目光扫过她凌乱的衣服和头发，带着一种致命的满足感。他的手落在她的臀部，然后环住她的大腿。


    “格蕾琴——” 他听起来像是很痛苦。他正准备抱起她那无骨的腿，突然拳头抵在她头顶上方并推开了。


    “夸西？”


    他呼吸急促，咕哝道：“你现在有点太过了。”


    从他僵硬的样子，她感觉到他正在努力克制自己。尽管双腿还在发抖，她还是尽力抚平了衣服。夸西那双钻石般的眼睛盯着着她的每一个动作。


    当她恢复了往日干练的体面后，她看了他一眼。“你不喜欢我吗？” 一生的不安全感再次抬起头，让她充满了怀疑。


    他不可置信地睁大眼睛。“女人，你不知道自己离躺在那个战士面具和诡异娃娃旁边有多近吗？”


    “格蕾琴？”


    她把思绪回到现实，看到格蒂脸上满了忧伤。


    有足够的时间去重温和夸西的那些时刻。她必须安慰她的姐姐。“你还是我的双胞胎。没有人能从我们这里夺走。他们做不到！已经太晚了。”


    格蒂盯着她。“你真的是这么想的，不是吗？对你来说真的那么简单，对吧？”


    “当然了！” 为什么还要进行这种对话？她宁愿回到房间去思考下一次什么时候能见到夸西。


    “你觉得现在和你他的兄弟那么恩爱火热，科乔还会接受你吗？你觉得现在你和夸西关系这么好，这种关系也会延伸到我身上吗？”


    “你说什么？”


    格蒂站在那里犹豫着，咬着唇。接着她的肩膀直了，嘴唇抿成一条线。每当格特鲁德·奥辛加露出那种眼神时，坏事就要发生了。


    “我是告诉长辈们夸西有魔法力量的人。”


    冰骨般的震惊冻结了格蕾琴的每一块肌肉。如果现在有人指着她，她会碎成万万片。而现在，她几乎无法让声音穿过紧缩的喉咙。“什么？”


    “你不记得了吗？长辈们传召了你和爸爸。我留家里陪妈妈。你是在他们问之后才告诉长辈的。你觉得为什么他们知道妈妈病了？”


    这听起来有一种可怕的道理。当长辈提到她母亲的病情时，她的父亲感到不满和震惊。她脸上失去了血色。“格蒂，为什么？”


    “在夸西在你身上标记的那一天，我看着你们两个。我躲在灌木后面看到了一切。我一直都是这样。好吧，在科乔在的时候，我只能做到。”


    格蕾琴的双腿第二次软了下去，但不是因为夸西之吻的影响。她踉着走向餐房的一把椅子。“只要我们中没有人得不到他，我就知足了。但他——”


    这个女人停止了说话。格蒂看向壁炉。那是格蕾琴最喜欢的之一。顺便说，那是他们十岁时的照片。穿着同样的泳衣，拿着橡胶鸭子。“我爱你，格蕾琴。我一直爱你，永远爱你。你是我灵魂的另一半。比任何人都了解我的双胞胎。”


    格蕾琴的喉咙里哽着一块。“我不认识你了，格蒂。不再是了。”'
