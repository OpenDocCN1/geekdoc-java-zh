    “You thought like everyone else. That my albinism gave me magical powers.” He
    shook his head ruefully. “I knew you were going to say that.”


    He slumped down in the chair. “I just didn’t expect it to hurt this much.”


    A lump grew across her throat. “I—I—was six years old, Kwasi. What should I have
    thought?”


    He sent a baleful glare her way. “You were smart enough to know Kojo and I were
    different. You remember how everyone treated us.”


    Gretchen did recall. The villagers had done everything possible to get rid of
    the albino twins they hated and feared. The only reasons why they hadn’t taken
    up spear and stone to drive them away was due to the influence of the missionaries,
    particularly Luke and Donna O’Brien. Luke and his dark skin like their own, with
    his wife, Donna, and her white skin, had torn down long-held beliefs about pale
    skin being a sign of evil or uncleanness.


    Over time, the villagers had come to trust the missionaries among them. For herself
    and Gertrude, Kwasi and Kojo were different but not in a bad way. Looking back,
    Gretchen had to thank the O’Brien’s influence for their help.


    “I remember,” she remarked slowly.


    A long-buried memory leapt up from the recesses of her mind. As it unfolded, a
    hint of a smile played on her lips.


    “Why are you smiling?” Kwasi asked, affront clear in his voice. “Did I say something
    funny?”


    “Not at all,” she hastily replied. “I was just remembering when I painted your
    skin with mud.” Her eyes lifted up to his. “Do you?”


    He blinked once. And then again. Then a grin brightened his face. “Yes, I do!
    Oh man, that was so long ago.”


    “I’d mixed a pile of mud together and then smeared it all over you. Do you remember
    what I said?”


    Kwasi chuckled. “‘Once you get darker, you’ll be cleaner.’”


    They chuckled together and warmth spread through her.


    “I wanted so bad to be as dark as you. I think I walked around the entire day
    with dried mud sticking to me.”


    “They’re not all bad memories, are they, Kwasi?”


    Could Kwasi see the desperation in her eyes as she begged him without saying so
    that she was sorry?


    His smile died away. “No, they’re not all bad memories. Especially the very day
    I gave you that mark.” His eyes zeroed in on hers. “It was the second, best day
    of my life.”


