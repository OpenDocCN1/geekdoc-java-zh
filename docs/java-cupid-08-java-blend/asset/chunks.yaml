    “嘿，哥们儿！”


    Kwasi 忍住了呻吟。这时机真是糟糕透了！


    “嘿，Jeb，”他回应道。


    他喜欢那家伙，但现在不是。尤其是当 Gretchen 坐在那里，看着他们小心翼翼地躲避着过去的种种事件时。“怎么了？”


    咖啡师棕色的眼睛里闪烁着戏意。“看到你跟我这位甜美、裹了巧克力、极度迷人的女士在一起了。我不太忙，所以想溜过来看看能给你们带点什么。”


    他的手指来回晃动，仿佛在指责它们从饼干罐里偷了饼干。“我没有打扰到你们什么吧？” 一抹狂热的光芒亮了 Jeb 的眼睛。


    这哥们儿才几级？三年级吗？


    “我们正享受彼此的相处，”Gretchen 冷冷地回答。她拿起杯子，喝光剩下的茶。“我很高兴你来了，因为我想再来一杯，麻烦了。”她挑起纤细的蜡过的眉毛，问道：“Kwasi？”


    “当然，我来一个。”只要能让这个傻瓜离开他们，什么都行。


    “噢，我明白了。我破坏了你们的氛围。在我不该出现的地方干涉。”


    你觉得呢？


    Jeb 眨了眨眼，后退了。“我明白，我明白。我会慢慢给你们送茶的。”Jeb 悠闲地走开了，嘴里哼着调子。


    “还需要半小时，”Kwasi 没忍不住补充道。


    “很好。这意味着我们可以继续讨论，为什么这个痕记对你来说如此重要。”


    ![](img/00002.jpeg)


    ### 你觉得你被那个咖啡师救了吗，Kwasi？


    他通过陷入各种无关紧要的话题逃避了她的提问，但 Gretchen 决心要得到她寻找的答案。其中一个答案对应着“为什么”的问题。为什么这个痕记会是一个好日的象征，却又是他被永远赶出村庄的导火索？被他唯一的家园追逐和猎杀？


    “我觉得我们今天在回忆路上走得足够了，”Kwasi 回答。


    “我不这么认为，”Gretchen 反驳道。是时候采取进攻姿了。她必须知道。“如果不是因为这个痕记，没有人会像他们那样伤害你。”


    Kwasi 的眉毛在墨镜上方抬了起来。“你并不知道。每当我回想起它时，长老们只是在找任何借口来对付我和 Kojo。你只是给了他们所需的弹药。”他的语气变得生硬起来。


    Gretchen 的胃在他的指责下翻江倒海。他是对的。


    “我对你所做的事感到抱歉，Kwasi。”她以前道歉过，但那句匆忙说的话既没有她悲伤的实质，也没有深度。她早已背负着撕碎他们生活的罪恶的愧疚。


    Kwasi 眯起眼睛看着她，仿佛能看穿她的灵魂。“他们说了什么让你报了我的名字？”


    “他们说了什么并不重要。重要的是，他们操纵了一个六岁的女孩。”


    她和她的 Baba 走到村子中心草屋的路程仿佛持续了一整世纪。她以前从未去过首席长老的家。所有的村领都聚集在那里。他们示意让她站在他们中间，所有的黄色的眼睛都盯着她。


    首席长老倾过身，身上散发着甜香的烟味。


    “Afia，如果你不让我们牺牲你的丈夫，你妈妈就会死。”


    死亡？在她短暂的生命里已经见过足够次，知道那意味着终结。她见过动物以各种暴力的方式死去。被猎人的弓箭刺穿。被她 Baba 的刀剥皮。被偶尔经过的军用车轮压扁。在她存在的这几年里，她都见过。


    一想到她的母亲最终落得同样的下场——一具僵硬、扭曲的身体，张着大嘴，结节的手指冻结在死亡的紧握中。


    不，她不想让她妈妈死。


    “我们需要他们的骨头，”长老继续用他那沙哑而催眠的声音，“他们的骨头会驱试图吸走你妈妈灵魂的恶灵。”


    她怎么能知道，在她的好朋友和母亲之间做选择最终会变成这种地步呢？


    “你不需要告诉我，Gretchen。我明白。”Kwasi 疲惫地叹了口气，将她带出记忆。“在我们故乡，白白化症和以前一样是一种污名。过去和现在的区别在于越来越多的人接受了关于它的教育。”


    她点了点头。“我知道。”


    “你可能会以为我们是魔鬼或神灵，因为我们这苍白的皮肤周围环着神秘色彩。”愤俗从他嘴里滴出。听到这句刺耳的话，她的心猛地一跳。


    “无知是可以弥救的。你知道的，不是吗？”


    由于那句酸刻的话，她的心剧烈波动。


    “无知可以修复。


    你知道的，不是吗？”


    Gretchen 问了下一个问题。


    Gretchen 咬着下唇，在沉思中。


    “他们说了什么并不重要。”。”


    Jeb 皱了皱眉，掠过她的脸。


    她拿起纸巾，目光离开她的眼睛。


    “我不明白你的意思，”在一个令人屏息的瞬间。


    “你知道，不是吗？”


    Jeb 摘下眼镜，她直接盯着他的眼睛。一种在灰色和浅蓝色之间的颜色。被长长的睫毛点缀着金色。


    宝石般的眼睛让她感到惊讶，那些目光掠过她的脸。


    他的声音像丝绸抚摸一样掠过她。“如果那个痕记消失了，也许没那么重要了。但现在如此。”


    在几个令人屏息的瞬间，他们的目光交汇。


    “这意味着你属于我，”他毫无铺垫地说。


    一阵震惊的浪潮席卷了她。她意识到二十年前停滞的命运终于有了结果。


    从他眼中了的光中，她知道他经历了同样的不可知。。凭借他的意志，他拒绝让她离开这种磁性的连接。


    “你是我的妻子，Gretchen。”


    难道正是因为这些年形成的这段纽带，她在关系中从未成功？尽管她的想法相反，她是否一直在等他？


    这段对话要走向哪里？


    你知道这要走向哪里，她的心在呐喊。而且你想它走向那里。


    “这只是巧合，”她冷哼道。“这可能发生在任何人身上。”


    “但它发生在我们身上，”Kwasi 的语气不容置疑。“我不轻视这种事。你曾是我的好朋友和妻子。我们可以再次拥有。”


    “除非我死！”两个声音异口地插道，带着强烈的否定。


