    You’re wrong, Kojo. She very much is.


    As a child, he kissed her there in order to give her comfort. As a man, he had
    entirely different reasons for wanting to place his mouth there. He wanted to
    bring her essence inside of his being.


    “Kwasi?”


    “Yeah?” His voiced sounded ragged to his own ears.


    “Kiss it and make it better?”


    A lightning bolt shuddered through him. He didn’t have to be asked twice.


    He pressed his lips to the spot that had once caused so much pain. Instead of
    her childish nonchalance at his touch, her head rolled back, exposing the exquisite
    column of her neck.


    “Kwasi,” she moaned.


    He continued to press his lips there although he used his fingers to trace little
    circles along the sensitive edge of her neck. Vibrations trembled along her frame,
    shuddering his own body. With a fierce growl, he turned her about and captured
    her lips with his own.


    Pleasure. Pure, sweet pleasure. Moist warmth. Soft skin. Silky sighs. Nothing
    in his life had prepared him for this. The desire? Yes, it was as natural as air.
    But beneath the passion was the realization he’d rediscovered the other half of
    his heart.


    The wonder of it made him release her mouth. She whimpered and tried to draw him
    back to her, but he had to tell her.


    “Do you know how you used to make me feel?”


    She shook her head.


    “You used to make me feel clean. The villagers and the elders called me a dirty
    demon because my skin wasn’t as dark as theirs. For such a long time, Kojo and
    I only had each other. Until you.”


    He framed her face with his hands. “You looked at me and saw me. Not the dirty
    demon, but me. A boy named Kwasi who had no friend.”


    A tear escaped her eye. He padded it away with his thumb. “You with your dark,
    pure skin. I always felt dirty next to you, but you never treated me like they
    did.”


    Her lips quivered. He pressed his thumb against them to feel their lush softness.
    “That’s why this mark on you is so important to me. It was the day, by whatever
    power exists, we blended. It made you mine. And me, yours.”


    There. He bared his soul to her. Would she accept this inadequate gift of his
    heart?


    The message from the Java Cupid cup flashed in his head. My love is the purest
    form there is.             


    Is that what the mysterious cupid had been trying to tell him? That his sincerity,
    his unadulterated honesty, made his love pure?


    Gretchen gently tugged his hand from her face and linked their fingers together.
    “It’s just melanin,” she whispered. “I have more and you don’t have as much. It’s
    the outer surface. A stroke of paint to cover the soul within.”


    She kissed his fingers, rocking him to the core. “It’s funny. In the village,
    I was considered the purest because my skin was so dark.” A rueful, unpleasant
    smile curled her lips. “When the Ozingas adopted Gertrude and I after our parents
    passed away, and brought us to the U. S., I was told I was too dark. I was a dirty
    black skank, tar baby, ugly hoe—”


    “Shhh.” He placed a finger on her lips. He ached for her. She did understand.


    “Remember when you called me Glenda when we played our little game? How I reacted
    when you called me that?”


    He nodded. It seemed a lifetime ago when they played the game. This dark beauty
    had so intrigued him with her standoffish personality and cool attitude, he’d
    been tempted to see what he could do to get her to unwind. The name game was only
    a means to an end.


    Who knew it would lead him to this moment?


    Her eyes narrowed as the event replayed in her mind. “Well, she was the leader
    of a group of girls at my high school. She bullied all the dark-skinned girls.
    I stood up to her and nearly got the stuffing beaten out of me.”'
