    Dismay filled his voice. “Gretchen.” How could people be so cruel?


    “But I wasn’t going to back down anymore. I learned then to be happy with the
    skin I’m in.”


    They both looked down at their clasped hands. “There’s so much more to people
    than the color of their skin. Why can’t everyone see that as plainly as I do?”


    “Because…” He let his voice trail off.


    She lifted her eyes. “Because what?”


    “You can’t fix stupid.”


    Laughter bubbled between them. It ended when Gretchen raised herself up, deliberately
    pressing her body like a slick of heat against him. “Now ravish me with those
    big, juicy, sexy lips of yours.”


    Delighted, he tightened his arms around her. “Let me kiss it and make it better.”


    ![](images/00002.jpeg)


    Gretchen opened the door to her house to meet the furious stare of her sister
    Gertrude.


    “Gertie? What’s wrong? Is everything okay?”


    A closed expression toughened her sister’s features. “No, Gretchen. Everything
    is not okay.”


    She closed the door and set her purse and Java Cupid cup down. “Then what is it?”


    “You were with him, weren’t you?” Gertie’s accusing eyes bore a hole into her.


    Gretchen’s swollen mouth opened and closed like a fish. “I—”


    “I told you to stay away from him, didn’t I? Don’t let him come between us, I
    said. But you didn’t listen to me, did you?”


    “There’s no need to be upset, Gertie. We’ve cleared the air about what happened
    twenty years ago.”


    And oh! How they cleared it. The sweet memories of the past hour flushed her body
    with residual heat. His kisses had robbed her of her senses. Drugging, deep, kisses
    which intensified with each pass of his grapefruit mouth.


    “Gretchen,” he growled. “We’re going to have to stop.” His tongue lapped her shoulder.


    “Why?” The last thing she wanted to do was stop. Not when things felt this good.


    “Because—mmm!” He moaned as she nipped the lobe of his ear.


    “Because what, Kwasi?” She asked in a little girl’s voice.


    He kissed her more forcefully, backing her up until they came against the hard,
    flat surface of the wall of her office. When he let her up for air a while later,
    his eyes blazed hot and heavy with desire. They raked over her mussed clothes
    and hair with a kind of lethal satisfaction. His hand dropped to her hip and then
    curled around her thigh.


    “Gretchen—” He sounded like he was in pain. He started to lift her boneless leg,
    when he suddenly slammed his fist above her head and pushed away.


    “Kwasi?”


    Breathing labored, he grumbled, “You’re a little too much right now.”


    From the way he held himself rigid, she got an inkling he fought to control himself.
    Though her legs were shaky, she gathered up what strength she could and smoothed
    her clothes down. Kwasi’s diamond eyes watched her every move.


    When she had restored some semblance of order to her normally smart self, she
    glanced at him. “Didn’t you like me?” The insecurities of a lifetime reared their
    heads to fill her with doubt.


    His eyes widened in incredulity. “Woman, do you know how close you are to being
    flat on your back next to the warrior mask and the creepy doll?”


    “Gretchen?”


    She dragged her mind back to the present to see Gertie’s face filled with sorrow.


    Enough time later to relive those moments with Kwasi. She had to reassure her
    sister. “You’re still my twin sister. No one will ever take that from us. They
    can’t! It’s already too late.”


    Gertie stared. “You really think that, don’t you? It’s really that simple for
    you, isn’t it?”


    “Of course it is!” Why were they even having this conversation? She’d rather be
    up in her room to think about the next time she’d be able to see Kwasi.


    “Do you think Kojo is going to accept you now that you and his brother are all
    lovey-dovey? Do you think now that you and Kwasi are on such good terms, those
    terms extend to me?”


    “What are you saying?”


    Gertie stood in indecision, biting her lip. Then her shoulders straightened and
    her mouth compressed into a thin line. Whenever Gertrude Ozinga got that look
    in her eyes, something bad was about to happen.


    “I was the one who told the elders Kwasi had magical powers.”


    Stone cold shock froze every muscle of Gretchen’s body. If someone had pressed
    a finger to her at that moment, she would have splintered into a million pieces.
    As it was, she could hardly get the word past the constriction of her throat.
    “What?”


    “Don’t you remember? The elders summoned you and Baba. I stayed home with Mama.
    You only told the elders after they asked. Why do you think they knew Mama was
    sick?”


    It made an awful kind of sense. Her father had been disgruntled and shocked when
    the elders mentioned her mother’s illness. The blood drained out of her. “Gertie,
    why?”


    “I watched you both the day Kwasi put his mark on you. I hid behind the bushes
    and saw the whole thing. I always have. Well, as much as I could with Kojo around.”


    Gretchen’s legs went weak for a second time but it wasn’t from the effect of Kwasi’s
    kisses. She stumbled over to a chair in the dining room. As long as neither of
    us could have him, I was content. But he—”


    This woman stopped talking. Gertie looked at the fireplace. It was one of Gretchen’s
    favorite. Incidentally, a picture of them from when they were ten years old. Clad
    in identical bathing suits and holding rubber duckies. “I love you, Gretchen.
    I always have and always will. You’re the other half of my soul. My twin who understands
    me better than anyone else.”


    A lump formed in her throat. “I don’t know you, Gertie. Not anymore.”


    Gertie’s eyes hardened. “I can’t share Kwasi with you. I won’t stand by and watch
    you grow closer and shut me away. I want him for myself and I’ll take out any
    woman who gets in my way.”


