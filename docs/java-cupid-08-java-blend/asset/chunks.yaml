    Manna from heaven!


    “Excuse me, Lonnie,” she said without breaking her eye contact with Kwasi. “I’ve
    seen someone I know. I’m going to go say hi. Talk to you later.”


    Without another word or look at her co-worker, Gretchen crossed the wide expanse
    of the lobby. Each step drew her closer to the craving of her soul. Her eyes ate
    up Kwasi’s figure with a ravenous appetite.


    He oozed a masculine appeal which his clothes accentuated. The tan buttoned shirt
    with the sleeves pushed up to his elbows revealed the toned muscles of his arms.
    His black slacks hugged his thighs like a second skin. And his big juicy lips.
    He licked them and she stumbled.


    Swiftly he came to her side. “Gretchen, are you—?”


    “You’re here,” she breathed out. “You’re really here.”


    Kwasi stared down at her. “Yes, Gretchen. I’m really here. Where I’ve wanted to
    be for a while now.”


    Her heart soared. “Kwasi.”


    He took another step closer, hands reaching out toward her. Then he fisted them
    and stuffed them into his pockets.


    “Is there someplace we can talk?”


    She nodded. Gertie’s anguished face flashed in her mind. So did Kojo’s anger.


    But at this moment, neither of them mattered. What was important now was this.
    That somehow, they both wanted to be together. They were meant to be together.


    “Yes, I’m going to get you a VIP pass so you can go into the back to my office.”
    Giddy, she rushed over to the reception desk and had the attendant print out a
    VIP pass. Though her back was turned, she still felt Kwasi’s gaze. Instead of
    being afraid of the connection, she reveled in it. Although it took less than
    thirty seconds for the attendant to print out the VIP pass, each second she waited
    seemed to last twice as long.


    Finally, she had it in her hand.


    “Kwasi—”


    “Gretchen, watch out!” He cried out from across the room.


    Something collided with her, knocking her off balance. Without thinking, she grabbed
    for the edge of the front desk and held on until she gained her equilibrium.


    “Oh, I’m so sorry,” a raspy voice apologized.


    She straightened and brushed her clothes. “No worries—”


    The words locked up in her throat. It was the man in the wheelchair from the other
    day. “It’s you.”


    “Yes.” The man didn’t deny her words. “It’s a small world, isn’t it?”


    “Why, yes, it is.” Why was her skin starting to crawl again? She’d never met this
    man before in her life. There was no logical reason for her to have this reaction.
    And yet she couldn’t help but want to wash her body as his eyes slowly scanned
    her from head to toe. His expression carried no salacious gleam, which made it
    all the more difficult to understand her instinctive aversion.


    If anything, he looked as if he were assessing a piece of merchandise.


    “Gretchen, you okay?” Kwasi’s arms came around her with a naturalness that was
    both new and familiar. She sank into his strength.


    “I’m fine,” she said. “Just almost knocked this poor gentleman out of his chair.”


    “That’s an injury I wouldn’t mind having. Being knocked over by a beautiful woman.”


    They all chucked appropriately but Gretchen still had the urge to take a shower.
    She’d settle for Kwasi’s arms around her, though. With effort, she dismissed the
    disturbing encounter from her mind and with a half-smile of dismissal to the man
    in the wheelchair, she focused on Kwasi.


    “Ready?”


    A masculine promise lay in his eyes. “Oh, you bet I am.”


    # CHAPTER SEVEN


