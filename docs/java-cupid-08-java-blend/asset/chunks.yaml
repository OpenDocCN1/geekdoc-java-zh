    of it this way: if you can’t do this, they’ll throw some scientific trip at them.
    Some egghead will tell them how backward indigenous cultures are. Then those kids
    will continue to look at them when they see them on TV as weirdos instead of equals.”


    Her lips thinned. With the rise of scientific intrigue and advancement, more school
    children were being indoctrinated to focus on the future with little interest
    for the past. It was her duty to make sure she did what she could to dissuade
    them of the idea. Ignorance of history led to mistakes of tomorrow.


    “I’ll make it work but we’re going to have to meet face to face. It can’t all
    be through email.”


    “I’ll let them know. Maybe we can all meet at Java Cupid.” His green eyes gleamed.
    “I’m dying to see if I get a message on my cup. I’d love to meet the love of my
    life.”


    Gretchen started. Lonnie’s eyebrows rose in the air. “You okay?”


    No, I’m not. “Of course. We can meet there.  Set up the dates, will you?”


    Lonnie gave a curt nod and left. She clacked away at the keyboard. Scouring her
    contact list, she pleaded with her network of local experts in indigenous cultures
    to participate in the event. Most grudgingly accepted since their views reflected
    her own.


    A little while later, she glanced up and met the beady eyed stare of the little
    helper doll across the room. The panacea of work vanished away. Its head was tilted
    to the side as if to say, You can’t wait to see him again, can you?


    “No,” she said aloud into the stillness. “I can’t wait to see him again.”


