    “我们低估了他。那样的人在得到他想要的之前不会停止。无论花费多久，他都会找到男孩们的。他会伤害女孩们的。奥辛加家族会保护女孩们安全的。”


    “我们去找了政府，但他们毫无帮助。他们无法为一个没有名字的小村庄增加资源。但在我们离开期间，奎西和阿菲亚之间发生了什么。我不记得了。有人毒了阿菲亚和阿雅的母亲。我知道。”


    “卢克，”科乔用奇怪的声音打断道，“那条项链是什么样子的？”


    老人倒在地上，失控地哭了起来。他低声耳语，声音几乎听不见。“是一条由手指骨和红宝石制成的项链。”


    科乔咒骂了一句。“奎西，我见过这个人。”


    “你什么意思是见过他？”尽管在问这个问题的同时，某种感觉也扰着他自己的意识。那超出了他的理解范围。


    “他杀了多娜。但我必须找到男孩们。奥辛加家族负责女孩们。他们会给她们起新名字并将她们带回家。”


    卢克来晃晃身体。“多娜。多娜。”


    科乔向支持人员点头，他们走了。一名医生非常轻轻地处理了老人，给他镇静，直到他在片刻后陷入了昏迷。


    “我们得走了。现在。”


    奎西点了点头，脑中回响着万千思绪。尽管如此，他蹲在老人瘫软的身体旁，紧紧抱住了他。科乔也这样做。


    他们匆忙离开了设施。


    “科乔，你不是真的觉得——”


    “我是真的，兄弟。”他哥哥的颌部肌肉绷了一下。“这个人过了这么久还是找到我们了。他在 `Java Cupid` 待了几天了。我进出时见过他。坐在那辆旧车里，抽着雪茄。”


    “我没见过他。”


    科乔瞪了他一眼。“你光忙着和格蕾琴了，没空看别的。”


    奎西忽略了这句讽刺，另一个可怕的念头取代了它。“那么他追逐的不只是我们。他还在找格蕾琴和她的妹妹。”


    ![](img/00002.jpeg)


    格蕾琴对着助手玩偶笑了。生活从未像现在这样好过。奎西是她等了一整辈子的男人。


    一种冲动的自得占据了她。难道她小时候不就知道这些吗？


    她幸福地叹了口气，重新投入到明天活动细节的工作中。她的所有人脉现在都在城里，准备好帮助这次活动让孩子们记忆难忘。


    艺术、手工、舞蹈，以及故事会时间，还包括博物馆之旅、午餐和零食。


    最重要的是，她期待与孩子们分享她对原始文化的热爱。通过这样做，她希望有一天能将这一旗帜传递给他们。


    “我的愿望太野心了吗？”她问助手玩偶。


    娃娃依然静止不动，但格蕾琴还是揉了揉它圆圆的眼睛。一周前她妹妹的影像浮现在脑海中。格蒂搬离开了她们共同居住的房子，没有回头。咬着牙关，神情严厉。她的妹妹无法、也不会为她感到高兴。


    格蕾琴皱着眉，端起 `Java Cupid` 杯，重新读了写上面的那条信息。“爱原谅一切，甚至是死亡。”


    第一次读到这条信息时，她认为也许信息是指原谅她在奎西父母去世中所承担的责任。在过去的两周里，他们无话不谈。奎西真的不再认为她对此了。对此她感激。随着每一天的过去，内疚感减轻了，她深爱上了那个多年前将她据为己男人。


    她得到了奎西，但失去了妹妹。


    格蕾琴叹了口气。死亡并不总是物理存在的终结。它可以是像格特鲁德那样对关系的故意谋杀。


    格蒂怎么能让一个男人介入她们之间？她对奎西的执着比她们的纽带更强吗？共享同一的心应该被爱毁吗？


    她的手机在桌上震动。奎西的号码在屏幕上闪烁。


    “你好，奎西。”她幸福地向后靠，像既往一样兴奋。


    “嗨，格蕾琴。”他低沉的声音让她的脊背感到一阵轻颤。“你还好吗？”


    “我很好。只是在准备明天的事情。和奥布莱恩先生见得怎么样？他过得好吗？”


    “那正是我需要和你谈谈的。”


    敲门声中断了对话。“等一下，奎西。”她静音了电话，然后放下手机。“什么？”


    “格蕾琴·奥辛加的快递。”一个男声喊道。


    “来了。”


    奇怪的是，前台没有签收快递，或者他们没有联系让她亲自签收包裹。她起来打开门。快递员头上压着一顶低帽子，身后是一个推着大容器的平板推车。


    “早。”


    他粗鲁地擦过她，送他的快递。一股刺鼻的雪茄味味着他，她屏住了呼吸。


    对他的无礼感到有些困扰——她并没有允许他进来——但她还是算了。仅仅因为她的生活很完美……好吧不完美，但很好，并不意味着其他人同样的运气。

