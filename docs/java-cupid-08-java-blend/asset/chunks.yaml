    and blunt tipped. Did the things he was good at include soft caresses and—


    Whoa! She gave herself a mental jerk. What in the world was wrong with her? She
    didn’t know his name. For that matter, he was trying to guess hers, so why were
    these kinds of thoughts going through her brain like some sixteen-year-old girl
    with a first crush? She was a twenty-seven-year-old woman with two degrees and
    a career she enjoyed. Her love life may be abysmal but there were other things
    enriching her life.


    The man licked his lips again. Gretchen wondered if he’d call the police if she
    jumped him and made him kiss her.


    Disturbed by the absurd direction of her thoughts, she cleared her throat. “Well,
    I’m not interested in those things you consider yourself good at so you can stop
    trying.”


    “Not yet.”  


    Gretchen found herself ensnared by the magnetic pull of his knowing eyes. It was
    like being caught in the powerful, intense gaze of a white jaguar. It both excited
    and unnerved her.


    “You’re overly confident,” she finally said after a brief silence bubbled with
    undercurrents of thoughts better left unsaid. “But no. Not happening.”


    The man gave a small nod. “I’m a patient man. Let’s continue with the game. For
    now.”


    Why did those last two words sound like a promise for more?


    He went on for another few minutes. In spite of the weird knot of panic in her
    gut that wouldn’t go away, she giggled at his antics.


    The aroma of spices combined with the buttery, sweet scent of fresh baked goods
    worked to infused this moment in her mind. It felt good to be in this place, enjoying
    a man trying to get under her skirt. It was nothing but a veneer of attraction
    but she needed to feel like she was worth the effort. From villages of tribal
    priestesses to the glittering balls of elite socialites to the boardrooms of powerful
    women, she’d yet to meet a female who didn’t like the pleasure of being chased.


    “You’ll never guess it, you know,” she said after he tried an outlandish name.


    “What? Your name isn’t ‘Gorgon’?” 


    She folded her arms and gave him a mock glare. “Are you saying I looked like a
    woman who would have a hair full of snakes and turn men to stone?”


    “That was her power. It wasn’t because of her appearance. The Gorgons were quite
    lovely.”


    “There’s an alternative theory about the Gorgons and why—”


    “All right,” Jeb’s voice interrupted their conversation. “I’ve got two Java Blend
    teas—well, hello, Gretchen. How is my sweet, chocolate-dipped princess today?”


    She suppressed a groan.


    The man’s eyes widened as he looked at her. “Gretchen! No way it’s Gretchen!”


    “Why wouldn’t it be?” Jeb placed two steaming cups on the glass top. “Is there
    something wrong?”


    “No. Don’t worry about it, man.”


    Jeb darted his brown eyed gaze back and forth between them. Then he smiled slyly.
    “Oh, I see! You were trying to talk to her, amir ite?”


    “I wasn’t trying to do anything,” the man retorted back.


    Gretchen was disappointed to see their time of play was at an end. How strange
    to connect so quickly with someone she didn’t know.


    The warmth of the cup traveled along the expanse of her hand and flushed her arm
    with residual heat in a pleasant way. She greeted her favorite barista with, “Jeb,
    I hope you’re doing well?”


    “I’m doing really good since I’ve seen you. So, you were the other Java Blend
    Kwasi asked me to make.”


    Gretchen stiffened as a hot poker stroked down her back. “Kwasi?” The panic which
    had died down knotted her stomach painfully. “Your name is Kwasi?”


    He nodded once. “What’s wrong with that?”


    The cozy heat went away, replaced by a sudden chill. How could the name bearing
    so much guilt and regret be manifested in this man before her?”


    “Nothing’s wrong. Not at all.” The lie slid rocky between her lips. After all,
    just because his name was Kwasi, it didn’t mean he was the Kwasi.


    Gretchen turned back to Jeb. “How much do I owe you?” Her voice wobbled.'
