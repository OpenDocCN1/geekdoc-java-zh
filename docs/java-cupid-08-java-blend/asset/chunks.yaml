  raw: '“Hey, my man!”


    Kwasi bit back a groan. Talk about the worst timing!


    “Hey, Jeb,” he greeted back.


    He liked the guy, but not right now. Especially when Gretchen sat there as they
    tiptoed and parried around these events of the past. “What’s up?”


    The barista’s brown eyes sparked with amusement. “Saw you with my sweet, chocolate-dipped,
    oh-so-fine lady here. I wasn’t too busy so I thought I’d mosey up over here and
    see what I could get for you.”


    His fingers swayed back and forth as if he accused them of stealing cookies from
    the cookie jar. “I’m not interrupting anything, am I?” A feverish gleam brightened
    Jeb’s eyes.


    What grade was this dude in, third?


    “We’re enjoying each other’s company,” Gretchen replied in a cool tone. She lifted
    her cup and downed the rest of her tea. “I’m glad you came as I would like another
    one of these, if you please.” Raising a slender waxed eyebrow, she inquired, “Kwasi?”


    “Sure, I’ll have one.” Anything to get this fool away from them.


    “Oh, I get it. I’m cramping your style. Interfering where I shouldn’t be.”


    Ya think?


    Jeb winked and backed away. “I gotcha, I gotcha. I’ll take my time bringing you
    the tea.” Jeb traipsed away, whistling a tune.


    “That’ll be another half hour,” Kwasi couldn’t help but add.


    “Good. Which means we can continue our discussion about why this mark means so
    much to you.”


    ![](images/00002.jpeg)


    Do you think you were saved by the barista, Kwasi?


    He’d evaded her question by going down rabbit trails but Gretchen was determined
    to get the answers she sought. One of the answers was matched to the question
    of why. Why would this mark be a symbol of a good day when it was the catalyst
    of being run out of the village forever? Chased and hunted from the only home
    he’d ever known?


    “I think we’ve traveled down memory lane enough for one day,” Kwasi replied.


    “I don’t think so,” Gretchen countered. It was time to be the aggressor. She had
    to know. “If it wasn’t for this mark, no one would have hurt you like they did.”


    Kwasi’s eyebrows lifted over the rim of the shades. “You don’t know that. Whenever
    I look back on it, the elders were just looking for any excuse to come after me
    and Kojo. You simply gave them the ammunition they needed.” His voice ended on
    a hard note.


    Gretchen’s stomach churned at his accusation. He was right.


    “I’m sorry for what I did to you, Kwasi.” She’d apologized before but that hastily
    spoken thing didn’t have the substance nor the depth of her sorrow. She’d long
    since carried the guilt of the sin which had ripped their lives apart.


    Kwasi’s eyes narrowed on her as if he could peer down into her soul. “What did
    they say to make you name me?”


    “It’s not important what they said. The thing is they manipulated a six-year-old
    girl.”


    The trek she and her Baba had made to the center hut in the middle of the village
    had lasted forever. She’d never been to the head elder’s house before. All the
    village leaders had gathered there. They motioned for her to stand in the midst
    of them, their yellow eyes all fixed on her.


    The head elder had leaned over, smelling of sweet-scented smoke. 


    “Afia, if you don’t let us sacrifice your husband, your mother will die.”


    Death? She’d seen it enough times in her short life span to know it held finality
    to it. She’d seen animals in all manner of violent death. Stabbed by a hunter’s
    bow. Skinned by her Baba’s knife. Flattened by the occasional wheel of an army
    vehicle. She’d seen it in all those few years of existence. 


    To think her mother would end up the same way, a stiff, contorted body with a
    gaping mouth and gnarled fingers frozen in death’s grip.


    No, she didn’t want her mother to die.


    “We need their bones,” the elder continued his rasp hypnotic. “Their bones will
    ward off the evil spirit trying to suck away your mama’s soul.”


    How could she have known the choice between her best friend and her mother would
    be what it came down to?


    “You don’t have to tell me, Gretchen. I know.” Kwasi sighed wearily, bringing
    her out of her memories. “Albinism in our home country is as much of a stigma
    as it ever was. The difference between then and now is that more people are getting
    educated about it.”


    She nodded. “I know.”


    “You’d think we were demons or gods from the mysticism surrounding our pale skin.”
    Cynicism dripped from his lips. Her heart lurched at the acidic remark.


    “Ignorance can be fixed. You know that, don’t you, Kwasi?”


    His only response was to pick up a napkin and ball it up.


    Gretchen bit her bottom lip pensively before she asked her next question. “You
    can’t ever go back, can you?”


    A curt shake of his head gave her the answer.


    The tension which gripped his body let her know it was time to move on from that
    subject of home. She returned to her original question. “Please tell me why this
    mark you gave me represents a happy day for you. I want to understand.”


    Their gazes locked for a few heart-stopping moments. She couldn’t tear her eyes
    away even if she wanted to. He was too handsome for his own good. His features
    had hardened in displeasure—or was it unease? — until his broad chest heaved.


    “It means you’re mine, Gretchen,” he said without preamble. “The day I gave it
    to you, it solidified we belong to each other.”


    A wave of shock passed over her at the blatant declaration. Something inside of
    her gave an odd little leap of joy and stole the breath from her.


    “I don’t quite get what you mean,” she whispered.


    But she had the awful idea that she truly did understand.


    “Don’t you?” He leaned forward. “After all these years, it hasn’t gone away. It
    hasn’t faded out of existence as mysteriously as it came. It hasn’t diminished
    with age or deepened to match the purity of your flesh. Just like the scar on
    my back that forever brands your betrayal, you carry my mark.”


    The mark heated up on her neck as if to answer his call.


    “We blended that day, you and I.” He took off his glasses and she stared directly
    into his eyes. A color somewhere between a gray and light blue swirl. They resembled
    diamonds fringed by long curly lashes of gold. The full effect of those jeweled
    irises caught her by surprise as they roamed over her face.


    His voice washed over her like a silk caress. “If the mark had disappeared, perhaps
    it wouldn’t matter as much. But it does. I can’t explain why but now that I’ve
    seen it with my own eyes, it means you belong to me.”


    The atmosphere about the small table thrummed with an electric sensation. A high
    voltage shot of awareness that a destiny stunted twenty years ago was at last
    coming to fruition. From the knowing look in his diamond eyes, she knew he experienced
    the same unfathomable knowledge. By sheer force of his will, he refused to let
    her pull away from this magnetic connection.


    “You’re my wife, Gretchen.”


    Could that be why she’d never had success in her relationships because of this
    bond they formed all those years ago? Had she, despite her thoughts of the contrary,
    been waiting for him all this time?


    Her practical mind gained enough strength to shove away the drugging allure of
    his declaration. “No, I am not. There’s no court that would uphold our childhood
    marriage.”


    His eyes dropped from her. “Do you have a man, Gretchen?”


    The frank question threw her off kilter. “No,” she responded and then groaned
    at the admission of her single status.


    “I don’t have a woman, either.” He put his glasses back on again. “Don’t you think
    it’s rather strange we would meet twenty years later in a coffee shop in Mystery
    Canyon, Colorado, and we’re both unattached?”


    Where was this conversation going?


    You know where this is going, her heart cried out. And you want it to go there.


    “It’s coincidental,” she sniffed. “It could happen to anyone.”


    “But it happened to us,” Kwasi said in a tone that brooked no argument. “I don’t
    take things like this lightly. You were my best friend and my wife. We had it
    before. We can have it again.”


    “Over my dead body!” Two voices in perfect harmony interjected with virulent denial.'
