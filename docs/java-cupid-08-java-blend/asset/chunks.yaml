    Kwasi straightened from the counter. Even through his tinted shades, he could
    see the kind of sexy she wore. A dignified, look-but-don’t-touch air exuded from
    her. She had a long neck with a deeply grooved clavicle he imagined he could pour
    strawberry champagne into and lick it up.


    He continued to eye her while she moved away from the door to answer her phone.
    The black licorice hue of her skin caught his attention more than anything. In
    the sunlight, it had a luminous sheen to it as if she were lit from within. That
    pure, satin smooth darkness made him aware of their differences.


    Growing up as he and Kojo had had, his thoughts about skin color had been pervasive
    ones. The fact he had no color had rubbed him the wrong way for a long time. Had
    he ever accepted it? Until this moment, he thought he had. After all, no one could
    live through their hellish childhood and not be screwed up in the head.


    The phone call ended and she placed the phone into a purse strapped to her shoulder.
    The woman started strutting his way and a chill went through his body. Kwasi hadn’t
    felt this nervous since he had to sing the national anthem in high school.


    A languid grace accompanied each sway of her hips, slicked by an off-white crinkly
    dress that skimmed several inches above her knees. The material hugged every curve
    and yet had a modest touch to it. It further solidified the queenly, cool attitude.


    She came and stood behind him but her eyes didn’t look in his direction. Instead
    he saw her lean a little forward, eyes on the menu in the stand next to him.


    He had to talk to her, say something. Anything!


    “You need a menu?”


    The instant he said those words, he wanted to slam his head onto the top of the
    glass counter. Really, that’s the best he could do?


    She turned her gaze his direction and his heart almost thumped out of his chest.
    The shades’ tint concealed her eye color but the white of them against that dark
    skin gave her a doll-like expression.


    “Thank you. If you wouldn’t mind?” She arched a silky, waxed eyebrow. Her voice
    had a cool, oh-so-very polite tone to it. Was she really as frigid as she put
    on?


    “Sure, no problem.” He grabbed the menu and handed it to her.


    Carefully, she took it from him with a small smile that didn’t reach her eyes
    and bent her head over it.


    That really should have been the last of conversation. It was apparent she didn’t
    want to talk anymore. But the challenge she presented made him want to take her
    up on it.


    “See anything you like?”


    “No, not yet.” Again, she gave him a pleasant smile with a hint of coolness to
    it. He could tell from her body language—and what a language it was—she didn’t
    want his conversation.


    It only whetted his appetite to see if he could get past her reserve. “I’m trying
    the new Java Blend tea myself. I don’t know how people can drink coffee.”


    Kwasi again had the urge to slam his head into the glass counter. Jeez, coffee?
    Upping his game to ‘coffee’ conversation? Why not talk about the weather and bore
    her to death?


    He expected this black beauty to leave, but a real smile came and stretched the
    corners of her mouth. The frigid demeanor melted away like ice on a window. “I
    don’t understand that either. Coffee is so bitter.”


    Kwasi’s mouth almost dropped to the floor. The coffee line actually worked?


    He hurried on before she discovered how lame he really was. “I know, right? I’ve
    tried it with every sweetener known to man and I still can’t abide the stuff.


    “Tea has a stronger, milder flavor.” She toyed with the edge of the menu. “Especially
    a hot tea on a winter day. Glides down the throat just right.”


    His eyes traced the long slim column of her neck. Two sharp nubs at her collar
    bone enhanced the deep grooves on either side. He imagined tasting the satiny
    smoothness of her skin. His tongue would lap at the rounded caps of her shoulders,
    and then he’d—


    “Which one did you order?”


    Kwasi jerked slightly. Helplessly locked in the fantasy he conjured up, he almost
    didn’t catch the question. “Java Blend. The new one. Vanilla cream and chocolate
    essence. Can’t beat that, can you?”


    “Sounds interesting. I’ll have one, too.”


    Kwasi bent his head back and hollered at Jeb. “Jeb, make two of those for me.”


    “Gotcha covered!” came the reply.


    Kwasi shook his head in mock sorrow. “That’ll be another fifteen minutes.”


    The woman smiled. Its brilliance came through like a ray of sunshine. “Yeah, he
    does take a while but he’s a good barista. I’m in no rush.”


    Transfixed by the brown ruby mouth with its full, plump lips and even, white teeth,
    Kwasi blurted out, “What’s your name, girl?”


    The smile dropped from her face as if it had been wiped off. In a single instant,
    her coolness returned.


    She placed the menu back on the counter. “It certainly isn’t ‘girl’.”


    “Aww, c’mon, boo.” Could he make her smile come back? “I’m just trying to get
    your name, that’s all.”


    “Nor is my name ‘boo.’” She folded her arms. If that didn’t scream ‘don’t talk
    to me’, he didn’t know what did.


    “Well, it certainly isn’t ‘ugly’ so I’ll have to keep on guessing until you tell
    me.”


    The woman blinked. “You’re going to guess my name?”


    Intrigued by the whole idea of getting past this sister’s reserve, Kwasi gave
    her a slow smile. “Yeah. It’ll pass the time while we’re waiting on our tea.”


    A myriad of emotions passed over her face. He waited. Patience was something he
    never had a problem with.


    “Okay. If you guess my name, I’ll pay for our teas.”


    Kwasi scoffed. “Oh no. If I guess your name, I’ll need something more rewarding
    than a cup of tea.”


    She stiffened. “Rewarding such as what?” Her voice rose an octave in disbelief.
    “If you’re thinking—”


    “Calm down,” he said softly, laughing at the outraged look in her face. “All I
    meant was I’d like the pleasure of your company if I do guess your name. Just
    join me for a few minutes.”


    Her shoulders relaxed. “Sure. Well, go ahead. Guess.”


    He threw his head back in merriment. This woman was a study of contradiction.
    Standoffish and shy with an allure made all the more enticing by this surprising.

