    # PROLOGUE


    ![](images/00001.jpeg)


    Five people occupied the dilapidated hut. Dust particles floated in the thin slices
    of sunlight allowed to penetrate the dark interior through breaks in the wood
    walls. Two of the occupants, a man and a woman, sat bound and gagged against the
    wall facing the closed entryway. The captive man sported swollen eyes and a cut
    lip. A long scar trailed the right side of the woman’s face, flecked by dried
    spots of blood.


    The other three occupants, all male, stood before them. Two of the men, armed
    with spears decorated in bright yellow cloth, flanked the third.


    The third squatted down. Dressed in a red shirt and white, immaculate pants with
    black shoes, he stood out in the small space. Around his neck rested a necklace
    of delicate finger bones, separated by rubies.


    Pulling a long, bulging cigar from a pocket on his shirt, he sniffed it.


    His yellowed eyes flickered back and forth between the bound couple.


    “Do you remember when you gave this to me?” He coughed as soon as he finished
    the sentence, the sound harsh and dry like the dried tobacco leaves his cigar
    was made from. After the brief hacking spell, he retrieved a gold cigar cutter
    from the same pocket.


    “It was a fine gift.” He saluted them with the cigar. “Thank you.”


    The man in red spent an inordinate amount of time making a production of cutting
    the tip of the cigar and then lighting it. He inhaled for several seconds until
    the tip of the cigar glowed like a tiny sun. He exhaled the smoke into the faces
    of the man and the woman.


    “Good flavor. Dry and sweet. Sort of like the both of you.”


    He continued to smoke the cigar. With his free hand, he fingered the bones around
    his neck. His black, soulless eyes landed on the woman. Her eyes above the dark
    cloth shoved between her teeth widened in fear.


    “After today, I won’t be asking you any more questions.” He knocked the ash on
    the floor. “This is the last chance because after today, you won’t ever have to
    lay eyes on me again.”


    Smoke curled around them. The sweet smell of the cigar permeated the room. The
    bound man coughed behind his restraint and then groaned at the resultant pain.


    “Sore ribs?” The man in red queried.


    A baleful glare blazed from the prisoner’s eyes.


    The man in red stood and gestured to the guard on his right. “Her.”


    The guard took a knife from the belt around his waist and went over to the woman.
    A flash of silver and the cloth tied around her mouth fell away.


    Her mouth opened but the man in red silenced her with a deadly look. “Be very
    careful what you say.”


