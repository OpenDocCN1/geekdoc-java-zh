    psycho nut had tried to ruin his relationship with his girlfriend so he went on
    Facebook and had his followers all trying to get her to forgive him. It was so
    romantic.”


    Kwasi glanced over at the guy again. “What does he do?”


    “He’s a romance novelist.”


    “I see.” Having lost all interest when she said that, since there wasn’t any chance
    he’d ever read a book of fiction, much less a romance novel, he steered the conversation
    away. “What is it you do?” he asked as they sat down.


    Gretchen took a sip of her tea. “Umm. This is so good. That hint of chocolate
    essence and vanilla is really hitting the spot.” Her tongue darted out across
    her lips. Kwasi’s stomach muscles tautened in reaction. The brief flash of pink
    reminded him of the fruity center of a dark chocolate wrapped candy.


    What would it be like to taste—


    “To answer your question, I’m the head director of aboriginal and tribal acquisitions
    for the Whitehead Museum.”


    Her answer broke off his fantasy about tasting the sweetness of her inner mouth
    but intrigued him nonetheless. “I’ve no idea what that means.”


    A surprised high-pitched sound of laughter bubbled from her. “I like your honesty.
    Most people would just nod their head and act as if they know.”


    Kwasi took a sip of his own tea. It was good. “Not me. I’d rather be ignorant
    than pretend to be smart. Ignorance is something you can fix, after all.”


    She nodded. “Well, it’s sort of like a curator. Whitehead has a lot of different
    collections they showcase, but my field of interest and specialty is tribal cultures
    with an emphasis on African and aboriginal artifacts.”


    “How did you get interested in that?”


    She hesitated for a moment and a fleeting expression of wariness entered her eyes.
    Before he could question it, she replied.


    “I found an arrowhead decorated with tribal markings.” Her eyes stared at a memory
    only she could see. “I remember holding the arrowhead in my hand, and being awestruck
    at ten years old. It was a piece of the past in my hand. Some warrior had once
    held this in their hand hundreds of years ago.” She emphasized her words with
    an errant wave of her arm. “This warrior, whoever he or she was, didn’t have the
    technology or the advanced knowledge of our modern times and yet, the arrowhead
    survived.”


    She hunched her shoulders. “Ever since I’ve been hooked.”


    The passion for her chosen field was evident in her voice. He liked that. “Sounds
    like an Indiana Jones type of job.”


    Her full lips twitched in amusement. “I left my whip and cowboy hat at home.”


    An image of Gretchen’s lithe figure holding a whip, tilting back a cowboy hat
    while wearing nothing more than a gun holster and a smile burned his brain. He
    almost broke out in a sweat.


    “It can be.” Her words interrupted his overactive imagination once again. “Over
    time, I’ve narrowed my focus to tribal and other similar cultures. I’ve gone on
    some excavations, interned with a couple of anthropologists, and other field work.
    I’ve even had a couple of papers published.”


    A wide smile creased her dark face with a set of brilliant white teeth.


    “When you say papers published, I take it you mean…” he let his voice trail off.


    “Scholarly papers with long titles and big words.” She waved her hand in a nonchalant
    way and then picked up her tea again. “Wow, this tastes so good, don’t you think?”


    Kwasi felt his eyebrows draw in. If he didn’t know better, he’d swear she was
    blowing him off. Whatever for?


    “What did your papers talk about?”


    Her large, doll-like eyes blinked. “You really want to know?” A doubtful expression
    came onto her face. “I know you said ignorance can be fixed but I hardly think
    you’d be interested in—”


    “What makes you think I wouldn’t be interested? You think I’d be too dumb to understand
    what you’re talking about?”


    He couldn’t keep a hint of acid out of his voice. One thing he and his brother
    had dealt with their entire life had been people underestimating them. A profound
    disappointment settled in his chest. Even this fascinating woman with her silky
    dark licorice skin attempted to box him.


    “It’s not that at all.”


    “I wouldn’t ask you if I didn’t want to know.”


    Their gazes collided. Around them, the café hummed with activity but they might
    as well have been the only two people in the world. Could she pick up on the words
    he didn’t say? He wanted to know everything he possibly could about this woman?


    “My apologies.” She broke their eye contact and swirled the contents of her cup.
    “I’m so used to people getting bored when I tell them what I do. No one seems
    interested about history anymore. I’m used to saying the basics and moving on
    in the conversation.”


    His heart beat a little faster in his chest. So, she didn’t think he was dumb!
    The disappointment vanished, replaced by elation. “You’re not boring me in the
    slightest. If you were, I know how to change the topic to the weather with the
    best of them.”


    Gretchen laughed again and he was struck anew by the contradictions. Reserved
    but passionate, intelligent yet not snobbish. And that was just over a cup of
    tea. The first layer.


    “The first paper I published dealt with my call for certain governments to let
    uncontacted tribes have entrance into the modern world.”


    Kwasi frowned. “I don’t understand.”'
