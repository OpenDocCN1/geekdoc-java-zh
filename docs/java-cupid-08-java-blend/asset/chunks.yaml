    毕竟，她在男人身上从未获得过多少成功。事实上，少得怜。对于大多数男人来说，她的肤色太深，对某些人来说又太瘦了。当她的外貌和体重不是问题时，她又聪明到无法装傻，又独立到无法假装无助。


    当任何男人对她表现出一丝兴趣时，她本该高兴得跳起来才对！


    但真的，“女孩（girl）？”“女孩”这个词意味着她是那长长女性队伍中的又一个。他不记得所有女人的名字，于是就给了她一个通用的绰号，为了让某些愚蠢、刚出生的女孩心动。


    不过凭他的长相，并不难想象有一排女性正排队等着从这口高大的香草奶昔中啜一口。更不用那对大大的、可亲的嘴唇，让她想起了俗语中的“点睛樱桃”。


    “格温（Gwen）？”


    她摇了摇头。他绝对猜不到的。不过，她心里也希望他能猜到。杰布还需要大约五分钟，所以她有时间。


    “格伦达（Glenda）？”


    一张漂亮而残忍的浅色脸庞在格蕾琴（Gretchen）努力躲避左右击打时嘲笑的记忆浮现在她的脑海中。


    “再也别那样叫我了。”


    苦涩让她的声音变得尖酸。这位准求婚者墨色眼镜后的眼睛放大了。她的反应不仅让他惊讶，也让她自己感到惊讶。十年过去了，但却就像昨天一样。


    她眼前的帅哥举起手。“好吧，”他拖长了词，“看来我触碰到你的神经窝了。”


    触碰到神经窝？不如说他在地雷上砸了一柄大锤。“你确实碰到了。”这一刻的趣味消散了。她无奈地叹了口气，“听着——


    “噢不，”他摇了摇手指，“我还有机会猜猜。”


    “你不必——”


    “噢不，这很有趣。”


    格蕾琴眨了眨眼。他看起来确实很开心。他的眼睛里闪烁着趣味。太太开心了。是以她为代价的吗？她以前曾是这个笑话的对象，但她不会再像年前那样默默忍受了。


    “好吧，我不会站在这里等你猜一整天的。”


    他后仰头大笑起来。他凸出的喉结在他粗壮的脖子上起伏，被两侧宽大的肩膀衬托着。这让她意识到了他的阳刚气质。


    当他的笑声平息时，他推了推鼻梁上的眼镜。“你真不简单，不是？”


    “你什么意思？”


    他给了她一个性性的、少年微笑，但并没有回答，而是挑了一下眉毛。“吉塞尔（Giselle）？”


    “那是谁？”她被他迷人的嘴唇吸引，忘记了对话的内容。


    “嗯，不是你。”他再次审量着她，目光更加专注。“真遗憾。你看起来像个吉塞尔。”


    “你什么意思？”


    他的目光缓慢地在她身上上下游移。从脚尖到头顶。由于他炽热目光的影响，她的皮肤发麻。


    格蕾琴的喉咙收缩。这个长着厚实丰润嘴唇的男人真的想要她吗？认真的吗？


    做梦去吧。


    “吉塞尔让人想起精致、柔软且光滑的人。”他的声音低了一个八度。“让我想起了巧克力鲜奶油和焦糖酱。”他舔了舔唇，格蕾琴觉得她的衣服都要化为烟灭了！


    “你确定你的名字不是吉塞尔吗？”


    墨镜后的坦率直视几乎是在挑她否认。如果她现在能回到过去，她会告诉她的养母把她的名字改成吉塞尔，这样他就能对了。


    她不敢自己说话，而是摇了摇头。还没有哪个男人让她如此过口舌。


    “加布里尔（Gabrielle）？”


    一听到这个名字，她放松了一些，尽管他炽热的目光点燃了她内心的某种火花。“噢，我一直想被叫加布里尔。我觉得这是一个很好听的名字。”


    “嗯，那是天使的名字。”


    格蕾琴笑了起来。“先是‘女孩’和‘宝贝’，现在又是‘天使’。你的游戏开始变得很糟糕了。”


    尽管他对她的话笑了，但他的眼睛眯了起来。“我还有其他擅长的领域。”


    她可以相信。一个拥有如此自信、优越长相的男人，一定擅长其他几件事。事实上，是专家。格蕾琴看了一眼他的手。宽大且指尖圆钝。他擅长的事情是否包括温柔的抚摸和——


    哇！她在脑海中猛地一惊。她到底是怎么了？她不知道他的名字。过此而言，他正试图猜她的名字，所以为什么这些念头会像个初恋的十六岁少女一样在脑海中闪过？她是一个拥有两个学位和一份喜爱事业的二十七岁女性。她的感情生活可能很糟糕，但还有其他事情充实着她的生活。


    男人再次舔了舔唇。格蕾琴在，如果她扑上去强迫他吻她，他会报警吗。


    被自己荒谬的思绪困扰着，她清了清嗓子。“好吧，我对你自认为喜欢的那些事感兴趣，所以你可以停止了。”


    “还没到时候。”


    格蕾琴发现自己陷入了他那洞察一切眼睛的磁性吸引中。这就像被一只白洲豹强大而强烈的目光所捕捉。这既让她兴奋，又让她不安。


    “你太自信了，”她在一段短暂的沉默后终于说道，沉默中涌动着许多最好不要说出来的想法。“但不行。不会发生的。”


    男人微微点了点头。“我是个有耐心的人。我们继续游戏吧。暂时这样。”


    为什么那最后两个词听起来像是对后续的承诺？


    他又持续了十几分钟。尽管胃里那股挥之不去的诡异恐慌结依然在，她还是对着他的作剧咯咯笑了起来。


    香料的香气与新鲜烘焙糕点的黄油甜味融合，融入了她记忆中的这一刻。待在这里，享受一个男人试图进入她的裙下感觉很好。这仅仅是吸引力的表象，但她需要感觉自己值得。从部落女祭的村庄到精英社交的华丽舞会，再到权势女性的会议室，她还没有见过哪个不喜欢被追逐快感的女性。


    “你永远猜不到的，你知道，”他在试了一个怪名字后说道。


    “什么？你的名字不是‘戈尔刚（Gorgon）’？”


    她交叉手臂，假装地瞪他一眼。“你是说我看起来像个满脸蛇的女人吗？”

