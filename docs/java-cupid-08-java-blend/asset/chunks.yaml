  trans: '

    Gretchen 惊得魂飞魄散。她甚至没有听到或察觉到姐姐的存在。Gertrude 和 Kojo 并肩而立，他们张着嘴巴，瞪大着眼睛，脸上写满了惊恐的表情。


    “Gertie。到底怎么——”


    “你为什么要听这些狗屁话？”Gertrude 大叫道，“我们才不欠他任何解释。”她转过身对着 Kwasi，辫子在空中划过宽阔的弧线。“我姐姐并不是想伤害你，你明白吗？”随后她向前倾身，直到鼻子几乎触碰到
    Kwasi。她用一种冰冷的语气，低声说道：“你离她远点。”


    Kojo 抓住 Gertrude 的手臂，将她从正俯身逼近哥哥的拉了回来。“你最好让她离远点。”他手指指着他们两人，“你可以尽情自欺欺人，但她就是个毒药。”


    Kojo 眼神中的神色无法掩盖他正散发出的愤怒，那股热气足以灼伤 Gretchen 皮肤上的毛发。“你对我的家人做的已经够了。”


    “别用那种语气跟我姐姐说话，”Gertrude 咆哮着，与 Kojo 对峙着。


    “那你就别像刚才那样对我哥哥说话。”他指了指 Gretchen。“把她从这里赶出去。”


    Gertrude 双手叉腰。“你才把他从这里赶出去。”


    “不像你，我呆在这里是有理由的，”Kojo 直接反击道，目标像子弹一样精准。


    Kojo 和 Gertrude 之间的空气仿佛弥漫着噼啪电声。Gretchen 寻找 Kwasi 的目光，看到他的眼神中反映出同样的困惑。“嗯，这是你们的茶。”


    Jeb 把他们忘掉的两杯 Java Blend 咖啡放在桌上，然后快步回了收银台的工作区。Gretchen 此时注意到 Java Cupid 变得安静了。在他们周围，顾客们正带着尴尬又好奇的神情关注着发生的一幕。一些咖啡师也停下了手中的工作在观看。


    谁能怪他们他们呢？Kojo 和 Gertrude 绝对是在表演。人们多久能看到两双双胞胎挤在一张桌子上？即便如此，人们多久能看到这种像要爆发战争的敌意？


    Gertrude 和 Kojo 陷入了眼神对峙。他们的胸口剧烈起伏，仿佛经过了体力消耗，但 Gretchen 确定那是因为在努力克制情绪。


    她伸手去拿茶杯的同时，Kwasi 也抓住了他的。他们的目光交汇，随即又迅速移开。


    她和 Kwasi 之间发生了太多事情，但这次与各自双胞胎的对峙似乎有些不对。一种持续的、潜意识的、某种显而易见却又隐藏之的感觉困扰着她。在这场冲突中，她漏掉了什么？


    “Gertie，我们走。”Gretchen 握住温暖茶杯站了起来。Kwasi 也这样做。他们的对话结束了……暂时地。


    Gertrude 发出一声刺耳的“哈利路亚！”她钩住 Gretchen 的手腕，将她拉向门口。


    尽管内心的声音告诉她要盯着那扇带有标志的玻璃门，她还是回头看了一眼。Kwasi 盯着她的背影，尽管隔着咖啡馆的距离，信息依然清晰可见。


    这仅仅是开始。


    # 第六章


    ![](img/00001.jpeg)


    “那是怎么回事？”当他们共同居住的家门在身后砰地关上时，Kojo 质问道。“你疯了吗？”


    “我现在不想聊那件事。我原以为你会有别的事情要担心。或者说，该感到高兴。Don 签了合同，不是吗？”


    Don Bridges 在 Gretchen 和姐姐离开后几秒钟就离开了 Java Cupid。为了见面，Kojo 和他被迫放下了所有事情。


    “去他的合同吧！我想知道你脑子里到底在想什么？”


    如果现场还有点幽默气氛，哥哥脸上的不可信本该很滑稽。Kwasi 把车钥匙丢在厨房桌子上。“没什么不对劲。我们把这忘了忘了。”


    “我不能就这么放掉，Kwasi。那些伤疤不是装饰的。Gretchen 是留下伤痕的人。在知道这一点的情况下，你竟然还想要那个女人？”


    哥哥的痛苦渗透了整个厨房。Kwasi 希望有办法能让他理解。但当他漂浮在直觉和内心预感的洪流中时，又要怎么做呢？


    Gretchen 回到生活中（如果这真的是事实），那一定是上天赐的。与那个让他感到——在一起的第二次机会。


    “你你怎么可以不听我的？”


    “显然很费力。”


    Kojo 对这个反驳皱了眉。“哥，从逻辑上看这一会儿。当你所谓的结婚时，你才十一岁。在那个标记事件之后，Gretchen 告诉长辈们你有特殊能力。他们派了猎人来抓我们。我们为了生存逃命。我不确定那个恐怖故事里的哪部分你忘了，才让你表现得这么疯狂。”


    Kwasi 不希望 Kojo 的话穿透自遇到 Gretchen 后环绕他的那层幸福迷雾。然而，伴随着冰冷的刺痛，这些话打破了他拼命想要留在常识周围的雾气。


    “那天晚上你差点死掉。”Kojo 的声音微微颤抖。


    Kwasi 猛地看向哥哥。他们从未讨论过噩梦的那部分，现在也绝不会提。“我们不谈那个。”


    “我们要谈！”Kojo 用手抓了了自己的莫霍克头。“如果你没有把我推开，老虎会把我们两个吃了。”


    他的喉结上下滑动。“我当时差点自己吓死，”他的双胞胎带着泪水承认道，“血液直流背心。我心里冰凉了。”


    那天灼烧身体的痛苦与他经历过的任何事情都不同。“接着我听到 Luke 的枪发出巨响，他直接朝我的眼睛开了枪。”


    Kwasi 也听到了。感觉到子弹贴近脸部时的微风。Luke 如何瞄得如此准的这超出了他的想象。


    “然后 Luke 抓着我们我们就跑了。你当时晕过去了，但你救了我的命，哥。”


    他想起了上次见到老人的样子，他正和一个患有同样精神衰退的老妇调情。“他不记得妻子去世了。他不记得在村子的时光。但他还记得我们。”


    “即使他清醒着，他也不会怪我们的，因为那不是我们的错。”


    “她不值得，”Kojo 重申道，“我不在乎你对婚姻怎么想。”


    Gretchen 的脸占据了他的脑海。


    厌倦了这种争执，Kwasi 拿起了他的 Java Blend 咖啡。之前的信息再次出现：我的爱是世界上最纯粹的形式。

