    他从未想过自己会失败。他唯一怀疑的是他哥哥是否有能力比他先找到那些白化病者。一旦他获得了他们的骨头，他的护身符力量就会增强。他必须保护自己免受灵魂的侵害。


    他唯一的担心是这些白化病者的年龄。其他的都是孩子，但这两个已经成年了。这会影响他护身符的威力吗？


    只有一个办法可以弄清楚。


    “你会乖乖来我的，而且不要报警警察。如果你敢报警，我就杀了格蕾琴。”


    “是你是从长者那里买下我和科乔的。你杀了多娜！”


    抽着雪茄的男人抿了起嘴。“我确实是通过长者买下你们的，但他们骗了我，还把你和你的双胞胎卖给了我哥哥。他们已经不在了，没法再阴险了。”


    他让这些话的含义慢慢发酵，让他的猎物在那里品味几分钟。至于格蕾琴·奥辛加，她保持沉默是个很乖的女孩。他知道她不想再被电击一次了。


    在长时间的沉默后，夸西（Kwasi）的声音从电话里传了。“你想让我去哪儿？”


    “我不只要你一个。我要你们两个。如果万一，你哥哥联系了警察，那么我就杀了格蕾琴。明白了吗？我等得太久了，我的耐心已经尽了。”


    胜利的味道真是妙极了。等那些白化病者被牺牲后，他将让双胞胎哥哥请来的萨满举行适当的仪式，并将他们的精华加入项链中。


    然后，他要看看双胞胎哥哥能不能做得更好。


    ![](img/00002.jpeg)


    格蕾琴的身体在颤抖。恐惧用细细的牙齿啃噬着她的心，一点点吞噬着她的勇气。她咬住唇，防止尖叫。


    随着容器的摇晃，她痉挛的身体感到作痛。电击的影响已经消失，但记忆在很久很久之后依然挥之不去。她再也不想体验一次电击了。


    为什么会发生这种事？她没多少钱。不怎么追捧。也没有通过非法手段获利。那么为什么这个男人要绑架她？他说的双胞胎哥哥又是什么意思？


    容器的屏障隔绝了声音，但她能听出男人在说话。他在和谁说话？同伙吗？


    泪水在眼角汇聚。万一她再也见不到夸西了呢？他们刚刚找到彼此，互相原谅。这个男人，无论他是谁，会夺走她幸福的机会吗？


    不。她的双唇紧了紧，尽力地擦掉眼泪。不。她必须找到办法逃离这个困境。


    但她需要帮助。那种只有一个人能提供的帮助。


    她闭上眼睛，将所有的思想集中在一个影像上。然后她低声说道：“我你。”


    容器的动作突然停止了，她猛地睁开眼睛。心脏在胸腔里剧烈跳动，她想的是件事：格特鲁德（Gertrude）会回应求救吗？


    # 第章


    ![](img/00001.jpeg)


    夸西和科乔（Kojo）在猎场的路边停下车，面色严峻。这是二十年前的事。也许是白昼，太阳正处于顶点。他们可能不再是那些因为村子里生活饮食单一而营养不良、因为肤色缺乏色彩而被排挤的瘦弱男孩了。但一切和二十年前完全一样。


    他们是被捕猎者。


    “你知道自己在做什么吗？”科乔在下车时问道。


    “不，我不知道。我凭直觉行。”


    夸西想这会不会是他在地球上的最后一天。电话里的男人说得很清楚：不准带枪、刀或任何种武器。如果他看到一支尖头铅笔，格蕾琴的生命就会危险。


    恐惧的冷指掠过他的脊脊椎。格蕾琴不能出任何事。


    “万一他——？”


    “我不怀疑他已经做了什么伤害她的事，”夸西在科乔说完之前说道。“他需要确保我们单独过来。如果他杀了她……” 这句话让他屏住了呼吸。不，他不想往那方面想。


    他们穿过森林通往目的地。林间的碎片在脚下被踩碎。惊慌的动物在他们面前奔跑寻找食物。风在树林间吹动、吟唱。在其他任何一天，森林的声音本该受到欢迎。


    但今天，这毫无意义。


    “看那间木屋。”


    夸西抬头看到一座木屋几乎就在他们正前方。它和任何其他木屋没什么区别，除了一点。他的妻子正被困在那个木质的掌控之中。


    格蕾琴，请一定要没事，他祈祷道。


    当他们靠近门时，门开了。男人用枪指了点他们。“进来，别想耍花招。”


    夸西举起手，和科乔一起走进木屋。屋里简陋且荒凉，有两个在场的人。一个拿着枪，对着他和他兄弟挥舞着。另一个是格蕾琴。她坐在一个巨大的金属容器旁边，双手被反绑，嘴里塞着一块布。


    夸西的心掉到了地板。这和卢克（Luke）很多年前描述的一模一样，每一个细节都吻合，看到格蕾琴像当年的多娜那样被绑着。那是多娜死亡的结局，也是夸西和科乔逃脱的催化剂。


    他的血液变得又冷又热。他没有打算在不战斗的情况下放弃格蕾琴。不逃跑。


    “哎，你们两个可真是赏心悦目，”男人笑着说道。“等我拿到你们的骨头，我将拥有最幸运的护身符。”


    “你为什么要买我们？”夸西问道。他把脸偏向兄弟。如果他们制定的计划有效，那么他们只有一次机会做对。任何其他结果都是灾难性的。


    夸西盯着这个男人，这个男人这辈子一直在追捕他，尽管他并不知道。


    “我买你们是为了你们的骨头。白化病者的指骨是制作护身符最好的材料。”他说话语气如此平淡，以至于夸西几乎以为他们是在谈论天气。


    男人伸手进衬里掏出项链。它像圣诞灯串一样挂在他的一手指上。小小的骨头。为了制造它，这个男人杀了多少白化病儿童？


    “我哥哥很快就会到。他会带着萨满过来。我决定大慨一点，给你们一个作为他自己的护身符。”他对着科乔抖了一下枪，命令道，“去她旁边把绳拿来。”他扣上扳机。“无论你们做什么，别想耍花招。”


    科乔回头看夸西，夸西一眼就看穿了他的心思。现在是成败一刻。


    他的哥哥似乎正要走向格蕾琴，这时他突然猛向前，将身体撞进了他们的劫匪身上。这个动作几乎快得超自然，在哥哥撞上他之前，男人没有机会扣扳机。枪掉在地上，发出一声响。夸西踢到房间的另一侧。


    愤怒和肾上腺素在他体内奔涌，他冲过去帮助兄弟。科乔锁住了男人的脖子，男人在锁抱中挣扎。夸西握紧拳头，重重地砸在男人的鼻子上。骨头碎裂，血喷涌般涌而出。男人口中发出一声非人的惨叫，但夸西又击了一拳，击中了他的眼窝。


    “拿下他，”科乔严冷地说道，男人已被制服，无法挣脱。

