    她再次环视着咖啡馆，目光与一个坐在轮椅上的深色男子那双浑黄的眼睛撞了在一起。那脸上布满了深深的皱纹和大小不一的疣。如果根据那些皱纹判断，他大概五十来了。他穿着一件带胸口袋的灰色衬衫，雪茄尖从边缘露出一角。


    不知道为什么，他那双黄色的眼睛仿佛抓住了她。时间越拉长，一条不安的蠕虫就爬过她的全身，让她手臂上起了一层鸡皮疙瘩。为什么一个陌生人的直视会让她感到如此……恶心？他为什么不移开线？


    男人笑了，露出两排黄牙。他沉默地点头表示示意——为了她并不所知的事情——然后收回了那如磁石般的目光。


    接触中断的瞬间，她长舒了一口气。她转过头，又对上了另一双被墨色眼镜遮住的眼睛。


    在过去的三天里，她在梦中见过那双眼睛。现在，它们是真的。


    `Kwasi`。


    他左侧的一个动作让她注意到了他。那是另一个 `Kwasi`，头中间留着一个短但浓密的金色莫西干头。


    `Kojo`。


    他们真是一好一对。两个白化人非洲裔丘比特神，那身材足以让修女违背她的誓言。但她的目光流留在 `Kwasi` 身上。


    “还有别的吗，Ozinga 小姐？”


    格蕾琴（Gretchen）猛地惊了一下。`Chung` 校长和 `Carter` 校长意味深地对她微笑。


    热气烧红了她的脸。“对不起，你们刚才说什么了？”


    `Carter` 校长的眼中闪烁着幽默。“我们只是想确保没有漏掉任何事情。”


    “是的，当然。”噢，真希望脚下能有个洞把她整个人吞没！“除非你们还需要什么？”


    “不用了，再次感谢。”


    校长起身离开。`Chung` 校长俯身在她耳边低道：“如果我再年轻十五岁且单身，我现在应该正顺势直接自己倒在地板上。”


    格蕾琴忍不住笑了起来。


    校长们最后点了点头示意后离开了。格蕾琴知道自己应该跟上他们，但她无法挪动。相反，她抓起那杯 `Java Blend`，又大喝了一口。


    过来吧，她在心里默默唤着 `Kwasi`。来我这儿。


    她用余光瞥了他一眼。兄弟俩正陷入一场克制但激烈的争论中。`Kojo` 散发着明显的敌意波动，而 `Kwasi` 的侧脸则像石像一样冷。几秒钟后，`Kojo`
    挥了挥手，冲出了咖啡馆。


    当 `Kwasi` 的目光再次对上她时，她无法回避。他穿过稀疏的咖啡馆桌子，路过端着脏盘的 `Charlie`，以及聚在皮沙发上大声闹的人群。


    他的眼睛从未离开过她。


    随着他走近，格蕾琴紧张地咽了口唾水。他穿得保守一些，一件领口敞开的长袖褐色衬衫搭配黑色直筒勾勒出腿部线条，营造出一种从容优雅的气质。无懈可击且接地气。修饰整洁且舒适。然而，像三天前一样，他依然让她屏息。


    他那张美丽的嘴，丰满多汁的双唇，让她喉咙里的水分都蒸发了。


    专注，格蕾琴。


    她需要提醒自己，一个为二十年前发生的事请求原谅的机会已经到来。半成形的道歉应该是她脑海中唯一的事情。而不是对他亲吻的渴望。


    他在她的桌旁停下。她仰起脖子。很高。


    “嗨，格蕾琴。”


    “`Kwasi`。”


    他双臂交叉胸前，绷起面料，露出胸口的 V 字形。一道深凹沟平分了他的胸肌，光滑且没有任何毛发。他只需要在身上抹点油，他真的会——


    “我想和你谈谈。”他挑起眉毛。“可以吗？”


    她在心里清醒了一下神，点了点头。“当然可以。”她指了指玻璃桌另一侧的座位。利用她的超能力，她让自己的声音听不出内心颤抖的恐惧。当他坐下时，他的香水弥漫进她的鼻腔。那是一种辛辣温暖的气息，她贪婪地吸入肺。


    片刻，他坐在那里，望着远方。格蕾琴静静坐着，留给他时间整理思绪。毕竟，她有些事需要解释。


    “我该从何说起？”他说，但我这更多是因为他的心情，而非真的在询问她。他接下来的话证明了这一点。“我有太多想——不。我有太多需要知道的。”


    他叹了口气，肩膀垮了。她压制住体内从未感知过的汹涌荷尔蒙，给了他所需的关注。


    “`Kwasi`，我——”


    “不，格蕾琴。”他举起一只手。“二十年后，我觉得我有权先发言。”


    她咽下了反驳，简短地克制点头。“说吧。”


    他抬头看向她的眼睛。眼神深处透着一丝凄凉。“我知道你那时还是个小女孩。才六岁。我十一岁时也没有成熟到哪去。但我必须知道：你为什么告诉长老我有魔法力量？”


    如果自从他坐在她对面以来，困扰着她的一丝女性欲望，在他话出口的刻也消失殆尽了。


    “妈妈病了，”她开始说道。“非常严重。”脑海中浮出母亲倒在地上的画面，胸口像葫芦里的干种子一样咯咯作响。

