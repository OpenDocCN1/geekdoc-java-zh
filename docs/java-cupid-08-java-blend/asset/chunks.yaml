    She gathered her purse. “It was good meeting you.” She fell back on her polite
    mask. “And fun playing the guessing game. Thanks for the tea.”


    There. She’d tidied up everything nice and tight.


    “Why are you suddenly running away?”


    Gretchen froze. “Huh?”


    He leaned forward. “Why are you running away? I thought we were having a good
    time. At least, I was.”


    She tried to look away from his penetrating gaze but she found herself once more
    locked by his hypnotic pull. “I’m not. I have an appointment.”


    “What time?”


    Her mind went blank. “Um—”


    “You don’t have to leave,” Kwasi responded before she could attempt to think of
    a suitable reply. “I will.” He swallowed the contents of the cup. As he did, his
    Adam’s apple bobbed up and down, drawing attention to his masculinity.


    Setting the cup back on the table, he sent her a brooding look. A droplet of tea
    hung on his mouth. It tantalized her to wanton thoughts and desires even as the
    apprehension grew.


    So much had changed since they were children. After all, she’d never thought she’d
    see Kwasi and Kojo again. The childhood friends of her youth had transformed into
    men with unsurpassed ability to turn the heads of many a female. He certainly
    turned hers in a 360-degree angle.


    “You know, if you didn’t really want my company, you could have said so.” He rose.
    “You have a good day.”


    Gretchen fought a hard battle. On one hand, by offending him, he’d never guess
    her identity. The secret of their past would remain safe.


    Another part of her refused to let him leave thinking the worst of her. Or maybe
    she should? She groaned. Why couldn’t she make up her mind?


    “Kwasi, wait.” The words were out of her mouth before she could stop them. Bells
    of alarm rang in her head.


    “No, Gretchen. We don’t know each other. But you at least could have been up front
    about it. I’ll be seeing you.” He let out a harsh, humorless laugh. “No, actually.
    I won’t be. Goodbye. It was my mistake to think you would be different.”


    Her brow furrowed as she nervously bit down on her lip. “Different? What do you
    mean?”


    An arrogant lift of his eyebrow gave him a sexy, devilish look.


    “Now you’re curious? Well, don’t be.”


    He left the table and headed toward the door. A tall man bumped into him and besides
    a quick apology, Kwasi moved on. Strangely enough, Kwasi held onto the empty cup
    in his hand instead of throwing it away in the nearby wastebasket.


    Gretchen watched him go, torn between a new, hitherto fore unknown desire of feminine
    pursuit, and the self-preservation of anonymity.


    Should she let him go? It would be better for both of them if she did. On the
    tail end of that thought came another. A theme of her life she’d kept with her
    through every major decision she’d had to make. Life was too short for ‘what if’s’.


    She got up slowly and looked down at the message on the tea cup. “Love forgives
    everything, even death.” Would she ever discover if such a sentiment was true
    if she let Kwasi walk out of the Java Cupid café.

