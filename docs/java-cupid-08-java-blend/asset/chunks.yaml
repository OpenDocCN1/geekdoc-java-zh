    “Not a thing,” Kwasi answered as Jeb opened his mouth. “I’ll take care of it.”


    She frowned. “But you lost the game.”


    “I want the enjoyment of your company,” Kwasi said, to her shock. “What man would
    give up an opportunity to sit and talk with a beautiful woman?”


    If this was the Kwasi, how he would react if he knew of their past connection?
    A past so fraught with pain she still had a hard time thinking about her early
    childhood. Would he still consider her attractive?


    “Come on, Gretchen. Sit with me. Let’s talk for a few.”


    That was the problem. His allure made her long to succumb to the invitation in
    his eyes. That and his big juicy lips she had a hard time dragging her eyes from.
    But if this was the Kwasi and if he knew who she was, the last thing he’d want
    to do is talk to her.


    He’d want to kill her


    “Please?” He batted his eyes in a mock, coquettish way.


    Her eyes scanned him anew. This specimen of sexy was so different from the pale,
    gangly boy of her past. She stared at his smile. Those pink grapefruit lips. They
    looked like the kind that, once latched onto a woman’s body, they wouldn’t leave
    it until he was good and ready.


    But if he was who she hoped he wasn’t, he’d already fastened that plump mouth
    onto her with devastating results.


    Was he the Kwasi? The one she almost killed when they were children? There was
    only one way to find out.


    He held out a hand and let it hang in midair. She gazed at the well-formed hand
    and decided to throw all caution to the winds. Taking in it her own, an electric
    shock bolted through her. She gave it a little squeeze. “Sure, why not?”


    # CHAPTER TWO


    ![](images/00001.jpeg)


    Kwasi wondered where the apprehension dominating Gretchen’s face came from. Surely
    it couldn’t be from sharing a tea together. With his characteristic nonchalance
    his twin brother hated, he dismissed it from his mind. No matter. As long as her
    nerves, or whatever it was lurking behind those wide eyes, didn’t impede his desire
    to be in her presence, he wouldn’t let it worry him.


    Releasing her soft, cool hand, he tapped her cup with his in a mock toast. “Cheers.”


    She grinned, albeit the corners of her mouth were shaky. “Cheers.”


    Meandering their way over to a table drenched in sunlight from the giant glass
    windows framing the parking lot, he paused when he heard Gretchen gasp.


    “What is it?” he asked.


    Her eyes were glued to a table where a couple sat with a small group of ladies.
    “Oh, my gosh! That’s R. G. Donovan and his wife, Aurora!”


    He looked over at a nearby table. Not knowing what the big deal was, he responded
    with a curt, “Okay.”


    She whirled around like a ballerina. “Surely you must have heard about it? Some
    psycho nut had tried to ruin his relationship with his girlfriend so he went on
    Facebook and had his followers all trying to get her to forgive him. It was so
    romantic.”


    Kwasi glanced over at the guy again. “What does he do?”


    “He’s a romance novelist.”


    “I see.” Having lost all interest when she said that, since there wasn’t any chance
    he’d ever read a book of fiction, much less a romance novel, he steered the conversation
    away. “What is it you do?” he asked as they sat down.


    Gretchen took a sip of her tea. “Umm. This is so good. That hint of chocolate
    essence and vanilla is really hitting the spot.” Her tongue darted out across
    her lips. Kwasi’s stomach muscles tautened in reaction. The brief flash of pink
    reminded him of the fruity center of a dark chocolate wrapped candy.


    What would it be like to taste—


    “To answer your question, I’m the head director of aboriginal and tribal acquisitions
    for the Whitehead Museum.”


    Her answer broke off his fantasy about tasting the sweetness of her inner mouth
    but intrigued him nonetheless. “I’ve no idea what that means.”


    A surprised high-pitched sound of laughter bubbled from her. “I like your honesty.
    Most people would just nod their head and act as if they know.”


    Kwasi took a sip of his own tea. It was good. “Not me. I’d rather be ignorant
    than pretend to be smart. Ignorance is something you can fix, after all.”


    She nodded. “Well, it’s basically finding artifacts from indigenous cultures and
    bringing them to the museum for preservation. It’s a lot of travel and research.”


    “That sounds interesting,” Kwasi said. “Have you ever been on an expedition yourself?”

