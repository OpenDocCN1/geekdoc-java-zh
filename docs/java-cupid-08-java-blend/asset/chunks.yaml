    洛尼同情地摇了摇头，但目光依然清澈，说道：“这么想吧：如果你做不到这些，他们就会给他们灌输一些科学教条。有些脑筋会告诉他们土住民文化是多么落后。这样，那些孩子以后在电视上看到他们时，只会把他们看作怪胎，而不是平等。”


    她的嘴唇抿起。随着科学好奇心和进步的兴起，越来越多的学生被灌输要关注未来，而对过去毫无兴趣。她的责任是确保自己尽所努力劝阻他们这种想法。对历史的无知会导致明天的错误。


    “我会想办法解决的，但我们必须面对面。不能全部通过邮件。”


    “我会告诉他们的。也许我们都可以在‘咖啡之神’见面。”他那绿色的眼睛闪烁着光芒，“我等不及看看我的杯子上会不会收到信息。我很想见到我的真爱。”


    格蕾琴浑震了一下。洛尼的眉毛挑了起来：“你还好吗？”


    不，我不好。“当然了。我们可以在那里见面。定好日期，好吗？”


    洛尼简短地点了点头离开了。她在键盘上飞速敲击。翻遍了联系人列表，恳求她的当地土住民文化专家网络参加这次活动。大多数人不情愿地接受了，因为他们的观点反映了她自己。


    过了一会儿，她抬头对上了房间另一头那个小助手玩偶阴沉的目光。工作的焦虑瞬间消失了。它的头歪向一侧，仿佛在说：你等不及再次见到他了，对吗？


    “不，”她对着寂静大声说道，“我等不及再次见到他了。”


    ![](img/00002.jpeg)


    杰布正拿着手机刷着社交媒体动态，这时一个高大深色的阴影挡住了阳光。


    他忍住叹息，放下手机抬头看向顾客。那男人有一张黝黝、像皮革一样的脸，眼睛看起来发黄，像图腾柱一样高高站在他面前。


    “欢迎来到‘咖啡之神’，我们心心咖啡。我是杰布。我能为你点什么吗？”


    男人靠在柜台上，身上散发着浓烈的雪茄味。那味道太冲了，杰布几乎因为这种刺鼻感而咳嗽起来。


    “嘿，我恰好听到你和那个留金色爆炸头家伙的讨论。”那个男人的声音有明显的沙哑感——轻微而刺耳。这让杰布想起金属格栅在水泥路面上拖动的声音。


    “怎么？”杰布脖子上的毛竖起来了，但他不知道为什么。


    “你们在谈论你们有的新茶？”


    “哦，曼加调配咖啡。是的，夸西非常喜欢。也许你也会喜欢。需要我帮你去拿吗？”


    男人眯起了眼睛。尽管这个念头很奇怪，但杰布还是忍不住觉得自己像是在盯着一条蛇的眼睛。他在心理上摇了摇头清神。自己到底怎么了？


    男人抿着嘴问：“那里面都有什么来着？”


    “香草和巧克力精粹，加上椰子奶油和肉桂粉。”


    “全都有吗？”他思考着敲了敲嘴，“我不怎么喝茶，但听起来很好喝。”


    杰布等待着顾客的犹豫不决。一会儿，男人摇了摇头。“不了，好像太复杂了。不过你说的听起来很好。”


    “还有什么我可以帮你的吗？”杰布希望没有了，尽管他不明白为什么。


    “没有了，再次感谢。”


    男人快快地点了点头离开了，手里突然出现了一部手机。


    杰布松了口气，纳闷自己为什么对一个完全陌生的人会有这种反应。然后他耸了耸肩，拿起手机继续刷动态。


    # 第四章


    ![](img/00001.jpeg)


    “兄弟？”


    夸西从对桌上合同的盲目中惊醒。“嗯？怎么了？”


    科乔用手指穿过他浓密的金色莫西克头。“听着，哥们。这开始变得荒唐了。阿菲亚又出现了。没什么大不了的。忘了她吧。她不值得。”


    “我没在想她，”夸西用他尽可能坚定的语气否认道。


    科乔浅色的眼睛透着嘲弄的轻蔑。“是是。你忘了你正在对着你大脑的左半球说话。”


    夸西的嘴角抽了一下。“如果你是我大脑的左半球，那我以后生的孩子就完蛋了。”


    他们交换了一个眼神。接着科乔叹了口气。“回到正题。阿菲亚——”


    “她现在叫格蕾琴了，”他纠正道。


    “格蕾琴？那是谁的主意？”


    “谁知道？”他耸了耸肩。保持沉默，他更喜欢叫她格蕾琴。这个名字在他舌尖尝起来很好。像以前认识她时那样称呼她太痛苦了。每当他想到她是阿菲亚时，他的本能就会缩一下。


    “不管她叫什么名字，忘了她吧。”


    如果那么简单就好了。过去这两天都笼罩着她的气息。她从未踏进他的家，没有他的车，或者除了‘咖啡之神’以外的任何地方，但她的气息依然挥之不去。她在夜晚入侵了他的梦境。有时是一场毫无实质的情色幻想，除了记得他们亲欢时她肉体的味道，什么也没有。

