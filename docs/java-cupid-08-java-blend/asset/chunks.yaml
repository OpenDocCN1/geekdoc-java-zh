  raw: 'Co-workers paused to talk to her. On auto-pilot she responded to them without
    giving any hint she hadn’t heard a word they said. Inside she longed to scream,
    but her sister once said her ability to fake interest should be classified as
    a superpower.


    Once she attained her office, Gretchen leaned against the door and flitted her
    gaze around the room.


    Everything within the small space was a testament to her obsession for her roots.
    Though she and her twin had to escape their village to avoid the horror that would
    have befallen her, she never forgot it.


    From the tribal artifacts and recreations stuffed in every corner, to the paintings
    of nature and simplicity hanging on the walls, to the books on anthropology, archaeology,
    myths, and legends, everything about this space showed her love for her humble
    beginnings in a small village with no name in Tanzania.


    And highlighted the sin she wished she could atone for.


    She dragged her leaden feet to her desk and sat. Concentrating, she pushed away
    any other thought but that of her twin. “I need you,” she whispered in the stillness
    of the room.


    Gretchen waited, staring at the painted warrior’s mask affixed to the wall. It
    was one her father had made many years ago. Four minutes later, her cell phone
    rang.


    “What’s wrong?” Her sister huffed, catching her breath.


    “Treadmill?”


    “Yeah. Ten miles today.”


    Gretchen envisioned a version of herself, dressed in spandex and a sports bra,
    heaving in a semi-crowded locker room with long braids tied in a bun on top of
    her head. Her twin – the other half of her soul.


    “Gertrude, you’re not going to believe this.” She picked up a doll from her desk.
    It was one made by a woman in one of the villages she visited. A gift of help,
    the local translators had told her. Gretchen polished the beaded eyes with her
    finger.


    I could use a little help right now.


    “Try me,” Gertrude wheezed.


    Her eyes closed as Kwasi’s image rose before her like a specter. “My husband is
    alive.”


    Gertrude made a strangled noise on the other end of the phone. “Are you kidding
    me?” her sister exclaimed.


    “No, I’m not.”


    “We thought he was dead!”


    Gretchen nodded as though Gertrude was in front of her. “He’s not. He’s alive.”


    With the sexiest lips and body I’ve ever seen.


    “Was his brother there?” There was an edge to her sister’s voice Gretchen couldn’t
    quite pinpoint. Gertrude sounded almost nervous. Possibly apprehensive. But what
    reason would her twin sister have to feel that way? Gretchen dismissed the odd
    thought from her mind.


    “No, he wasn’t there.”


    “What happened when you saw him again?”


    I drooled. Heat flamed her cheeks. She doubted her sister wanted to hear that,
    so she went with the harsher reality of Kwasi’s reaction. “He was furious.”


    “He has no cause to be upset with you.”


    “On the contrary, Gertie, he does. If it wasn’t for my big mouth, the hunters
    would have never—”


    “Do you really believe that?” Gertrude huffed on the phone. “They’d use any excuse
    to kill Kwasi and Kojo and you know it.”


    “And I gave them that excuse.” It hurt to admit her complicity. “Gertie, he asked
    about the mark.”


    “Sweet Mary and Joseph! Please tell me you didn’t let him see it.”


    Gretchen didn’t say anything. She didn’t have to.


    “Why would you do that?” Gertrude yelled. “You and I both know he’ll—”


    “I’m his wife, Gertie. I know what he’ll do.”


    Behind those darkened shades, his eyes had narrowed with such intense emotion.
    When he demanded she show him the mark, she could have ignored his request and
    brushed off his demand.


    But the mark had been the catalyst for the nightmare they shared. He had a right
    to know it still existed just as she had the obligation to make him aware of it.


    “You’re not his wife!” Gertie’s insistent voice broke through her musings. “You
    were six years old when the elders performed the ritual. Even then, they wanted
    you to wait until you had your first period before you did anything remotely wife-like.”


    Gretchen’s eyes stayed fixed on the warrior’s mask. “That may be.”


    “Besides, that was twenty years ago. I can’t believe you would still think you’re
    married to a boy the village forced on you.”


    Forced on her? Gretchen’s mouth trembled in a small, sad smile. The village elders
    may have strongly suggested the marriage between herself and Kwasi, but she knew
    even at that tender age, the only man she wanted was Kwasi. She wasn’t a reluctant
    child bride but an eager one.


    “Things have changed, Gertie. My husband is alive. I owe him my life in exchange
    for the one I thought he lost.”


    “I’m not going to stand here and listen to this bull. We both know it wasn’t your
    fault. But if you’re going to shoulder this thing like some martyr then I’m not
    going to stand here a second longer on this phone and listen to it.”


    “Gertie—”


    The screen blacked out. Gretchen let the phone slip from her fingers and back
    into her purse. The ensuing silence enveloped her like a cocoon. The little doll
    with its beaded eyes seemed to stare straight into her own soul, daring her to
    admit the truth she hadn’t shared with anyone, much less the sister of her heart
    who knew almost everything about her.


    Getting up, she set the doll aside and walked over to the mirror and half turned
    to hone her gaze on Kwasi’s mark.


    She’d avoided the existence of this for as long as she could. When she first came
    to the U. S., his mark was all she could think about. Sometimes, she’d have to
    bury the pillow against her face and scream into the soft depths of it because
    it was all that was left of the boy who was her husband. At other times, Gertie
    had stopped her from taking a knife to her flesh on several occasions in order
    to extract it from her skin. Over time, with therapy, she’d learned to accept
    this mark as a part of herself.


    Now things had changed.


    She closed her eyes and thought about the day Kwasi had put his mark on her. His
    lips had closed over her skin. His tongue licked—


    “Gretchen, may I come in?”


    Her eyes jerked open. The reflection in the mirror detailed the beat in her neck
    pulsing with an upbeat tempo. She swallowed and with a degree of difficulty, willed
    herself back to normalcy and shoved the past back into the recesses of her mind.


    Going back over to her desk, she sat and rolled her neck. Affecting a smile, she
    called out, “Come in.”


    The door opened. “Not disturbing you, am I?” Lonnie Canton, coordinator of outreach
    events for the museum, asked as he sauntered in.


    “Not at all,” she lied. “What can I do for you?”


    “A couple of the local elementary schools have reached out to us in order to facilitate
    some trips with the museum. They’re particularly interested in your area of expertise.”


    A beat of excitement thrummed through her, flinging away the confusion of her
    other unwelcome thoughts. Like a fish submerging into water, she greedily gulped
    in the distraction Lonnie had given her. She loved working with children and educating
    them.


    “Oh, that’s wonderful! Of course, I’d love to do it.”


    Lonnie grinned. “I knew you would. Kids make all of this worthwhile.” His hands
    spread out. “We can pass down our love to the next generation and then they’ll
    be the ones keeping the artifacts and telling the stories to their kids.”


    She nodded. “Yes, yes. Send me all the details and I’ll get to work on it right
    away. How much leeway do we have? Three, four months?”


    His smile wavered. “Well, not exactly.”


    She frowned. “How long?”


    “Three weeks.”


    Gretchen groaned. “Lonnie, you have to be kidding me. You know it’s gonna take
    longer than three weeks to pull any of this together.”


    “I told them that but they’ve got to fulfill budget requirements. The kids need
    a field trip so they have to have one.”


    “But three weeks! I’m not a miracle worker!”'
