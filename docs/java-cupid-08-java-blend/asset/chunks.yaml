    He shook his head, enjoying the animation of her face.


    “Shoes!”


    He joined in Gretchen’s laughter. “I tell you, some things are universal. Women
    and shoes.”


    “I couldn’t believe it.” Gretchen wiped a tear of mirth from the corner of her
    eye. “I mean, they didn’t say anything about learning how to read, interacting
    with people from all over the world, or even the new clothes, which they absolutely
    adored! They loved the shoes. How funny is that?”


    How many layers was there to this woman? She started off as standoffish, and polite.
    Now she laughed with him in conversation as if they were old friends.


    “What about the men?”


    The mirth subsided some but there was still a sparkle in her eyes. “I didn’t get
    much chance to talk with them. The men had very specific ideas of a woman’s place.
    Talking to women for things other than provisions or sex wasn’t on the table.”


    Kwasi grunted. “Some things never change.”


    She nodded. “I didn’t mind. I know one day, one of those tribal children will
    go to college and change the world. In my paper I called for more programs and
    initiatives to integrate uncontacted tribes into modern society. They will benefit
    from education, not some misguided attempt to keep them in ignorance.”


    Her words resonated with him. Thinking of his childhood, which he tried to do
    with as little recall as possible, something flickered across his consciousness.
    The awareness he was missing something vitally significant impressed itself onto
    his brain. What wasn’t he getting?


    “I’m so passionate about it.” A shy smile curved her mouth but she met his gaze
    with a lift of her chin. “I know how much ignorance can play in a person’s life.”


    “How do you know?” He leaned back against the chair and raised the tea cup to
    take another sip when he saw some writing on it. His heart thumped. Was this the
    mysterious cupid everyone had been talking about? Drawing the cup closer, he made
    out the words, “My love is the purest form there is.”


    “Huh?” he said out loud. What in the world did that mean?


    “What’s wrong?” Gretchen inquired.


    Seeing her inquisitive stare but not wanting to reveal the cause of his consternation,
    he gulped the hot liquid. “Nothing.” Jeb must have been playing a trick. It would
    be so like him. “Nothing at all.”


    ![](images/00002.jpeg)


    Cold, hard metal from the bistro chair she occupied dug into the exposed skin
    of her back. Despite the twinge of discomfort, she wondered how was she to interpret
    the look crossing his features. Had he figured out their past connection?


    Gretchen dismissed it immediately. If Kwasi had, then there would have been a
    definite reaction. Mainly the closing of those long fingers around her throat.


    How small was the world then? Seven billion people and she happened to meet the
    boy of her nightmares in Java Cupid.


    Sitting across from her though, he was more like the man of her dreams. A mouthwatering
    piece of vanilla candy. The curtain of light had landed on his pale, powerful
    frame. He used some sort of product on his afro. Beaded droplets of whatever it
    was shone on his hair, turning it into a patch of thick, glistening gold.


    In a way, with his coloring and blond hair, Kwasi could be a cupid. Not a pudgy
    winged boy-child flitting about with a bow and arrow. Draped in a white toga with
    its gold belted cord, he’d be a hot Afro-centric love god with firm pectorals,
    muscular thighs, and big feet.


    Shaking her head to rid herself of the image imprinted on her nerve cells, she
    asked, “Well, it’s your turn now. What is it you do?”


    If she asked the right questions, she’d be able to determine if he was indeed
    the Kwasi.


    “Private security.”


    She rested her head on her uplifted fist. “Do you guard celebrities?”


    He chuckled. “No, nothing like that. We’re a small firm and I like it that way.
    We provide security for small functions and venues.”


    “We?”


    “My twin brother, Kojo.”


    Twin brother Kojo?


    All the blood drained from her body. If she needed a piece of hard evidence to
    prove the man before was the Kwasi, having such a sibling would do it.


    Still, there are several billion people on the world, she reasoned. It’s completely
    possible there are other sets of albino twins with those names.


    No, not really, a voice in her head argued back.


    Before she succumbed to the burgeoning panic in the center of her chest, she had
    to find out one more thing. “Are you guys identical or fraternal?”


    “Kojo’s me with a mohawk.” Kwasi grinned again with a sideways tilt of his pink
    mouth. “I’m the good-looking one though.”


    Gretchen’s hands had turned into ice. Her heartbeat thundered in her ears.


    Kwasi and Kojo? How after all these years and two different countries apart, would
    they meet together like this?


    An uncontrollable tremor racked her hands. In an effort to calm her nerves, she
    reached for her tea when a message appeared in upraised letters. When she read
    it, her heart plummeted to her feet.


    “Love forgives everything, even death.”


    Was this the mysterious Java Cupid? Or was it Jeb playing some sort of practical
    joke?


    No, it couldn’t be Jeb. This statement hit too close to home. Anyone who had written
    this would know the deepest, darkest secret of her heart.


    The memory overlaid the environment of the café like a holographic screen. Four
    small children, two boys pale as cloud and two girls, Gretchen and her twin sister
    dark as shadows, played in a field of tall grass with massive trees, hot air,
    and the drone of insects.


    In the background, their parents laughed and joked in the doorway of a thatched
    roof home.


    All of it so innocent. She never knew how soon it would be a nightmare.


    “Earth to Gretchen?”


    She jerked. “I’m sorry. You were saying?”


    “Is everything okay? You kinda spaced out for a moment.” His brow creased in concern.


    No, everything wasn’t okay. She had to get away from here and never let Kwasi
    near her again.


    “I just remembered I have an appointment with a potential buy for the museum.”
    It wasn’t exactly a lie. She did have to meet with the contact. It was just sometime
    next week, not today.'
