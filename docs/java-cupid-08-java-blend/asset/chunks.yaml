    Carefully, he stepped away on his perfectly healthy legs, another deception for
    his brother’s benefit, and into the car waiting for him. The other one, Gertrude
    he believed she was called, had left the house of her sister. Once he found out
    where she was at, he’d be one step closer to his goal.


    # JAVA RIFT: SNEAK PEEK


    A year ago


    So, this is what it was like to see the dead come back to life again.


    Like having air breathed back into your lungs. Your skin tingle in awareness.
    The entire world disappearing from view as your eyes hone in on the one person
    you least expected to see enter your life again.


    It had been nineteen years since Gertrude Ozinga had last seen Kwasi but no amount
    of time would ever have her mistake who he was. She’d know him if she were blind.


    Time had been so good to him since they’d been apart. He’d grown into a man with
    the kind of physique showcased on the cover of magazines. Strong muscles which
    bunched for dominance as he moved them. Thick, coarse golden hair styled into
    a mohawk gave a sexy edge of rebellion. His tinted shades shielded his face but
    drew attention to his firm mouth and solid chin.


    “Kwasi,” she breathed. He was alive. The hunters hadn’t killed him after all.


    She stood up from her seat in the crowded mall. This man had been the love her
    life for so long. Ever since she was a child. She’d thought no man could ever
    come close to him.


    Circumstances had prevented her from claiming him back then. Her lips twisted
    in discord. But not anymore. This was an opportunity she couldn’t give up. Not
    now.


    Her feet moved before she had too much time to think about. Then she started to
    run. Run as fast as her legs could carry her.


    She had to get to Kwasi!


    He stopped at the storefront of a men’s clothing store. She skidded to a halt
    and stared with love-stricken eyes. Inhaling a deep breath, she bent her head
    down and then made herself walked sedately, and then bumped into him on ‘accident’.


    “Oops, sorry!” she said breathlessly. “Clumsy me—Kwasi?”


    She let the surprise raise her voice while true astonishment rocked her insides.


    Animal magnetism. It was the only way to describe the aura he exuded. As a black
    albino, his skin’s natural paleness glimmered like alabaster but there was more
    to it than just that. A magnetic pulsing connection which reached out to her with
    gossamer threads. A white tiger who intimidated her and made her bristle in reaction
    to his presence. Though his shades shuttered his eyes, the force of his scrutiny
    behind those lenses rippled over her like a blatant caress.


    She gulped. “It is you, Kwasi. You’re alive!”


    “Hey.” His white chocolate voice cascaded over her senses.


     “It’s me, Kwasi. It’s me! Your wife, Afia."


    ![](images/00002.jpeg)


    First, she calls me Kwasi. Then she lies to me. I guess some things never change.


    Despite the balmy flush of joy which flowed over him when he set eyes on her,
    Kojo O’Brien shook his head. He’d know Ayawa anywhere. Nineteen years couldn’t
    begin to erase her from his mind. Back then, they’d been children. He eleven and
    she six years old. Playmates and more.


    When she raised her head, his heart came to a standstill.


    “It’s me, Afia!” Ayawa lied again,


    Her midnight dark skin sheathed her like a silk curtain. Braids, oiled and scented
    with a pleasant fragrance, made his nostrils flare as he greedily inhaled it.
    The soft imprint of her body when she ‘bumped’ into him curved into his own, gave
    more than a hint she’d filled out in all the right places. Those eyes of hers,
    fringed by thick curly lashes, teemed with an adoration meant for his brother.


    Crushing disappointment settled on his shoulders like the arms of an invisible
    giant. Nineteen years later and she still clung to her infatuation with Kwasi.
    She hadn’t even known if Kwasi was alive. Here she was holding his twin brother
    thinking he was him!


    Ever since they were kids, Kojo always stood in his brother’s shadow in her eyes.
    “Kwasi’s better at this. Kwasi said this.”


    On and on she went about his brother, never seeing the one in front of her.


    He opened his mouth to call her out on her bull crap when she lifted her head
    and claimed his mouth.


    Kojo had kissed dozens of women in the past but this was one he’d waited a lifetime
    for. Sweet heaven, her soft mouth had him groaning and wrapping his arms around
    her. Heat spiraled through his body as the kiss intensified in seconds. Flames
    scorched his brain, melting all common sense except the instinct to delve into
    this cavern of sweetness.


    Strong fingers, her strong fingers, dug into his hair and increased the pressure
    of his mouth on her. Their tongues tangled together, drawing, and suckling on
    each other. He couldn’t decide if it was a dance or a battle. With each moist
    pass a long-buried thing pierced through a well-packed down plot of emotional
    earth. This thing had a voice, barely audible but it’s clarity came through as
    he thrust both hands into Ayawa’s braids, wound the silky coils around his fingers,
    and yanked her head back to drink deeper from this wellspring.


    Mine.


    She was a fountain with a liquid pleasure he voraciously thirsted for. The taste
    of her lips as purifying as water in a dry desert.


    Long before he wanted to, Ayawa ripped her lips from his and cuddled against his
    chest.  “Oh, Kwasi. It was everything I’d always hoped it would be,” she sighed
    in a blissful way.'
