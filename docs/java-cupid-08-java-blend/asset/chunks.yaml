    Parker J. Cole is an author, speaker, and radio show host with a fanatical obsession
    with the Lord, Star Trek, K-dramas, anime, romance books, old movies, speculative
    fiction, and knitting. An off and on recovering Mountain Dew and marshmallow addict,
    she writes to fill the void the sugar left behind.


