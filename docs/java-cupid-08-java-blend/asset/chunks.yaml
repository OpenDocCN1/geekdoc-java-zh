    随着他的承认，整个咖啡馆区域的一群人爆发出一阵大笑。尽管那儿的人根本不可能听见他说了什么，但那股窘窘的热感还是顺着脖子爬上头顶，最后停留在耳尖。话出口的片刻，他就恨自己不能把话收回来。他在心里低声咒骂着，纳闷她到底施了什么咒，竟让他表现得像个满脸青春痘的少年？


    “你生命中第二棒的一天？”葛蕾琴（Gretchen）重复道，“你生命中最棒的一天是什么？”


    他清了清嗓子，纠结自己应该表现得有多坦诚。但他暴露得比预想的要多。现在停又怎样？


    他摆弄着桌上的餐巾，回答道：“我娶你的那天。”


    她那双娃娃般的眼睛睁大了，嘴巴张成一个完美的“O”型。惊讶凸显了她的美，让她那高耸的颧骨和尖细的下巴格外突出。还有比她此刻呈现出的画面更美人的吗？


    她那深色光滑的皮肤透着纯净的光泽，闪烁着内在的光芒。当她听完他的话时，修长的手臂上，着纤细如精灵般的手指，椭圆形的指甲在杯缘上跳动着。那头浓密卷曲的头发用一条宽橙色发带向后扎，为她增添了一层光环特效，让他想起了天使。


    但她不是天使。她是那个差点害了你的孩子。


    他的嘴角紧了了紧。他最好记住这一点。


    “但我那时才六岁啊，”她慢慢说道，神色中云聚着一抹哀愁。


    夸西（Kwasi）投去一个恼火的神色。“我并不急于和你发生肢体接触，放心吧。很多时候我根本不知道长老们和奥布莱恩（O’Briens）在胡腾什么。比起其他任何事，我最兴奋的是能画彩脸。”


    她的嘴角抽动了一下。“我也是。”


    如果说在童年所有的痛苦中他获得了一丝慰藉，那他庆幸自己没有遵循族人迎娶童妻的传统。毕竟，一个成熟的女性能提供的多得多。一阵感激的热浪像赤裸裸的抚摸一样掠过他的胃部，他的目光贪婪地掠夺着桌面上方她身体起伏的曲线。


    作为一个拥有任何热血男性正常食欲的成年人，他欣赏着对面这朵盛开的深色玫瑰。


    “我们结婚时，我也很高兴，”她出意外地说道。


    夸西震惊地僵住了。“你也是吗？”


    她缩了缩肩膀，移开视线。那侧脸让他想起了浮雕般的、优雅而高贵的姿态。


    “我想要让你，只有你成为我的丈夫，”她继续道，“也许我不理解当妻子所包含的生理含义。我只知道爸爸（Baba）和妈妈（Mama）很快乐。我知道我们也会很快。”


    他的胸腔起伏。“那么——”


    葛蕾琴回看向他。“对我来说那也是美好的一天，”她补充道。


    周围，爪门丘神咖啡馆（Java Cupid café）嗡嗡作响。硬币在小罐里叮当作响。杰布（Jeb）大声喊着订单。奶泡机嗡嗡运转。在所有的嘈杂声中，一个沉默的茧包裹了他和葛蕾琴，里面填满了未说出口的话语和羞于表达的情感。但在他内心，外壳正在破裂。'
