    Kwasi followed the sway of Gretchen’s lovely, curvaceous behind as she took him
    into the inner sanctum of the museum. Any other day of the week, he would have
    loved to stop and stroll the various exhibits on display and lose himself in yesterday.
    Gretchen’s eyes had shone with promise, so he’d have to delay his visit down these
    hallowed halls for another day.


    Amazing she had the same feeling he had. She missed him as he had her. Her greeting,
    with that joyous wonder on her face, sent his heart racing.


    Would this moment be the next one to lead them to forever?


    Slow down boy, he admonished himself, let’s get past these next few moments.


    They still had to clear the air, once and for all.


    He didn’t want the past, with all of its issues, to hinder their tomorrow.


    She led him to an office crammed with tribal paraphernalia. When she closed the
    door and leaned against it, her doll-like eyes fixed on him.


    “I’m happy to see you again.”


    The tension eased in his chest. “And I you.”


    They grinned like fools at each other. “Are we crazy for this?” she asked as she
    lifted herself off the door.


    Kwasi shrugged. “Probably. Else, why do fools fall in love?”


    He meant it as a joke but a serious light came into her eyes. “Because they were
    children when they married.”


    The silence stretched like a tightrope as the words struck a chord within him.
    Then Kwasi spoke. “Come here.”


    She lurched slightly toward him as if being pulled by an invisible puppeteer.
    Lovely as a moonless night, delicate as a flower, and strong like a band of steel.
    His child bride had morphed into a woman any man would be proud to call his own.
    What a loss it was to those men who had treated their women as less than precious,
    but their idiocy was his genius.


    She’d worn a sleeveless top with spaghetti straps. Without his having to say a
    word, she turned around.


    His mark, still bright as the day he’d given it to her.


    Using the tip of his finger, he touched it ever so lightly but she still flinched.


    “You know,” he told her as he traced the edges of the crescent moon shape, “when
    I tasted your flesh that day, it really was because I thought I’d make you feel
    better.”


    When he’d gathered the courage to knock the bug off her neck, Gretchen had cried,
    complaining the spot had hurt. It had swollen some, from whatever the insect had
    done to her. On that day, he had touched the spot and she jumped.


    “Kwasi, that hurts.”


    “Sorry. What do you want me to do?”


    “Kiss it and make it better,” she told him immediately. “That’s what Mama does.”


    At first, he hadn’t wanted to. But when she looked back at him with those big
    eyes rimmed with liquid, how could he say no?


    “You tasted like salt and dust that day,” he said aloud.


    “You’re a real charmer,” Gretchen drawled.


    Kwasi let the hint of a smile twitch his lip. “Well, you did. We’d been playing
    all day outside. I put my mouth on your neck and tried to suck out whatever that
    bug had put into you.”


    When he licked that spot, he tasted her skin. There was nothing sexual back then
    about it, but it did give him pause. Many times he saw Baba kiss Mama’s shoulder.
    It was something husbands did. It seemed to always make Mama feel better since
    she always turned and smiled at his Baba.


    “Does that feel better?” Had he done it right?


    Gretchen hunched her shoulders. “Feels okay.”


    As he stared at the spot, the strangest thing happened. Gretchen’s dark skin began
    to lighten like the color was being pulled away.


    “I don’t know why this happened when I kissed you here, Gretchen.” He still traced
    the edges of the mark his mouth left there. “I’ve thought of it through the years
    but for whatever reason, a piece of me is embedded on you.”


    “The only thing I can think that happened, “Gretchen replied in a low voice, “is
    maybe the insect injected some sort of venom into me that affected my skin.”


    Kwasi nodded although she couldn’t see him. “Perhaps that’s it.”


    They both knew it was a bunch of baloney, but it appeased them to have a pseudo-scientific
    explanation.


    “Regardless, this caused everyone to believe I had powers. So they hunted Kojo
    and me.”


    “Kwasi, I’m so sorry. If I could go back in time—”


    “I would still endure the same pain. Being here with you like this is worth it.”


    Kojo’s grim reminder leaped into his head. “She’s not worth it, man.”


    You’re wrong, Kojo. She very much is.


    As a child, he kissed her there in order to give her comfort. As a man, he had
    entirely different reasons for wanting to place his mouth there. He wanted to
    bring her essence inside of his being.


    “Kwasi?”


    “Yeah?” His voiced sounded ragged to his own ears.


    “Kiss it and make it better?”


    A lightning bolt shuddered through him. He didn’t have to be asked twice.


    He pressed his lips to the spot that had once caused so much pain. Instead of
    her childish nonchalance at his touch, her head rolled back, exposing the exquisite
    column of her neck.


    “Kwasi,” she moaned.


    He continued to press his lips there although he used his fingers to trace little
    circles along the sensitive edge of her neck. Vibrations trembled along her frame,
    shuddering his own body. With his fingers to trace little circles along the sensitive
    edge of her neck. It’s just melanin,” she whispered. “I have more and you don’t
    have as much. It’s the outer surface. A stroke of paint to cover the soul within.”


    She kissed his fingers, rocking him to the core. “It’s funny. In the village,
    I was considered the purest because my skin was so dark.” A rueful, unpleasant
    smile curled her lips. “When the Ozingas adopted Gertrude and I after our parents
    passed away, and brought us to the U. S., I was told I was too dark. I was a dirty
    black skank, tar baby, ugly hoe—”


    “Shhh.” He placed a finger on her lips. He ached for her. She did understand.


    “Remember when you called me Glenda when we played our little game? How I reacted
    when you called me that?”

