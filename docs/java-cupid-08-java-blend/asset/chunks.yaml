    # CHAPTER EIGHT


    ![](images/00001.jpeg)


    The drive to Darden Villas with Kojo was a short one. Every couple of weeks, they
    visited Luke at the assisted living facility for Alzheimer’s patients. It was
    a sad commentary for the man who had risked his life to rescue them, only to end
    up having his mind eaten away by mental deterioration.


    “I hope he’s having a good day,” Kwasi said to his brother.


    “I called and checked with the staff. They say he’s doing well.”


