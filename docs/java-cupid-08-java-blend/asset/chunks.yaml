  trans: '

    Kwasi 追随着 Gretchen 迷人且曲线优美的臀部摇曳，跟随她进入博物馆的内部区域。换做每周的其他一天，他本想停下来，逛逛各种展品，沉浸在昨日的时光里。但
    Gretchen 的眼睛里闪烁着期许，因此他不得不推迟对这些神圣殿堂的访问。


    令人惊讶的是，她也有和他的一的感受。她想念他，正如他想念她一样。她脸上带着那种喜悦与惊喜的神情迎接他，让他心跳加速。


    这一刻会是引领他们走向永恒的下一个时刻吗？


    慢点，孩子，他告诫自己，先度过接这几分钟。


    他们仍然需要彻底地化解隔阂。


    他不想让过去所有的问题阻碍他们的明天。


    她带他来到一间挤满部落装饰品的办公室。当她关上门靠在门上时，她那双娃娃般的眼睛盯着他。


    “很高兴再次见到你。”


    他胸中的紧张感松了缓。“我亦一样。”


    他们像傻瓜一样对着彼此微笑。“我们为这疯狂了吗？”她离开门站起来问道。


    Kwasi 耸了耸肩。“可能吧。否则，傻瓜为什么会坠入爱河？”


    他本是开玩笑，但她的眼中闪过一丝严肃的光芒。“因为他们结婚时还是孩子。”


    沉默像紧绷的绳索一样拉长，这句话触动了他的内心。接着 Kwasi 开口了道：“过来。”


    她向他微微倾斜了一下，仿佛被一个无形的提线偶师拉着。她美得像无月夜，像花朵般精致，像钢带般坚韧。他的童妻已变成了一个任何男人都会为之感到骄傲的女人。对于那些视女性为廉价的男人来说，那是是巨大的损失，但他们的愚蠢正是他的幸运。


    她穿着一件无袖细肩带上衣。无需他多言，她便转过身。


    他的标记，依然像他留给她的那天一样明亮。


    他用指尖轻轻地触碰了它，但她还是缩了一下。


    “你知道的，”他描摹着月牙形状的边缘告诉她，“那天我尝到你的皮肤时，真的是因为我想让你感觉好受。”


    当他鼓起勇气拍掉她脖子上的虫时，Gretchen 哭了起来，抱怨那个地方疼。由于不知道那种昆虫对她做了什么，那里肿了一些。在那一天，他碰到了那个地方，她跳了一下。


    “Kwasi，好疼。”


    “抱歉。你想让我怎么做？”


    “亲它，让它好起来，”她立刻告诉他。“妈妈就是这样做。”


    起初，他不想这么做。但当她用那双含着泪的大眼睛看着他时，他怎么能拒绝呢？


    “那天你尝起来像盐和尘土，”他大声说道。


    “你真是个迷人，”Gretchen 拖长道。


    Kwasi 嘴角露出一丝微笑。“好吧，确实如此。那天我们在外面玩了一整天。我把嘴贴在你的脖子上，试图把那只虫子留在你体里的东西吸出来。”


    当他舔那个地方时，他尝到了她的皮肤。那时并没有性色彩，但这让他陷入了沉思。他多次看到 Baba 吻妈妈的肩膀。那是丈夫会做的事。那似乎总是让妈妈感觉好受，因为她总是对着她的
    Baba 微笑。


    “感觉好些了吗？”他做对了吗？


    Gretchen 耸了耸肩膀。“感觉还可以。”


    当他盯着那个地方时，最奇怪的事情发生了。Gretchen 深色的皮肤开始变浅，就像颜色被抽走了一样。


    “我不知道为什么当我在这里亲你时会发生这种事，Gretchen。”他依然描摹着他吻留下的标记边缘。“年来我一直在想这件事，但出于某种原因，我的一部分嵌入了你的身体里。”


    “我唯一能想到的可能是，”Gretchen 低声回答道，“也许那种昆虫向我注入了某种毒液，影响了我的皮肤。”


    Kwasi 点了点头，尽管她看不见。“也许是吧。”


    他们都知道这只是胡扯，但有一个伪科学的解释让他们感到心安。


    “无论如何，这让大家都相信我有法。所以他们才猎捕我和 Kojo。”


    “Kwasi，我真的很抱歉。如果我能回到过去——”


    “我仍然会承受同样的痛苦。这样和你在一起值得值得。”


    Kojo 严酷的提醒跳入他的脑海。“她不值得，哥们儿。”


    你错了，Kojo。她非常值得。


    小时候，他亲那里是为了给她安慰。而作为一个男人，他想要把嘴放在那里有完全不同的理由。他想把她的精髓带进自己的生命里。


    “Kwasi？”


    “嗯？”他的声音听起来自己很沙哑。


    “亲它，让它好起来？”


    一道闪电穿了他的身体。他不需要被要求两次。


    他吻上了那个曾经引起过这么多痛苦的地方。她没有对他的触碰表现出孩子气的无所谓，而是向后仰头，露出了优美的颈部线条。


    “Kwasi，”她呻吟道。


    他继续在那儿按吻，尽管他用手指在她脖子敏感的边缘画着小圈。震颤沿着她的身体蔓延，震动着他自己的身体。用手指在她脖子敏感的边缘画着小圈。“这只是黑色素，”她轻声说。“我更多，而你没那么多。这只是表面。是覆盖内在灵魂的一层油漆。”


    她吻着他的手指，触动了他的内心。“真奇怪。在村子里，因为我的皮肤是深色，我被认为是最纯洁的。”一个苦涩而不愉快的微笑掠过她的唇。“当 Ozinga 一家人在我们父母去世后收养了我和
    Gertrude，把我们带到美国时，他们告诉我我的皮肤太黑了。我是个脏的黑鬼、焦油娃娃、丑娘货——”


    “嘘。”他把手指放在她的唇上。他心疼她。她确实理解。


    “记得我们玩那个小游戏时你叫我 Glenda 吗？当你那样叫我时，我是如何反应的？”

