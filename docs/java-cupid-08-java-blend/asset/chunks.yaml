  raw: 'It never occurred to him that he wouldn’t succeed. What he did doubt was his
    brother’s ability to find the albinos before he did. Once he attained their bones,
    his amulet would increase in power. He had to protect himself from the spirits.


    His one concern had to do with the age of the albinos. All the others had been
    from children but these two were mature. Would it affect his amulet’s potency?


    There was only one way to find out.


    “You are going to come to me and you’re not going to involve the police. If you
    do, I will kill Gretchen.”


    “You’re the one who bought me and Kojo from the elders. You killed Donna!”


    The cigar man pursed his lips. “I did acquire you through the elders but they
    tricked me and also sold you and your twin to my brother. They are no longer around
    to be so devious.”


    He let the implications of his words sink in, letting his quarry stew on that
    for a few minutes. As for Gretchen Ozinga, she was being a very good girl by keeping
    quiet. He knew she wouldn’t want to get tasered again.


    After a long moment of silence, Kwasi’s voice came through on the phone. “Where
    do you want me to go?”


    “I don’t want just you. I want both of you. And if by chance, your brother contacts
    the police, then I will kill Gretchen. Do you understand? I’ve waited too long
    and my patience is at an end.”


    Victory had a wonderful taste to it. Once the albinos were sacrificed, he’d have
    the shaman his twin brother procured to perform the appropriate ceremony and then
    add their essence to the necklace.


    Then, he’d see if his twin brother could top that.


    ![](images/00002.jpeg)


    Gretchen’s body trembled. Terror ate at her heart with minute teeth which devoured
    her courage piece by piece. She bit her lip in order to keep from screaming.


    As the container jostled, her cramped body ached. The effects of the taser had
    dissipated but the memory of it lingered long after. She never, ever wanted to
    experience the taser ever again.


    Why was this happening? She hadn’t much money. Not highly sought after. No ill-gotten
    gains through illegitimate means. So why had this man kidnapped her? And what
    did he mean by twin brother?


    The barrier of the container muffled sound but she could make out the man was
    talking. Who was he speaking with? An accomplice?


    Tears gathered in the corner of her eyes. What if she never saw Kwasi again? They’d
    just found each other, forgiven each other. Would this man, whoever he was, take
    away her chance for happiness?


    No. Her lips firmed and she swiped at her eyes as best she could. No. She had
    to find a way to get out of this predicament.


    But she needed help. The kind of help only one person could provide.


    Closing her eyes, she focused all her thoughts on one image. Then she whispered,
    “I need you.”


    The motion of the container stopped abruptly and her eyes flew open. Heart thrashing
    in her ribcage, she thought of one thing: would Gertrude answer her cry for help?


    # CHAPTER NINE


    ![](images/00001.jpeg)


    Kwasi and Kojo shared a grim look as they parked on the side of the road of the
    hunting grounds. This was twenty years ago. It may be daylight, and the sun at
    its zenith. They may not be young, scrawny boys malnourished from the poor diets
    of living in the village and ostracized because of the lack of color in their
    skin. But it was still the same as it was twenty years ago.


    They were the hunted.


    “Do you know what you’re doing?” Kojo asked as they got out the car.


    “No, I don’t. I’m going with my instincts.”


    Kwasi wondered if this would be his last day on earth. The man on the phone had
    made it clear: no guns, no knives, or weaponry of any kind. If he saw a pointed
    pencil, Gretchen’s life would be at stake.


    Cold fingers of fear traipsed his spine. Nothing could happen to Gretchen.


    “What if he’s—?”


    “I doubt he’s done anything to harm her,” Kwasi said before Kojo finished. “He
    needs to make sure we would come alone. If he killed her….” The words stole his
    breath away. No, he wasn’t going there.


    They tread through the forest on their way to their destination. Woodland debris
    crushed under their feet. Scampering animals ran in front of them in search for
    food. Winds blew and sang among the trees. The sound of the forest, on any other
    day, would have been welcome.


    Today, it did nothing.


    “Look at the cabin.”


    Kwasi glanced up to see the log cabin almost directly in front of them. It resembled
    any other log cabin except for one thing. His wife was being held hostage within
    its wooden grasp.


    Gretchen, please be all right, he prayed.


    When they came close to the door, it opened. The man motioned with his gun. “Get
    in here and don’t try anything funny.”


    Hands raised, Kwasi stepped into the cabin along with Kojo.  Sparse and deserted,
    it had two occupants. One had a gun and brandished it at he and his brother. The
    other was Gretchen. She sat on the floor next to a giant metal container with
    her hands bound and cloth stuck between her teeth.


    Kwasi’s heart dropped to the floor. It was exactly the same way Luke described
    it many years ago, down to the last detail of seeing Gretchen tied up in the same
    way Donna had then. It had ended with Donna’s death and the catalyst for Kwasi
    and Kojo’s escape.


    His blood ran cold and then hot. He had no intention of giving up Gretchen without
    a fight. No running away


    “Well, aren’t you both a sight for sore eyes,” the man said with a grin. “I’m
    going to have the luckiest amulet yet when I get your bones from you.”


    “Why did you buy us?” Kwasi asked. He kept his face turned away from his brother.
    If the plan they’d put together worked, then they would only have one opportunity
    to get it right. Anything else would be disastrous.


    Kwasi eyed this man who had been hunting him for as long as he’d been alive even
    though he hadn’t known it.


    “I bought you for your bones. Albino finger bones are the best to use when making
    an amulet.” He spoke so matter of fact, Kwasi could have almost believed they
    were having a conversation about the weather.


    The man reached into his shirt and drew the necklace out. It dangled from one
    of his fingers like strings of Christmas lights. Tiny bones. How many albino children
    had this man killed in order to create it?


    “My brother will be here shortly. He’ll bring the shaman along. I’ve decided to
    be generous and give him one of you for his own amulet.” With a flick of the gun
    in Kojo’s direction, he ordered, “Go over there next to her and get the rope.”
    He cocked the gun. “And whatever you do, don’t try anything funny.”


    Kojo glanced back at Kwasi, who read him like a book. It was now or never.


    His brother made as if to go over to Gretchen when he suddenly lunged forward
    and threw his body into their captor. The movement was almost supernaturally fast
    as the man had no chance to pull the trigger before his brother slammed into him.
    A shot went off as the gun fell to the floor. Kwasi kicked it away to the other
    side of the room.


    With the rage and adrenaline pumping through him, he raced over to help his brother.
    Kojo had locked the man in a headlock and he struggled against the hold. With
    his fist balled, Kwasi lifted it and sent it crashing into the man’s nose. Bones
    crunched and blood gushed out like a spring. An inhuman yell erupted from the
    man’s mouth, but Kwasi hit again, decking him in his eye.


    “Get him,” Kojo said grimly, the man subdued and unable to get out of his hold.


    Fury burned through him and his fists pummeled the man in rapid succession. He
    thought of the bones on the man’s necklace. He stopped his punishment long enough
    to hook his hand around it and rip it from his throat.


    “No,” the man gurgled. “My amulet.”


    Thunder reverberated through the cabin as glass shattered from behind them. Another
    gunshot. Kwasi whirled around to see a short, fierce-looking woman with black
    hair and a steady aim with the rifle in her hand kick open the door.


    “Don’t anyone make any moves,” she warned.


    Kwasi held his hands up in surrender. “Please, call the police.”'
