    当她闭上眼睛时，脑海中浮现出站在咖啡馆里的身影，那光滑如珍珠般的肌肉和金色的头发。她口水横流，渴望品尝他那丰满如葡萄柚般的嘴唇。夜晚，她的身体躁动，内心充满了抑制的渴望，想要感受他长而宽的手指如弓般抚摸着她。


    疚感与渴望在她心中激烈斗争。科乔（Kojo）的愤怒经常粉碎她对他们短暂相处的回忆。此外，格特莉（Gertie）自己的痛苦也让她怀疑让 `Kwasi` 再次回到自己的生活中是否明智。


    他们分开不是更好吗？


    不！她的心向大脑冷静的逻辑发出反抗的呐喊。


    “你甚至不知道我我在，”从‘爪哇爱丘比特之神’活动回来后，格特莉痛苦的声音一直萦绕着她。“你总是能感应到我，我亦如此。在短短两天内，他就破坏了我们的纽带。”


    “我们的纽带没有断，格特莉，”她试图说道。


    “别骗我，格蕾琴（Gretchen），”格特莉眼里闪着泪光说道，“求你别这样。”


    “那‘爪哇爱丘比特’呢？”


    罗尼（Lonnie）的声音将她从姐姐痛苦的泪水中拉回，回到同事渴望的目光中。听到他的建议，她的心漏跳了一拍。


    “爪哇爱丘比特？”噢，这个词在她的舌尖上是如此地甜蜜。就像那种爪哇调配咖啡，随着她离开的时间越长，就越发渴望。


    “对啊！”罗尼的眼睛亮了起来。“这是个好主意。也许这次我可以在我的杯子上（留个信息。”


    `Kwasi` 会在那儿的吗？在过去的这一个周里，她很想念他。尽管她的大脑辩称，去想念一个不久前还以为死的男人简直太荒谬了。


    “别再去那里了，”格特莉哀求道。她跪在格蕾琴身边。“他会介入我们之间的。”


    格蕾琴叹了口气。她不能让双胞胎姐姐失望。几个小时后，格特莉才完全冷静下来。失去双胞胎连结的恐惧——那种两个灵魂共享同一颗心的、无法解释的纽带——让她处于了极度焦虑的状态。


    她和姐姐之间拥有一种特别的情感。没有任何男人值得破坏他们之间的关系。


    但她曾经与 `Kwasi` 分享的一切难道同样神圣吗？他们独特的关系，虽然不同于双胞胎连结，但同样珍贵。


    她难道不欠他去捕捉那种感觉吗？


    她难道不欠自己去完善它吗？


    格特莉难道不值得她的信任吗？


    “啊，对不起，罗尼。我没法和你一起。不过下次吧。”


    说出这些话让她心碎，但她必须考虑到格特莉。姐姐身上出了一些事，有些事她瞒着，但格蕾琴无法捉破。她姐姐没有感情生活，更喜欢电脑和当地的女子比赛，而不是男人。但最近，她感觉到姐姐的情绪中有一层阴霾。


    出了什么问题？


    “好吧，反正跟我一起走吧。我今天停在公共停车场，所以我我在前面。”罗尼示意让她起来。


    “好。”她站起来伸了个懒腰。“反正我也该动动了。”


    他们穿过走廊，转弯更多是习惯，而不是因为需要方向。


    罗尼走路时晃动着钥匙。“你研究的那个部落找到什么线索了吗？”


    “还没有。我追踪到了某所大学的一位教授。他非常精通那里未与外界接触的部落。也许他能帮到我。”


    “你会去那里进行第一次接触吗？”


    格蕾琴耸了耸肩。“我不知道。那种情况极其复杂且危险。语言障碍、文化神秘主义，以及对未知的恐惧。那是一个随时会爆炸的火药桶。”


    “我绝对不想在那时候落在长矛的尖端。”


    他们到达了大厅。闪亮的大理石地面反射着从窗户洒进的阳光。橡胶底鞋的摩擦声和高跟鞋的咔哒声填满了房间，在墙壁上回荡。守卫守在大门口的金属探测器旁，一群学生学生穿过旋转门，一个慌忙脚措的监护在旁喊道：“安静！”


    “这确实很危险。但将一个孤立社会融入现代世界的回报，对于……的利益至关重要……”


    不经意看向大门，她的呼吸卡在了喉咙。


    `Kwasi` 站在访客隔离带的另一侧。虽然太远了看不清，但她感觉到他的目光落在身上，如触般有力。


    上天降下的恩赐！


    “抱歉一下，罗尼，”她在没有离开与 `Kwasi` 视线的情况下说道。“我看到一个认识的人了。我要去打个招呼。回头聊。”


    格蕾琴没有再多说什么，也没有看同事一眼，便穿过了宽阔的大厅。每一步都让她更接近灵魂的渴望。她的眼睛以贪婪的胃口吞噬着 `Kwasi` 的身影。


    他散发着一种男性的魅力，这种魅力被他的衣服衬托着。那件袖子挽到肘部的棕色纽扣衫露出了他手臂结实的肌肉。黑色西裤紧贴在大腿上，像第二层皮肤。还有他硕大多水的嘴唇。他舔了舔它们，她踉跄了一下。


    他迅速来到她身边。“格蕾琴，你还好——？”


    “你在这里，”她呼出一口气。“你真的在这里。”


    `Kwasi` 盯着她。

