    神秘的 `cupid`。是谁在杯子上写了这些信息？Jeb 吗？不。这条信息直击了他的灵魂核心。它揭示了他内心的一处只有年幼的 `Gretchen` 才能理解的部分。


    “你知道我我为什么——你嘴上那是什么？”`Kojo` 挑了挑眉毛。“哈？”


    “哥们儿，你嘴上那是什么？看起来像是棕色的污渍。”


    看着弟弟揉了揉嘴，他看到弟弟盯着自己的手时再次静止了。“噢，一定是什么干掉的咖啡之类的。”为什么 `Kojo` 看起来这么紧张？而且为什么他不肯看他的眼睛？


    `Kwasi` 响了响手指，想起了咖啡馆里的那场冲突。“还有一件事。你为什么要那样对付 `Gretchen` 的妹妹？”


    “怎么对付她？”声音听起来很沙哑。如果 `Kwasi` 不了解情况，他简直会发誓 `Kojo` 的皮肤已经白得像纸一样。那男个人看起来几乎毫无血色。


    “针对 `Java Cupid`。你抓她的样子就像快要伤害她一样。”


    `Kojo` 的脸上掠过一丝如释的表情吗、“我没打算做那种事。她对待你的方式简直让我很火大。”


    谎言。`Kojo` 在对他撒谎。`Kwasi` 这一点就像确定自己在呼吸一样确定。但在什么事情上撒谎？


    他绞尽脑筋，回想着那段对话。表面上没有什么让他产生“恍然大朗”的感觉。但他知道他的双胞胎在撒谎。也许与他的私生活有关。和自己不同，`Kojo` 生活里的女性就像车站的公交车进进出出。正如俗话所说，他工作努力玩得疯狂。也许他和其中一个闹僵了。


    `Kwasi` 摇了摇头。在他成年后的生活中只和两个女性交往过，如果“交往”可以用这个词形容的话。其中任何一个都不足以让他产生兴趣。


    但是 `Gretchen`……


    他的心在胸腔里剧烈加速。即使他不认不出她，她也勾起了了他的兴趣，甚至更多。她总是能做到这一点。


    “忘掉吧！”


    `Kwasi` 从思绪中回过神，看到 `Kojo` 甩手挥向空中并径直而去。他一定说了些深刻而有见解的话，但他没听见。


    他漫无目的地走进客厅，盯着电视的黑屏幕。尽管过去有着所有的痛苦，他再次想要 `Gretchen` 了。这次，是要永远一子的。


    ![](img/00002.jpeg)


    坐在咖啡馆外时，新鲜出炉的面包和甜点的香气飘进鼻尖。`Java Cupid` 咖啡馆是他们的共同点。他们两人出现了两次。灵感是对的。如果他每天呆在这里，早晚他们都会进入他的视野。


    `Java Cupid` 的名声甚至传到了他的耳朵里。那些引导人们找到真爱的消息像野火一样蔓延开来。咖啡馆能够满足对咖啡的需求并非易事。人们在咖啡店里进进出出，疯狂地盯着杯子，等待信息的出现。


    被这个主意吸引，他拿起自己的一杯咖啡——那是高效且友好的员工提供的——扫视了表面看是否有信息。没有。


    但那时他并不是在寻找爱情。他在寻找一组白化了骨头。


    阳光照射在门缝上的光芒让他朝那个方向看了一眼。他吸了一口雪茄，当看到那个坐轮椅的人从咖啡馆出来时僵住了。愤怒的恨意在内心涌动，几乎要烧掉他的一层皮肤。没有抽完雪茄，他无情地将其按在车烟缸里，反复揉搓直到它化为碎末的烟草叶和灰烬。


    猛地拉开车门，他冲出了车。顾不上交通，他大步穿过街道来到 `Java Cupid` 停车场。坐轮椅的男人抬头看了一眼，然后停止了动作。他的对手看到从他眼中迸发的地狱之火了吗？他真的应该看到。


    抽雪茄的男人弯下腰，直到鼻尖几乎接触。“它们是我的，”他没有任何介绍地吼道。


    “是我先付了钱的。那些骨头是我的。”轮椅男人咳嗽着。抽雪茄的男人来不及躲避溅落在轮椅男人下角的唾液。他那喘息声让抽雪茄的人想起老妇女沉重的呼吸。


    他直起身体，眯起眼睛向下看。“你向村长老那里付了多少钱？”


    一个不在意的耸肩。“一万。”


    抽雪茄的男人撇起嘴，冷哼一声。“哼。我也付了同样的钱。”


    轮椅男人转动椅子。他那张布满疣肿的脸盯着抽雪茄男人严厉的面容。但他并不害怕。他从不怕他。即使抽雪茄的男人手里拿着枪并将枪口指向他的头，他依然不会害怕。


    “为了那两块，我等了二十年。”轮椅男人抠了抠鼻子，然后吸了吸。“你抢不属于我的东西。”


    抽雪茄的男人摸了摸口袋里的雪茄，然后想起把剩下的留在了车上。“我们谁都没有偷。毕竟，我们都付了钱，不是吗？”


    不情愿的认同了这个事实。“那么，”轮椅男人慢悠地说，“你想来吗？”

