    “Obviously not,” he replied.


    “All right,” Kojo sighed as he flopped back into the chair. “I can see we’re going
    to get nowhere if we don’t get this woman out of your head.”


    Out of his head? He had a feeling she was more than just in his head.


    “I’m going to spell it out for you. She almost got you killed. Did you forget
    that?”


    “No,” Kwasi answered slowly. “I haven’t forgotten.”


    The claw marks on his back flamed anew. Although he had spent many years suppressing
    those memories, he’d never forgotten. Two days ago, he’d seen her again after
    twenty years. The initial rage was supplanted by a strange mix of nostalgia and
    confusion and an undercurrent of something even deeper. A resurgence of an emotion
    he wasn’t sure what to call.


    “Afia—”


    “Call her Gretchen,” Kwasi interrupted.


    “Gretchen,” Kojo acquiesced without missing a beat, “told the elders you had magical
    powers. She showed them the mark and they came after us.”


    “I know,” Kwasi hissed through clenched teeth. “I was there.”


    “They killed our parents because of what she said. If the O’Briens hadn’t risked
    their lives to save us—”


    “I know!” Kwasi leapt up from his own chair and paced the room. Visions of his
    mother and father’s bodies flashed in his head. He shook it violently to rid himself
    of them.


    “You keep saying that.” Kojo leaned forward on the desk with his hands forming
    a steeple under his chin. “So why are you letting her control you again?”


    He paused. “Control me again?”


    “Don’t make me tell you what’s obvious.” His brother slid his gaze away from his.
    “You know what I mean.”


    “No, I don’t believe I do.” Kwasi’s voice quieted while a dull roar of foreboding
    resounded in his head.


    Kojo was silent for a moment and then he shifted his eyes back to Kwasi. “Gretchen
    and her sister were our only friends in the village. No one wanted anything to
    do with us. But Gretchen could get you to do anything she wanted you to do.”


    “That’s not true.”


    “It is, Kwasi. It was worse when the elders made you two get married.”


    Getting married at eleven years old to a six-year-old girl may be the stuff of
    the western world’s nightmare but for him, being told to marry the one girl in
    the village who didn’t look at him with abject horror had been the stuff of dreams.
    The nature of their lives in a poor village had given them both maturity. The
    O’Briens had gone back and forth with the elders. Though they had been unable
    to prevent the marriage, they worked hard to ensure the age of consummation for
    Gretchen was fifteen.


    Not content with waiting so long but due to their respect for the interfering
    but kind missionaries, the elders countered that his and Gretchen’s consummation
    would happen with either her first blood flow or when she turned fifteen, whichever
    arrived first.


    The day the elders painted his and Gretchen’s faces the same color, representative
    of their union, was the happiest day of his life. For himself, it hadn’t mattered
    how long he would have waited. She was his and his alone.


    A year later, he and Kojo almost died.


    “I remember how you used to go into the forest with her without me. Whatever she
    wished, you did.”


    How could his brother understand what it was like to have Gretchen as his child
    bride? To have her look at him and not see an ugly, dirty, aberration of nature?
    To touch him without reservation? Other children in the village had ostracized
    him but she never had. Nor had her parents.


    Her acceptance was as intoxicating as any drug. Mesmerizing as any spell.


    His mark upon her skin as binding as any eternal vow.


    “Just let her go. Don’t let her get one finger onto your life again. She almost
    destroyed you the first time. I couldn’t stand if she—”


    Kojo’s phone rang, blessedly bringing an end to the conversation. His brother
    answered the phone the same way he did. “Kojo O’Brien?”


    An undecipherable but definite female shrill voice came through so loud, Kwasi
    wondered how his brother could keep the phone to his ear.


    “How did you get my number?” Kojo shouted to the upset female.


    Kwasi let out a burst of laughter. “It’s your animal magnetism. They just can’t
    resist you.”


    His brother glared at him over his shoulder. “Go slam your head into concrete!”
    he ordered with a threatening eye.


    The voice on the other end grew louder. So much so Kwasi made out the words, “Who
    you talking to? Do you know I’ll drop kick you into next week?”


    “I’m not talking to you,” Kojo retorted back.


    Kwasi grinned and said sweetly. “Making one of your women upset again?”


    “Bro!” Kojo hissed. “Get out!” He picked up a miniature basketball and flung it
    at Kwasi. He caught it deftly and twirled it on his finger.


    “Well, I’ll let you two lovebirds work it out.”


    With ease, he tossed the ball back to Kojo, who caught it without looking. Closing
    the door, he heard the last bit of Kojo’s conversation. “I told you I have it
    under control.” The wording niggled him. Have what under control? The contract?
    Something else?


    Kwasi mulled over it for a few seconds but then shrugged. Kojo didn''t know what
    we were to do.


    They shared in the mirth. All the while, Gretchen wondered how long it would be
    before she could escape. Did she really think Kwasi would show up just because
    she wanted him? How stupid could she be! The man hated her. Although he had initially
    expressed an interest in her, once he knew her identity, no man in his right mind
    would come within twenty feet of her.


    ![](images/00002.jpeg)


    Gretchen let loose a bubbly laugh while inside she fought to keep the disappointment
    from crushing her.


    “It’s no problem at all,” she assured Principal Chung. “I’m glad to do what I
    can to educate our youth.”


    “Thank you again, Ms. Ozinga.” Principal Chung patted her hand and smiled, her
    face a tell-tale sign of relief. “I didn’t know what we were to do. The board
    would have my head for sure.”


    “I’m sure you’re exaggerating.”


    Gretchen picked up her cup of Java Blend and savored the taste with a long sip.
    She’d probably drink this tea for the rest of her life.


    “Well, if the wouldn’t have her head,” Principal Carter interjected with a waggle
    of his broad, unruly eyebrows, “they would have mine.”


    “I think that’s a good idea as well,” Principal Chung’s voice jolted her back
    to the present. Gretchen shifted her gaze from one principal to the other. She’d
    missed something.


    “The children could stay a little bit longer so we can coordinate the departure
    schedules.”


    Gretchen tuned them out. She scanned the café for the hundredth time, checking
    in vain for the sight of a blond afro and gray tinted glasses. Java Cupid’s hubbub
    hummed like a rhythmic beat. Customers laughing out loud or murmuring, chairs
    scraping the floor, slurping cans of whipped cream, and the harmony of the coffee
    house played on. The ding of the cash register opening led her gaze over to her
    favorite barista. Jeb looked up a second later and caught her eye. Grinning, he
    gave her the thumbs up sign and went back to whatever it was he was doing.

