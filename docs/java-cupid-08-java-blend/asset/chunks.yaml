    “没事，”当杰布正要开口时，夸西回答道。“我会处理的。”


    她皱起眉头。“但你输了比赛。”


    “我想要的是和你相处的时光，”夸西说道，让她大吃一惊。“哪个男人会放弃和美女坐在一起聊天的机会呢？”


    如果这就是夸西，如果他知道他们过去的过节，他会有什么反应？那段充满了痛苦的过去让她在回想起童年时依然感到艰难。他还会觉得她有吸引力吗？


    “来吧，格蕾琴。坐我这儿，我们聊一会儿。”


    这正是问题所在。他的魅力让她渴望顺从他眼中的邀请。还有他那厚实而多汁的双唇，让她很难不不移开视线。但如果这就是夸西，如果他知道她是谁，他最不想做的事情就是和她说话。


    他会想想杀了她。


    “拜托了？”他用一种装作娇媚的样子眨了眨眼睛。


    她重新审视着他。这个性感的标本与她过去那个苍白、瘦削的男孩完全不同。她盯着他的微笑看。那双粉红的西柚唇。它们看起来就像那种一旦咬住女性的身体，除非他完全准备好，否则不会放开。


    但如果他是她希望他不是的那个人，那么那张丰满的嘴可能已经锁在了她的身上，结果是毁灭性的。


    他是夸西吗？那个他们小时候被她几乎杀掉的男孩？只有一个方法可以确定。


    他伸出一只手，悬在半空中。她凝视着那只线条完美的手，决定不顾一切。当她自己的手也覆上去时，一阵电流贯穿了她的全身。她轻轻捏了捏。“好啊，为什么不呢？”


    # 第二章


    ![](img/00001.jpeg)


    夸西很纳奇格蕾琴脸上表现出的焦虑感从何而来。绝不可能是因为一起喝了茶。他带着那种他双胞兄弟所讨厌的典型漫不经心，将这件事从脑海中甩掉。没关系。只要她的神经，或者躲在那双大眼睛后的某种东西没有阻碍他留在她身边的欲望，他就不会让这困扰他。


    松开她柔软冰凉的手，用自己的杯子轻轻碰了她的杯子，以此作戏致意。“干杯。”


    她笑了，尽管嘴角还在颤抖。“干杯。”


    他们漫步走向一张被巨大的玻璃窗洒满阳光的桌子，窗外是停车场。听到格蕾琴吸了一口气时，他停下了脚步。


    “怎么了？”他问。


    她的眼睛盯着一张桌子，那里有一情侣和一群女士坐在一起。“我的天哪！那是 R. G. 多诺万和他的妻子奥罗拉！”


    他看向附近的一张桌。不知道这有什么大不了的，他简短地回答道：“噢。”


    她像芭蕾娜一样转过身。“你一定听过这事吧？有个疯子试图破坏他和他女朋友的关系，于是他去了 Facebook 上，让他的粉丝们都试图让她原谅他。这太浪漫了。”


    夸西又看了那个家伙一眼。“他是做什么的？”


    “他是个浪漫小说作家。”


    “我明白了。”听她这么说后他失去了所有兴趣，因为他认为自己不可能读虚构小说，更不用说浪漫小说了。他转移了话题。“你是做什么的？”他们坐下时他问道。


    格蕾琴喝了一口茶。“嗯。这真好喝。那股巧克力精粹和香草的味道很对味。”她的舌头舔了舔唇。夸西的腹部肌肉由于反应绷紧。那转瞬即逝的粉红色让他想起包裹在黑巧克力里的水果果心。


    尝起来会是什么味道——


    “回答你的问题，我是怀特德博物馆原住民和部落采集的主管。”


    她的回答打破了他关于品尝她口中甜味的幻想，但尽管如此引起了他的兴趣。“我不明白那是什么意思。”


    她发出一阵惊讶的高声笑声。“我喜欢你的诚实。大多数人只会点头，并假装自己很懂。”


    夸西喝了一口自己的茶。很好。“我不是那样。我宁愿无知也不愿假装聪明。毕竟，无知是可以弥补的。”


    她点了点头。“嗯，基本上就是寻找原住民文化的文物，并将它们带到博物馆进行保护。这需要大量的旅行和研究。”


    “听起来很有趣，”夸西说。“你亲自去过探险吗？”


