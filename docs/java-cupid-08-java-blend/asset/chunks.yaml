    An unseen fist punched his stomach. What man on earth wanted to hear another man’s
    name on the lips of the woman he’d just kissed? Not one, especially with the woman
    who just knocked him out of his socks. His teeth ground against one another. He
    loved his brother more than anyone in the world but when it came to Ayawa…


    He wished he could send his brother to the other side of the world. Maybe then,
    she’d see him.


    Why not be Kwasi?


    He stiffened at the thought and Ayawa glanced up. “Kwasi, what’s wrong? Aren’t
    you happy to be with your wife again?”


    Lying had always come easy to Ayawa. She never gave much away when she lied. Her
    cow eyes gazed up into his with their milk-white orbs and sheen of questionable
    innocence. Even when they were children and lived in the village in Tanzania,
    she could spin a yarn to rival the storytellers he and Kwasi used to sneak and
    listen to at night.


    Since lying came to easy so her, why shouldn’t he join her in her game? As a kid,
    they loved to play games with each other. Competition was part and parcel of their
    relationship. Ayawa, his only friend and his best rival.


    Why not be his brother? Since she wanted him so much, why not give her him?


    “Yes, Afia. I’m happy we’re back together again.”


    # A WORD FROM PARKER


    My twin is the other half of me. She is my cheerleader and my biggest fan. I’m
    the oldest twin by a whopping one minute but we are very close. As fraternal twins,
    we do not have the mystical twin bond that exists for identical twins but it’s
    pretty close. A mere look and I know what she’s thinking. The same for her.


    In 2016, something quite devastating happened to my family. My twin sister was
    diagnosed with cancer. What followed was an exercise of faith and trial of family
    togetherness. I stepped into an unchartered territory I’d never been in before.
    I watched someone I love very much suffer in pain and there was NOTHING I could
    do about it.


    As of this year, she is cancer free. I pray God we NEVER have to go through this
    again.


    Java Blend and Java Rift is an exercise of exploring the bonds of twinhood and
    what makes it so special. When my own twin bond was threatened, it made me appreciate
    God’s wisdom in having me born WITH her than WITHOUT her.


    Obviously, we’re better together.


    Until next time, carpe diem!


