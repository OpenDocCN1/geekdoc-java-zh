- fmt: '

    The mysterious `cupid`. Who was putting these messages on the cups. Jeb? No. This
    message struck at the core of his being. It revealed a part of his psyche only
    `Gretchen` as a child could understand.


    “Do you know why I—what’s that on your mouth?” `Kojo` lifted his brow. “Huh?”


    “Dude, what’s that on your mouth? It looks like a brown stain.”


    Watching his brother swipe at his mouth, he saw his brother still again as he
    stared at his hand. “Oh, must be some dried coffee or something.” Why did `Kojo`
    look so nervous? And why wouldn’t he meet his eyes?


    `Kwasi` snapped his fingers as he remembered the altercation from the coffeehouse.
    “That’s another thing. Why did you go after `Gretchen`’s sister like that?”


    “Go at her how?” The words came out hoarsely. If `Kwasi` didn’t know any better,
    he’d have sworn `Kojo`’s skin had blanched to paper white. The man almost looked
    bloodless.


    “At `Java Cupid`. You grabbed her like you were about to hurt her.”


    Did a look of relief cross `Kojo`’s face? “I wasn’t going to do anything like
    that. She was just pissing me off with the way she was treating you.”


    Lies. `Kojo` was lying to him. `Kwasi` knew it as sure as he knew he was breathing.
    But lying about what?


    He wracked his brain, going over the conversation. Nothing on the surface leapt
    out at him like an ‘aha’ moment. But he knew his twin was lying. Perhaps it had
    to do with his personal life. Unlike himself, `Kojo` had women coming in and out
    of his life like stations had buses. He worked hard and played hard, as the saying
    went. Maybe he got into it with one of them.


    `Kwasi` shook his head. He’d only been involved with two women in his adult life,
    if involvement could be the term used. Neither of them remarkable enough to keep
    him interested.


    But `Gretchen`…


    His heart catapulted in his chest. Even when he didn’t recognize her, she’d piqued
    his interest and more. She’d always been able to do that.


    “Forget it!”


    `Kwasi` came out of his thoughts to see `Kojo` fling his hand up in the air and
    stalk away. He must have been saying something profound and insightful that he
    hadn’t heard.


    He wandered aimlessly into the living room and stared at the black screen of the
    TV. Despite the past and all of its hurts, he wanted `Gretchen` again. This time,
    for keeps.


    ![](images/00002.jpeg)


    Fresh baked smells of bread and sweet pastries wafted to his nose as he sat parked
    outside of the coffee house. `Java Cupid` café was the common denominator. Twice
    both of them had shown up. The spirits were right. If he stayed here day after
    day, sooner or later, he’d have them both within his sights.


    Cigar smoke floated around in the interior of the old `Cadillac` car. The notoriety
    of `Java Cupid` had reached even his ears. News of messages leading people to
    their true loves had spread like wildfire. It was no small feat the café was able
    to accommodate the demand for their coffee. People bounced in and out of the coffee
    shop, gazing furiously at the cups for a message to appear.


    Intrigued by the idea, he picked up his own cup of joe, courtesy of the efficient,
    friendly staff, and scanned the surface to see if there were messages. None.


    But then, he wasn’t looking for love. He was looking for a set of albino bones.


    The glint of the sun on the opening of the door made him glance in that direction.
    He puffed on the cigar and then froze when he spied the man in the wheelchair
    coming out of the café. Seething hatred swelled inside. It threatened to burn
    away a layer of his skin. Without finishing the cigar, he stabbed it mercilessly
    into the car’s ash tray, grinding until it disintegrated into nothing more than
    crumbled tobacco leaves and ash.


    Ripping the door open, he launched himself out of the car. Uncaring of traffic,
    he stomped across the street to the `Java Cupid` parking lot. The wheelchair-bound
    man glanced up and then stopped moving. Did his adversary see the flames of the
    netherworld bursting from his eyes? He really should have.


    The cigar man leaned down until they almost touched noses. “They belong to me,”
    he snarled without introduction.


    “I paid for them first. Those bones are mine.” The wheelchair man coughed. The
    cigar man barely had time to duck in order to avoid the spittle dotted on wheelchair
    man’s chin. His wheezing sound reminded the cigar man of a rattling labored breath
    of an old woman.


    He straightened up and squinted down. “How much did you pay the village elders
    for them?”


    A careless shrug. “Ten thousand.”


    Pursing his lips, the cigar man snorted. “Hmph. I also paid the same amount.”


    The wheelchair man rotated his chair backward. His wart-pocked face peered up
    into the thunderous visage of the cigar man. But he wasn’t afraid. He’d never
    been afraid of him. If the cigar man held a gun in his hand and pointed the barrel
    at his head, he still wouldn’t fear him.


    “I’ve waited twenty years for those two.” The wheelchair man picked his nose and
    then sniffed. “You’re not going to take what is rightfully mine.”


