    “Fine. I’ll see her tonight and take over some flowers. Purple ones.”


    She would have continued the conversation but she couldn’t spare another minute.
    “I gotta go, Charlie, but we’ll talk later.”


    “Hurry before he goes.”


    She spared a quick stare at Charlie. His bright smile held only good will. She
    dashed out of the café and into the parking lot. Shielding her eyes from the sunlight,
    she darted her gaze around until it landed on Kwasi near a silver Cadillac Deville.


    “Kwasi, wait!”


    He inclined his head toward her voice but didn’t look at her. “Yes?”


    She gulped. “You’ve known me for a long time.”


    His head shook back and forth in confusion. “Come again?”


    Plunging into the abyss of no return, she screeched out, “It’s me. Afia. Your
    wife.”


    # CHAPTER THREE


    ![](images/00001.jpeg)


    The keys fell from his sudden, nerveless fingers. All activity muted as if sucked
    into a vortex. His heart beat pounded like a piston threatening to punch through
    the confines of his chest.


    Afia.


    Kwasi flinched. It hurt to say her name, much less think of her.


    His body hardened like stone, fighting his brain in a battle to stay put and not
    give her a second glance. Yet, with a supreme force of will, he made his body
    obey the dictates of his mind.


    “Afia?” A visceral pain sliced across his stomach.


    She nodded slowly, the white of her eyes once again giving her that doll-like
    appearance.


    “It’s me, Kwasi.” Gretchen—no, Afia repeated, taking a tentative step in his direction.


    A cascading avalanche of memories almost toppled him over. He should have known
    the moment she stepped into Java Cupid it was her. No one had ever been able to
    draw his attention as she had. Even as a young boy in the village of their childhood
    in Tanzania, he’d been enraptured by her. How often had the sight of her pure,
    black skin mesmerized him, so different from his own dirty paleness?


    “Why didn’t you say anything earlier?” Was that his voice so nonchalant and even?
    How could it be so misleading when a curious heat from the bottom of his feet
    began to rise up his legs?


    Gretchen - calling her Afia hurt too much - took another cautious step. The long
    slim column of her throat convulsed nervously. “I didn’t know it was you until
    Jeb said your name. And then…I hoped I was wrong.”


    A breath he hadn’t been aware he held until it eased out drained him of strength.
    He leaned on the car for support. He felt very much like an old man.


    “I thought I’d never have to see you again.” He’d whispered the words, but she
    heard them just the same.


    “I know. I didn’t expect to see you, either.”


    “The moment you found out, you should have left, you know.” His voice had dropped
    an octave as the heat traveled further up his body, centering in his gut.


    “I tried to,” she answered back. “Why do you think I was trying to get away?”


    So, he was the cause of her sudden desire to leave. “It wasn’t fast enough.”


    Silence enveloped them even as people glided in and out of the café. More warmth
    flowed up his chest and on to his cheeks. His eyes raked over her, seeing her
    again for the first time as Afia—now Gretchen—from his youth.


    Her skin shone even brighter in the sunlight. Hadn’t it always? That unpolluted
    silky darkness she retained since childhood gleamed healthily like a shimmer of
    diamond.


    A long ago, patted-down memory resurfaced. The specter forms of four children
    dashed in front of him as if they were real. A pair of boys with yellow hair and
    powder skin raced ahead of a pair of girls with cropped hair and bright smiles.


    His eyes followed them down an imaginary path that once resembled the trail from
    their village to the large forest. It was a nice memory, he had to admit. Many
    of them were. Gretchen and her sister had played with Kojo and himself without
    fear. Many days they dallied on the edge of the forest, sometimes daring each
    other to go further into its opaque depths to see who was the bravest.


    “Kwasi?”


    Her voice made the visions of their youth dissipate like a mist. As the scar along
    his back pulsed anew, his fury encapsulated his brain and the happy memories burned
    away like the edges of charred paper.


    “I could kill you.” He ground out between his gritted teeth


    Her slender hands clasped together but she held firm in the face of his wrath.
    “I know.”


    “I don’t think you do,” he growled.


    The weakness left him as swift as it had come. Rage powered his legs and he stalked
    toward her, ripping off his T-shirt and flinging it to the ground. “I don’t really
    think you do.”'
