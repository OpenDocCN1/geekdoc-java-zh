  trans: '

    同事们停下脚步来和她聊天。她处于自动模式回应着他们，完全没有露出一丝没听见他们说的任何话的迹象。在内心，她想要尖叫，但她姐姐曾说过，她假装兴趣的能力应该被归类为超能力。


    格特琴回到办公室后，倚在门上，目光在房间里环视。这个狭小空间里的的一切都见证了她对根源痴迷。尽管她和双胞胎姐姐不得不逃离村庄，以避免可能降临在她身上的恐怖，但她从未忘记过。


    从塞满每个角落的部落文物和复制品，到墙上挂着的自然与简约风格画作，再到关于人类学、考古学、神话和传说的书籍，这个空间的一切都显示了她对坦桑尼亚一个无名小村庄的卑微出身的热爱。同时也凸显了她渴望弥赎的罪孽。


    她拖着沉铅般的脚步走到桌旁坐下。她集中注意力，脑海中排除了除了姐姐以外的所有念头。“我需要你，”她在安静的房间里低声说道。


    格特琴等待着，凝视着墙上贴着的战士面具。那是她父亲多年前制作的。四分钟后，她的手机响了。


    “怎么了？”她的姐姐在电话那头喘着气问道。


    “跑步机？”


    “对。今天跑了十英里。”


    格特琴脑海中浮出一个自己的形象：穿着紧身衣和运动胸罩，在一个半拥挤的更衣室里喘着气，长辫在脑顶上扎成髻。她的双胞胎姐姐——她灵魂的另一半。


    “格特鲁德，你不会相信这的。”她从桌上拿起一个娃娃。那是她在访问过的某个村庄里的一个女人制作的。当地翻译告诉她，这是一份表达帮助的礼物。格特琴用手指擦了擦珠子的眼睛。*我现在正需要一点帮助。*


    “你尽管说，”格特鲁德气喘吁吁地说。


    当夸西的形象像幽灵一样出现在她面前时，她闭上了眼睛。“我丈夫活着。”


    格特鲁德在电话那头发出一声窒息的。“你在开玩笑吗？”她姐姐惊呼道。


    “我没开玩笑。”


    “我们以为他死了！”


    格特琴点头，就好像格特鲁德就在她面前。“他没死。他活着。”*有着我见过最性性的嘴唇和身体。*


    “他哥哥在场吗？”姐姐的声音里带着一丝格特琴无法准确捕捉的尖锐。格特鲁德听起来几乎很紧张。可能是忧虑。但她的双胞胎姐姐有什么理由有那种感觉？格特琴把这个奇怪的想法从脑海中甩掉。


    “不，他不在。”


    “当你再次见到他时发生了什么？”


    *我流口水了。* 热气涌上她的脸颊。她怀疑姐姐不想听那个，于是她说了关于夸西反应中更残酷的现实。“他非常愤怒。”


    “他没有理由对你生气。”


    “相反，盖蒂，他有。如果不是因为我这破破嘴，猎人永远不会——”


    “你真的相信那吗？”格特鲁德在电话里喘气道，“他们会利用任何借口杀掉夸西和科霍，你很清楚。”


    “而我给了他们那个借口。”承认自己的帮凶让她感到痛苦。“盖蒂，他问起那个标记了。”


    “圣母玛利亚和约瑟夫！求你告诉我没让他看到它。”


    格特琴什么都没说。她没必要说。


    “你为什么要那样？”格特鲁德大喊道，“你我都知道他会……”


    “我是他的妻子，盖蒂。我知道他会做什么。”


    在深色的墨镜后，他的眼睛由于极其强烈的情绪而眯起。当他要求她展示标记时，她本可以忽略他的请求并打发他的要求。但那个标记是他们共同的噩梦的催化剂。他有权知道它仍然存在，正如她有义务让他意识到它的存在一样。


    “你不是他的妻子！”盖蒂坚决的声音打破了她的沉思。“长辈们举行仪式时你才六岁。即便在那时，他们也希望你等到初潮之后再去做做任何像妻子一样的事。”


    格特琴的眼睛依然盯着战士面具。“也许吧。”


    “况且那是二十年前的事了。我真不敢你现在还觉得你……”

