    Gretchen nearly jumped out of her skin. She hadn’t even heard or sensed her sister’s
    presence. Gertrude and Kojo stood side by side, their open mouths and wide eyes
    masks of horror.


    “Gertie. How—”


    “Why are you listening to this bull crap?” Gertrude shouted. “We’t owe him any
    explanations.” She whirled on Kwasi, her braids fanning in a wide arc. “My sister
    did not try to hurt you, do you understand?” Then she leaned forward until her
    nose almost touched Kwasi’s. In a deadly tone, she clipped out, “You stay away
    from her.”


    Kojo grabbed Gertrude’s arm and yanked her back from looming over brother. “You
    better make her stay away.” He stabbed a finger in both. “You can live in denial
    all want but she’s poison.”


    The tint of Kojo’s eyes could not contain the fury emanating from him was hot
    enough to singe the hairs along Gretchen’s skin. “You’ve done enough to my family.”


    “Don’t talk to my sister way,” Gertrude snarled as she went toe to toe with Kojo.


    “Then don’t talk to my brother like you did.” He thumbed a finger at Gretchen.
    “Get her out of here.”


    Gertrude’s hands landed on both hips. “You get him out of here.”


