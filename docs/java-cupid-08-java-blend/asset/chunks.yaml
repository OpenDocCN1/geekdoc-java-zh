    她拿起包包。“很高兴见到你。”她重新戴上那副礼貌的伪装。“玩猜游戏很有趣。谢谢你的茶。”


    好了。她把一切都收拾得井井齐齐。


    “你为什么突然要走？”


    格蕾琴愣住了。“哈？”


    他身体前倾。“你为什么要逃跑？我本以为我们过得很愉快。至少，对我来说是这样。”


    她试图避开他那锐利的目光，但发现自己又一次被他那催眠般的吸引力锁住了。“我不是的。我有约会。”


    “几点？”


    她的大脑一片空白。“嗯——”


    “你不必离开，”在她来得想出一个合适的回答之前，奎瓦西回答道。“我会走的。”他喝掉了杯里的液体。随着他的动作，他的喉结上下起伏，彰显了他的男性气息。


    他把杯子放回桌上，向她投去一个忧郁的眼神。一滴茶挂在他的嘴边。尽管不安感在增加，但那一幕依然勾起了她放荡的想法和欲望。


    从他们小时候起，一切已经发生了太多变化。毕竟，她从未想过自己还会见到奎瓦西和科霍。她青少时代的童年好友已经变成了拥有令无数女性侧目非凡能力的男人。他确实让她把头转了
    360 度。


    “你知道的，如果你真的不想让我陪你，可以直说。”他站了起来。“祝你今天过得愉快。”


    格蕾琴经历着一场激烈的斗争。一方面，通过得罪他，他永远不会猜到她的身份。他们过去的秘密将保持安全。


    她的另一部分又拒绝让他带着对她最坏的打算离开。又也许她应该这么做？她呻了一声。为什么她不能下定主意呢？


    “奎瓦西，等一下。”在她停下之前，话已经脱口而出。脑海中的警钟大作响。


    “不，格蕾琴。我们并不认识。但你至少可以开诚相待。我们再见。”他发出一声刺耳而毫无幽默感的笑。“不，实际上，我们不会再见的。再见。以为你会和别人不同是我的错误。”


    她紧张地咬着嘴唇，眉头紧锁。“不同？你什么意思？”


    他傲慢地挑起眉毛，平添了一种性感而邪魅的神情。


    “现在你好奇了？很好，别好奇。”


    他离开桌子朝门口走去。一个高个男人撞到了他，除了快速的道歉外，奎瓦西继续往前走。奇怪的是，奎瓦西手里一直握着那个空杯，没有把它扔进旁边的垃圾桶里。


    格蕾琴看着他离开，在一种前所未过的、女性追求的新欲望和对匿名性的自我保护之间挣扎。


    她应该让他走吗？如果她这样做，对他们双方都更好。在那个念头的结尾，另一个念头随之而来。这是她在做每一个重大决定时一直遵循的人生信条。生命太短，没时间考虑“万如果”。


    她慢慢站起身，低头看着茶杯上的信息。“爱能宽恕一切，甚至是死亡。”如果她让奎瓦西走出“Java 丘比特”咖啡馆，她是否还会发现这种情感是否为真。

