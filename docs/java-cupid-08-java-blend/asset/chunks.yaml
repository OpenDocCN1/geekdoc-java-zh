    admission. Though there was no way the people over there could have heard what
    he said, the burn of embarrassment still made its way up his head to settle on
    the tips of his ears. The minute the words left his mouth he wished he could retract
    them. Cursing under his breath, he wondered what kind of spell did she cast to
    make him act like an acne-pocked teenage boy?


    “The second, best day of your life?” Gretchen repeated. “What was the best day
    of your life?”


    Clearing his throat, he debated on how transparent he should be. But he’d already
    revealed himself more than he intended to. Why stop now?


    Fiddling with the napkins on the table, he answered, “The day I married you.”


    Her doll-like eyes widened and her mouth formed a perfect ‘O’. Surprise emphasized
    her beauty, bringing into sharp focus her high cheekbones and narrowed chin. Was
    there ever a lovelier picture than the one she created?


    Her dark smooth skin with its untainted finish gleamed with inner luminosity.
    Long arms topped with slender, elven fingers and oval-shaped nails danced on the
    rim of her cup as she took in his statement. The crop of thick, wooly hair, pulled
    back with a wide orange band, gave her a halo effect and put him in mind of an
    angel.


    But she’s not an angel. She’s the child who almost had you killed.


    His mouth tightened at the corners. He’d do well to remember that.


    “But I was six years old,” she said slowly, a kind of dismay clouding her features.


    Kwasi threw her an exasperated look. “I wasn’t eager to be physical with you so
    put your mind at ease. Half the time I had no idea what the elders and the O’Briens
    were going on about. I was more excited about getting our faces painted than anything
    else.”


    Her mouth twitched. “Me too.”


    If there was one consolation he got from all the pain of his childhood, he was
    glad he didn’t follow the tradition of his people with their child brides. After
    all, a mature woman had so much more to offer. A hot wave of appreciation brushed
    his stomach like a blatant caress as his eyes hungrily ate up what he could see
    of the dips and swells of her body above the table.


    As an adult with a normal appetite of any hot-blooded male, he appreciated the
    full blossom of this dark rose across the way.


    “I was also glad when we got married,” she said unexpectedly.


    Kwasi stiffened in shock. “You were?”


    Her shoulders hunched and she looked away. The profile reminded him of the elegant
    and regal bearing of a cameo.


    “I wanted you and only you to be my husband,” she went on. “Perhaps I didn’t understand
    the physical implication of what being a wife entailed. I only knew Baba and Mama
    were happy. I knew we would be happy, too.”


    His chest expanded. “Then—”


    Gretchen turned back to him. “It was a good day for me, too,” she finished.


    Around them, the Java Cupid café hummed. Coins clinked in the tip jar. Jeb hollered
    out an order. The frothing machine whirred. In the midst of all the noise, a cocoon
    of silence enveloped him and Gretchen, lined with unspoken words and emotions
    too shy to express themselves. But within him, the casing around his heart suffered
    its first hairline crack.


    Don’t be stupid! Kojo’s voice blared in his ear. Don’t let her do this to you
    again.


    As if his body were in cahoots with his twin, the wound from the tiger’s claws
    fired up. In his mind’s eyes, he pictured the keloidal streaks on his back. Four
    straight gashes and then another smaller one from the fifth claw that had been
    dangerously close to puncturing his ribs.


    No, he didn’t need reminding of what Gretchen had done.


    “Why?”


    The single question recaptured his attention. She’d placed her hand over where
    the mark was. “Why?” she asked again.


    How best to answer? Peeling back the veil of that fateful day, he remembered it
    had started off as any other in the village. After the chores he and Kojo were
    assigned by the elders to do were completed, they hurried over to Gretchen and
    her sister’s house. Their mamas often spent the day together as they cooked, made
    baskets to sell in the city, or relaxed in the heat of the day.


    He saw his childhood self, barely clad in a threadbare gray shirt and dingy shorts,
    run into the dim but happy interior of the hut. Kojo and he had latched onto their
    respective playmates, or in his case, his bride, and ran with them to the fields.


    Kojo and Gretchen’s sister had gone further up the trail to do whatever they had
    planned. He and Gretchen had stayed closer to the village, playing in the mud.


    How would things have played out if the O’Briens had been there? Whenever he forced
    himself to travel down this landmine-scattered path of misery, he often asked
    that question. As always, he admonished himself. It was useless to speculate. 
    The O’Briens hadn’t been there. They’d left for a quick trip back to the U. S.
    to gather more funds for their village. The school he and Gretchen would have
    attended had closed down while they were gone.


    They played in silence for some time, content with each other’s presence. Later
    on, Gretchen had wandered away. Bored by himself, he’d picked up a stick and practiced
    spelling his name. He’d come to the “w” which appeared more unsteady than a drunk
    when Gretchen’s voice screeched.


    If he closed his eyes, he could hear it as if it were yesterday. Her clear, high-pitched
    yell.


    “Kwasi, help!”


    He’d leapt up and barreled through the high grasses where she’d gone. He found
    her in a small clearing, her small, yellow-draped figure tense.


    “What is it, Afia?”


    “Look!” Her face full of fear, she tried to look behind her. “It’s on my neck.
    I can’t get it off.”


    “What is it?” Drifting closer to her, he cast a cautious eye over the surrounding
    area. He wanted to make sure no morning predators would think of seeing them as
    a feast.


    “I don’t know.”


    To this day, he’d never discovered what kind of insect it was that landed on Gretchen
    that fateful day. Once, years later, he’d spend the better part of a day searching
    online to see if he could identify the creature which wreaked havoc on his life.
    It was a multi-legged monstrosity with wings. That was all he could gather from
    the brief glimpse of the thing.


    “Ugh!” His skin crawled.


    “Get it off!” she yelled shrilly. “It’s hurting me!”


    His practical mind shouted out, “I don’t want to touch it. It may hurt me, too!”


    She’d folded her arms across her flat, bony chest. “Husbands are supposed to protect
    the wife. So, protect me!”


    His boyish mind reeled with the implications of what she’d said. “I don’t want
    to be the husband anymore.” Not if he had to touch an ugly-looking bug like the
    one attached to her.


    “My Baba always helps my Mama. You get it off me, now!”


    Her tiny fists threatened harm but it was the fear evident on her face that made
    him relent. Afia was his wife now. Just like his own Baba took care of his Mama,
    he had to take care of her.


    “Kwasi?”


    Gretchen’s voice hauled him out of his reverie. A quizzical expression dominated
    her features.


    “What did you say?”


    “You were going to tell me why—”


    “I was just remembering, is all.” He grunted. “That was a nasty-looking bug. It
    creeped me out.”


    She blinked. “You? What about me? It attacked me!”


    He drummed his fingers on the glass top table. “I still get scared of bugs. And
    I’m a grown man.”


    Her unreadable gaze roved over him in a slow, languid fashion. It revealed nothing
    of her thoughts but its intensity left his body tingling in awareness.


    Did she like what she saw? After all, he wasn’t a scrawny little boy anymore.
    He worked out several times a week in order to remove himself from the helplessness
    of his youth.


    “That you are,” she said in a low tone when her eyes lifted back to his face.
    “That you are,” she said again.


    The collar of his shirt constricted around his neck. He had to call her on it.
    “What does that mean?”


    Those long curly lashes veiled her eyes and fanned over her cheekbones. “It’s
    simply a statement of fact.”'
