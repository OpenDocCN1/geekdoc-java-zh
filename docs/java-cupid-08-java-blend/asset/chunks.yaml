    “显然不是，”他回答道。


    “好吧，”科乔叹了口气，瘫回椅子里，“如果我们再不把那个女人从你脑子里抹掉，我们注定一无所获。”


    从他脑子里抹掉？他直觉她不仅仅是存在于他的脑海。


    “我要把话说清楚。她差些害了你的命。你忘了吗？”


    “没忘，”夸西缓慢地回答道，“我没忘。”


    他背上的爪痕再次隐隐作痛。尽管他花了多年来压抑那些记忆，但他从未忘记。两天前，在阔别二十年后，他再次见她。起初的愤怒被一种混合了怀旧、困惑的奇异情感，以及潜伏在某种更深层的东西所取代。那是一种他不确定该如何定义的情感再次复苏。


    “阿菲亚——”


    “叫她格蕾琴吧，”夸西打断了他。


    “格蕾琴，”科乔毫不不慢地顺从道，“告诉长老们你有魔法力量。她向他们展示了那个标记，他们就追过了我们。”


    “我知道，”夸西咬牙齿嘶声说道，“我当时在那里。”


    “他们因为她的话杀死了我们的父母。如果不是奥布莱一家冒着生命救我们——”


    “我知道！”夸西从椅子上跳起来，在房间里踱步。父母身体的幻象在他脑海中闪过。他猛地摇了摇头，试图摆脱它们。


    “你总是这么说。”科乔身体前倾在桌子上，双手在下巴托成尖状，“那为什么又让她再次控制你了？”


    他停顿了一下。“再次控制我？”


    “别让我说那些显而易见的事。”他的兄弟将目光移开，“你明白我的意思。”


    “不，我不这么认为。”夸西的声音低了下去，而一阵沉闷的预兆感在他脑海中回响。


    科乔沉默了一会儿，然后将目光移回夸西身上。“格蕾琴和她的妹妹是我们村子里唯一的朋友。没有人想和我们有来往。但格蕾琴可以让你做任何她想让你的事。”


    “那不是真的。”


    “是真的，夸西。长老们让你们两个结婚时情况更糟。”


    在十一岁时就和一个六岁的女孩结婚，这可能是西方世界的噩梦之源，但对他来说，被要求嫁给村里唯一没有用极度恐惧看他的女孩，简直是梦想成真。在贫穷村庄的生活环境让他们两人都变得早熟。奥布莱一家与长老们反复交涉。尽管他们未能阻止这段婚姻，但他们尽力确保格蕾琴行事的年龄是十五岁。


    长老们并不满足于等待那么久，由于对那些爱管闲但善良的传教士的尊重，他们反驳说他和格蕾琴的结合将在她初潮或她满十五岁时发生，以者先到为准。


    长老们把他和格蕾琴的脸涂成同样的颜色，代表他们的结合的那一天，是他人生中最快乐的一天。对他而言，等多久并不重要。她是他的，只属于他一个。


    一年后，他和科乔差点死掉。


    “我记得你以前总是背着我和她进森林。无论她想要什么，你就做什么。”


    他的兄弟怎么能理解让格蕾琴做他的童妻是什么感觉？让她看着他，却没有看到一个丑陋、肮脏、自然的变异？毫无保留地触碰他？村里的其他孩子都排斥他，但她从没有。她的父母也是如此。


    她的接受像任何毒品一样令人陶醉。像任何咒语一样迷人。


    她在她皮肤上的标记比任何永恒的誓言都更有束缚。


    “放过她吧。别再让她干涉你的生活了。第一次她就几乎摧毁了你。我无法忍受如果她……”


    科乔的手机响了，谢天地结束了这段对话。他的兄弟和他一样的方式接了电话。“科乔·奥布莱？”


    一个模糊不清但肯定的女性尖锐声音传了过来，大得让夸西怀疑他兄弟是怎么把手机贴在耳朵上的。


    “你怎么弄到我号码的？”科乔对着那个愤怒的女性大道。


    夸西大笑出声。“那是你的动物磁力。他们根本无法拒绝你。”


    他的兄弟越过肩膀盯着他。“去把头撞在水泥地上吧！”他用威胁的眼神命令道。


    电话那头的声音越来越大。大到夸西听清了字：“你在跟谁说话？你知不知道我会把你踢到下周去？”


    “我不是在跟你说话，”科乔反驳道。


    夸西笑着甜甜地说道。“又让你那某一个女人不高兴了？”


    “哥！”科乔嘶声道，“出去！”他抓起一个微型篮球朝夸西扔去。夸西敏捷地接住并让它在指尖旋转。


    “行了，让你们这对恩人猿自己解决吧。”


    他轻松地把球回给了科乔，科乔头也不回接住了。关上门，他听到了科乔对话的最后一句。“我告诉过我掌控着局面。”这个措辞让他心里有些不安。掌控着什么局面？合同？还是别的什么？


    夸西思考了几秒钟，但耸了耸肩。科乔不知道我们该怎么办。


    他们分享了片刻的欢乐。与此同时，格蕾琴在想还要多久才能逃脱。她真的以为夸西会因为她想要他就出现吗？她能有多蠢！那个男人恨她。尽管他起初对她表现出兴趣，但一旦知道了她的身份，任何理智的人都不会靠近她二十英尺。


    ![](img/00002.jpeg)


    格蕾琴在地发出一阵爽朗的笑声，但在内心，她努力不让失望压垮自己。


    “完全没问题，”她向中校长保证道。“我很乐意尽我所能教育青少年。”


    “再次感谢你，奥辛加小姐。”中校长拍了拍她的手笑了，脸上露出如释重负的迹象。“我不知道该怎么办。董事会会掉我的脑袋的。”


    “我相信你夸张了。”


    格蕾琴拿起她的夏威混合咖啡，长啜了一口品味。她可能这辈子都会喝这种茶。


    “嗯，如果他们不想要她的脑袋，”卡特校长抖着他宽大而凌乱的眉毛插话道，“就会想要我的。”


    “我觉得这也是个好主意，”中校长的声音将她拉回现实。格蕾琴从一个校长转向另一个。她错过了某些信息。


    “孩子们可以多留一会儿，我们可以协调离开的时间表。”


    格蕾琴不再听他们说话。她第百次扫视了整个咖啡馆，徒劳地寻找金色的爆炸头和灰色染眼镜眼镜眼镜。“咖啡丘比特”的嘈杂声像节奏律一样跳动着。顾客们大笑或低语，椅子摩擦地板的声音，吸食奶油罐的声音，咖啡馆的和谐声持续着。收银机开启的叮叮声引导她的目光转向她最喜欢的咖啡师。杰布一秒钟后抬头，对上了她的目光。他笑着向她竖起大拇指，然后继续做他的忙。

