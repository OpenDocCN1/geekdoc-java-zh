    “You’ve seen those documentaries on TV about tribal people, haven’t you?”


    A blurry image of a half-naked, malnourished woman with a kid by her side flashed
    in his mind. It unsettled him. “Yeah, I’ve seen them.”


    “Well, to me, the modern world treats these people as if they’re an oddity to
    be showcased behind glass walls. The government won’t allow any interference in
    their lives. Whole generations live each decade in ignorance of the outside world.
    The government’s reasoning is because their lives are simple, and true to nature.
    By forcing modernity on them, we’ll somehow upset the balance of nature.”


    She snorted as an irritated expression crossed her features. “What a load of bull.
    Blissful ignorance is not safety. Ignorance is harmful and can kill someone.”


    Her words turned Kwasi’s thoughts inward. He knew how ignorance worked. Ignorance
    was an ugly, tiny little monster clamping its claws into people’s fears with the
    determined intent to tear away their common sense and decency. The scar on his
    back throbbed. There were times he could still feel the tiger’s claws slice into
    his flesh.


    Would he ever get past the memories?


    “I remember I was in a particular country not too long ago.” She leaned forward
    in a conspiratorial manner. The movement worked wonders to distract him from his
    less savory memories. Kwasi tried his hardest to not gape openly at the hint of
    dark cleavage barely peeking over the line of her dress.


    “The tribe we’d connected with had just been contacted the year before. Until
    then, they lived in isolation in the forest. Well, the director of the outreach
    had contacted that country’s government on their behalf for assistance. They were
    inoculated, given clothing, food, and shelter.”


    A sudden smile lifted her mouth. “Do you know what the women of the tribe loved
    the most since they came out of the forest?”


    He shook his head, enjoying the animation of her face.


    “Shoes!”


    He joined in Gretchen’s laughter. “I tell you, some things are universal. Women
    and shoes.”


    “I couldn’t believe it.” Gretchen wiped a tear of mirth from the corner of her
    eye. “I mean, they didn’t say anything about learning how to read, interacting
    with people from all over the world, or even the new clothes, which they absolutely
    adored! They loved the shoes. How funny is that?”


    How many layers was there to this woman? She started off as standoffish, and polite.
    Now she laughed with him in conversation as if they were old friends.


    “What about the men?”


    The mirth subsided some but there was still a sparkle in her eyes. “I didn’t get
    much chance to talk with them. The men had very specific ideas of a woman’s place.
    Talking to women for things other than provisions or sex wasn’t on the table.”


    Kwasi grunted. “Some things never change.”


    She nodded. “I didn’t mind. I know one day, one of those tribal children will
    go to college and change the world. In my paper I called for more programs and
    initiatives to integrate uncontacted tribes into modern society. They will benefit
    from education, not some misguided attempt to keep them in ignorance.”


    Her words resonated with him. Thinking of his childhood, which he tried to do
    with as little recall as possible, something flickered across his consciousness.
    The awareness he was missing something vitally significant impressed itself onto
    him.

