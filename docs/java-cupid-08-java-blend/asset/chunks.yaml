    Each step drawing him closer to her brought out splashes of the nightmare like
    splatters of paint. Kojo and he falling on the hard forest floor. The growl of
    the tiger behind them. Hunters jeering. Searing pain along his back. That bone-chilling
    fear as he dragged his brother, refusing to let go of his hand.


    Kwasi pivoted around to show her his back. “Do you see what they did to me?”


    He heard her gasp as he perceived her gaze travelling along the scars of his back.
    Like a physical touch, he could tell when her eyes lingered on the puckered flesh
    where the tiger had come so close to killing him.


    He snarled as he turned back around. “You really don’t know how very much I want
    to kill you.”


    Her face lost color, taking on a grayish pallor. Despite that, her mouth had firmed
    into a line of determination.


    “I do know, Kwasi.” A fine trembling took over her. Whether it was from sorrow
    or rage, he couldn’t tell. “I was tied to one of the trees.” She swallowed hard.
    “They did it in order to prevent me from going after you. I saw the hunters run
    after you with the tiger.”


    Her voice broke. “I heard you scream. It was the last thing I’d ever heard from
    you.”


    Those dark eyes of hers glistened like marbles. “So, I really do know what you
    went through. I was powerless to stop it.”


    He hissed. “But you were so powerful enough to start it.”


    Resentment boiled in his gut. He had gone through hell to escape the village of
    his birth. With all his might, he’d submerged those recollections in the dank
    waters of his past.


    He’d had help doing that. Thanks to his adoptive parent, he’d escaped to the U.
    S., and was given a semblance of normality. Even here, his albinism drew unwanted
    attention from bullies as opposed to hunters.


    Disgust at his initial attraction swelled inside. How could he have found her
    so breathtaking when she strolled into Java Cupid? Had that only happened less
    than an hour ago? It seemed as if a lifetime had passed since then. A lifetime
    of pain and unrequited vengeance.


    Kwasi snatched his T-shirt off the ground and twisted it around his fist. “You—”


    Wait a minute, a voice screamed in his head. What about the mark?


    A lightning bolt shuddered down his back. How could he have forgotten about that?


    “Do you still have it?” he gritted out between clenched teeth.


    Her head dropped like a wayward child caught in the act. “Let’s not—.”


    “Gretchen,” he interjected with a bite. “Look at me.”


    Where the forceful command came from, he didn’t know. It was alien to his make-up,
    much like it was for him to hurry anywhere. Perhaps it was a remnant of male expectation
    of obedience still ingrained from his childhood, although he’d spent the latter
    part of his formative years in the U. S.


    Her head lifted and she met his gaze straight on.


    “Do you still have it?” he asked again.


    He almost hoped she didn’t. A quick prayer lifted to the heavens as the silence
    lingered for an interminable amount of time.


    Her mouth opened and closed like a fish. “I—I can’t—”


    “Turn around,” he ordered. Where the audacity came from he didn’t know.


    She stilled, her head cocked to the side as a flare of defiance ignited in her
    eyes. Boy, despite everything pulsing through him, he did like her sass.


    But he wouldn’t be deterred. He had to know.


    He watched as the defiant look left her eyes and resignation took its place. She
    slowly turned around, and a sudden cold sweat coated him. Mixed in the apprehension
    was the substance of unwelcome excitement. And that didn’t make sense when all
    there should be within him was loathing.


    His eyes locked onto the small imperfection on the back of her neck. A spot of
    light skin shaped like an uneasy crescent moon with indistinct edges.


    Kwasi gulped. “There it is.”


    Such a tiny thing and yet that mark had sent both of their lives down a rabbit’s
    hole of hurt.


    Kwasi couldn’t abide to look at it any longer. Without another glance in her direction,
    he stomped back to his car, started the engine, and sped out of the Java Cupid
    parking lot like a bat out of hell.


    The streets blurred out of focus. Familiarity drove the vehicle more than a predetermined
    destination. A niggling sense of alarm told him he had somewhere to be but for
    the life of him, he just couldn’t remember.


    At the stoplight, his car phone rang. Jamming his Bluetooth into his ear, he answered
    it.


    “Kwasi O’Brien.”


    “What’s wrong?” His own voice, slightly deeper drilled into his ear.


    Kwasi sighed. “Kojo, I don’t know if I should tell you.”


    “Well, I wouldn’t have called if I didn’t know.”


    That much was true. Their twin bond was more acute than Spiderman’s spider sense.
    They could read each other with a look and know the other’s thoughts.


    “You’re not going to like what I’m about to tell you.”


    “Try me.”


    Kwasi wavered, his fingers clenching the steering wheel with a death-like grip.
    It was unlike him to be so undecisive but Gretchen’s reappearance had thrown the
    world off kilter.


    “I ran into your sister-in-law today.”


    Kojo’s deafening silence on the phone spoke louder than anything else. Finally,
    he spoke. “How the—?”


    “I don’t know. I didn’t recognize her at first. But later—”


    His voice trailed off. How much did he want to reveal to his brother? “Was her
    sister there?”


    Kwasi jerked to attention, surprised he hadn’t crashed into a building from the
    way his thoughts had turned inward. “No.”


    The light turned green and he eased his foot on the gas. “Sounds like a plan.”


    Why did his heart betray itself by picking up in tempo? Why did his brain flash
    an image of her as she walked through Java Cupid, as alluring and seductive as
    a naughty angel? Why should his mind settle on the fact that after all these years,
    his mark still branded her?


    How could he ignore that symbol of possession?


    “Kwasi, you gotta focus, man. Don’t let her ruin everything again.”


    “Okay.”


    “Don wants us to beef up the security at the outdoor concert where his wife is
    performing in two weeks. We need to do an analysis and then hire some guards.”


    “He wants us to meet at Java Cupid in a couple of days to go over the contract
    and then we’ll travel from there.”


    Kwasi stilled. Go back to Java Cupid? Where he had a chance to run into Gretchen
    again? No way! He opened his mouth to articulate those thoughts when instead he
    said, “Sounds like a plan.”


    Why did his heart betray itself by picking up in tempo? Why did his brain flash
    an image of her as she walked through Java Cupid, as alluring and seductive as
    a naughty angel? Why should his mind settle on the fact that after all these years,
    his mark still branded her?


    How could he ignore that symbol of possession?


    As soon as Kojo hung up the phone, Kwasi pulled into the driveway of their home
    and parked the car with only one thought barreling in his mind.


    ![](images/0002.jpeg)


    The drive back to Whitehead museum passed by in a brief second. The only road
    Gretchen could see was the road map of pain carved onto Kwasi’s back. A trail
    of suffering she’d placed there as if she’d etched it with her fingers.


    Blindly, she parked the car in the space reserved for her and entered the museum
    via the employee entrance. The icy air-conditioned air lifted goosebumps along
    her arms. She flashed her badge to the attendant guard and made the trek toward
    her office.

