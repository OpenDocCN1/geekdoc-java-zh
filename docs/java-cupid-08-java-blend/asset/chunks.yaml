    # 序言


    ![](img/00001.jpeg)


    五个人挤在一间破旧的木屋里。阳光透过木墙的缝隙射入昏暗的室内，尘埃在细细的光柱中浮动。屋子里的两个个人——一男一女，被反绑着并塞着嘴，靠在面对关闭的入口的墙上。被俘的男子眼睛肿了，嘴唇破裂。女人脸部右侧有一道长长的疤痕，上面点着干枯的血迹。


    另外三个人全是男性，站在他们面前。其中两个男人手持装饰有亮黄色布料的长矛，护在第三个人的两侧。


    第三个人蹲下身。他穿着红色衬衫和洁白无暇的长裤，脚着黑鞋，在狭小的空间里格外显眼。脖子上挂着一串由精细指骨组成的项链，中间点缀着红宝石。


    他从衬衫口袋里掏出一根长雪茄，闻了闻。


    他发黄的眼睛在被绑的夫妇之间闪烁。


    “你们还记得把这个送给我吗？”他说完这句话就开始咳嗽起来，声音刺耳而干涩，就像制作雪茄的干烟叶一样。短促地咳嗽后，他从同一个口袋里拿出一个金雪茄刀。


    “这是一份很好的礼物。”他用雪茄向他们致意，“谢谢。”


    红衣服的男子花了大量时间机械地剪掉雪茄头并点燃。他深吸了几秒钟，直到雪茄头像一颗微型太阳一样发光。他将烟雾吐在男女脸上。


    “味道不错。干而甜。有点像你们俩。”


    他继续抽着雪茄。用空着的手摆弄着脖子上的骨头。他那黑色、毫无神的眼睛落在女人身上。她塞在牙齿间的黑布上方，她的眼睛因恐惧而睁大。


    “今天之后，我不会再多问你们任何问题了。”他把烟灰弹在地上，“这是最后一次机会，因为今天之后，你们再也不用见到我了。”


    烟雾环绕着他们。雪茄的甜味弥漫在整个房间。被绑的男子在束缚下咳嗽，随后因随而来的疼痛呻吟。


    “肋骨疼吗？”红衣服男子问道。


    囚犯眼中闪烁着凶毒的光。


    红衣服男子站起来，向右侧的守卫示意道：“她。”


    守卫从腰间的带上拔一把刀，走向女人。银光一闪，塞住她嘴的布掉掉了。


    她张开嘴，但红衣服男子用一个致命的眼神让她闭了嘴。“说话要小心。”


