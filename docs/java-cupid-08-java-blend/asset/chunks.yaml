    “你在电视上看过那些关于部落部落的纪录片，对吧？”


    一个半身赤裸、营养不良的女人身边带着一个孩子的模糊影像在他脑海中闪过。这让他感到不安。“是的，我见过。”


    “对我来说，现代世界对待这些人的方式，就像对待某种放在玻璃墙后展示的奇异生物一样。政府不允许对他们的生活进行任何干预。整整几代人每十年都对外界世界一无所知。政府的理由是，他们的生活简单且顺应天性。如果我们强加给他们现代化，终将会以某种方式打破大自然的平衡。”


    她哼哼了一声，脸上掠过一丝烦躁的神情。“简直是胡扯。无知并非安全。无知是有害的，甚至会夺人性命。”


    她的话让夸西（Kwasi）陷入了内反思。他知道无知是如何运作的。无知是一个丑陋、微小的怪物，它的爪子深深扣住人们的恐惧中，决心要撕碎他们的常识和尊严。他背上的伤疤隐隐作痛。有时，他还能感觉到老虎的爪子划破了他的肉。


    他真的能摆脱这些记忆吗？


    “我记得不久前我在一个特定的国家。”她身体前倾，露出一副神秘的姿态。这个动作让他成功地从那些不愉快的记忆中分神了来。夸西极力让自己不要对着她裙装边缘处若隐若现的深邃大大口呆。


    “我们联系的那个部落在年前刚被接触。在那之前，他们一直孤立地住在森林里。嗯，外展负责人代表他们联系了该国政府寻求援助。他们接种了疫苗，领到了衣服、食物和住所所。”


    一抹突然的微笑浮现在她的嘴角。“你知道那个部落的妇女走出森林后最喜欢的是什么吗？”


    他摇了摇头，享受着她神情变化的趣味。


    “鞋子！”


    他和格蕾琴（Gretchen）一起笑了起来。“我告诉你，有些东西是通用的。女人和鞋子。”


    “我简直无法相信。”格蕾琴擦掉眼角的喜悦泪水。“我的意思是，他们完全没有提过要学习阅读、与世界各地的人交流，甚至没有提过他们极其迷恋的新衣服！他们就是爱鞋子。这多好笑啊？”


    这个女人到底有多少层次？她开始时显得冷淡而礼貌，现在却和他一起欢声大笑，就像老朋友一样。


    “男人呢？”


    笑声消退了一些，但她的眼里依然闪烁着光芒。“我没什么机会和他们交谈。男人对女性的位置有非常特定的想法。除了物资或性之外，和女性交谈是不在考虑内的。”


    夸西哼哼道。“有些东西永远不会改变。”


    她点了点头。“我不介意。我知道总有一天，那些部落里的孩子会上大学并改变世界。在我的论文中，我呼吁增加更多计划和倡议，将未接触部落融入现代社会。他们会从教育中受益，而不是通过某种试图让他们保持无知状态的误导尝试。”


    她的话引起了他的共鸣。想起他努力尽量少回忆的童年，一种念头闪过他的意识。那种自己错失了某种至关重要的感觉，深深地印在了了他的心上。

