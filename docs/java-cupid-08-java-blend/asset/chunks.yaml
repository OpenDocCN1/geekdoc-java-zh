    就他而言，他已经结婚二十年了。他知道这很天真，因为没有任何法庭会承认他们童年的誓言，但对他来说，这意味着某种意义。


    格蕾琴（Gretchen）并不像这样看待这个问题。她明确表示，他们需要重新了解彼此。弄清楚他们所拥有的一切是否是真实的。如果以及当他们决定进一步发展，她并不介意步入礼堂。


    “为了重温我们的誓言，”他固执地回应她的逻辑。


    “不，`Kwasi`。”她摇着手指告诫道。“是为了创造新的誓言。”


    过去这两周与她的相处让他彻底下定了决心。格蕾琴和他们是完美的结合。每天，他都会重新发现并挖掘出她性格中更多侧面，这让他深深地爱上了她。


    格蕾琴的才华与她的美貌不相上下。全球各顶尖大学都曾联系过她。这个女人在智力上可以胜过任何人。她博学、有主见，并且是一位专注的研究人员，她将所有的心投入到对原始部落及其文化的热中之中。为什么不呢？她的背景与他们并没有太大区别。


    更让他惊喜的是，他年年那个善良的玩伴并没有改变。在当地，她与该州的美国原住民社区保持着紧密的联系，并为他们的利益奔波。她对他们文化的亲近让她成为了他们宝贵的成员，他们认为她是自己部落的一员。


    她已经成长为一名女性，像她小时候那样丰富了他的生活。每天，他一醒来时想的都是她，渴望待在她身边。她那双如娃娃般的眼睛一眼就能让他的心跳加速。尽管他一直将他们的身体亲密维持在接吻，没有得到她的帮助，但他知道不了多久他就会想要进一步。


    要做到这一点，他们必须结婚。再次。他绝不会让任何事情或任何人有机会插在他们之间。


    `Kojo`干枯的声音打破了他的思考。“`Kwasi`，醒醒。我们到了。”


    他眨了眨眼。他们到达了。


    在前台签到后，他们沿着弯曲的走廊走，直到到达一个不怎么拥挤的公共区域。零食车吱响的轮子经过。轮椅上居民们空洞的眼神让他感到难过。支持人员带着行动较灵活的居民在走廊来走去。


    他宁愿在老了被车撞，也不愿落入这种地方。


    `Luke`并没有那么幸运。唯一的安慰是，出于某种原因，`Luke`还记得他和`Kojo`。也许不准确，但他认识他们。


    “你好，`Kwasi`，`Kojo`。我的两个孩子今天怎么样？”`Luke`黝黑的脸上带着灿烂洁白的笑容迎接着他们。“想喝点咖啡吗？”


    “不，谢谢，`Luke`。”`Kwasi`回答道。“但我给你带了一些。”他把爪哇之咖啡直接放在他右手左侧的桌子上。做完后，他和`Kojo`坐在监护人对面的沙发上。


    “那么，今天学校怎么样？”`Luke`向`Kojo`点了点头。


    “很好。数学考试考了`A`，”`Kojo`顺滑地回答道。


    `Kwasi`皱了皱脸。`Luke`忘记了很多事情，包括他们离开高中已经快十多年的这一事实。“为什么要提醒他？”当`Kwasi`提到这件事时，`Kojo`曾评论道。“显然他正在回忆一段快乐的时光。就让他享受吧。”


    “很好，我知道数学对你来说有多难。”


    `Luke`拿起咖啡杯喝了一口。“你今天过得怎么样，`Kwasi`？”


    `Kwasi`犹豫了。按照惯例，他应该就自己那并不存在的高中生活发表一些毫无无脑的言论。但过去这一周的一件事教会了他，要对一切事都保持诚实。他审视着这个救了他和兄弟命的躯壳。即使他可能不记得他们童年残酷、暴力的本质，也许他会记得美好的部分。


    “你知道吗，`Luke`，我又见到`Afia`了。”


    `Kojo`抓住了他的袖子。“你在做什么？”


    他忽略了他。“你还记得`Afia`吗，`Luke`？”想起格蕾琴以前的名字不再让他痛苦，但他仍然更喜欢她现在使用的名字。


    他的监护人头歪向一侧。“`Afia`？”他欢声问道。


    “是的。”

