    “We underestimated him. A man like that will not stop until he has what he wants.
    It doesn’t matter how long it takes, he’ll find the boys. He’ll hurt the girls.
    The Ozingas will keep the girls safe.”


    “We went to the government but they were no help. They couldn’t extend resources
    for a small village with no name. But something happened between Kwasi and Afia
    while we were gone. I can’t remember. Someone’s poisoned Afia and Ayawa’s mother.
    I know it.”


    “Luke,” Kojo interrupted in a strange voice. “What does the necklace look like?”


    The old man fell the floor, weeping uncontrollably. His voice was barely audible
    as he whispered. “It’s a necklace of finger bones and rubies.”


    Kojo cursed. “Kwasi, I’ve seen this guy.”


    “What do you mean you’ve seen him?” Even as he spoke the question, something nagged
    at his own consciousness. It was just out of his reach of comprehension.


    “He killed Donna. But I have to get to the boys. The Ozingas get the girls. They’ll
    give them new names and take them back home.”


    Luke rocked back and forth. “Donna. Donna.”


    Kojo nodded to the support staff and they came forward. A doctor very gently handled
    the old man, sedating him until he slumped into unconsciousness moments later.


    “We gotta go. Now.”


    Kwasi nodded, a million thoughts clanging in his head. Even so, he squatted down
    near the old man’s limp body and hugged him tight. Kojo did the same.


    They hurried out of the facility.


    “Kojo, you don’t really think—”


    “I do, bro.” A muscle clench in his brother’s jaw. “This guy somehow found us
    after all this time. He’s been at `Java Cupid` for days now. I’ve seen him when
    I’ve gone in and out. Sits in this old car, smoking a cigar.”


    “I’ve never seen him.”


    Kojo cut him a glare. “You been too busy with Gretchen to see anything else.”


    Kwasi ignored the jibe as another horrific thought superseded it. “It’s not just
    us he’s after, then. He’s after Gretchen and her sister.”


    ![](images/00002.jpeg)


    Gretchen smiled at the helper doll. Life was never so good as it was now. Kwasi
    was the man she’d waited her whole life for.


    An impetuous smugness overtook her. Hadn’t she know that as a child?


    Sighing happily, she put herself back to work with the event details for tomorrow.
    All of her contacts were in the city now, prepared to help make the event memorable
    for the children.


    Arts, crafts, dances, and a storytelling time complete with a tour of the museum
    with lunch and snacks.


    Most of all, she looked forward to sharing her love of primitive cultures with
    the children. In doing so, she hoped to one day pass the banner on to them.


    “Am I too ambitious in my hopes?” she asked the helper doll.


    The doll remained still but Gretchen rubbed its beady eyes anyway. A vision of
    her sister a week ago floated before her. Gertie had moved out of the house they
    shared without a backward glance. Jaw set, face stern. Her sister could not and
    would not be happy for her.


    Frowning, Gretchen raised the `Java Cupid` cup and re-read the same message that
    had been put there. “Love forgives everything, even death.”


    When she first read the message, she thought perhaps the message meant forgiveness
    for her part in the deaths of Kwasi’s parents. Over the past two weeks, they’d
    talked about everything. Kwasi truly did not hold her responsible anymore. For
    that she was grateful. The weight of guilt had subsided as each day, she fell
    in deeper into love with the man who made her his own many years ago.


    She had gained Kwasi but lost her sister.


    Gretchen sighed. Death wasn’t always a cessation of physical existence. It could
    be the deliberate murder of a bond as Gertrude had done.


    How could Gertie let a man come between them? Was her obsession with Kwasi stronger
    than their bond? Should a lifetime of sharing the same heart be destroyed by love?


    Her phone vibrated on the table. Kwasi’s number flashed on the screen.


    “Hello, Kwasi.” She leaned back in bliss, giddy as ever.


    “Hi, Gretchen.” His low timbred voice sent a little shiver down her spine. “Are
    you okay?”


    “I’m fine. Just getting things ready for tomorrow. How did the visit with Mr.
    O’Brien go? Did he have a good day?”


    “That’s what I needed to talk with you about.”


    A knock on the door interrupted the conversation. “Hold on a minute, Kwasi.” She
    muted the call and then set the phone down. “Yes?”


    “Delivery for Gretchen Ozinga.” A male voice called out.


    “Coming.”


    Strange the front desk wouldn’t have signed for the delivery or they didn’t contact
    her to sign for the package personally. She got up and opened the door. A low
    cap hung over the delivery man’s head and behind him was a flatbed trolley with
    a large container.


    “Morning.”


    He brushed past her in an abrupt fashion, bringing his delivery in. A pungent
    smell of cigar smoke followed him and she held her breath.


    A little perturbed at his rudeness - she hadn’t given him permission to come in
    - she let it slide. Just because her life was perfect…well not perfect, but good,
    didn’t mean everyone else had the same fortune.


    “I guess the front desk didn’t have signed for the delivery or they didn’t contact
    her to sign for the package personally.” She got up and opened the door. A low
