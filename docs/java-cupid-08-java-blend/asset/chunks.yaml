    Kwasi 从柜台前直起身。即使隔着墨色眼镜，他也能看出她身上散发的那种性感。她散发着一种高贵、望而不可及的气质。她的脖子很长，锁骨线条深邃，他想象自己可以在那里倒入草莓香槟，然后将其舔尽。


    当她离开门口接电话时，他继续注视着她。她那如黑甘草般的肤比任何东西都吸引了他的注意力。在阳光下，皮肤泛着晶莹的光的光泽，仿佛从内部散发着光。那种纯净、如丝绸般光滑的黑色让他意识到了他们之间的差异。


    在他和 Kojo 一样长大的过程中，他对肤色的想法一直无处不在。自己没有肤色这一事实长期以来一直让他不悦。他曾经接受过吗？直到这一刻，他认为自己已经接受了。毕竟，没有人能在经历过地狱般的童年后，脑子还不出点问题。


    电话挂了，她把手机放进挎在肩上的包包里。那个女人开始朝他的方向走来，Kwasi 感到一阵寒意。自从高中必须唱国歌以来，Kwasi 就没有感到这么紧张了。


    她的臀部每一次摆动伴随着一种慵懒的优雅，一件米白色的皱纹裙贴着身体，在膝盖上方几英寸处。面料包裹着每一处曲线，却又显得端庄。这进一步巩固了她女王般的、冷淡的态度。


    她走来站在他身后，但眼睛没有看向他。相反，他看到她微微向前倾，眼睛盯着他身旁立架上的菜单。


    他必须和她说话，说点什么。什么行！


    “你需要菜单吗？”


    在他说出这些话的瞬间，他恨不得把头撞在玻璃柜台上。真的，这就是他能做出的最好的了吗？


    她转头看向他，他的心脏几乎要跳出胸膛。眼镜的颜色遮盖了她的眼睛颜色，但深色皮肤衬托出的白色眼白让她呈现出一种娃娃般的表情。


    “谢谢。如果你介意的话？”她挑起了一只丝滑的、蜡过的眉毛。她的声音带着冷冷的、非常有礼貌的语气。她真的像表现得那样冷酷吗？


    “当然，没问题。”他拿起菜单递给她。


    她小心地从他手中接过，带着一抹未达眼底的微笑，低头看着菜单。


    那本该是对话的终点了。显然，她不想再说话了。但她提出的挑战让他想要去接招。


    “你看到你喜欢的了吗？”


    “没有，还没有。”她又给了他一个愉的微笑，但带着一丝冷淡。他从她的肢体语言中看出——那是多么丰富的语言——她不想和他聊天。


    这反而激发了他的看看自己是否能突破她防备的兴趣。“我正打算尝试新的 Java Blend 混合茶。我不知道人们是怎么喝咖啡的。”


    Kwasi 再次产生了想把头撞在玻璃柜台上的冲动。老天，咖啡？话题升级到“咖啡”了？为什么不聊聊天气把她聊死呢？


    他预想这位黑美女会离开，但一个真正的微笑出现了，拉伸了她的嘴角。冷淡的神情像窗上的冰一样融化了。“我也不理解那个。咖啡太苦了。”


    Kwasi 的嘴巴几乎掉到了地上。咖啡那句话真的管用？


    在还没发现他到底有多窝之前，他赶紧继续说道。“我知道，对吧？我尝试过人类已知的所有甜味剂，但还是无法忍那玩意儿。”


    “茶的味道更浓郁，也更温和。”她摆弄着菜单的边缘。“尤其是冬日的一杯热茶。顺着喉咙滑下的感觉正合适。”


    他的眼睛追随着她修长纤细的颈颈。锁骨处两个尖锐的凸起增强了两侧深陷的线条。他想象品尝她那丝缎般光滑的皮肤。他的舌头会舔舐她圆润的肩膀顶部，然后他就——


    “你点的是哪一种？”


    Kwasi 微微抖了一下。无力地困在自己构思的幻想中，他几乎没听到问题。“Java Blend。新出的。香草奶油和巧克力精华。那是没法拒绝的，对吧？”


    “听起来很有趣。我也要一个。”


    Kwasi 仰起头，对着 Jeb 喊道：“Jeb，给我做两份。”


    “没问题！”那边回答道。


    Kwasi 忧伤地摇了摇头。“那还需要十五分钟。”


    女人笑了。那笑容灿烂得像阳光一样洒进来。“是的，他动作确实很慢，但他是个好咖啡师。我不急。”


    被那双如红宝石般的嘴、饱满丰润的双唇和整齐洁白的牙齿迷住了，Kwasi 脱口而出：“你叫什么名字，姑娘？”


    笑容从她的脸上消失了，仿佛被抹掉了一样。瞬间之间，她的冷淡恢复了。


    她把菜单放回柜台。“那可不是‘姑娘（girl）’。”


    “噢，拜托，宝贝。”他能让她的笑容回来吗？“我只是想知道你的名字，仅此而已。”


    “我的名字也不是‘宝贝’。”她交叉着双臂。如果这不能代表‘别跟我说话’，我不知道什么能。


    “好吧，那名字肯定不是‘丑女’，所以我得一直猜下去，直到你告诉我为止。”


    女人眨了眨眼。“你要猜我的名字？”


    由于对突破这个姐姐防备的想法感兴趣，Kwasi 给了她一个缓慢的微笑。“是的。在我们等茶的时候可以打发时间。”

