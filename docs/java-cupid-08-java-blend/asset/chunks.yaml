    # PROLOGUE


    ![](images/00001.jpeg)


    Five people occupied the dilapidated hut. Dust particles floated in the thin slices
    of sunlight allowed to penetrate the dark interior through breaks in the wood
    walls. Two of the occupants, a man and a woman, sat bound and gagged against the
    wall facing the closed entryway. The captive man sported swollen eyes and a cut
    lip. A long scar trailed the right side of the woman’s face, flecked by dried
    spots of blood.


    The other three occupants, all male, stood before them. Two of the men, armed
    with spears decorated in bright yellow cloth, flanked the third.


    The third squatted down. Dressed in a red shirt and white, immaculate pants with
    black shoes, he stood out in the small space. Around his neck rested a necklace
    of delicate finger bones, separated by rubies.


    Pulling a long, bulging cigar from a pocket on his shirt, he sniffed it.


    His yellowed eyes flickered back and forth between the bound couple.


    “Do you remember when you gave this to me?” He coughed as soon as he finished
    the sentence, the sound harsh and dry like the dried tobacco leaves his cigar
    was made from. After the brief hacking spell, he retrieved a gold cigar cutter
    from the same pocket.


    “It was a fine gift.” He saluted them with the cigar. “Thank you.”


    The man in red spent an inordinate amount of time making a production of cutting
    the tip of the cigar and then lighting it. He inhaled for several seconds until
    the tip of the cigar glowed like a tiny sun. He exhaled the smoke into the faces
    of the man and the woman.


    “Good flavor. Dry and sweet. Sort of like the both of you.”


    He continued to smoke the cigar. With his free hand, he fingered the bones around
    his neck. His black, soulless eyes landed on the woman. Her eyes above the dark
    cloth shoved between her teeth widened in fear.


    “After today, I won’t be asking you any more questions.” He knocked the ash on
    the floor. “This is the last chance because after today, you won’t ever have to
    lay eyes on me again.”


    Smoke curled around them. The sweet smell of the cigar permeated the room. The
    bound man coughed behind his restraint and then groaned at the resultant pain.


    “Sore ribs?” The man in red queried.


    A baleful glare blazed from the prisoner’s eyes.


    The man in red stood and gestured to the guard on his right. “Her.”


    The guard took a knife from the belt around his waist and went over to the woman.
    A flash of silver and the cloth tied around her mouth fell away.


    Her mouth opened but the man in red silenced her with a deadly look. “Be very
    careful what you say to me.” The threat in his voice chilled the air despite the
    heat of the day. “I only want to hear one thing from you and that is a location.
    If I don’t hear it, I will leave you.”


    She looked over at the man to her side. Tears slid out of her eyes and down her
    cheeks. The man beside her gave an imperceptible nod and she turned back to the
    man in red.


    “I paid for both of them. I want them now.” The cigar had almost burned down.
    “Are you going to tell me where they are?”


    “Yes, I will tell you.” Her voice resonated with strength. “Heaven. They are in
    heaven.”


    The man in red chewed on the end of the cigar. “I guess, you’ll be seeing them
    in a few moments then.”


    He threw the cigar on the floor and ground it into the dirt with his well-shod
    foot. Then he nodded to the guards on either side.


    “Kill them.”


    # CHAPTER ONE


    ![](images/00001.jpeg)


    “There’s my brother from another mother.”


    Kwasi glanced up from perusing the new Java Cupid tea menu and his mouth lifted
    into a grin. “Jeb, my man. Wassup?”


    Jeb sauntered over to where Kwasi stood and they fist bumped. “Dude, working like
    a slave up in here.” He shook his head in a mock, mournful fashion.


    “Bro, you blacker than me,” Kwasi laughed.


    “I know!” Jeb hooted along with him, the joke an old one between them. If anyone
    else had said that, Kwasi would have told them where they could go. Being a black
    albino with blond hair and light-colored eyes, Kwasi and his twin brother Kojo
    had dealt with more than their share of ridicule.


    But with Jeb, it never meant anything.


    The din of the Java Cupid cafe buzzed with the calling out of orders, the grind
    of coffee beans, and the clatter of dishes. The loud but pleasant cacophony of
    noise settled around Kwasi like a comfortable blanket of sound. 


    “All right, white boy,” Jeb sighed dramatically, “let me get on behind this here
    counter and get your brew together.”


    Kwasi adjusted his sunglasses on his nose and rescanned the menu. “Let me see
    here. This new Java Blend tea. It says it has vanilla and essence of chocolate
    in it with coconut crème and cinnamon.”


    “Aww, dude!” Jeb’s dark brown eyes widened like saucers. “That is off the chain!
    It’s the new one, too. I don’t even like tea but that one almost made me convert
    to Teaism.”


    Kwasi spread his arms out and affected a mock, pleading look. “There’s still time,
    my son. It’s not too late for you.” They both chuckled and then Kwasi waved Jeb
    away. “Go ahead and whip me up this new blend.”


    Jeb turned around to make his order. Kwasi leaned on the glass counter and let
    his eyes rove over the place. Java Cupid had to be the busiest coffee café in
    town. He’d never been in the place and it wasn’t jumping. Lately though, it had
    been gaining more notoriety. People were talking about the weird messages popping
    up on the coffee cups. Messages that had led to several people falling in love.


    Kwasi shook his head. He was too practical to believe that nonsense.


    Through his tinted glasses, he observed people enjoying the atmosphere. Small
    groups huddled together with laptops. A couple or two sipped on coffee and talked
    quietly. Business people dashed out of the café with capped cups in their hands.


    He leaned further on the counter. There wasn’t anyone else in his line and he
    knew why. Jeb may be a wonderful barista but the boy took forever to do anything.
    Very few folks wanted to wait five or ten minutes for a one-minute brew. Kwasi
    didn’t care. Life was too short to hurry from one place to the next. Jeb could
    take as long as he liked.


    The door opened up and his gaze traveled across the room to see the finest sister
    that ever walked the face of the earth come through.'
