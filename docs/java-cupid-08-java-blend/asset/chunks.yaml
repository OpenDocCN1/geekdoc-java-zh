  raw: 'As far as he was concerned, he’d been married for twenty years. Fanciful,
    he knew it to be, as no court of law would uphold their childhood vows, but it
    meant something to him.


    Gretchen didn’t see it the same way. She made it plain they needed to get to know
    each other again. To find out if this, what they had, was real. If and when they
    decided to take things further, she wouldn’t mind a walk down the aisle.


    “To renew our vows,” he responded to her logic stubbornly.


    “No, Kwasi.” She admonished with a wag of her finger. “To create new ones.”


    These past two weeks with her had cinched it for him. Gretchen and he were the
    perfect blend. Each day he rediscovered and unearthed more facets of her personality
    that made him fall more in love with her.


    Gretchen’s intelligence was on par with her beauty. Major universities across
    the globe reached out to her. The woman could run intellectual circles around
    anyone. Well-read, opinionated, and a dedicated researcher, she gave all of herself
    to her passion for primitive peoples and their culture. Why wouldn’t she? Her
    background wasn’t all that dissimilar from theirs.


    Even more was finding the kind-hearted playmate of his youth hadn’t changed. Close
    to home, she had close ties to the Native American communities in the state and
    lobbied for their interests. Her affinity for their culture had made her a valuable
    member to them and they considered her part of their tribe.


    She’d matured into a woman who enriched his life in the same way she had as a
    child. Each day, he woke up thinking about her, anxious to be in her presence.
    One glance of her doll-like eyes sent his pulse to racing. Though he’d kept their
    physical intimacy to kissing, with no help from her, he knew it wouldn’t be too
    long before he’d want to take it further.


    To do that, they had to be married. Again. There was no way he would let anything
    or anyone remotely have a chance of getting between them.


    Kojo’s dry voice interrupted his thoughts. “Kwasi, wake up. We’re here.”


    He blinked. They’d arrived.


    After signing in at the front desk, they strolled down the winding halls until
    they reached one of the less filled common areas. The squeaky wheels of the snack
    cart rolled by. The blank stares of residents in wheelchairs saddened him. Support
    staff walked the more able residents up and down the halls.


    He’d rather get hit by a car in his old age than end up in a place like this.


    Luke hadn’t been as lucky though. The one saving grace was that for whatever reason,
    Luke remembered him and Kojo. Maybe not accurately, but he knew them.


    “Hi Kwasi, Kojo. How are my boys doing today?” Luke greeted them with a wide,
    white smile on his dark face. “Care for some coffee?”


    “No, thanks, Luke.” Kwasi answered. “I brought some for you, though.” He placed
    the Java Cupid brew directly on the table to the left of his right hand. That
    done, he and Kojo sat down on the couch across from their guardian.


    “So, how’s school today?” Luke nodded toward Kojo.


    “It’s good. Got an A on my math test,” Kojo answered smoothly.


    Kwasi grimaced. Luke had forgotten many things, including the fact they’d been
    out of high school for almost more than a decade. “Why remind him?’ Kojo remarked
    one time when Kwasi made mention of it. “Obviously he’s remembering a happy time.
    Let him have it.”


    “Good, I know how hard math is for you.”


    Luke grabbed the coffee cup and took a sip. “How’s your day been, Kwasi?”


    Kwasi hesitated. Going by precedent, he should make some inane remark about his
    own non-existent high school day. But one thing this past week had taught him
    was to be honest about everything. He eyed the shell of the man who’d saved his
    and his brother’s life. Even if he may not remember the harsh, violent nature
    of their childhood, maybe he’d remember the good parts.


    “You know, Luke, I met Afia again.”


    Kojo grabbed his sleeve. “What are you doing?”


    He ignored him. “Do you remember Afia, Luke?” It no longer hurt to think of Gretchen’s
    former name but he still preferred the one she went by nowadays.


    His guardian’s head tilted to the side. “Afia?” he chirped.


    “Yes. Don’t you remember?”


    “No, he doesn’t, you moron. So, stop whatever game you’re trying to play.” Kojo
    gritted out through his teeth.


    Kwasi ignored him. If it wasn’t for Luke, he’d never have the opportunity to be
    with her. The man had the right to know his efforts had been worth it.


    “She goes by Gretchen now.”


    Luke’s blank expression drained away, seeping the blood from his face. His skin
    took on a grayish hue. “Gretchen! Oh God no! We have to get them out of there!”


    The cup of Java Cupid coffee leapt out of Luke’s hand as the man jumped to his
    feet. “That man killed Donna.” Luke heaved a gut-wrenching sob. “That man killed
    Donna. He slit her throat in front of me.”


    Ice drenched Kwasi’s body. What made Luke remember?


    “Luke!” Kojo scrambled up. “Calm down. It’s okay.”


    “No, it’s not.” The old’s eyes watered and twitched. “They want the boys. We have
    to save the boys! We have to find them.”


    “Luke, we’re right here. You did save us.”


    They couldn’t get through to him. He was locked in a mental prison only he perceived.
    Support staff came at once when they heard his cries but Kwasi held them back
    with a lift of his hand. Even if the old man flipped over the table, he was not
    dangerous.


    “You did save us, Luke. Kwasi and I, we’re right here.” Kojo attempted to placate
    the man in a low voice. “We’re fine.”


    “Donna’s dead. She gave her life for them. I can’t let them take the boys!” His
    eyes darted around the room, searching for something. His entire body trembled
    but the set of his jaw told Kwasi that Luke was determined to protect them. A
    lump formed in his chest.


    “Ten thousand dollars. Those elders sold the boys for ten grand. Dear God, ten
    thousand dollars! Donna!” Deep sobs wracked the man’s body.


    Kwasi couldn’t move. Sold?


    He and Kojo shared a look.  All this time, they believed the elders wanted them
    for their own devices. Who would want to buy a pair of albino twins?


    “Who bought us, Luke?” Kwasi treaded carefully over to the man. “Who bought Kwasi
    and Kojo?”


    “The same one who bought the girls!” Luke’s fingers sprinted out and knotted in
    Kwasi’s shirt.  “Had warts on himself the second time, though. The elders—”


    “Luke, let go.” Kwasi saw the orderlies take a step toward them. “No! He’s fine.
    I got this.”


    Instantly the man released him. “I’m sorry. Whoever you are, please, you have
    to help me protect them.”


    What was going on? Now Luke didn’t know who they were?


    Kojo came to stand next to him. “Bought the girls? Do you mean—?”


    “Afia and Ayawa! We have to get them out of there now!”


    “Why?”


    A groan of frustration released from the old man. “At first, he only wanted the
    boys. He’ll sacrifice them to the spirits and add their bones to his necklace.
    It’s an amulet he believes wards off powers of evil spirits. But when the warts
    came he wanted the girls, too.”


    Dread coiled its tentacles around Kwasi’s spine. He had a frightful idea he knew
    where this was going. “Why does he want the girls?”


    “Why else do you think?” Luke shook his head with exasperation. “The girls have
    the darkest skin in the village. The darker, the purer. He was going to make them
    his wives so he can rid himself of the warts. The people believe virgins carry
    special powers to cure diseases.”


    Kojo grabbed Luke by the shoulders. “Was going to take them? Why didn’t he?”


    “Donna,” his voice broke and his face crumpled. “Donna said we should push the
    marriage between Kwasi and Afia. His albinism, as ridiculous as it sounds, would
    taint the purity of Afia, so we thought he wouldn’t want her anymore.”


    His head reeled with what he was learning. No wonder the O’Briens, after vehemently
    being opposed to their marriage, had acquiesced. And a thousand things he’d never
    understood clicked into place.


    “You and the Ozingas—”'
