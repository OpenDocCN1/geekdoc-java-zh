    Sweeping her gaze over the café once again, she collided with a pair of jaundiced
    eyes from a dark-skinned man sitting in a wheelchair. Deep wrinkles and varied-sized
    warts covered his face. Probably in his fifties if the creases were anything to
    go by. Dressed in a gray shirt with a breast pocket, the tip of a cigar peeked
    over the edge.


    For some reason, his yellow eyes held hers captive. The longer the moment drew
    out, a worm of unease slithered over her, lifting goosebumps on her arms. Why
    would the hard stare of a stranger cause her to feel so…icky? Why wasn’t he looking
    away?


    The man smiled and revealed two rows of yellow teeth. He nodded in a silent acknowledgement—of
    what she didn’t know—and retracted his magnetic stare.


    A breath released from her as soon as the contact was broken. She turned away
    and clashed with another pair of eyes shielded by a pair of tinted lenses.


    She’d seen them in her dreams for the past three days. Now, they were real.


    `Kwasi`.


    A movement to his left made her focus on it. It was `Kwasi` in double with a short
    but dense blonde mohawk down the center of his head.


    `Kojo`.


    They made quite a pair. Two albino Afro-centric cupids with bodies to tempt a
    nun to renege on her vows. But her eyes lingered on `Kwasi`.


    “Anything else, Ms. Ozinga?”


    Gretchen started violently. Principal `Chung` and Principal `Carter` grinned knowingly
    at her.


    Heat flamed her cheeks. “I’m sorry. What did you say?”


    Principal `Carter`’s eyes twinkled with humor. “We just wanted to make sure we
    covered everything.”


    “Yes, of course.” Oh, for a hole to open under her feet and swallow her whole!
    “Unless you need anything else?”


    “No, thanks again.”


    The principals got up to leave. Principal `Chung` leaned over and whispered in
    her ear. “If I were fifteen years younger and unattached, I’d be conveniently
    throwing myself onto the floor right about now.”


    Gretchen couldn’t help but laugh at that.


    With a final nod, the principals left. Gretchen knew she should follow them but
    she couldn’t bring herself to move. Instead, she grabbed her cup of `Java Blend`
    and took another long drink from it.


    Come here, she silently called to `Kwasi`. Come to me.


    She chanced a glance at him from her peripheral. The brothers were locked in a
    subdued but heated argument. `Kojo` bristled in palpable waves of hostility while
    a stony façade edged `Kwasi`’s profile. A few seconds later, `Kojo` flung his
    hands in the air and stormed back out of the coffee house.


    There was no turning away when `Kwasi`’s eyes met hers again. He weaved his way
    around the spaced-out bistro tables, past `Charlie` with his bin of dirty dishes,
    and the loud groups gathered on the leather couches.


    He never took his eyes off her.


    Gretchen gulped as he drew closer. Dressed a bit more conservatively with a long-sleeved
    tan shirt opened at the neck with a pair of black, straight pants outlining his
    legs, he managed to evoke an aura of relaxed sophistication. Impeccable and down
    to earth. Well-groomed and comfortable. Yet, he still took her breath away as
    he had three days ago.


    His beautiful mouth with its succulent, plush lips made the moisture evaporate
    from her throat.


    Focus, Gretchen.


    She needed to remind herself that an opportunity to ask for forgiveness for what
    had happened twenty years ago had arrived. The half-formed apology should be the
    only thing on her mind. Not the craving for his kisses.


    He stopped at her table. Her neck strained up. Way up.


    “Hi, Gretchen.”


    “Kwasi.”


    He folded his arms across his chest, stretching the material and exposing the
    V of his chest. A deep groove bisected his pectorals, smooth and clear of any
    hair. All he needed was oil rubbed into his body and he’d really—


    “I’d like to talk to you.” His eyebrow arched. “May I?”


    Giving herself a mental shake, she inclined her head. “Of course.” She waved to
    the seat on the other side of the glass table. Utilizing her super powers, she
    kept her voice bereft of the trepidation quivering inside. When he sat, his cologne
    wafted into her nostrils. A spicy, warm scent she greedily inhaled.


    For a moment he sat there, staring off into the distance. Gretchen kept still
    as she allowed him the time he needed to gather his thoughts. After all, she had
    some explaining to do.


    “Where do I start?” he said, but she sensed it had more to do with his frame of
    mind than an actual inquiry for her. His next words proved it. “There’s so much
    I want—, no. There’s so much I need to know.”


    He sighed and his shoulders sagged. She tamped down the raging hormones she never
    knew she had and gave him all the attention he required.


    “Kwasi, I—,”


    “No, Gretchen.” He held up a hand. “After twenty years, I think I get the right
    to speak first.”


    Swallowing a retort, she gave a curt nod. “Go ahead.”


    His eyes lifted up to hers. They carried a bleak look within their depths. “I
    know you were a little girl back then. Only six years old. I wasn’t much more
    mature than that at eleven. But I have to know: why did you tell the elders I
    had magical powers?”


    If there was any ounce of the feminine desire which plagued her since he sat across
    from her, it all siphoned away at his words.


    “Mama was sick,” she started off. “Very sick.” A picture of her mother on the
    floor her chest rattling like dried seeds in a gourd.

