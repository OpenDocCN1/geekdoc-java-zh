- fmt: "\n![](cover.jpeg)\n\n# How Streams work in Java 8\n\nVLIGHT\n\n## Table Of\
    \ Contents\n1. Intro to Streams in Java 8\n2. How Streams work in Java 8\n3. How\
    \ to filter a collections in Java 8\n\n## Intro to Streams in Java 8\n\n- Streams\
    \ in Java 8 are completely different from `InputStream` or `OutputStream` before\
    \ Java 8\n- Streams in Java 8 are Monads which is a concept in functional programming\
    \ languages\n- Monads in a functional programming language is nothing but a structure\
    \ which represents computations defined as Sequences of Steps\n- In a functional\
    \ programming language, a type with a monad structure meanings to chain operations,\
    \ or nest functions of that type together\n- Stream in Java 8 lets you to process\
    \ data declaratively and leverage multicore architecture without the need to write\
    \ any specific code for it\n- There are 5 main characteristics of a Stream in\
    \ Java 8 as follow:\n    - Sequence of elements\n    - Source\n    - Aggregate\
    \ operations\n    - Pipelining\n    - Automatic iterations\n\n## How Streams work\
    \ in Java 8\n\n- You should familiar with Lambda Expressions, Functional Interfaces,\
    \ and Method References if you want to fully understanding how Streams work in\
    \ Java 8\n- Stream Operations are either intermediate or terminal\n    - **Intermediate\
    \ Operations**: These operations will return a stream so you can chain multiple\
    \ intermediate operations without using semicolons\n    - **Terminal Operations**:\
    \ These operations are either void or return a non-stream result\n\n### Sample\
    \ Code\n```java\nList<String> nameList = Arrays.asList(\"Van\", \"Nam\", \"Tuan\"\
    , \"Tien\", \"Hoang\");\n\nnameList.stream()\n        .filter(name -> name.startsWith(\"\
    T\"))\n        .map(String::toLowerCase)\n        .sorted()\n        .forEach(System.out::println);\n\
    ```\n**Output**\n```\ntien\ntuan\n```\n\n### Notes\n- In the above example:\n\
    \    - `filter()`, `map()`, and `sorted()` methods are intermediate operations\n\
    \    - `forEach()` method is a terminal operation\n- In Java 8, a Stream can be\
    \ created from various data sources especially Collections\n- `List` and `Set`\
    \ in Java 8 support new methods including:\n    - `stream()`: This method is used\
    \ to create a sequential stream\n    - `parallelStream()`: This method is used\
    \ to create a parallel stream which is capable of operating on multiple threads\n\
    - Calling a method `stream()` on a `List` object will return a regular stream\
    \ object but you do not need to create Collections in order to work with streams\n\
    \n### Example\n```java\nArrays.asList(\"Van01\", \"Van02\", \"Van03\")\n     \
    \   .stream()\n        .findFirst()\n        .ifPresent(System.out::println);\n\
    ```\n**Output**\n```\nVan01\n```\n\n- You can use `Stream.of()` to create a stream\
    \ from a bunch of object references\n### Example\n```java\nStream.of(\"Lan01\"\
    , \"Lan02\", \"Lan03\")\n        .findFirst()\n        .ifPresent(System.out::println);\n\
    ```\n**Output**\n```\nLan01\n```\n\n## How to filter a collections in Java 8\n\
    \n- Java 8 provides new features to support filtering of elements in a Collection\n\
    - You can filter a Collection like `List`, `Set`, or `Map` in Java 8 using `filter()`\
    \ method of `Stream` class with following steps:\n    - **Step 01**: You need\
    \ to obtain a Stream from a Collection by calling `stream()` method\n    - **Step\
    \ 02**: And then you can use `filter()` method which takes a `Predicate` as only\
    \ argument\n\n### Notes\n- The `filter()` method does not remove elements which\
    \ match the condition given in `predicate`, but the `filter()` method will select\
    \ elements in an output stream\n- The `filter()` method is defined in the `Stream`\
    \ class. It takes a `Predicate` object and then returns a stream consisting of\
    \ the elements from original stream which matches the given `Predicate`\n- Streams\
    \ in Java 8 support the `map()` method which takes a function as an argument to\
    \ project the elements of a stream into another form\n"
