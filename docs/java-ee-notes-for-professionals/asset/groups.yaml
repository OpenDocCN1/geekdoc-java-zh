    \ 2.4: Name binding\n\nName binding is a concept that allows to say to JAX-RS\
    \ runtime that a specific filter or interceptor will be executed only for a specific\
    \ resource method. When a filter or interceptor is limited only to a specific\
    \ resource method we say that it is *name-bound*. Filters and interceptors that\
    \ do not have such a limitation are called *global*.\n\n### Defining a name binding\
    \ annotation\n\nFilters or interceptors can be assigned to a resource method using\
    \ the @NameBinding annotation. This annotation is used as meta annotation for\
    \ other implemented annotations that are applied to providers and resource methods.\
    \ See the following example:\n\nThe example above defines a new Compress annotation\
    \ which is a name binding annotation as it is annotated with @NameBinding. The\
    \ Compress annotation can be used to bind filter and interceptor to endpoints.\n\
    \n### Binding a filter or interceptor to an endpoint\n\nConsider you have an interceptor\
    \ that performs GZIP compression and you want to bind this interceptor to a resource\
    \ method. To do this, you must annotate both the resource method and the interceptor,\
    \ as follows:\n\n```java\n@Compress\npublic class GZIPWriterInterceptor implements\
    \ WriterInterceptor {\n\n    @Override\n    public void aroundWrite(WriterInterceptor\
    \ context)\n        throws IOException, WebApplicationException {\n          \
    \  final OutputStream outputStream = context.getOutputStream();\n            context.setOutputStream(new\
    \ GZIPOutputStream(outputStream));\n            context.proceed();\n    }\n}\n\
    \n@Path(\"helloworld\")\npublic class HelloWorldResource {\n\n    @GET\n    @Produces(\"\
    text/plain\")\n    public String getHello() {\n        return \"Hello World!\"\
    ;\n    }\n\n    @GET\n    @Path(\"too-much-data\")\n    @Compress\n    public\
    \ String getVeryLongString() {\n    String str = ... // very long string\n   \
    \ return str;\n    }\n}\n```\n\n@Compress is applied on the resource method getVeryLongString()\
    \ and on the interceptor GZIPInterceptor. The interceptor will be executed only\
    \ if any resource method with such an annotation will be executed.\n\nName binding\
    \ can be applied on a resource class. In the example HelloWorldResource would\
    \ be annotated with @Compress. This would mean that all resource methods will\
    \ use compression in this case.\n\nNote that global filters are executed active,\
    \ so even for resource methods which have any name binding annotations.\n\n# Documentation\n\
    \n- * @NameBinding annotation documentation\n- Jersey documentation about filters\
    \ and interceptors\n\n## Section 2.5: Exception Mapper\n\n```java\n@Provider\n\
