    \ 1.0\nJSR 109\nJSR 224\nJSR 181\nJSR 101\nJSR 67\nJSR 93\nJSR 196\nJSR 115\n\
    JSR 88\nJSR 77\nJSR 45\nJSR 222\nJSR 206\nJSR 221\nJSR 003\nJSR 925\nJSR 173\n\
    \n## 第1.2节：安装\n\n首先，你无法“安装”Java EE，Java EE 由许多规范组成。不过，你可以安装所有这些规范。\n\n根据你的需求，有很多种可能性。要安装大多数（或所有）规范，你可以选择兼容\
    \ Java EE 7 的应用程序服务器。根据你的需求，你可以在实现 web profile（Web 配置）的应用程序服务器和实现 full profile（全配置）的应用程序服务器之间进行选择。Java\
    \ EE 7 兼容应用程序服务器列表请参见 Java EE Compatibility。\n\n## 第1.3节：安装 Payara Server Full\n\
    \n### 前提条件\n\n- JDK 1.7 或更高版本。你可以在此处找到 Oracle JDK。\n\n### 步骤\n\n- 下载 Payara Server\
    \ Full。\n- 将 Payara Server 解压到计算机上的某个位置。Windows 用户将使用 `C:\\payara41` 作为 `INSTALL_DIR`，Linux/Mac\
    \ 用户将使用 `/payara41`。\n\n### 从命令行提示启动/停止 Payara\n\n- Windows：打开命令提示符并执行以下命令启动/停止\
    \ Payara：\n```cmd\n\"C:\\payara41\\bin\\asadmin\" start-domain\n\"C:\\payara41\\\
    bin\\asadmin\" stop-domain\n```\n\n- Linux/Mac：打开终端并执行以下命令启动/停止 Payara：\n\n###\
    \ 从 Netbeans 启动 Payara\n\n- 将 Payara 服务器添加到 Netbeans 中（参见上一章）。\n- 转到“Services”（服务）选项卡（Window\
    \ -> Services）。\n- 展开“Servers”（服务器）项。\n- 右键点击 Payara 服务器并选择“View Admin Console”（查看管理控制台）。\n\
    - （可选）右键点击 Payara 服务器并选择“View Admin Console”以进入控制台。\n\n要检查你是否正在运行应用程序服务器，打开浏览器并访问\
    \ http://localhost:4848 查看 Payara Server 控制台。\n\n大功告成！现在是时候使用 JavaEE 构建你的应用程序并将其部署到你的服务器了！\n\
    \n## 第1.4节：构建我的第一个 JavaEE （Hello World）\n\n让我们了解一下，JavaEE 由许多规范组成。当你安装应用程序服务器（例如\
    \ Payara）时，你会一次性安装所有规范。例如，有一个用于 ORM JPA（Java 持久化 API）的规范，有一个用于构建组件化 Web 应用 JSF（Java\
    \ Server Faces）的规范，还有一个用于构建 REST Web 服务器和客户端 JAX-RS 的规范。\n\n所以正如你所料的，在 JavaEE\
    \ 中构建简单的 Hello World 应用的方法并非只有一种。\n\n其次，JavaEE 具有特定的文件夹结构，看起来如下（简化版）：\n\n```\n\
    /projectname/src/main/Java\n/projectname/src/main/resources\n/projectname/src/main/resources/META-INF\n\
    /projectname/src/main/webapp\n/projectname/src/main/webapp/WEB-INF\n```\n\n在 `/projectname/src/main/java`\
