    \ factories are the objects that allow connection to provider by creating Connection\
    \ object. javax.jms.ConnectionFactory is an interface that encapsulates configuration\
    \ parameters defined by an administrator.\n\nUsing ConnectionFactory client must\
    \ use JNDI lookup (or injection). The following code gets JNDI InitialContext\
