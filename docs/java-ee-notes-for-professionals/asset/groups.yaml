    \ return str;\n    }\n}\n```\n\n`@Compress` 应用于资源方法 `getVeryLongString()` 以及拦截器\
    \ `GZIPInterceptor`。只有当带有此类注解的任何资源方法执行时，该拦截器才会执行。\n\n名称绑定可以应用于资源类。在 `HelloWorldResource`\
