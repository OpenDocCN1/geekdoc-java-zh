    \n- Java EE 5 (2006)\n- Java EE 6 (2009)\n- Java EE 7 (2013)\n- Java EE 8 (2017)\n\
    - Jakarta EE 9 (2020)\n\nJava EE 是一组规范，提供了一个用于开发、运行和本地化多层企业级应用程序的框架。“平台”定义了一组程序在\
    \ Java 环境中可以使用的服务和 API。\n\n- Servlet 3.0\n- JSP 2.1\n- JSF 2.0\n- EJB 3.1\n- JPA\
    \ 2.0\n- CDI 1.1\n- JTA 1.1\n- JAX-RS 2.0\n- JAX-WS 2.1\n- Bean Validation 1.0\n\
    - Concurrency Utilities\n- Bean Validation 2.0\n\n## 第 4 章：消息服务 (JMS)\n\nJMS 为应用程序创建、发送和接收消息提供了\
    \ API。“提供者”定义了一组程序在 JMS 环境中使用的接口和相关服务。\n\n- JMS 允许应用程序以异步和同步方式进行通信。\n- JMS 提供了一套通用接口，无论使用哪个提供者，程序都可以使用。\n\
    - JMS 将发送者与接收者解耦。\n\n### 第 4.1 节：JMS 提供者实现\n\n常见的 JMS 提供者包括 ActiveMQ、OpenMQ 和\
    \ TMQ。\n\n| 特性 | ActiveMQ | OpenMQ | TMQ |\n| --- | --- | --- | --- |\n| 开源 |\
    \ 是 | 是 | 否 |\n| 性能 | 高 | 中 | 高 |\n\n## 第 3 章：WebSockets API\n\n### 第 3.1 节：创建\
    \ WebSocket 通信\n\nWebSockets 提供了一种在单个 TCP 连接上建立全双工通信的方法。\n\n- 客户端可以向服务器发送消息。\n\
    - 服务器可以向客户端发送消息。\n- 多个客户端可以连接到服务器。\n\n#### 服务器端点 (Server-Endpoint)\n\n服务器点处理传入的连接并处理消息。\n\
    \n```java\n@ServerEndpoint(\"/chat\")\npublic class ChatEndpoint {\n    @OnOpen\n\
    \    public void onOpen(Session session) {\n        System.out.println(\"Opened:\
    \ \" + session.getId());\n    }\n\n    @OnMessage\n    public void onMessage(String\
    \ message, Session session) {\n        System.out.println(\"Message: \" + message);\n\
    \    }\n\n    @OnClose\n    public void onClose(Session session) {\n        System.out.println(\"\
    Closed: \" + session.getId());\n    }\n}\n```\n\n#### 客户端点 (Client-Endpoint)\n\
    \n客户端点连接到服务器并发送和接收消息。\n\n```java\nContainer container = ContainerProvider.getWebSocketContainer();\n\
    Session session = container.connectToEnd(MyClient.class, new URI(\"ws://localhost/chat\"\
    ));\nsession.getBasicRemote().sendText(\"Hello, World!\");\n```\n\n20+ 页的专业提示与技巧\n\
