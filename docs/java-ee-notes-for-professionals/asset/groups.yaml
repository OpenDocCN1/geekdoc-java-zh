    \ message) {\n        System.out.println(\"received message from a websocket client!\
    \ \" + message);\n    }\n}\n```\n\n# 客户端端点 (Client Endpoint)\n\n与服务器端点类似，你可以通过\
    \ `@ClientEndpoint` 注解 POJO 创建 WebSocket 客户端端点。\n\n```java\n@ClientEndpoint\n\
