    /WebSocketEndPoint\", decoders = {MsgDecoder.class}, encoders = {StringMsgEncoder.class,\
    \ IntegerMsgEncoder.class}) public class ServerEndPoint {\n\n@OnOpen\npublic void\
    \ onOpen(Session session) {\n  System.out.println(\"A session has joined\");\n\
    }\n\n@OnClose\npublic void onClose(Session session) {\n  System.out.println(\"\
