    # # Chapter 1: Getting started with Java EE


    # ## Section 1.1: What is Java EE?


    Java EE stands for Java Enterprise Edition. Java EE extends the SE (which stands
    for Java Standard Edition). Java EE is a set of technologies and related specifications
    that are oriented towards the development of large-scale applications. Java EE
    is developed in a community driven process. So far the following versions of Java
    EE have been released:


    +   * JEE 1.2 (December 12, 1999)

    * JEE 1.3 (September 24, 2001)

    * JEE 1.4 (November 11, 2003)

    * Java EE 5 (May 11, 2006)

    * Java EE 6 (December 10, 2009)

    * Java EE 7 (April 5, 2013)

    * Java EE 8 (August 31, 2017)


    A key concept of the Java EE is that every Java EE version is comprised by a set
    of specific technologies. These technologies address specific JSR (Java Specification
    Requests). In order for a programmer to use these technologies he needs to download
    an implementation of the Java EE technology specifications. The Java Community
    provides a reference implementation for each technology but other Java EE compliant
    technologies are developed and can also be used. The community provides a set
    of technologies, namely the Java Compatibility Kit (JK) that can be used by the
    developers of a JSR implementation if it is compliant or with the JSR. The following
    gives an overview of the technologies that comprise Java EE 7 and the related
    JSR that define the specs.


    | Java EE Technology | JSR |

    |---|---|n| Enterprise Edition 7 (Java EE 7) | JSR 342 |

    | API for WebSocket | JSR 356 |

    | API for JSON Processing | JSR 353 |

    | Servlet 3.1 | JSR 340 |

    | Java Faces 2.2 | JSR 344 |

    | Expression Language 3.0 | JSR 341 |

    | Java Pages 2.3 | JSR 245 |

    | Standard Tag Library for JavaServer (JSTL) 1.2 | JSR 52 |

    | Batch Applications for JavaServer | JSR 352 |

    | Concurrency Utilities for Java EE 1.0 | JSR 236 |

    | Contexts and Dependency Injection for Java 1.1 | JSR 346 |

    | Dependency Injection for Java 1.0 | JSR 330 |

    | Bean Validation 1.1 | JSR 349 |

    | Enterprise JavaBeans 3.2 | JSR 345 |

    | Interceptors 1.2 (Maintenance Release) | JSR 318 |

    | Java EE Connector Architecture 1.7 | JSR 322 |

    | Java Persistence 2.1 | JSR 338 |

    | Common Annotations for the Java Platform 1.2 | JSR 250 |

    | Java Message Service API 2.0 | JSR 343 |

    | Java Transaction API (JTA) 1.2 | JSR 907 |

    | JavaMail 1.5 | JSR 919 |

    | API for RESTful Web Services (JAX-RS) 2.0 | JSR 339 |'
