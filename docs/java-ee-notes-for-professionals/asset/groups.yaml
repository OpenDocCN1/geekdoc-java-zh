    \n# Chapter 3: The WebSockets API\n\n# Section 3.1: Creating a WebSocket communication\n\
    \nWebSocket provides a duplex/bidirectional communication over a single TCP connection.\n\
    \n- the client opens a connection to a server that is listening for a WebSocket\
    \ request\n- the client connects to a server using a URI.\n- A server may listen\
    \ to requests from multiple clients.\n\n# Server Endpoint\n\nYou can create a\
    \ WebSocket server endpoint by just annotate a POJO with @Endpoint. @OnMessage\
    \ decorates a method that receives messages. @OnOpen can be used to describe a\
    \ method to be called when a new connection from a peer is established. Similarly,\
    \ a method annotated with @Close is called when a connection is closed.\n\n```java\n\
    @Endpoint(\"/websocket\")\npublic class WebSocketServerEndpoint {\n    @OnOpen\n\
    \    public void open(Session session) {\n        System.out.println(\"client\
    \ connected\");\n    }\n    @OnClose\n    public void close(Session session) {\n\
    \        System.out.println(\"client disconnected\");\n    }\n    @OnMessage\n\
    \    public void handleMessage(String message) {\n        System.out.println(\"\
    received message from a websocket client! \" + message);\n    }\n}\n```\n\n# Client\
    \ Endpoint\n\nSimilar to the server endpoint you can create a WebSocket client\
    \ endpoint by annotate a POJO with @ClientEndpoint.\n\n```java\n@ClientEndpoint\n\
    public class WebSocketClientEndpoint {\n    Session userSession = null;\n\n  \
    \  // in our case 1. \"ws://localhost:8080/myApp/websocket\"\n    public WebSocketClientEndpoint(URI\
    \ endpoint) {\n        WebSocketContainer container = ContainerProvider.getWebSocketContainer();\n\
    \        container.connectTo(this, endpoint);\n    }\n\n    @OnOpen\n    public\
    \ void onOpen(Session userSession) {\n        System.out.println(\"opening websocket\"\
    );\n    }\n}\n```\n\nGoalKicker - Java® EE Notes for Professionals\n"
