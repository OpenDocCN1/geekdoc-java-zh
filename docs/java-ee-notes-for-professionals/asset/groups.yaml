    # # Section 1.2: Installation


    First of all, you cannot "install" Java EE, Java EE consists of a number of specifications.
    You can install all of those specifications however.


    Depending on your needs, there are lots of possibilities. To install most (or
    all) of the specifications, you can choose a Java EE 7 compatible Application
    Server. Depending on your needs, you can choose between application servers that
    implement the web profile or application servers that implement the full profile.
    For a list of Java EE7 compatible application servers see Java EE Compatibility.


    # # Section 1.3: Installing Payara Server Full


    # ## Prerequisites


    +   - JDK 1.7 or later. Then you can find the Oracle JDK''s here.


    # ## Steps


    +   - Download Payara Server Full.

    - Unzip the Payara Server at some location on your computer. We will use C:\payara41
    as INSTALL_DIR for Windows users and /payara41 for Linux/Mac users.


    # ### Starting / stopping Payara from the command prompt


    +   - Windows: Open a command prompt and execute the following command to start/stop
    Payara:

    ```cmd

    "C:\payara41\bin\asadmin" start-domain

    "C:\payara41\bin\asadmin" stop-domain

    ```


    +   - Linux/Max: Open a terminal and execute the following command to start/stop
    Payara:'
  - '[PAGE 5]


    # Starting Payara from Netbeans


    +   - Add the Payara server to Netbeans (see previous chapter)

    - Go to the ''Services'' tab (Window -> Services).

    - Expand the ''Servers'' item.

    - Right-click on the Payara server and select ''View Admin Console''

    - (Optional) Right-click on the Payara server and select ''View Admin Console''
    to go to the console.


    To check that you are running the Application Server, open a browser and go to
    http://localhost:4848 to see the Payara Server Console.


    Voila! Now it''s time to build your application using JavaEE and deploy it to
    your server!


    # Section 1.4: Building my first JavaEE Application (Hello World)


    Let''s understand, JavaEE consists of a number of specifications. When you install
    an Application Server (Payara for example), you install all of the specifications
    at once. For example there is a specification for an ORM JPA (Java Persistence
    API), a specification to build Component Based Web Applications JSF (Java Server
    Faces), a specification to build REST web servers and clients JAX-RS.


    So as you guess, there''s not only way to build a simple Hello World application
    in JavaEE.


    Secondly, the JavaEE has a specific structure of folders that looks something
    like this (simplified):


    ```

    /projectname/src/main/Java

    /projectname/src/Main/resources

    /projectname/src/main/resources/META-INF

    /projectname/src/main/webapp

    /projectname/src/main/webapp/WEB-INF

    ```


    Inside the /projectname/src/main/java we put all the Java classes that we need.


    Inside the /projectname/src/main/webapp we put our html files, css files, javascript,
    etc.


