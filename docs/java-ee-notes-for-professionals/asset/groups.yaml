- md: "\n# Java EE\nNotes for Professionals\n\n## Chapter 1: Getting started with\
    \ Java EE\n\n### Section 1.1: What is Java EE?\n\nEE is a set of specifications\
    \ that provide tools for developing large enterprise applications. It is deployed\
    \ on a set of application servers. For the purpose of this book, we will use GlassFish\
    \ server as an example.\n\n- Java EE 5 (2006)\n- Java EE 6 (2009)\n- Java EE 7\
    \ (2013)\n- Java EE 8 (2017)\n- Jakarta EE 9 (2020)\n\nJava EE is a set of specifications\
    \ that provides a framework to develop, run, and localize localized multi-tiered\
    \ enterprise applications. The 'platform' defines a set of services and APIs that\
    \ programs can use in the Java environment.\n\n- Servlet 3.0\n- JSP 2.1\n- JSF\
    \ 2.0\n- EJB 3.1\n- JPA 2.0\n- CDI 1.1\n- JTA 1.1\n- JAX-RS 2.0\n- JAX-WS 2.1\n\
    - Bean Validation 1.0\n- Concurrency Utilities\n- Bean Validation 2.0\n\n## Chapter\
    \ 4: Messaging Service (JMS)\n\nJMS provides an API for applications to create,\
    \ send, and receive messages. The 'provider' defines a set of interfaces and associated\
    \ services that programs can use in the JMS environment.\n\n- JMS allows applications\
    \ to communicate asynchronously and synchronously.\n- JMS provides a common set\
    \ of interfaces that programs can use regardless of the provider.\n- JMS decouples\
    \ the sender from the receiver.\n\n### Section 4.1: JMS provider implementations\n\
    \nCommon JMS providers include ActiveMQ, OpenMQ, and TMQ.\n\n| Feature | ActiveMQ\
    \ | OpenMQ | TMQ |\n| --- | --- | --- | --- |\n| Open Source | Yes | Yes | No\
    \ |\n| Performance | High | Medium | High |\n\n## Chapter 3: The WebSockets API\n\
    \n### Section 3.1: Creating a WebSocket communication\n\nWebSockets provide a\
    \ way to establish full-duplex communication over a single TCP connection.\n\n\
    - A client can send messages to the server.\n- The server can send messages to\
    \ the client.\n- Multiple clients can be connected to the server.\n\n#### Server-Endpoint\n\
    \nThe server-endpoint handles incoming connections and processes messages.\n\n\
    ```java\n@ServerEndpoint(\"/chat\")\npublic class ChatEndpoint {\n    @OnOpen\n\
    \    public void onOpen(Session session) {\n        System.out.println(\"Opened:\
    \ \" + session.getId());\n    }\n\n    @OnMessage\n    public void onMessage(String\
    \ message, Session session) {\n        System.out.println(\"Message: \" + message);\n\
    \    }\n\n    @OnClose\n    public void onClose(Session session) {\n        System.out.println(\"\
    Closed: \" + session.getId());\n    }\n}\n```\n\n#### Client-Endpoint\n\nThe client-endpoint\
    \ connects to the server and sends and receives messages.\n\n```java\nContainer\
    \ container = ContainerProvider.getWebSocketContainer();\nSession session = container.connectToEnd(MyClient.class,\
    \ new URI(\"ws://localhost/chat\"));\nsession.getBasicRemote().sendText(\"Hello,\
    \ World!\");\n```\n\n20+ pages of professional hints and tricks\n\nThis is an\
    \ unofficial free book created for educational purposes. It is not affiliated\
    \ with any Java EE group or companies. All trademarks and registered trademarks\
    \ are the property of their respective owners.\n\n## Contents\n\n- About .....................................................................................................................................\
