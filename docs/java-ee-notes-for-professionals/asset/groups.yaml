    \ @OnOpen can be used to describe a method to be called when a new connection\
    \ from a peer is established. Similarly, a method annotated with @Close is called\
    \ when a connection is closed.\n\n```\n@Endpoint(\"/websocket\")\npublic class\
    \ WebSocketServerEndpoint {\n    @OnOpen\n    public void open(Session session)\
    \ {\n        System.out.println(\"client connected\");\n    }\n    @OnClose\n\
    \    public void close(Session session) {\n        System.out.println(\"client\
    \ disconnected\");\n    }\n    @OnMessage\n    public void handleMessage(String\
    \ message) {\n        System.out.println(\"received message from a websocket client!\
    \ \" + message);\n    }\n}\n```\n\n# Client Endpoint\n\nSimilar to the server\
    \ endpoint you can create a WebSocket client endpoint by annotate a POJO with\
    \ @ClientEndpoint.\n\n```\n@ClientEndpoint\npublic class WebSocketClientEndpoint\
