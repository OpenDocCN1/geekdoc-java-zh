    \ AbstractMsg message) {\n  if (message instanceof IntegerMsg) {\n    System.out.println(\"\
    IntegerMsg received!\");\n  } else if (message instanceof StringMsg) {\n    System.out.println(\"\
    StringMsg received!\");\n  }\n\n  message.transform();\n}\n```"
