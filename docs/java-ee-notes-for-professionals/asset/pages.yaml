  md: '# Deploy the WAR file


    +   - In a browser, go to http://localhost:4848 (follow instructions to install
    payara server).


    +   - Go to Applications > Click Deploy, Click Select File and choose your war
    file (HelloJavaEE-1.0-SNAPSHOT.war) under ./.NetBeansProjects/HelloJavaEE/target.


    # Deploy the WAR file from Netbeans


    +   - Install Payara (see next chapter).


    +   - In Netbeans, go to the ''Services'' tab (Window-> Services if you don''t
    see it).


    +   - Right-click on Servers and select ''Add Server...''


    +   - Point to your local Payara installation, give it a name and click next.


    +   - Leave the domain location settings as they are (Domain: domain1, Host: localhost,
    DAS Port: 4848, HTTP Port: 8080).


    +   - Go to the ''Projects'' tab (Windows -> Projects).


    +   - Right-click on your project and select ''Properties''.


    +   - In the left hand pane, go to ''Run'' and select the Server you just added.


    +   - (Optional) Change the context path. If you set the context path to ''/MyFirstApplication''
    the default URL will be ''http://localhost:8080/MyFirstApplication''.


    # View results


    +   - In a browser, go to http://localhost:8080/HelloJavaEE-1.0-SNAPSHOT


    Voila! That''s your first app using JEE technology. You should now start creating
    "Hello World" apps using different specifications like JPA, EJB, JAX-RS, JavaBatch,
    etc...'
