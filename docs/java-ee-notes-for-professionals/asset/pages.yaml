  md: "# Chapter 4: Java Messaging Service (JMS)\n\nThe Java Message Service is a\
    \ Java API that allows applications to create, send, receive, and read messages.\
    \ The JMS API defines a common set of interfaces and associated semantics that\
    \ programs written in the Java programming language to communicate with other\
    \ messaging implementations. JMS enables communication that is not loosely coupled\
    \ but asynchronous and reliable.\n\n# Section 4.1: Using ActiveMQ library for\
    \ messaging (activemq jms provider specific implementations)\n\nSetup ActiveMQ\n\
    \n+   - Download a ActiveMQ distribution from activemq.apache.org and unpack it\
    \ somewhere\n- You can start the server immediately, running unconfigured on localhost,\
    \ using the script bin/activemq\n- When it is running, you can access your server's\
    \ console on http://localhost:8161/admin/\n- Configure it by modifying conf/activemq.xml\n\
    - As the title suggests following examples activemq jms provider specific implementations\
    \ and hence activemq-all.jar needs to be added to the classpath.\n\nSending a\
    \ message through standalone client\n\n```\nimport javax.jms.Connection;\nimport\
    \ javax.jms.ConnectionFactory;\nimport javax.jms.JMSException;\nimport javax.jms.Message;\n\
    import javax.jms.MessageProducer;\nimport javax.jms.Queue;\nimport javax.jms.Session;\n\
    import org.apache.activemq.ActiveMQConnectionFactory;\n\npublic class JmsMessageSender\
    \ {\n    public static void main(String[] args) {\n        ConnectionFactory factory\
    \ = new ActiveMQConnectionFactory(\"tcp://localhost:61616\"); //\n        Connection\
    \ conn = null;\n        try {\n            conn = factory.createConnection();\n\
    \            Session session = conn.createSession(false, Session.AUTO_ACKNOWLEDGE);\
    \ // non-transacted\n\n            Queue queue = session.createQueue(\"test.queue\"\
    ); // only specifies queue name\n\n            MessageProducer producer = session.createProducer(queue);\n\
    \            Message msg = session.createTextMessage(\"hello queue\"); // text\
    \ message\n            producer.send(msg);\n        } catch (JMSException e) {\n\
    \            e.printStackTrace();\n        } finally {\n            try {\n  \
    \              if (conn != null) {\n                    conn.close();\n      \
    \          }\n            } catch (JMSException e) { /* Ignore * */}\n       \
    \ }\n    }\n}\n```\n\nGoalKicker - Java® EE Notes for Professionals"
