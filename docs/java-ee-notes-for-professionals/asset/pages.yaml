  md: "# # Chapter 2: Java RESTful Web Services (JAX-RS)\n\n# ## Section 2.1: Simple\
    \ Resource\n\nFirst all of a JAX-RS application must be set a base URI from which\
    \ all the resources will be available. For that purpose the java.ws.rs.Application\
    \ class must be extended and annotated with the java.ws.rs.ApplicationPath annotation.\
    \ The annotation accepts a string argument which defines the base URI.\n\n```\n\
    @ApplicationPath(JaxRSActivator.ROOT_PATH)\npublic class JaxRSActivator extends\
    \ Application {\n\n/**\n * JAX-RS root path.\n */\n public static final String\
    \ ROOT_PATH = \"/api\";\n}\n```\n\nResources are simple POJO classes which are\
    \ annotated with the @Path.\n\n```\nimport java.ws.rs.GET;\nimport java.ws.rs.Path;\n\
    import java.ws.rs.Produces;\n\n@Path(\"/hello\")\npublic class HelloWorld {\n\
    \ public static final String MESSAGE = \"Hello StackOverflow!\";\n\n@GET\n@Produces(\"\
    /text/plain\")\npublic String getHello() {\n return MESSAGE;\nn}\n```\n\nWhen\
    \ a HTTP request is sent to /hello, the resource responds with a Hello StackOverflow!\
    \ message.\n\n# ## Section 2.2: GET method types\n\n```\nimport java.ws.rs.GET;\n\
