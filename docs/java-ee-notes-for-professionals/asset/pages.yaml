    \nYou can use this Example above **Send Simple Mail** with a little modification.\
    \ Use msg.`setContent()` instead of msg.`setText()` and use content type `html`\
    \ as text/html.\n\ncheck this\n\n```\nmsg.setContent(message, \"text/html; charset=utf-8\"\
    );\n```\n\ninstead of\n\n```\nmsg.setText(message);\n```\n\n# ## Section 6.2:\
    \ Send Simple Email\n\n```\npublic class GoogleMailTest {\n\n    GoogleMailTest()\
    \ {\n}\n\n    public static void send(Final String username, final Exception,\
    \ final String password, String recipientEmail,\nString title, String message)\
    \ throws AddressException, MessagingException {\n        GoogleMailTest.send(username,\
    \ password, recipientEmail, \"-\", title, message);\n    }\n\n    public static\
    \ void send(Final String username, final String password, String recipientEmail,\n\
    cceMail, String title, String message) throws MessagingException {\n        Security.addProvider(\"\
    com.sun.net.ssl.internal.SSLProvider\");\n        final SSLFactory _FACTORY =\
    \ (java.net.ssl.SSLSocketFactory)\n        // Get the Properties object\n    \
    \    Properties props = System.getProperties();\n        props.setProperty(\"\
    smtp.mail.host\", \"smtp.mail.com\");\n        props.setProperty(\"smtp.mail.factory.class\"\
    , \"SSL_FACTORY\");\n        props.setProperty(\"smtp.mail.factory.fallback\"\
    , \"false\");\n        props.setProperty(\"smtp.mail.port\", \"465\");\n     \
    \   props.put(\"debug\", \"true\");\n        props.setProperty(\"smtp.mail.factory\"\
    , \"465\");\n        props.setProperty(\"smtp.mail.smtps\", \"true\");\n     \
    \   props.put(\"smtp.mail..wait\", \"false\");\n        Session session = Session.getInstance(props,\
    \ null);\n        // Create a new message -\n        final MimeMessage msg = new\
    \ MimeMessage(session);\n        // Set the FROM and TO fields\n        msg.setFrom(new\
    \ InternetAddress(username));\n        msg.setRecipients(Message.RecipientType.TO,\
    \ InternetAddress.parse(recipientEmail, false));\n        if (ccEmail.length()\
    \ > 0) {\n            msg.setRecipients(Message.RecipientType.CC, InternetAddress.parse(ccEmail,\
    \ false));\n        }\n        msg.setSubject(title);\n        msg.setText(message);\n\
    \        msg.setSentDate(new Date()));\n        Transport t = (Transport) session.getTransport(\"\
