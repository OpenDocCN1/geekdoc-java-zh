    \nSometimes for organizational or other reasons it makes sense to have your top\
    \ level resource return a subresource that would look like this. (Your sub-resource\
    \ does not need to be an inner class)\n\n```\nimport javax.ws.rs.GET;\nimport\
    \ javax.ws.rs.Path;\nimport javax.ws.rs.Produces;\n\n@Path(\"items\")\npublic\
    \ class ItemsResource {\n\n    @Path(\"id\")\n    public String item(@PathParam(\"\
    id\") String id) {\n        return new ItemSubResource(id);\n    }\n\n    public\
    \ static class ItemSubResource {\n        private final String id;\n\n       \
    \ public ItemSubResource(String id) {\n            this.id = id;\n        }\n\n\
    \        @GET\n        @Produces(\"text/plain\")\n        public String item()\
    \ {\n            return \"The item \" + id;\n        }\n    }\n}\n```\n\n# ##\
    \ Section 2.9: UriInfo\n\nIn order to get information about the user agent used\
    \ to access your resource, you can use the @Context parameter annotation with\
    \ a UriInfo parameter. The UriInfo object has few methods that can be used to\
    \ get different parts of the URI.\n\n```\n//server is running on https://localhost:8080,\n\
    // webapp is at /webapp, servlet at /webapp/servlet\n@Path(\"class\")\npublic\
