    \ 4.2 Creating ConnectionFactory\n\nConnection factories are the objects that\
    \ allow connection to provider by creating Connection object. javax.jms.ConnectionFactory\
    \ is an interface that encapsulates configuration parameters defined by an administrator.\n\
    \nUsing ConnectionFactory client must use JNDI lookup (or injection). The following\
    \ code gets JNDI InitialContext object and uses it to lookup ConnectionFactory\
    \ object under JNDI name:\n\n```\nContext ctx = new InitialContext();\nConnectionFactory\
    \ connectionFactory = (ConnectionFactory) ctx.lookup(\"jms/javaee7/ConnectionFactory\"\
    );\n```\n\nThe methods available in this interface are createConnection() methods\
    \ that return a Connection object and new JMS 2.0 createContext() methods that\
    \ return a JMSContext."
