  md: '# A NOTE ON INTROVERSION AND METHODOLOGY


    Like Susan Cain in her book *Quiet: The Power of Introverts in a World That Can''t
    Stop Talking* (which I can''t recommend highly enough), I address introversion
    from a cultural point of view.


    In other words, I am working from the understanding that introverts, to paraphrase:
    seek solitude, concentrate well, are contemplative, dislike small talk, love one-on-one
    conversations, find long periods of socializing draining, and are often, though
    not always, shy and sensitive. And that extroverts are: highly sociable, risk-taking,
    relaxed in the spotlight, loud, enthusiastic, and enjoy large groups of people.


    Traits associated with cultural introversion may come under different categories
    in the Big Five personality traits taxonomy (i.e., shyness may fall under “neuroticism,”
    and a risk-averse nature may fall under “openness to experience”).


    Likewise, the Myers-Briggs personality inventory describes introverts as individuals
    who obtain energy from contemplation or time alone, as opposed to extroverts,
    who gain energy from taking action or socializing. This book''s interpretation
    of introversion is consistent with this definition but also includes the aforementioned
    cultural traits associated with introverts.


    If you are an introvert (or extrovert), some traits or tendencies I mention may
    apply to you; others may not. We are, as a rule, too complex for such'
