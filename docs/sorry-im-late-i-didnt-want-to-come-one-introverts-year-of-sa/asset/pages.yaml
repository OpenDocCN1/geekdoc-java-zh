  md: '# TALKING TO MEN,

    A Real-Life Interlude


    One night, Sam and I are at a group dinner with some of his old friends and their
    partners. The men and women end up self-segregating. Sam and I are sitting in
    the middle of the table, at the cutoff point. I turn my head to my right to face
    the woman, and he turns to the left to talk to the other men.


    In less than ten minutes, the women have plunged straight into Deep Talk. Two
    women, who just met this evening, discover that both of their mothers have Parkinson''s
    disease.


    I say “discover,” but the word I really mean is “share.” They decide to open up
    to each other. When Laura tells us about what a difficult time she is having her
    mother suffer from the disease, the woman next to her confides that she is experiencing
    the exact same thing with her mother. I can see the relief on Laura''s face. *Someone
    understands me. A total stranger understands this particular awful pain more than
    most of my close friends.


    It changes the temperature of the evening. Everyone on the right side of the table
    becomes more open, more honest, more willing to share and listen.


    Later, when Sam and I are taking the Tube back home, I ask him for an update on
    his friends whom I hadn''t found a chance to talk to. He tells me that two of
    his friends had switched jobs, so his end of the table only talked about work.'
