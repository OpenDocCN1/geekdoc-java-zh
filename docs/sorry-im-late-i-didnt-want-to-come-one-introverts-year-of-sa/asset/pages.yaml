  md: 'I once overheard my former coworker Willow talking about her trip to New York.
    Willow had stopped to pet a woman’s dog in Prospect Park: she ended spending the
    day with the woman, going to a jazz club with her until 4 a.m., and later landing
    her dream job through one of her new friend''s connections. She''d met her boyfriend
    in a line for the bathroom at a festival. She discovered she had hypoglycemia
    by talking to a doctor at a party. Her entire life has been shaped by these random
    encounters. All because she chooses to talk and listen to people she has just
    met, rather than run away from them at full speed stuttering, "I don''t speak
    English!"


    What might happen if I flung the doors of my life? Would it change for the better?


    Although I had accepted I was, at this juncture in my life, it was not making
    me happy. I had taken my introvert status as a license to wall myself off others.


    Although I savored my introvert world, part of what I wondered might be missing
    out. When you define something or someone, you inevitably limit it. Or her. The
    way I saw myself became a self-fulfilling prophecy: "Speeches? I don''t give speeches"
    or, "Parties? I don''t throw parties." I accepted who I, but I was also too scared
    to challenge my fears and go out and have the experiences I craved.


    During my bachelor''s degree in psychology, I took a neuroscience course, partly
    because I was so interested in the interplay between nature and nurture. But now
    that I was an adult, how much could I change as a result of new experiences?


    The famous Shakespeare quote is "To thine own self be true." Yes. But I didn''t
    want to be tethered to my insecurities and anxieties for eternity. I didn''t want
    to stay stunted. We''re humans—we have the capacity for growth and change.'
