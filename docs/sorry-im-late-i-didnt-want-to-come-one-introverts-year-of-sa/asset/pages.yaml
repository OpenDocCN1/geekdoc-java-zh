    You will meet one person who is interesting, and you bond over the awkwardness
    of the event. This person usually has impeccably applied lipstick, so you both
    respect and fear them. You ask about what they do, and they ask about what you
    do, and you are both genuinely engaged in the conversation. Then she says, “I’m
    leaving the country for three months, but I’ll be in touch when I get back.” There
    is a 50 percent chance that she actually will. You follow each other on Twitter
    (Or she emails you your schedules are incompatible for the next few months. Either
