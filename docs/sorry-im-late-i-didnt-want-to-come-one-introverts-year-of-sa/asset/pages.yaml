  md: 'People asked me so many times this year whether I was happier acting like an
    extrovert.


    At times. In the best moments of improv, surrounded by warm, friendly faces, in
    a small classroom, just playing and being creative and laughing, I was indescribably
    happy. When I fell into a good conversation that I had initiated with a stranger,
    with Claude on the Eurostar, I had the loveliest sense of unexpected kinship.
    When I wandered into the first bathhouse in Budapest and floated on my back, staring
    at the sky, with no plans to make or break, I felt free.


    I loved learning about people and making connections, like having dinner with
    the storytellers of The Math, or over pie at book club, or even in the hospital
    with Pete, hearing about his Chinese grandparents while I took my father’s blood
    pressure.


    ***


    At the same time, as I ushered those final guests out of our apartment after Thanksgiving
    dinner, I was so, so tired. How do extroverts get any work done? I genuinely do
    not know. How do they know what has happened to them without being alone to process
    it and fret about it and stay up all night without thinking about it? How can
    they hear themselves think with all these new conversations in their heads?


    How do you sleep at night, extroverts?


    A year of living like one was hard.


    But now I have Lily and Vivian. I know that we will continue to meet up and workshop
    comedy and that if I ever do perform again, there will be there for me when I
    say the wrong thing onstage.


    I know that a new friend is only two flights of stairs away, in my Dutch neighbor,
    Hannah.'
