  md: 'lot of people and loathe large crowds. I am, as one article defined it, a “socially
    awkward introvert.” A shy introvert, or shintrovert, as I shall henceforth refer
    to myself (which is also a pervert who is very into lower legs).


    I don’t know whether shintroverts are born or made, but for me, my tendencies
    began to show very early on. I grew up in a small town in Texas where I skipped
    birthday parties, faked illnesses to avoid school presentations, and spent many
    nights journaling about a parallel universe where interacting with multiple people
    and occasionally being the center of attention wasn''t my worst nightmare.


    As a kid, I didn''t understand why I felt so differently from life by my extroverted
    family. My father is Chinese, and my mother is Jewish American, and they both
    love two things deeply: Chinese food and chatting with new people. Meanwhile,
    my two older brothers were always inviting big groups of their friends over to
    our house, where they''d linger for hours. I originally thought they were all
    better at pretending to like the things I hated. Later, I was confounded: why
    did they love meeting big groups of new people and socializing for hours and throwing
    big birthday parties when I didn''t? I thought that there was something deeply
    wrong with me.


    Still, growing up in a small town, I dreamed of a bigger life full of new experiences.
    But it wasn''t a life I could envisage for myself. I wanted an entirely clean
    slate. A new place where I could reinvent myself from anyone who knew me. I tried
    Beijing, then Australia, and eventually London, where I live now.


    But one thing remained constant during these travels: no matter how far-lung the
    lands, I remained essentially the same. A shintrovert. Dumplings, shrimp on the
    barbie, scones and sream. Shintrovert eating in the corner. The Forbidden City,
    Sydney Opera House, Tower of London.'
