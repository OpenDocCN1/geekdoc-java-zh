  md: 'traits, to expand or contract at will, offers me an incredible feeling of freedom
    and a source of hope.


    I think a small part of me thought I''d do these challenges, go through hell,
    and emerge at the other end the most socially savvy, articulate, gregarious social
    butterfly in the world. Or wind up hiding in a ditch. One or the other. But I
    am still who I was at the beginning of this year. But I know more now.


    I took steps forward, and I took steps back. My anxiety around public speaking
    will likely never go away, but now I know it isn''t necessarily an obstacle.


    When I visit Union Chapel, this time once again in the audience for The Moth,
    I sit still, listening to a young woman tell the story about the first time she
    met the sister she never knew she had. I can''t believe that had once been me
    up there. I watch and listen intently the woman onstage who is speaking confidently,
    surely. But, suddenly, she stops. It''s a long pause. She has forgotten her next
    line. She has lost her place. She takes a deep breath and slowly, measuredly,
    exhales, a rush into the air. The audience, on the edge of their seat, exhales
    with her. She does not stutter, or rush, or run off the stage in tears. She stands
    still, waiting. And then her story comes back to her.


    For years, I thought that if you were onstage at a big performance and you froze
    or messed up, you wouldn''t be able to recover. Afterward, in the bar, the woman
    is fine. She is better than fine. She is glowing. She doesn''t seem embarrassed
    or ashamed. The worst had happened, and she is overjoyed. Of course she is. Why
    had it taken me so long to believe that even when these things don''t go perfectly,
    we can still survive?


    Even when you face your biggest fears and it all goes as badly as it could possibly
    go, like when you declare your love for England onstage in Scotland.'
