  md: '# AUTHOR’S NOTE


    Let’s be clear: I don’t think anybody—introvert, extrovert, or otherwise—needs
    to be cured. But I was, for a while, an unhappy introvert, and I wanted to see
    how my life might change if I spent a year undertaking daunting new experiences.
    This book is about what happened next. Please enjoy my nightmares.'
