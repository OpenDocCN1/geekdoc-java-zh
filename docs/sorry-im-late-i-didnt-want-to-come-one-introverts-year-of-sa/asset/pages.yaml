  md: 'It was that fear, fear that if I never changed I would never know what it was
    like to live a bigger life, that propelled me through this year, pushing me out
    of the house, onto the stage, into people''s homes, and into strangers'' conversations.


    I didn''t even necessarily think I''d like a bigger life.


    But I wanted to know what it was like. To be able to make a choice about what
    kind of life I had.


    It''s generally agreed that introversion is a natural trait. Some personality
    studies say that introversion is physiologically or even genetically based, while
    others report that introversion is only 40–50 percent heritable. But that line
    in the Guardian was written by a psychologist, Brian R. Little, who argues that
    our personalities are not fixed or exclusively determined by nature or nurture;
    instead, they can change as a result of action.


    His research has uncovered the value in "personal projects," from the trivial
    (walking the dog) to the formidable (climbing Everest) to the interpersonal (trying
    to become a better listener). In his book, he writes, “What you do can remake
    who you are—and it’s a revelation that turns previous ideas about human personality
    on their heads."


    He says that we “free personality traits.” Free traits describe a behavior or
    quality we take on when we need it (i.e.


    I think about being onstage at Union Chapel, in the spotlight, after all years
    hiding from it. Watching myself in the video at my first stand-up comedy gig,
    controlled and confident. Walking into a room where I knew barely anyone and striking
    up a conversation with Paul. Trying on all of these free traits when I needed
    them to get through the year.


    I met so many other introverts who were acting as extroverts over the course of
    these challenges. It surprised me, but it shouldn''t have all'
