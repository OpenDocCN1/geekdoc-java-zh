  md: 'Finding my voice challenging myself to do intimidating things made me feel
    more confident. This is priceless in a world that can be scary, maddening, and
    unfair. When there are fewer things we are scared of and fewer things that can
    control us, this can only be a good thing.


    It was more than I could have ever hoped for I started. I feel more in control
    of my life because I can extrovert. I can socialize in a room full of people I
    don''t know. I can disrupt an entire theater row if I really need to pee. I can
    get up and shout a question at a lecturer if I genuinely do not understand. I
    can befriend someone new, take their number, and eventually feed them Coca-Cola
    ham in my house. I''m beginning to think I''m slowly becoming less of a shy introvert
    and ever so slightly more of a gregarious introvert (grintivert).


    This week, I happened to walk by that fancy gym. The one that had the competition
    that eventually led me to the sauna. I''d been avoiding it since the final weigh-in.
    I didn''t like remembering who had been that day. One of the personal trainers
    recognized me through the window and ran out to say hello as I did best to speed
    quickly on by.


    “Where''ve you been?” she asked.


    Budapest, Edinburgh, strangers'' improv classes, on stages, on friend-dates.


    “Oh, I''ve been around,” I said, mysteriously.


    “You know who won the contest this year?” she asked.


    “Who?” I asked.


    “Portia,” she said.


    I feel an overwhelming sense of relief. All is right in the world. I hadn''t messed
    up the space-time continuum after all.


    I''m about to head out the door to meet Hannah for coffee. Laura has texted asking
