  md: 'If you''re like me, then you, too, know what it feels like to dread your own
    birthday parties. You fear giving speeches, team bonding exercises, and every
    single New Year''s Eve.


    I feel this way because I''m an introvert. Actually, I''m a shy introvert (more
    on this later), and any shy introvert worth their salt has invariably done the
    following: thrown ringing phone across the room, faked being sick, walked into
    a networking event and immediately backed out, and pretended not to speak English
    when approached in a bar. That last one is advanced level but the most effective
    method of all. The rest are necessary survival skills. We are also gifted at avoiding
    eye contact to deter people from saying hello with a technique I call "dead robot
    eyes."


    I would say 90 percent of my acquaintances don''t know that I''m an introvert
    because I take such pains to hide it. After-work drinks? Sorry, I''m very busy.
    Lunch at the deli? Can''t. I have plans (eating ramen alone in blissful solitude).
    Coworkers just think that inside the office I am distracted and that outside the
    office I have both a full social calendar and debilitating face blindness.


    Now that I''m older and wiser, on the morning of every birthday, I wake up my
    husband, Sam, and whisper in his ear, "If you throw me a party, I will murder
    you." He always nods obligingly, half asleep. He doesn''t really get it, because
    he''s a different breed altogether—a quiet person who likes going to a busy pub
    and hanging out at festivals. But he''s grown used to most of our nights ending
    with my his, "Get my coat and meet me by the elevators!" while I sprint toward
    the back exit to escape an approaching tipsy bachelorette party that has just
    arrived at the bar.


    Sam goes along with it, the depths of my neuroses are a foreign country to him.
    He doesn''t understand why, for example, I prefer dogs to people. But that''s
    easy. Dogs don''t require small talk, they don''t judge you, and they don''t hum
    near your desk while you''re trying to work. They''t'
