  md: '# INTRODUCTION


    There are two types of people in this world. Those who watch Glastonbury (the
    largest music festival in the UK—and the world—jam-packed full of hundreds of
    thousands of people) on TV from afar as though it''s a horror movie. They peer
    over the top of the blanket as they bear witness to the muddy hellhole. They sigh
    from relief at the sheer joy of missing out, because they are so happy to be on
    their sofas and not there, surrounded by thousands of swaying, loud, drunk people
    with full bladders and greasy hair.


    And then there are those who choose to go to Glastonbury. I am not one of those
    people.


    My friends at college threw me a surprise party for my twenty-second birthday.
    As soon as everyone jumped out of the dark, I burst into tears. People at the
    party thought I was touched. Actually, I was horrified. For the first time in
    months, the tears weren''t because I was in unrequited love with my Spanish language
    tutor. Good friends, family, and some vague acquaintances were sitting on my bed—which
    was incidentally the very place I usually went to escape from those good friends,
    family, and vague acquaintances.


    I had nowhere to hide. They were here for a party. How long until they left?


    Eventually, I just turned on all the lights and waited for everyone to take the
    hint.'
