  md: 'What’s interesting to me is why so many other people cower at the idea of doing
    improv or watching it? “My worst nightmare,” my extroverted friend told me to.
    Live, made-up theater: this is really people’s worst nightmare? This is what is
    keeping people up at night?


    See, everyone says they hate the idea of participating in improv because you have
    to make it up as you go, you can''t plan ahead, you can freeze under pressure,
    or you can be caught looking stupid—and everything that happens is all your fault.


    It’s true. All of these things can and do happen in improv.


    Plus, given the improvised nature of the performance, watching it also be anxiety
    inducing. It can go terribly wrong, and audiences don''t want to cringe on all
    of the performers or sit through bad comedy for an hour.


    But I think people really can''t stand it for another reason. And it’s this: while
    watching a regional troupe acting out an Uber journey through your Nudist Narnia,
    they observe the performers’ joyous, earnest expressions. The audience sees how
    genuinely happy and safe they feel in their whimsy.


    And they think the same thing I do:

    Your vigor for life appalls me.


    ***


