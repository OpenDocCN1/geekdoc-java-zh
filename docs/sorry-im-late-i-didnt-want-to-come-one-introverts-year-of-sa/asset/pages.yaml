    Nearly a third of the population (at least, depending on which study you consider)
    identify as introverts, so it''s likely that this could describe you, too. If
    we''d say, met at a party that neither of us had flaked on, we could bond over
    this hiding in the kitchen near the cheese board.


    There are a lot of heated debates about what defines an introvert or an extrovert.
