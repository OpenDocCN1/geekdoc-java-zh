    So exactly ‘Improvisation’ is live theatre where the plot, characters, and dialogue
    are made up spontaneously by the actors onstage.


    It''s basically what children do when left to themselves: “play.” It''s generally
    considered adorable when you''re five in your backyard; encouraged at summer camp;
    tolerated at college; and a terrible career choice that invites pity and judgment
    if you''re over twenty-five.


    To me, improv is free-form dying. Like jumping off a cliff but you can''t look
    down, because, oh, that''s right, no one told you what''s going to happen next
    and you don''t want to see the hellpit you''re going to land in. My mind always
    blanks when I''m put on the spot—in improv, there is nowhere but “the spot.”


    This isn''t only about performance. It''s about spontaneity. Making it up as you
    go along. Surrounded by other people. You can''t plan for what''s going to happen
    next; you have to react, but you''re not sure, and you often have no control over
    whom you''re interacting with and what nonsense they''re going to throw at you.


    You know. Like real life. Which is why it''s so incredibly scary to me. No matter
    how much we plan, life is a set of unpredictable curveballs, one after the other.
