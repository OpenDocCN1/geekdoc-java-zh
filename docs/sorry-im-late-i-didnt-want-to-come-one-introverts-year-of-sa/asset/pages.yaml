  md: 'Shintvert hovering in doorways. I''d thought that maybe foreign lands would
    shake the introversion out of me, but, like eczema, it thrived in all climates.


    And then came the “Quiet Revolution,” sparked by Susan Cain''s best-selling book
    in 2012. Within its pages, I read that one out of every two three people is an
    introvert. That was nothing wrong with us. That introverts, to paraphrase, concentrate
    well, relish solitude, dislike small talk, love one-on-one conversations, avoid
    public speaking. Shy, sensitive homebody, you say? Damn right I am!


    I was enormously relieved to read these things and decide to embrace this side
    of myself. This is who I was. Rather than beating myself up for the person I wasn''t,
    I chose to celebrate the person I was. After all, my disposition is one reason
    I became a writer, and it meant that I had close relationships with my small group
    of friends during this time.


    In the space of a year, it went wrong. I became unemployed, and my closest friends
    moved away. My career had stagnated, I was lonely, and I lost the desire to run;
    I had no idea what to do in my life. In truth, I wanted to pull my old trick and
    hop on a plane and begin a new life, perhaps this time as someone named Francesca
    Buckingham. But it was abundantly clear that I didn''t have the personality, confidence,
    or hat collection to pull this off.


    I had a lot of time to sit around and ponder: what I really want from life? Really,
    I wanted a job, some new friends who I felt truly connected to, and more confidence.
    That was so much to ask? Surely not. So what were other people out there with
    jobs and close friends and, fulfilling lives doing that I wasn''t? Eventually,
    and with mounting fear, I realized: they were having new experiences, taking risks,
    making new connections. They were actually out there, living in the world instead
    of staring at it.'
