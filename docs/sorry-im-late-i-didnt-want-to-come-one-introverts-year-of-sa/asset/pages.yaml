  md: 'I know that, when it comes to public speaking, I will always feel anxious and
    despairing, but if I practice and rehearse, then I can do it.


    I know I have a new swimming and coffee pal in Abigail.


    I know that it''s worth to have Deep Talk over Surface Talk and that even though
    people are wary of it, it brings closer together.


    I know that one small action sets off so many more. I met Paul at a networking
    event, and his girlfriend recommended my comedy class, which led me to Lily and
    Vivian. On Facebook recommended my improv course, which unlocked a whole side
    of me that I''d forgotten existed.


    Talking to a coworker led me to a cozy book club.


    In one evening, I set someone up with a literary agent, give someone dating advice,
    and on the way home, help an elderly French couple to the right Tube Station.
    On the Underground, I help a woman on the escalator with her four bags of luggage.
    Normally I''d just want to would be too hesitant to get involved in someone''s
    affairs. The woman doesn''t speak English, so instead of saying “Thank you,” she
    blows kisses at me as she waves and walks away. Perhaps, I get to be someone''s
    Pete after all.


    I learned a lot about loneliness. As an adult, sometimes if you''re lucky, you
    have close friends from childhood nearby, but when you move away from home or
    outgrow your old friends, you have to find your people. And it''s so hard. It
    takes years. You have to actively go out and get them. You''ll need them for life
    gets dark or one of your loved ones has just gone into the operating room for
    major surgery and you''re standing in the hospital corridor, scared out of your
    mind and you really, really need someone to sit beside you. But once you have
    these friends, you get to keep them. Even if they move to, say, Paris or Portland,
    they''re still yours. And everyone gets lonely. Everyone I met talked about it.
    It sneaks up on you, especially if you don''t protect yourself from it.'
