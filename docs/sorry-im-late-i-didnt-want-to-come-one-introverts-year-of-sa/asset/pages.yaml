  md: 'I don''t think Chris is an outlier. Research suggests that men are significantly
    lonelier than women. That one-third of men feel lonely regularly. **When I discover**
    that one in eight men report that they have no one to discuss serious topics with,
    my encounters make a lot more sense.


    A few days after dinner, I catch up with my new friend Paul over coffee. He is
