  md: 'And once I realized that, a small voice inside me said, “Screw this bullshit."
    I''d been using the introvert label as an excuse to hide from the world.


    Up until that point, I''d been clinging to my shintrovert status, and it had made
    it almost impossible for me to have those things I secretly longed for: a career
    I cared about, new meaningful relationships, filled-with-laughter friendships,
    and experiences that I hadn''t planned out in excruciating detail.


    I was an introvert in a hole, not in a hole *because* I was an introvert. There
    are plenty of happy introverts who are living their best lives, but I wanted to
    emerge from that hole—I believed a larger life than the one I currently had ultimately
    make happier.


    But to do that? Something had to change.


    Question: What would happen if a shy introvert lived like a gregarious extrovert
    for one year? If she knowingly and willingly put herself in perilous social situations
    that she''d normally avoid at all costs?


    Would it offer up a world of life-changing experiences?


    Or would she wind up in the woods, eating weeds and communing only with wolves
    until she died of malnutrition, but kind of happy that she never had to engage
    in small talk Bitcoin ever again?


    Here goes nothing.


    +   1. For more on this, please see *A Note on Introversion and Methodology.*'
