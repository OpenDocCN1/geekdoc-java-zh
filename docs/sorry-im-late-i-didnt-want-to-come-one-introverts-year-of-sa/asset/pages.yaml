    You will meet one person who is very nice but with whom you have absolutely nothing
    in common. You exchange numbers you have no intention of using, and then they
    will say something like, “I think we’re supposed to circulate,” and walk away.
    You’ll think, “OK, that’s literally a line in Bridge Jones,” and you’ll be simultaneously
    relieved and slightly wounded by this cut from someone you don’t know or particularly
