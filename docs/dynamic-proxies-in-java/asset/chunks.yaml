    ```\n\nListing 3.10: What the `$Proxy0` class looks like.\n\nAs we can see, the\
    \ dynamic proxy is not magic.\n\n## Turbo-boosting reflection methods\n\nOne of\
    \ the parameters passed into the `invoke()` method of the `InvocationHandler`\
    \ is the `Method` that was called. We often need to invoke this `Method` using\
    \ reflection, and want this to be as fast as possible. Since the proxy implements\
    \ public methods, we also know that any `Method` field stored inside the dynamic\
    \ proxy classes is also public. Public methods are accessible, but unfortunately\
    \ reflection suffers from amnesia. Every time we call `invoke()` on the `Method`\
    \ object, it checks from the stack who the calling class is and whether it has\
    \ the correct permissions. We can turn this check off by calling `setAccessible(true)`\
    \ on each of the `Method` fields. This reduces the overhead of method calls when\
    \ using reflection.\n\nFor example, here is our `MethodTurboBooster`. If, for\
    \ some reason, we get an exception, we return the proxy object unchanged. Turbo-boosting\
    \ is on by default, but we can disable it with `-Deu.javaspecialists.books.dynamicproxies.util.MethodTurboBooster.disabled=true`.\n\
    \n```java\n//:~ core/src/main/.../util/MethodTurboBooster.java\n/**\n * Method\
    \ turbo boosting is enabled by default.  We call\n * setAccessible(true) on Method\
    \ objects. Exceptions are silently\n * ignored.\n * <p>\n * Method turbo boosting\
    \ can be disabled with\n * -Deu.javaspecialists.books.dynamicproxies.util.\\\n\
    \ * MethodTurboBooster.disabled=true\n */\npublic final class MethodTurboBooster\
    \ {\n  private final static Booster BOOSTER =\n      Boolean.getBoolean(\n   \
    \       MethodTurboBooster.class.getName() + \".disabled\") ?\n          new BoosterOff()\
    \ : new BoosterOn();\n\n  public static <E> E boost(E proxy) {\n    return BOOSTER.turboBoost(proxy);\n\
    \  }\n\n  public static Method boost(Method method) {\n    return BOOSTER.turboBoost(method);\n\
    \  }\n\n  private interface Booster {\n    <E> E turboBoost(E proxy);\n    Method\
    \ turboBoost(Method method);\n  }\n\n  private static class BoosterOn implements\
    \ Booster {\n    @Override\n    public <E> E turboBoost(E proxy) {\n      if (!(proxy\
    \ instanceof Proxy))\n        throw new IllegalArgumentException(\n          \
    \  \"Can only turboboost instances of Proxy\"\n        );\n      try {\n     \
    \   for (var field : proxy.getClass().getDeclaredFields()) {\n          if (field.getType()\
    \ == Method.class) {\n            field.setAccessible(true);\n            turboBoost((Method)\
    \ field.get(null));\n          }\n        }\n        return proxy;\n      } catch\
    \ (IllegalAccessException | RuntimeException e) {\n        // could not turbo-boost\
    \ - return proxy unchanged;\n        return proxy;\n      }\n    }\n    @Override\n\
    \    public Method turboBoost(Method method) {\n      try {\n        method.setAccessible(true);\n\
    \      } catch (RuntimeException e) {\n        // could not turbo-boost - return\
    \ method unchanged;\n      }\n      return method;\n    }\n  }\n\n  private static\
    \ class BoosterOff implements Booster {\n    @Override\n    public <E> E turboBoost(E\
    \ proxy) {\n      if (!(proxy instanceof Proxy))\n        throw new IllegalArgumentException(\n\
    \            \"Can only turboboost instances of Proxy\"\n        );\n      return\
    \ proxy;\n    }\n    @Override\n    public Method turboBoost(Method method) {\n\
    \      return method;\n    }\n  }\n}\n```\n\nListing 3.11: `MethodTurboBooster`.\n\
    \n## Unwrapping the `InvocationTargetException`\n\n`InvocationHandler.invoke()`\
    \ declares that it throws `Throwable`, but, as we saw in the `$Proxy0` class,\
    \ any unexpected exception is wrapped in an `UndeclaredThrowableException`. Consider\
    \ the code in Listing 3.12\\. On careful inspection of the code, we see that we\
    \ are reversing the comparison in our reflective call `method.invoke()`. Thus,\
    \ we are comparing `String` to our proxy, which should result in a `ClassCastException`.\n\
    \n```java\n//:~ core/src/main/.../ch03/gotchas/RecastingBroken.java\nComparable<String>\
    \ comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n        Comparable.class.getClassLoader(),\n\
    \        new Class<?>[] {Comparable.class},\n        (proxy, method, params) ->\n\
    \            method.invoke(params[0], proxy));\nSystem.out.println(comp.compareTo(\"\
    hello\"));\n```\n\nListing 3.12: `RecastingBroken`.\n\nWhen we run this code,\
    \ we instead see three exceptions chained together.\n\n```\nException in thread\
    \ \"main\" java.lang.reflect.UndeclaredThrowableException\n\tat com.sun.proxy.$Proxy0.compareTo(Unknown\
    \ Source)\n\tat ...ch03.gotchas.RecastingBroken.main\nCaused by: java.lang.reflect.InvocationTargetException\n\
    \tat ...\n\tat ...ch03.gotchas.RecastingBroken.lambda$main$0\nCaused by: java.lang.ClassCastException:\
    \ class com.sun.proxy.$Proxy0\n     cannot be cast to class java.lang.String\n\
    ```\n\nListing 3.13: Output from `RecastingBroken`.\n\nIf we had thrown `ClassCastException`\
    \ directly, since that is a `RuntimeException`, our proxy code would have passed\
    \ it on to the caller. Thus, if we use reflection inside our `InvocationHandler.handle()`\
    \ method, we need to throw the exception contained inside the `InvocationTargetException`.\
    \ To make this easier, we wrote an `ExceptionUnwrappingInvocationHandler` in Listing\
    \ 3.14.\n"
