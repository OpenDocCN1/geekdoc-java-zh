  trans: "\n\n在 [The Java Specialists' Newsletter 274](https://www.javaspecialists.eu/archive/Issue274.html)\
    \ 中，我们读到如何手工构建一个 `EnhancedStream` 装饰器。这是非常单调且重复的工作。我们必须实现所有方法并费力地对它们进行委托。我们的动态代理解决方案只有一个方法\
    \ `invoke()`，其中包含了针对三种不同类型方法的逻辑。\n\n我们的动态代理方法也存在一些缺点。对于某些被代理的方法，可能会有轻微的方法调用开销。例如，每当我们的返回类型为\
    \ `EnhancedStream` 时，都需要进行一次 map 查找。我们将在下一章中学习如何使用一种特殊的 map（我们称之为 `VTable`）来提高速度。现在，我们可以沉浸在避免了反复重复编写相同代码段的满足感中。\n\
    \n## 动态代理的局限性\n\n### 请仅限接口\n\n最大的限制之一是，我们只能代理接口，因为它们派生自 `java.lang.reflect.Proxy`。Java\
    \ 不支持多类继承。\n\n当类由我们自己时，我们可以尝试将类重构为接口。但当我们尝试代理第三方类时，这将无济于。\n\n像 `CGLib` 这样的工具可以创建类的动态代理，但它们并不是标准\
    \ JDK 的。\n\n### `UndeclaredThrowableException`\n\n虽然 `invoke` 方法定义为抛出任何 `Throwable`，但我们允许抛出在代理方法中声明的检查异常（checked\
    \ exceptions）。\n\n```java\n//:~ core/src/main/.../ch03/gotchas/UndeclaredExceptionThrown.java\n\
    public class UndeclaredExceptionThrown {\n  public static void main(String...\
    \ args) {\n    Runnable job = Proxies.castProxy(\n        Runnable.class,\n  \
    \      (proxy, method, params) -> {\n          // 将封装为 UndeclaredThrowableException\n\
    \          throw new IOException(\"bad exception\");\n        });\n    job.run();\n\
    \  }\n}\n```\n\nListing 3.35: `UndeclaredExceptionThrown`。\n\n当我们在 `Runnable`\
    \ 上调用 `run()` 时，检查异常 `IOException` 被包装在未检查异常 `UndeclaredThrowableException` 中。这仅适用于不属于代理接口方法签的检查异常。\n\
    \n```text\nException in \"main\" java.lang.reflect.UndeclaredThrowableException\n\
    \tat com.sun.proxy.$Proxy0.run(Unknown Source)\n\tat UndeclaredExceptionThrown.main()\n\
    Caused by: java.io.IOException: bad exception\n\tat UndeclaredExceptionThrown.lambda$main$0()\n\
    \t... 2 more\n```\n\nListing 3.36: 异常导致了未检查的 `UndeclaredThrowableException`。\n\
    \n### 神秘的 `com.sun.proxy.Proxy$0` 类\n\n如所述，代理类的名称通常遵循命名约定：公共接口使用 `com.sun.proxy.Proxy$0`，包级访问访问接口使用\
    \ `packagename.Proxy$0`。当接口未从模块中导出时，代理位于一个非导出的包中：例如 `com.sun.proxy.jdk.proxy1`。\n\
    \n```java\n//:~ core/src/main/.../ch03/gotchas/ProxyNaming.java\npublic class\
    \ ProxyNaming {\n  public interface PublicNotExported {\n    void open();\n  }\n\
    \  interface Hidden {\n    void mystery();\n  }\n  public static void main(String...\
    \ args) {\n    show(BaseComponent.class); // 从模块导出\n    show(PublicNotExported.class);\n\
    \    show(Hidden.class);\n  }\n  private static void show(Class<?> intf) {\n \
    \   System.out.println(Proxies.simpleProxy(\n        intf, null).getClass());\n\
    \  }\n}\n```\n\nListing 3.37: `ProxyNaming`。\n\n输出很可能是我们在 Listing 3.38 中看到的。\n\
    \n```text\nclass com.sun.proxy.$Proxy0\nclass com.sun.proxy.jdk.proxy1.$Proxy1\n\
    class eu.javaspecialists.books.dynamicproxies.ch03.gotchas.$Proxy2\n```\n\nListing\
    \ 3.38: `ProxyNaming` 的输出。\n\nJava 语言规范并没有规定代理必须遵循此命名约定，但这是 OpenJDK 目前的实现方式。请注意，当我们为公共接口创建代理时，这些类会被添加到\
    \ `com.sun.proxy` 包中。然而，当我们为非公共接口创建代理时，类必须与接口处于同一个包中——在我们的示例中，是 `eu.javaspecialists.books.dynamicproxies.ch03`。\n\
    \n### 更深的调用栈\n\n我们的调用栈也可能包含对 `$Proxy0` 和反射方法调用的引用。像 [IntelliJ IDEA](https://www.jetbrains.com/idea/)\
    \ 这样的 IDE 可能会隐藏这些细节，如图 9 所示。\n\n![StackTraceFiltering](img/StackTraceFiltering.png)\n\
    \n图 9: 代理方法调用的堆栈跟踪。\n\n这是一个使用递归动态代理计算阶的示例。在德语中，我们将这个例子称为 *“an den Haaren herbeigezogen”*，意思是我们是揪着头发把它拉过来的。换句话说，这是一种编写阶代码代码极不实际的方法，仅用于说明递归动态代理调用可能是什么样子。请不要写这样的代码！\n\
    \n```java\n//:~ core/src/main/.../ch03/gotchas/RecursiveDynamicProxy.java\n/**\n\
    \ * 展示递归调用的荒谬示例。\n * 请不要写这样的代码！\n */\npublic class RecursiveDynamicProxy {\n \
    \ public static void main(String... args) {\n    IntFunction<BigInteger> factorial\
    \ =\n        Proxies.castProxy(IntFunction.class,\n            new Factorial());\n\
    \    System.out.println(factorial.apply(5));\n  }\n\n  private static class Factorial\
    \ implements InvocationHandler {\n    private final MethodKey apply =\n      \
    \  MethodKey(IntFunction.class, \"apply\");\n\n    @Override\n    public Object\
    \ invoke(Object proxy, Method method, Object[] params) throws Throwable {\n  \
    \    if (new MethodKey(method).equals(apply)) {\n        int n = (int) params[0];\n\
    \        if (n == 0) {\n          Thread.dumpStack();\n          return BigInteger.ONE;\n\
    \        }\n        BigInteger other = (BigInteger) method.invoke(\n         \
    \   proxy, n - 1);\n        return BigInteger.valueOf(n).multiply(other);\n  \
    \    } else {\n        throw new UnsupportedOperationException(\n            \"\
    only apply(int) supported\");\n      }\n    }\n  }\n}\n```\n\nListing 3.39: `RecursiveDynamicProxy`。\n\
    \n输出类似于 3.40。为了适应输出，省略了堆栈跟踪的某些细节。\n\n```text\njava.lang.Exception: Stack trace\n\
    \    at java.base/Thread.dumpStack()\n    at RecursiveDynamicProxy$Factorial.invoke()\n\
    \    at com.sun.proxy.$Proxy0.apply(Unknown Source)\n    at java.base/NativeMethodAccessor.invoke0()\n\
    \    at java.base/NativeMethodAccessor.invoke()\n    at java.base/DelegatingMethodAccessor.invoke()\n\
    \    at java.base/Method.invoke()\n    at RecursiveDynamicProxy$Factorial.invoke()\n\
    \    at com.sun.proxy.$Proxy0.apply(Unknown Source)\n    at java.base/NativeMethodAccessor.invoke0()\n\
    \    at java.base/NativeMethodAccessor.invoke()\n    at java.base/DelegatingMethodAccessor.invoke()\n\
    \    at java.base/Method.invoke()\netc.\n```\n\nListing 3.40: 得益于动态代理和反射的深层调用栈。\n\
    \n调用栈中的额外的行可能只会造成轻小的困扰。如果它们导致了 `StackOverflowError`，那么在那种情况下，避免使用代理或通过 JVM 参数\
    \ `-Xss` 增加线程栈的大小是合适的。\n\n#### 泄露的抽象\n\n动态代理目前被视为普通的 Java 类，尽管是动态创建的。这使得基础设施代码泄露给了用户。如果能够从用户处隐藏这些类将会更好。\n\
    \n"
- fmt: "\nAt time of writing, [JEP 371](https://openjdk.java.net/jeps/371) is targeted\
    \ for Java 15 and proposes to add `hidden classes`. These are classes that cannot\
    \ be used directly by the bytecode of other classes, but rather, would be accessed\
    \ by framework code via reflection.\n\n`hidden classes` have many benefits: Their\
    \ methods do not appear in stack traces. It is easier to unload them. Access control\
    \ is more fine grained and strict.\n\n### Shared proxy classes\n\nJava tries to\
    \ minimize the number of dynamic proxy classes it creates. Each time we call `Proxy.newProxyInstance()`,\
    \ it checks whether it has previously created a dynamic proxy for the given combination\
    \ of class loader and target interface. The order in which the interfaces are\
    \ stored inside the array is significant. If a dynamic proxy class is found, then\
    \ that is used to create the proxy object. The `InvocationHandler` is always passed\
    \ to the `java.lang.reflect.Proxy` superclass from which all dynamic proxy classes\
    \ are derived.\n\nFor example, consider `ProxyClassesByInterface` in Listing 3.41.\
    \ `Collection` extends `Iterable`, so we could consider a proxy consisting of\
    \ a combination of `Collection` and `Iterable` to be equivalent to a proxy of\
    \ only `Collection`. However, we see that for every interface combination, unique\
    \ proxy classes are created.\n\n```\n//:~ core/src/main/.../ch03/gotchas/ProxyClassesByInterface.java\n\
    public class ProxyClassesByInterface {\n  static final InvocationHandler BLANK\
    \ = (p, m, a) -> null;\n  public static void main(String... args) {\n    test(Iterable.class,\
    \ Collection.class); // $Proxy0\n    test(Iterable.class, Collection.class); //\
    \ $Proxy0\n    test(Iterable.class); // $Proxy1\n    test(Collection.class); //\
    \ $Proxy2\n    test(Collection.class, Iterable.class); // $Proxy3\n    test(Iterable.class,\
    \ Collection.class); // $Proxy0\n  }\n  private static void test(Class<?>... targetInterfaces)\
    \ {\n    Object proxy = Proxy.newProxyInstance(\n        ProxyClassesByInterface.class.getClassLoader(),\n\
    \        targetInterfaces,\n        BLANK\n    );\n    System.out.println(proxy.getClass());\n\
    \  }\n}\n```\n\nListing 3.41: `ProxyClassesByInterface`.\n\nJava uses weak references\
    \ in its cache of dynamic proxy classes to ensure that we do not get class-loader\
    \ leaks.\n\n### Performance of dynamic proxies\n\nDynamic proxies belong in the\
    \ realm of infrastructure and framework code. It is highly likely that our dynamic\
    \ code will be called billions of times. It is thus essential for us to know how\
    \ to benchmark this type of code and to make sure it runs quickly enough.\n\n\
    Calling methods on a dynamic proxy may be slower for several reasons:\n\n*   Primitive\
    \ return types and parameters need to be boxed to their wrapper objects. This\
    \ might add object-creation overhead when primitive values are outside of their\
    \ cached range.\n*   Parameters need to be wrapped with an array. This array might\
    \ not be eliminated with escape analysis if it escapes from the `InvocationHandler.invoke()`\
    \ method.\n*   The `Method` class suffers from amnesia — it checks permission\
    \ on every call. We try to eliminate this cost with the turbo-boost mechanism\
    \ shown in Listing 3.11.\n*   All dynamic proxies are derived from a single `java.lang.reflect.Proxy`\
    \ class, which stores the reference to our `InvocationHandler`. When a field only\
    \ ever holds one implementation of an interface, the call sites that invoke methods\
    \ on that field’s value are monomorphic, as opposed to polymorphic. The HotSpot\
    \ compiler has optimizations for monomorphism and bimorphism. For monomorphism,\
    \ the compiler can inline the method call at run time. However, since a dynamic\
    \ proxy can hold one of many implementations of `InvocationHandler`, HotSpot might\
    \ not be able to inline the method call to `invoke()`, thus making it megamorphic.\
    \ For more information about polymorphism performance, please see [“Polymorphism\
    \ Performance Mysteries”](https://www.javaspecialists.eu/archive/Issue157.html)\
    \ and [“Polymorphism Performance Mysteries Explained”](https://www.javaspecialists.eu/archive/Issue158.html)\
    \ in [The Java Specialists' Newsletter](https://www.javaspecialists.eu/).\n\n\
    Programmers wishing to write performance-critical code need to know how to benchmark\
    \ code. The recommended tool for running benchmarks is the [Java Microbenchmark\
    \ Harness](https://openjdk.java.net/projects/code-tools/jmh/) (JMH).\n\nFor our\
    \ experiment, we define a `Worker` interface with a two methods: `increment()`\
    \ and `consumeCPU()`. The `increment()` method returns a `long`, which will be\
    \ converted to a `Long` object through autoboxing. The `consumeCPU()` method returns\
    \ `void`, thus no objects will need to be created.\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/Worker.java\n\
    public interface Worker {\n  long increment();\n  void consumeCPU();\n}\n```\n\
    \nListing 3.42: `Worker`.\n\nOur `RealWorker` implements `Worker`. In the `increment()`\
    \ method, it increments a field of type `long` and returns the new value. In the\
    \ `consumeCPU()` method, it uses the JMH `Blackhole` class to use up a couple\
    \ of CPU cycles.\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/RealWorker.java\n\
    public class RealWorker implements Worker {\n  private long counter = 0;\n  @Override\n\
    \  public long increment() {\n    return counter++;\n  }\n  @Override\n  public\
    \ void consumeCPU() {\n    Blackhole.consumeCPU(2);\n  }\n}\n```\n\nListing 3.43:\
    \ `RealWorker`.\n\nOur `ProxyWorker` follows the proxy pattern and points to the\
    \ `RealWorker`.\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/ProxyWorker.java\n\
    public class ProxyWorker implements Worker {\n  private final RealWorker worker\
    \ = new RealWorker();\n  @Override\n  public long increment() {\n    return worker.increment();\n\
    \  }\n  @Override\n  public void consumeCPU() {\n    worker.consumeCPU();\n  }\n\
    }\n```\n\nListing 3.44: `ProxyWorker`.\n\nIn our `MethodCallBenchmark`, we have\
    \ five ways of calling `increment()` and `consumeCPU()`:\n\n*   `directCall` calls\
    \ the methods directly on the `RealWorker` instance.\n*   `staticProxy` calls\
    \ the methods on the `ProxyWorker` instance, which then delegates the calls to\
    \ the `RealWorker`.\n*   `dynamicProxyThenDirectCall` creates a dynamic proxy\
    \ of `Worker`, but delegates the calls directly to the `RealWorker` methods.\n\
    *   `dynamicProxyThenReflectiveCall` (turbo) is our dynamic proxy of `Worker`,\
    \ which delegates the methods to the `RealWorker` instance using a reflective\
    \ call with the given `method` parameter. The dynamic proxy instance is turbo-boosted.\n\
    *   `dynamicProxyThenReflectiveCall` (no turbo) is the same as the previous, except\
    \ without turbo-boosting.\n"
