    Our `CompositeHandler` constructor takes as parameters the component type, which
    must be derived from `BaseComponent`. The `reducers` parameter contains the logic
    for how to merge the results from the method call. In streams, we can reduce all
    elements into another object. This is similar. Our `Reducer` contains a `BinaryOperator<T>`,
    which is derived from `BiFunction<T,T,T>`. We will see more detail a bit later.
    The last parameter is `typeChecks`. These are interfaces or classes that parameters
    of the `add()` method must extend. We will see examples later.


    The `CompositeHandler` has a `VTable` of default interface methods, called `defaultVT`.
    If a default method exists, we first call that before calling the children methods,
    merging all the results together with the relevant reducer.


    The `invoke()` method checks whether the method name is `"add"` or `"remove"`,
    with `Object.class` as the single parameter type, in which case it calls the relevant
    `add()` or `remove()` method on its list of children. The method `add()` needs
    a bit of explanation. We first check that the parameter is of the correct type,
    meaning that it is an instance of all the types in our `typeChecks` array. While
    these would typically be interfaces, Java does not have multiple inheritance of
    classes so one of them could also be a class. For each type of child, we also
    need to find matching methods that we can call, based on the methods in our `component`
    interface. This is necessary to support a heterogenous hierarchy of components.


    All methods besides `"add"` and `"remove"` are managed via a map and reduce on
    the stream of children. `map()` invokes the desired method on each child and `reduce()`
    merges the results.


    Unfortunately, lambdas do not play nice with checked exceptions, so we define
    an `UncheckedException` class inside the method. Yes, that is possible and has
    the advantage of being invisible outside of that one method. We later unwrap the
    exception again and throw it from our `invoke()` method. We fail on the first
    exception that we encounter. Since the `UncheckedException` is method-private,
    we erase the stack trace by returning `null` from the `fillInStackTrace()` method.


    We will look at `Reducer` in a bit. For now, it is enough to know that there are
    two special types of `Reducer`: the `NULL_REDUCER` and the `PROXY_INSTANCE_REDUCER`.
    The `NULL_REDUCER` is suitable for methods that return `void`. The `PROXY_INSTANCE_REDUCER`
    is a special marker for methods that return `this` — in our case, `proxy`.

