  trans: "\n为了实现这种透明性，让我们首先完善代理的 `equals()` 方法。请注意，委托给 `map` 与我们之前编写代理方法的方法一致。\n\n\
    ```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInHandCraftedProxy.java\n\
    @Override\npublic boolean equals(Object o) {\n  return map.equals(o);\n}\n@Override\n\
    public int hashCode() {\n  return map.hashCode();\n}\n```\n\n列表 2.24：一致的代理 `equals()`\
    \ 方法。\n\n`CustomHashMap` 需要更多的一些工作。\n\n1.  我们确保参数是 `CustomMap` 的实例。当参数为 `null`\
    \ 或不是 `CustomMap` 的其他对象时，它将返回 `false`。\n\n2.  我们检查参数的类是否为 `CustomHashMap`。如果是同一个类，则进行向下类型转换并比较两个\
    \ `map` 字段。最佳实践是将 `CustomHashMap` 中的 `equals()` 方法标记为 `final`，以防止意外的重写，因为这会导致非对称的\
    \ `equals()` 方法。由于 `hashCode()` 需要与 `equals()` 配对使用，我们也将其标记为 `final`。\n\n3.  否则，我们返回反转\
    \ `equals` 条件的结果，即 `o.equals(this)`。如果不反转，我们将陷入无限循环。由于 `equals()` 要求具有对称性，`o.equals(this)`\
    \ 的结果必须与 `this.equals(o)` 相同。\n\n```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInCustomHashMap.java\n\
    @Override\npublic final boolean equals(Object o) {\n  if (this == o) return true;\n\
    \  if (!(o instanceof CustomMap)) return false;\n\n  if (o instanceof CustomHashMap)\
    \ {\n    CustomHashMap<?, ?> that = (CustomHashMap<?, ?>) o;\n    return this.map.equals(that.map);\n\
    \  }\n  return o.equals(this); // 反转 equals() 条件\n}\n@Override\npublic final int\
    \ hashCode() {\n  return map.hashCode();\n}\n```\n\n列表 2.25：正确的 `CustomHashMap.equals()`。\n\
    \n我们在 `CustomMapEqualsTest` 中看到了 `equals()` 方法的实际应用。要查看更完整的测试集，请访问 [github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples/tree/master/core/src/test/java/eu/javaspecialists/books/dynamicproxies/ch02/equals).\n\
    \n```java\n//:~ core/src/test/.../ch02/equals/CustomMapEqualsTest.java\npublic\
    \ class CustomMapEqualsTest {\n  @Test\n  public void testEqualsContract() {\n\
    \    var real = new CustomHashMap<Integer, Integer>();\n    for (int i = 0; i\
    \ < 10; i++) real.put(i, i * i);\n    var proxy1 = new UnmodifiableCustomMap<>(real);\n\
    \    var proxy2 = new UnmodifiableCustomMap<>(real);\n    var empty = new CustomHashMap<Integer,\
    \ Integer>();\n\n    // 自反性\n    assertEquals(real, real);\n    assertEquals(proxy1,\
    \ proxy1);\n    assertEquals(proxy2, proxy2);\n\n    // 对称性\n    assertEquals(real,\
    \ proxy1);\n    assertEquals(proxy1, real);\n    assertEquals(proxy1, proxy2);\n\
    \    assertEquals(proxy2, proxy1);\n\n    // 传递性\n    if (real.equals(empty) &&\
    \ empty.equals(proxy2))\n      assertEquals(real, proxy2);\n    if (real.equals(proxy1)\
    \ && proxy1.equals(proxy2))\n      assertEquals(real, proxy2);\n  }\n}\n```\n\n\
    列表 2.26：`equals()` 示例。\n\n搞定！我们有了一个满足所有上述要求的 `equals()` 方法，并允许我们的真实主体变得“可代理”。它具有自反性、对称性和传递性。此外，如果我们将对象与它的代理进行比较，我们将得到预期的结果\
    \ `true`。\n\n# 动态代理\n\n到为止，我们都是通过手工编写代理类。当每种代理在结构和功能上都是唯一的时，手工编写是有意义的。然而，大多数代理实现都是相似的。例如，远程代理必须在参数和返回值之间进行传递。Java\
    \ RMI 以存根（stubs）和骨架（skeletons）的形式为远程代理生成胶代码。IDE 会为我们生成委托模板代码，但我们仍然需要阅读所有这些代码来理解它们在做什么。\n\
    \n代码生成可以是静态的或动态的。静态生成不太方便，因为它需要额外的构建步骤。动态生成在运行时创建一个新的代理类。它非常方便且灵活。在本章中，我们将学习 Java\
    \ 中动态代理是如何工作的。\n\n## `Proxy.newProxyInstance()`\n\n我们使用静态工厂方法 `newProxyInstance()`\
    \ 通过以下三个参数来构造动态代理：\n\n*   `ClassLoader loader` 是加载我们新代理类的地方。`ClassLoader` 需要能够看到我们想要实现的接口。例如，引导程序类加载器知道\
    \ Java 接口（`java.lang.Runnable`、`java.util.Collection` 等），但不知道应用程序接口。我们的类是使用系统类加载器（也称为\
    \ `AppClassLoader`）加载的。\n\n*   `Class<?>[] interfaces` 是一个包含代理对象需要实现的所有接口的数组。\n\
    \n*   `InvocationHandler` 是一个函数接口，每当调用任何方法时都会被调用。\n\n### `InvocationHandler`\n\
    \n在代理对象上调用的任何方法都会派发到 `InvocationHandler` 的 `invoke()` 方法。\n\n```java\n//:~ core/src/main/.../ch03/InvocationHandlerDeclaration.java\n\
    public interface InvocationHandler {\n  public Object invoke(Object proxy,\n \
    \                      Method method,\n                       Object[] args) throws\
    \ Throwable;\n}\n```\n\n列表 3.4：`InvocationHandler`。\n\n`invoke()` 方法有三个参数：\n"
- fmt: "\n- `Object proxy` is the instance of the dynamic proxy class that is calling\
    \ `invoke()`.  We will use this in a later chapter.\n- `Method method` is a `java.lang.reflect.Method`\
    \ object for the method that was called. The method comes from either one of the\
    \ interfaces used to create the dynamic proxy or one of the three public non-final\
    \ methods from `Object`, that is `hashCode()`, `equals(Object)`, or `toString()`.\n\
    - `Object[] args` is an array of the parameters passed into the method. This will\
    \ be `null` when the method does not have any parameters.\n\nThe `invoke()` method\
    \ declares that it throws `Throwable`. However, methods should only throw those\
    \ checked exceptions that are declared in their signature. This is another example\
    \ of how dynamic proxies are dynamic — the static type system says `Throwable`,\
    \ but there are dynamic constraints on which exceptions they can throw.\n\n###\
    \ `LoggingInvocationHandler`\n\nLet us have a look at how to create our own `InvocationHandler`.\
    \ In our `LoggingInvocationHandler`, we log method calls and how long they take.\
    \ We assume that `Object obj` implements the same interfaces as the dynamic proxy.\
    \ We thus delegate the method call to `obj` with `return method.invoke(obj, args)`,\
    \ surrounding this with our logging code.\n\nMost of the code is self-explanatory,\
    \ except for the `logFine` optimization. `System.nanoTime()` is an expensive system\
    \ call and we want to avoid calling it except when fine logging is enabled. Since\
    \ the level may change during our call to `method.invoke()`, we write the original\
    \ setting into a `final` local variable `logFine`. Once again, `method.invoke()`\
    \ is an example of how dynamic proxies are dynamic — we often delegate to underlying\
    \ functionality, and we do so via reflection.\n\n```\n//:~ core/src/main/.../handlers/LoggingInvocationHandler.java\n\
    public final class LoggingInvocationHandler\n    implements InvocationHandler\
    \ {\n  private final Logger log;\n  private final Object obj;\n  public LoggingInvocationHandler(Logger\
    \ log, Object obj) {\n    this.log = log;\n    this.obj = obj;\n  }\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    log.info(() -> \"Entering \" + toString(method,\
    \ args));\n    // optimization - nanoTime() is an expensive native call\n    final\
    \ boolean logFine = log.isLoggable(Level.FINE);\n    long start = logFine ? System.nanoTime()\
    \ : 0;\n    try {\n      return method.invoke(obj, args);\n    } finally {\n \
    \     long nanos = logFine ? System.nanoTime() - start : 0;\n      log.info(()\
    \ -> \"Exiting \" + toString(method, args));\n      if (logFine) log.fine(() ->\
    \ \"Time \" + nanos + \"ns\");\n    }\n  }\n  private String toString(Method method,\
    \ Object[] args) {\n    return String.format(\"%s.%s(%s)\",\n        method.getDeclaringClass().getCanonicalName(),\n\
    \        method.getName(),\n        args == null ? \"\" :\n            Stream.of(args).map(String::valueOf)\n\
    \                .collect(Collectors.joining(\", \")));\n  }\n}\n```\nListing\
    \ 3.5: `LoggingInvocationHandler`.\n\nIn our `LoggingProxyDemo` in Listing 3.6,\
    \ we create a `LoggingInvocationHandler` that logs all method calls to a `ConcurrentHashMap`.\n\
    \nWe then create a dynamic proxy with a call to `Proxy.newProxyInstance()`, passing\
    \ in the class loader of `Map` (thus the bootstrap class loader), an array containing\
    \ the `Map` interface, and our instance of `LoggingInvocationHandler`.\n\nThe\
    \ result from the `newProxyInstance()` call is of type `Object`, which we need\
    \ to manually cast to the correct type, in our case `Map<String, Integer>`. This\
    \ is an example of how dynamic proxies are dynamic — the static type system says\
    \ `Object`, but the dynamic type is narrower.\n\nA dynamic proxy may implement\
    \ a lot of interfaces, so it would not be clear which one we would want to cast\
    \ to.\n\nOnce we have our dynamic proxy object cast to `Map`, all the methods\
    \ we call on it are logged, together with their execution time.\n\n```\n//:~ core/src/main/.../ch03/logging/LoggingProxyDemo.java\n\
    var handler = new LoggingInvocationHandler(\n    Logger.getGlobal(), new ConcurrentHashMap<>());\n\
    @SuppressWarnings(\"unchecked\")\nvar map = (Map<String, Integer>)\n         \
    \     Proxy.newProxyInstance(\n                  Map.class.getClassLoader(),\n\
    \                  new Class<?>[] {Map.class},\n                  handler);\n\
    map.put(\"one\", 1);\nmap.put(\"two\", 2);\nSystem.out.println(map);\nmap.clear();\n\
    ```\nListing 3.6: Logging methods of a map.\n\n## Name of dynamic class\n\nWhat\
    \ is the class name of the dynamic proxy? For example, consider the `ISODateParser`\
    \ interface in Listing 3.7, which parses dates of the format `yyyy-MM-dd`. This\
    \ equates to the `Subject` interface in Figure 7.\n\n```\n//:~ core/src/main/.../ch03/ISODateParser.java\n\
    /**\n * Parses String of the format yyyy-MM-dd and returns LocalDate.\n */\npublic\
    \ interface ISODateParser {\n  LocalDate parse(String date) throws ParseException;\n\
    }\n```\nListing 3.7: `ISODateParser` interface.\n\nWe create a dynamic proxy and\
    \ print the class name to `System.out`.\n\n```\n//:~ core/src/main/.../ch03/ProxyName.java\n\
    public class ProxyName {\n  public static void main(String... args) {\n    System.out.println(\n\
    \        Proxy.newProxyInstance(\n            ISODateParser.class.getClassLoader(),\n\
    \            new Class<?>[] {ISODateParser.class},\n            (proxy, method,\
    \ arguments) -> null\n        ).getClass()\n    );\n  }\n}\n```\nListing 3.8:\
    \ `ProxyName`.\n\nThe output shows the class name as `com.sun.proxy.$Proxy0`.\n\
    \n```\nclass com.sun.proxy.$Proxy0\n```\nListing 3.9: `ProxyName` output.\n\n\
    Dynamic proxies are normally called `$Proxy` followed by a number. When all the\
    \ interfaces are public, the package will typically be `com.sun.proxy`, but it\
    \ could be another package on your operating system and JDK. The class name and\
    \ package could change from version to version or even from run to run. The package\
    \ name is different when we create a dynamic proxy from a non-exported package\
    \ inside a module. When at least one of the interfaces is non-public, the proxy\
    \ class is in the same package as that interface. It is not possible to create\
    \ a dynamic proxy of several non-public interfaces in different packages.\n\n\
    ## Dissecting `$Proxy0`\n\nWe can dump the generated proxy classes to our current\
    \ working directory with the system property `-Djdk.proxy.ProxyGenerator.saveGeneratedFiles=true`\
    \ in Java 9+ (or `-Dsun.misc.ProxyGenerator.saveGeneratedFiles=true` in earlier\
    \ versions of Java).\n\nFor example, Listing 3.10 shows the dynamic proxy generated\
    \ from the `ISODateParser` interface. We can see that `$Proxy0` is derived from\
    \ `java.lang.reflect.Proxy`, which stores the `InvocationHandler` instance `h`.\
    \ The public interface methods, as well as `hashCode()`, `equals()`, and `toString()`\
    \ from `java.lang.Object`, have associated `Method` objects stored in static fields.\
    \ These fields are initialized in the static initializer block when the class\
    \ is loaded. In each method implementation, the proxy instance, the `Method` instance,\
    \ and an array containing the parameters are passed to the `InvocationHandler`.\
    \ For example, see the implementation of `parse(String)`.\n"
