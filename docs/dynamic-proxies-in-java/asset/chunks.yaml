    \ `SynchronizedCustomMap` uses `synchronized` for thread safety.\n\nOur `SynchronizedTest`\
    \ creates a `SynchronizedCustomMap` that proxies the `CustomHashMap` and passes\
    \ that to `ConcurrentTest`.\n\n```\n//:~ core/src/test/.../ch02/protection/SynchronizedTest.java\n\
