    \ is required to be symmetric, the result of `o.equals(this)` has to be the same\
    \ as `this.equals(o)`.\n\n```\n//:~ core/src/main/.../ch02/equals/FixedEqualsInCustomHashMap.java\n\
    @Override\npublic final boolean equals(Object o) {\n  if (this == o) return true;\n\
    \  if (!(o instanceof CustomMap)) return false;\n\n  if (o instanceof CustomHashMap)\
    \ {\n    CustomHashMap<?, ?> that = (CustomHashMap<?, ?>) o;\n    return this.map.equals(that.map);\n\
    \  }\n  return o.equals(this); // reversing the equals() condition\n}\n@Override\n\
    public final int hashCode() {\n  return map.hashCode();\n}\n```\n\nListing 2.25:\
    \ Correct `CustomHashMap.equals()`.\n\nWe see the `equals()` method in action\
    \ in `CustomMapEqualsTest`. For a more complete set of tests, please visit [github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples/tree/master/core/src/test/java/eu/javaspecialists/books/dynamicproxies/ch02/equals).\n\
    \n```\n//:~ core/src/test/.../ch02/equals/CustomMapEqualsTest.java\npublic class\
    \ CustomMapEqualsTest {\n  @Test\n  public void testEqualsContract() {\n    var\
    \ real = new CustomHashMap<Integer, Integer>();\n    for (int i = 0; i < 10; i++)\
    \ real.put(i, i * i);\n    var proxy1 = new UnmodifiableCustomMap<>(real);\n \
    \   var proxy2 = new UnmodifiableCustomMap<>(real);\n    var empty = new CustomHashMap<Integer,\
    \ Integer>();\n\n    // reflexive\n    assertEquals(real, real);\n    assertEquals(proxy1,\
    \ proxy1);\n    assertEquals(proxy2, proxy2);\n\n    // symmetric\n    assertEquals(real,\
    \ proxy1);\n    assertEquals(proxy1, real);\n    assertEquals(proxy1, proxy2);\n\
    \    assertEquals(proxy2, proxy1);\n\n    // transitive\n    if (real.equals(empty)\
    \ && empty.equals(proxy2))\n      assertEquals(real, proxy2);\n    if (real.equals(proxy1)\
    \ && proxy1.equals(proxy2))\n      assertEquals(real, proxy2);\n  }\n}\n```\n\n\
    Listing 2.26: `equals()` example.\n\nVoila! We have an `equals()` that fulfills\
    \ all the requirements described above and has allowed our real subject to be\
    \ “proxiable”. It is reflexive, symmetric, and transitive. Plus, if we compare\
    \ an object to its proxy, we get the desired result of `true`.\n\n# **Dynamic**\
    \ **Proxy**\n\nUntil now, we’ve coded the proxy classes by hand. It makes sense\
    \ to handcraft the code when each type of proxy is unique in structure and function.\
    \ However, the majority of proxy implementations are similar. For example, remote\
    \ proxies all have to shunt parameters and return values back and forth. Java\
    \ RMI generates the glue code for remote proxies in the form of stubs and skeletons.\
    \ IDEs will generate delegation boilerplate for us, but we still have to read\
    \ all that code to understand what it is doing.\n\nCode generation can be either\
    \ static or dynamic. Static is less convenient as it requires an extra build step.\
    \ Dynamic creates a new proxy class at run time. It is super convenient and flexible.\
    \ In this chapter, we will learn how the dynamic proxy works in Java.\n\n## `Proxy.newProxyInstance()`\n\
    \nWe construct dynamic proxies with the static factory method `newProxyInstance()`\
    \ with these three parameters:\n\n*   `ClassLoader loader` is where our new proxy\
    \ class is loaded. The `ClassLoader` needs to be able to see the interfaces that\
    \ we want to implement. For example, the bootstrap class loader knows about the\
    \ Java interfaces (`java.lang.Runnable`, `java.util.Collection`, etc.) but not\
    \ about application interfaces. Our classes are loaded with the system class loader\
    \ (also called `AppClassLoader`).\n\n*   `Class<?>[] interfaces` is an array that\
    \ contains all the interfaces that our proxy object needs to implement.\n\n* \
    \  `InvocationHandler` is a functional interface that is invoked whenever any\
    \ method is called on the proxy object.\n\n### `IllegalArgumentException` abounds\n\
    \n`Proxy` is restrictive about the parameters it will accept in the `newProxyInstance()`\
    \ method. Any incorrect combination is greeted with an `IllegalArgumentException`,\
    \ where the message gives clues about what caused the error. This is an example\
    \ of how dynamic proxies are *dynamic* — the static type system cannot capture\
    \ all the restrictions, so failure to conform results in dynamic errors.\n\nFor\
    \ example, what is wrong with the call to `Proxy.newProxyInstance()` in Listing\
    \ 3.1?\n\n```\n//:~ core/src/test/.../ch03/gotchas/ClassLoaderVisibilityForDynamicProxiesTest.java\n\
    Proxy.newProxyInstance(\n    Map.class.getClassLoader(),\n    new Class<?>[] {CustomMap.class},\n\
    \    (proxy, method, args) -> null\n);\n```\n\nListing 3.1: Incorrect `Proxy.newProxyInstance()`\
    \ call.\n\nWhen we run it, we see the output of Listing 3.2.\n\n```\njava.lang.IllegalArgumentException:\
    \ eu.javaspecia...CustomMap\n    referenced from a method is not visible from\
    \ class loader\n```\n\nListing 3.2: `IllegalArgumentException` from incorrect\
    \ class loader.\n\n`Map.class` is a JDK class, thus loaded by the bootstrap class\
    \ loader, which does not know about our `CustomMap`.\n\nInstead, we should use\
    \ the class loader that loaded our `CustomMap`, in this case the system class\
    \ loader.\n\n```\n//:~ core/src/test/.../ch03/gotchas/ClassLoaderVisibilityForDynamicProxiesTest.java\n\
    Proxy.newProxyInstance(\n    CustomMap.class.getClassLoader(),\n    new Class<?>[]\
    \ {CustomMap.class},\n    (proxy, method, args) -> null\n);\n```\n\nListing 3.3:\
    \ Correct `Proxy.newProxyInstance()` call.\n\nFurther details can be found in\
    \ the [“newProxyInstance”](https://www.javaspecialists.eu/share/Proxy/restrictions/)\
    \ section of the Class Proxy Javadoc documentation.\n\n### Java Platform Module\
    \ System\n\nThe Java Platform Module System (JPMS) also applies to dynamic proxies.\
    \ Proxy classes have the same restrictions as the interfaces that they implement.\
    \ For example, if one of the interfaces is non-public, then the proxy class is\
    \ created in the same package as that interface. Similarly, if one of the proxy\
    \ interfaces is in a package that is non-exported and non-open, then the proxy\
    \ class would also be non-exported and non-open, possibly constructed in a dynamic\
    \ module if all the interfaces are public.\n\nWe can print debug information about\
    \ how the JPMS creates the dynamic proxy with the environment variable `-Djdk.proxy.debug=debug`.\n\
    \nFurther details and rules of using dynamic proxies and JPMS can be read in the\
    \ [“Package and Module Membership of Proxy Class”](https://www.javaspecialists.eu/share/Proxy/membership/)\
    \ section of the Class Proxy Javadoc documentation.\n\n## `InvocationHandler`\n\
    \nAny method called on the proxy object is dispatched to the `invoke()` method\
    \ of the `InvocationHandler`.\n\n```\n//:~ core/src/main/.../ch03/InvocationHandlerDeclaration.java\n\
    public interface InvocationHandler {\n  public Object invoke(Object proxy,\n \
    \                      Method method,\n                       Object[] args) throws\
    \ Throwable;\n}\n```\n\nListing 3.4: `InvocationHandler`.\n\nThe method `invoke()`\
    \ has three parameters:"
