  trans: "\n\n意图：“将一个类的接口转换为客户端期望的另一个接口。适配器允许那些因接口不兼容而无法工作的类共同工作。” (GoF 1994, p. 139)\n\
    \n适配器模式的目标是让对象协同工作，即使它们的接口不兼容。它是模式中的“外交官”。适配器模式既可以实现为使用组合的对象适配器，也可以实现为使用继承的类适配器。\n\
    \n在图 2 中，`Adapter` 实现了 `Target` 接口，并将请求委托给我们想要适配的类，在本例中为 `Adaptee`。由于我们的被适配对象是适配器内部的一个对象，我们称之为“对象适配器”。对象适配器使用组合来适配\
    \ `Adaptee`。\n\n![ObjectAdapterStructure](img/ObjectAdapterStructure.png)\n\n\
    图 2。对象适配器设计模式的结构。\n\nJava 中对象适配器的示例是 `InputStreamReader`，它将 `InputStream` 适配为\
    \ `Reader`。\n\n另一种较少使用的适配器形式出现在我们的 `Adapter` 继承 `Adaptee` 并实现 `Target` 接口时。由于被适配对象是我们的适配器的父类，我们称之为“类适配器”，如图\
    \ 3 所示。类适配器使用继承来适配 `Adaptee`。\n\n![ClassAdapterStructure](img/ClassAdapterStructure.png)\n\
    \n图 3。类适配器设计模式的结构。\n\n类适配器的一个优点是它更容易修改被适配对象的部分。遗憾的是，权衡是适配一个对象层次结构变得更加困难。在后面的章节中，我们将看到如何使用动态代理来获得类适配器的扩展性和对象适配器的灵活性。\n\
    \n### 对象适配器与代理有什么相似之处？\n\n在代理模式中，`RealSubject` 实现了 `Subject` 接口。如果我们去掉这种继承关系，它还是代理吗，还是会变成适配器？同样，如果一个适配器中的\
    \ `Adaptee` 恰好实现了 `Target`，那么该模式会变成代理吗？\n\n这取决于意图。例如，在 EJB 的话 bean 中，实现 bean 并不直接继承远程接口，因为这些方法会抛出不兼容的异常。远程接口会抛出\
    \ `RemoteException`，而实现 bean 会抛出业务异常。\n\n对象适配器的结构与代理相似。在两种情况下，客户端都使用顶层接口 `Target`\
    \ 或 `Subject`。我们在 `Adapter` 或 `Proxy` 中拥有该的实现。\n\n## 装饰器模式\n\n意图：“动态地给对象附加额外的责任。装饰器为通过子类扩展功能提供了灵活的替代。”\
    \ (GoF 1994, p. 175)\n\n![DecoratorStructure](img/DecoratorStructure.png)\n\n\
    图 4。装饰器设计模式的结构。\n\n当我们想要向一个类添加新方法时，最简单的方法是将它们添加到子类中。然而，这可能导致笨拙的类层次结构，并由于无法扩展多个父类而面临代码重复的风险。更好的方法是装饰器模式，通过这种模式我们用更丰富的类来装饰对象，从而“附加额外的责任”。我们还可以使用这种模式移除我们不想支持的方法。这被称为“过滤”。\n\
    \n装饰器的一个著名例子是 `java.io.InputStream` 及其相关类，其设计拷贝自 C++。具体组件包括 `FileInputStream`\
    \ 和 `SocketInputStream`。我们还有许多装饰器，例如用于添加 I/O 缓冲的 `BufferedInputStream`，用于以小端格式读取原始数据的\
    \ `DataInputStream`，以及用于序列化读取 Java 对象的 `ObjectInputStream`。甚至还有一个 `ProgressMonitorInputStream`，如果读取输入超过两秒，它会打开一个\
    \ Swing 进度对话框。\n\n在列表 1.1 中，我们创建一个指向文件 `data.bin.gz` 的 `FileOutputStream`。我们用\
    \ `GZIPOutputStream`、`BufferedOutputStream` 和 `DataOutputStream` 对其进行装饰。链中的每个环节都增加了一个功能。然后我们写入了\
    \ 0 到 1,000 之间的 1000 万个随机整数。\n\n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\n\
    try (var out = new DataOutputStream(\n    new BufferedOutputStream(\n        new\
    \ GZIPOutputStream(\n            new FileOutputStream(\n                \"data.bin.gz\"\
    ))))) {\n  // 向 data.bin.gz 写入 0 到 1000 之间的千万个随机整数\n  // 并实时使用 GZIP 对文件进行压缩\n\
    \  ThreadLocalRandom.current().ints(10_000_000, 0, 1_000)\n      .forEach(i ->\
    \ {\n        try {\n          out.writeInt(i);\n        } catch (IOException e)\
    \ {\n          throw new UncheckedIOException(e);\n        }\n      });\n  out.writeInt(-1);\
    \ // 我们的 EOF 标记\n}\n```\n\n列表 1.1：写入 `DataOutputStream`。\n\n在列表 1.2 中，我们从 `DataInputStream`\
    \ 读取，它反过来又从 `BufferedInputStream`、`GZIPInputStream` 和 `FileInputStream` 读取。\n\n\
    ```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\ntry (\n    // 分别声明 \"fis\"\
    \ 以确保它被关闭，\n    // 即使文件不包含正确的 GZIP 头\n    var fis = new FileInputStream(\"data.bin.gz\"\
    );\n    var in = new DataInputStream(\n        new BufferedInputStream(\n    \
    \        new GZIPInputStream(fis)))) {\n  long total = 0;\n  int value;\n  //\
    \ 持续读取直到 value == -1，我们的 EOF 标记\n  while ((value = in.readInt()) != -1) {\n  \
    \  total += value;\n  }\n  // 我们期望 total 为 50 亿\n  System.out.println(\"total\
    \ = \" + total);\n}\n```\n\n列表 1.2：从 `DataInputStream` 读取。\n\n（我们单独声明 `FileInputStream`\
    \ 的原因是 `GZIPInputStream` 会读取文件头以验证是否为 gzip 文件。如果头部错误，`GZIPInputStream` 的构造函数将抛出异常，在这种情况下\
    \ `FileInputStream` 将无法自动关闭。）\n\n### 装饰器与代理有什么相似之处？\n\n装饰器在结构上与代理最相似。`Component`\
    \ 是 `Subject`，`Decorator` 类似于 `Proxy`，而 `ConcreteComponent` 类似于 `RealSubject`。一个区别在于客户端看到的类。装饰器通常将组件作为构造参数。\n\
    \n## 组合模式\n\n意图：“将对象组合成树形结构以表示部分整体关系。组合允许客户端统一地处理单个对象和对象的组合。” (GoF 1994, p. 163)\n\
    \n![CompositeStructure](img/CompositeStructure.png)\n\n图 5。组合设计模式的结构。\n\n这种结构再次类似于代理和对象适配器。区别在于组合与组件之间存在一对多的关系。客户端与顶层组件类交互。\n\
    \n### 组合与代理有什么相似之处？\n\n在组合模式和代理模式中，客户端都会使用顶层接口 `Subject` 或 `Component`。然而，组合模式在\
    \ `Composite` 和 `Component` 之间是一一对多的关系，而代理模式在 `Proxy` 和 `Subject` 之间是一对一的关联。\n\
    \n## 责任链模式\n\n意图：“通过给多个对象处理请求的机会，避免请求发送者与其接收者之间的耦合。将接收对象链接起来并沿链传递请求，直到某个对象处理它为止。”\
    \ (GoF 1994, p. 223)\n\n![ChainOfResponsibilityStructure](img/ChainOfResponsibilityStructure.png)\n\
    \n图 6。责任链设计模式的结构。\n\n我们使用责任链模式使方法处理代码更易于理解。当代码具有列表 1.3 所示的形式时，这种模式非常有用。\n\n"
- fmt: "\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\npublic void handleWithoutChain(\n\
    \    String key, Consumer<String> processor) {\n  var item = map1.get(key);\n\
    \  if (item != null) processor.accept(item);\n  else {\n    item = map2.get(key);\n\
    \    if (item != null) processor.accept(item);\n    else {\n      item = map3.get(key);\
    \ // ad nauseum\n    }\n  }\n}\n```\n\nListing 1.3: Nested if-else-if constructs.\n\
    \nInstead of the multiconditional if-else statement, we create an abstract `Handler`\
    \ class. The default implementation of `handle()` is to pass the call down the\
    \ chain to the next handler.\n\n```java\n//:~ core/src/main/.../ch01/Handler.java\n\
    public abstract class Handler {\n  private final Handler next;\n  public Handler(Handler\
    \ next) {\n    this.next = next;\n  }\n  public void handle(String key, Consumer<String>\
    \ processor) {\n    if (next != null) next.handle(key, processor);\n  }\n}\n```\n\
    \nListing 1.4: Chain-of-responsibility handler.\n\nOur `MapHandler` contains the\
    \ implementation that calls `process(item)` if the item is found in our map; else\
    \ it calls `super.handle(key)`.\n\n```java\n//:~ core/src/main/.../ch01/MapHandler.java\n\
    public class MapHandler extends Handler {\n  private final Map<String, String>\
    \ map;\n  public MapHandler(Map<String, String> map, Handler next) {\n    super(next);\n\
    \    this.map = map;\n  }\n  @Override\n  public void handle(String key, Consumer<String>\
    \ processor) {\n    String item = map.get(key);\n    if (item != null) processor.accept(item);\n\
    \    else super.handle(key, processor);\n  }\n}\n```\n\nListing 1.5: Concrete\
    \ handler for maps.\n\nInside our class, we would set up the chain as we see in\
    \ Listing 1.6.\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\nprivate\
    \ final Handler chain =\n    new MapHandler(map1,\n        new MapHandler(map2,\n\
    \            new MapHandler(map3, null)));\n```\n\nListing 1.6: Chain of handlers\
    \ as field.\n\nInstead of the complicated if-else-if construct from Listing 1.3,\
    \ we can write:\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\nprivate\
    \ void handleWithChain(\n    String key, Consumer<String> processor) {\n  chain.handle(key,\
    \ processor);\n}\n```\n\nListing 1.7: Using the chain-of-responsibility handler.\n\
    \nThe pattern makes complicated if-else-if methods much easier to understand.\
    \ One known weakness of this pattern is that a request can drop off the end of\
    \ the chain if no suitable handler is found. In Chapter 4, we will learn how this\
    \ pattern helps us to handle method calls. We will also see how we can prevent\
    \ a request from falling off the end of the chain.\n\n# Handcrafted Proxies\n\n\
    Since our book has “proxies” in its title, we should examine the proxy pattern\
    \ in a bit more detail. Proxies come in various forms and flavors. For example,\
    \ we have mentioned the virtual proxy for lazy initialization, the remote proxy\
    \ for giving access to objects in remote address spaces, and the protection proxy\
    \ for adding a layer of security.\n\nAs a reminder, the proxy design-pattern structure\
    \ from the GoF book is seen in Figure 7.\n\n![ProxyStructure](images/ch01/ProxyStructure.png)\n\
    \nFigure 7. Proxy structure.\n\n## Lazy initialization with virtual proxy\n\n\
    In some situations, we may want to delay the creation of objects until they are\
    \ absolutely needed. Postponing might even save us the cost of object creation\
    \ altogether. Examples of such objects with a high creation cost include threads,\
    \ database connections, large arrays, and files.\n\nFor example, a new `HashMap`\
    \ is 48 bytes, excluding its array of entries. This array traditionally starts\
    \ at length 16 and grows once it has more than 75% occupancy. An array of 16 objects\
    \ occupies another 80 bytes. This means that the combined cost of a new `HashMap`\
    \ comes to 128 bytes, before containing a single element.\n\n### CustomMap\n\n\
    The `CustomMap` interface contains a subset of methods defined in `java.util.Map`.\
    \ In the proxy design-pattern structure, `CustomMap` is an example of the `Subject`\
    \ interface.\n\n```java\n//:~ core/src/main/.../ch02/virtual/CustomMap.java\n\
    public interface CustomMap<K, V> {\n  int size();\n  V get(Object key);\n  V put(K\
    \ key, V value);\n  V remove(Object key);\n  void clear();\n  void forEach(BiConsumer<?\
    \ super K, ? super V> action);\n  // etc.\n}\n```\n\nListing 2.1: `CustomMap`\
    \ interface.\n\nThe class structure of our `CustomMap` can be seen in Figure 8.\n\
    \n![CustomMapStructure](images/ch02/CustomMapStructure.png)\n\nFigure 8. `CustomMap`\
    \ structure.\n\n### CustomHashMap\n\n`CustomHashMap` implements `CustomMap`. Because\
    \ we don’t want to reinvent the wheel, we delegate all methods to a `java.util.HashMap`.\
    \ In the proxy design-patterns structure, `CustomHashMap` is an example of the\
    \ `RealSubject` class.\n\n```java\n//:~ core/src/main/.../ch02/virtual/CustomHashMap.java\n\
    public class CustomHashMap<K, V> implements CustomMap<K, V> {\n  private final\
    \ Map<K, V> map = new HashMap<>();\n  {\n    System.out.println(\"CustomHashMap\
    \ constructed\");\n  }\n  @Override\n  public int size() {\n    return map.size();\n\
    \  }\n  @Override\n  public V get(Object key) {\n    return map.get(key);\n  }\n\
    \  @Override\n  public V put(K key, V value) {\n    return map.put(key, value);\n\
    \  }\n  @Override\n  public V remove(Object key) {\n    return map.remove(key);\n\
    \  }\n  @Override\n  public void clear() {\n    map.clear();\n  }\n  @Override\n\
    \  public void forEach(BiConsumer<? super K, ? super V> action) {\n    map.forEach(action);\n\
    \  }\n  @Override\n  public String toString() {\n    return map.toString();\n\
    \  }\n}\n```\n\nListing 2.2: `CustomHashMap` class.\n\nWow, look at all repetition.\
    \ Wouldn’t it be nice to delegate all methods in `CustomMap` to `java.util.Map`?\
    \ We will learn how to do this in chapter 3.\n\n### VirtualMap\n\nLastly, we create\
    \ our virtual proxy, `VirtualCustomMap`. The actual `HashMap` is not created until\
    \ we.\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualCustomMap.java\n\
    public class VirtualCustomMap<K, V> implements CustomMap<K, V> {\n  private final\
    \ Supplier<CustomMap<K, V>> mapSupplier;\n  private CustomMap<K, V> realMap;\n\
    \  public VirtualCustomMap(Supplier<CustomMap<K, V>> mapSupplier) {\n    this.mapSupplier\
    \ = mapSupplier;\n  }\n  private CustomMap<K, V> getRealMap() {\n    if (realMap\
    \ == null) {\n      realMap = mapSupplier.get();\n    }\n    return realMap;\n\
    \  }\n  @Override\n  public int size() {\n    return getRealMap().size();\n  }\n\
    \  @Override\n  public V get(Object key) {\n    return getRealMap().get(key);\n\
    \  }\n  @Override\n  public V put(K key, V value) {\n    return getRealMap().put(key,\
    \ value);\n  }\n  @Override\n  public V remove(Object key) {\n    return getRealMap().remove(key);\n\
    \  }\n  @Override\n  public void clear() {\n    getRealMap().clear();\n  }\n \
    \ @Override\n  public void forEach(BiConsumer<? super K, ? super V> action) {\n\
    \    getRealMap().forEach(action);\n  }\n  @Override\n  public String toString()\
    \ {\n    return getRealMap().toString();\n  }\n}\n```\n\nListing 2.3: `VirtualCustomMap`\
    \ proxy class.\n\nLet’s have a look at how we can use this. Our local variable\
    \ `map` points to a `VirtualCustomMap` instance. The actual `HashMap` is not created\
    \ until we call a method such as `put()` or `get()` for the first time. When we\
    \ do, the supplier is invoked and the `HashMap` created. After that, all calls\
    \ are routed to the contained `HashMap`.\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualProxyDemo.java\n\
    CustomMap<String, Integer> map =\n    new VirtualCustomMap<>(CustomHashMap::new);\n\
    System.out.println(\"Virtual Map created\");\nmap.put(\"one\", 1);\nmap.put(\"\
    life\", 42);\nSystem.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"life\"\
    ));\nSystem.out.println(\"map.size() = \" + map.size());\nSystem.out.println(\"\
    clearing map\");\nmap.clear();\nSystem.out.println(\"map.size() = \" + map.size());\n\
    ```\n\nListing 2.4: `VirtualProxyDemo`.\n\nListing 2.5 shows the output from `VirtualProxyDemo`.\n\
    \n```\nVirtual Map created\nCustomHashMap constructed\nmap.get(\"life\") = 42\n\
    map.size() = 2\nclearing map\nmap.size() = 0\n```\n\nListing 2.5: Output From\
    \ `VirtualProxyDemo`.\n"
  raw: "```\n//:~ core/src/main/.../ch01/ChainDemo.java\npublic void handleWithoutChain(\n\
    \    String key, Consumer<String> processor) {\n  var item = map1.get(key);\n\
    \  if (item != null) processor.accept(item);\n  else {\n    item = map2.get(key);\n\
    \    if (item != null) processor.accept(item);\n    else {\n      item = map3.get(key);\
    \ // ad nauseum\n    }\n  }\n}\n```\n\nListing 1.3: Nested if-else-if constructs.\n\
    \nInstead of the multiconditional if-else statement, we create an abstract `Handler`\
    \ class. The default implementation of `handle()` is to pass the call down the\
    \ chain to the next handler.\n\n```\n//:~ core/src/main/.../ch01/Handler.java\n\
    public abstract class Handler {\n  private final Handler next;\n  public Handler(Handler\
    \ next) {\n    this.next = next;\n  }\n  public void handle(String key, Consumer<String>\
    \ processor) {\n    if (next != null) next.handle(key, processor);\n  }\n}\n```\n\
    \nListing 1.4: Chain-of-responsibility handler.\n\nOur `MapHandler` contains the\
    \ implementation that calls `process(item)` if the item is found in our map; else\
    \ it calls `super.handle(key)`.\n\n```\n//:~ core/src/main/.../ch01/MapHandler.java\n\
    public class MapHandler extends Handler {\n  private final Map<String, String>\
    \ map;\n  public MapHandler(Map<String, String> map, Handler next) {\n    super(next);\n\
    \    this.map = map;\n  }\n  @Override\n  public void handle(String key, Consumer<String>\
    \ processor) {\n    String item = map.get(key);\n    if (item != null) processor.accept(item);\n\
    \    else super.handle(key, processor);\n  }\n}\n```\n\nListing 1.5: Concrete\
    \ handler for maps.\n\nInside our class, we would set up the chain as we see in\
    \ Listing 1.6.\n\n```\n//:~ core/src/main/.../ch01/ChainDemo.java\nprivate final\
    \ Handler chain =\n    new MapHandler(map1,\n        new MapHandler(map2,\n  \
    \          new MapHandler(map3, null)));\n```\n\nListing 1.6: Chain of handlers\
    \ as field.\n\nInstead of the complicated if-else-if construct from Listing 1.3,\
    \ we can write:\n\n```\n//:~ core/src/main/.../ch01/ChainDemo.java\nprivate void\
    \ handleWithChain(\n    String key, Consumer<String> processor) {\n  chain.handle(key,\
    \ processor);\n}\n```\n\nListing 1.7: Using the chain-of-responsibility handler.\n\
    \nThe pattern makes complicated if-else-if methods much easier to understand.\
    \ One known weakness of this pattern is that a request can drop off the end of\
    \ the chain if no suitable handler is found. In Chapter 4, we will learn how this\
    \ pattern helps us to handle method calls. We will also see how we can prevent\
    \ a request from falling off the end of the chain.\n\n# **Handcrafted** **Proxies**\n\
    \nSince our book has “proxies” in its title, we should examine the proxy pattern\
    \ in a bit more detail. Proxies come in various forms and flavors. For example,\
    \ we have mentioned the virtual proxy for lazy initialization, the remote proxy\
    \ for giving access to objects in remote address spaces, and the protection proxy\
    \ for adding a layer of security.\n\nAs a reminder, the proxy design-pattern structure\
    \ from the GoF book is seen in Figure 7.\n\n![ProxyStructure](images/ch01/ProxyStructure.png)\n\
    \nFigure 7\\. Proxy structure.\n\n## Lazy initialization with virtual proxy\n\n\
    In some situations, we may want to delay the creation of objects until they are\
    \ absolutely needed. Postponing might even save us the cost of object creation\
    \ altogether. Examples of such objects with a high creation cost include threads,\
    \ database connections, large arrays, and files.\n\nFor example, a new `HashMap`\
    \ is 48 bytes, excluding its array of entries. This array traditionally starts\
    \ at length 16 and grows once it has more than 75% occupancy. An array of 16 objects\
    \ occupies another 80 bytes. This means that the combined cost of a new `HashMap`\
    \ comes to 128 bytes, before containing a single element.\n\n### `CustomMap`\n\
    \nThe `CustomMap` interface contains a subset of methods defined in `java.util.Map`.\
    \ In the proxy design-pattern structure, `CustomMap` is an example of the `Subject`\
    \ interface.\n\n```\n//:~ core/src/main/.../ch02/virtual/CustomMap.java\npublic\
    \ interface CustomMap<K, V> {\n  int size();\n  V get(Object key);\n  V put(K\
    \ key, V value);\n  V remove(Object key);\n  void clear();\n  void forEach(BiConsumer<?\
    \ super K, ? super V> action);\n  // etc.\n}\n```\n\nListing 2.1: `CustomMap`\
    \ interface.\n\nThe class structure of our `CustomMap` can be seen in Figure 8.\n\
    \n![CustomMapStructure](images/ch02/CustomMapStructure.png)\n\nFigure 8\\. `CustomMap`\
    \ structure.\n\n### `CustomHashMap`\n\n`CustomHashMap` implements `CustomMap`.\
    \ Because we don’t want to reinvent the wheel, we delegate all methods to a `java.util.HashMap`.\
    \ In the proxy design-patterns structure, `CustomHashMap` is an example of the\
    \ `RealSubject` class.\n\n```\n//:~ core/src/main/.../ch02/virtual/CustomHashMap.java\n\
    public class CustomHashMap<K, V> implements CustomMap<K, V> {\n  private final\
    \ Map<K, V> map = new HashMap<>();\n  {\n    System.out.println(\"CustomHashMap\
    \ constructed\");\n  }\n  @Override\n  public int size() {\n    return map.size();\n\
    \  }\n  @Override\n  public V get(Object key) {\n    return map.get(key);\n  }\n\
    \  @Override\n  public V put(K key, V value) {\n    return map.put(key, value);\n\
    \  }\n  @Override\n  public V remove(Object key) {\n    return map.remove(key);\n\
    \  }\n  @Override\n  public void clear() {\n    map.clear();\n  }\n  @Override\n\
    \  public void forEach(BiConsumer<? super K, ? super V> action) {\n    map.forEach(action);\n\
    \  }\n  @Override\n  public String toString() {\n    return map.toString();\n\
    \  }\n}\n```\n\nListing 2.2: `CustomHashMap` class.\n\nWow, look at all that repetition.\
    \ Wouldn’t it be nice to delegate all of the methods in `CustomMap` to a `java.util.Map`\
    \ of our choice? We will learn how to do this in chapter 3.\n\n### `VirtualCustomMap`\n\
    \nLastly, we create our virtual proxy, `VirtualCustomMap`. When we construct the\
    \ virtual proxy, we specify a `Supplier<CustomMap<K, V>>`. The first time any\
    \ method is called on `CustomMap`, we can create the real map using the supplier\
    \ and delegate operations to this real map. `VirtualCustomMap` is an example of\
    \ the `Proxy` in the proxy structure.\n\n```\n//:~ core/src/main/.../ch02/virtual/VirtualCustomMap.java\n\
    public class VirtualCustomMap<K, V> implements CustomMap<K, V> {\n  private final\
    \ Supplier<CustomMap<K, V>> mapSupplier;\n  private CustomMap<K, V> realMap;\n\
    \  public VirtualCustomMap(Supplier<CustomMap<K, V>> mapSupl) {\n    this.mapSupplier\
    \ = mapSupl;\n  }\n  private CustomMap<K, V> getRealMap() { // not thread-safe\n\
    \    if (realMap == null) realMap = mapSupplier.get();\n    return realMap;\n\
    \  }\n  @Override\n  public int size() {\n    return getRealMap().size();\n  }\n\
    \  @Override\n  public V get(Object key) {\n    return getRealMap().get(key);\n\
    \  }\n  @Override\n  public V put(K key, V value) {\n    return getRealMap().put(key,\
    \ value);\n  }\n  @Override\n  public V remove(Object key) {\n    return getRealMap().remove(key);\n\
    \  }\n  @Override\n  public void clear() {\n    getRealMap().clear();\n  }\n \
    \ @Override\n  public void forEach(BiConsumer<? super K, ? super V> action) {\n\
    \    getRealMap().forEach(action);\n  }\n}\n```\n\nListing 2.3: `VirtualCustomMap`\
    \ proxy class.\n\nLet’s have a look at how we can use this. Our local variable\
    \ `map` points to a `VirtualCustomMap` instance. The actual `HashMap` is not created\
    \ until we call a method such as `put()` or `get()` for the first time. When we\
    \ do, the supplier is invoked and the `HashMap` created. After that, all calls\
    \ are routed to the contained `HashMap`.\n\n```\n//:~ core/src/main/.../ch02/virtual/VirtualProxyDemo.java\n\
    CustomMap<String, Integer> map =\n    new VirtualCustomMap<>(CustomHashMap::new);\n\
    System.out.println(\"Virtual Map created\");\nmap.put(\"one\", 1);\nmap.put(\"\
    life\", 42);\nSystem.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"life\"\
    ));\nSystem.out.println(\"map.size() = \" + map.size());\nSystem.out.println(\"\
    clearing map\");\nmap.clear();\nSystem.out.println(\"map.size() = \" + map.size());\n\
    ```\n\nListing 2.4: `VirtualProxyDemo`.\n\nListing 2.5 shows the output from `VirtualProxyDemo`.\n\
    \n```\nVirtual Map created\nCustomHashMap constructed\nmap.get(\"life\") = 42\n\
    map.size() = 2\nclearing map\nmap.size() = 0\n```\n\nListing 2.5: Output From\
    \ `VirtualProxyDemo`."
