    \n## Cascaded proxies\n\nThe original GoF proxy class diagram has an association\
    \ from `Proxy` to `RealSubject`. A more flexible approach is for `Proxy` to instead\
    \ point to the `Subject` interface. This is how we’ve coded every one of our proxy\
    \ examples so far. By pointing to `Subject`, we can cascade our proxies: a protection\
    \ proxy might point to a virtual proxy, which in turn might point to a remote\
    \ proxy, and then to the `RealSubject`.\n\nFor example, let’s take our previous\
    \ `SynchronizedCustomMap` and combine that with our `VirtualCustomMap`.\n\n```\n\
    //:~ core/src/test/.../ch02/protection/SynchronizedVirtualTest.java\npublic class\
    \ SynchronizedVirtualTest extends ConcurrentTest {\n  @Test\n  public void testCascadedSynchronizedVirtualCustomMap()\
    \ {\n    var map =\n        new SynchronizedCustomMap<Integer, Integer>(\n   \
    \         new VirtualCustomMap<>(CustomHashMap::new));\n    check(map);\n    System.out.println(\"\
    map = \" + map);\n  }\n}\n```\n\nListing 2.20: Cascaded protection and virtual\
    \ proxies.\n\nLet’s look at the output in Listing 2.21\\. This time, the `CustomHashMap`\
    \ is only constructed once we begin calling methods on the map.\n\n```\nChecking\
    \ SynchronizedCustomMap\nCustomHashMap constructed\nentries = 46000\nmap.size()\
    \ = 46000\nmap = eu.javaspecialists...SynchronizedCustomMap@6f79caec\n```\n\n\
    Listing 2.21: Output from cascaded proxies.\n\nAstute readers might have noticed\
    \ that the output was not exactly what we expected! We would have liked to see\
    \ the familiar output from printing a `Map` to `System.out`.\n\n### What happened?\n\
    \nIn our great haste to handcraft these proxies, we forgot to override the `toString()`\
    \ method. It thus defaulted to `Object.toString()`, which returns the class name\
    \ and the default hash code.\n\nWe could change all our handcrafted proxies to\
    \ include the `toString()` method, but let us instead solve this with dynamic\
    \ proxies — in the next chapter.\n\n## Implementing `equals()` in proxies\n\n\
    The proxy object is obviously different than the object it is wrapping. However,\
    \ the client might not want to see a difference between the `RealSubject` and\
    \ the `Proxy`. We call this “object identity transparency”.\n\nWe need an `equals()`\
    \ method that is reflexive, symmetric, and transitive. Furthermore, we want `proxy.equals(real_subject)`\
    \ to be `true` for object identity transparency. It follows from our requirement\
    \ for symmetry that `real_subject.equals(proxy)` must also be `true`.\n\nLet’s\
    \ take another look at our `CustomHashMap`. Besides the `toString()` method, we\
    \ also forgot to add `equals()` and `hashCode()`. A typical `equals()` auto-generated\
    \ by an IDE such as IntelliJ or Eclipse would look like Listing 2.22.\n\n```\n\
    //:~ core/src/main/.../ch02/equals/BrokenEqualsInCustomHashMap.java\n@Override\n\
    public boolean equals(Object o) { // auto-generated by IDE\n  if (this == o) return\
    \ true;\n  if (o == null || getClass() != o.getClass()) return false;\n\n  CustomHashMap<?,\
    \ ?> that = (CustomHashMap<?, ?>) o;\n\n  if (!map.equals(that.map)) return false;\n\
    \n  return true;\n}\n@Override\npublic int hashCode() {\n  return map.hashCode();\n\
    }\n```\n\nListing 2.22: Auto-generated `CustomHashMap.equals()`.\n\nAn auto-generated\
    \ `equals()` method for our `UnmodifiableCustomMap` would look similar. See Listing\
    \ 2.23.\n\n```\n//:~ core/src/main/.../ch02/equals/BrokenEqualsInHandCraftedProxy.java\n\
    @Override\npublic boolean equals(Object o) { // auto-generated by IDE\n  if (this\
    \ == o) return true;\n  if (o == null || getClass() != o.getClass()) return false;\n\
    \n  UnmodifiableCustomMap<?, ?> that =\n      (UnmodifiableCustomMap<?, ?>) o;\n\
    \n  if (!map.equals(that.map)) return false;\n\n  return true;\n}\n@Override\n\
    public int hashCode() {\n  return map.hashCode();\n}\n```\n\nListing 2.23: Auto-generated\
    \ simple proxy `equals()`.\n\nWhile fulfilling the documented requirements, the\
    \ code above does not achieve the desired object identity transparency between\
    \ the proxy and the real subject."
