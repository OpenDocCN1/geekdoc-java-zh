  trans: "\n\n```java\n//:~ core/src/main/.../handlers/ExceptionUnwrappingInvocationHandler.java\n\
    public final class ExceptionUnwrappingInvocationHandler\n    implements InvocationHandler,\
    \ Serializable {\n  private static final long serialVersionUID = 1L;\n  private\
    \ final InvocationHandler handler;\n  public ExceptionUnwrappingInvocationHandler(\n\
    \      InvocationHandler handler) {\n    this.handler = handler;\n  }\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    try {\n      return handler.invoke(proxy, method,\
    \ args);\n    } catch (InvocationTargetException ex) {\n      throw ex.getCause();\n\
    \    }\n  }\n  public InvocationHandler getNestedInvocationHandler() {\n    return\
    \ handler;\n  }\n}\n```\n\nListing 3.14: `ExceptionUnwrappingInvocationHandler`。\n\
    \n将此应用于我们之前列表 3.12 中的示例只需要极少的工作。我们简单地包装了 `InvocationHandler`。\n\n```java\n//:~\
    \ core/src/main/.../ch03/gotchas/RecastingExceptionsFixed.java\nComparable<String>\
    \ comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n        Comparable.class.getClassLoader(),\n\
    \        new Class<?>[] {Comparable.class},\n        new ExceptionUnwrappingInvocationHandler(\n\
    \            (proxy, method, params) ->\n                method.invoke(params[0],\
    \ proxy)));\nSystem.out.println(comp.compareTo(\"hello\"));\n```\n\nListing 3.15:\
    \ `RecastingExceptionsFixed`。\n\n这一次，当我们运行它时，输出是单个 `ClassCastException`。正是我们需要的！\n\
    \n```\nException in thread \"main\" java.lang.ClassCastException: class\n    \
    \  com.sun.proxy.$Proxy0 cannot be cast to class java.lang.String\n\tat java.base/java.lang.String.compareTo(String.java:134)\n\
    \    at ...\n```\n\nListing 3.16: `RecastingExceptionsFixed` 的输出。\n\n## 强制转换 (Casting)\n\
    \n本节包含了我们在本书其余部分将将使用的静态工厂方法。\n\n在列表 3.6 中，我们必须手动将代理实例强制转换为 `Map<String, Integer>`。但强制转换已经是上个世纪的事了。相反，泛型可以为我们完成转换。\n\
    \n```java\n//:~ core/src/main/.../Proxies.java\n/**\n * @param intf    要实现并强制转换的接口\n\
    \ * @param handler 所有方法的 InvocationHandler\n */\n@SuppressWarnings(\"unchecked\"\
    )\npublic static <S> S castProxy(Class<? super S> intf,\n                    \
    \          InvocationHandler handler) {\n  Objects.requireNonNull(intf, \"intf==null\"\
    );\n  Objects.requireNonNull(handler, \"handler==null\");\n  return MethodTurboBooster.boost(\n\
    \      (S) Proxy.newProxyInstance(\n          intf.getClassLoader(),\n       \
    \   new Class<?>[] {intf},\n          new ExceptionUnwrappingInvocationHandler(handler)));\n\
    }\n```\n\nListing 3.17: `Proxies.castProxy()`。\n\n为了演示，我们还定义了 `Proxies.simpleProxy()`\
    \ 来创建一个将所有方法调用委托给包装对象的动态代理。\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
    public static <S> S simpleProxy(\n    Class<? super S> subjectInterface, S subject)\
    \ {\n  return castProxy(subjectInterface,\n      (InvocationHandler & Serializable)\n\
    \          (proxy, method, args) -> method.invoke(subject, args)\n  );\n}\n```\n\
    \nListing 3.18: `Proxies.simpleProxy()`。\n\n我们现在将在列表 3.19 中的 `RealISODateParser`\
    \ 类中使用它，该类实现了我们在列表 3.7 中的 `ISODateParser` 接口。\n\n```java\n//:~ core/src/main/.../ch03/RealISODateParser.java\n\
    public class RealISODateParser implements ISODateParser {\n  private static final\
    \ DateTimeFormatter formatter =\n      DateTimeFormatter.ISO_LOCAL_DATE;\n  @Override\n\
    \  public LocalDate parse(String date) throws ParseException {\n    try {\n  \
    \    return LocalDate.parse(date, formatter);\n    } catch (DateTimeParseException\
    \ e) {\n      throw new ParseException(e.toString(), e.getErrorIndex());\n   \
    \ }\n  }\n\n  @Override\n  public String toString() {\n    return getClass().getSimpleName();\n\
    \  }\n}\n```\n\nListing 3.19: `RealISODateParser` 示例。\n\n为了创建我们的动态代理，我们调用 `Proxies.simpleProxy()`\
    \ 方法并传入我们想要实现的接口，以及我们想要包装的对象。`simpleProxy(Class<? super S> subjectInterface, S\
    \ subject)` 的泛型规范确保实例 `subject` 匹配接口。我们使用 `castProxy()` 方法在内部为我们完成转换。\n\n```java\n\
    //:~ core/src/main/.../ch03/DynamicProxies.java\nISODateParser parser = Proxies.simpleProxy(\n\
    \    ISODateParser.class, new RealISODateParser());\nLocalDate palindrome = parser.parse(\"\
    2020-02-02\");\nSystem.out.println(\"palindrome = \\\"\" + palindrome + \"\\\"\
    \");\nSystem.out.println(parser);\nLocalDate funnyDate = parser.parse(\"2020-04-31\"\
    );\n```\n\nListing 3.20: 使用 `Proxies` 创建简单代理。\n\n```\npalindrome = \"2020-02-02\"\
    \nRealISODateParser\nException in thread \"main\" java.time.format.DateTimeParseException:\
    \ 2020-04-31\n```\n\nListing 3.21: 代理的输出。\n\n## 虚拟代理 (Virtual proxy)\n\n在列表 2.3\
    \ 的手工代理中，我们忘记了代理 `toString()`。通过动态代理，我们可以创建一个接受 `Supplier<? extends S>` 作为参数的\
    \ `VirtualProxyHandler`。\n\n```java\n//:~ core/src/main/.../handlers/VirtualProxyHandler.java\n\
    public final class VirtualProxyHandler<S>\n    implements InvocationHandler, Serializable\
    \ {\n  private static final long serialVersionUID = 1L;\n  private final Supplier<?\
    \ extends S> subjectSupplier;\n  private S subject;\n\n  public VirtualProxyHandler(\n\
    \      Supplier<? extends S> subjectSupplier) {\n    this.subjectSupplier = subjectSupplier;\n\
    \  }\n  private S getSubject() {\n    if (subject == null) subject = subjectSupplier.get();\n\
    \    return subject;\n  }\n  @Override\n  public Object invoke(Object proxy, Method\
    \ method,\n                       Object[] args) throws Throwable {\n    return\
    \ method.invoke(getSubject(), args);\n  }\n}\n```\n\nListing 3.22: `VirtualProxyHandler`。\n\
    \n我们可以为我们的 `Proxies` Fac 面添加一个静态工厂方法。\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
    public static <S> S virtualProxy(\n    Class<? super S> subjectInterface,\n  \
    \  Supplier<? extends S> subjectSupplier) {\n  Objects.requireNonNull(subjectSupplier,\n\
    \      \"subjectSupplier==null\");\n  return castProxy(subjectInterface,\n   \
    \   new VirtualProxyHandler<>(subjectSupplier));\n}\n```\n\nListing 3.23: `Proxies.virtualProxy()`。\n\
    \n我们的虚拟代理测试现在通过 `Proxies.virtualProxy(CustomMap.class, CustomHashMap::new)` 创建\
    \ `CustomMap`。\n\n```java\n//:~ core/src/main/.../ch03/virtual/VirtualProxyDemo.java\n\
    CustomMap<String, Integer> map =\n    Proxies.virtualProxy(CustomMap.class,\n\
    \        CustomHashMap::new);\nSystem.out.println(\"Virtual Map created\");\n\
    map.put(\"one\", 1); // 作为副作用创建 CustomHashMap\nmap.put(\"life\", 42);\nSystem.out.println(\"\
    map.get(\\\"life\\\") = \" + map.get(\"life\"));\nSystem.out.println(\"map.size()\
    \ = \" + map.size());\nSystem.out.println(\"clearing map\");\nmap.clear();\nSystem.out.println(\"\
    map.size() = \" + map.size());\n```\n\nListing 3.24: `VirtualProxyDemo`。\n\n输出与我们在列表\
    \ 2.5 中的手工虚拟代理完全相同。\n\n## 同步动态代理 (Synchronized dynamic proxy)\n\n我们不需要像在列表 2.15\
    \ 中那样手工制作一个同步保护代理，而是编写一个 `SynchronizedHandler`。它会同步所有对 `subject` 方法的调用，并使用 `proxy`\
    \ 作为我们的监视锁。\n\n"
- fmt: "\n```\n//:~ core/src/main/.../handlers/SynchronizedHandler.java\npublic final\
    \ class SynchronizedHandler<S>\n    implements InvocationHandler, Serializable\
    \ {\n  private static final long serialVersionUID = 1L;\n  private final S subject;\n\
    \  public SynchronizedHandler(S subject) {\n    this.subject = subject;\n  }\n\
    \  @Override\n  public Object invoke(Object proxy, Method method,\n          \
    \             Object[] args) throws Throwable {\n    // synchronize on the proxy\
    \ instance, which is similar to\n    // how Vector and Collections.synchronizedList()\
    \ work\n    synchronized (proxy) {\n      return method.invoke(subject, args);\n\
    \    }\n  }\n}\n```\n\nListing 3.25: `SynchronizedHandler`.\n\nOur `Proxies` façade\
    \ now gets a `synchronizedProxy()` static factory method.\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
    public static <S> S synchronizedProxy(\n    Class<? super S> subjectInterface,\
    \ S subject) {\n  Objects.requireNonNull(subject, \"subject==null\");\n  return\
    \ castProxy(subjectInterface,\n      new SynchronizedHandler<>(subject));\n}\n\
    ```\n\nListing 3.26: `Proxies.synchronizedProxy()`.\n\nWe can verify the synchronization\
    \ works as expected with the `SynchronizedTest` from Listing 2.16.\n\n```java\n\
    //:~ core/src/test/.../ch03/protection/SynchronizedTest.java\npublic class SynchronizedTest\
    \ extends ConcurrentTest {\n  @Test\n  public void testDynamicSynchronizedProxy()\
    \ {\n    check(Proxies.synchronizedProxy(\n        CustomMap.class, new CustomHashMap<>()\n\
    \    ));\n  }\n}\n```\n\nListing 3.27: `SynchronizedTest`.\n\nThe output from\
    \ our `SynchronizedTest` proves that it probably works correctly. Yes, that’s\
    \ cautious wording, but it is hard to prove the absence of bugs, especially with\
    \ concurrent code.\n\n```\nCustomHashMap constructed\nChecking $Proxy0\nentries\
    \ = 46000\nmap.size() = 46000\n```\n\nListing 3.28: Output from `SynchronizedTest`.\n\
    \n### Cascading multiple dynamic proxies\n\nIn our previous chapter, we cascaded\
    \ a synchronized protection proxy and a virtual proxy. We can do the same with\
    \ our newly minted dynamic proxies. Note that we need to add a type witness to\
    \ the call to `virtualProxy()` to specify that the generic type `S` is `CustomMap<Integer,\
    \ Integer>`. Otherwise, the compiler will cast our virtual proxy to `CustomHashMap`,\
    \ resulting in a `ClassCastException`.\n\n```java\n//:~ core/src/test/.../ch03/protection/SynchronizedVirtualTest.java\n\
    public class SynchronizedVirtualTest extends ConcurrentTest {\n  @Test\n  public\
    \ void testDynamicSynchronizedVirtualProxy() {\n    CustomMap<Integer, Integer>\
    \ map =\n        Proxies.synchronizedProxy(CustomMap.class,\n            Proxies.<CustomMap<Integer,\
    \ Integer>>virtualProxy(\n                CustomMap.class, CustomHashMap::new));\n\
    \    check(map);\n    System.out.println(\"map = \" + map);\n  }\n}\n```\n\nListing\
    \ 3.29: `SynchronizedVirtualTest`.\n\nThe output of our `SynchronizedVirtualTest`\
    \ is shown in Listing 3.30.\n\n```\nChecking $Proxy0\nCustomHashMap constructed\n\
    entries = 46000\nmap.size() = 46000\nmap = {0=0, 1=1, 2=4, 3=9, 4=16, 5=25, ...,\
    \ 45999=2115908001}\n```\n\nListing 3.30: Output from cascaded dynamic proxies.\n\
    \nThis time, the `toString()` method is auto-magically routed by our dynamic proxies.\n\
    \n## `EnhancedStream` with dynamic proxies\n\nI recently discovered a nice use\
    \ case for dynamic proxies. Java 8’s streams have a rather narrow-minded view\
    \ of how to implement `distinct()`. If two objects are `equal()`, then they are\
    \ distinct and typically the first element is kept and subsequent elements discarded.\n\
    \nWhat if we would like a different equality definition? To paraphrase George\
    \ Orwell’s *Animal Farm*, when two objects are equal, can one be more equal than\
    \ the other?\n\nFor example, `ArrayDeque` has two `clone()` methods, one that\
    \ returns `Object` and the other `ArrayDeque`. If deciding which one to keep,\
    \ we should choose the one with the most derived return type: `ArrayDeque clone()`.\
    \ The ordinary `distinct()` method in `Stream` cannot make that choice.\n\nOne\
    \ of the nice features of `Stream` is its fluent interface. Once we have a `Stream`,\
    \ a lot of methods return the same `Stream` type, so that we can chain method\
    \ calls. If we are going to enhance the stream, then these methods should also\
    \ return our `EnhancedStream`.\n\nOur interface `EnhancedStream` in Listing 3.31\
    \ extends `Stream` and adds a new `distinct()` method. It also overrides all the\
    \ methods that are returning `Stream` to instead return an `EnhancedStream`. Lastly,\
    \ we have two static factory methods for creating streams.\n\n```java\n//:~ core/src/main/.../ch03/enhancedstream/EnhancedStream.java\n\
    /**\n * Described in The Java Specialists Newsletters:\n * https://www.javaspecialists.eu/archive/Issue274.html\n\
    \ * https://www.javaspecialists.eu/archive/Issue275.html\n */\npublic interface\
    \ EnhancedStream<T> extends Stream<T> {\n  // new enhanced distinct()\n  EnhancedStream<T>\
    \ distinct(ToIntFunction<T> hashCode,\n                             BiPredicate<T,\
    \ T> equals);\n  EnhancedStream<T> distinct(Function<T, ?> keyGenerator,\n   \
    \                          BinaryOperator<T> merger);\n\n  // inherited methods\
    \ with enhanced return type\n  EnhancedStream<T> filter(Predicate<? super T> predicate);\n\
    \  <R> EnhancedStream<R> map(Function<? super T, ? R> mapper);\n  <R> EnhancedStream<R>\
    \ flatMap(Function<? super T, ? Stream extends R>> mapper);\n  EnhancedStream<T>\
    \ distinct();\n  EnhancedStream<T> sorted();\n  EnhancedStream<T> sorted(Comparator<?\
    \ super T> comparator);\n  EnhancedStream<T> peek(Consumer<? super T> action);\n\
    \  EnhancedStream<T> limit(long maxSize);\n  EnhancedStream<T> skip(long n);\n\
    \  EnhancedStream<T> takeWhile(Predicate<? super T> predicate);\n  EnhancedStream<T>\
    \ dropWhile(Predicate<? super T> predicate);\n  EnhancedStream<T> sequential();\n\
    \  EnhancedStream<T> parallel();\n  EnhancedStream<T> unordered();\n  EnhancedStream<T>\
    \ onClose(Runnable closeHandler);\n\n  // static factory methods\n  @SafeVarargs\n\
    \  @SuppressWarnings(\"varargs\")\n  static <E> EnhancedStream<E> of(E... elements)\
    \ {\n    return from(Stream.of(elements));\n  }\n  @SuppressWarnings(\"unchecked\"\
    )\n  static <E> EnhancedStream<E> from(Stream<E> stream) {\n    return (EnhancedStream<E>)\
    \ Proxy.newProxyInstance(\n        EnhancedStream.class.getClassLoader(),\n  \
    \      new Class<?>[] {EnhancedStream.class},\n        new EnhancedStreamHandler<>(stream)\n\
    \    );\n  }\n}\n```\n\nListing 3.31: `EnhancedStream<T>`.\n\nOur `EnhancedStreamHandler`\
    \ contains a static inner class `Key` that is used for determining “uniqueness”\
    \ among stream elements. All method calls are routed via the `invoke()` method.\
    \ Inside `invoke()`, we first decide whether the method is our enhanced `distinct()`\
    \ method. If it is, we call that directly. Otherwise, if the return type is `EnhancedStream`,\
    \ we find the matching method in our `methodMap` and invoke that on our `delegate`.\
    \ In this case, we return the `proxy`, which is an instance of type `EnhancedStream`.\
    \ Alternatively, we return the result of calling the method directly on our `delegate`.\n"
