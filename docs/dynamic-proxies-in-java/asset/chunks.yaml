  raw: 'Build tools like Gradle use proxies for models, tasks, actions, and listeners.
    Examples include `BuildOperationListener`, `StandardOutputListener`, and `ProgressListener`.
    Maven uses them for plugin management through the `MavenPluginManager` and `CircularDependencyProxy`.


    Application containers like JBoss and Spring Framework use proxies for dependency
    injection. Some examples are `@Inject`, `@Qualifier`, `@Autowired`, and `@Bean`.
    Scoping and lifecycle management also use dynamic proxies.


    Persistence management with JPA within these containers uses proxies — for example,
    `@Entity`, `@Id`, `@GeneratedValue`, `@Table`, and `@JoinColumn`. In Spring, we
    can derive a custom repository by extending the `Repository` interface. In the
    background, a multi-interface dynamic decorating proxy takes care of the details.


    If we choose Hibernate for ORM, then proxies surround `HibernateEntityManagerFactory`,
    `HibernateEntityManager`, and `EntityManagerProxy`. Spring’s `ConnectionProxy`
    is a dynamic proxy of `java.sql.Connection`.


    Again in Spring, a dynamic proxy for `InitBinder` binds HTTP form fields with
    a data model. Dynamic proxies are used under the hood by many of the frameworks
    we use every day: Spring Framework, WildFly, NetBeans Platform, Apache Tomcat,
    and OpenJDK, among many others.


    ## But wait…​


    Dynamic proxies are not always the best tool to use. Although highly convenient,
    method calls on a dynamic proxy suffer a small increase in performance overhead
    compared to direct method calls. In this book, we will learn how to minimize the
    performance impact of using dynamic proxies.


    ## What will we learn?


    There are occasions when dynamic proxies are the perfect fit for a particular
    problem. By studying them in depth and seeing them in a variety of scenarios,
    we will learn to spot places where it makes sense to use them. We will learn to
    recognize their strengths and weaknesses.


    This makes the debugging of systems that use dynamic proxies easier.


    ## TL;DR?


    Even a mini-book like this can take days to read and fully understand. To make
    this material more accessible, I have created a [self-study course](https://javaspecialists.teachable.com/p/dynamic-proxies-in-java)
    with detailed explanations of each building block. The course has exercises for
    each chapter, together with model solutions.


    ## Java version


    We compiled the code for this book with Java 11 LTS. Where it makes code clearer,
    we use the Java 10 `var` keyword for local variables.


    While we do use shallow reflection in this book, we try to avoid using deep reflection.
    Mark Reinhold defined these terms on the OpenJDK [JPMS (JSR 376) Expert Group
    mailing list](http://mail.openjdk.java.net/pipermail/jpms-spec-experts/2016-October/000431.html).


    *   Shallow reflective access is access at runtime via the Core Reflection API
    (`java.lang.reflect`) without using `setAccessible`. Only public elements in exported
    packages can be accessed.


    *   Deep reflective access is access at run time via the Core Reflection API,
    using the `setAccessible` method to break into non-public elements. Any element,
    whether public or not, in any package, whether exported or not, can be accessed.
    Deep reflective access implies shallow reflective access.


    ## Enjoy!


    I hope that you will enjoy this book and that you find it both useful and intellectually
    stimulating. Perhaps even entertaining at times.


    Try out the concepts in the book; best with a cup of hot java at your side. Play
    around with the concepts in your IDE. All the code samples from the book are available
    at [https://github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples).


    Dr. Heinz M. Kabutz


