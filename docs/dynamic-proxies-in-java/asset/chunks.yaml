    \    java.util.function.Consumer)]\n  at eu.javaspecialists.books.dynamicproxies/...\n\
    ```\n\nListing 4.12: Output from `DynamicFilterDemo` without `--add-opens`.\n\n\
    However, when we run the `DefaultMethodCallDemo` with `--add-opens java.base/java.util=eu.javaspecialists.books.dynamicproxies`,\
    \ it works as expected.\n\n```\ntrue\n0.9833487941165752\njava.lang.UnsupportedOperationException:\
    \ remove\nIterating forever ...\n0.07265625125554698\n0.49716358229383684\n0.44842977216243907\n\
    0.44363950828146614\n0.5560995018129454\n0.9779642433900788\n0.7941409326858004\n\
    ... etc.\n```\n\nListing 4.13: Output from `DynamicFilterDemo` with `--add-opens`.\n\
    \nThe rest of this chapter shows the gory details of how the `VTable` works, together\
    \ with our `ChainedInvocationHandler`. These utilities are used in the next pattern,\
    \ but feel free to skip the rest of this chapter and perhaps come back to it at\
    \ a later stage.\n\n## `VTable`\n\nThere is no inheritance relationship between\
    \ the `ImmutableCollection` interface and `Collection`. However, we still need\
    \ to match methods from the interface through to the decorated object. To do this,\
    \ we have created a `VTable`, which returns the matching method for a given interface\
    \ method. It is rather long and complex, and we first need to cover a few items:\n\
    \n1. `ParameterTypesFetcher` helps to increase performance of matching methods.\n\
    2. `MethodKey` compares methods by name and parameter types.\n3. `VTable` matches\
    \ target and receiver methods, including default interface methods.\n4. `VTable.Builder`\
    \ is an [Effective Java](https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/)\
    \ builder pattern for constructing the `VTable`.\n5. `VTables` is a façade for\
    \ building the most common `VTable` configurations.\n\n### `ParameterTypesFetcher`\n\
    \nA significant cost in matching methods is the call to `getParameterTypes()`,\
    \ which clones the internal `Class<?>[]` every time we call it. The `ParameterTypesFetcher`\
    \ gives us direct access to the array inside. We can enable this performance optimization\
    \ with the `-Deu.javaspecialists.books.dynamicproxies.util.ParameterTypesFetcher.enabled=true`\
    \ JVM parameter.\n\nWe use the [strategy design pattern](https://javaspecialists.teachable.com/p/dpc5)\
    \ to decide how to return the parameter types. When the `ParameterTypesFetcher`\
    \ class is loaded, we bind the `PARAMETER_FETCHER` to the correct type of strategy.\
    \ Since we only ever use one strategy within one JVM, the HotSpot compiler can\
    \ optimize the methods aggressively, possibly inlining the code and thus eliminating\
    \ the method-call overhead.\n\n```java\n//:~ core/src/main/.../util/ParameterTypesFetcher.java\n\
    /**\n * Fast fetching of parameter types array is disabled by default\n * and\
    \ can be enabled with\n * -Deu.javaspecialists.books.dynamicproxies.util. \\\n\
    \ * ParameterTypesFetcher.enabled=true\n */\npublic final class ParameterTypesFetcher\
    \ {\n  private final static ParameterFetcher PARAMETER_FETCHER =\n      Boolean.getBoolean(\n\
    \          ParameterTypesFetcher.class.getName() + \".enabled\") ?\n         \
    \ new FastParameterFetcher() :\n          new NormalParameterFetcher();\n\n  /**\n\
    \   * Warning: When \"fast parameter fetching\" is enabled, the\n   * array returned\
    \ is the actual array stored inside the Method\n   * object.  Do not change it!\n\
    \   */\n  public static Class<?>[] get(Method method) {\n    return PARAMETER_FETCHER.getParameterTypes(method);\n\
    \  }\n\n  @FunctionalInterface\n  private interface ParameterFetcher {\n    Class<?>[]\
    \ getParameterTypes(Method method);\n  }\n\n  /**\n   * Returns the parameter\
    \ types by calling getParameterTypes()\n   * on the method parameter.  This should\
    \ always work.\n   */\n  private static class NormalParameterFetcher\n      implements\
    \ ParameterFetcher {\n    @Override\n    public Class<?>[] getParameterTypes(Method\
    \ method) {\n      return method.getParameterTypes(); // clones the array\n  \
    \  }\n  }\n\n  /**\n   * Creates a VarHandle pointing directly to the private\
    \ field\n   * parameterTypes stored inside Method. Since the VarHandle is\n  \
    \ * declared as final static, the cost of reading it is the\n   * same as reading\
    \ an ordinary field.\n   */\n  private static class FastParameterFetcher\n   \
    \   implements ParameterFetcher {\n    private final static VarHandle METHOD_PARAMETER_TYPES;\n\
    \n    static {\n      try {\n        METHOD_PARAMETER_TYPES = MethodHandles.privateLookupIn(\n\
    \            Method.class, MethodHandles.lookup()\n        ).findVarHandle(Method.class,\
    \ \"parameterTypes\",\n            Class[].class);\n      } catch (ReflectiveOperationException\
    \ e) {\n        throw new Error(e);\n      }\n    }\n    @Override\n    public\
    \ Class<?>[] getParameterTypes(Method method) {\n      return (Class<?>[]) METHOD_PARAMETER_TYPES.get(method);\n\
    \    }\n  }\n}\n```\n\nListing 4.14: `ParameterTypesFetcher`.\n\n### `MethodKey`\n\
    \n`MethodKey` in Listing 4.15 is used to compare `Method` objects based on their\
    \ names and parameter types. It does not compare the class each is defined in\
    \ or its return type. We use `MethodKey` as key for maps when we want to match\
    \ methods.\n\n```java\n//:~ core/src/main/.../util/MethodKey.java\n/**\n * MethodKey\
    \ is used to compare Methods by name and parameter\n * types. It has equals(),\
    \ hashCode(), compareTo() and toString()\n * implemented.  We can use it as a\
    \ key in a map. MethodKey does\n * not know the return type of the method.\n */\n\
    public final class MethodKey implements Comparable<MethodKey> {\n  private final\
    \ String name;\n  private final Class<?>[] paramTypes;\n\n  public MethodKey(Method\
    \ method) {\n    name = method.getName();\n    paramTypes = ParameterTypesFetcher.get(method);\n\
    \  }\n\n  public MethodKey(Class<?> clazz, String name,\n                   Class<?>...\
    \ paramTypes) {\n    try {\n      // check that method exists in the class\n \
    \     var method = clazz.getMethod(name, paramTypes);\n      // method names are\
    \ interned in the JVM\n      this.name = method.getName();\n      this.paramTypes\
    \ = Objects.requireNonNull(paramTypes);\n    } catch (NoSuchMethodException e)\
    \ {\n      throw new IllegalArgumentException(e);\n    }\n  }\n\n  @Override\n\
    \  public boolean equals(Object obj) {\n    if (!(obj instanceof MethodKey)) {\n\
    \      return false;\n    }\n    // name and paramTypes cannot be null\n    var\
    \ other = (MethodKey) obj;\n    return name == other.name && // method names are\
    \ interned\n               equalTypes(paramTypes, other.paramTypes);\n  }\n\n\
    \  /**\n   * We compare classes using == instead of .equals().We know\n   * that\
    \ the arrays will be null.  We can thus avoid some\n   * of the checks done in\
    \ Arrays.equals().\n   */\n  private boolean equalTypes(Class<?>[] params1,\n\
    \                            Class<?>[] params2) {\n    if (params1.length ==\
    \ params2.length) {\n      for (int i = 0; i < params1.length; i++) {\n      \
    \  if (params1[i] != params2[i])\n          return false;\n      }\n      return\
    \ true;\n    }\n    return false;\n  }\n\n  @Override\n  public int hashCode()\
    \ {\n    return name.hashCode() + paramTypes.length;\n  }\n\n  @Override\n  public\
    \ int compareTo(MethodKey that) {\n    int result = this.name.compareTo(that.name);\n\
    \    if (result != 0) return result;\n    return Arrays.compare(this.paramTypes,\n\
    \        that.paramTypes,\n        Comparator.comparing(Class::getName));\n  }\n\
    \n  @Override\n  public String toString() {\n    return Stream.of(paramTypes)\n\
    \               .map(Class::getName)\n               .collect(Collectors.joining(\"\
    , \",\n                   name + \"(\", \")\"));\n  }\n}\n```\n\nListing 4.15:\
    \ `MethodKey`.\n\n### `VTable` and `VTable.Builder`\n\nThe `VTable` creates a\
    \ custom hash table for looking up methods based on name and parameter type. Normal\
    \ methods are discovered using `lookup(Method)`, whereas default interface methods\
    \ are discovered with `lookupDefaultMethod(Method)`.\n"
