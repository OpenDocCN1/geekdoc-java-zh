- fmt: "\n```java\n//:~ core/src/main/.../util/VTable.java\n/**\n * The purpose of\
    \ the VTable is as a fast mapper between\n * interface methods and receiver class\
    \ methods. To minimize\n * object creation, we avoid a normal HashMap, choosing\
    \ rather\n * to store all the elements in equally sized arrays. We also\n * try\
    \ to minimize clashes in the table by hashing on the method\n * name + number\
    \ of parameters. Furthermore, we remember whether\n * a name was distinct in the\
    \ table. If it was, we do not check\n * that the parameters match.\n * <p>\n *\
    \ The most important methods in terms of performance are\n * lookup() and lookupDefaultMethod().\n\
    \ */\npublic final class VTable {\n  private final Method[] entries;\n  private\
    \ final Class<?>[][] paramTypes;\n  private final boolean[] distinctName;\n  private\
    \ final MethodHandle[] defaultMethods;\n  private final int size;\n  private final\
    \ int mask;\n\n  /**\n   * Builds the VTable according to the collection of methods.\n\
    \   * The input for this constructor is created in the Builder\n   * class.\n\
    \   *\n   * @param methods               all the methods that need to\n   *  \
    \                            be included in this VTable\n   * @param distinctMethodNames\
    \   names of methods that have\n   *                              not been overloaded\n\
    \   * @param includeDefaultMethods whether or not we want to\n   *           \
    \                   include default interface\n   *                          \
    \    methods\n   */\n  private VTable(Collection<Method> methods,\n          \
    \       Set<String> distinctMethodNames,\n                 boolean includeDefaultMethods)\
    \ {\n    this.size = methods.size();\n    mask = Math.max(\n        (-1 >>> Integer.numberOfLeadingZeros(size\
    \ * 4 - 1)),\n        127);\n    entries = new Method[mask + 1];\n    paramTypes\
    \ = new Class<?>[entries.length][];\n    distinctName = new boolean[entries.length];\n\
    \    defaultMethods = new MethodHandle[entries.length];\n    for (var method :\
    \ methods) {\n      put(method,\n          distinctMethodNames.contains(method.getName()),\n\
    \          includeDefaultMethods);\n    }\n    methods.forEach(MethodTurboBooster::boost);\n\
    \  }\n\n  /**\n   * Looks up the method in the VTable.  Returns null if it is\n\
    \   * not found.\n   */\n  public Method lookup(Method method) {\n    int index\
    \ = findIndex(method);\n    return index < 0 ? null : entries[index];\n  }\n\n\
    \  /**\n   * Looks up the default interface method in the VTable.\n   * Returns\
    \ null if it is not found.\n   */\n  public MethodHandle lookupDefaultMethod(Method\
    \ method) {\n    int index = findIndex(method);\n    return index < 0 ? null :\
    \ defaultMethods[index];\n  }\n\n  /**\n   * Returns the number of entries in\
    \ the VTable.  The size does\n   * not change and is fixed at construction.\n\
    \   */\n  public int size() {\n    return size;\n  }\n\n  /**\n   * Returns a\
    \ stream of Method objects from this VTable.  Used\n   * by the ChainedInvocationHandler\
    \ to verify that all methods\n   * in the target have been covered by the various\
    \ VTables.\n   */\n  public Stream<Method> stream() {\n    return Stream.of(entries).filter(Objects::nonNull);\n\
    \  }\n\n  /**\n   * Returns a stream of Method objects for which we have\n   *\
    \ default interface methods in this VTable.  Used by the\n   * ChainedInvocationHandler\
    \ to verify that all methods in the\n   * target have been covered by the various\
    \ VTables.\n   */\n  public Stream<Method> streamDefaultMethods() {\n    // Heinz:\
    \ First time I've found a use case for iterate()\n    return IntStream.iterate(0,\
    \ i -> i < entries.length,\n        i -> i + 1)\n               .filter(i -> defaultMethods[i]\
    \ != null)\n               .mapToObj(i -> entries[i]);\n  }\n\n  /**\n   * Finds\
    \ a free position for the entry and then inserts the\n   * values into the arrays\
    \ entries, paramTypes, distinctName,\n   * and optionally, defaultMethods.  Duplicate\
    \ methods are not\n   * allowed and will throw an IllegalArgumentException.\n\
    \   */\n  private void put(Method method, boolean distinct,\n                \
    \   boolean includeDefaultMethods) {\n    int index = findIndex(method);\n   \
    \ if (index >= 0)\n      throw new IllegalArgumentException(\n          \"Duplicate\
    \ method found: \" + new MethodKey(method));\n    index = ~index; // flip the\
    \ bits again to find empty space\n    entries[index] = method;\n    paramTypes[index]\
    \ = ParameterTypesFetcher.get(method);\n    distinctName[index] = distinct;\n\
    \    if (includeDefaultMethods && method.isDefault()) {\n      defaultMethods[index]\
    \ = getDefaultMethodHandle(method);\n    }\n  }\n\n  /**\n   * Returns a MethodHandle\
    \ for the default interface method\n   * if it is declared and the module is open\
    \ to our module;\n   * null otherwise.\n   */\n  private MethodHandle getDefaultMethodHandle(Method\
    \ method) {\n    try {\n      Class<?> target = method.getDeclaringClass();\n\
    \      if (isTargetClassInOpenModule(target)) {\n        // Thanks Thomas Darimont\
    \ for this idea\n        MethodHandles.Lookup lookup = MethodHandles.lookup();\n\
    \        return MethodHandles.privateLookupIn(target, lookup)\n              \
    \     .unreflectSpecial(method, target)\n                   // asSpreader() avoids\
    \ having to call\n                   // invokeWithArguments() and is about 10x\n\
    \                   // faster\n                   .asSpreader(Object[].class,\n\
    \                       method.getParameterCount());\n      }\n      return null;\n\
    \    } catch (IllegalAccessException e) {\n      throw new IllegalArgumentException(e);\n\
    \    }\n  }\n\n  /**\n   * Returns true if the method is in open module; false\n\
    \   * otherwise.  For example, if our VTable is inside\n   * \"javaspecialists.books.dynamicproxies\"\
    \ and we want\n   * use default methods of interfaces in java.util, we need\n\
    \   * to explicitly open that module --add-opens\n   * java.util=eu.javaspecialists.books.dynamicproxies\n\
    \   */\n  private boolean isTargetClassInOpenModule(Class<?> target) {\n    Module\
    \ targetModule = target.getModule();\n    String targetPackage = target.getPackageName();\n\
    \    Module ourModule = VTable.class.getModule();\n    return targetModule.isOpen(targetPackage,\
    \ ourModule);\n  }\n\n  /**\n   * Returns the index of the method; negative value\
    \ if it\n   * not found. Once a method with this name is found, we check\n   *\
    \ the method was overloaded. If it was not, then\n   * return the offset.\n  \
    \ */\n  private int findIndex(Method method) {\n    int offset = offset(method);\n\
    \    Class<?>[] methodTypes = null;\n    Method match;\n    while ((match = entries[offset])\
    \ != null) {\n      if (match.getName() == method.getName()) {\n        if (distinctName[offset])\
    \ return offset;\n        if (methodTypes == null)\n          methodTypes = ParameterTypesFetcher.get(method);\n\
    \        if (matches(paramTypes[offset], methodTypes))\n          return offset;\n\
    \      }\n      offset = (offset + 1) & mask;\n    }\n    // Could not find the\
    \ method, returning a negative value\n    // (By flipping the bits again, we know\
    \ what the first\n    // available index in our array is)\n    return ~offset;\n\
    \  }\n\n  /**\n   * Returns the initial offset for the method, based on\n   *\
    \ name and number of parameters.\n   */\n  private int offset(Method method) {\n\
    \    return (method.getName().hashCode() +\n                method.getParameterCount())\
    \ & mask;\n  }\n\n  /**\n   * Fast array comparison for parameter types.  Classes\
    \ can be\n   * compared with == instead of equals().\n   */\n  private boolean\
    \ matches(Class<?>[] types1, Class<?>[] types2) {\n    if (types1.length != types2.length)\
    \ return false;\n    for (int i = 0; i < types1.length; i++) {\n      if (types1[i]\
    \ != types2[i]) return false;\n    }\n    return true;\n  }\n\n  public static\
    \ class Builder {\n    private static final BinaryOperator<Method> MOST_SPECIFIC\
    \ =\n        (method1, method2) -> {\n          var r1 = method1.getReturnType();\n\
    \          var r2 = method2.getReturnType();\n          if (r2.isAssignableFrom(r1))\
    \ {\n            return method1;\n          }\n          if (r1.isAssignableFrom(r2))\
    \ {\n            return method2;\n          } else {\n            throw new IllegalStateException(\n\
    \                method1 + \" and \" + method2 +\n                    \" have\
    \ incompatible return types\");\n          }\n        };\n    private static final\
    \ Method[] OBJECT_METHODS;\n    static {\n      try {\n        OBJECT_METHODS\
    \ = new Method[] {\n            Object.class.getMethod(\"toString\"),\n      \
    \      Object.class.getMethod(\"hashCode\"),\n            Object.class.getMethod(\"\
    equals\", Object.class),\n        };\n      } catch (NoSuchMethodException e)\
    \ {\n        throw new Error(e);\n      }\n    }\n    private final Map<MethodKey,\
    \ Method> receiverClassMap;\n    private List<Class<?>> targetInterfaces = new\
    \ ArrayList<>();\n    private boolean includeObjectMethods = true;\n    private\
    \ boolean includeDefaultMethods = false;\n    private boolean ignoreReturnTypes\
    \ = false;\n\n    /**\n     * @param receiver The class that receives the actual\n\
    \     *                 method calls.  Does not have to be\n     *           \
    \      related to the dynamic proxy interfaces.\n     */\n    public Builder(Class<?>\
    \ receiver) {\n      receiverClassMap = createPublicMethodMap(receiver);\n   \
    \ }\n\n    /**\n     * Methods equals(Object), hashCode() and toString() are not\n\
    \     * added to the VTable.\n     */\n    public Builder excludeObjectMethods()\
    \ {\n      this.includeObjectMethods = false;\n      return this;\n    }\n\n \
    \   public Builder includeDefaultMethods() {\n      this.includeDefaultMethods\
    \ = true;\n      return this;\n    }\n\n    public Builder ignoreReturnTypes()\
    \ {\n      this.ignoreReturnTypes = true;\n      return this;\n    }\n\n    /**\n\
    \     * One of the target interfaces that we wish to map methods\n     * to.\n\
    \     */\n    public Builder addTargetInterface(Class<?> targetIntf) {\n     \
    \ if (!targetIntf.isInterface())\n        throw new IllegalArgumentException(\n\
    \            targetIntf.getCanonicalName() +\n                \" is not an interface\"\
    );\n      this.targetInterfaces.add(targetIntf);\n      return this;\n    }\n\n\
    \    public VTable build() {\n      // Build collection of all methods from the\
    \ target\n      // interfaces, as well as the three\n      // included default\
    \ methods.\n      Collection<Method> allMethods =\n          targetInterfaces.stream()\n\
    \              .flatMap(clazz -> Stream.of(clazz))\n              .filter(Objects::nonNull)\n\
    \              .collect(Collectors.toList());\n      if (includeObjectMethods)\
    \ {\n        for (Method method : OBJECT_METHODS) {\n          allMethods.add(method);\n\
    \        }\n      }\n      // Find all methods that have unique name,\n      //\
    \ thus speed up matching.\n      Set<String> distinctMethodNames =\n         \
    \ allMethods.stream()\n              .collect(Collectors.groupingBy(Method::getName,\n\
    \                  Collectors.counting()))\n              .keySet(); // simplified\
