    \ testSynchronizedCustomMap() {\n    check(new SynchronizedCustomMap<>(new CustomHashMap<>()));\n\
    \  }\n}\n```\n\nListing 2.16: SynchronizedTest for testing `SynchronizedCustomMap`.\n\
    \nAs expected, we are free from race conditions when we protect all access to\
    \ the `CustomMap` with `synchronized`.\n\n### `UnmodifiableCustomMap`\n\nCollections\
    \ returned directly from methods are often a source of bugs. It is not always\
    \ clear what should happen when these collections are changed by the caller. Should\
    \ the original collection be modified or should the change have no effect? One\
    \ of the recommended approaches is to return an unmodifiable collection, that\
    \ is, one which throws an `UnsupportedOperationException` if a method is called\
    \ that would modify the contents of the collection. Our `CustomMap` is modified\
    \ by methods `put()`, `remove()`, and `clear()`.\n\nIf we wanted to make sure\
    \ that whoever got the map would not be able to modify it, we could send them\
    \ an `UnmodifiableCustomMap`. This throws an `UnsupportedOperationException` whenever\
    \ we call a modifier method such as `put()`.\n\n```\n//:~ core/src/main/.../ch02/protection/UnmodifiableCustomMap.java\n\
    public class UnmodifiableCustomMap<K, V>\n    implements CustomMap<K, V> {\n \
    \ private final CustomMap<K, V> map;\n  public UnmodifiableCustomMap(CustomMap<K,\
    \ V> map) {\n    this.map = map;\n  }\n  @Override\n  public int size() {\n  \
    \  return map.size();\n  }\n  @Override\n  public V get(Object key) {\n    return\
    \ map.get(key);\n  }\n  @Override\n  public V put(K key, V value) {\n    throw\
    \ new UnsupportedOperationException(\"unmodifiable\");\n  }\n  @Override\n  public\
    \ V remove(Object key) {\n    throw new UnsupportedOperationException(\"unmodifiable\"\
    );\n  }\n  @Override\n  public void clear() {\n    throw new UnsupportedOperationException(\"\
    unmodifiable\");\n  }\n  @Override\n  public void forEach(BiConsumer<? super K,\
    \ ? super V> action) {\n    map.forEach(action);\n  }\n}\n```\n\nListing 2.17:\
    \ `UnmodifiableCustomMap` throws `UnsupportedOperationException` for modifier\
    \ methods.\n\nOur `UnmodifiableTest` checks what happens when we try to modify\
    \ an `UnmodifiableCustomMap` using our previously shown `ConcurrentTest`.\n\n\
    ```\n//:~ core/src/test/.../ch02/protection/UnmodifiableTest.java\npublic class\
    \ UnmodifiableTest extends ConcurrentTest {\n  @Test\n  public void testUnmodifiableCustomMap()\
    \ {\n    check(new UnmodifiableCustomMap<>(new CustomHashMap<>()));\n  }\n}\n\
    ```\n\nListing 2.18: `UnmodifiableTest`.\n\nAs expected, calling `put()` causes\
    \ an `UnsupportedOperationException`.\n\n```\nCustomHashMap constructed\nChecking\
    \ UnmodifiableCustomMap\njava.lang.UnsupportedOperationException: unmodifiable\n\
