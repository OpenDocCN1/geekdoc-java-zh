    像 `Gradle`这样的构建工具对模型、任务、操作和监听器使用了代理。示例包括 `BuildOperationListener`、`StandardOutputListener`
    和 `ProgressListener`。Maven 通过 `MavenPluginManager` 和 `CircularDependencyProxy`
    使用它们进行插件管理。


    `JBoss` 和 `Spring Framework` 等应用容器使用代理进行依赖注入。示例包括 `@Inject`、`@Qualifier`、`@Autowired`
    和 `@Bean`。作用域生命周期管理也使用了动态代理。


    在这些容器中使用 `JPA` 进行持久化管理使用了代理——例如 `@Entity`、`@Id`、`@GeneratedValue`、`@Table` 和 `@JoinColumn`。在
    Spring 中，我们可以通过扩展 `Repository` 接口派生自定义仓库。在后台，一个多接口动态装饰代理负责处理这些细节。


    如果我们选择 `Hibernate` 作为 ORM，那么代理会包围 `HibernateEntityManagerFactory`、`HibernateEntityManager`
    和 `EntityManagerProxy`。Spring 的 `ConnectionProxy` 是 `java.sql.Connection` 的动态代理。


    同样在 Spring 中，`InitBinder` 的动态代理将 HTTP 表单字段绑定到数据模型。我们每天使用的许多框架：`Spring Framework`、`WildFly`、`NetBeans
    Platform`、`Apache Tomcat` 和 `OpenJDK` 等，底层都使用了动态代理。


    ## 等一下……


    动态代理并非最好的工具。虽然非常方便，但与直接方法调用相比，动态代理上的方法调用性能开销会有略微增加。在本书中，我们将学习如何减少使用动态代理对性能的影响。


    ## 我们将学习什么？


    在某些情况下，动态代理是特定问题的完美选择。通过深入研究它们并在各种场景中观察它们，我们将学会识别哪些地方使用它们是合理的。我们将学会识别它们的优缺点。


    这使得使用动态代理的系统调试变得更加容易。


    ## 简单来说？


    即使是像这样的微型书籍也需要几天时间来阅读和完全理解。为了让这些材料更易于获取，我创建了一个[自学课程](https://javaspecialists.teachable.com/p/dynamic-proxies-in-java)，对每个构建模块进行了详细解释。课程每个章节都有练习题，并附有模型答案。


    ## Java 版本


    我们使用 Java 11 LTS 编译了本书的代码。在使代码更清晰的地方，我们对局部变量使用了 Java 10 的 `var` 关键字。


    虽然我们在书中使用了浅反射，但尽量避免使用深反射。Mark Reinhold 在 OpenJDK [JPMS (JSR 376) 专家组邮件列表](http://mail.openjdk.java.net/pipermail/jpms-spec-experts/2016-October/000431.html)上定义了这些术语。


    *   **浅反射访问**是通过核心反射 API (`java.lang.reflect`) 在运行时进行的访问，而不使用 `setAccessible`。只能访问已导出包中的公共元素。

    *   **深反射访问**是在运行时通过核心反射 API 进行访问，并使用 `setAccessible` 方法来进入非公共元素。任何包中的任何元素，无论是否公共，无论是否已导出，都可以访问。深反射访问包含了浅反射访问。


    ## 玩得愉快！


    我希望你会喜欢这本书，并发现它既实用又能激发智力。也许有时还会有趣。


    尝试书中的概念；在旁边放上一杯热的 java 效果最好。在你的 IDE 中尝试这些概念。书中的所有代码示例均可在 [`github.com/kabutz/dynamic-proxies-samples`](https://github.com/kabutz/dynamic-proxies-samples)
    获得。


