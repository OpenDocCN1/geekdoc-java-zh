    # Preface


    It is the year 2000. Our industry survived the Y2K bug. A “smartphone” can also
    tell the time. Java is a language without generics, lambdas, or type inference.
    Deploying our EAR files takes ages. EAR files? Yes, the Spring Framework is still
    years from release. Real programmers use RMI and CORBA.


    Tools generate buckets of infrastructure code. For example, Remote Method Invocation
    (RMI) uses the [`rmic`](https://docs.oracle.com/en/java/javase/13/docs/specs/man/rmic.html)
    tool to generate stub and skeleton classes to support remote proxies. (Remarkably,
    `rmic` lives on in the JDK/bin directory in modern distributions.).)In May 2000,
    Sun Microsystems ships Java 1.3 — and with it, dynamic proxies. Instead of a separate
    build step, new classes are created on the fly by specifying which interfaces
    they should implement. All method calls on these dynamic classes are routed through
    a single `InvocationHandler`. Infrastructure code uses dynamic proxies to create
    stub and skeleton classes in memory.


    ## Big win


    Dynamic proxies make code easier to maintain. Instead of a large number of handcrafted
    classes, we write a single dynamic proxy. It is the “don’t repeat yourself” principle
    on steroids.


    For example, one company managed to replace 600,000 generated code statements
    with a single dynamic proxy. They had written a magic tool to migrate their proprietary
    language to Java. Their business system had hundreds of entities. Their tool converted
    each entity to several Java classes. However, after this initial generation, programmers
    had to maintain the code by hand. Maintenance was laborious and error-prone. A
    single dynamic proxy replaced all that. Less code means easier maintenance.


    ## Infrastructure code


    Most of us have used dynamic proxies, often without realizing it. A lot of frameworks
    and tools are built on dynamic proxies. Even the humble annotation is implemented
    with dynamic proxies. These examples are a small sample of where we might find
    them in use.

