  trans: "\nListing 4.16: `VTable` 和 `VTable.Builder`。\n\n### `VTables` Fac 面\n\n\
    `VTable` 最常见的用例是映射无关接口之间的方法，以及映射默认接口方法。我们的 `VTables` Fac 面包含了静态工厂方法，用于构建此类 `VTable`\
    \ 实例。\n\n```\n//:~ core/src/main/.../util/VTables.java\npublic final class VTables\
    \ {\n  private VTables() {}\n\n  public static VTable newDefaultMethodVTable(Class<?>\
    \ clazz) {\n    return newVTableBuilder(clazz, clazz)\n               .excludeObjectMethods()\n\
    \               .includeDefaultMethods()\n               .build();\n  }\n\n  public\
    \ static VTable newVTable(Class<?> receiver,\n                               \
    \  Class<?>... targets) {\n    return newVTableBuilder(receiver, targets).build();\n\
    \  }\n\n  public static VTable newVTableExcludingObjectMethods(\n      Class<?>\
    \ receiver, Class<?>... targets) {\n    return newVTableBuilder(receiver, targets)\n\
    \               .excludeObjectMethods()\n               .build();\n  }\n\n  private\
    \ static VTable.Builder newVTableBuilder(\n      Class<?> receiver, Class<?>...\
    \ targets) {\n    VTable.Builder builder = new VTable.Builder(receiver);\n   \
    \ for (Class<?> target : targets) {\n      builder.addTargetInterface(target);\n\
    \    }\n    return builder;\n  }\n}\n```\n\nListing 4.17: `VTables` Fac 面。\n\n\
    例如，为了在 `List` 和 `ArrayDeque` 之间建立一个 `VTable`，我们只需编写列表 4.18 中的代码即可。\n\n```\n//:~\
    \ core/src/test/.../util/VTablesDemo.java\npublic class VTablesDemo {\n  public\
    \ static void main(String... args) {\n    VTable vt = VTables.newVTable(ArrayDeque.class,\
    \ List.class);\n    vt.stream().forEach(System.out::println);\n  }\n}\n```\n\n\
    Listing 4.18: `VTablesDemo`。\n\n输出显示了 `ArrayDeque` 中同样出现在 `List` 中的所有方法。\n\n```\n\
    public boolean java.util.ArrayDeque.add(java.lang.Object)\npublic boolean java.util.ArrayDeque.isEmpty()\n\
    public int java.util.ArrayDeque.size()\npublic boolean java.util.ArrayDeque.contains(java.lang.Object)\n\
    public boolean java.util.AbstractCollection.containsAll(java.util.Collection)\n\
    public boolean java.util.ArrayDeque.remove(java.lang.Object)\npublic java.lang.Object[]\
    \ java.util.ArrayDeque.toArray()\npublic void java.util.ArrayDeque.clear()\netc.\n\
    ```\n\nListing 4.19: `VTablesDemo` 的输出。\n\n### `ChainedInvocationHandler`\n\n\
    我们在第 1 章中简要介绍了责任链模式（chain-of-responsibility pattern）。我们还提到它有一个已知的缺点：当没有找到合适的处理器时，请求可能会在链的末端丢失。\n\
    \n我们的 `ChainedInvocationHandler` 是该模式中的根处理器。除了将请求传递给链中的下一个处理器外，如果没有发现合适的方法，它还会抛出一个\
    \ `AssertionError`。我们鼓励此类的用户在链链后调用 `checkAllMethodsAreHandled(Class<?>… targets)`，以验证该链能够处理目标接口中的所有方法。\n\
    \n```\n//:~ core/src/main/.../util/chain/ChainedInvocationHandler.java\n/**\n\
    \ * 用于调用处理器的责任链设计模式。\n * invoke 方法默认将调用传递给\n * 链中的下一个元素。如果没有人可以处理\n该调用，\n * 那么就会抛出\
    \ AssertionError。一旦构建了完整的链，\n * 我们应该通过调用 #checkAllMethodsAreHandled(targets) \n\
    \ * 检查目标接口中的所有方法是否都能被我们的链所处理。\n */\npublic abstract class ChainedInvocationHandler\n\
    \    implements InvocationHandler {\n  private final ChainedInvocationHandler\
    \ next;\n\n  public ChainedInvocationHandler(\n      ChainedInvocationHandler\
    \ next) {\n    this.next = next;\n  }\n\n  @Override\n  public Object invoke(Object\
    \ proxy, Method method,\n                       Object[] args) throws Throwable\
    \ {\n    if (next != null) return next.invoke(proxy, method, args);\n    // 我们不允许某个方法不被处理\n\
    \    throw new AssertionError(\n        \"No InvocationHandler for \" + method);\n\
    \  }\n\n  /**\n   * 在一切设置完成后，应在链的第一个节点上调用。\n   * 如果任何方法未被我们的链处理，则抛出 IllegalArgumentException。\n\
    \   *\n   * @throws UnhandledMethodException 如果 targets 中的任何方法 \n   *        \
    \                          都未被链 \n   *                                  处理的\n\
    \   * @throws IllegalArgumentException 如果目标之一 \n   *                         \
    \         不是接口\n   */\n  public void checkAllMethodsAreHandled(Class<?>... targets)\
    \ {\n        if (Stream.of(targets)\n            .anyMatch(Predicate.not(Class::isInterface)))\n\
    \          throw new IllegalArgumentException(\n              \"target classes\
    \ must be interfaces\");\n    Collection<Method> unhandled =\n        findUnhandledMethods(targets)\n\
    \            .collect(Collectors.toList());\n    if (!unhandled.isEmpty())\n \
    \     throw new UnhandledMethodException(unhandled);\n  }\n\n  /**\n   * 链中的最后一个处理器返回一个包含\n\
    \   * 给定目标接口中所有方法的 Stream。子类\n   * 应调用 super.findUnhandledMethods(targets) 然后\n\
    \   * 过滤掉被处理器处理的方法。\n   */\n  protected Stream<Method> findUnhandledMethods(\n\
    \      Class<?>... targets) {\n    if (next != null) return next.findUnhandledMethods(targets);\n\
    \    return Stream.of(targets)\n               .map(Class::getMethods)\n     \
    \          .flatMap(Stream::of)\n               .filter(m -> !Modifier.isStatic(m.getModifiers()));\n\
    \  }\n}\n```\n\nListing 4.20: `ChainedInvocationHandler`。\n\n我们还定义了一个名为 `UnhandledMethodException`\
    \ 的新异常，如 4.21 所示。它是 `IllegalArgumentException` 的特殊类型，只能在 `chain` 包内实例化。\n\n```\n\
    //:~ core/src/main/.../util/chain/UnhandledMethodException.java\npublic final\
    \ class UnhandledMethodException\n    extends IllegalArgumentException {\n  private\
    \ final Collection<Method> unhandled;\n  UnhandledMethodException(Collection<Method>\
    \ unhandled) {\n    super(\"Unhandled methods: \" + unhandled);\n    this.unhandled\
    \ = List.copyOf(unhandled);\n  }\n  public Collection<Method> getUnhandled() {\n\
    \    return unhandled;\n  }\n}\n```\n\nListing 4.21: `UnhandledMethodException`。\n\
    \n我们的 `VTableHandler` 接收参数：用于调用方法的 `receiver` 对象、用于将目标接口方法映射到接收器类的 `vtable`，以及链中的\
    \ `next` 链接。\n\n```\n//:~ core/src/main/.../util/chain/VTableHandler.java\npublic\
    \ final class VTableHandler\n    extends ChainedInvocationHandler {\n  private\
    \ final VTable vtable;\n  private final Object receiver;\n  public VTableHandler(Object\
    \ receiver, VTable vtable,\n                       ChainedInvocationHandler next)\
    \ {\n    super(next);\n    this.receiver = Objects.requireNonNull(receiver);\n\
    \    this.vtable = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public\
    \ Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    Method match = vtable.lookup(method);\n    if\
    \ (match != null) return match.invoke(receiver, args);\n    return super.invoke(proxy,\
    \ method, args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
    \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
    \               .filter(method -> vtable.lookup(method) == null);\n  }\n}\n```\n\
    \nListing 4.22: `VTableHandler`。\n"
- fmt: "\nDefault interface methods have to be invoked slightly differently. Instead\
    \ of a receiver object, they are called on the `proxy` parameter that is passed\
    \ into the `invoke()` method. Our `VTableDefaultMethodsHandler` is thus constructed\
    \ with just the `vtable` for finding default interface methods and the `next`\
    \ handler in the chain. In all likelihood, this handler will be the last in the\
    \ chain.\n\nIf we find a match to the default interface method in our `vtable`,\
    \ we call the `MethodHandle` with our `proxy` parameter and the proffered `args`\
    \ array.\n\nSimilar to what we did with the `VTableHandler`, we also need to filter\
    \ out of the stream any methods that this handler matches.\n\n```java\n//:~ core/src/main/.../util/chain/VTableDefaultMethodsHandler.java\n\
    public final class VTableDefaultMethodsHandler\n    extends ChainedInvocationHandler\
    \ {\n  private final VTable vtable;\n  public VTableDefaultMethodsHandler(\n \
    \     VTable vtable, ChainedInvocationHandler next) {\n    super(next);\n    this.vtable\
    \ = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public Object invoke(Object\
    \ proxy, Method method,\n                       Object[] args) throws Throwable\
    \ {\n    MethodHandle match = vtable.lookupDefaultMethod(method);\n    if (match\
    \ != null)\n      return match.invoke(proxy, args);\n    return super.invoke(proxy,\
    \ method, args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
    \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
    \               .filter(\n                   method -> vtable.lookupDefaultMethod(method)\n\
    \                                 == null);\n  }\n}\n```\n\nListing 4.23: `VTableDefaultMethodsHandler`.\n\
    \nThe observant reader will have noticed that the two previous classes look eerily\
    \ similar. For fun, we unified the two lookup approaches into one, using generics\
    \ and lambdas. It works, but it would have been more challenging to explain in\
    \ the book. The code is in our `core/src/test/…​/util/chain` package in our [dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples)\
    \ at GitHub.\n\n# Dynamic Object Adapter\n\n## Rapper wrappers\n\nImagine a class\
    \ hierarchy of singers: bass, tenor, and soprano. They all belong to a choir.\n\
    \nCacophony is Greek for “bad sound”. ![Singers](images/ch05/Singers.jpg)\n\n\
    Now imagine that a rapper is standing next to the choir, all forlorn. The rapper\
    \ would love to join the choir, but cannot. Only singers allowed, sorry.\n\n![Choir](images/ch05/Choir.png)\n\
    \nFigure 11. A choir structure with singers. The forlorn rapper looks on.\n\n\
    How can we make the rapper into a singer? Some would say this is an impossibility.\
    \ Rappers talk, singers sing. End of story.\n\nBut let’s put aside our feelings\
    \ about the musical quality of rap for a moment. Let’s also assume that we cannot\
    \ change the `Rapper` class.\n\n### Class adapter pattern\n\nThe easiest way to\
    \ create a rapper wrapper is with the class adapter pattern. We create a `SingingRapper`\
    \ that implements `Singer` and extends `Rapper`. In the `sing()` method, we call\
    \ `talk()`.\n\n![SingingRapperClassAdapter](images/ch05/SingingRapperClassAdapter.png)\n\
    \nFigure 12. A singing, talking rapper.\n\nOur `SingingRapper` extends `Rapper`,\
    \ making it both a rapper and a singer. This works fine if there is only one type\
    \ of `Rapper`, but the list of rapper types seems to be endless: East Coast, West\
    \ Coast, boom bap, drill, emo rap, mumble rap, gangsta, trap…​ the list goes on\
    \ and on. What seems like a great low-code solution turns out to need dozens of\
    \ similar-looking classes, one for each unique rap style.\n\n### Object adapter\
    \ pattern\n\nThe object adapter pattern takes a rapper as a constructor parameter\
    \ and delegates the `sing()` method to the `talk()` method on its rapper. We can\
    \ accept any subclass of `Rapper` as an argument, even a `MumbleRapper`. Our rapper\
    \ wrapper now implements `Singer`, but does not extend `Rapper`, so it is not\
    \ a rapper. We can call `sing()`, but `talk()` is no longer visible.\n\n![SingingRapperObjectAdapter](images/ch05/SingingRapperObjectAdapter.png)\n\
    \nFigure 13. Converting a rapper into a singer.\n\nThe object adapter pattern\
    \ seems the better choice of the two. But what if the `Rapper` and the `Singer`\
    \ had quite a few methods in common, such as `clap()`, `bow()`, and `dance()`?\
    \ With the class adapter pattern, we only need to implement the `sing()` method.\
    \ The object adapter pattern, on the other hand, requires us to delegate all of\
    \ the methods. This can become onerous with rich target interfaces.\n\n## A better\
    \ ArrayList\n\nWhen we create an `ArrayList<String>`, we go to the trouble of\
    \ specifying that it contains `String`. However, this information is erased from\
    \ the class to preserve backwards compatibility of the class file format. The\
    \ `ArrayList` class has no knowledge of what the generic type parameter is. If\
    \ we call `toArray()`, what is returned is an `Object[]`, even though we declared\
    \ our collection to contain `String`.\n\nJava 5 introduced covariant return types.\
    \ An overridden method can return a subclass of the return type of its parent\
    \ method. Thus, a subclass of `ArrayList` could return a subclass of `Object`.\n\
    \n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayList.java\n\
    public class BetterArrayList<E> extends ArrayList<E> {\n  private final E[] seedArray;\n\
    \n  public BetterArrayList(E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\"seedArray must be empty\");\n    this.seedArray\
    \ = seedArray;\n  }\n\n  @Override\n  public E[] toArray() {\n    // NOTE: Shipilev\
    \ showed that this is the fastest way\n    // create a typed array from a collection:\n\
    \    // https://shipilev.net/blog/2016/arrays-ancients/\n    return toArray(seedArray);\n\
    \  }\n\n  @Override\n  public String toString() {\n    return \"--\" + super.toString()\
    \ + \"--\";\n  }\n}\n```\n\nListing 5.1: `BetterArrayList`.\n\nListing 5.2 shows\
    \ one way we could use this class. We pass in a `new String[0]`, which is then\
    \ used to create the correct type.\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayListDemo.java\n\
    BetterArrayList<String> names =\n    new BetterArrayList<>(new String[0]);\nnames.add(\"\
    Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
    Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
    for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
    System.out.println(names);\n```\n\nListing 5.2: `BetterArrayListDemo`.\n\nThe\
    \ output is shown in Listing 5.3.\n\n```\nWOLFGANG\nLEANDER\nBOBBY TABLES\nKLAUS\n\
    MENONGAHELA\n--[Wolfgang, Bobby Tables, Leander, Klaus, Menongahela]--\n```\n\n\
    Listing 5.3: Output from `BetterArrayListDemo`.\n\n## BetterCollection interface\n\
    \nAnother approach is to extend the `Collection` interface and override the `toArray()`\
    \ method to return the correct type. Listing 5.4 shows how this interface looks:\n\
    \n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollection.java\n\
    public interface BetterCollection<E> extends Collection<E> {\n  @Override\n  E[]\
    \ toArray();\n  default void forEachFiltered(Predicate<? super E> predicate,\n\
    \                               Consumer<? super E> action) {\n    Objects.requireNonNull(predicate,\
    \ \"predicate==null\");\n    Objects.requireNonNull(action, \"action==null\");\n\
    \    for (E e : this) {\n      if (predicate.test(e)) action.accept(e);\n    }\n\
    \  }\n}\n```\n\nListing 5.4: `BetterCollection`.\n\nLife is good when we use a\
    \ class adapter. To make a better `ConcurrentSkipListSet`, we can extend this\
    \ class and implement `BetterCollection`. The code looks similar to `BetterArrayList`.\n"
