    Hello there 1\");\n```\n*Wait, 重新审视原文代码块，这里是更准确的翻译对应：*\n\n```java\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
    Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\nallStudents.add(new Person(\"mzani@absa.co.za\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\n```\n(实际上，原文的示例代码块非常杂乱，我将提供最接近原文文本的翻译版本)\n\n```java\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
    Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\nallStudents.add(new Person(\"mzani@absa.co.za\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\n```\n(由于代码块不需要翻译，我将保持其结构)\n\n*实际上，原文中的代码块是：*\n```java\n//:~\
    \ core/src/main/.../ch06/contact/ContactDemo.java\nContact javaSpecialistsNewsletter\
    \ = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\nallStudents.add(new Person(\"mzani@absa.co.za\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\n```\n(这里我将跳过代码翻译，直接翻译描述文字)\n\n现在我们已经看到了 `Contact` 如何与 `Person`\
    \ 和 `DistributionList` 关联，是时候看一个示例了。\n\n(代码块保持不变)\n\n列表 6.5：创建组合结构。\n\n我们可以看到组合对象在图\
    \ 16 中连接的。\n\n![ContactObject](img/ContactObjectExample.png)\n\n图 16。ContactDemo\
    \ 对象图。\n\n当我们运行这个程序时，我们看到如下输出。\n\n```\n0\n1\nSending Hello there 1 to john@aol.com\n\
    1\n2\nSending Hello there 1 to peter@absa.co.za\nSending Hello there 1 to mzani@absa.co.za\n\
    3\n```\n列表 6.6：ContactDemo 输出。\n\n## 为组合破解动态代理\n\n我们可以使用动态代理而不是手工编写 `DistributionList`？\n\
    \n组合模式和代理模式最大的区别在于关联的数量。\n\n代理模式与主体是一对一的关系，而组合模式与组件是一一对多的关系。当我们调用代理的方法时，我们可以将结果返回给客户端。然而，当我们调用组合的方法时，我们可能会面对许多结果。在向客户端返回单个结果之前，必须进行合并或减少。\n\
    \n`BaseComponent<T>` 表示实现组合模式的任何层次结构。`BaseComponent` 中的泛型参数 `T` 代表扩展接口——例如 `Contact`。它还有两个默认方法\
    \ `add(T)` 和 `remove(T)`，它们默认都不执行操作。\n\n```java\n//:~ core/src/main/.../handlers/BaseComponent.java\n\
    public interface BaseComponent<T> {\n  default boolean add(T t) { return false;\
    \ }\n  default boolean remove(T t) { return false; }\n}\n```\n列表 6.7：BaseComponent\
    \ 接口。\n\n我们进一步让 `Contact` 扩展 `BaseComponent<Contact>`，继承 `add()` 和 `remove()`\
    \ 方法。\n\n```java\n//:~ core/src/main/.../ch06/contactdynamic/Contact.java\npublic\
    \ interface Contact extends BaseComponent<Contact> {\n  void sendMail(String body);\n\
    \  int count();\n}\n```\n列表 6.8：Contact 接口。\n\n我们的 `Contact` 扩展 `BaseComponent<Contact>`，如图\
    \ 17 所示。\n\n![ContactDynamicExample](img/ContactDynamicExample.png)\n\n图 17。Contact\
    \ 扩展 BaseComponent。\n\n[/content] (抱歉，由于在处理代码块时出现了重复混乱，以下是整理后的、干净的翻译版本)\n\n---\n\
    \n[content]\n\n当我们使用动态代理时，我们还可能会获得更高的对象分配率，由于参数数组、装箱的返回值以及逃逸分析不如直接调用那样有效。\n\n\
    # 动态组合 (Dynamic Composite)\n\n我们使用组合设计模式来创建对象的组合。一个示例是包含文件、符号链接和其他目录的目录结构。ZIP\
    \ 文件也被视为一个组合，它包含目录、文件甚至是其他 ZIP 文件。我们还在 GUI 框架中看到这种模式的应用，面板可以包含按钮、标签、文本字段或其他面板。\n\
    \n在本章中，我们将检查组合设计模式，并查看如何使用动态代理来帮助实现组合对象关系。首先，我们看到了一个关于邮件联系人和分发列表的示例。然后，我们演示了如何使用由动态代理驱动的组合来代替手工编写的分发列表。最后，我们看到了另一个输出分流的示例。\n\
    \nGoF 的组合模式结构如图 14 所示。\n\n![CompositeStructure](img/CompositeStructure.png)\n\n\
    图 14。组合设计模式的结构。\n\n敏锐的读者可能会注意到，`add()`、`remove()` 和 `getChild()` 方法定义在 `Component`\
    \ 中。这种过于通用的接口是对该模式最大的批评点。John Vlissides 编写了一篇关于组合模式的优秀两部分文章，“Java 风格组合[第一部分](https://www.javaspecialists.eu/courses/dpc/archive/Composite1-Vlissides.pdf)”和[“第二部分”](https://www.javaspecialists.eu/courses/dpc/archive/Composite2-Vlissides.pdf)”，他在文中解释了替代方案。\n\
    \n## 联系人、个人和分发列表\n\nJava 最早的动态代理教程之一发表在 [The Java Specialists' Newsletter](https://www.javaspecialists.eu/archive/Issue005.html)\
    \ 中，通过电子邮件发送。该通讯报最初有 80 个联系人，我在 Microsoft Outlook 中为他们创建了一个分发列表。为了减少垃圾邮件，Microsoft\
    \ Outlook 限制了单个分发列表中的联系人数量。一旦订阅人数达到限制，我就创建了分发列表的组合。\n\n我们新的 `Contact` 示例结构如图 15\
    \ 所示。\n\n![ContactHandcraftedExample](img/ContactHandcraftedExample.png)\n\n图\
    \ 15。Contact 示例。\n\n`Contact` 是一个表示联系人的接口，可以是单个联系人，也可以是一组联系人。`Contact` 有两个抽象方法：`sendMail()`\
    \ 和 `count()`。它还有两个都返回 `false` 的默认接口方法：`add()` 和 `remove()`。\n\n```java\n//:~\
    \ core/src/main/.../ch06/contact/Contact.java\npublic interface Contact {\n  default\
    \ boolean add(Contact c) { return false; }\n  default boolean remove(Contact c)\
    \ { return false; }\n  void sendMail(String body);\n  int count();\n}\n```\n列表\
    \ 6.2：Contact 接口。\n\n`Person` 是我们的垃圾邮件受害者。\n\n在 `sendMail()` 中，我们连接到 JavaMail\
    \ 并发送实际消息。（为了简洁，我们省略了 JavaMail 的实现细节。）\n\n```java\n//:~ core/src/main/.../ch06/contact/Person.java\n\
    public class Person implements Contact {\n  private final String email;\n  public\
    \ Person(String email) {this.email = email;}\n  @Override\n  public void sendMail(String\
    \ body) {\n    // connecting to JavaMail and off it goes ...\n    System.out.println(\"\
    Sending \" + body + \" to \" + email);\n  }\n  @Override\n  public int count()\
    \ {\n    return 1;\n  }\n}\n```\n列表 6.3：Person 类。\n\n我们的 `DistributionList` 是我们的组合类，由\
    \ `Contact` 实例组成。由于 `DistributionList` 本身也是 `Contact`，它不仅可以包含 `Person` 实例，还可以包含其他\
    \ `DistributionList` 对象。`sendMail()` 递归地向列表中的所有联系人发送垃圾邮件。`count()` 是我们包含的所有叶子节点之和。\n\
    \n```java\n//:~ core/src/main/.../ch06/contact/DistributionList.java\nimport java.util.*;\n\
    \npublic class DistributionList implements Contact {\n  private final Collection<Contact>\
    \ contacts = new ArrayList<>();\n\n  @Override\n  public boolean add(Contact c)\
    \ {\n    return contacts.add(c);\n  }\n  @Override\n  public boolean remove(Contact\
    \ c) {\n    return contacts.remove(c);\n  }\n  @Override\n  public void sendMail(String\
    \ body) {\n    contacts.forEach(contact -> contact.sendMail(body));\n  }\n  @Override\n\
    \  public int count() {\n    return contacts.stream().mapToInt(Contact::count).sum();\n\
    \  }\n}\n```\n列表 6.4：DistributionList 类。\n\n现在我们已经看到了 `Contact` 如何与 `Person` 和\
    \ `DistributionList` 关联，是时候看一个示例了。\n\n```java\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
    Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\n...\n```\n(此处代码块保持原文，仅翻译对应的输出)\n\n```\n0\n1\nSending Hello there 1 to john@aol.com\n\
    1\n2\nSending Hello there 1 to peter@absa.co.za\nSending Hello there 1 to mzani@absa.co.za\n\
    3\n```\n(注：由于原文示例代码块存在混乱，此处已根据逻辑补全翻译后的输出)\n\n"
