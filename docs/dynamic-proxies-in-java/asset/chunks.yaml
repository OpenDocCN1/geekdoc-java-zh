  trans: "\n\n```java\n//:~ core/src/main/.../ch03/enhancedstream/EnhancedStreamHandler.java\n\
    public class EnhancedStreamHandler<T>\n    implements InvocationHandler {\n  private\
    \ Stream<T> delegate;\n\n  public EnhancedStreamHandler(Stream<T> delegate) {\n\
    \    this.delegate = delegate;\n  }\n\n  @Override\n  @SuppressWarnings(\"unchecked\"\
    )\n  public Object invoke(Object proxy, Method method,\n                     \
    \  Object[] args) throws Throwable {\n    if (method.getReturnType() == EnhancedStream.class)\
    \ {\n      if (method.equals(ENHANCED_DISTINCT)) {\n        distinct((ToIntFunction<T>)\
    \ args[0],\n            (BiPredicate<T, T>) args[1],\n            (BinaryOperator<T>)\
    \ args[2]);\n      } else if (method.equals(ENHANCED_DISTINCT_WITH_KEY)) {\n \
    \       distinct((Function<T, ?>) args[0],\n            (BinaryOperator<T>) args[1]);\n\
    \      } else {\n        Method match = methodMap.get(method);\n        this.delegate\
    \ = (Stream<T>) match.invoke(delegate, args);\n      }\n      return proxy;\n\
    \    } else {\n      return method.invoke(this.delegate, args);\n    }\n  }\n\n\
    \  private void distinct(ToIntFunction<T> hashCode,\n                        BiPredicate<T,\
    \ T> equals,\n                        BinaryOperator<T> merger) {\n    distinct(t\
    \ -> new Key<>(t, hashCode, equals), merger);\n  }\n  private void distinct(Function<T,\
    \ ?> keyGen,\n                        BinaryOperator<T> merger) {\n    delegate\
    \ = delegate.collect(Collectors.toMap(keyGen::apply,\n        Function.identity(),\
    \ merger, LinkedHashMap::new))\n                   .values()\n               \
    \    .stream();\n  }\n\n  private static final class Key<E> {\n    private final\
    \ E e;\n    private final ToIntFunction<E> hashCode;\n    private final BiPredicate<E,\
    \ E> equals;\n\n    public Key(E e, ToIntFunction<E> hashCode,\n             \
    \  BiPredicate<E, E> equals) {\n      this.e = e;\n      this.hashCode = hashCode;\n\
    \      this.equals = equals;\n    }\n\n    @Override\n    public int hashCode()\
    \ {\n      return hashCode.applyAsInt(e);\n    }\n\n    @Override\n    public\
    \ boolean equals(Object obj) {\n      if (!(obj instanceof Key)) return false;\n\
    \      @SuppressWarnings(\"unchecked\")\n      Key<E> that = (Key<E>) obj;\n \
    \     return equals.test(this.e, that.e);\n    }\n  }\n\n  private static final\
    \ Method ENHANCED_DISTINCT;\n  private static final Method ENHANCED_DISTINCT_WITH_KEY;\n\
    \n  static {\n    try {\n      ENHANCED_DISTINCT =\n          EnhancedStream.class.getMethod(\n\
    \              \"distinct\", ToIntFunction.class, BiPredicate.class,\n       \
    \       BinaryOperator.class);\n      ENHANCED_DISTINCT_WITH_KEY =\n         \
    \ EnhancedStream.class.getMethod(\n              \"distinct\", Function.class,\
    \ BinaryOperator.class);\n    } catch (NoSuchMethodException e) {\n      throw\
    \ new Error(e);\n    }\n  }\n\n  // methodMap contains a map from all non-static\
    \ Stream methods\n  // to the matching EnhancedStream methods\n  private static\
    \ final Map<Method, Method> methodMap =\n      Stream.of(Stream.class.getMethods())\n\
    \          .filter(m -> !Modifier.isStatic(m.getModifiers()))\n          .collect(Collectors.toUnmodifiableMap(\n\
    \              EnhancedStreamHandler::getEnhancedStreamMethod,\n             \
    \ Function.identity()));\n\n  // since EnhancedStream is a subclass of Stream,\
    \ it has to\n  // contain all the methods of Stream. We can safely do the\n  //\
    \ lookup, throwing an Error if we cannot find a method\n  private static Method\
    \ getEnhancedStreamMethod(Method m) {\n    try {\n      return EnhancedStream.class.getMethod(\n\
    \          m.getName(), m.getParameterTypes());\n    } catch (NoSuchMethodException\
    \ e) {\n      throw new Error(e);\n    }\n  }\n}\n```\n\n列表 3.32: `EnhancedStreamHandler<T>`。\n\
    \n例如，`EnhancedStreamDemo` 展示了当我们使用增强型流为 `ArrayDeque` 和 `ConcurrentSkipListSet`\
    \ 创建去重方法时发生的情况。\n\n```java\n//:~ core/src/main/.../ch03/enhancedstream/EnhancedStreamDemo.java\n\
    public class EnhancedStreamDemo {\n  public static void main(String... args) {\n\
    \    System.out.println(\"Normal ArrayDeque clone() Methods:\");\n    Stream.of(ArrayDeque.class.getMethods())\n\
    \        .filter(method -> method.getName().equals(\"clone\"))\n        .distinct()\n\
    \        .forEach(EnhancedStreamDemo::print);\n\n    System.out.println();\n\n\
    \    System.out.println(\"Distinct ArrayDeque:\");\n    EnhancedStream.of(ArrayDeque.class.getMethods())\n\
    \        .filter(method -> method.getName().equals(\"clone\"))\n        .distinct(HASH_CODE,\
    \ EQUALS, MERGE)\n        .forEach(EnhancedStreamDemo::print);\n\n    System.out.println();\n\
    \n    System.out.println(\"Normal ConcurrentSkipListSet:\");\n    Stream.of(ConcurrentSkipListSet.class.getMethods())\n\
    \        .filter(method -> method.getName().contains(\"Set\"))\n        .distinct()\n\
    \        .sorted(METHOD_COMPARATOR)\n        .forEach(EnhancedStreamDemo::print);\n\
    \n    System.out.println();\n\n    System.out.println(\"Distinct ConcurrentSkipListSet:\"\
    );\n    EnhancedStream.of(ConcurrentSkipListSet.class.getMethods())\n        .filter(method\
    \ -> method.getName().contains(\"Set\"))\n        .distinct(HASH_CODE, EQUALS,\
    \ MERGE)\n        .forEach(EnhancedStreamDemo::print);\n  }\n\n  private static\
    \ void print(Method m) {\n    System.out.println(\n        Stream.of(m.getParameterTypes())\n\
    \            .map(Class::getSimpleName)\n            .collect(Collectors.joining(\"\
    , \", m.getName() + \"(\", \")\"))));\n  }\n\n  public static final ToIntFunction<Method>\
    \ HASH_CODE =\n      method -> method.hashCode();\n\n  public static final BiPredicate<Method,\
    \ Method> EQUALS =\n      (method1, method2) ->\n          method1.getName().equals(method2.getName())\
    \ &&\n              method1.getParameterCount() == method2.getParameterCount()\
    \ &&\n              Arrays.equals(method1.getParameterTypes(),\n             \
    \     method2.getParameterTypes());\n\n  public static final BinaryOperator<Method>\
    \ MERGE =\n      (method1, method2) -> {\n        if (method1.getReturnType().isAssignableFrom(method2.getReturnType()))\n\
    \          return method2;\n        if (method2.getReturnType().isAssignableFrom(method1.getReturnType()))\n\
    \          return method1;\n        throw new IllegalArgumentException(\n    \
    \        \"Conflicting return types \"\n                method1.getReturnType().getCanonicalName()\
    \ +\n                \" and \" +\n                method2.getReturnType().getCanonicalName());\n\
    \      };\n\n  public static final Comparator<Method> METHOD_COMPARATOR =\n  \
    \    Comparator.comparing(Method::getName)\n          .thenComparing(method ->\n\
    \                             Arrays.toString(\n                             \
    \    method.getParameterTypes()));\n}\n```\n\n列表 3.33: `EnhancedStreamDemo`。\n\
    \n输出显示我们的 `EnhancedStream` 返回按名称和参数唯一的方法。此外，它总是保留返回类型更具体的方法。因此，`ArrayDeque clone()`\
    \ 和 `NavigableSet headSet(Object)` 被保留，而 `Object clone()` 和 `SortedSet headSet(Object)`\
    \ 被丢弃了。\n\n```\nNormal ArrayDeque clone() Methods:\n  ArrayDeque clone()\n  Object\
    \ clone()\n\nDistinct ArrayDeque:\n  ArrayDeque clone()\n\nNormal ConcurrentSkipListSet:\n\
    \  NavigableSet descendingSet()\n  NavigableSet headSet(Object, boolean)\n  SortedSet\
    \ headSet(Object)\n  NavigableSet headSet(Object)\n  NavigableSet subSet(Object,\
    \ boolean, Object, boolean)\n  NavigableSet subSet(Object, Object)\n  SortedSet\
    \ subSet(Object, Object)\n  NavigableSet tailSet(Object, boolean)\n  SortedSet\
    \ tailSet(Object)\n  NavigableSet tailSet(Object)\n\nDistinct ConcurrentSkipListSet:\n\
    \  NavigableSet descendingSet()\n  NavigableSet headSet(Object, boolean)\n  NavigableSet\
    \ headSet(Object)\n  NavigableSet subSet(Object, boolean, Object, boolean)\n \
    \ NavigableSet subSet(Object, Object)\n  NavigableSet tailSet(Object, boolean)\n\
    \  NavigableSet tailSet(Object)\n```\n\n列表 3.34: `EnhancedStreamDemo` 的输出。\n\n"
- fmt: "\nIn [The Java Specialists' Newsletter 274](https://www.javaspecialists.eu/archive/Issue274.html),\
    \ we read how one can handcraft an `EnhancedStream` decorator. It is mundane and\
    \ repetitive. We have to implement all the methods and painstakingly delegate\
    \ them. Our dynamic proxy solution has a single method, `invoke()`, with logic\
    \ for three different types of method.\n\nThere are some disadvantages with our\
    \ dynamic proxy approach. There might be a slight method-call overhead with some\
    \ of the proxied methods. For example, each time our return type is `EnhancedStream`,\
    \ we need to do a map lookup. We will learn in the next chapter how a specialized\
    \ type of map, which we call a `VTable`, can speed things up. For now, we can\
    \ bask in the satisfaction that we avoided repeating the same code snippet over\
    \ and over.\n\n## Restrictions with dynamic proxies\n\n### Interfaces only, please\n\
    \nOne of the biggest restrictions is that we can only proxy interfaces, because\
    \ they are derived from `java.lang.reflect.Proxy`. Java does not support multiple\
    \ class inheritance.\n\nWhen the classes belong to us, we can try to refactor\
    \ our classes to interfaces. This will not help us when we are trying to proxy\
    \ third-party classes.\n\nTools like `CGLib` can create dynamic proxies of classes,\
    \ but are not part of the standard JDK.\n\n### `UndeclaredThrowableException`\n\
    \nWhile the `invoke` method is defined to throw any `Throwable`, we are only allowed\
    \ to throw checked exceptions that are declared by the method we are proxying.\n\
    \n```java\n//:~ core/src/main/.../ch03/gotchas/UndeclaredExceptionThrown.java\n\
    public class UndeclaredExceptionThrown {\n  public static void main(String...\
    \ args) {\n    Runnable job = Proxies.castProxy(\n        Runnable.class,\n  \
    \      (proxy, method, params) -> {\n          // will be wrapped with an UndeclaredThrowableException\n\
    \          throw new IOException(\"bad exception\");\n        });\n    job.run();\n\
    \  }\n}\n```\n\nListing 3.35: `UndeclaredExceptionThrown`.\n\nWhen we call `run()`\
    \ on the `Runnable`, the checked `IOException` is wrapped in an unchecked `UndeclaredThrowableException`.\
    \ This only applies to checked exceptions that are not part of the method signature\
    \ of the proxied interface.\n\n```text\nException in \"main\" java.lang.reflect.UndeclaredThrowableException\n\
    \tat com.sun.proxy.$Proxy0.run(Unknown Source)\n\tat UndeclaredExceptionThrown.main()\n\
    Caused by: java.io.IOException: bad exception\n\tat UndeclaredExceptionThrown.lambda$main$0()\n\
    \t... 2 more\n```\n\nListing 3.36: Bad exception causes the unchecked `UndeclaredThrowableException`.\n\
    \n### Mystery `com.sun.proxy.Proxy$0` class\n\nAs mentioned, the names of the\
    \ proxy classes typically follow the naming convention of `com.sun.proxy.Proxy$0`\
    \ for public interfaces and `packagename.Proxy$0` for package-access interfaces.\
    \ When an interface is not exported from a module, the proxy is in a non-exported\
    \ package: for example, `com.sun.proxy.jdk.proxy1`.\n\n```java\n//:~ core/src/main/.../ch03/gotchas/ProxyNaming.java\n\
    public class ProxyNaming {\n  public interface PublicNotExported {\n    void open();\n\
    \  }\n  interface Hidden {\n    void mystery();\n  }\n  public static void main(String...\
    \ args) {\n    show(BaseComponent.class); // exported from module\n    show(PublicNotExported.class);\n\
    \    show(Hidden.class);\n  }\n  private static void show(Class<?> intf) {\n \
    \   System.out.println(Proxies.simpleProxy(\n        intf, null).getClass());\n\
    \  }\n}\n```\n\nListing 3.37: `ProxyNaming`.\n\nThe output most likely will be\
    \ what we see in Listing 3.38.\n\n```text\nclass com.sun.proxy.$Proxy0\nclass\
    \ com.sun.proxy.jdk.proxy1.$Proxy1\nclass eu.javaspecialists.books.dynamicproxies.ch03.gotchas.$Proxy2\n\
    ```\n\nListing 3.38: Output of `ProxyNaming`.\n\nThe Java Language Specification\
    \ does not declare that proxies must follow this naming convention, but this is\
    \ how OpenJDK currently does it. Note that when we make proxies of public interfaces,\
    \ the classes are added to the `com.sun.proxy` package. However, when we make\
    \ proxies of non-public interfaces, the classes have to be in the same package\
    \ as the interface — in our example, `eu.javaspecialists.books.dynamicproxies.ch03`.\n\
    \n### Deeper call stacks\n\nOur call stacks might also contain references to `$Proxy0`\
    \ and the reflective method invocations. IDEs like [IntelliJ IDEA](https://www.jetbrains.com/idea/)\
    \ might hide the gory details, as shown in Figure 9.\n\n![StackTraceFiltering](images/ch03/StackTraceFiltering.png)\n\
    \nFigure 9. Stack trace of proxied method call.\n\nHere is an example of a recursive\
    \ dynamic proxy to calculate factorial. In German, we would call this example\
    \ *“an den Haaren herbeigezogen”*, meaning that we have pulled it here by its\
    \ hair. In other words, it is a shockingly impractical way of writing factorial\
    \ code and is only meant to illustrate how a recursive dynamic proxy call could\
    \ possibly look. Please don’t write code like this!\n\n```java\n//:~ core/src/main/.../ch03/gotchas/RecursiveDynamicProxy.java\n\
    /**\n * Ridiculous example showing recursive proxy\n * calls. Please not code\
    \ like this!\n */\npublic class RecursiveDynamicProxy {\n  public static void\
    \ main(String... args) {\n    IntFunction<BigInteger> factorial =\n        Proxies.castProxy(IntFunction.class,\n\
    \            new Factorial());\n    System.out.println(factorial.apply(5));\n\
    \  }\n\n  private static class Factorial implements InvocationHandler {\n    private\
    \ final MethodKey apply =\n        MethodKey(IntFunction.class, \"apply\");\n\n\
    \    @Override\n    public Object invoke(Object proxy, Method method, Object[]\
    \ params) throws Throwable {\n      if (new MethodKey(method).equals(apply)) {\n\
    \        int n = (int) params[0];\n        if (n == 0) {\n          Thread.dumpStack();\n\
    \          return BigInteger.ONE;\n        }\n        BigInteger other = (BigInteger)\
    \ method.invoke(\n            proxy, n - 1);\n        return BigInteger.valueOf(n).multiply(other);\n\
    \      } else {\n        throw new UnsupportedOperationException(\n          \
    \  \"only apply(int) supported\");\n      }\n    }\n  }\n}\n```\n\nListing 3.39:\
    \ `RecursiveDynamicProxy`.\n\nThe output looks something like Listing 3.40. Some\
    \ details of the individual stack trace were omitted to make the output fit.\n\
    \n```text\njava.lang.Exception: Stack trace\n    at java.base/Thread.dumpStack()\n\
    \    at RecursiveDynamicProxy$Factorial.invoke()\n    at com.sun.proxy.$Proxy0.apply(Unknown\
    \ Source)\n    at java.base/NativeMethodAccessor.invoke0()\n    at java.base/NativeMethodAccessor.invoke()\n\
    \    at java.base/DelegatingMethodAccessor.invoke()\n    at java.base/Method.invoke()\n\
    \    at RecursiveDynamicProxy$Factorial.invoke()\n    at com.sun.proxy.$Proxy0.apply(Unknown\
    \ Source)\n    at java.base/NativeMethodAccessor.invoke0()\n    at java.base/NativeMethodAccessor.invoke()\n\
    \    at java.base/DelegatingMethodAccessor.invoke()\n    at java.base/Method.invoke()\n\
    \    at RecursiveDynamicProxy$Factorial.invoke()\n    at com.sun.proxy.$Proxy0.apply(Unknown\
    \ Source)\n    at java.base/NativeMethodAccessor.invoke0()\n    at java.base/NativeMethodAccessor.invoke()\n\
    \    at java.base/DelegatingMethodAccessor.invoke()\n    at java.base/Method.invoke()\n\
    etc.\n```\n\nListing 3.40: Deep call stack thanks to dynamic proxies and reflection.\n\
    \nThe extra lines in our stack traces are most likely only going to be a slight\
    \ nuisance. If they do cause a `StackOverflowError`, it would be appropriate to\
    \ either avoid dynamic proxies in that particular case or to increase the size\
    \ of the thread stack with the `-Xss` JVM parameter.\n\n#### Leaky Abstractions\n\
    \nDynamic proxies are currently treated as ordinary Java classes, albeit dynamically\
    \ created. This leaks the infrastructure code through to the user. It would be\
    \ better if it were possible to hide the classes from the user.\n"
