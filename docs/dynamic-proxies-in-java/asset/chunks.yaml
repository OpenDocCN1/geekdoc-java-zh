    \ {\n  System.out.println(name.toUpperCase());\n}\nSystem.out.println(names);\n\
    \n((Collection) names).add(42); // this will fail\n```\n\nListing 5.12: `BetterCollectionDynamicObjectAdapterDemo`.\n\
    \n```text\nMENONGAHELA\nLEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela,\
    \ Leander, Wolfgang, Klaus, Bobby Tables]--\nException in thread \"main\" java.lang.ClassCastException:\
    \ Attempt\nto insert class java.lang.Integer value into collection with\nvalue\
    \ type class java.lang.String\n  at BetterCollectionFactory$AdaptationObject.add\n\
    \      (BetterCollectionFactory.java)\n    ... etc.\n```\n\nListing 5.13: Output\
    \ from `BetterCollectionDynamicObjectAdapterDemo`.\n\nThanks to reflection, we\
    \ are able to avoid tightly coupling the adapter and adaptee classes. We also\
    \ only had to implement the part of the adapter that was changed.\n\nThe cost\
    \ of method calls has increased slightly, since each call is at least one `VTable`\
    \ lookup. As we will see later, this cost goes up a bit when we need to call default\
    \ interface methods.\n\n## Restrictions of adapter\n\nIn our approach to the dynamic\
    \ object adapter, neither the `adapter` nor the `adaptee` would typically implement\
    \ the `target` interface. We need to ensure that at least one public class in\
    \ the hierarchy has a public declaration of each method in the `target`. As convenient\
    \ as they would be, anonymous inner classes are package-protected and thus unsuitable\
    \ to use as adapters.\n\nConsider the class `AdapterPuzzle1`.\n\n```java\n//:~\
    \ core/src/main/.../ch05/AdapterPuzzle1.java\npublic class AdapterPuzzle1 {\n\
    \  public static void main(String... args) {\n    CharSequence seq =\n       \
    \ Proxies.adapt(CharSequence.class,\n            \"Good morning Vietnam\",\n \
    \           new Object() {\n              @Override\n              public String\
    \ toString() {\n                return \"Kilroy\";\n              }\n        \
    \      public int length() {\n                return 42;\n              }\n  \
    \          });\n    System.out.println(seq + \" \" + seq.length());\n  }\n}\n\
    ```\n\nListing 5.14: `AdapterPuzzle1`.\n\nWhich of the following is the output?:\n\
    \n- Good morning Vietnam 20\n- Good morning Vietnam 42\n- Good morning Vietnam\
    \ 6\n- Kilroy 20\n- Kilroy 42\n- Kilroy 6\n\nThe correct answer is “Kilroy 20”.\n\
    \nLet us try to figure out why.\n\nThe target interface is a `CharSequence`, the\
    \ `adaptee` is a `String`, and the `adapter` is an anonymous inner class that\
    \ is a subclass of `Object`.\n\nThe anonymous inner class is package-private,\
    \ so the method `length()` is not visible outside of the package. When we call\
    \ `length()`, we call the `String` method and get the value “20”.\n\nThe method\
    \ `toString()` is visible since it is inherited from the public class `Object`.\
    \ When we call `toString()`, the inner class’s `toString()` method is called,\
    \ returning the value “Kilroy”.\n\nNow consider the class `AdapterPuzzle2`.\n\n\
    ```java\n//:~ core/src/main/.../ch05/AdapterPuzzle2.java\npublic class AdapterPuzzle2\
    \ {\n  public interface LengthProvider {\n    int length();\n  }\n  public static\
    \ void main(String... args) {\n    CharSequence seq =\n        Proxies.adapt(CharSequence.class,\n\
    \            \"Good morning Vietnam\",\n            new LengthProvider() {\n \
    \             @Override\n              public String toString() {\n          \
    \      return \"Kilroy\";\n              }\n              @Override\n        \
    \      public int length() {\n                return 42;\n              }\n  \
    \          });\n    System.out.println(seq + \" \" + seq.length());\n  }\n}\n\
    ```\n\nListing 5.15: `AdapterPuzzle2`.\n\nSince we are implementing a public interface,\
    \ the `length()` method is visible to the adapter. The answer this time will be\
    \ a more consistent “Kilroy 42”.\n\n## Performance of dynamic-object-adapter method\
    \ calls\n\nPerforming several hash map lookups every time we call a method on\
