    ```\n\n列表 3.10：`$Proxy0` 类的外观。\n\n我们可以看到，动态代理并不是魔法。\n\n## 加速反射方法\n\n传递给 `InvocationHandler`\
    \ 的 `invoke()` 方法的参数之一是所调用的 `Method`。我们经常需要使用反射来调用这个 `Method`，并希望尽可能快。由于代理实现了公共方法，我们还知道存储在动态代理类中的任何\
    \ `Method` 字段也是公共的。公共方法是可访问的，但遗憾的是，反射会遭受“健忘症”。每次我们在 `Method` 对象上调用 `invoke()`\
    \ 时，它都会从栈检查调用类是谁以及它是否具有正确的权限。我们可以通过对每个 `Method` 字段调用 `setAccessible(true)` 来关闭此检查。这减少了使用反射时的方法调用开销。\n\
    \n例如，这里是我们的 `MethodTurboBooster`。如果由于某种原因得到了异常，我们将返回原始代理对象。默认开启了加速功能，但我们可以通过 `-Deu.javaspecialists.books.dynamicproxies.util.MethodTurboBooster.disabled=true`\
    \ 禁用它。\n\n```java\n//:~ core/src/main/.../util/MethodTurboBooster.java\n/**\n\
    \ * 默认开启方法加速。我们对 Method 对象调用了\n * setAccessible(true)。异常会被静默忽略。\n * <p>\n * 可以通过以下\n\
    \ * -Deu.javaspecialists.books.dynamicproxies.util.\\\n * MethodTurboBooster.disabled=true\
    \ 禁用方法加速。\n */\npublic final class MethodTurboBooster {\n  private final static\
    \ Booster BOOSTER =\n      Boolean.getBoolean(\n          MethodTurboBooster.class.getName()\
    \ + \".disabled\") ?\n          new BoosterOff() : new BoosterOn();\n\n  public\
    \ static <E> E boost(E proxy) {\n    return BOOSTER.turboBoost(proxy);\n  }\n\n\
    \  public static Method boost(Method method) {\n    return BOOSTER.turboBoost(method);\n\
    \  }\n\n  private interface Booster {\n    <E> E turboBoost(E proxy);\n    Method\
    \ turboBoost(Method method);\n  }\n\n  private static class BoosterOn implements\
    \ Booster {\n    @Override\n    public <E> E turboBoost(E proxy) {\n      if (!(proxy\
    \ instanceof Proxy))\n        throw new IllegalArgumentException(\n          \
    \  \"只能对 Proxy 实例进行加速\"\n        );\n      try {\n        for (var field : proxy.getClass().getDeclaredFields())\
    \ {\n          if (field.getType() == Method.class) {\n            field.setAccessible(true);\n\
    \            turboBoost((Method) field.get(proxy));\n          }\n        }\n\
    \        return proxy;\n      } catch (IllegalAccessException | RuntimeException\
    \ e) {\n        // 无法加速 -返回原始对象\n}      }\n    }\n    @Override\n    public Method\
    \ turboBoost(Method method) {\n      try {\n        method.setAccessible(true);\n\
    \      } catch (RuntimeException e) {\n        // 无法加速 -返回原始方法\n      }\n    \
    \  return method;\n    }\n  }\n\n  private static class BoosterOff implements\
    \ Booster {\n    @Override\n    public <E> E turboBoost(E proxy) {\n      return\
    \ proxy;\n    }\n\n    @Override\n    public Method turboBoost(Method method)\
    \ {\n      return method;\n    }\n  }\n}\n```\n\n列表 3.11：`MethodTurboBooster`。\n\
    \n## 解包装 `InvocationTargetException`\n\n`InvocationHandler.invoke()` 声明抛出 `Throwable`，但正如我们在\
    \ `$Proxy0` 类中所看到的，任何异常会被封装在 `UndeclaredThrowableException` 中。考虑列表 3.12 中的代码。仔细检查代码可以发现我们在反射调用\
    \ `method.invoke()` 中反转了比较。因此，我们正在将 `String` 与我们的代理进行比较，这将导致 `ClassCastException`。\n\
    \n```java\n//:~ core/src/main/.../ch03/gotchas/RecastingBroken.java\nComparable<String>\
    \ comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n        Comparable.class.getClassLoader(),\n\
    \        new Class<?>[] {Comparable.class},\n        (proxy, method, params) ->\n\
    \            method.invoke(params[0], proxy));\nSystem.out.println(comp.compareTo(\"\
    hello\"));\n```\n\n列表 3.12：`RecastingBroken`。\n\n当我们运行这段代码时，看到的而是三个链在一起的异常。\n\n\
    ```\nException in thread \"main\" java.lang.reflect.UndeclaredThrowableException\n\
    \tat com.sun.proxy.$Proxy0.compareTo(Unknown Source)\n\tat ...ch03.gotchas.RecastingBroken.main\n\
    Caused by: java.lang.reflect.InvocationTargetException\n\tat ...\n\tat ...ch03.gotchas.RecastingBroken.lambda$main$0\n\
    Caused by: java.lang.ClassCastException: class com.sun.proxy.$Proxy0\n     cannot\
    \ 转换为 class java.lang.String\n```\n\n列表 3.13：来自 `RecastingBroken` 的输出。\n\n如果我们直接抛出\
    \ `ClassCastException`，由于它是 `RuntimeException`，我们的代理代码将将其传递给调用者。因此，如果我们在 `InvocationHandler.handle()`\
    \ 方法中使用反射，我们需要抛出包含在 `InvocationTargetException` 内部异常。为了方便起见，我们在列表 3.14 中编写了一个\
    \ `ExceptionUnwrappingInvocationHandler`。\n\n"
- fmt: "\n```java\n//:~ core/src/main/.../handlers/ExceptionUnwrappingInvocationHandler.java\n\
    public final class ExceptionUnwrappingInvocationHandler\n    implements InvocationHandler,\
    \ Serializable {\n  private static final long serialVersionUID = 1L;\n  private\
    \ final InvocationHandler handler;\n  public ExceptionUnwrappingInvocationHandler(\n\
    \      InvocationHandler handler) {\n    this.handler = handler;\n  }\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    try {\n      return handler.invoke(proxy, method,\
    \ args);\n    } catch (InvocationTargetException ex) {\n      throw ex.getCause();\n\
    \    }\n  }\n  public InvocationHandler getNestedInvocationHandler() {\n    return\
    \ handler;\n  }\n}\n```\n\nListing 3.14: `ExceptionUnwrappingInvocationHandler`.\n\
    \nApplying this to our previous example from Listing 3.12 is a minimal amount\
    \ of work. We simply wrap our `InvocationHandler`.\n\n```java\n//:~ core/src/main/.../ch03/gotchas/RecastingExceptionsFixed.java\n\
    Comparable<String> comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n\
    \        Comparable.class.getClassLoader(),\n        new Class<?>[] {Comparable.class},\n\
    \        new ExceptionUnwrappingInvocationHandler(\n            (proxy, method,\
    \ params) ->\n                method.invoke(params[0], proxy)));\nSystem.out.println(comp.compareTo(\"\
    hello\"));\n```\n\nListing 3.15: `RecastingExceptionsFixed`.\n\nThis time, when\
    \ we run it, the output is a single `ClassCastException`. Just what the doctor\
    \ ordered!\n\n```\nException in thread \"main\" java.lang.ClassCastException:\
    \ class\n      com.sun.proxy.$Proxy0 cannot be cast to class java.lang.String\n\
    \tat java.base/java.lang.String.compareTo(String.java:134)\n    at ...\n```\n\n\
    Listing 3.16: Output from `RecastingExceptionsFixed`.\n\n## Casting\n\nThis section\
    \ contains static factory methods that we will use throughout the rest of this\
    \ book.\n\nIn Listing 3.6, we had to manually cast the proxy instance to `Map<String,\
    \ Integer>`. But casting is so last millennium. Instead, generics can do the cast\
    \ for us.\n\n```java\n//:~ core/src/main/.../Proxies.java\n/**\n * @param intf\
    \    The interface to implement and cast to\n * @param handler InvocationHandler\
    \ for all methods\n */\n@SuppressWarnings(\"unchecked\")\npublic static <S> S\
    \ castProxy(Class<? super S> intf,\n                              InvocationHandler\
    \ handler) {\n  Objects.requireNonNull(intf, \"intf==null\");\n  Objects.requireNonNull(handler,\
    \ \"handler==null\");\n  return MethodTurboBooster.boost(\n      (S) Proxy.newProxyInstance(\n\
    \          intf.getClassLoader(),\n          new Class<?>[] {intf},\n        \
    \  new ExceptionUnwrappingInvocationHandler(handler)));\n}\n```\n\nListing 3.17:\
    \ `Proxies.castProxy()`.\n\nTo demonstrate, we also define `Proxies.simpleProxy()`\
    \ to create dynamic proxies that delegate all method calls to the wrapped object.\n\
    \n```java\n//:~ core/src/main/.../Proxies.java\npublic static <S> S simpleProxy(\n\
    \    Class<? super S> subjectInterface, S subject) {\n  return castProxy(subjectInterface,\n\
    \      (InvocationHandler & Serializable)\n          (proxy, method, args) ->\
    \ method.invoke(subject, args)\n  );\n}\n```\n\nListing 3.18: `Proxies.simpleProxy()`.\n\
    \nWe’ll now use this with our `RealISODateParser` class in Listing 3.19 that implements\
    \ our `ISODateParser` interface from Listing 3.7.\n\n```java\n//:~ core/src/main/.../ch03/RealISODateParser.java\n\
    public class RealISODateParser implements ISODateParser {\n  private static final\
    \ DateTimeFormatter formatter =\n      DateTimeFormatter.ISO_LOCAL_DATE;\n  @Override\n\
    \  public LocalDate parse(String date) throws ParseException {\n    try {\n  \
    \    return LocalDate.parse(date, formatter);\n    } catch (DateTimeParseException\
    \ e) {\n      throw new ParseException(e.toString(), e.getErrorIndex());\n   \
    \ }\n  }\n\n  @Override\n  public String toString() {\n    return getClass().getSimpleName();\n\
    \  }\n}\n```\n\nListing 3.19: `RealISODateParser` example.\n\nTo create our dynamic\
    \ proxy, we call the `Proxies.simpleProxy()` method and pass in the interface\
    \ that we are looking to implement, as well as the object that we would like to\
    \ wrap. The generic specification of `simpleProxy(Class<? super S> subjectInterface,\
    \ S subject)`, ensures that the instance `subject` matches the interface. We use\
    \ the `castProxy()` method to internally do the casting for us.\n\n```java\n//:~\
    \ core/src/main/.../ch03/DynamicProxies.java\nISODateParser parser = Proxies.simpleProxy(\n\
    \    ISODateParser.class, new RealISODateParser());\nLocalDate palindrome = parser.parse(\"\
    2020-02-02\");\nSystem.out.println(\"palindrome = \\\"\" + palindrome + \"\\\"\
    \");\nSystem.out.println(parser);\nLocalDate funnyDate = parser.parse(\"2020-04-31\"\
    );\n```\n\nListing 3.20: Using `Proxies` to create a simple proxy.\n\n```\npalindrome\
    \ = \"2020-02-02\"\nRealISODateParser\nException in thread \"main\" java.time.format.DateTimeParseException:\
    \ 2020-04-31\n```\n\nListing 3.21: Output from simple proxy.\n\n## Virtual proxy\n\
    \nIn our handcrafted proxy in Listing 2.3, we forgot to proxy `toString()`. With\
    \ dynamic proxies, we can create a `VirtualProxyHandler` that takes `Supplier<?\
    \ extends S>` as a parameter.\n\n```java\n//:~ core/src/main/.../handlers/VirtualProxyHandler.java\n\
    public final class VirtualProxyHandler<S>\n    implements InvocationHandler, Serializable\
    \ {\n  private static final long serialVersionUID = 1L;\n  private final Supplier<?\
    \ extends S> subjectSupplier;\n  private S subject;\n\n  public VirtualProxyHandler(\n\
    \      Supplier<? extends S> subjectSupplier) {\n    this.subjectSupplier = subjectSupplier;\n\
    \  }\n  private S getSubject() {\n    if (subject == null) subject = subjectSupplier.get();\n\
    \    return subject;\n  }\n  @Override\n  public Object invoke(Object proxy, Method\
    \ method,\n                       Object[] args) throws Throwable {\n    return\
    \ method.invoke(getSubject(), args);\n  }\n}\n```\n\nListing 3.22: `VirtualProxyHandler`.\n\
    \nWe can add a static factory method to our `Proxies` façade.\n\n```java\n//:~\
    \ core/src/main/.../Proxies.java\npublic static <S> S virtualProxy(\n    Class<?\
    \ super S> subjectInterface,\n    Supplier<? extends S> subjectSupplier) {\n \
    \ Objects.requireNonNull(subjectSupplier,\n      \"subjectSupplier==null\");\n\
    \  return castProxy(subjectInterface,\n      new VirtualProxyHandler<>(subjectSupplier));\n\
    }\n```\n\nListing 3.23: `Proxies.virtualProxy()`.\n\nOur virtual proxy test now\
    \ creates the `CustomMap` with `Proxies.virtualProxy(CustomMap.class, CustomHashMap::new)`.\n\
    \n```java\n//:~ core/src/main/.../ch03/virtual/VirtualProxyDemo.java\nCustomMap<String,\
    \ Integer> map =\n    Proxies.virtualProxy(CustomMap.class,\n        CustomHashMap::new);\n\
    System.out.println(\"Virtual Map created\");\nmap.put(\"one\", 1); // creating\
    \ CustomHashMap as side effect\nmap.put(\"life\", 42);\nSystem.out.println(\"\
    map.get(\\\"life\\\") = \" + map.get(\"life\"));\nSystem.out.println(\"map.size()\
    \ = \" + map.size());\nSystem.out.println(\"clearing map\");\nmap.clear();\nSystem.out.println(\"\
    map.size() = \" + map.size());\n```\n\nListing 3.24: `VirtualProxyDemo`.\n\nThe\
    \ output is exactly the same as with our handcrafted virtual proxy in Listing\
    \ 2.5.\n\n## Synchronized dynamic proxy\n\nInstead of handcrafting a synchronized\
    \ protection proxy like we did in Listing 2.15, we can write a `SynchronizedHandler`.\
    \ This synchronizes all calls to methods on our `subject`, using `proxy` as our\
    \ monitor lock.\n"
