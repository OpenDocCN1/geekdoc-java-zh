  trans: "\n默认接口方法的调用方式略有不同。它们不是在接收者对象上调用的，而是在传入 `invoke()` 方法的 `proxy` 参数上调用的。因此，我们的\
    \ `VTableDefaultMethodsHandler` 仅通过查找默认接口方法的 `vtable` 和链中的 `next` 处理器来构建。很有可能，这个处理器将是链中的最后一个。\n\
    \n如果我们在 `vtable` 中找到了默认接口方法的匹配项，我们将使用我们的 `proxy` 参数和提供的 `args` 数组调用 `MethodHandle`。\n\
    \n与我们在 `VTableHandler` 中的做法类似，我们还需要从流中过滤掉任何该处理器匹配到的方法。\n\n```java\n//:~ core/src/main/.../util/chain/VTableDefaultMethodsHandler.java\n\
    public final class VTableDefaultMethodsHandler\n    extends ChainedInvocationHandler\
    \ {\n  private final VTable vtable;\n  public VTableDefaultMethodsHandler(\n \
    \     VTable vtable, ChainedInvocationHandler next) {\n    super(next);\n    this.vtable\
    \ = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public Object invoke(Object\
    \ proxy, Method method,\n                       Object[] args) throws Throwable\
    \ {\n    MethodHandle match = vtable.lookupDefaultMethod(method);\n    if (match\
    \ != null)\n      return match.invoke(proxy, args);\n    return super.invoke(proxy,\
    \ method, args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
    \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
    \               .filter(\n                   method -> vtable.lookupDefaultMethod(method)\n\
    \                                 == null);\n  }\n}\n```\n\n列表 4.23: `VTableDefaultMethodsHandler`。\n\
    \n细心的读者会注意到，之前的两个类看起来非常相似。为了好玩，我们使用泛型和 lambda 将这两种查找方法统一为了一个。它行得通，但在书中解释起来会更具挑战性。代码位于我们\
    \ GitHub 上 [dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples)\
    \ 仓库的 `core/src/test/…​/util/chain` 包中。\n\n# 动态对象适配器\n\n## Rapper 包装器 (Rapper\
    \ wrappers)\n\n想象一个歌手的类层次结构：低音、男中音和高音。他们都属于一个合唱团。\n\nCacophony 是希腊语，意为“难听的声音”。![歌手](img/Singers.jpg)\n\
    \n现在想象一个 rapper 站在合唱团旁边，显得孤孤伶单。这个 rapper 想要加入合唱团，但不能。只允许歌手，抱歉。\n\n![合唱团](img/Choir.png)\n\
    \n图 11。一个带有歌手的合唱团结构。孤单的 rapper 在旁观察。\n\n我们如何让这个 rapper 变成歌手呢？有些人会说这是不可能的。rapper\
    \ 在说话，歌手在唱歌。结束。\n\n但让我们暂时抛开对说唱音乐质量的感受。我们同时也假设我们无法更改 `Rapper` 类。\n\n### 类适配器模式\
    \ (Class adapter pattern)\n\n创建 rapper 包装器最简单的方法是使用类适配器模式。我们创建一个实现 `Singer` 并扩展\
    \ `Rapper` 的 `SingingRapper`。在 `sing()` 方法中，我们调用 `talk()`。\n\n![SingingRapperClassAdapter](img/SingingRapperClassAdapter.png)\n\
    \n图 12。一个会唱歌会说话的 rapper。\n\n我们的 `SingingRapper` 扩展了 `Rapper`，使其既是 rapper 又是歌手。如果只有一种\
    \ `Rapper` 类型，这种方法运行良好，但 rapper 类型的列表似乎是无尽的：东海岸、西海岸、boom bap、drill、emo rap、mumble\
    \ rap、gangsta、trap……列表没完没了。看起来是一个很好的低代码解决方案，结果发现需要几十个类似的类，每种独特的 rap 风格一个类。\n\n\
    ### 对象适配器模式 (Object adapter pattern)\n\n对象适配器模式将 rapper 作为构造函数参数，并将 `sing()` 方法委托给其\
    \ rapper 的 `talk()` 方法。我们可以接受任何 `Rapper` 的子类作为参数，甚至是 `MumbleRapper`。我们的 rapper\
    \ 包装器现在实现了 `Singer`，但没有扩展 `Rapper`，所以它不是 rapper。我们可以调用 `sing()`，但 `talk()` 不再可见了。\n\
    \n![SingingRapperObjectAdapter](img/SingingRapperObjectAdapter.png)\n\n图 13。将\
    \ rapper 变成歌手。\n\n对象适配器模式似乎是两者中更好的选择。但如果 `Rapper` 和 `Singer` 许多许多共同方法，例如 `clap()`、`bow()`\
    \ 和 `dance()` 呢？使用类适配器模式时，我们只需要实现 `sing()` 方法。而对象适配器模式则要求我们委托所有方法。当目标接口非常丰富时，这可能会变得繁琐。\n\
    \n## 更好的 ArrayList\n\n当我们创建一个 `ArrayList<String>` 时，我们费力指定了它包含 `String`。然而，为了保持类文件格式的向后兼容性，这些信息从类中被擦除了。`ArrayList`\
    \ 类并不知道泛型类型参数是什么。如果我们调用 `toArray()`，返回的是一个 `Object[]`，尽管我们声明了集合包含 `String`。\n\n\
    Java 5 引入了协变返回类型（covariant return types）。被重写的方法可以返回父方法返回类型的子类。因此，`ArrayList` 的子类可以返回\
    \ `Object` 的子类。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayList.java\n\
    public class BetterArrayList<E> extends ArrayList<E> {\n  private final E[] seedArray;\n\
    \n  public BetterArrayList(E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\"seedArray must be empty\");\n    this.seedArray\
    \ = seedArray;\n  }\n\n  @Override\n  public E[] toArray() {\n    // NOTE: Shipilev\
    \ showed that this is the fastest way\n    // create a typed array from a collection:\n\
    \    // https://shipilev.net/blog/2016/arrays-ancients/\n    return toArray(seedArray);\n\
    \  }\n\n  @Override\n  public String toString() {\n    return \"--\" + super.toString()\
    \ + \"--\";\n  }\n}\n```\n\n列表 5.1: `BetterArrayList`。列表 5.2 展示了使用此类的某种方法。我们传入了\
    \ `new String[0]`，它随后用于创建正确的类型。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayListDemo.java\n\
    BetterArrayList<String> names =\n    new BetterArrayList<>(new String[0]);\nnames.add(\"\
    Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
    Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
    for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
    System.out.println(names);\n```\n\n列表 5.2: `BetterArrayListDemo`。输出在列表 5.3 中。\n\
    \n```\nWOLFGANG\nLEANDER\nBOBBY TABLES\nKLAUS\nMENONGAHELA\n--[Wolfgang, Bobby\
    \ Tables, Leander, Klaus, Menongahela]--\n```\n\n列表 5.3: `BetterArrayListDemo`\
    \ 的输出。\n\n## BetterCollection 接口\n\n另一种方法是扩展 `Collection` 接口并重写 `toArray()` 方法以返回正确的类型。列表\
    \ 5.4 展示了该接口的形式：\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollection.java\n\
    public interface BetterCollection<E> extends Collection<E> {\n  @Override\n  E[]\
    \ toArray();\n  default void forEachFiltered(Predicate<? super E> predicate,\n\
    \                               Consumer<? super E> action) {\n    Objects.requireNonNull(predicate,\
    \ \"predicate==null\");\n    Objects.requireNonNull(action, \"action==null\");\n\
    \    for (E e : this) {\n      if (predicate.test(e)) action.accept(e);\n    }\n\
    \  }\n}\n```\n\n列表 5.4: `BetterCollection`。\n\n使用类适配器时生活是美好的。为了制作一个更好的 `ConcurrentSkipListSet`，我们可以扩展这个类并实现\
    \ `BetterCollection`。代码看起来与 `BetterArrayList` 相似。\n"
- fmt: "\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterConcurrentSkipListSet.java\n\
    public class BetterConcurrentSkipListSet<E>\n    extends ConcurrentSkipListSet<E>\n\
    \    implements BetterCollection<E> {\n  private final E[] seedArray;\n  public\
    \ BetterConcurrentSkipListSet(E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\n          \"seedArray must be empty\"\
    );\n    this.seedArray = seedArray;\n  }\n  @Override\n  public E[] toArray()\
    \ {\n    return toArray(seedArray);\n  }\n  @Override\n  public String toString()\
    \ {\n    return \"--\" + super.toString() + \"--\";\n  }\n}\n```\n\nListing 5.5:\
    \ `BetterConcurrentSkipListSet`.\n\nWe can see that the class adapter, while needing\
    \ only a few lines of code, does have some disadvantages. Firstly, we must subclass\
    \ each concrete collection individually. This might take a while. In Java 13,\
    \ `Collection` has 277 subclasses in the JDK alone!\n\nSecondly, we can only extend\
    \ classes where we control the construction. For example, to construct a concurrent\
    \ `HashSet` in Java, we use the `ConcurrentHashMap.newKeySet()` static factory\
    \ method. This returns `KeySetView`, a public static inner class of `ConcurrentHashMap`\
    \ with a package-access constructor. Since the constructor is not accessible,\
    \ we cannot extend `KeySetView`, ergo we cannot use the class adapter pattern\
    \ to make it into a `BetterCollection`.\n\nInstead, we can write an object adapter\
    \ that implements `BetterCollection` and wraps a `Collection` adaptee. Note that\
    \ we then have to implement all the methods from `Collection`. Rather tedious,\
    \ no?\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapter.java\n\
    public class BetterCollectionObjectAdapter<E>\n    implements BetterCollection<E>\
    \ {\n  private final Collection<E> adaptee;\n  private final E[] seedArray;\n\n\
    \  public BetterCollectionObjectAdapter(Collection<E> adaptee,\n             \
    \                          E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\n          \"seedArray must be empty\"\
    );\n\n    this.adaptee = adaptee;\n    this.seedArray = seedArray;\n  }\n\n  @Override\n\
    \  public E[] toArray() {\n    return adaptee.toArray(seedArray);\n  }\n\n  @Override\n\
    \  public String toString() {\n    return \"--\" + adaptee.toString() + \"--\"\
    ;\n  }\n\n  // this is a typical problem with the object adapter design\n  //\
    \ pattern - we have to implement all the methods ::-\n  @Override\n  public int\
    \ size() {\n    return adaptee.size();\n  }\n\n  @Override\n  public boolean isEmpty()\
    \ {\n    return adaptee.isEmpty();\n  }\n\n  @Override\n  public boolean contains(Object\
    \ o) {\n    return adaptee.contains(o);\n  }\n\n  @Override\n  public Iterator<E>\
    \ iterator() {\n    return adaptee.iterator();\n  }\n\n  @Override\n  public <T>\
    \ T[] toArray(T[] ts) {\n    return adaptee.toArray(ts);\n  }\n\n  @Override\n\
    \  public boolean add(E e) {\n    return adaptee.add(e);\n  }\n\n  @Override\n\
    \  public boolean remove(Object o) {\n    return adaptee.remove(o);\n  }\n\n \
    \ @Override\n  public boolean containsAll(Collection<?> c) {\n    return adaptee.containsAll(c);\n\
    \  }\n\n  @Override\n  public boolean addAll(Collection<? extends E> es) {\n \
    \   return adaptee.addAll(es);\n  }\n\n  @Override\n  public boolean removeAll(Collection<?>\
    \ c) {\n    return adaptee.removeAll(c);\n  }\n\n  @Override\n  public boolean\
    \ retainAll(Collection<?> c) {\n    return adaptee.retainAll(c);\n  }\n\n  @Override\n\
    \  public void clear() {\n    adaptee.clear();\n  }\n}\n```\n\nListing 5.6: `BetterCollectionObjectAdapter`.\n\
    \nOur object adapter works and we can use it to adapt any collection. Here, we\
    \ are wrapping the `ConcurrentHashMap.newKeySet()`.\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapterDemo.java\n\
    BetterCollection<String> names =\n    new BetterCollectionObjectAdapter<>(\n \
    \       ConcurrentHashMap.newKeySet(),\n        new String[0]\n    );\nnames.add(\"\
    Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
    Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
    for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
    System.out.println(names);\n```\n\nListing 5.7: `BetterCollectionObjectAdapterDemo`.\n\
    \n```\nMENONGAHELA\nLEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela, Leander,\
    \ Wolfgang, Klaus, Bobby Tables]--\n```\n\nListing 5.8: Output from `BetterCollectionObjectAdapterDemo`.\n\
    \nIt works, but…... well… — if we want to now have a better `Set`, `List`, `SortedSet`,\
    \ `ConcurrentMap`, `Map`, or even `java.sql.Connection`,\n\n## Dynamic adapter\
    \ using dynamic proxies\n\nAs stated before, the class structures of proxy and\
    \ object adapter are similar. Can we create a dynamic object adapter? The static\
    \ factory method for our dynamic object adapter takes the following:\n\n- `Class<E>\
    \ target` is the interface class that we want to adapt to. for example, `BetterCollection`.\n\
    - `Object adaptee` is the object we want our new interface to wrap, for example,\
    \ `ArrayList<String>`.\n- `Object adapter` is an object that contains the methods\
    \ that should be used.\n\nOur `ObjectAdapterHandler` creates `VTables` for the\
    \ adapter, adaptee, and default methods and arranges them in a chain.\n\n```java\n\
    //:~ core/src/main/.../handlers/ObjectAdapterHandler.java\npublic final class\
    \ ObjectAdapterHandler\n    implements InvocationHandler {\n  private final ChainedInvocationHandler\
    \ chain;\n\n  public ObjectAdapterHandler(Class<?> target,\n                 \
    \             Object adaptee,\n                              Object adapter) {\n\
    \    VTable adapterVT = VTables.newVTable(adapter.getClass(), target);\n    VTable\
    \ adapteeVT =\n        VTables.newVTable(adaptee.getClass(), target);\n    VTable\
    \ defaultVT = VTables.newMethodVTable(target);\n\n    chain = new VTableHandler(adapter,\
    \ adapterVT,\n        new VTableHandler(adapteeVT,\n            new VTableDefaultMethodsHandler(defaultVT,\
    \ null)));\n\n    chain.checkAllMethodsAreHandled(target);\n  }\n\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    return chain.invoke(proxy, method, args);\n  }\n\
    }\n```\n\nListing 5.9: `ObjectAdapterHandler`.\n\nWe add another static factory\
    \ method to our ubiquitous `Proxies` class, which will create an object adapter\
    \ based on the above `InvocationHandler`.\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
    public static <T> T adapt(Class<? super T> target,\n                         \
    \ Object adaptee,\n                          Object adapter) {\n  Objects.requireNonNull(adaptee,\
    \ \"adaptee==null\");\n  Objects.requireNonNull(adapter, \"adapter==null\");\n\
    \  return castProxy(target,\n      new ObjectAdapterHandler(target, adaptee, adapter));\n\
    }\n```\n\nListing 5.10: `Proxies.adapt()`.\n\nFor example, to create a `BetterCollectionFactory`,\
    \ we can make an adapter that first creates the correct type of array in the `toArray()`\
    \ method. It then changes the `add()` function to verify that the type of object\
    \ is correct, similar to how `Collections.checkedCollection()` works.\n"
