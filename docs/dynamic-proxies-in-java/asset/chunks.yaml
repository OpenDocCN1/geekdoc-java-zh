  trans: "\n\n在写作时，[JEP 371](https://openjdk.java.net/jeps/371) 的目标是 Java 15，并建议引入\
    \ `hidden classes`（隐藏类）。这些类无法被其他类的字节码直接使用，而是通过框架代码通过反射来访问。\n\n`hidden classes`\
    \ 有许多优点：它们的方法不会出现在堆栈跟踪轨迹中。它们更容易被卸载。访问控制更加精细且严格。\n\n### 共享代理类\n\nJava 试图尽量减少其创建的动态代理类的数量。每当我们调用\
    \ `Proxy.newProxyInstance()` 时，它都会检查之前是否已经为给定的类加载器和目标接口组合创建过动态代理。接口在数组内部存储的顺序是有重要的。如果找到了动态代理类，则将使用它来创建代理对象。`InvocationHandler`\
    \ 总是被传递给 `java.lang.reflect.Proxy` 超类，所有的动态代理类都派生自该类。\n\n例如，考虑列表 3.41 中的 `ProxyClassesByInterface`。`Collection`\
    \ 继承自 `Iterable`，因此我们可以认为由 `Collection` 和 `Iterable` 组合成的代理等同于仅包含 `Collection`\
    \ 的代理。然而，我们看到对于每种接口组合，都会创建唯一的代理类。\n\n```\n//:~ core/src/main/.../ch03/gotchas/ProxyClassesByInterface.java\n\
    public class ProxyClassesByInterface {\n  static final InvocationHandler BLANK\
    \ = (p, m, a) -> null;\n  public static void main(String... args) {\n    test(Iterable.class,\
    \ Collection.class); // $Proxy0\n    test(Iterable.class, Collection.class); //\
    \ $Proxy0\n    test(Iterable.class); // $Proxy1\n    test(Collection.class); //\
    \ $Proxy2\n    test(Collection.class, Iterable.class); // $Proxy3\n    test(Iterable.class,\
    \ Collection.class); // $Proxy0\n  }\n  private static void test(Class<?>... targetInterfaces)\
    \ {\n    Object proxy = Proxy.newProxyInstance(\n        ProxyClassesByInterface.class.getClassLoader(),\n\
    \        targetInterfaces,\n        BLANK\n    );\n    System.out.println(proxy.getClass());\n\
    \  }\n}\n```\n\n列表 3.41：`ProxyClassesByInterface`。\n\nJava 在其动态代理类的缓存中使用弱引用，以确保我们不会发生类加载器泄漏。\n\
    \n### 动态代理的性能\n\n动态代理属于基础设施和框架代码领域。我们的动态代码极有可能被调用数十亿次。因此，了解如何对这类代码进行基准测试并确保它们运行足够快至关重要。\n\
    \n调用动态代理的方法可能较慢，原因有几点：\n\n*   原始返回类型和参数需要装箱为相应的包装对象。当原始值超出它们的缓存范围时，这可能会增加对象创建的开销。\n\
    *   参数需要封装进数组。如果该数组逃逸了 `InvocationHandler.invoke()` 方法，则可能无法通过逃逸分析被消除。\n*   `Method`\
    \ 类存在健忘症问题——它在每次调用时都会检查权限。我们尝试通过列表 3.11 所示的加速（turbo-boost）机制来消除这种代价。\n*   所有动态代理都派生自单一的\
    \ `java.lang.reflect.Proxy` 类，该类存储了我们 `InvocationHandler` 的引用。当一个字段始终持有接口的一种实现时，调用该字段值上方法的调用点是单态的（monomorphic），而不是多态的（polymorphic）。HotSpot\
    \ 编译器对单态和双态有优化。对于单态，编译器可以在运行时内联方法调用。然而，由于动态代理可以持有 `InvocationHandler` 的多个实现之一，HotSpot\
    \ 可能无法内联到 `invoke()` 方法调用，从而使其变为元态的（megamorphic）。关于多态性能的更多信息，请参阅 [The Java Specialists'\
    \ Newsletter](https://www.javaspecialists.eu/) 中的 [“Polymorphism Performance Mysteries”](https://www.javaspecialists.eu/archive/Issue157.html)\
    \ 和 [“Polymorphism Performance Mysteries Explained”](https://www.javaspecialists.eu/archive/Issue158.html)。\n\
    \n想要编写性能关键代码的程序员需要知道如何对代码进行基准测试。运行基准测试的推荐工具是 [Java Microbenchmark Harness](https://openjdk.java.net/projects/code-tools/jmh/)\
    \ (JMH)。\n\n对于我们的实验，我们定义了一个带有两个方法的 `Worker` 接口：`increment()` 和 `consumeCPU()`。`increment()`\
    \ 方法返回一个 `long`，它将通过自动装箱转换为 `Long` 对象。`consumeCPU()` 方法返回 `void`，因此不需要创建对象。\n\n\
    ```\n//:~ benchmark/src/main/.../ch03/benchmarks/Worker.java\npublic interface\
    \ Worker {\n  long increment();\n  void consumeCPU();\n}\n```\n\n列表 3.42：`Worker`。\n\
    \n我们的 `RealWorker` 实现 `Worker`。在 `increment()` 方法中，它递增一个 `long` 类型字段并返回新值。在 `consumeCPU()`\
    \ 方法中，它使用 JMH 的 `Blackhole` 类来消耗几个 CPU 周期。\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/RealWorker.java\n\
    public class RealWorker implements Worker {\n  private long counter = 0;\n  @Override\n\
    \  public long increment() {\n    return counter++;\n  }\n  @Override\n  public\
    \ void consumeCPU() {\n    Blackhole.consumeCPU(2);\n  }\n}\n```\n\n列表 3.43：`RealWorker`。\n\
    \n我们的 `ProxyWorker` 遵循代理模式并指向 `RealWorker`。\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/ProxyWorker.java\n\
    public class ProxyWorker implements Worker {\n  private final RealWorker worker\
    \ = new RealWorker();\n  @Override\n  public long increment() {\n    return worker.increment();\n\
    \  }\n  @Override\n  public void consumeCPU() {\n    worker.consumeCPU();\n  }\n\
    }\n```\n\n列表 3.44：`ProxyWorker`。\n\n在我们的 `MethodCallBenchmark` 中，有五种调用 `increment()`\
    \ 和 `consumeCPU()` 的方式：\n\n*   `directCall` 直接在 `RealWorker` 实例上调用方法。\n*   `staticProxy`\
    \ 调用 `ProxyWorker` 实例的方法，然后它将调用委托给 `RealWorker`。\n*   `dynamicProxyThenDirectCall`\
    \ 创建 `Worker` 的动态代理，但直接委托给 `RealWorker` 的方法。\n*   `dynamicProxyThenReflectiveCall`\
    \ (turbo) 是我们 `Worker` 的动态代理，它使用给定的 `method` 参数通过反射调用将方法委托给 `RealWorker` 实例。该动态代理实例经过了加速（turbo-boosted）。\n\
    *   `dynamicProxyThenReflectiveCall` (no turbo) 与上相同，但没有加速。\n\n"
- fmt: "\n```java\n//:~ benchmark/src/main/.../ch03/benchmarks/MethodCallBenchmark.java\n\
    @Fork(value = 3, jvmArgsAppend = \"-XX:+UseParallelGC\")\n@Warmup(iterations =\
    \ 5, time = 3)\n@Measurement(iterations = 10, time = 3)\n@BenchmarkMode(Mode.AverageTime)\n\
    @OutputTimeUnit(TimeUnit.NANOSECONDS)\n@State(Scope.Benchmark)\npublic class MethodCallBenchmark\
    \ {\n  // direct call to RealWorker\n  private final RealWorker realWorker = new\
    \ RealWorker();\n\n  // static proxies\n  private final Worker staticProxy = new\
    \ ProxyWorker();\n\n  //   dynamic proxies\n  private final Worker dynamicProxyDirectCallIncrement\
    \ =\n      Proxies.castProxy(Worker.class,\n          (proxy, method, args) ->\
    \ realWorker.increment());\n  private final Worker dynamicProxyDirectCallConsumeCPU\
    \ =\n      Proxies.castProxy(Worker.class,\n          (proxy, method, args) ->\
    \ {\n            realWorker.consumeCPU();\n            return null;\n        \
    \  });\n  private final Worker dynamicProxyReflectiveCall =\n      Proxies.castProxy(Worker.class,\n\
    \          (proxy, method, args) ->\n              method.invoke(realWorker, args));\n\
    \n  @Benchmark\n  public long directCallIncrement() {\n    return realWorker.increment();\n\
    \  }\n  @Benchmark\n  public long staticProxyIncrement() {\n    return staticProxy.increment();\n\
    \  }\n  @Benchmark\n  public long dynamicProxyDirectCallIncrement() {\n    return\
    \ dynamicProxyDirectCallIncrement.increment();\n  }\n  @Benchmark\n  public long\
    \ dynamicProxyReflectiveCallIncrement() {\n    return dynamicProxyReflectiveCall.increment();\n\
    \  }\n\n  @Benchmark\n  public void directCallConsumeCPU() {\n    realWorker.consumeCPU();\n\
    \  }\n  @Benchmark\n  public void staticProxyConsumeCPU() {\n    staticProxy.consumeCPU();\n\
    \  }\n  @Benchmark\n  public void dynamicProxyDirectCallConsumeCPU() {\n    dynamicProxyDirectCallConsumeCPU.consumeCPU();\n\
    \  }\n  @Benchmark\n  public void dynamicProxyReflectiveCallConsumeCPU() {\n \
    \   dynamicProxyReflectiveCall.consumeCPU();\n  }\n}\n```\n\nListing 3.45: `MethodCallBenchmark`.\n\
    \nThe results of our `MethodCallBenchmark` come from running it on a MacBook Pro\
    \ (2018) i9 with six cores on Java 14+36-1461 with the throughput collector. All\
    \ units are nanoseconds/operation.\n\n### Results for `increment()`\n\nOur results\
    \ table shows that the `dynamicProxyDirectCall` is approximately 1.4 nanoseconds\
    \ slower than `staticProxy` in Java 14. In Java 13 the difference was approximately\
    \ 2.6 nanoseconds, since each primitive `long` returned by `increment()` needed\
    \ to be boxed to a `Long` object, churning 24 bytes per method call.\n\nCalling\
    \ the `Method` object via reflection in the `dynamicProxyReflectiveCall` adds\
    \ another 3.1 nanoseconds and if we turn off the turbo boost, this increases by\
    \ a further 1.4 nanoseconds. In all versions of Java that we tried, `dynamicProxyReflectiveCall`\
    \ allocated 24 bytes for the method call for the returned Integer.\n\n| Benchmark\
    \ `increment()` | ns/op ± Error |\n| :--- | :--- |\n| directCall | 1.957 ± 0.004\
    \ |\n| staticProxy | 2.369 ± 0.018 |\n| dynamicProxyDirectCall | 3.726 ± 0.016\
    \ |\n| dynamicProxyReflectiveCall (turbo) | 6.853 ± 0.201 |\n| dynamicProxyReflectiveCall\
    \ (no turbo) | 8.238 ± 0.282 |\n\n### Results for `consumeCPU()`\n\nThe results\
    \ for `consumeCPU()` are much closer, because we not not have boxing cost. `dynamicProxyDirectCall`\
    \ is approximately 0.7 nanoseconds slower than `staticProxy`. Calling the `Method`\
    \ object via reflection in `dynamicProxyReflectiveCall` adds only 0.8 nanoseconds\
    \ and if we turn off the turbo boost, this increases by a further 1.7 nanoseconds.\n\
    \n| Benchmark `consumeCPU()` | ns/op ± Error |\n| :--- | :--- |\n| directCall\
    \ | 3.270 ± 0.028 |\n| staticProxy | 3.788 ± 0.018 |\n| dynamicProxyDirectCall\
    \ | 4.461 ± 0.020 |\n| dynamicProxyReflectiveCall (turbo) | 5.231 ± 0.053 |\n\
    | dynamicProxyReflectiveCall (no turbo) | 6.960 ± 0.409 |\n\n### Summary of benchmark\
    \ results\n\nA method call overhead of 4.5 nanoseconds for `increment()` and 1.4\
    \ nanoseconds for `consumeCPU()` would seldom noticed with typical business logic.\
    \ Still, it is good to aware that there is a slightly higher method-call cost\
    \ and perhaps to avoid dynamic proxies for performance-sensitive code, especially\
    \ if we are calling the proxied methods in a tight loop.\n\n# Dynamic Decorator\n\
    \nA decorator attaches additional responsibilities to an object dynamically without\
    \ subclassing it. As we saw in Chapter 1, the decorator is used to add functionality\
    \ to a bare stream. In this chapter, we will see how to create a dynamic decorator.\n\
    \n## Decorator pattern\n\nUp to now, we have used dynamic proxies of Java to implement\
    \ the proxy pattern. We can also use the same mechanism to create decorators or\
    \ filters. Figure 10 shows the classical structure of decorator patterns as described\
    \ in the Gang-of-Four book.\n\n![DecoratorStructure](images/ch01/DecoratorStructure.png)\n\
    \nFigure 10. Decorator structure.\n\nDecorator is also known by the name “filter”.\
    \ In my mind, a decorator adds, whereas a filter takes away. If we want a truly\
    \ immutable collection, we could create a filter interface that does not contain\
    \ any mutator methods. Take for example our `ImmutableIterable` in Listing 4.1.\
    \ In it, we leave out the `iterator()` method, as `Iterator` contains the `remove()`\
    \ method. We could of course have our `iterator()` method return a `ImmutableIterator`,\
    \ but I will leave that as an exercise for the reader.\n\n```java\n//:~ core/src/main/...ch04/immutablecollection/ImmutableIterable.java\n\
    public interface ImmutableIterable<E> {\n  void forEach(Consumer<? super E> action);\n\
    \  Spliterator<E> spliterator();\n\n  // mutator method from Iterable\n  //  \
    \  Iterator<E> iterator();\n}\n```\nListing 4.1: `ImmutableIterable`.\n\nOur `ImmutableCollection`\
    \ also filters out any method that may change the collection. We added a default\
    \ interface method `printAll()`. Dynamic proxies implement all public methods\
    \ of the interface, even default methods. In Java, we can call superclass methods\
    \ from within a subclass using the `super` keyword, but we cannot do so from the\
    \ outside. For example, when a class overrides `hashCode()`, there is no way for\
    \ a user of that class to call the default `Object.hashCode()` method. For this\
    \ reason, Java provides a `System.identityHashCode()` in case we need to generate\
    \ the same `hashCode()` as `Object.hashCode()` would produce. This gets us in\
    \ trouble with default interface methods. If the method had not been overridden\
    \ inside the generated dynamic proxy, we could call the default interface method\
    \ and it would route us to the interface’s method. Fortunately there is a hack\
    \ that allows us to call the default interface methods on interfaces, as we will\
    \ see when we look at the `VTable`.\n\n```java\n//:~ core/src/main/...ch04/immutablecollection/ImmutableCollection.java\n\
    public interface ImmutableCollection<E>\n    extends ImmutableIterable<E> {\n\
    \  int size();\n  boolean isEmpty();\n  boolean contains(Object o);\n  Object[]\
    \ toArray();\n  <T> T[] toArray(T[] a);\n  <T> T[] toArray(IntFunction<T[]> generator);\n\
    \  boolean containsAll(Collection<?> c);\n  Stream<E> stream();\n  Stream<E> parallelStream();\n\
    \n  // to try out default methods\n  default void printAll() {\n    forEach(System.out::println);\n\
    \  }\n\n  // mutator methods from Collection filtered away\n  //    boolean add(E\
    \ e);\n  //    boolean remove(Object o);\n  //    boolean addAll(Collection<?\
    \ extends E> c);\n  //    boolean removeAll(Collection<?> c);\n  //    boolean\
    \ removeIf(Predicate<? super E> filter);\n  //    boolean retainAll(Collection<?>\
    \ c);\n  //    void clear();\n}\n```\nListing 4.2: `ImmutableCollection`.\n\n\
    To show how we could use this to filter existing collections, let us write a `HandcodedFilter`.\
    \ Each of the methods inside `ImmutableCollection` is delegated to the enclosed\
    \ `Collection`. You will probably agree that writing code like this is rather\
    \ pedestrian.\n"
