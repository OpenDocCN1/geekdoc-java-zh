  trans: "\n\n```\nException in thread \"main\" java.lang.IllegalArgumentException:\
    \ \\\n    Unhandled methods: [ \\\n      public default void java.util.Iterator.remove(),\
    \ \\\n      public default void java.util.Iterator.forEachRemaining( \\\n    \
    \    java.util.function.Consumer)]\n  at eu.javaspecialists.books.dynamicproxies/...\n\
    ```\n\nListing 4.12：未使用 `--add-opens` 时的 `DynamicFilterDemo` 输出。\n\n然而，当我们在运行\
    \ `DefaultMethodCallDemo` 并带上 `--add-opens java.base/java.util=eu.javaspecialists.books.dynamicproxies`\
    \ 时，它如预期般工作。\n\n```\ntrue\n0.9833487941165752\njava.lang.UnsupportedOperationException:\
    \ remove\nIterating forever ...\n0.07265625125554698\n0.49716358229383684\n0.44842977216243907\n\
    0.44363950828146614\n0.5560995018129454\n0.9779642433900788\n0.7941409326858004\n\
    ... etc.\n```\n\nListing 4.13：使用 `--add-opens` 时的 `DynamicFilterDemo` 输出。\n\n\
    本章的剩余部分将展示 `VTable` 如何工作的底层细节，以及我们的 `ChainedInvocationHandler`。这些工具将在下一个模式中用到，但你可以随心跳过本章的剩余部分，也许在以后阶段再回来查看。\n\
    \n## `VTable`\n\n`ImmutableCollection` 接口与 `Collection` 之间没有继承关系。然而，我们仍然需要将接口中的方法匹配到装饰对象。为了实现这一点，我们创建了一个\
    \ `VTable`，它根据给定的接口方法返回匹配的方法。它相当长且复杂，我们首先需要介绍以下几项：\n\n1. `ParameterTypesFetcher`\
    \ 帮助提高方法匹配的性能。\n2. `MethodKey` 通过名称和参数类型比较方法。\n3. `VTable` 匹配目标方法和接收者方法，包括默认接口方法。\n\
    4. `VTable.Builder` 是一个 [Effective Java](https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/)\
    \ 构建器模式，用于构建 `VTable`。\n5. `VTables` 是用于构建最常见 `VTable` 配置的 facade。\n\n### `ParameterTypesFetcher`\n\
    \n匹配方法时的一个巨大成本是调用 `getParameterTypes()`，它在每次调用时都会克隆内部的 `Class<?>[]`。`ParameterTypesFetcher`\
    \ 让我们能够直接访问内部的数组。我们可以通过 JVM 参数 `-Deu.javaspecialists.books.dynamicproxies.util.ParameterTypesFetcher.enabled=true`\
    \ 来启用此性能优化。\n\n我们使用[策略设计模式](https://javaspecialists.teachable.com/p/dpc5) 来决定如何返回参数类型。当\
    \ `ParameterTypesFetcher` 类加载时，我们将 `PARAMETER_FETCHER` 绑定到正确的策略类型。由于我们在一个 JVM\
    \ 内只使用一种策略，HotSpot 编译器可以激进地优化这些方法，可能内联代码从而消除方法调用开销。\n\n```java\n//:~ core/src/main/.../util/ParameterTypesFetcher.java\n\
    /**\n * 默认禁用快速获取参数类型数组，\n *可以通过以下方式启用：\n * -Deu.javaspecialists.books.dynamicproxies.util.\
    \ \\\n * ParameterTypesFetcher.enabled=true\n */\npublic final class ParameterTypesFetcher\
    \ {\n  private final static ParameterFetcher PARAMETER_FETCHER =\n      Boolean.getBoolean(\n\
    \          ParameterTypesFetcher.class.getName() + \".enabled\") ?\n         \
    \ new FastParameterFetcher() :\n          new NormalParameterFetcher();\n\n  /**\n\
    \   * 警告：当启用“快速参数获取”时，\n   * 返回的数组是存储在 Method\n   * 对象内部的实际数组。不要修改它！\n   */\n\
    \  public static Class<?>[] get(Method method) {\n    return PARAMETER_FETCHER.getParameterTypes(method);\n\
    \  }\n\n  @FunctionalInterface\n  private interface ParameterFetcher {\n    Class<?>[]\
    \ getParameterTypes(Method method);\n  }\n\n  /**\n   * 通过调用方法参数上的 getParameterTypes()\n\
    \   * 返回参数类型。这应该始终有效。\n   */\n  private static class NormalParameterFetcher\n\
    \      implements ParameterFetcher {\n    @Override\n    public Class<?>[] getParameterTypes(Method\
    \ method) {\n      return method.getParameterTypes(); // 克隆数组\n    }\n  }\n\n\
    \  /**\n   * 创建一个直接指向 Method 内部存储的\n   * 私有字段 parameterTypes 的 VarHandle。由于 VarHandle\n\
    \   * 被声明为 final static，读取它的成本与\n   * 读取普通字段的相同。\n   */\n  private static class\
    \ FastParameterFetcher\n      implements ParameterFetcher {\n    private final\
    \ static VarHandle METHOD_PARAMETER_TYPES;\n\n    static {\n      try {\n    \
    \    METHOD_PARAMETER_TYPES = MethodHandles.privateLookupIn(\n            Method.class,\
    \ MethodHandles.lookup()\n        ).findVarHandle(Method.class, \"parameterTypes\"\
    ,\n            Class[].class);\n      } catch (ReflectiveException e) {\n    \
    \    // 异常处理\n      }\n    }\n    @Override\n    public Class<?>[] getParameterTypes(Method\
    \ method) {\n      return (Class<?>[]) METHOD_PARAMETER_TYPES.get(method);\n \
    \   }\n  }\n}\n```\n\nListing 4.14：`ParameterTypesFetcher`。\n\n### `MethodKey`\n\
    \n`MethodKey` 在 4.15 中根据名称和参数类型比较方法对象。\n\n```java\n//:~ core/src/main/.../util/MethodKey.java\n\
    /**\n * MethodKey 根据名称和参数类型比较方法。\n * 它实现了 equals(), hashCode() 和 toString()。\n\
    \ * 可以作为 map 的键。它不知道方法的返回类型。\n */\npublic final class MethodKey implements Comparable<MethodKey>\
    \ {\n  private final String name;\n  private final Class<?>[] paramTypes;\n\n\
    \  public MethodKey(Method method) {\n    name = method.getName();\n    paramTypes\
    \ = ParameterTypesFetcher.get(method);\n  }\n\n  public MethodKey(Class<?> clazz,\
    \ String name,\n                   Class<?>... paramTypes) {\n    try {\n    \
    \  // 检查类是否存在方法\n      var method = clazz.getMethod(name, paramTypes);\n     \
    \ // 方法名在 JVM 中是内化的\n      this.name = method.getName();\n      this.paramTypes\
    \ = Objects.requireNonNull(paramTypes);\n    } catch (NoSuchMethodException e)\
    \ {\n      throw new IllegalArgumentException(e);\n    }\n  }\n\n  @Override\n\
    \  public boolean equals(Object obj) {\n    if (!(obj instanceof MethodKey)) {\n\
    \      return false;\n    }\n    // name 和 paramTypes 不为空\n    var other = (MethodKey)\
    \ obj;\n    return name == other.name && // 方法是内化的\n               equalTypes(paramTypes,\
    \ other.paramTypes);\n  }\n\n  /**\n   * 使用 == 而不是 .equals() 比较类。我们知道\n   *数组不会为空。因此可以避免\n\
    \   * Arrays.equals() 中的某些检查。\n   */\n  private boolean equalTypes(Class<?>[]\
    \ params1,\n                            Class<?>[] params2) {\n    if (params1.length\
    \ == params2.length) {\n      for (int i = 0; i < params1.length; i++) {\n   \
    \     if (params1[i] != params2[i])\n          return false;\n      }\n      return\
    \ true;\n    }\n    return false;\n  }\n\n  @Override\n  public int hashCode()\
    \ {\n    return name.hashCode() + paramTypes.length;\n  }\n\n  @Override\n  public\
    \ int compareTo(MethodKey that) {\n    int result = this.name.compareTo(that.name);\n\
    \    if (result != 0) return result;\n    return Arrays.compare(this.paramTypes,\n\
    \        that.paramTypes,\n        Comparator.comparing(Class::getName));\n  }\n\
    \n  @Override\n  public String toString() {\n    return Stream.of(paramTypes)\n\
    \               .map(Class::getName)\n               .collect(Collectors.joining(\"\
    , \",\n                   name + \"(\", \")\"));\n  }\n}\n```\n\nListing 4.15：`MethodKey`。`VTable`\
    \ 和 `VTable.Builder`\n\n`VTable` 创建了一个自定义哈希表，根据名称和参数类型查找方法。普通方法使用 `lookup(Method)`\
    \ 查找，而默认接口方法则使用 `lookupDefaultMethod(Method)` 查找。\n\n"
