    \ Text '2020-04-31'\n        could not be parsed: Invalid date 'APRIL 31'\n```\n\
    \nListing 3.21: Output from the simple proxy example.\n\nIn our handcrafted proxy\
    \ in Listing 2.20 (Chapter 2), we had forgotten to proxy the `toString()` method,\
    \ so the default `Object.toString()` method was called. With dynamic proxies,\
    \ the `toString()` method is automatically proxied, together with `equals()` and\
    \ `hashCode()`.\n\n## Virtual dynamic proxy\n\nIn Listing 2.3, we wrote a virtual\
    \ proxy for lazily creating our `CustomHashMap` instances. Following the same\
    \ approach as our handcrafted proxy, we can create a `VirtualProxyHandler` that\
    \ takes a `Supplier<? extends S>` as a parameter.\n\n```\n//:~ core/src/main/.../handlers/VirtualProxyHandler.java\n\
    public final class VirtualProxyHandler<S>\n    implements InvocationHandler, Serializable\
    \ {\n  private static final long serialVersionUID = 1L;\n  private final Supplier<?\
    \ extends S> subjectSupplier;\n  private S subject;\n\n  public VirtualProxyHandler(\n\
    \      Supplier<? extends S> subjectSupplier) {\n    this.subjectSupplier = subjectSupplier;\n\
    \  }\n  private S getSubject() {\n    if (subject == null) subject = subjectSupplier.get();\n\
    \    return subject;\n  }\n  @Override\n  public Object invoke(Object proxy, Method\
    \ method,\n                       Object[] args) throws Throwable {\n    return\
    \ method.invoke(getSubject(), args);\n  }\n}\n```\n\nListing 3.22: `VirtualProxyHandler`.\n\
    \nWe can add a static factory method to our `Proxies` façade.\n\n```\n//:~ core/src/main/.../Proxies.java\n\
    public static <S> S virtualProxy(\n    Class<? super S> subjectInterface,\n  \
    \  Supplier<? extends S> subjectSupplier) {\n  Objects.requireNonNull(subjectSupplier,\n\
    \      \"subjectSupplier==null\");\n  return castProxy(subjectInterface,\n   \
    \   new VirtualProxyHandler<>(subjectSupplier));\n}\n```\n\nListing 3.23: `Proxies.virtualProxy()`.\n\
    \nOur virtual proxy test now creates the `CustomMap` with `Proxies.virtualProxy(CustomMap.class,\
    \ CustomHashMap::new)`.\n\n```\n//:~ core/src/main/.../ch03/virtual/VirtualProxyDemo.java\n\
    CustomMap<String, Integer> map =\n    Proxies.virtualProxy(CustomMap.class,\n\
    \        CustomHashMap::new);\nSystem.out.println(\"Virtual Map created\");\n\
    map.put(\"one\", 1); // creating CustomHashMap as side effect\nmap.put(\"life\"\
    , 42);\nSystem.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"life\"));\n\
    System.out.println(\"map.size() = \" + map.size());\nSystem.out.println(\"clearing\
    \ map\");\nmap.clear();\nSystem.out.println(\"map.size() = \" + map.size());\n\
    ```\n\nListing 3.24: `VirtualProxyDemo`.\n\nThe output is exactly the same as\
    \ with our handcrafted virtual proxy in Listing 2.5.\n\n## Synchronized dynamic\
    \ proxy\n\nInstead of handcrafting a synchronized protection proxy like we did\
    \ in Listing 2.15, we can write a `SynchronizedHandler`. This synchronizes all\
    \ calls to methods on our `subject`, using `proxy` as our monitor lock."
