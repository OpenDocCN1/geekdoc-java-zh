    \ type must match, or we will reject that method.\n- We need to include support\
    \ for default methods.\n- If the object does not have all the methods in the filter,\
    \ constructing dynamic filter should fail.\n\nListing 4.6 shows `FilterHandler`.\
    \ We have written our own `VTable` to implement virtual method table, a concept\
    \ used in object orientation to route virtual methods to the correct receiver.\
    \ I will explain the `VTable` and `FilterHandler` in detail later. For now, it\
    \ is enough to know that `VTable` is used to match methods between unrelated interfaces,\
    \ including default methods. `FilterHandler` uses [chain-of-responsibility design\
    \ pattern](https://javaspecialists.com/p/d5) to link multiple `VTable` lookups.\
    \ Part of our chain construction, we also verify that all the methods in the filter\
    \ have some handler.\n\n```java\n//:~ core/src/main/.../handlers/FilterHandler.java\n\
    public final class FilterHandler implements InvocationHandler {\n  private final\
    \ InvocationHandler chain;\n\n  public FilterHandler(Class<?> filter, Object component)\
    \ {\n    VTable vt = new VTable(component.getClass(), filter);\n    VTable defaultVT\
