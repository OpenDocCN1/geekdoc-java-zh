    \ this public inner class contains the methods that\n  // we want to adapt\n \
    \ public static class AdaptationObject<E> {\n    private final Collection<E> adaptee;\n\
    \    private final E[] seedArray;\n    public AdaptationObject(Collection<E> adaptee,\n\
    \                            E[] seedArray) {\n      this.adaptee = adaptee;\n\
    \      this.seedArray = seedArray;\n    }\n    public E[] toArray() {\n      return\
    \ adaptee.toArray(seedArray);\n    }\n    @Override\n    public String toString()\
    \ {\n      return \"--\" + adaptee + \"--\";\n    }\n    // Whilst we are at it,\
    \ we could also make it into\n    // a checked collection, see java.util.Collections\n\
    \    // for an example.\n    public boolean add(E e) {\n      var type = seedArray.getClass().getComponentType();\n\
    \      if (!type.isInstance(e))\n        throw new ClassCastException(\n     \
    \       \"Attempt to insert \" + e.getClass() +\n                \" value into\
    \ collection \" +\n                \"with type \" + type);\n      return adaptee.add(e);\n\
    \    }\n    // addAll() left as an exercise for the reader :-)\n  }\n}\n```\n\n\
    列表 5.11：`BetterCollectionFactory`。\n\n让我们尝试用由我们的 `BetterCollectionObjectAdapter`\
    \ 包装的 `HashSet` 来测试一下。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionDynamicObjectAdapterDemo.java\n\
    BetterCollection<String> names =\n    BetterCollectionFactory.asBetterCollection(\n\
    \        new HashSet<>(), new String[0]);\nnames.add(\"Wolfgang\");\nnames.add(\"\
    Bobby Tables\");\nnames.add(\"Leander\");\nnames.add(\"Klaus\");\nnames.add(\"\
    Menongahela\");\nString[] nameArray = names.toArray();\nfor (String name : nameArray)\
    \ {\n  System.out.println(name.toUpperCase());\n}\nSystem.out.println(names);\n\
    \n((Collection) names).add(42); // this will fail\n```\n\n列表 5.12：`BetterCollectionDynamicObjectAdapterDemo`。\n\
    \n```text\nMENONGAHELA\nLEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela,\
    \ Leander, Wolfgang, Klaus, Bobby Tables]--\nException in thread \"main\" java.lang.ClassCastException:\
    \ Attempt\nto insert class java.lang.Integer value into collection with\nvalue\
    \ type class java.lang.String\n  at BetterCollectionFactory$AdaptationObject.add\n\
    \      (BetterCollectionFactory.java)\n    ... etc.\n```\n\n列表 5.13：`BetterCollectionDynamicObjectAdapterDemo`\
    \ 的输出。\n\n得益于反射，我们能够避免适配器（adapter）和被适配器（adaptee）类之间的紧耦合。我们只需要实现发生变化的适配器部分。\n\n\
    方法调用的成本略有增加，因为每次调用至少涉及一次 `VTable` 查找。正如我们稍后看到的，当我们需要调用默认接口方法时，这种成本会进一步增加。\n\n\
    ## 适配器的限制\n\n在我们的动态对象适配器方法中，`adapter` 或 `adaptee` 通常都不会实现 `target` 接口。我们需要确保层级结构中至少有一个公共类对\
    \ `target` 中的每个方法有公共声明。匿名内部类虽然用起来方便，但它们是包保护的（package-protected），因此不适合被用作适配器。\n\
    \n考虑类 `AdapterPuzzle1`。\n\n```java\n//:~ core/src/main/.../ch05/AdapterPuzzle1.java\n\
    public class AdapterPuzzle1 {\n  public static void main(String... args) {\n \
    \   CharSequence seq =\n        Proxies.adapt(CharSequence.class,\n          \
    \  \"Good morning Vietnam\",\n            new Object() {\n              @Override\n\
    \              public String toString() {\n                return \"Kilroy\";\n\
    \              }\n              public int length() {\n                return\
    \ 42;\n              }\n            });\n    System.out.println(seq + \" \" +\
    \ seq.length());\n  }\n}\n```\n\n列表 5.14：`AdapterPuzzle1`。\n\n以下哪一个是输出结果？\n\n\
    - Good morning Vietnam 20\n- Good morning Vietnam 42\n- Good morning Vietnam 6\n\
    - Kilroy 20\n- Kilroy 42\n- Kilroy 6\n\n正确答案是“Kilroy 20”。\n\n让我们尝试找出原因。\n\n目标接口是\
    \ `CharSequence`，`adaptee` 是 `String`，而 `adapter` 是一个 `Object` 的子类的匿名内部类。\n\n\
    匿名内部类是包私有的（package-private），因此 `length()` 方法在包外不可见。当我们调用 `length()` 时，调用的是 `String`\
    \ 方法并得到值“20”。\n\n`toString()` 方法是可见的，因为它继承自公共类 `Object`。当我们调用 `toString()` 时，调用的是内部类的\
    \ `toString()` 方法，返回值“Kilroy”。\n\n现在考虑类 `AdapterPuzzle2`。\n\n```java\n//:~ core/src/main/.../ch05/AdapterPuzzle2.java\n\
    public class AdapterPuzzle2 {\n  public interface LengthProvider {\n    int length();\n\
    \  }\n  public static void main(String... args) {\n    CharSequence seq =\n  \
    \      Proxies.adapt(CharSequence.class,\n            \"Good morning Vietnam\"\
    ,\n            new LengthProvider() {\n              @Override\n             \
    \ public String toString() {\n                return \"Kilroy\";\n           \
    \   }\n              @Override\n              public int length() {\n        \
    \        return 42;\n              }\n            });\n    System.out.println(seq\
    \ + \" \" + seq.length());\n  }\n}\n```\n\n列表 5.15：`AdapterPuzzle2`。\n\n由于我们实现的是公共接口，`length()`\
    \ 方法对适配器可见。这一次的答案将是稳定的“Kilroy 42”。\n\n## 动态对象适配器方法的性能\n\n在我们的动态对象适配器上调用方法时执行多次哈希表查找是很慢的。但到底慢多少呢？\n\
    \n在我们的 `AdapterBenchmark` 中，我们创建了四个集合：\n\n- `plain` 是一个没有任何修的 `ConcurrentSkipListSet`。\n\
    - `classAdapter` 是我们在本章早期见过的 `BetterConcurrentListSet`。\n- `objectAdapter` 是手工编写的\
    \ `BetterCollectionObjectAdapter` 对象适配器，包装了一个 `ConcurrentSkipListSet`。\n- `dynamicObjectAdapter`\
    \ 是使用我们的 `BetterCollectionFactory` 创建的动态对象适配器实例，包装了一个 `ConcurrentSkipListSet`。\n\
    \n我们对这些集合分别调用了 `size()`、`toArray()` 和 `forEachFiltered()` 方法。\n\n"
- fmt: "\n```java\n//:~ benchmark/src/main/.../ch05/benchmarks/AdapterBenchmark.java\n\
    @Fork(value = 3, jvmArgsAppend = {\"-XX:+UseParallelGC\",\n    \"-Deu.javaspecialists.books.dynamicproxies.util\"\
    \ +\n        \".ParameterTypesFetcher.enabled=true\"})\n@Warmup(iterations = 5,\
    \ time = 5)\n@Measurement(iterations = 10, time = 5)\n@BenchmarkMode(Mode.AverageTime)\n\
    @OutputTimeUnit(TimeUnit.NANOSECONDS)\n@State(Scope.Benchmark)\npublic class AdapterBenchmark\
    \ {\n  private final Collection<String> plain =\n      new ConcurrentSkipListSet<>();\n\
    \n  private final BetterCollection<String> classAdapter =\n      new BetterConcurrentSkipListSet<>(new\
    \ String[0]);\n\n  private final BetterCollection<String> objectAdapter =\n  \
    \    new BetterCollectionObjectAdapter<>(\n          new ConcurrentSkipListSet<>(),\
    \ new String[0]);\n\n  private final BetterCollection<String> dynamicObjectAdapter\
    \ =\n      BetterCollectionFactory.asBetterCollection(\n          new ConcurrentSkipListSet<>(),\
    \ new String[0]\n      );\n\n  private final Collection<Collection<String>> all\
    \ =\n      List.of(plain, classAdapter, objectAdapter,\n          dynamicObjectAdapter);\n\
    \n  @Setup\n  public void init() {\n    all.forEach(Collection::clear);\n    all.forEach(c\
    \ -> c.add(\"John\"));\n    all.forEach(c -> c.add(\"Mary\"));\n    all.forEach(c\
    \ -> c.add(\"Menongahela\"));\n    all.forEach(c -> c.add(\"Bobby Tables\"));\n\
    \  }\n\n  @Benchmark\n  public int plainSize() {\n    return plain.size();\n \
    \ }\n  @Benchmark\n  public int classAdapterSize() {\n    return classAdapter.size();\n\
    \  }\n  @Benchmark\n  public int objectAdapterSize() {\n    return objectAdapter.size();\n\
    \  }\n  @Benchmark\n  public int dynamicObjectAdapterSize() {\n    return dynamicObjectAdapter.size();\n\
    \  }\n\n  @Benchmark\n  public Object[] plainToArray() {\n    return plain.toArray();\n\
    \  }\n  @Benchmark\n  public String[] classAdapterToArray() {\n    return classAdapter.toArray();\n\
    \  }\n  @Benchmark\n  public String[] objectAdapterToArray() {\n    return objectAdapter.toArray();\n\
    \  }\n  @Benchmark\n  public String[] dynamicObjectAdapterToArray() {\n    return\
    \ dynamicObjectAdapter.toArray();\n  }\n\n  private static final Predicate<String>\
    \ predicate =\n      s -> s.length() < 10;\n\n  private static class Counter implements\
    \ Consumer<Object> {\n    private int count;\n    @Override\n    public void accept(Object\
    \ o) { count++; }\n    public void reset() { count = 0; }\n    public int get()\
    \ { return count; }\n  }\n\n  private static final Counter COUNTER = new Counter();\n\
    \n  @Benchmark\n  public int plainForEach() {\n    COUNTER.reset();\n    Objects.requireNonNull(predicate,\
    \ \"predicate==null\");\n    Objects.requireNonNull(COUNTER, \"COUNTER==null\"\
    );\n    for (String e : plain) {\n      if (predicate.test(e)) COUNTER.accept(e);\n\
    \    }\n    return COUNTER.get();\n  }\n  @Benchmark\n  public int classAdapterForEach()\
    \ {\n    COUNTER.reset();\n    classAdapter.forEachFiltered(predicate, COUNTER);\n\
    \    return COUNTER.get();\n  }\n  @Benchmark\n  public int objectAdapterForEach()\
    \ {\n    COUNTER.reset();\n    objectAdapter.forEachFiltered(predicate, COUNTER);\n\
    \    return COUNTER.get();\n  }\n  @Benchmark\n  public int dynamicObjectAdapterForEach()\
    \ {\n    COUNTER.reset();\n    dynamicObjectAdapter.forEachFiltered(predicate,\
    \ COUNTER);\n    return COUNTER.get();\n  }\n\n  @Benchmark\n  public Iterator<String>\
    \ iterator() {\n    return plain.iterator();\n  }\n\n  @Benchmark\n  public Object[]\
    \ parameterArray() {\n    return new Object[] {predicate, COUNTER};\n  }\n}\n\
    ```\n\nListing 5.16: `AdapterBenchmark`.\n\nThese results come from running our\
    \ `AdapterBenchmark` on a MacBook Pro (2018) i9 with six cores with Java 14+36-1461.\
    \ Times are in nanoseconds per operation (ns/op) and memory allocated is bytes\
    \ per operation (B/op), with escape analysis on and off, using the `-XX:+/-DoEscapeAnalysis`\
    \ JVM parameter. The `ParameterTypesFetcher` and the `MethodTurboBooster` are\
    \ both enabled.\n\n### Performance of `size()`\n\nThe `size()` method is defined\
    \ inside the adaptee, thus we need to make two `VTable` lookups, first on the\
    \ adapter and then on the adaptee. The overhead is approximately 11 nanoseconds.\
    \ Since the `size()` method is not overloaded in the `BetterCollection` interface,\
    \ we do not need to match the parameter types.\n\nNone of the tests allocate memory\
    \ with the current data set. However, if the set increased in size beyond 127,\
    \ then the dynamic object adapter would need to allocate an `Integer` object for\
    \ the return value.\n\n| Benchmark | ns/op ± Error | B/op EA on / off |\n| ---\
    \ | --- | --- |\n| plainSize() | 3.517 ± 0.076 | 0 / 0 |\n| classAdapterSize()\
    \ | 3.473 ± 0.040 | 0 / 0 |\n| objectAdapterSize() | 3.489 ± 0.042 | 0 / 0 |\n\
    | dynamicObjectAdapterSize() | 14.378 ± 0.153 | 0 / 0 |\n\n### Performance of\
    \ `toArray()`\n\nThe overhead is approximately 6 nanoseconds difference between\
    \ the static and dynamic. We see in the table below that there is one `VTable`\
    \ lookup on the adapter. For more information about escape analysis, see Scalar\
    \ Replacement.\n\n| Benchmark | ns/op ± Error | B/op EA on / off |\n| --- | ---\
    \ | --- |\n| plainToArray() | 18.345 ± 0.096 | 64 / 64 |\n| classAdapterToArray()\
    \ | 22.385 ± 0.104 | 64 / 64 |\n| objectAdapterToArray() | 22.152 ± 0.177 | 64\
    \ / 64 |\n| dynamicObjectAdapterToArray() | 28.461 ± 0.209 | 64 / 64 |\n\n###\
    \ Performance of `forEachFiltered()`\n\nThe default interface method `forEachFiltered()`\
    \ defined inside `BetterCollection` has the highest overhead, coming to about\
    \ 26 nanoseconds. This requires 5 `VTable` lookups. We first lookup in the adapter\
    \ and adaptee and when we do not find the method there, we find it as a default\
    \ interface method on our target. However, internally, the `forEachFiltered()`\
    \ method calls `iterator()` during the for-in loop, which requires two lookups\
    \ on adapter and adaptee.\n\nAll of the tests create an iterator (32 bytes). However,\
    \ since the iterator object is contained within the method, the heap allocation\
    \ can usually be optimized away, except with the dynamic adapter. Our dynamic\
    \ proxy invocations have deeper call stacks, as we discussed in chapter 3. The\
    \ computational time complexity of determining whether an object cannot escape\
    \ is quite high, and thus escape analysis limits how deeply it analyzes the stack.\
    \ In our case, escape analysis gives up and thus the iterator object has to be\
    \ allocated on the heap, with the associated garbage collection cost. A further\
    \ 24 bytes are wasted due to the `Object[]` for the parameters of the method.\n\
    \nThe allocation rate for the `dynamicObjectAdapterForEach()` benchmark was approximately\
    \ 720 MB/s. This is a bit high, but nowhere close to the maximum of the machine\
    \ I ran the tests on. For comparison, on my machine I can allocate 2.9 GB/s of\
    \ iterators and 4.2 GB/s of object arrays. The bottleneck is in the `VTable` lookups\
    \ and not in the object allocation.\n\n| Benchmark | ns/op ± Error | B/op EA on\
    \ / off |\n| --- | --- | --- |\n| plainForEach() | 15.422 ± 0.062 | 0 / 32 |\n\
    | classAdapterForEach() | 15.531 ± 0.043 | 0 / 32 |\n| objectAdapterForEach()\
    \ | 16.768 ± 0.047 | 0 / 32 |\n| dynamicObjectAdapterForEach() | 42.431 ± 0.262\
    \ | 56 / 56\n\n### Conclusion of performance analysis\n\nThe overhead of calling\
    \ methods on the dynamic object adapter is dependent on how many `VTable` lookups\
    \ we have to make.\n"
