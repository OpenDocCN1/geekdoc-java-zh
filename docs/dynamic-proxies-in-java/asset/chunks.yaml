  trans: "\n\n```java\n//:~ benchmark/src/main/.../ch05/benchmarks/AdapterBenchmark.java\n\
    @Fork(value = 3, jvmArgsAppend = {\"-XX:+UseParallelGC\",\n    \"-Deu.javaspecialists.books.dynamicproxies.util\"\
    \ +\n        \".ParameterTypesFetcher.enabled=true\"})\n@Warmup(iterations = 5,\
    \ time = 5)\n@Measurement(iterations = 10, time = 5)\n@BenchmarkMode(Mode.AverageTime)\n\
    @OutputTimeUnit(TimeUnit.NANOSECONDS)\n@State(Scope.Benchmark)\npublic class AdapterBenchmark\
    \ {\n  private final Collection<String> plain =\n      new ConcurrentSkipListSet<>();\n\
    \n  private final BetterCollection<String> classAdapter =\n      new BetterConcurrentSkipListSet<>(new\
    \ String[0]);\n\n  private final BetterCollection<String> objectAdapter =\n  \
    \    new BetterCollectionObjectAdapter<>(\n          new ConcurrentSkipListSet<>(),\
    \ new String[0]);\n\n  private final BetterCollection<String> dynamicObjectAdapter\
    \ =\n      BetterCollectionFactory.asBetterCollection(\n          new ConcurrentSkipListSet<>(),\
    \ new String[0]\n      );\n\n  private final Collection<Collection<String>> all\
    \ =\n      List.of(plain, classAdapter, objectAdapter,\n          dynamicObjectAdapter);\n\
    \n  @Setup\n  public void init() {\n    all.forEach(Collection::clear);\n    all.forEach(c\
    \ -> c.add(\"John\"));\n    all.forEach(c -> c.add(\"Mary\"));\n    all.forEach(c\
    \ -> c.add(\"Menongahela\"));\n    all.forEach(c -> c.add(\"Bobby Tables\"));\n\
    \  }\n\n  @Benchmark\n  public int plainSize() {\n    return plain.size();\n \
    \ }\n  @Benchmark\n  public int classAdapterSize() {\n    return classAdapter.size();\n\
    \  }\n  @Benchmark\n  public int objectAdapterSize() {\n    return objectAdapter.size();\n\
    \  }\n  @Benchmark\n  public int dynamicObjectAdapterSize() {\n    return dynamicObjectAdapter.size();\n\
    \  }\n\n  @Benchmark\n  public Object[] plainToArray() {\n    return plain.toArray();\n\
    \  }\n  @Benchmark\n  public String[] classAdapterToArray() {\n    return classAdapter.toArray();\n\
    \  }\n  @Benchmark\n  public String[] objectAdapterToArray() {\n    return objectAdapter.toArray();\n\
    \  }\n  @Benchmark\n  public String[] dynamicObjectAdapterToArray() {\n    return\
    \ dynamicObjectAdapter.toArray();\n  }\n\n  private static final Predicate<String>\
    \ predicate =\n      s -> s.length() < 10;\n\n  private static class Counter implements\
    \ Consumer<Object> {\n    private int count;\n    @Override\n    public void accept(Object\
    \ o) { count++; }\n    public void reset() { count = 0; }\n    public int get()\
    \ { return count; }\n  }\n\n  private static final Counter COUNTER = new Counter();\n\
    \n  @Benchmark\n  public int plainForEach() {\n    COUNTER.reset();\n    Objects.requireNonNull(predicate,\
    \ \"predicate==null\");\n    Objects.requireNonNull(COUNTER, \"COUNTER==null\"\
    );\n    for (String e : plain) {\n      if (predicate.test(e)) COUNTER.accept(e);\n\
    \    }\n    return COUNTER.get();\n  }\n  @Benchmark\n  public int classAdapterForEach()\
    \ {\n    COUNTER.reset();\n    classAdapter.forEachFiltered(predicate, COUNTER);\n\
    \    return COUNTER.get();\n  }\n  @Benchmark\n  public int objectAdapterForEach()\
    \ {\n    COUNTER.reset();\n    objectAdapter.forEachFiltered(predicate, COUNTER);\n\
    \    return COUNTER.get();\n  }\n  @Benchmark\n  public int dynamicObjectAdapterForEach()\
    \ {\n    COUNTER.reset();\n    dynamicObjectAdapter.forEachFiltered(predicate,\
    \ COUNTER);\n    return COUNTER.get();\n  }\n\n  @Benchmark\n  public Iterator<String>\
    \ iterator() {\n    return plain.iterator();\n  }\n\n  @Benchmark\n  public Object[]\
    \ parameterArray() {\n    return new Object[] {predicate, COUNTER};\n  }\n}\n\
    ```\n\n列表 5.16: `AdapterBenchmark`。\n\n这些结果是在一台配备六核 i9 的 MacBook Pro (2018) 上运行\
    \ Java 14+36-1461 的 `AdapterBenchmark` 得到的。时间单位为每次操作纳秒（ns/op），内存分配单位为每次操作字节（B/op），通过使用\
    \ `-XX:+/-DoEscapeAnalysis` JVM 参数开启或关闭了逃逸分析。`ParameterTypesFetcher` 和 `MethodTurboBooster`\
    \ 均已启用。\n\n### `size()` 的性能\n\n`size()` 方法定义在目标（adaptee）内部，因此我们需要进行两次 `VTable`\
    \ 查找，首先在适配器上，然后在目标上。开销约为 11 纳秒。由于 `size()` 方法在 `BetterCollection` 接口中没有重载，我们不需要匹配参数类型。\n\
    \n在当前的数据集下，没有任何测试分配了内存。然而，如果集合的大小超过 127，则动态对象适配器需要为返回值分配一个 `Integer` 对象。\n\n|\
    \ Benchmark | ns/op ± 误差 | B/op EA 开启/关闭 |\n| --- | --- | --- |\n| plainSize()\
    \ | 3.517 ± 0.076 | 0 / 0 |\n| classAdapterSize() | 3.473 ± 0.040 | 0 / 0 |\n\
    | objectAdapterSize() | 3.489 ± 0.042 | 0 / 0 |\n| dynamicObjectAdapterSize()\
    \ | 14.378 ± 0.153 | 0 / 0 |\n\n### `toArray()` 的性能\n\n开销在静态和动态之间约为 6 纳秒。如下表所示，这需要在适配器上进行一次\
    \ `VTable` 查找。关于逃逸分析的信息，请参见标量替换。\n\n| Benchmark | ns/op ± 误差 | B/op EA 开启/关闭 |\n\
    | --- | --- | --- |\n| plainToArray() | 18.345 ± 0.096 | 64 / 64 |\n| classAdapterToArray()\
    \ | 22.385 ± 0.104 | 64 / 64 |\n| objectAdapterToArray() | 22.152 ± 0.177 | 64\
    \ / 64 |\n| dynamicObjectAdapterToArray() | 28.461 ± 0.209 | 64 / 64 |\n\n###\
    \ `forEachFiltered()` 的性能\n\n在 `BetterCollection` 内部定义的默认方法 `forEachFiltered()`\
    \ 开销最大，约为 26 纳秒。这需要 5 次 `VTable` 查找。首先在适配器和目标上查找，如果那里没有找到，则作为默认方法找到。然而，在内部，`forEachFiltered()`\
    \ 方法在循环中调用了 `iterator()`，这需要进行两次查找。\n\n所有测试都创建了迭代器（32 字节）。但是由于迭代器包含在方法内部，内存分配通常可以优化掉，动态适配除外。我们的动态代理具有更深的调用栈，正如我们在第\
    \ 3 章中所述。判断对象无法逃逸的计算复杂度很高，因此逃逸分析限制了分析的深度。在我们的情况下，逃逸分析放弃了，因此迭代器必须在堆上分配，并伴随着垃圾回收成本。由于方法的参数又浪费了\
    \ 24 字节。\n\n`dynamicObjectAdapterForEach()` 测试的分配速率约为 720 MB/s。这有点高，但远未达到机器的上限。作为对比，在我的机器上，我可以分配\
    \ 2.9 GB 的迭代器和 4.2 GB 的对象数组。瓶颈在于 `VTable` 查找，而不是对象分配。\n\n| Benchmark | ns/op ±\
    \ 误差 | B/op EA 开启/关闭 |\n| --- | --- | --- |\n| plainForEach() | 15.422 ± 0.062\
    \ | 0 / 32 |\n| classAdapterForEach() | 15.531 ± 0.043 | 0 / 32 |\n| objectAdapterForEach()\
    \ | 16.768 ± 0.047 | 0 / 32 |\n| dynamicObjectAdapterForEach() | 42.431 ± 0.262\
    \ | 56 / 56 |\n\n"
- fmt: "\nWhen we use dynamic proxies, we also might have a higher object allocation\
    \ rate, due to parameter arrays, boxed return values, and escape analysis not\
    \ being as effective as with direct calls.\n\n# Dynamic Composite\n\nWe use the\
    \ composite design pattern to create assemblies of objects. An example is a directory\
    \ structure with files, symbolic links, and other directories. A ZIP file is also\
    \ considered a composite, containing directories, files, and even other ZIP files.\
    \ We also see this pattern in use in GUI frameworks, where a panel can contain\
    \ buttons, labels, text fields, or other panels.\n\nIn this chapter, we examine\
    \ the composite design pattern and see how we can use dynamic proxies to help\
    \ implement composite object relationships. First, we see an example with email\
    \ contacts and distribution lists. Then we demonstrate how to use a dynamic-proxy-powered\
    \ composite instead of our handcrafted distribution list. Lastly, we see another\
    \ example for teeing output.\n\nThe GoF structure for the composite pattern is\
    \ shown in Figure 14.\n\n![CompositeStructure](images/ch01/CompositeStructure.png)\n\
    \nFigure 14. Structure of the composite design pattern.\n\nAstute readers might\
    \ notice that methods `add()`, `remove()`, and `getChild()` are defined in `Component`.\
    \ This overly general interface is the biggest criticism for this pattern. John\
    \ Vlissides wrote an excellent two-part article on the composite pattern, “Composite\
    \ à la Java [Part I](https://www.javaspecialists.eu/courses/dpc/archive/Composite1-Vlissides.pdf)”\
    \ and [“Part II”](https://www.javaspecialists.eu/courses/dpc/archive/Composite2-Vlissides.pdf),\
    \ in which he explained alternatives.\n\n## Contact, Person, and DistributionList\n\
    \nOne of Java’s first dynamic-proxy tutorials was published in [The Java Specialists'\
    \ Newsletter](https://www.javaspecialists.eu/archive/Issue005.html), distributed\
    \ via email. The newsletter started with 80 contacts, for which I created a distribution\
    \ list in Microsoft Outlook. To reduce spam, Microsoft Outlook restricted the\
    \ number of contacts in a single distribution list. Once the number of subscribers\
    \ reached the limit, I made a composite of distribution lists.\n\nThe structure\
    \ of our new `Contact` example is shown in Figure 15.\n\n![ContactHandcraftedExample](images/ch06/ContactHandcraftedExample.png)\n\
    \nFigure 15. Contact example.\n\n`Contact` is an interface representing a contact,\
    \ which can either be a single contact or a group of contacts. `Contact` has two\
    \ abstract methods: `sendMail()` and `count()`. It also has two default interface\
    \ methods that both return `false`: `add()` and `remove()`.\n\n```java\n//:~ core/src/main/.../ch06/contact/Contact.java\n\
    public interface Contact {\n  default boolean add(Contact c) { return false; }\n\
    \  default boolean remove(Contact c) { return false; }\n  void sendMail(String\
    \ body);\n  int count();\n}\n```\nListing 6.2: Contact interface.\n\n`Person`\
    \ is our spam victim.\n\nIn `sendMail()`, we connect to JavaMail and send the\
    \ actual message. (We have left out the JavaMail implementation details for brevity.)\n\
    \n```java\n//:~ core/src/main/.../ch06/contact/Person.java\npublic class Person\
    \ implements Contact {\n  private final String email;\n  public Person(String\
    \ email) {this.email = email;}\n  @Override\n  public void sendMail(String body)\
    \ {\n    // connecting to JavaMail and off it goes ...\n    System.out.println(\"\
    Sending \" + body + \" to \" + email);\n  }\n  @Override\n  public int count()\
    \ {\n    return 1;\n  }\n}\n```\nListing 6.3: Person class.\n\nOur `DistributionList`\
    \ is our composite class, made up of `Contact` instances. Since `DistributionList`\
    \ is itself a `Contact`, it can contain not only `Person` instances, but also\
    \ other `DistributionList` objects. `sendMail()` recursively spams all the contacts\
    \ in our list. `count()` is the sum of all our contained leaves.\n\n```java\n\
    //:~ core/src/main/.../ch06/contact/DistributionList.java\nimport java.util.*;\n\
    \npublic class DistributionList implements Contact {\n  private final Collection<Contact>\
    \ contacts = new ArrayList<>();\n\n  @Override\n  public boolean add(Contact c)\
    \ {\n    return contacts.add(c);\n  }\n  @Override\n  public boolean remove(Contact\
    \ c) {\n    return contacts.remove(c);\n  }\n  @Override\n  public void sendMail(String\
    \ body) {\n    contacts.forEach(contact -> contact.sendMail(body));\n  }\n  @Override\n\
    \  public int count() {\n    return contacts.stream().mapToInt(Contact::count).sum();\n\
    \  }\n}\n```\nListing 6.4: DistributionList class.\n\nNow that we have seen how\
    \ `Contact` relates to `Person` and `DistributionList`, it’s time to look at an\
    \ example.\n\n```java\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
    Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\nallStudents.add(new Person(\"mzani@absa.co.za\"));\njavaSpecialistsNewsletter.add(allStudents);\n\
    \njavaSpecialistsNewsletter.sendMail(\"Hello there 2\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    \nContact extremeJava = new DistributionList();\nextremeJava.add(new Person(\"\
    John@fnb.co.za\"));\nextremeJava.add(new Person(\"Hlope@fnb.co.za\"));\nallStudents.add(extremeJava);\n\
    \njavaSpecialistsNewsletter.sendMail(\"Hello there 3\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    ```\nListing 6.5: ContactDemo creating a composite structure.\n\nWe can see how\
    \ the contact objects are connected in Figure 16.\n\n![ContactObjectExample](images/ch06/ContactObjectExample.png)\n\
    \nFigure 16. ContactDemo object diagram.\n\nWhen we run this, we see the output\
    \ shown.\n\n```\n0\nSending Hello there 1 to john@aol.com\n1\nSending Hello there\
    \ 2 to john@aol.com\nSending Hello there 2 to peter@absa.co.za\nSending Hello\
    \ there 2 to mzani@absa.co.za\n3\nSending Hello there 3 to john@aol.com\nSending\
    \ Hello there 3 to peter@absa.co.za\nSending Hello there 3 to mzani@absa.co.za\n\
    Sending Hello there 3 to John@fnb.co.za\nSending Hello there 3 to Hlope@fnb.co.za\n\
    5\n```\nListing 6.6: ContactDemo output.\n\n## Hacking dynamic proxy for composites\n\
    \nCan we use a dynamic proxy instead of handcrafting `DistributionList`?\n\nThe\
    \ biggest difference between the composite and proxy patterns is the multiplicity\
    \ of the associations.\n\nA proxy pattern has a one-to-one relationship with the\
    \ subject whereas a composite pattern has a one-to-many relationship with the\
    \ component. When we call a method on the proxy, we can return the result to the\
    \ client. However, when we call a method on the composite, we might be faced with\
    \ many results. These have to be merged or reduced before returning a single result\
    \ to the client.\n\n`BaseComponent<T>` represents any hierarchy that implements\
    \ the composite design pattern. The generic type parameter `T` in `BaseComponent`\
    \ represents the extension interface — for example, `Contact`. It also has two\
    \ default methods, `add(T)` and `remove(T)`, which by default do nothing.\n\n\
    ```java\n//:~ core/src/main/.../handlers/BaseComponent.java\npublic interface\
    \ BaseComponent<T> {\n  default boolean add(T t) { return false; }\n  default\
    \ boolean remove(T t) { return false; }\n}\n```\nListing 6.7: BaseComponent interface.\n\
    \nWe further change `Contact` to extend `BaseComponent<Contact>`, inheriting the\
    \ `add()` and `remove()` methods.\n\n```java\n//:~ core/src/main/.../ch06/contactdynamic/Contact.java\n\
    public interface Contact extends BaseComponent<Contact> {\n  void sendMail(String\
    \ body);\n  int count();\n}\n```\nListing 6.8: Contact interface.\n\nOur `Contact`\
    \ extends `BaseComponent<Contact>`, shown in Figure 17.\n\n![ContactDynamicExample](images/ch06/ContactDynamicExample.png)\n\
    \nFigure 17. Contact extends BaseComponent.\n"
  raw: "When we use dynamic proxies, we also might have a higher object allocation\
    \ rate, due to parameter arrays, boxed return values, and escape analysis not\
    \ being as effective as with direct calls.\n\n# **Dynamic** **Composite**\n\n\
    We use the composite design pattern to create assemblies of objects. An example\
    \ is a directory structure with files, symbolic links, and other directories.\
    \ A ZIP file is also considered a composite, containing directories, files, and\
    \ even other ZIP files. We also see this pattern in use in GUI frameworks, where\
    \ a panel can contain buttons, labels, text fields, or other panels.\n\nIn this\
    \ chapter, we examine the composite design pattern and see how we can use dynamic\
    \ proxies to help implement composite object relationships. First, we see an example\
    \ with email contacts and distribution lists. Then we demonstrate how to use a\
    \ dynamic-proxy-powered composite instead of our handcrafted distribution list.\
    \ Lastly, we see another example for teeing output.\n\nThe GoF structure for the\
    \ composite pattern is shown in Figure 14.\n\n![CompositeStructure](images/ch01/CompositeStructure.png)\n\
    \nFigure 14\\. Structure of the composite design pattern.\n\nAstute readers might\
    \ notice that methods `add()`, `remove()`, and `getChild()` are defined in `Component`.\
    \ This overly general interface is the biggest criticism for this pattern. John\
    \ Vlissides wrote an excellent two-part article on the composite pattern, “Composite\
    \ à la Java [Part I](https://www.javaspecialists.eu/courses/dpc/archive/Composite1-Vlissides.pdf)”\
    \ and [“Part II”](https://www.javaspecialists.eu/courses/dpc/archive/Composite2-Vlissides.pdf),\
    \ in which he explained alternatives.\n\n## `Contact`, `Person`, and `DistributionList`\n\
    \nOne of Java’s first dynamic-proxy tutorials was published in [The Java Specialists'\
    \ Newsletter](https://www.javaspecialists.eu/archive/Issue005.html), distributed\
    \ via email. The newsletter started with 80 contacts, for which I created a distribution\
    \ list in Microsoft Outlook. To reduce spam, Microsoft Outlook restricted the\
    \ number of contacts in a single distribution list. Once the number of subscribers\
    \ reached the limit, I made a composite of distribution lists.\n\nThe structure\
    \ of our new `Contact` example is shown in Figure 15.\n\n![ContactHandcraftedExample](images/ch06/ContactHandcraftedExample.png)\n\
    \nFigure 15\\. `Contact` example.\n\n`Contact` is an interface representing a\
    \ contact, which can either be a single contact or a group of contacts. `Contact`\
    \ has two abstract methods: `sendMail()` and `count()`. It also has two default\
    \ interface methods that both return `false`: `add()` and `remove()`.\n\n```\n\
    //:~ core/src/main/.../ch06/contact/Contact.java\npublic interface Contact {\n\
    \  default boolean add(Contact c) { return false; }\n  default boolean remove(Contact\
    \ c) { return false; }\n  void sendMail(String body);\n  int count();\n}\n```\n\
    \nListing 6.2: `Contact` interface.\n\n`Person` is our spam victim.\n\nIn `sendMail()`,\
    \ we connect to JavaMail and send the actual message. (We have left out the JavaMail\
    \ implementation details for brevity.)\n\n```\n//:~ core/src/main/.../ch06/contact/Person.java\n\
    public class Person implements Contact {\n  private final String email;\n  public\
    \ Person(String email) {this.email = email;}\n  @Override\n  public void sendMail(String\
    \ body) {\n    // connecting to JavaMail and off it goes ...\n    System.out.println(\"\
    Sending \" + body + \" to \" + email);\n  }\n  @Override\n  public int count()\
    \ {\n    return 1;\n  }\n}\n```\n\nListing 6.3: `Person` class.\n\nOur `DistributionList`\
    \ is our composite class, made up of `Contact` instances. Since `DistributionList`\
    \ is itself a `Contact`, it can contain not only `Person` instances, but also\
    \ other `DistributionList` objects. `sendMail()` recursively spams all the contacts\
    \ in our list. `count()` is the sum of all our contained leaves.\n\n```\n//:~\
    \ core/src/main/.../ch06/contact/DistributionList.java\nimport java.util.*;\n\n\
    public class DistributionList implements Contact {\n  private final Collection<Contact>\
    \ contacts = new ArrayList<>();\n\n  @Override\n  public boolean add(Contact c)\
    \ {\n    return contacts.add(c);\n  }\n  @Override\n  public boolean remove(Contact\
    \ c) {\n    return contacts.remove(c);\n  }\n  @Override\n  public void sendMail(String\
    \ body) {\n    contacts.forEach(contact -> contact.sendMail(body));\n  }\n  @Override\n\
    \  public int count() {\n    return contacts.stream().mapToInt(Contact::count).sum();\n\
    \  }\n}\n```\n\nListing 6.4: `DistributionList` class.\n\nNow that we have seen\
    \ how `Contact` relates to `Person` and `DistributionList`, it’s time to look\
    \ at an example.\n\n```\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
    Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
    ));\nallStudents.add(new Person(\"mzani@absa.co.za\"));\njavaSpecialistsNewsletter.add(allStudents);\n\
    \njavaSpecialistsNewsletter.sendMail(\"Hello there 2\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    \nContact extremeJava = new DistributionList();\nextremeJava.add(new Person(\"\
    John@fnb.co.za\"));\nextremeJava.add(new Person(\"Hlope@fnb.co.za\"));\nallStudents.add(extremeJava);\n\
    \njavaSpecialistsNewsletter.sendMail(\"Hello there 3\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    ```\n\nListing 6.5: `ContactDemo` creating a composite structure.\n\nWe can see\
    \ how the contact objects are connected in Figure 16.\n\n![ContactObjectExample](images/ch06/ContactObjectExample.png)\n\
    \nFigure 16\\. `ContactDemo` object diagram.\n\nWhen we run this, we see the output\
    \ shown.\n\n```\n0\nSending Hello there 1 to john@aol.com\n1\nSending Hello there\
    \ 2 to john@aol.com\nSending Hello there 2 to peter@absa.co.za\nSending Hello\
    \ there 2 to mzani@absa.co.za\n3\nSending Hello there 3 to john@aol.com\nSending\
    \ Hello there 3 to peter@absa.co.za\nSending Hello there 3 to mzani@absa.co.za\n\
    Sending Hello there 3 to John@standardbank.co.za\nSending Hello there 3 to Hlope@standardbank.co.za\n\
    5\n```\n\nListing 6.6: `ContactDemo` output.\n\n## Hacking dynamic proxy for composites\n\
    \nCan we use a dynamic proxy instead of handcrafting `DistributionList`?\n\nThe\
    \ biggest difference between the composite and proxy patterns is the multiplicity\
    \ of the associations.\n\nA proxy pattern has a one-to-one relationship with the\
    \ subject whereas a composite pattern has a one-to-many relationship with the\
    \ component. When we call a method on the proxy, we can return the result to the\
    \ client. However, when we call a method on the composite, we might be faced with\
    \ many results. These have to be merged or reduced before returning a single result\
    \ to the client.\n\n`BaseComponent<T>` represents any hierarchy that implements\
    \ the composite design pattern. The generic type parameter `T` in `BaseComponent`\
    \ represents the extension interface — for example, `Contact`. It also has two\
    \ default methods, `add(T)` and `remove(T)`, which by default do nothing.\n\n\
    ```\n//:~ core/src/main/.../handlers/BaseComponent.java\npublic interface BaseComponent<T>\
    \ {\n  default boolean add(T t) { return false; }\n  default boolean remove(T\
    \ t) { return false; }\n}\n```\n\nListing 6.7: `BaseComponent` interface.\n\n\
    We further change `Contact` to extend `BaseComponent<Contact>`, inheriting the\
    \ `add()` and `remove()` methods.\n\n```\n//:~ core/src/main/.../ch06/contactdynamic/Contact.java\n\
    public interface Contact extends BaseComponent<Contact> {\n  void sendMail(String\
    \ body);\n  int count();\n}\n```\n\nListing 6.8: `Contact` interface.\n\nOur `Contact`\
    \ extends `BaseComponent<Contact>`, shown in Figure 17.\n\n![ContactDynamicExample](images/ch06/ContactDynamicExample.png)\n\
    \nFigure 17\\. `Contact` extends `BaseComponent`."
