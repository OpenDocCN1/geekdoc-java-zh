    \ + check);\n    }\n  }\n}\n```\n\n### `Reducer`\n\n`Reducer` 为 Stream 的 `reduce()`\
    \ 方法提供了我们所需的两个参数：一个 `identity` 和一个 `BinaryOperator`。\n\n```java\n//:~ core/src/main/.../handlers/Reducer.java\n\
    import java.util.function.*;\n\npublic final class Reducer {\n  private final\
    \ Object identity;\n  private final BinaryOperator<Object> merger;\n  public Reducer(Object\
    \ identity,\n                 BinaryOperator<Object> merger) {\n    this.merger\
    \ = merger;\n    this.identity = identity;\n  }\n  public Object getIdentity()\
    \ {\n    return identity;\n  }\n  public BinaryOperator<Object> getMerger() {\n\
    \    return merger;\n  }\n  public static final Reducer NULL_REDUCER =\n     \
    \ new Reducer(null, (o1, o2) -> null);\n  /**\n   * 将被替换为代理实例。\n   */\n  public\
    \ static final Reducer PROXY_INSTANCE_REDUCER =\n      new Reducer(null, (o1,\
    \ o2) -> null);\n}\n```\n\n### `Proxies`\n\n我们需要在 `Proxies` 类中添加四个方法用于创建动态复合结构。\n\
    \n```java\n//:~ core/src/main/.../Proxies.java\npublic static <T extends BaseComponent<?\
    \ super T>> T compose(\n    Class<T> component) {\n  return compose(component,\
    \ component);\n  }\npublic static <T extends BaseComponent<? super T>> T compose(\n\
    \    Class<T> component, Map<MethodKey, Reducer> reducers) {\n  return compose(component,\
    \ reducers, component);\n  }\npublic static <T extends BaseComponent<? super T>>\
    \ T compose(\n    Class<T> component, Class<?>... typeChecks) {\n  return compose(component,\
    \ Map.of(), typeChecks);\n}\n/**\n * @param component  要代理的接口。必须扩展\n *       \
    \            BaseComponent\n * @param reducers   从 MethodKey 到 Reducer 的映射，默认是\n\
    \ *                   空 Map Map.of()\n * @param typeChecks 传递给 add() 的对象参数必须\n\
    \ *                   扩展这些类型\n */\npublic static <T extends BaseComponent<? super\
    \ T>> T compose(\n    Class<T> component, Map<MethodKey, Reducer> reducers,\n\
    \    Class<?>... typeChecks) {\n  return castProxy(component,\n      new CompositeHandler(component,\
    \ reducers, typeChecks));\n}\n```\n\n"
- fmt: "\nTo create a composite of `Contact`, we first define a `Map<MethodKey, Reducer>`\
    \ for the `count()` method. We do not need a mapping for the `sendMail()` method,\
    \ since its return type is `void`. We then create our new dynamic distribution\
    \ list with `Proxies.compose(Contact.class, reducers)`.\n\nListing 6.12 is an\
    \ example.\n\n```java\n//:~ core/src/main/.../ch06/contactdynamic/ContactDynamicDemo.java\n\
    var reducers = Map.of(\n    new MethodKey(Contact.class, \"count\"),\n    new\
    \ Reducer(0, (r1, r2) -> (int) r1 + (int) r2)\n);\n\nContact javaSpecialistsNewsletter\
    \ =\n    Proxies.compose(Contact.class, reducers);\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents =\n    Proxies.compose(Contact.class, reducers);\nallStudents.add(new\
    \ Person(\"peter@absa.co.za\"));\nallStudents.add(new Person(\"mzani@absa.co.za\"\
    ));\njavaSpecialistsNewsletter.add(allStudents);\n\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 2\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact extremeJava =\n    Proxies.compose(Contact.class, reducers);\nextremeJava.add(new\
    \ Person(\"John@fnb.co.za\"));\nextremeJava.add(new Person(\"Hlope@fnb.co.za\"\
    ));\nallStudents.add(extremeJava);\n\njavaSpecialistsNewsletter.sendMail(\"Hello\
    \ there 3\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n```\n\n\
    Listing 6.12: `ContactDynamicDemo`.\n\nThe output looks the same as for our handwritten\
    \ `DistributionList` example.\n\n```\n0\nSending Hello there 1 to john@aol.com\n\
    1\nSending Hello there 2 to john@aol.com\nSending Hello there 2 to peter@absa.co.za\n\
    Sending Hello there 2 to mzani@absa.co.za\n3\nSending Hello there 3 to john@aol.com\n\
    Sending Hello there 3 to peter@absa.co.za\nSending Hello there 3 to mzani@absa.co.za\n\
    Sending Hello there 3 to John@standardbank.co.za\nSending Hello there 3 to Hlope@standardbank.co.za\n\
    5\n```\n\nListing 6.13: `ContactDynamicDemo Output`\n\n## AppendableFlushableCloseable`\n\
    \nAn interesting use case for composites is to write to several destinations at\
    \ once, similar to the Unix `tee` utility. Here, we create class `TeeOutputStream`,\
    \ as follows.\n\n```java\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStream.java\n\
    public class TeeOutputStream extends OutputStream {\n  private final OutputStream\
    \ out1, out2;\n  public TeeOutputStream(OutputStream out1, OutputStream out2)\
    \ {\n    this.out1 = out1;\n    this.out2 = out2;\n  }\n  @Override\n  public\
    \ void write(int b) throws IOException {\n    out1.write(b);\n    out2.write(b);\n\
    \  }\n  @Override\n  public void flush() throws IOException {\n    out1.flush();\n\
    \    out2.flush();\n  }\n  @Override\n  public void close() throws IOException\
    \ {\n    out1.close();\n    out2.close();\n  }\n}\n```\n\nListing 6.14: `TeeOutputStream`.\n\
    \nWe can create a new `TeeOutputStream` that writes both to `System.out` and to\
    \ a file. It is even possible to set `System.out` to write to our `TeeOutputStream`,\
    \ as follows.\n\n```java\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStreamDemo.java\n\
    System.setOut(\n    new PrintStream(\n        new TeeOutputStream(\n         \
    \   System.out,\n            new FileOutputStream(\"output.txt\"))));\n\nSystem.out.println(\"\
    Hello World\");\nSystem.out.println(\"This will show on console and in file\"\
    );\n```\n\nListing 6.15: `TeeOutputStreamDemo`.\n\nIt would be convenient if we\
    \ could create the `TeeOutputStream` as a dynamic composite. Unfortunately, `java.io.OutputStream`\
    \ is not a Java interface, a hard requirement for creating dynamic proxies. Similarly,\
    \ `java.io.Writer` is a class and not an interface. However, `Writer` implements\
    \ the `Appendable`, `Flushable`, and `Closeable` interfaces.\n\n### Handcrafted\
    \ `TeeAppendable` composite\n\nThe type parameter `E` of `TeeAppendable` ensures\
    \ that all children implement the three interfaces `Appendable`, `Flushable`,\
    \ and `Closeable`. The `append()` methods return `this`, whereas `close()` and\
    \ `flush()` return `void`. Additionally, our `TeeAppendable` gets `add()` and\
    \ `remove()` methods that by default return `false`.\n\n```java\n//:~ core/src/main/.../ch06/appendables/TeeAppendable.java\n\
    public class TeeAppendable<E extends\n                                 Appendable\n\
    \                                 & Flushable\n                              \
    \   & Closeable>\n    implements Appendable, Flushable, Closeable {\n  private\
    \ final Collection<E> children = new ArrayList<>();\n\n  public boolean add(E\
    \ child) {\n    return children.add(child);\n  }\n\n  public boolean remove(E\
    \ child) {\n    return children.remove(child);\n  }\n\n  @Override\n  public Appendable\
    \ append(CharSequence c) {\n    for (E child : children) {\n      child.append(c);\n\
    \    }\n    return this;\n  }\n\n  @Override\n  public Appendable append(char[]\
    \ strbuf, int off, int len) {\n    for (E child : children) {\n      child.append(strbuf,\
    \ off, len);\n    }\n    return this;\n  }\n\n  @Override\n  public void flush()\
    \ throws IOException {\n    for (E child : children) {\n      child.flush();\n\
    \    }\n  }\n\n  @Override\n  public void close() throws IOException {\n    for\
    \ (E child : children) {\n      child.close();\n    }\n  }\n}\n```\n\nListing\
    \ 6.16: `TeeAppendable`.\n\nWe can manually create an adapter that converts any\
    \ of these interfaces into a `Writer`. In English, this means that any class that\
    \ implements `Appendable`, `Flushable`, and `Closeable` can be converted to a\
    \ `Writer`.\n\n```java\n//:~ core/src/main/.../ch06/appendables/WriterAdapter.java\n\
    public class WriterAdapter<E extends Appendable\n                            \
    \     & Flushable\n                                 & Closeable>\n    extends\
    \ Writer {\n  private final E adaptee;\n\n  public WriterAdapter(E adaptee) {\n\
    \    this.adaptee = adaptee;\n  }\n\n  @Override\n  public void write(char[] strbuf,\
    \ int off, int len) {\n    adaptee.append(strbuf, off, len);\n  }\n\n  @Override\n\
    \  public void write(int c) {\n    adaptee.append((char) c);\n  }\n\n  @Override\n\
    \  public void flush() throws IOException {\n    adaptee.flush();\n  }\n\n  @Override\n\
    \  public void close() throws IOException {\n    adaptee.close();\n  }\n}\n```\n\
    \nListing 6.17: `WriterAdapter`.\n\nThe `AppendableDemo` shows how to use the\
    \ `TeeAppendable` in combination with `WriterAdapter`. Of particular interest\
    \ is the `var` keyword, introduced in Java 10. Java is a strongly typed language.\
    \ When we declare a local variable, we need to be precise about its type. In our\
    \ case, we want to declare that the local variable must be all three interfaces\
    \ `Appendable`, `Flushable`, and `Closeable`. There was no way to do this before\
    \ `var`.\n\n```java\n//:~ core/src/main/.../ch06/appendables/AppendableDemo.java\n\
    // \"var\" is a lifesaver here.  The \"correct\" definition would\n// be TeeAppendable<Appendable\
    \ & Flushable & Closeable>, but\n// that is not possible in Java.  \"var\" takes\
    \ care of it.\nvar tee = new TeeAppendable<>();\nvar sw = new StringWriter();\n\
    tee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"output.txt\"\
    ));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\nout.println(\"\
    Hello World\");\nout.flush();\n\ntee.append(\"TestingAppender\")\n    .append('\\\
    n')\n    .append(\"Does this work?\")\n    .append('\\n');\ntee.flush();\n\nSystem.out.println(\"\
    sw = \" + sw);\n```\n\nListing 6.18: `AppendableDemo`.\n\nWhen we run this example,\
    \ it writes the text to `System.out` and to a `StringWriter` called `sw` and a\
    \ file called `output.txt`.\n\n```\nHello World\nTestingAppender\nDoes this work?\n\
    sw = Hello World\nTestingAppender\nDoes this work?\n```\n\nListing 6.19: `AppendableDemo`\
    \ output.\n"
  raw: "To create a composite of `Contact`, we first define a `Map<MethodKey, Reducer>`\
    \ for the `count()` method. We do not need a mapping for the `sendMail()` method,\
    \ since its return type is `void`. We then create our new dynamic distribution\
    \ list with `Proxies.compose(Contact.class, reducers)`.\n\nListing 6.12 is an\
    \ example.\n\n```\n//:~ core/src/main/.../ch06/contactdynamic/ContactDynamicDemo.java\n\
    var reducers = Map.of(\n    new MethodKey(Contact.class, \"count\"),\n    new\
    \ Reducer(0, (r1, r2) -> (int) r1 + (int) r2)\n);\n\nContact javaSpecialistsNewsletter\
    \ =\n    Proxies.compose(Contact.class, reducers);\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
    javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact allStudents =\n    Proxies.compose(Contact.class, reducers);\nallStudents.add(new\
    \ Person(\"peter@absa.co.za\"));\nallStudents.add(new Person(\"mzani@absa.co.za\"\
    ));\njavaSpecialistsNewsletter.add(allStudents);\n\njavaSpecialistsNewsletter.sendMail(\"\
    Hello there 2\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\n\
    Contact extremeJava =\n    Proxies.compose(Contact.class, reducers);\nextremeJava.add(new\
    \ Person(\"John@fnb.co.za\"));\nextremeJava.add(new Person(\"Hlope@fnb.co.za\"\
    ));\nallStudents.add(extremeJava);\n\njavaSpecialistsNewsletter.sendMail(\"Hello\
    \ there 3\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n```\n\n\
    Listing 6.12: `ContactDynamicDemo`.\n\nThe output looks the same as for our handwritten\
    \ `DistributionList` example.\n\n```\n0\nSending Hello there 1 to john@aol.com\n\
    1\nSending Hello there 2 to john@aol.com\nSending Hello there 2 to peter@absa.co.za\n\
    Sending Hello there 2 to mzani@absa.co.za\n3\nSending Hello there 3 to john@aol.com\n\
    Sending Hello there 3 to peter@absa.co.za\nSending Hello there 3 to mzani@absa.co.za\n\
    Sending Hello there 3 to John@standardbank.co.za\nSending Hello there 3 to Hlope@standardbank.co.za\n\
    5\n```\n\nListing 6.13: `ContactDynamicDemo Output`\n\n## `AppendableFlushableCloseable`\n\
    \nAn interesting use case for composites is to write to several destinations at\
    \ once, similar to the Unix `tee` utility. Here, we create class `TeeOutputStream`,\
    \ as follows.\n\n```\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStream.java\n\
    public class TeeOutputStream extends OutputStream {\n  private final OutputStream\
    \ out1, out2;\n  public TeeOutputStream(OutputStream out1, OutputStream out2)\
    \ {\n    this.out1 = out1;\n    this.out2 = out2;\n  }\n  @Override\n  public\
    \ void write(int b) throws IOException {\n    out1.write(b);\n    out2.write(b);\n\
    \  }\n  @Override\n  public void flush() throws IOException {\n    out1.flush();\n\
    \    out2.flush();\n  }\n  @Override\n  public void close() throws IOException\
    \ {\n    out1.close();\n    out2.close();\n  }\n}\n```\n\nListing 6.14: `TeeOutputStream`.\n\
    \nWe can create a new `TeeOutputStream` that writes both to `System.out` and to\
    \ a file. It is even possible to set `System.out` to write to our `TeeOutputStream`,\
    \ as follows.\n\n```\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStreamDemo.java\n\
    System.setOut(\n    new PrintStream(\n        new TeeOutputStream(\n         \
    \   System.out,\n            new FileOutputStream(\"output.txt\"))));\n\nSystem.out.println(\"\
    Hello World\");\nSystem.out.println(\"This will show on console and in file\"\
    );\n```\n\nListing 6.15: `TeeOutputStreamDemo`.\n\nIt would be convenient if we\
    \ could create the `TeeOutputStream` as a dynamic composite. Unfortunately, `java.io.OutputStream`\
    \ is not a Java interface, a hard requirement for creating dynamic proxies. Similarly,\
    \ `java.io.Writer` is a class and not an interface. However, `Writer` implements\
    \ the `Appendable`, `Flushable`, and `Closeable` interfaces.\n\n### Handcrafted\
    \ `TeeAppendable` composite\n\nThe type parameter `E` of `TeeAppendable` ensures\
    \ that all children implement the three interfaces `Appendable`, `Flushable`,\
    \ and `Closeable`. The `append()` methods return `this`, whereas `close()` and\
    \ `flush()` return `void`. Additionally, our `TeeAppendable` gets `add()` and\
    \ `remove()` methods that by default return `false`.\n\n```\n//:~ core/src/main/.../ch06/appendables/TeeAppendable.java\n\
    public class TeeAppendable<E extends\n                                 Appendable\n\
    \                                 & Flushable\n                              \
    \   & Closeable>\n    implements Appendable, Flushable, Closeable {\n  private\
    \ final Collection<E> children = new ArrayList<>();\n\n  public boolean add(E\
    \ child) {\n    return children.add(child);\n  }\n\n  public boolean remove(E\
    \ child) {\n    return children.remove(child);\n  }\n\n  @Override\n  public Appendable\
    \ append(CharSequence cs) throws IOException {\n    for (var child : children)\
    \ child.append(cs);\n    return this;\n  }\n  @Override\n  public Appendable append(CharSequence\
    \ cs, int start, int end)\n      throws IOException {\n    for (var child : children)\
    \ child.append(cs, start, end);\n    return this;\n  }\n  @Override\n  public\
    \ Appendable append(char c) throws IOException {\n    for (var child : children)\
    \ child.append(c);\n    return this;\n  }\n  @Override\n  public void flush()\
    \ throws IOException {\n    for (var child : children) child.flush();\n  }\n \
    \ @Override\n  public void close() throws IOException {\n    for (var child :\
    \ children) child.close();\n  }\n}\n```\n\nListing 6.16: `TeeAppendable`.\n\n\
    We can manually create an adapter that converts any class that implements all\
    \ three of these interfaces into a `Writer`. Enter the `WriterAdapter`. Its adaptee\
    \ is of type `E` where `E extends Appendable & Flushable & Closeable`. In plain\
    \ English, this means that any class that implements all three of the `Appendable`,\
    \ `Flushable`, and `Closeable` interfaces can be converted to a `Writer`. Once\
    \ we do that, we can decorate it with a `PrintWriter` for all the fancy `println()`\
    \ and `printf()` calls.\n\n```\n//:~ core/src/main/.../ch06/appendables/WriterAdapter.java\n\
    public class WriterAdapter<E extends Appendable\n                            \
    \     & Flushable\n                                 & Closeable>\n    extends\
    \ Writer {\n  private final E adaptee;\n\n  public WriterAdapter(E adaptee) {\n\
    \    this.adaptee = adaptee;\n  }\n  @Override\n  public void write(char[] cbuf,\
    \ int off, int len)\n      throws IOException {\n    for (int i = off; i < off\
    \ + len; i++) {\n      adaptee.append(cbuf[i]);\n    }\n  }\n  @Override\n  public\
    \ void flush() throws IOException {\n    adaptee.flush();\n  }\n  @Override\n\
    \  public void close() throws IOException {\n    adaptee.close();\n  }\n}\n```\n\
    \nListing 6.17: `WriterAdapter`.\n\n`AppendableDemo` shows how to use the `TeeAppendable`\
    \ in combination with the `WriterAdapter`. Of particular interest is the `var`\
    \ keyword, introduced in Java version 10. Java is a strongly typed language. When\
    \ we declare a local variable, we need to be precise about its type. In our case,\
    \ we want to declare that the local variable must be all three interfaces of `Appendable`,\
    \ `Flushable`, and `Closeable`. There was no way to do this before `var`.\n\n\
    ```\n//:~ core/src/main/.../ch06/appendables/AppendableDemo.java\n// \"var\" is\
    \ a lifesaver here.  The \"correct\" definition would\n// be TeeAppendable<Appendable\
    \ & Flushable & Closeable>, but\n// that is not possible in Java.  \"var\" takes\
    \ care of it.\nvar tee = new TeeAppendable<>();\nvar sw = new StringWriter();\n\
    tee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"output.txt\"\
    ));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\nout.println(\"\
    Hello World\");\nout.flush();\n\ntee.append(\"TestingAppender\")\n    .append('\\\
    n')\n    .append(\"Does this work?\")\n    .append('\\n');\ntee.flush();\n\nSystem.out.println(\"\
    sw = \" + sw);\n```\n\nListing 6.18: `AppendableDemo`.\n\nWhen we run this example,\
    \ it writes the text to `System.out` and to a `StringWriter` called `sw` and a\
    \ file called `output.txt`.\n\n```\nHello World\nTestingAppender\nDoes this work?\n\
    sw = Hello World\nTestingAppender\nDoes this work?\n```\n\nListing 6.19: `AppendableDemo`\
    \ output.\n\n### Dynamic-proxy-powered `AppendableFlushableCloseable`"
