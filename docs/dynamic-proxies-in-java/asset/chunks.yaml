    Sending Hello there 3 to mzani@absa.co.za\nSending Hello there 3 to John@standardbank.co.za\n\
    Sending Hello there 3 to Hlope@standardbank.co.za\n5\n```\n\n列表 6.13: `ContactDynamicDemo\
    \ 输出`\n\n## `AppendableFlushableCloseable`\n\n复合体的一个有趣用例是同时向多个目标写入，类似于 Unix 的\
    \ `tee` 工具。在这里，我们如下创建了类 `TeeOutputStream`。\n\n```java\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStream.java\n\
    public class TeeOutputStream extends OutputStream {\n  private final OutputStream\
    \ out1, out2;\n  public TeeOutputStream(OutputStream out1, OutputStream out2)\
    \ {\n    this.out1 = out1;\n    this.out2 = out2;\n  }\n  @Override\n  public\
    \ void write(int b) throws IOException {\n    out1.write(b);\n    out2.write(b);\n\
    \  }\n  @Override\n  public void flush() throws IOException {\n    out1.flush();\n\
    \    out2.flush();\n  }\n  @Override\n  public void close() throws IOException\
    \ {\n    out1.close();\n    out2.close();\n  }\n}\n```\n\n列表 6.14: `TeeOutputStream`。\n\
    \n我们可以创建一个新的 `TeeOutputStream`，使其同时写入 `System.out` 和文件。甚至可以将 `System.out` 设置为写入我们的\
    \ `TeeOutputStream`，如下所示。\n\n```java\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStreamDemo.java\n\
    System.setOut(\n    new PrintStream(\n        new TeeOutputStream(\n         \
    \   System.out,\n            new FileOutputStream(\"output.txt\"))));\n\nSystem.out.println(\"\
    Hello World\");\nSystem.out.println(\"This will show on console and in file\"\
    );\n```\n\n列表 6.15: `TeeOutputStreamDemo`。\n\n如果能作为动态复合体创建 `TeeOutputStream` 将非常方便。遗憾的是，`java.io.OutputStream`\
    \ 不是 Java 接口，这是创建动态代理的强制要求。同样，`java.io.Writer` 是一个类而不是接口。然而，`Writer` 实现了 `Appendable`、`Flushable`\
    \ 和 `Closeable` 接口。\n\n### 手工实现的 `TeeAppendable` 复合体\n\n`TeeAppendable` 的类型参数\
    \ `E` 确保所有子类实现了 `Appendable`、`Flushable` 和 `Closeable` 这三个接口。`append()` 方法返回 `this`，而\
    \ `close()` 和 `flush()` 返回 `void`。此外，我们的 `TeeAppendable` 获得了 `add()` 和 `remove()`\
    \ 方法，它们默认返回 `false`。\n\n```java\n//:~ core/src/main/.../ch06/appendables/TeeAppendable.java\n\
    public class TeeAppendable<E extends\n                                 Appendable\n\
    \                                 & Flushable\n                              \
    \   & Closeable>\n    implements Appendable, Flushable, Closeable {\n  private\
    \ final Collection<E> children = new ArrayList<>();\n\n  public boolean add(E\
    \ child) {\n    return children.add(child);\n  }\n\n  public boolean remove(E\
    \ child) {\n    return children.remove(child);\n  }\n\n  @Override\n  public Appendable\
    \ append(CharSequence c) {\n    for (E child : children) {\n      child.append(c);\n\
    \    }\n    return this;\n  }\n\n  @Override\n  public Appendable append(char[]\
    \ strbuf, int off, int len) {\n    for (E child : children) {\n      child.append(strbuf,\
    \ off, len);\n    }\n    return this;\n  }\n\n  @Override\n  public void flush()\
    \ throws IOException {\n    for (E child : children) {\n      child.flush();\n\
    \    }\n  }\n\n  @Override\n  public void close() throws IOException {\n    for\
    \ (E child : children) {\n      child.close();\n    }\n  }\n}\n```\n\n列表 6.16:\
    \ `TeeAppendable`。\n\n我们可以手动创建一个适配器，将这些任何接口转换为 `Writer`。这意味着任何实现了 `Appendable`、`Flushable`\
    \ 和 `Closeable` 的类都可以转换为 `Writer`。\n\n```java\n//:~ core/src/main/.../ch06/appendables/WriterAdapter.java\n\
    public class WriterAdapter<E extends Appendable\n                            \
    \     & Flushable\n                                 & Closeable>\n    extends\
    \ Writer {\n  private final E adaptee;\n\n  public WriterAdapter(E adaptee) {\n\
    \    this.adaptee = adaptee;\n  }\n\n  @Override\n  public void write(char[] strbuf,\
    \ int off, int len) {\n    adaptee.append(strbuf, off, len);\n  }\n\n  @Override\n\
    \  public void write(int c) {\n    adaptee.append((char) c);\n  }\n\n  @Override\n\
    \  public void flush() throws IOException {\n    adaptee.flush();\n  }\n\n  @Override\n\
    \  public void close() throws IOException {\n    adaptee.close();\n  }\n}\n```\n\
    \n列表 6.17: `WriterAdapter`。\n\n`AppendableDemo` 展示了如何结合 `WriterAdapter` 使用 `TeeAppendable`。特别关注的是\
    \ Java 10 引入的 `var` 关键字。Java 是一种强类型语言。当我们声明局部变量时，需要精确其类型。在我们的情况下，我们希望声明该变量必须是\
    \ `Appendable`、`Flushable` 和 `Closeable` 这三个接口。在 `var` 出现之前没有方法可以做到。\n\n```java\n\
    //:~ core/src/main/.../ch06/appendables/AppendableDemo.java\n// \"var\" 在这里是救命稻星。“正确的”定义应该是\n\
    // TeeAppendable<Appendable & Flushable & Closeable>，但这在\n// Java 中是不可能的。“var”\
    \ 帮我们解决了这个问题。\nvar tee = new TeeAppendable<>();\nvar sw = new StringWriter();\n\
    tee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"output.txt\"\
    ));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\nout.println(\"\
    Hello World\");\nout.flush();\n\ntee.append(\"TestingAppender\")\n    .append('\\\
    n')\n    .append(\"Does this work?\")\n    .append('\\n');\ntee.flush();\n\nSystem.out.println(\"\
    sw = \" + sw);\n```\n\n列表 6.18: `AppendableDemo`。\n\n当我们运行这个示例时，它会将文本写入 `System.out`、一个名为\
    \ `sw` 的 `StringWriter` 以及名为 `output.txt` 的文件。\n\n```\nHello World\nTestingAppender\n\
    Does this work?\nsw = Hello World\nTestingAppender\nDoes this work?\n```\n\n列表\
    \ 6.19: `AppendableDemo 输出`。\n\n"
- fmt: "\nNow let’s see how to build the same use case with dynamic proxies. In this\
    \ case, we create an `AppendableFlushableCloseable` interface that extends the\
    \ three `Appendable`, `Flushable`, `Closeable` interfaces, as well as `BaseComponent<E>`.\
    \ We also provide a `getReducers()` method to make it easier to construct composites\
    \ with our `Proxies` façade. The `append()` methods are supposed to return a pointer\
    \ to the current object — in other words, `this`. Inside an `InvocationHandler`,\
    \ the pointer to the current proxy object is the `proxy` parameter. By specifying\
    \ the `PROXY_INSTANCE_REDUCER` as a `Reducer`, we tell the `CompositeHandler`\
    \ to return the `proxy` parameter once all the methods have been called on the\
    \ children.\n\n```java\n//:~ core/src/main/.../ch06/appendables/AppendableFlushableCloseable.java\n\
    public interface AppendableFlushableCloseable<E extends\n                    \
    \                                Appendable\n                                \
    \                    & Flushable\n                                           \
    \         & Closeable)\n    extends Appendable, Flushable, Closeable, BaseComponent<E>\
    \ {\n  static Map<MethodKey, Reducer> getReducers() {\n    return Map.of(\n  \
    \      new MethodKey(Appendable.class, \"append\",\n            CharSequence.class),\n\
    \        Reducer.PROXY_INSTANCE_REDUCER,\n        new MethodKey(Appendable.class,\
    \ \"append\",\n            CharSequence.class, int.class, int.class),\n      \
    \  Reducer.PROXY_INSTANCE_REDUCER,\n        new MethodKey(Appendable.class, \"\
    append\", char.class),\n        Reducer.PROXY_INSTANCE_REDUCER);\n  }\n}\n```\n\
    \nListing 6.20: `AppendableFlushableCloseable`.\n\nWe can use the `AppendableFlushableCloseable`\
    \ as an interface to create dynamic tee composites. Our sample code looks almost\
    \ identical to that in Listing 6.18, except that we do not need to manually construct\
    \ a `TeeAppendable`.\n\n```java\n//:~ core/src/main/.../ch06/appendables/AppendableDynamicDemo.java\n\
    var tee = Proxies.compose(AppendableFlushableCloseable.class,\n    AppendableFlushableCloseable.getReducers(),\n\
    \    Appendable.class, Flushable.class, Closeable.class\n);\nvar sw = new StringWriter();\n\
    tee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"output.txt\"\
    ));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\nout.println(\"\
    Hello World Dynamic\");\nout.flush();\n\ntee.append(\"TestingAppenderDynamic\"\
    )\n    .append('\\n')\n    .append(\"Does this work?\")\n    .append('\\n');\n\
    tee.flush();\n\nSystem.out.println(\"sw = \" + sw);\n```\n\nListing 6.21: `AppendableDynamicDemo`.\n\
    \nThe output of the `AppendableDynamicDemo` is in Listing 6.22.\n\n```\nHello\
