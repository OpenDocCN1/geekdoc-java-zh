    \ - return proxy unchanged;\n        return proxy;\n      }\n    }\n    @Override\n\
    \    public Method turboBoost(Method method) {\n      try {\n        method.setAccessible(true);\n\
    \      } catch (RuntimeException e) {\n        // could not turbo-boost - return\
    \ method unchanged;\n      }\n      return method;\n    }\n  }\n\n  private static\
    \ class BoosterOff implements Booster {\n    @Override\n    public <E> E turboBoost(E\
    \ proxy) {\n      if (!(proxy instanceof Proxy))\n        throw new IllegalArgumentException(\n\
    \            \"Can only turboboost instances of Proxy\"\n        );\n      return\
    \ proxy;\n    }\n    @Override\n    public Method turboBoost(Method method) {\n\
    \      return method;\n    }\n  }\n}\n```\n\nListing 3.11: `MethodTurboBooster`.\n\
    \n## Unwrapping the `InvocationTargetException`\n\n`InvocationHandler.invoke()`\
    \ declares that it throws `Throwable`, but, as we saw in the `$Proxy0` class,\
    \ any unexpected exception is wrapped in an `UndeclaredThrowableException`. Consider\
    \ the code in Listing 3.12\\. On careful inspection of the code, we see that we\
    \ are reversing the comparison in our reflective call `method.invoke()`. Thus,\
    \ we are comparing `String` to our proxy, which should result in a `ClassCastException`.\n\
    \n```\n//:~ core/src/main/.../ch03/gotchas/RecastingExceptionsBroken.java\nComparable<String>\
    \ comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n        Comparable.class.getClassLoader(),\n\
    \        new Class<?>[] {Comparable.class},\n        (proxy, method, params) ->\n\
    \            method.invoke(params[0], proxy));\nSystem.out.println(comp.compareTo(\"\
    hello\"));\n```\n\nListing 3.12: `RecastingExceptionsBroken`.\n\nWhen we run this\
    \ code, we instead see three exceptions chained together.\n\n```\nException in\
    \ thread \"main\" java.lang.reflect.UndeclaredThrowableException\n\tat com.sun.proxy.$Proxy0.compareTo(Unknown\
    \ Source)\n\tat ...ch03.gotchas.RecastingExceptionsBroken.main\nCaused by: java.lang.reflect.InvocationTargetException\n\
    \tat ...\n\tat ...ch03.gotchas.RecastingExceptionsBroken.lambda$main$0\nCaused\
    \ by: java.lang.ClassCastException: class com.sun.proxy.$Proxy0\n     cannot be\
    \ cast to class java.lang.String\n```\n\nListing 3.13: Output from `RecastingExceptionsBroken`.\n\
    \nIf we had thrown `ClassCastException` directly, since that is a `RuntimeException`,\
    \ our proxy code would have passed it on to the caller. Thus, if we use reflection\
    \ inside our `InvocationHandler.handle()` method, we need to throw the exception\
    \ contained inside the `InvocationTargetException`. To make this easier, we wrote\
    \ an `ExceptionUnwrappingInvocationHandler` in Listing 3.14."
