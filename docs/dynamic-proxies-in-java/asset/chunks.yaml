  trans: "\n\n```java\n//:~ core/src/main/.../ch04/immutablecollection/HandcodedFilter.java\n\
    public class HandcodedFilter<E>\n    implements ImmutableCollection<E> {\n  private\
    \ final Collection<E> c;\n\n  public HandcodedFilter(Collection<E> c) {\n    this.c\
    \ = c;\n  }\n\n  @Override\n  public int size() {\n    return c.size();\n  }\n\
    \  @Override\n  public boolean isEmpty() {\n    return c.isEmpty();\n  }\n  @Override\n\
    \  public boolean contains(Object o) {\n    return c.contains(o);\n  }\n  @Override\n\
    \  public Object[] toArray() {\n    return c.toArray();\n  }\n  @Override\n  public\
    \ <T> T[] toArray(T[] a) {\n    return c.toArray(a);\n  }\n  @Override\n  public\
    \ <T> T[] toArray(IntFunction<T[]> generator) {\n    return c.toArray(generator);\n\
    \  }\n  @Override\n  public boolean containsAll(Collection<?> c) {\n    return\
    \ this.c.containsAll(c);\n  }\n  @Override\n  public Spliterator<E> spliterator()\
    \ {\n    return c.spliterator();\n  }\n  @Override\n  public Stream<E> stream()\
    \ {\n    return c.stream();\n  }\n  @Override\n  public Stream<E> parallelStream()\
    \ {\n    return c.parallelStream();\n  }\n  @Override\n  public void forEach(Consumer<?\
    \ super E> action) {\n    c.forEach(action);\n  }\n}\n```\n\nListing 4.3：`HandcodedFilter`。\n\
    \n以下是如何使用 `HandcodedFilter` 来过滤掉我们不需要支持的方法。\n\n```java\n//:~ core/src/main/.../ch04/immutablecollection/HandcodedFilterDemo.java\n\
    ImmutableCollection<String> names =\n    new HandcodedFilter<>(\n        Arrays.asList(\"\
    Peter\", \"Paul\", \"Mary\"));\n// names.remove(\"Peter\"); // 无法编译\nSystem.out.println(names);\n\
    System.out.println(\"Is Mary in? \" + names.contains(\"Mary\"));\nSystem.out.println(\"\
    Are there names? \" + !names.isEmpty());\nSystem.out.println(\"Printing the names:\"\
    );\nnames.forEach(System.out::println);\nSystem.out.println(\"Class: \" +\n  \
    \                     names.getClass().getSimpleName());\n\nnames.printAll();\n\
    ```\n\nListing 4.4：`HandcodedFilterDemo`。当我们运行代码时，我们会在 Listing 4.5 中看到输出。\n\n\
    ```\neu.javaspecialists.HandcodedFilter@1bfb97\nIs Mary in? true\nAre there names?\
    \ true\nPrinting the names:\nPeter\nPaul\nMary\nClass: HandcodedFilter\nPeter\n\
    Mary\n```\n\nListing 4.5：来自 `HandcodedFilter` 的输出。\n\n## 使用动态代理实现过滤器\n\n与其手动编写装饰器（decorator），我们可以使用\
    \ Java 的动态代理（dynamic proxy）来创建一个装饰器。我们的规则如下：\n\n- 我们将从一个接口和一个对象创建过滤器。\n- 我们将过滤器的每个公共方法映射到该对象上。\n\
    - 为了简单起见，我们只考虑方法名和参数类型。返回类型必须匹配，否则我们将拒绝该方法。\n- 我们需要包含对默认方法（default methods）的支持。\n\
    - 如果对象不具备过滤器中的所有方法，则构建动态过滤器应该失败。\n\nListing 4.6 显示了 `FilterHandler`。我们编写了自己的 `VTable`\
    \ 来实现虚方法表（virtual method table），这是面向对象中用于将虚方法路由到正确接收者的概念。我稍后会详细解释 `VTable` 和 `FilterHandler`。现在，知道\
    \ `VTable` 用于匹配无关接口之间的方法（包括默认方法）就足够了。`FilterHandler` 使用[责任链设计模式](https://javaspecialists.com/p/d5)来链接多个\
    \ `VTable` 查找。在我们链的构建过程中，我们还验证了过滤器中的所有方法都有相应的处理器。\n\n```java\n//:~ core/src/main/.../handlers/FilterHandler.java\n\
    public final class FilterHandler implements InvocationHandler {\n  private final\
    \ InvocationHandler chain;\n\n  public FilterHandler(Class<?> filter, Object component)\
    \ {\n    VTable vt = new VTable(component.getClass(), filter);\n    VTable defaultVT\
    \ = vt.getDefaultMethods(filter);\n\n    chain = new ChainedInvocationHandler(vt,\
    \ defaultVT);\n\n    chain.checkAllMethodsHandled();\n  }\n\n  @Override\n  public\
    \ Object invoke(Object proxy, Method method, Object[] args) throws Throwable {\n\
    \    return chain.invoke(proxy, method, args);\n  }\n}\n```\n\nListing 4.6：`FilterHandler`。我们现在可以使用\
    \ `filter()` 方法创建动态过滤器。\n\n```java\n//:~ core/src/main/.../Proxies.java\npublic\
    \ static <F> F filter(Class<? super F> filter, Object component) {\n  Objects.requireNonNull(component);\n\
    \  return (F) proxy(filter, component);\n}\n```\n\nListing 4.7：`Proxies.filter()`。我们可以使用动态创建的类来过滤掉我们不想支持的方法。\n\
    \n```java\n//:~ core/src/main/.../ch04/immutablecollection/DynamicFilterDemo.java\n\
    ImmutableCollection<String> names =\n    Proxies.filter(\n        ImmutableCollection.class,\n\
    \        Arrays.asList(\"Peter\", \"Paul\", \"Mary\"));\n// names.remove(\"Peter\"\
    ); // 无法编译\nSystem.out.println(names);\nSystem.out.println(\"Is Mary in? \" +\
    \ names.contains(\"Mary\"));\nSystem.out.println(\"Are there names? \" + !names.isEmpty());\n\
    System.out.println(\"Printing the names:\");\nnames.forEach(System.out::println);\n\
    System.out.println(\"Class: \" +\n                       names.getClass().getSimpleName());\n\
    ```\n\nListing 4.8：`DynamicFilterDemo`。当我们运行代码时，我们会在 Listing 4.9 中看到输出。\n\n```\n\
    [Peter, Paul, Mary]\nIs Mary in? true\nAre there names? true\nPrinting the names:\n\
    Peter\nPaul\nMary\nClass: Proxy0\n```\n\nListing 4.9：来自 `DynamicFilter` 的输出。\n\
    \n## InfiniteRandomDouble 装饰器\n\n假设我们希望生成无限的 `Double` 实例，因此我们在 Listing 4.10 中编写了\
    \ `InfiniteRandomDouble` 类。\n\n```java\n//:~ core/src/main/.../ch04/initerandom/InfiniteRandomDouble.java\n\
    /**\n * 与 Iterator 接口没有关系。\n */\npublic class InfiniteRandomDouble {\n  public\
    \ boolean hasNext() {\n    return true;\n  }\n  public Double next() {\n    return\
    \ ThreadLocalRandom.current().nextDouble();\n  }\n}\n```\n\nListing 4.10：`InfiniteRandomDouble`。在后续阶段，我们意识到如果能用\
    \ `Iterator<Double>` 来装饰它就好了。与其让 `InfiniteRandomDouble` 类实现接口，不如通过 `Proxies.filter(Iterator.class,\
    \ new InfiniteRandomDouble())` 创建 `Iterator`。如果我们在 JPMS 模块中运行，我们需要显式地开放 `java.base`\
    \ 模块的 `java.util` 包。如果我们的模块是 `javaspecialists.books.dynamicproxies`，那么我们需要使用 JVM\
    \ 参数 `--add-opens java.base/java.util=javaspecialists.books.dynamicproxies`。\n\
    \n```java\n/**\n * 如果我们在模块内部，我们需要显式向我们的模块打开\n * java.base 模块内的 java.util 包。我们可以通过\
    \ JVM 参数\n * --add-opens \\\n * java.base/java.util=javaspecialists.books.dynamicproxies\n\
    \ * 这一点。否则，VTable 将不会包含默认方法。\n */\npublic class DefaultMethodCallDemo {\n  public\
    \ static void main(String... args) {\n    Iterator<Double> filter = Proxies.filter(\n\
    \        Iterator.class, new InfiniteRandomDouble());\n\n    System.out.println(filter.hasNext());\n\
    \    System.out.println(filter.next());\n\n    try {\n      filter.remove();\n\
    \      throw new AssertionError(\n          \"Expected an UnsupportedOperationException\"\
    );\n    } catch (UnsupportedOperationException expected) {\n      System.err.println(expected);\n\
    \    }\n\n    System.out.println(\"Iterating forever ...\");\n\n    filter.forEachRemaining(System.out::println);\n\
    \  }\n}\n```\n\nListing 4.11：`DefaultMethodCallDemo`。在没有 `--add-opens` 参数的情况下运行会抛出\
    \ `IllegalArgumentException`，因为默认方法 `remove()` 和 `forEachRemaining()` 只有在 `.java.util`\
    \ 包开放时才能被包含。\n\n"
