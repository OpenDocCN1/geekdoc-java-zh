    # 设计模式的亲戚


    建筑师是规划、设计和审查建筑建造的人。他们的成品本身很难改变，因为从字面上讲，它是浇在混凝土里的。软件一直在变化，即使在安装多年后也是如此，因此，建筑师克里斯托弗·亚历山德（Christopher
    Alexander）1977 年的著作 [*A Pattern Language: Towns, Buildings, Construction*](https://www.goodreads.com/en/book/show/79766.A_Pattern_Language)
    对软件行业的影响之令人惊讶。亚历山德的书关于建筑的永恒方式。他提炼了历史上反复出现的栖息模式——例如第 159 号模式，被称为“每个房间两侧的光线”。由于其描述性的名称，我们可以很容易地视觉化这种模式。


    在 20 世纪 90 年代，软件行业采纳了亚历山德提出的原理并应用于软件设计。面向对象设计模式的概念在 Erich Gamma、Richard Helm、Ralph
    Johnson 和 John Vlissides 编写的 [*Design Patterns: Elements of Reusable Object-Oriented
    Software*](https://www.oreilly.com/library/view/design-patterns-elements/0201633612/)
    中被永化。这四位作者通常被称为“四人帮”（Gang of Four）或简单称为 GoF。


    模式最重要的标识符之一是它的名称。在《Timeless Way of Building》中，亚历山德写道：“寻找名称是发明或发现模式过程的基本组成部分。只要模式有一个很弱的名称，就意味着它不是一个清晰的概念，你不能让我去制造‘一个’。”


    设计模式同样为常见的编码技术命名，使得意图的传达更加容易。了解模式有助于我们更快地理解现有设计。遗憾的是，GoF 的模式名称没有亚历山德的那么丰富。“像 wrapper（包装器）这样的名称可能意味着任何意思。因此，我们也依赖*意图*来清晰地识别每个模式。


    在书中，我们将主要关注四个模式：`proxy`、`adapter`、`decorator` 和 `composite`。它们都是结构性模式，这意味着它们不描述行为或对象的创建，而是类和对象如何相互作用。


    我们的四个模式具有类似的类层次结构，因此只需一点努力就可以使用动态代理来实现它们。它们的外观如此相似，以至于我们可以称之为“模式亲戚”。


    ## 代理模式


    意图：“为对象提供代理或占位符以控制对其的访问。”（GoF 1994, p.207）


    在代理模式中，客户端通过替代品（代理）进行通信，就像腹语木偶（如 *Trailer Boys* 中的 Conky）。


    ![ProxyViloquist](img/ProxyViloquist.jpg)


    标准的 GoF 结构如图 1 所示。`Client` 使用 `Subject`，它可以是 `RealSubject` 或是 `Proxy`。`Client`
    不知道，不在乎。在标准的 GoF 结构中，`Proxy` 指向 `RealSubject`。代理结构的一种变体是让 `Proxy` 指向 `Subject`。这允许我们实现级联代理。我们将在下一章末尾详细检查级联代理。


    ![ProxyStructure](img/ProxyStructure.png)


    图 1 代理设计模式的结构。


    代理有几种用例：


    *   **虚拟代理**按需创建昂贵对象。示例是 Spring Framework 中的 `LazyConnectionDataSourceProxy`，它在创建第一个
    `Statement` 时延迟创建真实的 JDBC `DataSource`。

    *   **远程代理**为位于不同地址空间（例如远程机器上）的对象提供本地表示。注意，远程代理没有远程对象的真实指针，而是通过 RPC、RMI、Thrift、ProtoBuf、gRPC、REST、HTTP、TCP/UDP
    或不同的远程调用机制调用方法。

    *   **保护代理**控制对原始对象的访问。这可能是为了访问控制或线程安全。示例是 `Collections.synchronizedCollection()`，它返回一个受竞态条件保护的新
    `Collection`。


    ## 适配器模式


