  trans: "\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterConcurrentSkipListSet.java\n\
    public class BetterConcurrentSkipListSet<E>\n    extends ConcurrentSkipListSet<E>\n\
    \    implements BetterCollection<E> {\n  private final E[] seedArray;\n  public\
    \ BetterConcurrentSkipListSet(E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\n          \"seedArray must be empty\"\
    );\n    this.seedArray = seedArray;\n  }\n  @Override\n  public E[] toArray()\
    \ {\n    return toArray(seedArray);\n  }\n  @Override\n  public String toString()\
    \ {\n    return \"--\" + super.toString() + \"--\";\n  }\n}\n```\n\nListing 5.5:\
    \ `BetterConcurrentSkipListSet`。\n\n我们可以看到，类适配器虽然只需要几行代码，但确实有一些缺点。首先，我们必须为每个具体的集合单独子类。这可能花费长时间。在\
    \ Java 13 中，仅 JDK 中的 `Collection` 就有 277 个子类！\n\n其次，我们只能扩展我们可以控制构造的类。例如，要在 Java\
    \ 中构造一个并发的 `HashSet`，我们使用 `ConcurrentHashMap.newKeySet()` 静态工厂方法。它返回 `KeySetView`，这是\
    \ `ConcurrentHashMap` 的公共静态内部类，具有包级访问的构造函数。由于构造函数不可访问，我们无法扩展 `KeySetView`，因此我们无法使用类适配器模式将其转换为\
    \ `BetterCollection`。\n\n相反，我们可以编写一个实现 `BetterCollection` 并包装 `Collection` 适配对象的对象适配器。注意，我们我们需要实现\
    \ `Collection` 的所有方法。相当繁琐，不是吗？\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapter.java\n\
    public class BetterCollectionObjectAdapter<E>\n    implements BetterCollection<E>\
    \ {\n  private final Collection<E> adaptee;\n  private final E[] seedArray;\n\n\
    \  public BetterCollectionObjectAdapter(Collection<E> adaptee,\n             \
    \                          E[] seedArray) {\n    if (seedArray.length != 0)\n\
    \      throw new IllegalArgumentException(\n          \"seedArray must be empty\"\
    );\n\n    this.adaptee = adaptee;\n    this.seedArray = seedArray;\n  }\n\n  @Override\n\
    \  public E[] toArray() {\n    return adaptee.toArray(seedArray);\n  }\n\n  @Override\n\
    \  public String toString() {\n    return \"--\" + adaptee.toString() + \"--\"\
    ;\n  }\n\n  // 这是对象适配器设计模式中的典型问题\n  // - 我们必须实现所有方法 ::-\n  @Override\n  public\
    \ int size() {\n    return adaptee.size();\n  }\n\n  @Override\n  public boolean\
    \ isEmpty() {\n    return adaptee.isEmpty();\n  }\n\n  @Override\n  public boolean\
    \ contains(Object o) {\n    return adaptee.contains(o);\n  }\n\n  @Override\n\
    \  public Iterator<E> iterator() {\n    return adaptee.iterator();\n  }\n\n  @Override\n\
    \  public <T> T[] toArray(T[] ts) {\n    return adaptee.toArray(ts);\n  }\n\n\
    \  @Override\n  public boolean add(E e) {\n    return adaptee.add(e);\n  }\n\n\
    \  @Override\n  public boolean remove(Object o) {\n    return adaptee.remove(o);\n\
    \  }\n\n  @Override\n  public boolean containsAll(Collection<?> c) {\n    return\
    \ adaptee.containsAll(c);\n  }\n\n  @Override\n  public boolean addAll(Collection<?\
    \ extends E> es) {\n    return adaptee.addAll(es);\n  }\n\n  @Override\n  public\
    \ boolean removeAll(Collection<?> c) {\n    return adaptee.removeAll(c);\n  }\n\
    \n  @Override\n  public boolean retainAll(Collection<?> c) {\n    return adaptee.retainAll(c);\n\
    \  }\n\n  @Override\n  public void clear() {\n    adaptee.clear();\n  }\n}\n```\n\
    \nListing 5.6: `BetterCollectionObjectAdapter`。\n\n我们的对象适配器可以工作，我们可以用它来适配任何集合。在这里，我们正在包装\
    \ `ConcurrentHashMap.newKeySet()`。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapterDemo.java\n\
    BetterCollection<String> names =\n    new BetterCollectionObjectAdapter<>(\n \
    \       ConcurrentHashMap.newKeySet(),\n        new String[0]\n    );\nnames.add(\"\
    Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
    Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
    for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
    System.out.println(names);\n```\n\nListing 5.7: `BetterCollectionObjectAdapterDemo`。\n\
    \n```\nMENONGAHELA\nLEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela, Leander,\
    \ Wolfgang, Klaus, Bobby Tables]--\n```\n\nListing 5.8: `BetterCollectionObjectAdapterDemo`\
    \ 的输出。\n\n它可以工作，但是……嗯……——如果我们现在想要一个更好的 `Set`、`List`、`SortedSet`、`ConcurrentMap`、`Map`\
    \ 甚至 `java.sql.Connection`，\n\n## 使用动态代理的动态适配器\n\n如之前，代理和适配对象的类结构是相似的。我们可以创建一个动态适配器吗？我们动态适配器的静态工厂方法接收以下内容：\n\
    \n- `Class<E> target` 是我们想要适配的接口类。例如，`BetterCollection`。\n- `Object adaptee` 是我们接口想要包装的对象。例如，`ArrayList<String>`。\n\
    - `Object adapter` 是应该使用的对象。\n\n我们的 `ObjectAdapterHandler` 为适配器、适配对象和默认方法创建 `VTables`，并将它们排列成链。\n\
    \n```java\n//:~ core/src/main/.../handlers/ObjectAdapterHandler.java\npublic final\
    \ class ObjectAdapterHandler\n    implements InvocationHandler {\n  private final\
    \ ChainedInvocationHandler chain;\n\n  public ObjectAdapterHandler(Class<?> target,\n\
    \                              Object adaptee,\n                             \
    \ Object adapter) {\n    VTable adapterVT = VTables.newVTable(adapter.getClass(),\
    \ target);\n    VTable adapteeVT =\n        VTables.newVTable(adaptee.getClass(),\
    \ target);\n    VTable defaultVT = VTables.newMethodVTable(target);\n\n    chain\
    \ = new VTableHandler(adapter, adapterVT,\n        new VTableHandler(adapteeVT,\n\
    \            new VTableDefaultMethodsHandler(defaultVT, null)));\n\n    chain.checkAllMethodsAreHandled(target);\n\
    \  }\n\n  @Override\n  public Object invoke(Object proxy, Method method,\n   \
    \                    Object[] args) throws Throwable {\n    return chain.invoke(proxy,\
    \ method, args);\n  }\n}\n```\n\nListing 5.9: `ObjectAdapterHandler`。\n\n我们在无处不在的\
    \ `Proxies` 类中添加另一个静态工厂方法，它将根据上面的 `InvocationHandler` 创建对象适配器。\n\n```java\n//:~\
    \ core/src/main/.../Proxies.java\npublic static <T> T adapt(Class<? super T> target,\n\
    \                          Object adaptee,\n                          Object adapter)\
    \ {\n  Objects.requireNonNull(adaptee, \"adaptee==null\");\n  Objects.requireNonNull(adapter,\
    \ \"adapter==null\");\n  return castProxy(target,\n      new ObjectAdapterHandler(target,\
    \ adaptee, adapter));\n}\n```\n\nListing 5.10: `Proxies.adapt()`。\n\n例如，为了创建一个\
    \ `BetterCollectionFactory`，我们可以制作适配器，它在 `toArray()` 方法中首先创建正确类型的数组。然后它修改 `add()`\
    \ 函数以验证对象的类型是否正确，类似于 `Collections.checkedCollection()` 的工作方式。\n\n"
- fmt: "\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionFactory.java\n\
    public class BetterCollectionFactory {\n  public static <E> BetterCollection<E>\
    \ asBetterCollection(\n      Collection<E> adaptee, E[] seedArray) {\n    return\
    \ Proxies.adapt(BetterCollection.class, adaptee,\n        new AdaptationObject<>(adaptee,\
    \ seedArray));\n  }\n\n  public static <E> BetterSortedSet<E> asBetterSet(\n \
    \     SortedSet<E> adaptee, E[] seedArray) {\n    return Proxies.adapt(BetterSortedSet.class,\
    \ adaptee,\n        new AdaptationObject<>(adaptee, seedArray));\n  }\n\n  //\
    \ this public inner class contains the methods that\n  // we want to adapt\n \
    \ public static class AdaptationObject<E> {\n    private final Collection<E> adaptee;\n\
    \    private final E[] seedArray;\n    public AdaptationObject(Collection<E> adaptee,\n\
    \                            E[] seedArray) {\n      this.adaptee = adaptee;\n\
    \      this.seedArray = seedArray;\n    }\n    public E[] toArray() {\n      return\
    \ adaptee.toArray(seedArray);\n    }\n    @Override\n    public String toString()\
    \ {\n      return \"--\" + adaptee + \"--\";\n    }\n    // Whilst we are at it,\
    \ we could also make it into\n    // a checked collection, see java.util.Collections\n\
    \    // for an example.\n    public boolean add(E e) {\n      var type = seedArray.getClass().getComponentType();\n\
    \      if (!type.isInstance(e))\n        throw new ClassCastException(\n     \
    \       \"Attempt to insert \" + e.getClass() +\n                \" value into\
    \ collection \" +\n                \"with type \" + type);\n      return adaptee.add(e);\n\
    \    }\n    // addAll() left as an exercise for the reader :-)\n  }\n}\n```\n\n\
