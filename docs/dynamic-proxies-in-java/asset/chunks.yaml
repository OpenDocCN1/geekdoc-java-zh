    \ 4.1 中的 `ImmutableIterable` 为例。在其中，我们去掉了 `iterator()` 方法，因为 `Iterator` 包含了 `remove()`\
    \ 方法。我们当然可以让 `iterator()` 方法返回一个 `ImmutableIterator`，但我将此留给读者作为练习。\n\n```java\n\
