    # 前言


    现在是 2000 年。我们的行业度过了千年虫危机。“智能手机”也能告诉时间。Java 是一门没有泛型、Lambda 表达式或类型推断的语言。部署我们的 EAR
    文件需要长时间。EAR 文件？是的，Spring 框架还有很长的路要走。程序员使用 RMI 和 CORBA。


    工具生成大量的底层代码。例如，远程方法调用 (RMI) 使用 [`rmic`](https://docs.oracle.com/en/java/javase/13/docs/specs/man/rmic.html)
    工具生成存根和骨架类以支持代理。（事实上，`rmic` 在现代发行版中仍然存在于 JDK/bin 目录中。）2000 年 5 月，Sun 发布了 Java
    1.3 —— 以及动态代理。不需要单独的构建步骤，通过指定要实现的接口即可动态创建新类。这些动态类的所有方法调用都路由到单个 `InvocationHandler`。底层代码使用动态代理在内存中创建存根和骨架类。


    ## 大收益


    动态代理使代码更容易维护。与其手工编写大量类，我们编写一个动态代理。这是“不要重复”原则的加强版。


    例如，一家公司用一个动态代理替换了 60 万条生成的代码语句。他们编写了一个神奇工具将他们的专有语言转换为 Java。他们的业务系统有数百个实体。他们的工具将每个实体转换为几个
    Java 类。然而，在初始生成之后，程序员必须手动维护这些代码。维护工作既枯燥又容易出错。一个动态代理取代了这一切。


    '
- fmt: '

    Build tools like `Gradle` use proxies for models, tasks, actions, and listeners.
    Examples include `BuildOperationListener`, `StandardOutputListener`, and `ProgressListener`.
    Maven uses them for plugin management through the `MavenPluginManager` and `CircularDependencyProxy`.


    Application containers like `JBoss` and `Spring Framework` use proxies for dependency
    injection. Some examples are `@Inject`, `@Qualifier`, `@Autowired`, and `@Bean`.
    Scoping and lifecycle management also use dynamic proxies.


    Persistence management with `JPA` within these containers uses proxies — for example,
    `@Entity`, `@Id`, `@GeneratedValue`, `@Table`, and `@JoinColumn`. In Spring, we
    can derive a custom repository by extending the `Repository` interface. In the
    background, a multi-interface dynamic decorating proxy takes care of the details.


    If we choose `Hibernate` for ORM, then proxies surround `HibernateEntityManagerFactory`,
    `HibernateEntityManager`, and `EntityManagerProxy`. Spring’s `ConnectionProxy`
    is a dynamic proxy of `java.sql.Connection`.


    Again in Spring, a dynamic proxy for `InitBinder` binds HTTP form fields with
    a data model. Dynamic proxies are used under the hood by many of the frameworks
    we use every day: `Spring Framework`, `WildFly`, `NetBeans Platform`, `Apache
    Tomcat`, and `OpenJDK`, among many others.


    ## But wait…


    Dynamic proxies are not always the best tool to use. Although highly convenient,
    method calls on a dynamic proxy suffer a small increase in performance overhead
    compared to direct method calls. In this book, we will learn how to minimize the
    performance impact of using dynamic proxies.


    ## What will we learn?


    There are occasions when dynamic proxies are the perfect fit for a particular
    problem. By studying them in depth and seeing them in a variety of scenarios,
    we will learn to spot places where it makes sense to use them. We will learn to
    recognize their strengths and weaknesses.


    This makes the debugging of systems that use dynamic proxies easier.


    ## TL;DR?


    Even a mini-book like this can take days to read and fully understand. To make
    this material more accessible, I have created a [self-study course](https://javaspecialists.teachable.com/p/dynamic-proxies-in-java)
    with detailed explanations of each building block. The course has exercises for
    each chapter, together with model solutions.


    ## Java version


    We compiled the code for this book with Java 11 LTS. Where it makes code clearer,
    we use the Java 10 `var` keyword for local variables.


    While we do use shallow reflection in this book, we try to avoid using deep reflection.
    Mark Reinhold defined these terms on the OpenJDK [JPMS (JSR 376) Expert Group
    mailing list](http://mail.openjdk.java.net/pipermail/jpms-spec-experts/2016-October/000431.html).


    *   Shallow reflective access is access at runtime via the Core Reflection API
    (`java.lang.reflect`) without using `setAccessible`. Only public elements in exported
    packages can be accessed.

    *   Deep reflective access is access at run time via the Core Reflection API,
    using the `setAccessible` method to break into non-public elements. Any element,
    whether public or not, in any package, whether exported or not, can be accessed.
    Deep reflective access implies shallow reflective access.


    ## Enjoy!


    I hope that you will enjoy this book and that you find it both useful and intellectually
    stimulating. Perhaps even entertaining at times.


    Try out the concepts in the book; best with a cup of hot java at your side. Play
    around with the concepts in your IDE. All the code samples from the book are available
    at [https://github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples).


    Dr. Heinz M. Kabutz


    # Design-Patterns Cousins


    An architect is a person who plans, designs, and reviews the construction of buildings.
    Their finished product is hard to change as it is, literally, poured in concrete.
    Software changes all the time, even many years after installation, so it is surprising
    just how much architect Christopher Alexander’s 1977 book [*A Pattern Language:
    Towns, Buildings, Construction*](https://www.goodreads.com/en/book/show/79766.A_Pattern_Language)
    has influenced the software industry. Alexander’s book is about the timeless way
    of building. He distils habitat patterns that have repeatedly occurred throughout
    history — for example, pattern number 159, called “Light on Two Sides of Every
    Room”. We can easily visualize the pattern because of its descriptive name.


    In the 1990s, the software industry took the principles that Alexander proposed
    and applied them to software design. The concept of object-oriented design patterns
    was immortalized in [*Design Patterns: Elements of Reusable Object-Oriented Software*](https://www.oreilly.com/library/view/design-patterns-elements/0201633612/)
    by Erich Gamma, Richard Helm, Ralph Johnson, and John Vlissides. These four authors
    are commonly referred to as the Gang of Four or simply the GoF.


    One of the most important identifiers of a pattern is its name. In *Timeless Way
    of Building*, Alexander wrote “The search for a name is a fundamental part of
    the process of inventing or discovering a pattern. So long as a pattern has a
    weak name, it means that it is not a clear concept, and you cannot tell me to
    make ‘one’.”


    Design patterns similarly apply names to common coding techniques, making it easier
    to communicate intentions. Knowing the patterns helps us to understand existing
    designs more quickly. Unfortunately, the GoF pattern names are not as colorful
    as Alexander’s. A name like “wrapper” could mean anything. We thus also rely on
    the *intent* to clearly identify each pattern.


    In this book, we will focus primarily on four patterns: `proxy`, `adapter`, `decorator`,
    and `composite`. They are all structural patterns, which means they don’t describe
    behavior or the creation of objects, but rather how classes and objects interrelate.


    Our four patterns have a similar class hierarchy, so with a bit of effort we can
    use dynamic proxies to implement each of them. They are so similar in appearance
    that we can call them “design-pattern cousins”.


    ## Proxy pattern


    Intent: “Provide a surrogate or placeholder for another object to control access
    to it.” (GoF 1994, p. 207)


    In the proxy pattern, the client communicates via a substitute (the proxy), which
    acts a bit like a ventriloquist’s doll (such as Conky in *Trailer Boys*).


    ![ProxyViloquist](images/ch01/ProxyViloquist.jpg)


    The standard GoF structure is shown below in Figure 1\. The `Client` uses the
    `Subject`, which can either be a `RealSubject` or a `Proxy`. The `Client` does
    not know which, nor care. In the standard GoF structure, the `Proxy` points to
    a `RealSubject`. A variation of the proxy structure is to let the `Proxy` point
    to a `Subject`. This allows us to cascade proxies. We will examine cascading proxies
    in more detail at the end of the next chapter.


    ![ProxyStructure](images/ch01/ProxyStructure.png)


    Figure 1\. Structure of the proxy design pattern.


    Proxy has several use cases:


    *   **Virtual proxy** creates expensive objects on demand. An example is the `LazyConnectionDataSourceProxy`
    in the Spring Framework, which lazily creates the real JDBC `DataSource` when
    the first `Statement` is created.

    *   **Remote proxy** provides a local representation of an object that sits in
    a different address space, for example on a remote machine. Note that the remote
    proxy does not have a real pointer to the remote object, but invokes the methods
    via RPC, RMI, Thrift, ProtoBuf, gRPC, REST, HTTP, TCP/UDP, or a different remoting
    mechanism.

    *   **Protection proxy** controls access to the original object. This could be
    for access control or thread safety. An example is `Collections.synchronizedCollection()`,
    which returns a new `Collection` that is guarded against race conditions.


    ## Adapter pattern

