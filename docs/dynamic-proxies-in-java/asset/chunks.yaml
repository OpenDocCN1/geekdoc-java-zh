    ```\n\nListing 5.16: `AdapterBenchmark`.\n\nThese results come from running our\
    \ `AdapterBenchmark` on a MacBook Pro (2018) i9 with six cores with Java 14+36-1461\\\
    . Times are in nanoseconds per operation (ns/op) and memory allocated is bytes\
    \ per operation (B/op), with escape analysis on and off, using the `-XX:+/-DoEscapeAnalysis`\
    \ JVM parameter. The `ParameterTypesFetcher` and the `MethodTurboBooster` are\
    \ both enabled.\n\n### Performance of size()\n\nThe `size()` method is defined\
    \ inside the adaptee, thus we need to make two `VTable` lookups, first on the\
    \ adapter and then on the adaptee. The overhead is approximately 11 nanoseconds.\
    \ Since the `size()` method is not overloaded in the `BetterCollection` interface,\
    \ we do not need to match the parameter types.\n\nNone of the tests allocate memory\
    \ with the current data set. However, if the set increased in size beyond 127,\
    \ then the dynamic object adapter would need to allocate an `Integer` object for\
    \ the return value.\n\n| Benchmark | ns/op ± Error | B/op EA on / off |\n\n| ---\
    \ | --- | --- |\n\n| plainSize() | 3.517 ± 0.076 | 0 / 0 |\n\n| classAdapterSize()\
    \ | 3.473 ± 0.040 | 0 / 0 |\n\n| objectAdapterSize() | 3.489 ± 0.042 | 0 / 0 |\n\
    \n| dynamicObjectAdapterSize() | 14.378 ± 0.153 | 0 / 0 |\n\n### Performance of\
    \ toArray()\n\nWe see in the table below that there is only a 6 nanosecond difference\
    \ between the static and dynamic object adapters, which is the cost of one `VTable`\
    \ lookup. The reason why we only need a single lookup is that the `toArray()`\
    \ method is defined inside the adapter class, which happens to be the first handler\
    \ in the chain. However, the `toArray()` method is overloaded, which means we\
    \ also need to compare the parameter types.\n\nAll tests allocate the same amount\
    \ of memory, consisting of an iterator (32 bytes) and an array for the result\
    \ (also 32 bytes). The `toArray()` method calls `iterator()` on the `ConcurrentSkipListSet`.\
    \ Unfortunately, escape analysis in this case cannot determine that the iterator\
    \ object cannot escape, thus it has to be created on the Java heap. For more information\
    \ about escape analysis, see [Scalar Replacement](https://shipilev.net/jvm/anatomy-quarks/18-scalar-replacement)\
    \ by Shipilev.\n\n| Benchmark | ns/op ± Error | B/op EA on / off |\n\n| --- |\
    \ --- | --- |\n\n| plainToArray() | 18.345 ± 0.096 | 64 / 64 |\n\n| classAdapterToArray()\
    \ | 22.385 ± 0.104 | 64 / 64 |\n\n| objectAdapterToArray() | 22.152 ± 0.177 |\
    \ 64 / 64 |\n\n| dynamicObjectAdapterToArray() | 28.461 ± 0.209 | 64 / 64 |\n\n\
    ### Performance of forEachFiltered()\n\nThe default interface method `forEachFiltered()`\
    \ defined inside `BetterCollection` has the highest overhead, coming to about\
    \ 26 nanoseconds. This requires 5 `VTable` lookups. We first lookup in the adapter\
    \ and the adaptee and when we do not find the method there, we find it as a default\
    \ interface method defined on our target interface. However, internally, the `forEachFiltered()`\
    \ method calls `iterator()` during the for-in loop, which requires another two\
    \ lookups on adapter and adaptee.\n\nAll of the tests create an iterator (32 bytes).\
    \ However, since the iterator object is contained within the method, the heap\
    \ allocation can usually be optimized away, except with the dynamic object adapter.\
    \ Our dynamic proxy invocations have deeper call stacks, as we discussed in chapter\
    \ 3\\. The computational time complexity of determining whether an object cannot\
    \ escape is quite high, and thus escape analysis limits how deeply it analyzes\
    \ the stack. In our case, escape analysis gives up and thus the iterator object\
    \ always has to be allocated on the heap, with the associated garbage collection\
    \ cost.\n\nA further 24 bytes are wasted due to the `Object[]` for the parameters\
    \ of the method.\n\nThe allocation rate for the `dynamicObjectAdapterForEach()`\
    \ benchmark was approximately 720 MB/s. This is a bit high, but nowhere close\
    \ to the maximum of the machine I ran the tests on. For comparison, on my machine\
    \ I can allocate 2.9 GB/s of iterators and 4.2 GB/s of object arrays. The bottleneck\
    \ is in the `VTable` lookups and not in the object allocation.\n\n| Benchmark\
    \ | ns/op ± Error | B/op EA on / off |\n\n| --- | --- | --- |\n\n| plainForEach()\
    \ | 15.422 ± 0.062 | 0 / 32 |\n\n| classAdapterForEach() | 15.531 ± 0.043 | 0\
    \ / 32 |\n\n| objectAdapterForEach() | 16.768 ± 0.047 | 0 / 32 |\n\n| dynamicObjectAdapterForEach()\
    \ | 42.431 ± 0.262 | 56 / 56 |\n\n### Conclusion of performance analysis\n\nThe\
    \ overhead of calling methods on the dynamic object adapter is dependent on how\
    \ many `VTable` lookups we have to make."
