  trans: "\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\npublic void handleWithoutChain(\n\
    \    String key, Consumer<String> processor) {\n  var item = map1.get(key);\n\
    \  if (item != null) processor.accept(item);\n  else {\n    item = map2.get(key);\n\
    \    if (item != null) processor.accept(item);\n    else {\n      item = map3.get(key);\
    \ // 循环\n    }\n  }\n}\n```\n\nListing 1.3: 嵌套的 if-else-if 结构。\n\n我们没有使用多条件 if-else\
    \ 语句，而是创建了一个抽象的 `Handler` 类。`handle()` 的默认实现是将调用沿着链向下传递给下一个处理程序。\n\n```java\n\
    //:~ core/src/main/.../ch01/Handler.java\npublic abstract class Handler {\n  private\
    \ final Handler next;\n  public Handler(Handler next) {\n    this.next = next;\n\
    \  }\n  public void handle(String key, Consumer<String> processor) {\n    if (next\
    \ != null) next.handle(key, processor);\n  }\n}\n```\n\nListing 1.4: 责任链处理程序。\n\
    \n我们的 `MapHandler` 包含了具体的实现：如果在我们的 map 中找到了该项，则调用 `process(item)`；否则，调用 `super.handle(key)`。\n\
    \n```java\n//:~ core/src/main/.../ch01/MapHandler.java\npublic class MapHandler\
    \ extends Handler {\n  private final Map<String, String> map;\n  public MapHandler(Map<String,\
    \ String> map, Handler next) {\n    super(next);\n    this.map = map;\n  }\n \
    \ @Override\n  public void handle(String key, Consumer<String> processor) {\n\
    \    String item = map.get(key);\n    if (item != null) processor.accept(item);\n\
    \    else super.handle(key, processor);\n  }\n}\n```\n\nListing 1.5: Map 的具体处理程序。\n\
    \n在我们的类内部，我们将按照 Listing 1.6 所示的方式设置链。\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\n\
    private final Handler chain =\n    new MapHandler(map1,\n        new MapHandler(map2,\n\
    \            new MapHandler(map3, null)));\n```\n\nListing 1.6: 作为字段的处理程序链。\n\n\
    与 Listing 1.3 中复杂的 if-else-if 结构相比，我们可以这样写：\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\n\
    private void handleWithChain(\n    String key, Consumer<String> processor) {\n\
    \  chain.handle(key, processor);\n}\n```\n\nListing 1.7: 使用责任链处理程序。\n\n该模式使得复杂的\
    \ if-else-if 方法变得易于理解。该模式的一个已知缺点是，如果没有找到合适的处理程序，请求可能会在链的末端丢失。在第 4 章中，我们将学习这种模式如何帮助我们处理方法调用。我们还将看到如何防止请求从链的末端掉。\n\
    \n# 手工代理\n\n由于我们的书名中包含“代理（proxies）”，我们应该更详细地检查代理设计模式。代理有多种形式和类型。例如，我们提到过用于延迟初始化的**虚拟代理**、用于访问远程地址空间对象的**远程代理**以及用于添加安全层的**保护代理**。\n\
    \n提醒一下，GoF 书中的代理设计模式结构如图 7 所示。\n\n![ProxyStructure](img/ProxyStructure.png)\n\n\
    图 7. 代理结构。\n\n## 使用虚拟代理进行延迟初始化\n\n在某些情况下，我们可能希望在绝对需要时才延迟创建对象。推迟甚至可以完全节省对象创建的成本。此类高成本创建对象示例包括线程、数据库连接、大型数组和文件。\n\
    \n例如，一个新的 `HashMap` 占用 48 字节，不包括其条目数组。该数组传统上从长度 16 开始，并在占用率超过 75% 时增长。一个包含 16\
    \ 个对象的数组又占用 80 字节。这意味着，在包含任何元素之前，一个新的 `HashMap` 的组合成本就达到了 128 字节。\n\n### CustomMap\n\
    \n`CustomMap` 接口包含了 `java.util.Map` 定义的方法子集。在代理设计模式结构中，`CustomMap` 是 `Subject`\
    \ 接口的一个示例。\n\n```java\n//:~ core/src/main/.../ch02/virtual/CustomMap.java\npublic\
    \ interface CustomMap<K, V> {\n  int size();\n  V get(Object key);\n  V put(K\
    \ key, V value);\n  V remove(Object key);\n  void clear();\n  void forEach(BiConsumer<?\
    \ super K, ? super V> action);\n  // 等等\n}\n```\n\nListing 2.1: `CustomMap` 接口。\n\
    \n我们 `CustomMap` 的类结构如图 8 所示。\n\n![CustomMapStructure](img/CustomMapStructure.png)\n\
    \n图 8. `CustomMap` 结构。\n\n### CustomHashMap\n\n`CustomHashMap` 实现了 `CustomMap`。由于我们不想重造轮子，我们将所有方法委托给\
    \ `java.util.HashMap`。在代理设计模式结构中，`CustomHashMap` 是 `RealSubject` 类的一个示例。\n\n```java\n\
    //:~ core/src/main/.../ch02/virtual/CustomHashMap.java\npublic class CustomHashMap<K,\
    \ V> implements CustomMap<K, V> {\n  private final Map<K, V> map;\n  public CustomHashMap()\
    \ {\n    this.map = new HashMap<>();\n  }\n  @Override\n  public int size() {\n\
    \    return map.size();\n  }\n  @Override\n  public V get(Object key) {\n    return\
    \ map.get(key);\n  }\n  @Override\n  public V put(K key, V value) {\n    return\
    \ map.put(key, value);\n  }\n  @Override\n  public V remove(Object key) {\n  \
    \  return map.remove(key);\n  }\n  @Override\n  public void clear() {\n    map.clear();\n\
    \  }\n  @Override\n  public void forEach(BiConsumer<? super K, ? super V> action)\
    \ {\n    map.forEach(action);\n  }\n  @Override\n  public String toString() {\n\
    \    return map.toString();\n  }\n}\n```\n\nListing 2.2: `CustomHashMap` 类。\n\n\
    ### VirtualMap\n\n最后，我们创建了虚拟代理 `VirtualMap`。\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualMap.java\n\
    public class VirtualMap<K, V> implements CustomMap<K, V> {\n  private final Supplier<CustomMap<K,\
    \ V>> supplier;\n  private CustomMap<K, V> realMap;\n\n  public VirtualMap(Supplier<CustomMap<K,\
    \ V>> supplier) {\n    this.supplier = supplier;\n  }\n\n  private CustomMap<K,\
    \ V> getRealMap() {\n    if (realMap == null) {\n      realMap = supplier.get();\n\
    \    }\n    return realMap;\n  }\n\n  @Override\n  public int size() {\n    return\
    \ getRealMap().size();\n  }\n  @Override\n  public V get(Object key) {\n    return\
    \ getRealMap().get(key);\n  }\n  @Override\n  public V put(K key, V value) {\n\
    \    return getRealMap().put(key, value);\n  }\n  @Override\n  public V remove(Object\
    \ key) {\n    return getRealMap().remove(key);\n  }\n  @Override\n  public void\
    \ clear() {\n    getRealMap().clear();\n  }\n  @Override\n  public void forEach(BiConsumer<?\
    \ super K, ? super V> action) {\n    getRealMap().forEach(action);\n  }\n  @Override\n\
    \  public String toString() {\n    return getRealMap().toString();\n  }\n}\n```\n\
    \nListing 2.3: `VirtualMap` 代理类。\n\n让我们看看如何使用它。我们的局部变量 `map` 指向一个 `VirtualMap`\
    \ 实例。在第一次调用诸如 `put()` 或 `get()` 方法之前，真正的 `HashMap` 不会被创建。当我们这样做时，供应器会被调用，`HashMap`\
    \ 被创建。之后，所有的调用都路由到包含的 `HashMap` 中。\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualProxyDemo.java\n\
    publicMapDemo {\n  public static void main(String[] args) {\n    CustomMap<String,\
    \ Integer> map =\n        new VirtualMap<>(CustomHashMap::new);\n    System.out.println(\"\
    Virtual Map created\");\n    map.put(\"one\", 1);\n    map.put(\"life\", 42);\n\
    \    System.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"life\"));\n \
    \   System.out.println(\"map.size() = \" + map.size());\n    System.out.println(\"\
    clearing map\");\n    map.clear();\n    System.out.println(\"map.size() = \" +\
    \ map.size());\n  }\n}\n```\n\nListing 2.4: `VirtualProxyDemo`。\n\n"
- fmt: "\n# Calling remote methods with remote proxy\n\nEmbassies are local representations\
    \ of remote countries. We visit them when we need to apply for a visa, to renew\
    \ our passport, or to interact with the remote entity (the country’s government)\
    \ without getting on a plane. Embassies are a bit like remote proxies.\n\nLet’s\
    \ say we wish to apply for a visa to visit Canada.\n\n```\n//:~ core/src/main/.../ch02/remote/Canada.java\n\
    public interface Canada {\n  boolean canGetVisa(String name,\n               \
    \      boolean married,\n                     boolean rich);\n}\n```\n\nListing\
    \ 2.6: `Canada`.\n\nOur implementation class is defined inside `RealCanada`, which\
    \ checks the most important attributes. The class name looks like that of a beer:\
    \ *“Real Canada - goes down so smooth. Ahhh. Quenches the deepest thirst…​.”*\n\
    \n```\n//:~ core/src/main/.../ch02/remote/RealCanada.java\npublic class RealCanada\
    \ implements Canada {\n  @Override\n  public boolean canGetVisa(String name,\n\
    \                            boolean married,\n                            boolean\
    \ rich) {\n    return married && rich || !married && rich || rich;\n    // every\
    \ country loves rich tourists ... :-)\n  }\n}\n```\n\nListing 2.7: `RealCanada`.\n\
    \nWe will publish this with the [Jetty web server](https://github.com/eclipse/jetty.project).\n\
    \n```\n//:~ core/src/main/.../ch02/remote/ServicePublisher.java\n/**\n * @author\
    \ Simone Bordet\n */\npublic class ServicePublisher extends AbstractHandler {\n\
    \  private static final Pattern PATTERN =\n      Pattern.compile(\"/canGetVisa/\"\
    \ +\n                          \"(?<name>[^/]+)/\" +\n                       \
    \   \"(?<married>[^/]+)/\" +\n                          \"(?<rich>[^/]+)\");\n\
    \  private final Canada canada;\n\n  public ServicePublisher(Canada canada) {\n\
    \    this.canada = canada;\n  }\n\n  @Override\n  public void handle(String target,\
    \ Request jettyRequest,\n                     HttpServletRequest request,\n  \
    \                   HttpServletResponse response)\n      throws IOException {\n\
    \    jettyRequest.setHandled(true);\n    var matcher = PATTERN.matcher(request.getRequestURI());\n\
    \    if (matcher.matches()) {\n      var name = matcher.group(\"name\");\n   \
    \   var married = Boolean.valueOf(matcher.group(\"married\"));\n      var rich\
    \ = Boolean.valueOf(matcher.group(\"rich\"));\n      var canGetVisa = canada.canGetVisa(name,\
    \ married, rich);\n      response.getOutputStream().print(canGetVisa);\n    }\
    \ else {\n      response.setStatus(HttpServletResponse.SC_NOT_FOUND);\n    }\n\
    \  }\n  public static void main(String... args) throws Exception {\n    Canada\
    \ canada = new RealCanada();\n    var server = new Server(8080);\n    server.setHandler(new\
    \ ServicePublisher(canada));\n    server.start();\n  }\n}\n```\n\nListing 2.8:\
    \ Remote proxy publisher.\n\nThat’s it for the server side. When we run the `ServicePublisher`,\
    \ it creates a REST service that we can connect to.\n\nNext, we create a remote\
    \ proxy that connects to the REST service and calls the method.\n\n```\n//:~ core/src/main/.../ch02/remote/CanadianEmbassy.java\n\
    public class CanadianEmbassy implements Canada {\n  private final HttpClient httpClient\
    \ =\n      HttpClient.newBuilder().build();\n  @Override\n  public boolean canGetVisa(String\
    \ name,\n                            boolean married,\n                      \
    \      boolean rich) {\n    try {\n      var encodedName = URLEncoder.encode(name,\n\
    \          StandardCharsets.UTF_8);\n      var url = \"http://0.0.0.0:8080/canGetVisa/\"\
    \ +\n                    encodedName + \"/\" +\n                    married +\
    \ \"/\" + rich;\n      var req = HttpRequest.newBuilder()\n                  \
    \  .uri(URI.create(url))\n                    .build();\n      var res = httpClient.send(\n\
    \          req, HttpResponse.BodyHandlers.ofString());\n      return res.statusCode()\
    \ == HttpURLConnection.HTTP_OK &&\n                 Boolean.parseBoolean(res.body());\n\
    \    } catch (IOException e) {\n      throw new UncheckedIOException(e);\n   \
    \ } catch (InterruptedException e) {\n      Thread.currentThread().interrupt();\n\
    \      throw new CancellationException(\"interrupted\");\n    }\n  }\n}\n```\n\
    \nListing 2.9: Our `CanadianEmbassy`.\n\nThe `Client` looks like plain ol’ Java,\
    \ unaware of the remote implementation.\n\n```\n//:~ core/src/main/.../ch02/remote/Client.java\n\
    public class Client {\n  public static void main(String... args) {\n    Canada\
    \ canada = new CanadianEmbassy();\n    boolean visaObtained = canada.canGetVisa(\n\
    \        \"Heinz Kabutz\", true, false);\n    System.out.println(\"visaObtained\
    \ = \" + visaObtained);\n    System.out.println(\"Wins lottery ...\");\n    visaObtained\
    \ = canada.canGetVisa(\n        \"Heinz Kabutz\", true, true);\n    System.out.println(\"\
    visaObtained = \" + visaObtained);\n  }\n}\n```\n\nListing 2.10: Client.\n\nWe\
    \ run this example by first starting the `ServicePublisher` class and then running\
    \ our `Client`.\n\n```\nvisaObtained = false\nWins lottery ...\nvisaObtained =\
    \ true\n```\n\nListing 2.11: Did we get the visa?\n\n# Security with the protection\
    \ proxy\n\nSecurity is either extremely boring, when it works, or super exciting\
    \ (in a bad way), when it doesn’t. Want to make sure you’ll get a seat at a conference\
    \ talk? Look for the one about Java security. It will be you and the speaker.\n\
    \nThe protection proxy can guard our object for many reasons:\n\n*   We want to\
    \ protect our object from race conditions.\n*   We want to protect our state from\
    \ modification.\n*   We want to ensure the caller has the correct credentials.\n\
    \nWe will look at examples for the first two scenarios. The third is essential\
    \ for protecting our digital assets, but unless we do it extremely well, some\
    \ clever hacker will break in and empty our wallets. We will sneakily ignore access\
    \ control in our examples.\n\n### `SynchronizedCustomMap`\n\nOur `CustomHashMap`\
    \ in Listing 2.2 is not thread-safe. It relies on `java.util.HashMap`, which does\
    \ not guard the state against concurrent access. To illustrate, consider Listing\
    \ 2.12. We try to put 46,000 entries into the map using a parallel stream. We\
    \ then iterate through the map with `forEach()` and count how many entries we\
    \ find. Lastly, we print out the value.\n\n```java\n//:~ core/src/test/.../ch02/protection/ConcurrentTest.java\n\
    public class ConcurrentTest {\n  public static final int SQUARES = 46_000;\n \
    \ public void check(CustomMap<Integer, Integer> map) {\n    System.out.println(\"\
    Checking \" + map.getClass().getSimpleName());\n    try {\n      IntStream.range(0,\
    \ SQUARES)\n          .parallel()\n          .forEach(i -> map.put(i, i * i));\n\
    \    } catch (Exception e) {\n      System.err.println(e);\n    }\n    // count\
    \ actual entries\n    var entries = new LongAdder();\n    map.forEach((k, v) ->\
    \ entries.increment());\n\n    System.out.println(\"entries = \" + entries);\n\
    \    System.out.println(\"map.size() = \" + map.size());\n\n    assertTrue(\"\
    entries=\" + entries + \", \" +\n               \"map.size=\" + map.size(),\n\
    \        entries.intValue() == map.size());\n  }\n}\n```\n\nListing 2.12: `ConcurrentTest`\
    \ modifies map concurrently using parallel streams.\n\nOur `CustomHashMapTest`\
    \ supplies the `CustomHashMap` to `ConcurrentTest`.\n\n```java\n//:~ core/src/test/.../ch02/protection/CustomHashMapTest.java\n\
    public class CustomHashMapTest extends ConcurrentTest {\n  @Test\n  public void\
    \ testCustomHashMap() {\n    try {\n      check(new CustomHashMap<>());  // won't\
    \ work\n    } catch (AssertionError error) {\n      System.err.println(error);\n\
    \    }\n  }\n}\n```\n\nListing 2.13: `CustomHashMapTest`.\n\nOver several runs\
    \ of this code on a MacBook Pro (2018) i9 with 6 cores, the counted `entries`\
    \ never equaled `map.size()`. Nor did the count equal 46,000. For example, Listing\
    \ 2.14 is the output of one run.\n\n```\nCustomHashMap constructed\nChecking CustomHashMap\n\
    entries = 35474\nmap.size() = 41663\njava.lang.AssertionError: entries=35474,\
    \ map.size=41663\n```\n\nListing 2.14: Output from `CustomHashMapTest`.\n"
  raw: "## Calling remote methods with remote proxy\n\nEmbassies are local representations\
    \ of remote countries. We visit them when we need to apply for a visa, to renew\
    \ our passport, or to interact with the remote entity (the country’s government)\
    \ without getting on a plane. Embassies are a bit like remote proxies.\n\nLet’s\
    \ say we wish to apply for a visa to visit Canada.\n\n```\n//:~ core/src/main/.../ch02/remote/Canada.java\n\
    public interface Canada {\n  boolean canGetVisa(String name,\n               \
    \      boolean married,\n                     boolean rich);\n}\n```\n\nListing\
    \ 2.6: `Canada`.\n\nOur implementation class is defined inside `RealCanada`, which\
    \ checks the most important attributes. The class name looks like that of a beer:\
    \ *“Real Canada - goes down so smooth. Ahhh. Quenches the deepest thirst…​.”*\n\
    \n```\n//:~ core/src/main/.../ch02/remote/RealCanada.java\npublic class RealCanada\
    \ implements Canada {\n  @Override\n  public boolean canGetVisa(String name,\n\
    \                            boolean married,\n                            boolean\
    \ rich) {\n    return married && rich || !married && rich || rich;\n    // every\
    \ country loves rich tourists ... :-)\n  }\n}\n```\n\nListing 2.7: `RealCanada`.\n\
    \nWe will publish this with the [Jetty web server](https://github.com/eclipse/jetty.project).\n\
    \n```\n//:~ core/src/main/.../ch02/remote/ServicePublisher.java\n/**\n * @author\
    \ Simone Bordet\n */\npublic class ServicePublisher extends AbstractHandler {\n\
    \  private static final Pattern PATTERN =\n      Pattern.compile(\"/canGetVisa/\"\
    \ +\n                          \"(?<name>[^/]+)/\" +\n                       \
    \   \"(?<married>[^/]+)/\" +\n                          \"(?<rich>[^/]+)\");\n\
    \  private final Canada canada;\n\n  public ServicePublisher(Canada canada) {\n\
    \    this.canada = canada;\n  }\n\n  @Override\n  public void handle(String target,\
    \ Request jettyRequest,\n                     HttpServletRequest request,\n  \
    \                   HttpServletResponse response)\n      throws IOException {\n\
    \    jettyRequest.setHandled(true);\n    var matcher = PATTERN.matcher(request.getRequestURI());\n\
    \    if (matcher.matches()) {\n      var name = matcher.group(\"name\");\n   \
    \   var married = Boolean.valueOf(matcher.group(\"married\"));\n      var rich\
    \ = Boolean.valueOf(matcher.group(\"rich\"));\n      var canGetVisa = canada.canGetVisa(name,\
    \ married, rich);\n      response.getOutputStream().print(canGetVisa);\n    }\
    \ else {\n      response.setStatus(HttpServletResponse.SC_NOT_FOUND);\n    }\n\
    \  }\n  public static void main(String... args) throws Exception {\n    Canada\
    \ canada = new RealCanada();\n    var server = new Server(8080);\n    server.setHandler(new\
    \ ServicePublisher(canada));\n    server.start();\n  }\n}\n```\n\nListing 2.8:\
    \ Remote proxy publisher.\n\nThat’s it for the server side. When we run the `ServicePublisher`,\
    \ it creates a REST service that we can connect to.\n\nNext, we create a remote\
    \ proxy that connects to the REST service and calls the method.\n\n```\n//:~ core/src/main/.../ch02/remote/CanadianEmbassy.java\n\
    public class CanadianEmbassy implements Canada {\n  private final HttpClient httpClient\
    \ =\n      HttpClient.newBuilder().build();\n  @Override\n  public boolean canGetVisa(String\
    \ name,\n                            boolean married,\n                      \
    \      boolean rich) {\n    try {\n      var encodedName = URLEncoder.encode(name,\n\
    \          StandardCharsets.UTF_8);\n      var url = \"http://0.0.0.0:8080/canGetVisa/\"\
    \ +\n                    encodedName + \"/\" +\n                    married +\
    \ \"/\" + rich;\n      var req = HttpRequest.newBuilder()\n                  \
    \  .uri(URI.create(url))\n                    .build();\n      var res = httpClient.send(\n\
    \          req, HttpResponse.BodyHandlers.ofString());\n      return res.statusCode()\
    \ == HttpURLConnection.HTTP_OK &&\n                 Boolean.parseBoolean(res.body());\n\
    \    } catch (IOException e) {\n      throw new UncheckedIOException(e);\n   \
    \ } catch (InterruptedException e) {\n      Thread.currentThread().interrupt();\n\
    \      throw new CancellationException(\"interrupted\");\n    }\n  }\n}\n```\n\
    \nListing 2.9: Our `CanadianEmbassy`.\n\nThe `Client` looks like plain ol’ Java,\
    \ unaware of the remote implementation.\n\n```\n//:~ core/src/main/.../ch02/remote/Client.java\n\
    public class Client {\n  public static void main(String... args) {\n    Canada\
    \ canada = new CanadianEmbassy();\n    boolean visaObtained = canada.canGetVisa(\n\
    \        \"Heinz Kabutz\", true, false);\n    System.out.println(\"visaObtained\
    \ = \" + visaObtained);\n    System.out.println(\"Wins lottery ...\");\n    visaObtained\
    \ = canada.canGetVisa(\n        \"Heinz Kabutz\", true, true);\n    System.out.println(\"\
    visaObtained = \" + visaObtained);\n  }\n}\n```\n\nListing 2.10: Client.\n\nWe\
    \ run this example by first starting the `ServicePublisher` class and then running\
    \ our `Client`.\n\n```\nvisaObtained = false\nWins lottery ...\nvisaObtained =\
    \ true\n```\n\nListing 2.11: Did we get the visa?\n\n## Security with the protection\
    \ proxy\n\nSecurity is either extremely boring, when it works, or super exciting\
    \ (in a bad way), when it doesn’t. Want to make sure you’ll get a seat at a conference\
    \ talk? Look for the one about Java security. It will be you and the speaker.\n\
    \nThe protection proxy can guard our object for many reasons:\n\n*   We want to\
    \ protect our object from race conditions.\n\n*   We want to protect our state\
    \ from modification.\n\n*   We want to ensure the caller has the correct credentials.\n\
    \nWe will look at examples for the first two scenarios. The third is essential\
    \ for protecting our digital assets, but unless we do it extremely well, some\
    \ clever hacker will break in and empty our wallets. We will sneakily ignore access\
    \ control in our examples.\n\n### `SynchronizedCustomMap`\n\nOur `CustomHashMap`\
    \ in Listing 2.2 is not thread-safe. It relies on `java.util.HashMap`, which does\
    \ not guard the state against concurrent access. To illustrate, consider Listing\
    \ 2.12\\. We try to put 46,000 entries into the map using a parallel stream. We\
    \ then iterate through the map with `forEach()` and count how many entries we\
    \ find. Lastly, we print out the value of `size()`. If the map were thread-safe,\
    \ the values of `size()` and `entries` would both be equal to 46,000.\n\n```\n\
    //:~ core/src/test/.../ch02/protection/ConcurrentTest.java\npublic class ConcurrentTest\
    \ {\n  public static final int SQUARES = 46_000;\n  public void check(CustomMap<Integer,\
    \ Integer> map) {\n    System.out.println(\n        \"Checking \" + map.getClass().getSimpleName());\n\
    \    try {\n      IntStream.range(0, SQUARES)\n          .parallel()\n       \
    \   .forEach(i -> map.put(i, i * i));\n    } catch (Exception e) {\n      System.err.println(e);\
    \ // carry on with check\n    }\n    // count actual entries\n    var entries\
    \ = new LongAdder();\n    map.forEach((k, v) -> entries.increment());\n\n    System.out.println(\"\
    entries = \" + entries);\n    System.out.println(\"map.size() = \" + map.size());\n\
    \n    assertTrue(\"entries=\" + entries + \", \" +\n                   \"map.size=\"\
    \ + map.size(),\n        entries.intValue() == map.size());\n  }\n}\n```\n\nListing\
    \ 2.12: `ConcurrentTest` modifies map concurrently using parallel streams.\n\n\
    Our `CustomHashMapTest` supplies the `CustomHashMap` to ConcurrentTest.\n\n```\n\
    //:~ core/src/test/.../ch02/protection/CustomHashMapTest.java\npublic class CustomHashMapTest\
    \ extends ConcurrentTest {\n  @Test\n  public void testCustomHashMap() {\n   \
    \ try {\n      check(new CustomHashMap<>());  // won't work\n    } catch (AssertionError\
    \ error) {\n      System.err.println(error);\n    }\n  }\n}\n```\n\nListing 2.13:\
    \ `CustomHashMapTest`.\n\nOver several runs of this code on a MacBook Pro (2018)\
    \ i9 with 6 cores, the counted `entries` never equaled `map.size()`. Nor did the\
    \ count equal 46,000. For example, Listing 2.14 is the output of one run.\n\n\
    ```\nCustomHashMap constructed\nChecking CustomHashMap\nentries = 35474\nmap.size()\
    \ = 41663\njava.lang.AssertionError: entries=35474, map.size=41663\n```\n\nListing\
    \ 2.14: Output from `CustomHashMapTest`."
