- fmt: "\nIntent: “Convert the interface of a class into another interface clients\
    \ expect. Adapter lets classes work together that couldn’t otherwise because of\
    \ incompatible interfaces.” (GoF 1994, p. 139)\n\nThe adapter pattern’s goal is\
    \ to make objects work together, even if they have incompatible interfaces. It\
    \ is the diplomat of patterns. The adapter pattern can be implemented either as\
    \ an object adapter that uses composition or as a class adapter that uses inheritance.\n\
    \nIn Figure 2, the `Adapter` implements the `Target` interface and delegates to\
    \ the class that we want to adapt, in our case `Adaptee`. Since our adaptee is\
    \ an object inside our adapter, we call this an “object adapter”. The object adapter\
    \ uses composition to adapt the `Adaptee`.\n\n![ObjectAdapterStructure](images/ch01/ObjectAdapterStructure.png)\n\
    \nFigure 2. Structure of the object-adapter design pattern.\n\nAn example of an\
    \ object adapter in Java is the `InputStreamReader`, which adapts an `InputStream`\
    \ into a `Reader`.\n\nA lesser used form of adapter occurs when our `Adapter`\
    \ extends the `Adaptee` and implements the `Target` interface. Since the adaptee\
    \ is a superclass of our adapter, we call this a “class adapter”, as shown in\
    \ Figure 3. The class adapter uses inheritance to adapt the `Adaptee`.\n\n![ClassAdapterStructure](images/ch01/ClassAdapterStructure.png)\n\
    \nFigure 3. Structure of the class-adapter design pattern.\n\nAn advantage of\
    \ the class adapter is that it makes it easier to modify parts of an adaptee.\
    \ Unfortunately, the trade-off is that it becomes harder to adapt a hierarchy\
    \ of objects. In a later chapter, we shall see how to get the extensibility of\
    \ the class adapter and the flexibility of the object adapter using a dynamic\
    \ proxy.\n\n### How is an object adapter like a proxy?\n\nIn the proxy pattern,\
    \ the `RealSubject` implements the `Subject` interface. If we take away the inheritance\
    \ relationship, is this still a proxy or does it become an adapter? Similarly,\
    \ if in an adapter the `Adaptee` happens to implement `Target`, does the pattern\
    \ become a proxy?\n\nIt depends on the intent. For example, with session beans\
    \ in EJB, the implementation bean does not inherit directly from the remote interface,\
    \ because the methods throw incompatible exceptions. The remote interface would\
    \ throw `RemoteException`, whereas the implementation bean would throw business\
    \ exceptions.\n\nAn object adapter has a similar structure to the proxy. In both\
    \ cases, the client uses the top-level interfaces `Target` or `Subject`. We have\
    \ implementations of this interface in `Adapter` or `Proxy`.\n\n## Decorator pattern\n\
    \nIntent: “Attach additional responsibilities to an object dynamically. Decorators\
    \ provide a flexible alternative to subclassing for extending functionality.”\
    \ (GoF 1994, p. 175)\n\n![DecoratorStructure](images/ch01/DecoratorStructure.png)\n\
    \nFigure 4. Structure of the decorator design pattern.\n\nWhen we want to add\
    \ new methods to a class, the easiest approach is to add them to a subclass. However,\
    \ this may lead to clumsy class hierarchies, and risks duplication of code due\
    \ to the inability to extend more than one superclass. A better approach is the\
    \ decorator pattern, with which we decorate an object with a richer class and\
    \ thereby “attach additional responsibilities”. We can also use this pattern to\
    \ remove methods that we do not want to support. This is called “filtering”.\n\
    \nA well known example of a decorator is the `java.io.InputStream` and related\
    \ classes, with the design copied from C++. Concrete components include `FileInputStream`\
    \ and `SocketInputStream`. We also have a myriad of decorators, such as `BufferedInputStream`\
    \ for adding I/O buffering, `DataInputStream` for reading primitive data in little-endian\
    \ format, and `ObjectInputStream` for reading Java objects using serialization.\
    \ There is even a `ProgressMonitorInputStream` that opens up a Swing progress\
    \ dialog if it takes longer than two seconds to read the input.\n\nIn Listing\
    \ 1.1, we create a `FileOutputStream` to the file `data.bin.gz`. We decorate this\
    \ with `GZIPOutputStream`, `BufferedOutputStream`, and `DataOutputStream`. Each\
    \ link in the chain adds functionality. We then write 10 million random integers\
    \ between zero and 1,000.\n\n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\n\
    try (var out = new DataOutputStream(\n    new BufferedOutputStream(\n        new\
    \ GZIPOutputStream(\n            new FileOutputStream(\n                \"data.bin.gz\"\
    ))))) {\n  // write ten million random ints between 0 and 1000 to\n  // data.bin.gz,\
    \ compressing the file with GZIP on the fly\n  ThreadLocalRandom.current().ints(10_000_000,\
    \ 0, 1_000)\n      .forEach(i -> {\n        try {\n          out.writeInt(i);\n\
    \        } catch (IOException e) {\n          throw new UncheckedIOException(e);\n\
    \        }\n      });\n  out.writeInt(-1); // our EOF marker\n}\n```\n\nListing\
    \ 1.1: Writing to a `DataOutputStream`.\n\nIn Listing 1.2, we read from a `DataInputStream`,\
    \ which in turn reads from `BufferedInputStream`, `GZIPInputStream`, and `FileInputStream`.\n\
    \n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\ntry (\n    // declared\
    \ \"fis\" separately to ensure it is closed, even\n    // if the file does not\
    \ contain a proper GZIP header\n    var fis = new FileInputStream(\"data.bin.gz\"\
    );\n    var in = new DataInputStream(\n        new BufferedInputStream(\n    \
    \        new GZIPInputStream(fis)))) {\n  long total = 0;\n  int value;\n  //\
    \ keep reading until value == -1, our EOF marker\n  while ((value = in.readInt())\
    \ != -1) {\n    total += value;\n  }\n  // we expect total to be 5 billion\n \
    \ System.out.println(\"total = \" + total);\n}\n```\n\nListing 1.2: Reading from\
    \ a `DataInputStream`.\n\n(The reason we declared the `FileInputStream` separately\
    \ is that `GZIPInputStream` reads the file header to verify that it is a Gzip\
    \ file. If the header is incorrect, the constructor to `GZIPInputStream` throws\
    \ an exception, in which case the `FileInputStream` will not be auto-closed if\
    \ we do not declare it separately.)\n\n### How is a decorator like a proxy?\n\n\
    Decorator is most similar in structure to proxy. `Component` is `Subject`, `Decorator`\
    \ is like `Proxy`, and `ConcreteComponent` is like `RealSubject`. One difference\
    \ is in the classes that the client sees. In the proxy, the client uses the interface\
    \ of `Subject`, whereas in decorator, the client may use the concrete decorator\
    \ instances. Another difference is that a decorator normally has a component as\
    \ constructor parameter.\n\n## Composite pattern\n\nIntent: “Compose objects into\
    \ tree structures to represent part-whole hierarchies. Composite lets clients\
    \ treat individual objects and compositions of objects uniformly.” (GoF 1994,\
    \ p. 163)\n\n![CompositeStructure](images/ch01/CompositeStructure.png)\n\nFigure\
    \ 5. Structure of the composite design pattern.\n\nThe structure is again similar\
    \ to proxy and object adapter. The difference is that there is a one-to-many relationship\
    \ between the composite and the component. The client speaks to the top-level\
    \ component class.\n\n### How is a composite like a proxy?\n\nIn both composite\
    \ and proxy patterns, the client would use the top-level interfaces of `Subject`\
    \ or `Component`. However, the composite pattern has a one-to-many relationship\
    \ between its `Composite` and `Component`, whereas the proxy pattern has a one-to-one\
    \ association between its `Proxy` and `Subject`.\n\n## Chain-of-responsibility\
    \ pattern\n\nIntent: “Avoid coupling the sender of a request to its receiver by\
    \ giving more than one object a chance to handle the request. Chain the receiving\
    \ objects and pass the request along the chain until an object handles it.” (GoF\
    \ 1994, p. 223)\n\n![ChainOfResponsibilityStructure](images/ch01/ChainOfResponsibilityStructure.png)\n\
    \nFigure 6. Structure of the chain-of-responsibility design pattern.\n\nWe use\
    \ the chain-of-responsibility pattern to make our method-handling code easier\
    \ to understand. This pattern is useful when we have code of the form shown in\
    \ Listing 1.3.\n"
  raw: "Intent: “Convert the interface of a class into another interface clients expect.\
    \ Adapter lets classes work together that couldn’t otherwise because of incompatible\
    \ interfaces.” (GoF 1994, p. 139)\n\nThe adapter pattern’s goal is to make objects\
    \ work together, even if they have incompatible interfaces. It is the diplomat\
    \ of patterns. The adapter pattern can be implemented either as an object adapter\
    \ that uses composition or as a class adapter that uses inheritance.\n\nIn Figure\
    \ 2, the `Adapter` implements the `Target` interface and delegates to the class\
    \ that we want to adapt, in our case `Adaptee`. Since our adaptee is an object\
    \ inside our adapter, we call this an “object adapter”. The object adapter uses\
    \ composition to adapt the `Adaptee`.\n\n![ObjectAdapterStructure](images/ch01/ObjectAdapterStructure.png)\n\
    \nFigure 2\\. Structure of the object-adapter design pattern.\n\nAn example of\
    \ an object adapter in Java is the `InputStreamReader`, which adapts an `InputStream`\
    \ into a `Reader`.\n\nA lesser used form of adapter occurs when our `Adapter`\
    \ extends the `Adaptee` and implements the `Target` interface. Since the adaptee\
    \ is a superclass of our adapter, we call this a “class adapter”, as shown in\
    \ Figure 3\\. The class adapter uses inheritance to adapt the `Adaptee`.\n\n![ClassAdapterStructure](images/ch01/ClassAdapterStructure.png)\n\
    \nFigure 3\\. Structure of the class-adapter design pattern.\n\nAn advantage of\
    \ the class adapter is that it makes it easier to modify parts of an adaptee.\
    \ Unfortunately, the trade-off is that it becomes harder to adapt a hierarchy\
    \ of objects. In a later chapter, we shall see how to get the extensibility of\
    \ the class adapter and the flexibility of the object adapter using a dynamic\
    \ proxy.\n\n### How is an object adapter like a proxy?\n\nIn the proxy pattern,\
    \ the `RealSubject` implements the `Subject` interface. If we take away the inheritance\
    \ relationship, is this still a proxy or does it become an adapter? Similarly,\
    \ if in an adapter the `Adaptee` happens to implement `Target`, does the pattern\
    \ become a proxy?\n\nIt depends on the intent. For example, with session beans\
    \ in EJB, the implementation bean does not inherit directly from the remote interface,\
    \ because the methods throw incompatible exceptions. The remote interface would\
    \ throw `RemoteException`, whereas the implementation bean would throw business\
    \ exceptions.\n\nAn object adapter has a similar structure to the proxy. In both\
    \ cases, the client uses the top-level interfaces `Target` or `Subject`. We have\
    \ implementations of this interface in `Adapter` or `Proxy`.\n\n## Decorator pattern\n\
    \nIntent: “Attach additional responsibilities to an object dynamically. Decorators\
    \ provide a flexible alternative to subclassing for extending functionality.”\
    \ (GoF 1994, p. 175)\n\n![DecoratorStructure](images/ch01/DecoratorStructure.png)\n\
    \nFigure 4\\. Structure of the decorator design pattern.\n\nWhen we want to add\
    \ new methods to a class, the easiest approach is to add them to a subclass. However,\
    \ this may lead to clumsy class hierarchies, and risks duplication of code due\
    \ to the inability to extend more than one superclass. A better approach is the\
    \ decorator pattern, with which we decorate an object with a richer class and\
    \ thereby “attach additional responsibilities”. We can also use this pattern to\
    \ remove methods that we do not want to support. This is called “filtering”.\n\
    \nA well known example of a decorator is the `java.io.InputStream` and related\
    \ classes, with the design copied from C++. Concrete components include `FileInputStream`\
    \ and `SocketInputStream`. We also have a myriad of decorators, such as `BufferedInputStream`\
    \ for adding I/O buffering, `DataInputStream` for reading primitive data in little-endian\
    \ format, and `ObjectInputStream` for reading Java objects using serialization.\
    \ There is even a `ProgressMonitorInputStream` that opens up a Swing progress\
    \ dialog if it takes longer than two seconds to read the input.\n\nIn Listing\
    \ 1.1, we create a `FileOutputStream` to the file data.bin.gz. We decorate this\
    \ with `GZIPOutputStream`, `BufferedOutputStream`, and `DataOutputStream`. Each\
    \ link in the chain adds functionality. We then write 10 million random integers\
    \ between zero and 1,000.\n\n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\n\
    try (var out = new DataOutputStream(\n    new BufferedOutputStream(\n        new\
    \ GZIPOutputStream(\n            new FileOutputStream(\n                \"data.bin.gz\"\
    ))))) {\n  // write ten million random ints between 0 and 1000 to\n  // data.bin.gz,\
    \ compressing the file with GZIP on the fly\n  ThreadLocalRandom.current().ints(10_000_000,\
    \ 0, 1_000)\n      .forEach(i -> {\n        try {\n          out.writeInt(i);\n\
    \        } catch (IOException e) {\n          throw new UncheckedIOException(e);\n\
    \        }\n      });\n  out.writeInt(-1); // our EOF marker\n}\n```\n\nListing\
    \ 1.1: Writing to a `DataOutputStream`.\n\nIn Listing 1.2, we read from a `DataInputStream`,\
    \ which in turn reads from `BufferedInputStream`, `GZIPInputStream`, and `FileInputStream`.\n\
    \n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\ntry (\n    // declared\
    \ \"fis\" separately to ensure it is closed, even\n    // if the file does not\
    \ contain a proper GZIP header\n    var fis = new FileInputStream(\"data.bin.gz\"\
    );\n    var in = new DataInputStream(\n        new BufferedInputStream(\n    \
    \        new GZIPInputStream(fis)))) {\n  long total = 0;\n  int value;\n  //\
    \ keep reading until value == -1, our EOF marker\n  while ((value = in.readInt())\
    \ != -1) {\n    total += value;\n  }\n  // we expect total to be approximately\
    \ 5 billion\n  System.out.println(\"total = \" + total);\n}\n```\n\nListing 1.2:\
    \ Reading from a `DataInputStream`.\n\n(The reason we declared the `FileInputStream`\
    \ separately is that the `GZIPInputStream` reads the file header to verify that\
    \ it is indeed a Gzip file. If the header is incorrect, the constructor to `GZIPInputStream`\
    \ throws an exception, in which case the `FileInputStream` will not be auto-closed\
    \ if we do not declare it separately.)\n\n### How is a decorator like a proxy?\n\
    \nDecorator is most similar in structure to proxy. `Component` is like `Subject`,\
    \ `Decorator` is like `Proxy`, and `ConcreteComponent` is like `RealSubject`.\
    \ One difference is in the classes that the client typically sees. In the proxy,\
    \ the client uses the interface of the `Subject`, whereas in decorator, the client\
    \ may use the concrete decorator instances. Another difference is that a decorator\
    \ normally has a component as constructor parameter.\n\n## Composite pattern\n\
    \nIntent: “Compose objects into tree structures to represent part-whole hierarchies.\
    \ Composite lets clients treat individual objects and compositions of objects\
    \ uniformly.” (GoF 1994, p. 163)\n\n![CompositeStructure](images/ch01/CompositeStructure.png)\n\
    \nFigure 5\\. Structure of the composite design pattern.\n\nThe structure is again\
    \ similar to proxy and object adapter. The difference is that there is a one-to-many\
    \ relationship between the composite and the component. The client speaks to the\
    \ top-level component class.\n\n### How is a composite like a proxy?\n\nIn both\
    \ composite and proxy patterns, the client would use the top-level interfaces\
    \ of `Subject` or `Component`. However, the composite pattern has a one-to-many\
    \ relationship between its `Composite` and `Component`, whereas the proxy pattern\
    \ has a one-to-one association between its `Proxy` and `Subject`.\n\n## Chain-of-responsibility\
    \ pattern\n\nIntent: “Avoid coupling the sender of a request to its receiver by\
    \ giving more than one object a chance to handle the request. Chain the receiving\
    \ objects and pass the request along the chain until an object handles it.” (GoF\
    \ 1994, p. 223)\n\n![ChainOfResponsibilityStructure](images/ch01/ChainOfResponsibilityStructure.png)\n\
    \nFigure 6\\. Structure of the chain-of-responsibility design pattern.\n\nWe use\
    \ the chain-of-responsibility pattern to make our method-handling code easier\
    \ to understand. This pattern is useful when we have code of the form shown in\
    \ Listing 1.3."
