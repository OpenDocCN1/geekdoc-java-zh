  trans: "\n\n为了解决 `CustomHashMap` 中的竞态条件，我们将使用 `SynchronizedCustomMap` 对其进行代理。在委托给\
    \ `CustomMap` 方法之前，我们将所有方法都标记为 `synchronized`。\n\n```java\n//:~ core/src/main/.../ch02/protection/SynchronizedCustomMap.java\n\
    public class SynchronizedCustomMap<K, V>\n    implements CustomMap<K, V> {\n \
    \ private final CustomMap<K, V> map;\n  public SynchronizedCustomMap(CustomMap<K,\
    \ V> map) {\n    this.map = map;\n  }\n  @Override\n  public synchronized int\
    \ size() {\n    return map.size();\n  }\n  @Override\n  public synchronized V\
    \ get(Object key) {\n    return map.get(key);\n  }\n  @Override\n  public synchronized\
    \ V put(K key, V value) {\n    return map.put(key, value);\n  }\n  @Override\n\
    \  public synchronized V remove(Object key) {\n    return map.remove(key);\n \
    \ }\n  @Override\n  public synchronized void clear() {\n    map.clear();\n  }\n\
    \  @Override\n  public synchronized void forEach(\n      BiConsumer<? super K,\
    \ ? super V> action) {\n    map.forEach(action);\n  }\n}\n```\n\nListing 2.15:\
    \ `SynchronizedCustomMap` 使用 `synchronized` 来保证线程安全。\n\n我们的 `SynchronizedTest`\
    \ 创建了一个代理自 `CustomHashMap` 的 `SynchronizedCustomMap`，并将其传递给 `ConcurrentTest`。\n\
    \n```java\n//:~ core/src/test/.../ch02/protection/SynchronizedTest.java\npublic\
    \ class SynchronizedTest extends ConcurrentTest {\n  @Test\n  public void testSynchronizedCustomMap()\
    \ {\n    check(new SynchronizedCustomMap<>(new CustomHashMap<>()));\n  }\n}\n\
    ```\n\nListing 2.16: 用于测试 `SynchronizedCustomMap` 的 `SynchronizedTest`。\n\n正如预期，当我们使用\
    \ `synchronized` 保护对 `CustomMap` 的所有访问时，我们就消除了竞态条件。\n\n### `UnmodifiableCustomMap`\n\
    \n直接从方法返回的集合往往是 bug 的根源。当调用者更改这些集合时，到底会发生什么并不总是清楚的。原始集合应该被修改，还是更改不应该产生影响？推荐的方法之一是返回一个不可修改的集合，也就是说如果调用了会修改集合内容的方法，该方法将抛出\
    \ `UnsupportedOperationException`。我们的 `CustomMap` 是通过 `put()`、`remove()` 和 `clear()`\
    \ 方法修改的。\n\n如果我们想确保任何获取了 map 的人无法修改它，我们可以发送给他们一个 `UnmodifiableCustomMap`（不可修改自定义\
    \ map）。每当我们调用如 `put()` 等修改方法时，它都会抛出 `UnsupportedOperationException`。\n\n```java\n\
    //:~ core/src/main/.../ch02/protection/UnmodifiableCustomMap.java\npublic class\
    \ UnmodifiableCustomMap<K, V>\n    implements CustomMap<K, V> {\n  private final\
    \ CustomMap<K, V> map;\n  public UnmodifiableCustomMap(CustomMap<K, V> map) {\n\
    \    this.map = map;\n  }\n  @Override\n  public int size() {\n    return map.size();\n\
    \  }\n  @Override\n  public V get(Object key) {\n    return map.get(key);\n  }\n\
    \  @Override\n  public V put(K key, V value) {\n    throw new UnsupportedOperationException(\"\
    unmodifiable\");\n  }\n  @Override\n  public V remove(Object key) {\n    throw\
    \ new UnsupportedOperationException(\"unmodifiable\");\n  }\n  @Override\n  public\
    \ void clear() {\n    throw new UnsupportedOperationException(\"unmodifiable\"\
    );\n  }\n  @Override\n  public void forEach(BiConsumer<? super K, ? super V> action)\
    \ {\n    map.forEach(action);\n  }\n}\n```\n\nListing 2.17: `UnmodifiableCustomMap`\
    \ 对修改方法抛出 `UnsupportedOperationException`。\n\n我们的 `UnmodifiableTest` 检查了使用之前展示的\
    \ `ConcurrentTest` 尝试修改 `UnmodifiableCustomMap` 时会发生什么。\n\n```java\n//:~ core/src/test/.../ch02/protection/UnmodifiableTest.java\n\
    public class UnmodifiableTest extends ConcurrentTest {\n  @Test\n  public void\
    \ testUnmodifiableCustomMap() {\n    check(new UnmodifiableCustomMap<>(new CustomHashMap<>()));\n\
    \  }\n}\n```\n\nListing 2.18: `UnmodifiableTest`。\n\n正如预期，调用 `put()` 会导致 `UnsupportedOperationException`。\n\
    \n```\nCustomHashMap constructed\nChecking UnmodifiableCustomMap\njava.lang.UnsupportedOperationException:\
    \ unmodifiable\nentries = 0\nmap.size() = 0\n```\n\nListing 2.19: `UnmodifiableTest`\
    \ 的输出。\n\n## 级联代理\n\n原始的 GoF 代理类图有一个从 `Proxy` 到 `RealSubject` 的关联。一种更灵活的方法是让 `Proxy`\
    \ 指向 `Subject` 接口。这正是我们迄为止编写每个代理示例的方式。通过指向 `Subject`，我们可以对代理进行级联：一个保护代理可能会指向一个虚拟代理，而虚拟代理反过来可能指向一个远程代理，然后指向\
    \ `RealSubject`。\n\n例如，让我们之前的 `SynchronizedCustomMap` 与我们的 `VirtualCustomMap`\
    \ 结合。\n\n```java\n//:~ core/src/test/.../ch02/protection/SynchronizedVirtualTest.java\n\
    public class SynchronizedVirtualTest extends ConcurrentTest {\n  @Test\n  public\
    \ void testSynchronizedVirtualMap() {\n    check(new SynchronizedCustomMap<>(new\
    \ VirtualCustomMap<>()));\n  }\n}\n```\n\nListing 2.20: 级联保护代理与虚拟代理。\n\n"
- fmt: "\nTo achieve this transparency, let’s begin by refining the proxy’s `equals()`\
    \ method. Note that delegating to `map` is consistent with how we’ve written proxy\
    \ methods before.\n\n```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInHandCraftedProxy.java\n\
    @Override\npublic boolean equals(Object o) {\n  return map.equals(o);\n}\n@Override\n\
    public int hashCode() {\n  return map.hashCode();\n}\n```\n\nListing 2.24: Consistent\
    \ proxy `equals()`.\n\nThe `CustomHashMap` requires a bit more work.\n\n1. We\
    \ ensure that the parameter is an instance of `CustomMap`. This returns `false`\
    \ when the parameter is either `null` or an object other than a `CustomMap`.\n\
    \n2. We check whether the class of the argument is a `CustomHashMap`. If it is\
    \ the same class, we downcast and compare the two `map` fields. A best practice\
    \ is to mark the `equals()` method in `CustomHashMap` as `final` to prevent unexpected\
    \ overriding, as that could create non-symmetric `equals()` methods. Since `hashCode()`\
    \ needs to be paired with `equals()`, we also mark that as `final`.\n\n3. Otherwise,\
    \ we return the result of reversing the equals condition as `o.equals(this)`.\
    \ Without the reversing, we would end up in an infinite loop. Since `equals()`\
    \ is required to be symmetric, the result of `o.equals(this)` has to be the same\
    \ as `this.equals(o)`.\n\n```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInCustomHashMap.java\n\
    @Override\npublic final boolean equals(Object o) {\n  if (this == o) return true;\n\
    \  if (!(o instanceof CustomMap)) return false;\n\n  if (o instanceof CustomHashMap)\
    \ {\n    CustomHashMap<?, ?> that = (CustomHashMap<?, ?>) o;\n    return this.map.equals(that.map);\n\
    \  }\n  return o.equals(this); // reversing the equals() condition\n}\n@Override\n\
    public final int hashCode() {\n  return map.hashCode();\n}\n```\n\nListing 2.25:\
    \ Correct `CustomHashMap.equals()`.\n\nWe see the `equals()` method in action\
    \ in `CustomMapEqualsTest`. For a more complete set of tests, please visit [github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples/tree/master/core/src/test/java/eu/javaspecialists/books/dynamicproxies/ch02/equals).\n\
    \n```java\n//:~ core/src/test/.../ch02/equals/CustomMapEqualsTest.java\npublic\
    \ class CustomMapEqualsTest {\n  @Test\n  public void testEqualsContract() {\n\
    \    var real = new CustomHashMap<Integer, Integer>();\n    for (int i = 0; i\
    \ < 10; i++) real.put(i, i * i);\n    var proxy1 = new UnmodifiableCustomMap<>(real);\n\
    \    var proxy2 = new UnmodifiableCustomMap<>(real);\n    var empty = new CustomHashMap<Integer,\
    \ Integer>();\n\n    // reflexive\n    assertEquals(real, real);\n    assertEquals(proxy1,\
    \ proxy1);\n    assertEquals(proxy2, proxy2);\n\n    // symmetric\n    assertEquals(real,\
    \ proxy1);\n    assertEquals(proxy1, real);\n    assertEquals(proxy1, proxy2);\n\
    \    assertEquals(proxy2, proxy1);\n\n    // transitive\n    if (real.equals(empty)\
    \ && empty.equals(proxy2))\n      assertEquals(real, proxy2);\n    if (real.equals(proxy1)\
    \ && proxy1.equals(proxy2))\n      assertEquals(real, proxy2);\n  }\n}\n```\n\n\
    Listing 2.26: `equals()` example.\n\nVoila! We have an `equals()` that fulfills\
    \ all the requirements described above and has allowed our real subject to be\
    \ “proxiable”. It is reflexive, symmetric, and transitive. Plus, if we compare\
    \ an object to its proxy, we get the desired result of `true`.\n\n# Dynamic Proxy\n\
    \nUntil now, we’ve coded the proxy classes by hand. It makes sense to handcraft\
    \ the code when each type of proxy is unique in structure and function. However,\
    \ the majority of proxy implementations are similar. For example, remote proxies\
    \ all have to shunt parameters and return values back and forth. Java RMI generates\
    \ the glue code for remote proxies in the form of stubs and skeletons. IDEs will\
    \ generate delegation boilerplate for us, but we still have to read all that code\
    \ to understand what it is doing.\n\nCode generation can be either static or dynamic.\
    \ Static is less convenient as it requires an extra build step. Dynamic creates\
    \ a new proxy class at run time. It is super convenient and flexible. In this\
    \ chapter, we will learn how the dynamic proxy works in Java.\n\n## `Proxy.newProxyInstance()`\n\
    \nWe construct dynamic proxies with the static factory method `newProxyInstance()`\
    \ with these three parameters:\n\n* `ClassLoader loader` is where our new proxy\
    \ class is loaded. The `ClassLoader` needs to be able to see the interfaces that\
    \ we want to implement. For example, the bootstrap class loader knows about the\
    \ Java interfaces (`java.lang.Runnable`, `java.util.Collection`, etc.) but not\
    \ about application interfaces. Our classes are loaded with the system class loader\
    \ (also called `AppClassLoader`).\n\n* `Class<?>[] interfaces` is an array that\
    \ contains all the interfaces that our proxy object needs to implement.\n\n* `InvocationHandler`\
    \ is a functional interface that is invoked whenever any method is called.\n\n\
    ### `InvocationHandler`\n\nAny method called on the proxy object is dispatched\
    \ to the `invoke()` method of the `InvocationHandler`.\n\n```java\n//:~ core/src/main/.../ch03/InvocationHandlerDeclaration.java\n\
    public interface InvocationHandler {\n  public Object invoke(Object proxy,\n \
    \                      Method method,\n                       Object[] args) throws\
    \ Throwable;\n}\n```\n\nListing 3.4: `InvocationHandler`.\n\nThe method `invoke()`\
    \ has three parameters:\n"
