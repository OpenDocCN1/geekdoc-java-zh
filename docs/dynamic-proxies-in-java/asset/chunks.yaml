    我们的 `CompositeHandler` 构造函数接收组件类型作为参数，该类型必须派自 `BaseComponent`。`reducers` 参数包含了如何合并方法调用结果的逻辑。在流（streams）中，我们可以将所有元素归约为另一个对象，这非常相似。我们的
    `Reducer` 包含一个 `BinaryOperator<T>`，它派自 `BiFunction<T,T,T>`。我们稍后会看到更多细节。最后一个参数是
    `typeChecks`。这些是 `add()` 方法的参数所必须扩展的接口或类。我们稍后会看到示例。


    `CompositeHandler` 拥有一个包含默认接口方法的 `VTable`，称为 `defaultVT`。如果存在默认方法，我们会在调用子方法之前先调用它，并使用相关的
    reducer 将所有结果合并在一起。


    `invoke()` 方法检查方法名是否为 `"add"` 或 `"remove"`，并以 `Object.class` 作为唯一的参数类型；在这种情况下，它会在其子列表上调用相关的
    `add()` 或 `remove()` 方法。`add()` 方法需要稍微解释。我们首先检查参数类型是否正确，即它是否是 `typeChecks` 数组中所有类型的实例。虽然这些通常是接口，但
    Java 没有类的多重继承，因此其中一个也可能是一个类。对于每种类型的子，我们还需要根据 `component` 接口中的方法找到可以调用的匹配方法。这对于支持异构组件层次结构是必要的。


    除了 `"add"` 和 `"remove"` 之外的所有方法都通过 map 管理，并在子流上进行 reduce。`map()` 在每个子节点上调用所需的方法，而
    `reduce()` 则合并结果。


    遗憾的是，lambda 表达式与检查异常（checked exceptions）配合得不好，因此我们在方法内部定义了一个 `UncheckedException`
    类。是的，这是可行的，并且优点是在该方法外部是不可见的。我们稍后会再次解开异常并从我们的 `invoke()` 方法中抛出。我们会在遇到第一个异常时失败。由于
    `UncheckedException` 是方法私有的，我们通过从 `fillInStackTrace()` 方法返回 `null` 来擦除堆栈轨迹。


    我们稍后会查看 `Reducer`。目前，只需知道有两种特殊的 `Reducer` 类型：`NULL_REDUCER` 和 `PROXY_INSTANCE_REDUCER`。`NULL_REDUCER`
    适用于返回 `void` 的方法。`PROXY_INSTANCE_REDUCER` 是返回 `this` 的方法的特殊标记——在我们的案例中，即 `proxy`。

    '
- fmt: "\n```java\n//:~ core/src/main/.../handlers/CompositeHandler.java\npublic final\
    \ class CompositeHandler\n    implements InvocationHandler {\n  private final\
    \ Class<?> component;\n  private final Map<MethodKey, Reducer> reducers;\n  private\
    \ final Class<?>[] typeChecks;\n  private final VTable defaultVT;\n  private final\
    \ Collection<Object> children = new ArrayList<>();\n  private final Map<Class<?>,\
    \ VTable> childMethodMap =\n      new ConcurrentHashMap<>();\n\n  @SuppressWarnings({\"\
    unchecked\", \"rawtypes\"})\n  public <E extends BaseComponent<? super E>> CompositeHandler(\n\
    \      Class<? super E> component,\n      Map<MethodKey, Reducer> reducers,\n\
    \      Class<?>[] typeChecks) {\n    if (!BaseComponent.class.isAssignableFrom(component))\n\
    \      throw new IllegalArgumentException(\n          \"component is not derived\
    \ from BaseComponent\");\n    this.component = component;\n    this.reducers =\
    \ Objects.requireNonNull(reducers);\n    this.typeChecks = Objects.requireNonNull(typeChecks);\n\
    \    this.defaultVT = VTables.newDefaultMethodVTable(component);\n  }\n\n  @Override\n\
    \  public Object invoke(Object proxy,\n                       Method method, Object[]\
    \ args)\n      throws Throwable {\n    // Look for \"add(Object)\" and \"remove(Object)\"\
    \ methods\n    // from BaseComponent\n    if (matches(method, \"add\")) {\n  \
    \    requiresAllInterfaces(args[0]);\n      addChildMethods(args[0].getClass());\n\
    \      return children.add(args[0]);\n    } else if (matches(method, \"remove\"\
    )) {\n      return children.remove(args[0]);\n    }\n\n    /**\n     * This special\
    \ class defined inside the method is only\n     * visible inside the method. It\
    \ is used to wrap and later\n     * unwrap checked exceptions. We override fillInStackTrace()\n\
    \     * to return null, so that we do not incur the cost of an\n     * additional\
    \ stack trace.\n     */\n    class UncheckedException extends RuntimeException\
    \ {\n      public UncheckedException(Throwable cause) {\n        super(cause);\n\
    \      }\n      @Override\n      public Throwable fillInStackTrace() { return\
    \ null; }\n    }\n\n    // The purpose of the mapFunction is to convert checked\n\
    \    // exceptions from our call to method.invoke() into\n    // an UncheckedException,\
    \ which we will unwrap later.\n    // Unlike the reducers, we need to create a\
    \ new lambda\n    // each time we call the invoke() method, as we need to\n  \
    \  // capture the method and args parameters.\n    Function<Object, Object> mapFunction\
    \ = child -> {\n      try {\n        VTable vt = childMethodMap.get(child.getClass());\n\
    \        assert vt != null : \"vt==null\";\n        Method childMethod = vt.lookup(method);\n\
    \        assert childMethod != null : \"childMethod==null\";\n        return childMethod.invoke(child,\
    \ args);\n      } catch (ReflectiveOperationException e) {\n        throw new\
    \ UncheckedException(e);\n      }\n    };\n\n    // The reducer is used to \"\
    reduce\" results from method calls\n    // to a single result.  By default we\
    \ will use the\n    // NULL_REDUCER, which always returns null.  This is\n   \
    \ // suitable for methods that return void.\n    var reducer = reducers.getOrDefault(\n\
    \        new MethodKey(method), Reducer.NULL_REDUCER);\n\n    // Next try call\
    \ the default interface method, if any.\n    // This helps support the visitor\
    \ pattern in the composite.\n    MethodHandle match = defaultVT.lookupDefaultMethod(method);\n\
    \    Object defaultMethodResult;\n    if (match == null) {\n      defaultMethodResult\
    \ = reducer.getIdentity();\n    } else {\n      // invoke default interface method\
    \ on component interface\n      defaultMethodResult = match.invoke(proxy, args);\n\
    \    }\n\n    try {\n      // We now need to call the method on all our children\
    \ and\n      // do a \"reduce\" on the results to return a single result.\n  \
    \    var merger = reducer.getMerger();\n      var result = children.stream()\n\
    \                       .map(mapFunction)\n                       .reduce(reducer.getIdentity(),\
    \ merger);\n      // A special case of reducer is PROXY_INSTANCE_REDUCER.\n  \
    \    // When that is specified, we return the proxy instance\n      // instead.\
    \  This is useful to support fluent interfaces\n      // that return \"this\"\
    .\n      if (reducer == Reducer.PROXY_INSTANCE_REDUCER)\n        return proxy;\n\
    \      else\n        return merger.apply(result, defaultMethodResult);\n    }\
    \ catch (UncheckedException ex) {\n      // Lastly we unwrap the UncheckedException\
    \ and throw the\n      // cause.\n      throw ex.getCause();\n    }\n  }\n\n \
    \ /**\n   * We need the childMethodMap to support the visitor pattern\n   * inside\
    \ our composite structures\n   */\n  private void addChildMethods(Class<?> childClass)\
    \ {\n    childMethodMap.computeIfAbsent(childClass,\n        clazz -> {\n    \
    \      Class<?> receiver;\n          if (clazz.getModule().isExported(\n     \
    \         clazz.getPackageName(), component.getModule())) {\n            // only\
    \ map child class methods if its module is\n            // and package are exported\
    \ to the target module\n            receiver = clazz;\n          } else if (Proxy.class.isAssignableFrom(clazz))\
    \ {\n            // childClass is a Proxy, use the first interface\n         \
    \   receiver = clazz.getInterfaces()[0];\n          } else {\n            receiver\
    \ = component;\n          }\n          return VTables.newVTableExcludingObjectMethods(\n\
    \              receiver, component);\n        });\n  }\n\n  private boolean matches(Method\
    \ method, String name) {\n    return name == method.getName()\n              \
    \ && method.getParameterCount() == 1\n               && ParameterTypes.get(method)[0]\n\
    \                      == Object.class;\n  }\n\n  private void requiresAllInterfaces(Object\
    \ arg) {\n    for (var check : typeChecks) {\n      if (!check.isInstance(arg))\n\
    \        throw new ClassCastException(\n            arg.getClass() + \" cannot\
    \ be cast to \" + check);\n    }\n  }\n}\n```\n\n### `CompositeHandler`\n\nThe\
