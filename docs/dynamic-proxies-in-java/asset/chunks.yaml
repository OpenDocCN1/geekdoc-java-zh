  trans: "\n\n# 使用远程代理调用远程方法\n\n大使馆是远程国家的本地代表。当我们申请签证、续换护照，或者在不乘坐飞机的情况下与远程实体（该国政府）交互时，就会访问它们。大使馆有点就像远程代理。\n\
    \n假设我们想申请访问加拿大的签证。\n\n```\n//:~ core/src/main/.../ch02/remote/Canada.java\npublic\
    \ interface Canada {\n  boolean canGetVisa(String name,\n                    \
    \ boolean married,\n                     boolean rich);\n}\n```\n\n列表 2.6：`Canada`。\n\
    \n我们的实现类定义在 `RealCanada` 内部，它检查最关键的属性。该类名听起来像某种啤酒的名字：*“Real Canada - 入口极其顺滑。啊。扑灭最深处的渴…………​。”*\n\
    \n```\n//:~ core/src/main/.../ch02/remote/RealCanada.java\npublic class RealCanada\
    \ implements Canada {\n  @Override\n  public boolean canGetVisa(String name,\n\
    \                            boolean married,\n                            boolean\
    \ rich) {\n    return married && rich || !married && rich || rich;\n    // 每个国家都喜欢富有的游客\
    \ ... :-)\n  }\n}\n```\n\n列表 2.7：`RealCanada`。\n\n我们将使用 [Jetty Web 服务器](https://github.com/eclipse/jetty.project)\
    \ 发布它。\n\n```\n//:~ core/src/main/.../ch02/remote/ServicePublisher.java\n/**\n\
    \ * @author Simone Bordet\n */\npublic class ServicePublisher extends AbstractHandler\
    \ {\n  private static final Pattern PATTERN =\n      Pattern.compile(\"/canGetVisa/\"\
    \ +\n                          \"(?<name>[^/]+)/\" +\n                       \
    \   \"(?<married>[^/]+)/\" +\n                          \"(?<rich>[^/]+)\");\n\
    \  private final Canada canada;\n\n  public ServicePublisher(Canada canada) {\n\
    \    this.canada = canada;\n  }\n\n  @Override\n  public void handle(String target,\
    \ Request jettyRequest,\n                     HttpServletRequest request,\n  \
    \                   HttpServletResponse response)\n      throws IOException {\n\
    \    jettyRequest.setHandled(true);\n    var matcher = PATTERN.matcher(request.getRequestURI());\n\
    \    if (matcher.matches()) {\n      var name = matcher.group(\"name\");\n   \
    \   var married = Boolean.valueOf(matcher.group(\"married\"));\n      var rich\
    \ = Boolean.valueOf(matcher.group(\"rich\"));\n      var canGetVisa = canada.canGetVisa(name,\
    \ married, rich);\n      response.getOutputStream().print(canGetVisa);\n    }\
    \ else {\n      response.setStatus(HttpServletResponse.SC_NOT_FOUND);\n    }\n\
    \  }\n  public static void main(String... args) throws Exception {\n    Canada\
    \ canada = new RealCanada();\n    var server = new Server(8080);\n    server.setHandler(new\
    \ ServicePublisher(canada));\n    server.start();\n  }\n}\n```\n\n列表 2.8：远程代理发布者。\n\
    \n服务器端就此了。当我们运行 `ServicePublisher` 时，它会创建一个我们可以连接的 REST 服务。\n\n接下来，我们创建一个远程代理，连接到该\
    \ REST 服务并调用方法。\n\n```\n//:~ core/src/main/.../ch02/remote/CanadianEmbassy.java\n\
    public class CanadianEmbassy implements Canada {\n  private final HttpClient httpClient\
    \ =\n      HttpClient.newBuilder().build();\n  @Override\n  public boolean canGetVisa(String\
    \ name,\n                            boolean married,\n                      \
    \      boolean rich) {\n    try {\n      var encodedName = URLEncoder.encode(name,\n\
    \          StandardCharsets.UTF_8);\n      var url = \"http://0.0.0.0:8080/canGetVisa/\"\
    \ +\n                    encodedName + \"/\" +\n                    married +\
    \ \"/\" + rich;\n      var req = HttpRequest.newBuilder()\n                  \
    \  .uri(URI.create(url))\n                    .build();\n      var res = httpClient.send(\n\
    \          req, HttpResponse.BodyHandlers.ofString());\n      return res.statusCode()\
    \ == HttpURLConnection.HTTP_OK &&\n                 Boolean.parseBoolean(res.body());\n\
    \    } catch (IOException e) {\n      throw new UncheckedIOException(e);\n   \
    \ } catch (InterruptedException e) {\n      Thread.currentThread().interrupt();\n\
    \      throw new CancellationException(\"interrupted\");\n    }\n  }\n}\n```\n\
    \n列表 2.9：我们的 `CanadianEmbassy`。\n\n`Client` 看起来就是普通的 Java 代码，完全感知不到远程实现。\n\n```\n\
    //:~ core/src/main/.../ch02/remote/Client.java\npublic class Client {\n  public\
    \ static void main(String... args) {\n    Canada canada = new CanadianEmbassy();\n\
    \    boolean visaObtained = canada.canGetVisa(\n        \"Heinz Kabutz\", true,\
    \ false);\n    System.out.println(\"visaObtained = \" + visaObtained);\n    System.out.println(\"\
    Wins lottery ...\");\n    visaObtained = canada.canGetVisa(\n        \"Heinz Kabutz\"\
    , true, true);\n    System.out.println(\"visaObtained = \" + visaObtained);\n\
    \  }\n}\n```\n\n列表 2.10：Client。\n\n我们通过以下方式运行此示例：首先启动 `ServicePublisher` 类，然后运行我们的\
    \ `Client`。\n\n```\nvisaObtained = false\nWins lottery ...\nvisaObtained = true\n\
    ```\n\n列表 2.11：我们拿到签证了吗？\n\n# 使用保护代理实现安全性\n\n安全性要么在它工作正常时极其无聊，要么在它出问题时超级令人兴奋（以糟糕的方式）。\n\
    \n我们需要保护对象，就像保护资产。保护代理可以防止以下情况：\n\n*   并发访问导致的竞态条件。\n*   未经授权的修改。\n*   对敏感状态的非法访问。\n\
    \n我们将查看不同的保护代理。\n\n### `SynchronizedMap`\n\n我们的 `HashMap` 在列表 2.2 中不是线程安全的。它依赖于\
    \ `java.util.HashMap`，这无法在并发访问保护状态。为了说明，考虑列表 2.12。我们使用并行流向 map 放入 46,000 个条目。然后通过\
    \ `forEach()` 遍历 map 并统计有多少条目。最后，我们打印出值。\n\n```java\n//:~ core/src/test/.../ch02/protection/ConcurrentTest.java\n\
    public class ConcurrentTest {\n  public static final int SQUARES = 46_000;\n \
    \ public void check(Map<Integer, Integer> map) {\n    System.out.println(\"Checking\
    \ \" + map.getClass().getSimpleName());\n    try {\n      IntStream.range(0, SQUARES)\n\
    \          .parallel()\n          .forEach(i -> map.put(i, i));\n    } catch (Exception\
    \ e) {\n      System.err.println(e);\n    }\n    // count actual entries\n   \
    \ var entries = new LongAdder();\n    map.forEach((k, v) -> entries.increment());\n\
    \n    System.out.println(\"entries = \" + entries);\n    System.out.println(\"\
    map.size() = \" + map.size());\n\n    assertTrue(\"entries=\" + entries + \",\
    \ \" +\n               \"map.size=\" + map.size(),\n        entries.intValue()\
    \ == map.size());\n  }\n}\n```\n\n列表 2.12：`ConcurrentTest` 使用并行流并发修改 map。\n\n\
    我们的 `CustomHashMapTest` 为 `ConcurrentTest` 提供了 `CustomHashMap`。\n\n```java\n//:~\
    \ core/src/test/.../ch02/protection/CustomHashMapTest.java\npublic class CustomHashMapTest\
    \ extends ConcurrentTest {\n  @Test\n  public void testCustomHashMap() {\n   \
    \ try {\n      check(new CustomHashMap<>()); // 不工作\n    } catch (AssertionError\
    \ error) {\n      System.err.println(error);\n    }\n  }\n}\n```\n\n列表 2.13：`CustomHashMapTest`。\n\
    \n在配备 6 核心的 2018 款 MacBook Pro (i9) 上多次运行此代码，统计出的 `entries` 从未等于于 `map.size()`。计数也不等于\
    \ 46,000。例如，列表 2.14 是其中一次运行的输出。\n\n```\nCustomHashMap constructed\nChecking CustomHashMap\n\
    entries = 35474\nmap.size() = 41663\njava.lang.AssertionError: entries=35474,\
    \ map.size=41663\n```\n\n列表 2.14：来自 `CustomHashMapTest` 的输出。\n\n"
- fmt: "\nTo solve the race condition in `CustomHashMap`, we will proxy it with a\
    \ `SynchronizedCustomMap`. This marks all methods as `synchronized` before delegating\
    \ to the `CustomMap` methods.\n\n```java\n//:~ core/src/main/.../ch02/protection/SynchronizedCustomMap.java\n\
    public class SynchronizedCustomMap<K, V>\n    implements CustomMap<K, V> {\n \
    \ private final CustomMap<K, V> map;\n  public SynchronizedCustomMap(CustomMap<K,\
    \ V> map) {\n    this.map = map;\n  }\n  @Override\n  public synchronized int\
    \ size() {\n    return map.size();\n  }\n  @Override\n  public synchronized V\
    \ get(Object key) {\n    return map.get(key);\n  }\n  @Override\n  public synchronized\
    \ V put(K key, V value) {\n    return map.put(key, value);\n  }\n  @Override\n\
    \  public synchronized V remove(Object key) {\n    return map.remove(key);\n \
    \ }\n  @Override\n  public synchronized void clear() {\n    map.clear();\n  }\n\
    \  @Override\n  public synchronized void forEach(\n      BiConsumer<? super K,\
    \ ? super V> action) {\n    map.forEach(action);\n  }\n}\n```\n\nListing 2.15:\
    \ `SynchronizedCustomMap` uses `synchronized` for thread safety.\n\nOur `SynchronizedTest`\
    \ creates a `SynchronizedCustomMap` that proxies the `CustomHashMap` and passes\
    \ that to `ConcurrentTest`.\n\n```java\n//:~ core/src/test/.../ch02/protection/SynchronizedTest.java\n\
    public class SynchronizedTest extends ConcurrentTest {\n  @Test\n  public void\
    \ testSynchronizedCustomMap() {\n    check(new SynchronizedCustomMap<>(new CustomHashMap<>()));\n\
    \  }\n}\n```\n\nListing 2.16: `SynchronizedTest` for testing `SynchronizedCustomMap`.\n\
    \nAs expected, we are free from race conditions when we protect all access to\
    \ the `CustomMap` with `synchronized`.\n\n### `UnmodifiableCustomMap`\n\nCollections\
    \ returned directly from methods are often a source of bugs. It is not always\
    \ clear what should happen when these collections are changed by the caller. Should\
    \ the original collection be modified or should the change have no effect? One\
    \ of the recommended approaches is to return an unmodifiable collection, that\
    \ is, one which throws an `UnsupportedOperationException` if a method is called\
    \ that would modify the contents of the collection. Our `CustomMap` is modified\
    \ by methods `put()`, `remove()`, and `clear()`.\n\nIf we wanted to make sure\
    \ that whoever got the map would not be able to modify it, we could send them\
