  trans: "\n\n- `Object proxy` 是调用 `invoke()` 的动态代理类的实例。我们将在稍后的章节中使用它。\n- `Method\
    \ method` 是一个 `java.lang.reflect.Method` 对象，对应被调用的方法。该方法要么来自创建动态代理时所使用的接口之一，要么来自\
    \ `Object` 类的三个公共非 final 方法之一，即 `hashCode()`、`equals(Object)` 或 `toString()`。\n\
    - `Object[] args` 是传递给该方法的参数数组。当方法没有任何参数时，该数组为 `null`。\n\n`invoke()` 方法声明它会抛出\
    \ `Throwable`。然而，方法应该只抛出那些在其方法签名中声明的受检异常（checked exceptions）。这是动态代理如何具有动态性的另一个例子——静态类型系统显示为\
    \ `Throwable`，但对于它们可以抛出哪些异常存在着动态约束。\n\n### `LoggingInvocationHandler`\n\n让我们来看如何创建我们自己的\
    \ `InvocationHandler`。在我们的 `LoggingInvocationHandler` 中，我们记录了方法调用以及它们消耗的时间。我们假设\
    \ `Object obj` 实现了与动态代理相同的接口。因此，我们通过 `return method.invoke(obj, args)` 将方法调用委托给\
    \ `obj`，并在周围包裹我们的日志代码。\n\n大部分代码都是自而易懂的，除了 `logFine` 优化部分。`System.nanoTime()` 是一个昂贵的系统调用，除非在启用细粒日志（fine\
    \ logging），否则我们希望避免调用它。由于级别在我们调用 `method.invoke()` 期间可能会发生，我们将原始设置写入一个 `final`\
    \ 局部变量 `logFine` 中。再次，`method.invoke()` 是动态代理如何具有动态性的一个例子——我们经常委托给底层功能，并且通过反射来实现这一点。\n\
    \n```\n//:~ core/src/main/.../handlers/LoggingInvocationHandler.java\npublic final\
    \ class LoggingInvocationHandler\n    implements InvocationHandler {\n  private\
    \ final Logger log;\n  private final Object obj;\n  public LoggingInvocationHandler(Logger\
    \ log, Object obj) {\n    this.log = log;\n    this.obj = obj;\n  }\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    log.info(() -> \"Entering \" + toString(method,\
    \ args));\n    // optimization - nanoTime() is an expensive native call\n    final\
    \ boolean logFine = log.isLoggable(Level.FINE);\n    long start = logFine ? System.nanoTime()\
    \ : 0;\n    try {\n      return method.invoke(obj, args);\n    } finally {\n \
    \     long nanos = logFine ? System.nanoTime() - start : 0;\n      log.info(()\
    \ -> \"Exiting \" + toString(method, args));\n      if (logFine) log.fine(() ->\
    \ \"Time \" + nanos + \"ns\");\n    }\n  }\n  private String toString(Method method,\
    \ Object[] args) {\n    return String.format(\"%s.%s(%s)\",\n        method.getDeclaringClass().getCanonicalName(),\n\
    \        method.getName(),\n        args == null ? \"\" :\n            Stream.of(args).map(String::valueOf)\n\
    \                .collect(Collectors.joining(\", \")));\n  }\n}\n```\n列表 3.5:\
    \ `LoggingInvocationHandler`。\n\n在列表 3.6 的 `LoggingProxyDemo` 中，我们创建了一个 `LoggingInvocationHandler`，它将所有方法调用记录到\
    \ `ConcurrentHashMap` 中。\n\n然后，我们通过调用 `Proxy.newProxyInstance()` 创建一个动态代理，传入 `Map`\
    \ 的类加载器（即引导程序类加载器）、一个包含 `Map` 接口的数组以及我们的 `LoggingInvocationHandler` 实例。\n\n`newProxyInstance()`\
    \ 用的结果类型为 `Object`，我们需要手动将其强制转换为正确的类型，在我们的例子中是 `Map<String, Integer>`。这是一个动态代理如何具有动态性的例子——静态类型系统显示为\
    \ `Object`，但动态类型更窄。\n\n一个动态代理可能实现很多接口，因此并不清楚我们想要强制转换为哪一个。\n\n一旦我们将我们的动态代理对象强制转换为\
    \ `Map`，我们在其上调用的所有方法都会被记录，连同它们的执行时间。\n\n```\n//:~ core/src/main/.../ch03/logging/LoggingProxyDemo.java\n\
    var handler = new LoggingInvocationHandler(\n    Logger.getGlobal(), new ConcurrentHashMap<>());\n\
    @SuppressWarnings(\"unchecked\")\nvar map = (Map<String, Integer>)\n         \
    \     Proxy.newProxyInstance(\n                  Map.class.getClassLoader(),\n\
    \                  new Class<?>[] {Map.class},\n                  handler);\n\
    map.put(\"one\", 1);\nmap.put(\"two\", 2);\nSystem.out.println(map);\nmap.clear();\n\
    ```\n列表 3.6: map 的日志方法。\n\n## 动态类的名称\n\n动态代理的类名是什么？例如，考虑列表 3.7 中的 `ISODateParser`\
    \ 接口，它解析 `yyyy-MM-dd` 格式的日期。这等同于图 7 中的 `Subject` 接口。\n\n```\n//:~ core/src/main/.../ch03/ISODateParser.java\n\
    /**\n * 解析 yyyy-MM-dd 格式的字符串并返回 LocalDate。\n */\npublic interface ISODateParser\
    \ {\n  LocalDate parse(String date) throws ParseException;\n}\n```\n列表 3.7: `ISODateParser`\
    \ 接口。\n\n我们创建一个动态代理并将类名打印到 `System.out`。\n\n```\n//:~ core/src/main/.../ch03/ProxyName.java\n\
    public class ProxyName {\n  public static void main(String... args) {\n    System.out.println(\n\
    \        Proxy.newProxyInstance(\n            ISODateParser.class.getClassLoader(),\n\
    \            new Class<?>[] {ISODateParser.class},\n            (proxy, method,\
    \ arguments) -> null\n        ).getClass()\n    );\n  }\n}\n```\n列表 3.8: `ProxyName`。\n\
    \n输出显示类名为 `com.sun.proxy.$Proxy0`。\n\n```\nclass com.sun.proxy.$Proxy0\n```\n\
    列表 3.9: `ProxyName` 输出。\n\n动态代理通常命名为 `$Proxy` 后跟数字。当所有接口都是公共的，包通常是 `com.sun.proxy`，但在你的操作系统和\
    \ JDK 上可能是另一个包。类名和包可能会随版本之间甚至运行之间变化。当我们从模块内部未导出的包创建动态代理时，包名会有不同。如果至少有一个接口是非公共的，代理类将位于该接口所在的包中。无法为位于不同包的非公共接口创建动态代理。\n\
    \n## 析 `$Proxy0`\n\n我们可以通过系统属性 `-Djdk.proxy.ProxyGenerator.saveGeneratedFiles=true`（Java\
    \ 9+）或较早版本 Java 中的 `-Dsun.misc.ProxyGenerator.saveGeneratedFiles=true` 将生成的代理类转储到当前工作目录。\n\
    \n例如，列表 3.10 显示了从 `ISODateParser` 接口生成的动态代理。我们可以看到 `$Proxy0` 派自 `java.lang.reflect.Proxy`，后者存储了\
    \ `InvocationHandler` 实例 `h`。公共接口方法以及 `java.lang.Object` 的 `hashCode()`、`equals()`\
    \ 和 `toString()` 都有关联的静态字段 `Method` 对象。这些字段在类加载时在静态初始化块中初始化。在每个方法实现中，代理实例、`Method`\
    \ 实例和包含参数的数组被传递给 `InvocationHandler`。例如，查看 `parse(String)` 的实现。\n\n"
- fmt: "\n```java\npackage com.sun.proxy;\n\n//:~ core/src/main/.../ch03/generated/$Proxy0.java\n\
    import eu.javaspecialists.books.dynamicproxies.ch03.*;\n\nimport java.lang.reflect.*;\n\
    import java.text.*;\nimport java.time.*;\n\npublic final class $Proxy0 extends\
