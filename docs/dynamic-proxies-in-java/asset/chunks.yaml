  trans: "\n现在让我们来看看如何使用动态代理来构建相同的用例。在这种例中，我们创建了一个 `AppendableFlushableCloseable`\
    \ 接口，它继承了 `Appendable`、`Flushable` 和 `Closeable` 三个接口，以及 `BaseComponent<E>`。我们还提供了一个\
    \ `getReducers()` 方法，以便于使用我们的 `Proxies` Fac 面类构建组合对象。`append()` 方法应该返回当前对象的指针——换句话，即\
    \ `this`。在 `InvocationHandler` 内部，指向当前代理对象的指针就是 `proxy` 参数。通过将 `PROXY_INSTANCE_REDUCER`\
    \ 指定为 `Reducer`，我们告诉 `CompositeHandler` 在子节点上的所有方法都调用完毕后返回 `proxy` 参数。\n\n```java\n\
    //:~ core/src/main/.../ch06/appendables/AppendableFlushableCloseable.java\npublic\
    \ interface AppendableFlushableCloseable<E extends\n                         \
    \                           Appendable\n                                     \
    \               & Flushable\n                                                \
    \    & Closeable)\n    extends Appendable, Flushable, Closeable, BaseComponent<E>\
    \ {\n  static Map<MethodKey, Reducer> getReducers() {\n    return Map.of(\n  \
    \      new MethodKey(Appendable.class, \"append\",\n            CharSequence.class),\n\
    \        Reducer.PROXY_INSTANCE_REDUCER,\n        new MethodKey(Appendable.class,\
    \ \"append\",\n            CharSequence.class, int.class, int.class),\n      \
    \  Reducer.PROXY_INSTANCE_REDUCER,\n        new MethodKey(Appendable.class, \"\
    append\", char.class),\n        Reducer.PROXY_INSTANCE_REDUCER);\n  }\n}\n```\n\
    \n列表 6.20: `AppendableFlushableCloseable`。\n\n我们可以使用 `AppendableFlushableCloseable`\
    \ 作为接口来创建动态 tee 组合对象。我们的示例代码与列表 6.18 中的代码几乎相同，只是我们不需要手动构建 `TeeAppendable`。\n\n\
    ```java\n//:~ core/src/main/.../ch06/appendables/AppendableDynamicDemo.java\n\
    var tee = Proxies.compose(AppendableFlushableCloseable.class,\n    AppendableFlushableCloseable.getReducers(),\n\
    \    Appendable.class, Flushable.class, Closeable.class\n);\nvar sw = new StringWriter();\n\
    tee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"output.txt\"\
    ));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\nout.println(\"\
    Hello World Dynamic\");\nout.flush();\n\ntee.append(\"TestingAppenderDynamic\"\
    )\n    .append('\\n')\n    .append(\"Does this work?\")\n    .append('\\n');\n\
    tee.flush();\n\nSystem.out.println(\"sw = \" + sw);\n```\n\n列表 6.21: `AppendableDynamicDemo`。\n\
    \n`AppendableDynamicDemo` 的输出在列表 6.22。\n\n```\nHello World Dynamic\nTestingAppenderDynamic\n\
    Does this work?\nsw = Hello World Dynamic\nTestingAppenderDynamic\nDoes this work?\n\
    ```\n\n列表 6.22: `AppendableDynamicDemo` 输出。\n\n# 结论\n\n我们已经看到了 GoF 中四种相似模式的动态代理实现：代理、装饰器、适配器和组合器。\n\
    \n我们还看到了如何实现与手工编写代码相似的性能。\n\n在理解动态代理的工作原理以及如何将其应用到个人项目时，可能会存在额外的认知负担。但一旦我们投入了这些学习，就能用相对较少的代码创建许多功能。我们掌握了一项新的\
    \ Java 超能力，这种能力在过去的二十年里被无数框架所使用。\n\n学习的一种好方法是逐步阅读代码，所有代码都可以在我的 [GitHub 仓库](https://github.com/kabutz/dynamic-proxies-samples)\
    \ 中找到。我并没有刻意在代码中留 Bug，尽管声称这样做很有诱惑力，我希望你能加入我们 500 多名审查者的行列，寻找并报告 Bug。\n\n最后，JavaSpecialists\
    \ 创建了一个关于动态代理的[自学课程](https://javaspecialists.teachable.com/p/dynamic-proxies-in-java)，我在课程中将为你讲解每一个章节。每章都有需要解决的练习，以及模型答案。该课程也是提问和与其他学生交流的好地方。\n\
    \n感谢阅读。\n\n— Heinz M. Kabutz 博士\n\n# 关于作者\n\nHeinz M. Kabutz 博士 (@heinzkabutz)\
    \ 是略带幽默且相当实用的 [The Java Specialists’ Newsletter](https://www.javaspecialists.eu)\
    \ 的作者。他随时欢迎通过 heinz@javaspecialists.eu 接收邮件。\n\n"
