  trans: "\n\n```java\n//:~ core/src/main/.../util/VTable.java\n/**\n * VTable 的作用是在接口方法与接收者类方法之间\n\
    \ * 构建一个快速映射器。为了减少对象的创建，\n * 我们避免使用普通的 HashMap，而是选择将\n * 所有元素存储在等大小的数组中。我们还尝试\n\
    \ * 通过方法名 + 参数数量进行哈希处理来\n * 减少表中的冲突。此外，我们会记录某个名称\n * 在表中是否是唯一的。如果是，我们就不再检查\n *\
    \ 参数是否匹配。\n * <p>\n * 从性能角度来说，最重要的方法是\n * lookup() 和 lookupDefaultMethod()。\n\
    \ */\npublic final class VTable {\n  private final Method[] entries;\n  private\
    \ final Class<?>[][] paramTypes;\n  private final boolean[] distinctName;\n  private\
    \ final MethodHandle[] defaultMethods;\n  private final int size;\n  private final\
    \ int mask;\n\n  /**\n   * 根据方法集合构建 VTable。\n   * 此构造函数的输入是在 Builder\n   * 类中创建的。\n\
    \   *\n   * @param methods               所有需要包含在\n   *                       \
    \       此 VTable 中的方法\n   * @param distinctMethodNames   未被重载的\n   *         \
    \                     方法的名称\n   * @param includeDefaultMethods 是否想要包含\n   *  \
    \                            接口的默认\n   *                              方法\n   */\n\
    \  private VTable(Collection<Method> methods,\n                 Set<String> distinctMethodNames,\n\
    \                 boolean includeDefaultMethods) {\n    this.size = methods.size();\n\
    \    mask = Math.max(\n        (-1 >>> Integer.numberOfLeadingZeros(size * 4 -\
    \ 1)),\n        127);\n    entries = new Method[mask + 1];\n    paramTypes = new\
    \ Class<?>[entries.length][];\n    distinctName = new boolean[entries.length];\n\
    \    defaultMethods = new MethodHandle[entries.length];\n    for (var method :\
    \ methods) {\n      put(method,\n          distinctMethodNames.contains(method.getName()),\n\
    \          includeDefaultMethods);\n    }\n    methods.forEach(MethodTurboBooster::boost);\n\
    \  }\n\n  /**\n   * 在 VTable 中查找方法。如果未找到则\n   * 返回 null。\n   */\n  public Method\
    \ lookup(Method method) {\n    int index = findIndex(method);\n    return index\
    \ < 0 ? null : entries[index];\n  }\n\n  /**\n   * 在 VTable 中查找接口默认方法。\n   * 如果未找到则返回\
    \ null。\n   */\n  public MethodHandle lookupDefaultMethod(Method method) {\n \
    \   int index = findIndex(method);\n    return index < 0 ? null : defaultMethods[index];\n\
    \  }\n\n  /**\n   * 返回 VTable 中的条目数量。\n   * 大小不会改变，并在构造时固定。\n   */\n  public int\
    \ size() {\n    return size;\n  }\n\n  /**\n   * 返回来自此 VTable 的 Method 对象流。\n\
    \   * 由 ChainedInvocationHandler 使用，以验证\n   * 目标中的所有方法是否已被不同的 VTables\n   * 覆盖。\n\
    \   */\n  public Stream<Method> stream() {\n    return Stream.of(entries).filter(Objects::nonNull);\n\
    \  }\n\n  /**\n   * 返回此 VTable 中我们拥有接口默认方法的\n   * Method 对象流。由 ChainedInvocationHandler\
    \ 使用\n   * 以验证目标中的所有方法是否已被\n   * 不同的 VTables 覆盖。\n   */\n  public Stream<Method>\
    \ streamDefaultMethods() {\n    // Heinz: 这是我第一次找到 iterate() 的用例\n    return IntStream.iterate(0,\
    \ i -> i < entries.length,\n        i -> i + 1)\n               .filter(i -> defaultMethods[i]\
    \ != null)\n               .mapToObj(i -> entries[i]);\n  }\n\n  /**\n   * 为条目寻找一个空位置，然后将值\n\
    \   * 插入 entries、paramTypes、distinctName 数组中，\n   * 可选的 defaultMethods。不允许重复方法，\n\
    \   * 并将抛出 IllegalArgumentException。\n   */\n  private void put(Method method,\
    \ boolean distinct,\n                   boolean includeDefaultMethods) {\n   \
    \ int index = findIndex(method);\n    if (index >= 0)\n      throw new IllegalArgumentException(\n\
    \          \"Duplicate method found: \" + new MethodKey(method));\n    index =\
    \ ~index; // 再次翻转位寻找空隙\n    entries[index] = method;\n    paramTypes[index] =\
    \ ParameterTypesFetcher.get(method);\n    distinctName[index] = distinct;\n  \
    \  if (includeDefaultMethods && method.isDefault()) {\n      defaultMethods[index]\
    \ = getDefaultMethodHandle(method);\n    }\n  }\n\n  /**\n   * 返回接口默认方法的 MethodHandle，\n\
    \   * 如果该方法已声明且该模块对我们的模块开放；\n   * 否则返回 null。\n   */\n  private MethodHandle getDefaultMethodHandle(Method\
    \ method) {\n    try {\n      Class<?> target = method.getDeclaringClass();\n\
    \      if (isTargetClassInOpenModule(target)) {\n        // Thanks Thomas Darimont\
    \ 提供的想法\n        MethodHandles.Lookup lookup = MethodHandles.lookup();\n     \
    \   return MethodHandles.privateLookupIn(target, lookup)\n                   .unreflectSpecial(method,\
    \ target)\n                   // asSpreader() 避免了调用 invokeArguments()\n      \
    \             // 速度快了 10 倍\n                   .asSpreader(Object[].class,\n \
    \                      method.getParameterCount());\n      }\n      return null;\n\
    \    } catch (IllegalAccessException) {\n      throw new IllegalArgumentException(e);\n\
    \    }\n  }\n\n  /**\n   * 如果方法在开放模块中则返回 true；\n   * 否则返回 false。例如，如果我们的 VTable\n\
    \   * 在 javaspecialists.books.dynamicproxies 内部且\n   * 使用 java.util 中的默认方法，我们需要\n\
    \   * 显式打开该模块。\n   */\n  private boolean isTargetClassInOpenModule(Class<?> target)\
    \ {\n    Module targetModule = target.getModule();\n    String targetPackage =\
    \ target.getPackageName();\n    Module ourModule = VTable.class.getModule();\n\
    \    return targetModule.isOpen(targetPackage, ourModule);\n  }\n\n  /**\n   *\
    \ 返回方法的索引；未找到返回负值。\n   * 一旦找到同名方法，我们会检查该方法\n   * 是否重载。如果没有，则返回 offset。\n   */\n\
    \  private int findIndex(Method method) {\n    int offset = offset(method);\n\
    \    Class<?>[] methodTypes = null;\n    Method match;\n    while ((match = entries[offset])\
    \ != null) {\n      if (match.getName() == method.getName()) {\n        if (distinctName[offset])\
    \ return offset;\n        if (methodTypes == null)\n          methodTypes = ParameterTypesFetcher.get(method);\n\
    \        if (matches(paramTypes[offset], methodTypes))\n          return offset;\n\
    \      }\n      offset = (offset + 1) & mask;\n    }\n    // 未找到方法，返回负值\n    //\
    \ 通过再次翻转位，我们知道数组中第一个可用索引\n    return ~offset;\n  }\n\n  /**\n   * 根据名称和参数数量返回方法的\n\
    \   *初始 offset。\n   */\n  private int offset(Method method) {\n    return (method.getName().hashCode()\
    \ +\n                method.getParameterCount()) & mask;\n  }\n\n  /**\n   * 参数类型的快速数组比较。\n\
    \   * 类可以使用 == 代替 equals() 进行比较。\n   */\n  private boolean matches(Class<?>[]\
    \ types1, Class<?>[] types2) {\n    if (types1.length != types2.length) return\
    \ false;\n    for (int i = 0; i < types1.length; i++) {\n      if (types1[i] !=\
    \ types2[i]) return false;\n    }\n    return true;\n  }\n\n  public static class\
    \ Builder {\n    private static final BinaryOperator<Method> MOST_SPECIFIC =\n\
    \        (method1, method2) -> {\n          var r1 = method1.getReturnType();\n\
    \          var r2 = method2.getReturnType();\n          if (r2.isAssignableFrom(r1))\
    \ {\n            return method1;\n          }\n          if (r1.isAssignableFrom(r2))\
    \ {\n            return method2;\n          } else {\n            throw new IllegalStateException(\n\
    \                method1 + \" and \" + method2 +\n                    \" have\
    \ incompatible return types\");\n          }\n        };\n    private static final\
    \ Method[] OBJECT_METHODS;\n    static {\n      try {\n        OBJECT_METHODS\
    \ = new Method[] {\n            Object.class.getMethod(\"toString\"),\n      \
    \      Object.class.getMethod(\"hashCode\"),\n            Object.class.getMethod(\"\
    equals\", Object.class),\n        };\n      } catch (NoSuchMethodException e)\
    \ {\n        throw new Error(e);\n      }\n    }\n    private final Map<MethodKey,\
    \ Method> receiverClassMap;\n    private List<Class<?>> targetInterfaces = new\
    \ ArrayList<>();\n    private boolean includeObjectMethods = true;\n    private\
    \ boolean includeDefaultMethods = false;\n    private boolean ignoreReturnTypes\
    \ = false;\n\n    /**\n     * @param receiver 接收实际方法调用的类\n     *             \
    \    不需要与动态代理接口相关。\n     */\n    public Builder(Class<?> receiver) {\n      receiverClassMap\
    \ = createPublicMethodMap(receiver);\n    }\n\n    /**\n     * equals(Object),\
    \ hashCode() 和 toString() 方法\n     * 不会被添加到 VTable。\n     */\n    public Builder\
    \ excludeObjectMethods() {\n      this.includeObjectMethods = false;\n      return\
    \ this;\n    }\n\n    public Builder includeDefaultMethods() {\n      this.includeDefaultMethods\
    \ = true;\n      return this;\n    }\n\n    public Builder ignoreReturnTypes()\
    \ {\n      this.ignoreReturnTypes = true;\n      return this;\n    }\n\n    /**\n\
    \     * 我们希望映射映射的目标接口之一。\n     */\n    public Builder addTargetInterface(Class<?>\
    \ targetIntf) {\n      if (!targetIntf.isInterface())\n        throw new IllegalArgumentException(\n\
    \            targetIntf.getCanonicalName() +\n                \" is not an interface\"\
    );\n      this.targetInterfaces.add(targetIntf);\n      return this;\n    }\n\n\
    \    public VTable build() {\n      // 构建来自目标接口的所有方法集合，\n      // 以及三个包含的默认方法。\n\
    \      Collection<Method> allMethods =\n          targetInterfaces.stream()\n\
    \              .flatMap(clazz -> Stream.of(clazz))\n              .filter(Objects::nonNull)\n\
    \              .collect(Collectors.toList());\n      if (includeObjectMethods)\
    \ {\n        for (Method method : OBJECT_METHODS) {\n          allMethods.add(method);\n\
    \        }\n      }\n      // 找到所有名称唯一的方法，\n      // 因此加速匹配。\n      Set<String>\
    \ distinctMethodNames =\n          allMethods.stream()\n              .collect(Collectors.groupingBy(Method::getName),\n\
    \                  Collectors.counting()))\n              .keySet(); // 简化逻辑\n\
    \      // 最后我们只包含那些与目标方法\n      //set 的方法。\n      Collection<Method> matchedMethods\
    \ =\n          allMethods.stream()\n              .map(this::filterReturnType)\n\
    \              .filter(Objects::nonNull)\n              .collect(Collectors.toList());\n\
    \n      return new VTable(matchedMethods, distinctMethodNames,\n          includeDefaultMethods);\n\
    \    }\n  }\n}\n```\n"
- fmt: "\nListing 4.16: `VTable` and `VTable.Builder`.\n\n### `VTables` façade\n\n\
    The most common use cases of `VTable` is to map methods between unrelated interfaces\
    \ and to map default interface methods. Our `VTables` façade contains static factory\
    \ methods to construct such `VTable` instances.\n\n```\n//:~ core/src/main/.../util/VTables.java\n\
    public final class VTables {\n  private VTables() {}\n\n  public static VTable\
    \ newDefaultMethodVTable(Class<?> clazz) {\n    return newVTableBuilder(clazz,\
    \ clazz)\n               .excludeObjectMethods()\n               .includeDefaultMethods()\n\
    \               .build();\n  }\n\n  public static VTable newVTable(Class<?> receiver,\n\
    \                                 Class<?>... targets) {\n    return newVTableBuilder(receiver,\
    \ targets).build();\n  }\n\n  public static VTable newVTableExcludingObjectMethods(\n\
    \      Class<?> receiver, Class<?>... targets) {\n    return newVTableBuilder(receiver,\
    \ targets)\n               .excludeObjectMethods()\n               .build();\n\
    \  }\n\n  private static VTable.Builder newVTableBuilder(\n      Class<?> receiver,\
    \ Class<?>... targets) {\n    VTable.Builder builder = new VTable.Builder(receiver);\n\
    \    for (Class<?> target : targets) {\n      builder.addTargetInterface(target);\n\
    \    }\n    return builder;\n  }\n}\n```\n\nListing 4.17: `VTables` façade.\n\n\
    For example, to make a `VTable` between `List` and `ArrayDeque`, we could simply\
    \ write what is in Listing 4.18.\n\n```\n//:~ core/src/test/.../util/VTablesDemo.java\n\
    public class VTablesDemo {\n  public static void main(String... args) {\n    VTable\
    \ vt = VTables.newVTable(ArrayDeque.class, List.class);\n    vt.stream().forEach(System.out::println);\n\
    \  }\n}\n```\n\nListing 4.18: `VTablesDemo`.\n\nThe output shows all the methods\
    \ in `ArrayDeque` that also appear in `List`.\n\n```\npublic boolean java.util.ArrayDeque.add(java.lang.Object)\n\
    public boolean java.util.ArrayDeque.isEmpty()\npublic int java.util.ArrayDeque.size()\n\
    public boolean java.util.ArrayDeque.contains(java.lang.Object)\npublic boolean\
    \ java.util.AbstractCollection.containsAll(java.util.Collection)\npublic boolean\
    \ java.util.ArrayDeque.remove(java.lang.Object)\npublic java.lang.Object[] java.util.ArrayDeque.toArray()\n\
    public void java.util.ArrayDeque.clear()\netc.\n```\n\nListing 4.19: Output from\
    \ `VTablesDemo`.\n\n### `ChainedInvocationHandler`\n\nWe briefly introduced the\
    \ chain-of-responsibility pattern in Chapter 1. We also mentioned that it has\
    \ a known weakness: a request might drop off the end of the chain when no suitable\
    \ handler is found.\n\nOur `ChainedInvocationHandler` is the root handler in the\
    \ pattern. Besides passing requests to the next handler in the chain, it also\
    \ throws an `AssertionError` if no suitable method is discovered. Users of this\
    \ class are encouraged to call `checkAllMethodsAreHandled(Class<?>… targets)`\
    \ once the chain is set up, in order to verify that the chain can handle all the\
    \ methods in the target interface.\n\n```\n//:~ core/src/main/.../util/chain/ChainedInvocationHandler.java\n\
    /**\n * Chain of responsibility design pattern for invocation\n * handlers.  \
    \ The invoke method by default passes the call to\n * the next element in the\
    \ chain.  If no one can handle the\n * call, then that is an AssertionError. \
    \ Once the full chain\n * is constructed, we should check that all methods of\
    \ the\n * target interface can be handled by our chain by calling\n * #checkAllMethodsAreHandled(targets).\n\
    \ */\npublic abstract class ChainedInvocationHandler\n    implements InvocationHandler\
    \ {\n  private final ChainedInvocationHandler next;\n\n  public ChainedInvocationHandler(\n\
    \      ChainedInvocationHandler next) {\n    this.next = next;\n  }\n\n  @Override\n\
    \  public Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    if (next != null) return next.invoke(proxy, method,\
    \ args);\n    // we cannot allow a method to not be handled\n    throw new AssertionError(\n\
    \        \"No InvocationHandler for \" + method);\n  }\n\n  /**\n   * Should be\
    \ called on the first link of the chain once\n   * everything has been set up.\
    \ Throws IllegalArgumentException\n   * if any methods are not handled by our\
    \ chain.\n   *\n   * @throws UnhandledMethodException if any method in the\n \
    \  *                                  targets is not handled\n   *           \
    \                       by the chain\n   * @throws IllegalArgumentException if\
    \ one of the targets is\n   *                                  not an interface\n\
    \   */\n  public void checkAllMethodsAreHandled(Class<?>... targets) {\n     \
    \   if (Stream.of(targets)\n            .anyMatch(Predicate.not(Class::isInterface)))\n\
    \          throw new IllegalArgumentException(\n              \"target classes\
    \ must be interfaces\");\n    Collection<Method> unhandled =\n        findUnhandledMethods(targets)\n\
    \            .collect(Collectors.toList());\n    if (!unhandled.isEmpty())\n \
    \     throw new UnhandledMethodException(unhandled);\n  }\n\n  /**\n   * Last\
    \ handler in the chain returns a Stream containing all\n   * the methods in the\
    \ given target interfaces.  Subclasses\n   * should call super.findUnhandledMethods(targets)\
    \ and then\n   * add filters to remove methods that are handled by their\n   *\
    \ handlers.\n   */\n  protected Stream<Method> findUnhandledMethods(\n      Class<?>...\
    \ targets) {\n    if (next != null) return next.findUnhandledMethods(targets);\n\
    \    return Stream.of(targets)\n               .map(Class::getMethods)\n     \
    \          .flatMap(Stream::of)\n               .filter(\n                   m\
    \ -> !Modifier.isStatic(m.getModifiers()));\n  }\n}\n```\n\nListing 4.20: `ChainedInvocationHandler`.\n\
    \nWe also define a new exception called `UnhandledMethodException`, shown in Listing\
    \ 4.21. It is a special type of `IllegalArgumentException` that can only be instantiated\
    \ within the `chain` package.\n\n```\n//:~ core/src/main/.../util/chain/UnhandledMethodException.java\n\
    public final class UnhandledMethodException\n    extends IllegalArgumentException\
    \ {\n  private final Collection<Method> unhandled;\n  UnhandledMethodException(Collection<Method>\
    \ unhandled) {\n    super(\"Unhandled methods: \" + unhandled);\n    this.unhandled\
    \ = List.copyOf(unhandled);\n  }\n  public Collection<Method> getUnhandled() {\n\
    \    return unhandled;\n  }\n}\n```\n\nListing 4.21: `UnhandledMethodException`.\n\
    \nOur `VTableHandler` takes as parameter the `receiver` object on which to invoke\
    \ the methods, the `vtable` used to match methods from our target interface to\
    \ our receiver class, and the `next` link in the chain.\n\n```\n//:~ core/src/main/.../util/chain/VTableHandler.java\n\
    public final class VTableHandler\n    extends ChainedInvocationHandler {\n  private\
    \ final VTable vtable;\n  private final Object receiver;\n  public VTableHandler(Object\
    \ receiver, VTable vtable,\n                       ChainedInvocationHandler next)\
    \ {\n    super(next);\n    this.receiver = Objects.requireNonNull(receiver);\n\
    \    this.vtable = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public\
    \ Object invoke(Object proxy, Method method,\n                       Object[]\
    \ args) throws Throwable {\n    Method match = vtable.lookup(method);\n    if\
    \ (match != null) return match.invoke(receiver, args);\n    return super.invoke(proxy,\
    \ method, args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
    \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
    \               .filter(method -> vtable.lookup(method) == null);\n  }\n}\n```\n\
    \nListing 4.22: `VTableHandler`.\n"
