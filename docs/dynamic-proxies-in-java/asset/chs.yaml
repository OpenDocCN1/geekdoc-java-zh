  * Ronak Patel\n\n特别感谢 [Grails Framework](https://grails.org/) 和 [Micronaut](https://micronaut.io/)\
  \ 的创建者 Graeme Rocher，他阅读了书的初稿并提供了宝反馈。\n\n另一个特别感谢 Brian Goetz，我的老朋友兼畅销作家，他出色的建议推迟了这本书的发布，因为我不得不加入它们。\n\
  \nKirk Pepperdine 十年来一直是我在 Java 性能方面的导师，并在一起查看某些基准测试结果方面非常有帮助。\n\n我使用 Java 平台模块系统\
