  \n非常感谢。因为你们乐意帮助，这本书变得好多了。\n\nSven Ruppert 和我在 2015 年出版了一本关于相同主题的书，尽管是用德语。感谢 Sven\
  \ 向我介绍了作者这个迷人的世界。\n\n非常感谢 InfoQ 的编辑 Lawrence Nyveen 的帮助。\n\n# 前言\n\n现在是 2000 年。我们的行业度过了千年虫危机。“智能手机”也能告诉时间。Java\
  \ 是一门没有泛型、Lambda 表达式或类型推断的语言。部署我们的 EAR 文件需要长时间。EAR 文件？是的，Spring 框架还有很长的路要走。程序员使用\
  \ RMI 和 CORBA。\n\n工具生成大量的底层代码。例如，远程方法调用 (RMI) 使用 [`rmic`](https://docs.oracle.com/en/java/javase/13/docs/specs/man/rmic.html)\
  \ 工具生成存根和骨架类以支持代理。（事实上，`rmic` 在现代发行版中仍然存在于 JDK/bin 目录中。）2000 年 5 月，Sun 发布了 Java\
  \ 1.3 —— 以及动态代理。不需要单独的构建步骤，通过指定要实现的接口即可动态创建新类。这些动态类的所有方法调用都路由到单个 `InvocationHandler`。底层代码使用动态代理在内存中创建存根和骨架类。\n\
  \n## 大收益\n\n动态代理使代码更容易维护。与其手工编写大量类，我们编写一个动态代理。这是“不要重复”原则的加强版。\n\n例如，一家公司用一个动态代理替换了\
  \ 60 万条生成的代码语句。他们编写了一个神奇工具将他们的专有语言转换为 Java。他们的业务系统有数百个实体。他们的工具将每个实体转换为几个 Java 类。然而，在初始生成之后，程序员必须手动维护这些代码。维护工作既枯燥又容易出错。一个动态代理取代了这一切。\n\
  \n\n\n\n\n像 `Gradle`这样的构建工具对模型、任务、操作和监听器使用了代理。示例包括 `BuildOperationListener`、`StandardOutputListener`\
  \ 和 `ProgressListener`。Maven 通过 `MavenPluginManager` 和 `CircularDependencyProxy`\
  \ 使用它们进行插件管理。\n\n`JBoss` 和 `Spring Framework` 等应用容器使用代理进行依赖注入。示例包括 `@Inject`、`@Qualifier`、`@Autowired`\
  \ 和 `@Bean`。作用域生命周期管理也使用了动态代理。\n\n在这些容器中使用 `JPA` 进行持久化管理使用了代理——例如 `@Entity`、`@Id`、`@GeneratedValue`、`@Table`\
  \ 和 `@JoinColumn`。在 Spring 中，我们可以通过扩展 `Repository` 接口派生自定义仓库。在后台，一个多接口动态装饰代理负责处理这些细节。\n\
  \n如果我们选择 `Hibernate` 作为 ORM，那么代理会包围 `HibernateEntityManagerFactory`、`HibernateEntityManager`\
  \ 和 `EntityManagerProxy`。Spring 的 `ConnectionProxy` 是 `java.sql.Connection` 的动态代理。\n\
  \n同样在 Spring 中，`InitBinder` 的动态代理将 HTTP 表单字段绑定到数据模型。我们每天使用的许多框架：`Spring Framework`、`WildFly`、`NetBeans\
  \ Platform`、`Apache Tomcat` 和 `OpenJDK` 等，底层都使用了动态代理。\n\n## 等一下……\n\n动态代理并非最好的工具。虽然非常方便，但与直接方法调用相比，动态代理上的方法调用性能开销会有略微增加。在本书中，我们将学习如何减少使用动态代理对性能的影响。\n\
  \n## 我们将学习什么？\n\n在某些情况下，动态代理是特定问题的完美选择。通过深入研究它们并在各种场景中观察它们，我们将学会识别哪些地方使用它们是合理的。我们将学会识别它们的优缺点。\n\
  \n这使得使用动态代理的系统调试变得更加容易。\n\n## 简单来说？\n\n即使是像这样的微型书籍也需要几天时间来阅读和完全理解。为了让这些材料更易于获取，我创建了一个[自学课程](https://javaspecialists.teachable.com/p/dynamic-proxies-in-java)，对每个构建模块进行了详细解释。课程每个章节都有练习题，并附有模型答案。\n\
  \n## Java 版本\n\n我们使用 Java 11 LTS 编译了本书的代码。在使代码更清晰的地方，我们对局部变量使用了 Java 10 的 `var`\
  \ 关键字。\n\n虽然我们在书中使用了浅反射，但尽量避免使用深反射。Mark Reinhold 在 OpenJDK [JPMS (JSR 376) 专家组邮件列表](http://mail.openjdk.java.net/pipermail/jpms-spec-experts/2016-October/000431.html)上定义了这些术语。\n\
  \n*   **浅反射访问**是通过核心反射 API (`java.lang.reflect`) 在运行时进行的访问，而不使用 `setAccessible`。只能访问已导出包中的公共元素。\n\
  *   **深反射访问**是在运行时通过核心反射 API 进行访问，并使用 `setAccessible` 方法来进入非公共元素。任何包中的任何元素，无论是否公共，无论是否已导出，都可以访问。深反射访问包含了浅反射访问。\n\
  \n## 玩得愉快！\n\n我希望你会喜欢这本书，并发现它既实用又能激发智力。也许有时还会有趣。\n\n尝试书中的概念；在旁边放上一杯热的 java 效果最好。在你的\
  \ IDE 中尝试这些概念。书中的所有代码示例均可在 [`github.com/kabutz/dynamic-proxies-samples`](https://github.com/kabutz/dynamic-proxies-samples)\
  \ 获得。\n\nHeinz M. Kabutz 博士\n\n# 设计模式的亲戚\n\n建筑师是规划、设计和审查建筑建造的人。他们的成品本身很难改变，因为从字面上讲，它是浇在混凝土里的。软件一直在变化，即使在安装多年后也是如此，因此，建筑师克里斯托弗·亚历山德（Christopher\
  \ Alexander）1977 年的著作 [*A Pattern Language: Towns, Buildings, Construction*](https://www.goodreads.com/en/book/show/79766.A_Pattern_Language)\
  \ 对软件行业的影响之令人惊讶。亚历山德的书关于建筑的永恒方式。他提炼了历史上反复出现的栖息模式——例如第 159 号模式，被称为“每个房间两侧的光线”。由于其描述性的名称，我们可以很容易地视觉化这种模式。\n\
  \n在 20 世纪 90 年代，软件行业采纳了亚历山德提出的原理并应用于软件设计。面向对象设计模式的概念在 Erich Gamma、Richard Helm、Ralph\
  \ Johnson 和 John Vlissides 编写的 [*Design Patterns: Elements of Reusable Object-Oriented\
  \ Software*](https://www.oreilly.com/library/view/design-patterns-elements/0201633612/)\
  \ 中被永化。这四位作者通常被称为“四人帮”（Gang of Four）或简单称为 GoF。\n\n模式最重要的标识符之一是它的名称。在《Timeless Way\
  \ of Building》中，亚历山德写道：“寻找名称是发明或发现模式过程的基本组成部分。只要模式有一个很弱的名称，就意味着它不是一个清晰的概念，你不能让我去制造‘一个’。”\n\
  \n设计模式同样为常见的编码技术命名，使得意图的传达更加容易。了解模式有助于我们更快地理解现有设计。遗憾的是，GoF 的模式名称没有亚历山德的那么丰富。“像 wrapper（包装器）这样的名称可能意味着任何意思。因此，我们也依赖*意图*来清晰地识别每个模式。\n\
  \n在书中，我们将主要关注四个模式：`proxy`、`adapter`、`decorator` 和 `composite`。它们都是结构性模式，这意味着它们不描述行为或对象的创建，而是类和对象如何相互作用。\n\
  \n我们的四个模式具有类似的类层次结构，因此只需一点努力就可以使用动态代理来实现它们。它们的外观如此相似，以至于我们可以称之为“模式亲戚”。\n\n## 代理模式\n\
  \n意图：“为对象提供代理或占位符以控制对其的访问。”（GoF 1994, p.207）\n\n在代理模式中，客户端通过替代品（代理）进行通信，就像腹语木偶（如\
  \ *Trailer Boys* 中的 Conky）。\n\n![ProxyViloquist](img/ProxyViloquist.jpg)\n\n标准的\
  \ GoF 结构如图 1 所示。`Client` 使用 `Subject`，它可以是 `RealSubject` 或是 `Proxy`。`Client` 不知道，不在乎。在标准的\
  \ GoF 结构中，`Proxy` 指向 `RealSubject`。代理结构的一种变体是让 `Proxy` 指向 `Subject`。这允许我们实现级联代理。我们将在下一章末尾详细检查级联代理。\n\
  \n![ProxyStructure](img/ProxyStructure.png)\n\n图 1 代理设计模式的结构。\n\n代理有几种用例：\n\n* \
  \  **虚拟代理**按需创建昂贵对象。示例是 Spring Framework 中的 `LazyConnectionDataSourceProxy`，它在创建第一个\
  \ `Statement` 时延迟创建真实的 JDBC `DataSource`。\n*   **远程代理**为位于不同地址空间（例如远程机器上）的对象提供本地表示。注意，远程代理没有远程对象的真实指针，而是通过\
  \ RPC、RMI、Thrift、ProtoBuf、gRPC、REST、HTTP、TCP/UDP 或不同的远程调用机制调用方法。\n*   **保护代理**控制对原始对象的访问。这可能是为了访问控制或线程安全。示例是\
  \ `Collections.synchronizedCollection()`，它返回一个受竞态条件保护的新 `Collection`。\n\n## 适配器模式\n\
  \n\n\n\n\n意图：“将一个类的接口转换为客户端期望的另一个接口。适配器允许那些因接口不兼容而无法工作的类共同工作。” (GoF 1994, p. 139)\n\
  \n适配器模式的目标是让对象协同工作，即使它们的接口不兼容。它是模式中的“外交官”。适配器模式既可以实现为使用组合的对象适配器，也可以实现为使用继承的类适配器。\n\
  \n在图 2 中，`Adapter` 实现了 `Target` 接口，并将请求委托给我们想要适配的类，在本例中为 `Adaptee`。由于我们的被适配对象是适配器内部的一个对象，我们称之为“对象适配器”。对象适配器使用组合来适配\
  \ `Adaptee`。\n\n![ObjectAdapterStructure](img/ObjectAdapterStructure.png)\n\n图 2。对象适配器设计模式的结构。\n\
  \nJava 中对象适配器的示例是 `InputStreamReader`，它将 `InputStream` 适配为 `Reader`。\n\n另一种较少使用的适配器形式出现在我们的\
  \ `Adapter` 继承 `Adaptee` 并实现 `Target` 接口时。由于被适配对象是我们的适配器的父类，我们称之为“类适配器”，如图 3 所示。类适配器使用继承来适配\
  \ `Adaptee`。\n\n![ClassAdapterStructure](img/ClassAdapterStructure.png)\n\n图 3。类适配器设计模式的结构。\n\
  \n类适配器的一个优点是它更容易修改被适配对象的部分。遗憾的是，权衡是适配一个对象层次结构变得更加困难。在后面的章节中，我们将看到如何使用动态代理来获得类适配器的扩展性和对象适配器的灵活性。\n\
  \n### 对象适配器与代理有什么相似之处？\n\n在代理模式中，`RealSubject` 实现了 `Subject` 接口。如果我们去掉这种继承关系，它还是代理吗，还是会变成适配器？同样，如果一个适配器中的\
  \ `Adaptee` 恰好实现了 `Target`，那么该模式会变成代理吗？\n\n这取决于意图。例如，在 EJB 的话 bean 中，实现 bean 并不直接继承远程接口，因为这些方法会抛出不兼容的异常。远程接口会抛出\
  \ `RemoteException`，而实现 bean 会抛出业务异常。\n\n对象适配器的结构与代理相似。在两种情况下，客户端都使用顶层接口 `Target`\
  \ 或 `Subject`。我们在 `Adapter` 或 `Proxy` 中拥有该的实现。\n\n## 装饰器模式\n\n意图：“动态地给对象附加额外的责任。装饰器为通过子类扩展功能提供了灵活的替代。”\
  \ (GoF 1994, p. 175)\n\n![DecoratorStructure](img/DecoratorStructure.png)\n\n图 4。装饰器设计模式的结构。\n\
  \n当我们想要向一个类添加新方法时，最简单的方法是将它们添加到子类中。然而，这可能导致笨拙的类层次结构，并由于无法扩展多个父类而面临代码重复的风险。更好的方法是装饰器模式，通过这种模式我们用更丰富的类来装饰对象，从而“附加额外的责任”。我们还可以使用这种模式移除我们不想支持的方法。这被称为“过滤”。\n\
  \n装饰器的一个著名例子是 `java.io.InputStream` 及其相关类，其设计拷贝自 C++。具体组件包括 `FileInputStream` 和\
  \ `SocketInputStream`。我们还有许多装饰器，例如用于添加 I/O 缓冲的 `BufferedInputStream`，用于以小端格式读取原始数据的\
  \ `DataInputStream`，以及用于序列化读取 Java 对象的 `ObjectInputStream`。甚至还有一个 `ProgressMonitorInputStream`，如果读取输入超过两秒，它会打开一个\
  \ Swing 进度对话框。\n\n在列表 1.1 中，我们创建一个指向文件 `data.bin.gz` 的 `FileOutputStream`。我们用 `GZIPOutputStream`、`BufferedOutputStream`\
  \ 和 `DataOutputStream` 对其进行装饰。链中的每个环节都增加了一个功能。然后我们写入了 0 到 1,000 之间的 1000 万个随机整数。\n\
  \n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\ntry (var out = new DataOutputStream(\n\
  \    new BufferedOutputStream(\n        new GZIPOutputStream(\n            new FileOutputStream(\n\
  \                \"data.bin.gz\"))))) {\n  // 向 data.bin.gz 写入 0 到 1000 之间的千万个随机整数\n\
  \  // 并实时使用 GZIP 对文件进行压缩\n  ThreadLocalRandom.current().ints(10_000_000, 0, 1_000)\n\
  \      .forEach(i -> {\n        try {\n          out.writeInt(i);\n        } catch\
  \ (IOException e) {\n          throw new UncheckedIOException(e);\n        }\n \
  \     });\n  out.writeInt(-1); // 我们的 EOF 标记\n}\n```\n\n列表 1.1：写入 `DataOutputStream`。\n\
  \n在列表 1.2 中，我们从 `DataInputStream` 读取，它反过来又从 `BufferedInputStream`、`GZIPInputStream`\
  \ 和 `FileInputStream` 读取。\n\n```\n//:~ core/src/main/.../ch01/InputStreamDemo.java\n\
  try (\n    // 分别声明 \"fis\" 以确保它被关闭，\n    // 即使文件不包含正确的 GZIP 头\n    var fis = new\
  \ FileInputStream(\"data.bin.gz\");\n    var in = new DataInputStream(\n       \
  \ new BufferedInputStream(\n            new GZIPInputStream(fis)))) {\n  long total\
  \ = 0;\n  int value;\n  // 持续读取直到 value == -1，我们的 EOF 标记\n  while ((value = in.readInt())\
  \ != -1) {\n    total += value;\n  }\n  // 我们期望 total 为 50 亿\n  System.out.println(\"\
  total = \" + total);\n}\n```\n\n列表 1.2：从 `DataInputStream` 读取。\n\n（我们单独声明 `FileInputStream`\
  \ 的原因是 `GZIPInputStream` 会读取文件头以验证是否为 gzip 文件。如果头部错误，`GZIPInputStream` 的构造函数将抛出异常，在这种情况下\
  \ `FileInputStream` 将无法自动关闭。）\n\n### 装饰器与代理有什么相似之处？\n\n装饰器在结构上与代理最相似。`Component`\
  \ 是 `Subject`，`Decorator` 类似于 `Proxy`，而 `ConcreteComponent` 类似于 `RealSubject`。一个区别在于客户端看到的类。装饰器通常将组件作为构造参数。\n\
  \n## 组合模式\n\n意图：“将对象组合成树形结构以表示部分整体关系。组合允许客户端统一地处理单个对象和对象的组合。” (GoF 1994, p. 163)\n\
  \n![CompositeStructure](img/CompositeStructure.png)\n\n图 5。组合设计模式的结构。\n\n这种结构再次类似于代理和对象适配器。区别在于组合与组件之间存在一对多的关系。客户端与顶层组件类交互。\n\
  \n### 组合与代理有什么相似之处？\n\n在组合模式和代理模式中，客户端都会使用顶层接口 `Subject` 或 `Component`。然而，组合模式在\
  \ `Composite` 和 `Component` 之间是一一对多的关系，而代理模式在 `Proxy` 和 `Subject` 之间是一对一的关联。\n\n\
  ## 责任链模式\n\n意图：“通过给多个对象处理请求的机会，避免请求发送者与其接收者之间的耦合。将接收对象链接起来并沿链传递请求，直到某个对象处理它为止。”\
  \ (GoF 1994, p. 223)\n\n![ChainOfResponsibilityStructure](img/ChainOfResponsibilityStructure.png)\n\
  \n图 6。责任链设计模式的结构。\n\n我们使用责任链模式使方法处理代码更易于理解。当代码具有列表 1.3 所示的形式时，这种模式非常有用。\n\n\n\n\n\
  \n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\npublic void handleWithoutChain(\n\
  \    String key, Consumer<String> processor) {\n  var item = map1.get(key);\n  if\
  \ (item != null) processor.accept(item);\n  else {\n    item = map2.get(key);\n\
  \    if (item != null) processor.accept(item);\n    else {\n      item = map3.get(key);\
  \ // 循环\n    }\n  }\n}\n```\n\nListing 1.3: 嵌套的 if-else-if 结构。\n\n我们没有使用多条件 if-else\
  \ 语句，而是创建了一个抽象的 `Handler` 类。`handle()` 的默认实现是将调用沿着链向下传递给下一个处理程序。\n\n```java\n//:~\
  \ core/src/main/.../ch01/Handler.java\npublic abstract class Handler {\n  private\
  \ final Handler next;\n  public Handler(Handler next) {\n    this.next = next;\n\
  \  }\n  public void handle(String key, Consumer<String> processor) {\n    if (next\
  \ != null) next.handle(key, processor);\n  }\n}\n```\n\nListing 1.4: 责任链处理程序。\n\n\
  我们的 `MapHandler` 包含了具体的实现：如果在我们的 map 中找到了该项，则调用 `process(item)`；否则，调用 `super.handle(key)`。\n\
  \n```java\n//:~ core/src/main/.../ch01/MapHandler.java\npublic class MapHandler\
  \ extends Handler {\n  private final Map<String, String> map;\n  public MapHandler(Map<String,\
  \ String> map, Handler next) {\n    super(next);\n    this.map = map;\n  }\n  @Override\n\
  \  public void handle(String key, Consumer<String> processor) {\n    String item\
  \ = map.get(key);\n    if (item != null) processor.accept(item);\n    else super.handle(key,\
  \ processor);\n  }\n}\n```\n\nListing 1.5: Map 的具体处理程序。\n\n在我们的类内部，我们将按照 Listing\
  \ 1.6 所示的方式设置链。\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\nprivate\
  \ final Handler chain =\n    new MapHandler(map1,\n        new MapHandler(map2,\n\
  \            new MapHandler(map3, null)));\n```\n\nListing 1.6: 作为字段的处理程序链。\n\n\
  与 Listing 1.3 中复杂的 if-else-if 结构相比，我们可以这样写：\n\n```java\n//:~ core/src/main/.../ch01/ChainDemo.java\n\
  private void handleWithChain(\n    String key, Consumer<String> processor) {\n \
  \ chain.handle(key, processor);\n}\n```\n\nListing 1.7: 使用责任链处理程序。\n\n该模式使得复杂的 if-else-if\
  \ 方法变得易于理解。该模式的一个已知缺点是，如果没有找到合适的处理程序，请求可能会在链的末端丢失。在第 4 章中，我们将学习这种模式如何帮助我们处理方法调用。我们还将看到如何防止请求从链的末端掉。\n\
  \n# 手工代理\n\n由于我们的书名中包含“代理（proxies）”，我们应该更详细地检查代理设计模式。代理有多种形式和类型。例如，我们提到过用于延迟初始化的**虚拟代理**、用于访问远程地址空间对象的**远程代理**以及用于添加安全层的**保护代理**。\n\
  \n提醒一下，GoF 书中的代理设计模式结构如图 7 所示。\n\n![ProxyStructure](img/ProxyStructure.png)\n\n\
  图 7. 代理结构。\n\n## 使用虚拟代理进行延迟初始化\n\n在某些情况下，我们可能希望在绝对需要时才延迟创建对象。推迟甚至可以完全节省对象创建的成本。此类高成本创建对象示例包括线程、数据库连接、大型数组和文件。\n\
  \n例如，一个新的 `HashMap` 占用 48 字节，不包括其条目数组。该数组传统上从长度 16 开始，并在占用率超过 75% 时增长。一个包含 16 个对象的数组又占用\
  \ 80 字节。这意味着，在包含任何元素之前，一个新的 `HashMap` 的组合成本就达到了 128 字节。\n\n### CustomMap\n\n`CustomMap`\
  \ 接口包含了 `java.util.Map` 定义的方法子集。在代理设计模式结构中，`CustomMap` 是 `Subject` 接口的一个示例。\n\n\
  ```java\n//:~ core/src/main/.../ch02/virtual/CustomMap.java\npublic interface CustomMap<K,\
  \ V> {\n  int size();\n  V get(Object key);\n  V put(K key, V value);\n  V remove(Object\
  \ key);\n  void clear();\n  void forEach(BiConsumer<? super K, ? super V> action);\n\
  \  // 等等\n}\n```\n\nListing 2.1: `CustomMap` 接口。\n\n我们 `CustomMap` 的类结构如图 8 所示。\n\
  \n![CustomMapStructure](img/CustomMapStructure.png)\n\n图 8. `CustomMap` 结构。\n\n\
  ### CustomHashMap\n\n`CustomHashMap` 实现了 `CustomMap`。由于我们不想重造轮子，我们将所有方法委托给 `java.util.HashMap`。在代理设计模式结构中，`CustomHashMap`\
  \ 是 `RealSubject` 类的一个示例。\n\n```java\n//:~ core/src/main/.../ch02/virtual/CustomHashMap.java\n\
  public class CustomHashMap<K, V> implements CustomMap<K, V> {\n  private final Map<K,\
  \ V> map;\n  public CustomHashMap() {\n    this.map = new HashMap<>();\n  }\n  @Override\n\
  \  public int size() {\n    return map.size();\n  }\n  @Override\n  public V get(Object\
  \ key) {\n    return map.get(key);\n  }\n  @Override\n  public V put(K key, V value)\
  \ {\n    return map.put(key, value);\n  }\n  @Override\n  public V remove(Object\
  \ key) {\n    return map.remove(key);\n  }\n  @Override\n  public void clear() {\n\
  \    map.clear();\n  }\n  @Override\n  public void forEach(BiConsumer<? super K,\
  \ ? super V> action) {\n    map.forEach(action);\n  }\n  @Override\n  public String\
  \ toString() {\n    return map.toString();\n  }\n}\n```\n\nListing 2.2: `CustomHashMap`\
  \ 类。\n\n### VirtualMap\n\n最后，我们创建了虚拟代理 `VirtualMap`。\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualMap.java\n\
  public class VirtualMap<K, V> implements CustomMap<K, V> {\n  private final Supplier<CustomMap<K,\
  \ V>> supplier;\n  private CustomMap<K, V> realMap;\n\n  public VirtualMap(Supplier<CustomMap<K,\
  \ V>> supplier) {\n    this.supplier = supplier;\n  }\n\n  private CustomMap<K,\
  \ V> getRealMap() {\n    if (realMap == null) {\n      realMap = supplier.get();\n\
  \    }\n    return realMap;\n  }\n\n  @Override\n  public int size() {\n    return\
  \ getRealMap().size();\n  }\n  @Override\n  public V get(Object key) {\n    return\
  \ getRealMap().get(key);\n  }\n  @Override\n  public V put(K key, V value) {\n \
  \   return getRealMap().put(key, value);\n  }\n  @Override\n  public V remove(Object\
  \ key) {\n    return getRealMap().remove(key);\n  }\n  @Override\n  public void\
  \ clear() {\n    getRealMap().clear();\n  }\n  @Override\n  public void forEach(BiConsumer<?\
  \ super K, ? super V> action) {\n    getRealMap().forEach(action);\n  }\n  @Override\n\
  \  public String toString() {\n    return getRealMap().toString();\n  }\n}\n```\n\
  \nListing 2.3: `VirtualMap` 代理类。\n\n让我们看看如何使用它。我们的局部变量 `map` 指向一个 `VirtualMap` 实例。在第一次调用诸如\
  \ `put()` 或 `get()` 方法之前，真正的 `HashMap` 不会被创建。当我们这样做时，供应器会被调用，`HashMap` 被创建。之后，所有的调用都路由到包含的\
  \ `HashMap` 中。\n\n```java\n//:~ core/src/main/.../ch02/virtual/VirtualProxyDemo.java\n\
  publicMapDemo {\n  public static void main(String[] args) {\n    CustomMap<String,\
  \ Integer> map =\n        new VirtualMap<>(CustomHashMap::new);\n    System.out.println(\"\
  Virtual Map created\");\n    map.put(\"one\", 1);\n    map.put(\"life\", 42);\n\
  \    System.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"life\"));\n   \
  \ System.out.println(\"map.size() = \" + map.size());\n    System.out.println(\"\
  clearing map\");\n    map.clear();\n    System.out.println(\"map.size() = \" + map.size());\n\
  \  }\n}\n```\n\nListing 2.4: `VirtualProxyDemo`。\n\n\n\n\n\n# 使用远程代理调用远程方法\n\n大使馆是远程国家的本地代表。当我们申请签证、续换护照，或者在不乘坐飞机的情况下与远程实体（该国政府）交互时，就会访问它们。大使馆有点就像远程代理。\n\
  \n假设我们想申请访问加拿大的签证。\n\n```\n//:~ core/src/main/.../ch02/remote/Canada.java\npublic\
  \ interface Canada {\n  boolean canGetVisa(String name,\n                     boolean\
  \ married,\n                     boolean rich);\n}\n```\n\n列表 2.6：`Canada`。\n\n\
  我们的实现类定义在 `RealCanada` 内部，它检查最关键的属性。该类名听起来像某种啤酒的名字：*“Real Canada - 入口极其顺滑。啊。扑灭最深处的渴…………​。”*\n\
  \n```\n//:~ core/src/main/.../ch02/remote/RealCanada.java\npublic class RealCanada\
  \ implements Canada {\n  @Override\n  public boolean canGetVisa(String name,\n \
  \                           boolean married,\n                            boolean\
  \ rich) {\n    return married && rich || !married && rich || rich;\n    // 每个国家都喜欢富有的游客\
  \ ... :-)\n  }\n}\n```\n\n列表 2.7：`RealCanada`。\n\n我们将使用 [Jetty Web 服务器](https://github.com/eclipse/jetty.project)\
  \ 发布它。\n\n```\n//:~ core/src/main/.../ch02/remote/ServicePublisher.java\n/**\n *\
  \ @author Simone Bordet\n */\npublic class ServicePublisher extends AbstractHandler\
  \ {\n  private static final Pattern PATTERN =\n      Pattern.compile(\"/canGetVisa/\"\
  \ +\n                          \"(?<name>[^/]+)/\" +\n                         \
  \ \"(?<married>[^/]+)/\" +\n                          \"(?<rich>[^/]+)\");\n  private\
  \ final Canada canada;\n\n  public ServicePublisher(Canada canada) {\n    this.canada\
  \ = canada;\n  }\n\n  @Override\n  public void handle(String target, Request jettyRequest,\n\
  \                     HttpServletRequest request,\n                     HttpServletResponse\
  \ response)\n      throws IOException {\n    jettyRequest.setHandled(true);\n  \
  \  var matcher = PATTERN.matcher(request.getRequestURI());\n    if (matcher.matches())\
  \ {\n      var name = matcher.group(\"name\");\n      var married = Boolean.valueOf(matcher.group(\"\
  married\"));\n      var rich = Boolean.valueOf(matcher.group(\"rich\"));\n     \
  \ var canGetVisa = canada.canGetVisa(name, married, rich);\n      response.getOutputStream().print(canGetVisa);\n\
  \    } else {\n      response.setStatus(HttpServletResponse.SC_NOT_FOUND);\n   \
  \ }\n  }\n  public static void main(String... args) throws Exception {\n    Canada\
  \ canada = new RealCanada();\n    var server = new Server(8080);\n    server.setHandler(new\
  \ ServicePublisher(canada));\n    server.start();\n  }\n}\n```\n\n列表 2.8：远程代理发布者。\n\
  \n服务器端就此了。当我们运行 `ServicePublisher` 时，它会创建一个我们可以连接的 REST 服务。\n\n接下来，我们创建一个远程代理，连接到该\
  \ REST 服务并调用方法。\n\n```\n//:~ core/src/main/.../ch02/remote/CanadianEmbassy.java\n\
  public class CanadianEmbassy implements Canada {\n  private final HttpClient httpClient\
  \ =\n      HttpClient.newBuilder().build();\n  @Override\n  public boolean canGetVisa(String\
  \ name,\n                            boolean married,\n                        \
  \    boolean rich) {\n    try {\n      var encodedName = URLEncoder.encode(name,\n\
  \          StandardCharsets.UTF_8);\n      var url = \"http://0.0.0.0:8080/canGetVisa/\"\
  \ +\n                    encodedName + \"/\" +\n                    married + \"\
  /\" + rich;\n      var req = HttpRequest.newBuilder()\n                    .uri(URI.create(url))\n\
  \                    .build();\n      var res = httpClient.send(\n          req,\
  \ HttpResponse.BodyHandlers.ofString());\n      return res.statusCode() == HttpURLConnection.HTTP_OK\
  \ &&\n                 Boolean.parseBoolean(res.body());\n    } catch (IOException\
  \ e) {\n      throw new UncheckedIOException(e);\n    } catch (InterruptedException\
  \ e) {\n      Thread.currentThread().interrupt();\n      throw new CancellationException(\"\
  interrupted\");\n    }\n  }\n}\n```\n\n列表 2.9：我们的 `CanadianEmbassy`。\n\n`Client`\
  \ 看起来就是普通的 Java 代码，完全感知不到远程实现。\n\n```\n//:~ core/src/main/.../ch02/remote/Client.java\n\
  public class Client {\n  public static void main(String... args) {\n    Canada canada\
  \ = new CanadianEmbassy();\n    boolean visaObtained = canada.canGetVisa(\n    \
  \    \"Heinz Kabutz\", true, false);\n    System.out.println(\"visaObtained = \"\
  \ + visaObtained);\n    System.out.println(\"Wins lottery ...\");\n    visaObtained\
  \ = canada.canGetVisa(\n        \"Heinz Kabutz\", true, true);\n    System.out.println(\"\
  visaObtained = \" + visaObtained);\n  }\n}\n```\n\n列表 2.10：Client。\n\n我们通过以下方式运行此示例：首先启动\
  \ `ServicePublisher` 类，然后运行我们的 `Client`。\n\n```\nvisaObtained = false\nWins lottery\
  \ ...\nvisaObtained = true\n```\n\n列表 2.11：我们拿到签证了吗？\n\n# 使用保护代理实现安全性\n\n安全性要么在它工作正常时极其无聊，要么在它出问题时超级令人兴奋（以糟糕的方式）。\n\
  \n我们需要保护对象，就像保护资产。保护代理可以防止以下情况：\n\n*   并发访问导致的竞态条件。\n*   未经授权的修改。\n*   对敏感状态的非法访问。\n\
  \n我们将查看不同的保护代理。\n\n### `SynchronizedMap`\n\n我们的 `HashMap` 在列表 2.2 中不是线程安全的。它依赖于\
  \ `java.util.HashMap`，这无法在并发访问保护状态。为了说明，考虑列表 2.12。我们使用并行流向 map 放入 46,000 个条目。然后通过\
  \ `forEach()` 遍历 map 并统计有多少条目。最后，我们打印出值。\n\n```java\n//:~ core/src/test/.../ch02/protection/ConcurrentTest.java\n\
  public class ConcurrentTest {\n  public static final int SQUARES = 46_000;\n  public\
  \ void check(Map<Integer, Integer> map) {\n    System.out.println(\"Checking \"\
  \ + map.getClass().getSimpleName());\n    try {\n      IntStream.range(0, SQUARES)\n\
  \          .parallel()\n          .forEach(i -> map.put(i, i));\n    } catch (Exception\
  \ e) {\n      System.err.println(e);\n    }\n    // count actual entries\n    var\
  \ entries = new LongAdder();\n    map.forEach((k, v) -> entries.increment());\n\n\
  \    System.out.println(\"entries = \" + entries);\n    System.out.println(\"map.size()\
  \ = \" + map.size());\n\n    assertTrue(\"entries=\" + entries + \", \" +\n    \
  \           \"map.size=\" + map.size(),\n        entries.intValue() == map.size());\n\
  \  }\n}\n```\n\n列表 2.12：`ConcurrentTest` 使用并行流并发修改 map。\n\n我们的 `CustomHashMapTest`\
  \ 为 `ConcurrentTest` 提供了 `CustomHashMap`。\n\n```java\n//:~ core/src/test/.../ch02/protection/CustomHashMapTest.java\n\
  public class CustomHashMapTest extends ConcurrentTest {\n  @Test\n  public void\
  \ testCustomHashMap() {\n    try {\n      check(new CustomHashMap<>()); // 不工作\n\
  \    } catch (AssertionError error) {\n      System.err.println(error);\n    }\n\
  \  }\n}\n```\n\n列表 2.13：`CustomHashMapTest`。\n\n在配备 6 核心的 2018 款 MacBook Pro (i9)\
  \ 上多次运行此代码，统计出的 `entries` 从未等于于 `map.size()`。计数也不等于 46,000。例如，列表 2.14 是其中一次运行的输出。\n\
  \n```\nCustomHashMap constructed\nChecking CustomHashMap\nentries = 35474\nmap.size()\
  \ = 41663\njava.lang.AssertionError: entries=35474, map.size=41663\n```\n\n列表 2.14：来自\
  \ `CustomHashMapTest` 的输出。\n\n\n\n\n\n为了解决 `CustomHashMap` 中的竞态条件，我们将使用 `SynchronizedCustomMap`\
  \ 对其进行代理。在委托给 `CustomMap` 方法之前，我们将所有方法都标记为 `synchronized`。\n\n```java\n//:~ core/src/main/.../ch02/protection/SynchronizedCustomMap.java\n\
  public class SynchronizedCustomMap<K, V>\n    implements CustomMap<K, V> {\n  private\
  \ final CustomMap<K, V> map;\n  public SynchronizedCustomMap(CustomMap<K, V> map)\
  \ {\n    this.map = map;\n  }\n  @Override\n  public synchronized int size() {\n\
  \    return map.size();\n  }\n  @Override\n  public synchronized V get(Object key)\
  \ {\n    return map.get(key);\n  }\n  @Override\n  public synchronized V put(K key,\
  \ V value) {\n    return map.put(key, value);\n  }\n  @Override\n  public synchronized\
  \ V remove(Object key) {\n    return map.remove(key);\n  }\n  @Override\n  public\
  \ synchronized void clear() {\n    map.clear();\n  }\n  @Override\n  public synchronized\
  \ void forEach(\n      BiConsumer<? super K, ? super V> action) {\n    map.forEach(action);\n\
  \  }\n}\n```\n\nListing 2.15: `SynchronizedCustomMap` 使用 `synchronized` 来保证线程安全。\n\
  \n我们的 `SynchronizedTest` 创建了一个代理自 `CustomHashMap` 的 `SynchronizedCustomMap`，并将其传递给\
  \ `ConcurrentTest`。\n\n```java\n//:~ core/src/test/.../ch02/protection/SynchronizedTest.java\n\
  public class SynchronizedTest extends ConcurrentTest {\n  @Test\n  public void testSynchronizedCustomMap()\
  \ {\n    check(new SynchronizedCustomMap<>(new CustomHashMap<>()));\n  }\n}\n```\n\
  \nListing 2.16: 用于测试 `SynchronizedCustomMap` 的 `SynchronizedTest`。\n\n正如预期，当我们使用\
  \ `synchronized` 保护对 `CustomMap` 的所有访问时，我们就消除了竞态条件。\n\n### `UnmodifiableCustomMap`\n\
  \n直接从方法返回的集合往往是 bug 的根源。当调用者更改这些集合时，到底会发生什么并不总是清楚的。原始集合应该被修改，还是更改不应该产生影响？推荐的方法之一是返回一个不可修改的集合，也就是说如果调用了会修改集合内容的方法，该方法将抛出\
  \ `UnsupportedOperationException`。我们的 `CustomMap` 是通过 `put()`、`remove()` 和 `clear()`\
  \ 方法修改的。\n\n如果我们想确保任何获取了 map 的人无法修改它，我们可以发送给他们一个 `UnmodifiableCustomMap`（不可修改自定义\
  \ map）。每当我们调用如 `put()` 等修改方法时，它都会抛出 `UnsupportedOperationException`。\n\n```java\n\
  //:~ core/src/main/.../ch02/protection/UnmodifiableCustomMap.java\npublic class\
  \ UnmodifiableCustomMap<K, V>\n    implements CustomMap<K, V> {\n  private final\
  \ CustomMap<K, V> map;\n  public UnmodifiableCustomMap(CustomMap<K, V> map) {\n\
  \    this.map = map;\n  }\n  @Override\n  public int size() {\n    return map.size();\n\
  \  }\n  @Override\n  public V get(Object key) {\n    return map.get(key);\n  }\n\
  \  @Override\n  public V put(K key, V value) {\n    throw new UnsupportedOperationException(\"\
  unmodifiable\");\n  }\n  @Override\n  public V remove(Object key) {\n    throw new\
  \ UnsupportedOperationException(\"unmodifiable\");\n  }\n  @Override\n  public void\
  \ clear() {\n    throw new UnsupportedOperationException(\"unmodifiable\");\n  }\n\
  \  @Override\n  public void forEach(BiConsumer<? super K, ? super V> action) {\n\
  \    map.forEach(action);\n  }\n}\n```\n\nListing 2.17: `UnmodifiableCustomMap`\
  \ 对修改方法抛出 `UnsupportedOperationException`。\n\n我们的 `UnmodifiableTest` 检查了使用之前展示的\
  \ `ConcurrentTest` 尝试修改 `UnmodifiableCustomMap` 时会发生什么。\n\n```java\n//:~ core/src/test/.../ch02/protection/UnmodifiableTest.java\n\
  public class UnmodifiableTest extends ConcurrentTest {\n  @Test\n  public void testUnmodifiableCustomMap()\
  \ {\n    check(new UnmodifiableCustomMap<>(new CustomHashMap<>()));\n  }\n}\n```\n\
  \nListing 2.18: `UnmodifiableTest`。\n\n正如预期，调用 `put()` 会导致 `UnsupportedOperationException`。\n\
  \n```\nCustomHashMap constructed\nChecking UnmodifiableCustomMap\njava.lang.UnsupportedOperationException:\
  \ unmodifiable\nentries = 0\nmap.size() = 0\n```\n\nListing 2.19: `UnmodifiableTest`\
  \ 的输出。\n\n## 级联代理\n\n原始的 GoF 代理类图有一个从 `Proxy` 到 `RealSubject` 的关联。一种更灵活的方法是让 `Proxy`\
  \ 指向 `Subject` 接口。这正是我们迄为止编写每个代理示例的方式。通过指向 `Subject`，我们可以对代理进行级联：一个保护代理可能会指向一个虚拟代理，而虚拟代理反过来可能指向一个远程代理，然后指向\
  \ `RealSubject`。\n\n例如，让我们之前的 `SynchronizedCustomMap` 与我们的 `VirtualCustomMap` 结合。\n\
  \n```java\n//:~ core/src/test/.../ch02/protection/SynchronizedVirtualTest.java\n\
  public class SynchronizedVirtualTest extends ConcurrentTest {\n  @Test\n  public\
  \ void testSynchronizedVirtualMap() {\n    check(new SynchronizedCustomMap<>(new\
  \ VirtualCustomMap<>()));\n  }\n}\n```\n\nListing 2.20: 级联保护代理与虚拟代理。\n\n\n\n\n为了实现这种透明性，让我们首先完善代理的\
  \ `equals()` 方法。请注意，委托给 `map` 与我们之前编写代理方法的方法一致。\n\n```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInHandCraftedProxy.java\n\
  @Override\npublic boolean equals(Object o) {\n  return map.equals(o);\n}\n@Override\n\
  public int hashCode() {\n  return map.hashCode();\n}\n```\n\n列表 2.24：一致的代理 `equals()`\
  \ 方法。\n\n`CustomHashMap` 需要更多的一些工作。\n\n1.  我们确保参数是 `CustomMap` 的实例。当参数为 `null` 或不是\
  \ `CustomMap` 的其他对象时，它将返回 `false`。\n\n2.  我们检查参数的类是否为 `CustomHashMap`。如果是同一个类，则进行向下类型转换并比较两个\
  \ `map` 字段。最佳实践是将 `CustomHashMap` 中的 `equals()` 方法标记为 `final`，以防止意外的重写，因为这会导致非对称的\
  \ `equals()` 方法。由于 `hashCode()` 需要与 `equals()` 配对使用，我们也将其标记为 `final`。\n\n3.  否则，我们返回反转\
  \ `equals` 条件的结果，即 `o.equals(this)`。如果不反转，我们将陷入无限循环。由于 `equals()` 要求具有对称性，`o.equals(this)`\
  \ 的结果必须与 `this.equals(o)` 相同。\n\n```java\n//:~ core/src/main/.../ch02/equals/FixedEqualsInCustomHashMap.java\n\
  @Override\npublic final boolean equals(Object o) {\n  if (this == o) return true;\n\
  \  if (!(o instanceof CustomMap)) return false;\n\n  if (o instanceof CustomHashMap)\
  \ {\n    CustomHashMap<?, ?> that = (CustomHashMap<?, ?>) o;\n    return this.map.equals(that.map);\n\
  \  }\n  return o.equals(this); // 反转 equals() 条件\n}\n@Override\npublic final int\
  \ hashCode() {\n  return map.hashCode();\n}\n```\n\n列表 2.25：正确的 `CustomHashMap.equals()`。\n\
  \n我们在 `CustomMapEqualsTest` 中看到了 `equals()` 方法的实际应用。要查看更完整的测试集，请访问 [github.com/kabutz/dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples/tree/master/core/src/test/java/eu/javaspecialists/books/dynamicproxies/ch02/equals).\n\
  \n```java\n//:~ core/src/test/.../ch02/equals/CustomMapEqualsTest.java\npublic class\
  \ CustomMapEqualsTest {\n  @Test\n  public void testEqualsContract() {\n    var\
  \ real = new CustomHashMap<Integer, Integer>();\n    for (int i = 0; i < 10; i++)\
  \ real.put(i, i * i);\n    var proxy1 = new UnmodifiableCustomMap<>(real);\n   \
  \ var proxy2 = new UnmodifiableCustomMap<>(real);\n    var empty = new CustomHashMap<Integer,\
  \ Integer>();\n\n    // 自反性\n    assertEquals(real, real);\n    assertEquals(proxy1,\
  \ proxy1);\n    assertEquals(proxy2, proxy2);\n\n    // 对称性\n    assertEquals(real,\
  \ proxy1);\n    assertEquals(proxy1, real);\n    assertEquals(proxy1, proxy2);\n\
  \    assertEquals(proxy2, proxy1);\n\n    // 传递性\n    if (real.equals(empty) &&\
  \ empty.equals(proxy2))\n      assertEquals(real, proxy2);\n    if (real.equals(proxy1)\
  \ && proxy1.equals(proxy2))\n      assertEquals(real, proxy2);\n  }\n}\n```\n\n\
  列表 2.26：`equals()` 示例。\n\n搞定！我们有了一个满足所有上述要求的 `equals()` 方法，并允许我们的真实主体变得“可代理”。它具有自反性、对称性和传递性。此外，如果我们将对象与它的代理进行比较，我们将得到预期的结果\
  \ `true`。\n\n# 动态代理\n\n到为止，我们都是通过手工编写代理类。当每种代理在结构和功能上都是唯一的时，手工编写是有意义的。然而，大多数代理实现都是相似的。例如，远程代理必须在参数和返回值之间进行传递。Java\
  \ RMI 以存根（stubs）和骨架（skeletons）的形式为远程代理生成胶代码。IDE 会为我们生成委托模板代码，但我们仍然需要阅读所有这些代码来理解它们在做什么。\n\
  \n代码生成可以是静态的或动态的。静态生成不太方便，因为它需要额外的构建步骤。动态生成在运行时创建一个新的代理类。它非常方便且灵活。在本章中，我们将学习 Java\
  \ 中动态代理是如何工作的。\n\n## `Proxy.newProxyInstance()`\n\n我们使用静态工厂方法 `newProxyInstance()`\
  \ 通过以下三个参数来构造动态代理：\n\n*   `ClassLoader loader` 是加载我们新代理类的地方。`ClassLoader` 需要能够看到我们想要实现的接口。例如，引导程序类加载器知道\
  \ Java 接口（`java.lang.Runnable`、`java.util.Collection` 等），但不知道应用程序接口。我们的类是使用系统类加载器（也称为\
  \ `AppClassLoader`）加载的。\n\n*   `Class<?>[] interfaces` 是一个包含代理对象需要实现的所有接口的数组。\n\n\
  *   `InvocationHandler` 是一个函数接口，每当调用任何方法时都会被调用。\n\n### `InvocationHandler`\n\n在代理对象上调用的任何方法都会派发到\
  \ `InvocationHandler` 的 `invoke()` 方法。\n\n```java\n//:~ core/src/main/.../ch03/InvocationHandlerDeclaration.java\n\
  public interface InvocationHandler {\n  public Object invoke(Object proxy,\n   \
  \                    Method method,\n                       Object[] args) throws\
  \ Throwable;\n}\n```\n\n列表 3.4：`InvocationHandler`。\n\n`invoke()` 方法有三个参数：\n\n\n\
  \n\n- `Object proxy` 是调用 `invoke()` 的动态代理类的实例。我们将在稍后的章节中使用它。\n- `Method method`\
  \ 是一个 `java.lang.reflect.Method` 对象，对应被调用的方法。该方法要么来自创建动态代理时所使用的接口之一，要么来自 `Object`\
  \ 类的三个公共非 final 方法之一，即 `hashCode()`、`equals(Object)` 或 `toString()`。\n- `Object[]\
  \ args` 是传递给该方法的参数数组。当方法没有任何参数时，该数组为 `null`。\n\n`invoke()` 方法声明它会抛出 `Throwable`。然而，方法应该只抛出那些在其方法签名中声明的受检异常（checked\
  \ exceptions）。这是动态代理如何具有动态性的另一个例子——静态类型系统显示为 `Throwable`，但对于它们可以抛出哪些异常存在着动态约束。\n\
  \n### `LoggingInvocationHandler`\n\n让我们来看如何创建我们自己的 `InvocationHandler`。在我们的 `LoggingInvocationHandler`\
  \ 中，我们记录了方法调用以及它们消耗的时间。我们假设 `Object obj` 实现了与动态代理相同的接口。因此，我们通过 `return method.invoke(obj,\
  \ args)` 将方法调用委托给 `obj`，并在周围包裹我们的日志代码。\n\n大部分代码都是自而易懂的，除了 `logFine` 优化部分。`System.nanoTime()`\
  \ 是一个昂贵的系统调用，除非在启用细粒日志（fine logging），否则我们希望避免调用它。由于级别在我们调用 `method.invoke()` 期间可能会发生，我们将原始设置写入一个\
  \ `final` 局部变量 `logFine` 中。再次，`method.invoke()` 是动态代理如何具有动态性的一个例子——我们经常委托给底层功能，并且通过反射来实现这一点。\n\
  \n```\n//:~ core/src/main/.../handlers/LoggingInvocationHandler.java\npublic final\
  \ class LoggingInvocationHandler\n    implements InvocationHandler {\n  private\
  \ final Logger log;\n  private final Object obj;\n  public LoggingInvocationHandler(Logger\
  \ log, Object obj) {\n    this.log = log;\n    this.obj = obj;\n  }\n  @Override\n\
  \  public Object invoke(Object proxy, Method method,\n                       Object[]\
  \ args) throws Throwable {\n    log.info(() -> \"Entering \" + toString(method,\
  \ args));\n    // optimization - nanoTime() is an expensive native call\n    final\
  \ boolean logFine = log.isLoggable(Level.FINE);\n    long start = logFine ? System.nanoTime()\
  \ : 0;\n    try {\n      return method.invoke(obj, args);\n    } finally {\n   \
  \   long nanos = logFine ? System.nanoTime() - start : 0;\n      log.info(() ->\
  \ \"Exiting \" + toString(method, args));\n      if (logFine) log.fine(() -> \"\
  Time \" + nanos + \"ns\");\n    }\n  }\n  private String toString(Method method,\
  \ Object[] args) {\n    return String.format(\"%s.%s(%s)\",\n        method.getDeclaringClass().getCanonicalName(),\n\
  \        method.getName(),\n        args == null ? \"\" :\n            Stream.of(args).map(String::valueOf)\n\
  \                .collect(Collectors.joining(\", \")));\n  }\n}\n```\n列表 3.5: `LoggingInvocationHandler`。\n\
  \n在列表 3.6 的 `LoggingProxyDemo` 中，我们创建了一个 `LoggingInvocationHandler`，它将所有方法调用记录到\
  \ `ConcurrentHashMap` 中。\n\n然后，我们通过调用 `Proxy.newProxyInstance()` 创建一个动态代理，传入 `Map`\
  \ 的类加载器（即引导程序类加载器）、一个包含 `Map` 接口的数组以及我们的 `LoggingInvocationHandler` 实例。\n\n`newProxyInstance()`\
  \ 用的结果类型为 `Object`，我们需要手动将其强制转换为正确的类型，在我们的例子中是 `Map<String, Integer>`。这是一个动态代理如何具有动态性的例子——静态类型系统显示为\
  \ `Object`，但动态类型更窄。\n\n一个动态代理可能实现很多接口，因此并不清楚我们想要强制转换为哪一个。\n\n一旦我们将我们的动态代理对象强制转换为\
  \ `Map`，我们在其上调用的所有方法都会被记录，连同它们的执行时间。\n\n```\n//:~ core/src/main/.../ch03/logging/LoggingProxyDemo.java\n\
  var handler = new LoggingInvocationHandler(\n    Logger.getGlobal(), new ConcurrentHashMap<>());\n\
  @SuppressWarnings(\"unchecked\")\nvar map = (Map<String, Integer>)\n           \
  \   Proxy.newProxyInstance(\n                  Map.class.getClassLoader(),\n   \
  \               new Class<?>[] {Map.class},\n                  handler);\nmap.put(\"\
  one\", 1);\nmap.put(\"two\", 2);\nSystem.out.println(map);\nmap.clear();\n```\n\
  列表 3.6: map 的日志方法。\n\n## 动态类的名称\n\n动态代理的类名是什么？例如，考虑列表 3.7 中的 `ISODateParser` 接口，它解析\
  \ `yyyy-MM-dd` 格式的日期。这等同于图 7 中的 `Subject` 接口。\n\n```\n//:~ core/src/main/.../ch03/ISODateParser.java\n\
  /**\n * 解析 yyyy-MM-dd 格式的字符串并返回 LocalDate。\n */\npublic interface ISODateParser\
  \ {\n  LocalDate parse(String date) throws ParseException;\n}\n```\n列表 3.7: `ISODateParser`\
  \ 接口。\n\n我们创建一个动态代理并将类名打印到 `System.out`。\n\n```\n//:~ core/src/main/.../ch03/ProxyName.java\n\
  public class ProxyName {\n  public static void main(String... args) {\n    System.out.println(\n\
  \        Proxy.newProxyInstance(\n            ISODateParser.class.getClassLoader(),\n\
  \            new Class<?>[] {ISODateParser.class},\n            (proxy, method,\
  \ arguments) -> null\n        ).getClass()\n    );\n  }\n}\n```\n列表 3.8: `ProxyName`。\n\
  \n输出显示类名为 `com.sun.proxy.$Proxy0`。\n\n```\nclass com.sun.proxy.$Proxy0\n```\n列表\
  \ 3.9: `ProxyName` 输出。\n\n动态代理通常命名为 `$Proxy` 后跟数字。当所有接口都是公共的，包通常是 `com.sun.proxy`，但在你的操作系统和\
  \ JDK 上可能是另一个包。类名和包可能会随版本之间甚至运行之间变化。当我们从模块内部未导出的包创建动态代理时，包名会有不同。如果至少有一个接口是非公共的，代理类将位于该接口所在的包中。无法为位于不同包的非公共接口创建动态代理。\n\
  \n## 析 `$Proxy0`\n\n我们可以通过系统属性 `-Djdk.proxy.ProxyGenerator.saveGeneratedFiles=true`（Java\
  \ 9+）或较早版本 Java 中的 `-Dsun.misc.ProxyGenerator.saveGeneratedFiles=true` 将生成的代理类转储到当前工作目录。\n\
  \n例如，列表 3.10 显示了从 `ISODateParser` 接口生成的动态代理。我们可以看到 `$Proxy0` 派自 `java.lang.reflect.Proxy`，后者存储了\
  \ `InvocationHandler` 实例 `h`。公共接口方法以及 `java.lang.Object` 的 `hashCode()`、`equals()`\
  \ 和 `toString()` 都有关联的静态字段 `Method` 对象。这些字段在类加载时在静态初始化块中初始化。在每个方法实现中，代理实例、`Method`\
  \ 实例和包含参数的数组被传递给 `InvocationHandler`。例如，查看 `parse(String)` 的实现。\n\n\n\n\n\n```java\n\
  package com.sun.proxy;\n\n//:~ core/src/main/.../ch03/generated/$Proxy0.java\nimport\
  \ eu.javaspecialists.books.dynamicproxies.ch03.*;\n\nimport java.lang.reflect.*;\n\
  import java.text.*;\nimport java.time.*;\n\npublic final class $Proxy0 extends Proxy\n\
  \    implements ISODateParser {\n  private static Method m0;\n  private static Method\
  \ m1;\n  private static Method m2;\n  private static Method m3;\n\n  public $Proxy0(InvocationHandler\
  \ h) {\n    super(h);\n  }\n\n  public final LocalDate parse(String s) throws ParseException\
  \ {\n    try {\n      return (LocalDate) h.invoke(this, m3, new Object[] {s});\n\
  \    } catch (RuntimeException | ParseException | Error e) {\n      throw e;\n \
  \   } catch (Throwable e) {\n      throw new UndeclaredThrowableException(e);\n\
  \    }\n  }\n\n  public final int hashCode() {\n    try {\n      return (Integer)\
  \ h.invoke(this, m0, (Object[]) null);\n    } catch (RuntimeException | Error e)\
  \ {\n      throw e;\n    } catch (Throwable e) {\n      throw new UndeclaredThrowableException(e);\n\
  \    }\n  }\n\n  public final boolean equals(Object o) {\n    try {\n      return\
  \ (Boolean) h.invoke(this, m1, new Object[] {o});\n    } catch (RuntimeException\
  \ | Error e) {\n      throw e;\n    } catch (Throwable e) {\n      throw new UndeclaredThrowableException(e);\n\
  \    }\n  }\n\n  public final String toString() {\n    try {\n      return (String)\
  \ h.invoke(this, m2, (Object[]) null);\n    } catch (RuntimeException | Error e)\
  \ {\n      throw e;\n    } catch (Throwable e) {\n      throw new UndeclaredThrowableException(e);\n\
  \    }\n  }\n\n  static {\n    try {\n      m0 = Class.forName(\"java.lang.Object\"\
  )\n               .getMethod(\"hashCode\");\n      m1 = Class.forName(\"java.lang.Object\"\
  )\n               .getMethod(\"equals\",\n                   Class.forName(\"java.lang.Object\"\
  ));\n      m2 = Class.forName(\"java.lang.Object\")\n               .getMethod(\"\
  toString\");\n      m3 = Class.forName(\n          \"eu.javaspecialists.books.dynamicproxies.ch03\"\
  \ +\n              \".ISODateParser\")\n               .getMethod(\"parse\",\n \
  \                  Class.forName(\"java.lang.String\"));\n    } catch (NoSuchMethodException\
  \ e) {\n      throw new NoSuchMethodError(e.getMessage());\n    } catch (ClassNotFoundException\
  \ e) {\n      throw new NoClassDefFoundError(e.getMessage());\n    }\n  }\n}\n```\n\
  \n列表 3.10：`$Proxy0` 类的外观。\n\n我们可以看到，动态代理并不是魔法。\n\n## 加速反射方法\n\n传递给 `InvocationHandler`\
  \ 的 `invoke()` 方法的参数之一是所调用的 `Method`。我们经常需要使用反射来调用这个 `Method`，并希望尽可能快。由于代理实现了公共方法，我们还知道存储在动态代理类中的任何\
  \ `Method` 字段也是公共的。公共方法是可访问的，但遗憾的是，反射会遭受“健忘症”。每次我们在 `Method` 对象上调用 `invoke()` 时，它都会从栈检查调用类是谁以及它是否具有正确的权限。我们可以通过对每个\
  \ `Method` 字段调用 `setAccessible(true)` 来关闭此检查。这减少了使用反射时的方法调用开销。\n\n例如，这里是我们的 `MethodTurboBooster`。如果由于某种原因得到了异常，我们将返回原始代理对象。默认开启了加速功能，但我们可以通过\
  \ `-Deu.javaspecialists.books.dynamicproxies.util.MethodTurboBooster.disabled=true`\
  \ 禁用它。\n\n```java\n//:~ core/src/main/.../util/MethodTurboBooster.java\n/**\n *\
  \ 默认开启方法加速。我们对 Method 对象调用了\n * setAccessible(true)。异常会被静默忽略。\n * <p>\n * 可以通过以下\n\
  \ * -Deu.javaspecialists.books.dynamicproxies.util.\\\n * MethodTurboBooster.disabled=true\
  \ 禁用方法加速。\n */\npublic final class MethodTurboBooster {\n  private final static\
  \ Booster BOOSTER =\n      Boolean.getBoolean(\n          MethodTurboBooster.class.getName()\
  \ + \".disabled\") ?\n          new BoosterOff() : new BoosterOn();\n\n  public\
  \ static <E> E boost(E proxy) {\n    return BOOSTER.turboBoost(proxy);\n  }\n\n\
  \  public static Method boost(Method method) {\n    return BOOSTER.turboBoost(method);\n\
  \  }\n\n  private interface Booster {\n    <E> E turboBoost(E proxy);\n    Method\
  \ turboBoost(Method method);\n  }\n\n  private static class BoosterOn implements\
  \ Booster {\n    @Override\n    public <E> E turboBoost(E proxy) {\n      if (!(proxy\
  \ instanceof Proxy))\n        throw new IllegalArgumentException(\n            \"\
  只能对 Proxy 实例进行加速\"\n        );\n      try {\n        for (var field : proxy.getClass().getDeclaredFields())\
  \ {\n          if (field.getType() == Method.class) {\n            field.setAccessible(true);\n\
  \            turboBoost((Method) field.get(proxy));\n          }\n        }\n  \
  \      return proxy;\n      } catch (IllegalAccessException | RuntimeException e)\
  \ {\n        // 无法加速 -返回原始对象\n}      }\n    }\n    @Override\n    public Method\
  \ turboBoost(Method method) {\n      try {\n        method.setAccessible(true);\n\
  \      } catch (RuntimeException e) {\n        // 无法加速 -返回原始方法\n      }\n      return\
  \ method;\n    }\n  }\n\n  private static class BoosterOff implements Booster {\n\
  \    @Override\n    public <E> E turboBoost(E proxy) {\n      return proxy;\n  \
  \  }\n\n    @Override\n    public Method turboBoost(Method method) {\n      return\
  \ method;\n    }\n  }\n}\n```\n\n列表 3.11：`MethodTurboBooster`。\n\n## 解包装 `InvocationTargetException`\n\
  \n`InvocationHandler.invoke()` 声明抛出 `Throwable`，但正如我们在 `$Proxy0` 类中所看到的，任何异常会被封装在\
  \ `UndeclaredThrowableException` 中。考虑列表 3.12 中的代码。仔细检查代码可以发现我们在反射调用 `method.invoke()`\
  \ 中反转了比较。因此，我们正在将 `String` 与我们的代理进行比较，这将导致 `ClassCastException`。\n\n```java\n//:~\
  \ core/src/main/.../ch03/gotchas/RecastingBroken.java\nComparable<String> comp =\n\
  \    (Comparable<String>) Proxy.newProxyInstance(\n        Comparable.class.getClassLoader(),\n\
  \        new Class<?>[] {Comparable.class},\n        (proxy, method, params) ->\n\
  \            method.invoke(params[0], proxy));\nSystem.out.println(comp.compareTo(\"\
  hello\"));\n```\n\n列表 3.12：`RecastingBroken`。\n\n当我们运行这段代码时，看到的而是三个链在一起的异常。\n\n\
  ```\nException in thread \"main\" java.lang.reflect.UndeclaredThrowableException\n\
  \tat com.sun.proxy.$Proxy0.compareTo(Unknown Source)\n\tat ...ch03.gotchas.RecastingBroken.main\n\
  Caused by: java.lang.reflect.InvocationTargetException\n\tat ...\n\tat ...ch03.gotchas.RecastingBroken.lambda$main$0\n\
  Caused by: java.lang.ClassCastException: class com.sun.proxy.$Proxy0\n     cannot\
  \ 转换为 class java.lang.String\n```\n\n列表 3.13：来自 `RecastingBroken` 的输出。\n\n如果我们直接抛出\
  \ `ClassCastException`，由于它是 `RuntimeException`，我们的代理代码将将其传递给调用者。因此，如果我们在 `InvocationHandler.handle()`\
  \ 方法中使用反射，我们需要抛出包含在 `InvocationTargetException` 内部异常。为了方便起见，我们在列表 3.14 中编写了一个 `ExceptionUnwrappingInvocationHandler`。\n\
  \n\n\n\n\n```java\n//:~ core/src/main/.../handlers/ExceptionUnwrappingInvocationHandler.java\n\
  public final class ExceptionUnwrappingInvocationHandler\n    implements InvocationHandler,\
  \ Serializable {\n  private static final long serialVersionUID = 1L;\n  private\
  \ final InvocationHandler handler;\n  public ExceptionUnwrappingInvocationHandler(\n\
  \      InvocationHandler handler) {\n    this.handler = handler;\n  }\n  @Override\n\
  \  public Object invoke(Object proxy, Method method,\n                       Object[]\
  \ args) throws Throwable {\n    try {\n      return handler.invoke(proxy, method,\
  \ args);\n    } catch (InvocationTargetException ex) {\n      throw ex.getCause();\n\
  \    }\n  }\n  public InvocationHandler getNestedInvocationHandler() {\n    return\
  \ handler;\n  }\n}\n```\n\nListing 3.14: `ExceptionUnwrappingInvocationHandler`。\n\
  \n将此应用于我们之前列表 3.12 中的示例只需要极少的工作。我们简单地包装了 `InvocationHandler`。\n\n```java\n//:~ core/src/main/.../ch03/gotchas/RecastingExceptionsFixed.java\n\
  Comparable<String> comp =\n    (Comparable<String>) Proxy.newProxyInstance(\n  \
  \      Comparable.class.getClassLoader(),\n        new Class<?>[] {Comparable.class},\n\
  \        new ExceptionUnwrappingInvocationHandler(\n            (proxy, method,\
  \ params) ->\n                method.invoke(params[0], proxy)));\nSystem.out.println(comp.compareTo(\"\
  hello\"));\n```\n\nListing 3.15: `RecastingExceptionsFixed`。\n\n这一次，当我们运行它时，输出是单个\
  \ `ClassCastException`。正是我们需要的！\n\n```\nException in thread \"main\" java.lang.ClassCastException:\
  \ class\n      com.sun.proxy.$Proxy0 cannot be cast to class java.lang.String\n\t\
  at java.base/java.lang.String.compareTo(String.java:134)\n    at ...\n```\n\nListing\
  \ 3.16: `RecastingExceptionsFixed` 的输出。\n\n## 强制转换 (Casting)\n\n本节包含了我们在本书其余部分将将使用的静态工厂方法。\n\
  \n在列表 3.6 中，我们必须手动将代理实例强制转换为 `Map<String, Integer>`。但强制转换已经是上个世纪的事了。相反，泛型可以为我们完成转换。\n\
  \n```java\n//:~ core/src/main/.../Proxies.java\n/**\n * @param intf    要实现并强制转换的接口\n\
  \ * @param handler 所有方法的 InvocationHandler\n */\n@SuppressWarnings(\"unchecked\"\
  )\npublic static <S> S castProxy(Class<? super S> intf,\n                      \
  \        InvocationHandler handler) {\n  Objects.requireNonNull(intf, \"intf==null\"\
  );\n  Objects.requireNonNull(handler, \"handler==null\");\n  return MethodTurboBooster.boost(\n\
  \      (S) Proxy.newProxyInstance(\n          intf.getClassLoader(),\n         \
  \ new Class<?>[] {intf},\n          new ExceptionUnwrappingInvocationHandler(handler)));\n\
  }\n```\n\nListing 3.17: `Proxies.castProxy()`。\n\n为了演示，我们还定义了 `Proxies.simpleProxy()`\
  \ 来创建一个将所有方法调用委托给包装对象的动态代理。\n\n```java\n//:~ core/src/main/.../Proxies.java\npublic\
  \ static <S> S simpleProxy(\n    Class<? super S> subjectInterface, S subject) {\n\
  \  return castProxy(subjectInterface,\n      (InvocationHandler & Serializable)\n\
  \          (proxy, method, args) -> method.invoke(subject, args)\n  );\n}\n```\n\
  \nListing 3.18: `Proxies.simpleProxy()`。\n\n我们现在将在列表 3.19 中的 `RealISODateParser`\
  \ 类中使用它，该类实现了我们在列表 3.7 中的 `ISODateParser` 接口。\n\n```java\n//:~ core/src/main/.../ch03/RealISODateParser.java\n\
  public class RealISODateParser implements ISODateParser {\n  private static final\
  \ DateTimeFormatter formatter =\n      DateTimeFormatter.ISO_LOCAL_DATE;\n  @Override\n\
  \  public LocalDate parse(String date) throws ParseException {\n    try {\n    \
  \  return LocalDate.parse(date, formatter);\n    } catch (DateTimeParseException\
  \ e) {\n      throw new ParseException(e.toString(), e.getErrorIndex());\n    }\n\
  \  }\n\n  @Override\n  public String toString() {\n    return getClass().getSimpleName();\n\
  \  }\n}\n```\n\nListing 3.19: `RealISODateParser` 示例。\n\n为了创建我们的动态代理，我们调用 `Proxies.simpleProxy()`\
  \ 方法并传入我们想要实现的接口，以及我们想要包装的对象。`simpleProxy(Class<? super S> subjectInterface, S subject)`\
  \ 的泛型规范确保实例 `subject` 匹配接口。我们使用 `castProxy()` 方法在内部为我们完成转换。\n\n```java\n//:~ core/src/main/.../ch03/DynamicProxies.java\n\
  ISODateParser parser = Proxies.simpleProxy(\n    ISODateParser.class, new RealISODateParser());\n\
  LocalDate palindrome = parser.parse(\"2020-02-02\");\nSystem.out.println(\"palindrome\
  \ = \\\"\" + palindrome + \"\\\"\");\nSystem.out.println(parser);\nLocalDate funnyDate\
  \ = parser.parse(\"2020-04-31\");\n```\n\nListing 3.20: 使用 `Proxies` 创建简单代理。\n\n\
  ```\npalindrome = \"2020-02-02\"\nRealISODateParser\nException in thread \"main\"\
  \ java.time.format.DateTimeParseException: 2020-04-31\n```\n\nListing 3.21: 代理的输出。\n\
  \n## 虚拟代理 (Virtual proxy)\n\n在列表 2.3 的手工代理中，我们忘记了代理 `toString()`。通过动态代理，我们可以创建一个接受\
  \ `Supplier<? extends S>` 作为参数的 `VirtualProxyHandler`。\n\n```java\n//:~ core/src/main/.../handlers/VirtualProxyHandler.java\n\
  public final class VirtualProxyHandler<S>\n    implements InvocationHandler, Serializable\
  \ {\n  private static final long serialVersionUID = 1L;\n  private final Supplier<?\
  \ extends S> subjectSupplier;\n  private S subject;\n\n  public VirtualProxyHandler(\n\
  \      Supplier<? extends S> subjectSupplier) {\n    this.subjectSupplier = subjectSupplier;\n\
  \  }\n  private S getSubject() {\n    if (subject == null) subject = subjectSupplier.get();\n\
  \    return subject;\n  }\n  @Override\n  public Object invoke(Object proxy, Method\
  \ method,\n                       Object[] args) throws Throwable {\n    return\
  \ method.invoke(getSubject(), args);\n  }\n}\n```\n\nListing 3.22: `VirtualProxyHandler`。\n\
  \n我们可以为我们的 `Proxies` Fac 面添加一个静态工厂方法。\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
  public static <S> S virtualProxy(\n    Class<? super S> subjectInterface,\n    Supplier<?\
  \ extends S> subjectSupplier) {\n  Objects.requireNonNull(subjectSupplier,\n   \
  \   \"subjectSupplier==null\");\n  return castProxy(subjectInterface,\n      new\
  \ VirtualProxyHandler<>(subjectSupplier));\n}\n```\n\nListing 3.23: `Proxies.virtualProxy()`。\n\
  \n我们的虚拟代理测试现在通过 `Proxies.virtualProxy(CustomMap.class, CustomHashMap::new)` 创建 `CustomMap`。\n\
  \n```java\n//:~ core/src/main/.../ch03/virtual/VirtualProxyDemo.java\nCustomMap<String,\
  \ Integer> map =\n    Proxies.virtualProxy(CustomMap.class,\n        CustomHashMap::new);\n\
  System.out.println(\"Virtual Map created\");\nmap.put(\"one\", 1); // 作为副作用创建 CustomHashMap\n\
  map.put(\"life\", 42);\nSystem.out.println(\"map.get(\\\"life\\\") = \" + map.get(\"\
  life\"));\nSystem.out.println(\"map.size() = \" + map.size());\nSystem.out.println(\"\
  clearing map\");\nmap.clear();\nSystem.out.println(\"map.size() = \" + map.size());\n\
  ```\n\nListing 3.24: `VirtualProxyDemo`。\n\n输出与我们在列表 2.5 中的手工虚拟代理完全相同。\n\n## 同步动态代理\
  \ (Synchronized dynamic proxy)\n\n我们不需要像在列表 2.15 中那样手工制作一个同步保护代理，而是编写一个 `SynchronizedHandler`。它会同步所有对\
  \ `subject` 方法的调用，并使用 `proxy` 作为我们的监视锁。\n\n\n\n\n\n```\n//:~ core/src/main/.../handlers/SynchronizedHandler.java\n\
  public final class SynchronizedHandler<S>\n    implements InvocationHandler, Serializable\
  \ {\n  private static final long serialVersionUID = 1L;\n  private final S subject;\n\
  \  public SynchronizedHandler(S subject) {\n    this.subject = subject;\n  }\n \
  \ @Override\n  public Object invoke(Object proxy, Method method,\n             \
  \          Object[] args) throws Throwable {\n    // 对代理实例（proxy）进行同步处理，这类似于\n \
  \   // Vector 和 Collections.synchronizedList() 的工作方式\n    synchronized (proxy) {\n\
  \      return method.invoke(subject, args);\n    }\n  }\n}\n```\n\nListing 3.25:\
  \ `SynchronizedHandler`。\n\n我们的 `Proxies` 外面类现在有了一个静态工厂方法 `synchronizedProxy()`。\n\
  \n```java\n//:~ core/src/main/.../Proxies.java\npublic static <S> S synchronizedProxy(\n\
  \    Class<? super S> subjectInterface, S subject) {\n  Objects.requireNonNull(subject,\
  \ \"subject==null\");\n  return castProxy(subjectInterface,\n      new SynchronizedHandler<>(subject));\n\
  }\n```\n\nListing 3.26: `Proxies.synchronizedProxy()`。\n\n我们可以通过来自 Listing 2.16\
  \ 的 `SynchronizedTest` 来验证同步工作是否符合预期。\n\n```java\n//:~ core/src/test/.../ch03/protection/SynchronizedTest.java\n\
  public class SynchronizedTest extends ConcurrentTest {\n  @Test\n  public void testDynamicSynchronizedProxy()\
  \ {\n    check(Proxies.synchronizedProxy(\n        CustomMap.class, new CustomHashMap<>()\n\
  \    ));\n  }\n}\n```\n\nListing 3.27: `SynchronizedTest`。\n\n我们的 `SynchronizedTest`\
  \ 的输出证明了它可能运行正常。是的，这是一种谨慎的措辞，但很难证明 Bug 的不存在，尤其是在并发代码中。\n\n```\nCustomHashMap constructed\n\
  Checking $Proxy0\nentries = 46000\nmap.size() = 46000\n```\n\nListing 3.28: `SynchronizedTest`\
  \ 的输出。\n\n### 级联多个动态代理\n\n在上一章中，我们级联了一个同步保护代理和一个虚拟代理。我们可以对新创建的动态代理执行同样的操作。注意，我们需要在调用\
  \ `virtualProxy()` 时添加一个类型证言（type witness），以指定泛型类型 `S` 是 `CustomMap<Integer, Integer>`。否则，编译器会将我们的虚拟代理转换为\
  \ `CustomHashMap`，导致导致 `ClassCastException`。\n\n```java\n//:~ core/src/test/.../ch03/protection/SynchronizedVirtualTest.java\n\
  public class SynchronizedVirtualTest extends ConcurrentTest {\n  @Test\n  public\
  \ void testDynamicSynchronizedVirtualProxy() {\n    CustomMap<Integer, Integer>\
  \ map =\n        Proxies.synchronizedProxy(CustomMap.class,\n            Proxies.<CustomMap<Integer,\
  \ Integer>>virtualProxy(\n                CustomMap.class, CustomHashMap::new));\n\
  \    check(map);\n    System.out.println(\"map = \" + map);\n  }\n}\n```\n\nListing\
  \ 3.29: `SynchronizedVirtualTest`。\n\n我们的 `SynchronizedVirtualTest` 的输出所示 Listing\
  \ 3.30。\n\n```\nChecking $Proxy0\nCustomHashMap constructed\nentries = 46000\nmap.size()\
  \ = 46000\nmap = {0=0, 1=1, 2=4, 3=9, 4=16, 5=25, ..., 45999=2115908001}\n```\n\n\
  Listing 3.30: 级联动态代理的输出。\n\n这一次，`toString()` 方法由我们的动态代理自动地路由了。\n\n## 带有动态代理的 `EnhancedStream`\n\
  \n我最近发现了动态代理的一个很棒用例。Java 8 的 streams 在如何实现 `distinct()` 方面观点相当狭隘。如果两个对象是 `equal()`，那么它们就是不同的，且通常保留第一个元素并丢弃后续元素。\n\
  \n如果我们想要一种不同的相等性定义呢？仿照乔治·奥威尔的《动物农场》的话说，当两个对象相等时，一个对象能比另一个更“相等”吗？\n\n例如，`ArrayDeque`\
  \ 有两个 `clone()` 方法，一个返回 `Object`，另一个返回 `ArrayDeque`。在决定保留哪一个时，我们应该选择返回类型派生得最多的那个：`ArrayDeque\
  \ clone()`。`Stream` 中普通的 `distinct()` 方法无法做出这种选择。\n\n`Stream` 的优秀特性之一是它的流式接口。一旦我们有了一个\
  \ `Stream`，许多方法都会返回相同的 `Stream` 类型，这样我们就可以链式调用方法。如果我们增强流，那么这些方法也应该返回我们的 `EnhancedStream`。\n\
  \n我们在 Listing 3.31 中的接口 `EnhancedStream` 扩展了 `Stream` 并添加了一个新的 `distinct()` 方法。它还重写了所有返回\
  \ `Stream` 的方法，改为返回 `EnhancedStream`。最后，我们有两个用于创建流的静态工厂方法。\n\n```java\n//:~ core/src/main/.../ch03/enhancedstream/EnhancedStream.java\n\
  /**\n * The Java Specialists Newsletters 中描述：\n * https://www.javaspecialists.eu/archive/Issue274.html\n\
  \ * https://www.javaspecialists.eu/archive/Issue275.html\n */\npublic interface\
  \ EnhancedStream<T> extends Stream<T> {\n  // 新的增强 distinct\n  EnhancedStream<T>\
  \ distinct(ToIntFunction<T> hashCode,\n                             BiPredicate<T,\
  \ T> equals);\n  EnhancedStream<T> distinct(Function<T, ?> keyGenerator,\n     \
  \                        BinaryOperator<T> merger);\n\n  // 增强的继承方法\n  EnhancedStream<T>\
  \ filter(Predicate<? super T> predicate);\n  <R> EnhancedStream<R> map(Function<?\
  \ super T, ? R> mapper);\n  <R> EnhancedStream<R> flatMap(Function<? super T, ?\
  \ extends R>> mapper);\n  EnhancedStream<T> distinct();\n  EnhancedStream<T> sorted();\n\
  \  EnhancedStream<T> sorted(Comparator<? super T> comparator);\n  EnhancedStream<T>\
  \ peek(Consumer<? super T> action);\n  EnhancedStream<T> limit(long maxSize);\n\
  \  EnhancedStream<T> skip(long n);\n  EnhancedStream<T> takeWhile(Predicate<? super\
  \ T> predicate);\n  EnhancedStream<T> dropWhile(Predicate<? super T> predicate);\n\
  \  EnhancedStream<T> sequential();\n  EnhancedStream<T> parallel();\n  EnhancedStream<T>\
  \ unordered();\n  EnhancedStream<T> onClose(Runnable closeHandler);\n\n  // 静态工厂方法\n\
  \  @SafeVarargs\n  @SuppressWarnings(\"varargs\")\n  static <E> EnhancedStream<E>\
  \ of(E... elements) {\n    return from(Stream.of(elements));\n  }\n  @SuppressWarnings(\"\
  unchecked\")\n  static <E> EnhancedStream<E> from(Stream<E> stream) {\n    return\
  \ (EnhancedStream<E>) Proxy.newProxyInstance(\n        EnhancedStream.class.getClassLoader(),\n\
  \        new Class<?>[] {EnhancedStream.class},\n        new EnhancedStreamHandler<>(stream)\n\
  \    );\n  }\n}\n```\n\nListing 3.31: `EnhancedStream<T>`。\n\n\n\n\n\n```java\n\
  //:~ core/src/main/.../ch03/enhancedstream/EnhancedStreamHandler.java\npublic class\
  \ EnhancedStreamHandler<T>\n    implements InvocationHandler {\n  private Stream<T>\
  \ delegate;\n\n  public EnhancedStreamHandler(Stream<T> delegate) {\n    this.delegate\
  \ = delegate;\n  }\n\n  @Override\n  @SuppressWarnings(\"unchecked\")\n  public\
  \ Object invoke(Object proxy, Method method,\n                       Object[] args)\
  \ throws Throwable {\n    if (method.getReturnType() == EnhancedStream.class) {\n\
  \      if (method.equals(ENHANCED_DISTINCT)) {\n        distinct((ToIntFunction<T>)\
  \ args[0],\n            (BiPredicate<T, T>) args[1],\n            (BinaryOperator<T>)\
  \ args[2]);\n      } else if (method.equals(ENHANCED_DISTINCT_WITH_KEY)) {\n   \
  \     distinct((Function<T, ?>) args[0],\n            (BinaryOperator<T>) args[1]);\n\
  \      } else {\n        Method match = methodMap.get(method);\n        this.delegate\
  \ = (Stream<T>) match.invoke(delegate, args);\n      }\n      return proxy;\n  \
  \  } else {\n      return method.invoke(this.delegate, args);\n    }\n  }\n\n  private\
  \ void distinct(ToIntFunction<T> hashCode,\n                        BiPredicate<T,\
  \ T> equals,\n                        BinaryOperator<T> merger) {\n    distinct(t\
  \ -> new Key<>(t, hashCode, equals), merger);\n  }\n  private void distinct(Function<T,\
  \ ?> keyGen,\n                        BinaryOperator<T> merger) {\n    delegate\
  \ = delegate.collect(Collectors.toMap(keyGen::apply,\n        Function.identity(),\
  \ merger, LinkedHashMap::new))\n                   .values()\n                 \
  \  .stream();\n  }\n\n  private static final class Key<E> {\n    private final E\
  \ e;\n    private final ToIntFunction<E> hashCode;\n    private final BiPredicate<E,\
  \ E> equals;\n\n    public Key(E e, ToIntFunction<E> hashCode,\n               BiPredicate<E,\
  \ E> equals) {\n      this.e = e;\n      this.hashCode = hashCode;\n      this.equals\
  \ = equals;\n    }\n\n    @Override\n    public int hashCode() {\n      return hashCode.applyAsInt(e);\n\
  \    }\n\n    @Override\n    public boolean equals(Object obj) {\n      if (!(obj\
  \ instanceof Key)) return false;\n      @SuppressWarnings(\"unchecked\")\n     \
  \ Key<E> that = (Key<E>) obj;\n      return equals.test(this.e, that.e);\n    }\n\
  \  }\n\n  private static final Method ENHANCED_DISTINCT;\n  private static final\
  \ Method ENHANCED_DISTINCT_WITH_KEY;\n\n  static {\n    try {\n      ENHANCED_DISTINCT\
  \ =\n          EnhancedStream.class.getMethod(\n              \"distinct\", ToIntFunction.class,\
  \ BiPredicate.class,\n              BinaryOperator.class);\n      ENHANCED_DISTINCT_WITH_KEY\
  \ =\n          EnhancedStream.class.getMethod(\n              \"distinct\", Function.class,\
  \ BinaryOperator.class);\n    } catch (NoSuchMethodException e) {\n      throw new\
  \ Error(e);\n    }\n  }\n\n  // methodMap contains a map from all non-static Stream\
  \ methods\n  // to the matching EnhancedStream methods\n  private static final Map<Method,\
  \ Method> methodMap =\n      Stream.of(Stream.class.getMethods())\n          .filter(m\
  \ -> !Modifier.isStatic(m.getModifiers()))\n          .collect(Collectors.toUnmodifiableMap(\n\
  \              EnhancedStreamHandler::getEnhancedStreamMethod,\n              Function.identity()));\n\
  \n  // since EnhancedStream is a subclass of Stream, it has to\n  // contain all\
  \ the methods of Stream. We can safely do the\n  // lookup, throwing an Error if\
  \ we cannot find a method\n  private static Method getEnhancedStreamMethod(Method\
  \ m) {\n    try {\n      return EnhancedStream.class.getMethod(\n          m.getName(),\
  \ m.getParameterTypes());\n    } catch (NoSuchMethodException e) {\n      throw\
  \ new Error(e);\n    }\n  }\n}\n```\n\n列表 3.32: `EnhancedStreamHandler<T>`。\n\n\
  例如，`EnhancedStreamDemo` 展示了当我们使用增强型流为 `ArrayDeque` 和 `ConcurrentSkipListSet` 创建去重方法时发生的情况。\n\
  \n```java\n//:~ core/src/main/.../ch03/enhancedstream/EnhancedStreamDemo.java\n\
  public class EnhancedStreamDemo {\n  public static void main(String... args) {\n\
  \    System.out.println(\"Normal ArrayDeque clone() Methods:\");\n    Stream.of(ArrayDeque.class.getMethods())\n\
  \        .filter(method -> method.getName().equals(\"clone\"))\n        .distinct()\n\
  \        .forEach(EnhancedStreamDemo::print);\n\n    System.out.println();\n\n \
  \   System.out.println(\"Distinct ArrayDeque:\");\n    EnhancedStream.of(ArrayDeque.class.getMethods())\n\
  \        .filter(method -> method.getName().equals(\"clone\"))\n        .distinct(HASH_CODE,\
  \ EQUALS, MERGE)\n        .forEach(EnhancedStreamDemo::print);\n\n    System.out.println();\n\
  \n    System.out.println(\"Normal ConcurrentSkipListSet:\");\n    Stream.of(ConcurrentSkipListSet.class.getMethods())\n\
  \        .filter(method -> method.getName().contains(\"Set\"))\n        .distinct()\n\
  \        .sorted(METHOD_COMPARATOR)\n        .forEach(EnhancedStreamDemo::print);\n\
  \n    System.out.println();\n\n    System.out.println(\"Distinct ConcurrentSkipListSet:\"\
  );\n    EnhancedStream.of(ConcurrentSkipListSet.class.getMethods())\n        .filter(method\
  \ -> method.getName().contains(\"Set\"))\n        .distinct(HASH_CODE, EQUALS, MERGE)\n\
  \        .forEach(EnhancedStreamDemo::print);\n  }\n\n  private static void print(Method\
  \ m) {\n    System.out.println(\n        Stream.of(m.getParameterTypes())\n    \
  \        .map(Class::getSimpleName)\n            .collect(Collectors.joining(\"\
  , \", m.getName() + \"(\", \")\"))));\n  }\n\n  public static final ToIntFunction<Method>\
  \ HASH_CODE =\n      method -> method.hashCode();\n\n  public static final BiPredicate<Method,\
  \ Method> EQUALS =\n      (method1, method2) ->\n          method1.getName().equals(method2.getName())\
  \ &&\n              method1.getParameterCount() == method2.getParameterCount() &&\n\
  \              Arrays.equals(method1.getParameterTypes(),\n                  method2.getParameterTypes());\n\
  \n  public static final BinaryOperator<Method> MERGE =\n      (method1, method2)\
  \ -> {\n        if (method1.getReturnType().isAssignableFrom(method2.getReturnType()))\n\
  \          return method2;\n        if (method2.getReturnType().isAssignableFrom(method1.getReturnType()))\n\
  \          return method1;\n        throw new IllegalArgumentException(\n      \
  \      \"Conflicting return types \"\n                method1.getReturnType().getCanonicalName()\
  \ +\n                \" and \" +\n                method2.getReturnType().getCanonicalName());\n\
  \      };\n\n  public static final Comparator<Method> METHOD_COMPARATOR =\n    \
  \  Comparator.comparing(Method::getName)\n          .thenComparing(method ->\n \
  \                            Arrays.toString(\n                                \
  \ method.getParameterTypes()));\n}\n```\n\n列表 3.33: `EnhancedStreamDemo`。\n\n输出显示我们的\
  \ `EnhancedStream` 返回按名称和参数唯一的方法。此外，它总是保留返回类型更具体的方法。因此，`ArrayDeque clone()` 和 `NavigableSet\
  \ headSet(Object)` 被保留，而 `Object clone()` 和 `SortedSet headSet(Object)` 被丢弃了。\n\n\
  ```\nNormal ArrayDeque clone() Methods:\n  ArrayDeque clone()\n  Object clone()\n\
  \nDistinct ArrayDeque:\n  ArrayDeque clone()\n\nNormal ConcurrentSkipListSet:\n\
  \  NavigableSet descendingSet()\n  NavigableSet headSet(Object, boolean)\n  SortedSet\
  \ headSet(Object)\n  NavigableSet headSet(Object)\n  NavigableSet subSet(Object,\
  \ boolean, Object, boolean)\n  NavigableSet subSet(Object, Object)\n  SortedSet\
  \ subSet(Object, Object)\n  NavigableSet tailSet(Object, boolean)\n  SortedSet tailSet(Object)\n\
  \  NavigableSet tailSet(Object)\n\nDistinct ConcurrentSkipListSet:\n  NavigableSet\
  \ descendingSet()\n  NavigableSet headSet(Object, boolean)\n  NavigableSet headSet(Object)\n\
  \  NavigableSet subSet(Object, boolean, Object, boolean)\n  NavigableSet subSet(Object,\
  \ Object)\n  NavigableSet tailSet(Object, boolean)\n  NavigableSet tailSet(Object)\n\
  ```\n\n列表 3.34: `EnhancedStreamDemo` 的输出。\n\n\n\n\n\n在 [The Java Specialists' Newsletter\
  \ 274](https://www.javaspecialists.eu/archive/Issue274.html) 中，我们读到如何手工构建一个 `EnhancedStream`\
  \ 装饰器。这是非常单调且重复的工作。我们必须实现所有方法并费力地对它们进行委托。我们的动态代理解决方案只有一个方法 `invoke()`，其中包含了针对三种不同类型方法的逻辑。\n\
  \n我们的动态代理方法也存在一些缺点。对于某些被代理的方法，可能会有轻微的方法调用开销。例如，每当我们的返回类型为 `EnhancedStream` 时，都需要进行一次\
  \ map 查找。我们将在下一章中学习如何使用一种特殊的 map（我们称之为 `VTable`）来提高速度。现在，我们可以沉浸在避免了反复重复编写相同代码段的满足感中。\n\
  \n## 动态代理的局限性\n\n### 请仅限接口\n\n最大的限制之一是，我们只能代理接口，因为它们派生自 `java.lang.reflect.Proxy`。Java\
  \ 不支持多类继承。\n\n当类由我们自己时，我们可以尝试将类重构为接口。但当我们尝试代理第三方类时，这将无济于。\n\n像 `CGLib` 这样的工具可以创建类的动态代理，但它们并不是标准\
  \ JDK 的。\n\n### `UndeclaredThrowableException`\n\n虽然 `invoke` 方法定义为抛出任何 `Throwable`，但我们允许抛出在代理方法中声明的检查异常（checked\
  \ exceptions）。\n\n```java\n//:~ core/src/main/.../ch03/gotchas/UndeclaredExceptionThrown.java\n\
  public class UndeclaredExceptionThrown {\n  public static void main(String... args)\
  \ {\n    Runnable job = Proxies.castProxy(\n        Runnable.class,\n        (proxy,\
  \ method, params) -> {\n          // 将封装为 UndeclaredThrowableException\n       \
  \   throw new IOException(\"bad exception\");\n        });\n    job.run();\n  }\n\
  }\n```\n\nListing 3.35: `UndeclaredExceptionThrown`。\n\n当我们在 `Runnable` 上调用 `run()`\
  \ 时，检查异常 `IOException` 被包装在未检查异常 `UndeclaredThrowableException` 中。这仅适用于不属于代理接口方法签的检查异常。\n\
  \n```text\nException in \"main\" java.lang.reflect.UndeclaredThrowableException\n\
  \tat com.sun.proxy.$Proxy0.run(Unknown Source)\n\tat UndeclaredExceptionThrown.main()\n\
  Caused by: java.io.IOException: bad exception\n\tat UndeclaredExceptionThrown.lambda$main$0()\n\
  \t... 2 more\n```\n\nListing 3.36: 异常导致了未检查的 `UndeclaredThrowableException`。\n\n\
  ### 神秘的 `com.sun.proxy.Proxy$0` 类\n\n如所述，代理类的名称通常遵循命名约定：公共接口使用 `com.sun.proxy.Proxy$0`，包级访问访问接口使用\
  \ `packagename.Proxy$0`。当接口未从模块中导出时，代理位于一个非导出的包中：例如 `com.sun.proxy.jdk.proxy1`。\n\
  \n```java\n//:~ core/src/main/.../ch03/gotchas/ProxyNaming.java\npublic class ProxyNaming\
  \ {\n  public interface PublicNotExported {\n    void open();\n  }\n  interface\
  \ Hidden {\n    void mystery();\n  }\n  public static void main(String... args)\
  \ {\n    show(BaseComponent.class); // 从模块导出\n    show(PublicNotExported.class);\n\
  \    show(Hidden.class);\n  }\n  private static void show(Class<?> intf) {\n   \
  \ System.out.println(Proxies.simpleProxy(\n        intf, null).getClass());\n  }\n\
  }\n```\n\nListing 3.37: `ProxyNaming`。\n\n输出很可能是我们在 Listing 3.38 中看到的。\n\n```text\n\
  class com.sun.proxy.$Proxy0\nclass com.sun.proxy.jdk.proxy1.$Proxy1\nclass eu.javaspecialists.books.dynamicproxies.ch03.gotchas.$Proxy2\n\
  ```\n\nListing 3.38: `ProxyNaming` 的输出。\n\nJava 语言规范并没有规定代理必须遵循此命名约定，但这是 OpenJDK\
  \ 目前的实现方式。请注意，当我们为公共接口创建代理时，这些类会被添加到 `com.sun.proxy` 包中。然而，当我们为非公共接口创建代理时，类必须与接口处于同一个包中——在我们的示例中，是\
  \ `eu.javaspecialists.books.dynamicproxies.ch03`。\n\n### 更深的调用栈\n\n我们的调用栈也可能包含对\
  \ `$Proxy0` 和反射方法调用的引用。像 [IntelliJ IDEA](https://www.jetbrains.com/idea/) 这样的 IDE\
  \ 可能会隐藏这些细节，如图 9 所示。\n\n![StackTraceFiltering](img/StackTraceFiltering.png)\n\n\
  图 9: 代理方法调用的堆栈跟踪。\n\n这是一个使用递归动态代理计算阶的示例。在德语中，我们将这个例子称为 *“an den Haaren herbeigezogen”*，意思是我们是揪着头发把它拉过来的。换句话说，这是一种编写阶代码代码极不实际的方法，仅用于说明递归动态代理调用可能是什么样子。请不要写这样的代码！\n\
  \n```java\n//:~ core/src/main/.../ch03/gotchas/RecursiveDynamicProxy.java\n/**\n\
  \ * 展示递归调用的荒谬示例。\n * 请不要写这样的代码！\n */\npublic class RecursiveDynamicProxy {\n  public\
  \ static void main(String... args) {\n    IntFunction<BigInteger> factorial =\n\
  \        Proxies.castProxy(IntFunction.class,\n            new Factorial());\n \
  \   System.out.println(factorial.apply(5));\n  }\n\n  private static class Factorial\
  \ implements InvocationHandler {\n    private final MethodKey apply =\n        MethodKey(IntFunction.class,\
  \ \"apply\");\n\n    @Override\n    public Object invoke(Object proxy, Method method,\
  \ Object[] params) throws Throwable {\n      if (new MethodKey(method).equals(apply))\
  \ {\n        int n = (int) params[0];\n        if (n == 0) {\n          Thread.dumpStack();\n\
  \          return BigInteger.ONE;\n        }\n        BigInteger other = (BigInteger)\
  \ method.invoke(\n            proxy, n - 1);\n        return BigInteger.valueOf(n).multiply(other);\n\
  \      } else {\n        throw new UnsupportedOperationException(\n            \"\
  only apply(int) supported\");\n      }\n    }\n  }\n}\n```\n\nListing 3.39: `RecursiveDynamicProxy`。\n\
  \n输出类似于 3.40。为了适应输出，省略了堆栈跟踪的某些细节。\n\n```text\njava.lang.Exception: Stack trace\n\
  \    at java.base/Thread.dumpStack()\n    at RecursiveDynamicProxy$Factorial.invoke()\n\
  \    at com.sun.proxy.$Proxy0.apply(Unknown Source)\n    at java.base/NativeMethodAccessor.invoke0()\n\
  \    at java.base/NativeMethodAccessor.invoke()\n    at java.base/DelegatingMethodAccessor.invoke()\n\
  \    at java.base/Method.invoke()\n    at RecursiveDynamicProxy$Factorial.invoke()\n\
  \    at com.sun.proxy.$Proxy0.apply(Unknown Source)\n    at java.base/NativeMethodAccessor.invoke0()\n\
  \    at java.base/NativeMethodAccessor.invoke()\n    at java.base/DelegatingMethodAccessor.invoke()\n\
  \    at java.base/Method.invoke()\netc.\n```\n\nListing 3.40: 得益于动态代理和反射的深层调用栈。\n\
  \n调用栈中的额外的行可能只会造成轻小的困扰。如果它们导致了 `StackOverflowError`，那么在那种情况下，避免使用代理或通过 JVM 参数 `-Xss`\
  \ 增加线程栈的大小是合适的。\n\n### 泄露的抽象\n\n动态代理目前被视为普通的 Java 类，尽管是动态创建的。这使得基础设施代码泄露给了用户。如果能够从用户处隐藏这些类将会更好。\n\
  \n\n\n\n\n在写作时，[JEP 371](https://openjdk.java.net/jeps/371) 的目标是 Java 15，并建议引入 `hidden\
  \ classes`（隐藏类）。这些类无法被其他类的字节码直接使用，而是通过框架代码通过反射来访问。\n\n`hidden classes` 有许多优点：它们的方法不会出现在堆栈跟踪轨迹中。它们更容易被卸载。访问控制更加精细且严格。\n\
  \n### 共享代理类\n\nJava 试图尽量减少其创建的动态代理类的数量。每当我们调用 `Proxy.newProxyInstance()` 时，它都会检查之前是否已经为给定的类加载器和目标接口组合创建过动态代理。接口在数组内部存储的顺序是有重要的。如果找到了动态代理类，则将使用它来创建代理对象。`InvocationHandler`\
  \ 总是被传递给 `java.lang.reflect.Proxy` 超类，所有的动态代理类都派生自该类。\n\n例如，考虑列表 3.41 中的 `ProxyClassesByInterface`。`Collection`\
  \ 继承自 `Iterable`，因此我们可以认为由 `Collection` 和 `Iterable` 组合成的代理等同于仅包含 `Collection` 的代理。然而，我们看到对于每种接口组合，都会创建唯一的代理类。\n\
  \n```\n//:~ core/src/main/.../ch03/gotchas/ProxyClassesByInterface.java\npublic\
  \ class ProxyClassesByInterface {\n  static final InvocationHandler BLANK = (p,\
  \ m, a) -> null;\n  public static void main(String... args) {\n    test(Iterable.class,\
  \ Collection.class); // $Proxy0\n    test(Iterable.class, Collection.class); //\
  \ $Proxy0\n    test(Iterable.class); // $Proxy1\n    test(Collection.class); //\
  \ $Proxy2\n    test(Collection.class, Iterable.class); // $Proxy3\n    test(Iterable.class,\
  \ Collection.class); // $Proxy0\n  }\n  private static void test(Class<?>... targetInterfaces)\
  \ {\n    Object proxy = Proxy.newProxyInstance(\n        ProxyClassesByInterface.class.getClassLoader(),\n\
  \        targetInterfaces,\n        BLANK\n    );\n    System.out.println(proxy.getClass());\n\
  \  }\n}\n```\n\n列表 3.41：`ProxyClassesByInterface`。\n\nJava 在其动态代理类的缓存中使用弱引用，以确保我们不会发生类加载器泄漏。\n\
  \n### 动态代理的性能\n\n动态代理属于基础设施和框架代码领域。我们的动态代码极有可能被调用数十亿次。因此，了解如何对这类代码进行基准测试并确保它们运行足够快至关重要。\n\
  \n调用动态代理的方法可能较慢，原因有几点：\n\n*   原始返回类型和参数需要装箱为相应的包装对象。当原始值超出它们的缓存范围时，这可能会增加对象创建的开销。\n\
  *   参数需要封装进数组。如果该数组逃逸了 `InvocationHandler.invoke()` 方法，则可能无法通过逃逸分析被消除。\n*   `Method`\
  \ 类存在健忘症问题——它在每次调用时都会检查权限。我们尝试通过列表 3.11 所示的加速（turbo-boost）机制来消除这种代价。\n*   所有动态代理都派生自单一的\
  \ `java.lang.reflect.Proxy` 类，该类存储了我们 `InvocationHandler` 的引用。当一个字段始终持有接口的一种实现时，调用该字段值上方法的调用点是单态的（monomorphic），而不是多态的（polymorphic）。HotSpot\
  \ 编译器对单态和双态有优化。对于单态，编译器可以在运行时内联方法调用。然而，由于动态代理可以持有 `InvocationHandler` 的多个实现之一，HotSpot\
  \ 可能无法内联到 `invoke()` 方法调用，从而使其变为元态的（megamorphic）。关于多态性能的更多信息，请参阅 [The Java Specialists'\
  \ Newsletter](https://www.javaspecialists.eu/) 中的 [“Polymorphism Performance Mysteries”](https://www.javaspecialists.eu/archive/Issue157.html)\
  \ 和 [“Polymorphism Performance Mysteries Explained”](https://www.javaspecialists.eu/archive/Issue158.html)。\n\
  \n想要编写性能关键代码的程序员需要知道如何对代码进行基准测试。运行基准测试的推荐工具是 [Java Microbenchmark Harness](https://openjdk.java.net/projects/code-tools/jmh/)\
  \ (JMH)。\n\n对于我们的实验，我们定义了一个带有两个方法的 `Worker` 接口：`increment()` 和 `consumeCPU()`。`increment()`\
  \ 方法返回一个 `long`，它将通过自动装箱转换为 `Long` 对象。`consumeCPU()` 方法返回 `void`，因此不需要创建对象。\n\n\
  ```\n//:~ benchmark/src/main/.../ch03/benchmarks/Worker.java\npublic interface Worker\
  \ {\n  long increment();\n  void consumeCPU();\n}\n```\n\n列表 3.42：`Worker`。\n\n\
  我们的 `RealWorker` 实现 `Worker`。在 `increment()` 方法中，它递增一个 `long` 类型字段并返回新值。在 `consumeCPU()`\
  \ 方法中，它使用 JMH 的 `Blackhole` 类来消耗几个 CPU 周期。\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/RealWorker.java\n\
  public class RealWorker implements Worker {\n  private long counter = 0;\n  @Override\n\
  \  public long increment() {\n    return counter++;\n  }\n  @Override\n  public\
  \ void consumeCPU() {\n    Blackhole.consumeCPU(2);\n  }\n}\n```\n\n列表 3.43：`RealWorker`。\n\
  \n我们的 `ProxyWorker` 遵循代理模式并指向 `RealWorker`。\n\n```\n//:~ benchmark/src/main/.../ch03/benchmarks/ProxyWorker.java\n\
  public class ProxyWorker implements Worker {\n  private final RealWorker worker\
  \ = new RealWorker();\n  @Override\n  public long increment() {\n    return worker.increment();\n\
  \  }\n  @Override\n  public void consumeCPU() {\n    worker.consumeCPU();\n  }\n\
  }\n```\n\n列表 3.44：`ProxyWorker`。\n\n在我们的 `MethodCallBenchmark` 中，有五种调用 `increment()`\
  \ 和 `consumeCPU()` 的方式：\n\n*   `directCall` 直接在 `RealWorker` 实例上调用方法。\n*   `staticProxy`\
  \ 调用 `ProxyWorker` 实例的方法，然后它将调用委托给 `RealWorker`。\n*   `dynamicProxyThenDirectCall`\
  \ 创建 `Worker` 的动态代理，但直接委托给 `RealWorker` 的方法。\n*   `dynamicProxyThenReflectiveCall`\
  \ (turbo) 是我们 `Worker` 的动态代理，它使用给定的 `method` 参数通过反射调用将方法委托给 `RealWorker` 实例。该动态代理实例经过了加速（turbo-boosted）。\n\
  *   `dynamicProxyThenReflectiveCall` (no turbo) 与上相同，但没有加速。\n\n\n\n\n\n```java\n\
  //:~ benchmark/src/main/.../ch03/benchmarks/MethodCallBenchmark.java\n@Fork(value\
  \ = 3, jvmArgsAppend = \"-XX:+UseParallelGC\")\n@Warmup(iterations = 5, time = 3)\n\
  @Measurement(iterations = 10, time = 3)\n@BenchmarkMode(Mode.AverageTime)\n@OutputTimeUnit(TimeUnit.NANOSECONDS)\n\
  @State(Scope.Benchmark)\npublic class MethodCallBenchmark {\n  // direct call to\
  \ RealWorker\n  private final RealWorker realWorker = new RealWorker();\n\n  //\
  \ static proxies\n  private final Worker staticProxy = new ProxyWorker();\n\n  //\
  \   dynamic proxies\n  private final Worker dynamicProxyDirectCallIncrement =\n\
  \      Proxies.castProxy(Worker.class,\n          (proxy, method, args) -> realWorker.increment());\n\
  \  private final Worker dynamicProxyDirectCallConsumeCPU =\n      Proxies.castProxy(Worker.class,\n\
  \          (proxy, method, args) -> {\n            realWorker.consumeCPU();\n  \
  \          return null;\n          });\n  private final Worker dynamicProxyReflectiveCall\
  \ =\n      Proxies.castProxy(Worker.class,\n          (proxy, method, args) ->\n\
  \              method.invoke(realWorker, args));\n\n  @Benchmark\n  public long\
  \ directCallIncrement() {\n    return realWorker.increment();\n  }\n  @Benchmark\n\
  \  public long staticProxyIncrement() {\n    return staticProxy.increment();\n \
  \ }\n  @Benchmark\n  public long dynamicProxyDirectCallIncrement() {\n    return\
  \ dynamicProxyDirectCallIncrement.increment();\n  }\n  @Benchmark\n  public long\
  \ dynamicProxyReflectiveCallIncrement() {\n    return dynamicProxyReflectiveCall.increment();\n\
  \  }\n\n  @Benchmark\n  public void directCallConsumeCPU() {\n    realWorker.consumeCPU();\n\
  \  }\n  @Benchmark\n  public void staticProxyConsumeCPU() {\n    staticProxy.consumeCPU();\n\
  \  }\n  @Benchmark\n  public void dynamicProxyDirectCallConsumeCPU() {\n    dynamicProxyDirectCallConsumeCPU.consumeCPU();\n\
  \  }\n  @Benchmark\n  public void dynamicProxyReflectiveCallConsumeCPU() {\n   \
  \ dynamicProxyReflectiveCall.consumeCPU();\n  }\n}\n```\n\nListing 3.45: `MethodCallBenchmark`。\n\
  \n我们的 `MethodCallBenchmark` 结果运行在配备六核 i9 的 MacBook Pro (2018) 上，使用 Java 14+36-1461\
  \ 并带有吞吐量收集器。所有单位均为纳秒/操作。\n\n### `increment()` 的结果\n\n我们的结果表显示，在 Java 14 中，`dynamicProxyDirectCall`\
  \ 比 `staticProxy` 慢了约 1.4 纳秒。在 Java 13 中，差异大约为 2.6 纳秒，因为 `increment()` 返回的每个原始 `long`\
  \ 都装箱为 `Long` 对象，每次方法调用产生 24 字节垃圾。\n\n在 `dynamicProxyReflectiveCall` 中通过反射调用 `Method`\
  \ 对象又增加了 3.1 纳秒，如果我们关闭睿频加速（turbo boost），该值会进一步增加 1.4 纳秒。在我们尝试过的所有 Java 版本中，`dynamicProxyReflectiveCall`\
  \ 都会为返回的 Integer 为方法调用分配 24 字节。\n\n| Benchmark 测试 `increment()` | ns/op ± 误差 |\n\
  | :--- | :--- |\n| directCall | 1.957 ± 0.004 |\n| staticProxy | 2.369 ± 0.018 |\n\
  | dynamicProxyDirectCall | 3.726 ± 0.016 |\n| dynamicProxyReflectiveCall (turbo)\
  \ | 6.853 ± 0.201 |\n| dynamicProxyReflectiveCall (no turbo) | 8.238 ± 0.282 |\n\
  \n### `consumeCPU()` 的结果\n\n`consumeCPU()` 的结果接近得多，因为我们没有装箱成本。`dynamicProxyDirectCall`\
  \ 比 `staticProxy` 慢约 0.7 纳秒。在 `dynamicProxyReflectiveCall` 中通过反射调用 `Method` 对象仅增加\
  \ 0.8 纳秒，如果我们关闭睿频加速，这会进一步增加 1.7 纳秒。\n\n| Benchmark 测试 `consumeCPU()` | ns/op ± 误差\
  \ |\n| :--- | :--- |\n| directCall | 3.270 ± 0.028 |\n| staticProxy | 3.788 ± 0.018\
  \ |\n| dynamicProxyDirectCall | 4.461 ± 0.020 |\n| dynamicProxyReflectiveCall (turbo)\
  \ | 5.231 ± 0.053 |\n| dynamicProxyReflectiveCall (no turbo) | 6.960 ± 0.409 |\n\
  \n### 基准结果总结\n\n对于 `increment()`，4.5 纳秒和对于 `consumeCPU()`，1.4 纳秒的方法调用开销在典型的业务逻辑中很少被察觉到。尽管如此，意识到方法调用开销略高是有好的，并且对于性能敏感的代码可能会避免使用动态代理，特别是当我们在密集循环中调用被代理的方法时。\n\
  \n# 动态装饰器 (Dynamic Decorator)\n\n装饰器在不创建子类的情况下，动态地为对象附加额外的职责。正如我们在第 1 章中看到的，装饰器用于向裸流添加功能。在本章中，我们将看到如何创建一个动态装饰器。\n\
  \n## 装饰器模式\n\n到为止，我们一直使用 Java 的动态代理来实现代理模式。我们也可以使用相同的机制创建装饰器或过滤器。图 10 显示了《四人行》（Gang-of-Four）书中描述的装饰器模式的经典结构。\n\
  \n![DecoratorStructure](img/DecoratorStructure.png)\n\n图 10. 装饰器结构。\n\n装饰器也被称为过滤器（filter）。在我看来，装饰器是“添加”，而过滤器是“取走”。如果我们想要一个真正的不可变集合，可以创建一个不包含任何变器方法的过滤器接口。以列表\
  \ 4.1 中的 `ImmutableIterable` 为例。在其中，我们去掉了 `iterator()` 方法，因为 `Iterator` 包含了 `remove()`\
  \ 方法。我们当然可以让 `iterator()` 方法返回一个 `ImmutableIterator`，但我将此留给读者作为练习。\n\n```java\n\
  //:~ core/src/main/...ch04/immutablecollection/ImmutableIterable.java\npublic interface\
  \ ImmutableIterable<E> {\n  void forEach(Consumer<? super E> action);\n  Spliterator<E>\
  \ spliterator();\n\n  // 来自 Iterable 的变器方法\n  //    Iterator<E> iterator();\n}\n\
  ```\n列表 4.1: `ImmutableIterable`。\n\n我们的 `ImmutableCollection` 还过滤掉了任何可能更改集合的方法。我们添加了一个默认方法\
  \ `printAll()`。动态代理实现了接口的所有公共方法，甚至是默认方法。在 Java 中，可以在子类中使用 `super` 关键字调用父类方法，但从外部无法这样做。例如，当类重写了\
  \ `hashCode()` 时，该类的用户无法调用默认的 `Object.hashCode()` 方法。由于这个原因，Java 提供了 `System.identityHashCode()`，以防我们需要生成与\
  \ `Object.hashCode()` 相同的哈希值。这让我们遇到了麻烦。如果该方法没有在生成的动态代理中被重写，我们可以调用默认方法，它将引导我们进入方法。幸运的是有一种技巧允许我们在接口上调用默认方法，我们在查看\
  \ `VTable` 时会看到。\n\n```java\n//:~ core/src/main/...ch04/immutablecollection/ImmutableCollection.java\n\
  public interface ImmutableCollection<E>\n    extends ImmutableIterable<E> {\n  int\
  \ size();\n  boolean isEmpty();\n  boolean contains(Object o);\n  Object[] toArray();\n\
  \  <T> T[] toArray(T[] a);\n  <T> T[] toArray(IntFunction<T> generator);\n  boolean\
  \ containsAll(Collection<?> c);\n  Stream<E> stream();\n  Stream<E> parallelStream();\n\
  \n  // 为了尝试默认方法\n  default void printAll() {\n    forEach(System.out::println);\n\
  \  }\n\n  // 过滤掉来自 Collection 的变器方法\n  //    boolean add(E e);\n  //    boolean\
  \ remove(Object o);\n  //    boolean addAll(Collection<? extends E> c);\n  //  \
  \  boolean removeAll(Collection<?> c);\n  //    boolean removeIf(Predicate<? super\
  \ E> filter);\n  //    boolean retainAll(Collection<?> c);\n  //    void clear();\n\
  }\n```\n列表 4.2: `ImmutableCollection`。\n\n为了展示如何使用它来过滤现有集合，让我们编写 `HandcodedFilter`。`ImmutableCollection`\
  \ 内部的每个方法都委托给封装的 `Collection`。你可能会同意编写这样的代码相当平庸。\n\n\n\n\n\n```java\n//:~ core/src/main/.../ch04/immutablecollection/HandcodedFilter.java\n\
  public class HandcodedFilter<E>\n    implements ImmutableCollection<E> {\n  private\
  \ final Collection<E> c;\n\n  public HandcodedFilter(Collection<E> c) {\n    this.c\
  \ = c;\n  }\n\n  @Override\n  public int size() {\n    return c.size();\n  }\n \
  \ @Override\n  public boolean isEmpty() {\n    return c.isEmpty();\n  }\n  @Override\n\
  \  public boolean contains(Object o) {\n    return c.contains(o);\n  }\n  @Override\n\
  \  public Object[] toArray() {\n    return c.toArray();\n  }\n  @Override\n  public\
  \ <T> T[] toArray(T[] a) {\n    return c.toArray(a);\n  }\n  @Override\n  public\
  \ <T> T[] toArray(IntFunction<T[]> generator) {\n    return c.toArray(generator);\n\
  \  }\n  @Override\n  public boolean containsAll(Collection<?> c) {\n    return this.c.containsAll(c);\n\
  \  }\n  @Override\n  public Spliterator<E> spliterator() {\n    return c.spliterator();\n\
  \  }\n  @Override\n  public Stream<E> stream() {\n    return c.stream();\n  }\n\
  \  @Override\n  public Stream<E> parallelStream() {\n    return c.parallelStream();\n\
  \  }\n  @Override\n  public void forEach(Consumer<? super E> action) {\n    c.forEach(action);\n\
  \  }\n}\n```\n\nListing 4.3：`HandcodedFilter`。\n\n以下是如何使用 `HandcodedFilter` 来过滤掉我们不需要支持的方法。\n\
  \n```java\n//:~ core/src/main/.../ch04/immutablecollection/HandcodedFilterDemo.java\n\
  ImmutableCollection<String> names =\n    new HandcodedFilter<>(\n        Arrays.asList(\"\
  Peter\", \"Paul\", \"Mary\"));\n// names.remove(\"Peter\"); // 无法编译\nSystem.out.println(names);\n\
  System.out.println(\"Is Mary in? \" + names.contains(\"Mary\"));\nSystem.out.println(\"\
  Are there names? \" + !names.isEmpty());\nSystem.out.println(\"Printing the names:\"\
  );\nnames.forEach(System.out::println);\nSystem.out.println(\"Class: \" +\n    \
  \                   names.getClass().getSimpleName());\n\nnames.printAll();\n```\n\
  \nListing 4.4：`HandcodedFilterDemo`。当我们运行代码时，我们会在 Listing 4.5 中看到输出。\n\n```\neu.javaspecialists.HandcodedFilter@1bfb97\n\
  Is Mary in? true\nAre there names? true\nPrinting the names:\nPeter\nPaul\nMary\n\
  Class: HandcodedFilter\nPeter\nMary\n```\n\nListing 4.5：来自 `HandcodedFilter` 的输出。\n\
  \n## 使用动态代理实现过滤器\n\n与其手动编写装饰器（decorator），我们可以使用 Java 的动态代理（dynamic proxy）来创建一个装饰器。我们的规则如下：\n\
  \n- 我们将从一个接口和一个对象创建过滤器。\n- 我们将过滤器的每个公共方法映射到该对象上。\n- 为了简单起见，我们只考虑方法名和参数类型。返回类型必须匹配，否则我们将拒绝该方法。\n\
  - 我们需要包含对默认方法（default methods）的支持。\n- 如果对象不具备过滤器中的所有方法，则构建动态过滤器应该失败。\n\nListing\
  \ 4.6 显示了 `FilterHandler`。我们编写了自己的 `VTable` 来实现虚方法表（virtual method table），这是面向对象中用于将虚方法路由到正确接收者的概念。我稍后会详细解释\
  \ `VTable` 和 `FilterHandler`。现在，知道 `VTable` 用于匹配无关接口之间的方法（包括默认方法）就足够了。`FilterHandler`\
  \ 使用[责任链设计模式](https://javaspecialists.com/p/d5)来链接多个 `VTable` 查找。在我们链的构建过程中，我们还验证了过滤器中的所有方法都有相应的处理器。\n\
  \n```java\n//:~ core/src/main/.../handlers/FilterHandler.java\npublic final class\
  \ FilterHandler implements InvocationHandler {\n  private final InvocationHandler\
  \ chain;\n\n  public FilterHandler(Class<?> filter, Object component) {\n    VTable\
  \ vt = new VTable(component.getClass(), filter);\n    VTable defaultVT = vt.getDefaultMethods(filter);\n\
  \n    chain = new ChainedInvocationHandler(vt, defaultVT);\n\n    chain.checkAllMethodsHandled();\n\
  \  }\n\n  @Override\n  public Object invoke(Object proxy, Method method, Object[]\
  \ args) throws Throwable {\n    return chain.invoke(proxy, method, args);\n  }\n\
  }\n```\n\nListing 4.6：`FilterHandler`。我们现在可以使用 `filter()` 方法创建动态过滤器。\n\n```java\n\
  //:~ core/src/main/.../Proxies.java\npublic static <F> F filter(Class<? super F>\
  \ filter, Object component) {\n  Objects.requireNonNull(component);\n  return (F)\
  \ proxy(filter, component);\n}\n```\n\nListing 4.7：`Proxies.filter()`。我们可以使用动态创建的类来过滤掉我们不想支持的方法。\n\
  \n```java\n//:~ core/src/main/.../ch04/immutablecollection/DynamicFilterDemo.java\n\
  ImmutableCollection<String> names =\n    Proxies.filter(\n        ImmutableCollection.class,\n\
  \        Arrays.asList(\"Peter\", \"Paul\", \"Mary\"));\n// names.remove(\"Peter\"\
  ); // 无法编译\nSystem.out.println(names);\nSystem.out.println(\"Is Mary in? \" + names.contains(\"\
  Mary\"));\nSystem.out.println(\"Are there names? \" + !names.isEmpty());\nSystem.out.println(\"\
  Printing the names:\");\nnames.forEach(System.out::println);\nSystem.out.println(\"\
  Class: \" +\n                       names.getClass().getSimpleName());\n```\n\n\
  Listing 4.8：`DynamicFilterDemo`。当我们运行代码时，我们会在 Listing 4.9 中看到输出。\n\n```\n[Peter,\
  \ Paul, Mary]\nIs Mary in? true\nAre there names? true\nPrinting the names:\nPeter\n\
  Paul\nMary\nClass: Proxy0\n```\n\nListing 4.9：来自 `DynamicFilter` 的输出。\n\n## InfiniteRandomDouble\
  \ 装饰器\n\n假设我们希望生成无限的 `Double` 实例，因此我们在 Listing 4.10 中编写了 `InfiniteRandomDouble`\
  \ 类。\n\n```java\n//:~ core/src/main/.../ch04/initerandom/InfiniteRandomDouble.java\n\
  /**\n * 与 Iterator 接口没有关系。\n */\npublic class InfiniteRandomDouble {\n  public boolean\
  \ hasNext() {\n    return true;\n  }\n  public Double next() {\n    return ThreadLocalRandom.current().nextDouble();\n\
  \  }\n}\n```\n\nListing 4.10：`InfiniteRandomDouble`。在后续阶段，我们意识到如果能用 `Iterator<Double>`\
  \ 来装饰它就好了。与其让 `InfiniteRandomDouble` 类实现接口，不如通过 `Proxies.filter(Iterator.class,\
  \ new InfiniteRandomDouble())` 创建 `Iterator`。如果我们在 JPMS 模块中运行，我们需要显式地开放 `java.base`\
  \ 模块的 `java.util` 包。如果我们的模块是 `javaspecialists.books.dynamicproxies`，那么我们需要使用 JVM\
  \ 参数 `--add-opens java.base/java.util=javaspecialists.books.dynamicproxies`。\n\n\
  ```java\n/**\n * 如果我们在模块内部，我们需要显式向我们的模块打开\n * java.base 模块内的 java.util 包。我们可以通过\
  \ JVM 参数\n * --add-opens \\\n * java.base/java.util=javaspecialists.books.dynamicproxies\n\
  \ * 这一点。否则，VTable 将不会包含默认方法。\n */\npublic class DefaultMethodCallDemo {\n  public\
  \ static void main(String... args) {\n    Iterator<Double> filter = Proxies.filter(\n\
  \        Iterator.class, new InfiniteRandomDouble());\n\n    System.out.println(filter.hasNext());\n\
  \    System.out.println(filter.next());\n\n    try {\n      filter.remove();\n \
  \     throw new AssertionError(\n          \"Expected an UnsupportedOperationException\"\
  );\n    } catch (UnsupportedOperationException expected) {\n      System.err.println(expected);\n\
  \    }\n\n    System.out.println(\"Iterating forever ...\");\n\n    filter.forEachRemaining(System.out::println);\n\
  \  }\n}\n```\n\nListing 4.11：`DefaultMethodCallDemo`。在没有 `--add-opens` 参数的情况下运行会抛出\
  \ `IllegalArgumentException`，因为默认方法 `remove()` 和 `forEachRemaining()` 只有在 `.java.util`\
  \ 包开放时才能被包含。\n\n\n\n\n\n```\nException in thread \"main\" java.lang.IllegalArgumentException:\
  \ \\\n    Unhandled methods: [ \\\n      public default void java.util.Iterator.remove(),\
  \ \\\n      public default void java.util.Iterator.forEachRemaining( \\\n      \
  \  java.util.function.Consumer)]\n  at eu.javaspecialists.books.dynamicproxies/...\n\
  ```\n\nListing 4.12：未使用 `--add-opens` 时的 `DynamicFilterDemo` 输出。\n\n然而，当我们在运行 `DefaultMethodCallDemo`\
  \ 并带上 `--add-opens java.base/java.util=eu.javaspecialists.books.dynamicproxies`\
  \ 时，它如预期般工作。\n\n```\ntrue\n0.9833487941165752\njava.lang.UnsupportedOperationException:\
  \ remove\nIterating forever ...\n0.07265625125554698\n0.49716358229383684\n0.44842977216243907\n\
  0.44363950828146614\n0.5560995018129454\n0.9779642433900788\n0.7941409326858004\n\
  ... etc.\n```\n\nListing 4.13：使用 `--add-opens` 时的 `DynamicFilterDemo` 输出。\n\n本章的剩余部分将展示\
  \ `VTable` 如何工作的底层细节，以及我们的 `ChainedInvocationHandler`。这些工具将在下一个模式中用到，但你可以随心跳过本章的剩余部分，也许在以后阶段再回来查看。\n\
  \n## `VTable`\n\n`ImmutableCollection` 接口与 `Collection` 之间没有继承关系。然而，我们仍然需要将接口中的方法匹配到装饰对象。为了实现这一点，我们创建了一个\
  \ `VTable`，它根据给定的接口方法返回匹配的方法。它相当长且复杂，我们首先需要介绍以下几项：\n\n1. `ParameterTypesFetcher`\
  \ 帮助提高方法匹配的性能。\n2. `MethodKey` 通过名称和参数类型比较方法。\n3. `VTable` 匹配目标方法和接收者方法，包括默认接口方法。\n\
  4. `VTable.Builder` 是一个 [Effective Java](https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/)\
  \ 构建器模式，用于构建 `VTable`。\n5. `VTables` 是用于构建最常见 `VTable` 配置的 facade。\n\n### `ParameterTypesFetcher`\n\
  \n匹配方法时的一个巨大成本是调用 `getParameterTypes()`，它在每次调用时都会克隆内部的 `Class<?>[]`。`ParameterTypesFetcher`\
  \ 让我们能够直接访问内部的数组。我们可以通过 JVM 参数 `-Deu.javaspecialists.books.dynamicproxies.util.ParameterTypesFetcher.enabled=true`\
  \ 来启用此性能优化。\n\n我们使用[策略设计模式](https://javaspecialists.teachable.com/p/dpc5) 来决定如何返回参数类型。当\
  \ `ParameterTypesFetcher` 类加载时，我们将 `PARAMETER_FETCHER` 绑定到正确的策略类型。由于我们在一个 JVM 内只使用一种策略，HotSpot\
  \ 编译器可以激进地优化这些方法，可能内联代码从而消除方法调用开销。\n\n```java\n//:~ core/src/main/.../util/ParameterTypesFetcher.java\n\
  /**\n * 默认禁用快速获取参数类型数组，\n *可以通过以下方式启用：\n * -Deu.javaspecialists.books.dynamicproxies.util.\
  \ \\\n * ParameterTypesFetcher.enabled=true\n */\npublic final class ParameterTypesFetcher\
  \ {\n  private final static ParameterFetcher PARAMETER_FETCHER =\n      Boolean.getBoolean(\n\
  \          ParameterTypesFetcher.class.getName() + \".enabled\") ?\n          new\
  \ FastParameterFetcher() :\n          new NormalParameterFetcher();\n\n  /**\n \
  \  * 警告：当启用“快速参数获取”时，\n   * 返回的数组是存储在 Method\n   * 对象内部的实际数组。不要修改它！\n   */\n  public\
  \ static Class<?>[] get(Method method) {\n    return PARAMETER_FETCHER.getParameterTypes(method);\n\
  \  }\n\n  @FunctionalInterface\n  private interface ParameterFetcher {\n    Class<?>[]\
  \ getParameterTypes(Method method);\n  }\n\n  /**\n   * 通过调用方法参数上的 getParameterTypes()\n\
  \   * 返回参数类型。这应该始终有效。\n   */\n  private static class NormalParameterFetcher\n  \
  \    implements ParameterFetcher {\n    @Override\n    public Class<?>[] getParameterTypes(Method\
  \ method) {\n      return method.getParameterTypes(); // 克隆数组\n    }\n  }\n\n  /**\n\
  \   * 创建一个直接指向 Method 内部存储的\n   * 私有字段 parameterTypes 的 VarHandle。由于 VarHandle\n\
  \   * 被声明为 final static，读取它的成本与\n   * 读取普通字段的相同。\n   */\n  private static class\
  \ FastParameterFetcher\n      implements ParameterFetcher {\n    private final static\
  \ VarHandle METHOD_PARAMETER_TYPES;\n\n    static {\n      try {\n        METHOD_PARAMETER_TYPES\
  \ = MethodHandles.privateLookupIn(\n            Method.class, MethodHandles.lookup()\n\
  \        ).findVarHandle(Method.class, \"parameterTypes\",\n            Class[].class);\n\
  \      } catch (ReflectiveException e) {\n        // 异常处理\n      }\n    }\n    @Override\n\
  \    public Class<?>[] getParameterTypes(Method method) {\n      return (Class<?>[])\
  \ METHOD_PARAMETER_TYPES.get(method);\n    }\n  }\n}\n```\n\nListing 4.14：`ParameterTypesFetcher`。\n\
  \n### `MethodKey`\n\n`MethodKey` 在 4.15 中根据名称和参数类型比较方法对象。\n\n```java\n//:~ core/src/main/.../util/MethodKey.java\n\
  /**\n * MethodKey 根据名称和参数类型比较方法。\n * 它实现了 equals(), hashCode() 和 toString()。\n *\
  \ 可以作为 map 的键。它不知道方法的返回类型。\n */\npublic final class MethodKey implements Comparable<MethodKey>\
  \ {\n  private final String name;\n  private final Class<?>[] paramTypes;\n\n  public\
  \ MethodKey(Method method) {\n    name = method.getName();\n    paramTypes = ParameterTypesFetcher.get(method);\n\
  \  }\n\n  public MethodKey(Class<?> clazz, String name,\n                   Class<?>...\
  \ paramTypes) {\n    try {\n      // 检查类是否存在方法\n      var method = clazz.getMethod(name,\
  \ paramTypes);\n      // 方法名在 JVM 中是内化的\n      this.name = method.getName();\n \
  \     this.paramTypes = Objects.requireNonNull(paramTypes);\n    } catch (NoSuchMethodException\
  \ e) {\n      throw new IllegalArgumentException(e);\n    }\n  }\n\n  @Override\n\
  \  public boolean equals(Object obj) {\n    if (!(obj instanceof MethodKey)) {\n\
  \      return false;\n    }\n    // name 和 paramTypes 不为空\n    var other = (MethodKey)\
  \ obj;\n    return name == other.name && // 方法是内化的\n               equalTypes(paramTypes,\
  \ other.paramTypes);\n  }\n\n  /**\n   * 使用 == 而不是 .equals() 比较类。我们知道\n   *数组不会为空。因此可以避免\n\
  \   * Arrays.equals() 中的某些检查。\n   */\n  private boolean equalTypes(Class<?>[] params1,\n\
  \                            Class<?>[] params2) {\n    if (params1.length == params2.length)\
  \ {\n      for (int i = 0; i < params1.length; i++) {\n        if (params1[i] !=\
  \ params2[i])\n          return false;\n      }\n      return true;\n    }\n   \
  \ return false;\n  }\n\n  @Override\n  public int hashCode() {\n    return name.hashCode()\
  \ + paramTypes.length;\n  }\n\n  @Override\n  public int compareTo(MethodKey that)\
  \ {\n    int result = this.name.compareTo(that.name);\n    if (result != 0) return\
  \ result;\n    return Arrays.compare(this.paramTypes,\n        that.paramTypes,\n\
  \        Comparator.comparing(Class::getName));\n  }\n\n  @Override\n  public String\
  \ toString() {\n    return Stream.of(paramTypes)\n               .map(Class::getName)\n\
  \               .collect(Collectors.joining(\", \",\n                   name + \"\
  (\", \")\"));\n  }\n}\n```\n\nListing 4.15：`MethodKey`。`VTable` 和 `VTable.Builder`\n\
  \n`VTable` 创建了一个自定义哈希表，根据名称和参数类型查找方法。普通方法使用 `lookup(Method)` 查找，而默认接口方法则使用 `lookupDefaultMethod(Method)`\
  \ 查找。\n\n\n\n\n\n我们使用 `VTable.Builder` 创建 `VTable` 实例，并参考了 [Effective Java](https://www.oreilly.com/library/view/effective-java-3rd/9780134686097/)\
  \ 中的构建器模式。\n\n更多的注释已在 `VTable` 源码中。我鼓励你花一点时间阅读这些代码，但如果你觉得太困难，也可以先跳过，稍后再回来。\n\n\n\
  \n\n```java\n//:~ core/src/main/.../util/VTable.java\n/**\n * VTable 的作用是在接口方法与接收者类方法之间\n\
  \ * 构建一个快速映射器。为了减少对象的创建，\n * 我们避免使用普通的 HashMap，而是选择将\n * 所有元素存储在等大小的数组中。我们还尝试\n\
  \ * 通过方法名 + 参数数量进行哈希处理来\n * 减少表中的冲突。此外，我们会记录某个名称\n * 在表中是否是唯一的。如果是，我们就不再检查\n * 参数是否匹配。\n\
  \ * <p>\n * 从性能角度来说，最重要的方法是\n * lookup() 和 lookupDefaultMethod()。\n */\npublic final\
  \ class VTable {\n  private final Method[] entries;\n  private final Class<?>[][]\
  \ paramTypes;\n  private final boolean[] distinctName;\n  private final MethodHandle[]\
  \ defaultMethods;\n  private final int size;\n  private final int mask;\n\n  /**\n\
  \   * 根据方法集合构建 VTable。\n   * 此构造函数的输入是在 Builder\n   * 类中创建的。\n   *\n   * @param\
  \ methods               所有需要包含在\n   *                              此 VTable 中的方法\n\
  \   * @param distinctMethodNames   未被重载的\n   *                              方法的名称\n\
  \   * @param includeDefaultMethods 是否想要包含\n   *                              接口的默认\n\
  \   *                              方法\n   */\n  private VTable(Collection<Method>\
  \ methods,\n                 Set<String> distinctMethodNames,\n                \
  \ boolean includeDefaultMethods) {\n    this.size = methods.size();\n    mask =\
  \ Math.max(\n        (-1 >>> Integer.numberOfLeadingZeros(size * 4 - 1)),\n    \
  \    127);\n    entries = new Method[mask + 1];\n    paramTypes = new Class<?>[entries.length][];\n\
  \    distinctName = new boolean[entries.length];\n    defaultMethods = new MethodHandle[entries.length];\n\
  \    for (var method : methods) {\n      put(method,\n          distinctMethodNames.contains(method.getName()),\n\
  \          includeDefaultMethods);\n    }\n    methods.forEach(MethodTurboBooster::boost);\n\
  \  }\n\n  /**\n   * 在 VTable 中查找方法。如果未找到则\n   * 返回 null。\n   */\n  public Method\
  \ lookup(Method method) {\n    int index = findIndex(method);\n    return index\
  \ < 0 ? null : entries[index];\n  }\n\n  /**\n   * 在 VTable 中查找接口默认方法。\n   * 如果未找到则返回\
  \ null。\n   */\n  public MethodHandle lookupDefaultMethod(Method method) {\n   \
  \ int index = findIndex(method);\n    return index < 0 ? null : defaultMethods[index];\n\
  \  }\n\n  /**\n   * 返回 VTable 中的条目数量。\n   * 大小不会改变，并在构造时固定。\n   */\n  public int\
  \ size() {\n    return size;\n  }\n\n  /**\n   * 返回来自此 VTable 的 Method 对象流。\n  \
  \ * 由 ChainedInvocationHandler 使用，以验证\n   * 目标中的所有方法是否已被不同的 VTables\n   * 覆盖。\n\
  \   */\n  public Stream<Method> stream() {\n    return Stream.of(entries).filter(Objects::nonNull);\n\
  \  }\n\n  /**\n   * 返回此 VTable 中我们拥有接口默认方法的\n   * Method 对象流。由 ChainedInvocationHandler\
  \ 使用\n   * 以验证目标中的所有方法是否已被\n   * 不同的 VTables 覆盖。\n   */\n  public Stream<Method>\
  \ streamDefaultMethods() {\n    // Heinz: 这是我第一次找到 iterate() 的用例\n    return IntStream.iterate(0,\
  \ i -> i < entries.length,\n        i -> i + 1)\n               .filter(i -> defaultMethods[i]\
  \ != null)\n               .mapToObj(i -> entries[i]);\n  }\n\n  /**\n   * 为条目寻找一个空位置，然后将值\n\
  \   * 插入 entries、paramTypes、distinctName 数组中，\n   * 可选的 defaultMethods。不允许重复方法，\n\
  \   * 并将抛出 IllegalArgumentException。\n   */\n  private void put(Method method, boolean\
  \ distinct,\n                   boolean includeDefaultMethods) {\n    int index\
  \ = findIndex(method);\n    if (index >= 0)\n      throw new IllegalArgumentException(\n\
  \          \"Duplicate method found: \" + new MethodKey(method));\n    index = ~index;\
  \ // 再次翻转位寻找空隙\n    entries[index] = method;\n    paramTypes[index] = ParameterTypesFetcher.get(method);\n\
  \    distinctName[index] = distinct;\n    if (includeDefaultMethods && method.isDefault())\
  \ {\n      defaultMethods[index] = getDefaultMethodHandle(method);\n    }\n  }\n\
  \n  /**\n   * 返回接口默认方法的 MethodHandle，\n   * 如果该方法已声明且该模块对我们的模块开放；\n   * 否则返回 null。\n\
  \   */\n  private MethodHandle getDefaultMethodHandle(Method method) {\n    try\
  \ {\n      Class<?> target = method.getDeclaringClass();\n      if (isTargetClassInOpenModule(target))\
  \ {\n        // Thanks Thomas Darimont 提供的想法\n        MethodHandles.Lookup lookup\
  \ = MethodHandles.lookup();\n        return MethodHandles.privateLookupIn(target,\
  \ lookup)\n                   .unreflectSpecial(method, target)\n              \
  \     // asSpreader() 避免了调用 invokeArguments()\n                   // 速度快了 10 倍\n\
  \                   .asSpreader(Object[].class,\n                       method.getParameterCount());\n\
  \      }\n      return null;\n    } catch (IllegalAccessException) {\n      throw\
  \ new IllegalArgumentException(e);\n    }\n  }\n\n  /**\n   * 如果方法在开放模块中则返回 true；\n\
  \   * 否则返回 false。例如，如果我们的 VTable\n   * 在 javaspecialists.books.dynamicproxies 内部且\n\
  \   * 使用 java.util 中的默认方法，我们需要\n   * 显式打开该模块。\n   */\n  private boolean isTargetClassInOpenModule(Class<?>\
  \ target) {\n    Module targetModule = target.getModule();\n    String targetPackage\
  \ = target.getPackageName();\n    Module ourModule = VTable.class.getModule();\n\
  \    return targetModule.isOpen(targetPackage, ourModule);\n  }\n\n  /**\n   * 返回方法的索引；未找到返回负值。\n\
  \   * 一旦找到同名方法，我们会检查该方法\n   * 是否重载。如果没有，则返回 offset。\n   */\n  private int findIndex(Method\
  \ method) {\n    int offset = offset(method);\n    Class<?>[] methodTypes = null;\n\
  \    Method match;\n    while ((match = entries[offset]) != null) {\n      if (match.getName()\
  \ == method.getName()) {\n        if (distinctName[offset]) return offset;\n   \
  \     if (methodTypes == null)\n          methodTypes = ParameterTypesFetcher.get(method);\n\
  \        if (matches(paramTypes[offset], methodTypes))\n          return offset;\n\
  \      }\n      offset = (offset + 1) & mask;\n    }\n    // 未找到方法，返回负值\n    //\
  \ 通过再次翻转位，我们知道数组中第一个可用索引\n    return ~offset;\n  }\n\n  /**\n   * 根据名称和参数数量返回方法的\n\
  \   *初始 offset。\n   */\n  private int offset(Method method) {\n    return (method.getName().hashCode()\
  \ +\n                method.getParameterCount()) & mask;\n  }\n\n  /**\n   * 参数类型的快速数组比较。\n\
  \   * 类可以使用 == 代替 equals() 进行比较。\n   */\n  private boolean matches(Class<?>[] types1,\
  \ Class<?>[] types2) {\n    if (types1.length != types2.length) return false;\n\
  \    for (int i = 0; i < types1.length; i++) {\n      if (types1[i] != types2[i])\
  \ return false;\n    }\n    return true;\n  }\n\n  public static class Builder {\n\
  \    private static final BinaryOperator<Method> MOST_SPECIFIC =\n        (method1,\
  \ method2) -> {\n          var r1 = method1.getReturnType();\n          var r2 =\
  \ method2.getReturnType();\n          if (r2.isAssignableFrom(r1)) {\n         \
  \   return method1;\n          }\n          if (r1.isAssignableFrom(r2)) {\n   \
  \         return method2;\n          } else {\n            throw new IllegalStateException(\n\
  \                method1 + \" and \" + method2 +\n                    \" have incompatible\
  \ return types\");\n          }\n        };\n    private static final Method[] OBJECT_METHODS;\n\
  \    static {\n      try {\n        OBJECT_METHODS = new Method[] {\n          \
  \  Object.class.getMethod(\"toString\"),\n            Object.class.getMethod(\"\
  hashCode\"),\n            Object.class.getMethod(\"equals\", Object.class),\n  \
  \      };\n      } catch (NoSuchMethodException e) {\n        throw new Error(e);\n\
  \      }\n    }\n    private final Map<MethodKey, Method> receiverClassMap;\n  \
  \  private List<Class<?>> targetInterfaces = new ArrayList<>();\n    private boolean\
  \ includeObjectMethods = true;\n    private boolean includeDefaultMethods = false;\n\
  \    private boolean ignoreReturnTypes = false;\n\n    /**\n     * @param receiver\
  \ 接收实际方法调用的类\n     *                 不需要与动态代理接口相关。\n     */\n    public Builder(Class<?>\
  \ receiver) {\n      receiverClassMap = createPublicMethodMap(receiver);\n    }\n\
  \n    /**\n     * equals(Object), hashCode() 和 toString() 方法\n     * 不会被添加到 VTable。\n\
  \     */\n    public Builder excludeObjectMethods() {\n      this.includeObjectMethods\
  \ = false;\n      return this;\n    }\n\n    public Builder includeDefaultMethods()\
  \ {\n      this.includeDefaultMethods = true;\n      return this;\n    }\n\n   \
  \ public Builder ignoreReturnTypes() {\n      this.ignoreReturnTypes = true;\n \
  \     return this;\n    }\n\n    /**\n     * 我们希望映射映射的目标接口之一。\n     */\n    public\
  \ Builder addTargetInterface(Class<?> targetIntf) {\n      if (!targetIntf.isInterface())\n\
  \        throw new IllegalArgumentException(\n            targetIntf.getCanonicalName()\
  \ +\n                \" is not an interface\");\n      this.targetInterfaces.add(targetIntf);\n\
  \      return this;\n    }\n\n    public VTable build() {\n      // 构建来自目标接口的所有方法集合，\n\
  \      // 以及三个包含的默认方法。\n      Collection<Method> allMethods =\n          targetInterfaces.stream()\n\
  \              .flatMap(clazz -> Stream.of(clazz))\n              .filter(Objects::nonNull)\n\
  \              .collect(Collectors.toList());\n      if (includeObjectMethods) {\n\
  \        for (Method method : OBJECT_METHODS) {\n          allMethods.add(method);\n\
  \        }\n      }\n      // 找到所有名称唯一的方法，\n      // 因此加速匹配。\n      Set<String>\
  \ distinctMethodNames =\n          allMethods.stream()\n              .collect(Collectors.groupingBy(Method::getName),\n\
  \                  Collectors.counting()))\n              .keySet(); // 简化逻辑\n \
  \     // 最后我们只包含那些与目标方法\n      //set 的方法。\n      Collection<Method> matchedMethods\
  \ =\n          allMethods.stream()\n              .map(this::filterReturnType)\n\
  \              .filter(Objects::nonNull)\n              .collect(Collectors.toList());\n\
  \n      return new VTable(matchedMethods, distinctMethodNames,\n          includeDefaultMethods);\n\
  \    }\n  }\n}\n```\n\n\n\nListing 4.16: `VTable` 和 `VTable.Builder`。\n\n### `VTables`\
  \ Fac 面\n\n`VTable` 最常见的用例是映射无关接口之间的方法，以及映射默认接口方法。我们的 `VTables` Fac 面包含了静态工厂方法，用于构建此类\
  \ `VTable` 实例。\n\n```\n//:~ core/src/main/.../util/VTables.java\npublic final class\
  \ VTables {\n  private VTables() {}\n\n  public static VTable newDefaultMethodVTable(Class<?>\
  \ clazz) {\n    return newVTableBuilder(clazz, clazz)\n               .excludeObjectMethods()\n\
  \               .includeDefaultMethods()\n               .build();\n  }\n\n  public\
  \ static VTable newVTable(Class<?> receiver,\n                                 Class<?>...\
  \ targets) {\n    return newVTableBuilder(receiver, targets).build();\n  }\n\n \
  \ public static VTable newVTableExcludingObjectMethods(\n      Class<?> receiver,\
  \ Class<?>... targets) {\n    return newVTableBuilder(receiver, targets)\n     \
  \          .excludeObjectMethods()\n               .build();\n  }\n\n  private static\
  \ VTable.Builder newVTableBuilder(\n      Class<?> receiver, Class<?>... targets)\
  \ {\n    VTable.Builder builder = new VTable.Builder(receiver);\n    for (Class<?>\
  \ target : targets) {\n      builder.addTargetInterface(target);\n    }\n    return\
  \ builder;\n  }\n}\n```\n\nListing 4.17: `VTables` Fac 面。\n\n例如，为了在 `List` 和 `ArrayDeque`\
  \ 之间建立一个 `VTable`，我们只需编写列表 4.18 中的代码即可。\n\n```\n//:~ core/src/test/.../util/VTablesDemo.java\n\
  public class VTablesDemo {\n  public static void main(String... args) {\n    VTable\
  \ vt = VTables.newVTable(ArrayDeque.class, List.class);\n    vt.stream().forEach(System.out::println);\n\
  \  }\n}\n```\n\nListing 4.18: `VTablesDemo`。\n\n输出显示了 `ArrayDeque` 中同样出现在 `List`\
  \ 中的所有方法。\n\n```\npublic boolean java.util.ArrayDeque.add(java.lang.Object)\npublic\
  \ boolean java.util.ArrayDeque.isEmpty()\npublic int java.util.ArrayDeque.size()\n\
  public boolean java.util.ArrayDeque.contains(java.lang.Object)\npublic boolean java.util.AbstractCollection.containsAll(java.util.Collection)\n\
  public boolean java.util.ArrayDeque.remove(java.lang.Object)\npublic java.lang.Object[]\
  \ java.util.ArrayDeque.toArray()\npublic void java.util.ArrayDeque.clear()\netc.\n\
  ```\n\nListing 4.19: `VTablesDemo` 的输出。\n\n### `ChainedInvocationHandler`\n\n我们在第\
  \ 1 章中简要介绍了责任链模式（chain-of-responsibility pattern）。我们还提到它有一个已知的缺点：当没有找到合适的处理器时，请求可能会在链的末端丢失。\n\
  \n我们的 `ChainedInvocationHandler` 是该模式中的根处理器。除了将请求传递给链中的下一个处理器外，如果没有发现合适的方法，它还会抛出一个\
  \ `AssertionError`。我们鼓励此类的用户在链链后调用 `checkAllMethodsAreHandled(Class<?>… targets)`，以验证该链能够处理目标接口中的所有方法。\n\
  \n```\n//:~ core/src/main/.../util/chain/ChainedInvocationHandler.java\n/**\n *\
  \ 用于调用处理器的责任链设计模式。\n * invoke 方法默认将调用传递给\n * 链中的下一个元素。如果没有人可以处理\n该调用，\n * 那么就会抛出\
  \ AssertionError。一旦构建了完整的链，\n * 我们应该通过调用 #checkAllMethodsAreHandled(targets) \n\
  \ * 检查目标接口中的所有方法是否都能被我们的链所处理。\n */\npublic abstract class ChainedInvocationHandler\n\
  \    implements InvocationHandler {\n  private final ChainedInvocationHandler next;\n\
  \n  public ChainedInvocationHandler(\n      ChainedInvocationHandler next) {\n \
  \   this.next = next;\n  }\n\n  @Override\n  public Object invoke(Object proxy,\
  \ Method method,\n                       Object[] args) throws Throwable {\n   \
  \ if (next != null) return next.invoke(proxy, method, args);\n    // 我们不允许某个方法不被处理\n\
  \    throw new AssertionError(\n        \"No InvocationHandler for \" + method);\n\
  \  }\n\n  /**\n   * 在一切设置完成后，应在链的第一个节点上调用。\n   * 如果任何方法未被我们的链处理，则抛出 IllegalArgumentException。\n\
  \   *\n   * @throws UnhandledMethodException 如果 targets 中的任何方法 \n   *          \
  \                        都未被链 \n   *                                  处理的\n   *\
  \ @throws IllegalArgumentException 如果目标之一 \n   *                               \
  \   不是接口\n   */\n  public void checkAllMethodsAreHandled(Class<?>... targets) {\n\
  \        if (Stream.of(targets)\n            .anyMatch(Predicate.not(Class::isInterface)))\n\
  \          throw new IllegalArgumentException(\n              \"target classes must\
  \ be interfaces\");\n    Collection<Method> unhandled =\n        findUnhandledMethods(targets)\n\
  \            .collect(Collectors.toList());\n    if (!unhandled.isEmpty())\n   \
  \   throw new UnhandledMethodException(unhandled);\n  }\n\n  /**\n   * 链中的最后一个处理器返回一个包含\n\
  \   * 给定目标接口中所有方法的 Stream。子类\n   * 应调用 super.findUnhandledMethods(targets) 然后\n\
  \   * 过滤掉被处理器处理的方法。\n   */\n  protected Stream<Method> findUnhandledMethods(\n \
  \     Class<?>... targets) {\n    if (next != null) return next.findUnhandledMethods(targets);\n\
  \    return Stream.of(targets)\n               .map(Class::getMethods)\n       \
  \        .flatMap(Stream::of)\n               .filter(m -> !Modifier.isStatic(m.getModifiers()));\n\
  \  }\n}\n```\n\nListing 4.20: `ChainedInvocationHandler`。\n\n我们还定义了一个名为 `UnhandledMethodException`\
  \ 的新异常，如 4.21 所示。它是 `IllegalArgumentException` 的特殊类型，只能在 `chain` 包内实例化。\n\n```\n\
  //:~ core/src/main/.../util/chain/UnhandledMethodException.java\npublic final class\
  \ UnhandledMethodException\n    extends IllegalArgumentException {\n  private final\
  \ Collection<Method> unhandled;\n  UnhandledMethodException(Collection<Method> unhandled)\
  \ {\n    super(\"Unhandled methods: \" + unhandled);\n    this.unhandled = List.copyOf(unhandled);\n\
  \  }\n  public Collection<Method> getUnhandled() {\n    return unhandled;\n  }\n\
  }\n```\n\nListing 4.21: `UnhandledMethodException`。\n\n我们的 `VTableHandler` 接收参数：用于调用方法的\
  \ `receiver` 对象、用于将目标接口方法映射到接收器类的 `vtable`，以及链中的 `next` 链接。\n\n```\n//:~ core/src/main/.../util/chain/VTableHandler.java\n\
  public final class VTableHandler\n    extends ChainedInvocationHandler {\n  private\
  \ final VTable vtable;\n  private final Object receiver;\n  public VTableHandler(Object\
  \ receiver, VTable vtable,\n                       ChainedInvocationHandler next)\
  \ {\n    super(next);\n    this.receiver = Objects.requireNonNull(receiver);\n \
  \   this.vtable = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public\
  \ Object invoke(Object proxy, Method method,\n                       Object[] args)\
  \ throws Throwable {\n    Method match = vtable.lookup(method);\n    if (match !=\
  \ null) return match.invoke(receiver, args);\n    return super.invoke(proxy, method,\
  \ args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
  \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
  \               .filter(method -> vtable.lookup(method) == null);\n  }\n}\n```\n\
  \nListing 4.22: `VTableHandler`。\n\n\n\n默认接口方法的调用方式略有不同。它们不是在接收者对象上调用的，而是在传入 `invoke()`\
  \ 方法的 `proxy` 参数上调用的。因此，我们的 `VTableDefaultMethodsHandler` 仅通过查找默认接口方法的 `vtable`\
  \ 和链中的 `next` 处理器来构建。很有可能，这个处理器将是链中的最后一个。\n\n如果我们在 `vtable` 中找到了默认接口方法的匹配项，我们将使用我们的\
  \ `proxy` 参数和提供的 `args` 数组调用 `MethodHandle`。\n\n与我们在 `VTableHandler` 中的做法类似，我们还需要从流中过滤掉任何该处理器匹配到的方法。\n\
  \n```java\n//:~ core/src/main/.../util/chain/VTableDefaultMethodsHandler.java\n\
  public final class VTableDefaultMethodsHandler\n    extends ChainedInvocationHandler\
  \ {\n  private final VTable vtable;\n  public VTableDefaultMethodsHandler(\n   \
  \   VTable vtable, ChainedInvocationHandler next) {\n    super(next);\n    this.vtable\
  \ = Objects.requireNonNull(vtable);\n  }\n\n  @Override\n  public Object invoke(Object\
  \ proxy, Method method,\n                       Object[] args) throws Throwable\
  \ {\n    MethodHandle match = vtable.lookupDefaultMethod(method);\n    if (match\
  \ != null)\n      return match.invoke(proxy, args);\n    return super.invoke(proxy,\
  \ method, args);\n  }\n\n  @Override\n  protected Stream<Method> findUnhandledMethods(\n\
  \      Class<?>... targets) {\n    return super.findUnhandledMethods(targets)\n\
  \               .filter(\n                   method -> vtable.lookupDefaultMethod(method)\n\
  \                                 == null);\n  }\n}\n```\n\n列表 4.23: `VTableDefaultMethodsHandler`。\n\
  \n细心的读者会注意到，之前的两个类看起来非常相似。为了好玩，我们使用泛型和 lambda 将这两种查找方法统一为了一个。它行得通，但在书中解释起来会更具挑战性。代码位于我们\
  \ GitHub 上 [dynamic-proxies-samples](https://github.com/kabutz/dynamic-proxies-samples)\
  \ 仓库的 `core/src/test/…​/util/chain` 包中。\n\n# 动态对象适配器\n\n## Rapper 包装器 (Rapper wrappers)\n\
  \n想象一个歌手的类层次结构：低音、男中音和高音。他们都属于一个合唱团。\n\nCacophony 是希腊语，意为“难听的声音”。![歌手](img/Singers.jpg)\n\
  \n现在想象一个 rapper 站在合唱团旁边，显得孤孤伶单。这个 rapper 想要加入合唱团，但不能。只允许歌手，抱歉。\n\n![合唱团](img/Choir.png)\n\
  \n图 11。一个带有歌手的合唱团结构。孤单的 rapper 在旁观察。\n\n我们如何让这个 rapper 变成歌手呢？有些人会说这是不可能的。rapper\
  \ 在说话，歌手在唱歌。结束。\n\n但让我们暂时抛开对说唱音乐质量的感受。我们同时也假设我们无法更改 `Rapper` 类。\n\n### 类适配器模式 (Class\
  \ adapter pattern)\n\n创建 rapper 包装器最简单的方法是使用类适配器模式。我们创建一个实现 `Singer` 并扩展 `Rapper`\
  \ 的 `SingingRapper`。在 `sing()` 方法中，我们调用 `talk()`。\n\n![SingingRapperClassAdapter](img/SingingRapperClassAdapter.png)\n\
  \n图 12。一个会唱歌会说话的 rapper。\n\n我们的 `SingingRapper` 扩展了 `Rapper`，使其既是 rapper 又是歌手。如果只有一种\
  \ `Rapper` 类型，这种方法运行良好，但 rapper 类型的列表似乎是无尽的：东海岸、西海岸、boom bap、drill、emo rap、mumble\
  \ rap、gangsta、trap……列表没完没了。看起来是一个很好的低代码解决方案，结果发现需要几十个类似的类，每种独特的 rap 风格一个类。\n\n###\
  \ 对象适配器模式 (Object adapter pattern)\n\n对象适配器模式将 rapper 作为构造函数参数，并将 `sing()` 方法委托给其\
  \ rapper 的 `talk()` 方法。我们可以接受任何 `Rapper` 的子类作为参数，甚至是 `MumbleRapper`。我们的 rapper 包装器现在实现了\
  \ `Singer`，但没有扩展 `Rapper`，所以它不是 rapper。我们可以调用 `sing()`，但 `talk()` 不再可见了。\n\n![SingingRapperObjectAdapter](img/SingingRapperObjectAdapter.png)\n\
  \n图 13。将 rapper 变成歌手。\n\n对象适配器模式似乎是两者中更好的选择。但如果 `Rapper` 和 `Singer` 许多许多共同方法，例如\
  \ `clap()`、`bow()` 和 `dance()` 呢？使用类适配器模式时，我们只需要实现 `sing()` 方法。而对象适配器模式则要求我们委托所有方法。当目标接口非常丰富时，这可能会变得繁琐。\n\
  \n## 更好的 ArrayList\n\n当我们创建一个 `ArrayList<String>` 时，我们费力指定了它包含 `String`。然而，为了保持类文件格式的向后兼容性，这些信息从类中被擦除了。`ArrayList`\
  \ 类并不知道泛型类型参数是什么。如果我们调用 `toArray()`，返回的是一个 `Object[]`，尽管我们声明了集合包含 `String`。\n\n\
  Java 5 引入了协变返回类型（covariant return types）。被重写的方法可以返回父方法返回类型的子类。因此，`ArrayList` 的子类可以返回\
  \ `Object` 的子类。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayList.java\n\
  public class BetterArrayList<E> extends ArrayList<E> {\n  private final E[] seedArray;\n\
  \n  public BetterArrayList(E[] seedArray) {\n    if (seedArray.length != 0)\n  \
  \    throw new IllegalArgumentException(\"seedArray must be empty\");\n    this.seedArray\
  \ = seedArray;\n  }\n\n  @Override\n  public E[] toArray() {\n    // NOTE: Shipilev\
  \ showed that this is the fastest way\n    // create a typed array from a collection:\n\
  \    // https://shipilev.net/blog/2016/arrays-ancients/\n    return toArray(seedArray);\n\
  \  }\n\n  @Override\n  public String toString() {\n    return \"--\" + super.toString()\
  \ + \"--\";\n  }\n}\n```\n\n列表 5.1: `BetterArrayList`。列表 5.2 展示了使用此类的某种方法。我们传入了\
  \ `new String[0]`，它随后用于创建正确的类型。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterArrayListDemo.java\n\
  BetterArrayList<String> names =\n    new BetterArrayList<>(new String[0]);\nnames.add(\"\
  Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
  Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
  for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
  System.out.println(names);\n```\n\n列表 5.2: `BetterArrayListDemo`。输出在列表 5.3 中。\n\n\
  ```\nWOLFGANG\nLEANDER\nBOBBY TABLES\nKLAUS\nMENONGAHELA\n--[Wolfgang, Bobby Tables,\
  \ Leander, Klaus, Menongahela]--\n```\n\n列表 5.3: `BetterArrayListDemo` 的输出。\n\n\
  ## BetterCollection 接口\n\n另一种方法是扩展 `Collection` 接口并重写 `toArray()` 方法以返回正确的类型。列表\
  \ 5.4 展示了该接口的形式：\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollection.java\n\
  public interface BetterCollection<E> extends Collection<E> {\n  @Override\n  E[]\
  \ toArray();\n  default void forEachFiltered(Predicate<? super E> predicate,\n \
  \                              Consumer<? super E> action) {\n    Objects.requireNonNull(predicate,\
  \ \"predicate==null\");\n    Objects.requireNonNull(action, \"action==null\");\n\
  \    for (E e : this) {\n      if (predicate.test(e)) action.accept(e);\n    }\n\
  \  }\n}\n```\n\n列表 5.4: `BetterCollection`。\n\n使用类适配器时生活是美好的。为了制作一个更好的 `ConcurrentSkipListSet`，我们可以扩展这个类并实现\
  \ `BetterCollection`。代码看起来与 `BetterArrayList` 相似。\n\n\n\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterConcurrentSkipListSet.java\n\
  public class BetterConcurrentSkipListSet<E>\n    extends ConcurrentSkipListSet<E>\n\
  \    implements BetterCollection<E> {\n  private final E[] seedArray;\n  public\
  \ BetterConcurrentSkipListSet(E[] seedArray) {\n    if (seedArray.length != 0)\n\
  \      throw new IllegalArgumentException(\n          \"seedArray must be empty\"\
  );\n    this.seedArray = seedArray;\n  }\n  @Override\n  public E[] toArray() {\n\
  \    return toArray(seedArray);\n  }\n  @Override\n  public String toString() {\n\
  \    return \"--\" + super.toString() + \"--\";\n  }\n}\n```\n\nListing 5.5: `BetterConcurrentSkipListSet`。\n\
  \n我们可以看到，类适配器虽然只需要几行代码，但确实有一些缺点。首先，我们必须为每个具体的集合单独子类。这可能花费长时间。在 Java 13 中，仅 JDK 中的\
  \ `Collection` 就有 277 个子类！\n\n其次，我们只能扩展我们可以控制构造的类。例如，要在 Java 中构造一个并发的 `HashSet`，我们使用\
  \ `ConcurrentHashMap.newKeySet()` 静态工厂方法。它返回 `KeySetView`，这是 `ConcurrentHashMap`\
  \ 的公共静态内部类，具有包级访问的构造函数。由于构造函数不可访问，我们无法扩展 `KeySetView`，因此我们无法使用类适配器模式将其转换为 `BetterCollection`。\n\
  \n相反，我们可以编写一个实现 `BetterCollection` 并包装 `Collection` 适配对象的对象适配器。注意，我们我们需要实现 `Collection`\
  \ 的所有方法。相当繁琐，不是吗？\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapter.java\n\
  public class BetterCollectionObjectAdapter<E>\n    implements BetterCollection<E>\
  \ {\n  private final Collection<E> adaptee;\n  private final E[] seedArray;\n\n\
  \  public BetterCollectionObjectAdapter(Collection<E> adaptee,\n               \
  \                        E[] seedArray) {\n    if (seedArray.length != 0)\n    \
  \  throw new IllegalArgumentException(\n          \"seedArray must be empty\");\n\
  \n    this.adaptee = adaptee;\n    this.seedArray = seedArray;\n  }\n\n  @Override\n\
  \  public E[] toArray() {\n    return adaptee.toArray(seedArray);\n  }\n\n  @Override\n\
  \  public String toString() {\n    return \"--\" + adaptee.toString() + \"--\";\n\
  \  }\n\n  // 这是对象适配器设计模式中的典型问题\n  // - 我们必须实现所有方法 ::-\n  @Override\n  public int\
  \ size() {\n    return adaptee.size();\n  }\n\n  @Override\n  public boolean isEmpty()\
  \ {\n    return adaptee.isEmpty();\n  }\n\n  @Override\n  public boolean contains(Object\
  \ o) {\n    return adaptee.contains(o);\n  }\n\n  @Override\n  public Iterator<E>\
  \ iterator() {\n    return adaptee.iterator();\n  }\n\n  @Override\n  public <T>\
  \ T[] toArray(T[] ts) {\n    return adaptee.toArray(ts);\n  }\n\n  @Override\n \
  \ public boolean add(E e) {\n    return adaptee.add(e);\n  }\n\n  @Override\n  public\
  \ boolean remove(Object o) {\n    return adaptee.remove(o);\n  }\n\n  @Override\n\
  \  public boolean containsAll(Collection<?> c) {\n    return adaptee.containsAll(c);\n\
  \  }\n\n  @Override\n  public boolean addAll(Collection<? extends E> es) {\n   \
  \ return adaptee.addAll(es);\n  }\n\n  @Override\n  public boolean removeAll(Collection<?>\
  \ c) {\n    return adaptee.removeAll(c);\n  }\n\n  @Override\n  public boolean retainAll(Collection<?>\
  \ c) {\n    return adaptee.retainAll(c);\n  }\n\n  @Override\n  public void clear()\
  \ {\n    adaptee.clear();\n  }\n}\n```\n\nListing 5.6: `BetterCollectionObjectAdapter`。\n\
  \n我们的对象适配器可以工作，我们可以用它来适配任何集合。在这里，我们正在包装 `ConcurrentHashMap.newKeySet()`。\n\n```java\n\
  //:~ core/src/main/.../ch05/bettercollection/BetterCollectionObjectAdapterDemo.java\n\
  BetterCollection<String> names =\n    new BetterCollectionObjectAdapter<>(\n   \
  \     ConcurrentHashMap.newKeySet(),\n        new String[0]\n    );\nnames.add(\"\
  Wolfgang\");\nnames.add(\"Leander\");\nnames.add(\"Bobby Tables\");\nnames.add(\"\
  Klaus\");\nnames.add(\"Menongahela\");\nString[] nameArray = names.toArray();\n\
  for (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n}\n\
  System.out.println(names);\n```\n\nListing 5.7: `BetterCollectionObjectAdapterDemo`。\n\
  \n```\nMENONGAHELA\nLEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela, Leander,\
  \ Wolfgang, Klaus, Bobby Tables]--\n```\n\nListing 5.8: `BetterCollectionObjectAdapterDemo`\
  \ 的输出。\n\n它可以工作，但是……嗯……——如果我们现在想要一个更好的 `Set`、`List`、`SortedSet`、`ConcurrentMap`、`Map`\
  \ 甚至 `java.sql.Connection`，\n\n## 使用动态代理的动态适配器\n\n如之前，代理和适配对象的类结构是相似的。我们可以创建一个动态适配器吗？我们动态适配器的静态工厂方法接收以下内容：\n\
  \n- `Class<E> target` 是我们想要适配的接口类。例如，`BetterCollection`。\n- `Object adaptee` 是我们接口想要包装的对象。例如，`ArrayList<String>`。\n\
  - `Object adapter` 是应该使用的对象。\n\n我们的 `ObjectAdapterHandler` 为适配器、适配对象和默认方法创建 `VTables`，并将它们排列成链。\n\
  \n```java\n//:~ core/src/main/.../handlers/ObjectAdapterHandler.java\npublic final\
  \ class ObjectAdapterHandler\n    implements InvocationHandler {\n  private final\
  \ ChainedInvocationHandler chain;\n\n  public ObjectAdapterHandler(Class<?> target,\n\
  \                              Object adaptee,\n                              Object\
  \ adapter) {\n    VTable adapterVT = VTables.newVTable(adapter.getClass(), target);\n\
  \    VTable adapteeVT =\n        VTables.newVTable(adaptee.getClass(), target);\n\
  \    VTable defaultVT = VTables.newMethodVTable(target);\n\n    chain = new VTableHandler(adapter,\
  \ adapterVT,\n        new VTableHandler(adapteeVT,\n            new VTableDefaultMethodsHandler(defaultVT,\
  \ null)));\n\n    chain.checkAllMethodsAreHandled(target);\n  }\n\n  @Override\n\
  \  public Object invoke(Object proxy, Method method,\n                       Object[]\
  \ args) throws Throwable {\n    return chain.invoke(proxy, method, args);\n  }\n\
  }\n```\n\nListing 5.9: `ObjectAdapterHandler`。\n\n我们在无处不在的 `Proxies` 类中添加另一个静态工厂方法，它将根据上面的\
  \ `InvocationHandler` 创建对象适配器。\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
  public static <T> T adapt(Class<? super T> target,\n                          Object\
  \ adaptee,\n                          Object adapter) {\n  Objects.requireNonNull(adaptee,\
  \ \"adaptee==null\");\n  Objects.requireNonNull(adapter, \"adapter==null\");\n \
  \ return castProxy(target,\n      new ObjectAdapterHandler(target, adaptee, adapter));\n\
  }\n```\n\nListing 5.10: `Proxies.adapt()`。\n\n例如，为了创建一个 `BetterCollectionFactory`，我们可以制作适配器，它在\
  \ `toArray()` 方法中首先创建正确类型的数组。然后它修改 `add()` 函数以验证对象的类型是否正确，类似于 `Collections.checkedCollection()`\
  \ 的工作方式。\n\n\n\n\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionFactory.java\n\
  public class BetterCollectionFactory {\n  public static <E> BetterCollection<E>\
  \ asBetterCollection(\n      Collection<E> adaptee, E[] seedArray) {\n    return\
  \ Proxies.adapt(BetterCollection.class, adaptee,\n        new AdaptationObject<>(adaptee,\
  \ seedArray));\n  }\n\n  public static <E> BetterSortedSet<E> asBetterSet(\n   \
  \   SortedSet<E> adaptee, E[] seedArray) {\n    return Proxies.adapt(BetterSortedSet.class,\
  \ adaptee,\n        new AdaptationObject<>(adaptee, seedArray));\n  }\n\n  // this\
  \ public inner class contains the methods that\n  // we want to adapt\n  public\
  \ static class AdaptationObject<E> {\n    private final Collection<E> adaptee;\n\
  \    private final E[] seedArray;\n    public AdaptationObject(Collection<E> adaptee,\n\
  \                            E[] seedArray) {\n      this.adaptee = adaptee;\n \
  \     this.seedArray = seedArray;\n    }\n    public E[] toArray() {\n      return\
  \ adaptee.toArray(seedArray);\n    }\n    @Override\n    public String toString()\
  \ {\n      return \"--\" + adaptee + \"--\";\n    }\n    // Whilst we are at it,\
  \ we could also make it into\n    // a checked collection, see java.util.Collections\n\
  \    // for an example.\n    public boolean add(E e) {\n      var type = seedArray.getClass().getComponentType();\n\
  \      if (!type.isInstance(e))\n        throw new ClassCastException(\n       \
  \     \"Attempt to insert \" + e.getClass() +\n                \" value into collection\
  \ \" +\n                \"with type \" + type);\n      return adaptee.add(e);\n\
  \    }\n    // addAll() left as an exercise for the reader :-)\n  }\n}\n```\n\n\
  列表 5.11：`BetterCollectionFactory`。\n\n让我们尝试用由我们的 `BetterCollectionObjectAdapter`\
  \ 包装的 `HashSet` 来测试一下。\n\n```java\n//:~ core/src/main/.../ch05/bettercollection/BetterCollectionDynamicObjectAdapterDemo.java\n\
  BetterCollection<String> names =\n    BetterCollectionFactory.asBetterCollection(\n\
  \        new HashSet<>(), new String[0]);\nnames.add(\"Wolfgang\");\nnames.add(\"\
  Bobby Tables\");\nnames.add(\"Leander\");\nnames.add(\"Klaus\");\nnames.add(\"Menongahela\"\
  );\nString[] nameArray = names.toArray();\nfor (String name : nameArray) {\n  System.out.println(name.toUpperCase());\n\
  }\nSystem.out.println(names);\n\n((Collection) names).add(42); // this will fail\n\
  ```\n\n列表 5.12：`BetterCollectionDynamicObjectAdapterDemo`。\n\n```text\nMENONGAHELA\n\
  LEANDER\nWOLFGANG\nKLAUS\nBOBBY TABLES\n--[Menongahela, Leander, Wolfgang, Klaus,\
  \ Bobby Tables]--\nException in thread \"main\" java.lang.ClassCastException: Attempt\n\
  to insert class java.lang.Integer value into collection with\nvalue type class java.lang.String\n\
  \  at BetterCollectionFactory$AdaptationObject.add\n      (BetterCollectionFactory.java)\n\
  \    ... etc.\n```\n\n列表 5.13：`BetterCollectionDynamicObjectAdapterDemo` 的输出。\n\n\
  得益于反射，我们能够避免适配器（adapter）和被适配器（adaptee）类之间的紧耦合。我们只需要实现发生变化的适配器部分。\n\n方法调用的成本略有增加，因为每次调用至少涉及一次\
  \ `VTable` 查找。正如我们稍后看到的，当我们需要调用默认接口方法时，这种成本会进一步增加。\n\n## 适配器的限制\n\n在我们的动态对象适配器方法中，`adapter`\
  \ 或 `adaptee` 通常都不会实现 `target` 接口。我们需要确保层级结构中至少有一个公共类对 `target` 中的每个方法有公共声明。匿名内部类虽然用起来方便，但它们是包保护的（package-protected），因此不适合被用作适配器。\n\
  \n考虑类 `AdapterPuzzle1`。\n\n```java\n//:~ core/src/main/.../ch05/AdapterPuzzle1.java\n\
  public class AdapterPuzzle1 {\n  public static void main(String... args) {\n   \
  \ CharSequence seq =\n        Proxies.adapt(CharSequence.class,\n            \"\
  Good morning Vietnam\",\n            new Object() {\n              @Override\n \
  \             public String toString() {\n                return \"Kilroy\";\n \
  \             }\n              public int length() {\n                return 42;\n\
  \              }\n            });\n    System.out.println(seq + \" \" + seq.length());\n\
  \  }\n}\n```\n\n列表 5.14：`AdapterPuzzle1`。\n\n以下哪一个是输出结果？\n\n- Good morning Vietnam\
  \ 20\n- Good morning Vietnam 42\n- Good morning Vietnam 6\n- Kilroy 20\n- Kilroy\
  \ 42\n- Kilroy 6\n\n正确答案是“Kilroy 20”。\n\n让我们尝试找出原因。\n\n目标接口是 `CharSequence`，`adaptee`\
  \ 是 `String`，而 `adapter` 是一个 `Object` 的子类的匿名内部类。\n\n匿名内部类是包私有的（package-private），因此\
  \ `length()` 方法在包外不可见。当我们调用 `length()` 时，调用的是 `String` 方法并得到值“20”。\n\n`toString()`\
  \ 方法是可见的，因为它继承自公共类 `Object`。当我们调用 `toString()` 时，调用的是内部类的 `toString()` 方法，返回值“Kilroy”。\n\
  \n现在考虑类 `AdapterPuzzle2`。\n\n```java\n//:~ core/src/main/.../ch05/AdapterPuzzle2.java\n\
  public class AdapterPuzzle2 {\n  public interface LengthProvider {\n    int length();\n\
  \  }\n  public static void main(String... args) {\n    CharSequence seq =\n    \
  \    Proxies.adapt(CharSequence.class,\n            \"Good morning Vietnam\",\n\
  \            new LengthProvider() {\n              @Override\n              public\
  \ String toString() {\n                return \"Kilroy\";\n              }\n   \
  \           @Override\n              public int length() {\n                return\
  \ 42;\n              }\n            });\n    System.out.println(seq + \" \" + seq.length());\n\
  \  }\n}\n```\n\n列表 5.15：`AdapterPuzzle2`。\n\n由于我们实现的是公共接口，`length()` 方法对适配器可见。这一次的答案将是稳定的“Kilroy\
  \ 42”。\n\n## 动态对象适配器方法的性能\n\n在我们的动态对象适配器上调用方法时执行多次哈希表查找是很慢的。但到底慢多少呢？\n\n在我们的 `AdapterBenchmark`\
  \ 中，我们创建了四个集合：\n\n- `plain` 是一个没有任何修的 `ConcurrentSkipListSet`。\n- `classAdapter`\
  \ 是我们在本章早期见过的 `BetterConcurrentListSet`。\n- `objectAdapter` 是手工编写的 `BetterCollectionObjectAdapter`\
  \ 对象适配器，包装了一个 `ConcurrentSkipListSet`。\n- `dynamicObjectAdapter` 是使用我们的 `BetterCollectionFactory`\
  \ 创建的动态对象适配器实例，包装了一个 `ConcurrentSkipListSet`。\n\n我们对这些集合分别调用了 `size()`、`toArray()`\
  \ 和 `forEachFiltered()` 方法。\n\n\n\n\n\n```java\n//:~ benchmark/src/main/.../ch05/benchmarks/AdapterBenchmark.java\n\
  @Fork(value = 3, jvmArgsAppend = {\"-XX:+UseParallelGC\",\n    \"-Deu.javaspecialists.books.dynamicproxies.util\"\
  \ +\n        \".ParameterTypesFetcher.enabled=true\"})\n@Warmup(iterations = 5,\
  \ time = 5)\n@Measurement(iterations = 10, time = 5)\n@BenchmarkMode(Mode.AverageTime)\n\
  @OutputTimeUnit(TimeUnit.NANOSECONDS)\n@State(Scope.Benchmark)\npublic class AdapterBenchmark\
  \ {\n  private final Collection<String> plain =\n      new ConcurrentSkipListSet<>();\n\
  \n  private final BetterCollection<String> classAdapter =\n      new BetterConcurrentSkipListSet<>(new\
  \ String[0]);\n\n  private final BetterCollection<String> objectAdapter =\n    \
  \  new BetterCollectionObjectAdapter<>(\n          new ConcurrentSkipListSet<>(),\
  \ new String[0]);\n\n  private final BetterCollection<String> dynamicObjectAdapter\
  \ =\n      BetterCollectionFactory.asBetterCollection(\n          new ConcurrentSkipListSet<>(),\
  \ new String[0]\n      );\n\n  private final Collection<Collection<String>> all\
  \ =\n      List.of(plain, classAdapter, objectAdapter,\n          dynamicObjectAdapter);\n\
  \n  @Setup\n  public void init() {\n    all.forEach(Collection::clear);\n    all.forEach(c\
  \ -> c.add(\"John\"));\n    all.forEach(c -> c.add(\"Mary\"));\n    all.forEach(c\
  \ -> c.add(\"Menongahela\"));\n    all.forEach(c -> c.add(\"Bobby Tables\"));\n\
  \  }\n\n  @Benchmark\n  public int plainSize() {\n    return plain.size();\n  }\n\
  \  @Benchmark\n  public int classAdapterSize() {\n    return classAdapter.size();\n\
  \  }\n  @Benchmark\n  public int objectAdapterSize() {\n    return objectAdapter.size();\n\
  \  }\n  @Benchmark\n  public int dynamicObjectAdapterSize() {\n    return dynamicObjectAdapter.size();\n\
  \  }\n\n  @Benchmark\n  public Object[] plainToArray() {\n    return plain.toArray();\n\
  \  }\n  @Benchmark\n  public String[] classAdapterToArray() {\n    return classAdapter.toArray();\n\
  \  }\n  @Benchmark\n  public String[] objectAdapterToArray() {\n    return objectAdapter.toArray();\n\
  \  }\n  @Benchmark\n  public String[] dynamicObjectAdapterToArray() {\n    return\
  \ dynamicObjectAdapter.toArray();\n  }\n\n  private static final Predicate<String>\
  \ predicate =\n      s -> s.length() < 10;\n\n  private static class Counter implements\
  \ Consumer<Object> {\n    private int count;\n    @Override\n    public void accept(Object\
  \ o) { count++; }\n    public void reset() { count = 0; }\n    public int get()\
  \ { return count; }\n  }\n\n  private static final Counter COUNTER = new Counter();\n\
  \n  @Benchmark\n  public int plainForEach() {\n    COUNTER.reset();\n    Objects.requireNonNull(predicate,\
  \ \"predicate==null\");\n    Objects.requireNonNull(COUNTER, \"COUNTER==null\");\n\
  \    for (String e : plain) {\n      if (predicate.test(e)) COUNTER.accept(e);\n\
  \    }\n    return COUNTER.get();\n  }\n  @Benchmark\n  public int classAdapterForEach()\
  \ {\n    COUNTER.reset();\n    classAdapter.forEachFiltered(predicate, COUNTER);\n\
  \    return COUNTER.get();\n  }\n  @Benchmark\n  public int objectAdapterForEach()\
  \ {\n    COUNTER.reset();\n    objectAdapter.forEachFiltered(predicate, COUNTER);\n\
  \    return COUNTER.get();\n  }\n  @Benchmark\n  public int dynamicObjectAdapterForEach()\
  \ {\n    COUNTER.reset();\n    dynamicObjectAdapter.forEachFiltered(predicate, COUNTER);\n\
  \    return COUNTER.get();\n  }\n\n  @Benchmark\n  public Iterator<String> iterator()\
  \ {\n    return plain.iterator();\n  }\n\n  @Benchmark\n  public Object[] parameterArray()\
  \ {\n    return new Object[] {predicate, COUNTER};\n  }\n}\n```\n\n列表 5.16: `AdapterBenchmark`。\n\
  \n这些结果是在一台配备六核 i9 的 MacBook Pro (2018) 上运行 Java 14+36-1461 的 `AdapterBenchmark`\
  \ 得到的。时间单位为每次操作纳秒（ns/op），内存分配单位为每次操作字节（B/op），通过使用 `-XX:+/-DoEscapeAnalysis` JVM\
  \ 参数开启或关闭了逃逸分析。`ParameterTypesFetcher` 和 `MethodTurboBooster` 均已启用。\n\n### `size()`\
  \ 的性能\n\n`size()` 方法定义在目标（adaptee）内部，因此我们需要进行两次 `VTable` 查找，首先在适配器上，然后在目标上。开销约为\
  \ 11 纳秒。由于 `size()` 方法在 `BetterCollection` 接口中没有重载，我们不需要匹配参数类型。\n\n在当前的数据集下，没有任何测试分配了内存。然而，如果集合的大小超过\
  \ 127，则动态对象适配器需要为返回值分配一个 `Integer` 对象。\n\n| Benchmark | ns/op ± 误差 | B/op EA 开启/关闭\
  \ |\n| --- | --- | --- |\n| plainSize() | 3.517 ± 0.076 | 0 / 0 |\n| classAdapterSize()\
  \ | 3.473 ± 0.040 | 0 / 0 |\n| objectAdapterSize() | 3.489 ± 0.042 | 0 / 0 |\n|\
  \ dynamicObjectAdapterSize() | 14.378 ± 0.153 | 0 / 0 |\n\n### `toArray()` 的性能\n\
  \n开销在静态和动态之间约为 6 纳秒。如下表所示，这需要在适配器上进行一次 `VTable` 查找。关于逃逸分析的信息，请参见标量替换。\n\n| Benchmark\
  \ | ns/op ± 误差 | B/op EA 开启/关闭 |\n| --- | --- | --- |\n| plainToArray() | 18.345\
  \ ± 0.096 | 64 / 64 |\n| classAdapterToArray() | 22.385 ± 0.104 | 64 / 64 |\n| objectAdapterToArray()\
  \ | 22.152 ± 0.177 | 64 / 64 |\n| dynamicObjectAdapterToArray() | 28.461 ± 0.209\
  \ | 64 / 64 |\n\n### `forEachFiltered()` 的性能\n\n在 `BetterCollection` 内部定义的默认方法 `forEachFiltered()`\
  \ 开销最大，约为 26 纳秒。这需要 5 次 `VTable` 查找。首先在适配器和目标上查找，如果那里没有找到，则作为默认方法找到。然而，在内部，`forEachFiltered()`\
  \ 方法在循环中调用了 `iterator()`，这需要进行两次查找。\n\n所有测试都创建了迭代器（32 字节）。但是由于迭代器包含在方法内部，内存分配通常可以优化掉，动态适配除外。我们的动态代理具有更深的调用栈，正如我们在第\
  \ 3 章中所述。判断对象无法逃逸的计算复杂度很高，因此逃逸分析限制了分析的深度。在我们的情况下，逃逸分析放弃了，因此迭代器必须在堆上分配，并伴随着垃圾回收成本。由于方法的参数又浪费了\
  \ 24 字节。\n\n`dynamicObjectAdapterForEach()` 测试的分配速率约为 720 MB/s。这有点高，但远未达到机器的上限。作为对比，在我的机器上，我可以分配\
  \ 2.9 GB 的迭代器和 4.2 GB 的对象数组。瓶颈在于 `VTable` 查找，而不是对象分配。\n\n| Benchmark | ns/op ± 误差\
  \ | B/op EA 开启/关闭 |\n| --- | --- | --- |\n| plainForEach() | 15.422 ± 0.062 | 0\
  \ / 32 |\n| classAdapterForEach() | 15.531 ± 0.043 | 0 / 32 |\n| objectAdapterForEach()\
  \ | 16.768 ± 0.047 | 0 / 32 |\n| dynamicObjectAdapterForEach() | 42.431 ± 0.262\
  \ | 56 / 56 |\n\n\n\n\n\n当我们使用动态代理时，由于参数数组、装箱的返回值以及逃逸分析不如直接调用那样有效，我们还可能会获得更高的对象分配率。\n\
  \n# 动态组合 (Dynamic Composite)\n\n我们使用组合设计模式来创建对象的组合。一个示例是包含文件、符号链接和其他目录的目录结构。ZIP\
  \ 文件也被视为一个组合，它包含目录、文件甚至是其他 ZIP 文件。我们还在 GUI 框架中看到这种模式的应用，面板可以包含按钮、标签、文本字段或其他面板。\n\
  \n在本章中，我们将检查组合设计模式，并查看如何使用动态代理来帮助实现组合对象关系。首先，我们看到了一个关于邮件联系人和分发列表的示例。然后，我们演示了如何使用由动态代理驱动的组合来代替手工编写的分发列表。最后，我们看到了另一个输出分流的示例。\n\
  \nGoF 的组合模式结构如图 14 所示。\n\n![CompositeStructure](img/CompositeStructure.png)\n\n\
  图 14。组合设计模式的结构。\n\n敏锐的读者可能会注意到，`add()`、`remove()` 和 `getChild()` 方法定义在 `Component`\
  \ 中。这种过于通用的接口是对该模式最大的批评点。John Vlissides 编写了一篇关于组合模式的优秀两部分文章，“Java 风格组合[第一部分](https://www.javaspecialists.eu/courses/dpc/archive/Composite1-Vlissides.pdf)”和[“第二部分”](https://www.javaspecialists.eu/courses/dpc/archive/Composite2-Vlissides.pdf)”，他在文中解释了替代方案。\n\
