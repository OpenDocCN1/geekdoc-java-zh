- "# Java 动态代理\n\n\n\n![](img/cover.jpg)\n\n\n\n\n\n\n\n\n\n\n# 献辞\n\n本书献给所有那些不得不维护我们代码的可怜灵魂。我们真的深表歉意。\n\
  \n# 致谢\n\n我原以为这本书的初稿已经不错了。当我把它拿出来评审时，我并没有仅仅邀请了少数技术专家，而是邀请了我的 [Java 专人士通讯报](https://www.javaspecialists.eu)\
  \ 的读者们来看一看。有 500 多位热心的人提供帮助。他们剖析了这本书，并给了我 1000 多条非常有价值的意见。我采纳了几乎所有的建议，这本书现在比原来好得多。这不是我的书，这是我们的书，是由我们优秀且慷慨的\
  \ Java 专家社区共同努力的。\n\n到为止最有价值的意见来自我的朋友 Gail Anderson、John Stephen Green 和 Joseph\
  \ Ottinger。Gail 和 Joseph 充满活力地投入书中，修改了几乎所有的句子使它们变得更好。剩下的任何糟糕文本都是他们完成评审后添加的。John\
  \ 费力地运行了所有的代码示例，是少数弄清楚 `VTable` 如何工作的读者之一。\n\n我们的前 10 位超级评审员每人至少贡献了 25 条意见：\n\n\
  * Gail Anderson\n* Alasdair Collinson\n* Joseph Ottinger\n* Vlad Lazurenko\n* John\
