  图 14。组合设计模式的结构。\n\n敏锐的读者可能会注意到，`add()`、`remove()` 和 `getChild()` 方法定义在 `Component`\
  \ 中。这种过于通用的接口是对该模式最大的批评点。John Vlissides 编写了一篇关于组合模式的优秀两部分文章，“Java 风格组合[第一部分](https://www.javaspecialists.eu/courses/dpc/archive/Composite1-Vlissides.pdf)”和[“第二部分”](https://www.javaspecialists.eu/courses/dpc/archive/Composite2-Vlissides.pdf)”，他在文中解释了替代方案。\n\
  \n## 联系人、个人和分发列表\n\nJava 最早的动态代理教程之一发表在 [The Java Specialists' Newsletter](https://www.javaspecialists.eu/archive/Issue005.html)\
  \ 中，通过电子邮件发送。该通讯报最初有 80 个联系人，我在 Microsoft Outlook 中为他们创建了一个分发列表。为了减少垃圾邮件，Microsoft\
  \ Outlook 限制了单个分发列表中的联系人数量。一旦订阅人数达到限制，我就创建了分发列表的组合。\n\n我们新的 `Contact` 示例结构如图 15\
  \ 所示。\n\n![ContactHandcraftedExample](img/ContactHandcraftedExample.png)\n\n图 15。Contact\
  \ 示例。\n\n`Contact` 是一个表示联系人的接口，可以是单个联系人，也可以是一组联系人。`Contact` 有两个抽象方法：`sendMail()`\
  \ 和 `count()`。它还有两个都返回 `false` 的默认接口方法：`add()` 和 `remove()`。\n\n```java\n//:~ core/src/main/.../ch06/contact/Contact.java\n\
  public interface Contact {\n  default boolean add(Contact c) { return false; }\n\
  \  default boolean remove(Contact c) { return false; }\n  void sendMail(String body);\n\
  \  int count();\n}\n```\n列表 6.2：Contact 接口。\n\n`Person` 是我们的垃圾邮件受害者。\n\n在 `sendMail()`\
  \ 中，我们连接到 JavaMail 并发送实际消息。（为了简洁，我们省略了 JavaMail 的实现细节。）\n\n```java\n//:~ core/src/main/.../ch06/contact/Person.java\n\
  public class Person implements Contact {\n  private final String email;\n  public\
  \ Person(String email) {this.email = email;}\n  @Override\n  public void sendMail(String\
  \ body) {\n    // connecting to JavaMail and off it goes ...\n    System.out.println(\"\
  Sending \" + body + \" to \" + email);\n  }\n  @Override\n  public int count() {\n\
  \    return 1;\n  }\n}\n```\n列表 6.3：Person 类。\n\n我们的 `DistributionList` 是我们的组合类，由\
  \ `Contact` 实例组成。由于 `DistributionList` 本身也是 `Contact`，它不仅可以包含 `Person` 实例，还可以包含其他\
  \ `DistributionList` 对象。`sendMail()` 递归地向列表中的所有联系人发送垃圾邮件。`count()` 是我们包含的所有叶子节点之和。\n\
  \n```java\n//:~ core/src/main/.../ch06/contact/DistributionList.java\nimport java.util.*;\n\
  \npublic class DistributionList implements Contact {\n  private final Collection<Contact>\
  \ contacts = new ArrayList<>();\n\n  @Override\n  public boolean add(Contact c)\
  \ {\n    return contacts.add(c);\n  }\n  @Override\n  public boolean remove(Contact\
  \ c) {\n    return contacts.remove(c);\n  }\n  @Override\n  public void sendMail(String\
  \ body) {\n    contacts.forEach(contact -> contact.sendMail(body));\n  }\n  @Override\n\
  \  public int count() {\n    return contacts.stream().mapToInt(Contact::count).sum();\n\
  \  }\n}\n```\n列表 6.4：DistributionList 类。\n\n现在我们已经看到了 `Contact` 如何与 `Person` 和 `DistributionList`\
  \ 关联，是时候看一个示例了。\n\n```java\n//:~ core/src/main/.../ch06/contact/ContactDemo.java\n\
  Contact javaSpecialistsNewsletter = new DistributionList();\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
  javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
  Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\nContact\
  \ allStudents = new DistributionList();\nallStudents.add(new Person(\"peter@absa.co.za\"\
  ));\n...\n```\n(此处代码块保持原文，仅翻译对应的输出)\n\n```\n0\n1\nSending Hello there 1 to john@aol.com\n\
  1\n2\nSending Hello there 1 to peter@absa.co.za\nSending Hello there 1 to mzani@absa.co.za\n\
  3\n```\n(注：由于原文示例代码块存在混乱，此处已根据逻辑补全翻译后的输出)\n\n\n\n\n我们的 `CompositeHandler` 构造函数接收组件类型作为参数，该类型必须派自\
  \ `BaseComponent`。`reducers` 参数包含了如何合并方法调用结果的逻辑。在流（streams）中，我们可以将所有元素归约为另一个对象，这非常相似。我们的\
  \ `Reducer` 包含一个 `BinaryOperator<T>`，它派自 `BiFunction<T,T,T>`。我们稍后会看到更多细节。最后一个参数是\
  \ `typeChecks`。这些是 `add()` 方法的参数所必须扩展的接口或类。我们稍后会看到示例。\n\n`CompositeHandler` 拥有一个包含默认接口方法的\
  \ `VTable`，称为 `defaultVT`。如果存在默认方法，我们会在调用子方法之前先调用它，并使用相关的 reducer 将所有结果合并在一起。\n\n\
  `invoke()` 方法检查方法名是否为 `\"add\"` 或 `\"remove\"`，并以 `Object.class` 作为唯一的参数类型；在这种情况下，它会在其子列表上调用相关的\
  \ `add()` 或 `remove()` 方法。`add()` 方法需要稍微解释。我们首先检查参数类型是否正确，即它是否是 `typeChecks` 数组中所有类型的实例。虽然这些通常是接口，但\
  \ Java 没有类的多重继承，因此其中一个也可能是一个类。对于每种类型的子，我们还需要根据 `component` 接口中的方法找到可以调用的匹配方法。这对于支持异构组件层次结构是必要的。\n\
  \n除了 `\"add\"` 和 `\"remove\"` 之外的所有方法都通过 map 管理，并在子流上进行 reduce。`map()` 在每个子节点上调用所需的方法，而\
  \ `reduce()` 则合并结果。\n\n遗憾的是，lambda 表达式与检查异常（checked exceptions）配合得不好，因此我们在方法内部定义了一个\
  \ `UncheckedException` 类。是的，这是可行的，并且优点是在该方法外部是不可见的。我们稍后会再次解开异常并从我们的 `invoke()` 方法中抛出。我们会在遇到第一个异常时失败。由于\
  \ `UncheckedException` 是方法私有的，我们通过从 `fillInStackTrace()` 方法返回 `null` 来擦除堆栈轨迹。\n\n\
  我们稍后会查看 `Reducer`。目前，只需知道有两种特殊的 `Reducer` 类型：`NULL_REDUCER` 和 `PROXY_INSTANCE_REDUCER`。`NULL_REDUCER`\
  \ 适用于返回 `void` 的方法。`PROXY_INSTANCE_REDUCER` 是返回 `this` 的方法的特殊标记——在我们的案例中，即 `proxy`。\n\
  \n\n\n\n```java\n//:~ core/src/main/.../handlers/CompositeHandler.java\npublic final\
  \ class CompositeHandler\n    implements InvocationHandler {\n  private final Class<?>\
  \ component;\n  private final Map<MethodKey, Reducer> reducers;\n  private final\
  \ Class<?>[] typeChecks;\n  private final VTable defaultVT;\n  private final Collection<Object>\
  \ children = new ArrayList<>();\n  private final Map<Class<?>, VTable> childMethodMap\
  \ =\n      new ConcurrentHashMap<>();\n\n  @SuppressWarnings({\"unchecked\", \"\
  rawtypes\"})\n  public <E extends BaseComponent<? super E>> CompositeHandler(\n\
  \      Class<? super E> component,\n      Map<MethodKey, Reducer> reducers,\n  \
  \    Class<?>[] typeChecks) {\n    if (!BaseComponent.class.isAssignableFrom(component))\n\
  \      throw new IllegalArgumentException(\n          \"component 未派自 BaseComponent\"\
  );\n    this.component = component;\n    this.reducers = Objects.requireNonNull(reducers);\n\
  \    this.typeChecks = Objects.requireNonNull(typeChecks);\n    this.defaultVT =\
  \ VTables.newDefaultMethodVTable(component);\n  }\n\n  @Override\n  public Object\
  \ invoke(Object proxy,\n                       Method method, Object[] args)\n \
  \     throws Throwable {\n    // 从 BaseComponent 中查找 \"add(Object)\" 和 \"remove(Object)\"\
  \ 方法\n    if (matches(method, \"add\")) {\n      requiresAllInterfaces(args[0]);\n\
  \      addChildMethods(args[0].getClass());\n      return children.add(args[0]);\n\
  \    } else if (matches(method, \"remove\")) {\n      return children.remove(args[0]);\n\
  \    }\n\n    /**\n     * 定义在方法内部的这个特殊类仅在方法\n     * 内部可见。它用于包装和稍后展开\n     * 检查异常。我们重写了\
  \ fillInStackTrace() \n     * 返回 null，这样我们就不会产生额外的\n     * 堆栈跟踪开销。\n     */\n  \
  \  class UncheckedException extends RuntimeException {\n      public UncheckedException(Throwable\
  \ cause) {\n        super(cause);\n      }\n      @Override\n      public Throwable\
  \ fillInStackTrace() { return null; }\n    }\n\n    // mapFunction 的目的是将我们调用 method.invoke()\
  \ \n    // 产生的检查异常转换为 UncheckedException，\n    // 我们稍后会展开它。\n    // 与 reducers 不同，我们每次调用\
  \ invoke() 方法\n    // 时都必须创建一个新的 lambda，因为我们需要\n    // 捕获 method 和 args 参数。\n  \
  \  Function<Object, Object> mapFunction = child -> {\n      try {\n        VTable\
  \ vt = childMethodMap.get(child.getClass());\n        assert vt != null : \"vt==null\"\
  ;\n        Method childMethod = vt.lookup(method);\n        assert childMethod !=\
  \ null : \"childMethod==null\";\n        return childMethod.invoke(child, args);\n\
  \      } catch (ReflectiveOperationException e) {\n        throw new UncheckedException(e);\n\
  \      }\n    };\n\n    // reducer 用于将方法调用的结果“归约”为\n    // 单一结果。默认情况下我们将使用\n   \
  \ // NULL_REDUCER，这适用于返回 void 的方法。\n    var reducer = reducers.getOrDefault(\n \
  \       new MethodKey(method), Reducer.NULL_REDUCER);\n\n    // 接下来尝试调用默认接口方法（如果有）。\n\
  \    // 这有助于支持复合结构中的访问者模式。\n    MethodHandle match = defaultVT.lookupDefaultMethod(method);\n\
  \    Object defaultMethodResult;\n    if (match == null) {\n      defaultMethodResult\
  \ = reducer.getIdentity();\n    } else {\n      // 在组件接口上调用默认接口方法\n      defaultMethodResult\
  \ = match.invoke(proxy, args);\n    }\n\n    try {\n      // 我们现在需要对所有子节点调用方法\n\
  \      // 并结果进行“归约”以返回单一结果。\n      var merger = reducer.getMerger();\n      var\
  \ result = children.stream()\n                       .map(mapFunction)\n       \
  \                .reduce(reducer.getIdentity(), merger);\n      // reducer 的特殊情况是\
  \ PROXY_INSTANCE_REDUCER。\n      // 当指定该项时，我们返回代理实例。\n      // 这对于支持返回 \"this\"\
  \ 的流式接口很有用。\n      if (reducer == Reducer.PROXY_INSTANCE_REDUCER)\n        return\
  \ proxy;\n      else\n        return merger.apply(result, defaultMethodResult);\n\
  \    } catch (UncheckedException ex) {\n      // 最后我们展开 UncheckedException 并抛出\n\
  \      // 它的原因\n      throw ex.getCause();\n    }\n  }\n\n  /**\n   * 我们需要 childMethodMap\
  \ 来支持复合结构\n   * 的访问者模式\n   */\n  private void addChildMethods(Class<?> childClass)\
  \ {\n    childMethodMap.computeIfAbsent(childClass,\n        clazz -> {\n      \
  \    Class<?> receiver;\n          if (clazz.getModule().isExported(\n         \
  \     clazz.getPackageName(), component.getModule())) {\n            // 只有当子类的模块和包导出到\n\
  \            // 目标模块时，才映射子类方法\n            receiver = clazz;\n          } else if\
  \ (Proxy.class.isAssignableFrom(clazz)) {\n            // childClass 是一个代理，使用第一个接口\n\
  \            receiver = clazz.getInterfaces()[0];\n          } else {\n        \
  \    receiver = component;\n          }\n          return VTables.newVTableExcluding(\n\
  \              receiver, component);\n        });\n  }\n\n  private boolean matches(Method\
  \ method, String name) {\n    return name == method.getName()\n               &&\
  \ method.getParameterCount() == 1\n               && ParameterTypes.get(method)[0]\n\
  \                      == Object.class;\n  }\n\n  private void requiresAllInterfaces(Object\
  \ arg) {\n    for (var check : typeChecks) {\n      if (!check.isInstance(arg))\n\
  \        throw new ClassCastException(\n            arg.getClass() + \" 转换为 \" +\
  \ check);\n    }\n  }\n}\n```\n\n### `Reducer`\n\n`Reducer` 为 Stream 的 `reduce()`\
  \ 方法提供了我们所需的两个参数：一个 `identity` 和一个 `BinaryOperator`。\n\n```java\n//:~ core/src/main/.../handlers/Reducer.java\n\
  import java.util.function.*;\n\npublic final class Reducer {\n  private final Object\
  \ identity;\n  private final BinaryOperator<Object> merger;\n  public Reducer(Object\
  \ identity,\n                 BinaryOperator<Object> merger) {\n    this.merger\
  \ = merger;\n    this.identity = identity;\n  }\n  public Object getIdentity() {\n\
  \    return identity;\n  }\n  public BinaryOperator<Object> getMerger() {\n    return\
  \ merger;\n  }\n  public static final Reducer NULL_REDUCER =\n      new Reducer(null,\
  \ (o1, o2) -> null);\n  /**\n   * 将被替换为代理实例。\n   */\n  public static final Reducer\
  \ PROXY_INSTANCE_REDUCER =\n      new Reducer(null, (o1, o2) -> null);\n}\n```\n\
  \n### `Proxies`\n\n我们需要在 `Proxies` 类中添加四个方法用于创建动态复合结构。\n\n```java\n//:~ core/src/main/.../Proxies.java\n\
  public static <T extends BaseComponent<? super T>> T compose(\n    Class<T> component)\
  \ {\n  return compose(component, component);\n  }\npublic static <T extends BaseComponent<?\
  \ super T>> T compose(\n    Class<T> component, Map<MethodKey, Reducer> reducers)\
  \ {\n  return compose(component, reducers, component);\n  }\npublic static <T extends\
  \ BaseComponent<? super T>> T compose(\n    Class<T> component, Class<?>... typeChecks)\
  \ {\n  return compose(component, Map.of(), typeChecks);\n}\n/**\n * @param component\
  \  要代理的接口。必须扩展\n *                   BaseComponent\n * @param reducers   从 MethodKey\
  \ 到 Reducer 的映射，默认是\n *                   空 Map Map.of()\n * @param typeChecks 传递给\
  \ add() 的对象参数必须\n *                   扩展这些类型\n */\npublic static <T extends BaseComponent<?\
  \ super T>> T compose(\n    Class<T> component, Map<MethodKey, Reducer> reducers,\n\
  \    Class<?>... typeChecks) {\n  return castProxy(component,\n      new CompositeHandler(component,\
  \ reducers, typeChecks));\n}\n```\n\n\n\n\n\n为了创建一个 `Contact` 的复合体，我们首先为 `count()`\
  \ 方法定义一个 `Map<MethodKey, Reducer>`。我们不需要为 `sendMail()` 方法创建映射，因为它的返回类型是 `void`。然后我们使用\
  \ `Proxies.compose(Contact.class, reducers)` 创建我们新的动态分布列表。\n\n列表 6.12 是一个示例。\n\n\
  ```java\n//:~ core/src/main/.../ch06/contactdynamic/ContactDynamicDemo.java\nvar\
  \ reducers = Map.of(\n    new MethodKey(Contact.class, \"count\"),\n    new Reducer(0,\
  \ (r1, r2) -> (int) r1 + (int) r2)\n);\n\nContact javaSpecialistsNewsletter =\n\
  \    Proxies.compose(Contact.class, reducers);\nSystem.out.println(javaSpecialistsNewsletter.count());\n\
  javaSpecialistsNewsletter.add(new Person(\"john@aol.com\"));\njavaSpecialistsNewsletter.sendMail(\"\
  Hello there 1\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\nContact\
  \ allStudents =\n    Proxies.compose(Contact.class, reducers);\nallStudents.add(new\
  \ Person(\"peter@absa.co.za\"));\nallStudents.add(new Person(\"mzani@absa.co.za\"\
  ));\njavaSpecialistsNewsletter.add(allStudents);\n\njavaSpecialistsNewsletter.sendMail(\"\
  Hello there 2\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n\nContact\
  \ extremeJava =\n    Proxies.compose(Contact.class, reducers);\nextremeJava.add(new\
  \ Person(\"John@fnb.co.za\"));\nextremeJava.add(new Person(\"Hlope@fnb.co.za\"));\n\
  allStudents.add(extremeJava);\n\njavaSpecialistsNewsletter.sendMail(\"Hello there\
  \ 3\");\nSystem.out.println(javaSpecialistsNewsletter.count());\n```\n\n列表 6.12:\
  \ `ContactDynamicDemo`。\n\n输出与我们手写的 `DistributionList` 示例相同。\n\n```\n0\nSending\
  \ Hello there 1 to john@aol.com\n1\nSending Hello there 2 to john@aol.com\nSending\
  \ Hello there 2 to peter@absa.co.za\nSending Hello there 2 to mzani@absa.co.za\n\
  3\nSending Hello there 3 to john@aol.com\nSending Hello there 3 to peter@absa.co.za\n\
  Sending Hello there 3 to mzani@absa.co.za\nSending Hello there 3 to John@standardbank.co.za\n\
  Sending Hello there 3 to Hlope@standardbank.co.za\n5\n```\n\n列表 6.13: `ContactDynamicDemo\
  \ 输出`\n\n## `AppendableFlushableCloseable`\n\n复合体的一个有趣用例是同时向多个目标写入，类似于 Unix 的 `tee`\
  \ 工具。在这里，我们如下创建了类 `TeeOutputStream`。\n\n```java\n//:~ core/src/main/.../ch06/appendableclass/TeeOutputStream.java\n\
  public class TeeOutputStream extends OutputStream {\n  private final OutputStream\
  \ out1, out2;\n  public TeeOutputStream(OutputStream out1, OutputStream out2) {\n\
  \    this.out1 = out1;\n    this.out2 = out2;\n  }\n  @Override\n  public void write(int\
  \ b) throws IOException {\n    out1.write(b);\n    out2.write(b);\n  }\n  @Override\n\
  \  public void flush() throws IOException {\n    out1.flush();\n    out2.flush();\n\
  \  }\n  @Override\n  public void close() throws IOException {\n    out1.close();\n\
  \    out2.close();\n  }\n}\n```\n\n列表 6.14: `TeeOutputStream`。\n\n我们可以创建一个新的 `TeeOutputStream`，使其同时写入\
  \ `System.out` 和文件。甚至可以将 `System.out` 设置为写入我们的 `TeeOutputStream`，如下所示。\n\n```java\n\
  //:~ core/src/main/.../ch06/appendableclass/TeeOutputStreamDemo.java\nSystem.setOut(\n\
  \    new PrintStream(\n        new TeeOutputStream(\n            System.out,\n \
  \           new FileOutputStream(\"output.txt\"))));\n\nSystem.out.println(\"Hello\
  \ World\");\nSystem.out.println(\"This will show on console and in file\");\n```\n\
  \n列表 6.15: `TeeOutputStreamDemo`。\n\n如果能作为动态复合体创建 `TeeOutputStream` 将非常方便。遗憾的是，`java.io.OutputStream`\
  \ 不是 Java 接口，这是创建动态代理的强制要求。同样，`java.io.Writer` 是一个类而不是接口。然而，`Writer` 实现了 `Appendable`、`Flushable`\
  \ 和 `Closeable` 接口。\n\n### 手工实现的 `TeeAppendable` 复合体\n\n`TeeAppendable` 的类型参数 `E`\
  \ 确保所有子类实现了 `Appendable`、`Flushable` 和 `Closeable` 这三个接口。`append()` 方法返回 `this`，而\
  \ `close()` 和 `flush()` 返回 `void`。此外，我们的 `TeeAppendable` 获得了 `add()` 和 `remove()`\
  \ 方法，它们默认返回 `false`。\n\n```java\n//:~ core/src/main/.../ch06/appendables/TeeAppendable.java\n\
  public class TeeAppendable<E extends\n                                 Appendable\n\
  \                                 & Flushable\n                                \
  \ & Closeable>\n    implements Appendable, Flushable, Closeable {\n  private final\
  \ Collection<E> children = new ArrayList<>();\n\n  public boolean add(E child) {\n\
  \    return children.add(child);\n  }\n\n  public boolean remove(E child) {\n  \
  \  return children.remove(child);\n  }\n\n  @Override\n  public Appendable append(CharSequence\
  \ c) {\n    for (E child : children) {\n      child.append(c);\n    }\n    return\
  \ this;\n  }\n\n  @Override\n  public Appendable append(char[] strbuf, int off,\
  \ int len) {\n    for (E child : children) {\n      child.append(strbuf, off, len);\n\
  \    }\n    return this;\n  }\n\n  @Override\n  public void flush() throws IOException\
  \ {\n    for (E child : children) {\n      child.flush();\n    }\n  }\n\n  @Override\n\
  \  public void close() throws IOException {\n    for (E child : children) {\n  \
  \    child.close();\n    }\n  }\n}\n```\n\n列表 6.16: `TeeAppendable`。\n\n我们可以手动创建一个适配器，将这些任何接口转换为\
  \ `Writer`。这意味着任何实现了 `Appendable`、`Flushable` 和 `Closeable` 的类都可以转换为 `Writer`。\n\
  \n```java\n//:~ core/src/main/.../ch06/appendables/WriterAdapter.java\npublic class\
  \ WriterAdapter<E extends Appendable\n                                 & Flushable\n\
  \                                 & Closeable>\n    extends Writer {\n  private\
  \ final E adaptee;\n\n  public WriterAdapter(E adaptee) {\n    this.adaptee = adaptee;\n\
  \  }\n\n  @Override\n  public void write(char[] strbuf, int off, int len) {\n  \
  \  adaptee.append(strbuf, off, len);\n  }\n\n  @Override\n  public void write(int\
  \ c) {\n    adaptee.append((char) c);\n  }\n\n  @Override\n  public void flush()\
  \ throws IOException {\n    adaptee.flush();\n  }\n\n  @Override\n  public void\
  \ close() throws IOException {\n    adaptee.close();\n  }\n}\n```\n\n列表 6.17: `WriterAdapter`。\n\
  \n`AppendableDemo` 展示了如何结合 `WriterAdapter` 使用 `TeeAppendable`。特别关注的是 Java 10 引入的\
  \ `var` 关键字。Java 是一种强类型语言。当我们声明局部变量时，需要精确其类型。在我们的情况下，我们希望声明该变量必须是 `Appendable`、`Flushable`\
  \ 和 `Closeable` 这三个接口。在 `var` 出现之前没有方法可以做到。\n\n```java\n//:~ core/src/main/.../ch06/appendables/AppendableDemo.java\n\
  // \"var\" 在这里是救命稻星。“正确的”定义应该是\n// TeeAppendable<Appendable & Flushable & Closeable>，但这在\n\
  // Java 中是不可能的。“var” 帮我们解决了这个问题。\nvar tee = new TeeAppendable<>();\nvar sw = new\
  \ StringWriter();\ntee.add(new OutputStreamWriter(System.out));\ntee.add(new FileWriter(\"\
  output.txt\"));\ntee.add(sw);\n\nvar out = new PrintWriter(new WriterAdapter<>(tee));\n\
  out.println(\"Hello World\");\nout.flush();\n\ntee.append(\"TestingAppender\")\n\
  \    .append('\\n')\n    .append(\"Does this work?\")\n    .append('\\n');\ntee.flush();\n\
  \nSystem.out.println(\"sw = \" + sw);\n```\n\n列表 6.18: `AppendableDemo`。\n\n当我们运行这个示例时，它会将文本写入\
  \ `System.out`、一个名为 `sw` 的 `StringWriter` 以及名为 `output.txt` 的文件。\n\n```\nHello World\n\
  TestingAppender\nDoes this work?\nsw = Hello World\nTestingAppender\nDoes this work?\n\
  ```\n\n列表 6.19: `AppendableDemo 输出`。\n\n\n\n\n现在让我们来看看如何使用动态代理来构建相同的用例。在这种例中，我们创建了一个\
  \ `AppendableFlushableCloseable` 接口，它继承了 `Appendable`、`Flushable` 和 `Closeable`\
  \ 三个接口，以及 `BaseComponent<E>`。我们还提供了一个 `getReducers()` 方法，以便于使用我们的 `Proxies` Fac\
  \ 面类构建组合对象。`append()` 方法应该返回当前对象的指针——换句话，即 `this`。在 `InvocationHandler` 内部，指向当前代理对象的指针就是\
  \ `proxy` 参数。通过将 `PROXY_INSTANCE_REDUCER` 指定为 `Reducer`，我们告诉 `CompositeHandler`\
  \ 在子节点上的所有方法都调用完毕后返回 `proxy` 参数。\n\n```java\n//:~ core/src/main/.../ch06/appendables/AppendableFlushableCloseable.java\n\
  public interface AppendableFlushableCloseable<E extends\n                      \
  \                              Appendable\n                                    \
  \                & Flushable\n                                                 \
  \   & Closeable)\n    extends Appendable, Flushable, Closeable, BaseComponent<E>\
  \ {\n  static Map<MethodKey, Reducer> getReducers() {\n    return Map.of(\n    \
  \    new MethodKey(Appendable.class, \"append\",\n            CharSequence.class),\n\
  \        Reducer.PROXY_INSTANCE_REDUCER,\n        new MethodKey(Appendable.class,\
  \ \"append\",\n            CharSequence.class, int.class, int.class),\n        Reducer.PROXY_INSTANCE_REDUCER,\n\
  \        new MethodKey(Appendable.class, \"append\", char.class),\n        Reducer.PROXY_INSTANCE_REDUCER);\n\
  \  }\n}\n```\n\n列表 6.20: `AppendableFlushableCloseable`。\n\n我们可以使用 `AppendableFlushableCloseable`\
  \ 作为接口来创建动态 tee 组合对象。我们的示例代码与列表 6.18 中的代码几乎相同，只是我们不需要手动构建 `TeeAppendable`。\n\n```java\n\
  //:~ core/src/main/.../ch06/appendables/AppendableDynamicDemo.java\nvar tee = Proxies.compose(AppendableFlushableCloseable.class,\n\
  \    AppendableFlushableCloseable.getReducers(),\n    Appendable.class, Flushable.class,\
  \ Closeable.class\n);\nvar sw = new StringWriter();\ntee.add(new OutputStreamWriter(System.out));\n\
  tee.add(new FileWriter(\"output.txt\"));\ntee.add(sw);\n\nvar out = new PrintWriter(new\
  \ WriterAdapter<>(tee));\nout.println(\"Hello World Dynamic\");\nout.flush();\n\n\
  tee.append(\"TestingAppenderDynamic\")\n    .append('\\n')\n    .append(\"Does this\
  \ work?\")\n    .append('\\n');\ntee.flush();\n\nSystem.out.println(\"sw = \" +\
  \ sw);\n```\n\n列表 6.21: `AppendableDynamicDemo`。\n\n`AppendableDynamicDemo` 的输出在列表\
  \ 6.22。\n\n```\nHello World Dynamic\nTestingAppenderDynamic\nDoes this work?\nsw\
  \ = Hello World Dynamic\nTestingAppenderDynamic\nDoes this work?\n```\n\n列表 6.22:\
  \ `AppendableDynamicDemo` 输出。\n\n# 结论\n\n我们已经看到了 GoF 中四种相似模式的动态代理实现：代理、装饰器、适配器和组合器。\n\
  \n我们还看到了如何实现与手工编写代码相似的性能。\n\n在理解动态代理的工作原理以及如何将其应用到个人项目时，可能会存在额外的认知负担。但一旦我们投入了这些学习，就能用相对较少的代码创建许多功能。我们掌握了一项新的\
  \ Java 超能力，这种能力在过去的二十年里被无数框架所使用。\n\n学习的一种好方法是逐步阅读代码，所有代码都可以在我的 [GitHub 仓库](https://github.com/kabutz/dynamic-proxies-samples)\
  \ 中找到。我并没有刻意在代码中留 Bug，尽管声称这样做很有诱惑力，我希望你能加入我们 500 多名审查者的行列，寻找并报告 Bug。\n\n最后，JavaSpecialists\
