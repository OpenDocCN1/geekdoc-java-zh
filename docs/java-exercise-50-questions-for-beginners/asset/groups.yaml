- md: "\n# Java Exercise\n\n## 50 Questions for Beginners\n\nString/Integer/Long/Exception/static\
    \ initializer/ constructor/File/Files/Zip/Properties/StringBuilder/LocalDate//Random/Array/ArrayList/HashMap/LinkedHashMap/Functional\
    \ Interface/Lambda/Stream/Objects/Optional/etc...\n\n# Java 8\n\n![](img/d44b1b31b1a2c9a0f37a32a18b02a859_0_0.png)\n\
    \n# Java Exercise\n\n## 50 Questions for Beginners\n\n# Introduction\n\nThis book\
    \ is for Java learners especially beginners to intermediate people. This book\
    \ covers below. Java version is 8.\n\nString/Integer/Long/Exception/static initializer/constructor/File/Files/Zip/Properties/StringBuilder/LocalDateTime//Random/Array/ArrayList/HashMap/LinkedHashMap/Functional\
    \ Interface/Lambda/Stream/Objects/etc...\n\nAfter learning basic concepts and\
    \ grammar, the next step is to read and understand code. Code of this book includes\
    \ various methods of classes mentioned above.\n\nThere are 50 questions. At the\
    \ beginning, questions are easy. However, they get more difficult gradually to\
    \ the end.\n\nThe main purpose of this book is to improve code reading comprehension,\
    \ not grammar theory in detail or something like that.\n\nPlease kindly note that\
    \ there are confusing questions (not recommended in real developing field) for\
    \ the purpose.\n\nQuestions begin from the next page.\n\nHope you learn and discover\
    \ something new.\n\n# Question 1\n\nSelect the one statement that describes the\
    \ result when this program is compiled and run.\n\n```java\npublic class Question_1\
    \ {\n    public static void main(String[] args) {\n        int a = 1;\n      \
    \  int b = 2;\n        int c = 3;\n\n        if (a + b == c) {\n            System.out.println(method1()[0]);\n\
    \        }\n    }\n\n    private static String[] method1() {\n        String[]\
    \ array = new String[1];\n        StringBuilder sb = new StringBuilder();\n  \
    \      sb.append(\"Be a \");\n        sb.append(\"Java \");\n        sb.append(\"\
    Programmer\");\n        array[0] = sb.toString();\n        return array;\n   \
    \ }\n}\n```\n\n- (A) output Be a Java Programmer\n- (B) output nothing\n- (C)\
    \ compile error\n- (D) runtime exception\n\nAnswer : (A) output \"Be a Java Programmer\"\
    \n\nMethod method1() returns array of String type, and set String from StringBuilder\
    \ Object to the array[0].\n\nTherefore, this program outputs \"Be a Java Programmer\"\
    \ without any error.\n\n# Notes :\n\n- (1) condition in statement\n\nYou have\
    \ probably seen simple condition like \"a == 1\" for your learning, you can also\
    \ calculate in condition brackets like at line 7 in the question \"a + b == c\"\
    .\n\n- (2) StringBuilder\n\nStringBuilder is frequently used in Java Programming,\
    \ because it is faster than concatenating by using String object only.\n\nIn many\
    \ cases after that, to covert from StringBuilder object to String object, programmers\
    \ use method \"toString()\".\n\nWhen you initialize StringBuilder, you can do\
    \ it in two ways.\n\nFirst, initialize empty StringBuilder object like at line\
    \ 15 in the question \"StringBuilder sb = new StringBuilder();\",\n\nSecond, you\
    \ can also do it with a String like this \"StringBuilder sb = new StringBuilder(\"\
    text\").\",\n\nYou can simplify your code if you are decided to append first string\
    \ by using this way.\n\n# Question 2\n\n```java\npublic class Question_2_1 {\n\
    \    private String a = \"str\";\n    private Long b = 1L;\n    private int c\
    \ = 0;\n}\n```\n\nSelect the one statement that describes the result when the\
    \ program that extends the program above is compiled and run.\n\n```java\npublic\
    \ class Question_2_2 extends Question_2_1 {\n    public static void main(String[]\
    \ args) {\n        for (int i = 0; i < 5; i++) {\n            if (true) {\n  \
    \              if (true) {\n                    System.out.println(a);\n     \
    \               System.out.println(b);\n                }\n            }\n   \
    \         System.out.println(c);\n        }\n    }\n}\n```\n\n- (A) output str10\n\
    - (B) output 0\n- (C) compile error\n- (D) runtime exception\n\nAnswer : (C) compile\
    \ error\n\nThe access modifiers fields of super class Question_2_1 are all private\
    \ and non-static. If they are all public and static, compile error doesn't occur\
    \ like code below.\n\n```java\npublic class Question_2_1 {\n    public static\
    \ String a = \"str\";\n    public static Long b = 1L;\n    public static int c\
    \ = 0;\n}\n```\n\nAnd also, sub class can use fields of Super class, because it\
    \ extends Question_2_2.\n\nNotes\n\n- (1) condition in if statement\n\nConditions\
    \ in if statement requires boolean, type, so you can write \"true\" or \"false\"\
    \ in it. If you write true, the inside code will always be executed, and false,\
    \ the code inside it will never be executed.\n\nIt is called \"Unreachable Statement\"\
    .\n\nOne more thing, like this question, writing \"true\" in if condition is not\
    \ recommended in real coding situation, because if so, You Don't have to use if\
    \ statement if the code inside will always be executed.\n\n- (2) System.out.println()\n\
    \nYou have probably seen outputting String with it, but you can output other types\
    \ with it, like Long, int, and so on. System.out.println()\n\n# Question 3\n\n\
    Select the one statement that describes the result when this program is compiled\
    \ and run.\n\n```java\npublic class Question_3 {\n    public static void main(String[]\
    \ args) {\n        LocalDateTime ldt1 = LocalDateTime.now();\n        LocalDateTime\
    \ ldt2 = ldt1.plusDays(0);\n        if (!ldt2.isAfter(ldt1)) {\n            System.out.println(\"\
    ldt1 and ldt2\");\n        } else if (ldt2.isBefore(ldt1)) {\n            System.out.println(\"\
    ldt1 and not same\");\n        }\n    }\n\n    private static boolean isTime(LocalDateTime\
    \ ldt) {\n        boolean flg = true;\n        return flg;\n    }\n}\n```\n\n\
    - (A) output ldt1 and ldt2\n- (B) output ldt1 and not same\n- (C) nothing\n- (D)\
    \ runtime exception\n\nAnswer : (A) output \"ldt1 and ldt2\"\n\nIn this code,\
    \ however, flg is true because ldt1 is object.\n\nNotes\n\n- (1) LocalDateTime\n\
    \nThis is added from Java 8. You can use format yyyy-MM-ddTHH:mm:ss.SSS.\n\n-\
    \ (2) return\n\nThere are two ways to use it.\n\n- (3) instanceof\n\nThis operator\
    \ checks if parameter is given class. At line 21 this question.\n\n# Question\
    \ 4\n\nSelect the one statement as code replacement for \"// code\" to output\
    \ \"JAVA\".\n\n```java\npublic class Question_4 {\n    public static void main(String[]\
    \ args) {\n        LinkedHashMap<String, String> map = new LinkedHashMap<>();\n\
    \n        map.put(\"1\", \"J\");\n        map.put(\"2\", \"A\");\n        map.put(\"\
    3\", \"V\");\n        map.put(\"4\", \"A\");\n\n        if (true) {\n        \
    \    map.entrySet().stream().forEach(e -> {\n                System.out.print(e.getKey());\n\
    \            });\n        } else {\n            map.entrySet().stream().forEach(e\
    \ -> {\n                System.out.print(e.getValue());\n            });\n   \
    \     }\n    }\n}\n```\n\n- (A) boolean flg = true;\n- (B) boolean flg = false;\n\
    - (C) Boolean flg = null;\n- (D) Object flg = null;\n\nAnswer : (B) boolean flg\
    \ = false;\n\nIn this code, creating map object and putting keys and values. The\
    \ goal is to output values inside map object in adding order.\n\nIn condition\
    \ of if statement at line 15, If flg is true, the program will output all keys,\
    \ and false, all values. So the answer is (B).\n\nNotes\n\n- (1)LinkedHashMap\n\
    \nWhen you start learning Java, you learn HashMap first in most cases. In this\
    \ case however, you have to output all values in adding order. HashMap doesn't\
    \ guarantee the order, so this is why this code uses LinkedHashMap instead.\n\n\
    - (2) choice (C) and (D)\n\nAbout choice (C) : If you write \"Boolean flg = null;\"\
    \ in your code, compile error doesn't occur, but if you write \"boolean flg =\
    \ null;\" in your code, it occurs.\n\nThis is the difference between primitives\
    \ and objects. Primitives are values themselves. Objects provide reference, and\
    \ null means there is no reference. Therefore, Objects are called \"nullable\"\
    .\n\nAbout choice (D) : Object class wraps all classes, so compile error doesn't\
    \ occur if you write it in your code.\n\n- (3)forEach\n\nThis is a method in StreamAPI\
    \ that added from Java 8. It does something with all elements inside the stream.\n\
    \nIt is better for beginners to think about it as an alternative way to write\
    \ for loop of collection. Strictly, they are not the same, but it is enough at\
    \ first.\n"
  mdcn: "\n\n# Java 练习\n\n## 针对初者的 50 道题\n\nString/Integer/Long/Exception/static初始化/构造函数/File/Files/Zip/Properties/StringBuilder/LocalDate//Random/Array/ArrayList/HashMap/LinkedHashMap/Functional\
    \ Interface/Lambda/Stream/Objects/Optional/等...\n\n# Java 8\n\n![](img/d44b1b31b1a2c9a0f37a32a18b02a859_0_0.png)\n\
    \n# Java 练习\n\n## 针对初者的 50 道题\n\n# 引言\n\n本书适用于 Java 学习者，特别是初级和中级人员。本书涵盖了以下内容。Java\
    \ 版本为 8。\n\nString/Integer/Long/Exception/static初始化/构造函数/File/Files/Zip/Properties/StringBuilder/LocalDateTime//Random/Array/ArrayList/HashMap/LinkedHashMap/Functional\
    \ Interface/Lambda/Stream/Objects/等...\n\n在学习基础概念和语法之后，下一步是阅读和理解代码。书中的代码包含了上述类的各种方法。\n\
    \n共有 50 道题。刚开始时题目比较简单，但难度会逐渐增加到最后。\n\n本书的主要目的是提高代码代码的理解能力，而不是详细的语法理论之类的内容。\n\n\
    请注意，为了教学目的，书中包含了一些容易混淆的问题（不建议在实际开发中使用）。\n\n题目从下一页开始。\n\n希望你从中学习并发现新知识。\n\n# 第\
    \ 1 题\n\n选择描述该程序编译并运行结果的陈述。\n\n```java\npublic class Question_1 {\n    public\
    \ static void main(String[] args) {\n        int a = 1;\n        int b = 2;\n\
    \        int c = 3;\n\n        if (a + b == c) {\n            System.out.println(method1()[0]);\n\
    \        }\n    }\n\n    private static String[] method1() {\n        String[]\
    \ array = new String[1];\n        StringBuilder sb = new StringBuilder();\n  \
    \      sb.append(\"Be a \");\n        sb.append(\"Java \");\n        sb.append(\"\
    Programmer\");\n        array[0] = sb.toString();\n        return array;\n   \
    \ }\n}\n```\n\n- (A) 输出 Be a Java Programmer\n- (B) 输出为空\n- (C) 编译错误\n- (D) 运行时异常\n\
    \n答案：(A) 输出 \"Be a Java Programmer\"\n\nMethod method1() 返回 String 类型的数组，并将来自\
    \ StringBuilder 对象的字符串设置到 array[0]。\n\n因此，该程序在无任何错误的情况下输出 \"Be a Java Programmer\"\
    。\n\n# 注意：\n\n- (1) 语句中的条件\n\n在学习过程中你可能已经见过像 \"a == 1\" 这样的简单条件，你也可以在条件括号中进行计算，例如题目中第\
    \ 7 行的 \"a + b == c\"。\n\n- (2) StringBuilder\n\nStringBuilder 在 Java 编程中被频繁使用，因为它比仅使用\
    \ String 对象进行拼接要快。\n\n在之后的很多情况下，为了将 StringBuilder 对象转换为 String 对象，程序员会使用 \"toString()\"\
    \ 方法。\n\n初始化 StringBuilder 时，你有两种方式。\n\n首先，初始化一个空的 StringBuilder 对象，如题目中第 15 行所示：\"\
    StringBuilder sb = new StringBuilder();\"，其次，你也可以像这样使用一个字符串来初始化：\"StringBuilder\
    \ sb = new StringBuilder(\"text\").\"。\n\n如果你决定先追加第一个字符串，可以使用这种方法来简化代码。\n\n# 第\
    \ 2 题\n\n```java\npublic class Question_2_1 {\n    private String a = \"str\"\
    ;\n    private Long b = 1L;\n    private int c = 0;\n}\n```\n\n选择描述继承上述程序的程序在编译并运行结果的陈述。\n\
    \n```java\npublic class Question_2_2 extends Question_2_1 {\n    public static\
    \ void main(String[] args) {\n        for (int i = 0; i < 5; i++) {\n        \
    \    if (true) {\n                if (true) {\n                    System.out.println(a);\n\
    \                    System.out.println(b);\n                }\n            }\n\
    \            System.out.println(c);\n        }\n    }\n}\n```\n\n- (A) 输出 str10\n\
    - (B) 输出 0\n- (C) 编译错误\n- (D) 运行时异常\n\n答案：(C) 编译错误\n\n父类 Question_2_1 的字段访问修饰符全是\
    \ private 且非 static。如果它们都是 public  static，如下面的代码所示，就不会发生编译错误。\n\n```java\npublic\
    \ class Question_2_1 {\n    public static String a = \"str\";\n    public static\
    \ Long b = 1L;\n    public static int c = 0;\n}\n```\n\n而且，子类可以使用父类的字段，因为它继承了\
    \ Question_2_2。\n\n注意\n\n- (1) if 语句中的条件\n\nif 语句中的条件需要布尔类型类型，所以你可以在里面写 \"true\"\
    \ 或 \"false\"。如果你写 true，则内部代码将始终执行；如果写 false，则内部代码将永远不会执行。\n\n这被称为“不可达语句”（Unreachable\
    \ Statement）。\n\n还有一点，像这道题一样，在实际编码场景中不建议在 if 条件中写 \"true\"，因为如果内部代码始终会执行，你就不需要使用\
    \ if 语句了。\n\n- (2) System.out.println()\n\n你可能已经见过用它输出 String，但你也可以用它输出其他类型，如\
    \ Long、int 等。System.out.println()\n\n# 第 3 题\n\n选择描述该程序编译并运行结果的陈述。\n\n```java\n\
    public class Question_3 {\n    public static void main(String[] args) {\n    \
    \    LocalDateTime ldt1 = LocalDateTime.now();\n        LocalDateTime ldt2 = ldt1.plusDays(0);\n\
    \        if (!ldt2.isAfter(ldt1)) {\n            System.out.println(\"ldt1 and\
    \ ldt2\");\n        } else if (ldt2.isBefore(ldt1)) {\n            System.out.println(\"\
    ldt1 and not same\");\n        }\n    }\n\n    private static boolean isTime(LocalDateTime\
    \ ldt) {\n        boolean flg = true;\n        return flg;\n    }\n}\n```\n\n\
    - (A) 输出 ldt1 and ldt2\n- (B) 输出 ldt1 and not same\n- (C) 输出为空\n- (D) 运行时异常\n\n\
    答案：(A) 输出 \"ldt1 and ldt2\"\n\n在这段代码中，flg 为 true 是因为 ldt1 是一个对象。\n\n注意\n\n- (1)\
    \ LocalDateTime\n\n这是从 Java 8 开始的。你可以使用格式 yyyy-MM-dd。\n\n- (2) return\n\n有两种方法使用它。\n\
    \n- (3) instanceof\n\n此运算符检查参数是否为某个类。在第 21 行。\n\n# 第 4 题\n\n选择作为 \"// code\" 的代码输出\
    \ \"JAVA\" 的陈述。\n\n```java\npublic class Question_4 {\n    public static void\
    \ main(String[] args) {\n        LinkedHashMap<String, String> map = new LinkedHashMap<>();\n\
    \n        map.put(\"1\", \"J\");\n        map.put(\"2\", \"A\");\n        map.put(\"\
    3\", \"V\");\n        map.put(\"4\", \"A\");\n\n        if (true) {\n        \
    \    map.entrySet().stream().forEach(e -> {\n                System.out.print(e.getKey());\n\
    \            });\n        } else {\n            map.entrySet().stream().forEach(e\
    \ -> {\n                System.out.print(e.getValue());\n            });\n   \
    \     }\n    }\n}\n```\n\n- (A) boolean flg = true;\n- (B) boolean flg = false;\n\
    - (C) Boolean flg = null;\n- (D) Object flg = null;\n\n答案：(B) boolean flg = false;\n\
    \n在这段代码中，创建 map 对象并存入键值。目标是按添加顺序输出 map 对象中的值。\n\n在第 15 行的 if 条件中，如果 flg 为 true，程序将输出所有键；如果是\
    \ false，则输出所有值。所以答案是 (B)。\n\n注意\n\n- (1)LinkedHashMap\n\n当你开始学习 Java 时，大多数情况下先学\
    \ HashMap。在这种情况下，我们需要按添加顺序输出所有值。HashMap 不保证顺序，所以这就是为什么这段代码使用 LinkedHashMap。\n\n\
    - (2)关于 (C) 和 (D)\n\n关于 (C)：如果你在代码中写 \"Boolean flg = null;\"，不会发生编译错误，但如果你在代码中写\
    \ \"boolean flg = null;\"，就会发生。\n\n这是基本类型和对象之间的区别。基本类型是值本身。对象提供引用，null 表示没有引用。因此对象是可以空的（nullable）。\n\
    \n关于 (D)：Object 类封装了所有类，所以如果你在代码中写它就不会发生编译错误。\n\n- (3)forEach\n\n这是 Java 8 添加的\
    \ StreamAPI 中的一个方法。它对流中的所有元素执行操作。\n\n对于初学者来说，最好将其视为编写集合 for 循环的替代方法。严格来说，它们并不相同，但起初足够了。\n\
    \n"
