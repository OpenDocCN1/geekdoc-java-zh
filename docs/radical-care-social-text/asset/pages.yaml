  md: '# Pitfalls and Challenges of Mutual Aid


    Charity and social services frameworks dominate mainstream understanding of what
    it means support people in crisis. Mutual aid is not charity. Aid, relief, and
    services are used in various contexts to denote the provision of support for survival
    to poor people where support is governed by rich people or government. Charity
    models promote the idea that most poverty is a result of immorality and only those
    who can prove their worth deserve help. Charity comes with eligibility requirements
    that relate to these moral frameworks of deservingness, as sobriety, piety, curfews,
    participation in job or parenting courses, cooperation with the police, or identifying
    the paternity of children. The determination of deservingness and undeservingness
    is based in cultural archetypes that pathologize Black families, poor women as
    overproductive, and criminalize poverty.²23. The conditions of receiving aid are
    so stigmatizing that they discipline everyone into taking any work at an exploitative
    wage or condition in order to avoid the fate of people who must seek relief. Charity
    makes rich people and corporations look generous and upholds and legitimizes the
    systems that concentrate wealth.²⁴


    Charity is increasingly privatized and contracted out to the nonprofit sector.
    Nonprofits compete for grants to address social problems. Elite donors decide
    what strategies should be funded and they protect their money from taxation by
    storing it in foundations that fund their projects, most of which have nothing
    to do with poor people. Even nonprofits that do purport to address poverty are
    mostly run by white elites. Nonprofit has reproduced antiracist and colonial relationships
    between the winners and losers of extractive, exploitative economic arrangements.²⁵


    Mutual aid projects face the challenge of avoiding the charity model. A member
    of North Valley Mutual Aid, a group working to support people displaced by the
    Camp Fire in Northern California, described how narratives of deservingness drove
    the attacks on the tent that emerged in a Walmart parking lot after the fire.²⁶
    In the days following the fire, as displaced people with more resources began
    leave the tent city, officials and media portrayed the people still living there
    as not displaced fire


    while failing to support people displaced by the disaster, Klein asks us to imagine
    getting rid of the undemocratic infrastructure of our lives and replacing it with
    people’s infrastructure. For social movements working to imagine and build a transition
    from extractive “dig, burn, dump” to sustainable, regenerative ways of living,
    mutual aid offers a way to meet current needs and prepare for disasters.²²


