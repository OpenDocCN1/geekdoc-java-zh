    # Gaps in Care: Institutional Failure and the Co-option of Care


    Our interpretation of radical care comprises underlying tensions. The first, referred
    to above, is the symbiotic and at contradictory relationship between self-care
    and for others. The second tension reveals the normative assumptions baked into
    care: it is essential for social reproduction and yet often invisible or undervalued,
    which means it is ripe for exploitation and co-option. Finally, a third tension
    within care is the expression of solidarity versus charity, or the way that care
    is mobilized as a response to neglect or catastrophe. In this section, we lay
    out these considerations against the financial and economic fashions that shape
    normative assumptions about who and what drive a practice of care.


