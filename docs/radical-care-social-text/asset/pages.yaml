    At the same time self-care became important to the business of caregiving, a pivot
    toward self-care as a radical praxis emerged as one that was particularly attentive
    to the gender power dynamics embedded within “women’s work.” In the early 1970s,
    autonomist Marxist feminists associated with the Italian capitalist Left pushed
    for the recognition of domestic and reproductive labor in the Wages for Housework
    campaign, during which Silvia Federico argued that “by denying housework wage
    and transforming it into an act of love, capital had killed many birds with one
    stone.”26 The movement, which spread internationally, critiqued the atomization
    and invisibility of women’s care within the domestic sphere that it made difficult
    for women to collectively organize other workers. By pushing for recognition in
    the public sphere, the individual-ized care performed for a spouse, child, or
    home tied to a larger collective action.


    Principles of collective care through self-care applied to antiracist and feminist
