    To be clear, the problems that radical care seek to remedy are not just a product
    of neoliberal policy or the election of Donald Trump and other authoritarian leaders.
    Histories of settler colonialism and centuries of exploitation inform the inequalities
    entangled with care today. As Leanne Betasamosake Simpson and Dionne Brand put
    it, “The monster has arrived, and the monster was always.”—37


    # Conclusion: Solidarity Not Charity


    As global capitalism breaks down in various sites across the globe, we see radical
    care emerge through collective action. While care is often fought, we end with
    a more hopeful depiction of radical care by highlighting the work of some organizations
    that offer examples of what we perceive above. Often the answer is through coalitional
    work: rather than looking only for those in their same social positions, coalitions
    inspire people to work together across class, race, ethnicity, religious, and
    state boundaries to a common cause.


    After state governments implemented austerity measures in the wake of the 2008
    financial crisis, people organized to care for those who were left in the cold.
    In Spain, the Plataforma de Afectados por la Hipoteca provides access to fair
    housing and social rents through mutual aid. The organization was spurred by the
    collapse of the real estate market and provides emotional as well economic support
    to those who cannot pay their mortgages. In Canada, austerity inspired a new wave
    of disability rights activism that following people with disabilities to directly
    hire their attendants through the Direct Funding Program.38 Communities come together
    and use radical care to provide assistance to those who are overlooked by the
    state and other institutions.


    Relief collectives provide supplies and labor on a grassroots level in response
    to the devastation wrought by hurricanes, intensified by climate change. Occupy
    Sandy is one example of the collective organization emerging from catastrophe.
    Rather than merely donating supplies, relief efforts included building sustainable
    communities, bolstering local businesses, and employing skill-sharing techniques.
    The work of Mutual Aid Disaster Relief, which employs the slogan “Solidarity Not
    Charity,” describes what


