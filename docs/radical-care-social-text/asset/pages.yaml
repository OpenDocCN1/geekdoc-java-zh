    # Spaces of Care within Death Worlds


    As these maps reflect, and return to Barbara''s e-mail, radical care may exist
    more in contexts wherein the individual''s needs are subsumed by the larger project
    of activism, as transformative and affirmative collaborations redirect support
    outward. This is not to suggest that activism, or a dismissal of one individual''s
    needs over those of others, is the only form of trans radical care. However, Barbara''s
    narrative about how and why she got involved with DTC underlies a displacement
    of normative support models in defense of engaging productively with change to
    secure a vitality of self. She disregards patrolling narratives of trans locates
    empowerment through working for not only the T (trans), as she notes, but for
    others. While Barbara described the world she does, as an active member of the
    activist community in DC, as a type of radical trans politics, her investment
    in a trickle-up approach to social organizing a departure from mainstream LGBT
    discourses that prioritize assimilation and the individual.


    Radical care, in this context, may actually more accurately refer to forms of
    care that are often assumed to exist across our social spaces. In other words,
    radical care, or the care offered outside, beside, underneath, and perhaps even
    above normative outlets, is perhaps the care that refuses a logic of cruel optimism.
    It is a care that follows desire lines. Barbara''s resiliency, as a subject, was
    not born from support groups, traditional LGBT programming, or even when she was
    referred to as T; instead, the capacity to engage and produce care for others
    is what she experienced for the self.


    Trans vitality is thus not simply a refusal or disav of projects of normalization
    or the commodification of trans rights but, rather, a vigilance toward the violently
    homogenizing expectations of the heterogeneity of lived experience. Trans vitality
    calls on those who produce research or provide services, training, or programming
    on LGBT issues—even specific practices—to be asked and who benefits from that
    work. This is not a means of identifying lapses in benefits but, rather, is one
    of the first many maps to clear labor and out of care, however, unlike the cruel
    optimism promised by resilience or normative modes of care, where a failure to
    thrive is the failure of the object


