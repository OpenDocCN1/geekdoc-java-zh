    inequality (the “nice girls don''t” imperative) while leaving the economic basis
    of women''s exploitation intact.


    Two decades after Sex and the Single Girl, Brown updated her advice: to the advice
    of “marry up” and “as much money as possible,” she added, if you cannot avoid
    childbirth, least avoid child-rearing—by paying someone to take care of them.
    But perhaps most important for our consideration, Brown counseled her readers
    to treat time and energy as a kind of currency to be managed in a mental ledger
    sheet. Brown''s advice to women related to the emerging supply chain of global
    labor while advancing the mentale that accompanied and supported the financialization
    of daily life.21


    Friendship, Brown advises, for “reciprocal trade.” She notes that “everything
    costs something.... You may be a friend who gives selflessly—money and gifts as
    well as counsel and cheer, without wanting a thing in return—but hold on a minute—you
    should want something in return. You held that person''s marker.”22 While one
    is supposed to keep a careful accounting of one''s emotional investments, particularly
    in friendships, one ought to be generous and giving in a professional context:


    Being niggardly and select about what assignments you accept—“but I''m not getting
    paid to do that”—is like being skimpy with how much love you are going to give
