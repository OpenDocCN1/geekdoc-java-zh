    care that one must buy that keeps the onus of care on individuals and often requires
    the sharing of personal data.¹⁵ A person''s life is reduced to metrics, such as
    counted steps, heart rate, hydration status, and oxygen levels. Self-care is thus
    popularly associated with self-optimization, or a way of preparing for increased
    productivity in demanding workplaces when, in reality, things like chronic illness
    are incompatible with capitalist productivity and even visible forms of activity:
    it is difficult to join protest if you are a caretaker, suffer from depression
    or anxiety, or cannot get out bed.¹⁶ Those who fail to practice self-care may
    indeed be labeled "noncompliant" and thus less deserving of care.


