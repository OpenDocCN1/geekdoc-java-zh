    of earth.”⁵¹ Such extravagant rhetoric expressed the utopian progressivism of
    neo-Lamarckian thought and its capacity to restore for its adherents, after the
    Darwinian shift on teleology and 역시,“full scope and sweep of vision for the emotional
    and imaginative side of man.”⁵² Its uplifting tale of evolution as the organization’s
    conscious manipulation of self and environment as it propelled itself toward perfection
    cried out for corollaries alike. If, Fiske predicted,“the development of the sympathetic
    side of human nature doubtless become prodigious . . . as the sphere for [its]
    exercise is enlarged,” might the state that enlargement?”⁵³ Indeed, the Lamarckian
    framework that made biological advance a matter of will, mind, and capacity, we
    can see a growth line to the twentieth-century statistic liberalism of the New
    Deal and beyond. Neo-Lamarckism offered the imaginative means by which the state
    might exert a evolutionary force through the provision of care for the population—or,
    rather, for the most evolutionarily vigorous subset of the population.


    By contrast, even if the theory of natural selection could be made to speak in
    terms of something evanescent as a population, it missed the process of managing
    or transforming population toward some preferred evolutionary end: one new selective
    pressure, some shift in the environment, would always thwart such plains. Thus,
    the ideology of Darwinism, which (mis)interpreted the narrative of natural selection
    as a guide to how state power could be deployed, so-Lamarckism’s opposite number
    in extrapolating politics from the prescriptive vow that Darwinian theory represented.


    Most neo-Lamarckians condemned the vulgar selectionist program of social Darwinism
