    toward Black women and Black female (hyper)sexuality in Barbados and transnationally.
    In doing so, they complicate what it means to be suspicious of the this vaccine
    in a place such as Barbados and amid popular understandings of vaccine hesitancy
    and refusal in the Western world. Eschewing the binaries of structure/d both colonial
    and medical discourse around rationality and irrationality, suspicion impor us
    to look more closely at the enrichment of risk, care, and fear in the postcolonial
    Caribbean and asks social science and humanities researchers and health-practitioners
    recognize and accept the histories, ideologies, and practices that we might well
    comprehend. To follow suspicion and rethink is to embrace the ambivalence of care
    and vaccines, and both the incomprehensible, seemingly impossible not-doing that
    hesitancy might constitute in favor of compassionate recognition, close listening,
    difficult reflection, and cautious pause. And this is radical.


