  md: '# # Beyond Resilience


    # ## Trans Coalitional Activism as Radical Self-Care


    Elijah Bav Adelman


    Studies of queer and trans suffering, resilience, care, and vitalities are invariably
    also investigations into the difficult and painful articulations of lives that
    feel worth living along with deaths that feel okay dying. The notion of resilience,
    referring to a conditional state of overcoming difficult situations, neglects
    to fully encompass our understandings of risk, vulnerability, and life.¹ Specifically,
    in this article I explore the ways in which Washington, DC–based trans activists
    discuss that what render viable life being constituted by shared coalitional labor
    in a contemporary moment that is violently anti-Black, xenophobic, misogynist,
    and distinct. While researchers have noted the beneficial role a coalition serves
    in better representing needs in research² I focus here on how individuals meet
    their needs through solitary and normative resilience strategies but within spaces
    of coalitional action. This approach to radical care encourages us to rethink
    what constitutes life. The necropolitics of trans lives—those that marked as morally
    suspect and intrinsically disposable, representing “the condition for the acceptability
    of putting to death”³—coexists with what I frame as transities, or what makes
    lives living. and radical care, is also an exploration of how the production of
    the “transnormative subject” articulates with notions of resilience as well as
    spatiality and place.³ As I discuss here, the ideologies that underlie the notion
    of resilience value a simple “universal trajectory of out/transition, visibility,
    protection, and self-actualization.” However, lived experience does not follow
    a linear path. The focus on and celebration of the trans lives that might reproduce
    this model of'
