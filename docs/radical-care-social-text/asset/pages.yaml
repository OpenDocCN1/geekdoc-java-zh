    While it is uncertain how the praxis of arrest will develop in the coming years,
    certain constraints are already easily identifiable. Instances of radical care
    that work compensate for the erosion of the welfare-state are not found in the
    public policies addressed to women and children. It is through grassroots efforts
    and collectives, as YoNoFui, that women create a supportive environment where
    they can advocate for their futures. What could be defined with further detail
    and more precision are the specific transactions in the state punishes through
    neglect while labeling this management of social control a humane form of sentencing
    protects the interests of children. The institutional violence against incarcerated
    women, whether in prison or under house arrest, albeit in alternative forms, the
    gender-based violence is prevalent in the Argentine state and much of Latin America
    today. While prison and feminist movements can change the conditions under which
    women live, it is ultimately the public policies in place, such as house arrest
    for women, that can shed light on the material consequences that ideologies of
    gender and motherhood have on women''s lives. Attending to those who push the
    boundaries of such ideologies, the deviant mothers might provide much foresight
    considering alternatives to incarceration, gender roles, and families.


