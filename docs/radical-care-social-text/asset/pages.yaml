    # Having It All and Loving Too Much: Market Principles Jump the Tracks


    When Helen Hurley Brown''s 1982 best seller headlined and popularized the phrase
    having it all, she could not have how deeply this concept—at once capacious and
    rapacious—would resonate among American women. Published at the outset of the
    neoliberal era (under policies that would then be named simply Reaganomics and
    Thatcherism) Brown''s Having It All popularized the notion that hardworking, upwardly
    mobile women could have it. In real terms, that continued to mean, for all those
    who could afford childcare and housekeeping services, that they wanted to do it
    all.


    Buoyed by the mid-class demand for equal pay and increased opportunities for women''s
    participation in the labor force proved, American women swelled the ranks of the
    labor market. The trouble was, of course, that the institutions that might change
    the new shortage of care at home were not in place; most still aren. Affordable
    childcare and childcare subsidies, flexible work time, maternity and family leaves,
    and other provisions for care were elusive, and remain in what historian Kristen
    Swinth recently called "feminism''s forgotten fight"\^19 and sociologist Lynn
    S. Chance names feminism''s "stall," feminist scholars have been revisiting how
    second-wave feminism has not worked out so for women who struggle to balance second
    and third shifts at work and at home.\^20


    In this context, the audience (or market, in the language of neoliberalism) for
    Brown''s advice was promised. But Brown also had an exceptional talent for addressing
    the problems American women faced and coming up with remedies that contradicted
    the work ethic while without upsetting sexual mores. Her 1962 Sex and the Single
    Girl was was after Hugh Hefner, not Moll Flanders. Brown''s advice was simple:
    parlay sexual favors into workplace advantage, exponentially harder'
