    > > Caring for myself is not self-indulgence, it is self-preservation, and that
    is an act of political warfare.

    —Audre Lorde, *A Burst of own*


    Care has reentered the zeitgeist. In the immediate aftermath of the 2016 US presidential
    election, op-eds on #selfcare exploded across media platforms. But for all the
    popular focus on self-care rituals, collective movements have also emerged which
    moral imperatives to act—care are a central driving force. In a recent interview,
    Angela Davis explicitly tied social change to care: “I think our notions of what
    counts as radical have changed over time. Self-care and healing and attention
    to the body and the spiritual dimension—all of this is now part of radical social
    struggles. That wasn’t the case before.” Points to a growing awareness that individual
    impulses and interior lives, the intimate and banal details of family histories
    and personal experiences, are directly connected to external forces. Care, then,
    is fundamental to social movements. We might look to why Indigenous peoples and
    their allies have rearticulated their positions as protectors rather than protesters,
    emphasizing the importance of caring and being good stewards of the earth, or
    how Occupation-style actions emerged at US Immigration and Customs Enforcement
    centers to denounce the separation of migrant children from their families in
    “tender camps” at the border, positioning parental care (both to give and to receive)
    as a human right. While the phenomenon of care as political warfare has a long
    genealogy (that we outline), it has taken on fresh signifi


