  md: 'protection that inhe within Afro-Barbadian parents'' claims to suspicion around
    the HPV vaccine, I then offer a reconsideration of what it means to both care
    and be suspicious of (the care from) this vaccine in a place such as Barbados
    and popular understandings of vaccination refusal in the western world.


    # The HPV Vaccine in Barbados


    With one hundred different strains, HPV is a species-specific DNA virus and the
    most common sexually transmitted disease worldwide. While most HPV infections
    are asymptomatic and clear without treatment, persistent infection with high-risk
    strains of HPV can develop into precancerous lesions, cervical cancer, head and
    neck cancers.¹ The Caribbean is currently among the four highest subregions in
    the world with respect to the incidence of cervical cancer and has the highest
    burden of HPV in the Americas. In Barbados specifically, cervical cancer is the
    second most common female cancer in women fifteen to forty-four years of age,
    and it is estimated that forty-four hundred cervical cases are diagnosed annually
    in a population of less than three hundred thousand persons.


