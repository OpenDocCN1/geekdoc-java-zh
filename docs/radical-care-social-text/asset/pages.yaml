    of a cohesive trans community fails to acknowledge that there is no singular kind
    of trans person.¹¹³ While I continue to utilize the trans here as a gloss for
    a diverse and complex multitude of expressions and identities, I have chosen to
    shift away from the artificial boundedness of the trans community. Instead, I
