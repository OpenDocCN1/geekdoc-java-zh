  md: '# About the cover art


    Alice Nissenbaum recognized for her individual and group portraits that ad롭게 capture
    complexity and intimacy of people''s lives. Inspired by feminist portrait painters
    Alice Neel and Sylvia Sleigh, French painters Edouard Vuillard and Pierre Bonn,
    the Mexican mural Nissenbaum''s painting practice is a political act as well a
    mode of humanity, an ongoing process of getting to know her sitters and vice versa.
    Nissenbaum''s portraits are a way of being engaged and present, for both the artist
    and her subjects, but also for the viewer. Contrary to many of Nissenbaum''s portraits
    in domestic settings, Ximena and Randy (2010) sit in a bar at night. Painted against
    a vibrant background of salsa dancers dancing in color, a man at the center of
    the painting wearing a black-and-white headband is a comforting woman sitting
    by, her arm wrapped around his shoulder. The gaze of the woman seems petite, the
    man seems to be staring into her. While there are clues as to the ethnicity and
    relationship of the pair and intimations we might be witnessing, Ximena and Randy
    could be approached too tumultuous to the incomparability of time and the vulnerability
    of human relationships.


    Based and raised in Mexico, Alice Nissenbaum currently resides and works in New
    York City. Her paintings have been exhibited internationally, including at the
    Minneapolis Institute of Art, Her recent, large-scale public publishing London
    Underground: Brixton Station and Victoria Line Street, part of the Underground,
    was unveiled at the entrance of the Underground station in London. For more information
    about Nissenbaum, see www.antonkgallery.com/artists/alice_nissenbaum.


