    # Mutual Aid


    Mutual aid is a form of political participation in which people take responsibility
    for caring for another and changing political conditions, not just through symbolic
    acts or putting pressure on their representatives in government but by actually
    building new social relations that are more survivable. There is nothing new about
    mutual aid—people have worked together to survive for all of human history. The
    framework of mutual aid is significant in the context of social movements resisting
    colonial domination in which wealth and resources are extracted and concentrated
    and most people can survive only by participating in various extractive relationships.
    Providing for one another through collective care is radical and generative. Effective
    social movements always include elements of mutual aid. The most famous example
    on the left in the United States is the Black Panther Party’s survival programs,
    including the free breakfast program, the free ambulance, free medical clinics,
    a program offering rides to elderly people doing errands, and a school at providing
    a liberating and rigorous curriculum to children. The Black Panthers mobilized
    programs where they could access basic needs and shared analysis about the conditions
    they were facing. J. Edgar Hoover famously wrote in a 1969 memo to all FBI offices
    that "the BCP [Breakfast for Children Program; Black Panther Party] and, as such,
    is potentially the greatest threat to efforts by authorities to neutralize the
    BPP and destroy what it stands for."10 The night before the Chicago program was
    proposed to open, police broke into the church that was supposed to host it and
    undied and destroyed all. The co-optation of the program, with the US Department
    of Agriculture (USDA) starting a free breakfast program that still feeds millions
    of children today, is evidence of the significance of this mutual aid tactic.¹1
