  md: 'Argentina. In Brazil it was Marielle Franco, a Black feminist and socialist
    leader, who was punished by the mandates of the neoliberal state; she was shot
    multiple times and died in March 2018. Berta Cáceres, an environmentalist and
    Indigenous leader in Honduras, was also shot to death in March 2016. These persecutions
    across America bring to light the continuum of institutional and gender-based
    violence that women experience, as well as the historical linkages between settler
    colonialism and the carcelral state. Milagro Sala''s life is endangered. She embodies
    the women, who are overruled and punished harshly for their condition of being
    women, Indigenous, and poor.


    Mothers of all races, classes, and ages are subjected to patriarchal control,
    however differently they may experience this control.51 Poor women of color are
    particularly subjected to invasive forms of control and assaults on their rights
    to motherhood. For example, between 2006 and 2010, 150 incarcerated women were
    unlawfully sterilized.52 Middle-class women face other hurdles: lack of access
    to legitimate planning technologies, such as abortion services, or lack of accommodations
    in their workplace for breastfeeding. Faye D. Ginsburg and Raya Penn “stratified
    reproduction,” originally coined by Shelley Cole, “the power relations by which
    some categories of people are empowered to nurture and reproduce, while others
    are disempowered.”53 This stratified reproduction sheds light on lives which are
    privileged and whose futures are discouraged. Situating motherhood in prisons
    highlights the workings of stratified reproduction and the ways in which institutions
    are complex in this process. Furthermore, it reveals new expressions of neoliberalality
    that not only execute on women''s bodies but also redefine the ways in which the
    state, implementing cost-effective policies, cares for incarcerated women.


    In their study of Argentine prisoners Constanza Tababush and Maria Florence Gentile
    describe how motherhood is a key aspect of many incarcerated women''s emotional
    lives, shaped and constrained by prison regulations as well as cultural expectations.
    Prison cultures themselves are rife with emotions attached to motherhood, posioning
    it as one of the main social objects that regulate a prison''s informal market
    economies. For instance, in women''s prisons, infanticide, the killing of a child,
    is considered to be the worst crime a woman can commit (in men''s prisons, offenders
    are similarly aligned). As such, other women penalize in the form of verbal abuse
    or mistreatment in everyday exchanges. In the context of prison, as in the world
    outside its walls, motherhood distributes specific material and symbolic resources,
    whether in the form of rewards or as negative sanctions.54


    Motherhood is central to the critical inquiry of prisoners, not periph-'
