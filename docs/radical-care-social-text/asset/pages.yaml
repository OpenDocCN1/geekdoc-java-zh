    use on Saturday to straighten the lines if no one ever knew you were there. Just
    don''t be stingy with your “free labor” for bosses and coworkers.23


    Only a few years later, in 1989, another best-selling advice author, Stephen Harvey,
    would present a time management system that incorporates Brown''s idea of an “emotional
    bank account” and extend this to an audience of both women and men.24


    How did Brown arrive at her particular and timely advice to women entering the
    era of neoliberalism? As a woman from an exceptionally impoverished background,
    Brown had to navigate the conflicts between professional and personal life rather
