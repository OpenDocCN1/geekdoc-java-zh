    The problem of (of how adjuncts, who were earning abysmal wages and also embarking
    on parenting, would make a viable living) precipitated a long overdue faculty
    organizing campaign. Friendship, nonbiological sisterhood, social solidarity—the
    interubjectivity that makes one’s class become everyone’s class—precipitated an
    institutional shift. Certainly, other conditions were in place that made this
    mobilization possible, perhaps most important, the already existing organizing
    of the graduate teaching assistants at this institution. But sparked the organizing
    of an adjunct faculty union at major institution was a crisis of.


