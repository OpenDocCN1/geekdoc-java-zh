    # Concluding Remarks


    Institutional confinement extends beyond the prison and has taken various forms,
    as homeless shelters, the asylum, detention centers, and prison camps. As women
    and children move from the institution into home detention, legacies of the penal
    system move into the home as well.\56 However, other types of institutions, such
    as neighborhood and women''s collectives, offer new forms of solidarity that redefine
    imprisonment, family, and care. YoNoFu provides solidarity and acknowledgment
    in their community-led space, allowing for alternative subjectivities to protest.
    More important, the collective contests house arrest as a condition of isolation
    and needs cares for a community that reconfigures the notion of neoliberal governmentality
    as an enterprise in the search for profit. As Veronica Gao has explained, the
    informalization of the economy emerges primarily from the strength of the unemployed
    and of women, who enact from below the potentials in the receding effects of neoliberalism.\57
    Rather than coexisting in isolation, YoNoFu is interested in developing communal
    ties and strengthening collective efforts against institutional violence.


    Still, the violence that characterizes the carceral state has impacts that defy
    the imagination. Mariela was a member of YoNoFu who participated in the textile
    design workshop. She and her two daughters, of whom had a newborn, were under
    house arrest. In 2016, a van from the penitentiary picked them up to take them
    to sign an *abbreviado*, a legal agreement similar to a plea bargain. Mariela
    and her daughters were part of the 50 percent of incarcerated women who are pretrial,
    is detained without a conviction. Women sign *abbreviados*, relinquishing the
    right to go to trial, in the hope of accelerating the process. When the van that
    was taking them to court crashed, Mariela died, and her two daughters, including
    the newborn, were hospitalized. The baby days of Mariela’s body was delayed because
    they had to wait for the judicial order to remove her ankle bracelet. The penitentiary


