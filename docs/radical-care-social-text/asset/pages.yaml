    the problem of care or, more accurately, the lack of thereof—the care deficit—can
    be traced in various fixes and patches.


    There are good reasons examples of capitalism’s care problems arise: these sorts
    of problems are what social theorists call "structural." They are not the sort
    of problems that individuals bring upon themselves, nor do they yield easily to
    identical solutions. Instead, structural problems are linked to the ways we organize
    production and reproduction.^7 Care is simply too expensive when market principles
    are applied to every aspect of daily life. The peculiar (if shortsighted) genius
    of capitalism’s structures and innovations, among wage slavery (binding the individual
    human’s survival and well-being to the commodity form, i.e., rendering human labor
    as a commodity), mass production, automation, and artificial intelligence, simply
    aren''t up to the tasks of providing care.


    Part of the trouble with care is that it requires individual attention, often
