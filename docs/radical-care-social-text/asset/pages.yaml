  md: 'eral, invisible, or an afterthought in a system created for men, because the
    production of knowledge is in itself gendered. Dominant systems of knowledge used
    for the design of prisons and policy making masculine views of the social world
    that leave out the richness and complexities involved in child-reading practices.
    Michelle Rosaldo warned anthropologists that ignoring gender assembly blinds us
    to the sorts of facts we must understand and change and instead proposed that
    what appears as “natural” must be understood as a by-product of “non-necessary
