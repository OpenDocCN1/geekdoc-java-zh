    ways. Women were instructed on specific ways to reprimand their children and on
    specific rules on when to allow children to snack between meals and when to watch
    television in beds with sheets, creating a cave-like area where they could retreat
    with their children..44 The institutional processes of control and domination
    that operate in traditional prisons do not vanish in nurseries. They are reconstituted
    to reflect dominant ideas about gender, race, and class.45 Motherhood in this
    prison was an expression of true intimacy and a sign of potential pathology, a
    model of selflessness and sign of selfishness. It was represented as a symptom
    of these crimes.46 These contradictions draw attention to a need to revisit motherhood
    as an institution that is often naturalized and romanticized but very much punitive.'
