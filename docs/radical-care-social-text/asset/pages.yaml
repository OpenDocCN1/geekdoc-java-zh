    clock and anyone from the provider’s intimate sphere whose care needs are unmet
    or poorly met.¹¹ Without the unwanted or discounted women, the care economy would
    be (and in many cases) has crashing.


    Given the large-scale entry of US women into the paid labor markets that accompanied
    the second wave of feminism in the 1970s, the care crisis has escalated and has
    been cast as a work-life balance problem throughout US and western European societies.
    With the ascendancy of neoliberal market principles over the past decades, the
    care crisis, like the global calamity of climate change, has escalated. Political
    theorist Nancy Fraser observes that capitalism relies on the twin fantasies of
    boundless (traditionally in the form of women’s unpaid labor in the home, though
    more than one part of the globe to another) and limitless natural resources on
