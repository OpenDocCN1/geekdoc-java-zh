  md: 'external validation, especially from people in authority, and often have minimal
    skills for hearing critical feedback, considering it, and acting on what is useful.
    To survive our various social positions, memorize specific instructions about
    when and how to numb our feelings and perceptions, avoid giving feedback, disappear,
    defend, demand appeasement, or appease. As a result we are mostly unprepared to
    engage with conflict and instead tend to avoid until it explodes or relationships
    disappear. Mutual aid organizations work to build shared analysis and practices
    that recognize and address racism, ableism, sexism, classism, and other systems
    of control that produce harm between participants and social interactions, in
    order to be prepared to address conflict. Some provide building activities for
    giving and receiving direct feedback and avoiding gossip. Ensuring that organizations
    have a clear approach to decision making and that participants understand it can
    prevent conflicts that tear apart. Creating transparency, especially about money,
    can prevent destructive conflict. Using transformative justice and mediation frameworks
    for addressing conflict and harm between participants can help address immediate
    crises and build skills for preventing and addressing harm in the future.^41 Work
    to address conflict and harm within organizations and projects, like mutual aid
    work in general, builds infrastructure and capacity for collective self-governance
    and survival.


    # Transition to Collective Care


    The most visible mutual aid work in contemporary movements for justice is happening
    on the front lines of storms, floods, and fires. In these locations, people experience
    failures of dominant infrastructure and the power of helping and sharing with
    one another. These disasters are, of course, anything natural. The profound loss,
    trauma, and violence occurring at their front lines are created by the ways that
    access to survival is always organized to support exploitation and extraction.
    MADR writes:


    Neoliberal capitalism and colonization is daily disaster—the meaningless drudgery
    of the work, the loss of authentic social relationships, the destruction of the
    world, the air, and everything we need to survive. Even though a hurricane or
    a fire is immensely devastating, it also in a sense washes away the unbearable
    disaster that is everyday life under neoliberal capitalism. Without the cohesion
    from above, most disaster survivors default back to meaningful relationships based
    on mutual aid. After the 1906 San Francisco earthquake, Dorothy Day said, "While
    the crisis loved one another." We want to love that. We want to stretch out these
    temporary autonomous zones, where people are able to share goods'
