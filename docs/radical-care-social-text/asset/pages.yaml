    Tracing capitalism''s unfolding care problem—looking at its failed fixes and our
    improvised patches—can offer a space of hope. For those wisely (to borrow from
    Nancy Fraser''s useful description—60)) as capitalism and its systems of fixes
    and patches can be, they also inevitably fail. And in the process, when the fixes
    are revealed as contradictory and our one-off patches no longer adhere, these
    failures can be met by the principled refusals and ingenuity of our communities.
    Challenging the fixes, making the patches, and most important, finding, opening,
    and cultivating spaces for mobilizations is the only sort of self-care that can
    help any of us. Self-care turns radical when it''s turned out.


    # Notes


    More than few thanks are due to the people behind the scenes in this article.
    It would not have occurred to revisit my early research on self-help culture if
    the editors of this issue—Hi''ili Hobart and Tamara Knease—had not sent their
    provocative and timely proposal on radical care to the Social Text editorial collective.
    I owe them for vision, leadership, and patience. To Anna McCarthy, a longtime
    Social Text collective member, and deepest thanks for your comments and encouragement
    to revisit my work on labor and self-improvement culture and in this endeavor.
    To the manuscript''s reviewers, my thanks for the comments and leads that have
    enhanced the work: they were both generous and capacacious. Finally, to Social
    Text''s editor David Sartorius and managing editor Maurice Bach, along with Hi''leli,
    Tamara, and the reviewers, my gratitude for staying with me to craft this article
    while recovering from concussion. My whack on the side of the head was an emergent
    bit of trouble, and they stayed with me. Their generosity, flexibility and accommodations
    all along the way, was a model of radical care. Had I thought of it sooner, perhaps
    I would have written simply without your graciousness as another patch and opening.
    Once you start looking for it, once you have a name for it, the opportunities
    for radical care everywhere.


