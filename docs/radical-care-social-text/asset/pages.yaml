    is cumulative: a process that requires attentiveness and fortitude over innovation.
    Matters also addresses the potential pitfalls of romanticizing both maintenance
    and care, which are often caught up in globalized development and urban renewal
    projects:


    Across the many scales and dimensions of this problem, we are never far from three
    enduring truths: (1) Maintainers require care; (2) caregivers requires maintenance;
    and (3) the distinctions between these practices are shaped by race, gender, class,
    and other political, economic, and cultural forces. Who organizes the maintenance
    of infrastructure, and who executes the work? Who gets cared for, and who does
    that tending and mending?³¹


