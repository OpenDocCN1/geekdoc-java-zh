    # Histories of Radical Care


    Since the time Andre Lorde wrote A Burst of Light (1988), from which we draw our
    epigraph, her words became a mantra, or perhaps a way of reminding ourselves that
    self-care is necessary for collective survival in a world that reminds some lives
    more precarious than others. Within the larger passage where Lorde describes her
    fight against cancer, she they fight against cancer she connects the anonymity
    of cancer to governmental neglect; and she jettisons the individualism of Foucault''s
    self-care in favor of coital survival.21 The fact that this quote is often presented
    without its original context in its popular usage tells us about the difference
    between radical and neoliberal self-care. Radical care is not, as Anna Michai
    explains, the kind of self-care that has been adopted by neoliberal imperatives
    to treat “yourself” but is, a way of understanding “a self which is grounded in
    particular histories and present situations of violence and vulnerability.”22
    A genealogy of radical care is thereby aligned with the emergence of self-care,
    but certainly not contained by it; within this formula, the self is not a generic,
    philosophical but a self engaged in complex sets of relations. Disability studies
    dowel with these arguments when they point to the importance of recognizing selves
    as inherently networked and independent. When Laura Forlan, for example, describes
    the assemblages of human and nonhuman caretaking duties that allow a disabled
    body to function, she states that “in caring for myself, I enlisted into a practice
    of actively participating in, maintaining, repairing and caring for multiple medical
    technologies (rather than using them passively).”23 This section reconciles the
    historiography of care through two trajectories that we see as overlapping; on
    the one hand, feminist self-care, and on the other, Black and brown activist care
    work, of which both have failed to fill the gaps between structural breakdown,
    failure, and neglect.


    The notion of feminist self-care emerged from the need for medical practitioners—particularly
    therapists or other professionals who dealt with trauma patients—to maintain a
    capacity for care for others and for patients to care for themselves. In her ethnography
    of-'
