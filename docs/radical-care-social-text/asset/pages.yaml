    caregivers.


    With this particular case, the court, as an institution, proved to be ill-equipped
    to understand motherhood outside of heterosexual framework. The study of motherhood
    is relevant in two important ways: on the one hand, it exposes assumptions that
    women, and not the individuals who are in charge of child-rearing, and on the
    other hand, it proves that behaviors that challenge institutions, such as same-sex
    marriage, are still deviant, or criminal, despite their legalization.³² Ana had
    been married to a man, not a woman, the assumption that the baby could stay with
    the dad would not have been made, and Ana would most likely have been granted
    house arrest.'
