    # Neoliberal Self-Improvement Fixes:

    Having It All to Not Giving a Fuck


    Academic career coaching and the cottage industry of academic advice books provide
    fine examples of classic self-help solutions: when a system is straining from
    the contradictions of capitalism, a standard quick fix is to hold up individual
    solutions and strategies for problems that are economic and structural. Typically,
    remedies harness the can-do spirit of American bootstrapping individualism with
    tool kits that combine a rhetoric of entrepreneurialism, the routines and regimes
    of time management, and the latest research from psychology.


    Consistent to the technological affordances of one-to-many educational platforms
    (webinars and various video-streaming services) and the availability of horizontal
    many-to-many social networking platforms (Facebook is most prevalent, but there
    are always new, usually short-lived other options, such as mynetwork.com), academic
    career and other advisers seek to engage in economies of scale by delivering their
    advice in the form of a monologue relying on online communities they foster to
    provide additional sources of advice, attention, and going care. Critiques of
