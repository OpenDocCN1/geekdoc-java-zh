    # Looking at Life through Death


    Barbara, a white woman in her early sixties and lifetime local to the Washington,
    DC, metropolitan area, got in trans activism after being told by her therapist
    she needed to find a trans support group. Having visited several regional groups
    and feeling disappointed by what she described as “complaining” by attendees,
    she found the DC Trans Coalition (DCTC), a trans activist group of which I was
    also a member. In an e-mail, she explained to me in greater detail what brought
    her to trans activist work:


    When my therapist told me I was, or finished (done makes it sound like I''m a
    muffin and the timer just went off, time to get out of the oven!) I should seek
    out a support group . . I found out back then, TEGA was for the crossders. Not
    me. MAGIC was a lot of people who were unhappy that their wives didnt understand
    them. Umm, not my, so I went to the [DCTC] town I was. Here were people who were
    actually doing something about making life better for everyone. Sure it''s about
    the T, but benefits also, sort of an ancillary benefit. So I went to my first
    meeting . . My involvement with DCTC has opened doors that I thought were closed
    to me. Because of the encouragement of its members, I''m in college now. I have
    truly awesome people and have grown so much. I can''t imagine my [life] without
    it.


    Barbara was dead several years after getting involved in trans activism and not
    long after she shared this e-mail with me. Barbara was not murdered. She did not
    commit suicide. She did not die as a result of complications related to living
    with HIV. She was not homeless or without a source of income when she died. Her
    funeral, which we did not need to fund, was well attended by surviving members
    of her natal family and of the trans activist communities she was a member of.
    And members of her birth and trans activist family carried her body to her grave.
    In many ways, death just as life, she provided us with an opportunity to engage
    in forms of shared radical care. The kind of Barbara’s activist work, and even
    within the space carved out by her death, constituting “vital but underappreciated
    strategies for enduring precarious worlds,” Hi''iele Julia Kewehiuakakaahaopulani
    Hobart and Kneese describe in their introduction to this special'
