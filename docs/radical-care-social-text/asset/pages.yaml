    Micki McGee


    # Capitalism''s Care Problem


    That capitalism has a care problem is by no means a new observation. Evidence
    abounds, and makeshift solutions are everywhere apparent.¹ Here are just a few.


    At the university library where I have currently sought a quiet place to work,
    it''s finals week. A set of enormous posters promoting a smartphone app that connects
    dependent students to phone counselors frame the elevators on the ground floor,
    where for years the most desiring students would land after leaping from the upper
    levels of the building to their deaths (1). The contravening the wishes of the
    building''s superstruct architecture, has installed decorative barriers to prevent
    the jumping option, but² Therapy is expensive and time-consuming, and often out
    of reach for college students. Campus counseling services are understaffed and
    overcrowded.³ Perhaps for the techno-optimists among (or within) us, algorithmic
    solutions to social problems are a tantalizing fix.


    At another university multilayer battle over health care resulted in amid, many
    cuts to faculty and staff medical benefits, the creation of an entirely new administrative
    position, a wellness coordinator, whose task is to promote faculty and well-being
    so as to decrease the high cost of (stressed faculty and staff who require costly
    pharmacological interventions and one-on-one treatments for their strained hands
    and minds. The person who fills this role, a well-intentioned individual of integrity
    and good cheer, promotes fitness and provides nutritional newsletters. She works
    tirelessly to foster a culture of wellness'
