    # Assessing Trans Needs in Washington, DC


    In this article I draw from two distinct but overlapping research projects: (a)
    a series of roundtables and mapmaking conducted among trans-identifying persons
    in Washington, DC, and (b) the design and implementation of a large scale DC-focused
    trans community needs assessment (DCTNA) survey. Importantly, I make a point here
    to critique the use of metrics to inform our understandings of livable life, I
    include the survey data to highlight the double bind of presenting research on
    trans communities. Specifically, the impetus behind conducting a survey emerged
    from a historical pattern of policy makers, governmental officials, and even gender-
    and sexuality-based organizations viewing first-hand accounts provided by trans
    activists in DC as anecdotal to support legal or structural changes.¹15 In many
    respects the data collected during the community roundtables are both replicated
    and supported in the DCTNA data and analysis. Moreover, following traditional
    academic models, additional studies functions as a validity check, allowing the
    researcher to emphasize the veracity of the findings. However, as I argue, metrics
    overly simplify the enormous complexity of lived experience and, in the absence
    of the overlapping data sets utilized in this article, often stand in for, rather
    than support, first-person accounts.¹16 Thus, my goal here is not to argue for
    entirely replacing quantified data collection, but rather, emphasize the danger
    of overly relying on numbers to measure life. Finally, it is important to note
    that both the community roundtables and mapmaking research project, with the subsequent
    DCTNA, were reviewed and approved by the institutional board at American University
    in Washington, DC, where I completed my doctoral work.¹ While institutional review
    board approval does not inherently translate degrees of safety for participants,
    the kinds of information shared in both of these research projects, including
    providing provisions to reproduce the visual medium of community-centered maps,
    demand a level of care that requires a system of checks and balances. Additionally,
    while I functioned as the principal investigator in title, the research process
    and outcome were guided by a consensus-based coalition of activists involved in
    the DTC, an informal and nonhierarchical group based in DC, as well as other informal
    and formal groups.


