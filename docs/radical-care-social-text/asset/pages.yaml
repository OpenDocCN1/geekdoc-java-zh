    # Radical Care: From Patches to Self-Renewing Forms of Social Solidarity


    Capitalism''s care problem leaves anticapitalists and other social advocates with
    an even more difficult problem: how to develop new forms of care provision that
    refuse racist, patriarchal, capitalist schemes. How do we create new forms of
    relationship, or as Donna Haraway would say, new forms of kinship?⁵⁰ What new
    forms of solidarity and care might be possible? How do we ensure that we do not
    rely on the discounting of labor based on the traditional gendered racial social
    hierarchies, on the fantasies of self-sufficient individuals whose self-making
    work of maximizing capacities and potential will insulate them from a devastating
    lack of community, or the fantasy of an “infinite supply” for those who stay positive?
    Examples of these new types of relationships, these patches to the care problem,
    are emerging continuously.⁵¹


    And imagining these forms of intersection and social solidarity is the larger
    project of this issue of Social Text and the work ahead. This work is guided by
    Haraway’s advice of “staying with the trouble.” It will demand both improvisation
    and ingenuity, and at the same time it promises to be fully engaged, alienated
    care be: exuberant, demanding, exhilarating, and, often, simply fun. If it is
    not all of these things, it will fail.


    I have no secret recipe, five-point plan, or seven habits for this undertaking.
    Chance and improvisation, careful observation and the willingness to act on principle,
    and a sense of community or solidarity can be key to the success of any such undertaking.
