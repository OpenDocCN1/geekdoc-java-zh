    Mutual aid also faces the challenge of neoliberal co-optation. Neoliberalism attacks
    on public infrastructure and public services, endorsing privatization and volunteerism.
    As public services are cut, neoliberal push for social safety nets are replaced
    by family and church, assuming those who fail to belong to such structures deserve
    abandonment. Philanthropy and privatization are expected to replace public welfare,
    and public-private partnerships are celebrated as part of fiction that everything
    should be “run like a business.” The cultural narrative about social entrepreneurship
    suggests that people who change should not fight for justice but should invent
    new ways of managing poor people and social problems. This raises the question,
    How do mutual aid projects remain threatening and oppositional to the status quo
    and cultivate resistance, rather than becoming complementary to abandonment and
    privatization? In the wake of Hurricane Harvey, corporate media stories on volunteer
    boats for rescues followed this pattern, neither criticizing government relief
    failure nor interrogating the causes of worsening hurricanes and whom they endanger.
    Stories of individual heroes obscured the social and political conditions producing
    the crisis.


    This danger of becoming a complementary structure to harmful systems pervades
    debates about restorative justice programs and other alternatives to incarceration.
    These kinds of programs, including drug treatment programs, programs that divert
    some from the criminal system to social service programs, and restorative justice
    programs where people who have done harm go through a mediated process with those
    they have harmed, all have the potential to be disruptive mutual aid programs
    or to nondisruptive adjuncts and/or expansions of central control. Most programs
    emerge from communities impacted by racist systems, but many formalize and transition
    to become funded and shaped by police and courts. Minnesota’s restorative justice
    approach statewide, has become another site where the same populations already
