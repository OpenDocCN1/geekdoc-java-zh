    Consensus decision making, in addition to avoiding the problem of having majorities
    vote down and silence vulnerable groups, establishes an ethic of desiring others''
    participation. Decision-making systems focused on competition—on getting my idea
    to be the one that wins—cultivate disinterested in other people''s participation.
    Consensus decision requires participants to bring forward proposals to be discussed
    and modified until everyone is sufficiently satisfied that no one will block the
    proposal. This means participants get practice wanting them, and not hearing people''s
    concerns and their creative approaches to resolving them, without needing the
    group''s decision to be exactly what one wants. If the goal of our movements is
    to mobilize millions of people, we need to become people who genuinely want others''
    participation, even when others bring different ideas or disagree with us. Most
    people will not stay and commit to intense upwork if they get little say in shaping
    that work. We need ways of practicing one another and participating, not just
    going along with one charismatic or authoritative person. Most people have not
    gotten to practice this, since the institutions that run our lives, like schools,
    governments, are hierarchical. We get a lot of practice going around or trying
    to be the dominant person or person. MADR says, “We all have something to offer.”39
    This is a radical idea in a world where help is professionalized and most people
    are to to home and occasionally make a donation to a nonprofit or volunteer at
    a soup kitchen on Thanksgiving. To argue that in the context of crisis everyone
    has something to offer, that we are all valuable and can include us all, is a
    significant intervention on the disposable most of us against one another and
    the passivity we are encouraged to feel about direct engagement to remark the
    world. MADR adds the slogan, “No Masters, No Flakes.”40 This simultaneous rejection
    of hierarchies inside the organizing and commitment to build accountability based
    on shared values asks participants to keep showing up and working together not
    because a boss is making you but because you are working together on that matters.


    Conflict is part of all groups and relationships, so mutual projects needs for
    addressing conflict. Working and living inside hierarchies desks us for dealing
    with conflict. We are taught to dominate others and be numb to the impact of our
    domination on them, or submit with a smile and be numb to our experiences of domination
    in order to get by. We learn that getting direct feedback is risky and that we
    should express our concerns or find sideways methods to manipulate situations
