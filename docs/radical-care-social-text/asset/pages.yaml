  md: 'While the interventions and critiques of motherhood emerged from groups of
    women belonging to distinct socioeconomic and racial backgrounds in the United
    States, in Argentina Las Madres de Plaza de Mayo were highly influential in symbolizing
    the political terrains of motherhood. Las Madres have historically been regarded
    as beacons of human rights while at the same time referred to as las *locas* which
    not compromise under the terrorism of a dictatorship regime. Their work was not
    meant to eradicate motherhood from women’s lives, but rather, to change the conditions
    under which motherhood was being conceived while holding the state accountable
    for its terrorism.


    # Stratifying Motherhood


    Broad concepts such as motherhood that engage a wide variety of ideologies, experiences,
    and practices the run, if uncontextualized, of rendering issues of power invisible.⁴⁷
    The social context of motherhood can reveal the often unequal relations of power
    between men and women, dominant and subordinate groups, colonizers and colonized.⁴⁸
    To understand the practice of motherhood, it is relevant to understand that “a
    feminist praxis is not limited to gender issues, but sees gender as part and parcel
    of a contingent issues, such as race, sexuality, class, and able- and disabled-bodiedness,
    insisting that these⁴⁹ Indigenous social movements have been pivotal in how colonial
    violence is always entwined with the cartel state, making prisoners unnecessary
    institutions to maintain sovereignty.⁵⁰


    The house arrest of Milagro Sala is an exceptional case that makes evident the
    power relationships between the Argentine state and Indigenous communities. Milagro
    Sala is an Indigenous leader and activist who founded the collective Tupamar in
    the northern province of Jujuy. In 2016 she was detained on the grounds of inciting
    social unrest and has been incarcerated since. In July 2017 she was hospitalized
    after carrying out a hunger strike for being placed in solitary confinement without
    a window. In 2018 she was granted house arrest due to concerns for her declining
    health. Adding to the arbitrariness that characterizes house arrest, police constantly
    surveil the house where Milagro is serving time, and she has a strict schedule
    for visiting hours, two regulations that are not part of the stipulations of house
    arrest. While the decisions of who is approved for house arrest are discretionary
    to each judge, this pattern of harsher punishment for women who deviate from middle-class
    values (homeowners in a heterosexual marriage), as migrant, transgender, and Indigenous
    women. Further, persecution of political leaders that contest neoliberal policies
    are not unique to


