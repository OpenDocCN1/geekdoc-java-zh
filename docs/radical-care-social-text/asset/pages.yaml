  md: '# The Neoliberal Prison


    While recent prison studies have focused on disrupting the prison setting as a
    rigid and impervious site, house arrest as an alternative to incarceration and
    an instance of state care should be interrogated as well.¹16 In 2018, Michelle
    Alexander wrote about house arrest in the United States as “e-ceration.” She warned
    that if the goal is to end incarceration and mass criminalization, digital prisons
    are not an answer. They’re just another of posing the question.¹17 In Argentina,
    house arrest constitutes a state of neglect where women must fend for themselves.
    Rather than offering care, the state abandons incarcerated women by placing them
    in the domestic sphere to perform reproductive labor as a way to complete their
    sentence.


    The prison system is designed to promote individualism and isolation rather than
    strengthen community and familial ties.¹18 Prison nurseries were introduced as
    a benevolent measure to keep mother and child together. However, the institutionalization
    of children provides a new array of challenges. In 2008 and 2013, women in prison
    nurseries in Buenos Aires staged hunger strikes to protest the penitentiary’s
    failure to provide enough food for the children, the presence of rats and insects,
    and the deplorable infrastructure. According to official reports, prison conditions
    for mothers and their children were highly inadequate in terms of diet, clothing,
    medical care, and the physical and emotional development of children. Transitioning
    to life outside of prison is especially traumatic for children who have only experienced
    brief bonds.¹19 House arrest emerged as a more humane alternative to the institutionalization
    of children. Discourses on the rights of children were at the forefront of the
    legislative project to extend house arrest to women. Such discourses, and the
    sanctions for women to mother “appropriately,” follow women throughout their correctional
    experience as a constant threat to lose their children or the benefit of house
    arrest.


    From a historical perspective, the prison has always been considered a masculine
    space and yet particularly women worldwide comprise around 5 percent of the prison
    population. Taking motherhood as a lens to understand punishment and social control
    grounds the masculinist frameworks that penal institutions rely on. Because women
    are a minority in institutions of punishment, women’’s issues have been largely
    ignored, silenced, and poorly addressed.¹20 Motherhood as a category of analysis
    brings to light the contradictions and heternormative expectations that society
    places on women.¹²1 As a social and historical construct, motherhood reveals itself
    as a highly political and contested site of inquiry.'
