  md: '# Deviant Motherhood


    House Arrest and Social Belonging in Argentina


    Leyla Savloff


    Freedom is not a static condition we achieve once and for all. Nor is it something
    absolutely foreclosed to us by male domination. Instead, it is a process of struggle
    we engage in, in part by resignifying the personas of femininity, and the meanings
    given to our “sex,” so to express and represent who we are in singularity, and
    in the complexity of our other basic identifications.


    > —Drucilla Cornell, Beyond Accommodation


    On October 27, 2009, a symposium titled “Arrest Sweet Arrest” was held at the
    Centro Cultural Rojas, a center created in 1984 as part of the Outreach Program
    of the Universidad de Buenos Aires. The cultural center, located in a historically
    diverse neighborhood of Buenos Aires,, was established as a permeable entity between
    community and higher education. At a walking distance from the theater district,
    the neighborhood of Balvanvera is usually the home of artists, brothels, and cumbia
    night clubs. It is filled with cafes and small businesses, covered in murals,
    and traditionally inhabited by Armenian and Jewish communities, as well as Koreans
    and Bolivians. The “Arrest Sweet Arrest” symposium incent a recent policy that
    extends the “benefit” of house arrest to incarcerated women who are pregnant,
    mothers, or the primary caregivers of small children. Before this extension of
    house arrest, incarcerated women who were pregnant or had children under the age
    of four were assigned with their children to special units in the penitentiary,
    referred to as “prison nurseries.”¹ Policy makers, journalists, women under house
    arrest, and neighborhood collectives all gathered to analyze what this new-'
