  md: 'or differently abled) are social needs that are not readily resolved in a system
    that relies on commoditized labor. Economies of scale are notoriously difficult
    to care for work. While capitalism is exceptionally good at producing a soviet
    of things, it has yet to provide a system that reduces the labor time required
    for care.


    Lack of scalability leads to cost problems. Since the cost of goods and services
    is relative, the cost of mass-productive goods drop (due to the aforementioned
    scarcity in mass production), the cost of care, in relative terms, increases.
    Along with this issue of relative value, corporate capitalism’s demand for profit
    renders health care, rehabilitative care, and long-term care unaffordable. The
    recurrent stories of adjunct professors dying in the midst of medical crises for
    care are compounded crises: a broken for-profit health care system intersects
    with higher education’s cost-reduction strategy of relying on the super-discounted
    labor of contingent faculty who live in exhaustion and penury.¹⁰


    Even the informal global supplies that move impoverished women from developing
    areas of the globe (or from populations in the United States) to provide labor
    in the homes of affluent families cannot resolve capitalism’s care problem. Such
    migrant care (which in some respects the chattel slave trade that built US economic
    prominence in the nineteenth century) cannot solve the care problem; it can only
    displace it—who cares for your care provider’s child while they care for? For
