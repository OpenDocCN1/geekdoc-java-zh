  md: 'limitations. Importantly, situating risk, or the overcoming of risk through
    resilience, as active behaviors or passive vulnerability erases our complex intertextual
    subjectivities, as well as the structural and symbolic violence that often results
    in negative health outcomes for trans persons. As such, a framework of radical
    care allows us to explore alternative models of trans vitalities for reconfiguring
    the risk/resilience binary towards employed by both informal social networks and
    harm reduction agencies in Washington, DC. By focusing on how life making in trans
    coalitional spaces may well coexist within spaces heavily marked by death and
    loss, I document how these vitalities articulate within and across social justice
    movements, which ultimately provide models of stability that do not require the
    kind of normality a resilience framework demands. In, I discuss here the personal
    and political transformative power of coalition-based trans social work functions
    as a form of radical care and productive life for many of the participants of
    the projects explored in this text.


    In recent models of resilience have emerged as a trope within academic fields
    and activist social media circles, with calls for self-care and adaptation as
    a measure of resilience. While human and biological resilience is certainly advantageous,
    this article considers implications of resilience as a force that obscures and
    diverts attention away relational and structural forms of violence and how directing
    attention self-determined viabilities and vitalities illuminates how communities
    identify and fill fissures or ruptures in the continuity of oppressive structures,
    pedagogies, places, spaces, and laws. Indeed, resilience is broadly appealing
    that it offers individuals and groups the opportunity to celebrate individuality
    and survival. Yet, resilience is also implicated in the reproduction of one’s
    subjection. Rarely is resiliency prioritized over individualized forms of adaptation
    or care offered through activist work. However, as discussed here, group resilience
    is far more “powerful as a buffer for transgender individuals when they are faced
    with overwhelmingly bleak social and environmental circumstances.” Importantly,
    the fetishization of resilience results in a failure to identify and call for
    an end to systems that produce the very inequities that are expected to overcome.
    In other words, resiliency is an option only for those who are capable of individually
    overcoming systemic inequity and structures of power.


    Trans vitalities, in contrast to concepts like resilience, center an ethics of
    radical care. I argue that trans vitalities function in three distinct ways: (a)
    to disrupt and rethink what valuable, or qualitative quality of life looks like;
    (b) to shift our understandings of community toward coalition; (c) to offer a
    methodological, theoretical, and application-based set of tools that integrates
    a radical trans politics and a community-'
