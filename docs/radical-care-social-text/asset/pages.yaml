    and provided good public relations for police, prosecutors, and courts as protectors
    of women.³³⁶ This history and others highlight the necessity for mutual aid projects
    to cultivate autonomy from elite institutions and government and accountability
    to the most vulnerable by the existing systems. Mutual aid projects also work
    to maintain community control by structuring decision making to avoid concentration
    and hierarchy. Co-option of projects and organizations often happens through co-option
    of individual people, often charismatic leaders or founders of projects who bought
    off elites through increased funding, influence, job security, or other forms
    of status.³³⁷ When one or a small number of people have the power to shift the
    direction of a project, it can be hard to resist the incentives that come with
    co-option. Often, charismatic leaders who are not the most vulnerable inside the
