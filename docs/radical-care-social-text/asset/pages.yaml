    Of course, the problem is much larger and older than ''Trump''. Brazil''s Jair
    Bolsonaro, Rodrigo Duterte in the Philippines, and Israel''s Benjamin Netanyahu
    all reflect the global rise of an authoritarian right wing that threatens vulnerable
    communities. For the purposes of this special issue of Social Text, we define
    radical care as a set of vital but underappreciated strategies for enduring precarious
    worlds. While radical care is even connected to positive political change by providing
    spaces of hope in times, the articles in this collection simultaneously acknowledge
    the negative affects associated with care. Because radical care is inseparable
    from systemic inequality and power structures, it can be used to coerce others
    into new forms of surveillance and unpaid labor, to make up for institutional
    neglect, and even to some groups against others, determining who is worthy of
    care and who is not. Even so, in the face of state-sanctioned violence, economic
    crisis, and impending ecological collapse, collective care offers a way forward.
    In this issue, we look to histories of radical care in the United States and beyond
    in order to better understand how radical care is intervening in social and political
    movements today.


    # More than a Feeling


    Broadly speaking, care refers to a relational set of discourses and practices
    between people, environments, and objects that approximate what philosophers like
    Adam Smith and David Hume identify as "empathy,"sympathy," or "fellow feeling."
    Theorized as an affective connective tissue between an inner self and an outer
    world, care constitutes a feeling with, rather than a feeling for. When mobilized,
    it often span a breath of localities: selves, communities, and social worlds.
    Questions of who or what one might care for, and how can be numerous. Recognizing
    the pervasive use of care as an imperative for any number of social and personal
    concerns, our focus here is on the instances where care is employed against immediate
    crises and precarious futures.


    Our framing of care as a critical survival strategy responds to two emergent strains
    of care discourses that are coincident but vastly different. On the one hand,
    self-care is a solution to the social deficits of late capitalism, evident, for
    example, in the way that remedies for hyperproductivity and the inevitable burnout
    that follows are commodified in the form of specialized diets, therapies, gym-'
