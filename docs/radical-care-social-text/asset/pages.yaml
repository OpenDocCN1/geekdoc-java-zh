    experience in ways that metrics collected from the survey cannot. It should be
    stressed that, while I make use of data here, I do simultaneously critiquing the
    use of big data to measure a livable life. Indeed, were one to analyze the data
    collected in this survey in the absence of roundtable discussions and mapping
    activity, it would seem that, with few exceptions, the trans persons who participated
    in this survey have a dismal quality of life. However, variables such as income
    and HIV status are factors that researchers and academics, as myself, latch onto
    as means of providing evidence that all is not equal. This is a point that cannot
    be emphasized enough: the metrics that are used to define resilience are the metrics
    used defining.'
