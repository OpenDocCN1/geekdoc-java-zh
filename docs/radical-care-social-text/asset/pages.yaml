  md: 'based approach to addressing trans lives. Finally, I position trans vitalities
    as following Lauren Berlant’s “cruel optimism” as an “analytic lever” toward an
    “incitement to inhabit and to track the affective attachment to what we call “the
    good life,” which is for so many bad life that needs the subjects who nonetheless,
    and at the same time, find their conditions of possibility within it.”¹10 Rather,
    in defining the potential transgression of radical care, which negates the dictates
    of the norm (by not simply refusing the norm, but rather negating it, transcendent
    [transcending] it and completing it). It exceeds a limit, but in its excess, verifies
    the limit itself.¹¹¹ In other words, radical care can be defined as radical only
    through explaining how it differs from normal care. In effect, definitions of
    normal care also create the limits for defining radical care. When applied to
    normative expectations of trans life, as articulated by the capacity to seamlessly
    integrate oneself into hetero- and cis-normative life worlds, we see that normality
    is what we create—that than promises relief—suffering. Barbara, like many of those
    discussed in this article, was understood to be resilient only as a result of
    the transformative power of transgressive activist work.


    In focusing on trans vitalities, as well as our understandings of marked and unmarked
    standards of care provide insight into the limits of the concept of trans community.
    There is no single, unilateral form of trans experience that can be meaningfully
    called upon to define all classified within this community without erasing difference.
    Rather, those who may identify with or be placed in the trans community range
    age and reflect vastly disparate, classed, linguistic, sexualized, and educational
    backgrounds. It is through practices of elision that such issues of inequality,
    systemic abuse, and violence become invisible. In I identify community here to
    represent a “symbolic totality as a practical multiplicity.”¹¹² That is, while
    there is no singular trans community, the experiences of the participants explored
    here identify the symbolic totality of the phrase and the participants refer to
    themselves as belonging to a trans community.


