    desire lines structure frameworks of “trans vitalities” as necessary shifts toward
    disrupting normative expectations of care, resilience, and ultimately, which is
    understood to constitute a life worth living.


    # Radical Care as Trans Vitalities


    Multiple studies of trans health discretively or literally mark particular persons
    or bodies as risk or as engaging in high-risk activities. While resilience frameworks
    help identify structural inequalities, particularly among women of color, I consider
    here how we rethink concepts like risk and care. Specifically, rather than approach
    risk as something we do, we can view care as bodies or practices viewed morally
    or ethically suspect. Specifically, I focus here on how risk and resilience are
    constituted and constrained by one’s agency or structural'
