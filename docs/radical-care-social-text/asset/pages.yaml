  md: '# # Suspicion and/as Radical (Care)


    Looking Closer at Vaccine Hesitancy

    in Postcolonial Barbados


    **Nicole Charles**


    This article embraces care’s historically antithetical meanings as it examines
    the caring work of human papillomavirus (HPV) vaccination delivery and suspicion
    toward it in contemporary Barbados. Looking closer at care, the impetus to care,
    and the consequences of refusing that care, it wrestles with the (risks) of not-doing
    and the affective feelings of suspicion that exist Afro-Barbadian parents who
    might refuse the care of the HPV vaccine for their adolescent children amid an
    epidemic of cervical cancer in the developing world. How might the rationale,
    or perceived rationale, behind the care that is both offered and received? What
    can suspicion toward biomedical and technological forms of care teach us about
    histories of risk, biotechnologies, and the imperative to care in the postcolonial
    world? What might it mean to embody protection by means of suspicion toward these
    medotechnical deployments of care and risk? What are the stakes of affective attachments
    that refuse this care? I offer these as framing questions to contextualize the
    following discussion on Afro-Barbadian parents'' suspicion over the HPV vaccine
    in postcolonial Barbados.


    Before exploring parents'' suspicions, this piece begins with a technological
    history of the HPV vaccine and the socioeconomic context in which it was introduced
    in Barbados in 2014. I provide a brief overview of the language of risk and the
    use of statistical risk assessment in the history of care to map how logics and
    the bio-logic of biropower have contentiously coincided with the technology of
    vaccines and the care they expose to provide. Highlighting the manifold politics
    of Black female sexuality, medical idealism, and care,'
  merge: -1
  pgno: 90
