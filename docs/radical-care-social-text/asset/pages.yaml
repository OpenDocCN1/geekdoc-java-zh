    it out of the spiritual eye. Moreover, evolutionary striving did not go unaided:
    the proper understanding of evolution, wrote the philosopher John Fiske, “makes
    human life like more than the chief object of Divine carve.\”2 More important,
    neo-Lamarckian tales of bootstrapping and divinely elected species functioned
    as powerful props to white supremacy, ranking races based on their evident record
