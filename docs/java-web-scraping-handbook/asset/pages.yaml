  md: '# Web fundamentals


    In the dev tools, you can right click on any DOM node, and show its full Xpath
    expression, that you can later factorize. There is a lot that we could discuss
    about XPath, but it is out of this book''s scope, I suggest you to read this great
    W3School tutorial^11 if you want to learn more.


    In the next chapter we will see how to use XPath expression inside our Java scraper
    to select HTML nodes containing the data we want to extract.


    # Regular Expression


    A regular expression (RE, or Regex) is a search pattern for strings. With regex,
    you can search for a particular character/word inside a bigger body of text. For
    example you could identify all phone numbers inside a web page. You can also replace
    items, for example you could replace uppercase tag in poorly formatted HTML by
    lowercase ones. You can also validate some inputs ...


    The pattern used by the regex is applied from left to right. Each source character
    is only used once. For example, this regex :oco will match the string ococo only
    once, because there is only one distinct sub-string that matches.


    Here are some common matching symbols, quantifiers and meta-characters :


    | Regex | Description |

    | --- | --- |

    | Hello World | Matches exactly "Hello World" Matches any character |

    | [] Matches any character Matches a range of character within the brackets, for
    example [a-h] matches any character between a and h. [1-5] matches any digit between
    1 and 5 Negation of the pattern, matches any character except x or y or z |

    | [^xyz | Matches zero or more of the preceding item |

    | + | Matches one or more of the preceding item |


    > ^11https://www.w3schools.com/xml/xpath_intro.asp'
  merge: -1
