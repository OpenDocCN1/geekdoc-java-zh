  md: '# Dealing with Javascript


    It can be challenging to scrape the SPAs because there are often lots of Ajax
    calls and websockets³ connections involved. If performance is an issue, you should
    always try to reproduce the Javascript code, meaning manually inspecting all the
    network calls with your browser inspector, and replicating the AJAX calls containing
    interesting data.


    So depending on what you want to do, there are several ways to scrape these websites.
    For example, if you need to take a screenshot, you will need a real browser, capable
    of interpreting and executing all the Javascript code, that is what the next part
    is about.


    # Headless Chrome


    We are going to introduce a new feature from Chrome, the headless mode. There
    was a rumor going around, that Google used a special version of Chrome for their
    crawling needs. I don''t know if this is true, but Google launched the headless
    mode for Chrome 59 several months ago.


    PhantomJS was the leader in this space, and was (and still is) heavy used for
    browser automation and testing. After hearing the news about Headless Chrome,
    the PhantomJS maintainer said that he was stepping down as maintainer, because
    I quote "Chrome is faster and more stable than PhantomJS[...]" looks like Chrome
    headless is becoming the way to go when it comes to browser automation and dealing
    with Javascript-heavy websites.


    HtmlUnit, PhantomJS, and the other headless browsers are very useful tools, the
    problem is they are not as stable as Chrome, and sometimes you will encounter
    Javascript errors that would not have happened with Chrome.


    # Prerequisites


    +   * Google Chrome > 59


    > ³²https://en.wikipedia.org/wiki/WebSocket'
