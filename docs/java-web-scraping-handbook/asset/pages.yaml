    | * | Matches any node |

    | //@ | Matches any attribute node |


    You can also use predicates to find a node that contains a specific value. Predicate
    are always in square brackets: [predicate] Here are some examples :


    | | Expression | Description |

    | //li[last()] | Selects the last li element |

    | //div[@class=''product''] | Selects all div elements that have the class attribute
    with the product value. |

    | //li[3] | Selects the third li element (the index starts at 1) |

    | //div[@class=''product''] | Selects all div elements that have the class attribute
    with the product value. |


    Now we will see some example of XPath expressions. We can test XPath expressions
    inside Chrome Dev tools, so it is time to fire up Chrome. To do so, right click
    on the web page -> inspect and then cmd + f on a Mac or ctrl + f on other systems,
    you can enter an XPath expression, and the match will be highlighted in the Dev
    tool.'
