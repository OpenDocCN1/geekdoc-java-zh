  md: '# Dealing with Javascript


    The other problem with the traditional server-side rendering is that it can be
    inefficient. Let''s say you are browsing a table on an old website. When you request
    the next page, the server is going to render the entire HTML page, with all the
    assets and send it back to your browser. With an SPA, only one HTTP request would
    have been made, the server would have sent back a JSON containing the data, and
    the Javascript framework would have filled the HTML model it already has with
    the new values!


    Here is a diagram to understand how it works :


    ![](img/cbd5c820756a64b88207a1ea9f1c877b_63_0.png)


    In theory, SPAs are faster, better scalability and lots of other benefits compared
    to server-side rendering.


    That''s why Javascript frameworks were created. There are lots of different Javascript
    frameworks :


    +   * AngularJS28 made by Google

    * EmberJS29 by Yehuda Katz (ex Jquery team)

    * ReactJS30 by Facebook

    * VueJS31 by Evan You (ex AngularJS team)


    These frameworks are often used to create so-called "Single Page Applications".
    There are lots of differences between these, but it is out of this book scope
    to dive into it.


    > 28https://angularjs.org/

    29https://www.emberjs.com/

    30https://reactjs.org/

    31https://vuejs.org/'
