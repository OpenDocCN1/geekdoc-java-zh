    # Web extraction process


    In order to go to a URL in your code, fetch the HTML code and parse it to extract
    the date we can use different things :


    +   - Headless browser

    - Do something "manually" : Use an HTTP library to perform the GET request, then
    use a library like Jsoup7 to parse the HTML and extract the data you want


    Each option has its pros and cons. A headless browser is like a normal browser,
    without the Graphical User Interface. It is often used for QA reasons, to perform
    automated testing on websites. There are lots of different headless browsers,
    like Headless Chrome8, PhantomJS9, HtmlUnit10, we will see this


