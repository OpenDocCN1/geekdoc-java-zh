    First let''s look at some Xpath vocabulary :


    +   - In Xpath terminology, as with HTML, there are different types of nodes:
    root nodes, element nodes, attribute nodes, and so called atomic values which
    is a synonym for text nodes in an HTML document.

    - Each element node have one parent. in this example, the section element is the
    parent of p, details and button.

    - Element nodes can have any number of children. In our example, li elements are
    all children of the ul element.

    - Siblings are nodes that have the same parents. p, details and button siblings.

    - Ancestors a node''s parent and parent''s parent...

    - Descendants a node''s children and children''s children...


    # Xpath Syntax


    There are different types of expressions to select a node in an HTML document,
    here are the most important ones


    | Ebay Expression | Description |

    |---|---|

    | nodename | This is the simplest one, it select all nodes with this nodename
    |

    | / | Selects from the root node (useful for writing absolute path) |

    | // | Selects nodes from the current node that matches |

    | . | Selects the current node |

    | .. | Selects the current node''s parent |'
