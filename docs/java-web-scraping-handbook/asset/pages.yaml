    # Tips


    # Cookies


    Cookies are used for lots of reasons, as discussed earlier. If you find that the
    target website is responding differently with your bots, try to analyze the cookies
    that are set by client-side Javascript code and inject them manually. You could
    also use Chrome with the headless mode for better cookie handling.


    # Timing


    If you want to hide your scrapers, you have to behave like a human. Humans don’t
    click on links 0.2 seconds after arriving to a web page. They don’t click on each
    link every 5 seconds too. Add some random time between your requests to hide your
    scrapers.


    Fast scraping is not a good practice. You will get blocked, and if you do this
    on small websites it will put a lot of pressure on the website’s servers, it can
    even be illegal in some cases, as it can be considered like an attack.


    # Invisible elements


    Invisible elements is a technique often used to detect bot accessing and crawling
    a website. Generally, one or more elements are hidden with CSS and there is some
    code that notifies the website’s server if there is a click on'
