  md: '# Web fundamentals


    # Http request


    ```

    GET /how-to-log-in-to-almost-any-websites/ HTTP/1.1

    Host: ksah.in

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/web\

    /*;q=0.8

    Accept-Encoding: gzip, deflate, sdch, br

    Connection: keep-alive

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_11_6) AppleWebKit/

    /537.36 (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36

    ```


    In the first line of this request, you can see the GET verb or method being used,
    meaning we request data from the specific path: /how-to-log-in-to-almost-any-websites/
    There are other HTTP verbs, you can see the full list here. Then you can see the
    version of the HTTP protocol, in this book we will focus on HTTP 1. Note that
    as of Q4 2017, only 20% of the top 10 million websites supports HTTP/2. And finally,
    it is a key-value list called headers Here is the most important header fields
    :


    +   - Host The domain of the server, if no port number is given, is assumed to
    be 80.

    - User-Agent Contains information about the client originating the request, including
    the OS information. In this case, it is my web-browser (Chrome), or OSX. This
    header is important because it is used for statistics (How many users visit my
    website on Mobile or Desktop) to prevent any violations by bots. Because these
    headers are sent by the clients, it can be modified (it is called “Header Spoofing”),
    and is exactly what we do with our scrapers, to make our scrapers look like a
    normal web browser.

    - Accept The content types that are acceptable as a response. There are lots of
    different content types and sub-types: text/plain, text/html, image/jpeg, application/json
    ...


    > https://www.w3schools.com/tags/ref_httpmethods.asp'
