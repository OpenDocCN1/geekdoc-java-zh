    This is it. Instead of returning the JSON array, we could store it in the different
    database systems supported by Azure.


    I suggest you experiment, especially around messaging queues. An interesting architecture
    for your scraping project could be to send jobs into a message queue, let Azure
    function consume these jobs, and save the results into a database. You can read
    more about this subject here59


    The possibilities of Azure and other Cloud providers like Amazon Web Service are
    endless and easy to implement, especially serverless architecture, and I really
    recommend you to experiment with these tools.


