    # Xpaths


    XPath is a technology that uses path expressions to select nodes or nodesets in
    an XML document (or HTML document). As with the Document Object Model, XPath is
    a W3C standard since 1999. Even if XPath is not a programming language in itself,
    it allows you to write expression that can access directly to a specific node,
    or a specific node set, without having to go through the entire HTML tree (or
    XML tree).


    Entire books has been written on XPath, and as I said before I don''t have the
    pretension to explain everything in depth, this is an introduction to XPath and
    we will see through real examples how you can use it for your web scraping needs.


    We will use the following HTML document for the examples below:'
