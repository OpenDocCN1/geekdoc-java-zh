    \ for each HTTP\nrequests, but only for suspicious ones, or for specific actions\
    \ like account\ncreation, etc. You should always try to figure out if the website\
    \ is showing you\na captcha / Recaptcha because you made too many requests with\
    \ the same IP\naddress or the same user-agent, or maybe you made too many requests\
    \ per\nsecond.\n\nAs you can see, “Recaptcha solving” is really slow, the best\
    \ way to “solve\"\nthis problem is by avoiding captchas in the first place !"
