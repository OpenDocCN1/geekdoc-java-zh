  md: '# Web fundamentals


    The internet is **really complex** : there are many underlying technologies and
    concepts involved to view a simple web page in your browser. I don''t have the
    pretention to explain everything, but I will show you the most important things
    you have to understand to extract data from the web.


    # HyperText Transfer Protocol


    From Wikipedia :


    The Hypertext Transfer Protocol (HTTP) is an application protocol for distributed,
    collaborative, and hypermedia information systems.\[1] HTTP is the foundation
    of data communication for the World Wide Web. Hypertext is structured text that
    uses logical links (hyperlinks) between nodes containing text. HTTP is the protocol
    to exchange or transfer hypertext.


    So basically, as in many network protocols, HTTP uses a **client/server** model,
    where an HTTP client (A browser, your Java program, curl, wget...) opens a connection
    and sends a **message** (“I want to see that page : /product")to an HTTP server
    (Nginx, Apache...). Then the server answers with a **response** (The HTML code
    for example) and closes the connection. HTTP is called a **stateless** protocol,
    because each transaction (request/response) is independent. FTP for example, is
    **stateful**.


    # Structure of HTTP request


    When you type a website address in your browser, it sends and HTTP request like
    this one :'
