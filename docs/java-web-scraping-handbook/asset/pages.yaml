    # HTML and the Document Object Model


    I am going to assume you already know HTML, so this is just a small reminder.


    +   • HyperText Markup Language (HTML) is used to add “meaning” to raw content.

    • Cascading Style Sheet (CSS) is used to format this marked up content.

    • Javascript makes this thing interactive.


    As you already know, a web page is a document containing text within tags, that
    add meaning to the document by describing elements like titles, paragraphs, lists,
    links etc. Let’s see a basic HTML page, to understand the Document Object Model
    is.'
