    user-agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_13_5) AppleWebKit/537.36
    (KHTML, like Gecko) Safari/537.36


    If you don''t send these headers in your request, the target server can easily
    recognize your request is not sent from a regular web browser. If the server has
    some kind of anti-bot mechanism, different things can happen: * The HTTP response
    can change * Your IP address could be blocked * Captcha * Rate limit on your requests


    # HttpClient provides a simple way to customize your HTTP client''s headers


    InitClient with request headers


    ```

    HttpClient = new HttpClient();

    client.addRequestHeader("Accept", "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,image/apng,*;q=0.8");

    client.addRequestHeader("Accept-Encoding", "gzip, deflate, br");

    client.addRequestHeader("Accept-Language", "en-US,q=0.9,fr-FR;q=0.8,fr;q=0.7,la;q=0.6");

    client.addRequestHeader("Connection", "keep-alive");

    client.addRequestHeader("Host", "ksah.in");

    client.addRequestHeader("User-Agent", "Mozilla/5.0 (Macintosh; Intel Mac OS X
    10_13_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/67.0.3396/99 Safari/537.36");

    client.addRequestHeader("Pragma", "no-cache");

    ```


    We could go further, and assign a random User-Agent to our HttpClient. Randomizing
    user-agents will help to hide your bot. A good solution is to create a list of
    common User-Agents and pick a one.'
