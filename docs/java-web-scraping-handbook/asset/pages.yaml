    # # Scrolling to the bottom


    The first way of scraping this page is to have our headless browser scroll to
    the bottom of the page. There is a nice method that we can use on the Window object,
    called ScrollTo. It is really simple to use, you give it an X and Y coordinate,
    and it will scroll


    In order to execute this Javascript code, we are going to use a Javascript executor.
    It allows us to execute any Javascript code in the context of the current web
    page (or more specifically, the current tab). We have access to every Javascript
    function and variables defined in the context.


    In this example, the webpage we are scraping has a fixed 20 rows in the first
    load. So if our browser is too big, we won''t be able to scroll. This "mistake"
    was made on purpose. To do that, we must use our Chrome instance to operate with
    a small window size !


