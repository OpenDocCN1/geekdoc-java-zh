  md: '# Web fundamentals


    | Regex | Description |

    | --- | --- |

    | ? | Matches zero or one of the preceding item |

    | [x] | Matches exactly x of the preceding item |

    | \d | Matches any digit |

    | D | Matches any non digit |

    | \s | Matches any whitespace character |

    | S | Matches any non-whitespace character |

    | (expression) | Capture the group matched inside the parenthesis |


    You may be wondering why it is important to know about regular expressions when
    doing web scraping? We saw before that we could select HTML nodes with the DOM
    API, and Xpath, so why we would need regular expressions? In an ideal semantic
    world¹², data is easily machine readable, the information is embedded inside relevant
    HTML element, with meaningful attributes.


    But the real world is messy, you will often find huge amounts of text inside a
    p element. When you want to extract a specific data inside this huge text, for
    example a price, a date, a name... you will have to use regular expressions.


    For example, regular expression can be useful when you have this kind of data
    :


    ```

    <p>Price : 19.99$</p>

    ```


    We could select this node with an Xpath expression, and then use this kind of
    regex to extract the price :


    ```

    ^Price\s:\(\d+\.\d{2})\$

    ```


    This was a short introduction to the wonderful world of regular expressions, you
    should now be able to understand this :


    > ¹²https://en.wikipedia.org/wiki/Semantic_Web'
