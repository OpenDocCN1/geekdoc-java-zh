  md: "# Captcha solving, PDF parsing, and OCR\n\n+   * Clicking behavior analysis:\
    \ where did the user click ? Cursor acceleration\netc.\n* Browser fingerprinting\n\
    * Click location (do you always click straight on the center, or is it random,\
    \ like a normal user)\n* Browser history and cookies\n\nOld captchas like the\
    \ first one, Optical Caracter Recognition and recent machine-learning frameworks\
    \ offer an excellent solving accuracy (sometimes better than Humans...) but for\
    \ Recaptcha v2 the easiest and more accurate way is to use third-party services.\n\
    \nMany companies are offering Captcha Solving API that use real human operators\
    \ to solve captchas, I don't recommend one in particular, but I have found 2captcha.com^43\
    \ easy to use, reliable and cheap (it is $2.99 for 1000 captchas).\n\nUnder the\
    \ hood, 2captcha and other similar APIs need the specific site-key and the target\
    \ website URL, with this information they are able to get a human operator to\
    \ solve the captcha.\n\n```\n<div class=\"field\">&gt;</div>\n<div class=\"field\"\
    > \n<label for=\"recaptcha\">&gt;</label>\n<script src=\"https://www.google.com/recaptcha/api.js\"\
    &gt;</script>\n<div class=\"g-recaptcha\" data-sitekey=\"6L6degfBUAAAAAAjNA5rk2ZitaXzd0m0ajluYZnXX\"\
    \ -->\n  <div style=\"width:380px; height:78px;\"&gt;\n    <div>\n<iframe src=\"\
    https://www.google.com/recaptcha/api2/anchor7ar?k=6L6degfBUAAAAAAjNA5W5nc2FuZi\"\
    &gt; role=\"78\" frameborder=\"0\" scrolling=\"no\" sandbox=\"allow-forms allow-popups\
    \ all\" frameid=\"1\"&gt;</iframe>\n    </div>\n  </div>\n</div>\n```\n\nTechnically\
    \ the Recaptcha challenge is an iframe with some magical Javascript code and some\
