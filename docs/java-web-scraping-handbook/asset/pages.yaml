  md: '# Introduction to Web scraping


    Web scraping or crawling is the act of fetching data from a third party website
    by downloading and parsing the HTML code to extract the data. It can be done manually,
    but generally this term refers to the automated process of downloading the HTML
    content of a page, parsing/extracting the data, and saving it into a database
    for further analysis or use.


    # Web Scraping VS APIs


    When a website wants to expose data/features to the developper community, they
    will generally build an API(Application Programming Interface¹). The API consists
    of a set of HTTP requests, and generally responds with JSON or XML format. For
    example, let''s say you want to know the real time price of the Ethereum cryptocurrency
    in your code. There is no need to scrape a website to fetch this information since
    there are lots of APIs that can give you a well formatted data :


    ```

    curl https://api.coinmarketcap.com/v1/ticker/ethereum/?convert=EUR

    ```


    and the response :


    > ¹https://en.wikipedia.org/wiki/Application_programming_interface'
