  md: '# Cloud scraping


    # Serverless


    In this chapter, we are going to introduce serverless deployment for our bots.
    Serverless is a term referring to the execution of code inside ephemeral containers
    (Function As A Service, or FaaS). It is a hot topic in 2018, after the “micro-service”
    hype, here come the “nano-services”!


    Cloud functions can be triggered by different things as:


    +   - An HTTP call to a REST API

    - A job in message queue

    - A log

    - IOT event


    Cloud functions are a really good fit for web scraping for many reasons. Web Scraping
    is I/O bound, most of the time is spent waiting for HTTP responses, so we don’t
    need high end CPU servers. Cloud functions are cheap and easy to setup. Cloud
    function are a good fit for parallel computing, we can create hundreds or thousands
    of function at the same time for large scale scraping.'
