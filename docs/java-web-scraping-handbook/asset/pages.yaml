  md: 'Cloud scraping


    You can then test and run the generated code:


    ```

    mvn clean package

    mvn azure-functions:run

    ```


    There might be some errors if you didn’t correctly install the previous requirements.

    Deploying your Azure Function is as easy as:


    ```

    mvn azure-functions:deploy

    ```


    Azure will create a new URL for your function each time you deploy your app.

    The first invocation will be very slow, it can sometimes take up to one minute.
    This “issue” is called cold start. The first time you invoke a function, or when
    you have’t called a function for a “long” time (i.e several minutes), Azure has
    to:


    +   - spin a server

    - configure it

    - load your function code and all the dependencies


    and then it can run your code.

    When the app is warm, it has just to run your code, and it will be much much faster.
    If the cold start is an issue for you, you can use the dedicated mode.

    More information about this subject can be found here58.

    You can see your function and the logs in your Azure Dashboard:


    > 58https://blogs.msdn.microsoft.com/appservicerviceam/2018/02/07/understanding-serverless-cold-start/'
