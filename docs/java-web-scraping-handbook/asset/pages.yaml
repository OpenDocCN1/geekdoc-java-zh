    The first thing we need is to create a Web object. Then we need to set the URL,
    the HTTP method, headers, and parameters. Adding request header to a WebRequest
    object is quite simple, all you need to do is call the setAdditionalHeader method.
    Adding parameters to your request must be done with the setParametersmethod, which
    takes a list of NameValuePair. As discussed earlier, we need to add the csrf_token
