- md: "\n# Introduction to Web scraping\n\nWeb scraping or crawling is the act of\
    \ fetching data from a third party website by downloading and parsing the HTML\
    \ code to extract the data. It can be done manually, but generally this term refers\
    \ to the automated process of downloading the HTML content of a page, parsing/extracting\
    \ the data, and saving it into a database for further analysis or use.\n\n# Web\
    \ Scraping VS APIs\n\nWhen a website wants to expose data/features to the developer\
    \ community, they will generally build an API(Application Programming Interface¹).\
    \ The API consists of a set of HTTP requests, and generally responds with JSON\
    \ or XML format. For example, let's say you want to know the real time price of\
    \ the Ethereum cryptocurrency in your code. There is no need to scrape a website\
    \ to fetch this information since there are lots of APIs that can give you a well\
    \ formatted data :\n\n```\ncurl https://api.coinmarketcap.com/v1/ticker/ethereum/?convert=EUR\n\
    ```\n\nand the response :\n\n> ¹https://en.wikipedia.org/wiki/Application_programming_interface\n\
    \n# Coinmarketcap JSON response\n\n```\n{\n  id: \"ethereum\",\n  name: \"Ethereum\"\
    ,\n  symbol: \"ETH\",\n  rank: \"2\",\n  price_usd: \"414.447\",\n  price_btc:\
    \ \"0.0507206\",\n  24h_volume_usd: \"1679960000.0\",\n  market_cap_usd: \"39748509988.0\"\
    ,\n  available_supply: \"95907342.0\",\n  total_supply: \"95907342.0\",\n  max_supply:\
    \ null,\n  percent_change_1h: \"0.64\",\n  percent_change_24h: \"13.38\",\n  percent_change_7d:\
    \ \"25.56\",\n  last_updated: \"1511456952\",\n  price_eur: \"349.84756557\",\n\
    \  24h_volume_eur: \"1418106314.76\",\n  market_cap_eur: \"33552949485.0\"\n}\n\
    ```\n\nWe could also imagine that an E-commerce website has an API that lists\
    \ every product through this endpoint:\n\n```\ncurl https://api.e-commerce.com/products\n\
    ```\n\nIt could also expose a product detail (with “123” as id) through :\n\n\
    ```\ncurl https://api.e-commerce.com/products/123\n```\n\nSince not every website\
    \ offers a clean API, or an API at all, web scraping can be the only solution\
    \ when it comes to extracting website information.\n\n# Introduction to Web scraping\n\
    \n> [!INFO](image_url)\nAPIs are generally easier to use, the problem is that\
    \ lots of websites don't offer any API. Building an API can be a huge cost for\
    \ companies, you have to ship it, test it, handle versioning, create the documentation,\
    \ there are infrastructure costs, engineering costs etc. The second issue with\
    \ APIs is that sometimes there are rate limits (you are only allowed to call a\
    \ certain endpoint X times per day/hour), and the third issue is that the data\
    \ can be incomplete.\n\n# Web scraping use cases\n\nAlmost everything can be extracted\
    \ from HTML, the only information that is “difficult” to extract is inside images\
    \ or other media. Here are some industries where web scraping is being used :\n\
    \n- News portals : to aggregate articles from different datasources : Reddit /\
    \ Forums / Twitter / specific news websites\n- Real Estate Agencies.\n- Search\
    \ Engine\n- The travel industry (flight/hotels prices comparators)\n- E-commerce,\
    \ to monitor competitor prices\n- Banks : bank account aggregation (like Mint\
    \ and other similar apps)\n- Journalism : also called “Data-journalism”\n- SEO\n\
    - Data analysis\n- “Data-driven” online marketing\n- Market research\n- Lead generation\
    \ ...\n\n# Introduction to Web scraping\n\nAs you can see, there are many use\
    \ cases to web scraping.\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_7_0.png)\n\
    \nMint.com is a personal finance management service, it allows you to track accounts\
    \ you have in a centralized way, and many different things. Mint.com uses web\
    \ scraping to perform account aggregation for its clients. It’s a classic problem,\
    \ some banks have an API for this, others do not. So when an API is not available,\
    \ Mint.com is still able to extract account operations. A client provides his\
    \ credentials (user ID and password), and Mint uses web scraping to do several\
    \ things :\n\n- Go to banking website\n- Fill login form with the credentials\n\
    - Go to account overview\n- For each account, extract all operations and save\
    \ it to Mint backend.\n- Logout\n\nWith this process, Mint is able to support\
    \ any bank, regardless of the existence of an API, and no matter what technology\
    \ bank uses. That’s a good example of how useful and powerful web scraping is.\
    \ The drawback of course, is that each time a bank changes its website (even a\
    \ simple change in the HTML), the robots will have to change as well.\n\n![](img/cbd5c820756a64b88207a1ea9f1c87b_8_0.png)\n\
    \n# Parsely Dashboard\n\nParsely analytics for publishers. Its platform crawls\
    \ the entire website to extract all posts (text, metrics) and perform Natural\
    \ Language Processing to allow publishers to understand what the audience likes\
    \ or dislikes.\n\n![](img/cbd5c820756a64b88207a1ea9f1c87b_9_0.png)\n\n# Jobijoba\
    \ search engine\n\nJobijoba.com is a French/European startup running that aggregates\
    \ listing from multiple search engines like Monster, CareerBuilder. The value\
    \ proposition here is clear, there are hundreds if not thousands of platforms,\
    \ applicants need to create profiles on these websites for their search and Jobijoba\
    \ provides an easy way to visualize everything in one place. This aggregation\
    \ problem is common to lots of other industries, as we saw before, Real Estate,\
    \ Travel, News, Data analysis...\n\n# What will you learn in this book\n\nIn 2017,\
    \ web scraping is becoming more and more important to deal with the huge amount\
    \ of data the web has to offer. In this book you will learn how to\n\n- collect\
    \ data with web scraping\n- inspect websites with Chrome dev tools\n- parse HTML\
    \ and store the data\n- handle javascript heavy websites\n- find hidden APIs\n\
    - how to avoid the classic traps and anti-scraping techniques\n\nLearning web\
    \ scraping can be challenging, this is why I aim at explaining just enough theory\
    \ to understand the concepts, and immediately apply this theory with practical\
    \ and down-to-earth examples. We will focus on Java, but all the techniques we\
    \ will see can be implemented in many other languages, like Python, Javascript,\
    \ or Go.\n\n# Web fundamentals\n\nThe internet is **really complex**: there are\
    \ many underlying technologies and concepts involved to view a simple web page\
    \ in your browser. I don't have the intention to explain everything, but I will\
    \ show you the most important things you have to understand to extract data from\
    \ the web.\n\n# HyperText Transfer Protocol\n\nFrom Wikipedia :\n\nThe Hypertext\
    \ Transfer Protocol (HTTP) is an application protocol for distributed, collaborative,\
    \ and hypermedia information systems.[1] HTTP is the foundation of data communication\
    \ for the World Wide Web. Hypertext is structured text that uses logical links\
    \ (hyperlinks) between nodes containing text. HTTP is the protocol to exchange\
    \ or transfer hypertext.\n\nSo basically, as in many network protocols, HTTP uses\
    \ a **client/server** model, where an HTTP client (A browser, your Java program,\
    \ curl, wget...) opens a connection and sends a **message** (“I want to see that\
    \ page /product”) to an HTTP server (Nginx, Apache...). Then the server answers\
    \ with a **response** (The HTML code for example) and closes the connection. HTTP\
    \ is called a **stateless** protocol, because each transaction (request/response)\
    \ is independent. FTP for example, is **stateful**.\n\n# Structure of HTTP request\n\
    \nWhen you type a website address in your browser, it sends and HTTP request like\
    \ this one :\n\n# Http request\n\n```\nGET /how-to-log-in-to-almost-any-websites/\
    \ HTTP/1.1\nHost: ksah.in\nAccept: text/html,application/xhtml+xml,application/xml;q=0.9,image/web/*;q=0.8\n\
    Accept-Encoding: gzip, deflate, sdch, br\nConnection: keep-alive\nUser-Agent:\
    \ Mozilla/5.0 (Macintosh; Intel Mac OS X 10_11_6) AppleWebKit/537.36 (KHTML, like\
    \ Gecko) Chrome/56.0.2924.87 Safari/537.36\n```\n\nIn the first line of this request,\
    \ you can see the GET verb or method being used, meaning we request data from\
    \ the specific path: /how-to-log-in-to-almost-any-websites/. There are other HTTP\
    \ verbs, you can see the full list here. Then you can see the version of the HTTP\
    \ protocol, in this book we will focus on HTTP 1. Note that as of Q4 2017, only\
    \ 20% of the top 10 million websites supports HTTP/2. And finally, it is a key-value\
    \ list called headers Here is the most important header fields :\n\n- Host The\
    \ domain of the server, if no port number is given, is assumed to be 80.\n- User-Agent\
    \ Contains information about the client originating the request, including the\
    \ OS information. In this case, it is my web-browser (Chrome), or OSX. This header\
    \ is important because it is used for statistics (How many users visit my website\
    \ on Mobile or Desktop) to prevent any violations by bots. Because these headers\
    \ are sent by the clients, it can be modified (it is called “Header Spoofing”),\
    \ and is exactly what we do with our scrapers, to make our scrapers look like\
    \ a normal web browser.\n- Accept The content types that are acceptable as a response.\
    \ There are lots of different content types and sub-types: text/plain, text/html,\
    \ image/jpeg, application/json ...\n\n> https://www.w3schools.com/tags/ref_httpmethods.asp\n"
  mdcn: "\n\n# 网络爬取简介\n\n网络爬取（Web scraping）或爬虫（Crawling）是指通过下载和解析 HTML 代码来从第三方网站获取数据的行为。这可以通过手动完成，但通常该术语指的是自动化下载页面的\
    \ HTML 内容、解析/提取数据，并将其保存到数据库中以供进一步分析或使用的自动化过程。\n\n# 网络爬取 VS API\n\n当一个网站想要向开发者社区开放数据/功能时，他们通常会构建一个\
    \ API（应用程序编程接口¹）。API 由一组 HTTP 请求组成，并通常以 JSON 或 XML 格式响应。例如，假设你想在代码中获取以太坊（Ethereum）加密货币的实时价格。你不需要爬取网站来获取这些信息，因为有很多\
    \ API 可以为你提供格式良好的数据：\n\n```\ncurl https://api.coinmarketcap.com/v1/ticker/ethereum/?convert=EUR\n\
    ```\n\n以及响应内容：\n\n> ¹https://en.wikipedia.org/wiki/Application_programming_interface\n\
    \n# Coinmarketcap JSON 响应\n\n```\n{\n  id: \"ethereum\",\n  name: \"Ethereum\"\
    ,\n  symbol: \"ETH\",\n  rank: \"2\",\n  price_usd: \"414.447\",\n  price_btc:\
    \ \"0.0507206\",\n  24h_volume_usd: \"1679960000.0\",\n  market_cap_usd: \"39748509988.0\"\
    ,\n  available_supply: \"95907342.0\",\n  total_supply: \"95907342.0\",\n  max_supply:\
    \ null,\n  percent_change_1h: \"0.64\",\n  percent_change_24h: \"13.38\",\n  percent_change_7d:\
    \ \"25.56\",\n  last_updated: \"1511456952\",\n  price_eur: \"349.84756557\",\n\
    \  24h_volume_eur: \"1418106314.76\",\n  market_cap_eur: \"33552949485.0\"\n}\n\
    ```\n\n我们也可以想象一个电子商务网站有一个 API，通过此端点列出所有产品：\n\n```\ncurl https://api.e-commerce.com/products\n\
    ```\n\n它还可以通过以下方式公开产品详情（id 为“123”）：\n\n```\ncurl https://api.e-commerce.com/products/123\n\
    ```\n\n由于并不是每个网站都提供整洁的 API，或者根本不提供 API，因此在提取网站信息时，网络爬取可能是唯一的解决方案。\n\n# 网络爬取简介\n\
    \n> [!INFO](image_url)\nAPI 通常更容易使用，问题是许多网站不提供任何 API。对于公司来说，构建 API 可能是一项巨大的成本，你需要发布它、测试它、处理版本控制、创建文档，还有基础设施成本、工程成本等。API\
    \ 的第二个问题是有时会有速率限制（你每天/每小时允许调用某个端点 X 次），第三个问题是数据可能是不完整的。\n\n# 网络爬取用例\n\n几乎所有内容都可以从\
    \ HTML 中提取，唯一“难以”提取的信息是图片或其他媒体内部的内容。以下是使用网络爬取的一些行业：\n\n- 新闻门户：聚合来自不同数据源的文章：Reddit\
    \ / 论坛 / Twitter / 特定新闻网站\n- 房产中介机构\n- 搜索引擎\n- 旅游业（机票/酒店价格比较工具）\n- 电子商务：监控竞争对手价格\n\
    - 银行：银行账户聚合（如 Mint 和其他类似应用）\n- 新闻业：也称为“数据新闻”\n- SEO（搜索引擎优化）\n- 数据分析\n- “数据驱动”的在线营销\n\
    - 市场研究\n- 线索生成……\n\n# 网络爬取简介\n\n如你所见，网络爬取有很多用例。\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_7_0.png)\n\
    \nMint.com 是一个个人财务管理服务，它允许你以集中的方式跟踪你拥有的账户以及许多其他功能。Mint.com 使用网络爬取为其客户执行账户聚合。这是一个经典问题，有些银行为此提供了\
    \ API，而另一些没有。因此当 API 不用时，Mint.com 仍然能够提取账户操作。客户提供其凭据（用户 ID 和密码），Mint 使用网络爬取完成几件事：\n\
    \n- 进入银行网站\n- 使用凭据填写登录表单\n- 进入账户概览\n- 针对每个账户，提取所有操作并保存到 Mint 后端\n- 退出\n\n通过这个过程，Mint\
    \ 能够支持任何银行，无论是否存在 API，也无论银行使用什么技术。这是网络爬取有多用且强大的良好例子。当然是，每当银行更改其网站（即使是 HTML 的微小变化），机器人也必须跟着更改。\n\
    \n![](img/cbd5c820756a64b88207a1ea9f1c87b_8_0.png)\n\n# Parsely 仪表板\n\n针对出版者的\
    \ Parsely 分析。其平台爬取整个网站以提取所有文章（文本、指标）并进行自然语言处理，让出版者能够了解观众喜欢或不喜欢什么。\n\n![](img/cbd5c820756a64b88207a1ea9f1c87b_9_0.png)\n\
