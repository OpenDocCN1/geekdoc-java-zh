    \ 这里是重要的头部字段：\n\n- Host 服务器的域名，如果没有提供端口号，假设为 80。\n- User-Agent 包含发起请求的客户端信息，包括操作系统信息。在这种情况下，它是我的网络浏览器（Chrome），或\
    \ OSX。这个头部很重要，因为它被用于统计（有多少用户通过移动或桌面访问我的网站）以防止任何违规行为。由于这些头部是由客户端发送的，它可以被修改（这被称为“头部伪造”），这正是我们使用爬虫时所做的，让我们的爬虫看起来像正常的网页浏览器。\n\
