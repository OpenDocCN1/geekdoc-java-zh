  - "[PAGE 13]\n\n# Web fundamentals\n\n+   - **Cookie**: name1=value1;name2=value2...\
    \ This header field contains a list of name-value pairs. It is called session\
    \ cookies, these are used to store data. Cookies are what websites use to authenticate\
    \ users, and/or store data in your browser. For example, when you fill a login\
    \ form, the server will check if the credentials you entered are correct, if so,\
    \ it will redirect you inject a session cookie in your browser. Your browser will\
    \ then send this cookie with every subsequent request to that server.\n- **Referer**:\
    \ The Referer header contains the URL from which the actual URL has been requested.\
    \ This header is important because websites use this header to change their behavior\
    \ based on where the user came from. For example, lots of websites have a paying\
    \ subscription and let you view 10% of a post, but if the user came from a news\
    \ aggregator like Reddit, they let you view the full content. They use the referer\
    \ to check that. Sometimes we will have to spoof this header to get to the content\
    \ extract.\n\nThe and list goes on...you can find the full header list here³\n\
    The server responds with a message like this :\n\n# Http response\n\n```\nHTTP/1.1\
    \ 200 OK\nServer: nginx/1.4.6 (Ubuntu)\nContent-Type: text/html; charset=utf-8\n\
    <!DOCTYPE html>\n<head>\n  <meta charset=\"utf-8\" />\n  .. [HTML CODE]\n```\n\
    \nOn the first line, we have a new piece of information, the HTTP code 200 OK.\
    \ It means the request has succeeded. As for the request headers, there are lots\
    \ of HTTP codes, split in four common classes :\n\n> ³https://en.wikipedia.org/wiki/List_of_HTTP_header_fields"
