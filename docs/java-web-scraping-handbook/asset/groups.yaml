    \ We don’t know exactly how it is done, Google didn’t disclose this for obvious\
    \ reasons, but a lot of speculations has been made:\n\n- Clicking behavior analysis:\
    \ where did the user click? Cursor acceleration etc.\n- Browser fingerprinting\n\
    - Click location (do you always click straight on the center, or is it random,\
    \ like a normal user)\n- Browser history and cookies\n\nOld captchas like the\
    \ first one, Optical Character Recognition and recent machine-learning frameworks\
    \ offer an excellent solving accuracy (sometimes better than Humans...) but for\
    \ Recaptcha v2 the easiest and more accurate way is to use third-party services.\n\
