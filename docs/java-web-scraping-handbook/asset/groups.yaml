    \    });\n  }\n</script>\n</head>\n<body>\n<div>\n<h2>苹果股票价格：</h2>\n<div id=\"\
    my_cell\"></div>\n<button id=\"refresh\" onclick=\"refreshStock()\">刷新</button>\n\
    </div>\n</body>\n</html>\n```\n\n# jQuery\n\njQuery 是最广泛使用的 Javascript 库之一。它非常老了，第一个版本编写于\
    \ 2006 年，被用于许多场景，例如：\n\n- DOM 操作\n- AJAX 调用\n- 事件处理\n- 动画\n- 插件（日期选择器等）\n\n这是相同代码的\
