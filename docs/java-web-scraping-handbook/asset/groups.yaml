  - '[PAGE 6]


    # Introduction to Web scraping


    > > [!INFO](image_url)

    >APIs are generally easier to use, the problem is that lots of websites don''t
    offer any API. Building an API can be a huge cost for companies, you have to ship
    it, test it, handle versioning, create the documentation, there are infrastructure
    costs, engineering costs etc. The second issue with APIs is that sometimes there
    are rate limits (you are only allowed to call a certain endpoint X times per day/hour),
    and the third issue is that the data can be incomplete.


    # Web scraping use cases


    Almost everything can be extracted from HTML, the only information that is “difficult”
    to extract is inside images or other medias. Here are some industries where webing
    is being used :


    +   - News portals : to aggregate articles from different datasources : Reddit
    / Forums / Twitter / specific news websites

    - Real Estate Agencies.

    - Search Engine

    - The travel industry (flight/hotels prices comparators)

    - E-commerce, to monitor competitor prices

    - Banks : bank account aggregation (like Mint and other similar apps)

    - Journalism : also called “Data-journalism”

    - SEO

    - Data analysis

    - “Data-driven” online marketing

    - Market research

    - Lead generation ...'
  - '[PAGE 7]


    # Introduction to Web scraping


    As you can see, there are many use cases to web scraping.


    ![](img/cbd5c820756a64b88207a1ea9f1c877b_7_0.png)


    Mint.com is a personnal finance management service, it allows you to track the
    bank accounts you have in a centralized way, and many different things. Mint.com
    uses web scraping to perform bank account aggregation for its clients. It’s a
    classic problem we discussed earlier, some banks have an API for this, others
    do not. So when an API is not available, Mint.com is still able to extract the
    bank account operations.


    A client provides his bank account credentials (user ID and password), and Mint
    robots use web scraping to do several things :


    +   * Go to the banking website

    * Fill the login form with the user’s credentials

    * Go to the bank account overview

    * For each bank account, extract all the bank account operations and save it intothe
    Mint back-end.

    * Logout


    With this process, Mint is able to support any bank, regardless of the existence
    of an API, and no matter what backend/frontend technology the bank uses. That’s
    a good example of how useful and powerful web scraping is. The'
