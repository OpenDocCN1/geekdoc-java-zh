- md: "\n# Handling forms\n\nIt is a simple form, there is nothing complicated. As\
    \ usual, we have to select the inputs field, fill it with the values we want,\
    \ and submit the form. We could also reproduce the POST request manually, as we\
    \ saw in the beginning of the chapter. When the server sends the response back,\
    \ I chose to loop over the result, and print it in the console (The whole code\
    \ is available in the repo as usual.)\n\n### Search example\n\n```java\nHtmlPage\
    \ page = client.getPage(baseUrl + \"product/search\");\n\nHtmlInput minPrice =\
    \ page.getElementByIdById(\"min_price\");\nHtmlInput maxSize = page.getElementByIdById(\"\
    max_price\");\n\n// set the min/max values\nminPrice.setAttribute(MINPRICE);\n\
    maxPrice.setAttribute(MAXPRICE);\nHtmlForm form = minPrice.getEnclosingForm();\n\
    \npage = client.getPage(form.getWebRequest(null));\n\nHtmlTable table = page.getFirstXPath(\"\
    //table\");\nfor(HtmlTableRow row : table.getBodies().get(0).getRows()){\n   \
    \ System.out.println(String.format(\"Name : %s Price: %s\", elem.getCell(0).asText(),\
    \ elem.getCell(2).getText()));\n}\n```\n\nAnd here is the result:\n\n| Name |\
    \ Price |\n| :--- | :--- |\n| ClosetMaid 1937440 SuiteS | 319.89 $ |\n| RWS Model\
    \ 34 .22 Caliber | 314.97 $ |\n| Neato Botvac D5 Connected | 549.00 $ |\n| Junghans\
    \ Men's 'Max Bill' | 495.00 $ |\n\n# Output\n\nIn the 90s, basic authentication\
    \ was everywhere. Nowadays, you can still find it on corporate websites. It's\
    \ one of the simplest forms of authentication. The server will check the credentials\
    \ in the Authorization header sent by the client, or issue a prompt in case of\
    \ web browser. If the credentials are not correct, the server will respond with\
    \ 401 (Unauthorized) status.\n\n![](img/5c820756a4b8820a1ea9f1c877b_0.png)\n\n\
    ### Basic Authentication\n\nIt’s really simple to use basic auth with HtmlUnit,\
    \ all you have to do is format your URL with this pattern: `https://username:password@www.webscraping.com`.\n\
    \n### Basic auth example\n\n```java\nHtmlPage page = client.getPage(String.format(\"\
    https://%s:%s@www.webscraping.com/auth\", username, password));\nSystem.out.println(page.asText());\n\
    ```\n\n# Dealing with Javascript\n\nDealing with website that uses lots of Javascript\
    \ to render their content can be tricky. These days, more and more sites are using\
    \ frameworks like Angular, React, Vue.js for their frontend. These frontend frameworks\
    \ are complicated to deal with because they often use the newest HTML5 features,\
    \ and HtmlUnit do not support these features. So basically the problem that you\
    \ encounter is that your headless browser will download the HTML code, and the\
    \ Javascript code will not be able to execute the full code, and the webpage will\
    \ not totally rendered. There are some solutions to these problems. The first\
    \ one is to use a better headless browser. The second one is to inspect the API\
    \ calls made by the Javascript frontend and reproduce them.\n\n# Javascript 101\n\
    \nJavascript is an interpreted scripting language. It’s more and more used to\
    \ build “Web applications” and “Single Page Applications”. The goal of this chapter\
    \ is not to teach you Javascript, but I want you to understand how it is used\
    \ on the web. Javascript syntax is similar to C or Java, supporting common data\
    \ types like Boolean, String, Arrays, Object... Javascript is loosely typed, meaning\
    \ there is no need to declare the data type explicitly. Here is some examples:\n\
    \n### Plus one function\n\n```javascript\nfunction plusOne(number) {\n  return\
    \ number + 1;\n}\nvar a = 4;\nvar b = plusOne(a);\nconsole.log(b); // will print\
    \ 5 in the console\n```\n\nAs we saw in chapter 2, Javascript is mainly used on\
    \ the web to modify the DOM dynamically and perform HTTP requests. Here is a sample\
    \ code that use stock API to retrieve Apple stock price when clicking that button:\n\
    \n### vanilla Javascript\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script>\n\
    \  function refreshStock(){\n    fetch(\"https://api.example.com/1.0/stock/aapl/batch?types=quote,news,chart&range=1m&last=10\"\
    )\n    .then(function(response) {\n      return response.json();\n    }).then(function(data)\
    \ {\n      document.getElementById('my_cell').innerHTML = '$' + data.quote.latest;\n\
    \    });\n  }\n</script>\n</head>\n<body>\n<div>\n<h2>Apple stock price:</h2>\n\
    <div id=\"my_cell\"></div>\n<button id=\"refresh\" onclick=\"refreshStock()\"\
    >Refresh</button>\n</div>\n</body>\n</html>\n```\n\n# jQuery\n\njQuery is one\
    \ of the most used Javascript libraries. It's really old, the first version was\
    \ written in 2006, and it is used for lots of things such as:\n\n- DOM manipulation\n\
    - AJAX calls\n- Event handling\n- Animation\n- Plugins (Datepicker etc.)\n\nHere\
    \ is a jQuery version of the same code (you can note that the jQuery version is\
    \ not necessarily clearer than the vanilla Javascript one...):\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/jquery/3.2.1/jquery.min.js\"\
    ></script>\n<script>\nfunction refreshStock() {\n  $.get(\"https://api.example.com/1.0/stock/aapl/batch?types=quote,news,chart&range=1m&last=10\"\
    , function(data, status) {\n    $('#my_cell').html('$' + data.quote.latestPrice);\n\
    \  });\n}\n\n$(document).ready(function(){\n  $(\"#refresh\").click(function(){\n\
    \    refreshStock();\n  });\n});\n</script>\n</head>\n<body>\n<div>\n<h2>Apple\
    \ stock price:</h2>\n<div id=\"my_cell\"></div>\n<button id=\"refresh\">Refresh</button>\n\
    </div>\n</body>\n</html>\n```\n\nIf you want to know about Javascript, I suggest\
    \ you this excellent book: Eloquent Javascript (https://eloquentjavascript.net/).\n\
    \n# Modern Javascript frameworks\n\nThere are several problems with jQuery. It\
    \ is extremely difficult to write clean/maintainable code with it the Javascript\
    \ application grows. Most of the time, the codebase becomes full of \"glue code\"\
    , and you have to be careful with each id or class name changes. The other big\
    \ concern is that it can be complicated to implement data-binding between Javascript\
    \ models and the DOM.\n\nThe other problem with the traditional server-side rendering\
    \ is that it can be inefficient. Let's say you are browsing a table on an old\
    \ website. When you request the next page, the server is going to render the entire\
    \ HTML page, with all the assets and send it back to your browser. With an SPA,\
    \ only one HTTP request would have been made, the server would have sent back\
    \ a JSON containing the data, and the Javascript framework would have filled the\
    \ HTML model.\n"
