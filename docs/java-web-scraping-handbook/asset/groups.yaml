- md: "\n# Extracting the data you want\n\nFor our first example, we are going to\
    \ fetch items from Hacker News, although they offer a nice API, let's pretend\
    \ they don't.\n\n# Tools\n\nYou will need Java 8 with HtmlUnit¹⁶. HtmlUnit is\
    \ a Java headless browser, is this library that will allow you to perform HTTP\
    \ requests on websites, and parse the HTML content.\n\npom.xml\n\n```xml\n<dependency>\n\
    \  <groupId>net.forge.htmlunit</groupId>\n  <artifactId>htmlunit</artifactId>\n\
    \  <version>2.28</version>\n</dependency>\n```\n\nIf you are using Eclipse, I\
    \ suggest you configure the max length in the detail pane (when you click in the\
    \ variables tab) so that you will see the entire HTML of your current page.\n\n\
    > ¹⁶http://htmlunit.sourceforge.net\n\nExtracting the data you want\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_30_0.png)\n\
    \n## Let’s scrape Hacker News\n\nThe goal is to collect the titles, number of\
    \ upvotes, number of comments on the first page. We will see how to handle pagination\
    \ later.\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_30_1.png)\n\nThe base URL\
    \ is: https://news.ycombinator.com/\n\nNow you can use your favorite IDE, it is\
    \ time to. HtmlUnit needs WebClient to make a request. There are many options\
    \ (Proxy settings, browser, redirected enabled ...) We are going to disable Javascript\
    \ since it’s not required for our example, and disabling Javascript makes the\
    \ page load faster in general (in this specific case, it does not matter). Then\
    \ we perform a GET request to the hacker news’s URL, and print the HTML content\
    \ we received from the server.\n\n## Simple GET request\n\n```java\nString baseUrl\
    \ = \"https://news.ycombinator.com/\";\nHttpClient client = new HttpClient();\n\
    client.getOptions().setCssEnabled(false);\nclient.getOptions().setJavaScriptEnabled(false);\n\
    try{\n  HtmlPage page = client.getPage(baseUrl);\n  System.out.println(page.asXml());\n\
    } catch(Exception e){\n  e.printStackTrace();\n}\n```\n\nThe HtmlPage object will\
    \ contain the HTML code, you can access it with the asXml() method.\n\nNow for\
    \ each item, we are going to extract the title, URL, author etc. First let’s take\
    \ a look at what happens when you inspect a Hacker news post (right click on the\
    \ element + inspect on Chrome)\n\n## Extracting the data\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_32_0.png)\n\
    \n- 1. [Libraft Structured Concurrency for C (2016)](https://libraft.org)\n  45\
    \ points by bynomic 2 hours ago | 18 comments\n- 2. [Dozens of Companies Are Using\
    \ Bias to Exclude Older Workers from Jobs Ad prospects](https://news.ycombinator.com)\n\
    \  427 points by 20 5 hours ago | 154 comments\n- 3. [Racing for Realism](https://prism.com)\n\
    \  202 points by jasonr 8 hours ago | 66 comments\n- 4. [A Letter from the Publisher\
    \ of Nautilus](https://news.ycombinator.com)\n  128 points by larsson 9 hours\
    \ ago | 31 comments\n- 5. [Romanian Hacker Infects 65% of DC Surveillance Cameras](https://news.ycombinator.com)\n\
    \  55 points by j6233 1 day ago | 32 comments\n- 6. [SQL Injection](https://news.ycombinator.com)\n\
    \  892 points by isid 8 hours ago | 301 comments\n- 7. [Berlin Has to Become a\
    \ City for Citizens](https://news.ycombinator.com)\n  95 points by m14 9 hours\
    \ ago | 123 comments\n- 8. [Twelve Days in Waitan: How China's Surveillance State\
    \ Overwhelmed Daily Life](https://cps9.dreamearth.com)\n  129 points by benish\
    \ 9 hours ago | 77 comments\n- 9. [The justice has not been proved](https://wordpress.com)\n\
    \  98 points by jid 1 day ago | 45 comments\n- 10. [A Guide to Serverless Architecture](https://news.ycombinator.com)\n\
    \  85 points by m_v 1 day ago | 22 comments\n- 11. [How Cuts in Subway to Make\
    \ NYC Miserable](https://news.ycombinator.com)\n  80 points by smith 1 day ago\
    \ | 10 comments\n- 12. [When behaviour outside a community has consequences](https://dreamearth.com)\n\
    \  21 points by jasonr 1 day ago | 92 comments\n\nWith HtmlUnit you have several\
    \ options to select html tag:\n- getById(String id)\n- getFirstXPath(String XPath)\n\
    - getByXPath(String XPath)\n- Many more can be found Documentation\n\nSince there\
    \ isn't any ID, we have to use an XPath expression to select tags. We can see\
    \ that for each item, we have two lines of text. In the first line, there is the\
    \ position, the title, the URL and the ID. And on the second, the score, author\
    \ and comments. In the DOM structure, each line is inside `<tr class=\"thing\"\
    >` tag so the first thing we need to do is iterate through this list, and for\
    \ each item select the title, the URL, author etc with relative XPath and then\
    \ print the content.\n\n## HackerNewsScraper.java Selecting with XPath\n\n```java\n\
    HtmlPage page = client.getPage(baseUrl);\nList<HtmlElement> itemList = page.getByXPath(\"\
    tr[class='thing']\");\nif(itemList.isEmpty()){\n    System.out.println(\"No item\
    \ found\");\n}else{\n    for(HtmlElement htmlItem : itemList){\n        int id\
    \ = Integer.parseInt(htmlItem.getAttribute(\"id\"));\n        String title = ((HtmlElement)htmlItem.getByXPath(\"\
    td[not(@align='top')][class='title']\")).asText());\n        String url = ((HtmlAnchor)htmlItem.getByXPath(\"\
    td[not(@align='top')][class='title']/a\")).getHref();\n        String author =\
    \ ((HtmlElement)htmlItem.getByXPath(\"following-sibling::tr[class='subtext']/a[@class='hn']\"\
    )).asText());\n        int score = Integer.parseInt(((HtmlElement)htmlItem.getByXPath(\"\
    following-sibling::tr[class='subtext']/span[@class='score']\")).asText().replace(\"\
    \ points\", \"\"));\n    }\n}\n```\n\n## Extracting the data you want\n\n```java\n\
    HackerNewsItem hnItem = new HackerNewsItem(title, url, author, score, position,\
    \ id);\n\nObjectMapper mapper = new ObjectMapper();\nString jsonString = mapper.writeValueAsString(hnItem);\n\
    \nSystem.out.println(jsonString);\n```\n\nPrinting the result in your IDE is cool,\
    \ but exporting to JSON or another well-formatted/reusable format is better. We\
    \ will use JSON, with the Jackson¹⁷ library, to map items in POJO format.\n\n\
    First we need a POJO (plain old java object) to represent the Hacker News items:\n\
    \n## HackerItem.java POJO\n\n```java\npublic class HackerNewsItem {\n    private\
    \ String title;\n    private String url;\n    private String author;\n    private\
    \ int score;\n    private int position;\n    private int id;\n\n    public HackerNewsItem(String\
    \ title, String url, String author, int score, int position, int id) {\n     \
    \   super();\n        this.title = title;\n        this.url = url;\n        this.author\
    \ = author;\n        this.score = score;\n        this.position = position;\n\
    \        this.id = id;\n    }\n\n    // getters and setters\n}\n```\n\n> ¹⁷https://github.com/FasterXML/jackson\n\
    \nThen add the Jackson dependency to your pom.xml : pom.xml\n\n```xml\n<dependency>\n\
    \  <groupId>com.fasterxml.jackson.core</groupId>\n  <artifactId>jackson-databind</artifactId>\n\
    \  <version>2.7.0</version>\n</dependency>\n```\n\nNow all we have to do is create\
    \ an Item, set its attributes, and convert it to JSON string (or a file ...).\
    \ Replace the old System.out.println() by this :\n\n## HackerNewsScraper.java\n\
    \n```java\nHackerNewsItem hnItem = new HackerNewsItem(title, url, author, score,\
    \ position, id);\nObjectMapper mapper = new ObjectMapper();\nString jsonString\
    \ = mapper.writeValueAsString(hnItem);\n// print or save to a file\nSystem.out.println(jsonString);\n\
    ```\n\nAnd that's it. You should have a nice list of JSON formatted items.\n\n\
    ## Go further\n\nThis example is not perfect, there are many things that can be\
    \ done :\n\n- Saving the result in a database.\n- Handling pagination.\n- Validating\
    \ the extracted data using regular expressions instead of doing dirty replace().\n\
    \nYou can find the full code in this Github repository¹⁸.\n\n> ¹⁸https://github.com/ksahin/javawebscrapinghandbook_code\n"
