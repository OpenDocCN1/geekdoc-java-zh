    \ The first thing is to locate your tessdata folder, it contains everything tesseract\
    \ needs to recognize language specific characters. The location will vary depending\
    \ on how you installed tesseract.\n\nfinal static String TESS_DATA_PATH = \"/path/to/tessdata\"\
    ;\n\nHere is the full code:\n\n```\nBytePointer outText;\nTessBaseAPI api = new\
    \ TessBaseAPI();\n\nif (api.Init(TESS_DATA_PATH, \"ENG\") != 0) {\n    System.err.println(\"\
    Could not initialize tesseract.\");\n    System.exit(1);\n}\n```\n\n```\nPIX image\
    \ = lept.pixRead(\"ocr_exemple.jpg\");\napi.SetImage(image);\n```\n\n```\n// Get\
    \ OCR result\noutText = api.getUTF8Text();\nString string = outText.getString();\n\
    String invoiceNumber = \"\";\nfor(String lines : string.split(\"\\n\"))\n\n```\n\
    // Destroy object used and release memory\napi.End();\noutText.deallocate();\n\
    lept.pixDestroy(image);\n```\n\nThis was just an example on how to use Tesseract\
    \ for simple OCR, I'm not an expert on OCR and image processing, but here are\
    \ some tips:\n\n- Initialize Tesseract with the right language. Image processing:\
    \ image cropping, different contrasts, re-scaling, border removal... can significantly\
