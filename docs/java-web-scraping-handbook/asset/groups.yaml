- md: "\n## Handling forms\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_37_0.png)\n\
    \nTypical login form from Digital Ocean website\n\nIn this chapter, we are going\
    \ to see how to handle forms on the web. Knowing how to submit forms can be critical\
    \ to extract information behind a login form, or to perform actions that require\
    \ to be authenticated. Here are some examples of actions that require to submit\
    \ a form :\n\n- Create an account\n- Authentication\n- Post a comment on a blog\n\
    - Upload an image or a file\n- Search and Filtering on a website\n- Collecting\
    \ a user email\n- Collecting payment information from a user\n- Any user-generated\
    \ content !\n\n## Form Theory\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_38_0.png)\n\
    \nForm diagram\n\nThere are two parts of a functional HTML form: the user interface\
    \ (defined by its HTML code and CSS) with different inputs and the backend code,\
    \ which is going to process the different values the user entered, for example\
    \ by storing it in a database, or charging the credit card in case of a payment\
    \ form.\n\n## Form tag\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_39_0.png)\n\
    \nForm diagram 2\n\nHTML forms begins with a <form> tag. The most important ones\
    \ are the action and method attribute.\n\nThe action attribute represents the\
    \ URL where the HTTP request will be sent, and the method attribute specifies\
    \ which HTTP method to use.\n\nGenerally, POST methods are used when you create\
    \ or modify something, for example:\n\n- Login forms\n- Account creation\n- Add\
    \ a comment to a blog\n\n> ^15}https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form\n\
    \n## Form inputs\n\nIn order to collect user inputs, the <input> element is used.\
    \ It is this element that makes the text field appear. The <input> element has\
    \ different attributes :\n\n- type: email, text, radio, file, date...\n- name:\
    \ the name associated with the value that will be sent\n- many more\n\nLet’s take\
    \ an example of a typical login form :\n\n> 20https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input\n\
    \n## Login Form\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_41_0.png)\n\nUsername\n\
    \nEnter Username\n\nPassword\n\nEnter Password\n\nLogin\n\nClassic login form\n\
    \nAnd here is the corresponding HTML code (CSS code is not included):\n\n## Handling\
    \ forms\n\n## Form’s HTML code\n\n```\n<form action=\"login\" method=\"POST\"\
    >\n<div class=\"container\">\n  <img src=\"img_avatar2.png\" alt=\"Avatar\" class=\"\
    avatar\">\n</div>\n\n<div class=\"container\">\n  <label for=\"uname\"><b>Username</b></label>\n\
    \  <input type=\"text\" placeholder=\"Enter Username\" name=\"uname\" required>\n\
    \n  <label for=\"psw\"><b>Password</b></label>\n  <input type=\"password\" placeholder=\"\
    Enter Password\" name=\"psw\" required>\n\n  <button type=\"submit\">Login</button>\n\
    </div>\n</form>\n```\n\nWhen a user fills the form with his credentials, let’s\
    \ say usernameand my_great_password and click the submit button, the request sent\
    \ by the browser will look like this :\n\n## Http response\n\n```\nPOST /login\
    \ HTTP/1.1\nHost: example.com\nContent-Type: application/x-www-form-urlencoded\n\
    uname=username&psw=my_great_password\n```\n\n## Cookies\n\nAfter the POST request\
    \ is made, if the credentials are valid the server will generally set cookies\
    \ in the response headers, to allow the user to navigate.\n\n## Handling forms\n\
    \nThis cookie is often named (the name depends on the technology/framework\nused\
    \ by the website’s backend):\n\n- session_id\n- session\n- JSESSION_ID\n- PHPSESSID\n\
    \nThis cookie will be sent for each subsequent requests by the browser, and the\n\
    website’s backend will check its presence and validity to authorize requests.\n\
    Cookies are not only used for login, but for lots of different use cases:\n\n\
    - Shopping carts\n- User preferences\n- Tracking user behavior\n\nCookies are\
    \ small key/value pairs stored in the browser, or in an HTTP client,\nthat looks\
    \ like this:\n\n```\ncookie_name=cookie_value\n```\n\nAn HTTP response that sets\
    \ a cookie looks like this:\n\n## Http response\n\n```\nHTTP/1.0 200 OK\nContent-type:\
    \ text/html\nSet-Cookie: cookie_name=cookie_value\n```\n\nAn HTTP request with\
    \ a cookie looks like this:\n\n## Handling forms\n\nHttp request\n\n```\nGET /sample_page.html\
    \ HTTP/1.1\nHost: www.example.org\nCookie: cookie_name=cookie_value\n```\n\nA\
    \ cookie can have different attributes :\n\n- Expires: Expiration date, by default,\
    \ cookies expire when the client closes the connection.\n- Secure: only sent to\
    \ HTTPS URLs\n- HttpOnly: Inaccessible to Javascript Document.cookie, to prevent\
    \ session hijacking and XSS attack²¹\n- Domain: Specifies which host is allowed\
    \ to receive the cookie\n\n## Login forms\n\nTo study login forms, let me introduce\
    \ you the website I made to apply some example in this book : https://www.javawebscrapingsand.com²²\n\
    \nThis website will serve for the rest of the book for lots of different examples,\
    \ starting with the authentication example. Let's take a look at the login form\
    \ HTML :\n\n> ²¹https://developer.mozilla.org/en-US/docs/Glossary/Cross-site_scripting\n\
    ²²https://www.javawebscrapingssandbox.com\n\n## Handling forms\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_45_0.png)\n\
    \nBasically, our scraper needs to:\n\n- Get to the login page\n- Fills the input\
    \ with the right credentials\n- Submit the form\n- Check if there is an error\
    \ message or if we are logged in.\n\nThere are two “difficult” thing here, the\
    \ XPath expressions to select the inputs, and how to submit the form.\n\nTo select\
    \ the input, it is quite simple, we have to select the first inside a form, which\
    \ name attribute is equal to email, so this XPath should be: `//input[@name='email']`.\n\
    \n## Handling forms\n\nSame for the password input : //form[@name='password']\n\
    \nTo submit the form, HtmlUnit provides a great method to select a form :\nHtmlForm\
    \ = input.getEnclosingForm().\n\nOnce you have the form, you can generate the\
    \ POST request for this form using: loginForm.WebRequest(null) that's all you\
    \ have to do :\n\nLogin example\n\n```java\npublic class Authentication {\n\n\
    \    static final String baseUrl = \"https://www.javawebscrapingssandbox.com/\"\
    ;\n    static final String loginUrl = \"account/login\";\n    static final String\
    \ email = \"test@test.com\";\n    static final String password = \"test\";\n\n\
    \    public static void main(String[] args) throws FailingHttpStatusCodeException,\n\
    MalformedURLException, IOException, InterruptedException {\n        WebClient\
    \ client = new WebClient();\n        client.getOptions().setJavaScriptEnabled(true);\n\
    \        client.getOptions().setCssEnabled(false);\n        client.getOptions().setInsecureSSL(true);\n\
    \        java.util.logging.Logger.getLogger(\"com.gargoylesoftware\").setLevel(Level.OFF);\n\
    \n        // Get the login page\n        HtmlPage page = client.getPage(String.\n\
    \            format(\"%s%s\", baseUrl, loginUrl));\n\n        // Select the email\
    \ input\n        HtmlInput inputEmail = page.getFirstByXPath(\n            \"\
    //input[@name='email']\");\n\n        // Select the password input\n        HtmlInput\
    \ inputPassword = page.getFirstByXPath(\n\"//input[@name='password']\");\n\n \
    \       // Set the value for both inputs\n        inputEmail.setAttribute(email);\n\
    \        inputPassword.setAttribute(password);\n\n        // Select the form\n\
    \        HtmlForm loginForm = inputPassword.getEnclosingForm();\n\n        //\
    \ Generate the POST request with the form\n        page = client.getPage(loginForm.WebRequest(null));\n\
    \n        if(!page.asText().contains(\"You are now logged in\")){\n          \
    \  System.out.println(\"Error: Authentication failed\");\n        }else{\n   \
    \         System.out.println(\"Success ! Logged in\");\n        }\n    }\n}\n\
    ```\n\nThis method works for almost every websites. Sometimes if the website uses\
    \ a Javascript framework, HtmlUnit will not be able to execute the Javascript\
    \ code (even with setJavaScriptEnabled(true) ) and you will have to either inspect\
    \ the HTTP POST request in Chrome Dev Tools and recreate it, or use Headless Chrome\
    \ which I will cover in the next chapter.\n\nLet's take a look at the POST request\
    \ created by HtmlUnit when we call loginForm.WebRequest(null). To view this, launch\
    \ the main method in debug mode, and inspect the content (ctrl/cmd + D in eclipse)\
    \ :\n"
  mdcn: "\n\n## 处理表单\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_37_0.png)\n\nDigital\
    \ Ocean 网站的典型登录表单\n\n在本章中，我们将学习如何处理 Web 上的表单。了解如何提交表单对于提取登录表单背后的信息，或执行需要身份验证的操作至关重要。以下是一些需要提交表单的常见操作示例：\n\
    \n- 创建账户\n- 身份验证\n- 在博客上发表评论\n- 上传图片或文件\n- 网站上的搜索与过滤\n- 收集用户邮箱\n- 从用户处收集支付信息\n\
    - 任何用户生成的内容！\n\n## 表单理论\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_38_0.png)\n\
    \n表单图\n\n功能性的 HTML 表单包含两个部分：用户界面（由其 HTML 代码和 CSS 定义，具有不同的输入框）以及后端代码。后端代码将处理用户输入的不同值，例如将其存储在数据库中，或者在支付表单中对信用卡扣。\n\
    \n## Form 标签\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_39_0.png)\n\n表单图 2\n\n\
    HTML 表单以 `<form>` 标签开始。最重要的属性是 `action` 和 `method`。\n\n`action` 属性代表 HTTP 请求将发送到的\
    \ URL，`method` 属性指定了使用哪种 HTTP 方法。\n\n通常，在创建或修改某些内容时使用 `POST` 方法，例如：\n\n- 登录表单\n\
    - 账户创建\n- 为博客添加评论\n\n> ^15}https://developer.mozilla.org/en-US/docs/Web/HTML/Element/form\n\
    \n## 表单输入框\n\n为了收集用户输入，使用了 `<input>` 元素。正是这个元素使得文本字段出现。`<input>` 元素具有不同的属性：\n\n\
    - type: email, text, radio, file, date...\n- name: 与将发送的值关联的名称\n- 更多属性\n\n让我们来看一个典型的登录表单示例：\n\
    \n> 20https://developer.mozilla.org/en-US/docs/Web/HTML/Element/input\n\n## 登录表单\n\
    \n![](img/cbd5c820756a64b88207a1ea9f1c877b_41_0.png)\n\n用户名\n\n输入用户名\n\n密码\n\n\
    输入密码\n\n登录\n\n经典登录表单\n\n这是对应的 HTML 代码（不包含 CSS 代码）：\n\n## 处理表单\n\n## 表单的 HTML 代码\n\
    \n```\n<form action=\"login\" method=\"POST\">\n<div class=\"container\">\n  <img\
    \ src=\"img_avatar2.png\" alt=\"Avatar\" class=\"avatar\">\n</div>\n\n<div class=\"\
    container\">\n  <label for=\"uname\"><b>Username</b></label>\n  <input type=\"\
    text\" placeholder=\"Enter Username\" name=\"uname\" required>\n\n  <label for=\"\
    psw\"><b>Password</b></label>\n  <input type=\"password\" placeholder=\"Enter\
    \ Password\" name=\"psw\" required>\n\n  <button type=\"submit\">Login</button>\n\
    </div>\n</form>\n```\n\n当用户用其凭据（例如用户名 `username` 和 `my_great_password`）填充表单并点击提交按钮时，浏览器发送的请求将如下：\n\
    \n## Http 响应\n\n```\nPOST /login HTTP/1.1\nHost: example.com\nContent-Type: application/x-www-form-urlencoded\n\
    uname=username&psw=my_great_password\n```\n\n## Cookies\n\n在进行 POST 请求后，如果凭据有效，服务器通常会在响应头中设置\
    \ Cookie，允许用户进行导航。\n\n## 处理表单\n\n此 Cookie 通常被命名为（名称取决于网站后端使用的技术/框架）：\n\n- session_id\n\
    - session\n- JSESSION_ID\n- PHPSESSID\n\n浏览器会在随后的每个请求中发送此 Cookie，网站后端端将检查其存在性和有效性以授权请求。Cookie\
    \ 不仅用于登录，还用于许多不同的用例：\n\n- 购物车\n- 用户偏好\n- 跟踪用户行为\n\nCookie 是存储在浏览器或 HTTP 客户端中的小型键值对，其形式如下：\n\
    \n```\ncookie_name=cookie_value\n```\n\n设置 Cookie 的 HTTP 响应如下：\n\n## Http 响应\n\
    \n```\nHTTP/1.0 200 OK\nContent-type: text/html\nSet-Cookie: cookie_name=cookie_value\n\
    ```\n\n带有 Cookie 的 HTTP 请求如下：\n\n## 处理表单\n\nHttp 请求\n\n```\nGET /sample_page.html\
    \ HTTP/1.1\nHost: www.example.com\nCookie: cookie_name=cookie_value\n```\n\n"
