    \n> 23https://en.wikipedia.org/wiki/Cross-site_request_forgery\n\n# Case study:\
    \ Hacker News authentication\n\nLet's say you want to create a bot that logs into\
    \ a website (to submit a link or perform an action that requires being authenticated):\n\
    \nHere is the login form and the associated DOM :\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_50_0.png)\n\
    \nNow we can implement the login algorithm\n\n# Login algorithm\n\n```\npublic\
    \ static WebClient autoLogin(String loginUrl, String login, String password) throws\
    \ HttpStatusException, MalformedURLException, IOException {\n    WebClient client\
    \ = new WebClient();\n    client.getOptions().setCssEnabled(false);\n    client.getOptions().setJavaScriptEnabled(false);\n\
    \n    HtmlPage page = client.getPage(loginUrl);\n\n    HtmlInput inputPassword\
