    # Selenium API


    In the Selenium API, almost everything * based around two interfaces : * WebDriver
    which is the HTTP client * WebElement which represents a DOM object


    The WebDriver39 can be initialized with almost every browser, and with different
    options (and of course, browser-specific options) such as the window size, the
    logs file''s path etc.


    Here are some useful methods :


    | Method | Description |

    | --- | --- |

    | driver.get(URL) | performs a GET request to the specified URL |

    | driver.getCurrentUrl() | returns the current URL |

    | driver.getPageSource() | returns the full HTML code for the current page |

    | driver.navigate().back() | navigate one step back in the history, works with
    forward too |

    | driver.switchTo().frame(frame) | switch to the specified IFrame |

    | driver.manage().getCookies() | returns all cookies, lots of other related methods
    exists |

    | driver.quit() | quits the driver, and closes all associated windows |

    | driver.findElement(by) | returns a WebElement located by the specified locator
    |


    The findElement() method is one of the most interesting for our scraping needs.


    You can locate elements with different ways :


    +   - findElement(By.Xpath(''/xpath/expression''))


    > 39https://seleniumhq.github.io/selenium/docs/api/java/org/openqa/selenium/WebDriver.html'
