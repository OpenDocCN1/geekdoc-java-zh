    \n### Google ReCaptcha v2\n\nThe last one is the most used captcha mechanism,\
    \ Google ReCaptcha v2. That’s why we are going to see how to “break” these captchas.\n\
    \nThe only thing the user has to do is to click inside the checkbox. The service\
