    \ the proxy pool. You can configure HttpClient to fit your needs, and set a minimum/maximum\
    \ instance number, manage blacklisting either within the configuration file, for\
    \ example you could blacklist any proxy receiving a 503 HTTP response or programmatically\
    \ in case the website blocks you with a Captcha, or a special web page.\n\n##\
    \ TOR: The Onion Router\nTOR, also known as The Onion Router is a worldwide computer\
    \ network designed to route traffic through many different servers to hide its\
