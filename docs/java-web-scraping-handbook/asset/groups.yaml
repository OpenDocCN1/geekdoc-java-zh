  - "[PAGE 33]\n\n# Extracting the data you want\n\ntext. In the first line, there\
    \ is the position, the title, the URL and the ID. And on the second, the score,\
    \ author and comments. In the DOM structure, each text line is inside a &lt;tr&gt;\
    \ tag so the first thing we need to do is the full &lt;tr class=\"thing\"&gt;.\
    \ We will then iterate through this list, and for each item select title, the\
    \ URL, author etc with a relative Xpath and then print the content or value.\n\
    \n# HackerNewsScraper.java\n\nSelecting nodes with Xpath\n\n```\nHtmlPage page\
    \ = client.getPage(baseUrl);\nList<HtmlElement> itemList = page.getByXpath(\"\
    tr[class='thing']\");\nif(itemList.isEmpty()){\n    System.out.println(\"No item\
    \ found\");\n}else{\n    for(HtmlElement htmlItem : itemList){\n        int position\
    \ = Integer.parseInt(\n            ((HtmlElement)htmlItem.getByXpath(\".td/span\"\
    )\n            .asText()\n            .replace(\" \", \"\")));\n        int id\
    \ = Integer.parseInt(htmlItem.getAttribute(\"id\"));\n        String title = ((HtmlElement)htmlItem\n\
    \            .getByXpath(\".td[not(@align='top')][class='title']\")\n        \
    \    .asText());\n        String url = ((HtmlAnchor)htmlItem\n            .getByXpath(\"\
    .td[not(@align='top')][class='title']/a\")\n            .getHrefAttribute());\n\
    \        String author = ((HtmlElement)htmlItem\n            .getByXpath(\".following-sibling::tr[class='subtext']/a\n\
    \            [@class='hnuser']\")\n            .asText());\n        int score\
    \ = Integer.parseInt(\n            ((HtmlElement)htmlItem\n            .getByXpath(\"\
    .following-sibling::tr[class='subtext']/sp\n            [@class='score']\")\n\
    \            .asText().replace(\" points\", \"\")));\n    }\n}\n\n```"
