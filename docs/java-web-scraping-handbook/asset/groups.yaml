    );\n\n    inputLogin.setAttribute(login);\n    inputPassword.setAttribute(password);\n\
    \n    //get the enclosing form\n    HtmlForm loginForm = inputPassword.getEnclosingForm();\n\
    \n    //submit the form\n    page = client.getPage(loginForm);\n\n    //returns\
