    \ Reddit 这样的新闻聚合器，它们会允许你查看完整内容。它们使用 referer 来检查这一点。有时我们必须伪造此标头以获取内容提取。\n\n列表以此类推……你可以在这里找到完整的标头列表³\n\
    服务器响应的消息如下所示：\n\n# HTTP 响应\n\n```\nHTTP/1.1 200 OK\nServer: nginx/1.4.6 (Ubuntu)\n\
    Content-Type: text/html; charset=utf-8\n<!DOCTYPE html>\n<head>\n  <meta charset=\"\
    utf-8\" />\n  .. [HTML 代码]\n```\n```\n\n在第一行，我们获得了一条新信息，HTTP 代码 200 OK。这意味着请求成功了。至于请求标头，有很多\
    \ HTTP 代码，分为四类常见的：\n\n> ³https://en.wikipedia.org/wiki/List_of_HTTP_header_fields\n\
    \n- 2XX : 成功、理解并被接受的请求\n- 3XX : 这类状态码需要客户端采取操作以满足请求（通常请求新的 URL，位于响应标头的 Location\
    \ 中）\n- 4XX : 客户端错误：400 Bad Request 是由于请求中的语法不正确，403 Forbidden 服务器拒绝执行请求，404 Not\
    \ Found 是最著名的 HTTP 代码，服务器未找到请求的资源。\n- 5XX : 服务器错误\n\n然后，如果你使用网络浏览器发送此 HTTP 请求，浏览器将解析\
    \ HTML 代码，获取所有的最终资源（Javascript 文件、CSS 文件、图像...），并将结果渲染到主窗口。\n\n# HTML 和文档对象模型\
    \ (DOM)\n\n我假设你已经了解 HTML 了，所以这只是一个小的提醒。\n\n- 超文本标记语言 (HTML) 用于为原始内容添加“意义”。\n-\
    \ 级联样式表 (CSS) 用于格式化这些标记后的内容。\n- Javascript 让这些内容具有交互性。\n\n正如你所知道的，网页是一个包含标签内文本的文档，这些标签通过描述标题、段落、列表、链接等元素来为文档添加意义。让我们来看一个基础的\
    \ HTML 页面，以理解什么是文档对象模型。\n\n# Web 基础\n\n# HTML 页面\n\n```html\n<!doctype html>\n\
    <html>\n<head>\n  <meta charset=\"utf-8\">\n  <title>DOM 是什么？</title>\n</head>\n\
    <body>\n  <h1>DOM 101 太棒极了！</h1>\n  <p>网络爬虫是我的 <a href=\"https://ksah.in\">博客</a></p>\n\
    </body>\n</html>\n```\n\n这段 HTML 代码基本上是封装在其他 HTML 内容内部的 HTML 内容。HTML 的层级结构可以通过\
    \ HTML 代码中的缩进视为一棵树。当你的网络浏览器解析此代码时，它会创建一个树，它是 HTML 文档的对象的表示。它被称为文档对象模型（DOM）。下面是\
