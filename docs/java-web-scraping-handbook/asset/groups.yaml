    # # Captcha solving, PDF parsing, and OCR


    In this chapter we are going to see several things, that can block you from scraping
    websites / extracting information such as Captchas, data inside PDF and images.


    # ## Captcha solving


    **Completely Automated Public Turing test to tell Computers and Humans Apart**
    is what captcha stands for. Captchas are used to prevent bots/scripts from accessing
    and performing actions on website or applications. There are dozens of different
    captcha types, but you should have seen at least these two:'
- md: "\n## Captcha solving, PDF parsing, and OCR\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_81_0.png)\n\
