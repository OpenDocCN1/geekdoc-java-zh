    \ Javascript 前端发出的 API 调用并重现它们。\n\n# Javascript 入门 (101)\n\nJavascript 是一种解释型脚本语言。它正被越来越多地用于构建“Web\
    \ 应用”和“单页应用”。本章的目的不是教你 Javascript，而是我想让你理解它是如何在 Web 上被使用的。Javascript 的语法类似于 C\
