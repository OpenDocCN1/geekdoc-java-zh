  - '[PAGE 17]


    # Web fundamentals


    The Document Object Model provides a programmatic way (API) to add, remove, modify,
    or attach any event to a HTML document using Javascript. The Node object has many
    interesting properties and methods to do this, :


    +   - Node.childNodes returns a list of all the children for this node.

    - Node.Type returns an unsigned short representing the type of the node (1 for
    ELEMENT_NODE, 3 for TEXT_NODE ...).

    - Node.appendChild adds the child node argument to the last child of the current
    node.

    - Node.removeChild removes the child node argument from the current node.


    You can see the full list here. Now let''s write some Javascript code to understand
    all of this :


    First let''s see how many child nodes our <head> element has, and show the list.
    To do so, we will write some Javascript code inside the Chrome console. The document
    object in Javascript is the owner of all other objects in the web page (including
    every DOM nodes).

    Want to make sure that we have two child nodes for our head element. It''s simple
    :


    How many child nodes?


    ```

    document.head.childNodes.length

    ```


    And then show the list :


