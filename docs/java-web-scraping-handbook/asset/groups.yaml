- md: "\nWeb fundamentals 18\n\nlater. The good thing about a headless browser is\
    \ that it can take care of lots of things: Parsing the HTML, dealing with authentication\
    \ cookies, fill in forms, execute Javascript functions, access iFrames... The\
    \ drawback is that there is of course some overhead compared to using a plain\
    \ HTTP library and a parsing library.\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_21_0.png)\n\
    \nIn the next three sections we will see how to select and extract data inside\
    \ HTML pages, with XPath, CSS selectors and regular expressions.\n\n## XPath\n\
    \nXPath is a technology that uses path expressions to select nodes or nodesets\
    \ in an XML document (or HTML document). As with the Document Object Model, XPath\
    \ is a W3C standard since 1999. Even if XPath is not a programming language in\
    \ itself, it allows you to write expression that can access directly to a specific\
    \ node, or a specific node set, without having to go through the entire HTML tree\
    \ (or XML tree).\n\nEntire books has been written on XPath, and as I said before\
    \ I don't have the pretension to explain everything in depth, this is an introduction\
    \ to XPath and we will see through real examples how you can use it for your web\
    \ scraping needs.\n\nWe will use the following HTML document for the examples\
    \ below:\n\n## HTML example\n\n```html\n<!doctype html>\n<html>\n<head>\n  <meta\
    \ charset=\"utf-8\">\n  <title>XPath 101</title>\n</head>\n<body>\n  <div class=\"\
    product\">\n    <header>\n      <hgroup>\n        <h1>Amazing product #1</h1>\n\
    \        <h3>The best product ever made</h3>\n      </hgroup>\n    </header>\n\
    \    <figure>\n      <img src=\"http://lorempixel.com/400/200\">\n    </figure>\n\
    \    <section>\n      <p>Text text</p>\n      <details>\n        <summary>Product\
    \ Features</summary>\n        <ul>\n        <li>Feature 1</li>\n        <li class=\"\
    best-feature\">Feature 2</li>\n        <li id=\"best-id\">Feature 3</li>\n   \
    \     </ul>\n      </details>\n      <button>Buy Now</button>\n    </section>\n\
    \  </div>\n</body>\n</html>\n```\n\nFirst let's look at some XPath vocabulary:\n\
    \n- In XPath terminology, as with HTML, there are different types of nodes: root\
    \ nodes, element nodes, attribute nodes, and so called atomic values which is\
    \ a synonym for text nodes in an HTML document.\n- Each element node have one\
    \ parent. in this example, the section element is the parent of p, details and\
    \ button.\n- Element nodes can have any number of children. In our example, li\
    \ elements are all children of the ul element.\n- Siblings are nodes that have\
    \ the same parents. p, details and button siblings.\n- Ancestors a node's parent\
    \ and parent's parent...\n- Descendants a node's children and children's children...\n\
    \n## XPath Syntax\n\nThere are different types of expressions to select a node\
    \ in an HTML document, here are the most important ones:\n\n| XPath Expression\
    \ | Description |\n|---|---|\n| nodename | This is the simplest one, it select\
    \ all nodes with this nodename |\n| / | Selects from the root node (useful for\
    \ writing absolute path) |\n| // | Selects nodes from the current node that matches\
    \ |\n| . | Selects the current node |\n| .. | Selects the current node's parent\
    \ |\n\n## Web fundamentals\n\n| Expression | Description |\n|---|---|\n| @ | Selects\
    \ attribute |\n| * | Matches any node |\n| //@ | Matches any attribute node |\n\
    \nYou can also use predicates to find a node that contains a specific value. Predicate\
    \ are always in square brackets: [predicate] Here are some examples:\n\n| Expression\
    \ | Description |\n|---|---|\n| //li[last()] | Selects the last li element |\n\
    | //div[@class='product'] | Selects all div elements that have the class attribute\
    \ with the product value. |\n| //li[3] | Selects the third li element (the index\
    \ starts at 1) |\n| //div[@class='product'] | Selects all div elements that have\
    \ the class attribute with the product value. |\n\nNow we will see some example\
    \ of XPath expressions. We can test XPath expressions inside Chrome Dev tools,\
    \ so it is time to fire up Chrome. To do so, right click on the web page -> inspect\
    \ and then cmd + f on a Mac or ctrl + f on other systems, you can enter an XPath\
    \ expression, and the match will be highlighted in the Dev tool.\n\n## Amazing\
    \ product #1\n\nThe best product ever made\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_25_0.png)\n\
    \nText text text\n\n- Product Features\n- Feature 1\n- Feature 2\n- Feature 3\n\
    \nBuy Now\n\n```html\n<head>...</head>\n<body>\n  <div class=\"product\">\n  \
    \  <header>...</header>\n    <figure>\n      <img src=\"http://lorempxel.com/400/200\"\
    >\n    </figure>\n    <section>\n      <p>Text text</p>\n      <details>\n   \
    \     <summary>Product Features</summary>\n        <ul>\n          <li>Feature\
    \ 1</li>\n          <li>Feature 2</li>\n          <li>Feature 3</li>\n       \
    \ </ul>\n      </details>\n    </section>\n  </div>\n  <button>Buy Now</button>\n\
    </body>\n</html>\ndiv.product section ul\n```\n\n## Web fundamentals\n\nIn the\
    \ dev tools, you can right click on any node, and show its full XPath expression,\
    \ that can later. There is a lot that we could discuss about XPath, but is out\
    \ of this book's scope, I suggest you to read this W3Schools tutorial if you want\
    \ to learn more. In the next chapter we will see how to use XPath inside.\n\n\
    ## Regular Expression\n\nA regular expression (RE, or Regex) is a search pattern\
    \ for strings. With regex, you can search for a particular character/word inside\
    \ a bigger body of text. You can also identify all phone numbers inside a web\
    \ page. The pattern used by regex is applied from left to right. Each character\
    \ is used once. For example, this regex will match the string because there is\
    \ only one distinct. Here are some common symbols, quantifiers and meta-characters:\n\
    \n| Regex | Description |\n|---|---|\n| Hello World | Matches any character |\n\
    | [a-h] | Matches any character between a and h. |\n| [1-5] | Matches any digit\
    \ between 1 and 5. |\n| [^xyz] | Negation of the pattern, matches any character\
    \ except x or y or z |\n| ^ | Matches zero or more of the preceding |\n| + | Matches\
    \ one or more of the preceding |\n\n> https://www.w3schools.com/xpath_intro\n\n\
    ## Web fundamentals\n\n| Regex | Description |\n|---|---|\n| ? | Matches zero\
    \ or one of the preceding |\n| [x] | Matches exactly x of the preceding |\n| \\\
    d | Matches any digit |\n| \\D | Matches any non digit |\n| \\s | Matches any\
    \ character |\n| \\S | Matches any non-whitespace character |\n| (expression |\
    \ Capture the group inside parenthesis |\n\nYou may be wondering why it is important\
    \ to know about regular expressions when doing scraping? We saw before that we\
    \ could select HTML nodes with the DOM, so why we need regular expressions? In\
    \ an ideal world, data is easily readable, the information is embedded inside\
    \ relevant HTML element with meaningful attributes. But the real world is messy,\
    \ you will often find huge amounts of text inside p element. When you want to\
    \ extract specific data inside huge text, for example a price, a date, a name...\
    \ you will have to use regular expressions.\n\nFor example, regular expression\
    \ can be useful when you have this kind of data:\n\n```html\n<p>Price : 19.99</p>\n\
    ```\n\nWe could select this node with an XPath expression, and then use this kind\
    \ of regex to extract the price:\n\n```regex\n^Price\\s:\\d+\\.\\d{2}$\n```\n\n\
    This was a short introduction to the wonderful world of regular expressions, you\
    \ should now be able to understand this:\n\n> https://en.wikipedia.org/wiki/Semantic_Web\n\
    \n## Web fundamentals\n\n```regex\n(?::[a-z0-9\\$%&+\\/=?^_`{}~]|+(::[a-z0-9\\\
    $%&+\\/=?^_`{}~])*)*/(?::[\\x01]\\n\\x08\\x09\\x0b\\x0e\\x1f\\x21\\x23-\\x25b\\\
    x5d-\\x7f]|[\\x01-\\x09\\x0b\\x0e\\x-\\x7f])*@)(?:?(?::[a-z0-9])?(?::[a-z0-9])?(?::[a-z0-9])?(?::[a-z0-9])*\\\
    [a-z0-9])?|\\[\\?:?(?:25[0-5]|2[0-4][0-9]|1?[0-9][0-9]?[0-9])(?:[01]?[0-9]))\\\
    ){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9][0-9]?[0-9])(?:[01]?[0-9])?)?(?::[a-z0-9])*(?::\\\
    [[\\x01-\\x08\\x0b\\x0c\\x0e-\\x1f\\x21-\\x23\\x53-\\x7f])\\[[\\x01-\\x09\\x0b\\\
    x0c\\x0e-\\x7f])+\\\\])\n```\n\nI am kidding :) This tries to validate an email\
    \ address, according to RFC 2822. There is a lot to learn about regular expressions,\
    \ you can find more information in this great Princeton tutorial:\n\n> If you\
    \ want to improve your regex skills or experiment, I suggest you to use this website:\
    \ Regex101.com. This website is really interesting because it allows you not only\
    \ to test your regular expressions, but explains each step of the process.\n"
  mdcn: "\n\nWeb 基础 18\n\n稍后。无头浏览器的好处是它可以处理很多事情：解析 HTML、处理身份 Cookie、填充表单、执行 JavaScript\
    \ 函数、访问 iFrame……它的缺点是与使用纯 HTTP 库和解析库相比，它会有一些开销。\n\n![](img/cbd5c820756a64b88207a1ea9f1c877b_21_0.png)\n\
    \n在接下来的三个章节中，我们将学习如何使用 XPath、CSS 选择器和正则表达式来选择并提取 HTML 内部的数据。\n\n## XPath\n\nXPath\
    \ 是一种使用路径表达式来选择 XML 文档（或 HTML 文档）中节点或节点集的技术。与文档对象模型（DOM）一样，XPath 自 1999 年以来一直是\
    \ W3C 标准。即使 XPath 本身不是一种编程语言，它允许你编写表达式来直接访问特定节点或特定节点集，而无需遍历整个 HTML 树（或 XML 树）。\n\
    \n关于 XPath 有整整的书籍介绍，正如我之前提到的，我并不打算深入浅解释所有内容，这只是 XPath 的介绍，我们将通过真实示例看到如何将其用于你的网络爬虫需求。\n\
    \n我们将使用以下 HTML 文档作为后续示例：\n\n## HTML 示例\n\n```html\n<!doctype html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>XPath 101</title>\n</head>\n<body>\n  <div\
    \ class=\"product\">\n    <header>\n      <hgroup>\n        <h1>Amazing product\
    \ #1</h1>\n        <h3>The best product ever made</h3>\n      </hgroup>\n    </header>\n\
    \    <figure>\n      <img src=\"http://lorempixel.com/400/200\">\n    </figure>\n\
    \    <section>\n      <p>Text text</p>\n      <details>\n        <summary>Product\
    \ Features</summary>\n        <ul>\n        <li>Feature 1</li>\n        <li class=\"\
    best-feature\">Feature 2</li>\n        <li id=\"best-id\">Feature 3</li>\n   \
    \     </ul>\n      </details>\n      <button>Buy Now</button>\n    </section>\n\
    \  </div>\n</body>\n</html>\n```\n\n首先让我们来看一些 XPath 词汇：\n\n- 在 XPath 术语中，与 HTML\
    \ 一样，有不同类型的节点：根节点、元素节点、属性节点以及所谓的原子值（它是 HTML 文档中文本节点的同义词）。\n- 每个元素节点有一个父节点。在这个示例中，`section`\
    \ 元素是 `p`、`details` 和 `button` 的父节点。\n- 元素节点可以有任意数量的子节点。在我们的示例中，`li` 元素都是 `ul`\
    \ 元素的子。\n- 兄弟节点是具有相同父节点的节点。`p`、`details` 和 `button` 就是兄弟节点。\n- 祖先是节点的父以及父节点的父节点……\n\
    - 后代是节点的子及其子节点……\n\n## XPath 语法\n\n有不同类型的表达式来选择 HTML 文档中的节点，这里是最重要的几个：\n\n| XPath\
    \ 表达式 | 说明 |\n|---|---|\n| nodename | 这是最简单的，它选择所有具有该节点名的节点 |\n| / | 从根节点开始选择（用于编写绝对路径）\
    \ |\n| // | 从当前节点开始选择匹配项的节点 |\n| . | 选择当前节点 |\n| .. | 选择当前节点的父节点 |\n\n## Web 基础\n\
    \n| 表达式 | 说明 |\n|---|---|\n| @ | 选择属性 |\n| * | 匹配任何节点 |\n| //@ | 匹配任何属性节点 |\n\n\
    你也可以使用谓词来查找包含特定值的节点。谓词始终位于方括号中：[predicate]。这里是一些示例：\n\n| 表达式 | 说明 |\n|---|---|\n\
    | //li[last()] | 选择最后一个 li 元素 |\n| //div[@class='product'] | 选择所有 class 为 product\
    \ 的 div 元素 |\n| //li[3] | 选择第三个 li 元素（索引从 1 开始） |\n| //div[@class='product'] |\
    \ 选择所有 class 为 product 的 div 元素 |\n\n现在我们将看到一些 XPath 表达式的示例。我们可以在 Chrome 开发者工具中测试\
    \ XPath 表达式，所以是时候启动 Chrome 了。方法是：右键点击网页 -> 检查，然后在 Mac 上使用 cmd + f 或在其他系统上使用 ctrl\
    \ + f，你可以输入 XPath 表达式，匹配将在开发者工具中高亮显示。\n\n## Amazing product #1\n\n有史以来制造的最好的产品\n\
    \n![](img/cbd5c820756a64b88207a1ea9f1c877b_25_0.png)\n\nText text text\n\n- Product\
    \ Features\n- Feature 1\n- Feature 2\n- Feature 3\n\nBuy Now\n\n```html\n<head>...</head>\n\
    <body>\n  <div class=\"product\">\n    <header>...</header>\n    <figure>\n  \
    \    <img src=\"http://lorempxel.com/400/200\">\n    </figure>\n    <section>\n\
    \      <p>Text text</p>\n      <details>\n        <summary>Product Features</summary>\n\
    \        <ul>\n          <li>Feature 1</li>\n          <li>Feature 2</li>\n  \
    \        <li>Feature 3</li>\n        </ul>\n      </details>\n      <button>Buy\
    \ Now</button>\n    </section>\n  </div>\n</body>\n</html>\n```\n\nWeb 基础\n\n\
