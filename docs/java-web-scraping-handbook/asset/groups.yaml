    # Handling forms


    This cookie is often named (the name depends on the technology/framework

    used by the website’s backend):


    +   * session_id

    * session

    * JSESSION_ID

    * PHPSESSID


    This cookie will be sent for each subsequent requests by the browser, and the

    website’s backend will check its presence and validity to authorize requests.

    Cookies are not only used for login, but for lots of different use cases:


    +   * Shopping carts

    * User preferences

    * Tracking user behavior


    Cookies are small key/value pairs stored in the browser, or in an HTTP client,

    that looks like this:


    ```

    cookie_name=cookie_value

    ```


    An HTTP response that sets a cookie looks like this:


    # Http response


    ```

    HTTP/1.0 200 OK

    Content-type: text/html

    Set-Cookie: cookie_name=cookie_value

    ```


    An HTTP request with a cookie looks like this:'
  - '[PAGE 44]


    # Handling forms


    Http request


    ```

    GET /sample_page.html HTTP/1.1

    Host: www.example.org

    Cookie: cookie_name=cookie_value

    ```


    A cookie can have different attributes :


    +   - Expires: Expiration date, by default, cookies expire when the client closes
    the connection.

    - Secure: only sent to HTTPS URLs

    - HttpOnly: Inaccessible to Javascript Document.cookie, to prevent session hijacking
    and XSS attack²¹

    - Domain: Specifies which host is allowed to receive the cookie


