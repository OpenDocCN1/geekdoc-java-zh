    # Dealing with Javascript


    Here are some tips when working with JS rendered web pages:


    +   - Try to find the hidden API using the network pane in Chrome Dev Tools

    - Try to disable Javascript in your web browser, some websites switch to a server-side
    rendering in this case.

    - Look for a mobile version of the target website, the UI is generally easier
    to scrape. You can check this using your own phone. If it works without redirecting
    to a mobile URL (like https://m.example.com or https://mobile.example.com) try
    to spoof the “User-Agent” request header in your request

    - If the UI is tough to scrape, with lots of edge cases, look for Javascript variable
    in the code, and access the data directly using the Selenium Javascript Executor
    to evaluate this variable, as we saw earlier.'
