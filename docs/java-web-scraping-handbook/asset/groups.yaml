    \ fileInput = uploadFileForm.getInputByName(\"user_file\");\n\nfileInput.setValue(fileName);\n\
    fileInput.setContentType(\"image/png\");\n\nHtmlElement button = page.getByXPath(\"\
    //button\");\npage = button.click();\n\nif(page.asText().contains(\"Your file\
    \ was successful uploaded\")) {\n    System.out.println(\"File successfully uploaded\"\
    );\n}else{\n    System.out.println(\"Error uploading the file\");\n}\n```\n\n\
