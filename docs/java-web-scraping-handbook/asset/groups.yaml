    ```\n\n## Proxies\nThe easiest solution to hide our scrapers is to use proxies.\
    \ In combination with random-agent, using a proxy is a powerful method to hide\
    \ our scrapers, and scrape rate-limited web pages. Of course it’s better not be\
    \ blocked in the first place, but sometimes websites allow only a certain amount\
    \ of request day/hour. In these cases, you should use a proxy. There are lots\
    \ of free proxy list I don’t recommend using these because they are often slow,\
    \ unreliable, and websites offering these lists are not always transparent about\
    \ where proxies are located. Sometimes the public proxy list is operated by a\
    \ legit company, offering premium proxies, and sometimes not... What I recommend\
    \ is using a paid proxy service, or you could build your own. Setting a proxy\
    \ to HttpClient is easy:\n\n```\nConfig proxyConfig = new ProxyConfig(\"host\"\
    , myPort);\nclient.getOptions().setProxyConfig(proxyConfig);\n```\n\nHttpClient\
    \ is a great open source API, allowing you to build a proxy API on top of different\
    \ cloud providers. HttpClient creates a proxy pool by creating instances on various\
