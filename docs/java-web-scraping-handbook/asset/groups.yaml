    # Stay under cover


    In this chapter, we are going to see how to make our bots look like Humans. For
    various reasons, there are sometimes anti-bot mechanisms implemented on websites.
    The most obvious reason to protect sites from bots is to prevent heavy automated
    traffic to impact a website’s performance. Another reason is to stop bad behavior
    from bots like spam.


    There are various protection mechanisms. Sometimes your bot will be blocked if
    it does too many requests per second / hour / day. Sometimes there is a rate limit
    on how many requests per IP address. The most difficult protection is when there
    is a user behavior analysis. For example, the website could analyze the time between
    requests, if the same IP is making requests concurrently.


    You won’t necessarily need all the advice in this chapter, but it might help you
    in case your bot is not working, or things don’t work in your Java code the same
    as it works with a real browser.


    # Headers


    In Chapter 3 we introduced HTTP headers. Your browser includes systematically
    6-7 headers, as you can see by inspecting a request in your browser network inspector:'
