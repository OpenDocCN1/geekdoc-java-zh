    # Dealing with Javascript


    Dealing with a website that uses lots of Javascript to render their content can
    be tricky. These days, more and more sites are using frameworks like Angular,
    React, Vue.js for their frontend. These frontend frameworks are complicated to
    deal with because there are often using the newest features of the HTML5 API,
    and HtmlUnit other headless browsers do not totally support these features.


    So basically the problem that you will encounter is that your headless browser
    will download the HTML code, and the Javascript code, but will not be able to
    execute the full Javascript code, and the webpage will not be totally rendered.


    There are some solutions to these problems. The first one is to use a better headless
    browser. And the second one is to inspect the API calls that are made by the Javascript
    frontend and to reproduce them.


    # Javascript 101


    Javascript is an interpreted scripting language. It’s more and more used to build
    “Web applications” and “Single Page Applications”.


    The goal of this chapter is not to teach you Javascript, to be honest, I’m a terrible
    Javascript developer, but I want you to understand how it is used on the web,
    with some examples.


    The Javascript syntax is similar to C or Java, supporting common data types, like
    Boolean, Number, String, Arrays, Object... Javascript is loosely typed, meaning
    there is no need to declare the data type explicitly.


    Here is some code examples:'
