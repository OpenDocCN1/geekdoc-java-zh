    \ autoLogin on \" + loginUrl);\n        WebClient client = autoLogin(loginUrl,\
    \ login, password);\n        HtmlPage page = client.getPage(baseUrl);\n\n    \
    \    HtmlAnchor logoutLink = page.getByXPath(String.format(\"//a[href='logout?id=%s']\"\
    , login));\n\n        if(logoutLink != null) {\n            System.out.println(\"\
    Successfully logged in!\");\n            // printing the cookies\n           \
    \ for(Cookie cookie : client.getCookieManager().getCookies()) {\n            \
    \    System.out.println(cookie.toString());\n            }\n        }else{\n \
    \           System.err.println(\"Wrong credentials\");\n        }\n    } catch\
    \ (Exception e) {\n        e.printStackTrace();\n    }\n}\n```\n\n# Go further\n\
