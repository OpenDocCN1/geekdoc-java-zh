    Stay under cover


    TOR, also known as The Onion Router⁵³ is a world-wide computer network designed
    to route traffic through many different servers to hide its origin. TOR usage
    makes network surveillance very difficult. There are a lot of use cases for TOR
    usage, such as privacy, freedom of speech, journalists in dicta-


    ![](img/cbd5c820756a64b88207a1ea9f1c877b_102_0.png)


    https://www.torproject.org/


    torship regime, and of course, illegal activities.


    In the context of web scraping, TOR can hide your IP address, and change your
    bot''s IP address every 10 minutes. The TOR exit nodes IP addresses are public.
    Some websites block TOR traffic using a simple rule: if the server receives a
    request from one of TOR public exit node, it will block it. That''s why in many
    cases, TOR won''t help you, compared to classic proxies.


    Using TOR is really easy, go to the download page, or using your package manager,
    on macOS:


    ```

    brew install tor

    ```


    Then you have to launch to TOR daemon, and set the proxy config for the WebClient


    > ⁵³https://www.torproject.org/'
