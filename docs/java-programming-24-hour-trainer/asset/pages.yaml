  md: '# 10

    Introduction to Java Applets


    Java was born in 1995, shortly after the Internet became available to the public.
    The Netscape web browser enabled regular people to go online and download content
    from remote servers. This content was mainly some formatted text mixed with static
    images. But the Java programming-language provided a way to incorporate downloadable
    applications into the web pages!


    A programmer needed to write a Java application called an applet in a special
    way using GUI classes from the java.awt package (Swing was not invented yet).
    Applets were deployed on the web servers along with the HTML files that included
    references to the applets. Web browsers understand HTML, the markup that consists
    of special tags placed in text files so web browsers can properly format and lay
    out web pages. HTML has a special tag, <applet>, tells the browser where to find
    and how to size and align a Java applet.


    You can download a Java applet to your computer from the Internet as part of a
    web page, and web browsers use the JVM plug-in to run applets. The version of
    JVM included with a web browser is very important, because if you''re using, say,
    Java Swing classes, but the user''s web browser has a old JVM, the browser won''t
    even know how to run the code that your applet uses.


    In this lesson you''ll learn the basics of applet creation and the applet''s life
    cycle. In Lesson 11 you''ll build a tic-tac-toe game and deploy it on the web
    server so other people can enjoy it.


    # AN UNOFFICIAL HISTORY OF JAVA APPLE


    Fifteen years ago Netscape''s market share was over 90 percent, but the situation
    changed when Microsoft introduced Internet Explorer. In 1998 there was an infamous
    lawsuit between Microsoft and Microsystems — the former started quietly introducing
    its own class library to Java, breaking the write-once-run-anywhere principle
    of Sun. Sun won that lawsuit. But as the saying goes, it won the battle but lost
    the war.


    Microsoft stopping the current version of JVM with Internet Explorer. I''m not
    blaming them for this, but it hurt applets'' popularity — the end user couldn''t
    just open a web page'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'to see an applet that required, say JVM version 1.3. The user would need to
    first download the proper version of JVM, and then only the applets that were
    written for JVM 1.3 would work. The process of downloading the JVM plug-in was
    a multi-step process.


    Sun Microsystems showed lack of competence on the client side, specifically in
    the area of integration of JVM over browsers, and Adobe Flash Player, which is
    also a virtual machine) dominates in this area.


    High penetration of the run-time environment and the ability to upgrade it easily
    for any web-based technology. Adobe Flash shines in this area. Flash Player is
    a virtual machine with a small memory footprint (1.5 Mb), and its installation
    takes less than 20 seconds after one click. For years the JVM plug-in was about
    16 Mb, and installation was complicated for a non-programmer — it''s a lot smaller


    This situation changed after the release of Java 6 update 10, which includes the
    so-called next-generation Java plug. Now applets don''t run in the JVM packages
    with the web browser, but in a separate JVM launched by the Java plug-in. The
    applet still appears in the browser''s window, but now it doesn''t depend on the
    willingness of the browser vendor to include the latest plug-in. You can read
    more about this next-generation Java plug-in at http://jdk6.java.net/plugin/2.


    To control the settings of this plug-in in Microsoft Windows, the Java Control
    Panel — select Start Control Panel Open The Advanced tab find the item Java Plug-in
    where the Next-generation Java Plug-in should be selected by default.


    If you run-installed MAC OS X 10.6 or above, find out what Java plug-ins are installed
    by Apple computers follow the instructions at http://blogs.sun.com/thejavatutorials/entry/enabling_the_next_generation_java.


    The other major change introduced in the next-generation Java plug-in is the ability
    to launch Java applets directly from JNLP (Java Network Launch Protocol) files,
    in which the previous releases were used only in Java Web Start technology, which
    allowed local deployment of the applications over the network. As of Java 10.6.10
    you can use the JNLP meta-descriptors to launch applets too. JNLP support is described
    in detail at www.oracle.com/technwork/java/javase/index-142266.html.


    What''s the next step in applets''? You''ll be creating a UI for web-based applications
    with a relatively new language called JavaFX, which will be demonstrated in Lesson
    37.


    # RESTRICTIONS OF JAVA APPLETS


    People browse the Internet without knowing if web pages contain Java applets or
    not, they want to be sure that the files located in their computers will not be
    harmed by some bad guys who have added a nasty applet to a page. Unsigned applets
    are the ones that haven''t gone through a special signing process to obtain a
    security certificate indicating that they come from a trusted source.'
  merge: -1
  pgno: 139
- img_proc: true
  md: "Unsigned (aka untrusted) Java applets operate inside a so-called security sandbox\
    \ and have the following main restrictions:\n\n+   - They can't access local files\
    \ on your disk.\n- They can connect only to the computer they were downloaded\
    \ from.\n- They can't start any other programs located in your computer.\n\nApplets\
    \ can be signed by VerSign or Thaw and operate outside the security sandbox and\
    \ be unrestricted in their ability to access the user's computer if the user accepts\
    \ the applet's security. A signed applet will run outside the security sandbox.\
    \ If the user refuses to accept the certificate, the applet will run within the\
    \ security sandbox as unsigned.\n\nTo run an applet you'll need a Java class written\
    \ in a special way, an HTML text file that contains the tag `<applet>` pointing\
    \ to this class, and a web browser that supports Java. You can also test applets\
    \ in Eclipse or using a special program called appletviewer. But before learning\
    \ how to create applets, spend 15 minutes to get familiar with some HTML tags.\n\
    \n# LEARNING HTML ON THE RUN\n\nImagine that you've already written and compiled\
    \ the game applet class called TicTacToe. The file that includes the proper references\
    \ to TicTacToe.class must be deployed on the web servers along with the HTML wrapper\
    \ — the file that defines a set of tags placed in angle brackets that can be inserted\
    \ in a text file with any plain text editor, such as Notepad, TextEdit, or the\
    \ editor that comes with Eclipse (select File ➔ New New File). In this section\
    \ I'll show you a minimum of HTML tags to get you going with applets, but you\
    \ can find a complete HTML tutorial at www.w3schools.com/html/html_primary.asp.\n\
    \nLet's start with creating the text file called TicTacToe.html. HTML files have\
    \ names that end with .html or .htm. Inside they have two sections: header and\
    \ body. HTML tags are placed inside angle brackets and most of them have the matching\
    \ closing tags that start with a forward slash, for example `<head>` and `</head>`.\
    \ The content of the very basic HTML file TicTacToe.html is shown in 10-1.\n\n\
    # LISTING 10-1: The basic HTML file\n\n```\n<html>\n<head>\n<title>My First Web\
    \ Page</title>\n</head>\n<body>\n  My Tic-Tac-Toe game is coming...\n</body>\n\
    </html>\n```"
