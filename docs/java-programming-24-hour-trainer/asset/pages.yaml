    this class through the Javadoc utility it will generate HTML output that can be
    opened by any web browser. It''s a good practice to include Javadoc comments in
    your classes.


    Javadoc acts as a processor that extracts from the source code all block comments
    that start with /** and end with /. It formats this text using HTML tags and embedded
    annotations to generate program documentation. The preceding text is an example
    of the use of specific tags that are predefined, and understood by Javadoc. This
    was an example of metadata that are understood by just one utility — Javadoc.


    But Java allows you to declare your custom annotations and define your own processing
    rules that will route the execution of your program and produce configuration
    files, additional code, deployment descriptors, and more. No matter what your
    goals, when you need to create or use an annotation processor to get the expected
    output.


    Starting in Lesson 27 you''ll learn about annotations defined by the creators
    of Java EE technologies. In this lesson you''ll get familiar with Java SE annotations,
    which you will eventually use in your projects.


    # JAVA ANNOTATIONS BASICS


    The Java annotation enables you to add custom annotations anywhere in your code,
    not just in the comments section. You can apply custom annotations to a class,
    a method, or a variable — just specify targets how the annotation is being defined.
    Java annotations start with @ and may contain one or more parameters. Some of
    the annotations are built into Java SE and are used but most of them are consumed
    by some kind of processing program or tool.


    There are about a dozen of predefined annotations already included in Java SE.
    You can find them, along with their supporting classes, in the packages java.lang,
    java.lang, java.annotation. You can check the Annotations section of the latest
    online documentation on the Java SE API, which at the time of this writing is
    located at http://download.oracle.com/java/7/docs/api/overview-summary.html.


    Some of these annotations are used by the compiler (@Override, @SuppressWarning,
    @Deprecated, @Retention, @Target, @Documented, and @Inherited); some are used
    by the Java run or third-party runtime and indicates that have to be invoked in
    a certain order (@PostConstruct, @PreDestroy), or mark code that was generated
    by third-party tools (@Generated). I''m not giving you a detailed description
    of how to use each of these annotations, but I will give you selected examples
    that will help you get started with annotations.'
