    \ a message: \" + e.getMessage());\n    }\n}\n\n```\n\nIn this code sample the\
    \ onMessage() method checks to ensure that the arrived message is of the TextMessage\
    \ type. All other types of messages can be ignored.\n\nThe message acknowledgment\
    \ mode is defined when the Session object is created. The createSession() method\
    \ has two arguments. If the first argument is true, the session is transacted,\
    \ the value of the second argument is irrelevant, and the message can be either\
    \ committed or rolled back by the consumer.\n\nIf the commit() method has been\
    \ called, the message is removed from the queue. The rollback() method leaves\
    \ the message in the queue. If the session is non-transacted, as in our earlier\
    \ example, the second argument defines the acknowledgement mode.\n\n+   * AUTO_ACKNOWLEDGE\
    \ mode sends the acknowledgment back as soon as the method onMessage() is successfully\
    \ finished.\n* CLIENT_ACKNOWLEDGE mode requires explicit acknowledgment, such\
    \ as msg.acknowledge(). (This grants permission to delete the message from the\
    \ queue).\n* DUP_OK_ACKNOWLEDGE mode is used in case the server fails; the same\
    \ message may be delivered more than once. In some cases it's acceptable — for\
    \ example, receiving a price quote twice won't hurt."
