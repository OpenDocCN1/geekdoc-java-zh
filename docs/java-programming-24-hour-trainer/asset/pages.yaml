  md: "# LESSON 29 DEVELOPING WEB APPLICATIONS WITH JSF\n\nThe namespace component\
    \ (see xmlns in the code) comes from XML. You can use any prefix instead of ui,\
    \ but it should uniquely identify the location of the components referred to by\
    \ the prefix. Names are defined in the top portion of the template in Listing\
    \ 29-2. You can have more than one namespace defined in your JSF page. The h prefix\
    \ is typically used for HTML JSF components, and f for the cores:\n\n```\nxmlns:ui=\"\
    http://java.sun.com/jsf/facelets\nxmlns:h=\"http://java.sun.com/jsf/html\nxmlns:f=\"\
    http://java.sun.com/jsf/core\"\n```\n\nI'll make a slight text edit to the order\
    \ to have the header and the footer displayed in a large font — note the HTML\
    \ tag:\n\n```\n<!DOCTYPE PUBLIC \"-//W3C//DTD HTML 1.0 Transitional//EN\"\n  \
    \   \"http://www.w3.org/TR/xhtml/DTD/xhtml-transitional.dtd\">\n<html xmlns=\"\
    http://www.w3.org/1999/xhtml\"\n     xmlns:ui=\"http://java.sun.com/jsf/facelets\"\
    >\n<head>\n  <title><ui:insert name=\"title\">Student Portal</ui:insert></title>\n\
    </head>\n<body>\n  <div id=\"header\">\n    <ui:insert name=\"header\">\n    \
