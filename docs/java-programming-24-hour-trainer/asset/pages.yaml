  md: 'The preceding code snippet two Insert statements have to be executed as one
    transaction, and if any of them fail, an exception will be thrown and the method
    rollback() will undo all the changes, including those that succeeded.


    # CONNECTION POOLS AND DATASOURCES


    Up until now you''ve been running all sample Java programs on your own computer.
    But imagine a distributed application in which multiple clients make requests
    to the same server, which has to process their SQL queries. Because obtaining
    a connection to the database is a slow process, it would be very inefficient to
    start every SQL query by obtaining a database connection and disconnecting after
    the request is complete. Such applications should reuse the same opened connection
    for multiple requests.


    The package javax.sql includes the interface DataSource, which is an alternative
    to DriverManager. Vendors of JDBC drivers for servers implement this interface,
    and a DataSource is typically preconfigured for a certain number of connections
    (the connection pool). It is published in a directory using the JNDI interface.
    In such a setup, all clients'' requests will get their database connections from
    this DataSource object, eliminating the need to open and close a new connection
    for each request. I''ll provide an example of working with DataSource objects
    in Lesson 31 explaining how JNDI works.


