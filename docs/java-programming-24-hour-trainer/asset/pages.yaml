  md: '# TO GET OR NOT TO GET CERTIFIED?


    Any certification program is a business for the vendor that wants to sell training
    educate. Oracle is no exception: you can find various certification programs to
    rate your Java skills. The following website offers various certification programs
    in Java SE and EE technologies: http://education.oracle.com/pls/web_prod-plq-dad/db_pages.getpage?page_id=140#13.


    Although most certification programs require you to pass a multiple-choice computer
    test, some of them (such as for Java EE architects) will give you a challenging
    task to design and program.


    Overall it''s a good idea to prepare yourself and go through the certification
    process, because it will definitely improve your understanding of the Java language
    or a specific enterprise technology or framework. In some areas it may also improve
    the performance of your résumé. It will help you slip through screening tests
    that are used by job placement agencies. Check just job postings from your potential
    employers if they insist on having certificates.


    But I also want to caution you against overestimating the importance of getting
    Java certification. When I see a résumé with a list of certificates, it tells
    me that this candidate is good at passing multiple-choice tests. Having practical
    hands-on experience working on open-source or enterprise projects is a lot more
    valuable than any certificate you might have earned. If you have certificates—fine,
    but keep them somewhere at the end of your résumé rather than trying to present
    them as a major achievement.


    # TECHNICAL QUESTIONS AND ANSWERS


    Suggesting a list of technical questions for an interview is a risky business.ed
    Java developers have different views on what''s fair and what''s not fair to ask.
    But junior developers who completed a Java tutorial can easily benefit from some
    guidance in preparing for Java job interviews.


    The following are suggested technical interview questions and expected answers
    on various Java-related topics. The questions included in this section are those
    that I had to answer working on various projects. In no way is this a complete
    list of possible questions, but it will give you an idea of what to expect at
    an interview. Most of the answers these questions can be found in this book, but
    some will require additional research.


    +   Q: What''s the difference between an interface and an abstract class?


    +   A: An abstract class may contain code in method bodies, which is not allowed
    in an interface. With abstract classes you have to inherit your from the abstract
    class Java does not allow multiple inheritance. On the other hand, you can implement
    multiple interfaces in your class.


    +   Q: How do you deploy a web application in the application server that you
    currently use?


    +   A: In most EE application servers you create a web archive (war file) and
    copy it to the assigned directory per the application server documentation. (You
    should be able to explain the directory structure in a war file.)'
