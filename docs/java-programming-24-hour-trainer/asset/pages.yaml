    \ (aka node). Each element in a doubly linked list also contains a reference to\
    \ the previous element. These features of the doubly-linked list allow you to\
    \ create queues (FIFO), and stacks (last-in-first-out or LIFO).\n\nInsertion of\
    \ a new object inside the list comes down to a simple update of two references:\
