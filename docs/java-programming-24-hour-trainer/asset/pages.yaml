  md: "# A Brief Introduction to the Criteria API | 381\n\nThese are some core interfaces\
    \ in the Criteria API:\n\n+   - CriteriaBuilder: A utility class that can create\
    \ criteria queries.\n- CriteriaQuery: This is an object that will contain all\
    \ parts of the query, such as SELECT, FROM, and WHERE. It's like a memory graph,\
    \ in which each node represents some clause of the query.\n- Root: Represents\
    \ the root of the query.\n- TypedQuery: A query prepared for execution.\n- Join:\
    \ An object that prepares a JOIN clause.\n\nThe next code fragment shows an equivalent\
    \ of the JPQL query SELECT e FROM Employee AS e written using the Criteria API:\n\
    \nStart with using EntityManager to create CriteriaBuilder, which in turn creates\
    \ the instance of CriteriaQuery. Note that via generics, the CriteriaQuery is\
    \ typed based on the expected results. After you add instances of required objects\
    \ (SELECT, FROM, WHERE, and so on) to CriteriaQuery.\n\nFinally, the EntityManager\
    \ prepares the executable TypedQuery that produces strongly typed results by executing\
    \ getList(). If you expect just one record back, use the getSingleResult() method.\
    \ Adding a select(employee) to the query could look like\n\n```\ncrQuery.select(employee).where(...).orderBy(...);\n\
    ```\n\nBecause we are building the object graph, the order of the query in the\
    \ preceding line is not important. The Root object can serve as a starting point\
    \ for joining entities:\n\n```\nRoot<Employee> employee = crQuery.from(Employee.class);\n\
    Join<Employee, Address> emJoin = employee.join(...);\n```\n\nThe next example\
    \ shows how to ADD the LIKE clause to get all employees with the last name Thompson:\n\
    \n```\nRoot<Employee> employee = crQuery.from(Employee.class);\ncrQuery.select(employee).where(\n\
    \tlike(employee.get(\"lastName\"),\n\t\tb.parameter(String.class, \"name\"))\n\
    );\nTypedQuery<Employee> query = em.createQuery(crQuery);\ntquery.setParameter(\"\
    name\", \"%Thompson^%\");\nList<Employee> employees = query.getResultList();\n\
    ```"
