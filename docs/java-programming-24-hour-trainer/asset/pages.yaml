  md: "# LESSON 28 JAVASERVER PAGES\n\nThe plugin element ensures that your JSP includes\
    \ an applet or a Java bean (described later in the \"JavaBeans\" section). During\
    \ runtime the web browser replaces this tag with one of the HTML tags: `<jsp:plugin\
    \ type=object>` or `<embed>`.\n\n```\n<jsp:plugin type=applet code=\"PriceQuotes.class\"\
    >\n```\n\nThe nested tag `<jsp:param type=parameter>` is used to pass parameters\
    \ to an applet or a bean:\n\n```\n<jsp:plugin type=applet code=\"Login.class\"\
    >\n<jsp:params>\n  <jsp:param name=\"userID\" value=\"SCOTT\" />\n  <jsp:param\
    \ name=\"password\" value=\"TIGER\" />\n</jsp:params>\n</jsp:plugin>\n```\n\n\
    # ERROR PAGES\n\nLet's say we have a file `calcTax.jsp` containing code that may\
    \ throw Java exceptions. Instead of scary users with stack trace output screens,\
    \ prepare a `taxErrors.jsp` explaining the problem in plain English.\n\n`calcTax.jsp`\
    \ may have an HTML `<form>` where the user enters income and the number of deposits.\
    \ The request for tax calculations is sent to the server's CalcTax Java class,\
    \ which might throw an exception during its processing. Include the name of the\
    \ error page that has to be shown in case of exceptions:\n\n```\n<html>\n  Some\
    \ code to calculate tax and other HTML stuff goes here\n  <% page errorPage=taxErrors.jsp\
    \ %>\n</html>\n```\n\nNext comes the page `taxErrors.jsp`, which illustrates how\
    \ to use the JSP variable exception, which displays the error message in a user-friendly\
    \ way, and also contains more technical error description for the technical support\
    \ team:\n\n```\n<html>\n<body>\n  Unfortunately there was a problem during your\
    \ tax calculations. We are working on this issue - try again in 10 minutes.\n\
    \  If the problem persists, please contact our award winning technical support\
    \ team at (212) 555-2222 and provide them with the following information:\n  <br>\n\
    \  <%=exception.toString() %>\n</body>\n</html>\n```"
