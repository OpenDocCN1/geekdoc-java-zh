  md: "# Writing Applets Using Swing\n\n# LISTING 10-2: The basic HTML file\n\n```\n\
    <html>\n<body>\n  Here is my Tic-Tac-Toe game:\n  <applet code=\"TicTacoe.class\"\
    \ width=300 height=250 />\n</body>\n</html>\n```\n\nNow the screen looks different\
    \ — instead of seeing the tic-tac-toe game you will get an error message, in Figure\
    \ 10-2. No wonder: The web browser could not find TicTacoe.class, so it just shows\
    \ a rectangle of 300 pixels by 250 pixels. You'll fix this error by creating the\
    \ TicTacToe class a little later in this lesson.\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_142_0.png)\n\
    \n# WRITING APPLETS USING SWING\n\nUntil the Swing library came into the picture,\
    \ you could create Java applets only using UI components from the java.awt package.\
    \ Even after Swing components was somewhat problematic in applets downloadable\
    \ over the Internet — what if the applet had to run in an older browser that supported\
    \ only Java 1.1 and didn't know about Swing classes? But modern applets use the\
    \ new plug-in and don't depend on what JDK came with the web browser. In this\
    \ book I'll be writing my applets with Java Swing.\n\nSwing applets have to be\
    \ inherited from the class javax.swing.Applet for example\n\n```\nclass TicTacToe\
    \ extends javax.swing.Applet {\n}\n```\n\nUnlike Java applications, applets do\
    \ not need a main() method because the web browser will download and run them\
    \ as it sees the <applet> tag in the web page. The Java plug-in will also notify\
    \ the applet when important life-cycle events happen — for example, when the applet\
    \ is starting, and so on.\n\nIf your applets need to react to these events, you\
    \ should program one of the callback methods: init(), start(), paint(), stop(),\
    \ and destroy(). The Java plug-in will call these methods in the following cases:\n\
    \n+   - init() is called when the applet is loaded by the Java plug-in. It's called\
    \ only once, playing a role similar to that of constructors in Java classes.\n\
    \n+   - start() is called right after init(). It is also called each time a user\
    \ returns to the web page with the applet visiting another page.\n\nFIGURE 10-2"
