  md: "# TAG LIBRARIES\n\nBecause this redirection happens on the server side, the\
    \ initial URL is still displayed in the web browser's address bar. To provide\
    \ the new URL (to allow the user to bookmark the resulting page, for example),\
    \ use response.sendRedirect(\"/new_url\");\n\nAnother way of minimizing the amount\
    \ of code in JSP is to use tag libraries containing custom and reusable tags —\
    \ either your original library or a library created by someone else. Each custom\
    \ tag looks similar to a regular one, but under the hood it is always supported\
    \ by a Java class (or classes) written by a programmer to provide the required\
    \ functionality.\n\nIf you want to create your own tags to be used with JSP you\
    \ have to do the following:\n\n+   - Create a tag library descriptor — an XML\
    \ file with the extension .tld. This has to be deployed in the directory WEB-INF/tags.\n\
    \n+   - Create Java classes that provide business logic supporting the tags. Such\
    \ classes are usually deployed as jars in the WEB-INF/lib directory.\n\n+   -\
    \ Register the tag library with the web application.\n\nListing 28-4 shows a tag\
    \ library descriptor file. The tag DowJones should display a Jones index value.\
    \ The empty value in <bodycontent> means that this is a simple JSP tag with no\
    \ content and could be used like this: <sts:DowJones/>.\n\n# LISTING 28-4: Sample.tld\
    \ file\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<taglib xmlns=\"http://java.sun.com/xml/ns/j2ee\"\
    \ \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/j2ee/web-jspptaglibrary_2_0.xsd\"\nversion=\"2.0\"\
    >\n<tlib-version>1.0</tlib-version>\n<shortname>sts</shortname>\n<uri>http://www.mystockserver.com:8080/taglib</uri>\n\
    <info>Wall Street tag library</info>\n\n<tag>\n<name>DowJones</name>\n<class>DowJonesTag</class>\n\
    <bodycontent>empty</bodycontent>\n<info>Displays the Dow Jones index</info>\n\
    </tag>\n\n</taglib>\n```\n\nThe class supporting a JSP tag (e.g. DowJonesHandler)\
    \ has to implement the interface javax.servlet.jsp.tagext.SimpleTag or extend\
    \ SimpleTagSupport. The JSP container will call"
  merge: -1
  pgno: 353
- img_proc: true
  md: "DowJonesHandler s methods to set the JSP context — setPageContext() — start\
    \ the execution of the tag's code — doStartTag(), etc. This gives you a default\
    \ implementation of the SimpleTag interface and initialized references to the\
    \ pageContext and parent. Place required logic for the tag in the doTag() method,\
    \ which is called by the container at request time.\n\n```\nimport javax.servlet.*;\n\
    import javax.servlet.jsp.tageext.*;\nimport java.io.*;\n```\n\n```\npublic class\
    \ DowJonesHandler extends SimpleTagSupport{\n    public int doTag() throws JspException,\
    \ IOException{\n        String dowQuote;\n        // Obtain the DowJones quotes\
    \ by accessing\n        // http://finance.yahoo.com/?q=dt&s=DJI or similar\n \
    \       dowQuote=...;\n\n        // and write it to the client\n        JspWriter\
    \ out = getJspContext().getOut();\n        out.print(\"The last price is \" +\
    \ dowQuote);\n    }\n```\n\nTo mark a tag library recognizable by your JSP container,\
    \ register it by inserting the following fragment into the web.xml:\n\n```\n<taglib>\n\
    \    <taglib-uri>\n        http://www.mystockserver.com/taglib\n    </taglib-uri>\n\
    \    <taglib-location>\n        /WEB-INF/taglib.tld\n    </taglib-location>\n\
    </taglib>\n```\n\nWhen you've done all this, create a simple file called test.jsp\
    \ and start using your tag library. The sample JSP in Listing 28-5 uses the tag\
    \ <DowJones.\n\n# LISTING 28-5: Using a custom tag in a JSP\n\n```\n<html>\n<head>\n\
    \    <%@ taglib uri=http://www.mystockserver.com/taglib prefix=\"*=\"sts\" %>\n\
    </head>\n<body>\n    Today's Dow Jones index: sts:DowJones/\n</body>\n</html>\n\
    ```"
  merge: -1
