    \nNow let's give a 15 percent discount to all customers who spent more than $500\
    \ in our online store:\n\n```\nfor (Customer c : cust) {\n    if (c.getTotalCharges(c)\
    \ > 500) {\n        c.setDiscount(15);\n    }\n}\n```\n\nNote the use of the for-each\
    \ loop here. It iterates through this array without trying to access elements\
    \ beyond its boundaries. You could've used another syntax of the for loop to access\
    \ array elements by index. If a programmer forgot to check the size of the array\
    \ and try to access, even eleven elements like cust[10].setDiscount(15), Java\
    \ would throw a run-time ArrayIndexOutOfBoundsException. Remember, if an array\
    \ has n elements the element's index is n -1.\n\n# CLASSES ARRAYLIST AND VECTOR\n\
    \nArrays offer the fastest access to the collection of data, but they are stored.\
    \ Luckily Java has classes that don't have this restriction, and you can add more\
    \ elements to a collection during the run time if needed. Classes Vector and ArrayList\
    \ belong to this group.\n\nInternally both use the array for storage, but when\
    \ adding elements to these collections they internally increase the size of the\
    \ array (ArrayList increases by smaller increments), and as elements are deleted\
    \ collections shrink.\n\nIn Vector and ArrayList you can store only objects —\
    \ only primitives are allowed. Having said this, in mind that Java supports autoboxing\
    \ (see Lesson 3), and if you'll try to add a primitive to a collection, it will\
    \ be automatically converted into the wrapper object.\n\nYou have to pay a price\
    \ for this convenience: ArrayList is a little slower than the array as it needs\
    \ to do internal array copying to change the collection's size, and Vector is\
    \ even slower because it supports synchronization (which will be explained in\
    \ Lesson 21). But after the introduction of more efficient concurrent collections,\
    \ Vector became less popular and you can achieve its synchronized functionality\
    \ by the method Collections.synchronizedList() on an ArrayList object. All code\
    \ samples in this section use only ArrayList.\n\nTo create and populate an ArrayList\
    \ you should first initialize it, and then add instances of other objects to the\
    \ ArrayList by calling the method add();, as in Listing 14-1.\n\n# LISTING 14-1:\
    \ Populating ArrayList\n\n```\nArrayList customers = new ArrayList();\nCustomer\
    \ cust1 = new Customer('David', 'Lee');\ncustomers.add(cust1);\nCustomer cust2\
    \ = new Customer('Ringo', 'Starr');\ncustomers.add(cust2);\n```"
