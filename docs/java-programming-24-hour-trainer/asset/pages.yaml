  md: '# LESSON 6 PACKAGES, INTERFACES, AND ENCAPSULATION


    If you declare the class Tax as shown in the preceding code, the file Tax.java
    must be stored in the corresponding directory tree:


    Acme

    Accounting


    Java classes are also organized into packages and the fully qualified name of
    a class consists of the package name followed by the class name. For example,
    the full name of the Java class Double is java.lang.Double, where java.lang is
    the package name. As a matter of fact, java.lang is the only package name you
    don''t have to explicitly mention in your code in order for its classes to be
    found, unless all classes are located in the same package.


    The program documentation on all Java 6 packages is available at the following
    URL: http://download.oracle.com/javase/6/docs/api/


    Let''s say your Tax class needs to connect to some URL on the Net with the help
    of the class URL located in the java.net package. You can write code containing
    the fully qualified name of the second class:


    ```

    java.net.URL myURL = new java.net.URL("*www.acme.com");

    ```


    But instead of using this long notation, include the import statement right above
    the class declaration, and just use the name of the class:


    ```

    java.net.URL;

    Class Tax{

    URL myURL = new URL("http://www.acme.com");

    ...

    }

    ```


    If you need to import several classes from the same package, use the wild card
    in the import statement rather listing each of the classes on a separate line:


    ```

    import java.net.*;

    ```


    # ENCAPSULATION


    Encapsulation is the ability to hide and protect data stored in Java objects.
    You may ask, “Who are the bad guys who want to illegally access my data?” It''s
    not about bad guys. When a developer creates a Java class, or he plans for a certain
    pattern of this code by other classes. For example, the variable grossincome should
    not be modified, but via a method that performs validation procedures to ensure
    that the value to assigned meets application-rules.


    A Java developer may decide to “hide” 15 out of 20 variables, say, so other classes
    can''t access them. Imagine how many parts exist in a car and how many functions
    those parts perform. Does the driver need to know all of them? Of course not.
    The driver needs to know how to start and stop the car, how to indicate turns,
    open the windows, turn on the wipers, and a few dozen other simple operations,
    which in programming jargon can be called the car''s public interface.'
