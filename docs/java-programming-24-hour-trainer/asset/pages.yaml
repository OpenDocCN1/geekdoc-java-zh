  md: '# PROCESSING HTML WITH SPRING


    In this section I''ll show you a simple web application using the Spring Web MVC
    framework. You''ll see how to do the following:


    +   - Configure the controller ServletDispatcher.

    - Configure the UrlBasedViewResolver bean.

    - Create a simple controller HelloWorldController to produce data for presentation
    by a JSP.

    - Handle the request of a "contact us" HTML form with the Spring JSP tag library.


    # Understanding the Spring Web MVC Workflow


    To start, create an Eclipse Dynamic Web Project named Lesson35. Now you''ll need
    to download several files from the Spring framework and copy them to the WebContent/WEB-INF/lib
    folder. Register at the SpringSource website www.springsource.com/download/community
    and download the latest zip file of the Spring Framework. At the time of this''s
    spring-framework-3.0.5.RELEASE.zip.


    Unzip the archive and add the jars to the build path of your Eclipse project.
    Also copy these jars to the WebContent/lib directory so they are visible at the
    deployment time.


    +   - org.springframework.asm-3.0.5.RELEASE.jar

    - org.springframework.beans-3.0.5.RELEASE.jar

    - org.springframework.context-3.0.5.RELEASE.jar

    - org.springframework.core-3.0.5.RELEASE.jar

    - org.springframework.expression-3.0.5.RELEASE.jar

    - org.springframework.web.servlet-3.0.5.RELEASE.jar

    - org.springframework.web-3.0.5.RELEASE.jar


    For logging support you''ll also need to download and add to the lib folder Commons
    Commons API commons-logging-api-1.1.1.jar, which you can download from the same
    website — it''s in org.apache.commons in the archive with dependencies.


    Now you need to deploy the Spring Framework as a web application under GlassFish.
