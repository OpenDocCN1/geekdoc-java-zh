  md: '# A Brief Introduction to Layout Managers


    Swing offers the following layout managers:


    +   - FlowLayout

    - GridLayout

    - BoxLayout

    - BorderLayout

    - CardLayout

    - GridBagLayout


    To use any layout manager, instantiate it first and then assign this instance
    to a container via setLayout() as you did with the class SimpleCalculator in Listing
    8-2.


    # FlowLayout


    This layout arranges components in a window row by row. For example, labels, text
    fields, and buttons will be added to the first imaginary row until there is room
    left in the window. When the current row is filled, the rest of the components
    will go to the next row, and so on. If a user changes the size of the window,
    it may mess up the picture, as illustrated in Figure 8-2. Indeed, FlowLayout is
    not the best choice for our calculator. Let''s try something different.


    # GridLayout


    The class java.awt.GridLayout allows you to arrange components as rows and columns
    in a grid. You''ll be adding components to imaginary cells of this grid. If the
    container gets resized, grid cells may become larger or smaller, but the relative
    positions of the components inside the container will remain the same.


    So far our calculator has seven components: three labels, three text fields, and
    a button. You may arrange them as a grid of four rows and two columns (one cell
    stays empty) by creating an instance of GridLayout like this:


    ```

    GridLayout gr = new GridLayout(4,2);

    ```


    You can also assign horizontal and vertical spaces of, for example, five pixels,
    between the cells:

    GridLayout gr = new GridLayout(4,2,5,5);


    Replace FlowLayout with GridLayout in Listing 8-2 and the calculator will look
    a little prettier.

    Create and compile a new class called SimpleCalculatorGrid (see Listing 8-3).


    | LISTING 8-3: Calculator with GridLayout |


    ```

    import javax.swing.*;

    import java.awt.GridLayout;

    public class SimpleCalculatorGrid {

    ```'
