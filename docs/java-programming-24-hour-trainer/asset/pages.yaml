  md: "# Your First Java Program: Hello World\n\n# LISTING 1-1: HelloWorld.java\n\n\
    ```\npublic class HelloWorld {\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello World\");\n    }\n}\n```\n\nCreate a directory,\
    \ c:\\PracticalJava\\Lesson1, and save the program you just created in the file\
    \ HelloWorld.java (if you use Notepad, select All Files in the Save as Type drop-down\
    \ to avoid auto-attachment of .txt suffix).\n\nKeep in mind that Java is a case-sensitive\
    \ language, which means that if you named the program HelloWorld with a capital\
    \ H you should not try to start the program hell. Your first syntax errors will\
    \ be caused by improper capitalization.\n\nWhat follows is a really short explanation\
    \ of some of the terms and language elements used in the HelloWorld program. You'll\
    \ get more comfortable with them mastering the first few lessons in this book.\n\
    \nOur first program contains a class, HelloWorld. Give the class and its file\
    \ the same name (There could be exceptions to this rule, but not in this simple\
    \ program.) While writing programs create classes, which often represent objects\
    \ from real life. You will learn more about classes in Lesson 3.\n\nThe class\
    \ HelloWorld contains a method, main(). Methods in Java classes represent functions\
    \ (actions) that a class can perform. A Java class may have several methods, but\
    \ if one of them is called main() and is declared (if it has a method signature),\
    \ as our class this makes this Java executable. If a class doesn't have a method\
    \ main(), it can be used from other classes, but you can't run it as a program.\n\
    \nThe method main() calls the method println() to display the text \"Hello World\"\
    \ on the screen. Here is the method signature (similar to a title) of the method\
    \ main():\n\n```\npublic static void main(String[] args)\n```\n\nThis signature\
    \ includes the access level (public), instructions on usage (static), return value\
    \ type (void), name of the method (main), and argument list (String[] args).\n\
    \n+   - The keyword public means that the method main() can be accessed by any\
    \ other class.\n- The keyword static means that you don't have to create an instance\
    \ of this class to use this method.\n- The keyword void means that the method\
    \ main() doesn't return any value to the calling program.\n- The keyword String[]\
    \ args tells us that this method will receive an array of characters as the argument\
    \ (you can pass external data to this method from a command line)."
