  md: '# CLASS VERSIONING


    Imagine that a program, ClassA, serializes the Employee object from Listing 17-1
    into a file on Mary''s computer. Two days later Mary starts another program, ClassB,
    that offers a download of its new version with long-awaited features. After upgrade,
    ClassB starts generating errors, which are caused by the fact that the new upgrade
    includes a modified version of the class Employee that has one property with a
    different data type than exists in memory. The upgrade also includes one new property
    that wasn''t in the previous version of the Employee object.


    Now the deserialization process will try to ignore the new property but will fail
    because of the mismatched property types between the serialized and in-memory
    versions of Employee. Serialization may also fail because of a change in the inheritance
    tree of Employee.


    During serialization, JVM automatically calculates a special value: the serial
    version ID, which is based on the properties of the serializable object, the implemented
    interfaces, and the signatures of non-private methods. If you are curious to see
    how this number looks run the program server (it''s located in the bin directory
    of your Java install), providing the name of your class as a command-line argument.


    But if your class explicitly defines and initializes a static final variable called
    serialVersionUID, Java will use your value instead of trying to generate one.
    For example:


    ```

    Public static final serialVersionUID = 123;

    ```


    Now, if you keep the value of this variable in the new version of Employee the
    same as in the old one, you''ll have freedom to add more methods to this class,
    and JVM will assume that both classes have the same version. If a new version
    has added a public field, the deserialization process will ignore it. If a new
    version has removed a field, the deserialized version will still have initialized
    with a default value. But if you change the data type for the public field, the
    deserialization process will fail anyway.


    # SERIALIZING INTO BYTE ARRAYS


    An interesting effect will be produced if you serialize your objects into an in-memory
    array of bytes—byte[]. This can be the easiest way of creating a sort of memory
    blob that can be exchanged among different VMs.


    The syntax of such serialization is pretty straightforward. Let''s assume that
    you have a class XYZ that implements Serializable and contains all the elements
    of your report in the proper format. To prepare a byte array from it, write the
    code in Listing 17-8.


    > LISTING 17-8: Turning an object into an array of bytes


    ```

    XYZ myXYZ = new XYZ();


    // Code to fill myXYZ with the content here

    // ...


    ByteArrayOutputStream baOut = new ByteArrayOutputStream(5000);

    ```'
