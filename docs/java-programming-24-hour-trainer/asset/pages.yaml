  md: '# #5


    # ## Array to Java Basics


    This tutorial didn''t start with detailed coverage of basic constructs of the
    Java language such as the syntax of if statements, loops, and the like. You started
    learning Java programming with getting used to object-oriented terms and constructs
    of the language. This lesson is a grab bag of basic language elements, terms,
    and data structures.


    # ## ARRAYS


    An array is a data storage that''s used to store multiple values of the same type.
    Let''s say your program has to store names of 20 different girls, such as "Masha",
    "Matilda", "Rosa" and so on. Instead of declaring 20 different String variables,
    you can declare one String array with the capacity to store 20 elements


    ```

    String friends = new String[20]; // Declare and instantiate array

    friends[0] = "Masha"; //Initialize the first element

    friends[1] = "Matilda"; //Initialize the second element

    friends[2] = "Rosa";

    ```


    // Keep initializing the elements of the array here


    The first element of an array in Java always has an index of 0. While declaring
    an array you can place brackets after the data type or after the variable name.
    Both of the following declarations are correct:


    ```

    String friends[];

    String friends[];

    ```


    You must know the size of the array before assigning values to its elements. If
    you want to dynamically change the size of an array during the run, consider other
    Java classes from the package java.util, such as Vector and ArrayList. Arrays
    Java has lots of collection classes that can store multiple related values, for
    example HashMap, List, and LinkedList. You''ll have a chance to use their in the
    code samples accompanying the book. Listing 5-1 contains sample code that partially
    populates an array.'
