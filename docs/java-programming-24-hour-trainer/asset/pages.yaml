  md: '# 27 Programming with Servlets


    Web applications can serve static or dynamic content. Some examples of static
    content are text files with HTML markup, images, and video. Dynamic content is
    formed on the fly. Think of a web application that enables you to browse the inventory
    of an online store. The content you see on your screen is being created based
    on your queries — in other words, dynamically.


    In the Java EE world, content is served either by a program running in a container
    with deployed servlets, JSP, JSF, or a third-party framework, or it''s a SOAP
    or RESTful Web Services. Servlets, JSP, and JSF not only return the data, but
    also present it as formatted HTML pages, hence the term presentation layer (refer
    to Figure 26-1). Web Services, on the other hand, return the data (see Lesson
    34).


    A servlet is a Java program written by certain rules and deployed in a Java EE-compliant
    servlet container of your choice. The client program can be a lightweight HTML,
    JavaScript, applet, or Java program. In this lesson I''ll be explaining the most
    widely used means of web communication: HTTP requests and responses. HTTP stands
    for Hypertext Protocol.


    All examples in this lesson will work in any Java EE container supporting the
    Servlets 3.0 specification. I use GlassFish v3.


    Figure 27-1 shows a web browser making HTTP requests to MyServlet, a servlet written
    by another developer, and receiving HTTP responses that MyServlet sends back.


    # THE BIG PICTURE


    Before you even learn how to create servlets, let''s look at the components and
    the workflow of an imaginary online store, MyBooks.com, developed with Java servlets.


    +   The client''s machine just needs a web browser. The bookstore will consist
    of a number of HTML pages for getting user input. The web browser sends it to
    the server with another name MyBooks.com in the form of an HTTP request.


    +   MyBooks.com computer has to run some web server software, usually on port
    80. For secure communication with HTTPS (Hyper Transfer Protocol Secure) the port
    443 is used. The web server will "listen to" the users'' requests. If a web server
    receives a simple request for static HTML content, the web server will process
    the'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'without needing to engage any additional software, and it''ll send back HTTPResponse
    with the requested static content.


    +   The website MyBooks.com will also run a servlet container with deployed servlet(s).
    If the web server receives a user request to find books based on some criteria,
    it''ll create and pass HttpRequest to the appropriate servlet, FindBooks, which
    is deployed and running in the servlet container. The next section shows sample
    HTML containing a form that explicitly lists FindBooks.


    +   The servlet creates (on the fly) the HTML page listing the found books that
    meet the requested search criteria, and sends it to the web server in HttpServletResponse,
    which wraps it inside the HttpResponse object and sends it back to the user''s
    browser.


    +   The user''s browser displays the received page without knowing if it is an
    old static HTML page or a freshly baked one.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_329_0.png)


    FIGURE 27-1


    # THE THIN CLIENT


    Listing 27-1 shows a simple HTML file with a form containing a text input field
    and a Submit button, which users can use to find a book by its title.


    LISTING 27-1: HTML that gives 404


    ```

    <html>

