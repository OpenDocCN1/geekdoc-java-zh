  md: "If a tag requires some parameters, they should be specified in the .tld file\
    \ with the tag <attribute>, for example:\n\n```\n<tag>\n  <attribute>\n    <name>tradeDate</name>\n\
    \    <required>false</required>\n  </attribute>\n</tag>\n```\n\nThe setter method\
    \ has to be provided in the tag handler class for each parameter. Setters to be\
    \ named after the same naming convention as Java beans:\n\n```\npublic void setTradeDate(String\
    \ tradeDate) {\n}\n```\n\nCustom tag libraries are created by application developers\
    \ to fit the needs of a specific project(s). Third parties can also provide non-standards-tag\
    \ libraries, with the open source implementations of JSP tag libraries in the\
    \ Project Apache Taglibs (http://tomcat.apache.org/taglibs/).\n\n# JSTL\n\nJSP\
    \ Standard Tag Libraries (JSTL) is a standardized specification for library components\
    \ includes actions that are reusable for any JSP-based applications. Standard\
    \ JSTL guarantees that any Java EE-compliant JSP container will include and support\
    \ these components. There are five JSTL libraries contain an iterator, if statements,\
    \ tags for XML processing, tags for executing SQL, tags for internationalization\
    \ and commonly used functions.\n\nWhile the JSP in Listing 28-3 had to specify\
    \ the location of the tag library on your server, standardized libraries have\
    \ predefined URLs. For example, using the forEach iterator you need to specify\
    \ the following URI: http://java.sun.com/jsp/jstl/core. XML processing tags are\
    \ located at the following URI: http://java.sun.com/jsp/jstl/xml. The code fragment\
    \ that uses the iterator can look like this:\n\n```\n<% taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
    \ prefix=\"c\" %>\n<c:forEach item=\"item\" items=\"${sessionScope.cart.items}\"\
    >\n  <c:forEach>\n</c:forEach>\n```\n\nLearning programming with JSTL and Expression\
    \ Language is out of the scope of this tutorial; please refer to the Oracle tutorial\
    \ at the following URL: http://download.oracle.com/javaee/5/tutorial/dbnake.html.\n\
    \n# TRY IT\n\nRewrite the sample stock server application you created in the \"\
    Try It\" section of Lesson 27, but this time do it using JSP and Java beans. Write\
    \ a simple HTML client with one text input field and a Submit button. The user\
    \ will enter the stock symbol she wants to get a price quote for. Generate"
