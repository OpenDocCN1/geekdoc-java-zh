  md: 'The output of the program EmployeeList should look like this:


    +   7369, John Smith, CLARK

    7499, Joe Allen, SALESMAN

    7521, Mary Lou, Director


    When you execute any SQL statements, always include processing of errors that
    may be returned by the DBMS. Catching the SQLException is the right way to get
    the error message. Note that the code in Listing 22-1 calls the method getErrorCode()
    to extract the database-specific error code from the SQLException object.


    # PROCESSING RESULT SETS


    Let''s take a closer look at the code in Listing 22-1. After rs = stmt.executeQuery(sqlQuery),
    the cursor rs points at the first record (row) of the result set in memory. Each
    row contains many fields (columns) as specified in the SQL Select statement. Each
    of the values is extracted by an appropriate method based on the data type of
    the field. The names of these methods-explanatory: rs.getString(), rs.getInt(),
    and so on. If you know the name of a column from the result, use it as a method
    argument:


    ```

    int empNo = rs.getInt("EMPNO")

    String eName = rs.getString("ENAME")

    ```


    JDBC drivers are smart enough to convert the data from the database types to the
    corresponding Java types: For example, Derby''s varchar will become Java''s String.


    You could have gotten the values of each field by specifying the relative position
    of the column from the result set:


    ```

    int empNo = rs.getInt(1)

    String eName = rs.getString(2);

    ```


    Besides having names, columns in the result set are numbered with 1. In some cases
    numbers are your only choice; for example, the following SQL query does not list
    column names to select (the asterisk "all*")


    ```

    stmt.executeQuery("Select(*) FROM EMP");

    ```


    The class EmployeeList prints the retrieved data in a loop. You can also place
    the result set in a Java collection object for further processing. The ResultSet
    object holds the database connection and is not serializable. That why common
    practice for programming server-side operations with DBMS is to create a class
    representing a row from the result set and populate, with an ArrayList or other
    Java collection with instances.


    Listing 22-2 shows an example of such a class, which can represent one employee
    record. Classes that hold only the value of data are often called value objects.
    Because in distributed applications such objects may need to be transferred between
    different computers, they are also known as Data Transfer Objects (DTOs).'
