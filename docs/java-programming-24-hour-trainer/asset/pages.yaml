  md: "# Optional Callbacks of Table Models\n\nThe JTable in Figure 23-1 doesn't show\
    \ the proper titles of the columns — the auto-generated A, B, C, and D don't count.\
    \ You can fix this easily by overriding the getColumnName() method in the table\
    \ model class. This callback, if present, will be called (once for each column)\
    \ to render the titles. Add the following code to make your MyTableModel and the\
    \ window look like it in Figure 23-2:\n\n```\nString[] orderColNames = { \"Order\
    \ ID\", \"Symbol\", \"Quantity\", \"Price\" };\n\npublic String getColumnName(int\
    \ col) {\n    return orderColNames[col];\n}\n```\n\nIf you want to make some of\
    \ the columns editable, just override the isCellEditable() method and return true\
    \ from this callback for the editable columns. Here's how to make the third column\
    \ of your JTable editable:\n\n```\npublic boolean isCellEditable(int row, int\
    \ col) {\n\n    if (col==2) {\n        return true;\n    } else {\n        return\
    \ false;\n    }\n}\n```\n\nIf your table has editable columns you need to override\
    \ the method setValue(Object value, int row, int col) and include the code that\
    \ will copy the data from the UI component — JTable — to the appropriate field\
    \ in your model objects. This method is called automatically when the user changes\
    \ the value in a table cell and the cursor moves out of that cell by pressing\
    \ Enter or Tab key or by clicking a different cell.\n\nThe following method, setValue(),\
    \ will take the modified order quantity and set the new value for the quantity\
    \ in the appropriate Order model. By default, all the data in JTable's cell has\
    \ the String data type, and it's your responsibility to do proper casting.\n\n\
    ```\npublic void setValue(Object value, int row, int col) {\n\n    if (col==2)\
    \ {\n        myData.get(row).quantity=Integer.valueOf(value.toString());\n   \
    \ }\n\n    //Notify listeners about the data change\n    TableModelEvent event\
    \ = new TableModelEvent(this, row, row, col);\n    fireTableChanged(event);\n\
    }\n```\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_291_0.png)\n\nFIGURE 23-2"
