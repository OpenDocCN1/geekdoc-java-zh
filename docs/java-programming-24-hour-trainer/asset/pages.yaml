    \ into the Properties object\n\n```\nProperties prop=new Properties();\nFileInputStream\
    \ in=null;\ntry{\n    in=new FileInputStream(\"mailman.properties\");\n    prop.load(in);\n\
    } catch (Exception e) {\n    ...\n} finally {\n    in.close();\n}\n\nString from\
