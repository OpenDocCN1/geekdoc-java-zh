  md: "Let's say that you'd like to create a program that at certain times sends some\
    \ messages to a queue.\nWrite a singleton bean, request that the EJB container\
    \ instantiate it on application start-up, and start pushing the messages immediately\
    \ after the singleton has been constructed. There is another handy annotation,\
    \ @PostConstruct, that will cause the container to invoke a method immediately\
    \ after the bean's constructor is finished:\n\n```\n@StartUp\n@Singleton\npublic\
    \ class MyStockQuotesServer {\n\n    @PostConstruct()\n    void sendPriceQuotes()\
    \ {\n        // The code connecting to the stock prices feed and\n        // sending\
    \ messages to a queue goes here\n    }\n}\n```\n\nTo get access to the business\
    \ methods of a singleton, the client Java classes will need to call the public\
    \ static method getInstance() on the singleton, as shown in the following code\
    \ snippet. If you'll be implementing the singleton design pattern manually you\
    \ need to declare a private constructor and a public static getInstance() on class,\
    \ otherwise the EJB container will take care of this.\n\n```\nMyGlobalStorage.getInstance().addToStorage(empOfTheMonth,\
    \ bestEmployee);\n```\n\nThe EJB container allows access to singleton beans, and\
    \ by default it applies the container-managed concurrency policy, sparing the\
    \ developer worry about race conditions and such. You just need to use the @Lock\
    \ annotation, specifying whether you want a resource to be locked during the read\
    \ or write operation. If you prefer to write thread-synchronization code by yourself,\
    \ switch to bean-managed concurrency. You set the type of concurrency using the\
    \ @ConcurrencyManagement annotation, as shown here:\n\n```\n@Singleton\n@ConcurrencyManagement(ConcurrencyManagementType.BEAN)\n\
    public class MyGlobalStorage {\n\n}\n```\n\n# DEPLOYING EJB\n\nBefore deploying\
    \ to any application server, EJBs are usually packaged into one archive file,\
    \ which could be a jar, an Enterprise Archive (ear), which is a jar with a .ear\
    \ file name extension, or a war. Even such simple two-class web application as\
    \ our current example should be compressed and deployed as one file. If your client\
    \ is a web application it's convenient to keep the EJB inside a war file. Let's\
    \ create one.\n\nRight-click the Deployment Descriptor section in the Eclipse\
    \ project Lesson32 and select Export WAR file. In a second you'll get the file\
    \ lesson32.war that contains both the servlet and the EJB."
