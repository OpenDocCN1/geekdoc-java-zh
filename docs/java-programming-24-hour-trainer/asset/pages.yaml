    # SWING AND GROUPLAYOUT


    The code in Listing 11-1 was written manually. But most likely, if you''re developing
    a complex GUI, you''ll use some Swing GUI builder such as Matisse that will allow
    you to design windows in what-you-see-is-what-you-get by dragging and dropping
    visual components onto the design area. If you look at the auto-generated code
    you may find GroupLayout, created by the GUI builder (but you can program this
    layout manually, too).


    GroupLayout components include a container. Imagine a shipping or billing form
    that contains several text labels, one under another, each having an input field
    next to it. Each label contains a different number of characters, which means
    that you''ll need to align the input fields so the form looks properly. If you
    think of this UI as two vertical groups (labels belong to one and input fields
    to another), you can simply set the gap between the left and right groups to 20
    pixels or so.

    Similarly, you can distinguish horizontal groups in your UI. If you want to learn
    more about GroupLayout, follow this link: http://download-lnw.oracle.com/javase/6/docs/api/javax/swing/GroupLayout.html.


    After the UI part is ready, let''s take care of the processing logic. After app
    will process mouse clicks to the selected button to X or O and checking for the
    winner. That''s why you''ll need to perform these steps:


    +   1. Add implements MouseListener to the class TicTToeApplet.


    +   2. Add MouseListener to each of the buttons so they properly report which
    player (X or O) clicked them, for example

    button1.addMouseListener(this);


    +   3. Implement methods required by the MouseListener interface — only the mouseClicked()
    callback will have code in it.


    +   4. Call the method checkForWinner() on each click to determine whether there
    are three identical symbols in a row, column, or diagonal, as shown in Listing
    11-3.'
