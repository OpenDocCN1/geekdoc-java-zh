    # CardLayout


    Think of a deck of cards lying on top of each other, only the top card visible.
    You can use the java .awt.CardLayout manager to create a component that shows
    one panel at a time, such as the tabbed folder in Figure 8-9.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_121_0.png)


    FIGURE 8-9


    When the user clicks a tab, the content of the window changes. In fact, all the
    panels needed for this screen are already preloaded and lie on top of each other.
    When the user clicks a tab, the program just brings this "card" to the top and
    makes the other "cards" invisible. The tabbed folder here used for illustration;
    the Swing library includes a ready-to-go component for windows with tabs, called
    JTabbedPane.


    # Containers with Absolute Layout


    If you want a container''s content to remain the same regardless of the window''s
    size, set the x and y coordinates, width, and height (aka the bounds) of each
    component while adding them to the window. Your class has explicitly state that
    it won''t use any layout manager by passing null to setLayout():


    ```

    windowContent.setLayout(null);

    ```


    The next code snippet shows how to set a button''s width to 40 pixels and its
    height to 20, and place it 100 pixels to the right of and 200 pixels from the
    top left corner of the window:


    ```

    JButton jButton = new JButton(*New Game*);

    jButton.setBounds(100, 20, 40, 20);

    ```


