    \ not in the method where it has happened, but\nin the calling one. Let's use\
    \ the same example of code that reads a file. Because the method read ()\nmay\
    \ throw an IOException, you should either handle it or declare that the calling\
    \ method\nthrow it. The latter is in Listing 13-5.\n\n# LISTING 13-5: Using throw\
    \ clause\n\n```\nclass CustomerList{\n\n    void getAllCustomers() throws IOException\
    \ {\n        \n        // Some other code goes here\n        // Don't use try/catch\
    \ if you are not handling exceptions here\n        file.read();\n    }\n\n   \
    \ public static void main(String[] args){\n        System.out.println(\"Customer\
    \ List\");\n\n        // Some other code goes here\n}\n\ntry{\n    // Since getAllCustomers()\
    \ declared an exception,\n    // either handle it over here, or re-throw it\n\
    \    // (see the throw keyword explanation below)\n\n    getAllCustomers();\n\
    } catch (IOException e) {\n    System.out.println(\"Customer List is not available\"\
    );\n}\n} \n```\n\nIn Listing 13-5 IOException has been propagated from the method\
    \ getAllCustomers() to the\nmain() method, and has been handled there.\n\n# THE\
    \ FINALLY CLAUSE\n\nThe code can exit the try/catch block in several ways:\n\n\
    +   - The code inside the try block successfully ends and the program continues.\n\
    - The code inside the try block runs into a return statement.\n- The code inside\
    \ the try block throws an exception and control goes to the catch block."
