    # MOM Provider Java EE Application Server


    ![](img/c76c0001feef31da8d0f359dd6abacc0_457_0.png)


    FIGURE 37-1


    These are the players that provide the generation and processing of the price
    quote feed:


    +   1. The singleton bean called PriceProvider (see the source code in Listing
    37-1) knows how to generate random price quotes. It instantiates on startup of
    the GlassFish application server.


    +   2. A stateless bean called MessageService (Listing 37-2) gets to the JMS-administered
    objects via resource injection and publishes the price quote to the JMS topic
    known as JMS/StockPrices, which is mapped to the physical topic Prices in the
    Open MQ messaging server.


    +   3. The Java client subscribes to the price topics. Listing 37-3 shows the
    Java classes Messages and JMSListener, and the interfaceMessageHandler. These
    clients do not have any presentation logic.


    +   4. The presentation client Main.fx (Listing 37-4) is written in JavaScript.
    It wraps the Java client messaging classes and gets the price quotes from them.
    As soon as the new quote comes in, the old one is pushed up and off the screen
    with a special animation effect.


    +   5. To illustrate another way of sending the message, this application has
    a simple HTTP client (Listing 37-5) that allows the user to enter any text, which
    then routed through the servlet SendMessage (Listing 37-6) to the MessageService
    EJB. The rest of the data flow is described in Steps 2 through 4.


