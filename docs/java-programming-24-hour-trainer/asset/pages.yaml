  md: "This file can be deployed in any Java EE 6-compliant application server. This\
    \ is really small: under 4 KB! Java EE 6 makes EJB components really lightweight.\
    \ If you have multiple EJB classes, put them in one or more jars in the WEB-INF/lib\
    \ directory.\n\nIf your client is not a small web application, or if you want\
    \ to create EJBs deployed separately, you can package them inside a separate jar\
    \ or ear file. The root directory that you'll be using to create ears is to have\
    \ all compiled Java classes and, if applicable, the optional ejb-jar.xml file\
    \ in the META-INF directory. As a matter of fact, you can create an ear file that\
    \ will contain only your EJBs, but also the war file.\n\n# MESSAGE-DRIVEN BEANS\n\
    \nMDBs (message-driven beans) perform only one function: Retrieve messages from\
    \ queues and topics via the JMS API. The clients never need to look them up or\
    \ invoke their methods. The client just needs to drop a message in a queue or\
    \ publish it to a topic, and the MDBs that were listening to the messages at these\
    \ destinations get invoked automatically.\n\nMDBs must implement the MessageListener\
    \ interface. All configuration parameters can be specified in the parameters of\
    \ the @MessageDriven annotation, as shown in Listing 32-6.\n\n# LISTING 32-6:\
    \ MDB MyMessageBean\n\n```\n@MessageDriven(mappedName=\"jms/testQueue\", activationConfig\
    \ = {\n    @ActivationConfigProperty(propertyName=\"acknowledgeMode\",\n     \
    \                          propertyValue=\"Auto-acknowledge\"),\n    @ActivationConfigProperty(propertyName=\"\
    destinationType\",\n                               propertyValue=\"javax.jms.Queue\"\
    )\n})\npublic class MyMessageBean implements MessageListener {\n\n    private\
    \ MessageDrivenContext ctx;\n\n    // A no-argument constructor is required\n\
    \    public MyListener() {}\n\n    public void onMessage(Message message) {\n\
    \        // The business logic is implemented here.\n    }\n}\n```\n\nWhen a message\
    \ appears in the queue testQueue the EJB container picks one of the MDBs from\
    \ the pool and invokes its onMessage(), passing the message from the queue as\
    \ an argument. Unlike the stand-alone message receivers described in Lesson 30,\
    \ with MDBs the container gives you countless benefits: distributed transaction\
    \ processing, automatic pooling, location of receivers and other beans, simple\
    \ assignment of queues or topics to the receivers in deployment descriptors. In\
    \ addition, you can easily configure the number of receivers by specifying the\
    \ pool size in the deployment descriptor.\n\nYou can use any client to send a\
    \ message in a queue. It can be a stand-alone client, as shown in Listing 31-2,\
    \ a servlet, an EJB, etc."
