  md: "There's another syntax of the for loop, known as the for-each loop. You simply\
    \ declare a variable of the same type as the objects stored in an array and specify\
    \ the array to iterate. The following code snippet declares the variable girl,\
    \ and the colon means \"in.\" Read this loop's condition expression as \"for each\
    \ in friends.\" This syntax allows you to not worry about checking the size of\
    \ the array, and there is no need to increment any loop variable either. It is\
    \ an elegant and simple loop notation:\n\n```\nfor (String girl: friends){\n \
    \   System.out.println(\"I love \" + girl);\n}\n```\n\nYou can rewrite the program\
    \ in Listing 5-2 using the while loop, which is used when you do not know the\
    \ exact size of the array, but just the condition of exit from the loop. Use the\
    \ keyword while:\n\n```\nint totalElements = friends.length;\nint i=0;\nwhile\
    \ (i<totalElements){\n    System.out.println(\"I love \" + friends[i]);\n    i++;\
    \ // the same as i=i+1;\n}\n```\n\nJust think of a program that reads and processes\
    \ the records from a database (see Lesson 22). When you write a Java program you\
    \ dont know how many elements the database has, and even if you do know, this\
    \ number can change in the future, so it's better to use loops with the exit condition\
    \ than to use a hard-coded count of repetitions.\n\nUse the keyword break to prematurely\
    \ jump out of the loop line below the ending curly brace. For example, if you\
    \ want to find the first null element in the friends array, write the following:\n\
    \n```\nwhile (i<totalElements){\n    if (friends[i]==null){\n        System.out.println(\"\
    The element \" + (i+1) + \" * is null\");\n        break;\n    }\n    System.out.println(\"\
    I love \" + friends[i]);\n    i++;\n} // closing curly brace for the loop\n```\n\
    \nIf the statement in the preceding code checks the value of each element of the\
    \ array, and as soon as it finds null, the loop prints the message about it, stops\
    \ the iteration process, and goes to the line below the closing curly brace of\
    \ the loop, if any.\n\nThe keyword continue allows you to force the loop to jump\
    \ up to its first line and retest the loop condition. The following code snippet\
    \ will print only those values from the array that are not null.\n\n```\nwhile\
    \ (i<totalElements){\n    if (friends[i]==null){\n        i++;\n        continue;\n\
    \    }\n```"
