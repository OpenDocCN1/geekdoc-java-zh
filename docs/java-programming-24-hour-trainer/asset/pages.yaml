  md: '# 38


    # Java job Technical Interviews


    Technical interviewing is a game we work with well-defined rules. I''ve worn the
    hats of both interviewer and interviewee many times over the last 12 years of
    my Java career. In this lesson I''ll share with you my views on hiring Java developers
    and on preparing for technical interviews.

    Regardless of whether the IT job market is hot or not, there are some rules and
    techniques that can increase your interview success rate. The process of getting
    a job consists of three separate tiers:


    +   1. Getting the interview

    2. Interviewing successfully

    3. Considering the offer


    I can''t stress enough how important it is to work on achieving each of these
    goals separately, one step at a time! Your résumé is the most important thing
    in the first step. Adjust it for each position you are applying for (no, I''m
    not asking you to lie). Make sure it''s short and to the point (not more than
    two pages long).


    # GETTING THE INTERVIEW


    If you are applying for a Java developer''s position, nobody needs to know the
    details of that Visual Basic project from 10 years ago. Always update your résumé
    based on the feedback you receive from recruiters or more experienced programmers.


    There is a summary section on each résumé and many people just waste this space
    with some junk like "I''m looking for a challenging position that will let me
    improve my talents." What a waste! Use this summary to show your relevant skills.


    Say you''ve been specializing in Java messaging during the last two years, but
    this job posting requires web developers. Chances are that you''ve developed web
    applications before; high-light your web experience in the summary section of
    your résumé. The same day you may be'
  merge: -1
  pgno: 470
- img_proc: true
  md: 'responding to another ad, this for people who know Java messaging. Modify your
    summary accordingly and send a version of your résumé that emphasizes your experience
    with messaging.


    Job requirements are more involved these days, and recruiting companies don''t
    even want to submit your résumé to the client if you have "only" 8 out of 10 required
    skills. Read the requirements and highlight all the relevant skills you have.
    Do not lazy; work with your résumé.


    Networking is another great way to get an interview. This time I''m not talking
    about Java networking — I''m talking about meeting other IT people who may be
    hiring or know people who are hiring. Attend your local Java Users Group meeting,
    follow Java developers on Twitter, or to professional conferences and seminars.


    # DOING WELL AT THE INTERVIEW


    OK. The interview is scheduled, and now your main goal is to ace it. Remember,
    your interviewer has a difficult task: He needs to assess your technical skills
    within 30 to 60 minutes, so him! Try to get many technical details about the job
    from your recruiter. If the position you are applying for requires knowledge of
    Java sockets, research work with non-blocking sockets. If you''re building Java
    EE applications, find out which application server they use and read up on it.


    Do your homework and prepare a short talk about some interesting and challenging
    technical problems you''ve experienced in one of your college or real-world projects.
    If you didn''t have any super-complex projects, pick up a topic from one of the
    multiple online programmers'' forums and research it. Another great source of
    Java tips and tricks is Josh Bloch''s Effective Java, Second Edition, Addison
    Wesley, ISBN: 0-321-35668-3.


    For example, if you have prepared a talk on concurrent collections, you''re not
    allowed to leave the interview without talking about this. But what if the interviewer
    asks you about Java concurrency? It doesn''t really matter. Find a way to switch
    the conversation to the prepared topic and do your best. The interviewer will
    be happy because he doesn''t need to think about what to ask next, and you''re
    happy you''ve had the time to talk about a well-prepared subject.


    Will this technique work for all? No. But it''ll work most of the time. Obviously
    you need to research the selected subject, or you''ll get fried. You must talk
    about technical challenges you''ve resolved. You need to remember that your interviews
    have a difficult task trying to figure out your technical abilities in just 30
    minutes. So, you need to help them out. Be in charge.


    If you''re a junior developer, spend some time answering the multiple-choice computer
    tests that are usually required for certification exams. You don''t need to get
    certified, but all these books and online mock tests will help you pass tests
    offered by job agencies. Find some sample interview questions online.


    A technical interview is a game with known rules, but in many cases the interview
    are not prepared to run the interviews. Sometimes they go by a prepared list of
    questions. Some take advantage of this and spend some time studying introductory
    courses, and memorize answers for technical interviews. Believe it or not, in
    many cases this works.'
