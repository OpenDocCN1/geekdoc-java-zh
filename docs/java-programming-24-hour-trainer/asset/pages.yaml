  md: "# CONVERTERS AND VALIDATORS\n\nManaged beans can have converters and validators\
    \ assigned to them. A Java class has strongly typed fields, but when the data\
    \ arrives at the web page it has to be converted into Strings. JSF performs this\
    \ conversion automatically for Java data types, but you can write your own converter\
    \ and add some application-specific logic.\n\nValidators enable you to put constraints\
    \ on the data in the managed beans. You can use predefined annotations such as\
    \ @NotNull, @Min, and @Max from javax.validation.constraints to specify the validation\
    \ constraints on the bean's fields, or create your own custom annotations that\
    \ implement constraints specific to your application. The standard validators\
    \ on the fields of the Student bean may look like this:\n\n```\n@RequestScoped\n\
    public class Student implements Serializable{\n\n    @NotNull(message=\"you must\
    \ enter Student ID\")\n    @Size(min=8, max=10, message=\"Student ID must include\
    \ between 8 and 10 symbols\")\n    private long studentId;\n\n    @Size(min=2,\
    \ message=\"Name can have less than two characters\")\n    private String name;\n\
    \n    @NotNull(message=\"Please enter Class ID\")\n    private int classId;\n\
    }\n```\n\nThe core JSF library has standard validators that can validate length,\
    \ and ranges for long and double values. You encapsulate these validators right\
    \ in the JSF file, like this:\n\n```\n<h:inputText value=\"#{student.name}\" title=\"\
    name\" id=\"name\" >\n<f:validatorLength minimum=\"2\"/>\n</h:inputText>\n```\n\
    \nTo create a custom validator (like CreditCardValidator) you need to write a\
    \ Java class that implements the javax.faces.validator.Validator interface and\
    \ performs the validation in the method validate(). If the value is not valid,\
    \ the method has to throw a ValidatorException. Custom validators must be registered\
    \ in faces-config.xml.\n\n```\n<validator>\n    <validator-id>CreditCardValidator</validator-id>\n\
    \    <validator-class>myvalidators.CreditCardValidator</validator-class>\n</validator>\n\
    ```\n\nCustom validators can be used in a JSF page with the <f: validator> tag,\
    \ as in the following example:\n\n```\n<h:inputText value=\"#{student.creditcard}\"\
    \ title=\"card\" id=\"card\" >\n<f:validator id=\"CreditCardValidator\"/>\n</h:inputText>\n\
    ```"
