  md: '# BROWSER-SERVLET DATA FLOW


    One servlet can serve multiple users, so let''s review the entire process of client-servlet
    communication. Java Servlets run in a container, which automatically spawns a
    new thread for every client''s request without requiring you to do any thread
    management.


    The web browser can use an HTML form, a link, or another program that can send,
    say, a Get or Post request to the server. In the very beginning, when the first
    user''s request hits the FindBooks servlet, the container will check if this servlet
    is up-and-running. If the container will start it and call the servlet''s method
    init()—even if you''ve overridden this method, it exists in the superclass HttpServlet.


    Then the container calls the method service() of the servlet''s superclass, which
    redirects the request to doGet(), doPost(), or similar doXX(), passing the arguments
    HttpServletRequest and HttpServletResponse. Your code can get the data entered
    by the user from the HttpServletRequest object with the method getParameter().


    After you get the parameter, process it in the business layer, or as an EJB. The
    result can be implemented as POJOs class. Return the result to the client by getting
    the reference to the PrintWriter object—it knows how to send text data to the
    user. For non-textual use the class OutputStream instead of PrintWriter. For example,
    if you are sending an object containing PDF content by calling setContentType(),
    and you want the browser to automatically open Acrobat Reader, call the Response
    setContentType("application/pdf");


    The servlet controls when the servlet is loaded, and when its init(), service(),
    and destroy() methods are called. The method destroy() is called when a server
    administrator decides to unload the servlet, or when the server is gracefully
    shutting down, or the server needs to provide some resources. The following code
    retrieves the name of the book entered by the user and responds with price of
    $65 dollars:


    # HTTP GET AND POST REQUESTS


    HTTP specification defines several methods for data exchange on the Web, but Get
    and Post are the most widely used ones. If you don''t specify the method, Get
    is used by default. Because the HTML tag <form> in Listing-21 used method=Get,
    the FindBooks method doGet() will be invoked by the container. In this case the
    web browser will append the values entered in the form to the end of the URL'
  merge: -1
  pgno: 336
- img_proc: true
  md: 'after the question mark. For example, if the user enters the word Apollo as
    a book title, the URL may like this:


    ```

    http://mybooks.com?booktitle=Apollo

    ```


    If a form submits multiple values, the URL will include several key/value pairs
    after the question mark. Get it''s easy to copy and bookmark the URL with parameters.
    On the other hand, with Get data is not protected—you can see it in clear.


    The method Post is typically used to send larger amounts of data to the server.
    It''s always used to send binary data to the server. Of course, the log-forms
    use Post because you don''t want the user''s ID and password to be shown in the
    URL. To process Post requests, servers have to override the method doPost().


    It''s common to use Get for data retrieval and Post for both data retrieval and
    modification.


    # SESSION TRACKING


    HTTP is a stateless protocol. If a user retrieves a web page with a list of books
    from the Findbooks servlet or any other server-side program as a result of an
    HTTP request, and then goes to another web page, this session does not know what
    was shown on the first one. To preserve data more than one web page, session tracking
    has to be implemented.


    A session is a logical task, which the user is trying to complete by visiting
    a website. For example, the process of buying a book may involve several steps:
    book selection, input of billing and shipping information, and so on. All of these
    steps combine to form an example of a session. When a purchase is ordered, the
    session is over. To create a session, call the method request.getSession(true).
    Calling this without an argument will give you either reference to the existing
    session or null.


    The session information can be stored either on the client or on the server side.
    On the client side the user''s session data can be stored using cookies (defined
    in the next section) or URL rewriting. The server-side alternative for storing
    session data is a session tracking API that implements the interface java.servlet.HttpSession.


    # Cookies


    A cookie is a small piece of data that a container serves to the web to be stored
    on the disk. On every subsequent request from that client, the cookie is returned
    to the server, uniquely associating the request with a given session. The cookies
    are persistent, but the user may disable them by selecting the appropriate option
    in the web browser. When the session is created, a special cookie, JSESSIONID,
    http.Cookie, is sent to the client. To create:


    ```

    myCookie = new Cookie("bookName","Java Programming 24-hour trainer")

    // Set the lifetime of the cookie for 24 hours

    myCookie.setMaxAge(60*60*24)

    response.addCookie(myCookie);

    ```


    This is how a server can retrieve cookies that arrive with HttpServletRequest:


    ```

    Cookie[] cookies = request.getCookies();

    ```'
