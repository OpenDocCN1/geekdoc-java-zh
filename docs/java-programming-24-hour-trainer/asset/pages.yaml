  md: "# Solution with an Abstract Class\n\nSince increasePay() has to be implemented\
    \ differently for Employee and Contractor, let's declare it as abstract. The class\
    \ Person will also have three concrete methods. The fact that the abstract class\
    \ Person cannot be instantiated forces us, the developers, to implement abstract\
    \ methods in subclasses.\n\nLet's start redesigning the class from the Try It\
    \ section of Lesson 6. That version of the class didn't have the method increasePay(),\
    \ which was part of the Payable interface. As per the previous lesson's assignment,\
    \ add the following concrete methods: changeAddress(), giveDayOff(), and promote()\
    \ (see Listing 7-1).\n\nThis is a different approach from the one in Lesson 6,\
    \ which used interfaces — here some methods are implemented in the superclass\
    \ and some are not. This solution won't be using any interfaces.\n\n# LISTING\
    \ 7-1: Abstract class Person\n\n```\npackage com.practical.java.lesson7;\n\npublic\
    \ abstract public class Person {\n\n    private String name;\n\n    int INCREASE_CAP\
    \ = 20; // cap on pay increase\n\n    public Person(String name) {\n        this.name=name;\n\
    \    }\n\n    public String getName() {\n        return \"Person's name is \"\
    \ + name;\n    }\n\n    public void changeAddress(String address) {\n        System.out.println(\"\
    New address is\" + address);\n    }\n\n    private void giveDayOff() {\n     \
    \   System.out.println(\"Giving a day off to \" + name);\n    }\n\n    public\
    \ void promote(int percent) {\n        System.out.println(\" Promoting a worker...\"\
    );\n        giveDayOff();\n\n        //calling an abstract method\n        increasePay(percent);\n\
    \    }\n\n    // an abstract method to be implemented in subclasses\n    public\
    \ abstract boolean increasePay(int percent);\n}\n```"
