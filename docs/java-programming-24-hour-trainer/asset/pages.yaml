    \ (IOException ie) {\n                ie.printStackTrace();\n            }\n \
    \       }\n\n        System.out.println(\"The Employee object has been serialized\
    \ into \" + \n            \"c:\\practicalJava\\\\BestEmployee.ser\");\n    }\n\
    }\n```\n\nAll Java primitive data types are serializable. All member variables\
    \ of the serializable class must be either Java primitives or reference variables\
    \ pointing to objects that are also serializable. The class"
