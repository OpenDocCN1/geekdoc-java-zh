  md: '# TRY IT


    Your assignment is to make the code shown in the listings work. You''ll need to
    create an Eclipse project and copy to the proper places the code samples from
    the accompanying DVD (Listings 34-1 to 34-5). Then you''ll need to deploy this
    project in GlassFish and run it.


    # Lesson Requirements


    You should have Java and GlassFish v3 server installed.


    > You can download the code and resources for this Try It from the book''s web
    page at www.wrox.com. You can find them in the Lesson34 folder in the download.


    # Hints


    Eclipse IDE for Java EE Developers has a template for the creation of REST resources.
    Right-click the project name, select New, and select RESTful Web Service From
    Pattern (Java EE 6). Eclipse will create for you an annotated class similar to
    the one from Listing 34-2, which you can edit to meet your application''s requirements.


    # Step-by-Step


    +   1. Create a dynamic web project Lesson34 in Eclipse. Then create a package
    com.practical.java.lesson34.


    +   2. Copy the classes Stock, StockResource, and StockService from the DVD into
    the package.


    +   3. Copy the file .xml shown in Listing 34-4 to the directory WebContent/WEB-INF.


    +   4. Create the folder WebContent/css and copy it to the main.css from the DVD
    — this will add some colors to the client''s UI.


    +   5. Deploy the project Lesson34 under GlassFish — right-click the server name,
    select Add and Remove, and in the pop-up window GlassFish from the left name to
    the right one by clicking Clicking. Then click Finish.


    +   6. Open a web browser and go to http://localhost:8080/Lesson34/, which will
    open the file index.html from Listing 34-5. You''ll see something similar to Figure
    34-1.


    +   7. Enter IBM in the search field and click Find. The pricing information (hard-coded)
    about this stock will be displayed as in Figure 34-3.


    +   8. Test the Add New Stock functionality by filling out the form shown in Figure
    34-3 and clicking Adding. This will make a POST request to the RESTful service,
    which will be mapped to the method addStock() of StockResource from Listing 34-2.
    After the new stock has been added you can search for it by entering its name
    in the search field and clicking Find.'
