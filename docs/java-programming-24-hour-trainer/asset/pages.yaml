    \n# CLASSES AND OBJECTS\n\nJava is an object-oriented language, which means that\
    \ it has constructs to represent objects from the real world. Each Java program\
    \ has at least one class that knows how to do certain things or how to represent\
    \ some type of object. For example, the simplest class, HelloWorld, knows how\
    \ to greet the world.\n\nClasses in Java may have methods (aka functions) and\
    \ fields (aka attributes or properties).\n\nLet's create and discuss a class named\
    \ Car. This will have methods, describing what this type of vehicle can do, such\
    \ as start the engine, it shut down, accelerate, brake, the doors, and so on.\n\
    \nThis class will also have some fields: body color, number of doors, sticker\
    \ price, and so on.\n\n+   LISTING 3-1: Class Car\n\n```\nclass Car{\nString color;\n\
    int numberOfDoors;\n\nvoid startEngine {\n    // Some code goes here\n}\nvoid\
    \ stopEngine {\nint tempCounter=0;\n\n```\n\ncontinues"
