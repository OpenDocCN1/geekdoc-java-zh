  md: '# TWO MODES OF MESSAGE DELIVERY


    A program can send or publish a message. If it sends a message to a particular
    queue, and another program receives the message from this queue, we call this
    point-to-point (P2P) messaging. In this mode a message is deleted from a queue
    as soon as it''s successfully received.


    If a program publishes a message to be consumed by multiple recipients, that''s
    publish/subscribe (pub/sub) mode. A message is published to a particular topic
    and many subscribers can subscribe to receive it. The topic represents some important
    news for applications and/or users, for example PriceDropAlert, BreakingNews,
    et cetera. In pub/sub mode a message is usually deleted from a queue as soon as
    all subscribers receive it (read about "How to Subscribe for a Topic")


    Another good example of a pub/sub application is a chat room. A message published
    by one person is received by the other people in the chat room. Developing a chat
    room with JMS and MOM is a trivial task.


    Message delivery can be guaranteed, MOM, just like the post office, will keep
    the message in until the receiver gets it. In this mode messages are persistent—
    the MOM provider stores them in its internal storage, which can be a DBMS or a
    file system. In a non-guaranteed mode MOM will deliver a message only to the receiving
    applications that are up-running at the moment that the message arrives.


    # JMS API OVERVIEW


    JMS is a pretty simple API that includes Java classes that enable you to send
    and receive messages. Following are the names of the major JMS interfaces and
    a short description of each. All of them are defined in the package jms. All Java
    EE 6 JMS classes and interfaces are listed at http://download.oracle.com/javaee/6/api/javax/jms/package-summary.html,
    but I''ll just give you the summary of the main ones.


    +   - Queue is a place to put (or get) your messages. The messages will be retrieved
    using the first in out (FIFO) producer. A message producer (sender) puts messages
    in a queue and a message consumer (receiver) de-queues them.

    - Connection is an interface (it extends Connection) that represents a particular
    connection to MOM (and plays a similar role to the JDBC class Connection).

    - QueueFactory is an object that creates Connection objects (just the JDBC class
    DataSource does).

    - QueueSession is an object that represents a particular session between the client
    and the MOM server. QueueConnection creates a session object.

    - QueueSender is an object that actually sends messages.

    - QueueReceiver receives messages.

    - TopicPublisher publishes messages (it has a similar functionality to QueueSender).'
  merge: -1
  pgno: 372
- img_proc: true
  md: '+   - TopicSubscriber is an object that receives messages (it has a similar
    functionality to QueueReceiver).


    +   - Topic is an object that is used in pub/sub mode to represent some important
    application event.


    +   - TopicPublisher publishes messages to a topic so the TopicSubscriber can
    subscribe to it.


    +   - Message is an object that serves as a wrapper to an application-specific
    object that can be placed in a JMS queue or published to a topic.


    # TYPES OF MESSAGES


    Every message contains a header and optional body and has facilities for providing
    additional properties. The header contains the message identification (unique
    message ID, destination, type, et cetera). The optional properties can be set
    by a program to tag a message with application-specific data, for example Urgentorder.


    The optional body contains a message that has to be delivered. Following are the
    types of JMS messages that you can place in a message body. All interfaces are
    inherited from javax.jms.Message.


    +   - TextMessage is an object that can contain any Java String.


    +   - ObjectMessage can hold any Serializable Java object.


    +   - BytesMessage holds an array of bytes.


    +   - StreamMessage has a stream of Java primitives.


    +   - MapMessage contains any key/value pairs, for example id=123.


    # HOW TO SEND A MESSAGE


    Queues have to be preconfigured in MOM and their names must be known before a
    program can start messages. In the real world MOM server administrator manages
    queues and other messaging artifacts. When Java developers get to know the queue
    parameters, they have a choice of creating message objects (such as ConnectionFactory
    and Queue) programmatically every time they need to send or receive a message,
    or pre-creating objects bound to some kind of naming service (you''ll see examples
    in Lesson 31).


    A program has to perform the following steps to send a message:


    +   Create (or get from naming server) a ConnectionFactory object.


    +   Create a Connection object and call its start() method.


    +   Create a Session object.


    +   Create a Queue object.


    +   Create a MessageProducer object.'
