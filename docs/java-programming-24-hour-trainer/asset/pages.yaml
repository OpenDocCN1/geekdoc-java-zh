  md: '# JDBC DRIVER TYPES


    A JDBC driver plays the role of the middleman between a Java program and a DBMS.
    Drivers are available from database vendors, from Oracle, and from third-party
    vendors of Java application servers.


    There are four general types of JDBC drivers.


    A Type 1 driver is a JDBC-ODBC bridge that enables Java programs to work with
    the database using ODBC drivers from Microsoft. The drawbacks of ODBC drivers
    are that they are slower than the others, must be installed and configured on
    each user''s machine, and work only on Windows machines. The Type 1 JDBC drivers
    are rarely used.


    A Type 2 driver consists of Java classes that work in conjunction with the non-Java
    native drivers provided by the DBMS vendor. These drivers work much faster than
    Type 1, but also require installation and configuration on the machine on which
    Java programs run.


    A Type 3 driver is called a middleware driver and can be provided by vendors of
    application servers. It consists of two parts: the client performs a DBMS-independent
    SQL call, which is then translated to a specific DBMS protocol by the server portion
    of the driver.


    A Type 4 driver is a pure Java driver, which usually comes as a .jar file and
    performs direct calls to the database server. It does not need any configuration
    on the client machine, other than including the name of the main class in your
    Java code. That''s also known as the thin driver. For example, Java applets can
    be packaged with this type of driver, which can be automatically downloaded to
    the user''s machine along with the applets themselves.


    For simplicity I''ll be using JDBC drivers of Type 4 in this lesson, but many
    production systems can deploy Type 3 drivers to provide better performance.


    # CREATING A DATABASE WITH DERBY


    In this lesson I''ll be using an open-source DBMS JavaDB (also known as Derby),
    which is packaged with Java 6. It''s a small DBMS that you wouldn''t use for serious
    production systems, but it''s great for learning JDBC or to use for small systems.
    If you''ve installed Java SDK as instructed in Lesson 1 (see Figure 1-2), you
    already have JavaDB installed in the folder c:\Program Files\Sun\JavaDB. Modify
    your system variable PATH so it starts with the following code:


    c:\Program Files\Sun\JavaDB\bin;


    To make sure that you changed PATH, open a command window and enter sysinfo. This
    command should print information about your Java environment, and you should find
    a reference to Derby and JDBC 4.0, as shown in Figure 22-1.


    If you don''t have JavaDB installed, download and install it from http://db.apache.org/derby.
    Derby is well documented and if you haven''t had a chance to work with relational
    DBMSes, download and read the "Getting Started with Derby" manual.


    Derby has an interactive command-line utility ij that you can use to create databases
    and tables and populate them with data, among other actions. I''ll show you how
    to create a sample'
