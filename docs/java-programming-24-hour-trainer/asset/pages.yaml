  md: "In the older version of Java, to ensure that all application-specific data\
    \ would modify the GUI via this queue, developers used the method invokeLater()\
    \ to ensure UI changes were placed in the Event Queue:\n\n```\nSwingUtilities.invokeLater(\n\
    \  new Runnable() {\n    public void run() {\n      // Do some processing here\n\
    \      //... and update the UI\n      myTextField.setText(someData);\n    }\n\
    \  });\n```\n\nWhile this technique still works, it clots the code with anonymous\
    \ Runnable classes. The class javax.swing.SwingWorker gives you a cleaner (though\
    \ not necessarily simpler) means of dealing with the dispatch thread. This thread\
    \ implements Runnable and Future, and so can be submitted to the Executor for\
    \ execution and return a result.\n\nLet's say a Swing application needs to make\
    \ a request to the server to get the market information, which may take a couple\
    \ of seconds. So that the UI will not be frozen for these seconds, this request\
