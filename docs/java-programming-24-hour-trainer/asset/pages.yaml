  md: "# THE STOCK QUOTE PROGRAM\n\nIn this section you'll learn how to write a program\
    \ that can read stock market price quotes from the Internet. There are many Internet\
    \ sites providing such quotes; the Internet portal Yahoo! is one of them.\n\n\
    Visit http://finance.yahoo.com, enter the symbol of any stock, MOT for example,\
    \ and get the Quotes listed. You'll see the pricing information about Motorola,\
    \ Inc — a fragment of this webpage is depicted in Figure 18-1.\n\nBut what's more\
    \ interesting for our goal is the URL that is displayed in the Web browser:\n\n\
    ```\nhttp://finance.yahoo.com/?q=MOT\n```\n\nRight-click this web page and select\
    \ Source from the pop-menu to see the HTML content of this page; you will see\
    \ lots of HTML tags, and the information from MOT will be buried where deep inside.\
    \ Modify the line in the class WebsiteReader from Listing 18-1 to have it print\
    \ the content of this system on the console:\n\n```\nurl = new URL('http://finance.yahoo.com/?q=MOT');\n\
    ```\n\nYou can also store the whole page in a Java String variable instead of\
    \ printing the lines. Just modify the while loop in Listing 18-1:\n\n```\nString\
    \ theWholePage;\nString txt;\nwhile (txt = buff.readLine()) != null) {\n    theWholePage=theWholePage\
    \ + txt;\n}\n```\n\nIf you add smart tokenizing (splitting into parts based on\
    \ the specified tokens as in Listing 18-4) of theWholePage, to get rid of all\
    \ HTML tags and use Last info, you can create your own little Stock Quote program.\
    \ This approach is useful to sharpen your tokenizing skills, it might not be the\
    \ best solution, especially if Yahoo! changes the wording it uses on this page.\
    \ That's why we'll be using another URL that provides quotes in a cleaner comma-separated\
    \ values (CSV) format. Here's the URL that should be used for the symbol MOT:\n\
    \n```\nhttp://quote.yahoo.com/quotes.csv?s=MOT&f=alldltcl0hgv&e=.csv\n```\n\n\
    This URL produces a string that includes the stock symbol, last trade, date and\
