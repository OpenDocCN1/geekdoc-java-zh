  md: "# LESSON 3 OBJECT-ORIENTED PROGRAMMING\n\nThe empty parentheses after the method\
    \ name mean that it does not have any arguments or, in other words, it does not\
    \ use any values from outside Tax to perform calculations. As a matter of fact,\
    \ this version of calcTax() doesn't use any data for calculation — it returns\
