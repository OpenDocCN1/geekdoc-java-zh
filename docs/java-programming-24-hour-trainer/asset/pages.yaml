  md: "myCart.addItem(mySecondItem);\n\n// The client is ready to check out\n\n...\n\
    \nmyCart.placeOrder();\n\nTo complete the shopping process and release the state\
    \ bean for other clients you need to call one of the bean's MyShoppingCart methods\
    \ marked with the @Remove annotation. In the preceding example the method placeOrder()\
    \ should be marked with the this annotation. You should also provide another @Remove\
    \ method on the bean to allow the client to cancel the order and release the bean.\n\
    \nThere is one more way to release a state bean, by using the @StatefulTimeout\
    \ annotation, which enables you to specify how long a bean can stay allocated\
    \ to the client without any activity. When this time expires the session times\
    \ out and the bean is released.\n\n# SINGLETON BEANS\n\nOften an application needs\
    \ a place to keep data that is accessible to and shared by all the beans. Another\
    \ use case for a singleton is to control access to external resources. For example,\
    \ if a limited number of connections are available to some external web service,\
    \ you can create a singleton that implement throttling for EJBs that need these\
    \ connections. A singleton bean can be used as global storage (or a cache) for\
    \ the application — the state of this bean is shared among clients.\n\nOnly one\
    \ bean with any given name can exist per JVM application. If you need several\
    \ singletons in an application, give them different names. An EJB container doesn't\
    \ create pools of singleton beans. To create a singleton EJB just mark it with\
    \ the @Singleton annotation:\n\n```\n@Singleton\npublic class MyGlobalStorage\
    \ {\n    }\n```\n\nWhen is the singleton bean created? It's up to the EJB container\
    \ to decide, unless you specifically want to request this bean created on application\
    \ startup. This is called eager initialization and there is a special annotation,\
    \ @Startup, for it:\n\n```\n@Startup\n@Singleton\npublic class MyGlobalStorage\
    \ {\n    private Map<String, Object> storage = new HashMap<String, Object>();\n\
    \n    void addToStorage(String key, Object objToStore) {\n        //...\n    }\n\
    \n    void removeFromStorage(String key) {\n        //...\n    }\n}\n```"
