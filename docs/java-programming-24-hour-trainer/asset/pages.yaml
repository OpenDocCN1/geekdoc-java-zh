    The layout manager java.awt.BorderLayout divides a container into South, West,
    North, East, and Center areas. The North area stays on top of the window, South
    at the bottom, on the left, and East on the right. For example, the calculator
    shown in Figure 8-6, a text field that displays numbers is located in the North
    area, and the panel p2 in the West.


    You can use the following code to create a BorderLayout and place a text field
    here:


    ```

    BorderLayout bl = new BorderLayout();

    this.setLayoutManager(bl);


    JTextField txtDisplay = new JTextField(20);

    this.add(BorderLayout.NORTH, txtDisplay);

    ```


    You are not required to have window controls in all five areas. If you need North,
    Center, and South areas, the Center area will become wider because you are not
    going to use the East and West areas. I''ll use a BorderLayout later in this lesson,
    but in the next version of our calculator: Calculator.java.


    # Combining Layout Managers


    You do think that GridLayout will enable you to design a calculator that looks
    like the one that comes with Microsoft Windows, shown in Figure 8-6? Unfortunately
    it won''t, because cells have different sizes — the text field is wider than the
    buttons. You can, however, combine layout managers by using panels that have their
    own managers.


    To combine layout managers in the new version of our calculator, do the following:


    +   - Assign the border layout to the content panel of the frame.

    - Add a JTextField to the North area of the frame to display the numbers.

    - Create a panel, p1, with GridLayout, add 20 buttons to it, and add it to the
    Center area of the content pane.

    - Create a panel, p2, with GridLayout, add four buttons to the panel, and add
    p2 to the West area of the content pane.'
