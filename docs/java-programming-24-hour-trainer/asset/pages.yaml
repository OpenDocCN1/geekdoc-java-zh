  md: '# 25


    # Remote Method Invocation


    So far most of the Java programs in this tutorial have been running in one JVM.
    There were two exceptions: In Lesson 18 you used two JVMs while learning about
    socket programming, and your JDBC programs from Lesson 22 communicated with another
    JVM database server. The application running on the user''s computer isn''t always
    allowed to access remote data directly—that''s one of the reasons distributed
    Java applications came into the picture. (The word distributed means parts of
    the applications running on several computers). The other reason was to provide
    a centralized server catering to multiple lightweight clients.


    There are lots of ways to create distributed Java applications that run on more
    than one JVM, and Remote Method Invocation (RMI) is one of them even though it''s
    being used seldom these days. For example, a client Java application (JVM1) connects
    to a server Java application (JVM2), which connects to the DBMS on a third computer.
    The client application knows nothing about the DBMS; it gets the data from an
    ArrayList of Employee objects, from the server''s application that runs in JVM2.
    RMI uses object serialization for the data exchange between JVM1 and JVM2.


    Unlike with socket programming, where the client explicitly connects to the server,
    with RMI one Java class can invoke methods on Java objects that live in another
    (remote) JVM. Although from a syntax perspective it looks as if the caller and
    the server''s class are located in the same JVM, they may be thousands of miles
    away. The RMI client won''t have a copy of the server-side method; it''ll just
    have the method''s local representative—a proxy, or using the RMI terminology,
    stub.


    Any RMI application consists of an RMI server, a client, and the registry (a naming
    service). These three components could run on three JVMs running on different
    networked computers. The RMI server creates Java objects that implement business
    logic, registers them with the naming service, and waits for remote clients to
    invoke methods on them.


    A client application gets a reference to a remote server object or objects from
    the registry and then invokes methods on this remote object. The main concept
    of RMI is that even though the'
  merge: -1
  pgno: 308
- img_proc: true
  md: 'methods are called in the client''s JVM, they are executed on the server''s!
    RMI supporting classes and the registry tool are included with the Java SE.


    # DEVELOPING APPLICATIONS WITH RMI


    This lesson is written as an illustration of a sample RMI application with a minimum
    theory. For a more detailed description of RMI please refer to the following website:
    http://download.oracle.com/javase/6/docs/technotes/guides/rmi/index.html.


    Writing distributed RMI applications involves the following steps:


    +   1. Declaring the remote interface.

    2. Implementing the remote interface.

    3. Writing a Java client that connects to the remote server and calls remote methods.

    4. Starting the registry and registering the RMI server with it.

    5. Starting the server and the client applications.


    Let''s perform each of these steps by developing the RMI version of the Stock
    Quotes Server (see its version with sockets in Lesson 18), which will provide
    a client with price quotes for a specified stock. Some of the following steps
    could be combined, but for simplicity I''ll write a separate class for each required
    action.


    # Defining Remote Interfaces


    The classes that you are planning to deploy on the server side have to implement
    remote interfaces, which declare business method(s) to be invoked remotely by
    RMI clients. The client''s code will look like it''s calling local methods, but
    these calls will be redirected to a remote server via the RMI protocol. Here are
    the rules for creating remote interfaces:


    +   - The remote interface must declare public methods to allow clients to perform
    remote method invocation.

    - The remote interface must extend java.rmi.Remote.

    - Each method must declare java.rmi.RemoteException.

    - Because method arguments and returned data will be traveling across the network
    by Java serialization, their data type must be Serializable.


    You start developing the server side of any distributed Java application by answering
    the question "What business methods have be exposed to the client applications
    and what should their signatures be?" When you know the answer, define remote
    interfaces that declare those methods.


    25-1 shows the code of the StockServer remote interface that will be implemented
    on the server but must exist on the client side too. This interface declares two
    business methods: getQuote() and getNasdaqSymbols(). The first will generate a
