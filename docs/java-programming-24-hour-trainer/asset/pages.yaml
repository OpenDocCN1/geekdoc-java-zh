  md: "# ReentrantLock versus Synchronized\n\nThe package java.util.concurrent.locks\
    \ includes the class ReentrantLock, which can be used as a replacement for the\
    \ synchronized keyword. Using it may improve the performance of your code. The\
    \ idea is to place a lock before the section of your program that may cause a\
    \ race condition, and to remove the lock afterward. The next code snippet is a\
    \ revision of the code shown in Listing 20-12:\n\n```\nprivate Lock accountLock\
    \ = new ReentrantLock();\n\nvoid withdraw(int accountID, int amount) {\n    //\
    \ Some thread-safe code goes here, i.e. reading from\n    // a file or a database\n\
    \n    accountLock.lock(); // place a lock when this thread enters the code\n\n\
    \    try {\n        if (allowTransaction(accountID)) {\n            updateBalance(accountID,\
    \ amount, \"Withdraw\");\n        } else {\n            System.out.println(\"\
    Not enough money on the account\");\n        }\n    } finally {\n        accountLock.unlock();\
    \ // allow other threads to update balance\n    }\n}\n```\n\nNote that the lock\
    \ has to be removed in the finally section to ensure that unlocking always executed,\
    \ even if there is an exception thrown from the try block. When the code is unlocked\
    \ it can be given to one of the waiting threads. The class ReentrantLock has an\
    \ overloaded constructor with a boolean argument — if you specify true while creating\
    \ the lock, the control will be given to the longest-waiting thread.\n\nThere\
    \ is another useful class, Condition, that can be associated with the lock. This\
    \ object enables a locked block of code to suspend its execution until other threads\
    \ notify the current one that some condition has become true, e.g., the bank account\
    \ has funds now for you to make a withdrawal.\n\nIf you don't need the flexibility\
    \ offered by the ReentrantLock/Condition class, just use the synchronized keyword\
    \ with notify()/notifyAll() to control thread locking. Or, even better, see if\
    \ one of the concurrent collections (reviewed in the section \"A Brief Introduction\
    \ to Concurrent Collections\") can take care of all your locking needs so you\
    \ don't need to create explicit locks in your code.\n\n# Executor Framework\n\n\
    Creating threads by subclassing Thread or implementing Runnable works, but there\
    \ are certain shortcomings to these approaches. First, the method run() cannot\
    \ return a value. Second, an"
