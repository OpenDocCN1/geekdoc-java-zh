  md: '# LESSON 1 INTRODUCING JAVA


    The Java language is object-oriented (OO), which allows you to easily relate program
    constructs to objects from the real world (more on this in Lessons 3–7).


    There are plenty of technical features that make Java the right choice for many
    projects, and you''ll have a chance to see this for yourself while reading this
    book, watching the screencasts from the accompanying DVD, and deploying all code
    samples from the book on your computer.


    # SETTING THE GOALS


    The goal of this rather slim tutorial is to give you just enough information about
    most of the Java language elements, techniques, and technologies that are currently
    being used in the real world. The first half of the book is more about the Java
    language itself, while the second is about server-side Java technologies, and
    this is where Java shines in the enterprise world.


    The brevity of some of the lessons may make you wonder if it''s even possible
    to explain a subject in just 10 pages while there are whole books devoted for
    the same topic. My approach is to cover just enough for you to understand the
    concept, important terms, and best practices. Prerecorded screencasts on the DVD
    will help you repeat the techniques explained in the lesson on your own.


    There are plenty of additional materials online that will help you to study any
    specific topic more deeply. You''ll be getting a working and practical knowledge
    about Java by using the materials included with this book.


    The goal of this book is not just to get you familiar with the syntax of the Java
    language, but to give you practical Java skills that will allow you to develop
    business applications either on your own or by working as a team member in a larger-scale
    project.


    # THE LIFE CYCLE OF A JAVA PROGRAM


    There are different types of programming languages. In some of them you will write
    the text of the program (aka the source code) and execute this program right away.
    These are interpreted languages (e.g., JavaScript).


    But Java requires the source code of your program to be compiled first. It gets
    converted to machine-specific code or a bytecode that is understood by some run-time
    environment or a virtual machine.


    Not only will the program be checked for syntax errors by a Java compiler, but
    also other libraries of Java code can be added (linked) to your program after
    the compilation is complete (deployment stage).


    In this lesson you write a very basic Java program that will output the words
    "Hello World" on your computer''s screen.


    Technically you can write the source code of your Java program in any plain text
    editor that you prefer (Notepad, TextEdit, vi, etc.), but to compile your program
    you''ll need additional tools and code libraries that are included in the Java
    Development Kit (JDK).'
