    \ applications often store configurable parameters in the .ini files. In general,\
    \ Java applications you'll see their properties in plain text files, XML files,\
    \ database tables, and others.\n\nIn this section you'll see some code illustrating\
    \ how the Java class Properties, which extends Hashtable, can be used to manipulate\
    \ properties using key/value pairs. The class Properties has one restriction that\
    \ Hashtable does not: both the key and the value have to be of type String. In\
