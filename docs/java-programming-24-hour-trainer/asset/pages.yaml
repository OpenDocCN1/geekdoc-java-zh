  md: '# CLASSES HASHTABLE AND HASHMAP


    The Hashtable and HashMap implement the Map interface storing key/value pairs.
    These classes offer a convenient way of storing and accessing the elements of
    a collection: by key. You can assign a key to any Java object and use it as a
    reference. The collections store objects as key/value pairs. Let''s say we need
    to store instances of the classes Customer, Order, and Portfolio in the same collection.
    The code snippet from Listing 14-3 creates these instances first and puts them
    in the collection under some identifiers (keys).


    LISTING 14-3: Hashtable for key/value pairs


    ```

    Customer cust = new Customer("David", "Lee");

    Order ord = new Order(123, 500, "IBM");

    Portfolio port = new Portfolio(123);


    Hashtable data = new Hashtable();

    data.put("Customer", cust);

    data.put("Order", ord);

    data.put("Portfolio", port);

    ```


    The values in quote represents keys by which the objects could be retrieved. In
    this example the keys are represented by the Java class String, but you can use
    any objects as keys. The keys are selected based on the application need, e.g.
    the code in Listing 14-3 could be written in some order management application.


    If you have an idea of how many elements you are planning to store in a Hashtable,
    use another constructor:


    ```

    Hashtable data = new Hashtable(10); // 10-element capacity

    ```


    The method() provides access to these objects via the key. You need to perform
    the proper casting as shown below or use generics (explained in Lesson 15):


    ```

    Order myOrder = (Order) data.get("Order");

    ```


    The method size() returns the number of elements in the Hashtable:


    ```

    int totalElem = data.size();

    ```


    Methods containsKey() and containsValue() help you to find out if the collection
    contains a specific key or value. You can find an example of Hashtable usage in
    Lesson 31.


    The class HashMap is similar to Hashtable, but it allows null as a key or value
    and is not synchronized. If you are writing code that attempts to access the same
    element concurrently without using multi-threading, use HashMap, as it performs
    faster than Hashtable.


    To speed up the lookup, both HashMap and Hashtable index the data by applying
    a so-called hash function that (based on the contents of the object) generates
    a hash code, one number that'
