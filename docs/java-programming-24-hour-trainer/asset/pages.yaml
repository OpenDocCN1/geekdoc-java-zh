    \ of the class Person doesn't have to know the specifics of raising pay, and subclasses\
    \ may be programmed by other developers. But he or she can write code that calls\
    \ increasePay(), as in the method promote(). This is allowed because by the time\
    \ the concrete class is instantiated, this method will have been implemented.\
    \ For simplicity, I didn't write any code that looks like increasing pay — this\
