  md: '# LESSON 10 INTRODUCTION TO JAVA APPLETS


    paint() is called when the applet''s window needs to be displayed or refreshed
    after some activity on the screen, for example, when the applet is overlapping
    with some other window and the browser needs to repaint it. This method will get
    the Graphics object as an argument.


    stop() is called when the user leaves the web page containing the applet.


    destroy() is called when the browser destroys the applet. Write code in this method
    only if the applet uses some other resources — for example, if it holds a connection
    to the remote computer it was downloaded from.


    Though you do not have to program all these methods, each applet must have at
    least init() or paint(). For example, init() is the right place to get some external
    parameters that may be passed to the applet. Say that the HTML file has an <applet>
    tag that looks like this:


    ```

    <applet

    <param name="backgroundColor" value="0xc0c0c0"/>

    </applet>

    ```


