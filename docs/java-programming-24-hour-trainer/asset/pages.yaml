  md: 'If you don''t specify the table name as a parameter of the annotation, JPA
    assumes that there is a corresponding database table with the same name as the
    entity class, which in our example is Employee. The specified strategy GenerationType.IDENTITY
    assumes that DBMS has an auto-generated primary key with auto-increment. Many
    database management systems support either identity columns or sequence objects
    with similar functionality.


    The fields that have values are marked as @NotNull. If an instance of the preceding
    Employee entity won''t have the firstName or lastName fields, Bean Validation
    can catch this and generate an error. The entity fields that don''t have to be
    persisted should be marked with @Transient annotation.


    If a column name is not the same as the name of the entity field, you can specify
    the column name using @Column. According to Listing 33-1, the database column
    name boss_name corresponds to the field managerName of the entity Employee.


    Not every Java class that corresponds to some data in the database has to be an
    entity. You can have embeddable classes that define a group of properties that
    belong to an entity. Let''s say a company gives each employee a smartphone identified
    by a phone number and model number. You can create a Java class to represent such
    a device and mark it with @Embeddable:


    ```

    @Embeddable

    public class Smartphone implements Serializable{


    @Size(max=10)

    public String phoneNumber;


    public String model;

    }

    ```


    Now the Employee entity can embed the property of the Smartphone type along with
    other fields:


    ```

    @Entity

    public class Employee{


    @Id

    @GeneratedValue(strategy=GenerationType.IDENTITY)


    @NotNull

    ```'
