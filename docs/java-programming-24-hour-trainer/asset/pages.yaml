  md: "# LESSON 17 JAVA SERIALIZATION\n\nHere's another use case: Your application\
    \ has a Preferences menu where the user can select fonts, colors, and UI controls\
    \ that should be displayed on the opening view. To support such functionality,\
    \ the Preferences panel creates an instance of a class, UserPreferences, with\
    \ 50 configurable properties (some of which are custom data types) that have to\
    \ be saved in a local file. On the next start of the application previously saved\
    \ data should be read from this file with the re-creation of the UserPreferences\
    \ object.\n\nWriting a manual procedure that uses, DataOutputStream on each primitive\
    \ type and recursively performs the same operation for each non-primitive type\
    \ is tedious. Besides, this code would need to be changed each time the properties\
    \ of class UserPreferences change.\n\nYou can achieve the same result in a more\
    \ elegant way, not one property at a time, but one object at a time, with the\
    \ help of streams as ObjectOutputStream and ObjectInputStream. This process is\
    \ known as Java serialization, which enables you to save objects in a stream without\
    \ short.\n\nClassA will serialize Employee, and ClassB will deserialize (reconstruct)\
    \ this object. To support this the class Employee implements the Serializable\
    \ interface, as shown in Listing 17-1.\n\n# LISTING 17-1: Serializable class Employee\n\
    \n```\nclass Employee implements java.io.Serializable{\n    String iName;\n  \
    \  String fName;\n    double salary;\n\n}\n```\n\nThe interface Serializable does\
    \ not declare any methods, so the class Employee has nothing to implement. If\
    \ an interface does not declare any methods it's called a marker interface.\n\n\
    Two use cases described in this section represent the main uses for Java serialization\
    \ — distribution of the Java objects between different JVMs and object persistence\
    \ for future reuse. Often serialization is implemented internally by various Java\
    \ frameworks to pass objects between tiers of distributed application that runs\
    \ on multiple servers and client components.\n\nSome Java frameworks use serialization\
    \ to load or unload objects to the JVM's memory (these are known as passivation\
    \ and activation of objects, respectively). Later in the book you'll learn about\
    \ RMI and EJB, which use serialization for a lot. But in regular business application\
    \ development you need to serialize and deserialize application-specific objects.\
    \ This process comes down to reading from writing into streams, namely java.io.ObjectInputStream\
    \ and java.io.ObjectOutputStream, respectively.\n\n# THE CLASS OBJECTOUTPUTSTREAM\n\
    \nTo serialize an object perform the following actions:\n\n+   1. Open an output\
    \ stream.\n\n+   2. Chain it with ObjectOutputStream."
