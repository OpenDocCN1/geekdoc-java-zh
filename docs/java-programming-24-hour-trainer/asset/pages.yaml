  md: "# LESSON 37 BRINGING JAVFX TO THE MIX\n\nThe Java EE application server will\
    \ route all HTTP requests with the URL pattern send to the servlet SendMessage\
    \ from Listing 37-6, which will get the text entered by the user and invoke sendMessage()\
    \ on the session bean MessageService. This text will be published to the topic\
    \ jms/StockPrices or any other messages that originate from the singleton PriceProvider.\n\
    \n# LISTING 37-6: SendMessage servlet\n\n```\n@WebServlet(\"send*\")\npublic class\
    \ SendMessage extends HttpServlet {\n\n    @EJB\n    private MessageService messageService;\n\
    \n    protected void doPost(HttpServletRequest request,\n        HttpServletResponse\
    \ response, IOException exception) {\n        String text = request.getParameter(\"\
    *\");\n        messageService.sendMessage(text);\n\n        response.sendRedirect(\"\
    index.html\");\n    }\n}\n```\n\nWhen this JavaFX app is ready for deployment\
