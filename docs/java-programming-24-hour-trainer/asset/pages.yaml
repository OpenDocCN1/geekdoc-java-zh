    \ JAVA PROGRAMS\n\nIn programmer's l a bug is an error in a program that causes\
    \ the program to work in an unexpected way. Don't confuse a bug with a syntax\
    \ error in the code. The latter will be caught by the Java compiler before you\
    \ even start the program, while bugs are run-time enemies. To debug a program\
    \ is to identify and find the run-time errors in code.\n\nThe simplest way to\
    \ debug a program is to print the value of the \"suspicious variables\" with System.out.println()\
    \ or the like. You may think that a certain variable will get a particular value\
    \ during the execution, but you might be wrong, and printing its value from the\
    \ running program may reveal why your code produces unexpected results.\n\nJava\
    \ also comes with a logging API (application program interface) that allows you\
    \ to log the run-time values in a file or other destination. Logging is out of\
    \ the scope of this book, but you can find Logger and other supporting classes\
    \ in the Java package java.util.logging.\n\nYou'll be using a debugger that comes\
