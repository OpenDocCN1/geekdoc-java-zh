  md: "# LOADING JSP FROM SERVLETS\n\nsession: The bean is available for all pages\
    \ until the user's session ends (see the section \"Session Tracking\") in Lesson\
    \ 27).\n<jsp:useBean id=\"Student\" class=\"com.harward.Student\" scope=\"session\"\
    \ /> web designer\n\napplication: The bean is available for all users and all\
    \ pages — this is a global bean.\n<jsp:useBean id=\"Student\" class=\"com.harward.Student\"\
    \ scope=\"application\" />\n\nIn line with the separation of presentation and\
    \ processing, JSP should have a bare minimum of any processing. When the servlet\
    \ receives the data to be sent to the user, instead of sending the client hard-coded\
    \ HTML tags it should load and send the JSP page to the client. Ideally, the JSP\
    \ should be laid out by a web designer.\n\nLet's say you have a servlet that needs\
    \ to load a JSP based on user's selection in the HTML window. If you don't need\
    \ to get copies of the request and response objects you'll need to create an instance\
    \ of the RequestDispatcher class and call its method forward(), HttpServletRequest\
    \ and HttpServletResponse as arguments, as shown in Listing 28-3. The servlet\
    \ returns to the Web browser either the JSP showing the data of the Toyota dealer-ship\
    \ or the JSP showing data about Nissan vehicles.\n\n# LISTING 28-3: Servlet loading\
    \ JSP\n\nAvailable for download on Wrox.com\n\n```\npublic class MyServlet extends\
    \ HttpServlet{\n    public void doGet(HttpServletRequest req, HttpServletResponse\
    \ res)\n    throws ServletException {\n\n        ServletContext context = getServletContext();\n\
    \        RequestDispatcher disp = null;\n\n        String make = req.getParameter(\"\
    carName\");\n\n        if (make.equals(\"Toyota\") {\n            requestDisp\
    \ = context.getRequestDispatcher(\"Toyota.jsp\");\n            requestDisp.forward(req,\
    \ res);\n        } else if (make.equals(\"Nissan\") {\n            requestDisp\
    \ = context.getRequestDispatcher(\"Nissan.jsp\");\n            requestDisp.forward(req,\
    \ res);\n        }\n    }\n}\n```\n\nIn some cases the current servlet performs\
    \ all interactions with the user, and just needs to load the code of another servlet\
    \ or JSP. For this purpose use the method include() instead of forward():\n\n\
    ```\nrequestDisp.include(req, res);\n```"
