  md: '# Considering the Offer 437


    What does a good Java developer have to know in addition to understanding the
    difference between abstract classes and interfaces? Usually employers are looking
    for people with knowledge of the following: Java Servlets, JSP, Spring framework,
    EJB, JMS, any commercial message-oriented middleware, JDBC, JNDI, XML, Hibernate,
    Ant or Maven build tools, SQL, one of the major application servers, and a couple
    of relational database management systems.


    Understanding why a particular Java EE component is being used in your current
    project is equally important. If the interviewer asks you, “Why did you use EJB
    in this project?” do not answer, “That decision was made before I joined the project.”
    Have your opinion and explain why you think it was a good or bad choice for this
    particular project.


    Here''s another tip: Don''t critique the architecture of your potential employer.
    You''ll have plenty of chances to provide technical advice if you''re hired, just
    focus on getting an offer.


    Be energetic during the interview and show your interest in the job. If you are
    even a professional guru, don''t behave as if you''re interviewing the interviewer
    a favor by just showing up. Personality matters. People don''t like prima donnas.


    Be prepared to write code on a whiteboard and practice that skill. The interviewer
    might not ask you to do this, but it may be a good idea to start illustrating
    your thoughts on the board if there is one in the room. If there is no board,
    use your notepad. Often interviewers are trying to judge how well you think a
    problem more than how you''ve memorized an algorithm, class name, or method arguments.


    No to rush. If you start a code fragment on a board, don''t be afraid of making
    mistakes. Think aloud. It may be even beneficial for the interviewer to see how
    you can identify the wrong approach and then pick the right one. Practice explaining
    little code fragments to your friends or relatives; they don''t need to know Java
    to participate in these role-playing games.


    After the interview, as soon as you are leaving, take notes about what just happened.
    Don''t postpone until you get home; may make a note to work on the questions you
    might not answered correctly. These questions require your attention and research.
    Improve your technical skills after each interview.


    # CONSIDERING THE OFFER


    You''ve got an offer! Now think about whether you want to accept it. Have I mentioned
    that you should look for a new job not when your employer decides to let you or
    your contract ends, but when the job is blue, and the grass is green? This gives
    you a tremendous advantage: You can consider the offer without being under pressure
    from unpaid bills.


    Don''t accept an offer just because the new job pays an extra $5,000 a year, which
    comes to less than $300 a month after taxes. Do the offer that will give you a
    chance to work with interesting technologies or business applications if it won''t
    pay you an extra dime.


    Other nonmonetary factors of an offer are health benefits, flexible work hours,
    ease of commute, or simply a kinship that you feel with the people working for
    the potential employer. Believe it or not,'
  merge: -1
  pgno: 472
- img_proc: true
  md: 'some people won''t accept offers from employers who require you to wear suit
    and tie. Just make a decision about what''s more important for you — having an
    interesting job or being able to show off your latest tattoos.


    No matter what your preferences are, take charge of your career and actively build
    it the way you want.


    # ## INTERVIEWING ENTERPRISE DEVELOPERS


    When the job market is healthy, major online job search engines show thousands
    of openings, and people are competing for these jobs. These days a seasoned developer
    has to know about 10 different tools or technologies to find a good job and feel
    relatively secure for a couple of years. Over the last several years I have interviewed
    lists Java developers, and this is what I''ve noticed:


    +   - People do not call themselves Java developers or programmer-analysts anymore
    — most of them prefer the Java architecture. Unfortunately, only some of them
    really understand how Java EE components operate and can suggest design solutions.
    Of course, knowledge of Java EE is not all that a Java architect should know.


    +   - Job applicants are more senior, and I barely see any college graduates or
    junior programmers. Many of the junior positions are being outsourced and the
    number of graduates with computer science has declined over the past several years.


    +   - Having software certification does not make a résumé stand. Actually, if
    a résumé stands with a list of certifications, most likely it is a beginner''s.
    I''m not against certifications, as they help you learn a language or course,
    and show that you are willing and can study. But a certificate does not make someone
    a skilled professional.


    +   - With the introduction of middle-tier object-relational mapping frameworks
    such as Hibernate, many people don''t even bother learning how database management
    systems work or how to write a SQL query that performs well — they just map Java
    classes to database tables.


    +   - In a slow economy, be prepared to pass at least four interviews to get hired.
    In 1999 in 2001 it was very difficult to get an interview, let alone a job!


    +   - In 2010 a large portion of the development is done in India. Even though
    the total cost of development is not lower the hourly rates of offshore developers,
    Western managers unfortunately make an impression that local candidates must be
    flexible in their rates, too. Being a native English speaker is not enough to
    charge top dollar. Although be technically current, the more motiva guests from
    overseas will leave you in the dust.


    Good knowledge of the business terminology of your potential employer is important.
    I''m not sure about the Silicon Valley or Europe, but here in New York just being
    a techie might not be good enough to get to a senior job. Of course, interviewing
    with Google or Microsoft is an exception.


    For example, if you''re applying for a Java position in a financial brokerage
    company and not know what a short sale is, this may be a deal breaker. If you
    are a senior developer you should be able to hit the ground running: Try to find
    out from your recruiter as many details as possible about the business. Do your
    homework, and you''ll get the job! Recruiters are desperately looking for good
    programmers and you can be one of them.'
