  md: '# JDK AND JRE


    If you are planning to use a specific computer to develop Java programs, you''ll
    need to download and install JDK. If you are planning to use this computer only
    to run Java programs that were compiled somewhere else, you just need the Java
    Runtime Environment (JRE).


    If you have JDK installed on your machine, it includes JRE.


    Java''s platform independence comes from the fact that your Java program doesn''t
    know which operating system (OS) or on which hardware it is being executed. It
    operates inside the preinstalled JRE that is pretty much the same on every platform.


    Since you''ll be learning how to develop Java programs, download JDK from the
    following website: http://www.oracle.com/technet/java/javase/downloads/jdk6-jsp-136632.html.


    # JAVA SE AND EE


    But before rushing to the downloading process, you need to get familiar with two
    terms: Java SE (Standard Edition) and Java EE (Enterprise Edition). The latter
    includes the server-side tools and libraries that you''ll get familiar with Lesson
    26.


    For now, just download the latest version of the JDK SE Development Kit (The letter
    U followed by a number represents the update number of Java 6).


    Select the platform (Windows, Linux, Solaris) on which you are planning to develop
    Java programs and continue the download process.


    > JDK for Mac OS X is preinstalled on Apple''s computers and no additional installing
    is required. The current version of JDK, which comes with computers running Snow
    Leopard, is JDK 6. It''s located in /Library/Java. In this book we will be using
    Java for the Windows OS, but Java is cross-platform and the book examples will
    work under MAC OS and Linux as well.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_38_0.png)


    # DOWNLOADING AND INSTALLING JDK IN WINDOWS


    After selecting the Windows platform and clicking the Download button you''ll
    see a Login for Download screen, which is optional: You can skip this step.


    Click Save File on the pop-up screen, as shown in Figure 1-1 (the file name depends
    on the version of JDK).


    FIGURE 1-1'
