  md: '# 442 | LESSON 38 JAVA TECHNICAL INTERVIEWS


    Q: What do you know about the method invokeLater()?


    A: This method is defined in the class SwingUtilities and is used to ensure that
    Swing windows are updated through the event-dispatching thread. You can also do
    this with the SwingWorker class.


    Q: What''s the difference between creating threads subclass class Thread and implementing
    the Runnable interface?


    A: Thread creation with the class Thread requires that your class be inherited
    from it. Then you need to create an instance of your class and call its start()
    method. If a class implements the Runnable interface the procedure is different
    — you have to create the instance of your class, and the instance of the Thread
    object, passing the Runnable class to the latter. Using Runnable enables you to
    create threads from classes that have to be inherited from classes other than
    Thread classes.


    Q: How can you create a thread that can return a value from its method run()?


    Q: What would you use to compare two String variables — the equals() method, or
    the == operator?


    A: I''d use equals() to compare the values of the Strings, and the == operator
    to check if two variables point to the same String object in memory.


    Q: What do you know about the MVC design pattern?


    A: MVC stands for the model-view-controller design pattern, which is used to separate
    presentation modules from business logic and data ones. The model part represents
    the data and the business logic of the application, the view is a visual representation
    (for example, a UI), and the controller accepts the data from the view and passes
    it to the model and vice versa. For example, a JSP page is a controller, a Servlet
    is a controller, and a Java bean represents a model.


    Q: How can you reduce the time spent by JVM on creating frequently used instances
    of some objects?


    A: I''d create my own or configure existing object pools (e.g., DataSource or
    EJB objects) can be configured to use object pools of a certain size.


    Q: Will the following statement create the file xyz.txt on disk?


    ```

    File a = new File("xyz.txt");

    ```


    A: No, it just creates an object pointing to this file.


    Q: How can a subclass invoke a method defined in a superclass?


    A: Java has the keyword super. If a method has been overridden, but you''d like
    to invoke its version defined in the superclass, use the following syntax: super.myMethod();
    To call a constructor of the superclass, write super(); in the first line of the
    subclass''s constructor.'
