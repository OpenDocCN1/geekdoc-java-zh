  md: "# switch Statement\n\nThe switch statement is an alternative to if. The case\
    \ label in the switch condition (taxCode) is evaluated and the program goes to\
    \ one of the following case clauses:\n\n```\nint taxCode=someObject.getTaxCode(grossIncome);\n\
    switch (taxCode) {\n    case 0:\n        System.out.println(\"Tax Exempt\");\n\
    \        break;\n    case 1:\n        System.out.println(\"Low Tax Bracket\");\n\
    \        break;\n    case 2:\n        System.out.println(\"High Tax Bracket\"\
    );\n        break;\n    default:\n        System.out.println(\"Wrong Tax Bracket\"\
    );\n}\n```\n\nThe preceding code will call only one println(). Do not forget to\
    \ put the break at the end of each case statement so the program will jump out\
    \ of the switch statement after processing a case; otherwise the code will be\
    \ \"fall-through\" and print more than one line even though a taxCode can have\
    \ only one value.\n\n# Inheritance\n\nIn object-oriented languages the term inheritance\
    \ means an ability to define a new class based on an existing one (not from scratch)\n\
    \nImagine the class Tax calculates tax properly in all states except New Jersey,\
    \ which has introduced educational tax deductions. If you have a kid in college,\
    \ this makes you eligible for an additional $500 deduction from your taxes. In\
    \ this case you have to change the method calcTax() in the class Tax to introduce\
    \ a special case for New Jersey, or create another class based on Tax and add\
    \ this new functionality.\n\nEvery person inherits some features from his or her\
    \ parents. A similar mechanism exists in Java. The special keyword extends is\
    \ used to indicate that one class has been inherited from another:\n\n```\nclass\
    \ NJTax extends Tax {\n    }\n```\n\nThe NJTax will have all the features the\
    \ class Tax has, plus you can add new properties and methods to it. In such setup,\
    \ the class Tax is called a superclass, and NJTax is called a subclass. You can\
    \ also use the ancestor and descendant, respectively. This new class will have\
    \ access to all variables and methods of its superclass, unless those has a private\
    \ or package access level, which will be discussed in Lesson 5."
