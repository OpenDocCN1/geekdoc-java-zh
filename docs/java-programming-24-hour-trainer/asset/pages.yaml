    # Server-Side HttpSession


    You should keep the data that belong to a user''s session (such as the shopping
    cart) inside the java.servlet. object in the servlet container, which creates
    one such object per client. The servlet can store any Serializable objects. The
    following lines create a session object (or finds a previously created one):


    ```

    HttpSession mySession = request.getSession(true);

    ```


    The call getSession(true) means "find this client''s session object or create
    a new one if no object is found." Usually the shopping process consists of a number
    of subsequent servlet lists (list an inventory, add to the shopping cart, enter
    shipping information, etc.). The method getSession(true) should be used in the
    first servlet that opens the business process that can be called a user session.
    At this moment the application server generates a unique session ID and sends
    it to the user''s browser using either a cookie or URL rewriting.


    The call getSession(false) means "find my session object," assuming that it has
    been created in the previous steps of the session. If this call returns null,
    the session object has been destroyed and you might want to display a message
