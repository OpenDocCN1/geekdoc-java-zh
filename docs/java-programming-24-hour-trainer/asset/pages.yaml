  md: "# 296 | LESSON 27 PROGRAMMING SERVLETS\n\nIf you properly deploy this servlet\
    \ on MyBooks.com, the HTML client from Listing 27-1 will get as a response web\
    \ page containing the text \"Hello from FindBooks.\" Note that the import includes\
    \ classes from the javax.servlet package, which is not included with Java SE —\
    \ you need Java EE 6 SD installed. GlassFish server with Java EE 6, but if you\
    \ are using a different container you can get it from www.oracle.com/technet/network/javaee/downloads/index.html.\n\
    \n# HOW TO DEPLOY A SERVLET\n\nThe annotation @WebServlet is where you specify\
    \ servlet deployment parameters. Prior to Java EE 6 you needed to specify deployment\
    \ parameters in an XML file, but now that was optional. Our FindBooks servlet\
    \ uses the deployment parameters urlpatterns and name. The former is used to match\
    \ one of the servlets deployed on the server to the URL. The value /books means\
    \ that when the client requests aing pattern books in the URL, the request will\
    \ be redirected to the FindBooks servlet. For example, the servlet container will\
    \ send the request http://localhost:8080/books to the FindBooks servlet.\n\nEach\
    \ application server and servlet container has a directory known as document root.\
    \ It is used not only for servlet-based websites, but also for the deployment\
    \ of static HTML files. For example, if you put the HTML file TermsConditions.html\
    \ in the subfolder legal of the document root of the server MyBooks.com, users\
    \ would need to direct their web browsers to www.mybooks.com/legal/TermsConditions.html.\n\
    \nIn the GlassFish application server the document root is the directory /glassfish/domains/domain/root.\
    \ Apache Tomcat is the directory webapps. If you are planning to create a servlet,\
    \ its deployment directory will also be in the document root, but it will contain\
    \ the subdirectories WEB-INF and META-INF.\n\nWEB-INF will have the subdirectories\
    \ classes and lib and the optional file web.xml. The latter is optional if you\
    \ can specify both annotations and web.xml, the values in this file will override\
    \ the corresponding values in annotations. This allows changing deployment parameters\
    \ without requiring recompilation of the servlets. The WEB-INF directory also\
    \ may the file sun-web.xml, in which it stores the context root, which is the\
    \ root directory of your Web application as well as the part of the URL that's\
    \ used to access your application in the browser (/Lesson/27 in our case).\n\n\
    The directory META-INF may have files containing metadata about this application,\
    \ like manifest or other data specific to a third-party framework or application\
    \ server container. For example, Apache Tomcat has a file context.xml where you\
    \ may find information about the JDBC provider. This directory may also contain\
    \ the file web-fragments.xml, which is a module of deployment used by third-party\
    \ frameworks to store their specific deployment parameters.\n\nThis is what the\
    \ directory structure of the application deployed in the document root can look\
    \ like:\n\n```\ndocument root dir\nWEB-INF\n  Classes\n  Com\n```"
