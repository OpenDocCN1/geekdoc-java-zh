  md: '# LESSON 30 INTRODUCING JMS AND MOM


    The code in Listing 30-1 uses an Open MQ-specific implementation of JMS''s ConnectionFactory.
    After you read the section "Administering Objects in Open MQ" later in this lesson,
    you''ll understand why these lines refer to localhost and port 7677.


    # HOW TO RECEIVE A MESSAGE


    The program that receives messages is called a message consumer. It can be a standalone
    Java program or a special type of enterprise Java called a message-driven bean
    (MDB). You can receive messages either synchronously, using the receive() method,
    or asynchronously by implementing the MessageListener interface and programming
    a callback onMessage().


    Under the hood, the receive() method uses a polling mechanism that constantly
    asks for a message. It blocks program execution until the message is received
    or the specified time expires:


    ```

    QueueReceiver queueReceiver = Session.createReceiver(ioQueue);

    Message myMessage = queueReceiver.receive(0);

    ```


    The next line shows how to set a timeout of 500 milliseconds:


    ```

    Message myMessage = queueReceiver.receive(500);

    ```


    Using an asynchronous callback onMessage() is the best way to receive messages
    because the message consumer is not sending multiple requests to MOM just to see
    if the message is in the queue. The callback method onMessage() will be called
    immediately when a message is put in the queue. The listener class must perform
    the following steps to receive messages:


    +   1. Create (or get from some naming server) the QueueConnectionFactory object.

    2. Create a Connection object and call its start() method.

    3. Create a Session object.

    4. Create a Queue object.

    5. Create a QueueReceiver object.


    +   6. If your class implements MessageListener (see Listing 30-2) write implementation
    of the callback method onMessage(). If you want to get messages synchronously,
    just call the QueueReceiver.receive() method. In this case implementation of the
    MessageListener interface is not needed.


    +   7. Close the Session and Connection objects to release the system resources.


    The sample class MyReceiver in Listing 30-2 shows how to consume messages from
    the TestQueue asynchronously. Its constructor creates JMS objects and registers
    itself as a message listener. The callback onMessage() has code for processing
    the received messages.'
