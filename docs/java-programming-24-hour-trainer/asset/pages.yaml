    \ methods in the JSP page the same way:\n\n```\n<! private void myMethod() {\n\
    \  ...\n%>\n```\n\nThe code contained in the declaration block turns into the\
    \ Java code in the generated servlet.\n\n# Expressions\n\nExpressions start with\
    \ <= and can contain any Java expression, which will be evaluated. The result\
    \ will be displayed in the HTML page, replacing the tag itself, like this:\n\n\
    ```\n<= salary*1.2 %>\n```\n\n# Scriptlets\n\nInitially scriptlets were created\
    \ to give JSP developers a place to put any valid Java code to be included in\
    \ the generated servlet's _jspService() method, which is an equivalent of the\
    \ servlet's method service(), for example a scriptlet can look like this:\n\n\
    ```\n<% lastName = \"Smith\"; %>\n```\n\nWith the creation of JSP Standard Tag\
    \ Libraries (JSTL) and Expression Language (EL) there is now no need to use scriptlets,\
    \ but this syntax still works.\n\n# Comments\n\nComments that start with --% and\
    \ end with --%> will be visible in the JSP source code, but not included in the\
    \ resulting HTML page.\n\n```\n<-- Some comments --%>\n```\n\nIf you'd like to\
    \ keep the comments in the web page, use regular HTML comment notation:\n\n```\n\
    <!-- Some comments -->\n```\n\n# Standard Actions\n\nThe directive include adds\
    \ the content of the included page during compile time, the element jsp:include\
    \ does during runtime.\n\n```\n<jsp:include page \"header.jsp\" />\n```\n\nThe\
    \ element forward enables you to redirect the program flow from the current JSP\
    \ to another one while preserving the request and response objects. The other\
    \ way of redirecting the flow is to use response.sendRedirect(someURL), but in\
    \ this case new request and response objects are created, which results in a client\
