  md: '# ACKNOWLEDGMENTS


    **FIRST OF ALL** I want to thank my family for understanding that stealing time
    from family to write a computer book is like to OK.


    I''d also like to thank Elliotte Rusty Harold from Google for his valuable comments
    during a technical edit of this book. Elliotte himself has authored more than
    20 computer books (see http://www.elar.com) and is respected in the Java community
    around the world. His comments on my lessons ranged from the philosophical to
    a simple “I don’t agree with this solution.” I have addressed all of them.


    Three people volunteered to help me with the book: Nick Golubev (Singapore), Dmitry
    Danileyko (Russia), and Viktor Gamov (USA). They wrote several code samples for
    the book, which really saved my time! Thank you, guys!


    Big thanks to the Wiley editors for doing a great job of editing and for not cursing
    me for not meeting deadlines.'
