  md: '# # A guru in the field gets you started

    programming with Java


    As one of the most popular languages for building web applications, Java is often
    the first language that programmers learn to use. This self-paced book-and-video
    combination is an ideal introduction to the world of programming with Java. With
    it and the Java Development Kit, you can compile your first program. Assuming
    little or no programming experience, easy-to-follow lessons are reinforced by
    step-by-step instructions on the DVD that demonstrate how to execute each task,
    allowing you to master Java programming quickly and seamlessly.


    Java Programming 24-Hour Trainer:


    +   - Teaches the variety of Java-related technologies that are most in demand

    - Covers the fundamental concepts, important terms, and best practices of programming
    with Java for real-world applications

    - Covers the latest release of Java EE 6 for developing server-side applications

    - Walks through writing and architecting practical Java applications

    - Includes instructions for preparing for technical interviews


    Yakov Fain works as a software architect for Farata Systems, a company that provides
    consulting services in the field of enterprise applications. He has authored several
    technical books and many articles on software development. Sun Micros has nominated
    and awarded Mr. Fair with the title of Java Champion, which has been presented
    to only a hundred and fifty people in the world. He leads the Princeton Java Users
    Group. Yakov''s Twitter id is @yfain.


    Wrox guides are crafted to make learning programming languages and technologies
    easier than you think. Written by programmers for programmers, they provide a
    structured, tutorial format that will guide you through all the techniques involved.


