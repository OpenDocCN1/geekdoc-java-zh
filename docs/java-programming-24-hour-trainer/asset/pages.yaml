  md: "A complete discussion of the Swing library is out of the scope of this book,\
    \ but there are plenty of books and technical articles covering this subject.\
    \ The official Swing tutorial is located at http://java.sun.com/docs/books/tutorial/uiswing.\n\
    \nSwing classes are located in the javax.swing package, and the process of creating\
    \ a UI comes from extending some of these classes to display the UI and respond\
    \ to various user- and system-generated events. You create a top-level window\
    \ with a title and border by instantiating the class JFrame, as in Listing 8-1.\n\
    \n# LISTING 8-1: An empty descendant of JFrame\n\n```\nimport java.swing.JFrame;\n\
    \npublic class HelloWorld extends JFrame {\n\n    public HelloWorld(){\n     \
    \   setSize(200,300);\n        setTitle(\"Hello World\");\n        setVisible(true);\n\
    \    }\n\n    public static void main(String[] args) {\n        HelloWorld myHello\
    \ = new HelloWorld();\n    }\n\n}\n```\n\nThe constructor of this version of Hello\
    \ World sets the size and title of the window and makes it visible. Run this program\
    \ and it will show a empty window, as in Figure 8-1.\n\nJFrame is an example of\
    \ a container that can hold UI controls, which must be instantiated first and\
    \ added to the container. To add a button you can include the following two lines\
    \ to the constructor in Listing 8-1:\n\n```\nJButton button = new JButton(\"Click\
    \ me\");\nadd(button);\n```\n\nThis code work, but it doesn't specify the size\
    \ of the button, where to put it, or whether there should be space between the\
    \ components and the borders. Without layout instructions, the entire empty space\
    \ in Figure 8-1 will be occupied by one big button.\n\nUsually JFrame includes\
    \ other containers, where you'll place controls such as JButton, JTable, and JList.\
    \ Swing comes with layout managers that help you arrange all these controls appropriately.\
    \ A sample coding for creating a JFrame containing goes like this:\n\n+   1. Create\
    \ a JPanel.\n\n+   2. Assign a layout manager to it.\n\n+   3. Instantiate Swing\
    \ controls and add them to the panel.\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_111_0.png)\n\
    \nFIGURE 8-1"
