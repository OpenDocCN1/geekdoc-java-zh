  md: '# INTRODUCTION


    The lessons are short and to the point. The goal is to explain the material quickly
    so you can start applying it hands-on as soon as possible. Some readers may feel
    that more explanation of certain subjects are required, and they are encouraged
    to do some extra research; there are lots and lots of online materials available
    on any Java-related subject. But the coverage of the material given in this book
    definitely helps in understanding what to focus on and what to look for.


    # WHAT YOU NEED TO USE THIS BOOK


    To do the examples in this book, you do not need to purchase any software—freely
    available software—is used here. Installing Java Development Kit and Eclipse IDE
    is explained in the first two lessons, and this is all you need for Lessons 1
    through 25. In Lesson 26, you Java Application Server GlassFish, is used for explanation
    of the materials in Lessons 26 through 34. If you decide to learn third-party
    frameworks Spring and Hibernate, you will need to download and configure your
    software libraries as explained in Lessons 34 and 35. Whenever you need to download
    certain software, detailed instructions are given in the book and/or in the screencasts
    included in the DVD.


    From the hardware perspective, you can use either PC running Windows or one of
    the Apple computers Mac OS. Linux fans are also able to run all book samples.
    You should have at least 1GB of RAM on your computer to run all code examples
    from this book. By adding more memory can make your Java compiler and Eclipse
    IDE work faster.


    # HOW TO READ THIS BOOK


    This book is a tutorial, and I assume in each lesson that the reader is already
    familiar with the materials from those that came before it. If you are new to
    Java, I recommend that you read this book sequentially.


    Each lesson except the last one has a corresponding video screencast on the install
    and which I either work on the assignment or simply install and configure some
    software. Ideally, you should try to do all the assignments from the “Try It”
    sections on your own, and use the videos only if you get stuck or don''t understand
    the instructions. But if you prefer to learn by following the instructor, just
    watch the video first and then to repeat the actions on your own. Whatever works
    is fine.


    Java is a multi-platform language and programs written for Microsoft Windows,
    say, should work the same way in Mac OS or on Linux computers. I''m using a Mac,
    but also have special software that enables me to run Microsoft Windows. In this
    book I use the open-source Eclipse Integrated Development Environment, which exists
    on all major platforms and looks pretty much the same on each. So regardless of
    your preferred operating system, you''ll be able to run all the code samples from
    this book.'
