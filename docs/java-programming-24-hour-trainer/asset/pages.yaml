    out.println(myBean.sayHello());\n```\n\nThat's all there is to it. The complete\
    \ code of the servlet is shown in Listing 32-3.\n\n# LISTING 32-3: Servlet client\
    \ for HelloWorldBean\n\n```\nimport java.io.IOException;\nimport java.io.PrintWriter;\n\
    \nimport java.servlet.EJB;\nimport java.servlet.ServletExceptionException;\nimport\
