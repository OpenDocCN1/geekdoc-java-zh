  md: "# LESSON 18 NETWORK PROGRAMMING\n\nFinding a resource online is somewhat similar\
    \ to finding a person by his or her address. The role of an IP address is similar\
    \ to the role of a street number of a building, and a port plays the role of an\
    \ apartment number in that building. Many people can live in the same building,\
    \ just as many programs can run on the same server. A port is simply a unique\
    \ number assigned to a server program running on the machine.\n\nMultiple Java\
    \ technologies exist for providing data exchange between computers in a network.\
    \ Java provides classes for network programming in the package java.net. This\
    \ lesson shows you how to read data from the Internet using the URL class or as\
    \ direct socket-to-socket programming. Lesson 19 is about sending e-mails with\
    \ JavaMail API. Lessons 26 through 37 introduce you to other technologies that\
    \ you can use over the network: Java Servlets, RMI, EJB, and JMS.\n\n# READING\
    \ DATA FROM THE INTERNET\n\nYou learned in Lesson 16 that to read local file streams,\
    \ a program has to specify the file's location, such as c:\\practice\\training.html.\
    \ The same holds true for reading remote files — the only difference is that you\
    \ use the stream over the network. Java has a class, java.net.URL, that will help\
    \ you connect to a remote computer on the Internet and get access to a resource,\
    \ provided that's not protected from the public. First, create an instance of\
    \ the URL of your resource:\n\n```\ntry {\n  URL xyz = new URL(\"http://www.xyz.com:80/training.html\"\
    );\n} catch (MalformedURLException e) {\n  e.printStackTrace();\n}\n```\n\nThe\
    \ MalformedURLException will be thrown if an invalid URL has been specified, for\
    \ example if you typed http instead of extra spaces. If the MalformedURLException\
    \ is thrown, it does not indicate that the remote machine has problems — just\
    \ check the spelling of your URL.\n\nCreation of the URL object does not establish\
    \ a connection with the remote machine; you'll still need to open a stream and\
    \ read it. Perform the following steps to read a file from the Internet:\n\n+\
    \   1. Create an instance of the class URL.\n2. Create an instance of the URLConnection\
    \ class and open a connection using the URL from Step 1.\n3. Get a reference to\
    \ an input stream of this object by calling the method URLConnection.getInputStream().\n\
    4. Read the data from the stream. Use a buffer to read the reading process.\n\n\
    While using streams over the networks you'll have to handle possible I/O exceptions\
    \ that you did while reading the local files. The server you are trying to connect\
    \ to has to be up-and-running, and if you're using HTTP-based protocols, a special\
    \ software — web server — has to be “listening to” the specified port on the server.\
    \ By default, web servers are listening to all HTTP requests on port 80 and secure\
    \ HTTPS requests directed to port 443."
