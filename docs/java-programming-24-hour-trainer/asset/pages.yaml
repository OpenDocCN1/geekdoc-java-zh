    }\n```\n\nMethod overloading means a class with more than one method having the\
    \ same name but different argument lists. A method can be overloaded not only\
    \ in the same class but also in a descendant too. For example, the class LoanCalculator\
    \ can have the function calcLoanPayment() defined with three arguments, while\
    \ the descendant LoanCalculator may have a two-argument version of calcLoanPayment().\n\
    \nWhy overload methods in your classes? To provide users of these classes with\
    \ a more flexible programming interface (API). In Lesson 1 you use the JDK println()\
    \ declared in the class PrintStream (see Figure 4-1 or its Java description at\
    \ http://java.sun.com/javase/6/docs/api/java/PrintStream.html). The function println()\
    \ has been overloaded there to give developers the freedom to call \"the same\"\
    \ method with different types of arguments. In reality they are calling different\
    \ methods with the same name.\n\n| void println() | Terminates the current line\
    \ by using the line separator. |\n| void println(boolean x) | Prints a boolean\
    \ and then terminate the line. |\n| void println(char x) | Prints a character\
    \ and then terminate the line. |\n| void println(char[] x) | Prints an array of\
    \ characters and then terminate the line. |\n| void println(double x) | Prints\
    \ a double and then terminate the line. |\n| void println(float x) | Prints a\
    \ float and then terminate the line. |\n| void println(int x) | Prints an integer\
    \ and then terminate the line. |\n| void println(long x) | Prints a long and then\
    \ terminate the line. |\n| void println(Object x) | Prints an Object and then\
    \ terminate the line. |\n| void println(String x) | Prints a String and then terminate\
    \ the line. |\n\nFIGURE 4-1\n\n# CONSTRUCTORS\n\nWhen a program creates an instance\
