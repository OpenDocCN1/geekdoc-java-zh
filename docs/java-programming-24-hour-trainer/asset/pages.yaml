  md: 'The following table summarizes some characteristics of the Java data types.


    | PRIMITIVE TYPE | SIZE | MIN VALUE | MAX VALUE | WRAPPER CLASS |

    |---|---|---|---|--|

    | byte | 8 bits | -128 | 127 | Byte |

    | short | 16 bits | -32,768 | 32,767 | Short |

    | int | 32 bits | -2,147,483,648 | 2,147,483,647 | Integer |

    | long | 64 bits | -9,223,372,036,854,775,808 | 9,223,372,036,854,775,808 | Long
    |

    | float | 32 bits | Single precision float-point; see Java language specification
    at http://bit.ly/9nljwh | Single precision float-point; see Java language specification
    at http://bit.ly/9nljwh | Float |

    | double | 64 bits | Double precision float-point; see Java language specification
    at http://bit.ly/9nljwh | Double precision float-point; see Java language specification
    at http://bit.ly/9nljwh | Double |

    | char | 16 bits | Unicode O | Unicode 2 in a power of 16 | Character |

    | boolean | - | false (not a min) | true (not a max) | Boolean |


    Have you noticed that the char data type uses two bytes of memory to store the
    data? This allows you to store character sets that have a lot more symbols than
    traditional alphabets because a single byte can only represent 256 characters,
    while two bytes can represent 65,536 characters.


    Following are some examples of variable declarations and initializations:


    ```

    int chairs = 12;

    boolean cancelJob = false;

    double nationalIncome = 2386349465745.78;

    float hourlyRate = 12.5f;

    long totalChars = 46372836483992;

    ```


    The last two literals in the preceding list end with the letters f and L to indicate
    that you want to store these data as float and long data types correspondingly.
    But most likely, the double datatype will fit all your needs in non-integer calculations.


    # VARIABLE SCOPE


    If you declare a variable inside any method, the variable has a local scope (for
    example, adjustedTax in Listing 3-5 is local). This means that it''s only visible
    for the code within this method (calcTax). When the method completes its execution,
    all local variables are automatically removed from memory by Java''s garbage collector.
    Actually the scope is tighter than that.'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'It''s accessible within the method only after the variables are declared, and
    only within the block in which it is declared. For instance, a variable declared
    inside a for loop will not be excessive outside the for loop even inside the same
    method.


    If a variable has to be accessible from more than one class method, declare it
    on a class level. Listing 3-5 shows the class, where grossIncome, dependents,
    and state are class or member variables. These variables are “alive” while the
    Tax exists in memory. They can be shared and reused by all methods within the
    class and they can be visible from external classes.


    > If a variable is declared with a static qualifier (see Lesson 4), it''s shared
    by all instances of the class.


    # WRAPPERS, AUTOBOXING, AND UNBOXING


    All primitive data types have corresponding wrapper classes that contain useful
    methods dealing with respective data types. The wrapper classes serve two purposes:


    +   1. They contain a number of useful functions for manipulation with their primitive
    counterparts. For example, the class Integer offers useful methods as conversion
    of a String into an int, or turning an int into a float, and more. The Integer
    class also allows you to set the minimum and maximum values for the number in
    question.


    +   2. Some Java collections can''t store primitives (as ArrayList) and so primitives
    must be wrapped into objects. For example,


    ```

    ArrayList myLotteryNumbers = new ArrayList();

    LotteryNumbers.add(new Integer(6));

    LotteryNumbers.add(new Integer(15));

    ```


    You don''t need to explicitly create a new instance for every primitive as in
    the preceding code snippet. You can simply write myLuckyNumbers.add(6); and the
    primitive value 6 will automatically be wrapped into an instance of the Integer
    class. This feature is called autoboxing.


    On the same note, the next line is also:


    ```

    int lucky=myLuckyNumber.get(23);

    ```


    Even though get(23) will return the value of the 24th element (the numbering in
    Java collections starts with zero) as an Integer object, object will automatically
    be converted into a primitive. This is called unboxing.


    # PROGRAM COMMENTS


    While writing code in Java, you should add comments, the text that explains what
    the program does. Programs are being read a lot more often than they are being
    written. At some point, other software developers will read and understand your
    code. Be nice and make their job easier. A typical software developer doesn''t
    like writing comments (regardless of what programming language he or she uses);'
