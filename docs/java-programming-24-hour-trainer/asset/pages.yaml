  md: "# The Flavors of if\n\nIn Listing 5-3 you saw one version of the if statement:\n\
    \n```\nif (friends[i]==null) {\n    ++;\n    continue;\n}\n```\n\nThe curly braces\
    \ must be used in the if statement to specify a block of code that has to be executed\
    \ if the condition is true. Even though the curly braces are not required if there's\
    \ only one statement in the code block, using them is considered a good practice\
    \ — this makes the program more- understandable for other people who may need\
    \ to read your code (or for six months from now).\n\n```\nif (friends[i]==null)\
    \ {\n    System.out.println(\"I found an array element with null value\");\n}\n\
    // Some other code goes here\n```\n\nThe code below the curly brace will always\
    \ be executed, which may not be desirable. In this case use the if-else syntax:\n\
    \n```\nif (friends[i]==null) {\n    System.out.println(\"I found an array element\
    \ with null value\");\n} else {\n    // Some other code goes here\n}\n```\n\n\
    In the preceding code snippet, the \"some other code\" will be executed only if\
    \ the current element of the array is not null (or, as we put it in Java, friends[i]!=null).\
    \ You can write an if statement with multiple clauses. For example, the following\
    \ code will print only one love confession:\n\n```\nif (friends[i]==null) {\n\
    \    System.out.println(\"I found an array element with null value\");\n} else\
    \ if (friends[i] == \"Natasha\") {\n    System.out.println(\"I love my wife so\
    \ much!\");\n} else if (friends[i] == \"Masha\") {\n    System.out.println(\"\
    I fell in love with Masha when I was in the 8th grade.\");\n} else {\n    System.out.println(\"\
    I used to love \" + friends[i] + \" * at some point.\");\n}\n```\n\nUsing conditional\
    \ statements can be a lot more complex than comparing two values. You can build\
    \ expressions using boolean AND, OR, and NOT operators. The AND operation is represented\
    \ as \\&\\& like this:\n\n```\nif (age<20 && gender==\"male\") {\n    // do something\
    \ only for years under 20 years old\n}\n```\n\nFor the OR condition use ||, for\
    \ example:\n\n```\nif (age < 30 || yearsInArmy > 0) {\n    // do something with\
    \ people yong than 30 or those who served\n    // in the army regardless of their\
    \ age\n}\n```"
