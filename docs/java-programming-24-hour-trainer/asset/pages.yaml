  md: '# 29

    Developing Web Applications with JSF


    In the previous lesson I mentioned that the JSP specification was created on top
    of servlets to simplify Web application development and as a step toward the separation
    of responsibilities between web designers and developers. I also said that you
    should minimize the use of Java code in a JSP page. But JSP doesn''t enforce this
    practice. JavaServer (JSF) does, and using it is the best way of developing Java
    EE web applications with a thin client.


    The current version, JSF 2.0, is based on the Facets framework that was originally
    an open-source product. You''ll be creating JSF web pages in extensible HTML (.xhtml
    files), which means that the HTML has to be well-formed — every open tag should
    have a closing one, the values for the tags'' attributes must be placed in quotes,
    the elements tags must respect case-sensitivity, and the document must have a
    single root tag.


    Like JSP, the JSF framework is tag-based. JavaServer Faces has several important
    advantages over JSP:


    +   - The JSF framework comes with a set of UI components, while JSF uses standard
    HTML components.

    - JSF is event-driven.

    - You can''t add Java to .xhtml files, which enforces clean code separation between
    Java and HTML.

    - JSF offers easy navigation between web pages.


    +   JSF introduces configurable managed beans, which contain processing logic
    and navigation.


    I''ll give you more details on each of these bullet points later in this lesson.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# THE BIG PICTURE


    The JSF framework is a part of the presentation tier and it enforces the separation
    of presentation and processing logic. Reiterating the MVC paradigm, the library
    of JSF components is responsible for the UI, the servlet FacesServlet plays the
    role of a controller, and managed beans the model. The processing logic can be
    placed in POJO classes, EJB, or in third-party systems, as shown in Figure 29-1.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_359_0.png)


    FIGURE 29-1


    The managed beans can be linked to the UI JSF components so that, for example,
    you fill out a form on a web page, the entered values are automatically assigned
    to the corresponding field in your Java bean. Sometimes beans that support UI
    components are called baking beans.


    Without further ado, let''s start working on a two-page web application to enroll
    students into classes. The first page will enable users to enter student ID, name,
    and course, and the second page will confirm the enrollment. The UI will be supported
    by managed beans, which will serve as a data model, but the data won''t be saved
    (persisted) anywhere (you''ll learn about persistence in Lesson 33).


    # MANAGED BEANS


    Managed JSF beans are similar to JavaBeans, introduced in Lesson 28, but the word
    *managed* means that they can be directly linked to JSF components. Besides storing
    data they may contain information about page navigation. FacesServlet controls
    the managed beans.


    Let''s start working on the student enrollment example by creating a managed bean
    called *Student*. But first create a new dynamic web project called Lesson29 in
    Eclipse IDE.'
  merge: -1
  pgno: 359
- img_proc: true
  md: "Then create the Java class Student in the folder com.practicaljava.Lesson29.beans\
    \ and add the annotation @ManagedBean right above the class name. Eclipse will\
    \ mark this line with a red x, complaining about the missing import statement.\
    \ Right-click this x, select the option Quick Fix, and import this annotation\
    \ class from the javax.faces.bean package. The annotation registers the class\
    \ student as a JSF resource. Add the @Scoped annotation to ensure that the container\
    \ creates a new instance of this bean for each user's request.\n\nDeclare three\
    \ private variables: int studentId, String name, and long classId. Then select\
    \ Source Generate Getter and Setters and the rest of the Student code will be\
    \ auto-generated. It will look like Listing 29-1.\n\n# LISTING 29-1: managed Bean\
    \ Student\n\n```\npackage com.practicaljava.lesson29.beans;\n\nimport java.io.Serializable;\n\
    \nimport javax.faces.bean.ManagedBean;\nimport javax.faces.bean.RequestScoped;\n\
    \n@ManagedBean\n@RequestScoped\npublic class Student implements Serializable{\n\
    \n    private long studentId;\n    private String name;\n    private int classId;\n\
    \n    public long getStudentId() {\n        return studentId;\n    }\n    public\
    \ void setStudentId(long studentId) {\n        this.studentId = studentId;\n \
    \   }\n    public String getName() {\n        return name;\n    }\n    public\
    \ void setName(String name) {\n        this.name = name;\n    }\n    public int\
    \ getClassId() {\n        return classId;\n    }\n    public void setClassId(int\
    \ classId) {\n        this.classId = classId;\n    }\n}\n```\n\nConfiguration\
    \ of the managed beans is done using annotations — no additional configuration\
    \ files are required. But if you specify the file faces-config.xml in the WEB-INF\
    \ directory, its setting will override the annotation values."
