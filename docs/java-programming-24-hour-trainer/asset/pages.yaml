  md: '# 32


    # # Introduction to Enterprise JavaBeans


    This lesson introduces you to one of the Java EE technologies, Enterprise JavaBeans,
    which can be used for implementing the business tier in a distributed application
    (refer to Figure 26-1). Lessons 27 and 28 were were about various ways of programming
    the presentation tier on the Web; in Lessons 30 and 31 you learned how to organize
    communication between the different tiers of the application using messaging.


    Now you will see how to program the business tier in EJBs, which are also POJOs,
    but managed by an EJB container. With the release of Java EE 6, EJB 3.1 and the
    Java Persistence API (JPA) 2.0 offer you a clear and simple way to implement solutions
    for business logic and data persistence. The features covered in this lesson will
    work in application servers that support EJB 3.1. Such servers include GlassFish,
    JBoss 6, and WebSphere 8, and more vendors are Apache Tomcat on making their application
    servers Java EE 6-certified. There is also the Apache TomTom bundle, which includes
    the open-source ApacheEJB project; at the time of this writing bundle partially
    supports EJB 3.1.


    In this lesson I''ll introduce you to various types of EJBs, and the next lesson
    is about persisting data with JPA.


    # ## WHO NEEDS EJB CONTAINERS?


    What''s wrong with POJOs? Why not just implement business logic? You certainly
    can, but most likely you''d need to spend additional time manually programming
    a multi-threaded environment for them. if the business logic is located in POJO
    1 and POJO 2, and the second one fails, you want to roll back whatever has been
    completed by the first one.


    It''s great that you know how to program message receivers using JMS, but how
    can you make this solution scalable? What if you need a couple of dozen message
    listeners that concurrently'
  merge: -1
  pgno: 396
- img_proc: true
  md: 'de-queuing the messages? Don''t forget about the tasks of integrating your
    POJOs with other tiers to perform authentication and JDBC operations.


    EJB containers take care of all these infrastructure-related concerns without
    requiring manual programming on your side. You''ll simply configure pools of message-driven
    beans beans (MDBs) if you need multiple message listeners. You''ll turn on transactional
    support if you need. You don''t need to worry about multi-threading problems if
    your beans operate in an EJB container. The configuration is as simple as adding
    Java annotations to the EJB classes. Intercommunication among beans is done via
    dependency injection or singleton beans.


    If you need to scale a distributed application, EJB containers offer clustering
    and failover support. Security authorization is also the container''s responsibility.
    Without the need to manually code all these infrastructural functionalities, the
    code of your EJBs becomes really light.


    The other interest offered by EJB containers is asynchronous method invocation,
    which enables asynchronous processing without the need for JMS or MOM.


    EJB 3.1 supports embeddable containers: You can run EJB applications in a Java
    SE environment. This is a great idea for tasks such as testing because there''s
    no need to depend on the readiness of a Java EE server — just test your EJBs locally.
    Creating an embeddable container is as simple as executing one line of code:


    ```

    EJBContainermyContainer = EJBContainer.createEJBContainer();

    ```


    If the originally selected application server doesn''t deliver the performance
    or reliability you expected, deploy your EJBs in a different Java EE 6-compliant
    server without changing a line of code.


    # TYPES OF EJJS


    There are two major types of EJB: session beans and message-driven beans. MDBs
    specialize in retrieving messages from JMS queues or topics — this is all they
    can do. But session beans are where your application logic will reside. There
    are three types of session beans:


    +   * A stateless session bean is one that contains business logic but doesn''t
    support state. In other words, it doesn''t "remember" any data specific to the
    client. If the same client invokes methods in a row on the stateless bean FindBooks,
    the container may use two separate instances of the FindBooks bean, as it doesn''t
    store any intermediate data specific to the client.


    +   * A Stateful session bean is one that contains business logic and state. The
    EJB container allows a specific instance of the session bean to the client and
    can store results between method invocations.


    +   * A singleton session bean is guaranteed to be the only instance of its kind
    in the container. Think of a singleton bean as a global repository, in which bean
    can put some data to be used by another. Singleton session beans not only provide
    easy access to common data but also ensure that there are no race conditions in
    cases of concurrent access.


    Older EJB specifications defined entity beans for data persistence. They formally
    still exist in the EJB 3.1 specification, but they are being pruned, and most
    likely will disappear from future versions of Java EE releases.'
