    # INJECTION OF NDJI RESOURCES


    Even looking up the NDJI object doesn''t look too difficult, there is even a cleaner
    and sim-

    pler way of providing these resources to your Java EE components: using the annotation
    @Resource.

    The application server can inject the resource so you don''t need to do a NDJI
    lookup. For example,

    injection of ConnectionFactory and Queue can look like this:


    ```

    import javax.annotation.Resource;

    ...

    @Resource(name="MyTestConnectionFactory")

    private ConnectionFactory factory;

    ```


    ```

    @Resource(name="MyJMTestQueue")

    private Queue ioQueue;

    ```


    Resources can be injected into variables, as in the preceding example, or you
    can put the @Resource

    annotation over the method or a class definition. Depending on its location, the
    time of injection

    varies. If you put this annotation at the class level, the resource will be injected
    during run time

    when the application looks it up. If you put this annotation over the field or
    setter method declara-

    tion, the resource will be injected in the component where the application is
    initialized.


    If you need to override resources specified in annotations, you can do it in XML
    configuration files.

    You''ll see more examples of using resource injection with EJB in Lesson 32.


    # DATASOURCE AND NDJI


    In Lesson 22, while learning JDBC, you were creating database connections before
    executing any

    database queries. Imagine multiple clients send requests to your application server,
    which has to

    execute database queries. Creating and closing connections are slow operations,
    and you want to

    them as infrequently as possible.


    Typically the administrator of the Java EE server pre-creates the pools of database
    connections,

    and configures the minimum and maximum number of connections and some other parameters.'
