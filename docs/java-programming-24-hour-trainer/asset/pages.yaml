    \ is not allowed.\n\n```\nif (!(friends[i]==\"Hillary\")) {\n    System.out.println(\"\
    Still looking for Hillary.\");\n}\n```\n\nImagine a situation in which you need\
    \ to assign a value to a variable, the value depends on the result of a condition.\
    \ You can use a regular statement and test some condition, writing one assignment\
    \ operator for a result of true, and another in the else section for a result\
    \ of false. But if you use a special construct called a conditional operator (?),\
    \ the same task can done much more.\n\nThe conditional operator consists of the\
    \ following parts: an expression that returns boolean, a question mark, an expression\
    \ that returns value if the first expression evaluates to true, a colon, and an\
    \ expression that returns a value to be used if the first expression returns false.\
    \ It sounds complicated, but it's not. The following code sample shows how to\
    \ assign a $3,000 bonus if a person's salary is greater than $90,000, and only\
    \ $2,000 otherwise:\n\n```\nfloat salary;\n// Retrieve the salary band of the\
    \ person from some data source here\nint bonus = salary>90000?3000:2000;\n```\n\
    \n# The switch Statement\n\nThe switch statement is used when the program execution\
    \ is defined on multiple selections. Even though execution can be defined with\
