  md: 'The client program should create a client socket — an instance of the class
    Socket — pointing at the computer/port on which the ServerSocket is running. The
    client program can connect to the server using hostnames or IP addresses, for
    example:


    ```

    clientSocket = new Socket("124.67.98.101", 3000);

    clientSocket = new Socket("localhost", 3000);

    clientSocket = new Socket("127.0.0.1", 3000);

    ```


    While deciding which port to use for the Server, avoid using port numbers 1024
    to avoid conflicts with other system programs. For example, port 80 is typically
    used by HTTP servers; port 443 is reserved for HTTPS; port 21 is typically used
    for FTP communications; port 389 is for LDAP servers, and so on. After creating
    a socket-based connection, both client and server should obtain references to
    its input/output streams and use them for data exchange.


    # Why Sockets?


    When use socket programming if you can easily establish inter-computer communication
    with say, HTTP-based protocol (it uses sockets internally), start one of many
    open-source or commercial web servers, and have clients connect to the server
    as shown in the preceding sample programs in this lesson? Because a socket connection
    has a less overhead than any standard protocol.


    You can create your own custom protocol that will allow you to send only the data
    you need, with no or minimal headers. Socket communication provides a duplex byte
    stream, wherein the data travels simultaneously in both directions, unlike protocols
    based on the request-response model. Think of financial trading systems: Speed
    is the king here, and the ability to send data up down at the same time milliseconds,
    which makes a difference.


    On the other hand, if you design your application to use sockets, the live connection
    will be maintained for each user connected to ServerSocket. If your program has
    to maintain several thousand concurrent connections it will require more powerful
    servers than programs using the request-response system, with which a connection
    is maintained only during the time of the client''s request.


