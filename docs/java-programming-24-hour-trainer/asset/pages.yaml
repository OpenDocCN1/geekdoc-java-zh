    13-8 illustrates the code that adds an application-specific object, ShippingErrorInfo,
    to the custom TooManyBikesException. An application can prepare the object describing
    a shipping-error and pass it as an argument to the constructor of the exception.
    The latter will store it in the class variable shippingErrorInfo, and whatever
    method catches this exception can extract the ShippingErrorInfo object and act
    accordingly.


    In Distributed Java EE an exception can travel through several tiers (such as
    JMS, EJB, Servlet, Swing client), and not only does having a custom property inside
    the exception won''t be lost, but each tier can add more specifics to this custom
    property, by tracing the error.


    There is also a class called RemoteException, with a field called detail, that''s
    used for reporting communication errors. You can extend this to make remote exceptions
    more descriptive. This subject may be more appropriate for the lessons about the
    server-side technologies (Lesson 26 and above), but since this is the lesson dedicated
    to Exceptions, I mentioned it here.


    Keep in mind that a Java program can communicate with non-Java systems, and throwing
    RemoteException or its subclass is a proper way to handle cross-language errors.
    For example, this technique is used for communications based on Adobe''s AMF protocol
    between server-side Java and a Rich Internet client application written with Adobe
    Flex.


    For more details on Java exceptions refer to Oracle''s tutorial at http://java.sun.com/docs/books/tutorial/essential/exceptions.


