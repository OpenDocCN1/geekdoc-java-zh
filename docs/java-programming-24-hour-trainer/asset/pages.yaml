  md: "For the NOT condition (aka negation) use the : sign;\n\n```\nboolean hasBachelorDegree;\n\
    // Read the person record and assign the value true or false\n// to the variable\
    \ hasBachelorDegree\nif (hasBachelorDegree) {\n    // do something with people\
    \ without bachelor degree\n}\n```\n\nThe negation symbol can be placed either\
    \ in front of a boolean variable, snippet, or in the front of the expression that\
    \ returns boolean. The next code example shows how to use negation Note that the\
