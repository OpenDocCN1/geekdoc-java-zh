  md: "As you can see, in some cases only the code from the try block will work; in\
    \ some cases part of the code from the try block and all the code in catch will\
    \ be invoked. If there is a piece of code that must be executed regardless of\
    \ the success or failure of the try block, put it under the clause finally.\n\n\
    # LISTING 13-6: Using clause finally\n\n```\ntry{\n    file.read();\n    //file.close();\
    \    don't close files inside try block\n} catch(Exception e){\n    e.printStackTrace();\n\
    }\nfinally{\n    file.close();\n}\n```\n\nThe code in Listing 13-6 will definitely\
    \ close the file regardless of the success of the read operation, because the\
    \ close() function is called in the finally block. But if you place the close()\
    \ function inside the try block without writing the finally portion, in case of\
    \ error during read the program will jump from the failed read() into catch, skipping\
    \ the close operation. The finally clause is typically used for the release of\
    \ system resources.\n\nIf you are not planning to handle exceptions in the current\
    \ method, they will be propagated to the calling method by using the finally clause\
    \ without the catch clause:\n\n```\nvoid myWeb() throws IOException {\n    try{\n\
    \        file.read();\n    } finally{\n        file.close();\n    }\n}\n```\n\n\
    # THE THROW OPERATOR\n\nIf an exception has occurred in a method, you may want\
    \ to catch the exception, do partial error processing such as error logging, or\
    \ throw it to the calling method again for further processing or just to make\
    \ the user aware of the problem. In some cases you may want to catch an exception\
    \ and handle it but throw another exception (with modified error information)\
    \ to the calling method."
