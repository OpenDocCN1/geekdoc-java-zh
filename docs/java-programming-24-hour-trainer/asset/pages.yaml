  md: '# Introduction to Renderers


    The fireTableCell() method has been placed in the setValueAt() method to notify
    any listener(s) who want to know about the data changes. For example, if the quantity
    on any order has changed and gone over a certain threshold, the application may
    need to immediately perform some actions to report this to some authority.


    Review the code in Listing 2-3. The class MyFrame implements TableModel, so the
    method tableChanged() will be invoked as a result of the fireTableCellChanged()
    method call. Add the following line to the tableChanged(method):


    ```

    System.out.println("Someone modified the data in JTable!");

    ```


    Now run the program and modify the quantity in any row of JTable. The message
    will be printed on the system console. JVM fires a table event with a payload
    - TableModelEvent carries useful information about what exactly changed in the
    table model.


    TableModelEvent has several constructors; I have chosen the one that modified
    rows and columns as arguments. For example, if you change the quantity in the
    last row, as shown in Figure 23-2, the method tableChanged() will receive an instance
    of TableModelEvent that encapsulates the entire model with the following values
    describing the change:


    | column=2 // the third column |

    | firstRow=3 // starting from the row #4 |

    | lastRow=3 // ending with the row #4 |


    Based on this information you can implement any further processing by the functional
    specification of your application. If you need to apply the UI changes to the
    database, the method tableChanged() will be the right place to use the JDBC API
    or any other communication with the server-side code to persist the changes.


    There are several functions with names that share the word fire. For example,
    to apply each cell''s change to the database, call the method fireTableCellUpdated().
    To apply all cells at once, call the method fireTableDataChanged(). Refer to the
    documentation of the class AbstractTableModel to decide which method fits your
    needs.


    # INTRODUCTION TO RENDERERS


    The process of transferring data from the table to JTable is performed by cell
    renderers. When the user is modifying the content of the cell, the cell editor
    is engaged. Each cell in a JTable is rendered using one of default renderers,
    based on the type of data in the column. Boolean values are rendered as checkboxes,
    javax.swing.Icon is rendered as an image, and any other object is rendered as
    a string of characters.


    To change the default rendering (for example, if you don''t want to use checkboxes
    for Boolean values) you can override the callback getClassName() or define a custom
    cell renderer. The latter option gives you a lot more flexibility. For example,
    you may need to display a photo of a person or name in each cell. You may need
    to show cell values that meet certain criteria in a different color. To do something
    like one of these, you need to create a custom renderer.'
