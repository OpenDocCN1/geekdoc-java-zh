  md: '# LESSON 20 INTRODUCTION TO MULTI-THREADING


    If you need to kill a thread that''s busy doing I/O operations and the preceding
    methods of killing a thread doesn''t work, try I/O streams — this will cause IOException
    during the current read/write operation and the thread will over.


    If you would like to read more comprehensive coverage of this subject, see Dr.
    Heinz Kabutz the Java Specialist''s newsletter Issue #56, at www.javaspecialists.co.za/archive/Issue056.html.


    # THREAD PRIORITIES


    Single-processor computers use a special scheduling algorithm that allocates processor
    time slices to the running threads based on their priorities. If Thread1 is using
    the processor and the higher-priority Thread2 wakes up, Thread1 is pushed aside
    and Thread2 gets the CPU. It is said that Thread2 preempts Thread1.


    The class Thread has a method, setPriority(), which allows you to control its
    priority. There are 10 different priorities, which are final integer variables
    defined in the class Thread. Some of them are named MIN_PRIORITY, NORM_PRIORITY,
    and MAX_PRIORITY. Here''s an example of their usage:


    ```

    Thread myThread = new Thread("Portfolio");

    myThread.setPriority(Thread.NORM_PRIORITY + 1);

    ```


    If two threads with the same priority need the processor, it will be given to
    one of them using an algorithm specific to the computer''s OS.


    # THREAD SYNCHRONIZATION AND RACE CONDITIONS


    During the design of a multi-threaded application''s development you should consider
    the possibility of a so-called race condition, which happens when multiple threads
    need to modify the same resource at the same time (concurrently). The classic
    example is a husband and wife are trying to withdraw cash from different ATMs
    at the same time.


    Suppose the balance on their account is $120. If a Thread is responsible for the
    validation and update of the balance of their bank account, there is a slight
    chance that the husband''s thread will enable him to withdraw $100, but before
    the actual withdrawal the wife''s thread will come in trying to validate a $50
    withdrawal. She is also enabled to make her withdrawal, because $120 is still
    there! The couple could successfully withdraw a total of $150, leaving a negative
    balance in their account. This is an example of a race condition.


    A special keyword, synchronized, prevents race conditions from happening. This
    keyword places a lock (monitor) on an important object or piece of code to make
    sure that only one thread at a time will have access. The code in Listing 20-11
    locks the entire method withdrawCash() so no other thread will get to the specified
    portion of code until the current (locking) thread has finished its execution
    of withdrawCash().'
