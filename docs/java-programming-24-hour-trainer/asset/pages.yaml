    \ extends SwingWorker<List<String>, String> {\n\n  @Override\n  public List<String>\
    \ doInBackground() {\n    // Make a request to the server and return a result,\n\
    \    // i.e. a list of Strings\n    return myListOfData;\n  }\n  // method done\
    \ overrides go here\n}\n\nclass TestMarketWorker {\n  ...\n  public static void\
    \ main(String[] args) {\n    new MarketWorker().execute();\n  }\n}\n```\n\nThis\
    \ code gives you a high-level picture, but there is more to executing the thread\
