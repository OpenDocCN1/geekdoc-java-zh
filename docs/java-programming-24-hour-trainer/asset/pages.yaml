  md: '# 23


    # Swing with JTable


    In this lesson you''ll learn how to work with a Swing control that is advanced
    and popular for enterprise applications: JTable. This UI component enables you
    to present data in a grid with rows and columns. After learning the basics of
    working with JTable, in the Try It section you''ll apply these new skills to display
    the portfolio data that, as of Lesson 22, is stored in the database.


    In other words, you''ll build a client-server application, where the Swing-based
    GUI is a client and the RDBMS is a server. Such architecture was pretty popular
    in the mid-nineties. Rich clients were developed in Visual Basic, PowerBuilder,
    Delphi, Java, or C++, and they connected directly to database servers such as
    Oracle, DB2, Sybase, Microsoft SQL Server, and Informix.


    In the late nineties, thin clients (plain-looking HTML-based web pages with almost
    no code implementing business logic) became the trend. These days applications
    are coming back, but typically you''ll be using an application server as a middleman
    between the client and the data storage. I will describe such middleware starting
    in Lesson 26, but your UI skills would be incomplete without your knowing how
    to program grids.


    # JTABLE AND THE MVC PARADIGM


    The Swing class JTable is a powerful UI component for displaying tabular data
    like a spreadsheet. The data is represented as rows and columns; that the JTable
    component is often used to display data from relational databases, which store
    data more similarly. JTable was designed according to the Model-View-Controller
    (MVC) design pattern, according to which components responsible for representation
    (or the view) are separated from components that store data (or the model) for
    that presentation. In general, design patterns suggest language-independent solutions
    for common programming tasks.


    JTable is responsible for the visible portion of the grid (the V part of MVC),
    but the data has to be stored in a different Java class that implements the TableModel
    interface (the M part). Other UI component can play the role of the controller
    (the C part) and initiate some actions that will move the data from model to view
    or vice versa. For example, a click on the JButton can initiate the population
    of the table model from the database and display the data in JTable.'
