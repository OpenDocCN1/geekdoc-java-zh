  md: '# ENTITYMANAGER


    EntityManager is the centerpiece of persistence — it will execute all your JPA
    requests to read from or write into a database. Each instance of EntityManager
    is associated with a set of entities. Such a set is called a persistence unit.
    In Java EE contains the EntityManager can be injected as a resource, or for example:


    ```

    @PersistenceContext

    EntityManager em;

    ```


    In Java SE applications you need to instantiate EntityManager programmatically

    EntityManagerFactory:


    ```

    private EntityManagerFactory factory;


    static final String PERSISTENCE_CONTEXT_NAME = "employees";


    factory = Persistence.createEntityManagerFactory(PERSISTENCE_CONTEXT_NAME);

    EntityManager em = factory.createEntityManager();

    ```


    The entity manager can create, update, remove, and find entities by IDs or using
    a query. The code to find an Employee with the ID 1234 can look like this:


    ```

    Employee employee = em.find(Employee.class, 1234);

    ```


    To create a new row in the Employee database table, create an instance of the
    entity Employee and invoke the method persist() on the EntityManager. To delete
    a row, call remove(). Your application can explicitly begin and commit transactions
    when the persistence is successfully completed.


    ```

    @PersistenceContext

    EntityManagerFactory factory;

    EntityManager em;


    @Resource

    UserTransaction userTransaction;

    ...

    em=factory.createEntityManager();


    Employee newEmployee = new Employee();

    newEmployee.firstName="Mary";

    newEmployee.lastName="Thompson";

    ...

    try{

    userTransaction.begin();

    em.persist(newEmployee);

    em.remove(oldEmployee);

    userTransaction.commit();

    }

    catch (SystemException e) { //all other exceptions can be thrown here

    e.printStackTrace();

    try{

    userTransaction.rollback();

    ```'
