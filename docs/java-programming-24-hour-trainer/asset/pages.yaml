  md: '# 2


    # Eclipse IDE


    While your first Java program was written in a plain text editor and compiled
    from a command-window, this is not a productive way of developing software. Professional
    programmers use one of the Integrated Development Environments (IDEs), which include
    an editor, a compiler, type-ahead help, a debugger, and a lot more (you''ll get
    familiar with these features later in this lesson). There are several popular
    Java IDEs, such as Eclipse, NetBeans, IntelliJ IDEA, and RAD. Some are free, and
    some are not.


    Eclipse is by far the most used IDE, and I''ll be using it for compiling and running
    most of the examples in this book. By switching from one IDE to another is a pretty
    simple process, and if you see that in some areas one IDE makes you more productive
    than the other, use the best one for the job. For example, NetBeans IDE can offer
    great help if you''re developing the server-side Java EE applications explained
    later in the book (starting in Lesson 26).


    # INTRODUCING ECLIPSE IDE


    Eclipse IDE is an open-source product with a substantial code donation by IBM
    to the Java community, and from that moment Eclipse is a 100% community-driven
    product. It started as an IDE for developing Java programs, but today it''s a
    development-platform used for building thousands of tools and plug-ins. Some people
    are using their Rich Client Platform (RCP) API to develop user interfaces (UIs)
    for applications. Other Java languages are also supported by Eclipse. Visit the
    downloads page to see a just portion of the Eclipse-based products available:
    eclipse.org/downloads.


    Besides being an IDE, Eclipse supports plug-development, and each developer can
    add only those plug-ins that he or she is interested in. For example, there is
    a plug-in to display UML diagrams, another offers a reporting system, and there
    are plug-ins for developing applications in C, Adobe Flex, and others.'
