    curly braces — this is the simplest class you can create:


    ```

    class Tax{

    }

    ```


    What data does this class need to perform tax calculations? You''ll definitely
    need to know the gross income of a person for the tax year. This is a good candidate
    for a property of this class. Properties in Java are represented by variables.
    Pick one of the numeric data types. Gross income is not always'
