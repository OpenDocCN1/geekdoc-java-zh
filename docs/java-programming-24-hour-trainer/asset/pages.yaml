  md: "# BEAN VALIDATION\n\nThe Bean Validation framework (JSR-303) is a Java API\
    \ for ensuring that the values in entities are correct. Validation can be performed\
    \ at different stages of the entity life cycle. Define the constraints on your\
    \ entities and the validation can be automatically initiated when you are about\
    \ to create, update, or remove an entity.\n\nListing 33-1 includes the @NotNull\
    \ and @Size constraints defined in the package javax.validation constraints, but\
    \ you can create your own validation rules as well.\n\nThe life-cycle callback\
    \ methods marked with the annotations @PrePersist and @PreRemove are invoked on\
    \ the EntityManager before persists or removes this entity. Accordingly, another\
    \ pair of annotations, @PostPersist and @PostRemove, are invoked after these operations.\n\
    \nFor example, you can put the validation code in the method transferEmployee()\
    \ to ensure that the transfer has been approved by the employee's manager. Throwing\
    \ an exception invalidates\n\n```\n@PrePersist\npublic void validateTransfer()\
    \ {\n    if (!transferApproved()) {\n        throw new TransferException(\"Manager\
    \ didn't approve transfer\");\n    }\n}\n```\n\n# TRY IT\n\nThe GlassFish v3 server\
    \ includes the binaries of the JPA provider EclipseLink (see www.eclipse.org/eclipselink).\
