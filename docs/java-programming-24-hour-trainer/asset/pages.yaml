  md: 'If more than one message is processed by the same Session object, acknowledgement
    of one message affects all messages from the same session.


    # HOW TO PUBLISH A MESSAGE


    Programs publish messages to topics, which should be created in advance by the
    MOM system administrator. Multiple subscribers can get messages published to the
    same topic (this is also known as one-to-many mode).


    Message publishing is very similar to message sending, but the program should
    create a Topic instead of a Queue and a Publisher instead of a Sender, and the
    publish() method should be called instead of send() as in Listing 30-3.


    # LISTING 30-3: Publishing a message to a topic


    ```

    Topic connection = connectionFactory.createTopicConnection();

    TopicSession pubSession = connection.createTopicSession(false, Session.AUTO_ACKNOWLEDGE);

    Topic myTopic = pubSession.createTopic (*Price_Drop_Alerts*);

    TopicPublisher publisher= pubSession.createPublisher(myTopic);

    connection.start();

    TextMessage message = pubSession.createTextMessage();

    message.setText("Sale in Apple starts tomorrow*");

    publisher.publish(message);

    ```


    # HOW TO SUBSCRIBE FOR A TOPIC


    Subscribers can be **durable or non-durable**. Durable subscribers are guaranteed
    to receive their messages; they do not have to be active when a message arrives.
    Non-durable subscribers will receive only those messages that come when they are
    active. This is similar to the way chat rooms operate — you must be online to
    get messages.


    The code snippet in Listing 30-4 creates a non-durable subscriber. Two modifications
    have to be made to this code to create a durable subscriber. The Client ID has
    be assigned to the connection — connection.setClientID(username) — and the createurableSubscriber(topic)
    method should be used instead of createSubscriber(topic).'
