  md: 'You can also move the cursor to a specific row by using the following self-explanatory
    methods:


    ```

    rs.absolute(t25); // moves the cursor to the 25th row

    rs.relative(-4); // moves the cursor to the 21st row

    rs.first();

    rs.last();

    rs.beforeFirst();

    ```


    If the result set is updatable you can modify the underlying database table while
    scrolling. For example, the following statements will update the job title of
    the employee based on the current cursor''s position:


    ```

    rs.updateString("JOB_TITLE", "Manager");

    rs.updateRow();

    ```


    Scrollable result sets enable you to traverse the result in both directions, but
    they have a drawback: they hold the database connection, which may be required
    by another thread or program. The package javax.sql includes the interface RowSet,
    which is a subclass of ResultSet. RowSet gets the data from the database, disconnects,
    but still allows Java to work with the data. The package java.sql.RowSet has several
    classes that implement RowSet, such as CachedRowSet, FilteredRowSet, and WebRowSet.
    The latter can turn RowSet into an XML stream to be sent to another tier in the
    distributed application.


    # TRANSACTIONAL UPDATES


    Sometimes several database modifications have to be processed as one transaction,
    and if one of the updates fails, the whole transaction has to be rolled back.
    These database operations have to be explicitly committed (finalized) in case
    of success. If you set the auto-commit parameter to false, the database transaction
    will not be committed until the code explicitly calls the method commit(), in
    in following example:


    ```

    try(){

    conn.setAutoCommit(false);


    Statement stmt = conn.createStatement();


    stmt.addBatch("insert into Orders " + \

    values(123, ''Buy'', ''IBM'', 200)");

    stmt.addBatch("insert into OrderDetail " + \

    values(''JSmith'', ''Broker131'', ''05/20/02'')");

    stmt.executeBatch();


    conn.commit(); // Transaction succeeded


    catch(SQLException e){

    conn.rollback(); // Transaction failed

    e.printStackTrace();

    }

    ```'
