  md: "# LESSON 21 DIGGING DEEPER INTO CONCURRENT EXECUTION\n\nSecond, the class MarketNewsWorker\
    \ uses generics and two parameters, <List<String> and String>. The reason for\
    \ this is that overridden method doInBackground() might call the SwingWorker.process()\
    \ method, and will call its done() method on completion — this is where the UI\
    \ is updated. Two parameters indicate what type of data will be returned by doInBackground()\
    \ and given to process() respectively.\n\nWhy might you consider calling the process()\
    \ method during your thread execution? You might need to support kind of progress\
    \ meter or other means of reporting the progress of long-running processes. If,\
    \ for example, a long-running thread is reading a large file or performing some\
    \ lengthy calculations, you might want to calculate the percentage of completion\
    \ and report it to the calling Swing application.\n\nYou are not allowed to call\
    \ the process() method directly, but have to call a method called publish(), which\
    \ will internally call process(). Override process() to add some messages to the\
    \ log file or update the progress meter. The code to display the result of the\
    \ calculations on the UI should be written in the method done().\n\nListing 21-6\
    \ shows a typical way to program with SwingWorker. I left out the details on purpose\
    \ so you have something to do for today's homework.\n\n# LISTING 21-6: A typical\
    \ way to use SwingWorker\n\n```\nclass MarketNewsWorker extends SwingWorker <List<String>,\
    \ String> {\n@Override public List<String> doInBackground() {\n    // Make a request\
    \ to the server and return a result,\n    // i.e. a list of Strings\n    for (String\
    \ news:someNewsCollection()) {\n        // process each and report the progress\n\
    \        publish(\"Processed the news *\" + news); //this calls process())\n \
    \   }\n    return myListData;\n}\n\n@Override protected void process(String progressMessage)\
    \ {\n    // display the progress information here\n}\n\n@Override protected void\
    \ done() {\n    // modify UI components by calling get()\n    // Future's get()\
    \ gives you the result of\n    // the thread execution\n}\n\nclass TestMarketNews{\n\
    \    public static void main(String[] args) {\n        new MarketNewsWorker().execute();\n\
    \    }\n}\n```"
