  md: '# 17


    # # Java Serialization


    Imagine a building, with a push of a button, can be turned into a pile of construction
    materials and the possessions of its residents. Push another button and the building
    is recreated in its original form in a different location. This is what Java serialization
    is about. By "pushing the serialize button" you turn an instance of an object
    into a pile of bytes, "pushing the deserializer button" magically re-creates the
    object.


    Wikipedia defines the term serialization as


    the process of converting a data structure or object into a sequence of bits so
    that it can be stored in a file or memory buffer, or transmitted across a network
    connection link to be "resurrected" later in the same or another computer environment.
    When the resulting series of bits is reread according to the serialization format,
    it can be used to create a semantically identical clone of the original object.
    This process of serializing an object is also called deflation or marshalling
    an object. The opposite operation, extracting a data structure from a series of
    bytes, is deserialization (which is also inflating or unmarshalling).


    In Lesson 16 you become familiar with streams that deal with single bytes, characters,
    Java primitives, and text. Now you''ll see how and why to write objects into streams,
    or how to serialize objects.


    Consider the following scenario: ClassA creates an instance of the object Employee,
    which has the fields firstName, lastName, address, hireDate, salary, etc. The
    values of these fields (that is, the object''s state) have to be saved in a stream.
    When ClassB, which needs this data, however has to re-create the object Employee
    in memory. The instances of ClassA and ClassB may live in two JVMs running on
    different computers.


    Sure enough, you can remember the order and the data types of firstName, lastName,
    address, hireDate, and salary, and loop through the fields performing the output
    with DataOutputStream.


    *'
