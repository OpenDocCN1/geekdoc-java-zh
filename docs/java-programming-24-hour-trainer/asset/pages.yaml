    is 20. If you click the little plus sign by the array, it''ll show the content
    of this array.


    Now try to execute this program step-by-step, watching how the value of variable
    i changes. You''ll control program execution by clicking the buttons in the toolbar
    for the Debug view (see Figure 5-2).


    ![](img/c76c0001feef31da8d0f359dd6abacc0_82_1.png)


    Figure 5-2


    The green button means "Continue executing the program until it ends or hits another
    breakpoint." The red square button stops the debugging process. The first yellow
    arrow (Step Into) is used if the code has been paused on a line that calls a method,
    and you''d like to debug the code of the method being called. The second arrow
    (Step Over) allows you to execute the current line without stepping into any methods
    that may be called in this line of code.'
