  md: 'Q: How do you deploy JSP?


    A: You can place .jsp files in a document root directory of the Servlet container
    server, or create a war file.


    Q: Why is JSF preferable to JSP from the MVC design pattern perspective?


    A: JSP enforces separation of the presentation and the processing logic, while
    JSF doesn''t.


    Q: What''s the default port number that web servers use for HTTP-based communications?


    A: HTTP requests go through port 80, HTTPS ones through port 443.


    Q: What method of the Servlet class is equivalent to a constructor in a regular
    Java class?


    A: The Servlet''s method init() plays a similar role, but because all clients
    use the same instance of the Servlet, you initialize only those variables that
    are allowed to have the same value for each user''s request, such as the name
    of the database server.


    Q: Which is faster, array or ArrayList?


    A: Most likely array is faster. It can be used if you know the number of elements
    in the array. ArrayList is an API on top of an array. You do not need to know
    its size in advance - new elements can be added. Arrays work faster because JVM
    allocates memory only for all elements. But to give you a better answer I''d have
    to write an appropriate benchmark in context to find out.


    Q: What do you know about Java reflection?


    A: Reflection is a way of finding information about a Java class during run time.
    For example you can find the constructors and the method signatures of a particular
    class. The class has methods as getConstructor(), getFields(), getMethods(), and
    others.


    Q: What would you do if your Java program crashed during run time with an "out
    of memory" error?


    A: I''d try to increase the size of the JVM''s dynamic memory (heap) on program
    start-up using command-line parameters. For example, you can request the minimum
    heap size of 512 MB as follows:


    ```

    java -Xms64 -Xmx512 MyProgram

    ```


    Q: How can you ensure that only one instance of some class can be created in your
    application?


    A: You need to implement the singleton design pattern. Create a class with a private
    constructor and provide a public get method that will return the only instance
    of this class, for example MyClass.getInstance().


    Q: What''s the major difference between Hashtable and a HashMap?


    A: The Hashtable class is internally synchronized, while the HashMap is not.


    Q: Name some design patterns.


    A: Singleton, MVC, data transfer object, facade...'
