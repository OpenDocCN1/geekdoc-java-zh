  md: "# How to Kill a Thread\n\nThere are different approaches to killing threads.\
    \ One of them involves creating your own method on the thread, say stopME(), in\
    \ which you set your own boolean variable, say stopME, to false and test its value\
    \ periodically inside the thread's method run(). If application code will set\
    \ the value of stopME to true, just exit the code execution in the method run().\
    \ In Listing 20-10, the loop in the method checks the value of the variable stopME,\
    \ which is initialized with the reference to the current Thread object. As soon\
    \ as it is changed (set to null in this case), the processing will complete.\n\
    \n# Listing 20-10: Killing a thread\n\n```\njava\nclass KillTheThread{\n    public\
    \ static void main(String args[]){\n        Portfolio4 p = new Portfolio4(\"Portfolio\
    \ data\");\n        p.start();\n        // Some other code goes here,\n      \
    \  // now it's time to kill the thread\n        p.stopME();\n    }\n}\n\nclass\
    \ Portfolio4 extends Thread{\n    private volatile Thread stopME = Thread.currentThread();\n\
    \n    public void stopME() {\n        stopME = null;\n    }\n\n    public void\
    \ run() {\n        while (stopME == Thread.currentThread()) {\n            try\
    \ {\n                //Do some portfolio processing here\n            } catch\
    \ (InterruptedException e) {\n                System.out.println(Thread.currentThread().getName()\
    \ + e.toString());\n            }\n        }\n    }\n}\n```\n\nThe variable stopME\
    \ has been declared with a volatile keyword, which warns the Java compiler that\
    \ another thread can modify it and that this variable shouldn't be cached in registers,\
    \ so that all threads must always see its fresh value. The class Portfolio4 could\
    \ be written differently — the variable stopME could be declared as boolean.\n\
    \nNot every thread can be killed using the code shown in Listing 20-10. What if\
    \ a thread is not doing any processing at the moment, but is waiting for the user's\
    \ input? Call the method interrupt() on such a thread. Killing a thread by interrupting\
    \ it may be the only technique you need to use in such cases."
