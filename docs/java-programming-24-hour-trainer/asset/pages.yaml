  md: '# # 30


    # ## Introducing JMS and MOM


    People send messages to each other via e-mail, instant messages, Twitter, Facebook,
    and so on.

    People can also communicate using more traditional methods such as the post. You
    just need to drop a letter in a mailbox, and the rest will be taken care of by
    postal service providers and logistics companies such as USPS, FedEx, UPS, and
    DHL.


    Applications can send messages to each other using message-oriented middleware
    (MOM), which plays a role similar to that of the delivery services. A program
    "drops the message" into a message queue (think mailbox) using the Java Messaging
    Service (JMS) API, and the message is delivered to another application that reads
    messages off of this queue.


    Although JMS is a part of the Java EE specification, you can use it with Java
    SE applications without needing to have any Java application server — just like
    sax containing JMS classes available to your program. In this lesson you''ll learn
    how to write simple Java clients to send and receive applications with the JMS
    API via a MOM provider. In Lesson 31 I''ll show you how to bring a Java EE application
    server to the messaging architecture, and why it''s beneficial. Finally, in Lesson
    32 you''ll learn about to bring message-driven beans to the table.


    # ## MESSAGING CONCEPTS AND TERMINOLOGY


    You have already learned several methods of data exchange in distributed Java
    applications — direct socket communication, RMI, and HTTP-based interactions.
    All of them were based on remote procedure calls (RPC) or the request/response
    model. MOM enables you to build distributed systems that communicate asynchronously.


    JMS is an API for working with MOM. JMS itself isn''t the transport for messages.
    JMS is to MOM what JDBC is to a relational DBMS. Java applications can use the
    same JMS classes with any MOM provider. Here''s a list of some popular MOM software:


    +   - WebSphere MQ (IBM)

    - EMS (Tibco Software)'
