    \ implement the Payable interface. You'll have a chance to see this error for\
    \ yourself in the Try Section.\n\n# INTERFACES VERSUS ABSTRACT CLASSES\n\nThe\
    \ next question is when you should use interfaces and when should you use abstract\
    \ classes. If two or more classes have lots of common functionality, but some\
    \ methods be implemented differently, you can create a common ancestor and many\
    \ subclasses inheriting this behavior as needed. Declare in the superclass as\
    \ abstract those methods that subclasses implement differently, and implement\
    \ them in subclasses.\n\nIf classes don't have common functionality but need to\
    \ exhibit some common behavior, do not create a common ancestor, but have them\
    \ implement an interface that declares the required behavior. This scenario was\
    \ not presented in the \"Interfaces\" section of Lesson 6, but it's going to be\
    \ a part of the hands-on exercise in the Try It section of this lesson.\n\nInterfaces\
    \ and abstract classes are similar in that they ensure that required methods will\
    \ be implemented according to required signatures. They differ in how the program\
    \ is designed. While abstract classes require you to provide only a common ancestor\
    \ for the classes, interfaces don't.\n\nInterfaces could be your only option if\
