  md: '# LESSON 26 JAVA EE 6 OVERVIEW


    Two of the acronyms in this list have not been spelled out in this book. CDI stands
    for Context and Dependency Injection and JAX-RS is Java API for RESTful Web Services.
    You may feel overwhelmed with all these terms, I''ll try to explain them in easy-to-understand
    language.


    # PROFILES AND PRUNING


    Although Java EE 6 offers a full stack of server technologies, most of the real-world
    applications don''t need all of them. In the past, to get Java EE certified, a
    vendor of an application server had to implement all EJBs listed in the Java EE
    specification. But most of the applications don''t use all technologies included
    in full Java EE. This is how the concept of a profile about. A profile is a preconfigured
    subset of Java technologies geared toward solving a specific type of application.
    Currently, beside the Full Profile, there is the Web Profile, which is designed
    specifically for the development of web applications. Profiles include JSF, JSP,
    CDI, EJB Lite, JPA, JTA, Interceptors, Managed Beans, and Bean validation.


    In the new profiles may be created to address specific needs of developers. For
    example, chances are that a new profile will be created for developers for small
    devices. The mechanism of lightweight profiles should encourage vendors of web
