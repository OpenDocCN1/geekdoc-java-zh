- img_proc: true
  md: 'Q: What access level do you need to specify to ensure that only classes from
    the same directory can access the directory?


    A: You do not need to specify any access level. In this case, Java will use the
    default package access level, which will guarantee visibility only to the classes
    located in the same directory (package).


    Q: What''s the use of JNDI?


    A: JNDI is a Java API for name and directory servers. It is used for finding Java
    objects by a name in a distributed application. For example, you can use JNDI
    to get a reference to a DataSource or JMS objects.


    Q: Do you have to invoke a method that reads a file inside the try/catch?


    A: You have to put it in the try/catch block or declare that the calling method
    may throw an exception, for example:


    ```

    void method() throws IOException(...)

    ```


    Q: If you need to catch more than one exception (such as FileNotFoundException
    and IOException), does the order of the catch statements matter?


    A: Yes, it does. FileNotFoundException is inherited from IOException. The exception
    classes have to be caught first.


    Q: Explain in the data workflow between a web page and a Servlet what FindBooks
    after after the user presses Submit. In this question interviewers can replace
    the web page and Servlet with any other client-server components. The main point
    is to find out if the job applicant understands the entire-to-end data flow.


    A: The browser connects to the server at the specified URL, and if FindBooks has
    not been yet, the Servlet container will start it, invoking the servlet''s init()
    method followed by the service() method, which in turn calls doGet() or doPost(),
    depending on the type of HTTP request. The objects are HttpServletRequest and
    HttpServletResponse are used for the interaction between the client and FindBooks.
    The Servlet''s output can be sent back to the user by any of the methods of HttpServletResponse,
    for example println().


    Q: Explain the process of getting data from a database table in a Java SE program
    using JDBC. Which classes and methods have to be used?


    A: First load the appropriate JDBC driver using Class.forName(). Then you get
    the Connection object using DriverManager.getConnection(). Then create a Statement
    object and invoke one of its methods, like executeQuery() or executeUpdate().
    Process the ResultSet, if any, and close the Connection, Statement, and ResultSet
    objects.


    Q: What are the differences between Java keywords final, finalize, and finally?


    A: Depending on its position, the keyword final means either that the variable
    is initialized only once, or that you cannot override a method, or that you cannot
    subclass a class.


    The method finalize(), if defined in your class, is invoked by the garbage collector
    when it''s ready to release a memory used by the instance of your class.'
