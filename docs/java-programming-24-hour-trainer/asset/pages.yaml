    You can also use asynchronous methods if a client needs to start more than one
    method on the EJB to run in parallel threads. The methods don''t need to return
    values; say one is generating large PDF files and the others prepares shipments
    based on today''s orders. In this case you don''t need to process returned values;
    just declare the methods as asynchronous and invoke them from the client. They
    start immediately and run in parallel.


    # STATEFUL SESSION BEANS


    Although stateless session beans are given to the client just for the time method
    execution takes, stateless beans are allocated to the client for longer. They
    remember the results of the execution of previous method(s). For example, you
    can use a stateful bean to implement shopping cart functionality, allowing the
    user to add more than one item to the cart while browsing the company''s catalog.
    When the client ends the session bean can be allocated to another client.


    Suppose you have a stateful EJB called MyShoppingCart. The client looks up this
    bean using JNDI and makes the first call to the method addItem(). Then the client
    continues browsing and adds another item to the shopping cart. The client decides
    to check out and calls the method placeOrder(). All method invocations are on
    the same instance of the stateful bean MyShoppingCart.


    ```

    MyShoppingCart myCart = (MyShoppingCart)

    ctx.lookup("java:global/OnlineStore/MyShop*");

