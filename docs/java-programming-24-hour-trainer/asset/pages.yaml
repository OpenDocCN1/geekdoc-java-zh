  md: '# # CREATING A JSF WEBSITE


    The content of the baking student will have to be populated from the UI. With
    JSF you can either select the components that you want to put on each web page
    à la carte, or use a more structured and efficient approach templating. I''ll
    explain the creation of JSF sites with templating.


    # ## Templating


    The layout of most websites is similar: Each was taken into consideration by the
    designers of headers, left and/or right sidebars, and content areas. For example,
    you can define one template for a site that contains a header and a footer, and
    just change the views displayed in the content area based on the user''s actions.
    This is what templating-is all about.


    You start developing the website by creating an .xhtml file containing the main
    layout, and then add a number of views, or composition pages. Each of these composition
    pages will declare what it needs to define the required components for the content
    area, and either reuse the headers and footers from the template or override them.
    You''ll find the methodology of creating pages easy to understand when you create
    a sample template and composite page.


    In Eclipse select File -> New XHTML page, and select the default location, the
    WebContent directory. Enter StudentTemplate as the name of the file and click
    Next. Then select New Facelet in the pop-up window shown in Figure 29-2.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_361_0.png)


    Figure 29-2'
  merge: -1
