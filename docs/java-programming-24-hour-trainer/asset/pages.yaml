  md: "# #6\n\n# # Packages, Interfaces, and Encapsulation\n\nIf you want to find\
    \ out if a particular programming language is object-oriented, ask if it supports\
    \ inheritance, encapsulation, and polymorphism. You know by now that Java inheritance,\
    \ which lets you design a class by deriving it from an existing one. This feature\
    \ allows you to reuse existing code without copy-pasting reusable code fragments\
    \ from other classes — the class NJ from Listing 3-5 was designed this way.\n\n\
    In Lessons 6 and 7 you learn what encapsulation means and continue studying coding\
    \ techniques and best practices. While this lesson will show you several short\
    \ code examples illustrating certain programming topics, the next one will bring\
    \ all the pieces you've learned so far together in one larger practical application.\n\
    \n# # JAVA PACKAGES\n\nA decent project can have hundreds of Java classes and\
    \ you need to organize them in packages (think file directories). This will allow\
    \ you to categorize files, control access to your classes (see the section “Access\
    \ Levels” later in this chapter), and avoid potential naming conflicts: If both\
    \ you and your colleague coincidentally decide to call a class until, this won't\
    \ be a problem as long as these classes are located in different packages.\n\n\
    Sometimes you'll be using third-party libraries of Java classes written in a different\
    \ department or even outside your firm. To minimize that that package names be\
    \ the same, it is common to use so-called reverse domain name conventions. For\
    \ example, if you work for a company called acme, which has the website acme.com,\
    \ you can prefix all package names with com.acme. To place a class in a certain\
    \ package, add the package statement at the beginning of the class (it must be\
    \ the first non-comment statement in the class). For example, if the class Tax\
    \ has been developed for the accounting department, you can declare it as follows:\n\
    \n```\npackage com.acme.accounting;\nclass Tax {\n    // the class body goes here\n\
    }\n```"
  merge: -1
