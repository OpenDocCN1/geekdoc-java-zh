  md: '# USING THE DVD ON A MAC


    To install the items from the DVD to your hard drive, follow these steps:


    +   1. Insert the DVD into your computer’s DVD-ROM drive.


    +   2. The DVD icon will appear on your desktop; double-click to open.


    +   3. Double-click the Start button.


    +   4. Read the license agreement and click the Accept button to use the DVD.


    +   5. The DVD interface will appear. Here you can install the programs and run
    the demos.


    Most lessons in the book have a corresponding screencast that illustrates examples
    in the lesson and provides content beyond what is covered in print.


    I recommend using the following steps when reading a lesson:


    +   1. Read the lesson’s text.


    +   2. Watch the DVD and try to repeat all the instructor’s actions on your computer.


    +   3. Read the step-by-step instructions in the lesson’s “Try It” section and
    complete the assignment on your own.


    You can also download all the solutions to the “Try It” sections at the book’s
    website. If you get stuck and don’t know what to do next, visit the p2p forums
    (p2p.wrox.com), locate the forum for the book, and leave a post.


    # TROUBLESHOOTING


    If you have difficulty installing or using any of the materials on the companion
    DVD, try the solutions:


    +   Turn off any antivirus software that you may have running: Installers sometimes
    mimic activity and can make your computer incorrectly believe that it is being
    attacked by a virus. (Be sure to turn the antivirus software back on later.)


    +   Close all running programs: The more programs you’re running, the less memory
    is available to other programs. Installers also typically update files and programs;
    if you keep other programs running, installation may not work properly.


    +   Reference the ReadMe: Please refer to the ReadMe file located at the root
    of the CD-ROM for the latest product information as publication time.


    +   Reboot if necessary: If all else fails, rebooting your machine can often clear
    any conflicts in the system.'
