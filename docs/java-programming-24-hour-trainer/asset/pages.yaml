    \ data types? Open the source code of the ArrayList itself (pressing F3 in Eclipse\
    \ shows the source code of any class or interface, if available). It starts as:\n\
    \n```\npublic class ArrayList<E> extends AbstractList<E>\n    implements List<E>,\
    \ RandomAccess, Cloneable, java.io.Serializable\n```\n\nThis magic <E> after the\
    \ name tells the compiler that type of elements will be stored in this class,\
    \ but which will remain unknown until a concrete instance of ArrayList is created.\
    \ In 15-1 the type parameter <Customer> replaces <E>, and from now on the customers\
    \ will accept only instances of Customer objects.\n\nI'd like to stress that this\
    \ <E> notation is used only during the declaration of the type. The code in Listing\
    \ 15-1 does not include <E>. The compiler replaces <E> with Customer and erases\
    \ the parameterized data type. This process is known as type erasure—it is for\
    \ compatibility with code written in older versions of Java that have no generics.\n\
    \nNow you can simplify the code from Listing 14-2 by removing casting (see Listing\
    \ 15-2). Why? With generics, when the compiler sees a specific type, it automatically\
    \ generates the-code, which performs casting internally! That's why you don't\
    \ even need to cast the data returned by the method get(i) from Object to Customer\
    \ any longer. Besides, you're guaranteed that the customers will have only Customer\
    \ instances.\n\n# LISTING 15-2: Iterating through customers without casting\n\n\
