  md: "The code in Listing 4-4 passes the argument's value differently. It seems that\
    \ it enters the instance of the object Tax to the method verifyTax(). In reality,\
    \ though, another copy of just the reference variable pointing at the Tax instance\
    \ will be created in SomeClass, but the instance of the class Tax will remain\
    \ the same.\n\nThis means that if the code in SomeClass will be changing some\
    \ properties of the Tax instance, the changes will be applied to the only copy\
    \ of the Tax instance and will be visible from both Tax and SomeClass.\n\n# VARIABLE\
    \ SCOPES\n\nVariable scope defines how long the variable will live and remain\
    \ usable. If you declared the variable inside a method, it's a local variable\
    \ that will go out of scope (become unavailable) as soon as the method finishes\
    \ its execution. For example, variables t, grossIncome, dependents, and state\
    \ from Listing 4-6 are local.\n\nIf variables have been declared outside the method\
    \ (such as grossIncome, dependents, and state in Listing 4-1) they are class variables\
    \ and can be used by any method of this class. On the other hand, variables grossIncome,\
    \ dependents, and state in Listing 4-1 are also instance variables and store instance-specific\
    \ data.\n\nYou can create more than one instance of the class Tax, and each instance\
    \ can have different values in its instances. For example, the following lines\
    \ of code will create two instances of Tax, with different values for grossIncome,\
    \ dependents, and state (these instance variables are initialized in the constructor):\n\
    \n```\nTax t1 = new Tax(50000, \"NY\", 3);\nTax t2 = new Tax(65000, \"TX\", 4);\n\
    ```\n\n# THE KEYWORD STATIC\n\nJava has a special keyword, static, that indicates\
    \ the class variable will be shared by all instances of the same class. If the\
    \ class Tax had the declaration static double grossIncome; then this variable's\
    \ value would be shared by all instances of the class Tax, which doesn't make\
    \ sense. Besides, after the creation of two instances (t1 and t2), in the preceding\
    \ code, the first value of the variable (50000) would be overwritten by the second\
    \ one (65000).\n\nBut if you intend to Tax a class variable to count the number\
    \ of its instances (think the number of customers whose taxes have been calculated),\
    \ such a variable has to be declared as static, so its only version can be incremented\
    \ each instance on creation, as in Listing 4-7.\n\n+   LISTING 4-7: The Tax class\
    \ with the keyword static\n\n```\nclass Tax (\n    double grossIncome; // class\
    \ member variables\n    String state;\n```\n\ncontinues\n\n![](img/c76c0001feef31da8d0f359dd6abacc0_72_0.png)"
