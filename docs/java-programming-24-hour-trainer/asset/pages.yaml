  md: "# THE KEYWORD SUPER\n\nIf a method is overridden in a subclass, there are two\
    \ versions of the method with the same signature. If you just call a method by\
    \ name, e.g. calcTax() in the class MJTax from Lesson 3, the JVM will call the\
    \ overridden version of the method. Once in a while you may need to call the ancestor's\
    \ version of the method. The keyword super enables you to explicitly call the\
    \ method or a constructor from the ancestor's class, for example super.calcTax().\n\
    \nIf one class is inherited from another, each of them may have its own constructor\
    \ explicitly defined. With any other class, the constructor of a subclass can\
    \ override the constructor of a superclass. But sometimes you may need to add\
    \ to the subclass's some functionality that has to be called after the ancestor's\
    \ constructor code. In this case just add the explicit call to the constructor\
    \ of a superclass, as shown in Listing 4-2. Invocation of the constructor of the\
    \ superclass must be the first line in the constructor.\n\n# LISTING 4-2: Calling\
    \ the constructor of the ancestor\n\n```\nclass SmallerTax extends Tax{\n    //\
    \ Constructor\n    SmallerTax(double gi, String st, int depen){\n        super(gi,\
    \ st, depen);\n        System.out.println(\"Applying special tax rates for my\
    \ friends.\");\n    }\n}\n```\n\n# THE KEYWORD THIS\n\nThe keyword this is useful\
    \ when you need to refer to the instance of the class from its method. Review\
    \ the code of the constructor from Listing 4-1. The names of the constructor's\
    \ arguments are different from the names of the class variables. But the code\
    \ in Listing 4-3 shows how you can use the same variable name, both in the arguments\
    \ and in the class variables. The keyword this helps resolve name conflicts. In\
    \ instruct JVM to use the instance variable grossIncome, use the following-syntax:\n\
    \n```\nthis.grossIncome = 50000;\n```\n\nIf there were only one grossIncome variable\
    \ in the class Tax, you could simply omit the this prefix. But in Listing 4-3\
    \ the absence of this keyword would lead to ambiguity and the instance variable\
    \ would never be initialized.\n\n# LISTING 4-3: Resolving name conflicts with\
    \ the this keyword\n\n```\nclass Tax {\n    double grossIncome; // class member\
    \ variables\n```"
