  md: 'You might think that you could make a simple web page by creating HelloWorld.html
    without all this extra code generation. This is true, as long as your page is
    static and does not use any external dynamically changed data. Remember that HTML
    is not a programming language but a markup language — it cannot even add two and
    two, but JSP can (see Calculator.jsp in Listing 28-1).


    # EMBEDDING JAVA CODE INTO HTML


    JSP defines tags that enable you to embed Java code into an HTML page. When the
    servlet is automatically generated behind the scenes, this Java code will also
    be included and executed as part of this servlet. JSP tags are included in angle
    brackets: for example, the <%= ... %> displays the value of the variable or expression;
    During the servlet generation process performed by the JSP engine, these tags
    will be replaced with the regular Java code. For example, the tag <%=2+2%> will
    be replaced by a JSP container with the following Java statement:


    ```

    out.println(2+2);

    ```


    Listing 28-1 shows the content of the two-plus-two calculator called MyCalculator.jsp.
    BR is an HTML tag for inserting line breaks. Note that Alex, the programmer, had
    to write only the expression inside the JSP tag; the rest was done by Matilda.
    Consider this task separation an example of the designer-developer workflow.


    # LISTING 28-1: MyCalculator.jsp


    ```

    <html>

    <body>

    HTML created by Matilda goes...

    <br>

    You may not know that 2 + 2 is <= 2 + 2%

    <br>

    More HTML created by Matilda goes...

    </body>

    </html>

    ```


    Create a Dynamic Web Project in Eclipse called Lesson 28. It''ll automatically
    create a file index.jsp — Hello World JSP under the WebContent directory with
    the content shown in Figure 28-1. Deploying any JSP is a simple matter of copying
    the JSP file into the document root directory of your JSP container. Of course,
    if your JSPs are part of a multi-file project, most likely you''ll be deploying
    them in a war file, as described in Lesson 27.


    Right-click the name index.jsp and select Run on Server and you''ll see the Hello
    World web page. Make a copy of index.jsp named MyCalculator and replace the content
    in the <body> part with the content from the <body> section from Listing 28-1.
    Run it and you''ll see the web page in Eclipse, as shown in Figure 28-2. The expression
    <%2 + 2%> has been precompiled and replaced with 4. A JSP is nothing more than
    a servlet that is automatically generated from a file containing valid HTML and
    JSP tags.'
