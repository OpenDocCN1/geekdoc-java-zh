  md: "# JAVABEANS\n\nJavaBeans specification defines a bean as a Java class that\
    \ implements the Serializable interface and has a public no-argument constructor,\
    \ private fields, and public setter and getter methods. The similar concept of\
    \ Data Transfer Objects (DTOs) was introduced in Lesson 22 (see Listing 22-2).\
    \ Java beans are used mainly for data storing and exchange. In JSP they are used\
    \ to avoid Java code and HTML (also see the section \"Tag Libraries\" later in\
    \ this lesson); they are also helping to avoid mixing Java and HTML).\n\nThink\
    \ of the MVC pattern in JSP-based web applications. The JSP jongs to the view\
    \ tier, the servlet can play a role of a controller, and the Java bean can represent\
    \ a model. Although you can mix HTML with business logic in scriptlets, declarations,\
    \ and expressions, you should avoid doing this and separate separation from business\
    \ logic and data storage. First, this will allow you to split the work more easily\
    \ between Alex and Matilda, and you'll be able to have more than one presentation\
    \ solution (e.g., a different UI for mobile devices) reusing the same code.\n\n\
    Using beans is the first step in separating processing logic and presentation.\
    \ Listing 28-2 shows an example of a bean, called student.\n\n# LISTING 28-2:\
    \ Student bean\n\n```\nimport java.io.Serializable;\nclass Student implements\
    \ Serializable{\n    private String lastName;\n    private String firstName;\n\
    \    private boolean undergraduate;\n\n    Student() {\n        // constructor's\
    \ code goes here\n    }\n\n    public String getLastName() {\n        return lastName;\n\
    \    }\n    public String getFirstName() {\n        return firstName;\n    }\n\
    \    public void setLastName(String value) {\n        lastName = value;\n    }\n\
    \    public void setFirstName(String value) {\n        firstName = value;\n  \
    \  }\n    public void setUndergraduate(boolean value) {\n        undergraduate\
    \ = value;\n\n```\n\ncontinues"
