  md: '# CREATING THE HELLOWORLD CLASS IN ECLIPSE


    Our Hello project will contain one Java class: HelloWorld from Lesson 1. Select
    File -> New Class and enter HelloWorld in the Name field the pop-up window shown
    in Figure 2-6.


    Then enter com.practical.java.lesson2 in the Package field. This is a new addition
    that was not present in the previous version of HelloWorld.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_48_0.png)


    # JAVA PACKAGES


    Packages in Java are used to organize multi-file projects and for data protection.
    It is not unusual for a project to have hundreds of Java classes. Keeping them
    all in one directory is not a good idea. Hence the files will be located in various
    directories and sub-directories.


    What are the naming conventions for packages? Java developers use reverse-domain
    name conventions. Let''s say you are working on a project called Sales for a company
    called Acme, which has an internet site at acme.com. Then every package name will
    start with the reverse URL of the company, followed by the project name: com.acme.sales.


    All classes that belong to this package would be stored in the following directory
    structure: com/acme/sales.


    If some of the classes are specific to domestic sales, while others are used in
    international sales, you will create two sub-directories: com/acme/sales/domestic
    and com/acme/sales/international.


    While directory names are separated by a forward slash or backslash, the corresponding
    Java packages are separated by periods. Java has a special package, and its declaration
    has to be the first line of the class (program comments don''t count). For example:


    ```

    package com.acme.sales.domestic;

    ```


    Let''s assume that you are working for a company called Practical Java on project
    Lesson2; the name of the package will be com.practical.java.lesson2, which is
    exactly what I''ve entered in the Package field shown in Figure 2-6.


    Besides being used for better organization of Java classes, packages help in controlling
    data access. You learn about this feature in the section "Access Levels" in Lesson
    6.


    FIGURE 2-6'
