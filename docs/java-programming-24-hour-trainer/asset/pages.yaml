  md: '# LESSON 1 INTRODUCING JAVA


    The `main()` method is the starting point of your program. You can write a program
    in Java SE that consists of more than one class, but at least one of them has
    the method main(), otherwise the program won''t start. A Java class can have more
    than one method. For example, the class Employee can have the methods `updateAddress()`,
    `raiseSalary()`, `changeName()`, etc.


    The body of the method `main()` contains the following line:


    ```

    System.out.println("Hello World");

    ```


    The preceding `println()` method is used to print data on the system console (command
    window). Java''s method names are always followed by parentheses.


    System here represents another Java class.


    The dot notation `System.out` means that the variable out is defined inside the
    class System.


    `out.println()` tells you that an object is represented by a variable called out
    and it has a method called `println()`.


    You will be using this dot notation to refer to class methods or variables.


    # Compiling and Running Hello World


    Now you need to compile this program. The `javac` compiler is a part of JDK, so
    open a command window on your PC, change the current directory to c:\PracticalJava\Lesson\
    and try to compile the program:


    ```

    cd PracticalJava\Lesson\njavac HelloWorld.java

    ```


    Oops. I got an error telling that `javac` is not recognized as an internal or
    external command, operable program, or batch file. The OS doesn''t know where
    `javac` is located. You need to add the directory in which the `javac` compiler
    resides to the system variable PATH. In Windows OS, go to Control Panel, click
    the system icon, select the tab Advanced, and click Environment Variables. Edit
    the system variable PATH so it starts with the following: C:\Program Files\Java\jdk1.6.0_19\bin;
    by the name of the directory before modifying the system variable PATH.


    Restart your command window and now the OS should be able to find `javac`. Get
    into the directory where HelloWorld.java is located and repeat the compilation
    command.


    You won''t see any confirmation of a successful compilation, just type `dir` to
    confirm that a new file HelloWorld.class has been created. This proves that your
    program has been successfully compiled.


    If the program has syntax errors, the compiler prints error messages. In this
    case fix the errors, and recompile the program again. You may need to do it more
    than once until the file HelloWorld.class is successfully created.


    Now run the program by typing the command


    ```

    java HelloWorld

    ```'
