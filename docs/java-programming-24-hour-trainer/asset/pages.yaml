  md: "# DATA STREAMS\n\nIf you are expecting to work with a stream of a known data\
    \ structure (e.g., two integers, three floats, and a double) use either DataInputStream\
    \ for reading or DataOutputStream for writing. A method, readInt(), of DataInputStream\
    \ will read the whole integer number (four bytes) at once, and readLong() will\
    \ get you a long number (eight bytes).\n\nThe class DataInputStream is yet another\
    \ filter that can be connected to another stream. Listing 16-6 has an example\
    \ of how you can \"build a pipe\" from the following pieces:\n\nFileInputStream\
    \ BufferedInputStream DataInputStream\n\n```\nLISTING 16-6: UsingDataInputStream\n\
    FileInputStream myfile = new FileInputStream(\"data.dat\");\nBufferedInputStream\
    \ buff = new BufferedInputStream(myfile);\nDataInputStream data = new DataInputStream(buff);\n\
    try {\n int num1 = data.readInt();\n int num2 = data.readInt();\n float num2 =\
    \ data.readFloat();\n float num3 = data.readFloat();\n float num4 = data.readFloat();\n\
    double num5 = data.readDouble();\n} catch (EOFException e) {...}\n```\n\nIn this\
    \ example FileInputStream opens the file myfile.dat for reading, BufferedInputStream\
    \ makes the read more efficient, and DataInputStream extracts from two integers,\
    \ three floats, and a double. The assumption here is that the file.dat contains\
    \ exactly these data types and in the specified order. Such a file could have\
    \ been created with the help of DataOutputStream, which allows you to write Java\
    \ data types to a stream in a portable way. It has a variety of methods to choose\
    \ from: writeInt(), writeByte(), writeFloat(), and so on.\n\n# THE CLASS FILE\n\
    \nThe class File allows you to rename or delete a file, perform an existence check,\
    \ create a directory, and more. If you need this functionality, start by creating\
    \ an instance of this class:\n\n```\nFile myfile = new File(\"abc.txt\");\"\n\
    ```\n\nThis line does not create a file; it creates in memory an instance of the\
    \ class File that's ready to perform its action on the file abc.txt. If you want\
    \ to create a physical file, use the method createNewFile() defined in the class\
    \ File. Here's the list of some methods of the class File:\n\n+   - createFile():\
    \ Creates a new, empty file named according to the file name used during the file\
    \ instantiation. Creates a new file only if a file with this name does not exist.\n\
    - delete(): Deletes a file or directory."
