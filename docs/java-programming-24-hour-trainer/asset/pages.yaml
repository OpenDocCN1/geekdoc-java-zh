  md: '# 19


    # # Processing E-Mails with Java


    People send and receive e-mails using e-mail client programs such as Microsoft
    Outlook and Gmail. Can you write your own program to send and receive e-mails?
    The chances are slim that you''ll need to develop a client to compete with Gmail,
    but enterprise Java applications often need the ability to send or receive e-mails
    in certain conditions.


    For example, an application that processes credit card transactions suspects a
    fraudulent activity and needs to send to the account owner. Such an application
    becomes an e-mail client. A Java application provided by your bank can run on
    your Android smartphone and have an integrated e-mail inbox that accumulates all
    messages sent to you by the bank.


    Another good example involves the forgotten-password functionality. A user clicks
    the Forgot Password? hyperlink and enters a valid e-mail address in a text input
    field. A couple of seconds later an e-mail containing instructions for resetting
    the password arrives in her e-mail inbox. The server-side Java program sends this
    e-mail automatically using JavaMail''s program interface (API).


    In this lesson you''ll learn how to write a Java program that can send e-mails
    reminding about your friends'' birthdays.


    # # PROTOCOLS AND SERVERS


    For e-mail messaging you''ll be using standard protocols: Simple Mail Transfer
    Protocol (SMTP) for sending e-mails and Post Office Protocol (POP) or Internet
    Message Access Protocol (IMAP) for retrieving e-mails. The third version of this
    protocol is called POP3; IMAP is a more advanced alternative to POP3. The format
    of the message body and its attachments, if any, is defined by the Multipurpose
    Internet Mail Extensions (MIME) protocol.


    Some vendors use proprietary protocols for e-mails, but we''ll stick to standards.
    For Java SE, JavaMail API is an optional package that has to be downloaded separately,
    but it is included'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'with Java EE. The API is simple to use — it takes only a few lines of code
    to send an e-mail from a Java program.


    To test a client program that sends e-mails you''ll need to know the hostname
    and port of SMTP server and have an account with the service provider. Typically
    such servers use port 25 or 587 for e-mails encrypted using Transport Layer Security
    (TLS) protocol and port 465 for Secure Sockets Layer (SSL) encryption. Some ISPs
    block these ports.


    Apart from an SMTP server hosted by your ISP, you can use the free public server
    smtp.gmail.com offered by Google. For the parameters of this service refer to
    the Web page: http://mail.google.com/support/bin/answer.hl=en&answer=13287. Yahoo!
    also offers a free SMTP server at smtp.mail.yahoo.com.


    Here''s a word of caution: After you learn how it is to write a Java program that
    sends e-mails, you might have an urge to start sending e-mails to large lists
    of recipients to promote your business or the latest you''ve found online. Unsolicited
    e-mail is called spam, and if you write a program that sends dozens of e-mails
    per minute your ISP will notify it and give you a warning or terminate your Internet
    access.


    # CREATING BIRTHDAY MAILER


    Because I''ll be writing a birthday mail program using Java SE, I need to download
    the jars (libraries) with Java classes. At the time of writing this JavaMail API
    1.4.3 is the latest release, and you can download it from www.oracle.com/technwork/java/index-138643.html.


    Unzip the JavaMail archive — it includes all required jar files, demos, and documentation.
    Create an Eclipse project called Lesson19, right-click the project name, and select
    Properties ➤ Java Build Path. Go to the Libraries tab, click Add External JARs,
    and add malimapi.jar and smtp.jar to the project from the lib directory of the
    extracted archive. These jars contain all the classes from the javax.mail package
    required to send e-mails. If you are using a really old version of Java (prior
    to version 6) you''ll also need to download and add to your project the JavaBeans
    Activation Framework (JAF).


    # Required Supporting Classes


    At a minimum you have to use the following classes to send an e-mail:


    +   - javax.mail.Session: This class knows important characteristics of your environment,
    as the name of the mail server.


    +   - javax.mail.Message: This class represents your message, containing recipients,
    subject, content, and so on.


    +   - javax.mail.internet.InternetAddress: The recipient of your message will
    be represented by this class.


    +   - javax.mail.Transport: This class will pass your message for the delivery
    to a protocol-specific transport.'
