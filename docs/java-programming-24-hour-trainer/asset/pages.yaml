    # USING THE DVD ON A PC


    To access the content from the DVD, follow these steps:


    +   1. Insert the DVD into your computer''s DVD-ROM drive. The license agreement
    appears.


    > The interface won’t launch if you have autorun disabled. In that case Start
    Run (For Windows Vista, Start All Programs Accessories Run). In the dialog box
    that appears, type D:\Start.exe. (Replace D with the proper letter if your DVD
    drive uses a different letter. If you don’t know the letter, see how your CD drive
    is listed under My Computer.) Click OK.


