  md: "# TIMER SERVICE\n\nMany enterprise applications require the use of schedulers\
    \ to perform certain repetitive tasks at certain times. Cron is a widely used\
    \ scheduler for Unix-based applications. Windows also has a task scheduler (Control\
    \ Panel Scheduled Tasks). The open-source Quartz Scheduler is also popular among\
    \ Java developers.\n\nEJB 3.1 includes the @schedule annotation, which takes a\
    \ calendar-based expression so you can create the execution of required functionality\
    \ in your beans. For example, you can create expressions that will invoke some\
    \ business method every second, minute, hour, Monday, weekday mid-night, etc.\n\
    \n```\n@Stateless\npublic class MyStockQuoteFeed {\n    @Schedule(second=\"*\"\
    , minute=\"*\", hour=\"9:30-16\", dayOfWeek=\"Mon-Fri\"\n    public List getQuotes()\
    \ {\n        // The code to connect to price quote feed goes here\n        ...\n\
    \    }\n}\n```\n\nYou can also create timers programmatically using the TimeService\
    \ class and its methods createTimer(), createSingleActionTimer(), createIntervalTimer(),\
    \ and createCalendarTimer().\n\nIn addition to @Schedule and programmatic timers,\
    \ you can configure timers in the deployment-descriptor ej-jar.xml.\n\n# SUMMARY\n\
    \nEJB 3.1 is a powerful solution for creating a scalable, easy-to-develop -deploy,\
    \ and lightweight solution for enterprise applications. Even a small-scale application\
    \ can benefit from EJB 3.1. If your application doesn't need all the features\
    \ mandated by the EJB specification, consider using EJB 3.1 Lite, which is a subset\
    \ of the full specification.\n\nIt's not possible to cover all the features offered\
