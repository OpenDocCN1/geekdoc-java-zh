  md: 'Q: The word stateless is used to describe a session EJB as well as HTTP protocol.
    What''s the meaning of the word stateless in these two cases?


    A: HTTP protocol is page-based, meaning the web browser does not hold the connection
    between requests, but in the case of an EJB, *stateless* means that the session
    bean cannot be used to store the state of a particular client.


    Q: Are Java objects passed by value or by reference?


    A: Objects are passed by reference, but their reference variables are passed by
    value.


    Q: How can a Java client access a message-driven bean?


    A: Java clients don''t access MDBs directly — they just place messages into a
    queue or publish them to topics, and the MDB retrieves them from there.


    # EPILOGUE


    The book is over. Even though it''s rather small in size for the number of the
    covered subjects, I tried to touch on a wide spectrum of topics that most Java
    practitioners have to know. You may still need to do additional research on certain
    subjects, depending on your project needs, but at least now you know where to
    go.


    I really hope that you''ll keep this book handy as a quick reference or for a
    refresher when it''s time to hit the job market. No matter what your motivation
    is, have fun reading — I certainly had fun writing it. You can send thank-you
    notes and suggestions via e-mail to yakovfain@gmail.com. Thank you for reading
    my book!'
  merge: -1
