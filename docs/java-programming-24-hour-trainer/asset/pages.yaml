  md: "# LISTING 17-4: Deserializing Employee from file\n\nimport java.io.*;\nclass\
    \ ClassB {\n\n```\npublic static void main(String[] args) {\n\n    FileInputStream\
    \ fin=null;\n    ObjectInputStream oin=null;\n\n    try {\n        fin = new FileInputStream(\"\
    c:\\practicalJava\\\\Employee.ser\");\n        oin = new ObjectInputStream(fin);\n\
    \n        Employee best = (Employee)oin.readObject();\n    } catch (FileNotFoundException\
    \ cnf) {\n        cnf.printStackTrace();\n    } catch (IOException e) {\n    \
    \    fin.close();\n        oin.close();\n    } catch (IOException e) {\n     \
    \   e.printStackTrace();\n    }\n\n    System.out.println(\"The Employee object\
    \ has been deserialized from \" + \"c:\\practicalJava\\\\Employee.ser\");\n}\n\
    ```\n\nNote that the class that deserializes an object has access to its declaration\
    \ or the ClassNotFoundException will be thrown. During the process of deserialization\
    \ transient variables will be initialized with the default values for their type.\
    \ For example, int variables will have a value of 0.\n\nKeep in mind that class\
    \ variables with longer names produce larger footprints when the object is serialized.\
    \ In time-critical applications this may be important. Imagine a Wall Street trading\
    \ system in which each order is presented as an object, TradeOrder, with 50 properties,\
    \ and you need to send a thousand of these objects over the network using serialization.\
    \ Simply shortening each variable name by one character can reduce the network\
    \ traffic by almost 50 KB! You'll learn how to open the network streams in Lesson\
    \ 18.\n\n# THE INTERFACE EXTERNALIZABLE\n\nContinuing with the example of the\
    \ trade order, the knowledge of the values of all 50 fields from the class TradeOrder\
    \ may be required to support certain functionality of the application, but when\
    \ the program has to send a buy or sell request to the stock exchange, only ten\
    \ properties may be."
