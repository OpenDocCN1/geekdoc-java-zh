  md: "# The PreparedStatement Class | 243\n\n# THE PREPAREDSTATEMENT CLASS\n\nListing\
    \ 22-1 uses the class Statement to create an object capable of executing SQL.\
    \ But this is not the only way to supply SQL to the JDBC API. The class PreparedStatement\
    \ is a subclass of Statement, but it pre-compiles the SQL statement before executing\
    \ it.\n\nWith PreparedStatement you can create SQL with parameters that are dynamically\
    \ passed by the program. Suppose you need to execute the query `SELECT * from\
    \ EMP WHERE empno=...` multiple times, providing the empno values from another.\
    \ If you use the class Statement, the variable sqlQuery will be pre-compiled on\
    \ each iteration of the loop:\n\n```\nfor (int i=0; i<empNumbers.length; i++)\
    \ {\n  sqlQuery=\"SELECT * from Employee WHERE empno=\" + employees[i];\n  stmt.executeQuery(sqlQuery);\n\
    }\n```\n\nThe class PreparedStatement offers a more efficient solution:\n\n```\n\
    PreparedStatement stmt=conn.prepareStatement(\n  \"SELECT * from Employee WHERE\
    \ empno=?\");\"\n```\n\n```\nfor (int i=0;i<empNumbers.length; i++) {\n  // pass\
    \ the array's value that substitutes the question mark\n  stmt.setInt(1,empNumbers[i]);\n\
    \  stmt.setString(2,empNames[i]);\n  stmt.executeQuery(sqlQuery);\n}\n```\n\n\
    In this case XXX() method is compiled only once and parameters are provided by\
    \ the appropriate data type. The SQL statement may have several parameters (question\
    \ marks), and the first argument of the setter allows you to specify each parameter's\
    \ number. For example:\n\n```\nPreparedStatement stmt=conn.prepareStatement(\n\
    \  \"SELECT * from Employee WHERE empno=? and ename=?\");\n```\n\n```\nfor (int\
    \ i=0;i<empNumbers.length; i++) {\n  stmt.setInt(1,empNumbers[i]);\n  stmt.setString(2,empNames[i]);\n\
    \  stmt.executeQuery(sqlQuery);\n}\n```\n\nIf you need to pass a NULL value as\
    \ a parameter use setNull()."
