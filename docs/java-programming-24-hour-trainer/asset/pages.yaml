  md: '# 36 | LESSON 30 INTRODUCING JMS AND MOM


    +   - SonicMQ (Progress Software)

    - ActiveMQ (open source, Apache)

    - Open MQ (open source, Oracle)


    If you place an order to buy some stocks by calling the method placeOrder() on
    a remote machine, that''s an example of a synchronous or blocking call. The calling
    program cant continue until the code in the placeOrder() method is finished or
    has thrown an error.


    With asynchronous communications it is different—you can place an order but don''t
    have to wait for its execution. Similarly, when you drop a letter in a mailbox
    you don''t have to wait for a mail truck. The sample applies to e-mail—press the
    Send button and continue on other things without waiting until your message has
    been received. Recipients of your e-mails also don''t have to be online when you
    send a message; they can read it.


    The process of placing a trading order comes down to putting a Java object that
    describes your order into a certain message queue of your MOM provider. After
    placing an order, the program may continue its execution without waiting until
    the processing of the order is finished. Multiple users can place orders into
    the same queue. Another program (not necessarily Java) would be de-queuing and
    processing messages. Figure 30-1 shows how a trading application can place orders
    (and receive executions) with another application running on a stock engine.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_371_0.png)


    FIGURE 30-1


    To increase the throughput of your messaging-based application, add multiple consumers
    reading messages off of the same queue. You can create a consumer Java program
    that starts multiple threads, each of them de-queuing messages from the same queue.
    In Lesson 32 you''ll see how easy it is to configure multiple consumers using
    message-driven beans.


    After your order has been processed, the appropriate message object will be placed
    into another queue, and if your application is active at that time, it will de-queue
    the message immediately upon its arrival. If your application is not running,
    but you''ve opted for guaranteed delivery (explained later in this lesson), the
    messages will be preserved in the queue by the MOM provider.


    Even if the application in a brokerage company is down when the order execution
    arrives from the stock exchange, it''ll be saved in the MOM server until the receiving
    program is up again.'
