  md: '# INTRODUCTION


    This tutorial can be used by Java developers looking for simple working examples
    that use certain features of the language.


    Accomplished Java developers can also use this book as a refresher while preparing
    for a technical job interview.


    This tutorial can be used by university students who are interested in learning
    from a practitioner who has spent 20-plus years developing enterprise software
    for a living.


    College professors should appreciate the fact that each lesson ends with a “Try
    It” section — a prepaired home assignment for each lesson.


    # WHAT THIS BOOK COVERS


    To be called a Java developer, a person has to know not only the core syntax of
    this programming language, but also the set of server-side technologies called
    Java EE (Enterprise Edition). This book covers both. At the time of this writing,
    the latest version of core Java is 6, and the latest release of Java EE is also
    6.


    Java is a general-purpose language — you can program applets running under control
    of a Web browser, standalone-applications that run independently on the user''s
    computer, and applications that connect to remote servers. Java is used for writing
    applications in mobile devices, cars, or in household appliances.


    The first 25 lessons of this book cover a program that can run on users'' computers.
    The next 12 are about Java EE technologies used for Java programs that run on
    servers. The final lesson is dedicated to the process of getting prepared for
    Java technical job interviews.


    This book doesn’t cover Java programming for mobile devices.


    # HOW THIS BOOK IS STRUCTURED


    This book is a tutorial. Each lesson walks you through how to use certain elements
    and techniques of the Java language or gives an introduction to the server-side
    Java EE technologies. The “Try It” sections serve as continuations of materials
    explained in the lessons. The screenc included in the DVD usually illustrate how
    the author compiles and runs code samples included in the lessons. You can choose
    to read the lesson and then try to run the example on your own, or you can read
    the lesson, watch the video, and then try to run the examples. After this part
    is done, start working on the assignments from the “Try It” section.


    This book contains 33 lessons, which are not formally broken into sections. The
    first 25 lessons cover Java SE topics. Lessons 26 through 34 cover Java EE topics.
    Lessons 35 and 36 introduce to popular third-party frameworks Spring and Hibernate.
    Lesson 37 demonstrates an application that utilizes Java EE technologies. And
    finally, Lesson 38 helps you to get prepared for the technical interview when
    you decide to look for a Java-related job.'
