    # LIGHTWEIGHT DIRECTORY ACCESS PROTOCOL


    LDAP servers are specialized software products that store directory entries in
    hierarchical trees and are highly optimized for reading. This makes them a good
    choice for such directory services as employee lists or phone directories in an
    organization. Directories are mainly read, not changed, and this is where LDAP
    servers shine.


    From the Java perspective you should consider LDAP solutions in mind when a really
    fast lookup of some Java objects is needed, such as with JMS connections, queues,
    or topics. Java developers use the JNDI API to look up and update the entries
    in LDAP. To use the same analogy as in the previous lesson, JNDI is to LDAP servers
    as JDBC is to DBMases.


    These are some popular LDAP servers:


    +   * Oracle Directory Server (Oracle)

    * Microsoft Active Directory (Microsoft)

    * OpenLDAP (open-source, community developed)

    * ApacheDS (open-source, Apache)

    * OpenDS (open-source, Oracle)


    The LDAP directory tree has a root entry, which consists of one or more distinguished
    names (unique identifiers). Typically the top of the hierarchy is an object with
    the prefix o for organization. One level below has the prefix ou for organizational
    unit, cn for common name, and so on. Unlike with other naming services, the search
    string starts from the very lowest hierarchical entry and the root entry has to
    be specified last. Here is an example of a distinguished name that can be used
    in a search:


    ```

    cn=jsmith, ou=accounting, o=oracle.com

    ```


    This example corresponds to the following hierarchy in an LDAP tree:


    ```

    o = oracle.com

    ou = accounting

    cn = jsmith

    ```


    The following code snippet prepares the JNDI properties, connects to the LDAP
    server, and the object called CustomerHome.


    ```

    Hashtable env = new Hashtable();

    env.put(Context.INITIAL_CONTEXT_FACTORY,

    ```'
