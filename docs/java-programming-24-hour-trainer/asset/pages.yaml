  md: "Instead of creating two different methods in these classes, it's better to\
    \ define an interface called, say, Payable that contains the declaration of the\
    \ method increasePay(), and to have both classes implement it, as in Listings\
    \ 6-1, 6-2, and 6-3. Every method declared in the interface automatically becomes\
    \ public.\n\n| LISTING 6-1: Payable interface |\n| public interface Payable {\n\
    \  boolean increasePay(int percent);\n} |\n\n| LISTING 6-2: Class Employee |\n\
    | public class Employee implements Payable {\n  public boolean increasePay(int\
    \ percent)\n  // implement salary raise here\n} |\n\n| LISTING 6-3: Class Contractor\
    \ |\n| public class Contractor implements Payable {\n  public boolean increasePay(int\
    \ percent)\n  // implement hourly rate increase here\n} |\n\nSince both Employee\
    \ and Contractor contain the clause Payable, you must implement the increasePay()\
    \ method in each of the classes, or your code won't compile. Creating classes\
    \ with common interfaces leads to cleaner design of your application and makes\
    \ the code more readable. What's more important is that with the help of interfaces\
    \ you can introduce polymorphic behavior to your program, and this will be illustrated\
    \ in Lesson 7.\n\nBesides method signatures, Java interfaces contain declarations\
    \ of final variables. For example, you can create a final variable in the Payable\
    \ interface for the maximum percentage of pay increase (all variables declared\
    \ in the interface automatically become public static final).\n\n```\nint INCREASE_CAP\
    \ = 20;\n```\n\nSince both the Employee and Contractor classes implement Payable,\
    \ they can both include statements in the implementation of increasePay() to ensure\
    \ that the provided percentage increase is less than INCREASE_CAP. If in the future\
    \ the cap changes, you need to change it in only one place — the Payable interface."
