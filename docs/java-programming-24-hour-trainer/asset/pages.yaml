  md: "# THE RESTFUL WEB SERVICES\n\nAs opposed to SOAP, REST is not a protocol, but\
    \ a lighter-than-SOAP means of building web services, or to be precise, REST is\
    \ an architectural style Dr Roy Fielding identified the REST principles in his\
    \ PhD dissertation. A web service built on REST principles is a RESTful web service.\n\
    \nJava EE 6 specification includes the JAX-RS API for creating RESTful web services.\
    \ Several Java application servers already implement JAX-RS. I'll continue using\
    \ GlassFish v3, which brings the JAX-RS implementation known as Jersey, and you\
    \ won't need to download any additional libraries to run the sample code from\
    \ this lesson. Other popular open-source JAX-RS implementations are Apache Wink\
    \ and JBoss RESTEasy.\n\nREST stands for representational state of transfer. REST\
    \ defines a set of constraints that an application must comply to, and web resources\
    \ that the user may need to work with.\n\nA resource is anything that you can\
    \ access with a hyperlink. Each resource has a uniform identifier (URI), as http://localhost:8080/StockServer\
    \ or http://dice.com/yakovresume.pdf. These URIs represent the state of a stock\
    \ server and Yakov's résumé, respectively.\n\nREST resources have to support standard\
    \ stateless requests. If a typical web application uses only the HTTP methods\
    \ GET for reading the resource and POST for updating it, in the RESTful world\
    \ you can use PUT for resource creation or updates and DELETE for resource removal.\
    \ Web application developers often use both GET and POST for reading data, but\
    \ REST is stricter than\n\n# THE RESTFUL STOCK SERVER\n\nIn this section I'll\
