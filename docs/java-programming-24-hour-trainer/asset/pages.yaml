  md: 'The idea of asynchronous servlets is to minimize the time of thread locking.
    If User A makes a request that takes three seconds on a DBMS server, the container''s
    thread will be given to the request of User B, and when User A''s [User''s] result
    comes back from the DBMS, the container will allocate this (or another) thread
    to return the result to User A. This architecture can substantially increase the
    number of concurrent requests that can be processed on the same server.


    In the past, vendors of servlet containers offered their proprietary solutions
    for asynchronous processing. Jetty implemented its version of reusing thread via
    a concept called continuations, whereby the thread given to a request is suspended
    for the time required for the business logic to complete, and then resumed when
    the server is ready. Apache Tomcat and GlassFish implemented technology based
    on the event-based model called Comet, which by an HTTP connection to the servlet
    container is maintained, and the server pushes to the client via that connection.


    The Servlets 3.0 specification has introduced a standard, Comet-based way of creating
    asynchronous Java EE applications. In doGet() or doPost() you can instantiate
    the object javax.servlet.Async, which creates an asynchronous worker thread and
    doesn''t lock the client''s thread while preserving the client''s request and
    response objects. Asynchronous processing is also out of the scope of this tutorial,
    but you can find a detailed example of programming an asynchronous servlet at
    http://bit.ly/b0iBrc.


