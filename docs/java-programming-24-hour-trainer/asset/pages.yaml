  md: '# 18


    # # Network Programming


    Computers connected to a network can communicate with each other only if they
    agree on the rules of communication, called protocols, that define how to request
    the data, if the data should be sent in pieces, how to acknowledge received data,
    if the connection between two computers should remain open, and so on. TCP/IP,
    UDP/IP, FTP, and HTTP are some examples of network protocols.


    Local area network (LAN) refers to a computer network connecting devices in a
    small area — the same office or house, or a rack. Interconnected computers located
    farther apart or belong to different companies are part of a wide area network
    (WAN). The Internet consists of millions of networks and individual devices. When
    connected networks belong to the same organization it is referred to as an intranet.
    For security reasons are shielded from the rest of the world by special software
    firewalls.


    The World Wide Web (WWW) uses uniform resource locators (URLs) to identify online
    resources. For example, the following URL says that is (or will be generated on
    the fly) a file called training.html located at the remote host known as mycompany.com,
    and that the program should use the HTTP protocol to request this file. It also
    requests that be sent via port 80.


    ```

    www.mycompany.com:80/training.html

    ```


    The must be unique and it is automatically converted to the IP address of the
    physical server by your Internet service provider (ISP), aka your hosting company.
    The IP address is a group of numbers, for example 122.65.98.11. Most of the individuals
    connected to the Internet are getting so-called dynamic (not permanent) IP addresses
    assigned to their home computers, but for a small extra fee you can request a
    static IP address that can be assigned to any server located in your basement,
    office, or garage. In the enterprises, network computers usually get static (permanent)
    IP addresses. For individual use, it''s sufficient to have a dynamically assigned
    IP address as long as your ISP can find your server by resolving a domain name
    to the current IP address.'
