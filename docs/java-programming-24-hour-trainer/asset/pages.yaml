    \ this method does not guarantee that the thread will be stopped. Depending on\
    \ the process that is run by this thread, you could try to close connections or\
    \ open streams, if any, or use the method interrupt().\n\n+   Q: When could a\
    \ Java class be called?\n\n+   A: You call the class if it has a noarg constructor,\
    \ implements the Serializable interface, and has public setter/getter methods\
    \ for its private properties.\n\n+   Q: What are the advantages of using JSP rather\
    \ than Servlets?\n\n+   A: JSP enables you to separate presentation from business\
    \ logic and the resulting web page can be modified by people who do not know Java.\n\
    \n+   Q: Give an example that shows the difference between the use of the operators\
    \ && and &\n\n+   A: In the following code snippet the second expression in the\
    \ if statement will not be evaluated if variable a is null. If a single ampersand\
    \ were used here you'd get a NullPointerException.\n\n```\nString a=null;\nif\
    \ (a==null && a.length()>10) {...}\n```\n\n+   Q: Name some predefined JSP variables.\n\
    \n+   A: request, response, out, session..."
