  md: '# Testing the Database Connection


    In this lesson I''ll be working with the database that was initially created in
    Lesson 22 and reused in Lesson 33. It contains a table called Employee and the
    connection is already configured (see Figure 33-4). This connection uses the Derby
    JDBC driver located in derbyclient.jar. Add this jar, located in glassfish/javadb/lib,
    to the build path of your new Eclipse project.


    Now right-click the database connection Lesson22 in Eclipse and select Properties
    Properties JDBC Connection Properties. Keep the user ID as user and change the
    password to password12. Copy the connection URL (refer to Figure 33-3) to a text
    editor — you''ll need the connection parameters in the next section. You can also
    check the properties of the selected DerbyDB driver by clicking the small button
    with an asterisk on it — copy the name of the JDBC driver class too.


    # Configuring Hibernate with a DBMS


    Now it''s time to add the DBMS-related entries to the file hibernate.cfg.xml.
    You don''t need to create this file from scratch; copy the src folder of one of
    the files that you are using with Hibernate, such as the one located in the folder
    documentation/quickstart/tutorials/basic/src/test/resources. Modify the driver
    class and connection URL with the values from the previous section. Make sure
    that this file doesn''t have a setting to drop and re-create the database schema
    on startup. You won''t need any mapping files because ours will use annotations.


    Every DBMS implements standard SQL plus some additional features meant to give
    it a competitive edge. To deal with these extras Hibernate includes configurable
    dialects that hide the differences


    ![](img/c76c0001feef31da8d0f359dd6abacc0_448_0.png)'
