  md: '# Debugging Java Programs


    I''d like to pause this program right before it enters the while loop, so let''s
    set the breakpoint on the following line:


    ```

    while (i<totalElements)(...)

    ```


    Double-click the gray vertical bar located between the Package and Editor views
    — you should see an image of a little bullet. This is a breakpoint, and if the
    program runs into the code with the set breakpoint, Eclipse IDE will switch to
    Debugger perspective and pause the program, highlighting the line that''s about
    to execute. Figure 5-1 shows how the Debugger may look like this point.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_82_0.png)


