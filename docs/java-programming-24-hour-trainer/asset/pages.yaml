  md: 'If all you need is to send simple e-mails, the benefits of using the Apache
    Commons e-mail library may not be so obvious. But if your program needs to send
    multipart e-mails with attachments, or HTML-formatted e-mails, consider using
    this library. One useful feature of this library is that it gives you the ability
    to specify an alternative recipient for bounced e-mails.


    There is one more community project to consider: Apache Velocity (http://velocity.apache.org/).
    Imagine that you need to write a program that will perform mailing of pre-formatted
    letters, inserting customer-specific information (such as name and address) into
