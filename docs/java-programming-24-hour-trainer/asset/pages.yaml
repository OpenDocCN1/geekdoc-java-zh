  md: "# LESSON 21 DIGGING DEEPER INTO CONCURRENT EXECUTION\n\napplication may spawn\
    \ so many threads that it can take up all the system resources, and if this happens\
    \ the application will stop functioning. In other words, you need to control the\
    \ number of threads allowed for each application.\n\nYou can overcome the first\
    \ shortcoming by using the Callable interface, and the second one by using classes\
    \ from the Executor framework. The Executors spawns the threads from Runnable\
    \ objects, ExecutorService knows how to create Callable threads, and ScheduledExecutorService\
    \ allows you to schedule threads for future execution.\n\nThe utility class ExecutorService\
    \ has static methods that will enable you to create an appropriate executor. In\
    \ particular, its method newFixedThreadPool(5) creates a pool of threads of a\
    \ specified size. For example, Executors.newFixedThreadPool(5) gives an instance\
    \ of ExecutorService that automatically manages a pool of not more than five threads.\
    \ If all five threads are busy when a request to create a new thread comes in,\
    \ it will wait until one of the running threads completes. Using thread pools\
    \ ensures that you can control system resources better.\n\nIf you need to return\
    \ some data on completion, create a class that implements the Callable interface\
    \ and define a method call() that plays the same role as run() in Runnable. In\
    \ this case you will need to create threads differently; the class Won't take\
    \ a Callable object as an argument. The class Executors comes to the rescue: it\
    \ offers a number of static methods that will create a thread from your Callable\
    \ class and return the result of its execution packaged inside the special object\
    \ Future.\n\nThe method call() is defined with a parameterized value (remember\
    \ generics?):\n\n```\npublic interface Callable <V>{\n    call() throws Exception;\n\
    }\n```\n\nAccordingly, if some method needs to create a thread using Callable,\
    \ the code should instantiate the Callable thread with a specific data type in\
    \ place of <V>. For example, the thread Portfolio may return an Integer as a result\
    \ of some processing in its call() method:\n\n```\npublic class Portfolio implements\
    \ Callable<Integer>{\n    public Integer call() {\n        // Perform some actions\n\
    \        return someInteger;\n    }\n}\n```\n\n```\npublic class MarketData implements\
    \ Callable<Integer>{\n    public Integer call() {\n        // Perform some actions\n\
    \        return someInteger;\n    }\n}\n```"
