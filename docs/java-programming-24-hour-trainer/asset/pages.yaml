  md: '# 36


    # Introduction to Hibernate Framework


    In Lesson 33 you got familiar with the Java Persistence API, which is part of
    Java EE 6. But JPA wasn''t created from scratch. It took many ideas from Hibernate
    — an open sourceobject-relational framework started by Gavin King in 2001. Hibernate
    version 3.5 and above support the JPA 2.0 specification.


    The official website of www.hibernate.org, where you can find documentation, code
    samples, and tools. Plenty of books and online articles are published about this
    popular framework. I prefer using SQL and JDBC for all data-related processing,
    but these days knowledge of Hibernate is required in many job postings. That''s
    why I decided to include this brief overview of Hibernate even though it''s not
    a part of the Java specification but a third-party framework.


    If you are going to use Hibernate for work, consider using the Eclipse plug-ins
    available at www.hibernate.org/subprojects/tools.html.


    # THE BIG PICTURE


    The main idea behind any ORM framework is to replace writing SQL with manipulating
    the objects. In the Java world, this means putting a layer on top of JDBC that
    will enable you to simply create a POJO, assign values to its fields, and tell
    it "Persist yourself in the database." This is what Hibernate for.


    Proponents of this approach argue that removing the dependency on vendor-specific
    SQL syntax provides easy switching from one DBMS to another without the need to
    modify the Java code responsible for querying and persisting data. Me this doesn''t
    sound like a compelling reason to move away from SQL, because it''s very seldom
    that you need to switch from one'
  merge: -1
  pgno: 446
- img_proc: true
  md: '# LESSON 36 INTRODUCTION TO HIBERNATE FRAME


    DBMS to another in real-world projects. Besides, if you''ll be working on projects
    that require swift execution, the ability to tune SQL manually and use tricks
    specific to DBMSes will be helpful.


    On the other hand, Hibernate has such goodies as lazy loading and the ability
    to easily configure the in-memory cache to greatly minimize disk access, which
    is a lot slower than memory access.


    Lazy loading is easy to explain with an example. Suppose the user is presented
    with a list of customers, each of which may have multiple orders. With lazy loading
    only the list of customers is initially loaded, and only when the user selects
    a customer will the query to retrieve the corresponding orders be sent to data
    store.


    The process of retrieving data with Hibernate is very similar to what you saw
    in Lesson 30. You create the mapping of entities to database tables, then you
    instantiate the Configuration object needed to create a SessionFactory and Session.
    After this is done you execute queries on these entities using Hibernate Query
    Language (HQL), Criteria queries, or native SQL.


    The rest of this lesson is a step-by-step walkthrough that demonstrates how to
    write a simple application that will get the data from a DBMS using Hibernate.


    # INSTALLING AND CONFIGURING HIBERNATE


    In this section you will download jars and configure the configuration file hibernate.cfg.xml.
    I''ll continue using Derby, which is included with GlassFish, as our sample DBMS,
    but the application server GlassFish is not needed. The idea is to look at Hibernate
    as an alternative persistence solution that doesn''t require the EE application
    server.


    Hibernate is an open-source framework hosted on the web at SourceForge (http://sourceforge.net/projects/hibernate/files/hibernate3/).
    At the time of this writing, the latest release of Hibernate is 3.6; you will
    need to download the hibernate-distribution-3.6.0.Final-dist.zip. This distribution
    includes required jar files, a well-written reference manual, and a folder with
    libraries that might be used to support memory caching.


    # Adding Hibernate to an Eclipse Project


    Now create a new Eclipse project Lesson36 by selecting File New > Other > Java
    Project. Note that this is a SE project - I''m not going to use any Java EE application
    server. Make sure your Eclipse project folder contains hibernate3.jar, all the
    jars from the required folder, and the jar from thejpa folder. There is one more
    logging-related file, sl4j-1.6.1.zip, that for some licensing reason has to be
    downloaded from www.slf4j.org/download.html. You need to add the build path of
    one file from them: sl4j-simple-1.6.1.jar.


    You can add these external jars in the tab Libraries of the Java Setting window
    while you''re creating the project, or add them after the project is created via
    Properties > Java Build Path > External Jars. Figure 36-1 shows which libraries
    are included in the build path of my Eclipse project.'
