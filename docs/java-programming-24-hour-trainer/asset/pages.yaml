  md: '# ABOUT THE AUTHOR


    YAKOV FAIN works as a software engineer that specializes in web applications.
    He has worked on many projects, including San Monolith. He has been awarded My
    Fame with the title of Java Champion, which has been granted to only a group of
    100 people in the world. He made the first Java framework: Yakov''s Version 11


    > In memory of my friend, Felix Rubinchik.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_8_0.png)


    # ABOUT THE TECHNICAL EDITOR


    ELLIOT RUSTY HAROLD is originally from New Orleans, in which he returns periodically
    in search of a decent bowl of gumbo. He currently resides in the Prospect Heights
    neighborhood of Brooklyn with his wife, Dot, and their son Marjorie. He is the
    author of numerous books including Refactoring HTML, Java Network Programming,
    Java IDS, and Promoting XML with Java. His open source projects include the NoML
    Library for processing XML with Java and the Aster media please.'
