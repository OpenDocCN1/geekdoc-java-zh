  md: "# Stateless Session Beans | 363\n\nAn EJB container creates and maintains pools\
    \ of session beans. The instances of the stateless beans are allocated to clients\
    \ for much less time than stateful ones. Therefore, if you are working on a multiuser\
    \ application with hundreds or thousands of concurrent requests to the EJB bean\
    \ container, stateless beans offer a much more scalable solution, because a smaller\
    \ pool can serve more users' requests.\n\nEven with stateful session the EJB container\
    \ is playing smart, and those instances sitting in memory without active interaction\
    \ with the client are being passivated — removed from memory and stored on the\
    \ disk. When the client issues another request to a stateful bean that has been\
    \ passed, the container will activate it again.\n\n# STATLESS SESSION BEANS\n\n\
    I'll introduce you to stateless session beans by creating a simple example featuring\
    \ an EJB that contains the business logic to return the message \"Hello World.\"\
    \n\n# The Bean\n\nHaving a class that just returns \"Hello World\" is an obvious\
    \ case for using a stateless session bean: It'll have only one method and there\
    \ is no state to remember. Listing 32-1 shows you how to program such bean.\n\n\
    +   LISTING 32-1: HelloWorld session bean, take 1\n\n```\n@Stateless\npublic class\
    \ HelloWorldBean {\n    public String sayHello() {\n        return \"Hello World!\"\
    ;\n    }\n}\n```\n\nBasically, you create a POJO and annotate it with one or more\
    \ Java annotations. There are no special interfaces to implement to turn a POJO\
    \ into an EJB. Accordingly there are @Stateful, @MessageDriven, and @Singleton\
    \ annotations to mark other types of session beans. You may use the optional configuration\
    \ file ejb-jar.xml in the application server's directory META-INF to you you specify\
    \ metadata for the EJB, and if you need to change the metadata on a production\
    \ system without recompiling the code, make the changes in ejb-jar.xml — they\
    \ will override the values specified via annotations.\n\n# The Client's View\n\
    \nThe bean shown in Listing 32-1 will run either in the JVM, but the client that\
    \ will invoke the sayHello() method can run either in one (e.g., a servlet or\
    \ another bean) or in standalone Java application or Java EE class deployed in\
    \ another container). Beans may or may not implement interfaces. If HelloWorldBean\
    \ will be used only by clients running in the same JVM, you can mark it with a\
    \ @LocalBean annotation to show it's a no-interface bean."
