  md: "# 4. Add the panel to the top-level container — JFrame — by calling the setContentPane\
    \ () method.\n\n# 5. Set the frame's size and make it visible.\n\nYou can assign\
    \ layout managers to your containers to create pretty sophisticated windows.\n\
    But displaying a window with properly laid-out components is only half of the\
    \ job, because controls should know how to respond to various events, such as\
    \ a click on a button. This lesson covers the basics of displaying UI components;\
    \ the next one is about writing code for responding to events.\n\n# LAYOUT MANAGERS\n\
    \nThe simplest layout manager is FlowLayout, which allocates all components being\
    \ added to the container horizontally with room for the next component, FlowLayout\
    \ uses the next row, and process repeats.\n\n# A Simple Calculator with FlowLayout\n\
    \nThe best way to learn layout management is by trying to use it in practice.\
