  md: "# LISTING 15-1: Using generics in the collection\n\n```\nimport java.util.ArrayList;\n\
    import java.util.ArrayList;\n```\n\n```\npublic class TestGenericCollection {\n\
    \n    public static void main(String[] args) {\n\n        ArrayList<Customer>\
