- img_proc: true
  md: 'Q: What''s the difference between the HTML methods Get and Post?


    A: Get appends parameters to the URL, and the resulting URL is bookmarkable. Post
    allows the sending of objects as well as text data, while Get works with text
    only.


    Q: What''s a cookie? Which Java components create it?


    A: A cookie is an object that represents a name/value pair. Servlets, JSP and
    JSF can create and send cookies to a web browser that stores on the user''s disk
    in a special directory. Cookies help a Servlet identify a user. For example, a
    bank can store your account number in a cookie file on your machine, so you do
    not need to enter it on a log-on screen.


    Q: Can a non-abstract class have both abstract and concrete methods?


    A: No, but only abstract classes have abstract methods.


    Q: Explain the use of Java packages.


    A: Packages offer a way to organize multi-file projects. They also help in resolving
    naming conflicts when different classes have the same names. Package access level
    enables you to protect data from being used by unauthorized classes, permitting
    only the classes from the same package to see each other''s member variables.


    Q: Explain the usage of the transient keyword.


    A: The transient keyword indicates that the value of this member variable does
    not have to be serialized when the class is de-serialized, transient variables
    will be initialized with the default values of the variable data types (such as
    0 for integers).


    Q: What do you know about thread synchronization? Explain the difference between


    ```

    public void synchronized methodName() { ... }


    and


    public void methodName() {

    ...

    synchronized (some_object) { ... }

    }

    ```


    A: The keyword synchronized is used to prevent race conditions when more than
    one thread tries to update state. Synchronized blocks are preferable to synchronized
    methods because they place locks for shorter periods. Before manually synchronizing
    blocks of code you should use one of the collection classes from the package java.util.concurrent
    as a better solution for dealing with race conditions.


    Q: What''s the difference between the methods sleep() and wait()?


    A: The code sleep(1000) puts the thread aside for exactly one second. The code
    wait(1000) makes the thread wait for up to one second. A thread can stop waiting
    earlier if it receives the notify() or notifyAll() call. The method wait() is
    defined in the class Object, but sleep() is defined in the class Thread.'
