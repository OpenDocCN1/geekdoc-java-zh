  md: '# 12


    # Developing a Ping-Pong Game


    The tic-tac-toe game developed in Lesson 11 was a simple one. My goal was to show
    you how to draw and move the basic layout of UI objects and event processing as
    ovals, rectangles, and lines in a window. You''ll also learn how to process keyboard
    events. To add a little fun to these subjects, you''ll be learning all these things
    while creating a ping-pong game. This game will have two players: the user and
    the computer.


    # THE STRATEGY


    Let''s come up with the rules for our version of the ping-pong game:


    +   1. The game lasts until one of the players (the user or the computer) reaches
    a score of 21. The computer''s racket is on the left.


    +   2. The user''s racket movements will be controlled by the mouse.


    +   3. The game score will be displayed at the bottom of the window.


    +   4. A new game starts when a player presses the N key on the keyboard; the
    Q key ends the game; S serves the ball.


    +   5. Only the user can serve the ball; the computer can''t.


    +   6. For one of the players to win a point the ball must go beyond the opponent''s
    racket vertical line when the racket is not blocking the ball.


