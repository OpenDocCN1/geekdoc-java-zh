  md: "# THE CALLABLESTATEMENT CLASS\n\nThis class extends PreparedStatement and is\
    \ used for executing stored procedures from Java. Let's say there is a stored\
    \ procedure entitled changeEmpTitle that takes two parameters: empno and title.\
    \ Here's the code to execute this stored procedure:\n\n```\nCallableStatement\
    \ stmt = conn.prepareCall(\"{call changeEmpTitle(?,?)}\");\nstmt.setInt(1, 7566);\n\
    stmt.setString(2, \"Salesman\");\nstmt.executeUpdate();\n```\n\nIf a stored procedure\
    \ returns values using output parameters, each of the OUT data types has to be\
    \ registered before the statement is executed. The next code snippet you an example\
    \ of executing a stored procedure that has two parameters: The first is an input\
    \ parameter, and the second is an output parameter by which the stored procedure\
    \ can return the result of its execution to the Java program:\n\n```\nCallableStatement\
    \ stmt = conn.prepareCall(\"{call changeEmpTitle(?,?)}\");\nstmt.setInt(1, 7566);\n\
    stmt.registerOutParameter(2, java.sql.Types.VARCHAR);\nstmt.executeQuery();\n\
    String title=stmt.getString(2);\n```\n\n# THE RESULTMETADATA CLASS\n\nJDBC enables\
    \ you to process result sets when the number of returned values is unknown. Imagine\
    \ you need to write a program that can accept any SQL Select statement, execute\
    \ it, and display the retrieved data. With the ResultSetMetaData you can dynamically\
    \ find out how many columns are in the result set, as well as their names and\
    \ data types. The following code fragment gets the number of database table columns\
    \ in the result set and for each of them identifies the column name and type:\n\
    \n```\nString sqlQuery = 'select * from Employee';\nResultSet rs = stmt.executeQuery(query);\n\
    \nResultSetMetaData rsMeta = rs.getMetaData();\nint colCount = rsMeta.getColumnCount();\n\
    \nfor (int i = 1; i <= colCount; i++) {\n    System.out.println(\"Column name:\
    \ \" + rsMeta.getColumnName(i) +\n    + \" Column type: \" + rsMeta.getColumnTypeName(i));\n\
    }\n```\n\nThis simple but powerful technique is used internally by ORM frameworks\
    \ (see Lesson 36) that can \"magically\" generate database models and automatically\
    \ generate Java classes representing database entities."
