    Another convenient for serializing to a byte array is object cloning, which is
    the creation of an exact copy of an object instance. Even though the class object,
    the root of all classes, includes the method clone(), it works only with objects
    that implement the Cloneable marker interface; otherwise cloning will fail. Things
    may get more complicated when an object contains instances of other objects: You
    need to program a deep copy of the object.


    Serialization into a byte array with immediate deserialization creates a deep
