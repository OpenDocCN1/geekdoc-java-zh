  md: 'Q: What''s the usage of the keyword static?


    A: It''s used in declarations of methods and variables to make them available
    without creating an instance of the class. For example, the main() method is a
    static one. If a variable is static, its value is shared by all instances of the
    class.


    Q: How can you force garbage collection?


    A: You can''t force garbage collection, but you can request it, because JVM does
    not guarantee it will be started immediately. Invoking System.gc() requests Java
    garbage collection.


    Q: Explain the usage of event adapters.


    A: Some Swing event listener interfaces declare multiple methods (for example,
    WindowListener has seven methods) and a class must implement all of them. Adapters
    already have all these methods predefined with empty bodies. If a class needs
    to process just one of the WindowListener events, it has to override only the
    corresponding method of WindowAdapter.


    Q: How do you decide if explicit casting is needed?


    A: If you assign a superclass object to a variable of a subclass''s data type,
    you need to use explicit casting. For example:


    ```

    Object a;

    Customer b;

    b = (Customer) a;

    ```


    Java generics eliminate the need for explicit casting. For subclass-to-superclass
    assignments the casting is performed automatically. You can also cast to interfaces
    that a class implements.


    Q: Can you perform casting between objects of different types?


    A: No, you can''t. The objects have a superclass-subclass relationship, or you
    can cast to interfaces implemented by a class.


    Q: Can a Java class be inherited from two classes?


    A: No, Java does not allow multiple inheritance, but a class can implement multiple
    interfaces, which, to some extent, can be used as a workaround.


    Q: Both applets and Servlets are deployed on the server. What''s the difference
    between the runtime environments of applets and Servlets?


    A: Applets run in a JVM on the user''s machine under a web browser, and have security
    restrictions limiting access to a computer''s devices. Servlets run on the server
    side under control of the Servlet container or Java EE Application Server.


    Q: What''s the difference between constructors and regular methods?


    A: Constructors must have the same name as the class and cannot return a value.
    They are invoked only once, while regular methods can be invoked many times.'
