  md: '# 26

    Java EE 6 Overview


    Starting from this lesson you''ll be learning about Java Enterprise Edition (Java
    EE or formerly J2EE), which is a powerful, mature, and widely used platform for
    development of distributed applications. The word enterprise here doesn''t imply
    that it is only for large-scale applications. Java EE components are used for
    the development of everything from an application for a local pizza parlor''s
    website running on a five-hundred-dollar computer to a super-powerful Wall Street
    trading application that runs on a cluster of hundreds of interconnected servers.


    This lesson is an overview of the Java EE architecture, concepts, components,
    and terms that will be covered in detail in the remaining lessons of this book.
    The goal of these lessons is to give you an understanding of how to approach the
    development of Java EE applications by showing how to build small applications
    rather than making you read the thousand-page manuscript that would otherwise
    be required for detailed coverage of this subject.


    There are an abundance of online materials and books published on the subject
    of Java EE, and when you will figure out which components are a good fit for your
    project, finding materials on the selected topic will not be difficult at all.
    My task is to help you in making that decision and getting you started in the
    quickest possible way. The Oracle website Java EE at a Glance is a good complement
    for this lesson: www.oracle.com/technet/java/javaee/index.html.


    If you start browsing the Internet trying to find more information on Java EE,
    you can easily get confused by trying to compare the features of different versions
    of Java EE components. I highly recommend that you stay focused on the features
    of Java EE 6, which is the most current platform and the easiest to use. It was
    released in December 2009.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# THE BIG PICTURE


    Go to your favorite online job search engine and search for job listings with
    the keyword J2EE. Even though J2EE was re-branded into Java EE many years ago,
    recruiters and job agencies keep referring to this platform as J2EE. Here''s one
    of many job descriptions I found on a major Internet job board:


    Title: Java/J2EE Engineer with Core Java, Hibernate


    Skills: J2EE, JMS, Spring, MQ, EJB, J2EE, Servlets, JDK, Core Java, Websphere,
    Junit, log4j, Apache, SQL


    The candidate should know:


    +   * Core Java 6

    * Expertise in EJB, J2EE, Servlets

    * Expertise in Web Services, JAX-WS, JAX-RPC

    * Working knowledge of Hibernate, JDBC, JPA (Oracle)

    * Java Frameworks: JUnit, Log4j

    * Oracle 11, SQL

    * Expertise in Development IDEs: Eclipse/RAD

    * Knowledge of Spring framework

    * WebSphere Application Server v6/7

    * JMS and WebSphere MQ v6/7


    How many items from this list do you recognize after mastering the first 25 lessons
    of this book? You know Core Java 6, JDBC, Eclipse, and SQL. After studying the
    remaining lessons you''ll understand what other skills are required in this ad,
    why they are required, and how they all fit together. You''ll also have technical
    knowledge of many of the buzzwords listed here.


    # JCP, JSR, and Other Acronyms


    The Java community is accustomed to lots of acronyms. Initially these acronyms
    might sound intimidating and confusing, but with little effort they will make
    perfect sense and explain the way the Java ecosystem lives and functions.


    Each version of Java EE includes a set of specifications for various technologies,
    such as Servlets, JavaServer Pages (JSP), Enterprise Java Beans (EJB), and Messaging
    Service (JMS). Each of these specifications has been defined by an organization
    called the Java Community Process (JCP). If a person or group of people decides
    to propose a specification for some future technology, it will create a Java Specification
    Request (JSR) and form a group of experts to work on this specification. JSRs
    are numbered. For example, the specification for Servlets 3.0 was described in
    JSR 315.'
