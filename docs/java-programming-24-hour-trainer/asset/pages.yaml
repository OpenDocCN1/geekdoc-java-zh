  md: '# LESSON 21 DIGGING DEEPER INTO CONCURRENT EXECUTION


    Java 6 has introduced a Deque interface for inserting and removing elements from
    both ends of the queue. The class LinkedBlockingDeque is a concurrent implementation
    of this interface.


    # Collections


    Using concurrent collections is a recommended way of creating thread-safe data
    structures. Such collections include ConcurrentHashMap, ConcurrentSkipListMap,
    ConcurrentSkipListSet, CopyOnWriteArrayList, and CopyOnWriteArray. Java documentation
    describes when to use each of these collections. For example, a CopyOnWriteArrayList
    is preferable to synchronizedArrayList when the expected number of reads and traversals
    is much greater than the number of updates to a list. These collections were written
    to minimize the time when data is locked.


    The utility class java.util.Collections has a number of static methods that create
    thread-safe collections. Their names start with the word synchronized. For example,
    synchronizedList takes a regular List (such as ArrayList) as an argument and makes
    it thread-safe. You can read more about Java collections at http://www.sun.com/java6/docs/notes/guides/collections/index.html.


    Finding a ready-to-use synchronized collection is better than writing synchronized
    blocks on your own — the chances are slim that you will write more efficient synchronization
    code than exists in Java.


    # SWINGWORKER THREAD


    Any Java Swing application spawns a number of threads. At the very minimum it
    runs the main application thread, the one captures system events, and the third
    communicates with the GUI. The application itself may spawn additional threads.
    But if more than one thread will need to update the UI components, the changes
    may not be rendered properly, because Swing components were not made thread-safe
    to minimize the number of locks that hurt performance.


    To avoid this, UI updates shouldn''t be made directly, but rather submitted to
    an event dispatch thread. Swing uses a single-threaded model, which means that
    all UI updates are rendered via a single thread.


    Suppose your GUI application is written with Java Swing, and a click on JButton
    initiates server-side data request that takes about 10 seconds to complete. You
    should never execute long requests in the event dispatch thread. If you do, the
    UI will become frozen, as no updates can be made until the long running process
    releases the lock on the thread. Therefore, you need to start a separate thread
    for such a long process, and when it finishes, the program has to modify the GUI
    via the event dispatch thread.


    For example, if the result of a button click has to update a JTextField, you may
    create a new thread in the button''s actionPerformed() method and from within
    the run() method of this thread, update the text field. This will work...most
    of the time, if there are no conflicts with other threads in your application.


    All UI-related events (such as buttons and window repaints) are placed in a special
    queue, and the object java.awt.EventQueue retrieves from this queue. You should
    direct modification of the UI (the JTextField in our example) to this queue.'
