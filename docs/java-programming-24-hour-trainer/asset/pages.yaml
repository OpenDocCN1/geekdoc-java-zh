  md: '# 37 | LESSON 33 INTRODUCTION TO THE JAVA PERSISTENCE API


    If a Java class marked with the @Entity annotation has no argument constructor
    you can call it an entity. Each entity instance corresponds to a row in a database
    table, as shown here:


    ```

    @Entity

    public class Employee{

    }

    ```


    If you start with an empty database, JPA tools enable you to create database tables
    based on Java entities. You can also map Java entities to the existing database
    tables. Like database tables, Java entities can have one-to-one relationships
    (such as an Employee entity), one-to-many relationships (such as one Customer
    with many Orders), many-to-many relationships (the opposite of one-to-many relationships),
    and many-to-many relationships (for example, a UniversityClass has many enrolled
    Students, but each Student can enroll into multiple classes).


    Every class must define a field containing a unique value, which is the equivalent
    of a primary key in a database table.


    The EntityManager class will deal with objects. Before persisting data you can
    validate the values using the Bean Validation API.


    While JPA provides string-based SQL-like syntax for working with entities, the
    newer Criteria API allows you to dynamically construct queries from typed objects.


    # MAPPING OBJECTS TO DATABASE TABLES


    You can map Java classes to database tables via annotations, XML configuration
    files, or both. For example, common fields can be mapped with annotations, and
    DBMS-specific mapping can be in XML files. It does not have to be one-to-one mapping;
    one Java entity can be mapped to a set of columns from more than one database
    table.


    Besides having fields mapped to table classes, Java entities can have embeddable
    classes, like Address in the Employee entity.


    Typically a database table has a primary key — one or more columns that uniquely
    identify each row. Java entities must have one or more fields making each instance
    unique. An entity ID can be marked with the @Id annotation, and you can request
    your JPA provider to auto-generate the ID by using the annotation @GeneratedValue
    Value. Listing 33-1 shows an example of an Employee entity.


    # LISTING 33-1: Employee entity


    ![](img/c76c0001feef31da8d0f359dd6abacc0_411_0.png)


    ```

    @Entity

    public class Employee{


    @Id

    @GeneratedValue(strategy=GenerationType.IDENTITY)


    @NotNull

    @Size(max=10)

    }

    ```'
