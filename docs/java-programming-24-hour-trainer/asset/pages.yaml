  md: 'default policy file gives all permissions to the code, but you can create your
    own file and supply it either via the command-line parameter or in the code before
    the security manager is set:


    System.setProperty("java.security.policy", "mypolicyfile");


    For a more detailed description of security policy files refers to the documentation
    at http://download.oracle.com/java/1.3/docs/guide/security/PolicyFiles.html.


    Java applets can serve as RMI clients, but they don''t need RMI security managers.
    The only restriction on them is that they can connect only to the RMI server running
    on the same host on which they were deployed.


    # Finding Remote Objects


    RMI clients find remote services using a naming or directory service. A naming
    service runs on a known host and port number. The subject of naming and directory
    services will be covered in detail in Lesson 31.


    By now know that an RMI server can start its registry that offers naming services
    for RMI clients. The behavior of the registry is defined by the interface java.rmi.registry.Registry,
    and you saw an example of binding to the registry in the section "Registering
    Remote Objects."


    By default your RMI registry runs on port 1099, unless another port is specified.
    The client wants to invoke methods on a remote object it has a reference to that
    object by looking up the name. The lookup returns to a client reference, aka stub.


    The method lookup () takes the object''s URL as an argument in the following format:


    ```

    rmi://<host_name>:<service_name_port>/<service_name>

    ```


    host_name stands for the name of a computer on the local area network (LAN), or
    the name of a domain name (DNS) on the Internet, service_name_port has to be specified
    only if the naming service is running on a port other than the default. service_name
    stands for the name of the remote object which should be bound to the registry.


    Figure 25-1 illustrates the architecture of an RMI application. In the Try It
    section you''ll implement this architecture for our sample quote service.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_314_0.png)


