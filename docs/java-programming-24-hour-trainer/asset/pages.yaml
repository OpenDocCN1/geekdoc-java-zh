    \ in a regular web browser — the output will be like:\n\nI want to keep this well-designed\
    \ header and footer on each page of my student portal that has views with changing\
    \ content in the middle. Let's create a new file EnrollStudent.xhtml, but this\
    \ select New Facelets Composition Page in the pop-up window shown in Figure 29-2.\
