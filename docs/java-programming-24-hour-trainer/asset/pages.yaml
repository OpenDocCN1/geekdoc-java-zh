  md: "# LISTING 20-11: Declaring a synchronized method\n\n```\nclass ATMProcessor\
    \ extends Thread {\n    ...\n    synchronized withdrawCash(int accountID, int\
    \ amount) {\n        // Some thread-safe code goes here, i.e. reading from\n \
    \       // a file or a database\n        ...\n        boolean allowTransaction\
    \ = validateWithWithdrawal(accountID, amount);\n\n        if (allowTransaction)\
    \ {\n            updateBalance(accountID, amount, \"Withdraw\");\n        } else\
    \ {\n            System.out.println(\"Not enough money on the account\");\n  \
    \      }\n    }\n}\n```\n\nThe locks should be placed for the shortest possible\
    \ time to avoid slowing down the program: That's why synchronizing short blocks\
    \ of code is preferable to synchronizing whole methods. Listing 20-12 shows how\
    \ to synchronize only the portion of the code that may cause the race condition,\
    \ then locking the entire method withdrawCash().\n\n# LISTING 20-12: Declaring\
    \ a synchronized block\n\n```\nclass ATMProcessor extends Thread {\n    ...\n\
    \    withdrawCash(int accountID, int amount) {\n        // Some thread-safe code\
    \ goes here, i.e. reading from\n        // a file or a database\n\n        synchronized\
    \ (this) {\n            if (allowTransaction) {\n                updateBalance(accountID,\
    \ amount, \"Withdraw\");\n            } else {\n                System.out.println(\"\
    Not enough money on the account\");\n            }\n        }\n    }\n```\n\n\
    When a synchronized block is executed, the section of the code in parentheses\
    \ is locked and can be used by any thread that's locked on the same section of\
    \ the code until the lock is released. Listing 20-12 locks the current instance\
    \ of the class ATMProcessor (represented by this keyword) only for the duration\
    \ of the updateBalance() method, which is a shorter period of time than withdrawCash()\
    \ would take."
