  md: '# LESSON 10 INTRODUCTION TO JAVA APPLETS


    You can place each in the same line, as we did with the tags &lt;title&gt; and
    &lt;/title&gt;, or in separate lines. Open this in your web browser using File
    �� own Open. As shown in Figure 10-1, the bar of the window will read "My First
    Web Page," and the inside you see with the words "My Tic-Tac-Toe game is coming..."


    Earlier versions of the HTML standard included the tag &lt;applet&gt; to incorporate
    Java applets into an HTML page. But as of HTML 4.01 this tag has been deprecated
    and you should use the tag &lt;object&gt; for Internet Explorer or &lt;embed&gt;
    for web browsers. The company behind Java, recommends using &lt;applet&gt; for
    internet-based webs. The main reason is that web browsers are infamous for being
    inconsistent in implementing HTML standards, and it''s safer to use the tried-and-true
    &lt;applet&gt;—or &lt;embed&gt;— to get a predictable result and feel to the web
    pages that host Java applets. An applet is a more controlled environment. You
    can read more about embedding applets with all of these tags at https://download.oracle.com/java/6/techniques/plugin/developer_guide/using_tags.html,
    but in this tutorial I''ll get to the &lt;applet&gt.


    ![](img/c76c0001feef31da8d0f359dd6abacc0_141_0.png)


    FIGURE 10-1


    The deployment options for applets have been extended as of the release of Java
    6. To learn all the options for applet deployment, refer to the document Java
    Rich Internet Applications Deployment Advice, available at http://download.oracle.com/java/6/docs/techniques/jweb/deployment_advice.


    Let''s add the &lt;applet&gt; to the file TicTacToe.html, as shown in Listing
    10-2. With some HTML tags you can specify additional attributes of the &lt;applet&gt;
    tag:


    +   - code: Contains the name of the applet class.


    +   - width: Contains the width in pixels of the rectangular area on the screen
    that will be used by the applet.


    +   - height: Contains the height of the applet to be used.


    +   - archive: Use this attribute to specify the location of the jar if your multi-applet
    has been deployed as one archive file, which can be created with the help of the
    program located in the bin directory of your Java install.


    The &lt;applet&gt; from Listing 10-2 means that a compiled class TicTacToe is
    located in the same directory as TicTacToe.html, and it''ll occupy a screen area
    of 300 pixels by 250 pixels. Note that if an HTML tag doesn''t have nested tags,
    placing a forward slash in front of the closing bracket is a replacement for a
    &lt;/applet&gt; tag.


    But in general, the &lt;applet&gt; tag may have nested elements. In particular,
    if you need to pass parameters to an applet you can do it via the nested element
    &lt;param&gt.'
