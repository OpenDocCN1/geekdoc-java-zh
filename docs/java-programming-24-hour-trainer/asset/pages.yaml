  md: "This question — can the process of serialization be customized so that only\
    \ some of the object properties will be serialized?\n\nThe method writeObject()\
    \ of ObjectOutputStream sends all the object's properties into a stream. If you\
    \ want to have more control over what is being serialized and decrease the footprint\
    \ of your object, implement the Externalizable interface, which is a subclass\
    \ of Serializable.\n\nThis interface defines two methods: readExternal() and writeExternal().\
