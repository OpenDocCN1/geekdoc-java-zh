  md: "# Custom Annotations\n\nvariable). Finally, you have to define your retention\
    \ policy — how long and where this annotation will live. Let's go through an example\
    \ to illustrate all these steps.\n\nSuppose you need to create an annotation that\
    \ will allow the user to mark class methods with a SQL statement to be executed\
    \ during the run time. These classes will be loaded dynamically. The goal is to\
    \ declare your annotation to be used by other Java classes, and to write the annotation\
    \ process that will read these Java classes, identify and parse annotations and\
    \ the values of their parameters, if any, and do whatever is required correctly.\n\
    \nDeclaring annotations is very similar to declaring interfaces, but don't forget\
    \ to add the @ sign at the beginning. I'll name my annotation MyJDBCEExecutor:\n\
    \n```\npublic @interface MyJDBCEExecutor {\n  }\n```\n\nIf metadata is about data,\
    \ then meta-annotations are annotations about annotations. This is not confusing\
    \ as it sounds. To specify where you can add to this newborn annotation, define\
    \ the meta-annotation @Target. The enumeration ElementType defines possible target\
    \ values: METHOD, TYPE, CONSTRUCTOR, FIELD, PARAMETER, PACKAGE, LOCAL, and ANNOTATION_TYPE.\
    \ If you don't use @Target, the annotation can be used anywhere. For example,\
    \ this is how you can allow the use of the annotation only with methods and constructors:\n\
    \n```\nimport java.lang.annotation.*;\n\n@Inherited\n@Documented\n@Target({ ElementType.,\
    \ ElementType.CONSTRUCTOR })\n@@(RetentionPolicy.SOURCE)\npublic @interface MyJDBCEExecutor\
    \ {\n  }\n```\n\nThe retention policy in the preceding snippet is set to SOURCE,\
    \ which means this annotation will be used for processing only during the compilation\
    \ of your program. The other allowed values for retention policy are RUNTIME and\
    \ CLASS.\n\nAnnotations with the CLASS retention policy stay in the compiled class,\
    \ but are not loaded during run time. The CLASS retention policy is used by default\
    \ if a retention policy is not explicitly specified.\n\nAnnotations with the RUNTIME\
    \ retention policy have to be processed by a custom processing tool when the compiled\
    \ code is running.\n\nAnnotations may have parameters. We want to add a single\
    \ parameter that will allow us to specify an SQL statement to be processed. Our\
    \ MyJDBCEexecutor has to be declared as follows (omitting the import statement):\n\
    \n```\n@Target({ ElementType.METHOD, ElementType.CONSTRUCTOR })\n@Retention(RetentionPolicy.SOURCE)\n\
    public @interface MyJDBCEExecutor {\n  String value();\n  }\n```"
