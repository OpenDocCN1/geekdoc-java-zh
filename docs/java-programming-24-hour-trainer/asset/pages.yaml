    # HOW TO KILL A THREAD


    The class Thread has a method, stop(), that was supposed to know how to kill the
    current thread. But it was deprecated many years ago because it could bring some
    of the objects in your program into an inconsistent state caused by improper locking
    and unlocking of the object instances.'
